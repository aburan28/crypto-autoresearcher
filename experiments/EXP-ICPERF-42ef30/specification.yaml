experiment:
  id: EXP-ICPERF-42ef30
  hypothesis_id: H-ICPERF-f08b1e
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-94168f
  version: 1
  title: >-
    Factor-base design by counting: Lambda(V) from (F1, F0) predicted before
    any solver runs and checked against the exhaustive table, the class-aligned
    affine slice measured against a random-slice null and a ker-Tr known-false
    object, the extreme-value enrichment histogram over K = 10^4 slices, and
    the 8x cap tested as a falsifier
  status: draft
  approved_by: null
  approved_at: null
  status_history:
    - status: draft
      at: '2026-09-16'
      by: coordinator
      note: >-
        DESIGNED, NOT APPROVED. Ranked 3 by DEC-20260916-3c0cf5. Approval is
        withheld on two enumerated preconditions, one of which (AP-2) is a
        piece of software that does not exist and that this Coordinator cannot
        supply from a design lane. Designing is not approving (AGENTS.md ECC
        instruction 3).

  approval_preconditions:
    - id: AP-1
      condition: >-
        EXP-ICPERF-2f2e40 has run and its enumerator and tables have been
        INDEPENDENTLY ACCEPTED by a committed Coordinator decision, including
        C-SUM exact on every (cell, side) and C-RECON reproducing
        EV-ICPERF-390707 joint V1.
      why: >-
        Every measured lambda_x in this contract is read off that table. A
        table with a counting defect would make Lambda's prediction agree or
        disagree for reasons that have nothing to do with Y1, and the
        agreement would look like confirmation.
      who_owns_it: BATCH-94168f, EXP-ICPERF-2f2e40, plus a validator round this lane has no identifiers for
    - id: AP-2
      condition: >-
        A GENERALISED WEIL-DESCENT GENERATOR exists under a committed
        experiment tree: it emits the descended S_4 instance for a factor-base
        slice x_i = v0 + sum_j bit_ij u_j with an ARBITRARY F_2-basis (u_j)
        and an arbitrary offset v0, and it reproduces the vendored
        monomial-basis generator's output BYTE-FOR-BYTE on the 60 shipped
        instances when given the monomial basis and v0 = 0. That byte-identity
        check is what makes it a generalisation rather than a second,
        differently-wrong generator.
      why: >-
        Stages 2 and 3 of this contract -- the HEUR-2 arm and therefore the
        entire "the gain is yield-only" clause -- require descended instances
        over a DESIGNED slice, which the vendored Weil_descent.sage cannot
        emit. Without it, this contract can report a yield law and cannot
        report a cost gain.
      who_owns_it: >-
        NOBODY YET. This is the batch's recorded impediment (DEC-20260916-3c0cf5,
        IMP-1). It is also IDEA-20260915-8fe0ef's blocker, so one executor
        task clears two ranked items.
    - id: AP-3
      condition: >-
        An INDEPENDENT 2E-membership test is implemented and validated: given
        P in E(F_q), decide P in 2E WITHOUT evaluating Tr(x_P) + Tr(a) -- e.g.
        by solving 2Q = P for Q in E(F_q), or by checking that the order of P
        divides r -- and agree with the trace criterion on >= 10^4 points per
        curve, with any disagreement reported point by point.
      why: >-
        THE OBVIOUS VERSION OF THE F0 = 0 CONTROL IS A TAUTOLOGY. V' is
        CONSTRUCTED as {x in W : Tr(x) = Tr(a)}, so checking F0 = 0 by
        evaluating Tr(x) tests only that the constructor filters on the
        predicate it was told to filter on. It cannot fail on any working
        implementation and therefore tests nothing about criterion (F2).
        AP-3 is what turns that control into a measurement.
      who_owns_it: an executor task; small, and a prerequisite of the contract's second prediction

  separability_note: >-
    STAGE 1 IS SEPARABLE AND IS THE RECOMMENDED FIRST SUCCESSOR. Stage 1
    (counts, Lambda, the slice search, predicted-versus-measured lambda_x, the
    null and known-false and twist objects, the cap check) needs AP-1 and AP-3
    and NOT AP-2: it invokes no solver and emits no descended instance. Stage
    2 (HEUR-2, c on the designed V) needs AP-2. This contract is NOT split
    into two records here, because splitting it would put the yield law and
    the cost gain in separate contracts and let the yield law be reported as
    a relation-search result on its own, which it is not -- the conversion
    from yield to cost is H-ICPERF-81de5c's L2 and is itself unmeasured.
    A future decision may approve Stage 1 alone once AP-1 and AP-3 are
    discharged; that decision must state, in terms, that a Stage-1-only run
    reports a YIELD COLUMN and no cost gain.

  objective: >-
    Give RQ-ICPERF-94c86e's relation-yield column a closed form that is
    PREDICTED from (F1, F0, r) before any solver runs and CHECKED against an
    exact table, measure what a class-aligned and E-side-enriched factor base
    buys, and test the 8x cap as a falsifier rather than as a caveat.
    Observations only; the executor forms no conclusion.

  disjointness_from_the_concurrent_lane:
    other_lane: BATCH-a33cda (PDP instrument repair)
    statement: >-
      Writes only experiments/EXP-ICPERF-42ef30/. Uses no Groebner engine and
      does not depend on the instrument repair. Its Stage 1 uses no solver at
      all.
    machine_headroom: >-
      NO QUIET-HOST PRECONDITION. Stage 1 is arithmetic; Stage 2's metric is
      CONFLICTS, which is load-invariant. No timing claim is made and no
      wall-clock number may enter a boundary-table cell.

  inputs:
    accepted_enumerator: experiments/EXP-ICPERF-2f2e40/code/ (the ACCEPTED tree, referenced by its recorded sha256 values, copied in and re-hashed)
    accepted_tables: experiments/EXP-ICPERF-2f2e40/runs/<RUN>/tables/
    shipped_instances: inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/ (read-only, for the reconstruction of F1, F0, r, #E)
    generalised_generator: NOT PRESENT -- AP-2. Stage 2 does not run without it and says so.
    engines_named_and_versioned:
      - WDSat @ 61c6ff3, default configuration -- Stage 2 only
    engines_deliberately_absent: no Groebner engine, no other SAT engine; this contract measures a yield, not an engine comparison
    curves:
        - 'y^2 + xy = x^3 + x^2 + 1 over F_{2^n} (a = b = 1, the Trimoska curve)'
        - 'its quadratic twist: a'' with Tr(a'') != Tr(a), same field'
        - 'at least two further binary curves with #E = 2r, coefficients drawn at a recorded seed and #E computed and recorded'
    code: experiments/EXP-ICPERF-42ef30/code/ (to be written)

  admission_rules:
    preamble: >-
        DECLARED AT (cell, V, side) GRANULARITY, and the reason is arithmetic
        rather than stylistic. The DESIGNED slice is chosen precisely to
        MAXIMISE F1, so its table is LARGER than the shipped V's by the
        enrichment factor. Concretely at l = 8: a class-aligned slice gives
        F1 ~ 2^l = 256 and C(258,3) ~ 2.8e6 entries, inside a 4e6 bound; the
        ENRICHED best-of-K slice gives |V'_E| ~ 128*(1 + 4.29/16) ~ 162, so
        F1 ~ 324 and C(326,3) ~ 5.7e6 entries, OUTSIDE it. A rule sized on the
        shipped V's F1 would admit the cell and then watch the designed V's
        table -- the one the experiment is about -- overflow. That is the OBJ-5
        failure of DEC-20260915-d8d413 ("the feasibility rule is declared PER
        CELL while acceptance probability is a function of NODE DEGREE, so every
        cell passes at its root and dies four to six levels down") in this
        contract's own arithmetic, found at design time, and it is why AR-1 runs
        AFTER the slice is selected and BEFORE its table is built.
    rules:
        - id: AR-1
          granularity: '(cell, V, side)'
          pre_pass: >-
            The slice search has already produced the selected V and its exact
            |V_E|; compute F1 and F0 in |V| trace evaluations and then
            C(F1 + 2, 3) (or the mixed count for a non-aligned V).
          admit_if: >-
            the table entry count <= TABLE_MAX_ENTRIES = 4_000_000 AND the
            projected memory (entries * ENTRY_BYTES, ENTRY_BYTES measured and
            recorded on the first built table) <= 3 GiB
          on_refusal: >-
            Record the (cell, V, side) as not_admitted with the measured F1, the
            computed entry count and the binding term. The cell's OTHER slices and
            the LOWER-K enrichment levels are unaffected: the contract then
            reports the enrichment at the largest K whose selected slice IS
            admitted, and says which K that was.
          declared_expectation: >-
            l = 8 enriched slices are EXPECTED to be refused by this rule on the
            numbers above. That is not a failure of the experiment; it means the
            enrichment DECAY prediction (l = 6 to l = 8) may be evaluable only at
            the class-aligned, non-enriched slice at l = 8, and the contract says
            so in that prediction's `unevaluable` list rather than discovering it
            in the reduction.
        - id: AR-2
          granularity: '(cell, V)'
          applies_to: Stage 2 only
          admit_if: AP-2's generator accepts the slice AND a WDSat build sized from the emitted ANF has MAX_ID equal to the ANF-derived value
          on_refusal: Stage 2 not run for that (cell, V); HEUR-2 reported NOT EVALUABLE there with the reason
        - id: AR-3
          granularity: '(curve)'
          pre_pass: compute #E and factor out the cofactor
          admit_if: '#E = 2r with r odd'
          on_refusal: >-
            the curve is not used, and the refusal is recorded with its #E
            factorisation. A curve with cofactor 4 (e.g. a = 0) has a SECONDARY
            Z/2 = 2E/4E deciding G-landing, for which no closed-form x-criterion
            exists in this corpus; writing such a curve into a Lambda row would be
            asserting a count this contract cannot compute.

  controls:
    - id: C-RECON
      kind: reconstruction
      what: >-
        Recompute #E, r, F1 and F0 from the shipped .in files and the curve,
        and compare against IDEA-20260915-3119c9's proposal-time values
        (#E = 32494 / 131174 / 525086; F1/F0 = 14/7, 38/25, 24/39). Then
        compare Lambda-predicted lambda_x against the ACCEPTED TABLE's measured
        lambda_x at each shipped cell, before any designed slice is scored.
      pass: >-
        the (#E, r, F1, F0) values agree exactly; the lambda_x residuals lie
        inside the multiset band (<= 25% at |Fb_E| >= 20, <= 10% at >= 60)
      can_it_fail_on_a_correct_instrument: >-
        The (#E, r, F1, F0) half: yes -- its reference values are UNREVIEWED
        proposal-time numbers from another agent's /tmp script, and this is the
        measurement that converts them into evidence or exposes them. The
        lambda_x half: yes, and a failure there is Y1's first falsifier rather
        than an instrument problem, which is why the residual is reported per
        cell with the offending triples rather than as a pass/fail bit.
    - id: C-KF-KERTR
      kind: known_false
      what: >-
        Build the table for a slice V0 lying inside ker Tr on a curve with
        Tr(a) = 1 (so F1 = 0, Lambda = 0) and count G-target decompositions.
      pass: EXACTLY 0 over every G-target x-coordinate of the cell
      can_it_fail_on_a_correct_instrument: >-
        No -- but it CAN fail on a correct instrument if the SCIENCE is wrong,
        which is the point: a single G-target decomposition here contradicts
        H-SEMBIN-83a856, a record with status `supported`. That is a
        contradiction between validated evidence records and is routed to
        review-breakthrough per AGENTS.md rule 12, not written up as a note.
        It does NOT fire when the experiment finds its signal: the signal is a
        HIGH yield on the designed slice, this object is a DIFFERENT slice
        with predicted zero yield, and the two are independent measurements.
    - id: C-NULL-SLICE
      kind: null_object
      what: >-
        Random NON-aligned affine slices of the same dimension l, same cell,
        same curve, drawn at a recorded seed: >= 50 per cell. Report their
        (F1, F0) pair, their Lambda from the TWO-TERM formula, and their
        measured lambda_x.
      pass: >-
        F1 and F0 both nonzero and comparable in magnitude, and the two-term
        Lambda predicting lambda_x inside the same multiset band
      why_this_is_the_matched_null: >-
        Matched on field, curve, subspace dimension and slice shape; differing
        ONLY in the class alignment, which is the object Y2 is about. This is
        the control that separates "the count is right" from "class alignment
        is what the count is measuring": a non-aligned slice exercises the
        SECOND term F1 * C(F0+1, 2), which a class-aligned slice sets to zero
        and therefore never tests.
      can_it_fail_on_a_correct_instrument: >-
        Yes, and informatively: if the two-term formula predicts aligned
        slices well and non-aligned slices badly, the second term is wrong and
        Y1 is only half right. That failure mode is invisible if only
        class-aligned slices are measured.
    - id: C-TWIST
      kind: nearby_object
      what: >-
        Recompute the count on the quadratic twist E' for the SAME selected
        slice: measure (F1', F0') on E' and compare the two-term Lambda's
        prediction against the twist table's measured lambda_x.
      pass: the residual lies in the multiset band on E' as well
      rejected_formulation_and_why: >-
        A SECOND SELF-DEFEATING FORMULATION FOUND AND REJECTED. The natural
        wording -- "a slice tuned for E must NOT also be tuned for E'", i.e.
        the gain must not transfer -- fails on a CORRECT instrument whenever
        F1' happens to be large, which is an ordinary draw and not a defect;
        IDEA-20260915-3119c9's own text concedes it ("unless F1' happens to be
        large"). A control that fires on an ordinary draw is not a control.
        The retained formulation tests the COUNT on E', which is the claim,
        and reports the transfer of the gain as a MEASUREMENT with no
        pass/fail attached.
    - id: C-TWOPATH
      kind: independence
      what: >-
        Lambda is computed by a code path that never reads the table, and
        lambda_x is read off the table by a path that never computes Lambda.
        The two paths are in separate modules with no shared helper beyond the
        field arithmetic, and the executor's report declares the module
        boundary.
      pass: the declaration is present and the modules do not import each other
      why: >-
        This contract reuses EXP-ICPERF-2f2e40's ACCEPTED enumerator rather
        than writing a third implementation -- which is right, because it has
        been validated -- but that removes the independence C-INDEP gave the
        rank-1 contract. C-TWOPATH restores independence at the level that
        matters here: the prediction and the measurement must not be able to
        agree because they share an implementation.
    - id: C-ENRICH-HIST
      what: >-
        The full |V_E| histogram over K = 10^4 random class-aligned slices per
        cell is reported -- mean, standard deviation, maximum, and the
        upper-tail fraction above mean + 2 s.d. -- not only the selected
        maximum.
      pass: reported per cell
      why: >-
        HEUR-1 is a distributional claim and the maximum alone cannot test it.
        Reporting only the max would make an unusually heavy tail (a genuine
        structural finding) and an unusually lucky draw indistinguishable.
    - id: C-2E-INDEP
      what: >-
        F1 and F0 are measured with the INDEPENDENT 2E-membership test of
        AP-3, and cross-checked against the trace criterion; disagreements are
        reported point by point.
      pass: 0 disagreements over >= 10^4 points per curve, or the disagreeing points listed
      why: see AP-3 -- without this, the F0 = 0 prediction is a tautology of the constructor
    - id: C-MULTISET-EXACT
      what: >-
        Every comparison uses the EXACT counts C(F1+2, 3) and C(F0+1, 2), never
        the asymptotic F^3/6.
      pass: asserted in code and checked by a unit test on small F1, F0
      why: >-
        The multiset correction is a few percent at |Fb_E| >= 60 but about 20%
        at |Fb_E| ~ 20, which is the size of the (15,5) cell's factor base. A
        comparison made with the asymptotic form would show a 20% residual at
        exactly the cell where Y1 is most in doubt, and would attribute it to
        the science.
    - id: C-LOAD
      what: loadavg recorded at every Stage 2 invocation; Stage 1 rows record it too
      pass: reported

  control_self_defeat_audit:
    performed: true
    performed_by: coordinator, BATCH-94168f, 2026-09-16
    standard_applied: DEC-20260915-d8d413, DEFECT-C-MEMO-OFF.
    findings:
      - control: 'F0 = 0 on the class-aligned slice (as written in the source idea)'
        verdict: >-
          SELF-DEFEATING IN THE TAUTOLOGICAL DIRECTION AND REJECTED IN THAT
          FORM. V' is constructed by filtering on Tr(x) = Tr(a); re-checking
          F0 = 0 with the same predicate cannot fail on any working
          constructor and tests nothing about criterion (F2). Replaced by
          C-2E-INDEP, gated on AP-3.
      - control: 'TWIST -- "the gain must not transfer to E''" (as written in the source idea)'
        verdict: >-
          SELF-DEFEATING IN THE FALSE-FAILURE DIRECTION AND REJECTED IN THAT
          FORM. It fires on an ordinary large-F1' draw, which is not a defect.
          Replaced by C-TWIST as a count check with no pass/fail on the
          transfer.
      - control: C-KF-KERTR
        verdict: >-
          Not self-defeating; independent of the signal. Note its escalation
          path: its failure contradicts a `supported` record and goes to
          review-breakthrough, not to a footnote.
      - control: C-NULL-SLICE
        verdict: >-
          Not self-defeating, and it is the ONLY control that exercises the
          second term of Lambda. Without it the class-aligned measurements
          would test a one-term formula and the two-term claim would ride
          along untested.
      - control: C-RECON
        verdict: >-
          Not self-defeating. Its reference values are another agent's
          unreviewed proposal-time numbers and cannot be moved by anything
          this run measures.
      - control: C-TWOPATH
        verdict: >-
          Cannot fail on a correct instrument -- it is a structural assertion
          about the code, checked by inspection -- and is recorded as an
          independence guard rather than counted as evidence.

  independent_variables:
    - cell (n, l)
    - 'factor-base family (shipped / class-aligned / enriched best-of-K / random non-aligned null / ker-Tr known-false)'
    - curve (Trimoska / its twist / two further #E = 2r curves)
    - K, the slice-search budget (10, 10^2, 10^3, 10^4) -- so the enrichment law is tested as a function of K and not at one point
    - stage (1 arithmetic / 2 solver)

  metrics:
    primary:
      - 'per (cell, V, curve): #E, r, F1, F0, |V_E|, orbit-free counts, Lambda(V), PREDICTED lambda_x, MEASURED lambda_x, residual'
      - '|V_E| histogram over K slices per cell: mean, s.d., max, upper-tail fraction, against 2^{l-1}, 2^{l/2-1}, 0.023'
      - 'T_rel gain = [|Fb_E|/Lambda]_shipped / [|Fb_E|/Lambda]_designed per cell, with its two factors (class, enrichment) reported SEPARATELY'
      - enrichment factor (max/mean)^3 as a function of l and of K
      - 'Stage 2: WDSat conflicts per certified-U instance on shipped and designed V, and c = median / 2^{3l} with IQR'
    secondary:
      - table entry counts, ENTRY_BYTES, peak RSS, wall seconds, loadavg
      - admitted / refused (cell, V, side) with the binding term

  heuristic_under_test: 'HEUR-1 and HEUR-2 of H-ICPERF-f08b1e'

  preregistered_prediction:
    quantity: the seven predictions of H-ICPERF-f08b1e, per (cell, V, curve)
    formula: >-
      lambda_x residual <= 25% at |Fb_E| >= 20 and <= 10% at >= 60; F0 = 0
      exactly on the class-aligned slice by the INDEPENDENT test; exactly 0
      G-target decompositions on the ker-Tr slice; max |V'_E| >= 46.6 at
      l = 6, K = 10^4; T_rel gain >= 3 at (17,6) and (19,6) and <= 8
      everywhere; enrichment decay within 25% of the predicted ratio;
      HEUR-2 c within 10%.
    source: >-
      Y1-Y4 of H-ICPERF-f08b1e, with the shipped-cell reference values taken
      from IDEA-20260915-3119c9's proposal-time script, which was written on
      2026-09-15 and cannot be fitted to this run's output -- and which is
      UNREVIEWED and is an input, not a result.
    every_clause_reports_evaluated_flag: >-
      Inherited by reference from EXP-ICPERF-13f001 CH-5. In particular the
      enrichment-decay clause is EXPECTED to carry a nonempty `unevaluable`
      list at l = 8 (see AR-1's declared expectation) and must therefore
      report `holds: null` there rather than a value fitted on l = 6 and 7
      alone.

  scale_relevance:
    tier: toy
    justification: >-
      n <= 25, l <= 8, m = 3, four curves, one host. The COUNT Y1 is exact
      arithmetic at every n and l and does not need scale; what is toy-scaled
      is the CHECK of it, and the design rule's measured gain. The 8x cap is a
      statement about affine slices of dimension l and is not extrapolated.
    correspondence: null

  tail_checks:
    - >-
      HEUR-1's upper tail: the fraction of slices above mean + 2 s.d. against
      0.023 +- 0.005. The enrichment gain is a MAXIMUM statistic, so it is
      governed by the tail and not by the bulk; a binomial-looking bulk with a
      heavy tail would make the gain larger than predicted and is the
      structural finding to look for.
    - >-
      The residual of Lambda against measured lambda_x at the SMALLEST
      |Fb_E| tested, reported separately, because the multiset correction is
      about 20% there and is where Y1 is most likely to be seen to fail for
      the wrong reason.
    - >-
      The single largest measured T_rel gain across all cells, reported
      against the cap of 8 with its two factors separated. A gain above 8 is a
      FALSIFIER of Y4 and must not be reported as a better result.

  replication:
    seeds:
      - 'slice search: 20260916 * 1000 + 100 * n + l, recorded per (cell, K)'
      - 'null non-aligned slices: the same rule offset by a recorded constant'
      - 'additional curves: drawn at a recorded seed, with #E and its factorisation recorded'
    independent_instances: '>= 50 null slices per cell; K up to 10^4 class-aligned slices per cell; 20 certified-U + 20 certified-S per (cell, V) in Stage 2'

  budget:
    enforcement: >-
      Advisory wall-clock estimates; a RESIDENT-SET watchdog on the table
      builder at 3 GiB (the AR-1 bound plus no headroom -- a breach means AR-1
      was computed wrongly and is an instrument defect, reported as one);
      per-invocation timeouts on Stage 2.
    wall_clock_seconds_per_run: 600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_memory_gb_basis: MACHINE PROTECTION. Binding term is the largest admitted table under AR-1 plus process headroom.
    maximum_runs: 1
    maximum_workers: 1
    executor_wall_clock_seconds: null
    executor_wall_clock_seconds_note: >-
      Advisory and null per CLAUDE.md. Order of magnitude for planning only:
      the slice search is K * 2^l trace evaluations (2.6e6 at l = 8,
      K = 10^4); the exhaustive tables are bounded by AR-1 at 4e6 additions
      per (cell, V, side); Stage 2 is minutes of WDSat per cell.

  stopping_rules:
    - C-RECON's (#E, r, F1, F0) half fails - STOP before any designed slice; report both values. The proposal-time inputs are wrong and everything downstream inherits it.
    - C-KF-KERTR finds any G-target decomposition - STOP, preserve the decomposition with its independent verification, and escalate - it contradicts a `supported` record.
    - An (cell, V, side) refused by AR-1 - do not build it; record the refusal with its measured F1 and entry count; continue at a lower K or a different family.
    - AP-2 undischarged at run time - Stage 2 is not run; HEUR-2 and the "gain is yield-only" clause are reported NOT EVALUABLE with that reason. Stage 1 still completes.
    - Executor wall clock reached - stop, keep every completed table, run the reduction, record which stages finished.

  invalidation_rules:
    - results.jsonl absent or unparsable.
    - Any Lambda computed with the asymptotic F^3/6 rather than the exact binomials (C-MULTISET-EXACT).
    - Any F1 or F0 measured only by the trace criterion, with no C-2E-INDEP cross-check.
    - The executor's module declaration showing the Lambda path and the table path sharing anything beyond field arithmetic (C-TWOPATH).
    - A curve used without its #E factorisation recorded, or a cofactor-4 curve used at all (AR-3).
    - Any enrichment number reported without its histogram (C-ENRICH-HIST).
    - manifest.yaml missing code.commit, the inference block, the recorded seeds, the ENTRY_BYTES used by AR-1, or the sha256 provenance of the copied EXP-ICPERF-2f2e40 enumerator.

  success_criterion: >-
    C-RECON reproduces the shipped-cell (#E, r, F1, F0) values or reports an
    exact disagreement; Lambda's predicted lambda_x is reported against the
    table's measured lambda_x with a residual for every admitted
    (cell, V, curve), including at least one non-aligned null slice family
    and the twist; the ker-Tr known-false object is reported; the |V_E|
    histogram is reported per cell with its tail fraction; the T_rel gain is
    reported per cell with its class and enrichment factors separated and
    against the cap; every refused (cell, V, side) carries its measured
    binding quantity; and HEUR-2 is either measured or reported NOT EVALUABLE
    with AP-2 named as the reason.

  falsification_criterion: >-
    Per H-ICPERF-f08b1e falsification_conditions. The executor reports values;
    the Coordinator decides. A refused cell, a watchdog stop, an undischarged
    AP-2 or a solver timeout is an INFRASTRUCTURE OUTCOME and falsifies
    nothing. A measured gain ABOVE the 8x cap is a falsifier of Y4 and is
    reported as one, never as a success.

  required_artifacts:
    - experiments/EXP-ICPERF-42ef30/code/ with a recorded sha256 per file, the copied enumerator's provenance hashes, and the C-TWOPATH module declaration
    - manifest.yaml, results.jsonl, summary.json, environment.json, task-report.md, plan.json, phase_log.txt
    - recon/ - '#E, r, F1, F0 recomputed against the proposal-time values, both numbers on every line'
    - yield_table.json - per (cell, V, curve) - F1, F0, Lambda, predicted lambda_x, measured lambda_x, residual, |Fb_E|, multiset term
