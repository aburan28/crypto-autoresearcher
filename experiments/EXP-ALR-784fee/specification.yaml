experiment:
  id: EXP-ALR-784fee
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-e8e809; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-e8e809
  question_id: RQ-ALR-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact F_p displacement-rank measurement of the ALR chart-wise Sylvester matrix under two
    declared operators at dimensions up to a few hundred, bracketed by a random-matrix null, a Toeplitz
    positive control and a random-polynomial Sylvester third arm
  objective: 'The run reduces one uncertainty: whether the Sylvester matrix underlying the ALR resultant
    and norm detectors admits a compact generator representation, and if so whether that compactness
    belongs to the ALR pair or to Sylvester matrices in general. (i) It builds the chart-wise Sylvester
    matrix at N from 4 to 64 and source count 1 to 4 over two toy primes, forms two declared displacement
    operators, and computes each displacement''s exact rank over F_p by Gaussian elimination with
    no truncation and no tolerance. (ii) It brackets the instrument in the same invocation with a
    random-matrix null that must attain maximal displacement rank in at least 95 percent of thirty
    draws and a Toeplitz positive control that must return at most two, so a run that cannot detect
    structure or that sees it everywhere announces itself before any signal is read. (iii) It adds
    a third arm, the Sylvester matrix of two random polynomials of the same degrees, which is the
    attribution control: any low displacement rank shared with that arm is a property of Sylvester
    matrices and not of the ALR object, and must be reported as such. The run computes no resultant
    value, solves nothing, and prices no algorithm.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: at the tested dimensions, over the
      two tested primes, under the two declared displacement operators, the ALR chart-wise Sylvester
      matrix has the reported displacement ranks, these stand in the reported relation to the random-matrix
      null and to the random-polynomial Sylvester arm, and a generator representation would cost the
      reported number of field elements. What does NOT follow: that any solve, resultant evaluation
      or norm computation becomes faster; that a superfast structured solver applies; that the result
      holds at untested dimensions or under a third displacement operator; that the nN body is avoidable;
      or that any attack, speedup or security consequence exists. In particular a low displacement
      rank shared with the random-polynomial arm supports nothing about the ALR object at all.'
  inputs:
    procedure: 'STAGE 0, operator declaration, one hour, no compute: fix the two displacement operators
      and record them in the contract before any measurement, so neither can be chosen after seeing
      results. STAGE 1, matrix construction, minutes: build the chart-wise Sylvester matrix at each
      (N, n) cell under the R181 conventions over each toy prime. STAGE 2, displacement formation,
      seconds: form Delta and nabla for each matrix. STAGE 3, exact rank, the binding cost, minutes
      at dimension a few hundred: Gaussian elimination over F_p on each displacement. STAGE 4, bracketing
      controls, minutes: thirty random matrices per cell and one Toeplitz matrix per cell, identical
      operators and routine. STAGE 5, attribution arm, minutes: Sylvester matrix of two random polynomials
      of the same degrees, identical treatment. STAGE 6, ordinary rank, minutes: computed alongside
      so the distinction from EV-ALR-001''s full-target-rank observation is explicit. STAGE 7, reporting,
      minutes: per-cell table of both displacement ranks, ordinary rank, all three controls, storage
      ratio, and the growth fit with its residual and an explicit note that a five-point fit is not
      a law.'
    instrument: 'Python 3 with exact modular integer arithmetic and a Gaussian elimination routine
      over F_p written in the experiment, deliberately not any floating-point or SVD-based rank, since
      displacement rank over a finite field has no norm-based meaning. numpy used only for integer
      array bookkeeping, never for rank. Repository modules: harness/toycurve.py for toy fields and
      the R181 chart conventions, harness/runner.py for deterministic seeding, manifests and immutable
      run records. No Sage, no structured-matrix library, no external service.'
    parameters: Target divisor degree N in {4, 8, 16, 32, 64}. Source count n in {1, 2, 4}. Chart
      count in {1, 2}. Matrix dimension d equal to the sum of the two polynomial degrees, up to a
      few hundred. Two displacement operators, down-shift Sylvester type and Stein type. Two toy primes,
      one near 10^5 from the recorded curve families and one near 10^2. Thirty random matrices per
      cell, one Toeplitz control per cell, one random-polynomial Sylvester arm per cell. Total 5 N-values
      times 3 n-values times 2 chart counts times 2 primes = 60 cells, each with four arms.
  controls:
  - Thirty uniformly random matrices of identical dimension per cell, same invocation, same operators,
    same exact rank routine.
  - Toeplitz positive control of identical dimension, which must return displacement rank at most
    two, confirming the instrument detects structure.
  - Both displacement operators reported for every cell, so a favourable operator cannot be selected
    after the fact.
  - Ordinary rank reported alongside displacement rank, so the distinction from EV-ALR-001's full-target-rank
    observation is explicit.
  - Second toy prime per cell, since exact rank over F_p can be characteristic-dependent.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Draw thirty matrices of dimension d with entries independent and uniform
    over the same F_p, apply the IDENTICAL displacement operators and the IDENTICAL exact rank routine
    in the same invocation, and report the resulting distribution. The null must show displacement
    rank equal to the maximum possible for the operator, which for the down-shift displacement is
    d or d minus a small operator-dependent constant, with probability at least 1 - O(1/p). If the
    null does not attain full displacement rank, the operator itself forces deficiency and the measured
    rank is not evidence of structure; the run then reports the forced value instead. A second null
    applies the operators to a matrix known to be Toeplitz, where displacement rank must come out
    at a small constant, confirming the instrument detects structure when it is present.'
  independent_variables:
  - target_divisor_degree_N
  - source_count_n
  - chart_count
  - displacement_operator
  - arm_alr_or_random_matrix_or_toeplitz_or_random_polynomial_sylvester
  metrics:
    primary:
    - displacement_rank_per_operator
    - null_arm_displacement_rank_distribution
    - toeplitz_positive_control_displacement_rank
    - random_polynomial_sylvester_displacement_rank
    secondary:
    - ordinary_rank
    - storage_ratio_2rd_over_d_squared
    - fitted_growth_of_r_against_d_with_residual
    - second_prime_agreement_rate
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exact displacement rank r of the ALR chart-wise Sylvester matrix under each declared
      operator, at each cell, together with the corresponding values for the three control arms.
    formula: 'Displacement rank is defined as rank over F_p of Delta = M - Z M Z-transpose for the
      down-shift operator Z, and of nabla = Z M - M Z for the Stein-type operator, computed by exact
      Gaussian elimination. Predicted controls, asserted rather than predicted: uniformly random M
      gives rank equal to the operator maximum with probability at least 1 - 1/(p-1); Toeplitz M gives
      rank at most 2 under the down-shift operator. Predicted signal: r at most 4 for the ALR matrix
      under the down-shift operator, with the explicit caveat that the random-polynomial Sylvester
      arm is predicted to give a similarly small value, in which case the correct reading is that
      the compactness belongs to the Sylvester construction and not to the ALR pair. Storage ratio
      predicted as 2r/d, falling below 0.1 once d exceeds 20r.'
    source: Pre-registered in the parent proposal IDEA-20260816-e8e809 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Matrix dimensions up to a few hundred over toy primes near 10^5 and 10^2, bounded
      by the requirement to materialise M in full, which is the represented cost the ALR lane exists
      to avoid, so this measurement cannot scale and says so. The transfer assumption, stated and
      not tested: displacement rank of a structured family is typically dimension-independent, so
      a bounded r over the tested range would suggest boundedness beyond it; the entry reports the
      fitted growth with its residual over five points and explicitly declines to call that a law,
      per KN-OPEN-007''s precedent that a tested-range rank result closes only the tested scope.'
    correspondence: null
  tail_checks:
  - Report the full thirty-draw null distribution rather than its minimum, since a null that is not
    sharply concentrated at the operator maximum indicates the operator forces deficiency at that
    shape.
  - Hand-check one small cell's displacement matrix entry by entry, since an index error in forming
    Z M Z-transpose produces plausible ranks at every size.
  - Compare the ALR arm against the random-polynomial Sylvester arm cell by cell rather than in aggregate,
    since attribution is the entry's most likely failure and an aggregate comparison would hide a
    per-cell match.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop increasing dimension at the first cell that exceeds the memory or wall-clock budget and record
    it as an instrument limit, not a mathematical boundary.
  - Abort and report void if the Toeplitz positive control returns a rank above two or the random
    null fails to concentrate at the operator maximum.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both bracketing controls behave as forced, both operators are reported for every
    cell, the random-polynomial Sylvester attribution arm is reported alongside the ALR arm cell by
    cell, and a table of displacement ranks, ordinary ranks, storage ratios and the growth fit with
    its residual is emitted for both primes.
  falsification_criterion:
  - The Toeplitz positive control returns displacement rank above two.
  - The random-matrix null fails to attain the operator maximum in at least 95 percent of draws.
  - The ALR arm's displacement rank lies inside the random-matrix null distribution at every cell.
  - The ALR arm matches the random-polynomial Sylvester arm at every cell, so any compactness is a
    property of Sylvester matrices and not of the ALR pair.
  - The two operators disagree in direction, leaving no operator-independent statement.
  - Ranks disagree between the two primes beyond the reported tolerance.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-e8e809
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The two displacement operators are declared rather than derived from the ALR construction; a Coordinator
    should decide whether an operator adapted to the chart structure ought to be included as a third,
    since operator choice determines the answer.
  - Whether the block structure induced by two charts should be measured as one matrix or as two must
    be ruled on, since the coupling term is exactly where a displacement-rank claim would break.
  - The relationship between this measurement and EV-ALR-001's full-target-rank observation needs
    a Coordinator statement, so that a low displacement rank alongside full ordinary rank is not later
    read as a contradiction between records.
