---
# Frozen Experiment Specification — EXP-MLDSA-2b6f17
# Coordinator: TASK-20260805-bebfbc (BATCH-214d98, GOAL-MLDSA-001)
# Frozen: 2026-08-05
# Status: approved
# ─────────────────────────────────────────────────────────────────────────
# BATCH-003 FIPS 204 body constraint (DEC-20260805-0d59ff):
#   This experiment scopes to academic literature only. The hedged-mode
#   specification and formal proof structure are in KN-LIT-056 and KN-LIT-3907
#   (academic papers). If any analysis step requires FIPS 204 body parameters
#   for exact seed-derivation function specification, record as a blocking
#   constraint, not an experimental result.
# ─────────────────────────────────────────────────────────────────────────
# CANONICAL CORRECTIONS (DEC-20260805-0d59ff):
#   Jendral publication year: 2024 (not 2026)
#   Jendral success probability: 58.2% / 0.582 (not ~53%)
# ─────────────────────────────────────────────────────────────────────────

experiment:
  id: EXP-MLDSA-2b6f17
  hypothesis_id: H-MLDSA-c7b4e8
  # NOTE: H-MLDSA-c7b4e8 is a newly allocated ID (no prior H-MLDSA-* records
  # exist in the ledger). The archival task must create the hypothesis record
  # and confirm no ID collision via tools/allocate_id.py --check.
  version: 1
  title: >-
    Jendral Nonce-Erasure Fault: Formal Proof Coverage for Hedged-Mode
    Randomness Failure in KN-LIT-3907 and Related Proofs
  status: approved
  approved_by: coordinator
  source_proposal: IDEA-20260805-2b6f17
  assigned_to: executor

  objective: >-
    Determine whether the Jendral voltage-glitch attack class (KN-LIT-4f3b80)
    — which erases the per-signing nonce rnd in hedged ML-DSA, exposing the
    commitment y — falls within the adversary models of the existing formal
    security proofs:
    (1) Barbosa et al. ROM/QROM CMA-security proof (KN-LIT-3907);
    (2) Dilithium academic design paper hedged-mode security claim (KN-LIT-056);
    (3) Gupta NTT-twiddle rank-bound proof (KN-LIT-8ce0b5).
    Specifically: does KN-LIT-056 present hedged-mode security as a formal
    theorem or only as an informal operational argument? Does KN-LIT-3907
    explicitly cover hedged-mode nonce-erasure adversaries?
    This is a CORPUS ANALYSIS task. No implementation, no computation.

  # ─────────────────────────────────────────────────────────────
  # INPUTS
  # ─────────────────────────────────────────────────────────────
  inputs:
    primary_sources:
      - id: KN-LIT-4f3b80
        title: "Jendral 2024/238 — voltage-glitch attack on hedged ML-DSA"
        url: "https://eprint.iacr.org/2024/238"
        canonical_year: 2024
        canonical_success_probability: 0.582
        required_sections:
          - "Attack model / Fault model"
          - "Key-extraction mechanism (z - y = c·s₁ step)"
          - "Which signing mode is targeted (hedged vs deterministic)"
        access_note: >-
          Abstract available in KN-LIT-4f3b80.md. Full text required for
          precise attack model. Attempt ePrint URL. Record access status.

      - id: KN-LIT-056
        title: "CRYSTALS-Dilithium TCHES 2018 / ML-DSA"
        url: "https://tches.iacr.org/index.php/TCHES/article/view/839"
        required_sections:
          - "Hedged signing mode specification"
          - "Security claims for hedged mode"
          - "Any formal theorem or informal argument about randomness quality"
        access_note: >-
          KN-LIT-056 full text available at IACR TCHES. Record the nature
          of the hedged-mode security claim: formal theorem with reduction,
          or design justification without formal proof.

      - id: KN-LIT-3907
        file: "downloads/140850158.pdf (local copy per KN-LIT-3907 metadata)"
        access_note: >-
          Full text required. Local PDF listed in KN-LIT-3907.md.
          If PDF is inaccessible, attempt ePrint 2023/916.
          Record access status.
        required_sections:
          - "Signing model / which modes are covered (deterministic vs hedged)"
          - "Whether hedged signing (ρ' = H(ξ || M || rnd)) is within proof scope"
          - "Whether nonce-erasure adversaries are considered"

      - id: KN-LIT-8ce0b5
        url: "https://eprint.iacr.org/2026/1188"
        required_sections:
          - "Stated scope: whether seed-derivation is covered"
          - "Fault model: whether faults on ρ' computation are included"

    fips204_body_constraint: >-
      FIPS 204 standard body not read (DEC-20260805-0d59ff gate-1).
      The exact seed-derivation function specification in FIPS 204 may differ
      from the academic version in KN-LIT-056. Record this as a constraint
      on any claim about FIPS 204 parameters specifically. Analysis is scoped
      to the academic hedged-mode specification in KN-LIT-056.

  # ─────────────────────────────────────────────────────────────
  # METHOD
  # ─────────────────────────────────────────────────────────────
  method:
    type: corpus_analysis
    no_implementation_required: true
    no_computation_required: true
    steps:
      - step: 1
        action: >-
          Read KN-LIT-056 hedged-mode specification and security claim.
          Record: (a) the precise definition of hedged signing
          (ρ' = H(ξ || M || rnd) or equivalent); (b) whether the security
          claim for hedged mode is stated as a formal theorem with a reduction
          to a hard problem, or as an informal design argument ("provides
          protection against weak RNG"); (c) whether KN-LIT-056 explicitly
          addresses adversarially zeroed or fixed rnd.
          Possible outcomes:
            (A) Formal theorem: hedged-mode security has a stated reduction.
            (B) Informal argument: design justification only, no formal proof.
            (C) Not addressed: hedged mode not specifically discussed re. faults.
        records: "KN-LIT-056 hedged-mode security claim: formal or informal"

      - step: 2
        action: >-
          Read KN-LIT-3907 signing model section.
          Record: (a) which signing mode(s) the corrected proof covers
          (deterministic using ξ only, vs. hedged using ρ' = H(ξ || M || rnd));
          (b) whether the proof's CMA signing oracle models nonce-erasure as a
          possible adversary input; (c) whether the proof explicitly discusses
          the hedged vs deterministic distinction in its security claims.
          Possible outcomes:
            (A) Proof covers only deterministic mode.
            (B) Proof explicitly covers hedged mode with nonce-erasure.
            (C) Proof covers hedged mode informally or with caveats.
            (D) Access blocked.
        records: "KN-LIT-3907 signing model: mode coverage and nonce-erasure"

      - step: 3
        action: >-
          Read KN-LIT-8ce0b5 fault model and scope.
          Record whether the stated fault class (NTT twiddle perturbations)
          extends to the seed-derivation step (ρ' computation). The KN-LIT
          abstract states "twiddle-perturbation faults on the forward NTT";
          confirm whether seed-derivation is NTT-adjacent or separate.
          Expected result: seed-derivation is a separate hash computation,
          not NTT arithmetic — hence outside KN-LIT-8ce0b5's scope.
        records: "KN-LIT-8ce0b5 scope: seed-derivation coverage"

      - step: 4
        action: >-
          Read KN-LIT-4f3b80 attack model.
          Record: (a) exactly which computation is faulted (ρ' derivation
          skipped, or ξ exposed, or rnd zeroed?); (b) what the attacker
          gains from a single faulty signature — verify the z - y = c·s₁
          extraction step with the canonical success probability of 0.582
          (Jendral 2024, canonical per DEC-20260805-0d59ff); (c) whether
          the attack requires hedged mode specifically or also applies to
          deterministic mode.
        records: "KN-LIT-4f3b80 attack mechanism: exact fault and extraction"

      - step: 5
        action: >-
          PLACEMENT: Combine Steps 1–4 to produce a placement verdict.
          For each (fault_class, proof_paper) pair:
            Jendral nonce-erasure vs KN-LIT-056: formal or informal coverage?
            Jendral nonce-erasure vs KN-LIT-3907: inside or outside scope?
            Jendral nonce-erasure vs KN-LIT-8ce0b5: inside or outside scope?
          Provide cited justification from the extracted text.
        records: "Jendral placement relative to three proof papers"

  # ─────────────────────────────────────────────────────────────
  # CONTROLS
  # ─────────────────────────────────────────────────────────────
  controls:
    - id: CTRL-1
      description: >-
        POSITIVE CONTROL — DETERMINISTIC MODE COVERAGE: Check whether
        KN-LIT-3907 explicitly covers DETERMINISTIC ML-DSA signing (the
        primary mode: ρ' = H(ξ || M || 0) with rnd = 0 or equivalent).
        KN-LIT-3907 is the paper that fixes the proof for Dilithium, which
        is primarily deterministic. Expected result: deterministic mode is
        within KN-LIT-3907's scope.
        If KN-LIT-3907 does NOT cover deterministic mode, the analysis method
        has an error (or the paper has an unexpected scope).
      controls_for: "Method validity — ensures the placement test correctly
        identifies known in-scope modes"
      expected_placement:
        deterministic_mode_vs_kn_lit_3907: "inside scope (expected)"

    - id: CTRL-2
      description: >-
        SCOPE CAVEAT: The two formal proof papers (KN-LIT-3907 and
        KN-LIT-8ce0b5) may not exhaust all formal proofs of ML-DSA signing
        security. AGENTS.md knowledge retrieval policy §bounds: absence of a
        search result is not evidence that no other proof exists. Any coverage
        gap conclusion must state: "This gap is scoped to the corpus entries
        KN-LIT-3907, KN-LIT-056, and KN-LIT-8ce0b5 and does not claim to
        survey all published formal proofs of hedged ML-DSA signing security."
      controls_for: "Corpus-completeness caveat"

    - id: CTRL-3
      description: >-
        SCHEME BOUNDARY CHECK: Verify that the Jendral attack applies to
        the mathematical scheme (not just one particular implementation on
        Cortex-M4). If the 58.2% success rate is purely due to
        implementation-specific fault-injection success probability (not a
        property of the scheme), then the formal proof coverage question is
        separate from the attack risk (the scheme could be provably secure
        but insecurely implementable). Record which interpretation applies.
      controls_for: "Distinguishes scheme-level from implementation-level
        security questions"

  # ─────────────────────────────────────────────────────────────
  # INDEPENDENT VARIABLES
  # ─────────────────────────────────────────────────────────────
  independent_variables:
    - name: proof_paper
      values: [KN-LIT-056, KN-LIT-3907, KN-LIT-8ce0b5]
    - name: fault_class
      values: [jendral_nonce_erasure_hedged, deterministic_mode_control]

  # ─────────────────────────────────────────────────────────────
  # METRICS
  # ─────────────────────────────────────────────────────────────
  metrics:
    primary:
      - name: hedged_mode_claim_type
        type: categorical
        values: [formal_theorem_with_reduction, informal_design_argument,
                 not_addressed, access_blocked]
        source: KN-LIT-056
        description: "Nature of hedged-mode security claim in KN-LIT-056"
      - name: kn_lit_3907_hedged_coverage
        type: categorical
        values: [explicitly_covered, explicitly_excluded, not_addressed,
                 access_blocked]
        description: "Whether KN-LIT-3907 proof covers hedged-mode nonce-erasure"
      - name: placement_verdict
        type: categorical
        values: [inside_scope, outside_scope, scope_unclear, access_blocked]
        per: [fault_class, proof_paper]
    secondary:
      - name: verbatim_scope_statements
        type: text
        description: >-
          Verbatim or exact-paraphrase extracts from each paper with
          page/section citations.
      - name: attack_mechanism_description
        type: text
        description: "Jendral attack mechanism with canonical values applied"

  # ─────────────────────────────────────────────────────────────
  # PREREGISTERED PREDICTION
  # ─────────────────────────────────────────────────────────────
  preregistered_prediction:
    quantity: "Placement verdict for Jendral nonce-erasure vs three proof sources"
    formula: >-
      Expected:
        KN-LIT-056 hedged-mode claim: informal design argument (not a formal
          theorem with reduction).
        KN-LIT-3907 coverage of hedged-mode nonce-erasure: NOT explicitly
          covered (the proof targets CMA security of the mathematical protocol,
          not hardware fault adversaries).
        KN-LIT-8ce0b5 coverage: NOT covered (scope limited to NTT twiddle faults;
          seed-derivation is a separate hash computation).
      CTRL-1: deterministic mode is inside KN-LIT-3907's scope.
    source: "IDEA-20260805-2b6f17 mechanism and prediction, proposals.yaml"

  # ─────────────────────────────────────────────────────────────
  # SCALE RELEVANCE
  # ─────────────────────────────────────────────────────────────
  scale_relevance:
    tier: crypto
    justification: >-
      Proof-scope analysis. The adversary model scope question is a property
      of the proof's written statements, not of any parameter scale. Applies
      to all parameter sets covered by the analyzed proofs.
    correspondence: null

  # ─────────────────────────────────────────────────────────────
  # REPLICATION
  # ─────────────────────────────────────────────────────────────
  replication:
    seeds: []
    independent_instances: 1
    replication_note: >-
      Text analysis does not require computational replication. If scope
      statements are ambiguous, both interpretations must be recorded.

  # ─────────────────────────────────────────────────────────────
  # BUDGET AND STOPPING RULES
  # ─────────────────────────────────────────────────────────────
  budget:
    wall_clock_seconds_per_run: 18000   # 5 hours: 4 sources + documentation
    total_cpu_hours: 0
    maximum_memory_gb: 0
    maximum_runs: 1

  stopping_rules:
    - trigger: "KN-LIT-3907 full text inaccessible (PDF and ePrint blocked)"
      action: >-
        Record as "access_blocked" for KN-LIT-3907 steps. Proceed with
        KN-LIT-056, KN-LIT-8ce0b5, and KN-LIT-4f3b80. Report partial result.
    - trigger: "KN-LIT-056 full text inaccessible"
      action: >-
        KN-LIT-056 is available at the IACR TCHES DOI (doi:10.13154/tches.
        v2018.i1.238-268). If inaccessible, record access status and defer.
    - trigger: >-
        KN-LIT-3907 explicitly covers hedged-mode nonce-erasure adversaries
        with a formal proof
      action: >-
        Record as "coverage confirmed." The gap hypothesis is falsified for
        KN-LIT-3907's scope. Continue to check KN-LIT-8ce0b5 and KN-LIT-056;
        report whether the gap is fully closed or only narrowed.

  invalidation_rules:
    - trigger: "CTRL-1 fails: deterministic mode is not inside KN-LIT-3907 scope"
      action: "Invalidate run; methodology or scope understanding is wrong.
        Report to Coordinator before filing result."
    - trigger: "Scope statements cannot be located in accessed full texts"
      action: "Record as access_blocked; do not fabricate scope statements."

  # ─────────────────────────────────────────────────────────────
  # SUCCESS AND FALSIFICATION CRITERIA
  # ─────────────────────────────────────────────────────────────
  success_criterion: >-
    SUCCESS: All four primary sources are accessed (or access failure is
    documented); CTRL-1 passes; a placement verdict with cited source text
    is produced for each (fault_class, proof_paper) pair. Valid outcomes:
      (A) Gap confirmed: nonce-erasure faults outside all three proof scopes.
      (B) Gap partially closed: one or more proofs cover nonce-erasure.
      (C) Indeterminate: scope ambiguous in a specific paper; ambiguity cited.
    All three are valid. The experiment succeeds if a citable verdict with
    explicit source text exists for each pair.

  falsification_criterion: >-
    FALSIFIED if KN-LIT-3907 or any accessed corpus entry contains a formal
    proof for hedged ML-DSA under adversarially controlled rnd (nonce-erasure).
    In that case, the coverage gap is falsified for that proof's scope.
    Record which paper falsifies the claim with section citation.

  # ─────────────────────────────────────────────────────────────
  # REQUIRED ARTIFACTS
  # ─────────────────────────────────────────────────────────────
  required_artifacts:
    - type: run_receipt
      path: "experiments/EXP-MLDSA-2b6f17/run_receipt.yaml"
      required_fields: [access_status, analysis_steps_completed, timestamps]
    - type: placement_analysis
      path: "experiments/EXP-MLDSA-2b6f17/placement_analysis.md"
      description: >-
        Structured document: verbatim extracts from each paper with citations,
        attack mechanism description (with corrected values: Jendral 2024,
        58.2%), CTRL-1 result, and placement verdicts for each
        (fault_class, proof_paper) pair.
    - type: access_log
      path: "experiments/EXP-MLDSA-2b6f17/access_log.md"
      description: "Record of sections accessed and any access failures."

  # ─────────────────────────────────────────────────────────────
  # INFERENCE PROVENANCE
  # ─────────────────────────────────────────────────────────────
  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
