experiment:
  id: EXP-PFDR-4af863
  hypothesis_id: H-PFDR-152561
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  claim_tier_note: >-
    TOY per the RQ-HQC-001 claim-tier ceiling, which caps this question at toy
    until a certified instance at or above the standardized parameter scale
    exists. The covariance measurement RUNS at the deployed parameter set, which
    is a statement about the SAMPLING SCALE OF THE MECHANISM and never about the
    decoding-failure rate or about the security of any deployed parameter set. The
    tier field records the claim, not the sampling scale, and the two are kept
    separate everywhere in this contract.
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the
    affected data is generated. NOTHING HERE IS A MEASUREMENT.

  title: >-
    Mean conservation and variance steerability of the HQC error weight under
    attacker-controlled ciphertext support structure - an exact null of width zero
    used as an instrument check, a planted-energy arm that fixes the detectable
    scale, and a frozen minimum detectable slope so that a null reads as a bound
    rather than as an absence.

  objective: >-
    Measure two exact structural facts about the HQC error vector at the deployed
    first parameter set - that the mean coordinate probability is invariant under
    everything the attacker controls beyond cardinalities, and that the variance of
    the weight is an increasing function of the additive energy of the
    attacker-derived supports - and attribute the second to the additive energy
    rather than to its correlates. The experiment does NOT measure any
    decoding-failure rate, does not model any attacker, and derives no security
    consequence; the arm that would is blocked and its precondition is recorded.

  inputs:
    parameters:
      source: >-
        READ AT RUN TIME from the filed corpus record of the HQC specification and
        recorded in the manifest with the record's content hash. NOT TRANSCRIBED
        FROM THIS CONTRACT. TASK-20260904-5423ad read that record and reports the
        first parameter set as n = 17669 with omega = 66 and omega_r = omega_e = 75;
        the executor re-reads and any disagreement halts the run.
      set_under_test: 'the first deployed parameter set'
    main_arm:
      ciphertext_triples: 10000
      secret_supports_per_triple: 1000
      quantity: >-
        For each triple, the additive energy Psi of the attacker-derived supports,
        and the empirical mean and variance of the weight of the error vector over
        the inner secret-support sample.
      cost_note: >-
        The error weight is a sparse cyclic convolution of at most a few thousand
        term products modulo n, so the deployed parameter set is reachable directly
        and no reduced parameters are needed for this arm.
    planted_arm:
      construction: >-
        Attacker-derived supports built to a deliberately CONCENTRATED difference
        spectrum at the same cardinalities, with the resulting Psi computed exactly
        and lying at a KNOWN number of natural standard deviations above the
        ensemble mean. At least three planted levels, at 3, 6 and 12 ensemble
        standard deviations.
      purpose: >-
        DYNAMIC-RANGE CONTROL WITH A DEFECT OF KNOWN SIZE. The measured variance
        must move by the closed-form predicted amount at each planted level. An
        instrument that does not move at 12 standard deviations cannot be trusted
        to report a null in the natural range.
    flattened_arm:
      construction: >-
        Supports resampled to the SAME cardinality with a deliberately FLATTENED
        difference spectrum, by a greedy near-perfect-difference construction, over
        at least five flattening levels.
      purpose: >-
        THE DECAY CONTROL. The variance excess must decay monotonically toward the
        flat-spectrum value as flattening increases.
    sampler_arm:
      construction: >-
        The whole main arm run twice - once with the specification's own
        fixed-weight sampler and once with a uniform fixed-weight sampler.
      purpose: >-
        The specification bounds its own sampler's discrepancy from uniform. Any
        energy effect larger than that bound is not a sampler artifact, and the
        bound is recorded before the comparison.
    inner_decoder_arm:
      construction: >-
        The duplicated inner code at its TRUE deployed block length, whose failure
        rate is directly estimable. Failure rate estimated on a grid of imposed
        error weights, at least 10^5 trials per grid point.
      purpose: >-
        Measures HEUR-002 - convexity and monotonicity of the conditional failure
        probability in the weight - FOR THE INNER FACTOR ONLY, and it must be
        labelled as covering only the inner factor everywhere it is reported.

  controls:
  - >-
    C-MEAN-NULL (BLOCKING, AND IT IS A THEOREM). The regression slope of the mean
    error weight against Psi must be zero within sampling error. This is the null
    object of the same shape required before belief, and its width is zero BY
    CONSTRUCTION - that is why it is used as an instrument check and not as a
    finding. Any measured movement invalidates the run and never strengthens the
    mechanism.
  - >-
    C-PLANTED-PSI (BLOCKING, RUNS BEFORE ANY NATURAL-RANGE COMPARISON). The planted
    concentrated-spectrum arm at three known levels. Each must move the variance by
    the closed-form predicted amount within jackknife error.
  - >-
    C-FLATTEN-DECAY. The flattened-spectrum sweep. Monotone decay required; a
    variance excess that does not decay as the destroying parameter increases is
    the canonical artifact tell.
  - >-
    C-PARTIAL. The third-moment difference statistic and the maximum difference
    multiplicity are partialled out BEFORE any attribution of the effect to the
    additive energy. Attribution that does not survive partialling is not made.
  - >-
    C-SAMPLER. Specification sampler against uniform sampler, with the
    specification's own stated discrepancy bound recorded first.
  - >-
    C-PARITY. Every weight statistic is conditioned on the parity class the
    evaluation character forces, so that an exactly forced component is not
    mistaken for a measured effect.
  - >-
    C-TRUNCATION. The truncation length is recorded for every cell and its own
    forced dependence curve is checked to reproduce, so that a known forced channel
    is not mistaken for the effect sought.
  - >-
    C-BASELINE-CHANNEL. At uniformly drawn ciphertext supports the measured mean
    weight must reproduce the specification's stated channel parameter within
    sampling error, as a numeric comparison recorded before any energy arm runs.

  independent_variables:
  - arm - main, planted, flattened, sampler_uniform, inner_decoder
  - additive energy Psi of the attacker-derived supports
  - planted level in {3, 6, 12} ensemble standard deviations
  - flattening level, five levels
  - imposed error weight, on the inner-decoder grid

  metrics:
    primary:
    - >-
      mean_slope, the regression slope of the mean error weight on Psi, in
      coordinates per unit additive energy. Predicted EXACTLY ZERO. This is the
      null.
    - >-
      variance_slope, the regression slope of the variance of the error weight on
      Psi, in squared coordinates per unit additive energy, with a jackknife
      interval.
    - >-
      minimum_detectable_variance_slope, in the same units, COMPUTED AND FROZEN
      BEFORE ANY MEASUREMENT from the spread of Psi across triples and the
      jackknife error at the declared inner sample size, and reported alongside
      variance_slope in every artifact.
    - >-
      planted_response, the measured change in variance at each planted level, in
      squared coordinates, against its closed-form prediction.
    - >-
      partial_variance_slope, in squared coordinates per unit additive energy,
      after partialling out the third-moment statistic and the maximum difference
      multiplicity.
    secondary:
    - the closed-form predicted variance as a function of the difference multiplicities, evaluated per triple
    - variance excess as a function of flattening level, in squared coordinates
    - empirical distribution and upper-tail quantiles of the standardised additive energy over at least 10^6 sampled supports
    - conditional inner-decoder failure probability on the imposed-weight grid, with second differences and jackknife errors
    - the specification sampler against uniform sampler difference on every reported statistic, against the specification's own discrepancy bound
    - truncation length per cell and its forced dependence curve
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The pair of regression slopes of the mean and the variance of the error
      weight against the additive energy, and the planted response.
    formula: >-
      mean_slope equals 0 exactly, within sampling error, because the coordinate
      marginal is hypergeometric for every coordinate and every attacker-chosen
      support and therefore depends on the ciphertext supports only through their
      cardinalities. variance_slope is strictly positive and equals the closed-form
      value obtained from the covariance expression in the difference
      multiplicities. planted_response at each level equals the closed form
      evaluated at that level's exact Psi.
    source: >-
      The mean prediction is a theorem, restating the specification's own
      coordinate-marginal proposition as a conservation law. The variance
      prediction is a closed form derived symbolically as the experiment's first
      act and NOT taken from this contract. Neither is fitted to data.

  scale_relevance:
    tier: crypto
    tier_note: >-
      THIS FIELD DESCRIBES THE SAMPLING SCALE OF THE MECHANISM MEASUREMENT AND
      NOTHING ELSE. The covariance arm samples at the deployed parameter set
      because a sparse convolution at those sizes costs microseconds. The
      experiment's CLAIM TIER remains toy under the RQ-HQC-001 ceiling, the
      decoding-failure rate is NOT measured at any scale, and no security statement
      about a deployed parameter set may be derived from any number here.
    justification: >-
      The mean and variance of the error weight at the deployed n, omega, omega_r
      and omega_e are directly samplable. The inner-decoder arm also runs at the
      true inner block length. What is NOT reachable is the deployed
      decoding-failure rate, which is below any samplable probability by an
      astronomical margin.
    correspondence: null

  tail_checks:
  - >-
    The largest additive energy observed over at least 10^6 sampled supports is
    reported and compared against the Gaussian prediction for its quantile. A
    measured tail heavier than Gaussian is recorded as an observation; a lighter
    one is recorded as an observation. NEITHER is converted into a statement about
    a grinding gain, which is inside the blocked arm.
  - >-
    The fitted inner-decoder failure probability at the ensemble-typical weight is
    compared against the specification's own stated value. Disagreement beyond the
    declared tolerance indicates an instrument fault and not a discovery.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    seeds_policy: >-
      One master seed per run recorded in the manifest, from which ciphertext
      support draws, secret support draws, planted and flattened constructions, and
      jackknife resampling are derived by a declared deterministic stream. Every
      sampled support is reproducible from the master seed and its index. Seeds are
      fixed before execution and never redrawn after an outcome is seen. The three
      seeds are independent replicates of the whole protocol.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
  - >-
    SR1 BLOCKING. The parameters are re-read from the filed corpus record and
    compared against the values recorded by TASK-20260904-5423ad. Disagreement
    halts the run and is reported as the result.
  - >-
    SR2 BLOCKING. C-BASELINE-CHANNEL and C-MEAN-NULL run first. A mean slope
    inconsistent with zero halts the run with an instrument-failure receipt.
  - >-
    SR3 BLOCKING. C-PLANTED-PSI runs before any natural-range comparison. Failure
    to move at the 12-standard-deviation level halts the run.
  - >-
    SR4. minimum_detectable_variance_slope is computed and frozen before the
    natural-range variance regression is run, and is reported with it in every
    artifact.
  - >-
    SR5. THE SECURITY ARM DOES NOT RUN. Any measurement bearing on a
    decoding-failure rate, a grinding gain, an average-versus-maximum correctness
    gap, or a query budget is OUT OF SCOPE for this contract and is blocked under
    RQ-HQC-001 constraint 1 until the correctness framework and the published
    decryption-failure attack line are filed as knowledge-corpus entries. A
    successor contract may run it; this one may not, and an executor that computes
    it has exceeded scope.
  - >-
    SR6. Budget exhaustion stops the run and reports the cells completed. An
    infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    mean_slope differs from zero beyond sampling error - the sampler or the
    estimator is broken and every number is void.
  - >-
    The planted arm does not move the variance at the largest planted level.
  - >-
    Parameters are transcribed from this contract rather than read from the filed
    corpus record.
  - >-
    Any statistic is reported without its parity conditioning, or truncation length
    is not recorded for a cell.
  - >-
    Any decoding-failure rate, grinding gain, or query-budget figure appears in any
    artifact - this is a scope violation and voids the run.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and
    is NEVER counted as negative mathematical evidence.

  success_criterion: >-
    mean_slope zero within sampling error; variance_slope strictly positive, equal
    to the closed form within jackknife error, and above the frozen minimum
    detectable slope; planted_response matching the closed form at all three
    levels; monotone decay under flattening; and partial_variance_slope retaining
    at least half the unpartialled slope with an interval excluding zero. That
    combination establishes the exact second-moment structure and attributes it to
    the additive energy. IT ESTABLISHES NOTHING ABOUT SECURITY.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) variance_slope consistent with
    zero at three jackknife standard errors AND the frozen minimum detectable slope
    lying BELOW the closed-form prediction - H-PFDR-152561 S2 is FALSIFIED and the
    channel model is more robust than its stated justification. This is a genuinely
    informative negative and is reported as one. (F2) variance_slope consistent
    with zero but the minimum detectable slope ABOVE the closed-form prediction -
    the run is UNDER-POWERED and is reported as such; this is NOT a negative result
    and may not be quoted as one. (F3) mean_slope nonzero - INVALID run, instrument
    broken. (F4) Planted response absent at 12 standard deviations - INVALID run,
    no dynamic range. (F5) Variance excess does not decay under flattening -
    artifact; the effect is void. (F6) partial_variance_slope below half the
    unpartialled slope - the effect belongs to a correlate of the additive energy,
    and the record must attribute it to that correlate rather than to the energy.

  required_artifacts:
  - the parameters as re-read from the filed corpus record, with that record's content hash
  - the symbolically derived closed form for the variance in terms of difference multiplicities
  - per-triple additive energy, mean weight and variance of weight, for every arm
  - mean_slope and variance_slope with jackknife intervals, and the frozen minimum detectable slope with its derivation
  - planted-arm exact Psi per level, measured response and closed-form prediction
  - flattened-arm variance excess per flattening level
  - partialled regression output with the covariates named
  - specification-sampler against uniform-sampler comparison, with the specification's own discrepancy bound
  - empirical CDF and upper-tail quantiles of the standardised additive energy over at least 10^6 supports
  - inner-decoder conditional failure probability grid, second differences, and comparison against the specification's stated value
  - parity conditioning and truncation length per cell
  - command, environment, seeds, library versions and resource measurements

  limitations:
  - >-
    NO OUTCOME OF THIS EXPERIMENT IS A BREAK OR A STATEMENT ABOUT THE SECURITY OF
    ANY PARAMETER SET, AND NONE MAY BE REPORTED AS ONE.
  - >-
    THE SECURITY ARM IS BLOCKED, NOT OMITTED. RQ-HQC-001 constraint 1, read
    verbatim by TASK-20260904-5423ad, forbids designing an experiment before the
    relevant primary sources are filed as knowledge-corpus entries. The
    specification IS filed, which is what makes the two moment arms designable. The
    correctness framework whose error is defined with a maximum over messages, and
    the published decryption-failure attack line named in the corpus record as
    absent from the specification's reference list, are NOT filed - so every
    statement about a failure rate, a grinding gain, an average-versus-maximum gap
    or a query budget is out of scope here and is enforced by SR5.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The deployed
    decoding-failure rate is below two to the minus one hundred twenty-eight and is
    NOT MEASURABLE BY DIRECT SAMPLING AT ANY SCALE, now or ever - estimating it
    would require more trials than the security budget it defends. This experiment
    therefore does not, and cannot, test the quantity that would matter. Any
    grinding-gain figure obtained by extrapolating a sampling range of at most
    about twenty bits to a budget of one hundred twenty-eight bits spans roughly a
    hundred orders of magnitude and is an extrapolation, never a measurement.
  - >-
    THE MEAN NULL HAS WIDTH ZERO BY CONSTRUCTION and is used as an instrument check
    for exactly that reason. It is not a discriminating control and it is never
    reported as one.
  - >-
    ATTRIBUTION TO THE ADDITIVE ENERGY IS NOT AUTOMATIC. The energy is strongly
    correlated with the maximum difference multiplicity and with the third-moment
    statistic. The partialling and the flattening sweep either establish the
    attribution or they do not, and the record reports which rather than assuming.
  - >-
    THE INNER-DECODER ARM COVERS THE INNER FACTOR ONLY and must be labelled as such
    everywhere. The inner decoder is maximum-likelihood, so failure is not a
    monotone function of block weight in general.
  - >-
    NO CURVE-FREE NULL IS REQUIRED OR MEANINGFUL HERE, and the reason is recorded -
    this experiment contains no elliptic curve, makes no elliptic-curve claim, and
    the standing scope constraint about curve-free lookalikes does not apply. The
    analogous constraint that DOES apply is the correlate-attribution one, and it
    is enforced by C-PARTIAL.
  - >-
    Whether this statistic is already published is UNRESOLVED, because this program
    has not read the named decryption-failure attack line. Any novelty statement is
    blocked on that read.

  assigned_to: executor
  approved_by: null
