experiment:
  id: EXP-VOLC-6282ee
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5cabfc
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE VERTICAL TRANSPORT CLOSURE: a vertical ell-power isogeny is an ISOMORPHISM on the prime-order
    subgroup, so every attack-cost functional that factors through the abstract triple (G, P, Q) is
    constant across all volcano levels of every ell != N; the named obstruction is that depth lives
    entirely in E[ell^infinity] and E[ell^infinity] intersect G = {O}, and the ell = N loophole is
    closed by the arithmetic fact that the N-volcano has height zero for any near-prime-order curve'
  status: draft
  objective: "(A) THE STATEMENT. Let E/F_p be ordinary with trace t, let G = <P> subset E(F_p) have\
    \ PRIME order N, Q = [k]P. Let ell be a prime with ell != N and let phi: E -> E' be an F_p-rational\
    \ isogeny of degree ell^j that changes the ell-adic valuation of the conductor of End(E) -- that\
    \ is, a VERTICAL path in the ell-volcano, so E and E' sit at different levels and have different\
    \ endomorphism rings. Then:\n  (i)  ker(phi) intersect G is a subgroup of G of order dividing\n\
    \       gcd(ell^j, N) = 1, hence trivial, so phi restricted to G is INJECTIVE;\n  (ii) phi(P)\
    \ has order exactly N and phi(Q) = [k] phi(P);\n  (iii) therefore phi induces an ISOMORPHISM of\
    \ DL instances\n       (G, P, Q, k) -> (phi(G), phi(P), phi(Q), k), with the SAME k.\nCONSEQUENCE\
    \ (the closure): let C be any attack-cost functional that factors through the isomorphism class\
    \ of the abstract triple -- i.e. C(E, P, Q) depends only on (N, k) and on the group law as an\
    \ abstract oracle. Then C is CONSTANT on every ell-volcano level of the class, for every ell !=\
    \ N. This covers, without exception: Pollard rho and every walk variant, BSGS and every meet-in-the-middle,\
    \ kangaroo, Pohlig-Hellman, every generic-group algorithm, and every augmented-witness-lattice\
    \ construction of the H-ENDO-001 kind.\n(B) THE NAMED OBSTRUCTION, stated so the next agent does\
    \ not re-tread it. DEPTH LIVES IN E[ell^infinity] AND G DOES NOT MEET IT. The level of E in the\
    \ ell-volcano is v_ell(f_E) where f_E is the conductor of End(E); by Kohel's stratification the\
    \ level is exactly a statement about which ell-power isogenies from E are horizontal, ascending,\
    \ or descending, i.e. about the Galois/End-module structure of E[ell^infinity]. Since ell != N\
    \ and N is prime, G intersect E[ell^infinity] = {O}. The level is therefore an invariant of a\
    \ part of the curve that the DL instance does not touch, and the vertical isogeny that changes\
    \ the level is invisible to the part it does touch. This is the ISOGENY-SIDE COMPANION to H-ENDO-001:\
    \ that record says every ENDOMORPHISM acts on G as a scalar, this one says every VERTICAL ISOGENY\
    \ acts on G as an isomorphism. Together they close the two natural routes by which \"more endomorphism\
    \ structure\" could have changed a group-theoretic cost.\n(C) THE ONE LOOPHOLE, AND IT IS CLOSED\
    \ ARITHMETICALLY. The argument needs gcd(deg phi, N) = 1, so it says nothing at ell = N. But there\
    \ is no depth at ell = N. Write t^2 - 4p = c^2 D_K with D_K fundamental; the ell-volcano has height\
    \ v_ell(c) (Kohel). By Hasse, c^2 |D_K| = 4p - t^2 <= 4p, so c <= 2 sqrt(p) / sqrt(|D_K|) <= 2\
    \ sqrt(p). For any curve whose prime subgroup order satisfies N > 2 sqrt(p) -- which holds for\
    \ every near-prime-order curve and in particular for every standardized curve -- we get N > c,\
    \ hence N does not divide c, hence v_N(c) = 0 and THE N-VOLCANO HAS HEIGHT ZERO. There are no\
    \ vertical N-isogenies to exploit. What does exist is the quotient map E -> E/G of degree N: it\
    \ is rational and it annihilates G, i.e. it destroys the instance rather than transporting it.\
    \ That map is named here as the residual and it is not an attack.\n(D) WHAT THIS DOES NOT CLOSE\
    \ -- the forward guidance, which is the part of a closure that has to earn its keep. The theorem\
    \ closes functionals that factor through the abstract triple. It says NOTHING about functionals\
    \ that read the EMBEDDING of G into the curve, because phi does not preserve x-coordinates: for\
    \ a point R in G, x(phi(R)) is a different field element from x(R), and every quantity built on\
    \ x-coordinates is free to vary. Explicitly left open, with their resource labels:\n  R1 -- Semaev/Groebner\
    \ solving degree, factor-base decomposition yield,\n        relation-collection cost, first-fall\
    \ degree. All are functions of the\n        x-coordinate map and none factors through the triple.\n\
    \  R2 -- anything reading the curve equation (a, b) or j.\n  R5 -- E[ell] for ell != N as a Galois/End\
    \ module. THIS IS THE SHARP ONE:\n        R5 at the SAME ell as the volcano is the unique resource\
    \ that reads\n        the level directly rather than through a proxy, because the level IS\n \
    \       a statement about ell-power torsion. IDEA-20260807-cbe8c1 takes\n        exactly this\
    \ opening.\n  R8 -- the level as preprocessing shared across many targets in one class.\n  Transport\
    \ cost -- T1 in the DECOMPOSITION says class-wide vulnerability\n        holds \"up to transport\
    \ cost\". In THIS lane that clause is vacuous:\n        a vertical ell-step is one Velu computation\
    \ at cost O(ell) field\n        operations and the volcano height is at most log_ell(2 sqrt(p)),\
    \ so\n        transport across the whole volcano is polynomial. The closure is\n        therefore\
    \ TIGHT here in a way it need not be for large-degree\n        isogenies (contrast H-ECTD-19017a,\
    \ which studies prime conductor\n        steps q >= 17 where the transport cost is the interesting\
    \ quantity)."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'This proposal consumes no non-generic resource. It is an AUDIT in the sense
    of DECOMPOSITION lane L12: it determines which OTHER proposals are inadmissible_generic_group
    by exhibiting, once and for all, the simulation that makes level-dependence unreachable for triple-factoring
    functionals. An audit that closes a class is admissible by construction because it claims no speedup;
    its output is a boundary, not an algorithm.'
  reachability_gate: 'NOT APPLICABLE AS A COST, AND THAT IS ITSELF INFORMATIVE. This proposal moves
    between curves only to VERIFY an invariance, so it needs no good curve and pays no search cost.
    But it settles half of T5 for the whole lane: since every vertical ell-step costs one Velu computation
    at O(ell) field operations and the volcano height is at most log_ell(2 sqrt(p)), TRAVERSING THE
    ENTIRE ell-VOLCANO IS POLYNOMIAL. Therefore in lane L2, unlike in lanes that must reach a SPECIFIED
    curve, reachability is never the binding constraint -- every level of every small-ell volcano
    is cheaply reachable from every other. T5''s dichotomy resolves on the "cheap" side here, which
    means any negative in this lane is a negative about the MATHEMATICS and cannot be excused as a
    reachability failure. That raises the evidential value of every other L2 proposal and is recorded
    here for their benefit.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write out the proof as above and have it read adversarially.
      The theorem is three lines; if it is wrong, it is wrong for free. STAGE 1 (hours): build the
      toy volcano instrument (see IDEA-20260807-b1b604) for ell in {2, 3} at p ~ 2^12 to 2^14, choosing
      a class with v_ell(c) >= 2 so at least three levels exist. Verify Kohel''s stratification empirically:
      count rational ell-isogenies per vertex and check the ell+1 / 1 / 1+(D_K/ell) pattern. STAGE
      2 (hours): for every vertical edge, transport (P, Q) by Velu and recompute k independently on
      the codomain by brute force. Exact equality required. STAGE 3 (hours): matched rho and BSGS
      counts at crater and floor, >= 20 seeds, plus the same-curve seed-noise band. STAGE 4 (minutes):
      the height-zero null class, identical pipeline. STAGE 5 (minutes): v_N(c) = 0 check over the
      instance pool.'
    mechanism: 'STEP 1 -- THE KERNEL ARGUMENT (three lines, no heuristic). ker(phi) has order ell^j.
      G has prime order N != ell. ker(phi) intersect G is a subgroup of G, so its order divides N;
      it is also a subgroup of ker(phi), so its order divides ell^j; gcd = 1, so it is trivial. phi
      restricted to G is injective, phi(P) has order N, and phi is a homomorphism so phi([k]P) = [k]phi(P).

      STEP 2 -- THE FACTORING CONDITION, MADE PRECISE. Say a cost functional C FACTORS THROUGH THE
      TRIPLE if there is a function C'' with C(E, P, Q) = C''(N, k) for all curves E and all P, Q
      with P of order N. Every generic-group algorithm in Shoup''s model has this property by definition
      of the model: its transcript is a sequence of group operations and equality tests on encoded
      elements, and the encoding is exactly what phi changes. KN-FIND-b7e091 already records that
      incidence and endomorphism-image oracles are simulable inside that model; this step adds that
      the VERTICAL ISOGENY MAP is itself an encoding change, hence also invisible there.

      STEP 3 -- THE LEVEL LIVES ELSEWHERE. By Kohel''s stratification (RECALLED, UNVERIFIED -- Kohel''s
      thesis and KN-LIT-360 Sutherland''s "Isogeny Volcanoes" are the standard sources and NEITHER
      WAS READ for this record; the statement is made a verification stage of the minimal test, not
      assumed), the curves of the F_p-isogeny class are stratified by the order O_f = Z + f O_K with
      f | c, the ell-isogeny graph is a volcano of height v_ell(c), and the level of E is v_ell(f_E).
      Membership in a level is decided by which ell-power isogenies out of E are ascending/horizontal/descending,
      i.e. by the O-module structure of E[ell^infinity]. Since gcd(ell, N) = 1 and N is prime, G intersect
      E[ell^infinity] = {O}. The level is thus a property of a direct summand of the torsion that
      G does not meet.

      STEP 4 -- THE ell = N CASE, CLOSED BY HASSE. As in claim (C): c <= 2 sqrt(p) < N for a near-prime-order
      curve, so v_N(c) = 0 and the N-volcano is a single vertex. The only rational N-isogeny is E
      -> E/G, which kills the instance. NOTE this is a genuine arithmetic dependency: for a curve
      with a LARGE cofactor, N can be small enough that N <= 2 sqrt(p) and the argument lapses. The
      minimal test checks the inequality per instance rather than assuming it, and any instance where
      it fails is reported separately.

      STEP 5 -- WHAT IS ACTUALLY RUN. This is a proof-oriented record and its experiment is a VERIFICATION,
      not a discovery: at toy scale, enumerate a class with a volcano of height >= 2 at ell in {2,
      3}; build every vertical edge by Velu; check on every edge that (a) the codomain has the same
      trace, (b) phi(P) has order N, (c) phi(Q) = [k] phi(P) with the SAME k recomputed independently,
      (d) matched rho and BSGS operation counts on the two endpoints agree within their own instance-to-instance
      noise band. If any of (a)-(d) fails the theorem is not what is wrong -- the implementation is
      -- and that disposition is fixed in advance.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - height-zero volcano (v_ell(c) = 0) -- must show no level effect anywhere
  - same curve, resampled k -- gives the instance noise band
  - horizontal ell-edge -- must transport identically to a vertical one
  - a deliberately non-coprime map E -> E/G -- must DESTROY the instance, confirming the instrument
    can see the failure mode the theorem excludes
  - 'NULL OBJECT (from the proposal): THE HEIGHT-ZERO VOLCANO NULL, and it is the control this whole
    lane should be built on. Choose a second isogeny class at the same p whose conductor c satisfies
    v_ell(c) = 0, so the ell-volcano is a SINGLE VERTEX and there is no depth at all. Run the identical
    measurement pipeline on it. Any quantity that reports a "level effect" in a height-zero volcano
    is 100 percent artifact, with no mathematical content available to explain it. DECAY PARAMETER:
    the volcano height h = v_ell(c). A genuine depth effect must be zero at h = 0, must be able to
    appear at h = 1, and must grow no faster than the number of distinct levels; a quantity that is
    the same size at h = 0 and h = 3 is the canonical artifact tell of docs/inventor-protocol.md section
    3. SECOND NULL: the SAME curve measured twice with a fresh random k. Every quantity in this record''s
    scope is k-dependent only through the abstract triple, so resampling k must move a triple-factoring
    functional by exactly its instance noise and must move a genuine level functional not at all.'
  independent_variables: []
  metrics:
    primary:
    - transported k versus independently recomputed k, per edge
    - rational ell-isogeny count per vertex, versus the Kohel prediction
    - matched rho and BSGS operation counts per curve per seed
    - v_ell(c), v_N(c), level of each vertex, height of each volcano
    secondary:
    - pass/fail of every control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: transported secret k across every vertical ell-edge of a toy volcano, recomputed independently
      on the codomain curve
    formula: EXACT EQUALITY on 100 percent of edges. One edge with a different k, with the order and
      coprimality controls passing, refutes the theorem. This is a zero-tolerance prediction because
      the claim is algebraic, not statistical.
    source: pre-registered in IDEA-20260807-5cabfc before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Instance noise in rho counts is large (rho is a random variable with a heavy tail), so a crater-vs-floor
    comparison at low seed count will show apparent differences that are pure sampling. The same-curve
    seed-noise band is mandatory and blocking, not decorative.
  - Velu implementations can silently produce a curve in a DIFFERENT isogeny class if the kernel polynomial
    is wrong. The trace check on every codomain is the guard and it must be run on every edge, not
    sampled.
  - At p ~ 2^12 the volcano may be too short to have a floor distinguishable from a crater; classes
    must be selected for v_ell(c) >= 2 before any measurement, and the selection is a curve-only criterion
    so it cannot bias k.
  - Confusing "the level is invisible to rho" with "the level is invisible". The whole value of this
    record is the boundary, and a summary that drops the qualifier converts a correct closure into
    a false one.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACT EQUALITY on 100 percent of edges. One edge with a different k, with the
    order and coprimality controls passing, refutes the theorem. This is a zero-tolerance prediction
    because the claim is algebraic, not statistical.
  falsification_criterion:
  - Any vertical edge on which the independently recomputed k differs from the transported k, with
    the order and coprimality controls passing. The theorem is false as stated and this record is
    superseded, not amended.
  - A reproducible rho or BSGS cost difference between crater and floor, outside the same-curve seed-noise
    band, surviving the height-zero null. Either the theorem is false or rho as implemented does not
    factor through the triple -- and the second possibility must be excluded before the first is claimed.
  - Any toy instance with N > 2 sqrt(p) and v_N(c) > 0. The arithmetic in claim (C) is wrong and the
    ell = N loophole reopens.
  - The measured rational ell-isogeny counts do not match Kohel's pattern. Then the recalled stratification
    theorem is being misapplied and every level label in this batch is suspect. This is an instrument
    failure that voids the lane's labels, not a mathematical negative.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
