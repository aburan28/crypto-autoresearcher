experiment:
  id: EXP-ALPF-b123eb
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-ac9263; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-ac9263
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Build and validate a dependency-free Macaulay-rank first-fall meter with a paired-null public
    API, reproducing the published ALPF control rows including the two archived validation failures,
    and report which convention vectors are consistent.
  objective: 'The one uncertainty a run reduces is whether the ALPF lane can be metered at all inside
    this harness, and under which conventions. Stated as parts: (i) can the control systems described
    in the four archived analyses be reconstructed unambiguously enough to serve as fixtures, and
    how many rows survive reconstruction, since a fixture suite that cannot be rebuilt cannot validate
    anything; (ii) sweeping the explicit convention parameters -- Hilbert-series truncation rule,
    first-fall tie-break at equality, positive-dimensional handling -- which convention vectors reproduce
    the passing control rows of EXP-ALPF-010 and EXP-ALPF-011 exactly, and does any single vector
    ALSO reproduce the failure rows of EXP-ALPF-006 where 0 of 3 positive controls fired and of EXP-ALPF-007
    where the meter was declared not validated; (iii) is the number of free conventions smaller than
    the number of discriminating rows, which is the difference between validating the tool and fitting
    it. Reducing these either gives this batch a runnable, controlled meter or reports precisely why
    the archived campaign cannot be re-metered from its committed artifacts.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: this implementation,
      under convention vector v, reproduces the listed published control rows exactly and fails to
      reproduce the listed others, with the stated free-convention and discriminating-row counts,
      and its paired API returns a null verdict with every signal verdict. What does NOT follow: that
      this implementation agrees with the archived Sage meter on any system outside the fixtures;
      that any archived ALPF verdict is confirmed or revised; that the tool is correct in any sense
      beyond fixture agreement; that any decomposition, attack, speedup or security consequence exists.
      A validated instrument is a precondition for measurement, not a measurement.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~half a day human): transcribe every published control row
      from experiments/EXP-ALPF-006, 007, 010 and 011 analysis.md files into machine-readable fixtures,
      reconstructing input systems from their prose descriptions and listing every row that cannot
      be reconstructed. STAGE 1 (cost: ~1 day human): implement D_reg_pred from a degree profile via
      the positive-truncated semiregular Hilbert series in exact integer arithmetic, with the truncation
      rule as a parameter. STAGE 2 (cost: ~1 day human): implement the Macaulay builder and pure-Python
      rank over F_p, with degree ceiling and column cap as parameters. STAGE 3 (cost: ~half a day
      human): implement measure_with_null(system, profile, seed) returning signal and null verdicts
      from one call, with no public path to a signal verdict alone. STAGE 4 (cost: minutes): sweep
      the convention parameters over the full fixture suite and report per-row agreement per vector.
      STAGE 5 (cost: minutes): run the shuffled-coefficient control and repeated null draws. STAGE
      6 (cost: 0): commit the module with its fixtures as a regression suite and report free-convention
      versus discriminating-row counts.'
    instrument: Python 3 only, no Sage anywhere. sympy for polynomial manipulation and leading-form
      extraction, already a dependency of harness/toycurve.py and harness/semaev.py; pure-Python integer
      arithmetic modulo p for the Macaulay matrix and its rank; src/macaulay_export.py consulted for
      serialisation conventions; harness/runner.py for run manifests, seeds and the inference block;
      harness/semaev.py and harness/toycurve.py for generating real Semaev fixtures alongside the
      transcribed control systems. src/ic_first_fall_fast.py is read for reference only and is not
      imported, since it requires sage.all.
    parameters: 'Fixture rows: all published control rows from EXP-ALPF-006, 007, 010 and 011, expected
      to be roughly a dozen, with unreconstructable rows listed. Primes: as recorded per fixture,
      plus a 13-bit prime for generated Semaev fixtures. Convention parameters: truncation rule (2
      settings), equality tie-break (2 settings), positive-dimensional handling (2 settings), giving
      8 vectors swept exhaustively. Degree ceiling: 14, with a column cap of 2 million, both declared.
      Null draws per paired call: 1, with 200 repeated draws per profile for the null-rate consistency
      check. Shuffled-coefficient control: 200 systems.'
  controls:
  - Shape-matched null drawn in the same call as every signal measurement, enforced by the API.
  - Shuffled-coefficient control on the same systems, which must change the verdict no more often
    than the shape-matched null.
  - Archived negative control rows reproduced as negatives, not only positives reproduced as positives.
  - Archived FAILING gate rows reproduced as failures, which is the strongest available constraint
    on the convention vector.
  - Convention sweep with every free convention enumerated, so the reader can count conventions against
    discriminating rows.
  - Regression fixture suite committed with the module, so the same rows guard future changes.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a shape-matched random homogeneous system, and its
    role here is structural rather than merely comparative: the module''s paired entry point draws
    it in the same call as the signal system, from a derived seed, and returns both verdicts, so a
    caller cannot obtain a signal verdict without its null. For the tool to be accepted, the null
    arm must reproduce the archived NEGATIVE control rows -- generic quadrics quiet at d_ff = 4, D_reg
    = 4 and generic cubics quiet at 7/7 -- and must fire at a rate consistent with the companion null-ensemble
    measurement across repeated draws. A second null is a shuffled-coefficient control: the same system
    with its coefficients randomly permuted within each generator, which must change the verdict no
    more often than the shape-matched null does, confirming the meter reads structure rather than
    coefficient layout.'
  independent_variables:
  - Hilbert-series truncation rule
  - first-fall tie-break at equality
  - positive-dimensional ideal handling
  - fixture source analysis (EXP-ALPF-006, 007, 010, 011)
  metrics:
    primary:
    - per-row agreement with published control rows, per convention vector
    - set of convention vectors consistent with all reconstructable rows
    - free-convention count versus discriminating-row count
    - reproduction status of the archived validation-failure rows
    secondary:
    - shape-matched null fire rate over 200 repeated draws per profile
    - shuffled-coefficient verdict change rate
    - list of rows excluded for unreconstructable inputs
    - wall-clock seconds and peak Macaulay dimensions at the highest fixture degree
    - 'public-API audit result: whether any path returns a signal verdict without a null'
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The set of meter convention vectors consistent with the published ALPF control rows,
      and the fraction of those rows reproduced.
    formula: 'For each of the 8 convention vectors v, agreement(v) = (rows whose (d_ff, D_reg_pred,
      fires) triple matches the published value) / (reconstructable rows). Consistent set = {v : agreement(v)
      = 1}. Pre-registered predictions: max_v agreement(v) >= 0.8; the consistent set is nonempty
      and of size 1 or 2; the EXP-ALPF-006 gate-failure rows are reproduced as failures by every vector
      in the consistent set; and the public-API audit finds zero paths returning a signal verdict
      without a null.'
    source: Pre-registered in the parent proposal IDEA-20260816-ac9263 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'All fixtures are toy-scale homogeneous systems at 13 to 17 bit primes with total
      degrees up to 24, exactly as archived. No transfer to medium or cryptographic scale is claimed,
      and the tool''s validated range is explicitly the fixture range: degrees at or below the tested
      ceiling and profiles represented among the published rows. Downstream entries inherit that stated
      validation range and must not use the meter outside it without re-validating.'
    correspondence: null
  tail_checks:
  - Report the highest-degree fixture's timing and peak matrix dimensions, since that row sets the
    practical ceiling every downstream entry inherits.
  - Report every row that could not be reconstructed, with the prose description that defeated reconstruction.
  - Report convention vectors that reproduce all passing rows but fail the gate-failure rows, individually,
    since that pattern is the most likely outcome and the most informative.
  - Report any null draw whose verdict differed from the shape-matched expectation, individually.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report a thin fixture suite if more than a third of published rows are unreconstructable,
    with no validation claimed.
  - Stop the convention sweep early if a vector reproduces every row, and report the remaining vectors'
    agreement anyway for completeness.
  - Hard stop at 2 total CPU-hours; this entry is engineering-bound, not compute-bound.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A dependency-free meter exists, its fixture suite is committed, at least 80 percent
    of reconstructable published rows are reproduced by some convention vector, and the public-API
    audit finds no path to a signal verdict without a null.
  falsification_criterion:
  - No convention vector reproduces all reconstructable rows.
  - Free-convention count at or above the discriminating-row count, making the reproduction fitting
    rather than validation.
  - The public API permits a signal verdict without a null.
  - Shuffled-coefficient control changing verdicts more often than the shape-matched null.
  - Rank computation exceeding budget at the archived D_reg values of 10 to 12.
  - More than a third of published rows unreconstructable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-ac9263
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact input systems behind prose descriptions such as '3 cubics, shared quadratic leading
    factor' must be fixed by a Coordinator, since different reconstructions give different fixtures
    and hence different convention conclusions.
  - Whether reproducing the EXP-ALPF-006 gate-failure rows is a requirement or a stretch goal must
    be decided before freeze, as it materially changes the success criterion.
  - The column cap and degree ceiling need a dry-run measurement rather than the guessed values stated
    here.
  - Whether the paired-null API should also be enforced for the archived-fixture path, where a null
    is meaningless because the input is a fixed published system, needs a stated exception rule.
