experiment:
  id: EXP-ECQ-a7d948
  version: 1
  hypothesis_id: H-ECQ-8b600d
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-002
  title: BATCH-541940 - tuple-space envelope scan of Mestre's construction (run index)
  contract_provenance: >-
    AUTHORED AFTER EXECUTION; NOT a pre-registered contract, and it does not retroactively give
    BATCH-541940 one. Written for one mechanical reason: tools/validate_ledger.py indexes runs only
    under experiments/*/runs/*/manifest.yaml, so EV-ECQ-8ee697's references to
    RUN-ECQTUP-416e78-001..013 were unresolvable and raised 13 validation errors. The protocol of
    record for these runs is the TASK-20260823-416e78 handoff plus H-ECQ-8b600d, exactly as
    EV-ECQ-8ee697 states.
  does_not_supersede_the_recorded_gap: >-
    EV-ECQ-8ee697 records experiment_ids as EMPTY and charges that as the FOURTH consecutive gap.
    This file does not close that finding and must not be read as closing it. EV-ECQ-8ee697 is
    immutable and its experiment_ids stays empty; this record postdates it. What this file fixes is
    run RESOLVABILITY, not the missing pre-registered contract.
  recurrence_note: >-
    FOURTH OCCURRENCE. EXP-ECQ-7ea4c3's own recurrence_note predicted it verbatim -- "Recorded here
    so the pattern is visible rather than rediscovered a fourth time" -- and it was rediscovered a
    fourth time anyway, which is itself the finding. Prior occurrences: GOAL-ECQ-001
    (EXP-ECQ-89de3c), BATCH-f2341e (EXP-ECQ-139c9f), BATCH-da59ec (EXP-ECQ-7ea4c3). The cause is
    structural: the harness dispatches producers whose write_scope is a BATCH directory, so runs
    land under coordination/goals/**/tasks/**/runs/, while the validator indexes only
    experiments/*/runs/. A note in a record has now failed three times to prevent it. The remedy has
    to be mechanical, not documentary -- either producers write runs under an experiments/<EXP-ID>/
    path from the start, or the validator learns the batch layout.
  port_note: >-
    INDEX SHIM, not a second copy of the evidence. The originals under
    coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/runs/ are
    UNMODIFIED and remain the record of what ran; each ported manifest records the original's
    sha256 and carries the untouched original as source_manifest_verbatim. Only run.experiment_id
    was set, and it was absent in the original. On any disagreement the original wins.
  artifact_completeness: >-
    COMPLETE COPY, including every raw-result.json. An earlier attempt at this port omitted them
    (193 MiB across the 13 runs) on the reasoning that the snapshot receipt already binds those
    bytes. That was wrong twice over: tools/validate_ledger.py requires raw-result.json to be
    PRESENT in each run directory, and git stores content-addressed blobs, so copying bytes that are
    already committed at the original path adds tree entries rather than 193 MiB of new objects. The
    omission is recorded here rather than quietly reversed.
  schema_mapping_note: >-
    The producer's manifests use its own field names (git_commit, git_dirty, wall_clock_seconds,
    user_cpu_seconds, max_rss_kb, seeds, certificate, exit_code, status) rather than the validator's
    canonical run schema (code, environment, timing, result, inputs). Each ported manifest therefore
    carries BOTH: every producer field unchanged, plus mapped fields whose provenance is listed
    one-by-one under port_provenance.fields_added_by_mapping. NOTHING WAS INVENTED -- no number,
    timing, or status originates in the port. Where the producer's certificate.kind was not one of
    discrete_log|decomposition|none it is mapped to `none` with the original preserved under
    certificate.mapped_from, never silently recategorised.
  status: completed
  success_criterion: >-
    DECLARED AFTER EXECUTION and therefore NOT a pre-registered success bar -- see
    contract_provenance. Recorded to satisfy the schema and to state plainly what the batch measured
    itself against: a curve of certified rank >= 12 whose minimal-model naive height falls below the
    frozen r>=12 cell 69.33884136527462. IT WAS NOT MET. Best reached was 86.77369390941135, missing
    that cell by +17.4349 and the intermediate benchmark 79.32867457792244 by +7.4447.
  protocol_summary: >-
    Regenerate Mestre's construction over many small integer 6-tuples; measure each family's lower
    envelope of minimal-model naive height over one fixed 73-value T-box; compute each family's
    Shioda-Tate ceiling from its OWN fibre configuration; rank families by envelope rather than by
    generic rank; certify every reported rank as a lower bound from exhibited points in exact
    arithmetic; and run the required null over the number of rational sections at matched
    coefficient content.
  metrics:
    primary: [measured_envelope_min_naive_height, certified_rank_lower_bound]
    secondary: [shioda_tate_ceiling_own_fibre_configuration, flat_arm_intercept, steep_arm_slope,
                log_content_P2, null_ladder_by_rational_sections]
  budget:
    wall_clock_seconds_per_run: 3600
    maximum_memory_gb: 4
    maximum_runs: 80
    maximum_workers: 1
  budget_note: >-
    From the TASK-20260823-416e78 handoff. Producer reported ~2470 s of 3600 and 13 runs of 80.
    Runs 005, 006 and 011 reached their declared time budget and PARI alarm fired three times;
    those are INFRASTRUCTURE outcomes, never negative mathematical evidence, and they mean the
    reported minima are upper bounds on what the method reaches rather than its limit.
  run_validity:
    completed_valid: 11
    invalid_measurement: 2
    invalid_detail: >-
      RUN-ECQTUP-416e78-002 truncated quintic families to quartics and is RETAINED, quarantined and
      documented at runs/VALIDITY-CORRECTION-RUN-002.md; nothing downstream of the height gate
      consumed its output. RUN-ECQTUP-416e78-009 died on a bad CLI flag and produced no result;
      superseded by RUN-ECQTUP-416e78-010.
  outcome_pointer: >-
    Read EV-ECQ-8ee697 and DEC-20260823-ee9162 for what these runs establish, and the two blind
    review records for what they do not. NO RECORD CELL WAS TAKEN at any of 30 rank thresholds.
