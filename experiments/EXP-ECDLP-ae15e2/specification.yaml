# EXP-ECDLP-ae15e2
# Storage-count arithmetic. No ladder is run.
# Approved by DEC-20261003-8f8609.
experiment:
  id: EXP-ECDLP-ae15e2
  hypothesis_id: H-ECDLP-850278
  source_idea: IDEA-20261003-05e0e1
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Projective coordinates versus an x-only state
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-8f8609
  objective: >-
    Check the storage counts 3 and 1, the product 3, and the nearby gap 0.
  inputs:
    count_hi: 3
    count_lo: 1
    storage_gap: 2
    storage_product: 3
    storage_sum: 4
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      The projective point stores 3 coordinates. The x-only state
      stores 1. Reporting both as 1 drops the gap and invalidates
      the run.
    - >-
      Three exceeds one by 2. The product of the two counts is 3.
      Their sum is 4.
    - >-
      Two x-only states each store 1. Their gap is 0 and their
      product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - count_hi
      - count_lo
      - storage_gap
      - implementations_agree
    secondary:
      - storage_product
      - storage_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The projective point stores 3 coordinates. The x-only state
      stores 1. The gap of two x-only states is 0.
    formula: >-
      Count 3 coordinates. Count 1 coordinate. Subtract 1 from 3.
      Multiply 3 by 1. Subtract 1 from 1.
    source: >-
      IDEA-20261003-05e0e1 states the counts 3 and 1, read
      2026-10-03. The gap, the product, and the sum were recomputed
      in this design session. That computation is not a run. No
      ladder was run.
  scale_relevance:
    tier: toy
    justification: Two written storage counts. No transfer to a ladder.
    correspondence: null
  tail_checks:
    - The product 3 and the nearby gap 0 are required. A check that stops at the count 3 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the count 3 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The projective count is not 3.
    - The x-only count is not 1.
    - The gap is not 2.
    - The product is not 3.
    - Both states are reported as size 1, or a ladder is run.
  success_criterion: >-
    Both runs agree that the projective point stores 3 coordinates,
    that the x-only state stores 1, and that 3 exceeds 1 by 2.
  falsification_criterion: >-
    The runs agree that the projective storage count is computed,
    and that count is not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-ae15e2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-ae15e2/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-ae15e2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-ae15e2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-ae15e2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-ae15e2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any ladder or scalar recovery.
    - Any claim that a storage gap of 2 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
