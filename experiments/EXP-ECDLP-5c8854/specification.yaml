  preregistered_prediction:
    id: P-envelope
    quantity: Native validity of a fresh metadata-compatible reproduction
    formula: The original driver and both unchanged checker calls exit 0; raw/legacy-manifest bytes and
      bindings match; the supervisor returns output_validated. Any original matrix reading is permitted.
    source: Prospective native metadata functionality of the new three-output adapter; synthetic stub
