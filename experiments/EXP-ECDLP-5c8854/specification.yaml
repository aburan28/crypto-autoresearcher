  historical_scientific_protocol:
    objective: Run one preregistered deterministic cell that computes the group-law order of P = (1, 5)
      and the division-polynomial net through n = 24. Record the order, the first positive zero, and whether
      the zeros are exactly the multiples of the order. Do not estimate mutual information.
    preregistered_prediction:
      quantity: On this cell the point is on the curve, the group-law order is 12, the first positive
        net zero is 12, and the zeros in 1..24 are exactly 12 and 24.
      formula: 'Curve check: 5^2 = 1^3 + 2 in F_11. Initial net: W(0) = 0, W(1) = 1, W(2) = 2*5 = 10,
        W(3) = 3*1^4 + 2 = 5, W(4) = 4. Doubling recurrences then give W(12) = 0, W(24) = 0, and W(n)
        != 0 for every other n in 1..24.'
      source: The formulas were evaluated in F_11 by a design-time script before any run of this contract.
        They are not a Dickman law and not a mutual-information estimate.
    success_criterion: The run records on_curve true, group_law_order 12, first_positive_zero 12, zeros_match_order_multiples
      true, and zeros equal to [12, 24], at p = 11 and window_end 24.
    falsification_criterion: The run records a complete cell in which on_curve is false, or group_law_order
      is not 12, or first_positive_zero is not 12, or zeros_match_order_multiples is false, or zeros is
      not [12, 24]. That result invalidates the instrument cell and does not decide the mutual-information
      claim.
    decision_impact:
      on_positive: The instrument cell passed. A later amendment may add a rank r >= 2 net and a mutual-information
        table. This pass does not show that small-prime net values leak Lambda_p, and it does not close
        IDEA-20261009-8d09c0.
      on_negative: The instrument cell failed. Do not schedule the sieve null test from this runner. Repair
        the instrument by amendment. Do not read the failure as evidence that net membership is independent
        of Lambda_p.
    stopping_rules:
    - Stop after the single preregistered cell. Do not open another prime or another point in this version.
    invalidation_rules:
    - A crash, timeout, or exception invalidates the instrument run. It is not evidence about sieve independence.
    - Changing p, the curve, the point, or the window after this freeze requires an amendment. It is not
      a rerun of version 1.
    replication:
      seeds: &id001 []
      independent_instances: 1
      seed_policy: Deterministic cell. No seed is drawn. The parent idea's seed base is not consumed.
