        "binary_equivalence_scope": "The tagged Boolean ideals are the exact two chart ideals just defined. They are not asserted equal to the unrestricted S4 ideal over F2 coordinates: S4 may have algebraic-closure intermediate roots not in K12. Every actual K12 signed decomposition has either a finite K12 intermediate sum or O and is covered; each recovered tuple is checked in the group. Duplicate chart/core projections are retained with exact multiplicities/fibers before deduplication.",
        "point_lifts": "For every surviving x tuple enumerate all y in the actual curve field satisfying the curve equation, including repeated/ramified roots once as field points. Enumerate the full Cartesian product of lifts, require [N]P_i=O and nonidentity P_i, and independently check sum_i P_i=R. In odd characteristic P and -P have y signs; in characteristic2 inverse(x,y)=(x,y+x). Subgroup order N is prime. Include repeated x/points, tangencies, x=0 binary doubling, inverse pairs, O intermediate sums and target O controls. No division-by-zero branch is dropped.",
