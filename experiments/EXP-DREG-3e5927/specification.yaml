    "algorithm": {
      "name": "Bounded h-torsion consequences with exact presentation-utility filtering",
      "freeze": "Single fixed strategy; adaptivity consists only of deterministic per-instance acceptance into G. Discovery J is always the original-generator J, preventing cheap witness-degree resets after adding consequences.",
      "steps": [
        {
          "step": 1,
          "action": "Construct, hash and independently validate the exact input/chart and field equations. Keep F, set accepted list A empty, and start separate cost counters. k0 identity mode bypasses the entire preprocessing routine and calls the chosen plain solver with exactly the same bytes and instrumentation policy. Construct and certify M_0(J) as well, including any degree0 original constants, so every later J_D quotient has its exact lower slice."
        },
        {
          "step": 2,
          "action": "For E=1,...,8 construct the full homogeneous Macaulay row set M_E(J): every monomial multiple t*F_i^h with deg(t)=E-d_i>=0. Include every S_E monomial column, even structural zeros; store column universe enumeration and hash. Rows sort by original generator index then monomial order. Degree0 constants and d_i>E exclusions are explicitly logged."
        },
        {
          "step": 3,
          "action": "For D=0,...,E-1 in increasing order, k=E-D. Intersect rowspace(M_E) with the coordinate subspace h^k*S_D. Project back by removing h^k. Compute exact RREF basis of C_Dk and quotient out rowspace(M_D)=J_D, using complete S_D columns. Canonical quotient representatives are the nonzero reduced rows in fixed pivot order. Save exact row-operation witnesses and full-rank/kernel certificates; all failed slices and empty results remain recorded."
        },
        {
          "step": 4,
          "action": "For each representative f remove its largest common h power r, set f_primitive=f/h^r and k_primitive=k+r, leaving certificate construction degree E unchanged. Normalize to monic using the fixed leading term and transport all multiplier coefficients. Record original and primitive representatives, D_h,D,k,E separately. Do not call k or E minimal unless all required lower slices have complete certified nonexistence checks for that exact candidate."
        },
        {
          "step": 5,
          "action": "Check h^k*f=sum_i a_i*F_i^h by a separately implemented sparse polynomial checker before use. Dehomogenize g. Exact-expand g=sum_i delta(a_i)*F_i and check again over the solver field. Reject malformed, zero and duplicate polynomials with reasons; a genuine certificate mismatch invalidates the instrument rather than becoming an ordinary rejected mathematical candidate."
        },
        {
          "step": 6,
          "action": "Build W_deg(g)(F+A) to fixed point by exact full-column RREF; use its canonical residue to decide presentation utility. If residue nonzero append g to A; otherwise record redundant_class and its reduction witness. Charge repeated closures even if incremental data are reused; preserve the actual cache and memory accounting. No sample-dependent threshold or truncation of the canonical basis."
        },
        {
          "step": 7,
          "action": "After all E<=8 slices are completed, run the complete affine solver on F+A, retaining original F. Produce a Gröbner basis and exact certificates, enumerate all finite field/digit roots, perform all chart projection and signed point recovery, and independently check the full outputs. A positive-dimensional homogeneous infinity component is not interpreted as an affine failure."
        }
