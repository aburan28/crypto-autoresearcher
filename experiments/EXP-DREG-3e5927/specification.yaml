        "dehomogenization": "delta_D:S_D -> R_{<=D}, f -> f(z,1), is a vector-space isomorphism. A nonzero homogeneous polynomial cannot have zero affine polynomial image. But [f] in T localizes to zero and delta(f) belongs to I: its affine quotient class is zero. This does not imply its low-degree presentation contribution is zero.",
        "degrees": "D_h=degree of the recorded homogeneous representative, D=degree(delta(f)), k=the recorded h power, E=max degree of terms used in the original homogeneous certificate and the actually constructed search. Primitive representatives have D_h=D. Record all labels and every intermediate matrix degree; solver degree and verification degree can exceed8 and are charged independently. Record E_preprocessing_max and E_all_stages_max separately; never report the latter as <=8 when utility verification or final solver certificate expansion reaches higher degree. The initial E<=8 source arm constrains original-generator torsion-witness discovery; it is not claimed to cap the complete affine solver. Utility certificates may be checked compositionally against already certified accepted generators, but their actual expansions/storage/work are still disclosed.",
        "utility": "W_d(G) is the smallest K-vector subspace of R_{<=d} containing every listed G_i of degree<=d and closed under multiplying any current element by any monomial whenever the product has degree<=d. Build it by full-column exact RREF and multiplication to a fixed point. A candidate g is presentation-useful exactly when g is nonzero and g notin W_deg(g)(F plus previously accepted consequences). This is a presentation invariant at the declared d, not a nonzero quotient class and not a cost-saving assertion.",
