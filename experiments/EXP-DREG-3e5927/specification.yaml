      "orders": "Variables are digit/coordinate block order, low bit first, followed by auxiliary-u low bits for the finite binary chart; h is last/smallest. Degree reverse lexicographic monomial order: larger total degree first; at the last unequal exponent the smaller exponent is larger. Generators keep formula-coordinate order followed by variable field equations; no solver-dependent reordering. Monomials of equal degree enumerate in that order. Module order for certificates is position-over-term (lower original generator index first), solely for serialization/tie-breaking; no signature criterion is used.",
