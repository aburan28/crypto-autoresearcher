        "binary_finite_chart": "m=3, V=span_F2(1,t,t^2,t^3), x_i=sum_{j=0}^3 t^j*z_(i,j). u=sum_{j=0}^11 t^j*v_j. Descend S3(x1,x2,u)=0 and S3(u,x3,x_R)=0 coefficientwise into24 equations over F2, retaining zero equations. Add z^2-z for all24 variables. This is a24-variable actual Boolean system.",
