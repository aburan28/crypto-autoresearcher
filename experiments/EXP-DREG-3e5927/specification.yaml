          "binary": "O+P=P; -(x,y)=(x,y+x). If x1!=x2, lambda=(y1+y2)/(x1+x2), nu=y1+lambda*x1, x3=lambda^2+lambda+x1+x2+A, y3=(lambda+1)*x3+nu. If equal x with inverse ordinates the sum is O. Doubling x=0 gives O; otherwise lambda=x+y/x, x3=lambda^2+lambda+A, y3=x^2+(lambda+1)*x3. Check every output on the curve.",
