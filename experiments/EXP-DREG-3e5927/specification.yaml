        "binary": "Curve field K12=F2[t]/q12(t), q12 lexicographically least monic irreducible polynomial of degree12 under increasing coefficient-bit integer. Curve elements use ordered polynomial basis1,t,...,t^11. Descended solver coefficient field is F2. Irreducibility certificate uses t^(2^12)=t and gcd(t^(2^6)-t,q12)=gcd(t^(2^4)-t,q12)=1. No extension degree or basis substitutions."
