        "prime_S4": "S4(X1,X2,X3,X4)=Res_T(S3(X1,X2,T),S3(X3,X4,T)), formed as the universal polynomial before specializing X4=x_R and before digit substitution. Use the full Sylvester determinant of the two degree2 polynomials with structural leading coefficients retained; do not compute a degree-dropped specialized resultant and silently change exceptional roots.",
