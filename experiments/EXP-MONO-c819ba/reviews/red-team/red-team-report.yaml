  float_tolerance_check:
    question: "Does the dual-path 3.9e-9 excess at m=4 touch the J0/F=N/2 finding?"
    answer: NO
    evidence:
      - "The two real-arm cells exceeding the declared 1e-10 are RO4|N/2 m=4 (3.923e-9) and J1728|N/2 m=4 (9.173e-10). J0|N/2 m=4's own l1_relative_residual is 3.991e-11 -- WITHIN the declared tolerance."
      - >-
        Code path verified: conv.py exact_stats computes the primary variance as
        (sumsq*N - total^2)/(N*N) with sumsq accumulated in numpy `object` dtype, i.e.
        Python arbitrary-precision integers. The numerator is EXACT; only the final division
        is float, with relative error ~1e-16. run_experiment.py's L2 is built from
        per_m[m]["var_ordered"], which is that exact quantity. So L2 at J0|N/2 rests on
        exact-integer arithmetic, not on the float character side.
      - >-
        L3 is the one metric that does depend on the float path: C comes from
        numpy.fft2 (conv.py max_C), not exact roots of unity. But C enters at the FIRST
        power, and the FFT2 of an 18x18 0/1 array carries relative error ~1e-14 -- twelve
        orders of magnitude below the 16.5% effect claimed. Not implicated. Independently
        confirmed: my own reimplementation reproduces C = 30.468844766859 against the
        archived 30.468844766858634.
      - >-
        The 3.9e-9 residual scales with |Shat|^{2m} at m=4 and with N, which is why it
        appears on the two largest-N cells only. The Executor's disclosure and diagnosis of
        it are correct.

  proof_architecture_challenges:
    - id: PA-1
      attack: observation-fiber
      finding: >-
        The hypothesis's own observation_collision block declares that no straddling
        collision exists "because the conclusion IS a statement about the observable". That
        is right for (I1)-(I3) but WRONG for the escalation actually made. The escalation's
        observable is not Var itself but the LABEL band(Var_real/mean_30_null). I placed two
        preimages on opposite sides of that label with the same underlying object class: the
        SAME J0 curve at the SAME F=162 yields ABOVE_BAND at 30 draws and IN_BAND at 200
        draws (L3 1.165 -> 1.133). The missing separator is the null-estimator's own
        variance, which the label does not carry.
    - id: PA-2
      attack: quantifier-order
      finding: >-
        The escalation silently chooses its witness after seeing the outcome. The quantifier
        the report's language invites is "there exists a curve family (j=0) such that for all
        F=N/2 cells the deviation is above band"; what was licensed is "there exists ONE
        (curve, F, m) cell, selected after inspecting 96 comparisons, above band". OBJ-2 and
        OBJ-3 show the first quantifier is false: neither "for all j=0 curves" (12.1%) nor
        "for all F rungs of this curve" (erratic) survives.
    - id: PA-3
      attack: nearby-object / proves-too-much
      finding: >-
        Run the escalation argument unchanged against objects where its conclusion is known
        false. (a) J1728, extra automorphisms, same panel: IN_BAND -- the argument does not
        fire where it should. (b) 130 random-ordinary curves, no extra structure and no CM,
        where "exceptional locus" is by construction not expected: the argument fires MORE
        often (20.0% vs 12.1%) -- the argument fires where it must not. (c) A pure null
        object: the argument fires 38.2% of the time. The survival point is the step where
        "reproducible across two seeds" is read as evidence about the real arm; because the
        real arm is deterministic, that step transfers unchanged to any object whatsoever,
        including a random subset. THAT LOCATION IS THE FINDING.
    - id: PA-4
      attack: method-ceiling
      finding: >-
        The largest claim this instrument can support at 30 draws and 96 comparisons is an
        effect of roughly 3 null-sd, i.e. L2_m4 around 2.5-4 at typical cv, reproducible
        across independent CURVES rather than seeds. The archived J0 cell reaches +2.19 sd
        in one seed and +0.67 in the other. The ceiling does not reach the headline, and it
        could have been derived before the run from the pre-registered draw count alone.

  what_the_reported_quantity_should_have_done:
    parameter_that_must_destroy_the_signal_1:
      parameter: number of null draws
      expected_if_real: "L2 and L3 point estimates stable; only their uncertainty shrinks."
      observed: "L3 1.165/1.170 (30 draws) -> 1.133 (200 draws), crossing below the band; L2_m4 1.873/1.571 -> 1.435. THE POINT ESTIMATE MOVED. Artifact tell."
    parameter_that_must_destroy_the_signal_2:
      parameter: the curve, holding j=0 fixed
      expected_if_real: "Enrichment on j=0 curves relative to matched ordinary curves."
      observed: "12.1% vs 20.0%, i.e. DE-enrichment (Fisher p = 0.092). Artifact tell."
    parameter_that_must_destroy_the_signal_3:
      parameter: F, scanned finely through N/2
      expected_if_boundary_or_orbit_driven: "A feature at F = N/2 (boundary story) or a signal at every rung (orbit story)."
      observed: "A smooth monotone ramp with F=N/2 not a local maximum, and erratic behaviour across rungs on other curves. Both stories fail."
    null_object_control:
      requested: "Identical measurement with a random symmetric subset in the real arm's slot."
      result: "Full escalation criterion fires 38.2% of panels; weak criterion 99.6%. THIS IS A CONTROLLED NULL, NOT A FINDING."

  what_i_am_NOT_saying:
    - "I am NOT saying the run is wrong. I reproduced its J0/F=N/2 numbers to 12+ significant digits with an independent implementation. The measurements are correct."
    - "I am NOT saying the Executor overclaimed. The execution report escalates rather than adjudicates and says so repeatedly. My target is the escalation's evidential weight."
    - "I am NOT saying no exceptional locus exists. This experiment has no power to say that, and OBJ-8 identifies a systematic effect that IS present and was not read."
    - "I am NOT converting this into an impossibility result, a closure of KN-OPEN-009, or a negative about the character-bias reduction. (I1)-(I3) are derivations and are untouched by anything here."
    - "I am NOT rejecting the conditional (P2) for being conditional on HEUR-CHR-2."

  narrowest_supported_statement: >-
    On the declared 8-curve panel over primes in [100, 3000], with exhaustive target
    enumeration and 30 matched null draws per cell, the exact identities held at every
    tested cell, the subgroup positive control returned exactly N/h - 1 with C/F exactly 1
    on all four arms, the coset-union control matched its closed form to ~1e-14, the m=3,4
    F-ladder decayed monotonically at 24/24 cells, and the L2/L3 ratios fell inside their
    pre-registered bands at every cell except a small number attributable to the decision
    rule's own null-object false-positive rate. NO CELL IN THE PANEL, INCLUDING J0 AT
    F = N/2, REACHES A NOMINAL ONE-SIDED EMPIRICAL p OF 0.05 AGAINST A 200-DRAW NULL BEFORE
    ANY CORRECTION FOR THE 96 COMPARISONS MADE. The pre-registered outcome
    future_controlled_null_toy is what this run supports, and its forward guidance F7 is
    therefore due.
    SEPARATELY AND MORE INTERESTINGLY: the run contains an unread, curve-family-general
    signal in the OTHER pre-registered direction. Against 200-draw nulls the x-prefix factor
    base has LOWER m=4 second moment than a matched random symmetric subset at 22 of 32
    archived cells (median L2_m4 = 0.757), and across my 254 new curves the median L2_m4 at
    F = N/2 is 0.892 (j=0) and 0.904 (ordinary), with m=4 BELOW_BAND outnumbering ABOVE_BAND
    about 2:1 at every rung in both families. That is the hypothesis's own "MORE uniform than
    random, which is also a finding" branch. I state it as a direction to measure, NOT as an
    established result: the archived cells are not independent, and my nominal sign test
    (p = 0.050) overstates the evidence accordingly.

  spawned_ids_candidates_not_evidence:
    - >-
      A follow-up measuring whether the small-x prefix factor base is systematically MORE
      uniform than a matched random symmetric subset, with curve-level independence (one
      cell per curve, many curves), an exact permutation p-value, and a pre-registered
      one-sided direction. This is the reversal of the obstruction the run just measured:
      the same numbers that fail to support an exceptional locus are the numbers that would
      support a uniformity statement about the actual index-calculus factor base, which is
      the more useful direction for KN-OPEN-009 anyway. Candidate for the ranking; NOT
      evidence and NOT a status change.

  next_concrete_action: >-
    Do NOT open a KN-FIND for the J0/F=N/2 cell, and do NOT record it as an
    exceptional-locus candidate or as a j=0-automorphism artifact -- both readings are
    falsified above. Instead, the Coordinator should commission ONE follow-up run of the
    existing instrument, unchanged except for four parameters, all affordable inside the
    original 7200 s budget (the archived run used 1.9 s): (1) 200 null draws per cell
