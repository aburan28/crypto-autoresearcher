red_team_report:
  id: RT-20260830-c819ba
  task_id: red-team-mono7-c819ba
  experiment_id: EXP-MONO-c819ba
  hypothesis_id: H-MONO-663fb4
  snapshot_reviewed:
    commit_sha: 11a79965469a895abb4f97b464d97cf548b480c3
    receipt: coordination/tasks/TASK-20260830-48eb5c/snapshot-receipt.json
    content_verification: >-
      All 24 declared research artifacts re-hashed and matched byte-for-byte against
      path_sha256. The 25th key (the receipt's own path) carries an explicit null value
      per the receipt's self-neutral convention, so it is not a mismatch. Working tree
      HEAD == 11a799654. Snapshot is content-verified.

  claim_under_review: >-
    The escalated Executor observation (execution_report.yaml,
    finding_J0_at_F=N/2_reproducible_across_both_seeds): that the j=0 panel curve J0
    (p=307, A=0, B=6, N=324) at F=N/2=162 shows a SINGLE reproducible, well-behaved-null
    ABOVE_BAND deviation (L2 m=4 = 1.873/1.571; L3 = 1.165/1.170), and that this is a
    live candidate either for KN-OPEN-009's exceptional locus or for the j=0
    extra-automorphism artifact KN-OPEN-009's own caveat anticipates.
    NOTE: the Executor explicitly does not adjudicate this. What I attack is the
    escalation's evidential standing, not a claim the Executor made.

  verdict: breaks
  verdict_scope: >-
    BREAKS on J2 (adversarial verification) for the escalated interpretation only. The
    run's arithmetic, identities, controls and raw numbers HOLD: I independently
    reimplemented the whole instrument (own Tonelli-Shanks, own EC arithmetic, own group
    structure, own coordinate map, own convolution and FFT) and reproduced the archived
    J0/F=N/2 cell to 12+ significant digits (C = 30.468844766859 vs archived
    30.468844766858634; var_m2/m3/m4 = 66.228395062 / 31683.598765432 / 21005603.425925925,
    identical). The J0/F=N/2 cell is not a bug. It is a correct measurement read through a
    decision rule that does not discriminate.

  headline_findings:
    - >-
      OBJ-1 KILLS THE AUTOMORPHISM STORY. The order-3 automorphism is real and the FULL
      factor-base pool is invariant under it, but the arm actually measured is not: the
      ascending-x prefix at F=162 SPLITS 40 of 49 touched omega-orbits and only 82 of its
      162 points have their sigma-image inside the prefix. Its orbit structure is
      statistically indistinguishable from a uniformly random selection (9 whole orbits
      observed vs 7.26 expected). The clean "automorphism invariance" explanation is
      REFUTED for the measured object, not merely unconfirmed.
    - >-
      OBJ-2 KILLS THE j=0 STORY. I built 124 NEW j=0 curves over 60+ primes p = 1 mod 3 in
      [151, 997] (all panel primes and 421 excluded) plus 130 matched random-ordinary
      curves, identical construction rule, 30 nulls, 2 seeds. Both-seed ABOVE_BAND at
      m=4: j=0 15/124 = 12.1%; random-ordinary 26/130 = 20.0% (Fisher two-sided p = 0.092,
      in the direction OPPOSITE to the hypothesis). The Executor's full escalation
      criterion: j=0 1/124 = 0.8%; ordinary 2/130 = 1.5%. THE SIGNAL REPRODUCES ACROSS
      CURVES BUT SHOWS NO j=0 ENRICHMENT WHATEVER.
    - >-
      OBJ-3 KILLS THE F=N/2 STORY. A fine F-scan on the archived J0 curve (F = 130..198
      step 4, 40 draws each) shows L2_m4 rising SMOOTHLY 0.34 -> 1.45 (at F=162) -> 1.85
      (at F=198). F=N/2 is not a local maximum and not a boundary event; the ladder simply
      sampled one point on a ramp.
    - >-
      OBJ-4 KILLS THE DECISION RULE. Null-object control on the archived panel, 3000
      replicates: with a held-out random symmetric subset placed in the real arm's slot,
      P(at least one of 32 cells is reproducibly ABOVE_BAND at m=4 in both seeds) = 0.996,
      and P(at least one cell meets the Executor's FULL escalation criterion) = 0.382. A
      reproducible single-cell exceedance is not rare; it is near-certain.
    - >-
      OBJ-5 THE SIGNAL DISSOLVES WHEN THE NULL IS MEASURED PROPERLY. With 200 independent
      null draws instead of 30, J0/F=N/2 gives L2_m4 = 1.435 (empirical one-sided
      p = 0.169, rank 167/200) and L3 = 1.133 -- BELOW the 1.15 band. The L3 flag, the
      only metric ABOVE_BAND in both seeds, does not survive raising the draw count. The
      smallest empirical p over all 32 cells is 0.124 (RO1|N/16, not J0). Bonferroni over
      32 comparisons = 1.000; over 96 = 1.000.
    - >-
      OBJ-6 THE CONTRACT'S OWN ORDERING CONTROL FIRED AND ITS PRESCRIBED REMEDY WAS NOT
      APPLIED. specification.yaml ordering_control: "If the rule emits the same label on
      the null and on the treatment arm, it discriminates nothing and must be rewritten
      before any treatment output is read." The null arm's own label is out-of-band at 55
      of 192 (cell x m x run) combinations and ABOVE_BAND at 17 of them -- including
      CM1|N/2 at m=4 with ratio 6.378, which is 3.4x the J0 treatment value the control is
      being used to certify.

  objections:
    - id: OBJ-1
      severity: fatal_to_the_named_mechanism
      target: >-
        The candidate explanation named (not confirmed) in execution_report.yaml and in
        the task framing: that J0's extra automorphism group explains the signal.
      claim_attacked: >-
        That f(x) = x^3 + B is omega-invariant, hence the factor base is orbit-structured,
        hence the F=N/2 truncation inherits an invariance the null draws lack.
      what_i_verified_independently:
        - "307 = 1 mod 3; omega = 289 is a primitive cube root of unity (289^3 = 1 mod 307, 1 + omega + omega^2 = 0 mod 307)."
        - "f(omega*x) = f(x) VERIFIED for all 307 values of x with f(x) = x^3 + 6. TRUE."
        - "sigma:(x,y) -> (omega*x, y) VERIFIED to be a group automorphism of E(F_307) (homomorphy checked on 300 random point pairs) of exact order 3 (sigma^3 = id on all 320 affine points). TRUE."
        - "QR-status of f(x) is therefore exactly constant on {x, omega*x, omega^2*x}, and the FULL QR-x pool (320 points / 160 x-values = 1 fixed point {x=0} + 53 orbits of size 3) IS sigma-invariant. TRUE."
      where_it_breaks: >-
        THE ARM ACTUALLY MEASURED IS NOT ORBIT-STRUCTURED. The run's truncation
        (run_experiment.py ladder_fb -> cs.fb_full[:target]) is a prefix of the ASCENDING-x
        scan, which is not orbit-aware. Measured split fractions of touched x-orbits:
        N/16 0.900 (1 whole, 9 split), N/8 0.944 (1/17), N/4 0.967 (1/29),
        N/2 0.816 (9 whole, 40 split). At every rung below N/2 the single "whole" orbit is
        just the singleton {x=0}. As a point set the F=162 prefix is NOT sigma-invariant:
        only 82 of its 162 points have their sigma-image inside it.
      null_object_for_the_orbit_claim: >-
        Under a UNIFORMLY RANDOM choice of 81 of the 160 pool x-values, the expected number
        of wholly-contained size-3 orbits is 53*C(157,78)/C(160,81) = 6.75, plus 0.51 for
        the singleton = 7.26 expected. OBSERVED 9. That is roughly +0.7 sd. The prefix's
        orbit structure is INDISTINGUISHABLE FROM RANDOM.
      internal_disconfirmation_the_run_already_held: >-
        J1728 (p=1013, A=594, B=0) also has an extra automorphism group (order 4) and is on
        the same panel under the same rule. At F=N/2 it is IN_BAND on every metric in both
        seeds (L2_m4 1.200/0.944; L3 1.028/0.991). If "extra automorphisms" were the
        mechanism, the panel's other extra-automorphism curve should show it. It does not.
      conclusion: >-
        The automorphism explanation is REFUTED for the object measured, not merely
        unconfirmed. Any future record that writes it down as the explanation is writing
        down something I have falsified here. Something else is happening -- and OBJ-2
        identifies it as nothing curve-specific at all.

    - id: OBJ-2
      severity: fatal_to_the_escalated_finding
      target: "The claim that the J0/F=N/2 signal is a candidate for a j=0-class or CM-class exceptional locus."
      the_decisive_experiment: >-
        THE TEST THE ARCHIVED RUN COULD NOT PERFORM (its panel has exactly one j=0 curve).
        I constructed 124 NEW j=0 curves (A=0) over primes p = 1 mod 3 in [151, 997], two
        distinct twist classes (distinct N) per prime, excluding every panel prime
        {127,157,307,1013} and EXP-MONO-12ce1c's 421, all verified ordinary (t != 0 mod p);
        and 130 matched random-ordinary curves at primes in [151, 997] chosen by a hash rule
        independent of the Executor's seed stream. Construction rule replicated from the
        frozen contract's own text and cross-checked against curve.py / run_experiment.py:
        ascending-x pool of points with f(x) a nonzero QR, both roots; F = N//2 rounded down
        to even; prefix. Null: 30 uniformly random symmetric subsets of matched size, drawn
        as +/- pairs, rejection-sampled, per controls.py. Metrics: L2 = Var_real /
        mean(Var_null over draws 1..29) at m=3,4 and L3 = (C/F)_real / mean over all 30, with
        bands [0.7,1.4] and [0.85,1.15] -- the Executor's exact conventions. Two seeds
        (20260805, 20260806) per curve, as in the archived run.
      results:
        j0_curves: 124
        random_ordinary_curves: 130
        both_seed_ABOVE_BAND_m4: {j0: "15/124 = 12.1%", random_ordinary: "26/130 = 20.0%", fisher_two_sided_p: 0.092}
        both_seed_ABOVE_BAND_L3: {j0: "5/124 = 4.0%", random_ordinary: "10/130 = 7.7%"}
        both_seed_ABOVE_at_m3_AND_m4: {j0: "8/124 = 6.5%", random_ordinary: "15/130 = 11.5%"}
        executor_full_escalation_criterion: {j0: "1/124 = 0.8%", random_ordinary: "2/130 = 1.5%"}
        median_L2_m4_over_curve_seed_cells: {j0: 0.892, random_ordinary: 0.904}
        per_cell_m4_out_of_band_rate: {j0: "44.8%", random_ordinary: "56.9%"}
      where_the_archived_value_sits: >-
        Pooling my 508 new curve-seed cells at F=N/2: the archived J0 values L2_m4 =
        1.873 and 1.571 sit at the 92.1st and 87.0th percentile; L3 = 1.165 at the 93.7th.
        High-ish and entirely ordinary. The largest in my sweep is a RANDOM-ORDINARY curve
        (p = 971, N = 1032): L2_m4 = 5.027 / 4.267, L3 = 1.444 / 1.427 -- far beyond
        anything J0 shows, on a curve with no extra automorphisms and no CM.
      answer_to_the_decisive_question: >-
        NO. A second, third, ... 124th independent j=0 curve does NOT show the above-band
        signal preferentially. The effect reproduces across curves, but as a generic
        property of the small-x prefix construction that appears on ordinary curves AT
        LEAST AS OFTEN as on j=0 curves. The archived run's single J0 curve did not hit a
        p=307-specific number-theoretic fluke either -- it hit the ordinary upper tail of a
        wide, curve-family-general distribution.

    - id: OBJ-3
      severity: fatal_to_the_boundary_reading
      target: "The implicit claim that F=N/2 is where the effect lives."
      new_curve_ladder: >-
        46 new j=0 and 49 new random-ordinary curves, all four rungs {N/16,N/8,N/4,N/2},
        2 seeds. Per-cell m=4 out-of-band rate is 52-69% at EVERY rung for BOTH families
        (j0: 52.2/60.9/56.5/54.3; ro: 54.1/69.4/53.1/61.2). Both-seed ABOVE at m=4 peaks at
        N/4 for j=0 (21.7%) and at N/2 for random-ordinary (22.4%). N/2 is not implicated.
      erratic_across_rungs: >-
        The 6 new j=0 curves flagged at N/2 are erratic across the ladder, e.g. p=367,
        N=333: N/16 1.36/1.58, N/8 0.43/0.41, N/4 1.19/1.00, N/2 4.36/3.24. This is
        inconsistent BOTH with an orbit-invariance mechanism (which would act at every
        truncation size) AND with a stable curve-level property.
      fine_grid_scan_on_the_archived_J0_curve: >-
        F = 130..198 step 4, 40 fresh null draws per F. L2_m4 rises smoothly and almost
        monotonically: 0.344 (F=130), 0.593 (146), 0.930 (158), 1.446 (162 = N/2 exactly),
        1.236 (166), 1.181 (174), 1.727 (182), 1.831 (194), 1.847 (198). L3 tracks it:
        0.805 -> 1.128 (at 162) -> 1.191 (at 194). F = N/2 IS NOT A LOCAL MAXIMUM. The
        ladder sampled one arbitrary point on a smooth ramp and the band happened to be
        crossed there.
      panel_CM_and_j1728_spot_check_from_the_ARCHIVED_data:
        CM1_F_N_over_2: "L2_m3/m4 = 0.894/0.721 (run1), 0.815/0.592 (run2); L3 = 0.936/0.946. IN or BELOW."
        CM2_F_N_over_2: "L2_m3/m4 = 0.633/0.412 (run1), 0.496/0.276 (run2), BELOW_BAND both seeds; L3 = 0.965/0.913."
        J1728_F_N_over_2: "L2_m3/m4 = 1.205/1.200 (run1), 1.099/0.944 (run2); L3 = 1.028/0.991. IN_BAND both seeds."
        reading: >-
          Of the four panel curves with extra structure (J0, J1728, CM1, CM2) at F=N/2, one
          is above, two lean below, one is in band. There is no hint of a shared pattern.

    - id: OBJ-4
      severity: fatal_to_the_decision_rule
      target: "The escalation criterion itself, and the claim that reproducibility across two seeds is evidential."
      the_control_i_ran: >-
        NULL-OBJECT CONTROL, the one docs/inventor-protocol.md section 3 demands and the
        run did not perform at panel level. I cached 200 independent null draws per cell for
        all 32 archived panel cells, then ran 3000 replicates of the ENTIRE 32-cell,
        two-seed decision procedure with a held-out random symmetric subset placed in the
        real arm's slot (seed1 population = 30 draws, seed2 population = 30 disjoint draws).
      results:
        P_at_least_one_cell_reproducibly_ABOVE_BAND_m4_both_seeds: 0.996
        P_at_least_one_cell_meets_full_executor_escalation_criterion: 0.382
        mean_escalation_cells_per_panel: 0.49
        most_frequently_flagged_null_cells: "J1728|N/2 0.03, RO4|N/8 0.03, RO4|N/16 0.03, J1728|N/8 0.03, J1728|N/4 0.03"
      reading: >-
        Item 4 answered with numbers: a reproducible single-cell exceedance is NOT rare and
        is NOT surprising. Under a pure null object it is essentially certain (99.6%) at the
        weaker reading, and it clears the Executor's FULL criterion -- including the L3
        both-seed requirement and the null-vs-null gate -- 38.2% of the time. One
        escalation-criterion cell per two panels is the null-object baseline. The archived
        panel produced exactly one.
      why_two_seeds_buys_almost_nothing: >-
        The real arm is DETERMINISTIC. Both seeds compare the same fixed real value against
        two independent null populations, so seed-to-seed agreement measures the stability of
        a 30-draw mean, not the reality of the effect. Two seeds is a replication of the
        NULL, not of the SIGNAL. This is why the null-object rate above is so high.

    - id: OBJ-5
      severity: fatal_to_the_reported_effect_size
      target: "L2 = 1.873/1.571 and L3 = 1.165/1.170 as estimates of anything."
      the_cheapest_discriminating_control_and_its_result: >-
        Raise the null draw count. With 200 independent draws per cell instead of 30, at
        J0|N/2: L2_m4 = 1.435 (down from 1.873 and 1.571), with the real value at rank
        167/200 -- empirical one-sided p = 0.169; and L3 = 1.133, which is BELOW the 1.15
        band. THE ONLY METRIC THAT WAS ABOVE_BAND IN BOTH SEEDS DOES NOT SURVIVE THE DRAW
        COUNT INCREASING. The 30-draw null mean was noisily low; that, not the real arm,
        moved.
      the_whole_panel_at_200_draws: >-
        Smallest empirical one-sided p over the 32 cells is 0.124 (RO1|N/16), not J0.
        J0|N/2 at m=4 is the 5th most extreme cell. J0|N/2's C/F p = 0.139 is the most
        extreme C/F of the 32. NO CELL REACHES NOMINAL p = 0.05 EVEN UNCORRECTED. The
        experiment's own comparison count is 32 cells x (m=3, m=4, L3) = 96; Bonferroni over
        32 gives 1.000 and over 96 gives 1.000.
      z_score_reanalysis_of_the_ARCHIVED_data: >-
        Measured against each cell's OWN 30-draw null sd -- which is what the hypothesis's
        K7 actually asks for ("beyond 3 sigma") -- J0|N/2 is z_m4 = +2.19 / z_L3 = +1.72 in
        run 1 and z_m4 = +0.67 / z_L3 = +1.43 in run 2. Not 3 sigma in either seed, and a
        factor of three apart between seeds at m=4. The fixed multiplicative band flagged it
        only because J0|N/2 happens to have a TIGHT null population (cv = 0.398 in run 1)
        while most cells have cv 0.3-2.5. The band is a mismatched yardstick: it converts
        "this cell's null is tight" into "this cell's real arm is exceptional."
      discarded_larger_signal: >-
        By the same z-score reading, the largest deviation anywhere in the archived panel is
        RO1 (a RANDOM-ORDINARY curve) at F = N/16: z = +9.51/+6.99/+5.71 at m=2/3/4 in run 2
        and +3.39/+3.18/+2.91 in run 1, same sign in both seeds. The Executor discarded it as
        noise-dominated on the null-vs-null gate and promoted J0/F=N/2 on the same gate. The
        triage rule is therefore not applied symmetrically. (I do not claim RO1|N/16 is real
        -- F=6 with N=117 is a degenerate corner, and its 200-draw p is 0.124. I claim the
        triage is inconsistent.)

    - id: OBJ-6
      severity: protocol_compliance
      target: "The Executor's use of the null-vs-null ordering control."
      what_the_frozen_contract_says: >-
        specification.yaml ordering_control: "The frozen decision rule is executed on the
        NULL first and its label recorded. If the rule emits the same label on the null and
        on the treatment arm, it discriminates nothing and must be rewritten before any
        treatment output is read."
      what_the_data_shows: >-
        Across both runs the null arm's OWN label is out-of-band at 55 of 192 (cell x m x
        run) combinations = 28.6%, and ABOVE_BAND at 17 of them: run1 J0|N/8 (m3 1.609, m4
        2.133), J1728|N/8, J1728|N/4, CM1|N/2 (m2 1.444, m3 3.082, m4 6.378); run2
        RO1|N/16, RO2|N/2 (m4 2.349), RO3|N/2 (m4 1.491), CM2|N/4 (m4 2.740). CM1|N/2's
        null-arm value of 6.378 is 3.4x the J0 treatment value the control is being used to
        certify as exceptional. By the contract's own text the rule discriminates nothing at
        m=3,4 and had to be rewritten before any treatment output was read.
      what_was_done_instead: >-
        The per-cell null-vs-null label was repurposed from a GLOBAL rule-validity gate into
        a PER-CELL noise screen: cells where it was out-of-band were discarded as
        "noise-dominated" and J0|N/2, where it happened to be in band, was promoted. That
        inverts the control's stated function.
      why_the_gate_is_uninformative_anyway: >-
        It is a single-draw statistic: null1's variance against the mean of the other 29.
        Its own sd is approximately the null population's coefficient of variation, which at
        m=4 ranges 0.30 to 2.48 across the archived cells. An IN_BAND label on null1 is close
        to a coin flip and carries almost no information about whether "the null population
        is well-behaved."
      the_specific_overstatement: >-
        execution_report.yaml states, at the load-bearing step of the escalation: "the
        null-vs-null ordering control is IN_BAND in BOTH runs (the null population is
        well-behaved, not noise-dominated)". The parenthetical does not follow from the
        label. And the archived null sd at that very cell gives m=4 cv = 0.398 (run1) vs
        0.853 (run2) -- a factor of 2.1 between seeds in the exact quantity asserted to be
        stable. This is a characterization error, and it is the sentence the escalation
        rests on.

    - id: OBJ-7
      severity: methodological
      target: "The graded_control_1 (F-ladder) evidence at m=2."
      finding: >-
        max_rel_dev at m=2 is 15/7/3/1.0172 (RO1), 15/7/3/1 (RO3), 15.2/7.1/3.05/1 (J0),
        16.5/7.75/3.1176/1 (CM1) across N/16, N/8, N/4, N/2. These are N/F - 1 to within
        rounding on every curve -- the SAME closed form as the subgroup positive control.
        At m=2 the statistic is pinned at its combinatorial floor because some R has
        N_2(R) = 0, so it cannot vary with the curve at all. Reporting the m=2 column as
        evidence that the ladder "decays as (I3) predicts" is reporting a control that
        cannot fail, which is precisely the failure mode H-MONO-663fb4's own mechanism
        step (2) cites KN-TECH-1a5b7e for. (Credit: at m=3 and m=4 the decay is real and
        monotone at 24/24 cells; the Executor's "no artifact-tell anywhere" claim is
        accurate and I verified it.)

    - id: OBJ-8
      severity: asymmetric_reading_of_a_two_sided_preregistration
      target: "Which branch of the pre-registered two-sided prediction the run actually landed on."
      finding: >-
        H-MONO-663fb4 pre-registers BOTH directions: "A ratio above the band is the
        exceptional locus this goal was created to find ... a ratio below it means the
        factor base is MORE uniform than random, which is also a finding." Measured against
        200-draw nulls, the real arm's m=4 variance is BELOW the null mean at 22 of 32
        archived cells (median L2_m4 = 0.757, geometric mean 0.794); across my 254 new
        curves the median L2_m4 at F=N/2 is 0.892 (j=0) and 0.904 (random-ordinary), and
        the m=4 BELOW_BAND count exceeds the ABOVE_BAND count roughly 2:1 in every family
        and at every rung. The aggregate direction of this experiment is DOWNWARD, not
        upward. The Executor reported the per-cell BELOW counts (11 and 10 at m=4) but never
        aggregated them into the statement the hypothesis pre-registered for that branch,
        and escalated the single upper-tail cell instead.
      caution_i_impose_on_my_own_objection: >-
        The nominal two-sided sign test gives p = 0.050, but the 32 cells are NOT
        independent (four rungs of each of eight curves), so that p is optimistic. I state
        this as a direction worth measuring properly, NOT as an established result. See
        next_concrete_action.

  required_controls:
    - id: RC-1
      name: null-object control at panel level
      status: RUN BY ME, FAILED BY THE PROCEDURE
      statement: >-
        Place a held-out random symmetric subset in the real arm's slot and run the entire
        32-cell, two-seed decision procedure. Result: full escalation criterion fires on at
        least one cell 38.2% of the time; the weaker "reproducibly ABOVE_BAND at m=4 in both
        seeds" fires 99.6% of the time. This control must precede any belief in a single-cell
        escalation, and it is cheap (11s to cache 200 draws per cell for the whole panel).
    - id: RC-2
      name: second independent curve of the same family
      status: RUN BY ME, NO ENRICHMENT FOUND
      statement: >-
        124 new j=0 curves vs 130 matched random-ordinary curves. j=0 is flagged LESS often.
        Any future exceptional-curve claim in this program must clear this control before
        escalation, not after.
    - id: RC-3
      name: draw-count sensitivity
      status: RUN BY ME, SIGNAL DISSOLVES
      statement: >-
        Recompute the flagged cell at 200 draws. L3 falls from 1.165/1.170 to 1.133, below
        band; L2_m4 falls from 1.873/1.571 to 1.435 (p_emp = 0.169). A signal that shrinks
        toward 1 as the null estimate improves is an artifact of the null estimate.
    - id: RC-4
      name: fine-grid parameter scan through the flagged point
      status: RUN BY ME, NO BOUNDARY EVENT
      statement: >-
        Scan F through the flagged value. The statistic is a smooth ramp with no feature at
        F = N/2. Any claim localized to a ladder rung must show the rung is a feature and not
        a sampling point.
    - id: RC-5
      name: within-panel mechanism control that already existed
      status: AVAILABLE IN THE ARCHIVED DATA, NOT USED
      statement: >-
        J1728 is the panel's other extra-automorphism curve and is IN_BAND at F=N/2 in both
        seeds on every metric. This alone falsifies the automorphism explanation without any
        new computation, and it is in the run's own raw-result.json.
    - id: RC-6
      name: replace the fixed multiplicative band with a null-referenced quantile
      status: REQUIRED BEFORE ANY FURTHER RUN OF THIS INSTRUMENT
      statement: >-
        The bands [0.7,1.4] and [0.85,1.15] were pre-registered without knowing the null's
        dispersion, and the null's own m=4 coefficient of variation ranges 0.30-2.48 across
        cells. A fixed multiplicative band therefore has a per-cell false-positive rate
        varying by an order of magnitude. Report the real arm's rank within the null
        population (an exact permutation p-value), then correct for the 96 comparisons.

  counterexample_or_mutation:
    cheapest_single_discriminator: >-
      One new j=0 curve at any other prime p = 1 mod 3, at F = N/2, with 30 nulls and 2
      seeds. Cost: about 0.2 seconds. I ran 124 of them in 40 seconds. This was available
      inside the run's own 7200-second budget, of which 1.9 seconds were used.
    explicit_counterexamples_found:
      - "p=971, A=162, N=1032, random ordinary (no CM, no extra automorphisms): L2_m4 = 5.027/4.267, L3 = 1.444/1.427 -- meets and far exceeds every threshold J0 met, on a curve where the proposed mechanism cannot apply."
      - "p=379, A=143, N=365, random ordinary: L2_m4 = 2.429/2.291, L3 = 1.184/1.178 -- meets the Executor's FULL escalation criterion including the null-vs-null gate."
      - "p=743, A=604, N=736, random ordinary: L2_m4 = 2.012/1.844, L3 = 1.227/1.192 -- likewise meets the full criterion."
      - "J1728 on the archived panel: extra automorphism group, IN_BAND both seeds at F=N/2. The mechanism's own nearby object, already present, already negative."
    mutation_that_would_have_exposed_it_at_authoring_time: >-
      Replace the real arm by a 31st null draw and re-run the panel decision procedure once.
      That single mutation returns an escalation on ~1 panel in 2.6.

  heuristic_challenges:
    - id: HC-1
      heuristic: HEUR-CHR-2 (C = O(sqrt(N) log N) for the full x-coordinate factor base)
      challenge: >-
        NOT falsified and NOT confirmed by this run, and the report says so correctly. But
        the fitted toy exponent 0.0801 is derived from FOUR points over a 9x span in N with
        NO uncertainty interval and no residual reported. Four points cannot separate
        0.0801 from 0 (an O(1) C with a slowly varying constant) at this span; the record
        should carry that explicitly rather than only "NEVER EXTRAPOLATED". The random-model
        transfer question also stands unaddressed: the x-coordinate factor base is a
        MINIMAL-x structured set, not a uniformly random symmetric subset, and OBJ-8 above
        is direct evidence that its second moment is systematically displaced from the
        random model in the DOWNWARD direction. That displacement is the cheapest available
        probe of HEUR-CHR-2's transfer and it was measured but not read as such.
    - id: HC-2
      heuristic: >-
        The unnumbered heuristic actually load-bearing for the escalation: that a
        pre-registered fixed multiplicative band is a valid decision rule at m=3,4 with 30
        draws.
      challenge: >-
        This assumption is nowhere numbered in H-MONO-663fb4's heuristic_assumptions
        (HEUR-CHR-1..4) and it is the one that fails. Under a null object the rule's
        panel-level false-escalation rate is 38.2%. An implicit, unnumbered assumption
        carrying the entire escalation is an objection under the exemplar profile's
        heuristic-inventory requirement.
    - id: HC-3
      heuristic: "HEUR-CHR-3 (ordered N_m is the relation event up to an m-only convention factor)."
      challenge: >-
        Stage 1 correctly found this is FALSE as an equality: KN-FIND-007's mean is
        C(B+m-1,m)/N and (I1)'s is F^m/N, and these are not related by an m-only factor at
        finite F. The report handles this honestly. I add only that the run's own
        var_multiset is computed as var_ordered/(m!)^2 (conv.py cell_stats), i.e. by
        ASSUMING the m!-only convention factor that Stage 1 just showed does not hold
        exactly. The "both conventions reported" control is therefore weaker than it reads:
        the second convention is a deterministic rescaling of the first, not an independent
        count, which is why max_rel_dev is "IDENTICAL between conventions by construction".
        Nothing in the escalated finding turns on this, but the dual_convention_control
        cannot detect the artifact it was pre-registered to detect.

