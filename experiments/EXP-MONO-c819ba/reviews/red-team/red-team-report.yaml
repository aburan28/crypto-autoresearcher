    curves with j=0 and matched-ordinary arms, replacing the 8-curve x 4-rung x 3-m grid,
    so that reproducibility is measured across CURVES rather than across seeds of a
    deterministic real arm; (4) a mandatory panel-level null-object arm (a 31st draw in the
    real slot) whose escalation rate is reported alongside the real arm's, per the frozen
    contract's own ordering_control text. Pre-register the direction as TWO-SIDED and, per
    OBJ-8, pre-register the downward branch as the primary hypothesis, since that is where
    the existing data points.

