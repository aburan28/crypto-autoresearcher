    - check: Nearby-object control (subgroup extreme) actually run and correctly forced.
      result: PASS -- see RECOMP-2; the instrument correctly reproduces N/h-1 exactly, which per the contract's own stopping rule is a precondition for interpreting any other arm.

  limitations:
    - >-
      This review is J1 (correctness) scope only per the joints_owned in the attestation; it
      renders no verdict on H-MONO-663fb4 itself, no ECDLP claim, and authorizes no status
      change (AGENTS.md rule 1; per this task's explicit "no status change of any kind").
    - >-
      The 500-draw independent MC null I constructed is itself a finite sample of a heavy-tailed
      distribution and is not a closed-form population value; my percentile/z-score numbers for
      J0 should be read as "much less extreme than the 30-draw estimate suggested," not as an
      exact population parameter. A closed-form or much-larger-sample characterization of this
      null's tail (e.g. via the character-sum literature this program already holds, itself
      disputed four ways per Stage 1) was out of scope for a 90-minute review.
    - >-
      I did not attempt to determine analytically WHY J0's specific group structure (n1=n2=18,
      full rational 18-torsion, unusually smooth/composite N=324=2^2*3^4) produces a heavier or
      lighter null tail than a generic curve's; I only confirmed empirically that a
      similarly-shaped heavy tail also occurs for RO3 (a non-CM, merely mildly non-cyclic curve,
      n1=3), which argues against extreme non-cyclicity alone being necessary, but a full
      account of what drives the tail's heaviness across the panel was not attempted.
    - >-
      I did not reproduce the exact 30-draw null populations from the contract's own SHA-256
      Drawer (that would require re-implementing seed.py's exact bit-for-bit rejection-sampling
      procedure); my independent null uses a different RNG entirely. This is intentional (a
      DIFFERENT sampling procedure is a stronger, less-correlated check of the underlying
      population shape than replaying their exact draws would be), but it means I did not verify
      that the pre-committed SHA-256 hashes in stage4_pretreatment_commitment bind to the EXACT
      30 draws used (I verified the COMMITMENT PROCESS exists and precedes treatment by reading
      the code's execution order, not by recomputing the hash preimage).
    - >-
      J1728's parallel automorphism structure (x -> -x coupling via the order-4 CM by Z[i], with
      QR(f(-x))=QR(f(x)) confirmed analytically since p10=1013 = 1 mod 4 forces QR(-1)=1) was
      derived analytically as a contrast case (no signal observed there) but not independently
      recomputed to the same depth as J0; this is noted as supporting context, not a
      fully-verified control.
    - >-
      Model-correlation confound: this review runs under claude-sonnet-5 (see review_attestation),
      not claude-opus-5 (the model family that produced H-MONO-663fb4, the specification, and
      the execution). This is a genuine independence break from that specific confound relative
      to EV-MONO-a0a89c's all-opus-5 lineage, and is recorded rather than assumed away.

  verdict: passed
  j1_attack_verdict: holds_with_finding
  j1_attack_verdict_note: >-
    Two distinct verdict fields are recorded deliberately, per agents/validator.md's two-tier
    structure: `verdict` (this field) is the run's ADMISSIBILITY verdict in the Required
    Output schema's vocabulary (passed | failed | incomplete | invalid) -- the receipt is
    admissible evidence of exactly what it measured. `j1_attack_verdict` is this task's
    requested J1-correctness attack verdict in the review-plan vocabulary (holds |
    holds_with_finding | breaks | inconclusive) -- the run's internal correctness (identities,
    controls, arithmetic, transcription) HOLDS under independent attack, WITH the significant
    finding recorded below about how the headline escalated signal should be read. Neither
    field authorizes any status change or claim beyond AGENTS.md rule 4's scope (toy-scale,
    curves/parameters/budget as tested).

  verdict_rationale: >-
    Every artifact-presence, hash-binding, seed/environment/manifest, dirty-tree, and exact-
    identity check PASSES, including full independent (different-basis, different-RNG,
    no-shared-code) recomputation of the flagged J0/F=N/2 cell's Var_ordered(m=1..4) and C/C_F
    to bit-for-bit agreement with the committed raw-result.json. Both positive controls and the
    coset-union control are independently re-derived by hand and match exactly. Stage 1's seven
    quotations are verbatim-accurate on direct re-reading of the source records, with two minor,
    non-disqualifying nuances noted. The receipt is therefore ADMISSIBLE.
    The "finding" qualifier is for the report's own headline escalation: the execution_report
    correctly declines to adjudicate the J0/F=N/2 signal, but its characterization of the null
    population there as "well-behaved" (based on the contract's own null-vs-null ordering
    control) does not survive an independent, higher-powered check. I find the signal is best
    explained by null-estimator miscalibration under a heavy-tailed statistic at n=30 draws --
    generic to this design, reproduced on a second (non-signal) curve, and NOT explained by the
    literal j=0-automorphism/orbit-invariance mechanism the task brief and the execution report's
    own escalation both raise, which I directly refute by computation. This is reported as a
    finding for the record and for Red Team / Coordinator attention, not as a failure of the
    run's admissibility: the run measured exactly what it was designed to measure, correctly,
    and the design's own statistical power at m=3/4 with n=30 is the thing future work should
    fix (e.g. by increasing null_draws_per_cell substantially at m=3/4, or by using a
    percentile/bootstrap band instead of a mean-ratio band for these specific heavy-tailed
    statistics).

