    - id: RECOMP-3-coset-union-closed-form
      description: >-
        Independently derived the coset-union control's closed form. G/H4 is cyclic of order 4
        for both RO3 (H4={(a,b): b=0 mod4} in Z/3 x Z/96, quotient = Z/96/4Z/96 = Z/4 since the
