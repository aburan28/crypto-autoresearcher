  independent_analysis_of_the_J0_F=N/2_signal:
    item_1_automorphism_mechanism_worked_out:
      claim_under_test: >-
        For J0 (y^2=x^3+6 over F_307), does f(omega*x)=f(x) hold, and does this make the
        F=N/2-truncated real arm a union of complete automorphism orbits (the mechanism the
        task brief hypothesized as the artifact explanation)?
      result: >-
        f(omega*x)=f(x) IS an EXACT algebraic identity (independently verified over ALL 307
        residues, 0 mismatches; omega=17, a primitive cube root of unity mod 307, found by
        direct search). The UNTRUNCATED QR-x pool (160 x-values) IS exactly orbit-closed under
        x -> omega*x (0 leaks out of the pool; 53 orbits of size 3 + the fixed point x=0, whose
        f(0)=6 is independently confirmed to be a QR mod 307). This premise of the hypothesized
        mechanism is CORRECT.
      but: >-
        THE MECHANISM DOES NOT PROPAGATE TO THE ACTUAL F=N/2 REAL ARM. See item 2.
    item_2_truncation_interaction_computed:
      method: >-
        Built the exact same scan-order-prefix truncated arm T (162 points, F=N/2, matching the
        Executor's construction exactly -- verified via RECOMP-4's byte-identical numbers) and
        directly tested T's closure under zeta(x,y)=(omega*x mod p, y) at the POINT level (own
        fresh script, no Executor code).
      result: >-
        T is NOT meaningfully orbit-closed. |T intersect zeta(T)| / |T| = 0.5062, statistically
        INDISTINGUISHABLE from the naive baseline (|T|/|fb_full| = 0.5062) expected if T behaved
        like a structure-blind random subset of the 320-point universe. At the individual-orbit
        level: of the 106 size-3 point-orbits in fb_full touched by T, only 16/(16+80)=16.7% are
        FULLY contained in T; 75.5% are SPLIT (1 or 2 of 3 members in T, the rest excluded by the
        arbitrary x-scan-order cutoff). The two x=0 fixed points are trivially both in T (T
        contains the smallest x-values by construction).
      conclusion: >-
        THE HYPOTHESIZED MECHANISM ("the factor base is a union of full or empty automorphism
        orbits, hence character-biased relative to a generic random symmetric subset") IS
        DIRECTLY REFUTED BY COMPUTATION AT THIS RUNG. The scan-order truncation destroys the
        automorphism-orbit structure almost completely; the F=N/2 real arm carries no more
        zeta-coherence than a random subset of the same size would. Whatever is producing the
        elevated L2/L3 numbers at this cell, it is NOT simple orbit-invariance of the truncated
        factor base under the j=0 automorphism. This is the single most important correction to
        the framing in the task brief and in the execution_report's own escalation note (which
        correctly declined to adjudicate, but the open possibility it flagged does not survive
        direct computation).
    item_3_independent_reverification_of_raw_numbers:
      result: >-
        See RECOMP-4 and RECOMP-5 above. All of L2(m=3)=1.4029/1.3052, L2(m=4)=1.8731/1.5715,
        L3=1.1653/1.1700 (run1/run2) are accurately transcribed from raw-result.json and the
        underlying Var/C values recompute bit-for-bit from an independent implementation.
        No transcription or arithmetic error found.
    item_4_multiple_comparisons_and_the_real_driver_FINDING_F1:
      naive_multiple_comparisons_framing: >-
        ~32 (curve,F) cells x {m=3,m=4} = 64 L2 tests, plus 32 L3 tests, ~96 comparisons per
        run against nominal two-sided bands. Under a naive assumption that the band was
        calibrated to a small (~5-10%) nominal false-positive rate per cell, one would expect
        a handful of chance exceedances among 96 tests, and "one cell reproducible across two
        independent seeds" would look mildly surprising (roughly: two independent ~5-10%
        events co-occurring on the same cell, i.e. a probability in the low single-digit
        percent, IF the two seeds' null estimates were independent draws from a well-estimated
        population -- see below for why that "if" fails).
      what_i_actually_measured_instead: >-
        Rather than assume a nominal false-positive rate, I EMPIRICALLY CALIBRATED it for this
        exact statistic and this exact cell. I drew 500 fresh, independently-seeded null draws
        (own RNG, unrelated to the contract's Drawer/domain) from the same 323-point universe
        the contract's draw_symmetric_null uses, and computed Var_ordered(m=3,4) and C/F for
        each. RESULT: the null population for Var_ordered(m=4) is SEVERELY right-skewed --
        mean=15,607,075, median=10,842,322 (mean/median=1.44), sd=18,868,186 (LARGER than the
        mean), p99=99,588,255, max=262,079,082 over 500 draws. This is generic to the design,
        not J0-specific: an identical check on RO3 (a curve the Executor's own run labeled
        IN_BAND at this same F=N/2/m=4 cell) shows the SAME heavy right skew
        (mean/median=1.38, sd larger than half the mean).
      the_type-I-error_calibration: >-
        Using the 500-draw pool as a stand-in population, I bootstrap-simulated the contract's
        own decision rule UNDER THE NULL BEING EXACTLY TRUE (both the "30-draw mean estimate"
        and the "real" value resampled from the identical population, 20,000 trials): for
        L2 at m=4, P(ratio > 1.4) = 15.9%, P(ratio < 0.7) = 48.6%, P(outside [0.7,1.4]) = 64.6%.
        For m=3: P(outside band) = 34.0%. For L3: P(outside [0.85,1.15]) = 25.4%. These are the
        ACTUAL false-positive/false-negative rates of the pre-registered band for THIS kind of
        heavy-tailed statistic at n=30 -- not the low single digits a "5% band" framing would
        suggest. Cross-check: the REAL run1 panel's own observed m=4 label distribution across
        32 cells (16 IN_BAND / 5 ABOVE_BAND / 11 BELOW_BAND, i.e. 16%/34%/50%... reading as
        above/below/in: 16% ABOVE, 34% BELOW, 50% IN) is close to what my null-true simulation
        predicts (16% ABOVE, 49% BELOW, 35% IN) for a J0-shaped null. This correspondence is
        the decisive evidence: THE WHOLE PANEL'S m=4 (and to a lesser extent m=3) band-label
        distribution is statistically consistent with pure null-estimator noise from an
        underpowered, heavy-tailed statistic, not with a population of mostly-null cells plus
        one genuine deviant.
      why_reproducibility_across_seeds_is_much_weaker_evidence_than_it_looks: >-
        Between the two runs, ONLY the null draws change (label "null-subset", domain
        f"{PANEL_DOMAIN}/run-{master_seed}"); the curve, the factor base, and hence the REAL
        arm's Var/C values are IDENTICAL (confirmed: L1/L4 seed-invariant, and RECOMP-4's exact
        recompute is a single fixed number, not a distribution). Because the null distribution
        is right-skewed (median << mean), a 30-draw sample mean is a SYSTEMATICALLY (not just
        noisily) downward-biased estimator of the true mean far more often than not (this is
        exactly the mean/median>1 asymmetry measured above): most 30-draw samples underestimate
        the true null mean, not half of them. So two INDEPENDENT 30-draw samples landing on the
        low side of the true mean (thereby both making the SAME fixed real value look
        "ABOVE_BAND") is NOT a coincidence requiring explanation by curve-specific structure --
        it is the EXPECTED, most-likely outcome of resampling a right-skewed null twice. This
        is qualitatively different from "two independent noisy measurements agreeing," which
        WOULD be informative; the mechanism here is a shared bias in the same direction, not
        independent confirmation. My own 500-draw estimate of the population mean
        (15,607,075 at m=4) is 40% and 17% above the two runs' respective 30-draw means
        (11,214,272 and 13,366,246), consistent with exactly this systematic underestimation.
        Placed against my own, much less biased, 500-draw null: the real value's L2(m=4)=1.35,
        L2(m=3)=1.24, L3=1.13, at percentiles 84%, 83%, 86% and z-scores of 0.29, 0.51, 0.92
        respectively -- an unremarkable, moderately-high-but-ordinary draw, not an outlier.
      quantified_expected_hits: >-
        Applying the empirically-calibrated ~16% per-cell ABOVE_BAND rate at m=4 (for a
        J0-shaped null; other, less-skewed cells will have somewhat different rates, but the
        RO3 check shows a comparably skewed shape at the same F/N=1/2 rung) to the 8 curves at
        F=N/2 specifically: expected count of "1 curve ABOVE_BAND at m=4, by chance, at this
        specific F rung" is ~1.3 per run. Observing exactly one such cell, on the SAME curve
        both times (because the cause is a systematic bias affecting the SAME fixed real value
        both times, not independent noise), is fully consistent with -- not surprising against
        -- pure test-calibration artifact.
    item_5_stage0_subgroup_coset_recheck: "See RECOMP-1/2/3 above; all PASS."
    item_6_stage1_quotation_accuracy:
      method: Read KN-FIND-007.md, KN-FIND-4c9e71.md, KN-FIND-d4f820.md, DEC-20260804-0a4bc2.yaml, DEC-20260804-4f3a3b.yaml, DEC-20260804-53c89f.yaml, DEC-20260804-f320c2.yaml directly (not via the Executor's stage1 file) and diffed against the Executor's stage1_quotations.md / execution_report.yaml stage1 section.
      result: >-
        All seven quotations are VERBATIM and accurately transcribed; I found no fabricated or
        misattributed text. The KN-FIND-007 mean-formula quote is character-for-character
        identical to the source. The KN-FIND-4c9e71 "CORRECTION (BATCH-107)" section quoted in
        full does exist and does reverse the document's own earlier "O(1) max C" claim; neither
        DEC-20260804-0a4bc2 nor DEC-20260804-4f3a3b has been amended to reflect it (confirmed by
        reading both records directly -- no supersedes/amendment field, no updated verdict). This
        Executor finding is CORRECT and independently confirmed.
      two_minor_nuances_not_flagged_by_the_executor:
        - >-
          DEC-20260804-53c89f's "genuine p-growth" finding is drawn from BATCH-081 (context:
          "Weil bound approach... Empirically: |hat{1_F}(k)| ~ sqrt(B)*p^{0.079}"), which reads
          as a continuation of the earlier MEAN-C measurement lineage (KN-FIND-d4f820,
          BATCH-073..081), predating and textually distinct from the ADVERSARIAL-MAX-C
          measurements (BATCH-104/105/107) that DEC-20260804-0a4bc2/-4f3a3b address. DEC-
          20260804-0a4bc2 itself explicitly distinguishes the two statistics ("mean C ~
          p^0.079... but the WORST curve has C bounded"). The Executor's stage1 file labels this
          "directly contradicting... the SAME DAY" without flagging that the three records may
          concern two different statistics (mean vs. adversarial max), not necessarily one clean
          same-quantity contradiction. This is a faithful relay of H-MONO-663fb4's own framing
          (which the contract's Stage 1 explicitly permits reporting-without-resolving), so it
          is not a defect in the Executor's work, but it is a nuance a reader should have.
        - >-
          For DEC-20260804-f320c2, the Executor states the "|S|=O(1)" phrasing attributed to it
          "is NOT a verbatim phrase in the record." On direct inspection, the record's own text
          reads "For any bounded generating set |S|=O(1), the spectral gap of Cay(Z/N, S) =
          Theta(1/N^2) -> 0" -- so the substring "|S|=O(1)" and the substring "Cay(Z/N, S)" ARE
          both literally, verbatim present in the record (in the same sentence), even though the
          specific COMBINED phrase H-MONO-663fb4 constructs ("closes the spectral-gap route for
          Cay(Z/N,S) at |S|=O(1)") is not one continuous verbatim string. The Executor's
          disclosure is appropriately hedged ("a reasonable reading... NOT asserted as a
          misquote") and the substance is not wrong, but "not a verbatim phrase" slightly
          overstates the gap between the paraphrase and the source; both key terms are in fact
          verbatim.
      stage1_termination_check_reconfirmed: >-
        Independently agree: KN-FIND-007's C(B+m-1,m)/N (multiset mean) is a distinct,
        non-contradictory identity from (I1)'s F^m/N (ordered mean); the Stage-1 stopping rule
        (F6) is correctly NOT triggered.
    item_7_F~N/2_vs_literal_full_FB_interpretation:
      method: Independently confirmed, via RECOMP-4's from-scratch curve build, that for J0 every non-2-torsion affine point (x,y) trivially has f(x)=y^2, a nonzero QR by construction -- so "every x with f(x) a nonzero QR" is satisfied by essentially all non-excluded points, tautologically.
      result: >-
        fb_full_size=320 against N=324, Z=3 (independently confirmed, matching
        execution_report.yaml exactly): F = N-1-Z, i.e. essentially the WHOLE group minus the
        identity and the 2-torsion-like zero-locus points -- NOT F~N/2. This is a genuine,
        confirmed internal inconsistency in the frozen contract's own text (the ladder's own top
        rung is separately labeled "N/2"), not a misreading by the Executor. INTERPRETATION 1 is
        correctly diagnosed and its adopted resolution (uniform scan-order prefix truncation
        applied to all four rungs) is the only reading consistent with the contract's own stated
        ladder values. PASS.
    item_8_overall_verdict_on_the_central_question: >-
      HOLDS_WITH_FINDING (see verdict block). The J0/F=N/2 signal is BEST EXPLAINED as (F-1) a
      NULL-ESTIMATOR MISCALIBRATION ARTIFACT: the pre-registered 30-draw null sample is grossly
      insufficient to estimate the heavily right-skewed population mean of Var_ordered(m=3,4)
      and C/F for this design (mean/median ratios of 1.4-1.5, sd exceeding the mean at m=4,
      confirmed generic across at least two curves including a non-signal one, RO3), and the
      contract's own "null-vs-null ordering control" (a single held-out draw vs. the mean of the
      other 29) has essentially no statistical power to detect this specific failure mode (a
      systematic, same-direction small-sample bias, not scatter among the 30 draws themselves).
      "Reproducible across both seeds" is fully consistent with -- not evidence against -- this
      explanation, because the bias acts in the SAME direction on any 30-draw resample of a
      right-skewed population. Against my own independently-drawn, 500-sample null, the real
      value sits at the 83rd-86th percentile with z-scores under 1 -- an unremarkable draw. This
      is NOT the j=0 extra-automorphism/orbit-invariance mechanism the task brief hypothesized:
      that specific mechanism is DIRECTLY REFUTED BY COMPUTATION (item 2: the F=N/2 truncated
      arm shows zero excess automorphism-orbit coherence over a structure-blind random subset of
      the same size). It is also not simply "the same small-F noise the Executor already
      diagnosed for other cells" in the sense the execution_report implies by contrasting
      "well-behaved" vs "noise-dominated" nulls -- both ARE noise-dominated, just via a form of
      noise (heavy-tail small-sample bias) that the specific control used cannot see, whereas
      the OTHER cells' instability was visible even to that weak control. So: KN-OPEN-009's
      j=0/1728-automorphism caveat is not directly triggered (the literal mechanism it warns
      about does not apply here), but the signal is equally NOT a candidate for the exceptional
      locus this research question exists to find -- it is a measurement artifact of an
      underpowered null-estimation design, and should be reported as such rather than escalated
      as a live candidate.

  heuristic_validation_checks:
    - check: Pre-registered prediction (K3/K4 bands, HEUR-CHR-2, F-ladder decay) recorded in specification.yaml before any run.
      result: PASS -- bands [0.7,1.4]/[0.85,1.15] and the F-ladder/m-ladder decay predictions are in the frozen, coordinator-approved specification.yaml, dated before RUN-1/RUN-2.
    - check: Sample size, seeds, sampling procedure in the manifest; empirical statistics recomputed from raw samples.
      result: >-
        PASS for presence (30 draws/cell, seeds 20260805/20260806, procedure specified and
        matches controls.py). PARTIAL/FINDING for adequacy: 30 draws is demonstrably too few to
        characterize the heavy right tail of Var_ordered(m=3,4) at these toy sizes -- see F-1.
        This is a design-level statistical-power gap, not a missing-record gap, so it is
        reported as a finding/limitation rather than an artifact-presence failure.
    - check: Correspondence validity (substitute sampling).
      result: not_applicable -- no substitute-sampling correspondence (e.g. Deuring) is used in this contract; the null is drawn directly from E(F_p), no theorem-cited substitution needed.
    - check: Scale binding recorded.
      result: PASS -- claim_ceiling/scale_relevance in specification.yaml are explicit that C/F at p~10^3 does not transfer, and HEUR-CHR-2's toy-scale prime-ladder fit (exponent 0.0801 over N in [117,1063]) is reported without extrapolation.
    - check: Cost-unit honesty / cost bookkeeping.
      result: not_applicable -- this contract makes no cost-model or attack claim; asymptotic_claim is explicitly null and the record states so throughout.

  cost_model_checks: []

  proof_architecture_checks:
    - check: proof_search_map completeness (H-MONO-663fb4).
      result: >-
        PASS -- bottleneck, baseline_embedding (m=1 symbolic + m=2 exact-integer fixture),
        observation_collision (searched, collision found and explained as non-straddling),
        quantifier_order (I1/I2 uniform, I3 FB-dependent via C, explicitly flagged as the
        record's trap), method_ceiling (explicit strongest-certifiable-claim and nearby-object
        control: the subgroup extreme), and constructive_transforms are all present and
