execution_report:
  experiment_id: EXP-MONO-c819ba
  handoff_id: TASK-20260830-4bf73d
  hypothesis_id: H-MONO-663fb4
  implementation_commit: 833f0f4f5c8656e4795cc8ba4c3bb54badce5618
  implementation_commit_note: >-
    Commit checked out at run start for both runs (repository dirty with
    unrelated concurrent-session files outside this task's write scope --
    coordination/goals/GOAL-SSI-001/, .worktrees/, unrelated handoffs and
    experiment reviews; see each run's manifest.yaml code.dirty_note). This
    report and the run artifacts it cites are not yet committed by the
    Coordinator; the Coordinator's snapshot commit will record the final
    SHA that includes these files.

  observations_only_note: >-
    This report records observations and measured numbers only. No
    hypothesis, experiment, or goal status is changed here, and no verdict
    is rendered on whether H-MONO-663fb4 is supported or refuted -- that
    judgment belongs to the Validator, Red Team and Coordinator, per the
    handoff's explicit instruction and per AGENTS.md rule 1.

  protocol_deviations:
    - >-
      INTERPRETATION 1 (F ~ N/2 vs. literal "every QR x"): the contract's
      literal factor_base_construction text ("the full factor base retains
      every x with f(x) a nonzero QR") makes the untruncated set essentially
      the WHOLE group (every non-2-torsion curve point automatically has
      f(x)=y^2, a QR), size N-1-Z, NOT N/2 -- confirmed numerically (e.g.
      RO1: fb_full_size=116 of N=117). This directly contradicts the
      contract's own repeated "F ~ N/2" language and its own ladder's top
      value ("N/2"). Interpretation adopted and applied uniformly to ALL
      FOUR ladder rungs including the largest: each rung is a
      (x,y)/(x,-y)-paired PREFIX of the QR-x point stream, sized to the
      nearest even integer near N/16, N/8, N/4, N/2. See implementation.md
      interpretation 1 for the full reasoning. This is itself a reportable
      finding about the frozen contract's own text, not silently resolved.
    - >-
      INTERPRETATION 2 (subgroup construction): the natural "image of
      scalar mult-by-k" construction for a subgroup of order N/k is WRONG
      on non-cyclic panel curves (its kernel is the full k-torsion, which
      can exceed gcd(k,N)) -- caught directly when it returned identical,
      wrong h values for the requested h=N/2 and h=N/4 arms on RO3, J0 and
      J1728 in an early test run. Replaced with the exact coordinate
      construction H_k = {(a,b) in Z/n1 x Z/n2 : b == 0 mod k}, correct for
      both cyclic and non-cyclic groups (order n1*(n2/k) = N/k exactly for
      k | n2). Subgroup availability is therefore gated on 4 | n2 (the
      LARGER invariant factor), not 4 | N: J0 (n1=18, n2=18) and J1728
      (n1=2, n2=530) both have 4 | N but NOT 4 | n2, and are correctly
      excluded. See implementation.md interpretation 2.
    - >-
      INTERPRETATION 3 (coset-union control's two cosets): a self-negating
      choice of g (g and -g in the same coset, or g of order <=2 modulo the
      subgroup) was shown analytically to ALWAYS collapse to either the
      index-2 subgroup itself (redundant with positive control 1, C/F=1) or
      a single coset (not a union). The implementation instead unions H4
      with gH4 for a generic g (this arm is not required to be symmetric --
      (I1)/(I2) hold for any subset). Measured C/F = 1/sqrt(2) ~ 0.7071 on
      both subgroup-capable curves, genuinely intermediate between the
      subgroup extreme and a random value, matching the closed form derived
      in implementation.md interpretation 3 to float precision (~1e-15).
    - >-
      INTERPRETATION 4 (j=0/j=1728 host prime): j=0 needs p=1 mod 3, j=1728
      needs p=1 mod 4, and under THIS contract's own seed domain the 9-bit
      prime (p9=307=3 mod 4) can host an ordinary j=0 curve but NOT an
      ordinary j=1728 curve (confirmed: 20000 candidates scanned at p9 with
      B=0, zero accepted -- every one forced supersingular). Resolved by a
      deterministic, seed-free search over the already-constructed
      field_bits primes for the smallest one satisfying each congruence
      (j=0 -> p9=307; j=1728 -> p10=1013), rather than assuming (as
      EXP-MONO-12ce1c's domain happened to allow) that one prime hosts both.
    - >-
      BUG FIX (draw_symmetric_null parity lock): an early implementation
      opportunistically consumed a curve's lone self-negating (2-torsion)
      point whenever drawn, which permanently parity-locks the null-subset
      draw one short of any EVEN target F (every target used here is
      forced even) once that single point is consumed, since all further
      draws are +/-pairs (+2, parity-preserving). Manifested as an
      unrecoverable rejection-loop on RO3 (which has exactly one
      2-torsion point) at F=N/4 and F=N/2. Fixed: a self-negating point is
      only accepted when it is the exact remaining odd slot -- never, for
      the even targets used throughout this run.
    - >-
      No panel-size, F-ladder-resolution or null-draw-count reduction was
      needed: the full 8-curve panel, full 4-point F-ladder and full 30
      null draws per cell were used throughout both runs. Measured wall
      time was ~1.9s per run against the 7200s budget (see
      implementation.md "Performance").
    - >-
      Dual-path (character-side float) cross-check: measured maximum
      relative residual between the exact-integer convolution side and the
      float FFT2 character side, across every Stage-3 real-arm cell in
      RUN-1: m=1: 4.8e-16, m=2: 7.3e-14, m=3: 5.2e-11, m=4: 3.9e-9. The
      contract's declared float tolerance is 1e-10 relative; the m=4
      cross-check EXCEEDS it on several cells. Disclosed per
      dual_path_control's own text ("the PRIMARY metric is always the
      exact-integer convolution side ... the absence of exact roots of
      unity can never affect a reported result"): this is a float-precision
      limitation of double-precision FFT2 at an 8th-power statistic, not a
      defect in the exact-integer primary metric (independently verified
      three ways: Stage 0's fixture, Stage 2's m=3,4 gate, and every
      Stage-3/4 cell, all via exact int64/Python-bigint arithmetic).

