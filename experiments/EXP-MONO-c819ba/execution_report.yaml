  L1_L2_L3_summary_across_full_panel_x_F-ladder_32_cells_per_run:
    L1_dual_path: "see protocol_deviations entry above (max residual 3.9e-9 at m=4, float-only)"
    L2_m2_both_runs: "32/32 cells IN_BAND, both seeds -- no exception at m=2 anywhere in the panel."
    L2_m3_run1: {IN_BAND: 24, ABOVE_BAND: 3, BELOW_BAND: 5}
    L2_m3_run2: {IN_BAND: 24, ABOVE_BAND: 2, BELOW_BAND: 6}
    L2_m4_run1: {IN_BAND: 16, ABOVE_BAND: 5, BELOW_BAND: 11}
    L2_m4_run2: {IN_BAND: 17, ABOVE_BAND: 5, BELOW_BAND: 10}
    L3_run1: {IN_BAND: 29, ABOVE_BAND: 2, BELOW_BAND: 1}
    L3_run2: {IN_BAND: 29, ABOVE_BAND: 1, BELOW_BAND: 2}
    ordered_and_multiset_conventions: >-
      Both reported at every cell in raw-result.json (per_m.var_ordered /
      per_m.var_multiset, per_m.mean_ordered / per_m.mean_multiset).
      max_rel_dev is IDENTICAL between conventions by construction (the m!
      convention factor cancels in the ratio to the predicted mean),
      confirmed numerically at every cell; reported as a single value with
      this equivalence noted rather than duplicated.
    finding_ABOVE_BAND_pattern: >-
      Every m=3/4 ABOVE_BAND cell occurs at SMALL F (RO1 at F=6,14,28; RO3
      at F=36; J0 at F=40,162) -- i.e. exactly where the 30-draw null
      population itself is smallest and noisiest. The null-vs-null
      ordering control (computed BEFORE the real-vs-null comparison, per
      ordering_control) shows the SAME instability at most of these small-F
      cells: e.g. RO1 F=6 (N/16) is null-vs-null IN_BAND in run 1 but
      ABOVE_BAND in run 2 -- the null population's OWN internal spread
      exceeds the pre-registered band there, in at least one seed, which
      means the ABOVE_BAND label on the REAL arm at these specific small-F
      cells (RO1 N/16, RO1 N/4, RO3 N/8) is NOT distinguishable from
      sampling noise in the null population itself, and is reported as
      noise-dominated rather than a candidate deviation.
    finding_J0_at_F=N/2_reproducible_across_both_seeds: >-
      ONE cell is different in kind: J0 (the j=0 curve) at F=N/2=162. Here
      the null-vs-null ordering control is IN_BAND in BOTH runs (the null
      population is well-behaved, not noise-dominated), while the
      REAL-vs-null comparison is ABOVE_BAND at m=4 in BOTH runs (L2=1.873
      run1, L2=1.571 run2), ABOVE_BAND at m=3 in run 1 only (L2=1.403;
      run2 m=3 is IN_BAND), and L3 (C/F ratio) is ABOVE_BAND in BOTH runs
      (1.165 run1, 1.170 run2). This is the SINGLE reproducible,
      well-behaved-null-population deviation found across the entire
      panel, and per falsification_criterion(d) it is ESCALATED here to
      independent review rather than reported as a routine positive. It is
      NOT resolved, adjudicated, or interpreted as support or refutation of
      H-MONO-663fb4 in this report. Scope note carried forward
      un-adjudicated from KN-OPEN-009's own text: "Any exceptional-curve
      claim must exclude j=0/1728 extra-automorphism artifacts from the
      random controls" -- J0 is exactly a j=0 curve, so this reproducible
      signal may be (and is flagged as a live candidate for being) exactly
      the extra-automorphism artifact that caveat anticipates, rather than
      a generic factor-base-character-bias effect; distinguishing the two
      requires further curves and is out of this run's scope.

  graded_control_1_F_ladder:
    both_runs_qualitative_trend: >-
      Not a clean monotone decay in every single cell (30-draw null
      populations are noisy, especially at F=N/16), but the PATTERN across
      m=2 (0/32 ABOVE_BAND at any F) vs m=3/4 (concentrated ABOVE_BAND at
      the SMALLEST F rungs, N/16 and N/8, on the curves where it occurs at
      all) is consistent with (I3)'s predicted decreasing-in-F relative
      deviation. No cell shows the artifact-tell pattern (deviation
      INCREASING with F) on any curve at fixed m; this is reported as the
      qualitative direction only, not a fitted slope, given the 30-draw
      noise floor documented above.

  graded_control_2_m_ladder:
    both_runs: >-
      L2 band-violation COUNT increases monotonically from m=2 (0 cells) to
      m=3 (2-3 cells) to m=4 (5 cells) in both runs, consistent with (I3)'s
      predicted compounding in m for any real bias effect (as distinct from
      a fixed instrumental offset, which would not compound). This
      compounding pattern is exactly what makes the J0/F=N/2 finding above
      (present at m=3 AND m=4, with a well-behaved null) distinguishable
      from the small-F noise-dominated cells (present inconsistently
      across seeds, m=3/4 only, wide null spread).

