    forced_closed_form: >-
      Shat(chi) = h*(1 + chi(g)) for the 4 characters trivial on H4, 0
      otherwise; derived and computed programmatically via an FFT-of-a-
      delta-function trick (see implementation.md interpretation 3), giving
