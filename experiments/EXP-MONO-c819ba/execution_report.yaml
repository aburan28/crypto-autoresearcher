  stage1_verbatim_quotations:
    file: "runs/RUN-MONO-c819ba-{1,2}/stage1_quotations.md (identical content, seed-free)"
    all_seven_records_obtained: true
    KN-FIND-007_conservation_mean: >-
      QUOTED VERBATIM (see file): "E_r[c_D(r)] = binomial(B + m - 1, m) / N"
      -- the UNORDERED-MULTISET mean, NOT literally F^m/N (this contract's
      OWN (I1), the ORDERED-tuple mean, independently proved exact in Stage
      0). These are NOT related by a single m-independent convention
      factor for finite B/F (they agree only asymptotically). FINDING,
      REPORTED: H-MONO-663fb4 mechanism step (4) had already flagged F^m/N
      as merely the ordered-convention "ANALOGUE" of KN-FIND-007's
      multiset mean, not an equality, and pre-committed to reporting both
      conventions for exactly this reason.
    stage1_termination_check: >-
      NOT TRIGGERED. The stopping rule asks whether the mean is F^m/N
      "under any reasonable convention"; (I1) proves F^m/N exactly for the
      ORDERED convention independently of KN-FIND-007, and KN-FIND-007's
      C(B+m-1,m)/N is a distinct, self-consistent conservation identity for
      the MULTISET convention -- not a contradiction of (I1). Both
      conventions are reported at every Stage-3/4 cell per the contract's
      own dual_convention_control, which is the mechanism this exact gap
      was pre-registered to be caught by.
    alpha_disagreement:
      KN-FIND-d4f820: "0.055 (mean C, small-x factor base, full-range DFT, p<=50021)"
      KN-FIND-4c9e71: >-
        "0.079 (adversarial-max C), AFTER a self-correction inside the SAME
        record superseding its own earlier 'O(1) max C' claim (see
        'CORRECTION (BATCH-107)' section, quoted in full in the stage1 file)"
      refit_0.0620_and_scout_0.0624: >-
        NOT LOCATED as separate KN-* or DEC-* records under this search;
        H-MONO-663fb4 mechanism step (7) relays these as a "refit" and a
        "SCOUT-COMPUTED null ... over Z_N rather than E(F_p)" without
        citing record IDs, and none were found. Recorded NOT OBTAINED for
        these two specific values; not guessed or paraphrased.
    max_c_two_way_disagreement:
      DEC-20260804-0a4bc2_and_4f3a3b: >-
        "C = O(1), constant, ~4" (2026-08-04, based on BATCH-104/105 data,
        p up to 9001)
      DEC-20260804-53c89f: >-
        "genuine p-growth" (C ~ p^0.079), same date, same day's batch
        sequence, direct contradiction
      NEW_FINDING_not_in_the_hypothesis's_own_relay: >-
        KN-FIND-4c9e71's OWN "CORRECTION (BATCH-107)" section (quoted in
        full in the stage1 file) reports the p=50021 test explicitly
        promised in DEC-20260804-4f3a3b's exact_next_action came back at
        max C=5.182, consistent with GROWTH (p^0.079) -- REVERSING the
        O(1) verdict that DEC-20260804-0a4bc2 and DEC-20260804-4f3a3b
        record, all inside the SAME promoted finding record, with neither
        decision record itself updated to reflect it. Reported as-is per
        this contract's Stage-1 scope (read and quote, never resolve).
    spectral_gap_scope_DEC-20260804-f320c2: >-
      Quoted verbatim (file): closes the BGS/Cay(Z/N,S) route on the
      abelian-group obstruction. The specific "|S|=O(1)" phrasing
      H-MONO-663fb4 mechanism step (7) attributes to this record is a
      reasonable paraphrase of its abelian_spectral_gap_obstruction clause
      but is NOT a verbatim phrase in the record; flagged, not asserted as
      a misquote.

