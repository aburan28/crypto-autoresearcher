experiment:
  id: EXP-MONO-c819ba
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MONO-663fb4
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted. GOAL-MONO-001 is `paused` with its campaign budget exhausted;
    batch assignment is a Coordinator act and is not performed here.

  title: >-
    Review-required contract: verify the exact second-moment identity
    Var_R N_m(R) = N^-2 sum_{chi != 1} |Shat(chi)|^{2m} for factor-base decomposition
    counts, and measure the normalized character bias C/F of the real x-coordinate factor
    base against a matched random symmetric subset, with an exact subgroup positive
    control forced to N/h - 1 and a factor-base-size ladder that must decay.

  objective: >-
    If separately approved, frozen and authorized, decide at toy scale whether the
    relation-rate half of KN-OPEN-009 -- GOAL-MONO-001's declared objective -- is governed
    by the factor base's character bias rather than by any property of the summation cover,
    and whether the real x-coordinate factor base is distinguishable from a matched random
    symmetric subset of the same size. This is a design proposal only. No run has happened,
    no observation is reported, and nothing here is evidence.

  relation_to_the_goals_pause: >-
    GOAL-MONO-001's next_action offers exactly two permitted resolutions: identify a
    statistic that discriminates ON the factor-base sublocus, or record a scoped no-go for
    the relation-rate half of KN-OPEN-009. THIS CONTRACT TAKES THE FIRST BRANCH. The
    statistic is Var_R N_m(R); it is defined on the factor base by construction; it is
    provably non-constant there (a subgroup and a random set of the same size differ by an
    exactly computable factor N/h - 1); and it is not a Galois statistic, so
    EV-MONO-a0a89c OBS-5's degeneracy argument does not apply to it. Recording the no-go
    branch BEFORE a discriminating statistic had been looked for would be a fatigue report
    rather than a closure under docs/inventor-protocol.md section 4, and this contract
    exists so that the no-go, if it is eventually recorded, is recorded against a
    statistic that could have found something. THIS CONTRACT COMMISSIONS NO CENSUS OF THE
    SUMMATION COVER at any m and therefore does not engage next_action's prohibition;
    whether that reading is correct is the Coordinator's to decide (AGENTS.md rule 1).

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - >-
      Not a closure of KN-OPEN-009. Its imprimitivity/monodromy half is EXP-MONO-12ce1c's
      and is untouched here.
    - >-
      Not an adjudication of this corpus's four-way disagreement about the analogous
      character-sum exponent (alpha = 0.055 / 0.079 / 0.0620 / 0.0624) or its two-way
      max-C disagreement. Both are read in Stage 1 and REPORTED, never resolved by this
      contract (AGENTS.md retrieval policy item 7).
    - >-
      Not a claim on GOAL-ECDLP-001's or GOAL-RELN-001's territory. The overlap is flagged
      for Coordinator adjudication.
    - >-
      Not a statement about F_{q^n}, where the factor base is a subfield line and nothing
      here applies.
    - Not approved, frozen, authorized, executed, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on the declared panel of >= 8 non-singular curves over primes in
      [100, 3000], with exhaustive target enumeration and >= 30 matched null draws per
      cell, the exact identity held to the declared tolerance at m in {1,2,3,4}; that the
      measured Var_real/Var_null and (C/F)_real/(C/F)_null fell inside or outside their
      pre-registered bands; and that the subgroup positive control returned exactly
      N/h - 1. The IDENTITY itself is a derivation and its validity comes from the proof,
      not from the run.
    what_no_outcome_can_support: >-
      No outcome establishes the asymptotic size of C; no outcome converts a measured
      deviation into a cost or an exponent, because the linear-algebra stage is uncharged
      here and (per the session ANGLE-BRIEF, relayed) is uncharged in every relation-rate
      finding this program holds; no outcome transfers to crypto scale or to F_{q^n}.
      Toy evidence is never crypto-scale evidence (AGENTS.md rule 7).

  inputs:
    field_bits: [7, 8, 9, 10, 11]
    field_bits_note: >-
      Recorded explicitly; every run manifest MUST carry field_bits, because the session
      ANGLE-BRIEF reports 513 of 1670 existing manifests omitting it, which silently
      disables the validator's claim-tier ceiling.
    prime_range: [100, 3000]
    m_values: [1, 2, 3, 4]
    m_note: >-
      m = 1 is CALIBRATION ONLY and is declared in advance to be non-discriminating: the
      identity forces Var = F(N-F)/N^2 for every set of size F, so real and null agree by
      construction. Its passing may never be reported as a null result. This declaration
      exists because KN-TECH-1a5b7e catalogues controls that pass without being able to
      fail as a live defect in this corpus.
    factor_base_size_ladder: ["N/16", "N/8", "N/4", "N/2"]
    null_draws_per_cell: 30
    targets: >-
      ALL R in E(F_p), exhaustively. No target sampling. At these sizes exhaustive
      enumeration is affordable, and a sampled variance would inject its own estimation
      error into the primary metric -- the specific defect the ANGLE-BRIEF records voiding
      an earlier efficiency measurement in this program.
    curve_panel:
      random_ordinary_minimum: 4
      cm_minimum: 2
      j0_required: true
      j1728_required: true
      subgroup_availability_required: true
      subgroup_availability_note: >-
        At least two panel curves must have #E(F_p) admitting a proper subgroup of index
        2 and of index 4, so the positive control can be instantiated at h = N/2 and
        h = N/4 with distinct forced values 1 and 3. If no such curve is constructed, the
        positive control does not exist and NO ARM MAY BE INTERPRETED.
    master_seed: 20260805
    domain: EXP-MONO-c819ba/v1
    seed_derivation_rule: >-
      Every draw uses SHA-256 of the ASCII bytes of
      domain || "|" || label || "|" || decimal(p) || "|" || decimal(m) || "|" ||
      decimal(draw_index) || "|" || decimal(counter), big-endian unsigned, with rejection
      sampling against modulo bias (reject digests >= floor(2^256 / M) * M for a draw in
      [0, M)). Labels used, and no others: "prime", "curve-a", "curve-b", "null-subset",
      "coset-pick". Counters start at 0 and advance once per digest consumed, per label,
      per (p, m, draw_index). A third party reproduces every instance bit-for-bit.
    prime_construction: >-
      Identical rule to EXP-MONO-12ce1c: h = int(SHA256(seed("prime", b, 0, 0, 0))),
      L = 2^(b-1), U = 2^b, c_0 = L + 1 + 2*(h mod 2^(b-2)), test c_k = c_0 + 2k while
      c_k < U; prime iff > 3, odd, and no odd divisor up to floor(sqrt(c_k)). Reaching U
      is CONSTRUCTION_FAILURE for that cell; no wrapping, no reseeding.
      NOTE THE DOMAIN DIFFERS, so the primes need NOT coincide with EXP-MONO-12ce1c's and
      no comparison between the two contracts' measured numbers is licensed.
    curve_construction: >-
      For t = 0,...,65535: a_t = int(SHA256(seed("curve-a", p, 0, 0, t))) mod p,
      b_t = int(SHA256(seed("curve-b", p, 0, 0, t))) mod p; reject if
      (4 a_t^3 + 27 b_t^2) mod p = 0; accept the first non-singular ordinary candidate.
      j = 0 uses A = 0, j = 1728 uses B = 0, with the free coefficient from the same
      stream. The full group structure E(F_p) = Z/n_1 x Z/n_2 is computed and recorded,
      because the character indexing must be correct for non-cyclic groups.
    factor_base_construction: >-
      FB is the set of points P with x(P) in the declared x-coordinate set. The full
      factor base retains every x with (x^3 + Ax + B)^((p-1)/2) mod p = 1 (nonzero squares
      only; f(x) = 0 excluded and counted). FB IS SYMMETRIC BY CONSTRUCTION and the
      symmetry is CHECKED, not assumed: -FB = FB must hold exactly or the cell halts as a
      construction failure (HEUR-CHR-4). Truncated ladder members take the first F
      x-coordinates in increasing scan order, and the truncation rule is frozen here so
      that "small factor base" means one declared thing.

  stage_order_and_the_terminating_stage:
    principle: Cheapest decisive gate first. STAGE 0 IS ZERO-COMPUTE AND CAN END THE CONTRACT.
    stage_0:
      name: exact-identity gate at m = 1 and m = 2
      compute: none to seconds
      description: >-
        Verify symbolically that (I2) at m = 1 reduces to F(N-F)/N^2 by Parseval, and that
        at m = 2 it is equivalent to sum_R N_2(R)^2 = F^4/N + (1/N) sum_{chi != 1}
        |Shat(chi)|^4 (the additive-quadruple identity). Then evaluate both sides as EXACT
        INTEGERS on one frozen fixture cell whose (p, A, B, F) are written into the
        contract before execution.
      terminates_the_run_if: >-
        Either identity fails. The derivation is wrong, the hypothesis is withdrawn by a
        superseding record, and no further compute is spent.
    stage_1:
      name: read the relayed records
      compute: none
      description: >-
        READ IN FULL and quote verbatim: KN-FIND-007 (the conservation mean),
        KN-FIND-d4f820 and KN-FIND-4c9e71 (the alpha disagreement), DEC-20260804-0a4bc2,
        DEC-20260804-4f3a3b and DEC-20260804-53c89f (the max-C disagreement), and
        DEC-20260804-f320c2 (the |S| = O(1) spectral-gap scope). EVERY STATEMENT ABOUT
        THESE RECORDS IN H-MONO-663fb4 AND IDEA-20260805-a9a95d IS RELAYED FROM A SESSION
        BRIEF AND UNVERIFIED. Stage 1 replaces each with a quotation or records that it
        could not be obtained. A finding that any is misdescribed is a deliverable in its
        own right and is reported whether or not it favours the hypothesis.
      terminates_the_run_if: >-
        KN-FIND-007's conservation mean turns out NOT to be the ordered mean F^m/N under
        any convention. Then the identification of N_m with the relation event (mechanism
        step 4) is wrong and no measurement may be interpreted until it is redone.
    stage_2:
      name: exact-identity verification at m = 3, 4 by independent convolution and character sides
      compute: seconds to minutes
    stage_3:
      name: real factor base versus >= 30 matched nulls; C, F, C/F, Var, ratios
      compute: minutes
    stage_4:
      name: controls (subgroup, coset-union, size ladder, curve panel)
      compute: minutes

  arms_and_controls:
    treatment: >-
      REAL ARM. For each (curve, F on the ladder, m), compute N_m(R) for ALL R by exact
      integer convolution of the factor-base indicator, and emit mean, Var, and
      max_R |N_m(R)/(F^m/N) - 1|, in BOTH the ordered and the multiset convention.
      Independently compute the character side and emit C, F and C/F.
    measured_null: >-
      MATCHED NULL, SAME SHAPE, ABLE TO FAIL. For each treatment cell, draw >= 30
      uniformly random SYMMETRIC subsets of E(F_p) of IDENTICAL size F (label
      "null-subset"; drawn as a random set of +-pairs so symmetry is exact), on the SAME
      curve, with the SAME m and the SAME exhaustive target set. Report Var_real/Var_null
      and (C/F)_real/(C/F)_null with the null's mean and standard deviation over the
      draws. NEVER report a raw statistic without its ratio: the ANGLE-BRIEF records
      166 of 229 evidence records in this program having no null anywhere, and the
      corresponding failure in this very lane -- a factor-base comparison whose difference
      was forced by the base size alone -- is the pattern this arm exists to avoid.
    positive_control_1: >-
      SUBGROUP ARM, EXACT FORCED VALUE, MANDATORY. FB = a proper subgroup H <= E(F_p) of
      order h, at h = N/2 and h = N/4. FORCED: Shat(chi) = h on the annihilator of H and 0
      elsewhere; N_m(R) = h^{m-1} for R in H and 0 otherwise; relative deviation EXACTLY
      N/h - 1 (so exactly 1 and exactly 3); C/F EXACTLY 1. IF THE INSTRUMENT DOES NOT
      RETURN THESE EXACTLY, IT CANNOT DETECT AN EXCEPTIONAL FACTOR BASE AND NO NEGATIVE
      RESULT MAY BE REPORTED FROM ANY ARM (docs/inventor-protocol.md section 3).
    positive_control_2: >-
      INTERMEDIATE ARM. FB = a union of two cosets of a subgroup of index 4 (label
      "coset-pick"), whose spectrum is closed-form and whose bias is realistic rather than
      extremal. The forced spectrum is written into the contract before execution. This
      tests sensitivity at an effect size that could actually occur, not only at the
      extreme, and it is what distinguishes a working instrument from one that only sees
      the degenerate case.
    graded_control_1: >-
      FACTOR-BASE SIZE LADDER, 4 POINTS, MONOTONICITY REPORTED. F over
      {N/16, N/8, N/4, N/2} at fixed curve and m. (I3) with C ~ sqrt(F) predicts the
      relative deviation DECREASES as F grows. A QUANTITY THAT FAILS TO DECAY AS THE
      PARAMETER MEANT TO DESTROY IT INCREASES IS THE CANONICAL ARTIFACT TELL
      (docs/inventor-protocol.md section 3). The fitted trend and its sign are primary
      output, not commentary.
    graded_control_2: >-
      m LADDER, 3 INTERIOR POINTS AT m = 2, 3, 4. (I3) predicts the relative deviation
      falls like (C/F)^{m-2}. Report measured decay against forced decay. This separates a
      genuine bias effect (which must compound in m) from a fixed instrumental offset
      (which will not).
    graded_control_3: >-
      PRIME LADDER. The same construction at >= 3 primes spanning a factor >= 8 in N.
      Report C/sqrt(F) and its fitted exponent in N. THIS IS THE MEASUREMENT OF
      HEUR-CHR-2, on which the record's only substantive consequence is conditional, and
      it is reported as a toy-scale trend and never extrapolated.
    calibration_control: >-
      m = 1, DECLARED IN ADVANCE TO BE NON-DISCRIMINATING. Forced Var = F(N-F)/N^2 for
      every set, so real and null agree by construction. Its purpose is to prove the
      counter is correct. ITS PASSING MAY NEVER BE REPORTED AS A NULL RESULT AND IS
      EXCLUDED FROM THE PRIMARY METRICS BY THIS CLAUSE.
    ordering_control: >-
      MANDATORY AND HASH-COMMITTED. Both positive controls, the calibration control and
      the complete matched-null arm are generated, computed and committed by SHA-256
      BEFORE any treatment cell is computed. The frozen decision rule is executed on the
      NULL first and its label recorded. If the rule emits the same label on the null and
      on the treatment arm, it discriminates nothing and must be rewritten before any
      treatment output is read. Absence of the pre-treatment commitment is
      invalid_measurement.
    dual_convention_control: >-
      ORDERED AND MULTISET COUNTS AT EVERY CELL. IDEA-20260803-ff7415 identifies
      ordered-versus-multiset conflation as the likeliest source of a spurious 2^{n-1}
      factor already present in this corpus; reporting one convention would reintroduce
      exactly that risk. The ordered/multiset ratio is compared against its combinatorial
      prediction at every cell and a mismatch is a deliverable.
    dual_path_control: >-
      The convolution side (exact integers) and the character side (independently
      computed) must agree at every cell to the declared tolerance. If the character side
      is evaluated in floating point the tolerance is 1e-10 relative and is declared here;
      the PRIMARY metric is always the exact-integer convolution side, so the absence of
      exact roots of unity can never affect a reported result.
    comparability_policy: >-
      No comparison of measured numbers with EXP-MONO-12ce1c, EXP-MONO-4b50b6 or any other
      contract is licensed: the seed domains differ, so the primes and curves need not
      coincide. Cross-contract comparison requires a separately registered comparator
      naming both domains, streams, statistics and failure dispositions.

  metrics:
    primary:
      - >-
        L1: relative residual between the exact-integer convolution side and the character
        side of Var_R N_m(R), per (curve, F, m). Forced 0 (or below 1e-10 in the
        floating-point cross-check).
      - >-
        L2: Var_real / Var_null at m = 3 and m = 4, with the null's mean and sd over
        >= 30 draws.
      - "L3: (C/F)_real / (C/F)_null on the same cells."
      - >-
        L4: subgroup-control relative deviation against the forced N/h - 1 at h = N/2 and
        h = N/4.
    secondary:
      - C, F, C/F, mean and Var per arm, both conventions
      - fitted decay of the relative deviation across the F ladder, with its sign
      - fitted decay across the m ladder against the forced (C/F)^{m-2}
      - C/sqrt(F) and its fitted exponent across the prime ladder
      - coset-union control against its pre-written forced spectrum
      - ordered/multiset ratio against its combinatorial prediction
      - per-curve-panel spread of (C/F)_real with CM, j = 0 and j = 1728 flagged separately
      - group structure (n_1, n_2), N, Z, tau, factor-base digest and symmetry-check result per curve

  preregistered_prediction:
    - quantity: L1
      value: 0 exactly on the convolution side; below 1e-10 relative on the floating cross-check
      formula: >-
        Var_R N_m(R) = (1/N^2) sum_{chi != 1} |Shat(chi)|^{2m}, from Fourier inversion and
        orthogonality on a finite abelian group.
      source: H-MONO-663fb4 (I2), derived; unconditional.
    - quantity: L2
      value: within [0.7, 1.4]
      formula: >-
        Pre-registered on the expectation that the x-coordinate factor base has no additive
        structure in E(F_p) and so behaves like a matched random symmetric subset. TWO-SIDED:
        above the band is the exceptional relation-rate signal KN-OPEN-009 asks for; below
        it means the factor base is MORE uniform than random. Both are findings.
      source: H-MONO-663fb4 K3; the record predicts its own null and says so.
    - quantity: L3
      value: within [0.85, 1.15]
      formula: same expectation applied to the maximum nontrivial character sum.
      source: H-MONO-663fb4 K4
    - quantity: L4
      value: EXACTLY 1 at h = N/2 and EXACTLY 3 at h = N/4; C/F exactly 1 on both
      formula: >-
        For FB = H a subgroup, Shat(chi) = h on the annihilator and 0 elsewhere, so
        N_m(R) = h^{m-1} on H and 0 off it and max_R |N_m/(F^m/N) - 1| = N/h - 1.
      source: H-MONO-663fb4 mechanism step (5). Exact, not a tolerance.
    - quantity: m = 1 calibration
      value: F(N-F)/N^2 exactly, on both real and null arms
      formula: Parseval; holds for every subset of size F.
      source: >-
        H-MONO-663fb4 mechanism step (2). DECLARED NON-DISCRIMINATING IN ADVANCE; its
        agreement is a calibration and may never be reported as a null result.
    - quantity: F-ladder trend
      value: strictly decreasing relative deviation as F grows
      formula: (I3) with C ~ sqrt(F) gives deviation <= (C/F)^{m-2}(N/F), decreasing in F.
      source: H-MONO-663fb4 K6. Failure to decay is the artifact tell, not a small anomaly.

  replication:
    planned_runs: 2
    seeds: [20260805, 20260806]
    interpretation: >-
      Two runs at different master seeds. L1 and L4 are seed-invariant by construction, so
      any seed-to-seed difference in them is an implementation defect and voids the cell.
      L2 and L3 depend on the null draws, and their seed-to-seed spread MUST be reported
      BEFORE any deviation from the pre-registered band is reported, so that a band
      violation cannot be read off noise.

  budget:
    maximum_runs: 2
    maximum_wall_seconds: 7200
    maximum_cpu_seconds: 14400
    maximum_peak_rss_bytes: 2147483648
    maximum_total_disk_bytes: 2147483648
    maximum_workers: 1
    no_network: false
    no_network_note: >-
      Stage 1 requires only repository reads, not network. All stages MUST run with the
      network disabled. If a Stage-1 record cannot be read, that is recorded as
      NOT OBTAINED with the reason and the corresponding relayed statements stay marked
      relayed.
    cost_note: >-
      Exact convolution is O(F N) integer additions per (cell, m); at p <= 3000 and
      F <= N/2 that is under 5e6 additions per cell, i.e. seconds in pure Python. The
      character cross-check is O(N^2) complex operations at worst, still seconds at these
      sizes. Memory is O(N) integers, kilobytes.

  environment_preconditions:
    verified_in_this_container_on_20260805:
      - "python3 -c 'import numpy' -> numpy 2.4.6 (import succeeds)"
      - "python3 -c 'import sympy' -> ModuleNotFoundError"
      - "python3 -c 'from sage.all import GF' -> ModuleNotFoundError"
    consequence: >-
      NO CAS AND NO SOLVER IS REQUIRED. The primary metric is exact-integer convolution in
      pure Python; numpy MAY be used for the floating-point character cross-check and its
      absence must not block any primary metric. This records, for this container, the
      resolution of the environment disagreement the session ANGLE-BRIEF reports between
      two scouting sweeps.
    if_a_precondition_fails: >-
      A missing interpreter, a failed symmetry check on the factor base, or a failure to
      construct a curve with the required subgroup structure is failed_infrastructure and
      is reported as infrastructure signal. IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE
      against H-MONO-663fb4 or any ECDLP proposition (AGENTS.md rule 5).

  infrastructure_failure_disposition: >-
    Any timeout, crash, memory-cap breach, construction failure, unreadable Stage-1 record,
    or dual-path disagreement is recorded with its exact cause and classified
    `failed_infrastructure` or `invalid`. Such an outcome supports and weakens NOTHING and
    may not be cited as evidence about relation rates, about KN-OPEN-009, or about the
    ECDLP.

  stopping_rules:
    - >-
      Do not execute unless separately reviewed, approved, frozen, archived and authorized
      by the Coordinator. No approved_by field is present.
    - Stop at Stage 0 if either exact identity fails. Spend no further compute.
    - >-
      Stop at Stage 1 if KN-FIND-007's mean is not the ordered mean under any convention:
      the event identification is wrong and no measurement may be interpreted.
    - >-
      Stop before any treatment cell if the pre-treatment commitment hashes for the nulls
      and both positive controls are absent.
    - >-
      Stop the whole contract if positive control 1 does not return exactly N/h - 1: no
      arm may be interpreted.
    - >-
      Skip the subgroup and coset controls, and do not interpret any arm, if no panel curve
      admits subgroups of index 2 and 4.
    - Stop on any budget breach, reporting it as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any missing construction record, factor-base digest, symmetry check, seed record or manifest.
    - Any run manifest lacking field_bits.
    - Any cell reporting one convention only.
    - Any cell whose targets were sampled rather than exhaustively enumerated.
    - Any raw statistic reported without its matched-null ratio.
    - >-
      Any post-hoc change to a pre-registered band, tolerance or decision rule after any
      Stage-2, -3 or -4 number has been observed. Such a change requires a versioned
      protocol amendment marked exploratory_only and is never an edit. EV-IC-002 is this
      program's own precedent for a support verdict retracted because a criterion was
      revised after the prior criterion was observed to fail.

  success_criterion: >-
    THERE IS NO CURRENT SUCCESS OUTCOME BECAUSE THIS CONTRACT IS NOT AUTHORIZED FOR
    EXECUTION. If a separately approved, frozen successor is executed, its positive
    disposition is: Stage 0 passes as exact identities; Stage 1 records verbatim readings
    of all seven relayed records or states which could not be obtained; L1 = 0 on the
    convolution side at every cell; L4 returns exactly 1 and exactly 3 with C/F exactly 1;
    the coset-union control matches its pre-written spectrum; the F ladder and the m ladder
    both decay with the forced sign; and L2, L3 are reported with their bands and their
    null spreads, INSIDE OR OUTSIDE, with the outside case escalated rather than absorbed.
    THAT DISPOSITION SUPPORTS EXACTLY the scoped statement in claim_ceiling and nothing
    more; it establishes no ECDLP attack, cost, exponent, crypto-scale or deployed-scheme
    claim and does not close KN-OPEN-009.

  falsification_criterion: >-
    Any of: (a) either Stage-0 identity failing; (b) L1 exceeding tolerance at any cell;
    (c) L4 not returning exactly N/h - 1, in which case NOTHING may be reported; (d) L2
    outside [0.7, 1.4] or L3 outside [0.85, 1.15] with all controls passing -- which
    FALSIFIES the pre-registered no-deviation expectation and is the outcome the goal was
    created to find, escalated to independent review rather than reported as a routine
    positive; (e) the F ladder failing to decay with controls passing, which means the
    measured quantity is not the one (I3) governs; (f) Stage 1 finding the conservation
    mean is not F^m/N under any convention.

  outcomes:
    no_execution_authorization: >-
      THE ONLY CURRENT DISPOSITION. A review_required draft: no run, no observation, no
      evidence, no inference.
    future_controlled_null_toy: >-
      The expected outcome. The x-coordinate factor base is indistinguishable from a
      matched random symmetric subset at toy scale, on the declared panel, at m <= 4. This
      is a CONTROLLED NULL and is a first-class deliverable: it is the relation-rate
      statement KN-OPEN-009 wanted, made against a statistic that could have found
      something, with the forward guidance of F7 attached.
    future_deviation_found: >-
      L2 or L3 outside band with all controls passing. Escalated to independent
      review-adversarial; not written up as an attack, because a relation-rate deviation is
      one term of a cost model and the linear-algebra stage is uncharged.
    instrument_failure: >-
      Positive control 1 fails or the two computation paths disagree. Inconclusive
      instrument signal; never evidence.
    infrastructure_or_integrity_failure: >-
      See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      THE IDENTITIES (I1) AND (I2) AND THE BOUND (I3) ARE SCALE-FREE and hold for every
      finite abelian group; a toy run CHECKS them rather than estimating them, and their
      validity comes from the derivation. THE MEASURED QUANTITIES DO NOT TRANSFER. C/F at
      p ~ 10^3 says nothing about C/F at p ~ 2^256, and HEUR-CHR-2 -- on which the only
      substantive consequence (P2) is conditional -- is measured here only as a toy-scale
      trend over three primes, which is far too short a ladder to establish an exponent.
      Any citation must state which of the two it relies on. Explicit limit: nothing here
