experiment:
  id: EXP-EQIC-0f0884
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-1ea327
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE SUMMATION-POLYNOMIAL SIDE, NOT THE FACTOR-BASE SIDE: rewrite the j = 0 decomposition
    system in the mu_3-INVARIANT coordinate u = x^3, where the factor-base membership polynomial drops
    from degree 3m to degree m and the summation polynomial is replaced by its NORM, and measure whether
    the norm''s degree inflation (bidegree (6,6) against (2,2)) exactly cancels the 9-fold candidate-count
    deflation or leaves a net Groebner saving'
  status: draft
  objective: "(A) THE INVARIANT RING, EXACTLY. For E/F_p with j = 0, i.e. a = 0 and E : y^2 = x^3\
    \ + b with p = 1 mod 3, the automorphism phi(x, y) = (zeta_3 x, y) acts on the x-line as the linear\
    \ mu_3-action x -> zeta_3 x. The invariant ring of that action is\n  F_p[x]^{mu_3} = F_p[u], \
    \  u = x^3,\na POLYNOMIAL ring in one variable, and the quotient map x -> u is 3-to-1 away from\
    \ x = 0. Nothing subtler is needed: mu_3 acts by scalars on a one-dimensional space, so the invariant\
    \ ring is generated by the single element x^3 and the isotypic grading is by degree mod 3.\n(B)\
    \ THE MEMBERSHIP DEGREE COLLAPSES, EXACTLY. Let V be a union of m phi-orbits, |V| = 3m, with orbit\
    \ representatives x_1, ..., x_m and u_j = x_j^3. The factor-base membership polynomial factors:\n\
    \  f_V(x) = prod_{v in V} (x - v) = prod_{j=1}^{m} (x^3 - u_j) = g(u),\n  g(T) = prod_{j=1}^{m}\
    \ (T - u_j),   deg g = m.\nSo the constraint \"x_i lies in a factor base of size 3m\" is a degree-m\
    \ equation in u_i instead of a degree-3m equation in x_i. This is exact, not heuristic, and it\
    \ is the entire reason the reformulation is worth measuring.\n(C) THE SUMMATION POLYNOMIAL IS\
    \ A RELATIVE INVARIANT, EXACTLY, AND ONLY WHEN a = 0. For y^2 = x^3 + a x + b,\n  S_3(x1,x2,x3)\
    \ = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3\n                  + ((x1 x2 - a)^2 - 4 b (x1+x2)).\n\
    Setting a = 0 and grouping by total degree in (x1,x2,x3):\n  (x1-x2)^2 x3^2                 ->\
    \ total degree 4\n  -2 (x1+x2) x1 x2 x3            -> total degree 4\n  -4 b x3              \
    \          -> total degree 1\n  (x1 x2)^2                      -> total degree 4\n  -4 b (x1+x2)\
    \                   -> total degree 1\nEVERY monomial has total degree congruent to 1 mod 3, hence\n\
    \  S_3(zeta x1, zeta x2, zeta x3) = zeta * S_3(x1, x2, x3):\nS_3 is a relative invariant of weight\
    \ 1 for the diagonal mu_3-action. When a != 0 the extra terms -2a(x1+x2)x3 (total degree 3), -2a\
    \ x1 x2 (degree 2) and a^2 (degree 0) appear and the congruence fails, so the weight-1 semi-invariance\
    \ holds IF AND ONLY IF a = 0. That biconditional is what makes a matched null available (see null_object_control).\n\
    (D) THE NORM, AND THE THREE ENCODINGS WITH THEIR EXACT DEGREES. Fix the target x_R. Because a\
    \ decomposition of phi^c(R) over V is as useful as a decomposition of R (it is one usable equation\
    \ either way; see the relation arithmetic in (F)), the decomposition condition to test is\n  EXISTS\
    \ (c1, c2) in (Z/3)^2 : S_3(zeta^{c1} x1, zeta^{c2} x2, x_R) = 0.\nThree encodings express it:\n\
    \  ENC-X   (the incumbent):  {S_3(x1,x2,x_R) = 0, f_V(x1) = 0, f_V(x2) = 0};\n          bidegree\
    \ (2,2) in (x1,x2); candidate count (3m)^2 = 9 m^2.\n  ENC-ASYM: T_rel(u1, x2) = prod_{d in Z/3}\
    \ S_3(zeta^d x1, x2, x_R), which\n          is mu_3-invariant in x1 and hence lies in F_p[u1,\
    \ x2] with\n          deg_{u1} = 2 and deg_{x2} = 6; system\n          {T_rel(u1,x2) = 0, g(u1)\
    \ = 0, f_V(x2) = 0};\n          candidate count m * 3m = 3 m^2.\n  ENC-SYM: T(u1,u2) = prod_{(c1,c2)\
    \ in (Z/3)^2} S_3(zeta^{c1}x1,\n          zeta^{c2}x2, x_R), invariant in both, so in F_p[u1,u2]\
    \ with\n          bidegree (6,6) and total degree 12; system\n          {T(u1,u2) = 0, g(u1) =\
    \ 0, g(u2) = 0};\n          candidate count m^2.\nDegrees: deg_{x_i} S_3 = 2 -> deg_{u_i} T =\
    \ 6, an inflation of exactly r = 3 per variable; candidate count 9 m^2 -> m^2, a deflation of\
    \ exactly r^2 = 9.\n(E) THE FALSIFIABLE QUESTION. Groebner cost is governed by the highest degree\
    \ reached, roughly (n + D choose D)^omega with n variables (KN-TECH-011). ENC-SYM has smaller\
    \ support and fewer solutions but higher input degree. THE CLAIM UNDER TEST: at arity 2 and matched\
    \ |V| = 3m, the measured solving-degree proxy and Groebner wall time for ENC-SYM and ENC-ASYM\
    \ are LOWER than for ENC-X by a factor of at least 2 at the largest affordable m. THE COMPETING\
    \ EXPLANATION, pre-registered as the more likely one: the r-fold degree inflation and the r^2-fold\
    \ candidate deflation cancel to within measurement noise, so the reformulation is a change of\
    \ coordinates with no cost consequence -- which, under the lossy-projection test, is the verdict\
    \ that the projection u = x^3 discards nothing the solver was using.\n(F) THE RELATION ARITHMETIC,\
    \ STATED BECAUSE THIS IS WHERE THE NAIVE VERSION DIES. A solution (u1, u2) of ENC-SYM certifies\
    \ that SOME conjugate pair (zeta^{c1} x1, zeta^{c2} x2) decomposes x_R, i.e. R = eps_1 phi^{c1}(P_1)\
    \ + eps_2 phi^{c2}(P_2) after back-substitution of cube roots (9 candidate phase pairs, resolved\
    \ in O(1) evaluations of S_3). Because phi acts on G as the scalar lambda with lambda^2 + lambda\
    \ + 1 = 0 mod N (H-ENDO-001), that decomposition contributes ONE equation\n  a_R + b_R k = eps_1\
    \ lambda^{c1} l_1 + eps_2 lambda^{c2} l_2  (mod N)\nover the m REDUCED unknowns l_1, ..., l_m.\
    \ The other 8 conjugate solutions of the same (u1,u2), and the images phi(R), phi^2(R), give equations\
    \ that are lambda-multiples of this one: their rank increment is exactly ZERO. So ENC-SYM yields\
    \ ONE INDEPENDENT RELATION per solved system, over m unknowns, exactly as ENC-X does over 3m unknowns.\
    \ The reformulation does not manufacture relations; it changes the ALGEBRAIC COST of finding one.\
    \ That is the only thing this proposal claims and the only thing it measures."
  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: 'R1: the object manipulated is the x-coordinate as a FIELD ELEMENT and the
    polynomial system over F_p -- summation-polynomial evaluations, norms, resultants, Groebner degrees.
    A generic-group simulator returns opaque handles and equality tests; it cannot evaluate S_3, cannot
    form a norm over a mu_3-action on the x-line, and cannot report a solving degree, so nothing here
    is simulable in the sense of KN-FIND-b7e091. R2: the reformulation is valid only for the curve
    EQUATION with a = 0, and the biconditional in claim (C) makes that dependence exact rather than
    incidental. This proposal never applies phi to a point of G to obtain new information -- claim
    (F) states positively that doing so yields rank increment zero -- so it does not fall under the
    admissibility filter of DECOMPOSITION.md section 2.'
  reachability_gate: 'NOT APPLICABLE TO THE EXPERIMENT, BINDING ON THE INTERPRETATION. The experiment
    moves between no curves: each arm fixes one curve and varies the encoding. The a != 0 null curve
    is CONSTRUCTED, not reached by an isogeny walk, so T5 does not bind on the design. What binds
    is T4: the mechanism exists only on curves whose isogeny class has D_0 = -3, and those cannot
    be reached from a class that lacks them at any cost. So even a maximal positive result here has
    zero reach to a curve chosen adversarially or at random, and that limitation is structural rather
    than budgetary.'
  inputs:
    procedure: 'THE CHEAPEST VALID DISCRIMINATOR IS STEP 1 PLUS STEP 2, AND IT COSTS MINUTES. Symbolically
      verify the weight-1 semi-invariance for a = 0 and its failure for a != 0, then build T_rel and
      T by two resultants and check the four declared degrees. Those two checks alone can kill the
      record before any curve is generated. Only if both pass: STAGE 3, the three-encoding comparison
      at field_bits in {12, 16, 20}, seeds {1, 2, 3}, arity 2, |V| = 3m a multiple of 3 with 3m =
      ceil(sqrt(N)) rounded down, 20 targets per cell, on harness/semaev.py''s existing sympy.groebner
      call with the system swapped. STAGE 4, NULL-1 on a matched a != 0 curve at the same p and comparable
      N. STAGE 5, report the table; make no cost claim before NULL-1 is in it.'
    mechanism: "STEP 1 -- SYMBOLIC VERIFICATION, ZERO COMPUTE, HARD GATE. With sympy over Q (not mod\
      \ p), verify\n  expand(S_3(z*x1, z*x2, z*x3) - z*S_3(x1,x2,x3)) == 0 modulo z^3 - 1\nfor a =\
      \ 0 symbolic b, and verify it FAILS for symbolic a != 0. If either check does not come out as\
      \ claim (C) says, this record is wrong and the line ends here at a cost of minutes.\nSTEP 2\
      \ -- BUILD THE NORMS. T_rel(u1, x2) := Res_{x1}(S_3(x1, x2, x_R), x1^3 - u1), which equals prod_{d}\
      \ S_3(zeta^d x1, x2, x_R) up to the leading coefficient of x1^3 - u1, namely 1, so equality\
      \ is exact. Then T(u1, u2) := Res_{x2}(T_rel(u1, x2), x2^3 - u2). Both are single resultants\
      \ of small polynomials and are computed once per (curve, target) with sympy.resultant. VERIFY\
      \ the declared degrees: deg_{u1} T_rel = 2, deg_{x2} T_rel = 6, deg_{u1} T = deg_{u2} T = 6,\
      \ total degree of T = 12. A degree that disagrees with claim (D) falsifies the record's arithmetic\
      \ and is reported as such.\nSTEP 3 -- THE THREE SYSTEMS, ONE COMPARISON. On a fixed j = 0 instance\
      \ with V a union of m phi-orbits, |V| = 3m, and a fixed stream of targets, solve\n  ENC-X: \
      \   groebner([S_3(x1,x2,x_R), f_V(x1), f_V(x2)], x1, x2, modulus=p)\n  ENC-ASYM: groebner([T_rel(u1,x2),\
      \ g(u1), f_V(x2)], u1, x2, modulus=p)\n  ENC-SYM:  groebner([T(u1,u2), g(u1), g(u2)], u1, u2,\
      \ modulus=p)\nrecording for each: wall time, basis size, maximum total degree of the reduced\
      \ basis (the implementation-bound proxy KN-TECH-004 and harness/semaev.py already use and label\
      \ as such), number of solutions, and whether the ideal is trivial. The three systems have the\
      \ SAME solution content by construction, so any cost difference is attributable to the encoding\
      \ alone -- this is the one-variable comparison, and the variable is the encoding.\nSTEP 4 --\
      \ CERTIFY EVERY POSITIVE. For every (u1,u2) solution, back-substitute cube roots, resolve the\
      \ phase pair by direct evaluation, lift to points, and hand the result to harness/semaev.py::verify_decomposition_certificate,\
      \ which re-checks the point sum independently of the solver. An uncertified solution is discarded\
      \ and counted.\nSTEP 5 -- THE NULLS. Run STEP 3 unchanged on the two null objects specified\
      \ in null_object_control. Report all three columns side by side. No cost claim is made before\
      \ the nulls are in the same table."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL-1, the a != 0 curve with the formally identical cube substitution (blocking)
  - NULL-2, ENC-X on a cardinality-matched random base of size 3m
  - 'r = 1 degeneration fixture: ENC-SYM must reproduce ENC-X exactly'
  - a satisfiable and an unsatisfiable target per cell, so that the trivial ideal branch is exercised
    in both encodings
  - independent certificate re-verification of every claimed decomposition
  - identical solver, monomial order (grevlex), modulus and machine across all three encodings
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. TWO NULLS, and the first is the sharp
    one. NULL-1, THE FAKE-INVARIANT CURVE. Run the identical pipeline on a curve with a != 0, where
    by claim (C) the mu_3 semi-invariance FAILS and x -> zeta x is NOT an automorphism -- but where
    the substitution u = x^3 and the resultant construction still formally go through and still produce
    a system with membership degree m and a norm of bidegree (6,6). If the measured Groebner saving
    is the SAME there, the saving is a property of the CUBE SUBSTITUTION (a change of variables that
    happens to lower the membership degree) and NOT of the endomorphism, and no phi-attributed claim
    may be made. This is the direct implementation of the lossy-projection test and it is the single
    most informative control in this record. NULL-2, THE CARDINALITY-MATCHED RANDOM BASE. ENC-X on
    a uniformly drawn base of the same cardinality 3m on the same curve, per IDEA-20260807-b42544.
    DECAY PARAMETER: epsilon, the fraction of orbits broken at fixed |V| = 3m. ENC-SYM is not even
    well posed at epsilon > 0 (a broken base is not a union of orbits, so f_V does not factor as g(x^3));
    the required decay is therefore measured on ENC-ASYM''s SOLVABLE FRACTION -- the fraction of collected
    decompositions whose x1 lies in a complete orbit -- which must fall to 0 as epsilon -> 1. A saving
    that persists at epsilon = 1 is an artifact.'
  independent_variables: []
  metrics:
    primary:
    - Groebner wall time, basis size, max total degree, per encoding per target
    - degrees of T_rel and T as actually constructed
    - number of solutions found and number certified per encoding
    - independent relations recovered per solved system
    secondary:
    - NULL-1 columns for every metric above
    - resultant construction time and memory (charged to the encoding)
    - sha256 of the factor base, of g, of T_rel and of T per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: maximum total degree of the reduced Groebner basis, ENC-SYM against ENC-X, same instance,
      same target, |V| = 3m fixed
    formula: A reduction of at least 2 in the degree proxy at the largest affordable m, sustained
      over at least 20 targets. A reduction of 0 or 1 is pre-registered as CANCELLATION, the competing
      explanation, and is recorded as a controlled null rather than as a weak positive.
    source: pre-registered in IDEA-20260807-1ea327 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SOLVER IDIOSYNCRASY. sympy's Buchberger/F5-style routine may respond to the encodings in ways
    an optimized F4 would not. The comparison is valid only WITHIN this solver, and the record must
    say so wherever a ratio appears. A second solver on frozen seeds is the mitigation and is listed
    as a follow-on, not as a claim.
  - RESULTANT COST CHARGED TO THE WRONG SIDE. T_rel and T are built once per target and that cost
    belongs to the invariant encodings. Amortizing it over many targets (T depends on x_R, so it cannot
    be amortized across targets, while g depends only on V and can) must be accounted exactly, or
    ENC-SYM is credited with a saving it did not make.
  - COEFFICIENT GROWTH. T has total degree 12 with coefficients that are polynomials in b and x_R;
    over F_p there is no growth, but the symbolic construction over Z before reduction can blow up.
    Reduce mod p before expanding.
  - THE x = 0 ORBIT. A degenerate mu_3-orbit of size 1 breaks f_V(x) = g(x^3); excluded by assumption
    and checked per cell.
  - TARGET-DEPENDENT WINNER. If the winning encoding varies with the target, the quantifier audit
    above downgrades the claim; averaging over targets would hide exactly this and is forbidden as
    the primary report.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: A reduction of at least 2 in the degree proxy at the largest affordable m, sustained
    over at least 20 targets. A reduction of 0 or 1 is pre-registered as CANCELLATION, the competing
    explanation, and is recorded as a controlled null rather than as a weak positive.
  falsification_criterion:
  - 'STEP 1 fails: S_3 at a = 0 is not weight-1 semi-invariant, or it IS semi-invariant at a != 0.
    Claim (C) is false and the record is superseded, not amended.'
  - The constructed norms do not have the degrees in claim (D). The degree bookkeeping is wrong and
    every cost prediction built on it is void.
  - ENC-SYM at r = 1 does not reproduce ENC-X exactly. The norm construction is wrong and no comparative
    number may be reported.
  - NULL-1 shows the same saving at a != 0. No phi-attributed claim may be made; the honest result
    is that the cube substitution lowers membership degree and the endomorphism is not load-bearing.
    This is a controlled null and is a deliverable.
  - ENC-SYM's wall time exceeds ENC-X's at every tested m. The degree inflation dominates; the invariant
    encoding is worse at arity 2; the obstruction is named (r-fold per-variable degree inflation)
    and the forward pointer is IDEA-20260807-5ddccf's arity scaling.
  - Resultant construction or Groebner exceeds the memory budget. An INFRASTRUCTURE outcome under
    AGENTS.md rule 5, recorded as such, never as evidence about encodings.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-1ea327
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
