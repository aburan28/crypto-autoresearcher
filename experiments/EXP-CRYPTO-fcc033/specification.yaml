experiment:
  id: EXP-CRYPTO-fcc033
  hypothesis_id: H-CRYPTO-9a0aca
  source_proposal: IDEA-20260815-abcbbc
  derived_from_idea: IDEA-20260815-abcbbc
  question_id: RQ-CRYPTO-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    The ECC portfolio status matrix -- extract status, blocking obligation,
    nearest reachable decision and clearing condition from every committed ECC
    goal record under a frozen rule, with a completed-goal null and an
    active-goal null, a two-extractor agreement measurement, and counts of the
    contract gaps AGENTS.md requires to be filled

  objective: >-
    The one uncertainty a run reduces is which ECC goals are live, what each is
    waiting on, which have a decision within reach, and how many carry an
    impediment or deferral without the concrete clearing condition AGENTS.md
    requires -- none of which is currently answerable from committed state,
    because goal records carry their state individually and no record assembles
    them. A run establishes (i) a per-goal matrix over the declared ECC portfolio
    at a fixed commit; (ii) the counts of goals lacking a clearing condition, of
    goals still carrying a status the contract now refuses, of goals whose
    next_action names no reachable decision, and of records that do not parse;
    (iii) two forced controls demonstrating that the extraction can both find and
    not find a blocking obligation; and (iv) an inter-extractor agreement rate
    that decides whether the matrix is mechanical or judgement-laden.
    THE MATRIX PRIORITISES NOTHING and changes no goal record. NO MATHEMATICAL OR
    SECURITY CLAIM IS MADE OR WOULD FOLLOW FROM A RUN.
    BUDGET FLOOR NOTE. wall_clock_seconds_per_run is 1800 and maximum_memory_gb is
    8, both at or above the template floors. Parsing a few dozen YAML files is
    milliseconds; the budget is sized to reading prose next_actions carefully and
    to running the extraction twice independently.

  what_this_is_not:
    - >-
      Not research about the ECDLP or any cryptosystem, and not toy, medium or
      crypto evidence about anything.
    - >-
      Not a prioritisation, a ranking, or a recommendation to close, reopen or
      retire any goal. It triages; ranking is a Coordinator act with its own
      decision record.
    - >-
      Not a change to any goal's status, next_action, impediments or checkpoints.
      Filling a contract gap is a Coordinator act; finding one is this contract's
      whole output.
    - >-
      Not evidence that any deferral was wrong. A missing clearing condition is a
      contract gap to be filled, and an impediment is never evidence about the
      science (AGENTS.md rule 5).
    - >-
      Not a description of the campaign. It describes THE LEDGER at a stated
      commit and date, which may lag the campaigns it surveys.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output,
      or evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: null
    exact_scope_a_run_could_support: >-
      Maximal supportable scope -- at a stated commit and date, the goal records
      classified as ECC by the declared classifier had the stated statuses,
      blocking obligations, nearest reachable decisions and clearing conditions
      under one frozen extraction rule; a stated number lacked a clearing
      condition; a stated number carried a status the contract refuses; a stated
      number had a next_action naming no reachable decision; a stated list did not
      parse; and two independent extractors agreed at a stated rate.
      WHAT DOES NOT FOLLOW -- no statement about any goal's actual campaign state
      as opposed to its recorded state; no statement about which goals are worth
      running; no ranking of any kind; no statement that any deferral was
      justified or unjustified; and nothing whatever about the ECDLP.

  inputs:
    procedure: >-
      STAGE 0 (reading; can terminate the line). Fix and record the commit. Obtain
      the ECC set by running `python3 tools/ecc_priority.py --list-areas` and
      classify every goal record with `--classify`, recording both outputs
      VERBATIM. DO NOT re-derive the set and DO NOT infer membership from an
      identifier prefix; AGENTS.md forbids both by name. Then CHECK WHETHER
      EXISTING TOOLING ALREADY ASSEMBLES THIS MATRIX -- tools/ecc_priority.py,
      tools/obstruction_registry.py, tools/research_dispatch.py,
      tools/merge_digest.py, tools/goal_lanes.py lanes -- recording the commands
      run and their output. If one already produces the matrix, STOP and report
      it. Absence of a search result is not evidence that no such tooling exists.
      STAGE 1 (freeze the rule). Write the extraction rule verbatim, before any
      goal record is opened: how a status is read, how a blocking obligation is
      identified in a prose next_action, what counts as a nearest reachable
      decision, what counts as a clearing or revisit condition under each of the
      three declared readings, and how a record is judged unparseable. Name the
      two forced-control goals -- one COMPLETED ECC goal, one ACTIVE ECC goal with
      a decision-naming next_action -- before extraction begins.
      STAGE 2 (controls, FIRST). Run the extraction on the two named forced
      controls and WRITE both verdicts before any other goal is opened. If the
      completed goal shows a blocking obligation, or the active goal does not
      extract cleanly, STOP and report the extraction failure.
      STAGE 3 (the matrix). Extract every ECC goal in BOTH layouts -- single
      ledger/goals/GOAL-X.yaml files and sharded ledger/goals/GOAL-X/ directories
      with goal.yaml and checkpoints. Report parse failures rather than skipping
      them. Report goals whose next_action is prose naming no decision as a
      DISTINCT CATEGORY.
      STAGE 4 (the three gap readings). Count separately: impediments lacking a
      concrete clears_when or recheck; goals carrying status paused or blocked,
      which AGENTS.md refuses by name as of 2026-09-04; and deferrals lacking a
      revisit condition under the pre-2026-09-04 wording the parent proposal was
      written against. Never merge the three into one number.
      STAGE 5 (staleness tail check). For each goal, find the most recent
      committed decision citing it and report whether that decision POSTDATES the
      goal's own status update. This is HEUR-PORT-1's prescribed tail check and it
      measures the lag rather than assuming it away.
      STAGE 6 (agreement). A second, independent extractor applies the IDENTICAL
      frozen rule to the declared sample without reading the first extractor's
      output. Report the per-field agreement rate. If agreement on the
      blocking-obligation field is below 0.80, the matrix is RELABELLED a
      judgement-laden survey and reported with its disagreement rate.
    instrument: >-
      Python 3 standard library plus a YAML parser for the goal records.
      tools/ecc_priority.py is invoked for portfolio membership and its output
      recorded verbatim; membership is never recomputed. NO NETWORK ACCESS is
      required and none may be used. The two extractors in Stage 6 are two
      separate agent sessions applying the same written rule, neither reading the
      other's output before both are recorded. Runs recorded through
      harness/runner.py.
    parameters: >-
      ECC set read from orchestration/research-priority.yaml through
      tools/ecc_priority.py. Both goal layouts in scope. Four extracted fields:
      status, blocking obligation, nearest reachable decision, clearing or revisit
      condition. Three gap readings counted separately. Agreement threshold 0.80
      on the blocking-obligation field. Agreement sample the larger of 8 goals or
      one third of the portfolio. Commit fixed at run time and recorded. Source of
      truth is committed records only, never session memory.

  controls:
    - >-
      COMPLETED-GOAL NULL, MUST FIRE. A COMPLETED ECC goal, NAMED before
      extraction, must show NO blocking obligation. A completed goal has nothing
      pending by definition, so a blocking obligation there means the rule is
      reading prose it should not read. If it fires wrongly, the extraction is
      wrong and NO count derived from it is reportable.
    - >-
      ACTIVE-GOAL NULL, MUST FIRE. An ACTIVE ECC goal with a clear
      decision-naming next_action, NAMED before extraction, must extract cleanly
      on all four fields. This calibrates against a known-good case and fails in
      the OPPOSITE direction from the completed-goal null: one catches
      over-extraction, the other under-extraction, and a rule that fails both for
      the same reason is not responding to the fields it names.
    - >-
      COMMITTED-RECORDS-ONLY CONTROL. Every extracted value is read from a
      committed file at the recorded commit, never from session memory or from a
      working-tree modification. A value that cannot be pointed at a committed
      file and line is dropped rather than reported.
    - >-
      PARSE-FAILURE CONTROL. Records that do not parse are REPORTED with their
      paths, never skipped. A silently skipped record makes every count wrong in a
      direction no reader can see.
    - >-
      DISTINCT-CATEGORY CONTROL. Goals whose next_action is prose naming no
      decision are reported as their own category and are never folded into either
      the advanceable or the blocked set.
    - >-
      THREE-READING CONTROL. The contract gap is counted under all three declared
      readings separately and never merged, because the governing rule CHANGED
      after the parent proposal was written and a merged count would measure
      neither wording.
    - >-
      SET-SOURCE CONTROL. Portfolio membership comes from tools/ecc_priority.py
      with its output recorded verbatim. An extraction that builds its own ECC set,
      and in particular one that infers membership from an identifier prefix, is
      surveying a different portfolio and is invalid.
    - >-
      TWO-EXTRACTOR AGREEMENT CONTROL, CAN FAIL. Two independent sessions apply
      the identical frozen rule to the declared sample, blind to each other, and
      the per-field agreement rate is reported. This is what separates a mechanical
      matrix from a set of opinions, and the parent proposal's own prior of only
      0.5 on extractability is why it is not optional.
    - >-
      INCUMBENT-TOOLING CHECK, ZERO COMPUTE, CAN TERMINATE. Stage 0 checks whether
      existing tooling already assembles the matrix, recording every command run
      and its output. Executed rather than asserted.

  independent_variables:
    - goal record, over the declared ECC portfolio
    - goal layout, single file versus sharded directory
    - gap reading, over the three declared readings
    - extractor identity, for the agreement measurement

  metrics:
    primary:
      - >-
        goal_matrix -- one row per ECC goal carrying goal id, status, blocking
        obligation, nearest reachable decision, clearing or revisit condition, the
        committed file path and line supporting each value, and the layout the
        record uses.
      - >-
        completed_goal_null_verdict -- the blocking obligation extracted for the
        named completed goal. Forced value NONE.
      - >-
        active_goal_null_verdict -- whether the named active goal extracted
        cleanly on all four fields. Forced value CLEAN.
      - >-
        gap_count_clears_when -- integer, ECC goals recording an impediment or
        deferral without a concrete clears_when or recheck, under the current
        contract.
      - >-
        gap_count_forbidden_status -- integer, ECC goals carrying status paused or
        blocked, which AGENTS.md refuses by name as of 2026-09-04.
      - >-
        gap_count_legacy_revisit -- integer, ECC goals deferred without a recorded
        revisit condition under the pre-2026-09-04 wording, reported separately
        for continuity with the parent proposal.
      - >-
        no_reachable_decision_count -- integer, ECC goals whose next_action names
        no reachable decision, reported as a distinct category.
      - >-
        unparseable_records -- the list of ECC goal record paths that do not
        parse, with the parse error for each.
      - >-
        extractor_agreement_rate -- per-field agreement between the two independent
        extractors on the declared sample, dimensionless, reported per field with
        the blocking-obligation field called out against the 0.80 threshold.
    secondary:
      - >-
        ecc_goal_count -- the run's own count of ECC goals at the fixed commit,
        reported beside the parent proposal's relayed figure of 26 with the
        difference stated and the relayed figure labelled as relayed.
      - >-
        staleness_tail -- per goal, whether the most recent committed decision
        citing it postdates its own status update, with both dates. HEUR-PORT-1's
        prescribed tail check.
      - >-
        ecc_priority_output -- the verbatim output of
        `tools/ecc_priority.py --list-areas` and of `--classify` per record,
        including the recorded exclusions and their reasons.
      - >-
        extraction_rule -- the frozen rule verbatim, as written before any goal
        record was opened.
      - >-
        incumbent_tooling_finding -- what Stage 0 found about existing tooling,
        with every command run and its output.
      - >-
        disagreement_cases -- for every field the two extractors disagreed on, both
        readings and the prose that produced them. This is the transferable content
        of a low agreement rate and is required even when agreement is high.

  heuristic_under_test: HEUR-PORT-1

  preregistered_prediction:
    quantity: >-
      completed_goal_null_verdict, active_goal_null_verdict,
      gap_count_clears_when, and extractor_agreement_rate.
    formula: >-
      Forced values, fixed before extraction: completed_goal_null_verdict is NONE;
      active_goal_null_verdict is CLEAN; gap_count_clears_when is at least 1; and
      extractor_agreement_rate on the blocking-obligation field is at least 0.80.
      Under the null that the ECC portfolio is contract-complete on the clearing
      condition, gap_count_clears_when is 0 while both forced controls still fire.
    source: >-
      The parent proposal IDEA-20260815-abcbbc, whose predictions fix the two
      nulls as FORCED, whose falsification_conditions name a misbehaving null as
      the extraction being wrong, and whose honest_prior_of_survival states 0.85
      that goal records parse and statuses extract, 0.5 that blocking obligations
      are extractable from prose next_actions without excessive judgement, and 0.6
      that several deferrals lack revisit conditions. THE 0.80 AGREEMENT THRESHOLD
      IS THE CONVERTING COORDINATOR'S and is declared as such here rather than
      attributed to the proposal, which names the extractability risk but supplies
      no threshold; it is fixed before any extraction so it cannot be tuned to a
      result. Never tuned to data; a run that reports a different quantity reports
      a different experiment.

  scale_relevance:
    tier: null
    justification: >-
      TIER IS NULL AND THE NULL IS THE HONEST ENTRY. This contract instantiates no
      curve, no group and no cryptographic computation at any size. It produces no
      toy, medium or cryptographic evidence about the ECDLP, and labelling it
      `toy` would falsely imply toy-scale ECDLP evidence exists. What it measures
      is the shape of this repository's own goal records, which has no
      cryptographic scale coordinate at all. Transfer assumption, stated
      explicitly: the matrix transfers to nothing outside the commit and date it
      records, and by HEUR-PORT-1 it describes the LEDGER rather than the
      campaigns the ledger tracks.
    correspondence: null

  tail_checks:
    - >-
      For every goal, compare its status-update date against the date of the most
      recent committed decision citing it, and report the goals where the decision
      is later. This is HEUR-PORT-1's own prescribed tail check and it is the only
      direct measurement of the staleness the heuristic admits.
    - >-
      Report the matrix separately for sharded goals and single-file goals. A rule
      that silently handles only one layout would produce a complete-looking matrix
      over half the portfolio, and the split makes that visible.
    - >-
      Report the LENGTH of each next_action alongside its extracted blocking
      obligation. If extraction succeeds only on short next_actions and fails on
      long ones, the agreement rate alone would hide a systematic boundary.
    - >-
      Report the disagreement_cases list in full even when agreement is high,
      since the prose that two careful readers read differently is the transferable
      content and a high headline would otherwise discard it.

  replication:
    seeds: []
    seeds_note: >-
      EMPTY AND JUSTIFIED. The extraction is exhaustive over the ECC portfolio at
      a fixed commit and performs no random sampling; the agreement sample is
      declared by rule (the larger of 8 goals or one third of the portfolio,
      selected by a stated deterministic ordering) rather than drawn at random,
      precisely so that a sample cannot be redrawn after seeing a disagreement. A
      seed would be inert and recording one would falsely imply a stochastic
      component.
    independent_instances: 2
    independent_instances_note: >-
      Two instances, and they are NOT a determinism check -- they are the
      measurement. Two separate agent sessions apply the identical frozen rule to
      the declared sample, blind to each other, and their agreement rate is a
      primary metric. Blindness is the point: an extractor that reads the other's
      output measures agreement with a document rather than agreement about a
      record.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - >-
      Stop and report if Stage 0 finds that existing tooling already assembles
      this matrix. The run cites that output rather than re-deriving it.
    - >-
      Abort the package if the completed-goal null shows a blocking obligation, or
      the active-goal null does not extract cleanly, and report the extraction
      failure rather than any count.
    - >-
      Stop at the ECC set returned by tools/ecc_priority.py. No goal is added to
      or removed from the portfolio after the matrix is seen, and membership is
      never adjusted by hand.
    - >-
      Stop at the frozen extraction rule. A rule refined after seeing a goal's
      prose is a different experiment; record the difficulty as a disagreement case
      instead.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER a finding about the portfolio
      (AGENTS.md rule 5).
    - >-
      A run whose two forced controls were not extracted in the same invocation as
      the matrix is invalid_measurement -- the calibration this contract exists to
      provide was not provided.
    - >-
      A run that derives the ECC set itself, or infers portfolio membership from an
      identifier prefix, is completed_invalid. AGENTS.md forbids both by name and
      such a run surveys a different portfolio.
    - >-
      A run that skips an unparseable record rather than reporting it is
      completed_invalid, since every count it produces is then wrong in an
      invisible direction.
    - >-
      A run that merges the three gap readings into a single count is
      completed_invalid, because the governing rule changed between them and a
      merged count measures neither wording.
    - >-
      A run whose second extractor read the first extractor's output before
      recording its own is completed_invalid; the agreement metric measures nothing
      under that condition.
    - >-
      A run that extracts any value from session memory rather than from a
      committed file, or that reports a value it cannot point at a file and line
      for, is completed_invalid.
    - >-
      A run that edits any goal record, changes any status, next_action or
      impediment, or ranks or prioritises any goal, is completed_invalid; those are
      Coordinator acts outside this contract's write scope.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    All six of the following hold, each decidable from the primary metrics --
    (1) completed_goal_null_verdict is NONE;
    (2) active_goal_null_verdict is CLEAN on all four extracted fields;
    (3) the goal_matrix is complete over every goal the recorded
    tools/ecc_priority.py output classifies as ECC, in both layouts, with every
    value carrying its committed file path and line, and with unparseable_records
    reported rather than skipped;
    (4) gap_count_clears_when, gap_count_forbidden_status and
    gap_count_legacy_revisit are each reported as separate integers with their
    per-goal breakdowns;
    (5) no_reachable_decision_count is reported as its own distinct category;
    (6) extractor_agreement_rate is reported per field, and the
    blocking-obligation field is at or above 0.80.
    NOTE, AND IT IS DELIBERATE: success does NOT require gap_count_clears_when to
    be nonzero. A count of zero with both nulls firing is a clean negative for the
    hypothesis's C2 and a genuine deliverable, not a failed run.

  falsification_criterion:
    - >-
      completed_goal_null_verdict is not NONE. The extraction over-reads prose and
      is wrong; NO count in the package is reportable and the run returns to the
      Executor. Instrument failure, not a finding about the portfolio.
    - >-
      active_goal_null_verdict is not CLEAN. The extraction under-reads and is
      wrong in the opposite direction; the package is void.
    - >-
      gap_count_clears_when is 0 while both nulls fire. C2 is REJECTED at the
      tested scope: the ECC portfolio is contract-complete on the clearing-condition
      rule and the proposal's motivating concern does not hold. A clean negative and
      a real deliverable, reported plainly rather than buried.
    - >-
      extractor_agreement_rate on the blocking-obligation field is below 0.80. C4
      is REJECTED: the extraction is judgement rather than mechanism. The matrix is
      RELABELLED a judgement-laden survey, reported with its disagreement rate and
      its full disagreement_cases list, and may not be cited as a mechanical view.
    - >-
      A substantial fraction of ECC goal records do not parse. The portfolio cannot
      be surveyed mechanically at all; that is a process finding, reported with the
      exact list so the debt is closable and never merely as a shortfall.
    - >-
      Stage 0 finds existing tooling that already assembles the matrix. The
      hypothesis is superseded; the run cites that output rather than re-deriving
      it.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying the full per-goal matrix with a committed file path and line for every extracted value
    - the frozen extraction rule verbatim, written and hashed before any goal record was opened
    - the two forced-control goal ids, named before extraction, with their verdicts written and timestamped before any other row in the same file
    - the verbatim output of tools/ecc_priority.py --list-areas and of --classify per record, including recorded exclusions and their reasons
    - the three gap counts as separate integers with their per-goal breakdowns, never merged
    - the list of unparseable records with the parse error for each
    - both extractors' independent outputs on the declared sample, plus the per-field agreement rate and the complete disagreement_cases list
    - the staleness tail check, per goal, with both dates
    - the Stage 0 incumbent-tooling finding, with every command run and its output recorded verbatim
    - the pre-registration text, written before the first run and hashed

  assigned_to: executor
  approved_by: null

  approval_gate:
    - >-
      Coordinator drafting does not confer approval. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false. Approval is a separate human-reviewed act
      because it authorizes execution and spends compute.
    - >-
      THE TWO FORCED-CONTROL GOALS MUST BE NAMED IN WRITING BEFORE APPROVAL. A
      control goal chosen after seeing an extraction result is not a control, and
      the completed-goal null is the only check that catches over-extraction.
    - >-
      THE EXTRACTION RULE MUST BE FIXED IN WRITING BEFORE APPROVAL. It decides
      every count this contract produces, and a rule refined while reading prose is
      the exact failure the agreement measurement exists to detect.
    - >-
      The 0.80 agreement threshold is the Coordinator's judgement and the parent
      proposal supplies none. A reviewer may set it differently before approval;
      it may not be moved after a rate is measured.

  derivation_provenance:
    tool: coordinator-authored contract under the backlog-conversion task
    source_record: IDEA-20260815-abcbbc
    authored_under_task: TASK-20260904-e1420d
    authored_at: '2026-09-04'
    note: >-
      Metrics, controls, forced values and falsifiers are taken from the parent
      proposal's predictions, minimal_test, null_object_control and
      falsification_conditions and restated as measurable quantities with units.
      Boilerplate identical across contracts by program rule -- invalidation
      rules, required artifacts, approval gate -- comes from the fixed table.
      Budgets are set from the parent's declared estimated_cost of low
      implementation and low compute, and raised to the template floors. No field
      is invented; a value the proposal did not supply is null or is recorded as a
      derivation gap below.

  derivation_gaps:
    - >-
      THE GOVERNING RULE CHANGED AFTER THE PROPOSAL WAS WRITTEN. The proposal
      (2026-08-15) counts goals `deferred or paused with no recorded revisit
      condition`. On 2026-09-04 AGENTS.md removed `paused` and `blocked` from the
      permitted goal statuses and replaced the mechanism with an `impediments`
      block carrying clears_when and recheck. This contract counts all three
      readings separately rather than silently updating the proposal's wording or
      silently preserving it. The split is the converting Coordinator's and is the
      largest single departure from the parent record.
    - >-
      The parent proposal does not mention tools/ecc_priority.py,
      orchestration/research-priority.yaml, or the prohibition on inferring ECC
      membership from an identifier prefix. Reading the set rather than deriving it
      is the Coordinator's addition and is binding, because a self-derived set
      surveys a different portfolio.
    - >-
      The parent proposal does not mention the sharded goal layout
      (ledger/goals/GOAL-X/goal.yaml plus checkpoints). Handling both layouts is
      the Coordinator's addition; a single-layout extraction would produce a
      complete-looking matrix over part of the portfolio.
    - >-
      The 0.80 inter-extractor agreement threshold and the two-extractor design are
      the Coordinator's. The proposal identifies extractability from prose as its
      weakest point, giving it a prior of only 0.5, but supplies no measurement for
      it. Declaring a threshold before extraction is what makes the weakness
      decidable rather than merely acknowledged.
    - >-
      The parent proposal predicts NO VALUE for the count of goals with no
      reachable decision, for the count of goals carrying a now-forbidden status,
      for the unparseable list, or for the portfolio size, and those absences are
      carried into this contract deliberately. Its figure of 26 ECC goals is
      RELAYED from its own session and is reported beside the run's own count
      rather than adopted as a prediction.
    - >-
      Whether any found contract gap should then be FILLED, and by whom, is out of
      scope. This contract creates that work and discharges none of it, and filling
      a gap is a Coordinator act requiring its own decision record.
