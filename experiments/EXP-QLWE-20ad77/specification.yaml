# =============================================================================
# EXP-QLWE-20ad77 — version 1, approved by DEC-20261005-19b340.
# Frozen reading of six named paths for an archimedean-fibre sentence.
# The prediction (count 0 on opened files, missing PDFs unreadable) is
# fixed here, before any executor run. This design session opened the
# corpus paths in order to copy the quotations below. It did not extract
# an abstract into KN-LIT-6130.md. It did not open either named PDF.
# Source idea IDEA-20261005-ccc1ad is on origin/main. No lattice
# computation is authorized.
# =============================================================================
experiment:
  id: EXP-QLWE-20ad77
  hypothesis_id: H-QLWE-e37078
  question_id: RQ-QLWE-9108dc
  source_idea: IDEA-20261005-ccc1ad
  goal_id: null
  version: 1
  title: >-
    Reading of the opened Ideal-SVP texts for one archimedean-fibre
    sentence, with the named PDFs recorded unreadable if still absent
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-05'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261005-19b340
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the unread paper lacks the sentence,
      and it does not assert an attack or an exponent change.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Open the six named paths, quote or record absence or record that
      the path is missing. Do not run a lattice computation, a
      class-group computation, or a numerical evaluation of an
      asymptotic expression.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the opened texts contain a sentence that states what
    an archimedean fibre contributes to mixing, covering radius, or the
    height pairing. The pre-registered positive side of the absence
    reading is count 0 on every file that opens, with the instrument
    control keeping the approximation-factor sentence. The negative
    side is a quote of the falsifying sentence, or of any other
    fibre-contribution sentence, from an opened file. A missing PDF is
    unreadable. It is not a zero inside the paper. KN-LIT-6130 was
    still a title-only stub when this contract was frozen: no abstract
    had been extracted into that file.

  inputs:
    paths:
      - id: kn-lit-6130
        path: knowledge/literature/KN-LIT-6130.md
        role: title-only stub
        design_session_observation: >-
          Opened 2026-10-05. Contribution section says no abstract was
          extractable from the first two pages of the local PDF.
          Abstract not extracted in this session. Search for
          archimedean, fibre, fiber, covering radius, and height
          returned no matches.
      - id: kn-tech-060
        path: knowledge/techniques/KN-TECH-060.md
        role: nearby height sentence
        design_session_observation: >-
          Opened 2026-10-05. Contains the Néron–Tate quadratic-form
          sentence. Contains no archimedean-fibre sentence.
      - id: kn-tech-046
        path: knowledge/techniques/KN-TECH-046.md
        role: instrument control
        design_session_observation: >-
          Opened 2026-10-05. Contains the composed approximation-factor
          sentence. Contains no archimedean, fibre, fiber, or covering
          radius match.
      - id: digest-12171116
        path: research_digest/chunks/chunk_023.txt
        heading: "### file: 12171116.pdf (30p)"
        role: truncated abstract
        design_session_observation: >-
          Opened 2026-10-05. The block is the paragraph beginning
          "Random Self-reducibility of Ideal-SVP via Arakelov Random
          Walks" and ending inside the letters "algori". Whole-file
          search for archimedean, fibre, fiber, and covering radius
          returned no matches.
      - id: pdf-primary
        path: downloads/12171116.pdf
        role: named local copy
        design_session_observation: >-
          Not opened. Listing on 2026-10-05 returned "No such file or
          directory". An unopened file is not a reading.
      - id: pdf-duplicate
        path: downloads/12171116 (1).pdf
        role: named local copy
        design_session_observation: >-
          Not opened. Listing on 2026-10-05 returned "No such file or
          directory". An unopened file is not a reading.
    search_tokens:
      - archimedean
      - fibre
      - fiber
      - covering radius
    preregistered_quotes:
      self_reducibility: >-
        We then exploit this result to relate the average-case and the
        worst-case of the Shortest Vector Problem in ideal lattices.
      rapid_mixing: >-
        we prove that, subject to the Riemann Hypothesis for Hecke
        L-functions, certain random walks on the Arakelov class group
        have a rapid mixing property.
      hermite_loss: >-
        for Hermite-SVP in ideal lattices of certain cyclotomic number
        elds, it loses no more than a ˜O(√n) factor on the Hermite
        approximation factor.
      instrument: >-
        Composed: worst-case Ideal-SVP in quantum polynomial time at
        approximation factor exp(O~(sqrt(n))).
      height_not_fibre: >-
        On an abelian variety A over a number field K, the Néron–Tate
        (canonical) height associated to a symmetric ample line bundle
        is a positive semi-definite quadratic form on A(K) tensor R
        that vanishes exactly on the torsion subgroup.
      falsifying_sentence: >-
        The archimedean fibre supplies the logarithmic embedding at the
        infinite places and thereby determines the covering radius of
        the Arakelov-class-group random walk.
    quote_match: >-
      A pre-registered quote matches when the opened file contains that
      character sequence, ignoring a difference between a straight
      apostrophe and a curly apostrophe, and ignoring a markdown
      backtick around exp(O~(sqrt(n))). A broken-spacing variant that
      drops the letters inside a ligature does not match. Do not repair
      "number eld" into "number field" and then treat the repair as a
      quote.

  controls:
    - id: instrument-keeps-a-present-sentence
      statement: >-
        The same quote-or-absence procedure, applied to KN-TECH-046,
        records the pre-registered approximation-factor sentence.
      pass_condition: the instrument quote occurs in knowledge/techniques/KN-TECH-046.md
      on_fail: >-
        The run is inconclusive. Do not report the fibre count as a
        finding. A procedure that drops a sentence known to be present
        cannot certify an absence.
    - id: height-sentence-is-not-the-fibre
      statement: >-
        The Néron–Tate quadratic-form sentence in KN-TECH-060 is quoted
        and then scored as not a fibre-contribution sentence, because
        it does not name an archimedean fibre.
      pass_condition: height sentence quoted and fibre_contribution flag false for that quote
      on_fail: >-
        Scoring the height sentence as the fibre sentence invalidates
        the count.
    - id: title-is-not-a-theorem
      statement: >-
        The title in KN-LIT-6130 is recorded as a title. It is not
        recorded as an extracted abstract or as a checked theorem.
        kn_lit_6130_abstract_extracted is false unless a body abstract,
        beyond the title, was copied from an opened file into the run
        record. This design session's value is false.
      pass_condition: the run states whether an abstract was extracted, and does not promote the title to a theorem
      on_fail: Treating the title as an extracted theorem invalidates the run.
    - id: missing-pdf-is-unreadable
      statement: >-
        A path that does not open is recorded file_not_found. It
        contributes no integer to the fibre-contribution count.
      pass_condition: each missing path has readability file_not_found and is excluded from the count
      on_fail: >-
        Entering 0 for an unopened PDF invalidates the absence claim.
        That zero would be a statement about a file that was not read.
    - id: mixing-sentence-is-not-the-fibre
      statement: >-
        The rapid-mixing sentence is quoted from the digest block and
        scored as not a fibre-contribution sentence. It names the
        Arakelov class group and a Riemann Hypothesis hypothesis. It
        does not name the fibre.
      pass_condition: rapid-mixing quote present and fibre_contribution flag false for that quote
      on_fail: Scoring the mixing sentence as the fibre sentence invalidates the count.

  independent_variables:
    - which of the six paths is opened
    - which sentence class is scored (fibre contribution, self-reducibility, rapid mixing, approximation factor, Néron–Tate height)
    - whether the path opens or is recorded missing

  metrics:
    primary:
      - id: fibre_contribution_sentence_count
        statement: >-
          Number of sentences, in files that opened, that state what an
          archimedean fibre contributes to mixing, covering radius, or
          the height pairing. The pre-registered falsifying sentence
          counts as one if it occurs.
      - id: quote_or_absence_archimedean_fibre
        statement: >-
          For each opened file, either one verbatim fibre-contribution
          sentence or the token absent. For each missing file, the token
          file_not_found, which is not the token absent.
    secondary:
      - id: quote_or_absence_self_reducibility
        statement: >-
          One verbatim worst-case/average-case sentence from the digest
          block, or absent, plus the same token for KN-LIT-6130.
      - id: instrument_sentence_kept
        statement: Whether the approximation-factor sentence was quoted from KN-TECH-046.
      - id: kn_lit_6130_abstract_extracted
        statement: >-
          Boolean. False means the file is still a title-only stub and
          this run did not extract an abstract. True means a body
          abstract was copied from an opened file. The design-session
          value is false.
      - id: pdf_readability
        statement: opened or file_not_found, one value per named PDF.
      - id: numerical_check_or_explicit_skip
        statement: >-
          skipped_no_few_line_formula, or a single arithmetic comparison
          if a few-line formula was present. The tilde-O expression is
          not a few-line formula and is not evaluated.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says no distributional hypothesis is used. The experiment
    checks that the executor did not infer a fibre formula from the
    Riemann Hypothesis sentence and did not evaluate the asymptotic
    Hermite-factor loss. It is not a test that the Riemann Hypothesis
    is true.

  preregistered_prediction:
    quantity: >-
      The fibre-contribution sentence count on files that open, and the
      readability of the two named PDFs.
    formula: >-
      Count = 0 on every opened file. Each named PDF that does not open
      is file_not_found and is outside the count. The falsifying
      sentence does not occur. The instrument sentence does occur.
      kn_lit_6130_abstract_extracted is false unless a later opening of
      a PDF supplies an abstract, in which case that abstract is quoted
      and scored under the same count.
    source: >-
      IDEA-20261005-ccc1ad, plus quotations copied on 2026-10-05 from
      knowledge/literature/KN-LIT-6130.md,
      knowledge/techniques/KN-TECH-060.md,
      knowledge/techniques/KN-TECH-046.md, and the headed block of
      research_digest/chunks/chunk_023.txt, before any executor run of
      EXP-QLWE-20ad77. The two PDF paths were listed and not opened.

  scale_relevance:
    tier: toy
    justification: >-
      The tested objects are six files in this checkout. A sentence
      count here is not a count inside an unread PDF, not a result at
      cryptographic dimension, and not a transfer to Ring-LWE or
      Module-LWE parameters. No extrapolation is authorized.
    correspondence: >-
      Direct reading of the named paths. No sampling correspondence is
      used.

  tail_checks:
    - >-
      Instrument tail: the approximation-factor sentence is one
      sentence that must be kept. Missing it is a procedure failure,
      not evidence of absence.
    - >-
      Ligature tail: the digest contains broken tokens such as "number
      eld" and "o er". The substring archimedean has no fi or ff
      ligature. Its absence is the robust check. A bare fragment "bre"
      is not scored as the word fibre.

  replication:
    seeds:
      - name: reading_pass
        algorithm: none
        seed: 20261005
        note: >-
          No random stream is drawn. The seed records the date of the
          pre-registered quotations.
    independent_instances: 6
    independent_instances_note: >-
      The six paths are the instances. There is no second sample of
      curves, discriminants, or conductors.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). maximum_runs is 1. The
      scientific work is one reading of the six paths. Watch expiry is
      failed_infrastructure, never a negative mathematical result. No
      second run is authorized to evaluate a formula the reading did
      not extract.

  procedure:
    open: >-
      Open each of the six paths by reading the file. Do not fetch a
      replacement PDF from the network. Do not treat a search-engine
      snippet as the file. If the path is missing, record
      file_not_found and continue. Do not create the PDF.
    search: >-
      In each opened file, search for the four tokens archimedean,
      fibre, fiber, and "covering radius", case-sensitive, and record
      the hit count. Also record a case-insensitive hit count so a
      capitalised variant is not missed. A hit is not automatically a
      fibre-contribution sentence. Quote the surrounding sentence and
      score it.
    quote: >-
      From the digest block, quote at most one worst-case/average-case
      sentence and at most one rapid-mixing sentence, or record absent.
      From each opened file, quote at most one archimedean-fibre
      contribution sentence, or record absent. From KN-TECH-046, quote
      the approximation-factor sentence or record that the instrument
      failed. From KN-TECH-060, quote the Néron–Tate sentence and score
      it as not the fibre sentence. From KN-LIT-6130, record the title
      and whether any abstract body beyond the title was present.
    numerical_branch: >-
      If and only if an opened file contains a formula of a few
      arithmetic operations, evaluate that formula at one tiny
      discriminant (for example -3 or -4) or one tiny cyclotomic
      conductor and compare with direct arithmetic. The pre-registered
      state is that no such formula was extracted. The Hermite-factor
      loss of a tilde-O of square-root n is asymptotic and is not
      evaluated. If no few-line formula is present, record
      numerical_check: skipped_no_few_line_formula. Finding a few-line
      formula and not evaluating it invalidates the run.
    forbidden: >-
      Do not write a Selmer certificate or a Sha certificate. Do not
      certify a Mordell–Weil rank. Do not claim an attack. Do not claim
      an exponent improvement. Do not fill an unopened PDF's sentence
      count with 0.
    mechanism_assignment:
      - observation: >-
          fibre_contribution_sentence_count is 0, the instrument
          sentence is kept, the height sentence and the rapid-mixing
          sentence are scored as not fibre sentences, every missing PDF
          is file_not_found, the two pre-registered digest sentences
          occur in the headed block, and kn_lit_6130_abstract_extracted
          is false.
        assigns_to: >-
          Absence reading holds on the opened texts. Does not prove the
          unread paper lacks the sentence. Does not extract an abstract
          into KN-LIT-6130.
      - observation: >-
          An opened file contains the pre-registered falsifying
          sentence, or any other sentence that assigns the archimedean
          fibre a role in mixing, covering radius, or the height
          pairing.
        assigns_to: >-
          The 0-count fails. Quote the sentence and name the file. This
          is a successful negative for the absence reading.
      - observation: >-
          A pre-registered quotation does not occur in the file named
          as its source.
        assigns_to: >-
          Invalid reading. The design-session copy and the executor's
          file disagree. Not evidence about Ideal-SVP.
      - observation: >-
          A named PDF opens. Score its sentences under the same rules.
          A fibre-contribution sentence there is the second row. Absence
          there is an additional 0 on that file only.
        assigns_to: >-
          The file-not-found outcome is withdrawn for that path. The
          paper is still unread beyond the pages that were opened.
      - observation: >-
          The instrument sentence is not found, or a missing PDF is
          entered as count 0, or the height sentence or the mixing
          sentence is scored as the fibre sentence, or the title is
          promoted to a theorem, or a few-line formula is present and
          not evaluated, or the watch expires, or the path cannot be
          read for a reason other than file_not_found.
        assigns_to: >-
          Inconclusive, or invalid, as the matching invalidation rule
          says. Not evidence that the fibre sentence is absent, and not
          evidence that it is present.

  stopping_rules:
    - Stop when each of the six paths has a quote, an absent token, or file_not_found, and every control has a pass or fail bit.
    - Do not open a seventh path. Do not download a PDF. Do not add a discriminant sweep.
    - Do not evaluate the tilde-O expression.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing reader is failed_infrastructure and is not evidence against the hypothesis.
    - Entering a fibre-contribution count for a path that did not open invalidates the run.
    - Treating the Néron–Tate sentence, the rapid-mixing sentence, or the title as the archimedean-fibre sentence invalidates the count.
    - Stating an Ideal-SVP theorem, an attack, an exponent improvement, a Selmer certificate, a Sha certificate, or a rank that was not in an opened file invalidates the run.
    - Evaluating the asymptotic Hermite-factor loss as if it were a few-line identity invalidates the numerical branch.
    - Changing the pre-registered prediction after seeing the files is forbidden. A correction is a new amendment record, and an existing run is not re-scored against it.
    - Reporting kn_lit_6130_abstract_extracted true without quoting the extracted abstract invalidates that flag.

  success_criterion: >-
    The run is a success for the absence reading exactly when the first
    row of mechanism_assignment holds: the fibre-contribution count on
    opened files is 0, the instrument sentence is kept, the height
    sentence and the rapid-mixing sentence are not scored as fibre
    sentences, each missing PDF is file_not_found rather than a zero,
    the two pre-registered digest sentences occur, and
    kn_lit_6130_abstract_extracted is false. Any other completed
    assignment is not this success. In particular, quoting the
    falsifying sentence is not a success for the absence reading.

  falsification_criterion: >-
    The absence reading fails when the second row of
    mechanism_assignment holds: an opened file contains the sentence
    "The archimedean fibre supplies the logarithmic embedding at the
    infinite places and thereby determines the covering radius of the
    Arakelov-class-group random walk," or any other sentence that
    assigns the archimedean fibre a role in mixing, covering radius, or
    the height pairing. The third row falsifies the design-session
    quotations, not Ideal-SVP. The fifth row falsifies nothing.

  required_artifacts:
    - experiments/EXP-QLWE-20ad77/runs/RUN-*/manifest.yaml
    - experiments/EXP-QLWE-20ad77/runs/RUN-*/stdout.txt
    - experiments/EXP-QLWE-20ad77/runs/RUN-*/stderr.txt
    - experiments/EXP-QLWE-20ad77/runs/RUN-*/reading.yaml
  artifact_contents:
    reading.yaml: >-
      One record per path: path, readability, token hit counts, at most
      one quote per sentence class, fibre_contribution flag, and for
      KN-LIT-6130 the boolean kn_lit_6130_abstract_extracted together
      with the quoted abstract or the token not_extracted. Then one
      assignment row, the control bits, and numerical_check. Quotes are
      copied from the opened file. A file_not_found path has no quote.
  assigned_to: executor
