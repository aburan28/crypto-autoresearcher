experiment:
  id: EXP-INSTR-38214a
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-34754f
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE CAMPAIGN''S ISOGENY-CLASS NULL, DEFINED: replace the free label-permutation null with
    a nested variance-components design whose permutation is stratified on the group order N and on
    the quadratic-twist pairing, because the campaign''s own committed run RUN-ICINV-p4001-a already
    shows the free permutation reporting a 664x within-class variance reduction at W = p for a quantity
    that is a deterministic function of N and the 2-torsion count'
  status: draft
  objective: "(A) THE INSTRUMENT AS BUILT. harness/exp_icinv.py::permutation_null pools the measured\
    \ values of every curve across the selected isogeny classes, shuffles them freely, re-partitions\
    \ them into groups of the SAME SIZES, and reports the fraction of shuffles whose mean within-group\
    \ variance is at or below the observed one. harness/run_icinv.py calls it \"NULL-C: does the grouping\
    \ by isogeny class carry any information?\" and prints \"class grouping reduces within-group variance\"\
    \ whenever p < 0.05.\n(B) WHY THE FREE PERMUTATION IS THE WRONG NULL, STATED AS ARITHMETIC AND\
    \ NOT AS AN OPINION. At fixed p an isogeny class is indexed by its trace t, and N = #E(F_p) =\
    \ p + 1 - t is CONSTANT within the class and DIFFERENT between classes. Any functional that depends\
    \ on N therefore has a between-class component that has nothing to do with isogeny structure.\
    \ A free permutation mixes N values across the shuffled groups, so the null distribution of within-\
    \ group variance is inflated by exactly that component, the observed within-class variance sits\
    \ below it, and the test fires. The test is then detecting \"different classes have different\
    \ group orders\", which is the definition of an isogeny class, not a discovery about it.\n(C)\
    \ THIS IS NOT HYPOTHETICAL; IT IS IN THE COMMITTED RUN. RUN-ICINV-p4001-a (EXP-ICINV-180a0d, commit\
    \ e34afdd0c3137c038042cae7c68495c700977afd) selected traces 30, -30, 18, -18 at p = 4001 and measured\
    \ the full-field liftable-x density. Its own window_decay block at W = 4001 records observed_mean_within_variance\
    \ = 1.557881769803647e-08 against null_mean = 1.0357263552475702e-05, a ratio of 1/664, with permutation_p_value\
    \ = 0.0. But the same run verifies the archived identity #{x : x^3+ax+b is a square} = (#E(F_p)\
    \ - 1 + z)/2 on every row (_liftable_identity_holds: identity_verified), where z is the 2-torsion\
    \ x-count. Within a class #E is constant, so at W = p the functional is (const + z)/2 and its\
    \ within-class variance is exactly Var(z)/4; between classes #E differs by up to 60 at these traces,\
    \ so the between-class spread of the count is up to 30. The 664x is the group order. It is not\
    \ evidence of anything.\n(D) THE FIX IS A DESIGN, NOT A CORRECTION FACTOR. Three layers, each\
    \ of which can be checked separately:\n  LAYER 1 -- MAKE THE FUNCTIONAL N-FREE BY CONSTRUCTION\
    \ WHERE POSSIBLE. The\n    factor base is already size-controlled (factor_base_fixed_size). Extend\
    \ the\n    same discipline to the target population: decomposition_rate_m2 and _m3\n    already\
    \ build the EXACT sum set, so the exact decomposition probability\n    |sums| / #E(F_p) is available\
    \ at zero extra cost and the sampled-target\n    estimator can be dropped. Report both the rate\
    \ (N-dependent) and the raw\n    count |sums| (N-free); the raw count is the primary quantity.\n\
    \  LAYER 2 -- NEST THE VARIANCE. The isogeny class is coarser than the\n    j-invariant, which\
    \ is coarser than the F_p-isomorphism class, which is\n    coarser than the choice of Weierstrass\
    \ model and factor-base offset.\n    Decompose\n      Var_total = V_between_class + V_between_j_within_class\n\
    \                  + V_between_model_within_j + V_within_model,\n    by measuring, for a fixed\
    \ set of curves, (i) every curve of the class,\n    (ii) both twists of each j where they lie\
    \ in the class, (iii) several\n    F_p-isomorphic models (u^4 a, u^6 b) of the same curve, and\
    \ (iv) several\n    factor-base start offsets on the same model. V_between_class is\n    interpretable\
    \ ONLY relative to the three levels beneath it: if\n    V_between_j_within_class is not larger\
    \ than V_between_model_within_j, the\n    class explains nothing beyond the model.\n  LAYER 3\
    \ -- STRATIFY THE PERMUTATION. Permute class labels only within strata\n    matched on the nuisance\
    \ covariates: (i) N, banded so that the band width is\n    below the measured within-class standard\
    \ deviation of the functional; and\n    (ii) the quadratic-twist pairing, because class(t) and\
    \ class(-t) consist of\n    the quadratic twists of one another and share |D| = t^2 - 4p, hence\
    \ share\n    h(O) and hence share class size. RUN-ICINV-p4001-a exhibits this exactly:\n    two_torsion_x\
    \ has variance 1.0053951126626468 in BOTH class 30 and class\n    -30 (n = 138 each) and 0.9896907216494846\
    \ in BOTH class 18 and class -18\n    (n = 98 each). Values that are structurally duplicated across\
    \ paired groups\n    are not exchangeable, and a permutation null assumes exchangeability.\n\n\
    (E) WHICH NULL THIS PROPOSAL RECOMMENDS, AND WHY. RECOMMENDED: the twist-block-stratified label\
    \ permutation on an N-free functional (Layers 1+3), with the nested decomposition (Layer 2) reported\
    \ alongside it. Reasons, in order. (i) It preserves the class-size profile automatically, because\
    \ a permutation of labels preserves the multiset of group sizes; the alternative \"curves from\
    \ different classes with N of the same bit length\" does not, since class size is h(O) and varies\
    \ by a factor of several across traces. (ii) At fixed p a bit-length match is nearly vacuous,\
    \ since every class has N in [p+1-2sqrt(p), p+1+2sqrt(p)] and almost all of them share a bit length\
    \ -- it controls for nothing that is not already controlled, while the actual nuisance, the up-to-4sqrt(p)\
    \ spread in N, survives it untouched. (iii) The permutation gives an EXACT finite-sample null\
    \ with no distributional assumption, which the binomial null (NULL-B) does not. (iv) Blocking\
    \ on the twist pair removes the exchangeability violation that is visibly present in the committed\
    \ run. The bit-length-matched between-class comparison and the free permutation are both still\
    \ RUN AND REPORTED, as diagnostics: the gap between the free and stratified permutation p-values\
    \ IS the measure of N-contamination, and reporting it is how the campaign shows its null is doing\
    \ work.\n(F) WHAT THIS DOES NOT CLAIM. It does not claim the L1 result is wrong. It claims that\
    \ the currently reported liftable-density signal is not yet attributable to isogeny structure,\
    \ and it supplies the design under which the same measurement would become attributable. If the\
    \ stratified permutation still fires, that is a real and interesting result and this proposal\
    \ will have made it citable."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'L14 mounts no attack and consumes no non-generic resource, so the Layer-0
    filter of DECOMPOSITION.md section 2 does not apply to it: there is no oracle to simulate and
    no claim about ECDLP cost. It instruments the R1/R2/R4 functionals of L1 and the R3/R4 stratification
    of L2. Nothing here is closed by KN-FIND-b7e091 or H-ENDO-001 because nothing here asserts a group-operation
    advantage of any kind.'
  reachability_gate: NOT APPLICABLE AS AN ATTACK, and stated rather than omitted. This proposal moves
    between curves only in the sense that it enumerates a class that is already fully enumerated by
    harness/isogeny_class.py at toy p, at O(p^2) cost. It proposes no walk, reaches for no specified
    curve, and therefore never touches T5. If a within-class effect DID survive stratification, T5
    would immediately become binding on any attack reading of it, and this record does not license
    skipping that gate.
  inputs:
    procedure: 'STAGE 0 (zero compute, hard gate): re-derive, on paper, that at W = p the liftable
      count is (N - 1 + z)/2 and confirm against the committed raw-result.json that mean-over-classes
      of Var(z)/4 equals the reported full_field_liftable_within_class_count_variance. The arithmetic
      to check: Var(z) = 1.0053951126626468 for traces +-30 and 0.9896907216494846 for traces +-18,
      so the mean of Var(z)/4 over the four classes is 0.24938572928901642 against a reported 0.24938572928898783.
      If this does not hold, the identity or the reporting is wrong and everything downstream waits.
      STAGE 1 (minutes): re-run the free permutation on the frozen slice and reproduce the committed
      p-values. STAGE 2 (minutes): implement twist-pair blocking and the (1+r)/(1+B) estimator; recompute.
      This single stage is the cheapest valid discriminator between "the class carries information"
      and "the classes have different N", because it changes ONE thing and needs no new measurement
      at all. STAGE 3 (an hour): add the exact sum-set counts and re-run both permutations. STAGE
      4 (hours): the nested design at M = 3 models and R = 4 offsets on the target class only. STAGE
      5 (zero compute): the synthetic null-object class through the identical pipeline; it must not
      fire.'
    mechanism: 'STEP 1 -- FREEZE THE POOL BEFORE MEASURING. Declare p, the trace-selection rule and
      the number of control classes in the contract. Record the realized N spread max(N) - min(N)
      over the pooled classes and the bound 4*sqrt(p): at p = 4001 the bound is 253 (6.3 percent of
      N) and the realized value at traces {30,-30,18,-18} is 60 (1.5 percent). Note the selection
      confound explicitly: run_icinv.pick_classes selects the LARGEST ordinary classes, and class
      size is h(O), which is correlated with the arithmetic of D = t^2 - 4p and hence with the 2-torsion
      structure that drives several functionals. Selection on class size is not selection on the outcome,
      but it is not neutral either, and the record must say so.

      STEP 2 -- MAKE THE PRIMARY FUNCTIONALS N-FREE. Return |sums| from decomposition_rate_m2 and
      _m3 alongside the hit count, and make the raw sum-set size the primary quantity with the rate
      secondary. This removes the binomial sampling variance entirely, which STRICTLY INCREASES the
      instrument''s power and therefore strictly increases the danger from an uncorrected N confound
      -- a prediction this proposal makes explicitly in `predictions`.

      STEP 3 -- BUILD THE NESTED DESIGN. For each curve in the target class, measure the functional
      at R factor-base offsets on each of M F_p-isomorphic models (u^4 a, u^6 b) for M declared values
      of u. Estimate the four variance components by the standard nested (Type-I) sums of squares.
      Report all four, always, in the same table.

      STEP 4 -- STRATIFIED PERMUTATION. Partition the pooled curves into blocks: one block per {t,
      -t} twist pair, sub-blocked by N band if more than two pairs are pooled. Permute class labels
      WITHIN blocks only. Statistic: the size-weighted mean within-group variance (weighting fixes
      the unequal-group-size bias the committed unweighted mean carries). p-value estimator: (1 +
      #{v <= obs}) / (1 + B), which cannot return 0 -- the committed estimator returns 0.0 at five
      of six windows in RUN-ICINV-p4001-a, and 0.0 is not a valid p-value.

      STEP 5 -- REPORT THE CONTAMINATION GAP. Publish free-permutation p, stratified p, and the ratio
      of observed to null variance under both. The campaign''s honest headline is the pair, not either
      number alone.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - synthetic null-object class matched on the class-size multiset
  - free permutation retained and reported as the contamination diagnostic
  - bit-length-matched between-class comparison, reported and explicitly labelled as the weaker N
    control
  - the isomorphism-model level of the nested design, as the noise floor
  - 'NULL OBJECT (from the proposal): MANDATORY AND SELF-REFERENTIAL, since this proposal IS a null
    design; the null for the null is a NULL-OBJECT CLASS. Construct a set of curves at the same p
    that is NOT an isogeny class but has the same size profile and the same N spread: take the enumerated
    class, then relabel each curve with a synthetic "class" drawn to match the true class-size multiset
    while forcing the synthetic grouping to be independent of the trace. The stratified permutation
    must NOT fire on this object at the declared level. DECAY PARAMETER: the number of permutation
    blocks. As blocking becomes finer (from one block, i.e. the free permutation, to one block per
    twist pair to one block per narrow N band), any N-driven signal must DECAY monotonically toward
    the unblocked-nuisance level; a signal that survives the finest blocking is the candidate real
    effect. A reported signal that does NOT decay as blocking is refined is the canonical artifact
    tell of docs/inventor-protocol.md section 3, and here it would mean the nuisance is something
    other than N and has not yet been named.'
  independent_variables: []
  metrics:
    primary:
    - free and stratified permutation p-values per functional, with (1+r)/(1+B)
    - observed and null within-group variance under both permutations
    - realized N spread over the pool and the bound 4*sqrt(p)
    - all four nested variance components per functional
    secondary:
    - per-class size, trace, N, and Var(two_torsion_x) for the twist-pair check
    - exact sum-set sizes |sums| for m = 2 and m = 3
  heuristic_under_test: null
  preregistered_prediction:
    quantity: stratified-permutation p-value for full-field liftable density on the RUN-ICINV-p4001-a
      pool, versus the committed free-permutation p-value 0.0
    formula: 'The stratified p-value rises above 0.05. Pre-registered: if it stays below 0.05 after
      blocking on the twist pair AND on N, the signal is NOT the group order and the campaign has
      a real target -- which would be the more interesting outcome and is why this is worth running.'
    source: pre-registered in IDEA-20260807-34754f before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SELECTION ON CLASS SIZE. pick_classes takes the largest ordinary classes; class size is h(O),
    correlated with the arithmetic of D = t^2 - 4p and hence with 2-torsion structure. Not selection
    on the outcome, but not neutral. The remedy is to pre-register the trace list and to report results
    for a size-randomly-selected pool as a secondary arm.
  - TWIST DUPLICATION. Several functionals are exactly twist-invariant (the 2-torsion x-count is,
    since x^3 + a d^2 x + b d^3 = d^3 f(x/d)), so their values are duplicated across paired classes.
    Blocking handles it; ignoring it inflates significance.
  - UNEQUAL GROUP SIZES. The committed statistic is an unweighted mean of per-group variances over
    groups of sizes 138, 138, 98, 98, which weights the small classes up. Size weighting is required.
  - p-VALUE FLOOR. With B = 1000 or 2000 permutations the estimator cannot resolve below 1/(B+1);
    five of six committed windows report exactly 0.0. Any multiplicity correction across lanes needs
    a finer B, which is IDEA-20260807-caf061's problem.
  - SHARED SEED. All curves use the same target seed by design (harness/exp_icinv.py::_targets), which
    is correct for removing a per-curve degree of freedom but makes the per-curve measurements positively
    correlated through the shared x-sequence. Layer 1 removes this entirely by dropping sampling.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'The stratified p-value rises above 0.05. Pre-registered: if it stays below 0.05
    after blocking on the twist pair AND on N, the signal is NOT the group order and the campaign
    has a real target -- which would be the more interesting outcome and is why this is worth running.'
  falsification_criterion:
  - 'Stage 0''s arithmetic fails: the reported full-field within-class variance is not the mean of
    Var(z)/4. Then either the identity is false or the reporting is mis-wired, and this proposal''s
    diagnosis of the 664x is withdrawn.'
  - Stage 1 does not reproduce the committed permutation p-values on the frozen slice. Instrument
    instability; nothing is concluded.
  - The synthetic null-object class fires under the stratified permutation. The blocking is wrong
    and no result may be reported from it.
  - class(t) and class(-t) do not have equal size at other p. The twist-pair blocking loses its justification
    and must be replaced by explicit |D| matching.
  - The stratified permutation still fires on the true classes at the declared level after full blocking.
    This proposal's central claim -- that the current signal is the group order -- is then FALSE,
    and the campaign has a genuine within-class effect to chase. This is a real falsifier with a real
    probability and it is the reason to run the test.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-34754f
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
