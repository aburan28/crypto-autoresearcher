# EXP-ECDLP-bf03e7
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-7faa74.
experiment:
  id: EXP-ECDLP-bf03e7
  hypothesis_id: H-ECDLP-cf4906
  source_idea: IDEA-20261003-49b0b3
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-9 table versus width-8 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-7faa74
  objective: >-
    Check the table sizes 256 and 128, the product 32768, and the nearby gap 0.
  inputs:
    width_hi: 9
    width_lo: 8
    table_hi: 256
    table_lo: 128
    table_gap: 128
    table_product: 32768
    table_sum: 384
    nearby_a: 128
    nearby_b: 128
    nearby_gap: 0
    nearby_product: 16384
  controls:
    - >-
      Two to the power 8 is 256. Two to the power 7 is 128. Reporting
      both tables as size 128 drops the gap and invalidates the run.
    - >-
      Two hundred fifty-six exceeds one hundred twenty-eight by 128.
      The product of the two sizes is 32768. Their sum is 384.
    - >-
      Two width-8 tables each store 128. Their gap is 0 and their
      product is 16384.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-9 table stores 256 entries. The width-8 table stores
      128. The gap of two width-8 tables is 0.
    formula: >-
      Compute 2 to the power 8. Compute 2 to the power 7. Subtract
      128 from 256. Multiply 256 by 128. Subtract 128 from 128.
    source: >-
      IDEA-20261003-49b0b3 states the widths 9 and 8 and the sizes
      256 and 128, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 32768 and the nearby gap 0 are required. A check that stops at the size 256 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 256 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 8 is not 256.
    - Two to the power 7 is not 128.
    - The gap is not 128.
    - The product is not 32768.
    - Both tables are reported as size 128, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-9 table stores 256 entries, that
    the width-8 table stores 128, and that 256 exceeds 128 by 128.
  falsification_criterion: >-
    The runs agree that the width-9 table size is computed, and
    that size is not 256.
  required_artifacts:
    - experiments/EXP-ECDLP-bf03e7/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-bf03e7/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-bf03e7/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-bf03e7/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-bf03e7/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-bf03e7/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 128 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
