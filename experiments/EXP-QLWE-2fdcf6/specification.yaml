# EXPERIMENT CONTRACT -- EXP-QLWE-2fdcf6 (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-2fdcf6
  hypothesis_id: H-QLWE-6a7680
  derived_from_idea: IDEA-20261018-b16a07
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Enumeration tree size across plain, ring and module embeddings
  objective: Whether the quantum-enumeration frontier row is structure-blind by measurement
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: fpylll 0.6.x, SageMath for ring construction, NumPy bootstrap
    parameters: >-
      total dim n in {40,50,60,70}; q=3329; CBD eta=2; module ranks k in {1(ring),2,4} with
      d = n/k; plain LWE; 20 instances each; BKZ-20; enumeration block 40-60
    procedure: >-
      1. Generate instances. 2. Embed (Kannan). 3. BKZ-20. 4. Enumerate last block with fixed
      pruning. 5. Record T. 6. Bootstrap deltas.
  controls:
  - 'null/negative: plain LWE of the same dimension, modulus and error'
  - >-
    positive: plain LWE with a planted dense rank-4 sublattice (NTRU-like overstretched shape)
    where T must shrink
  - 'A/A: plain LWE under two basis-randomisation seeds'
  independent_variables:
  - structure
  - total_dim
  metrics:
    primary:
    - delta log2 T vs plain
    secondary:
    - GSO profile slope
    - solution count
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: delta log2 T ring vs plain
    formula: '|delta| < 1'
    source: standard profile-only enumeration model
  scale_relevance:
    tier: toy
    justification: >-
      block dim <= 60; transfer: structure-blindness at small block extends if profile model
      holds
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 30
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - stop when a cell's T exceeds 2^40 nodes
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - A/A delta > 0.5 bits invalidates that dim
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 |delta| < 1 bit at all dims and C2 delta >= 3 bits (P1, P2), AA1 noise
    floor
  falsification_criterion: C1 delta >= 2 bits with CI excluding 0 at some dim (P1 falsified)
  decision_impact:
    on_positive: Frontier row for quantum enumeration classified structure-blind with measured
      support
    on_negative: >-
      Row classified structure-dependent; the measured delta becomes a Lane 2 candidate requiring
      a proof_search_map
  variable_ledger:
    independent:
    - name: structure
      levels:
      - plain_lwe
      - ring_lwe
      - module_k2
      - module_k4
      - planted_dense_positive
    - name: total_dim
      levels:
      - '40'
      - '50'
      - '60'
      - '70'
    factors:
    - name: basis_randomisation_seed
      treatment: randomized
      value: 2 seeds
      how: fpylll random unimodular pre-transform
    - name: cpu_model
      treatment: fixed
      value: single host
      how: node counts are machine-independent
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - ring_lwe
      - plain_lwe
      differs_in:
      - structure
      design: one_factor
    - id: C2
      arms:
      - planted_dense_positive
      - plain_lwe
      differs_in:
      - structure
      design: one_factor
    - id: AA1
      arms:
      - plain_lwe seed A
      - plain_lwe seed B
      differs_in:
      - basis_randomisation_seed
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-b16a07.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-b16a07.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - tree_sizes.csv
  - report.pdf with delta-vs-dim plot
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-QLWE-2fdcf6/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
