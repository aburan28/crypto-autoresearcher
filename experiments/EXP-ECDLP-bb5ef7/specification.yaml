  status_note: >
    Frozen at version 1 and approved 2026-09-13 by
    DEC-20260913-d395c8 under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    Woodbury-Schur calibrator.

  objective: >
    Evaluate the exact identity that on
    M0=I_2, U=[1,0]^T, V=[0,1]^T,
    b=[1,1] one has r=1, Schur=1,
    x=[0,1], and rejects the nearby
    claim that the coupling rank is
    zero, on one frozen family
    (REAL, KF, NULL). Stage 0 does
    not fold a real endomorphism
    orbit and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      r=1, Schur=1, x=[0,1]; KF
      zero-rank claim rejected
      because r=1; NULL empty
      matrix rejected; singular M0
      rejected. Certificate kind
      none.
    formula: >
      Woodbury: M=M0+UV^T. REAL:
      r=1, Schur=1, x=[0,1]. KF:
      claim r=0, actual r=1,
      rejected as a generic
      folded-solve target.
    claim_tier: observational

  inputs:
    fixture:
      real_fold:
        M0: [[1, 0], [0, 1]]
        U: [[1], [0]]
        V: [[0], [1]]
        b: [1, 1]
        must_r: 1
        must_schur: 1
        must_x: [0, 1]
      known_false:
        kind: zero_rank_coupling
        claimed_r: 0
        must_r: 1
        must_reject: true
      matched_null:
        kind: empty_matrix
        must_reject: true
      invalid:
        - {singular_M0: true, must_reject: true}

  controls:
    - name: known_false_zero_rank
      object: KF claim r equals 0
    - name: matched_null
      object: empty matrix
    - name: invalid_singular
      object: singular M0

  independent_variables:
    - M0
    - U
    - V
    - b
  metrics:
    primary:
      - fixture_pass
      - real_woodbury_pass
      - known_false_zero_rank_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - real_woodbury_pass
    - known_false_zero_rank_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact integer tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >
    All five Stage 0 gates true and
    certificate kind none on the
    frozen REAL / KF / NULL toys.
  falsification_criterion: >
    After fixture_pass, any REAL
    Woodbury miss or KF-zero-rank
    accept at the frozen toys.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_endfold.py
  dependencies:
    - H-ECDLP-804ee9
    - DEC-20260913-d395c8
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-ENDFOLD only. Not
    nested LHW. Not Esser-May. Not
    Semaev. Not a P1553 recurrence.
    Not a factor-base. Not Velu. Not
    a rho beat. No Stage 1 of
    EXP-ECDLP-bb5ef7. No Stage 1 of
    EXP-ECDLP-70c6f0.
