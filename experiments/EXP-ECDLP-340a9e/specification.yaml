# =============================================================================
# EXP-ECDLP-340a9e — version 1, not approved. Specified from
# IDEA-20261006-5db10b / H-ECDLP-e6772e. Status is review_required.
# check_approval_capacity rejects an approving decision:
# GOAL-ECDLP-001 already holds 7 approved contracts with no run
# (cap 3): EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc, EXP-ECDLP-b2e5d1,
# EXP-ECDLP-c74a83, EXP-LHW-22aefa, EXP-SEMAEV-a097b5, EXP-SMTH-9d04ba.
# The contract is also not runnable. The missing driver is a program
# that enumerates y^2 = x^3 + x + 3 over F_47, evaluates
# s(P) = x(P) + x(2P) and s(P) = λ(P)^2 - x(P), sums the quadratic
# character χ(s(P)), compares the absolute value with N/4, draws 200
# uniform signings, and runs the even-order instrument on
# y^2 = x^3 + x over F_47. A search of origin/main for the phrases
# "x(P) + x(2P)" and "doubling-sum" under *.py returned no path.
# experiments/EXP-ECDLP-1ed445/run_character_sum_ladder.py measures a
# discrete-log Fourier coefficient of a factor base at 20 to 26 bits.
# It does not evaluate this sum. A trial plan requires status
# approved. Success is the source idea's prediction: the absolute
# sum is at least N/4. The concrete negative is an absolute sum
# strictly below N/4. This session did not evaluate the sum.
# Source idea bytes are blob
# a4e66c7ea93da948ee9f0eb8956af2d90621391d.
# =============================================================================
experiment:
  id: EXP-ECDLP-340a9e
  hypothesis_id: H-ECDLP-e6772e
  question_id: RQ-ECDLP-4fcbd3
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-5db10b
  version: 1
  title: >-
    Doubling-sum character sum on one pinned Weierstrass chart
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-027d70
    withheld_reason: >-
      check_approval_capacity rejects an approval of this contract.
      python3 tools/portfolio_kpis.py --capacity GOAL-ECDLP-001
      reports approved_unrun=7 against cap 3, headroom 0. The seven
      contracts are EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc,
      EXP-ECDLP-b2e5d1, EXP-ECDLP-c74a83, EXP-LHW-22aefa,
      EXP-SEMAEV-a097b5, and EXP-SMTH-9d04ba. This decision does not
      retire one of them. The launcher is also missing. There is no
      committed program that enumerates the affine points of
      y^2 = x^3 + x + 3 over F_47, computes
      s(P) = x(P) + x(2P) and s(P) = λ(P)^2 - x(P) with
      λ(P) = (3x(P)^2 + 1)/(2y(P)), excludes points with y = 0 or
      s = 0, reports N and the signed sum of χ(s(P)), compares the
      absolute value with N/4, draws 200 independent uniform
      signings of those N points, records the sum of χ(x(P)) on the
      same curve, and checks the even-order instrument on
      y^2 = x^3 + x over F_47. A search of origin/main for the
      phrases "x(P) + x(2P)" and "doubling-sum" under *.py returned
      no path. The ladder
      experiments/EXP-ECDLP-1ed445/run_character_sum_ladder.py
      measures a discrete-log Fourier coefficient of a factor base.
      A trial plan requires status approved, which this capacity
      check refuses. This session did not evaluate the sum.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval both frees a capacity slot and adds the
      missing doubling-sum driver, work only on
      y^2 = x^3 + x + 3 over F_47 for the claim, plus the pinned
      instrument curve y^2 = x^3 + x over F_47. Do not transfer the
      sum to another prime or to cryptographic size.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the absolute sum of χ(s(P)) on this pinned curve
    is at least N/4. The concrete negative is that the absolute sum
    is strictly below N/4. No faster discrete-logarithm algorithm is
    in scope.

  inputs:
    curve: >-
      E: y^2 = x^3 + x + 3 over F_47. Discriminant
      -16(4·1^3 + 27·3^2) = -16·247 ≠ 0.
    domain: >-
      Affine points with y ≠ 0 and s(P) ≠ 0. The point at infinity,
      the points with y = 0, and the points with s = 0 are outside
      the sum. Points with s = 0 are counted and reported separately.
    summand: >-
      s(P) = x(P) + x(2P). The second formula is
      s(P) = λ(P)^2 - x(P), with
      λ(P) = (3x(P)^2 + 1)/(2y(P)). χ is the Legendre symbol on
      F_47. χ(0) is not used.
    summation_set: >-
      All domain points, including both P and -P. That choice is
      fixed before the sum is read.
    random_signings: >-
      200 independent assignments of uniform signs ±1 to the N
      domain points, from a fixed seed label. A signing meets the
      threshold when its absolute sum is at least N/4.
    nearby_coordinate: >-
      On the same curve, the sum of χ(x(P)) over affine points with
      y ≠ 0 and x ≠ 0. This arm does not by itself decide the
      pinned-sum row. If its absolute value is at least one quarter
      of its own domain size, a large s-sum is not attributed to
      doubling.
    instrument_curve: >-
      E0: y^2 = x^3 + x over F_47. The cubic x(x^2 + 1) has the
      single root x = 0 in F_47 because 47 ≡ 3 (mod 4), so -1 is
      not a square and E0 has exactly one affine point of order 2,
      namely (0, 0). The predicate is g(O) = 0, g(0, 0) = 0, and
      g(x, y) = χ(x) for x ≠ 0. The instrument passes when the
      absolute value of the sum of g over E0(F_47) is at least half
      of the number of rational points. A missed spike makes the
      p = 47 doubling sum not admissible.

  controls:
    - id: two-formulas
      statement: >-
        s = x + x(2P) and s = λ^2 - x agree on every domain point.
        A single disagreement voids the run.
    - id: random-signings
      statement: >-
        Two hundred uniform signings of the same N points. If 20 or
        more of them have absolute sum at least N/4, the threshold
        is inside null noise and the curve sum is not evidence of
        structure.
    - id: excluded-zeros
      statement: >-
        Points with s = 0 are counted and excluded. Mapping one of
        them to χ = 1 voids the run.
    - id: nearby-x
      statement: >-
        The sum of χ(x(P)) is recorded. If it already meets one
        quarter of its domain, a pass of the s-inequality is not
        attributed to doubling and is not the success row.
    - id: even-order-instrument
      statement: >-
        The predicate g on y^2 = x^3 + x over F_47 produces an
        absolute sum at least half the number of rational points.
        A missed spike voids the doubling sum.
    - id: both-signs
      statement: >-
        The sum includes both P and -P. Replacing the domain by a
        set of negation representatives after the sum is read voids
        the run.

  independent_variables:
    - whether the arm is the doubling sum, the random signing, the χ(x) sum, or the even-order instrument
    - which of the two formulas for s

  metrics:
    primary:
      - id: absolute_sum_over_N
        statement: >-
          The absolute value of the sum of χ(s(P)), divided by N.
          The idea's prediction is that this ratio is at least 1/4.
          The concrete negative is that the absolute sum is strictly
          below N/4.
    secondary:
      - id: N
        statement: the number of domain points
      - id: signed_sum
        statement: the signed sum of χ(s(P))
      - id: zero_s_count
        statement: >-
          the number of affine points with y ≠ 0 and s(P) = 0,
          reported separately and not added into the sum
      - id: random_hits
        statement: >-
          the number of the 200 random signings whose absolute sum
          is at least N/4
      - id: branch_count
        statement: >-
          the number of distinct successor signs χ(s(2P)) observed
          among domain points with a fixed χ(s(P)), maximized over
          the two signs
      - id: nearby_x_ratio
        statement: >-
          the absolute sum of χ(x(P)) divided by the number of
          affine points with y ≠ 0 and x ≠ 0
      - id: instrument_ratio
        statement: >-
          the absolute sum of g on the instrument curve, divided by
          the number of rational points

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says this particular sum is atypically large relative to
    a random signing, with absolute value at least N/4. A
    disagreement of the two formulas for s fails the instrument and
    does not by itself replace the inequality.

  preregistered_prediction:
    quantity: >-
      The absolute character sum of χ(s(P)) divided by N, on the
      pinned curve.
    formula: >-
      absolute_sum / N >= 1/4. The concrete negative is
      absolute_sum < N/4 after the two formulas agree and the
      even-order instrument passes. Source idea IDEA-20261006-5db10b,
      predictions minimum_effect: the ratio is at least 1/4. No sum
      was evaluated before this formula was written.
    source: >-
      IDEA-20261006-5db10b. RQ-ECDLP-4fcbd3 names the Weil-level
      bound and marks it recalled and unverified. KR-RHO-13bf67,
      KR-RHO-fb88e6, and KR-RHO-fbd582 were opened in this session.
      They do not state this character sum.

  scale_relevance:
    tier: toy
    justification: >-
      The field is F_47. No transfer to another prime or to
      cryptographic size is assumed. The minimum effect is the
      idea's own: a ratio of at least 1/4 against an absolute sum
      strictly below N/4.
    correspondence: >-
      Direct enumeration of the affine points. No Deuring
      correspondence is used.

  tail_checks:
    - >-
      A ratio of at least 1/4 meets the prediction. An absolute sum
      strictly below N/4, with the instrument checks passed, is the
      negative.
    - >-
      The extreme comparison at this scale is a random signing whose
      absolute sum meets N/4. Twenty or more such signings in the
      200 draws put the threshold inside null noise.

  replication:
    seeds:
      - EXP-ECDLP-340a9e|formula-sum|deterministic
      - EXP-ECDLP-340a9e|formula-slope|deterministic
      - EXP-ECDLP-340a9e|random-signings|200
      - EXP-ECDLP-340a9e|nearby-x|deterministic
      - EXP-ECDLP-340a9e|instrument|y2=x3+x
    independent_instances: 1
    note: >-
      One later manifest would cover both formulas, the 200
      signings, the χ(x) arm, and the even-order instrument. No run
      id is minted in this session. The replication plan does not
      name a future run slot, because the trial plan is not frozen
      while status is review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen sum. Wall-clock and
      CPU figures are not set. The 1 GB figure is machine protection
      for a field of 47 elements. A watchdog expiry is
      failed_infrastructure, not a character sum.

  stopping_rules:
    - Stop after one reading row is named from the pinned sum.
    - Do not change the thresholds 1/4 and 20 after seeing a sum.
    - Do not enumerate a second claim curve in this contract.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A disagreement of the two formulas, a point with s = 0 entered in the sum, a missed even-order spike, or a change of the summation set after the sum is read voids the run.
    - At least 20 of the 200 random signings meeting N/4 voids the threshold. It is not the concrete negative.
    - A nearby χ(x) sum that already meets one quarter of its domain blocks attribution to doubling. It is not the concrete negative.
    - Transferring the sum to another curve or to cryptographic size voids the run.

  success_criterion: >-
    The two formulas for s agree, the even-order instrument passes,
    fewer than 20 of the 200 random signings meet N/4, the nearby
    sum of χ(x) is strictly below one quarter of its domain, and the
    absolute sum of χ(s(P)) is at least N/4. That inequality is the
    prediction of IDEA-20261006-5db10b. The conjunction is reachable
    as a failure when the instrument checks pass and the absolute
    sum is strictly below N/4.

  falsification_criterion: >-
    The two formulas for s agree, the even-order instrument passes,
    and the absolute sum of χ(s(P)) is strictly below N/4. That is
    the concrete negative. A null with at least 20 signings at N/4,
    a missed instrument spike, or a formula disagreement is not this
    sentence.

  decision_impact:
    on_positive: >-
      A later evidence review may record that the pinned doubling
      sum has absolute value at least N/4, with the instrument
      checks passed and the null below 20 hits in 200 draws. The
      rho exponent stays 1/2. No knowledge entry is promoted from
      this design record.
    on_negative: >-
      A later evidence review may record that the absolute sum is
      strictly below N/4, with the two formulas in agreement and the
      even-order instrument passed, so the constant-fraction claim
      is false on (A, B, p) = (1, 3, 47) only. The rho exponent
      stays 1/2. The two outcomes name different comparisons with
      N/4.

  required_artifacts:
    - experiments/EXP-ECDLP-340a9e/runs/RUN-*/manifest.yaml
    - experiments/EXP-ECDLP-340a9e/runs/RUN-*/raw-result.json
    - experiments/EXP-ECDLP-340a9e/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the two formulas disagree, a point with s = 0 is entered in
        the sum, the even-order spike is missed, or the summation
        set is changed after the sum is read
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: null_overlap
      when: >-
        the formula check and the even-order instrument pass, and at
        least 20 of the 200 random signings have absolute sum at
        least N/4
    - id: nearby_coordinate
      when: >-
        the formula check, the even-order instrument, and the null
        gate pass, the absolute doubling sum is at least N/4, and
        the nearby sum of χ(x) is also at least one quarter of its
        domain
    - id: sum_below_quarter
      when: >-
        the formula check and the even-order instrument pass, and
        the absolute doubling sum is strictly below N/4
    - id: sum_at_least_quarter
      when: >-
        the formula check and the even-order instrument pass, fewer
        than 20 random signings meet N/4, the nearby χ(x) sum is
        strictly below one quarter of its domain, and the absolute
        doubling sum is at least N/4
  reading_rule: >-
    Name exactly one row. sum_at_least_quarter is the only success
    row. sum_below_quarter is the concrete negative.
    null_overlap, nearby_coordinate, instrument_failure, and
    infrastructure are not the inequality. Record N, the signed sum,
    the zero-s count, the random-hit count, the branch count, the
    nearby ratio, and the instrument ratio beside the row.
    attack_claimed is false.
