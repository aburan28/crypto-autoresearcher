experiment:
  id: EXP-SHAONE-ceaedd
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-3edd14; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-3edd14
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate the disturbance-vector class under a declared indexing, cross-check the count under
    a second independent implementation, and compute the re-implemented criterion's coverage against
    200 size-matched random criteria.
  objective: 'The one uncertainty a run reduces is whether the deployed detector''s criterion is defined
    over a class or over a list, expressed as a number rather than as an opinion. Stated as parts:
    (i) it establishes whether the disturbance-vector class is exhaustively enumerable under a declared
    indexing at this budget, and reports the raw and feasibility-filtered cardinalities separately
    so that the filter''s contribution to any later fraction is visible from the start; (ii) it runs
    the lossy-projection test on its own tracked object by measuring the index-to-mask collision rate,
    and commits in advance to reporting the projection as a mere change of coordinates if that rate
    is zero, which is the honest outcome the inventor protocol requires and which would materially
    change how any coverage number may be described; (iii) it computes the covered fraction of the
    filtered class by the mechanically extracted criterion, names every uncovered index with its coordinates,
    counts criterion tests matching no class element, and compares against a null distribution of
    200 size-matched random criteria so that coverage attributable to cardinality alone is separated
    from coverage attributable to design. No message is hashed, no collision is attempted, and no
    evading object is built.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: under THIS indexing,
      THIS expansion recurrence and THIS feasibility filter, the class has this cardinality, and THIS
      mechanical extraction of THIS re-implementation of the criterion covers this fraction of it,
      leaving these named indices uncovered, against this null distribution. WHAT DOES NOT FOLLOW:
      nothing about whether any uncovered index is realisable as an actual near-collision block, nothing
      about whether a deployed detector binary behaves as the re-implementation does, nothing about
      the security of anything, and no attack of any kind. Coverage of a test list is not protection,
      and an uncovered index is not an evasion.'
  inputs:
    procedure: 'STAGE 0 (cost: 4 human-hours): declare and freeze the indexing convention, the expansion
      recurrence, the feasibility filter, the class window, and the null-draw count. STAGE 1 (cost:
      1 CPU-hour): implement the recurrence and validate it against local-collision test vectors;
      abort on disagreement. STAGE 2 (cost: minutes to 1 CPU-hour, memory-bound): enumerate the class
      forward and backward from every admissible start, record raw cardinality, apply the filter,
      record filtered cardinality, and compute the index-to-mask collision rate. STAGE 3 (cost: 3
      human-hours): independently re-implement the indexing and enumeration from the STAGE 0 declaration
      alone, and compare counts; disagreement halts. STAGE 4 (cost: gated on primary-text acquisition,
      4-8 human-hours): extract the criterion''s test set mechanically into a machine-readable index
      list. STAGE 5 (cost: minutes): compute covered fraction, uncovered index list, and reverse-direction
      unmatched-test count. STAGE 6 (cost: minutes): draw 200 size-matched random criteria and compute
      the null coverage distribution with the identical code. STAGE 7 (cost: 2 human-hours): characterise
      the uncovered set against the index coordinates and report every disagreement with the predictions.'
    instrument: Python 3.11 with numpy bitset arrays for masks and sets; the recurrence implemented
      directly in Python for the reference version and in a ctypes-wrapped C kernel for the second
      independent implementation, so the cross-check is genuinely independent in language as well
      as in author; hashlib only for local-collision test vectors; harness/runner.py for the run manifest
      and deterministic null-draw seeding; tools/allocate_id.py for identifiers. No Sage and no computer-algebra
      system; the whole computation is finite set arithmetic.
    parameters: 'Class window: the full declared step range of the compression function''s message
      expansion. Starting positions: every admissible step index in the window. Sign patterns: as
      declared by the local-collision generator. Feasibility filter: declared weight and position
      bounds, frozen at STAGE 0, with the unfiltered enumeration also retained. Null draws: 200, each
      of cardinality exactly equal to the extracted criterion''s test-set size. Memory ceiling: 8
      GiB. Independent implementations: 2. Local-collision test vectors: the full declared set.'
  controls:
  - Size-matched random criterion sets, 200 draws, same invocation, same set-difference code.
  - Second independent implementation of the indexing and enumeration, compared count-for-count.
  - Local-collision test vectors validating the expansion recurrence before enumeration.
  - Unfiltered enumeration reported alongside the filtered one, so the filter's effect is visible.
  - 'Reverse-direction count: criterion tests matching no class element, which detects an over-broad
    or mis-extracted criterion.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A random criterion of matched size: draw a set of indices uniformly
    from the enumerated class with cardinality exactly equal to the re-implemented criterion''s test-set
    cardinality, and compute its coverage of the class by the IDENTICAL set-difference code in the
    same invocation, over at least 200 draws to give a null distribution. The null must show materially
    lower coverage than the real criterion. If a randomly drawn set of the same size covers the class
    as well as the criterion does, then the criterion''s coverage is explained by its size alone and
    the audit has measured cardinality, not design.'
  independent_variables:
  - indexing implementation (reference Python / independent C)
  - filtered versus unfiltered class
  - criterion arm (extracted real criterion / 200 size-matched random criteria)
  metrics:
    primary:
    - raw and filtered class cardinality
    - index-to-mask collision rate
    - covered fraction of the filtered class by the extracted criterion
    - null distribution of covered fraction over 200 random size-matched criteria
    secondary:
    - count of criterion tests matching no class element
    - uncovered indices grouped by index coordinate
    - peak resident memory and wall clock of the enumeration
    - agreement fraction between the two independent enumerations
  heuristic_under_test: null
  preregistered_prediction:
    quantity: C_real, the covered fraction of the feasibility-filtered class by the extracted criterion,
      and its position relative to the null distribution of C_rand over 200 size-matched random criteria.
    formula: Predicted C_real >= 0.9 and median C_rand <= 0.3, so that C_real exceeds the 99th percentile
      of the null distribution. Covered fraction is defined as the number of filtered class indices
      for which at least one extracted criterion test fires, divided by the filtered class cardinality;
      both the numerator's firing rule and the filter are frozen at STAGE 0.
    source: Pre-registered in the parent proposal IDEA-20260816-3edd14 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are the full declared expansion window of the target compression
      function with an 8 GiB enumeration ceiling -- toy in compute terms because no cryptographic
      search occurs and the entire computation is finite set arithmetic, even though the window is
      the real one rather than a reduced one. Transfer assumption stated explicitly: the coverage
      fraction is scoped to the declared indexing and filter and transfers to NO other formulation;
      in particular it does not transfer to a different class definition, and the class definition
      itself is a declaration this contract does not prove complete.'
    correspondence: null
  tail_checks:
  - Report the uncovered indices individually, never only as a count; a structured band of five uncovered
    indices is a different object from five scattered ones.
  - Check whether the null coverage distribution is skewed rather than symmetric before comparing
    percentiles.
  - Check whether the filter removes a contiguous region of index space rather than a scattered subset,
    which would indicate the filter is doing structural work it was not declared to do.
  - Check the index-to-mask collision rate separately in the filtered and unfiltered class; a rate
    that appears only after filtering is a filter artefact.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt at STAGE 3 on any disagreement between the two independent enumerations and report the disagreement
    as the outcome.
  - Stop before STAGE 4 and report the enumeration alone if the primary-text criterion is unavailable;
    that is a complete partial deliverable and not a failure of the enumeration.
  - Stop at the 8 GiB memory ceiling and report non-enumerability rather than sampling the class.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if both independent implementations agree on raw and filtered
    class cardinality and the index-to-mask collision rate is reported -- with the coverage fraction
    and its null distribution delivered whenever STAGE 4 is reachable.
  falsification_criterion:
  - The two independent enumerations disagree on cardinality, voiding every downstream fraction.
  - C_real falls inside the null distribution's central range, showing coverage is explained by test-set
    size rather than design.
  - The class is not enumerable within the memory ceiling, so no fraction exists at this budget.
  - The index-to-mask collision rate is zero, in which case the tracked object is a change of coordinates
    and the record must say so rather than present it as a new object.
  - Mechanical extraction of the criterion proves impossible, making the coverage number unreproducible.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-3edd14
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The class definition is declared, not proved complete; a Coordinator must decide whether an admittedly
    declarative denominator is acceptable and say so in the approval.
  - The criterion extraction depends on the same primary-text acquisition that gates the empirical
    detector contract; the dependency must be sequenced, not assumed.
  - The firing rule -- what it means for a criterion test to cover a class index -- needs a precise
    definition fixed before enumeration, since a loose rule can move the fraction arbitrarily.
  - Whether the feasibility filter's bounds are defensible independently of the coverage answer is
    unresolved and must be settled at approval.
