# EXP-SSI-e502f5
# Toy distribution bridge for H-SSI-b52528.
# Frozen before any run. The sets below are a prediction, not a result.
experiment:
  id: EXP-SSI-e502f5
  hypothesis_id: H-SSI-b52528
  source_idea: IDEA-20261004-a09dd4
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  version: 1
  title: >-
    Total variation of three compilers on supersingular j at p=7, 11, 19
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-07057a
  objective: >-
    Enumerate the supersingular j-invariants in F_{p^2} at each
    prime, push uniform measure through T_id, T_collapse, and
    T_forget, and record total variation and pullback failures.
  inputs:
    field_model: F_p[i]/(i^2 + 1)
    primes: [7, 11, 19]
    curve_models:
      j_0: y^2 = x^3 + 1
      j_1728: y^2 = x^3 + x
      other: y^2 = x^3 + 3*k*x + 2*k, with k = j/(1728 - j)
    supersingular_point_counts:
      - (p - 1)^2
      - (p + 1)^2
      - p^2 + 1
      - p^2 + 1 - p
      - p^2 + 1 + p
    predicted_support:
      7: [6]
      11: [0, 1]
      19: [7, 18]
    predicted_j1728:
      7: 6
      11: 1
      19: 18
    predicted_fp_point_count_of_j1728:
      7: 8
      11: 12
      19: 20
    predicted_fp2_point_count:
      7: 64
      11: 144
      19: 400
    compilers:
      T_id: identity on S_p, transcript keeps (j, bare)
      T_collapse: constant output 1728 mod p, transcript keeps only that j
      T_forget: identity on j, transcript omits the tag
    predicted_tv_against_uniform:
      T_id: {7: [0, 1], 11: [0, 1], 19: [0, 1]}
      T_collapse: {7: [0, 1], 11: [1, 2], 19: [1, 2]}
      T_forget: {7: [0, 1], 11: [0, 1], 19: [0, 1]}
    predicted_pullback_failures:
      T_id: {7: 0, 11: 0, 19: 0}
      T_collapse: {7: 0, 11: 1, 19: 1}
      T_forget: {7: 1, 11: 2, 19: 2}
  controls:
    - >-
      Positive control T_id. Total variation 0 and pullback
      failures 0 at every prime.
    - >-
      Collapse control. T_collapse is the oriented singleton.
      Its total variation equals 1 - 1/|S_p|.
    - >-
      Negative control T_forget. The j-distribution matches
      uniform S_p and every tag pullback fails.
    - >-
      Two square tests. One uses Euler's criterion in F_{p^2}.
      The other builds the set of squares by squaring every field
      element. They must not import each other's residue decisions.
    - >-
      Precondition. Both tests report #E(F_p) = p+1 for
      y^2 = x^3 + x. A different count invalidates the cell.
  independent_variables:
    - prime in {7, 11, 19}
    - square_test in {euler, exhaustive}
  metrics:
    primary:
      - support_S
      - tv_collapse
      - pullback_failures
      - routes_agree
      - fp_point_count_ok
    secondary:
      - tv_id
      - tv_forget
      - fp_rational_count
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The supports, total variations, and pullback counts written
      under inputs. At p=11 and p=19, T_collapse has total
      variation 1/2. T_id is the only frozen compiler with
      total variation 0 and zero pullback failures, and it does
      not leave S_p.
    formula: >-
      Total variation of a point mass on one element of an n-element
      set, against the uniform distribution, is 1 - 1/n.
      Pullback fails when the stored transcript does not determine
      the input state.
    source: >-
      H-SSI-b52528. The sets were enumerated in the design session
      by the same point-count test this contract freezes. That
      enumeration is not a run. The papers named in
      IDEA-20261004-a09dd4 were not reopened.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes and at most two supersingular j-invariants.
      No transfer to a cryptographic prime or a published PKE.
    correspondence: null
  tail_checks:
    - >-
      The p=7 cell must be reported even though T_collapse and
      T_id coincide there. Dropping p=7 invalidates the batch.
    - >-
      Every predicted j must appear with its F_{p^2} point count
      (p+1)^2. A support list without point counts is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. The two instances are the Euler square test
      and the exhaustive square table. One manifest per
      (prime, square_test), six manifests in total.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime or a compiler.
    - Do not continue a cell after the square tests disagree.
  invalidation_rules:
    - The two square tests disagree on S_p, a point count, a distance, or a failure count.
    - #E(F_p) for y^2 = x^3 + x is not p+1.
    - A j outside F_{p^2} is added, or a j in F_{p^2} is skipped.
    - A support set is hardcoded instead of counted.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the square tests agree, the
    precondition holds, and every support, total variation, and
    pullback-failure count equals the pre-registered table.
  falsification_criterion: >-
    The square tests agree and the precondition holds, and any
    support, total variation, or pullback-failure count differs
    from the pre-registered table. A square-test disagreement
    does not meet this criterion.
  required_artifacts:
    - experiments/EXP-SSI-e502f5/runs/<run-id>/command.txt
    - experiments/EXP-SSI-e502f5/runs/<run-id>/stdout.txt
    - experiments/EXP-SSI-e502f5/runs/<run-id>/stderr.txt
    - experiments/EXP-SSI-e502f5/runs/<run-id>/result.json
    - experiments/EXP-SSI-e502f5/runs/<run-id>/support.json
  assigned_to: executor
  out_of_scope:
    - Any claim about SÉTA, LIT-SiGamal, or EndRing hardness.
    - Any prime outside {7, 11, 19}.
    - Any compiler besides T_id, T_collapse, and T_forget.
    - Publishing a PKE or an attack.
