# EXP-SSI-53cbc0
# Threshold arithmetic. No endomorphism ring.
# Approved by DEC-20261002-9671e3.
experiment:
  id: EXP-SSI-53cbc0
  hypothesis_id: H-SSI-c1f49f
  source_idea: IDEA-20260926-442b92
  question_id: RQ-SSI-001
  version: 1
  title: Discriminant-threshold arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-9671e3
  objective: >-
    Check the gaps 0, 3584 and 4032, and the exponent product one
    third.
  inputs:
    prime_power: 8
    fourth_power: 4096
    correct_threshold: 16
    correct_cube: 4096
    boundary_gap: 0
    middle_discriminant: 8
    middle_cube: 512
    middle_gap: 3584
    draft_threshold: 4
    draft_cube: 64
    draft_gap: 4032
    threshold_ratio: 4
    exponent_num: 4
    exponent_den: 3
    quarter_den: 4
    product_num: 1
    product_den: 3
  controls:
    - >-
      Sixteen cubed equals 4096. Reporting a positive gap invalidates
      the run.
    - >-
      4096 exceeds 512 by 3584. Reporting 8 as outside the strict
      interval from 4 to 16 invalidates the run.
    - >-
      4096 exceeds 64 by 4032. Reporting the correct threshold as 4
      invalidates the run.
    - >-
      Four times 3 equals 12 times 1. Reporting the exponent product
      as two thirds invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {threshold, exponent}
    - route in {cubes, fourth_power}
  metrics:
    primary:
      - middle_gap
      - boundary_gap
      - implementations_agree
    secondary:
      - draft_gap
      - threshold_ratio
      - product_den
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The middle gap is 3584 and the boundary gap is 0.
    formula: >-
      Compare 16 cubed, 8 cubed and 4 cubed with 8 to the fourth. The
      exponent product reduces 4 over 12 to 1 over 3.
    source: >-
      IDEA-20260926-442b92 states the corrected threshold p to the
      power 4/3 and the retracted threshold p to the power 2/3, read
      2026-10-02. The powers were computed in this design session.
      That computation is not a run. No endomorphism ring was computed.
  scale_relevance:
    tier: toy
    justification: One prime power and three cubes. No transfer to an algorithm.
    correspondence: null
  tail_checks:
    - The draft gap 4032 is required. A check that stops at the zero boundary gap is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the fourth power disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Sixteen cubed is not 4096.
    - The boundary gap is reported as positive.
    - The correct threshold is reported as 4.
    - The exponent product is reported as two thirds.
    - An endomorphism ring is computed or an attack cost is stated.
  success_criterion: >-
    Both runs agree that sixteen cubed equals 4096, that 4096 exceeds
    512 by 3584, that 4096 exceeds 64 by 4032, and that four thirds
    times one fourth equals one third.
  falsification_criterion: >-
    The runs agree, eight to the fourth is 4096, and sixteen cubed is
    not 4096.
  required_artifacts:
    - experiments/EXP-SSI-53cbc0/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSI-53cbc0/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-53cbc0/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSI-53cbc0/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSI-53cbc0/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SSI-53cbc0/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any endomorphism ring, class group, or isogeny walk.
    - Any claim that a published algorithm was checked.
    - Any measured attack cost.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
