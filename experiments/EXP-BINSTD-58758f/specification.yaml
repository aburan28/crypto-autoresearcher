experiment:
  id: EXP-BINSTD-58758f
  hypothesis_id: H-BINSTD-a45444
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-e3048d
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 HOLD-O chain E>2E>4E=C certificate + builder coset-restriction
    audit; Stage 1 toy n in {17,19} V/V_C base-size census at m in {2,3};
    Stage 2 h=2 and Z/(4l) controls
  status: approved
  approved_by: DEC-20261001-dec688
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-dec688
    composing_decision: DEC-20261001-dec688
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. HOLD-O defects absorbed. No deployed-
      curve security claim. No free-cofactor framing.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stages 0-2. Stage 0 is symbolic/arithmetic + code/spec read (zero
      scientific group walks on deployed curves). Stage 1-2 are toy n in
      {17,19} only. Stage N MUST NOT start until stage{N-1}/ exists.
      Deployed-curve attacks and exponent claims are NOT authorized.
      h=1 ordinary binary null is FORBIDDEN.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Write and hand-check the HOLD-O chain certificate E>2E>4E=C with
    quotients Z/2 and Z/4 on Z/12 and the n=19 Koblitz order. (B) Audit
    existing SEMBIN/DREG/QSP/CERTBIN builders for cofactor-coset restriction
    (H_spent vs H_unspent) with code pointers. (C) At toy scale measure
    V/V_C yield ratios against the pre-registered base-size law 4^{m-1}
    with h=2 and Z/(4l) controls. Never claim a deployed break.

  class: control-certificate
  class_note: >-
    Control / chain certificate plus engineering audit and toy base-size
    census. Absorbs HOLD-O. Not a smoothness-CDF heuristic-validation and
    not an attack cost-model. HEUR-BINSTD-a45444-H1 is the sole numbered
    heuristic under test at Stage 1. Measured vs modeled columns stay
    separate. No exponent-moving claim. DC-04 leg-side lever out of scope.

  corrections_absorbed:
    hold_o_chain_enumeration: >-
      HOLD-O: replace the false step "quotients of S are trivial or all of
      S" by the chain E>2E>4E=C with quotients Z/2 and Z/4; close only the
      target-side reading (no C-target DL in those quotients).
    part_b_base_size: >-
      HOLD-O: drop "free" framing; price unrestricted vs C-restricted
      windows as base-size with predicted V/V_C = 4^{m-1}.
    h1_null_impossible: >-
      HOLD-O: h=1 ordinary binary Weierstrass null does not exist; use
      h=2 sibling and relabelled Z/(4l) generic group.
    dc04_cross_cite: >-
      HOLD-O successor_seam: leg-side parity / E/4E lever owned by
      IDEA-20260922-1b16d7 / IDEA-20260922-153a90; not claimed here.

  scope:
    included:
      - >-
        Stage 0 (zero scientific trials on deployed curves):
        (i) chain certificate on Z/12;
        (ii) chain certificate on n=19 Koblitz #E=4*130873 (order factorisation);
        (iii) builder audit table for SEMBIN, DREG, QSP, CERTBIN RC-1
        candidate-generation / factor-base construction (restricted yes/no,
        code or spec pointer, documented reason if any);
        (iv) methodological note that target-side reading closes to C-reduction
        and leg-side lever is DC-04.
      - >-
        Stage 1 (toy): n=19 Koblitz y^2+xy=x^3+1 over F_2[t]/(t^19+t^5+t^2+t+1),
        #E=4*130873; RC-1 n=17 ordinary h=4 sibling; windows V={deg<10},
        V_C, V'_0 (parity), random 9-dim subspace; m in {2,3}; 40 C-targets
        + 20 class-2 mirrors; Z/(4l) replica; class-sum checks.
      - >-
        Stage 2 (control): h=2 Koblitz a=1 at n=19 (#E=2*262543); Z/4
        bookkeeping reports undefined; parity ratio still ~2; replicate
        class-sum discipline.
    excluded:
      - Any scientific group walk / attack at deployed m >= 131
      - Claiming a free cofactor structural gain (forbidden framing)
      - Requesting an h=1 ordinary binary-curve null
      - Re-litigating or redesigning DC-04 (1b16d7/153a90)
      - Editing AUXIN / prior EXP-BINSTD packets / IDEA claim text
      - Amazon Bedrock
      - Filing a deployed-curve security / break claim

  inputs:
    proposal: ledger/proposals/IDEA-20260922-e3048d.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-e3048d.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-a45444.yaml
    curve_audit: analysis/binstd-curve-audit/
    dc04_cross_cites:
      - ledger/proposals/IDEA-20260922-1b16d7.yaml
      - ledger/proposals/IDEA-20260922-153a90.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/instances.py
      - experiments/EXP-CERTBIN-e94b27/specification.yaml
      - experiments/EXP-SEMBIN-04ec3c/
      - experiments/EXP-DREG-001/
      - experiments/EXP-QSP-33b442/
    cells:
      Stage0-Z12:
        group: Z/12
        expected: >-
          subgroups products of {1,2,4} x {1,3}; endomorphisms preserve
          Sylow-2 and Sylow-3 parts
      Stage0-n19-koblitz:
        n: 19
        curve: y^2+xy=x^3+1
        field_poly: t^19+t^5+t^2+t+1
        frozen_expected:
          group_order_E: 523492
          l: 130873
          cofactor_h: 4
        note: Review-computed; Stage 0 must re-factor and verify.
      Stage1-n19-koblitz:
        n: 19
        m: [2, 3]
        window: V_deg_lt_10
        n_targets_C: 40
        n_targets_class2: 20
        seeds: [20261001, 20261002]
      Stage1-RC1-n17:
        n: 17
        note: Ordinary h=4 sibling from CERTBIN RC-1 cell family
        seeds: [20261003]
      Stage2-h2-n19:
        n: 19
        a: 1
        frozen_expected:
          group_order_E: 525086
          l: 262543
          cofactor_h: 2
        seeds: [20261004]
      CTRL-Z4l-replica:
        description: Relabelled Z/(4l) with residue classes as cosets
      CTRL-random-subspace:
        description: Random 9-dimensional subspace size-matched null window
      FORBIDDEN-h1:
        description: Must never appear; ordinary binary Weierstrass always even order

  controls:
    - name: Z12_symbolic
      object: Enumerated subgroup list and endomorphism preservation on Z/12.
    - name: Z4l_generic_replica
      object: Relabelled Z/(4l); ratios must coincide with curve (structure control).
    - name: h2_sibling
      object: >-
        Koblitz a=1 at n=19, #E=2*l'; Z/4 undefined; parity ratio still ~2.
    - name: random_subspace_null
      object: Size-matched random window; baseline for parity contrast.
    - name: class2_mirror_targets
      object: V_C must give zero decompositions of class-2 targets at every m.
    - name: class_sum_oracle
      object: Every counted decomposition must have Z/4 (or Z/2) class-sum 0.
    - name: matched_rho_baseline
      object: Modeled comparator only; labeled modeled; never mixed into yield columns.

  independent_variables:
    - stage  # 0 | 1 | 2
    - n  # 17 | 19
    - cofactor_h  # 2 | 4
    - m  # 2 | 3
    - window  # V | V_C | V_0 | random
    - seed

  metrics:
    primary:
      - chain_certificate_pass
      - builder_restricted_yes_no
      - builder_code_pointer
      - coset_fractions_of_window_x
      - yield_ratio_V_over_V_C
      - parity_ratio_V0_over_random
      - class_sum_violations
      - curve_over_generic_ratio
      - HEUR_H1_holds
    secondary:
      - group_order_E
      - l_prime_factor
      - cofactor_h
      - certificate_pass_rate
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - h1_null_absent

  heuristic_under_test:
    - HEUR-BINSTD-a45444-H1

  preregistered_prediction:
    quantity: >-
      (A) Chain E>2E>4E=C with quotients Z/2, Z/4 hand-checks on Z/12 and
      n=19 Koblitz; (B) builder table reports restricted yes/no per path;
      predicted H_spent more likely; (C) mean V/V_C = 4^{m-1} (within
      [0.5,2]x) on curve and Z/(4l) replica at m in {2,3}; (D) parity
      V'_0/random ~ 2 on h=4 and on h=2; (E) class-sum violations = 0;
      (F) no h=1 null; (G) NO deployed-curve security claim.
    formula: >-
      V/V_C ~ 4^{m-1}; parity ~ 2; coset x-fractions (class0, class2, {1,3})
      ~ (1/4, 1/4, 1/2); matched rho modeled only.
    source: >-
      analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-e3048d.yaml
      concrete_experiment; H-BINSTD-a45444 HOLD-O restatement
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 chain checks are RECOMPUTED/enumerated. Builder audit is
      CODE/SPEC READ (not a measured statistic). Stage 1/2 yields are
      MEASURED. 4^{m-1} and parity-2 are MODELED comparators (labeled
      modeled) placed beside measured ratios — never mixed unlabeled.
      Matched rho is modeled baseline only.

  scale_relevance:
    tier: toy
    justification: >-
      Executable cells at n in {17,19} only. ECC2K-130 (m=131) is the named
      structural setting and methodological note, never a run target.
      Transfer to m=131 is NOT claimed.
    correspondence: null

  sample_size_justification: >-
    Review concrete_experiment: 40 C-targets and 20 class-2 mirrors give
    expected counts >>1 under the 4^{m-1} law at m=2 (ratio 4) and m=3
    (ratio 16) for windows of size ~2^10. Exact census preferred where
    affordable; otherwise fixed seeds listed under replication. Stage 0
    builder audit is exhaustive over the named builder families, not a
    sample.

  tail_checks:
    - Report the single most extreme per-target V/V_C ratio, not only the mean.
    - Class-sum violations must be exactly 0 (hard fail).
    - Class-2 mirror targets under V_C must be exactly 0 decomps.
    - h=2 cell must refuse Z/4 bookkeeping (not silently coerce).

  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
      - 20261004
    independent_instances: >-
      Stage 0 deterministic (symbolic + code read). Stage 1: two seeds on
      n=19 Koblitz census; one RC-1 n=17 seed. Stage 2: one h=2 seed plus
      Z/(4l) replica of Stage 1 draws.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when chain-certificate.yaml, builder-audit-table.yaml,
      and methodological-note.md are written.
    - >-
      Stage 1 may start only after stage0/ exists. Stage 1 complete when
      coset-fractions, yield-ratio tables (curve + replica), class-sum
      report, and HEUR verdict are written.
    - >-
      Stage 2 may start only after stage1/ exists. Stage 2 complete when
      h2-control-report.yaml is written (Z/4 undefined + parity ~2).
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - Hard halt on class-sum violation or chain-certificate failure.

  invalidation_rules:
    - Any h=1 ordinary binary-curve null requested or reported → invalid.
    - Free-cofactor / free-structural-gain claim in artifacts → invalid framing.
    - Editing IDEA-20260922-e3048d claim text → protocol violation.
    - Deployed m>=131 attack attempt → out of scope / invalid.
    - Timeout/crash → failed_infrastructure, not negative math evidence.

  success_criterion: >-
    Stage 0 artifacts present and chain certificate passes; builder table
    has a row per named family with pointers; Stage 1/2 decide among
    DO-1..DO-4 of H-BINSTD-a45444 from the pre-registered metrics without
    post-hoc threshold edits. A negative HEUR result or H_unspent finding
    still counts as a successful discriminating experiment.

  falsification_criterion: >-
    Chain certificate fails; or class-sum violations >0; or V/V_C outside
    [0.5,2]x 4^{m-1} on curve while inside on replica (HEUR fail at
    tested scope); or h=1 null appears.

  required_artifacts:
    - experiments/EXP-BINSTD-58758f/stage0/chain-certificate.yaml
    - experiments/EXP-BINSTD-58758f/stage0/builder-audit-table.yaml
    - experiments/EXP-BINSTD-58758f/stage0/methodological-note.md
    - experiments/EXP-BINSTD-58758f/stage1/coset-fractions.yaml
    - experiments/EXP-BINSTD-58758f/stage1/yield-ratios-curve.yaml
    - experiments/EXP-BINSTD-58758f/stage1/yield-ratios-replica.yaml
    - experiments/EXP-BINSTD-58758f/stage1/class-sum-report.yaml
    - experiments/EXP-BINSTD-58758f/stage1/heur-h1-verdict.yaml
    - experiments/EXP-BINSTD-58758f/stage2/h2-control-report.yaml
    - experiments/EXP-BINSTD-58758f/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-58758f/runs/*/raw-result.json
    - experiments/EXP-BINSTD-58758f/runs/*/stdout.log

  procedure:
    stage0:
      - Enumerate subgroups of Z/12; verify endomorphism preservation; write chain.
      - On n=19 Koblitz: factor #E; confirm 4*l with l prime; write E>2E>4E=C certificate.
      - Read SEMBIN/DREG/QSP/CERTBIN RC-1 builder paths; fill builder-audit-table.yaml.
      - Write methodological-note.md (target-side closed; DC-04 owns legs; base-size pricing).
    stage1:
      - Confirm stage0/ exists.
      - Build windows V, V_C, V'_0, random; classify coset fractions.
      - Census m=2,3 decompositions of 40 C-targets (and 20 class-2 mirrors under V_C).
      - Replicate in Z/(4l); compare ratios to 4^{m-1} and 2.
      - Enforce class-sum 0; write HEUR verdict.
    stage2:
      - Confirm stage1/ exists.
      - Run h=2 n=19 control; refuse Z/4 bookkeeping; check parity ~2.
      - Certificate-verify every counted relation by curve arithmetic.

  optimistic_assumptions_disclosed:
    - >-
      Treating part (B) as free structural gain would be optimistic
      (bias: overstates cryptanalytic impact). Protocol forbids that framing;
      prices as base-size 4^{m-1}.
    - >-
      Pure-Python census at m=3 may hit instrument_ceiling before full
      40-target completion (bias: may under-power HEUR test). Record
      instrument_ceiling and completed target count honestly.
    - >-
      Builder audit that only reads specs (not implementations) may miss
      silent runtime restrictions (bias: false H_spent). Prefer code
      pointers; mark spec-only rows explicitly.

  memory_accounting: >-
    Stage 0 negligible. Stage 1/2: peak_rss_bytes measured per run;
    dominant structures are F_{2^n} elements and window tables of size
    O(2^{l_dim}) — analytic size stated in stage reports; reconcile
    measured RSS against that.

  assigned_to: executor
  dominated_by: >-
    Matched rho ~2^60.9. Constant-factor base-size accounting cannot close
    the gap. No attack claimed.
  sota_delta:
    time: Zero cryptanalytic movement; at most 2 bits pool/base-size if H_unspent.
    memory: At most proportional FB storage if unrestricted windows adopted.
    data_queries: First HOLD-O-corrected cofactor chain + builder audit for this seam.
