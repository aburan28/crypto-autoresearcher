experiment:
  id: EXP-AES-1100d7
  hypothesis_id: H-AES-142f26
  derived_from_idea: IDEA-20260805-33a11e
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Five-stage cheapest-first measurement of the AES key schedule's key-direction
    algebraic degree - in-harness S-box ANF, the two-sided D_1 = 7 forced value,
    the all-8-subspaces-balanced falsifier, a one-sided D_2 witness search, an
    affine positive control that must return exact zeros, a degree-7 random-S-box
    matched null, and a four-point graded saturation ladder
  objective: >-
    The one uncertainty a run reduces is how many round keys a key-varying
    integral or division-property object built on ALGEBRAIC DEGREE IN THE MASTER
    KEY can survive - which decides whether that object can reach the middle of
    the 3-to-7-round window RQ-AES-001 scopes in, and therefore whether the lane
    is worth pursuing at all. A run establishes (i) the AES S-box's per-coordinate
    algebraic degree, RECOMPUTED IN-HARNESS rather than recalled, which every
    bound in the hypothesis depends on; (ii) whether every 8-dimensional affine
    key subspace balances at RK_1, which is the sharpest available falsifier of
    the one-SubWord-layer bound; (iii) the exact value of D_1 for AES-128 against
    a TWO-SIDED forced prediction of 7, where measuring less would be a structural
    degeneracy and a positive lead; (iv) a one-sided lower-bound witness for D_2;
    and (v) the saturation index as a function of substituted S-box degree over a
    four-point graded ladder whose forced sequence is strictly decreasing. A
    predicted-negative outcome is GOAL-AES-001's SECOND COMPLETION HORN - a scoped
    barrier statement with an archived derivation - and is planned for rather than
    discovered as a disappointment.
  what_this_is_not:
    - >-
      Not an attack, not a distinguisher, not a key recovery, not a cost
      improvement. sota_delta is ZERO on time, memory, data and queries in every
      branch. The measurement uses chosen KEYS, which is not an adversarial model
      at all.
    - >-
      NOT A BARRIER ON AES. A barrier on the KEY SCHEDULE is not a barrier on the
      cipher: round keys are XORed into a data path whose own degree grows
      independently, and nothing here bounds the composite.
    - >-
      NOT A STATEMENT ABOUT THE DIVISION PROPERTY PROPER, which is strictly finer
      than algebraic degree and can survive where a degree argument dies. This
      contract does not compute it.
    - >-
      Not a new attack FAMILY. This IS the division-property /
      higher-order-differential family, stated plainly. What is claimed unattempted
      is the ARGUMENT SLOT - key rather than data - and only within this corpus.
    - >-
      NOT AN INSTANCE DISCRIMINATOR. The degree vector is constant across all keys
      and has zero spread as such; it is a statement about the cipher's structure.
    - >-
      Not a comparison against any published AES attack cost. DEC-20260731-011 and
      RQ-AES-001 forbid comparing against a recalled number and no such comparison
      appears.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - the AES S-box's coordinate degrees as recomputed
      in-harness; the exact value of D_1 for AES-128; a LOWER BOUND on D_2 from an
      exhibited witness; the balance or imbalance of every TESTED 8-dimensional
      affine key subspace at RK_1; and the saturation index under each substituted
      S-box. WHAT DOES NOT FOLLOW - no upper bound on any D_k from an all-zero
      SAMPLE, ever; no statement that key-varying attacks are impossible; nothing
      about the data direction, related-key or chosen-key models, the division
      property proper, or full-round or deployed AES; and no statement that the key
      schedule is "random" after any round. If the matched null reproduces AES's
      sequence, the phenomenon belongs to THE WIRING and no sentence may attribute
      it to AES specifically.
  inputs:
    procedure: >-
      STAGE 0 (minutes, zero cryptanalytic compute, MAY TERMINATE THE LINE) -
      implement the key schedule for Nk = 4, 6, 8 from scratch and PIN it against
      FIPS-197 known-answer vectors under a SECOND INDEPENDENT implementation.
      pycryptodome, which RQ-AES-001's gate names, is ABSENT from this container,
      so the second implementation must be the openssl CLI or `cryptography`. If
      the schedule does not pin, STOP: this is infrastructure signal and never a
      statement about AES. Also verify, against FIPS-197, that Nk = 8 carries the
      ADDITIONAL SubWord at i = 4 mod 8 with no RotWord - the single most likely
      error in the derivation. STAGE 1 (seconds) - recompute the S-box ANF and its
      per-coordinate degree by Moebius transform from the FIPS-197 construction,
      pinned against S(00)=63, S(01)=7c, S(53)=ed. If any coordinate is not 7,
      STOP and rederive every bound from the measured degree. STAGE 2 (seconds,
      2^8 = 256 key expansions per subspace) - measure D_1 for AES-128 exactly,
      and check that ALL tested 8-dimensional subspaces balance. STAGE 3 (seconds
      to minutes, up to 2^16 key expansions per subspace) - search for a nonzero
      16th derivative of RK_2 over a DECLARED number of candidate subspaces, fixed
      in advance and not expanded until a witness appears. STAGE 4 (minutes) - run
      the affine positive control, the matched null and the four-point graded
      S-box family, and report the saturation index against the forced monotone
      sequence. ORDERING: the positive control and the matched null are run and
      THEIR VERDICTS COMMITTED BEFORE THE REAL AES ARM IS LOOKED AT; if the frozen
      verdict rule emits the same label on the affine positive control and on AES,
      the rule discriminates nothing and is rewritten first.
    instrument: >-
      A from-scratch AES key schedule for Nk = 4, 6, 8 plus a second independent
      implementation for pinning (openssl CLI or `cryptography`). Moebius
      transform for the S-box ANF. Subspace sums computed by exhaustive XOR over
      the 2^d points of each affine subspace. No cryptanalytic library is
      required. Recorded through harness/runner.py with a manifest and source blob
      hashes; the S-box degree measurement MUST be re-run in-harness with a
      committed receipt, since the value of 7 was scout-computed outside the
      harness in the source session and may not be cited from there.
    parameters: >-
      Key sizes Nk = 4, 6, 8. Subspace dimensions d in {2, 8, 12, 16}: 2 for the
      affine positive control at every round key to RK_14, 8 for the balance
      falsifier and the exact D_1 measurement, and {8, 12, 16} for the one-sided
      D_2 witness search. Subspace families - BOTH coordinate-aligned and seeded
      random affine, reported SEPARATELY, because byte-aligned subspaces interact
      with RotWord and may systematically miss or hit. The number of candidate
      subspaces at each dimension is DECLARED IN THE CONTRACT before the run.
      Substituted S-boxes for the graded ladder: the GF(2^8) power permutations
      x^2, x^7, x^31, x^127, all permutations since gcd(d, 255) = 1, with
      algebraic degrees 1, 3, 5, 7 given by binary weight. Matched null: a SEEDED
      random permutation of GF(2^8) whose MEASURED degree is also 7, with every
      other wire identical.
  controls:
    - >-
      MATCHED NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL) - a
      seeded random permutation of GF(2^8) whose measured algebraic degree is also
      7, substituted for the AES S-box with every other wire of the key schedule
      identical: same RotWord, same Rcon, same XOR chain, same Nk. FORCED VALUE,
      derived before the run - the degree bounds and the saturation index are
      IDENTICAL, because the bound depends on the S-box only through delta.
      CONSEQUENCE STATED IN ADVANCE SO IT CANNOT BE SPUN: if the measured degree
      sequence also matches, the phenomenon is a property of THE WIRING and not of
      AES, and no sentence in the write-up may attribute it to AES specifically.
      If AES's measured sequence DIFFERS, AES's S-box or Rcon structure is doing
      something the degree bound does not capture, and THAT is a finding. The null
      can fail in either direction, which is what makes it a null.
    - >-
      POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR - substitute
      the F_2-linear GF(2^8) map x -> x^2 for SubWord's S-box. The whole key
      schedule becomes AFFINE in the master key, so D_k = 1 for every k and EVERY
      2-dimensional affine key subspace must have zero XOR-sum at EVERY round key,
      all the way to RK_14. THRESHOLD DECLARED BEFORE THE RUN: exact zero, NO
      TOLERANCE. If the instrument reports any nonzero 2nd derivative there it is
      broken and NO NEGATIVE RESULT MAY BE REPORTED FROM ANY STAGE.
    - >-
      GRADED CONTROL, FOUR POINTS, MONOTONICITY REPORTED - S-boxes x^2, x^7,
      x^31, x^127 with degrees 1, 3, 5, 7. Report the measured saturation index at
      each against the forced strictly-decreasing sequence k* = infinity, 5, 4, 3.
      This localises any failure to a specific degree regime rather than leaving
      "it did not work".
    - >-
      ORDERING CONTROL - the positive control and the matched null are run and
      their verdicts COMMITTED before the real AES arm is looked at.
    - >-
      FIPS-197 PINNING CONTROL - the implemented key schedule matched against
      known-answer vectors under a second independent implementation, for all
      three key sizes, BEFORE any degree is measured.
    - >-
      S-BOX KNOWN-ANSWER CONTROL - S(00)=63, S(01)=7c, S(53)=ed pinned before the
      ANF is taken.
    - >-
      SUBSPACE-FAMILY CONTROL - coordinate-aligned and seeded random affine
      subspaces reported SEPARATELY, since byte-aligned subspaces interact with
      RotWord and could systematically miss or hit.
    - >-
      ARCHIVE CHECK (zero compute) - no prior measurement of key-direction
      algebraic degree exists in this corpus, checked across EV-AES-001..005,
      EV-AES-d33b1c, EV-AES-d8a13e, the four GOAL-AES-001 batch checkpoints and
      the BATCH-004 task artifacts. RECORDED AS AN ABSENCE, not claimed as a
      passed check.
  independent_variables:
    - key size Nk in {4, 6, 8}
    - round key index k
    - affine subspace dimension d in {2, 8, 12, 16}
    - subspace family - coordinate-aligned versus seeded random affine
    - >-
      substituted S-box - real AES, degree-7 random permutation, x^2, x^7, x^31,
      x^127
  metrics:
    primary:
      - >-
        sbox_coordinate_degrees - the algebraic degree (unitless integer) of each
        of the eight AES S-box output bits, recomputed in-harness by Moebius
        transform; all eight values reported, not a maximum
      - >-
        D1_aes128 - the exact algebraic degree (unitless integer) of AES-128 RK_1
        in the master key bits, measured as the largest d <= 8 with some
        d-dimensional affine key subspace having nonzero XOR-sum, WITH THE
        WITNESSING SUBSPACE COMMITTED
      - >-
        balanced_fraction_at_d8 - fraction (unitless, in [0,1]) of tested
        8-dimensional affine key subspaces whose XOR-sum of AES-128 RK_1 is zero
      - >-
        D2_lower_bound_aes128 - the largest d in {8, 12, 16} with an exhibited
        witness for RK_2 (unitless integer), or the explicit string "no witness
        found in N subspaces" WITH N
      - >-
        saturation_index_by_key_size - the first k at which the derived bound
        reaches the cap (unitless integer), for AES-128 / 192 / 256
      - >-
        graded_saturation_indices - k* (unitless, with infinity permitted) at each
        substituted S-box degree in {1, 3, 5, 7}, with an explicit monotonicity
        verdict
    secondary:
      - >-
        fips197_pinning_result per key size, naming BOTH implementations
        (categorical pass/fail)
      - >-
        nk8_extra_sublayer_verification - whether FIPS-197 confirms the additional
        SubWord at i = 4 mod 8 for Nk = 8 (categorical:
        confirmed / contradicted / text_unobtainable)
      - >-
        affine_positive_control_max_abs_sum - the maximum absolute 2nd-derivative
        value in the x^2 arm across every round key to RK_14 (must be exactly 0)
      - >-
        matched_null_degree_sequence - the full measured degree sequence of the
        degree-7 random-permutation arm, reported BESIDE AES's
      - >-
        subspaces_tested_by_family and by dimension (unitless counts), reported
        separately for coordinate-aligned and random affine
      - >-
        peak_memory_bytes and wall clock per stage, since the largest stage is
        2^16 * 16 bytes = 1 MB and the claim that this fits the envelope should be
        measured rather than asserted
  heuristic_under_test:
    - id: HEUR-001
      formal_statement: >-
        The upper bound D_k <= min(delta^(a(k)), cap) is UNCONDITIONAL: composition
        multiplies algebraic degree, XOR and rotation do not raise it, constants do
        not change it. The barrier's UPPER half is a THEOREM, not a heuristic.
      preregistered_prediction: >-
        balanced_fraction_at_d8 = 1.000 exactly, with no exceptions over every
        8-dimensional subspace tested, since deg RK_1 <= 7 < 8 forces the 8th
        derivative to vanish identically.
      prediction_source: >-
        deg(f . g) <= deg(f) deg(g) and deg(f + g) <= max(deg f, deg g) for
        vectorial Boolean functions - elementary and DERIVED, not cited to any
        external source.
      scale_access_and_transfer: >-
        Evaluated at the real key sizes AES-128/192/256, so there is no scale gap
        and no transfer assumption. The bound is symbolic in (delta, a, n) and the
        measurement checks its one-layer instance directly.
      sample_size_justification: >-
        The prediction is a UNIVERSAL over subspaces, so no sample size makes it
        true - but ONE counterexample makes it false, which is why the metric is a
        fraction over a declared sample and a single nonzero sum is disqualifying.
        The declared sample size is fixed in the contract and is chosen to cover
        both subspace families, NOT chosen to reach a threshold.
      comparison_metric: >-
        balanced_fraction_at_d8 against the forced value 1.000, exact, no
        tolerance.
      tail_checks:
        - >-
          Report coordinate-aligned and random affine subspaces SEPARATELY; a
          failure confined to one family points at RotWord interaction rather than
          at the bound.
        - >-
          Report the single largest absolute subspace sum observed, not only the
          count of nonzero ones.
      falsification_condition: >-
        A single nonzero XOR-sum of AES-128 RK_1 over any 8-dimensional affine key
        subspace. The bound is refuted, and since the bound at k = 1 IS the S-box
        degree statement, so is the Stage 1 measurement.
    - id: HEUR-002
      formal_statement: >-
        ATTAINMENT HEURISTIC, load-bearing ONLY for D_1 = 7 and for the claim that
        the barrier BITES rather than merely BOUNDS: the top-degree terms produced
        by a single SubWord layer are not cancelled by the subsequent XOR chain.
      preregistered_prediction: >-
        D1_aes128 = 7 EXACTLY, a two-sided forced value: 8 refutes the upper bound,
        below 7 refutes attainment.
      prediction_source: >-
        Internal argument - the XOR chain adds words that are AFFINE in the master
        key at that layer, and an affine function cannot cancel a degree-7 term.
        Sound for AES-128 RK_1 as written; NOT established for k >= 2, where the
        added words are themselves high degree and cancellation is possible in
        principle. Recorded as a weakness rather than smoothed over.
      scale_access_and_transfer: >-
        Measured at the real AES-128 key schedule. NO transfer is claimed to
        k >= 2: at higher k only LOWER bounds are sought and no attainment is
        claimed.
      sample_size_justification: >-
        D_1 is decided exactly at 2^8 = 256 key expansions per candidate subspace
        because the ambient degree ceiling at one layer is 7, so d = 8 exhausts the
        question. This is an EXACT measurement, not a sample: the two-sided
        prediction is decidable, which is exactly why it was chosen as the headline.
      comparison_metric: >-
        D1_aes128 against the forced integer 7, with the witnessing subspace
        committed so an independent party can recheck the lower bound.
      tail_checks:
        - >-
          Commit the witnessing subspace, so the lower bound is independently
          re-verifiable rather than asserted.
        - >-
          Report whether the witness is coordinate-aligned or random affine.
      falsification_condition: >-
        D1_aes128 strictly below 7 with the positive control and the FIPS-197
        pinning both passing - the top-degree terms cancel, the key schedule is
        degenerate in the key direction, the barrier is weaker than derived, and
        this becomes a POSITIVE LEAD requiring independent replication before any
        record states it.
    - id: HEUR-003
      formal_statement: >-
        The n-1 cap from invertibility applies to AES-128 round keys; for
        AES-192/256 a single round key does not determine the master key and the
        weaker cap n is used instead.
      preregistered_prediction: >-
        saturation_index_by_key_size = (3, 4, 4) under EITHER cap, because
        7^3 = 343 exceeds 127, 191 and 255 alike.
      prediction_source: >-
        A coordinate of a bijection of F_2^n has degree at most n-1, since its ANF
        cannot contain the top monomial or the function would be unbalanced;
        elementary, derived here. The AES-128 schedule is invertible from any round
        key.
      scale_access_and_transfer: >-
        Symbolic at the real key sizes; no sampling and no transfer.
      sample_size_justification: >-
        NOT APPLICABLE - the entry is symbolic. Its honest content is that it
        changes NO saturation index, and it is stated so the difference between key
        sizes is not silently glossed rather than because a run could resolve it.
      comparison_metric: >-
        saturation_index_by_key_size against the forced tuple (3, 4, 4), computed
        under both cap readings and reported as agreeing.
      tail_checks:
        - >-
          Report the index under BOTH caps explicitly, so a reader can see the
          conclusion does not depend on the contested one.
      falsification_condition: >-
        The two cap readings give DIFFERENT saturation indices at any key size -
        which would mean 7^a lands between n-1 and n somewhere, contradicting the
        arithmetic and indicting the layer count.
  preregistered_prediction:
    quantity: >-
      sbox_coordinate_degrees, D1_aes128, balanced_fraction_at_d8,
      D2_lower_bound_aes128, saturation_index_by_key_size, and
      graded_saturation_indices.
    formula: >-
      Predicted sbox_coordinate_degrees = 7 on ALL EIGHT coordinates. Predicted
      D1_aes128 = 7 EXACTLY (two-sided). Predicted balanced_fraction_at_d8 = 1.000
      exactly, no exceptions. Predicted D2_lower_bound_aes128 at least 16.
      Predicted saturation_index_by_key_size = (3, 4, 4). Predicted
      graded_saturation_indices STRICTLY DECREASING through
      (infinity, 5, 4, 3) for delta = (1, 3, 5, 7). Predicted matched null:
      IDENTICAL bounds and saturation index to AES. Predicted affine positive
      control: EXACT ZERO everywhere, no tolerance. Under the null that the
      instrument is not measuring degree, the graded sequence is non-monotone or
      the affine control is nonzero.
    source: >-
      Pre-registered in IDEA-20260805-33a11e's `predictions` and `controls` blocks
      and restated in H-AES-142f26 before any run under this contract exists. The
      S-box degree of 7 is a SCOUT MEASUREMENT made outside the harness in the
      source session and is re-measured here rather than cited. Never tuned to
      data.
  scale_relevance:
    tier: real_parameters_structural_claim
    justification: >-
      The measurement runs at the REAL AES-128/192/256 key schedules - there is no
      reduced surrogate, because the object is symbolic in (delta, a, n) and the
      measurable dual costs only 2^d key expansions. What is toy is not the
      parameters but the CLAIM: an upper bound on what a degree-based key-direction
      argument can reach is not a statement about AES's security, and RQ-AES-001's
      scope ceiling binds unchanged. The only genuinely unreachable quantities are
      the high-k degrees, where 2^d is prohibitive; there the contract seeks LOWER
      BOUNDS ONLY and refuses to report an upper bound from an all-zero sample.
    correspondence: null
  tail_checks:
    - >-
      Report all EIGHT S-box coordinate degrees, not a maximum; a single
      low-degree coordinate would change the analysis and would be invisible in a
      maximum.
    - >-
      Report the single largest absolute subspace sum at d = 8, not only the count
      of nonzero sums.
    - >-
      Report coordinate-aligned and random affine subspace families SEPARATELY at
      every dimension.
    - >-
      Report the declared candidate count N at d = 16 BEFORE the search, and report
      "no witness found in N subspaces" verbatim if none is found. The candidate
      count is NOT expanded until a witness appears.
    - >-
      Commit the witnessing subspace for every claimed lower bound, so it is
      independently re-verifiable.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 20
  stopping_rules:
    - >-
      STOP at STAGE 0 if the key schedule does not pin against FIPS-197 under both
      implementations. This is INFRASTRUCTURE SIGNAL and never a statement about
      AES (AGENTS.md rule 5).
    - >-
      STOP at STAGE 1 if any S-box coordinate degree is not 7, and rederive every
      bound from the measured degree before proceeding.
    - >-
      STOP EVERYTHING if the affine (x^2) positive control shows any nonzero 2nd
      derivative. The instrument is broken and no negative result may be reported
      from any stage.
    - >-
      Stop the D_2 search at the DECLARED candidate count. The count is fixed in
      the contract and is NOT expanded until a witness appears; expanding it would
      turn a one-sided test into a fishing expedition.
    - >-
      Run the positive control and the matched null, and COMMIT their verdicts,
      before the real AES arm is looked at.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5). A FIPS-197 pinning failure is in this category.
    - >-
      A run reporting an all-zero SAMPLE as a degree UPPER BOUND is
      invalid_reporting. The test is one-sided; "no witness found in N subspaces"
      is the only admissible phrasing.
    - >-
      A run citing the S-box degree from the source session's out-of-harness scout
      computation, rather than re-measuring it in-harness with a receipt, is
      invalid_provenance.
    - >-
      A run whose control arms were not executed in the same invocation as the
      signal arm, or whose control verdicts were not committed before the AES arm
      was read, is invalid_measurement.
    - >-
      A run that expanded the D_2 candidate subspace count after starting the
      search is invalid_measurement.
    - >-
      A run attributing a result to AES specifically when the matched null
      reproduced it is invalid_reporting.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    The key schedule pins against FIPS-197 for all three key sizes under two
    independent implementations; all eight S-box coordinate degrees measure exactly
    7 in-harness; the affine positive control returns EXACT ZERO on every 2nd
    derivative to RK_14; balanced_fraction_at_d8 is exactly 1.000 with no
    exceptions; D1_aes128 is exactly 7 with its witnessing subspace committed;
    D2_lower_bound_aes128 is at least 16 with a committed witness, OR the run
    reports "no witness found in N subspaces" with N declared in advance;
    saturation_index_by_key_size is (3, 4, 4) under both cap readings; and
    graded_saturation_indices is strictly decreasing through (infinity, 5, 4, 3).
    Meeting these SUPPORTS THE BARRIER at the stated scope - and the barrier is a
    NEGATIVE, which is the expected and planned-for result.
  falsification_criterion:
    - >-
      Any S-box coordinate with algebraic degree other than 7 - every bound in the
      hypothesis is void and the analysis is rederived from the measured degree.
    - >-
      A nonzero XOR-sum of AES-128 RK_1 over ANY 8-dimensional affine key subspace
      - the one-SubWord-layer bound is refuted, and with it the S-box degree
      measurement.
    - >-
      The affine positive control shows a nonzero 2nd derivative anywhere -
      instrument failure; NOTHING MAY BE REPORTED AT ALL.
    - >-
      The graded saturation index is non-monotone in delta - the canonical artifact
      tell; the instrument is not measuring degree and no directional reading
      attaches to any verdict.
    - >-
      Measured D_1 for AES-128 STRICTLY BELOW 7, with the controls passing - the
      barrier is weaker than derived, the key schedule is degenerate in the key
      direction, and this is a POSITIVE LEAD, the outcome that would most change
      the campaign's direction. It demands independent replication before any
      record states it.
    - >-
      saturation_index_by_key_size differs from (3, 4, 4) - a layer count is wrong,
      most likely the Nk = 8 extra SubWord at i = 4 mod 8, which is checkable
      against FIPS-197 and against the implemented schedule.
    - >-
      The key schedule fails to pin against FIPS-197 - infrastructure signal; the
      line halts and reports the failure as infrastructure.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      the FIPS-197 pinning result for Nk = 4, 6, 8 with BOTH implementations named
      and their versions
    - >-
      the per-coordinate S-box algebraic degree, ALL EIGHT VALUES, with the
      in-harness receipt for the Moebius transform and the known-answer pins
    - >-
      D_1 for AES-128 as an exact integer, WITH THE WITNESSING SUBSPACE COMMITTED
    - >-
      the count of 8-dimensional subspaces tested, by family, and the number with
      nonzero sum, plus the largest absolute sum observed
    - >-
      the largest d in {8, 12, 16} with a committed witness for RK_2, or the
      explicit "no witness found in N subspaces" with N declared in advance
    - >-
      the saturation index per key size under BOTH cap readings, and per graded
      S-box, against the forced sequences
    - >-
      the matched null's FULL degree sequence, reported beside AES's in the same
      file
    - >-
      the affine positive control's maximum absolute 2nd-derivative value across
      every round key to RK_14
    - >-
      the FIPS-197 verification of the Nk = 8 extra SubWord, or an explicit record
      that the text could not be reached
    - source blob hashes for the key schedule, the ANF code and the subspace sums
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
