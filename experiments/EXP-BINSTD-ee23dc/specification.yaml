  objective: >-
    Independently compute and freeze the 5×10 GHS descent-lattice table for
    the five ANSI composite-degree c2pnb curves: certify STRUCTURALLY EMPTY
    for every c|16 cell (C1), pin Artin-Schreier levels m on live lanes into
    [n/2+1,n] (C2), emit a van Oorschot–Wiener–charged cost table whose
    preregistered generic-m=n verdict is WASH-or-worse (C3), and verify the
    collapse consequence on toy dk≤41 cells — thereby filling the GHS-cover
    column of the RQ-BINSTD reachability table, or name a concrete
    falsifying certificate / instrument defect.

  class: representation
  class_note: >-
    Primary class is representation / certificate (C1/C2) with a cost-model
    measurement arm (C3 table) and a toy observational control (Stage 2).
    Carries HEUR-BINSTD-d11575-H0 (unconditional arithmetic; recorded as
    absence), H1 (smoothness/yield), H2 (complexity-constant convention).
    Not an exponent-moving breakthrough experiment; C3 exponent comparison
    instantiates a known composite-degree mechanism at published parameters.

  scope:
    included:
      - >-
        Stage 0. Freeze certificate JSON schema; freeze preregistered
        predictions (25 empty c|16 cells; m bounds; VOW WASH-or-worse under
        generic m=n; matched-rho formula and wash_margin_bits=16); freeze
        dual conventions for m (level of B^{1/2} vs B) and g (2^{m-1} vs
        2^{m-1}-1); implement F_{2^16} level harness; run Koblitz m=1
        fixture audit and hard-coded-table mutant. ZERO STRUCTURALLY EMPTY
        success cells filed in Stage 0.
      - >-
        Stage 1. For each of five curves and each c in
        {1,2,4,8,16,k,2k,4k,8k}: compute conjugate period, m (both
        conventions), g candidates, transfer-existence g·c≥log2 ℓ, index-
        calculus regime with boundary g/log2 q, charged time exponent,
        charged FB memory entries, matched rho with declared symmetry group
        √(2k), ratio and wash label. Emit 25 STRUCTURALLY EMPTY certificates
        for c|16. Emit cost table. Diff against MMT tables when body text
        is obtainable (else record O-PROVENANCE open gate; do not invent
        MMT numbers).
      - >-
        Stage 2. On admitted toy cells (d,k′)∈{(4,5),(4,7),(8,5),(2,11)}
        with d·k′≤41: verify subfield-trace of an ℓ'-order point is identity;
        where cover construction is feasible, verify conorm-norm image order
        coprime to ℓ' for c|d. EVEN-k′ positive control must show NON-trivial
        image. Prime-degree / uniform-B / Koblitz nulls as declared.
    excluded:
      - Deployed relation search / index-calculus attack at N≥131.
      - Magma/Sage/cypari2 provisioning as the success path (AUXIN forbidden).
      - Semaev PDP engine races; block-Wiedemann races; rho break claims.
      - Editing IDEA claim text; editing shared GOAL-ECDLP2M-001.yaml.
      - Amazon Bedrock.
      - Any break claim; any unconditional security claim about a deployed curve.
      - Fabricating MMT table entries when the body is unread.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-d11575.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-490c76.yaml
    curve_audit_readme: analysis/binstd-curve-audit/README.md
    curve_audit_certify: analysis/binstd-curve-audit/subfield_certify.py
    curve_audit_params: analysis/binstd-curve-audit/binary-curve-params.txt
    curve_audit_certificate: analysis/binstd-curve-audit/audit-certificate.txt
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    optional_code_refs:
      - experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
      - experiments/EXP-BINSTD-0fae5a/implementation/
    cells:
      deployed_arm:
        curves:
          - {name: c2pnb176v1, k: 11, m: 176, s_bits: 161}
          - {name: c2pnb208w1, k: 13, m: 208, s_bits: 193}
          - {name: c2pnb272w1, k: 17, m: 272, s_bits: 257}
          - {name: c2pnb304w1, k: 19, m: 304, s_bits: 289}
          - {name: c2pnb368w1, k: 23, m: 368, s_bits: 353}
        q_subfield: 65536
        empty_lanes: [1, 2, 4, 8, 16]
        live_lanes: [k, 2k, 4k, 8k]
        preregistered_generic_verdict: VOW_WASH_OR_WORSE
        wash_margin_bits: 16
        matched_rho_symmetry: 'negation_and_k_fold_Frobenius (√(2k))'
      toy_arm:
        dk_max: 41
        cells:
          - {d: 4, k_prime: 5}
          - {d: 4, k_prime: 7}
          - {d: 8, k_prime: 5}
          - {d: 2, k_prime: 11}
        even_k_positive_control_required: true
      null_object_prime_degree: 'c2tnb191v1 vs c2pnb176v1; c2tnb239v1 vs c2pnb272w1'
      null_object_uniform_B: 'synthetic F_2^176 with B uniform in F_2^176'
      null_object_koblitz: 'binary Koblitz — m=1 every lane'
      mutant: 'hard-coded m/g table without running level routine'
    seeds:
      master: 20261002
      stage2_targets: [20261002, 20261003]
      split_density: 20261004

  controls:
    - name: ctl_preregistered_predictions_freeze
      stage: 0
      blocking: true
      object: >-
        Preregistered (C1) empty-cell count=25, (C2) m bounds, (C3)
        VOW_WASH_OR_WORSE under generic m=n, wash_margin_bits=16, matched-rho
        formula, dual m/g conventions frozen in
        stage0/preregistered-predictions.json BEFORE any Stage-1 census
        output; never edited afterward.
    - name: ctl_hardcoded_mutant
      stage: 0
      blocking: true
      object: >-
        Hard-coded m/g-table mutant must FAIL the Stage-0 audit (detected as
        playback without level-routine work product).
    - name: ctl_koblitz_m1
      stage: 0
      blocking: true
      object: >-
        Binary Koblitz fixture: level routine returns m=1 for every base
        field; failure voids all cells (O-INSTRUMENT).
    - name: ctl_c16_baseline
      stage: 1
      blocking: true
      object: >-
        On every real row, c=16 cell returns m=1 and g=1 (baseline embedding).
    - name: ctl_even_k_positive
      stage: 2
      blocking: true
      object: >-
        EVEN-k′ toy cell: conorm-norm / subfield-trace image of an ℓ'-order
        point is NON-trivial. Without this the (C1) check has no possible
        negative.
    - name: ctl_prime_degree_null
      stage: 1
      blocking: true
      object: >-
        Identical code on matched prime-degree ANSI rows yields divisor
        lattice {1,N} and a single hopeless cell; small genus is a bug.
    - name: ctl_uniform_B_null
      stage: 1
      blocking: false
      object: >-
        Synthetic uniform-B curve over F_{2^176}: m equals n in every live
        lane with overwhelming probability (isolates subfield contribution
        to c|16 collapse).
    - name: ctl_stdlib_preferred
      blocking: true
      object: >-
        Prefer stdlib / existing audit arithmetic. Magma/Sage/cypari2 may
        not be provisioned mid-tick (AUXIN forbidden). Missing dependency →
        failed_infrastructure / O-IMPEDIMENT — not math falsification.
    - name: ctl_mmt_diff
      stage: 1
      blocking: false
      object: >-
        When MMT body text is obtainable, place census beside its tables
        cell-by-cell. If unavailable, record O-PROVENANCE open gate; do NOT
        invent MMT numbers. Disagreement with obtained MMT → reconcile
        before calling any cell new.

  independent_variables:
    - curve_name
    - k
    - base_field_degree_c
    - stage  # 0 | 1 | 2
    - control_arm  # koblitz | prime_degree | uniform_B | even_k | mutant
    - seed

  metrics:
    primary:
      - structurally_empty_c_dividing_16_cell_count
      - conjugate_period_per_cell
      - artin_schreier_level_m_per_cell
      - genus_candidates_per_cell
      - transfer_existence_verdict_per_cell
      - charged_time_exponent_per_cell
      - charged_factor_base_memory_entries_per_cell
      - matched_rho_per_row
      - vow_verdict_per_cell  # FASTER | WASH | WORSE
      - toy_conorm_norm_image_order
      - toy_subfield_trace_is_identity
      - stage0_mutant_caught
      - koblitz_m1_pass
      - c16_baseline_m1_pass
    secondary:
      - peak_rss_bytes
      - wall_s
      - level_routine_cpu_s
      - mmt_diff_status  # agreed | disagreed | unavailable
      - provenance_source  # openssl_secondary | ansi_x962_primary
      - termination_reason
      - split_density_empirical  # Stage-2 optional cover arm
      - gtt_d_constant_fit  # Stage-2 optional

  heuristic_under_test: HEUR-BINSTD-d11575-H1

  preregistered_prediction:
    quantity: >-
      structurally_empty_c_dividing_16_cell_count=25; live-lane m in
      [n/2+1,n]; under generic m=n the c=4k lane is the time-minimiser with
      nominal time advantage 2^{0.9}..2^{12.3} uncharged, and
      VOW-charged verdict = WASH_OR_WORSE on every row; FB memory ≥2^{38.5}
      (176) .. ≥2^{80.5} (368); Koblitz and c=16 baselines m=1; toy
      conorm-norm image order = 1 on odd-k′ c|d cells.
    formula: >-
      (C1) conjugate period = 16/gcd(c,16); for c|16 the subfield-trace
      Tr=∑ π_q^r annihilates the prime subgroup (λ^k=1, λ≠1).
      (C2) m = least j with (u+1)^j β = 0, β=B^{2^{15}}, u=α↦α^{2^{c mod 16}};
      ker(u+1)^{n/2}=F_{2^8} and B∉F_{2^8} ⇒ m ≥ n/2+1.
      (C3) GTTD time q^{2-2/g} at g=2^{m-1}; matched rho 0.886√ℓ/√(2k);
      VOW charges FB memory q^{1-1/g}; wash if |log2(ratio)| < 16 OR
      charged constant ≥ margin.
    source: >-
      IDEA-20260922-d11575 claims (C1)/(C2)/(C3); HEUR-BINSTD-d11575-H0/H1/H2;
      analysis/binstd-curve-audit substrate.
    claim_tier: certificate_plus_toy_observational_plus_cost_model_table
    measured_vs_modeled: >-
      Period, m, toy image orders, RSS, and (optional) split densities are
      MEASURED. GTTD/Enge–Gaudry times and VOW comparisons are MODELED from
      named formulas with recalled constants — never mixed in one column.
      Preregistered predictions written before Stage-1 census outputs; never
      tuned afterward.

  scale_relevance:
    tier: crypto
    justification: >-
      Stage-1 census is certificate/cost arithmetic at the five deployed
      ANSI composite-degree rows (not an attack). Stage-2 controls are toy
      (dk≤41) and do not transfer attack cost to deployed N.
    correspondence: null

  tail_checks:
    - >-
      Extreme: any live cell with period n and m < n/2+1 is O-REFUTE-C2.
    - >-
      Extreme: m=3 at n=4 or m=5 at n=8 on a deployed row → O-LOW-M-MOVE;
      escalate with charged table, do not silently absorb as WASH.
    - >-
      Extreme toy: non-trivial conorm-norm image on odd-k′ c|d → O-REFUTE-C1.
    - >-
      Koblitz or c=16 m≠1 → O-INSTRUMENT; void table.

  optimistic_assumptions:
    - assumption: >-
        Pure-Python F_{2^16} level computations for all 5×9/10 cells finish
        in seconds within the advisory budget.
      bias_direction: >-
        May understate wall time; budget abort → O-IMPEDIMENT with measured
        CPU, never math falsification of (C1)/(C2).
    - assumption: >-
        GTTD constant ≤ g!·polylog; margins <2^16 labelled WASH so the
        optimistic reading cannot manufacture a win on c2pnb176v1.
      bias_direction: >-
        Understates true cost of GHS relative to rho; bias AGAINST claiming
        a GHS win (conservative for security, honest for the table).
    - assumption: >-
        OpenSSL secondary parameters agree with ANSI X9.62 on A,B,h,ℓ.
      bias_direction: >-
        Primary mismatch → O-PROVENANCE halt; not treated as (C1)/(C2)
        falsification until provenance is adjudicated.
    - assumption: >-
        Toy cover construction at dk≤41 is feasible for at least the
        subfield-trace half of (C1); full GHS cover construction may be
        optional if subfield-trace check alone is complete.
      bias_direction: >-
        If cover construction fails infra, record O-IMPEDIMENT for that
        sub-arm; subfield-trace identity check remains the primary (C1) toy
        verification.

  memory_accounting: >-
    Peak RSS measured. Dominant structures: F_{2^16} arithmetic tables and
    per-cell census records (tiny). Modeled FB memory q^{1-1/g} is reported
    as analytic entry counts in the cost table column labelled MODELED, never
    as measured RSS. Rho distinguished-point memory charged under the same
    VOW accounting for comparison.

  hidden_overhead_honesty: >-
    GTTD constant ~g! at g=8 (~2^{15.3}) is disclosed and forces WASH on
    margins ≤ that size. Enge–Gaudry o(1) is used only to show n=8/16 lanes
    hopeless by tens of bits. No attack exponent is claimed as new.

  replication:
    seeds: [20261002, 20261003, 20261004]
    independent_instances: 2
    independent_instances_note: >-
      Stage-1 census must be reproducible from the frozen harness (two
      independent process invocations). Stage-2 dual seeds on toy targets.
      Primary certificate metrics must agree across complete_valid seeds.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 20
    maximum_workers: 1

  stopping_rules:
    - >-
      SR-1. Stage-0 preregistered-predictions freeze missing → stop; status invalid.
    - >-
      SR-2. Hard-coded mutant not caught OR Koblitz m≠1 → stop; O-INSTRUMENT.
    - >-
      SR-3. c=16 baseline m≠1 on any real row → stop; O-INSTRUMENT.
    - >-
      SR-4. Live cell with period n and m outside [n/2+1,n] → O-REFUTE-C2;
      do not retune frozen bounds.
    - >-
      SR-5. Toy odd-k′ c|d non-trivial image → O-REFUTE-C1; export certificate.
    - >-
      SR-6. EVEN-k′ positive control fails (image trivial) → O-INSTRUMENT;
      do not read (C1).
    - >-
      SR-7. Advisory budget exhausted → preserve partial artifacts;
      O-IMPEDIMENT with measured quantity; never negative math evidence.
    - >-
      SR-8. Low-m move on a deployed row → complete the charged table, label
      O-LOW-M-MOVE, do not claim break.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Filing STRUCTURALLY EMPTY without period+collapse certificate fields.
    - Claiming break / deployed attack / unconditional curve insecurity.
    - Overwriting a prior RUN-* directory.
    - Editing shared GOAL-ECDLP2M-001.yaml or IDEA claim text.
    - Using Amazon Bedrock.
    - Tuning (C1)/(C2)/(C3) predictions after seeing Stage-1 outputs.
    - Inventing MMT table numbers when the body was not read.
    - Mixing MEASURED and MODELED numbers in one cost-table column.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze + mutant caught + Koblitz m=1; (2)
    structurally_empty_c_dividing_16_cell_count=25 with collapse certificates;
    (3) all twenty live cells report m in [n/2+1,n] (or a recorded
    O-REFUTE-C2/O-LOW-M-MOVE with evidence); (4) c=16 baselines m=1 on all
    five rows; (5) Stage-2 odd-k′ toy image order = 1 AND EVEN-k′ positive
    control non-trivial; (6) cost table emitted with MEASURED/MODELED
    separation and VOW verdicts; (7) no invalidation_rule fired. Primary
    success label O-CENSUS-TABLE (or O-LOW-M-MOVE if a charged row moves).
    This fills the GHS-cover reachability-table column; it does NOT claim an
    ECDLP break.

  falsification_criterion: >-
    ANY of: (F1) non-trivial conorm-norm / subfield-trace image on odd-k′
    c|d toy (O-REFUTE-C1); (F2) live cell period n with m outside bounds
    (O-REFUTE-C2); (F3) Koblitz or c=16 baseline m≠1 while table still read
    (O-INSTRUMENT); (F4) Magma/Sage provisioned as sole path to reported
    certificates; (F5) fabricated MMT numbers. Budget exhaustion and
    MMT-unavailable are NOT falsification of (C1)/(C2).

  required_artifacts:
    - experiments/EXP-BINSTD-ee23dc/implementation/
    - experiments/EXP-BINSTD-ee23dc/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-ee23dc/stage0/mutant-audit.json
    - experiments/EXP-BINSTD-ee23dc/stage0/api-freeze.md
    - experiments/EXP-BINSTD-ee23dc/stage1/census-table.json
    - experiments/EXP-BINSTD-ee23dc/stage1/certificates/
    - experiments/EXP-BINSTD-ee23dc/stage1/cost-table.json
    - experiments/EXP-BINSTD-ee23dc/stage1/mmt-diff.json
    - experiments/EXP-BINSTD-ee23dc/stage2/toy-collapse-report.json
    - experiments/EXP-BINSTD-ee23dc/stage2/controls-report.json
    - experiments/EXP-BINSTD-ee23dc/runs/
    - experiments/EXP-BINSTD-ee23dc/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write stage0/preregistered-predictions.json and api-freeze.md;
          define certificate schema and dual m/g conventions; ZERO success
          cells filed.
      - id: S0-MUTANT-KOBLITZ
        text: >-
          Run hard-coded mutant + Koblitz m=1 fixture; write mutant-audit.json.
      - id: S1-PARAMS
        text: >-
          Re-derive / disclose A,B,h,ℓ provenance for five curves; Hasse /
          Weil checks as in audit.
      - id: S1-CENSUS
        text: >-
          For each (curve,c): period, m (both conventions), g candidates,
          transfer-existence, regime, charged time/memory, matched rho,
          VOW verdict.
      - id: S1-EMPTY-CELLS
        text: >-
          Emit 25 STRUCTURALLY EMPTY certificates for c|16 with collapse
          fields; write certificates/ and census-table.json.
      - id: S1-COST
        text: Write cost-table.json with MEASURED vs MODELED columns.
      - id: S1-MMT
        text: >-
          Diff against MMT when body obtainable; else mmt-diff.json status
          unavailable (O-PROVENANCE open gate).
      - id: S2-TOY
        text: >-
          Toy odd-k′ subfield-trace / conorm-norm checks (expect identity /
          order 1); EVEN-k′ positive control (expect non-trivial).
      - id: S2-NULLS
        text: Record prime-degree / uniform-B / Koblitz control outcomes.
      - id: S2-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; observations only;
          no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-e9839a
  snapshot_task: TASK-20261002-8ad33f

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
