experiment:
  id: EXP-PFDR-e62f8a
  hypothesis_id: H-PFDR-a79efd
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the
    affected data is generated. NOTHING HERE IS A MEASUREMENT.

  title: >-
    The degree-yield trade in windowed addition trees - a fitted window-ratio
    exponent measured at parameters chosen for counting power, a deliberately
    interacting cell where the competing explanation must show itself, and a
    curve-free arm that decides whether the yield half is about elliptic curves at
    all.

  objective: >-
    Measure the yield half of the claimed duality as a FITTED EXPONENT of the
    window ratio rather than as a per-cell count, at parameters chosen so that every
    cell carries at least dozens of events; verify the degree half symbolically at
    three arities in two independent engines; run a deliberately interacting cell
    where the named confounder must produce a different exponent; and run the
    identical yield measurement on a curve-free object of matched cardinalities to
    decide whether the yield law is an elliptic-curve fact or a counting fact.

  inputs:
    counted_yield_arm:
      fields: 'prime fields of about 2 to the 18 and 2 to the 20 with prime-order subgroups'
      arity: 4
      leaf_window: 'B = 2 to the 7'
      internal_window_ratios: '2 to the minus 2, 2 to the minus 4, 2 to the minus 6, 2 to the minus 8'
      windowing_patterns: >-
        S of size 0, 1 and 2, on the four-leaf caterpillar tree and on the balanced
        tree, giving six pattern cells per field per window ratio.
      targets_per_cell: 100000
      power_note: >-
        AT THESE PARAMETERS THE CELLS HAVE COUNTING POWER, WHICH IS WHY THEY WERE
        CHOSEN. At about 2 to the 18 the unwindowed expected count is about 42.7
        decompositions per target, so a single windowed node gives between about
        10.7 and 0.17 per target across the ratio sweep, and two windowed nodes
        give between about 2.7 and 6.5 times 10 to the minus 4 per target - roughly
        10 to the 6 down to 65 events per cell over 10 to the 5 targets. Contrast
        the source idea's own parameters, at which the two-node cell has an
        expected count of about 4 times 10 to the minus 11 per target and is empty
        by construction.
    interacting_cell:
      field: 'a prime field of about 2 to the 12 with the same leaf budget'
      purpose: >-
        THE CONFOUNDER MADE REACHABLE ON PURPOSE. Here the leaf count of about 2 to
        the 28 exceeds the relevant power of the field size of about 2 to the 24, so
        windowing an internal node must also constrain the leaves and the fitted
        exponent must depart from the number of windowed nodes. Without this cell
        the design would only be able to confirm the law, never to see the
        alternative.
    curve_free_arm:
      construction: >-
        A random abelian group of the same order with a random index map compatible
        with the addition structure, of matched cardinalities and matched window
        sizes. NO ELLIPTIC CURVE, NO GROUP LAW ON POINTS AND NO SUMMATION
        POLYNOMIAL appears in its construction.
      quantity: >-
        The identical fitted window-ratio exponent, at every ratio and every
        windowing pattern.
      purpose: >-
        THE BINDING CURVE-FREE NULL. The yield law is claimed by the source idea
        itself to be a counting fact rather than a window property, so it is
        PREDICTED to reproduce here. The consequence of that prediction being right
        is pre-stated in falsification_criterion.
    symbolic_degree_arm:
      arities: [3, 4, 5]
      quantity: >-
        The maximum per-variable degree of the eliminated system with S empty,
        computed symbolically in two engines sharing no code, predicted 4, 8 and 16.
    tree_enumeration_arm:
      scope: 'all binary trees on at most 6 leaves, with all windowing patterns'
      quantity: >-
        The pair of maximum per-variable degree and yield factor per tree, and the
        tree potential defined as the base-p logarithm of the yield factor plus the
        base-2 logarithm of the maximum per-variable degree.
    equidistribution_arm:
      fields: 'prime fields from about 2 to the 18 to about 2 to the 26'
      quantity: >-
        Histogram of internal node values over at least 10 to the 6 random windowed
        pairs, binned into the field size divided by the window size bins, with a
        chi-square against uniform per field size.

  controls:
  - >-
    C-CURVEFREE (BINDING). The curve-free matched-cardinality arm. PREDICTED to
    reproduce the fitted exponent exactly. If it does, the yield law is
    combinatorics and NO STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP MAY BE QUOTED
    FROM THE YIELD HALF, in either direction, and the record must say so in those
    words. Only the degree half may then carry elliptic-curve content.
  - >-
    C-INTERACTING (DYNAMIC RANGE). The deliberately interacting cell. The fitted
    exponent must DEPART from the number of windowed nodes there. If it does not,
    the independence assumption is more robust than expected and that is itself
    reported.
  - >-
    C-UNWINDOWED-BASELINE (BLOCKING). At S empty the counted yield must match the
    closed-form unwindowed count within Poisson error on a frozen fixture, and the
    symbolic degree must be 4, 8 and 16. Failure halts the run before any windowed
    cell is counted.
  - >-
    C-RANDOM-WINDOW. The window is drawn as a random subset of the same cardinality
    rather than as an interval or arithmetic progression. The fitted exponent must
    be IDENTICAL, since the law is a counting fact and not a window property. A
    difference means additive structure in the window is leaking and must be
    reported rather than absorbed.
  - >-
    C-TWO-ENGINE. Every symbolic degree is computed in two engines sharing no code.
    Disagreement voids that value.
  - >-
    C-FIBRE-CORRECTION. The two-torsion and two-to-one x-coordinate fibre correction
    rule is frozen before execution and applied identically to every arm including
    the curve-free arm, where it is applied as the matched cardinality correction.
  - >-
    C-BASELINES-MATCHED. Pollard rho with negation and BSGS on the same instances in
    the same charged unit, mandatory under RQ-ECDLP-002, reported so that no yield
    figure is read as an attack result.

  independent_variables:
  - arm - counted_yield, interacting, curve_free, symbolic_degree, tree_enumeration, equidistribution
  - field size
  - tree shape - caterpillar or balanced, and all trees on at most 6 leaves for the enumeration
  - windowing pattern, S of size 0, 1 or 2
  - internal window ratio, four values
  - window type - interval or random subset

  metrics:
    primary:
    - >-
      fitted_window_exponent, dimensionless, the exponent of the internal window
      ratio in a least-squares fit of the log measured yield against the log window
      ratio, per (field, tree, pattern) cell, with a confidence interval.
    - >-
      max_per_variable_degree, an integer, per arity with S empty and per tree in
      the enumeration.
    - >-
      curve_free_exponent minus elliptic_exponent, dimensionless, per matched cell.
    - >-
      interacting_exponent minus the number of windowed nodes, dimensionless.
    secondary:
    - measured decompositions per target, a count per target, per cell, with its Poisson interval
    - the closed-form predicted yield per cell, in the same units
    - tree potential per tree in the enumeration, dimensionless
    - chi-square of the internal-node-value histogram against uniform, per field size, with its degrees of freedom
    - the most-populated histogram bin against its uniform expectation, in standard deviations
    - the frozen fibre-correction factor applied per cell
    - interval-window against random-window fitted exponents, per cell
    - matched Pollard rho and BSGS charged operations, and BSGS memory in bits
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The fitted exponent of the internal window ratio in the measured yield, and
      the maximum per-variable degree with S empty.
    formula: >-
      fitted_window_exponent equals the number of windowed internal nodes, within
      0.15, at every non-interacting cell. max_per_variable_degree equals 2 raised
      to the largest eliminated subtree height, giving 4, 8 and 16 at arity 3, 4 and
      5 with S empty. curve_free_exponent minus elliptic_exponent equals 0.
      interacting_exponent departs from the node count by more than 0.15.
    source: >-
      The yield form follows from the internal node value being determined by the
      leaves together with equidistribution, which is HEUR-001 and is measured. The
      degree form follows from the recursive resultant construction and is
      re-derived symbolically as the experiment's first gate rather than taken from
      any record. The 0.15 band is a pre-registered threshold sized to the counting
      precision the declared sample gives, not a derived quantity.

  scale_relevance:
    tier: toy
    justification: >-
      Prime fields from about 2 to the 12 to about 2 to the 26, arity 4 for the
      counted arm and at most 5 for the symbolic arm, at most 6 leaves for the tree
      enumeration. The tested scope is exactly those cells and no transfer to
      cryptographic sizes is claimed.
    correspondence: null

  tail_checks:
  - >-
    The most-populated internal-node-value histogram bin is compared against its
    uniform expectation in standard deviations, per field size. A persistent excess
    that grows with field size is a real finding about equidistribution and is
    reported as one rather than absorbed into the yield fit.
  - >-
    The cell with the smallest event count is reported explicitly with its Poisson
    interval, so that a fitted exponent is never quoted without the weakest cell
    that produced it being visible.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    seeds_policy: >-
      One master seed per run recorded in the manifest, from which target draws,
      window placement, random-window construction, curve-free group construction
      and the equidistribution sample are derived by a declared deterministic
      stream. Every draw is reproducible from the master seed and its index. Seeds
      are fixed before execution and never redrawn after an outcome is seen. The
      symbolic degree arm is deterministic and uses no seed; its reproducibility is
      by re-derivation in a second engine.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
  - >-
    SR1 BLOCKING. C-UNWINDOWED-BASELINE runs first - the S empty counted yield must
    match the closed form within Poisson error AND the symbolic degrees must be 4, 8
    and 16 in both engines. Failure halts the run.
  - >-
    SR2. A cell whose expected event count falls below 30 is NOT counted and is
    recorded as out of counting power, with its expected count stated. It is never
    reported as a measured zero.
  - >-
    SR3. C-INTERACTING runs before the headline exponent is reported, so that the
    design's ability to see the alternative is established before its confirmation
    is quoted.
  - >-
    SR4. If a tree with strictly smaller potential than the family constant is
    found in the enumeration, the run STOPS and reports it - that is a positive
    result reopening the family and it ends this contract's scope.
  - >-
    SR5. Budget exhaustion stops the run and reports the cells completed. An
    infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    The two symbolic engines disagree on any degree.
  - >-
    The fibre-correction rule is changed after any count is seen.
  - >-
    The interval window and the random window give materially different fitted
    exponents AND the difference is not reported - a leak of additive window
    structure that is absorbed rather than reported voids the arm.
  - >-
    A cell with fewer than 30 expected events is reported as a measured yield.
  - >-
    The curve-free arm and the elliptic arm are counted under different corrections
    or different target samples.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and
    is NEVER counted as negative mathematical evidence.

  success_criterion: >-
    fitted_window_exponent equal to the number of windowed nodes within 0.15 at
    every non-interacting cell; the interacting cell departing by more than 0.15;
    max_per_variable_degree exactly 4, 8 and 16 in both engines; the tree potential
    near-constant within its declared tolerance across all trees on at most 6
    leaves; and the curve-free comparison reported with its consequence applied.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) fitted_window_exponent departs
    from the number of windowed nodes by more than 0.15 at a non-interacting cell -
    H-PFDR-a79efd S1 is FALSIFIED and the yield half of the duality is wrong as
    stated. (F2) The symbolic degree with S empty is not 4, 8 and 16 - S2 is
    falsified, or the construction differs from the assumed recursive one, and the
    second engine decides which. (F3) Some tree achieves BOTH maximum per-variable
    degree at most 4 AND yield within a constant of the unwindowed mean - the trade
    is not conserved, the interior optimum is better than predicted, and this is a
    POSITIVE result that reopens the family under SR4. (F4) THE CURVE-FREE ARM
    REPRODUCES THE FITTED EXPONENT - and it is predicted to - so the yield law is a
    counting fact about windows and determined values, NOT a fact about elliptic
    curves; nothing derived from the yield half may be quoted as a statement about
    elliptic curves or the ECDLP, and the record must state that in those words.
    (F5) The equidistribution chi-square rejects with a departure growing in field
    size - HEUR-001 is falsified and the closed form loses its stated error term.

  required_artifacts:
  - per-cell measured decompositions per target with Poisson intervals, and the expected count used for the power check
  - per-cell closed-form predicted yield in the same units, with the frozen fibre correction applied
  - fitted_window_exponent per cell with confidence interval and fit residuals
  - the interacting-cell exponent and its departure from the node count
  - curve-free arm exponents per matched cell and the difference from the elliptic arm
  - symbolic maximum per-variable degree per arity, from both engines, with the intermediate resultants
  - the full tree enumeration on at most 6 leaves with the degree, yield factor and potential per tree
  - the observation-collision search result - pairs of distinct trees sharing the same degree and yield pair
  - internal-node-value histograms and chi-square per field size, with the most-populated bin in standard deviations
  - interval-window against random-window exponent comparison
  - matched Pollard rho and BSGS charged operations, and BSGS memory in bits
  - command, environment, seeds, engine names and versions, and resource measurements

  limitations:
  - >-
    THE SOURCE IDEA'S YIELD ARM WAS EMPTY BY CONSTRUCTION AND THE PARAMETERS WERE
    CHANGED. At its stated parameters the two-windowed-node cell at arity 4 has an
    expected count of about 4 times 10 to the minus 11 decompositions per target, so
    its prediction of a yield "zero to within Poisson noise" is satisfied by any
    pipeline including a broken one. The re-parameterisation and the shift to a
    fitted exponent are recorded in H-PFDR-a79efd band_non_degeneracy.
  - >-
    THE YIELD HALF IS PREDICTED TO BE CURVE-FREE. If C-CURVEFREE reproduces the
    exponent, half of this contract's content is combinatorics and carries no
    elliptic-curve claim. The consequence is pre-stated in F4 so that neither
    outcome can be read after the fact.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The interior optimum
    at group size the square root of the arity is only nontrivial from about arity 9
    upward. Counting decompositions of windowed nine-tuples is outside any budget
    this program has, so the interior optimum is verified SYMBOLICALLY ONLY, as a
    statement about degrees, and its yield half at that arity is not measured here
    or by any reachable experiment. The record does not shrink the claim to the
    arities it can reach; it states which half of it is unmeasured.
  - >-
    SCOPE. Binary addition trees with windowed internal nodes, and solvers whose
    reach degrades with degree. A solver insensitive to degree escapes the trade
    entirely; none is known to this program, which is a statement about this
    program.
  - >-
    THE NEARBY OBJECT MATTERS AND IS RECORDED. In genus-two index calculus the same
    degree growth and the same yield law hold and index calculus nevertheless wins,
    because the base field is smaller. So the law alone does not close prime fields,
    and the missing ingredient is the subfield. An argument concluding otherwise
    would have proved too much.
  - >-
    Two-torsion and the two-to-one fibre inflate raw counts. The correction is frozen
    before execution; a correction chosen after seeing counts would be fitting.
  - >-
    Toy scale throughout. No exponent moves and no attack is claimed.

  assigned_to: executor
  approved_by: null
