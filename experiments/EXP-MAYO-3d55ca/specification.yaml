experiment:
  id: EXP-MAYO-3d55ca
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MAYO-c0ddab
  question_id: RQ-MAYO-001
  goal_id: GOAL-MAYO-001
  title: >-
    IMPLEMENTATION-CLASS: the vinegar-reuse leak staircase in a toy
    MAYO-shaped signer -- measure min(k(N-1), o) against a fresh-vinegar
    matched null, a planted-true-oil positive control, and a graded
    shared-block sweep, with forgery as the certificate

  objective: >-
    IF this contract is later approved, frozen and separately authorized,
    measure at toy scale how much of the underlying oil space O is exposed by N
    signatures that share a vinegar, and at what N a certified recovery
    completes -- against the pre-derived forced staircase min(k(N-1), o) and the
    forced count N* = 1 + ceil(o/k). The deliverable is a NUMBER that bounds
    what MAYO's randomness discipline must guarantee, which is the second horn
    of GOAL-MAYO-001's first completion criterion.

  class_separation_notice: >-
    FILED AS IMPLEMENTATION CLASS, per GOAL-MAYO-001's next_action: 'proposals
    that attack the implementation must be filed as a separate class from
    proposals that attack the map; do not let a fault result be scored as a
    break of the mathematics.' No outcome of this contract is evidence for or
    against any statement about the whipped map, the underlying MQ problem, or
    MAYO's mathematical security, and no outcome of EXP-MAYO-ccc272 is evidence
    about anything here. Any evidence record derived from this contract must
    carry this paragraph.

  what_this_is_not:
    - Not a break of MAYO's mathematics and not evidence about the hardness of any MQ problem.
    - Not a fault-injection experiment; no fault is injected and no hardware or real implementation is touched.
    - Not a claim that any deployed MAYO implementation can be made to repeat a vinegar.
    - Not an evaluation of any countermeasure, and not a recommendation.
    - Not a cost, exponent, or cryptographic-scale claim; the quantity produced is a signature count on the data axis.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    TOY for every measured number. A future run would be limited to q = 16,
    m in {4, 6}, o in {2, 3}, k in {2, 3, 4}, n in {6, 8}, the declared N sweep,
    the declared shared-block counts, two signer solution rules, and the declared
    seeds. The DIFFERENCE IDENTITY (s - s' lies in O^k under a shared vinegar) is
    exact at any size and is tiered as derivation; the measured rates and
    probabilities are toy and transfer to nothing. AGENTS.md rule 7 applies
    without exception.

  stage_order_and_termination:
    stage_0_reading:
      cost: "no compute"
      purpose: >-
        Obtain the MAYO Round-3 specification and quote verbatim the signing
        procedure, the vinegar derivation (randomised, deterministic from the
        message, or hybrid), and the signature encoding (whether all k blocks of
        s are exposed). Same source-preference order and logging discipline as
        EXP-MAYO-ccc272 Stage 0.
      can_terminate: >-
        Yes. If the signature does not expose s blockwise, the route as designed
        does not exist and the run stops with that finding. If the vinegar is
        derived deterministically from the message, the threat model NARROWS to
        induced repetition and the narrowing must be written into the contract's
        scope before Stage 2 rather than discovered afterwards.
    stage_1_algebra:
      cost: "no compute"
      purpose: >-
        Re-derive the difference identity and the forced count against the quoted
        procedure; recompute the q-binomial spanning probability
        prod_{i=0}^{o-1}(1 - q^{i-j}) for every (o, j) in the sweep; compute the
        oil-test false-positive rate q^{-m} per test for every cell.
      can_terminate: "Yes, if the identity does not survive the quoted procedure."
    stage_2_toy_end_to_end:
      cost: "seconds to minutes per cell"
      purpose: build toy signers, run the four arms, recover, certify, forge.
      can_terminate: "Yes, on any control failure (see invalidation_rules)."

  inputs:
    field: "GF(16), characteristic 2, F_2[z]/(z^4 + z + 1)"
    field_self_test: >-
      Required before any measurement: order of z is 15, and exp[log[a]] = a for
      all a in 1..15. Recorded in the artifacts.
    m_values: [4, 6]
    o_values: [2, 3]
    k_values: [2, 3, 4]
    n_values: [6, 8]
    design_constraint: >-
      Only cells with k*o >= m are built (MAYO's own signing inequality). The
      sweep deliberately covers BOTH k >= o (where N* = 2) and k < o (where
      N* > 2), so the formula N* = 1 + ceil(o/k) is tested rather than only its
      easy branch.
    N_sweep: [2, 3, 4, 5, 6, 8]
    shared_block_counts_j: [0, 1, 2, 3, 4]
    solver_rules: [fixed_right_inverse, kernel_randomised]
    instances_per_cell: 50
    master_seed: 20260805
    domain: "EXP-MAYO-3d55ca/v1"
    seed_derivation_rule: >-
      All randomness derives from SHA-256 over the ASCII byte string
      domain || "|" || label || "|" || decimal(m) || "|" || decimal(o) || "|" ||
      decimal(k) || "|" || decimal(n) || "|" || decimal(instance) || "|" ||
      decimal(counter), digests read big-endian unsigned, GF(16) elements taken
      as successive 4-bit nibbles most-significant-first. Labels: "oil-basis",
      "P-coeffs", "emul", "vinegar", "digest", "solver-kernel", "challenge".
      The vinegar stream is drawn ONCE per (instance, arm) and REUSED verbatim
      across the N signing calls in the reuse arms -- that reuse is the
      independent variable and is implemented by seed control, not by a fault.
    deterministic_construction:
      underlying_map_and_oil_space: >-
        Identical construction to EXP-MAYO-ccc272: draw an o-dimensional O,
        draw m alternating bilinear forms, correct them to vanish on O x O.
        Record rejection counts; a non-solvable correction is a
        CONSTRUCTION_FAILURE and is reported, never reseeded silently.
      emulsifier: >-
        Spec-shaped (powers of the companion matrix of an irreducible degree-m
        polynomial) so that the signing linear system is generically solvable.
        The emulsifier is NOT an independent variable here; its only role is to
        make the signer work, and any cell in which signing fails for a majority
        of digests is reported as a construction problem rather than a result.
      signer: >-
        For digest t: expand the vinegar v from "vinegar", form the linear map
        L = P*'(v, .) restricted to O^k, and solve L x = t - P*(v). Under
        fixed_right_inverse, the particular solution is L^+ (t - P*(v)) for a
        right inverse computed once per (instance, vinegar) by a declared
        pivoting order and cached. Under kernel_randomised, a uniform element of
        ker L is added, drawn from "solver-kernel". If L is not surjective for a
        given v, the signer resamples the DIGEST, never the vinegar, and the
        resample count is recorded.
      recovery: >-
        Form the N-1 differences against the first signature; split each into k
        blocks; test each block d for membership in the oil space by checking
        P(d) = 0 and P'(d, d_prev) = 0 against previously accepted blocks; take
        the F_q-span of accepted blocks; report its dimension; when the
        dimension reaches o, emit the span as the candidate oil space W.
      certification: >-
        A SEPARATE code path, which must not call the recovery routine or reuse
        its intermediate state, checks (a) P(w) = 0 for every basis vector of W
        and P'(w, w') = 0 for every basis pair, re-evaluating the public map from
        its stored coefficients; and (b) THE STRONG CERTIFICATE: sign 10 fresh
        challenge digests drawn from "challenge" using only W and the public map,
        and verify each with the ordinary verification routine. A certificate
        failure makes the run invalid_measurement, never a negative observation
        (docs/claims-and-verification.md).

  arms_and_controls:
    treatment: >-
      FULL REUSE: all k vinegar blocks identical across the N signing calls,
      N sweeping the declared list, both solver rules, 50 instances per cell.
    measured_null: >-
      FRESH VINEGAR: a new vinegar for every signing call, everything else
      identical -- same instance, same digests, same solver rule, same recovery
      code, same acceptance test. FORCED VALUE DERIVED PRE-RUN: recovered oil
      dimension EXACTLY 0, with each block projection failing the oil test except
      at the computed rate of about q^{-m} per test (16^{-4} = 1.5e-5 at m = 4,
      16^{-6} = 6e-8 at m = 6 -- RECOMPUTED IN THE RUN, and note that the m = 4
      cells are the ones where an accidental pass is actually reachable across
      thousands of tests, which is exactly why the rate is reported and not
      assumed negligible). THIS NULL CAN FAIL LOUDLY and its failure invalidates
      the whole study.
    positive_control: >-
      PLANTED TRUE OIL: hand the certification and forging code the TRUE oil
      space O directly, bypassing recovery entirely. The certificate must pass
      and 10/10 forgeries must verify, in 20/20 planted trials. This separates
      'the certifier and forger work' from 'the leak works', so a failure is
      localised instead of leaving a bare negative. If it fails, NO NEGATIVE
      RESULT FROM ANY ARM MAY BE REPORTED.
    graded_control: >-
      PARTIAL REUSE: exactly j of the k vinegar blocks shared across signing
      calls, j sweeping [0, 1, 2, 3, 4] and capped at k per cell, with j = 0
      coinciding with the matched null. At least three interior points per cell
      with k >= 4. Predicted N*(j) = 1 + ceil(o/j), monotone non-increasing in j.
      A flat graded arm means the shared-block count is not what drives the leak
      and the mechanism is misidentified.
    baseline_embedding_control: >-
      k = 1 cells (plain-UOV shape with o >= m), where the classical nonce-reuse
      statement gives N* = o + 1 exactly. The instrument must reproduce it. A
      method that cannot reproduce the classical baseline has not been shown to
      measure anything.
    ordering_control: >-
      Generate, evaluate and HASH-COMMIT the fresh-vinegar null, the
      planted-true-oil positive control, and the decision rule's output on both,
      BEFORE any reuse arm is computed or inspected. Absence of that commitment
      is invalid_measurement.
    comparability_policy: >-
      Comparison is permitted only within a cell at identical
      (q, m, o, k, n, solver rule). Comparison to real MAYO parameters, to
      EXP-MAYO-ccc272, or to any external fault-attack report is FORBIDDEN in
      this contract; the relayed reports in RQ-MAYO-001 are unread secondary
      sources and are not a comparator.

  metrics:
    primary:
      - Recovered span dimension as a function of N per (cell, arm, solver rule), against the forced staircase min(k(N-1), o).
      - Smallest N at which a CERTIFIED recovery completes, against the forced count N* = 1 + ceil(o/k).
      - Forgery verification rate on fresh challenge digests (the strong certificate).
      - Recovered oil dimension in the fresh-vinegar null arm (forced value 0).
    secondary:
      - Certificate (annihilation) pass rate, reported separately from the forgery rate.
      - Recomputed q-binomial spanning probability per (o, j) and the observed success rate against it.
      - Recomputed oil-test false-positive rate q^{-m} per cell and the observed accidental-pass count.
      - The graded N*(j) table with monotonicity stated.
      - The k = 1 baseline-embedding outcome (predicted N* = o + 1).
      - Digest-resample counts, construction rejection counts, and any cell where signing failed.

  preregistered_prediction:
    quantity: >-
      The recovered span dimension as a function of N, and the smallest N with a
      certified recovery.
    formula: >-
      dim span = min(k (N - 1), o); smallest certified N = N* = 1 + ceil(o / k);
      success probability at j = k(N-1) collected vectors =
      prod_{i=0}^{o-1} (1 - q^{i - j}); null arm dimension = 0 with per-test
      false-positive rate q^{-m}; graded N*(j) = 1 + ceil(o / j).
    source: >-
      DERIVED in H-MAYO-c0ddab's mechanism and IDEA-20260805-19990a: with a
      shared vinegar, s - s' = x - x' lies in O^k because O^k is a subspace, so
      each of the k blocks lies in O. No external theorem is cited. The
      q-binomial spanning probability is elementary and is RECOMPUTED in the run
      rather than quoted from any record.

  scale_relevance:
    tier: toy
    justification: >-
      The difference identity is exact at every size and transfers as ALGEBRA;
      the measured rates, probabilities and counts are toy and transfer to
      nothing. The forced count N* = 1 + ceil(o/k) is a derivation whose value at
      real parameters can be computed but not measured here, and any statement
      about real MAYO parameter sets must be labelled derivation-conditional on
      the RECALLED parameter table until Stage 0 replaces it.
    correspondence: null

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 50
    interpretation: >-
      50 instances per cell per seed gives a sampling resolution of 2 percent on
      each rate, which is stated here so that no rate is reported to a precision
      the sample cannot support.

  budget:
    maximum_runs: 3
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3
    maximum_memory_gb: 2
    maximum_workers: 1
    no_network_after_stage_0: true

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized.
    - Stop at Stage 0 if the signature encoding does not expose s blockwise.
    - Stop immediately if the fresh-vinegar null recovers any oil vector.
    - Stop immediately if the planted-true-oil positive control fails to certify or to forge.
    - Stop before any reuse arm if the null-and-positive-control commitment is absent.
    - Stop on any budget breach and report it as a budget outcome, not a result.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any reuse-arm number computed or inspected before the null and positive-control commitment.
    - A certificate produced by code that shares state with the recovery routine.
    - A forged signature verified by anything other than the ordinary verification routine.
    - Any cell in which the vinegar was resampled rather than the digest, since that silently converts a reuse arm into a fresh arm.
    - Any use of floating point in a field, rank, or kernel computation.
    - Any presentation of a result here as bearing on the whipped map's mathematical security.

  infrastructure_failure_disposition: >-
    A timeout, crash, memory exhaustion, missing dependency, or failure to
    retrieve the specification is INFRASTRUCTURE SIGNAL and is NEVER negative
    mathematical evidence (AGENTS.md rule 5). A signer that cannot sign because
    the linear system is not surjective is a CONSTRUCTION outcome, reported with
    its rate, and never evidence about the leak. The container was checked on
    2026-08-05: numpy 2.4.6 present; sympy, galois and Sage absent. All field
    arithmetic is hand-rolled; a request for a computer-algebra system is an
    infrastructure request, not an experiment.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is a complete readout in which: the
    fresh-vinegar null returns recovered dimension 0 at every cell; the
    planted-true-oil positive control certifies and forges 20/20; the k = 1
    baseline embedding reproduces N* = o + 1; the graded arm is monotone in j;
    and, for every cell, the measured span staircase and the smallest certified
    N are reported against their forced values WITH the forgery certificate
    attached. The criterion is satisfied by whatever the numbers are, under
    working controls -- not by confirming the prediction. That disposition
    establishes no break, no cost, no exponent, no crypto-scale claim, and
    nothing whatever about the whipped map.

  falsification_criterion: >-
    H-MAYO-c0ddab is falsified if the measured span dimension falls below
    min(k(N-1), o) beyond the stated sampling tolerance (HEUR-MAYO-VIN-1
    refuted -- report the measured law), or if a certified recovery completes at
    N < N* (the forced count is wrong in the direction that matters most for a
    security requirement), or if Stage 0 shows the signature does not expose s
    blockwise (the route as designed does not exist). A control failure --
    nonzero null recovery, or a failed planted positive control -- falsifies
    nothing and permits NO negative report at all.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Stage 0 retrieval log with every source, endpoint, status, and any quotation obtained.
    - Stage 1 derivation note with the recomputed q-binomial probabilities and false-positive rates.
    - Field self-test output and construction rejection counts.
    - Null-and-positive-control commitment hash, timestamped before any reuse arm.
    - Raw per-instance records: vinegar hash, digests, signatures, block acceptance decisions, span dimension per N, canonical and sorted-key.
    - Certificates: the annihilation check and the 10 forged signatures per successful recovery, with the verifier's independent code path identified by file and commit.
    - Manifest, environment, exact command, git commit and dirty-tree state, stdout, stderr, resource measurements.
    - Snapshot archive followed by independent validation and red-team review before any evidence record is written.

  approval_requirements:
    - Independent review confirms the class separation, the control set, and the certificate independence.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - Execution is separately authorized after the approved frozen package is delivered.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
