experiment:
  id: EXP-SDITH-7cdf9b
  hypothesis_id: H-SDITH-2b546d
  derived_from_idea: IDEA-20260805-bf6448
  question_id: RQ-SDITH-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact-rational MPCitH forgery-cost evaluator - the interior optimum of the two-strategy cost
    function against its naive endpoint bound, with a tau = 1 null, a p = 0 null, a 47.52-bit
    positive control, two graded axes reporting tau* alongside the slack, and an ordering rule that
    commits every control before any specification parameter is read
  objective: >-
    The one uncertainty a run reduces is whether this program can answer the grinding half of
    GOAL-SDITH-001's objective by computation rather than by trusting a specification it has not
    read. A run establishes (i) that an exact-rational evaluator of
    min over tau' of [1/P_1(tau', tau, p) + N^(tau - tau')] passes a null with no interior point
    available, a second null where first-phase cheating is impossible, and a positive control where
    the interior optimum is unmistakable; (ii) the slack and the optimal split tau* across two
    graded axes against pre-registered values; and (iii) IF a specification is obtained, the exact
    difference between its transcribed claimed forgery security and the interior optimum at its own
    (tau, N, p), together with a verbatim quotation of its soundness statement classified by
    quantifier order. The run produces no forged signature and claims no break at any tier.
  what_this_is_not:
  - >-
    Not a forgery, not a break, not an attack, and not a claim about any deployed signature scheme's
    security. Under docs/claims-and-verification.md nothing here may be reported as a break at any
    tier, because no certificate a verifier could re-check is produced.
  - >-
    Not a novel attack. The two-strategy forgery optimisation is believed standard and the parent
    proposal says so in its own claim field. The instrument is what is new to this corpus.
  - >-
    Not a statement about syndrome-decoding hardness, about the seed-tree or VOLE machinery, or about
    within-repetition strategy mixing, all of which are deliberately excluded.
  - >-
    Not a statement about SDitH at all unless a specification is obtained and transcribed with a page
    reference. A failed fetch is infrastructure signal and leaves the illustrative grid standing alone.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
    been executed under this contract.
  claim_ceiling:
    tier: derivation_plus_transcription
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed (tau, N, p) cells, the stated cost function's exact
      interior optimum takes stated values in bits, its argmin tau* takes stated values, and the ratio
      to the naive endpoint bound takes stated values; and, if a specification is obtained, its
      transcribed claimed forgery security differs from the interior optimum at its own parameters by a
      stated number of bits, at the exact parameter version read, with its date. WHAT DOES NOT FOLLOW -
      no statement that the scheme's forgery security is correct or incorrect overall; no statement
      about any other MPCitH scheme's parameters; no break; and specifically NOT that the computed
      minimum is the TRUE forgery cost, which additionally requires discharging HEUR-SDITH-BF6-3.
  inputs:
    procedure: >-
      STAGE 0, reading, no compute, MAY FAIL - obtain an SDitH specification; transcribe tau, N, p and
      the claimed forgery security with a page reference; quote the soundness statement VERBATIM and
      classify its quantifier order as the correct FOR-ALL-adversaries form or the defective
      EXISTS-tau'-first form. Separately, obtain a primary source for the forgery cost function and
      check the recalled formula against it. Record whether the construction shares randomness across
      repetitions, which decides whether the binomial model applies at all. Either fetch may fail; a
      failure is infrastructure signal, never mathematical evidence, and the remaining stages run
      regardless on the illustrative grid.
      STAGE 1, milliseconds, RUN AND COMMITTED BEFORE ANY SPECIFICATION PARAMETER IS EVALUATED - the
      tau = 1 null, the p = 0 null, the positive control at (64, 2, 1/2), and both graded sweeps, all
      in exact rational arithmetic with a float recomputation alongside.
      STAGE 2, milliseconds, ONLY IF STAGE 0 SUCCEEDED - evaluate the interior optimum at the
      transcribed (tau, N, p); report the slack, tau*, and the difference against the claimed security.
      STAGE 3, pen and paper - the quantifier-order classification, and the within-repetition mixing
      check - can a forger do better by cheating partially inside a repetition than by the
      across-repetition split? Report the argument, or report that it could not be discharged and
      relabel every computed cost as an UPPER bound with that direction attached.
    instrument: >-
      Python standard library only - fractions and math. All binomial tails and all minimisations in
      exact Fraction arithmetic with no floating point anywhere in the decision path. A float
      recomputation is reported alongside purely as an integrity comparison, since binomial tails at
      tau = 64 with p = 1/256 underflow double precision and a float implementation would silently
      return the wrong tau*. Recorded through harness/runner.py.
    parameters: >-
      Graded axis one - tau in {1, 2, 4, 8, 16, 32} at N = 256, p = 1/256, with the additional points
      tau in {48, 64} for the ratio band. Graded axis two - N in {2, 32, 256} at p = 1/N across
      tau in [2, 64]. Nulls - tau = 1 at both (256, 1/256) and (2, 1/2); and p = 0 at every N in the
      axis. Positive control - (tau, N, p) = (64, 2, 1/2). Float-versus-exact disagreement tolerance
      1e-9 in log2. SDitH's own (tau, N, p) evaluated only if Stage 0 transcribes them.
  controls:
  - >-
    NULL OBJECT OF THE SAME SHAPE, tau = 1 - same code path, same formula, no interior point available.
    FORCED VALUE slack at most 0, computed in the parent proposal as -0.01 at (256, 1/256) and -0.58 at
    (2, 1/2). It CAN FAIL, and the ways it fails are specific and known - an off-by-one in the tail
    sum's lower limit, or dropping the additive +1 terms, both produce a positive number here.
  - >-
    SECOND NULL, p = 0 - no first-phase cheating is possible, P_1 is zero for every tau' >= 1, only
    tau' = 0 is admissible, and the cost is forced to exactly 1 + N^tau with slack exactly 0 against the
    naive bound tau log2 N. This separates "grinding exists" from "grinding helps".
  - >-
    POSITIVE CONTROL, THE EFFECT MUST APPEAR - (tau, N, p) = (64, 2, 1/2), forced 47.52 bits of slack, a
    regime chosen so the interior optimum is unmistakable. If the instrument does not fire here, nothing
    it says about any specification is admissible.
  - >-
    GRADED CONTROL ONE, six points, monotonicity reported - tau in {1, 2, 4, 8, 16, 32} at N = 256,
    p = 1/256, with pre-registered slack values -0.01, 7.41, 15.78, 31.98, 69.22, 140.59 and
    pre-registered tau* values 0, 1, 2, 4, 9, 18. Reporting tau* alongside the slack is what makes the
    control diagnostic - a slack that grows while tau* stays pinned at an endpoint means the minimisation
    is not exploring the interior, which a slack-only report would hide.
  - >-
    GRADED CONTROL TWO, second axis - N in {2, 32, 256} at p = 1/N. The direction of the N-dependence,
    more erosion at smaller N, is derived from the binomial multiplicity and is an INDEPENDENT prediction
    of the same mechanism, so agreeing on the tau axis while disagreeing on the N axis localises the
    error to the multiplicity term.
  - >-
    ORDERING CONTROL, blocking - the two nulls, the positive control and both graded sweeps are run and
    committed BEFORE any specification parameter is read or evaluated, so no threshold can be adjusted
    once the claimed number is known.
  - >-
    EXACTNESS CONTROL - all tail sums in Fraction arithmetic, with a float recomputation reported
    alongside; any disagreement above 1e-9 in the log2 is an integrity failure and the run is void.
  independent_variables:
  - number of parallel repetitions tau
  - number of parties per repetition N
  - first-phase cheating probability p
  - the strategy split tau', over which the cost is minimised
  metrics:
    primary:
    - >-
      exact_cost_bits per cell - log2 of the exact rational
      min over tau' of [1/P_1(tau', tau, p) + N^(tau - tau')], in bits, computed without floating point.
    - >-
      tau_star per cell - the argmin over tau' in {0..tau}, an integer, reported alongside every cost.
    - >-
      slack_bits per cell - the naive endpoint bound min(tau log2(1/p), tau log2 N) minus
      exact_cost_bits, in bits.
    - >-
      ratio_true_over_naive per cell - exact_cost_bits divided by the naive endpoint bound in bits,
      dimensionless.
    - >-
      tau_star_fraction per cell - tau_star / tau, dimensionless.
    - >-
      spec_gap_bits - the transcribed claimed forgery security minus exact_cost_bits at the transcribed
      (tau, N, p), in bits. Reported only if Stage 0 succeeded; otherwise recorded as
      unavailable_failed_fetch.
    secondary:
    - >-
      the full cost curve over tau' at each cell, so the interior shape is visible rather than only its
      minimum.
    - >-
      float-versus-exact disagreement in log2 per cell, dimensionless. Forced below 1e-9.
    - >-
      monotonicity verdicts, pass or fail per adjacent pair, on both graded axes.
    - >-
      the verbatim quotation of the specification's soundness statement with a page reference, and its
      quantifier-order classification; or a recorded failed fetch with the exact attempt.
    - >-
      whether the construction shares randomness across repetitions, which decides HEUR-SDITH-BF6-2.
    - >-
      the within-repetition mixing check with its argument, or an explicit statement that it could not be
      discharged.
  heuristic_under_test: HEUR-SDITH-BF6-2
  preregistered_prediction:
    quantity: >-
      slack_bits and tau_star across both graded axes; the ratio band at p = 1/N; and spec_gap_bits.
    formula: >-
      slack_bits at tau = 1 is at most 0 - forced, since no interior point exists. slack_bits at
      (64, 2, 1/2) is 47.52 within 0.05. slack_bits across tau in {1, 2, 4, 8, 16, 32} at N = 256,
      p = 1/256 is -0.01, 7.41, 15.78, 31.98, 69.22, 140.59 within 0.05 each, with tau* equal to
      0, 1, 2, 4, 9, 18. ratio_true_over_naive at p = 1/N and N = 256 lies inside [0.44, 0.54] for
      tau in [2, 64] and decreases in tau. tau_star_fraction is at least 0.5 at every cell with p = 1/N,
      with a larger excess at N = 2 than at N = 256. spec_gap_bits is predicted within 2 bits of zero;
      a value above +10 bits is a forgery-cost finding and a value below -10 bits is a conservative
      specification, both reported with equal weight.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-bf6448, whose mechanism records these values as
      EXACT RATIONAL EVALUATIONS of the stated cost function performed during ideation - derivations from
      a formula, not measurements of any scheme. The cost function itself is RECALLED-UNVERIFIED and
      Stage 0 exists to check it. Never tuned to data.
  scale_relevance:
    tier: exact
    justification: >-
      There is no scale gap in the arithmetic - the cost function is evaluated exactly at the parameters
      of interest, including at a deployed parameter set if one is transcribed, because the computation is
      a finite minimisation over tau + 1 exact rationals and costs milliseconds at any tau. The gap is
      entirely EVIDENTIARY rather than computational - whether the recalled cost function is the one the
      specification's analysis uses, and whether the repetitions are independent. Those are resolved by
      reading a document, not by running larger. That inversion is why the contract's ordering rule and
      its source check carry the weight that sample size carries elsewhere.
    correspondence: null
  tail_checks:
  - >-
    Report the cost at tau' = tau*-1 and tau' = tau*+1 at every cell, so a minimum sitting at a plateau or
    at a discretisation boundary is visible rather than reported as a sharp interior optimum.
  - >-
    Report the largest tau cell's tail sum P_1 as an exact rational with its denominator's bit length, since
    that is where a float implementation silently fails and the exactness claim must be demonstrable.
  - >-
    Report both endpoint costs alongside the interior minimum at every cell, so the "strictly below both"
    claim is checkable per cell rather than asserted in aggregate.
  - >-
    Report the ratio band's extremes over tau in [2, 64], not only the sampled tau values, since the band
    claim quantifies over the whole range.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.05
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
  - >-
    HALT and report if either null fails - a positive slack at tau = 1, or any nonzero slack at p = 0. The
    implementation is wrong and every other number is void.
  - >-
    HALT if the positive control at (64, 2, 1/2) returns under 20 bits. The instrument cannot detect
    grinding slack and no negative about any specification may be reported.
  - >-
    HALT if any float-versus-exact disagreement exceeds 1e-9 in log2. The exactness guarantee has failed.
  - >-
    Stage 0 fetch failures do not stop the run. They are recorded verbatim as infrastructure outcomes and
    Stage 2 is skipped with spec_gap_bits recorded as unavailable_failed_fetch.
  - >-
    Stop at the declared grid. No cell is added after any number is seen, and no pre-registered value is
    revised.
  invalidation_rules:
  - >-
    A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative
    mathematical evidence (AGENTS.md rule 5). A failed specification fetch is likewise infrastructure and
    never evidence about the scheme.
  - >-
    A run that evaluates any specification parameter BEFORE the nulls, the positive control and both graded
    sweeps are committed is invalid_measurement - the ordering rule is the only defence against a threshold
    adjusted to a known answer.
  - >-
    A run using floating-point arithmetic anywhere in the decision path is completed_invalid, regardless of
    its numbers.
  - >-
    A run reporting slack without tau* is invalid_measurement, because the diagnostic the graded control
    exists to provide was not produced.
  - >-
    A run reporting any number about SDitH without a page reference and a parameter-version date is
    completed_invalid.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new
    contract; it is never a repair of this one.
  success_criterion: >-
    The instrument is validated, and the audit is complete to the extent Stage 0 permits, when ALL of the
    following hold, each decidable from the primary metrics -
    (1) slack_bits at tau = 1 is at most 0 at both null cells;
    (2) slack_bits at p = 0 is exactly 0 at every N;
    (3) slack_bits at (64, 2, 1/2) is at least 47.47;
    (4) both graded sweeps match their pre-registered slack values within 0.05 bits and their pre-registered
    tau* values exactly, with monotonicity passing at every adjacent pair;
    (5) ratio_true_over_naive lies inside [0.44, 0.54] at p = 1/N, N = 256, over tau in [2, 64], and
    tau_star_fraction is at least 0.5 at every p = 1/N cell with a larger excess at N = 2;
    (6) every float-versus-exact disagreement is below 1e-9 in log2.
    If Stage 0 additionally succeeded, spec_gap_bits is reported with its page reference, its
    parameter-version date, and the quantifier-order classification. If Stage 0 failed, the run is still
    successful as an instrument and reports NO statement about SDitH.
  falsification_criterion:
  - >-
    Positive slack at tau = 1, or nonzero slack at p = 0. The implementation is wrong; every number is void.
    Infrastructure signal, not a mathematical negative.
  - >-
    The positive control returns under 20 bits. The instrument has no detection power and no negative about
    any specification may be reported.
  - >-
    A graded sweep is non-monotone, or misses a pre-registered slack by more than 0.05 bits, or returns a
    tau* different from the pre-registered one. The error localises to a specific cell.
  - >-
    ratio_true_over_naive falls outside [0.44, 0.54] anywhere at p = 1/N, N = 256, tau in [2, 64], or
    tau_star_fraction falls below 0.5 at any p = 1/N cell, while both nulls and the positive control pass.
    The "half the exponent" structural account is FALSE at the tested grid - a genuine negative for the
    hypothesis's structural claim, with the exact arithmetic still standing.
  - >-
    Stage 0 establishes that the recalled cost function is not the one in use, or that the repetitions share
    randomness. HEUR-SDITH-BF6-1 or HEUR-SDITH-BF6-2 is falsified; every number is withdrawn and recomputed,
    and reporting that IS the finding.
  - >-
    spec_gap_bits exceeds +10 bits. The "no slack" prediction is falsified. This routes to independent
    review at the highest available tier before any description, and the within-repetition mixing check must
    be discharged before the number is trusted in either direction.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying the full cost curve over tau' at every cell as exact rationals, not only the minima
  - the two nulls, the positive control and both graded sweeps, committed BEFORE any specification parameter, with their commit order demonstrable
  - the float-versus-exact comparison per cell
  - the verbatim soundness-statement quotation with page reference and quantifier-order classification, or a recorded failed fetch with the exact attempt and its error
  - the transcribed (tau, N, p), the claimed forgery security, and the parameter-version date, or an explicit unavailable_failed_fetch
  - the within-repetition mixing check with its argument, or an explicit statement that it could not be discharged and that all costs are therefore upper bounds
  - the pre-registration text, written before the first evaluation and hashed
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT approved;
    approved_by is null and execution_authorized is false. Approval is the user's gate because it authorizes
    execution and spends compute, even where the compute is negligible.
  - >-
    Approval should confirm the escalation route in advance - a spec_gap_bits above +10 bits is a
    forgery-cost finding and must go to independent review before any description, and that route should be
    named before the number exists rather than after.
  - >-
    Whether Stage 0's fetch is permitted from this environment, and by what means, must be settled before
    approval. If it is not permitted, the contract still runs and simply produces no statement about SDitH -
    approval should be given with that reduced deliverable in view.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-bf6448
    authored_at: '2026-08-25'
    note: >-
      The cost function, the two nulls, the positive control at 47.52 bits, both graded axes with their
      pre-registered slack and tau* values, the ratio band, the ordering control and the exactness control are
      taken from the parent proposal's mechanism, predictions and minimal_test, restated as measurable
      quantities with units. Every numeric value is carried as a PRE-REGISTERED PREDICTION derived from the
      stated formula during ideation, never as a measurement. Boilerplate identical across contracts by
      program rule comes from the fixed table. Budgets follow the parent's declared low implementation and
      negligible compute.
  derivation_gaps:
  - >-
    The cost function is RECALLED-UNVERIFIED and is the dominant confounder. Every number in this contract is
    a consequence of a formula written from memory. If the real formula differs - for instance if the
    grinding cost is 1/P_1 raised to some power, or the two phases are not independent - every pre-registered
    value is void and must be recomputed. The contract keeps the numbers as consequences of a stated formula
    rather than as facts about any scheme, but the exposure remains.
  - >-
    HEUR-SDITH-BF6-3 (no better strategy) has no support at all. Until the within-repetition mixing check is
    discharged, every computed cost is an UPPER bound on the forger's cost, and a specification matching it
    exactly could still be optimistic. The contract requires that direction to be attached to every
    comparison, but it does not resolve it.
  - >-
    Whether the environment can obtain a specification at all is unknown, and the goal record already carries
    a pause condition anticipating that it may not. The contract is written so the instrument half is
    deliverable regardless, which caps the expected value at instrument-plus-illustrative-grid.
  - >-
    Hash-budget double counting is disclosed but not resolved. The grinding cost and the generic hash
    security are separate additive budgets and a specification's headline number is presumably a minimum over
    both. Reporting the grinding number alone as "the security" would be an error in this contract's own
    direction, and the contract requires them reported separately without settling how the specification
    combines them.
  - >-
    The parent proposal's tau = 17 illustrative operating point (naive 136 bits, interior 64.02, tau* = 9) is
    a SHAPE chosen to span plausible MPCitH regimes and is explicitly not represented as SDitH's. It is
    excluded from the graded axes here so it cannot be mistaken for a parameter set.
