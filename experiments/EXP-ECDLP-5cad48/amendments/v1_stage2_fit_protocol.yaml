protocol_amendment:
  experiment_id: EXP-ECDLP-5cad48
  version_from: 1
  version_to: 1
  amendment_id: v1_stage2_fit_protocol
  recorded_at: '2026-09-07'
  recorded_by_task: TASK-20260907-8e3f0c
  reason: >-
    DEC-20260907-5d9375 held H3 as an estimator-error
    observation and ranked a later eight-prime decay-fit
    protocol. The fit_of_a stub in v1_stage2_protocol is
    incomplete for execution. This amendment freezes the
    missing fit-observation fields. It does not authorize
    the fit. It does not classify W. H3 does not license
    this fit.
  predecessor_path: experiments/EXP-ECDLP-5cad48/amendments/v1_stage2_h3_authorized.yaml
  predecessor_sha256: 72c815160bbd013372a14dbf31c417a1ae60179fdb7ac7042021c4e85f9b2fab
  scientific_parameters_changed: true
  preregistered_prediction_changed: true
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_decision: DEC-20260907-d5e7bc
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06. Filing the
    protocol text is not the execution completeness check.
    The fit remains unauthorized until a later Coordinator
    decision sets fit_of_a_execution_authorized true.
  execution_authorized_stages_remain: [0, 1, 2]
  H3_execution_authorized: true
  H3_executed: true
  fit_of_a_execution_authorized: false
  fit_of_a: false
  SMALL_W_or_LARGE_W: false
  exp_a98ea9_stage5_authorized: false
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    N_max: 65539
    n_curves_per_prime: 1
    correspondence: null
    note: >-
      Stage 2 froze the first rt_exp_1.curves_near curve
      only. This package does not add a second or third
      curve. Three-curve spread is a later amendment.

  incomplete_predecessor_stub:
    path: experiments/EXP-ECDLP-5cad48/amendments/v1_stage2_protocol.yaml
    field: fit_of_a
    missing:
      - cartesian eight-prime observation package
      - response-variable rule for negative W_jack
      - H2 threshold
      - null-subtraction formula
      - H3-gated resolvable-effect formula
      - log-log regression specification
      - eight-prime representation rule after exclusions
      - producer prohibition on classification
      - refuse-until-authorized

  executable_package: eight_prime_fit_observation
  run_id: RUN-ECDLP-5cad48-S2FIT
  data_sources:
    stage2_sampled_W:
      run_id: RUN-ECDLP-5cad48-S2
      n_pairs: 1000000
      n_groups: 20
      fields_used: [W_plugin, W_jack, min_q, M_eff, dstar_plugin, M_delta_plugin]
    stage1_exact_W:
      run_id: RUN-ECDLP-5cad48-S1
      arms: [floor(Mx/p), x mod M, sha, shuffle, P2]
    h3_error:
      run_id: RUN-ECDLP-5cad48-S2H3
      n_draws: 200
      n_pairs: 10000000
      role: >-
        Estimator-error gate only. H3 does not classify W,
        does not fit a, and does not by itself authorize
        this package.

  cells:
    - {id: S2-P523, p: 523, a: 2, b: 6, N: 523, M_grid: [5, 8, 12]}
    - {id: S2-P1033, p: 1033, a: 0, b: 5, N: 1087, M_grid: [6, 10, 16]}
    - {id: S2-P2063, p: 2063, a: 1, b: 5, N: 2129, M_grid: [7, 13, 21]}
    - {id: S2-P4111, p: 4111, a: 1, b: 8, N: 4177, M_grid: [8, 16, 28]}
    - {id: S2-P8219, p: 8219, a: 1, b: 1, N: 8117, M_grid: [9, 20, 37]}
    - {id: S2-P16417, p: 16417, a: 0, b: 5, N: 16447, M_grid: [11, 25, 49]}
    - {id: S2-P32779, p: 32779, a: 3, b: 5, N: 32909, M_grid: [13, 32, 64]}
    - {id: S2-P65539, p: 65539, a: 0, b: 11, N: 65287, M_grid: [16, 40, 84]}
  cartesian: every listed cell, every listed M, every listed arm from RUN-ECDLP-5cad48-S2
  eight_prime_rule: >-
    Fitting a requires all eight frozen primes in the Stage 2
    table. Two, three, or seven primes are not a fit. A later
    exclusion may drop a (cell, M, arm) under H2 or
    non-positive W. If after exclusions a covered family has
    fewer than eight primes represented, classification_eligible
    is false. A prime is never dropped to improve a fit.

  arms:
    covered:
      - floor(Mx/p)
      - x mod M
      - quadratic_character
    null:
      - sha
      - shuffle
    known_large_control:
      - P2
    sensitivity_control:
      - planted_theta

  response:
    primary: W_plugin
    why_not_W_jack: >-
      Stage 2 recorded negative jackknife W on some larger-prime
      cells. That is an estimator observation, not instrument
      failure, and not a SMALL-W or LARGE-W reading. A log-log
      fit cannot take log of a negative W_jack. W_plugin is the
      primary response. W_jack is reported beside it.
    nonpositive_W_plugin: >-
      A (cell, M, arm) with W_plugin <= 0 is excluded from that
      arm's log-log regression and counted. It is not a
      SMALL-W datum.

  H2_bucket_weight:
    source: Stage 2 min_q
    c_0: 0.25
    fail_when: M * min_q < 0.25
    on_fail: >-
      Exclude that (cell, M, arm) from the a-fit. Report it
      separately. Do not silently average it in.

  null_subtraction:
    formula: W_rel = W_plugin(arm) - W_plugin(sha) at the same (cell, M)
    shuffle_companion: W_plugin(arm) - W_plugin(shuffle) is reported, not the primary subtractor
    nonpositive_W_rel: >-
      W_rel <= 0 is "no measured excess" at that cell. It is
      excluded from the null-subtracted log-log and counted.
      It is not by itself SMALL-W.

  H3_gate:
    statement: >-
      IDEA-20260904-f7d47d H3. Absolute jackknife bias below
      one quarter of the smallest effect this fit must
      resolve. The threshold is a formula, not a number read
      from the H3 table after the fact.
    n_pairs_stage2: 1000000
    W_multinomial: (M - 1) / n_pairs_stage2
    scale: max(W_exact, W_multinomial)
    fail_when: >-
      For any covered arm on any H3 cell, |mean_bias_jack| +
      2 * se_bias_jack >= 0.25 * scale, or the 99th percentile
      of |bias_jack| >= 0.25 * scale.
    on_fail: classification_eligible = false
    does_not_license_the_fit: >-
      A passing H3 gate on two primes at n=1e7 does not prove
      n=1e6 sampled W is adequate on the six larger primes.
      That mismatch is disclosed. Official SMALL-W or LARGE-W
      stays false on the producer regardless.

  regression:
    unconstrained: log(W_plugin) = c + a * log(M) + b * log(p)
    constrained_Weil: log(W_plugin) = c + a * log(M) - 0.5 * log(p)
    null_subtracted: same two models on W_rel where W_rel > 0
    interval: leave-one-prime-out jackknife over the eight primes
    fitted_separately: each covered arm
    also_fit: sha, shuffle, P2, planted_theta as controls, not as covered a
    seed: 20260803

  classification_eligible: >-
    true only if the H3 gate passes, every covered family
    still represents all eight primes after exclusions, P2
    W_plugin exceeds sha W_plugin by a factor of at least 10
    at every prime where both are positive, and planted_theta
    W_plugin exceeds sha W_plugin at three or more primes.
    Eligibility is a gate, not a SMALL-W or LARGE-W reading.

  producer_must:
    - Record â, b̂, and leave-one-prime intervals per arm and model
    - Record H2 failures, non-positive W_plugin, non-positive W_rel
    - Record H3_gate pass/fail without classifying W
    - Set SMALL_W_or_LARGE_W false
    - Set fit_of_a false
    - Set classification_eligible to the frozen gate
    - Refuse if this amendment is not later authorized
  producer_must_not:
    - Classify W as SMALL-W or LARGE-W
    - Fit a from a proper subset of the eight primes
    - Drop a prime to improve a fit
    - Take log of negative W_jack as the primary response
    - Authorize Stage 5 of EXP-ECDLP-a98ea9
    - Change H-ECDLP-07c7c6

  later_classification_rule_not_applied_by_producer:
    SMALL_W: >-
      A later Coordinator decision may read SMALL-W only if
      classification_eligible is true and the 95 percent
      leave-one-prime interval for a lies entirely below 1/2
      and the interval for b lies entirely below -0.4, for
      both floor(Mx/p) and x mod M, after null subtraction.
    LARGE_W: >-
      A later Coordinator decision may read LARGE-W only if
      classification_eligible is true and, for either covered
      residue arm after null subtraction, the interval for a
      lies entirely above 1/2 or the interval for b contains 0,
      and both null arms decay in p.
    STRADDLE: interval contains 1/2 or -0.4
    this_filing_does_not_apply_that_rule: true

  proof_search_map:
    cited_from: ledger/proposals/IDEA-20260904-f7d47d.yaml
    bottleneck: Lemma 5 passage from delta to max_c pi_c, quantified as W
    baseline_reproduction: >-
      Stage 0 already reproduced the KN-FIND-ffe1df fixture
      digits. This package does not re-run Stage 0. It consumes
      the recorded Stage 2 / H3 tables.
    observation_collision: >-
      P2 is the nearby object whose G is known not 1+o(1).
      A pipeline reporting small W on P2 has proved too much.
    quantifier_order: >-
      FOR ALL covered filters and declared M, THERE EXIST C, a
      such that FOR ALL sampled ladder primes, W <= C M^a p^{-1/2}.
      The tested quantity is a, not existence of a law.
    method_ceiling: >-
      Toy, first curve only, N <= 65539, n=1e6 sampled W,
      exact W only on two primes. Cannot certify levels >= 2,
      uncovered families, or cryptographic M = p^{1/3}.
    not_applicable_reason: null

  metrics:
    primary:
      - â and b̂ per covered arm, unconstrained and constrained
      - leave-one-prime 95 percent intervals
      - classification_eligible
      - H3_gate pass/fail
    secondary:
      - H2 failure list
      - non-positive W_plugin and W_rel counts
      - control-arm â, b̂
      - 1 + sqrt(W_plugin / min_q) as the CS bound proxy
  controls:
    - SHA-256 truncated to M
    - matched-marginal shuffle
    - P2 known-large nearby-object
    - planted_theta sensitivity
    - H3 error distribution on the two smallest cells
  stopping_rules:
    - Refuse until fit_of_a_execution_authorized is true
    - Timeout or crash is failed_infrastructure, never negative mathematical evidence
    - Certificate kind none
  invalidation_rules:
    - Fitting a from fewer than eight recorded primes
    - Classifying W as SMALL-W or LARGE-W in the producer
    - Using H3 bias as a SMALL-W or LARGE-W disposition
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9
    - Changing H-ECDLP-07c7c6
    - Taking log of negative W_jack as the primary response
  success_criterion: >-
    The observation package exists: every covered arm records
    â, b̂, intervals, H2/H3/exclusion counts, and
    classification_eligible. Certificate kind none.
    SMALL_W_or_LARGE_W is false. Success is the package, not
    a decay claim.
  falsification_criterion: >-
    A producer classification, a subset fit, or a missing
    eight-prime table. H3 bias exceeding the frozen gate
    makes classification_eligible false; that is an estimator
    observation, not a mathematical refutation of H1.
  required_artifacts:
    - runs/RUN-ECDLP-5cad48-S2FIT/raw-result.json
    - runs/RUN-ECDLP-5cad48-S2FIT/manifest.yaml
    - execution-report-fit.yaml
  budget:
    wall_clock_seconds_per_run: null
    memory_gb: 2
    maximum_runs: 1
  does_not:
    - Classify W as SMALL-W or LARGE-W
    - License a decay claim from H3
    - Authorize Stage 5 of EXP-ECDLP-a98ea9
    - Change H-ECDLP-07c7c6 or H-ECDLP-2ade73 status
    - Add a second or third curve per prime
    - Re-run the eight-prime ladder at n=1e7
