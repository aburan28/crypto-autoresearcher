why_this_amendment: >
  DEC-20260907-789d4c recorded one S2CS aligned miss on S2-P8219 at M=9
  floor(Mx/p). The named residual was a consume-only re-derivation of
  that row from the Stage 2 label definition, not from the S2G producer.
  This amendment files that residual. It does not re-run the eight-prime
  ladder, does not import stage2_exact.py, and does not classify W.
