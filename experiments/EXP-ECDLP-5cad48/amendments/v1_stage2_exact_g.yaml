  approval_decision: DEC-20260907-62afc8
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06. Filing the
    protocol text is not the execution completeness check.
    The measurement remains unauthorized until a later
    Coordinator decision sets exact_g_execution_authorized true.
  execution_authorized_stages_remain: [0, 1, 2]
  H3_execution_authorized: true
  H3_executed: true
  fit_of_a_execution_authorized: true
  fit_of_a: false
  SMALL_W_or_LARGE_W: false
  exact_g_execution_authorized: false
  cs_bound_official_supported: false
  exp_a98ea9_stage5_authorized: false
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    cells:
      - S2-P523
      - S2-P1033
      - S2-P2063
      - S2-P4111
      - S2-P8219
      - S2-P16417
      - S2-P32779
      - S2-P65539
    n_curves_per_prime: 1
    correspondence: null
    note: >-
      First rt_exp_1.curves_near curve only. Same cells and
      M grids as archived Stage 2. Largest N is 65287, the
      Stage 0 fixture size. No second or third curve.

  executable_package: stage2_exact_g
  run_id: RUN-ECDLP-5cad48-S2G

  eight_prime_ladder:
    source: analysis/o2-sum-compatible-filters/rt_exp_1.py targets
    provenance: internal
    values: [523, 1033, 2063, 4111, 8219, 16417, 32779, 65539]
    curve_selection: >-
      First prime-order Weierstrass curve returned by
      rt_exp_1.curves_near(target, want=1) at each target.
      Remaining curves on those targets are not cells.
    cells:
      - {id: S2-P523, p: 523, a: 2, b: 6, N: 523, M_grid: [5, 8, 12]}
      - {id: S2-P1033, p: 1033, a: 0, b: 5, N: 1087, M_grid: [6, 10, 16]}
      - {id: S2-P2063, p: 2063, a: 1, b: 5, N: 2129, M_grid: [7, 13, 21]}
      - {id: S2-P4111, p: 4111, a: 1, b: 8, N: 4177, M_grid: [8, 16, 28]}
      - {id: S2-P8219, p: 8219, a: 1, b: 1, N: 8117, M_grid: [9, 20, 37]}
      - {id: S2-P16417, p: 16417, a: 0, b: 5, N: 16447, M_grid: [11, 25, 49]}
      - {id: S2-P32779, p: 32779, a: 3, b: 5, N: 32909, M_grid: [13, 32, 64]}
      - {id: S2-P65539, p: 65539, a: 0, b: 11, N: 65287, M_grid: [16, 40, 84]}

  required_arms:
    - floor(Mx/p)
    - x mod M
    - sha
    - shuffle
    - P2
    - quadratic_character
    - planted_theta

  required_fields_per_arm:
    - G_exact
    - M_delta_exact
    - W_exact
    - min_q
    - cs_bound_exact

  exact_method: >-
    Whole-group enumeration via dlog_table plus the Stage 1
    FFT bucket_stats. No plug-in. No jackknife. No sampled W.

  overlap_controls:
    stage1:
      cells: [S2-P523, S2-P1033]
      arms: [floor(Mx/p), x mod M, sha, shuffle, P2]
      source: experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S1/raw-result.json
      note: >-
        S2-P523 matches S1-P523 and S2-P1033 matches S1-P1033.
        Shared-arm exact fields must match archived Stage 1.
    stage0:
      cell: S2-P65539
      M: 40
      arms: [floor(Mx/p), x mod M, sha, shuffle, P2]
      source: experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S0/raw-result.json
      note: >-
        S2-P65539 at M=40 is the Stage 0 fixture. Shared-arm
        exact fields must match archived Stage 0 G, M_delta,
        W, min_q, and cs_bound.
    fail_when: any overlap field disagrees beyond float identity
    on_fail: producer status invalid, never a W class

  completeness_check:
    required_cells:
      - {id: S2-P523, Ms: [5, 8, 12]}
      - {id: S2-P1033, Ms: [6, 10, 16]}
      - {id: S2-P2063, Ms: [7, 13, 21]}
      - {id: S2-P4111, Ms: [8, 16, 28]}
      - {id: S2-P8219, Ms: [9, 20, 37]}
      - {id: S2-P16417, Ms: [11, 25, 49]}
      - {id: S2-P32779, Ms: [13, 32, 64]}
      - {id: S2-P65539, Ms: [16, 40, 84]}
    required_arms:
      - floor(Mx/p)
      - x mod M
      - sha
      - shuffle
      - P2
      - quadratic_character
      - planted_theta
    n_exact_rows: 168
    fail_when: any required cell, M, arm, or field is missing
    on_fail: producer status invalid, never a W class

  quantities:
    G_exact: M times max pi from whole-group bucket_stats
    M_delta_exact: M times the argmax-delta plug of the same table
    W_exact: relative second-moment sum q (pi_c/delta - 1)^2
    cs_bound_exact: 1 + sqrt(W_exact / min_q)
    note: >-
      These fields enable a later consume-only aligned CS
      audit. This package does not perform that audit and
      does not claim G <= cs_bound or G/M_delta <= cs_bound
      as an official supported bound.

  producer_must:
    - Record G_exact, M_delta_exact, W_exact, min_q, and cs_bound_exact on every required (cell, M, arm)
    - Check overlap against archived Stage 1 five-arm exact fields and Stage 0 fixture M=40
    - Set SMALL_W_or_LARGE_W false
    - Set fit_of_a false
    - Set cs_bound_official_supported false
    - Refuse if this amendment is not later authorized
  producer_must_not:
    - Classify W as SMALL-W or LARGE-W
    - Fit a from any prime set
    - Run a consume-only aligned CS audit as this package
    - Treat P2 near-zero W as instrument failure
    - Treat raw G > cs_bound as a CS falsification
    - Authorize Stage 5 of EXP-ECDLP-a98ea9
    - Change H-ECDLP-07c7c6
    - Sample jackknife W as the primary response

  proof_search_map:
    cited_from: ledger/proposals/IDEA-20260904-f7d47d.yaml
    bottleneck: Lemma 5 passage from delta to max_c pi_c
    baseline_reproduction: >-
      Stage 2 already recorded sampled W on the eight-prime
      table and stores no exact G. Stage 1 already recorded
      exact G on two cells. This package re-uses the Stage 1
      exact method on the Stage 2 cells.
    observation_collision: >-
      P2 is the nearby object whose G is known not 1+o(1).
      Near-zero W on P2 is expected. Overlap with Stage 0
      P2 at S2-P65539 M=40 and Stage 1 P2 at S2-P523 M=5
      is the control that the exact method is the same
      instrument, not a new quantity.
    quantifier_order: >-
      FOR ALL archived Stage 2 (cell, M, arm) rows, the
      exact fields exist. The tested quantity is the
      existence of those fields, not a decay exponent and
      not an official CS bound.
    method_ceiling: >-
      Toy eight-prime first-curve table only. Cannot certify
      levels >= 2, uncovered families, or cryptographic
      M = p^{1/3}.
    not_applicable_reason: null

  metrics:
    primary:
      - G_exact per (cell, M, arm)
      - M_delta_exact per (cell, M, arm)
      - W_exact per (cell, M, arm)
      - n_exact_rows
      - overlap_holds
    secondary:
      - min_q per (cell, M, arm)
      - cs_bound_exact per (cell, M, arm)
  controls:
    - SHA-256 truncated to M
    - matched-marginal shuffle
    - P2 known-large-G nearby object
    - Stage 1 exact-field overlap on two smallest cells
    - Stage 0 fixture overlap on S2-P65539 at M=40
  stopping_rules:
    - Refuse until exact_g_execution_authorized is true
    - Timeout or crash is failed_infrastructure, never negative mathematical evidence
    - Overlap failure is invalid, never a W class
    - Certificate kind none
  invalidation_rules:
    - Classifying W as SMALL-W or LARGE-W in the producer
    - Fitting a
    - Treating raw G > cs_bound as a CS falsification
    - Treating P2 near-zero W as instrument failure
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9
    - Changing H-ECDLP-07c7c6
    - Missing required row or failed overlap
  success_criterion: >-
    The observation package exists: every required
    (cell, M, arm) records G_exact, M_delta_exact, W_exact,
    min_q, and cs_bound_exact. Overlap with Stage 0 and
    Stage 1 holds. Certificate kind none. SMALL_W_or_LARGE_W
    is false. Success is the package, not a bound claim.
  falsification_criterion: >-
    A producer classification, a subset fit, a missing
    required row, or a failed overlap. Those are
    implementation or protocol defects, not a SMALL-W or
    LARGE-W reading.
  required_artifacts:
    - runs/RUN-ECDLP-5cad48-S2G/raw-result.json
    - runs/RUN-ECDLP-5cad48-S2G/manifest.yaml
    - execution-report-s2g.yaml
  budget:
    wall_clock_seconds_per_run: null
    memory_gb: 4
    maximum_runs: 1
  does_not:
    - Classify W as SMALL-W or LARGE-W
    - Fit a
    - Authorize Stage 5 of EXP-ECDLP-a98ea9
    - Change H-ECDLP-07c7c6 or H-ECDLP-2ade73 status
    - Perform a consume-only aligned CS audit
    - Claim an official supported second-moment bound
