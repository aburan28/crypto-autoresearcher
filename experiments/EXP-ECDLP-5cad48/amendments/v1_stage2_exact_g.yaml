    measurement on the archived Stage 2 cells. This amendment
    freezes that measurement. It does not authorize execution.
    It does not classify W. It does not fit a. A later
    consume-only aligned CS audit of the recorded exact fields
    is a successor, not this package.
  predecessor_path: experiments/EXP-ECDLP-5cad48/amendments/v1_stage1_cs_aligned_authorized.yaml
