protocol_amendment:
  experiment_id: EXP-ECDLP-5cad48
  version_from: 1
  version_to: 1
  amendment_id: v1_stage2_protocol
  recorded_at: '2026-09-07'
  recorded_by_task: TASK-20260907-e3f814
  reason: >-
    DEC-20260907-2ff179 held the Stage 1 exactness anchor and
    ranked a Stage 2 protocol amendment only. This amendment
    writes that protocol. It does not authorize Stage 2.
  predecessor_path: experiments/EXP-ECDLP-5cad48/amendments/v1_stage1_authorized.yaml
  predecessor_sha256: 2f47f5ad2c7ade9f122707756ea8328b51370799981e369b8a6beeb3101f87e5
  scientific_parameters_changed: true
  preregistered_prediction_changed: true
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_decision: DEC-20260907-858ca1
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06. Filing the
    protocol text is not the execution completeness check.
    Stage 2 remains unauthorized until a later Coordinator
    decision extends execution_authorized_stages.
  execution_authorized_stages_remain: [0, 1]
  stage2_authorized_by_this_amendment: false
  exp_a98ea9_stage5_authorized: false
  SMALL_W_or_LARGE_W: false
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    N_max: 65539
    correspondence: null

  eight_prime_ladder:
    source: analysis/o2-sum-compatible-filters/rt_exp_1.py targets
    provenance: internal
    values: [523, 1033, 2063, 4111, 8219, 16417, 32779, 65539]
    curve_selection: >-
      First prime-order Weierstrass curve returned by
      rt_exp_1.curves_near(target, want=1) at each target.
      Remaining curves on those targets are not Stage 2 cells.
    cells:
      - {id: S2-P523, p: 523, a: 2, b: 6, N: 523, M_grid: [5, 8, 12]}
      - {id: S2-P1033, p: 1033, a: 0, b: 5, N: 1087, M_grid: [6, 10, 16]}
      - {id: S2-P2063, p: 2063, a: 1, b: 5, N: 2129, M_grid: [7, 13, 21]}
      - {id: S2-P4111, p: 4111, a: 1, b: 8, N: 4177, M_grid: [8, 16, 28]}
      - {id: S2-P8219, p: 8219, a: 1, b: 1, N: 8117, M_grid: [9, 20, 37]}
      - {id: S2-P16417, p: 16417, a: 0, b: 5, N: 16447, M_grid: [11, 25, 49]}
      - {id: S2-P32779, p: 32779, a: 3, b: 5, N: 32909, M_grid: [13, 32, 64]}
      - {id: S2-P65539, p: 65539, a: 0, b: 11, N: 65287, M_grid: [16, 40, 84]}
    M_grid_rule: max(3, round(N^e)) for e in {1/4, 1/3, 2/5}
    note: >-
      S2-P523 and S2-P1033 match Stage 1 cells. S2-P65539 matches
      the Stage 0 fixture curve. Stage 1 exact W is reused, not
      recomputed, as the two-smallest exactness anchor.

  filters_stage2:
    - floor(Mx/p)
    - x mod M
    - sha256(str(int(x))) % M
    - matched-marginal shuffle of floor(Mx/p) labels, seed 20260803
    - P2 dlog-interval (arange(N)*M)//N
    - quadratic_character
    - planted_theta

  quadratic_character:
    definition: >-
      h(O) = 0. If x = 0 then h(P) = 0. Otherwise
      h(P) = (legendre(x, p) + 1) % M, with legendre in {-1, 0, 1}.
    provenance: internal freeze for this amendment

  planted_theta:
    definition: >-
      Base label sha256(str(int(x))) % M. Independently with
      probability theta = p**(-1/9), replace the label by the
      dlog index i % M. Seed 20260803. Matches rt_exp_1
      PLANTED theta=p^-1/9.
    provenance: internal

  exact_W:
    reuse_from_stage1: true
    cells: [S2-P523, S2-P1033]
    note: >-
      Exact whole-group W is Stage 1's job. Stage 2 does not
      re-enumerate N^2 pairs on those cells. Larger primes use
      sampled plug-in W only.

  sampled_W:
    n_pairs: 1000000
    n_groups: 20
    method: delete-group jackknife versus plug-in, same formula as Stage 1
    seed_base: 20260803
    q_c_source: whole-group label vector
    dstar_rule: argmax of plug-in delta on the sample being evaluated
    pair_sampling: two independent uniform dlog indices in 0..N-1
    applied_to: every Stage 2 cell, M, and arm

  H3_200_draw_n_1e7:
    statement: >-
      IDEA-20260904-f7d47d H3. On the two smallest primes only,
      200 independent draws of n=10^7 pairs, jackknife-debiased
      W versus Stage 1 exact W. Absolute bias below one quarter
      of the smallest effect the later fit must resolve.
    cells: [S2-P523, S2-P1033]
    n_pairs: 10000000
    n_draws: 200
    n_groups: 20
    seed_base: 20260803
    not_a_pass_fail_on_the_ladder: >-
      A large H3 bias is an estimator observation. It does not
      classify SMALL-W or LARGE-W and does not by itself
      authorize or forbid a decay fit.
    smallest_resolvable_effect: >-
      Deferred to the fit protocol. Stage 2 records the empirical
      error distribution. It does not invent a threshold number
      here.

  fit_of_a:
    authorized_by_this_amendment: false
    rule: >-
      Fitting a requires all eight primes recorded and a later
      completeness check. Two, three, or seven primes are not a
      fit. Null subtraction and H2 bucket-weight checks are
      part of that later protocol, not this filing.

  metrics:
    primary:
      - W_plugin and W_jack per (cell, M, arm) at n=1e6
      - H3 error distribution on the two smallest cells at n=1e7, 200 draws
    secondary:
      - min_c q_c
      - G and M*delta on the sampled arm
      - wall-clock seconds and peak RSS

  controls:
    - SHA-256 truncated to M
    - matched-marginal shuffle
    - P2 as known-large G; near-zero W is expected
    - quadratic character as a second cheap family
    - planted theta as a known-signal control
    - Stage 1 exact W as the H3 anchor on the two smallest cells

  stopping_rules:
    - Stage 2 is not authorized by this amendment. An executor
      must refuse until execution_authorized_stages contains 2.
    - Timeout or crash is failed_infrastructure, never negative
      mathematical evidence.
    - Certificate kind none. No attack.

  invalidation_rules:
    - Any Stage 2 execution while 2 is not in
      execution_authorized_stages
    - Classifying W as SMALL-W or LARGE-W from a proper subset
      of the eight primes
    - Fitting a from fewer than eight recorded primes
    - Reading P2 near-zero W as instrument failure
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9
    - Changing H-ECDLP-07c7c6

  success_criterion: >-
    When later authorized: every cell records sampled W for
    every (M, arm), H3's 200-draw package exists on the two
    smallest cells, certificate.kind is none, and no W value
    is classified SMALL-W or LARGE-W. Success is the ladder
    package, not a decay claim.

  falsification_criterion: >-
    Stage 2 cannot support or weaken H-ECDLP-2ade73 SMALL-W or
    LARGE-W until a later fit protocol is complete. A large H3
    bias is an estimator observation, not a mathematical
    refutation of H1.

  required_artifacts:
    - raw-result.json with per-cell sampled W and the H3 package
    - run manifest with command, git state, environment, seeds,
      certificate kind none

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1

  does_not:
    - Authorize Stage 2 execution.
    - Authorize Stage 5 of EXP-ECDLP-a98ea9.
    - Change H-ECDLP-07c7c6 or H-ECDLP-2ade73 status.
    - Classify any W as SMALL-W or LARGE-W.
    - Fit a or a p-exponent.
    - Dispatch CAND-D2-A, approve EXP-ECDLP-3930b1, or rerun
      EXP-ECDLP-56ee42.
    - Claim an attack, speedup, novelty, support, or breakthrough.
