  reason: >-
    DEC-20260907-694535 held the Stage 2 sampled-W ladder and
    ranked an H3 completeness check. Completeness
    TASK-20260907-646ac8 found the H3 subsection of
    v1_stage2_protocol incomplete for execution. This
    amendment freezes the missing H3 execution fields. It
    does not authorize H3. Locked counts 200 and 1e7 are
    unchanged.
  predecessor_path: experiments/EXP-ECDLP-5cad48/amendments/v1_stage2_authorized.yaml
  predecessor_sha256: ee0305c656dc3c888f6edc1f4ff40b10e5c34f04dc21b4eccc273b6254d08276
  scientific_parameters_changed: true
  preregistered_prediction_changed: false
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_decision: DEC-20260907-b2fb17
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06. Filing the
    protocol text is not the execution completeness check.
    H3 remains unauthorized until a later Coordinator
    decision sets H3_execution_authorized true.
  execution_authorized_stages_remain: [0, 1, 2]
  H3_execution_authorized: false
  exp_a98ea9_stage5_authorized: false
  SMALL_W_or_LARGE_W: false
  fit_of_a: false
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    N_max: 1087
    correspondence: null

  H3_package:
    statement: >-
      IDEA-20260904-f7d47d H3. On the two smallest Stage 2
      primes, 200 independent draws of n=10^7 pairs,
      jackknife-debiased W versus Stage 1 exact W. A large
      bias is an estimator observation. It does not classify
      SMALL-W or LARGE-W and does not authorize a decay fit.
    run_id: RUN-ECDLP-5cad48-S2H3
    cells:
      - {id: S2-P523, p: 523, a: 2, b: 6, N: 523, M_grid: [5, 8, 12]}
      - {id: S2-P1033, p: 1033, a: 0, b: 5, N: 1087, M_grid: [6, 10, 16]}
    arms:
      - floor(Mx/p)
      - x mod M
      - sha
      - shuffle
      - P2
      - quadratic_character
      - planted_theta
    cartesian: every listed cell, every listed M, every listed arm
    n_pairs: 10000000
    n_draws: 200
    n_groups: 20
    seed_base: 20260803
    exact_W_source: Stage 1 exact W on the matching cell, M, and arm
    exact_W_recomputed: false
    q_c_source: whole-group label vector
    dstar_rule: argmax of plug-in delta on the sample being evaluated
    pair_sampling: two independent uniform dlog indices in 0..N-1
    locked_counts_unchanged: true

  metrics:
    primary:
      - per-draw W_plugin and W_jack
      - per-draw bias versus Stage 1 exact W
      - draw-wise mean and jackknife SE of that bias
    secondary:
      - wall-clock seconds and peak RSS
      - n_draws completed

  controls:
    - Stage 1 exact W is the H3 anchor, not a new exact enumeration
    - P2 near-zero W remains expected, not instrument failure
    - SHA, shuffle, quadratic_character, and planted_theta stay controls

  stopping_rules:
    - H3 is not authorized by this amendment. An executor
      must refuse until H3_execution_authorized is true.
    - Timeout or crash is failed_infrastructure, never negative
      mathematical evidence.
    - Certificate kind none. No attack.
    - Do not reduce n_draws below 200 or n_pairs below 10000000.

  invalidation_rules:
    - Any H3 execution while H3_execution_authorized is false
    - Reducing n_draws below 200 or n_pairs below 10000000
    - Classifying W as SMALL-W or LARGE-W
    - Fitting a
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9
    - Changing H-ECDLP-07c7c6

  success_criterion: >-
    When later authorized: every frozen (cell, M, arm) records
    200 draws of n=1e7 sampled W versus Stage 1 exact W,
    certificate.kind is none, and no W value is classified
    SMALL-W or LARGE-W. Success is the H3 error-distribution
    package, not a decay claim.

  falsification_criterion: >-
    A large H3 bias is an estimator observation, not a
    mathematical refutation of H1 and not a SMALL-W or
    LARGE-W reading.

  required_artifacts:
    - raw-result.json with per-(cell, M, arm) draw table
    - run manifest with command, git state, environment, seeds,
      certificate kind none, H3_executed true only after
      authorization

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    note: >-
      The Stage 2 ladder 7200s budget does not apply. A finite
      7200s cap would set this package up as failed_infrastructure.
      ECC campaign wall-clock remains unlimited. Memory and
      process watchdogs stay machine protection.
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 1

  does_not:
    - Authorize H3 execution.
    - Reduce H3's locked 200 or 1e7.
    - Authorize Stage 5 of EXP-ECDLP-a98ea9.
    - Change H-ECDLP-07c7c6 or H-ECDLP-2ade73 status.
    - Classify any W as SMALL-W or LARGE-W.
    - Fit a or a p-exponent.
    - Dispatch CAND-D2-A, approve EXP-ECDLP-3930b1, or rerun
      EXP-ECDLP-56ee42.
    - Claim an attack, speedup, novelty, support, or breakthrough.
