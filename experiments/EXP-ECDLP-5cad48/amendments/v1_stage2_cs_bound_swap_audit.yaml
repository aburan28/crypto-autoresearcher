why_this_amendment: >
  DEC-20260908-999199 ranked a consume-only cs_bound-swap
  of RUN-ECDLP-5cad48-S2BD. Official S2GX made miss G
  unique among the three holds. Official S2MX recorded
  that miss M_delta flips none of the three holds.
  Those swaps do not record aligned_ratio versus the
  other cell's cs_bound. This amendment files that
  census. It does not rebuild labels, does not classify
  W, and does not fit a. It does not pre-record
  uniqueness flags.
standing_user_authorization: >
  2026-09-06 user direction that ideas and experiments are always
  approved once the protocol is complete. This amendment is not yet
  authorized. Authorization is a later Coordinator decision after
  completeness. Completeness is not user confirmation.
protocol:
  consume_only: true
  consumed_run_id: RUN-ECDLP-5cad48-S2BD
  consumed_path: experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2BD/raw-result.json
  n_source_cells: 4
  miss_role: miss
  hold_roles:
    - same_cell_hold
    - next_tightest_hold
  miss_identity:
    cell: S2-P8219
    M: 9
    arm: floor(Mx/p)
  aligned_ratio_definition: G_exact divided by M_delta_exact
  miss_would_hold_if_this_cs: miss G_exact divided by miss M_delta_exact is less than or equal to hold cs_bound_recorded
  this_would_hold_if_miss_cs: hold G_exact divided by hold M_delta_exact is less than or equal to miss cs_bound_recorded
  n_this_cs_that_would_make_miss_hold: count of holds where miss_would_hold_if_this_cs is true
  n_holds_flipped_by_miss_cs: count of holds that currently hold and this_would_hold_if_miss_cs is false
  uniqueness_flag: miss_cs_flips_only_next_tightest
  uniqueness_definition: n_holds_flipped_by_miss_cs equals 1 and the flipped hold has role next_tightest_hold
  required_outputs:
    - n_holds
    - holds
    - n_this_cs_that_would_make_miss_hold
    - n_holds_flipped_by_miss_cs
    - miss_cs_flips_only_next_tightest
  import_forbidden: []
  no_remeasure: true
  does_not_authorize:
    - Stage 5 of EXP-ECDLP-a98ea9
    - fit of a
    - SMALL_W_or_LARGE_W
    - official bound
    - W class of the S2-P8219 miss
    - W class of a G-swap, M_delta-swap, or cs_bound-swap uniqueness or sharing
    - two_branch_official_disposition
    - S2FIT P2-versus-sha W-ratio gate
  interpretation:
    miss_cs_flips_only_next_tightest_true: miss cs_bound flips only the next-tightest hold among the three official holds, still not a W class
    miss_cs_flips_only_next_tightest_false: miss cs_bound is shared with a same-cell hold or flips none or more than one of the holds, still not a W class
  claim_tier: observation
  certificate_kind: none
  budget:
    wall_clock_seconds: 120
    memory_gb: 1
    maximum_runs: 1
  stopping_rules:
    - consume archived S2BD only
    - timeout is not mathematical evidence
  required_artifacts:
    - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2CX/manifest.yaml
    - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2CX/raw-result.json
    - experiments/EXP-ECDLP-5cad48/execution-report-s2cx.yaml
  inference:
