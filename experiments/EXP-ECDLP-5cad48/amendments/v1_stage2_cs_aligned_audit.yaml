  executable_package: stage2_cs_aligned_audit
  run_id: RUN-ECDLP-5cad48-S2CS
  data_sources:
    stage2_exact_table:
      run_id: RUN-ECDLP-5cad48-S2G
      path: experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2G/raw-result.json
      fields_used: [G_exact, M_delta_exact, W_exact, min_q, cs_bound_exact]
      consume_only: true
      no_remeasure: true

  completeness_check:
    required_cells:
      - id: S2-P523
        Ms: [5, 8, 12]
      - id: S2-P1033
        Ms: [6, 10, 16]
      - id: S2-P2063
        Ms: [7, 13, 21]
      - id: S2-P4111
        Ms: [8, 16, 28]
      - id: S2-P8219
        Ms: [9, 20, 37]
      - id: S2-P16417
        Ms: [11, 25, 49]
      - id: S2-P32779
        Ms: [13, 32, 64]
      - id: S2-P65539
        Ms: [16, 40, 84]
    required_arms:
      - floor(Mx/p)
      - x mod M
      - sha
      - shuffle
      - P2
      - planted_theta
      - quadratic_character
    required_fields_per_arm: [G_exact, M_delta_exact, W_exact, min_q, cs_bound_exact]
    fail_when: any required cell, M, arm, or field is missing
    on_fail: producer status invalid, never a W class

  quantities:
    aligned_ratio: G_exact / M_delta_exact
    recorded_cs_bound: cs_bound_exact as already stored on the arm
    recomputed_cs_bound: 1 + sqrt(W_exact / min_q)
    units_mismatched_comparison: raw G_exact versus cs_bound_exact
    note: >-
      G is M times max pi. cs_bound is the Cauchy-Schwarz
      bound on max_pi/delta. Comparing raw G to cs_bound
      is a units mismatch. The aligned comparison is
      aligned_ratio versus cs_bound.

  hold_rule: >-
    aligned_holds is true on a (cell, M, arm) if and only if
    aligned_ratio <= recorded_cs_bound. The producer
    records this boolean. It does not classify W. It
    does not claim an official supported bound.

  producer_must:
    - Consume only RUN-ECDLP-5cad48-S2G/raw-result.json
    - Record aligned_ratio, recorded_cs_bound, recomputed_cs_bound, and aligned_holds on every required (cell, M, arm)
    - Record the units-mismatched raw G_exact versus cs_bound_exact comparison as mismatched, not as a CS falsification
    - Set SMALL_W_or_LARGE_W false
    - Set fit_of_a false
    - Set cs_bound_official_supported false
    - Refuse if this amendment is not later authorized
  producer_must_not:
    - Classify W as SMALL-W or LARGE-W
    - Fit a from any prime set
    - Re-run Stage 2 or any eight-prime ladder
    - Treat P2 near-zero W as instrument failure
    - Treat raw G > cs_bound as a CS falsification
    - Authorize Stage 5 of EXP-ECDLP-a98ea9
    - Change H-ECDLP-07c7c6

  proof_search_map:
    cited_from: ledger/proposals/IDEA-20260904-f7d47d.yaml
    bottleneck: Lemma 5 passage from delta to max_c pi_c
    baseline_reproduction: >-
      Stage 2 exact-G already recorded exact G, M_delta, W,
      min_q, and cs_bound on the eight-prime seven-arm table.
      This package does not re-run Stage 2. It consumes the
      recorded exact fields.
    observation_collision: >-
      P2 is the nearby object whose G is known not 1+o(1).
      The aligned test is whether G_exact/M_delta_exact
      stays at most cs_bound_exact on that object. A
      pipeline that treats P2 near-zero W as a failed
      nearby-object control has tested the wrong quantity.
      A pipeline that compares raw G to cs_bound has
      mismatched units.
    quantifier_order: >-
      FOR ALL recorded Stage 2 exact (cell, M, arm) rows,
      aligned_ratio <= cs_bound_exact on this archived
      table. The tested quantity is the aligned inequality,
      not a decay exponent.
    method_ceiling: >-
      Toy Stage 2 table only. Eight cells, three M each.
      Cannot certify levels >= 2, uncovered families, or
      cryptographic M = p^{1/3}.
    not_applicable_reason: null

  metrics:
    primary:
      - aligned_ratio per (cell, M, arm)
      - aligned_holds per (cell, M, arm)
      - all_cells_aligned_holds
    secondary:
      - recomputed_cs_bound versus recorded_cs_bound
      - units_mismatched raw G_exact versus cs_bound_exact
  controls:
    - SHA-256 truncated to M
    - matched-marginal shuffle
    - P2 known-large-G nearby object
    - planted_theta
    - quadratic_character
  stopping_rules:
    - Refuse until cs_aligned_audit_execution_authorized is true
    - Timeout or crash is failed_infrastructure, never negative mathematical evidence
    - Certificate kind none
  invalidation_rules:
    - Re-measuring Stage 2 instead of consuming the archived raw-result
    - Classifying W as SMALL-W or LARGE-W in the producer
    - Fitting a
    - Treating raw G > cs_bound as a CS falsification
    - Treating P2 near-zero W as instrument failure
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9
    - Changing H-ECDLP-07c7c6
  success_criterion: >-
    The observation package exists: every required
    (cell, M, arm) records aligned_ratio, both cs_bound
    values, and aligned_holds. Certificate kind none.
    SMALL_W_or_LARGE_W is false. Success is the package,
    not a bound claim.
  falsification_criterion: >-
    A producer classification, a subset fit, a re-measure,
    or a missing required row. An aligned_holds false on
    a row is an observation on this table, not a
    SMALL-W or LARGE-W reading.
  required_artifacts:
    - runs/RUN-ECDLP-5cad48-S2CS/raw-result.json
    - runs/RUN-ECDLP-5cad48-S2CS/manifest.yaml
    - execution-report-s2cs.yaml
  budget:
    wall_clock_seconds_per_run: null
    memory_gb: 1
    maximum_runs: 1
  does_not:
    - Classify W as SMALL-W or LARGE-W
    - Fit a
    - Authorize Stage 5 of EXP-ECDLP-a98ea9
    - Change H-ECDLP-07c7c6 or H-ECDLP-2ade73 status
    - Re-run Stage 2 or the eight-prime ladder
    - Claim an official supported second-moment bound
