experiment:
  id: EXP-PFDR-ccae87
  hypothesis_id: H-PFDR-9c5065
  question_id: RQ-JINV-8fc13a
  idea_id: IDEA-20260901-f375a9
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation. PRIORITY NOTE, recorded here because it governs how the result
    may be described: the triviality derivation this contract measures is ALREADY
    COMMITTED in this corpus as one of the two arguments of H-PAIR-713241, read in
    full by the drafting coordinator on 2026-09-04, and is NOT new. The
    embedding-degree-1 positive control is also already specified there, so THE
    TWO CONTRACTS MUST SHARE THAT FIXTURE RATHER THAN BUILD IT TWICE.
  title: >-
    Confirm that the self-pairing and the automorphism pairing are identically
    trivial above embedding degree 1, on a BLOCKING positive control where a
    nondegenerate self-pairing provably exists and must recover the secret, and
    then test the ONLY live sub-question -- the embedding-degree distribution --
    against matched generic classes at the same prime and against a CURVE-FREE
    sweep, with the power of that comparison COMPUTED before it runs because there
    is exactly one special class per prime.
  claim_ceiling: >-
    A SCOPE STATEMENT. On a fixed curve above embedding degree 1 the delta is
    exactly zero on every axis, which is the expected answer. Its value is that it
    removes an entire route from the lane open list at essentially zero cost, and
    that its one low-probability positive outcome would be a complete break and is
    therefore worth a cheap check.
  claim_tier_basis: >-
    Toy tier, per this question own constraint. The derivations are DERIVATIONS;
    the enumeration verifies the implementation over a finite range, not the
    derivations. Every recovered scalar is certified by code sharing no state with
    the producer.
  objective: >-
    Establish, IN THIS ORDER: (1) that the instrument can DETECT a nondegenerate
    self-pairing, by exhibiting one at embedding degree 1 and recovering the secret
    from the square relation with an independent certificate -- without which every
    triviality report elsewhere is void; (2) that both pairings are identically
    trivial on every enumerated class above embedding degree 1 where the arithmetic
    is affordable, with a COMPUTED-OR-DERIVED FLAG per class so a derived cell is
    never presented as a measured one; (3) the embedding-degree distribution of
    special classes against matched generic classes at the same prime, over
    COMPLETE class enumerations, with the power of the test computed first; and (4)
    the CURVE-FREE sweep, which decides whether any distributional finding is about
    j-invariants at all.
  band_non_degeneracy:
    statistic: >-
      two. (i) the multiplicative order of the reduced self-pairing value; (ii) the
      counts of special and matched generic classes below a declared
      embedding-degree bound.
    null_value: '(i) exactly 1, trivial; (ii) equal counts within the Poisson interval'
    alternative: >-
      (i) a primitive root of unity of full order, which would also be a break;
      (ii) a shift of the special arm toward small embedding degrees
    computed_check: >-
      (i) THE ORDER STATISTIC IS NOT A BAND. It takes the value 1 or the full
      subgroup order and nothing between, so the null and the alternative are the
      two endpoints of the possible range and no tolerance exists to tune. THE
      DEGENERACY RISK IS VACUITY, not width: "the self-pairing is trivial" is an
      unfalsifiable constant unless the SAME instrument is shown to return a
      primitive value where one provably exists, which is why the
      embedding-degree-1 arm is blocking. A SECOND, RELATED DEGENERACY: a curve
      whose pairing is genuinely trivial and a curve whose pairing the
      implementation merely FAILED TO COMPUTE both report 1, which is why the
      computed-or-derived flag is a required metric.
      (ii) THE COUNT COMPARISON HAS A REAL POWER PROBLEM AND IT IS STRUCTURAL:
      there is exactly ONE special class per prime, so the effective sample size is
      the NUMBER OF PRIMES SWEPT and not the number of curves. Pooling over the
      many curves of a class would inflate every sample size by the class size and
      manufacture significance from nothing.
    resolution: >-
      (i) The embedding-degree-1 positive control is BLOCKING and is shared with
      the pairing lane rather than rebuilt. A DECAY PARAMETER is added: the pairing
      is swept over embedding degrees 1, 2, 3 and 4 where classes exist, and the
      predicted SHAPE IS A STEP -- primitive at degree 1 and identically trivial
      above. A quantity that instead decays SMOOTHLY with the embedding degree is
      measuring numerical precision or a wrong final exponentiation, not the
      pairing, and is the canonical artifact tell.
      (ii) STAGE 0 COMPUTES AND REPORTS the minimum detectable shift at the
      declared prime range, with the CLASS as the unit of analysis. If the computed
      power cannot detect the shift of interest, the distribution arm is DECLARED
      UNDERPOWERED IN ADVANCE with the required prime count stated, and no absence
      of difference is claimed from it.
  inputs:
    census_primes: 'a declared range with complete ordinary class enumeration, field sizes up to about 2^24 so the embedding degree is exact'
    curve_free_sweep: >-
      a WIDER declared range of prime and subgroup-order pairs with NO curve
      constructed and NO pairing evaluated, with the class-weighting transfer
      assumption DECLARED rather than assumed
    embedding_bounds: 'THREE values declared in Stage 0 and never adjusted afterwards'
    unit_of_analysis: >-
      THE CLASS, because the embedding degree is a class invariant. Pooling over
      the curves of a class is prohibited.
    exclusions: >-
      classes with full rational torsion at the subgroup order break the cyclicity
      assumption and are EXCLUDED, COUNTED and REPORTED with reasons, never
      silently dropped
  controls:
    - id: CTRL-EMBEDDING-DEGREE-1-POSITIVE
      row_class: positive_control
      blocking: true
      object: >-
        a constructed ordinary curve at embedding degree 1, where the roots of
        unity lie in the base field and a nondegenerate self-pairing provably can
        exist. SHARED WITH THE PAIRING LANE, which already specifies this fixture.
      forced_disposition: >-
        MUST return a value of full multiplicative order AND recover the secret
        from the square relation, certified by an independent on-curve check. THE
        SINGLE MOST IMPORTANT CONTROL IN THE CONTRACT: if the instrument returns a
        trivial value here it cannot detect a nondegenerate self-pairing at all and
        EVERY triviality report elsewhere is void.
    - id: CTRL-MATCHED-GENERIC-NULL
      row_class: null_object
      blocking: true
      object: 'generic-discriminant classes at the SAME prime, through the IDENTICAL code path'
      forced_disposition: >-
        The null object of the same shape required by this question own
        constraints, for BOTH the triviality arm and the distribution arm. Any
        difference between arms must survive passage through one code path.
    - id: CTRL-AUTOMORPHISM-DISCOUNT-AS-NULL
      row_class: honesty
      blocking: true
      object: 'the automorphism pairing on special classes'
      forced_disposition: >-
        Its predicted triviality IS THE STATEMENT that the automorphism -- the
        entire content of the standing discount -- contributes nothing on this
        axis. Reporting it as a FINDING rather than as the NULL would be exactly
        the error this question decision target warns against, and it is labelled
        as the null in advance.
    - id: CTRL-DECAY-PARAMETER
      row_class: instrument
      blocking: true
      object: 'the pairing value swept over embedding degrees 1, 2, 3 and 4 where classes exist'
      forced_disposition: >-
        The predicted shape is a STEP: full order at degree 1, identically trivial
        above. A quantity that decays SMOOTHLY with the embedding degree is
        measuring numerical precision or a misplaced final exponentiation, not the
        pairing.
    - id: CTRL-FINAL-EXPONENTIATION
      row_class: instrument
      blocking: true
      object: 'every reported pairing value'
      forced_disposition: >-
        FORCED: checked to be a root of unity of order dividing the subgroup order
        before it is reported. THIS IS THE DOMINANT IMPLEMENTATION RISK: the
        unreduced pairing is generally nontrivial and only the reduced value is
        forced to 1, so an implementation that omits, misplaces or
        mis-parametrises the final exponentiation would report an APPARENT BREAK.
    - id: CTRL-COMPUTED-OR-DERIVED-FLAG
      row_class: honesty
      blocking: true
      object: 'every class in the triviality arm'
      forced_disposition: >-
        FORCED: each class records whether its pairing was actually COMPUTED or
        merely DERIVED from the argument. A triviality claim on a class whose
        pairing was never evaluated is a DERIVATION and must be labelled one;
        conflating the two would let an implementation failure masquerade as a
        mathematical null, which is the single most likely way this contract could
        be worthless while looking clean.
    - id: CTRL-CURVE-FREE-SWEEP
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL. The identical embedding-degree distribution
        comparison computed from prime and subgroup-order pairs ALONE, with no
        curve constructed and no pairing evaluated, over a wider prime range.
      forced_disposition: >-
        MEASURED AND REPORTED BESIDE THE CURVE ARM. The embedding degree is the
        multiplicative order of the prime modulo the subgroup order and contains no
        curve, so the sweep is EXPECTED to reproduce the curve arm up to the class
        weighting. BLOCKING FOR ATTRIBUTION: when it does, the finding is a
        statement about the joint distribution of the pair under the
        complex-multiplication constraint and NOT about j-invariants acting on
        instances, and no artifact may describe it otherwise. The class-weighting
        transfer assumption is DECLARED.
    - id: CTRL-CERTIFICATE
      row_class: honesty
      blocking: true
      object: 'any recovered scalar'
      forced_disposition: >-
        FORCED: re-verified by code sharing no state with the producer, per this
        question own constraints.
    - id: PARETO-BASELINES
      row_class: pareto_control
      blocking: true
      object: >-
        the generic collision method with distinguished points, the memory-heavy
        generic method, and the automorphism-discounted variant on special classes
      forced_disposition: >-
        MANDATORY matched controls per this question own constraints. NO ADVANTAGE
        IS CLAIMED ON ANY AXIS.
    - id: CTRL-SUPERSINGULAR-SCOPE-REQUEST
      row_class: nearby_object
      blocking: false
      object: >-
        the supersingular curve, where the endomorphism ring is non-commutative,
        distortion maps exist and the modified self-pairing IS nondegenerate -- the
        object on which the hoped-for conclusion FAILS
      forced_disposition: >-
        A method reporting triviality there is not measuring pairings at all. BUT
        supersingular curves are OUTSIDE this question declared scope, so this
        control REQUIRES AN EXPLICIT COORDINATOR SCOPE DECISION. IF REFUSED, the
        embedding-degree-1 ordinary positive control carries the
        instrument-validation load ALONE and the report MUST SAY SO rather than
        presenting an unfalsifiable constant as validated.
  independent_variables:
    - 'prime, across the declared census range and the wider curve-free range'
    - 'class type in {special discriminant, matched generic}'
    - 'embedding degree, as the decay parameter over 1, 2, 3, 4 where classes exist'
    - 'declared embedding-degree bound, at three values fixed in Stage 0'
  metrics:
    primary:
      - 'the reduced self-pairing value per class, reported BY ITS MULTIPLICATIVE ORDER. UNITS: order (integer), required to divide the subgroup order'
      - 'the automorphism pairing per special class, by its order. UNITS: order (integer)'
      - 'the embedding-degree-1 control: the pairing order and the recovered scalar with its certificate. UNITS: order; pass or fail'
      - 'the COMPUTED-OR-DERIVED FLAG and the computed fraction per prime. UNITS: boolean per class; fraction per prime'
      - 'the embedding-degree distribution per arm over the COMPLETE class enumeration, by an exact permutation test over class labels. UNITS: distribution over positive integers'
      - 'counts below each of the three declared bounds, per arm, with Poisson intervals. UNITS: integer counts'
      - 'the CURVE-FREE sweep distribution and counts. UNITS: as above. THE ATTRIBUTION METRIC.'
      - 'the COMPUTED MINIMUM DETECTABLE SHIFT at the declared prime range, with the class as the unit. UNITS: dimensionless. ARCHIVED BEFORE THE COMPARISON RUNS.'
    secondary:
      - 'per class: the prime, the trace, the subgroup order, the cofactor, the discriminant, the conductor, the j-invariant, the automorphism count, the embedding degree, the class size'
      - 'the count of classes excluded for full rational torsion, with reasons'
      - 'the decay sweep over embedding degrees 1 to 4'
      - 'matched generic baseline counts on every toy instance'
      - 'whether the supersingular scope request was granted or refused, and the consequence recorded'
  heuristic_under_test: >-
    HEUR-001 (independence of the embedding degree from the j-invariant, whose
    honest gap is that conditioning on the special discriminant plainly biases the
    joint distribution of the prime and subgroup order somewhat) and HEUR-002
    (pairing-implementation adequacy, stated separately so an implementation
    objection cannot be confused with an objection to the derivation) of
    H-PFDR-9c5065.
  preregistered_prediction:
    quantity: >-
      The pairing orders above embedding degree 1; the automorphism pairing on
      special classes; the embedding-degree-1 control; the decay shape; the
      distribution comparison; the counts below each bound; the computed fraction;
      and the curve-free sweep.
    formula: >-
      Reduced self-pairing order EXACTLY 1 on every enumerated class above
      embedding degree 1, ZERO EXCEPTIONS. Automorphism pairing order EXACTLY 1 on
      every special class. EMBEDDING-DEGREE-1 CONTROL: order equal to the subgroup
      order on at least one control curve, and the secret recovered and certified.
      DECAY SHAPE: a STEP, not a smooth decline. DISTRIBUTION COMPARISON: NO
      DIFFERENCE under an exact permutation test over class labels, with the power
      computed and reported first. COUNTS: equal within the Poisson interval at all
      three declared bounds, with the predicted SHAPE being equality rather than a
      trend. CURVE-FREE SWEEP: measured and reported beside the curve arm with no
      predicted value.
    source: >-
      H-PFDR-9c5065 claims P1, P2, the collapse, the priority statement and the
      curve-free attribution, with predictions P1 to P9. The already-committed form
      of the same derivation, and the embedding-degree-1 fixture, were read in full
      by the drafting coordinator in H-PAIR-713241 on 2026-09-04. FIXED ON
      2026-09-04, BEFORE ANY CELL RUNS, INCLUDING THE THREE BOUNDS AND THE POWER
      COMPUTATION REQUIREMENT.
  scale_relevance:
    tier: toy
    justification: >-
      Field sizes up to about 2^24 for the census, so the embedding degree is exact
      and complete class enumeration is feasible; a wider curve-free sweep for the
      distribution alone, since the embedding degree depends only on the prime and
      the subgroup order. THE TRANSFER ASSUMPTION OF THE WIDER SWEEP -- that it is
      the same population up to the class weighting -- IS DECLARED rather than
      assumed. No transfer to cryptographic scale is claimed or licensed.
    correspondence: >-
      the curve-free sweep is a correspondence of a kind: it computes the same
      class invariant from the pair alone, and its isometry claim is exactly the
      class-weighting statement declared above
  tail_checks:
    - >-
      The SMALLEST observed embedding degree in each arm, and the count below each
      declared bound: the small-embedding tail is where the whole question lives,
      so it is reported IN FULL rather than summarised.
    - >-
      The largest prime divisor of the subgroup order minus one that divides no
      observed embedding degree, per arm.
    - >-
      Every class where the pairing was DERIVED rather than computed, listed, so
      the coverage of the triviality arm is visible and cannot be overstated.
    - >-
      Every class excluded for full rational torsion, listed with its reason.
    - >-
      Any evaluated value whose order does not divide the subgroup order, reported
      individually; it halts the arm.
  replication:
    seeds: ['recorded per curve construction; the census and the sweep are exhaustive and carry no sampling seed']
    independent_instances: 0
    reason: >-
      The census is EXHAUSTIVE over the complete ordinary class enumeration at each
      declared prime, so the reported distribution is a CENSUS and not an estimate
      and there is no sampling replication to perform. The structural limitation is
      the opposite one: there is exactly ONE special class per prime, so the
      effective sample size is the number of primes swept, which is why the power
      computation is blocking.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 150
    maximum_workers: 1
    notes: >-
      The distribution arm needs NO curve construction and NO pairing at all -- the
      embedding degree is one modular order computation per class -- so it can
      sweep far more primes than the triviality arm, which is why the two arms have
      different declared ranges. Extension arithmetic exceeding budget on
      large-embedding-degree classes is an INFRASTRUCTURE outcome under AGENTS.md
      rule 5; those classes are reported as DERIVED and the computed fraction is a
      required metric precisely so this cannot be hidden.
  stages:
    - id: stage-0-derivation-and-power
      purpose: >-
        write the two derivations with the equivariance step explicit; declare the
        three embedding-degree bounds and both prime ranges; COMPUTE AND REPORT the
        minimum detectable shift with the class as the unit; and record the
        priority statement that the derivation is already committed elsewhere in
        this corpus
      blocking: true
    - id: stage-1-positive-control
      purpose: >-
        the embedding-degree-1 curve: a value of full order and the secret
        recovered and certified. SHARED FIXTURE with the pairing lane
      blocking: true
    - id: stage-2-triviality
      purpose: >-
        the complete class enumeration at each census prime: exact embedding degree
        per class; both pairings evaluated where affordable; the computed-or-derived
        flag per class; the decay sweep over embedding degrees 1 to 4
    - id: stage-3-distribution
      purpose: >-
        the exact permutation test over class labels at matched primes, at all
        three declared bounds, reporting per class and never per curve
    - id: stage-4-curve-free-sweep
      purpose: 'the distribution from prime and subgroup-order pairs alone; BLOCKING FOR ATTRIBUTION'
      blocking: true
    - id: stage-5-report
      purpose: >-
        state the closure of the pairing route for this question with its named
        obstruction and forward guidance; state the priority of the derivation; and
        state the attribution granularity from the curve-free sweep
  stopping_rules:
    - >-
      STOP at stage 1 if the embedding-degree-1 control returns a trivial value.
      Every triviality report is void and the run returns to the executor as a
      defect, NEVER as support for the null.
    - >-
      HALT the arm on any evaluated value whose order does not divide the subgroup
      order.
    - >-
      STOP AND ESCALATE on a measured nontrivial reduced self-pairing above
      embedding degree 1 that survives the final-exponentiation control. Work
      STOPS, the goal pause condition fires, and the finding goes to an independent
      adversarial review and, before any record calls it a break, to the
      highest-effort review tier per AGENTS.md rule 12. Nothing is described
      beforehand.
    - >-
      DO NOT INTERPRET stage 3 as an absence of difference if stage 0 declared the
      arm underpowered. Report the counts and the required prime count instead.
    - >-
      Stage 4 is NOT optional. Reporting the distribution arm without the
      curve-free sweep beside it is an invalidation, not a shortcut.
    - >-
      Budget exhaustion on large-embedding-degree classes is NOT a stop for the
      contract: those classes are reported as DERIVED and the run continues.
  invalidation_rules:
    - >-
      Pooling over the curves of a class in the distribution arm INVALIDATES it.
      The embedding degree is a class invariant and pooling would inflate every
      sample size by the class size.
    - >-
      Presenting a DERIVED cell as a MEASURED one, or omitting the
      computed-or-derived flag, INVALIDATES the triviality arm.
    - >-
      Reporting a pairing value that was not first checked as a root of unity of
      order dividing the subgroup order INVALIDATES that value.
    - >-
      Choosing or changing an embedding-degree bound after seeing results
      INVALIDATES the count comparison. The three bounds are declared in Stage 0.
    - >-
      Claiming an absence of difference when Stage 0 declared the arm underpowered
      INVALIDATES the claim.
    - >-
      Reporting the distribution arm without the CURVE-FREE sweep beside it
      INVALIDATES the report; describing a distributional finding the curve-free
      sweep reproduces as a property of j-invariants INVALIDATES the artifact.
    - >-
      Claiming the triviality derivation as NEW INVALIDATES the artifact: it is
      already committed in this corpus as one of the two arguments of another
      hypothesis, which the drafting coordinator read in full.
    - >-
      Reporting the automorphism-pairing triviality as a FINDING rather than as the
      NULL INVALIDATES the statement.
    - >-
      Describing any result as applying to supersingular curves, or to pairings
      with arguments outside the base-field group, INVALIDATES the artifact.
    - >-
      Reading any embedding-degree result as a statement about deployed
      pairing-friendly curves INVALIDATES it: those are SELECTED for small
      embedding degree by design, and a measurement over randomly enumerated
      classes is not a measurement over that construction.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the derivations are written
    with the equivariance step explicit, the three bounds and both ranges are
    declared, the minimum detectable shift is computed and archived, and the
    priority statement is recorded; (2) the embedding-degree-1 control returns a
    value of full order and recovers a certified secret; (3) every enumerated class
    reports its embedding degree, both pairing values where affordable, and its
    computed-or-derived flag, with the computed fraction reported per prime; (4)
    the decay sweep shows a step rather than a smooth decline; (5) the permutation
    test and the three count comparisons are reported per class with Poisson
    intervals; (6) the CURVE-FREE sweep is reported beside the curve arm with its
    declared transfer assumption; and (7) excluded classes and unevaluated classes
    are listed with reasons.
    SUCCESS IS PROTOCOL INTEGRITY. A run that declares the distribution arm
    underpowered is a FULL SUCCESS and says so.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 ZERO COMPUTE, PRIMARY: a counterexample to the triviality derivation on
    paper. The derivations are one line each, so a counterexample means the
    argument is being misapplied and the record is withdrawn by a superseding
    proposal.
    F2 THE CONSEQUENTIAL FALSIFIER: a measured nontrivial reduced self-pairing
    above embedding degree 1 surviving the final-exponentiation control. That
    refutes the derivation AND constitutes a break on that curve. Work STOPS, the
    goal pause condition fires, and the finding is escalated as in the stopping
    rules. The prior is very low and the check is very cheap, which is the entire
    argument for running it.
    F3 INSTRUMENT FAILURE: the embedding-degree-1 control returns a trivial value.
    Every triviality report is void.
    F4 THE OTHER INTERESTING OUTCOME: the special-class embedding-degree
    distribution is shifted toward small values relative to matched generic classes
    at the same prime, surviving the permutation test at all three bounds. A
    weak-instance-density finding on the DATA axis; the goal pause condition fires
    before any description, and the FIRST hypothesis to test is that the
    enumeration is not matched on the prime or on the divisor structure of the
    subgroup order.
    F5 UNDERPOWERED, DECLARED IN ADVANCE: the Stage 0 computation shows one special
    class per prime over the declared range cannot detect the shift of interest.
    Reported with the required prime count; no absence of difference is claimed.
    F6 ATTRIBUTION: the CURVE-FREE sweep reproduces the distribution arm, which is
    the PREDICTED outcome. The finding concerns the joint distribution of the prime
    and subgroup order under the complex-multiplication constraint and NOT
    j-invariants acting on instances.
    F7 THE MAIN NEGATIVE AND THE INTENDED DELIVERABLE: both pairings identically
    trivial above embedding degree 1, the positive control firing, and the
    distributions indistinguishable AT ADEQUATE POWER. The pairing route is CLOSED
    for this question with a named obstruction and forward guidance naming what
    remains open.
    NOT A FALSIFICATION: extension arithmetic exceeding budget on
    large-embedding-degree classes. An INFRASTRUCTURE outcome; those classes are
    DERIVED and the computed fraction is a required metric.
  artifact_package_directory: experiments/EXP-PFDR-ccae87/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/derivations.md (both derivations with the equivariance step explicit, the collapse, and the PRIORITY STATEMENT naming the already-committed form of the same argument)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/power.yaml (the three declared bounds, both prime ranges, and the COMPUTED minimum detectable shift with the class as the unit -- ARCHIVED BEFORE THE COMPARISON RUNS)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/positive-control.yaml (the embedding-degree-1 curve, the pairing order, the recovered scalar, the independent certificate, and a note that the fixture is shared with the pairing lane)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/classes.yaml (per class: prime, trace, subgroup order, cofactor, discriminant, conductor, j-invariant, automorphism count, embedding degree, class size, both pairing orders where evaluated, and the COMPUTED-OR-DERIVED FLAG)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/decay.yaml (the pairing order swept over embedding degrees 1 to 4, with the step-versus-smooth determination)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/distribution.yaml (the permutation test per prime, the counts below each of the three bounds per arm with Poisson intervals, and the interpretation gate from the power file)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/curve-free-sweep.yaml (the distribution from prime and subgroup-order pairs alone, the declared class-weighting transfer assumption, and an explicit statement of what its agreement licenses and forbids)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/exclusions.yaml (classes excluded for full rational torsion, and classes whose pairing was not evaluated, each with its reason)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/baselines.yaml (matched generic baseline counts on every toy instance, including the automorphism-discounted variant)'
    - 'experiments/EXP-PFDR-ccae87/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F7 fired; per-file sha256; the inference block; the computed fraction per prime; whether the supersingular scope request was granted or refused and the consequence; and explicit statements that the derivation is not claimed as new and that no record status was changed)'
  interpretation_limits:
    - >-
      claim_tier toy. The derivations are DERIVATIONS; the enumeration verifies the
      implementation over a finite range, not the derivations.
    - >-
      NO EXPONENT AND NO ATTACK. On a fixed curve above embedding degree 1 the
      delta is exactly zero on every axis. The honest ceiling is a SCOPE STATEMENT.
    - >-
      THE TRIVIALITY DERIVATION IS ALREADY COMMITTED IN THIS CORPUS as one of the
      two arguments of another hypothesis, and is NOT claimed as new. What is new
      is the scope statement for this question and the matched-generic comparison
      at a fixed prime.
    - >-
      NOTHING HERE APPLIES TO SUPERSINGULAR CURVES, where distortion maps exist and
      the modified self-pairing is nondegenerate. That is the object on which the
      conclusion fails, it is outside this question scope, and using it as a control
      requires an explicit Coordinator scope decision.
    - >-
      NOTHING HERE APPLIES TO PAIRINGS WITH ARGUMENTS OUTSIDE THE BASE-FIELD GROUP.
      The classical transfers use a second, non-rational point and are untouched.
    - >-
      The embedding degree contains no curve, so the distribution arm is expected
      to be reproduced by the curve-free sweep, and the deliverable must attribute
      the result at that granularity rather than to the j-invariant.
    - >-
      The dominant implementation risk is the final exponentiation, which is why
      every reported value is checked as a root of unity of the right order.
    - >-
