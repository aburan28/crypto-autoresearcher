  success_criterion: "All eight selected cells and source calibration valid; at least one embedding-degree bin satisfies R64>=1.20 in both bit blocks and both seeds. This is only a baseline interface/cost crossover and requires independent verification."
  falsification_criterion: "All eight cells valid and R64<=1 in every cell and both seeds. This rules out an amortized saving for this concrete measured interface/decoder at this panel, not new characters. Other complete data patterns are inconclusive for the>=20% hypothesis."
  decision_branches:
    positive: "Verify costs independently, then reuse this calibrated interface when a new arithmetic character is supplied; no claim about a new character or rho improvement."
    negative: "Record actual bottleneck and measured gap; keep non-pairing constructions open. Avoid spending compute to re-prove injectivity or base-field triviality."
    inconclusive: "Record fixture/implementation/resolution gap or mixed costs and rerank; reuse existing compatible pairing instrumentation before proposing another run."
  tail_checks:
