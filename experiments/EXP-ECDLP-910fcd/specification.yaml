  stopping_rules:
    - "First exact control or scalar-isolation failure stops the affected experiment as invalid; preserve attempts."
    - "Any stage CPU/wall cap or8GiB RSS cap produces incomplete/inconclusive."
    - "Stop after fixed eight-cell panel and matrix; no high-k construction, decoder tuning or new curve search."
  invalidation_rules:
