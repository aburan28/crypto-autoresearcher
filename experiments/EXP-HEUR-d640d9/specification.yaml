  # ==================================================================
  # 11. STANDING PROHIBITIONS (restated so no Executor can cite a forbidden value)
  # ==================================================================
  standing_prohibitions:
    source: "BATCH-004 dispatch_queue.json standing_prohibitions; DEC-20260802-8227b9; DEC-20260802-48c72c."
    binding_on: "every record produced under this contract, including the run receipt, the execution report, and both review reports."
    items:
      - id: SP-1
        permanent: true
        text: "No record may cite c = 0.864 or its variants (0.771 / 0.868 / 1.0389 / the c_kappa variants) as an overhead estimate. They may appear only in a column explicitly labelled 'superseded input being corrected'."
      - id: SP-2
        permanent: true
        text: "gamma = 0.9739, the quadratic coefficient 0.0488 and gamma_local_top = 1.1706 may not be quoted without the seam statement AND the homogeneous readings (IMPL-A 0.9332, IMPL-B 0.7929, homogeneous curvature 0.0225 with CI [0.0194, 0.0366], homogeneous gamma_local_top 1.0187)."
      - id: SP-3
        text: "Modelled margins are quoted at w = 2^30 only."
      - id: SP-4
        text: "Corrected c is citable only as the bracket [1.327077, 1.576444] with its eight mandatory attachments, never as a single number."
      - id: SP-5
        text: "Per-row bootstrap CIs (~0.005 wide in c) must never be presented as the uncertainty; the real uncertainty is 11.5-13.25 bits."
      - id: SP-6
        text: "concrete_threat_nist1 stays INCONCLUSIVE unless evidence clears the irreproducibility band, which this batch is not designed to produce."
    relevance_note: >
      SP-1 through SP-5 concern the per-entry cost programme and this
      experiment produces no quantity of that kind. They are restated in full
      anyway, because the failure mode they guard against is a record quoting
      a forbidden value while discussing something else, and an Executor who
      has not read them cannot avoid them. SP-6 binds directly: NOTHING IN THIS
      EXPERIMENT MAY MOVE concrete_threat_nist1.
    additional_prohibition_specific_to_this_contract:
      id: SP-H
      text: >
        NO RECORD PRODUCED UNDER THIS CONTRACT MAY DESCRIBE ANY RESULT AS
        SUPPORT FOR HEURISTIC 1, FOR P0, FOR ANY MARGIN ROW, OR FOR THE ATTACK.
        A non-rejection is reported as a non-rejection in the tested body at
        toy primes. This prohibition is symmetric: no result here may be
        described as a refutation of Theorem 1.1 or of the p^{1/3+o(1)}
        exponent either.

  # ==================================================================
  # 12. NON-CLAIMS (explicit; binding on every downstream record)
  # ==================================================================
  non_claims:
    - >
      THIS EXPERIMENT CANNOT CONFIRM HEURISTIC 1. Heuristic 1 is a tail
      statement at u ~ sqrt(log p) ~ 13.1 where rho(13) ~ 2^-60; toy primes
      reach u <~ 4.5 (enumerated) or u <~ 9 (sampled). The operating point has
      ZERO experimental resolution here, by construction. A passing statistic
      is not support for the heuristic, for P0, or for the attack.
    - >
      A falsification here falsifies the MODEL (or the SAMPLER) in the tested
      body, at toy primes, at constant-factor level. Per RT-H3 that changes
      which distribution a concrete cost table should use; it does not touch
      the exponent, Theorem 1.1, or the conditional asymptotic claim.
    - >
      This is toy-scale evidence (claim_tier: toy) and may never be presented
      as medium- or cryptographic-scale validation (AGENTS.md rule 7).
    - >
      S1 tests the walk-based sampler described in this contract, which is the
      producer's reading of Section 4.2's unstated method. A verdict about it
      is not automatically a verdict about the paper's sampler.
    - >
      S4 measures disjointness at lambda ~ 0.03-0.3. Heuristic 1's content
      lives at lambda ~ 2^-60. Neither a deficit nor an agreement at toy rarity
      transfers to the operating rarity, in either direction.
    - >
      Nothing here bears on the per-entry cost programme, on c, on gamma, on
      the extrapolation law, on FC-4, or on any EXP-PEC-* result. The two sides
      of the margin are measured by different experiments and neither
      substitutes for the other.
    - >
      Nothing here changes any hypothesis status, promotes or weakens
      H-P13-001, lifts any standing prohibition, or supports any
      security-parameter action. Only the Coordinator, in the BATCH-004 ledger
      archive after independent Validator and Red Team review, may act on this
      run at all.
    - "Nothing here bears on CSIDH, (qt-)Pegasis, or torsion-based constructions."
    - >
      An INCONCLUSIVE verdict is a real and expected outcome and is reported as
      inconclusive. It is not a weak version of either a pass or a
      falsification.

  honesty_constraints:
    - "No fabricated commands, outputs, timings, statistics, citations, or runs."
    - "Every number in raw-result.json is produced by code in this run, except values explicitly labelled as read from a named committed file with the field named."
    - "Missing data stays missing. A prime that could not be enumerated is reported as not enumerated, never estimated, interpolated, or filled from a published table."
    - "Unexpected observations are recorded, not discarded (AGENTS.md rule 8)."
    - "No published class number, delta_E table, or supersingular count is transcribed from recollection or from a search snippet and used as data."
    - "Deviations, truncations, void controls and inconclusive verdicts are reported, not tuned away."
    - "Wall-clock is recorded alongside mathematical quantities and never substituted for one, and never used as a stopping criterion."
    - "REM-2 binds: this FROZEN CONTRACT governs. If a task card or dispatch message disagrees with it on an order, a grid, a threshold or a parameter, follow the contract and report the discrepancy. A dispatch message cannot amend a frozen protocol."

  # ==================================================================
  # 13. INVENTOR-PROTOCOL SECTION 8 DETERMINATION
  # ==================================================================
  section_8_determination:
    ref: "docs/inventor-protocol.md section 8; knowledge/techniques/KN-TECH-080.md; templates/research-records.md proof_search_map"
    proof_search_map_required: true
    reason: >
      REQUIRED, and this is a departure from the BATCH-003 precedent
      (EXP-PEC-49c773 recorded `false`), so the reason is stated rather than
      assumed. Section 8 binds "any proof-oriented proposal, asymptotic claim,
      certificate family, reduction, or CLOSURE ARGUMENT". This experiment's
      falsification arm IS a closure argument in preparation: a met threshold in
      S2, S3 or S4 would be offered as a scoped refutation of the random-integer
      model, and docs/claims-and-verification.md requires a checkable refutation
      artifact before any adverse transition. Moreover the four audits are not
      ceremonial here -- each maps one-to-one onto a standing red-team objection,
      which is the strongest possible indication that they are load-bearing. The
      map is recorded inline because no hypothesis-level `proof_search_map`
      exists for Heuristic 1 in this programme; creating one is named as a next
      action rather than silently skipped.
    audit_dispositions:
      baseline_reproduction:
        status: DISCHARGED BY CONSTRUCTION
        how: >
          The baseline being reproduced is an exactly known count, not a curve
          that "looks similar": IF-1 requires the type-set enumeration to
          satisfy n_types = (#SS + #{delta_E = 1})/2 with #SS computed by
          brute-force supersingularity testing, and forbids any recalled
          closed-form count from serving as ground truth until it has been
          verified against brute force. IF-2 reproduces every minimum by two
          independent routes. This is a frozen-fixture reproduction in the
          audit's sense.
      observation_collision:
        status: APPLICABLE, PARTIALLY CLOSED, AND THE CLOSURE IS THE POINT
        how: >
          The collision is EXACTLY RT-H1: two distinct ground-truth models --
          "delta_E factors like a uniform integer of size X = (p/2)^{1/3}" and
          "of its own size n" -- produce nearly identical observables (the
          CDF of log P+), differing by a horizontal shift of order
          log(const)/log B. S3 is the separator, and it is built as a
          likelihood comparison with a null calibration precisely so that a
          collision is DETECTED (verdict NOT-DISCRIMINATED or VOID) rather than
          resolved by wishful reading. A SECOND collision is named and NOT
          closed: at toy u the model that fits the body and the model that
          governs the tail are observationally identical, and no amount of toy
          data separates them. That collision is the ceiling of section 0 and
          this experiment does not narrow it at all.
      quantifier_order:
        status: STATED, AND THE MISORDERING IS THE HEADLINE RISK
        how: >
          Heuristic 1 reads: for all eps, for all sufficiently large p,
          for all B with (log p)^eps < u < (log p)^{1-eps}, the probability
          over a uniform random supersingular E exceeds u^{-u(1+o(1))}. What
          this experiment can support is strictly: for the specific p in the
          completed tiers, for the specific B in the tested grid, the measured
          distribution does or does not deviate from the size-matched
          random-integer prediction. The uniform-in-p quantifier is NOT
          reachable, and the tested B-grid is bounded by X_p <= 22 in the
          mandatory range. Reading a finite-p, finite-B non-deviation as the
          uniform statement is precisely the quantifier error this audit
          exists to catch, and SP-H prohibits it.
      method_ceiling_and_nearby_object:
        status: ADDRESSED, AND THE CEILING IS STATED IN SECTION 0 RATHER THAN BURIED
        how: >
          METHOD CEILING: under ideal tuning -- perfect enumeration, unbounded
          compute, every prime to 22,000 -- this method can establish or refute
          the random-integer model at u <~ 4.5, and nothing else. It can never
          reach u ~ 13. That bound is stated up front in
          THE_CEILING_OF_THIS_EXPERIMENT, not in a limitations footnote.
          NEARBY OBJECT: NULL-A is the closest object where the arithmetic
          conclusion must NOT hold -- random integral ternary forms of the same
          determinant, run through the identical code path. A statistic that
          cannot distinguish maximal orders from NULL-A has not identified the
          load-bearing arithmetic structure, and the void criterion makes that
          outcome terminal for the statistic rather than negotiable.

