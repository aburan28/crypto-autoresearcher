experiment:
  id: EXP-HEUR-d640d9
  hypothesis_id: H-P13-001
  version: 1
  title: >
    NC-3 + NC-6: the first direct confrontation of Heuristic 1's random-integer
    model with exactly enumerated ground truth. Sampler-uniformity two-sample
    test (RT-H2), the ell = 2 parity statistic of the minimal degree (RT-H3),
    the size-model double fit (RT-H1/B6), and the disjointness ratio
    (RT-H4/NC-6) -- each with a null object of the same shape, at toy primes,
    with an explicit and prominent ceiling.
  status: approved
  approved_by: coordinator
  approval:
    task_id: TASK-20260802-0a794b
    goal_id: GOAL-P13-001
    batch_id: BATCH-004
    approved_at: "2026-08-02"
    authority: >
      Only the Coordinator approves an experiment (AGENTS.md, "Roles"). This
      approval authorizes execution of the protocol below by
      TASK-20260802-4bd310. It changes no hypothesis status, promotes nothing,
      lifts no prohibition, and asserts no result.
    frozen: true
    freeze_rule: >
      This contract is written before any datum of RUN-HEUR-d640d9-a exists and
      is not revised in light of results. Every threshold, weighting, null
      object, decision rule and consequence below is fixed NOW. A needed change
      is a SUPERSEDING contract under a new EXP id. Editing this file after the
      snapshot archive (TASK-20260802-56524a) is a contract violation, not a
      repair.
    preregistration_honesty: >
      Stated plainly rather than glossed. The Coordinator has read the red-team
      objections RT-H1..RT-H4, the producer's EXP-1/EXP-2 designs and the
      B1..B9 de-risking while writing this contract, and every threshold below
      was chosen with those arguments in view. What the Coordinator has NOT
      seen is any datum of the kind this experiment produces: no delta_E has
      ever been enumerated anywhere in this programme, no parity rate, no
      likelihood ratio and no disjointness ratio exists in any committed
      record. The pre-registration is therefore genuine for every reported
      statistic, and the load-bearing part of it is the CONSEQUENCE attached to
      each threshold, which is binding in both directions.
  assigned_to: executor
  executing_task: TASK-20260802-4bd310

  # ==================================================================
  # 0. OBJECTIVE, AND THE CEILING STATED BEFORE ANYTHING ELSE
  # ==================================================================
  objective: >
    Measure, against exactly enumerated ground truth at toy primes, four
    properties of delta_E (the degree of the smallest isogeny E -> E^(p)) that
    Heuristic 1's random-integer model predicts and that no artifact in this
    programme has ever measured: (S1) whether the walk-based sampler of the
    paper's Section 4.2 method reaches conjugacy classes uniformly; (S2)
    whether P(delta_E even) matches the model's own size-matched prediction,
    ell = 2 being the one small prime the producer's nondegeneracy argument B2
    does not cover; (S3) which of two size models the smoothness data support,
    by full-sample likelihood and goodness of fit rather than order-statistic
    anecdotes; and (S4) whether the rare representation events whose
    near-disjointness IS the entire content of Heuristic 1 are in fact
    disjoint at the rarity levels toy scale can reach. Record observations
    only.

  THE_CEILING_OF_THIS_EXPERIMENT:
    read_this_first: true
    statement: >
      HEURISTIC 1 IS A TAIL STATEMENT AND THIS EXPERIMENT MEASURES THE BODY.
      At the paper's own operating point p = 5*2^248 - 1, the algorithm runs at
      u = sqrt(log(p/2)) ~ 13.1, where rho(13) ~ 2^-60. No sample of any
      feasible size can ever contain an integer that smooth: with N samples the
      empirical resolution floor is ~1/N, so at N = 10^5 nothing beyond u ~ 8
      is observable even in principle, and the enumerated range of this
      contract is far below that. At the mandatory primes p <= 22,000 the AOV
      bound gives X_p = floor((p/2)^{1/3}) <= 22, so delta_E is an integer
      below 23 and the ENTIRE reachable u = log(X_p)/log(B) range is about
      [1, 4.5]. The optional sampled arm at p ~ 2^28 reaches X ~ 512 and
      u <~ 9. The operating point is unreachable by construction, not by
      effort, and no amount of compute closes the gap -- which is precisely why
      there is no budget here and why more compute is not the answer.
    what_this_contract_can_do: >
      It can FALSIFY the random-integer model for delta_E in the tested body,
      at constant-factor level, in the tested scope. Per RT-H3 that would be a
      falsification of the MODEL (replace it by the measured distribution),
      not of the attack's exponent. It can also fail to falsify it.
    what_this_contract_can_never_do:
      - >
        IT CAN NEVER CONFIRM HEURISTIC 1. Not partially, not "as far as it
        goes", not "consistent with". A statistic that fails to reject is a
        statement about the body at toy primes and NOTHING ELSE.
      - >
        A non-rejection here is NOT support for Heuristic 1, NOT support for
        P0, NOT support for any of the eighteen margin rows, and NOT support
        for the attack. Any record that reads a non-rejection as support
        violates this contract and AGENTS.md rule 7.
      - >
        It cannot bear on the disjointness of events at the operating rarity
        lambda ~ 2^-60. S4 reaches lambda ~ 0.03 at best. Disjointness measured
        at lambda ~ 0.1 is not evidence about disjointness at lambda ~ 2^-60,
        in either direction.
      - >
        It cannot decide between Heuristic 1 and any competitor at the
        operating point, because at the operating point every candidate model
        predicts an unobservable probability.
    why_it_is_still_the_batch_s_primary_objective: >
      Because the term it attacks has never been touched. P0 multiplies all
      eighteen margin rows identically (H-P13-001 heuristic_1_status), three
      consecutive batches measured the per-entry COST on the other side of the
      margin, and a constant-factor error in P0 at the operating point moves
      every row by the same amount. A falsification here would be the first
      result in the programme that bears on P0 at all. A non-falsification
      narrows a refutation channel and is recorded as exactly that, at the
      inventor-protocol section 4 standard: it names what remains open rather
      than claiming the lane is closed.

  # ==================================================================
  # 1. WHAT IS UNDER TEST, AND WHAT IS NOT
  # ==================================================================
  heuristic_under_test: null

  object_under_test:
    heuristic_under_test_explained: >
      Heuristic 1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 69, via
      Lemma 3.5 (line 187) and Section 4.2 (lines 242-256). NOTE A LEDGER GAP,
      recorded rather than papered over: this programme has no numbered
      `HEUR-NNN` heuristic record for Heuristic 1, which
      docs/claims-and-verification.md ("Heuristic records") requires for every
      heuristic the programme relies on. The template field
      `heuristic_under_test` therefore cannot be filled with an id. Creating
      that record is a task for the BATCH-004 ledger archive, not for this
      experiment, and is named in the opening report as a next action.
    the_statement: >
      For uniformly random supersingular E/F_{p^2}, the degree of the smallest
      isogeny phi : E -> E^(p) is B-smooth with probability at least
      u^{-u(1+o(1))}, u = log(p/2)/(3 log B), uniformly for
      (log p)^eps < u < (log p)^{1-eps}.
    the_object_measured: >
      delta_E := the norm of the shortest vector of the unique two-sided ideal
      P of reduced norm p in O ~ End(E), under the quadratic form Nrd/p; by the
      Deuring correspondence this is the degree of the smallest isogeny
      E -> E^(p) (paper Section 4.2 line 244; AOV Prop. 3.1 as reported in
      research/P13-HEUR-001 section 1).
    what_is_NOT_under_test:
      - "Theorem 1.1 as a conditional asymptotic statement. Nothing here touches it."
      - "The per-entry cost programme (EXP-PEC-*). Different quantity, different side of the margin."
      - "The AOV bound delta_E <= (p/2)^{1/3} itself, which is a theorem of a cited external paper. It is USED here (it bounds the enumeration range) and its empirical shadow is checked as a free by-product (control IF-5), but a violation would be a finding about this implementation first."
      - "CSIDH, (qt-)Pegasis, torsion-based constructions."

  # ==================================================================
  # 2. ENVIRONMENT: WHAT IS ACTUALLY AVAILABLE
  # ==================================================================
  environment_facts_at_freeze_time:
    python: "3.11.15"
    sagemath: "not installed"
    sympy: "not installed"
    gmpy2: "not installed"
    numpy: "not installed"
    scipy: "not installed"
    third_party_packages: "none (Python standard library only)"
    cpus: 4
    memory_gb_approx: 15
    source: >
      experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/environment.json, which
      recorded these facts as observed rather than assumed. The Executor
      re-records the environment it actually observes; a discrepancy is a
      finding, not a licence to change the protocol.
    binding_consequence: >
      EVERY COMPUTATION IN THIS CONTRACT MUST BE PURE-PYTHON AND EXACT-INTEGER.
      The producer's designs in research/P13-HEUR-001 assume SageMath and
      AOV's published code; NEITHER IS AVAILABLE. This contract therefore
      specifies arithmetic that the standard library can carry out exactly:
      integer lattice reduction and exhaustive short-vector enumeration in rank
      3 and 4, exact smooth-number counting by sieve, exact binomial tails by
      rational arithmetic, and Monte-Carlo null distributions from
      `random.Random` with declared seeds. No floating-point quantity may
      appear in any pass/fail comparison without its exact-arithmetic
      counterpart also being reported.
    if_a_dependency_is_needed: >
      STOP and report the underspecification. Do NOT substitute an approximate
      method for an exact one, do not vendor a numerical library, and do not
      hardcode a table of values from recollection. An unavailable method is an
      infrastructure fact (AGENTS.md rule 5), never a mathematical result.

  # ==================================================================
  # 3. PRIME RANGE AND THE EXACT ENUMERATION METHOD (GROUND TRUTH)
  # ==================================================================
  prime_range:
    definition_rule: >
      Tiers are defined by a RULE, not by a hand-picked list, so that no prime
      can be selected or dropped after a number is seen. Every prime in a tier
      is enumerated or the tier is incomplete.
    tiers:
      - id: TIER-0
        rule: "every prime p with 11 <= p <= 199"
        mandatory: true
        role: >
          INSTRUMENT FIDELITY. Small enough that every control in section 6 can
          be run by brute force. All four residues mod 8 occur, which S2
          requires.
      - id: TIER-1
        rule: "every prime p with 199 < p <= 2000"
        mandatory: true
        role: >
          CORE. TIER-0 + TIER-1 is the mandatory scope and is expected to
          clear the >= 10^4 (class, delta_E) record floor of section 9 by
          itself; if it does not, the run says so and the floor governs.
      - id: TIER-2
        rule: "every prime p with 2000 < p <= 8000"
        mandatory: false
        role: "EXTENSION. Ordered, ascending p."
      - id: TIER-3
        rule: "every prime p with 8000 < p <= 22000"
        mandatory: false
        role: >
          REACH. 22,000 is the boundary of AOV's reported complete enumeration
          (research/P13-HEUR-001 section 4, citing arXiv:2607.14624) and is the
          range NC-3 names. Ordered, ascending p.
    execution_order_over_primes: >
      Strictly ascending p within a tier, and tiers in order TIER-0, TIER-1,
      TIER-2, TIER-3. A tier is entered only after the previous tier is
      complete.
    partial_prime_rule_binding: >
      A PARTIALLY ENUMERATED PRIME IS DISCARDED ENTIRELY. Enumeration order
      within a prime correlates with delta_E (small minima are found first by
      every reduction-based traversal), so a truncated single-prime enumeration
      is BIASED TOWARD SMALL delta_E and would manufacture exactly the
      smoothness excess this experiment exists to detect. Every statistic is
      computed over COMPLETE primes only. This rule is not negotiable and is
      the single most important protection against a truncation becoming a
      false signal.
    sampled_arm:
      role: >
        OPTIONAL and STRICTLY CONDITIONAL on S1. It extends the reachable
        u-range (X ~ 512 at p ~ 2^28 against X <= 22 at p = 22,000) at the cost
        of replacing exact enumeration by the sampler that S1 is testing.
      primes: >
        For each target magnitude m in {2^16, 2^20, 2^24, 2^28}: the twelve
        largest primes below m, and the twelve largest primes below m that are
        = 3 (mod 4), de-duplicated. The rule is fixed here; the list is
        computed by the Executor.
      licence: >
        Statistics on the sampled arm are computed and reported ALWAYS, but
        carry the label SAMPLER-CONDITIONAL, and are additionally labelled
        SAMPLER-CONFOUNDED and excluded from every headline at any walk length
        L for which S1 returns SAMPLER-REJECTED.

  ground_truth_enumeration:
    what_ground_truth_means_here: >
      The complete multiset { (class, delta_E) } over ALL conjugacy classes of
      maximal orders in B_{p,infinity}, equivalently over all supersingular
      j-invariants in F_{p^2} up to Galois conjugation, with delta_E computed
      exactly. "Complete" is not asserted by the enumerator; it is CERTIFIED by
      the count identity in control IF-1, and an enumeration that fails IF-1 is
      NOT ground truth and is reported as an instrument failure.
    route_Q_primary:
      name: "Quaternion-side type-set enumeration"
      steps:
        - >
          Q1. Construct a candidate maximal order O_0 in B_{p,infinity} by an
          explicit basis over Z, recorded in full in raw-result.json. The
          presentation used is RECORDED, never assumed correct: O_0 is accepted
          only if all three exact checks pass -- (a) closure under
          multiplication on every product of basis elements, (b) integrality of
          the reduced trace and reduced norm of every basis element and every
          basis product, (c) reduced discriminant equal to p. An order of
          B_{p,infinity} whose reduced discriminant equals p is maximal; this
          is the maximality criterion used and it is recorded as such. If no
          candidate passes all three checks at some prime, STOP and report the
          construction failure; do not proceed with an unverified order.
        - >
          Q2. Enumerate the type set by breadth-first search in the ell-ideal
          graph at the smallest prime ell != p for which the graph is connected
          in the Executor's construction (ell = 2 by default): from each known
          order, compute all left ideals of reduced norm ell, take their right
          orders, and reduce each to a canonical form. Continue until closure.
        - >
          Q3. Canonical form for conjugacy: the Minkowski-reduced Gram matrix
          of the trace-zero (Gross) lattice of the order, with a fixed
          tie-breaking rule recorded in the implementation. This is used as a
          CONJUGACY TEST and its soundness is not assumed: it is checked by
          IF-1 (a test that over-merges yields too few classes, one that
          under-merges yields too many, and IF-1 detects either) and by IF-4
          (two orders declared conjugate must have identical theta series up to
          the declared bound).
        - >
          Q4. For each class, compute the two-sided ideal P of reduced norm p,
          restrict Nrd/p to P, and compute delta_E = min over nonzero vectors,
          by exhaustive short-vector enumeration after reduction. Record the
          minimal vector, delta_E, its full factorization, delta_E/X_p, the
          three successive minima (N1, N2, N3) of the trace-zero lattice, the
          Gram off-diagonals (x, y, z), p mod {2,3,4,5,7,8,11,12}, whether the
          j-invariant is Galois-stable, and the number of minimal vectors.
        - >
          Q5. Independently recompute delta_E as the minimum of the rank-3
          trace-zero form Q' of discriminant p/4 (AOV Prop. 3.1 route, as
          reported in research/P13-HEUR-001 section 1), and require agreement
          with Q4. Disagreement is control IF-2 failing.
    route_F_alternative:
      name: "Direct enumeration of reduced ternary Gram matrices (AOV eq. (7))"
      construction: >
        Enumerate integer tuples (N1, N2, N3, x, y, z) satisfying the AOV
        Gram-matrix identity
          p = xyz - N3 x^2 - N2 y^2 - N1 z^2 + 4 N1 N2 N3,
        with 0 <= x, y <= N1, |z| <= N2, p/4 <= N1 N2 N3 <= p/2 and
        N1 <= N2 <= N3, taking delta_E = N1, as reported in
        research/P13-HEUR-001 section 1 item 3 citing AOV eq. (7).
      admissibility_rule_binding: >
        Route F may serve as ground truth ONLY after its class multiset agrees
        EXACTLY with route Q at every TIER-0 prime and at a declared uniform
        random sample of 10 TIER-1 primes (seed in section 10). Any
        disagreement -- in count or in the delta_E multiset -- disqualifies
        route F as ground truth for this run, is reported in full, and route Q
        governs. Route F is never used to "fill in" primes route Q could not
        reach.
      why_it_is_offered: >
        It is pure integer arithmetic with no quaternion machinery and may be
        the only tractable workhorse at TIER-2/TIER-3 in pure Python. Whether
        the correspondence it relies on is a bijection onto the type set is
        exactly what the agreement check decides, empirically, at primes where
        both routes run. It is NOT assumed.
    forbidden: >
      No published table of delta_E values, class numbers, or supersingular
      counts may be transcribed from recollection or from a search snippet and
      used as data. Every number in raw-result.json is computed by code in this
      run, except values explicitly labelled as read from a named committed
      file. AGENTS.md rule 9.

  # ==================================================================
  # 4. THE THREE MEASURES (fixed now, because they differ where it matters)
  # ==================================================================
  weightings:
    why_this_section_exists: >
      Heuristic 1 is stated for a uniformly random supersingular CURVE. The
      paper's Section 4.2 experiment samples maximal orders uniformly up to
      CONJUGATION. These are different measures and they differ exactly on the
      Galois-stable classes -- which are exactly the delta_E = 1 spike (B1).
      Fixing the weighting after seeing a statistic would be a choice made on
      the data. It is fixed here.
    definitions:
      - id: W-CURVE
        primary: true
        rule: >
          Uniform over supersingular j-invariants in F_{p^2}. A class whose
          j-invariant lies in F_p contributes weight 1; every other class
          contributes weight 2 (for j and j^p, which share delta_E since
          End(E) and End(E^(p)) are conjugate). This is Heuristic 1's literal
          measure and is PRIMARY for every statistic.
      - id: W-TYPE
        rule: >
          Uniform over conjugacy classes of maximal orders. This is what
          Section 4.2 samples and what the paper's Figures 1-2 therefore
          measure.
      - id: W-MASS
        rule: >
          Eichler mass weighting 1/|Aut(E)| (equivalently the weight used in
          the mass formula), computed from the automorphism count the
          enumeration records.
    required_reporting: >
      EVERY statistic in section 5 is reported under all three weightings.
      W-CURVE is primary; W-TYPE is reported beside it because it is the
      measure the paper's figures actually sample; W-MASS is reported because
      it is the measure the trace-formula first moment of S4 naturally carries.
      The DIFFERENCE between W-CURVE and W-TYPE is itself a deliverable: it
      quantifies, for the first time in this programme, the measure mismatch
      that RT-H2 raises qualitatively.

  # ==================================================================
  # 5. THE FOUR PRE-REGISTERED STATISTICS
  # ==================================================================
  statistics:

    # ---------------- S1 ----------------
    - id: S1
      name: "Sampler uniformity: walk-sampled delta_E against enumerated delta_E"
      discriminates: RT-H2
      why: >
        The paper's argument that uniform-over-conjugacy-classes is the right
        measure is sound FOR THE VALUE delta_E, but it does not validate the
        SAMPLER. A walk that mixes to a distribution tilted toward orders with
        short ideals is tilted toward exactly the regime that makes delta_E
        small, and Figures 1-2 would then measure the wrong ensemble.
      sampler_under_test:
        construction: >
          Non-backtracking random walk in the ell-ideal graph (ell = 2 by
          default, the same graph used by route Q's BFS), started at the
          verified O_0, of length L, with each step choosing uniformly among
          the ell admissible non-backtracking neighbours from a declared
          `random.Random` stream. The endpoint's class is identified by the
          route-Q canonical form and its delta_E read from the enumeration.
        walk_lengths: "L in { ceil(log2 p), 3*ceil(log2 p), 10*ceil(log2 p) }"
        why_three_lengths: >
          Under-mixing is RT-H2's named failure mode, so the walk length is
          made an independent variable rather than a fixed convention. A
          sampler that passes at 10*ceil(log2 p) and fails at ceil(log2 p)
          identifies the mixing requirement the paper's unstated walk must
          satisfy -- which is a more useful result than either verdict alone.
        sample_size: "N_walk = max(20 * n_types(p), 20000) draws per (prime, L)"
        scope_honesty_binding: >
          THE PAPER DOES NOT STATE ITS SAMPLER. Section 4.2 says only "we
          sample random maximal orders (uniformly random up to conjugation)".
          The object tested here is the walk-based sampler described above,
          which is the producer's reading (research/P13-HEUR-001 section 5,
          EXP-1 step 3). A rejection is a statement about THIS sampler at THESE
          primes and is NOT automatically a statement about the paper's
          unstated sampler. Any record that converts one into the other
          violates this contract.
      sub_statistics:
        - id: S1a
          name: "One-sample KS against the exact enumerated CDF"
          statistic: >
            D = sup_x | F_walk(x) - F_enum(x) | on x = log(delta_E), with
            F_enum the EXACT enumerated CDF under W-TYPE (the sampler's target
            measure). Ties are pervasive because delta_E is a small integer, so
            the null distribution of D is obtained by MONTE CARLO: 10,000
            resamples of size N_walk drawn from the exact enumerated
            distribution, giving an exact-in-the-limit p-value under ties.
          primary: true
          why_one_sample: >
            The reference is EXACT, not a sample. A one-sample test against the
            exact CDF is both correct and strictly more powerful than a
            two-sample test against a finite draw from it.
          threshold: >
            Per prime: reject at MC p < 0.05 after Holm correction across the
            primes tested at that L. Overall at length L: SAMPLER-REJECTED if
            the Fisher-combined p across primes is < 0.001.
        - id: S1b
          name: "Two-sample KS, walk-sampled against enumerated"
          statistic: >
            Two-sample KS between the walk sample of size N_walk and an
            independent EXACT-UNIFORM reference sample of the same size drawn
            from the enumerated type set (declared seed). MC null from pairs of
            exact-uniform samples.
          role: >
            This is literally the two-sample comparison NC-3(a) names, and it
            doubles as its own null object: the reference arm is drawn from the
            exact distribution, so any rejection is attributable to the walk.
          threshold: "same thresholds as S1a."
          agreement_requirement: >
            S1a and S1b must agree on the verdict at every (prime, L). A
            disagreement is a FINDING about the tests' power and is reported;
            the more conservative verdict (rejection) governs.
        - id: S1c
          name: "Class-visit uniformity"
          statistic: >
            Chi-square of the walk's class-visit counts against uniform over
            the n_types(p) classes, df = n_types - 1; and the total variation
            distance between the empirical visit frequency and uniform, with
            its reference distribution from the same exact-uniform Monte Carlo.
          threshold: "reject at chi-square p < 0.001 after Holm across primes."
          why_it_is_separate: >
            S1a/S1b test the sampler THROUGH delta_E, which is a coarse
            function of the class. S1c tests the class distribution directly
            and is the statistic that can catch a tilt invisible in delta_E.
        - id: S1d
          name: "T5 spike calibration (producer's validity gate, retained)"
          statistic: >
            Walk-sampled fraction with delta_E = 1, against the EXACT
            enumerated fraction, by two-sided exact binomial test.
          threshold: "reject at exact p < 0.001."
          note: >
            The producer's T5 compares against a p^{-1/2+o(1)} class-number
            scale. Here the exact enumerated fraction is available, so the
            comparison is against ground truth rather than against an
            asymptotic -- strictly better, and it costs nothing.
      verdict_rule:
        - "SAMPLER-NOT-REJECTED at length L: none of S1a-S1d rejects at that L."
        - "SAMPLER-REJECTED at length L: any of S1a-S1d rejects at that L."
      consequence_binding: >
        At any L returning SAMPLER-REJECTED, every sampled-arm statistic at
        that L is labelled SAMPLER-CONFOUNDED and is excluded from every
        headline. The ENUMERATED arm is untouched by an S1 rejection: it does
        not use the sampler. If S1 rejects at ALL three lengths, RT-H2's
        conditional conclusion applies IN TESTED SCOPE ONLY -- the walk-based
        sampler at toy primes does not reach conjugacy classes uniformly at
        the tested lengths -- and the sampled arm stops. It remains a statement
        about this sampler at these primes.

    # ---------------- S2 ----------------
    - id: S2
      name: "The ell = 2 parity statistic of the minimal degree"
      discriminates: RT-H3
      why: >
        B2 proves no forced divisibility or forbidden class for ell not
        dividing 2p, by nondegeneracy of the ternary form mod ell. The
        discriminant is p/4, so ell = 2 is the one small prime that argument
        does NOT cover, and a parity bias is invisible to all of B1-B9. It
        changes every odd-B smoothness probability by a constant factor and,
        being constant, survives the (1+o(1)) asymptotically while moving a
        concrete cost table.
      the_null_matters_here_and_is_fixed_now:
        naive_comparison_required_by_NC_3: >
          P(delta_E even) against 1/2, with EXACT binomial (Clopper-Pearson)
          99% confidence intervals, stratified by p mod 8, reported under all
          three weightings. This is the comparison NC-3(b) names and it is
          reported in full.
        why_1_over_2_is_the_WRONG_null_and_is_reported_descriptively: >
          delta_E is a small integer (<= 22 in the mandatory range), and its
          size distribution is not uniform. A uniform random integer in [1, n]
          is even with probability floor(n/2)/n, which equals 1/2 only for even
          n. Testing against 1/2 therefore confounds a genuine parity bias with
          the size distribution. The naive comparison is reported because NC-3
          names it; it is NOT the rejection statistic.
        the_rejection_statistic:
          definition: >
            q_i := floor(n_i / 2) / n_i, the EXACT probability that a uniform
            random integer in [1, n_i] is even, where n_i is the observed
            delta_E of sample i. Then
              p_null := sum_i w_i q_i / sum_i w_i,
              Var_null := sum_i w_i^2 q_i (1 - q_i) / (sum_i w_i)^2,
              p_obs := weighted observed even-fraction, with the corresponding
              weighted binomial variance Var_obs,
              z_2 := (p_obs - p_null) / sqrt(Var_obs + Var_null),
            with w_i the weights of the active weighting.
          why_this_is_the_right_null: >
            It is the random-integer model's OWN prediction, evaluated at the
            actual observed size of each sample. It removes the size effect
            exactly and leaves only the arithmetic question RT-H3 asks. It is
            computed in exact rational arithmetic.
      rejection_threshold_preregistered:
        condition_all_three_required:
          - "C1: |z_2| > 3 in the POOLED W-CURVE statistic over all completed primes."
          - "C2: |z_2| > 3 with the SAME SIGN in at least two of the four p mod 8 strata, each computed independently."
          - "C3: the SAME SIGN in TIER-1 alone and in the union of higher completed tiers alone, each computed independently. (If no tier beyond TIER-1 completes, C3 is evaluated as TIER-0 alone against TIER-1 alone.)"
        verdict_if_met: >
          THE RANDOM-INTEGER MODEL'S PARITY PREDICTION IS REJECTED IN TESTED
          SCOPE. Per RT-H3 this is a falsification of the MODEL at
          constant-factor level in the tested body -- the working model becomes
          the measured distribution -- and it is NOT a falsification of the
          attack's exponent, of Theorem 1.1, or of Heuristic 1 at the operating
          point. The magnitude of the constant factor is reported, in bits, as
          log2(p_obs / p_null) and its odd-B analogue.
        verdict_if_not_met: >
          NOT REJECTED IN TESTED SCOPE. This narrows RT-H3's refutation channel
          at the tested primes and asserts nothing else. It is not support.
        verdict_if_partially_met: >
          Report each of C1, C2, C3 with its numbers and record the verdict as
          INCONCLUSIVE. Do not round a partial pattern up to a rejection and do
          not round it down to a clean pass.
      secondary_not_gating: >
        The same construction for delta_E mod ell, ell in {3, 5, 7, 11}, with
        the exact size-matched multinomial null and a chi-square statistic,
        overall and stratified by p mod ell. B2 predicts no forbidden classes;
        this is its empirical shadow (producer's T2) and costs nothing on data
        already collected. Reported, never gating.

    # ---------------- S3 ----------------
    - id: S3
      name: "The size-model double fit"
      discriminates: RT-H1, B6
      observable: >
        P+(delta_E) := the largest prime factor of delta_E, with P+(1) := 1.
        This is exactly what Figures 1-2 plot (the CDF of log of the largest
        prime factor), so the comparison is against the paper's own observable.
      the_two_models:
        - id: M1
          statement: "delta_E factors like a uniform random integer of ITS OWN size n_i."
          reference: >
            f1(y | n) = #{ m <= n : P+(m) = y } / n, computed EXACTLY by sieve
            enumeration for every n occurring in the data. NO DICKMAN
            ASYMPTOTICS ANYWHERE: u is small at toy primes and the asymptotic
            is not the model.
        - id: M2
          statement: >
            delta_E factors like a uniform random integer of size
            X_p = floor((p/2)^{1/3}) -- the AOV worst-case bound plugged in as
            the size of every sample, which is what the paper's plotted
            prediction does (u = log(p/2)/(3x)).
          reference: "f2(y) = #{ m <= X_p : P+(m) = y } / X_p, computed EXACTLY."
      discrimination_criterion_preregistered:
        statistic: >
          LLR = sum_i w_i [ ln f1(y_i | n_i) - ln f2(y_i) ], and the
          weight-normalised mean per-sample LLR. Computed under each weighting;
          W-CURVE primary.
        decision_rule:
          - "M1 PREFERRED if LLR > 0; M2 PREFERRED if LLR < 0."
          - >
            The preference is DECISIVE only if |LLR| > 10 natural-log units AND
            the sign is stable across ALL FOUR of: (a) each completed tier
            separately; (b) each p mod 8 stratum; (c) all ten folds of a
            10-fold random split (seed in section 10); (d) both W-CURVE and
            W-TYPE.
          - "Otherwise the verdict is NOT-DISCRIMINATED, and it is reported as such."
        mandatory_null_calibration_of_the_LLR:
          construction: >
            Compute the identical LLR on NULL-B (data generated from M1 by
            construction: each delta_E replaced by a uniform random integer in
            [1, n_i]) and on NULL-B2 (data generated from M2 by construction:
            each delta_E replaced by a uniform random integer in [1, X_p]),
            each at the same sample size and with 200 independent
            replications.
          void_criterion_binding: >
            If the observed |LLR| lies INSIDE the range spanned by the two
            null LLR distributions -- i.e. if the observed value is not
            separated from both -- THE DISCRIMINATION IS VOID and is reported
            as void. A large LLR obtained merely because N is large, on models
            that the data cannot actually tell apart, is the exact artifact
            the inventor protocol's "controls before belief" is aimed at.
      absolute_goodness_of_fit_both_models:
        method: >
          Randomized probability-integral transform: u_i = F(y_i^-) + v_i *
          f(y_i) with v_i drawn from a declared seed. Under the true model the
          u_i are exactly Uniform(0,1) even for discrete data. Then a
          one-sample KS of {u_i} against U(0,1), with a Monte-Carlo null.
        threshold: "a model is REJECTED at MC p < 0.001."
        the_outcome_that_matters_most: >
          IF BOTH M1 AND M2 ARE REJECTED, that is a STRONGER result than
          choosing between them: neither size model describes the toy-scale
          body, and the random-integer model is falsified in tested scope
          without reference to which size convention is used. This possibility
          is named in advance so it cannot be reported as an inconvenience.
      order_statistic_prohibition_binding: >
        NO ORDER-STATISTIC ANECDOTE MAY BE PRESENTED AS EVIDENCE FOR OR AGAINST
        EITHER MODEL. The smoothest observed sample may be reported
        descriptively, with its extreme-value probability under BOTH models
        computed exactly, and MUST carry the label "non-discriminating
        (RT-H1(2)): consistent with any model assigning this threshold a
        probability within a factor of a few". This is the exact
        over-read RT-H1 identified in the paper's own Section 4.2 and it is
        prohibited here.
      what_a_result_here_means_and_does_not: >
        Discriminating the size model tells us which convention the toy-scale
        BODY supports. It does NOT tell us which convention is right at the
        operating point, and per RT-H1 the two models differ by a horizontal
        shift of order log(const)/log B in u -- which is precisely the regime
        that grows in importance in the tail this experiment cannot see.

    # ---------------- S4 ----------------
    - id: S4
      name: "The disjointness ratio"
      discriminates: RT-H4, NC-6
      why: >
        The first-moment match is NECESSARY, not evidence: it is shared by
        every distribution with the same mean, including maximally correlated
        ones. Heuristic 1's entire content is the second-moment / disjointness
        side, which has no supporting data anywhere in the record. This is the
        strongest obtainable toy-scale refutation channel.
      the_two_events_are_pinned_here_because_conflating_them_is_the_trap:
        events:
          - id: E-SMOOTH
            definition: "{ delta_E is B-smooth } -- Heuristic 1's literal event and the event Lemma 3.4/3.5 needs."
          - id: E-EXISTS
            definition: >
              { there exists n <= X_p, n B-smooth, with n represented by the
              class's form } -- the event the first-moment route (b) actually
              bounds. E-SMOOTH implies E-EXISTS, never conversely.
        required_measurement_S4c: >
          P(E-EXISTS) - P(E-SMOOTH), reported as a fraction and in bits, per
          prime and pooled, at every B in the grid. THIS GAP HAS NEVER BEEN
          MEASURED ANYWHERE IN THIS PROGRAMME and it quantifies how much the
          first-moment heuristic route over-counts relative to what the
          algorithm requires. It is a deliverable in its own right.
      counting_convention_fixed_now: >
        Representations are counted as UNORDERED +/- PAIRS of lattice vectors
        (v and -v are one representation). This convention changes every mean
        by a factor of exactly 2 and is therefore fixed before any datum. The
        raw counts under the ordered convention are also recorded so the
        convention can be checked, never re-chosen.
      quantities:
        - id: D1
          name: "First-moment calibration"
          definition: "empirical mean representation count per class / theoretical first moment per class."
          theoretical_first_moment: >
            Computed from Hurwitz class numbers H(4np) summed over B-smooth
            n <= X_p, with H(D) obtained by EXACT enumeration of reduced
            positive binary quadratic forms of discriminant -D under the
            standard Hurwitz weighting, in pure integer arithmetic.
          normalization_rule_binding: >
            The constant relating the class-number sum to a per-class expected
            count is NOT asserted from recollection and is NOT fitted to the
            data. It is fixed by a declared identity, and that identity is
            VERIFIED at every TIER-0 prime against the enumerated total
            representation count. If the verification fails, D1 is reported as
            UNCALIBRATED, the first-moment arm is not used, and the failure is
            reported as a finding about the trace-formula machinery -- not
            about Heuristic 1.
          role: "INSTRUMENT CHECK on the first-moment machinery. Not the disjointness test."
        - id: D2
          name: "Raw hit-rate ratio"
          definition: "P(count >= 1) / E[count], over classes, at the active B."
        - id: D2_ref
          name: "The independent-events reference"
          definition: "D2_ref(lambda) = (1 - exp(-lambda)) / lambda, evaluated at the measured lambda = E[count]."
          why_it_is_essential: >
            D2 is BELOW 1 even under perfect independence: at lambda = 0.1,
            D2_ref = 0.9516. A threshold stated against 1 would therefore fire
            on a perfectly disjoint process. Comparing against D2_ref is what
            makes a threshold meaningful, and it is the null object doing real
            work rather than decorating the design.
        - id: D2_star
          name: "THE PRIMARY DISJOINTNESS STATISTIC"
          definition: "D2* = D2 / D2_ref(lambda_hat). Exact disjointness gives D2* = 1."
      rarity_regimes:
        rule: >
          B is taken from the grid {2, 3, 5, 7, 11, 13, 17, 19}; the three
          regimes are the B values whose measured lambda_hat is nearest to
          0.30, 0.10 and 0.03 respectively, chosen per prime-pool by that rule
          alone. If a target lambda is unreachable at a pool, the achieved
          lambda_hat is reported and the regime is recorded as NOT REACHED.
        why_three: >
          Disjointness is an asymptotic-rarity statement. A single rarity level
          cannot distinguish "disjoint" from "clumped with a coincidentally
          matching ratio". The DIRECTION of D2* as lambda decreases is the
          discriminating quantity, and it is the inventor protocol's canonical
          structural tell: a quantity that fails to move toward its predicted
          limit as the parameter meant to drive it there increases is an
          artifact signature.
      threshold_preregistered:
        refuted_in_tested_scope: >
          D2* <= 0.85 with a 99% bootstrap upper bound below 0.95 in at least
          TWO of the three rarity regimes, AND the deficit not shrinking as
          lambda_hat decreases (i.e. D2* at the rarest reached regime is not
          greater than D2* at the least rare, by more than the bootstrap
          resolution).
        consistent_with_disjointness_in_tested_scope: >
          The 99% bootstrap CI for D2* contains 1 in all three reached regimes.
        inconclusive: >
          Anything else. Say so plainly. An inconclusive S4 is a legitimate and
          common outcome at these sample sizes and is not to be dressed up.
        bootstrap: >
          Nonparametric bootstrap over CLASSES (the independent unit), 10,000
          replicates, declared seed, percentile interval, replicates attempted
          and completed both reported.
      what_a_refutation_here_would_and_would_not_be: >
        A refutation would be the strongest toy-scale evidence against
        Heuristic 1 obtainable by any means in this programme, and it would
        still be a statement about lambda ~ 0.03-0.3 at p <= 22,000. Heuristic
        1 lives at lambda ~ 2^-60. Per AGENTS.md rule 6 the negative result
        would close the exact tested scope and nothing beyond it.

  # ==================================================================
  # 6. NULL OBJECTS AND INSTRUMENT-FIDELITY CONTROLS
  # ==================================================================
  controls:
    void_criterion_binding:
      statement: >
        ANY SIGNAL REPORTED FROM THE ARITHMETIC OBJECT THAT APPEARS AT THE SAME
        MAGNITUDE AND SIGN IN ITS NULL OBJECT IS DECLARED VOID -- an artifact
        of the construction, the estimator or the finite sample -- AND IS NOT
        REPORTED AS A FINDING. A void signal is never repaired by adjusting the
        instrument, re-choosing a threshold, or restricting the range. It is
        recorded as void, with its numbers, and the experiment continues.
      per_statistic_form:
        - "S2: if |z_2| > 3 with the same sign on NULL-A, the S2 signal is VOID."
        - "S3: if the LLR on NULL-A selects the same model with comparable per-sample magnitude, or if the observed |LLR| lies inside the span of NULL-B/NULL-B2, the S3 discrimination is VOID."
        - "S4: if D2* on NULL-C is itself materially below 1 (99% CI excluding 1), the estimator is biased at this sample size and the arithmetic D2* is VOID."
        - "S1: S1b's reference arm IS the null; a rejection of the exact-uniform reference arm against the enumerated CDF voids the S1 instrument."
    null_objects:
      - id: NULL-A
        name: "Same-shape arithmetic null: random integral ternary forms of the same determinant"
        construction: >
          For each prime p, generate n_types(p) positive-definite integral
          ternary quadratic forms of the same determinant as the arithmetic
          family, by a declared random construction (recorded in the
          implementation), rejecting any form failing the determinant
          condition. Compute delta_null = the form's minimum by the identical
          exhaustive short-vector code path used for delta_E.
        role: >
          THE inventor-protocol null: the same shape, the same estimator, the
          same code path, with the arithmetic origin removed. Every statistic
          in section 5 is run on it.
        what_it_tests: >
          Whether a reported parity bias, size-model preference or disjointness
          deficit is a property of maximal orders or merely of "minima of
          integral ternary forms of determinant ~p computed by this code".
      - id: NULL-B
        name: "Size-matched random-integer null (M1 truth)"
        construction: "delta_E replaced by a uniform random integer in [1, n_i]; 200 replications, declared seed."
        role: "The exact null for S2's rejection statistic and the M1-truth calibration arm for S3's LLR."
      - id: NULL-B2
        name: "X-matched random-integer null (M2 truth)"
        construction: "delta_E replaced by a uniform random integer in [1, X_p]; 200 replications, declared seed."
        role: "The M2-truth calibration arm for S3's LLR."
      - id: NULL-C
        name: "Poissonized disjointness null"
        construction: >
          Redistribute the SAME total number of representation events
          independently across classes at the measured lambda_hat (Poisson
          draws, declared seed, 10,000 replications), then recompute D2* by the
          identical estimator.
        role: >
          The exact reference distribution of D2* under perfect disjointness at
          the same finite sample and the same lambda. It calibrates the
          threshold and detects estimator bias.
    instrument_fidelity:
      - id: IF-1
        name: "THE EXACTLY KNOWN COUNT"
        requirement: >
          At every TIER-0 prime, the number of supersingular j-invariants in
          F_{p^2} is computed by BRUTE FORCE, independently of the type-set
          enumeration: for each j in F_{p^2}, construct a curve with that
          j-invariant and test supersingularity by the Hasse-invariant
          criterion (the coefficient of x^{p-1} in (x^3 + a x + b)^{(p-1)/2}
          vanishes), in exact F_{p^2} arithmetic. This brute-force count is the
          ground-truth reference.
        closed_form_rule_binding: >
          The classical count floor(p/12) + eps_p (eps_p = 0, 1, 1, 2 for
          p = 1, 5, 7, 11 mod 12) may be USED as the reference at primes too
          large for brute force ONLY AFTER it has been verified against the
          brute-force count at EVERY TIER-0 prime. If it disagrees anywhere,
          the brute-force count governs, the formula as stated is recorded as
          wrong, and the discrepancy is reported in full. NO FORMULA FROM
          RECOLLECTION IS EVER THE GROUND TRUTH IN THIS CONTRACT.
        the_identity_that_certifies_completeness: >
          n_types(p) = ( #SS(p) + #{ classes with delta_E = 1 } ) / 2, because
          the type set is the set of Galois orbits {j, j^p} and a class is
          Galois-stable exactly when j lies in F_p, which is exactly when
          E ~ E^(p), which is exactly delta_E = 1. Both sides are computed
          INDEPENDENTLY and required to agree exactly. This single identity
          simultaneously certifies the enumeration's completeness, the
          conjugacy test's soundness, the Galois bookkeeping and the delta_E = 1
          spike, WITHOUT relying on any recalled class-number formula.
        pass: "exact agreement at every prime where both sides are computable."
        fail: >
          ANY disagreement -> THE ENUMERATION IS NOT GROUND TRUTH. STOP the
          enumerated arm, report both counts and the discrepancy in full, and
          report NO delta_E statistic as ground truth. This is an instrument
          failure and an infrastructure outcome, NEVER evidence about Heuristic
          1 (AGENTS.md rule 5).
      - id: IF-2
        name: "Minimum computed two ways"
        requirement: >
          delta_E from the rank-4 minimum of Nrd/p on P (route Q step Q4) must
          equal delta_E from the rank-3 trace-zero form (step Q5), at 100% of
          TIER-0 and TIER-1 and at a declared uniform random 1% of each higher
          tier. Additionally, at every TIER-0 prime, the reduction-based
          minimum must equal a fully exhaustive brute-force short-vector search
          over the declared enumeration box.
        fail: "any disagreement -> instrument failure; STOP as in IF-1."
      - id: IF-3
        name: "Route agreement"
        requirement: >
          If route F is used at all, its class multiset must equal route Q's at
          every TIER-0 prime and at 10 declared random TIER-1 primes.
        fail: "route F is disqualified as ground truth for this run; route Q governs; report in full."
      - id: IF-4
        name: "Conjugacy-test soundness"
        requirement: >
          Any two orders the canonical form declares conjugate must have
          identical theta series of the trace-zero lattice up to the declared
          bound (a necessary condition for isometry). Report the number of
          pairs checked and any violation.
        fail: "any violation -> the conjugacy test over-merges; STOP as in IF-1."
      - id: IF-5
        name: "AOV bound as a free empirical check"
        requirement: >
          Record max delta_E per prime against X_p = floor((p/2)^{1/3}) and
          report every violation individually.
        note: >
          A violation is a finding about THIS implementation first, since AOV
          Theorem 4.2 is an external theorem this contract does not re-prove.
          It is not reported as a refutation of that theorem.
      - id: IF-6
        name: "Optional external anchor, provenance-labelled"
        requirement: >
          If and only if the run reaches p = 101,051 (outside the mandatory
          range), check whether some class attains delta_E = 36 = 2^2 * 3^2.
        provenance_label_binding: >
          This anchor is reported in research/P13-HEUR-001 section 3 (B4) as an
          anecdote citing AOV arXiv:2607.14624. It is an UNVERIFIED SECONDARY
          QUOTATION and is labelled as such wherever it appears. Agreement is a
          weak positive check; disagreement is a discrepancy to report, NOT a
          refutation of AOV, because the quotation itself is unverified.

  independent_variables:
    - "p (prime), over the tier rule of section 3."
    - "weighting (W-CURVE, W-TYPE, W-MASS), section 4."
    - "B (smoothness bound), over the grid {2,3,5,7,11,13,17,19} for S3/S4."
    - "L (walk length), over {1, 3, 10} x ceil(log2 p), in S1 only."
    - "size model (M1, M2), in S3 only."
    - "object (arithmetic, NULL-A, NULL-B, NULL-B2, NULL-C)."

  # ==================================================================
  # 7. PRE-REGISTERED PREDICTIONS (each able to fail, each with a meaning)
  # ==================================================================
  preregistered_prediction:
    quantity: >
      Whether the random-integer model for delta_E survives its first
      confrontation with exactly enumerated ground truth in the tested body.
    formula: >
      Under the model: P(delta_E is B-smooth | delta_E = n) = Psi(n, B)/n
      exactly; P(delta_E even) = E[floor(n/2)/n]; D2* = 1; and the walk sampler
      reproduces the exact enumerated distribution under W-TYPE.
    source: >
      Heuristic 1 (paper line 69) with Theorem 1.4 ([10], CEP) and Theorem 1.5
      ([4], AOV) as the paper combines them at line 83; the first-moment
      structure from research/P13-HEUR-001 route (b).
    predictions:
      - id: PH1
        statement: "S1 returns SAMPLER-NOT-REJECTED at L = 10*ceil(log2 p)."
        kind: FALSIFIABLE
        if_it_fails: >
          The walk sampler does not reach conjugacy classes uniformly even at
          ten times the naive mixing length, at toy primes. Report it; the
          sampled arm is void at that length; the enumerated arm stands. Do not
          extend the walk length to make it pass -- that would be tuning, and
          the three declared lengths are the whole grid.
      - id: PH2
        statement: "S2 does not meet its three-part rejection condition."
        kind: FALSIFIABLE
        if_it_fails: >
          The strongest available scoped result of this contract: the
          random-integer model is falsified at ell = 2 in the tested body,
          which is exactly the hiding place RT-H3 named. Report the constant
          factor in bits. It does NOT refute the exponent.
      - id: PH3
        statement: "S3 prefers M1 over M2 (the actual-size model over the AOV-bound size model)."
        kind: FALSIFIABLE
        basis: >
          B5/B6: delta_E concentrates a constant factor BELOW (p/2)^{1/3}, so
          the actual-size model should fit better if either does. The paper's
          plotted prediction uses M2.
        if_it_fails: >
          If M2 is preferred, the paper's own plotting convention is the better
          description of the toy-scale body and B6's model-identification
          concern is answered in the paper's favour at toy scale. Report it
          plainly; it favours the paper and must be stated as clearly as a
          negative would be.
        if_neither_fits: >
          If both are rejected by their own goodness-of-fit tests, that is the
          headline of S3 and is a stronger scoped falsification than either
          preference.
      - id: PH4
        statement: "S4's D2* is consistent with 1 in all reached rarity regimes."
        kind: FALSIFIABLE
        if_it_fails: >
          The disjointness assumption underpinning Heuristic 1 fails at the
          tested rarity levels -- the strongest toy-scale refutation available.
          It closes exactly the tested scope (lambda ~ 0.03-0.3, p <= 22,000)
          and says nothing about lambda ~ 2^-60.
      - id: PH5
        statement: "W-CURVE and W-TYPE statistics agree to within their own confidence intervals."
        kind: FALSIFIABLE
        if_it_fails: >
          The measure mismatch RT-H2 raises is MATERIAL at toy scale, and the
          paper's Figures 1-2 (which sample W-TYPE) are measuring a different
          quantity from the one Heuristic 1 states (W-CURVE). Report the
          magnitude of the difference; it is a scoped, quantitative version of
          an objection that has only ever been qualitative.
    verdict_recording: >
      Each of PH1-PH5 is recorded as MET or NOT MET with its numbers. Success
      of the EXPERIMENT is a property of the protocol being executed and
      reported, never of any prediction taking a particular value. A run in
      which all five fail is a successful execution.

  # ==================================================================
  # 8. METRICS
  # ==================================================================
  metrics:
    primary:
      - "per class: delta_E, its full factorization, P+(delta_E), delta_E/X_p, (N1,N2,N3,x,y,z), Galois-stable flag, automorphism count, number of minimal vectors."
      - "per prime: n_types, #SS by brute force where computed, #SS by the verified closed form, the IF-1 identity check with both sides, X_p."
      - "S1: per (prime, L) the S1a MC p-value, the S1b two-sample MC p-value, the S1c chi-square and TV distance with its reference distribution, the S1d exact binomial p-value; Holm-adjusted verdicts; the Fisher-combined p per L; the verdict per L."
      - "S2: p_obs, p_null, Var_obs, Var_null, z_2, the exact binomial p-value against 1/2, Clopper-Pearson 99% CI -- each under all three weightings, each stratified by p mod 8, each per tier and pooled; C1/C2/C3 with their numbers; the verdict."
      - "S3: LLR total and per-sample mean under each weighting; the four stability splits; the NULL-B and NULL-B2 LLR distributions; the randomized-PIT KS statistic and MC p-value for M1 and for M2; the verdict, including NOT-DISCRIMINATED and VOID as available verdicts."
      - "S4: per B and per prime-pool: lambda_hat, D2, D2_ref, D2*, the 99% bootstrap CI, the NULL-C reference distribution; D1 with its calibration verdict; the three rarity regimes with achieved lambda_hat; S4c's P(E-EXISTS) - P(E-SMOOTH); the verdict."
      - "Every control's verdict (IF-1..IF-6, NULL-A..NULL-C) with the evidence it rests on."
    secondary:
      - "delta_E mod ell for ell in {3,5,7,11} with the exact size-matched null (producer's T2)."
      - "Prime-minimum rate: fraction of delta_E that is prime, against the exact size-matched model prediction (producer's T3). An EXCESS of prime minima is the most attack-unfavourable deviation available and is reported with its sign."
      - "The empirical smooth fraction against the B3-corrected first-moment prediction where D1 is calibrated (producer's T4)."
      - "The size distribution delta_E / X_p, its mean and quantiles per prime (B5)."
      - "The W-CURVE minus W-TYPE difference for every statistic."
      - "The u-range actually reached, per prime and overall, stated as an interval."
      - "The smoothest observed sample per prime with its extreme-value probability under M1 and M2, carrying the mandatory non-discriminating label."
      - "Wall-clock per prime, recorded alongside and never substituted for a mathematical quantity, and never used as a stopping criterion."

  scale_relevance:
    tier: toy
    justification: >
      The mandatory range is p <= 2000 and the reach is p <= 22,000, i.e.
      F_{p^2} of at most ~29 bits: `toy` under the mechanical rule of
      docs/claims-and-verification.md (max field bit size <= 32). The optional
      sampled arm reaches p ~ 2^28, i.e. a 56-bit F_{p^2}, which that rule
      would call `medium`; THIS CONTRACT DECLARES toy REGARDLESS. The
      mechanical rule indexes attack hardness by field size, and the quantity
      of interest here is distributional: the reachable u is 1/3 to 1/2 of the
      operating value, so a `medium` label would overstate what any record from
      this run may assert. The minimum governs (docs/claims-and-verification.md:
      a synthesis takes the minimum tier of its inputs) and the ceiling is
      `toy`. No evidence record derived from this run may assert above `toy`.
    correspondence: >
      The Deuring correspondence, in the form the paper's Section 4.2 uses
      (line 244): Hom(E, E^(p)) with the degree form is isometric to the unique
      two-sided ideal P of reduced norm p in O ~ End(E) with the form Nrd/p,
      and delta_E is the norm of its shortest vector. This correspondence is
      what makes the experiment possible at all, and it is NOT merely assumed
      here: control IF-1's identity ties the quaternion-side enumeration to a
      brute-force count of supersingular j-invariants on the curve side, so a
      failure of the correspondence as implemented is detected rather than
      inherited. Conventions cross-checked against Wesolowski FOCS 2022 (HAL
      hal-03340899) as recorded in research/P13-HEUR-001 section 4.

  tail_checks:
    - "The smoothest observed delta_E per prime against its exact extreme-value probability under M1 and M2, reported with the mandatory non-discriminating label (RT-H1(2))."
    - "The delta_E = 1 spike fraction per prime against the class-count identity of IF-1 (B1), and its trend in p."
    - "The largest delta_E per prime against X_p (IF-5), with every violation individually reported."
    - "Monotonicity check: D2* against lambda_hat across the three rarity regimes. A D2* that does NOT move toward 1 as lambda decreases is the inventor-protocol artifact tell and is reported as such."
    - "Stability of every headline statistic across TIER-0 alone, TIER-1 alone, and each higher completed tier alone. A statistic whose sign flips between tiers is reported as UNSTABLE and may not be quoted pooled."

  replication:
    seeds:
      master: 20260802
      walk_sampler: 20260802101
      monte_carlo_ks: 20260802102
      null_a: 20260802103
      null_b: 20260802104
      null_b2: 20260802105
      null_c: 20260802106
      pit_randomization: 20260802107
      tenfold_split: 20260802108
      route_f_sample: 20260802109
      bootstrap: 20260802110
    independent_instances: 1
    what_independent_instances_means_here: >
      The enumerated arm is DETERMINISTIC and complete: it is not a sample, so
      it needs no replication seed and its "replication" is the two-route
      agreement of IF-2/IF-3. The stochastic components (sampler, nulls,
      bootstrap, MC) are seeded above and are exactly reproducible.
    note: >
      One run is authorized. Determinism of the enumerated arm plus exact
      seeding of the stochastic arms makes the run reproducible, which is NOT
      the same as independently replicated. No evidence record from a single
      run may be recorded above `preliminary` strength on the basis of internal
      reproducibility alone.

  # ==================================================================
  # 9. STOPPING RULES -- SCIENTIFIC ONLY. THERE IS NO BUDGET.
  # ==================================================================
  no_budget_declaration:
    binding: true
    text: >
      THERE IS NO BUDGET. No wall clock, no memory ceiling, no run cap, no
      per-phase reserve, no "stop after N seconds". The budgeting mechanism is
      retired repo-wide (AGENTS.md rule 3 as amended; DEC-20260802-fa3b26).
      A contract that states a time, memory or run ceiling is INVALID, and this
      one states none. The Executor must not invent one, must not stop because
      a computation feels long, and must not treat slowness as a result. If
      execution halts for any reason other than a stopping rule below, that is
      an infrastructure outcome (AGENTS.md rule 5), it is reported as such with
      the exact point at which it halted, and the result is scoped to what was
      actually covered (AGENTS.md rule 6 and the handoff envelope's
      scope_reached obligation).

  stopping_rules:
    - >
      NORMAL END: the experiment ENDS when TIER-0 and TIER-1 are completely
      enumerated, all four statistics S1-S4 are computed with all their null
      objects, and every control IF-1..IF-6 has a recorded verdict. Everything
      beyond that is extension.
    - >
      EXTENSION END: TIER-2 and TIER-3 proceed in ascending prime order and end
      when the tier is complete. A tier that is not complete contributes only
      its COMPLETE primes; the partial-prime rule of section 3 governs and a
      partially enumerated prime is discarded entirely.
    - >
      TERMINAL INSTRUMENT FAILURE: if IF-1, IF-2 or IF-4 fails at any prime,
      STOP the enumerated arm immediately, report both computed quantities and
      the discrepancy in full, and report NO delta_E statistic as ground truth.
      This ends the experiment on an instrument failure, which is an
      infrastructure outcome and is NEVER evidence about Heuristic 1.
    - >
      VOID IS TERMINAL FOR ITS OWN STATISTIC, NOT FOR THE RUN: if a null object
      reproduces a signal, that statistic is recorded VOID and the experiment
      CONTINUES with the remaining statistics. A void statistic is never
      repaired by adjusting the instrument, the threshold or the range.
    - >
      SAMPLED-ARM END: if S1 returns SAMPLER-REJECTED at all three walk
      lengths, the sampled arm ENDS -- it is not licensed -- and the enumerated
      arm continues unaffected. Report the rejection; do not add walk lengths.
    - >
      SUFFICIENCY: once TIER-0 + TIER-1 are complete AND the record count is at
      least 10^4 (class, delta_E) pairs, every headline statistic has its
      mandatory scope. Continuing into TIER-2/TIER-3 buys u-range and precision,
      not validity, and stopping at the end of any COMPLETE tier is a fully
      valid terminal state requiring no justification beyond naming the tier.
    - >
      UNDERSPECIFICATION: if this contract is underspecified on any point that
      changes a number -- a convention, a threshold, a weighting, a counting
      rule -- the Executor STOPS and reports the underspecification rather than
      choosing for itself. A choice made by the Executor at execution time is
      not pre-registered and cannot carry a pre-registered threshold.
    - >
      WHAT A PARTIAL RESULT MEANS: a partial result is evidence about exactly
      the primes completely enumerated, the weightings computed, the B values
      reached and the u-range actually attained -- all of which are reported
      explicitly as numbers, not as adjectives. No statistic is extrapolated in
      p from a truncated tier ladder. The ceiling of section 0 applies
      unchanged to a partial result, and a partial result that fails to
      falsify is even less than a complete non-falsification: it is silence.

  invalidation_rules:
    - "IF-1 fails at any prime -> invalid_measurement for the enumerated arm; STOP."
    - "IF-2 fails at any checked class -> invalid_measurement; STOP."
    - "IF-4 fails (conjugacy test over-merges) -> invalid_measurement; STOP."
    - "A partially enumerated prime included in any statistic -> INVALID (section 3 partial_prime_rule)."
    - "Fewer than 10^4 (class, delta_E) records over completed primes -> INCOMPLETE (the producer's own EXP-1 validity floor, retained)."
    - "TIER-0 or TIER-1 not complete -> INCOMPLETE; the mandatory scope was not reached."
    - "Any statistic reported without its null object having been run -> INVALID for that statistic (inventor protocol section 3)."
    - "Any threshold, weighting, counting convention or rarity regime differing from this contract -> INVALID (REM-2: the frozen contract governs)."
    - "Any number in raw-result.json not produced by code in this run, other than values explicitly labelled as read from a named committed file -> INVALID (AGENTS.md rule 9)."
    - "Any use of a floating-point value in a pass/fail comparison without its exact-arithmetic counterpart also reported -> INVALID."

  success_criterion: >
    The run is a SUCCESS if TIER-0 and TIER-1 are completely enumerated with
    IF-1..IF-4 recorded, at least 10^4 (class, delta_E) records are collected,
    and each of S1, S2, S3, S4 is computed under all three weightings with its
    pre-registered threshold evaluated and its null object run, with every
    verdict recorded including VOID, NOT-DISCRIMINATED and INCONCLUSIVE where
    those are what the data give. SUCCESS IS A PROPERTY OF THE PROTOCOL BEING
    EXECUTED AND REPORTED, NEVER OF ANY VALUE OBTAINED. A run in which the
    random-integer model survives every test is a success; a run in which it is
    falsified at ell = 2 is a success; a run in which three statistics come back
    INCONCLUSIVE and one comes back VOID is a success. A run that reports a
    statistic without its null, or that adjusts a threshold after seeing a
    number, is a failure whatever it finds.

  falsification_criterion: >
    THE RANDOM-INTEGER MODEL FOR delta_E IS FALSIFIED IN TESTED SCOPE if any of:
    (a) S2 meets its full three-part rejection condition (C1 and C2 and C3) and
    survives NULL-A; (b) S3 rejects BOTH M1 and M2 by randomized-PIT KS at
    MC p < 0.001 and the rejection survives NULL-A; (c) S4 meets its
    refuted-in-tested-scope condition and survives NULL-C. THE WALK-BASED
    SAMPLER OF SECTION 4.2 IS FALSIFIED IN TESTED SCOPE if S1 returns
    SAMPLER-REJECTED at all three walk lengths. IN EVERY CASE the falsification
    is of the MODEL or of the SAMPLER, at toy primes, in the body of the
    distribution, at constant-factor level -- never of Theorem 1.1, never of
    the exponent, and never of Heuristic 1 at its operating point. NOTHING IN
    THIS CONTRACT CAN CONFIRM HEURISTIC 1.

