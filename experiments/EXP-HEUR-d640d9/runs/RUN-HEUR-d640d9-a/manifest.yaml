    statistics_reported_WITHOUT_a_null_object:
      rule: 'Contract invalidation rule: ''Any statistic reported without its null object
        having been run -> INVALID for that statistic (inventor protocol section 3).'' The
        items below are contract SECONDARY metrics, explicitly ''reported, never gating''.
        The frozen protocol runs NULL-A for S2''s core statistic, for S3''s LLR and goodness
        of fit, and for S4''s D2*, but does NOT pre-register a null arm for these two. None
        was run, and none was added after seeing the numbers. They are therefore recorded
        as INVALID AS FINDINGS and are quoted only as descriptions of the data.'
      why_this_matters_here: It is not a formality in this run. The one statistic that DID
        meet its pre-registered rejection threshold, S2's parity z_2, turned out to be reproduced
        by NULL-A at the same sign and magnitude. Any statistic built from the same object
        by the same estimator is under the same suspicion until its own null has been run,
        and these two have not been.
