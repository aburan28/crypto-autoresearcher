        NULL-A sample under key 'null_A_samples' (13834 forms, one per arithmetic class, same
        primes, same code path) and its minimum histogram under 'NULL_A.delta_null_histogram'.
        Either comparison can be constructed from those records without re-running anything.
    internal_consistency_observations:
    - observation: The ratio p_obs / p_null in S2 is EXACTLY the same rational number, 2951550/2574461
        = 1.146472989880, under all three weightings, even though p_obs itself differs between
        them (W-CURVE 0.403202, W-TYPE 0.338658, W-MASS 0.343068).
      arithmetic_reason_checked_against_this_run_s_own_data: Every class that carries a non-trivial
        weight distinction has delta_E = 1. For W-CURVE the distinction is exactly Galois-stability,
        and IF-1's identity ties Galois-stable to delta_E = 1; the run confirms the flag equals
        (delta_E == 1) at all 13834 classes. For W-MASS the distinction is w > 1, which occurs
        at 305 classes in this run, and at every one of them delta_E = 1 (0 exceptions). delta_E
        = 1 is ODD and has q_i = floor(1/2)/1 = 0, so such a class contributes 0 to the observed
        sum AND 0 to the null sum. The weights therefore cancel out of the ratio while not
        cancelling out of either level. This is a structural check that passed, not a result
        about Heuristic 1.
      consequence_for_PH5: 'PH5 is evaluated on the LEVELS, not the ratio, and the levels
        do differ: the W-CURVE and W-TYPE Clopper-Pearson 99 per cent intervals for the even-fraction
        are disjoint.'
    - observation: 'S1''s Fisher-combined p-values print as 0.0 at all three walk lengths.
        That is a FLOAT UNDERFLOW of the chi-square upper tail, not an exact zero: the statistic
        is 5305.2 on 598 degrees of freedom, whose true tail probability is far below the
        smallest representable double. The pre-registered comparison is ''Fisher-combined
        p < 0.001'', which is decided correctly either way; the statistic itself is recorded
        beside the p-value so the underflow is visible.'
    - observation: 'S1a and S1b return identical Fisher statistics at every walk length. Both
        are saturated: 288 of the 299 primes hit the Monte-Carlo resolution floor 1/(10000+1)
        in both tests, and the remaining 11 are primes with very few classes. The contract
        requires S1a and S1b to AGREE on the verdict; they agree at every length.'
    - observation: 'S4''s B grid saturates: at B >= 7 every n <= X_p is B-smooth for every
        completed prime (max X_p = 9), so B = 7, 11, 13, 17 and 19 give byte-identical lambda_hat,
        D2 and D2* and a S4c gap of exactly 0. This is a property of the reachable X_p, recorded
        rather than presented as five independent measurements.'
