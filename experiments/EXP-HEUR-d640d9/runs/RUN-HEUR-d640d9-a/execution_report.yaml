      scope: Measured at 11 <= p <= 2000 where X_p <= 9, at lambda_hat >= 1.27. It says nothing
        about the gap at the operating point.
  - id: OBS-PH
    what: The five pre-registered predictions, MET / NOT MET.
    PH1: NOT MET -- S1 returns SAMPLER-NOT-REJECTED at L = 10*ceil(log2 p).
    PH2: NOT MET -- S2 does not meet its three-part rejection condition. The three-part condition
      WAS met; the signal is VOID under NULL-A, so falsification criterion (a) does NOT fire
      and the random-integer model is NOT falsified by S2.
    PH3: MET -- S3 prefers M1 over M2. (LLR = +14508.91 under W-CURVE; the S3 verdict itself
      is reading-dependent)
    PH4: NOT MET -- S4's D2* is consistent with 1 in all reached rarity regimes. (0 of 3 regimes
      reached; the 99 per cent CI excludes 1)
    PH5: 'NOT MET -- W-CURVE and W-TYPE statistics agree to within their own confidence intervals.
      The W-CURVE and W-TYPE Clopper-Pearson 99 per cent intervals for the even-fraction are
      DISJOINT: [0.39491191308955087, 0.4115308812448343] against [0.3283150983467096, 0.34911312617580614].
      This is a scoped, quantitative version of the measure mismatch RT-H2 raises, which has
      only ever been qualitative. The comparison basis is an Executor reading because the
      contract names no interval.'
    recording_rule: Success of the experiment is a property of the protocol being executed
      and reported, never of any prediction taking a particular value. Four of five predictions
      came back NOT MET and the run is a successful execution.
  - id: OBS-FALSIFICATION
    what: The contract's falsification criterion, evaluated exactly as frozen.
    (a)_S2_three_part_rejection_surviving_NULL_A: false
    (b)_S3_rejects_BOTH_models_surviving_NULL_A: false
    (c)_S4_refuted_surviving_NULL_C: false
    random_integer_model_falsified_in_tested_scope: false
    walk_based_sampler_falsified_in_tested_scope: true
    MANDATORY_SCOPE: 'Any falsification recorded here is of the MODEL or of the SAMPLER, at
      toy primes, in the BODY of the distribution, at constant-factor level. It is never a
      falsification of Theorem 1.1, of the p^{1/3+o(1)} exponent, or of Heuristic 1 at its
      operating point. NOTHING IN THIS CONTRACT CAN CONFIRM HEURISTIC 1: a statistic that
      fails to reject is a statement about the body at toy primes and nothing else (SP-H,
      binding in both directions).'
  - id: OBS-CEILING
    what: 'WHAT NONE OF THIS BEARS ON. Heuristic 1 is a TAIL statement at u ~ 13.1, where
      rho(13) ~ 2^-60. This run reached u in [0.2354, 3.1699]. The operating point has ZERO
      experimental resolution here, by construction and not by effort. NOTHING measured in
      this run bears on the tail. The absence of a budget does not help and more compute would
      not have helped: the gap is structural.'
  anomalies:
  - id: AN-1
    kind: unexpected observation
    what: S2's pre-registered three-part rejection condition FIRED at 8.65 sigma and was then
      VOIDED by its own null object, which reproduced the effect at 8.74 sigma with the same
      sign.
    why_it_is_recorded: Without NULL-A this run would have reported a falsification of the
      random-integer model's parity prediction at the strongest significance in the contract.
      The null object is the only thing that prevented it. This is the inventor protocol's
      'controls before belief' doing exactly the work it exists to do, and it is recorded
      as an outcome rather than buried as a non-result.
    not_repaired: true
  - id: AN-2
    kind: unexpected observation
    what: S3's two arms disagree in direction. The likelihood ratio prefers M1 (LLR = +14508.91,
      sign stable across all four splits) while the absolute goodness of fit strongly prefers
      M2 (KS D 0.0610 for M2 against 0.3165 for M1), and BOTH models are rejected outright
      at MC p = 1/10001.
  - id: AN-3
    kind: unexpected observation
    what: 'The observed LLR lies BELOW the M1-truth null range: 14508.91 against NULL-B''s
      [15682.01, 16164.30] over 200 replications. The data prefer M1 over M2 by LESS than
      data actually generated from M1 would.'
  - id: AN-4
    kind: scope obstruction, recorded not worked around
    what: 'S4''s three rarity regimes ALL selected B = 2 and ALL are NOT REACHED: the smallest
      lambda_hat attainable over the entire pre-registered B grid at these primes is 1.2726,
      against targets 0.30 / 0.10 / 0.03. The monotonicity tail check -- the direction of
      D2* as lambda decreases, which the contract calls the discriminating quantity -- is
      therefore not observable at all in this scope.'
    not_worked_around: No B outside the frozen grid was tried and no target was moved. The
      achieved lambda_hat is reported and the regimes are recorded NOT REACHED, exactly as
      the contract directs.
  - id: AN-5
    kind: numerical note
    what: S1's Fisher-combined p-values print as 0.0. That is a float underflow of the chi-square
      upper tail at statistic 5305.2 on 598 degrees of freedom, not an exact zero. The pre-registered
      comparison is 'p < 0.001' and is decided correctly either way; the statistic is recorded
      beside the p-value.
  - id: AN-6
    kind: structural check that passed
    what: 'The ratio p_obs / p_null in S2 is the EXACT same rational number under all three
      weightings, 2951550/2574461, although the levels differ. The reason is checkable in
      this run''s own data: every class with a non-trivial weight distinction has delta_E
      = 1 (all 305 classes with w > 1, 0 exceptions), and delta_E = 1 is odd with q_i = 0,
      so it contributes 0 to both sums. Recorded because an exact coincidence across three
      weightings would otherwise look like a copied value.'
  - id: AN-7
    kind: infrastructure event, predecessor task
    what: This run supersedes TASK-20260802-4bd310, which an external API session limit terminated
      mid-run (INCIDENT-20260803-P13-05) before any run directory existed.
    what_was_carried_forward: NO verdict, NO threshold, NO statistic, NO conclusion. Only
      source code, which the re-dispatch states has no evidential standing; it was re-validated
      from scratch and then changed as recorded in deviation D-6. Under AGENTS.md rule 5 the
      crash is not evidence about anything.
    mitigation_applied: Every completed prime is now appended to a JSON-lines file the moment
      it is produced, and a resumed run skips what is already there, so an interruption leaves
      a recoverable partial rather than nothing.
