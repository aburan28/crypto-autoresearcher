  - id: D-6
    what: The implementation file left behind by the crashed predecessor task TASK-20260802-4bd310
      was reused as a starting point and then modified.
    why: 'The re-dispatch states that file has no evidential standing and may be reused, rewritten
      or discarded. It was re-validated from scratch here (instrument controls IF-1..IF-5
      all recomputed) and then changed in six ways, none of which touches a threshold, a grid
      or an estimator: durable per-prime JSON-lines persistence with resume; a radius-doubling
      wrapper so a short-vector search can never return empty; exact-but-faster samplers and
      tail functions (beta-splitting binomial, regularised incomplete beta, level-decomposed
      NULL-C); precomputed exact M1/M2 tables replacing an O(n) recomputation per sample;
      the dual-reading NULL-B/NULL-B2 arms of D-3; and two checks the predecessor file did
      NOT implement -- the NULL-A arm of S3''s goodness-of-fit test, which falsification criterion
      (b) REQUIRES, and the section 7 PH1..PH5 MET / NOT MET record.'
    recorded_not_tuned: true
