  protocol_deviations:
  - id: D-1
    what: TIER-2 and TIER-3 were not included in this run.
    why: 'A frozen stopping rule fires exactly here. The contract''s NORMAL END is ''TIER-0
      and TIER-1 completely enumerated, all four statistics S1-S4 computed with all their
      null objects, and every control IF-1..IF-6 with a recorded verdict''; its SUFFICIENCY
      rule adds that once TIER-0 + TIER-1 are complete and the record count is at least 10^4,
      ''stopping at the end of any COMPLETE tier is a fully valid terminal state requiring
      no justification beyond naming the tier''. The tier named is TIER-1. THIS IS NOT A BUDGET
      AND NO BUDGET WAS INVENTED: there is no wall-clock, memory or run ceiling anywhere in
      this run, nothing was stopped because it felt long, and the extension was not declined
      on cost.'
    measured_fact_recorded_beside_it: 'TIER-2 enumeration WAS begun before this decision,
      on a separate earlier invocation, and reached 50 complete TIER-2 primes. NONE of them
      is used, reported, or included in any statistic here, and none appears in raw-result.json.
      They are named rather than hidden. The reason they are not folded in is an artifact-durability
      fact, not a research budget: at the measured 2.6 kB per (class, delta_E) record, a complete
      TIER-0+TIER-1+TIER-2 raw-result.json is about 170 MB, above GitHub''s hard 100 MB per-file
      limit, so the run package could not be pushed to a branch with an open PR and would
      therefore not be durable at all.'
    what_it_costs_the_result: 'u-range and precision, not validity. The enumerated u reached
      is [0.2354, 3.1699] under log(X_p)/log(B) against a contract ceiling of about 4.5; TIER-3
      would have reached about 4.46. Two pre-registered items are affected and both have pre-registered
      fallbacks that were used: S2''s C3 falls back to ''TIER-0 alone against TIER-1 alone'',
      which the contract specifies verbatim for exactly this case; and the tail check ''stability
      across each higher completed tier alone'' has no higher tier to run on.'
    recorded_not_tuned: true
  - id: D-2
    what: The OPTIONAL sampled arm at p ~ 2^16..2^28 was not run.
    why: 'PRIMARY REASON, and it is the contract''s own UNDERSPECIFICATION stopping rule rather
      than a cost judgement: the contract fixes the sampled arm''s prime rule but fixes NO
      sample size for it. N_walk is defined only inside S1, as max(20 * n_types(p), 20000),
      and n_types(p) is not computable at p ~ 2^28 by any method in this contract -- exact
      enumeration at that size is what the sampled arm exists to avoid. Choosing a sample
      size at execution time would be a choice the Executor made, not a pre-registered one,
      and the contract states that such a choice ''cannot carry a pre-registered threshold''.
      SECONDARY: the arm is declared OPTIONAL and STRICTLY CONDITIONAL on S1, and S1 returned
      SAMPLER-REJECTED at all three walk lengths, which fires the contract''s SAMPLED-ARM
      END rule (''if S1 returns SAMPLER-REJECTED at all three walk lengths, the sampled arm
      ENDS -- it is not licensed'').'
    what_it_costs_the_result: The u-range that the sampled arm would have reached (u <~ 9,
      still far below the operating u ~ 13.1) is not covered. Reported as a scope gap.
    recorded_not_tuned: true
  - id: D-3
    what: NULL-B and NULL-B2 are computed under BOTH coherent readings of the frozen construction,
      and both verdicts are reported.
    why: 'The contract says ''delta_E replaced by a uniform random integer in [1, n_i]'' (resp.
      ''[1, X_p]''), and both S2''s null and S3''s LLR then need ''n_i, the observed delta_E
      of sample i''. After the replacement that phrase has two readings -- the ORIGINAL delta_E,
      or the replacement -- and they give different numbers. Under the contract''s UNDERSPECIFICATION
      rule the Executor must not choose, so neither was chosen: both are computed and both
      are reported, and S3 additionally reports its verdict under both readings of the void
      criterion''s own gloss (''not separated from both''), i.e. four verdicts in a matrix.'
    outcome: All four S3 readings AGREE in this run, so no verdict here depends on the unresolved
      reading. Recorded anyway, because agreement was not guaranteed in advance.
    recorded_not_tuned: true
  - id: D-4
    what: Three quantities the contract leaves open were fixed by the Executor and are labelled
      as Executor readings wherever they appear.
    why: '(i) The randomised-PIT Monte-Carlo null replicate count: the contract fixes 10,000
      for S1a and for the S4 bootstrap and NULL-C, but says only ''with a Monte-Carlo null''
      for S3''s goodness of fit. 10,000 was used, matching the counts the contract does fix;
      the resolution floor 1/(10000+1) is below the 0.001 rejection threshold, so the test
      can fire. (ii) The S4 ''regime REACHED'' test: the contract fixes the B-selection rule
      (nearest achieved lambda_hat to each target) but not what counts as reaching the target.
      A factor of two was declared; every raw lambda_hat is reported so any other test can
      be applied. (iii) The S4 ''prime pool'': the contract says ''per prime-pool'' without
      defining the pool, so BOTH the all-primes pool and one pool per tier are computed and
      reported.'
    recorded_not_tuned: true
