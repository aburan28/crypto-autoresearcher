experiment:
  id: EXP-MTGT-15b1b3
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-465744
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE x-SUPPORT AS A TRACKED OBJECT, AND THE DIRECTION ASYMMETRY NOBODY IN THIS CORPUS HAS
    RECORDED: because phi commutes with negation, x(phi(R)) is a degree-ell rational function of x(R)
    alone, so a preprocessed set''s x-support is a genuinely COMPATIBLE lossy projection -- and under
    it, PUSHING a factor base FORWARD preserves its description degree exactly (a resultant bound)
    while PULLING one BACK multiplies that degree by ell, so transport is direction-asymmetric for
    field-level preprocessing and symmetric for group-level preprocessing; the measurable question
    is whether ANY isogeny in a class maps a box to a set with above-random additive energy'
  status: draft
  objective: "(A) THE OBJECT, AND WHY IT PASSES THE LOSSY-PROJECTION TEST WHERE THE OBVIOUS ALTERNATIVES\
    \ FAIL. For a set A of points on E, define its x-SUPPORT X(A) := {x(R) : R in A} subset F_p. This\
    \ is a lossy projection: it forgets the y-coordinates (hence the sign of each point), the logarithms,\
    \ and the group structure entirely. It is nevertheless a COMPATIBLE projection for the operation\
    \ \"apply an isogeny\", for a precise reason: an F_p-isogeny of curves in Weierstrass form satisfies\
    \ phi(-R) = -phi(R), so x(phi(R)) is a function of x(R) alone. Write it f_phi, a rational function\
    \ of degree deg phi = ell. Then\n    X(phi(A)) = f_phi( X(A) )   EXACTLY, as sets.\nThe retained\
    \ part propagates deterministically and the discarded part (sign, logarithm) is never consulted.\
    \ Contrast the two projections that FAIL the test and are recorded here as the boundary: the distinguished-point\
    \ predicate (discards the group structure, retains the encoding, and the encoding is what phi\
    \ scrambles) and the y-coordinate alone (not even well defined as a function of the point up to\
    \ negation). X(A) is the one field-level projection of a preprocessing set that survives the test,\
    \ which is why it is the object worth tracking rather than an arbitrary choice of coordinates.\n\
    (B) THE DIRECTION ASYMMETRY -- THE STRUCTURAL FINDING, AND IT IS DECIDED BY ALGEBRA AT ZERO COMPUTE.\
    \ Let F = {R in E : g(x(R)) = 0} be a Semaev-style factor base cut out by a polynomial g of degree\
    \ B (for the classical prime-field choice, g = prod_{v in [0,B)} (x - v), i.e. an interval).\n\
    \  FORWARD (push F to E' by phi). The image X(phi(F)) = f_phi(X(F)) has at\n  most B elements,\
    \ because a map sends B points to at most B points. Its\n  vanishing polynomial is\n      g'(X)\
    \ = Res_x( g(x), X*den_phi(x) - num_phi(x) ),\n  which has degree at most B in X. SO THE DESCRIPTION\
    \ DEGREE IS PRESERVED:\n  deg g' <= deg g = B, generically with equality.\n  BACKWARD (pull a\
    \ factor base on E' back to E by the same phi). The\n  preimage f_phi^{-1}(V) of a set V of size\
    \ B has up to ell*B elements, and\n  its vanishing polynomial has degree up to ell*B. SO THE DESCRIPTION\
    \ DEGREE\n  IS MULTIPLIED BY ell.\n  CONSEQUENCE, AND IT IS ACTIONABLE: for FIELD-LEVEL preprocessing\
    \ the\n  direction of transport matters and forward is strictly better. For\n  GROUP-LEVEL preprocessing\
    \ (a known-log table) both directions are free and\n  identical (T1). THIS ASYMMETRY IS ABSENT\
    \ FROM EVERY RECORD IN THIS CORPUS\n  and it is the concrete reason why IDEA-20260807-a127ab's\
    \ Mode B (pull the\n  TARGET back, which is two POINTS and has no description degree) is safe\n\
    \  while \"pull the factor base back\" would not be.\n\n(C) WHAT IS PRESERVED IS NOT WHAT IS USEFUL,\
    \ AND THAT IS THE MEASURABLE QUESTION. Degree preservation is necessary for the Groebner route\
    \ and says nothing about the two other routes to decomposition:\n  ENUMERATION. Gaudry/Semaev-style\
    \ decomposition over an INTERVAL is testable\n  by comparison: given a candidate x, \"is x < B\"\
    \ costs one comparison. Over\n  f_phi([0,B)) there is no such test short of membership in an unstructured\n\
    \  set of size B. Interval-ness is not a degree property and is predicted\n  destroyed.\n  LATTICE\
    \ / SMALL-ROOT. Box-constrained solving needs the constraint to be a\n  BOX, i.e. an interval\
    \ in the additive group. Predicted destroyed for the\n  same reason.\nThe graded statistic that\
    \ captures both, and that has an exact positive control, is the ADDITIVE ENERGY\n    E(V) := #{\
    \ (v1,v2,v3,v4) in V^4 : v1 + v2 = v3 + v4 }.\nFor an interval of size b, E ~ (2/3) b^3; for a\
    \ uniformly random set of size b in F_p with b >> sqrt(p), E ~ b^4/p + b^2. THE PREDICTION:\n\
    \  at ell = 1 (an F_p-isomorphism, which acts on x by x -> u^2*x for short\n  Weierstrass), E(f_phi(V))\
    \ = E(V) EXACTLY, because dilation is an\n  automorphism of (F_p, +) -- a RIGOROUS positive control,\
    \ checkable by exact\n  integer equality;\n  at ell >= 2, E(f_phi(V)) at the random baseline.\n\
    A single ell >= 2 with E above the random baseline by a factor 2 would mean an isogeny x-map preserves\
    \ additive structure, which would be a genuinely new fact about isogenies and would reopen the\
    \ class-wide factor-base search.\n(D) THE SEARCH THAT MAKES THIS MORE THAN A SANITY CHECK. A toy\
    \ isogeny class contains many curves and many small-ell edges. Enumerate ALL of them and ask:\
    \ does ANY edge in the class map a box to a set with above-random additive energy? This is a search\
    \ over a structured family of low-degree rational maps, not a single measurement, and it is the\
    \ only place in lane L13 where a positive result is even conceivable. PRE-REGISTERED EXPECTATION:\
    \ no. But the search is cheap, the null is exact, and the positive control is rigorous -- which\
    \ is the profile of a measurement worth taking rather than asserting."
  resource_label: R1 primary (x-coordinates as field elements, which is what escapes the generic group
    model), R4 (the isogeny graph supplies the family of maps f_phi). R8 only in framing, since the
    object measured is not the preprocessing accounting but the set the preprocessing lives on.
  admissibility: admissible
  admissibility_argument: A generic-group oracle returns opaque labels and cannot answer "what is
    the additive energy of the x-support of this set", "is x(R) in [0, B)", or "what is the degree
    of the polynomial vanishing on this x-set". Those are questions about F_p, i.e. resource R1, which
    the DECOMPOSITION.md section 2 taxonomy lists precisely because it is not group-operation output.
    The KN-FIND-b7e091 closure covers incidence and endomorphism-image oracles and does not reach
    here. The record is admissible and its expected answer is still negative -- an admissible resource
    whose measured contribution is zero is the honest and most likely outcome, and stating that in
    advance is what keeps the record from being a fishing trip.
  reachability_gate: 'LOWEST IN THE LANE. The measurements need EDGES, not destinations: every statistic
    is computed from a single isogeny out of a curve, and the class-wide search of section (D) wants
    MANY edges rather than a SPECIFIED curve. So the vectorization hardness of T5 does not bind at
    all -- the record consumes exactly the cheap half of the dichotomy in DECOMPOSITION.md T5 ("a
    uniformly random curve in the class is reachable in O(log p) isogeny steps: cheap"). Cost per
    edge: one kernel-subgroup search plus one Velu construction, O(ell^3) field operations in the
    conservative ordinary-curve model (research/JMV004_branch_a_scouting_20260726.md, SCOUTING). At
    toy scale the class is fully enumerable and every edge is available by breadth-first search. If
    a positive were found in section (D), the reachability question would immediately become binding
    -- because exploiting a good edge means reaching its source curve -- and that is recorded here
    as the cost the positive branch would have to pay.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): Step 1''s symbolic resultant and preimage count
      at ell = 2, 3. STAGE 1 (minutes): Step 2''s three known-answer instrument validations. No isogeny
      image may be measured until all three pass. STAGE 2 (minutes, THE CHEAP DISCRIMINATOR): the
      ell = 1 arm and one ell = 2 arm at p ~ 1009 with b = 32. Two additive-energy numbers, one of
      which is predicted exactly and one at the random baseline. This separates the dichotomy and
      validates the instrument in a single short run. STAGE 3 (low hours): Steps 4, 5, 7 -- the ell
      and path-length sweeps and the direction experiment. STAGE 4 (hours): Step 6''s class-wide search
      with its pre-registered threshold, and Step 8''s Semaev consequence measurement.'
    mechanism: 'STEP 1 -- ZERO-COMPUTE ALGEBRA, HARD GATE. Write f_phi explicitly for ell = 2 and
      ell = 3 from Velu. Form g'' = Res_x(g, X*den - num) symbolically for a small interval g and
      confirm deg g'' <= deg g. Separately confirm that f_phi^{-1} of a single point has up to ell
      preimages, establishing the backward degree inflation. If either fails, section (B) is wrong
      and the record is superseded before compute. STEP 2 -- INSTRUMENT VALIDATION ON KNOWN ANSWERS.
      Compute E(V) for V an interval of size b (must equal the exact interval formula), for V a random
      set (must match the random baseline), and for V = u^2 * interval (must equal the interval value
      EXACTLY, by dilation invariance). Only after all three pass may any isogeny image be measured.
      STEP 3 -- THE ell = 1 ARM. For each F_p-isomorphism class representative, compute f_phi(V) and
      confirm E(f_phi(V)) = E(V) exactly. This is the rigorous positive control and it is blocking.
      STEP 4 -- THE ell SWEEP. For ell in {2, 3, 5, 7, 11, 13}, compute f_phi(V) and measure: additive
      energy, 3-term arithmetic progression count, |f_phi(V) intersect V|, the size of the largest
      interval contained in f_phi(V), and the maximum of |f_phi(V) intersect (any interval of length
      b)|. Compare each against the interval value, the random baseline and the ell = 1 value. STEP
      5 -- PATH LENGTH SWEEP. Compose 1, 2, 3 steps and confirm monotone decay of every retained-structure
      statistic to the random baseline. STEP 6 -- THE CLASS-WIDE SEARCH of section (D). Enumerate
      every small-ell edge of an enumerable toy class and record the additive energy of the image
      of a fixed box under each. Report the MAXIMUM over the class, with its multiple-comparison correction
      stated in advance: for K edges tested at significance alpha, the expected number of spurious
      exceedances is K*alpha and the reporting threshold is set accordingly BEFORE the search runs.
      STEP 7 -- THE DIRECTION EXPERIMENT. Push a factor base forward and record deg g''; pull a factor
      base back and record the degree of the vanishing polynomial of the preimage. Confirm the predicted
      B versus ell*B. STEP 8 -- DOWNSTREAM CONSEQUENCE, MEASURED NOT ASSUMED. Run the harness''s m
      = 3 Semaev decomposition measurement on E'' over the pushed-forward factor base and on E over
      the original, matched seeds, and report the solving-degree proxy for both. Predicted: no difference
      beyond run-to-run spread, because the description degree is what the Groebner route sees.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-set null of matched size
  - ell = 1 dilation positive control (exact integer equality)
  - planted-interval control through the same pipeline
  - random degree-ell rational map (isogeny-versus-degree disambiguator)
  - multiplicity profile of g' (trivial-collapse control)
  - pre-registered multiple-comparison threshold for the class-wide search
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, THREE-PART. (1) RANDOM-SET NULL: a uniformly\
    \ random subset of F_p of the SAME SIZE as\n  f_phi(V), measured on the identical statistics pipeline.\
    \ Every \"structure\n  destroyed\" claim is a claim of agreement with this null, so the null is\n\
    \  simultaneously the control and the prediction, and the test is whether the\n  treatment DEVIATES\
    \ from it.\n(2) RIGOROUS POSITIVE CONTROL: the ell = 1 arm, where E(u^2*V) = E(V) must\n  hold\
    \ as EXACT INTEGER EQUALITY. An instrument failing this cannot\n  distinguish \"the map destroyed\
    \ the structure\" from \"the pipeline never\n  applied the map\", which is precisely the EXP-ISADV-001\
    \ failure mode.\n(3) PLANTED-STRUCTURE CONTROL: inject a set that IS an interval but is\n  presented\
    \ through the same pipeline as an image; the pipeline must report\n  interval-level additive energy.\
    \ An instrument that reports random-level\n  energy for an actual interval is broken.\nDECAY PARAMETER:\
    \ ell, and secondarily the path length L. Every retained-structure statistic must decay MONOTONICALLY\
    \ from its ell = 1 value to the random baseline as ell grows and as L grows. A statistic that\
    \ does not decay is the canonical artifact tell (docs/inventor-protocol.md, controls before belief)\
    \ and voids the run set."
  independent_variables: []
  metrics:
    primary:
    - additive energy, 3-AP count, box intersection, largest contained interval
    - deg g' and its multiplicity profile, forward and backward
    - exact random and interval baselines at the tested (b, p)
    - per-edge statistics for the class-wide search, with K reported
    secondary:
    - Semaev solving-degree proxy and basis size per arm
    - wall clock and peak memory per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: additive energy of f_phi(V) normalised to the random baseline, ell >= 2
    formula: Ratio in [0.8, 1.25] at every tested ell and every tested box size. A ratio above 2 at
      any ell >= 2, surviving the random-map nearby-object control and the multiple-comparison threshold,
      is the falsifier and would be the lane's only genuinely new fact.
    source: pre-registered in IDEA-20260807-465744 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'SMALL b RELATIVE TO sqrt(p). The random additive-energy baseline changes regime at b ~ sqrt(p):
    below it the b^2 diagonal term dominates and every set looks structured. Box sizes must straddle
    sqrt(p) and the regime must be reported with every number.'
  - ROOT COLLISION. f_phi is ell-to-1 on the x-line, so distinct box elements can map together, shrinking
    the image and inflating per-element statistics. The image size must be reported alongside every
    statistic.
  - POINTS AT INFINITY AND POLES. f_phi has poles at the x-coordinates of kernel points; box elements
    hitting a pole map to infinity and must be excluded explicitly and counted, not silently dropped.
  - MODEL DEPENDENCE. The x -> u^2*x form of an F_p-isomorphism is specific to short Weierstrass.
    One model is frozen for the whole line, and the ell = 1 control is model-specific.
  - MULTIPLE COMPARISONS in the class-wide search. With K edges tested, some will exceed any fixed
    threshold by chance. The threshold is fixed before the search and K is reported.
  - x-ONLY AMBIGUITY. X(A) identifies R with -R, so a set of S points may have fewer than S x-values.
    Reported per set.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Ratio in [0.8, 1.25] at every tested ell and every tested box size. A ratio above
    2 at any ell >= 2, surviving the random-map nearby-object control and the multiple-comparison
    threshold, is the falsifier and would be the lane's only genuinely new fact.
  falsification_criterion:
  - deg g' > deg g in any cell. Section (B)'s forward bound is false; the record is superseded rather
    than amended.
  - The backward degree does not grow with ell. Section (B)'s asymmetry is false and the actionable
    consequence (push forward, do not pull back) evaporates.
  - E(u^2*V) != E(V) exactly. Instrument broken; no ell >= 2 number is reportable.
  - Additive energy of f_phi(V) exceeds twice the random baseline at any ell >= 2, above the multiple-comparison
    threshold and surviving the random-map control. Isogeny x-maps preserve additive structure; this
    is the positive branch, is a new fact about isogenies rather than an attack, and requires independent
    replication before any interpretation.
  - Retained-structure statistics do not decay with ell or with path length. Artifact tell; the run
    set is void.
  - The random-map nearby-object control shows the SAME behaviour as isogeny maps in a case where
    isogeny maps showed structure. The measurement is about degree, not about isogenies, and no isogeny-specific
    claim may be made.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-465744
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
