experiment:
  id: EXP-ICEX-b8c865
  hypothesis_id: H-ICEX-4b2e19
  derived_from_idea: IDEA-20260815-1570fe
  question_id: RQ-QRE-6dba8c
  batch_id: BATCH-fced88
  version: 1
  title: >-
    THE END-TO-END ASSEMBLY WITH FIVE DECLARED UNITS AND A REFUSAL RULE- a
    zero-simulation, zero-hardware arithmetic assembly that converts a filed
    logical-circuit ECDLP resource estimate into an attack cost by charging
    the repetition count, the classical post-processing and the
    error-corrected execution, each in its own unit, compared only in
    physical-qubit-seconds, with a degenerate-parameter reproduction gate, a
    non-curve (RSA) control instance, and a hard block on any output before a
    second primary source is filed with its input table extracted
  status: designed
  objective: >-
    (A) THE UNCERTAINTY. This program cites circuit-level quantum ECDLP
    numbers. An attack is not a circuit- it is repetitions, classical
    post-processing and error-corrected execution. The uncertainty reduced is
    how large the assembly factor F is, which term dominates it, and whether
    F is a property of the assembly rather than of elliptic curves.
    (B) WHAT IS BUILT. A five-unit arithmetic assembly with unit tags on
    every value and a harness-level REFUSAL of any cross-unit operation
    without a declared conversion. Nothing is simulated; no quantum hardware,
    no circuit synthesis, no curve arithmetic.
    (C) THE BLOCKING PRECONDITION, WHICH THIS CONTRACT DOES NOT ASSUME AWAY.
    RQ-QRE-6dba8c constraint 1 forbids recording any pipeline output before
    at least two primary resource-estimation papers are filed as KN-LIT
    entries with their input tables extracted. TODAY EXACTLY ONE QUALIFIES-
    KN-LIT-099 (citation_verified 'read', full simulation table reproduced in
    the entry). The nearest candidates, KN-LIT-1460, KN-LIT-1463,
    KN-LIT-1882, KN-LIT-771 and KN-LIT-1759, are title-only bulk-seeded
    entries whose own text records that no abstract was extracted. STAGE 0 of
    this contract is therefore a LITERATURE-EXTRACTION GATE and no
    end-to-end number is emitted before it closes.
    (D) THE SECOND BLOCK, WHICH IS MATHEMATICAL RATHER THAN PROCEDURAL.
    KN-LIT-099's counts are FAULT-FREE LOGICAL counts with no error
    correction, and it states no per-run success probability. So the
    repetition term and the error-correction term- which together are the
    whole of F- cannot be evaluated from that source. They are SWEPT over
    declared ranges and reported per level, and the fact that they cannot be
    evaluated from the filed corpus is itself a first-class deliverable about
    the completeness of the estimates this program cites.
    (E) WHAT IS NOT DECIDED. Nothing about hardware, nothing about the
    correctness of the source's circuit counts, and- under RQ-QRE-6dba8c's
    binding constraint- NO date, timeline, arrival probability or policy
    recommendation of any kind.
  inputs:
    cost_unit: >-
      SIX DECLARED UNITS, FROZEN BEFORE EXECUTION. U1 LOGICAL TOFFOLI GATES
      (count). U2 LOGICAL QUBITS (count). U3 PHYSICAL QUBITS (count). U4
      SECONDS. U5 CLASSICAL 64-BIT WORD OPERATIONS. U6
      PHYSICAL-QUBIT-SECONDS = U3 * U4, THE ONLY UNIT IN WHICH TWO COSTS ARE
      COMPARED. Every emitted value carries its tag.
    unit_discipline: >-
      BINDING AND ENFORCED BY THE HARNESS, NOT BY CONVENTION. The harness
      REFUSES to add, subtract, divide or compare two tagged values whose
      tags differ; a cross-unit operation is legal only through a named
      conversion function whose factor and provenance are recorded in the
      manifest and printed beside the result. IN PARTICULAR- no Toffoli count
      is ever added to or subtracted from a classical word-operation count;
      no logical qubit count is ever added to a physical qubit count; and no
      quantity is ever divided by a quantity of a different unit to produce
      an untagged 'factor'. A run emitting an untagged value, or an
      unconverted cross-unit operation, is INVALID. This gate exists because
      a red-team pass on this program found a total denominated in field
      operations from which group operations had been subtracted, which
      flipped a headline; the same failure is available here in five ways.
    feasibility_gate: >-
      THE HARNESS REFUSES TO EMIT A NUMBER IT CANNOT SOURCE. A cell is
      reported as UNEVALUABLE, with the missing input named, and is NEVER
      assigned a value, when- the per-run success probability is not present
      in any filed source (then r is reported only as a swept range, never as
      a point); the error-correction layer is not present in any filed source
      (then every U3, U4 and U6 figure is BLOCKED); a required constant has
      no filed source (RQ-QRE-6dba8c constraint 3- an unsourced constant
      fails review); or fewer than two primary sources are filed with
      extracted input tables (then NO pipeline output is recorded at all).
      Filling an unevaluable cell with a plausible value produces a confident
      reproduction of something no source said, and is the dominant failure
      mode of this contract.
    procedure: >-
      STAGE 0 (LITERATURE GATE, blocking, no compute). Establish that at
      least two primary resource-estimation sources are filed as KN-LIT
      entries WITH INPUT TABLES EXTRACTED. KN-LIT-099 qualifies today. The
      second must be produced by reading a primary source and filing a new
      entry- title-only bulk-seeded entries do not qualify and the contract
      names KN-LIT-1460, KN-LIT-1463 and KN-LIT-1882 as candidates whose
      current entries explicitly record that no abstract was extracted. NO
      OUTPUT IS EMITTED BEFORE THIS GATE CLOSES.
      STAGE 1 (HARD GATE, minutes). Degenerate-parameter reproduction- success
      probability 1, zero classical cost, cycle time 1, code distance 1. The
      assembly must return KN-LIT-099's recorded 2330 / 1.26e11 at n = 256
      and 1014 / 9.44e9 at n = 110. Mismatch halts.
      STAGE 2 (minutes). The unit-refusal self-test- deliberately attempt
      each forbidden cross-unit operation and confirm the harness refuses all
      of them. A harness that permits one is not the instrument this contract
      specifies.
      STAGE 3 (minutes). The repetition sweep at r in {1, 10, 100, 1000},
      reported per level, with r marked UNKNOWN-FROM-SOURCE on every row.
      STAGE 4 (minutes, conditional on Stage 0's second source). The
      error-correction sweep over declared code distances and at least three
      cycle times; F computed in U6 per grid point; the dominant term
      identified per grid point.
      STAGE 5 (NON-CURVE CONTROL). The identical assembly on the source's RSA
      comparison row, reported beside the ECDLP rows, including the source's
      OWN recorded internal disagreement for that row (the entry records the
      ePrint text and table giving 1.86e13 Toffoli where the published
      version's summary quotes 1.5e14). Both figures are carried; neither is
      silently selected.
      STAGE 6 (zero compute). The unevaluable-cell table, the
      missing-input list, and the identifying five-tuple attached to every
      emitted row.
    mechanism: >-
      STEP 1. Represent every quantity as a (value, unit_tag, source_ref)
      triple. A quantity with source_ref null may not be emitted
      (RQ-QRE-6dba8c constraint 3).
      STEP 2. Implement conversions as named functions, each recording its
      factor and the filed source of that factor in the manifest. A
      conversion with no filed source is refused at call time.
      STEP 3. Compute F only in U6, only between two U6 values, and only
      after both conversions have been recorded.
      STEP 4. Run the whole pipeline twice- once on the ECDLP rows and once
      on the RSA row- through one code path, so that the non-curve control
      cannot diverge by construction.
      STEP 5. Emit each row as the identifying five-tuple (circuit cost, r,
      code distance, cycle time, classical term) plus F, never as F alone.
    instrument: >-
      A pure-Python derivation-aid script with exact arithmetic on the filed
      table. No quantum simulation, no circuit synthesis, no curve
      arithmetic, no network access at run time; the filed KN-LIT entries are
      the only inputs and their sha256 is recorded.
  controls:
    - >-
      NULL 1, DEGENERATE-PARAMETER REPRODUCTION (blocking). Success
      probability 1, zero classical cost, cycle time 1, code distance 1 must
      return the source's circuit-only figures at BOTH calibration points
      (n = 256 and n = 110). Matching one is not reproduction.
    - >-
      NULL 2, THE NON-CURVE CONTROL INSTANCE (REQUIRED under the standing
      scope constraint of pfdr-battery-20260904). RSA factoring, from the
      same source's comparison row, costed through the IDENTICAL assembly in
      one code path. The end-to-end assembly reads no curve structure, so a
      non-curve object of the same shape should reproduce F. PREDICTED- it
      does, within a factor 2. Consequence stated in advance- if it does,
      nothing here may be quoted as an ECDLP-specific finding.
    - >-
      NULL 3, THE CLASSICAL BASELINE IN MATCHED UNITS. Pollard rho at
      0.886*sqrt(N) GROUP OPERATIONS converted into U6 under a declared,
      filed classical-hardware model, reported beside the quantum figure. A
      quantum estimate not comparable to a classical one in one unit is not
      decision-relevant; a comparison made without the conversion recorded is
      invalid.
    - >-
      NULL 4, THE UNIT-REFUSAL SELF-TEST. Each forbidden cross-unit operation
      is attempted deliberately and must be refused. A harness that permits
      any of them voids the run.
    - >-
      CYCLE-TIME SWEEP CONTROL. At least three cycle times, since the wall
      clock scales directly with the assumed value and a single assumed value
      would determine the answer.
    - >-
      MISSING-TERM CONTROL. Unreported terms are MARKED, never estimated. The
      unevaluable-cell table is a required artifact and its size is reported
      prominently, not in a footnote.
  independent_variables:
    - expected repetition count r in {1, 10, 100, 1000}, marked unknown-from-source
    - code distance, over a declared range supplied by the second filed source
    - cycle time, at least three declared values
    - instance- ECDLP rows (n in {110, 160, 192, 224, 256, 384, 521}) against the non-curve RSA control row
    - source version for the RSA row (the ePrint table figure and the published summary figure, both carried)
  metrics:
    primary:
      - >-
        end-to-end cost in PHYSICAL-QUBIT-SECONDS (U6), per grid point, with
        each of the three terms reported separately in its own unit and its
        conversion factor printed beside it
      - >-
        F = end-to-end / circuit-only, dimensionless, formed only from two U6
        values
      - >-
        F(ECDLP) / F(RSA), dimensionless, per grid point
      - >-
        classical post-processing share of the end-to-end cost,
        dimensionless fraction after conversion into U6
      - >-
        identity of the dominant end-to-end term, per grid point
      - >-
        the identifying five-tuple (circuit cost U1/U2, r, code distance,
        cycle time, classical term U5) attached to every emitted row
    secondary:
      - the classical rho baseline in U6 with its conversion recorded
      - the unevaluable-cell table with the missing input named per cell
      - the unit-refusal self-test results, one line per forbidden operation
      - sha256 of every filed input table used
      - the Stage 0 gate status and the identity of the second filed source
  heuristic_under_test: HEUR-E2E-1
  preregistered_prediction:
    quantity: >-
      F, the ratio of the assembled end-to-end attack cost to the
      circuit-only cost, both in physical-qubit-seconds.
    formula: >-
      F = r * (physical/logical overhead under the declared error-correction
      model) + (classical term converted into U6) / (circuit-only U6);
      predicted F > 10^3 at EVERY declared grid point, and predicted
      F(ECDLP)/F(RSA) in [0.5, 2] at every grid point.
    source: >-
      H-ICEX-4b2e19 statements (D) and (E); the circuit-level inputs are
      KN-LIT-099's recorded table. No external end-to-end analysis is cited
      and none is relied on.
  scale_relevance:
    tier: crypto
    justification: >-
      The costed parameter is 256-bit prime-field ECDLP, which is a
      cryptographic parameter set, but the TIER LABEL HERE DESCRIBES THE
      PARAMETER AND NOT THE EVIDENCE- no computation on any 256-bit instance
      is performed, no circuit is simulated, and no hardware is used. This is
      a static arithmetic assembly over a filed table, and its evidence value
      is exactly that of the table plus the arithmetic. TRANSFER ASSUMPTIONS,
      STATED- that the source's fault-free logical counts are correct
      (inherited, not checked here) and that the second filed source's
      error-correction model applies to the source's circuits (declared, and
      the dominant uncertainty).
    correspondence: null
  tail_checks:
    - >-
      THE HIGHEST-COST ASSUMPTION COMBINATION is reported explicitly as the
      UPPER BOUND it is, since the product form of HEUR-E2E-1 bounds rather
      than computes the cost.
    - >-
      THE LOWEST-F GRID POINT is reported separately, because P2 is falsified
      by a single point and the minimum over the grid is therefore the
      decisive statistic rather than the mean.
    - >-
      THE RSA ROW'S INTERNAL DISAGREEMENT (1.86e13 in the source's ePrint
      table against 1.5e14 in the published summary, as the corpus entry
      itself records) is carried through both branches and F(RSA) is reported
      as a bracket, never as a point.
    - >-
      SMALL-n ROWS (n = 110) are reported but are not used to anchor any
      claim about 256-bit parameters; they exist to make the reproduction
      two-point.
  replication:
    seeds: []
    seeds_note: >-
      THE ASSEMBLY IS FULLY DETERMINISTIC- it performs exact arithmetic on a
      filed table and samples nothing, so there is no seed to declare and the
      list is empty by construction rather than by omission. Reproducibility
      is bound instead by the sha256 of every input table, recorded per run,
      and by bit-identical re-execution being REQUIRED- two runs at the same
      inputs that differ in any digit are an infrastructure failure. Should
      any future version introduce sampling, it must declare seeds and is a
      NEW contract, not an edit to this one.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - >-
      STOP BEFORE STARTING if Stage 0's two-filed-source gate is not closed.
      The correct output in that case is the gate report and the
      missing-input list, and no pipeline number at all.
    - >-
      Stop immediately if Stage 1's degenerate reproduction misses either
      calibration point.
    - >-
      Stop immediately if the unit-refusal self-test permits any forbidden
      cross-unit operation.
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
    - >-
      A run emitting any untagged value, or performing any cross-unit
      operation without a recorded, filed conversion, is INVALID.
    - >-
      A run assigning a value to a cell the feasibility gate declared
      unevaluable is INVALID- this includes assigning any value to r or to
      the error-correction overhead when no filed source states it.
    - >-
      A run emitting any date, timeline, arrival probability or policy
      recommendation is INVALID under RQ-QRE-6dba8c constraint 4.
    - >-
      A run emitting a single-point sensitivity figure without its declared
      range is INVALID under RQ-QRE-6dba8c constraint 5.
    - >-
      A run using a constant with no filed source is INVALID under
      RQ-QRE-6dba8c constraint 3.
    - >-
      A timeout, crash or dependency failure makes the run
      failed_infrastructure and is never negative evidence (AGENTS.md rule 5).
  success_criterion: >-
    The contract SUCCEEDS when the Stage 0 gate is closed, the degenerate
    reproduction matches both calibration points exactly, the unit-refusal
    self-test passes, and F, the dominant-term identity, the classical share
    and F(ECDLP)/F(RSA) are each reported per grid point with their ranges,
    beside the unevaluable-cell table. If the Stage 0 gate CANNOT be closed,
    the contract still succeeds by reporting exactly that- the end-to-end
    cost is not computable from the currently filed corpus, with the missing
    inputs named.
  falsification_criterion:
    - >-
      F1. Degenerate reproduction misses either calibration point. HALT-
      implementation failure, never a mathematical result.
    - >-
      F2. F < 10^3 at any declared grid point. The prediction of H-ICEX-4b2e19
      (D) is falsified and the circuit count is an adequate proxy over that
      part of the range.
    - >-
      F3. F(ECDLP)/F(RSA) outside [0.5, 2] at any grid point. The assembly is
      instance-dependent; that dependence becomes the finding and must be
      explained before any citation.
    - >-
      F4. The classical post-processing share exceeds 1e-6 at any grid point.
      Post-processing is not negligible.
    - >-
      F5. The unit-refusal self-test permits a forbidden operation. The
      instrument is not the one specified and every number it produced is
      void.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment, and the sha256 of every filed input table
    - raw-result.json with every emitted value as a (value, unit_tag, source_ref) triple
    - the non-curve RSA control rows in the same file as the ECDLP rows
    - the unevaluable-cell table naming the missing input per cell
    - the unit-refusal self-test log, one line per forbidden operation attempted
    - the Stage 0 literature-gate report naming the two filed sources and their extracted tables
    - the identifying five-tuple attached to every emitted row
  interpretation_limits:
    - >-
      EXTENDS A PUBLISHED ESTIMATE; MAKES NO INDEPENDENT QUANTUM-FEASIBILITY
      CLAIM and does not check the source's circuit counts, which are the
      subject of EXP-ICEX-640aef.
    - >-
      NO DATE, TIMELINE, ARRIVAL PROBABILITY OR POLICY RECOMMENDATION may
      appear in any artifact. Binding, and enforced as an invalidation rule.
    - >-
      IF THE NON-CURVE CONTROL REPRODUCES F, as predicted, the result is
      about the assembly and not about elliptic curves. Recorded before the
      run so a confirmation cannot be upgraded afterwards.
    - >-
      THE REPETITION TERM IS AN UPPER BOUND. Shared setup and depth-dependent
      cycle times both reduce the true figure and neither is modelled.
    - >-
      THE DOMINANT TERM MAY BE UNEVALUABLE. The only ECDLP source with an
      extracted table contains no error-correction layer and no success
      probability, so the terms that carry F cannot be computed from it. That
      is a limitation of the available corpus and it is reported as one, not
      worked around.
    - >-
      QUESTION REASSIGNMENT, DISCLOSED. The parent proposal
      IDEA-20260815-1570fe carries question_id RQ-QALG-457b41 (ML-KEM
      quantum algorithms), whose constraints forbid any cost figure
      transferring in or out. This contract is filed under RQ-QRE-6dba8c,
      whose declared targets include this pipeline and the ECDLP-versus-RSA
      comparison under one model. The immutable source proposal is not
      edited.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. DESIGNED under TASK-20260904-e87737; execution requires a
      separate Coordinator approval decision. A message from any agent is not
      an approval.
    - >-
      APPROVAL IS ADDITIONALLY BLOCKED by RQ-QRE-6dba8c constraint 1 until a
      second primary resource-estimation source is filed as a KN-LIT entry
      with its input table extracted.
  id_allocation_provenance: >-
    EXP-ICEX-b8c865 was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrating session must run the
    strict parse and tools/validate_ledger.py before this contract is relied
    on.
