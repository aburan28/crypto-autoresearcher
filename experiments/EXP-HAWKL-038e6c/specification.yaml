experiment:
  id: EXP-HAWKL-038e6c
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f2575b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f2575b
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Exact enumeration of bounded-denominator fractional ideals of fixed relative norm in small
    CM fields: fit the principal-density decay exponent against class-number nulls, with every point
    flagged exhaustive or heuristic.'
  objective: 'The one uncertainty a run reduces is the MAGNITUDE of a decay whose direction is already
    settled and will not be revisited. Concretely: (i) whether the bounded-denominator pool of fractional
    O_F-ideals of a fixed relative norm can be enumerated exactly, and its principal subset identified
    exactly, at CM-field degrees 4 and 8 over Q across a denominator ladder wide enough to support
    a log-log fit - the answer being the count of exhaustively completed ladder points, with heuristic
    points flagged and excluded; (ii) if it can, what the fitted decay exponent of the principal density
    is, with a bootstrap interval taken across at least ten independent relative-norm targets so that
    no number rests on a single target''s factorisation type; (iii) whether that exponent is a fact
    about class structure or merely about the denominator bound, decided by running the identical
    pipeline on a class-number-1 field (where density must be exactly 1 at every ladder point, proving
    the principality test sound) and on a second field of larger class number (where the exponent
    must differ if class structure is what is being read). A run implements no part of the nrd-PIP
    algorithm, forms no nrd-PIP instance, performs no re-randomisation, and reopens no question KN-OPEN-028
    closed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for CM fields F of
      degree 4 (and 8 if budget permits) over Q with declared small discriminants and declared class
      numbers, at a declared fixed relative-norm target set of size at least ten, the principal density
      among bounded-denominator fractional ideals of that relative norm decays with fitted log-log
      exponent e and bootstrap interval I over the exhaustively enumerated portion of the denominator
      ladder. What does NOT follow: nothing about the cost of the nrd-PIP route at any parameter,
      because these fields are far smaller than any arising there and no extrapolation is performed;
      nothing that revises, reopens or qualifies KN-OPEN-028''s Q1, Q2 or Q3 closures, which are consumed
      here as settled; nothing about short-generator recovery, which is a different problem per KN-TECH-081;
      nothing about the totally definite quaternion setting, which EV-HAWK-21edba distinguishes from
      this one; and no statement about HAWK''s security in either direction.'
  inputs:
    procedure: 'STAGE 0 (cost: a day of human work, zero compute). Fix the fields (signal, class-number-1
      null, larger-class-number null), the relative-norm target set, the denominator ladder, the pool
      construction, and the exhaustive/heuristic criterion, in the specification. Record explicitly,
      citing EV-HAWK-21edba, that the setting is the commutative Dedekind domain O_F and not the totally
      definite quaternion order. STAGE 1 (cost: minutes). Compute class group and unit group of each
      field exactly by exhaustive means; halt if any is not exactly computable. STAGE 2 (cost: minutes
      to hours). For each field, target and ladder point R, enumerate the bounded-denominator pool
      as (1/a) times integral I with norm of a at most R and relative norm matching the target. STAGE
      3 (cost: the dominant cost, hours). Test principality of each pool element by bounded exhaustive
      search, flagging each point exhaustive or heuristic by the frozen criterion. STAGE 4 (cost:
      minutes). Form density(R) per field per target; fit log density against log R on exhaustive
      points only; bootstrap across targets. STAGE 5 (cost: minutes). Null arms in the same invocation:
      class-number-1 field must give density exactly 1 at every R; larger-class-number field gives
      its own fitted slope. STAGE 6 (cost: seconds). Monotonicity audit on both counts. STAGE 7 (cost:
      minutes). Register the result in the obstruction block form of templates/research-records.md
      - value, units, error bars, source runs, scope - and emit through harness/runner.py.'
    instrument: Python 3 with exact integer arithmetic throughout; sympy for cyclotomic and quadratic-extension
      polynomial arithmetic, factorisation of small integers, and Smith/Hermite normal forms; hand-written
      exact routines in the harness for ideal enumeration, norm computation and bounded principality
      search. No computer-algebra system with built-in number-field machinery, and specifically no
      Sage; no lattice library required. All arithmetic is exact - no floating point anywhere except
      in the final log-log regression, whose inputs are exact rationals. Runs, seeds and manifests
      through harness/runner.py, following the exact-integer instrument discipline already established
      in the EXP-HAWK-a2f34a lineage.
    parameters: 'Fields: one signal CM field of degree 4 over Q with class number greater than 1 and
      declared small discriminant; one class-number-1 null of the same degree; one larger-class-number
      null of the same degree; optionally one signal field of degree 8 if STAGE 3 completes at degree
      4. Relative-norm targets: at least 10, declared in advance, chosen to span distinct factorisation
      types. Denominator ladder: R geometric from 10 to 10^4 at degree 4, 10 to 10^3 at degree 8,
      at least 7 points. Bootstrap resamples across targets: 2000. Exhaustive/heuristic criterion
      frozen as a search-region size threshold declared in the specification.'
  controls:
  - 'Class-number-1 null field, identical pipeline, same invocation: density must be exactly 1 at
    every R.'
  - 'Second null with a larger class number: fitted slope must differ from the signal field''s, else
    the measurement is not reading class structure.'
  - Exhaustive-versus-heuristic flag on every point, with the primary fit restricted to exhaustive
    points and a secondary fit reported on all points for comparison.
  - 'Norm-target replication: at least 10 independent relative-norm targets, with the bootstrap interval
    taken across them, so no exponent rests on one target.'
  - 'Monotonicity audit: both counts must be non-decreasing in R by construction; a violation is a
    bug and halts the run.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a number field of the same degree and comparable
    discriminant but with a different class number - ideally class number 1, where every ideal is
    principal and the density is identically 1 by construction - run through the IDENTICAL enumeration
    and principality pipeline in the same invocation. For the signal arm to mean anything: the class-number-1
    null must return density exactly 1 at every R, confirming the principality test does not spuriously
    fail; and a second null with a larger class number must return a density measurably below the
    signal arm''s if and only if class structure is what the measurement is reading. If the fitted
    exponent is the same across fields of different class number, the measurement is reading the denominator
    bound alone and not the arithmetic, and the exponent must be reported as a statement about counting,
    not about class structure.'
  independent_variables:
  - denominator bound R along the geometric ladder
  - field (signal, class-number-1 null, larger-class-number null)
  - relative-norm target (at least 10)
  - field degree (4, optionally 8)
  metrics:
    primary:
    - '|P(R)| and |P(R) intersect principal| per field, target and ladder point'
    - fitted log-log decay exponent of density(R) with bootstrap interval across targets, per field
    - class-number-1 null density at every ladder point (must be exactly 1)
    - number of exhaustively completed ladder points per field
    secondary:
    - slope difference between signal and larger-class-number null with its interval
    - count and location of heuristic-flagged points
    - class group and unit group data used, per field
    - wall-clock of the principality search per ladder point
  heuristic_under_test: null
  preregistered_prediction:
    quantity: e_4, the fitted log-log decay exponent of the principal density among bounded-denominator
      fractional ideals of fixed relative norm, in the degree-4 signal CM field, over exhaustively
      enumerated ladder points only.
    formula: 'density(R) = |{I in P(R) : I principal}| / |P(R)|, where P(R) = { (1/a) J : J an integral
      O_F-ideal, N_{F/K}(J) = a^2 q-prime O_K, norm of a at most R }, following the construction described
      in EV-HAWK-21edba''s what_actually_establishes_case_c block. Fit log density(R) = c + e_4 log
      R by least squares over exhaustive ladder points. Predicted: e_4 strictly negative with the
      bootstrap interval excluding zero, consistent with the direction already settled in KN-OPEN-028;
      the run''s contribution is the value and interval, not the sign.'
    source: Pre-registered in the parent proposal IDEA-20260816-f2575b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'CM fields of degree 4 (and possibly 8) over Q with small declared discriminants,
      chosen because class group, unit group and principality are all exactly computable there and
      nowhere larger within budget. The fields arising in the setting of interest are far larger,
      and NO transfer or extrapolation is assumed, performed or licensed: the deliverable is a measured
      exponent scoped by name to the declared fields and targets, plus the largest exhaustively completed
      ladder point. The correspondence between the paper''s beta bound and the ladder''s R is a declared
      modelling choice recorded as a scope limit, not an identity.'
    correspondence: null
  tail_checks:
  - Check the smallest R, where the pool may contain only integral ideals and the density is trivially
    high; report the fit with and without the first two ladder points.
  - Check the largest exhaustive R, where the principality search is closest to its budget, and confirm
    by a doubled-budget rerun on that point alone that the count does not change.
  - Check relative-norm targets that are prime versus highly composite separately, since pool sizes
    differ by orders of magnitude and the across-target bootstrap could be dominated by one class.
  - Check any ladder point where |P(R)| equals |P(R-1)|, meaning the ladder step admitted nothing
    new and the point carries no independent information.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the class-number-1 null returns any density other than exactly 1 at any ladder point.
  - Halt if fewer than three exhaustive ladder points are achievable at degree 4, and report a budget
    limit - never a negative mathematical result, per AGENTS.md rule 3.
  - Halt if the monotonicity audit on either count fails.
  - Halt before running if the pool construction cannot be declared unambiguously from the committed
    evidence records.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, for the signal field and both nulls, the two counts at every ladder
    point per target, a fitted decay exponent with a bootstrap interval over exhaustive points only,
    the class-number-1 null at exactly 1 throughout, and the exhaustive-versus-heuristic flag on every
    point - registered as an obstruction measurement with value, units, error bars, source runs and
    scope.
  falsification_criterion:
  - The class-number-1 null returns a density other than exactly 1.
  - Fewer than three exhaustive ladder points are achievable, so no exponent is fitted (a budget limit,
    not a mathematical result).
  - The fitted slope is consistent with zero on exhaustive points, contradicting a settled direction
    and indicating instrument failure to be diagnosed.
  - The signal and larger-class-number null fields give the same slope within intervals.
  - The monotonicity audit fails on either count.
  - The doubled-budget rerun at the largest exhaustive point changes the count, invalidating the exhaustive
    flag.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f2575b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact pool construction must be pinned down from EV-HAWK-c99848 and EV-HAWK-21edba and declared
    by the Coordinator; where those records are not fully explicit the ambiguity must be resolved
    by decision and recorded, not by guess.
  - The correspondence between the paper's beta norm bound and the ladder's denominator bound R is
    a modelling choice the Coordinator must approve, and it determines how the measured exponent may
    ever be cited.
  - The exhaustive-versus-heuristic threshold for the principality search must be fixed before the
    run; it is the single parameter most able to manufacture a clean-looking exponent.
  - Whether a degree-8 arm is worth its cost given that no extrapolation is licensed is a Coordinator
    judgement, not a technical one.
