# EXP-PAIR-f4584a
# Stage-0 slot census for H-PAIR-0ac6e0.
# Frozen before the official run.
experiment:
  id: EXP-PAIR-f4584a
  hypothesis_id: H-PAIR-0ac6e0
  source_idea: IDEA-20261006-bac9db
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  version: 1
  title: >-
    Three-slot smoothness of two cubics at (1,4) and (2,8)
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-b65250
  execution_authorized: true
  objective: >-
    Evaluate N_f, N_g, and three choices of a third cubic at the
    named sieve points. A point is accepted when at least two of the
    three integers are 7-smooth, and a repeated form occupies two
    slots. Record whether h = f accepts both points and h = x^3 + 2
    rejects both.
  inputs:
    bound: 7
    forms:
      f: "a^3 + a*b^2 + b^3"
      g: "a^3 + a^2*b + b^3"
      treatment: "a^3 + 2*b^3"
      nearby: "(a+b)^3"
    points: [[1, 4], [2, 8]]
    control_point: [4, 4]
    named_future_run_slot: RUN-PAIR-e887a4
  controls:
    - >-
      Monomial and Horner expansions agree at every recorded value.
      Disagreement invalidates the cell.
    - >-
      The pair (f, g) alone rejects both named points. The point
      (4,4) is accepted for all three third cubics. The nearby cube
      accepts both named points. Zero is not smooth.
  independent_variables:
    - the third cubic, either the duplicate f or x^3 + 2, on fixed points
  metrics:
    primary:
      - gap_holds
      - beyond_pattern
    secondary:
      - planted_ok
      - the six absolute values at the named points
  heuristic_under_test: >-
    IDEA-20261006-bac9db slot reading: h = f occupies two slots, so
    the duplicate accepts points that the treatment rejects.
  preregistered_prediction:
    quantity: >-
      At (1,4) and at (2,8), the three-slot predicate is true for
      h = f and false for h = x^3 + 2.
    formula: >-
      The positive reading is both duplicate indicators true and both
      treatment indicators false. The negative reading is any duplicate
      indicator false or any treatment indicator true, with the
      controls holding.
    source: >-
      IDEA-20261006-bac9db pre-registers indicators 1, 1 for h = f and
      0, 0 for h = x^3 + 2. Those bits were copied from the idea before
      this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      Two sieve points and integers below 1100. No degree-12 field and
      no deployed prime.
    correspondence: null
  tail_checks:
    - >-
      Each recorded value is the integer from both expansion orders.
      A one-sided value means an expansion was skipped.
    - >-
      The bound is 7. A run that uses 23 is not this contract.
  replication:
    seeds: []
    independent_instances: 2
    named_future_run_slot: RUN-PAIR-e887a4
    replication_note: >-
      One deterministic pass over two named points. The two instances
      are the two expansion orders, not two random samples.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 30
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-PAIR-e887a4.
    - Do not add a point, a bound, or a polynomial in this contract.
    - A missed pattern is the recorded result. Do not change the indicators.
  invalidation_rules:
    - The two expansion orders disagree.
    - (4,4) is rejected for any of the three third cubics.
    - The nearby cube rejects a named point, or the pair (f, g) accepts one.
    - Zero is scored smooth.
    - A timeout, crash, or missing indicator.
  success_criterion: >-
    The manifest is valid, planted_ok is true, both duplicate
    indicators are true, and both treatment indicators are false.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and either a duplicate
    indicator is false or a treatment indicator is true.
  decision_impact:
    on_positive: >-
      Record that the slot reading separates h = f from h = x^3 + 2
      at both named points. Do not select polynomials for a degree-12
      field from this pass alone.
    on_negative: >-
      Record that the pre-registered gap failed while the controls
      held. Do not treat the slot reading as confirmed at these points.
  required_artifacts:
    - experiments/EXP-PAIR-f4584a/runs/RUN-PAIR-e887a4/manifest.yaml
    - experiments/EXP-PAIR-f4584a/runs/RUN-PAIR-e887a4/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-PAIR-f4584a/trial-plan.json
    driver: experiments/EXP-PAIR-f4584a/implementation/run.py
    checker: experiments/EXP-PAIR-f4584a/implementation/check.py
  out_of_scope:
    - Bound 23, further sieve points, and polynomial selection for a degree-12 field.
    - Any discrete logarithm, any deployed prime, and any bit-level claim.
