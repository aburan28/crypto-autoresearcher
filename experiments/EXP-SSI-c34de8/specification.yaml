# EXP-SSI-c34de8
# Depth-two walks on the toy supersingular Phi_2 graph.
# Frozen before any run. Counts below are a prediction, not a result.
experiment:
  id: EXP-SSI-c34de8
  hypothesis_id: H-SSI-07fa48
  source_idea: IDEA-20261004-e4c461
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  version: 1
  title: >-
    Unlabeled depth-two endpoints on the Phi_2 graph at p=7, 11, 19
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-f1f75a
  objective: >-
    Build the Phi_2 neighbor relation on each frozen supersingular
    set, enumerate depth-two walks, and count starts with more than
    one endpoint.
  inputs:
    primes: [7, 11, 19]
    supersingular_j:
      7: [6]
      11: [0, 1]
      19: [7, 18]
    phi2: >-
      -X^2 Y^2 + X^3 + Y^3 + 1488 X^2 Y + 1488 X Y^2
      - 162000 X^2 - 162000 Y^2 + 40773375 X Y
      + 8748000000 X + 8748000000 Y - 157464000000000
    predicted_neighbors:
      7: {6: [6]}
      11: {0: [1], 1: [0, 1]}
      19: {7: [7, 18], 18: [7, 18]}
    predicted_walk_count:
      7: 1
      11: 5
      19: 8
    predicted_ambiguous_starts:
      7: 0
      11: 2
      19: 2
    predicted_conflicting_walk_pairs:
      7: 0
      11: 3
      19: 8
    predicted_oriented_disagreements:
      7: 0
      11: 0
      19: 0
  controls:
    - >-
      Oriented control. A walk publishes its three j-invariants.
      The endpoint disagrees with the graph on 0 walks.
    - >-
      Single-loop control. At p=7 the only walk is the loop at 6,
      so ambiguous starts are 0.
    - >-
      Two formulas. One evaluates the monomial Phi_2. The other
      evaluates the cubic in Y with coefficients
      1,
      -X^2 + 1488 X - 162000,
      1488 X^2 + 40773375 X + 8748000000,
      X^3 - 162000 X^2 + 8748000000 X - 157464000000000.
      They must not import each other's neighbor lists.
  independent_variables:
    - prime in {7, 11, 19}
    - phi2_formula in {monomial, cubic}
  metrics:
    primary:
      - neighbor_sets
      - ambiguous_starts
      - conflicting_walk_pairs
      - oriented_disagreements
      - routes_agree
    secondary:
      - walk_count
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      Neighbor sets and the counts under inputs. Ambiguous starts
      are 0, 2, 2. Conflicting walk pairs are 0, 3, 8.
      Oriented disagreements are 0.
    formula: >-
      A walk is a triple (j0, j1, j2) with Phi_2 edges. A start is
      ambiguous when its walks use at least two distinct values of
      j2. A conflicting pair is an unordered pair of such walks.
    source: >-
      IDEA-20261004-e4c461, specialized to this Phi_2 graph.
      The counts were computed in the design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Three primes and at most two vertices. No transfer to a
      cryptographic isogeny PKE.
    correspondence: null
  tail_checks:
    - >-
      p=7 must be reported. Dropping the single-loop cell invalidates
      the batch.
    - >-
      The neighbor list must be sorted increasingly. A different order
      with the same set is accepted only after sorting.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per prime and Phi_2 formula.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests.
    - Do not add a prime, a level, or a vertex.
    - Do not continue a cell after the formulas disagree.
  invalidation_rules:
    - The two Phi_2 formulas disagree.
    - A neighbor outside the frozen supersingular set is added.
    - Edge multiplicity is treated as a distinct endpoint.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid, the formulas agree, neighbor sets
    match, ambiguous starts are 0, 2, and 2, conflicting walk pairs
    are 0, 3, and 8, and oriented disagreements are 0.
  falsification_criterion: >-
    The formulas agree and any neighbor set, ambiguous-start count,
    conflicting-pair count, or oriented-disagreement count differs
    from the table. A formula disagreement does not meet this criterion.
  required_artifacts:
    - experiments/EXP-SSI-c34de8/runs/<run-id>/command.txt
    - experiments/EXP-SSI-c34de8/runs/<run-id>/stdout.txt
    - experiments/EXP-SSI-c34de8/runs/<run-id>/stderr.txt
    - experiments/EXP-SSI-c34de8/runs/<run-id>/result.json
    - experiments/EXP-SSI-c34de8/runs/<run-id>/walks.json
  assigned_to: executor
  out_of_scope:
    - A CSIDH or SiGamal implementation.
    - Any prime outside {7, 11, 19}.
    - Depth other than 2.
    - Editing H-SSI-89db95.
