  canonical_binary_contract:
    integer_encoding: unsigned_big_endian_unless_i8_or_i192_is_named
    path_encoding: ASCII_POSIX_relative_no_dot_segments_no_symlinks
    common_file_header:
      header_bytes: 64
      fields:
        - {offset: 0, bytes: 8, type: ASCII, name: magic}
        - {offset: 8, bytes: 2, type: u16be, name: schema_version, required_value: 2}
        - {offset: 10, bytes: 2, type: u16be, name: header_bytes, required_value: 64}
        - {offset: 12, bytes: 4, type: u32be, name: record_bytes}
        - {offset: 16, bytes: 8, type: u64be, name: record_count}
        - {offset: 24, bytes: 8, type: u64be, name: payload_bytes}
        - {offset: 32, bytes: 32, type: bytes, name: payload_sha256}
      digest_rule: SHA-256 over exactly payload_bytes bytes after the header
      padding_rule: >-
        Bytes after header plus payload through exact_file_bytes must all be
        0x00. Padding is never hashed by payload_sha256 but is included in the
        whole-file SHA-256 recorded by the index.
      length_rule: '64+payload_bytes+padding_bytes=exact_file_bytes=maximum_slot_bytes.'
    canonical_orders:
      arm: [diffuse, concentrated]
      arm_enum: [0, 1]
      bits: [18, 21, 24, 27, 30]
      eta: [-4, 0, 4]
      cluster: '[0..31]'
      root: '[0..8191]'
      draw: '[0..8190]'
      position: '[0..31]'
      stream_order: arm_then_bits_then_cluster_then_root
      bootstrap_order: arm_then_eta_then_bits_then_draw_then_position
      fit_order: >-
        For each arm in enum order and eta in numeric order, serialize the
        point fit first, followed by draw 0 through 8190. Record ordinal is
        ((arm_enum*3+eta_index)*8192)+(draw+1), where point uses draw=-1 and
        therefore offset 0.
    payload_layouts:
      seed_manifest_v2:
        magic: SEEDMF02
        record_count: 7
        record_bytes: 64
        payload_bytes: 448
        common_record_layout: 'ASCII tag[8] followed by the exact 56-byte body declared below.'
        records:
          - ordinal: 0
            tag: IDENTV02
            body: 'successor_id ASCII[24] zero-padded, predecessor_id ASCII[24] zero-padded, u64be stream_version=1'
          - ordinal: 1
            tag: SEEDXV02
            body: 'master_seed[32], u64be total_keys=10484960, u64be XOF_output_bytes=146798080, zero[8]'
          - ordinal: 2
            tag: PARAMV02
            body: 'u8 arm_count=2, u8 diffuse=0, u8 concentrated=1, u8 eta_count=3, i8[-4,0,4], u8 size_count=5, u16be clusters=32, u16be roots_per_cluster=8192, u16be draws=8191, u8 positions=32, zero[41]'
          - ordinal: 3
            tag: SIZESV02
            body: 'five 8-byte rows (u8 bits, u8 zero, u16be kappa, u32be N), u64be roots_per_size=262144, zero[8]'
          - ordinal: 4
            tag: COUNTV02
            body: 'seven u64be values [160,2621440,7863360,10484960,6,49146,24037344]'
          - ordinal: 5
            tag: PRESPV02
            body: 'predecessor_specification_sha256[32], design_commit_raw20[20], zero[4]'
          - ordinal: 6
            tag: PRDRPV02
            body: 'predecessor_design_report_sha256[32], design_commit_raw20[20], zero[4]'
      compiler_schedule_v2:
        magic: COMPSCH2
        record_count: 32
        record_bytes: 128
        payload_bytes: 4096
        record_layout: >-
          u16be kind, u16be ordinal, u8 stage, u8 flags, u16be reserved_zero,
          four u64be counters named key_count, operation_count, logical_bytes,
          and output_bytes, two 32-byte SHA-256 fields, and 24 zero bytes.
          Unused records are all zero and sort after used records.
        record_plan:
          - {ordinal: 0, kind: 1, name: cluster_key_domain, stage: 0}
          - {ordinal: 1, kind: 2, name: root_diffuse_key_domain, stage: 0}
          - {ordinal: 2, kind: 3, name: root_concentrated_key_domain, stage: 0}
          - {ordinal: 3, kind: 4, name: bootstrap_diffuse_eta_negative4_domain, stage: 0}
          - {ordinal: 4, kind: 5, name: bootstrap_diffuse_eta_zero_domain, stage: 0}
          - {ordinal: 5, kind: 6, name: bootstrap_diffuse_eta_positive4_domain, stage: 0}
          - {ordinal: 6, kind: 7, name: bootstrap_concentrated_eta_negative4_domain, stage: 0}
          - {ordinal: 7, kind: 8, name: bootstrap_concentrated_eta_zero_domain, stage: 0}
          - {ordinal: 8, kind: 9, name: bootstrap_concentrated_eta_positive4_domain, stage: 0}
          - {ordinal: 9, kind: 10, name: aggregate_XOF_schedule, stage: 1}
          - {ordinal: 10, kind: 11, name: artifact_bijection_and_residuals, stage: 0}
          - {ordinal: 11, kind: 12, name: bit_flip_mutation, stage: 2}
          - {ordinal: 12, kind: 13, name: endian_swap_mutation, stage: 2}
          - {ordinal: 13, kind: 14, name: truncation_mutation, stage: 2}
          - {ordinal: 14, kind: 15, name: alias_interface_mutation, stage: 2}
          - {ordinal: 15, kind: 16, name: S0_stage_budget, stage: 0}
          - {ordinal: 16, kind: 17, name: S1_stage_budget, stage: 1}
          - {ordinal: 17, kind: 18, name: S2_stage_budget, stage: 2}
          - {ordinal: 18, kind: 19, name: S3_stage_budget, stage: 3}
          - {ordinal: 19, kind: 20, name: S4_stage_budget, stage: 4}
          - {ordinals: '[20..31]', kind: 0, name: unused_all_zero, stage: 0}
        digest_field_semantics: >-
          For key-domain records digest_A hashes the exact grammar ASCII and
          digest_B hashes the concatenation of registered fixture output bytes
          for that domain, or 32 zero bytes when no fixture is registered. For
          mutation records they hash base and mutated bytes. For stage and
          aggregate records they hash the canonical ASCII operation-row and
          logical-I/O-row equations in displayed key order. Record 10 hashes
          the path-list bytes and the canonical artifact-row equations.
      cluster_rank_file_v2:
        magic: CRANKv02
        record_count: 5
        record_bytes: 1120
        payload_bytes: 5600
        size_record_layout: >-
          A 96-byte metadata prefix followed by 32 u256be ranks in cluster
          ordinal order. Metadata bytes are u8 bits, u8 cluster_count=32,
          u8 rank_bytes=32, u8 zero, u16be lower_count=16, u16be
          upper_count=16, u16be lower_load=1024, u16be upper_load=3072,
