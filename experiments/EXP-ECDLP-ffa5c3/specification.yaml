          u64be sum_S, SHA-256 of the framed bitset-plus-M bytes, and the
          32-byte root-rank stream digest.
      bootstrap_index_file_v2:
        magic: BINDEX02
        record_count: 7863360
        record_bytes: 1
        payload_bytes: 7863360
        value: accepted_cluster_index_u8_in_0_through_31
      bootstrap_digest_file_v2:
        magic: BDIGST02
        record_count: 30
        record_bytes: 32
        payload_bytes: 960
        record_order: arm_then_eta_then_bits
      estimator_record_file_v2:
        magic: FITREC02
        record_count: 49152
        record_bytes: 128
        payload_bytes: 6291456
        metadata_bytes: 32
        metadata_layout: >-
          ASCII FITROW02, u8 schema_version=2, u8 record_kind where point=0
          and bootstrap=1, u8 arm, i8 eta, u16be draw where point=65535,
          u16be rejection_reason, u32be record_ordinal, u16be solver_iterations,
          u16be convergence_flags, and eight zero bytes.
        numeric_layout: >-
          Four signed i192be Q63.128 directed endpoints in order alpha_lower,
          alpha_upper, beta_lower, beta_upper. Lower endpoints round toward
          negative infinity and upper endpoints toward positive infinity.
          gamma endpoints are derived exactly as beta endpoints plus 1/3.
      log_pair_file_v2:
        magic: LOGPAIR2
        record_count: 2
        record_bytes: 524256
        payload_bytes: 1048512
        record_order: [stdout, stderr]
        record_layout: >-
          u64be content_length, SHA-256 of exactly content_length bytes,
          content bytes, then zero fill through 524256 bytes. Length above
          524216 invalidates instead of truncating.
      provenance_receipt_file_v2:
        magic: PROVRC02
        record_count: 1
        record_bytes: 131008
        payload_bytes: 131008
        record_layout: >-
          u32be canonical_JSON_length, SHA-256 of the JSON bytes, canonical
          JSON bytes, then zeros. JSON uses sorted ASCII keys, UTF-8, no
