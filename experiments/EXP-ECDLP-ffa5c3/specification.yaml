  objective: >-
    Freeze one byte-canonical successor to EXP-ECDLP-adaa91 that retains its
    planted finite population and arithmetic while removing every
    implementation-time choice identified by independent review. The future
    apparatus, if separately authorized, must regenerate the same seeded rank
    population, decode one Boolean field S and one canonical u16 multiplicity
    field M, expose X, Y, and V only as aliases of M, recover the registered
    bridge exponents, and evaluate an ordinal-paired eta-zero gamma gap under
    independent arm-separated resamples.

  authorization_boundary:
    authorized_here:
      - freeze this immutable successor design
      - compute static integer, decimal, digest, and mutation-test fixtures
      - snapshot the two TASK-20260809-a84a96 design artifacts in a later archive task
      - obtain a fresh independent design-readiness review in TASK-20260809-923ede
    forbidden_here:
      - write implementation source or generated implementation assets
      - execute a compiler, materializer, decoder, estimator, bootstrap, or archive writer
      - materialize any rank stream or bootstrap-index stream
      - create a run id, run package, run receipt, observation, or empirical evidence
      - change any experiment, hypothesis, question, proposal, goal, or claim status
      - generate a curve, scalar list, selector, selected pair, isomorphism model, or signed-y treatment
      - claim an attack, speedup, security impact, asymptotic improvement, closure, or breakthrough
      - select, configure, probe, contact, or use Amazon Bedrock
    next_gate: >-
      Only a separately archived fresh independent PASS and a later Coordinator
      decision may consider opening an implementation-review batch. Design
      completion and design-review PASS authorize neither implementation nor
      execution.

