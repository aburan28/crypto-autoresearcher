  decoder_contract:
    decoder_A: >-
      A streaming parser reads canonical success-bitset and multiplicity files,
      validates headers, lengths, payload digests, padding, order, allowed M
      values, and summaries, then exposes S and M plus alias views X=M, Y=M,
      and V=M.
    decoder_B: >-
      A separately implemented reference regenerates ranks from the frozen seed,
      applies cluster loads and root selection directly, reconstructs only S
      and M, and exposes the same aliases. It does not parse Decoder A's
      bitset or M payload and shares no parsing, selection, digest, or summary
      helper beyond receiving immutable raw source bytes and constants.
    comparison_gate: >-
      The decoders agree root-for-root on S and M, then on derived alias views,
      selected counts, sum_M, sum_M_squared, sum_S, combined-data digests, and
      rank-stream digests. There is no X/Y/V cross-channel comparison because
      no such channels exist.
    source_independence_receipt: >-
      A later implementation package must list source paths and SHA-256 hashes
      for both decoders and attest that parsing, selection, digest, and summary
      call graphs share no helper. Static and runtime call-graph evidence is
      required; this design makes no present implementation claim.

