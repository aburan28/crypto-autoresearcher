        base_alias_descriptor_sha256: c09bf72aff24512f208159b70cd736f3b9cd96e729f966778dd7e6acb3a0015f
        transformation: 'At byte 21 change V target from M=0 to S=1 and rebind enclosing digests.'
        mutated_alias_descriptor_hex: '414c49415376303203000000000002000100020002010200'
