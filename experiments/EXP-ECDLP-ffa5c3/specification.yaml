  population_preservation:
    invariant: >-
      The successor preserves the predecessor master seed, stream namespace,
      semantic key strings, sizes, arm labels, cluster-load assignment, root
      ordinals, selected-root counts, root values, and all exact arithmetic.
      The new experiment identifier is not absorbed into SHAKE256. Repairs
      change only framing, interface truthfulness, rejection controls,
      estimator terminology, gap definition, and resource/artifact closure.
    stream_namespace: EXP-ECDLP-adaa91
    stream_version: 1
    master_seed_hex: a3b2512dad8e950380ed20e6338bd399454688bb3770783d0f8e90dd8ee69ba1
