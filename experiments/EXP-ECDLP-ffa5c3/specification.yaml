  exact_probability_contract:
    status: finite_deterministic_fixture_with_exact_resampling_map
    materialized_data_law: >-
      After seed freeze every record is deterministic. Frequencies are finite
      sums and are never described as independent Bernoulli samples.
    bootstrap_map: >-
      Under the declared ideal-XOF model each low-five-bit index is uniform on
      {0,...,31}. The realized index package is deterministic. Arm-separated
      keys are disjoint, so diffuse and concentrated resamples are independent
      under that model. There is no rejection, conditioning, imputation,
      regenerated draw, or dropped draw.
    objective_label: fixed_aggregated_binomial_objective
    sampling_law_inference: forbidden
    interpretation: >-
      Objective curvature, interval-Newton boxes, bootstrap percentiles, and
      gap endpoints are deterministic apparatus outputs. They provide no
      sampling-law inference about curves, ECDLP, SHAKE256, or an asymptotic
      population.

  estimators:
    exact_cell_summaries:
      mu_M: 'sum(M)/262144 at each arm and size'
      mean_X_alias: mu_M
      mean_Y_alias: mu_M
      mean_V_alias: mu_M
      m2_M: 'sum(M^2)/262144 at each arm and size'
      kappa: 'm2_M/mu_M; zero mu_M is invalid'
      p: 'sum(S)/262144 at each arm and size'
      ratio: 'p/mu_M; zero mu_M is invalid'
    bridge_slopes:
      x_axis: 'ln(N/2^24)'
      eta_basis: 'N^(-1/3)-2^-8'
      corrected_response: 'ln(metric)-eta*(N^(-1/3)-2^-8)'
      fit: equal_size_OLS_with_free_intercept_over_five_positive_values
      metrics: [kappa, ratio]
      precision: directed_256_bit_with_final_decimal_interval_width_below_1e-15
      eta_basis_OLS_slope_exact: '-3/(2560*ln(2))'
      eta_basis_OLS_slope_decimal: '-0.00169065825104175399299991173554909235'
    marginal_gamma:
      name: fixed_aggregated_binomial_objective
      rows: five_size_aggregates
      definition: >-
        For fixed arm and eta, set x_i=ln(N_i/16777216),
        z_i=N_i^(-1/3)-2^-8, theta_i=alpha+beta*x_i+eta*z_i,
        and q_i=exp(theta_i), restricted to theta_i<0. Maximize the fixed
        deterministic objective Q(alpha,beta)=sum_i[s_i*theta_i+
        (262144-s_i)*log1p(-exp(theta_i))]. This algebraic criterion uses
        binomial-shaped terms but asserts no binomial sampling law.
      solve: >-
        A deterministic directed 384-bit interval-Newton procedure uses the
        fixed initial box alpha in [-32,0] and beta in [-2,2], bisects alpha
        before beta on an inconclusive contraction, rejects any box with a
        theta_i upper bound at or above zero, visits lower subboxes first, and
        must isolate exactly one interior stationary point whose alpha and beta
        widths are each below 2^-120. No estimator substitution, continuity
        correction, dropped size, or alternate link is permitted.
      reported_quantity: 'gamma_s=beta+1/3 exactly'
      inference_boundary: objective_solution_and_curvature_are_apparatus_outputs_only
    bootstrap:
      method: size_stratified_nonparametric_whole_cluster_resampling_map
      draws_per_arm_eta: 8191
      resampling_unit: >-
        At each size, use 32 frozen indices to select 32 complete clusters with
        replacement. The logical cluster bundle contains its 1024-byte S
        bitset, 16384-byte M table, and 96-byte summary, for 17504 logical
        bytes. Aliases move only as views of M; no duplicate channel moves.
      point_fits: 6
      bootstrap_fits: 49146
      all_fit_attempts: 49152
      convergence_rule: 'All fits converge; none is dropped, regenerated, replaced, capped, or winsorized.'
      per_arm_intervals:
        order: ascending_gamma_then_draw_ordinal
        type: Type-1
        one_based_lower_rank: 41
        one_based_upper_rank: 8151
      eta_zero_gap:
        orientation: diffuse_minus_concentrated
        formula: 'gap_star[d]=gamma_diffuse_star[d]-gamma_concentrated_star[d]'
        draw_ordinals: '[0..8190]'
        pairing: same_draw_ordinal_after_independent_arm_resampling
        independence: >-
          Pairing is only an ordinal reporting rule. Diffuse and concentrated
          resamples remain independent because their XOF keys are arm-separated.
        additional_fits: 0
        sort_order: ascending_gap_then_draw_ordinal
        interval_type: Type-1
        one_based_lower_rank: 41
        one_based_upper_rank: 8151
        rank_derivation:
          lower: 'ceil(8191*0.005)=41'
          upper: 'ceil(8191*0.995)=8151'

  controls:
    - id: C0-static-compiler
      description: >-
        Enumerate and validate all 10484960 complete keys, exact key lengths,
        fixtures, prefix freedom, domains, counts, XOF traffic, binary layouts,
        paths, index rows, padding, stage rows, artifact coverage, and every
        zero-residual equation before materialization.
      blocking: true
    - id: C1-seed-rank-regeneration
      description: >-
        Two source-independent processes reproduce the concrete XOF fixtures,
        160 cluster ranks, 320 framed root-rank digests, 7863360 indices, and
        30 framed raw-word digests from the preserved seed and keys.
