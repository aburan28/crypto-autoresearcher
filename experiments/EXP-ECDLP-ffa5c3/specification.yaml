          no floats, and no trailing newline. It records exact command, Git
          commit and dirty-tree state, source manifest digest, environment and
          dependency versions, seed, policy, runtime, model visibility,
          resource measurements, control verdicts, and validity reason.
        required_top_level_keys_in_sorted_order:
