      hex: a3b2512dad8e950380ed20e6338bd399454688bb3770783d0f8e90dd8ee69ba1
      bytes: 32
      frozen_before_implementation: true
    sizes:
      - {bits: 18, N: 262144, kappa: 64}
      - {bits: 21, N: 2097152, kappa: 128}
      - {bits: 24, N: 16777216, kappa: 256}
      - {bits: 27, N: 134217728, kappa: 512}
      - {bits: 30, N: 1073741824, kappa: 1024}
    arms:
      canonical_order: [diffuse, concentrated]
      enum:
        diffuse: 0
        concentrated: 1
      binary_type: u8
      enum_bytes_hex:
        diffuse: '00'
        concentrated: '01'
    eta_values: [-4, 0, 4]
    eta_binary_type: i8_twos_complement
    eta_bytes_hex:
      '-4': fc
      '0': '00'
      '4': '04'
    clusters_per_size: 32
    roots_per_cluster: 8192
    roots_per_size: 262144
    total_cluster_records: 320
    total_root_records: 2621440
    bootstrap_draws_per_arm_eta: 8191
    bootstrap_positions_per_draw_size: 32
    total_bootstrap_indices: 7863360
    arithmetic: exact_integers_rationals_and_directed_multiprecision_only

  exact_construction:
    cluster_load_assignment: >-
      For each size, generate 32 common cluster ranks. Sort pairs by
      (rank_u256, cluster_u8). Assign A_c=1024 to sorted positions 0 through
      15 and A_c=3072 to positions 16 through 31. The assignment is shared by
      both arms and fixed before root selection.
    root_selection: >-
      For each complete (arm,bits,cluster) tuple, generate 8192 root ranks and
      sort pairs by (rank_u256,root_u16). In diffuse select the first A_c
      roots. In concentrated select the first A_c/kappa roots. Every A_c is
      divisible by the kappa in its size row; failure is invalidity.
    encoded_root_fields:
      S:
        type: one_bit
        meaning: Boolean success indicator
      M:
        type: u16be
        meaning: canonical multiplicity
        allowed_values: [0, 1, 64, 128, 256, 512, 1024]
    alias_interface:
      canonical_field: M
      aliases:
        X: M
        Y: M
        V: M
      independent_multiplicity_channels_encoded: 1
      independent_X_Y_V_claim_permitted: false
      certified_claim: >-
        Both decoders must agree on S and M. X, Y, and V are three names for
        the same decoded M value and provide no independent cross-channel
        evidence.
    unencoded_constants:
      D: 1048576
      D_semantics: fixed exposure constant with no stored root channel and no estimator offset
    root_values:
      diffuse_selected: {M: 1, X_alias: M, Y_alias: M, V_alias: M, S: 1}
      concentrated_selected: {M: kappa, X_alias: M, Y_alias: M, V_alias: M, S: 1}
      unselected: {M: 0, X_alias: M, Y_alias: M, V_alias: M, S: 0}
    exact_counts_per_arm_size:
      common_sum_M: 65536
      common_sum_X_alias: 65536
      common_sum_Y_alias: 65536
      common_sum_V_alias: 65536
      common_mean_M: '1/4'
      common_mean_X_alias: '1/4'
      common_mean_Y_alias: '1/4'
      common_mean_V_alias: '1/4'
      diffuse_sum_S: 65536
      diffuse_sum_M_squared: 65536
      concentrated_sum_S_by_bits: {18: 1024, 21: 512, 24: 256, 27: 128, 30: 64}
      concentrated_sum_M_squared_by_bits:
        18: 4194304
        21: 8388608
        24: 16777216
        27: 33554432
        30: 67108864
    derivation_assertions:
      - '16*1024+16*3072=65536.'
      - '32*8192=262144.'
      - '65536/262144=1/4.'
      - 'For every concentrated cluster, selected_count=A_c/kappa.'
      - 'For every concentrated cluster, sum(M)=A_c and sum(M^2)=kappa*A_c.'
      - 'For every diffuse cluster, selected_count=sum(M)=sum(M^2)=sum(S)=A_c.'
      - 'For every arm and size, X=Y=V=M by alias definition, not by independent decoding.'

  deterministic_stream_contract:
    xof: SHAKE256
    absorb_rule: 'u16be(key_ascii_length)||key_ascii||master_seed_32'
    byte_order: big_endian
    key_character_set: ASCII
    whitespace_rule: >-
      No key contains space, horizontal tab, carriage return, line feed, NUL,
      or any non-ASCII byte. YAML presentation whitespace is never part of a
      key. The quoted grammar strings below are exact concatenations.
    lexical_rules:
      - The literal stream namespace is EXP-ECDLP-adaa91.
      - Fields occur in the displayed order with one literal vertical bar separator.
      - Field names and values contain neither a vertical bar nor an equals sign.
      - bits has two decimal digits, cluster two, root four, draw four, and position two.
      - arm key values are the exact lowercase ASCII labels diffuse and concentrated.
      - eta key values are exactly -4, 0, and 4 with no plus sign and no leading zero.
      - The u16be key length and fixed grammar make absorbed messages prefix-free.
    exact_key_grammars:
      cluster_rank:
        grammar: 'EXP-ECDLP-adaa91|matched-mean-cluster-rank-v1|bits={bits}|cluster={cluster}|component=load-rank-u256'
        key_bytes: 89
        absorbed_message_bytes: 123
        substitutions: {bits: '[18,21,24,27,30]', cluster: '[00..31]'}
      root_rank_diffuse:
        grammar: 'EXP-ECDLP-adaa91|matched-mean-root-rank-v1|arm=diffuse|bits={bits}|cluster={cluster}|root={root}|component=success-rank-u256'
        key_bytes: 111
        absorbed_message_bytes: 145
      root_rank_concentrated:
        grammar: 'EXP-ECDLP-adaa91|matched-mean-root-rank-v1|arm=concentrated|bits={bits}|cluster={cluster}|root={root}|component=success-rank-u256'
        key_bytes: 116
        absorbed_message_bytes: 150
      bootstrap_diffuse_eta_negative4:
        grammar: 'EXP-ECDLP-adaa91|matched-mean-bootstrap-v1|arm=diffuse|eta=-4|bits={bits}|draw={draw}|position={position}|component=cluster-index-u64'
        key_bytes: 119
        absorbed_message_bytes: 153
      bootstrap_diffuse_eta_zero_or_positive4:
        grammar: 'EXP-ECDLP-adaa91|matched-mean-bootstrap-v1|arm=diffuse|eta={eta}|bits={bits}|draw={draw}|position={position}|component=cluster-index-u64'
        eta_values: [0, 4]
        key_bytes: 118
        absorbed_message_bytes: 152
      bootstrap_concentrated_eta_negative4:
        grammar: 'EXP-ECDLP-adaa91|matched-mean-bootstrap-v1|arm=concentrated|eta=-4|bits={bits}|draw={draw}|position={position}|component=cluster-index-u64'
        key_bytes: 124
        absorbed_message_bytes: 158
      bootstrap_concentrated_eta_zero_or_positive4:
        grammar: 'EXP-ECDLP-adaa91|matched-mean-bootstrap-v1|arm=concentrated|eta={eta}|bits={bits}|draw={draw}|position={position}|component=cluster-index-u64'
        eta_values: [0, 4]
        key_bytes: 123
        absorbed_message_bytes: 157
    output_semantics:
      cluster_rank: 'Squeeze 32 bytes and interpret as u256be.'
      root_rank: 'Squeeze 32 bytes and interpret as u256be.'
      bootstrap_index: >-
        Squeeze 8 bytes, interpret as u64be, and return word AND 31. Because
        32 divides 2^64, this is exact uniform reduction under the ideal-XOF
        model with one word, no rejection, no cap, and no dropped draw.
    exact_key_counts:
      cluster_rank: 160
      root_rank: 2621440
      bootstrap_index: 7863360
