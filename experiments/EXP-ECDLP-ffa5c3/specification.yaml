          - {offset: 16, bytes: 8, type: u64be, name: maximum_slot_bytes}
          - {offset: 24, bytes: 8, type: u64be, name: payload_bytes}
          - {offset: 32, bytes: 8, type: u64be, name: padding_bytes}
