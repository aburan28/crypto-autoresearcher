experiment:
  id: EXP-XEDN-373466
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-XEDN-58867e
  question_id: RQ-XEDN-004
  goal_id: GOAL-XEDN-003
  title: >-
    Image-set and planted-relation recovery audit of the XEDN relation search,
    with resolution of the p=31 density-versus-coefficient confound

  objective: >-
    Determine the reachable output set of the measurement operator that
    GOAL-XEDN-003 used to test H-XEDN-005, measure its sensitivity as an exact
    recovery table over planted relations of known support and infinity-norm,
    and resolve whether the p = 31 zero-relation cell of EXP-XEDN-006 -- read
    by KN-FIND-010 as a relation-density obstruction -- is distinguishable from
    a relation whose support or infinity-norm lies outside the search.

  what_this_is_not:
    - >-
      Not a discrete-logarithm computation, not an attack, not an ECDLP cost,
      runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme
      claim.
    - >-
      Not a claim that H-XEDN-005 is false, nor that it is true. The experiment
      characterises an instrument; the truth of the coefficient bound is not
      within its reach.
    - >-
      Not a claim that the Coordinator's decisions DEC-20260730-001 or
      DEC-20260730-002 were wrong. Whether an instrument finding changes a
      conclusion is a Coordinator judgement on a superseding record.
    - >-
      Not a request for, or a performance of, any status change to any record.
    - >-
      Not a re-execution of the archived pipeline: Sage is absent from this
      container and the archived Sage program cannot be run here. That
      limitation is recorded as infrastructure signal, never as a result.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      That the archived functions shortest_relation_group_law,
      shortest_relation, height_gram and analyze_surface, as committed at
      experiments/EXP-XEDN-007/implementation/run_census.sage, have reachable
      output set {1,2,3,None} for the reported primary metric; that their
      recovery of a planted relation is exactly the frozen table; and, for the
      specific EXP-XEDN-006 p = 31 surfaces with committed slot lists, whether
      an unbounded search finds a relation outside that region. Nothing beyond
      those three statements, and nothing at all about elliptic-surface
      geometry.
    tier_justification: >-
      Every curve-side input is a committed toy-scale artifact at p <= 31, and
      the synthetic arms are abstract finite abelian groups. Toy evidence is
      never crypto-scale evidence (AGENTS.md rule 7).

  inputs:
    source_under_audit: experiments/EXP-XEDN-007/implementation/run_census.sage
    functions_under_audit:
      - shortest_relation_group_law
      - shortest_relation
      - height_gram
      - analyze_surface
    committed_artifacts:
      - experiments/EXP-XEDN-006/runs/RUN-XEDN-006-MAIN/raw-result.json
      - experiments/EXP-XEDN-006/runs/RUN-XEDN-006-CTRL/raw-result.json
      - experiments/EXP-XEDN-007/runs/RUN-XEDN-007-MAIN/raw-result.json
      - experiments/EXP-XEDN-007/runs/RUN-XEDN-007-CTRL/raw-result.json
      - experiments/EXP-XEDN-007/implementation/xedn7_lib.py
      - experiments/EXP-XEDN-001/xedni_sections.py
    artifact_binding: >-
      Record the SHA-256 of every file above at run start and again at run end.
      Any change invalidates the run. Additionally, search the repository for
      any other committed variant of the census implementation and record the
      digest of each; if a variant differs in coeff_bound, max_support, or the
      support-4 alphabet, the audit is re-aimed at whichever variant the run
      manifests bind to, and this contract is superseded rather than amended.
    planted_relation_grid:
      supports: [2, 3, 4, 5, 6]
      infinity_norms: [1, 2, 3, 4, 5, 6]
      draws_per_cell: 1000
      ambient_group_orders: [31, 101, 961, 10007]
    null_arm_parameters:
      slot_counts: [3, 4, 5, 6]
      draws_per_cell: 1000
      ambient_group_orders: [31, 101, 961, 10007]
    master_seed: 373466
    seed_derivation_rule: >-
      For a stream labelled L at cell index i, the seed is
      int.from_bytes(sha256(("EXP-XEDN-373466/v1|" + L + "|" + str(i)).encode(
      "utf-8")).digest()[:8], "big"), fed to Python's random.Random. Streams:
      "planted", "null", "adversarial", "p31-unbounded". Every seed is
      recorded, so a third party reproduces every synthetic instance
      bit-for-bit.
    environment_declaration: >-
      Verified at ideation time and to be re-verified and recorded at run
      start: `python3 -c "import sage"` raises ModuleNotFoundError; numpy 2.4.6
      is present; sympy is absent. All stages are pure Python (standard library
      plus optional numpy). No stage requires a computer-algebra system, and an
      attempt to install one is an infrastructure request whose outcome is
      infrastructure signal.

  stages:
    ordering_rationale: >-
      Cheapest-first, and the cheapest stage is decisive. Stage 1 is source
      reading at zero compute and can refute the entire hypothesis. Stage 2 is
      seconds. Stage 3 is the only stage that touches committed curve data.
    stage_1:
      name: image-set determination by source reading
      cost: zero compute
      can_terminate_run: true
      content: >-
        Read the four functions line by line. Record, with line references,
        the coefficient alphabet at each support, the support ceiling, the
        caller's argument list, the guard conditions, and the preimages of
        skip_reason = no_relation_in_observed_span. Write the image set as a
        set.
      termination_rule: >-
        If the image set is found to include any value >= 4, HALT and report
        that H-XEDN-58867e is refuted at zero compute. That is the single most
        useful outcome available and it costs nothing.
    stage_2:
      name: reimplementation, fidelity check, and recovery ladder
      cost: seconds to minutes
      can_terminate_run: true
      content: >-
        Reimplement shortest_relation_group_law in pure Python against an
        abstract finite abelian group, preserving the coefficient alphabet, the
        support ceiling, the early return on infinity-norm 1, and the support-4
        {-1,+1} sweep exactly. FIDELITY CHECK FIRST: reproduce all 14 committed
        outputs from the committed slot lists and recorded relation vectors.
        Then run the planted grid and the null arm.
      termination_rule: >-
        If fewer than 14 of 14 committed outputs are reproduced, HALT the
        attribution: the recovery table describes a different instrument and
        must not be attributed to the archived one. The fidelity failure itself
        is then the reported outcome.
    stage_3:
      name: p=31 confound resolution
      cost: minutes
      can_terminate_run: false
      content: >-
        Take the committed slot lists of the EXP-XEDN-006 p = 31 surfaces that
        returned no relation. Specialise each slot at at least 20 smooth fibres
        -- the same verification standard the archived pipeline used -- and run
        an UNBOUNDED integer relation search (exact kernel over Z of the
        specialised coordinate matrix, then LLL plus enumeration on the kernel)
        with no coefficient ceiling and no support ceiling. Any candidate
        relation must ALSO be verified generically before being reported.

  arms_and_controls:
    treatment: >-
      The archived search's behaviour, characterised as (a) its image set from
      stage 1 and (b) its recovery table from stage 2.
    measured_null: >-
      SPURIOUS-RELATION NULL. Slot sets of size n in {3,4,5,6} drawn uniformly
      from an abelian group of order M in {31, 101, 961, 10007}, with NO
      planted relation. FORCED VALUE DERIVED BEFORE THE RUN: the expected
      number of spurious support-3 relations under the alphabet
      {-3..-1,1..3} is approximately C(n,3) * 6^3 / M, e.g. about 4.5 at n = 6,
      M = 961 and about 0.43 at n = 6, M = 10007. THE NULL CAN FAIL AND IS
      EXPECTED TO FIRE at small M -- which is itself important, because p = 31
      gives specialised fibres of order about 31 and the archived pipeline's
      generic F_p(t) check is the only thing standing between a coincidence and
      a recorded relation. Reported as a ratio of measured to predicted, never
      as a raw count.
    positive_control_must_fire: >-
      PLANTED RELATIONS STRICTLY INSIDE THE DECLARED RANGE: support 3 with
      infinity-norm exactly 2, and support 3 with infinity-norm exactly 3. The
      reimplemented search MUST return 2 and 3 respectively, at recovery rate
      1.00. IF EITHER FAILS, the diagnosis changes from "declared ceiling" to
      "implementation defect", NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM,
      and the outcome is an instrument-defect report.
    negative_control_must_not_fire: >-
      PLANTED RELATION AT SUPPORT 3 WITH INFINITY-NORM 4, and at support 5 with
      infinity-norm 1. Both lie outside the declared range and the search MUST
      return None. If it returns a value, the image-set claim is wrong. This is
      the complement of the positive control and both are required.
    graded_control: >-
      RECOVERY LADDER, 6 x 5 cells with >= 3 interior points on each axis.
      Recovery rate over infinity-norm k = 1..6 at fixed support 3, and over
      support s = 2..6 at fixed infinity-norm 1. PREDICTED SHAPE: a STEP, not a
      decay -- 1.00 for k <= 3 and 0.00 for k >= 4; 1.00 for s <= 3, 1.00 for
      s = 4 only at k = 1, 0.00 for s >= 5. A smooth decay instead of a step
      means the search fails for reasons other than its declared bounds and the
      diagnosis must change. Monotonicity in both k and s is reported.
    ordering_control: >-
      The full recovery table and the null arm are computed, written and
      digest-committed BEFORE the stage-3 p = 31 archive arm is looked at, so
      the confound resolution is read against a frozen sensitivity curve. The
      frozen decision rule for stage 3 is executed on the null arm first and
      its verdict recorded.
    comparability_policy: >-
      The reimplementation's recovery table may be attributed to the archived
      instrument ONLY if the fidelity check reproduces 14 of 14 committed
      outputs. No comparison is made to the instruments of EXP-XEDN-002, -003,
      -004 or -005, which were not read at design time; such a comparison
      requires a separately registered comparator contract.

  metrics:
    primary:
      - I1_image_set: the set of distinct non-None values returned over the adversarial sweep
      - I2_recovery_table: recovery rate at every (support, infinity-norm) cell
      - I4_positive_control_values: the values returned on the planted infinity-norm 2 and 3 relations
      - I6_fidelity_count: number of the 14 committed outputs reproduced exactly
    secondary:
      - I3_step_sharpness: recovery at k=3 minus recovery at k=4, and at s=4 minus s=5
      - I5_corank_and_gram_recheck: re-extracted corank and max_abs_coeff_gram on all 14 configurations
      - I7_p31_unbounded_search: per-surface outcome, with generic and specialisation verification
      - null_spurious_rate_ratio: measured over predicted, by (n, M)
      - source_line_references: the exact lines determining the alphabet and support ceiling
      - implementation_variant_digests: digests of every committed census-implementation variant found

  preregistered_prediction:
    quantity: I2_recovery_table
    formula: >-
      recovery(s, k) = 1 if (s <= 3 and k <= 3); 1 if (s = 4 and k = 1); 0
      otherwise.
    source: >-
      Read from the archived source: coeff_bound = 3 and max_support = 3 in the
      signature with no caller override; the support-4 branch sweeps
      product([-1, 1], repeat=4); no support >= 5 combination is formed.
    predicted_value: >-
      Every cell as given; in particular recovery = 0 at every cell with k >= 4
      and at every cell with s >= 5.
    derivation_note: >-
      This is a prediction about a program, derived by reading it, and every
      cell is falsifiable by running it. It is not a distributional claim.

  replication:
    seeds: [373466, 373467]
    independent_instances: 2
    interpretation: >-
      Synthetic arms replicate across both seeds. Stage 1 is deterministic
      source reading and does not replicate; stage 3 is deterministic given the
      committed slot lists, and its reproducibility rests on the artifact
      digests.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 6
    no_network: true

  stopping_rules:
    - Stage 1 halts the run if the image set includes a value >= 4.
    - Stage 2 halts attribution if the fidelity check reproduces fewer than 14 of 14 committed outputs.
    - Stop a planted-grid cell at 1000 draws or at the cell budget; a truncated cell reports its coverage and is not extrapolated.
    - Stop before stage 3 if the recovery table and null arm have not been written and digest-committed.
    - Stop stage 3 after all committed p=31 zero-relation surfaces are covered, or at the budget; a partial stage 3 names the surfaces covered and makes no statement about the rest.

  invalidation_rules:
    - Any change in a committed-artifact digest between run start and run end.
    - Any stage-3 evaluation before the recovery table and null arm are committed.
    - Any relation reported from stage 3 without BOTH generic F_p(t) verification and specialisation at >= 20 smooth fibres.
    - Any change to the frozen recovery table after any cell is observed; a change requires a versioned protocol amendment with confirmatory_status exploratory_only and is never an edit.
    - Attribution of the recovery table to the archived instrument when the fidelity check did not pass.
    - Any statement that the archived search "fails" without the positive controls having fired.

  infrastructure_failure_disposition: >-
    A timeout, crash, memory exhaustion, or missing dependency terminates the
    affected stage and is recorded as failed_infrastructure with the exact
    error. IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md rule 5), never
    evidence about H-XEDN-005 or H-XEDN-58867e, and never evidence about
    elliptic surfaces. Specifically: the absence of Sage prevents re-executing
    the archived program, and that fact is reported as an infrastructure
    limitation on the fidelity of the reimplementation -- not as a finding, and
    not as a reason to weaken any conclusion in either direction.

  success_criterion: >-
    This draft has no current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is
    executed, its positive disposition is: stage 1 produces the image set with
    line references; the fidelity check reproduces 14 of 14; both positive
    controls return exactly 2 and exactly 3; both negative controls return
    None; the recovery table matches the frozen prediction at every cell or
    reports every disagreeing cell; the null's spurious rate is within a factor
    of 2 of its derived expectation; and stage 3 reports a per-surface outcome
    for the p = 31 confound. That disposition supports only the three
    instrument statements in claim_ceiling, and establishes no ECDLP attack,
    cost, exponent, crypto-scale, or deployed-scheme conclusion, and no status
    change.

  falsification_criterion: >-
    The archived search returns any value >= 4 on any input; OR a committed
    implementation variant is found whose bounds differ; OR the fidelity check
    fails; OR the recovery curve decays smoothly instead of stepping at k = 4
    and s = 5; OR re-extraction shows corank >= 1 on any relation-bearing
    configuration. Any of these falsifies H-XEDN-58867e as stated and the
    record is superseded rather than edited.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      evidence, no mathematical inference.
    image_set_confirmed: >-
      Toy-scoped instrument finding: the falsification region of H-XEDN-005 lay
      outside the image of the instrument used to test it, and the
      zero-relation label has three preimages of which two are falsifying. MUST
      be accompanied by the forward guidance required by falsification
      condition F6 of H-XEDN-58867e -- the full recovery table, the stage-3
      resolution, and the costed unbounded-search design -- or the outcome is a
      fatigue report and its honest status is unverified.
    image_set_refuted: >-
      The instrument could reach the falsification region after all. The audit
      withdraws its claim by a superseding record and the existing
      GOAL-XEDN-003 conclusion is strengthened, not weakened.
    p31_relation_found: >-
      A generically verified relation of support >= 5 or infinity-norm >= 4 on
      a p = 31 surface. This CONTRADICTS a committed record and is routed
      immediately to the Coordinator for independent adversarial review; it is
      never absorbed, never used to edit KN-FIND-010, and never reported by
      this experiment as a status change.
    instrument_defect: >-
      A positive control does not fire. Reported as an implementation-defect
      outcome; NO negative statement about the ceiling, the hypothesis, or the
      mathematics may be made.

  required_artifacts_if_later_authorized:
    - The frozen approved specification and a freeze receipt binding its SHA-256.
    - experiments/EXP-XEDN-373466/runs/*/manifest.yaml with the inference block and git state.
    - experiments/EXP-XEDN-373466/runs/*/raw-result.json, stdout.log, stderr.log, command.txt, environment.json.
    - The stage-1 source-reading report with line references and the image set stated as a set.
    - Digests of every committed census-implementation variant discovered.
    - The reimplementation source and its fidelity-check output against all 14 committed configurations.
    - The full recovery table and null arm with every seed, digest-committed before stage 3.
    - The stage-3 per-surface outcome with generic and specialisation verification records.
    - experiments/EXP-XEDN-373466/execution_report.md.

  scale_relevance:
    tier: toy
    transfer_statement: >-
      The image-set statement is a property of a specific committed program and
      transfers to nothing else without that program being read. The METHOD --
      state the reachable output set before reading a result, and check whether
      it intersects the declared falsification region -- transfers to every
      instrument in the program, and naming that as forward guidance is
      permitted; claiming any other instrument has the same defect is not.
    stated_limit: >-
      One instrument lineage, four toy primes, 447 committed surfaces, 14
      relations. No conclusion about elliptic surfaces, the ECDLP, or any scale
      above p = 31.

  approval_requirements:
    - Independent review confirms the image set was determined from the committed source with line references, not inferred from the results.
    - Independent review confirms the recovery table is frozen before any cell is observed, and that positive and negative controls are both present.
    - Independent review confirms stage 3 applies the same verification standard (generic plus >= 20 specialisations) that the archived pipeline used.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved, and only the Coordinator may approve (AGENTS.md rule 1).
  assigned_to: unassigned
