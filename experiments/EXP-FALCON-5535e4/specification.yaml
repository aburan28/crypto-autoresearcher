experiment:
  id: EXP-FALCON-5535e4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5d0c27; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5d0c27
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Dimension sweep of sampler divergence at fixed mantissa width and fixed per-leaf width, fitting
    the transfer exponent with common-mode and independent injected-error arms bracketing it at 2.0
    and 0.5.
  objective: 'The uncertainty a run reduces is whether a single transfer law relates sampler divergence
    to lattice dimension over an accessible range, and what its exponent is. In parts: (i) whether
    toy bases can be constructed at dimensions 4, 8, 16, 32 and 64 with Gram-Schmidt norm spread held
    inside a frozen tolerance, which is the precondition for dimension to be varied alone; (ii) whether
    the two bracketing controls, a common-mode injected error identical at every leaf and an independent
    injected error fresh at every leaf, recover fitted exponents near 2.0 and 0.5 respectively, which
    is what makes any intermediate signal-arm value interpretable; (iii) what exponent the signal
    arm returns at mantissa widths 16, 20 and 24, whether the three agree within 0.25, and whether
    the quadratic curvature coefficient of the log-log fit is consistent with zero. A run does not
    produce a deployed-dimension number, does not perform an extrapolation, and does not reduce uncertainty
    about security or about any specification, and no stage of the procedure computes such a quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the toy bases and sampler built
      in this run, at dimensions 4, 8, 16, 32 and 64, mantissa widths 16, 20 and 24, and the frozen
      statistic and norm-profile tolerance, divergence takes the reported values and the fitted transfer
      exponent takes the reported value with the reported interval and curvature. WHAT DOES NOT FOLLOW:
      no value of the divergence at any untested dimension, and in particular none at 1024 or 2048;
      nothing about FN-DSA parameter sets; nothing about any released implementation; nothing about
      how many signatures any adversary needs; and nothing about security. A fitted exponent over
      a factor of 16 in dimension describes the tested range and licenses no step outside it. Tree
      depth is confounded with dimension throughout, so even inside the range the exponent is joint
      and cannot be attributed to dimension alone.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze the norm-profile tolerance, the statistic and
      its normalization, the dimension and precision grids, and the two injected-error magnitudes.
      STAGE 1, cost about two days: implement the basis constructor with a controlled Gram-Schmidt
      norm profile and verify the tolerance is met at all five dimensions; HALT IF IT IS NOT, and
      report the achieved tolerance as the limiting fact. STAGE 2, cost minutes: verify in exact arithmetic
      that the frozen statistic''s expectation is dimension-independent. STAGE 3, cost about an hour:
      run the all-53 null across all five dimensions and record the estimator noise floor per dimension.
      STAGE 4, cost about two hours: run the two injected-error bracketing arms across all five dimensions
      and fit their exponents; HALT IF THEY DO NOT SEPARATE. STAGE 5, cost about one day: run the
      signal arm at each of the three precisions across all five dimensions, ten independent bases
      per cell, 10^5 signatures per cell. STAGE 6, cost under an hour: fit log divergence against
      log dimension with a quadratic term and report gamma, curvature and cross-precision agreement.'
    instrument: Pure Python 3 for the toy sampler and the basis constructor, using the shared p-bit
      mantissa emulator over Python integers already validated in the enumeration entry of this batch.
      fractions.Fraction for the exact-arithmetic reference expectation of the frozen statistic at
      each dimension. numpy for accumulating 10^5 signatures per cell and for the weighted least-squares
      log-log fit with a quadratic term. Run manifests through harness/runner.py. No Sage, no external
      computer algebra, no network.
    parameters: 'Dimensions 4, 8, 16, 32 and 64. Mantissa widths 16, 20 and 24. Target per-leaf width
      held at a single frozen value across all dimensions, with Gram-Schmidt norm spread required
      inside a frozen relative tolerance of 5 percent. Ten independently generated bases per cell.
      Signatures per cell 10^5. Signal cells 5 times 3 times 10 = 150. Null cells five dimensions
      times ten bases. Bracketing control arms: two arms times five dimensions times ten bases, injected
      error magnitude fixed at 1e-3 relative in both.'
  controls:
  - All-53 null arm swept across the same dimensions, must show divergence at the noise floor and
    a failed rather than a clean gamma fit.
  - Common-mode injected-error positive control, identical error at every leaf, must fit gamma near
    2.0.
  - Independent injected-error positive control, fresh error at every leaf, must fit gamma near 0.5.
  - 'Conditioning control: at each dimension report the Gram-Schmidt norm spread and confirm it is
    held within a frozen tolerance across the sweep.'
  - 'Statistic-normalization control: verify the exact-arithmetic expectation of the frozen statistic
    is dimension-independent by construction, computed in exact arithmetic at each dimension.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm sweeps dimension with the sampler at reference precision
    53 in every role, through the identical pipeline and log-log fit. The null must show divergence
    indistinguishable from the estimator noise floor at every dimension and a fitted gamma whose confidence
    interval contains no meaningful value, that is a fit that fails rather than one that succeeds
    with a small number. If the null returns a clean nonzero gamma, the pipeline is manufacturing
    a dimension trend out of estimator behaviour and every signal reading is void. The two injected-error
    arms, common-mode and independent, serve as bracketing positive controls at 2.0 and 0.5.'
  independent_variables:
  - lattice dimension d
  - mantissa width p
  - error correlation class in the control arms, common-mode versus independent
  - basis index
  metrics:
    primary:
    - divergence of the frozen statistic from its exact expectation per cell, with confidence interval
    - fitted transfer exponent with confidence interval at each precision
    - quadratic curvature coefficient of the log-log fit
    - fitted exponent in each bracketing control arm
    secondary:
    - Gram-Schmidt norm spread achieved at each dimension
    - estimator noise floor from the null at each dimension
    - across-basis variance of divergence per cell
    - wall-clock per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exponent relating sampler divergence to lattice dimension at fixed mantissa width
      and fixed per-leaf width.
    formula: Divergence(d) = C * d^gamma, fitted as log divergence equals log C plus gamma times log
      d plus kappa times the square of log d, with kappa the curvature term predicted to be consistent
      with zero. gamma is predicted to be 2.0 in the common-mode control arm and 0.5 in the independent
      control arm; no value is pre-committed for the signal arm, and the bracketing arms are what
      make the signal-arm value interpretable.
    source: Pre-registered in the parent proposal IDEA-20260816-5d0c27 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at dimensions 4 to 64 against a deployed dimension of 1024 or 2048, so
      the tested range ends a factor of 16 below deployed, and at mantissa widths 16 to 24 against
      a deployed 53. EXTRAPOLATION ASSUMPTION: none is made. This contract explicitly refuses to report
      any value at an untested dimension; its entire purpose is to measure whether a law that an extrapolation
      would need even exists over an accessible range, and a successful fit inside that range is reported
      as exactly that. Tree depth varies with dimension and is confounded with it by construction,
      which is stated as a limitation of the design and is not repaired by any stage.'
    correspondence: null
  tail_checks:
  - Report the across-basis variance per cell and flag cells where one basis dominates the mean.
  - Confirm the estimator noise floor from the null is at least a factor of five below the smallest
    reported signal at every dimension, and mark cells that fail.
  - Report the achieved Gram-Schmidt norm spread at every dimension next to the divergence, so a reader
    can see whether conditioning drifted.
  - Refit gamma excluding the largest dimension and excluding the smallest, and report both, since
    a power law driven by one endpoint is not a law.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt at STAGE 1 and report the achieved norm-profile tolerance as the limiting fact if the frozen
    tolerance cannot be met at all five dimensions.
  - Halt at STAGE 4 and report instrument failure if the two bracketing arms do not separate by at
    least 1.0 in fitted exponent.
  - Cap signatures at 10^5 per cell and report the achieved confidence interval rather than extending
    the budget to reach a target precision.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The bracketing control arms recover exponents within 0.25 of 2.0 and 0.5 respectively,
    the null shows no clean fit, and the signal arm's exponent is estimated with a confidence half-width
    below 0.25 at each of the three precisions, whatever the values turn out to be.
  falsification_criterion:
  - Bracketing arms failing to separate or missing their forced values by more than 0.25.
  - The all-53 null returning a clean nonzero exponent.
  - Gram-Schmidt norm spread outside the frozen tolerance at any dimension.
  - Significantly nonzero curvature coefficient, falsifying the single-power-law premise.
  - Fitted exponent differing by more than 0.25 across the three precisions, falsifying separability.
  - Divergence below the noise floor at dimension 4 for all three precisions, leaving no measurable
    window.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5d0c27
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The basis-construction routine that holds the Gram-Schmidt norm profile fixed across a factor
    of 16 in dimension is asserted to exist but not specified, and it is the load-bearing component.
  - The frozen statistic and its dimension-independent normalization are not written down, and the
    exponent is meaningless without them.
  - The confounding of tree depth with dimension is acknowledged but not addressed; a Coordinator
    should decide whether a depth-controlled variant is worth designing before approval.
  - Whether divergence is measured as a distance, a Kullback-Leibler divergence, or a normalized moment
    deviation changes the exponent by a factor of two, and the choice must be fixed before the run.
