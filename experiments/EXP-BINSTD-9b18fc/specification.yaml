experiment:
  id: EXP-BINSTD-9b18fc
  hypothesis_id: H-BINSTD-73ea03
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261003-94078e
  goal_id: GOAL-ECDLP2M-001
  predecessor_experiment_id: EXP-BINSTD-16ee30
  predecessor_evidence_id: EV-BINSTD-69cb29
  predecessor_decision_id: DEC-20261003-5e4cb9
  ancestor_evidence_id: EV-BINSTD-a99d47
  version: 1
  title: >-
    Enhanced diversity + scoped (17,4) successor: target ≥3 distinct dim(V·V)
    on (17,3) and replicate floors-met fail-band on (17,4) under band 0.70
  status: approved
  approved_by: DEC-20261003-6e578e
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-6e578e under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Do not re-run EXP-BINSTD-16ee30 or
    EXP-BINSTD-5b2fd0 v1. Stage 2 not authorized here.
  approval:
    approved_by: DEC-20261003-6e578e
    composing_decision: DEC-20261003-6e578e
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized. Cites
      EV-BINSTD-69cb29 / DEC-20261003-5e4cb9 NA-1 and EV-BINSTD-a99d47.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes enhanced diversity-seeking V catalogs (≥32, ≤72),
      Spearman band 0.70, new seeds, encoder pin, twin probes, Stage-1
      pre-screen, scoped (17,4) authorization. Stage 1 runs n=17 ℓ∈{3,4}
      with twin meters; FORALL admission floors before package band;
      scoped (17,4) outcome; RESULTS.md with package + scoped labels.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    After EV-BINSTD-69cb29, decide whether an enhanced diversity-seeking
    catalog meets FORALL admission floors (esp. ≥3 dimVV on (17,3)) and then
    whether Spearman ρ(dim(V·V), N_var) ≥ 0.70 on Stage-1 cells; and
    independently whether (17,4) floors-met fail-band (CI entirely <0.70)
    replicates under the new catalog. Deliver package O-* plus scoped_17_4.

  class: heuristic_validation
  class_note: >-
    Pre-registered Spearman band on an encoding-size instrument with
    catalog-power repair and scoped cell replication. Not an
    exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Enhanced diversity-seeking freeze (≥32, ≤72 shapes;
        dimVV-first; sparse/compmix/mtranslate/twist) for
        (n,ℓ)∈{17,19,23}×{3,4}; freeze preregistered-predictions.json
        (band 0.70, seeds 2026100330/2026100331, admission gates, scoped
        (17,4) rule, encoder pin); twin self-check; Stage-1 cells pre-screen.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4)} measure twin dimVV and twin
        N_var; FORALL ADMISSION GATE (≥3 distinct dimVV, ≥2 distinct N_var)
        before package Spearman band; SCOPED (17,4) floors-met fail-band
        replication independently; write panels/control-table/RESULTS.md.
    excluded:
      - Re-running EXP-BINSTD-16ee30 (seed 2026100320) or EXP-BINSTD-5b2fd0 (seed 2026100317).
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n=19,23 panels and random-Boolean null under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the 0.70 band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Reading package O-SUPPORT/O-FAIL-BAND without FORALL admission floors.
      - Upgrading package O-INCONCLUSIVE to package O-FAIL-BAND from scoped (17,4) alone.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-9b18fc/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-9b18fc/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-9b18fc/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-9b18fc/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-9b18fc/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261003-94078e.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-73ea03.yaml
    predecessor_evidence: ledger/evidence/EV-BINSTD-69cb29.yaml
    predecessor_decision: ledger/decisions/DEC-20261003-5e4cb9.yaml
    ancestor_evidence: ledger/evidence/EV-BINSTD-a99d47.yaml
    spearman_band: 0.70
    catalog_seed: 2026100330
    bootstrap_seed: 2026100331
    bootstrap_reps: 200
    min_catalog: 32
    max_catalog: 72
    admission_floor_dimVV: 3
    admission_floor_Nvar: 2
    forbidden_catalog_seeds: [2026100317, 2026100320]
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_dimVV
      definition: >-
        product_space.dim_vv_path_a == dim_vv_path_b on every measured V.
    - name: twin_Nvar
      definition: >-
        encode_s3 N_var path A == path B (independent linear elim) on every
        measured V.
    - name: ctl_fixed_dim_V
      definition: Every catalog entry has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Spearman band 0.70 frozen in preregistered-predictions.json.
    - name: ctl_admission_floors_before_band
      definition: >-
        ≥3 distinct dimVV and ≥2 distinct N_var required on EVERY Stage-1
        cell before any package O-SUPPORT/O-FAIL-BAND; else package
        O-INCONCLUSIVE.
    - name: ctl_scoped_17_4_independent
      definition: >-
        When n17_l4 floors met and CI95 entirely <0.70, scoped_17_4_outcome
        = O-CELL-FAIL-BAND-17-4 is authorized even if (17,3) floors fail;
        does not upgrade package O-INCONCLUSIVE.
    - name: ctl_not_prior_catalog_rerun
      definition: >-
        catalog_seed ∉ {2026100317, 2026100320}; recipe is enhanced
        diversity-seeking (≥32); check.py refuses prior seed reuse.
    - name: null_random_boolean_matched_catalog
      definition: >-
        Stage 2 only (NOT AUTHORIZED). Named so the Stage-1 reading cannot
        silently claim the null.

  independent_variables:
    - name: stage
      levels: [0_enhanced_diversity_freeze, 1_forall_admission_and_scoped_17_4]
    - name: cell
      levels: ['(17,3)', '(17,4)']
    - name: V_shape_family
      levels: [poly, geometric, shifted_poly, affine_twist, complement_mix, mtranslate, sparse, random_dim_first]

  metrics:
    primary:
      - name: admission_floors_met
        unit: boolean
        definition: ≥3 distinct dimVV and ≥2 distinct N_var on the cell.
      - name: spearman_dimVV_vs_Nvar
        unit: dimensionless
        definition: >-
          Spearman ρ between dim(V·V) and N_var across the catalog;
          package band verdict only when FORALL admission_floors_met.
      - name: scoped_17_4_outcome
        unit: categorical
        definition: >-
          Independent (17,4) floors-met fail-band replication label.
      - name: twin_agreement
        unit: boolean
        definition: Both twin meters agree on every measured V.
    secondary:
      - name: bootstrap_ci_95
        unit: interval
      - name: distinct_dimVV
        unit: integer
      - name: distinct_Nvar
        unit: integer
      - name: catalog_size
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-BINSTD-febbe1-H1

  preregistered_prediction:
    quantity: >-
      After FORALL admission floors (≥3 distinct dimVV, ≥2 distinct N_var),
      Spearman ρ(dim(V·V), N_var) ≥ 0.70 on each Stage-1 cell under twin
      agreement. Independently: (17,4) floors met and CI95 entirely <0.70
      → O-CELL-FAIL-BAND-17-4 under the new catalog.
    formula: >-
      N_var = |nonlinear_support \ pivots| after F_2 Gaussian elimination
      of pure-linear equations from Weil-descended S_3; dim(V·V) via twin
      product-space ranks; catalog built by enhanced dimVV-first diversity freeze.
    source: >-
      IDEA-20261003-94078e / EV-BINSTD-69cb29 follow-up; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-size instrument on n=17 only under this card. No transfer of
      a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids ρ claims (O-ARTIFACT).
    - FORALL admission floor failure → package O-INCONCLUSIVE (band not authorized).
    - Prior catalog seed reuse → protocol invalid / check.py FAIL.
    - Scoped (17,4) fail-band does not upgrade package O-INCONCLUSIVE alone.

  seeds_and_replication:
    catalog_seed: 2026100330
    bootstrap_seed: 2026100331
    bootstrap_reps: 200
    independent_instances: 2
    note: >-
      Cells (17,3) and (17,4) are independent instances. Twin meters are the
      replication instrument for each V. Seeds deliberately differ from
      16ee30 (2026100320/21) and 5b2fd0 v1 (2026100317/18).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names package O-* from H-BINSTD-73ea03 and scoped_17_4_outcome.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.
    - Do not re-run EXP-BINSTD-16ee30 or EXP-BINSTD-5b2fd0 v1.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read ρ as support.
    - Package band outcome without FORALL admission floors → protocol invalid.
    - Re-using catalog seeds 2026100317 or 2026100320 → protocol invalid.
    - Upgrading package O-INCONCLUSIVE from scoped (17,4) alone → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes and catalog_size
    ≥32 on Stage-1 cells; Stage 1 produces FORALL admission-floor status,
    package Spearman when floors met, and scoped_17_4_outcome (or a named
    O-ARTIFACT/O-IMPEDIMENT stop); RESULTS.md names package O-* from
    H-BINSTD-73ea03 plus scoped_17_4_outcome with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc band edit; package band verdict
    without FORALL floors; prior catalog re-run; package upgrade from scoped
    (17,4) alone; a claimed break/exponent under this card.
    (O-FAIL-BAND and O-CELL-FAIL-BAND-17-4 are valid scientific negatives
    of support / in-band, not protocol fails.)

  required_artifacts:
    - experiments/EXP-BINSTD-9b18fc/trial-plan-v1.json
    - experiments/EXP-BINSTD-9b18fc/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-9b18fc/stage0/v-catalog.json
    - experiments/EXP-BINSTD-9b18fc/stage1/
    - experiments/EXP-BINSTD-9b18fc/RESULTS.md
    - experiments/EXP-BINSTD-9b18fc/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-9b18fc/implementation/run.py
    - experiments/EXP-BINSTD-9b18fc/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
