experiment:
  id: EXP-ECDLP-5b534b
  hypothesis_id: H-ECDLP-081a6b
  version: 1
  title: >-
    Quadratic-twist cost identity for the j = m-1 complete-splitting locus -
    exact set-equality against the direct polynomial root, with a
    wrong-rescaling mutant, a nearest-non-twist curve on which the conclusion
    is known false, and two candidate controls excluded IN ADVANCE as
    degenerate
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Machine-check, by exact computation rather than statistics, whether the
    signed sum on the j = m-1 locus can be computed with m-1 F_p-group
    additions on the quadratic twist E_delta(F_p) plus one multiplication,
    reproducing the direct polynomial root x(Q) exactly. If it holds, the
    j = m-1 branch is pinned at the SAME per-attempt order as the already
    pinned j = 0 branch, completing a two-branch cost law that no record in
    this program states. If it fails, the isomorphism or the sign convention
    has an error the hand derivation missed. NO EXPONENT MOVES EITHER WAY.
    This contract is DRAFT and confers no execution authority.

  scope_correction_note: >-
    THIS CONTRACT DELIBERATELY DOES NOT RE-RUN THE PARITY CENSUS its source
    idea proposed. The source's justification for that census was that the
    paired experiment of the lane's theorem record had never been executed.
    Read directly in this session, experiments/EXP-MONO-12ce1c/
    specification.yaml carries `status: completed`, `execution_authorized:
    true`, `evidence_eligible: true`, a status_note recording two runs on
    2026-08-30 with independent validator and red-team review, and a contract
    specifying m in {3, 4, 5} with at least 20,000 specializations per cell -
    roughly two orders of magnitude beyond the 500 and 200 trials the source
    proposed. That census is DISCHARGED. The parity ladder survives here only
    as a BLOCKING BASELINE GATE (the committed 193/193 j = 0 fixture) and as
    the definition of the locus. The source's characterisation was correct
    when written on 2026-08-30 and was overtaken the same day; it is recorded
    rather than corrected, because that record is immutable.

  preregistered_prediction:
    quantity: >-
      AGREEMENT RATE: the fraction of sampled j = m-1 tuples at which the SET
      {x(Q)} computed by twist arithmetic on E_delta(F_p) equals, exactly as
      a set, the SET of roots of the specialised summation polynomial over
      F_p. Dimensionless, in [0,1]. Plus OPERATION COUNT: F_p additions on
      E_delta and F_p multiplications per attempt, as integers.
    formula: >-
      Agreement rate exactly 1.000 at every tested (m, p) cell. Operation
      count exactly m-1 additions plus 1 multiplication plus 1 O(1) lookup.
      The underlying identity: for delta a fixed non-residue and
      f(x_i)/delta = (y_i')^2 with y_i' in F_p, the map (x, y') to
      (delta*x, delta^2*y') carries (y')^2 = f(x)/delta isomorphically onto
      E_delta: Y^2 = X^3 + A*delta^2*X + B*delta^3, an F_p-rational curve;
      isomorphisms commute with the group law, so
      x(Q) = X(sum eps_i (delta*x_i, delta^2*y_i')) * inverse(delta) mod p.
    source: >-
      Hand derivation in IDEA-20260830-d84f6a, re-derived symbolically as a
      zero-compute gate in Stage 0 of this contract by direct expansion of
      delta^3 * f(X/delta). The general facts that a quadratic twist of a
      non-singular curve is non-singular and that an isomorphism of elliptic
      curves commutes with the group law are RECALLED and were fetched by no
      agent in this program; they are NAMED for a reviewer and support
      nothing here.

  inputs:
    curves: >-
      The committed fixture curve p = 211, a = 37, b = 57 (blocking baseline)
      plus one curve at p = 1009; and one deterministically-found curve with
      full rational 2-torsion (tau = 4) at p = 211, found by trial search
      over b' increasing from a fixed seed for the first b' giving a
      non-singular x^3 + 37x + b' with three distinct roots mod 211, reported
      explicitly once found rather than hand-picked in advance.
    delta: >-
      one fixed quadratic non-residue per p, chosen once, shared across every
      j = m-1 construction in a cell, and RECORDED, so the twisted factor
      base is a stable precomputed table.
    tuples: >-
      j-stratified: for the identity arm, all m-1 coordinates drawn from a
      precomputed twisted factor base of non-residue x-coordinates; for the
      baseline gate, all coordinates on-curve.
    exclusions: "distinct x-values, f(x_i) nonzero for all i; the ramified locus is excluded"

  independent_variables:
    - "m in {4, 5}"
    - "p in {211, 1009}"
    - "arm: correct twist route; wrong-rescaling mutant; nearest-non-twist curve E''; j = 0 baseline gate"
    - "curve 2-torsion order tau in {fixture value, 4} for the genericity control"

  null_object:
    name: >-
      THE WRONG-RESCALING-CONSTANT MUTANT (proves-too-much, blocking) and THE
      NEAREST-NON-TWIST CURVE E'' (nearby object where the conclusion is
      KNOWN FALSE, blocking).
    construction: >-
      MUTANT-1, WRONG RESCALING. Build the twist E_delta and the sum R
      exactly as the correct route does, then perform the FINAL RESCALING
      with a different non-residue delta' not equal to delta: report
      X(R) * inverse(delta') instead of X(R) * inverse(delta). The returned
      x-set is then scaled by delta/delta' not equal to 1 and is generically
      a different set. Run at m = 4, p = 211, j = 3, n = 50.
      MUTANT-2, NEAREST NON-TWIST. Replace E_delta by E'': Y^2 = X^3 +
      A*delta^2*X + B*delta^3 + c for the smallest c >= 1 leaving the curve
      non-singular, and run the identical pipeline. E'' is a perfectly good
      elliptic curve over F_p but is NOT the quadratic twist of E by delta,
      so no isomorphism to the auxiliary curve exists and the conclusion is
      KNOWN FALSE on it by construction. Run at m = 4, p = 211, j = 3,
      n = 50.
    non_degeneracy_check: >-
      PERFORMED IN ADVANCE, AND IT DISQUALIFIED TWO OTHERWISE-NATURAL
      CONTROLS. The compared object is a SET of x-values over ALL sign
      classes, and two obvious mutations leave that set FIXED BY
      CONSTRUCTION, so their acceptance band is width zero and they could not
      fail even against a wholly wrong construction.
      REJECTED MUTANT A - flipping the sign of y_i'. Replacing P_i by -P_i
      merely relabels eps_i in the signed-sum enumeration, and the set over
      all sign classes is unchanged. This is the same reason the summation
      polynomial does not depend on those choices.
      REJECTED MUTANT B - rebuilding BOTH the twist and the rescaling with
      delta'. Since delta' = s^2 * delta for some s in F_p^*, E_delta' is
      F_p-isomorphic to E_delta and X(R')/delta' = X(R)/delta exactly; the
      two rescalings cancel the isomorphism and the x-set is again fixed.
      NEITHER IS USED, AND THE EXCLUSION IS RECORDED HERE RATHER THAN
      DISCOVERED LATER. The two surviving mutants above are non-degenerate:
      MUTANT-1 scales the whole set by a factor other than 1, and MUTANT-2
      removes the isomorphism entirely, so each has a reachable failure and a
      reachable pass.
    dynamic_range_demonstration: >-
      A GRADED PERTURBATION LADDER on the twist coefficients, run alongside
      the two mutants, so the instrument's response is measured at known
      defect sizes rather than only at "correct" and "grossly wrong".
      Instantiate E_pert: Y^2 = X^3 + (A*delta^2 + e_1)*X + (B*delta^3 + e_2)
      for (e_1, e_2) in {(1,0), (0,1), (1,1), (delta,0)}, keeping every other
      step identical, and record the agreement rate at each rung. PREDICTED:
      the agreement rate falls from 1.000 at (0,0) to near 0 at the FIRST
      nonzero perturbation, because the perturbed curve is a different curve
      and the isomorphism is destroyed at once. A ladder whose agreement rate
      degrades GRADUALLY, or that stays near 1.000 at any nonzero rung, means
      the comparison is not sensitive to the curve at all and the main result
      is void. Rungs that are singular are recorded as skipped with the
      reason, not silently dropped.
    curve_free_null: >-
      NOT APPLICABLE AS AN ARM, AND THE REASON IS STATED RATHER THAN THE
      REQUIREMENT OMITTED. The measured signature is "a signed sum computed
      by the group law on curve E_delta over F_p, pushed through an
      isomorphism, agrees with the roots of a summation polynomial of curve
      E". Both objects are elliptic curves and the isomorphism between them
      IS the claim; there is no non-curve object that could reproduce this
      signature, because removing the curves removes the statement. The
      standing scope constraint is therefore discharged HERE by the
      nearest-non-twist control MUTANT-2, which plays the same role a
      curve-free null plays elsewhere: it is the object on which the
      conclusion is known false, and the instrument must return near-zero
      agreement on it or it is not measuring what this contract says it
      measures.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE AND BINDING. (i) If MUTANT-1 or MUTANT-2 reproduces
      x(Q) at a rate near 1.000, the exact-match test has NO discriminating
      power and NOTHING from the identity arm may be quoted, however clean
      its own number. (ii) If the perturbation ladder does not collapse at
      the first nonzero rung, the comparison is insensitive to the curve and
      the same prohibition applies. (iii) Even on complete success, the
      result is a PER-ATTEMPT COST IDENTITY at toy parameters and may NOT be
      quoted as an exponent, a speedup, or a statement about the ECDLP: the
      attempt count is untouched and the composed accounting remains strictly
      worse than Pollard rho at every finite m. Every quotation of the m-1
      addition count must carry the one extra multiplication and the second
      precomputed table beside it.

  controls:
    - >-
      HARD-GATE FIXTURE REPRODUCTION (Stage 1, CAN FAIL): the committed
      m = 4, p = 211, j = 0 result must reproduce 193/193 cell for cell
      before anything new is interpreted.
    - >-
      MUTANT-1 WRONG-RESCALING-CONSTANT (blocking, proves-too-much). See
      null_object.
    - >-
      MUTANT-2 NEAREST-NON-TWIST CURVE E'' (blocking, nearby object where the
      conclusion is known false). See null_object.
    - >-
      PERTURBATION LADDER at four rungs (blocking dynamic-range check). See
      null_object.
    - >-
      TWO DEGENERATE MUTANTS EXCLUDED IN ADVANCE, with the reason recorded in
      this contract: the y_i' sign flip and the delta'-rebuilt-twist. Using
      either as a control is an INVALIDATION under the rules below.
    - >-
      SYMBOLIC RE-DERIVATION GATE (Stage 0, zero compute): re-derive
      delta^3 * f(X/delta) = X^3 + A*delta^2*X + B*delta^3 by direct
      expansion, and re-derive Frob(sqrt(delta)) = -sqrt(delta) from Euler's
      criterion. A failure halts before any cell runs.
    - >-
      UNIT-DECLARATION TRIPWIRE: the extra F_p multiplication is COUNTED and
      REPORTED explicitly in the cost accounting and is never silently
      absorbed into "the same cost as j = 0"; likewise the twisted-factor-base
      build cost is charged separately from per-attempt cost.
    - >-
      2-TORSION-DIVERSITY CONTROL (tau = 4 curve versus the fixture curve, at
      m = 4, p = 211, n = 300 across all intermediate j cells): the nearby
      object on which the genericity condition is most likely to fail. Either
      a measurable elevation is observed, or the report states explicitly
      that toy-scale N could not resolve the predicted tau/N effect at this
      sample size. A null here is NOT treated as confirmation of absence.

  metrics:
    primary:
      - "exact SET-equality rate between twist-computed x(Q) and direct-root x(Q), per (m, p) cell; dimensionless rate in [0,1]; required exactly 1.000"
      - "operation count for the twist route per attempt: F_p additions on E_delta and F_p multiplications; INTEGER COUNTS; required exactly m-1 and 1"
      - "MUTANT-1 agreement rate; dimensionless rate; required materially below 1.000, predicted near 0"
      - "MUTANT-2 agreement rate on the nearest-non-twist curve; dimensionless rate; required near 0"
      - "perturbation-ladder agreement rate per rung; dimensionless rate; required to collapse at the first nonzero rung"
      - "j = 0 fixture reproduction; count of complete splittings out of 193; required exactly 193"
    secondary:
      - "split_with_multiplicity and split_distinct per (m, p, j) cell; dimensionless rates"
      - "full factor-degree multiset per cell; integer partition of 2^{m-2}"
      - "intermediate-j split rate on the tau = 4 curve versus the fixture curve; dimensionless rates with binomial intervals"
      - "count of individually-attributed genericity-gap tuples (a signed subset sum landing in E[2]); integer, reported per tuple rather than averaged"
      - "twisted-factor-base build cost, charged SEPARATELY from per-attempt cost; F_p operations, integer"
      - "memory: size of the twisted factor base in words, beside the on-curve base; integer, disclosed as a 2x increase and never folded in"
      - "wall-clock seconds and peak RSS in GiB per cell"

  heuristic_under_test: HEUR-TWIST-1

  scale_relevance:
    tier: toy
    justification: >-
      p in {211, 1009}, m in {4, 5}, degree at most 2^{m-2} = 8. The identity
      arm is an EXACT computation over the sampled tuples rather than a
      statistical estimate, so within its scope it is decisive; outside it,
      nothing is claimed. NO TRANSFER TO CRYPTOGRAPHIC SCALE IS CLAIMED OR
      LICENSED, and none is needed, because the identity claims no exponent:
      it pins a per-attempt constant. THE ONE QUESTION THIS CONTRACT RAISES
      AND CANNOT ANSWER AT REACHABLE SCALE is whether the genericity gap - a
      signed subset sum landing in the 2-torsion, of predicted order tau/N -
      ever fires at cryptographically relevant N. This design measures its
      order of magnitude at p at most 1009 and CANNOT test it at scale; that
      is stated rather than narrowed away.
    correspondence: null

  tail_checks:
    - "The m = 5 cells, the largest degree tested, where an isomorphism error would first manifest as a multi-root mismatch rather than a single-value one."
    - "Any single genericity-gap-violating tuple observed on either curve, reported INDIVIDUALLY with its subset sum, rather than only as an aggregate rate."
    - "The tuples whose direct-root set has repeated roots, reported separately, since multiplicity is where a set comparison can hide a difference."
    - "The perturbation rung nearest the correct curve, (e_1, e_2) = (1, 0), which is the smallest defect the ladder plants."

  replication:
    seeds: [7, 13, 19]
    independent_instances: 3
  seeds_policy: >-
    Three declared seeds, fixed here before execution and never re-drawn
    after an outcome is seen. Seeds govern ONLY the sampling of j-stratified
    tuples from the precomputed factor bases; delta, the twist coefficients,
    the perturbation rungs and the mutant constants are DETERMINISTIC and
    recorded in this contract, so their arms have no seed variation and none
    is reported for them. Every trial record carries (curve, p, m, j, arm,
    seed, tuple) so any trial is reproducible in isolation. Because the
    identity arm is an EXACT equality test rather than an estimate, seeds
    affect only which tuples are examined and never whether a mismatch is
    reportable: a SINGLE mismatch at any seed falsifies the identity and is
    not averaged against other seeds.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
  budget_note: >-
    Sized to the work. The dominant cost is the ONE-TIME symbolic
    construction of the m = 5 summation polynomial by a further resultant
    elimination, which does not exist in the committed harness today and is
    disclosed as an implementation cost rather than assumed away; every trial
    then evaluates it numerically. Per-trial arithmetic is exact over F_p
    with p at most 1009. The 8 GB figure is the schema floor; peak RSS is a
    required metric so the envelope prediction can fail. A resultant
    elimination that exceeds the wall clock is an INFRASTRUCTURE stop under
    AGENTS.md rule 5, never negative evidence about the identity.

  stopping_rules:
    - "STAGE 0, zero compute, HARD GATE: symbolic re-derivation of the twist coefficient scaling and of Frob(sqrt(delta)) = -sqrt(delta). A failure halts before any cell runs."
    - "STAGE 1, HARD GATE: reproduce the committed m = 4, p = 211, j = 0 fixture 193/193. A miss stops the run and nothing else is interpretable."
    - "STAGE 2: the identity arm at m in {4,5}, p in {211,1009}, j = m-1 only. A SINGLE set-equality mismatch STOPS the arm and is reported as the headline negative result rather than being averaged away."
    - "STAGE 3: MUTANT-1, MUTANT-2 and the perturbation ladder. If MUTANT-1 or MUTANT-2 agrees at a rate near 1.000, or the ladder fails to collapse at the first nonzero rung, the identity arm's result is VOID and is reported as unsupported."
    - "STAGE 4: the tau = 4 genericity control. Its outcome is reported either way and never treated as confirmation of absence."
    - "Any timeout, crash, or failure to construct the m = 5 polynomial is failed_infrastructure under AGENTS.md rule 5."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Using the y_i' SIGN FLIP as a control. It relabels eps_i and leaves the compared x-set fixed by construction; it is a width-zero test and is EXCLUDED IN ADVANCE by this contract."
    - "Using a twist REBUILT WITH delta' TOGETHER WITH the matching delta' rescaling as a control. E_delta' is F_p-isomorphic to E_delta and the two rescalings cancel; also width-zero and also EXCLUDED IN ADVANCE."
    - "Rebuilding the summation polynomial with a fresh symbolic resultant call inside the sampling loop rather than once outside it."
    - "Folding the extra F_p multiplication or the twisted-factor-base build cost into the j = 0 branch's addition count."
    - "Quoting any result of this contract as an exponent, a speedup, or a statement about the ECDLP."
    - "Re-running or re-reporting the parity census; that measurement is discharged by a completed committed experiment at higher resolution, and duplicating it here would be scope expansion."
    - "Any post-hoc change to the mutant constants, the perturbation rungs, or the required rates. A change requires a versioned protocol_amendment before the affected arms are re-read."

  success_criterion: >-
    The run SUCCEEDS, whichever way the identity falls, when: the Stage 0
    symbolic re-derivation passes; the j = 0 fixture reproduces 193/193; the
    identity arm is run at all four (m, p) cells with the declared trial
    counts and its set-equality rate reported per cell; MUTANT-1 and MUTANT-2
    are run at n = 50 each and their agreement rates reported; the
    perturbation ladder is run at all four rungs; the operation count is
    reported as explicit integers with the extra multiplication and the table
    build cost listed SEPARATELY; and the tau = 4 genericity control is run
    and reported with an explicit statement of whether the sample size could
    resolve a tau/N-order effect.

  falsification_criterion: >-
    THE COST IDENTITY IS FALSIFIED by a SINGLE j = m-1 trial in which the
    twist-computed x(Q) differs as a set from the direct-root x(Q); this is
    the headline negative result and is reported as such, localising the
    error to the sign convention or to the isomorphism step. THE TEST HAS NO
    DISCRIMINATING POWER, and the identity arm's number is unsupported
    however clean, if MUTANT-1 or MUTANT-2 agrees at a rate near 1.000 or if
    the perturbation ladder does not collapse at the first nonzero rung. THE
    CLAIM DOES NOT HOLD AS STATED if the operation count exceeds m-1
    additions plus one multiplication plus one O(1) lookup. THE RUN IS
    UNINTERPRETABLE if the j = 0 fixture does not reproduce. A j = m-1 tuple
    failing to split completely would contradict the already-committed parity
    law rather than this contract and MUST be escalated to independent review
    rather than absorbed.

  required_artifacts:
    - "Stage 0 receipt: the symbolic expansion of delta^3 * f(X/delta) and the Euler-criterion derivation of Frob(sqrt(delta)) = -sqrt(delta)."
    - "Stage 1 receipt: the 193/193 j = 0 fixture reproduction, cell for cell, on the committed curve."
    - "Per-trial records for the identity arm: curve, p, m, j, delta, tuple, twist-computed x-set, direct-root x-set, set-equality boolean, operation counts."
    - "MUTANT-1 and MUTANT-2 tables at n = 50 each, with their delta' and c values recorded."
    - "The perturbation-ladder table: rung (e_1, e_2), non-singularity check, agreement rate, or SKIPPED with the reason."
    - "The excluded-mutant note, recording the two degenerate candidates and the reason each is width-zero, so a later session does not reintroduce them."
    - "The tau = 4 genericity table with per-tuple attribution of any gap violation."
    - "Cost accounting: additions, multiplications, lookups per attempt, with the table build cost and the second table's memory listed separately and never folded in."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr, peak RSS, wall clock."

  assigned_to: executor

  limitations:
    - >-
      NO EXPONENT MOVES IN EITHER DIRECTION. D_trial stays O(m) on both
      branches, the attempt count is untouched, and the composed accounting
      remains strictly worse than Pollard rho at every finite m.
    - >-
      TOY SCALE: p at most 1009, m at most 5.
    - >-
      THE PARITY LAW IS NOT MEASURED HERE and this contract is not its
      source. It is already derived in this lane and already measured by a
      completed, independently reviewed experiment at higher resolution.
    - >-
      The identity is a hand derivation that no agent in this program has
      machine-checked; this contract is exactly that check, and until it runs
      the claim carries no more weight than "hand derivation, unverified".
    - >-
      DISCLOSED OVERHEADS: one extra F_p multiplication per attempt; a second
      precomputed table of the same order as the first, a 2x memory increase;
      and the m = 5 summation polynomial, which does not exist in the
      committed harness and must be built.
    - >-
      A curve-free null is NOT APPLICABLE here and the reason is recorded
      rather than the requirement skipped: the claim IS an isomorphism
      between two elliptic curves, so no non-curve object can reproduce its
      signature. The nearest-non-twist control discharges the same duty.
    - >-
      Whether the genericity gap fires at cryptographic scale cannot be
      tested by this design at any budget it could be given.
