experiment:
  id: EXP-ECDLP-6c9b23
  hypothesis_id: H-ECDLP-752c8c
  question_id: RQ-SBRG-f31cb2
  goal_id: null
  version: 1
  status: draft
  claim_tier: not_applicable
  title: >-
    Zero-compute feasibility table for the frozen Phase-A grid checked against
    the driver by exact integer equality, a streaming occupancy count reported
    against its own forced lower bound rather than against an absolute threshold
    that a cell's row count can make unreachable, and a memory contract stated as
    a formula rather than as two independent scalar guards

  objective: >-
    THIS IS A VERIFICATION PROTOCOL WITH ONE CHEAP MEASUREMENT ATTACHED. WHAT IS
    CHECKED: the Macaulay column count of every cell in the frozen Phase-A grid,
    and the memory model implied by the contract's two scalar resource guards.
    AGAINST WHAT REFERENCE: the closed-form binomial sum for the column count,
    and the driver's own reported column count for at least six cells spanning a
    hundredfold range. WHAT RESULT FAILS IT: any disagreement between the closed
    form and the driver, or any cell on the predicted blocked list that runs to
    completion, or any cell off the list that hits a guard. THE MEASUREMENT is
    the column occupancy, taken by streaming with no matrix allocated. NO
    MATHEMATICAL RESULT IS PRODUCED AND NO GRID CELL IS AUTHORISED TO RUN.

  independent_variables:
    - name: representation
      values: [chain_t3, direct_t3, chain_t4, balanced_t4]
    - name: "n"
      values: [8, 10, 12, 14, 16]
    - name: macaulay_degree
      values: [2, 3, 4, 5, 6, 7, 8, 9]

  inputs:
    variable_count_formula: >-
      v = t times b plus (t - 2) times n, with b = ceil(n/t) + 1; equivalently
      3b + n at arity 3 and 4b + 2n at arity 4, and 3b for the direct
      representation, which carries no auxiliary variables
    column_count_formula: >-
      the sum of the binomial coefficients C(v, i) for i from 0 to D
    guards_read_from_the_frozen_contract:
      max_columns: 200000
      max_rows: 200000
      budget_skip_is_evidence: false
    recomputed_column_counts_chain_t3_degree_5: [21700, 68406, 101584, 242825, 510416]
    recomputed_column_counts_chain_t3_degree_4: [6196, 15276, 20854, 41449, 74519]
    recomputed_column_counts_chain_t4_degree_5: [122438, 443704, 760099]
    recomputed_column_counts_chain_t4_degree_4: [24158, 66712, 102091, 213053, 294204]
    recomputed_column_counts_direct_t3_n16: {degree_7: 198440, degree_8: 401930, degree_9: 695860}
    guard_product_matrix_bytes: 5.0e9
    guard_product_carrier_bytes_upper: 5.0e9

  metrics:
    primary:
      - name: closed_form_column_count
        unit: columns (dimensionless non-negative integer)
        definition: >-
          The binomial sum evaluated per cell, emitted before any code runs.
      - name: driver_reported_column_count
        unit: columns (dimensionless non-negative integer)
        definition: >-
          The count the driver itself reports, compared to the closed form by
          exact integer equality with zero tolerance.
      - name: column_occupancy
        unit: dimensionless ratio (occupied columns divided by total columns,
          both counted as columns of the same layer)
        definition: >-
          Distinct columns touched by some row, divided by the closed-form
          column count, measured by streaming the generator and marking a bitmap
          with no matrix allocated. REPORTED ALONGSIDE ITS OWN FORCED LOWER
          BOUND, which is the row count divided by the column count.
      - name: predicted_versus_measured_peak_memory
        unit: bytes
        definition: >-
          The fitted formula's prediction against the measured peak resident
          size, per cell, with underprediction flagged separately.
    secondary:
      - name: per_row_support_histogram
        unit: nonzeros per row (dimensionless counts)
        definition: >-
          Mean, median, maximum and upper decile, with the maximum reported
          individually because peak memory is driven by the tail.
      - name: achievable_compression_factor
        unit: dimensionless ratio
        definition: >-
          Total columns divided by the row count, i.e. the reciprocal of the
          forced occupancy lower bound. This is the CEILING on what column
          compression can buy at that cell, and it is computed before the
          occupancy is measured.
      - name: blocked_cell_list
        unit: list of cells
        definition: Frozen before any run.
      - name: charge_ledger_constants
        unit: as declared per constant
        definition: Frozen before any cell runs and reported with every derived
          figure.

  controls:
    - name: C-CLOSED-FORM-REGRESSION
      kind: forced-value baseline, blocking
      blocking: true
      description: >-
        Driver-reported column counts must equal the closed-form binomial sum
        EXACTLY on at least six cells spanning a hundredfold range, with zero
        tolerance. A single mismatch voids the feasibility table and the correct
        variable count becomes the finding.
    - name: C-HAND-CHECKED-BOUNDARIES
      kind: forced-value baseline, blocking
      blocking: true
      description: >-
        Degree 0 gives exactly 1 column. The chained arity-3 cell at n = 8 and
        degree 2 has v = 20 and gives exactly 1 plus 20 plus 190, i.e. 211
        columns. Both are hand-checkable and both were recomputed by the
        coordinating session.
    - name: C-REPRESENTATION-ORDERING
      kind: nearby-object control
      blocking: true
      description: >-
        The direct representation, having no auxiliary variables, must reach
        strictly higher degrees within the same guard than the chained arity-3
        representation at the same n, namely 198440 columns at n = 16 and
        degree 7 against 510416 at n = 16 and degree 5. A table that does not
        reproduce that ordering has the variable count wrong.
    - name: C-FORCED-OCCUPANCY-LOWER-BOUND
      kind: computed replacement for a threshold that can be unreachable
      blocking: true
      description: >-
        THE SOURCE PROPOSAL'S BUILD BRANCH CAN BE ARITHMETICALLY UNREACHABLE AT A
        GIVEN CELL AND THE RULE IS THEREFORE RESTATED, NOT LOOSENED. Distinct
        generator-times-multiplier pairs have distinct leading monomials, so the
        occupied column count is AT LEAST the row count and the occupancy ratio
        is at least rows divided by columns. Wherever the row count exceeds a
        tenth of the column count, an absolute build threshold of 0.10 cannot be
        met however sparse the rows are, and a pre-registered branch that cannot
        be reached is not a discriminator. The replacement reports occupancy
        against its own forced lower bound and against the achievable
        compression factor, which is columns divided by rows and is computed per
        cell BEFORE the measurement; and the admission decision is taken on
        whether the fitted memory formula predicts under contract IN BYTES.
        The row count must therefore be emitted with the table, and it is the
        first number the protocol requires.
    - name: C-STREAMING-NO-ALLOCATION
      kind: instrument bound, blocking
      blocking: true
      description: >-
        The occupancy count allocates no matrix. Its only large allocation is a
        bitmap of the column count in bits, at most 64 kilobytes anywhere on this
        grid, plus one row at a time. If the count itself exhausts memory the
        generator is not streamable and that pipeline defect is the finding.
    - name: C-DENSE-NEARBY-OBJECT
      kind: known-false nearby object, blocking
      blocking: true
      description: >-
        A dense random Boolean system at matched variable count, degree,
        generator count and degree profile must show HIGHER occupancy and a
        WORSE compression outcome. If the compressed layout looks equally good
        there it is not exploiting structure and its numbers on the real system
        mean nothing.
    - name: C-ALLOCATION-BLOCK-DISJOINTNESS
      kind: memory-accounting gate, blocking
      blocking: true
      description: >-
        The fitted formula attributes memory only over allocation blocks proved
        disjoint, and must NEVER UNDERPREDICT a measured peak. A formula that
        underpredicts is not a contract.
    - name: C-MATCHED-BASELINE-ARM
      kind: forced-value baseline for the charge ledger
      blocking: true
      description: >-
        The matched baseline arm must reproduce its own predicted constant under
        the frozen operation convention, within the seed spread, before any
        charged figure is emitted. Both sides of every charged ratio are counted
        in the same declared operation unit.
    - name: C-DETERMINISM-NULL
      kind: reproducibility control
      blocking: true
      description: >-
        The column count, the occupancy and the blocked-cell list are seed-free
        and must be bit-identical across seeds. Only measured peaks and timings
        may vary.
    - name: C-SOURCE-READ
      kind: blocking source read
      blocking: true
      description: >-
        Open the driver and confirm the actual Boolean variable set, whether the
        layer is stored densely over the full monomial space or sparsely, and
        whether a persistent pivot carrier over the full column space exists.
        THE DRIVER WAS NOT OPENED BY THE COORDINATING SESSION, so every statement
        about how memory is allocated is an inference from the contract until
        this control passes. If the storage is sparse, the gigabyte arithmetic
        does not apply and the guards must be restated in nonzeros first.
    - name: C-SECOND-HAND-FIGURE-GATE
      kind: provenance gate
      blocking: true
      description: >-
        The resource-exhaustion figures cited as the shape to avoid are
        SECOND-HAND. Neither the sibling proposal's authoring session nor the
        coordinating session for this contract read them, and they are reported
        to live on a branch this worktree does not carry. Re-cite them by run
        identifier before quoting them anywhere. No arithmetic in this contract
        depends on them, so a discrepancy weakens only the rhetorical
        comparison, and the stop remains an infrastructure outcome under
        AGENTS.md rule 5 regardless.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The Macaulay column count of every Phase-A cell, and the resulting list of
      cells exceeding the declared column guard.
    formula: >-
      columns equals the sum of C(v, i) for i from 0 to D, with
      v = t b + (t - 2) n and b = ceil(n/t) + 1. Blocked cells predicted: the
      chained arity-3 representation at n equal to 14 and 16 with degree 5; the
      chained and balanced arity-4 representations at n equal to 10, 12, 14 and
      16 with degree 5 and at n equal to 14 and 16 with degree 4; and the direct
      arity-3 representation at n = 16 with degrees 8 and 9.
    source: >-
      The Macaulay layer is DEFINED in the frozen contract as the span of every
      squarefree multiplier of the appropriate degree times each generator,
      Boolean-reduced, and the ambient monomial space of degree at most D in v
      Boolean variables has exactly that many elements by definition of the
      Boolean ring. No modelling choice enters anywhere. Every listed integer was
      independently recomputed by the coordinating session and agrees with the
      source proposal.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE DECISION RULE WAS FIXED.
    (1) THE FEASIBILITY HALF IS AN IDENTITY AND ITS CHECK IS EXACT. Column counts
    are binomial sums with zero tolerance, so there is no band to loosen. All
    twenty-plus listed integers were recomputed independently by the coordinating
    session and agree, including the boundary cases 211 at n = 8 with degree 2
    and 695860 at n = 16 with degree 9 for the direct representation.
    (2) THE OCCUPANCY BUILD BRANCH CAN BE ARITHMETICALLY UNREACHABLE, AND THE
    RULE IS REPLACED RATHER THAN LOOSENED. Occupied columns are at least the row
    count, because distinct generator-multiplier pairs have distinct leading
    monomials, so occupancy is at least rows divided by columns. At any cell
    where the row count exceeds a tenth of the column count, an absolute build
    threshold of 0.10 is unreachable no matter how sparse the rows are, and the
    branch cannot fire. The row count depends on the descended generator degree
    profile, which the source proposal admits it did not measure, so this cannot
    be settled in advance for every cell; the protocol therefore REQUIRES the row
    count to be emitted first, reports occupancy against its own forced lower
    bound, and takes the admission decision on the memory formula in bytes
    against the contract, which is the quantity the choice actually turns on and
    which charges both sides in the same unit.
    (3) THE KILL BRANCH CAN FIRE AND IS RETAINED IN SUBSTANCE. If the measured
    occupancy is such that the fitted formula still predicts over contract at
    every currently blocked cell, the compression route is dead and the measured
    occupancy is filed as an obstruction with value, units, runs and scope.
    (4) THE MEMORY DIAGNOSIS ARITHMETIC WAS CHECKED. Two independent guards each
    at 200000 admit a dense binary matrix of 200000 times 200000 bits, which is
    4 times 10^10 bits or 5.0 gigabytes, plus a pivot carrier of rank times
    columns bits, up to a further 5.0 gigabytes. That is the shape of a known
    resource-exhaustion stop and it is why a product guard is proposed.
    (5) A CORRECTION TO THE SOURCE PROPOSAL'S TITLE, RECORDED RATHER THAN
    APPLIED SILENTLY. The title states the advance gate, which needs three
    increasing n at one degree, is reachable only at degree at most 4. The
    recomputed table shows the chained arity-3 representation has EXACTLY THREE
    admissible n at degree 5, namely 8, 10 and 12, so the gate IS reachable
    there, with no headroom. The proposal's own claim (B) says the same. The
    arity-4 representations have one admissible n at degree 5 and first reach
    three at degree 4.
    (6) NOTHING HERE IS UNDERPOWERED IN THE STATISTICAL SENSE, BECAUSE NOTHING
    HERE IS SAMPLED. The column counts and the blocked list are exact integers;
    the occupancy is an exhaustive count over all rows, not a sample. The only
    fitted quantities are the memory constants, whose adequacy is tested by a
    25 percent tolerance across a hundredfold range with underprediction treated
    as failure at any magnitude.

  scale_relevance:
    tier: null
    justification: >-
      Not a scaled mathematical measurement. The column counts are exact
      combinatorial identities and transfer exactly; the occupancy is measured
      per cell and NO cell's value is extrapolated to another; the memory
      constants are properties of one implementation on one host and are
      re-fitted after any change to either.
    correspondence: null

  tail_checks:
    - >-
      The MAXIMUM per-row support, not the mean, is checked against the memory
      formula, since peak memory is driven by the tail, and the histogram's
      upper decile is reported separately because a heavy tail defeats a
      mean-based contract.
    - >-
      The largest admitted cell and the cell with the highest rank-to-rows ratio
      are reported individually, since those are where the two leading memory
      terms exchange dominance and where a single-term fit would look adequate
      and be wrong.

  replication:
    seeds: [20260824, 20260825, 20260826]
    independent_instances: 6

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 12
    maximum_workers: 1

  stopping_rules:
    - >-
      STAGE 0 is pencil and paper: emit the closed-form column count for every
      cell, the derived variable count per representation, the ROW count per
      cell, the achievable compression factor, and the blocked-cell list. Check
      the two boundary slices by hand. If either fails, stop.
    - >-
      STAGE 0b is the blocking source read. If the layer is stored sparsely or
      the carrier is absent, stop and restate the guards in nonzeros before
      anything else.
    - >-
      STAGE 1 is the streaming occupancy count on admitted cells only. If the
      fitted memory formula still predicts over contract at every blocked cell,
      STOP: the deliverable is the measured occupancy filed as an obstruction
      with value, units, run identifier and scope.
    - >-
      STAGE 2 instruments admitted cells and fits the memory formula, then
      FREEZES it and records the upper-rung predictions before either upper cell
      is attempted.
    - >-
      STAGE 3 writes and freezes the charge ledger. Nothing in it is fitted
      after a measurement.
    - >-
      NO STAGE OF THIS CONTRACT RUNS A PHASE-A GRID CELL FOR ITS SCIENTIFIC
      CONTENT. That requires the question's own Coordinator approval, which this
      contract neither has nor requests.

  invalidation_rules:
    - Any occupancy reported without the row count and the forced lower bound
      alongside it.
    - Any bare peak-memory number reported without rows, rank and occupied
      columns beside it.
    - Any memory formula that underpredicts a measured peak anywhere.
    - Any upper-rung prediction made after the formula was refitted.
    - Any charged figure emitted before the matched baseline arm reproduces its
      predicted constant.
    - Any quotation of the second-hand resource-exhaustion figures as checked.
    - Any extrapolation of one cell's occupancy to another.

  success_criterion: >-
    The closed-form column counts match the driver exactly on at least six cells
    across a hundredfold range; the hand-checked boundaries return 1 and 211; the
    representation-ordering control reproduces the expected ordering; the source
    read confirms the storage model; the occupancy is reported per cell against
    its forced lower bound and its achievable compression factor; the memory
    formula fits within 25 percent across a hundredfold range without
    underpredicting; and the charge ledger's constants are frozen and published
    with every derived figure.

  falsification_criterion: >-
    The feasibility table is falsified if any driver-reported column count
    differs from the closed form, or if any cell on the blocked list runs to
    completion within the guards, or if any cell off the list hits them.
    HEUR-001 is falsified if a measured per-row support exceeds the generator
    term count, or if a measured occupied column count falls below the row
    count, which is arithmetically impossible and indicates a broken counter.
    HEUR-002 is falsified if the fitted formula misses by more than 25 percent
    anywhere or underpredicts anywhere at all. The COMPRESSION ROUTE is retired,
    without falsifying anything else, if the fitted formula still predicts over
    contract at every currently blocked cell.

  required_artifacts:
    - the derived variable count and closed-form column count per Phase-A cell
    - the row count and achievable compression factor per cell, emitted first
    - the driver-reported column count per calibration cell and the exact delta
    - the blocked-cell list, frozen before any run
    - column occupancy per cell, with its forced lower bound alongside
    - the per-row support histogram with mean, median, maximum and upper decile
    - peak resident memory of the streaming occupancy count itself
    - rows, occupied columns and rank reported alongside every peak-memory figure
    - peak resident size, peak virtual size and temporary disk per cell
    - the fitted memory constants with residuals across the calibration range
    - the recorded upper-rung peak predictions, timestamped before any attempt
    - the frozen charge-ledger constant table
    - the matched baseline operation count under the frozen convention
    - the source-read findings on the variable set and the storage model
    - the re-cited second-hand figures, by run identifier, or an explicit record
      that they remain unverified
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      TOOLING AND BOOKKEEPING ONLY. No mathematical result, no evidence about
      reusable dependencies, no evidence about solving degree, and no discrete
      logarithm claim. COLUMN COUNTS AND OCCUPANCY ARE CURVE-FREE BY
      CONSTRUCTION, being pure combinatorics of a Boolean monomial space, so the
      curve-free-null requirement is discharged as a proof rather than as an arm.
    - >-
      IT AUTHORISES NOTHING. Running any Phase-A cell requires that question's
      own Coordinator approval.
    - >-
      THE DRIVER WAS NOT READ BY THE COORDINATING SESSION. Every statement about
      memory allocation is an inference from the frozen contract until the
      blocking source read passes, and a session that skipped it would be
      building on a second-hand reading.
    - >-
      THE ANCHORING RESOURCE-EXHAUSTION FIGURES ARE SECOND-HAND AND UNVERIFIED
      BY THIS PROGRAM. They are cited only as a shape to avoid, no arithmetic
      depends on them, and their absence from this worktree is a
      branch-visibility fact rather than a claim that the run record does not
      exist.
    - >-
      THE COLUMN COUNTS ASSUME THE VARIABLE SET THE CONTRACT IMPLIES. If the
      driver differs they are LOWER bounds, which strengthens the blocking
      conclusions and weakens none, but the exact table would still have to be
      rebuilt, and any cell blocked ONLY by the inferred count is re-examined the
      moment the real count is established.
    - >-
      THE ROW COUNTS DEPEND ON THE DESCENDED GENERATOR DEGREE PROFILE, which no
      agent in this program has measured and which could not be derived without
      opening external literature that was not opened. The COLUMN counts, which
      are the guard-binding quantity, are independent of it, which is why the
      blocking conclusions are stated on columns and every row-dependent
      statement, including the forced occupancy lower bound, is conditional on
      the measured row count.
    - >-
      UNTESTABLE HERE, STATED PLAINLY. Whether any Phase-A cell contains the
      structure the question is about is not testable by this contract, which
      runs no cell for its scientific content. The deliverable is a schedule, a
      memory contract, one measured structural number and a conversion.
    - >-
      Occupancy is cell-dependent and no cell's value is extrapolated to another;
      the memory constants belong to one implementation on one host.

  assigned_to: executor
  approved_by: null
