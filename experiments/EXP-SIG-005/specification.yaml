experiment:
  id: EXP-SIG-005
  hypothesis_id: H-SIG-001
  version: 1
  title: >-
    Cascade-law falsifiable checks: (P1) the D4 residual 2n/3+1 law at n=24
    (predicted residual_canonical == 17, D4 deficit == 8n/3 == 64, D3
    non-Koszul count == 1) and (P2) the first residual_D birth-law point at
    D=6, n=12 (the D6-born non-rewritable component residual_6 after removing
    the multiplication closure of all lower-degree non-model syzygies,
    analogous to EXP-SIG-003's residual_5 at D5; birth law predicts
    residual_6 > 0).
  status: approved
  objective: >-
    DEC-20260718-020 (next_actions) queued two cheap falsifiable checks of
    the supported cascade laws. P1 extends the canonical D4 residual series
    9/11/13/15 (n=12/15/18/21, increments exactly +2; residual == 2n/3+1 ==
    deficit_4/4+1 on the measured range) to n=24, where the law predicts
    residual_canonical == 17. The same cell records the D4 deficit (law:
    8n/3 = 64) and the D3 non-Koszul count (law: 1). >= 3 standard seeds,
    input-side degenerate filter per EXP-SIG-002, canonical-reduction
    instrument per EXP-SIG-004 (pinned reduction also computed for
    continuity). P2 measures the first residual_D birth-law point: at D=6,
    n=12, compute residual_6 = extra_6 - A5 where A5 is the rank mod K6 of
    the multiplication closure of ALL lower-degree non-model syzygies (D3
    syzygy x mults deg <= 3, D4 extras x mults deg <= 2, D5 extras x mults
    deg <= 1), the exact analog of EXP-SIG-003's residual_5 = extra_5 - A4
    at D5 (878 at n=12 seed 2). The birth law (a D6-born non-rewritable
    component exists at every degree) predicts residual_6 > 0; residual_6
    == 0 would falsify the birth law at this cell. n=15 at D6 is attempted
    only if cheap (size estimate says it is not: ~547k rows x ~768k cols).
  inputs:
    systems: >-
      boolean chained Semaev m = t = 3 systems (semaev_tree builder).
      P1: n = 24, seeds {1,2,3} (input-side filter applied; if any seed is
      non-standard it is recorded and replaced by seeds 4,5,... until 3
      standard sem cells + 3 matched null cells are measured). P2: n = 12,
      seed 2 (the EXP-SIG-002/003 anchor instance, standard) sem + matched
      null; n = 12 seed 2026 sem only if budget remains.
    reference: T11-certified support-matched semi-regular null (boolean_null),
      measured on every P1 cell (D3/D4) and on the P2 cell (D3..D6
      count-only).
    instrument: >-
      bit-identical copy of the EXP-SIG-001/002/003/004 instrument
      (src/h013_f5_signatures.sage sha256
      1ba96fe477c9dc2e7c551c96353c8361d21e40134551342636b2f13015c09087 +
      semaev_tree.py / ic_first_fall_fast.py / macaulay_export.py, hashes
      verified against the pinned set); new driver SIG5_run.sage.
      full_reduce copied verbatim from EXP-SIG-003/SIG4_run.sage (canonical,
      rank-exact).
    anchors: >-
      P2 continuity anchors from EXP-SIG-003 (n=12 seed 2 sem): D3 def 1 /
      extra 1; D4 def 32 / extra 32; residual_4 canonical 9; D5 rank 28097,
      deficit 1321, extra 1322; A3=242, A4=444, residual_5=878. P1
      prediction: residual_canonical(24) == 17, deficit_4 == 64, D3 extra
      == 1.
  controls:
    - C1 gate V1 — support-matched null at n = 9, 12 (D = 3, 4): extra = 0,
      rank == sr_pred, explicitly computed null residual (both reductions)
      = 0. Runs before any measurement cell.
    - C2 gate V2 — injected known 3-generator constant-multiplier syzygy at
      n = 9 must be detected (verbatim EXP-SIG-002/004 gate semantics).
    - C3 gate V3 — T2 anchor continuity at n = 15 seed 1: D3 deficit/extra
      1, D4 deficit/extra 40, pinned residual 10, canonical residual 11
      (EXP-SIG-004 corrected anchor).
    - C4 determinism — (a) in-run: n = 15 seed 3 sem computed twice in the
      gate run, identical modulo timing; (b) cross-invocation: one P1 n=24
      sem cell repeated as a separate sage invocation, deep-compared modulo
      timing (receipt via compare_determinism.py); (c) if the P2 D6 sem
      cell completes, it is repeated as a separate invocation and compared
      the same way.
    - C5 null arm on EVERY P1 measurement cell — extra = 0 and rank ==
      sr_pred at D = 3, 4 and null residual = 0 under BOTH reductions. On
      the P2 cell — null extras = 0 and rank == sr_pred at D = 3, 4, 5, 6
      and (trivially, closure empty) residual_6 = 0.
    - C6 canonical-exactness cross-check — on every P1 cell, the canonical
      rank mod K4 must equal rank(v3_mults u K4) - rank(K4) (union echelon,
      reduction-free). On the P2 cell, the incremental-merged closure rank
      must equal the independent full_reduce-mod-K6 + echelon family ranks
      AND rank(images u K6) - rank(K6). Any mismatch = driver bug; cell
      invalid, run halted and reported.
    - C7 P2 cascade sanity — A3_6 <= A4_6 <= A5 <= extra_6; residual_6 >=
      0; no_missing_rows (every closure image tag exists at D6); identity
      deficit_6 = extra_6 + rankK6_sem - rankK6_null recorded when both
      arms complete.
    - C8 instance filter — input-side, from recorded R_x and eq_degs_hist
      only: standard := (R_x != 0) AND (no degree-1 equation). Filtered
      instances measured, recorded, excluded (verbatim EXP-SIG-002
      semantics).
    - C9 P2 continuity — the P2 sem cell must reproduce the EXP-SIG-003
      anchors (D3/D4/D5 counts, residual_4 canonical, A3/A4/residual_5)
      before the D6 stage; a mismatch halts the run before the expensive
      stage (instrument drift, not evidence).
  independent_variables:
    - n in {24 (P1), 12 (P2)}
    - seed in {1,2,3 (+replacements) (P1); 2 (P2)}
    - arm in {sem, null}
    - reduction semantics in {pinned early-break (continuity), canonical
      full_reduce (primary)}
  metrics:
    primary:
      - P1: residual_canonical_at_D4 per (seed, arm) at n=24 — prediction
        17 on every standard sem cell; D4 deficit — prediction 64; D3
        non-Koszul count (extra) — prediction 1
      - P2: residual_6 = extra_6 - A5 at n=12 seed 2 sem — birth prediction
        residual_6 > 0; components A3_6 / A4_6 / A5 (closure ranks of the
        D3 / D3+D4 / D3+D4+D5 non-model syzygies at D6)
    secondary:
      - pinned residual at D4 (continuity), rank_v3mod, n_v3_images,
        extra_4, rankK4 per cell
      - P2: extra_6, deficit_6, rankK6, nrows/ncols/rank/sr_pred at D6;
        per-family image counts and miss counts; stage wall times; per-run
        peak RSS and CPU seconds
  replication:
    seeds: "P1: 3 standard seeds at n=24; P2: 1 anchor seed (2), + seed
      2026 only if budget remains"
    independent_instances: "P1: >= 3 standard sem cells + 3 matched null
      cells; P2: 1 sem cell + 1 matched null cell (+ determinism repeat)"
  budget:
    wall_clock_seconds_per_run: 600
    total_wall_clock_seconds: 3300
    maximum_memory_gb: 24
    maximum_runs: 10
  stopping_rules:
    - The C1/C2/C3/C4(a) gate runs first (RUN-a); no measurement run is
      launched unless the gate passes.
    - C6/C7 cross-check mismatch or C9 continuity-anchor mismatch stops the
      driver at the next checkpoint (driver bug / instrument drift, not
      evidence); already-flushed cells remain valid.
    - Any single sage invocation > 600 s is killed at a checkpoint boundary:
      the driver checks a soft cap (default 520 s) before every stage/cell
      and wraps the D6-classification and closure-rank stages in a
      driver-level SIGALRM timer (520 s); a firing timer records the stage
      as censored_timeout (infrastructure censoring, AGENTS rule 5 — NOT
      evidence) and the run ends cleanly with all completed stages flushed.
    - Scope-reduction order if caps engage: drop the P2 null D6 arm first,
      then the P2 determinism repeat, then P2 entirely (deliver P1 only);
      P1 seeds may be censored down to the 3-seed minimum (never below).
      n=15 at D6 is not attempted (pre-measured size ~547k x ~768k cells
      the 600 s cap by an order of magnitude).
  invalidation_rules:
    - Timeout/OOM/kill = failed_infrastructure (AGENTS rule 5), never
      evidence.
    - A determinism mismatch invalidates the affected cell.
    - A null cell with extra != 0, rank != sr_pred, or residual != 0
      invalidates the run's instrument state (gate semantics).
    - A C6/C7 cross-check mismatch invalidates the affected cell (driver
      bug).
    - Filtered (non-standard) instances describe only themselves; they are
      excluded from the series but retained as records.
  success_criterion: >-
    Measurement completed (numbers only; the verdict belongs to the
    Coordinator): P1 — the n=24 D4 residual_canonical / deficit / D3
    non-Koszul count on >= 3 standard seeds with matched nulls, compared to
    the predictions 17 / 64 / 1; P2 — extra_6, A3_6, A4_6, A5 and
    residual_6 at n=12 seed 2 sem with the matched-null control, compared
    to the birth prediction residual_6 > 0. A clean infrastructure censor
    of P2 with P1 delivered is a partial success.
  falsification_criterion: >-
    P1: residual_canonical(24) != 17 on any standard seed, or within-size
    seed variance, numerically falsifies the 2n/3+1 law at n=24 (scoped;
    Coordinator decides); deficit != 64 or D3 count != 1 likewise tests the
    8n/3 and count-1 laws. P2: residual_6 == 0 falsifies the residual_D
    birth law at D=6, n=12 (the whole D6 extra component then comes from
    lower-degree closure); residual_6 > 0 supports it (one point, no
    magnitude law).
  required_artifacts:
    - specification.yaml (this file)
    - implementation.md
    - SIG5_run.sage (driver)
    - src/ instrument copies (sha256-recorded)
    - runs/RUN-EXP-SIG-005-*/manifest.yaml (command, commit, dirty-tree,
      env, seeds, params, resources, validity_status)
    - runs/RUN-EXP-SIG-005-*/raw.json, stdout.txt, stderr.txt, command.txt,
      environment.json
    - summary.json (machine-readable prediction-vs-measurement table)
    - analysis.md (numbers vs predictions, control outcomes, deviations,
      unexpected observations)
    - ledger/EV-SIG-005.yaml
  assigned_to: executor
  approved_by: coordinator   # DEC-20260718-020 next_actions; handoff TASK-20260718-SIGCHK

handoff:
  id: TASK-20260718-SIGCHK
  from: coordinator
  to: executor
  objective: >-
    Two falsifiable checks of the supported cascade laws: (1) n=24 D4
    residual == 17 (2n/3+1 law) with the D4 deficit (8n/3=64) and D3
    non-Koszul count (1) recorded; (2) first residual_D birth-law point:
    D=6 residual birth at n=12 (residual_6 = extra_6 - closure rank of all
    lower-degree non-model extras, analogous to EXP-SIG-003's residual_5).
  uncertainty_reduced: >-
    Whether the linear D4-residual law survives one size beyond its
    4-point fit range, and whether the degree-born cascade births a new
    non-rewritable component at D=6.
  inputs:
    - experiments/EXP-SIG-004/src/ + SIG4_run.sage (read-only originals)
    - experiments/EXP-SIG-003/SIG3_run.sage (closure construction, read-only)
    - ledger/EV-SIG-002.yaml, EV-SIG-003.yaml, EV-SIG-004.yaml,
      DEC-20260718-020.yaml
  constraints:
    - Write ONLY inside experiments/EXP-SIG-005/ and ledger/EV-SIG-005.yaml;
      no git commits; do not touch the concurrent session's files.
    - 600 s per-invocation kill rule at checkpoint boundaries (driver soft
      cap 520 s + SIGALRM stage timers).
    - Reuse instruments only by copying from experiments/EXP-SIG-004/src/
      (read-only originals).
    - A partial result with honest validity_status is a success;
      fabrication is the only failure.
  deliverables:
    - experiments/EXP-SIG-005/ complete artifact tree
    - ledger/EV-SIG-005.yaml
    - final report to the Coordinator (numbers only, no verdict)
  budget:
    wall_clock_seconds: 3300
    memory_gb: 24
    maximum_runs: 10
  completion_gate:
    - all artifacts written
    - controls pass or deviation recorded
    - validity_status set honestly
  return_format: execution_report
