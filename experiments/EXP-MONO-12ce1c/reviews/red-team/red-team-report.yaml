  proof_architecture_challenges:
    observation_fiber_attack: >-
      The record declares its own massive observation collision and calls it the point
      rather than a defect, which is defensible for Part A. But the declaration is
      incomplete in one direction that matters: it says the cycle type "is a function of
      the square-class vector alone", and does not say that the MEASURED cycle type, as
      Path 1 computes it, is a function of the square-class vector alone BY CONSTRUCTION.
      That is the difference between a predicted collision and an instrument that can
      only report one value per fibre. OBJ-1 is the observation-fiber attack succeeding:
      I placed a preimage on the other side of the conclusion (a 2+1+1 root set) and the
      classifier reported it correctly, proving the separator exists in the CODE and is
      unreachable from the INPUT.
    quantifier_order_attack: >-
      The declared order (for all k, for all E, for all m, there exists an injection into
      (Z/2)^{m-2}) survives, and the witness really is uniform -- it is written from f and
      the x_i with no dependence on curve, field or seed. I found it to be MORE uniform
      than claimed (OBJ-2: it does not depend on f being a curve equation at all). No
      witness is chosen after seeing an instance. PASS.
    method_ceiling_attack: >-
      The record's stated ceiling is honest and my results do not reach past it. I would
      tighten one clause: the ceiling says the empirical consequences are "verified at
      m in {3,4,5} on toy primes". After OBJ-1 that should read "verified at m in {4,5}
      by 64,000 dual-path comparisons on toy primes", because the 960,000 figure is not a
      verification.
    nearby_object_attack: >-
      FAILED AS DESIGNED AND I DIAGNOSED WHY (OBJ-2). The second declared nearby object
      is not a nearby object -- it is the same theorem in a costume. The FIRST declared
      nearby object (random quartics) is the correct one and passes.
    compositional_invariant_attack: >-
      The proposed stronger invariant (track the full square-class vector, not the cycle
      type) is genuinely stronger and is what makes the induction on m work. I confirm the
      recursion behaves: the m = 5 fibre is the m = 4 fibre composed with one more sign
      generator, and my independent S_5 = Res_X(S_4, S_3) instances all had degree exactly
      8 with no drop. No component deletion produced a first-failing step I could exhibit.
    boundary_and_strictness_attack: >-
      The m = 3 baseline embedding is an exact algebraic identity, re-verified at Stage 0
      symbolically and on 105 committed curves with exact Fraction arithmetic and zero
      difference. That is the strongest form available and I have no objection to it. It
      is also the only part of this record whose evidence is stronger than its claim.

  what_the_reported_quantity_should_have_done:
    parameter_that_should_destroy_the_signal: N (the curve order), and separately tau
    expected_behaviour: >-
      Part B's coincidence rate must fall like 1/N as N grows at fixed tau, and must
      grow linearly in (tau-1)/N at fixed m. A rate that stayed flat as N grew would be
      the canonical artifact tell.
    measured: >-
      It decays correctly. Reconstructing the omitted graded_control_3 from the committed
      record: across five non-vacuous cells with N ratios of 3.65x to 4.62x, the observed
      rate ratios are 0.203, 0.266, 0.278, 0.212, 0.223 against 1/N predictions of 0.217,
      0.274, 0.274, 0.219, 0.219. And the omitted graded_control_2 fits a slope of 6.2323
      against the forced 6. THE SIGNAL BEHAVES LIKE A SIGNAL.
    null_object_control: >-
      Present and passing for the factoring classifier (random quartics reproduce S_4
      Chebotarev at three primes, including the two treatment primes I added). ABSENT for
      the conjugation classifier, and provably unconstructible for it (OBJ-2). That
      asymmetry is the finding of this review.

  narrowest_supported_statement: >-
    For the eight toy curves of this panel (prime fields, p in {103, 191, 421, 569},
    char > 3, non-singular short Weierstrass, tau in {1,2,4}) and m in {4,5}, the
    Frobenius cycle type of the m-th Semaev summation cover's fibre is always
    1^{2^{m-2}} or 2^{2^{m-3}}, and always equals the type forced by that
    specialization's quadratic-character vector. This is supported by 64,000
    Path-1-versus-Path-2 comparisons (32,000 per run, zero disagreements), independently
    replicated by a third path sharing no code (3,200 comparisons, zero disagreements),
    and confirmed exhaustively at p = 103 over all 2,915,514 admissible ordered triples
    at m = 4; the comparison is shown by a mutation control to detect a corrupted S_4 at
    about 89% per specialization. Consistent with, and the natural evidence for,
    geometric and arithmetic monodromy contained in (Z/2)^{m-2}; the realized-permutation
    count reaches 2^{m-2}, so HEUR-KUM-2 is corroborated at these m rather than assumed.
    Part B's forced collision rates 6(tau-1)/N and 16tau/N + 24(tau-1)/N are matched
    (fitted tau-slope 6.23 against 6; 1/N decay confirmed across N ratios up to 4.6x)
    FOR THE TRANSVERSAL FACTOR-BASE SAMPLING CONVENTION ONLY -- under group-uniform
    sampling the m = 4 rate is about twice as large. M1 = 0 and M2 = 1.000 over 960,000
    specializations are identities of the Path-1 construction and support nothing beyond
    the correctness of the F_{p^2} arithmetic. NOTHING here concerns F_{q^n},
    characteristic 2 or 3, singular curves, genus > 1, cryptographic scale, any cost,
    memory or exponent, or KN-OPEN-009's relation-rate half; KN-OPEN-009 is not closed
    and the wreath half of its premise is untouched.

