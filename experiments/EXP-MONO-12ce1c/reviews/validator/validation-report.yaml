  control_checks:
    - control: measured_null_1 (cross-curve null) -- Finding 1, the load-bearing joint of this review
      contract_text: >-
        "The sign-torsor argument does not apply across two curves, so the
        FORCED VALUE IS THAT 4-cycles and 3+1 types appear at nonzero rate.
        If they do not, the classifier is reporting an artifact of the
        construction... and Stage 2 is void."
      observed: >-
        ZERO 4-cycles/3+1 splits in both runs (4986 and 4762 valid trials).
        Per the contract's own literal text this triggers the void
        disposition, and the Executor applied it literally and disclosed it
        prominently (execution_report.yaml stage2_generic_fibre_census.
        void_disposition; both run manifests' status_note).
      independent_rederivation: >-
        BLIND-STYLE FIRST PASS: worked out from the statement of the
        construction (P1,P2 on E=RO3, P3' on a same-order companion E',
        combined via the chord-tangent addition formula with generic
        distinct x-coordinates, per controls.py measured_null_1_cross_curve
        and specification.yaml arms_and_controls.measured_null_1), BEFORE
        re-reading implementation.md's own prose, whether the finding's
        claim is correct.

        STEP 1 (confirms the Executor's own stated argument). ec_add_fp2's
        chord branch (X1 != X2) is A,B-independent (Vieta on a curve with no
        x^2 term: x3 = lambda^2 - x1 - x2 depends only on the two input
        points, not on which cubic either point nominally satisfies); the
        doubling branch is A-dependent but is essentially never invoked
        because the code enforces x1,x2,x3 pairwise distinct
        (`if len({x1,x2,x3})<3: continue`). Frobenius (conjugation on
        F_{p^2}/F_p) is a ring automorphism fixing F_p, hence commutes with
        every field operation (+,-,*,/) used in ec_add_fp2 and with the
        F_p-rational A_fp2 constant, so it commutes with the whole
        chord-chained computation REGARDLESS of which cubic(s) the
        constituent points' y-coordinates were square roots of. Confirmed
        BY READING THE ACTUAL CODE (controls.py lines 174-244), not assumed.
        The Executor's Finding 1 argument is algebraically CORRECT.

        STEP 2 (an independent, more general derivation, not stated in
        implementation.md, that subsumes and strengthens Finding 1). F_p has
        a UNIQUE quadratic extension F_{p^2}: EVERY square root of an F_p
        element lies in F_p or in that one F_{p^2}, with no dependence on
        which polynomial's value is being rooted. Every root
        x(eps.P1+eps.P2+eps.P3') is a rational-function (chord-formula)
        evaluation of x-coordinates in F_p and y-coordinates in F_{p^2},
        hence is ITSELF necessarily an F_{p^2} element -- this holds for
        BOTH the treatment (same-curve) and the null (cross-curve)
        construction, and requires no argument about curves at all, only
        "each y_i is a single square root of an F_p element." An element of
        F_{p^2} has minimal polynomial over F_p of degree exactly 1 (if in
        F_p) or exactly 2 (if not) -- degree 3 or 4 is IMPOSSIBLE. So a
        degree-4 polynomial all four of whose roots are (by this
        construction) necessarily F_{p^2} elements CANNOT factor with a
        degree-3 or degree-4 irreducible factor: 4-cycles and 3+1 splits are
        not merely improbable here, they are MATHEMATICALLY IMPOSSIBLE for
        ANY construction of this shape (same-curve or cross-curve, real
        elliptic curve or not) -- confirmed independently by hand and
        checked computationally on a GENERALIZATION the Executor did not run
        (see companion runtime-session-receipt.json
        item1_field_argument_check.py: 20 freshly-drawn RANDOM (E,E') curve
        pairs across 5 different primes, own seed 20260830, not just the
        Executor's single RO3-plus-companion pair -- 479 valid trials, 0
        violations, only {identity, pure-2} cycle types observed across
        every pair).

        CONCLUSION ON THE JOINT: Finding 1's stated algebraic argument is
        CORRECT, and a strictly more general field-theoretic reason (unique
        quadratic extension of F_p) independently forces the same
        conclusion. measured_null_1, as specified in the frozen contract, was
        UNSATISFIABLE BY CONSTRUCTION: no implementation of "combine
        square-root-defined points via the chord-tangent rational function,
        with generic distinct x-coordinates" can EVER emit a 4-cycle or 3+1
        split, independent of whether the points share a curve. This is a
        genuine flaw in the CONTROL's pre-registered design (the
        `nearby_object_control` text in H-MONO-45183a's own proof_search_map
        and this contract's arms_and_controls.measured_null_1), not a
        classifier defect and not evidence of an unexplained anomaly in the
        treatment arm.
      additional_finding_beyond_the_executors_own_report: >-
        The SAME field-degree argument applies, unconditionally, to the
        Stage-2 TREATMENT arm's M1 metric as well, GIVEN the well-established
        "root description" (S_m's roots are exactly the signed x-sums --
        independently verified by exhaustive brute force at m=3,4 in
        EV-MONO-a0a89c OBS-1/4/5, and re-confirmed inside THIS experiment by
        the dual-path cross-check's own zero disagreements over 32,000
        specializations against an UNCONSTRAINED explicit
        resultant+factorization computation that could in principle have
        reported a degree-3 or degree-4 factor). This means M1's flawless
        confirmation (0 violations, 480,000 specializations per run) is
        substantially LESS DISCRIMINATING against the "full symmetric
        monodromy" alternative KN-OPEN-009 poses than its sample size
        suggests: it is close to a NECESSARY CONSEQUENCE of "F_p has one
        quadratic extension" once the root description holds, true for ANY
        correct implementation of that recipe regardless of the specific
        sign-torsor mechanism's truth. It remains a genuine, non-tautological
        and now doubly-confirmed (dual-path plus this review's independent
        from-scratch reimplementation) check that the EXECUTOR correctly
        implemented that recipe. The metric doing the real discriminating
        work for the SPECIFIC A-3 mechanism (which of the <=2 possible
        outcomes occurs, not merely that there are <=2) is M2, which is a
        genuine per-instance test that COULD have disagreed with the
        chi-vector prediction even given the F_{p^2}-boundedness, and did
        not, on 480,000 specializations per run plus this review's
        independent 8,172-specialization reproduction. This point is not
        made in implementation.md and is this review's own addition; it
        does not contradict Finding 1, it explains why Finding 1 is even
        more strongly forced than stated.
      verdict: >-
        holds_with_finding -- Finding 1's algebraic claim independently
        CONFIRMED and strengthened. The contract's own pre-registered void
        trigger for Stage 2 is literally satisfied and was applied correctly
        and disclosed prominently by the Executor; per this independent
        re-derivation, the trigger's cause is a flaw in the null's own
        design (unsatisfiable by construction) rather than a defect in the
        treatment classifier or an unresolved anomaly. See
        heuristic_validation_checks below for how this bears on the
        docs/inventor-protocol.md section 3 null-object requirement.

    - control: "(J1 item 4) Finding 2 -- M3 large-sigma deviations, birthday/2-torsion selection-bias mechanism"
      requested_check: >-
        Naive birthday-paradox estimate for >=1 coincidence among 2^{m-2}=8
        draws from a group of order N=100 (CM2), and whether it "roughly
        matches" the reported nondistinct_roots_frac=0.242; then whether
        excluding these cases biases M3 downward; then whether M1/M2 use a
        genuinely separate accounting.
      result: >-
        Naive birthday estimate 1-exp(-C(8,2)/100) = 1-exp(-0.28) = 0.2442,
        close to the reported OVERALL nondistinct_roots_frac 0.242
        (=4849/20000) -- confirms the order-of-magnitude match the task
        asked about. INDEPENDENT DEEPER CHECK (own from-scratch stratified
        simulation, 20000 fresh trials, own seed 987654321, CM2 m=5): the
        naive uniform-birthday model is NOT actually the right stratum-level
        mechanism. Split-complete-candidate draws (all m-1=4 characters
        agree, so all points are F_p-rational and every signed sum lands in
        the SMALL group E(F_p), order N=100) showed an empirical
        nondistinct-exclusion rate of 76.2% (492/2066 survived), while
        MIXED-character draws showed 24.0% (11186/14726 survived) -- an
        order-of-magnitude differential, confirming Finding 2's directional
        claim quantitatively, not just qualitatively. The 76.2% split-complete
        rate is matched almost exactly by re-purposing H-MONO-45183a's OWN
        step-B-2 formula (not a naive birthday count): expected colliding
        pairs = 16*tau/N + 24*(tau-1)/N = 16*4/100+24*3/100 = 1.36 (the
        IDENTICAL number this review independently confirmed as CM2's Stage-3
        m=5 forced value in metric_recomputations above), giving
        P(>=1 collision) = 1-exp(-1.36) = 74.3%, within 2 points of the
        measured 76.2%. This is a stronger, quantitative, independent
        confirmation than the report's own qualitative "birthday paradox"
        framing: the SAME 2-torsion-driven collision mechanism Part B
        derives for the factor-base sublocus is the exact and correctly
        quantifiable cause of Stage 2's nondistinct-roots anomaly on the
        split-complete substratum. The naive uniform-N birthday number
        (0.244) being close to the reported OVERALL rate (0.242) is a
        coincidence of this specific curve's parameters (mixed draws
        dominate the trial count at ~88% and have their own non-negligible
        24.0% rate, not the ~0% this review initially assumed); it is not
        itself the mechanism, and a future report should use the B-2-style
        formula rather than a naive birthday estimate when this is revisited.
      accounting_separation_check: >-
        Read path1.py's observed_permutation and run_experiment.py's
        aggregation (structure inferred from raw-result.json's per-cell
        fields): M1 and M2 are computed only over n_admissible (draws that
        survive ALL three exclusion strata -- ramified, diagonal,
        nondistinct/infinity/no-frobenius-match), and their truth values
        (categorical-violation count; per-instance chi-vector match) do not
        depend on whether a given admissible draw was split-complete or
        mixed-type -- the nondistinct-roots exclusion removes cases where no
        permutation can be read off at all (a genuine precondition for M1/M2
        to be well-posed), which is a different phenomenon from "which cycle
        type occurred" among the WELL-DEFINED permutations that do survive.
        M3 is a ratio (n_split_complete/n_admissible) that IS sensitive to
        the differential exclusion rate between strata; M1/M2 are not.
        Confirmed by direct inspection of the per-cell raw-result.json
        fields (M1_violations, M2_matches computed against n_admissible;
        M3_measured computed as n_split_complete/n_admissible) rather than
        assumed from the report's prose.
      verdict: CONFIRMED (mechanism directionally and quantitatively real,
        toy-scale instrument limitation, M1/M2 unaffected)

    - control: "(J1 item 5) Finding 3 -- fixed-sign vs random-sign forced invariance"
      independent_rederivation: >-
        Own algebraic argument (not read from implementation.md before
        deriving): the classifier enumerates ALL 2^{m-2} representative sign
        combinations (eps_1 fixed +1 as the quotient by the global sign
        flip, eps_2..eps_{m-1} free) for a GIVEN stored base point per index.
        For any index i, replacing the stored point P_i by -P_i and
        simultaneously replacing every occurrence of eps_i by -eps_i in the
        enumeration leaves the computed sum (eps_i)(P_i) = (-eps_i)(-P_i)
        identical term-by-term; since the enumeration already ranges over
        BOTH signs of eps_i exhaustively, swapping which physical point
        (P_i vs -P_i) is labelled "the +1 case" is exactly a relabelling
        (a bijection) of the sign-vector index set, producing the identical
        MULTISET of resulting sums and hence an identical collision count D.
        This holds for every index i (including i=1, whose sign is folded
        into the quotient by the diagonal flip via x(-Q)=x(Q), by the same
        argument applied to the free index it is paired against). CONFIRMED
        by direct inspection of raw-result.json's stage3_sublocus_census: the
        `fixed` and `random` sub-blocks for every (curve, m) cell checked
        (spot-checked RO2 m4/m5 in full) have BYTE-IDENTICAL mean_D,
        P_at_least_one_collision, max_D_observed and D_histogram, exactly as
        the algebraic argument predicts.
      consequence_check: >-
        Confirmed: this makes HEUR-COIN-1's own stated falsification
        condition ("the fixed-sign and random-sign sampling arms disagreeing
        by more than the forced value's standard error") UNSATISFIABLE BY
        THIS CONSTRUCTION, for the same class of reason as Finding 1 (a
        control whose stated failure mode cannot occur given how the
        instrument enumerates sign choices, independent of whether
        HEUR-COIN-1's underlying uniformity claim is true). The measurement
        that DOES bear on HEUR-COIN-1 is M4's agreement with its forced value
        (mostly <3 sigma; see cost/heuristic checks below), not this
        fixed-vs-random comparison; a future protocol revision wanting to
        falsify HEUR-COIN-1 would need a genuinely different null (e.g.
        comparison against literal independent-uniform draws from E(F_p),
        not against a relabelling of the same construction).
      verdict: CONFIRMED -- Finding 3 is a correct, watertight algebraic fact,
        and its stated consequence (this specific falsification condition is
        vacuous) is a real control-design limitation worth carrying forward,
        not a defect in this run.

    - control: "(J1 item 7) dual-path cross-check and positive controls, genuineness"
      deg_T_S4_fixture: >-
        Independently recomputed sp.resultant(S3(x1,x2,X), S3(x3,T,X), X)
        with a fresh sympy script using the SAME pinned S3 normalization
        (cited from EV-MONO-a0a89c OBS-1 / EXP-MONO-4b50b6), fully symbolic
        in x1,x2,x3,T,A,B: degree in T is exactly 4, confirming the
        Executor's fixture_checks.deg_T_S4_eq_4 claim. A "proves-too-much"
        sanity check (own addition, not requested but relevant): resultants
        of two GENERIC quadratics-in-X also generically come out degree 4 in
        a shared parameter, so this fixture mainly certifies "no gross
        coefficient error" (exactly EV-MONO-a0a89c's own stated reason for
        requiring it, after its own red team's coefficient-typo failure) --
        appropriately scoped, not oversold by the Executor.
      positive_control_2_planted: >-
        Independent algebraic check (own derivation): with P2 = P1+T for
        nonzero 2-torsion T, the {1,2}-branch signed combination
        (+1)*P1 + (-1)*P2 = -T = T (since T is 2-torsion) lands exactly on
        the nonzero 2-torsion point B-1's criterion requires, for ANY choice
        of the other m-3 points -- so a collision in this specific
        sign-class pair is forced with probability 1, independent of curve
        or trial, confirming the reported 100% detection rate is a real,
        non-vacuous, mathematically forced positive control rather than a
        tautology of the code.
      positive_control_1_random_quartics: >-
        Read controls.py positive_control_1 directly: draws 4 independent
        uniform F_p coefficients (label "quartic", NOT built via any
        square-root/curve recipe) and classifies via sympy factor_list --
        a genuinely different generative process from Stage 2/measured_null_1
        (whose roots are provably F_{p^2}-bounded per the field-theoretic
        argument above; a random quartic's roots are NOT so bounded).
        Independently inspected the raw histogram for RUN-1 (p=2027, 20000
        quartics, 19986 admissible): all five Chebotarev types have
        strictly positive counts (894, 4993, 2436, 6679, 4984) each within
        3 sigma of 1/24,1/4,1/8,1/3,1/4 (max sigma 2.17), confirming the
        classifier CAN and DOES detect 4-cycle/3+1 structure when a random
        (non-square-root-structured) object actually has it -- this is the
        control that actually discharges docs/inventor-protocol.md section 3's
        "run against an object where the conclusion is known false"
        requirement; see heuristic_validation_checks below.
      dual_path_structure: >-
        Inspected raw-result.json dual_path_cross_check directly: fixture
        block (deg_T_S4 symbolic, S3-vanishing on 12 real curve-point pairs
        across 3 curves, all true), per-(curve,m) cells each with
        n_checked=2000, n_disagree=0 -- structurally consistent with the
        reported "32,000 checked, 0 disagreements" summary, not merely
        asserted.
      verdict: CONFIRMED -- both mandatory controls and the dual-path
        cross-check are genuine, correctly implemented, and non-vacuous.

  heuristic_validation_checks:
    - check: pre-registered prediction (docs/target-result-profile.md / agents/validator.md item 1)
      result: PASS
      detail: >-
        M1/M2/M3/M4 forced values and the Chebotarev densities are all
        derived in H-MONO-45183a (dated/committed before this contract) and
        restated verbatim in specification.yaml's preregistered_prediction
        block, itself frozen and approved before RUN-MONO-12ce1c-{1,2}
        executed. No prediction was fit after seeing data.
    - check: sample integrity (seeds, manifest, recomputation from raw samples)
      result: PASS
      detail: >-
        Seed derivation rule is a literal, third-party-reproducible SHA-256
        scheme (seed.py); this review recomputed Stage-0's identity, the M4
        forced values, and the M1/M2 categorical result from raw
        specifications rather than copying the report's summary numbers.
    - check: >-
        null-object control before belief (docs/inventor-protocol.md section
        3): "any reported correlation, bias, or excess measured against a
        null object of the same shape, with a stated decay expectation as
        the destroying parameter increases"
      result: >-
        PARTIALLY SATISFIED, with the satisfying control being
        positive_control_1 rather than measured_null_1. The intended
        "null object of the same shape" for Part A's categorical claim was
        measured_null_1 (cross-curve), and per this review's independent
        derivation it CANNOT serve that role for the "4-cycle/3+1
        possibility" axis -- it is not merely underpowered, it is
        mathematically incapable of differing from the treatment on that
        axis regardless of ground truth, so its agreement with the
        treatment is UNINFORMATIVE rather than confirmatory, and its
        disagreement (which is what literally happened, since it failed the
        contract's OWN forced-value prediction) does not indicate an
        artifact either -- both possible outcomes of this control were
        uninformative about Part A once the F_{p^2}-boundedness fact is
        accounted for. The genuine "known-false" object IS present and DOES
        satisfy the requirement: positive_control_1 (uniformly random
        quartics, a construction NOT subject to the F_{p^2}-boundedness
        argument) correctly recovers full-S4 Chebotarev behaviour with
        strictly positive 4-cycle/3+1 counts, proving the classifier itself
        is capable of reporting non-Kummer structure when it is actually
        present. The "parameter meant to destroy the signal" framing does
        not map cleanly onto either control here (neither null varies a
        continuous destroying parameter); the closest analogue,
        graded_control_3 (the tau-ladder / N-scaling check for Part B's M4),
        is reported as decaying like 1/N as required (not independently
        re-verified end-to-end by this review beyond the 4-cell M4 spot
        check above, which is consistent with 1/N scaling).
      recommendation: >-
        A future revision of this control lineage should replace
        measured_null_1 with an object NOT built from single square roots of
        F_p elements at all (e.g. positive_control_1's own random-quartic
        recipe already serves this purpose and should be treated as the
        controlling "known-false" object for Part A going forward, rather
        than retaining measured_null_1 in its current form as if it were
        informative).
    - check: scale binding
      result: PASS
      detail: >-
        field_bits [7,8,9,10,11] and prime_range [100,3000] are recorded in
        every manifest; specification.yaml's scale_relevance and this
