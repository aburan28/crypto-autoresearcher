  hypothesis_id: H-MONO-45183a
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  batch_id: null
  batch_id_note: >-
    No batch is asserted. GOAL-MONO-001 is `paused` with `current_batch_id: BATCH-003`
    and its campaign budget exhausted; assigning this contract to a batch is a Coordinator
    act and is not performed here.

  title: >-
    Review-required contract: determine the monodromy of the m-th Semaev summation cover
    by its Kummer presentation and test the three forced consequences -- only two
    attainable Frobenius cycle types at m >= 4, the exact split-frequency ladder
    1/2 : 1/4 : 1/8, and the factor-base-sublocus root-coincidence rate 0 : 6/N : 18/N
    across tau in {1,2,4} -- with a nearby-object control on random quartics and a
    planted positive control on the sublocus.

  objective: >-
    If separately approved, frozen and authorized, decide by DERIVATION plus a
    minutes-long categorical measurement whether the geometric monodromy of the m-th
    Semaev summation cover is the elementary abelian sign group (Z/2)^{m-2}, and thereby
    whether GOAL-MONO-001's deferred m >= 4 census is unnecessary (Part A holds) or newly
    necessary for a different reason (Part A fails). This contract is a design proposal
    only. No run has happened, no observation is reported, and nothing here is evidence.

  relation_to_the_goals_pause: >-
    GOAL-MONO-001's next_action names EXACTLY ONE permitted action: decide whether an
    m >= 4 census is worth its budget given EV-MONO-a0a89c OBS-5, by either identifying a
    statistic that discriminates on the factor-base sublocus or recording a scoped no-go
    for the relation-rate half, and it forbids commissioning an m >= 4 census before that
    is answered. THIS CONTRACT IS NOT A CENSUS OF THE KIND FORBIDDEN. It differs in three
    declared ways and a reviewer should check each: (1) its decisive stage is a
    zero-compute symbolic derivation, and the measurement exists to check the derivation
    rather than to estimate an unknown frequency; (2) its m >= 4 arm tests a CATEGORICAL
    prediction (three of five cycle types forbidden outright) rather than a distributional
    one, so it does not need and does not have a sigma-excursion design of the kind
    EV-MONO-a0a89c OBS-6 shows could not have failed; (3) Stage 3 carries a statistic ON
    the factor-base sublocus, which is the first of the two things next_action asks for.
    IF THE COORDINATOR JUDGES OTHERWISE, THE CORRECT DISPOSITION IS TO REFUSE THIS
    CONTRACT, and that judgement is the Coordinator's alone (AGENTS.md rule 1).
    Prerequisite acknowledged and not discharged here: next_action further requires that
    any successor harness first carry the five repairs of CORR-20260802-1d8384 OI-1. THIS
    CONTRACT DOES NOT REUSE THE EXP-MONO-4b50b6 HARNESS -- it declares a fresh
    pure-Python instrument with no shared code path -- so those repairs do not transfer to
    it by inheritance; a reviewer must decide whether that side-steps the requirement or
    satisfies it, and the contract does not decide that for them.

  what_this_is_not:
    - Not a discrete-logarithm computation, not relation collection, not an ECDLP attack.
    - >-
      Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or
      deployed-scheme claim, in either direction.
    - >-
      Not a closure of KN-OPEN-009. One of its two halves (imprimitivity/monodromy) is
      addressed; the relation-rate half is EXP-MONO-c819ba's and is untouched here.
    - >-
      Not a statement about F_{q^n}, the Weil-restriction setting, characteristic 2 or 3,
      singular curves, or genus > 1.
    - >-
      Not an edit, supersession, or status change of EV-MONO-a0a89c, KN-OPEN-009,
      RQ-MONO-001 or GOAL-MONO-001. Those are Coordinator acts.
    - Not approved, frozen, authorized, executed, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on the declared panel of >= 8 non-singular curves over primes in
      [100, 3000], at m in {3, 4, 5}, with >= 20,000 specializations per cell, the
      observed Frobenius cycle types on the generic fibre fell in {1^{2^{m-2}},
      2^{2^{m-3}}} and matched, per specialization, the type forced by that
      specialization's quadratic-character vector; that the split frequency matched
      (S^{m-1} + N_ns^{m-1})/p^{m-1}; and that the factor-base-sublocus coincidence rate
      matched its forced value. A run may ALSO support the DERIVATION it checks, but the
      derivation's validity comes from the argument, not from the run, and the two must be
      cited separately.
    what_no_outcome_can_support: >-
      No outcome establishes anything at cryptographic scale, about F_{q^n}, about ECDLP
      cost, or about any exponent. Toy evidence is never crypto-scale evidence
      (AGENTS.md rule 7).

  inputs:
    field_bits_note: >-
      Recorded explicitly because the session ANGLE-BRIEF reports 513 of 1670 run
      manifests carrying no `field_bits`, which disables the validator's tier ceiling.
      Every run manifest emitted by this contract MUST carry field_bits.
    field_bits: [7, 8, 9, 10, 11]
    prime_range: [100, 3000]
    m_values: [3, 4, 5]
    specializations_per_cell: 20000
    sublocus_tuples_per_cell: 20000
    curve_panel:
      random_ordinary_minimum: 4
      cm_minimum: 2
      j0_required: true
      j1728_required: true
      tau_coverage_required: [1, 2, 4]
      tau_coverage_is_a_hard_precondition: >-
        tau = #E(F_p)[2] = Z + 1. If the constructed panel does not contain at least one
        curve for each tau in {1,2,4}, the Stage-3 graded control does not exist and
        Stage 3 IS NOT RUN. The contract fails the precondition rather than running a
        degraded control; a graded control with two of three points is reported as
        two-point and never as graded.
    master_seed: 20260805
    domain: EXP-MONO-12ce1c/v1
    seed_derivation_rule: >-
      Every random draw uses SHA-256 of the ASCII bytes of
      domain || "|" || label || "|" || decimal(p) || "|" || decimal(m) || "|" ||
      decimal(counter), big-endian unsigned, with rejection sampling to avoid modulo
      bias: for a draw in [0, M), reject digests >= floor(2^256 / M) * M. Labels used, and
      no others: "prime", "curve-a", "curve-b", "spec-x", "fb-x", "quartic", "crosscurve",
      "plant". Counters start at 0 and advance once per digest consumed, per label, per
      (p, m) cell. A third party reproduces every instance bit-for-bit from
      (master_seed, domain, label, p, m, counter).
    prime_construction: >-
      For each target bit size b in field_bits, let h = int(SHA256(seed("prime", b, 0, 0))),
      L = 2^(b-1), U = 2^b, c_0 = L + 1 + 2*(h mod 2^(b-2)), and test c_k = c_0 + 2k in
      increasing k while c_k < U. A candidate is prime exactly when it exceeds 3, is odd,
      and has no odd divisor d in 3,5,...,floor(sqrt(c_k)). The first prime is p. If the
      scan reaches U with no prime, the cell terminates as CONSTRUCTION_FAILURE; no
      wrapping, no reseeding, no nearby size.
    curve_construction: >-
      For t = 0,1,...,65535: a_t = int(SHA256(seed("curve-a", p, 0, t))) mod p,
      b_t = int(SHA256(seed("curve-b", p, 0, t))) mod p. Reject if
      (4 a_t^3 + 27 b_t^2) mod p = 0. Compute #E(F_p) = 1 + sum_{x=0}^{p-1}
      (1 + chi(x^3 + a_t x + b_t)) with chi(0) = 0. Accept the first candidate that is
      non-singular and ordinary (#E(F_p) mod p != 1). The CM and j = 0 / j = 1728 panel
      members are constructed by fixed declared (A, B) rather than by this stream:
      j = 0 uses A = 0 with B the first accepted value of the stream, j = 1728 uses B = 0
      with A the first accepted value; the CM members are the first two accepted curves
      whose #E(F_p) admits a declared small-discriminant CM order, and the discriminant
      test used MUST be recorded with the panel.
    factor_base_construction: >-
      Scan x = 0,...,p-1 in increasing order; retain x when
      (x^3 + A x + B)^((p-1)/2) mod p = 1 (nonzero squares only; f(x) = 0 is EXCLUDED, and
      the exclusion count is recorded). The retained ordered list is the factor base and
      its SHA-256 over canonical decimal lines is committed before any tuple is drawn.
      Sign convention: for the fixed-sign arm, y is the smaller of the two square roots as
      an integer in [0, p); for the random-sign arm, the sign is drawn from label "fb-x".
      BOTH ARMS ARE RUN (see HEUR-COIN-1).

  stage_order_and_the_terminating_stage:
    principle: >-
      Cheapest decisive gate first. STAGE 0 IS ZERO-COMPUTE AND CAN END THE ENTIRE
      CONTRACT.
    stage_0:
      name: symbolic baseline reproduction
      compute: none
      description: >-
        Verify, symbolically and under a receipt, that
        freq_split(m=3) = (S^2 + N_ns^2 - (p - Z))/p^2 with S = (p-t-Z)/2 and
        N_ns = (p+t-Z)/2 equals EV-MONO-a0a89c OBS-3's committed
        freq_split - 1/2 = (t^2 - 2pZ + Z^2 - 2p + 2Z)/(2p^2), as an identity in (p,t,Z),
        and evaluate both on the 105 curves of RUN-MONO-4b50b6-002.
      terminates_the_run_if: >-
        The identity fails, or any of the 105 curves disagrees. Then the derivation is
        wrong, the hypothesis is withdrawn by a superseding record, and NO COMPUTE IS
        SPENT. This is the cheapest available refutation of the whole line.
    stage_1:
      name: prior-art read
      compute: none
      description: >-
        Search for prior statement of the Kummer/Galois structure of Semaev summation
        polynomials and record verbatim what was found, including negative results. A hit
        reduces the claim to a corpus-gap note; the mathematics is unchanged and the
        remaining stages still run.
    stage_2:
      name: generic-fibre cycle-type census at m = 3, 4, 5
      compute: minutes
    stage_3:
      name: factor-base-sublocus root-coincidence census at m = 4, 5
      compute: minutes
    stage_4:
      name: controls (nearby object, cross-curve null, planted positive)
      compute: minutes
      note: >-
        Stage 4's nearby-object control is REPORTED BEFORE Stage 2's and Stage 3's
        treatment results are read. See arms_and_controls.ordering_control.

  arms_and_controls:
    treatment_a: >-
      GENERIC FIBRE. For each (curve, m), draw specializations_per_cell tuples
      (x_1,...,x_{m-1}) uniformly from F_p^{m-1} using label "spec-x". Exclude and count
      separately: any tuple with f(x_i) = 0 (ramified stratum) and any tuple with repeated
      x_i (diagonal stratum). For each admissible tuple compute the 2^{m-2} values
      x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) in F_{p^2}, record which lie in F_p, and emit
      the Frobenius cycle type together with the quadratic-character vector
      (chi(f(x_1)),...,chi(f(x_{m-1}))).
    treatment_b: >-
      FACTOR-BASE SUBLOCUS. For each (curve, m in {4,5}) draw sublocus_tuples_per_cell
      tuples of DISTINCT factor-base x-coordinates using label "fb-x", compute the
      2^{m-2} signed-sum x-coordinates by group arithmetic in E(F_p), and emit
      D = 2^{m-2} - #distinct, the set of colliding class pairs, and both
      E[#colliding pairs] and the at-least-one-collision indicator. Run in BOTH the
      fixed-sign and random-sign conventions as separate arms.
    measured_null_1: >-
      CROSS-CURVE NULL FOR THE GENERIC FIBRE (same shape, forced value derived pre-run,
      CAN FAIL). Build the degree-4 polynomial whose roots are
      x(eps_1 P_1 + eps_2 P_2 + eps_3 P'_3), where P_1, P_2 come from E and P'_3 from a
      DIFFERENT non-singular curve E' of the same order, drawn under label "crosscurve".
      The sign-torsor argument does not apply across two curves, so the FORCED VALUE IS
      THAT 4-CYCLES AND 3+1 TYPES APPEAR AT NONZERO RATE. If they do not, the classifier
      is reporting an artifact of the construction rather than the Galois structure, and
      Stage 2 is void. This null can genuinely fail and is not a decoration.
    measured_null_2: >-
      tau = 1 NULL FOR THE SUBLOCUS (forced to EXACTLY ZERO, can fail). On every panel
      curve with tau = 1, the m = 4 coincidence count is forced to 0. Same code path, same
      tuple count, same construction as the tau >= 2 arms. A single observed collision
      falsifies Part B.
    positive_control_1: >-
      NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION IS KNOWN FALSE (MANDATORY). Draw
      uniformly random monic quartics over the same F_p under label "quartic" and classify
      them with the IDENTICAL cycle-type classifier. Chebotarev for a generic quartic
      predicts densities 1/24, 1/4, 1/8, 1/3, 1/4 for types 1^4, 2+1+1, 2^2, 3+1, 4. The
      classifier MUST land within 3 standard errors of each and MUST emit strictly
      positive counts of 4-cycles and 3+1 types. IF IT DOES NOT, NO RESULT MAY BE
      REPORTED FROM ANY ARM, POSITIVE OR NEGATIVE (docs/inventor-protocol.md section 3).
      Precedent in this lane: EV-MONO-a0a89c OBS-7 records the degree-5 version of exactly
      this control matching Chebotarev(S_5) at 0.2026 vs 0.2 and 0.2451 vs 0.25.
    positive_control_2: >-
      PLANTED COLLISION ON THE SUBLOCUS (MANDATORY). On a tau >= 2 curve, construct tuples
      with P_2 = P_1 + T for the nonzero 2-torsion point T (label "plant"), so the {1,2}
      branch fires by construction and EVERY planted tuple must be reported as colliding.
      Forced detection rate 100 per cent. If the instrument misses planted collisions, no
      absence of natural ones may be reported.
    graded_control_1: >-
      m-LADDER, 3 INTERIOR POINTS, MONOTONICITY REPORTED. Split-completely frequency at
      m = 3, 4, 5 against the forced (S^{m-1} + N_ns^{m-1})/p^{m-1}; at t = Z = 0 that is
      1/2, 1/4, 1/8. Report measured/forced at each m and the fitted decay rate. The
      competing full-symmetric model forces 1/2, 1/24, 1/40320, so the two diverge in RATE
      and a failure localizes which m first breaks the structure.
    graded_control_2: >-
      tau-LADDER, 3 INTERIOR POINTS. Sublocus coincidence rate at m = 4 across
      tau in {1,2,4} against the forced 0, 6/N, 18/N. Report the fitted slope in
      (tau - 1)/N; the forced slope is 6.
    graded_control_3: >-
      SCALE LADDER. The same tau at two primes with N differing by a factor >= 3. The
      coincidence rate MUST fall like 1/N. A rate that does not decay when the parameter
      meant to destroy it grows is the canonical artifact tell and this control exists to
      catch exactly that.
    ordering_control: >-
      MANDATORY AND HASH-COMMITTED. The two positive controls and both measured nulls are
      generated, classified, and committed by SHA-256 BEFORE any treatment specialization
      is classified. The decision rule is then executed ON THE NULLS FIRST and its labels
      recorded. If the rule emits the same label on a null and on a treatment arm, the
      rule discriminates nothing and must be rewritten before any treatment output is
      read. Absence of the pre-treatment commitment is invalid_measurement.
    dual_path_control: >-
      TWO INDEPENDENT CLASSIFIER CODE PATHS, CROSS-CHECKED. Path 1 constructs the roots
      directly as signed sums in F_{p^2}, with no summation polynomial. Path 2 constructs
      S_m explicitly by the resultant recursion
      S_4 = Res_X(S_3(x_1,x_2,X), S_3(x_3,T,X)), S_5 = Res_X(S_4(x_1,x_2,x_3,X),
      S_3(x_4,T,X)) and factors the specialization over F_p. The two paths must agree on a
      declared cross-check subsample of >= 2000 specializations per (curve, m) with ZERO
      disagreements. A FIXTURE CHECK IS REQUIRED BEFORE PATH 2 IS BELIEVED: verify
      deg_T S_4 = 4 and deg_T S_5 = 8 and that S_3 vanishes at x(P +- Q) on real curve
      points. EV-MONO-a0a89c OBS-5 records its own red team producing garbage from a
      coefficient typo on its first S_4 attempt; the fixture check exists because that
      failure is documented rather than hypothetical.
    comparability_policy: >-
      NO cross-domain comparison to EXP-MONO-4b50b6 or its runs is permitted except for
      the Stage-0 symbolic reproduction of OBS-3's closed form on its 105 committed
      curves, which is a comparison of FORMULAS and not of measurements. Any comparison of
      measured numbers between this contract and that one requires a separately registered
      comparator contract naming both domains, streams, statistics and failure
      dispositions. A shared seed does not imply stream or instance equivalence.

  metrics:
    primary:
      - >-
        M1 (categorical): count of observed Frobenius cycle types at m >= 4 outside
        {1^{2^{m-2}}, 2^{2^{m-3}}}, on admissible specializations. Forced value 0.
      - >-
        M2 (per-instance): fraction of admissible specializations whose observed cycle
        type equals the type forced by their own quadratic-character vector. Forced 1.000.
      - >-
        M3: measured split-completely frequency divided by the forced
        (S^{m-1} + N_ns^{m-1})/p^{m-1}, per (curve, m).
      - >-
        M4: sublocus coincidence rate per (curve, m), against its forced value emitted
        from (N, tau) before any draw.
    secondary:
      - number of distinct Frobenius permutations realized, as a measured lower bound on |Gal|
      - ramified and diagonal stratum counts, reported separately and never pooled
      - positive-control quartic histogram against S_4 Chebotarev densities, with standard errors
      - planted-collision detection rate
      - dual-path cross-check disagreement count (must be 0)
      - fixed-sign versus random-sign sublocus rates and their difference
      - fitted slope in (tau - 1) and fitted exponent in N
      - factor-base digest, p, A, B, #E(F_p), t, Z, tau per curve

  preregistered_prediction:
    - quantity: M1
      value: 0
      formula: >-
        Regular action of an elementary abelian 2-group is free off the identity, so every
        non-identity element is a product of 2^{m-3} transpositions and the identity fixes
        all 2^{m-2} points; no other cycle type exists.
      source: H-MONO-45183a HEUR-KUM-1 (derived, unconditional given the containment)
    - quantity: M2
      value: 1.000
      formula: >-
        Frob(sum eps_i P_i) = sum eps_i chi(f(x_i)) P_i, which is +- the original for all
        eps iff all chi(f(x_i)) coincide.
      source: H-MONO-45183a mechanism step A-3
    - quantity: M3
      value: 1.00 within 3 binomial standard errors at each m
      formula: >-
        forced split frequency = (S^{m-1} + N_ns^{m-1})/p^{m-1},
        S = (p - t - Z)/2, N_ns = (p + t - Z)/2, non-ramified stratum only.
      source: >-
        H-MONO-45183a A3; reproduces EV-MONO-a0a89c OBS-3 exactly at m = 3, which is the
        Stage-0 gate.
    - quantity: M4 at m = 4
      value: 6 (tau - 1) / N, within 3 binomial standard errors
      formula: >-
        6 class pairs, each with one singleton branch (probability 0 because f(x_i) != 0)
        and one size-2 branch (probability (tau-1)/N because the identity case is
        x_i = x_j, excluded).
      source: H-MONO-45183a mechanism step B-2
    - quantity: M4 at m = 5
      value: 16 tau / N + 24 (tau - 1) / N, within 3 binomial standard errors
      formula: >-
        16 class pairs of partition type (1,3) contributing tau/N each, and 12 of type
        (2,2) contributing 2(tau-1)/N each.
      source: H-MONO-45183a mechanism step B-2
    - quantity: positive control 1 (random quartics)
      value: 1/24, 1/4, 1/8, 1/3, 1/4 for cycle types 1^4, 2+1+1, 2^2, 3+1, 4
      formula: Chebotarev density theorem for a generic quartic with Galois group S_4
      source: >-
        Standard; and corroborated inside this corpus at degree 5 by EV-MONO-a0a89c OBS-7.
        NOT READ from any external source and no theorem number is asserted.

  replication:
    planned_runs: 2
    seeds: [20260805, 20260806]
    interpretation: >-
      Two runs at different master seeds on the same declared panel. The categorical
      metrics M1 and M2 are seed-invariant by construction, so a seed-to-seed difference
      in them is an implementation defect and voids the cell. The frequency metrics M3 and
      M4 are seed-dependent and their seed-to-seed spread MUST be reported BEFORE any
      model error is reported, so that a model cannot be scored against noise.

  budget:
    maximum_runs: 2
    maximum_wall_seconds: 7200
    maximum_cpu_seconds: 14400
    maximum_peak_rss_bytes: 2147483648
    maximum_total_disk_bytes: 2147483648
    maximum_workers: 1
    no_network: false
    no_network_note: >-
      Stage 1 (prior-art read) requires network access; Stages 0 and 2-4 require none and
      MUST be runnable with the network disabled. If network access is unavailable, Stage 1
      is recorded as NOT PERFORMED with that reason and the remaining stages proceed; a
      missing Stage 1 downgrades the novelty statement and nothing else.

  environment_preconditions:
    verified_in_this_container_on_20260805:
      - "python3 -c 'import numpy' -> numpy 2.4.6 (import succeeds)"
      - "python3 -c 'import sympy' -> ModuleNotFoundError: No module named 'sympy'"
      - "python3 -c 'from sage.all import GF' -> ModuleNotFoundError: No module named 'sage'"
    consequence: >-
      This contract requires NEITHER a CAS NOR a solver. All arithmetic is pure-Python
      integer arithmetic over F_p and F_{p^2} and integer polynomial arithmetic for the
      resultant recursion. numpy MAY be used for tabulation only and its absence must not
      block any metric. This resolves, for this container, the environment disagreement the
      session ANGLE-BRIEF records between two scouting reports; the resolution is recorded
      here as required rather than inherited.
    if_a_precondition_fails: >-
      Missing python3, or a failure of the fixture check on deg_T S_m, is
      failed_infrastructure and is reported as infrastructure signal. IT IS NEVER NEGATIVE
      MATHEMATICAL EVIDENCE AGAINST H-MONO-45183a OR ANY ECDLP PROPOSITION
      (AGENTS.md rule 5).

  infrastructure_failure_disposition: >-
    A timeout, crash, memory-cap breach, construction failure, missing dependency, or
    dual-path disagreement is recorded with its exact cause and classified
    `failed_infrastructure` or `invalid`. Such an outcome supports and weakens NOTHING. It
    may not be cited as evidence about monodromy, about relation rates, about KN-OPEN-009,
    or about the ECDLP. AGENTS.md rule 5, restated here because the ANGLE-BRIEF records a
    goal in this program closed at budget on exactly such an obstruction.

  stopping_rules:
    - >-
      Do not execute unless this contract is separately reviewed, approved, frozen,
      archived and authorized by the Coordinator. It carries no approved_by field.
    - >-
      Stop at Stage 0 if the symbolic identity fails or any of the 105 committed OBS-3
      curves disagrees. Emit the negative disposition; spend no compute.
    - >-
      Stop before any treatment arm if the pre-treatment null and positive-control
      commitment hashes are absent.
    - >-
      Stop the whole contract if positive control 1 fails: no result may be reported from
      any arm.
    - >-
      Skip Stage 3 entirely if the tau in {1,2,4} coverage precondition is unmet, and
      record it as unmet rather than running a degraded graded control.
    - Stop on any budget breach, reporting the breach as infrastructure signal.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any missing construction record, factor-base digest, seed record or run manifest.
    - Any run manifest lacking field_bits.
    - Any dual-path disagreement on the cross-check subsample.
    - Any pooling of the ramified or diagonal strata into the main statistic.
    - >-
      Any post-hoc change to a preregistered value, tolerance or decision rule after any
      Stage-2, -3 or -4 number has been observed. Such a change requires a versioned
      protocol amendment marked exploratory_only, and is never an edit.

  success_criterion: >-
    THERE IS NO CURRENT SUCCESS OUTCOME BECAUSE THIS CONTRACT IS NOT AUTHORIZED FOR
    EXECUTION. If a separately approved, frozen successor is executed, its positive
    disposition is: Stage 0 passes as an exact identity; positive control 1 reproduces the
    S_4 Chebotarev densities with strictly positive 4-cycle and 3+1 counts; the cross-curve
    null exhibits 4-cycles and 3+1 types; the dual paths agree with zero disagreements;
    M1 = 0 and M2 = 1.000 on every admissible specialization at m = 4 and m = 5; M3 within
    3 standard errors of its forced value at all three m; and, if the tau precondition
    holds, M4 within 3 standard errors of its forced value at every cell with the planted
    positive control at 100 per cent. THAT DISPOSITION SUPPORTS EXACTLY ONE THING: the
    scoped, toy-tier statement in claim_ceiling. It establishes no ECDLP attack, cost,
    exponent, crypto-scale or deployed-scheme claim, and it does not close KN-OPEN-009.

  falsification_criterion: >-
    Any of: (a) Stage 0's identity failing; (b) M1 > 0 with positive control 1 passing;
    (c) M2 < 1.000; (d) M3 outside 3 standard errors at any m with controls passing;
    (e) any collision at m = 4 on a tau = 1 curve, or M4 outside 3 standard errors with the
    planted control passing; (f) the m = 5 tau = 1 rate measuring 0 rather than 16/N, which
    would refute the size->=3 branch and the relation-counter reading specifically. Each
    falsifies a NAMED part: (a)-(d) Part A, (e)-(f) Part B, and the two parts must be
    reported separately so that one failing does not contaminate the other.

  outcomes:
    no_execution_authorization: >-
      THE ONLY CURRENT DISPOSITION. A review_required draft. No run, no observation, no
      evidence, no mathematical inference.
    future_kummer_confirmed_toy: >-
      Only after separate approval, freezing, authorization and valid execution. Scoped
      toy-tier; states that the derivation's consequences were observed on the declared
      panel; never an ECDLP claim.
    future_kummer_refuted: >-
      Part A false at the tested scale. This is the higher-information outcome: it would
      mean the summation cover carries monodromy the sign torsor does not explain, and the
      m >= 4 census GOAL-MONO-001 deferred becomes necessary for a genuinely new reason.
      Routed to a correction record and to independent review; no record is edited.
    instrument_failure: >-
      Positive control 1 fails, or the dual paths disagree. Inconclusive instrument signal.
      Never evidence about H-MONO-45183a or any ECDLP proposition.
    infrastructure_or_integrity_failure: >-
      See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      THE DERIVATION IS SCALE-FREE and the measurement is not, and the two must be cited
      differently. The containment Gal <= (Z/2)^{m-2} is an algebraic statement about
      k(x_1,...,x_{m-1}) for any field of characteristic > 3, so a toy run is a CHECK OF A
      DERIVATION rather than an extrapolation, and its failure would be far more
      informative than its success. The MEASURED frequencies, coincidence rates and
      realized-class counts are toy-scale facts about primes in [100, 3000] and transfer
      to nothing. In particular no observation here says anything about a 256-bit curve, and
      the coincidence effect is O(1/N) and therefore vanishes at any scale that matters.
      Stated limit: nothing in this contract addresses F_{q^n}, which is where the
      Gaudry/Diem attack actually operates.

