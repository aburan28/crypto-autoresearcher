experiment:
  id: EXP-ICINV-4395a7
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-692e9b
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: IS THE PROGRAM'S OWN CENTRAL QUANTITY A CLASS INVARIANT? Measure the H-PSEUDO factor-base
    flatness constant C(E) across a complete isogeny class, against the FIELD-SIDE analogue whose
    entire achievable range is pinned to a factor of 3 by Parseval below and Weil above -- so the
    field-side flatness is closed by derivation while the group-side flatness is pinned only to a
    factor sqrt(B), and any within-class variance that survives lives exactly in the gap KN-FIND-5c1a03
    identifies as the missing structural ingredient
  status: draft
  objective: "(A) TWO FLATNESS FUNCTIONALS THAT LOOK ALIKE AND ARE NOT.\n  FIELD-SIDE. Let X_E = {x\
    \ in F_p : x^3 + a x + b is a square, including its\n    roots}, the set of x-coordinates of F_p-rational\
    \ points. Its additive\n    Fourier transform is 1_hat_{X_E}(c) = sum_{x in X_E} e_p(-cx). The\n\
    \    FIELD-SIDE FLATNESS is Phi_field(E) = max_{c != 0} |1_hat_{X_E}(c)|.\n  GROUP-SIDE. Let G\
    \ = <P> of prime order N, F = {Q in G : x(Q) < tau} of\n    size B, and D = {DL_P(Q) : Q in F}\
    \ subset Z/N. The GROUP-SIDE FLATNESS\n    is Phi_group(E) = max_{k != 0} |sum_{d in D} e_N(k\
    \ d)|, and\n    C(E) = Phi_group(E)/sqrt(B) is exactly the constant of H-PSEUDO-83817b,\n    measured\
    \ empirically at C ~ 3 for p = 1009..4001 in EV-BGT-816536.\n\n(B) THE DERIVED TWO-SIDED PIN ON\
    \ THE FIELD SIDE, WHICH CLOSES IT.\n  UPPER: for c != 0, 1_hat_{X_E}(c) = (1/2) sum_x chi(f(x))\
    \ e_p(-cx) +\n    O(r), and the Weil bound for a mixed character sum with deg f = 3 and a\n  \
    \  linear additive argument gives |sum_x chi(f(x)) e_p(-cx)| <= 3 sqrt(p).\n    Hence Phi_field(E)\
    \ <= (3 sqrt(p) + 3)/2 FOR EVERY CURVE.\n  LOWER: Parseval gives sum_{c} |1_hat|^2 = p |X_E|,\
    \ and 1_hat(0) = |X_E|,\n    so sum_{c != 0} |1_hat|^2 = |X_E|(p - |X_E|) ~ p^2/4, whence\n  \
    \  Phi_field(E) >= sqrt(|X_E|(p - |X_E|)/(p-1)) ~ sqrt(p)/2 FOR EVERY\n    CURVE.\n  THEREFORE\
    \ Phi_field(E) lies in [sqrt(p)/2, 3 sqrt(p)/2] (1 + o(1)) for\n  EVERY curve over F_p -- a window\
    \ of ratio 3, unconditionally, with no\n  class hypothesis at all. THE ENTIRE ACHIEVABLE VARIATION\
    \ OF FIELD-SIDE\n  FLATNESS, WITHIN A CLASS OR ACROSS ALL CURVES, IS A FACTOR OF 3. No\n  exponent\
    \ can come from it, and the isogeny-class axis cannot deliver what\n  the whole space of curves\
    \ does not contain. NAMED OBSTRUCTION\n  (O-FLATFIELD): Parseval from below, Weil from above,\
    \ ratio 3.\n\n(C) WHY THE GROUP SIDE IS NOT CLOSED BY THE SAME ARGUMENT, AND THIS IS THE POINT\
    \ OF THE RECORD. The same Parseval computation on the group side gives Phi_group(E) >= sqrt(B(1\
    \ - B/N)) ~ sqrt(B), so C(E) >= 1 - o(1); the only available upper bound is the trivial Phi_group\
    \ <= B, i.e. C(E) <= sqrt(B). THE GROUP-SIDE WINDOW IS A FACTOR sqrt(B), NOT A FACTOR 3, because\
    \ there is no Weil bound for a character sum over DISCRETE LOGARITHMS -- the discrete log is not\
    \ an algebraic function of the coordinates, which is precisely the gap KN-FIND-5c1a03 records\
    \ as the single missing structural ingredient identified independently by three analyses. So C(E)\
    \ has room to vary by a factor sqrt(B) in principle, and whether it varies WITHIN A CLASS is a\
    \ cheap, sharp, unasked question.\n(D) WHY C(E) COULD DEPEND ON THE CURVE EQUATION AND NOT ONLY\
    \ ON (p, N, t). Under transport by an F_p-isogeny phi of degree coprime to N, DL is PRESERVED\
    \ exactly: DL_{phi(P)}(phi(Q)) = DL_P(Q) by T1. So the map D -> Z/N is the same abstract set for\
    \ E and E' -- EXCEPT that the factor base is not transported: F is defined by the coordinate condition\
    \ x(Q) < tau, and phi does not preserve coordinate windows. The set D subset Z/N is therefore\
    \ genuinely different on different class members, and C(E) is the flatness of a DIFFERENT subset\
    \ of Z/N of the same size on each member. Nothing in (p, N, t) determines which subset. C(E) is\
    \ also gauge-dependent, since the gauge dilation X_E -> u^2 X_E changes which points fall in the\
    \ window, so the gauge null of IDEA-20260807-6eb96b is ADMISSIBLE here (its spread is not forced\
    \ to zero) -- unlike for the dilation-invariant functionals, which that record's table flags as\
    \ mode-1.\n(E) THE THREE OUTCOMES, ALL DELIVERABLES.\n  OUTCOME I (invariant): within-class spread\
    \ of C(E) is inside the gauge\n    interval. Then the program's central quantity is, at toy scale,\
    \ a\n    function of (p, N, t, B) plus equation noise, and the isogeny axis is\n    closed for\
    \ it -- a strong statement, because C is exactly the quantity\n    the program cannot bound theoretically.\n\
    \  OUTCOME S (structured): within-class spread exceeds the gauge interval.\n    Then some class\
    \ members have a materially flatter factor base than\n    others, the H-PSEUDO constant is not\
    \ universal in the way the hypothesis\n    states, and the lane has a target whose reachability\
    \ is then decided by\n    IDEA-20260807-c36472.\n  OUTCOME W (wide-null): the gauge interval itself\
    \ is comparable to the\n    whole field-side-style window. Then equation choice alone moves the\n\
    \    program's central constant as much as anything else does, which is a\n    significant observation\
    \ about H-PSEUDO-83817b's own formulation --\n    because that hypothesis quantifies over curves\
    \ without fixing the\n    equation.\nIn every branch the FIELD-SIDE arm is measured alongside\
    \ as a derived control: its spread must stay inside the factor-3 window of (B), and if it does\
    \ not, the instrument is broken."
  resource_label: 'R1 (x-coordinates as field elements: the window is a coordinate condition and the
    field-side transform is over F_p) + R2 (the curve equation, which determines X_E and therefore
    which points fall in the window).'
  admissibility: admissible
  admissibility_argument: 'The measured object is a subset of Z/N obtained by filtering group elements
    through a COORDINATE predicate. The predicate x(Q) < tau is not expressible by group operations
    and equality tests: a generic-group algorithm sees only opaque handles, so it cannot compute the
    window membership that defines F. This is the R1 line of DECOMPOSITION.md section 2. The measurement
    does require DLs, which at toy scale are computed by exhaustive enumeration -- that is an INSTRUMENT
    cost, not an oracle grant, and no algorithm is proposed that assumes a DL oracle. KN-FIND-b7e091''s
    closed oracles (incidence, endomorphism-image) are not used. H-ENDO-001 is untouched: no endomorphism
    is applied to any point.'
  reachability_gate: 'ADDRESSED, AND THE ANSWER DEPENDS ON THE OUTCOME. Under OUTCOME I there is no
    minimiser and T5 is moot. Under OUTCOME S the minimiser is a class member with an unusually flat
    factor base, and its reachability is decided by IDEA-20260807-c36472''s routes: (R-common) is
    tested directly here by reporting the fraction of members within 5% of the class minimum of C;
    (R-local) requires C(E'') to be predictable from cheap vertex data, which this record does NOT
    expect since C is a global extremal statistic of a coordinate-selected set and no cheap invariant
    plausibly predicts it; (R-address) is unavailable, because no closed form identifies a flat curve.
    So the honest pre-registered position is that even a positive OUTCOME S would most likely FAIL
    the reachability gate on identification cost (h ~ p^{1/2} evaluations, each costing a DL table),
    and the record says so in advance rather than discovering it after a positive.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write the derivations in (B) and (C) and the forced values;
      literature check for character-sum bounds over discrete logs (a positive hit would be a major
      ingredient and would change the lane''s shape). STAGE 1 (minutes, HARD GATE): instrument checks
      -- Phi_group = 0 at B = N; arithmetic-progression control gives C ~ sqrt(B); Parseval identities
      verified numerically; the C ~ 3 reproduction at p = 1009, 4001 against H-PSEUDO''s recorded
      convention. STAGE 2 (~1 hour): enumerate classes at p in [2^12, 2^13] and retain prime-order
      classes with >= 20 members. STAGE 3 (hours): four-arm measurement of C(E) and Phi_field, >=
      8 gauge draws per member, >= 4 values of B, DL certificates on every point. STAGE 4 (~1 hour):
      the secondary gauge-invariant arm with its random-subset null. STAGE 5 (zero compute): the frozen
      rule, null arm first, outcome recorded. The whole record is dominated by Stage 3 and is cheap
      because every per-curve step is O(N log N).'
    mechanism: 'STEP 1 -- CLASS SELECTION ON PRIME ORDER, DECLARED FIRST. Enumerate complete classes
      at p in [2^12, 2^13] and retain classes whose common order #E(F_p) = p + 1 - t is PRIME. Then
      N = #E, G = E(F_p), every member is cyclic of prime order, and F needs no cofactor handling.
      NOTE THE DELIBERATE TENSION WITH IDEA-20260807-0a3272: prime-order classes have odd order, hence
      no rational 2-torsion at all, hence r = 0 on every member, hence no 2-torsion stratification.
      The two records therefore study DISJOINT families of classes on purpose, and neither may cite
      the other''s class selection as its own.

      STEP 2 -- BUILD D(E) EXACTLY. For each member: pick a generator P, build the full DL table by
      walking multiples of P (O(N) group operations, ~8000 at p ~ 2^13), collect D = {DL(Q) : x(Q)
      < tau} for a declared tau giving |D| = B. Certificate: every recorded pair (d, Q) is re-verified
      by recomputing [d]P in harness/toycurve.py, independently of the walk.

      STEP 3 -- COMPUTE BOTH FLATNESS FUNCTIONALS BY FFT. Phi_group by one length-N DFT of the indicator
      of D; Phi_field by one length-p DFT of the indicator of X_E. Both are O(N log N) and O(p log
      p). Report C(E) = Phi_group/sqrt(B) and Phi_field(E)/sqrt(p) side by side.

      STEP 4 -- THE FOUR ARMS. Arm C: every member of the class at a canonical gauge representative.
      Arm G: >= 8 gauge draws per member, reported as an interval. Arm R: >= 30 random prime-order
      curves at the same p (different classes). Arm U: uniform random subsets of Z/N of size B --
      the ABSOLUTE reference, since a uniform random set has Phi_group ~ sqrt(B log N) by the standard
      extreme-value estimate, and both the real and the null arms must be scored against that reference
      model rather than only against each other (KN-TECH-1a5b7e, "check both arms against the reference
      model").

      STEP 5 -- THE DERIVED CONTROL, RUN AND REPORTED FIRST. The field-side arm must satisfy sqrt(p)/2
      <= Phi_field <= 3 sqrt(p)/2 for EVERY curve measured. This is a derivation, not a measurement,
      so observing it is a passed instrument check and observing a violation means the transform or
      the character table is wrong. Report the observed min and max of Phi_field/sqrt(p) across all
      arms before any group-side number is looked at.

      STEP 6 -- THE SECONDARY ARM WITH ITS OWN NULL. Measure the additive energy of X_E and the multiset
      of field-side Fourier magnitudes. Their gauge spread is ZERO by algebra (dilation invariance),
      so their null is a uniform random subset of F_p of matched size, NOT the gauge orbit. Report
      whether the within-class spread of additive energy exceeds the random-subset spread. This arm
      is cheap and is the only place in the lane where a gauge-invariant analytic functional is measured
      against a correct null.

      STEP 7 -- DECISION RULE, FROZEN, WITH THE NULL ARM READ FIRST. Emit OUTCOME I, S or W per (E),
      after emitting the rule''s verdict on arm G treated as if it were a class. If the rule fires
      on that arm, it discriminates nothing and nothing is reported.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - field-side derived pin [0.5, 1.5] sqrt(p) -- a forced value, run first
  - Phi_group = 0 at B = N (baseline slice)
  - arithmetic-progression factor base, must give C ~ sqrt(B) (sensitivity)
  - uniform random subsets of Z/N (reference model, both arms scored against it)
  - gauge orbit, >= 8 draws, interval-reported, with its 2/n rate
  - DL certificates: every (d, Q) re-verified by recomputing [d]P
  - the rule's verdict on the gauge arm, emitted before the class arm's
  - "NULL OBJECT (from the proposal): MANDATORY, FOUR LAYERS. (1) MATCHED NULL FOR THE HEADLINE: the\
    \ GAUGE ORBIT, >= 8 draws per member,\n  reported as an interval with its derived 2/n min-max\
    \ false-positive rate.\n  It is ADMISSIBLE here because the window is not dilation-invariant,\
    \ so its\n  spread is not forced to zero -- and Step 4 verifies that the spread is\n  indeed non-zero\
    \ before the arm is used as a reference.\n(2) REFERENCE MODEL, not a surrogate: uniform random\
    \ subsets of Z/N of size\n  B, whose Phi_group ~ sqrt(B log N). BOTH the real arm and the gauge\
    \ arm\n  are scored against it, per KN-TECH-1a5b7e's move 3, and the asymptotic\n  value is reported\
    \ beside the finite-B empirical null and never used as the\n  test reference.\n(3) DERIVED CONTROL:\
    \ the field-side pin in (B). Its forced value is an\n  INTERVAL, [1/2, 3/2] in units of sqrt(p),\
    \ derived before the run. If the\n  field-side arm sits outside it, the instrument is broken.\n\
    (4) DECAY PARAMETER: B. C(E) = Phi_group/sqrt(B) is normalised so that a\n  random set gives C\
    \ ~ sqrt(log N), roughly constant in B. Therefore the\n  WITHIN-CLASS SPREAD of C must SHRINK\
    \ as B grows if it is sampling noise,\n  and must persist if it is structure. A spread flat in\
    \ B over four values\n  of B is the signature the record is looking for; a spread that grows in\
    \ B\n  is the canonical artifact tell and halts the line.\n(5) FOR THE SECONDARY ARM ONLY: the\
    \ gauge null is MODE-1 for additive energy\n  and for the Fourier multiset (dilation invariance),\
    \ so it is replaced by\n  uniform random subsets of F_p of matched size. This is stated before\
    \ the\n  run, not discovered."
  independent_variables: []
  metrics:
    primary:
    - C(E) and Phi_field(E)/sqrt(p) per (curve, gauge draw, B)
    - full sorted Fourier spectrum, not only its maximum
    - gauge interval per member with n and the derived 2/n rate
    - random-subset reference distribution at matched (N, B)
    secondary:
    - additive energy of X_E per member and its random-subset null
    - within-class spread as a function of B with the fitted trend
    - every instrument-control pass/fail, reported before any headline
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Phi_field(E)/sqrt(p) across every curve measured, in every arm
    formula: MUST lie in [0.5, 1.5] (1 + o(1)) for every curve, by derivation. This is a forced value,
      so observing it is a passed instrument check and NOT evidence about invariance. A violation
      means the transform is wrong.
    source: pre-registered in IDEA-20260807-692e9b before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - WINDOW CONVENTION. "x(Q) < tau" versus "the B smallest x-coordinates" versus the harness's hashed
    build_factor_base give different sets. The convention must be frozen and must match H-PSEUDO's
    for the reproduction check to mean anything.
  - GENERATOR CHOICE. Changing P to [m]P permutes k, so max_k is invariant -- but only if the maximum
    is over ALL k != 0. Any partial-k measurement would be generator-dependent and is prohibited.
  - 'COFACTOR. If #E is not prime, F must be restricted to G and the restricted window has a different
    size on different members. Step 1 avoids this by class selection; if the fallback is used, this
    becomes a live confounder and must be reported.'
  - SMALL N. At p ~ 2^12 the extreme-value spread of C over random subsets is large, so the gauge
    interval will be wide and OUTCOME W becomes likely for instrument reasons rather than mathematical
    ones. N must be reported beside every spread.
  - TRANSPORT. Comparing class members at non-transported instances compares different problems; certificates
    are mandatory.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: MUST lie in [0.5, 1.5] (1 + o(1)) for every curve, by derivation. This is a forced
    value, so observing it is a passed instrument check and NOT evidence about invariance. A violation
    means the transform is wrong.
  falsification_criterion:
  - Phi_field falls outside [0.5, 1.5] sqrt(p) for any curve. The derivation in (B) or the implementation
    is wrong; nothing is reported until resolved.
  - Phi_group != 0 at B = N. Instrument broken.
  - The arithmetic-progression control does not give C ~ sqrt(B). The instrument has no resolution
    and every negative from it is empty.
  - The measured C at p = 1009, 4001 does not reproduce H-PSEUDO's recorded C ~ 3 under the same convention.
    The window conventions differ; the two lines are not comparable and this must be stated before
    any class result.
  - Within-class spread GROWS with B. Artifact tell; halt.
  - OUTCOME S fires. Then H-PSEUDO's constant is class-dependent at toy scale, which bears on a `specified`
    hypothesis of another goal; under GOAL-ENDO-001 pause condition P2's spirit this record must NOT
    transition that hypothesis and must hand the observation to the Coordinator.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-692e9b
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
