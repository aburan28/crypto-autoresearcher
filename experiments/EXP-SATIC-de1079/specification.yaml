# EXP-SATIC-de1079
# Degree-bound count arithmetic. No system is solved.
# Approved by DEC-20261003-8b3d97.
experiment:
  id: EXP-SATIC-de1079
  hypothesis_id: H-SATIC-caef33
  source_idea: IDEA-20260930-c5466b
  question_id: RQ-SATIC-1ae57a
  version: 1
  title: Degree bound versus the rung gap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-8b3d97
  objective: >-
    Check the product 8, the weight sum 5, and the rung gap 1.
  inputs:
    degree_bound: 4
    factor_count: 2
    rung_gap: 1
    degree_product: 8
    weight_sum: 5
    weight_max: 2
    cross_hi: 8
    cross_lo: 8
    cross_product: 64
  controls:
    - >-
      The product of 4, 2, and 1 is 8. Reporting the rung gap as 0
      drops the product to 0 and invalidates the run.
    - >-
      Two times (3 minus 1) is 4. Two to the power (3 minus 2) is 2.
      Five minus 4 is 1. The Hamming weights of 0 through 4 sum to 5
      and their maximum is 2.
    - >-
      The cross of 9/10 against 1/2 is 8. The cross of 1/2 against
      1/10 is 8. Their product is 64.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {degree, weight, cross}
    - route in {product, sum}
  metrics:
    primary:
      - degree_product
      - weight_sum
      - rung_gap
      - implementations_agree
    secondary:
      - weight_max
      - cross_product
      - factor_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The product of 4, 2, and 1 is 8. The Hamming weights of 0
      through 4 sum to 5. Five minus 4 is 1.
    formula: >-
      Multiply 4, 2, and 1. Sum the Hamming weights of 0, 1, 2, 3,
      and 4. Subtract 4 from 5.
    source: >-
      IDEA-20260930-c5466b states the weight 3, the degree 4, the
      rungs 4 and 5, the penalty ceiling 1, and the percents 90, 50,
      and 10, read 2026-10-03. The variable count is not named as an
      integer. The products were recomputed in this design session.
      That computation is not a run. No system was solved.
  scale_relevance:
    tier: toy
    justification: One written degree bound and two written rungs. No transfer to a refutation.
    correspondence: null
  tail_checks:
    - The weight sum 5 and the rung gap 1 are required. A check that stops at the product 8 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 8 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 8.
    - The weight sum is not 5.
    - The rung gap is not 1.
    - The rung gap is reported as 0, or a system is solved.
  success_criterion: >-
    Both runs agree that the product of 4, 2, and 1 is 8, that the
    Hamming weights of 0 through 4 sum to 5, that their maximum is
    2, and that 5 minus 4 is 1.
  falsification_criterion: >-
    The runs agree that the product of 4, 2, and 1 is computed, and
    that product is not 8.
  required_artifacts:
    - experiments/EXP-SATIC-de1079/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SATIC-de1079/runs/<RUN-ID>/command.txt
    - experiments/EXP-SATIC-de1079/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SATIC-de1079/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SATIC-de1079/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SATIC-de1079/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any descent, resultant, or rung measurement.
    - Any claim that a product penalty is at most 1.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
