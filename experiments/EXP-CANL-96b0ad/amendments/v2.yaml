        independent of which twist or which such prime is chosen. STATED
        PLAINLY, PER THIS TASK'S OWN INSTRUCTIONS, RATHER THAN LEFT
        AMBIGUOUS: this drafting session judges Finding C RESOLVED AS A
        BYPRODUCT OF CHANGE B2 for the curves this contract's own
        c2_congruence_ladder_rule_frozen constructs (j=0 curves at
