  changes:
    - id: B1
      field: >-
        inputs.auxiliary_k_rule_frozen (the two-tuple auxiliary-weight
        construction) and controls[10] ("DUAL-AUXILIARY-TUPLE CONSISTENCY
        CHECK"), and the corresponding gating logic inside
        harness/run_canl.py:c1_waterfall / c2_waterfall
        (`dual_aux_tuple_ok`) and invalidation_rules item 3.
      kind: defect_repair_gate_design
      from: >-
        TWO FIXED, LINEARLY-GROWING WEIGHT TUPLES (k_i = i+1 for tuple A,
        k_i = slots+i for tuple B, i = 1..slots-1, target slot weight 1),
        REQUIRED TO PRODUCE THE EXACT SAME reachable-count on every cell, a
        premise CORR-20260810-308774 independently re-verified is
        mathematically false in general (worked example: weights (1,2) vs
        (1,3) over box {-1,0,1} give 7 vs 9 achievable sums) and confirmed
        against this run's own actual disagreeing cell (p=101, C0=1,
        r_Z=2, O-arm weights [2,1] vs [3,1], 7 vs 9) by the independent
        Validator review.
      to: >-
        A TWO-PART REDESIGN. (a) NEW auxiliary_k_rule_v2: for a cell with
        C0 and slot count s (s = r_Z+1 for the Z-baseline arm, s = r_Z//2+1
        for the C1 O-arm and the C2 CM-shell arm), tuple A uses
        base b_A(C0) = 2*C0+1 and tuple B uses base b_B(C0) = 2*C0+2 --
        MIXED-RADIX (balanced positional-number-system) weights,
        k_i = b^i for i = 1..(s-1) (the "first s-1 slots" the frozen rule's
        own text names), target slot weight 1 (=b^0), UNCHANGED shape from
        the frozen rule (still fixed, declared, non-random, still C0-
        dependent only, still leaves the target's own coefficient
        unscaled), only the specific integer VALUES change. This
        construction is C0-DEPENDENT where the v1 rule was not (a
        necessary consequence of making the separation condition hold at
        every tested C0, not an optional embellishment).

        LEMMA (hand-derived in full below, not merely asserted): for any
        base b >= 2*C0+1 and weights w_i = b^{i-1} (i=1..s), the map
        (c_1,...,c_s) |-> sum_i w_i*c_i, c_i in [-C0,C0], is INJECTIVE OVER
        Z -- i.e. exactly (2*C0+1)^s distinct achievable integer sums, the
        full naive combinatorial bound, zero collisions. Proof by
        induction on s. Base case s=1: trivial (w_1=1, the map is the
        identity on [-C0,C0], (2*C0+1)^1 distinct values). Inductive step:
        assume the first s-1 slots (weights w_1..w_{s-1}, all powers of b
        up to b^{s-2}) achieve exactly (2*C0+1)^{s-1} distinct sums, and
        (by the same argument used for `z_baseline_cell`'s own `span`
        computation) this achievable set is contained in the interval
        [-C0*(b^{s-1}-1)/(b-1), C0*(b^{s-1}-1)/(b-1)], which has width
        2*C0*(b^{s-1}-1)/(b-1) <= b^{s-1}-1 < b^{s-1} = w_s (using
        b-1 >= 2*C0, i.e. b >= 2*C0+1, exactly the separation condition).
        So every distinct choice of c_s in [-C0,C0] shifts this ENTIRE
        interval by a MULTIPLE of w_s strictly larger than the interval's
        own width, so the 2*C0+1 shifted copies are pairwise disjoint;
        combined with the s-1 slots' own injectivity, the whole map on s
        slots is injective, with exactly (2*C0+1)*(2*C0+1)^{s-1} =
        (2*C0+1)^s distinct sums. QED. This holds for BOTH b_A=2*C0+1 and
        b_B=2*C0+2 (both satisfy b >= 2*C0+1; the general proof only needs
        the inequality, not equality, so b_B=2*C0+2 is a strictly SAFER
        margin, not merely "also happens to work").

        CONSEQUENCE: wherever a cell has NO MODULAR WRAPAROUND -- which,
        by the SAME algebra (span = 2*C0*sum(all s weights) =
        (2*C0+1)*(b^s-1)/(b-1) = b^s-1 when b=2*C0+1 exactly, so
        no_wraparound (span < N) is EXACTLY EQUIVALENT to
        (2*C0+1)^s <= N, i.e. the naive bound itself already fits under
        the modulus, independent of which specific collision-free weights
        are used) -- tuple A's and tuple B's reachable_count mod N are
        BOTH FORCED to equal (2*C0+1)^s exactly, hence PROVABLY EQUAL TO
        EACH OTHER. This is a provable consequence of the construction, not
        an empirical hope, exactly discharging CORR-20260810-308774's own
        required_action wording.

        HAND-WORKED SMALL EXAMPLE (s=2, C0=1, contrasted directly against
        CORR's own old-weights example): tuple A (base 3) = [3,1]:
        achievable sums over c1,c2 in {-1,0,1} = {-4,-3,-2,-1,0,1,2,3,4},
        9 DISTINCT values = naive bound 3^2=9 (verified by hand,
        enumerated in full: -3-1,-3+0,-3+1,0-1,0+0,0+1,3-1,3+0,3+1 =
        -4,-3,-2,-1,0,1,2,3,4, all distinct). Tuple B (base 4) = [4,1]:
        achievable sums = {-5,-4,-3,-1,0,1,3,4,5}, 9 DISTINCT values =
        naive bound. BOTH equal 9, hence agree with each other -- in
        direct contrast to the OLD weights (1,2)/(1,3), which gave 7 vs 9
        (CORR's own finding, reproduced fresh in
        v2-verification.py Part 1).

        (b) WHERE THE PROVABLE GUARANTEE DOES NOT REACH: cells where
        (2*C0+1)^s > N (wraparound; pigeonhole guarantees SOME mod-N
        collision, and which specific residues collide is not determined
        by this construction alone), AND -- separately -- every cell of
        C2's CM-shell arm regardless of wraparound status (its coefficient
        sets are lambda-images of shell elements, a subset of Z/N with no
        interval structure the mixed-radix proof above needs; the proof's
        premise that the per-slot alphabet is a symmetric integer interval
        [-C0,C0] does not hold there). In BOTH these regimes, the
        cross-tuple "must agree exactly" requirement is DOWNGRADED from a
        blocking invalidation gate to a REPORTED comparison (the existing
        DUAL-AUXILIARY-TUPLE TAIL in tail_checks, unchanged, already
        reports both tuples' counts side by side): a disagreement there is
        no longer, by itself, evidence of a code defect (the mathematical
        premise that made "must agree" a sound requirement does not hold
        in this regime), so it can no longer gate C1_INSTRUMENT_INVALID /
        C2_INSTRUMENT_INVALID on its own. Cell-level correctness in this
        regime instead rests on change B3's spot-check (now actually
        wired in, per Finding B) -- this is the Validator's own suggested
        alternative (b) from their report ("each tuple's own count must
        match its own closed-form prediction" / the equivalent
        spot-check-based check), adopted here specifically for the regime
        where alternative (a)'s provable guarantee does not extend, rather
        than in place of it.
      rationale: >-
        This is a STRICT IMPROVEMENT in the regime where the guarantee
        holds (a genuine proof replaces an empirical hope, exactly what
        CORR-20260810-308774 asked for) and an HONEST NARROWING, not a
        silent one, in the regime where no two-tuple construction can give
        a provable guarantee at all (pigeonhole is pigeonhole; no choice
        of weights avoids it once the naive bound exceeds N, or once the
        alphabet is not an interval). Both regimes are DISCLOSED, not
        assumed: v2-verification.py Part 2 computes exactly which of the
        grid's (C0, s, N) cells fall in each regime (see
        `verification_status` below for hand-computed highlights -- e.g.
        the Z-baseline arm's largest cell, C0=8/r_Z=4/s=5, wraps around
        even at the LARGEST main-ladder prime, 1000003, since
        17^5=1419857 > 1000003).
      design_decision_flagged_for_coordinator_review: >-
        DOWNGRADING the dual-tuple check to a reported (non-gating)
        comparison in the wraparound / CM-shell regime is a genuine design
        choice with an alternative this drafting session did not adopt:
        the frozen contract's OWN text could instead be read to require
        that a v2 run simply REPORT more wraparound/shell cells as
        untestable-by-this-check (rather than downgrading the check's own
        gating role), forcing evidence_strength_calibration_frozen's
        `preliminary` cap to apply more broadly. This drafting session
        judged the downgrade-to-reported-comparison-plus-spot-check
        reading more useful (it keeps a real, executed defect-detection
        mechanism in every regime, per change B3, rather than merely
        disclaiming coverage) and consistent with the Validator's own
        suggested alternative (b), but this is exactly the kind of
        threshold-design choice AGENTS.md reserves for the approving
        Coordinator, not this drafting session, to confirm.
    - id: B2
      field: >-
        C2's Stage D (harness/run_canl.py:run_c2, lines 889-914, the
        reachable_residue_gain computation P8 that C2_SUPPORTED /
        C2_GAIN_ABSENT / C2_TAUTOLOGY_TOTAL / C2_GAIN_EXCESSIVE all key
        on) and its supporting per-cell calls to
        harness/exp_canl.py:shell_enumerate / lambda_reduce /
        c2_nonunit_lambda / c2_shell_lambda_images.
      kind: defect_repair_mechanism_fidelity
      from: >-
        Every f_E / D_E used in Stage D's shell_enumerate / lambda_reduce
        calls is `curve["D_E"]` / `curve["f_E"]`, computed EXCLUSIVELY from
        harness/isogeny_class.py:frobenius_discriminant(p,t) = t*t-4*p,
        i.e. disc(Z[pi]) -- the discriminant of the order generated by
        FROBENIUS ALONE. At the four realized c2-congruence curves
        (p=1009: t=62, D_E=-192, f_E=8; p=10009: t=182, D_E=-6912, f_E=48;
        p=100003: t=632, D_E=-588, f_E=14; p=1000003: t=2000, D_E=-12,
        f_E=2 -- all copied verbatim from RUN-CANL-78b8bd's own committed
        c2-measurements.json, not re-measured), NONE has f_E=1, and the
        original execution report and CORR-20260810-308774 both framed
        this as a fact about which primes/twists the frozen ladder happens
        to select.
      to: >-
        HAND-RE-DERIVED FROM SCRATCH, INDEPENDENTLY OF CORR-20260810-685434's
        OWN TEXT (not merely restated), before being adopted: for a j=0
        curve y^2=x^3+A at p = 1 (mod 3), the map sigma: (x,y) -> (mu*x,y),
        mu^3=1 in F_p, satisfies (mu*x)^3+A = mu^3*x^3+A = x^3+A identically
        in A -- so sigma is an F_p-RATIONAL AUTOMORPHISM of the curve, for
        EVERY sextic twist A, requiring no field extension. Viewed as an
        endomorphism, sigma has order 3 as a group automorphism, so
        Z[sigma] subset End_{F_p}(E) is a subring satisfying the minimal
        polynomial x^2+x+1=0 (the defining equation of a primitive cube
        root of unity) -- this is EXACTLY the object
        harness/isogeny_class.py:cm_eigenvalues(p,N,-3) computes and
        H-CANL-e59a06's own `assumptions` block already states as
        "verified constructively," and it is exactly what G3's tautology
        gate (P + sigma*P + sigma^2*P = O, 100% over 4000 sampled points
        across all 4 primes, 12 independently-re-verified certificates)
        CONSTRUCTIVELY CONFIRMS: sigma genuinely satisfies that minimal
        polynomial on the curve's own group law, not merely as an abstract
        automorphism of the variety. disc(x^2+x+1) = 1-4 = -3, a FUNDAMENTAL
        discriminant (Q(sqrt(-3))'s ring of integers is generated by a
        primitive cube root of unity over Z; -3 is squarefree up to the
        standard D=0,1 mod 4 convention and admits no further index-2
        refinement), so Z[sigma] IS ALREADY the maximal order O_K of
        Q(sqrt(-3)). Since every order in a number field is contained in
        the (unique) maximal order, and Z[sigma] subset End_{F_p}(E)
        subset O_K subset O_K, the containment O_K subset End_{F_p}(E)
        subset O_K forces End_{F_p}(E) = O_K EXACTLY -- f_E := the
        conductor of End_{F_p}(E) (not of Z[pi]) is FORCED to 1,
        UNCONDITIONALLY, for every twist A and every p = 1 (mod 3), by an
        argument that never touches Z[pi]'s own conductor at all. (This is
        the SAME conclusion CORR-20260810-685434 Finding A and the
        independent Validator/Red Team reviews reached; re-derived here
        from scratch as this task's own instructions require, not
        transcribed.) The IDENTICAL argument, by the same steps, forces
        f_E=1 for j=1728 curves at p = 1 (mod 4) via
        sigma': (x,y)->(-x,i*y), i^2=-1, disc(x^2+1)=-4, also fundamental.

        WHAT MUST NOT BE DONE (a genuinely new finding of this drafting
        session, going beyond both prior reviews' analysis, and hand-
        verified below): naively substituting f=1 directly into the
        EXISTING harness/exp_canl.py:lambda_of_w(D_E, t, f, N) formula
        (as both the Validator's own "required control" wording and the
        Red Team's Hunt 1 "cheap ... few lines of code" framing suggest)
        is MATHEMATICALLY WRONG, not merely an approximation. That
        formula's derivation (see its own docstring) is only valid when
        the order being tested and Z[pi]'s own expression coincide -- it
        implicitly assumes pi = (t + f*sqrt(D0))/2 with the SAME f passed
        in, i.e. that f IS Z[pi]'s conductor. Substituting f:=1 there
        silently asserts pi = (t+sqrt(D0))/2, WHICH IS FALSE for these
        curves (their true relation is pi = (t + f_pi*sqrt(D0))/2 with
        f_pi in {8,48,14,2} respectively -- a fixed structural fact about
        how Frobenius itself embeds relative to sqrt(D0), NOT a free
        parameter). HAND-VERIFIED, p=1009 (t=62, f_pi=8, D0=-3, N=1009):
        naive substitution lambda_of_w(D_E=-3, t=62, f=1, N=1009) =
        (-3+2-62)*inverse(2) mod 1009 = (-63 mod 1009)*505 mod 1009 = 473.
        CORRECTLY-DERIVED value (below) = 247. These DISAGREE (473 != 247)
        -- the naive substitution is not merely unproven, it is
        demonstrably a DIFFERENT number from the mathematically correct
        one, at the very first curve checked.

        CORRECTED FORMULA (hand-derived in full, reproduced in
        v2-verification.py Part 3): pi, expressed in the MAXIMAL order's
        OWN basis {1, w0}, w0 := (D0+sqrt(D0))/2, is pi = A + f_pi*w0
        where A := (t - f_pi*D0)/2 (an integer, since pi is an algebraic
        integer and {1,w0} is a Z-basis of O_K -- checked, not assumed,
        for p=1009: A = (62-8*(-3))/2 = 86/2 = 43, matching an independent
        by-hand check that pi = 31+4*sqrt(-3) = 43+8*w0 exactly).
        lambda(pi) = 1 (the SAME fixed-eigenspace convention, unchanged)
        gives A + f_pi*lambda(w0) = 1 (mod N), i.e.
        lambda(w0) = (1-A) * inverse(f_pi) (mod N) -- requiring
        gcd(f_pi, N) = 1 (the SAME precondition the old formula already
        required, now correctly stated in terms of f_pi, which is trivially
        satisfied here: f_pi in {8,48,14,2}, N in {1009,10009,100003,1000003},
        no shared factors since N is prime and vastly larger than f_pi).
        HAND-VERIFIED, p=1009: inverse(8) mod 1009 = 883 (since
        8*883=7064=7*1009+1). lambda(w0) = (1-43 mod 1009)*883 mod 1009 =
        967*883 mod 1009 = 853861 mod 1009 = 247. NONZERO mod 1009 -- a
        genuine, non-tautological reduced coefficient, consistent with
        HEUR-CANL-S1's own requirement.

        Stage D's shell_enumerate calls change from
        `shell_enumerate(curve["D_E"], C0, curve["D0"], curve["f_E"])` to
        `shell_enumerate(D0, C0, D0, 1)` (the maximal order's OWN
        discriminant used directly for both the norm form and the unit
        classification -- this substitution, unlike the lambda one above,
        IS straightforwardly correct, since shell_enumerate has no
        pi-relationship baked into its own derivation, only "which order's
        norm form to use"). lambda_reduce calls change to use the NEW
        `lambda_of_w0_maximal_order(D0, t, f_pi, N)` in place of
        `lambda_of_w(D_E, t, f, N)`, with f_pi := the curve's own realized
        `f_E` (Z[pi]'s conductor, UNCHANGED, still computed the same way,
        just relabelled for clarity so it is never again silently read as
        "the order's own conductor").

        APPLICABILITY GUARD (must be checked, not assumed, at runtime):
        this substitution applies ONLY when p = 1 (mod 3) and the curve
        genuinely has j=0 (asserted, not merely constructed-and-hoped, via
        harness/isogeny_class.py:j_invariant(p,a,b) == 0), or p = 1 (mod 4)
        with j=1728. Both hold by construction for every curve
        c2_congruence_curve builds (y^2=x^3+1 at a p=1(mod 3) prime), but
        the guard must be an explicit runtime assertion, per this
        amendment's own discipline of never silently assuming a premise
        that happens to hold today.
      rationale: >-
        Discharges CORR-20260810-685434 Finding A while correcting a
        SPECIFIC, concrete implementation error (the naive f=1
        substitution) that this drafting session found by attempting the
        "cheap required control" both prior reviews suggested and
        discovering it does not actually give the right answer. This is
        exactly the kind of independent re-derivation this task's own
        instructions require rather than "taking the corrections' word for
        it" -- and it changes what change B2 actually specifies (a new
        function, not a parameter substitution into an old one).
      what_this_does_not_certify: >-
        This re-derivation is a from-scratch mathematical argument,
        cross-checked against H-CANL-e59a06's own "verified constructively"
        assumption and RUN-CANL-78b8bd's own passing G3 gate (both already
        independently confirmed by two separate reviews), plus one
        concrete numeric worked example (p=1009). It is NOT an
        independent from-scratch computation of End_{F_p}(E) via an
        explicit isogeny or division-polynomial method for all four
        curves (CORR-20260810-685434's own required_action item 2 names
        this as the stronger, not-yet-performed check: "an explicit
        isogeny or division-polynomial check that mu genuinely generates
        an index-1 suborder"). That stronger check remains open and is
        NOT authorized or performed by this amendment; it is named here as
        a candidate for a future, separate verification task if the
        approving Coordinator judges the automorphism argument (now
        independently re-derived three times -- by CORR-20260810-685434's
        own drafting Coordinator, by the Red Team, and by this drafting
        session) insufficiently certain on its own.
    - id: B3
      field: >-
        certificate_semantics (c) (the 1% independent reachable-count
        spot-check) and its wiring into harness/run_canl.py.
      kind: defect_repair_missing_wiring
      from: >-
        harness/exp_canl.py:spot_check_reachable is defined, exported in
        __all__, and documented as satisfying the frozen contract's own
        BLOCKING certificate_semantics (c) requirement, but is never
        called anywhere in harness/run_canl.py (confirmed independently by
        the Validator report via direct grep of the committed file). Every
        one of the 180 exact reachable-count cells in RUN-CANL-78b8bd (100
        C1 + 80 C2) went unspot-checked, and the execution report's own
        completion-gate checklist conflated this with the (genuinely
        executed) tautology-certificate re-verification, a different check
        on a different quantity.
      to: >-
        `spot_check_reachable` MUST be called once per cell, immediately
        after every `reachable_residue_count` call in
        `z_baseline_cell`, `o_arm_cell`, and C2 Stage D's per-cell loop
        (harness/run_canl.py lines ~508-534, ~617-634, ~889-914
        respectively, per the v1 line numbers the Validator report cites --
        the Executor implementing this change must re-locate the exact
        lines against whatever version of the file it is editing, since
        change B1/B2 above also touch nearby code). Sample size: per the
        contract's own literal text ("a random 1% sample of the enumerated
        residues"), `max(5, round(0.01 * reachable_count))` freshly-drawn
        coefficient tuples per cell, using a DECLARED seed derived
        deterministically from (prime, C0, r_Z, aux_tuple_label) so the
        spot-check itself is reproducible (not re-randomized on every
        run). A spot-check disagreement on any cell makes that specific
        cell INVALID (per the already-frozen invalidation_rules text,
