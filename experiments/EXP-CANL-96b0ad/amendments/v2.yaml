  reason: >-
    CORR-20260810-308774 (the auxiliary_k_rule_frozen construction assumes
    two differently-fixed integer-weight tuples give identical
    reachable-count sums; false in general, independently re-confirmed by
    that correction via direct enumeration) and CORR-20260810-685434
    (independent Validator + Red Team review of RUN-CANL-78b8bd, widening
    the required v2 scope to four additional findings: A, the f_E=1
    conductor-conflation artifact; B, the never-invoked certificate
