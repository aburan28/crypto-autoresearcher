        REQUIRED RUNTIME CHECK (must be checked, not assumed, even though
        this drafting session believes it will pass): the run driver MUST
        explicitly compute and assert `f_E == 1` (via the SAME
        automorphism-forced argument, i.e. checking p mod 3 == 1 and
        j == 0 for D0=-3 curves) for every C2-congruence curve BEFORE
        using `s = r_Z//2+1` for that curve's Stage D cells. If this
        assertion ever fails for a curve this contract's ladder rule
        constructs in the future (e.g. under a different, not-yet-used
        c2_congruence_ladder_rule extension), the corresponding cells MUST
        be flagged `PROJECTIVITY_UNVERIFIED` and excluded from
        `reachable_residue_gain` reporting rather than silently computed
        with an unjustified slot count -- this is the honest fallback
        Finding C's own text names for the case the byproduct resolution
        does NOT hold.
      rationale: >-
        Directly answers this task's own instruction to state plainly
        whether Finding C is resolved or remains open, rather than
        assuming the byproduct resolution without checking. It IS resolved
        for the specific curves this contract constructs, conditional on
