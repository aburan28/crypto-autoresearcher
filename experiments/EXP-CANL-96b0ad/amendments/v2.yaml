    - id: B5
      field: >-
        frozen_decision_rule (the C1 and C2 waterfalls) and
        evidence_strength_calibration_frozen -- the D1
        one-run-for-the-whole-grid aggregation design
        (harness/run_canl.py:full_run, c1_waterfall, c2_waterfall).
      kind: defect_repair_gate_design
      from: >-
        `c1_waterfall` and `c2_waterfall` each compute ONE aggregate
        terminal state pooling ALL cells across ALL primes (`max(...)`,
        `any(...)` over every (prime, C0, r_Z, aux_tuple) combination).
        `evidence_strength_calibration_frozen`'s own text presupposes a
        PER-PRIME predicate ("at least 4 of 5 main-ladder primes... the
        dissenting prime/seed must be named" for `preliminary` strength)
        that the current aggregate design cannot express: a single
        anomalous cell at one prime either silently gets absorbed into a
        false full-agreement `*_SUPPORTED` claim, or flips the ENTIRE run
        to the most escalatory state available
        (`C1_REFUTED_REOPEN`/`C2_GAIN_EXCESSIVE`, triggering SR8) with no
        path to "4/5 agree, one dissenting prime named." Both independent
        reviews (Validator section 9, Red Team Hunt 3) found this
        independently and agree it did not affect RUN-CANL-78b8bd's own
        (uniform, prime-independent) dual-tuple-bug outcome but WILL
        matter the moment a future run reaches a genuine, prime-specific
        disagreement.
      to: >-
        FUNCTIONAL SPECIFICATION (the exact code restructuring is
        Executor implementation work this Coordinator subagent does not
        write, per AGENTS.md's own division of authority -- this is a
        requirements change, not a patch). `c1_waterfall` must be
        evaluated ONCE PER main-ladder prime, restricted to that prime's
        own cells, yielding a per-prime state in
        {C1_INSTRUMENT_INVALID, C1_SLOPE_ANOMALY, C1_REFUTED_REOPEN,
        C1_SUPPORTED} (the SAME four states, unchanged); `c2_waterfall`
        likewise per c2-congruence-ladder prime, restricted to that
        prime's own cells, yielding the SAME five existing states. The
        null-object-control / positive-control components of
        C1_INSTRUMENT_INVALID's `fires_when` (which are GLOBAL CTRL
        quantities, not per-C1-prime) stay evaluated once, globally, and
        gate every prime's C1 waterfall identically -- only the
        dual-aux-tuple / slope / reachable-count-ratio components become
        per-prime. A NEW required artifact,
        `decision-rule-evaluation.json`'s existing structure extended with
        `c1_verdict_by_prime: {prime: state}` and
        `c2_verdict_by_prime: {prime: state}`, records every per-prime
        state explicitly. The AGGREGATE terminal state reported at the top
        level is then a DECLARED, FROZEN function of that table (fixed in
        THIS amendment's text, before any run exists, per SR7 "no outcome
        shopping"):
          - C1: if ANY prime reaches C1_REFUTED_REOPEN, the aggregate is
            C1_REFUTED_REOPEN regardless of the other primes (a single
            genuine reopening finding is NOT diluted by majority vote --
            SR8's escalation trigger is preserved exactly as frozen).
          - Else, if >=4 of 5 primes reach C1_SUPPORTED, aggregate =
            "C1_SUPPORTED (replicated)"; if exactly 3 of 5 do (a genuine
            majority short of the frozen 4/5 bar), aggregate =
            "C1_SUPPORTED (preliminary, dissenting prime(s) named:
            [list])"; fewer than 3 of 5 reaching C1_SUPPORTED does not
            support an aggregate C1_SUPPORTED claim at any strength.
          - Else if all non-instrument-invalid primes agree on
            C1_SLOPE_ANOMALY or C1_INSTRUMENT_INVALID, aggregate reflects
            that state; a genuine prime-level split between
            C1_INSTRUMENT_INVALID and a substantive state is reported as
            "MIXED, per-prime table required reading" rather than
            collapsed to either extreme.
        C2's rollup is the SAME shape at the frozen 2-of-4 bar for
        `preliminary` / a to-be-declared bar for `replicated` (the frozen
        contract's own `evidence_strength_calibration_frozen` text does
        not state a C2-specific replicated bar beyond "all three seeds
        and 4 of 5 primes" applying to BOTH regimes jointly when both
        reach a verdict -- this amendment does not invent a new C2-only
        threshold, it operationalizes the existing text's own 4/5 language
        applied to C2's 4-prime ladder as "all 4").
      design_decision_flagged_for_coordinator_review: >-
        The EXACT majority thresholds above (4/5, 3/5 for `preliminary`
        C1; the C2 rollup's own bar) are this drafting session's own
        reading of `evidence_strength_calibration_frozen`'s prose into a
        computable rule -- the frozen text itself only fixes the
        `replicated` bar (4/5) and the general shape of `preliminary`
        ("caps... and the dissenting prime/seed must be named"), not an
        exact minimum for `preliminary` to apply at all (is 2/5 also
        `preliminary`, or does it become something weaker?). This
        drafting session chose 3/5 as the `preliminary` floor because it
        is the smallest majority, but this is a genuine threshold choice
        the approving Coordinator should confirm or revise, not something
        this amendment can claim is uniquely forced by the frozen text.
      rationale: >-
        Discharges CORR-20260810-685434 Finding D exactly as both
        independent reviews recommended (Validator: "make the aggregate
        terminal state a documented function of that table"; Red Team:
        "restructure... or at minimum add a per-prime pass/fail table...
        so replicated vs preliminary strength is a computed property").
        This is real, nontrivial Executor implementation work (a genuine
        rewrite of two waterfall functions and the top-level orchestration
        in `full_run`), not a small patch, and the Executor dispatched
        under this amendment should scope and budget it explicitly rather
        than treat it as incidental to changes B1-B3.
    - id: B6
      field: >-
        C2's shell-count 15% relative-error tolerance (P5,
        `shell_diagnostics.within_15pct_for_C0_ge_5`) and the C0=1
        threshold-sensitivity check
        (`c2_waterfall`'s `threshold_sensitive` component).
      kind: partial_defect_repair_and_explicit_deferral
      from: >-
        A flat 15% relative-error tolerance applied uniformly across all
        13 class-number-one discriminants and all C_0 >= 5 (unjustified in
        the frozen contract -- traced by the Red Team to
        IDEA-20260807-11b93d's own bare `minimum_effect` field, no
        derivation of the shell-count formula's own disclosed
        O(C0*|D_E|^{-1/4}+1) error term's implied constant), which both
        independent reviews confirmed fails at exactly the two
        largest-magnitude discriminants (D_E=-67 at C0=5, 19.85% error;
        D_E=-163 at C0=8, 17.47% error) for a STRUCTURAL reason (relative
        error is guaranteed to spike where the leading term
        2*pi*C0^2/sqrt(|D_E|) is itself small, independent of any real CM
        effect). Separately, the threshold-sensitivity check is
        DEGENERATE at C0=1 for every one of the 13 class-number-one
        discriminants (independently re-confirmed by the Validator: the
        minimum nonzero non-unit norm in any of these orders is
        provably >= 2, so the nonunit shell at C0=1 is FORCED to be
        exactly {(0,0)} regardless of any real threshold-sensitivity
        signal).
      to: >-
        TWO SEPARATE TREATMENTS, deliberately not resolved with the same
        confidence. (i) C0=1 EXCLUSION -- RESOLVED, adopted with full
        confidence: the C0=1 row is EXCLUDED from the threshold-sensitivity
        hard gate's own `fires_when` clause (report it instead as a
        DEGENERATE-CELL tail check entry, which `tail_checks` already has
        a slot for). This is unconditionally safe: both reviews
        independently confirmed the C0=1 degeneracy is discriminant-
        independent and provable from the order structure alone, not an
        artifact of any specific run's data, so removing it from the hard
        gate cannot hide a real signal at any discriminant. (ii) THE 15%
        TOLERANCE ITSELF -- EXPLICITLY DEFERRED, NOT RESOLVED, because
        this drafting session lacks the full per-cell shell-count grid
        (only the two failing cells' concrete numbers and aggregate
        relative-error statistics are available from the two review
        reports; the complete 65-cell C0>=5 grid's raw observed counts are
        not reproduced in either report or in this session's own reach
        without Bash access to re-run `shell_enumerate`). Red Team's own
        estimate of an absolute-error constant (c in roughly [1.4, 1.7]
        from the two known failing cells) suggests an absolute bound
        `|observed-predicted| <= c*(C0*|D_E|^{-1/4}+1)` at c=2 would admit
        both currently-failing cells -- HAND-VERIFIED here: D_E=-67,C0=5:
        predicted=19.19, observed=23, |diff|=3.81 <= 2*(5*67^-0.25+1) =
        2*2.747 = 5.49 (passes); D_E=-163,C0=8: predicted=31.49,
        observed~=37.0, |diff|~=5.51 <= 2*(8*163^-0.25+1) = 2*3.239 = 6.48
        (passes) -- BUT switching wholesale to an absolute bound is NOT
        adopted here because it would be STRICTER than the current 15%
        relative check at LARGE C0 (e.g. C0=20, D_E=-163: 15% of the
        ~1968.5 predicted count allows deviations up to ~295, while the
        c=2 absolute bound only allows ~13.2), and this drafting session
        has no data confirming the actual observed shell counts at large
        C0 stay within that materially tighter bound -- adopting it
        without that data risks introducing a NEW, unverified invalidation
        at cells that currently pass, which this amendment's own
        discipline (verify before relying, per this task's own
        instructions) forbids. The 15% relative tolerance therefore STAYS
        UNCHANGED as the gating criterion for now.
      required_diagnostic_before_any_future_tightening: >-
        A future amendment revisiting the 15% tolerance must first have
        the Executor report the FULL C0_grid_shell_diagnostic_only x
        class_number_one_discriminants_frozen grid's raw observed shell
        counts (not merely pass/fail against 15%) as a required diagnostic
        artifact, so an absolute-bound replacement can be checked for
        no-regression across the WHOLE grid the way change B1's
        mixed-radix construction was checked across its whole grid in this
        amendment (v2-verification.py Part 1/2) -- not merely against the
        two currently-known failing cells.
      rationale: >-
        Directly answers CORR-20260810-308774's own required_action item 2
        ("independently assess... not necessarily fix in the same way")
        and both reviews' recommendation to revisit these findings, while
        being honest that a full fix needs data this drafting session does
        not have -- matching this campaign's own precedent for partial,
        disclosed improvements (EXP-ICINV-4d33aa amendment v4's own "does
        not fully close the gap... named as a candidate for a future
        version" pattern) rather than either ignoring the finding or
        overclaiming a fix beyond what is actually verified.
