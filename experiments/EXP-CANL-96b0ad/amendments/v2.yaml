        gate is downgraded to a reported comparison, this spot-check
        becomes the cell's ONLY executed collision/defect-detection
        mechanism, so wiring it in is a precondition for change B1's own
        soundness, not an independent nice-to-have.
    - id: B4
      field: >-
        H-CANL-e59a06's own STEP 1 open assumption (r_Z = 2*r_O
        automatic for maximal O, open for non-maximal O) as it bears on
        C2's Stage D hard-coded `s = r_Z // 2 + 1` slot count
        (harness/run_canl.py line 623, `o_arm_cell`, and the analogous
        Stage D slot-count computation in `run_c2`).
      kind: addition
      from: (absent -- Stage D silently assumed the halved slot count applies)
      to: >-
        Once change B2's fix is applied, EVERY realized C2-congruence
        curve has f_E=1 (the maximal order) BY THE SAME UNCONDITIONAL
        ARGUMENT change B2 re-derives -- not merely "expected to" or
        "as a byproduct that might or might not hold." Per H-CANL-e59a06's
        own STEP 1 text ("automatic for maximal O"), this DOES resolve
        Finding C for these specific curves: r_Z = 2*r_O is the automatic,
        Dedekind-domain case whenever f_E=1, which change B2 forces
