        run-level boolean, so a reviewer can see which specific cells
        cleared it.
      rationale: >-
        Discharges CORR-20260810-685434 Finding B directly; no design
        choice is involved (the function already exists and is already
        specified by the frozen contract -- this is purely a wiring
        defect). Also directly SUPPORTS change B1's own design: in the
