experiment:
  id: EXP-ASCON-7f675e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b03a6f; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b03a6f
  question_id: RQ-ASCON-2dfd8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Calibrate a dependency-signature adjudicator for specification-delta transfer by measuring
    its escape-from-UNDETERMINED rate against cardinality-matched null signatures and its rejection
    rate against malformed evidence chains
  objective: 'The single uncertainty a run reduces is whether the proposed adjudication function carries
    information about dependency MODALITY or merely responds to the SIZE of the sets it is given.
    Concretely: (i) does the escape-from-UNDETERMINED rate on structured synthetic signatures exceed
    the rate on cardinality-matched uniform-random signatures by a margin large enough to be worth
    building a table on, with both arms produced by the same code in the same invocation; (ii) is
    the composition rule actually the absorbing fold it is specified to be, tested by re-adjudicating
    every synthetic cell under randomly permuted delta orderings and counting verdict changes, where
    any nonzero count is a defect and not a finding; (iii) does the cell validator in fact refuse
    every cell that asserts a verdict without a complete feature-modality-delta-pointer chain, tested
    against a hand-built fixture set of malformed cells. Nothing in this run touches Ascon, any permutation,
    or any published result. The run''s product is a calibrated or a discarded instrument, plus the
    reported UNDETERMINED fraction under realistic multi-feature deltas, which is pre-committed as
    an expectation that the honest table is mostly undetermined.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: over a declared synthetic
      population, this adjudication function resolved structured signatures at rate X and cardinality-matched
      null signatures at rate Y, was order-insensitive, and rejected Z of the malformed fixtures.
      WHAT DOES NOT FOLLOW: nothing about Ascon, nothing about SP 800-232, nothing about any published
      result''s transfer status, nothing about the completeness or correctness of the feature basis
      on real inputs, and nothing whatsoever about the security of any construction. A calibrated
      instrument is a licence to build a table, not a table.'
  inputs:
    procedure: 'STAGE 0 (minutes): freeze the feature basis, the four modalities, the adjudication
      table and the cell schema as a checked-in specification file; hash it into the run manifest.
      STAGE 1 (about a day of implementation): implement signature type, delta type, adjudication
      fold, and cell validator in pure Python with no cryptographic dependency. STAGE 2 (hours): implement
      the two synthetic generators, structured and null, sharing one seeded RNG and one cardinality-matching
      routine, and emit the generator-independence inspection report. STAGE 3 (minutes of CPU): adjudicate
      10000 matched pairs, recording per-arm resolution rates, per-coordinate verdict histograms and
      cardinality distributions. STAGE 4 (minutes): re-adjudicate every cell under three random delta
      orderings and count verdict changes. STAGE 5 (hours of authoring, minutes of CPU): build 40
      malformed cell fixtures by hand, run the validator, record the rejection rate. STAGE 6 (minutes):
      bootstrap confidence intervals, write the run record through the standard manifest path with
      seeds and the frozen-specification hash.'
    instrument: Python 3.11 standard library plus numpy for the bootstrap; PyYAML for the cell schema;
      pytest for the fixture suite; harness/runner.py for the run manifest, seed recording and the
      inference block. No SAT solver, no computer algebra system, no Sage, no network access and no
      cryptographic library, because this experiment computes over synthetic label vectors only.
    parameters: Feature basis size 8 to 12 coordinates (declared before the run and frozen). Four
      modality labels. Delta sets of size 1 to 6 coordinates, with the realistic arm fixed at 4 or
      more. Synthetic population 10000 matched pairs, plus a 1000-pair pilot at a different seed to
      confirm stability. Three delta orderings per cell for the order control. 40 malformed fixtures
      across five defect classes. Bootstrap 2000 resamples. Two independent master seeds recorded
      in the manifest.
  controls:
  - 'Null-signature arm: uniform random signatures, cardinality-matched, same generator code path,
    same invocation, same adjudication function.'
  - 'Null-delta arm: uniform random delta sets applied to the structured signatures, isolating whether
    resolution comes from the delta structure or the signature structure.'
  - 'Fold-order permutation control: every cell adjudicated under three random orderings of the delta
    coordinates; any disagreement is a defect, not a result.'
  - 'Malformed-cell fixture set: 40 hand-built cells with missing feature names, missing modality
    labels, missing specification pointers, or verdicts inconsistent with their edges.'
  - 'Generator-independence check: the structured generator inspected and reported for correlations
    that would encode the adjudicator''s decision boundary, with the inspection output attached to
    the run record.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical adjudication function is run over NULL SIGNATURES: vectors
    drawn uniformly at random over the same basis with cardinality distribution matched to the structured
    arm, generated by the same code path and adjudicated by the same function in the same invocation,
    and against DELTA SETS likewise drawn uniformly. For the signal arm to mean anything the null
    arm must show a MATERIALLY LOWER escape-from-UNDETERMINED rate: if random signatures resolve as
    often as structured ones, the function is deciding on the number of coordinates touched rather
    than on the modality labels, and no populated table it produces would carry information. The prespecified
    reading is that a null resolution rate within the structured arm confidence interval is a controlled
    null and refutes the tool, not the target.'
  independent_variables:
  - arm (structured signature population versus cardinality-matched null population)
  - delta-set cardinality, swept from 1 to 6
  - delta ordering (three random permutations per cell)
  - feature-basis size, at the two frozen values 8 and 12
  metrics:
    primary:
    - escape-from-UNDETERMINED rate per arm, with 95 percent bootstrap interval
    - structured-minus-null resolution-rate difference
    - count of cells whose verdict changes under delta reordering
    - validator rejection rate on the malformed fixture set
    secondary:
    - per-coordinate verdict histogram per arm
    - signature cardinality distributions demonstrating the match held
    - UNDETERMINED fraction as a function of delta-set cardinality
    - pilot-versus-main seed agreement on the headline difference
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The difference D between the structured arm's escape-from-UNDETERMINED rate and the
      cardinality-matched null arm's rate, at delta-set cardinality 4.
    formula: D = P(verdict is not UNDETERMINED | structured signature, |delta| = 4) minus P(verdict
      is not UNDETERMINED | null signature, |delta| = 4), each probability estimated as the sample
      proportion over 10000 matched pairs. Predicted D at least 0.20 with a 95 percent bootstrap interval
      excluding 0.10. A measured D below 0.20 sends the adjudicator back to design; a D whose interval
      covers 0 refutes the instrument outright.
    source: Pre-registered in the parent proposal IDEA-20260816-b03a6f before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are entirely synthetic: 10000 label vectors over an 8-to-12
      coordinate basis, with no cryptographic object present. The extrapolation assumption is explicit
      and weak -- that an adjudicator which cannot beat a null on synthetic signatures also cannot
      be trusted on real ones. The converse does NOT transfer: beating the null here provides no evidence
      that real published results have dependency patterns resembling the structured generator, and
      the run record must state that in those words.'
    correspondence: null
  tail_checks:
  - Behaviour at delta-set cardinality equal to the full basis, where every cell should return UNDETERMINED
    and any resolved cell is a bug.
  - Behaviour at delta-set cardinality zero, where every cell should return PRESERVED and any UNDETERMINED
    is a bug.
  - Signatures with all coordinates labelled independent, which must resolve to PRESERVED under every
    delta.
  - Signatures with all coordinates labelled reads-position under a pure position delta, which must
    return BROKEN-UNLESS-WITNESSED and never PRESERVED.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at 10000 matched pairs regardless of the observed difference; no adaptive extension of the
    sample after seeing the headline number.
  - Halt and report an instrument defect immediately if any tail check fails, before computing the
    headline difference.
  - Halt if the generator-independence inspection reports any correlation between generated labels
    and the adjudication table's decision boundary.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The structured-minus-null resolution difference D at delta cardinality 4 is at
    least 0.20 with a 95 percent bootstrap interval excluding 0.10, order sensitivity is exactly zero,
    all four tail checks pass, and the validator rejects all 40 malformed fixtures.
  falsification_criterion:
  - D's bootstrap interval covers zero, making the adjudicator indistinguishable from a shape-driven
    function.
  - Any cell changes verdict under delta reordering.
  - Any malformed fixture is accepted by the validator.
  - Any of the four tail checks fails.
  - The generator-independence inspection finds the structured generator encoding the adjudication
    table.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b03a6f
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - 'The feature basis itself is not yet written: a Coordinator must decide whether it is derived
    only from specification structure and who checks that no attack-specific vocabulary entered it.'
  - The structured generative model has no principled source in this environment, since real dependency
    patterns cannot be observed here; the Coordinator must decide whether a self-authored generator
    is acceptable as the signal arm or whether the experiment reduces to the null-and-tail-checks
    only.
  - The threshold 0.20 is a judgement call with no empirical anchor and needs Coordinator ratification
    before the run, not after.
  - Whether this instrument may be filed at all before SP 800-232 and the submission specification
    are filed as KN-LIT entries, given the RQ constraint that no experiment may be designed until
    both documents are filed -- the Coordinator must rule on whether an instrument-calibration run
    with no Ascon content falls inside or outside that constraint.
