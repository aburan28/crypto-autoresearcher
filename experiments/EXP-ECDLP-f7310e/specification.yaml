# EXP-ECDLP-f7310e
# Trivial-direction cancellation. No deformation.
# Approved by DEC-20261002-1d8cf8.
experiment:
  id: EXP-ECDLP-f7310e
  hypothesis_id: H-ECDLP-cf422c
  source_idea: IDEA-20260930-8e3b75
  question_id: RQ-ECDLP-c1b7b1
  version: 1
  title: Trivial-direction cancellation on two points
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-1d8cf8
  objective: >-
    Check the identity gaps 30 and 195, and the reference crosses
    26 and 36.
  inputs:
    modulus: 5
    a: 1
    b: 1
    x1: 2
    y1: 1
    lambda1: 2
    defect1: 10
    lhs1: -4
    rhs1: 26
    gap1: 30
    y_gap1: 60
    x_cross1: 8
    ref_cross1: 26
    ref_remainder1: 1
    x2: 4
    y2: 2
    lambda2: 1
    defect2: 65
    lhs2: 1
    rhs2: 196
    gap2: 195
    y_gap2: 195
    x_cross2: 16
    ref_cross2: 36
    ref_remainder2: 1
  controls:
    - >-
      The identity gap at (2, 1) is 30. Reporting that gap as 0
      invalidates the run.
    - >-
      The reference cross 26 leaves remainder 1 on division by 5.
      Reporting that cross as 0 invalidates the run.
    - >-
      Each identity gap equals three times the curve defect. The
      y-component gaps are 60 and 195.
    - >-
      Both curve defects leave remainder 0 on division by 5. The
      x-crosses are 8 and 16.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - point in {(2, 1), (4, 2)}
    - route in {subtract_expressions, three_times_defect}
  metrics:
    primary:
      - gap1
      - gap2
      - implementations_agree
    secondary:
      - ref_remainder1
      - y_gap1
      - defect2
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The identity gaps are 30 and 195. The reference crosses are
      26 and 36, each leaving remainder 1 modulo 5.
    formula: >-
      Subtract 3 y squared minus 2 a x minus 3 b from 3 x cubed plus
      a x. Separately multiply the curve defect by 3. Separately
      compare lambda times (2 a x plus 3 b) times 2 y with x times y.
    source: >-
      IDEA-20260930-8e3b75 states the cancellation 3 y squared minus
      2 a x minus 3 b equals 3 x cubed plus a x, read 2026-10-02.
      The two points were computed in this design session. That
      computation is not a run. No deformation was built.
  scale_relevance:
    tier: toy
    justification: Two points modulo 5. No transfer to a census.
    correspondence: null
  tail_checks:
    - The second point and both reference remainders are required. A check that stops at the gap 30 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the identity gap 30 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The identity gap at (2, 1) is not 30.
    - The identity gap at (4, 2) is not 195.
    - The reference cross 26 is reported as 0.
    - A deformation is built or a point is lifted.
  success_criterion: >-
    Both runs agree that the identity gaps are 30 and 195, that each
    equals three times the curve defect, that the y-component gaps
    are 60 and 195, that the x-crosses are 8 and 16, and that the
    reference crosses 26 and 36 each leave remainder 1 modulo 5.
  falsification_criterion: >-
    The runs agree that the curve defect at (2, 1) is 10, and the
    identity gap is not 30.
  required_artifacts:
    - experiments/EXP-ECDLP-f7310e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-f7310e/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-f7310e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-f7310e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-f7310e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-f7310e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any deformation ring, torsion lift, or discrete-log census.
    - Any claim that the defect is uncorrelated with a character.
    - Any anomalous-curve logarithm.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
