experiment:
  id: EXP-MONO-bb6fa1
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-572e7e
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260904-8c2580's own named next step ("only
    m>=4 remains open") for the D-4 direction-swap route, and
    IDEA-20260904-a1b81b's own Stage 0+1 is the cheapest decisive
    discriminator in this program's current backlog: one exhaustive
    enumeration at p=101 for one curve and one R (seconds of compute)
    gives a ~100-sigma separation between the expected (S_3) and
    alternative (A_3) outcomes, PROVIDED the mandatory nearby-object
    controls (which this contract requires to pass before any
    interpretation) demonstrate the classifier can actually see the
    difference. Scoped narrowly (Stage 0+1+R8 only) per this program's
    own "cheapest decisive test first" practice; full multi-prime/
    multi-curve scope (the idea's own Stage 2/3) is named as a follow-up
    conditional on this result, not commissioned here.

  title: >-
    Is the Galois group of the m=4 residual cubic over the fixed-T
    summation surface S_3 (as every Semaev relation-rate model assumes)
    or A_3 (which would double the per-fibre relation rate), on one
    curve and one R at p=101 -- gated by mandatory nearby-object controls?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - >-
      Not an ECDLP cost, runtime, or exponent claim in either outcome:
      outcome (I) confirms an already-assumed constant; outcome (II) is a
      constant factor of 2 that moves no exponent at fixed m, and any
      extension-field exponent consequence is an explicitly unvalidated
      transfer assumption (H3), never asserted here.
    - >-
      Not the full multi-prime, multi-curve, multi-R scope
      (IDEA-20260904-a1b81b's own Stage 2), nor the CM-vs-ordinary
      comparison (Stage 3) -- both are named follow-ups, not this
      contract.
    - Not a measurement of the factor-base membership factor (the OTHER half of the relation rate) or of solve cost.
    - Not a re-scoping or re-opening of the m=3 D-5 collapse (DEC-20260904-8c2580), which this contract's own R8 check must reproduce exactly, not revisit.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: on ONE tested (E,R) at p=101, whether the residual cubic's
      Galois group over V_R matches S_3 (giving the assumed 1/6 split
      density) or A_3 (giving 1/3), PROVIDED the mandatory controls pass.
      A pass on outcome (I) gives the 1/(m-1)! factor its first empirical
      footing at toy scale for ONE object, not a general law. A control
      failure (S1) or baseline-reproduction failure (S2) voids the run as
      an instrument result.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate claim beyond the split-density
      factor for this one (E,R); no factor-base-membership claim; no
      solve-cost claim; no F_{q^n} claim (H3 unvalidated); no closure of
      KN-OPEN-009.

  inputs:
    construction_reused: >-
      This program's own already-built S_4 resultant recursion
      (experiments/EXP-MONO-815525/implementation/derive_s4.py and its
      own s3/s4 monomial tables) for evaluating S_4(t1,t2,t3,T_0) at a
      Galois-stable root triple. NEW code is required for: enumerating
      V_R(F_p) directly in symmetric coordinates (e1,e2,e3), factoring
      the residual cubic g over F_p (degree 3, elementary), and computing
      the discriminant-square rate.
    domain: EXP-MONO-bb6fa1/v1
    curve_and_point: >-
      ONE ordinary curve E/F_101 with j not in {0,1728}, chosen by a
      fixed, declared deterministic rule (first ordinary, non-CM curve
      found by ascending (A,B) scan, per this sub-thread's own established
      "first hit, declared order, no post-hoc widening" discipline). ONE
      point R = k*G for a generator G of E(F_101) with k chosen so R is
      NOT in E[2] (R's own TRUE order is computed and asserted, not
      assumed, per the idea's own OI-1(b) guard), T_0 = x(R).
    enumeration: >-
      Exhaustive over ALL (e1,e2,e3) in F_101^3 (p^3 ~ 1.03e6 triples).
      For each, factor g(X)=X^3-e1X^2+e2X-e3 over F_101 (elementary,
      O(1) per triple at this degree): determine its factorization type
      (split into 3 distinct roots; 1+2, i.e. one root plus an
      irreducible quadratic factor; irreducible; or a degenerate case --
      repeated root). For non-degenerate triples, obtain the Galois-
      stable root multiset (in F_101, F_{101^2}, or F_{101^3} as
      appropriate) and evaluate S_4(t1,t2,t3,T_0) via the already-built
      resultant recursion; keep the triple iff this value is 0 (a point
      of V_R). MUST enumerate the SYMMETRIC coordinates directly (e1,e2,e3),
      NEVER solve for e3 from a chosen (x1,x2) -- the idea's own
      confounders section names that as "the single most likely
      implementation error," since it enumerates the ORDERED variety
      W_R and would force split density to 1.0 by construction.

  stage_order:
    stage_0:
      name: "the cheapest decisive discriminator (R1/R2/R3)"
      compute: seconds to minutes
      description: >-
        Exhaustive enumeration as above. Report |V_R(F_101)| (against the
        Lang-Weil expectation ~p^2), the discriminant-square rate (R1:
        fraction of V_R(F_101) points where disc(g) is a nonzero square
        in F_101), and the three-type density triple (R2: 1+2 density,
        R3: complete-split density). Report every degenerate stratum
        (g inseparable, R in E[2] -- excluded by construction via the
        OI-1(b) guard, points where the four T-roots collide) separately,
        never pooled.
    stage_1:
      name: "mandatory nearby-object controls (R4), gating, run before any interpretation"
      compute: seconds
      description: >-
        Run the IDENTICAL classifier (same factorization-type code) on
        two synthetic objects: (a) the synthetic A_3 object -- enumerate
        (e1,e2,e3) with disc(g) constrained to be a nonzero square (by
        construction), and confirm the classifier reports density triple
        (1/3, 0, 2/3) on it; (b) the unconstrained object -- uniformly
        random (e1,e2,e3) with NO V_R membership condition, and confirm
        the classifier reports (1/6, 1/2, 1/3) on it. STAGE 0's OWN
        RESULT MAY NOT BE INTERPRETED IN EITHER DIRECTION UNTIL BOTH
        CONTROLS PASS (S1: if the classifier reports the SAME triple on
        both nearby objects, it cannot see the effect being measured).
    stage_r8:
      name: "m=3 baseline reproduction check (R8, free, symbolic)"
      compute: seconds
      description: >-
        Run the identical pipeline's own logic at m=3 (residual object
        degree 2, not 3) and confirm it reproduces DEC-20260904-8c2580's
        own already-proven identity (disc_{x2} S_3(x1,x2,T_0) =
        16 f(x1) f(T_0), a forced quadratic-character structure, NOT a
        three-type histogram). ANY OTHER OUTPUT AT m=3 MEANS THE PIPELINE
        IS WRONG AND NO m=4 OUTPUT MAY BE READ (S2).

  metrics:
    primary:
      - "R1: discriminant-square rate on V_R(F_101) (exact fraction, expected 0.5 under S_3, 1.0 under A_3)"
      - "R2: 1+2 factorization-type density on V_R(F_101) (expected 0.5 under S_3, exactly 0 under A_3/C_3)"
      - "R3: complete-split density on V_R(F_101) (expected 1/6 under S_3, 1/3 under A_3) -- the relation-rate factor itself"
    secondary:
      - "R4: the two nearby-object control triples (must be (1/3,0,2/3) and (1/6,1/2,1/3) respectively for Stage 0 to be interpretable at all)"
      - "|V_R(F_101)| against the Lang-Weil expectation p^2 with envelope 3p^{3/2}"
      - "R8: the m=3 baseline reproduction outcome (pass/fail against DEC-20260904-8c2580's own identity)"
      - "every degenerate-stratum count, reported separately"

  preregistered_prediction:
    - quantity: R1, R2, R3
      value: "R1=0.5, R2=0.5, R3=1/6, each within 3 binomial standard errors (~0.005 at p=101), under G_R=S_3 (outcome I, expected)."
      formula: "Chebotarev density triple for S_3 acting on 3 points, per IDEA-20260904-a1b81b's own (E2)."
      source: IDEA-20260904-a1b81b mechanism, STEP 1-2.
    - quantity: R4
      value: "(1/3, 0, 2/3) on the synthetic A_3 object; (1/6, 1/2, 1/3) on the unconstrained object -- both required BEFORE Stage 0 is interpreted."
      formula: "Chebotarev triples for A_3 and for an unconstrained (i.e. effectively S_3-random) cubic respectively."
      source: IDEA-20260904-a1b81b mechanism, R4.

  replication:
    planned_runs: 1
    seeds: [20260904008]
    interpretation: >-
      Deterministic once the curve, R, and enumeration order are fixed
      (no random.Random is used for the exhaustive enumeration itself;
      the seed governs only the initial curve/R selection rule's own
      tie-breaking, if any, and is recorded for reproducibility).

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 900
    maximum_cpu_seconds: 900
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: >-
      NO CAS REQUIRED beyond this program's own already-built S_4
      resultant recursion (reused read-only). Pure Python otherwise.
    if_a_precondition_fails: >-
      A missing interpreter, missing S_4 table, or arithmetic exception
      is `failed_infrastructure`, never negative mathematical evidence
      (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-572e7e or IDEA-20260904-a1b81b.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - >-
      Stage 1's two nearby-object controls MUST both pass before Stage
      0's own result is reported as interpretable in either direction
      (S1). If either control fails, report the failure plainly as an
      instrument result and stop -- do not proceed to interpret R1/R2/R3.
    - >-
      R8's m=3 baseline check MUST reproduce DEC-20260904-8c2580's own
      identity exactly (S2). If it does not, report a specification_error
      and stop -- do not report any m=4 output.
    - Never enumerate the ordered variety W_R (solve-for-e3) as the primary method -- ONLY the symmetric (e1,e2,e3) enumeration is authoritative.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Enumerating via solve-for-e3 as the PRIMARY (non-cross-check) method.
    - Reporting R1/R2/R3 without both R4 control results alongside them.
    - Pooling any degenerate stratum into the primary count.

  success_criterion: >-
    A run is well-formed evidence if: both Stage-1 controls are reported
    with their own exact triples; R8's baseline check result is reported
    exactly (pass/fail); and, if both pass, Stage 0's R1/R2/R3 are
    reported exactly, whether they match outcome (I), outcome (II), or
    neither (S4).

  falsification_criterion: >-
    Per H-MONO-572e7e's own falsification_condition: S1 (control
    failure), S2 (baseline failure), S3 (discriminant-square rate 1.0,
    confirming outcome II over outcome I), or S4 (no subgroup match).

  outcomes:
    outcome_I_s3_confirmed: >-
      Both controls pass, R8 passes, and R1=0.5/R2=0.5/R3=1/6 within 3
      s.e. G_R=S_3 on this (E,R); the 1/(m-1)! factor gets its first
      empirical footing at toy scale. sota_delta 0 (already assumed).
    outcome_II_a3_found: >-
      Both controls pass, R8 passes, R1=1.0 with controls passing. G_R<=A_3;
      per-fibre relation rate doubles; the 1+2 type is absent. The only
      branch in this program's current backlog with any (H3-conditional,
      unvalidated) exponent relevance.
    outcome_neither_anomaly: >-
      Controls and R8 pass but R1/R2/R3 match no subgroup of S_3's
      Chebotarev triple (S4). Reported as an anomaly requiring further
      investigation of the surface's own structure, not forced into
      either outcome.
    control_failure_instrument_result: >-
      Either R4 control fails (S1). Nothing about G_R may be reported in
      either direction; this is an instrument result, not mathematical
      evidence.
    baseline_failure_specification_error: >-
      R8 fails (S2). The pipeline is wrong; no m=4 output may be read.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale, ONE curve, ONE R, ONE prime (p=101). No transfer to
      cryptographic scale, no transfer across curves or R values without
      the follow-up Stage 2/3 scope, and no transfer to F_{q^n} without
      H3 (explicitly unvalidated).

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Both Stage-1 control results, reported before any Stage-0 interpretation.
    - R8's baseline reproduction result.
    - Run manifest, command, environment, raw-result.json with exact R1-R4 values and the full degenerate-stratum breakdown.
    - Independent Validator + Red Team review before any citation alongside IDEA-20260904-a1b81b's own broader claim.

  approval_requirements:
    - This contract is DEC-20260904-8c2580's own named next step, specialized to Stage 0+1+R8 as the cheapest decisive slice.
    - Independent review confirms the enumeration is over symmetric coordinates (not the ordered-variety trap), the control results, and the R8 baseline check.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-572e7e.yaml
    - ledger/proposals/IDEA-20260904-a1b81b.yaml
    - ledger/decisions/DEC-20260904-8c2580.yaml
    - ledger/decisions/DEC-20260810-2f86db.yaml
    - experiments/EXP-MONO-815525/implementation/derive_s4.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
