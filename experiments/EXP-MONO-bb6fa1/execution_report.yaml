  honest_assessment: >-
    No outcome (I, II, or neither) is asserted. R8 passed exactly. Both
    Stage-1 mandatory controls FAILED under the specification's literal
    numeric gate, so per the frozen stopping rule this run is a
    control_failure_instrument_result and Stage 0's R1/R2/R3 are withheld
    from interpretation, exactly as the contract requires. This is
    reported plainly as the required, non-negative-evidence outcome of a
    properly gated instrument check, per this program's "never discard"
    discipline -- not as evidence for or against G_R=S_3 or G_R<=A_3 on
    this (E,R). The disclosed tension (Section stage_1_mandatory_controls
    "disclosure") -- that the two nearby objects are sharply distinguished
    from each other and match known exact finite-field formulas bit-
    exactly, yet still fail the literal idealized-target tolerance because
    that tolerance does not account for the O(1/p) finite-field
    correction present in an exhaustive (non-sampled) population census --
    is the single most useful, concrete, actionable finding of this run
    for any follow-up amendment, and is preserved here rather than
    silently reconciled in either direction.

