  summary: >-
    Executed the frozen, approved contract EXP-MONO-bb6fa1 (Stage 0 + Stage
    1 + Stage R8 only, per the specification's own narrowed scope) on one
    ordinary curve E/F_101 and one point R, chosen by a fixed declared
    deterministic rule. Stage R8 (m=3 baseline reproduction) PASSED
    exactly. Stage 1's two mandatory nearby-object controls, applying the
    specification's LITERAL wording ("within about 3 standard errors"
    using the actual exhaustive-census sample size), both FAILED. Per the
    frozen stopping rule S1, Stage 0's own R1/R2/R3 are recorded below but
    are NOT interpreted in either direction (not toward outcome I, not
    toward outcome II, not toward "neither"). This disposition is
    control_failure_instrument_result, an instrument result, not
    mathematical evidence about G_R. A detailed, fully disclosed tension in
    how the literal gate applies to an EXHAUSTIVE population census (as
    opposed to a statistical sample) is reported below and in
    implementation.md/manifest.yaml for the Coordinator's attention -- it
    is not resolved unilaterally by this run.

  curve_and_point_selection:
    selection_rule: >-
      Ascending scan A=0..100 (outer), B=0..100 (inner), both starting at
      0; first (A,B) with nonsingular discriminant (4A^3+27B^2 != 0 mod
      101), j not in {0, 1728 mod 101}, and ordinary (trace mod 101 != 0,
      computed by direct point-counting), taken. 103 (A,B) pairs examined.
    curve: {p: 101, A: 1, B: 1, j_invariant: 34, order_E: 105, trace: -3}
    generator_G: {point: [6, 18], true_order: 105, rule: "ascending x; first point of TRUE order == #E(F_101), order computed by factoring n=105=3*5*7 and reducing at each prime, never assumed"}
    point_R: {rule: "R=kG, k smallest >= 2 with R's own TRUE order (computed the same way) > 2, i.e. R provably not in E[2]", k: 2, R: [8, 4], true_order: 105, T0: 8}

  stage_r8_m3_baseline:
    identity_checked: "disc_{x2} S_3(x1,x2,T0) = 16 f(x1) f(T0)"
    source_construction: "EXP-MONO-815525/implementation/s3_monomials.json, reused read-only"
    n_samples: 30
    all_samples_matched: true
    result: PASS

  stage_1_mandatory_controls:
    synthetic_A3_object:
      enumeration: "ALL (e1,e2,e3) in F_101^3 with disc(g) a nonzero square, direct enumeration"
      n_nondegenerate: 510050
      observed_triple_split_1plus2_irreducible: [0.32673267326732675, 0.0, 0.6732673267326733]
      expected_triple_asymptotic: [0.3333333333333333, 0.0, 0.6666666666666666]
      expected_triple_exact_finite_p_formula: [0.32673267326732675, 0.0, 0.6732673267326733]
      matches_exact_finite_p_formula: true
      literal_3se_pass: false
    unconstrained_object:
      enumeration: "ALL (e1,e2,e3) in F_101^3, no condition"
      n_nondegenerate: 1020100
      n_degenerate: 10201
      observed_triple_split_1plus2_irreducible: [0.16336633663366337, 0.5, 0.33663366336633666]
      expected_triple_asymptotic: [0.16666666666666666, 0.5, 0.3333333333333333]
      expected_triple_exact_finite_p_formula: [0.16336633663366337, 0.5, 0.33663366336633666]
      matches_exact_finite_p_formula: true
      literal_3se_pass: false
    both_controls_pass_literal_gate: false
    result: FAIL (S1)
    disclosure: >-
      Both control objects are EXHAUSTIVE censuses of the entire
      population of monic cubics over F_101, not statistical samples of a
      curve's F_p-points. Their factorization-type densities are EXACT
      closed-form classical combinatorial fractions:
      #split=C(p,3)=p(p-1)(p-2)/6, #one_plus_two=p^2(p-1)/2,
      #irreducible=(p^3-p)/3, #degenerate=p^2 -- giving exact finite-p
      triples ((p-2)/(3p), 0, 2(p+1)/(3p)) [A_3 stratum] and
      ((p-2)/(6p), 1/2, (p+1)/(3p)) [unconstrained], both O(1/p) away from
      the p->infinity idealized Chebotarev triples used as the literal
      comparison target -- BY CONSTRUCTION of finite-field combinatorics,
      not by classifier error. This run's observed counts match these
      closed-form formulas bit-exactly (verified in code), and the two
      objects are sharply, correctly distinguished from one another
      (0.3267 vs 0.1634 split density; 0.0 vs 0.5000 one-plus-two
      density) -- the OPPOSITE of "the classifier cannot see the effect",
      which is what S1 is meant to rule out. The literal numeric tolerance
      ("~0.005") appears calibrated for Stage 0's own much smaller
      ~p^2~10^4-point V_R sample, not for Stage 1's ~10^5-10^6-point
      EXHAUSTIVE population census, whose O(1/p) deviation from the
      idealized target will NOT shrink with a larger n because it is not
      sampling noise. This is reported as a candidate specification-
      tolerance ambiguity for the Coordinator to resolve via amendment,
      and is explicitly NOT resolved unilaterally by relaxing or
      reinterpreting the frozen stopping rule in this run.

