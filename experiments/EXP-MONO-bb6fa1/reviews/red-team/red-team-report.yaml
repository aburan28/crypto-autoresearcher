  proof_architecture_challenges:
    - attack: observation-fiber / nearby-object attack
      finding: >-
        See OBJ-2. The idea's own nearby_object_control section names the
        synthetic A_3 object as "the object on which the conclusion is
        known false" but does not construct or discuss an analogous
        object for the INTRANSITIVE C_2 case. This review supplies the
        missing density triple ((1/2,1/2,0)) by direct group theory (the
        sign homomorphism on subgroups of S_3) and shows R1/R2 cannot
        separate it from S_3 even in principle -- a genuine gap in the
        pre-run collision search, though the run's own reported R3 happens
        to already close it.
    - attack: quantifier-order / circularity attack
      finding: >-
        See H1-challenge. The Weil-bound justification for "small R1
        deviation is unremarkable under S_3" implicitly assumes the
        D-irreducibility that is equivalent to the S_3 conclusion being
        tested. This is disclosed as a structural, not fatal, circularity:
        it means the SIZE of the deviation is corroborating context, not
        independent quantitative evidence, and the load-bearing tests are
        the exact zero/nonzero comparisons (R2 vs A_3/C_3/trivial's forced
        0; R3/irreducible-density vs A_3/C_2/trivial's forced 0), which are
        not subject to the same circularity because they compare against
        EXACT forced values, not a bound whose applicability presupposes
        the conclusion.

  j3_vr_interpretation:
    part_i_tighter_prediction_or_bound: >-
      NO EXACT CLOSED FORM WAS DERIVED, AND I DO NOT BELIEVE ONE IS
      AVAILABLE WITHOUT SUBSTANTIALLY MORE WORK, for a reason that is
      qualitatively different from why the two controls have one. The two
      controls' exact formulas ((p-2)/(6p) etc.) are pure orbit-counting
      combinatorics on the FULL ambient (e1,e2,e3)-space or an
      arithmetic-input-free sub-locus of it (square discriminant is a
      global quadratic-character condition, not tied to any curve); no
      curve, no point R, no elliptic-curve arithmetic enters those
      formulas at all. V_R, by contrast, is cut out by F(e1,e2,e3) =
      Q_e(T0) = 0, a SPECIFIC degree-<=4 polynomial whose coefficients
      encode the specific curve's (A,B) and the specific point's T0=x(R)
      (via the already-derived S_4 resultant). Its exact F_p-point count
      is a genuine arithmetic invariant of a specific algebraic surface --
      the kind of quantity that in general requires computing that
      surface's own zeta function (Frobenius eigenvalues on its l-adic
      cohomology), not orbit-counting. That is a nontrivial computational
      algebraic geometry undertaking this toy-tier record does not attempt
      and this review's budget does not support either. What I COULD, and
      did, derive from first principles (not previously stated in the
      record) is the STRUCTURE of the correct bound, not its constant: (1)
      R1 is a GROUP-THEORETIC BINARY invariant, not a smoothly-varying
      target -- under equidistribution it is EXACTLY 1 if G_R subset-of
      A_3, or EXACTLY 1/2 if G_R not subset-of A_3 (a pure consequence of
      the sign homomorphism on subgroups of S_3), so "close to 0.5" is the
      right qualitative target and 1.0 is decisively excluded, full stop;
      (2) the finite-p ERROR around that binary target is derivable, in
      structure, via Lang-Weil applied to the explicit degree-<=4 double
      cover D described in H1-challenge above, giving O(p^-1/2) relative
      error IF G_R=S_3 and a tighter O(1/p) IF G_R<=A_3 -- but this
      derivation is conditional on (is logically equivalent to assuming)
      the very dichotomy it is meant to help resolve, so it explains WHY a
      small deviation is unsurprising under S_3 without independently
      certifying that G_R=S_3 caused it. I regard this as a genuinely hard
      question of a materially different kind than the controls' -- an
      arithmetic-geometry point-count, not a combinatorics problem -- and
      say so plainly rather than force a numeric bound I cannot support
      without either an explicit-constant citation I am not confident
      enough to assert (risk of the kind of fabrication AGENTS.md rule 5
      prohibits) or a computation out of this review's scope.
    part_ii_is_0.0048_small_enough: >-
      BOTH readings the task asks about are correct simultaneously, and
      should both be stated: (a) 0.0048 clears the loose Weil-type
      envelope (~0.0995) by about 21x and is therefore NOT alarming or
      inconsistent with G_R=S_3 -- unremarkable in that sense; (b) 0.0048
      is only about 2x smaller than the elementary-combinatorial O(1/p)
      scale (0.0099), i.e. the SAME order of magnitude as the kind of
      correction the two controls exhibit for a completely different
      (arithmetic-input-free) reason -- so it is NOT so tiny as to be
      obviously "generic Weil noise only," and a genuinely careful reader
      should notice this ambiguity rather than treat "well under both
      scales" (the run's own phrasing) as if both margins were equally
      generous; they differ by roughly an order of magnitude (21x vs 2x).
      Most importantly, and this is the sharper point this review adds:
      the PRECISE SIZE of the R1 deviation carries very little
      independent discriminating weight regardless, because (per OBJ-2)
      R1 cannot distinguish S_3 from C_2 at any precision, and the loose
      Weil bound it is being checked against would have been cleared even
      by a substantially larger deviation. The genuinely decisive,
      non-circular evidence in this run is the EXACT-ZERO tests: R2's
      clear nonzero value versus A_3/C_3's forced 0, and irreducible
      density's clear nonzero value (0.327, matching 1/3) versus
      A_3/C_2/trivial's forced 0. On those grounds alone -- independent of
      any Weil-bound reasoning -- G_R in {1, C_2, A_3} is safely excluded
      at this one (E,R), and S_3 is the only one of the four possible
      outcomes consistent with a data point where ALL THREE types occur
      with none forced to zero. A more careful reader should NOT yet read
      this as "S_3 confirmed" (a single point, no closed-form null,
      genuinely open H2), but SHOULD read it as "the three live
      alternatives to S_3 are each independently and exactly excluded at
      this one (E,R); S_3 is what remains."
    part_iii_what_a_second_point_adds_and_how_to_report_this: >-
      A second data point (a further R on the same curve, the idea's own
      R5 panel of >=20 R, or the p-ladder R7) adds exactly what a single
      exhaustive census of an object with no known closed form cannot: (1)
      it tests whether THIS R is special (S5); (2) it is the only way to
      empirically calibrate which of the three decay laws named in
      required_controls governs the observed residual, resolving the
      circularity in part_i by giving an independent (non-bound-derived)
      read on the mechanism; (3) it directly tests whether the R3 =
      (p+1)/(6p) identity found in counterexample_or_mutation recurs,
      which bears on whether part_i's "no closed form available" answer
      is itself too pessimistic. Given all of the above, this review's own
      recommended framing -- consistent with, and no stronger than, the
      Coordinator's own prior in this task's review_plan -- is: report
      this single (E,R) result as "consistent with, but not confirming,
      outcome (I)," explicitly noting that R1's closeness to 0.5 is
      corroborating context rather than the load-bearing evidence (which
      is instead the exact-zero tests on R2 and on irreducible density),
      and explicitly naming the p-ladder/R-panel as the necessary next
      step before any stronger claim (e.g. "G_R=S_3 established at toy
      scale") is made.

  j4_correction_completeness_and_pattern_audit:
    part_i_instrument_vs_result_boundary: >-
      CONFIRMED, NO BLURRING FOUND. CORR-20260904-8cc20f's own
      `disposition` field states explicitly: "Stage 0's own census ...
      remains RECORDED but this correction does not itself authorize
      interpreting it -- see next_action," and its `finding` section's
      claim is scoped strictly to the two Stage-1 control objects (which
      it correctly notes are exhaustive censuses of universal,
      arithmetic-input-free populations with known exact formulas) and
      never extends that claim to V_R's own census. This is the correct
      boundary: demonstrating a classifier can tell two KNOWN, EXACTLY
      COMPUTABLE objects apart is a statement about the INSTRUMENT; it
      says nothing by itself about whether the instrument's reading of a
      THIRD, arithmetic-geometry object with no known closed form (V_R)
      is correct. The correction dispatches that separate question to
      independent review (this task) rather than deciding it unilaterally,
      which is the right process discipline.
    part_ii_recurring_pattern_and_recommended_rule: >-
      YES, THE PATTERN IS NOW CLEAR ENOUGH TO WARRANT A STANDING RULE, with
      one refinement this review adds (see OBJ-3): a single "exhaustive
      census needs exact tolerance, not a sampling-theory band" rule is
      necessary but not sufficient, because it does not by itself cover
      V_R's own situation -- an exhaustive census of an object with NO
      known closed form, only a heuristic bound of uncertain constant and
      a different (Weil-type, not combinatorial) mechanism. Recommended
      rule, drafted as one paragraph for a future knowledge entry or a
      `/design-experiment` checklist item: "Before assigning a numeric
      pass/fail tolerance to any control or measured null object, classify
      it on two axes: (1) is it an EXHAUSTIVE deterministic census of the
      entire relevant finite population, or a genuine statistical SAMPLE
      drawn from it; and (2) does an EXACT closed-form value at the tested
      finite p exist and is it derivable by elementary means (orbit- or
      equivalence-class counting with no arithmetic-geometry input), or is
      the expected value itself only known via an unproven heuristic
      backed by a bound (Weil/Lang-Weil/Chebotarev-for-function-fields)
      whose error term has a stated order but no fixed constant. An
      exhaustive census with a derivable closed form (axis 1 exhaustive,
      axis 2 known) must be judged by EXACT equality against that closed
      form, never by an N-standard-error band borrowed from sampling
      theory (CORR-20260904-8cc20f, CORR-20260904-33fbf3). An exhaustive
      census WITHOUT a known closed form (axis 1 exhaustive, axis 2
      heuristic-bound-only, e.g. this record's own V_R) must instead be
      judged primarily by the EXACT zero/nonzero or forced-ratio tests its
      own alternative-hypothesis lattice supports (which hold regardless
      of how tight or loose the bound is), with the SIZE of any residual
      deviation reported only alongside an explicitly named mechanism and
      order (stating whether elementary-combinatorial O(1/p) or
      arithmetic-geometric O(p^-1/2) or some other rate is the
      theoretically relevant one, and why -- never treating 'exhaustive
      census, therefore O(1/p) is the norm' as a blanket default, since
      that conflates two different mechanisms); closeness to the naive
      asymptote is corroborating context, not itself the discriminating
      evidence, until a second data point (a p-ladder or a panel across R
      or curves) empirically confirms the deviation decays at the rate the
      named mechanism predicts." This is offered as a concrete addition
      to a future `/design-experiment` checklist or a KN-TECH entry on
      control design, not as a ledger or hypothesis change.

