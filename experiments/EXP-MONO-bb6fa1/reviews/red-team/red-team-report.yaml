  objections:
    - id: OBJ-1-R1-R2-NOT-INDEPENDENT
      statement: >-
        R1 (disc-square rate) and R2 (1+2 density) are not two independent
        measurements. For ANY finite population of separable monic cubics
        over F_p -- this run's V_R, either control, or any other -- disc(g)
        is a nonzero square in F_p if and only if the permutation Frobenius
        induces on the three roots is EVEN (identity or 3-cycle), which is
        exactly "not the 1+2 type." Hence R1 = 1 - R2 identically,
        regardless of what G_R is; this is a classical fact about cubics,
        not something specific to S_3 vs A_3. Verified bit-exactly on this
        run's own raw counts: disc-square count = split + irreducible =
        1683 + 3269 = 4952, matching R1's numerator (4952/9999) exactly,
        and 1 - R2 = 1 - 5047/9999 = 4952/9999 = R1. The specification's
        framing of R1 as "the cheapest decisive discriminator" and R2 as a
        second, additional confirmation therefore over-counts: they are
        the same test read two ways, not two independent lines of
        evidence. (This is a design-clarity point, not a correctness bug:
        the code's two computation paths for disc-square-ness and for
        split/1+2 classification agreeing exactly is itself a useful,
        if incidental, internal consistency cross-check -- and the
        anomaly_disc_q_zero counter, which exists precisely to catch a
        disagreement between those two paths, reported 0 instances.)
      severity: minor_design_clarity
    - id: OBJ-2-S3-VS-C2-COLLISION-UNNAMED
      statement: >-
        A previously unnamed alternative outcome exists and was not
        listed in IDEA-20260904-a1b81b's own observation_collision /
        residual_collision_risk section, which names only the S_3-vs-
        "random cubic" collision (declared as the hypothesis itself) and
        the A_3-vs-C_3-transitivity collision. Missing: G_R = C_2, the
        INTRANSITIVE order-2 subgroup realized when the residual cubic
        factors identically as (linear)(irreducible quadratic) over
        k(V_R) -- i.e. W_R is reducible with one root already a rational
        function on V_R, but the residual quadratic's OWN discriminant is
        a nontrivial character on V_R, so it still splits or stays
        irreducible roughly half the time at a given F_p-point. By
        elementary group theory (the sign map G -> {+-1} has kernel of
        index 1 or 2 in every subgroup of S_3), the predicted density
        triple for C_2 under Chebotarev/equidistribution over its own two
        elements {identity, one transposition} is EXACTLY (split=1/2,
        1+2=1/2, irreducible=0) -- IDENTICAL to S_3 on R1 (both give
        exactly 1/2 disc-square rate, since {identity} is the only even
        element in a 2-element group, same 1-of-2 ratio as S_3's 3-of-6)
        AND identical to S_3 on R2 (both give exactly 1/2 one-plus-two
        density). R1 and R2 therefore have ZERO power, in principle, at
        ANY p and to ANY precision, to distinguish G_R=S_3 from G_R=C_2 --
        this is a mathematical identity, not a finite-p artifact that a
        bigger census would resolve. Only the IRREDUCIBLE density (or,
        equivalently, a direct transitivity/irreducibility check on W_R)
        separates them, since C_2 forces irreducible density = 0 exactly
        (no 3-cycles in a 2-element group), the SAME forced-zero mechanism
        the record already uses against A_3. The observed irreducible
        density (0.32693269326932695, matching 1/3) is clearly, decisively
        nonzero, so C_2 IS in fact ruled out by this run's own reported
        data -- but not by the mechanism (R1's closeness to 0.5) the
        specification and hypothesis foreground as "the cheapest decisive
        discriminator." A reader who used only R1 (or only R1 and R2) to
        conclude "S_3, not C_2" would be relying on a test with no
        discriminating power for that specific comparison.
      severity: substantive_but_data_already_covers_it
      resolution: >-
        Not a defect in this run's own result (R3/irreducible-density,
        which the specification does require reporting, happens to
        already do the job), but a real gap in the idea's own pre-run
        collision search that should be named explicitly in any future
        write-up citing this record, and corrected in
        IDEA-20260904-a1b81b's own observation_collision section if it is
        ever revised.
    - id: OBJ-3-J4-MECHANISM-CONFLATION
      statement: >-
        CORR-20260904-8cc20f's own next_action text tells a future
        reviewer to judge V_R's R1 deviation (0.0048) "against the SAME
        KIND of O(1/p)-type finite-field correction this correction just
        demonstrated is the norm ... for exact finite censuses in this
        program." This conflates two mechanistically and numerically
        different things. The two controls' O(1/p) corrections
        ((p-2)/(6p) vs 1/6, etc.) are ELEMENTARY COMBINATORICS -- exact
        orbit-counting on the full ambient (e1,e2,e3) space, provable with
        no arithmetic-geometry input and no Weil bound at all. V_R's own
        theoretically-relevant error scale, per H1's own stated
        rigorous_support, is a WEIL/LANG-WEIL-TYPE bound of order
        O(p^-1/2) -- a full order of magnitude larger at p=101 (0.0995 vs
        0.0099) and arising from a completely different mechanism (Deligne/
        Lang-Weil cohomological bounds on a character sum over a
        genuinely arithmetic surface, not orbit counting). Numerically the
        conflation happens not to matter here (0.0048 clears both scales,
        see J3 below), but the REASONING as stated would mislead a future
        reviewer who takes "the same kind of O(1/p) correction" literally
        and expects V_R's deviation to shrink like 1/p across a p-ladder,
        when the correct, derivable expectation (conditional on G_R=S_3;
        see J3(i)) is O(p^-1/2) decay, a materially different, slower
        rate. This should be corrected in the Coordinator's own eventual
        interpretation memo, not left standing as written.
      severity: minor_imprecision_no_disposition_change

  required_controls:
    - control: p-ladder decay check (the idea's own R7), at minimum one
        further prime (p=211) on the SAME curve-selection rule and a
        freshly-selected R, or a matched R on the same curve.
      purpose: >-
        The ONLY available way (short of an actual zeta-function
        computation of the specific surface, out of scope) to distinguish
        three competing explanations for the observed 0.0048 deviation:
        (a) generic Weil-type noise, expected to shrink by a factor of
        about 1.44 (~sqrt(211/101)) from p=101 to p=211; (b) a hidden
        exact O(1/p) rational correction of the SAME flavor as the two
        controls (see OBJ-3 and the R3=(p+1)/(6p) finding below), expected
        to shrink by a factor of about 2.1 (~211/101); (c) a non-shrinking
        artifact, which would be S6 (idea's own falsification condition)
        and would void the density arm entirely. A single data point
        cannot distinguish these, and the current record does not attempt
        to.
    - control: second R on the same curve at p=101 (or the idea's own R5,
        >=20 R per curve).
      purpose: >-
        Rules out (or confirms) that this specific R sits on a special
        locus (S5); also directly tests whether the R3=(p+1)/(6*p) exact
        identity found below (see counterexample_or_mutation) recurs, is
        R-dependent, or was a one-off coincidence at this instance.
    - control: explicit tracking of the RAW difference |V_R(F_p)| - p^2
        itself (not only its ratio to the 3p^1.5 envelope) across the R
        panel and p-ladder.
      purpose: >-
        The observed difference at this instance is exactly 1 (10202 -
        10201), roughly 1000x smaller than the loose envelope of 3045.
        Whether this stays O(1)-ish (suggesting a nearby, possibly
        derivable exact formula for |V_R(F_p)|, e.g. governed by the
        curve's own trace/torsion data) or grows toward the generic
        O(p^1.5) scale as p grows is itself informative and is currently
        unreported as a raw quantity (only the ratio-to-envelope pass/fail
        is recorded).

  counterexample_or_mutation: >-
    A concrete, checkable, and previously unnoticed numeric fact in this
    run's own already-archived raw-result.json: the split density R3
    reduces EXACTLY to 17/101 (1683 = 99*17, 9999 = 99*101, so the common
    factor 99 cancels), i.e. R3 = (p+1)/(6p) exactly at p=101 (since
    1/6 + 1/(6*101) = 102/606 = 17/101). This has the SAME functional
    shape and denominator (6p) as the two controls' own exact O(1/p)
    closed forms, but with a DIFFERENT numerator sign/constant (p+1 here
    vs p-2 for the unconstrained control's own split density). Neither
    R1 nor R2 reduces this cleanly (4952/9999 and 5047/9999 share no
    common factor with 9999 = 3^2*11*101). This is either (a) a one-off
    coincidence specific to this single (E,R) -- plausible, since a
    "random" 4-digit integer near 1667 has roughly a 1-in-99 chance of
    landing on an exact multiple of 99 by chance alone -- or (b) a hint
    that V_R's split density DOES have an exact, curve/point-independent
    rational closed form after all, which would partially overturn this
    report's own answer to J3(i) below (no closed form derivable). The
    cheapest possible discriminating experiment is exactly the p-ladder /
    second-R control named above: if R3 = (p+1)/(6p) (or some other clean
    p-only fraction) recurs at a second, independently chosen (E,R,p),
    that is a genuine finding worth its own follow-up; if it does not
    recur, it was noise at this one instance. This mutation was not run
    in this review (out of scope/budget for a review-only session) and is
    named here as the next concrete action.

  baseline_comparison: >-
    Not an ECDLP attack or cost claim (correctly scoped as such by the
    specification and hypothesis, which this report does not dispute):
    the relevant "baseline" for this joint is not Pollard rho/BSGS but the
    two nearby-object controls' own exact closed forms, which V_R has no
    analogue of (see J3(i)). dominated_by (Pollard rho, O(sqrt(N)) time /
    O(1) memory, every prime-field axis) and sota_delta=0 are already
    correctly recorded in IDEA-20260904-a1b81b and are not contested here;
    nothing in either outcome of this experiment moves them, and this
    report finds no inflation of that scope.

  heuristic_challenges:
    - id: H1-challenge
      target: HEUR-CHEB-1 (Frobenius equidistribution over G_R, error
        O(p^-1/2))
      challenge: >-
        H1's own rigorous_support text cites the Lang-Weil/Weil bound for
        the SIZE of an absolutely irreducible surface (|#points - p^2| =
        O(p^1.5)) as support for an error bound on the RATE (the density
        triple). These are related but not the same statement, and the
        task explicitly asks whether an analogous argument transfers.
        IT DOES, with an explicit and checkable derivation: write N =
        |V_R(F_p)| = N_sq + N_nsq + N_0 (nonzero-square, nonzero-nonsquare,
        zero-disc counts) and form the double cover D = {(e1,e2,e3,y) in
        A^4 : F(e1,e2,e3)=0, y^2 = disc(g)(e1,e2,e3)}, a complete
        intersection of TWO explicit equations both of total degree <=4 in
        (e1,e2,e3) (extracted directly from the already-committed
        experiments/EXP-MONO-815525/implementation/derive_s4.py and
        s4_symmetric_coeffs.json: S_4 restricted to symmetric coordinates
        has total e-degree <=4 in every T-coefficient, and disc(g) is
        degree 4 in (e1,e2,e3) by the classical cubic discriminant
        formula). |D(F_p)| = 2*N_sq + N_0, so the character sum S =
        N_sq - N_nsq = |D(F_p)| - N. IF D is geometrically irreducible of
        dimension 2 -- which holds IF AND ONLY IF disc(g) is not a square
        in the function field of V_R, i.e. IF AND ONLY IF G_R = S_3, the
        very hypothesis under test -- Lang-Weil gives |D(F_p)| =
        p^2 + O(p^1.5), hence S = O(p^1.5) and R1 - 1/2 = S/(2N) =
        O(p^-1/2), reproducing H1's claimed scale from first principles
        rather than by analogy. IF instead G_R <= A_3 (disc(g) IS a square
        on V_R, so D splits into two F_p-rational sheets y=+-h(e)), D is
        geometrically REDUCIBLE with 2 components, so Lang-Weil's leading
        coefficient becomes 2, |D(F_p)| = 2p^2 + (smaller-order terms from
        the pole/ramification locus of h, generically O(p) rather than
        O(p^1.5)), giving R1 = 1 - O(p^-1), a TIGHTER, not looser,
        approach to the boundary value 1. Both branches are therefore
        internally consistent with the specification's own preregistered
        predictions -- but the derivation makes explicit a real logical
        structure the specification does not state: the O(p^-1/2) bound
        that "explains" why R1 near 0.5 is unremarkable under S_3 is only
        valid ASSUMING the D-irreducibility that is logically equivalent
        to G_R=S_3. It is therefore consistent-with, not independently
        confirmatory of, S_3; the genuinely non-circular discriminating
        power in this run comes from the exact zero/nonzero tests (R2, R3
        against the four possible forced values enumerated in J3 below),
        not from the SIZE of the R1 deviation. No explicit numeric
        constant for the O(p^1.5) term is derived or cited here (doing so
        rigorously would need an effective Lang-Weil/Cafure-Matera-style
        theorem instantiated with the actual complete-intersection data,
        which this review did not attempt and flags rather than
        fabricates); only the qualitative structure and its degree-4
        inputs are established.
    - id: H2-challenge
      target: HEUR-IRR-1 (W_R absolutely irreducible, |V_R(F_p)| =
        p^2(1+O(p^-1/2)))
      challenge: >-
        Already flagged by the record itself as its weakest link with "NONE
        OFFERED" rigorous support; this review adds one quantitative
        observation rather than a new objection: the observed deviation
        |V_R(F_101)| - p^2 = 1 is roughly 1000x smaller than the quoted
        3p^1.5 ~ 3045 envelope. Passing a bound with a ~1000x margin is a
        very low bar (a bound loose enough to be cleared by essentially any
        well-behaved arithmetic surface, reducible or not, at small
        constant-term deviations) and should not be read as meaningful
        positive evidence FOR irreducibility beyond "not obviously
        reducible at this one instance." The suspiciously small deviation
        (exactly 1, not merely "small") is itself worth tracking across the
        p-ladder (see required_controls) rather than being absorbed into
        "within envelope, pass."

  cost_model_challenges: []
  cost_model_challenges_note: >-
    None apply. This record makes no time/memory/attack-cost claim in
    either outcome (explicitly disclaimed in what_this_is_not and
