  # ============================================================ J1
  j1_blind_closed_form_rederivation:
    blind_rederivation:
      required: true
      blind_from_respected: true
      blind_from:
        - experiments/EXP-MONO-bb6fa1/execution_report.yaml
        - experiments/EXP-MONO-bb6fa1/runs/RUN-MONO-bb6fa1-1/raw-result.json
        - ledger/corrections/CORR-20260904-8cc20f.yaml
      note: >-
        None of the three blind_from paths were opened before Part A/B
        below were complete and their numeric outputs recorded.

    part_a_hand_derivation:
      method: >-
        Classical bijective/Mobius counting, independent of any producer
        artifact. Monic cubic g(X)=X^3-e1 X^2+e2 X-e3 over F_p classified
        by Frobenius cycle type on its roots: split (3 distinct F_p roots)
        <-> C(p,3) (bijection: unordered root triple -> monic cubic);
        one_plus_two (1 F_p root + irreducible quadratic factor) <-> p times
        the count of monic irreducible quadratics = p * (p^2-p)/2 =
        p^2(p-1)/2; totally irreducible <-> Mobius formula for monic
        irreducible cubics, N_3=(1/3)(p^3-p); degenerate (repeated root)
        <-> bijection (a,b) in F_p^2 -> (X-a)^2(X-b), giving exactly p^2.
        Discriminant-square sub-population derived from the classical fact
        that disc(g) is a square in F_p iff Frobenius acts as an even
        permutation on the roots: identity (split) and 3-cycle
        (irreducible) are even, transposition (one_plus_two) is odd -- so
        "disc nonzero square" = split + irreducible exactly, and disc=0 is
        neither (excluded as "nonzero").
      closed_forms_p_general:
        split_count: "C(p,3) = p(p-1)(p-2)/6"
        one_plus_two_count: "p^2(p-1)/2"
        irreducible_count: "(p^3-p)/3"
        degenerate_count: "p^2"
      closed_forms_densities_fraction_of_nondegenerate_total:
        unconstrained_population: ["(p-2)/(6p)", "1/2", "(p+1)/(3p)"]
        disc_nonzero_square_subpopulation_own_total: ["(p-2)/(3p)", "0", "2(p+1)/(3p)"]
      evaluated_at_p_101:
        split_count: 166650
        one_plus_two_count: 510050
        irreducible_count: 343400
        degenerate_count: 10201
        sum: 1030301
        sum_equals_p_cubed: true
        nondegenerate_total_p2_times_p_minus_1: 1020100
        unconstrained_density_triple_exact_fractions: ["33/202", "1/2", "34/101"]
        unconstrained_density_triple_decimal: [0.16336633663366337, 0.5, 0.33663366336633666]
        disc_square_subpop_density_triple_exact_fractions: ["33/101", "0", "68/101"]
        disc_square_subpop_density_triple_decimal: [0.32673267326732675, 0.0, 0.6732673267326733]

    part_b_independent_brute_force_verification:
      method: >-
        Own numpy-vectorized script (not reusing any producer code),
        enumerating ALL 101^3 = 1,030,301 triples (e1,e2,e3) directly.
        Discriminant computed via the standard cubic discriminant formula
        18bcd-4b^3d+b^2c^2-4c^3-27d^2 with b=-e1,c=e2,d=-e3. Root-count
        computed by a DIFFERENT method than factoring: for each x in F_p,
        the set of triples with g(x)=0 is exactly {(e1,e2,e3): e3 =
        x^3-e1x^2+e2x mod p}, giving a distinct-root count per triple
        without ever calling a root-finder per triple. Classification
        cross-tabulated against disc-zero/nonzero and disc
        square/nonsquare.
      script_path: >-
        /private/tmp/claude-501/-Volumes-SSD990-crypto-autoresearcher/655992ba-4699-434f-a2ad-3a4774fe7a8d/scratchpad/j1_blind.py
        (scratchpad only, not a repository artifact)
      results:
        split_bf: 166650
        one_plus_two_bf: 510050
        irreducible_bf: 343400
        degenerate_bf: 10201
        degenerate_triple_root_bf: 101
        degenerate_double_plus_single_bf: 10100
        matches_part_a_closed_forms: true
        odd_disc_stratum_rootcounts_observed: [1]
        even_disc_nonzero_stratum_rootcounts_observed: [0, 3]
        structural_note: >-
          Confirms by direct enumeration (not just formula) that
          disc-nonsquare separable cubics always have exactly 1 rational
          root (never 0 or 3), and disc-square-nonzero separable cubics
          have either 0 (irreducible) or 3 (split) -- the r=2 case never
          occurs outside disc=0, and disc=0 splits cleanly into r=1
          (triple root, count p) and r=2 (double+single distinct, count
          p(p-1)), summing to p^2.

    proves_too_much_control:
      statement: >-
        My own re-derived method, applied to the degenerate (repeated-root)
        stratum as a third population this record does not test, must give
        exactly p^2 = 10201 at p=101.
      part_a_result: 10201
      part_b_result: 10201
      matches_p_squared: true
      outcome: PASSED. Both my symbolic and brute-force methods independently agree and equal p^2 exactly; my own method is sound before comparison to the archived numbers.

    comparison_to_archived_numbers:
      compared_after_blind_derivation_was_complete: true
      raw_result_json_path: experiments/EXP-MONO-bb6fa1/runs/RUN-MONO-bb6fa1-1/raw-result.json
      unconstrained_object_reported_counts: {split: 166650, one_plus_two: 510050, irreducible: 343400, degenerate: 10201}
      unconstrained_object_reported_triple: [0.16336633663366337, 0.5, 0.33663366336633666]
      synthetic_A3_object_reported_counts: {split: 166650, one_plus_two: 0, irreducible: 343400, degenerate: 0}
      synthetic_A3_object_reported_triple: [0.32673267326732675, 0.0, 0.6732673267326733]
      match_to_my_blind_derivation: >-
        EXACT to every reported digit, both as integer counts (Part B) and
        as floating-point densities (Part A's exact fractions, expanded to
        the same float64 repeating-decimal representation as the archived
        values). Not "approximately" -- bit-for-bit identical. This is
        also an exact match to CORR-20260904-8cc20f's own quoted
        "expected_triple_exact_finite_p_formula" values and to the
        Coordinator's stated re-derivation in the review_plan's
        coordinator_prior.
      literal_3se_gate_arithmetic_independently_recomputed: >-
        Recomputed both literal-gate failures from scratch as a byproduct:
        unconstrained object, n_nondeg=1,020,100, se=sqrt(0.25/n)=~4.95e-4,
        3se=~1.49e-3; observed split density deviates from the
        idealized 1/6 by 0.0033, i.e. >2x the 3-se band -- the literal gate
        genuinely and correctly fails arithmetically, it is not a reporting
        or arithmetic error by the Executor. Same conclusion for the A3
        object (deviation 0.0066 against a 3se band of ~2.1e-3). This
        confirms the archived run's own `control_failure_instrument_result`
        disposition was the CORRECT disposition under the specification AS
        LITERALLY WRITTEN, exactly as CORR-20260904-8cc20f's own
        `disposition` field states.
      verdict_on_j1: >-
        HOLDS. The exact finite-p closed forms CORR-20260904-8cc20f cites
        are classically correct (independently re-derived from Galois-group
        parity of Frobenius, not merely re-checked against anyone's
        arithmetic), and they match the Executor's own measured values to
        the last digit. The correction's central technical claim -- that
        both controls in fact pass EXACTLY against the correct exact-finite-p
