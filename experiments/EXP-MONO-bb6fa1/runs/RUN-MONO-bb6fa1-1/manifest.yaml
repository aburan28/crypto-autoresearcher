    - >-
      METHOD SIMPLIFICATION, DISCLOSED: the task card's own text describes
      obtaining "the Galois-stable root multiset ... and evaluat[ing]
      S_4(t1,t2,t3,T0)" via root extraction in F_p, F_{p^2} or F_{p^3}.
      This run instead evaluates S_4(x1,x2,x3,T0) DIRECTLY from
      (e1,e2,e3) via EXP-MONO-815525's own already-proven exact symmetric
      descent Q_e(T) = sum_k c_k(e1,e2,e3,A,B) T^k (derivation_checks.json:
      s4_fully_symmetric_in_x1_x4=true, s4_symmetric_descent_exact=true),
      since S_4(t1,t2,t3,T0) for ANY Galois-stable root triple with
      elementary symmetric functions (e1,e2,e3) equals Q_e(T0) evaluated
      as an ordinary polynomial in T0 -- no root extraction over any
      extension of F_101 is needed for the V_R-membership test. Root
      extraction over F_101 ONLY (never an extension) is still used, as
      specified, to classify the factorization TYPE of g for every
      triple. This substitution was cross-checked against
      EXP-MONO-815525's own independent qe_from_sym function (500 random
      triples, 0 mismatches) and against a brute-force direct evaluation
      of the merged polynomial (1002 of 1002 zero-set hits matched for a
      restricted slice) before this run was executed; see
      implementation.md.
    - >-
      No git command was run and no commit sha is recorded, per the
      dispatching instruction for this shared, concurrently-worked
      repository. See `code.commit_note`.
    - >-
      UNEXPECTED OBSERVATION, DISCLOSED PLAINLY: Stage 1's two control
      objects are EXHAUSTIVE censuses of the ENTIRE population of monic
      cubics over F_101 (not statistical samples), so their
      factorization-type densities are EXACT closed-form classical
      combinatorial fractions -- ((p-2)/(3p), 0, 2(p+1)/(3p)) for the
      disc-square (synthetic A_3) object and ((p-2)/(6p), 1/2,
      (p+1)/(3p)) for the unconstrained object -- that this run's
      observed counts match BIT-EXACTLY. Both are O(1/p) below/above the
      p->infinity asymptotic idealized triples (1/3,0,2/3) and
      (1/6,1/2,1/3) used as the specification's literal comparison
      target. Applying the specification's literal wording ("within
      about 3 standard errors") using the actual exhaustive-census sample
      size (510050 and 1020100 respectively, giving standard errors of
      order 5-7e-4) makes BOTH controls fail that literal numeric gate,
      even though the two objects are sharply and correctly distinguished
      from one another by the classifier (0.3267 vs 0.1634 split density;
      0.0 vs 0.5000 one-plus-two density) -- the opposite of "the
      classifier cannot see the effect". This run applies the literal
      gate as specified and STOPS per S1 without interpreting Stage 0's
      R1/R2/R3, rather than unilaterally reinterpreting the frozen
      stopping rule. See implementation.md and execution_report.yaml for
      full disclosure and the Coordinator's attention.

  anomalies:
    - >-
      SEE protocol_deviations above: the S1 literal control-tolerance gate
      appears to have been calibrated (the "~0.005" figure named in the
      idea record) for Stage-0-scale samples (~10^4 points, as on the
      actual V_R surface), not for Stage-1's own much larger exhaustive
      population census (~5x10^5 to ~10^6 triples), whose EXACT finite-p
      combinatorial densities deviate from the idealized asymptotic
      target by a real, closed-form, O(1/p) amount that no larger sample
      size will shrink (it is not sampling noise). This is flagged as a
      candidate specification-tolerance ambiguity for the Coordinator to
      resolve via amendment before any re-run, not resolved unilaterally
      here.
