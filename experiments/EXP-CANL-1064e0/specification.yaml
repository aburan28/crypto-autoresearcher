experiment:
  id: EXP-CANL-1064e0
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-cfe576
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE PROPOSAL WITH THE OBSTRUCTION NAMED: only the CURVE lifts canonically, never the
    point -- and every canonical or CM-canonical source of global points (Teichmuller torsion section,
    O-multiples, Heegner points, a fixed Mordell-Weil basis) is a function of (E, O, K) ALONE, so
    its output set S has |S| independent of the target and hits a uniformly random Q with probability
    |S|/N; while every target-DEPENDENT lift is non-homomorphic and reinstates the formal-group defect
    syndrome of ECFG-P1543'
  status: draft
  objective: "(A) THE HONEST STARTING POINT THE LANE MUST STATE. Serre-Tate lifts the CURVE canonically.\
    \ IT DOES NOT LIFT POINTS. Any L9 proposal that speaks of \"the lifted points\" owes an account\
    \ of how the point was lifted and what freedom that left. This record supplies the account, and\
    \ it is a dichotomy.\n(B) THE ENUMERATION OF POINT-LIFTING ROUTES ON A CANONICAL LIFT. Five, and\
    \ the record claims the list is complete for constructions definable from (E, O, K, Q) by the\
    \ operations this program has catalogued -- a claim made explicitly so it can be refuted by exhibiting\
    \ a sixth.\n  (L1) TEICHMULLER / FINITE-ETALE TORSION SECTION. For N != p, Hensel\n    lifting\
    \ of the prime-to-p torsion gives a UNIQUE lift t: G -> Ẽ[N]\n    that is a group homomorphism\
    \ and preserves the scalar. Recorded at\n    ECFG-P1543-R0/R1: \"it is torsion, has zero canonical\
    \ height, is killed\n    by characteristic-zero logarithms, and retains the original order-N\n\
    \    relation problem.\" Canonical, and useless: hhat = 0, so it carries no\n    lattice information\
    \ at all.\n  (L2) O-MULTIPLES OF A LIFTED POINT. alpha P~ for alpha in O. By\n    IDEA-20260807-fd5a24\
    \ Lemma 2, hhat(alpha P~) = N(alpha) hhat(P~), so\n    every CM-generated companion is LONGER,\
    \ never shorter. The O-action\n    inflates heights and cannot produce a short witness.\n  (L3)\
    \ HEEGNER POINTS. The one genuinely CM-specific supply of global\n    points of controlled height,\
    \ defined over the ring class field of the\n    SAME order O, with a height formula (Gross-Zagier)\
    \ tying them to an\n    L-derivative. RECALLED, NOT READ, AND FLAGGED [open] AS TO WHETHER THE\n\
    \    CONSTRUCTION APPLIES TO THE CANONICAL LIFT ITSELF RATHER THAN TO A\n    MODULAR CURVE'S IMAGE.\
    \ Whatever the answer, the construction's inputs\n    are a modular curve, the field K and a level\
    \ -- NOT the target Q. It\n    produces ONE point (or an O(1) orbit), not a point above a prescribed\n\
    \    residue.\n  (L4) A FIXED MORDELL-WEIL BASIS. Express the target's lift in a known\n    free\
    \ basis. ECFG-P1543-R1's \"Mordell-Weil coordinate gate\": doing so\n    \"returns a coefficient\
    \ vector whose reduction is already a\n    multigenerator preimage of R\" -- i.e. computing the\
    \ coordinates IS the\n    discrete log. Circular.\n  (L5) AN ARBITRARY SET-SECTION (what Xedni\
    \ actually does). Lift the\n    x-coordinate to a small integer and solve for y over a chosen\
    \ global\n    curve. Target-dependent, and by ECFG-P1543-R1's homomorphism gate NOT a\n    group\
    \ homomorphism: the formal kernel is pro-p and has no nontrivial\n    N-torsion, so any homomorphism\
    \ from the order-N group into it is zero,\n    and every non-torsion section carries the defect\
    \ u(R) = s(R) - t(R)\n    which must be decoded jointly with the finite relation.\n\n(C) THE OBSTRUCTION,\
    \ NAMED. TARGET-INDEPENDENCE. Routes L1-L4 are all functions of (E, O, K) and of construction\
    \ parameters, but not of Q. Let S be the set of global points such a construction can output using\
    \ p^{o(1)} work. Then S is fixed before Q is seen, red(S) is a fixed subset of E(F_p), and for\
    \ a uniformly random target\n    Pr[Q in red(S)] = |red(S)|/N <= |S|/N = p^{-1+o(1)}.\nTHAT IS\
    \ THE WHOLE ARGUMENT AND IT IS TWO LINES. It does not depend on heights, on the coefficient bound\
    \ C_0, on the rank, or on CM; it depends only on counting. Route L5 escapes it -- it IS target-dependent\
    \ -- and pays instead with the pro-p homomorphism gate and the height budget of IDEA-20260807-6533fd.\
    \ SO THE DICHOTOMY IS: canonical implies target-independent implies success probability p^{-1+o(1)};\
    \ target-dependent implies non-homomorphic implies the defect syndrome plus a height budget of\
    \ Theta(N^{2/r}). CM CHANGES NEITHER BRANCH, because CM is a property of the curve and the branch\
    \ condition is about the point.\n(D) WHAT THE CLOSURE DOES AND DOES NOT COVER -- the forward guidance\
    \ the inventor protocol section 4 requires. STILL OPEN, and named concretely:\n  (i) A TARGET-DEPENDENT\
    \ NON-TORSION SECTION WHOSE DEFECT VALUES LIE IN A\n    COMPACT FAMILY WITH A JOINT DECODER. This\
    \ is verbatim the \"live\n    exception\" ECFG-P1543-R0 left open and R1 left \"unclassified\"\
    . It is\n    not closed here and this record does not claim to close it.\n  (ii) A CONSTRUCTION\
    \ USING A SECOND PRIME. Every route above is local at\n    p. A global object constrained simultaneously\
    \ at p and at an auxiliary\n    prime q has a target-dependent input at q and might evade the\
    \ counting\n    argument; nothing in this record bounds it.\n  (iii) A COMPRESSED REPRESENTATION\
    \ of high-height points (straight-line\n    programs, elliptic divisibility sequence indices,\
    \ theta coordinates),\n    which would break the height-to-bit-size step that the L5 branch\n\
    \    relies on. Named in IDEA-20260807-6533fd's proof_search_map as the\n    most valuable thing\
    \ to attack.\n  (iv) THE HEEGNER-POINT ROUTE AT ITS PROPER GENERALITY, which this record\n   \
    \ flags [open] rather than resolves, because the applicability of the\n    Gross-Zagier machinery\
    \ to the canonical lift is a literature question\n    this session did not verify.\nA CLOSURE\
    \ THAT NAMES FOUR SURVIVING CLASSES IS NOT A CLAIM THAT THE LANE IS DEAD. It is a claim that one\
    \ specific hope -- that CM makes the point lift canonical -- is refuted, with the reason stated."
  resource_label: 'R6 (characteristic-zero lifts and the reduction map) and R3 (End as a ring: the
    O-multiples of L2 and the ring class field of L3).'
  admissibility: admissible
  admissibility_argument: 'The argument is a counting argument about the image of a reduction map
    together with a structural statement about which constructions can depend on the target. No endomorphism
    is applied to a point of G. The record does however establish something adjacent to the admissibility
    filter and worth stating: the pro-p homomorphism gate (ECFG-P1543-R1) is the characteristic-zero
    ANALOGUE of H-ENDO-001''s scalar collapse -- in both cases the structure one hoped to import collapses
    because the target module has no N-torsion or only scalar N-torsion. The two obstructions are
    formally different and empirically consilient, and the record says so without conflating them.'
  reachability_gate: 'T5 EVALUATED, AND THIS RECORD REFRAMES IT. The move L9 wants is not curve-to-curve
    but point-to-point: from Q in E(F_p) to a global point above it. Cost of that move: for the canonical
    routes L1-L4 it is p^{o(1)} and it lands on the WRONG POINT with probability 1 - p^{-1+o(1)} --
    the object is cheap and useless. For route L5 the move is target-correct by construction and costs
    Theta(N^{2/r}) bits (IDEA-20260807-6533fd) plus an undecoded defect syndrome. So the T5 dichotomy
    resolves as: goodness (a global point above the prescribed Q) is NEITHER common enough to hit
    by random construction (density p^{-1+o(1)}) NOR locally detectable, because detecting that a
    global point reduces to Q requires having constructed it. Separately, the curve-side gate is priced
    in IDEA-20260807-ee6ef7 at p^{1+o(1)} for the generic curve and polylog(p) for h(disc End) = O(1);
    this record''s conclusion is unchanged in both regimes, because it never uses the curve''s cheapness.'
  inputs:
    procedure: 'STAGE 0 (zero compute, and it IS the main deliverable): write the signature table
      for L1-L5 and the two-line counting argument; audit each entry; record which are covered and
      which are not. STAGE 1 (hours): construct the finite-etale torsion lift at toy scale, run the
      homomorphism and order tests against the random-map null. STAGE 2 (hours): construct an arbitrary
      set-section, compute the defect, run the additivity test at increasing precision against the
      torsion- section null. STAGE 3 (minutes): measure |red(S)|/N for the bounded-cost outputs of
      L1, L2, L4. STAGE 4 (zero compute): the Heegner literature item, written to knowledge/literature/
      with verification status; [open] is an acceptable terminal state and must be reported as such.
      STAGE 5 (zero compute): write the closure to the section-4 standard.'
    mechanism: 'STEP 1 -- FORMALISE THE COUNTING ARGUMENT. Let C be a construction with signature
      (E, O, K, params) -> finite subset of Ẽ(H), computable in p^{o(1)} time, so |C(...)| = p^{o(1)}.
      red(C(...)) is a fixed subset of E(F_p). For Q uniform in G, Pr[Q in red(C(...))] <= p^{o(1)}/N.
      Conclude: the expected number of independent (E-preserving) re-randomisations needed is N^{1-o(1)}.
      Note the ONE loophole and close it explicitly: params could be searched, but searching params
      to hit Q is target-dependence smuggled in through the parameter, and the search itself costs
      |image|^{-1} tries -- so the argument is stable under parameter search. STEP 2 -- AUDIT EACH
      ROUTE AGAINST THE SIGNATURE. For L1-L5, write the input signature explicitly and mark target-dependence.
      This is a table, costs nothing, and is the deliverable''s core. STEP 3 -- VERIFY L1 CONSTRUCTIVELY
      AT TOY SCALE. Build the finite-etale torsion lift by Hensel lifting a point of E[N] to Z/p^n,
      confirm it is a group homomorphism (check t(P+Q) = t(P)+t(Q) on random pairs), and confirm its
      canonical height is zero by exhibiting its finite order. This turns P1543''s theorem into a
      checked fact in this campaign''s own harness. STEP 4 -- VERIFY THE PRO-p GATE CONSTRUCTIVELY.
      Take an arbitrary set-section s (naive x-lift), compute u(R) = s(R) - t(R) in the formal group,
      and confirm that u is NOT additive: exhibit R1, R2 with u(R1+R2) != u(R1) + u(R2). Then confirm
      the first-jet statement: [N] acts invertibly on E_1/E_2 for N != p, i.e. multiplication by N
      mod p is a unit. Both are short computations and both can fail. STEP 5 -- THE HEEGNER [open]
      ITEM. A literature check only, written to knowledge/literature/ with verification status: does
      any construction produce a global point on a CM curve whose reduction is a PRESCRIBED point
      of E(F_p)? If yes, this record is superseded. If no source says so either way, the item stays
      [open] and is reported as open. STEP 6 -- STATE THE CLOSURE TO THE PROTOCOL''S STANDARD: named
      obstruction (target-independence, plus the pro-p gate for the complementary branch), argument
      (Step 1), forward guidance (part D''s four classes).'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Random-map null for the homomorphism test (must fail).
  - Torsion-section null for the defect test (must pass additivity).
  - Xedni L5 calibration fixture (target-dependence must be detected).
  - Planted-target positive control (success probability must be 1).
  - 'NULL OBJECT (from the proposal): MANDATORY. For the constructive arms: the NULL OBJECT for Step
    3 is a RANDOM map G -> Ẽ(Z/p^n) with the same domain and codomain, subjected to the identical
    homomorphism test; it must FAIL the test, or the test cannot distinguish a homomorphism from noise.
    For Step 4 the null is the TORSION section itself, whose defect u is identically zero; the additivity
    test must PASS there and FAIL on the arbitrary section, or the instrument cannot see the defect.
    DECAY PARAMETER: n, the p-adic precision. The defect''s non-additivity must become MORE visible
    as n grows (it lives in higher jets); a non-additivity signal that does not grow with n is a rounding
    artifact of low precision and is the canonical artifact tell. POSITIVE CONTROL for the counting
    argument: plant a target inside red(S) by choosing Q := red(P~) for a P~ produced by construction
    C. Then the "attack" must succeed with probability 1, confirming that the counting argument''s
    failure mode is target selection and not implementation.'
  independent_variables: []
  metrics:
    primary:
    - Signature table with a covered/not-covered verdict per route
    - Homomorphism-test pass rate per n, both arms
    - Additivity-test pass rate per n, both arms
    - Order of the lifted point per n
    secondary:
    - '|red(S)|/N per route'
    - Literature verdict for the Heegner item with verification status
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'homomorphism test on the finite-etale torsion lift: fraction of random pairs (R1,R2)
      with t(R1+R2) = t(R1)+t(R2) in Z/p^n'
    formula: FORCED VALUE 1.000 exactly, at every precision n = 1..8. A single failure means the lift
      as implemented is not the finite-etale section.
    source: pre-registered in IDEA-20260807-cfe576 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Precision. The defect lives in higher jets; at n = 1 it can vanish spuriously. The n-ladder and
    the decay-parameter control address this.
  - Parameter search smuggling target-dependence. A construction with a searchable parameter is target-dependent
    in disguise; Step 1 closes this explicitly and the audit must apply the same test to parameters.
  - Overlap with ECFG-P1543. Re-verifying its statements in this harness is a check on THIS implementation,
    not independent confirmation of the mathematics; presenting it as the latter would be double counting.
  - The Heegner [open] item. Leaving it open is honest; quietly treating it as closed in a summary
    would misstate the closure's coverage.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: FORCED VALUE 1.000 exactly, at every precision n = 1..8. A single failure means
    the lift as implemented is not the finite-etale section.
  falsification_criterion:
  - The torsion lift fails the homomorphism test. The construction as implemented is not the finite-etale
    section; instrument failure under AGENTS.md rule 5.
  - The arbitrary set-section passes additivity at every precision. The pro-p gate as implemented
    does not bite and part (B)(L5) is wrong.
  - Any of L1-L4 is found to take Q as an input at p^{o(1)} cost. The closure has a hole at that route;
    it is reopened and this record is superseded.
  - A sixth route is exhibited. The enumeration is incomplete; same disposition, and the record explicitly
    invites this.
  - '|red(S)| = Omega(N) for a p^{o(1)}-cost construction. The counting argument is wrong.'
  - The random-map null passes the homomorphism test. The test does not discriminate and no conclusion
    may be drawn from any arm.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
