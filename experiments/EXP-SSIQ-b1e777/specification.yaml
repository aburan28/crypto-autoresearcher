experiment:
  id: EXP-SSIQ-b1e777
  hypothesis_id: H-SSIQ-545e66
  derived_from_idea: IDEA-20260821-e99afd
  question_id: RQ-SSIQ-9702af
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Heuristic validation of the conjugate-degree density law and calibration of the detection-cost
    exponent - exhaustive toy-scale measurement of four exponents with forced values, a random-target
    null whose forced value differs by 0.5, a planted-degree positive control, a symbolic three-slice
    reproduction gate against three published complexities, and exact minimal-degree ground truth that
    keeps the smoothness restriction out of the density measurement
  objective: >-
    The one uncertainty a run reduces - whether the density law that forces the incumbent's search radius
    to be optimal actually holds, and whether the detection-cost exponent that every record in this
    campaign has silently fixed at 1 really is 1 for the incumbent architecture. A run establishes (i)
    whether the closed-form exponent identity reproduces three published complexities exactly, which is a
    zero-compute stopping gate; (ii) the fitted density exponent against its forced value of 1.50, with
    the fitted prefactor's scaling in p as an independent second check, measured against EXACT minimal
    degrees computed without any smoothness restriction; (iii) the same exponent on a random-target null
    arm whose forced value is 2.00, so that the instrument can be shown to see target structure rather
    than list growth; (iv) the fitted detection-cost and memory exponents for the incumbent architecture
    against their forced value of 1.00, with residuals reported because a poor power-law fit is itself the
    finding that the exponent is not well defined; and (v) the measured location of the end-to-end optimum
    in units of log_p T against its forced value of 1/3, which is a prediction no factor-by-factor
    argument makes. NO ALGORITHM IS PROPOSED, no exponent is claimed to move, and nothing here says a
    lower exponent is reachable.
  what_this_is_not:
  - >-
    Not an attack, a break, a speedup, or a proposal of any algorithm. It measures two exponents of an
    EXISTING architecture and checks an accounting identity.
  - >-
    Not a claim that a lower exponent is reachable, likely, or nearly obtained. The arithmetic target
    alpha <= 3/4 is a TARGET and no mechanism meeting it is proposed.
  - >-
    Not a lower bound on the detection-cost exponent. The identity is SUFFICIENCY-ONLY - it converts an
    exponent into a cost and says nothing about which exponents are achievable.
  - >-
    Not a validation of the frozen source's own smoothness heuristic, which is INHERITED unchanged. No
    waiver is claimed and the inherited validation obligation is not discharged here.
  - >-
    Not an addition to the auxiliary-target census and not a reopening of the target-lattice lever.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
    been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the three executed toy primes, on the fully enumerated supersingular
      vertex sets, the conjugate-degree density exponent takes the measured value with the stated interval,
      the random-target arm takes its own measured value, the incumbent detector's cost and memory
      exponents take their measured values, and the end-to-end optimum sits at the measured location; and
      the exponent identity does or does not reproduce three published complexities symbolically. WHAT DOES
      NOT FOLLOW - nothing about cryptographic-scale primes except through H1's stated transfer assumption;
      no attack; no exponent movement; no lower bound on the detection-cost exponent; and no claim that any
      value of that exponent below 1 is achievable.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, hours, HARD STOPPING GATE). The symbolic reproduction check. Evaluate the
      exponent formula at the three published slices and confirm it returns 1/3, 1/2 and 1/2 exactly. Freeze
      the fixture. If any slice misses, STOP and record only that.
      STAGE 1 (small compute). At three pre-registered primes with log2 p in [20, 40], build the FULL
      supersingular vertex set, compute the minimal conjugate degree EXACTLY for every curve by breadth-first
      search over cyclic isogenies of increasing degree - feasible only at toy scale, which is the reason the
      scale is toy - and fit the density exponent and the random-target null exponent.
      STAGE 2. Implement the incumbent list-based detector at radius T, measure entries constructed and peak
      stored entries against T, and fit the cost and memory exponents.
      STAGE 3. End to end - measure total work against T and locate the argmin.
      STAGE 4 (zero compute). Report the four fitted exponents with intervals, the null separation, the
      prefactor's scaling across primes, and - REQUIRED - the residual plot of every power-law fit, because a
      poor fit is itself the finding that the cost exponent is not well defined.
    instrument: >-
      Full supersingular vertex-set construction and exhaustive breadth-first minimal-degree computation over
      cyclic isogenies; the incumbent list-based detector reimplemented at radius T in the frozen source's own
      cost unit (one field operation per table entry), declared once and used everywhere. Power-law fits by
      ordinary least squares on log-log data with confidence intervals from the fit and residuals retained in
      full. Curves with extra automorphisms are weighted by the inverse automorphism-group order in the mass
      formula and by 1 in a naive enumeration; ONE convention is declared and used. Recorded through
      harness/runner.py.
    parameters: >-
      Three primes with log2 p in [20, 40], pre-registered before any run. Radius ladder spanning at least
      1.5 decades per prime, truncated by degeneracy gates at both ends. Target arms - Frobenius conjugate
      (signal) and uniformly random supersingular curve (null), run at EVERY prime. Positive controls -
      curves with planted small minimal degree, generated by walking a fixed number of steps from the
      field-of-definition stratum, so the detector must succeed at a radius known in advance. Cost unit -
      one field operation per table entry. Vertex weighting - declared once and used consistently. THERE IS
      NO STANDARDIZED PARAMETER SET IN SCOPE; the cryptographic-scale arm described in H1's validation plan
      is NOT part of this contract and would require its own.
  controls:
  - >-
    RANDOM-TARGET NULL ARM, MANDATORY AND RUN AT EVERY PRIME. Replace the Frobenius conjugate by a uniformly
    random supersingular curve and run the IDENTICAL measurement. The forced values DIFFER and are derived
    before any run - for a random target the relevant lattice is the rank-4 connecting ideal of
    pair-independent determinant of order p squared, so the density exponent is 2.0 rather than 1.5. IF THE
    NULL ARM RETURNS 1.5, the instrument is measuring list growth rather than target structure and NO value
    of the cost exponent may be recorded.
  - >-
    SYNTHETIC CONTROL ON MATCHED UNIFORM OBJECTS. In addition to the random-target arm, draw the SAME
    statistic for genuinely uniform integers of matched size and for a matched random ternary form of
    determinant of order p, and confirm the fitting pipeline recovers the volume-heuristic exponent 3/2 on the
    synthetic form. This validates the sampler and the metric independently of the isogeny mathematics; a
    pipeline that cannot recover 3/2 on a form where 3/2 is true by construction cannot test it where it is
    in question.
  - >-
    PLANTED-DEGREE POSITIVE CONTROL. Curves with planted small minimal conjugate degree, generated by walking
    a known number of steps from the field-of-definition stratum, so the detector must succeed at a radius
    known in advance. A detector that never fires on a planted instance is broken and NO negative may be read
    from it.
  - >-
    INSTRUMENT-FIDELITY REGRESSION. Reproduce the committed list-cardinality scaling of the incumbent detector
    before any exponent is fitted.
  - >-
    DEGENERACY GATES. Discard radius values where the count is below 5 or above 10 percent of the whole vertex
    set. Both ends destroy the power law for reasons that have nothing to do with the mathematics, and
    discarding them is a pre-declared rule rather than a post-hoc trim.
  - >-
    EXACT-DEGREE GROUND TRUTH, WHICH IS THE CONTROL THAT PREVENTS THE NAMED OBSERVABLE COLLISION. The density
    exponent is measured against minimal degrees computed EXACTLY by exhaustive search with NO smoothness
    restriction, while the cost exponent is measured against the smoothness-restricted implementation.
    Conflating them would measure the PRODUCT of two exponents and manufacture a spurious value.
  independent_variables:
  - 'radius T, over a ladder spanning at least 1.5 decades per prime'
  - 'prime p, three values with log2 p in [20, 40]'
  - 'target arm: Frobenius conjugate (signal) / uniformly random supersingular curve (null) / matched random ternary form (synthetic)'
  - 'ground-truth mode: exact minimal degree by exhaustive search / smoothness-restricted detector'
  - 'instance class: uniformly sampled vertex / planted small-degree positive control'
  metrics:
    primary:
    - >-
      beta_hat - dimensionless. Fitted slope of log Pr[minimal conjugate degree <= T] against log T over
      uniformly sampled supersingular curves at fixed toy p, with the minimal degree computed EXACTLY and
      without smoothness restriction, reported with a confidence interval per prime. FORCED VALUE 1.50.
    - >-
      beta_hat_null - dimensionless. The same fitted slope with the target replaced by a uniformly random
      supersingular curve, per prime, with a confidence interval. FORCED VALUE 2.00, and required to exceed
      beta_hat by at least 0.35 with non-overlapping intervals.
    - >-
      alpha_hat - dimensionless. Fitted slope of log(entries constructed by the incumbent detector) against
      log T at fixed toy p, per prime, with a confidence interval and its RESIDUALS. FORCED VALUE 1.00.
    - >-
      argmin_location - in units of log_p T. The measured location of the minimum of end-to-end total work
      (attempts times per-attempt entries) against T, per prime. FORCED VALUE 1/3.
    - >-
      three_slice_reproduction - PASS or FAIL per slice, three slices. Symbolic, zero compute, and the
      experiment's stopping gate.
    secondary:
    - >-
      mu_hat - dimensionless. Fitted slope of log(peak stored entries) against log T, per prime. FORCED
      VALUE 1.00 for the incumbent architecture.
    - >-
      density_prefactor_scaling - the fitted prefactor of the density law at each prime and its fitted
      scaling exponent in p, which must be -1/2. This is a SECOND, INDEPENDENT check on the same law and is
      not implied by beta_hat.
    - >-
      fit_residuals - the full residual series of every power-law fit, reported and not summarised, because a
      poor fit is the finding that the exponent is not well defined.
    - >-
      synthetic_control_exponent - the fitted density exponent on a matched random ternary form where 3/2 is
      true by construction.
    - >-
      positive_control_fire_rate - the fraction of planted instances on which the detector fires at the
      planted radius.
    - >-
      admissibility_score - the value of 2 alpha_hat + mu_hat, reported against the threshold 3, which is the
      single inequality separating an improvement over the memory-time frontier from a point on it.
    - >-
      degeneracy-gated radius values, enumerated with the count at each, so the reader sees what was excluded
      and why.
  heuristic_under_test: H1
  heuristic_under_test_note: >-
    THIS IS A HEURISTIC-VALIDATION EXPERIMENT AND H1 IS ITS SUBJECT. H1 is stated formally, with quantifiers
    and uniformity range, in H-SSIQ-545e66. Its forced value is 3/2 and its null's forced value is 2.0, so the
    two arms differ by 0.5 and a common-cause artifact cannot produce both. H2, the inherited smoothness
    heuristic, is NOT under test here - it is inherited unchanged, no waiver is claimed, and any candidate
    detector operating below the incumbent's radius exponent must extend the incumbent's own validation to its
    own exponent. Recorded so a later record cannot treat that extension as free.
  preregistered_prediction:
    quantity: >-
      Four quantities, fixed before any run exists - beta_hat, beta_hat_null, alpha_hat and argmin_location.
    formula: >-
      Under H1 the proportion of supersingular curves admitting a conjugate isogeny of degree at most T is of
      order T^{3/2} p^{-1/2}, so beta_hat is PREDICTED at 1.50 and the fitted prefactor is PREDICTED to scale
      as p^{-1/2}. For a uniformly random target the relevant lattice has rank 4 and pair-independent
      determinant of order p squared, so the count is of order T^2/p and beta_hat_null is PREDICTED at 2.00.
      The incumbent detector materialises a list whose cardinality is linear in the radius and spends constant
      work per entry, so alpha_hat and mu_hat are PREDICTED at 1.00. The total cost is
      p^{1/2+o(1)} T^{alpha-3/2} below the boundary and increasing above it, so argmin_location is PREDICTED
      at 1/3. TOLERANCES, DECLARED IN ADVANCE - 0.10 on beta_hat, 0.05 on alpha_hat and mu_hat, 0.05 on
      argmin_location, and a required separation of at least 0.35 between beta_hat and beta_hat_null with
      non-overlapping intervals.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-e99afd, predictions block, before any run under this
      contract exists. The forced value 3/2 is derived from the rank-3 trace-zero lattice normalisation and is
      cross-checked by the requirement that it return expected count exactly 1 at the structural boundary,
      reproducing the committed threshold. The forced value 2.0 is derived from the rank-4 connecting-ideal
      determinant recorded in a sibling record's census. Neither is tuned to data and neither may be adjusted
      after a run except through a versioned amendment.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at three primes with log2 p between 20 and 40, which is six to twelve orders of magnitude below
      cryptographic parameters. THE TOY SCALE IS FORCED BY THE MEASUREMENT ITSELF, not chosen for convenience -
      the density law must be measured against EXACT minimal degrees, and exact minimal degrees require
      exhaustive breadth-first search over cyclic isogenies across the WHOLE vertex set, which is feasible only
      here. That is also why the measurement is exhaustive rather than sampled, and hence why its sampling
      error is zero and its only error is the fit's. TRANSFER ASSUMPTIONS, RECORDED RATHER THAN SMUGGLED -
      (T1) uniform random maximal orders correspond to supersingular curves weighted by the inverse
      automorphism-group order and not uniformly; (T2) a toy-scale fit transfers to cryptographic scale only
      under the assumption that the EXPONENT, not merely the constant, is stable, which this contract does NOT
      establish; (T3) the identification of lattice minima with isogeny degrees is the frozen source's
      isometry, assumed and not re-proved. A CRYPTOGRAPHIC-SCALE ARM IS DESCRIBED IN H1'S VALIDATION PLAN - a
      Deuring-route lattice-point count at standardized primes - AND IS EXPLICITLY OUT OF SCOPE HERE; it needs
      its own contract, and this one must not be cited as having discharged it.
    correspondence: >-
      The Deuring correspondence between supersingular curves and maximal orders is what would permit sampling
      at cryptographic parameters without enumerating a graph, by sampling maximal orders directly and counting
      lattice points of bounded norm in the rank-3 trace-zero lattice. That route is NAMED here because it is
      the scale-access mechanism a follow-on contract must use, and it is NOT used in this contract.
  tail_checks:
  - >-
    THE RARE-EVENT LOWER TAIL IS UNOBSERVABLE AT CRYPTOGRAPHIC SCALE AND IS ONLY MARGINALLY OBSERVABLE HERE.
    Report, per prime, the number of curves in the smallest three radius bins; a bin with fewer than 5 curves
    is degeneracy-gated out and its exclusion is reported, not silently applied.
  - >-
    UPPER-TAIL SHARPNESS, WHICH IS WHERE THE CHECK IS FALSIFIABLE. ZERO curves may have minimal conjugate
    degree exceeding the structural threshold - that is a theorem, and any violation is an INSTRUMENT BUG that
    voids the run rather than a finding about the mathematics.
  - >-
    Report the observed fraction of curves with minimal degree above 0.9 times the structural threshold and
    compare it against the value the fitted law predicts; a mismatch there is sharp because the count is large.
  - >-
    Report the SMOOTHEST and the LARGEST observed minimal degree per prime against the probability the fitted
    law assigns them, so an extreme sample that the law says should not exist is visible.
  - >-
    Report beta_hat separately on the upper and lower halves of the radius ladder. A law whose fitted exponent
    differs materially between halves is not a power law over the range and a single beta_hat must not be
    quoted.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Each of the three primes is measured at all three seeds. The vertex-set enumeration and the exact
      minimal-degree computation are deterministic and must agree bit-for-bit across seeds; the seeds control
      the uniform sampling of the random-target null arm, the planted-control generation and the synthetic
      control's form draw. Signal and null arms at a given prime always share a seed so the comparison is
      paired.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 24.0
    maximum_memory_gb: 16
    maximum_runs: 24
  stopping_rules:
  - >-
    HALT at Stage 0 if the symbolic three-slice reproduction fails at any slice. The identity is wrong and
    nothing else is recorded.
  - >-
    HALT if the positive control's fire rate is materially below 1 at the planted radius. The detector is
    broken and NO negative may be read from any arm.
  - >-
    HALT if the instrument-fidelity regression against the committed list-cardinality scaling fails, before any
    exponent is fitted.
  - >-
    Stop at the three pre-registered primes and the declared radius ladder. Adding a prime or extending the
    ladder after seeing a fit is a different experiment and needs an amendment.
  - >-
    If a prime's exhaustive minimal-degree computation exceeds its per-prime wall-clock allowance, record that
    prime as BUDGET-STOPPED and report the fits on the primes that completed, with the reduced prime count
    stated. Budget exhaustion is a stop, never a negative result (AGENTS.md rule 5), and a fit on fewer than
    two primes may not be reported as a density-law test at all.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is NEVER
    negative mathematical evidence (AGENTS.md rule 5). In particular a prime whose enumeration did not finish
    is NOT evidence against H1.
  - >-
    A run whose null arm is missing, or whose null arm was not executed in the same invocation and at the same
    seed as the signal arm, is invalid_measurement - the comparison the contract exists to make was not made.
  - >-
    A run that measures the density exponent against SMOOTHNESS-RESTRICTED degrees is invalid_measurement. That
    measures the product of two exponents and returns a number that is neither; the named observable collision
    binds this contract.
  - >-
    A run that mixes vertex weightings - inverse automorphism order in one place and naive enumeration in
    another - is invalid_measurement. At toy primes this is a visible constant.
  - >-
    A run that changes the declared cost unit between arms or between stages is invalid_measurement. The
    identity is invariant under a p^{o(1)} change of unit but a MEASURED exponent is not.
  - >-
    A run reporting a single fitted exponent while its residuals show the fit is not a power law over the range
    is invalid_measurement; the residual plot is a required artifact for exactly this reason.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    ALL SIX of the following, each decidable from the primary metrics. (1) three_slice_reproduction is PASS on
    all three slices. (2) The instrument-fidelity regression passes and positive_control_fire_rate is at its
    required level. (3) beta_hat is reported with a confidence interval at every completed prime, measured
    against exact minimal degrees, together with density_prefactor_scaling across primes. (4) beta_hat_null is
    reported at every completed prime from an arm run in the same invocation and at the same seed. (5)
    alpha_hat, mu_hat and argmin_location are reported with intervals at every completed prime. (6) The full
    residual series of every fit and the enumerated degeneracy-gated radius values are archived. NOTE that
    success means THE MEASUREMENT WAS MADE AND ITS CONTROLS PASSED; whether H1 is supported is decided by the
    pre-registered prediction and the falsification criteria, and a completed run refuting H1 is a successful
    run and the most valuable outcome available.
  falsification_criterion:
  - >-
    beta_hat differs from 1.50 by more than 0.10 at two or more primes with the positive control passing - H1
    IS FALSE AT THE TESTED SCOPE. This is the most valuable available outcome: the density law is what forces
    the structural boundary to be optimal, so its failure reopens the radius levers this hypothesis claims to
    close and puts a question against the frozen source's own choice of boundary.
  - >-
    beta_hat_null falls within 0.35 of beta_hat, or their intervals overlap - the instrument does not separate
    planted target structure from list growth and NO exponent is recorded.
  - >-
    alpha_hat differs from 1.00 by more than 0.05 for the incumbent architecture with the cardinality
    regression passing - the calibration that licenses the whole family formula is absent.
  - >-
    three_slice_reproduction FAILS at any slice - the identity is wrong and nothing else is recorded.
  - >-
    The residuals show the detector's cost is not a clean power of T over the range - the closed form does not
    apply, the residual plot IS the finding, and a single alpha must not be reported.
  - >-
    Any sampled minimal conjugate degree exceeds the structural threshold - an instrument bug; the run is void
    and nothing about the mathematics is concluded.
  - >-
    The synthetic control fails to recover 3/2 on a matched random ternary form where 3/2 is true by
    construction - the fitting pipeline cannot measure the quantity and no exponent is reportable.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and
    environment
  - >-
    raw-result.json carrying every per-curve minimal degree and every per-radius count, not summaries
  - >-
    the null arm's and the synthetic control's measurements, in the same file as the signal arm and at the same
    seeds
  - >-
    the full residual series of every power-law fit
  - >-
    the frozen Stage-0 symbolic fixture with its three asserted slice values, hashed, written before any
    measurement
  - >-
    the enumerated degeneracy-gated radius values with the count at each
  - >-
    the declared cost unit and vertex-weighting convention, recorded once and referenced by every stage
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because
    it authorizes execution and spends compute.
  - >-
    The parent proposal is proof-oriented and carries a proof_search_map, inherited into H-SSIQ-545e66; it must
    be audited against KN-TECH-080 before implementation.
  - >-
    A Coordinator should read the nearest prior record on the first moment of smooth conjugate isogenies BEFORE
    approving, because H1 may already be stated there with its radius dependence, in which case H1's status is
    'restated with a validation route and a null' and this contract should say so on its face.
  - >-
    The cryptographic-scale arm of H1's validation plan is OUT OF SCOPE for this contract. If the Coordinator
    wants it, it needs its own contract; approving this one does not authorize it.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260821-e99afd
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's minimal_test, controls,
      required_metrics, predictions, falsification_conditions and heuristic_assumptions, and restated as a
      contract. The heuristic-validation obligations - formally stated heuristic, pre-registered prediction with
      a named source, scale access and transfer assumptions, sample-size justification, comparison metric and
      tail checks, and a synthetic control on matched uniform objects - are supplied per the design-experiment
      skill. Boilerplate identical across contracts by program rule comes from a fixed table. Budgets come from
      the parent's declared estimated_cost (implementation medium, compute low), raised for the exhaustive
      minimal-degree computation which is the dominant cost. NO NUMBER IS INVENTED and no measurement is
      asserted; every forced value here is a DERIVED prediction, not an observation.
  derivation_gaps:
  - >-
    The three primes are described as pre-registered but are not enumerated here. They must be fixed before any
    run, because a prime chosen after seeing a fit at another prime is a prime chosen to suit the fit.
  - >-
    The SAMPLE-SIZE JUSTIFICATION is structural rather than numeric in this contract - the measurement is
    EXHAUSTIVE over the whole vertex set, so the smallest resolvable probability is one over the vertex count
    and the degeneracy gate at 5 curves per bin is what sets the usable lower end of the radius ladder. The
    exact vertex counts and hence the exact lowest resolvable radius per prime cannot be stated until the primes
    are fixed, and must be recorded in Stage 0.
  - >-
    Toy-scale dynamic range is the design's known weak point - at the small end of the prime range the whole
    radius span is about two octaves and a slope of 1.5 is hard to separate from 1.3. Three primes and reported
    intervals are the mitigation; a single-prime point estimate would be worthless, and the contract's stopping
    rule refuses to report a density-law test on fewer than two completed primes.
  - >-
    The exact smoothness bound used by the smoothness-restricted detector arm is not fixed here. It must be
    declared in Stage 0, because it sets what the cost exponent is an exponent OF, and changing it between
    radius values would manufacture a spurious slope.
  - >-
    A sibling record's clustering result predicts that the per-curve first moment may NOT be tight, which is
    the specific way beta_hat could miss 1.5. Two records will then have made opposite predictions about the
    same measurement. That is a feature and it is recorded here so the outcome is read as a resolved
    disagreement rather than as a surprise.
