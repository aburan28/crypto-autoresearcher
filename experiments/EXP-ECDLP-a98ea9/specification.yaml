experiment:
  id: EXP-ECDLP-a98ea9
  hypothesis_id: H-ECDLP-07c7c6
  version: 1
  title: >-
    Majority advantage of p-adic digit statistics of the canonical
    prime-to-p lift, against their own r = 1 shadow - with a blocking k-free
    transport gate, a precision null that strips the order-n projection, a
    PLANTED-ADVANTAGE LADDER measuring the estimator's resolution, and a
    curve-free multiplicative arm carrying a pre-declared consequence
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Decide, on a toy family with exactly computed statistics, whether the
    precision-r digit family of the canonical prime-to-p lift supplies any
    majority advantage along the discrete-log coordinate beyond its own r = 1
    shadow. First establish, as a blocking gate, that the digits are
    computable from the F_p point alone with the scalar structurally
    withheld; then measure the advantage against two nulls, one comparator,
    two blocking positive controls and a graded planted-advantage ladder;
    then check that it decays like n^{-1/2}. This contract is DRAFT and
    confers no execution authority.

  preregistered_prediction:
    quantity: >-
      ADV(v, n, s, r) = q_maj(v) - 1/s, the majority advantage of statistic v
      at subgroup order n, image size s and precision r; a DIMENSIONLESS
      probability difference, computed EXACTLY by complete enumeration of the
      prime-order subgroup rather than sampled. Secondary: beta, the fitted
      exponent in ADV proportional to n^{-beta}, dimensionless; and the
      digit-for-digit AGREEMENT RATE between two computation paths, a
      dimensionless rate in [0,1].
    formula: >-
      PRE-REGISTERED TWO-BRANCH RULE on
      D = ADV(digit statistic) - ADV(x-bucket comparator) at matched (n, s):
      |D| <= 0.01 at every tested (n, s, r) records CLOSURE; |D| >= 0.05 at
      three or more prime orders, not reproduced by either null and not
      decaying in n, records LEAD and triggers mandatory independent review;
      strictly between is INCONCLUSIVE, declared in advance.
      Separately FORCED: the transport agreement rate is EXACTLY 1.000; the
      known-answer calibration statistic takes EXACTLY TWO distinct values
      with the large value on exactly the plus-or-minus fibre; beta is
      consistent with 1/2 for the comparator; the planted-advantage ladder is
      recovered rung by rung within bootstrap intervals.
    source: >-
      The n^{-1/2} scale and the estimator are taken from a sibling record's
      sub-result on coordinate-derived statistics, which is a PREDICTION in
      that record rather than a validated finding. The exact-agreement
      prediction follows from the transport lemma. The two-valued calibration
      follows from the already-disposed first disjunct of the audited
      hypothesis. The 0.01 and 0.05 tolerances are PRE-REGISTERED CHOICES at
      the n^{-1/2} scale, not measurements, and are deliberately the same
      shape as a sibling lane's bands so the lanes stay comparable.

  inputs:
    curves: >-
      Curves with good reduction and a Weierstrass model over Z_p with
      v_p(discriminant) = 0; anomalous and smooth-order curves EXCLUDED
      before entering the run set. The anomalous case is doubly excluded:
      there a generator has order p, gcd(n, p) = 1 fails, and the canonical
      order-n lift DOES NOT EXIST, so the statistic is undefined rather than
      uninformative.
    subgroup_orders: >-
      At least six PRIME orders spanning at least a 6x range in the 16 to 26
      bit band, each COMPLETELY ENUMERABLE so q_maj is exact.
    precisions: "r in {1, 2, 3, 4}"
    image_sizes: "s in 2..8"
    statistic_ladder: >-
      T1 the j-th p-adic digit of the x-coordinate of the lift for j in
      {0,1,2}, bucketed into s classes; T2 the quadratic character of the
      j-th digit; T3 the leading-digit interval bucket at precision r; T4 the
      pair (digit_0, digit_1) bucketed; T5 the valuation of a coordinate
      difference against a fixed reference, included ONLY as a known-answer
      calibration.

  independent_variables:
    - "statistic v in the declared ladder, plus the comparator, the nulls, the positive controls and the planted rungs"
    - "precision r in {1,2,3,4}"
    - "image size s in 2..8"
    - "prime subgroup order n across the declared band"
    - "ambient object: elliptic-curve arm versus curve-free multiplicative arm"
    - "subgroup order type: prime versus composite (control C)"

  null_object:
    name: >-
      NULL-2, THE PRECISION NULL - a Hensel lift WITHOUT the order-n
      projection - which is the record-specific null and the one that
      separates the object from its ambient arithmetic; together with NULL-1,
      the matched image-size keyed random function.
    construction: >-
      NULL-2. Replace the true canonical lift by a WRONG lift: Hensel-lift
      the point to E(Z/p^r Z) and STOP, omitting the [p^{r-1}] projection and
      the multiplication by the inverse of p^{r-1} mod n. The resulting point
      still reduces correctly, is still computable at the same cost, and
      still has r digits - but it carries a formal-group component and is NOT
      the canonical order-n lift. Every statistic in the ladder is then
      recomputed on it through the identical estimator.
      NULL-1. A keyed pseudorandom function of the point encoding, truncated
      to the SAME image size s as the statistic under test, run through the
      identical estimator over many seeds; its empirical distribution of
      advantages is the reference for "no structure" and its maximum over an
      equal number of replicates is the tail reference.
    non_degeneracy_check: >-
      REQUIRED AND PERFORMED, AND IT IS NOT VACUOUS HERE. NULL-2 can differ
      from the treatment: the two differ by an actual group-theoretic
      operation - killing the p-power component - so their digit vectors
      differ at every precision r > 1, and their advantages are computed
      independently rather than related by construction. AT r = 1, HOWEVER,
      NULL-2 AND THE TREATMENT COINCIDE EXACTLY, because the projection is
      vacuous at precision 1; that cell is therefore a WIDTH-ZERO comparison
      and is declared in advance as a CONSISTENCY CHECK (the two must agree
      exactly at r = 1) rather than as a discriminating cell. Reporting r = 1
      agreement between treatment and NULL-2 as evidence would be reporting a
      forced identity. The discriminating cells are r in {2,3,4}, and the
      Stage 0 gate records this split before any number is read.
      NULL-1 is non-degenerate for the ordinary reason: a keyed random
      function's advantage is a random variable with a known spread, and the
      comparison is against its empirical distribution rather than against a
      point.
    dynamic_range_demonstration: >-
      A PLANTED-ADVANTAGE LADDER AT FOUR KNOWN EFFECT SIZES, which is this
      contract's addition and which fills the gap the source control set
      leaves. The source has only two rungs - a null at advantage 0 and a
      planted positive at about 0.5 - and nothing in between, so it can show
      that the estimator distinguishes "nothing" from "everything" but not
      that it can resolve an effect at the size of its own 0.01 closure
      threshold. THE LADDER: construct statistics with KNOWN, TUNABLE
      advantage by mixing the discrete-log interval bucket (advantage near
      0.5, flat in n) with the keyed random function (advantage 0) at
      declared mixing weights w in {1.0, 0.2, 0.06, 0.02}, giving planted
      advantages of approximately 0.5, 0.1, 0.03 and 0.01. FORCED: each rung
      is recovered within its bootstrap 95 percent interval at the largest
      tested n. THE CONSEQUENCE IS BINDING: if the smallest rung - planted at
      the size of the closure threshold itself - is NOT recovered, then the
      pipeline cannot resolve the effect it would have to rule out, the
      closure threshold is RAISED to the smallest recoverable rung, and that
      change is recorded as a versioned protocol amendment BEFORE any digit
      arm is read. A closure declared at a threshold below the instrument's
      measured resolution is not a closure.
    curve_free_null: >-
      REQUIRED, AND IT IS THE ARM THAT DECIDES WHAT THIS EXPERIMENT IS ABOUT.
      The transport lemma's structure is a statement about a finite abelian
      group splitting as its prime-to-p part times a p-group kernel; nothing
      in it is specific to elliptic curves. THE ARM: the multiplicative
      analogue. Take the group (Z/p^r Z)^*, its prime-to-p part, a generator
      g of the order-n subgroup of (Z/p Z)^*, and the canonical prime-to-p
      lift of g^k; apply the IDENTICAL statistic ladder to the digits of that
      lift and the IDENTICAL estimator, at matched n, s and r. Both the
      transport procedure and the advantage measurement are run.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, BEFORE ANY CELL RUNS, AND BINDING. If the
      multiplicative arm reproduces the CLOSURE branch - digit statistics at
      their own r = 1 shadow, decaying like n^{-1/2} - then the closure
      branch is a statement about prime-to-p lifts in FINITE ABELIAN GROUPS
      generally and NOT about elliptic curves, and it must be headlined as
      such: no evidence record, decision, or downstream citation may present
      it as a statement about elliptic curves or the ECDLP. Only a MEASURED
      DIFFERENCE between the elliptic arm and the multiplicative arm carries
      curve content, and any such difference is routed to independent review
      before interpretation rather than reported as a finding. STATED SO IT
      CANNOT BE PRESENTED AS A SURPRISE LATER: the closure branch is EXPECTED
      to reproduce in the multiplicative arm, so this experiment is expected
      to produce a statement about finite abelian groups. That expectation is
      recorded here, before the run.

  controls:
    - >-
      TRANSPORT GATE (blocking, Stage 1, hard): compute the lift TWICE - once
      by lifting and multiplying by k, once by the k-free procedure applied
      to the F_p point alone - and require EXACT digit-for-digit agreement at
      every tested r. A disagreement STOPS the record and is archived
      verbatim as the refutation artifact.
    - >-
      STATIC PROVENANCE GATE (blocking): a static check that the transport
      code path NEVER READS k. A statistic that reads k is measuring its own
      input.
    - >-
      NULL-1, MATCHED IMAGE-SIZE KEYED RANDOM FUNCTION (blocking). Decay
      parameter: sample size; a finite-sample advantage shrinks like
      M^{-1/2} and a real one does not.
    - >-
      NULL-2, THE PRECISION NULL (blocking, record-specific). See
      null_object, including the declared r = 1 width-zero cell.
    - >-
      COMPARATOR (blocking, and the primary axis of comparison): the plain
      x-coordinate bucket at matched s - the object's own r = 1 shadow - on
      the identical estimator and the identical curves. REPORTING A DIGIT
      ADVANTAGE WITHOUT THIS COMPARATOR IS PROHIBITED.
    - >-
      POSITIVE CONTROL A (blocking, known-answer): the valuation statistic
      whose behaviour is already predicted exactly - two-valued, large on
      exactly the plus-or-minus fibre. An instrument that cannot see the one
      p-adic statistic whose answer is known cannot be trusted on the ones
      whose answer is not.
    - >-
      POSITIVE CONTROL B (blocking, maximal end): the discrete-log interval
      bucket, whose advantage sits near 0.5 flat in n. The estimator must
      recover it.
    - >-
      PLANTED-ADVANTAGE LADDER at four declared rungs (blocking). See
      null_object.
    - >-
      CONTROL C, COMPOSITE-ORDER SUBGROUP at matched size, where the
      prime-order homomorphism argument must FAIL and a genuine nontrivial
      homomorphism exists. If the pipeline reports the same pinning there, it
      is measuring its own default path.
    - >-
      r = 1 FIXTURE AGREEMENT (blocking) with the sibling record's committed
      x-bucket values at matched (p, s), in exact arithmetic, read from that
      record's own text. NOTE THAT RECORD'S CAVEAT AGAINST ITSELF: those
      curves were used at full COMPOSITE group order, so this is a PIPELINE
      CHECK and not evidence about the prime-order theory.
    - >-
      ANOMALOUS NON-GENERATOR CALIBRATION (Stage 5, only if the LEAD branch
      fires): a non-generator of prime-to-p order on an anomalous curve,
      where the object is defined while the additive transfer still applies
      to the full group. Whether it is a useful calibration is itself
      reported.
    - >-
      CURVE-FREE MULTIPLICATIVE ARM (blocking) with the pre-declared
      consequence above.

  metrics:
    primary:
      - "ADV(v, n, s, r) = q_maj - 1/s per (statistic, precision, image size, order); DIMENSIONLESS probability difference, computed EXACTLY by complete enumeration, with the estimator named"
      - "D = ADV(digit statistic) - ADV(comparator) at matched (n, s); dimensionless; the two-branch rule is applied to this"
      - "transport agreement rate between the two computation paths, per r; dimensionless rate in [0,1]; FORCED exactly 1.000"
      - "beta, the fitted decay exponent in ADV proportional to n^{-beta}, per statistic; dimensionless; with fit residuals and a bootstrap interval"
      - "planted-advantage ladder: recovered advantage versus planted advantage per rung; dimensionless, with bootstrap intervals"
      - "curve-free multiplicative arm: ADV, D and beta at matched (n, s, r); dimensionless; and the branch classification it produces"
    secondary:
      - "the known-answer calibration's value SET and the fibre its large value occupies; a set of integers plus a subset of Z/n"
      - "NULL-1 empirical advantage distribution and its maximum over replicates, per (n, s); dimensionless"
      - "NULL-2 advantage at matched (n, s, r); dimensionless; plus the FORCED r = 1 identity check"
      - "CONTROL C composite-order advantage; dimensionless"
      - "static provenance gate result; boolean"
      - "wall-clock seconds and peak RSS in GiB per stage, and the p-adic precision actually reached"
      - "the r^3 cost factor: measured per-evaluation cost of a digit statistic against the coordinate it is a function of; dimensionless ratio"
      - "pass or fail of every blocking gate, listed individually"

  heuristic_under_test: HEUR-PADIC-2

  scale_relevance:
    tier: toy
    justification: >-
      Prime subgroup orders in the 16 to 26 bit band, complete enumeration so
      q_maj is EXACT and no estimator variance competes with the n^{-1/2}
      effect being measured. THE LADDER IS DECLARED AT 16-26 BITS AND NOT AT
      THE SOURCE PROPOSAL'S "UP TO ABOUT 30 BITS", AND THE REDUCTION IS
      STATED RATHER THAN MADE SILENTLY: exact enumeration at n near 2^30 with
      per-target counters and the estimator's working set does not fit the
      declared 16 GB memory, so the 27-30 bit cells are NOT TESTED and would
      require a separate budget. The declared band still spans a factor of
      1024, far exceeding the 6x range the decay fit needs. NO TRANSFER TO
      CRYPTOGRAPHIC n IS CLAIMED OR LICENSED. Separately and more
      fundamentally: THE PRECISION SCHEDULES r(n) GROWING WITH n, which the
      open sub-question actually contemplates, CANNOT BE TESTED BY THIS
      DESIGN AT ANY BUDGET, because exactness requires complete enumeration
      and complete enumeration caps n; that is a real gap between what is
      measured and what is asked.
    correspondence: null

  tail_checks:
    - "The single largest advantage observed across all cells against the largest observed across an equal number of NULL-1 replicates; a real effect shifts the distribution, not one cell."
    - "The largest r-slope observed over all (n, s) cells against the largest slope over NULL-2 replicates; a positive r-slope is the lead signature and must be separated from Hensel-arithmetic drift."
    - "The largest image size s = 8 at the smallest n, where the image is the largest fraction of the group and the bias TOWARD apparent structure is strongest."
    - "The smallest planted rung, at the size of the closure threshold itself, reported individually with its interval - it decides whether the threshold is honest."
    - "The 99th percentile of the NULL-1 advantage distribution at each n, so the closure band can be compared against the null's own spread rather than against zero."

  replication:
    seeds: [3, 5, 7, 11, 13, 17, 19, 23]
    independent_instances: 6
  seeds_policy: >-
    Eight declared seeds, fixed here before execution and never re-drawn
    after an outcome is seen. Seeds govern ONLY the keyed random function of
    NULL-1, the mixing draws of the planted-advantage ladder, and the
    sampling of k for the transport gate; the ADVANTAGE ITSELF IS NOT SEEDED,
    because it is computed by complete enumeration of the subgroup and is
    therefore exact - there is no estimator variance to average over and no
    seed can change a reported ADV value. That is the design's reason for
    capping the field-size ladder, and it means a "replication" here is a
    fresh curve at a fresh prime order rather than a re-seed. THE SCALAR k IS
    KNOWN TO THE HARNESS for enumeration and for the known-answer
    calibration, and is STRUCTURALLY WITHHELD from every statistic and from
    the transport code path; the static provenance gate over that path is
    blocking. Every cell record carries (curve, p, n, s, r, statistic, seed,
    RNG algorithm and state).

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 16
    maximum_runs: 10
    maximum_workers: 1
  budget_note: >-
    Sized to the work rather than to a tool window. The dominant cost is
    complete enumeration of a prime-order subgroup with per-element digit
    computation at precision up to 4: O(n * r * log^2 p) bit operations and
    O(n) memory per cell. At the top of the declared band, n near 2^26, the
    enumeration holds on the order of 10^8 counters and comfortably fits 16
    GB; at 2^30 it would not, which is exactly why the band stops at 26 bits
    and why that reduction is disclosed in scale_relevance rather than
    applied silently. Peak RSS is a required metric so the envelope
    prediction can fail. Exceeding the budget before the ladder resolves is
    an INFRASTRUCTURE outcome under AGENTS.md rule 5, never evidence about
    the digit family.

  stopping_rules:
    - "STAGE 0, zero compute, HARD GATE: write the transport lemma with its projection step in full, including the vacuous r = 1 case; state where gcd(n, p) = 1 is used; write the prime-n homomorphism argument; and record the declared r = 1 width-zero cell of NULL-2 so it is never read as discriminating."
    - "STAGE 1, HARD GATE: the transport gate and the static provenance gate. EXACT agreement at every r or STOP."
    - "STAGE 2, HARD GATE: the known-answer calibration, POSITIVE CONTROL B, the planted-advantage ladder, and the r = 1 fixture against the sibling record's committed values. Any failure STOPS the run before any digit number is recorded."
    - "STAGE 2b: if the smallest planted rung is not recovered, RAISE the closure threshold to the smallest recoverable rung and record a versioned protocol amendment BEFORE proceeding. Do not proceed at the original threshold."
    - "STAGE 3: the main measurement over the declared ladder and band."
    - "STAGE 4: NULL-1, NULL-2, the comparator, CONTROL C and the curve-free multiplicative arm, all on the identical estimator."
    - "STAGE 5: ONLY if the LEAD branch fires - the anomalous non-generator calibration, then STOP and route to independent review before any interpretation."
    - "NO ATTACK IS RUN at any stage, no scalar is recovered outside the toy calibration, and no key material of any kind is involved."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Any statistic code path that reads k, as determined by the static provenance gate."
    - "Reporting a digit advantage without the matched-s comparator on the identical estimator and the identical curves."
    - "Matching the comparator on r rather than on IMAGE SIZE s. Increasing r increases the arithmetic cost and the digit alphabet simultaneously, so an apparent advantage growing with r could be an alphabet-size effect; the comparator must be matched on s."
    - "Reading the r = 1 cell of NULL-2 as a discriminating comparison; the projection is vacuous there and the agreement is forced."
    - "Declaring CLOSURE at a threshold smaller than the smallest planted rung the estimator actually recovered."
    - "Including an anomalous curve in the main run set; the object of study does not exist there."
    - "Presenting a closure branch as a statement about elliptic curves if the curve-free multiplicative arm reproduced it."
    - "Any post-hoc change to the 0.01 and 0.05 bands, the statistic ladder, the planted rungs, or the declared field-size band. A change requires a versioned protocol_amendment before the affected cells are re-read."

  success_criterion: >-
    The run SUCCEEDS as a measurement, whichever branch it reaches, when:
    the transport gate returns exact agreement at 100 percent of samples at
    every r and the static provenance gate passes; the known-answer
    calibration returns exactly two values on the predicted fibre; POSITIVE
    CONTROL B recovers its near-0.5 advantage; every rung of the planted
    ladder is recovered within its bootstrap interval, or the closure
    threshold is raised and amended before proceeding; the r = 1 fixture
    matches the sibling record's committed values exactly; ADV is reported
    exactly for every (statistic, n, s, r) cell with the comparator, both
    nulls and CONTROL C on the identical estimator; beta is fitted with
    residuals and intervals; the curve-free multiplicative arm is run and
    classified; and the outcome is declared as exactly one of CLOSURE, LEAD
    or INCONCLUSIVE by the pre-registered rule.

  falsification_criterion: >-
    THE TRANSPORT LEMMA IS FALSE AS A PROCEDURE, and the record stops, if the
    two computation paths differ at any digit; the disagreement is archived
    verbatim as the refutation artifact and requires independent replication
    before anything is concluded, since it would also contradict a committed
    technique record. THE P-ADIC ARITHMETIC IS WRONG, and nothing is
    reported, if the known-answer calibration returns other than two values
    on the predicted fibre. BOTH LANES ARE BLOCKED if the r = 1 edge
    disagrees with the committed fixture. THE LEAD BRANCH fires when a digit
    statistic exceeds its r = 1 shadow by 0.05 or more, reproducibly at three
    or more prime orders, not decaying in n and not reproduced by NULL-1 or
    NULL-2 - still no attack, and routed to independent review. THE CLOSURE
    BRANCH fires when every digit statistic matches its shadow within the
    band and decays like n^{-1/2}; it closes the DECLARED LADDER on the
    TESTED family and NOT the open sub-question. NO CANONICAL-LIFT-SPECIFIC
    CONCLUSION may be drawn if NULL-2 matches the true-lift advantage. THE
    THRESHOLD IS DISHONEST, and must be raised before any digit arm is read,
    if the smallest planted rung is not recovered. THE SCOPE COLLAPSES TO A
    NON-CURVE STATEMENT if the curve-free multiplicative arm reproduces the
    branch, and the pre-declared consequence then binds.

  required_artifacts:
    - "Stage 0 receipt: the transport lemma with its projection step written out, the prime-n homomorphism argument, and the declared r = 1 width-zero cell of NULL-2."
    - "Transport gate records: per (p, r) cell, the number of sampled k, the digit-for-digit agreement rate, and the static provenance gate result over the k-free code path."
    - "Per-cell advantage records: curve, p, n, s, r, statistic id, q_maj, ADV, estimator name, enumeration mode (complete), seed where applicable."
    - "The comparator, NULL-1 distribution and tail reference, NULL-2, and CONTROL C advantages on the identical estimator."
    - "The planted-advantage ladder table: planted weight, planted advantage, recovered advantage, bootstrap interval, recovered yes/no per rung; plus the protocol amendment if the threshold was raised."
    - "The known-answer calibration's value set and fibre."
    - "Fitted beta per statistic with residuals and intervals."
    - "The curve-free multiplicative arm's full table and its branch classification."
    - "The measured r^3 cost factor of a digit statistic against the coordinate it is a function of."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr, peak RSS, wall clock, and the p-adic precision actually reached."

  assigned_to: executor

  limitations:
    - >-
      The information half of the claim is NOT NOVEL to this program; a
      committed technique record states it. Only the explicit procedure, its
      cost, the transport, the prime-n argument and the measurement are this
      record's content.
    - >-
      The statistical half is CONDITIONAL on a sibling record's sub-result -
      itself a prediction, not a validated finding - and on the degree gap,
      which is open and has NO rigorous support of any kind.
    - >-
      A closure branch closes the DECLARED LADDER on the TESTED family. It
      does not close the open sub-question, which quantifies over all
      statistics and all precision schedules.
    - >-
      PRECISION SCHEDULES r(n) GROWING WITH n CANNOT BE TESTED BY THIS DESIGN
      AT ANY BUDGET, because exactness requires complete enumeration. This is
      the real gap between what is measured and what is asked.
    - >-
      The field-size band is 16-26 bits, not the source's "up to about 30",
      because exact enumeration at 2^30 does not fit the declared memory. The
      reduction is stated, not made silently.
    - >-
      Toy-scale image ratio biases TOWARD apparent structure: at 20 bits an
      image of 8 buckets is a far larger fraction of the group than any
      cryptographic analogue. Disclosed; the field-size ladder is the only
      defence.
    - >-
      Nothing here bears on anomalous curves or the additive transfer; on
      those curves the object does not exist.
    - >-
      The closure branch is EXPECTED to reproduce in the curve-free
      multiplicative arm, so this experiment is expected to produce a
      statement about finite abelian groups rather than about elliptic
      curves. Recorded before the run so it cannot be presented afterwards as
      a curve result.
    - >-
      No disposition, status change or claim about any other record.
