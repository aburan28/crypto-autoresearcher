experiment:
  id: EXP-INSTR-88739d
  hypothesis_id: H-INSTR-d04b9c
  derived_from_idea: IDEA-20260807-34754f
  question_id: RQ-INSTR-f8faa0
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Twist-block-stratified permutation null for the isogeny-class grouping, with a four-level nested variance
    decomposition, group-order-free exact functionals, a p-value estimator that cannot return zero, a synthetic
    null-object class that must not fire, and a blocking-refinement decay curve that separates a real class
    effect from an unnamed nuisance
  objective: >-
    The one uncertainty a run reduces - whether the campaign's currently reported isogeny-class signal is a
    class effect or the group order. A run establishes (i) whether the committed run's reported within-class
    variance is, on paper and at zero compute, exactly the function of the 2-torsion count that the archived
    identity forces it to be, which either confirms the diagnosis or withdraws it before anything else runs;
    (ii) whether the free permutation reproduces the committed p-values on the frozen slice, which is an
    instrument-stability gate; (iii) the stratified p-value and the observed-to-null variance ratio after
    blocking on the twist pair and on the group order, computed with an estimator that cannot return zero, and
    the GAP against the free permutation, which is itself the measure of contamination; (iv) the four nested
    variance components per functional, so the class level is read against the three levels beneath it; and (v)
    whether the synthetic null-object class stays silent and whether any residual signal DECAYS as blocking is
    refined. No attack is mounted, no exponent moves, and nothing here is an attack cost at any scale that
    matters.
  what_this_is_not:
  - >-
    Not an attack and not a cryptanalytic result. It computes no discrete logarithm and competes on no axis of
    the prime-field frontier.
  - >-
    Not a claim that the lane's substantive result is wrong. It claims the current signal is NOT YET
    ATTRIBUTABLE to isogeny structure and supplies the design under which the same measurement would become
    attributable.
  - >-
    Not a claim about whether the functionals measured are attack-relevant, which is a different lane's
    question. This governs the class-level NULL only.
  - >-
    Not a replacement for the campaign's other nulls. The free permutation and the bit-length-matched
    between-class comparison are both RETAINED and reported as diagnostics, the latter explicitly labelled the
    weaker group-order control.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has been
    executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed primes, on completely enumerated isogeny classes, with these
      functionals, class membership explains no variance beyond the block structure DOWN TO the stated minimum
      detectable effect; and the gap between the free and the stratified p-values takes the measured value. WHAT
      DOES NOT FOLLOW - exact invariance, which no permutation test can certify; anything at a prime that was not
      enumerated; anything about whether the functionals are attack-relevant; and any attack or security
      statement, since at these primes the largest prime factor of the group order is around a dozen bits and
      every 'attack-cost functional' is degenerate as an attack cost.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE). Re-derive on paper that at the widest window the liftable count is an
      affine function of the group order and the 2-torsion x-count, and confirm against the committed raw output
      that the mean over classes of a quarter of the 2-torsion count's variance equals the reported within-class
      variance. If this does not hold, the identity or the reporting is wrong and everything downstream waits.
      STAGE 1 (minutes). Re-run the FREE permutation on the frozen slice and reproduce the committed p-values and
      every cell of the committed window-decay block.
      STAGE 2 (minutes, THE CHEAPEST VALID DISCRIMINATOR). Implement twist-pair blocking and the (1 + r)/(1 + B)
      estimator, and recompute. This stage changes ONE THING and needs NO new measurement at all, which is why it
      is the cheapest discriminator between 'the class carries information' and 'the classes have different group
      orders'.
      STAGE 3 (about an hour). Add the EXACT sum-set counts, removing the target-sampling step entirely, and re-run
      BOTH permutations.
      STAGE 4 (hours). The nested design on the target class only - measure each functional at several factor-base
      offsets on each of several Weierstrass models per curve, and estimate the four variance components by nested
      Type-I sums of squares. Report all four, always, in the same table.
      STAGE 5 (zero compute). Run the SYNTHETIC NULL-OBJECT CLASS through the identical pipeline; it must not fire.
      Then report the blocking-refinement decay curve and the contamination gap.
      POOL DISCIPLINE, BINDING ON EVERY STAGE - the prime, the trace-selection rule and the number of control
      classes are DECLARED IN THE CONTRACT before measurement, and the realized group-order spread over the pooled
      classes is recorded against its Hasse bound.
    instrument: >-
      Complete class enumeration by a single vectorised quadratic-character table sweep per prime; exact sum-set
      computation for the decomposition counts, which removes the binomial sampling variance entirely; nested
      Type-I sums of squares for the four variance components; stratified label permutation within blocks with the
      (1 + r)/(1 + B) estimator, using a size-WEIGHTED mean of per-group variances so the unequal-group-size bias
      of the unweighted statistic is removed. Recorded through harness/runner.py.
    parameters: >-
      The committed slice at exactly its committed parameters as the reproduction fixture. Additional enumerable
      primes with a PRE-REGISTERED trace list, plus a size-randomly-selected pool as a secondary arm. Blocking
      levels - one block (the free permutation, retained as the contamination diagnostic), one block per twist
      pair, and one block per narrow group-order band whose width is below the measured within-class standard
      deviation of the functional. Declared numbers of Weierstrass models and factor-base offsets per curve for
      the nested design. A permutation count large enough that the estimator resolves below the declared level.
      Trace-zero classes excluded or stratified. THERE IS NO STANDARDIZED PARAMETER SET IN SCOPE and none is
      implied.
  controls:
  - >-
    THE NULL FOR THE NULL - THE SYNTHETIC NULL-OBJECT CLASS, MANDATORY AND SELF-REFERENTIAL. Construct a set of
    curves at the same prime that is NOT an isogeny class but has the same size profile and the same group-order
    spread, by relabelling each curve with a synthetic class drawn to match the true class-size multiset while
    FORCING the synthetic grouping to be independent of the trace. The stratified permutation must NOT fire on it
    at the declared level. If it does, the blocking is manufacturing significance from the size profile and no
    result may be reported from it.
  - >-
    DECAY PARAMETER, THE NUMBER OF PERMUTATION BLOCKS. As blocking is refined - from one block (the free
    permutation) to one block per twist pair to one block per narrow group-order band - any group-order-driven
    signal must decay MONOTONICALLY toward the unblocked-nuisance level. A signal that SURVIVES the finest
    blocking is the candidate real effect; a signal that does NOT DECAY as blocking is refined is the canonical
    artifact tell and means the nuisance is something other than the group order and has not yet been named.
  - >-
    FREE PERMUTATION RETAINED AS THE CONTAMINATION DIAGNOSTIC. It is not deleted. The GAP between the free and the
    stratified p-values IS the measure of group-order contamination, and reporting the pair is how the campaign
    shows its null is doing work.
  - >-
    BIT-LENGTH-MATCHED BETWEEN-CLASS COMPARISON, REPORTED AND EXPLICITLY LABELLED THE WEAKER CONTROL. At fixed p
    almost every class shares a bit length, so the match is nearly vacuous while the actual nuisance survives it
    untouched; it is reported so a reader can see that it is weaker rather than being told so.
  - >-
    THE ISOMORPHISM-MODEL LEVEL OF THE NESTED DESIGN AS THE NOISE FLOOR. The class level is interpretable ONLY
    relative to it - if the between-j-invariant-within-class component is not larger than the
    between-model-within-j-invariant component, the class explains nothing beyond the Weierstrass model.
  - >-
    POOL FREEZE. The prime, the trace-selection rule and the control-class count are declared before measurement,
    with the realized group-order spread recorded against its Hasse bound, so the pool cannot be chosen after
    seeing the functional.
  - >-
    SELECTION-CONFOUND ARM. Because the selection rule takes the largest ordinary classes and class size is the
    class number, a size-randomly-selected pool is run as a secondary arm and reported beside the primary one.
  independent_variables:
  - 'blocking level: free / twist-pair / twist-pair plus narrow group-order band'
  - 'functional: full-field liftable density, decomposition counts at two arities, and any other declared functional'
  - 'estimator: sampled rate (group-order dependent) versus exact sum-set count (group-order free)'
  - 'grouping: true isogeny class versus synthetic null-object class'
  - 'nesting level: class / j-invariant within class / Weierstrass model within j-invariant / factor-base offset within model'
  - 'pool selection: largest-classes rule versus size-random secondary arm'
  metrics:
    primary:
    - >-
      stratified_p_value - dimensionless, per functional, computed as (1 + the number of permuted statistics at or
      below the observed one)/(1 + the permutation count), which CANNOT return zero, using the size-weighted mean
      within-group variance as the statistic. Reported at every blocking level.
    - >-
      contamination_gap - the pair (free-permutation p-value, stratified p-value) per functional, and their
      difference. THE PAIR IS THE HONEST HEADLINE, not either number alone.
    - >-
      variance_ratio - dimensionless, the observed within-group variance divided by the null mean, reported under
      BOTH the free and the stratified permutation, per functional.
    - >-
      nested_components - four non-negative numbers per functional: between-class, between-j-invariant-within-class,
      between-model-within-j-invariant, and within-model. Reported ALWAYS, all four, in the same table.
    - >-
      synthetic_null_p_value - the stratified p-value on the synthetic null-object class, which must NOT fall below
      the declared level.
    secondary:
    - >-
      the Stage-0 paper arithmetic - the reported within-class variance against the mean over classes of a quarter
      of the 2-torsion count's variance, to full precision, PASS or FAIL.
    - >-
      the Stage-1 reproduction of the committed free-permutation p-values and window-decay cells, PASS or FAIL.
    - >-
      the blocking-refinement decay curve - the variance ratio at each of the three blocking levels.
    - >-
      the realized group-order spread over the pooled classes and its Hasse bound, as an absolute value and as a
      fraction.
    - >-
      per-class size, trace, group order and the 2-torsion count's variance, for the twist-pair equal-size check.
    - >-
      exact sum-set sizes at both arities, and the free and stratified p-values computed on them, beside those
      computed on the sampled rates.
    - >-
      the size-random secondary pool's results beside the primary pool's, so the selection confound is visible.
    - >-
      the permutation count used and the finest resolution the estimator achieves.
  heuristic_under_test: null
  heuristic_under_test_note: >-
    Explicitly null. There is no heuristic here - the permutation null is EXACT in finite samples and requires no
    distributional assumption, which is one of the reasons it is preferred over a binomial null for this question.
    The only modelling content is the EXCHANGEABILITY assumption, which is the null hypothesis itself rather than a
    heuristic, and which is tested directly by the synthetic null-object class.
  preregistered_prediction:
    quantity: >-
      Four quantities, fixed before any run exists - the stratified p-value for the full-field liftable density on
      the committed pool; the variance ratio under stratification; the ratio of the second to the third nested
      component per functional; and the direction in which the free p-value moves when sampling noise is removed.
    formula: >-
      The stratified p-value is (1 + r)/(1 + B) with the size-weighted mean within-group variance as the statistic
      and labels permuted only within twist-pair and group-order blocks. PREDICTED - it RISES ABOVE 0.05 for the
      full-field liftable density; the variance ratio moves from the committed orders-of-magnitude reduction to
      within a factor of 2 of 1; and the free p-value computed on the EXACT sum-set count moves TOWARD ZERO while
      the stratified p-value stays flat, because removing the binomial noise unmasks rather than removes the
      group-order confound. Under the null that the class carries real information, the stratified p-value stays
      below 0.05 after full blocking - which is the falsifier and is the more interesting outcome.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-34754f, predictions block, before any run under this
      contract exists. The counterintuitive direction of the exact-count prediction is pre-registered SPECIFICALLY
      so that it cannot be claimed after the fact. No prediction may be adjusted after a run except through a
      versioned amendment.
  scale_relevance:
    tier: toy
    justification: >-
      Complete enumeration of every isomorphism class at a prime costs quadratic character-sum work, so the design
      is confined to small primes; at those primes the largest prime factor of the group order is around a dozen
      bits and NO functional measured here is an attack cost at any scale that matters. THE SCALE IS FORCED BY THE
      MEASUREMENT - 'within-class variance' is a population quantity only if the class is completely enumerated,
      and complete enumeration is what small primes buy. There is NO transfer claim to larger primes: the
      contamination the design removes is a property of the STATISTIC and of the class definition, not of the
      parameter size, so the DESIGN transfers while the numbers do not. That distinction is stated rather than
      blurred.
    correspondence: null
  tail_checks:
  - >-
    Report the finest resolution the p-value estimator achieves at the chosen permutation count, and refuse to
    report any p-value at that floor as if it were smaller. The committed instrument returned exactly zero at most
    windows and zero is not a valid p-value.
  - >-
    Report the variance ratio at ALL THREE blocking levels, not just the finest, so the decay is visible as a curve
    rather than asserted as an endpoint.
  - >-
    Report the twist-pair equal-size check per pair, per prime, as exact counts. A pair whose sizes differ
    invalidates the twist-pair blocking's justification at that prime and must be reported rather than absorbed.
  - >-
    Report the realized group-order spread as a fraction of the group order beside its Hasse bound, so a reader can
    see how much of the available nuisance the pooled classes actually span.
  - >-
    Report the nested components for the SMALLEST functional variance in the set. A component decomposition on a
    functional whose total variance is near the numerical noise floor is not interpretable and must be flagged.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      The exact sum-set arm and the class enumeration are deterministic and must agree bit-for-bit across
      instances. The seeds control the permutation draws, the synthetic null-object relabelling and the
      size-random secondary pool. ALL CURVES SHARE THE SAME TARGET SEED BY DESIGN in the sampled arm, which is
      correct for removing a per-curve degree of freedom but makes per-curve measurements positively correlated
      through the shared sequence - the exact-count arm removes this entirely by dropping sampling, and the two
      are reported side by side so the effect of that correlation is visible.
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 8.0
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
  - >-
    HALT at Stage 0 if the paper arithmetic does not close. The identity or the reporting is wrong; the diagnosis
    is withdrawn and the discrepancy is the deliverable.
  - >-
    HALT at Stage 1 if the free permutation does not reproduce the committed p-values on the frozen slice.
    Instrument instability; nothing is concluded.
  - >-
    HALT if the synthetic null-object class FIRES under the stratified permutation. The blocking is wrong and no
    result may be reported from it.
  - >-
    Stop at the pre-registered prime, trace list and control-class count. Selecting a different pool after seeing a
    p-value is a different experiment.
  - >-
    If class enumeration at a prime exceeds the memory or time budget, reduce the prime and RECORD the reduction.
    Budget exhaustion is a stop, never a negative result (AGENTS.md rule 5).
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is NEVER
    negative mathematical evidence (AGENTS.md rule 5).
  - >-
    A run reporting a p-value of exactly zero is invalid_measurement. Zero is not a valid p-value at any permutation
    count and the estimator used here cannot produce it.
  - >-
    A run using the UNWEIGHTED mean of per-group variances is invalid_measurement; unequal group sizes weight the
    small classes up and the statistic must be size-weighted.
  - >-
    A run whose synthetic null-object arm was not executed in the same invocation as the real arm is
    invalid_measurement.
  - >-
    A run that reports the stratified p-value WITHOUT the free p-value beside it is invalid_reporting. The pair is
    the honest headline and the gap is the measure of contamination.
  - >-
    A run that reports a non-significant stratified result as 'no effect' rather than as a BOUND, without the
    minimum detectable effect beside it, is invalid_reporting and is an overclaim.
  - >-
    A run whose pool was selected after any functional was measured is invalid_measurement; the pool freeze is the
    quantifier-order guard.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    ALL SIX of the following, each decidable from the primary metrics. (1) The Stage-0 paper arithmetic is reported
    with a PASS or FAIL to full precision. (2) The Stage-1 reproduction of the committed free-permutation p-values
    and window-decay cells is reported with a PASS or FAIL. (3) stratified_p_value and variance_ratio are reported
    per functional AT ALL THREE BLOCKING LEVELS, with the free-permutation values beside them. (4) All four
    nested_components are reported per functional in one table. (5) synthetic_null_p_value is reported from an arm
    run in the same invocation. (6) The exact sum-set counts are computed and both permutations are reported on
    them beside the sampled-rate versions. NOTE that success means THE COMPARISON WAS MADE AND ITS CONTROLS PASSED;
    whether the hypothesis is supported is decided by the pre-registered prediction and the falsification criteria,
    and a completed run in which the stratified test still fires is a successful run and the more interesting
    outcome.
  falsification_criterion:
  - >-
    THE STRATIFIED PERMUTATION STILL FIRES on the true classes at the declared level after full blocking, with the
    synthetic null-object class silent - the central claim is FALSE, the current signal is NOT the group order, and
    the campaign has a genuine within-class effect to chase. This is a real falsifier with a real probability and it
    is the reason to run the test.
  - >-
    The Stage-0 paper arithmetic fails - the diagnosis of the reported variance reduction is WITHDRAWN.
  - >-
    Stage 1 does not reproduce the committed p-values - instrument instability; nothing is concluded.
  - >-
    The synthetic null-object class fires under the stratified permutation - the blocking is wrong and no result may
    be reported from it.
  - >-
    The twist-pair equal-size check fails at another prime - the twist-pair blocking loses its justification and must
    be replaced by explicit discriminant matching.
  - >-
    A residual signal fails to decay as blocking is refined - the nuisance is something other than the group order,
    it has not been named, and no class conclusion follows.
  - >-
    The between-j-invariant-within-class component is not larger than the between-model-within-j-invariant component
    for a functional - the class explains nothing beyond the Weierstrass model for it, and the lane's headline must
    say so.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and
    environment
  - >-
    raw-result.json carrying every per-curve functional value, every permutation statistic and every nested
    sum-of-squares, not summaries
  - >-
    the synthetic null-object arm and the size-random secondary pool, in the same file as the real arm
  - >-
    the Stage-0 paper arithmetic worked to full precision against the committed raw output, with its PASS or FAIL
  - >-
    the Stage-1 reproduction transcript against the committed p-values and window-decay cells
  - >-
    the frozen pool declaration - prime, trace list, control-class count - written before measurement, with the
    realized group-order spread and its Hasse bound
  - >-
    the blocking-refinement decay curve and the per-pair twist equal-size check
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because it
    authorizes execution and spends compute.
  - >-
    STAGES 0 TO 2 ARE THE CHEAPEST VALID DISCRIMINATOR AND NEED NO NEW MEASUREMENT AT ALL - they change one thing
    about an existing committed run. The Coordinator may authorize them alone and decide on Stages 3 and 4
    afterwards.
  - >-
    THIS CONTRACT BEARS ON A COMMITTED EVIDENCE RECORD'S INSTRUMENT. If it succeeds, previously reported class
    signals in this lane become non-attributable and must be RESTATED as pairs of p-values in a superseding record,
    never edited. The Coordinator should decide in advance how that restatement is to be filed.
  - >-
    A non-significant stratified result is a BOUND, and reporting it needs the minimum detectable effect from a
    separate record. The Coordinator should confirm that number is available before approving, or the run's most
    likely outcome will not be reportable.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-34754f
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's mechanism, minimal_test, controls,
      required_metrics, predictions and falsification_conditions, and restated as a contract. Boilerplate identical
      across contracts by program rule comes from a fixed table. Budgets come from the parent's declared
      estimated_cost (implementation medium, compute low), with the nested arm's cost multiplied by the declared
      model and offset counts. NO NUMBER IS INVENTED - the committed run's own values are deliberately NOT copied
      into this contract's parameter block; Stage 0 re-derives the arithmetic against the committed raw output and
      Stage 1 reproduces the committed p-values, and both are gates rather than assumptions.
  derivation_gaps:
  - >-
    The prime, the trace list and the control-class count are described as pre-registered but are not enumerated
    here. They must be frozen before measurement; a pool chosen after a functional is seen is the exact
    quantifier-order failure the freeze exists to forbid.
  - >-
    The group-order band width is specified only as 'below the measured within-class standard deviation of the
    functional', which is circular in the sense that the standard deviation is itself measured. The order of
    operations must be fixed in advance - measure the within-class standard deviation on the frozen slice FIRST,
    then set the band, then permute.
  - >-
    The numbers of Weierstrass models and factor-base offsets in the nested design are not fixed. Too few of either
    understates the corresponding component and thereby makes the class level look MORE explanatory than it is,
    which biases toward the hypothesis being false - the unsafe direction. Both must be pinned before the run.
  - >-
    The permutation count is not fixed. It sets the estimator's resolution floor, and any multiplicity correction
    across lanes needs a finer floor than a small count provides. It must be pinned at approval.
  - >-
    The minimum detectable effect that turns a non-significant stratified result into a BOUND comes from a separate
    record and is not supplied here. Without it the most likely outcome of this run is not reportable without
    overclaiming.
  - >-
    Whether trace-zero classes are excluded or stratified is not decided here. It must be decided before the run,
    since the twist lies in the same class there and mixing it into a class-effect comparison would confound it.
