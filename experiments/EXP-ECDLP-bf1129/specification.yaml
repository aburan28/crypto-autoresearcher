experiment:
  id: EXP-ECDLP-bf1129
  hypothesis_id: H-ECDLP-29f047
  derived_from_idea: IDEA-20260806-e4f96e
  question_id: RQ-ECDLP-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Polynomial-calculus and Nullstellensatz refutation degree of the toy Semaev
    decomposition system by Macaulay rank, against the measured maximum solver
    degree under a pre-registered three-way rule, with a blocking
    matched-random null, a satisfiable soundness control, textbook validation,
    a three-encoding sweep and memory as a first-class metric

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether this program's heuristic
    degree meters for algebraic point decomposition track a solver-independent
    obstruction, or whether a cheaper algebraic refutation exists that the
    solver does not find, at toy scale and in named encodings. A run
    establishes -- (i) S1, whether a degree-D polynomial-calculus refutation
    can be mechanically extracted from a logged degree-D solver run in the
    exact variant used, which is a HARD GATE; (ii) C1 and C2, that the pipeline
    reports NO refutation on a satisfiable instance and the KNOWN degrees on
    textbook instances; (iii) M1, the signed integer gap between the measured
    maximum solver degree and PC(F) on identical instances, scored by a
    three-way rule fixed before any run; (iv) N1, the same gap between Semaev
    systems and matched random systems on the identical pipeline, which is
    BLOCKING for any Semaev-specific statement; (v) E1, the spread of PC degree
    across three declared encodings; and (vi) H1, the full Macaulay rank
    profile per instance. NO LOWER BOUND ON THE ECDLP IS CLAIMED and no attack
    is proposed; Pollard rho remains the prime-field baseline untouched.

  what_this_is_not:
    - >-
      NOT a lower bound on the ECDLP. It bounds ONE STEP -- relation collection
      by algebraic decomposition -- inside ONE attack family, in ONE encoding,
      in ONE proof system, at toy scale.
    - >-
      Not an attack, not a speedup, and not an algorithm. If a solver gap is
      measured, converting it into an algorithm is separate work with its own
      record, its own heuristics and its own cost table.
    - >-
      Not a statement about non-algebraic algorithms, and not connected to the
      generic-group lower bound, which concerns a different model. Neither
      implies the other.
    - >-
      Not a claim that any existing DREG-lane measurement is wrong. The
      comparison can only change what KIND of statement those measurements
      support, and only within the tested model, scale and encodings.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "no Groebner-order solver in the declared
      model, in encoding [E], on instance family [F], at m in {3,4} and
      p <= 2^16, reaches a solution below degree PC(F) = [value]; and the
      measured maximum degree of the reference solver on the same instance
      differs from it by [M1]." Every reported degree names its encoding and
      its field-equation convention. WHAT DOES NOT FOLLOW -- anything about
      non-algebraic algorithms; anything about a different encoding, since PC
      degree is not an invariant of the variety; anything at m >= 5 or
      p > 2^16; and anything about the ECDLP itself. If the matched-random null
      matches, no Semaev-SPECIFIC statement follows either -- the number is
      then a statement about systems of that shape.

  inputs:
    procedure: >-
      STAGE 0 (zero compute) -- literature check for existing PC or NS degree
      results on summation-polynomial or decomposition systems; a positive hit
      is an INGREDIENT, not a reason to stop. FREEZE AND HASH, before any
      measurement -- the PC variant, the field-equation convention, the three
      encodings, the solver model, and the three-way scoring rule for M1
      (gap 0 records OUTCOME 1; gap >= 2 records OUTCOME 2; gap exactly 1 is
      INCONCLUSIVE).
      STAGE 1 (hours, HARD GATE) -- run the reference Groebner solver on one
      small unsatisfiable instance, log every polynomial considered with its
      degree, and mechanically extract a PC refutation of the same degree. IF
      THE EXTRACTION FAILS, THE WHOLE LINE ENDS HERE and that is the
      deliverable.
      STAGE 2 (hours) -- implement PC degree by Macaulay rank with a search on
      D over F_p; validate on textbook instances of KNOWN refutation degree
      BEFORE touching any Semaev system. Implement NS degree as the
      linear-combination-only restriction.
      STAGE 3 (HARD GATE) -- run the satisfiable control (a target that DOES
      decompose). It must report NO refutation at any tested degree.
      STAGE 4 (hours to days) -- measure PC and NS degree for the frozen toy
      Semaev family at m in {3, 4} across the three encodings and the declared
      prime ladder, ALONGSIDE the matched-random null on the identical
      pipeline, recording the full rank profile, Macaulay dimensions, wall
      clock and PEAK MEMORY per cell.
      STAGE 5 (zero compute) -- reproduce the frozen DREG fixture comparison,
      then score M1 by the pre-registered rule and report OUTCOME 1, OUTCOME 2
      or INCONCLUSIVE per cell, with N1 and E1 stated in the same sentence as
      any degree.
    instrument: >-
      Python 3.11 with numpy for exact modular linear algebra -- Macaulay
      construction and rank over F_p implemented from the definition, with
      pivoting in exact modular arithmetic and no floating point anywhere in a
      rank decision. THE SOLVER ARM REQUIRES A GROEBNER ENGINE, and prior lane
      records report Sage and sympy ABSENT from this container. The executor
      must probe for an engine and RECORD the result; if none is available the
      solver arm is INFRASTRUCTURE-BLOCKED, M1 and the frozen-fixture
      reproduction are DEFERRED, and the run reports PC, NS, the null and the
      encoding spread only. Two independent solver implementations are required
      before any Outcome verdict, per HEUR-PC-2. Recorded through
      harness/runner.py.
    parameters: >-
      Arity m in {3, 4}. Prime ladder spanning enough range to see whether the
      measured degree depends on p at all, with p <= 2^16. Three declared
      encodings -- E1 Semaev summation polynomial in x-coordinates with field
      equations; E2 the same with the factor base given by an explicit
      vanishing polynomial rather than membership constraints; E3 the
      Weil-restriction-style expansion this program's DREG lane uses. Factor
      base -- the one already frozen in this program's toy Semaev protocols, so
      numbers are comparable with existing DREG records. Field-equation
      convention frozen at Stage 0. Matched-random systems matched on variable
      count, total degree, per-variable degree, support size and Newton
      polytope. Textbook validation instances of known refutation degree. The
      frozen DREG fixture -- an exact instance, seed, factor base and target
      from a committed DREG run record.
  controls:
    - >-
      SATISFIABLE CONTROL, HARD GATE -- a target that DOES decompose. The
      pipeline must report NO refutation at any tested degree. A finite
      refutation degree for a satisfiable system means the instrument is broken
      and the line halts before anything is reported.
    - >-
      TEXTBOOK VALIDATION, gating -- instances of KNOWN refutation degree must
      come back with those degrees before any Semaev number is produced.
    - >-
      MATCHED-RANDOM NULL, BLOCKING -- random systems matched on variable
      count, total degree, per-variable degree, support size and Newton
      polytope, measured on the IDENTICAL pipeline. A gap of at least 2 is
      REQUIRED before any Semaev-specific statement may be made. THE PREDICTED
      OUTCOME IS NO GAP, recorded in advance so that a match is a confirmed
      control rather than a disappointment.
    - >-
      FROZEN DREG FIXTURE, gating -- the recorded degree of regularity from a
      committed DREG run must reproduce as an EXACT INTEGER against the newly
      measured maximum solver degree on the identical instance. A mismatch is
      an instrument-comparability failure and halts the line.
    - >-
      NEARBY-OBJECT CONTROL -- the decomposable instance is also the
      nearby object on which the method must FAIL to produce a refutation. A
      method that cannot distinguish the decomposable from the undecomposable
      instance is measuring the encoding's shape only.
    - >-
      ENCODING SWEEP, not optional -- at least three declared encodings
      measured and reported side by side. A single number from a single
      encoding is not a result and may not be reported as one.
    - >-
      TWO-IMPLEMENTATION SOLVER CHECK -- two independent solver implementations
      on frozen seeds must report the SAME maximum degree on the same instances
      before any Outcome verdict is recorded. A disagreement is an instrument
      failure, not a finding.
    - >-
      MEMORY AS A FIRST-CLASS CONTROL -- the dominant structure is sized
      ANALYTICALLY as binomial(n + D, D) columns and reconciled against
      measured peak resident memory per cell. A cell whose measured memory
      departs materially from the analytic size means the matrix being built is
      not the matrix that was specified.

  independent_variables:
    - arity m
    - prime field size p
    - "encoding (E1 / E2 / E3)"
    - "system class (Semaev unsatisfiable / Semaev satisfiable / matched random / textbook)"
    - "degree bound D (swept to find the least D with 1 in the row space)"
    - field-equation convention (frozen, reported with every number)

  metrics:
    primary:
      - >-
        S1 simulation_extraction_success -- boolean, whether a degree-D PC
        refutation was mechanically extracted from a logged degree-D solver run
        on one small unsatisfiable instance, in the declared variant. HARD
        GATE.
      - >-
        PC_degree -- the least D such that 1 lies in the row space of the
        degree-D Macaulay matrix over F_p, per (m, p, encoding, instance).
        Unit -- integer degree. Computed by exact modular rank with a search on
        D.
      - >-
        NS_degree -- the same quantity restricted to linear-combination-only
        derivations, giving NS >= PC. Unit -- integer degree.
      - >-
        M1 pc_versus_solver_gap -- the signed integer (maximum degree reached
        by the reference solver) minus PC_degree, on the identical instance,
        per (m, p, encoding). Unit -- integer. Scored by the pre-registered
        three-way rule.
      - >-
        N1 semaev_versus_matched_random_gap -- PC_degree(matched random) minus
        PC_degree(Semaev) at matched shape, per cell. Unit -- integer.
        BLOCKING -- at least 2 is required for any Semaev-specific statement.
      - >-
        C1 satisfiable_control_verdict -- whether any refutation was found at
        any tested degree on the decomposable target. Unit -- boolean. Required
        false.
      - >-
        C2 textbook_validation_agreement -- exact agreement between measured
        and known refutation degrees on the validation instances. Unit --
        boolean per instance. Required true for all.
      - >-
        E1 encoding_spread -- max minus min PC_degree across E1, E2, E3 on the
        same instance. Unit -- integer. A spread of 3 or more bounds every
        conclusion drawn from any single number.
    secondary:
      - >-
        H1 full Macaulay rank profile as a function of D per instance, with the
        null's profile on the same axes
      - Macaulay matrix dimensions per (instance, D), with the analytic binomial(n + D, D) column count beside the realized one
      - measured peak resident memory and wall clock per cell, reconciled against the analytic size
      - the frozen DREG fixture comparison, as exact integers
      - the two-implementation solver agreement check
      - the recorded field-equation convention, printed with every degree
      - the Stage-0 literature-check result, with what was found or that nothing was
      - a recorded probe for an available Groebner engine, and whether the solver arm ran or was blocked

  heuristic_under_test: HEUR-PC-1
  preregistered_prediction:
    quantity: >-
      S1 true; C1 false; C2 true on every validation instance; M1 scored by the
      three-way rule; N1 predicted to be 0, i.e. NO gap between Semaev and
      matched-random PC degrees; E1 reported in full.
    formula: >-
      PC(F) := min{D : 1 is in the row space of the degree-D Macaulay matrix of
      F over F_p}. M1 := D_solver_max minus PC(F). SCORING RULE, FIXED BEFORE
      ANY RUN -- M1 = 0 records OUTCOME 1; M1 >= 2 records OUTCOME 2 with M1 as
      the quantified target; M1 = 1 is INCONCLUSIVE by prior declaration; M1 < 0
      contradicts the simulation and voids Part S at that cell. N1 :=
      PC(matched random) minus PC(Semaev); a Semaev-specific statement requires
      N1 >= 2. Under the NULL that refutation degree at this scale is a
      function of system shape alone, N1 = 0.
    source: >-
      Pre-registered in IDEA-20260806-e4f96e (predictions -- PC versus F4
      degree with a two-branch rule, Semaev versus matched random, encoding
      spread) and restated in H-ECDLP-29f047 before any run exists. NOTE, AND
      IT IS A DELIBERATE COORDINATOR RESOLUTION -- the parent proposal's rule
      reads "agree within 1 records Outcome 1" AND "a difference of exactly 1
      is INCONCLUSIVE", which is internally inconsistent. The deterministic
      resolution adopted here, recorded BEFORE any run, is the strictly
      conservative reading -- only a gap of exactly 0 records Outcome 1. This
      resolution is disclosed in derivation_gaps and is not a silent edit.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at m in {3, 4} and p <= 2^16, which is where exact rank
      computations on the degree-D Macaulay matrix are feasible at all -- the
      matrix has binomial(n + D, D) columns and that is the binding constraint
      on the whole design. NO EXTRAPOLATION TO CRYPTOGRAPHIC-SCALE DEGREES IS
      PERFORMED OR LICENSED. The prime ladder is chosen to span enough range to
      detect whether the measured degree depends on p at all, because at
      p around 2^10 the field equations are cheap and can dominate the degree,
      producing behaviour that vanishes at larger p. TRANSFER ASSUMPTIONS,
      STATED -- none across encodings (PC degree is a function of the
      presentation, not of the variety), none to larger m, and none to any
      solver outside the declared model.
    correspondence: null

  tail_checks:
    - >-
      Report the largest single-cell deviation of PC degree from the fitted
      (m, p) surface, since a fitted dependence with one outlier means
      something different from a clean one.
    - >-
      Report the p-dependence of the MATCHED-RANDOM null on the identical grid,
      so the Semaev p-dependence is read against the p-dependence of shape
      rather than against zero.
    - >-
      Report every cell where the search on D hit the budget without resolving,
      as UNRESOLVED, never as a degree. A budget-truncated search reports a
      lower bound on PC, and the direction of that bias must be stated.
    - >-
      Report measured peak memory beside the analytic binomial column count per
      cell, so a cell whose memory departs from the analytic size is visible
      rather than averaged away.
    - >-
      Report the maximum solver degree from BOTH implementations per instance,
      not their agreement flag alone.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Seeds govern the matched-random system draws and the instance selection
      within the frozen family. The Macaulay rank computation and the search on
      D are DETERMINISTIC given the system and must be identical across seeds.
      Independent replication of the solver arm means TWO INDEPENDENT
      IMPLEMENTATIONS, not two runs of one, because HEUR-PC-2 is an
      implementation claim.

  budget:
    wall_clock_seconds_per_run: 43200
    total_cpu_hours: 40.0
    maximum_memory_gb: 32
    maximum_runs: 20

  stopping_rules:
    - >-
      STOP AT STAGE 1 if the PC-refutation extraction fails. The load-bearing
      relation is false as stated in the variant used and that is the
      deliverable; no refutation-degree number may be interpreted as a solver
      bound.
    - >-
      STOP AT STAGE 3 if the satisfiable control returns a finite refutation
      degree, or at STAGE 2 if textbook validation disagrees. Instrument
      broken; nothing is reported.
    - >-
      STOP the frozen-fixture comparison, and with it every Outcome verdict, if
      the recorded degree of regularity does not reproduce as an exact integer.
    - >-
      Report a cell as UNRESOLVED if the search on D exhausts its budget, and
      state that the reported value is a LOWER bound on PC with the bias
      direction named. Never report a truncated search as a degree.
    - >-
      Stop at maximum_runs, total_cpu_hours or maximum_memory_gb, whichever
      binds first. Budget exhaustion is a stop, never a negative result
      (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or missing-engine failure makes the
      run or the arm failed_infrastructure and is NEVER negative mathematical
      evidence (AGENTS.md rule 5). Macaulay matrices exceeding the memory
      budget at m = 4 are an INFRASTRUCTURE outcome and say nothing about
      refutation degree.
    - >-
      A run reporting a Semaev PC degree without the matched-random null having
      been executed in the same invocation is invalid_measurement -- the
      calibration the contract exists to make was not made.
    - >-
      A run reporting a degree without naming its encoding and its
      field-equation convention is completed_invalid.
    - >-
      A run recording an OUTCOME 1 or OUTCOME 2 verdict without both solver
      implementations having agreed on the maximum degree is
      invalid_measurement.
    - >-
      A run whose three-way scoring rule was fixed or adjusted after any gap
      was observed is completed_invalid.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) S1 is true; (b) C1 is
    false and C2 is true on every validation instance; (c) the frozen DREG
    fixture reproduces as an exact integer, or the solver arm is recorded as
    infrastructure-blocked and every solver-dependent metric is explicitly
    DEFERRED; (d) PC_degree, NS_degree, the rank profile, the Macaulay
    dimensions and the measured peak memory are reported for every attempted
    cell, with UNRESOLVED cells labelled as such; and (e) N1 and E1 are
    reported alongside every PC degree. The hypothesis H-ECDLP-29f047 Part C is
    RESOLVED at toy tier when M1 is scored by the pre-registered rule at every
    completed cell, and its verdict is OUTCOME 1, OUTCOME 2 or INCONCLUSIVE
    accordingly -- with any Semaev-specific reading permitted ONLY where
    N1 >= 2.

  falsification_criterion:
    - >-
      S1 false -- the extraction fails. Part S of the hypothesis is FALSE, the
      record is superseded rather than amended, and nothing downstream may be
      interpreted as a solver bound.
    - >-
      C1 true -- the satisfiable control yields a finite refutation degree.
      Instrument broken; nothing reported from any arm.
    - >-
      C2 false on any validation instance. Same disposition.
    - >-
      N1 = 0 or 1 -- matched random systems give effectively the same PC degree
      as Semaev systems. NO Semaev-specific conclusion may be drawn; the honest
      report is that PC degree at this scale measures SHAPE, and that IS the
      result. It was predicted in advance so it cannot be reframed.
    - >-
      The frozen DREG fixture does not reproduce as an exact integer. The two
      meters are not comparable and every Outcome verdict is void.
    - >-
      M1 < 0 at any cell -- PC degree above the measured solver degree. This
      contradicts the simulation and voids Part S at that cell.
    - >-
      The two solver implementations disagree on the maximum degree for the
      same instance. HEUR-PC-2 fails; instrument failure, not a finding.
    - >-
      PC degree DECREASES in m at fixed p on any cell. HEUR-PC-1 is refuted
      there, and the refutation is localised to that cell rather than
      generalised.
    - >-
      E1 >= 3 -- the encoding spread dominates. Every conclusion is bounded by
      the encoding and must say so in the same sentence.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-cell PC and NS degree, full rank profile, Macaulay dimensions, wall clock and peak memory, not summaries
    - the Stage-0 frozen text (PC variant, field-equation convention, three encodings, solver model, three-way scoring rule), hashed, with a timestamp preceding any measurement
    - the Stage-1 extracted PC refutation, in full, alongside the logged solver degree trace it was extracted from
    - the satisfiable control and the textbook validation results, in the same file as the signal arm
    - the matched-random null measurements, in the same file as the signal arm
    - the frozen DREG fixture comparison as exact integers
    - both solver implementations' maximum-degree reports per instance
    - a recorded probe for an available Groebner engine, with the outcome, and an explicit DEFERRED marking on every solver-dependent metric if none was found
    - UNRESOLVED markings with the budget that truncated each such search and the stated bias direction

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented; its proof_search_map is carried in
      H-ECDLP-29f047 and must be audited before implementation (KN-TECH-080).
    - >-
      The Stage-0 frozen text -- and in particular the three-way scoring rule
      for M1 -- must be committed and hashed BEFORE any measurement. A scoring
      rule adjusted after a gap is observed voids this contract.
    - >-
      A Coordinator must decide, before approval, whether the solver arm can
      run in the execution container. Approving a contract whose gating
      comparison cannot be executed authorizes spend on a deferred verdict, and
      the budget above (40 CPU-hours, 32 GB) is the largest in this batch.
    - >-
      This experiment could, on OUTCOME 2, be read as a step toward an
      algorithmic improvement to a central hard problem. It is NOT one, and the
      Coordinator must confirm that no approval here is read as authorizing an
      asymptotic claim -- the four promotion gates of agents/coordinator.md are
      untouched by any outcome of this contract.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260806-e4f96e
    authored_at: '2026-08-25'
    note: >-
      Metrics S1, PC_degree, NS_degree, M1, N1, C1, C2, E1 and H1, the five
      controls, and the criteria render the parent proposal's five-stage
      minimal_test, its four controls, its three predictions and its five
      falsification conditions into quantities decidable from a recorded
      number. Memory is promoted to a first-class metric with the dominant
      structure sized analytically as binomial(n + D, D), per the cost-model
      pattern in the design-experiment skill, because the parent identifies the
      rank computation as its binding constraint. Budgets come from the
      parent's declared estimated_cost (implementation medium, compute medium)
      and from its own statement that m = 4 feasibility is uncertain. No field
      is invented; unsupplied values are listed in derivation_gaps.

  derivation_gaps:
    - >-
      THE PARENT'S SCORING RULE IS INTERNALLY INCONSISTENT -- it says both
      "agree within 1 records Outcome 1" and "a difference of exactly 1 is
      INCONCLUSIVE". A deterministic Coordinator resolution is recorded in
      preregistered_prediction, adopting the strictly conservative reading (only
      gap 0 records Outcome 1). This is disclosed rather than silently
      harmonised, and a Coordinator may fix it differently before approval --
      but it must be fixed before, not after.
    - >-
      THE SOLVER ENGINE'S AVAILABILITY IS UNKNOWN. Prior lane records report
      Sage and sympy absent from this container, and the M1 comparison, the
      Stage-1 gate and the frozen-fixture reproduction all require a Groebner
      engine. The contract handles this by DEFERRING solver-dependent metrics
      rather than guessing them, but a Coordinator should resolve the
      infrastructure question before spending the budget.
    - >-
      The prime ladder's exact rungs are not specified. They must be fixed
      before approval and must span enough range that the p-dependence question
      is answerable; a ladder chosen to fit an observed p-dependence would make
      HEUR-PC-1 unfalsifiable.
    - >-
      The exact frozen DREG fixture (instance, seed, factor base, target) is
      named by role but not by path. A Coordinator must name the committed run
      record before approval, because a gating fixture that cannot be located
      does not gate.
    - >-
      The three encodings are named but E3's exact Weil-restriction-style
      expansion is inherited from the DREG lane and is not transcribed here. It
      must be pinned to a committed implementation, since two different
      expansions would give two different degrees for reasons unrelated to the
      mathematics.
    - >-
      The parent's consistency obligation against IDEA-20260805-2afd22 -- that
      an extracted witness degree is an UPPER bound on NS degree and must never
      be reported below this experiment's measured lower bound -- is recorded
      here as an obligation but is NOT executed by this contract, because that
      record's artifacts are not in scope. It is flagged so it is not lost.
