# EXP-BINSTD-99b10c
# Divisor-cancellation arithmetic. No solver.
# Approved by DEC-20261002-7826c8.
experiment:
  id: EXP-BINSTD-99b10c
  hypothesis_id: H-BINSTD-50d87a
  source_idea: IDEA-20261001-e740ce
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Divisor-cancellation arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-7826c8
  objective: >-
    Check the three divisions by 24, the ratio 37, the two binomials,
    and the admissible dimensions.
  inputs:
    quotient_32: 178956970
    remainder_24: 16
    fraction_num: 2
    fraction_den: 3
    tenth_gap_num: 1
    tenth_gap_den: 30
    factor: 37
    divisor_888: 888
    quotient_888: 4836674
    remainder_888: 784
    frac_888_num: 98
    frac_888_den: 111
    nine_gap_num: 19
    nine_gap_den: 1110
    quotient_20: 43690
    quotient_24: 699050
    binomial_35: 52360
    binomial_67: 766480
    orders: [8, 11, 28, 5, 36, 20]
    admissible: [5, 6, 8, 11]
    stable_meet: [5, 6]
    factor_count: 6
    band_floor_num: 4
    band_floor_den: 5
    withdrawn_gap_num: 119
    withdrawn_gap_den: 155
  controls:
    - >-
      Dividing 2^32, 2^20 and 2^24 by 24 leaves remainder 16. Reporting
      the fractional part as 7/10 invalidates the run.
    - >-
      The ratio of the two 2^32 quotients is 37. Reporting another
      ratio invalidates the run.
    - >-
      C(35, 4) is 52360 and C(67, 4) is 766480. Reporting another
      binomial invalidates the run.
    - >-
      The ratio 1/31 lies strictly below 4/5. Reporting it as inside
      the band invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {quotients, binomials}
    - route in {division, expansion}
  metrics:
    primary:
      - remainder_24
      - binomial_35
      - implementations_agree
    secondary:
      - ratio_37
      - admissible
      - withdrawn_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Dividing 2^32 by 24 leaves remainder 16, and C(35, 4) is 52360.
    formula: >-
      2^32 = 24 times 178956970 plus 16. The product 24 times 37 is
      888, so the two quotients differ by exactly 37. C(35, 4) expands
      as 35 times 34 times 33 times 32, divided by 24.
    source: >-
      IDEA-20261001-e740ce states the leaf figures, read 2026-10-02.
      The divisions and the binomials were computed in this design
      session. That computation is not a run. No solver was run.
  scale_relevance:
    tier: toy
    justification: Three divisions and two binomials. No transfer to a search.
    correspondence: null
  tail_checks:
    - The binomial C(67, 4) is required. A check that stops at C(35, 4) is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the remainder is not 16, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The fractional part is reported as 7/10.
    - The ratio of the two 2^32 quotients is not 37.
    - Either binomial differs from 52360 or 766480.
    - The ratio 1/31 is reported as at least 4/5.
    - A solver is run or a leaf count is measured.
  success_criterion: >-
    Both runs agree that each division by 24 leaves remainder 16, that
    the ratio of the two 2^32 quotients is 37, that C(35, 4) is 52360
    and C(67, 4) is 766480, and that only dimensions 5 and 6 at degree
    31 meet both the stable list and the admissible bound.
  falsification_criterion: >-
    The runs agree, the remainder stays 16, and C(35, 4) is not 52360.
  required_artifacts:
    - experiments/EXP-BINSTD-99b10c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-99b10c/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-99b10c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-99b10c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-99b10c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-99b10c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver, leaf measurement, or curve search.
    - Any claim that two curve shapes have equal leaf counts.
    - Any measured conflict ratio.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
