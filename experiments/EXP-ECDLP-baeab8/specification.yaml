experiment:
  id: EXP-ECDLP-baeab8
  hypothesis_id: H-ECDLP-92a375
  version: 1
  title: >-
    Target-shift coordinate-word recurrence gate - measure normalized linear
    complexity, exact held-out continuation, exhaustive state-collision fibres
    and complete decoder cost on frozen public predicates at 12 to 26 bits,
    against a matched curve-free random-word null, a five-point salting decay
    control, and an LFSR positive-control ladder of four KNOWN recurrence lengths
    the instrument must return exactly
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260814-270e03 into a testable protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. The intended first outcome is a rigorous CONTROL on a lossy
    representation, not a claim about live cryptographic keys and not an
    unconditional hardness theorem.
  objective: >-
    Determine whether a frozen public coordinate predicate's scalar-orbit word
    compresses to a collision-bounded recurrence state whose companion orbit can
    be inverted to a complete scalar candidate list without reintroducing an
    N-entry table or a generic discrete logarithm - and, equally, whether any
    apparent compression survives a matched random-word null and full predicate
    salting. Budget is sized to the WORK - symbol generation, recurrence fitting,
    exhaustive state enumeration and decoder auditing across five bit sizes - and
    exceeds the template floors.
  inputs:
    frozen_before_any_live_target_is_sampled: >-
      psi and its alphabet, the coordinate model, the window schedule, the
      recurrence-fitting algorithm and the decoder audit are ALL written to
      results/frozen_design.yaml and hashed BEFORE any live-target shift is
      generated. psi may NOT be chosen after reading target windows or test-set
      complexities; the hash and its timestamp prove the order.
    scope: >-
      Public generated prime-order toy subgroups from 12 through 26 bits;
      balanced one-bit, two-bit and four-symbol public coordinate predicates;
      window lengths doubling from 32 to the smaller of N/4 and the budget cap; at
      least 200 live-target shifts per completed cell.
    fit_and_test_split: >-
      Recurrences are fitted on one prefix and tested for EXACT continuation on a
      DISJOINT suffix. Fitted-window accuracy receives no credit; only exact
      held-out reproduction does.
    charging_rule: >-
      Predicate search, curve-coordinate conversion, source-word construction,
      recurrence fitting, companion-orbit indexing, null calibration and EVERY
      REJECTED PREDICATE are charged as preprocessing or advice, in operations,
      wall time and bytes. Per-attempt costs are live-target additions, predicate
      evaluations, recurrence-state recovery, collision-list generation,
      state-index inversion, candidate checks, and every failed window or
      predicate used for that target. Outputting a bucket of size N^u costs at
      least N^u and is charged.
  controls:
    - id: NULL-RANDOM-WORD
      description: >-
        NAMED CURVE-FREE NULL, AND THE PRIMARY CONTROL. Random balanced cyclic
        words matched on alphabet histogram, length, negation symmetry, window
        count and hash representation, generated with NO elliptic curve involved,
        at paired seeds against the curve arm. Every metric computed on the curve
        arm is computed identically on this null.
      failure_meaning: >-
        CONSEQUENCE DECLARED IN ADVANCE. If NULL-RANDOM-WORD reproduces the curve
        arm's normalized complexity profile and collision exponent within the
        declared tolerance, then the measurement carries no elliptic-curve
        content and NOTHING may be quoted as a statement about elliptic curves or
        the ECDLP; the admissible reading is a statement about balanced words of
        that length and alphabet. This is also the expected outcome under the
        falsification-oriented default.
    - id: CTRL-SALT-DECAY
      description: >-
        FIVE-POINT GRADED DECAY CONTROL. Replace 0, 25, 50, 75 and 100 percent of
        symbols with a target-independent balanced salt, and simultaneously
        increase the held-out continuation length. Algebraic signal attributed to
        psi must move MONOTONICALLY toward the matched random-word profile as the
        salt fraction rises, and at least 75 percent of any initial gap must be
        gone at full salt.
      failure_meaning: >-
        A quantity that FAILS TO DECAY when the parameter meant to destroy it
        increases is the canonical artifact tell. Failure to decay is an
        instrumentation or generic-word artifact and voids the credited
        recurrence, and it is a pre-registered falsification rather than a
        surprise.
    - id: CTRL-LFSR-LADDER
      description: >-
        POSITIVE CONTROL WITH DEMONSTRATED DYNAMIC RANGE AND PLANTED SIZES. LFSR
        words with KNOWN recurrence lengths L in {8, 16, 32, 64}, known state
        orbit, known collision fibre and known decoder. The measured linear
        complexity must equal the planted L EXACTLY at each of the four levels,
        the exact held-out continuation error must be zero at each, and the
        measured collision-bucket sizes must equal the known ones.
      failure_meaning: >-
        An instrument that cannot return a KNOWN recurrence length exactly, at
        four separated levels, cannot be trusted to report the absence of one.
        Failure at any level voids every complexity reading. A single LFSR check
        would demonstrate that the instrument returns a number; the four-level
        ladder demonstrates it resolves the quantity.
    - id: CTRL-GAUGE-INVARIANCE
      description: >-
        Isomorphic curve models and coordinate gauges with the SAME predicate
        definition transported explicitly. A complexity reading that changes under
        an equivalent gauge is a statement about the gauge.
      failure_meaning: >-
        An apparent compression that disappears under an equivalent gauge without
        a declared scope restriction is a falsification condition.
    - id: CTRL-LABEL-PERMUTATION
      description: >-
        Random target-independent permutations of alphabet labels and salted
        coordinate hashes, matched on balance. A complexity reading that depends
        on the labelling is a statement about the labelling.
      failure_meaning: >-
        Label-dependent readings are reported as such and receive no credit.
    - id: CTRL-NEARBY-RICHER-OBSERVABLE
      description: >-
        The richer elliptic-net observable is carried as a LABELLED NEARBY-OBJECT
        control and is explicitly NOT merged into this claim.
      failure_meaning: >-
        Merging it would conflate a representation that retains algebraic data
        with one that deliberately discards it.
    - id: CTRL-DLP-CALL-COUNTER
      description: >-
        Every finite-field or group discrete-logarithm call made by ANY
        state-index method is counted and reported. An N-entry state table is
        reported as Theta(N) advice.
      failure_meaning: >-
        A decoder that solves a discrete logarithm to invert a state has not
        avoided the problem; the counter makes that visible rather than leaving it
        to prose.
  independent_variables:
    - 'subgroup bit size, 12 through 26'
    - 'predicate psi, over the frozen one-bit, two-bit and four-symbol families'
    - 'window length w, doubling from 32'
    - 'salt fraction, in {0, 25, 50, 75, 100} percent'
    - 'object, in {elliptic-curve orbit word, matched random balanced word, LFSR word}'
    - 'coordinate gauge and alphabet labelling'
  metrics:
    primary:
      - >-
        normalized linear complexity L_w/w, dimensionless, per window per
        predicate per size, with the full profile over nested windows and the
        adjacent-size slopes.
      - >-
        exact held-out continuation error, an INTEGER COUNT of mismatched symbols
        on the disjoint suffix; only zero credits a recurrence.
      - >-
        state-collision bucket sizes, integer counts, with the target-weighted
        exponent u = log_N |C_state(Q)|, dimensionless, and exhaustive true-state
        recall as a fraction that must be exactly 1.000000.
      - >-
        complete state-index decoder cost: measured time slope and memory slope in
        log N, dimensionless, plus the raw operation counts and peak bytes.
      - >-
        count of finite-field or group discrete-logarithm calls made by any
        state-index method, an integer; nonzero is disqualifying for a
        constructive survivor.
      - >-
        fraction of the initial gap from NULL-RANDOM-WORD that disappears at full
        salt, dimensionless.
    secondary:
      - 'CTRL-LFSR-LADDER measured L against planted L, four rows, exact integers.'
      - 'null quantiles of the complexity profile from NULL-RANDOM-WORD at paired seeds.'
      - 'target queries, field and group operations, decoder work, peak bytes and output size, per target.'
      - 'preprocessing and advice totals, including every rejected predicate, in operations, seconds and bytes.'
      - 'break-even multi-target count T and total advice, for the amortization statement.'
      - 'per-run wall clock and peak memory.'
  heuristic_under_test: HEUR-WORD-3
  preregistered_prediction:
    quantity: >-
      The normalized linear complexity profile and the target-state collision
      exponent, on the curve arm and on the matched random-word null.
    formula: >-
      Falsification-oriented default: L_w/w at least 0.40 on each of the three
      largest windows and within 0.10 of the random-word null, and collision
      exponent u at least 1/2. A constructive survivor would instead require
      absolute L below N^0.49, target-weighted u below 0.49 with recall exactly
      1.000000, and both decoder slopes below 0.49 with zero discrete-logarithm
      calls and no N-entry table - all on the three largest completed sizes.
    source: >-
      IDEA-20260814-270e03's predictions block. The literature the proposal cites
      for the prior is recorded in H-ECDLP-92a375 at provenance `recalled` and was
      NOT opened by the design session; it is a pointer, not support.
  scale_relevance:
    tier: toy
    justification: >-
      12 to 26 bit public generated toy subgroups only, on public parameters, with
      no live cryptographic key involved. NOT TESTABLE AT REACHABLE SCALE, STATED
      PLAINLY: every exponent reported here is a SLOPE fitted over at most five
      sizes spanning 14 bits, and such a slope cannot establish an exponent at
      cryptographic N in either direction. The contract reports each slope with its
      error bars and the number of sizes it was fitted over, and asserts nothing
      beyond the tested range.
    correspondence: null
  tail_checks:
    - >-
      The rarest collision buckets are reported individually alongside the
      target-weighted expectation, because rare buckets dominating that
      expectation is HEUR-WORD-2's declared failure mode and a mean would hide it.
    - >-
      The single largest observed L_w/w gap between the curve arm and the matched
      random-word null, with the predicate, window and size achieving it, reported
      before and after salting.
    - >-
      The smallest observed collision bucket over all targets, since a single
      small bucket is what a constructive survivor would look like at the start.
  replication:
    seeds:
      - 'RUN-ECDLP-baeab8-1 (freeze and hash the design; CTRL-LFSR-LADDER at four known recurrence lengths): master seed 20260904141'
      - 'RUN-ECDLP-baeab8-2 (curve arm, 12-18 bits, full profile and exhaustive state buckets): master seed 20260904142'
      - 'RUN-ECDLP-baeab8-3 (curve arm, 20-26 bits, same): master seed 20260904143'
      - 'RUN-ECDLP-baeab8-4 (NULL-RANDOM-WORD at paired seeds, all sizes): master seed 20260904144'
      - 'RUN-ECDLP-baeab8-5 (CTRL-SALT-DECAY five-point ladder; CTRL-GAUGE-INVARIANCE; CTRL-LABEL-PERMUTATION): master seed 20260904145'
      - 'RUN-ECDLP-baeab8-6 (decoder audit with CTRL-DLP-CALL-COUNTER; amortization break-even): master seed 20260904146'
    independent_instances: 200
    replication_note: >-
      SEEDS POLICY. Each run declares one master seed; the driver derives every
      per-target and per-word seed from it and records the derivation rule and all
      derived seeds, plus the predicate and salt hashes, in the manifest.
      `independent_instances: 200` is the per-cell floor of live-target shifts.
      RUN-2/RUN-3 and RUN-4 are PAIRED: target index i on the curve arm and word
      index i in the random-word null come from the same derived seed, so the null
      is matched per instance and not merely in aggregate. THE FREEZE HASH FROM
      RUN-1 APPEARS IN EVERY LATER MANIFEST, which is what proves psi was not
      chosen after seeing target windows. No seed or frozen design element may
      change after RUN-1; a changed predicate family is a NEW contract.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 32
    maximum_memory_gb: 16
    maximum_runs: 6
    budget_feasibility_note: >-
      Sized to the WORK and above the template floors. The aggregate symbol budget
      is capped at 2^28 generated symbols and 20 GB of artifacts. The binding cost
      is exhaustive scalar enumeration for ground-truth state buckets at 26 bits,
      which is about 6.7e7 shifts per predicate, plus recurrence fitting whose
      naive cost is quadratic in the window - the declared fast alternative may be
      used and must be named in the manifest. If a size cannot be completed within
      the cap it is reported as NOT COMPLETED and excluded from every slope.
  stopping_rules:
    - >-
      ST-0 FREEZE GATE. No live-target shift may be generated until
      results/frozen_design.yaml exists and its hash is recorded. A run that
      samples before the freeze is INVALID, because psi chosen after seeing target
      windows is not a public predicate.
    - >-
      ST-1 PREDICATE STOP RULE. Stop a predicate after two successive largest
      windows show L_w/w at least 0.40 with no collision-bounded state, or as soon
      as any decoder invokes an uncharged generic discrete logarithm. Record the
      stop reason.
    - >-
      ST-2 PER-RUN CAP. 3600 seconds, 16 GB and the declared symbol budget per
      run; on approaching any cap the run STOPS and names every cell not
      completed. A size that is not completed is excluded from every slope and the
      exclusion is stated beside the slope.
    - >-
      ST-3 STOP AND REPORT ON AMBIGUITY. If a window schedule, an alphabet
      embedding field, or a decoder method cannot be resolved from the frozen
      design, the Executor STOPS AND REPORTS rather than choosing.
    - >-
      ST-4 NO INTERPRETATION. Observations only. The run package must not state
      whether the cheap-state mechanism is ruled out, must not write an evidence or
      decision record, and must not touch any hypothesis status.
    - >-
      ST-5 NO POST-HOC OPTIMIZATION. Symbol encodings, alphabet embeddings and
      field extensions are reported as frozen and are never re-chosen after
      results are seen.
  invalidation_rules:
    - >-
      INV-LFSR. CTRL-LFSR-LADDER does not return the planted recurrence length
      exactly at every level, or reports a nonzero held-out error on a known
      LFSR: the instrument is not measuring linear complexity and every reading is
      VOID.
    - >-
      INV-FREEZE. The frozen-design hash differs between runs, or a run sampled
      before the freeze: INVALID.
    - >-
      INV-RECALL. Exhaustive true-state recall is below 1.000000 in any completed
      cell: the ground truth is incomplete and that cell's collision exponent is
      VOID.
    - >-
      INV-CREDIT. A state credited as a recurrence with a nonzero held-out error:
      INVALID crediting; the state is rejected and the crediting logic is fixed
      before any further reading.
    - >-
      INV-UNCHARGED. A decoder cost reported without its preprocessing, advice,
      retries, output size and discrete-logarithm calls: INVALID, because a
      partially charged cost is not a cost.
    - >-
      INV-INFRASTRUCTURE. A timeout, crash, resource exhaustion or memory failure
      is recorded with its terminal status and IS INFRASTRUCTURE SIGNAL, NEVER
      evidence about HEUR-WORD-1, HEUR-WORD-2 or HEUR-WORD-3 (AGENTS.md rule 5).
  success_criterion: >-
    S1 (THE EXPECTED, FALSIFICATION-ORIENTED OUTCOME). CTRL-LFSR-LADDER returns
    all four planted lengths exactly; exhaustive recall is 1.000000 in every
    completed cell; and on the three largest completed sizes the curve arm shows
    L_w/w at least 0.40 and within 0.10 of NULL-RANDOM-WORD, collision exponent u
    at least 1/2, and no decoder achieving both slopes below 0.49 without an
    N-entry table or a discrete-logarithm call. S1 MET means the cheap-state
    mechanism is ruled out FOR THE FROZEN PREDICATE AND WINDOW FAMILY AT THE
    TESTED SIZES ONLY. IT IS NOT AN UNCONDITIONAL LOWER BOUND, DOES NOT CLOSE
    RECURRENCE METHODS, AND MAKES NO CLAIM AT CRYPTOGRAPHIC SCALE.
  falsification_criterion: >-
    F1 (THE CONSTRUCTIVE SURVIVOR, WHICH WOULD BE THE LARGE EVENT). On all three
    largest completed sizes: absolute L below N^0.49, exact held-out continuation
    error zero, target-weighted collision exponent u below 0.49 with recall
    exactly 1.000000, and complete state-index decoder time AND memory slopes both
    below 0.49 with zero discrete-logarithm calls and no N-entry advice. F1 MET
    requires IMMEDIATE INDEPENDENT REVIEW before any further use and is still
    scoped to the tested predicate and sizes; it is not an attack until every cost
    in complete_cost_boundary is charged and the scalar verifies. F2, VOIDING
    RATHER THAN FALSIFYING: any invalidation rule fires, in particular a failed
    LFSR ladder or a recall below 1.000000. F3, DECLARED IN ADVANCE AND BINDING
    UNDER EVERY OUTCOME: if NULL-RANDOM-WORD reproduces the curve arm's profile
    and collision exponent within the declared tolerance, or if apparent
    compression survives full salting, then nothing measured here may be quoted as
    a statement about elliptic curves or the ECDLP.
  required_artifacts:
    - experiments/EXP-ECDLP-baeab8/driver/generate_words.py
    - experiments/EXP-ECDLP-baeab8/driver/fit_recurrence.py
    - experiments/EXP-ECDLP-baeab8/driver/state_buckets.py
    - experiments/EXP-ECDLP-baeab8/driver/decoder_audit.py
    - experiments/EXP-ECDLP-baeab8/results/frozen_design.yaml
    - experiments/EXP-ECDLP-baeab8/results/frozen_design_hash.txt
    - experiments/EXP-ECDLP-baeab8/results/lfsr_ladder.json
    - experiments/EXP-ECDLP-baeab8/results/complexity_profiles.json
    - experiments/EXP-ECDLP-baeab8/results/collision_buckets.json
    - experiments/EXP-ECDLP-baeab8/results/decoder_costs.json
    - experiments/EXP-ECDLP-baeab8/results/salt_decay.json
    - experiments/EXP-ECDLP-baeab8/results/charging_ledger.json
    - experiments/EXP-ECDLP-baeab8/results/summary.json
    - experiments/EXP-ECDLP-baeab8/results/seed_env_manifest.yaml
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-1/manifest.yaml
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-1/results.json
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-1/stdout.log
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-2/manifest.yaml
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-2/results.json
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-2/stdout.log
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-3/manifest.yaml
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-3/results.json
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-3/stdout.log
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-4/manifest.yaml
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-4/results.json
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-4/stdout.log
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-5/manifest.yaml
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-5/results.json
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-5/stdout.log
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-6/manifest.yaml
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-6/results.json
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-6/stdout.log
    - experiments/EXP-ECDLP-baeab8/runs/RUN-ECDLP-baeab8-6/certificates/
  required_artifacts_note: >-
    CERTIFICATE REQUIREMENT. Retain, per completed cell, the curve and subgroup
    parameters, the predicate and salt hashes, the source and live-target windows,
    the fitted minimal polynomials, the held-out reproduction transcript, the exact
    collision-bucket hash and the true bucket, the decoder trace, and the
    verification that the recovered scalar satisfies [k]P = Q for any claimed
    solve. Any claimed solve without a re-verified certificate is never counted.
    results/frozen_design.yaml and its hash are written by RUN-1 before any
    live-target shift is generated and are referenced in every later manifest.
    results/charging_ledger.json carries the preprocessing, advice, per-attempt,
    retry, output and multi-target amortization accounting, including every
    rejected predicate.
  run_plan:
    - id: RUN-ECDLP-baeab8-1
      description: 'freeze and hash psi, alphabets, window schedule, recurrence algorithm and decoder audit; CTRL-LFSR-LADDER at planted lengths 8, 16, 32, 64'
    - id: RUN-ECDLP-baeab8-2
      description: 'curve arm at 12-18 bits: complexity profiles, exact held-out continuation, exhaustive state buckets'
    - id: RUN-ECDLP-baeab8-3
      description: 'curve arm at 20-26 bits: same measurements; sizes not completed are named and excluded from slopes'
    - id: RUN-ECDLP-baeab8-4
      description: 'NULL-RANDOM-WORD matched curve-free null at paired seeds across all sizes'
    - id: RUN-ECDLP-baeab8-5
      description: 'CTRL-SALT-DECAY at 0/25/50/75/100 percent; CTRL-GAUGE-INVARIANCE; CTRL-LABEL-PERMUTATION; CTRL-NEARBY-RICHER-OBSERVABLE labelled separately'
    - id: RUN-ECDLP-baeab8-6
      description: 'decoder audit with CTRL-DLP-CALL-COUNTER and full charging ledger; multi-target break-even; certificates for any claimed solve'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract did NOT open either
      external paper the source proposal lists under primary_sources_checked
      (arXiv:1509.06909 and arXiv:1302.4210). Both are carried in H-ECDLP-92a375
      at provenance `recalled` with verified_by null, and neither may discharge a
      supporting result or back a decision until an agent that actually read it
      says so in a new record. The proposal ASSERTS it checked them; this contract
      does not adopt that assertion as a verification by this program. The design
      session also did not open the legacy idea records the proposal names as
      nearest prior art.
  source_refs:
