    and reject the nearby claim that
    the x-read oracle is simulable.
  preregistered_prediction:
    quantity: >
      Stage 0 instrument: trivial
      simulable at 0; x-read not
      simulable; KF rejected; NULL
      missing-input rejected.
    formula: >
      Trivial oracle returns a fixed
      2-vector independent of input.
      X-read oracle returns (label, 0).
      A simulator that may use only
      group operations and equality
      cannot recover the integer label.
    source: IDEA-20260807-0f49b6 null_object_control (internal)
    claim_tier: observational
  inputs:
    fixture:
      toy_group: {n: 5, labels: [0, 1, 2, 3, 4]}
      real_trivial: {kind: constant_basis, must_simulable: true, must_overhead: 0}
      real_xread: {kind: integer_label_dependent_basis, must_simulable: false}
      known_false: {kind: claim_xread_is_simulable, must_reject: true}
      matched_null: {kind: missing_input, must_reject: true}
  controls:
    - name: known_false_xread_simulable
      object: KF claim x-read is simulable
    - name: matched_null
      object: missing-input oracle
  independent_variables:
    - oracle_kind
  metrics:
