# EXP-FROB-792fc6
# Jacobian-ceiling arithmetic. No curve.
# Approved by DEC-20261002-db36d2.
experiment:
  id: EXP-FROB-792fc6
  hypothesis_id: H-FROB-6e6a16
  source_idea: IDEA-20261002-711e84
  question_id: RQ-FROB-7d8dd4
  version: 1
  title: Jacobian-ceiling arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-db36d2
  objective: >-
    Check that 288 is 32 above 256 and 1 below 289, that 32 is 7
    above 25 and 4 below 36, and that 2 to the 11 is 2048.
  inputs:
    twelve_sq_times_two: 288
    sixteen_sq: 256
    gap_above_16: 32
    seventeen_sq: 289
    gap_below_17: 1
    jacobian_ceiling: 33
    four_sq_times_two: 32
    five_sq: 25
    gap_above_5: 7
    six_sq: 36
    gap_below_6: 4
    curve_ceiling: 8
    h_coefficients: 4
    f_coefficients: 7
    coefficient_sum: 11
    pair_count: 2048
    false_pair_count: 1024
    degree_gap: 3
  controls:
    - >-
      288 is 32 above 256 and 1 below 289. Reporting 288 as at least
      289 invalidates the run.
    - >-
      32 is 7 above 25 and 4 below 36. The curve-point ceiling 8 is
      not the Jacobian ceiling 33.
    - >-
      Four plus seven is 11, and 2 to the 11 is 2048. The count 1024
      is the nearby false pair count. Reporting 1024 as the model
      count invalidates the run.
    - Nine minus 6 is 3.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - route in {square_comparison, decimal_products}
  metrics:
    primary:
      - gap_above_16
      - gap_below_17
      - pair_count
      - implementations_agree
    secondary:
      - curve_ceiling
      - degree_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      288 is 32 above 256 and 1 below 289, and 2 to the 11 is 2048.
    formula: >-
      Square 12 and multiply by 2. Square 16 and square 17. Square 4
      and multiply by 2, then compare with 25 and 36. Add 4 and 7 and
      raise 2 to that power.
    source: >-
      IDEA-20261002-711e84 states the ceiling 33 and the count 2048,
      read 2026-10-02. The squares were computed in this design
      session. That computation is not a run. No curve was enumerated.
  scale_relevance:
    tier: toy
    justification: Integers. No transfer to a curve of degree 131.
    correspondence: null
  tail_checks:
    - The gap 1 below 289 is required. A check that stops at 256 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 32 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - 288 is not 32 above 256.
    - 288 is not 1 below 289.
    - 2 to the 11 is not 2048.
    - The Jacobian ceiling is reported as 34.
    - The pair count 1024 is reported as the model count.
    - The curve-point ceiling 8 is reported as the Jacobian ceiling.
    - A curve is enumerated or an eliminant is computed.
  success_criterion: >-
    Both runs agree that 288 is 32 above 256 and 1 below 289, that
    32 is 7 above 25 and 4 below 36, that 2 to the 11 is 2048, and
    that 8 is not 33.
  falsification_criterion: >-
    The runs agree that 12 squared times 2 is 288, and 288 is not 32
    above 256.
  required_artifacts:
    - experiments/EXP-FROB-792fc6/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-FROB-792fc6/runs/<RUN-ID>/command.txt
    - experiments/EXP-FROB-792fc6/runs/<RUN-ID>/stdout.log
    - experiments/EXP-FROB-792fc6/runs/<RUN-ID>/stderr.log
    - experiments/EXP-FROB-792fc6/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-FROB-792fc6/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve enumeration, Cantor composition, or eliminant.
    - Any claim that the ceiling 33 changes the rho exponent.
    - Any measured degree of a membership polynomial.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
