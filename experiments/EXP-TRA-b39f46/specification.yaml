experiment:
  id: EXP-TRA-b39f46
  hypothesis_id: H-TRA-4344b7
  derived_from_idea: IDEA-20260807-018769
  question_id: RQ-TRA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Is the transfer-operator barrier a property of the PARTITION - exact coarse
    operators on (x-interval, sign of y) cells and one non-symmetric interval
    family, measured detailed-balance residual and max |Im lambda| against the
    committed x-interval floors, with a random-permutation null and a C equal to
    n positive control

  objective: >-
    The one uncertainty a run reduces - whether the exact reversibility and
    entirely real spectra recorded in EV-TRA-001 across all 54 coarse operators
    are a property of the translation walk or of the x-interval cells on which
    they were measured, which identify P with -P by construction. A run
    establishes (i) the detailed-balance residual and max |Im lambda| of the
    exact coarse operator on cells that distinguish P from -P, at three group
    orders, computed by exact linear algebra with no sampling; (ii) the same two
    quantities on a random permutation of a group of the same order under the
    identical partition, which is what separates a property of the walk from an
    artifact of breaking the fold; and (iii) whether the harness reproduces
    EV-TRA-001's committed residual of 2.5e-17 and max |Im lambda| of 3.7e-16 on
    the original x-interval cells, without which no new number from it means
    anything. Only if phases appear does the run proceed to re-measure the
    localisation L(S,C) and its fitted growth exponent. No attack, break, speedup
    or security consequence is claimed here or would follow from a run.

  what_this_is_not:
  - >-
    Not an attack, a key recovery, a distinguisher or a cost improvement. The
    committed charged costs in this lane are 11,358 to 51,135 times sqrt(n) and
    nothing in this contract improves them.
  - >-
    Not a dispute of EV-TRA-001 inside its declared boundary. That record's own
    unresolved_confounds name non-negation-symmetric partitions as untested; this
    contract tests them.
  - >-
    Not a status change to any hypothesis, evidence record, decision or goal, and
    not a promotion of any knowledge entry.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed group orders, cell counts and
      partition families, the exact coarse operator has a stated detailed-balance
      residual and a stated max |Im lambda|, and the random-permutation null has
      stated values for the same two quantities. If Stage 3 runs, L(S,C) and its
      fitted growth exponent have stated values on the non-symmetric family at
      matched C. WHAT DOES NOT FOLLOW - no statement about partitions not built;
      no statement about larger n beyond the declared HEUR-TRAP-1 trend; no
      general theorem that the barrier is or is not partition-independent, which
      would be a proof-oriented claim requiring its own map and its own contract;
      and no attack or cost consequence at any scale.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Declare the y-sign convention, the
      interval families, the matched-C comparison plan, and the two decision
      thresholds - residual above 1e-10 and max |Im lambda| above 1e-10 count as
      leaving the numerical-zero floor. All are fixed before any operator is
      built, because a threshold chosen after seeing a spectrum is a fit to noise.
      STAGE 1 (regression, blocking, minutes). Rebuild the exact coarse operator
      on EV-TRA-001's ORIGINAL x-interval cells at the committed n and C and
      reproduce detailed-balance residual 2.5e-17 and max |Im lambda| 3.7e-16 to
      within the reported precision. Report the matrix conditioning. A harness
      that does not reproduce the committed floors is not measuring the new
      object either and the run stops.
      STAGE 2 (positive control, blocking, minutes). With C equal to n, the coarse
      operator is the walk itself and k must be recovered exactly, as EXP-TRA-001
      already implements. If it is not, nothing is reportable.
      STAGE 3 (primary null, run BEFORE any positive reading). Apply the identical
      (x-interval, sign) construction and the identical non-symmetric family to a
      RANDOM PERMUTATION of a group of the same order, as EXP-TRA-001 already
      implements as its negative control, and record the residual and max
      |Im lambda|. Three independent permutation draws.
      STAGE 4 (signal arm, zero sampling). Build the exact C by C coarse operator
      for the genuine translation-by-P walk on (x-interval, sign) cells and on the
      non-symmetric interval family, at three group orders, and report the
      residual, the full spectrum, max |Im lambda|, and the conditioning.
      STAGE 5 (conditional, only if Stage 4 shows phases above threshold on the
      signal arm and not on the null). Re-measure L(S,C) and the charged cost with
      the existing estimator on the new family at MATCHED C, against the same
      positive and negative controls, and fit the growth exponent.
      STAGE 6 (zero compute). Assemble the residual and spectrum tables across
      (arm, partition family, n, C), the HEUR-TRAP-1 trend across the three n, and
      the refusal statement for any quantity outside what was built.
    instrument: >-
      tra1_koopman.sage from experiments/EXP-TRA-001, extended to index cells by
      (x-interval, sign of y) and to accept one deliberately non-symmetric
      interval family. Transition probabilities computed EXACTLY by enumerating
      the group; no sampling anywhere. Eigenvalues computed in exact or
      high-precision arithmetic with the conditioning number reported per
      operator, since floating-point conditioning at larger C can manufacture
      spurious imaginary parts. Recorded through harness/runner.py with the
      instrument sha256 recorded against the pinned EXP-TRA-001 instrument.
    parameters: >-
      Three group orders n spanning the range EXP-TRA-001 used, exact values fixed
      at Stage 0. Short Weierstrass over F_p with p odd; y-sign taken as the
      representative in [0,(p-1)/2). Partition families - (a) original x-interval
      cells, (b) (x-interval, sign of y) cells, (c) one deliberately non-symmetric
      interval family. Comparisons made at MATCHED cell count C, since family (b)
      has 2C cells for the same interval count. Three random-permutation draws per
      null cell.

  controls:
  - >-
    PRIMARY NULL, mandatory and run first - the identical partition applied to a
    random permutation of a group of the same order, already implemented in
    EXP-TRA-001. If the null loses reversibility and gains complex eigenvalues at
    the same rate, the phases are an artifact of fold-breaking and carry nothing
    about the translation walk.
  - >-
    POSITIVE CONTROL, blocking and retained unchanged - C equal to n must recover
    k exactly on the new partition too.
  - >-
    REGRESSION, blocking - reproduce EV-TRA-001's max |Im lambda| 3.7e-16 and
    detailed-balance residual 2.5e-17 on the ORIGINAL x-interval cells before any
    new number is trusted.
  - >-
    MATCHED-C comparison - L and the spectra are compared at matched cell count,
    never at matched interval count, since the sign coordinate doubles C for the
    same interval family.
  - >-
    CONDITIONING CONTROL - the eigenvalue computation's conditioning number is
    reported per operator, and any max |Im lambda| within the conditioning bound
    is reported as indistinguishable from zero rather than as a phase.
  - >-
    PRE-DECLARED THRESHOLDS - residual and max |Im lambda| above 1e-10 count as
    leaving the floor, fixed at Stage 0 before any operator is built.

  independent_variables:
  - >-
    partition family - x-interval versus (x-interval, sign of y) versus
    deliberately non-symmetric intervals
  - 'arm - genuine translation-by-P walk versus random-permutation null'
  - group order n
  - cell count C

  metrics:
    primary:
    - >-
      detailed-balance residual - dimensionless - computed as the maximum over
      cell pairs (i,j) of |pi_i K_ij - pi_j K_ji| with pi the stationary vector of
      the exact coarse operator K, reported per (arm, family, n, C) cell; the
      committed x-cell value is 2.5e-17
    - >-
      max |Im lambda| - dimensionless - the largest absolute imaginary part over
      the full spectrum of the exact coarse operator, reported per cell alongside
      the conditioning number; the committed x-cell value is 3.7e-16
    - >-
      regression agreement - boolean per quantity - whether Stage 1 reproduced the
      two committed x-interval values to within their reported precision
    - >-
      positive-control verdict - boolean - whether C equal to n recovered k
      exactly on each partition family
    secondary:
    - >-
      L(S,C) - dimensionless localisation as defined by EXP-TRA-001's estimator -
      measured only if Stage 5 is triggered, at matched C, with its fitted growth
      exponent and confidence interval against the committed 0.0195
    - >-
      charged cost as a multiple of sqrt(n) - measured only if Stage 5 is
      triggered, for comparability with the committed 11,358 to 51,135 range
    - >-
      full spectrum per operator, retained in raw form so a summary cannot hide a
      single complex pair
    - >-
      matrix conditioning number per operator
    - >-
      wall time and peak memory per cell, and an explicit list of censored cells
      recorded as infrastructure

  heuristic_under_test:
    id: HEUR-TRAP-1
    formal_statement: >-
      The spectral behaviour of the exact coarse operator at toy n is
      directionally representative of larger n at matched C/n, in the sense that
      the sign of the detailed-balance residual's departure from the
      numerical-zero floor and of max |Im lambda|'s departure does not reverse as
      n grows at fixed C/n.
    tested_here: partially
    how: >-
      By computing at three values of n at matched C/n and reporting the trend in
      both quantities rather than a single value. This is a weak test over a
      narrow range and is declared as such - it cannot rule out a reversal beyond
      the tested n, and every reading is capped accordingly in claim_ceiling.

  preregistered_prediction:
    quantity: >-
      The detailed-balance residual and max |Im lambda| of the exact coarse
      operator on (x-interval, sign of y) cells, at matched C, against the
      committed x-interval values 2.5e-17 and 3.7e-16.
    formula: >-
      Predicted residual above 1e-10 and max |Im lambda| above 1e-10 on the
      non-symmetric families, with the random-permutation null and the x-interval
      regression both remaining below 1e-10. Under the null that the barrier is a
      property of the walk rather than of the partition, both quantities stay
      below 1e-10 on every family.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-018769, whose
      predictions block states minimum_effect as any value many orders above the
      2.5e-17 floor and as leaving the 3.7e-16 floor at all, and whose
      honest_prior_of_survival records 0.80 and 0.65 for these two outcomes and
      0.10 for L growing, before any run under this contract exists. The numeric
      threshold 1e-10 is this contract's operationalisation of many orders above
      the floor, fixed before any run. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at the same toy group orders EXP-TRA-001 used, because the whole
      point is that the operator can be built EXACTLY there by enumerating the
      group, with no sampling and therefore no sampling error to confuse with a
      spectral phase. Comparability with the committed record is the design's
      entire basis, and it is only available at those sizes. The transfer
      assumption to larger n is stated as HEUR-TRAP-1, is tested only weakly by a
      three-point trend, and is NOT used to claim anything about larger n.
    correspondence: null

  tail_checks:
  - >-
    Report the full spectrum, not just max |Im lambda|, so that a single complex
    conjugate pair near the threshold is visible rather than summarised away.
  - >-
    Report max |Im lambda| against the operator's conditioning number in the same
    row; a value within the conditioning bound is reported as indistinguishable
    from zero, never as a phase.
  - >-
    Report the three random-permutation draws separately as well as their range,
    since a null summarised by a mean can hide a draw that matches the signal.
  - >-
    Report the residual as a maximum over cell pairs AND the identity of the
    worst pair, since a residual driven by one degenerate cell is a different
    object from a residual spread over the partition.
  - >-
    If Stage 5 runs, report the fitted exponent's confidence interval and the
    per-n L values, since a fitted exponent over three points with a wide
    interval cannot distinguish 0.0195 from 0.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.5
    maximum_memory_gb: 8
    maximum_runs: 24

  stopping_rules:
  - >-
    Stop immediately if the Stage 1 x-interval regression does not reproduce
    EV-TRA-001's committed residual and max |Im lambda| to within their reported
    precision.
  - >-
    Stop immediately if the C equal to n positive control does not recover k
    exactly.
  - >-
    Do not execute Stage 5 unless Stage 4 shows both quantities above 1e-10 on the
    signal arm AND the null arm below 1e-10 in the same cell. L is not measured on
    a family with no phases.
  - >-
    Do not read any signal cell before its matching null cell has been executed in
    the same invocation.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
    exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence
    (AGENTS.md rule 5).
  - >-
    A run whose null arm is missing, or whose null arm was not executed in the
    same invocation as the signal arm, is invalid_measurement.
  - >-
    A run reporting max |Im lambda| without the matching conditioning number is
    invalid_measurement - the number cannot be distinguished from a floating-point
    artifact and the contract exists to make that distinction.
  - >-
    A run comparing L or spectra at matched interval count rather than matched C
    is invalid_measurement, since the sign coordinate doubles C for the same
    interval family.
  - >-
    A run whose parameters, y-sign convention, interval families or thresholds
    differ from the frozen contract is a DIFFERENT experiment and requires a new
    contract; it is never a repair of this one.

  success_criterion: >-
    The Stage 1 regression reproduces both committed x-interval values, the C
    equal to n positive control recovers k exactly on every family, and the run
    reports the detailed-balance residual, the full spectrum, max |Im lambda| and
    the conditioning number for the genuine arm and all three random-permutation
    draws, on the (x-interval, sign) family and the non-symmetric family, at all
    three group orders and at matched C. This criterion is decidable from the
    primary metrics alone and says nothing about which values those quantities
    take.

  falsification_criterion:
  - >-
    The detailed-balance residual and max |Im lambda| both stay below 1e-10 on the
    non-symmetric families at all three n, with the regression and positive
    control passing. Part A of the hypothesis is false, the barrier is general
    rather than partition-specific, and the measured residuals across both
    partition families are the recorded obstruction - which is the proved-negative
    direction KN-OPEN-010 says would be valuable.
  - >-
    Phases appear above 1e-10 but Stage 5 finds L(S,C) flat with a fitted exponent
    whose interval includes 0.0195 at matched C. Part B is false; character
    orthogonality forces localisation regardless of the phase channel, which is a
    stronger and more general barrier statement than the one currently committed.
  - >-
    The random-permutation null exceeds 1e-10 on the same quantities at the same
    rate as the genuine walk. The effect is fold-breaking, not the walk, and no
    reading of the signal arm is admissible.
  - >-
    The Stage 1 regression fails. The harness is not measuring the committed
    object and nothing at all is reportable.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
    model and inference block, instrument sha256 against the pinned EXP-TRA-001
    instrument, arithmetic precision used, and environment
  - >-
    raw-result.json carrying the full spectrum of every operator and every
    per-cell-pair detailed-balance term, not summaries
  - >-
    the null arm's measurements for all three permutation draws, in the same file
    as the signal arm
  - >-
    the Stage 0 pre-declaration text, written before the first operator is built
    and hashed, containing the y-sign convention, the interval families, the
    matched-C plan and the two thresholds
  - >-
    the Stage 1 regression output compared line by line against EV-TRA-001's
    committed 2.5e-17 and 3.7e-16
  - >-
    per-operator conditioning numbers, and an explicit list of censored cells

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement
    approval is the USER's gate because it authorizes execution and spends
    compute. This contract is NOT approved - approved_by is null and
    execution_authorized is false (AGENTS.md rule 1).
  - >-
    The parent proposal is not proof-oriented and the paired hypothesis records
    not_applicable_reason on its proof_search_map, so no KN-TECH-080 audit is
    required before implementation. Promoting the flat-L outcome into a general
    partition-independent barrier THEOREM would be proof-oriented and needs its
    own map and its own contract.
  - >-
    The y-sign convention, interval families, matched-C plan and the 1e-10
    thresholds must be recorded at Stage 0 before any operator is built.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260807-018769
    authored_at: '2026-08-25'
    note: >-
      Controls, metrics, staging and falsification conditions are taken from the
      parent proposal's minimal_test, null_object_control, predictions and
      falsification_conditions blocks rather than re-invented. The committed
      comparison values 2.5e-17, 3.7e-16 and 0.0195, and the charged-cost range
      11,358 to 51,135 times sqrt(n), are quoted from EV-TRA-001 and
      DEC-20260718-007 as those records' claims, not asserted here. Budgets come
      from the parent's declared estimated_cost (implementation low, compute low)
      and from the fact that 54 exact operators were already built in
      EXP-TRA-001. No field is invented.

  derivation_gaps:
  - >-
    The exact group orders n and cell counts C are not fixed by the proposal
    beyond same toy n as the committed run. They must be pinned at Stage 0,
    because choosing n after seeing a residual would select for the outcome.
  - >-
    The deliberately non-symmetric interval family is unspecified. A Coordinator
    or the executor at Stage 0 must fix it and record the rule that generates it,
    since a family chosen after seeing the (x-interval, sign) result would be a
    second bite at the same question.
  - >-
    Whether the random-permutation null must preserve the group structure or only
    the order is not settled by the proposal. The two give nulls of different
    strength and the executor must record which was used.
  - >-
    The 1e-10 thresholds are this contract's operationalisation of the proposal's
    many orders above the floor. They are defensible against floors of 1e-17 and
    1e-16 but they are a choice, and a measured value between the floor and 1e-10
    must be reported as such rather than forced into either bin.
