# EXP-MONO-49ce45
# Frobenius image of the signed-sum fibre over the ordered base.
# Frozen before any run. The orders below are a prediction, not a result.
experiment:
  id: EXP-MONO-49ce45
  hypothesis_id: H-MONO-2f05e9
  source_idea: IDEA-20261005-70b25b
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  version: 1
  title: >-
    Ordered-base signed-sum image of order 4 at p=101
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-5b87ad
  objective: >-
    For each frozen curve, take the first 64 good ordered pairs,
    let Frobenius act on the four signed sums, and record the
    group order, the number of 4-cycles, the partition breaks,
    and the split and inert counts of the two sum x-coordinates.
  inputs:
    prime: 101
    modulus: "z^8 + 2"
    field: "F_101[z] / (z^8 + 2)"
    sampler: "u = (37*k + 11) mod 10201; x1 = u mod 101; x2 = u // 101"
    sample_size: 64
    ordinary_panel:
      - {A: 1, B: 1, role: ordinary, point_count: 105, psi_order: 4, four_cycles: 0, partition_breaks: 0, character_disagreements: 0, split: 33, inert: 31, indices_consumed: 65}
      - {A: 2, B: 3, role: ordinary, point_count: 96, psi_order: 4, four_cycles: 0, partition_breaks: 0, character_disagreements: 0, split: 33, inert: 31, indices_consumed: 67}
      - {A: 4, B: 1, role: ordinary, point_count: 112, psi_order: 4, four_cycles: 0, partition_breaks: 0, character_disagreements: 0, split: 34, inert: 30, indices_consumed: 69}
      - {A: 1, B: 2, role: ordinary, point_count: 100, psi_order: 4, four_cycles: 0, partition_breaks: 0, character_disagreements: 0, split: 33, inert: 31, indices_consumed: 67}
    artifact_panel:
      - {A: 0, B: 1, role: artifact, j: 0, supersingular: true, point_count: 102, psi_order: 4, four_cycles: 0, partition_breaks: 0, character_disagreements: 0, split: 30, inert: 34, indices_consumed: 66}
      - {A: 1, B: 0, role: artifact, j: 1728, supersingular: false, point_count: 100, psi_order: 4, four_cycles: 0, partition_breaks: 0, character_disagreements: 0, split: 31, inert: 33, indices_consumed: 76}
    null_quartic:
      modulus_index: "u = (37*k + 11) mod 104060401"
      polynomial: "c0 + c1*T + c2*T^2 + c3*T^3 + T^4, base-101 digits of u, low degree first"
      separable_count: 64
      type_3_plus_1: 20
      indices_consumed: 64
  controls:
    - >-
      Character control. A good pair is split when both sum
      x-coordinates lie in F_p, and inert when Frobenius swaps
      them. Split must match Legendre(f(x1)) Legendre(f(x2)) = 1,
      and inert must match that product equal to -1. A mismatch
      invalidates the cell.
    - >-
      Null quartic. Sixty-four separable monic quartics from the
      frozen index. Twenty have irreducible-factor degrees
      {1, 3}. Zero such factorizations invalidate the batch.
    - >-
      Partition. Each Psi permutation is checked against the two
      pairs of equal x-coordinates. A break is a result.
    - >-
      Order gap. The symmetric-base contract on these curves
      predicts order 8. This contract predicts order 4. The two
      samplers are not interchangeable.
    - >-
      Artifact separation. j=0 and j=1728 are reported and are
      not counted in the ordinary tally.
  independent_variables:
    - curve in the six frozen (A, B) pairs
    - role in {ordinary, artifact}
  metrics:
    primary:
      - psi_order
      - four_cycles
      - partition_breaks
      - character_disagreements
    secondary:
      - split
      - inert
      - point_count
      - null_type_3_plus_1
      - indices_consumed
  heuristic_under_test: H1
  preregistered_prediction:
    quantity: >-
      Psi image order 4 and zero 4-cycles on every curve.
      Character disagreements are 0. Ordinary split and inert
      counts are 33 and 31, 33 and 31, 34 and 30, and 33 and 31.
      The null has 20 factorizations of type 3+1.
    formula: >-
      A good index has x1 distinct from x2, both y-coordinates
      nonzero, and four distinct signed sums, none at infinity.
      Frobenius is the p-power map. Cycle type is labelling
      independent. Split means both sum x-coordinates are fixed
      by Frobenius. Inert means they are swapped.
    source: >-
      IDEA-20261005-70b25b, specialized to p=101 and to the
      curves named in inputs. The counts were computed in the
      design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      One 7-bit prime and fibre size 4. No transfer to a
      cryptographic prime or to m greater than 3.
    correspondence: null
  tail_checks:
    - >-
      The curve (4, 1) has 34 split pairs and 30 inert pairs.
      Dropping that curve invalidates the batch.
    - >-
      The null count is 20. A rerun that emits zero
      factorizations of type 3+1 does not decide the panel.
  replication:
    seeds: ["lcg-37-11"]
    independent_instances: 1
    replication_note: >-
      Deterministic. One manifest per curve. The null quartic
      is recomputed in every manifest.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - Stop after six valid manifests, one per frozen curve.
    - Do not add a prime, a curve, or a sample size.
    - Do not replace an ordered pair by its symmetric coordinates.
  invalidation_rules:
    - A character disagreement is positive.
    - The null type 3+1 count is not 20.
    - The point count differs from the frozen table.
    - A sample whose Frobenius image misses the four-point set is counted as bad, and any positive bad count invalidates the cell.
    - A split or inert count differs while the Psi order is still 4 and the four-cycle count is still 0. That mismatch does not falsify the order reading.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    All six manifests are valid. Each curve has Psi order 4,
    four-cycles 0, partition breaks 0, and character
    disagreements 0. Ordinary split and inert counts are
    33 and 31, 33 and 31, 34 and 30, and 33 and 31. Artifact
    split and inert counts are 30 and 34, then 31 and 33.
    Every null count is 20.
  falsification_criterion: >-
    Character disagreements are 0, the null count is 20, the
    point counts match, and an ordinary curve has Psi order
    other than 4, a positive four-cycle count, or a positive
    partition-break count. An artifact mismatch does not meet
    this criterion. A split or inert mismatch with Psi order
    still 4 and zero four-cycles does not meet it either.
  required_artifacts:
    - experiments/EXP-MONO-49ce45/runs/<run-id>/command.txt
    - experiments/EXP-MONO-49ce45/runs/<run-id>/stdout.txt
    - experiments/EXP-MONO-49ce45/runs/<run-id>/stderr.txt
    - experiments/EXP-MONO-49ce45/runs/<run-id>/result.json
  assigned_to: executor
  out_of_scope:
    - The symmetric base of IDEA-20261005-ddbf31.
    - Any prime other than 101.
    - Any curve outside the six frozen pairs.
    - Inertia along f(x1) = 0 or f(x2) = 0. This contract does not claim that Frobenius generates the geometric image.
    - A relation rate, a factor base, or a discrete logarithm.
    - Editing H-MONO-9df9c0 or EXP-MONO-220932.
