    user authorization. Stage 0 is the exact
    nonbacktracking-exchange calibrator.

  objective: >
    Evaluate the exact identity that on
    U={0,1,2}, u=1, S={0}, last exchange
    (remove 1, add 0) one has n_nb=1,
    and rejects the nearby claim that
    all Johnson neighbors remain legal
    (n=2), on one frozen family
    (REAL, KF, NULL). Stage 0 does not
    form a nested LHW generator and
    does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      n_all=2 and n_nb=1; KF
      all-neighbors claim 2 rejected
      because n_nb=1; NULL empty
      universe rejected; negative
      weight rejected. Certificate
      kind none.
    formula: >
      Weight-1 exchanges replace the
      unique element. REAL: last
      inverse excluded, n_nb=1.
      KF: claim n_nb=2, actual
      n_nb=1, rejected as a generic
      legal-move target.
    claim_tier: observational

  inputs:
    fixture:
      real_exchange:
        universe: [0, 1, 2]
        weight: 1
        subset: [0]
        last_removed: 1
        last_added: 0
        must_n_all: 2
        must_n_nb: 1
      known_false:
        kind: all_johnson_neighbors_legal
        claimed_n_nb: 2
        must_n_nb: 1
        must_reject: true
      matched_null:
        kind: empty_universe
        must_reject: true
      invalid:
        - {weight: -1, must_reject: true}

  controls:
    - name: known_false_all_neighbors
      object: KF claim n_nb equals Johnson degree
    - name: matched_null
      object: empty universe
    - name: invalid_weight
      object: negative weight

  independent_variables:
    - universe
    - weight
    - subset
    - last_exchange
  metrics:
    primary:
      - fixture_pass
      - real_nb_count_pass
      - known_false_all_neighbors_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - real_nb_count_pass
    - known_false_all_neighbors_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact integer tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
