---
# Frozen Experiment Specification — EXP-MLDSA-a8d531
# Coordinator: TASK-20260805-bebfbc (BATCH-214d98, GOAL-MLDSA-001)
# Frozen: 2026-08-05
# Status: approved
# ─────────────────────────────────────────────────────────────────────────
# BATCH-003 FIPS 204 body constraint (DEC-20260805-0d59ff):
#   This experiment scopes to academic literature only. The Shin DFA paper
#   (KN-LIT-340675) and the formal proofs (KN-LIT-3907, KN-LIT-8ce0b5) are
#   academic sources. No claim is made about FIPS 204 body parameters. If
#   any proof section requires FIPS 204-specific parameter values for its
#   adversary model, record as a blocking constraint, not an experimental result.
# ─────────────────────────────────────────────────────────────────────────

experiment:
  id: EXP-MLDSA-a8d531
  hypothesis_id: H-MLDSA-f3a291
  # NOTE: H-MLDSA-f3a291 is a newly allocated ID (no prior H-MLDSA-* records
  # exist in the ledger). The archival task must create the hypothesis record
  # and confirm no ID collision via tools/allocate_id.py --check.
  version: 1
  title: >-
    Shin DFA Challenge-Sampling Fault Class: Adversary-Model Placement
    Relative to KN-LIT-3907 and KN-LIT-8ce0b5
  status: approved
  approved_by: coordinator
  source_proposal: IDEA-20260805-a8d531
  assigned_to: executor

  objective: >-
    Determine whether the Shin DFA fault class (KN-LIT-340675) —
    challenge-sampling procedure faults on deterministic ML-DSA — falls
    within the adversary models of either of the two existing formal proofs:
    (1) Barbosa et al. ROM/QROM CMA-security proof (KN-LIT-3907);
    (2) Gupta NTT-twiddle rank-bound proof (KN-LIT-8ce0b5).
    If both models explicitly exclude challenge-generation faults, record
    a named, bounded proof coverage gap with cited section references.
    This is a CORPUS ANALYSIS task. No implementation, no computation.

  # ─────────────────────────────────────────────────────────────
  # INPUTS
  # ─────────────────────────────────────────────────────────────
  inputs:
    primary_sources:
      - id: KN-LIT-3907
        file: "downloads/140850158.pdf (local copy per KN-LIT-3907 metadata)"
        access_note: >-
          Full text required. Local PDF listed in KN-LIT-3907.md.
          If PDF is inaccessible, attempt ePrint 2023/916 (Barbosa et al.,
          CRYPTO 2023). Record access status in the run receipt.
        required_sections:
          - "Adversary model / Security model definition section"
          - "Signing oracle specification (CMA game definition)"
          - "Any section discussing physical or fault adversaries"
      - id: KN-LIT-8ce0b5
        file: "https://eprint.iacr.org/2026/1188 (abstract + full text)"
        required_sections:
          - "Stated scope section"
          - "Fault model definition"
          - "Abstract (already available in KN-LIT entry)"
      - id: KN-LIT-340675
        file: "https://eprint.iacr.org/2026/1344 (abstract + full text)"
        required_sections:
          - "Attack model / Fault model section"
          - "Description of challenge sampling procedure fault"
          - "Abstract (already available in KN-LIT entry)"
    canonical_corrections:
      jendral_year: "2024 (DEC-20260805-0d59ff)"
      jendral_success_probability: "0.582 (DEC-20260805-0d59ff)"
    fips204_body_constraint: >-
      FIPS 204 standard body not read (DEC-20260805-0d59ff gate-1).
      Analysis scoped to academic sources listed above.

  # ─────────────────────────────────────────────────────────────
  # METHOD
  # ─────────────────────────────────────────────────────────────
  method:
    type: corpus_analysis
    no_implementation_required: true
    no_computation_required: true
    steps:
      - step: 1
        action: >-
          Read KN-LIT-3907 adversary model / security model section.
          Record VERBATIM the definition of the CMA signing oracle.
          Specifically: does the signing oracle allow arbitrary faults
          on the challenge-generation procedure c = H(w, μ) ∈ C?
          Possible outcomes:
            (A) Oracle is defined as fault-free (standard game); no fault
                injection on challenge generation is modeled.
            (B) Oracle explicitly permits fault injection on some steps;
                record which steps and whether challenge generation is
                among them.
            (C) Access blocked: record "full text inaccessible" and the
                attempted access path.
        records: "KN-LIT-3907 adversary model: oracle definition and fault scope"

      - step: 2
        action: >-
          Read KN-LIT-8ce0b5 fault model and stated scope section.
          Record VERBATIM or with exact paraphrase the stated scope boundary.
          KN-LIT entry abstract states: "twiddle-perturbation faults on the
          forward NTT." Confirm from full text whether this scope is stated
          explicitly and whether it excludes challenge-hash computation.
          Possible outcomes:
            (A) Scope is explicitly "NTT twiddle faults only" and no other
                fault classes are mentioned.
            (B) Scope is broader; challenge-hash faults are included.
            (C) Access blocked: record access status.
        records: "KN-LIT-8ce0b5 stated scope: exact fault class boundary"

      - step: 3
        action: >-
          Read KN-LIT-340675 attack model section.
          Identify the specific fault mechanism: what computation is faulted
          (the challenge-hash H(w,μ), the polynomial sampling from the output,
          or something else)? Does the fault produce c ∈ C (valid challenge)
          or c ∉ C (invalid, would fail verification check)?
          Record: fault target, fault effect, whether c ∈ C is required.
        records: "KN-LIT-340675 fault mechanism: target, effect, challenge validity"

      - step: 4
        action: >-
          PLACEMENT: Map the Shin DFA fault mechanism (from Step 3) to the
          adversary models of KN-LIT-3907 (from Step 1) and KN-LIT-8ce0b5
          (from Step 2). State explicitly whether the Shin fault class falls
          within each model's scope. Provide a one-paragraph justification
          citing the specific statements extracted in Steps 1–3.
        records: "Shin DFA placement relative to KN-LIT-3907 and KN-LIT-8ce0b5"

  # ─────────────────────────────────────────────────────────────
  # CONTROLS
  # ─────────────────────────────────────────────────────────────
  controls:
    - id: CTRL-1
      description: >-
        POSITIVE CONTROL: Apply the same placement analysis to NTT twiddle
        faults (the fault class that IS within KN-LIT-8ce0b5's scope).
        Expected result: NTT twiddle faults are within KN-LIT-8ce0b5's scope
        (trivially, as that is the paper's stated subject) and outside
        KN-LIT-3907's scope (mathematical adversary, no fault injection).
        If the method fails to produce this expected placement, the analysis
        methodology is flawed and the main result is invalid.
      controls_for: "Analysis method validity — ensures the placement test
        correctly identifies known-in-scope items"
      expected_placement:
        kn_lit_3907: "outside scope (no faults modeled)"
        kn_lit_8ce0b5: "inside scope (this is the paper's stated subject)"

    - id: CTRL-2
      description: >-
        COMPLETENESS NOTE: Record explicitly that the two formal proofs
        (KN-LIT-3907 and KN-LIT-8ce0b5) may not exhaust all formal proofs
        of ML-DSA fault security. The corpus covers indexed entries only;
        absence of a search result is not evidence that no other proof exists
        (AGENTS.md knowledge retrieval policy §bounds). Any coverage gap
        conclusion must include the statement: "This gap is scoped to the
        two corpus entries KN-LIT-3907 and KN-LIT-8ce0b5 and does not claim
        to survey all published formal proofs of ML-DSA fault security."
      controls_for: "Corpus-completeness caveat — prevents overstating the gap"

  # ─────────────────────────────────────────────────────────────
  # INDEPENDENT VARIABLES
  # ─────────────────────────────────────────────────────────────
  independent_variables:
    - name: proof_paper
      values: [KN-LIT-3907, KN-LIT-8ce0b5]
      description: "The formal proof paper being checked for adversary model scope"
    - name: fault_class
      values: [shin_dfa_challenge_sampling, ntt_twiddle_control]
      description: "The fault class being placed against the adversary model"

  # ─────────────────────────────────────────────────────────────
  # METRICS
  # ─────────────────────────────────────────────────────────────
  metrics:
    primary:
      - name: placement_verdict
        type: categorical
        values: [inside_scope, outside_scope, scope_unclear, access_blocked]
        per: [fault_class, proof_paper]
        description: >-
          For each (fault_class, proof_paper) pair, a categorical verdict
          on whether the fault class falls within the proof's adversary model.
    secondary:
      - name: verbatim_scope_statements
        type: text
        description: >-
          Verbatim or exact-paraphrase extracts from each paper establishing
          the adversary model scope, with page/section citation.
      - name: fault_mechanism_description
        type: text
        description: >-
          Verbatim or exact-paraphrase description of the Shin DFA fault
          mechanism from KN-LIT-340675, with page/section citation.

  # ─────────────────────────────────────────────────────────────
  # PREREGISTERED PREDICTION
  # ─────────────────────────────────────────────────────────────
  preregistered_prediction:
    quantity: "Placement verdict for Shin DFA vs KN-LIT-3907 and KN-LIT-8ce0b5"
    formula: >-
      Expected: Shin DFA challenge-sampling faults are OUTSIDE both adversary
      models (KN-LIT-3907 models no faults; KN-LIT-8ce0b5 models only NTT
      twiddle faults). CTRL-1 control places NTT twiddle faults inside
      KN-LIT-8ce0b5 and outside KN-LIT-3907.
    source: "IDEA-20260805-a8d531 mechanism and prediction, proposals.yaml"

  # ─────────────────────────────────────────────────────────────
  # SCALE RELEVANCE
  # ─────────────────────────────────────────────────────────────
  scale_relevance:
    tier: crypto
    justification: >-
      This is a corpus analysis task, not a computational experiment. The
      scope question (which fault classes are within a formal proof's adversary
      model) is a property of the proof's written statements, not of any
      parameter scale. The result is a proof-scope characterization that
      applies to all parameter sets covered by the proof.
    correspondence: null

  # ─────────────────────────────────────────────────────────────
  # REPLICATION
  # ─────────────────────────────────────────────────────────────
  replication:
    seeds: []
    independent_instances: 1
    replication_note: >-
      Text analysis does not require replication in the computation sense.
      The primary source documents are fixed and deterministic. If there is
      ambiguity in interpreting a scope statement, both readings must be
      recorded and the Coordinator must resolve the ambiguity before the
      evidence record is filed.

  # ─────────────────────────────────────────────────────────────
  # BUDGET AND STOPPING RULES
  # ─────────────────────────────────────────────────────────────
  budget:
    wall_clock_seconds_per_run: 14400   # 4 hours: reading + documentation
    total_cpu_hours: 0                  # no computation
    maximum_memory_gb: 0               # no computation
    maximum_runs: 1

  stopping_rules:
    - trigger: "Full text of KN-LIT-3907 is inaccessible (PDF blocked and
        ePrint 2023/916 inaccessible)"
      action: >-
        Record as "access_blocked" for KN-LIT-3907 adversary model step.
        Proceed with KN-LIT-8ce0b5 and KN-LIT-340675 analysis. Report
        partial result; the KN-LIT-3907 adversary model question is blocked
        pending access resolution.
    - trigger: "Scope statement in KN-LIT-8ce0b5 does not explicitly address
        challenge-hash faults (only discusses NTT)"
      action: >-
        Record as "outside_scope_by_omission" — a proof that discusses only
        NTT faults does not cover challenge-hash faults. Document the
        omission explicitly with the relevant passage.
    - trigger: "KN-LIT-340675 full text shows the fault targets something
        other than challenge-hash computation (e.g., output polynomial sampling)"
      action: >-
        Record the corrected fault mechanism description and revise the
        placement analysis accordingly. If the fault mechanism is not
        challenge-hash computation, the gap characterization in IDEA-a8d531
        must be revised. Record as a falsification of the gap's stated scope.

  invalidation_rules:
    - trigger: "CTRL-1 fails: NTT twiddle faults are not correctly placed as
        inside KN-LIT-8ce0b5's scope by the analysis method"
      action: "Invalidate run; analysis methodology is flawed. Report to
        Coordinator before filing result."
    - trigger: "Scope statements cannot be located in any accessed full text"
      action: "Record as access_blocked; do not fabricate scope statements."

  # ─────────────────────────────────────────────────────────────
  # SUCCESS AND FALSIFICATION CRITERIA
  # ─────────────────────────────────────────────────────────────
  success_criterion: >-
    SUCCESS: Both Steps 1 and 2 yield explicit scope statements; Step 3
    yields an explicit fault mechanism description; CTRL-1 passes; and
    Step 4 produces a named, cited placement verdict for the Shin DFA
    relative to both proof papers. The result is one of:
      (A) Gap confirmed: Shin DFA outside both models (expected result).
      (B) Gap partially closed: Shin DFA inside one model's scope.
      (C) Indeterminate: scope statement ambiguous; ambiguity documented.
    All three are valid outcomes. The experiment succeeds if a citable
    verdict is produced with explicit source text.

  falsification_criterion: >-
    FALSIFIED if:
    KN-LIT-3907's security model explicitly models fault injection on
    challenge generation as an adversary capability, OR KN-LIT-8ce0b5's
    stated scope explicitly includes challenge-hash faults. In either case,
    the proposal's coverage gap claim is falsified for that paper's scope.
    Record which paper falsifies the claim and cite the relevant section.

  # ─────────────────────────────────────────────────────────────
  # REQUIRED ARTIFACTS
  # ─────────────────────────────────────────────────────────────
  required_artifacts:
    - type: run_receipt
      path: "experiments/EXP-MLDSA-a8d531/run_receipt.yaml"
      required_fields: [access_status, analysis_steps_completed, timestamps]
    - type: placement_analysis
      path: "experiments/EXP-MLDSA-a8d531/placement_analysis.md"
      description: >-
        Structured document containing: verbatim scope extracts from each
        paper (with citations), fault mechanism description from KN-LIT-340675,
        CTRL-1 control result, and final placement verdicts for each
        (fault_class, proof_paper) pair.
    - type: access_log
      path: "experiments/EXP-MLDSA-a8d531/access_log.md"
      description: >-
        Record of which paper sections were accessed, how (local PDF or URL),
        and any access failures.

  # ─────────────────────────────────────────────────────────────
  # INFERENCE PROVENANCE
  # ─────────────────────────────────────────────────────────────
  inference_provenance:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: true
    model_verified: false
