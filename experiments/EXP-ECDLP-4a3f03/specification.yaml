# EXP-ECDLP-4a3f03
# Orbit factors and the anomalous trace. No detector.
# Approved by DEC-20261002-9358e3.
experiment:
  id: EXP-ECDLP-4a3f03
  hypothesis_id: H-ECDLP-91699d
  source_idea: IDEA-20260920-faca6f
  question_id: RQ-ECDLP-bc7a54
  version: 1
  title: Orbit factors and the anomalous trace
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-9358e3
  objective: >-
    Check the orbit factor, the sign factor, the anomalous trace, the
    embedding degree, and the named grid cardinalities.
  inputs:
    field7:
      p: 7
      B: 5
      order: 7
      trace: 1
      nonzero: 6
      beta_orbits: 2
      beta_factor: 3
      sign_pairs: 3
      sign_factor: 2
      factor_product: 6
      difference: 4
      denominator_mod: 3
      embed_residue: 6
    field13:
      p: 13
      B: 6
      order: 7
      trace: 7
      beta_factor: 3
      sign_factor: 2
      embed_degree: 2
      p_mod_order: 6
      square_mod_order: 1
      gcd_order_pm1: 1
      denominator_mod: 10
    alpha_numerators: [11, 3, 67, 3, 9]
    alpha_denominators: [20, 5, 100, 4, 10]
    third_gap_num: 1
    third_gap_den: 300
    depth_values: [1, 2, 4, 8, 16]
    alpha_count: 5
    depth_count: 5
    grid_cells: 25
    depth_product: 1024
  controls:
    - >-
      The orbit factor is 3. The difference of the nonzero count and
      the orbit count is 4. Reporting the orbit factor as 4
      invalidates the run.
    - >-
      The sign factor is 2. Reporting the orbit factor as 2
      invalidates the run.
    - >-
      The trace on the field of 7 elements is 1. Reporting 0
      invalidates the run.
    - >-
      The embedding degree on the field of 13 elements is 2.
      Reporting 1 invalidates the run.
    - >-
      The third alpha is 67/100, which exceeds 2/3 by 1/300.
      Reporting that entry as 2/3 invalidates the run.
    - >-
      The grid has 25 cells. Reporting 10, the sum of the two
      counts, invalidates the run.
    - Two counting routes. They must not import each other.
  independent_variables:
    - curve in {field7, field13}
    - route in {multiplication, partition}
  metrics:
    primary:
      - beta_factor
      - trace7
      - embed_degree13
      - implementations_agree
    secondary:
      - sign_factor
      - grid_cells
      - third_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The factor 3, the trace 1, and the embedding degree 2.
    formula: >-
      Nonzero points divided by the number of order-3 orbits is the
      orbit factor. Nonzero points divided by the number of negation
      pairs is the sign factor. Trace is p plus 1 minus the point
      count. The embedding degree is the least positive k with p to
      the k congruent to 1 modulo the group order. The third alpha
      gap is the cross-product difference 201 minus 200 over 300.
      Grid cells are the product of the two counts.
    source: >-
      IDEA-20260920-faca6f states the exact integer factors, read
      2026-10-02. The counts were computed in this design session.
      That computation is not a run. No detector was executed.
  scale_relevance:
    tier: toy
    justification: Two fields, of 7 and 13 elements. No transfer to a detector.
    correspondence: null
  tail_checks:
    - The field of 13 elements is required. Stopping after the field of 7 elements and still reporting embedding degree 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other counting route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the orbit factor is reported as 4 or as 2, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The orbit factor is reported as 4 or as 2.
    - The trace on the field of 7 elements is reported as 0.
    - The embedding degree on the field of 13 elements is reported as 1.
    - The third alpha is reported as 2/3.
    - The grid cell count is reported as 10.
    - A detector, a p-adic logarithm, or a pairing is reported.
  success_criterion: >-
    Both runs agree that the orbit factor is 3, the sign factor is 2,
    their product is 6, the trace on the field of 7 elements is 1,
    the embedding degree on the field of 13 elements is 2, the third
    alpha gap is 1/300, and the grid has 25 cells.
  falsification_criterion: >-
    The runs agree, the trace on the field of 7 elements stays 1, and
    any factor differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ECDLP-4a3f03/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-4a3f03/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-4a3f03/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-4a3f03/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-4a3f03/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-4a3f03/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any detector run, p-adic logarithm, or pairing transfer.
    - Any claim that the lane is empty or that a detector is blind.
    - A synthetic plant and any separation from a null.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
