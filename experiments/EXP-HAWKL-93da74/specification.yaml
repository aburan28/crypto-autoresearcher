experiment:
  id: EXP-HAWKL-93da74
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-ebedd8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-ebedd8
  question_id: RQ-HAWK-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Symbolically separate the mixing hypothesis from the recorded easy-instance-density measurement,
    then measure binned total variation between the conjugation orbit and direct sampling at ring
    degrees 4 and 8 against a matched direct-sampling null.
  objective: 'The one uncertainty a run reduces is whether the already-recorded vanishing of the easy-instance
    density can serve as an input to any argument other than the attack argument it was recorded against.
    Concretely: (i) whether the implication between ''the conjugation-induced distribution avoids
    the easy stratum'' and ''the conjugation-induced distribution is close to a canonical distribution
    on the class'' runs one way or both - decided symbolically at zero compute, and if it runs both
    ways the rest of the run is unnecessary and that is the finding; (ii) if it runs one way only,
    how large the gap is at the smallest scales this program can compute, measured as binned total
    variation between the enumerated conjugation orbit of a fixed Gram matrix and an equal-size direct
    sample from a declared sampler, at ring degrees 4 and 8, as a function of generating-word length;
    (iii) whether that measured distance is distinguishable from the estimator''s own floor, established
    in the same invocation by binning two independent direct samples against each other, which is
    the only thing that makes any number in (ii) interpretable. A run does not implement the subfield
    solve, does not form any nrd-PIP instance, does not attempt to bound the density, and reopens
    no question KN-OPEN-028 closed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for a declared HAWK-shaped
      Gram matrix at ring degree 4 or 8, under one declared substitute re-randomisation sampler and
      one or two declared conjugation-equivariant integer invariants, the binned total variation between
      the conjugation orbit and direct sampling is such-and-such with a bootstrap interval, at word
      lengths up to L, against an estimator floor measured in the same run. What does NOT follow:
      no random self-reduction for module-LIP is established or supported beyond a necessary condition;
      nothing about the true sampler used by the route; nothing about ring degrees beyond those tested
      and nothing about HAWK''s parameters; nothing about the density itself, whose direction is settled
      by EV-HAWK-c99848 and is not re-measured; and no statement about HAWK''s security in either
      direction.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of reasoning, zero compute). Write the obstruction block for
      the density in the templates/research-records.md form, then write the two readings formally
      and settle the implication direction. If it runs both ways, halt and report - that is a complete
      result. STAGE 1 (cost: hours). Declare the substitute re-randomisation sampler, the generating
      set of short unimodular matrices, the word-length ladder 1 through 6, and the conjugation-equivariant
      invariant, all frozen in the specification before any run. STAGE 2 (cost: minutes at degree
      4). Build the HAWK-shaped base Gram matrix by the declared deterministic rule inherited from
      the EXP-HAWK-a2f34a lineage; enumerate the orbit to the word-length cap with deduplication by
      invariant plus canonical form. STAGE 3 (cost: minutes to an hour at degree 8). Repeat at degree
      8 under the same budget cap, recording the budget consumed and whether the orbit was truncated.
      STAGE 4 (cost: minutes). Direct-sampling arm in the same invocation: draw equal-size samples
      from the declared class sampler and bin identically. STAGE 5 (cost: minutes). Null arm in the
      same invocation: two independent direct samples binned against each other for the estimator
      floor, plus bootstrap intervals on every total variation. STAGE 6 (cost: minutes). Second base
      point and coarser-invariant replicates. STAGE 7 (cost: minutes). Emit through harness/runner.py
      with seeds, budgets, orbit sizes and all metrics.'
    instrument: Python 3 with exact integer and rational arithmetic (fractions.Fraction, integer matrices
      as tuples of tuples); sympy only for cyclotomic polynomial reduction; numpy for the binning
      and bootstrap arithmetic only, never for the algebra. No lattice reduction library is required
      and none is assumed; no computer-algebra system and specifically no Sage. Base-matrix construction
      follows the declared HAWK-shaped deterministic rule already used in the EXP-HAWK-a2f34a instrument
      lineage rather than any HAWK key-generation procedure, since the Round-3 specification is unread
      by this program. Runs, seeds and manifests through harness/runner.py.
    parameters: 'Ring degrees n in {4, 8} (cyclotomic conductors 8 and 16). One base Gram matrix per
      degree for the primary arm plus one alternate base point per degree for the control. Generating
      set: a declared fixed set of at most 8 short unimodular matrices. Word lengths 1 through 6.
      Orbit enumeration budget: 200000 elements per degree, hard cap. Direct-sampler draws matched
      to the enumerated orbit size, minimum 20000. Bootstrap resamples: 2000. Two invariants, fine
      and coarse. All seeds declared in the specification.'
  controls:
  - 'Null arm: two independent direct samples binned against each other in the same invocation, establishing
    the estimator''s floor at the sample size used.'
  - 'Second base point control: repeat the orbit enumeration from a different G on the same class;
    if orbit total variation differs materially between base points, the quantity is base-point dependent
    and must be reported per base point.'
  - 'Invariant sensitivity control: run the identical pipeline with a second, coarser conjugation-equivariant
    invariant and report both; a conclusion that flips with bin granularity is reported as granularity-dependent.'
  - 'Word-length control: report total variation as a function of generating-word length 1 through
    L, so that any mixing claim is a claim about a curve rather than about one point.'
  - Equivariance unit test on the chosen invariant over random conjugates, run before any measurement.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a random instance of the same shape: instead of
    the conjugation orbit of a fixed G, draw the same number of instances directly and independently
    from a declared sampler on the class (matching determinant and rank, ignoring orbit structure),
    and run the identical binning and total-variation computation in the same invocation. For the
    signal arm to mean anything, the null must show near-zero total variation from the direct sampler
    by construction, establishing the estimator''s floor at the given sample size, and the orbit arm''s
    total variation must exceed that floor by more than the bootstrap confidence interval. If the
    orbit arm''s total variation is indistinguishable from the floor, the orbit is empirically as
    spread as direct sampling at this scale, which is recorded as a controlled null that strengthens
    rather than weakens the resource reading and must be reported as such rather than as a finding
    about the attack.'
  independent_variables:
  - ring degree n in {4, 8}
  - generating word length 1 through 6
  - invariant granularity (fine versus coarse)
  - base point (primary versus alternate Gram matrix)
  metrics:
    primary:
    - binned total variation between orbit-induced and direct-sampler distributions
    - estimator floor from the two-independent-direct-sample null
    - bootstrap 95 percent interval on each total variation
    - bin coverage fraction of the orbit relative to direct sampling at matched sample size
    secondary:
    - orbit size enumerated and whether the budget cap bound
    - total variation as a function of word length, reported as the full curve
    - number of invariant bins occupied
    - wall-clock and memory consumed per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'TV_orbit at ring degree 8, word length 6, fine invariant: the binned total variation
      between the enumerated conjugation orbit''s invariant distribution and the direct sampler''s.'
    formula: 'TV_orbit = 0.5 times the sum over bins b of |p_orbit(b) - p_direct(b)|, with bins defined
      by the frozen fine invariant and probabilities estimated by empirical frequency at matched sample
      sizes. Predicted: TV_orbit exceeds TV_null plus 3 times SE_bootstrap, where TV_null is the same
      statistic computed between two independent direct samples of the same size in the same invocation
      and SE_bootstrap is its bootstrap standard error. Failure of this inequality is a controlled
      null and is reported as such rather than as an absence of result.'
    source: Pre-registered in the parent proposal IDEA-20260816-ebedd8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at ring degrees 4 and 8, cyclotomic conductors 8 and 16, far below any
      deployed parameter and chosen because exact integer orbit enumeration is possible there and
      nowhere higher within budget. The transfer assumption, that mixing behaviour at these degrees
      says anything about larger ones, is NOT made: the deliverable is the measured curve plus the
      crossover degree at which bin count exceeds enumerable orbit size, and any extrapolation is
      explicitly refused. The substitute sampler is a second scope limit stated separately, since
      the route''s own sampler is not held in this corpus.'
    correspondence: null
  tail_checks:
  - Check the smallest word length, where the orbit is tiny and total variation is near its maximum
    by construction; the curve must start high and the run must not report that as a finding.
  - 'Check the budget-bound case at ring degree 8: if the cap binds, report bin coverage as a lower
    bound and refuse the mixing conclusion in either direction.'
  - 'Check a deliberately confined generating set (a single generator and its powers) as a positive
    control: orbit total variation must be large, confirming the estimator can detect confinement.'
  - Check bins with fewer than five expected counts and report the fraction of total-variation mass
    they carry.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt at STAGE 0 and report if the implication is shown to run both ways; no compute is spent in
    that case.
  - Halt if the chosen invariant fails the equivariance unit test on random conjugates.
  - Halt at ring degree 8 if the enumeration budget binds before word length 3, reporting the orbit
    as unenumerable at this scale rather than reporting a truncated total variation as a measurement.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits the settled implication direction from STAGE 0 and, for each ring
    degree, word length, invariant granularity and base point, a binned total variation with a bootstrap
    interval reported against the estimator floor measured in the same invocation, with the confined-generating-set
    positive control firing as expected.
  falsification_criterion:
  - STAGE 0 shows the implication runs both ways, collapsing the entry into the existing closure.
  - Orbit total variation is within the estimator floor plus 3 bootstrap standard errors at every
    word length and both degrees (controlled null).
  - The confined-generating-set positive control fails to register large total variation, invalidating
    the estimator.
  - The invariant fails the conjugation-equivariance unit test.
  - Bin coverage at ring degree 4 falls below 0.2, making the mixing reading unavailable at any reachable
    scale.
  - 'No theory is identified that takes the obstruction as a hypothesis, recorded as ''examined: true,
    no taker''.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-ebedd8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The route's actual re-randomisation sampler is not held in this corpus; a Coordinator must approve
    the substitute and decide whether the substitution is acceptable at all or whether the contract
    waits on source acquisition.
  - The conjugation-equivariant invariant is not specified here beyond its required property; the
    Coordinator must approve a concrete invariant and its bin count before freezing, since bin granularity
    drives every total-variation number.
  - Whether 'close to a canonical distribution' should be measured against the uniform distribution
    on the class or against some other canonical measure is not settled here, and it changes what
    the null arm should be.
