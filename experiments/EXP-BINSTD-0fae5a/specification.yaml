# contract for H-BINSTD-307b43: subfield-rational FB STRUCTURALLY EMPTY
# certificates on five c2pnb rows + deployed phi-stable F_{2^16} census +
# toy F_sub zero/positive controls.
#
# Source: IDEA-20260922-6cf862 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Unlocks reachability-table cells and is the prerequisite for
# IDEA-20260922-1b16d7 / IDEA-20260922-261004.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261002-bfd48e. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO exponent. NO deployed attack.
# =============================================================================
experiment:
  id: EXP-BINSTD-0fae5a
  hypothesis_id: H-BINSTD-307b43
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6cf862
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Subfield-rational FB emptiness certificates on five c2pnb rows +
    F_{2^16} phi-stable subspace census + toy F_sub zero/positive controls
  status: approved
  approved_by: DEC-20261002-ad9ec8
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-ad9ec8
    composing_decision: DEC-20261002-ad9ec8
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0: freeze certificate schema + preregistered (C) tables +
      factorization API + mutant/null audits BEFORE filing any
      STRUCTURALLY EMPTY cell. Stage 1: Part 1 certificates on five c2pnb
      rows (Weil h-check, gcd(h,r)=1, T^k−1 factorization, dim-sets).
      Stage 2: toy F_sub zero-in-G / positive-in-cofactor controls + Booth
      O(k) timing. No Stage 3. No deployed attack. No AUXIN provisioning.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Independently recompute and freeze certificates that the F_q-rational
    factor base is STRUCTURALLY EMPTY in G on each of the five composite-
    degree ANSI c2pnb curves (emptying fact h=#E(F_q) ∧ gcd(h,r)=1), verify
    the preregistered F_{2^16} phi-stable subspace census (C), and confirm
    on toy subfield cells that F_sub yields zero relations in G and
    strictly positive relations on the cofactor arm — thereby filling the
    RQ-BINSTD reachability-table column and unlocking graded successors,
    or name a concrete falsifying certificate / instrument defect.

  class: representation
  class_note: >-
    Primary class is representation / certificate (Part 1) with a toy
    observational control arm (Part 2 / Stage 2). Carries
    HEUR-BINSTD-6cf862-H0 (unconditional arithmetic; recorded as absence)
    and HEUR-BINSTD-6cf862-H1 (toy instrument control). Not an
    exponent-moving or cost-model-measurement experiment.

  scope:
    included:
      - >-
        Stage 0. Freeze certificate JSON schema; freeze preregistered
        factor_counts=[3,5,17,3,3], subspace_counts=[8,32,131072,8,8],
        and dim-sets per k from IDEA-20260922-6cf862 claim (C); implement
        independent T^k−1 factorizer over F_{2^16} and Weil h-check
        harness under implementation/; run hard-coded-table mutant and
        F_2-vs-F_{2^16} null audits. ZERO STRUCTURALLY EMPTY cells filed
        as success in Stage 0.
      - >-
        Stage 1. For each k∈{11,13,17,19,23} / named c2pnb row: recompute
        Weil #E(F_q) from published cofactor, check equals h, check
        gcd(h,r)=1, independently factor T^k−1 over F_{2^16}, derive
        stable dim-set and subspace count, compare to preregistered (C);
        emit certificate file + five reachability-table cell records
        reading STRUCTURALLY EMPTY with emptying fact.
      - >-
        Stage 2. On ≥2 admitted toy subfield cells with dk≤41: attempt
        F_sub decompositions against targets in G (expect 0 verified) and
        against cofactor-subgroup targets (expect >0); measure Booth
        orbit-canonicalisation word-comparison counts (expect ≤3k).
    excluded:
      - Deployed relation search / index-calculus attack at m≥131.
      - Magma/Sage/cypari2 provisioning as the success path (AUXIN forbidden).
      - Semaev PDP engine races; block-Wiedemann races; rho break claims.
      - Editing IDEA claim text; editing shared GOAL-ECDLP2M-001.yaml.
      - Amazon Bedrock.
      - Any exponent or break claim.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-6cf862.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-307b43.yaml
    curve_audit_readme: analysis/binstd-curve-audit/README.md
    curve_audit_certify: analysis/binstd-curve-audit/subfield_certify.py
    curve_audit_params: analysis/binstd-curve-audit/binary-curve-params.txt
    curve_audit_certificate: analysis/binstd-curve-audit/audit-certificate.txt
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    optional_code_refs:
      - experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
    cells:
      deployed_arm:
        curves:
          - {name: c2pnb176v1, k: 11, m: 176}
          - {name: c2pnb208w1, k: 13, m: 208}
          - {name: c2pnb272w1, k: 17, m: 272}
          - {name: c2pnb304w1, k: 19, m: 304}
          - {name: c2pnb368w1, k: 23, m: 368}
        q: 65536
        preregistered_factor_counts: [3, 5, 17, 3, 3]
        preregistered_subspace_counts: [8, 32, 131072, 8, 8]
        preregistered_dim_sets:
          11: [0, 1, 5, 6, 10, 11]
          13: [0, 1, 3, 4, 6, 7, 9, 10, 12, 13]
          17: 'every j in {0..17}'
          19: [0, 1, 9, 10, 18, 19]
          23: [0, 1, 11, 12, 22, 23]
      toy_arm:
        dk_max: 41
        min_cells: 2
        require_subfield_over_Fq: true
      null_object: 'matched prime-degree field (no intermediate F_2^16)'
      mutant: 'hard-coded factor table without running factorizer'
    seeds:
      master: 20261002
      stage2_targets: [20261002, 20261003]
      booth_timing: 20261004

  controls:
    - name: ctl_preregistered_C_freeze
      stage: 0
      blocking: true
      object: >-
        Preregistered factor_counts, subspace_counts, and dim-sets frozen
        in stage0/preregistered-C.json BEFORE any Stage-1 factorization
        output is written; never edited afterward.
    - name: ctl_hardcoded_mutant
      stage: 0
      blocking: true
      object: >-
        Hard-coded factor-table mutant must FAIL the Stage-0 audit (detected
        as playback without factorization work product).
    - name: ctl_F2_vs_F2_16_null
      stage: 0
      blocking: true
      object: >-
        Running the F_2-base lattice of IDEA-20260918-9abf42 must NOT be
        accepted as the F_{2^16} census; dim-sets must differ where
        ord_k(2)≠ord_k(2^16).
    - name: ctl_weil_hasse
      stage: 1
      blocking: true
      object: >-
        Implied t = q+1−h satisfies |t|≤2√q; Weil recursion reproduces
        published #E(F_{q^k}) = h·r (or cofactor×order from audit params).
    - name: ctl_gcd_hr
      stage: 1
      blocking: true
      object: 'gcd(h,r)=1 on all five rows (Lagrange emptiness half).'
    - name: ctl_cofactor_positive
      stage: 2
      blocking: true
      object: >-
        F_sub against cofactor-subgroup targets yields STRICTLY POSITIVE
        verified relations on every Stage-2 toy cell; zero here is
        O-INSTRUMENT and blocks reading emptiness.
    - name: ctl_prime_degree_null
      stage: 2
      blocking: true
      object: >-
        Matched prime-degree null admits no intermediate F_{2^16}-rational
        base of this form (empty GHS/subfield class for this construction).
    - name: ctl_stdlib_preferred
      blocking: true
      object: >-
        Prefer stdlib / existing audit arithmetic. Magma/Sage/cypari2 may
        not be provisioned mid-tick (AUXIN forbidden). If a dependency is
        missing, status failed_infrastructure / O-IMPEDIMENT — not math
        falsification.

  independent_variables:
    - curve_name
    - k
    - stage  # 0 | 1 | 2
    - target_arm  # G | cofactor | null_prime_degree
    - seed

  metrics:
    primary:
      - structurally_empty_cell_count
      - weil_h_match_rate
      - gcd_hr_one_rate
      - factorization_factor_count_match_rate
      - stable_subspace_count_match_rate
      - dim_set_match_rate
      - toy_fsub_relations_in_G
      - toy_fsub_relations_in_cofactor
      - booth_max_word_comparisons_over_k
      - stage0_mutant_caught
    secondary:
      - peak_rss_bytes
      - wall_s
      - factorization_cpu_s
      - provenance_source  # openssl_secondary | ansi_x962_primary
      - termination_reason

  heuristic_under_test: HEUR-BINSTD-6cf862-H1

  preregistered_prediction:
    quantity: >-
      structurally_empty_cell_count=5; factor_counts=(3,5,17,3,3);
      subspace_counts=(8,32,131072,8,8); dim-sets as frozen in
      stage0/preregistered-C.json; toy_fsub_relations_in_G=0;
      toy_fsub_relations_in_cofactor>0; booth_max_word_comparisons ≤3k.
    formula: >-
      (A) #E(F_q)=q+1−t = h and gcd(h,r)=1 ⇒ G∩E(F_q)={O}.
      (C) d=ord_k(2^16); f=1+(k−1)/d; #stable=2^f; dims={0,1}+d·{0..f−2}
      (with k=17 → d=1 → every dimension 0..17).
    source: >-
      IDEA-20260922-6cf862 claims (A) and (C); HEUR-BINSTD-6cf862-H0/H1;
      analysis/binstd-curve-audit Weil substrate.
    claim_tier: certificate_plus_toy_observational
    measured_vs_modeled: >-
      Weil checks, factorizations, gcd, relation counts, and Booth word
      comparisons are MEASURED. The (C) table is a PREREGISTERED prediction
      written before Stage-1 factorization outputs; never tuned afterward.

  scale_relevance:
    tier: crypto
    justification: >-
      Part 1 certificates are at the five deployed ANSI composite-degree
      rows (certificate arithmetic, not an attack). Stage 2 controls are
      toy (dk≤41) and do not transfer attack cost to deployed m.
    correspondence: null

  tail_checks:
    - >-
      Extreme: c2pnb272w1 (k=17) must report every dimension 0..17 and
      subspace_count=131072; any missing dimension is O-REFUTE-C.
    - >-
      Extreme toy: if any verified F_sub hit in G appears, export
      counterexample_certificate and label O-REFUTE-A.
    - >-
      Booth: report max word comparisons / k; if >3, void quotient pricing
      (still not a break claim).

  optimistic_assumptions:
    - assumption: >-
        Pure-Python factorization of T^k−1 over F_{2^16} for k≤23 finishes
        in seconds within the advisory budget.
      bias_direction: >-
        May understate wall time; budget abort → O-IMPEDIMENT with measured
        CPU, never math falsification of (C).
    - assumption: >-
        OpenSSL secondary parameters agree with ANSI X9.62 on h,r for these
        five rows.
      bias_direction: >-
        Primary mismatch → O-PROVENANCE halt; not treated as (A) falsification
        until provenance is adjudicated.

  memory_accounting: >-
    Peak RSS measured. Dominant structures: F_{2^16} polynomial arithmetic
    tables and, at k=17, enumeration/counting of 2^17 stable subspaces
    (count may be combinatorial without allocating 131072 objects — if
    allocated, reconcile against analytic size in the run summary).

  hidden_overhead_honesty: >-
    Combinatorial subspace counting at k=17 is O(2^{17}) if naively
    enumerated; the contract permits closed-form 2^f counting with
    factor-degree verification and does not hide that choice. No attack
    exponent is claimed.

  replication:
    seeds: [20261002, 20261003, 20261004]
    independent_instances: 2
    independent_instances_note: >-
      Stage 1 factorization must be reproducible from the frozen harness
      (two independent process invocations). Stage 2 dual seeds on toy
      targets. Primary metrics must agree across complete_valid seeds.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 16
    maximum_workers: 1

  stopping_rules:
    - >-
      SR-1. Stage-0 preregistered-C freeze missing → stop; status invalid.
    - >-
      SR-2. Hard-coded mutant not caught → stop; status O-INSTRUMENT.
    - >-
      SR-3. Weil/Hasse or gcd(h,r) fails on any row → stop that row; if any
      row fails gcd while Weil matches, treat as O-REFUTE-A candidate and
      export certificate material; do not file STRUCTURALLY EMPTY for that row.
    - >-
      SR-4. Factorization disagrees with preregistered counts → O-REFUTE-C;
      do not retune the frozen table.
    - >-
      SR-5. Stage-2 cofactor arm yields zero → O-INSTRUMENT; do not read
      emptiness from that cell.
    - >-
      SR-6. Advisory budget exhausted → preserve partial artifacts;
      O-IMPEDIMENT with measured quantity; never negative math evidence.
    - >-
      SR-7. Verified F_sub hit in G → export counterexample; O-REFUTE-A.

  invalidation_rules:
    - Editing preregistered-C.json after Stage-0 freeze.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Filing STRUCTURALLY EMPTY without Weil+gcd certificates.
    - Claiming break / exponent / deployed attack in run artifacts.
    - Overwriting a prior RUN-* directory.
    - Editing shared GOAL-ECDLP2M-001.yaml or IDEA claim text.
    - Using Amazon Bedrock.
    - Tuning (C) predictions after seeing Stage-1 outputs.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze + mutant caught + F_2 null rejected;
    (2) structurally_empty_cell_count=5 with Weil h-match and gcd(h,r)=1
    on every row; (3) factorization_factor_count_match_rate=1.0 and
    stable_subspace_count_match_rate=1.0 and dim_set_match_rate=1.0;
    (4) Stage-2 toy_fsub_relations_in_G=0 and toy_fsub_relations_in_cofactor>0
    on ≥2 cells; (5) booth_max_word_comparisons ≤3k; (6) no invalidation_rule
    fired. Outcome label O-CERT-EMPTY-5. This fills the reachability-table
    column and unlocks successor designs; it does NOT claim an ECDLP break.

  falsification_criterion: >-
    ANY of: (F1) verified F_sub decomposition in G (O-REFUTE-A);
    (F2) factorization/dim-set disagree with frozen (C) (O-REFUTE-C);
    (F3) cofactor positive control yields zero while emptiness was still
    read (O-INSTRUMENT); (F4) Magma/Sage provisioned as the sole path to
    reported certificates. Budget exhaustion and provenance_disagree are
    NOT falsification of (A)/(C).

  required_artifacts:
    - experiments/EXP-BINSTD-0fae5a/implementation/
    - experiments/EXP-BINSTD-0fae5a/stage0/preregistered-C.json
    - experiments/EXP-BINSTD-0fae5a/stage0/mutant-audit.json
    - experiments/EXP-BINSTD-0fae5a/stage0/api-freeze.md
    - experiments/EXP-BINSTD-0fae5a/stage1/certificates/
    - experiments/EXP-BINSTD-0fae5a/stage1/reachability-cells.json
    - experiments/EXP-BINSTD-0fae5a/stage1/factorization-report.json
    - experiments/EXP-BINSTD-0fae5a/stage2/toy-fsub-report.json
    - experiments/EXP-BINSTD-0fae5a/stage2/booth-timing.json
    - experiments/EXP-BINSTD-0fae5a/runs/
    - experiments/EXP-BINSTD-0fae5a/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write stage0/preregistered-C.json and stage0/api-freeze.md; define
          certificate schema; ZERO success cells filed.
      - id: S0-MUTANT
        text: Run hard-coded mutant + F_2-vs-F_{2^16} null; write mutant-audit.json.
      - id: S1-WEIL
        text: >-
          For each of five curves, Weil h-check + Hasse + published order
          reproduction; record provenance_source.
      - id: S1-GCD
        text: gcd(h,r)=1 on all five; halt row on failure.
      - id: S1-FACTOR
        text: >-
          Independent T^k−1 factorization over F_{2^16}; compare to frozen
          factor_counts; derive dim-sets and subspace counts.
      - id: S1-CELLS
        text: >-
          Emit five STRUCTURALLY EMPTY reachability-table cells with emptying
          facts; write certificates/ and reachability-cells.json.
      - id: S2-TOY
        text: >-
          ≥2 toy subfield cells: F_sub vs G (expect 0) and vs cofactor
          (expect >0); dual seeds.
      - id: S2-BOOTH
        text: Measure Booth word comparisons; write booth-timing.json.
      - id: S2-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; observations only;
          no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-bfd48e
  snapshot_task: TASK-20261002-8f08bf

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
