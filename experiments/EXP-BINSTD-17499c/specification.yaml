# EXP-BINSTD-17499c
# Ratio-band arithmetic. No solver timing.
# Approved by DEC-20261003-95ab6f.
experiment:
  id: EXP-BINSTD-17499c
  hypothesis_id: H-BINSTD-d33ff8
  source_idea: IDEA-20261001-3f2d06
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Ratio excess and batch gaps
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-95ab6f
  objective: >-
    Check the excess 5, the product 250, and the cell count 6.
  inputs:
    n_count: 3
    ell_count: 2
    cell_count: 6
    batch: 30
    ratio_num: 4
    ratio_den: 5
    finish_num: 7
    finish_den: 10
    ratio_excess: 5
    count_24_gap: 0
    count_23_short: 5
    count_21_gap: 0
    count_20_short: 10
    gap_product: 250
    slots: 180
    tenth_excess: 10
  controls:
    - >-
      Four times 10 is 40. Seven times 5 is 35. Their difference is
      5. Reporting 4 over 5 as equal to 7 over 10 invalidates the
      run.
    - >-
      Twenty-four times 5 equals 4 times 30, so that gap is 0. Four
      times 30 minus 23 times 5 is 5. Twenty-one times 10 equals 7
      times 30. Seven times 30 minus 20 times 10 is 10. The product
      of 5, 5, and 10 is 250.
    - >-
      Three times two is 6. Six times 30 is 180. One times 20 minus
      one times 10 is 10.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {ratio, batch, cells}
    - route in {cross_excess, batch_count}
  metrics:
    primary:
      - ratio_excess
      - gap_product
      - implementations_agree
    secondary:
      - count_23_short
      - cell_count
      - slots
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The excess of 4 over 5 against 7 over 10 is 5. The product of
      the gaps 5, 5, and 10 is 250. The cell count is 6.
    formula: >-
      Subtract 7 times 5 from 4 times 10. Multiply that excess by
      the 23-shortfall and by the 20-shortfall. Separately multiply
      three by two.
    source: >-
      IDEA-20261001-3f2d06 states the cap 0.8, the floor 0.7, and
      the batch 30, read 2026-10-03. The gaps were recomputed in
      this design session. That computation is not a run. No solver
      was timed.
  scale_relevance:
    tier: toy
    justification: One written cap and one written batch size. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The 23-shortfall 5 and the cell count 6 are required. A check that stops at the excess 5 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 5 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The ratio excess is not 5.
    - The product is not 250.
    - The cell count is not 6.
    - A solver is timed, or 23 over 30 is reported as meeting 4 over 5.
  success_criterion: >-
    Both runs agree that 4 times 10 minus 7 times 5 is 5, that 23
    over 30 falls short of 4 over 5 by 5, that 20 over 30 falls short
    of 7 over 10 by 10, that the product of those gaps is 250, and
    that three times two is 6.
  falsification_criterion: >-
    The runs agree that 4 times 10 is 40, and 40 minus 35 is not 5.
  required_artifacts:
    - experiments/EXP-BINSTD-17499c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-17499c/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-17499c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-17499c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-17499c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-17499c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver timing, Crossbred run, or XOR-SAT run.
    - Any claim that one engine is faster.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
