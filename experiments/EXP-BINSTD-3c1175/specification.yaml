# EXP-BINSTD-3c1175
# Abscissa-threshold arithmetic. No subspace sample.
# Approved by DEC-20261002-26f9a6.
experiment:
  id: EXP-BINSTD-3c1175
  hypothesis_id: H-BINSTD-fd9d0e
  source_idea: IDEA-20260926-cafcf1
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Abscissa-threshold arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-26f9a6
  objective: >-
    Check the vacuity cutoffs at 131 and 17, the two ceilings, and the
    four-element point count.
  inputs:
    n: 131
    inside: 66
    outside: 67
    twice_inside_minus: 130
    twice_outside_minus: 132
    ceil_4: 33
    ceil_3: 44
    gap_4: 33
    gap_3: 22
    toy_n: 17
    toy_inside: 9
    toy_outside: 10
    toy_twice_inside: 16
    toy_twice_outside: 18
    field_points: 8
    zero_solutions: 1
    nonzero_each: 2
    nonzero_abscissae: 3
    yield_bits: 4
    yield_factor: 16
    written_gap: 60
    gap_remainder: 56
  controls:
    - >-
      Twice 65 is 130 and twice 66 is 132. Reporting l = 67 as inside
      invalidates the run.
    - >-
      The ceilings are 33 and 44. Reporting the four-way ceiling as 32
      invalidates the run.
    - >-
      The four-element curve has 8 points. Reporting 4 points
      invalidates the run.
    - >-
      The power 2^4 is 16, and 60 minus 4 is 56. Reporting 16 as at
      least 2^{60} invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {cutoff, points}
    - route in {doubling, enumeration}
  metrics:
    primary:
      - cutoff
      - field_points
      - implementations_agree
    secondary:
      - ceilings
      - toy_cutoff
      - gap_remainder
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Dimension 66 is inside and the four-element count is 8.
    formula: >-
      Compare 2(l-1) with n. The ceiling of 131/4 is 33 and the
      ceiling of 131/3 is 44. On the field of 4 elements, solve
      y^2 + xy = x^3 + 1 at each x and add the point at infinity.
    source: >-
      IDEA-20260926-cafcf1 states the threshold and the four-element
      check, read 2026-10-02. The products and the points were
      computed in this design session. That computation is not a run.
      No subspace was sampled.
  scale_relevance:
    tier: toy
    justification: Two integer cutoffs and one field of 4 elements. No transfer to a density.
    correspondence: null
  tail_checks:
    - The degree-17 pair l = 9 inside and l = 10 outside is required. A check that stops at n = 131 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the four-element count is not 8, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Dimension 67 is reported as inside.
    - The four-way ceiling is reported as 32.
    - The four-element count is not 8.
    - The factor 16 is reported as at least 2^{60}.
    - A subspace is sampled or a Kloosterman sum is evaluated.
  success_criterion: >-
    Both runs agree that l = 66 is inside and l = 67 is outside at
    n = 131, that the ceilings are 33 and 44, that l = 9 is inside
    and l = 10 is outside at n = 17, and that the four-element curve
    has 8 points.
  falsification_criterion: >-
    The runs agree, 130 stays at most 131, and the four-element curve
    does not have 8 points.
  required_artifacts:
    - experiments/EXP-BINSTD-3c1175/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-3c1175/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-3c1175/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-3c1175/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-3c1175/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-3c1175/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any subspace sample, density estimate, or Kloosterman evaluation.
    - Any claim that a constructible subspace beats one half.
    - Any measured attack cost.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
