experiment:
  id: EXP-MODEL-7ae4db
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-e6d79e
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: MONTGOMERY IS AN AFFINE RESKIN OF WEIERSTRASS AND THEREFORE STRICTLY DENSER - x_W = (x_M
    + A/3)/B is affine linear, so S_3^Montgomery equals S_3^Weierstrass composed with one affine substitution
    per variable, giving per-variable degree EXACTLY 2 with monomial support rising from 13 of 27
    to 27 of 27, plus a palindromic coefficient symmetry c(e1,e2,e3) = c(2-e1,2-e2,e3) forced by the
    2-torsion point (0,0) acting on the Kummer line as x -> 1/x
  status: draft
  objective: "(A) THE EXACT ALGEBRAIC RELATION, HAND-COMPUTED. A Montgomery curve B y^2 = x^3 + A\
    \ x^2 + x maps to short Weierstrass v^2 = u^3 + au + b by\n  u = (x + A/3)/B,  v = y/B,  a = (3\
    \ - A^2)/(3B^2),  b = (2A^3 - 9A)/(27B^3).\nThe coordinate change on the FIRST coordinate is AFFINE\
    \ LINEAR - u = alpha x + beta with alpha = 1/B, beta = A/(3B). It is not merely birational, it\
    \ is degree 1 with no pole in the affine line and it fixes the point at infinity. Consequently,\
    \ up to a nonzero scalar,\n  S_3^Mont(x_1,x_2,x_3) = S_3^W(alpha x_1 + beta, alpha x_2 + beta,\n\
    \                                alpha x_3 + beta).\nThis is not an analogy; it is a substitution,\
    \ and it is checkable in one line of sympy against harness/semaev.py's s3_expr.\n(B) THE DEGREE\
    \ PREDICTION - EXACT, NOT DIRECTIONAL. An affine substitution is a degree-preserving automorphism\
    \ of the polynomial ring in each variable separately. Therefore\n  deg_{x_i} S_3^Mont = 2 for\
    \ i = 1,2,3, total degree 4,\nidentically to short Weierstrass, and deg_{x_i} S_m^Mont = 2^(m-2)\
    \ for all m. NO exponent, no constant, no change whatsoever in degree. This is the prediction\
    \ and it is falsifiable by an integer comparison.\n(C) THE SUPPORT PREDICTION, WHICH IS WHERE\
    \ THE MODELS ACTUALLY DIFFER AND WHICH IS PREDICTED TO FAVOUR WEIERSTRASS. Expanding s3_expr by\
    \ hand,\n  S_3^W = x_3^2 (x_1^2 - 2x_1x_2 + x_2^2)\n          - 2 x_3 (x_1^2 x_2 + x_1 x_2^2 +\
    \ a x_1 + a x_2 + 2b)\n          + (x_1^2 x_2^2 - 2a x_1 x_2 + a^2 - 4b x_1 - 4b x_2),\nwhose\
    \ monomials are, block by block: {x1^2x3^2, x1x2x3^2, x2^2x3^2} (3), {x1^2x2x3, x1x2^2x3, x1x3,\
    \ x2x3, x3} (5), {x1^2x2^2, x1x2, 1, x1, x2} (5). The three blocks have distinct degrees in x_3\
    \ so nothing cancels across them: SUPPORT = 13 monomials out of the 27 with multidegree at most\
    \ (2,2,2), for any a, b both nonzero. Under x_i -> alpha x_i + beta with beta != 0 the substitution\
    \ is generically dense-making, so\n  SUPPORT(S_3^Mont) = 27 whenever A != 0, and = 13 exactly\
    \ when A = 0.\nA = 0 means B y^2 = x^3 + x, which is j = 1728 - so the only Montgomery curves\
    \ whose summation polynomial is as sparse as Weierstrass's are the CM-by-i curves, and DECOMPOSITION.md\
    \ T4 says you cannot walk to those.\n(D) THE HIDDEN SYMMETRY THAT SURVIVES DENSIFICATION. On a\
    \ Montgomery curve the point T = (0,0) is 2-torsion and translation by it is\n  (x, y) + (0,0)\
    \ = (1/x, -y/x^2),\nverified directly: B y^2/x^4 = (1 + Ax + x^2)/x^3 iff B y^2 = x + Ax^2 + x^3,\
    \ which is the curve equation. So on the Kummer line the rational 2-torsion point acts as the\
    \ involution x -> 1/x. Since replacing P_i by P_i + T for an EVEN number of indices leaves the\
    \ sum P_1 + P_2 + P_3 unchanged, S_3^Mont satisfies, up to the clearing factor x_i^2 x_j^2,\n\
    \  S_3(1/x_1, 1/x_2, x_3) * x_1^2 x_2^2  =  c * S_3(x_1, x_2, x_3)\nand the two other pairings.\
    \ In coefficients: the array is invariant under flipping any EVEN number of exponents by e ->\
    \ 2 - e. That halves the number of INDEPENDENT coefficients from 27 to about 14 - 15 without reducing\
    \ the support at all.\n(E) THE TWO OUTCOMES AND WHAT EACH MEANS, SO THIS IS NOT A FISHING TRIP.\n\
    \  OUTCOME 1 - measured degrees tie at 2 and Montgomery support is 27 with the\n    palindromic\
    \ relation holding. Then the model is confirmed to be an affine\n    reskin, Montgomery is strictly\
    \ worse for any support-aware solver (BKK,\n    sparse resultants - KN-TECH-007), and the corpus\
    \ gains an exact statement\n    that the FASTEST model for scalar multiplication is the WORST\
    \ model for\n    algebraic decomposition. That inversion is the deliverable.\n  OUTCOME 2 - measured\
    \ Montgomery support is materially below 27 on a curve\n    with A != 0. Then the affine substitution\
    \ is producing unexpected\n    cancellation, my hand expansion of the Weierstrass support is wrong,\
    \ or\n    the elimination is not returning the reduced polynomial. All three are\n    instrument-level\
    \ findings that must be resolved before any other L11\n    number is believed.\n  There is no\
    \ outcome in which the measurement means nothing."
  resource_label: R2 (curve equation and model). No R1 beyond reading coordinates as field elements.
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE BUT WITH A PRE-STATED CEILING. R2 escapes the generic-group
    closure of KN-FIND-b7e091 because the object changed is the coefficient ring of a polynomial system,
    which a group-label simulator cannot produce. However this proposal''s own content is that the
    escape buys nothing in degree, and the ceiling is IDEA-20260807-dadcd2''s rational-deck-group
    law: Montgomery x and Weierstrass x have the same deck group {+-1} and the same rational part,
    so g = 2 for both and the Bezout numbers are identical at fixed factor-base size. Filing it anyway
    is the point - a recorded exact tie with a named mechanism is a deliverable under the brief.'
  reachability_gate: 'TRIVIAL AND EXPLICITLY SO. The reachability gate T5 concerns moving between
    CURVES in an isogeny class at cost about p^(1/4). Nothing here moves between curves. Converting
    a Weierstrass curve to its Montgomery model is an affine change of variable costing two field
    inversions, available with probability 1 for any curve that has a Montgomery model at all. The
    existence condition - a rational point of order 4, equivalently 4 | #E(F_p) - is an arithmetic
    property of the curve and not a search cost; it is either present for free or absent at any price.
    So the gate is passed vacuously and the lane''s finding is attributable to representation alone.'
  inputs:
    procedure: One sympy script, well under an hour of compute. STAGE A - build the toy Montgomery
      curve, verify the birational map on 200 points (gate). STAGE B - substitute into s3_expr and
      check the identity against an independently eliminated Montgomery S_3 (gate). STAGE C - count
      degrees and support for A != 0 and for A = 0. STAGE D - test the palindrome identity. STAGE
      E - run the random-affine null and the beta -> 0 decay. STAGE F - compute Bezout and mixed volume
      for both arms.
    mechanism: 'STEP 1 - VERIFY THE MAP. Build a toy Montgomery curve B y^2 = x^3 + Ax^2 + x over
      a 16-bit prime, convert to short Weierstrass by the formulas in (A), and check on 200 random
      points that (x, y) -> ((x + A/3)/B, y/B) lands on the Weierstrass curve and commutes with addition.
      Independent on-curve check in both models via harness/toycurve.py. This is a gate: a failure
      here stops everything. STEP 2 - THE SUBSTITUTION IDENTITY. Symbolically substitute x_i -> (x_i
      + A/3)/B into harness/semaev.py''s s3_expr(a, b) with a, b from (A), clear denominators, and
      check that the result is a scalar multiple of an independently derived Montgomery S_3 obtained
      by eliminating y_1, y_2 from the Montgomery addition law. If the two disagree the Montgomery
      S_3 derivation is wrong and must be fixed before any count is reported. STEP 3 - COUNT. Read
      off per-variable degrees (predicted 2, 2, 2), total degree (predicted 4), and the support size
      (predicted 27 for A != 0, 13 for A = 0). Report the explicit support set, not just its size.
      STEP 4 - THE PALINDROME TEST. Check the coefficient identity of (D) symbolically for all three
      pairings. This is a strong instrument check because it must hold EXACTLY over F_p, with no tolerance.
      STEP 5 - THE COST CONSEQUENCE. Compute the BKK mixed volume (KN-TECH-007) of the Montgomery
      and Weierstrass arity-3 decomposition systems on the same curve with the same factor base, and
      the Bezout number of each. Predicted: identical Bezout, Montgomery mixed volume >= Weierstrass
      mixed volume, with the gap being the entire measurable content of the model change. STEP 6 -
      THE NULL. Run the whole pipeline with the random-Moebius null of IDEA-20260807-4fc635 in place
      of the Montgomery map. If a random Moebius map produces the same support size and the same mixed-volume
      gap, then nothing observed is a Montgomery property - it is a "any nontrivial reparametrisation
      densifies" property, and must be reported that way.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-affine null with decay parameter beta -> 0
  - the A = 0 degenerate curve, where the effect must vanish
  - an independently derived Montgomery S_3 (by eliminating y from the Montgomery addition law), so
    the substitution identity is a check and not a definition
  - random-Moebius null per IDEA-20260807-4fc635
  - 'NULL OBJECT (from the proposal): MANDATORY. The matched null is a RANDOM AFFINE substitution
    x_i -> alpha x_i + beta with alpha, beta drawn uniformly (alpha nonzero), applied to the Weierstrass
    s3_expr on the SAME curve. It has the same shape as the Montgomery map - same degree, same variable
    count, same absence of poles - and it should produce support 27 and no palindromic relation. DECAY
    PARAMETER: the shift beta. As beta -> 0 the support must decay back to 13; a support that does
    NOT return to 13 at beta = 0 means the elimination or the reduction is broken, which is the canonical
    artifact tell. The palindromic relation must FAIL for the random null and HOLD for Montgomery
    - that contrast is the only thing in this record that is Montgomery-specific.'
  independent_variables: []
  metrics:
    primary:
    - per-variable and total degree, both models
    - explicit monomial support set and its size, both models, both A regimes
    - pass/fail of the palindrome identity per pairing
    - Bezout number and BKK mixed volume, both models
    secondary:
    - number of random-null draws and the support distribution over them
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-variable degree of reduced S_3^Mont
    formula: EXACTLY 2 in each variable; zero tolerance.
    source: pre-registered in IDEA-20260807-e6d79e before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - NON-REDUCED ELIMINATION. Resultant-based elimination introduces square factors that add spurious
    monomials and would inflate BOTH supports. Every count is taken after a squarefree reduction whose
    correctness is checked on the Weierstrass baseline.
  - SMALL-FIELD COINCIDENCES. At 16 bits, a coefficient can vanish mod p by accident, shrinking the
    support for reasons that have nothing to do with the model. Repeat over at least 5 primes and
    report the support distribution, not one number.
  - Montgomery curves have a rational point of order 4, so any curve in this experiment has cofactor
    at least 4 and is NOT a cryptographic curve. Every conclusion is scoped to Montgomery-admitting
    curves.
  - Mixed-volume computation is itself nontrivial; the KN-TECH-007 caveat that mixed volume equals
    Bezout for Newton-saturated systems applies, and a saturated Montgomery polytope would make Step
    5 report a null difference for a reason unrelated to the model.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 2 in each variable; zero tolerance.
  falsification_criterion:
  - S_3^Mont is not a scalar multiple of the substituted S_3^W. The central claim (A) is false; supersede.
  - Per-variable degree of S_3^Mont differs from 2. Falsifies (B) and, with it, IDEA-20260807-dadcd2's
    (L1) at the same stroke.
  - Montgomery support at A != 0 is materially below 27. Falsifies (C).
  - Weierstrass support is not 13 for a, b nonzero. My hand expansion is wrong and every support count
    in the lane must be recomputed.
  - The palindrome identity fails for Montgomery. Then translation by (0,0) is not x -> 1/x as computed,
    and (D) is wrong.
  - The random-affine null also satisfies the palindrome identity. Instrument fault; nothing is reported.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
