# EXP-ECDLP-3dee6b
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-74f924.
experiment:
  id: EXP-ECDLP-3dee6b
  hypothesis_id: H-ECDLP-81520e
  source_idea: IDEA-20261003-4f6a56
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 16
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-74f924
  objective: >-
    Check the counts 5, 4, and 0, the product 0, and the nearby gap 0.
  inputs:
    bit_length: 5
    doublings: 4
    additions: 0
    length_gap: 1
    doubling_gap: 4
    digit_product: 0
    digit_sum: 9
    nearby_a: 0
    nearby_b: 0
    nearby_gap: 0
    nearby_product: 0
  controls:
    - >-
      The bit length is 5. The doubling count is 4. The addition
      count is 0. Reporting the addition count as 4 drops the gap
      against the doubling count and invalidates the run.
    - >-
      Five exceeds four by 1. Four exceeds zero by 4. Five exceeds
      zero by 5. The product of 5, 4, and 0 is 0. Their sum is 9.
    - >-
      Two readings of the addition count are both 0. Their gap is
      0 and their product is 0.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 16 has bit length 5, 4 doublings, and 0
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 5. Count 4 doublings. Count 0 additions.
      Multiply 5, 4, and 0. Subtract 0 from 0.
    source: >-
      IDEA-20261003-4f6a56 states the counts 5, 4, and 0, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 0 and the nearby gap 0 are required. A check that stops at the bit length 5 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 0 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 5.
    - The doubling count is not 4.
    - The addition count is not 0.
    - The product is not 0.
    - The addition count is reported as 4, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 5, that the doubling
    count is 4, that the addition count is 0, and that the product
    of those three counts is 0.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 0.
  required_artifacts:
    - experiments/EXP-ECDLP-3dee6b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-3dee6b/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-3dee6b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-3dee6b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-3dee6b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-3dee6b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
