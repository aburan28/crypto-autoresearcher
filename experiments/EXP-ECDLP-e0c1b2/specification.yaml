# EXP-ECDLP-e0c1b2
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-c61cf3.
experiment:
  id: EXP-ECDLP-e0c1b2
  hypothesis_id: H-ECDLP-e209ca
  source_idea: IDEA-20261004-11219a
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-22 table versus width-21 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-c61cf3
  objective: >-
    Check the table sizes 2097152 and 1048576, the product 2199023255552, and the nearby gap 0.
  inputs:
    width_hi: 22
    width_lo: 21
    table_hi: 2097152
    table_lo: 1048576
    table_gap: 1048576
    table_product: 2199023255552
    table_sum: 3145728
    nearby_a: 1048576
    nearby_b: 1048576
    nearby_gap: 0
    nearby_product: 1099511627776
  controls:
    - >-
      Two to the power 21 is 2097152. Two to the power 20 is 1048576.
      Reporting both tables as size 1048576 drops the gap and invalidates
      the run.
    - >-
      Two million ninety-seven thousand one hundred fifty-two exceeds
      one million forty-eight thousand five hundred seventy-six by 1048576.
      The product of the two sizes is 2199023255552. Their sum is 3145728.
    - >-
      Two width-21 tables each store 1048576. Their gap is 0 and their
      product is 1099511627776.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-22 table stores 2097152 entries. The width-21 table stores
      1048576. The gap of two width-21 tables is 0.
    formula: >-
      Compute 2 to the power 21. Compute 2 to the power 20. Subtract
      1048576 from 2097152. Multiply 2097152 by 1048576. Subtract 1048576 from 1048576.
    source: >-
      IDEA-20261004-11219a states the widths 22 and 21 and the sizes
      2097152 and 1048576, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 2199023255552 and the nearby gap 0 are required. A check that stops at the size 2097152 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 2097152 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 21 is not 2097152.
    - Two to the power 20 is not 1048576.
    - The gap is not 1048576.
    - The product is not 2199023255552.
    - Both tables are reported as size 1048576, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-22 table stores 2097152 entries, that
    the width-21 table stores 1048576, and that 2097152 exceeds 1048576 by 1048576.
  falsification_criterion: >-
    The runs agree that the width-22 table size is computed, and
    that size is not 2097152.
  required_artifacts:
    - experiments/EXP-ECDLP-e0c1b2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-e0c1b2/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-e0c1b2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-e0c1b2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-e0c1b2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-e0c1b2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 1048576 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
