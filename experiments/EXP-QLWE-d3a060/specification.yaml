# =============================================================================
# EXP-QLWE-d3a060 — version 1, approved by DEC-20261005-2bfd2c.
# Frozen control: a log-unit certificate is scored on four cells at
# dimension 128. The prediction is fixed here, before any run. This
# design session built no lattice. No attack and no exponent
# improvement is claimed. The cyclotomic ideal, NTRU, and plain LWE
# stay in three separate assignment rows.
# =============================================================================
experiment:
  id: EXP-QLWE-d3a060
  hypothesis_id: H-QLWE-8ba30d
  question_id: RQ-QLWE-9108dc
  source_idea: IDEA-20261005-9f4777
  goal_id: null
  version: 1
  title: >-
    Log-unit certificate at dimension 128 on a planted cyclotomic
    principal ideal, against ternary NTRU, plain LWE, and a
    coefficient isometry
  status: approved
  approved_by: DEC-20261005-2bfd2c
  approved_at: '2026-10-05'
  packaging_only: false
  approval:
    approved_by: DEC-20261005-2bfd2c
    composing_decision: DEC-20261005-2bfd2c
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the certificate is 1, does not
      assert that Ring-LWE is broken, and does not move
      exp(O~(sqrt(n))).
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide which cell at dimension 128 receives a classical log-unit
    certificate, and assign that observation to the cyclotomic ideal,
    to NTRU, or to plain LWE without merging those three mechanisms.
    A failed gate is inconclusive. Do not report an attack cost.

  inputs:
    ambient_dimension: 128
    bkz_block_size: 20
    seeds:
      - 20261005
      - 20261006
    cell_A:
      ring: Z[x]/(x^128+1)
      generator_coefficients: [-1, 0, 1]
      generator_rule: >-
        Draw coefficients independently from the seed, reject the zero
        polynomial, and reject a generator of Hamming weight 0. The
        ideal is the principal ideal generated by that polynomial.
      certificate_domain: in_domain
    cell_B:
      ring: Z[x]/(x^64+1)
      secret: ternary
      moduli:
        - 32
        - 1024
      fatigue_formula: r = q / (0.004 * n**2.484) with n equal to the ring degree 64
      fatigue_sign_expectation: r(q=32) < 1 and r(q=1024) > 1
      certificate_domain: out_of_domain
    cell_C:
      ring: none
      lattice: q-ary
      dimension: 128
      q: 32
      secret: ternary
      sample_count: 128
      certificate_domain: out_of_domain
      embedding_rule: >-
        The charged lattice dimension is 128. If the implementation's
        embedding dimension is not 128, the cell is invalid. Do not
        resize it.
    cell_D:
      ring: Z[x]/(x^64+1)
      rank: 2
      dimension: 128
      q: 32
      map: x |-> x^5
      ntru_trapdoor: false
      certificate_domain: out_of_domain
    certificate_rule: >-
      On cell A, certificate is 1 if and only if the classical
      log-unit decoder returns an element equal to plus or minus x^k
      times the planted generator in Z[x]/(x^128+1) for some recorded
      integer k. Otherwise certificate is 0. On cells B, C, and D the
      decoder must refuse the input as outside the degree-128
      principal-ideal domain. The recorded bit is then 0, with reason
      out_of_domain on B, no_unit_lattice on C, and
      coefficient_isometry_not_degree_128_unit_lattice on D.
      Manufacturing a degree-128 ideal from B, C, or D and decoding it
      invalidates the run. A process crash is failed_infrastructure,
      not certificate 0.
    label_rule: >-
      The string exp(O~(sqrt(n))) is attached only to a cell whose
      certificate is 1. The illustration exp(sqrt(128)), about 8.19e4,
      is printed beside that string. It is the published ceiling, not
      a measured BKZ factor. BKZ factors never receive the label.
    not_run:
      - quantum class-group computation
      - Stickelberger close principal multiple

  controls:
    - id: plain-lwe-null
      statement: Cell C has the same ambient dimension and no ring. Certificate reason is no_unit_lattice.
      on_fail: >-
        Certificate 1 on cell C falsifies specificity. Inventing a ring
        for cell C invalidates the run.
    - id: ntru-both-moduli
      statement: >-
        Cell B is scored at q=32 and at q=1024. The harness computes
        the fatigue ratio and aborts the NTRU label if the sign
        disagrees with r(q=32) < 1 and r(q=1024) > 1.
      on_fail: >-
        A sign disagreement is inconclusive. Do not swap the moduli
        inside the run. Certificate 1 on either modulus falsifies
        specificity and assigns to that modulus, not to the cyclotomic
        ideal.
    - id: module-isometry
      statement: Cell D has only the coefficient map x |-> x^5 and no NTRU trapdoor.
      on_fail: Certificate 1 on cell D falsifies specificity.
    - id: same-bkz-budget
      statement: Cells A, B, and C use BKZ block size 20 and no other block size.
      on_fail: A different block size invalidates the BKZ column.

  independent_variables:
    - which of the four cells is scored
    - NTRU modulus q=32 versus q=1024
    - the two planted-generator seeds
    - certificate bit versus BKZ approximation factor

  metrics:
    primary:
      - id: log_unit_certificate
        kind: measured
        statement: Bit in {0,1} on each cell and each seed, with the refusal reason on B, C, and D.
      - id: approximation_factor_label_attached
        kind: measured
        statement: Whether the string exp(O~(sqrt(n))) was attached, per cell.
    secondary:
      - id: bkz_approximation_factor
        kind: measured
        statement: Approximation factor of the vector returned by BKZ-20 on cells A, B, and C. Not a label.
      - id: bkz_ideal_to_lwe_ratio
        kind: measured
        statement: Ratio of the cell-A BKZ factor to the cell-C BKZ factor.
      - id: ntru_fatigue_ratio
        kind: measured
        statement: r = q / (0.004 * n**2.484) with n=64, once per NTRU modulus.
      - id: recovered_torsion_k
        kind: measured
        statement: The integer k when certificate is 1 on cell A. Null is forbidden; record absent when the bit is 0.
      - id: peak_rss_bytes
        kind: measured
        statement: Peak resident set of the run.

  measured_versus_modeled:
    measured_column:
      - certificate bit and reason per cell and seed
      - whether the label string was attached
      - BKZ approximation factors and their A-to-C ratio
      - NTRU fatigue ratios
      - recovered k
      - peak_rss_bytes
      - wall_clock_seconds
    modeled_column:
      - >-
        The published Ideal-SVP ceiling exp(O~(sqrt(n))) from
        KN-TECH-046, illustrated at degree 128 by exp(sqrt(128)),
        about 8.19e4. This is not a run output.
    rule: >-
      Measured bits and BKZ factors stay out of the modeled column.
      The published label stays out of the measured column except as
      a flag saying whether it was attached.

  optimistic_assumptions:
    - id: planted-length
      assumption: The planted generator is already ternary, so recovery does not exhibit the Stickelberger approximation factor.
      bias: a success here is easier than short-generator recovery from an arbitrary generator
    - id: classical-step-only
      assumption: The quantum class-group step is not run.
      bias: the certificate can be present at toy length without the quantum reduction
    - id: no-transfer
      assumption: Dimension 128 is not treated as a deployed Ring-LWE, Module-LWE, or NTRU parameter set.
      bias: none toward an attack; the scope is a toy

  memory_accounting:
    dominant_structure: the dimension-128 lattice basis and the BKZ-20 local blocks
    analytical_entries: one basis of 128 vectors for each cell that runs BKZ
    measured: peak_rss_bytes
    reconciliation: report both; the ratio is not a pass or fail of the certificate
    time_memory_tradeoff: none. One block size at one dimension.

  hidden_overhead: >-
    No new o(1) term is claimed. The O~ inside the published factor
    exp(O~(sqrt(n))) is left as published and is not expanded.

  parameter_sets:
    - name: PS-DIM-128
      security_parameter: not a deployed parameter set; ambient dimension 128
      scope: cells A through D at the frozen moduli and block size
  affected_scope: []
  safe_scope:
    - Deployed Ring-LWE, Module-LWE, ML-KEM, and NTRU parameter sets. This contract claims no break and no security loss.
  exponent_claim: none

  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 is the published ceiling, used here only as the label that may
    be attached to the certificate. This contract does not fit a new
    approximation exponent.

  preregistered_prediction:
    quantity: the certificate bit per cell, and whether the label was attached
    formula: >-
      Positive side: certificate 1 on cell A for both seeds, certificate
      0 on both NTRU moduli, on plain LWE, and on the module cell, and
      the label attached only on cell A. Any certificate 1 off cell A
      falsifies specificity. Certificate 0 on cell A for both seeds
      falsifies detection. The two sides differ by the certificate bit.
    source: >-
      IDEA-20261005-9f4777 predictions and falsification conditions.
      KN-TECH-046 was read and supplies the label, not a measured factor.

  scale_relevance:
    tier: toy
    justification: >-
      The tested dimension is 128. A result here is not a result at a
      deployed parameter set. No extrapolation is authorized.
    correspondence: >-
      Direct construction of the four cells. No sampling equivalence
      is used to reach a larger dimension.

  tail_checks:
    - >-
      There is no tail probability. The sample is two seeds. A single
      seed is not scored as the reading.
    - >-
      Both seeds must agree on every certificate bit before a reading
      is assigned. Disagreement is inconclusive.

  replication:
    seeds:
      - 20261005
      - 20261006
    seeds_note: >-
      Each seed draws an independent ternary generator for cell A and
      independent ternary secrets for cells B and C. Cell D uses the
      same seeds for its error and secret draws.
    independent_instances: 2
    independent_instances_note: >-
      The two seeds are the two instances. Cells B, C, and D are
      controls, not further copies of cell A.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and memory figures are advisory watches. They do not change
      the block size, the moduli, or the dimension. Watch expiry is
      failed_infrastructure. The scientific sample is two seeds and
      four cells.

  procedure:
    cell_A: >-
      Build the planted principal ideal. Run classical log-unit
      decoding in the log-embedding of the unit lattice of
      Q[x]/(x^128+1). Set the certificate from the torsion-unit test.
      Attach the label only if the bit is 1.
    cells_BCD: >-
      Refuse the log-unit decoder. Record the reason. Do not build a
      degree-128 ideal from these cells. Run BKZ-20 on B and C. On B,
      compute the fatigue ratio in the harness.
    bkz: >-
      Run BKZ block size 20 on A, B, and C. Store the approximation
      factor in the measured column. Do not copy it into the label.
    assignment: >-
      Write three mechanism rows when the bits match the prediction,
      plus the module control. Write exactly one falsification or
      inconclusive row when they do not. Never write a merged label
      such as structured-versus-plain.

  mechanism_assignment:
    - id: row-cyclotomic-ideal
      observation: >-
        Both seeds have certificate 1 on cell A, the recovered element
        is a torsion-unit multiple of the planted generator, and the
        label exp(O~(sqrt(n))) is attached on cell A only.
      assigns_to: >-
        The cyclotomic ideal, via the classical log-unit step. This
        row does not assign the result to NTRU or to plain LWE, and
        it does not move the approximation factor.
    - id: row-ntru
      observation: >-
        Both NTRU moduli have certificate 0 with reason out_of_domain.
        The harness fatigue ratio is below 1 at q=32 and above 1 at
        q=1024. No NTRU vector carries the exp(O~(sqrt(n))) label.
      assigns_to: >-
        NTRU, as a dense-sublattice regime separated by the fatigue
        ratio. This row does not assign the result to the cyclotomic
        ideal or to plain LWE.
    - id: row-plain-lwe
      observation: >-
        Plain LWE has certificate 0 with reason no_unit_lattice. Its
        BKZ-20 approximation factor is recorded and does not carry the
        label.
      assigns_to: >-
        Plain LWE, the null object with no unit lattice. This row does
        not assign the result to the cyclotomic ideal or to NTRU.
    - id: row-certificate-on-control
      observation: >-
        Certificate 1 on cell B, cell C, or cell D, on either seed.
      assigns_to: >-
        Falsification of specificity. Name the cell. Do not merge it
        into the cyclotomic-ideal row.
    - id: row-certificate-absent
      observation: >-
        Certificate 0 on cell A for both seeds, and certificate 0 on
        B, C, and D.
      assigns_to: >-
        Falsification of detection. The design does not see the chain.
        This is not evidence that the literature chain is absent.
    - id: row-bkz-artifact
      observation: >-
        Certificate 0 on cell A, and the BKZ-20 factor on A matches
        the BKZ-20 factor on C within a factor of 2.
      assigns_to: >-
        A BKZ artifact. It assigns to none of the three mechanisms.
    - id: row-ntru-modulus-flip
      observation: >-
        Certificate 0 at NTRU q=32 and certificate 1 at NTRU q=1024.
      assigns_to: >-
        The overstretched modulus. Not the log-unit chain, and not
        plain LWE.
    - id: row-inconclusive
      observation: >-
        The two seeds disagree, the fatigue-ratio sign disagrees with
        the pre-registered expectation, a cell was coerced into a
        degree-128 ideal, the embedding dimension is not 128, or the
        watch expired.
      assigns_to: Inconclusive. None of the three mechanisms is decided.

  stopping_rules:
    - Stop when every cell and both seeds have a certificate bit and a reason, the fatigue ratios are computed, and BKZ-20 factors for A, B, and C are recorded, or when a gate fails.
    - Do not add a dimension, a modulus, a block size, or a fifth cell.
    - Do not shrink beta to meet the watch.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, missing dependency, or memory abort is failed_infrastructure and is not evidence against the hypothesis.
    - Embedding cell B, C, or D into Z[x]/(x^128+1) and decoding that ideal invalidates the run.
    - Attaching exp(O~(sqrt(n))) to a BKZ factor, or to a cell whose certificate is 0, invalidates the label column.
    - Using any BKZ block size other than 20 invalidates the BKZ column.
    - Scoring one seed as the reading invalidates the replication.
    - Changing the pre-registered prediction after seeing bits is forbidden. A correction is a new amendment, and existing runs are not re-scored.
    - Writing the three mechanisms as one structured-versus-plain bit invalidates the assignment.

  success_criterion: >-
    The run is a success for the separated reading exactly when
    row-cyclotomic-ideal, row-ntru, and row-plain-lwe all hold, and
    cell D has certificate 0. The criterion fails when
    row-certificate-on-control, row-certificate-absent,
    row-bkz-artifact, or row-ntru-modulus-flip holds.
    row-inconclusive is not success and falsifies nothing.

  falsification_criterion: >-
    Specificity is falsified when row-certificate-on-control or
    row-ntru-modulus-flip holds. Detection is falsified when
    row-certificate-absent holds. The claim that the label tracks a
    non-BKZ certificate is falsified when row-bkz-artifact holds.
    row-inconclusive falsifies nothing. No completed row claims an
    attack or an exponent improvement.

  required_artifacts:
    - experiments/EXP-QLWE-d3a060/runs/RUN-*/manifest.yaml
    - experiments/EXP-QLWE-d3a060/runs/RUN-*/stdout.txt
    - experiments/EXP-QLWE-d3a060/runs/RUN-*/stderr.txt
    - experiments/EXP-QLWE-d3a060/runs/RUN-*/raw-result.json
    - experiments/EXP-QLWE-d3a060/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      Per seed and per cell: certificate bit, reason, label-attached
      flag, BKZ factor where required, fatigue ratio on NTRU, peak
      rss, and the published label kept in a separate field.
    verdict.yaml: >-
      Either the three mechanism rows together with the module bit, or
      exactly one falsification or inconclusive row. The verdict does
      not change hypothesis status and does not merge the three
      mechanisms.

  assigned_to: executor
  zero_runs_in_design: true
