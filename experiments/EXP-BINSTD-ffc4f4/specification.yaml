  objective: >-
    Independently replicate the Stage-1 (17,3) matched-pair median
    N_var(GP)/N_var(rand) panel of EXP-BINSTD-6c199f under a disjoint catalog
    after EV-BINSTD-78ca0d O-FAIL-BAND; deliver exactly one O-* label from
    H-BINSTD-39a59f. Stage-2 n∈{19,23}+null admitted on trial-plan-v2 under
    DEC-20261003-d4c332 after the Stages 0-1 weaken.

  class: heuristic_validation
  class_note: >-
    Pre-registered δ band replication on a construction-family instrument.
    Not an exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze δ=0.10, ε=0.15, disjoint GP seed roster, catalog_seed
        2026100331, encoder pin; twin self-check; write
        preregistered-predictions.json and v-catalog.json. Refuse parent seed.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3)} build ≥8 GP/random matched pairs with
        |Δ dim(V·V)|≤1; write stage1/panels.json, stage1/control-table.json,
        RESULTS.md with exactly one O-* label.
      - >-
        Stage 2 (admitted on trial-plan-v2; NOT on trial-plan-v1). n∈{19,23}
        GP/random δ-band plus random-vs-random null with ε=0.15;
        implementation/run.py --stage 2 / RUN-BINSTD-662af5.
    excluded:
      - Re-running EXP-BINSTD-6c199f frozen v1 catalog / seed 2026100327.
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Admitting Stage-2 on trial-plan-v1.
      - Editing IDEA-20261002-adb7bb claim text or GOAL-ECDLP2M-001.yaml.
      - Editing δ after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-ffc4f4/trial-plan-v2.json
    trial_plan_v1_historical: experiments/EXP-BINSTD-ffc4f4/trial-plan-v1.json
    command_stage2: >-
      python3 experiments/EXP-BINSTD-ffc4f4/implementation/run.py --stage 2
      --trial-plan experiments/EXP-BINSTD-ffc4f4/trial-plan-v2.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit Stage 2 via
      tools/experiment_execution.py load_plan. Twin meters copied from
      EXP-BINSTD-6c199f. {run_dir} substituted by supervisor. trial-plan.json
      is a byte-identical copy of trial-plan-v2.json. trial-plan-v1.json
      remains the immutable Stages 0-1 historical plan.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-adb7bb.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-39a59f.yaml
    predecessor_evidence: ledger/evidence/EV-BINSTD-78ca0d.yaml
    predecessor_decision: ledger/decisions/DEC-20261003-9575fd.yaml
    parent_experiment: experiments/EXP-BINSTD-6c199f/specification.yaml
    delta: 0.10
    epsilon_null: 0.15
    catalog_seed: 2026100331
    parent_catalog_seed: 2026100327
    stage1_cells:
      - {n: 17, ell: 3}
    stage2_specified_cells:
      - {n: 19, ell: 3}
      - {n: 23, ell: 3}

  controls:
    - name: twin_dimVV_Nvar
      definition: >-
        dimVV path A == path B and N_var path A == path B on every measured V.
    - name: ctl_matched_dim_VV_within_1
      definition: Every reported GP/random pair satisfies |dimVV_GP − dimVV_rand| ≤ 1.
    - name: ctl_frozen_delta_epsilon
      definition: δ=0.10 and ε=0.15 frozen in preregistered-predictions.json.
    - name: ctl_shared_encoder_pin
      definition: Encoder pin frozen in preregistered-predictions.json.
    - name: ctl_min_matched_pairs
      definition: ≥8 matched pairs required; else O-INCONCLUSIVE.
    - name: ctl_no_posthoc_delta_edit
      definition: δ constant not edited after Stage-0 freeze.
    - name: ctl_disjoint_catalog
      definition: >-
        catalog_seed=2026100331 ≠ parent 2026100327; GP seeds disjoint from
        parent roster; check.py refuses parent seed reuse.
    - name: ctl_not_parent_rerun
      definition: Do not invoke EXP-BINSTD-6c199f trial-plan-v1.json.
    - name: null_random_vs_random_pairs
      definition: >-
        Stage 2 admitted on trial-plan-v2 (DEC-20261003-d4c332); NOT on
        trial-plan-v1. Named so the Stage-1 reading cannot silently claim
        the null.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_replication_n17]
    - name: cell
      levels: ['(17,3)']
    - name: v_family
      levels: [geometric_progression, random_matched]

  metrics:
    primary:
      - name: median_Nvar_ratio_GP_over_random
        unit: dimensionless
        definition: >-
          Median of N_var(GP)/N_var(rand) across matched pairs with
          |Δ dim(V·V)| ≤ 1.
      - name: band_holds
        unit: boolean
        definition: median_Nvar_ratio_GP_over_random ≤ 1−δ (= 0.90).
      - name: twin_agreement
        unit: boolean
        definition: Twin dimVV and N_var meters agree on every measured V.
      - name: matched_pair_count
        unit: integer
        definition: Number of pairs satisfying the match rule.
    secondary:
      - name: dimVV_GP
        unit: integer
      - name: dimVV_rand
        unit: integer
      - name: N_var_GP
        unit: integer
      - name: N_var_rand
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-BINSTD-adb7bb-H1

  preregistered_prediction:
    quantity: >-
      Median N_var(GP)/N_var(rand) ≤ 1−δ with δ=0.10 on Stage-1 cell (17,3)
      after twin agreement, across ≥8 matched pairs, under catalog_seed
      2026100331 (disjoint from 2026100327).
    formula: >-
      For each GP V, sample random dim-ℓ V until |dimVV_GP-dimVV_rand|<=1;
      ratio = N_var(GP)/N_var(rand); band holds iff median(ratio) <= 0.90.
    source: >-
      ledger/proposals/IDEA-20261002-adb7bb.yaml; EV-BINSTD-78ca0d NA-1
      successor; frozen before Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Construction-family instrument on n=17 only under trial-plan-v1. No
      transfer of a δ band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - Fewer than 8 matched pairs → O-INCONCLUSIVE (not O-SUPPORT).
    - Parent catalog_seed 2026100327 reuse → O-ARTIFACT.
    - Match-rule violations must not appear in reported pairs.

  seeds_and_replication:
    catalog_seed: 2026100331
    parent_catalog_seed_forbidden: 2026100327
    gp_seeds: [35, 37, 39, 41, 43, 45, 49, 51, 53, 57, 59, 65]
    independent_instances: 1
    note: >-
      Cell (17,3) is the authorized Stage-1 replication instance. Twin meters
      are the replication instrument for each V. Disjoint from parent roster.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-39a59f.
    - maximum_runs = 4.
    - Do not open Stage-2 under trial-plan-v1 (use trial-plan-v2).
    - Stage 2 complete with stage2/gp-panels.json, stage2/null-panels.json,
      RESULTS-stage2.md naming exactly one O-*, OR named O-ARTIFACT /
      O-IMPEDIMENT stop.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure or parent-seed reuse → O-ARTIFACT; do not read band as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.
    - Re-running EXP-BINSTD-6c199f → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes and catalog_seed
    2026100331; Stage 1 produces median N_var(GP)/N_var(rand) vs ≤1−δ band
    for (17,3) with twin agreement and |Δ dimVV|≤1 matching (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-BINSTD-39a59f with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; parent-seed reuse; post-hoc δ edit; a claimed
    break/exponent under this card; re-running EXP-BINSTD-6c199f.
    (O-FAIL-BAND is a valid scientific negative of O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-ffc4f4/trial-plan-v1.json
    - experiments/EXP-BINSTD-ffc4f4/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-ffc4f4/stage0/v-catalog.json
    - experiments/EXP-BINSTD-ffc4f4/stage1/
    - experiments/EXP-BINSTD-ffc4f4/RESULTS.md
    - experiments/EXP-BINSTD-ffc4f4/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-ffc4f4/implementation/run.py
    - experiments/EXP-BINSTD-ffc4f4/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
