      field: F_2[z]/(z^3 + z + 1)
      enumeration_rule: CTL-ADMISSION-SELFTEST what_v2
      first_qualifying: {a: 1, b: 2, key_8a_plus_b: 10}
      skipped_before_it: 'every (a, b) with a = 0 and b in {2, ..., 7}: #E(F_8) is 8 or 12, whose largest prime factor is 2 or 3'
      group_order_F8: 10
