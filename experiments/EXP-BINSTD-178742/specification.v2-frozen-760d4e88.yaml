  section_b19793:
    as: DEC-20260924-99ce20 S2 absorbs (report check A8)
    content: >-
      Lemma L8. Because k | r - 1 (L1), X^k - 1 splits over F_r into k linear
      factors, and e = ord_k(r) = 1. The F_r[Z/k]-module of raw columns splits
      into k eigenblocks of dimension |V|/k each. The discrete-log vector lies in
      the one line per orbit that pairs with the lambda-block (L5). Solving that
      block is solving the orbit-quotient system of dimension |V|/k: the same
      rows, the same dimension, the same reduction by k. It is one saving named
      twice. It must not be multiplied with the orbit quotient, and the other k -
      1 blocks carry no information about the logarithms. The rank question
      IDEA-20260922-b19793 (B) poses about the n tau-images of one relation is
      answered exactly by L3 in the raw bases and by L4 in the quotient. No block
      Wiedemann or Lanczos cost is measured here.
  section_dacfc2:
    as: DEC-20260924-99ce20 S2 absorbs (derived column only)
    content: >-
      The derived quotient-dimension column is |V|/k: the number of class orbits
      at every toy sub-cell, reported exactly beside |V| and |F|. Per relation
      family, the quotient system receives exactly one row (L4). At a deployed
      row the factor is k symbolically; no |V| is chosen. The measured K/B
      memory comparison, the byte counts, and assembled-matrix row counts are
      NOT designed. They belong to NISTBIN (R2) and RELN (H-261004-1).

  rho_convention:
    condition: C2 (CORR-20260922-0d365e)
    convention: >-
      Matched rho with negation and the Frobenius class map is sqrt(pi r / (4 k))
      group operations, with k the row's own Frobenius order (k = 1 on rows with
      no subfield structure). The constant sqrt(pi/4) = 0.886 is already the
      negation-only row.
    net_gap_restated: >-
      Relative to negation-only rho, sqrt(pi r / 4), the Frobenius class map
      lowers matched rho by exactly sqrt(k), which is sqrt(n) on a Koblitz row.
      The larger factor that IDEA-20260915-8fe0ef and H-261004-2 carried is
      superseded by CORR-20260922-0d365e. This contract computes no
      index-calculus-to-rho gap and states none.
    calibration_design_figure: >-
      ECC2K-130, hand arithmetic. log2 l = 129.00: l has 39 digits and leading
      digits 680564733841876926, which match 2^129 as recalled
      (680564733841876926926749214863536422912; the recalled value is a
      pointer, and Bailey et al. call l a 129-bit prime). log2
      sqrt(pi/4) = -0.1743 and log2 sqrt(131) = 0.5 x 7.0334 = 3.5167, so log2 of
      matched rho = 64.5 - 0.1743 - 3.5167 = 60.81. Bailey et al. section 2 gives
      sqrt(pi l / (2 x 2 x 131)) x 1.069993 = 2^60.9 iterations. That is the same
      expression times their stated walk factor, and log2 1.069993 = 0.098 gives
      60.91. The convention reproduces the published figure up to the factor
      the authors name.

