      r0: 5
      frobenius_trace_over_F8: -1
      characteristic_roots_mod_r0: [1, 3]
      d_min: 3
      q: 8
      k: 5
      expected_lambda: 1
      expected_AR-2: 'reject; reason ord(lambda) = 1 != 5'
      expected_deleted_clause_mutant: admit

  controls:
    - id: CTL-PLANTED
      gate: G0
      blocking: true
      what: >-
        Planted-rank controls, per admitted r and at the fixture r. (i) Twenty
        matrices per rho in {1, n', k}, with n' = l of each sub-cell, of shape k by
        4k, built as U diag(I_rho, 0) V with U and V seeded random invertible
        matrices over F_r (invertibility checked). RANK-A and RANK-B must return
        rho exactly. (ii) Structured families: orbit polynomials f = 1 (expected
        k), f = (X^k - 1)/(X - zeta0) (expected 1) and f = product over zeta not
        in S of (X - zeta) with |S| = n' (expected n'). These go through the raw,
        quotient and ker-g pipelines with planted h, and the elimination must
        equal EVAL on every one.
    - id: CTL-FIXTURE
      gate: G1
      blocking: true
      what: The n = 17 reproduction fixture, run before any new cell. On failure nothing downstream is read.
    - id: CTL-FORCED-NEGATIVE
      gate: G2
      blocking: true
      what: The forced-negative arm n in {19, 29, 37} must return no usable stable subspace (PTM-C).
    - id: CTL-ADMISSION-SELFTEST
      gate: G3
      blocking: true
      what: >-
        PTM-D. Enumerate curves y^2 + xy = x^3 + a x^2 + b over F_8 (a, b in F_8, b
        != 0) in the order of the integer bit patterns of (a, b), and take the
        first whose #E(F_8) has a prime factor r0 >= 5. Take P of order r0 in
        E(F_8) and hand (E over F_{2^15}, P, r0, q = 8, k = 5) to the admission
        routine. Admission rule AR-2 must reject it, because lambda = 1, before
        any rank is read.
      v2_change: D6
      what_v2: >-
        V2 (D6; red-team RC-5, O-11). SUPERSEDES the version-1 text above for
        version 2. F_8 = F_2[z]/(z^3 + z + 1) (lowest weight, then least as an
        integer), with a and b written as 3-bit integers in the basis 1, z, z^2.
        Enumerate y^2 + xy = x^3 + a x^2 + b with b NOT in F_2 (b in {2, ..., 7})
        and a in F_8, ascending in the integer 8 a + b, and take the first whose
        #E(F_8) (exhaustive count, point at infinity included) has a prime
        factor r0 >= 5, with r0 its largest prime factor. Viewed over F_{2^15},
        definitions.k_and_q gives d_min = 3, q = 8 and k = 5 from the
        coefficients themselves, so (q, k) is no longer handed in. Take P of
        order r0 in E(F_8). Run AR-2 IN ISOLATION on (E, P, r0, q, k): E1's
        clauses are not applied, so the size clause cannot reject it first.
        EXPECTED: AR-2 rejects, and the recorded rejection reason is
        ord(lambda) = 1 != k (tau fixes E(F_8) pointwise, so [lambda] P = tau(P)
        = P forces lambda = 1). DELETED-CLAUSE MUTATION: the same object handed
        to AR-2 with its order clause deleted (only lambda^k = 1 checked) must be
        ADMITTED; if the mutant also rejects, the self-test has no power and G3
        fails. The frozen object is cells.admission_selftest_object.
    - id: CTL-NULL
      blocking: true
      what: >-
        PTM-A, at every positive n. E_b with b drawn by seed from F_{2^n} minus
        F_2, redrawn in a seeded sequence until its order has an admissible prime
        (rule E1 bounds), and the number of redraws recorded. Use the first stable
        W of that n. Relations come from RS-1 (32 targets, m = 2) and RS-3 (64,
        m = 2). The instrument must compute d_min = n and k = 1 and form no
        conjugate row. Raw class rank = quotient rank = 1 on every relation.
        tau(P) must fail to lie on E_b for every sampled P (L6).
      v2_change: D1 (consequence; additive reading, the what text above is unchanged)
      v2_reading: >-
        V2 (D1). In version 2, "rule E1 bounds" reads as clauses E1-a and E1-c
        of P2-E1 applied to E_b (r the largest prime factor of #E_b(F_{2^n}),
        r^2 not dividing it, and (r - 1)/2 >= 4 n); the withdrawn version-1
        size clause is not used. E1-b has no object here (E_b has no model over
        F_2), and E1-d is not a bound: at k = 1, AR-2_v2 passes trivially
        (lambda = 1 has order 1 = k), so applying or omitting it changes no
        redraw. The redraw count may therefore differ from what the version-1
        clause would have produced; it is recorded as before and is not
        evidence.
    - id: CTL-NONSTABLE
      blocking: true
      what: >-
        PTM-B, at every positive n, on both curves. W' is a seeded random F_2
        subspace of dimension l equal to the first stable W's, redrawn until dim
        C(W') <= 1, with the redraw count recorded. Relations come from RS-1 (32
        targets, m = 2) and RS-3 (64, m = 2) over F_{W'}. For every relation the
        instrument tests whether every tau^j(leg) lies in F_{W'}. It must find
        that each family leaves the base (L7), admit zero families as relations
        over W', and report no rank for them.
    - id: CTL-TWO-CURVES
      blocking: true
      what: >-
        C1. At each positive n, E_0 and E_1 are both admitted with different
        primes. Every rank identity is read on both.
    - id: CTL-INSTRUMENT-SELFTEST
      v2_change: D4
      gate: G4
      blocking: true
      what: >-
        V2 (D4; red-team RC-6). Pre-registered instrument self-tests, run on the
        first admitted positive cell in canonical order ((n, a) = (17, 0), its
        first stable W, RS-3 m = 2 relations, 16 of them by seed), after G1 and
        before any Part-2 rank is read. Two deliberately defective builds of the
        instrument are run on the same relations as the correct build. M1
        (copy-row builder): every conjugate row j is set equal to row 0. M2
        (orientation-flipped labeller): each leg's shift e is found by
        searching tau^{-e}(Q_O) instead of tau^{e}(Q_O). EXPECTED: under M1,
        CERT-BIND fails on every relation, so IR-17 fires; under M2, CERT-QUOT
        or CERT-LABEL fails on at least one relation, so IR-15 or IR-16 fires;
        under the correct build no certificate fails. The gate passes iff each
        mutant is INVALIDATED and the correct build is not. A mutant that
        passes every certificate is an instrument defect of the certificates
        (IR-18) and stops the run before any rank is read. The mutants'
        outputs are recorded and never read as ranks.
      why_this_cell: >-
        The first admitted cell in canonical order is named so that the choice
        is fixed before any run. A relation whose labels are invariant under the
        flip can pass CERT-QUOT under M2, which is why M2's expectation is "at
        least one relation", with CERT-LABEL as the per-leg backstop.

  independent_variables:
    - n (positive arm 17, 23, 31, 41; forced-negative 19, 29, 37)
    - curve a in {0, 1}, plus the null object E_b
    - stable divisor g (four per curve per n), and the non-stable W'
    - relation source RS-1 to RS-4 and arity m in {2, 3}
    - basis (raw class, raw point, quotient, ker-g)
    - standardized row (eleven, Part 1)

  # ---------------------------------------------------------------------------
  procedure:
    ordering_note: Steps run in this order. A blocking failure stops the run per stopping_rules.
    steps:
      - id: P0-ENV
        text: >-
          Record the environment, the library versions, the two rank routines,
          the seeds, the git commit and the dirty state. Hash every input file
          read, including both FIPS files (finding RI-1).
      - id: P0-G0
        text: CTL-PLANTED on the fixture r first, and on each admitted r when that r is first used.
      - id: P0-G1
        text: CTL-FIXTURE (n = 17).
      - id: P0-G2
        text: CTL-FORCED-NEGATIVE.
      - id: P0-G3
        text: CTL-ADMISSION-SELFTEST.
      - id: P1-1
        text: >-
          Census. For n in {131, 163, 233, 283, 409, 571} and the seven toy n,
          compute ord_n(2) by two routes: (a) the prime-divisor test on n - 1 and
          (b) iterating powers of 2 until 1. Factor X^n - 1 over F_2 with a named
          routine and derive the stable-dimension set from the factor degrees.
          Compare everything with structural_certificate. A difference halts
          nothing but is referred to the Coordinator (outcome O-CENSUS-DISAGREE).
      - id: P1-2
        text: >-
          Deployed rows, under source_rules_for_executor SR-SRC-1 to SR-SRC-5,
          which bind the executor. For each of the eleven rows: read r, the
          coefficients, m and the field polynomial from the primary source; test r
          for primality with a named deterministic or probable-prime routine;
          compute d_min and k from the coefficients; compute r mod k; give the
          verdict TRUE, FALSE or NOT COMPUTED with the reason. Compare with
          deployed_rows. Only then may the value be compared with
          analysis/binstd-curve-audit/, as a reported cross-check.
      - id: P1-3
        text: >-
          If any computed verdict is FALSE (TB-3), finish Part 1, record it, and
          halt before Part 2 (stopping rule SR-4).
      - id: P2-E1
        v2_change: D1 (amendment AM-E1 within version 2; remedy CHANGED BOUND)
        text: >-
          V2 (D1). Cell admission rule E1, version 2. The version-1 size clause r >
          2^floor(n/2) is withdrawn: by integer arithmetic it cannot be met at (n,
          a) = (17, 0) and (41, 1), so version 1 halted every execution at SR-5
          and made O-SUPPORT condition (4) unreachable (DEC-20260924-286589 R-J2,
          B-J2-1). Of the three remedies named there, a second prime on the same
          curve cannot help (every prime factor of those two orders is below the
          withdrawn bound) and a changed positive-arm degree would alter the
          carried toy screen, so the bound is changed. For each positive n and a
          in {0, 1}: compute #E_a by the Lucas recurrence, factor it completely,
          and take r as its largest prime factor. Admit (n, a) iff all four
          clauses hold. E1-a: r^2 does not divide #E_a. E1-b: r does not divide
          #E_a(F_2) (2 for a = 1, 4 for a = 0, so r odd suffices). E1-c, the size
          clause: (r - 1)/2 >= 4 n, so that the number of G-classes up to sign is
          at least the 4 n columns a sub-cell needs to escape the carried |V| < 4
          n disjointness exclusion (P2-4). E1-d: admission rule AR-2 passes. The
          pair at n is complete iff both curves are admitted and r_0 != r_1. The
          executor compares its factorisation, r, lambda and verdict with
          cells.positive_arm.e1_admissibility_table before any rank readout; any
          difference halts with status e1_table_disagree, which is an
          instrument-or-table discrepancy referred to the Coordinator, never
          resolved by the executor, and never evidence. If any positive n lacks a
          complete pair, halt before any rank readout with status incomplete_C1,
          an impediment and not evidence (stopping rule SR-5). By the frozen
          table every positive (n, a) is admitted and every pair is complete, so
          SR-5 can fire only if the table is wrong, and O-SUPPORT condition (4)
          is reachable by design.
      - id: P2-G4
        v2_change: D4
        text: >-
          V2 (D4). Gate G4, CTL-INSTRUMENT-SELFTEST (M1 and M2 must be
          invalidated by the certificates, and the correct build must not be).
          It runs after P2-E1 has admitted (17, 0) and before any rank readout
          of any cell; it builds only the one sub-cell it names. No rank is
          readable until G4 passes (SR-3b).
      - id: P2-1
        text: >-
          Per admitted (n, a) and stable W: build W, then F_W. Group classes into
          orbits and compute the base orbit-length histogram. It must be all k and
          all n on points (IR-7). Record |F|, |V| and |V|/k.
      - id: P2-2
        text: >-
          Generate relations from RS-1 to RS-4. Admission rule AR-1: every leg
          lies in F_W, sum of legs = R is verified on the curve (certificate), and
          pi_G(R) != O. A leg outside F_W is an instrument anomaly (IR-9).
      - id: P2-2b
        v2_change: D2, D3
        text: >-
          V2 (D2, D3). Per admitted relation, before any rank is computed:
          CERT-LABEL on every leg of row 0, CERT-QUOT on row 0, then build rows 1
          to k-1 curve-side and run CERT-BIND on each. A relation on which any
          certificate fails is not ranked; it is recorded with the failing
          certificate and fires IR-15, IR-16 or IR-17.
      - id: P2-5
        v2_change: O-12 (moved before P2-3)
        text: CTL-NULL and CTL-NONSTABLE at each positive n, with CTL-TWO-CURVES confirmed.
        ordering_note: >-
          V2 (O-12). Moved ahead of P2-3: at each n, no rank of that n is
          readable until P2-5 has passed there (the v1 order ran it after the
          rank readouts).
      - id: P2-3
        text: >-
          Per admitted relation: record the legs, the columns (O, e, eps), the
          orbit polynomials, the multiplicity profile, and the orbit-length
          histogram of its legs (class and point). Compute rank_raw_class,
          rank_raw_point, rank_quotient and rank_kerg for the defining g with
          RANK-A, the EVAL value for each, deg h_g and g-hat(lambda) mod r. Run
          RANK-B where RANK-A and EVAL disagree and on the 10 percent sample. No
          rank is recorded without its histogram (IR-13).
        v2_addendum: >-
          V2 (D2, D3, D5, O-12). P2-3 runs only on relations that passed P2-2b,
          and only at an n where G4 and P2-5 have passed. rank_kerg follows the
          k = 1 rule of ker_g_null_expectation. Also record, per divisor g and
          cell, g-hat(lambda^i) mod r for every i in [0, k - 1], and, per
          single-base relation, rank_raw_class beside n' = dim W (the
          claim-(C)-relevant readings).
      - id: P2-4
        text: >-
          C1 disjointness exclusion. Flag every sub-cell with |V| < 4n. Its
          relations are excluded from the reading of raw class rank = k on
          relations with an orbit hit by exactly one column, and are still
          checked against L3 and L4.
      - id: P2-6
        text: >-
          Counterexample handling. A relation where RANK-A differs from EVAL and
          RANK-B agrees with RANK-A is a candidate counterexample. Export it as
          counterexample_certificate: curve, r, lambda, legs, full k-row matrix
          in each basis, and both routine outputs. The run continues (stopping
          rule SR-8). If RANK-B disagrees with RANK-A, that is an instrument
          defect (IR-14).
        v2_addendum: >-
          V2 (D3). A candidate is read as O-REFUTE-L3 or O-REFUTE-Q ONLY IF
          CERT-LABEL, CERT-QUOT and CERT-BIND all pass on it (they are re-run on
          the exported rows, and their outputs are part of the
          counterexample_certificate) AND G4 passed. Otherwise it is an
          instrument defect (IR-15 to IR-18), never a falsification outcome, and
          a deterministic defect that replicates is still a defect.
      - id: P2-7
        text: Write summary.json. Every figure there is recomputable from the raw jsonl files.

  metrics:
    primary:
      - ord_n_of_2 (13 values) and stable-dimension sets, against the frozen table
      - per standardized row, the transcribed r, d_min, k, r mod k and verdict, against the frozen table
      - per admitted relation, rank_raw_class, rank_raw_point, rank_quotient and rank_kerg (RANK-A), with EVAL values and agreement flags
      - per admitted relation, the orbit-length histograms (class and point) and the multiplicity profile
    secondary:
      - per sub-cell, |F|, |V|, |V|/k, the base histogram, and the admitted count by source
      - per divisor g and cell, deg h_g, the roots lambda^i of h_g, g-hat(lambda) mod r, and the distribution of rank_kerg
      - per cell, r, lambda, the factorisation of the group order, and e = ord_k(r) (must be 1)
      - count of relations with rank_raw_class < k, by source and multiplicity profile
      - count of relations with rank_raw_class < rank_raw_point (L5b)
      - null, non-stable and forced-negative readouts and redraw counts
      - fixture values and cross-check counts
      - wall clock and peak RSS per step, reported beside the analytic size of the largest object (the F_W table at n = 41, about 2^22 points)
      - V2 (D2-D4). per relation and row, the CERT-LABEL, CERT-QUOT and CERT-BIND outcomes; the G4 self-test outcomes for the correct build, M1 and M2
      - V2 (D5). per divisor and cell, the vector g-hat(lambda^i) mod r for i in [0, k - 1] and deg h_g against kerg_design_table; per single-base relation, rank_raw_class beside n' = dim W
      - V2 (D1, D6). the E1 table comparison per (n, a), and the admission self-test's rejection reason and deleted-clause mutant outcome
      - V2 (D8). per c2pnb row and tier, the source, printed name, mapping, and the SR-SRC-8 comparison label
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Per-relation ranks of the conjugate family in four bases. Also the six
      deployed ord_n(2) values with their stable-dimension sets, and the six
      computed k | r - 1 verdicts.
    formula: >-
      rank_h = #{i in [0, k-1] : h(lambda^i) = 0 and some f_O(lambda^i) != 0}, with
      h = X^k - 1 (raw class and raw point), h = X - lambda (quotient, so the rank
      is 1) and h = h_g (ker-g). The census and verdicts are the frozen values in
      structural_certificate.
    source: >-
      This contract's derivation, lemmas L1 to L4 and L9, written before any run
      and never adjusted after one; any change goes through a versioned
      protocol_amendment. The fixture values come from KN-OPEN-095df5 and
      IDEA-20260915-8fe0ef.
    v2_addendum: >-
      V2 (D1, D5). Written before any run. Added frozen predictions: every
      entry of cells.positive_arm.e1_admissibility_table, canonical_factors and
      kerg_design_table; hence rank_kerg = 0 on every admitted relation at every
      designed positive cell (deg h_g = 0 there); every certificate passes on a
      correctly built relation; M1 and M2 are invalidated at G4; and the
      admission_selftest_object is rejected by AR-2 with reason ord(lambda) = 1
      and admitted by the deleted-clause mutant. No c2pnb value is predicted.
  scale_relevance:
    tier: toy
    justification: >-
      Part 2 runs at n <= 41, and the lemmas it tests are stated for every prime k.
      Measured agreement is scoped to the tested cells. Part 1 is exact integer
      arithmetic at the deployed parameters, with no attack and no extrapolation.
      No transfer assumption is needed for Part 1, and none is claimed for Part 2
      beyond the derivation itself.
    correspondence: null
  tail_checks:
    - RS-4 minus-sign relations, the extreme case of same-orbit cancellation, must give k - 1 in the raw class basis and k in the raw point basis.
    - The relation with the largest per-orbit multiplicity in each cell is reported with its full matrix.
    - The divisor with the largest deg h_g in each cell is reported with its roots and the rank_kerg distribution.
    - Any relation whose rank_raw_point < k is reported with its orbit polynomials; L3 allows this only through f_O(zeta) = 0 mod r.
  replication:
    v2_change: m-J2-6 (template shapes; seed values and meaning carried from version 1)
    seeds: [1787420001, 1787420002]
    independent_instances: 2
    seed_roles:
      run_R1_master_seed: 1787420001
      run_R2_master_seed: 1787420002
      derivation: >-
        Each sub-seed is SHA-256 of the master seed, a separator and the cell
        label, read as an integer. The labels are fixed strings such as
        n17-a1-g0b100111001-RS1.
    independent_instances_note: >-
      Two scientific runs, R1 and R2, with independent target, draw and planted
      seeds. The gates and Part 1 are deterministic and must be byte-identical
      across runs (IR-12).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 12
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1
    note: >-
      Advisory (docs/research-budget-policy.md). maximum_runs is two scientific
      runs plus at most two reruns after an infrastructure failure, each
      labelled as such. The memory ceiling is machine protection; exceeding it
      checkpoints the task and is infrastructure, never evidence.

  stopping_rules:
    - SR-1. G0 fails, so the run stops and is invalid. Nothing is read.
    - SR-2. G1 (the n = 17 fixture) fails, so the run stops and is invalid. Nothing downstream is read.
    - SR-3. G2 or G3 fails, so the run stops and is invalid.
    - SR-3b. V2 (D4). G4 fails (IR-18), so the run stops and is invalid before any rank is read.
    - SR-4. Any computed deployed verdict is FALSE (TB-3). Finish Part 1, record it, halt before Part 2, status halted_TB3. DEC-20260924-99ce20 S2 applies, so everything downstream waits.
    - SR-5. E1 finds no complete curve pair at some positive n. Halt before any rank readout with status incomplete_C1. This is an impediment and not evidence.
    - SR-5c. V2 (D5). The executor's deg h_g differs from cells.positive_arm.kerg_design_table, or its factorisation of Phi_n differs from cells.positive_arm.canonical_factors, at any cell. Halt that n before its rank readout with status kerg_table_disagree; both values are reported and referred to the Coordinator. Never evidence.
    - SR-5b. V2 (D1). The executor's E1 group order, factorisation, r, lambda or admission verdict differs from cells.positive_arm.e1_admissibility_table at any (n, a). Halt before any rank readout with status e1_table_disagree; both values are reported and the difference is referred to the Coordinator. This is an instrument-or-table discrepancy, never evidence.
    - SR-6. CTL-NULL, CTL-NONSTABLE or CTL-TWO-CURVES fails at any n, so the run stops and is invalid.
    - SR-7. The memory ceiling or a watchdog fires. Checkpoint with status failed_infrastructure; this is never evidence.
    - SR-8. A candidate counterexample (P2-6) does not stop the run. It is exported and the run completes.
    - SR-9. An unreachable primary source (SR-SRC-3) does not stop the run. The row is NOT COMPUTED.

  invalidation_rules:
    - IR-1. Any planted-rank control returns the wrong rank.
    - IR-2. Any fixture gate check fails.
    - IR-3. The forced-negative arm returns a usable stable subspace, or ord_n(2) != n - 1 there.
    - IR-4. The admission self-test admits the lambda = 1 cell.
    - IR-5. The null object gives k != 1, forms a conjugate row, or gives raw rank != quotient rank on any relation. V2 (D5) extension -- or a rank_kerg or deg h_g is formed on it, or its ker-g column enters a basis-difference reading (definitions.ker_g_null_expectation; see also IR-19).
    - IR-6. The non-stable control admits any conjugate family as relations over W'.
    - IR-7. Any class orbit of length other than k, or any point orbit of a factor-base point of length other than n. This is an instrument defect by L2.
    - IR-8. Any admitted relation fails its on-curve certificate.
    - IR-9. Any admitted relation has a leg outside F_W, or a target with pi_G(R) = O.
    - IR-10. Any deployed-row value is taken from analysis/binstd-curve-audit/, another secondary dump, or recall. That row is invalid; if it was used for a verdict, Part 1 is invalid.
    - IR-11. The manifest is incomplete, a seed is unrecorded, or raw jsonl and summary.json disagree.
    - IR-12. R1 and R2 disagree on any deterministic output (gates or Part 1).
    - IR-13. Any rank is reported without its orbit-length histogram and multiplicity profile.
    - IR-14. RANK-A and RANK-B disagree on any matrix.
    - IR-15. V2 (D2). CERT-QUOT fails on any admitted relation. The quotient row is not the true equation on the logarithms, which is an instrument defect by L4 and L5.
    - IR-16. V2 (D2). CERT-LABEL fails on any leg of any admitted relation, in any row.
    - IR-17. V2 (D3). CERT-BIND fails on any conjugate row, or a curve-side row differs from its polynomial-shift cross-check.
    - IR-18. V2 (D4). Gate G4 fails, that is, the M1 or M2 mutant is not invalidated or the correct build is. The certificates are then unfit, and no rank of the run is readable.
    - IR-19. V2 (D5). rank_kerg is computed, or entered in any basis-difference reading, on a k = 1 object (see definitions.ker_g_null_expectation).

  success_criterion: >-
    Decidable from the metrics. Outcome O-SUPPORT, supporting H-BINSTD-ce4f38
    within the tested scope, holds IF AND ONLY IF all of the following hold in
    both R1 and R2. (1) G0 to G3 and every blocking control pass, and no
    invalidation rule fires. (2) Part 1 reproduces all thirteen ord_n(2) values
    and the six deployed stable-dimension sets exactly. (3) Each of the six
    computed deployed rows matches the frozen r string and gives TRUE, and each
    c2pnb row is either TRUE with primary provenance or NOT COMPUTED with a
    logged impediment. (4) E1 admits a complete pair at every positive n. (5)
    Every admitted relation (at least 100 per (n, a)) has rank_quotient = 1 and
    raw class, raw point and ker-g ranks equal to their EVAL values. This
    includes k - 1 (raw class) and k (raw point) on every RS-4 minus-sign
    relation, and k on every RS-4 plus-sign relation, outside the |V| < 4n
    exclusion for the disjointness reading. NEGATIVE OUTCOMES, any one of which
    decides against O-SUPPORT. O-REFUTE-Q: a verified relation with quotient rank
    != 1. O-REFUTE-L3: a verified relation whose raw class, raw point or ker-g
    rank differs from EVAL. O-ROWFAIL: a deployed verdict FALSE (TB-3).
    O-CENSUS-DISAGREE: a Part 1 value differs from the frozen table. NOT
    EVIDENCE: invalid, halted_TB3 pending resolution, incomplete_C1, and
    failed_infrastructure.
  success_criterion_v2:
    v2_change: D1, D2, D3, D4, D5, D8
    text: >-
      V2. SUPERSEDES success_criterion above for version 2; the version-1 text
      is kept only for the record. Decidable from the metrics. Outcome
      O-SUPPORT, supporting H-BINSTD-ce4f38 within the tested scope, holds IF AND
      ONLY IF all of the following hold in both R1 and R2. (1) G0 to G4 and
      every blocking control pass, and no invalidation rule (IR-1 to IR-19)
      fires. (2) Part 1 reproduces all thirteen ord_n(2) values and the six
      deployed stable-dimension sets exactly. (3) Each of the six computed
      deployed rows matches the frozen r string and gives TRUE, and each c2pnb
      row is either TRUE from a TIER-P source with primary provenance or NOT
      COMPUTED in TIER-P with a logged impediment (a TIER-D value never counts,
      SR-SRC-6). (4) E1 admits a complete pair at every positive n, and every
      entry of cells.positive_arm.e1_admissibility_table, canonical_factors and
      kerg_design_table is reproduced. (5) Every admitted relation (at least 100
      per (n, a)) passes CERT-LABEL, CERT-QUOT and CERT-BIND, has rank_quotient
      = 1 and raw class, raw point and ker-g ranks equal to their EVAL values,
      with rank_kerg = 0 wherever deg h_g = 0. This includes k - 1 (raw class)
      and k (raw point) on every RS-4 minus-sign relation, and k on every RS-4
      plus-sign relation, outside the |V| < 4n exclusion for the disjointness
      reading. NEGATIVE OUTCOMES, any one of which decides against O-SUPPORT.
      O-REFUTE-Q: a relation passing all three certificates, with G4 passed,
      whose quotient rank != 1 under RANK-A and RANK-B. O-REFUTE-L3: such a
      relation whose raw class, raw point or ker-g rank differs from EVAL under
      both routines. O-ROWFAIL: a deployed verdict FALSE (TB-3).
      O-CENSUS-DISAGREE: a Part 1 value differs from the frozen table. NOT
      EVIDENCE: invalid (including any certificate or self-test failure),
      halted_TB3 pending resolution, incomplete_C1, e1_table_disagree,
      kerg_table_disagree, and failed_infrastructure.
  decision_it_changes: >-
    V2 (D7; read with CORR-20260925-649e25). From DEC-20260924-99ce20 S2. On
    O-SUPPORT, the reachability table of RQ-BINSTD-b6f698 may record, ROW BY
    ROW, the relation-yield column of each Frobenius row whose k, r and k | r -
    1 verdict are primary-sourced and TRUE in this contract in the per-orbit
    unit (one quotient row per solve, dimension |V|/k), and rank 7 onward
    (IDEA-20260922-1a081a C3, IDEA-20260922-c48e7d Saving-B) is re-read against
    it; a row recorded NOT COMPUTED is not re-recorded. Which record's column,
    if any, counted k rows per solve is for that re-reading to establish, and
    this contract states no change to any record's figure. On O-REFUTE-Q
    (reachable only through a candidate that passes CERT-LABEL, CERT-QUOT and
    CERT-BIND), the factor-k linear-algebra reduction is in question and goes
    to review, at review-breakthrough if tripwire TB-2 applies. On
    O-REFUTE-L3 (same certificate condition), the raw-basis accounting is
    corrected by the counterexample certificate. On O-ROWFAIL, that row's
    parameters or the structural claim are wrong, and everything downstream
    waits until it is resolved.
  falsification_criterion: >-
    H-BINSTD-ce4f38 is refuted within the tested scope by any one of the
    following, provided no invalidation rule fired. (a) A relation certified on
    the curve, with its histogram all k, whose quotient rank is not 1 under both
    RANK-A and RANK-B. (b) Such a relation whose raw class, raw point or ker-g
    rank differs from the lemma-L3 value under both routines. (c) A standardized
    row whose r and k come from a primary source with k not dividing r - 1. (d)
    A reproducible independent computation of an ord_n(2) value or
    stable-dimension set that differs from the frozen table. The strongest
    refutation artifact is the counterexample_certificate of P2-6, which is
    archived before any decision relies on it. A single run is never grounds for
    reject_scoped; weaken plus replication applies.
  falsification_criterion_v2_addendum:
    v2_change: D3
    text: >-
      V2 (D3). Items (a) and (b) above count only a relation on which
      CERT-LABEL, CERT-QUOT and CERT-BIND all pass, in a run whose gate G4
      passed; the three certificate outputs are part of its
      counterexample_certificate. A relation failing any certificate is an
      instrument defect (IR-15 to IR-17) and refutes nothing, however often it
      replicates.

  required_artifacts:
    run_directory: experiments/EXP-BINSTD-178742/runs/RUN-<id>/
    files:
      - manifest.json (the AGENTS.md artifact policy fields, including inference and seeds)
      - environment.txt, stdout.txt, stderr.txt
      - input_hashes.json (sha256 of every input read, including both FIPS files and every retrieved primary source)
      - part1_census.json (both routes, the factorisations of X^n - 1, and the comparison with the frozen table)
      - part1_rows.json (per row the source, provenance, transcription, primality test, d_min, k, r mod k, verdict, and the cross-check result, or NOT COMPUTED with the attempts log)
      - gate_planted.json, gate_fixture_n17.json, gate_forced_negative.json, gate_admission_selftest.json
      - cell_admission.json (E1, with group-order factorisations, r, lambda, and pair completeness)
      - subcells.json (W basis, g bits, |F|, |V|, |V|/k, base histograms)
      - relations.jsonl (every admitted relation with legs, certificate and source)
      - ranks.jsonl (every relation in four bases with RANK-A, RANK-B where run, EVAL, histograms and profile)
      - controls_null.json, controls_nonstable.json
      - counterexample_certificates/ (empty if none)
      - summary.json
    archive_note: >-
      Run artifacts are immutable once written. A failed or invalid attempt is
      kept and labelled, never deleted.

  interpretation_limits:
    - >-
      The rank identities are tested on toy Koblitz cells (n <= 41, two curves per
      n) and on the sampled and constructed relations. Lemmas L1 to L4 are general;
      the measurement is a consistency check of them, and one certified
      counterexample refutes.
    - >-
      One conjugate family at a time. How the assembled quotient system grows with
      the number of solves (H-261004-1) is excluded, as are pipeline cost and the
      K/B memory comparison.
    - >-
      Part 1 is exact arithmetic on published parameters. It asserts nothing
      about the cost or the security of any standardized curve, and it closes
      nothing.
    - >-
      V2 (O-7, O-5, O-6; supersedes the version-1 "unread" item). eprint
      2020/1315 was retrieved and read by TASK-20260924-eaf78a (provenance
      retrieved, archived in its report); IMP-GGMP is cleared against that
      archived record, and the version-2 producer cites it without re-reading
      the source. Nothing is attributed to eprint 2020/1315 beyond that
      report's reading. The ker-g readout adjudicates only this contract's
      operationalised basis under the 0/1 lift (the characteristic-2 reading of
      its equation (4)). L3 and Lemma 3.3 are statements in different bases
      (definitions.ggmp_basis_dependence); version 2 does not state that Lemma
      3.3 fails as stated, and no outcome here is read as such a statement.
      Claim (C) of IDEA-20260922-261004 stays scoped to the readings named in
      definitions.ker_g_design_values.
    - >-
      V2 (D7; red-team O-8; supersedes the version-1 "lowers a claimed gain"
      item). The contract fixes the basis in which a Frobenius row's
      relation-yield column is stated and measures per-conjugate-family ranks in
      each basis. It names no record whose claimed gain it corrects, and it
      states no correction to any claimed gain: whether any record's column
      counts k rows per solve against a system of dimension |V|/k is not
      established here. No outcome of this contract makes any attack cheaper
      or any curve weaker or safer.
    - >-
      V2 (D7; CORR-20260925-649e25). Any consequence for a reachability-table
      column is CONDITIONAL on an approved, reviewed version of this contract
      establishing it in Part 1 and Part 2; it applies ROW BY ROW, only on a row
      whose k, r and k | r - 1 verdict are primary-sourced here and only where a
      named record's relation-yield column counts k relations per solve. A row
      recorded NOT COMPUTED carries no consequence (the five c2pnb rows while
      IMP-X962 stands), nor does a row whose column already counts per orbit.
      No bit movement of any row's column is stated.

  proof_search_map:
    summary: >-
      V2. The full map is in H-BINSTD-ce4f38 proof_search_map (version 1) as
      superseded for version 2 by its version_2 block. The five KN-TECH-080
      audits of version 2, each filled, are in
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/proof-search-map-audit.yaml.
      The version-1 audit sheet under BATCH-7d29e8/design/ is untouched.
    bottleneck: >-
      V2 (D7; red-team O-9). The relation-yield column of every Frobenius row
      must name its basis (raw class, raw point, orbit quotient or ker-g), and
      this contract fixes the per-conjugate-family ranks in each. No bit
      movement of any row's column is stated or implied.
    baseline_reproduction: fixture_n17 (gate G1) and the null-object slice k = 1 (CTL-NULL).
    observation_collision: >-
      V2 (D4). Five named collisions, each with the readout that separates it.
      (1) Short orbit versus submodule: AR-1 and IR-9 reject the leg, IR-7 is
      the backstop, and at prime k no short orbit yields a sub-k rank strictly
      between 1 and k - 1. (2) Same-orbit cancellation versus instrument error:
      EVAL and the RS-4 tail checks. (3) Quotient absorption versus a copy-row
      instrument (M1): SEPARATED BY CERT-BIND (IR-17), not by the null object
      or the non-stable control, which form no conjugate row and test set
      membership only; the version-1 claim that those separate it is
      withdrawn. (4) ker-g coincidence versus the lemma-as-relayed: the
      per-divisor g-hat(lambda^i) mod r reading and deg h_g against its frozen
      design table. (5) A true per-orbit equation versus a false one of the
      same rank, for example an orientation-flipped labeller (M2), which
      replaces f_O(X) by f_O(X^{-1}): SEPARATED BY CERT-QUOT and CERT-LABEL
      (IR-15, IR-16). M1 and M2 are pre-registered self-tests that must be
      invalidated at gate G4 before any rank is read (CTL-INSTRUMENT-SELFTEST).
    quantifier_order: >-
      For all admitted cells, stable W, targets and decompositions. lambda
      depends only on (curve, r). One certified counterexample refutes.
      V2 (D2; AUD-3). Every rank of L3 is invariant under the automorphism X ->
      X^{-1} of mu_k (it permutes the roots), but the quotient equation of L4
      is not: it is tied to the specific lambda with [lambda] P0 = tau(P0).
      Rank agreement therefore cannot certify a labelling, and the quantifier
      over labellings is discharged by CERT-LABEL and CERT-QUOT per relation,
      not by any rank.
    method_ceiling_and_nearby_object: >-
      Ceiling: exact per-family identities on the tested cells plus exact
      deployed arithmetic, and nothing about cost, GGMP's text, or assembled
      rank. Controls: null object, non-stable subspace, forced-negative arm and
      admission self-test, all blocking.
      V2 (D5, D6). The null object now has a stated ker-g expectation (not
      computed at k = 1; IR-5, IR-19), the admission self-test uses an object
      consistent with definitions.k_and_q and runs AR-2 in isolation with a
      deleted-clause mutation (CTL-ADMISSION-SELFTEST), and M1/M2 are
      pre-registered instrument self-tests (G4).
    strictness_and_interfaces: >-
      No strict improvement is claimed. Interfaces L5 (raw to quotient), L5b
      (points to classes) and L8 (eigenblock equals quotient) are separate
      lemmas.
      V2 (D2). L5's interface obligation is now checked per relation by
      CERT-QUOT: the quotient row must be the true equation sum_O f_O(lambda)
      y_O = log pi_G(R).

