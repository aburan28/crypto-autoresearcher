  # ---------------------------------------------------------------------------
  definitions:
    curves: >-
      Koblitz E_a: y^2 + xy = x^3 + a x^2 + 1, a in {0, 1}, over F_{2^n}. Null
      object E_b: y^2 + xy = x^3 + x^2 + b, b in F_{2^n} not in F_2. Group order
      #E_a(F_{2^n}) = 2^n + 1 - s_n, from the Lucas recurrence s_0 = 2, s_1 = t,
      s_{i+1} = t s_i - 2 s_{i-1}, with t = 1 for a = 1 and t = -1 for a = 0. By hand, #E_1(F_2) = 2
      (points O and (0,1)) and #E_0(F_2) = 4 (points O, (0,1), (1,0), (1,1)).
      For E_b the order comes from a named point-counting routine.
    k_and_q: >-
      d_min is the least divisor d of m such that every curve coefficient lies in
      F_{2^d}, tested by the fixed-point test c^(2^d) = c. Then q = 2^d_min and k =
      m / d_min. Koblitz rows have k = n, and the null object has k = 1.
    G_and_r: >-
      r is the prime order of the subgroup G used. At a toy cell r is the largest
      prime factor of the group order, and the cell is admitted only under rule
      E1. At a deployed row r is the base-point order read from the primary
      source.
    lambda: >-
      The scalar with tau(Q) = [lambda] Q for Q in G. Candidates are the roots mod
      r of X^2 - t X + q. The executor keeps the root that satisfies
      [lambda] P0 = tau(P0) on a generator P0 of G, and checks lambda^k = 1 and
      lambda != 1 (admission rule AR-2).
    AR-2_v2:
      v2_change: D6
      text: >-
        V2 (D6). Admission rule AR-2 is stated as ord(lambda) = k: lambda^k = 1
        mod r and lambda^(k/p) != 1 mod r for every prime p dividing k (for prime
        k this is lambda != 1). The routine records which clause decided. It is
        runnable in isolation from rule E1 (CTL-ADMISSION-SELFTEST).
    stable_subspace: >-
      W = ker g(tau) = {x in F_{2^n} : sum_i g_i x^(2^i) = 0}, g a monic divisor of
      X^n - 1 over F_2, dim W = deg g. Usable means 2 <= deg g <= n - 2.
    canonical_order_of_divisors: >-
      The irreducible factors of Phi_n over F_2 are ordered by the integer whose
      bit i is the coefficient of X^i, ascending, and labelled f1, f2, and so on.
      Divisors of degree j d are products of j distinct factors, enumerated in
      lexicographic order of the index tuple. The (X + 1)-multiple of a divisor
      is its 0/1 product with X + 1 over F_2.
    factor_base: >-
      F_W = {P in E(F_{2^n}) affine : x(P) in W, pi_G(P) != O}, where pi_G(P) = [h
      (h^{-1} mod r)] P and h = #E / r. Points of E(F_2) have x in F_2 and pi_G = O,
      so they are never in F_W. F_W is closed under negation and under tau.
    raw_class_basis: >-
      Columns are the G-classes {+Q, -Q} of pi_G(P) for P in F_W; |V| is the number
      of these columns. Group the classes into tau-orbits; tau acts on classes as
      multiplication by lambda. Each orbit O gets a canonical representative Q_O
      (least x(Q) as an integer bit pattern in the polynomial basis). Column (O,
      e) is the class with DESIGNATED representative [lambda^e] Q_O, e = 0..k-1.
      A leg P with pi_G(P) = eps [lambda^e] Q_O, eps = +1 or -1, contributes eps to
      column (O, e). V2 (m-J1-4): Q and -Q share x(Q), so the tie between them is
      broken by the lesser y as an integer bit pattern in the same basis; Q_O is
      that point.
    raw_point_basis: >-
      Columns are the points of F_W themselves, P and -P separately. Point orbits
      under tau have canonical representatives P_O (least x, then least y), and
      column (O, e) is tau^e(P_O). A leg contributes +1 to its own point column.
      This is IDEA-20260922-261004's point-indexed raw basis, reported as a
      second raw reading.
    orbit_polynomial: >-
      For a relation and an orbit O (class or point), f_O(X) = sum over e of
      c_{O,e} X^e in F_r[X], where c_{O,e} is the summed coefficient on column (O,
      e). An orbit is HIT when f_O != 0. The multiplicity profile of a relation
      is, per hit orbit, the number of columns with nonzero coefficient.
    conjugate_family: >-
      Row j (j = 0..k-1) is the relation with every leg replaced by tau^j of that
      leg. On orbit O its block polynomial is X^j f_O(X) mod (X^k - 1). Scaling a
      row by lambda^{-j} (the proposal's normalisation) changes no rank, and both
      forms are accepted.
    conjugate_family_binding:
      v2_change: D3
      text: >-
        V2 (D3). The rank readout uses the CURVE-SIDE rows: row j is built by
        applying tau^j (coordinate-wise 2^j-th powering) to every leg of row 0,
        and its columns are labelled by the label certificate below, never by
        shifting row 0's polynomials. The polynomial-shift form X^j f_O(X) mod
        (X^k - 1) is computed separately as a cross-check and must equal the
        curve-side row coefficient by coefficient (certificate CERT-BIND). The
        normalised form lambda^{-j} x row j is permitted only after CERT-BIND
        passes on the unnormalised row.
    certificates:
      v2_change: D2, D3
      CERT-LABEL: >-
        V2 (D2; red-team RC-2). Per leg P with assigned label (O, e, eps): the
        instrument recomputes pi_G(P) = [h (h^{-1} mod r)] P and eps [lambda^e]
        Q_O by scalar multiplication on the curve, independently of the
        tau-orbit search that assigned (e, eps), and checks equality. For the
        raw point basis the check is P = tau^e(P_O) by coordinate powering.
      CERT-QUOT: >-
        V2 (D2; red-team RC-1). The quotient-equation certificate, which checks
        that the quotient row is the TRUE equation on the logarithms (L4, L5):
        for each admitted relation with target R, sum over hit class orbits O of
        [f_O(lambda) mod r] Q_O = pi_G(R), computed on the curve by at most m +
        1 scalar multiplications. It is evaluated at the lambda of AR-2, never at
        lambda^{-1} or another root of unity.
      CERT-BIND: >-
        V2 (D3; red-team RC-3). For each j in 1..k-1: the legs of row j equal
        tau^j of the legs of row 0; row j carries its own on-curve certificate
        sum of its legs = tau^j(R) = [lambda^j] R (both sides computed, the
        second by scalar multiplication); CERT-LABEL passes on every leg of row
        j; and the curve-side row equals the polynomial-shift cross-check.
      reading: >-
        A failure of any certificate on an admitted relation is an instrument
        defect (IR-15 to IR-17), never a falsification outcome. The
        certificates are what separate a true per-orbit equation from a false
        one of the same rank (red-team M1 and M2; DEC-20260924-286589 R-J3); the
        ranks themselves do not.
    quotient_basis: >-
      One column per class orbit O, unknown y_O = log Q_O, with log of column (O,
      e) = lambda^e y_O. Row j has coordinate lambda^j f_O(lambda) on O, or
      f_O(lambda) after normalisation.
    ker_g_basis: >-
      For the divisor g defining W, g-hat in Z[X] is the 0/1 integer lift of the
      F_2 polynomial g itself. h_g = gcd(g-hat mod r, X^k - 1) in F_r[X], computed
      as the product of (X - lambda^i) over the i in [0, k-1] with g-hat(lambda^i)
      = 0 mod r; mu_k(F_r) = {lambda^i} because ord(lambda) = k. The ker-g
      coordinates of row j on orbit O (V2, m-J1-3: O is a CLASS orbit) are the
      deg h_g coefficients of X^j f_O(X) mod h_g. If deg h_g = 0 the space is zero and the rank is 0. V2 (O-5,
      O-7). This is the contract's operationalisation of a basis suggested by
      KN-OPEN-095df5's relay of Lemma 3.3: it imposes the identities g-hat(tau)
      Q = O for the 0/1 lift g-hat, which is the characteristic-2 reading of
      eprint 2020/1315 equation (4); equation (4) read over Z uses the lift
      X^{n'} - sum_{j<n'} c_j X^j, and the source fixes no integer lift (as read
      by TASK-20260924-eaf78a, attack_iii_ggmp, provenance retrieved by that
      agent; cited here as an archived internal record, not re-read at source by
      the version-2 producer). The contract adjudicates only this
      operationalised basis under this lift, whether or not the identities hold
      in G, and attributes nothing else to eprint 2020/1315.
    ker_g_null_expectation:
      v2_change: D5
      text: >-
        V2 (D5; red-team RC-4, O-4, O-10). The ker-g basis presupposes ord(lambda)
        = k with lambda != 1, which cannot hold at k = 1. On a k = 1 object (the
        null object E_b) rank_kerg is NOT COMPUTED, by rule, and the ker-g column
        enters no basis-difference reading; only raw = quotient = 1 (L6) is read
        there (IR-5, IR-19). deg h_g is not formed at k = 1.
    ker_g_design_values:
      v2_change: D5
      text: >-
        V2 (D5). deg h_g at every designed positive cell is fixed by integer
        arithmetic before any run: it is #{i in [0, k - 1] : g-hat(lambda^i) = 0
        mod r}, equivalently the number of zeta in mu_k(F_r) with g-hat(zeta) = 0
        mod r, so it does not depend on which root is lambda. The frozen values
        are in cells.positive_arm.kerg_design_table. Where deg h_g = 0 the ker-g
        space is zero and rank_kerg = 0 on every relation by definition, so the
        per-relation ker-g rank carries no information there; the content of
        the ker-g column is then the per-divisor vector (g-hat(lambda^i) mod r)
        for i in [0, k - 1] (a deterministic reading, reported and checked for
        R1/R2 identity, not predicted value by value), and the claim-(C)-relevant
        per-relation reading is rank_raw_class beside n' = dim W on single-base
        relations.
    ggmp_basis_dependence:
      v2_change: O-6 (RL-O6)
      text: >-
        V2 (O-6; DEC-20260924-286589 RL-O6). L3 and eprint 2020/1315 Lemma 3.3
        are statements in different bases. L3 is proved here for the raw class
        and raw point bases (rank = k - deg gcd(X^k - 1, all f_O), which is k
        on any relation with an orbit hit by exactly one column), the orbit
        quotient (rank at most 1, by L4) and the ker-g basis (rank at most deg
        h_g, at most min(deg g, k)). Lemma 3.3, as retrieved and read by
        TASK-20260924-eaf78a, bounds by n' the number of linearly independent
        relations that the Frobenius action provides for a Frobenius-invariant
        factor base of dimension n' defined by l(X) dividing X^n - 1 in F_q[X],
        and its proof uses the identity l(pi) P = O. In the orbit quotient the
        bound n' holds trivially (1 <= n'), and it holds in any quotient in
        which l(lambda) = 0 mod r. In the raw bases it is not implied by L3
        when n' < k. Which basis and coefficient ring Lemma 3.3's "linearly
        independent" is counted in is not fixed by this contract. The review
        pointer TASK-20260924-eaf78a O-6, that read in the raw factor-base basis
        the lemma's bound is inconsistent with L3, is recorded here as that
        report's reading; RL-O6 ruled it a pointer, not a tripwire. VERSION 2
        DOES NOT STATE THAT GGMP LEMMA 3.3 FAILS AS STATED, no outcome of this
        contract is read as such a statement, and any later record that
        proposes it is a contradiction claim under AGENTS.md rule 12, to run at
        review-breakthrough at max in the first round that states it.
    rank_routines: >-
      RANK-A and RANK-B are two Gaussian-elimination routines over F_r with exact
      integers, written or sourced independently (for example one hand-written
      and one library routine), each named with its version. The evaluation
      route EVAL counts the i in [0, k-1] with h(lambda^i) = 0 and some
      f_O(lambda^i) != 0, where h is the basis annihilator. RANK-A is primary.
      RANK-B is run on every relation where RANK-A and EVAL disagree, and on a
      seeded 10 percent sample of all others.
    sizes: >-
      |F| is the number of factor-base points, |V| the number of class columns,
      and |V|/k the number of class orbits, which is the dimension of the
      quotient system.
    field_representation: >-
      At toy n the executor chooses an irreducible polynomial for F_{2^n}
      (lowest-weight, then lexicographically least, recommended) and records
      it. W, F_W, the orbits and every rank are independent of that choice. So
      is the choice of orbit and class representatives, which changes each f_O
      only by a unit multiple X^s or -1 (quantifier audit). Only the labels of
      the columns move.

  # ---------------------------------------------------------------------------
  derivation:
    status: >-
      Derivation note of this design, written by TASK-20260924-34ada8, not yet
      reviewed. Review joint J1 re-derives it. Each lemma has a single
      responsibility.
    lemmas:
      - id: L1
        responsibility: correctness
        statement: >-
          tau acts on G as multiplication by lambda with lambda^k = 1 and lambda !=
          1, so ord(lambda) = k and k | r - 1.
        proof: >-
          tau is an endomorphism of E commuting with [h], so it preserves G = [h] E,
          which is cyclic of prime order r. It therefore acts as a scalar lambda.
          tau^k = id on E(F_{q^k}) gives lambda^k = 1. If lambda = 1, tau would fix
          G pointwise and G would lie in E(F_q), which contradicts r not dividing
          #E(F_q). With k prime, ord(lambda) = k divides |F_r^*| = r - 1.
      - id: L2
        responsibility: correctness
        statement: Every tau-orbit of G-classes up to sign, with Q != O, has exactly k elements, and so does every tau-orbit of points of F_W.
        proof: >-
          [lambda^e] Q = +Q or -Q forces lambda^e = +1 or -1. -1 is not a k-th root
          of unity because k is odd and r > 2, so lambda^e = 1 and k | e. For a
          point P in F_W, tau^e(P) = P implies the same for pi_G(P) != O.
      - id: L3
        responsibility: correctness
        statement: >-
          (Evaluation lemma.) Let h divide X^k - 1 in F_r[X] and let Z(h) be its
          roots. The k rows (X^j f_O(X) mod h), taken over all hit orbits O, span a
          space of dimension #{zeta in Z(h) : f_O(zeta) != 0 for some O}.
        proof: >-
          By L1, X^k - 1 = product over zeta in mu_k of (X - zeta) with k distinct
          roots in F_r, so h is squarefree. The Chinese remainder theorem gives an
          isomorphism F_r[X]/(h) to F_r^{Z(h)}, p maps to (p(zeta)). Row j maps to
          the vector with entry zeta^j f_O(zeta) at (zeta, O). For fixed zeta,
          every column indexed by (zeta, O) is f_O(zeta) times v_zeta = (zeta^j)
          for j = 0..k-1. The v_zeta for distinct zeta are columns of a k by |Z(h)|
          Vandermonde matrix with distinct nodes, hence independent. The column
          space is spanned by the v_zeta with some f_O(zeta) != 0, and row rank
          equals column rank.
        corollaries:
          - >-
            Raw basis (h = X^k - 1). rank = #{zeta in mu_k : some f_O(zeta) != 0}
            = k - deg gcd(X^k - 1, all f_O).
          - If some orbit is hit by exactly one column, its f_O = c X^e with c != 0 is nonzero everywhere, so the rank is k.
          - >-
            Legs P and -tau^d(P), 0 < d < k, share one class orbit with f_O = eps
            X^e (1 - X^d). It vanishes only at zeta^d = 1, which means zeta = 1, so
            the raw class rank is k - 1.
          - Legs P and tau^d(P) give f_O = eps X^e (1 + X^d), zero only where zeta^d = -1, which has no solution, so the rank is k.
          - >-
            Point basis. P and -P lie in different point orbits by L2, so every
            m = 2 relation hits one or two point orbits with f_O a monomial or X^a
            + X^b. The point rank is therefore k for every m = 2 relation.
          - >-
            Ker-g basis (h = h_g). rank = #{i : g-hat(lambda^i) = 0 mod r, some
            f_O(lambda^i) != 0}, which is at most deg h_g, itself at most
            min(deg g, k).
      - id: L4
        responsibility: correctness
        statement: >-
          (Quotient identity.) The quotient coordinate of row j on O is lambda^j
          f_O(lambda), so all k rows are proportional and the quotient rank is at
          most 1. It equals 1 exactly when the target R has pi_G(R) != O.
        proof: >-
          Conjugation replaces column (O, e) by (O, e + j mod k), and log([lambda^(e
          + j)] Q_O) = lambda^(e + j) y_O. If every f_O(lambda) were 0, the true
          identity sum_O f_O(lambda) y_O = log pi_G(R) would force log pi_G(R) =
          0, that is pi_G(R) = O.
        erratum_v2:
          id: E1-err
          text: >-
            V2 (erratum E1-err; DEC-20260924-286589 R-J1, D-J1-2). The statement
            and proof above are carried byte-identical. The proof establishes
            one direction only: the quotient rank is 1 WHENEVER pi_G(R) != O. The
            converse implicit in "exactly when" is not derived and is false in
            general (with two or more hit orbits, some f_O(lambda) can be nonzero
            while sum_O f_O(lambda) y_O = 0, so pi_G(R) = O with quotient rank
            1). No criterion uses the converse. AR-1 admits only relations with
            pi_G(R) != O, which is the hypothesis's "target in G minus O", so on
            every admitted relation the proved direction is the one read.
      - id: L5
        responsibility: interface
        statement: >-
          The raw-to-quotient map is reduction of each block mod (X - lambda),
          which is evaluation at lambda. The true log vector x, with x at (O, e)
          equal to lambda^e y_O, pairs with a raw row only through f_O(lambda). So
          raw rows that differ by an element of the kernel impose the same
          equation on the logarithms, and the quotient loses no information about
          them. What it discards is which conjugate was found first.
      - id: L5b
        responsibility: interface
        statement: >-
          The point-to-class map merges P with -P, and with P + T for T in E[h],
          adding coefficients. Merging columns cannot raise rank, so rank_class <=
          rank_point. Relations where the two differ are reported by source (the
          RS-4 minus-sign relations are the constructed case).
      - id: L6
        responsibility: correctness
        statement: >-
          (Null object.) If b is not in F_2 then (x^2, y^2) lies on y^2 + xy = x^3 +
          x^2 + b^2, which is not E_b. tau is not an endomorphism, d_min = n and k =
          1. The conjugate family is the relation alone, and raw rank = quotient
          rank = 1.
      - id: L7
        responsibility: correctness
        statement: >-
          (Non-stable base.) The set of x whose whole tau-orbit lies in W' is the
          stable core C(W') = intersection of tau^{-j}(W') for j = 0..n-1, a
          tau-stable subspace. If dim C(W') <= 1 then C(W') is contained in F_2. A
          leg of F_{W'} has x outside F_2, so some conjugate of that leg leaves
          F_{W'}, and no conjugate family is a family of relations over W'.
      - id: L8
        responsibility: strictness
        statement: >-
          (Section B19793.) The raw system on |V| columns splits over F_r into k
          eigenblocks of dimension |V|/k, one per zeta in mu_k, because e =
          ord_k(r) = 1 when k | r - 1. The equations on the true logarithms see
          only the lambda-block (L5). The single-lambda-eigenblock system IS the
          orbit-quotient system: same dimension |V|/k, same rows. It is the same
          reduction by k in dimension, not a second one, and the other k - 1
          blocks need not be formed at all.
      - id: L9
        responsibility: correctness
        statement: >-
          (Census.) For n prime with d = ord_n(2), Phi_n splits over F_2 into f = (n
          - 1)/d irreducible factors of degree d. The divisors of X^n - 1 = (X + 1)
          Phi_n are the products of subsets of those factors, with or without X + 1.
          So the stable dimensions are {j d, j d + 1 : 0 <= j <= f}, and there are
          2^(1 + f) stable subspaces. Usable dimensions exist if and only if f >= 2,
          that is d < n - 1.

