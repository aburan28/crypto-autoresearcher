  structural_certificate:
    authored_once_here: >-
      DEC-20260924-99ce20 C3 and DEP-3. This is the single authoring of the
      deployed ord_n(2) census and stable-dimension sets under RQ-BINSTD-b6f698.
      IDEA-20260922-c48e7d and any other record cite this block, and do not
      re-derive it. DESIGN FIGURES by hand arithmetic. The block becomes a
      checked certificate only when Part 1 of an approved run reproduces it and
      the lane-B review (J5) agrees.
    method: >-
      For each n, factor n - 1. Take the candidate order d, confirm 2^d = 1 mod
      n, and confirm 2^(d/p) != 1 mod n for every prime p dividing d. Every power
      is written out. The quadratic character of 2 (2 is a residue iff n = 1 or 7
      mod 8) is used only as a cross-check.
