# Implementation manifest for EXP-BINSTD-178742 typed/ tree.
# Packaging card: TASK-20260930-d007a4 under DEC-20260930-70bff3
# (BATCH-8c7af6, GOAL-ECDLP2M-001). Contract approved by DEC-20260930-735b4d.
#
# scientific_execution_authorized: false
# packaging_only: true
# maximum_runs: 0
# runs_launched: 0
# Opening/implementing is not a solve claim.

manifest:
  schema: crypto.autoresearch.implementation_manifest.v1
  experiment_id: EXP-BINSTD-178742
  hypothesis_id: H-BINSTD-ce4f38
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-8c7af6
  packaging_batch: BATCH-8c7af6
  packaging_task: TASK-20260930-d007a4
  authorization_decision: DEC-20260930-70bff3
  approval_decision: DEC-20260930-735b4d
  implementation_tree: experiments/EXP-BINSTD-178742/implementation/typed/
  successor_contract_sha256: e841c33a30a4c8eaf1dc80f2199ec8dc34343bdb5d5e4ce38f918f055485d19f
  specification: experiments/EXP-BINSTD-178742/specification.yaml
  scientific_execution_authorized: false
  runs_launched: 0
  maximum_runs: 0
  packaging_only: true

  entry_point:
    command_prefix: python3 -I experiments/EXP-BINSTD-178742/implementation/typed/run.py
    default_mode: --packaging-check
    run_mode: >-
      --run loads trial-plan and REFUSES while scientific_execution_authorized
      is false or packaging_only is true (exit 2 REFUSED_AUTH). Does not mint
      RUN-*, does not score Part 1/Part 2.
    sys_path_rule: >-
      run.py inserts the absolute typed/ path at sys.path[0] after importing
      only sys and os (corrective.custody.run_entry_sys_path).

  modules:
    - path: run.py
      role: entry_point
      dependencies: Python standard library only; local typed modules
    - path: import_audit.py
      role: AST_import_and_execution_audit
      dependencies: Python standard library only
    - path: gf2n.py
      role: binary_field_schoolbook_helpers
      dependencies: Python standard library only
      pattern_source: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (schoolbook; numpy omitted)
    - path: part1_surface.py
      role: part1_future_stage_surface
      dependencies: Python standard library only
      note: Packaging dry probes on toy n only; deployed census not scored
    - path: part2_surface.py
      role: part2_future_stage_surface
      dependencies: Python standard library only
      note: Declares future rank-readout stage; does not execute
    - path: trial-plan.json
      role: custody_trial_plan
    - path: manifest.yaml
      role: implementation_manifest

  third_party_distributions: []

  excluded_for_verdicts:
    - sympy
    - numpy
    - cypari2

  import_rule: stdlib_or_typed_local_only
  amazon_bedrock: not selected, not configured, not probed, not contacted, not used

  holds_carried:
    - HOLD-B
    - HOLD-C
    - HOLD-M

  inference:
    requested_policy: executor-implementation
    packaging_task: TASK-20260930-d007a4
    note: >-
      Packaging producer only. Scientific Part 1/Part 2 launch requires a later
      ranked decision setting scientific_execution_authorized and clearing
      packaging_only. This card asserts nothing about any curve's security.

  launch_fields_deferred_to_authorized_scientific_run:
    - dirty_summary
    - launch_commit
    - live Part 1 census scoring
    - live Part 2 rank readout
    - admission_receipt.json under experiments/.../runs/RUN-*
