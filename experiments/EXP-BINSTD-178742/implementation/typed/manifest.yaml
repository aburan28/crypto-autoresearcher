# Contract approved by DEC-20260930-735b4d.
#
# scientific_execution_authorized: true
# packaging_only: false
# maximum_runs: 4
# runs_launched: 0
# Opening/implementing/scoring-impl is not a solve claim.

manifest:
  schema: crypto.autoresearch.implementation_manifest.v1
  experiment_id: EXP-BINSTD-178742
  hypothesis_id: H-BINSTD-ce4f38
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-075541
  packaging_batch: BATCH-8c7af6
  packaging_task: TASK-20260930-d007a4
  wiring_batch: BATCH-ccfdc6
  wiring_task: TASK-20260930-606126
  scoring_impl_batch: BATCH-075541
  scoring_impl_task: TASK-20260930-8ec263
  scoring_impl_decision: DEC-20260930-780151
  authorization_decision: DEC-20260930-8de5ba
  implementation_authorization_decision: DEC-20260930-70bff3
  approval_decision: DEC-20260930-735b4d
  task_id: TASK-20260930-8ec263
  implementation_tree: experiments/EXP-BINSTD-178742/implementation/typed/
  successor_contract_sha256: ffacf110b050a93f1ee7b8bee132591a14cb96cb280dbafda81bbef2877b234b
  specification: experiments/EXP-BINSTD-178742/specification.yaml
  scientific_execution_authorized: true
  runs_launched: 0
  maximum_runs: 4
  packaging_only: false

  entry_point:
    command_prefix: python3 -I experiments/EXP-BINSTD-178742/implementation/typed/run.py
    default_mode: --packaging-check
    run_mode: >-
      --run enters authorized_dry_gate when scientific_execution_authorized
      is true and packaging_only is false. Add --score-part1 / --score-part2
      / --execute-scoring to enter in-memory scoring stage. Does not mint
      RUN-* or write under experiments/.../runs/ from this entry path.
      REFUSED while unauthorized or packaging_only.
    sys_path_rule: >-
      run.py inserts the absolute typed/ path at sys.path[0] after importing
      only sys and os (corrective.custody.run_entry_sys_path).

  modules:
    - path: run.py
      role: entry_point
      dependencies: Python standard library only; local typed modules
    - path: import_audit.py
      role: AST_import_and_execution_audit
      dependencies: Python standard library only
    - path: gf2n.py
      role: binary_field_schoolbook_helpers
      dependencies: Python standard library only
      pattern_source: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (schoolbook; numpy omitted)
    - path: part1_surface.py
      role: part1_scoring_surface
      dependencies: Python standard library only
      note: >-
        score_part1 computes ord_n(2) census and k|r-1 verdicts when invoked.
        Packaging probes use toys only; deployed census not executed on
        scoring-impl card.
    - path: part2_surface.py
      role: part2_scoring_surface
      dependencies: Python standard library only
      note: >-
        score_part2 declares four bases/controls and returns structured
        scoring shape; curve builds stub with
        not_executed_on_scoring_impl_card unless execute_curve_builds.
    - path: trial-plan.json
      role: custody_trial_plan
    - path: manifest.yaml
      role: implementation_manifest

  scoring_api:
    part1: part1_surface.score_part1
    part2: part2_surface.score_part2
    invoke_part1: >-
      python3 -I experiments/EXP-BINSTD-178742/implementation/typed/run.py
      --run --score-part1
    invoke_part2: >-
      python3 -I experiments/EXP-BINSTD-178742/implementation/typed/run.py
      --run --score-part2
    invoke_both: >-
      python3 -I experiments/EXP-BINSTD-178742/implementation/typed/run.py
      --run --execute-scoring

  third_party_distributions: []

  excluded_for_verdicts:
    - sympy
    - numpy
    - cypari2

  import_rule: stdlib_or_typed_local_only
  amazon_bedrock: not selected, not configured, not probed, not contacted, not used

  holds_carried:
    - HOLD-B
    - HOLD-C
    - HOLD-M

  inference:
    requested_policy: executor-implementation
    scoring_impl_task: TASK-20260930-8ec263
    note: >-
      Scoring-capability producer only. Scientific Part 1/Part 2 census
      launch remains a later /run after scoring-impl snapshot
      TASK-20260930-b2b33a. This card asserts nothing about any curve's
      security.

  launch_fields_deferred_to_authorized_scientific_run:
    - dirty_summary
    - launch_commit
    - artifact persistence under experiments/.../runs/RUN-*
    - admission_receipt.json under experiments/.../runs/RUN-*
    - Part 2 full curve builds (stubbed until dependency amendment)
