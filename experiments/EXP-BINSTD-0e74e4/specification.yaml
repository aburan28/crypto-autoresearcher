    rho_reg; file OPEN cell; measure toy per-trial cost at g≤8
  status: approved
  approved_by: DEC-20261002-584659
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-584659
    composing_decision: DEC-20261002-584659
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0: freeze preregistered naive-bits + rho_reg tables + certificate
      schema + naive-as-DEFINED mutant audit BEFORE any cell is filed.
      Stage 1: recompute (A)/(B)/(C); emit five OPEN reachability cells with
      named missing per-trial cost; never file (B) as DEFINED.
      Stage 2: toy TZV per-trial cost at g∈{2,4,6,8} (dk≤41) + null +
      matched non-T_k controls; optional Gorla–Massierer literature arm
      (O-LIT-GAP if unavailable). No Stage 3. No deployed attack. No AUXIN.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Independently recompute and freeze certificates that the naive
    a77711-Arm-B+(k-1)! charge at the five c2pnb rows yields the
    preregistered bit table and regime ratios, file each reachability
    cell as OPEN with the named missing per-trial cost at arity 10–22,
    and measure toy per-trial decomposition cost growth at g≤8 under
    null and matched non-T_k controls — thereby blocking the false-break
    reading of the naive number, or name a concrete arithmetic /
    instrument / revise outcome.

  class: cost_model_measurement
  class_note: >-
    Primary class is cost-model / portfolio-honesty audit (Part 1
    certificate arithmetic + OPEN filing) with a toy observational
    measurement arm (Part 3 / Stage 2). Carries HEUR-BINSTD-8278db-H0
    (unconditional arithmetic), H1 (imported H2 probability), H2
    (per-trial cost explicitly unassumed). Not an exponent-moving
    experiment and not a break claim.

  scope:
    included:
      - >-
        Stage 0. Freeze stage0/preregistered-naive.json (bits, rho_reg,
        matched_rho_log2, margins) and certificate schema; implement
        arithmetic harness; run naive-as-DEFINED mutant that MUST FAIL.
        ZERO success cells filed as complete in Stage 0.
      - >-
        Stage 1. For each k∈{11,13,17,19,23}: load audited q,k,h,r;
        check r vs q^{k-1} within one bit; recompute
        16*(2-2/g)+log2((k-1)!) and rho_reg=(k-1)/16; emit certificate;
        file reachability cell verdict=OPEN with
        missing_quantity=per_trial_decomposition_cost_arity_g; disclose
        that naive bits are NOT a trusted cost.
      - >-
        Stage 2. On frozen toy cells (dk≤41, g∈{2,4,6,8}): construct TZV
        descended decomposition system; measure wall_s and/or op_count
        per trial; null no-subfield → no-construction; matched non-T_k
        same-arity control; fit growth law with
        extrapolation_distance_to_g_22; optional literature calibration
        against Gorla–Massierer if obtainable without AUXIN (else
        O-LIT-GAP). Partial g completion under instrument wall is allowed
        with O-IMPEDIMENT/O-REVISE-INERT disclosure — never invent costs.
    excluded:
      - Deployed relation search / index-calculus / rho break at m≥131.
      - Filing naive bits as DEFINED trusted attack cost.
      - Magma/Sage/cypari2 provisioning as the success path (AUXIN forbidden).
      - Editing IDEA claim text; editing shared GOAL-ECDLP2M-001.yaml.
      - Amazon Bedrock.
      - Any break or exponent claim from this contract.
      - Treating toy g≤8 as settling deployed g=22 without extrapolation disclosure.

  inputs:
    proposal: ledger/proposals/IDEA-20260922-8278db.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-84fab0.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    curve_audit_readme: analysis/binstd-curve-audit/README.md
    curve_audit_params: analysis/binstd-curve-audit/binary-curve-params.txt
    curve_audit_certificate: analysis/binstd-curve-audit/audit-certificate.txt
    curve_audit_certify: analysis/binstd-curve-audit/subfield_certify.py
    arm_b_source: IDEA-20260906-a77711
    rho_figures_source: IDEA-20260922-d11575
    symmetry_ledger_source: IDEA-20260922-c07598
    arity_gap_source: IDEA-20260807-32f96d
    optional_code_refs:
      - experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
    cells:
      deployed_arm:
        curves:
          - {name: c2pnb176v1, k: 11, g: 10, m: 176}
          - {name: c2pnb208w1, k: 13, g: 12, m: 208}
          - {name: c2pnb272w1, k: 17, g: 16, m: 272}
          - {name: c2pnb304w1, k: 19, g: 18, m: 304}
          - {name: c2pnb368w1, k: 23, g: 22, m: 368}
        q: 65536
        preregistered_naive_bits: [50.6, 58.2, 74.3, 82.7, 100.5]
        preregistered_rho_reg: [0.625, 0.750, 1.000, 1.125, 1.375]
        matched_rho_log2: [77.9, 93.7, 125.5, 141.5, 173.3]
        preregistered_margins_bits: [27.3, 35.5, 51.3, 58.8, 72.8]
        cell_verdict: OPEN
      toy_arm:
        dk_max: 41
        g_values: [2, 4, 6, 8]
        example_cells:
          - {d: 4, k_prime: 3, g: 2}
          - {d: 4, k_prime: 5, g: 4}
          - {d: 4, k_prime: 7, g: 6}
          - {d: 4, k_prime: 9, g: 8}
        null_object: 'no proper subfield definition'
        matched_non_tk: true
        baseline_g2: true
      mutant: 'file naive bits as DEFINED trusted cost without OPEN/regime disclosure'
    seeds:
      master: 20261002
      stage2_trials: [202610024, 202610025]
      stage2_controls: 202610026

  controls:
    - name: ctl_preregistered_naive_freeze
      stage: 0
      blocking: true
      object: >-
        Preregistered naive bits, rho_reg, matched_rho_log2, and margins
        frozen in stage0/preregistered-naive.json BEFORE any Stage-1
        certificate; never edited afterward.
    - name: ctl_naive_as_defined_mutant
      stage: 0
      blocking: true
      object: >-
        Mutant that files (B) as DEFINED without OPEN+(C)+(D) must FAIL
        the Stage-0 audit.
    - name: ctl_r_vs_q_km1
      stage: 1
      blocking: true
      object: >-
        r vs q^{k-1} within one bit on all five rows; failure →
        O-ARITH-REFUTE / baseline check fail for that row.
    - name: ctl_open_verdict
      stage: 1
      blocking: true
      object: >-
        Every Stage-1 cell carries verdict=OPEN and names
        missing_quantity; never DEFINED from (B) alone.
    - name: ctl_null_no_construction
      stage: 2
      blocking: true
      object: >-
        Null no-subfield reports no-construction (not a numeric cost).
    - name: ctl_matched_non_tk
      stage: 2
      blocking: true
      object: >-
        Matched non-T_k same-arity control present for every completed
        TZV g-cell that reports a cost (or explicit O-CONTROL-VOID).
    - name: ctl_extrapolation_disclosure
      stage: 2
      blocking: true
      object: >-
        Any fitted growth law states extrapolation_distance_to_g_22;
        never presents g≤8 as settling deployed g.
    - name: ctl_stdlib_preferred
      blocking: true
      object: >-
        Prefer stdlib / existing audit + DREG/SATIC instruments.
        Magma/Sage/cypari2 may not be provisioned mid-tick (AUXIN
        forbidden). Missing dependency → failed_infrastructure /
        O-IMPEDIMENT — not math falsification.

  independent_variables:
    - curve_name
    - k
    - g
    - stage  # 0 | 1 | 2
    - toy_cell_kind  # tzv | null | matched_non_tk | baseline_g2
    - seed

  metrics:
    primary:
      - naive_bits_match_rate
      - rho_reg_match_rate
      - r_vs_q_km1_agreement_rate
      - open_cell_filing_rate
      - stage0_naive_defined_mutant_caught
      - per_trial_wall_s_vs_g
      - per_trial_op_count_vs_g
      - null_no_construction
      - matched_non_tk_present
      - extrapolation_distance_to_g_22
    secondary:
      - peak_rss_bytes
      - wall_s
      - margin_bits_vs_matched_rho
      - fitted_growth_law_params
      - gorla_massierer_calibration_ratio
      - termination_reason
      - g_cells_completed

  heuristic_under_test: HEUR-BINSTD-8278db-H1

  preregistered_prediction:
    quantity: >-
      Stage 1: naive_bits and rho_reg match preregistered tables within
      tolerance; five cells filed OPEN. Stage 2: per-trial cost measurable
      at g=2 at minimum; null no-construction; growth law (if any) carries
      extrapolation disclosure. Prior expectation (not a success criterion):
      per-trial cost grows fast enough to erase the 27–73-bit naive margin.
    formula: >-
      naive_bits(k) = 16*(2 - 2/(k-1)) + log2((k-1)!);
      rho_reg(k) = (k-1)/16;
      margin(k) = matched_rho_log2(k) - naive_bits(k).
    source: >-
      IDEA-20260922-8278db (A)/(B)/(C); a77711 Arm B / Gaudry q^{2-2/g}
      (recalled primary); matched rho from IDEA-20260922-d11575 /
      IDEA-20260922-c07598 path.
    claim_tier: certificate_plus_toy_observational
    measured_vs_modeled: >-
      Stage-1 arithmetic is MEASURED recomputation against PREREGISTERED
      tables (never tuned). Stage-2 wall/op counts are MEASURED. The naive
      bits table itself is a MODELED placeholder explicitly DISCLAIMED as
      a trusted cost. Fitted growth laws are MODELED with disclosed
      extrapolation.

  scale_relevance:
    tier: crypto
    justification: >-
      Part 1 certificates are at the five deployed ANSI composite-degree
      rows (arithmetic audit, not an attack). Stage 2 controls are toy
      (dk≤41, g≤8) and do not transfer attack cost to deployed g≤22
      without an explicit, large extrapolation disclosure.
    correspondence: null

  tail_checks:
    - >-
      Extreme: k=23 (g=22, rho_reg=1.375) must still file OPEN — never
      DEFINED from the largest naive margin alone.
    - >-
      Extreme toy: if g=2 already exceeds advisory per-cell budget, export
      O-IMPEDIMENT with measured quantity; do not invent higher-g costs.
    - >-
      Mutant: naive-as-DEFINED without OPEN must be caught in Stage 0.

  optimistic_assumptions:
    - assumption: >-
        Pure-Python / existing instruments can construct and attempt
        one trial at g∈{2,4} within advisory budget.
      bias_direction: >-
        May understate wall time at g≥6; budget abort → O-IMPEDIMENT
        with measured CPU, never math falsification of (A)/(B)/(C).
    - assumption: >-
        OpenSSL secondary parameters agree with ANSI X9.62 on h,r for
        these five rows.
      bias_direction: >-
        Primary mismatch → disclose provenance; not treated as (A)
        falsification until adjudicated.
    - assumption: >-
        Matched-rho log2 figures from d11575/c07598 path remain the
        comparison baseline.
      bias_direction: >-
        Symmetry-ledger revision revises margins; Stage 1 must cite the
        source figures used.
    - assumption: >-
        (k-1)! is an adequate stand-in for expected trial count under H2.
      bias_direction: >-
        May under- or over-state true expected trials if attempts are
        correlated; disclosed heuristic, not a bound.

  memory_accounting: >-
    Peak RSS measured. Dominant structures: Stage-1 integer certificates;
    Stage-2 descended polynomial systems / SAT or Groebner working sets
    at g≤8. No deployed-scale factor-base tables. Report peak_rss_bytes
    per completed g-cell.

  hidden_overhead_honesty: >-
    THE ENTIRE POINT. Per-trial decomposition cost at arity 10–22 is the
    dominant hidden term and is named as the OPEN missing quantity rather
    than absorbed into o(1). The (k-1)! placeholder is explicitly flagged
    as possibly a severe underestimate. No attack exponent is claimed.

  replication:
    seeds: [202610024, 202610025, 202610026]
    independent_instances: 2
    independent_instances_note: >-
      Stage 1 certificate emission must be reproducible from the frozen
      harness (two independent process invocations). Stage 2 dual seeds
      on trial timing where stochastic. Primary Stage-1 metrics must agree
      across complete_valid seeds within floating tolerance.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - >-
      SR-1. Stage-0 preregistered-naive freeze missing → stop; status invalid.
    - >-
      SR-2. Naive-as-DEFINED mutant not caught → stop; O-CONTROL-VOID /
      O-INSTRUMENT.
    - >-
      SR-3. Stage-1 bits/rho_reg disagree beyond tolerance → O-ARITH-REFUTE;
      do not retune frozen tables; supersede via new record if needed.
    - >-
      SR-4. Null returns a numeric cost → O-CONTROL-VOID; do not read (D)
      from that session.
    - >-
      SR-5. Advisory budget exhausted → preserve partial artifacts;
      O-IMPEDIMENT with measured quantity; never negative math evidence.
    - >-
      SR-6. Toy growth clearly polylog AND controls hold → may label
      O-REVISE-DEFINED; do not silently promote to a break claim.
    - >-
      SR-7. Instrument wall at modest g with explosive growth → may label
      O-REVISE-INERT with measured obstruction; still not a break claim
      in the other direction.

  invalidation_rules:
    - Editing preregistered-naive.json after Stage-0 freeze.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Filing cell verdict=DEFINED from naive bits without (C)+(D).
    - Claiming break / exponent / deployed attack in run artifacts.
    - Overwriting a prior RUN-* directory.
    - Editing shared GOAL-ECDLP2M-001.yaml or IDEA claim text.
    - Using Amazon Bedrock.
    - Tuning naive/rho_reg predictions after seeing Stage-1/2 outputs.
    - Omitting extrapolation_distance_to_g_22 when reporting a fitted law.
    - Presenting recalled Gaudry/Gorla–Massierer citations as verified support.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze + naive-as-DEFINED mutant caught;
    (2) naive_bits_match_rate=1.0 and rho_reg_match_rate=1.0 and
    r_vs_q_km1_agreement_rate=1.0; (3) open_cell_filing_rate=1.0 with
    named missing quantity on every row; (4) Stage-2 null_no_construction
    and at least g=2 per-trial measurement attempted with
    matched_non_tk_present (or recorded O-IMPEDIMENT that still preserves
    Stage-1 OPEN filing); (5) no invalidation_rule fired. Outcome label
    O-OPEN-CELL (or O-REVISE-* with Stage-1 still OPEN-correct). This
    fills the reachability-table TZV cell honestly; it does NOT claim
    an ECDLP break.

  falsification_criterion: >-
    ANY of: (F1) Stage-1 arithmetic mismatch beyond tolerance
    (O-ARITH-REFUTE); (F2) cell filed DEFINED from (B) alone;
    (F3) null returns a cost while TZV costs were still read
    (O-CONTROL-VOID); (F4) Magma/Sage provisioned as the sole path to
    reported certificates; (F5) break/exponent claimed from this
    contract. Budget exhaustion and O-LIT-GAP are NOT falsification of
    (A)/(B)/(C).

  required_artifacts:
    - experiments/EXP-BINSTD-0e74e4/implementation/
    - experiments/EXP-BINSTD-0e74e4/stage0/preregistered-naive.json
    - experiments/EXP-BINSTD-0e74e4/stage0/mutant-audit.json
    - experiments/EXP-BINSTD-0e74e4/stage0/api-freeze.md
    - experiments/EXP-BINSTD-0e74e4/stage1/certificates/
    - experiments/EXP-BINSTD-0e74e4/stage1/tzv-cells.json
    - experiments/EXP-BINSTD-0e74e4/stage2/per-trial-cost-report.json
    - experiments/EXP-BINSTD-0e74e4/stage2/controls-report.json
    - experiments/EXP-BINSTD-0e74e4/runs/
    - experiments/EXP-BINSTD-0e74e4/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write stage0/preregistered-naive.json and stage0/api-freeze.md;
          define certificate schema; ZERO success cells filed.
      - id: S0-MUTANT
        text: >-
          Run naive-as-DEFINED mutant audit; write mutant-audit.json.
      - id: S1-ARITH
        text: >-
          For each of five curves, recompute (A)/(B)/(C); compare to
          frozen tables within tolerance; record provenance_source.
      - id: S1-CELLS
        text: >-
          Emit five OPEN reachability cells with named missing quantity;
          write certificates/ and tzv-cells.json; never file DEFINED.
      - id: S2-TOY
        text: >-
          For g in {2,4,6,8} (dk≤41): construct TZV system; measure
          per-trial wall/op; dual seeds where stochastic.
      - id: S2-CONTROLS
        text: >-
          Null no-construction; matched non-T_k; write controls-report.json.
      - id: S2-FIT
        text: >-
          Fit growth law if ≥2 g-cells completed; state
          extrapolation_distance_to_g_22; optional O-LIT-GAP/calibration.
      - id: S2-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; observations only;
          no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-6719a2
  snapshot_task: TASK-20261002-0247f7

