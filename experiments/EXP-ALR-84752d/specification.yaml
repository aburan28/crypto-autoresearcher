experiment:
  id: EXP-ALR-84752d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-efb9b3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-efb9b3
  question_id: RQ-ALR-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Swept duplicate-multiplicity profile of ALR target divisors across strided, uniform and opposite-point-rich
    constructions at N up to 256 on three recorded curve families, against birthday and uniform-on-curve
    nulls
  objective: 'The run reduces one uncertainty: how much the deduplication step, which is the only
    operation in the ALR route that shrinks N and therefore the only one that shrinks the nN body,
    actually removes. (i) It generates target divisors under three explicitly defined construction
    families across the three recorded curve families at N from 8 to 256, 200 seeds per cell, and
    records the abscissa multiplicity multiset, the deduplication ratio, the maximum multiplicity
    and the induced chart count for each. (ii) It computes both nulls in the same invocation by the
    same code path: N values drawn uniformly from F_p, which isolates pure birthday collision counting,
    and N points drawn uniformly from the curve, which additionally carries the x-fiber-of-size-two
    effect, so that any residual deviation of a construction family is attributable to construction
    and not to the curve. (iii) It feeds the measured deduplication ratio and chart count back into
    the body formula and reports the multiplicative correction at each recorded seed, so the lane''s
    own size figure gains an error bar. No solve is performed, no candidate factor is emitted, and
    no live target is involved.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for the three recorded curve families,
      at N at most 256, under the three defined construction families, target divisors have the reported
      deduplication ratio and chart-count distributions, these differ from the uniform-on-curve null
      by the reported amounts, and the body correction factor takes the reported values at the recorded
      seeds. What does NOT follow: that deduplication can be extended beyond public duplicates; that
      any construction family could be arranged for a live target; that the correction transfers to
      other N, other curves or generic-prime parameters; that any route is improved; or that any attack,
      speedup or security consequence exists. A construction family that deduplicates well is a statement
      about a construction the experimenter chose, not about the ECDLP.'
  inputs:
    procedure: 'STAGE 0, family definition, one hour, no compute: define strided, uniform and opposite-rich
      constructions precisely, including the opposite fraction and the stride set, and commit them
      before generation. STAGE 1, generation, minutes: for each of 3 curve families times 3 constructions
      times 6 N-values times 200 seeds, generate the target divisor with harness/toycurve.py exact
      arithmetic. STAGE 2, profiling, seconds: compute abscissa multiset, N_dedup, maximum multiplicity,
      chart count per divisor. STAGE 3, nulls, minutes: birthday null on F_p and uniform-on-curve
      null, identical statistics, same invocation. STAGE 4, controls, minutes: stride sweep including
      strides sharing a factor with the group order, and seed-count convergence at 50, 100, 200. STAGE
      5, correction, seconds: evaluate the body correction per recorded seed and apply it to the body
      figure. STAGE 6, tells, seconds: sweep p at fixed N and confirm the uniform family''s deduplication
      ratio approaches one, flagging any flat curve as a generation fault. Total compute a few CPU-minutes.'
    instrument: Python 3 with harness/toycurve.py for exact toy elliptic arithmetic and point generation,
      and harness/runner.py for deterministic seeding, manifests and immutable run records. Multiset
      statistics with collections.Counter over exact integers; no floating point except in reporting
      means, and distributions reported in full alongside them. No Sage, no external service, no re-execution
      of imported source artifacts.
    parameters: 'Curve families p98561_j0_q16427_h6_u2_v3, p100129_j1728_q16687_h6_u3_v2, p99527_generic_q14219_h7_u2_v1.
      N in 8, 16, 32, 64, 128, 256. Constructions: strided with stride in 1, 2, 3, 7 and one stride
      sharing a factor with the group order; uniform; opposite-rich with opposite fraction in 0.1,
      0.25, 0.5. 200 seeds per cell, with convergence checked at 50 and 100. Two nulls per cell. Additional
      p sweep at fixed N = 32 over the three curve families plus one small prime near 10^3 for the
      tell.'
  controls:
  - Uniform-on-curve null, same invocation, isolating the x-fiber-of-size-two effect from construction
    structure.
  - Birthday null on F_p, same invocation, isolating pure collision counting so the curve effect itself
    is visible.
  - 'Stride control: sweep stride values including those sharing a factor with the group order and
    those coprime to it, since a stride sharing a factor collapses the divisor for an arithmetic reason.'
  - 'Curve-family control: all three recorded curve families, so any effect can be checked for curve
    dependence.'
  - 'Seed-count convergence check: report statistics at 50, 100 and 200 seeds and confirm they have
    stabilised.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Draw N points uniformly at random from the curve itself, form the multiset
    of their abscissae, and compute the IDENTICAL three statistics by the IDENTICAL code path in the
    same invocation. This null already carries the x-fiber-of-size-two effect, so any residual deviation
    of a construction family is attributable to construction and nothing else. A second, cruder null
    draws N values uniformly from F_p with no curve, giving the pure birthday baseline against which
    the curve effect itself is visible. The signal arms mean something only if they deviate from the
    uniform-on-curve null beyond the reported error; deviation from the F_p null alone is expected
    and proves nothing.'
  independent_variables:
  - curve_family
  - construction_family
  - target_divisor_degree_N
  - stride_or_opposite_fraction
  - arm_signal_or_null
  metrics:
    primary:
    - deduplication_ratio_distribution
    - chart_count_fraction_two
    - maximum_multiplicity_distribution
    - corrected_body_factor_per_recorded_seed
    secondary:
    - birthday_null_deduplication_ratio
    - uniform_on_curve_null_deduplication_ratio
    - seed_count_convergence_residual
    - N_at_saturation_of_maximum_multiplicity
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The deduplication ratio N_dedup over N and the fraction of divisors requiring two charts,
      per construction family and N, against the uniform-on-curve null.
    formula: 'Birthday null on F_p: expected distinct abscissae equal p times (1 minus (1 minus 1/p)^N),
      so the deduplication ratio is approximately 1 minus (N-1)/(2p) for N much smaller than p. Uniform-on-curve
      null: abscissae are drawn from the roughly p/2 distinct x-values carrying curve points, so the
      expected ratio is approximately 1 minus (N-1)/p, a factor two more collision than the F_p null.
      Predicted opposite-rich family with fraction f: chart count two with probability at least 1
      minus (1-f)^(N/2), exceeding 0.9 for f = 0.1 and N at least 64. Predicted uniform family: indistinguishable
      from the uniform-on-curve null.'
    source: Pre-registered in the parent proposal IDEA-20260816-efb9b3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Three recorded toy curve families over primes near 10^5, N at most 256, plus one
      prime near 10^3 for the characteristic tell. These are the parameters at which the ALR evidence
      records were produced, so the measurement is commensurable with them. The transfer assumption,
      stated: the birthday scaling is asymptotic in p and is expected to describe larger fields, but
      no deduplication ratio at generic-prime parameters is claimed, and the construction families
      are experimenter-defined and would not be available for a live target at any scale.'
    correspondence: null
  tail_checks:
  - Report the full deduplication-ratio distribution per cell rather than its mean, since a mean near
    the null with a heavy tail would mean some divisors deduplicate strongly and that tail is the
    operationally interesting part.
  - Inspect the maximum-multiplicity histogram for any value above two, which is impossible under
    the x-fiber assumption and therefore identifies a generation fault immediately.
  - Check the smallest-p cell for saturation, where every construction collides and the profile stops
    discriminating.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at 200 seeds per cell once the convergence residual at 100 and 200 seeds agrees within the
    reported tolerance.
  - Abort and report a fault if any maximum multiplicity exceeds two.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All cells generate with maximum multiplicity at most two, statistics converge
    by 200 seeds, both nulls are computed by the same code path in the same invocation, and deduplication-ratio
    and chart-count distributions are emitted per cell alongside both null columns and the per-recorded-seed
    body correction.
  falsification_criterion:
  - All three construction families are statistically indistinguishable from the uniform-on-curve
    null at every N.
  - Any maximum multiplicity exceeds two.
  - The uniform family's deduplication ratio does not approach one as p grows at fixed N.
  - Statistics have not converged at 200 seeds.
  - The recorded seeds cannot be regenerated, so the body correction column cannot be produced without
    invention.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-efb9b3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether the recorded seeds from EXP-ALR-001 and EXP-ALR-002 can be regenerated in this environment
    is unverified, and if they cannot, a Coordinator must decide whether the sweep is worth approving
    without the recorded-seed correction column.
  - The precise R181 chart convention that maps a multiplicity multiset to a chart count must be confirmed
    from committed artifacts rather than assumed to be maximum-multiplicity thresholding.
  - The tolerance for declaring a construction family indistinguishable from the uniform-on-curve
    null must be fixed before the run.
