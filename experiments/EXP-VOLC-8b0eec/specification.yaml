experiment:
  id: EXP-VOLC-8b0eec
  hypothesis_id: H-VOLC-707f6c
  derived_from_idea: IDEA-20260821-ad7c97
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Seven-arm attribution of the committed p=4001 within-class over-dispersion -
    class identification, Lenstra 66/72 split, cell-conditioned and
    sampler-free variance ratios, a CH1/CH2 collinearity-breaking arm, a matched
    negation-symmetric null, a planted-shift positive control, and the p=6007
    nearby-object control
  objective: >-
    The one uncertainty a run reduces is whether the within-class over-dispersion
    of decomp_rate_m2/m3 that EV-ENDO-10109d records as the campaign's most
    important open question is a property of the CURVE or of the PAIR
    (curve, sampler-reachable subgroup). A run establishes (i) whether the
    committed 138-curve p = 4001, t = 30 census reproduces the level
    cardinalities (3, 9, 18, 36, 72) predicted by the D_0 = -59, f = 16
    identification; (ii) whether the exhaustively computed group exponent agrees
    with two_torsion_x_count on all 138 curves, which is what makes the
    already-withdrawn 66/72 split the ell = 2 floor indicator; (iii) whether the
    committed variance ratios 1.416 and 2.298 reproduce bit-for-bit from the
    committed raw-result.json, which is an instrument-integrity gate and not a
    result; (iv) whether conditioning on the split and, separately, removing the
    sampler by scoring the exact functional |3V(E)|/#E, drives those ratios to
    their null; (v) whether the residual, if any, survives a matched synthetic
    null of negation-symmetric subsets; and (vi) which of the three named
    channels CH1, CH2, CH3 carries the effect, since CH1 and CH2 are collinear
    by construction and only the factor-base-equalising arm can separate them.
    No discrete logarithm is solved, no attack is mounted, and no ECDLP claim in
    either direction follows from any outcome.
  what_this_is_not:
    - >-
      Not an attack, key recovery, relation collection, or cost-model
      improvement. sota_delta is zero on every axis in every branch.
    - >-
      Not a re-assertion of the 66/72 split as a novel isogeny-class finding.
      EV-ICINV-343679's withdrawal is ACCEPTED; this contract asks a different
      question - what that already-known quantity is the hypothesis of.
    - >-
      Not a level-resolved claim. Four of the five volcano levels collide in the
      observable, so only a two-cell statement is supportable.
    - >-
      Not a statement about cryptographic-scale curves. p = 4001 is 12 bits.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No
      run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - on the committed p = 4001, t = 30 census at
      factor base FB_M3 = 13 with N_TARGETS = 400 and the post-fix
      targets_uniform sampler, the measured within-class variance of
      decomp_rate_m3 either is or is not accounted for by a two-cell mixture
      indexed by rational 2-torsion, with the sampler-free functional |3V|/#E as
      the arbiter. WHAT DOES NOT FOLLOW - nothing about ECDLP hardness, nothing
      about cryptographic-scale curves, nothing about classes with a different
      2-adic conductor structure, nothing about other functionals or other
      arities, and nothing about the T1 transport question itself. Because
      #E(F_p) = 3972 is not prime, the decomposition functional is not the
      attack quantity it is named after, and every reading is bounded by that.
  inputs:
    procedure: >-
      ARM 0 (zero compute, HARD GATE) - re-derive symbolically D = t^2 - 4p,
      D_0, f, h(-59), the Kronecker symbol (-59/2), the level cardinalities,
      pi = 7 + 16*omega, N(pi - 1), and the condition "(pi - 1)/2 lies in O_c
      iff c divides 8". HALT the whole experiment if 3+9+18+36+72 does not equal
      138. ARM 1 (minutes) - for each of the 138 curves enumerate E(F_p)
      exactly (3972 points), record the group exponent and (n_1, n_2), and
      cross-tabulate against two_torsion_x_count computed BOTH field-wide and
      windowed. ARM 2 (HARD GATE) - reproduce the committed variance ratios
      1.416 and 2.298 bit-for-bit from RUN-ICINV-p4001-degenfix's committed
      raw-result.json via harness/exp_icinv.py::binomial_null_verdict on the
      committed hit vectors; a mismatch halts and is reported as an
      instrument-integrity finding, never as a mathematical result. ARM 3 -
      recompute the pooled ratio and both cell-conditioned ratios for
      decomp_rate_m2 and m3 at the frozen factor base, each with its own
      confidence interval. ARM 4 (sampler-free) - compute |2V(E)| and |3V(E)|
      for all 138 curves with the existing sumset_m2/sumset_m3 and the
      within-class variance ratio of |3V|/#E, pooled and per cell. ARM 5
      (channel separation) - repeat ARM 3 with every 2-torsion x-value excluded
      from every curve's factor base, equalising |+-F_V| and switching CH1 off.
      ARM 6 (matched null and nearby objects) - the synthetic null below, plus
      the full ARM 0-4 sequence on the p = 6007 class and on one prime-order toy
      class. ARM 7 (heuristic validation) - the HEUR-001 and HEUR-002 validation
      plans below.
    instrument: >-
      Existing committed harness modules - harness/exp_icinv.py
      (targets_uniform, binomial_null_verdict) and harness/run_blocknull.py
      (sumset_m2, sumset_m3) - plus exhaustive point enumeration and Hilbert
      class polynomial root-finding mod p. No new sum-set code is written. EVERY
      arm records the exact source blob hash of every harness module used, per
      the source-reproducibility gap recorded in CORR-20260810-676b0d (three
      untracked exp_icinv_geometry.py versions across five runs). Recorded
      through harness/runner.py.
    parameters: >-
      Census - the committed p = 4001, t = 30 class of 138 curves. Factor base -
      FB_M3 = 13 with an IDENTICAL x-value set V for every curve, so no
      per-curve factor-base freedom exists. N_TARGETS = 400. Reproduction target
      - RUN-ICINV-p4001-degenfix ONLY; RUN-ICINV-p4001-a is forbidden by
      CORR-20260807-a05e1e and RUN-ICINV-p4001-uniform used the pre-fix sampler.
      Density sweep - 0.024 to 0.97 as in the committed sweep. Synthetic null -
      138 objects per replicate for the matched-null arm and 10^4 draws per
      density for HEUR-001 validation, negation-symmetric subsets of Z/3972 at
      the observed per-curve sizes, with exactly 66 scored only on a fixed
      index-2 subgroup. Planted positive control - a 5 percent synthetic shift
      on the 66-curve cell. Nearby objects - the p = 6007 class and one
      prime-order toy class.
  controls:
    - >-
      NULL OBJECT (mandatory, docs/inventor-protocol.md section 3) - 138
      uniformly random negation-symmetric subsets of Z/3972 at the observed
      per-curve sizes, 66 of them scored on a fixed index-2 subgroup, pushed
      through the IDENTICAL statistic in the same invocation as the signal arm.
      If this reproduces the pooled ratio, no curve-theoretic content survives.
    - >-
      POSITIVE CONTROL (GOAL-ENDO-001 C4, RQ-INSTR-f8faa0) - plant a synthetic
      level-dependent shift of 5 percent on the 66-curve cell and confirm the
      cell-conditioned instrument recovers it. A NEGATIVE MAY NOT BE RECORDED
      from an instrument that fails this.
    - >-
      DECAY CONTROL - sweep the factor-base window W. A saturation artifact must
      decay as the sum-set fills. The committed sweep reports monotonic_decay
      False, so this control must be re-run UNDER CELL CONDITIONING and its
      outcome reported either way.
    - >-
      IDENTICAL FACTOR BASE - the same x-value set V for every curve, so a
      per-curve factor-base choice cannot manufacture between-curve variance.
    - >-
      NEARBY-OBJECT CONTROL - the p = 6007 class, whose D, D_0 and conductor are
      derived FIRST. If 2 splits or ramifies there, or its conductor is odd at
      2, the dichotomy cannot occur and the identical instrument must report NO
      cell structure; reporting one anyway voids the mechanism.
    - >-
      SECOND NEARBY OBJECT - a prime-order toy class where every group is cyclic
      and CH2 is identically absent, so any over-dispersion must be attributable
      to CH1 and CH3 alone.
    - >-
      COLLINEARITY-BREAKING ARM (ARM 5) - CH1 and CH2 are exact functions of the
      SAME 66/72 split, so a cell-conditioned reduction alone CANNOT attribute
      the effect to either. ARM 5 equalises |+-F_V| while leaving the subgroup
      index untouched. Without it the experiment can detect the mixture but
      cannot name the channel, and any channel claim made without it is
      unsupported.
    - >-
      SOURCE PINNING - every arm records the exact source blob hash of the
      harness modules used.
  independent_variables:
    - >-
      two_torsion cell - the 66-curve non-cyclic cell versus the 72-curve floor
      cell
    - volcano level f_E in {1, 2, 4, 8, 16}, where separately resolvable
    - >-
      scoring mode - sampled decomp_rate via targets_uniform versus the exact
      sampler-free functional |3V|/#E
    - >-
      factor-base construction - with versus without 2-torsion x-values (CH1 on
      versus off)
    - factor-base window W and density, over the committed 0.024 to 0.97 sweep
    - object class - p = 4001, p = 6007, prime-order toy class, synthetic null
  metrics:
    primary:
      - >-
        level_cardinality_vector - the multiset of curve counts per f_E
        (unitless counts), computed from roots of the Hilbert class polynomials
        H_{-59 f_E^2} mod 4001
      - >-
        group_structure_agreement - count of curves (of 138, unitless) on which
        the exhaustively computed group exponent equals 1986 exactly when
        two_torsion_x_count = 3 and 3972 exactly when it equals 1
      - >-
        cell_conditioned_variance_ratio - the within-cell variance of
        decomp_rate_m2 and m3 divided by the NULL-B binomial variance
        (unitless), computed separately in each cell with a confidence interval
      - >-
        samplerfree_variance_ratio - within-class variance of |3V(E)|/#E divided
        by its matched null variance (unitless), computed from
        harness/run_blocknull.py::sumset_m3 with no targets and no sampling
      - >-
        matched_null_variance_ratio - the same statistic on the 138 synthetic
        negation-symmetric subsets (unitless), with its Monte-Carlo interval
      - >-
        positive_control_recovery - measured size of the recovered planted cell
        shift (percent) against the planted 5 percent
    secondary:
      - >-
        committed_ratio_reproduction - the recomputed pooled ratios against the
        committed 1.416 and 2.298 (unitless), as an integrity gate
      - >-
        parity_split_and_imbalance - (B_0, B_1) and d = (B_0 - B_1)/2 per curve
        (unitless counts) on the 66-curve cell
      - >-
        parity_imbalance_kurtosis - excess kurtosis (unitless) of the residual
        decomp_rate_m3 per cell after removing the cell mean
      - >-
        ch1_equalised_variance_ratio - the ARM 5 pooled and cell ratios with
        2-torsion x-values excluded (unitless)
      - >-
        two_torsion_x_count_windowed versus field-wide, per curve (unitless
        counts), reported separately and never conflated
      - >-
        nearby_object_cell_structure - whether a cell structure is detected at
        p = 6007 and on the prime-order class (boolean per class)
      - >-
        decay_sweep_monotonicity - boolean monotonic_decay under cell
        conditioning across the density sweep
      - >-
        level_assignment_disagreement - count of curves where the Hilbert class
        polynomial level assignment disagrees with the group-structure
        assignment on the 2-part
      - >-
        source_blob_hashes - the exact hash of every harness module used, per arm
  heuristic_under_test:
    - id: HEUR-001
      formal_statement: >-
        SUM-SET POISSONISATION. For a negation-symmetric subset S of an abelian
        group A of order n with |S| = 2B, the representation counts r_3(R) over
        R in A behave like independent Poisson variables of mean
        lambda = |S|^3/(6n), so |3S|/n concentrates at 1 - exp(-lambda) with
        fluctuation of relative order (n*lambda)^{-1/2}.
      preregistered_prediction: >-
        The measured variance of |3S|/n on uniformly random negation-symmetric
        subsets follows (n*lambda)^{-1} scaling within a factor of 2 across
        every density from 0.024 to 0.97, and the empirical CDF of |3S| matches
        the Poisson-occupancy law.
      prediction_source: >-
        Poisson approximation to the classical occupancy problem, RECALLED not
        retrieved, combined with the exact first moment sum_R r_3(R) = |S|^3 and
        the additive-energy second moment derived internally in
        IDEA-20260821-ad7c97. No external source was opened.
      scale_access_and_transfer: >-
        NONE REQUIRED. The null is drawn at exactly the parameters of the real
        arm - subsets of Z/3972 at the observed per-curve sizes - and is never
        extrapolated to another group or another size.
      sample_size_justification: >-
        10^4 draws per density. The smallest probability to be resolved is the
        1/10^4 tail quantile used in the tail check below, so the expected count
        in the resolved tail is 1 at the extreme and grows rapidly inward; 10^4
        gives a relative standard error on the variance of roughly 1.4 percent,
        an order of magnitude inside the factor-of-2 falsification threshold.
      comparison_metric: >-
        Empirical variance of |3S|/n against the Poisson-occupancy prediction,
        and empirical CDF of |3S| against the predicted law, per density.
      tail_checks:
        - >-
          The smallest and largest observed |3S| against the predicted 1/10^4
          quantiles at each density.
        - >-
          The deterministic excess in r_2(O) from negation symmetry, measured
          and reported, since the heuristic's stated gap is that this excess is
          O(|S|) and does not disturb the leading concentration.
      falsification_condition: >-
        Measured variance of |3S|/n departs from (n*lambda)^{-1} scaling by more
        than a factor of 2 at any tested density.
    - id: HEUR-002
      formal_statement: >-
        PARITY-IMBALANCE MODEL. For a curve with E(F_p) isomorphic to
        Z/2 x Z/1986 and sampler-reachable subgroup H_E of index 2, the split
        (B_0, B_1) of the negated factor base across E(F_p)/H_E behaves like a
        Binomial(|+-F_V|, 1/2) draw, so d = (B_0 - B_1)/2 has mean 0 and
        standard deviation sqrt(|+-F_V|)/2.
      preregistered_prediction: >-
        Over the 66 non-cyclic curves, the variance of d equals |+-F_V|/4 within
        a factor of 1.5 and its mean is within 2 standard errors of zero.
      prediction_source: >-
        Weil-type character sum bound with error O(sqrt(p) log p), RECALLED and
        already cited in harness/exp_icinv.py's own liftable_density docstring.
        Not independently retrieved in this program.
      scale_access_and_transfer: >-
        NONE REQUIRED. The computation is EXHAUSTIVE over all 66 curves, not
        sampled, so the comparison is against the binomial law directly with no
        transfer assumption.
      sample_size_justification: >-
        n = 66 is the entire population, so no sampling error enters the
        observed d values; the estimator noise is entirely in comparing 66
        exhaustive values against a law, which the chi-square test accounts for.
        This is also why the cell-conditioned variance ratios need their own
        confidence intervals - n = 66 is small for a variance-ratio estimator.
      comparison_metric: >-
        Chi-square goodness of fit of the observed d against a centred
        Binomial(|+-F_V|, 1/2).
      tail_checks:
        - The maximum |d| observed against the binomial's 1/66 quantile.
      falsification_condition: >-
        Variance of d differs from |+-F_V|/4 by more than a factor of 1.5, or
        the mean exceeds 2 standard errors from zero.
  preregistered_prediction:
    quantity: >-
      level_cardinality_vector, group_structure_agreement,
      cell_conditioned_variance_ratio for decomp_rate_m3, and
      samplerfree_variance_ratio.
    formula: >-
      Predicted level_cardinality_vector = (3, 9, 18, 36, 72) summing to 138;
      group_structure_agreement = 138 of 138 with zero tolerance; both
      cell_conditioned_variance_ratio values at most 1.5 against the committed
      pooled 2.298 (a reduction of at least 35 percent), with a reduction below
      20 percent counting as NOT supporting the mixture;
      samplerfree_variance_ratio at most 1.3. Under the null that the mixture
      explanation is wrong, the cell-conditioned ratios stay near the pooled
      2.298 and the sampler-free ratio stays inside the committed [1.3, 3.6]
      band at full magnitude.
    source: >-
      Pre-registered in IDEA-20260821-ad7c97's `predictions` block and restated
      in H-VOLC-707f6c before any run under this contract exists. The committed
      comparison values 1.416 and 2.298 come from EV-ENDO-10109d. Never tuned to
      data.
  scale_relevance:
    tier: toy
    justification: >-
      p = 4001 is 12 bits and #E(F_p) = 3972 is composite. The design is
      deliberately confined to the class the campaign already measured, because
      the object under explanation IS a committed measurement on that class -
      there is nothing to transfer and no transfer is offered. The two
      nearby-object controls (p = 6007, one prime-order class) exist to show the
      instrument reports NO cell structure where the arithmetic forbids one,
      which is a falsification device rather than a scale argument.
    correspondence: null
  tail_checks:
    - >-
      Report the confidence interval on each cell-conditioned variance ratio;
      n = 66 and n = 72 are small for a variance-ratio estimator and the
      35-percent reduction threshold must be tested against the interval, not
      against a point estimate.
    - >-
      Report the maximum |d| on the 66-curve cell against the binomial 1/66
      quantile.
    - >-
      Report the extreme |3S| values of the synthetic null against the predicted
      1/10^4 quantiles.
    - >-
      Report the number of curves where the Hilbert class polynomial level
      assignment disagrees with the group-structure assignment on the 2-part; a
      disagreement is itself the finding and is never silently reconciled.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
    - >-
      HALT the entire experiment at ARM 0 if the level cardinalities do not sum
      to 138. Nothing downstream is meaningful and the arithmetic costs nothing.
    - >-
      HALT at ARM 2 if the committed ratios 1.416 and 2.298 do not reproduce
      bit-for-bit; report an instrument-integrity finding, never a mathematical
      result.
    - >-
      STOP all measurement if the planted 5 percent positive control is not
      recovered. Every arm is marked attempted_and_inconclusive and NO negative
      is recorded (GOAL-ENDO-001 P1).
    - >-
      Stop at the frozen arm list. The factor base, N_TARGETS, cell definition
      and reduction thresholds are frozen before any arm runs and are not
      revised after seeing a ratio.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run whose null-object arm or positive control was not executed in the
      SAME invocation as the signal arm is invalid_measurement.
    - >-
      A run citing RUN-ICINV-p4001-a decomposition rows is invalid on its face
      (CORR-20260807-a05e1e).
    - >-
      A run that reports a channel attribution without ARM 5 having executed is
      invalid_measurement - CH1 and CH2 are collinear and the attribution was
      not made.
    - >-
      A run that conflates windowed and field-wide two_torsion_x_count is
      invalid_measurement; CH1 is defined on the windowed count only.
    - >-
      A run missing the per-arm source blob hashes is invalid_reproducibility
      (CORR-20260810-676b0d).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    ARM 0 reproduces (3, 9, 18, 36, 72) summing to 138; ARM 1 gives
    group_structure_agreement = 138 of 138; ARM 2 reproduces the committed
    ratios bit-for-bit; the planted 5 percent positive control is recovered;
    both cell_conditioned_variance_ratio values for decomp_rate_m3 are at most
    1.5 with confidence intervals excluding 2.0; samplerfree_variance_ratio is
    at most 1.3; ARM 5 has executed so a channel attribution is available; and
    the matched null does NOT reproduce the pooled over-dispersion (its ratio is
    1.0 +/- 0.1). Both heuristic validation arms report their comparison
    statistics and tail checks. Meeting all of these supports the two-cell
    mixture explanation at toy scope on this class and factor base only.
  falsification_criterion:
    - >-
      level_cardinality_vector is not (3, 9, 18, 36, 72), or does not sum to
      138 - the class identification is false and the record is retracted at
      ARM 0.
    - >-
      group_structure_agreement < 138 - the Lenstra-derived split is false as
      stated and every channel argument built on it falls.
    - >-
      Cell conditioning reduces the ratio by less than 20 percent AND
      samplerfree_variance_ratio is over-dispersed at the same magnitude as the
      sampled one, with the positive control passing - the mixture explanation
      is REFUTED, the residual survives its strongest cheap explanation, and the
      result becomes a positive C2 lead requiring an independent
      review-adversarial session before any record states it.
    - >-
      matched_null_variance_ratio reproduces the pooled over-dispersion at full
      magnitude - the effect is sum-set combinatorics plus the sampler with no
      curve-theoretic content, and the deliverable is an obstruction on the
      statistic rather than on the mathematics.
    - >-
      nearby_object_cell_structure reports a cell structure at p = 6007 where
      the arithmetic forbids the dichotomy - the instrument is detecting
      something other than rational 2-torsion and the mechanism is void.
    - >-
      positive_control_recovery fails - measurement stops and no negative is
      recorded; this is instrument failure, not evidence.
    - >-
      Either heuristic's falsification_condition fires - that heuristic is
      refuted and any conclusion resting on it is withdrawn, independently of
      the other arms.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state,
      resolved model/inference block and environment
    - >-
      raw-result.json carrying every per-curve measurement - group exponent,
      (n_1, n_2), exhaustive point count as its certificate, two_torsion_x_count
      both windowed and field-wide, level assignment f_E with the method used,
      decomp_rate_m2 and m3, |2V|, |3V|, (B_0, B_1) and d - not summaries
    - >-
      the null-object arm's and positive control's measurements, in the same
      file as the signal arm
    - >-
      pooled and per-cell variance ratios against NULL-B with confidence
      intervals, for ARM 3, ARM 4 and ARM 5 separately
    - the matched-null ratio with its Monte-Carlo interval
    - the residual excess kurtosis per cell
    - the decay-sweep outcome under cell conditioning, reported either way
    - the ARM 0 symbolic derivation as an archived note
    - >-
      the ARM 2 reproduction receipt comparing recomputed ratios against the
      committed 1.416 and 2.298
    - the HEUR-001 and HEUR-002 validation outputs with their tail checks
    - >-
      an artifact manifest with the exact source blob hash of every harness
      module used per arm, plus a from-scratch rebuild receipt
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      H-VOLC-707f6c's `proof_search_map` must be audited against KN-TECH-080
      before implementation, in particular the disclosed four-into-one level
      collision in the observable.
    - >-
      The Executor must RE-READ ledger/evidence/EV-ICINV-343679.yaml primary
      record; the parent proposal's session read only a quotation carried in
      GOAL-ENDO-001/goal.yaml and said so.
    - >-
      A positive branch (mixture refuted, residual survives) requires an
      independent review-adversarial session before any record states it
      (GOAL-ENDO-001 P3).
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-ad7c97
    authored_at: '2026-08-25'
    note: >-
      Arms, controls, metrics, thresholds and heuristics are transcribed from
      the parent proposal's `minimal_test`, `predictions`,
      `heuristic_assumptions`, `confounders` and `falsification_conditions`
      blocks rather than re-invented. The committed comparison values 1.416,
      2.298 and the [1.3, 3.6] band are cited to EV-ENDO-10109d and are NOT
      measurements made here. Budget follows the parent's declared
      estimated_cost.compute of "low", raised to 4 CPU-hours to cover the two
      nearby-object classes and the heuristic validation arm. No field is
      invented; gaps are listed below.
  derivation_gaps:
    - >-
      The p = 6007 class's trace, D, D_0 and 2-adic conductor structure are NOT
      derived in the parent proposal. They must be computed at zero compute
      BEFORE approval, because if that class happens to admit the same dichotomy
      it is a replication rather than a nearby-object control and the design
      loses its most important falsification device.
    - >-
      The prime-order toy class is unspecified - no prime, trace or curve is
      named. A Coordinator must fix it before approval so it cannot be chosen
      after seeing results.
    - >-
      The confidence-interval procedure for a variance ratio at n = 66 is not
      specified. Given that the 35-percent reduction threshold is tested against
      the interval, the procedure must be declared before approval or the
      threshold is not decidable.
    - >-
      Whether the committed raw-result.json retains the per-target hit vectors
      needed for the ARM 2 bit-for-bit reproduction is unverified. If it retains
      only summaries, ARM 2 cannot execute as written and the integrity gate
      must be redesigned rather than skipped.
    - >-
      The windowed two_torsion_x_count required by CH1 has never been computed;
      only the field-wide count is committed. Its computation is an internal
      prerequisite stage of this contract and its cost is unmeasured.
