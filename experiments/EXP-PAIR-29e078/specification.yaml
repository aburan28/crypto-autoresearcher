experiment:
  id: EXP-PAIR-29e078
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-e7eb5d
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE SELF-PAIRING INSTRUMENT AND ITS NULL - a pure-Python Miller-loop calculator for the Weil
    and reduced Tate pairings on toy curves, certified in BOTH directions before any lane result is
    believed - it must return a NON-TRIVIAL value on three planted positives (a supersingular curve
    with its textbook distortion map, an ordinary curve with p = 1 mod N, a curve with a known small
    k and two independent points) and EXACTLY 1 on the forced null (ordinary, k > 1, self-pairing),
    with the artifact tell named in advance - a non-trivial self-pairing at k >= 2 is a missing or
    wrong final exponentiation, not a discovery
  status: draft
  objective: "(A) WHY THIS EXISTS. This lane's three closure records (IDEA-20260807-464ff8, IDEA-20260807-30868b,\
    \ IDEA-20260807-b92080) all assert NEGATIVES about pairing values. Under docs/inventor-protocol.md,\
    \ \"controls before belief\", a reported signal is an artifact until the identical measurement\
    \ has been run against a null object of the same shape - and the symmetric requirement for a negative\
    \ is that the instrument must be shown able to produce the corresponding positive. This program\
    \ has NO pairing code - grep for \"Miller\" over harness/ returns nothing, and harness/toycurve.py\
    \ implements the group law and nothing else. Every negative in this lane is currently uninstrumented.\n\
    (B) WHAT THE INSTRUMENT IS. Pure Python, no Sage, following the existing harness conventions.\
    \ Components -\n  (i) F_{p^k} arithmetic by polynomial arithmetic modulo an irreducible\n  polynomial\
    \ found by trial, for small k only (k <= 12 at toy p);\n  (ii) Miller's algorithm computing f_{N,P}\
    \ evaluated at a divisor, with an\n  explicit line-function accumulator;\n  (iii) the Weil pairing\
    \ e_N(P,Q) as a ratio of two Miller values, and the\n  reduced Tate pairing t(P,Q) = f_{N,P}(D_Q)^{(p^k\
    \ - 1)/N};\n  (iv) the divisor-shift handling that a SELF-pairing requires - to evaluate\n  f_{N,P}\
    \ at a divisor equivalent to (P) - (O) one must use\n  (P + R) - (R) for an auxiliary R with support\
    \ disjoint from\n  div(f_{N,P}). R IS NOT A SECOND INDEPENDENT POINT OF G and its use does\n \
    \ not violate the one-point requirement of RQ-PAIR-21313f, but this is\n  exactly where a false\
    \ positive or false negative is most likely to be\n  manufactured, so the instrument must expose\
    \ R and report invariance\n  across it.\n\n(C) THE CERTIFICATION PROTOCOL, WHICH IS THE ACTUAL\
    \ PROPOSAL. Six gates, all of which must pass before any lane record cites a pairing value.\n\
    \  G1 BILINEARITY - e(aP, bQ) = e(P,Q)^{ab} for random a, b, on 100 random\n    triples. Failure\
    \ means the Miller loop is wrong.\n  G2 ALTERNATION - e_N(P,P) = 1 for the Weil pairing, on every\
    \ curve. This\n    is a property of the construction, not of the curve, so it must hold\n    even\
    \ on the planted positives. A Weil self-pairing other than 1 is a\n    pure implementation bug.\n\
    \  G3 PLANTED POSITIVE ONE, SUPERSINGULAR DISTORTION - the curve\n    y^2 = x^3 + x over F_p with\
    \ p = 3 mod 4, with psi(x,y) = (-x, i.y),\n    i^2 = -1 in F_{p^2}. Here e_N(P, psi(P)) MUST be\
    \ a primitive N-th root\n    of unity. This is the textbook distortion map and it is the only\n\
    \    positive control that exercises the modified-pairing code path.\n  G4 PLANTED POSITIVE TWO,\
    \ ORDINARY k = 1 - a curve with p = 1 mod N, where\n    by IDEA-20260807-30868b the reduced Tate\
    \ self-pairing t(P,P) must have\n    exact multiplicative order N in F_p^*. Constructing one is\
    \ easy - search\n    toy p and small trace until N | p - 1, or take a trace-two curve with\n \
    \   #E = p - 1 directly.\n  G5 PLANTED POSITIVE THREE, SMALL k WITH TWO POINTS - an ordinary curve\n\
    \    with k in {2,3,4,6} and a point Q in E(F_{p^k}) outside G; the classical\n    MOV transfer\
    \ must succeed end-to-end, and the recovered logarithm must\n    be independently re-verified\
    \ as [x]P = Q ON THE CURVE, per\n    docs/claims-and-verification.md, never in the field.\n  G6\
    \ FORCED NULL - ordinary curves with k >= 2 - t(P,P) must equal exactly 1\n    for every P of\
    \ order N, and e_N(P, psi(P)) must equal exactly 1 for\n    every available endomorphism psi.\n\
    \n(D) THE NULL AND ITS DECAY PARAMETER, STATED PRECISELY BECAUSE THE SHAPE IS UNUSUAL. The decay\
    \ parameter is the embedding degree k. The PREDICTED shape is a STEP FUNCTION - the fraction of\
    \ points of order N with a non-trivial reduced Tate self-pairing is 1 at k = 1 and 0 at every\
    \ k >= 2, with nothing in between. A gradual decline as k grows is the canonical artifact tell\
    \ of docs/inventor-protocol.md and, in this specific setting, has a specific most-likely cause\
    \ named in advance - an omitted, truncated, or wrongly-exponentiated final exponentiation by (p^k\
    \ - 1)/N, which leaves residues in F_{p^k}^* that are not in mu_N and that look non-trivial while\
    \ carrying no pairing information. The second most likely cause is evaluating f_{N,P} at (P) -\
    \ (O) directly instead of at (P+R) - (R), which divides by zero or silently produces garbage depending\
    \ on the implementation. A THIRD decay parameter is available and should be used - the auxiliary\
    \ point R. The computed value must be EXACTLY invariant across at least 20 independent random\
    \ R; variance across R is a definitive instrument failure and is cheaper to detect than any of\
    \ the above.\n(E) THE TWO OUTCOMES, BOTH DELIVERABLES. If all six gates pass, this lane's negatives\
    \ become citable and the campaign gains a reusable pairing instrument that lanes L3 and L13 can\
    \ also use. If a gate fails, the failure localises the defect - G1/G2 to the Miller loop, G3 to\
    \ the extension-field arithmetic, G4 to the final exponentiation or the divisor shift, G5 to the\
    \ end-to-end transfer, G6 to any of them - and no lane record may cite a pairing value until it\
    \ is repaired. There is no outcome in which the work produces nothing."
  resource_label: audit - consumes no resource. The instrument computes R7 quantities but mounts no
    attack and takes no position on admissibility; it exists to make other records' claims about R7
    checkable.
  admissibility: admissible
  admissibility_argument: An instrument proposal is admissible by construction - it asserts nothing
    about the ECDLP and therefore cannot fall foul of the H-ENDO-001 filter or of KN-FIND-b7e091.
    Recorded explicitly so that the campaign's resource table has no blank cells and so that no downstream
    reader mistakes instrument admissibility for evidence that a pairing attack is admissible.
  reachability_gate: NOT APPLICABLE - the instrument moves between no curves. It does, however, have
    to REACH small-k curves by construction in order to have positive controls at all, and the cost
    of that construction is the honest reachability statement here - a random toy curve will not do,
    a CM construction or an exhaustive small-p search is required, and if that construction cannot
    be completed within budget then G3, G4 and G5 are unavailable and the instrument is certified
    only in the negative direction, which is not enough. That contingency is stated in advance rather
    than discovered.
  inputs:
    procedure: 'STAGE 0 (hours): inspect experiments/EXP-NET-001 and harness/ for reusable machinery;
      reuse beats rewrite. STAGE 1 (day): extension-field layer plus its three validation checks.
      STAGE 2 (day): Miller loop plus G1 and the two-way split validation. STAGE 3 (hours): Weil and
      Tate plus G2 and the mu_N membership test on every emitted value. STAGE 4 (hours, HARD GATE):
      G3 supersingular distortion positive. STAGE 5 (hours, HARD GATE): G4 ordinary k = 1 positive,
      including the divisor-shift invariance sweep over R. STAGE 6 (hours): G5 end-to-end transfer
      with an independently verified certificate. STAGE 7 (hours): G6 forced null and the response
      curve over k. STAGE 8 (hours, HARD GATE): the deliberately broken copy must fail. THE CHEAPEST
      GATE THAT COULD KILL THE WHOLE LINE IS G2 PLUS THE mu_N MEMBERSHIP CHECK - both are one line
      each and both fail loudly on the two most common implementation errors.'
    mechanism: STEP 1 - EXTENSION FIELD LAYER. Represent F_{p^k} as F_p[x]/(f) with f irreducible
      found by random search plus a primitivity check; implement add, multiply, invert (extended Euclid)
      and Frobenius. Validate against known field-order facts - the multiplicative group has order
      p^k - 1, a random element raised to that power is 1, and the number of solutions of x^N = 1
      is gcd(N, p^k - 1). Three checks, all cheap, all decisive. STEP 2 - MILLER LOOP. Double-and-add
      over the binary expansion of N, accumulating line and vertical functions evaluated at the target
      divisor. Validate by G1 (bilinearity) and by the identity f_{N,P}(D) computed two ways - directly,
      and via f_{N,P} = f_{a,P}^b . f_{b,aP} . (line corrections) for a random split N = ab + c. Two
      independent computations agreeing is a much stronger check than either alone. STEP 3 - WEIL
      AND TATE. Weil as a ratio of Miller values with the standard sign convention; Tate with the
      final exponentiation (p^k - 1)/N. Validate G2 (alternation) and the containment of every reduced
      Tate value in mu_N, checked by raising to N and comparing to 1. THE mu_N MEMBERSHIP CHECK IS
      THE SINGLE MOST IMPORTANT LINE IN THE INSTRUMENT - it catches the final exponentiation bug directly,
      and it must be applied to every value the instrument ever emits, including the ones it reports
      as trivial. STEP 4 - DIVISOR SHIFT FOR SELF-PAIRINGS. Implement t(P,P) via (P + R) - (R) with
      R random, reject R whose support meets div(f_{N,P}), and report the value together with the
      list of R used. Emit a per-evaluation invariance flag. STEP 5 - THE SIX GATES of (C), run as
      a suite, with a machine-readable pass/fail record and the exact seeds. STEP 6 - THE RESPONSE
      CURVE. Sample toy curves stratified by k in {1,2,3,4,6,8,12} - which requires deliberately CONSTRUCTING
      small-k curves, since random ones will not have them - and emit the fraction with non-trivial
      self-pairing per k, with exact binomial intervals.
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - supersingular distortion positive (G3)
  - ordinary k = 1 positive (G4)
  - small-k two-point transfer with an on-curve certificate (G5)
  - ordinary k >= 2 forced null (G6)
  - deliberately broken copy with the final exponentiation removed
  - random non-N-torsion point, whose reduced value must lie outside mu_N
  - 20-fold auxiliary-point invariance sweep
  - 'NULL OBJECT (from the proposal): THIS RECORD IS ITSELF A NULL-OBJECT PROPOSAL, so the requirement
    is reflexive and is met by requiring the instrument to be certified in BOTH directions rather
    than one. FORCED NULL - ordinary curves with k >= 2 - self-pairing exactly 1, on 100 percent of
    points, with the value''s membership in mu_N separately verified. MATCHED NULL OF THE SAME SHAPE
    - the same Miller loop evaluated at a random point of E(F_{p^k}) that is NOT in E[N]; the reduced
    value must not lie in mu_N, which proves the mu_N test has resolving power rather than always
    passing. DECAY PARAMETERS, THREE - (i) k, over which the non-trivial fraction must step from 1
    to 0 between k = 1 and k = 2 and stay at 0; (ii) the auxiliary point R, over which every value
    must be exactly invariant; (iii) the number of sampled points per curve, over which the measured
    fraction must concentrate rather than wander. NEGATIVE-CONTROL INSTRUMENT - a DELIBERATELY BROKEN
    copy with the final exponentiation removed. It must FAIL G4''s mu_N check and must produce apparently
    non-trivial self-pairings at k >= 2. If the broken copy passes the suite, the suite does not test
    what it claims to test and the whole instrument is void.'
  independent_variables: []
  metrics:
    primary:
    - per evaluation - the pairing value, its order, its mu_N membership, the auxiliary R used
    - per curve - (p, a, b, t,
    - the response curve - non-trivial fraction per k with exact binomial intervals
    - per gate - pass or fail, with seeds and the exact command
    secondary:
    - broken-copy suite results
    - wall-clock and peak memory per k, to record where toy feasibility ends
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fraction of points of order N with non-trivial reduced Tate self-pairing, as a function
      of k
    formula: A STEP - exactly 1.00 at k = 1 and exactly 0.00 at every k in {2,3,4,6,8,12}, with no
      intermediate value at any k. Any intermediate value at any k is an instrument failure and the
      record pre-commits to diagnosing the final exponentiation first, the divisor shift second, and
      the Miller loop third, in that order.
    source: pre-registered in IDEA-20260807-e7eb5d before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - The final exponentiation. Omitting or mis-computing (p^k - 1)/N is the single most common pairing
    implementation error and it manufactures exactly the false positive this lane is most at risk
    of. The mu_N membership check on every emitted value is the mitigation and it is mandatory.
  - The divisor shift. Evaluating f_{N,P} at (P) - (O) rather than (P + R) - (R) either divides by
    zero or silently returns a value with no pairing meaning. The R-invariance sweep is the mitigation.
  - Curve selection. A "random toy curve" has large k, so a suite run only on random curves exercises
    G6 and nothing else, and would certify an instrument that has never produced a non-trivial value.
    Small-k curves must be constructed deliberately and their construction is part of the instrument.
  - Supersingular versus ordinary confusion. The G3 control is supersingular BY DESIGN; a reader who
    takes its positive result as evidence about ordinary curves has inverted the control's purpose.
    Every report of G3 must carry that sentence.
  - Reusing EXP-NET-001's elliptic-net code without re-certifying it. Elliptic nets compute the same
    pairings by a different recurrence and inherit none of this suite's gates. If reused, the gates
    must be run against it.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: A STEP - exactly 1.00 at k = 1 and exactly 0.00 at every k in {2,3,4,6,8,12},
    with no intermediate value at any k. Any intermediate value at any k is an instrument failure
    and the record pre-commits to diagnosing the final exponentiation first, the divisor shift second,
    and the Miller loop third, in that order.
  falsification_criterion:
  - Any gate failing. The instrument is not certified and no lane record may cite a pairing value
    until it is. This is an infrastructure outcome under AGENTS.md rule 5, never mathematical evidence
    about self-pairings.
  - The deliberately broken copy passing the suite. The suite is decorative and must be redesigned
    before anything is reported.
  - A non-trivial self-pairing appearing at k >= 2 and SURVIVING all three decay parameters and the
    broken-copy comparison. That would refute IDEA-20260807-30868b's argument (C), which is a textbook
    argument, so the record pre-commits to treating it as an instrument failure until an independent
    reimplementation reproduces it - and to escalating it for independent review-breakthrough scrutiny
    if one does.
  - F_{p^k} arithmetic at k = 12 exceeding budget. Infrastructure outcome; the response curve is truncated
    at the largest feasible k and reported as truncated, never as a measurement at the missing k.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
