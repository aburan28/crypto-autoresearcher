# =============================================================================
# EXP-CERTBIN-fad576 -- VERSION 1 (APPROVED by DEC-20261002-08c3f8) frozen
# contract for H-CERTBIN-6e6287: HOLD-X1 theta(m) ladder at the per-target
# cap locus (Stage 0 re-verify of absorbed S1 column + Stage 1 cap-locus
# cells + Stage 2 loop/closure/null measurement + Stage 3 theta fit).
#
# Source: IDEA-20260926-4b65e3 under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
# Stage 0 claims (A)-(C) absorbed into S1 (EXP-BINSTD-a222b4); this
# contract owns Stages 1-3 and re-verifies Stage 0 as a blocking gate.
#
# ZERO RUNS in this design packet. Stages 0-3 authorized for executor
# TASK-20261002-7fc804. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. WDSat/CaDiCaL/msolve declared missing.
# =============================================================================
experiment:
  id: EXP-CERTBIN-fad576
  hypothesis_id: H-CERTBIN-6e6287
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-4b65e3
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-X1: Stage-0 re-verify of the absorbed per-target-cap column plus
    Stages 1-3 theta(m) ladder (cap-locus cells, loop+closure+null,
    exponent fit) at n in {17,19,23,29,31}, m in {2,3,4}
  status: approved
  approved_by: DEC-20261002-08c3f8
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-08c3f8
    composing_decision: DEC-20261002-08c3f8
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 re-verifies the absorbed S1 Stage-0 corrected column and
      (1/2-1/m) line within 0.5 bit (blocking). Stage 1 builds cap-locus
      cells and gates sat_fraction. Stage 2 measures loop, pure-Python
      closure, and same-support null with certificates. Stage 3 fits
      theta(m) and writes RESULTS.md. No Magma/Sage. No AUXIN. No Bedrock.
      No ECC2K-130 solve. No WDSat/CaDiCaL/msolve as success path.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Re-verify the absorbed Stage-0 corrected oracle-budget column; build
    and gate cap-locus cells at n in {17,19,23,29,31}, m in {2,3,4};
    measure loop and pure-Python closure costs with degree profiles and
    same-support null; fit theta(m) against 1/2 - 1/m; deliver exactly
    one O-* label from H-CERTBIN-6e6287.

  class: measurement
  class_note: >-
    Cost-model measurement / heuristic-validation of theta(m) at the
    per-target cap locus (H1 Poisson occupancy; H2 sign-transfer).
    Certificate-first Stage 0 re-verify plus toy-tier ladder. Not an
    exponent-moving breakthrough; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Recompute (A)-(C);
        compare to absorbed S1 Stage-0 figures (EXP-BINSTD-a222b4 /
        H-BINSTD-14f77e) within 0.5 bit; write
        stage0/preregistered-predictions.json and
        stage0/derivations-note.md freezing the column, line, d_cap table,
        sat band, theta_loop tolerance, LEAD falsification threshold.
      - >-
        Stage 1. Cap-locus cells: V={deg<d_cap} on ordinary and Koblitz
        arms; sat_fraction over 200 subgroup targets by exact (m-1)-fold
        loop; one d_cap re-tune; write stage1/*.json.
      - >-
        Stage 2. Per gated cell: (i) loop with op counter; (ii) degree-D
        closure on Weil-descended S_{m+1} (S_4/S_5 NEW); (iii)
        same-support random-bilinear null; 40 targets (20 planted, 20
        random); certificates; write stage2/*.json.
      - >-
        Stage 3. Fit theta per solver per m; degree profiles; RESULTS.md
        with exactly one O-* label; memory (peak RSS, Macaulay shape)
        beside every time figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - WDSat/CaDiCaL/msolve as a required success path (declared missing).
      - Editing IDEA-20260926-4b65e3 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Treating infra failure as mathematical evidence against H1/H2.
      - Running any ECC2K-130 / deployed-scale decomposition cell.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/ or
        experiments/EXP-BINSTD-a222b4/impl/ in place without a documented
        copy/wrapper under this experiment's write_scope.
      - Adjudicating Semaev 2015 (SEMBIN's lane).

  inputs:
    proposal: ledger/proposals/IDEA-20260926-4b65e3.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-6e6287.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    absorbed_s1_hypothesis: ledger/hypotheses/H-BINSTD-14f77e.yaml
    absorbed_s1_experiment: experiments/EXP-BINSTD-a222b4/specification.yaml
    finding_product_law: knowledge/findings/KN-FIND-aa2efc.md
    loop_baseline: ledger/proposals/IDEA-20260904-96c4f3.yaml
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    macaulay_instrument: experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
    closure_instrument: experiments/EXP-CERTBIN-e94b27/impl/closure.py
    oracle_instrument: experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py
    elim_instrument: experiments/EXP-CERTBIN-e94b27/impl/elim.py
    analysis_readme: analysis/binstd-idea-review-20260926/README.md

  controls:
    - name: stage0_reverify_blocking
      description: >-
        Stage 0 must reproduce finding floors and match absorbed S1
        corrected budgets within 0.5 bit before any cell is read.
        Failure → O-ARTIFACT.
    - name: exact_loop_baseline
      description: >-
        (m-1)-fold loop on every cell; theta_loop must read 1 - 1/m within
        0.05; op counter within [0.95, 1.1] of 2^{(m-1)d}/(m-1)!.
    - name: sat_fraction_gate
      description: >-
        Cap-locus sat_fraction in [0.5, 0.75] over 200 targets (one
        d_cap re-tune allowed); cell off band after re-tune is excluded.
    - name: same_support_random_bilinear_null
      description: >-
        KN-FIND-5a8d3e construction on every measured cell; theta_null
        at/above generic MQ; null below curve arm → O-ARTIFACT.
    - name: size_matched_random_subspace
      description: >-
        On two cells, replace V={deg<d_cap} by a size-matched random
        subspace (null object of the same shape).
    - name: ordinary_vs_koblitz
      description: >-
        Matched-n ordinary and Koblitz arms; Koblitz cells with composite
        #E/4 dropped and listed.
    - name: relabelled_Zl_generic
      description: >-
        Random subset base of size 2^{d_cap} on Z/lZ; loop only; algebraic
        oracle has no meaning (the point).
    - name: planted_vs_random_separate
      description: >-
        20 planted and 20 random targets per cell reported separately,
        never pooled (RQ-ICPERF-94c86e discipline).
    - name: certificates
      description: >-
        Every solve and refutation carries a certificate; degree-
        disciplined W_D witnesses per KN-FIND-5a8d3e.
    - name: memory_beside_time
      description: >-
        Peak RSS and Macaulay shape stated beside every time figure in
        RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0_reverify, 1_cells, 2_measure, 3_fit]
    - name: n
      levels: [17, 19, 23, 29, 31]
    - name: m
      levels: [2, 3, 4]
    - name: curve_arm
      levels: [ordinary, koblitz, zl_generic]
    - name: solver
      levels: [loop, closure_python, null_bilinear]
    - name: target_class
      levels: [planted_sat, random]

  metrics:
    primary:
      - name: sat_fraction
        unit: fraction
        definition: Targets with >=1 decomposition found by the exact loop (200-target gate).
      - name: cost_loop
        unit: group_operations
        definition: Instrumental additions plus membership tests per target.
      - name: cost_closure
        unit: column_pass_ops_and_seconds
        definition: Cost to decide each instance (1 in W_D or planted solution recovered) with deciding degree.
      - name: theta
        unit: dimensionless
        definition: Least-squares slope of log2 cost against n at fixed m, per solver, with interval.
      - name: degree_profile
        unit: integer_per_instance
        definition: Least D at which the instance is decided.
    secondary:
      - name: corrected_budget_column
        unit: log2_group_op_equivalents
        definition: Stage-0 recomputed C_max(m) at m in {4,5,6,8,16}.
      - name: theta_null
        unit: dimensionless
        definition: Same fit on the same-support random-bilinear null.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage 1-2 processes.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: termination_reason
        unit: enum
        definition: completed | timeout | crash | sampled_lower_bound per instance.

  heuristic_under_test: H1; H2

  preregistered_prediction:
    quantity: >-
      Stage-0 corrected budgets within 0.5 bit of absorbed S1; Stage-1
      sat_fraction in [0.5, 0.75]; Stage-2/3 theta_loop = 1 - 1/m within
      0.05; theta_closure LEAD vs NEGATIVE against line 1/2 - 1/m with
      degree-profile and null controls as in H-CERTBIN-6e6287.
    formula: >-
      d_cap = ceil((n + log2(m!))/m); mu = B^m / (m! |G|); sat ≈ 1 - e^{-mu};
      theta_loop = 1 - 1/m; LEAD iff CI_95(theta_closure) entirely below
      1/2 - 1/m at m in {3,4} over >=4 n AND degree-profile max constant
      across ladder AND theta_null above the line.
    source: >-
      ledger/proposals/IDEA-20260926-4b65e3.yaml predictions +
      proof_search_map; absorbed S1 Stage-0 figures; frozen before Stage 1
      in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Ladder at n <= 31, m in {2,3,4}. Transfer of theta magnitude to
      n=131 is explicitly NOT claimed; only the sign under H2 is a
      labelled heuristic; deployed budgets are model arithmetic only.
    correspondence: null

  replication:
    seeds: [2026092641]
    independent_instances: 2
    note: >-
      Ordinary and Koblitz arms are independent instances per (n,m) where
      both exist. 200 sat-gate targets and 40 cost targets from the
      recorded seed stream. Curve-search seeds recorded with found curves.
      Top loop cell (n=31,m=4,d=9) may be sampled; any censoring reported
      as a lower bound (O-IMPEDIMENT if it blocks the fit).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 172800
    total_cpu_hours: 48.0
    maximum_memory_gb: 8
    maximum_runs: 12
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json.
    - Stage 1 sat gates pass (or cells excluded and listed), OR O-ARTIFACT stop.
    - Stage 2 complete on gated cells for loop+closure+null, OR named O-ARTIFACT / O-IMPEDIMENT stop with measured quantity.
    - Stage 3 RESULTS.md names exactly one O-* label.
    - maximum_runs = 12.
    - Do not open n>31 or m>4 under this card.

  invalidation_rules:
    - Stage 0 re-verify fail → O-ARTIFACT; do not read cells.
    - theta_loop off 1 - 1/m by >0.05 → O-ARTIFACT.
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock/WDSat used as success path → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence against H1/H2.
    - Pooling planted and random arms → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen and matched; Stages 1-3 produce sat tables,
    cost tables, theta fits, degree profiles, and blocking-control
    results; RESULTS.md names exactly one O-* label from H-CERTBIN-6e6287
    with cited artifacts.

  falsification_criterion: >-
    Any of: Stage 0 mismatch; theta_loop miscalibration; null below curve
    arm; LEAD threshold missed with gates otherwise passing (that is
    O-NEGATIVE, a valid scientific negative); or a claim of
    break/exponent under this card.

  required_artifacts:
    - experiments/EXP-CERTBIN-fad576/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-fad576/stage0/derivations-note.md
    - experiments/EXP-CERTBIN-fad576/stage1/
    - experiments/EXP-CERTBIN-fad576/stage2/
    - experiments/EXP-CERTBIN-fad576/stage3/
    - experiments/EXP-CERTBIN-fad576/RESULTS.md
    - experiments/EXP-CERTBIN-fad576/runs/<RUN-CERTBIN-*>/

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
