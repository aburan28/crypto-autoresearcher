experiment:
  id: EXP-CODESD-4771a1
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8ee18f; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8ee18f
  question_id: RQ-MQOM-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact joint-distribution measurement of repetition-level acceptance indicators in a toy MPC-in-the-head
    shell under four salt-and-root sharing configurations, party counts 2 to 8, repetitions 1 to 4
    and field sizes 2 to 8.
  objective: 'The one uncertainty a run reduces is whether the multiplicative composition of per-repetition
    soundness errors, the step every parameter set in this family depends on, is exact in a shell
    where repetitions share state, or whether sharing leaves a measurable residue. Concretely: (i)
    whether the pairwise covariances of repetition-level acceptance indicators are exactly zero under
    a real challenge derivation when salt and commitment root are shared, measured by enumerating
    the entire joint challenge space so the moments are exact rather than estimated; (ii) whether
    the product deviation D between the joint expectation and the product of marginals is nonzero,
    and how it grows with repetition count, measured at tau equal to 2, 3 and 4 under each of four
    sharing configurations; (iii) whether any measured coupling is attributable to a specific shared
    element and behaves as genuine structure should, measured by the salt-only, root-only and both
    ablation and by requiring the effect to DECAY as challenge entropy per repetition increases, since
    a covariance constant across entropy is the artifact signature named in inventor-protocol section
    3. A run does not reduce uncertainty about any deployed scheme''s composition, since no specification
    has been read and the sharing construction is declared here.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the declared toy
      shell with idealized commitments and a placeholder relation, at the enumerated grid, the exact
      pairwise covariances and product deviations under each sharing configuration were as tabulated,
      with the independent configuration returning exactly zero. What does NOT follow: nothing about
      SDitH, FAEST or MQOM composition or parameter choices; no claim that any deployed scheme shares
      state the way this shell does; no conclusion about the commitment or hash layer, which is idealized
      away; and no extrapolation to repetition counts beyond the enumerated range, where the coupling
      could behave entirely differently.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) freeze the shell, the sharing switch semantics, the corruption
      space definition and the grid in a fixture. STAGE 1 (cost: hours human) implement the shell,
      the indicator extraction and the joint enumerator; verify enumerated joint space sizes against
      closed-form counts. STAGE 2 (cost: minutes compute) run the none-shared null arm; HALT if any
      covariance is nonzero. STAGE 3 (cost: minutes compute) run the synthetic matched-marginal control
      at the sampled-regime sample sizes; HALT if it returns nonzero covariance. STAGE 4 (cost: tens
      of minutes to two core-hours) run the full grid across all four sharing configurations, computing
      exact marginals, covariances, D, and the maxima over corruption strategies. STAGE 5 (cost: minutes)
      run the tau-equal-1 degenerate check, where D must be identically zero from the general code
      path. STAGE 6 (cost: minutes) assemble the covariance-versus-entropy curves on both axes and
      apply the decay-versus-constant artifact test, labelling any constant signal as a suspected
      artifact in the emitted table rather than in prose only. STAGE 7 (cost: minutes) emit all moments,
      ablation attributions and enumerated space sizes as immutable artifacts.'
    instrument: 'Python 3.11 standard library: itertools for joint enumeration, fractions.Fraction
      for exact moments, hashlib for the challenge derivation, random.Random with declared seeds for
      instance and salt generation. numpy 2.4.6 for moment bookkeeping only, never for the exact moments
      themselves. No Sage, no external cryptographic library, no statistics package deciding significance.
      Run through harness/runner.py with immutable run records under an experiments/EXP-* directory.'
    parameters: 'Party count N in {2, 4, 8}; repetitions tau in {1, 2, 3, 4}; field size |F| in {2,
      4, 8}; sharing configuration in {none, salt only, root only, both}; placeholder relation of
      arity 3 over the corresponding field. Corruption space enumerated in full where its size is
      at most 100000 per point; larger points are sampled with 100000 declared-seed draws and reported
      as lower bounds on the maxima. Joint challenge enumeration cap 10000000 per point. Grid: 3 times
      4 times 3 times 4 equals 144 points. Sampled-regime sample size for the synthetic control: 100000,
      matching the corruption sampling.'
  controls:
  - The none-shared arm, where covariance must be exactly zero by construction.
  - A synthetic independent indicator vector with matched marginals, checking the estimator returns
    zero at the sample sizes used in the sampled regime.
  - Sharing-element ablation (salt only, root only, both) so any effect is localized.
  - Entropy sweep on two axes (field size, party count) providing the decay-versus-constant artifact
    test.
  - tau equal to 1, where covariance is undefined and D must be identically zero; the code path must
    produce that rather than special-case it.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The independent arm: the identical shell, identical cheating prover,
    identical enumeration, with independently sampled salt and commitment root per repetition, run
    in the same invocation. There the covariance is zero by construction, so the null must return
    exactly zero for every pair and D must be exactly zero. If it does not, the enumeration or the
    indicator extraction is faulty and no covariance from the sharing arm is admissible. A second
    null uses a random indicator vector of matched marginals with no protocol behind it, checking
    that the covariance estimator returns zero on a synthetic independent vector at the same sample
    sizes used in the sampled regime.'
  independent_variables:
  - party count N
  - repetition count tau
  - field size |F|
  - sharing configuration (none, salt, root, both)
  - corruption strategy within the enumerated space
  metrics:
    primary:
    - exact pairwise covariance Cov(X_i, X_j) per configuration per grid point
    - product deviation D equals E[prod X_i] minus prod E[X_i]
    - maximum of D over corruption strategies
    - covariance in the none-shared null arm, which must be exactly zero
    secondary:
    - exact marginals E[X_i]
    - covariance as a function of challenge entropy per repetition on both axes
    - enumerated joint challenge-space and corruption-space sizes
    - fraction of grid points falling back to sampling
    - wall-clock seconds per grid point
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The maximum over corruption strategies of the relative product deviation, Drel(tau,
      config) = (E[prod X_i] minus prod E[X_i]) divided by prod E[X_i].
    formula: Drel(tau, config) = (E[prod_{i=1..tau} X_i] / prod_{i=1..tau} E[X_i]) minus 1, computed
      exactly over the enumerated joint challenge space at the maximizing corruption. Predicted Drel
      is exactly 0 in the none-shared configuration at every grid point, and at least 0.0001 in the
      both-shared configuration at the smallest field size and party count. Drel identically 0 in
      all configurations falsifies claim (A) at this scale; Drel nonzero in the none-shared arm voids
      the instrument.
    source: Pre-registered in the parent proposal IDEA-20260816-8ee18f before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N up to 8, tau up to 4 and field size up to 8, chosen precisely
      because the joint challenge space stays enumerable so the moments are exact identities rather
      than estimates. Deployed parameters are orders of magnitude beyond on every axis. The transfer
      assumption is stated and deliberately not used: no conclusion is carried to larger tau, and
      the survival score explicitly reports the enumerability ceiling as the ceiling rather than as
      evidence of behaviour above it.'
    correspondence: null
  tail_checks:
  - 'tau equal to 1: D must be identically zero and covariance undefined; the general code path must
    produce this without special-casing.'
  - 'none-shared configuration at every point: all covariances exactly zero.'
  - 'Largest field size and party count: covariance must be at or below the smallest-entropy value;
    a larger value there contradicts the decay expectation and flags an artifact.'
  - 'Points falling back to corruption sampling: verify they are labelled as lower bounds and excluded
    from every exactness claim.'
  - 'Marginals E[X_i]: must agree across repetitions within a configuration where the construction
    is symmetric; asymmetry indicates an indicator-extraction bug.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the none-shared null arm returns nonzero covariance.
  - Halt if the synthetic matched-marginal control returns nonzero covariance.
  - Halt if any enumerated space size disagrees with its closed-form count.
  - Stop and report partial coverage if wall-clock exceeds four core-hours, marking uncompleted grid
    points explicitly.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The none-shared null returns exactly zero covariance and zero D everywhere, the
    synthetic control returns zero at the sampled sample sizes, all enumerated space sizes match their
    closed forms, and the run emits exact covariances, product deviations and their maxima across
    all four sharing configurations with covariance-versus-entropy curves and explicit decay-versus-constant
    labels.
  falsification_criterion:
  - Nonzero covariance in the none-shared arm, voiding the instrument.
  - Nonzero covariance from the synthetic matched-marginal control, showing estimator bias.
  - Drel exactly zero in every configuration at every grid point, so sharing produces no measurable
    coupling at this scale.
  - Covariance constant across the entropy sweep, marking the signal an artifact under inventor-protocol
    section 3.
  - The joint challenge space is not enumerable at the smallest grid point, leaving no exact moment
    anywhere.
  - Negative Drel beyond exactness, indicating a counting error.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8ee18f
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must define exactly what the cheating prover may choose jointly across repetitions
    versus per repetition, since the covariance is measured under that choice and the two readings
    answer different questions.
  - Whether idealized commitments are acceptable, given they may remove the very mechanism the experiment
    exists to detect; a variant with a real hash-based commitment may be the run worth approving instead.
  - The threshold of one part in 10000 for calling D nonzero is declared here and must be approved
    or replaced before freezing.
  - Whether the sharing construction is defensible as a family member at all, absent any specification
    this program can read.
