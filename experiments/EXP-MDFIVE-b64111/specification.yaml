experiment:
  id: EXP-MDFIVE-b64111
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d285e8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d285e8
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate modification depth and chunk separation for MD5, MD4 and 10^5 shape-matched random
    schedules, and report the joint distribution, the rank correlation and MD5's percentile in each
    marginal.
  objective: 'The run reduces one uncertainty: whether the collision-side and preimage-side structural
    preconditions readable from a message schedule are separable properties, and whether MD5 is atypical
    in one and typical in the other. As parts: (i) it fixes and computes two combinatorial statistics
    of the schedule that require no hash evaluation, no path and no solver, so their values are exact
    rather than estimated; (ii) it measures their joint distribution over a shape-matched random family
    large enough to make a 90th-percentile statement stable, producing a rank correlation that either
    supports or destroys the separability premise on which the rest of this bucket''s schedule-oriented
    proposals depend; (iii) it locates MD5 and MD4 inside that distribution, with the reversed-schedule
    and periodic controls bounding how much of any effect comes from the multiset and from regularity
    rather than from MD5''s specific ordering. The run reduces no uncertainty about attack complexity,
    about achievable forcing depth, or about whether an independent-chunk split with a given separation
    can be completed into anything. A negative outcome, meaning high correlation or an unremarkable
    MD5, is fully informative here: it closes the schedule-level reading of the asymmetry with a measured
    number and redirects the bucket to the step function and the mode.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: under the frozen definitions of D
      and S and the declared null family, MD5''s schedule sits at percentile p_D and p_S, and D and
      S have rank correlation r across that family. What does NOT follow: nothing about achievable
      attack cost in either setting, nothing about whether any chunk split can be completed, nothing
      about MD5''s preimage resistance, nothing about design intent, and nothing about any schedule
      family other than the one sampled.'
  inputs:
    procedure: STAGE 0 transcribe MD5's and MD4's schedules twice independently from the specification
      and require exact agreement; cost minutes, mismatch halts. STAGE 1 freeze the definitions of
      D and S in the specification file before any code runs, since both admit reasonable variants
      and post-hoc choice would make the result unfalsifiable; cost is review time. STAGE 2 implement
      the two statistics and validate them on three hand-checkable degenerate schedules with known
      answers; cost minutes. STAGE 3 compute D and S for MD5, MD4, the reversed schedule and the periodic
      control; cost milliseconds. STAGE 4 sample 10^5 null schedules with declared seeds and compute
      both statistics for each, in the same invocation as STAGE 3; cost under a minute. STAGE 5 compute
      the joint distribution, the Spearman rank correlation and the four percentiles. STAGE 6 rerun
      STAGES 4 and 5 with the round-block-preserving null as a secondary arm. STAGE 7 emit the manifest,
      the raw statistic arrays and the percentile table.
    instrument: Python 3.11 standard library for the enumeration, numpy for the distribution summary
      and a rank correlation implemented directly rather than pulled from an unpinned library, so
      the result does not depend on a library version. Run under harness/runner.py for the manifest,
      seeds and wall-clock ceiling. No hash evaluation is required at any stage, so no MD5 implementation
      is on the critical path; hashlib is used only to fingerprint the schedule tables for the manifest.
      No Sage.
    parameters: 'MD5 schedule: 64 slots over 16 words, four uses each. MD4 schedule: 48 slots over
      16 words, three uses each. Null sample size: 10^5 per family, seeds 1..100000 recorded. Secondary
      null preserving round blocks: 10^5. Window enumeration for S: all 2080 contiguous windows of
      MD5 and all 1176 of MD4, with every interior split point. Degenerate validation cases: all-one-word,
      strict round-robin, and the identity-then-repeat schedule.'
  controls:
  - Uniform multiplicity-preserving random schedules, 10^5 samples, in the same invocation.
  - A periodic regular schedule with the same multiplicity, bounding the contribution of regularity
    alone.
  - The reversed MD5 schedule, which preserves all multiset structure but destroys the round-1 identity,
    isolating the contribution of that identity to D.
  - MD4's schedule against its own shape-matched null family, so the instrument is seen to move between
    primitives.
  - A deliberately degenerate schedule where one word fills 64 slots, which must produce D = 1 and
    S = 0 or the implementation is wrong.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a schedule drawn uniformly at random subject to
    each of the 16 words appearing exactly 4 times, and the identical enumeration computes (D, S)
    for it in the same invocation as MD5. The null must show a joint distribution with a stated rank
    correlation and stated marginal percentiles. For the signal arm to mean anything, MD5''s D percentile
    must be high, its S percentile ordinary, and the null rank correlation must be low enough that
    the two coordinates are not simply the same measurement twice. A second null, in which the schedule
    is a fixed periodic pattern with the same multiplicity, bounds how much of the effect is available
    from regularity alone.'
  independent_variables:
  - 'schedule identity: MD5, MD4, reversed, periodic, null sample'
  - 'null family definition: multiplicity-preserving versus round-block-preserving'
  - 'statistic: D versus S'
  metrics:
    primary:
    - D for each schedule
    - S for each schedule
    - Spearman rank correlation of D and S within each null family
    - MD5 percentile in the D marginal
    - MD5 percentile in the S marginal
    secondary:
    - MD4 percentiles within its own null family
    - reversed-schedule and periodic-control percentiles
    - stability of the 90th percentile under a halved sample
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The pair (p_D, p_S) of MD5 percentiles and the rank correlation r between D and S in
      the multiplicity-preserving null.
    formula: 'D(sigma) = max{k : |{sigma(0),...,sigma(k-1)}| = k}. S(sigma) = max over contiguous
      windows [a,b] and split points c in (a,b) of (b-a) subject to the condition that {sigma(a..c-1)}
      omits some element of {sigma(c..b-1)} and vice versa. Predicted: r < 0.3, p_D >= 90, 25 <= p_S
      <= 75.'
    source: Pre-registered in the parent proposal IDEA-20260816-d285e8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: The statistics are computed on the real, full MD5 and MD4 schedules, so there is
      no size extrapolation whatsoever in the signal arm; the toy label refers to the compute cost,
      not to a reduced object. The only modelling extrapolation is the choice of null family, which
      is a stated assumption rather than a scale assumption, and it is addressed by running two different
      null families and reporting both.
    correspondence: null
  tail_checks:
  - Degenerate schedules must return their hand-computed values or the implementation is rejected.
  - The 90th percentile of D must be stable to within one step when the sample is halved.
  - No null sample may exceed the fresh-word upper bound of D = 16 for MD5's shape.
  - The reversed schedule must have the same multiset of word counts as MD5, verified before its statistics
    are used as a control.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the two independent schedule transcriptions disagree.
  - Halt if any degenerate validation case returns an unexpected value.
  - Fix the sample size at 10^5 before the run and do not extend it after seeing the percentiles.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The multiplicity-preserving null shows rank correlation below 0.3 between D and
    S, MD5's D percentile is at or above 90, MD5's S percentile lies between 25 and 75, and all four
    numbers are reproduced exactly from the manifest seeds on an independent rerun.
  falsification_criterion:
  - Rank correlation at or above 0.3 in either null family.
  - MD5 D percentile below 90.
  - MD5 S percentile above 90 or below 10.
  - The reversed-schedule control attains a D percentile within 5 points of MD5's.
  - The two null families give percentiles differing by more than 20 points, in which case the result
    is a property of the null choice and not of MD5.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d285e8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must rule on which null family is primary, since the two can disagree and the
    choice determines the verdict.
  - The definition of S needs a Coordinator sign-off that the omission condition is the intended necessary
    condition rather than a weaker or stronger variant.
  - Whether MD4's percentiles may be compared to MD5's at all, given different multiplicity profiles,
    needs an explicit ruling before the paired-control reading is used anywhere.
