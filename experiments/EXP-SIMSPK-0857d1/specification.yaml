experiment:
  id: EXP-SIMSPK-0857d1
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5c9c46; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5c9c46
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Resolution profiling of the SIMON portfolio on a uniformly drawn null constant family, before
    any standardized constant is scored: distinct-value counts, histogram entropy, tie-group shares
    and the per-measure round-count window in which ranking is licensed'
  objective: 'A run reduces exactly one uncertainty: which portfolio measures are capable of ranking
    constants at all, at which word sizes, and over which round counts, established before any real
    constant is scored so the answer cannot be shaped by the result it gates. Concretely it determines
    (i) whether the resolution estimator itself is trustworthy, bracketed by two calibration measures
    with known answers, a constant measure that must return exactly one distinct value and a pseudorandom
    tag that must return near-maximal entropy, plus a determinism check confirming each portfolio
    measure returns identical values on repeat scoring; (ii) for each portfolio measure and each round
    count, the number of distinct values over the null family, the normalized entropy of the value
    histogram, and the size and share of the largest tie group, reported as curves in round count
    rather than as single numbers; and (iii) the resulting usable window per measure, the maximal
    round-count interval satisfying frozen resolution thresholds, reported at three threshold pairs
    so its dependence on a convention is visible, together with a decomposition of any large-r collapse
    into ceiling saturation and budget censoring. No real constant is scored, no hypothesis is minted,
    and no statement about any cipher is produced.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the portfolio measures actually
      run, at the word sizes and round counts actually swept, with the declared per-cell budgets and
      the frozen thresholds, over a null family of M uniformly drawn constant sets, (a) a calibration
      result establishing that the resolution estimator returns 1 on a constant measure and near-M
      on a maximal one; (b) per-measure distinct-value counts, entropies and tie-group shares as functions
      of round count; (c) a usable window per measure at each threshold pair; and (d) a censoring-versus-saturation
      decomposition of any collapse. What does NOT follow: any statement about any real or standardized
      constant, since none is scored; any statement that a measure is correct, valid or meaningful
      beyond having resolution, which is its own contract''s business; any statement that a measure
      with an empty window is useless or that the direction it represents is closed; any security,
      attack or distinguisher claim; any statement about designer intent; and any transfer of a window
      to a word size, round range or budget not run, since the window depends on all three.'
  inputs:
    procedure: 'STAGE 0, freeze thresholds, M, word sizes, round-count ceilings per measure and the
      draw seed; hash the specification. Zero compute, under an hour human. STAGE 1, dependency check:
      list which portfolio measures have validated contracts and record their identifiers; measures
      without one are still profiled but their results are labelled instrument-conditional. Minutes.
      STAGE 2, draw the null family and pin cipher instances; at n = 8 with M = 512 the family is
      the entire constant space so k is exact. Seconds. STAGE 3, score every measure on every null
      member at every round count to the declared ceiling, recording values, censoring flags and budgets;
      this is the dominant cost and is bounded by the declared budget. STAGE 4, calibration measures,
      block size and pseudorandom tag, through the identical pipeline. Seconds. STAGE 5, determinism
      check on a 10 percent subsample by rescoring under a different draw ordering. Cost is 10 percent
      of STAGE 3. STAGE 6, compute k, entropy, largest tie group and share per measure per round;
      extract windows at three threshold pairs. Milliseconds. STAGE 7, censoring-versus-saturation
      decomposition per measure. Seconds. STAGE 8, publish full histograms alongside summaries so
      windows can be recomputed under other conventions.'
    instrument: CPython 3.11 standard library only; numpy, z3, python-sat and pulp are absent in this
      environment as verified on 2026-08-16 and Sage is excluded by contract. Histogram construction,
      distinct-value counting, Shannon entropy normalized by log M, and tie-group extraction are implemented
      from scratch and cross-checked against hand-computed values on a fixed 16-element fixture stored
      in the run directory. Portfolio measures are invoked as frozen modules from their own contracts
      rather than reimplemented, so this contract contributes only the profiling layer. The pseudorandom
      calibration tag comes from a seeded random.Random distinct from the draw seed, both recorded.
      Manifest, seeding and per-stage timing follow harness/runner.py conventions; identifiers minted
      with tools/allocate_id.py --next.
    parameters: 'Word sizes n = 8 with M = 512, which is the complete constant space so k is exact
      rather than sampled, and n = 16 with M = 2000 uniformly drawn from 4096 triples or from orbit
      representatives if the quotient contract has run, with the choice recorded. Round counts 1 to
      20 at n = 8 and 1 to 24 at n = 16, or to each measure''s own declared ceiling where lower. Portfolio:
      every measure with a validated contract, plus two calibration measures. Frozen threshold pairs
      for the usable window: (k at least 8, largest tie-group share below 0.40) as primary, plus (k
      at least 4, share below 0.60) and (k at least 16, share below 0.25) as the sensitivity pair.
      Determinism check on a 10 percent subsample. Per-cell budgets inherited from each measure''s
      own contract and recorded. Total run ceiling 7200 seconds excluding inherited measure budgets.'
  controls:
  - Degenerate calibration measure, block size, constant across the family, which must return k =
    1 and entropy 0 at every round count.
  - Maximal calibration measure, a seeded pseudorandom tag per constant, which must return k near
    M and normalized entropy near 1.
  - Duplicate-draw determinism check on a 10 percent subsample, confirming each measure returns identical
    values on repeat scoring.
  - 'Censoring attribution: the large-r collapse is decomposed into ceiling saturation and budget
    censoring, since the two are indistinguishable in a bare histogram.'
  - 'Threshold sensitivity: the usable window is recomputed at three declared threshold pairs and
    all three are reported, so the window''s dependence on a convention is visible rather than hidden.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null family IS the object here, which inverts the usual arrangement
    and requires its own controls, since a measurement whose subject is a null needs calibration rather
    than a further null. Two calibration objects with known answers run in the same invocation. First,
    a degenerate measure that is constant by construction across the family, for which the block size
    is used: it must return k = 1, normalized entropy 0, and largest-tie-group share 1.0 at every
    round count, and any deviation means the resolution estimator is fabricating variation. Second,
    a maximal measure, a fresh pseudorandom tag drawn independently per constant from a seeded generator:
    it must return k equal to M up to birthday collisions, normalized entropy near 1, and largest-tie-group
    share near 1/M. These two bracket the estimator and must both pass before any portfolio measure''s
    resolution is reported. A third control, run per measure, is a duplicate-draw check: score the
    same constant twice under different draw orderings and confirm identical values, since a measure
    that is not deterministic would inflate k spuriously.'
  independent_variables:
  - portfolio measure
  - round count r
  - word size n
  - threshold pair for window extraction
  - arm (portfolio measure versus degenerate or maximal calibration measure)
  metrics:
    primary:
    - distinct-value count k per measure per round count, with M stated
    - normalized entropy of the value histogram per measure per round count
    - largest tie-group share per measure per round count
    - usable window [r_lo, r_hi] and width per measure per word size at the primary threshold pair
    secondary:
    - usable window at the two sensitivity threshold pairs
    - censoring rate per measure per round count and the censoring-versus-saturation decomposition
    - calibration results for the degenerate and maximal measures
    - determinism mismatch count, required zero
    - wall-clock seconds and peak resident memory per measure
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The distinct-value count k(m, r) and normalized histogram entropy H(m, r) of each portfolio
      measure m over the uniformly drawn null constant family at each round count r, and the derived
      usable window per measure under the frozen primary threshold pair.
    formula: 'For measure m at round count r, let v_1 through v_M be the values returned on the M
      null members, with censored cells excluded and their count reported. Then k(m,r) is the cardinality
      of the set of distinct v values; H(m,r) is minus the sum over distinct values v of p_v log p_v,
      divided by log M, where p_v is the fraction of uncensored members returning v; and the largest
      tie-group share is max_v p_v. The usable window is the maximal interval of consecutive r on
      which k(m,r) is at least 8 and max_v p_v is below 0.40. Calibration predictions, both exact:
      the degenerate measure gives k = 1, H = 0 and share 1.0 at every r; the maximal pseudorandom
      tag gives H at least 0.95 and share at most a small multiple of 1/M. The shape prediction for
      portfolio measures is that k(m,r) is non-monotone with an interior maximum.'
    source: Pre-registered in the parent proposal IDEA-20260816-5c9c46 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Profiling runs at word size 8, where M = 512 is the complete constant space so
      every reported k is exact rather than a sample statistic, and at word size 16, the smallest
      deployed size, where M = 2000 of 4096 makes k a sample statistic whose dependence on M is flagged
      and where entropy is reported precisely because it is less M-sensitive. The transfer assumption
      is stated: a usable window measured at one word size, round range and budget does NOT transfer
      to another, because the window depends on all three, and the two word sizes are run specifically
      so the campaign can see how much the window moves rather than assume it holds. What does transfer,
      and is the point of the contract, is the methodological gate itself: a measure must be shown
      to have resolution at the scale where it will be used, and this contract must be rerun at any
      new scale rather than its windows quoted.'
    correspondence: null
  tail_checks:
  - The smallest and largest round counts in each sweep are reported separately, since both are boundary
    regimes where a window edge can be an artifact of the sweep's endpoints rather than of the measure.
  - Measures whose k equals M are flagged explicitly, since resolution then cannot be distinguished
    from sample size and the arm must be rerun on the full space.
  - Measures whose entire value range is two adjacent integers are reported as a special stratum,
    since entropy and k both look degenerate but the partition may still be meaningful at group level.
  - Constants that are censored under one measure but not another are reported by count, since differential
    censoring across measures distorts cross-measure window comparison.
  - The number of null members surviving to the largest round count is reported, so a window whose
    upper edge coincides with mass censoring is visibly a budget artifact.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and withhold every reported k if the degenerate calibration measure returns k greater than
    1, since the estimator is then fabricating variation.
  - Halt a measure's sweep at its inherited per-cell budget and record the round counts reached; a
    truncated sweep is reported with its actual range and never described as showing the measure saturating.
  - Halt the run at 7200 seconds excluding inherited budgets and report the measures and word sizes
    actually profiled.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both calibration measures return their required values, the determinism check
    records zero mismatches, and every profiled measure has k, entropy, largest tie-group share and
    a usable window reported at all three threshold pairs, with any large-r collapse decomposed into
    censoring and saturation.
  falsification_criterion:
  - The degenerate calibration measure returning more than one distinct value.
  - The maximal calibration measure returning normalized entropy below 0.95.
  - Any determinism mismatch on the 10 percent rescoring subsample.
  - k equal to M for a portfolio measure, meaning resolution is bounded by sample size rather than
    measured.
  - Monotone increasing k(r) across the entire reachable range for a measure, meaning the ceiling
    was never reached and the window's upper edge is a budget artifact.
  - Empty usable windows for every portfolio measure at every tested word size, which is a consequential
    measured obstruction and must be reported as such rather than resolved by relaxing thresholds.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5c9c46
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The resolution thresholds are conventions and the Coordinator must fix the primary pair before
    any scoring; the proposal suggests k at least 8 and largest share below 0.40 but owns no authority
    over the choice, and the sensitivity pairs exist so the choice is auditable rather than decisive.
  - Whether null draws are taken over the raw grid or over multiplicity-weighted orbit representatives
    depends on whether the symmetry-quotient contract has run, and the Coordinator must fix it, since
    the two give materially different histograms and the choice must match whatever the downstream
    signal arms will use.
  - Whether a measure without a validated correctness contract may be profiled at all, or whether
    profiling an unvalidated instrument gives false comfort, is a Coordinator call; the proposal profiles
    it and labels it instrument-conditional but that convention needs approval.
  - M at word size 16 is a budget-versus-exactness tradeoff; the proposal suggests 2000 of 4096 but
    the Coordinator must decide whether exhausting the space is affordable, since exhausting it removes
    the sample-size confound entirely.
