experiment:
  id: EXP-XEDN-78f1e9
  hypothesis_id: H-XEDN-40037f
  derived_from_idea: IDEA-20260805-887d67
  question_id: RQ-XEDN-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The specialisation image M over every good fibre: full per-fibre distribution of
    M/N with group structure and section divisibility recorded, a matched
    random-points null, two exact positive controls, and a pre-registered definition
    of what counts as an identifiable small-M subfamily
  objective: >-
    The one uncertainty a run reduces is whether the specialisation image M_{t_0} is
    generically the full group, or whether some identifiable subfamily depresses it -
    the only quantity in this lane that could move an exponent, and one that has never
    been measured. A run establishes (i) the exact M_{t_0} and N_{t_0} at EVERY good
    fibre of every surface in the frozen family, at each prime in the ladder; (ii) the
    full distribution of M/N per surface, with the group STRUCTURE and the divisibility
    of each specialised section recorded per fibre so that an arithmetic depression can
    be separated from a geometric one; (iii) the matched random-points null - n
    uniformly random points of the same group at the same fibre, run through the
    identical pipeline; and (iv) the measured meet-in-the-middle cost of finding a
    fibre-specific relation without discrete logarithms, beside the rho baseline on the
    same fibre in the same units. No attack is claimed, no exponent is moved, and
    nothing here bears on any deployed curve.
  what_this_is_not:
    - >-
      Not an attack, a key recovery, or an ECDLP result of any kind. The p^{-3} lift
      factor dominates every cost in this contract and is stated so no reader can mistake
      the cost identity for an attack cost.
    - >-
      Not a proposal to lift anything. The lift probability is already settled in this
      lane and is used here only as the ceiling the record charges against.
    - >-
      Not a duplicate of the committed fibre-specific-lattice hypothesis. That record
      carries the Minkowski slope and the box-volume cost identity; this contract measures
      the ONE quantity those leave open.
    - >-
      Not a closure of the lifting relation-source route, and not a licence for any
      blanket closure sentence. Forward guidance is part of the deliverable.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and
      not a promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: over the tested surfaces and all their good fibres at the
      tested primes, the M/N distribution had this measured shape; the section-to-random
      ratio was this value over this many matched pairs; and no identifiable subfamily
      with depressed median was found within the declared search. WHAT DOES NOT FOLLOW: no
      statement about any curve at cryptographic scale; no claim that no small-M subfamily
      EXISTS, since absence within a bounded search is not absence; no cost claim derived
      from the instrument's own runtime; and no exponent claim of any kind.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, minutes): read the archived census records and confirm the
      completed goal measured the GENERIC relation class only. Freeze, before anything
      runs, the definition of an IDENTIFIABLE subfamily - it must be specified by a public
      property of the surface or the fibre, never by having been observed to have small M -
      together with the decision thresholds and the independence-certification rule.
      STAGE 1 (pen and paper, hours, zero compute): derive the cost identity in full - box
      volume M independent of n, and the meet-in-the-middle bound by AM-GM - so that M's
      meaning is fixed before any distribution exists. A defect here ends the line before
      compute.
      STAGE 2 (seconds to minutes, POSITIVE CONTROLS, read FIRST): the subgroup-order
      fixture on a fibre with known order and known generators, requiring exact integer
      agreement; and the divisibility control, replacing each specialised section by k
      times itself and requiring M to fall by at least a factor k, for every declared k.
      STAGE 3 (minutes, p <= 1009): exhaustive discrete logarithm, exact M and N at every
      good fibre, group structure and per-section divisibility recorded, n = 2..8 with
      independence certified per cell.
      STAGE 4 (hours, p up to about 10^5): the same by baby-step giant-step, over all good
      fibres, producing the full M/N distribution per surface.
      STAGE 5 (hours): the MATCHED RANDOM-POINTS NULL at every cell, at least 50 matched
      pairs, computed and hash-committed BEFORE the section arm's distribution is read.
      STAGE 6 (minutes): the baseline-cost arm - measured meet-in-the-middle cost of
      finding a K-vector without discrete logarithms, beside sqrt(N) on the same fibre, in
      the same units.
      STAGE 7 (zero compute): assemble the distribution tables, apply the frozen subfamily
      definition, and write the scoped verdict with its forward guidance.
    instrument: >-
      Pure Python 3.11 with numpy; NO SageMath, which is absent from this container. Short
      Weierstrass arithmetic over F_p, baby-step giant-step discrete logarithm, exact
      integer subgroup-order computation, and Hermite normal form over Z for the kernel
      lattice. The frozen section enumerator already committed in this lane is reused
      UNCHANGED, and its commit sha is recorded. Every quantity is an exact integer; M/N is
      recorded as an exact rational, never as a float. Recorded through harness/runner.py.
    parameters: >-
      Prime ladder from p <= 1009 up to about p ~ 10^5, the upper end set by termination
      inside wall_clock_seconds_per_run on a pilot. All good fibres t_0 with
      Delta(t_0) != 0 at each prime; fibres with Delta(t_0) = 0 are excluded and the
      exclusion is recorded. n from 2 to 8, with independence certified per cell and
      uncertified cells reported separately rather than dropped. At least 50 matched
      random-point pairs per (surface, fibre, n) cell. A declared set of divisibility
      factors k for the second positive control. Decision threshold on the
      section-to-random ratio pre-registered at 0.8, from the parent proposal.
  controls:
    - >-
      POSITIVE CONTROL 1, exact, forced value, read FIRST. On a fibre with a KNOWN group
      order and known generators, the subgroup-order instrument must return M equal to the
      known value, integer for integer. If it does not, no M distribution from that run is
      reportable.
    - >-
      POSITIVE CONTROL 2, the effect MUST appear. Replace each specialised section by k
      times itself, forcing the generated subgroup into index at least k, for every k in
      the declared set. M must fall by at least a factor k, exactly and by construction. If
      M does not move when the image is deliberately pushed into a known subgroup, the
      instrument is not measuring a subgroup order, it is broken, and NO negative result
      may be reported from any arm.
    - >-
      NULL OBJECT, matched, forced value derived pre-run, CAN FAIL. For each (surface,
      fibre, n) cell, draw n uniformly random points of E_{t_0}(F_p) and run the identical
      pipeline. Matched on n, on the fibre and on the group, so the ONLY difference is
      whether the points came from sections. Forced value: identical M/N distributions,
      ratio 1.0. It can genuinely fail - if sections specialise into special position the
      ratio drops - and its failing is the outcome that would most raise this lane's value.
    - >-
      CONFOUND-SEPARATION CONTROL, blocking. The group STRUCTURE (both invariant factors)
      and the divisibility of each specialised section are recorded PER FIBRE, not only the
      order. A depressed M/N caused by a non-cyclic group or by divisible sections is
      arithmetic and is shared with the random null; without these two recordings the three
      preimages of a depression cannot be separated and the primary metric is
      unidentifiable.
    - >-
      SUBFAMILY-DEFINITION CONTROL, frozen at STAGE 0. A candidate subfamily must be
      specified by a PUBLIC property fixed before the run. A subfamily defined post hoc by
      its own measurement is not a subfamily, and this is the single most likely way this
      contract would manufacture a false positive.
    - >-
      ORDERING CONTROL. Both positive controls and the entire null arm are computed,
      recorded and hash-committed BEFORE the section arm's M/N values are looked at.
    - >-
      INDEPENDENCE-CERTIFICATION CONTROL. Cells whose sections are not certified independent
      are reported SEPARATELY and excluded from the distribution, never dropped silently -
      silent dropping is the censoring failure this lane has already had raised against it.
    - >-
      BASELINE-COST CONTROL. The measured meet-in-the-middle cost of finding a K-vector
      without discrete logarithms is reported beside sqrt(N) on the same fibre, in the same
      units. A relation source not compared against rho on the same instance has not been
      costed.
    - >-
      INSTRUMENT-VERSUS-COST SEPARATION. The instrument computes discrete logarithms;
      an attacker cannot. Every cost statement is derived from the box volume, and the run
      record must show that no cost figure was taken from the instrument's own runtime.
    - >-
      EXCLUSION-RULE CONTROL. Cells whose predicted lambda_1 is below the declared floor are
      excluded from any slope fit by a rule DECLARED BEFORE the run, not chosen after.
  independent_variables:
    - prime p on the declared ladder
    - surface, within the frozen censused family
    - good fibre t_0, over all of F_p with Delta(t_0) != 0
    - n, from 2 to 8
    - 'point source: specialised sections / uniformly random points / k-multiplied sections'
  metrics:
    primary:
      - name: M_over_N_distribution
        units: exact rational per fibre, summarised as a per-surface distribution
        computed_as: >-
          M_{t_0} = order of the subgroup generated by the specialised sections, divided by
          N_{t_0} = #E_{t_0}(F_p), at every good fibre. The FULL distribution is reported -
          median, quantiles and the complete per-fibre table - never a single summary,
          since a depression confined to a subfamily is invisible in a median.
      - name: section_to_random_ratio
        units: dimensionless ratio
        computed_as: >-
          median M/N for specialised sections divided by median M/N for n uniformly random
          points at the same fibre, matched on n and on the group, over at least 50 matched
          pairs per cell. Forced value 1.0; a mean below 0.8 is the declared signal threshold.
      - name: identifiable_subfamily_verdict
        units: >-
          categorical - none found / found, with the public property naming it and its
          measured median M/N
        computed_as: >-
          applying the STAGE 0 frozen subfamily definition to the distribution. A subfamily
          discovered by its own measurement does not qualify and must be reported as a
          hypothesis for a NEW experiment, not as a finding of this one.
      - name: subgroup_order_fixture_pass
        units: boolean
        computed_as: exact integer agreement on the known-order fibre. POSITIVE CONTROL 1.
      - name: divisibility_control_drop
        units: measured factor by which M falls, per declared k
        computed_as: >-
          M with sections replaced by k times themselves, over M with the original sections.
          Must be at least k. POSITIVE CONTROL 2.
    secondary:
      - name: group_structure_per_fibre
        units: the pair of invariant factors
        computed_as: >-
          full structure of E_{t_0}(F_p), reported per fibre so that a non-cyclic
          explanation of a depression is visible rather than inferred.
      - name: section_divisibility_per_fibre
        units: the largest k with every specialised section in k*E_{t_0}(F_p)
        computed_as: computed explicitly per fibre, as the second arithmetic explanation channel.
      - name: mitm_cost_vs_rho
        units: same units for both, per fibre
        computed_as: >-
          measured meet-in-the-middle cost of finding a K-vector without discrete logarithms,
          beside sqrt(N) on the same fibre.
      - name: independence_certification_rate
        units: fraction of cells
        computed_as: >-
          certified-independent cells over attempted cells, with the uncertified cells listed
          rather than dropped.
      - name: excluded_fibre_count
        units: count with reasons
        computed_as: >-
          fibres excluded for Delta(t_0) = 0 or for the declared floor rule, each recorded
          with its reason.
      - name: peak_memory_and_wall_clock
        units: bytes and seconds
        computed_as: >-
          per cell. NOTE: these are INSTRUMENT costs and are explicitly NOT a cost model for
          any attack.
  heuristic_under_test:
    id: HEUR-XEDN-40037f-1
    formal_statement: >-
      For surfaces in the frozen family, the median over good fibres of M_{t_0}/N_{t_0}
      equals 1: n >= 2 specialised sections generically generate the full group. For all
      surfaces in the family, over the uniform choice of good t_0, for n >= 2.
    rigorous_ingredient: >-
      Two or more uniform elements of a finite abelian group generate it with probability
      bounded below by a constant depending on its rank; for a cyclic group the failure
      probability is controlled by its smallest prime factor. That is the rigorous half.
    the_gap: >-
      Sections are NOT uniform points. They come from a rank-at-most-8 lattice on surfaces
      selected by a two-section construction. The gap between "uniform elements" and
      "specialised sections" is the entire content of the experiment, and the matched-random
      null is what measures it.
    second_heuristic:
      id: HEUR-XEDN-40037f-2
      formal_statement: >-
        The section-derived and random-derived M/N distributions coincide at every fibre,
        matched on n and on the group.
      validation: >-
        Measured directly by the null arm over at least 50 matched pairs per cell, with the
        ratio - not the raw statistic - as the reported quantity.
  preregistered_prediction:
    quantity: >-
      The median of M_{t_0}/N_{t_0} over all good fibres per surface, and the
      section_to_random_ratio over at least 50 matched pairs per cell.
    formula: >-
      Median M/N = 1, with sub-unit mass only at 1/k for small k traceable to a non-cyclic
      group or to divisible sections and SHARED with the random null. section_to_random_ratio
      = 1.0 within sampling noise; a mean ratio below 0.8 is a genuine surface-specific
      signal. Under the alternative, an identifiable subfamily has median M/N corresponding
      to M ~ p^theta with theta < 1, and the per-relation cost there is p^{theta/2}.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-887d67 (predictions.M_over_N,
      "FORCED VALUE under the generic expectation: concentrated at 1 ... Pre-registered:
      median M/N = 1"; and predictions.section_to_random_ratio, "a mean ratio below 0.8 over
      >= 50 matched pairs is a genuine surface-specific signal") before any run under this
      contract exists. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at p at most about 10^5 because M is built from discrete logarithms, which is
      affordable only at toy size. The instrument is legitimate for measuring a group
      invariant and is NOT a cost model; that distinction is enforced by a named control
      rather than left to the reader. At n = 2, 3 and small p the asymptotics of any lattice
      statistic are weak, so the declared floor rule excludes those cells from any fit and
      the rule is fixed before the run.
    correspondence: null
    transfer_assumption: >-
      NONE for the exponent. No outcome is extrapolated to cryptographic p. The identity
      relating the cost to M is symbolic and scale-free; the MEASURED distribution is a toy
      quantity and is labelled as one everywhere it appears.
  tail_checks:
    - >-
      Report the LOWER TAIL of the M/N distribution explicitly - the 20 smallest values per
      surface with their fibres, group structures and section divisibilities - since a
      subfamily with small M would appear there first and would be invisible in a median.
    - >-
      Report the section arm and the null arm's lower tails side by side. A depression shared
      with the null is arithmetic; only an unshared one is a finding.
    - >-
      Report the number of good fibres actually covered per surface, and the excluded count
      with reasons. A distribution over a censored fibre set is not the distribution claimed.
    - >-
      Report the independence-certification rate per cell. A distribution assembled largely
      from uncertified cells measures the generic class, not the fibre-specific one.
    - >-
      Report the measured meet-in-the-middle cost and sqrt(N) in the same units on the same
      fibre, with the p^{-3} lift factor stated alongside, so no cost is quoted out of context.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 50
    repeat_count: 3
    note: >-
      The section arm is DETERMINISTIC - M at a given (surface, fibre, n) is an exact integer
      and does not vary with a seed. Seeds govern the matched random-points null and the
      bootstrap only. "independent_instances: 50" is the matched-pair count per cell in the
      null arm, which is where the statistical power actually lives; the real replicates for
      the section arm are the surfaces, the fibres and the primes.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 10.0
    memory_gb: 8
    maximum_memory_gb: 8
    maximum_runs: 30
    budget_provenance_note: >-
      The parent proposal estimates the largest stage at single-digit CPU-hours and states
      explicitly that this is A DESIGN FIGURE AND NOT A MEASUREMENT. The budget here carries
      that estimate forward with the same status: it is a bound to run inside, and the run
      record must replace it with a MEASURED wall clock. A run that exhausts it is a stop,
      never a negative result.
  stopping_rules:
    - >-
      Abort every arm if either positive control fails.
    - >-
      Stop the prime ladder at the largest p whose full good-fibre sweep terminates inside
      wall_clock_seconds_per_run on a pilot; a prime that times out is censored and recorded
      as censored, never reported as a partial distribution.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a
      stop, never a negative result (AGENTS.md rule 5).
    - >-
      The subfamily definition, the decision thresholds, the floor rule and the
      independence-certification rule are frozen at STAGE 0 and are not revised after any
      M/N value is observed.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose null arm or positive controls were not executed in the same invocation as
      the section arm is invalid_measurement.
    - >-
      A run reporting a cost figure derived from the instrument's own discrete-logarithm
      runtime is completed_invalid - that is the partial-cost error AGENTS.md rule 4 forbids.
    - >-
      A run that drops uncertified-independence cells silently, or excludes fibres by a rule
      not declared at STAGE 0, is invalid_measurement.
    - >-
      A run naming a subfamily that was identified by its own measurement rather than by the
      frozen public property is completed_invalid for the subfamily verdict.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    Both positive controls pass exactly, at least 50 matched null pairs are computed and
    hash-committed per cell before the section arm is read, the good-fibre sweep is complete
    at every included prime with exclusions recorded, and the run reports the full per-fibre
    M/N table with group structure and section divisibility, the section_to_random_ratio with
    its matched-pair count, the identifiable_subfamily_verdict under the frozen definition,
    and the measured meet-in-the-middle cost beside sqrt(N) on the same fibre. The hypothesis
    H-XEDN-40037f is SUPPORTED if and only if median M/N is 1 on every surface, the
    section-to-random ratio is at or above 0.8, and no identifiable subfamily has a depressed
    median.
  falsification_criterion:
    - >-
      An identifiable subfamily - identifiable by the STAGE 0 frozen public property - has
      median M/N below 1 by the declared margin and the depression is NOT shared by the
      matched-random null. The hypothesis is falsified, the per-relation cost falls below
      p^{1/2} there, and that subfamily is the successor object. This is the outcome the
      experiment is worth running for.
    - >-
      The section_to_random_ratio is below 0.8 over at least 50 matched pairs. Sections are in
      special position; the surface contributes structure beyond n group elements and the
      relation-source question reopens with a measured effect size. Routed to independent
      adversarial review before any promotion, and NOT written as a breakthrough at toy scale.
    - >-
      Either positive control fails. Nothing may be reported from any arm.
    - >-
      Independence cannot be certified in enough cells. The fibre-specific class collapses onto
      the generic one, the experiment measured the wrong object, and the shortfall is reported.
    - >-
      A depression appears in the section arm AND equally in the null arm. The hypothesis is
      CONFIRMED, not refuted - the effect is arithmetic, and reading it as a geometric signal
      would be the confound this contract exists to close.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment, including the commit sha of the reused frozen
      section enumerator
    - >-
      raw-result.json carrying every per-fibre record - M, N, group structure, per-section
      divisibility, independence certification, exclusion reason - and not summaries
    - the null arm's and both positive controls' measurements, in the same file as the section arm
    - the STAGE 0 frozen subfamily definition, thresholds and exclusion rules, hashed before the run
    - the STAGE 1 written derivation of the box-volume cost identity
    - the measured meet-in-the-middle cost and the rho baseline on the same fibre in the same units
    - the lower-tail tables for the section arm and the null arm, side by side
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false. Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The STAGE 0 subfamily definition is a HARD GATE. Without a public property fixed in
      advance, "an identifiable subfamily with small M" is a statement that can be
      manufactured from any distribution, and the contract's primary verdict would be
      unfalsifiable.
    - >-
      STAGE 1's derivation must be written and checked before compute; a defect there ends the
      line at zero cost.
    - >-
      The paired hypothesis is proof-oriented and carries a filled proof_search_map
      (KN-TECH-080). Its observation-collision audit names three preimages of a depressed M/N,
      and the group-structure and divisibility recordings are the separations it requires -
      both are preconditions of approval, not optional arms.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-887d67
    authored_at: '2026-08-25'
    note: >-
      Controls, forced values, thresholds and the confounder list are taken from the parent
      proposal's minimal_test.controls, predictions, confounders and heuristic_assumptions.
      This contract narrows the parent's five-metric design to the ONE metric the parent itself
      calls the quantity the whole proposal turns on, because the lattice-geometry metrics are
      already carried by a committed sibling hypothesis and re-running them here would measure
      the same object twice. The 0.8 threshold and the median-1 forced value are the parent's
      own and are not re-chosen. Budgets come from the parent's declared estimated_cost, whose
      compute figure the parent explicitly labels a design figure rather than a measurement,
      and that status is carried forward verbatim in budget_provenance_note.
  derivation_gaps:
    - >-
      The definition of an IDENTIFIABLE subfamily is not fixed here and is the contract's most
      load-bearing gap. It must be a public property of the surface or the fibre, written down
      at STAGE 0; without it the primary verdict can be manufactured after the fact.
    - >-
      The independence-certification route is unresolved. The census's pseudo-Gram cannot
      certify Mordell-Weil independence, so either a genuine height Gram must be computed or a
      different certificate must be specified - and this dependency is declared rather than
      assumed away.
    - >-
      The declared margin for "median M/N below 1" is not numerically fixed. It must be set at
      STAGE 0 from the arithmetically forced 1/k mass, so that the ordinary non-cyclic cases do
      not trip the verdict.
    - >-
      The prime ladder's upper end is a termination question, not a design choice, and must be
      set by a pilot before freezing. The parent's single-digit CPU-hour figure is an estimate
      and must be replaced by a measured wall clock in the run record.
