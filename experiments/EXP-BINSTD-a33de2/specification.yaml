    EXP-BINSTD-cb15a4. Expand (Stage-2) not authorized on this card.
  approval:
    approved_by: DEC-20261003-a57c49
    composing_decision: DEC-20261003-a57c49
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is
      true. Stages 0–1R authorized. Cites EV-BINSTD-c45564 /
      DEC-20261003-4706a8. Does not claim support or authorize KN-FIND.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes inherited (α,M₀)=(1.0,16777216), XOR-SAT pin, NEW
      catalog_seed=2026100388923 (≠ 2026100390013 and parent seeds), a SHARED
      process-isolated baseline (median of 7 Field-import workers), allocator
      probe vs that baseline, and a density_batch_size ≥ 32 that clears the
      PACKAGE instrument_clears_floor gate on calib cells
      {(23,6),(29,8),(29,10),(31,12)} with n_clamped_zero=0 — else O-IMPEDIMENT
      (no Stage-1R band reading). Stage 1R measures densified delta_rss vs the
      frozen shared baseline (no per-cell paired baseline). No Magma/Sage/
      AUXIN/Bedrock. No ECDLP solve. No parent re-run.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Independently replicate the first clear-floor Stage-1 O-SUPPORT of
    EXP-BINSTD-9001b3 / EV-BINSTD-c45564 under the same shared-baseline
    densified protocol with a NEW catalog_seed, before any support / KN-FIND
    reading of H-BINSTD-ce918e. Expand (Stage-2 null / mechanism separation)
    is deferred until this Stage-1R package is reviewed.

  class: heuristic_validation
  class_note: >-
    Independent Stage-1R replication of a memory heuristic instrument.
    Not an exponent-moving breakthrough; no ECDLP attack table; no support
    claim this tick.

  scope:
    included:
      - >-
        Stage 0. Freeze V family for Stage-1R cells; inherit (α,M₀) and XOR-SAT
        pin; NEW catalog_seed ≠ {2026100390013, 2026100377593, 2026100343342,
        2026100375050, 202610032056}; SHARED process-isolated baseline repeats →
        shared_baseline_rss_bytes (= os_rss_floor_bytes); allocator probes at
        2/8/16 MiB recovering ≥0.5 of the largest vs the shared baseline;
        package-median density-batch calibration on
        {(23,6),(29,8),(29,10),(31,12)} doubling from 32 until
        instrument_clears_floor (median ΔRSS ≥ 262144 or max encode_peak −
        shared_baseline ≥ 524288) AND n_clamped_zero=0, freezing
        density_batch_size (max 2048) or O-IMPEDIMENT; twin check.
      - >-
        Stage 1R. For (n,ℓ)∈{(23,6),(23,8),(29,8),(29,10),(31,10),(31,12)}
        measure densified encode+solve peaks against the FROZEN shared
        baseline (no per-cell paired baseline); report delta_rss_bytes; write
        stage1/panels.json, stage1/control-table.json, RESULTS.md with
        exactly one O-*. Band/mechanism reading requires
        instrument_clears_floor (package median + n_clamped_zero=0).
    excluded:
      - Re-run of EXP-BINSTD-9001b3, EXP-BINSTD-55feb5, EXP-BINSTD-eb9e5e, EXP-BINSTD-ff5050, or EXP-BINSTD-cb15a4
      - Magma / Sage / AUXIN / Amazon Bedrock
      - Deployed-curve attack, break claim, exponent move, n≥131 transfer
      - support / KN-FIND promotion in this design or run package
      - Per-cell paired baseline subtraction (the clamp-to-zero failure mode)
      - Stage-2 null / expand (deferred until Stage-1R reviewed)

  inputs:
    parent_experiments: [EXP-BINSTD-9001b3, EXP-BINSTD-55feb5, EXP-BINSTD-eb9e5e, EXP-BINSTD-ff5050, EXP-BINSTD-cb15a4]
    evidence: [EV-BINSTD-c45564, EV-BINSTD-602614]
    decisions: [DEC-20261003-4706a8, DEC-20261003-a50644, DEC-20261003-cff91a]
    idea: IDEA-20261001-20561e
    hypothesis: H-BINSTD-ce918e
    frozen_parameters:
      alpha: 1.0
      M0_bytes: 16777216
      catalog_seed: 2026100388923
      parent_catalog_seed: 2026100390013
      clear_floor_delta_bytes: 262144
      clear_floor_margin_bytes: 524288
      start_density_batch: 32
      max_density_batch: 2048
      rss_mode: process_isolated_delta_shared_baseline
      calib_cells:
        - {n: 23, ell: 6}
        - {n: 29, ell: 8}
        - {n: 29, ell: 10}
        - {n: 31, ell: 12}

  controls:
    - id: twin_N_var
      description: Twin encode paths A/B must agree on N_var for every measured V.
    - id: shared_frozen_baseline
      description: >-
        Stage 0 freezes shared_baseline_rss_bytes as the median of 7 isolated
        Field-import workers. Stage-1R delta_rss = max(0, encode_peak −
        shared_baseline). Per-cell paired baselines are forbidden.
    - id: allocator_probe
      description: >-
        Stage-0 known bytearray allocations must recover ≥50% of the largest
        probe size in delta-RSS vs the shared baseline, else O-IMPEDIMENT
        (instrument dead).
    - id: floor_clear_calibration
      description: >-
        Stage 0 must freeze a density_batch_size ≥ 32 that clears
        instrument_clears_floor on PACKAGE_CALIB_CELLS with n_clamped_zero=0
        before Stage 1R may run; failure is O-IMPEDIMENT, not a band verdict.
    - id: inherited_band
      description: peak_rss ≤ M0·2^{α·ℓ} continuity with EV-BINSTD-c45564 / 602614.
    - id: new_seed_replication
      description: >-
        catalog_seed 2026100388923 must differ from parent Stage-1 seed
        2026100390013 and earlier lineage seeds.
    - id: no_parent_rerun
      description: Do not execute 9001b3, 55feb5, eb9e5e, ff5050, or cb15a4 trial plans.

  independent_variables:
    - name: ell
      levels: [6, 8, 10, 12]
    - name: n
      levels: [23, 29, 31]
    - name: density_batch
      levels: [frozen_at_stage0]
    - name: rss_instrument
      levels: [process_isolated_delta_shared_baseline]
    - name: catalog_seed
      levels: [2026100388923]

  metrics:
    primary:
      - name: delta_rss_bytes
        unit: bytes
        definition: >-
          max(0, process-isolated densified encode+solve peak_rss −
          Stage-0 frozen shared_baseline_rss_bytes).
      - name: peak_rss_bytes
        unit: bytes
        definition: Child-process peak RSS of densified encode+solve (continuity).
      - name: band_holds
        unit: boolean
        definition: peak_rss_bytes ≤ M0_bytes · 2^(alpha · ell).
      - name: instrument_clears_floor
        unit: boolean
        definition: >-
          median(delta_rss) ≥ 262144 OR (max encode_peak - shared_baseline) ≥
          524288, AND n_clamped_zero = 0.
      - name: floor_clear_calibration_ok
        unit: boolean
        definition: Stage-0 package calib cleared instrument_clears_floor at some batch in [32,2048].
      - name: twin_agreement
        unit: boolean
        definition: Twin N_var meters agree on every measured V.
    secondary:
      - name: shared_baseline_rss_bytes
        unit: bytes
      - name: os_rss_floor_bytes
        unit: bytes
      - name: density_batch_size
        unit: integer
      - name: n_clamped_zero
        unit: integer
      - name: floor_dominant_delta
        unit: boolean
      - name: delta_ell_spread
        unit: ratio
      - name: allocator_ok
        unit: boolean
      - name: N_var
        unit: integer
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-20561e-H1

  preregistered_prediction:
    quantity: >-
      Process-isolated peak_rss(densified encode+solve) ≤ M₀·2^{α·ℓ} on Stage-1R
      cells after twin agreement, with (α,M₀)=(1.0, 16777216) and catalog_seed
      2026100388923; Stage-0 shared baseline + density-batch calibration must
      clear the PACKAGE instrument_clears_floor gate (median ΔRSS ≥ 262144 or
      max_encode − shared_baseline ≥ 524288, n_clamped_zero=0) before any
      Stage-1R band/mechanism reading — independently of EV-BINSTD-c45564.
    formula: >-
      band_bytes(ell) = 16777216 * 2**(1.0 * ell);
      delta_rss = max(0, encode_peak - shared_baseline_rss);
      peaks from child process resource.getrusage(RUSAGE_SELF).ru_maxrss * 1024;
      shared_baseline_rss = median of 7 isolated Field-import workers;
      density_batch_size frozen at Stage 0 on PACKAGE_CALIB_CELLS starting at 32.
    source: >-
      EV-BINSTD-c45564 / DEC-20261003-4706a8 NA-1; EV-BINSTD-602614;
      IDEA-20261001-20561e; frozen before Stage 1R in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Memory instrument on n∈{23,29,31}, ℓ≤12 only under this card. No transfer
      of a RSS band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - RSS probe / allocator calibration failure → O-IMPEDIMENT (not O-SUPPORT).
    - Stage-0 floor_clear_calibration_ok=false → O-IMPEDIMENT; Stage 1R must not
      produce a band/mechanism verdict without a cleared instrument.
    - instrument_clears_floor=false OR floor_dominant_delta=true OR n_clamped_zero>0
      → O-INCONCLUSIVE for mechanism reading even if peak band holds
      (diagnostic, not O-FAIL-BAND).
    - First clear-floor O-SUPPORT (EV-BINSTD-c45564) remains unreplicated until
      this Stage-1R package is reviewed; no support/KN-FIND from this design tick.

  seeds_and_replication:
    catalog_seed: 2026100388923
    parent_catalog_seed: 2026100390013
    grandparent_catalog_seed: 2026100377593
    eb9e5e_catalog_seed: 2026100343342
    ff5050_catalog_seed: 2026100375050
    v1_catalog_seed: 202610032056
    independent_instances: 6
    note: >-
      Stage-1R cells (23,6)/(23,8)/(29,8)/(29,10)/(31,10)/(31,12) under NEW seed
      2026100388923 and shared-baseline densified delta-RSS. Twin meters remain
      the per-V replication instrument. density_batch_size and shared_baseline
      frozen at Stage 0. This card IS the independent replication required by
      DEC-20261003-4706a8 NA-1.

  stopping_rules:
    - Stage 0 O-IMPEDIMENT / O-ARTIFACT stops Stage 1R.
    - maximum_runs: 4
    - No Bedrock/AUXIN under any stop.

  invalidation_rules:
    - Editing (α,M₀) after Stage-0 freeze.
    - Using a per-cell paired baseline for Stage-1R panels.
    - Running Stage 1R without floor_clear_calibration_ok / shared_baseline freeze.
    - Re-running parent packages under this card.
    - Claiming break / exponent / n≥131 / support / KN-FIND from this package.
    - Reusing catalog_seed 2026100390013 or any forbidden parent seed.

  success_criterion: >-
    Exactly one of O-SUPPORT / O-FAIL-BAND / O-INCONCLUSIVE / O-ARTIFACT /
    O-IMPEDIMENT on Stage 1R, with Stage-0 freeze twin_ok + rss_probe_ok +
    allocator_ok + floor_clear_calibration_ok + shared_baseline frozen (or
    named impediment). O-SUPPORT requires peak band hold AND
    instrument_clears_floor AND n_clamped_zero=0 AND not floor_dominant_delta.
    Does not assert hypothesis support or authorize KN-FIND.

  falsification_criterion: >-
    O-FAIL-BAND: instrument_clears_floor true and peak_rss > band on at least
    one Stage-1R cell. O-INCONCLUSIVE when the instrument still cannot clear
    the OS floor at Stage 1R (honest refine outcome, not band falsification).
    O-IMPEDIMENT when Stage-0 calibration cannot clear the package floor gate
    up to density_batch=2048.

  required_artifacts:
    - experiments/EXP-BINSTD-a33de2/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-a33de2/stage0/v-catalog.json
    - experiments/EXP-BINSTD-a33de2/stage1/panels.json
    - experiments/EXP-BINSTD-a33de2/stage1/control-table.json
    - experiments/EXP-BINSTD-a33de2/RESULTS.md
    - experiments/EXP-BINSTD-a33de2/runs/RUN-BINSTD-113958/
    - experiments/EXP-BINSTD-a33de2/runs/RUN-BINSTD-250727/

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    maximum_memory_gb: 4
    maximum_runs: 4

  assigned_to: executor
  trial_plan: experiments/EXP-BINSTD-a33de2/trial-plan-v1.json
  amazon_bedrock: NOT SELECTED
