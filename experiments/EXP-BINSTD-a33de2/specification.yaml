#   Stage 1R  — densified delta-RSS vs frozen shared baseline at
#               (n,ℓ)∈{(23,6),(23,8),(29,8),(29,10),(31,10),(31,12)}
#               with instrument_clears_floor gate before band/mechanism reading
# Same shared-baseline densified protocol as EXP-BINSTD-9001b3; new seed only.
# No re-run of 9001b3/55feb5/eb9e5e/ff5050/cb15a4. No AUXIN. No Bedrock.
# No break / exponent / n≥131 transfer. No support / KN-FIND in this packet.
# Expand (Stage-2 null) deferred until this Stage-1R is reviewed.
# =============================================================================
experiment:
  id: EXP-BINSTD-a33de2
  hypothesis_id: H-BINSTD-ce918e
  question_id: RQ-BINSTD-b6f698
