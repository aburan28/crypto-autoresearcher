  successor_of: EXP-BINSTD-9001b3
  cites_evidence:
    - EV-BINSTD-c45564
    - EV-BINSTD-602614
  cites_decision: DEC-20261003-4706a8
  version: 1
  title: >-
    Stage-1R shared-baseline densified delta-RSS replication (new seed) for
    H-BINSTD-ce918e after EV-BINSTD-c45564
  status: approved
  approved_by: DEC-20261003-a57c49
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0 and 1R authorized by DEC-20261003-a57c49 under AGENTS.md standing
    user authorization (2026-09-06), discharging NA-1 of DEC-20261003-4706a8 /
    EV-BINSTD-c45564. Stage label "1" in the runner is the Stage-1R replication
