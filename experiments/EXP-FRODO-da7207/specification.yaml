experiment:
  id: EXP-FRODO-da7207
  hypothesis_id: H-FRODO-3fae9a
  derived_from_idea: IDEA-20260821-c05d5f
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Provenance-class census of every free variable in the transcribed FrodoKEM
    IND-CCA bound -- delegation chains, cappable-class heterogeneity and
    normative-force disagreements, under a taxonomy frozen before retrieval,
    with four failable controls and a separately tabulated acquisition-failure
    register

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- which cells of GOAL-FRODO-002's
    planned sweep a deployment can actually occupy, which is a documentary
    question about where a number for each symbol could come from. A run
    establishes -- (i) C1, the number of delegation chains from the FrodoKEM
    standardization surface that terminate in a document stating no number for
    the variable delegated, with full paths recorded; (ii) C2, the number of
    distinct provenance classes among the dominant term's variables after
    excluding the structurally-present classes P1 and P6, per parameter set;
    (iii) C3, the number of ADDITIONAL document pairs stating the same number
    for the same symbol with different deontic modality or different binder,
    beyond the one already-established seeded row; (iv) the signed gap in bits
    between the bit figure at the largest sourced value of every P2 variable
    and the paper's own published IND-CCA figure; and (v) the acquisition-
    failure register, tabulated separately from stated absences. A forced
    quantity -- the count of dominant-term P5/P6 variables -- is reported with
    its derivation written before the run and is never a discriminator. NO
    ATTACK, NO BREAK, no statement that FrodoKEM is insecure, no LWE
    re-estimation, and no assertion that any published failure rate is right or
    wrong.

  what_this_is_not:
    - >-
      Not an attack, a break, a distinguisher, or any cryptanalytic result. It
      is a documentary census plus an arithmetic evaluation.
    - >-
      Not a claim that FrodoKEM is insecure, nor that any Internet-Draft is
      defective. A difference in normative shape between two drafts at stated
      revisions is an observation about two drafts, and drafts are revised
      routinely.
    - >-
      Not an LWE hardness estimate. 149.8 / 212.6 / 266.8 are beyond-core-SVP
      cryptanalysis outputs and enter ONLY as given input symbols with their
      provenance recorded; re-deriving them is forbidden by GOAL-FRODO-002
      non_duplication and a pipeline that reproduced them from the transcribed
      reduction bound would be WRONG.
    - >-
      Not a statement about any attacker. An absence of a stated bound is an
      ABSENCE, symmetric in both directions -- not a ceiling and not a
      permission.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: crypto
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "over the enumerated document closure at the
      stated revisions and retrieval timestamps, [this many] delegation chains
      terminate without a value, the dominant term at each parameter set
      carries [these] provenance classes among its cappable variables, and
      [this many] document pairs state one number with two normative shapes;
      evaluating the transcribed bound at the sourced suprema gives [this]
      signed bit gap against the paper's own IND-CCA figure." The crypto tier
      applies to the DOCUMENTARY AND ARITHMETIC content only -- a document
      either states a number or does not. WHAT DOES NOT FOLLOW -- no security
      claim of any kind, no statement that a large value is reachable or
      unreachable, no defect claim against any draft, no transfer to any other
      scheme, and no claim that the enumerated closure is complete. The ML-KEM
      nearby object refutes in advance any reading of an absence as a security
      consequence.

  inputs:
    procedure: >-
      STAGE 0, BLOCKING PREREQUISITE (zero compute) -- confirm the
      GOAL-FRODO-002 BATCH-001 transcription exists as an explicit inequality
      with every symbol bound to its printed definition. IF IT DOES NOT, THE
      EXPERIMENT DOES NOT RUN and reports BLOCKED; that is a dependency state,
      never evidence.
      STAGE 0b (zero compute) -- freeze the six-way taxonomy P1..P6 and the
      deontic-modality-plus-binder coordinate, WRITE OUT the forced-value
      derivation for the demoted P5/P6 metric, and hash both, BEFORE any
      document is opened.
      STAGE 1 -- enumerate the free variables of the transcribed bound
      verbatim, with symbol, printed definition and the quantifier it sits
      under.
      STAGE 2 -- run NULL-1 through NULL-4 and ABORT if any fails.
      STAGE 3 -- assign each variable a class from the frozen taxonomy, and
      record the deontic modality and bound symbol of every clause supplying a
      P2 value, sourcing against the declared document preference order and
      recording for every "not stated" the EXACT full-text search terms used to
      establish the absence.
      STAGE 4 -- tabulate ACQUISITION FAILURES separately, with URL, HTTP
      status, attempt count and timestamp. Never merge with stated absences.
      STAGE 5 -- gating baseline reproduction (reduction arm), then evaluate
      the transcribed bound at the paper's own inputs and at the sourced
      supremum of every P1/P2 variable and a declared ladder for every P3-P6
      variable, in exact or certified interval arithmetic, recording WHICH TERM
      DOMINATES at each point and which classes its variables carry.
      STAGE 6 -- report C1, C2, C3, the forced P5/P6 count labelled forced, the
      signed bit gap, the acquisition-failure register, and the exact term at
      which the class projection stops determining the outcome (the first term
      where two same-class variables enter with opposite monotonicity).
    instrument: >-
      Retrieval and reading dominate; arithmetic is seconds. Document
      acquisition by the executor's fetch tooling with every fetch logged
      (URL, HTTP status, timestamp, attempt count). Bound evaluation in
      Python 3.11 with exact rational arithmetic or a certified interval
      implementation written from its definition; NO floating-point-only
      dominance decision, because a tie decided by rounding is a fabricated
      dominance. Every clause quoted VERBATIM with its document revision;
      paraphrase is not admissible as a census row. Recorded through
      harness/runner.py.
    parameters: >-
      Document preference order, declared before retrieval -- the FrodoKEM
      standard proposal and the CiC/ePrint paper;
      draft-longa-cfrg-frodokem; draft-longa-cfrg-frodokem-security-
      considerations; draft-smyslov-lamps-frodokem-certificates; the ISO/IEC
      18033-2 amendment; and any governing NIST or IETF clause a FrodoKEM
      deployment would inherit. Three published parameter sets. Six-way
      taxonomy P1..P6 plus the modality-and-binder coordinate. Evaluation
      points -- the paper's own inputs (gating), the sourced supremum of every
      P1/P2 variable, and a declared ladder for every P3-P6 variable.
  controls:
    - >-
      NULL-1, POSITIVE CONTROL ON A KNOWN-STATED BOUND, run separately against
      BOTH documents that state the per-public-key ciphertext count 2^8. The
      procedure MUST return class P2 with the value AND, separately for each
      document, the citing clause, its deontic modality and the symbol it
      binds. Returning "not stated" means the instrument under-reports and no
      absence it reports means anything. RETURNING A SINGLE MERGED ROW FOR THE
      TWO DOCUMENTS means it cannot see the modality coordinate and C3 is void.
    - >-
      NULL-2, POSITIVE CONTROL ON A SPEC-FIXED CONSTANT -- a length parameter
      (len_mu or len_salt) must come back P1 with the specification's value,
      not P5. len_salt is the sharper choice because it takes the value 0 for
      the ephemeral parameter sets, so a procedure that treats 0 as missing
      fails here.
    - >-
      NULL-3, NEGATIVE CONTROL -- the offline hash-query count q_G must come
      back P6. A numeric bound for q_G means the procedure has mistaken a
      modelling convention for a sourced deployment quantity and the run is
      VOID. DECLARED LIMITATION -- this control FORCES the demoted P5/P6 metric
      and therefore may not be cited as evidence for it.
    - >-
      NULL-4, MODALITY-INVARIANCE CONTROL -- restate one retrieved clause with
      its RFC-2119 keyword changed and nothing else. The procedure must return
      the SAME class and value and a DIFFERENT modality. A moving class means
      modality is leaking into the classification; an unmoving modality means
      the coordinate C3 is built on is not measurable.
    - >-
      SPREAD CHECK -- the controls must span at least three distinct classes.
      If every control returns the same class, the taxonomy is decorative and
      discriminates nothing.
    - >-
      GATING BASELINE REPRODUCTION (reduction arm) -- the transcribed bound at
      the paper's own inputs must reproduce the paper's own IND-CCA (ROM) bit
      figure within the frozen tolerance, BEFORE any sourced evaluation point
      is reported.
    - >-
      MUTATION CONTROL inherited from the goal -- perturb one exponent of the
      transcribed bound and confirm the evaluation registers the change. An
      evaluator insensitive to its own inputs cannot report a dominance map.
    - >-
      NEARBY-OBJECT CONTROL -- the completed ML-KEM census, cited in the
      deliverable, on which the reading "an unsourced variable means a security
      problem" demonstrably fails.
    - >-
      ACQUISITION-FAILURE REGISTER maintained separately, with the CNSA-2.0
      precedent named in the artifact so a later reader cannot read MISSING as
      EMPTY.

  independent_variables:
    - parameter set (three published sets)
    - variable symbol within the transcribed bound
    - source document and revision
    - "evaluation point (paper's own inputs / sourced supremum / declared ladder rung)"
    - "deontic modality of the supplying clause (MUST / MUST NOT / SHOULD / RECOMMENDED / informative)"

  metrics:
    primary:
      - >-
        C1 terminating_delegation_chain_count -- the number of delegation
        chains over the enumerated closure that terminate in a document stating
        no number for the variable delegated. Computed by following every
        normative reference for every P2-P5 candidate variable until it either
        states a number or states none, recording the full path. Unit --
        dimensionless count.
      - >-
        C2 cappable_class_heterogeneity -- the number of DISTINCT provenance
        classes among the variables of the dominant additive term after
        EXCLUDING P1 and P6, per parameter set. Computed from the STAGE 5
        dominance map and the STAGE 3 classification. Unit -- dimensionless
        count, per parameter set.
      - >-
        C3 additional_normative_force_disagreement_pairs -- the number of pairs
        of retrieved documents stating the same number for the same symbol with
        different deontic modality or different binder, EXCLUDING the seeded
        row. Unit -- dimensionless count. The seeded row is entered with its
        provenance and marked seeded.
      - >-
        G1 signed_bit_gap -- the signed difference, in bits, between the bit
        figure obtained at the largest sourced value of every P2 variable and
        the paper's own published IND-CCA figure, per parameter set, with its
        interval. Unit -- bits, signed.
      - >-
        NULLPASS -- the four control verdicts (NULL-1 per document, NULL-2,
        NULL-3, NULL-4) plus the spread check and the gating baseline
        reproduction. Unit -- boolean each. All must pass before any other
        primary metric is admissible.
    secondary:
      - >-
        F1 (REPORTED, FORCED, NEVER EVIDENCE) -- count of dominant-term
        variables carrying class P5 or P6 per parameter set, with its
        pre-written derivation
      - per-variable provenance class with citing clause, modality, binder, or the named absence-establishing search terms
      - dominant-term provenance signature per parameter set and per evaluation point
      - the exact term at which two same-class variables enter with opposite monotonicity, i.e. where the class projection stops determining the outcome
      - dominance-region decomposition where the dominant term changes identity across an unsourced variable's range
      - A1 acquisition-failure register (source, URL, HTTP status, attempts, timestamp)
      - the observation-collision result -- whether a static certified key and an ephemeral-per-handshake key project to the same dominant-term signature

  heuristic_under_test: HEUR-FRODO-2
  preregistered_prediction:
    quantity: >-
      C1 >= 1, C2 >= 2 at each parameter set, C3 >= 1 additional row, and F1
      >= 1 (forced).
    formula: >-
      C1 := |{delegation chains whose terminal document states no number for
      the delegated variable}|. C2 := |{distinct classes among dominant-term
      variables} minus {P1, P6}| per parameter set. C3 := |{document pairs
      stating one number for one symbol with different modality or binder}|
      minus 1 seeded row. Under the NULL that FrodoKEM's surface always
      terminates in a value, C1 = 0. Under the NULL that the dominant term is a
      pure modelling-convention term, C2 = 0. Under the NULL that the seeded
      pair is isolated, C3 = 0. Each of these three nulls is REACHABLE, which
      is what makes the metrics discriminators; F1 is NOT reachable at 0 and is
      therefore demoted.
    source: >-
      Pre-registered in IDEA-20260821-c05d5f (claim C1/C2/C3, predictions and
      forced_value_derivation) and restated in H-FRODO-3fae9a before any run
      under this contract exists. The forced-value derivation for F1 is written
      before the run precisely so that F1 can never later be reported as a
      finding. Never tuned to data.

  scale_relevance:
    tier: crypto
    justification: >-
      This experiment operates directly on FrodoKEM's published parameter sets
      and on its actual standardization documents, so the documentary and
      arithmetic content is at deployed scale by construction -- there is no
      toy proxy and no extrapolation. THE SCALE CLAIM IS ALSO THE SCOPE LIMIT
      -- being at deployed scale on the DOCUMENTS says nothing about deployed
      security, because the object measured is the provenance of a number and
      not the number's correctness. The transfer assumption, stated -- that the
      enumerated document closure is the closure a deployer would consult -- is
      HEUR-FRODO-1, is unverifiable by this method, and every "not stated" row
      is conditional on it.
    correspondence: null

  tail_checks:
    - >-
      Report the longest delegation chain followed and the number of hops, so a
      C1 of zero can be distinguished from a shallow search.
    - >-
      Report every variable whose class changed between a first and second
      independent reading of the same clause; a nonzero count means the
      classification is reader-dependent and C1-C3 carry that uncertainty.
    - >-
      Report the dominance margin at each evaluation point, so a "dominant
      term" decided by a margin inside the arithmetic precision is reported as
      a TIE rather than broken.
    - >-
      Report the acquisition-failure register even when empty, with the
      searches attempted, since a census with no failures and a paywalled ISO
      amendment in its source list is not credible.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 2
    note: >-
      Seeds govern only the arithmetic evaluation harness. THE CENSUS ITSELF IS
      NOT SEED-DEPENDENT -- its replication device is a SECOND INDEPENDENT
      READING of every clause by a different reader, compared row by row, which
      is the only replication that can detect a paraphrase imported as a
      source. Two independent instances means two independent readings, not two
      reruns of one reader.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    agent_hours_estimate: 8
    maximum_memory_gb: 2
    maximum_runs: 4

  stopping_rules:
    - >-
      DO NOT RUN if the GOAL-FRODO-002 BATCH-001 transcription does not exist.
      Report BLOCKED. This is a dependency state and never evidence.
    - >-
      ABORT if any of NULL-1 through NULL-4 fails, or if the spread check
      shows all controls returning one class. The deliverable is the instrument
      defect.
    - >-
      ABORT reporting of any sourced evaluation if the gating reduction-arm
      baseline does not reproduce the paper's own IND-CCA figure. The
      discrepancy becomes the deliverable.
    - >-
      Stop at the declared document closure. Adding a document after seeing a
      C1 of zero is a protocol amendment, never a repair.
    - >-
      Stop at maximum_runs or the agent-hour estimate, whichever binds first.
      An exhausted retrieval budget is a stop, never a negative result
      (AGENTS.md rule 5), and the unreached documents go into the
      acquisition-failure register.

  invalidation_rules:
    - >-
      A timeout, crash, HTTP failure, paywall or dependency failure is
      failed_infrastructure or an acquisition failure and is NEVER negative
      mathematical or documentary evidence (AGENTS.md rule 5). A document that
      could not be fetched is MISSING, not EMPTY.
    - >-
      A run in which any "not stated" row lacks its named full-text search
      terms is invalid_measurement -- the absence is asserted rather than
      checkable.
    - >-
      A run that merges the acquisition-failure register into the stated-
      absence table is completed_invalid.
    - >-
      A run that reports C1, C2 or C3 without all four controls having been
      executed in the same invocation is invalid_measurement.
    - >-
      A run whose taxonomy or modality coordinate was revised after any
      document was opened is completed_invalid; a post-hoc taxonomy can
      classify anything as anything.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) the BATCH-001
    transcription existed and its variable list was enumerated verbatim;
    (b) NULL-1 (both documents, unmerged), NULL-2, NULL-3, NULL-4 and the
    spread check all passed; (c) the gating reduction-arm baseline reproduced
    the paper's own IND-CCA figure within the frozen tolerance; (d) C1, C2, C3
    and G1 are reported with every row carrying its citing clause and modality
    or its named absence-establishing search terms; and (e) the
    acquisition-failure register is present and separate. The hypothesis
    H-FRODO-3fae9a is SUPPORTED at crypto tier on the documentary content if,
    in addition, C1 >= 1 AND C2 >= 2 at every parameter set AND C3 >= 1
    additional row.

  falsification_criterion:
    - >-
      C1 = 0 -- every delegation chain terminates in a document stating a
      number. Part C1 of the hypothesis is FALSE, FrodoKEM's surface differs
      structurally from ML-KEM's, and that is a strong positive documentary
      outcome reported as such rather than buried.
    - >-
      C2 <= 1 at every parameter set -- the dominant term contains no variable
      outside P1 and P6. Part C2 is FALSE and the correct reading is that the
      dominant term is a pure modelling-convention term.
    - >-
      C3 = 0 additional rows and a current revision harmonizes the seeded pair.
      Part C3 is FALSE and the finding reduces to a single historical row.
    - >-
      NULL-1 returns "not stated" or merges the two documents; or NULL-2
      returns P5 for a spec-fixed length; or NULL-4 moves the class or fails to
      move the modality. No absence is admissible, C3 is void, and the
      deliverable is the instrument defect.
    - >-
      NULL-3 returns a numeric bound for q_G. The taxonomy is void and the run
      is discarded.
    - >-
      The gating baseline reproduction fails. The record is suspended and the
      discrepancy is the deliverable.
    - >-
      The dominant term changes identity across the region an unsourced
      variable ranges over, so the dominant-term variable set is not
      well-defined. A dominance-region decomposition must be reported instead
      of a single signature, or the hypothesis withdraws.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every per-variable census row, not summaries
    - the frozen taxonomy, the modality coordinate definition and the forced-value derivation, written before any document was opened and hashed
    - verbatim quotations of every citing clause with document revision and retrieval timestamp
    - named full-text search terms for every "not stated" row
    - the acquisition-failure register, separate, with URL, HTTP status, attempts and timestamp
    - the four control verdicts and the spread check, executed in the same invocation as the census
    - the gating baseline reproduction result with its residual
    - the second independent reading, compared row by row against the first
    - the seeded C3 row, marked seeded, with its provenance

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      HARD DEPENDENCY GATE -- the GOAL-FRODO-002 BATCH-001 transcription must
      exist and be committed before this contract may be approved for
      execution. Approving it earlier would authorize a run with no variable
      list to classify.
    - >-
      COUPLING GATE -- IDEA-20260821-c2242b audits the binder scope of the same
      restriction and carries the SAME two clauses this census seeds its C3
      table with. The parent proposal declares the overlap real. A Coordinator
      must execute the two as one task or explicitly sequence them; treating
      them as independent would double-count one reading.
    - >-
      The taxonomy, the modality coordinate and the forced-value derivation
      must be committed and hashed before the first document is opened.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260821-c05d5f
    authored_at: '2026-08-25'
    note: >-
      Metrics C1, C2, C3, G1 and A1, the four nulls and the spread check, and
      the demotion of the forced P5/P6 count are a direct rendering of the
      parent proposal's post-repair claim block, forced_value_derivation,
      null_object_control and predictions. The two-arm baseline reproduction
      (reduction arm gating, cryptanalysis arm as given inputs) is taken from
      the parent's repaired baseline_embedding and its category-error warning
      is preserved verbatim in substance. Budgets come from the parent's own
      estimate (retrieval and reading dominate; arithmetic is seconds; 4-8
      agent hours). No field is invented; unsupplied values are in
      derivation_gaps.

  derivation_gaps:
    - >-
      THE REDUCTION-ARM FIXTURE'S NUMERIC TARGET IS UNFILLED. It is a required
      BATCH-001 transcription output. A Coordinator must fill it, with its
      tolerance, before approval -- a gating fixture with no target does not
      gate. Copying the red-team screen's relayed Table 4 figures into it would
      import an unread number into a frozen fixture and is forbidden.
    - >-
      The declared ladder for P3-P6 variables is named but its rungs are not
      specified. They must be frozen before retrieval, since a ladder chosen
      after seeing which term dominates would make the dominance map fitted.
    - >-
      The arithmetic tolerance for the gating reproduction is unspecified. A
      tolerance chosen after seeing the residual is not a gate.
    - >-
      GOAL-FRODO-002 completion_criteria carries the same
      cryptanalysis-versus-reduction ambiguity the parent proposal repaired in
      its own baseline. Repairing the goal record is a Coordinator act and is
      NOT performed here; it is flagged so it is not silently inherited.
    - >-
      The ISO/IEC 18033-2 amendment is very likely paywalled. Its expected
      failure mode is declared in advance so that its absence lands in the
      acquisition-failure register rather than becoming a census row.
