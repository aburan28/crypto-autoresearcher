experiment:
  id: EXP-ZKARG-41c4fa
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c50b84; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c50b84
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the reachable region and growth law of this program's exhaustive soundness enumerator
    across challenge-space size, round count and prover branching, with a closed-form null family
    and a truncated-mode degradation map
  objective: 'The one uncertainty a run reduces: how large a protocol this program can measure exhaustively,
    and what a partial measurement is worth when it cannot. Specifically (i) it records node count,
    wall time, peak memory and completion status at every point of a frozen grid of challenge-space
    size, round count and branching factor, producing an explicit boundary table of the settings at
    which an attained cheating advantage is computable within a named node budget on a named machine
    class; (ii) it fits the growth of node count in each knob against a pre-registered product model
    and reports the fitted exponents and residuals, so that future contracts can size themselves by
    arithmetic rather than by trial and timeout; (iii) it measures degradation by re-running the largest
    completing points in truncated mode at named explored fractions and reporting how far the truncated
    lower bound sits below the exact attained advantage, which is the only way a truncated result
    outside the region can later be interpreted. A closed-form null family runs at every grid point
    in the same invocation so that a fast but wrong enumerator cannot produce a region that looks
    reachable. No soundness result about any protocol is produced, and no non-completing point is
    treated as evidence about anything except the instrument.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for this enumerator implementation
      on the named machine class, over the frozen grid, the node counts, completion statuses and fitted
      growth exponents are the reported values, the reachable region is the tabulated boundary, and
      the truncated-versus-exact gaps at named explored fractions are the reported degradation curve.
      What does NOT follow: any soundness statement about any protocol, since none is produced; that
      the boundary holds for structured protocols where payoff-dependent pruning applies; that the
      timings hold on other hardware, since only node counts are machine-independent; that a non-completing
      point says anything about any protocol''s security; and no attack, break, speedup or security
      consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Freeze the protocol family, the knob grid, the node budget,
      the memory ceiling, the machine class description, the truncation fractions and the growth model.
      STAGE 1 (cost: hours of implementation) Build the enumerator with an internal node counter,
      an internal memory ceiling, a deterministic traversal order and a truncation mode reporting
      the explored fraction. STAGE 2 (cost: minutes) Run the zero-advantage, full-advantage and determinism
      controls. STAGE 3 (cost: several hours compute) Sweep the full grid for the signal family, recording
      all metrics and statuses. STAGE 4 (cost: same as stage 3) Sweep the identical grid for the closed-form
      null family in the same invocation and verify the advantage at every completing point. STAGE
      5 (cost: under one hour) At the eight largest completing points, run truncated mode at the four
      named explored fractions and record the lower bounds against the exact values, checking the
      truncation-validity control at each. STAGE 6 (cost: minutes) Fit the growth model, report exponents
      and residuals, and emit the boundary table. STAGE 7 (cost: equal to stages 3 to 5) Replay from
      the recorded seed and require identical node counts before the run record is written.'
    instrument: Python 3, no Sage. A single self-contained enumerator module with an explicit iterative
      depth-first traversal, an internal node counter, an internal peak-memory accounting based on
      the traversal stack, a hard node budget and a truncation mode; the protocol families expressed
      as payoff callbacks so the tree shape is identical across families; tracemalloc for memory verification
      and time.perf_counter for wall time, both recorded as context. Execution is wrapped by harness/runner.py
      so commit, environment, timings, resources and seeds are captured and the run record is immutable,
      and every completing point's attained advantage is emitted as a certificate the wrapper re-verifies
      against the closed form for the null family.
    parameters: 'Challenge-space size q in {16, 64, 256, 1024}. Round count r in {1, 2, 3, 4}. Branching
      factor b in {2, 4, 8, 16}. Grid size 64 points per family, two families. Node budget 2 to the
      26 per point. Memory ceiling four gigabytes enforced internally. Truncation explored fractions
      {0.01, 0.05, 0.25, 0.50} at the eight largest completing points. Determinism control: every
      point run twice from the same seed. Machine class named in the specification with core count,
      clock and memory. Total node visits bounded by 2 times 64 times 2 to the 26, about 8.6e9, enforced
      by the budget and the stopping rules.'
  controls:
  - Closed-form null family with known attained advantage at every grid point, in the same invocation.
  - Zero-advantage control where the prover can answer no challenge, requiring exactly zero at every
    completing point.
  - Full-advantage control where the prover can answer every challenge, requiring exactly one and
    requiring the enumerator to terminate early if it claims any early-exit optimisation.
  - 'Determinism control: the same grid point run twice from the same seed must give identical node
    counts, confirming the enumerator has no nondeterministic ordering.'
  - 'Truncation validity control: a truncated bound at any explored fraction must never exceed the
    exact value at the same point.'
  - 'Memory ceiling control: a point deliberately set past the ceiling must terminate with a recorded
    status rather than crash.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: a protocol family whose attained advantage is known in
    closed form at every grid point, specifically one where the prover can answer exactly d of q challenges
    independently of its message, so the attained advantage is exactly d over q with no search required.
    The identical enumerator runs against it at every grid point in the same invocation. The null
    must return exactly d over q wherever it completes, and its node count must follow the same growth
    law as the signal family, since the tree shape is identical and only the payoffs differ. If the
    null returns a wrong advantage anywhere, the mapped region is a region of a broken instrument
    and no capacity number may be published. If the null''s node count differs from the signal family''s,
    the enumerator is pruning on payoff and the growth law is protocol-dependent, which must be reported
    rather than averaged away.'
  independent_variables:
  - challenge-space size q
  - round count r
  - prover branching factor b
  - protocol family (signal versus closed-form null)
  - truncation explored fraction
  metrics:
    primary:
    - node count per grid point
    - completion status per grid point
    - fitted growth exponents in q, r and b with residuals
    - reachable-region boundary table
    - truncated lower bound versus exact attained advantage per explored fraction
    secondary:
    - wall time per grid point on the named machine class
    - peak memory per grid point
    - attained advantage at completing points
    - determinism control mismatch count, required zero
    - count of points terminated by node budget versus by memory ceiling
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The node count n(q, r, b) required for complete enumeration at each grid point, the
      set of grid points completing within the node budget, and the gap between truncated and exact
      attained advantage at each named explored fraction.
    formula: 'Pre-registered growth model: n(q, r, b) equals C times q times b to the power r, for
      an implementation constant C measured from the smallest grid point. Pre-registered consequences:
      incrementing r multiplies n by exactly b; doubling q doubles n; the reachable region is the
      set of points with C times q times b to the power r at most 2 to the 26. Pre-registered null:
      the closed-form family returns attained advantage exactly d over q at every completing point
      and has node counts equal to the signal family within one percent.'
    source: Pre-registered in the parent proposal IDEA-20260816-c50b84 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The grid spans challenge spaces up to 1024, four rounds and branching up to 16,
      chosen so that a meaningful part of it completes within the node budget and the boundary falls
      inside the grid rather than beyond it. Transfer assumption, stated: node counts are machine-independent
      and are claimed to transfer across hardware, while wall times are explicitly machine-relative
      and are claimed to transfer nowhere. The growth model is fitted over four points per knob, which
      is enough to reject a badly wrong model and not enough to distinguish nearby ones, and that
      limitation is reported with the fit.'
    correspondence: null
  tail_checks:
  - Report the largest completing grid point individually, since it defines the boundary and averaging
    across the grid would hide it.
  - Report the points terminated by the memory ceiling separately from those terminated by the node
    budget, since they constrain different contracts.
  - Inspect the smallest explored fraction in the degradation map, since a truncated bound at one
    percent is where the lower bound is weakest and most likely to mislead.
  - Report the maximum determinism mismatch across repeated runs, which must be zero, since a single
    nondeterministic point invalidates every node count.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Terminate any grid point at the node budget or the memory ceiling and record the status; a terminated
    point is instrument data and never evidence about a protocol.
  - Halt the whole run if the closed-form null returns a wrong advantage at any completing point.
  - Cap total wall time at twelve hours; grid truncation is recorded as a budget outcome and the untested
    region is reported as untested rather than as unreachable.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if all controls pass, node counts are reproducible, the closed-form
    null returns exact advantages wherever it completes, and the boundary table, the fitted growth
    exponents with residuals, and the degradation curve are reported, whether or not the pre-registered
    growth model survives.
  falsification_criterion:
  - The closed-form null returns a wrong advantage at any completing point.
  - A truncated bound exceeds the exact value at any point.
  - Node counts are not reproducible across identical seeded runs.
  - Signal and null node counts differ by more than one percent at matched knobs, showing payoff-dependent
    pruning and making the table protocol-specific.
  - The pre-registered growth model's residuals exceed the frozen threshold, refuting the product
    form, which is reported as the result rather than as a failure.
  - The reachable region is empty at the node budget, in which case the required budget is named and
    no capacity claim is made.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c50b84
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The traversal ordering silently determines the degradation curve and must be specified and justified
    by the Coordinator, since a different ordering would produce a different answer to the most useful
    question this record asks.
  - Whether the structureless protocol family is a fair proxy for the structured protocols sibling
    contracts actually measure, or whether at least one structured family must be added to test payoff-dependent
    pruning directly.
  - The machine class description must be fixed precisely enough that the wall-time column is interpretable
    as context without inviting cross-machine comparison, which the blacklist explicitly places out
    of scope.
  - Whether the node budget of 2 to the 26 is the right operating point, or whether it should be set
    from the largest sibling contract's stated need so the table answers the question those contracts
    actually ask.
