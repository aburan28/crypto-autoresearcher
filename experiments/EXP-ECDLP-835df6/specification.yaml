  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-3054d2 under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    deck-type versus count degree calibrator.
    Semaev S_m, Velu, and the yield ratio k
    are later stages and are not run here.

  objective: >
    Evaluate the exact integer identity
    that Aut-type fibre count agrees
    with the count-read degree and
    translation-type fibre count
    disagrees, on one frozen family
    (REAL, KF, NULL) at m=3, and
    decide whether the deck-type
    calibrator works. Stage 0 does
    not form Semaev S_m and does
    not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL every
      affine t-fibre has size 6 and
      type_degree equals count_degree
      equals 6; KF max fibre is 8,
      type_degree is 2, count_degree
      is 8, and they disagree; NULL
      empty affine set rejected; p=0
      rejected. Certificate kind none.
    formula: >
      count_degree(g, m) = g ** (m-2).
      type_degree(aut, g, m) = g ** (m-2).
      type_degree(translation, g, m) =
      2 ** (m-2). Affine t-fibre of
      value t0 is the set of affine
      points with the named t-coordinate
      equal to t0. Frozen REAL: p=13,
      B=2, y^2 = x^3 + 2, t = x^3,
      fibres of t in {1, 8, 12} each
      have size 6. Frozen KF: p=17,
      d=3, x^2 + y^2 = 1 + 3 x^2 y^2,
      t = (x y)^2, fibre sizes
      {0:4, 4:4, 8:8, 15:8}, max 8.
      NULL is the empty affine set.
      Invalid is p=0. FORCED Stage 0:
      fixture_pass, real_count_pass,
      known_false_translation_pass,
      reject_invalid_pass,
      null_empty_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-05648a.yaml
      (S5) type-versus-count pair as
      Stage 0 hard-gate identity on
      frozen toys. Provenance internal;
      read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260905-05648a Stage 0 here is
    a disclosed tightening: the
    deck-type versus count degree
    dichotomy at frozen m=3 only, not
    the proposal's Semaev S_m^t, not
    the yield ratio k, not Velu.
    Exact fibre-size identities are
    the only Stage 0 arm.

  inputs:
    fixture:
      m_frozen: 3
      real_aut:
        id: REAL
        kind: aut
        p: 13
        B: 2
        t: x_cubed
        must_all_fibres: 6
        must_type_degree: 6
        must_count_degree: 6
        must_agree: true
        role: real_aut_j0
      known_false:
        id: KF
        kind: translation
        p: 17
        d: 3
        t: xy_squared
        must_max_fibre: 8
        must_type_degree: 2
        must_count_degree: 8
        must_disagree: true
        role: known_false_translation
      matched_null:
        id: NULL
        kind: empty_affine
        must_reject: true
        role: matched_null_empty_affine
      invalid:
        - id: p-zero
          p: 0
          must_reject: true
      working_model: >
        Exact deck-type versus count
        degree dichotomy at frozen m=3.
        Not Semaev S_m. Not Velu.
        Not a yield ratio k. Not
        elliptic M_S. Not an (L,b)
        meter. Not an Aut census.
        Not an orbit cost. Not a
        rho beat.
      do_not_form_semaev: true
      do_not_run_velu: true
      do_not_claim_yield_k: true
      do_not_form_elliptic_ms: true
      do_not_run_lb_meter: true
      do_not_enumerate_aut: true
      do_not_cost_orbit: true

  independent_variables:
    - object in the frozen family
    - deck kind aut versus translation
    - whether p is the frozen positive prime

  null_object:
    name: empty affine set at frozen m
    construction: >
      Replace the affine point list
      by the empty set. The dichotomy
      is not read. This is the nearby-
      object control with the fibre
      term removed.
    non_degeneracy_check: >
      known_false_translation_pass must
      be true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      p=0 must be rejected before an
      identity is read as a census.

  controls:
    - KF translation max-fibre 8 and type_degree != count_degree (known-false / proves-too-much)
    - REAL Aut all-fibres 6 and type_degree == count_degree
    - NULL empty-affine rejection of collapse
    - p=0 rejection
    - exact integer arithmetic, no floats
    - m frozen before any Semaev S_m is formed

  metrics:
    primary:
      - fixture_pass boolean
      - real_count_pass boolean
      - known_false_translation_pass boolean
      - reject_invalid_pass boolean
      - null_empty_pass boolean
    secondary:
      - REAL fibre sizes
      - KF fibre sizes
      - REAL type_degree
      - KF type_degree
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen fibre identities at
      p=13 and p=17. No transfer to
      Semaev S_m, a yield ratio, or
      cryptographic p.
    correspondence: null

  tail_checks:
    - REAL all fibres size 6 and type equals count
    - KF max fibre 8 and type disagrees with count
    - NULL empty affine is rejected
    - p=0 is rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_count_pass,
      known_false_translation_pass,
      reject_invalid_pass, and
      null_empty_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-DECKTYPE.
    - Stages 1 and later are not authorized.
    - Do not form Semaev S_m.
    - Do not run Velu.
    - Do not claim a yield ratio k.
    - Do not form elliptic M_S.
    - Do not run an (L,b) meter.
    - Do not enumerate Aut.
    - Do not cost an orbit.
    - Do not identify a rho cost.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen p, B, d, or t after this freeze
    - Forming Semaev S_m because a frozen identity fails
    - Reading Stage 0 as Semaev S_m, Velu, a yield ratio k, elliptic M_S, an (L,b) meter, an Aut census, orbit cost, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Authorizing Stage 1 of EXP-ECDLP-835df6 from this contract
