  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_count_pass,
    known_false_translation_pass,
    reject_invalid_pass, and
    null_empty_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not Semaev S_m
    and not an attack.

  falsification_criterion: >
    A certified KF miss of the
    type-versus-count disagreement
    after fixture_pass is a scoped
    miss of P-S0-DECKTYPE. A certified
    REAL identity miss after
    fixture_pass is a scoped miss of
    P-S0-DECKTYPE. Infrastructure bugs
    are not mathematics. Stage 0 does
    not test P-S1-SEMAEV.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
