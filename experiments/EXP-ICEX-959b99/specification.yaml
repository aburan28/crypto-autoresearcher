experiment:
  id: EXP-ICEX-959b99
  hypothesis_id: H-ICEX-760fd5
  derived_from_idea: IDEA-20260814-a67a1d
  question_id: RQ-ECDLP-002
  batch_id: BATCH-a70dc3
  version: 1
  title: >-
    Score one frozen online stopping rule against the best preregistered fixed
    overcollection rule on held-out Semaev relation streams, using an
    ORACLE-RELATIVE efficiency whose ceiling is measured on the same streams -
    because the source idea's absolute 0.85 target is computed to be unreachable
    unless the fixed rule's row surplus exceeds 17.6 percent - with exact prefix
    replay as the blocking instrument gate and a support-replacement decay ladder
    as the same-shape null
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. Whether the support-core evolution of a verified Semaev
    relation stream carries enough target-independent information to select a
    lower-cost stopping point once coefficient rank, retries, residual sparse
    linear algebra, back-substitution, masked target descent and emitted
    certificate bytes are ALL charged.

    (B) WHY THE SOURCE'S EFFECT SIZE IS REPLACED, COMPUTED BEFORE ANY RUN.
    IDEA-20260814-a67a1d pre-registers a held-out complete-cost ratio of at most
    0.85 in median. If the best preregistered fixed rule collects (1+s)B
    relations and generation dominates the complete cost, the BEST ratio
    achievable by any rule, including a perfect oracle, is about 1/(1+s).
    Reaching 0.85 therefore requires s at least 0.176. The source's design never
    measures s, so a cell with an 8 percent surplus would report a mechanism
    failure when what it measured was an absence of headroom. THE REPAIR IS A
    COMPUTED REPLACEMENT, NOT A LOOSENED THRESHOLD- the offline prefix replay the
    source already requires yields r_oracle for free, so the contract measures
    r_oracle FIRST, gates the cell on r_oracle at most 0.90, and scores the
    online rule by eta = (1 - r_online)/(1 - r_oracle). The dynamic range is
    supplied by r_oracle on the same streams, so the band cannot be degenerate.

    (C) A CORRECTED INHERITED PREMISE. The source's controls require reusing 'the
    exact thresholds used by IDEA-20260807-291968'. That record has none. This
    task read it and found status proposed with the claim that no record measures
    the prime-field oversampling factor, row-weight distribution, rank profile,
    sparse-solve exponent or memory footprint at all- it PROPOSES to measure the
    oversampling factor. Every fixed threshold in this contract is therefore
    derived on this contract's own calibration sizes, 12 and 14 bits, and nowhere
    else.

    (D) THE CURVE-FREE QUESTION IS ANSWERED BY PROOF, NOT BY AN ARM. Every state
    variable of the stopping rule reads ONLY the coefficient matrix and its
    support hypergraph- no curve parameter, factor-base point or target enters
    it. A curve-free arm of the POLICY is the identical computation on the
    identical matrix and would prove nothing, so it is not run and the reason is
    recorded. What IS run, and is required, is the same-shape null on the STREAM-
    matched random sparse matrices and a 0-to-100 percent support-replacement
    decay ladder - which tests whether the stream's matrix statistics differ from
    a same-shape random stream at all.

    (E) WHAT IS NOT DECIDED. No new relation source, no exponent improvement, no
    relation-abundance claim, no asymptotic transfer, no statement about
    cryptographic sizes.
  inputs:
    cost_unit: >-
      COMPLETE CHARGED WORK, in a single declared unit of elementary operations,
      identical for every stage and every arm. The declared decomposition, all in
      the same unit- relation generation including failed trials, deduplication,
      incremental reducer updates, core forecasts, peeling, sparse elimination,
      back-substitution, masked descent trials, and final verification. SEPARATELY
      and never divided into it- peak bytes and serialized certificate bytes,
      both in BYTES; wall clock in SECONDS.
    unit_discipline: >-
      BINDING. Tags in {ops, bytes, seconds, count, ratio, dimensionless}. Both
      sides of every ratio are in the same tag- r_online, r_oracle and eta are
      ops over ops and are dimensionless. A ratio mixing ops with bytes or
      seconds is refused.
    complete_cost_boundary: >-
      PREPROCESSING, reported separately- curve and factor-base construction,
      polynomial setup, sampler calibration, stopping-rule training, sparse-solver
      ordering, and every target-independent relation table, in ops, bytes and
      seconds.
      ADVICE, reported separately- model coefficients, thresholds, feature
      definitions, solver orderings, cached relation prefixes. ANY
      TARGET-SPECIFIC ENTRY invalidates reusable-setup accounting and moves into
      online cost.
      PER-ATTEMPT- every factor-base trial, polynomial solve, root enumeration,
      point-sum verification, deduplication, reducer update, core forecast,
      sparse solve, reverse peel, descent trial and final verification.
      SUCCESS AND RETRIES- collection-cap, coefficient-rank, factor-log and
      descent success reported SEPARATELY. Expected cost is the sum of work over
      the empirical retry tree INCLUDING censored failures; it is never the cost
      of one successful transcript.
      DATA AND OUTPUT- accepted rows, rejected-trial counts, coefficients, core
      matrices, fill, peel transcripts, factor logs, descent certificates and all
      emitted source indices. Outputting R rows costs at least R.
      MULTI-TARGET- target-independent preprocessing may be divided by T only for
      a DECLARED T on the identical curve and factor base, with each target's
      masked descent and retries charged online and the break-even T reported.
    freeze_manifest: >-
      Frozen and hashed BEFORE any held-out stream is generated- factor base,
      arity, signed-source convention, relation sampler, batch size, stopping
      features, calibration split, sparse solver ordering, descent rule, and
      every fixed threshold. The hash is recorded in every run manifest. A
      threshold changed after a held-out stream is read is leakage and voids the
      affected cells.
  controls:
  - >-
    C1 PREFIX REPLAY, BLOCKING, EXACT. Replay every complete stream at every
    prefix. The online reducer and an independent from-scratch reducer must agree
    EXACTLY - not within tolerance - on peel certificate, core support,
    coefficient rank, recovered factor logarithms and descent result. Any
    disagreement voids the cell.
  - >-
    C2 ORACLE HEADROOM MEASUREMENT, BLOCKING AND FIRST. From the same prefix
    replay, compute the oracle-optimal prefix and r_oracle per stream. A cell with
    median r_oracle above 0.90 is emitted UNDERPOWERED with r_oracle and the
    measured fixed-rule surplus s, and no eta verdict is computed for it.
  - >-
    C3 FIXED-THRESHOLD BASELINE, CALIBRATION-ONLY. Fixed row-surplus thresholds
    chosen on the 12- and 14-bit calibration sizes ONLY, and frozen. No threshold
    from any other record is used, because IDEA-20260807-291968 supplies none.
  - >-
    C4 MATCHED RANDOM-SUPPORT NULL. Same-shape random sparse matrices matched on
    row weights, column-degree histogram, duplicate rate, coefficient alphabet
    and row arrival times, scored under the identical accounting.
  - >-
    C5 DECAY LADDER, REQUIRED, SAME-SHAPE NULL ON THE STREAM. Progressively
    replace 0, 25, 50, 75 and 100 percent of real supports by degree-matched
    random supports while retaining coefficient alphabets. Any claimed
    elliptic-stream advantage must decay MONOTONICALLY toward the full null;
    failure to decay labels it a generic scheduling or implementation artifact.
    This is the canonical artifact tell and it is blocking for interpretation.
  - >-
    C6 ABLATIONS. Rank-only stopping and support-core-only stopping, to expose
    which omitted cost a naive rule would have hidden.
  - >-
    C7 ROW-ORDER PERMUTATION CONTROL. Permute the arrival order of the same
    verified relation multiset. Information is unchanged, so a large sensitivity
    means the rule is reading arrival order rather than structure.
  - >-
    C8 PLANTED POSITIVE CONTROL. Planted sparse matrices with a known peelable
    fringe and a known full-rank core. The reducer must find exactly the planted
    fringe and the planted core rank. A miss voids the instrument.
  - >-
    C9 COLLISION-FIBER SEARCH, REQUIRED. Enumerate prefixes with identical policy
    observables but different coefficient rank or different future optimal
    stopping point, and report the regret distribution over that fiber.
  - >-
    C10 LEAKAGE AUDIT. A static check that no policy feature reads the target,
    the secret scalar, the stream length, or any held-out quantity. A hit voids
    every number.
  - >-
    C11 CURVE-FREE STATUS, RECORDED AS A PROOF AND NOT RUN AS AN ARM. The
    executor records, in the run report, the enumerated list of policy state
    variables together with the assertion - checkable by inspection of the policy
    source - that each is a function of the coefficient matrix and its support
    hypergraph alone. NO CURVE-FREE POLICY ARM IS RUN, because it would be the
    identical computation. If the enumeration finds ANY state variable reading a
    curve parameter, factor-base point or target, this control FAILS and a
    curve-free arm becomes mandatory.
  independent_variables:
  - bit size in {12, 14, 16, 18, 20, 22}
  - arity m in {3, 4}
  - stopping policy in {frozen online rule, best fixed threshold, rank-only ablation, support-core-only ablation}
  - support-replacement fraction in {0, 0.25, 0.50, 0.75, 1.00}
  - row arrival order in {as-generated, permuted}
  metrics:
    primary:
    - >-
      r_oracle per stream and its median per cell, dimensionless ops over ops,
      measured by offline prefix replay before any online scoring.
    - >-
      eta = (1 - r_online)/(1 - r_oracle), median and 90th percentile per
      informative cell, dimensionless.
    - >-
      exact prefix-replay agreement fraction for peel set, core support,
      coefficient rank and recovered logarithms; required value exactly 1.000000.
    secondary:
    - r_online, the absolute held-out complete-cost ratio, with the measured fixed-rule surplus s beside it
    - verified trials and accepted relations per prefix
    - duplicate-support and duplicate-row rates
    - peel pivots, core rows, core columns, coefficient rank and projected fill
    - generation, peeling, sparse-LA, back-substitution, descent and retry work, each in ops
    - peak bytes and serialized certificate bytes
    - factor-log solve and masked-descent success rates, reported separately
    - total-variation distance in the joint normalised core-size and fill distribution against the matched null
    - the same distance at each rung of the support-replacement ladder
    - regret distribution over the collision fiber, with its median
    - row-order permutation sensitivity
    - planted-control fringe and core-rank recovery
    - the enumerated policy state variables and the curve-free proof assertion
  heuristic_under_test: H-CORE-2
  preregistered_prediction:
    quantity: >-
      The fraction of the available complete-cost saving that one frozen
      target-independent online stopping rule captures on held-out streams.
    formula: >-
      'r_oracle := (complete cost at the oracle-optimal prefix)/(complete cost of
      the best preregistered fixed threshold); eta := (1 - r_online)/(1 -
      r_oracle). PRE-REGISTERED- a cell is INFORMATIVE only if median r_oracle is
      at most 0.90. On informative cells, eta at least 0.60 at the median with
      90th-percentile r_online at most 1.00 records an advantage; eta at most
      0.20 records none; between is INCONCLUSIVE. SECONDARY AND CONDITIONAL-
      r_online at most 0.85, reachable only if the measured fixed-rule surplus s
      satisfies s at least 0.176, since the perfect-oracle ceiling is about
      1/(1+s).'
    source: >-
      Derived in H-ICEX-760fd5 statements (B) and (C) from the complete-cost
      accounting declared in this contract. The 1/(1+s) ceiling is elementary
      arithmetic on a generation-dominated cost and is stated here as the
      contract's own derivation, not as a citation. No external source backs the
      0.60 and 0.20 eta thresholds; they are pre-registered tolerances and are
      UNTESTED EXPECTATIONS, not measurements.
  scale_relevance:
    tier: toy
    justification: >-
      12 to 22 bits, arity 3 and 4, at least 50 complete streams per completed
      cell, every recovered logarithm verified by scalar multiplication. The
      ladder stops at 22 bits because a COMPLETE pipeline - harvest, peel,
      coefficient solve, retries and masked descent - must run to completion at
      least 50 times per cell within the declared budget. NO transfer to
      cryptographic sizes is claimed and no scaling law for relation
      probability, core size, coefficient rank, fill or descent exists to
      support one.
    correspondence: null
  tail_checks:
  - >-
    Report the 90th and 99th percentile of r_online, not only the median. A
    median advantage with a heavy right tail is a scheduling rule that
    occasionally costs much more, and the 90th-percentile bound at 1.00 is the
    guard against it.
  - >-
    Report the descent retry survival curve and its censored caps, and compare
    the empirical retry total against the geometric-attempt baseline. A tail too
    heavy for a finite expectation inside the cap voids H-CORE-3 and with it any
    complete-cost ratio.
  - >-
    Report the maximum per-cell total-variation distance from the matched null
    and the rung of the replacement ladder at which the separation vanishes.
  - >-
    Report the worst regret over the collision fiber, not only the median. A
    small median with a large worst case means the policy state is insufficient
    on a subpopulation.
  replication:
    seeds: [2, 7, 17, 31, 43, 61, 79, 97, 113, 131]
    independent_instances: 50
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 16
    maximum_runs: 400
    maximum_workers: 1
  stopping_rules:
  - >-
    Freeze and hash the manifest before generating any held-out stream. No cell
    runs against an unfrozen manifest.
  - >-
    Run C1, C8 and C10 first at the calibration sizes. Abort the run set on
    failure of any of them.
  - >-
    Measure r_oracle by prefix replay before scoring any online rule on a cell.
    A cell with median r_oracle above 0.90 is emitted UNDERPOWERED and no online
    scoring is run on it.
  - >-
    Stop a cell after 20 failed collection caps, or when the confidence interval
    on eta can no longer exclude both 0.20 and 0.60, or at the declared budget,
    whichever is first. Record which of the three ended it.
  - >-
    Run sizes in ascending order. Calibration sizes 12 and 14 first; thresholds
    frozen; then held-out sizes 16, 18, 20, 22.
  - >-
    Run the decay ladder C5 at every informative held-out cell, in the order
    100, 75, 50, 25, 0 percent replacement, so the real-stream arm is scored
    last.
  invalidation_rules:
  - Prefix replay C1 disagrees in any completed cell; that cell is void.
  - The planted positive control C8 fails; the reducer is wrong and every cell is void.
  - The leakage audit C10 finds a policy feature reading a target, a secret scalar, or a held-out quantity.
  - >-
    The curve-free proof control C11 finds any policy state variable reading a
    curve parameter, factor-base point or target. The stated proof is false, the
    contract's curve-free reasoning is withdrawn, and a curve-free policy arm
    becomes mandatory before any interpretation.
  - Any threshold changed after a held-out stream was read; the affected cells are void, not corrected.
  - Any charged quantity recorded without its unit tag, or any ratio formed across two tags.
  - A recovered logarithm not verified by scalar multiplication.
  - >-
    Collection-cap, wall-clock or memory exhaustion. failed_infrastructure under
    AGENTS.md rule 5, never evidence about the stopping rule.
  success_criterion: >-
    The contract delivers its object when- the manifest is frozen and hashed
    before any held-out stream; C1, C8 and C10 pass; r_oracle and the fixed-rule
    surplus s are reported per cell; every informative cell reports eta with its
    median, 90th percentile and bootstrap interval and a branch verdict; every
    underpowered cell reports r_oracle and s with an UNDERPOWERED flag; the decay
    ladder and matched null are reported at every informative cell; the
    collision-fiber regret distribution is reported; and the curve-free proof
    control C11 is reported with its enumerated state-variable list. Neither
    branch outcome is called a success.
  falsification_criterion: >-
    L1 INSTRUMENT, BLOCKING. Prefix replay C1 disagrees anywhere, or the planted
    control C8 fails. Nothing is interpreted.

    L2 UNDERPOWERED, NOT SHRUNK. Median r_oracle above 0.90 at a cell. Under 10
    percent of complete cost is on the table; the cell is UNDERPOWERED, its
    r_oracle and s are reported, and NO verdict about the stopping rule may be
    drawn from it. Reporting such a cell as a negative is a breach of this
    contract.

    L3 NO ADVANTAGE. eta at most 0.20 at the median on two successive informative
    sizes, or 90th-percentile r_online above 1.00 on the largest informative
    size. The online rule captures effectively none of the available saving; the
    simpler fixed policy dominates on the tested scope, and the honest headline
    is a controlled null.

    L4 ADVANTAGE, SCOPED. eta at least 0.60 at the median with 90th-percentile
    r_online at most 1.00 on the three largest informative sizes, AND the decay
    ladder shows monotone decay toward the matched null, AND collision-fiber
    median regret is at most 0.05, AND descent success loss is at most 0.02
    absolute. Then a held-out toy scheduling advantage is recorded for THIS
    generator, THESE sizes and THIS accounting - and for nothing else.

    L5 RANK DECEPTION. A support-predicted cheap core is coefficient-rank
    deficient often enough that charged retries erase the collection saving. The
    lossy projection is the failure and the composition is falsified.

    L6 OMITTED COST. The advantage exists only when generation failures, residual
    fill, target descent or emitted certificate bytes are omitted. Void.

    L7 SAME-SHAPE NULL, CONSEQUENCE PRE-STATED. If the separation from the
    matched random-support null does not decay monotonically across the
    replacement ladder, or if the total-variation distance at 0 percent
    replacement is below 0.10, then the scheduling effect is GENERIC to sparse
    matrices of this shape, carries no statement about Semaev relation streams,
    and must be reported as a controlled null rather than as a result about
    elliptic-curve relation collection.

    L8 CURVE-FREE PROOF FAILS. C11's enumeration finds a policy state variable
    reading a curve parameter, factor-base point or target. The proof recorded in
    H-ICEX-760fd5 statement (E) is false; it is withdrawn by a superseding record
    and a curve-free policy arm is run before anything is interpreted.

    L9 LEAKAGE. Any threshold selected after a held-out stream was read. The
    affected cells are void.
  required_artifacts:
  - frozen manifest and its hash, recorded before any held-out stream is generated
  - exact command, git commit, dirty-tree state, environment and dependency versions
  - all seeds, curve parameters, factor bases and sampler settings
  - the complete relation stream and every prefix replay transcript, per stream
  - the from-scratch reducer's output at every prefix, for the C1 comparison
  - r_oracle per stream, the oracle-optimal prefix, and the fixed-rule surplus s
  - r_online and eta per stream with bootstrap intervals per cell
  - peel pivots with coefficients, retained core matrices, fill, and reverse-substitution edges
  - matrix hash, residual solve transcript, factor-log checks, masked-descent relation and final scalar-multiplication verification, per solved target
  - stage-by-stage charged work in ops, plus peak bytes and serialized certificate bytes
  - matched-null and support-replacement-ladder statistics per rung
  - collision-fiber enumeration with its regret distribution
  - row-order permutation sensitivity and planted-control recovery
  - the enumerated policy state variables and the C11 curve-free proof assertion
  - the leakage-audit report
  - stdout, stderr, timestamps, resource measurements, and per-cell validity status with reason
  assigned_to: executor
  approved_by: null
