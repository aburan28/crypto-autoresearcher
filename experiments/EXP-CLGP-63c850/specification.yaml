experiment:
  id: EXP-CLGP-63c850
  hypothesis_id: H-CLGP-26d035
  derived_from_idea: IDEA-20260821-3d5f22
  question_id: RQ-CLGP-b99df5
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exhaustive edge-character table on one ordinary toy level with a solver-independent loop certificate,
    and a held-out predictability test of chi_l from cheap poly-time vertex labels against a
    random-relabelling null, an h = 3 crater control and an adversarial-labelling positive control
  objective: >-
    The one uncertainty a run reduces is whether the edge character chi_l(E) -- under ONE concrete
    poly-time labelling, least-x -- carries torsor information recoverable from cheap vertex labels, which
    is the only decision-relevant question the cardinality bound leaves open in this lane. A run
    establishes (i) the principal-residue rule chi((alpha)) = u + v mod N on a toy curve, which is the
    baseline-embedding gate; (ii) the full edge table (E, l, E', chi) computed by exhaustive discrete
    logarithm in a group of order 331, so no hardness assumption enters the measurement; (iii) the LOOP
    CERTIFICATE -- the product of chi around every closed walk against the independently computed
    principal residue -- which validates the whole pipeline WITHOUT reference to the hypothesis under
    test; (iv) the held-out predictor accuracy on the real, random-relabelling-null and crater-control
    arms, with the minimum detectable effect reported BEFORE the fit; and (v) the chi uniformity statistic
    with its power, which is a finding about the least-x labelling in its own right. NO ECDLP CLAIM CAN
    FOLLOW from any outcome; the cardinality bound forecloses that direction independently of every
    measurement.
  what_this_is_not:
    - >-
      Not an ECDLP result and not a route to one. The compression bound forecloses the ECDLP direction
      through this bridge independently of every measurement, and this contract may not be cited as if it
      could produce one.
    - >-
      Not a claim about all labellings. A collision exists by construction -- some labelling makes chi
      identically 1 on a spanning tree and another makes it injective on a cyclic subgroup -- so the
      experiment is about ONE concrete labelling and generalises to no other.
    - >-
      Not a statement about supersingular class-group-action constructions, which live on a different
      endomorphism structure; relevance there is not asserted and would need its own argument.
    - >-
      Not a vectorization attack. Even a positive predictor would need its end-to-end cost charged against
      a sqrt(h) meet-in-the-middle baseline at identical parameters before the word "faster" is used.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
      been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: "on this toy class at N = 331, for the least-x labelling and these split
      primes, a predictor built from this feature set does (or does not) beat chance by delta, with the
      stated minimum detectable effect", together with the loop-certificate pass rate and the chi
      uniformity statistic. WHAT DOES NOT FOLLOW: nothing about other labellings; nothing about
      cryptographic N; no ECDLP consequence; and no vectorization speedup absent an end-to-end matched
      charge. A null at N = 331 bounds only LARGE effects, and the bound is exactly the reported minimum
      detectable effect.
  inputs:
    procedure: >-
      STEP 1 (zero compute, GATE). Derive n = (331, pi - 1), verify N(pi - 1) = 3972 and that 331 exactly
      divides 3972, and verify the principal-residue rule chi((alpha)) = u + v mod 331 symbolically AND on
      one curve by computing [alpha]P directly against [u + v mod 331]P for several alpha in O. HALT ON
      FAILURE; the O-module identification would be wrong and every later arm void. STEP 2. On ONE level
      of the p = 4001 class (the h = 72 floor is the richest; the h = 3 crater is the control), build the
      horizontal l = 3, 5, 7 isogeny graph with the existing point-based tooling, ASSERTING 2-regularity
      at every vertex and component size h; and for every edge compute chi_l(E) by exhaustive discrete
      logarithm in a group of order 331 under the least-x labelling, with the lifting routine asserting
      order exactly 331 so a point of order dividing the cofactor 12 cannot be mistaken for a generator.
      Archive every (E, l, E', rho(E), rho(E'), phi_l(rho(E)), chi) tuple. STEP 3 (THE CERTIFICATE).
      Verify the cocycle law on EVERY closed loop against the independently computed principal residue,
      using a checker that does not call the isogeny construction code. This validates the whole pipeline
      without reference to the hypothesis. STEP 4 (THE DISCRIMINATOR). Fit a predictor of chi_l(E) from
      the cheap vertex label set -- j-invariant and its ordinal position among the Hilbert class
      polynomial roots, rational-2-torsion / group-structure / volcano-level DECLARED AS ONE FEATURE
      because they coincide on this class, and the least-x value itself -- with STRICT held-out splitting
      and a 10^4-draw permutation test; run the identical fit on the random-relabelling null and on the
      h = 3 crater control; report accuracy, the minimum detectable effect and all three arms.
    instrument: >-
      Exhaustive discrete logarithm in a group of order 331, which is why the toy scale was chosen: no
      discrete-logarithm hardness assumption enters the measurement. Horizontal isogenies by the existing
      point-based tooling only; NO VERTICAL ISOGENY IS USED, because the vertical/conductor-prime
      construction is recorded as unimplemented and the design must not depend on it. The loop-certificate
      checker is written so it never calls the isogeny construction code, making it solver-independent.
      Recorded through harness/runner.py.
    parameters: >-
      p = 4001, t = 30, #E = 3972 = 2^2 * 3 * 331, N = 331, cofactor 12, D_0 = -59. Split primes
      l in {3, 5, 7}, of which only l = 3 divides #E and therefore only l = 3 is assured a rational
      kernel. Floor level h = 72 (the signal arm), crater level h = 3 (the nearby-object control), and an
      h = 36 level for replication. 72 curves times 3 split primes = 216 edges, computed EXHAUSTIVELY and
      not sampled. Permutation null at 10^4 draws. Chance accuracy 1/330 = 0.0030. The minimum detectable
      effect is computed and reported BEFORE the fit.
  controls:
    - >-
      NULL OBJECT, RANDOM-RELABELLING NULL: replace rho(E') by a uniformly random generator of G_{E'} per
      curve, which makes chi uniform BY CONSTRUCTION because the action is simply transitive. The
      predictor MUST fail there. Success on this null means the predictor is fitting the label set rather
      than chi, and the positive arm is VOID.
    - >-
      POSITIVE CONTROL: an adversarially chosen labelling for which chi IS a known function of a cheap
      label (for example rho defined so that chi_l equals the ordinal index of j mod N). The predictor
      MUST find it, or it cannot support a negative.
    - >-
      NEARBY-OBJECT CONTROL: the h = 3 crater level, where the torsor has three elements and vectorization
      is trivially easy, so any predictor MUST succeed. Failure there voids every negative read from the
      h = 72 level.
    - >-
      SOLVER-INDEPENDENT CERTIFICATE: the loop identity of Step 3, re-verified by a checker that does NOT
      call the isogeny construction code. Its forced value is 100 percent with zero tolerance.
    - >-
      BASELINE-EMBEDDING GATE: the principal-residue rule reproduced symbolically and on one curve, with
      the (alpha, u, v, residue, point) tuples archived as a frozen fixture.
    - >-
      MATCHED BASELINE FOR ANY VECTORIZATION CLAIM: if the predictor succeeds, its end-to-end cost must be
      charged against a sqrt(h) meet-in-the-middle vectorization baseline at the IDENTICAL parameters,
      including the cost of computing every label and every isogeny. An unmatched "faster" is not a result.
    - >-
      RHO / BSGS MATCHED CONTROLS on the ECDLP side, recorded even though no ECDLP claim is made, so the
      record's cost statements are comparable as the research question requires.
    - >-
      FEATURE-COLLINEARITY DECLARATION: the rational-2-torsion count, the group structure and the ell = 2
      volcano level are the SAME quantity on this class and are declared as ONE feature; treating them as
      three would triple the apparent search without adding information.
  independent_variables:
    - split prime l, one of 3, 5, 7 (subject to constructibility)
    - level, one of the h = 72 floor (signal), h = 3 crater (control), h = 36 (replication)
    - >-
      labelling arm, one of least-x (real), uniformly random per curve (null), or the adversarially chosen
      labelling (positive control)
    - feature subset used by the predictor
  metrics:
    primary:
      - >-
        loop_certificate_pass_rate, units a fraction of closed walks, computed as the fraction for which
        the product of chi around the loop equals the independently computed residue alpha mod n of the
        principal ideal it represents. FORCED VALUE 100 percent, zero tolerance.
      - >-
        principal_residue_agreement, units a fraction of tested alpha, computed as the fraction for which
        [alpha]P on the curve equals [u + v mod N]P. FORCED VALUE 100 percent, zero tolerance.
      - >-
        predictor_accuracy_held_out, units a fraction of correct predictions of chi_l(E) in (Z/N)^*,
        computed on held-out curves per tested split prime l, against the 10^4-draw permutation null's
        99th percentile
      - >-
        minimum_detectable_effect, units an accuracy advantage over chance, computed at the realised
        sample size BEFORE the fit and reported beside every verdict. An effect below it is REFUSED
        interpretation rather than reported with a p-value.
    secondary:
      - >-
        crater_control_accuracy, units a fraction, on the h = 3 level; must be near 1.0
      - >-
        random_relabelling_null_accuracy, units a fraction; must be at chance 1/330 within Monte-Carlo
        error
      - >-
        adversarial_labelling_positive_control_accuracy, units a fraction; the predictor must find the
        planted dependence
      - >-
        chi_uniformity_statistic, units a Kolmogorov-Smirnov or chi-square distance from uniform on
        (Z/N)^*, reported WITH ITS POWER
      - >-
        compression_ratio_N_over_h, units dimensionless, computed for the tested class and for a
        cryptographic-size reference; arithmetic, reported to give OBS-CARD units rather than a verdict
      - >-
        graph_regularity_check, units vertex degrees and component sizes, per split prime; degree must be
        2 at every vertex and components must have size h
      - >-
        the full edge table (E, l, E', chi) with the labelling used, archived rather than summarised
      - >-
        end-to-end cost of any successful predictor against the sqrt(h) baseline, units group-action
        evaluations, in both the large-memory and the O(1)-memory model
  heuristic_under_test:
    id: H1
    formal_statement: >-
      LABEL-INDEPENDENCE. For the least-x labelling and split primes l coprime to the conductor, the edge
      characters chi_l(E) behave, as E ranges over one level, like independent uniform draws from
      (Z/N)^*, independent of every poly(log p)-computable vertex label of E and l*E.
    companion_heuristic:
      id: H2
      formal_statement: >-
        HORIZONTAL CONSTRUCTIBILITY. For each tested split prime l, BOTH horizontal l-isogenies from each
        curve of the level are constructible by the existing point-based tooling, so the measured graph is
        the true horizontal graph and not a sub-graph biased toward curves with convenient rational
        kernels.
    scale_access_and_transfer: >-
      SAMPLE: all 72 curves of the floor level times 3 split primes = 216 edges, EXHAUSTIVELY and not
      sampled; repeated on the h = 36 level for replication. THE SHORTCUT THAT MAKES THIS FEASIBLE:
      N = 331 makes the discrete logarithm defining chi exhaustive, so no hardness assumption enters the
      measurement -- the toy scale is chosen for exactly this reason. COMPARISON: empirical distribution
      of chi against uniform on (Z/N)^*, and predictor accuracy against a 10^4-draw permutation null. TAIL
      CHECK: the most frequent chi value against the uniform multinomial upper quantile. TRANSFER: NONE is
      claimed from N = 331 to cryptographic N; the transfer assumption that would be needed -- that
      label-independence is not an artifact of small N -- is stated and is NOT discharged by this
      experiment.
  preregistered_prediction:
    quantity: >-
      predictor_accuracy_held_out of chi_l(E) from the cheap vertex label set, per tested split prime,
      against the permutation null's 99th percentile; and loop_certificate_pass_rate.
    formula: >-
      Predicted, before any run: loop_certificate_pass_rate = 100 percent and
      principal_residue_agreement = 100 percent, both zero tolerance; predictor_accuracy_held_out at
      chance 1/330 = 0.0030 within Monte-Carlo error on the real arm, for every feature subset and every
      tested l; random_relabelling_null_accuracy at chance; crater_control_accuracy near 1.0;
      adversarial_labelling_positive_control found; compression_ratio_N_over_h at least sqrt(N) up to the
      class-number constant. Under the alternative, the predictor beats the permutation null's 99th
      percentile by more than the reported minimum detectable effect and survives both nulls.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-3d5f22, whose predictions block states every
      forced value above and whose H1 falsification condition requires replication on a second level or a
      second prime. The requirement to compute and report the minimum detectable effect BEFORE the fit,
      and to refuse interpretation below it rather than quoting a p-value, is stated there as well. Never
      tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      p = 4001 and N = 331 are chosen so the discrete logarithm defining chi is EXHAUSTIVE, which is what
      makes chi directly measurable with no hardness assumption; the level is enumerated completely rather
      than sampled. The cost is severe and is stated first: at N = 331 chance accuracy is 0.30 percent and
      72 curves give a predictor almost no data, so overfitting is the default outcome, a null bounds only
      LARGE effects, and the minimum detectable effect must be computed and reported before the fit. No
      transfer to cryptographic N is claimed or offered.
    correspondence: null
  tail_checks:
    - >-
      Report the most frequent chi value against the uniform 1/330 multinomial upper quantile, as the tail
      check on H1.
    - >-
      Report the minimum detectable effect BEFORE the fit and beside every verdict; refuse to interpret an
      effect below it rather than quoting a p-value.
    - >-
      Report vertices of degree 0 or 1 per split prime; they localise exactly where the point-based tooling
      fails and are the honest place to stop.
    - >-
      Report per-feature-subset accuracies, not only the best, so the multiple-comparison burden is
      auditable and a chance maximum is visible as one.
    - >-
      Report the loop certificate per loop, not only its aggregate rate, since a single failing loop is an
      implementation error and must not be averaged away.
  replication:
    seeds:
      - 20260821
      - 20260822
      - 20260823
    independent_instances: 3
  budget:
    wall_clock_seconds: 7200
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    memory_gb: 8
    maximum_memory_gb: 8
    maximum_runs: 16
  stopping_rules:
    - >-
      Step 1 is a GATE. If N(pi - 1) is not 3972, or 331 does not exactly divide 3972, or the
      principal-residue rule fails, HALT; the O-module identification is wrong and every later arm is void.
    - >-
      Halt if the loop certificate fails anywhere. The implementation is wrong and no mathematical
      conclusion may be drawn.
    - >-
      If the horizontal graph is not 2-regular for l = 5 or l = 7, run the experiment on l = 3 ALONE and
      SAY SO. Do not substitute a different construction silently and do not use a vertical isogeny.
    - >-
      Run the crater control and the adversarial-labelling positive control BEFORE any negative is read.
      If either fails, mark the run attempted and inconclusive; do not record a negative.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop, never
      a negative result (AGENTS.md rule 5).
    - >-
      The feature set, the labelling, the permutation draw count and the collinearity declaration are
      frozen before any fit and are not revised afterwards.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is
      NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose loop certificate does not pass at 100 percent is invalid: the failure is an INSTRUMENT
      finding rather than evidence, and nothing mathematical is reportable.
    - >-
      A run in which the crater control fails at h = 3, or the adversarial-labelling positive control is
      not found, is invalid for recording any negative.
    - >-
      A run whose random-relabelling null arm is missing, or was not executed in the same invocation as the
      real arm, is invalid_measurement.
    - >-
      A run whose lifting routine did not assert order exactly 331 is invalid_measurement: a point of order
      dividing the cofactor 12 could have been taken as a generator, which is the degeneracy family that
      has already cost this campaign a retracted measurement.
    - >-
      A run reporting a predictor verdict WITHOUT the minimum detectable effect is invalid_measurement: it
      produced no bound.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: N(pi - 1) = 3972
    and 331 exactly divides it; principal_residue_agreement is 100 percent;
    loop_certificate_pass_rate is 100 percent under a checker that never calls the isogeny construction
    code; the horizontal graph's regularity and component sizes are reported per split prime, with the
    scope reduced to l = 3 and stated if l = 5, 7 are not constructible; the crater control is near 1.0 and
    the adversarial-labelling positive control is found; the random-relabelling null is at chance; and
    predictor_accuracy_held_out is reported per feature subset and per split prime ALONGSIDE the minimum
    detectable effect, with the chi uniformity statistic and its power. Each is decidable from the primary
    metrics above. Note explicitly: chance accuracy and above-chance accuracy are BOTH successes of the
    measurement; the criterion is completeness, and the scientific verdict is read from the falsification
    criteria below.
  falsification_criterion:
    - >-
      The predictor beats the permutation null's 99th percentile by more than the reported minimum
      detectable effect, and survives the random-relabelling null and the crater control, replicated on a
      second level or a second prime. H1 IS FALSIFIED: a partial poly-time trivialisation of the torsor
      exists for this labelling. This becomes a VECTORIZATION lead, NOT an ECDLP result, and must be routed
      to an independent review-adversarial session with its end-to-end cost charged against the sqrt(h)
      baseline before any comparative statement.
    - >-
      The loop certificate fails anywhere. The implementation is wrong; this is an instrument finding and
      no mathematical conclusion of any kind may be drawn.
    - >-
      The principal-residue rule fails. The O-module identification is wrong and every arm is void.
    - >-
      The crater control fails at h = 3. The instrument cannot detect a signal it is guaranteed to face; no
      negative may be recorded and the run is attempted and inconclusive.
    - >-
      The predictor succeeds on the RANDOM-RELABELLING null. It is fitting labels rather than chi and the
      positive arm is void.
    - >-
      The predictor is at chance on every feature subset and every tested l WHILE the crater and positive
      controls pass. C5's optimistic branch is REFUTED at this scope: the least-x labelling carries no
      torsor information recoverable from these cheap labels, and the obstruction is measured with a stated
      minimum detectable effect.
    - >-
      NOT a falsification: the horizontal graph failing to be 2-regular for l = 5 or 7. That is H2 failing
      for those primes, is the most likely practical failure, and reduces the SCOPE to l = 3 rather than
      producing a negative.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, and the frozen feature set and labelling
    - >-
      the full edge table (E, l, E', rho(E), rho(E'), phi_l(rho(E)), chi) with the labelling used, archived
      in full rather than summarised
    - >-
      loop-certificate pass rate PER LOOP and the independently computed principal residues
    - >-
      predictor accuracy with held-out splits on the real, random-relabelling-null and crater arms, plus
      the adversarial-labelling positive control's result
    - >-
      the predictor's minimum detectable effect at the realised sample size, computed before the fit
    - >-
      the chi uniformity statistic with its power
    - >-
      the compression ratio N/h at the tested parameters and at a cryptographic-size reference
    - >-
      end-to-end cost of any successful predictor against the sqrt(h) baseline, in both memory models
    - >-
      artifact manifest with hashes and a from-scratch rebuild receipt
    - >-
      certificate: the loop identity is the solver-independent certificate for this run, re-verifiable by
      code that never touches the isogeny construction
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is the
      user's gate because it authorizes execution and spends compute.
    - >-
      The parent proposal carries a proof_search_map; it must be audited against KN-TECH-080 before
      implementation. Steps 1 and 3 (the gate and the certificate) are the cheap part of that audit.
    - >-
      The RECALLED vectorization incumbents (about sqrt(h) = p^{1/4} classically; subexponential
      quantumly) must be confirmed by a reviewer with retrieval BEFORE any comparison is recorded, since a
      positive outcome's entire value is measured against them.
    - >-
      A predictor that beats chance and survives both nulls triggers mandatory routing to an independent
      review-adversarial session before any statement is recorded. That routing must be fixed in the
      handoff, not decided after the result.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-3d5f22
    authored_at: '2026-08-25'
    note: >-
      Every metric, control, forced value and falsification condition is transcribed from the parent
      proposal's claims C1-C5, predictions, minimal_test, controls, required_metrics and
      falsification_conditions blocks, or from its heuristics H1 and H2. The parent's own honest priors are
      carried into the design rather than hidden: 0.95 that C1-C3 verify, 0.98 that C4's arithmetic holds,
      0.6 that the horizontal graph is constructible at l = 3, only 0.25 that l = 5 and 7 are, and 0.1
      that the predictor beats chance -- which is why H2's failure is pre-registered as a SCOPE reduction
      rather than a negative. Boilerplate identical across contracts by program rule comes from a fixed
      table. Budgets come from the parent's declared estimated_cost of implementation medium and compute
      low.
  derivation_gaps:
    - >-
      HORIZONTAL CONSTRUCTIBILITY FOR l = 5 AND l = 7 IS THE LIKELIEST PRACTICAL FAILURE. Neither divides
      #E = 3972, so their kernel points are not F_p-rational and the point-based tooling may reach only a
      sub-graph. The contract pre-registers the l = 3-only fallback, but a coordinator should decide before
      approval whether an l = 3-only run is worth the budget, since 72 edges is a very small sample.
    - >-
      The G = E[n] identification is inherited from records read only as one-line digest claims. The
      executor must re-derive it independently; a contract that inherits it would rest on an unread claim.
    - >-
      The predictor family and its regularisation are not fully specified beyond "a poly-time predictor
      from cheap labels". They must be pinned before approval, since at 72 samples and 330 classes the
      choice of model IS the experiment.
    - >-
      The multiple-comparison burden across feature subsets, split primes and levels is acknowledged but no
      correction is named. It must be fixed in the frozen contract.
    - >-
      The h = 36 replication level is named in the parent's validation plan but its constructibility is not
      established; if it is unreachable, H1's falsification condition (replication on a second level or a
      second prime) may be unsatisfiable and that must be known before approval.
    - >-
      The minimum-detectable-effect computation method is not specified. Since the contract makes it a
      blocking deliverable and an invalidation rule, its estimator must be named before approval.
