    "coverage": {
      "domain": "Primary actual membership domain is the multiset of m elements from D_pm={+D_i,−D_i:0<=i<B}, a set of2B distinct points. Repeated elements and both signs of the same class are allowed. Count each signed-point multiset once. Total cardinality binomial(2B+m−1,m), so exact uniform mean is this value/N. The original binomial(B+m−1,m)/N is preserved for the separate positive-representative-only multiset domain; it is not the signed membership mean. Also report distinct-class signed domain2^m*binomial(B,m) and the source B^m/m! approximation separately.",
      "smallest": "For every primary16-bit cell enumerate all signed-point multisets in nondecreasing signed-symbol order, sum by independent group arithmetic and tally every target, includingO. Produce the exact full multiplicity histogram and reachable-set cardinality. Repeat the positive-only enumeration to check the literal original mean identity. The checker never supplies this table to membership. Select all 100 deterministic completeness-control targets from this table only after it is fixed, while preserving the separate blind primary targets. Select the100 distinct control targets by H(coverage-check-target,bits,seed,m,counter) uniform-residue rejection with duplicate rejection, using all targets if N<100. Their check requires complete algebraic versus independent group witness sets, not only existence.",
      "larger": "At20/24 bits, use4096 independent uniform scalar targets for a checker-only coverage sample. Build complete pair/triple sum indexes over signed symbols using their public scalars, with nondecreasing indices. For m3 use1+2, m4 use2+2, m5 use2+3 canonical split; join only when the final left index<=the first right index, so each full multiset appears exactly once. Store all matching witnesses or boundary-index counts, not only a boolean hash. Report both exact match count and coverage per sampled target. Independently check every returned positive sample’s canonical witness by group arithmetic, and for the first32 sampled targets cross-check counts by direct group-tuple enumeration; this checker work is fully reported but never substitutes for the Semaev engine.",
      "attempts": "Let rho=|reachable signed m-sums|/N. IID uniform masks make each query success probability rho, so the geometric expectation is1/rho. At16 bits rho is exact. At20/24 bits provide Wilson95% intervals and an interval for1/rho, allowing an infinite upper endpoint if no successes. Retain the original prediction attempts per success in[1,2]*m!/coverage as a literal separate band using this explicitly defined coverage. It may fail while the corrected geometric model passes. Never multiply by m! again after measuring actual coverage. Do not invalidate valid observations merely for violating the source’s incorrect factor.",
      "checks": "Exact integer total-count equality is required for each enumerated tuple convention; no tolerance for an exact identity. For sampled means use empirical variance, bootstrap intervals and the known exact cardinality mean as a check, disclosing heavy-tail undercoverage. Sign multiplicities for repeated x indices are handled by signed-symbol multisets; multiplying the number of x multisets by2^m would overcount some repeated-sign configurations and is not used."
