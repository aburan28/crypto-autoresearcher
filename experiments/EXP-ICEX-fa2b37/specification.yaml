    "representation": {
      "field": "Short Weierstrass E/Fp, p>3; full affine points and O explicit. Field arithmetic overFp, linear relations overF_N. Variable order and polynomial serialization are fixed below.",
      "semaev_polynomials": "Let f2(u,v)=u−v and f3(u,v,w)=(u−v)^2*w^2−2*((u+v)*(u*v+a)+2*c)*w+(u*v−a)^2−4*c*(u+v). For n=4,5,6 build f_n(x1,...,xn)=Res_z(f_(n−1)(x1,...,x_(n−2),z), f3(x_(n−1),xn,z)) overFp with formal variables distinct. Compute the Sylvester determinant by fraction-free Bareiss with exact polynomial divisions and deterministic first-nonzero row pivots, retaining row swaps and divisibility checks. Use the full formal degree slots, including leading zeros after specialization; do not divide away nonconstant factors. Normalize only by a nonzero field scalar and archive all supports/coefficients. Build before target substitution. Independently reconstruct each determinant using division-free subset-DP determinant expansion for the bounded Sylvester size and compare exact polynomials.",
      "degree_and_infinity": "For m summands and affine target, the membership polynomial is f_(m+1)(x1,...,xm,x_R); hence m3/4/5 use f4/f5/f6, whose generic degree in each variable is4/8/16. The source’s degree8 m5 shorthand does not authorize using f5 in place of f6. Every intermediate root at infinity and degree drop is retained by the formal Sylvester construction. For targetO, use f_m(x1,...,xm)=0. Repeated x coordinates, equal/opposite points and cancellations remain allowed. No inverse of x_i−x_j or other exceptional factor is introduced.",
      "indicator_and_ideal": "g_V(z)=product_(v in sortedV)(z−v), exact overFp with distinct roots. For each affine query form I_R=<f_(m+1)(x1,...,xm,x_R),g_V(x1),...,g_V(xm)>; forO use f_m. No distinct-index constraints are added: the source indicator system allows repetitions. The product-grid ideal is radical, so the finite solution set is well defined. Archive actual generators and target specialization, not an S3-only stand-in.",
      "groebner_algorithm": "Use a fresh deterministic lexicographic Buchberger computation for each query, x1>...>xm. Sparse polynomials are exponent tuples to reduced field coefficients. Monic-normalize nonzero generators, order by leading monomial and canonical coefficient bytes. Process S-pairs by total degree of LCM, then lex LCM, then creation indices. Reduce S-polynomials by the first ordered divisor of the current leading monomial; if none, move that term to the remainder. The sole optional skip is the relatively-prime-leading-monomial product criterion, recorded explicitly. Add every nonzero monic remainder and its new pairs until the queue is empty. Interreduce to a canonical reduced lex basis. Track exact generator-combination witnesses through every polynomial operation, and record operation counters, leading degrees, support sizes and peak coefficient storage. No outcome-dependent degree cutoff or hidden fallback to scalar enumeration.",
      "gb_certification": "Independent checker verifies each output basis polynomial as a combination of the input generators, reduces every original generator by the output basis to zero, and checks every final S-pair remainder is zero using separately implemented division. For unit ideal output1 retain an explicit ideal membership certificate. A zero polynomial or zero ideal branch is preserved; domain indicators remain present. Polynomial identities are exact, not probabilistic evaluations.",
      "root_extraction": "Extract Fp roots from the completed lex basis by recursive specialization from x_m down to x_1. At each branch specialize previously fixed trailing variables, collect the basis polynomials involving only the current variable and already fixed variables, and compute their common gcd with g_V. If all collected polynomials vanish, the gcd is g_V and every value inV is a candidate. If a nonzero constant occurs, reject the branch. Enumerate roots by evaluating that gcd at every sortedV value and retain all exact zeros; this is root extraction from the certified ideal, not a replacement membership search. At a full assignment verify all original generators exactly, map x values to base indices, canonicalize the index multiset and eliminate repeated permutations. Enumerate signs and stop at the first independently verified decomposition in deterministic tuple/sign order; a negative answer requires exhausting all algebraic roots. For query-completeness controls emit all roots and all verified decompositions.",
      "signed_recovery": "For a returned x multiset (i1,...,im), enumerate all epsilon in{−1,+1}^m lexicographically and sum epsilon_j D_ij by counted group operations. Record every sign pattern producing R or−R for that tuple. If sum=rR with r in{−1,+1}, compute k_candidate=r*sum(epsilon_j*s_ij)−t modN and verify [k_candidate]P=Q independently. ForR=O choose r=+1 and verify the sumO. At most2^m sign patterns occur per x tuple, but more than one rejected tuple may be visited, so total sign work is not falsely bounded by2^m per query. Only certified point sums are decompositions; a resultant root count is never a verified relation.",
      "hidden_relation_pipeline": "The same membership API is queried on known targets R=aP in a deterministic affine permutation a=(u*j+v)modN, j=0..N−1, u uniform nonzero andv uniform. Targets are formed by counted incremental additions. A signed decomposition with sum epsilon_j D_ij=rR gives coefficients c_i=r*sum of epsilon_j at indexi, with sum c_i D_i=aP. Form the homogeneous real row s_0*c−a*e_0 overF_N; it annihilates the actual base-log vector. Record and verify the original point equation and anchor. Select the first B−1 independent genuine rows by deterministic leftmost-pivot elimination; dependent and zero rows remain charged and reported. If the entire target census fails to reach rankB−1, report rank-incomplete and no successful hidden total. Never add planted rows or expose other labels.",
      "hidden_scale_and_solve": "Normalize x_0=s_0. From the selected B−1 rows delete column0 to get invertible A; RHS b=−s_0*M[:,0]. Require an independent rankB−1 certificate and invertibility, solve Ax_rest=b with scalar Wiedemann below, restore x0, and verify M*x=0 and [x_i]P=D_i for EVERYcolumn. These recovered labels are supplied only to the hidden recovery phase. Its paired descent uses exactly the primary point inputs, target/mask streams, generator ideals and deterministic solver settings; record independent execution and count comparisons.",
      "sparse_LA": "Scalar Wiedemann, d=B−1: for projection seeds11,29,47 try16 independently labeled uniform u vectors each. Stream s_k=u^T A^k b for k0..2d−1, compute the minimal scalar recurrence by standard discrepancy Berlekamp–Massey (C=D=1,L=0,last=1,shift1; subtract discrepancy/last times shiftedD; update L,D,last when2L<=k), reverse the recurrence to polynomial f. If f(0)!=0 construct x=−sum_(j>=1) f_j/f_0 * A^(j−1)b using a second streaming pass; accept only after exact Ax=b. Charge failed projections, BM, reconstruction and checks. All48 failed projections means solver-incomplete, with dense elimination used only as an independent correctness control, never substituted into the sparse count. Store recurrence and residual certificates.",
      "caching": "Per curve/m, target-independent formal resultants may be reused with their build cost explicitly allocated. Per base, g_V and its generator data may be reused. Every target ideal gets a fresh GB and root search; no answer cache, target-specific GB cache, scalar-sum cache or rank-conditioned membership selector is allowed. The public and hidden arms use identical cache rules."
