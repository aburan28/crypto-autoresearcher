      "factor_base_rule": "B is the least positive integer with B^m >= m!*N, computed by exact integer arithmetic. B counts distinct +/- classes and distinct x coordinates; the actual signed point set has2B elements. If B>(N−1)/2 the cell is infeasible and retained. No base-size substitution.",
      "curve_rule": "For bits b and seed s, set p to the least prime at least 2^(b−1)+1+2*(H(prime,b,s) mod2^(b−3)); use deterministic trial division. Reject a nominal-bit overflow. For j=0..4095 take a=H(curve-a,b,s,j) modp and c=H(curve-c,b,s,j) modp, skip 4a³+27c²=0. Count #E exactly by the Legendre sum for y²=x³+ax+c. Factor #E by trial division, N its largest prime factor. Accept the first ordinary, non-anomalous curve with trace p+1−#E nonzero, #E!=p, N>sqrt(p), and N>1024. Choose the first coordinate-lex affine point whose cofactor multiple P is nonzero, and verify [N]P=O. A finite construction failure is explicit; no selection by favorable solver cost.",
      "seed_rule": "H is SHA256 of UTF8 EXP-ICEX-fa2b37/v1|label|decimal arguments separated by |. Digests are unsigned big-endian integers. For uniform modulo-q draws reject digest integers at least floor(2^256/q)*q and advance a labeled counter. Separate labels for curves, primary bases, targets, masks, hidden collection, alpha bases/targets, nulls and controls. No unseeded entropy.",
      "public_base": "Draw B independent uniform residues s_i in1..N−1, rejecting a value congruent to +/- any earlier one. Retain accepted order and all rejection counts. Set D_i=[s_i]P with counted double-and-add and verify point/subgroup membership and every scalar label. Freeze the full point/x/scalar lists before drawing targets. Reuse this one base across the ten targets and paired arms; target independence is intentional, not a ban on base reuse.",
      "visibility": "Membership receives only p,a,c,N,P,V={x(D_i)} and target point R. It cannot receive the scalar array, target secret k, hidden recovered logs, coverage oracle or scalar sumsets. Recovery receives the scalar labels only after a point decomposition exists. The hidden arm receives the identical point list with all s_i except s_0 withheld; s_0 is the one explicitly disclosed, independently checkable normalization anchor. The anchor has ceil(log2(N)) bit cost and is declared to both arms.",
      "target_and_mask_law": "Draw ten distinct nonzero target scalars k per primary cell by rejection sampling, compute Q=kP, and isolate k in the checker. Each target has a separately labeled infinite IID uniform mask stream t inF_N, with replacement. R=Q+tP is uniform inG. Chance repetitions are permitted and charged; no answer or target-conditioned basis cache is reused. The primary algorithm requests a decomposition even when R=O, using the explicit zero-target polynomial branch. It does not use the separate k=−t zero-mask shortcut; that optional shortcut is recorded only as an alternative cost observation, not used to change primary coverage.",
