    "campaigns": {
      "direct": "For each of27 primary cells, build the public base and target-independent resultants/indicators, then process all ten targets. For each target run fresh IID masks until the deterministic membership procedure returns a valid decomposition; reconstruct k and independently verify. Retain every negative attempt and all failed algebraic candidate sign checks. There is no arbitrary attempt/CPU ceiling; the stopping event is a verified solve or an explicit machine/instrument checkpoint. The base has at least one signed m-sum, so its exact mathematical coverage is positive; a sampler that never reaches any represented target is not declared evidence against the mechanism.",
      "hidden": "On the exact same point set and public anchor, collect real relations as frozen above until rankB−1 or the entire N-target permutation is exhausted. Run the normalized sparse solve and independent all-column verification. Only then run the ten paired target descents independently with the same masks and deterministic cache rules. Retain separate base/setup, relation, rank, LA, descent and verification costs. Report totals for every prefix K=1..10. A K100 row may be modeled from observed averages but must not be labeled 100 measured targets.",
      "alpha": "Run independent aligned and fixed-B campaigns with separate base/target/collection labels. Each campaign terminates at rankB−1 or after its N-target census, preserving every attempted query. Define U as the number of independent rank increments, V as the number of queries returning a valid decomposition, and T as total queries. Primary amortized query cost C_alpha=sum of ALL query costs/U, only eligible when U=B−1; dependent and failed queries remain in the numerator. Query cost includes target formation, polynomial specialization, GB, roots, signs and point-relation verification, but excludes target-independent formal-resultant/base/indicator setup and the LA/rank machinery. Report (setup+sum query costs)/U, sum query costs/V, mean per-attempt, median, max and full end-to-end campaign costs separately. Also run the same sparse solve and verify all base labels as a correctness check, keeping its charge outside the query numerator. The aligned alpha across varyingN is the primary independent comparison with E_direct; the fixed-N B32/64/128/256 slope is a separate diagnostic. Neither is defined as m*E.",
      "query_replay": "For public and hidden descents, require byte-identical serialized membership inputs at every paired attempt and identical exact arithmetic transcripts/counts when implementation is deterministic. Separate runtime variation is reported, not silently made equal. Caches are reset identically. Engine input whitelists and a static/code review must show no secret/scalar/coverage access; pure membership functions may perform no filesystem or network I/O."
