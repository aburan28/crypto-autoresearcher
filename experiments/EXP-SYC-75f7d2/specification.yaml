  # ------------------------------------------------------------------
  # 1. Repair item A: producer policy-resolution vs probe-vs-authoring binding
  # ------------------------------------------------------------------
  repair_item_A_producer_policy_resolution_binding:
    blocker_id: PRODUCER-POLICY-RESOLUTION-BINDING
    disposition: REPAIRED_FOR_THIS_SUCCESSOR_WITH_TWO_DISCLOSED_RESIDUALS
    defect_restated:
      part_1_resolution: >-
        The predecessor producer requested coordinator-orchestration-code but
        launched gpt-5.6-sol, while the frozen binding resolved that policy on
        the openai backend to gpt-5.6-terra. Fallback and degradation were
        both forbidden and no inference amendment exists, so the substitution
        was unauthorised.
      part_2_scope: >-
        The predecessor receipt verified a short read-only `codex exec` probe
        session. Its own scope note concedes it does not prove that the later
        interactive authoring tokens ran inside that probe. Verification scope
        and authoring scope were disjoint.
    repair_part_1_resolution:
      requested_policy: coordinator-orchestration-code
      canonical_policy: coordinator-orchestration-code
      policy_requires_reasoning_effort: high
      policy_may_change_official_state: true
      backend: anthropic
      backend_source: >-
        orchestration/model-bindings.yaml defaults.backend is anthropic; no
        backend override was requested by the handoff
      frozen_binding_model: claude-opus-5
      frozen_binding_path: >-
        orchestration/model-bindings.yaml
        bindings.anthropic.coordinator-orchestration-code.model
      resolved_model_id: claude-opus-5
      model_matches_frozen_binding: true
      manual_model_override_issued: false
      manual_model_override_note: >-
        The subagent frontmatter in .claude/agents/coordinator.md carries
        `model: inherit`, so no per-task model was selected by hand. This is
        the exact failure mode of the predecessor and it did not recur.
      reasoning_effort_requested: high
      reasoning_effort_binding: >-
        .claude/agents/coordinator.md carries `effort: high`, derived from
        orchestration/roles.yaml default_policy
        coordinator-orchestration-code -> reasoning_effort high in
        orchestration/model-policies.yaml
      fallback_allowed: false
      fallback_used: false
      degraded_allowed: false
      degraded: false
      amazon_bedrock_selected_configured_probed_contacted_or_used: false
      status: RESOLUTION_MISMATCH_DOES_NOT_RECUR
    repair_part_2_probe_versus_authoring:
      probe_session_executed: false
      probe_session_executed_reason: >-
        This role has no command-execution surface in this runtime, so no
        separate probe session exists and none is claimed.
      verification_scope: same_session_authoring_tokens
      structural_argument: >-
        The predecessor's scope gap was that its evidence covered a DIFFERENT
        session from the one that authored the artifacts. Here the model
        identity is a session-level attribute of the single session that
        emitted these authoring tokens: there is no second session for the
        evidence to be about. The disjointness that made the predecessor
        receipt inadmissible for authoring provenance is therefore absent by
        construction rather than by assertion.
      what_this_does_not_establish: >-
        The identity is a runtime self-report, not a provider-side
        cryptographic attestation, and no independent party observed it.
      status: SCOPE_GAP_CLOSED_ATTESTATION_STRENGTH_UNCHANGED
    residuals_open:
      - id: A-R1-no-provider-side-attestation
        statement: >-
          The resolved model identity rests on the runtime's own session-level
          declaration. No provider-side attestation, no `adapter doctor
          --probe`, and no tools/check_runtime_bindings.py execution backs it,
          because this role cannot execute commands.
        quantified_as: >-
          global_backend_verified=false; binding_probe_run=false;
          bindings.anthropic.coordinator-orchestration-code.last_probed is
          null in the committed binding file, so the identifier has never been
          probe-stamped on this backend at all.
        carry_forward_to: >-
          any future session that both holds a command surface and authors or
          reviews for this lane
      - id: A-R2-predecessor-provenance-is-permanently-unrepairable
        statement: >-
          EXP-SYC-b11b38's own receipt defect cannot be repaired by any
          successor, because the record is immutable and the tokens are past.
          This successor does not launder it: it neither restates the
          defective receipt as valid nor derives any figure from the
          predecessor producer session.
        quantified_as: >-
          zero figures in this file are sourced to TASK-20260811-338053; every
          carried figure is sourced to TASK-20260813-dec63b and
          TASK-20260813-e04de4, which recomputed them independently
        carry_forward_to: >-
          permanent; the defect stands on the record of BATCH-080a9c
    receipt_path: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-a723af/tasks/TASK-20260815-1f5c95/runtime-session-receipt.json

  # ------------------------------------------------------------------
  # 2. Repair item B: justified HA-2 worst-case / tail contract
  # ------------------------------------------------------------------
  repair_item_B_HA2_worst_case_and_tail_contract:
    blocker_id: HA2-EXPECTATION-NOT-TAIL
    disposition: REPAIRED_BY_DERIVATION_NOT_ASSERTION
    what_was_wrong: >-
      The predecessor asserted "HA-2 is mean-only, so no tail follows". That
      is a statement about what was not proved. It leaves open whether a
      stronger argument from the same heuristic could yield capacity
      adequacy. This item replaces the assertion with a derivation that
      settles the question.
    source_heuristic:
      id: HA-2-distinct-match-enrichment
      record: ledger/hypotheses/H-SYC-b854f4.yaml
      formal_statement: 'E[X] = N^(-1/3 + gamma_x + o(1))'
      what_it_supplies: the first moment of X, per (curve, root, public model)
      what_it_does_not_supply: >-
        any higher moment, any tail, any concentration statement, any joint
        law across tuples, and any finite-N control on the o(1) term
    frozen_arithmetic_convention:
      rule: 'N = 2^bits and the unspecified o(1) correction set to 0'
      status: >-
        symbolic finite reference convention inherited byte-exact from
        EXP-SYC-b11b38; not an observation and not a rigorous finite-N bound
      unchanged_from_predecessor: true
    overflow_event_definition:
      capacity: 32
      width: U8_0_through_31
      overflow_iff: 'X >= 33'
      justification: >-
        capacity 32 holds zero-based indices 0..31, so the thirty-third
        distinct retained candidate carries candidate_index 32, which lies
        outside the frozen width and invalidates.
      inherited_unchanged: true
    family_size_correction:
      accounting_tuples_per_size: 98304
      accounting_tuple_identity: '32 curves * 256 roots * 4 models * 3 eta = 98304'
      distinct_random_variables_per_size: 32768
      distinct_identity: '32 curves * 256 roots * 4 models = 32768'
      reason: >-
        the inherited eta_rule states that eta is a preregistered analysis
        stratum, not a new root draw, and that each eta tuple's occupancy
        EQUALS that root/model X. The three eta tuples of one (curve, root,
        model) are therefore the same random variable, not three. The
        predecessor's "maximum-over-98304-tuples" phrasing overstates the
        family by a factor of 3.
      convention_used_below: >-
        every familywise statement below uses the CONSERVATIVE count 32768,
        which makes each derived bound smaller and each vacuity conclusion
        stronger; the 98304 variant is reported alongside
    contract_clauses:
      - id: C-HA2-1-deterministic-worst-case
        kind: definite_negative_fact
        statement: >-
          X <= 8*(L-1) deterministically, inherited from the compiler's
          selected_pair_comparisons census. The bound exceeds capacity 32 at
          every ladder size, so capacity 32 is NOT worst-case adequate. This
          is settled, not merely unproved.
        rows:
          - {bits: 18, L: 64, worst_case_bound: 504, exceeds_capacity_by: 472}
          - {bits: 21, L: 128, worst_case_bound: 1016, exceeds_capacity_by: 984}
          - {bits: 24, L: 256, worst_case_bound: 2040, exceeds_capacity_by: 2008}
          - {bits: 27, L: 512, worst_case_bound: 4088, exceeds_capacity_by: 4056}
          - {bits: 30, L: 1024, worst_case_bound: 8184, exceeds_capacity_by: 8152}
        inherited_unchanged: true
      - id: C-HA2-2-tight-per-tuple-first-moment-bound
        kind: derived_upper_bound_with_attainment
        derivation: >-
          X is a non-negative integer count, so Markov gives
          P[X >= 33] <= E[X]/33. This bound is ATTAINED by the admissible law
          X = 33 with probability E[X]/33 and X = 0 otherwise: that law is
          non-negative, integer-valued, has exactly the HA-2 mean, and
          respects C-HA2-1 since 33 <= 504 <= 8*(L-1). Therefore E[X]/33 is
          not merely an upper bound but the exact supremum of the per-tuple
          overflow probability over every occupancy law consistent with HA-2.
        counterexample_certificate_kind: explicit_admissible_law
        rows_gamma_x_5_over_18:
          - {bits: 18, expected_X: '0.5000000000000000', exact_bound: '1/66', bound_12dp: '0.015151515152'}
          - {bits: 21, expected_X: '0.4454493590701696', bound_12dp: '0.013498465426'}
          - {bits: 24, expected_X: '0.3968502629920499', bound_12dp: '0.012025765545'}
          - {bits: 27, expected_X: '0.3535533905932738', bound_12dp: '0.010713739109'}
          - {bits: 30, expected_X: '0.3149802624737183', bound_12dp: '0.009544856439'}
        rows_gamma_x_1_over_3:
          all_sizes_expected_X: '1.0000000000000000'
          exact_bound: '1/33'
          bound_12dp: '0.030303030303'
        rounding_note: >-
          the 12-decimal figures are roundings of E[X]/33 computed from the
          stored 16-decimal E[X] literals; the exact bound is the quotient
          itself. They agree with the independent range 0.009544856439 to
          0.015151515152 reported by TASK-20260813-e04de4.
      - id: C-HA2-3-familywise-supremum-is-exactly-one
        kind: derived_impossibility
        statement: >-
          The supremum, over all joint occupancy laws consistent with HA-2
          alone, of the probability that at least one tuple overflows is
          EXACTLY 1 at every ladder size and at both gamma_x slices. The
          first-moment familywise bound is therefore not merely weak; it is
          tight at the vacuous value, and no cleverer argument from HA-2 as
          currently stated can do better.
        constructive_certificate:
          construction: >-
            Fix a ladder size, let mu be its HA-2 mean, p = mu/33, and
            m = 32768 the number of distinct root/model variables. Work on the
            unit circle [0,1) with uniform measure. For i = 0..m-1 set
            A_i = [i/m, i/m + p) taken modulo 1, and define X_i = 33 * 1[A_i].
          checks:
            - 'each X_i is a non-negative integer'
            - 'E[X_i] = 33 * p = mu, matching HA-2 exactly'
            - 'X_i <= 33 <= 8*(L-1), so C-HA2-1 is respected'
            - 'p >= 0.009544856439 > 1/m = 1/32768 = 0.000030517578125, so consecutive arcs overlap and the union covers [0,1)'
            - 'hence P[exists i : X_i >= 33] = 1'
          what_HA2_permits: >-
            HA-2 constrains only each marginal first moment. It states no
            joint law, so this coupling is fully admissible under it.
        symmetric_certificate:
          construction: >-
            X_i = 1[B_i] with P[B_i] = mu (mu <= 1 at both slices; at
            gamma_x = 1/3, mu = 1 and X_i is identically 1).
          consequence: 'E[X_i] = mu and P[X_i >= 33] = 0'
          force: >-
            HA-2 also admits laws in which overflow is impossible. Together
            with the construction above, the familywise overflow probability
            consistent with HA-2 alone ranges over the entire interval [0, 1],
            both endpoints attained. HA-2 is therefore completely
            uninformative about overflow, in the exact sense that it excludes
            no possible answer.
      - id: C-HA2-4-first-moment-union-bound-and-its-non-vacuity-threshold
        kind: derived_arithmetic
        closed_form_m_32768: 'min(1, m*E[X]/33) with m = 32768 equals min(1, 2^(15 - bits/18)/33) at gamma_x = 5/18'
        closed_form_m_98304: 'the same with m = 98304 equals min(1, 2^(15 - bits/18)/11)'
        evaluated_gamma_x_5_over_18_m_32768:
          rows:
            - {bits: 18, unclipped_value: '16384/33 ~= 496.48', clipped_bound: 1}
            - {bits: 30, unclipped_value: '~= 312.77', clipped_bound: 1}
          all_sizes_vacuous: true
        evaluated_gamma_x_1_over_3:
          unclipped_value_m_32768: '32768/33 ~= 992.97'
          unclipped_value_m_98304: '98304/33 ~= 2978.91'
          independent_of_N: true
          note: >-
            at the gamma_x = 1/3 ceiling E[X] = 1 for every N, so the
            first-moment familywise bound is constant in N and is vacuous at
            every conceivable size, not only on this ladder.
        non_vacuity_threshold:
          condition_m_32768: 'E[X] <= 33/32768 = 0.001007080078125'
          condition_m_98304: 'E[X] <= 11/32768 = 0.000335693359375'
          on_the_frozen_expression: >-
            substituting E[X] = 2^(-bits/18) at gamma_x = 5/18, the
            first-moment familywise bound becomes non-vacuous only for
            bits >= 18*(15 - log2(33)) ~= 179.2009 (m = 32768), or
            bits >= 18*(15 - log2(11)) ~= 207.7302 (m = 98304).
          scope_of_that_statement: >-
            ARITHMETIC ONLY. It extends the frozen symbolic expression while
            holding capacity 32 and the tuple counts fixed at their frozen
            values. It is not a claim about cryptographic scale, not a
            transfer, not an extrapolation of any measured quantity, and not
            a statement about how this design would be parameterised at a
            larger order. It says one thing: on the tested 18-30 ladder the
            first-moment route is vacuous by roughly two and a half orders of
            magnitude in the mean, and no reparameterisation inside the frozen
            ladder can rescue it.
      - id: C-HA2-5-operative-rule-unchanged
        kind: preserved_contract
        statement: >-
          Because C-HA2-1 settles worst-case inadequacy and C-HA2-3 settles
          that no tail is derivable, the operative contract remains exactly
          the inherited one: any realized tuple occupancy above 32 invalidates
          the apparatus, without truncation, replacement, resampling, or
          silent saturation. A realized overflow is apparatus invalidity and
          is never negative evidence about H-SYC-b854f4 or about ECDLP.
        unchanged_from_predecessor: true
      - id: C-HA2-6-what-would-suffice-declared-not-adopted
        kind: declared_options_none_adopted
        options:
          - id: ROUTE-A-new-numbered-heuristic
            requirement: >-
              a new, explicitly numbered heuristic (provisionally HA-2T)
              stating a finite-N tail or a dependence structure for X, added
              to ledger/hypotheses/H-SYC-b854f4.yaml or a successor
              hypothesis, together with archived validation evidence or a
              scheduled validation experiment sampling the occupancy
              distribution and checking tail consistency
            adopted_here: false
            reason_not_adopted: >-
              amending the hypothesis record is outside this task's write
              scope and outside the four named repair items; and an
              unvalidated heuristic would cap the claim below supported in any
              case
          - id: ROUTE-B-capacity-at-the-deterministic-worst-case
            requirement: >-
              raise candidate_index capacity per size to 8*(L-1), i.e.
              504/1016/2040/4088/8184, which makes overflow deterministically
              impossible and needs no probabilistic assumption at all; this
              forces the index width above U8 (8184 needs 14 bits) and changes
              record layout, per-tuple bytes, and every downstream byte figure
            adopted_here: false
            reason_not_adopted: >-
              it is a capacity and record-layout change, hence a cap-relevant
              scope change this task is forbidden to make unilaterally; and
              its byte impact is not computable from the artifacts in this
              task's read scope
            quantified_carry_forward: >-
              the required width change is U8 -> at least U14, i.e. u16 in any
              byte-aligned layout, doubling the candidate_index field; the
              resulting archive, communication and output deltas are NOT
              computed here and are an open quantity
          - id: ROUTE-C-status-quo
            requirement: none
            adopted_here: true
            consequence: >-
              capacity adequacy is not claimed at all; overflow invalidation
