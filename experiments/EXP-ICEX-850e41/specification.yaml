experiment:
  id: EXP-ICEX-850e41
  hypothesis_id: H-ICEX-8f9ea2
  derived_from_idea: IDEA-20260901-133fd3
  question_id: RQ-ECDLP-002
  batch_id: BATCH-a70dc3
  version: 1
  title: >-
    Measure the representation-versus-splitting solver ratio for the
    low-Hamming-weight promise class on an elliptic curve, on a curve-free cyclic
    group, and on the plain integers under ONE frozen operation counter - because
    the absolute ratio R = T/sqrt(class size) is computed to span 0.64 to 23.1 at
    a single cell purely by changing what the counter charges - with the integer
    arm supplying the dynamic range as a blocking positive control and the
    cascade premise removed after reading its cited finding in full
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. Because the shift x to x + b and the scale x to a x are
    free and exact for the ECDLP, every attack that re-randomises into an easy
    promise class W costs exactly T(W) n / |W|, so the whole family is controlled
    by the dimensionless ratio R(W) = T(W)/sqrt(|W|). R is of order 1 for every
    incumbent. Whether any declared class holds R below 1 as its size grows - and
    in particular whether a representation-style solver beats splitting on the
    low-Hamming-weight class IN THE GROUP - is a measurement.

    (B) WHY THE SOURCE IDEA'S BAND IS DEGENERATE, COMPUTED BEFORE ANY RUN. The
    source pre-registers R at least 0.9 as CASCADE and R at most 0.7 as BREAK.
    Take l = 24, w = 4, class size binomial(24,4) = 10626 with square root
    103.08, positions split into two halves of 12. Charging one balanced list
    only, binomial(12,2) = 66, gives R = 0.64, INSIDE THE BREAK BAND with no
    representation technique present at all. Charging the balanced list plus its
    complement lookup and dividing by that split's success probability
    66^2/10626 = 0.41 gives R = 3.12. Charging all weight splits on each half,
    3 * (1+12+66+220+495) = 2382, gives R = 23.1. ONE SOLVER, ONE INSTANCE SET,
    THREE DEFENSIBLE CONVENTIONS, THREE DIFFERENT VERDICTS. Under the honest
    convention that charges list construction, SOLVER-I sits at 23.1 at w = 4,
    13.3 at w = 8 and 7.47 at w = 12, so the CASCADE band is satisfied at every
    cell by bookkeeping and a real-but-partial representation gain would be
    recorded as confirming it.

    (C) THE COMPUTED REPLACEMENT, WHICH IS CONVENTION-IMMUNE AND
    SELF-CALIBRATING. Freeze ONE operation counter, use it for every solver and
    every arm, and make the statistic a ratio of two solvers on the same
    instances- rho(arm) := T(SOLVER-R)/T(SOLVER-I). The counting convention
    cancels because it appears identically above and below. Then
    Delta := log2 rho(group) - log2 rho(integer). THE INTEGER ARM SUPPLIES THE
    DYNAMIC RANGE AND IS MEASURED IN THE SAME RUN- if the representation technique
    works there, rho(integer) is well below 1 and |log2 rho(integer)| sets the
    scale of the bands; if it does not, the instrument has no demonstrated range
    and the cell is UNTESTED rather than closed.

    (D) THE CASCADE PREMISE IS REMOVED BECAUSE ITS SOURCE SAYS THE OPPOSITE.
    IDEA-20260901-133fd3 predicts the cascade branch on the ground that every
    route to R below 1 passes through a sum-compatible filter that
    'KN-FIND-ffe1df (no cheap sum-compatible filter on E(F_p))' reports as
    unavailable - a reading the source itself marks LOCATED BY GREP AND NOT
    OPENED. TASK-20260904-f2b3db OPENED IT IN FULL. The finding's title reads
    'NOT a closure of the Wagner k-tree lane'; a section heading reads 'THE
    HEADLINE CLAIM IS WITHDRAWN - red team RT-20260803-be45a8'; the body states
    'Every theorem here bounds the wrong quantity', 'The narrowest valid
    statement- j = 2 is UNPROVED, not refuted', and 'It does not retire the
    lane ... the lane is narrowed, not closed'; and an independent Validator pass
    returned verdict `failed`. THE CASCADE HAS NO SUPPORT AND IS REMOVED. One
    consequence is favourable- the filter question being genuinely open makes the
    BREAK alternative live, so the measurement has real dynamic range rather than
    a foregone conclusion.

    (E) THE CURVE-FREE ARM IS REQUIRED AND IS NOT THE INTEGER ARM. The balance
    law, the low-weight class and the representation technique are all statements
    about a cyclic group with a power-of-two basis, so a curve-free GROUP can
    reproduce the whole signature. A third arm runs the identical solvers on
    (Z/n, +) with the same class and basis, and its consequence is pre-stated.
  inputs:
    cost_unit: >-
      CERTIFIED GROUP OPERATIONS, dimensionless. ONE FROZEN COUNTER, declared here
      and used identically by every solver and every arm- 1 per group element
      constructed in any list, 1 per hash-table probe, 1 per candidate check, and
      1 per group addition anywhere else. On the plain-integer arm, one integer
      addition of the same operand width is charged at 1, which is the declared
      convention making the arms comparable. MEMORY in BYTES, reported beside and
      never divided into any operation count. THE DISCRIMINATOR IS A RATIO OF TWO
      SOLVERS UNDER THIS ONE COUNTER, SO THE CONVENTION CANCELS.
    unit_discipline: >-
      BINDING. Tags in {group_ops, bytes, count, dimensionless, seconds}. Both
      sides of every ratio are in the same tag- rho, Delta and R are group_ops
      over group_ops. A ratio mixing ops with bytes is refused.
    class_size: >-
      'The class size is computed EXACTLY as a binomial coefficient and is
      recorded per cell. Every scalar in this contract whose text begins with a
      cardinality bar is quoted, because a leading indicator character breaks the
      parse; the source record documents that exact defect.'
    frozen_filter: >-
      The group-arm filter is DECLARED BEFORE THE RUN and recorded in the freeze
      manifest- a bucket of the x-coordinate, or a quadratic character, or another
      statistic the executor names in advance. It may read ONLY the group element.
    instance_set_hash: >-
      TO BE EMITTED BY THE RUN. SHA-256 over the canonical serialisation of
      (arm, group parameters, n, l, w, basis, filter id, instance list, seed) per
      cell, recorded in the manifest, so that a number quoted from this contract
      is bound to the instances that produced it.
  controls:
  - >-
    C1 POSITIVE CONTROL A, INTERVAL CLASS, BLOCKING. Kangaroo on intervals of
    three declared lengths; measured T must be within a factor of 2 of
    2 sqrt(L) at every L. An instrument that cannot reproduce the one class whose
    ratio is known cannot be trusted on the others.
  - >-
    C2 CONTROL C, VACUOUS PROMISE, BLOCKING. W = Z/n solved by rho; measured cost
    must be within a factor of 2 of 0.886 sqrt(n), closing the law's own boundary
    case.
  - >-
    C3 POSITIVE CONTROL B, PLAIN-INTEGER ARM, BLOCKING AND DIRECTION-SETTING.
    SOLVER-R against SOLVER-I on integer subset-sum instances of the same sizes,
    with the filter a prefix of the integer. rho(integer) MUST come out below 1.
    If it does not, SOLVER-R is not a representation solver, no group-arm negative
    is admissible, and every cell is reported UNTESTED rather than closed.
  - >-
    C4 NULL-1, MATCHED RANDOM CLASS, BLOCKING. Replace the low-weight class by a
    uniformly random subset of Z/n of the same size and solve it by the only
    method available for an unstructured class, plain rho on the whole group,
    under the same accounting. R must come out at about sqrt(n)/sqrt(class size),
    far above 1, confirming that any measured R near 1 is about the class's
    STRUCTURE and not about its size.
  - >-
    C5 NULL-2, FILTER NULL, BLOCKING. Run SOLVER-R with the declared
    group-element filter replaced by a KEYED RANDOM FUNCTION of the group element
    with the same image size. If rho is unchanged, the filter's algebraic content
    is doing nothing and the result is about bucket counts and representation
    bookkeeping rather than about a filter effect.
  - >-
    C6 CURVE-FREE GROUP ARM, REQUIRED. The identical solvers on (Z/n, +) with the
    same low-weight class and the same power-of-two basis. Consequence pre-stated
    in falsification_criterion.
  - >-
    C7 STATIC LEAK CHECK, BLOCKING. A static check that the group-arm filter and
    every group-arm code path never read the integer exponent, the known
    randomiser (a, b), or the integer expansion of any candidate. A leak voids
    every group-arm number.
  - >-
    C8 SOLVER-I CALIBRATION AGAINST ITS FORCED VALUES. Under the frozen counter,
    the measured R for SOLVER-I at l = 24 must be about 23.1 at w = 4, 13.3 at
    w = 8 and 7.47 at w = 12, within a factor of 1.5. A measured value far from
    these means the counter is not the declared one and the run set is void.
  - >-
    C9 CURVE EXCLUSION. Anomalous and smooth-order toy curves are excluded before
    a curve enters the run set.
  - >-
    C10 SCALAR WITHHOLDING. Instances are generated with a known scalar so success
    is verified exactly, and the scalar is structurally withheld from every solver
    code path. Verified by the same static check as C7.
  independent_variables:
  - bit length l in {24, 30, 36}
  - Hamming weight w, chosen per l so the class size spans at least three orders of magnitude
  - solver in {SOLVER-I splitting, SOLVER-R representation style}
  - arm in {elliptic E(F_p), curve-free (Z/n, +), plain integer}
  - filter in {declared group-element statistic, keyed random function of the same image size}
  metrics:
    primary:
    - >-
      rho(arm; l, w) = T(SOLVER-R)/T(SOLVER-I), dimensionless, with a bootstrap
      95 percent interval, per arm per cell.
    - >-
      Delta(l, w) = log2 rho(elliptic) - log2 rho(integer), with its interval.
    - >-
      the fitted slope of log rho(elliptic) against log of the class size, per l,
      with residuals.
    secondary:
    - >-
      'T(W) in certified group operations per (arm, l, w, solver), mean and
      bootstrap interval, and the exactly computed class size'
    - >-
      R(W) = T(W)/sqrt(class size) per cell under the frozen counter, REPORTED
      because the balance law needs it and NOT used as the discriminator
    - the paired elliptic-minus-curve-free rho difference per cell
    - NULL-1 and NULL-2 ratios on the identical accounting
    - interval and vacuous calibrations against their closed forms
    - measured per-bucket predictability of the filter across the three field sizes, for H2
    - peak memory in bytes per solver per cell
    - wall clock per stage and pass or fail of every blocking gate
    - the static leak-check report and the scalar-withholding verification
  heuristic_under_test: H1
  preregistered_prediction:
    quantity: >-
      The ratio of a representation-style solver to a splitting solver for the
      low-Hamming-weight promise class, compared across the group and integer
      arms.
    formula: >-
      'rho(arm) := T(SOLVER-R)/T(SOLVER-I) under one frozen counter;
      Delta := log2 rho(elliptic) - log2 rho(integer). PRE-REGISTERED with
      rho_int the MEASURED integer-arm ratio- CASCADE if Delta is at least
      0.75 * abs(log2 rho_int) at every l with non-negative slope in l; BREAK if
      Delta is at most 0.25 * abs(log2 rho_int) at all three l AND rho(elliptic)
      is below 1 with a negative slope in log of the class size; INCONCLUSIVE
      otherwise; UNTESTED if rho_int is at least 1. FORCED SOLVER-I CALIBRATION
      under the frozen counter at l = 24- R about 23.1 at w = 4, 13.3 at w = 8,
      7.47 at w = 12.'
    source: >-
      Derived in H-ICEX-8f9ea2 statements (D) and (E). The balance law
      C(W) = T(W) n / (class size) is an exact counting identity derived there.
      The band replacement is this contract's own computation. The expectation
      that the integer arm shows a ratio below 1 rests on RECALLED
      representation-technique results - Becker-Coron-Joux, Howgrave-Graham-Joux,
      Coppersmith and Stinson, May and Ozerov - none of which any agent in this
      program has opened; because the integer arm is MEASURED and is a blocking
      control, nothing in the verdict depends on the recalled exponent being
      right.
  scale_relevance:
    tier: toy
    justification: >-
      l in {24, 30, 36} bits with at least 200 instances per cell, so that both
      solvers run to completion many times and T is a measured mean rather than an
      extrapolation. The ladder stops at 36 bits because SOLVER-R's lists grow
      faster than SOLVER-I's and the memory cap binds. NO transfer to
      cryptographic n is licensed, and the strongest form of the claim - that no
      promise class has R below 1 - quantifies over all classes and all solvers
      and is not certifiable at any scale.
    correspondence: null
  tail_checks:
  - >-
    Compare the MINIMUM T observed over all instances in a cell against the
    minimum over an equal number of NULL-1 replicates. A real effect must shift
    the whole distribution, not one lucky instance.
  - >-
    Compare the largest per-bucket filter excess against the largest over an equal
    number of NULL-2 keyed-random-filter replicates, at each of the three field
    sizes. The excess must shrink like n^{-1/2}; an excess flat in n is an
    artifact and voids H2 on the tested scope.
  - >-
    Report the 90th percentile of rho as well as its median. A median below 1 with
    a heavy right tail is a solver that occasionally costs far more, and a break
    claim must survive at the 90th percentile too.
  replication:
    seeds: [211, 223, 227, 229, 233]
    independent_instances: 200
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 12
    maximum_memory_gb: 16
    maximum_runs: 200
    maximum_workers: 1
  stopping_rules:
  - >-
    STAGE 0, ZERO COMPUTE, HARD GATE. Write out the balance law with its
    uniformity step and the x = 0 case, and claim (D)'s pigeonhole argument. Then
    freeze and hash the manifest- counter definition, filter, solvers, class
    ladder, seeds.
  - >-
    STAGE 1. Implement rho, kangaroo, SOLVER-I and SOLVER-R over the three arms
    with the frozen counter.
  - >-
    STAGE 2, HARD GATE. Run C1, C2, C3 and C8. ALL FOUR MUST PASS OR THE RUN SET
    IS VOID. In particular a failing C3 makes every cell UNTESTED.
  - >-
    STAGE 3. Run the (l, w) grid on the elliptic and curve-free arms, at least 200
    instances per cell, with the declared filter fixed in advance.
  - >-
    STAGE 4. Run NULL-1 and NULL-2 on the identical accounting.
  - >-
    STAGE 5, ONLY IF THE BREAK BRANCH FIRES. Re-run at a larger l and STOP; route
    to independent review before any interpretation. No further interpretation is
    performed inside this contract.
  - >-
    Stop a cell at the per-run wall clock or the memory cap and record it as
    BUDGET-CENSORED rather than as a data point.
  invalidation_rules:
  - Any of C1, C2, C3 or C8 fails; the run set is void.
  - The static leak check C7 finds a group-arm path reading the integer exponent, the randomiser, or the withheld scalar.
  - A solver charged under a counter other than the frozen one; the affected cells are void.
  - Any ratio formed across two unit tags, or memory divided into an operation count.
  - An anomalous or smooth-order curve in the run set.
  - Two runs of a cell with an identical seed disagree on any counted quantity.
  - >-
    A BREAK verdict recorded without a passing C3, or reproduced by NULL-2.
    Invalid by contract regardless of the value of Delta.
  - Budget exhaustion before the grid resolves; failed_infrastructure under AGENTS.md rule 5, never evidence about R or rho.
  success_criterion: >-
    The contract delivers its object when- the manifest is frozen and hashed
    before Stage 1; C1, C2, C3 and C8 all pass; rho is reported with bootstrap
    intervals for the elliptic, curve-free and integer arms at every cell; Delta
    and its slope are reported with the two decision lines computed from the
    MEASURED rho_int; R is reported per cell under the frozen counter as a
    secondary; NULL-1 and NULL-2 are reported on the identical accounting; the
    curve-free arm's paired difference is reported per cell; and the leak check
    and scalar-withholding verification pass. Neither branch outcome is called a
    success.
  falsification_criterion: >-
    P1 UNIFORMITY. The wrapper does not produce a uniform re-randomised instance,
    including at x = 0. The implementation is wrong; nothing is reported. The law
    itself cannot fail here - b alone gives uniformity - so a failure is an
    instrument defect.

    P2 INTEGER POSITIVE CONTROL, BLOCKING. rho(integer) is at least 1. SOLVER-R is
    not a representation solver, the instrument has no demonstrated dynamic range,
    NO group-arm negative is admissible, and every cell is reported UNTESTED
    rather than closed. This is the failure mode that would turn the contract into
    a fatigue report and it is blocking for exactly that reason.

    P3 CALIBRATION. C1, C2 or C8 misses. The cost accounting is not the declared
    one; nothing is reported.

    P4 THE BREAK. Delta at most 0.25 times abs(log2 rho_int) at all three l, with
    rho(elliptic) below 1 at the median AND at the 90th percentile and a negative
    slope in log of the class size, with C3 passing, NULL-2 not reproducing it,
    and C7 clean. A promise class with a sub-square-root solver exists on an
    elliptic curve and by the balance law the exponent question reopens. IT WOULD
    STILL BE NO ATTACK AT CRYPTOGRAPHIC SCALE and requires independent
    replication, a fully charged parallel restatement including memory, and its
    own cost table before any interpretation.

    P5 THE CONTROLLED NULL. Delta at least 0.75 times abs(log2 rho_int) with slope
    0 everywhere. The re-randomisation family is closed for the DECLARED classes,
    the DECLARED filters and the tested sizes. THE MECHANISM MAY NOT BE STATED AS
    'the unavailability of a sum-compatible filter'- KN-FIND-ffe1df was read in
    full by TASK-20260904-f2b3db and does not establish that, its headline being
    withdrawn and its own words being that j = 2 is UNPROVED and the lane narrowed
    rather than closed. The honest headline is a controlled null plus an identity
    that makes the closure re-checkable by anyone.

    P6 FILTER NULL. NULL-2 reproduces SOLVER-R's advantage with a keyed random
    filter. The advantage is representation bookkeeping, not filter structure, and
    is recorded as a controlled null.

    P7 CURVE-FREE NULL, REQUIRED, CONSEQUENCE PRE-STATED. If the (Z/n, +) arm
    gives the same rho as the elliptic arm within the bootstrap intervals at every
    cell, then every number this contract produces is a statement about subset sum
    in a generic cyclic group with a power-of-two basis and NOT about elliptic
    curves. It may not be reported as an ECDLP finding, and any evidence record
    must state that in its boundaries.

    P8 INTEGER LEAK. C7 finds the group arm reading the integer exponent, the
    randomiser or the withheld scalar. Every group-arm number is void. This is the
    dominant risk and the reason C7 and the Delta separation are both blocking.

    P9 HEURISTIC H2. The measured per-bucket filter excess does not shrink like
    n^{-1/2} across the three field sizes. H2 is falsified on the tested scope and
    every statement resting on it is withdrawn.
  required_artifacts:
  - frozen manifest and its hash- counter definition, filter id, solvers, class ladder, seeds
  - the written-out balance law with its uniformity step and the x = 0 case, and the pigeonhole argument
  - per-cell instance-set SHA-256 and the serialised instance list
  - exact command, git commit, dirty-tree state, environment and dependency versions
  - >-
    'T(W) in certified group operations per (arm, l, w, solver), per instance,
    with the exactly computed class size'
  - rho per arm per cell with bootstrap intervals, and Delta with its interval
  - the fitted slope of log rho against log class size per l, with residuals
  - R per cell under the frozen counter, and the SOLVER-I calibration against 23.1, 13.3 and 7.47
  - interval and vacuous calibration transcripts against their closed forms
  - NULL-1 and NULL-2 outputs on the identical accounting
  - the curve-free arm's full outputs and the paired difference per cell
  - measured per-bucket filter predictability at each of the three field sizes
  - peak memory in bytes per solver per cell
  - the static leak-check report and the scalar-withholding verification
  - final verification of every solved instance against the known scalar
  - stdout, stderr, timestamps, and per-cell validity status with reason
  assigned_to: executor
  approved_by: null
