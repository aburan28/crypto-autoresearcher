# EXP-BINSTD-efb886
# Pool-count arithmetic. No pool search.
# Approved by DEC-20261002-6c76ab.
experiment:
  id: EXP-BINSTD-efb886
  hypothesis_id: H-BINSTD-80058d
  source_idea: IDEA-20260926-beb5b6
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Pool-count arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-6c76ab
  objective: >-
    Check the subset power counts, the bit count, and the ratio of
    2^{66} to the written difference.
  inputs:
    pool_log: 33
    group_log: 129
    two_subset_deficit_log: 33
    four_num: 1
    four_den: 3
    cube_243: 243
    power_256: 256
    eight: 8
    nine: 9
    five_num_shift: 33
    five_den: 15
    fifteen_tenth: 576650390625
    two_39: 549755813888
    two_list_34: 66
    two_list_5: 99
    hit_log: -98
    bit_width: 389
    width_sum: 389
    coord_bits: 131
    scalar_bits: 129
    storage_above: 41
    storage_below: 42
    storage_excess_coeff: 133
    written_low: 39
    ratio_below_num: 11
    ratio_below_den: 2
  controls:
    - >-
      The two-subset quotient equals 2^{-64} times (1 - 2^{-33}).
      Reporting it as exactly 2^{-64} invalidates the run.
    - >-
      The four-subset power count equals 1/3. Reporting another value
      invalidates the run.
    - >-
      The bit count exceeds 2^{41} by 133 times 2^{33}. Reporting it as
      at most 2^{39} invalidates the run.
    - >-
      The ratio of 2^{66} to the written difference lies strictly below
      2^{11/2}. Reporting it as at least 2^{11/2} invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {counts, ratio}
    - route in {cancellation, powers}
  metrics:
    primary:
      - four_subset_power
      - implementations_agree
    secondary:
      - two_subset_factor
      - storage_gap
      - ratio_bound
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The four-subset power count equals 1/3.
    formula: >-
      2^{132} / 24 / 2^{129} equals 8/24. The two-subset count is
      2^{32} times (2^{33} - 1), and dividing by 2^{129} leaves
      (2^{33} - 1) / 2^{97}. The bit width is 131 plus twice 129.
    source: >-
      IDEA-20260926-beb5b6 states the written exponents, read
      2026-10-02. The quotients were computed in this design session.
      That computation is not a run. No pool was searched.
  scale_relevance:
    tier: toy
    justification: Power cancellations at one pool size. No transfer to a search.
    correspondence: null
  tail_checks:
    - The five-subset comparison with 15^{10} is required. A check that stops at the four-subset third is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the four-subset power count is not 1/3, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two-subset quotient is reported as exactly 2^{-64}.
    - The four-subset power count is not 1/3.
    - The bit count is reported as at most 2^{39}.
    - The ratio is reported as at least 2^{11/2}.
    - A pool is searched or a subset is enumerated.
  success_criterion: >-
    Both runs agree that the two-subset quotient equals 2^{-64} times
    (1 - 2^{-33}), that the four-subset power count equals 1/3, that
    the bit count exceeds 2^{41} by 133 times 2^{33}, and that 2^{66}
    divided by the written difference lies strictly below 2^{11/2}.
  falsification_criterion: >-
    The runs agree, the two-subset factor stays 1 minus 2^{-33}, and
    the four-subset power count is not 1/3.
  required_artifacts:
    - experiments/EXP-BINSTD-efb886/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-efb886/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-efb886/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-efb886/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-efb886/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-efb886/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any pool search, subset enumeration, or walk.
    - Any claim that a collected pool contains a zero-sum subset.
    - Any measured iteration count.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
