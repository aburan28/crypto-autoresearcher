experiment:
  id: EXP-FRODOFO-fc2bff
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8596af; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8596af
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Calibration of an amnesty ledger over synthetic reduction chains: exact-chain zero null,
    injected-drop recovery and ranking, two injection generators for the heavy-tail claim, and location
    sensitivity across three frozen evaluation points.'
  objective: 'One uncertainty is reduced: whether a ledger of discarded factors can be filled in accurately
    enough to be worth filling in. (i) DOES IT INVENT AMNESTY. On a fully explicit chain of twelve
    exact steps, whose true amnesty is zero by construction, does the ledger return exactly zero bits
    at every evaluation point? A positive total there means the pipeline manufactures its own signal
    and no other number is interpretable. (ii) DOES IT FIND WHAT IS THERE. On chains built by replacing
    k steps with inequalities of known bit size, for k from one to six and under both a heavy-tailed
    and a uniform injection generator, does the recovered total match the injected total within one
    percent, and does the top-contributor ranking correlate with the true injection sizes? Both stubs,
    always-zero and always-large, are run through the identical harness so the endpoints of the scale
    are fixed rather than assumed. (iii) DOES THE TOTAL DESCRIBE THE CHAIN OR THE LOCATION. Across
    three frozen evaluation points spanning the plausible parameter range, how far does the total
    swing, and does the top-contributor ranking change with it? No real chain is used and no claim
    about FrodoKEM or any published analysis is made.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the twelve-step exact
      chain, the injected family under both generators, the frozen step schema and the three evaluation
      points, the ledger returned the measured totals, the measured recovery errors, the measured
      ranking correlations and the measured location swing. WHAT DOES NOT FOLLOW: nothing about FrodoKEM,
      nothing about any published reduction chain, no statement that any analysis is loose or wrong,
      no security consequence, and no adversary cost. In particular, accurate recovery on synthetic
      chains says nothing about whether a human rendering of a real derivation into steps would be
      faithful, and that rendering, not the arithmetic, is where the real uncertainty lives.'
  inputs:
    procedure: 'STAGE 0, freeze the step schema, the justification classes, the step granularity rule
      and the three evaluation points before writing any chain. Cost: human. STAGE 1, build the twelve-step
      exact chain and verify each step is an identity in exact rational arithmetic. Cost: implementation
      plus seconds. STAGE 2, exact-chain null: ledger must return exactly zero bits at all three evaluation
      points. A failure halts the run. Cost: seconds. STAGE 3, build the injected family: for k in
      1 to 6, replace k steps with inequalities of known bit size, 200 chains per k per generator,
      under two generators (heavy-tailed and uniform). Cost: minutes. STAGE 4, recovery and ranking
      measurement with bootstrap intervals. Cost: minutes. STAGE 5, stub endpoints through the identical
      harness. Cost: seconds. STAGE 6, location sensitivity: repeat stages 2 through 4 at each of
      the three evaluation points and report the swing in total and any change in top-contributor
      ranking. Cost: minutes. STAGE 7, quantifier-changing step counter applied to the synthetic chains,
      reporting how many steps are not magnitude replacements. Cost: seconds. STAGE 8, immutable run
      records via harness/runner.py including the schema, chains, generators and resolved inference
      block.'
    instrument: 'Python 3 standard library: fractions.Fraction for exact ratios so the zero null is
      exact rather than approximate; dataclasses for the frozen step schema; random.Random with recorded
      disjoint seed streams for the two injection generators; a hand-written Spearman rank correlation
      so the tie-handling convention is explicit in the record. No timing measurement of any kind
      is taken or reported anywhere in this experiment, which keeps it outside the RQ-INSTR-f8faa0
      cost-model lane by construction. No Sage, no lattice estimator, no external computer-algebra
      system. Run manifests and resolved inference block via harness/runner.py; ids via tools/allocate_id.py.'
    parameters: 'Exact chain: 12 steps over 6 symbolic inputs, every step an identity. Injected family:
      k in 1..6 replaced steps, 200 chains per k per generator, 2 generators (heavy-tailed with injection
      sizes log-uniform over 0.1 to 30 bits, uniform over 0.1 to 5 bits), seeds recorded and disjoint.
      Evaluation points: three frozen input vectors spanning the plausible range, with correctness
      error at 2^-140, hash queries at 2^64, 2^96 and 2^128, and other inputs held fixed. Bootstrap:
      1000 resamples for recovery error and rank correlation. Stubs: always-zero and always-large
      ledgers. All arithmetic exact rational.'
  controls:
  - Fully explicit exact chain with true amnesty zero, run in the same invocation.
  - Injected-drop family with known bit sizes, as the positive control for recovery and ranking.
  - Two injection generators, heavy-tailed and uniform, so the heavy-tail claim cannot be confirmed
    by the generator alone.
  - Three frozen evaluation points, measuring the total's location sensitivity.
  - Quantifier-changing step counter, reporting how many steps are not magnitude replacements.
  - An always-zero stub ledger and an always-large stub ledger through the identical harness, fixing
    the endpoints of the recovery scale.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A FULLY EXPLICIT SYNTHETIC CHAIN in which every step is an exact identity,
    so its true amnesty is exactly zero by construction, run through the IDENTICAL ledger pipeline
    in the same invocation as every other arm. The ledger must report exactly zero bits and an empty
    heavy-tail structure. If it reports a positive total, the pipeline manufactures amnesty out of
    exact steps and every other number is void. The positive side of the control is the injected-drop
    family: chains built by taking the exact chain and replacing k steps with inequalities of known
    bit size, where the ledger must recover the injected total and rank the contributors correctly.
    Neither control alone is sufficient, since a pipeline that always reports zero passes the first
    and fails the second, and one that always reports a large number does the reverse.'
  independent_variables:
  - 'chain type: exact, injected with k replaced steps'
  - number of injected drops k, 1 through 6
  - 'injection generator: heavy-tailed or uniform'
  - evaluation point, three frozen levels
  - 'ledger implementation: real, always-zero stub, always-large stub'
  metrics:
    primary:
    - ledger total in bits per chain and per evaluation point
    - relative error between recovered and injected total, with bootstrap interval
    - Spearman rank correlation between identified and true top contributors
    - fraction of total carried by the top two steps, per generator
    - swing of the total across the three evaluation points
    secondary:
    - count of steps that are not magnitude replacements
    - stability of the top-contributor ranking across evaluation points
    - stub endpoint values
    - maximum rational denominator encountered
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exact-chain total, the recovery error on injected chains, and the rank correlation
      of identified with true top contributors.
    formula: 'Registered before the run: exact-chain total exactly 0 bits at every evaluation point;
      relative recovery error at most 0.01, defined as the absolute difference between recovered and
      injected total divided by the injected total; Spearman rank correlation at least 0.9 between
      the ledger''s per-step bit values and the true injection sizes; top-two fraction at least 0.5
      under the heavy-tailed generator and reported without a threshold under the uniform generator,
      since a uniform generator is expected to produce no concentration and that contrast is the point;
      always-zero stub recovery error exactly 1.0 and always-large stub rank correlation approximately
      0.'
    source: Pre-registered in the parent proposal IDEA-20260816-8596af before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested on a twelve-step self-authored exact chain and self-authored injected families,
      because no reduction chain is filed in this corpus and RQ-FRODO-a2dbe2 constraint 1 forbids
      designing against one. TRANSFER ASSUMPTION, stated plainly and not assumed benign: the exact-chain
      null and the recovery calibration transfer as statements about the PIPELINE, which is what they
      are meant to be. The heavy-tail fraction does not transfer at all, since it is set by the injection
      generator, and this is why two generators are run and why the contrast between them, rather
      than either value, is what is reported. Nothing measured here says anything about the drop structure
      of any real derivation.'
    correspondence: null
  tail_checks:
  - Report the largest single-step amnesty per chain, since the total can be dominated by one entry
    and the total alone would hide it.
  - Report recovery error at k = 1 separately, where a single injected drop is easiest to recover
    and a failure would indicate a basic defect.
  - Report the top-two fraction under both generators side by side rather than pooled, since pooling
    would erase the contrast the design exists to show.
  - Report the ranking stability across evaluation points, since a total that is stable while the
    ranking is not would still make the audit trail unusable.
  - Report the maximum rational denominator, since growth there is the practical failure mode of exact
    arithmetic over a long chain.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if the exact chain returns a nonzero total at any evaluation point.
  - Halt and report if either stub fails to produce its endpoint value, since the harness would be
    broken.
  - Cap total wall clock at one CPU-hour; a cap hit is an infrastructure outcome and never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The exact chain returns exactly zero at all three evaluation points, both stubs
    return their endpoint values, recovery error is within one percent at every k under both generators,
    rank correlation is at least 0.9, and the top-two fraction separates the heavy-tailed generator
    from the uniform one.
  falsification_criterion:
  - The exact chain returns a nonzero total.
  - Recovery error exceeds the pre-registered threshold at any k.
  - Rank correlation falls below the pre-registered threshold, so the audit trail misidentifies dominant
    contributors.
  - The top-two fraction is the same under both generators, so the concentration measurement reflects
    nothing but the pipeline.
  - The total swings across evaluation points by more than the chain's own total.
  - A stub fails to produce its endpoint value.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8596af
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Step granularity is a free parameter that directly sets the number of ledger entries and hence
    the concentration measurement; a Coordinator must fix a granularity rule before approval, since
    choosing it after seeing results would determine the headline.
  - Justification classes are self-reported and unverified; a Coordinator must decide whether class-level
    summaries may be reported at all or whether only the totals and rankings are admissible.
  - Whether an amnesty ledger for a real chain is worth commissioning depends on the location-sensitivity
    result, so the sequencing of any follow-on contract is a Coordinator decision and must not be
    pre-committed here.
