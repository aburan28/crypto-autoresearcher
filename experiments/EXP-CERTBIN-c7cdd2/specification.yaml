# EXP-CERTBIN-c7cdd2
# Hamming-ball cardinalities. No normal basis.
# Approved by DEC-20261002-4477c6.
experiment:
  id: EXP-CERTBIN-c7cdd2
  hypothesis_id: H-CERTBIN-09c438
  source_idea: IDEA-20260926-b6cc43
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Hamming-ball cardinalities
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-4477c6
  objective: >-
    Expand the Hamming balls at n = 131, place them against the
    written powers of two, and count cyclic-shift weight changes
    on strings of length 17.
  inputs:
    c6: 6249655776
    c6_above_3254: true
    c6_below_3255: true
    c6_above_32_5: true
    b6: 6559349864
    b6_above_3261: true
    b6_below_3262: true
    b6_above_32_6: true
    b6_below_32_7: true
    b6_fourth_above_2_130: true
    b6_fourth_below_2_131: true
    divisor: 262
    quotient: 25035686
    remainder: 132
    c7: 111600996000
    c7_above_3669: true
    c7_below_3670: true
    c7_below_36_7: true
    b7: 118160345864
    b7_above_3678: true
    b7_below_3679: true
    b7_below_36_8: true
    c13: 290414633295556000
    c13_above_58: true
    c13_above_5801: true
    c13_below_5802: true
    b16: 160288081514583958464
    b16_above_67: true
    b16_above_6711: true
    b16_below_6712: true
    b34: 45209915448071525430012508996684
    b34_above_10515: true
    b34_below_10516: true
    b34_below_115: true
    excess_above_984: true
    excess_below_985: true
    b2_17: 154
    b3_17: 834
    c17_3: 680
    parts_17: [1, 17, 136, 680]
    b3_19: 1160
    parts_19: [1, 19, 171, 969]
    rotation_strings: 131072
    rotation_failures: 0
    drop_high_changes: 65536
    high_bit: 65536
    high_bit_weight: 1
    dropped_weight: 0
  controls:
    - >-
      A radius-6 ball of at least 2^32.7 elements is the written
      figure. The ball has 6559349864 elements, and its tenth
      power is strictly below 2^327. Reporting the written side
      invalidates the run.
    - >-
      A radius-34 ball of at least 2^115 elements is the written
      figure. The excess of exponent 115 over the true logarithm
      is strictly above 9.84 bits and strictly below 9.85 bits.
      Reporting the ball as at least 2^115 invalidates the run.
    - >-
      A zero remainder on division by 262 is false. The remainder
      is 132. Reporting 0 invalidates the run.
    - >-
      A cyclic shift that changes a length-17 weight is false.
      The failure count is 0 on 131072 strings. Reporting a
      failure invalidates the run.
    - >-
      Dropping the high bit of 65536 preserves weight 1 is false.
      The image has weight 0. Reporting weight 1 invalidates the
      run.
    - Two counting routes. They must not import each other.
  independent_variables:
    - radius
    - route in {multiplicative, pascal}
  metrics:
    primary:
      - b6
      - b34
      - remainder
      - rotation_failures
      - implementations_agree
    secondary:
      - excess_hundredths
      - toy_balls
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The radius-6 count 6559349864 and the radius-34 count.
    formula: >-
      The radius-w ball is the sum of C(n, k) for k from 0
      through w. Logarithm sides are integer power comparisons.
      A cyclic shift permutes coordinates. Dropping the high bit
      and appending 0 does not. The excess test is
      B^100 * 2^984 against 2^11500.
    source: >-
      IDEA-20260926-b6cc43 states the ball sizes, including a
      radius-34 size of about 2^115, read 2026-10-02. The
      binomials were expanded in this design session. That
      expansion is not a run. The radius-34 ball is strictly
      below 2^115. No normal basis was built.
  scale_relevance:
    tier: toy
    justification: Binomial sums and one bit scan. No transfer to a solve cost.
    correspondence: null
  tail_checks:
    - The radius-34 ball is required. Stopping after radius 6 and still reporting the radius-34 count is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other counting route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the radius-34 ball is reported at least 2^115, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The radius-6 ball is reported at least 2^32.7.
    - The radius-34 ball is reported at least 2^115.
    - The excess is reported at most 9.84 bits or at least 9.85 bits.
    - The remainder on division by 262 is reported as 0.
    - A length-17 rotation failure is reported.
    - The dropped image of 65536 is reported with weight 1.
    - A normal basis or a curve point count is reported.
  success_criterion: >-
    Both runs agree on C(131, 6) = 6249655776, the radius-6 ball
    6559349864, quotient 25035686 and remainder 132, C(131, 7) =
    111600996000, the radius-7 ball 118160345864, C(131, 13) =
    290414633295556000, the radius-16 ball
    160288081514583958464, the radius-34 ball
    45209915448071525430012508996684, the toy counts 154, 834
    and 1160, and 0 rotation failures on 131072 strings. The
    radius-34 ball stays strictly below 2^115. The excess stays
    strictly above 9.84 bits and strictly below 9.85 bits.
  falsification_criterion: >-
    The runs agree, the radius-34 ball stays below 2^115, the
    remainder stays 132, and any count differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-CERTBIN-c7cdd2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-c7cdd2/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-c7cdd2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-c7cdd2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-c7cdd2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-c7cdd2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any normal basis, curve, closure, or decomposition solve.
    - A claim that a Hamming ball helps or does not help as a factor base.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
