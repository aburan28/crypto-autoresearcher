experiment:
  id: EXP-MDFIVE-553fc2
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-3e6af3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-3e6af3
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate exact path probabilities on a 16-bit-state ARX primitive, compare them with the
    condition-counting instrument's predictions, and report the predicted-to-actual ratio by condition
    count with a random-bijection null.
  objective: 'The run reduces one uncertainty: by how much this program''s condition-counting instrument
    overstates or understates path probability, on a primitive where the true probability is a counted
    quantity rather than an estimate. As parts: (i) it establishes that the measurement can detect
    dependence at all, using two hand-constructed paths whose true ratios are known exactly, namely
    a contradictory pair and an identical pair, which is a precondition for interpreting any sampled
    result; (ii) it produces the ratio distribution by condition count, step index and round over
    a declared path sampling distribution, published alongside the ratios because the ratio is meaningless
    without it; (iii) it pins the null, since a random-bijection primitive must return a ratio of
    one and any drift there means the enumeration or the path grammar is biased rather than that the
    ARX structure is doing something. The run reduces no uncertainty about MD5, produces no path for
    MD5, and cannot correct any complexity anywhere. Its purpose is to attach an error bar to every
    condition count that the sibling records in this batch will quote, so that a difference between
    two counts is not read as a difference between two difficulties when the instrument''s own error
    exceeds it.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for the declared 16-bit ARX primitive,
      the declared path sampling distribution and the declared condition-counting module fingerprinted
      in the manifest, the predicted-to-actual probability ratio has median r(c) with the stated interquartile
      range, and the random-bijection null has median one. What does NOT follow: nothing about MD5,
      nothing about any published complexity, nothing about whether any analysis anywhere is correct,
      and no transfer of the ratio to 32-bit words unless the width sweep shows stability, which the
      run explicitly tests rather than assumes.'
  inputs:
    procedure: STAGE 0 define the 16-bit ARX primitive and the path grammar in the specification file,
      and freeze the path sampling distribution before any run; cost review time. STAGE 1 implement
      the two hand-constructed control paths and verify their exact ratios by enumeration; cost minutes,
      and failure halts the run since the measurement would be unable to see dependence. STAGE 2 import
      the condition-counting module used by the sibling records, fingerprint it into the manifest,
      and validate it on the control paths; cost minutes. STAGE 3 sample 10^3 paths per condition
      count c in 1..12 and enumerate the full 2^16 state space per path; cost seconds to minutes.
      STAGE 4 aggregate ratios by c, step and round, reporting empty-set rates. STAGE 5 run the identical
      grid on the random-bijection null in the same invocation. STAGE 6 run the XOR-ablated arm. STAGE
      7 run the width sweep at 5-bit and 6-bit words with reduced path counts, enumerating 2^20 and
      2^24 states respectively; cost minutes to an hour. STAGE 8 emit the manifest, the ratio arrays
      and the published path distribution.
    instrument: Python 3.11 with numpy for the full-state enumeration as a vectorised sweep, run under
      harness/runner.py so seeds, the module fingerprint and the wall-clock ceiling land in the manifest.
      The condition-counting routine is imported from the sibling record's module without modification
      and its content hash is recorded, so that a later change to that module invalidates this calibration
      explicitly rather than silently. The ARX primitive and its random-bijection null share one interface
      in one file. No Sage, no SAT solver, no symbolic algebra.
    parameters: 'Primary primitive: 4 words of 4 bits, 16-bit state, MD5-shaped step with reduced
      nonlinear functions and rotations modulo 4, 16 steps. Path grammar: sequences of bit-level state
      conditions at declared step indices. Condition counts c swept 1..12. Paths per c: 10^3. Enumeration:
      full 2^16 per path. Null: identical grid. Width sweep: 5-bit words at 2^20 with 200 paths per
      c, 6-bit words at 2^24 with 50 paths per c. Controls: 2 hand-constructed paths with known exact
      ratios 0 and 2.'
  controls:
  - Random-bijection null primitive with identical state size, schedule and path grammar, in the same
    invocation.
  - Width sweep from 4-bit to 6-bit words, testing whether the ratio transfers across width at all.
  - XOR-ablated ARX primitive with no carries, where conditions within a word should decouple and
    the ratio should move toward one.
  - A hand-constructed path with two deliberately contradictory conditions, whose true probability
    is exactly zero, which the instrument must be seen to mispredict, confirming the measurement can
    detect dependence.
  - A hand-constructed path with two deliberately identical conditions, whose true probability is
    2^-1 while the instrument reports c = 2, giving a known ratio of exactly 2 as a positive control.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null primitive has the same state size, the same schedule and the
    same path grammar, but each step is a random bijection keyed by the message word. Conditions on
    such a primitive are genuinely independent, so the identical enumeration must return r = 1 within
    the noise implied by the enumeration size. The identical code path computes both. For the signal
    arm to mean anything the null must be flat at one across the whole c range; a null that drifts
    from one indicates that the enumeration, the path grammar, or the counting routine is biased,
    and no signal-arm ratio may be reported until it is fixed.'
  independent_variables:
  - condition count c
  - step index at which conditions are imposed
  - 'primitive arm: ARX, random-bijection null, XOR-ablated'
  - 'word width: 4, 5, 6 bits'
  metrics:
    primary:
    - exact satisfying-state count per path
    - instrument condition count c per path
    - ratio r = p_true / 2^-c per path
    - median r per c with interquartile range
    - null median r per c
    secondary:
    - empty-satisfying-set rate per c
    - ratio broken down by step index and round
    - XOR-ablated arm ratios
    - width-sweep medians at 5 and 6 bits
    - condition-counting module content hash
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The median predicted-to-actual ratio at condition count 8 on the 4-bit ARX primitive,
      and the null median across all c.
    formula: 'r(path) = (number of states satisfying the path, divided by 2^16) divided by 2^-c(path),
      where c is the instrument''s sufficient-condition count. Predicted: median r at c = 8 is at
      least 1.5 on the ARX arm; null median r within [0.9, 1.1] at every c; positive-control path
      with two identical conditions returns exactly 2.'
    source: Pre-registered in the parent proposal IDEA-20260816-3e6af3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The primitive is a 16-bit-state ARX construction chosen because 2^16 is exhaustively
      enumerable, which is the entire reason the true probability is a counted quantity here rather
      than an estimate. Transfer to 32-bit words is not assumed: it is tested by the width sweep to
      5 and 6 bits, and the record states that if the ratio moves by more than 0.2 across that sweep,
      no value from this run may be quoted as an error bar for MD5-width counts, and the calibration
      stands only within the widths measured.'
    correspondence: null
  tail_checks:
  - The contradictory-conditions control must return an exactly empty satisfying set.
  - The identical-conditions control must return a ratio of exactly 2.
  - The null median must be flat at one across every c; drift halts interpretation.
  - Empty-set rates must be reported per cell and cells above 50 percent empty are excluded from medians
    and marked as excluded.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if either hand-constructed control fails.
  - Halt if the condition-counting module's content hash does not match the version the sibling records
    use.
  - Fix path counts per cell before the run and do not extend a cell after seeing its ratio.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both hand-constructed controls return their exact known values, the null median
    lies within [0.9, 1.1] at every c, and the ARX median ratio at c = 8 is at least 1.5 with an interquartile
    range excluding 1.1, with the full grid reproducible from the manifest seeds.
  falsification_criterion:
  - Null median outside [0.9, 1.1] at any c.
  - Either hand-constructed control fails.
  - ARX median ratio within [0.9, 1.1] at every c, meaning no error bar is needed.
  - Median ratio moves by more than 0.2 across the 4-to-6-bit width sweep, forbidding transfer.
  - More than half the cells are excluded for empty-set dominance.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-3e6af3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The path sampling distribution must be fixed by the Coordinator before approval, because the ratio
    is a joint property of the primitive and that distribution and a post-hoc choice would make the
    calibration unfalsifiable.
  - 'A ruling is needed on what the sibling records must do if the ratio proves width-dependent: whether
    they quote the measured widths only, or whether their condition counts become unquotable pending
    a wider calibration.'
  - The reduced nonlinear functions for 4-bit words need specifying, since several reductions of MD5's
    F, G, H and I are defensible and they differ in how strongly they couple conditions.
