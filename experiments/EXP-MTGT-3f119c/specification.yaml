experiment:
  id: EXP-MTGT-3f119c
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-d7a5d4
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'harness/transport.py -- THE MISSING INSTRUMENT, WITHOUT WHICH NO L13 EXPERIMENT CAN RUN
    AT ALL: the harness contains ZERO isogeny code (verified by grep across harness/*.py), the program''s
    only prior "advice transfer" script never constructs or evaluates an isogeny, and so the lane''s
    central question has never been executable; this record specifies a class enumerator, a Velu constructor
    and evaluator with an explicit FIELD-OPERATION COUNTER, a dual, a shortest-path search, and a
    re-verifiable T1 CERTIFICATE FAMILY that a validator can check without trusting the transport
    code'
  status: draft
  objective: "(A) THE GAP, ESTABLISHED BY GREP AND BY READING, NOT BY IMPRESSION. `grep -rin \"isogeny\\\
    |velu\" harness/` returns hits in harness/README.md only and ZERO hits in any of harness/toycurve.py,\
    \ semaev.py, rho.py, endomorphism_la.py, runner.py, run.py, fixed_curve_preprocessing.py. The\
    \ program can generate toy curves, run Pollard rho, build Semaev factor bases, measure S_3 decompositions\
    \ and write immutable run records -- and it cannot move a single point from one curve to another.\
    \ Meanwhile experiments/EXP-ISADV-001/advice_transfer.py, the one artifact named in the corpus\
    \ as an isogeny-transfer probe, was read in full for this batch: it groups curves by #E(F_p) (correct),\
    \ then picks a generator on each member INDEPENDENTLY via first_point() and compares x-coordinate\
    \ sets. It contains no isogeny construction and no isogeny evaluation. It also has no contract.md,\
    \ no specification.yaml and no ledger experiment record (ideas/catalogue-20260805/SCREENING.md\
    \ line 175). CONSEQUENCE: every claim in lane L13 about transport is, today, unexecutable, and\
    \ the lane's prior \"scoped negative on transfer\" was produced by an instrument that could not\
    \ have observed transport in either direction.\n(B) WHAT THE MODULE MUST PROVIDE, AS A SPECIFICATION\
    \ AND NOT A WISH LIST.\n  B1. CLASS ENUMERATION. Given p and a trace t, enumerate all F_p-curves\n\
    \    (a, b) with #E = p + 1 - t, up to F_p-isomorphism, recording the\n    j-invariant of each\
    \ so that isomorphic duplicates are visible and never\n    silently counted as distinct classmates.\n\
    \  B2. RATIONAL KERNEL SEARCH. For a small prime ell, find the F_p-rational\n    subgroups of\
    \ order ell of E, i.e. the Frobenius-stable order-ell\n    subgroups. At toy scale this is a direct\
    \ search over the ell-torsion.\n  B3. VELU CONSTRUCTION AND EVALUATION. From a kernel, produce\
    \ the codomain\n    curve and the rational maps (f(x), g(x)*y), and evaluate them at a point.\n\
    \    Velu construct-and-evaluate is about 6*ell field operations\n    (KN-LIT-780, relayed); the\
    \ module must MEASURE this, not assume it.\n  B4. THE FIELD-OPERATION COUNTER. Every multiplication,\
    \ inversion, addition\n    and squaring in the transport path is counted, in a register SEPARATE\n\
    \    from the group-operation counter that harness/rho.py already maintains.\n    THIS IS THE\
    \ SINGLE MOST IMPORTANT REQUIREMENT IN THE RECORD: the whole\n    lane's cost model turns on charging\
    \ isogeny construction ONCE and isogeny\n    evaluation PER POINT, and a module that reports only\
    \ wall clock cannot\n    support any of it.\n  B5. THE DUAL. Given phi, produce phi-hat with phi-hat\
    \ o phi = [deg phi].\n    Required by the target-pullback mode (IDEA-20260807-a127ab Mode B),\
    \ which\n    is the mode the lane's cost model says dominates.\n  B6. SHORTEST PATH. Breadth-first\
    \ search over the enumerated class using the\n    constructed small-ell edges, returning the path\
    \ and its (L, ell_max). A\n    path search that returns a needlessly long path silently inflates\
    \ every\n    transport cost figure in the lane.\n  B7. THE CERTIFICATE. See (C).\n  B8. TABLE\
    \ TRANSPORT. Given a list of (point, scalar) pairs and phi, return\n    the transported list plus\
    \ the per-entry certificate outcomes.\n\n(C) THE CERTIFICATE FAMILY, WHICH IS WHAT MAKES THE MODULE\
    \ TRUSTWORTHY. Per docs/claims-and-verification.md the run wrapper must re-verify claims independently\
    \ of the solver. For transport the certificate has four parts, all cheap and all checkable without\
    \ re-running the transport code:\n  C1 CODOMAIN: the image curve (a', b') is nonsingular and\n\
    \    #E'(F_p) = #E(F_p), i.e. the declared codomain is in the class.\n  C2 MODULAR: for a prime-degree\
    \ step, Phi_ell(j(E), j(E')) = 0 for the\n    classical modular polynomial. At the small ell this\
    \ lane uses, Phi_ell is\n    a fixed known polynomial and the check is a polynomial evaluation.\
    \ THIS\n    IS THE CHECK THAT AN INDEPENDENT VALIDATOR CAN RUN WITHOUT ANY OF THE\n    TRANSPORT\
    \ CODE, and it is the reason the certificate family is worth\n    specifying rather than improvising.\n\
    \  C3 INSTANCE: phi(P) != O, [N]phi(P) == O, and phi(Q) == [k]phi(P) for the\n    toy instance's\
    \ known k. This is T1 made checkable.\n  C4 DUAL: phi-hat(phi(R)) == [deg phi]R for a sample of\
    \ points, including at\n    least one point of order N.\n  A transported table entry additionally\
    \ carries C5: [r_i]phi(P) ==\n  phi(R_i), recomputed by a scalar multiplication that does NOT\
    \ call the\n  transport routine.\n  An arm whose certificate fails is INVALID under AGENTS.md\
    \ rule 5 -- an\n  infrastructure outcome -- and is never recorded as negative mathematical\n \
    \ evidence about transport.\n\n(D) THE KNOWN-ANSWER TESTS, WHICH MUST PASS BEFORE ANY MEASUREMENT.\
    \ Written here so they cannot be relaxed later:\n  D1. ell = 2 from a rational 2-torsion point:\
    \ kernel {O, T} with T = (x0, 0);\n    the constructed codomain must satisfy Phi_2(j, j') = 0.\n\
    \  D2. Composition with the dual is multiplication by deg phi (C4), tested on\n    20 random points\
    \ per constructed isogeny.\n  D3. The class enumerated by trace must be CONNECTED by the constructed\n\
    \    small-ell edges. If it is not, either the enumeration or the edge\n    construction is incomplete,\
    \ and every \"shortest path\" figure is wrong.\n  D4. ell = 1 IDENTITY AND ISOMORPHISM: an F_p-isomorphism\
    \ (x, y) ->\n    (u^2 x, u^3 y) must be constructible and must transport a table with\n    retention\
    \ exactly 1.000 and zero degree change. This is the positive\n    control that IDEA-20260807-0e8977\
    \ and IDEA-20260807-465744 both require.\n  D5. NEGATIVE: given two curves of DIFFERENT trace,\
    \ the path search must\n    return \"no path\" rather than any path. A module that manufactures\
    \ a path\n    between different classes invalidates every null control in the lane.\n  D6. FIELD-OPERATION\
    \ COUNTER CALIBRATION: transporting S points must cost\n    S times the single-point cost plus\
    \ the one-time construction, to within\n    5%. A counter whose total is not affine in S is not\
    \ separating\n    construction from evaluation and cannot support the lane's cost model.\n\n(E)\
    \ WHAT THE MODULE MUST NOT DO. It must not modify any existing harness module -- toycurve.py,\
    \ rho.py, semaev.py, runner.py are relied on by committed run records and their behaviour is frozen.\
    \ It must not import from experiments/. It must emit run records through harness/runner.py's existing\
    \ write_run so that provenance, git state, seeds and environment are captured identically to every\
    \ other run in the program. And it must not contain any ECDLP solving logic: transport is a map,\
    \ the solvers already exist, and mixing them is how a transport bug becomes an apparent speedup."
  resource_label: 'audit: consumes no resource. A tooling record asserts no mechanism. It ENABLES
    the R4/R8 records of this lane (IDEA-20260807-a127ab, e0ddc6, 0e8977, 406fef, 465744) and the
    R1/R4 measurements of 465744, and it is the dependency every one of them has in common.'
  admissibility: admissible
  admissibility_argument: 'Tooling consumes no resource and therefore cannot fail the admissibility
    filter of DECOMPOSITION.md section 2. It is worth recording, though, that the module is capable
    of producing an INADMISSIBLE measurement if misused: a script that applies phi to points of G
    and reports a retention rate is, taken alone, exactly the pattern the filter closes. The module''s
    certificate design (C) does not prevent that -- nothing in code can -- so this record''s obligation
    is to state it: harness/transport.py enables both the admissible M-instance accounting and the
    inadmissible single-instance reading, and which one a run is doing is determined by the experiment
    contract, not by the module.'
  reachability_gate: THE MODULE IS THE INSTRUMENT THAT MAKES THE GATE MEASURABLE, WHICH IS ITS SECOND-MOST-VALUABLE
    PROPERTY. Every other L13 record prices path-finding from an ASSUMPTION -- p^{1/4+o(1)} claw-finding
    steps at a per-step cost of O(ell^3), O(ell^2) or O(sqrt(ell)) depending on which model applies,
    a range that research/JMV004_branch_a_scouting_20260726.md (SCOUTING, not evidence) shows spans
    2^{19.8} to 2^{85.8} for the JMV reduction at 256 bits. With B6 and B4 in place, the toy-scale
    path length distribution and the per-step field-operation cost become MEASURED quantities rather
    than assumed ones, at least in the regime where the class is enumerable. That does not settle
    the crypto-scale question -- nothing at toy scale can -- but it converts the lane's most load-bearing
    assumption from unexamined to calibrated, and it is the concrete route by which heuristic H1 of
    IDEA-20260807-a127ab gets its toy-scale validation arm.
  inputs:
    procedure: 'STAGE 0 (hours, implementation): the counter, B1 enumeration, and B2/B3 at ell = 2
      only. STAGE 1 (minutes, HARD GATE): D1 -- one ell = 2 isogeny with Phi_2(j, j'') = 0 checked
      exactly, and C3 checked against a toy instance with known k. THIS IS THE CHEAPEST POSSIBLE PROOF
      THAT THE PROGRAM CAN TRANSPORT A POINT AT ALL, and it is a capability the program does not currently
      have. STAGE 2 (minutes): D2 dual, D4 isomorphism arm, D5 cross-class null. STAGE 3 (low hours):
      ell in {3, 5, 7}, D3 connectivity on enumerated toy classes, D6 counter affinity, and the broken-map
      injections. STAGE 4 (hours): archive the whole battery as a frozen fixture, with run records
      emitted through harness/runner.py.'
    mechanism: STEP 1 -- MODULE SKELETON AND FIELD-OPERATION COUNTER FIRST. Implement the counter
      before any curve code, and wrap the field arithmetic so that no operation can bypass it. A counter
      added afterwards always undercounts. STEP 2 -- B1 CLASS ENUMERATION with j-invariant recording,
      tested on the primes already used by advice_transfer.py (101, 211, 431) so the enumeration can
      be compared against a known prior artifact. STEP 3 -- B2/B3 KERNEL SEARCH AND VELU, starting
      with ell = 2 from rational 2-torsion, then ell = 3, 5, 7. Gate on D1 (Phi_ell check) before
      proceeding. STEP 4 -- B5 DUAL, gated on D2. STEP 5 -- B6 PATH SEARCH, gated on D3 (connectivity)
      and D5 (no cross-class path). STEP 6 -- B7 CERTIFICATE, all five parts, with an independent
      verifier function that imports NOTHING from the transport code path. STEP 7 -- B8 TABLE TRANSPORT
      plus D6 (counter affinity in S). STEP 8 -- D4 ISOMORPHISM ARM, which supplies the ell = 1 positive
      control the rest of the lane depends on. STEP 9 -- EMIT RUN RECORDS through harness/runner.py
      write_run, with the per-run metrics listed in required_metrics, and archive the whole battery
      as the frozen fixture that every later L13 run must pass.
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - cross-class null (no path)
  - identity/isomorphism degeneracy arm (zero evaluation cost, retention 1.000)
  - injected broken maps (must be caught)
  - self-comparison arm (same j, claimed degree > 1)
  - independent certificate verifier with no transport-code imports
  - ell sweep as the cost-counter decay test
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, AND THE MODULE IS JUDGED BY ITS NULLS\
    \ RATHER THAN BY ITS FEATURES. (1) CROSS-CLASS NULL (D5): two curves of different trace. The path\
    \ search\n  must return \"no path\". A module that returns a path here silently converts\n  every\
    \ null arm in the lane into a treatment arm.\n(2) DEGENERACY NULL: phi = identity (D4 at u = 1).\
    \ Transport must be the\n  identity on points, the field-operation counter must read zero for\n\
    \  evaluation, and retention must be exactly 1.000.\n(3) BROKEN-MAP NULL: a deliberately corrupted\
    \ rational map (wrong sign, wrong\n  constant, wrong codomain). Every one must be caught by certificate\
    \ part C2\n  or C3. An uncaught corruption means the certificate is decorative.\n(4) SELF-COMPARISON\
    \ NULL: E' = E with j(E') = j(E) and a claimed degree > 1.\n  Certificate C2 must reject unless\
    \ Phi_ell(j, j) = 0 genuinely holds, which\n  is the case the module must handle correctly rather\
    \ than by accident.\nDECAY PARAMETER: ell, and path length L. The measured field-operation cost\
    \ of evaluation must GROW with ell (predicted ~6*ell per point) and with L (predicted additive\
    \ across steps). A cost that does not grow with ell means the counter is not instrumenting the\
    \ Velu inner loop, and every cost figure the lane produces would be flat and meaningless -- the\
    \ canonical artifact tell in its instrumentation form."
  independent_variables: []
  metrics:
    primary:
    - Phi_ell evaluation per edge
    - dual composition pass rate, with at least one order-N point per edge
    - connected-component count per enumerated class
    - path length L and ell_max per constructed path
    secondary:
    - field operations for construction and for per-point evaluation, separately
    - fitted slope of per-point cost against ell, with confidence interval
    - fitted affinity of total cost against S, with intercept
    - broken-map detection rate
    - wall clock and peak memory per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Phi_ell(j(E), j(E')) for every constructed prime-degree edge
    formula: EXACTLY 0 in F_p, on 100% of constructed edges. Any nonzero value halts the line.
    source: pre-registered in IDEA-20260807-d7a5d4 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ISOMORPHIC DUPLICATES. A naive (a, b) sweep returns many curves per isomorphism class. Without
    recording j-invariants, a "class of 20 members" may be 4 curves counted 5 ways, and every M-dependence
    figure in the lane inherits the error.
  - NON-RATIONAL ell-TORSION. For many small ell the ell-torsion points are not F_p-rational even
    when a rational order-ell SUBGROUP exists. A search that looks only for rational POINTS will miss
    edges and produce a disconnected class. This is the toy-scale shadow of the JMV004 caveat and
    it is the most likely cause of a D3 failure.
  - COUNTER BYPASS. Any field arithmetic done with raw Python ints outside the wrapper is uncounted.
    The counter must be structural, not sprinkled.
  - COST ATTRIBUTION. Construction cost charged per point instead of once inflates Mode A by S; charged
    once when it should be per path deflates it. One convention, declared, and D6 is the test.
  - SMALL-p DEGENERACIES. At p ~ 101 there are curves with unusual automorphism groups and the ell-torsion
    structure is atypical. Primes must be chosen so that the class has at least 4 distinct j-invariants,
    and that criterion must be declared in advance.
  - SUPERSINGULAR CONTAMINATION. A trace-based enumeration will collect supersingular curves when
    t = 0 mod p. They must be excluded explicitly, as advice_transfer.py already does, and the exclusion
    recorded.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 0 in F_p, on 100% of constructed edges. Any nonzero value halts the line.
  falsification_criterion:
  - Phi_ell(j, j') is nonzero for a constructed edge. The construction is wrong; halts the line. Implementation
    fault, not a mathematical result.
  - The dual composition fails on any point of order N. The dual is wrong and Mode B is unavailable
    to the lane.
  - A trace-enumerated class is disconnected under the constructed edges. Either the enumeration or
    the edge construction is incomplete; every path-length figure is void until it is resolved, and
    the incompleteness must be reported rather than worked around by adding larger ell until it connects.
  - The path search returns a path between curves of different trace. Every null control in the lane
    is compromised.
  - Per-point cost is flat in ell. The counter is not instrumenting the Velu inner loop; every cost
    figure in the lane is meaningless.
  - Total cost is not affine in S. Construction and evaluation are not separated, which is the exact
    distinction the lane's Mode A / Mode B comparison depends on.
  - Enumeration at the target primes exceeds the time or memory budget. INFRASTRUCTURE outcome (AGENTS.md
    rule 5), recorded as such, and not evidence about anything.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
