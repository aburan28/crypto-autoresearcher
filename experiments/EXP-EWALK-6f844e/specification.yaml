experiment:
  id: EXP-EWALK-6f844e
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-4cebed
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE LOSSY-PROJECTION TEST APPLIED TO THE LANE''S OWN CENTRAL OBJECT, AND IT FAILS THE SECOND
    CLAUSE: the negation class IS the x-coordinate, x-only addition is not a function of x alone (it
    needs x(A-T) to pick between the two roots), so the projection is lossy but does NOT propagate
    -- and the two repairs are exhaustively enumerable, with canonicalise-then-add paying fruitless
    cycles and tag-tracing paying either a factor sqrt(r/2) in state size or a factor 2^d in lost
    distinguished-point merges; both branches are derived to be strictly worse, which makes this a
    closure with a QUANTIFIED obstruction rather than a fatigue report'
  status: draft
  objective: "(A) THE PROJECTION, AND THE FIRST CLAUSE IT PASSES. The negation quotient is not merely\
    \ LIKE the x-coordinate map, it IS it: for A = (x, y) on y^2 = x^3 + ax + b, -A = (x, -y), so\
    \ the map A |-> x(A) has exactly the Aut = {+-1} orbits as fibres. It is genuinely lossy -- one\
    \ bit, the sign of y, is destroyed and A is not recoverable from x -- so it is not a change of\
    \ coordinates in the sense of docs/inventor-protocol.md section 2, and it passes the first clause\
    \ of the lossy-projection test cleanly.\n(B) THE SECOND CLAUSE, AND IT FAILS, EXACTLY AND CLASSICALLY.\
    \ The test's second clause asks that what is discarded be discarded COMPATIBLY with the target's\
    \ operations, so the retained part still propagates deterministically. It does not. Given x(A)\
    \ and x(T) alone, x(A + T) is NOT determined: x(A+T) and x(A-T) are the two roots of a single\
    \ quadratic whose coefficients depend only on x(A) and x(T), so the pair {x(A+T), x(A-T)} is determined\
    \ and the individual values are not. THAT IS THE WHOLE STRUCTURAL CONTENT OF LANE L6 IN ONE SENTENCE,\
    \ and it is why the lane has a fruitless-cycle problem at all: the projection that buys the factor\
    \ sqrt(2) is exactly the projection that breaks determinism, and every device in the lane is a\
    \ repair for that break.\n(C) THE REPAIRS ARE EXHAUSTIVELY ENUMERABLE, WHICH IS WHAT MAKES THIS\
    \ A CLOSURE RATHER THAN A SURVEY. To make an x-only step deterministic one must supply the missing\
    \ bit. There are exactly three sources of it and no fourth:\n  (R1) SUPPLY IT FROM THE CLASS ITSELF\
    \ -- canonicalise: lift x to the point\n    with the canonical square root y, then add. Deterministic\
    \ on classes.\n    PRICE: the lift needs a square root (or, equivalently, the walk carries\n \
    \   y and canon compares it), the comparison needs affine normalisation and\n    hence an inversion,\
    \ and the canon step re-injects a sign choice at\n    every step, which is precisely the fruitless-cycle\
    \ mechanism derived in\n    IDEA-20260807-6355c6 at rate 1/(|Aut| r). This is the standard method\n\
    \    and the rest of the lane measures it.\n  (R2) SUPPLY IT FROM THE PAST -- tag tracing: carry\
    \ the pair\n    (x(R_t), x(R_t - T_{s_{t-1}})) so the next step is a pure differential\n    addition,\
    \ with no square root, no normalisation for canon, and NO SIGN\n    CHOICE, hence NO FRUITLESS\
    \ CYCLES AT ALL. This is the genuinely\n    attractive branch and it is the one this record exists\
    \ to price.\n  (R3) SUPPLY IT FROM THE FUTURE -- choose the branch that makes some\n    predicate\
    \ true (e.g. always take the root with smaller encoding). This\n    is a canonicalisation of the\
    \ OUTPUT rather than the input and is a\n    relabelled (R1); it has the same sign re-injection\
    \ and the same cycle\n    structure, and the record says so rather than counting it as a fourth\n\
    \    option.\nSo the enumeration is (R1), (R2), and (R3) = (R1). The lane's whole design space\
    \ at this level is two points.\n(D) (R2) IS PRICED, IN BOTH OF ITS OWN BRANCHES, AND BOTH ARE\
    \ LOSSES.\n  (R2a) DECLARE COLLISIONS ON THE TAGGED STATE. The state is the pair\n    (x, tag),\
    \ and the reachable tagged state is determined by\n    (R_t, s_{t-1}), so the state space has\
    \ about (N/2)*r elements. The\n    birthday law then gives expected steps 1.2533*sqrt(N r / 2)\
    \ against the\n    canonicalised walk's 1.2533*sqrt(N/2): a factor sqrt(r) WORSE. At the\n   \
    \ Teske-recommended r = 20 that is sqrt(20) = 4.47x worse, wiping out the\n    sqrt(2) = 1.414\
    \ the projection bought and much more.\n  (R2b) DECLARE COLLISIONS ON THE x-COMPONENT ONLY. The\
    \ collision RATE is\n    then restored -- any two trajectories sharing an x share a group\n  \
    \  relation up to sign, which is usable. But the MERGING PROPERTY IS\n    DESTROYED: two trajectories\
    \ that meet in x with different tags have\n    different successors and diverge immediately. Van\
    \ Oorschot-Wiener\n    distinguished-point detection depends entirely on merging: it detects a\n\
    \    collision because both walks, having merged, deterministically reach\n    the SAME next distinguished\
    \ point (KN-TECH-006). Without merging, a\n    crossing is detected only if it occurs AT a stored\
    \ point. With DP rate\n    theta = 2^-d, after T total steps there are about theta*T stored\n\
    \    points, and a birthday collision among STORED points needs\n    theta*T ~ sqrt(N/2), i.e.\n\
    \      T ~ 2^d * sqrt(N/2),\n    a factor 2^d worse than the merging method. At the 30-leading-zero\n\
    \    granularity used in the largest publicly completed ECDLP computation\n    (KN-LIT-097) that\
    \ factor is 2^30. THE OBSTRUCTION IS NOT MERELY\n    QUALITATIVE; IT IS THE DP GRANULARITY ITSELF,\
    \ WHICH IS THE PARAMETER\n    THE WHOLE PARALLEL METHOD IS BUILT AROUND.\n  Neither branch is\
    \ close. (R2) is therefore closed on cost, with the\n  obstruction named and quantified, and the\
    \ closure is derivable at zero\n  compute.\n\n(E) WHY THIS IS WORTH RECORDING RATHER THAN LEFT\
    \ IMPLICIT. Three reasons, each concrete. FIRST, tag tracing is the obvious thing to try -- it\
    \ removes the fruitless-cycle problem entirely, which is the lane's biggest headache, and a session\
    \ that reaches for it without the pricing above would spend a batch. SECOND, the pricing localises\
    \ exactly WHERE the negation quotient's cost sits: not in the sqrt(2), which is real and free,\
    \ but in the repair of a broken propagation, and the two available repairs cost fruitless cycles\
    \ or merging respectively. THIRD, it converts the lane's central folklore into a statement with\
    \ a mechanism: \"negation walks need fruitless-cycle handling\" (KN-TECH-018, KN-LIT-042) becomes\
    \ \"the negation projection breaks determinism, and cycle handling is the price of the only repair\
    \ that preserves merging.\"\n(F) THERE IS ALREADY AN AUDITED MEASUREMENT OF THE (R1)-WITHOUT-ESCAPE\
    \ CASE, AND IT AGREES. inputs/h100_session/h041_xonly_walk.json ran exactly the (R1) construction\
    \ with no escape rule -- its stated convention is \"x_state: x-coordinate; representative = (x,\
    \ min(y, p-y)); step: j = x mod r; P -> canon(P + A_j); state -> x of result\" -- and enumerated\
    \ the functional graph. It found 239-293 two-cycles at 16 bits and 383-439 at 17 bits against\
    \ a 50-draw random-function band of [0, 2]; largest components of 1806-3491 against a random mean\
    \ of 16366; a useful-collision fraction of 0.07 and 0.05; and effective per-solve constants of\
    \ 2.2988 and 3.2189, which REVIEW-H100-20260717 correction C8 re-verified as 1.83x and 2.57x WORSE\
    \ than the 1.2533 plain-rho theory. Its partner-age histogram shows 183/200 and 185/200 collisions\
    \ at age 2 -- i.e. almost every \"collision\" was the walk meeting its own immediate predecessor,\
    \ which is the fruitless 2-cycle and not a relation. THAT IS THE SIGN RE-INJECTION OF (R1) MADE\
    \ VISIBLE, and it is why this record's derivation and that artifact's numbers should be read together.\n\
    (G) WHAT REMAINS OPEN AFTER THIS CLOSURE, NAMED AS THE STANDARD REQUIRES. (i) Repairs that supply\
    \ the missing bit from a source OUTSIDE the walk -- e.g. a small amount of shared precomputed\
    \ advice, which changes the model to R8/preprocessing and is lane L13's territory, not this one.\
    \ (ii) Curve models where the x-only step IS deterministic: on a Montgomery or Kummer model the\
    \ differential addition is native, so (R2) is not a repair but the natural operation -- the state-size\
    \ and merging prices derived in (D) still apply and are model-independent, but the ARITHMETIC\
    \ price of (R1) changes and the comparison should be redone there (lane L11, RQ-MODEL-e61cb2).\
    \ (iii) Interval and multi-target settings, where Galbraith-Ruprai (KN-LIT-7437) report that equivalence\
    \ classes DO help the interval problem at a heuristic 1.36*sqrt(N) for groups with fast inversion,\
    \ and note that the standard kangaroo method appears impossible to implement with equivalence\
    \ classes -- a different problem with a different answer, and it is the direction a reader of\
    \ this closure should go next."
  resource_label: R3 (End(E) as a ring -- the unit {-1}) with R1 present only as the x-coordinate
    encoding. No field structure is used to derive a relation; the whole argument is about whether
    a projection propagates.
  admissibility: inadmissible_generic_group
  admissibility_argument: 'INADMISSIBLE, AND THE R1 APPEARANCE IS A RED HERRING THE RECORD DEFUSES
    RATHER THAN LEANS ON. Working with x-coordinates looks like resource R1 -- "x-coordinates as field
    elements" -- which is the resource that genuinely escapes the generic group model in index calculus.
    It does not escape here, because the x-coordinate is used only as an ENCODING of the negation
    class and never as an input to a polynomial system: no summation polynomial, no factor base, no
    decomposition. What the walk does with x is compare it, hash it, and test a predicate on it, all
    of which the generic group model permits on its random labels. The underlying action is the negation
    automorphism applied to points of a prime-order G, which is Oracle D of KN-FIND-b7e091, generic-group
    simulable and closed at exponent 1/2 (KN-TECH-005, H-ENDO-001). Recording this explicitly matters
    because "x-coordinate walks" is precisely the kind of construction that could be mislabelled admissible
    by a reader scanning for R1.'
  reachability_gate: 'DOES NOT MOVE BETWEEN CURVES; the negation automorphism exists on every curve
    with p > 3, so there is nothing to reach. Recorded because the campaign requires it and because
    the triviality is informative: this record''s obstruction applies to EVERY prime-field curve without
    exception, which is unusual in a campaign whose other findings are gated on D_0. The one place
    reachability re-enters is (G)(ii): a Montgomery or Kummer MODEL of the same curve is reachable
    at zero cost by a change of coordinates (it is the same curve, not a different one), so the model-level
    question is genuinely open and cheap to pursue in lane L11 -- unlike the D_0-gated questions elsewhere
    in L6.'
  inputs:
    procedure: 'STAGE 0 (zero compute, the bulk of the deliverable): the quadratic, the three-source
      enumeration, the two price derivations, the forward guidance. This alone meets the closure standard
      and costs nothing. STAGE 1 (minutes): enumerate the tagged state space and the merge-failure
      fraction on one 14-bit curve at d in {2, 4, 6, 8}, with the (R1) arm and the constant-tag control
      on the identical instrument. STAGE 2 (minutes): reproduce h041''s (R1) census signature qualitatively.
      THE CHEAPEST DECISIVE CELL IS STAGE 1 AT d = 2 AND d = 8: if the detected fraction does not
      fall by about a factor 64 between them, the merging loss is not being measured and the derivation
      stands unillustrated -- which is acceptable, since the derivation does not depend on the measurement,
      but it must then be reported as underdetermined rather than as confirmed.'
    mechanism: "STAGE 0 (zero compute, and it is most of the deliverable). Write out: the quadratic\
      \ whose roots are {x(A+T), x(A-T)} in the short-Weierstrass model, exhibiting the non-determinism\
      \ explicitly rather than asserting it; the three-source enumeration with (R3) = (R1); the (R2a)\
      \ state-count (N/2)*r and its sqrt(r) penalty; and the (R2b) merging-loss derivation T ~ 2^d\
      \ * sqrt(N/2).\nSTAGE 1 (minutes, and it is the only compute worth spending). Use the enumeration\
      \ instrument of IDEA-20260807-cbbcfd to MEASURE the merging loss directly rather than only deriving\
      \ it. On a 14-16 bit curve:\n  (a) build the tagged walk's functional graph on the state space\
      \ of pairs\n    (x, tag) and confirm its size is about (N/2)*r;\n  (b) build the induced relation\
      \ on the x-component and count, over all\n    starting states, how many x-collisions occur between\
      \ trajectories with\n    DIFFERENT tags -- these are the crossings the DP method would miss;\n\
      \  (c) report the MERGE-FAILURE FRACTION: the share of x-collisions that are\n    not followed\
      \ by a common distinguished point within the trail budget,\n    as a function of d.\nPRE-REGISTERED:\
      \ the merge-failure fraction is close to 1 - 2^-d, i.e. almost every crossing is missed, and\
      \ the detected fraction falls as 2^-d.\nSTAGE 2 (minutes). The (R1) comparison arm through the\
      \ identical instrument, where merging is exact by construction: merge-failure fraction must\
      \ be EXACTLY ZERO. That is the known-answer control which shows the instrument can tell the\
      \ two apart.\nSTAGE 3 (zero compute). Record the closure at the docs/inventor-protocol.md section\
      \ 4 standard: named obstruction (the projection does not propagate; the repairs cost fruitless\
      \ cycles or merging), argument (C)+(D), forward guidance (G)."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - (R1) canonicalised arm, merge-failure fraction exactly 0 (blocking)
  - constant-tag degenerate arm, must match (R1) (blocking)
  - h041 census reproduction on the (R1) arm (blocking)
  - random-function null band for the census statistics
  - Montgomery-model nearby-object note (zero compute, scope control)
  - 'NULL OBJECT (from the proposal): MANDATORY. THE MATCHED NULL IS THE (R1) CANONICALISED WALK run
    through the identical enumeration instrument on the identical curve and step table, for which
    merging is exact and the merge-failure fraction is EXACTLY ZERO by construction. THE DECAY PARAMETER
    IS d, THE DISTINGUISHED-POINT GRANULARITY: in the tagged (R2b) arm the DETECTED fraction of x-collisions
    must fall as 2^-d, halving with every added bit of d, while in the (R1) null it must stay at 1
    for every d. A tagged arm whose detected fraction does NOT fall with d is not exhibiting the merging
    loss and the measurement is wrong. SECOND NULL: a tagged walk whose tag is a CONSTANT (so the
    tag carries no information and the walk degenerates to (R1)); it must reproduce the (R1) arm''s
    merge-failure fraction of zero, which separates "the tag breaks merging" from "the tagged code
    path is buggy".'
  independent_variables: []
  metrics:
    primary:
    - reachable tagged state-space size, enumerated
    - merge-failure fraction per arm per d
    - detected-collision count per arm per d
    - x-collision count per arm (which must be EQUAL across arms -- the observation collision, reported
      explicitly)
    secondary:
    - functional-graph census per arm with random-function bands
    - useful-collision fraction per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: reachable tagged state-space size
    formula: About (N/2)*r, within a factor 1.5, measured by enumeration. A materially smaller value
      refutes the (R2a) penalty and would be the interesting outcome, since it would mean the tag
      is far more redundant than the counting suggests.
    source: pre-registered in IDEA-20260807-4cebed before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - COLLISION-DETECTION METHOD. The merging argument applies to distinguished-point detection. A seen-set
    (as h041 used) or Floyd/Brent detects collisions differently and does not exhibit the 2^d loss
    -- but neither is the parallel baseline, and comparing a tagged walk under a seen-set against
    a canonicalised walk under DPs would be comparing detection methods, not walks.
  - CURVE MODEL. Short-Weierstrass versus Montgomery changes the arithmetic of both repairs by factors
    of two to three without changing the state-size or merging prices. Every number names its model.
  - TAG DEFINITION. Carrying x(R - T_{s_prev}) is one choice; carrying the previous x is another,
    with a different reachable-state count. The record measures the stated tag and notes that other
    tags change the (R2a) constant but not the (R2b) merging loss, which depends only on the tag being
    non-constant.
  - SMALL-N ENUMERATION LIMITS. The tagged space is r times larger than the class set, so enumeration
    stops r times sooner. At r = 20 and 14 bits this is already about 1.6*10^5 states, which is fine;
    at 18 bits it is about 2.6*10^6 and is the practical limit.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: About (N/2)*r, within a factor 1.5, measured by enumeration. A materially smaller
    value refutes the (R2a) penalty and would be the interesting outcome, since it would mean the
    tag is far more redundant than the counting suggests.
  falsification_criterion:
  - The (R1) arm shows a nonzero merge-failure fraction. Instrument defect; merging is exact for a
    deterministic class map by construction.
  - The constant-tag control does not match the (R1) arm. Code defect in the tagged path; nothing
    about tagging is learned.
  - The tagged detected fraction does not fall as 2^-d. The merging loss is not being exhibited; the
    derivation is unillustrated and must be reported as such, not as confirmed.
  - The reachable tagged state space is much smaller than (N/2)*r. The (R2a) penalty is overstated
    and the record must be superseded with the corrected count.
  - A fourth source of the missing bit is exhibited that is not advice from outside the walk. The
    enumeration in (C) is incomplete and the closure is void -- this is the single most valuable possible
    refutation and the quantifier_order block states that the enumeration is over the walk's own state
    and history only.
  - Crashes or memory exhaustion enumerating the tagged space. INFRASTRUCTURE outcome under AGENTS.md
    rule 5; report the largest size reached.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
