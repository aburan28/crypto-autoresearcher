  simultaneous_confidence_box:
    frozen_inputs: 160
    root_vectors_per_input: 256
    model_bits_per_root: 4
    root_observation: Z_ir=(1/4)*sum_model(S_irm)
    mean: m_i=(1/256)*sum_root(Z_ir)
    exact_count_form: m_i=total_success_bits_i/1024
    two_sided_tail_count: 320
    familywise_error: 1/200
    per_tail_error: 1/64000
    precision_bits: 512
    radius_exact: sqrt(log(64000)/512)
    lower: L_i=max(0,m_i-radius)_rounded_toward_negative_infinity
    upper: U_i=min(1,m_i+radius)_rounded_toward_positive_infinity
    harmonic_lower: H_b_minus=(1/32)*sum_i_at_b(1/U_i)_rounded_down
    harmonic_upper: H_b_plus=(1/32)*sum_i_at_b(1/L_i)_rounded_up
    infinity_rule: any_L_i_equal_zero_makes_H_b_plus_positive_infinity
    ladder:
      bits: [18, 21, 24, 27, 30]
      x_b: (b-24)*log(2)
      z_b: 2^(-b/3)-2^(-8)
      S_xx: 90*log(2)^2
    extrema: >-
      For each eta separately, y_lower=log(H_minus)-eta*z and
      y_upper=log(H_plus)-eta*z. With a_b=x_b/S_xx, delta_min chooses
      y_lower when a_b is nonnegative and y_upper otherwise; delta_max makes
      the opposite choices. Every operation uses directed 512-bit rounding.
      gamma_lower=1/3-delta_max and gamma_upper=1/3-delta_min. Exact 5/18 is
      used for decisions.
    known_answer_binding: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ece945/tasks/TASK-20260809-b6256e/constructor-and-byte-kats.yaml

  canonical_bytes_and_seed_custody:
    binding: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ece945/tasks/TASK-20260809-b6256e/constructor-and-byte-kats.yaml
    tuple_magic_ascii: SYC4
    tuple_frame: magic_4_bytes_then_u16be_domain_length_then_ASCII_domain_then_u16be_field_count_then_repeated_tag_u8_u16be_payload_length_payload
    field_order: positional_and_frozen_per_domain_no_key_names_absorbed
    xof: SHAKE256
    xof_rule: each_complete_envelope_starts_one_fresh_stream_and_squeezes_from_offset_zero
    production_seed_rule: seed32_is_always_the_first_typed_field
    production_custody: >-
      Target and decoy seeds use distinct commitments, envelopes, nonces,
      key identifiers, and two-custodian retention receipts. Replay keys remain
      outside the repository and are retained until the snapshot, independent
      replay, ledger archive, and retention-close receipts all exist. Destroying
      the sole replay key before those receipts is an invalidation.

