  pollard_rho_protocol:
    input_binding: exact_same_p_a_b_r_P_Q_curve_certificate_and_public_manifest_bytes_as_candidate
    state: [compressed_X, alpha_mod_r, beta_mod_r]
    invariant: X=[alpha]P+[beta]Q
    partition_count: 16
    partition: low_four_bits_of_SHA256_canonical_compressed_X
    step_table: >-
      For j=0..15 derive alpha_j and beta_j by rejection-uniform scalar draws
      under EXP-SYC-268d6f/RHO-STEP/v1 with fields public_seed, bits, curve_id,
      target_id, j, component, attempt; set D_j=[alpha_j]P+[beta_j]Q. A draw
      exhaustion invalidates the baseline without reroll.
    update: 'X_next=X+D_j; alpha_next=(alpha+alpha_j) mod r; beta_next=(beta+beta_j) mod r'
    initial_state: >-
      Under EXP-SYC-268d6f/RHO-START/v1 derive nonzero alpha and beta from
      public_seed, bits, curve_id, target_id, walk_id, restart_id, component,
      attempt and compute the invariant state before the first step.
    distinguished_rule:
      digest: SHA256_canonical_compressed_X
      leading_zero_bits_by_size: {18: 9, 21: 11, 24: 12, 27: 14, 30: 15}
    collision_rule: >-
      Match identical canonical X. If beta_left differs from beta_right, compute
      k_hat=(alpha_left-alpha_right)*(beta_right-beta_left)^(-1) mod r and
      accept only after canonical public verification [k_hat]P=Q. Equal beta
      is a degenerate collision and forces a charged restart.
    shards: [rho-shard-0, rho-shard-1, rho-shard-2, rho-shard-3, rho-shard-4]
    walk_assignment: walk_id_mod_5
    restart_rule: fresh_start_domain_no_state_or_table_reuse_after_degenerate_collision_or_cycle
    stopping_rule: >-
      Scalar rejection attempts are exactly 0 through 7. Per public input,
      stop at the first verified collision, after 64 charged
      restarts, or after ceil(8*sqrt(r)) aggregate group-addition steps across
      all shards, whichever occurs first. Every failed walk, table record,
      collision, restart, and final public verification remains charged.
    failure_accounting: no_verified_collision_is_a_charged_baseline_failure_and_never_an_ECDLP_observation
    public_verification: canonical_decode_then_binary_double_and_add_then_byte_equality_to_Q
    per_size_directed_outputs:
      inputs: 32
      aggregation: aggregate_CPU_energy_bytes_archive_communication_and_wiring_are_sums_wall_is_maximum_over_shards_peak_live_is_maximum_over_shards
      fields: [bits, input_count, steps, restarts, distinguished_points, collisions, degenerate_collisions, verified_successes, aggregate_cpu_ns_lower, aggregate_cpu_ns_upper, wall_latency_ns_lower, wall_latency_ns_upper, energy_nJ_lower, energy_nJ_upper, physical_read_bytes_lower, physical_read_bytes_upper, physical_write_bytes_lower, physical_write_bytes_upper, peak_live_bytes_lower, peak_live_bytes_upper, archive_bytes_lower, archive_bytes_upper, communication_bytes_lower, communication_bytes_upper, wiring_line_touches_lower, wiring_line_touches_upper]

