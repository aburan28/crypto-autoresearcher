  zero_run_falsifiers:
    ordering: [F-A-CONSTRUCTOR-REACHABILITY, F-B-HARDWARE-TIME-SHARD-COLLISION, F-C-LITERAL-BYTES]
    F-A-CONSTRUCTOR-REACHABILITY:
      disposition: SURVIVES
      binding: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ece945/tasks/TASK-20260809-b6256e/constructor-and-byte-kats.yaml
      result: >-
        All frozen interval vectors are emitted from exact 256-root, four-model
        Boolean counts. Interior m=1/2 covers eta -4, 0, and 4; m=0 exercises
        lower clipping and L_i=0 infinity; m=1 exercises upper clipping.
    F-B-HARDWARE-TIME-SHARD-COLLISION:
      disposition: REJECTS_CPU_DIVIDED_BY_SHARDS
      binding: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ece945/tasks/TASK-20260809-b6256e/physical-cost-compiler.yaml
      result: >-
        Candidate aggregate CPU occupancy 720 is worse than rho 500 even
        though candidate wall latency 90 is better than rho 100. CPU is never
        divided by shards and the axes are never collapsed into one scalar.
    F-C-LITERAL-BYTES:
      disposition: SURVIVES_STATIC_BYTE_INTERFACE
      binding: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ece945/tasks/TASK-20260809-b6256e/constructor-and-byte-kats.yaml
      result: >-
