  code:
    commit: 4bc9275f546b8980dfa8348f3ea9692d8b205f81
    dirty_tree: true
    dirty_note: >-
      falsify/run_kstar.py was untracked at execution time and is committed with
      this manifest. No tracked file was modified.
    command: python3 experiments/EXP-FALSIFY-d770c1/falsify/run_kstar.py
    entrypoint: experiments/EXP-FALSIFY-d770c1/falsify/run_kstar.py

  environment:
    python: cpython3
    cas_available: false
    cas_note: >-
      fractions.Fraction from the standard library. Exact rational arithmetic,
      so the recomputation carries no rounding of its own.
    third_party_packages: []

  inference:
    requested_policy: null
    requested_policy_note: >-
      Closed-form exact arithmetic over 18 cells; no model was consulted.
    resolved_model_id: null
    fallback_used: false
    degraded_requirements: []

  inputs:
    target_finding: KN-FIND-ac28ed
    formula_source: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-121/tasks/TASK-20260805-005/
      closure_and_multi_target.md sections B.2 and B.3
    formulas:
      K_std: ceil(s / (1 - t))
      K_bkk: ceil(s*beta / (1 - t*beta))
      beta: 2/(m+1)
    cells: 18
    m_values: [3, 4, 5]
    s_values: [50, 100, 200]
    t_values: ['0.3', '0.5', '0.7', '0.9']

  timing:
    wall_clock_seconds_budget: 300
    completed_within_budget: true

  controls:
    cause_control:
      description: >-
        Recompute every cell a second time in IEEE double arithmetic. If the
        finding's stated cause is right, float must reproduce the as-committed
        value at each disagreement.
      result: reproduced at every disagreement
      passed: true
    representability_control:
      description: >-
        t=0.5 is exactly representable in binary and t=0.9 is not. If the cause
        is a float artifact, the t=0.5 cells must be clean.
      result: >-
        all three t=0.5 cells (134, 100, 80) committed correctly; every
        disagreement is at t=0.9.
      passed: true
    completeness_control:
      description: >-
        The interesting failure mode for a CORRECTION record is an incomplete
        audit. All 18 cells were recomputed, not only the ones the finding names.
      passed: true

  result:
    certificate: {kind: none}
    cells_disagreeing_with_committed: 3
    distinct_corrections_found: ['K*(standard) 2001 -> 2000', 'm=4 cell 126 -> 125']
    corrections_claimed_by_finding: ['K*(standard) 2001 -> 2000', 'm=4 cell 126 -> 125']
    audit_complete_and_exact: true
    note_on_the_count: >-
      Three cells disagree because K*(std) is independent of m and so appears
      once per table; they are one distinct correction, which is how the finding
      counts it. No third correction exists.
    kbkk_96_confirmed: true
    verdict: >-
      KN-FIND-ac28ed VERIFIES COMPLETELY. Its two corrections are exactly the
      two that exist, its K*(BKK)=96 confirmation is right, and its stated cause
      is confirmed by direct reproduction rather than accepted on trust.
    defect_found:
      class: traceability
      severity: minor
      text: >-
        KN-FIND-ac28ed attributes the K* formulas and the rescue region to
        KN-FIND-c7d31e. That record contains ZERO occurrences of "K*". The
        formulas are in BATCH-121 TASK-20260805-005 sections B.2/B.3. Following
        the citation as written does not reach the formula, so reproducing a
        confidence: proved record required searching the repository.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. This run confirms a corpus correction record and
      reports one traceability defect in its citations.

  authority_note: >-
    Observations only. No hypothesis status changed, no finding edited or
