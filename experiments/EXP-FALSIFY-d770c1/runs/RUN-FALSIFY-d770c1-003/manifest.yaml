  hypothesis_id: H-FALSIFY-40538b
  status: completed
  claim_tier: toy
  validity_status: completed_valid_scoped

  code:
    commit: 70673c742119657b9902c8c79097527106c56a68
    dirty_tree: true
    dirty_note: >-
      falsify/run_bkk_scaling.py was untracked at execution time and is
      committed together with this manifest. No tracked file was modified.
    command: python3 experiments/EXP-FALSIFY-d770c1/falsify/run_bkk_scaling.py
    entrypoint: experiments/EXP-FALSIFY-d770c1/falsify/run_bkk_scaling.py

  environment:
    python: cpython3
    cas_available: false
    cas_note: >-
      No CAS installed; exhaustive multiset enumeration in standard-library
      integer arithmetic.
    third_party_packages: []

  inference:
    requested_policy: null
    requested_policy_note: >-
      Deterministic exhaustive enumeration; no model was consulted.
    resolved_model_id: null
    fallback_used: false
    degraded_requirements: []

  inputs:
    curve: {p: 1009, a: 1, b: 1}
    f4a_reported_pairs: [[2, 54], [3, 18], [4, 12], [5, 10]]
    f4b_fixed_B: [12, 18, 24]
    f4b_m_values: [2, 3, 4, 5]
    enumeration: exhaustive over index multisets i_1 <= ... <= i_m

  timing:
    wall_clock_seconds_budget: 3000
    completed_within_budget: true

  controls:
    positive_control:
      description: >-
        Per-decomposition retention must equal the proved (m+1)/2^m. It does, to
        4 decimal places at m=2 and m=3 at every B tested, which shows the
        instrument reads the quantity the theorem is about.
      passed: true
    confound_control:
      description: >-
        The decisive control for this probe: hold B fixed and re-measure the
        decay that KN-FIND-2a8b7e fitted while B was varying 54 -> 10.
      passed: true
    finite_B_artifact_check:
      description: >-
        The m=5 per-decomposition excess over theory shrinks as B grows --
        0.2309 (B=12), 0.2182 (B=18), 0.2113 (B=24), heading to 0.1875 -- the
        signature of a finite-factor-base multiset artifact, not a mechanism.
      passed: true

  result:
    certificate: {kind: none}
    f4a_reported_parameters:
      note: >-
        At the reported (m,B) pairs the per-decomposition retention tracks the
        theorem (0.7497 vs 0.7500 at m=2; 0.5000 vs 0.5000 at m=3) while the
        reported gamma column tracks per-target success (0.86 reported vs 0.8681
        measured at m=2; 0.66 vs 0.6933 at m=3).
    f4b_fixed_B_decay_ratios:
      claimed_per_step_ratio: 0.68
      B12: [0.754, 0.829, 1.096]
      B18: [0.893, 1.280, 1.127]
      B24: [1.004, 1.290, 1.002]
      note: >-
        At FIXED B the claimed geometric decay does not occur. Ratios rise
        toward and past 1.0 as m grows, because mean decomposition multiplicity
        rises (1.06 -> 4.42 at B=12; 1.10 -> 95.04 at B=24) and per-target
        success saturates at 1.0000. The decay KN-FIND-2a8b7e fitted is produced
        by B falling 54 -> 18 -> 12 -> 10 across its four rows, not by m.
    f4c_model_divergence:
      geometric_2a8b7e_vs_theorem_c7d31e:
        m4: {geometric: 3.18, theorem: 2.50, ratio: 1.27}
        m5: {geometric: 4.33, theorem: 3.00, ratio: 1.44}
        m6: {geometric: 5.88, theorem: 3.50, ratio: 1.68}
        m7: {geometric: 8.00, theorem: 4.00, ratio: 2.00}
        m8: {geometric: 10.88, theorem: 4.50, ratio: 2.42}
      note: >-
        KN-FIND-2a8b7e's law is geometric in m and KN-FIND-c7d31e's proved law is
        linear in m. They diverge without bound, yet KN-FIND-c7d31e states it
        "provides the combinatorial foundation for the empirical improvements in
        KN-FIND-2a8b7e". At most one can hold.
    verdict: >-
      KN-FIND-2a8b7e's growing-with-m speedup and its m=6/7/8 extrapolations are
      not supported. The fitted decay is confounded with B, and the resulting
      geometric law contradicts the proved linear law in the finding the corpus
      names as its foundation.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. Withdraws support from a claimed geometrically
      growing constant-factor speedup and from its crypto-scale extrapolations.

  authority_note: >-
    Observations only. No hypothesis status changed, no finding edited or
    superseded (AGENTS.md rule 1).
