run:
  id: RUN-FALSIFY-d770c1-002
  experiment_id: EXP-FALSIFY-d770c1
  hypothesis_id: H-FALSIFY-40538b
  status: completed
  claim_tier: toy
  validity_status: completed_valid_scoped

  code:
    commit: 59b287893ca048ade54ec05e38bd3ba226d96296
    dirty_tree: true
    dirty_note: >-
      The falsification suite was untracked at execution time and is committed
      together with this manifest. No tracked file was modified by the run.
    command: python3 experiments/EXP-FALSIFY-d770c1/falsify/run_pseudo.py --trials 5
    entrypoint: experiments/EXP-FALSIFY-d770c1/falsify/run_pseudo.py

  environment:
    python: cpython3
    cas_available: false
    cas_note: >-
      No sympy, numpy, scipy, sage, pari, cypari2, flint or galois installed.
      The DFT is computed directly with cmath over exact integer discrete logs.
    third_party_packages: []

  inference:
    requested_policy: null
    requested_policy_note: >-
      Deterministic arithmetic with a fixed seed; no model was consulted.
    resolved_model_id: null
    fallback_used: false
    degraded_requirements: []

  inputs:
    seed: 20260808
    primes: [1009, 2003, 4001, 9001]
    b_frac: 0.05
    trials_per_prime: 5
    factor_base: B points of smallest x-coordinate
    measurement: >-
      C = max over k != 0 of |sum over P in F of exp(2 pi i k DL_G(P) / N)|
      divided by sqrt(B), computed by full-range DFT over every k.

  timing:
    wall_clock_seconds_budget: 3000
    completed_within_budget: true

  controls:
    null_object:
      description: >-
        A uniformly random subset of the same size in the same group, carrying
        no arithmetic structure, measured on the same axis with the same code.
      purpose: >-
        Establishes what the measurement reports when the property under study
        is absent, so that an exponent fitted to the factor base can be compared
        against an exponent fitted to nothing.
      fitted_exponent: 0.0694
    replicate_design:
      description: >-
        Five independently drawn cyclic curves per prime, so within-prime
        scatter can be compared against the across-prime effect being fitted.
    all_controls_passed: true

  result:
    certificate: {kind: none}
    C_factorbase_mean: {p1009: 3.225, p2003: 3.246, p4001: 3.673, p9001: 3.912}
    C_factorbase_sd: {p1009: 0.567, p2003: 0.258, p4001: 0.096, p9001: 0.591}
    C_random_null_mean: {p1009: 2.531, p2003: 2.594, p4001: 2.754, p9001: 2.933}
    across_p_variation_ratio: 1.213
    worst_within_p_spread_ratio: 1.494
    worst_within_p_spread_prime: 1009
    mean_within_p_sd_as_pct_of_mean: 10.8
    fitted_exponent_factorbase_5_curves: 0.0969
    fitted_exponent_factorbase_1_curve: 0.0324
    fitted_exponent_random_null: 0.0694
    structural_offset_factorbase_over_null: 1.300
    corpus_claims_under_test:
      KN-FIND-d4f820: p^0.055
      KN-FIND-e7a3b1: p^0.079
      KN-FIND-4c9e71: O(1) ~ 4
    verdict: >-
      The recorded exponents are not identifiable from a 4-point design spanning
      8.92x in p. Within-prime spread (1.494x at p=1009) exceeds the entire
      across-prime variation (1.213x); the fit moves from p^0.032 to p^0.097 on
      resampling; and a structureless null fits p^0.069, inside the claimed
      range. KN-FIND-4c9e71's O(1) characterisation is the one consistent with
      the data. Separately, the factor base sits a stable 1.300x above the
      random null at every prime, which is a real signal no finding records.
    explicit_non_result: >-
      This does NOT establish that C(p) is bounded as p grows, and so says
      nothing about whether H-PSEUDO holds. The design cannot resolve O(1) from
      p^0.08 in EITHER direction; that cuts against reading the result as
      support for a constant exactly as it cuts against the recorded power laws.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. The effect on the corpus is to withdraw a quoted
      exponent, resolve a live three-way internal contradiction, and surface an
      unrecorded structural offset.

  authority_note: >-
    Observations only. No hypothesis status changed, no finding edited or
    superseded (AGENTS.md rule 1).
