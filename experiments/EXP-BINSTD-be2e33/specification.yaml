# EXP-BINSTD-be2e33
# Catalog-floor arithmetic. No encoding.
# Approved by DEC-20261003-b63af4.
experiment:
  id: EXP-BINSTD-be2e33
  hypothesis_id: H-BINSTD-cd4aaa
  source_idea: IDEA-20261001-878222
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Catalog floor versus distinct-rank floor
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-b63af4
  objective: >-
    Check the floor gap 9, the slot identity 72, and the product 1800.
  inputs:
    n_17: 17
    n_19: 19
    n_23: 23
    ell_lo: 3
    ell_hi: 4
    cells: 6
    catalog_floor: 12
    rank_floor: 3
    floor_gap: 9
    slots: 72
    rank_slots: 18
    slot_excess: 54
    band_equal_gap: 0
    two_thirds_gap: 10
    three_quarters_gap: 20
    gap_product: 1800
    n_sum: 59
    n_product: 7429
    n_gap_lo: 2
    n_gap_hi: 4
    slot_identity: 72
    ell_product: 12
    ell_catalog_gap: 0
    n_span: 6
    span_cell_gap: 0
  controls:
    - >-
      Twelve minus 3 is 9. Six times 12 is 72, and 6 times 3 is 18.
      Seventy-two minus 18 is 54. Six times 9 is 54. Reporting the
      catalog floor as 3 invalidates the run.
    - >-
      Seventy times 10 minus 7 times 100 is 0. Seventy times 3 minus
      2 times 100 is 10. Three times 100 minus 70 times 4 is 20. The
      product of 9, 10, and 20 is 1800.
    - >-
      Nineteen minus 17 is 2, and 23 minus 19 is 4. Two times 4 times
      9 is 72. Three times 4 is 12, and 12 minus 12 is 0.
      Twenty-three minus 17 is 6, and 6 minus 6 is 0. Seventeen plus
      19 plus 23 is 59. Seventeen times 19 times 23 is 7429.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {floors, band, product}
    - route in {difference, product}
  metrics:
    primary:
      - floor_gap
      - gap_product
      - implementations_agree
    secondary:
      - slot_identity
      - two_thirds_gap
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Twelve exceeds 3 by 9. Two times 4 times 9 is 72. The product
      of 9, 10, and 20 is 1800.
    formula: >-
      Subtract 3 from 12. Multiply 2, 4, and 9. Multiply 9, 10, and
      20. Subtract 7 times 100 from 70 times 10.
    source: >-
      IDEA-20261001-878222 states the n list 17, 19, 23, the
      dimension list 3 and 4, the catalog floor 12, the distinct-rank
      floor 3, and the band 0.70, read 2026-10-03. The products were
      recomputed in this design session. That computation is not a
      run. No encoding was run.
  scale_relevance:
    tier: toy
    justification: Three listed n values and two written floors. No transfer to a correlation.
    correspondence: null
  tail_checks:
    - The product 1800 and the cross gap 10 are required. A check that stops at the floor gap 9 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the floor gap 9 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The floor gap is not 9.
    - The slot identity is not 72.
    - The product is not 1800.
    - An encoding is run, or the catalog floor is reported as 3.
  success_criterion: >-
    Both runs agree that 12 minus 3 is 9, that 6 times 9 is 54, that
    2 times 4 times 9 is 72, that 70 times 10 minus 7 times 100 is 0,
    that 70 times 3 minus 2 times 100 is 10, and that the product of
    9, 10, and 20 is 1800.
  falsification_criterion: >-
    The runs agree that 12 minus 3 is computed, and that difference
    is not 9.
  required_artifacts:
    - experiments/EXP-BINSTD-be2e33/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-be2e33/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-be2e33/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-be2e33/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-be2e33/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-be2e33/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any encoding, elimination, or Spearman coefficient.
    - Any claim that a rank predicts a clause count.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
