experiment:
  id: EXP-ECDLP-6386da
  hypothesis_id: H-ECDLP-a0d5d6
  question_id: RQ-ECDLP-001
  goal_id: null
  version: 1
  status: draft
  claim_tier: not_applicable
  title: >-
    Zero-rank-computation density pre-test followed by a calibrated black-box
    GF(2) rank kernel, with the pre-registered decision rule restated in BYTES
    against the contract because the dimensionless density band's kill arm
    cannot fire on the stated sparsity mechanism, and with the anchoring
    figures treated as a blocking verification obligation

  objective: >-
    STAGE 0 IS THE EXPERIMENT. Measure, by streaming the existing generator with
    no matrix allocated, the nonzero count per row of the target Macaulay
    system, and apply a decision rule stated in bytes against the declared
    memory contract. If the route survives, calibrate a black-box rank kernel
    against two independent kinds of ground truth and fit a memory formula that
    predicts the next cell's feasibility before any budget is spent. THIS IS
    TOOLING. IT PRODUCES NO MATHEMATICAL RESULT AND AUTHORISES NO LADDER RUN.

  independent_variables:
    - name: stage
      values: [S0_density_count, S0b_carrier_layout_read,
        S0c_figure_verification, S1_kernel_calibration, S2_memory_formula,
        S3_failure_rate]
    - name: calibration_cell
      values: [tiny_hand_computed, closed_form_ladder, committed_n12_cell,
        deletion_mutation, dense_nearby_object, sparse_nilpotent_object]

  inputs:
    committed_reference_ranks: {rank_null_restricted: 156520, rank_sem: 138573}
    reported_failed_cell_columns: 768212
    reported_failed_cell_peak_rss_gib: [11.73, 12.22]
    reported_failed_cell_status: >-
      6 of 6 runs resource_exhaustion against an 8 GiB contract with the rank
      kernel never invoked. REPORTED, NOT VERIFIED BY THIS PROGRAM.
    dense_carrier_bytes_at_the_failed_cell: about 6.7 times 10^10
    dense_time_bit_operations_at_the_failed_cell: about 4.6 times 10^17
    blackbox_time_bit_operations_at_the_failed_cell: about 2.3 times 10^13
    index_width_bytes: 4
    contract_bytes: 8 GiB
    preconditioner_draws_per_cell: 30

  metrics:
    primary:
      - name: nonzeros_per_row
        unit: nonzeros per row (dimensionless count), with mean, median,
          maximum and the full histogram
        definition: >-
          Counted by streaming the generator one row at a time with no matrix
          allocated. The exhaustive count, not a sample.
      - name: blackbox_storage_bytes
        unit: bytes
        definition: >-
          4 times rows times nonzeros-per-row, plus the Krylov vector storage in
          bytes. COMPARED AGAINST THE CONTRACT IN THE SAME UNIT, which is the
          whole point of restating the decision rule.
      - name: exact_rank_per_calibration_cell
        unit: rank (dimensionless non-negative integer)
        definition: >-
          The rank returned by the black-box kernel, labelled probabilistic with
          its trial count, against its committed or closed-form reference.
      - name: measured_failure_rate
        unit: fraction of trials (dimensionless)
        definition: >-
          Over at least 30 independent preconditioner draws per cell, with an
          exact binomial interval. A black-box rank failure is a strict
          UNDERESTIMATE, so the maximum over trials is the estimator and its
          bias is one-sided and reportable.
    secondary:
      - name: peak_rss_and_virtual_and_temp_disk
        unit: bytes
        definition: >-
          All three reported per cell, because resident memory is not the only
          memory and page cache or temporary files can dominate.
      - name: fitted_memory_formula_residuals
        unit: fraction (dimensionless)
        definition: >-
          Residuals of the fitted peak-memory formula across the calibration
          set, with underprediction flagged separately from overprediction.
      - name: deletion_mutation_rank_delta
        unit: rank (dimensionless integer)
        definition: Required to be exactly 1.

  controls:
    - name: C-BYTE-DENOMINATED-DECISION
      kind: computed replacement for a band whose kill arm cannot fire
      blocking: true
      description: >-
        THE SOURCE PROPOSAL'S DECISION RULE IS DEGENERATE IN THE KILL DIRECTION
        AND IS REPLACED, NOT LOOSENED. It pre-registers viability at a
        dimensionless density of at most 0.001 and death at at least 0.05,
        which at 768212 columns are 768 and 38410 nonzeros per row, against its
        own predicted density of about 30. A Macaulay row is one generator times
        one monomial, Boolean-reduced, so its support is bounded by the
        generator's term count, which is in the tens; a density of 38410 is
        therefore unreachable under the stated mechanism and the kill arm cannot
        fire. THE REPLACEMENT COMPARES BYTES TO BYTES: black-box storage is
        4 times rows times nonzeros-per-row plus Krylov vectors, and the route
        is admissible iff that fits the declared contract. At a million rows and
        an 8 GiB contract the ceiling is about 2150 nonzeros per row, and the
        row count R is MEASURED in Stage 0 rather than assumed. Both branches
        are reachable and the rule is fixed before the count is taken.
    - name: C-CLOSED-FORM-LADDER
      kind: derived ground truth, blocking
      blocking: true
      description: >-
        A calibration ladder whose rank is DERIVED rather than computed and
        whose predicted value VARIES cell by cell. Calibrating against a closed
        form rather than against another implementation of the same routine is
        the strongest available correctness check.
    - name: C-COMMITTED-INTEGER-REGRESSION
      kind: forced-value baseline, blocking
      blocking: true
      description: >-
        Exact reproduction of 156520 and 138573 at the committed cell. Off by
        any amount halts the line and nothing about the larger cell may be said.
        THESE TWO INTEGERS WERE VERIFIED IN THE COMMITTED EVIDENCE RECORD BY THE
        COORDINATING SESSION, which read that the restricted null rank is 156520
        and that the genuine deficit 17947 is stated as 156520 minus 138573.
    - name: C-DELETION-MUTATION
      kind: planted defect of known size with a forced magnitude
      blocking: true
      description: >-
        Delete one column from an early unit and re-run. THE RANK MUST FALL BY
        EXACTLY 1. This is the demonstrated-dynamic-range control: a defect of
        known size that must fire at the predicted magnitude, applied to the
        calibration cells of this contract and to nothing else.
    - name: C-DENSE-NEARBY-OBJECT
      kind: known-false nearby object, blocking
      blocking: true
      description: >-
        A DENSE matrix of the same dimensions with a planted known rank. The
        method must be visibly WORSE there, in both time and memory, while still
        returning the correct rank. A kernel that looks good on the dense
        control is not exploiting sparsity and its sparse numbers are
        meaningless. Second nearby object: a sparse matrix with a large
        nilpotent part, where naive Krylov rank is delicate.
    - name: C-DETERMINISM-AND-SEED-NULL
      kind: reproducibility control
      blocking: true
      description: >-
        A fixed preconditioner seed must give a bit-identical result across
        runs, and changing the seed must change the internal Krylov sequence
        while leaving the returned rank unchanged. If the returned rank moves
        with the seed on a known cell, the failure rate is being observed and
        must be reported as such.
    - name: C-MEMORY-CONTRACT-AS-A-FORMULA
      kind: predictive contract, frozen before predictions
      blocking: true
      description: >-
        Peak memory is expressed as an explicit function of rows, columns,
        nonzeros per row and block size, charged only over proved-disjoint
        allocation blocks, fitted across at least a 100-fold range of nonzeros,
        and FROZEN before any larger-cell prediction is made. It must never
        UNDERPREDICT.
    - name: C-FIGURE-VERIFICATION
      kind: provenance gate, blocking before any spend
      blocking: true
      description: >-
        The anchoring figures for the failed cell, namely its column count, its
        peak resident memory and its exhaustion outcome, are NOT verified by
        this program. The source proposal's own citation states its authoring
        session did not read them, and THE COORDINATING SESSION FOR THIS
        CONTRACT DID NOT READ THEM EITHER. The executor must fetch the branch
        holding them, open the artifacts, and re-cite every figure by run
        identifier. If any figure differs, the memory arithmetic is redone
        against the real numbers before anything else proceeds. Whatever they
        say, the failure remains an infrastructure stop under AGENTS.md rule 5.
    - name: C-CARRIER-LAYOUT-READ
      kind: diagnosis gate, blocking
      blocking: true
      description: >-
        Read the kernel source's carrier storage layout directly. If the carrier
        is not rank times columns bits, the memory diagnosis is wrong and must
        be redone before any kernel is built.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The nonzero count per row of the target Macaulay system, and the resulting
      black-box storage in bytes against the declared contract.
    formula: >-
      storage_bytes equals 4 times rows times nonzeros-per-row plus Krylov
      vector bytes; admissible iff storage_bytes is at most the contract. With
      the sparsity mechanism's predicted 30 nonzeros per row and a million rows
      this is about 1.2 times 10^8 bytes, about 70 times inside an 8 GiB
      contract, against a dense carrier of about 6.7 times 10^10 bytes.
    source: >-
      A Macaulay row is one generator times one monomial, Boolean-reduced, so
      its support is bounded by the generator's term count; that bound is exact
      and needs no assumption. The dense carrier size follows from the
      instrument's own audit assertion that the carrier pivot count equals the
      accumulated rank.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE DECISION RULE WAS FIXED.
    (1) THE SOURCE PROPOSAL'S KILL ARM CANNOT FIRE. Its three-way rule places
    death at a dimensionless density of at least 0.05, which at 768212 columns
    is 38410 nonzeros per row. Its own sparsity mechanism bounds a row's support
    by the generating polynomial's term count, which is in the tens. The kill
    branch is therefore unreachable under the very mechanism the record argues
    for, and its viability branch at 768 nonzeros per row is 25 times above the
    predicted value, so the entire predicted outcome sits far outside both
    named arms.
    (2) THE REPLACEMENT CHARGES BOTH SIDES IN THE SAME UNIT AND BOTH BRANCHES
    ARE REACHABLE. The decision the route actually turns on is whether the
    black-box representation fits the contract, which is a comparison of bytes
    to bytes: 4 times rows times nonzeros-per-row plus vectors, against the
    declared 8 GiB. At a million rows the admissible ceiling is about 2150
    nonzeros per row, which is between the predicted 30 and the physically
    possible dense limit, so a measurement can land on either side. The row
    count is MEASURED in the same stage rather than assumed.
    (3) A DEFECT OF KNOWN SIZE FIRES AT A FORCED MAGNITUDE. The one-column
    deletion must lower the rank by exactly 1, an integer with no tolerance, and
    the closed-form ladder's predicted rank varies cell by cell so agreement is
    not a coincidence of a single number.
    (4) THE ARITHMETIC OF THE DIAGNOSIS IS CHECKED, NOT ASSUMED. At about
    7.7 times 10^5 columns and a rank of the same order, a rank-times-columns
    carrier is about 6.7 times 10^10 bytes, dense elimination is about
    4.6 times 10^17 bit operations, and the black-box route at about
    3 times 10^7 nonzeros is about 2.3 times 10^13 bit operations. The
    coordinating session reproduced all three figures from the stated formulas.
    (5) THE ANCHORING FIGURES ARE UNVERIFIED AND THE CONTRACT SAYS SO RATHER
    THAN QUOTING THEM. Neither the source proposal's authoring session nor the
    coordinating session for this contract opened the artifacts holding the
    failed cell's column count and memory figures. They are carried as reported
    and a blocking stage discharges them before any spend.

  scale_relevance:
    tier: null
    justification: >-
      Not a scaled mathematical measurement. The calibration cells are chosen so
      the answer is known independently, and no cell's density is extrapolated
      to another. The memory formula's fitted range is stated with every
      prediction it is used for.
    correspondence: null

  tail_checks:
    - >-
      The MAXIMUM per-row nonzero count, not the mean, is compared against the
      memory formula, because peak memory is driven by the tail; the histogram's
      upper decile is reported separately because a heavy tail defeats a
      mean-based contract.
    - >-
      The worst single preconditioner trial per cell is reported individually
      and never averaged, since a black-box rank failure is one-sided.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 30

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 20
    maximum_workers: 1

  stopping_rules:
    - >-
      STAGE 0 RUNS FIRST AND IS BOUNDED BY ONE ROW OF THE GENERATOR. If the
      byte-denominated test fails, STOP: the deliverable is the measured
      density, filed as an obstruction with its value, units, run identifier and
      scope, and the route is closed with a mechanism rather than a shrug.
    - >-
      If the streaming count itself exhausts memory, stop; the generator cannot
      be streamed and that pipeline defect is the finding.
    - If C-CARRIER-LAYOUT-READ shows the carrier is not rank times columns bits,
      stop and redo the diagnosis.
    - If C-FIGURE-VERIFICATION finds a material discrepancy, redo the memory
      arithmetic before proceeding.
    - If the committed-integer regression fails, stop.
    - If the deletion mutation does not drop the rank by exactly 1, stop.
    - If the measured failure rate exceeds 10 percent on any cell, report the
      method unusable for that cell class rather than adding trials.

  invalidation_rules:
    - Any rank reported without its probabilistic label and trial count.
    - Any density decision taken in dimensionless units rather than against the
      contract in bytes.
    - Any memory formula that underpredicts a measured peak anywhere.
    - Any extrapolation of one cell's density to another.
    - Any larger-cell prediction made after the formula was refitted.
    - Any quotation of the unverified anchoring figures as checked.

  success_criterion: >-
    Stage 0 completes and reports the density histogram and the
    byte-denominated decision; the carrier layout and the anchoring figures are
    verified; the kernel reproduces the closed-form ladder and both committed
    integers exactly; the deletion mutation drops the rank by exactly 1; the
    dense nearby object is measurably worse; the memory formula fits within 25
    percent across a 100-fold range without underpredicting; and the failure
    rate is reported with an exact binomial interval over at least 30 draws.

  falsification_criterion: >-
    HEUR-001 is falsified if the measured per-row nonzero count exceeds the
    independently computed generator term count, or if the byte-denominated test
    fails, in which case the black-box route is retired for that cell class with
    the measured density filed as an obstruction. HEUR-002 is falsified if the
    measured failure rate exceeds 10 percent per trial. The KERNEL is void if it
    misses either committed integer, if the deletion mutation does not drop the
    rank by exactly 1, or if the dense control shows no disadvantage.

  required_artifacts:
    - nonzeros per row: mean, median, maximum, full histogram, and the
      byte-denominated decision with its inputs
    - peak resident memory of the streaming count itself
    - the carrier storage layout as read from the kernel source
    - the re-cited anchoring figures, by run identifier, with the branch named
    - exact rank per calibration cell with its committed or closed-form reference
    - the deletion-mutation rank delta
    - peak resident memory, peak virtual size and temporary disk per cell
    - the fitted memory formula with residuals and its fitted range
    - the larger-cell peak predictions, timestamped BEFORE those cells are
      attempted
    - the measured failure rate over at least 30 draws with its interval
    - the dense and nilpotent nearby-object results
    - the claim tier of every reported rank, labelled probabilistic
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      TOOLING ONLY. No mathematical result, no evidence about any degree of
      regularity, and no ECDLP claim. RANK OF A GF(2) MATRIX IS CURVE-FREE BY
      CONSTRUCTION, so the curve-free-null requirement is discharged as a proof
      rather than an arm: no output of this instrument can be misread as a
      statement about elliptic curves.
    - >-
      IT AUTHORISES NOTHING. Running any cell of the consuming goal's ladder
      requires that goal's own Coordinator approval, which this contract neither
      has nor requests.
    - >-
      A PROBABILISTIC RANK IS A WEAKER CLAIM TIER THAN AN EXACT ONE. The
      consuming lane's admissibility rule may not accept it at all. That is a
      contract-level risk to be settled by that lane's owner BEFORE any of its
      cells are run, and this contract does not presume the answer.
    - >-
      THE ANCHORING FIGURES ARE UNVERIFIED BY THIS PROGRAM. Neither the source
      proposal's authoring session nor the coordinating session for this
      contract opened them; a blocking stage exists to fix that before spending,
      and nothing here may be quoted as though they had been checked.
    - >-
      UNTESTABLE HERE, STATED PLAINLY. The failure rate at the largest cell
      cannot be measured, because no independent rank exists there. That is the
      residual risk of the whole approach and it is the strongest argument for
      keeping a dense cross-check at the largest cell that still fits.
    - >-
      A slow new kernel against a tuned incumbent measures programming effort,
      not asymptotics. The comparison reported is MEMORY, where the difference
      is structural; any time comparison carries an explicit
      implementation-bound caveat.
    - >-
      Density is cell-dependent and no cell's value is extrapolated to another.

  assigned_to: executor
  approved_by: null
