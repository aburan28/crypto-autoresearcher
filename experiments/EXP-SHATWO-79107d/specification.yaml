experiment:
  id: EXP-SHATWO-79107d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-840ba6; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-840ba6
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Budgeted low-weight profile of the linearized SHA-256 expansion code per step count, with
    exhaustive-enumeration calibration at declared reduced configurations and a matched random-code
    null band
  objective: 'The one uncertainty a run reduces is whether the linearized SHA-256 message expansion
    has weight structure distinguishable from a random code at an achievable search budget, and by
    how much a bounded search''s answer differs from truth. (i) It emits W_upper(s), the least codeword
    weight found by a declared randomized information-set search, for every step count s and at three
    budgets differing by factors of ten, each reported with its budget and accompanied by the achieving
    codeword re-verified by independent recomputation, so that no number leaves the run without the
    qualifier that makes it honest. (ii) It calibrates that bound against truth by running exhaustive
    enumeration over a declared reduced message subspace where it completes, producing W_exact flagged
    EXACT and a measured gap between bounded search and truth, which is the number that licenses or
    refuses any later use of upper bounds at full width. (iii) It applies the inventor-protocol section
    3 decay test in its natural form here: the bound must fall as budget rises, and a bound flat across
    three decades of budget is scored as the artifact signature of a search that is not searching,
    voiding the run rather than reassuring it. A run does NOT reduce uncertainty about whether weight
    relates to any reachable step count, which is untested here, nor about the true minimum at full
    width, which is not computed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: for the carry-fixed linearized SHA-256 expansion
      in the declared carry class, the code truncated to s steps admits a nonzero codeword of the
      emitted weight, found within the emitted budget - an existence statement, which is all an upper
      bound is - and at the declared calibration configurations the exact minimum over the declared
      message subspace is the emitted EXACT value. WHAT DOES NOT FOLLOW: that any non-EXACT number
      is a minimum, which this contract forbids as output; that a low weight is exploitable, corresponds
      to a characteristic, or survives the compression function, which is absent from the object;
      that weight predicts any reachable step count; that the calibration gap at toy widths bounds
      the gap at full width; and nothing about full 64-step SHA-256, HMAC-SHA-256, TLS certificate
      chains, code signing, or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - carry class, the three
      budgets, the calibration subspace definition, null draw counts, and the EXACT-versus-upper-bound
      labelling rule that every emitted field must carry. STAGE 1 (minutes, machine): inherit the
      validated carry-fixed expansion matrix and confirm its rank(A_16) = 512 gate passed by citing
      the rank pipeline''s run id; abort otherwise. STAGE 2 (hours, human): implement the randomized
      information-set search and the independent codeword re-verification path, written separately
      so that a reported weight is recomputed from the message difference rather than trusted. STAGE
      3 (minutes to an hour, machine): exhaustive calibration over the declared reduced subspace at
      every s, emitting W_exact flagged EXACT. STAGE 4 (the bulk, hours machine): the bounded search
      at three budgets for every s and every sampled carry class, emitting W_upper with budget and
      achieving codeword. STAGE 5 (hours machine): 500 random-code draws per s at matched length and
      dimension through the identical search at the middle budget. STAGE 6 (minutes): monotonicity
      check, budget-sensitivity check, gap computation, null banding, and the run manifest with seeds,
      code hash and resolved inference block.'
    instrument: Python 3.11 with numpy for uint64 bit-packed GF(2) systematic-form reduction and codeword
      weight computation; the same linearizer module as the rank ledger, reused rather than rewritten
      so both objects come from one validated construction; a separately written codeword re-verification
      routine that recomputes the expanded difference from the message difference by direct evaluation;
      harness/runner.py for the manifest, deterministic seeds and the inference block. No SAT solver,
      no computer-algebra system, and no Sage.
    parameters: 'Word width 32, block 512 bits, step counts s = 1..64, code length 32s, dimension
      at most 512. Carry classes: all-zero plus 8 sampled. Budgets: 10^3, 10^4 and 10^5 information-set
      iterations per configuration. Calibration: exhaustive enumeration over a declared 20-bit subspace
      of message differences, 2^20 evaluations per s. Null: 500 random GF(2) generator matrices per
      s at matched length and dimension, run at the middle budget. Achieving codeword re-verification
      on 100 percent of reported bounds.'
  controls:
  - Random-code null band at matched length and dimension, 500 draws per s, identical search and identical
    budget, same invocation.
  - Budget-sensitivity control at three budgets differing by factors of ten, requiring the upper bound
    to decrease.
  - Exhaustive-enumeration calibration at declared reduced configurations, giving W_exact and the
    measured gap to W_upper.
  - 'Monotonicity control: W_upper(s) must be non-decreasing in s, checked at every s.'
  - 'Achieving-codeword control: every reported bound is accompanied by the codeword achieving it,
    re-verified as a genuine codeword by independent recomputation from the message difference.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Random codes of matched length 32s and matched dimension, generated
    by uniformly random GF(2) generator matrices, run through the IDENTICAL bounded search with the
    IDENTICAL budget in the same invocation, 500 draws per s. For the signal arm to mean anything,
    SHA-256''s upper-bound profile must fall below the random-code band, since a code whose cheapest
    differences are no cheaper than a random code''s has no weight structure detectable at this budget.
    A second control is the budget-sensitivity check demanded by inventor-protocol section 3: run
    the bounded search at three budgets differing by factors of ten and confirm that the upper bound
    DECREASES with budget as it must; a bound flat in budget means the search is not searching, and
    is the artifact signature rather than evidence of a true minimum.'
  independent_variables:
  - step count s in 1..64
  - search budget (10^3, 10^4, 10^5 iterations)
  - carry class
  - arm (SHA-256 expansion versus random code of matched length and dimension)
  metrics:
    primary:
    - W_upper(s) per budget with the budget attached
    - W_exact(s) at calibration configurations flagged EXACT
    - measured gap W_upper minus W_exact at calibration
    - random-code null band percentiles per s
    secondary:
    - achieving codeword and its independently recomputed weight per reported bound
    - monotonicity check result per s
    - carry-class spread of W_upper per s
    - wall-clock and iterations actually consumed per configuration
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of step counts s in 1..64 at which SHA-256's W_upper at the middle budget
      falls below the 5th percentile of the 500-draw random-code null band at matched length and dimension,
      together with the measured calibration gap at the declared reduced configurations.
    formula: 'count = |{ s in 1..64 : W_upper_SHA(s, 10^4 iterations) < P5( { W_upper_random_j(s,
      10^4 iterations) : j = 1..500 } ) }|, where W_upper denotes the least codeword weight found
      within the stated iteration budget and is an upper bound on the code''s minimum weight in every
      case. Calibration gap = W_upper(s, 10^4) - W_exact(s) over the declared 20-bit subspace, reported
      per s. No value of count is predicted: a count of zero is recorded as a generic-weight finding
      with its budget attached, which is a complete and reportable outcome rather than a null result
      to be suppressed.'
    source: Pre-registered in the parent proposal IDEA-20260816-840ba6 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The code is built at the FULL SHA-256 parameter set - 32-bit words, 512-bit block,
      64 steps - so no parameter-dimension extrapolation occurs. The tier is toy because two things
      are reduced: the search is budgeted rather than exhaustive, so every non-EXACT number is an
      upper bound, and the calibration enumerates only a declared 20-bit subspace of message differences
      rather than the full 512-bit space, so even W_exact is exact only over that subspace. Both reductions
      are labelled in every emitted field. The transfer assumption stated and NOT tested: that the
      calibration gap measured over a 20-bit subspace says anything about the gap over the full space.'
    correspondence: null
  tail_checks:
  - Report the full 500-draw random-code weight distribution per s, not only percentiles, so a heavy-tailed
    null is visible.
  - Check s = 1 and s = 2, where the code is short and the minimum weight should be computable exactly
    by direct enumeration, as an independent anchor on the search.
  - Report iterations actually consumed against the budget, since a search that terminates early has
    a different bound than one that exhausts its budget.
  - Report the carry-class spread of W_upper per s next to the null band width, so an unresolvable
    comparison is declared rather than resolved.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort if the inherited rank pipeline's rank(A_16) = 512 gate has not passed, since the matrix
    is then unvalidated.
  - Abort if any achieving codeword fails independent recomputation.
  - Stop at the three preregistered budgets; do not add a fourth after seeing the bounds.
  - Halt and report the artifact signature if the bound is identical across all three budgets at every
    s.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every reported bound carries its budget and its achieving codeword, every achieving
    codeword re-verifies independently, W_upper is non-decreasing in s and strictly decreasing in
    budget for at least one s, the calibration gap is emitted at every declared configuration, and
    the 500-draw random-code band is emitted per s - including when SHA-256 sits inside the band at
    every s, which is recorded as a generic-weight finding with its budget rather than treated as
    a failure.
  falsification_criterion:
  - W_upper decreases in s at any step count, falsifying the puncturing construction or the search's
    validity.
  - W_upper is flat across three decades of budget, falsifying the search by the section 3 decay test.
  - An achieving codeword fails independent recomputation, falsifying the search's output entirely.
  - The calibration gap is large and erratic across configurations, falsifying the informativeness
    of bounded search for this code family.
  - SHA-256's profile sits inside the random-code band at every s, closing the weight-structure reading
    at this budget with a measured number.
  - Carry-class spread exceeds the null band width, falsifying resolvability at this carry sampling.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-840ba6
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - No argument establishes that the calibration gap measured over a 20-bit message subspace bounds
    the gap over the full 512-bit space; a Coordinator must decide whether an uncalibrated full-width
    upper bound is worth emitting at all.
  - The random-code null uses uniform generator matrices while the SHA-256 generator is sparse; no
    argument is offered that this is the right null, and a sparse-generator null may be the better
    comparison.
  - The information-set search implementation quality is unbounded from below, so a high bound cannot
    be separated from a weak search except by the budget-sensitivity control, which bounds this only
    partially.
  - This contract depends on the rank pipeline's validated matrix and cannot be approved before that
    pipeline's forced-value gate has passed.
