experiment:
  id: EXP-ALECF-36362d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-34782f; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-34782f
  question_id: RQ-ALECF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the Pareto frontier and the scalarization-induced rank-inversion rate over a population
    of validity-gated reversible modular-arithmetic circuits that differ only in scheduling, against
    a marginal-matched null population.
  objective: 'The one uncertainty a run reduces is whether a single-scalar circuit score loses decision-relevant
    information at a measurable rate, or whether the partial order almost always agrees with the scalar
    so that the collapse is harmless. Concretely: (i) does a population of valid reversible circuits
    computing one fixed function, generated by varying scheduling alone, contain a substantial fraction
    of Pareto-incomparable pairs, or is the resource vector effectively one-dimensional at the scale
    reachable here; (ii) conditional on incomparability existing, at what rate do the six declared
    scalarizations disagree with each other on incomparable pairs, reported as a full matrix rather
    than a headline; (iii) is that disagreement rate distinguishable from the rate produced by resource
    vectors with identical per-axis marginals but no scheduling-induced coupling, which is the null
    arm and the only thing that makes the signal arm interpretable. A run does not decide which scalarization
    is right, does not evaluate any circuit for quality, and does not touch the imported ALECF packages
    except to read their committed numbers as fixed reference points for the scoring functional''s
    definition. The deliverable is three artifacts: the exact frontier of the population, the inversion
    matrix with confidence intervals, and the same matrix for the null, plus the difference. If the
    difference is zero everywhere the run has produced a controlled null, which is a complete result
    and is recorded as one.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for reversible modular arithmetic
      circuits over prime fields of the tested bit widths, generated by the declared scheduling policies
      and passing the declared validity gate, the Pareto-incomparability fraction and the pairwise
      scalarization inversion rates take the measured values, and those values differ from a marginal-matched
      null by the measured amount. WHAT DOES NOT FOLLOW: nothing about 256-bit secp256k1 point-addition
      circuits, nothing about whether any imported ALECF score is correct or incorrect, nothing about
      the quality of any circuit anywhere, nothing about the feasibility or infeasibility of any quantum
      attack, and no recommendation that any benchmark should change its scoring rule. A measured
      inversion rate is a property of a population and a set of functionals, and it does not transfer
      to a population that was not sampled.'
  inputs:
    procedure: 'STAGE 0 (cost: under one hour of engineering): fix the gate-set granularity, the six
      scalarizations as pure functions, and the seed manifest; write the degenerate self-comparison
      instrument check and confirm it returns exactly zero. STAGE 1 (cost: a few hours of engineering,
      seconds of compute): implement the reversible-circuit interpreter over classical basis states
      with an ancilla-restoration checker, and a modular adder plus a modular multiplier over F_p.
      STAGE 2 (cost: hours of engineering): implement the scheduling-variation generator with at least
      three unrelated policy families, producing 200 valid circuits per prime. STAGE 3 (cost: minutes
      of compute): run the validity gate on every generated circuit and discard failures, recording
      the discard rate. STAGE 4 (cost: seconds): compute resource vectors, the exact Pareto frontier,
      the incomparability fraction, and the inversion matrix. STAGE 5 (cost: seconds, same invocation):
      generate the marginal-matched null population from the measured marginals and the committed
      seed, and run STAGE 4''s identical code path on it. STAGE 6 (cost: under an hour): bootstrap
      confidence intervals over circuits and report the measured-minus-null difference matrix, the
      per-policy-family breakdown, and the discard rate.'
    instrument: 'Python 3.11 standard library for exact integer arithmetic; a new reversible-circuit
      interpreter module written for this contract, operating on classical basis states with explicit
      ancilla allocation and free events; harness/toycurve.py for exact prime-field arithmetic used
      to build reference values and for the independent recomputation check it was written to provide;
      numpy for the inversion-matrix and bootstrap statistics; pytest for the interpreter''s own unit
      tests; harness/runner.py for run-record emission and the inference manifest block. No Sage.
      No quantum simulator library and no external service: the interpreter is classical and permutation-only
      by construction, which is a limitation stated rather than hidden.'
    parameters: 'Primes p of bit width 8, 13, and 17 (three values, exact primes fixed in the manifest).
      Population size 200 valid circuits per prime after the validity gate, drawn from at least 3
      unrelated scheduling policy families with at least 40 members each. Six scalarizations: T; Q;
      T times Q; T times Q squared; T times depth; sum over time of live-qubit count. Validity gate
      sample size 4096 random inputs per circuit for the 17-bit prime, exhaustive for 8-bit. Null
      population size equal to the measured population, 200 per prime, with 50 independent null draws
      for the confidence interval. Bootstrap resamples 2000.'
  controls:
  - Marginal-matched null population, executed in the same script invocation as the signal arm.
  - 'Validity gate: every circuit in the population is classically simulated and must restore all
    ancillas to zero, so invalid circuits cannot enter the frontier.'
  - 'Identical-function gate: all population members are checked to compute the same function on the
    same test vectors, so resource differences cannot come from computing something else.'
  - 'Seed manifest: the population generator and the null generator both read seeds from a committed
    file, so the two arms are reproducible independently.'
  - A degenerate scalarization control (toffoli alone) whose inversion rate against itself must be
    exactly zero, as an instrument check on the inversion-rate code.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a population of resource vectors drawn independently
    from the same marginal distributions as the measured population, with the joint dependence destroyed:
    sample toffoli values from the empirical toffoli marginal and peak_qubits from the empirical peak_qubits
    marginal, independently, producing the same number of vectors of the same shape and the same per-axis
    spread but no scheduling-induced coupling. The identical scalarization and inversion-rate code
    runs on the null. For the signal arm to mean anything the null must show a DIFFERENT inversion
    rate: if independently sampled vectors invert at the same rate, then the inversion rate measures
    only the marginal spread of the axes and says nothing about the tradeoff structure that scheduling
    induces, and the honest record is a controlled null. Both arms are executed in the same invocation
    of the same script from the same seed file.'
  independent_variables:
  - prime bit width
  - scheduling policy family
  - scalarization pair
  - population arm (measured versus marginal-matched null)
  metrics:
    primary:
    - Pareto-incomparability fraction
    - pairwise rank-inversion rate per scalarization pair
    - measured-minus-null inversion-rate difference
    - Pareto-frontier cardinality
    secondary:
    - validity-gate discard rate
    - per-axis coefficient of variation
    - depth versus (toffoli, peak_qubits) residual variance
    - per-policy-family inversion-rate breakdown
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The measured-minus-null difference in pairwise rank-inversion rate, for the pair (ALECF
      product scalarization, peak-qubits-only scalarization), restricted to Pareto-incomparable circuit
      pairs, at the 13-bit prime.
    formula: 'Let I be the set of unordered pairs {c1,c2} of validity-gated circuits that are mutually
      non-dominating on (toffoli, peak_qubits, depth). For scalarizations f and g, inv(f,g) = |{ {c1,c2}
      in I : sign(f(c1)-f(c2)) != sign(g(c1)-g(c2)) }| / |I|. The pre-registered quantity is D = inv_measured(product,
      peak_qubits_only) - mean over 50 null draws of inv_null(product, peak_qubits_only). Predicted:
      |D| >= 0.05 with the sign left unspecified, and the incomparability fraction |I| divided by
      the number of all unordered pairs is predicted at or above 0.25.'
    source: Pre-registered in the parent proposal IDEA-20260816-34782f before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are prime fields of 8, 13 and 17 bits with populations of 200
      circuits, which is four orders of magnitude below the 256-bit secp256k1 setting the imported
      ALECF packages concern. The transfer assumption, stated and not defended, is that the qualitative
      existence of scheduling-induced Pareto incomparability is scale-robust while its magnitude is
      not. No numeric extrapolation is performed and no measured rate is reported as applying at 256
      bits. The choice of toy scale is deliberate: it is the largest scale at which every circuit
      in the population can be validity-gated by classical simulation, and an ungated population would
      make the frontier meaningless.'
    correspondence: null
  tail_checks:
  - Inspect the extreme tail of the peak_qubits distribution for circuits whose width is set by a
    single pathological allocation rather than by policy.
  - Check whether frontier membership is concentrated in one policy family, which would indicate generator
    bias rather than circuit-space structure.
  - Examine circuits with identical resource vectors but different gate orders for accidental deduplication
    that would deflate the pair count.
  - Check the smallest prime for saturation, where nearly all circuits share one peak width and the
    frontier degenerates.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop after the declared population sizes are reached at all three primes; no adaptive enlargement.
  - Abort and report an instrument failure if the degenerate self-comparison control returns a nonzero
    inversion rate.
  - Abort if the validity-gate discard rate exceeds 0.5, since the generator is then producing mostly
    invalid circuits and the surviving population is a selected sample.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run completes all six stages, the instrument check returns exactly zero,
    both arms are computed in the same invocation, and the pre-registered quantity D is reported with
    a bootstrap confidence interval together with the full inversion matrix and the frontier, whatever
    their values.
  falsification_criterion:
  - The incomparability fraction is below 0.05 at every tested prime.
  - The confidence interval for D contains zero for every scalarization pair.
  - Depth is exactly determined by (toffoli, peak_qubits) across the whole population, collapsing
    the third axis.
  - The validity gate rejects more than half of generated circuits, invalidating the population.
  - The degenerate self-comparison control fails, which falsifies the instrument and voids the run.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-34782f
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The scheduling policy families must be named concretely and justified as unrelated before approval;
    'at least three unrelated families' is not yet a specification.
  - The definition of depth under the chosen gate-set granularity needs to be fixed in the contract,
    since Toffoli-atomic and Toffoli-decomposed conventions give different numbers and the choice
    is currently open.
  - A Coordinator must decide whether the marginal-matched null is the right null, or whether a second
    null preserving rank correlation but destroying the frontier shape is also required.
