experiment:
  id: EXP-ECDLP-552738
  hypothesis_id: H-ECDLP-cd7072
  version: 1
  title: >-
    Single-sign recall of a generatively used y-oracle against exhaustive
    relation truth, with the source proposal's factor-m yield band removed as a
    multiplicity artifact, the square-root oracle charged, and a curve-free
    (Z/N, +) null that decides how much of the result is elliptic
  status: draft
  objective: >-
    Measure two things and refuse to conflate them. FIRST, the fraction of the
    exhaustive relation set that a SINGLE-SIGN y-oracle recovers when used
    generatively, predicted at 1 - 2^{-m} = 0.875 at m = 3 because the oracle
    fixes the sign of the distinguished member. This is curve-specific, it
    exists only because the x-only representation carries a sign ambiguity, and
    (Z/N, +) has no analogue of it. SECOND, the charged cost of the guided
    procedure against exhaustive search, in one operation unit with the square
    root charged, predicted as a fitted exponent gap of 1.0 in B. That saving is
    the ordinary 3-sum meet-in-the-middle and the curve-free null is present to
    prove it, so it may not be reported as an elliptic or ECDLP result.
    NO YIELD ADVANTAGE IS MEASURED, because none can exist. The guided
    procedure searches a subset of the exhaustive space and the source
    proposal's ratio of m is a re-count of the same relations.
  inputs:
    curve_family: >-
      Toy prime-field short-Weierstrass curves at p in {101, 103, 107, 211,
      1009, 2003}, hygiene-screened per curve with the factored group order,
      the largest prime factor, and an explicit "#E(F_p) != p" check.
    factor_base: >-
      V, a random x-subset of F_p of size B chosen independently of every
      target, determining 2B points up to sign.
    arity: 3
    B_over_p_ladder: [0.015625, 0.0625, 0.25, 0.5]
    B_ladder_for_cost_fit: >-
      At least four B values per prime, spanning at least a factor of 8, with
      the achieved B/p reported rather than the target.
    targets_per_cell: 2000
    oracle_implementation: >-
      Concrete, not hypothetical. y = sqrt(x^3 + ax + b) by one exponentiation
      when p is congruent to 3 mod 4 and by Tonelli-Shanks otherwise. The
      measured cost per oracle call is charged to the guided arm in the same
      F_p-multiplication unit as everything else.
    curve_free_null_instances: >-
      (Z/N, +) at matched N and matched B, with V a random subset of Z/N and
      the "oracle" the identity map. There is no sign in this object, which is
      the point.
  controls:
    - >-
      NAMED NULL, BLOCKING, CURVE-FREE. The identical protocol in (Z/N, +).
      CONSEQUENCE PRE-STATED IN TWO PARTS. On COST, if the null reproduces the
      elliptic cost exponent gap within the pooled interval, the saving is
      generic 3-sum meet-in-the-middle and may NOT be reported as a statement
      about elliptic curves, the y-oracle, or the ECDLP. This is the ANTICIPATED
      outcome and is informative. On RECALL, the null's single-element-fixed arm
      is forced to recall exactly 1.000 because Z/N has no sign ambiguity, so
      the elliptic-minus-null recall gap of 0.125 is the only curve-specific
      quantity in the contract and is the only quantity an elliptic conclusion
      may rest on.
    - >-
      FORCED-VALUE UPPER CONTROL. The both-signs y-oracle arm, which queries
      both roots at the distinguished element. Its recall against exhaustive
      truth is forced to 1.000 and its distinct-relation set must equal the
      exhaustive set exactly. A single relation found here and missed by
      exhaustive search means exhaustive search is not exhaustive.
    - >-
      PLANTED DEFECT OF KNOWN SIZE, BLOCKING, LOWER CONTROL. Construct a cell
      in which every recorded relation uses the sign OPPOSITE to the one the
      oracle returns at every member, by negating the oracle's convention after
      the relation set is fixed. Single-sign recall is then forced to exactly
      0.000. An instrument that still reports 0.875 there cannot measure recall
      at all and voids every number in the run.
    - >-
      RANDOM-y NULL. An oracle returning a uniformly random field element as y
      regardless of the curve. The constructed points are almost never on E, so
      recall must be at its sampling noise floor, reported as an upper bound
      rather than as "zero".
    - >-
      COMMITTED-BASELINE CROSS-CHECK. On the (p, b, seed) cells where they
      overlap, the exhaustive arm's relation counts are compared against the
      committed x-oracle grid. THE COMPARISON IS MADE AGAINST
      runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml RECOMPUTED DIRECTLY, never
      against EV-ECDLP-65b004's recorded hashes, which DEC-20260808-6a7ac4
      discloses as fabricated placeholders.
    - >-
      MATCHED BASELINES, MANDATORY UNDER RQ-ECDLP-002 CONSTRAINT 3. Pollard rho
      and BSGS on the identical instances, in the same operation unit, with
      BSGS memory in bits.
  independent_variables:
    - prime p, six values
    - factor-base size B, at least four values per prime spanning a factor of 8
    - oracle variant, single-sign, both-signs, random-y
    - object class, elliptic curve versus curve-free (Z/N, +)
  metrics:
    primary:
      - >-
        single_sign_recall, dimensionless in [0,1], distinct relations found by
        the single-sign guided arm divided by distinct relations found by
        exhaustive search on the identical instance, with a binomial 95 percent
        interval
      - >-
        charged_cost_exponent_gap, dimensionless, fitted exponent of total
        charged cost against B for exhaustive search minus that for the guided
        arm, both in F_p multiplications with the square root charged
      - >-
        elliptic_minus_curve_free_recall_gap, dimensionless, with a pooled
        interval
    secondary:
      - distinct relation counts per arm per cell, deduplicated as unordered multisets
      - relations found by the guided arm and not by exhaustive search, integer, expected 0
      - measured oracle cost per call in F_p multiplications
      - measured sign-vector distribution over the 2^m patterns among recorded relations
      - decomposition fraction per cell against the predicted B^3 / (6 N)
      - achieved B/p per cell, reported rather than the target
      - matched rho and BSGS operation counts, and BSGS memory in bits
  heuristic_under_test: H1
  preregistered_prediction:
    quantity: >-
      The fraction of the exhaustive arity-3 relation set recovered by a
      single-sign generatively used y-oracle.
    formula: >-
      recall = 1 - 2^{-m}. A relation eps_1 P_1 + eps_2 P_2 + eps_3 P_3 = R with
      every x(P_i) in V is reached by the guided arm exactly when the oracle's
      sign at some x(P_i) equals eps_i; the probability that none of the m
      members matches is 2^{-m} under uniform relation signs. At m = 3 this is
      1 - 1/8 = 0.875.
    source: >-
      Derived in H-ECDLP-cd7072 from the x-only representation of the Semaev
      factor base. It is NOT the source proposal's prediction, which was a
      factor-m yield ratio and is removed here as a multiplicity artifact.
  band_non_degeneracy:
    checked_before_freezing: true
    arms_found_degenerate_and_repaired:
      - >-
        SOURCE ARM REJECTED AS DEGENERATE, AND ITS FALSIFIER IS A THEOREM.
        IDEA-20260808-a3f7c1 pre-registers Y_guided / Y_exhaust = 3.0 with band
        [2.5, 3.5] and the falsifier 1.0 plus or minus 0.2. COMPUTED, the ratio
        of 3 is pure double counting. The guided procedure enumerates ordered
        pairs of a distinguished member and a remaining multiset, so every
        unordered 3-element relation is reached three times, once per choice of
        distinguished member; the source's own derivation, B * B^{m-1}/((m-1)!N)
        against B^m/(m!N), is exactly the ratio (m-1)! to m!. Deduplicated, the
        procedures search the same space and exhaustive search at arity m
        returns EVERY m-subset relation by definition, so Rel_guided is a subset
        of Rel_exhaust and no yield advantage can exist for ANY p, B or oracle.
        The nominated falsifier, a ratio of 1.0, is what set inclusion already
        proves, so the band could never distinguish the two readings.
      - >-
        REPAIR, COMPUTED, NOT A LOOSENED THRESHOLD. The yield ratio is deleted
        and replaced by two quantities that are not forced. First,
        DEDUPLICATED single-sign recall against exhaustive truth, whose value is
        computed as 1 - 2^{-m} = 0.875 and which is curve-specific because it
        exists only through the x-only sign ambiguity. Second, CHARGED COST per
        distinct relation, which is where the real difference lies and which the
        source proposal listed only as a confounder.
      - >-
        SECOND REPAIR. The source assumes the oracle is FREE and lists its
        simulation cost as its dominant confounder. COMPUTED, the oracle is not
        hypothetical at all, it is a square root at O(log^2 p) field operations,
        so the "oracle model" framing is vacuous and the object under test is
        the ordinary sort-or-hash decomposition. The oracle is therefore charged
        explicitly and the confounder is removed rather than disclosed.
    surviving_bands_and_their_separations:
      - >-
        SINGLE-SIGN RECALL. Predicted 0.875, band [0.855, 0.895], which at 2000
        recorded relations per cell is about 2.7 standard errors, the standard
        error of a proportion at 0.875 being 0.0074. The instrument's range is
        exercised at both ends by forced controls, the both-signs arm forces
        1.000 and the sign-inverted planted control forces 0.000. NON-DEGENERATE
        with demonstrated dynamic range across the full [0,1] interval.
      - >-
        COST EXPONENT GAP. Predicted 1.0 from Theta(B^3) against Theta(B^2),
        band plus or minus 0.15, fitted over at least four B values spanning a
        factor of 8. Under the competing reading that the guided arm has no cost
        advantage the gap is 0.0, which is 6.7 band half-widths away.
        NON-DEGENERATE.
      - >-
        ELLIPTIC MINUS CURVE-FREE RECALL GAP. Predicted 1.000 - 0.875 = 0.125
        against a null of 0.000. The null value is forced, because Z/N carries
        no sign, so the two readings are separated by the entire predicted
        effect. NON-DEGENERATE and it is the only quantity licensed to carry an
        elliptic conclusion.
  scale_relevance:
    tier: toy
    justification: >-
      7 to 11 bit prime fields, arity 3, B up to half of p. Every number is a
      statement about those cells. The B^3-to-B^2 restructuring is a known
      generic technique and no exponent claim about the ECDLP follows from it at
      any scale. Behaviour at cryptographic p and at B = p^{1/3} is UNTESTABLE
      AT REACHABLE SCALE here and is not extrapolated to.
    correspondence: null
  tail_checks:
    - >-
      At the largest B, where the predicted decomposition probability is closest
      to 1, compare the measured decomposition fraction against B^3 / (6 N).
      This is where dependence among subset sums would show first.
    - >-
      Report the sign-vector distribution over all 2^m patterns among recorded
      relations. A concentrated distribution would explain a recall away from
      0.875 without any defect in the instrument, and must be reported before
      the recall is interpreted.
    - >-
      Report the single cell with the lowest and the single cell with the
      highest recall individually, so a pooled 0.875 cannot hide a bimodal
      distribution.
  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
  stopping_rules:
    - >-
      Run the both-signs forced-value control and the sign-inverted planted
      control FIRST. If the first does not return recall 1.000 with a zero set
      difference against exhaustive truth, or the second does not return 0.000,
      halt and report the instrument defect. No single-sign number is read.
    - >-
      Stop the B ladder at a cell when four values spanning a factor of 8 are
      complete or when the exhaustive arm at the next B would exceed one third
      of the wall-clock budget, and report which.
    - >-
      If the recall interval half-width exceeds 0.02 at a cell, increase the
      recorded relation count to the value reaching 0.02 under the observed
      variance, or report the cell as UNDERPOWERED with that required count.
      The band [0.855, 0.895] is never widened.
    - >-
      Drop a B value from the cost fit only by the pre-registered rule R^2 below
      0.90 on the full ladder, applied before the exponent is read.
  invalidation_rules:
    - >-
      Relations are counted as ordered tuples rather than deduplicated unordered
      multisets anywhere in the primary metrics. That reintroduces the
      multiplicity artifact this contract exists to remove.
    - >-
      The oracle's cost is omitted from the guided arm's charge.
    - >-
      The two arms are run on different factor bases, different targets, or
      different operation units.
    - >-
      Any comparison is drawn against EV-ECDLP-65b004's recorded artifact
      hashes rather than against runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml
      recomputed directly.
    - >-
      A cost advantage is reported as an elliptic-curve, oracle, or ECDLP result
      when the curve-free null reproduces it.
    - >-
      Any timeout, crash, or memory exhaustion is reported as evidence rather
      than as an infrastructure outcome, contrary to AGENTS.md rule 5.
  success_criterion: >-
    All of the following on the same committed run set. The both-signs control
    returns recall 1.000 with a zero set difference; the sign-inverted planted
    control returns 0.000; single-sign recall lies inside [0.855, 0.895] at
    every completed elliptic cell; the fitted cost exponent gap lies inside
    1.0 plus or minus 0.15; and the elliptic-minus-curve-free recall gap is
    0.125 within its pooled interval while the curve-free cost gap matches the
    elliptic one. That combination establishes a small, real, curve-specific
    fact about the sign ambiguity and simultaneously establishes that the cost
    saving is generic. Anything weaker is reported as such.
  falsification_criterion: >-
    Any of the following, scoped to the tested primes, factor-base sizes, arity
    3, the pinned implementation and the budget. Single-sign recall outside
    [0.855, 0.895] with both forced controls firing, which falsifies uniform
    relation signs. Or a fitted cost exponent gap outside 1.0 plus or minus 0.15
    with the fit rule satisfied, which falsifies one arm's cost model. Or the
    curve-free recall gap failing to appear, that is the (Z/N, +) arm also
    returning 0.875, which would mean the recall deficit is not the sign
    ambiguity and the mechanism is misidentified.
  required_artifacts:
    - implementation source at a pinned revision, with the square-root routine identified
    - per-cell deduplicated relation sets for every arm, retained as unordered multisets
    - the exhaustive truth set per instance, from which recall is computed
    - measured oracle cost per call, per prime
    - the both-signs forced-value control and the sign-inverted planted control results
    - the random-y null results with its noise floor stated as an upper bound
    - the curve-free (Z/N, +) arm's full results in the same schema
    - the cost fits, residuals, intervals and R^2 per arm per prime
    - the committed-baseline cross-check, recomputed from runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml
    - matched rho and BSGS operation and memory counts on the identical instances
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
