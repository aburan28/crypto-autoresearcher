experiment:
  id: EXP-VOLC-48d4e7
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-a2b59a
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE TWO-ell MISMATCH CONTROL: one curve carries two contradictory depths -- crater in the
    ell_1-volcano, floor in the ell_2-volcano -- so a balanced 2x2 factorial over (level at ell_1)
    x (level at ell_2) is the only design that can attribute a measured effect to the ell a functional
    is DEFINED at rather than to depth in general, and its pre-registered signature is a single main
    effect with no cross term'
  status: draft
  objective: "(A) THE FACT THE DESIGN EXPLOITS. For distinct primes ell_1, ell_2 dividing c, the coordinates\
    \ v_{ell_1}(f_E) and v_{ell_2}(f_E) are INDEPENDENT: an ell_1-isogeny changes only the ell_1-adic\
    \ valuation of the conductor. So within one isogeny class there exist curves realizing all four\
    \ combinations (crater, crater), (crater, floor), (floor, crater), (floor, floor), provided both\
    \ volcanoes have positive height, and the four cells can be POPULATED DELIBERATELY by ascending\
    \ or descending in one volcano while holding the other fixed. THE SAME CURVE IS SIMULTANEOUSLY\
    \ AT THE TOP OF ONE VOLCANO AND THE BOTTOM OF ANOTHER. Any statement of the form \"E is deep\"\
    \ or \"E is at the crater\", made without naming ell, is therefore not merely imprecise: it is\
    \ ill-posed.\n(B) WHAT THE DESIGN DECIDES, AND IT IS A THREE-WAY DECISION. Let F be a cost functional\
    \ and suppose F is nominally an ell_1-local quantity -- for instance anything built on E[ell_1],\
    \ on rational ell_1-isogeny counts, or on an ell_1-translation-symmetrized factor base as in IDEA-20260807-cbe8c1.\
    \ Measure F across the balanced 2x2. Exactly three signatures are possible and they carry different\
    \ meanings:\n  (S1) MAIN EFFECT ON ell_1 ONLY, no ell_2 main effect, no interaction.\n    F reads\
    \ the ell it is defined at. The mechanism is ell-local and the\n    level label is doing real\
    \ work. This is the signature\n    IDEA-20260807-cbe8c1 predicts for its own mechanism.\n  (S2)\
    \ MAIN EFFECTS ON BOTH, of magnitudes ordered by log ell_1 versus\n    log ell_2. F reads the\
    \ SIZE of the order (|disc O_f| = f^2 |D_K|, or\n    h(disc O_f)) and the ell-labels are just\
    \ a way of moving f. The\n    mechanism is not ell-local and every \"the ell_2-volcano matters\"\
    \ claim\n    is a restatement of \"f got bigger\".\n  (S3) MAIN EFFECT ON ell_2 ONLY, or an interaction\
    \ with no main effects.\n    F does NOT read what it claims to read. Either the functional is\n\
    \    misattributed or the pipeline is leaking -- for example the factor-base\n    construction\
    \ is correlated with j, and j moves whenever any isogeny is\n    taken. THIS IS THE ARTIFACT SIGNATURE\
    \ and it is the reason the control\n    exists.\nNo single-ell design distinguishes these, because\
    \ in a single-ell design the ell being varied and the conductor being changed are perfectly confounded.\n\
    (C) WHY THIS IS A CONTROL AND NOT A HYPOTHESIS. It asserts nothing about whether any effect exists.\
    \ It is the instrument that makes an effect ATTRIBUTABLE if one is found, and it is cheap: four\
    \ cells, a handful of curves per cell, the same frozen measurement the rest of the lane already\
    \ runs. Under docs/inventor-protocol.md section 3 (\"controls before belief\") no positive from\
    \ IDEA-20260807-cbe8c1 or IDEA-20260807-3f5545 should be believed until it has passed this factorial,\
    \ and this record exists so that requirement is written down before any positive is in hand."
  resource_label: 'audit: consumes no resource (control design); the stratifying variables are R3/R4,
    the measured functionals are R1/R2/R5'
  admissibility: admissible
  admissibility_argument: A control design consumes no resource and mounts no attack; it constrains
    the interpretation of other proposals. The measured functionals are restricted, by the same blocking
    rule as IDEA-20260807-3f5545, to quantities that do not factor through the abstract triple (G,
    P, Q). Triple-factoring functionals (rho, BSGS) are measured only as instrument checks and are
    REQUIRED to show no effect in any cell, by IDEA-20260807-5cabfc; an effect there is a bug signature,
    not a finding.
  reachability_gate: 'THE DESIGN MOVES BETWEEN CURVES DELIBERATELY, so the gate applies and it passes
    for the cells but not for the replicates. REACHING A CELL: the four (level, level) combinations
    are reachable by ascent/descent at O(ell * h^2) Velu steps per coordinate (IDEA-20260807-bb03d3),
    so cells are cheap and locally verifiable by isogeny counting. REACHING A REPLICATE: a replicate
    is a specific vertex of a Cl(O_f)-torsor, and the design does NOT need a specified one -- it needs
    r independent ones, which a horizontal random walk supplies under GRH-conditional rapid mixing
    in O(log p) steps. So the design never needs the hard direction of T5. THE ONE PLACE T5 WOULD
    BITE -- selecting the BEST vertex within a cell -- is exactly what this design refuses to do,
    on purpose: the within-cell spread is treated as ERROR, not as a target. If a future record wants
    to target it, it inherits the p^{1/4} vectorization cost and must say so.'
  inputs:
    procedure: 'STAGE 1 (minutes): class selection arithmetic for ell_1 ell_2 | c. STAGE 2 (hours):
      populate the four cells with r = 8 replicates each, using the ascent/descent machinery, re-measuring
      BOTH coordinates after every move (HARD GATE). STAGE 3 (hours): the frozen measurement on all
      32 curves plus the same on the N2 degenerate class. STAGE 4 (minutes): two-way analysis with
      replication; S1/S2/S3 verdict; permutation null; swap control N3. TOTAL: 32 to 64 Groebner solves
      plus the walks. This is the CHEAPEST attribution instrument in the batch and it should gate
      every positive.'
    mechanism: 'STEP 1 -- CLASS SELECTION. Find a toy class whose conductor c is divisible by two
      distinct small primes, ideally with v_{ell_1}(c) >= 1 and v_{ell_2}(c) >= 1 (heights at least
      1 in both). Record the search density. STEP 2 -- CELL POPULATION BY DESIGNED WALKS. Start from
      any curve. Use the ascent/descent machinery of IDEA-20260807-bb03d3 to reach each of the four
      cells: ascend in ell_1 and ell_2 to get (crater, crater); from there descend once in ell_2 only
      to get (crater, floor); and so on. Every move is verified to change only the intended coordinate,
      by re-measuring BOTH coordinates after every step. THIS VERIFICATION IS THE DESIGN''S LOAD-BEARING
      STEP: if a move changes both coordinates, the factorial is broken and the cells are not what
      they are labelled. STEP 3 -- REPLICATION WITHIN CELL. Each cell is a Cl(O_f)-torsor of size
      h(f^2 D_K), so populate each cell with r >= 8 DISTINCT curves reached by horizontal walks of
      matched length. This is what gives the design a within-cell error term; without it the factorial
      has zero degrees of freedom for error and is uninterpretable. STEP 4 -- MATCHED MEASUREMENT.
      Identical frozen protocol per curve: factor base of declared size, m = 3 Semaev decomposition
      measurement, Groebner wall time, basis size, basis max total degree, decomposition yield, plus
      the ell_1-specific functional under test (for instance the translation-symmetrized cost of IDEA-20260807-cbe8c1)
      and its ell_2 analogue. STEP 5 -- ANALYSIS. Two-way layout with replication: estimate both main
      effects and the interaction, each in units of the within-cell error. Report the S1/S2/S3 verdict,
      with the ratio of the two main effects compared against log ell_1 / log ell_2 for the S2 test.
      Then run the label-permutation null within the design.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - label-permutation null within the design (N1, blocking)
  - degenerate-height class where ell_2 cannot vary (N2, blocking)
  - swap control with an ell_2-defined functional (N3)
  - within-cell horizontal replicates as the error term (N4)
  - matched rho and BSGS as an instrument check that must show no effect
  - per-move verification that only the intended coordinate changed
  - "NULL OBJECT (from the proposal): (N1) LABEL-PERMUTATION NULL within the design: permute the four\
    \ cell labels\n  among the 4r measured curves, refit, and report each effect's percentile.\n \
    \ Blocking.\n(N2) THE DEGENERATE-HEIGHT NULL: repeat the whole design in a class where\n  v_{ell_2}(c)\
    \ = 0, so the ell_2 factor CANNOT vary. The design must then\n  report an ell_2 main effect indistinguishable\
    \ from zero by construction. If\n  it does not, the cell-population machinery is mislabelling\
    \ curves and the\n  whole factorial is void. This is the cheapest possible test of the\n  instrument\
    \ and it is blocking.\n(N3) THE SWAP CONTROL: run the identical analysis with the roles of ell_1\
    \ and\n  ell_2 exchanged and with an ell_2-defined functional. S1 must then appear on\n  the ell_2\
    \ factor. A functional that always shows a main effect on ell_1\n  regardless of which ell it\
    \ is defined at is reading something else.\n(N4) WITHIN-CELL SPREAD across the r horizontal replicates:\
    \ the error term,\n  and simultaneously a measurement of crater homogeneity that feeds\n  IDEA-20260807-bb03d3's\
    \ O1/O2 question at no extra cost.\nDECAY PARAMETER: the volcano heights (v_{ell_1}(c), v_{ell_2}(c)).\
    \ Every effect must vanish in the coordinate whose height is zero. An effect that survives a height-zero\
    \ coordinate is the canonical artifact tell and voids the run."
  independent_variables: []
  metrics:
    primary:
    - (v_{ell_1}, v_{ell_2}) measured independently after every move
    - the frozen functional vector per curve, per cell
    - both main effects, the interaction, and the within-cell error
    - permutation percentiles for each effect
    secondary:
    - within-cell spread versus walk length (saturation curve)
    - rho and BSGS counts per curve
    - discard rate of classes failing ell_1 ell_2 | c
  heuristic_under_test: null
  preregistered_prediction:
    quantity: change in v_{ell_2}(f_E) across an ell_1-isogeny step, over every move made while populating
      the grid
    formula: EXACTLY ZERO on 100 percent of moves. This is the design's validity condition, not a
      statistic. A single move that changes both coordinates halts the line.
    source: pre-registered in IDEA-20260807-a2b59a before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - LOW POWER. Four cells with r = 8 gives 28 error degrees of freedom, which detects effects of about
    1.5 within-cell standard deviations, not smaller. The design cannot see a subtle effect and must
    say so rather than reporting a null as strong.
  - j MOVES ON EVERY STEP. Any j-correlated artifact in factor-base construction will appear as an
    effect of whichever coordinate was walked. N3 (the swap control) is what distinguishes this, and
    it is not optional.
  - CELL POPULATION ORDER. If all (crater, crater) curves are reached by short walks and all (floor,
    floor) by long ones, walk length is confounded with cell. Walk lengths must be matched across
    cells and the achieved lengths reported.
  - At ell = 2 the volcano and the group structure both have well-known 2-adic subtleties (see IDEA-20260807-3c6bd8's
    assumption on v_2). Preferring ell_1, ell_2 in {3, 5} avoids this; if 2 must be used, the case
    split is explicit.
  - Classes with two small prime factors in c may be rare at small p, forcing larger p and hence more
    expensive measurement. The discard rate is reported so this is visible rather than absorbed.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY ZERO on 100 percent of moves. This is the design's validity condition,
    not a statistic. A single move that changes both coordinates halts the line.
  falsification_criterion:
  - Any move that changes both coordinates. The design's premise is wrong or the isogeny machinery
    is broken; halt.
  - A nonzero ell_2 effect in N2. Cells are mislabelled; every result in the design is void.
  - S3 (the artifact signature) on a functional that IDEA-20260807-cbe8c1 claims is ell_1-local. That
    claim's mechanism is not what is being measured and the positive there must be withdrawn or re-explained.
    THIS IS THE OUTCOME THE CONTROL EXISTS TO PRODUCE, and producing it is a success of the control,
    not a failure of the batch.
  - All effects below the permutation null. No attribution is possible; report "no effect large enough
    to attribute, with achieved power X". The power statement is mandatory since with 4 cells and
    r = 8 the design is small.
  - Within-cell spread failing to saturate at the longest affordable walk. The error term is unreliable
    and no effect may be declared significant.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-a2b59a
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
