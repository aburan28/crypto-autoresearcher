experiment:
  id: EXP-SATIC-f50f16
  hypothesis_id: H-SATIC-5c526c
  source_idea: IDEA-20261017-4b1672
  question_id: RQ-SATIC-1ae57a
  goal_id: GOAL-ICPERF-e6b6a4
  version: 1
  title: 'Per-attempt DPLL exponent alpha(m) on enumeration-certified UNSAT point-decomposition systems at m in
    {3,4,5}: WDSat conflicts vs l on chained S_3 and direct S_5, with the Trimoska m=3 gate, support-matched nulls
    and a CryptoMiniSat control'
  experiment_class: cost-model-measurement
  status: review_required
  frozen: false
  designed_at: '2026-10-17'
  designed_under_task: TASK-20261017-516834
  approved_by: null
  approval_decision: null
  execution_authorized: false
  status_note: >-
    review_required, not approved (AGENTS.md "Approval is bounded by execution"): no launcher could be bound and
    smoke-tested in the design session. Missing before approval: (1) implementation/run.py and check.py binding the
    m4-sat-cost pilot exporter (analysis/ecdlp2m-iteration-20261009/m4-sat-cost-pilot/: wdsat_io.py, label.py,
    run_cells.py, run_trimoska.py, fit.py, wdsat_source_sha256.txt) and the vendored WDSat at
    experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/builds/wdsat_987b7f5ef9, sha256-bound; (2) the Stage 0
    direct S_5 Boolean builder (s5_builder.py) with its E3 correctness check; (3) trial-plan.json for RUN-SATIC-62fe76,
    RUN-SATIC-7d069a, RUN-SATIC-dd8dde, RUN-SATIC-f86d22; (4) runbook.yaml with session RBS-SATIC-f50f16, LINT OK;
    (5) lane BATCH-e0e87d under GOAL-ICPERF-e6b6a4 with its dispatch queue; (6) tools/experiment_preapproval.py
    approvable true. Predictions, falsification conditions and H1-H3 are copied from IDEA-20261017-4b1672 without
    adjustment; where the design memo differed (P4 0.5 vs 0.3; gate ratio 5% vs [0.95,1.1]) the idea wins and the
    difference is noted. The m4-sat-cost pilot is exploratory provenance only.
  objective: >-
    Measure, on enumeration-certified UNSAT Weil-descended point-decomposition systems at toy n, the slope alpha(m)
    of log2(median WDSat conflicts) in l for m in {3,4,5} under each complete configuration and presentation, with
    the paper's m=3 instances as the instrument gate, a support-matched random null and a CryptoMiniSat control,
    and report per cell the ratio of the median to 2^(ml)/m!. The experiment prices an existing object; it measures
    no cost against rho and claims no speedup.
  inputs:
    implementation_sources:
      sha256_binding: to-be-bound-at-approval
      note: 'No file is bound yet; the list is the design memo''s. Digests are recorded here and in the trial plan at
        approval, never invented.'
      from_m4_sat_cost_pilot:
        root: analysis/ecdlp2m-iteration-20261009/m4-sat-cost-pilot/
        files: [wdsat_io.py, label.py, run_cells.py, run_trimoska.py, fit.py, wdsat_source_sha256.txt]
        role: ANF exporter with the counters and symfull patches, labelling, cell runner, Trimoska-instance runner,
          bootstrap fit
      from_m45_closure_pilot:
        root: analysis/ecdlp2m-iteration-20261009/m45-closure-pilot/
        files: [pilot2_lib.py, pilot_lib.py, count_chain.c, vendor/boolsys.py]
        role: chained S_3 builder, curve library, Boolean enumerator E2
      s4_builder:
        path: experiments/EXP-SEMBIN-7e1371/code/eq4sys.py
        role: S_4 builder from which s5_builder.py forms S_5 = Res_X(S_3(x1,x2,X), S_4(x3,x4,z,X)) (IDEA notes G2)
      wdsat:
        path: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/builds/wdsat_987b7f5ef9
        role: vendored WDSat source; per-file hashes in wdsat_source_sha256.txt; compiled per size class with the
          pilot's counters and symfull patches
      paper_instances:
        path: inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/
        files: [Xn15l5, Xn17l6, Xn19l6]
        role: instrument gate G0 (m=3, config -b)
      new:
      - path: experiments/EXP-SATIC-f50f16/implementation/run.py
        role: trial driver (not written)
      - path: experiments/EXP-SATIC-f50f16/implementation/check.py
        role: independent checker (not written)
      - path: experiments/EXP-SATIC-f50f16/implementation/s5_builder.py
        role: Stage 0 direct S_5 Boolean builder with the E3 group-law brute-force check (not written)
    curves:
      koblitz: 'y^2+xy=x^3+a x^2+1, a in {0,1}, one per n'
      ordinary: 'y^2+xy=x^3+x^2+b, #E = 2q, q prime (pilot pick_curve rule), one per n'
      source: design memo
    factor_base: 'V = {deg < l} (polynomial basis); V design is out of scope (IDEA prior_art KR-IC-73db3f)'
    cells:
      source: design memo (Stage 1 ladder); the IDEA notes section 4 matrix is larger and is recorded under
        out_of_scope as open
      gate_G0:
      - {family: trimoska_S4, m: 3, n: 15, l: 5, config: b}
      - {family: trimoska_S4, m: 3, n: 17, l: 6, config: b}
      - {family: trimoska_S4, m: 3, n: 19, l: 6, config: b}
      chained_S3:
      - {m: 3, l: 4, n: 13}
      - {m: 3, l: 5, n: 17}
      - {m: 3, l: 6, n: 19}
      - {m: 4, l: 3, n: [13, 17]}
      - {m: 4, l: 4, n: [15, 17, 19]}
      - {m: 4, l: 5, n: [17, 19]}
      - {m: 5, l: 2, n: [11, 13]}
      - {m: 5, l: 3, n: [13, 17]}
      - {m: 5, l: 4, n: 17, note: only if the per-instance limit allows; censored otherwise}
      direct_S5:
      - {m: 4, l: 3, n: [13, 17], condition: s5_builder passes its E3 check}
      - {m: 4, l: 4, n: [15, 17], condition: s5_builder passes its E3 check}
      n_assignment_note: 'the memo lists the n sets per m; the exact (n, l) pairing above is the designer''s reading of
        it and is confirmed at approval'
    instances_per_cell:
      unsat: '>= 20 certified UNSAT (E1 and E2 agree); SAT instances recorded separately, never fitted'
      null: '>= 10 shape-matched random Boolean systems (same monomial support, random coefficients) per chained
        cell, UNSAT w.h.p. checked by E2-style count, unpruned configs only'
      control: CryptoMiniSat 5 on the same ANF->CNF-XOR model, 10 instances per cell where available
    configurations:
      xg: '-x (Gaussian elimination, branching on all variables), unpruned'
      xg_symfull: 'complete symmetry pruning on the m x-blocks then plain branching on the u variables (pilot
        patch); the pruned complete configuration on chains'
      b: '-b -m 3 -l l without -x; the paper''s configuration, used on the paper instances (G0) and, where complete
        (direct S_5), as the pruned configuration'
      stock_b_on_chains: recorded with completeness flag incomplete; never fitted; never counted as UNSAT
      cms: CryptoMiniSat 5 (control; impediment recorded if absent on host)
    per_instance_limits:
      wall_s: 600
      memory_gb: 2
      rule: a censored row is reported as censored and excluded from fits; the stated bias is that censoring favours
        low alpha
  controls:
  - id: G0
    name: instrument gate on the paper instances
    check: 'alpha on Xn15l5, Xn17l6, Xn19l6 under -b within 3.0 +- 0.05 and ratio median/(2^{3l}/3!) in [0.95,1.1],
      >= 4 UNSAT each'
    role: the solver build reproduces the object and law the harvest was fitted on; a failed gate invalidates the
      run
    provenance: IDEA notes G1 (pilot value 2.981, ratios 1.006-1.023, exploratory)
  - id: C1
    name: completeness gate per configuration
    check: on every UNSAT-labelled instance the fitted configuration answers UNSAT; every SAT answer carries a model
      that, mapped back to an x-tuple, is verified on the curve
    role: stock -b on chained m >= 4 fails this by construction and is recorded incomplete, never fitted
    provenance: IDEA notes G5; pilot README (status unknown rows)
  - id: C2
    name: enumerator agreement
    check: E1 (curve-level root solving) and E2 (Boolean count) labels agree on every instance; for direct S_5, E3
      (group-law brute force over unordered 4-subsets) agrees with the descended system on the builder check
    role: labels are ground truth only when both agree; a disagreement voids the instance and is logged
    provenance: IDEA notes G2, G4
  - id: C3
    name: support-matched random null
    check: null alpha (unpruned) within 0.3 of the structured unpruned alpha at the same m (P5)
    role: separates backdoor size from curve structure (RQ-SATIC-1ae57a mandatory null object)
    provenance: IDEA prediction 5
  - id: C4
    name: presentation pair
    check: '|alpha(direct S_5) - alpha(chained S_3)| <= 0.3 at m=4 under pruned complete configs (P4, H2); evaluated
      only if the direct arm ran'
    role: presentation as an independent variable
    provenance: IDEA prediction 4
  - id: C5
    name: generic-solver control
    check: CryptoMiniSat alpha reported by slope only beside WDSat at the same cells (10 instances per cell)
    role: separates the model property from the solver brand (RQ-SATIC-1ae57a decision target b)
    provenance: IDEA minimal_test controls
  - id: C6
    name: curve-family pair
    check: Koblitz vs ordinary median conflicts at fixed (m,l) reported side by side (H3, descriptive)
    role: n- and family-independence of c
    provenance: IDEA heuristic H3
  independent_variables:
  - m in {3, 4, 5}
  - l (and n) per the cell list
  - presentation in {chained_S3, direct_S5, trimoska_S4 (gate)}
  - configuration in {xg, xg_symfull, b, cms}
  - family in {S3 curve system, NULL support-matched, TRIMOSKA_S4}
  - curve family in {koblitz, ordinary}
  metrics:
    primary:
    - name: alpha per (m, presentation, config)
      pointer: '/fits[] in fit.json with group, alpha, ci_low, ci_high, a, rows, cells; derived from /rows[] of
        raw-result.json with label == UNSAT, censored == false, complete == true, grouped by (m, presentation,
        config), least squares on log2(median conflicts) vs l, 2000 seeded bootstrap resamples'
      prediction: P1, P2
    - name: ratio median/(2^{ml}/m!) per cell
      pointer: '/cells[]/median_conflicts divided by 2^(m*l)/m!, per (cell, config)'
      prediction: P3
    - name: gate alpha and ratio
      pointer: '/fits[group == trimoska_S4|m3|b] and the three /cells[] ratios'
      prediction: G0
    secondary:
    - name: nodes and fails
      pointer: '/rows[]/nodes, /rows[]/fails (nodes == conflicts and fails == conflicts + 1 on UNSAT rows, pilot
        patch)'
      prediction: none (descriptive)
    - name: wall per row with pinned solver sha
      pointer: '/rows[]/wall_s with /rows[]/solver_sha'
      prediction: none (secondary; hardware-dependent)
    - name: SAT-instance costs
      pointer: '/rows[] with label == SAT, listed per cell, never fitted'
      prediction: none
    - name: null alpha
      pointer: '/fits[] with family == NULL'
      prediction: P5
    - name: CryptoMiniSat alpha
      pointer: '/fits[] with config == cms'
      prediction: C5 (slope only)
    - name: local slopes
      pointer: 'consecutive-l slopes per (m, presentation, config) from /cells[]/median_conflicts'
      prediction: IDEA falsification condition 3 (fall > 0.5 across the ladder)
    - name: presentation difference at m=4
      pointer: '/fits[direct_S5|m4|pruned]/alpha minus /fits[chained_S3|m4|xg_symfull]/alpha'
      prediction: P4
    - name: S_5 builder record
      pointer: '/builder: monomials, boolean_degree, build_time_s per l, e3_check_passed'
      prediction: none (Stage 0 fact or impediment)
  preregistered_predictions:
  - id: P1
    claim: H_enum at m=4
    test: 'alpha(m=4), pruned complete config, each presentation, in [3.7, 4.1] with CI half-width <= 0.15'
    source: IDEA-20261017-4b1672 prediction 1
  - id: P2
    claim: H_enum at m=5
    test: 'alpha(m=5), pruned complete config, in [4.6, 5.1]'
    source: IDEA-20261017-4b1672 prediction 2
  - id: P3
    claim: H1
    test: 'median conf / (2^{ml}/m!) in [0.5, 2] pruned; >= 8 unpruned'
    source: IDEA-20261017-4b1672 prediction 3
  - id: P4
    claim: H2
    test: '|alpha(direct) - alpha(chained)| <= 0.3 at the same m, pruned'
    source: IDEA-20261017-4b1672 prediction 4 (memo wrote 0.5; idea wins)
  - id: P5
    claim: tree-size law, not curve structure
    test: alpha of the support-matched random null, unpruned, within 0.3 of the structured unpruned alpha
    source: IDEA-20261017-4b1672 prediction 5
  - id: G0
    claim: instrument gate
    test: 'alpha within 3.0 +- 0.05 and ratio in [0.95, 1.1] on the paper instances under -b'
    source: IDEA-20261017-4b1672 notes G1 (memo wrote within 5%; idea wins)
  preregistered_prediction:
    quantity: alpha(m, presentation, config) with 95% bootstrap CI; per-cell ratio to 2^{ml}/m!
    formula: 'log2 c = a + alpha*l with alpha = m; c ~ C(2^l+m-1, m) ~ 2^{ml}/m! under complete symmetry pruning'
    source: IDEA-20261017-4b1672 claim and heuristic H1 (lex-ordered m-tuples; Trimoska Prop. 1 backdoor)
  heuristic_under_test: H1
  heuristic_validation:
    heuristic: >-
      H1 (verbatim from IDEA-20261017-4b1672): Complete pruned WDSat UNSAT conflicts ~ C(2^l+m-1,m) ~ 2^{ml}/m!,
      within [0.5,2]x per cell. Quantifiers as tested: for every complete cell (m in {3,4,5}, l per the ladder, each
      curve family) the median over >= 20 certified UNSAT instances of the pruned complete configuration lies within
      [0.5, 2] of 2^{ml}/m!.
    source: IDEA-20261017-4b1672
    rigorous_support: lex-ordered m-tuples counted exactly by C(2^l+m-1,m); imitates exhaustive-enumerator tree size
      (Trimoska Prop. 1 backdoor)
    operationalization: WDSat conf (branch points opened) per UNSAT instance under xg_symfull on chains and -b on the
      direct presentation; medians per cell; alpha by least squares across l
    what_is_uniform: nothing is assumed uniform; the comparison objects are the exact count C(2^l+m-1,m) and the
      support-matched random null
    scale_access: toy scale only (n <= 19 on the curve cells, l <= 5); no correspondence reaches a larger scale and
      no transfer is claimed
    sample_size_justification: >-
      >= 20 certified UNSAT per cell (IDEA minimal_test); conflict counts are deterministic per instance, so the
      spread is across targets only; the pilot's per-cell rmse was 0.02-0.12 bits on 10 instances (exploratory
      provenance). Three l values per m give a slope over a window, not a law (IDEA confounder 1); the local slopes
      are the check.
    comparison_metric: per-cell ratio median/(2^{ml}/m!) against [0.5, 2]; alpha against [m-0.3, m+0.1]
      (IDEA notes decision table row 1) and against the thresholds m-1 and m/2-1
    tail_checks_available: per-cell max/median <= 1.5 (H1 validation plan); every censored row listed; local slopes
      per consecutive l pair
    controls_for_heuristic: G0, C1-C6 above; the null is the synthetic control of the same shape
  scale_relevance:
    tier: toy
    justification: 'n in 11..19 on curve cells, l <= 5; nothing at n = 131; the per-attempt threshold alpha < m/2-1 is
      a program criterion, not an end-to-end claim (IDEA notes section 1)'
    correspondence: null
  tail_checks:
  - per-cell max/median of conflicts reported beside the median
  - every censored row listed with its cell, config and limit hit
  - local slopes between consecutive l values reported per group
  - SAT-instance conflict lists reported per cell
  replication:
    seeds: []
    seed_rule: to be fixed in the trial plan (one seed per trial; fit bootstrap seed recorded in fit.json)
    independent_instances: 4
    trials:
    - trial_id: gate-and-m3
      run_id: RUN-SATIC-62fe76
      content: G0 + chained m=3 + nulls
    - trial_id: chained-m4
      run_id: RUN-SATIC-7d069a
      content: chained m=4, all configs + null
    - trial_id: chained-m5
      run_id: RUN-SATIC-dd8dde
      content: chained m=5
    - trial_id: direct-s5-m4
      run_id: RUN-SATIC-f86d22
      content: Stage 0 builder check + direct S_5 m=4; impediment path recorded if the builder fails its check
    replication_note: two curves per n (Koblitz and ordinary) are the within-cell replication; conflict counts are
      deterministic, so no determinism replicate is planned beyond G0
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 28800
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
    note: 'machine protection only: one solver process; 600 s and 2 GB per instance (censoring, not a result);
      watchdog 8 h per trial; about 15 CPU hours expected (design memo); not a research budget'
  stopping_rules:
  - Stop a trial when every cell of its plan has >= 20 certified UNSAT instances run under each planned
    configuration, or its target stream is exhausted with fewer (reported as a short cell, never relaxed).
  - A row exceeding 600 s or 2 GB is censored and recorded; the cell continues; censored rows are excluded from
    fits and listed.
  - The m=5 l=4 cell and the direct S_5 arm run only under their stated conditions; a builder failure is an
    impediment record, not a result.
  - Stop after the four planned trials have checker-validated outputs; no fifth run without a protocol amendment
    and a new approval.
  - A crash, timeout or memory kill is failed_infrastructure or censoring; never a metric value (AGENTS.md rule 5).
  invalidation_rules:
  - gate G0 outside its window (alpha outside 3.0 +- 0.05 or ratio outside [0.95, 1.1]); the run set is
    completed_invalid, no fit is published
  - model-check failure (a fitted configuration answers UNSAT on a SAT-labelled instance, or returns a SAT model
    that fails verification on the curve); the run is completed_invalid
  - enumerator disagreement (E1 vs E2, or E3 vs the descended system on the builder check) on any instance that
    entered a fit; the run is completed_invalid
  - a fitted row from a configuration flagged incomplete; the fit is invalid
  - check.py exits 3 (fit re-derivation mismatch, re-labelling disagreement on its sample of >= 5 instances per
    cell, gate mismatch); the run is invalid
  success_criterion: >-
    SUPPORT (scoped to the tested cells, configurations, presentations and the vendored solver build): G0 passes;
    P1, P2 and P3 hold on every complete cell with >= 20 UNSAT instances; no such cell shows an alpha CI upper bound
    below m-1; C1 and C2 pass on every fitted row; check.py exits 0 on all four runs.
  falsification_criterion: >-
    FALSIFY: any complete (uncensored) cell with >= 20 UNSAT instances at two or more l values shows an alpha CI
    upper bound below m-1 on a checker-valid run with G0, C1 and C2 passing; this refutes H_enum and H_ideal there
    and routes to replication at larger n, never to a claim. An alpha CI upper bound below m/2-1 anywhere is in
    addition an escalation to RQ-RELN-001 (IDEA falsification condition 2), with no claim in this record.
  inconclusive_criterion: >-
    INCONCLUSIVE: fewer than two l values completed per m at m >= 4; or the local slope falls by more than 0.5
    across the ladder (the power law is a small-l artefact, IDEA falsification condition 3). A checker-invalid run
    is not evidence; timeouts and memory kills are censoring or failed_infrastructure.
  heuristic_criterion: >-
    P3 pass on every complete pruned cell leaves H1 validated at toy scale (ratio in [0.5, 2], max/median <= 1.5);
    a complete pruned cell outside [0.5, 2] weakens H1 at that cell only. P4 pass leaves H2 validated for the
    pruned configs at m=4 (only if the direct arm ran); P4 fail weakens H2 only. H3 is descriptive here. None of
    these bears on the Groebner Assumption 1 of RQ-SEMBIN-fa2e3f (different mechanism, IDEA prior_art
    KR-IC-889857).
  decision_impact:
    on_positive: >-
      H-SATIC-5c526c may move to analyzed and, after independent review including a blind re-derivation of the fits
      from rows[] and an independent re-labelling sample, to supported at the tested scope. The reading recorded is
      that complete pruned DPLL is an exhaustive S_m-quotient enumerator at m = 3, 4, 5 on these cells (IDEA notes
      decision table row 1), which closes the DPLL per-attempt route at the tested cells for GOAL-ICPERF-e6b6a4 and
      routes relation-collection work away from SAT as the instrument; no cost record or frontier row gains a
      speedup.
    on_negative: >-
      Instrument before theory: G0, C1 and C2 are re-examined and the run goes to independent review first. On a
      checker-valid falsifying cell H-SATIC-5c526c is weakened at most (a single unreplicated run never supports
      reject_scoped); the next dispatch is a replication contract at larger n and l on that cell, checked against
      E3 and the null before anything else; a CI upper bound below m/2-1 is escalated to RQ-RELN-001 as a question,
      not a claim.
  interpretation_limits:
  - DPLL per-attempt cost only; Groebner exponent, relation yield, linear algebra and the rho baseline are not
    measured (IDEA interpretation limits; RQ-SATIC-1ae57a constraints)
  - no speedup is measured or claimed; every reference point (alpha = m, m-1, the MITM 2.32) is above the
    per-attempt threshold m/2-1 (IDEA notes section 1)
  - nothing at n = 131 and nothing about the security of any deployed curve
  - 3-4 l values per m give a slope over a window, not a law; local slopes are reported
  - WDSat conf counts branch points, not CDCL conflicts; cross-solver comparison is by slope only
  - wall time is secondary, hardware-dependent and carries the pinned solver sha; conflict counts are the
    reproducible figures
  - stock -b on chained m >= 4 is incomplete and is never fitted; the symfull patch is the pilot's, not the paper's
  - the direct S_5 arm exists only if the Stage 0 builder passes its E3 check; its absence is an impediment, not
    evidence against the presentation
  - censoring favours low alpha (stated bias); censored rows are listed, never imputed
  - the m4-sat-cost pilot is exploratory provenance for the predictions and the gate window, never evidence
  - check.py will be producer-written; independent review precedes any status move
  required_artifacts:
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-62fe76/manifest.yaml
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-62fe76/raw-result.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-62fe76/fit.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-62fe76/anf-samples/
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-7d069a/manifest.yaml
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-7d069a/raw-result.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-7d069a/fit.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-7d069a/anf-samples/
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-dd8dde/manifest.yaml
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-dd8dde/raw-result.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-dd8dde/fit.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-dd8dde/anf-samples/
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-f86d22/manifest.yaml
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-f86d22/raw-result.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-f86d22/fit.json
  - experiments/EXP-SATIC-f50f16/runs/RUN-SATIC-f86d22/anf-samples/
  artifact_schema:
    raw_result: 'satic.alpha_exponent.result.v1: experiment_id, hypothesis_id, trial_id, run_id, seed, environment
      (host, compiler, solver_sha, cms_available), builder (monomials, boolean_degree, build_time_s per l,
      e3_check_passed; direct arm only), cells[] (cell, m, n, l, presentation, family, curve_family, config,
      unsat_done, sat_done, censored, median_conflicts, max_over_median, ratio_to_law), rows[] one per (instance,
      config) with instance_id, cell, m, n, l, presentation (chained_S3|direct_S5|trimoska_S4), family
      (S3|NULL|TRIMOSKA_S4), curve_family (koblitz|ordinary), config (xg|xg_symfull|b|cms), label, conflicts,
      nodes, fails, wall_s, censored, complete, model_verified, solver_sha, anf_sha256'
    fit_json: 'fits[] with group, family, m, presentation, config, cells, rows, a, alpha, ci_low, ci_high, rmse_bits,
