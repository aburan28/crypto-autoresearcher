experiment:
  id: EXP-ECDLP-815efc
  hypothesis_id: H-ECDLP-e32126
  question_id: RQ-JINV-8fc13a
  goal_id: null
  version: 1
  status: draft
  claim_tier: toy
  title: >-
    Graded Hilbert vector of the m = 3 Semaev relation ideal after quotienting
    the automorphism grading, special j against a matched random curve at the
    same p and the same N, with the first-fall degree measured first as a
    degeneracy gate and a planted-solution ladder that must move the total
    quotient dimension by exactly the planted count

  objective: >-
    Decide whether a special j-invariant, or a small CM discriminant, changes
    the graded solving structure of the m = 3 prime-field Semaev relation ideal
    relative to a matched random curve, after the zeta-grading carrying the
    automorphism discount has been quotiented out. Measure the null's first-fall
    degree FIRST, as a gate, because if it reads 2 no degree fall is available
    to any arm and the degree scalar is not a discriminator. NO EXPONENT IS
    CLAIMED AND NO SPEEDUP IS SOUGHT.

  independent_variables:
    - name: curve_class
      values: [matched_random_null, j_equals_0, j_equals_1728,
        artificial_grading_random_j, quadratic_twist, curve_free_graded_system]
    - name: cm_discriminant_size
      values: swept across the matched-order family
    - name: prime_p
      values: three toy primes up to about 2^32, declared before Stage 1

  inputs:
    m: 3
    monomial_order: frozen and hashed before Stage 2
    factor_base_construction: frozen and hashed before Stage 2
    graded_bound: declared before Stage 1
    committed_null_total_quotient_dimension_m3: 6
    committed_null_d_reg_m3: 2
    independent_groebner_implementation: required for the null

  metrics:
    primary:
      - name: graded_hilbert_vector
        unit: dimensions per degree (vector of dimensionless non-negative integers)
        definition: >-
          The dimension over F_p of each graded piece of the quotient ring, for
          degree 0 up to the declared bound, computed in the frozen monomial
          order. Reported raw AND after quotienting the zeta-grading.
      - name: total_quotient_dimension
        unit: dimension (dimensionless non-negative integer)
        definition: >-
          The sum of the graded Hilbert vector, i.e. the degree of the
          zero-dimensional ideal. The committed null value at m = 3 is 6.
      - name: null_first_fall_degree
        unit: degree (dimensionless positive integer)
        definition: >-
          The smallest degree at which a non-Macaulay degree fall occurs, on the
          MATCHED RANDOM NULL only. Measured first and used as the degeneracy
          gate, never as a result.
    secondary:
      - name: graded_vector_difference_special_minus_null
        unit: dimensions per degree (vector of dimensionless integers)
        definition: >-
          Entrywise difference at matched p and matched N, after the
          zeta-grading quotient.
      - name: planted_solution_recovery
        unit: dimension (dimensionless integer)
        definition: >-
          The total quotient dimension after adjoining k extra known simple
          solutions, for k in {1, 2, 4, 8}.
      - name: permutation_p_value
        unit: dimensionless probability
        definition: >-
          Exact permutation distribution of any observed difference across the
          discriminant sweep.

  controls:
    - name: C-DEGENERACY-GATE
      kind: pre-registered instrument switch replacing a forced discriminator
      blocking: true
      description: >-
        STAGE 0, RUN BEFORE ANY SPECIAL-j CURVE IS READ. Measure the
        matched-random null's first-fall degree. The first-fall degree is at
        most the degree of regularity and at least 2 for a system of quadratics
        or higher, so if the null reads 2 then NO FALL OF AT LEAST ONE DEGREE
        IS AVAILABLE TO ANY ARM and the source proposal's degree discriminator
        is forced to zero by the floor rather than by the parameters. The
        committed evidence EV-REP-002 records d_reg = 2 at m = 3 for both
        well-formulated arms, so this is the expected case. THE SWITCH IS
        PRE-REGISTERED HERE, NOT CHOSEN AFTER THE DATA: if the null first-fall
        degree is 2, the degree scalar is declared degenerate and the primary
        statistic is the graded Hilbert vector, which the same committed
        evidence shows taking the values 2, 6, 10 and 34 across arms in this
        lane and therefore has demonstrated range. The threshold is NOT
        loosened; the statistic is replaced.
    - name: C-NULL-MATCHED-RANDOM
      kind: matched null
      blocking: true
      description: >-
        A random ordinary curve with generic discriminant and |Aut| = 2 at the
        SAME p and the SAME N. Every special-j number is a difference from this
        arm and is never reported alone.
    - name: C-INDEPENDENT-REIMPLEMENTATION
      kind: instrument agreement gate
      blocking: true
      description: >-
        The null's graded Hilbert vector and total quotient dimension are
        reproduced by an INDEPENDENT Groebner implementation before any
        special-j curve is measured, and the total must equal 6 at m = 3 in
        agreement with EV-REP-002.
    - name: C-PLANTED-SOLUTION-LADDER
      kind: positive control with predicted magnitude
      blocking: true
      description: >-
        Plant a defect of known size. Adjoin k extra known simple solutions to
        the relation ideal, for k in {1, 2, 4, 8}. THE TOTAL QUOTIENT DIMENSION
        MUST READ EXACTLY 6 + k, namely 7, 8, 10 and 14. A meter that cannot
        resolve k = 1 cannot resolve the effect under test and every number in
        the run is void. This is the demonstrated-dynamic-range control that
        the retired degree meter never had.
    - name: C-ARTIFICIAL-GRADING
      kind: nearby-object control
      blocking: true
      description: >-
        A random-j curve carrying the SAME zeta-grading imposed artificially by
        a non-CM diagonal scaling. It has the symmetry but not the CM order, so
        a difference present here and absent on the true special-j curve
        localises the effect in the grading rather than in the CM structure.
    - name: C-CURVE-FREE-GRADED-SYSTEM
      kind: curve-free null, REQUIRED, consequence pre-stated
      blocking: true
      description: >-
        A random polynomial system with the same degree sequence, the same
        variable count and the same artificially imposed zeta-grading, built
        from no curve and carrying no group law, put through the identical
        graded Hilbert computation. PRE-STATED CONSEQUENCE: a diagonal torus
        action grades ANY polynomial ideal, so if this arm reproduces the
        special-j graded signature then the finding is about diagonally graded
        polynomial systems and NOT about CM curves, special j, or the ECDLP,
        and the evidence record must say so in its inference field.
    - name: C-TWIST
      kind: matched-discriminant control
      blocking: false
      description: >-
        A quadratic twist at the same CM discriminant but a different instance,
        so a discriminant-size trend cannot be an instance artifact.
    - name: C-ORDER-FREEZE
      kind: instrument freeze
      blocking: true
      description: >-
        The monomial order, the factor-base construction and the graded bound
        are hashed before Stage 2 and asserted identical across every arm. They
        move graded dimensions more than any plausible special-j effect.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The entrywise difference between the graded-quotient Hilbert vector of a
      special-j curve and that of a matched random curve at the same p and the
      same N.
    formula: >-
      Zero in every entry, with both totals equal to 6 at m = 3.
    source: >-
      EV-REP-002 records vdim = 6 equal to 3 factorial at m = 3 for the
      well-formulated arm; the null expectation of no residual is the
      hypothesis's H-null, and the automorphism contribution is removed by the
      zeta-grading quotient before the comparison.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE PRIMARY STATISTIC WAS FIXED.
    (1) THE SOURCE PROPOSAL'S DISCRIMINATOR IS FORCED BY ALGEBRA AND HAS BEEN
    REPLACED, NOT LOOSENED. The proposal replaces a saturated degree-of-
    regularity meter with a first-fall-degree meter and pre-registers an
    H-crack signature of "a fall of at least one degree". But d_ff is at most
    d_reg, and d_ff is at least 2 for a system of quadratics or higher. The
    committed evidence EV-REP-002, read in full by the coordinating session,
    records d_reg = 2 at m = 3 across d in {4, 6, 8} for both well-formulated
    arms. If the null therefore reads d_ff = 2, a fall of one degree would
    require d_ff = 1, which does not exist. THE DISCRIMINATOR CANNOT FIRE, AND
    IT IS FORCED BY THE FLOOR RATHER THAN BY THE PARAMETER CHOICE, SO NO
    PARAMETER CHANGE INSIDE THE DECLARED GRID REPAIRS IT.
    (2) THE COMPUTED REPLACEMENT HAS DEMONSTRATED RANGE IN THIS VERY LANE. The
    graded Hilbert vector and its total are not floor-limited: EV-REP-001
    records vdim = 2 at m = 2 for the well-formulated arms and vdim growing
    from 10 to 34 for the W_native_x arm, and EV-REP-002 records vdim = 6 at
    m = 3. The statistic therefore demonstrably moves across arms in this lane,
    which is exactly what the retired scalar does not do.
    (3) A DEFECT OF KNOWN SIZE MUST FIRE AT THE PREDICTED MAGNITUDE. Adjoining
    k extra simple solutions to a zero-dimensional radical ideal raises its
    degree by exactly k, so the ladder at k in {1, 2, 4, 8} has forced readings
    7, 8, 10 and 14 against a null of 6. The smallest planted effect, k = 1, is
    a 17 percent change in the total and is resolvable exactly, since these are
    integers with no noise.
    (4) THE SOURCE'S CHARACTERISATION OF THE EVIDENCE IS WRONG IN ONE RESPECT
    AND THE CORRECTION IS RECORDED RATHER THAN ABSORBED. The proposal states
    the meter reads flat "in every arm". EV-REP-001 records a third arm,
    W_native_x, whose d_reg grows from 4 to 12 and whose vdim grows from 10 to
    34. The meter has range; what is flat is the comparison between the two
    well-formulated arms.
    (5) A CURVE-FREE OBJECT REPRODUCES THE GRADING, SO A CURVE-FREE NULL IS
    BLOCKING. The zeta-grading is a diagonal torus action and grades any
    polynomial ideal, with no curve, no CM order and no group law needed. The
    curve-free arm is therefore run as a blocking control with its consequence
    written in advance.
    (6) SCOPE OF THE COMMITTED EVIDENCE, DECLARED. EV-REP-001 and EV-REP-002
    answer the CURVE MODEL question, Weierstrass against twisted Edwards. They
    contain no special-j measurement, so this experiment imports from them only
    the floor argument and the null's expected total dimension, and Stage 0
    re-measures both rather than assuming them.

  scale_relevance:
    tier: toy
    justification: >-
      Toy primes up to about 2^32 with prime N, m = 3, exact Groebner
      computation. Transfer assumption, stated and NOT discharged: that
      toy-size graded behaviour persists at larger systems. Three primes
      minimum, with the drift across them reported. No cryptographic-scale
      statement is available and none is offered.
    correspondence: null

  tail_checks:
    - >-
      Report the largest single graded-piece difference across the sweep
      individually, against the exact permutation distribution, rather than
      only the summed difference. A single anomalous graded piece is the shape
      a genuine effect would take first.
    - >-
      Report the discriminant-size regression residuals with the twist control
      overlaid, so a trend that is an instance artifact is visible.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 30

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 30
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 runs first. If the null's first-fall degree is 2, the degree
      discriminator is recorded as degenerate and the graded Hilbert vector
      becomes the primary statistic, per C-DEGENERACY-GATE.
    - If C-INDEPENDENT-REIMPLEMENTATION disagrees, stop before Stage 2.
    - If C-PLANTED-SOLUTION-LADDER fails at k = 1, stop.
    - >-
      If a Groebner computation exceeds its per-run budget, stop that cell and
      record budget_exhausted. Under AGENTS.md rule 5 that is an infrastructure
      outcome and never evidence about special j.
    - >-
      If a graded-quotient difference survives the artificial-grading and
      curve-free controls, STOP and request independent review before any
      record states an algebraic advantage.

  invalidation_rules:
    - Any graded vector computed under a monomial order whose hash differs from
      the frozen one.
    - Any special-j vector reported without its matched-random pair at the same
      p and the same N.
    - Any first-fall degree reported as a RESULT rather than as the Stage 0 gate.
    - Any difference reported without its exact permutation distribution.
    - Any comparison that pools the raw and the graded-quotient vectors.

  success_criterion: >-
    Stage 0 completes and records the null's first-fall degree; the independent
    reimplementation agrees on the null; the planted-solution ladder reads 7, 8,
    10 and 14 exactly; and the graded-quotient Hilbert vectors of the j = 0 and
    j = 1728 arms, the artificial-grading arm, the twist arm and the curve-free
    arm are all reported entrywise against the matched-random null across the
    discriminant sweep, with exact permutation distributions for any difference.

  falsification_criterion: >-
    The null hypothesis of H-ECDLP-e32126 is falsified if any entry of the
    graded-quotient Hilbert vector differs between a special-j curve and its
    matched-random null, surviving both the artificial-grading control and the
    curve-free control, with an exact permutation p-value below 0.01. The
    instrument is void if the independent reimplementation disagrees, if the
    planted ladder fails at k = 1, or if the null's total quotient dimension is
    not 6. THE CURVE-BOUND READING is falsified, without falsifying the
    arithmetic, if the curve-free graded system reproduces the same signature.

  required_artifacts:
    - the frozen monomial order, factor-base construction and graded bound,
      with their hashes, recorded before Stage 2
    - the Stage 0 null first-fall degree and the recorded degeneracy decision
    - per curve, the raw and graded-quotient Hilbert vectors and their totals
    - the independent reimplementation's null output, for comparison
    - the planted-solution ladder results at k in {1, 2, 4, 8}
    - the artificial-grading control output
    - the curve-free graded system output
    - the twist control output and the discriminant-size regression
    - exact permutation distributions for every reported difference
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      A NON-CURVE OBJECT CAN REPRODUCE THE SIGNATURE AND THE CONTRACT SAYS SO
      IN ADVANCE. A zeta-grading is a diagonal torus action on a polynomial
      ring and needs no curve. The curve-free arm is blocking so that a graded
      difference cannot be reported as a statement about CM curves unless that
      arm behaves differently.
    - >-
      UNTESTABLE HERE, STATED PLAINLY. Whether any graded difference has a cost
      consequence is not testable by this contract: prime-field ECDLP has no
      known subexponential index calculus, so no relation-system structure
      measured here maps to an exponent. A measured difference would be a
      structural finding and a test to run, never a speedup.
    - >-
      THE DEGREE SCALAR IS RETIRED AS A DISCRIMINATOR, WITH THE REASON
      RECORDED. It is at its floor on the null, so it cannot fall. It is
      retained only as the Stage 0 gate, and the graded Hilbert vector replaces
      it as the primary statistic. No threshold was widened to achieve this.
    - >-
      EV-REP-001 and EV-REP-002 answer the curve-model question and contain no
      special-j measurement. This contract imports only the floor argument and
      the expected null total from them, and Stage 0 re-measures both.
    - >-
      Any advantage at or below the square-root-of-|Aut| automorphism discount
      is baseline calibration, not a finding, and is recorded as such.
    - >-
      Scope: m = 3, three toy primes up to about 2^32, one frozen monomial
      order and factor-base construction, prime N. Nothing transfers to other
      m, other orders, other constructions, or cryptographic parameters.

  assigned_to: executor
  approved_by: null
