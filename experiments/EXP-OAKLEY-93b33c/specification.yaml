# EXP-OAKLEY-93b33c
# Integer checks of the written q^4 price. No solver.
# Approved by DEC-20261001-3c8a8c.
experiment:
  id: EXP-OAKLEY-93b33c
  hypothesis_id: H-OAKLEY-c2e7b7
  source_idea: IDEA-20260922-af7396
  question_id: RQ-OAKLEY-264353
  version: 1
  title: Integer crossovers of the written q^4 price
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-3c8a8c
  objective: >-
    Compare 2^{4p} with 24 * 2^{40} and with 24 * 2^{48} for p from 11
    through 14. Reject the crossovers 11 and 13. Place the model totals
    5 * 2^{5p-1} at p = 31 and p = 37 between the named powers of two.
  inputs:
    factorial_4: 24
    factorial_5: 120
    ratio: 5
    caps: [40, 48]
    probe_p: [11, 12, 13, 14]
    predicted:
      exceeds_40_at_11: false
      first_p_above_40: 12
      exceeds_48_at_13: false
      first_p_above_48: 14
      log2_24_above_4_5: true
      log2_24_below_4_6: true
    totals:
      - {p: 31, above: [152, 156], below: 157}
      - {p: 37, above: [183, 186], below: 187}
    rejected_crossovers: [11, 13]
  controls:
    - >-
      p = 11 does not satisfy 2^{44} > 24 * 2^{40}. Reporting that it
      does invalidates the run.
    - >-
      p = 13 does not satisfy 2^{52} > 24 * 2^{48}. Reporting that it
      does invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - cap in {40, 48}
    - route in {bit_shift, integer_multiply}
  metrics:
    primary:
      - first_p_above_40
      - first_p_above_48
      - exceeds_40_at_11
      - exceeds_48_at_13
      - total_brackets
      - implementations_agree
    secondary:
      - factorial_4
      - factorial_5
      - log2_24_bounds
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two first-clearing values, two failed neighbors, and two total brackets.
    formula: >-
      2^{4p} > 24 * 2^{cap}. The model total is 5 * 2^{5p-1}.
      log2(24) > 4.5 because 24^2 > 2^9, and log2(24) < 4.6 because
      24^5 < 2^{23}.
    source: >-
      IDEA-20260922-af7396 claim paragraphs C and D, read 2026-10-01.
      The inequalities were checked by integer shift in this design
      session. That computation is not a run. No solver was launched.
      The proposal writes the crossovers 11 and 13. Those two fail the
      strict inequality, and this contract rejects them.
  scale_relevance:
    tier: toy
    justification: Integer comparisons. No transfer to a measured SAT runtime.
    correspondence: null
  tail_checks:
    - p = 14 is required. Stopping at p = 13 and still reporting the 48-cap crossover is invalid.
  replication:
    seeds: []
    independent_instances: 4
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If either rejected crossover is reported as clearing its cap, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - exceeds_40_at_11 is true.
    - exceeds_48_at_13 is true.
    - A WDSat run, a Groebner basis, or an Oakley discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, 4! is 24, 5! is 120, the ratio is 5, p = 11 fails
    the 40-cap and the first success is p = 12, p = 13 fails the 48-cap
    and the first success is p = 14, 24^2 exceeds 2^9, 24^5 is below
    2^{23}, and both totals lie strictly between the named powers of two.
  falsification_criterion: >-
    The runs agree, both rejected crossovers stay false, and any
    factorial, first clearing p, log bound, or total comparison differs
    from the preregistered table.
  required_artifacts:
    - experiments/EXP-OAKLEY-93b33c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-OAKLEY-93b33c/runs/<RUN-ID>/command.txt
    - experiments/EXP-OAKLEY-93b33c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-OAKLEY-93b33c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-OAKLEY-93b33c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-OAKLEY-93b33c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - WDSat conflict counts and any Groebner measurement of K_5.
    - A closure claim for either Oakley group.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
