experiment:
  id: EXP-EC-CODE-002
  title: Target-aware multiplication-map support ranking across toy elliptic curves
  status: proposed
  parent: EXP-EC-CODE-001
  goal: >-
    Test whether algebraic multiplication-map features derived from elliptic
    evaluation codes can rank partial factor-base supports by their probability of
    extending to a valid target decomposition, without evaluating the full support
    determinant or using discrete-log labels.
  hypothesis: >-
    For some coordinate-defined factor bases, target-aware features built from
    shortened Riemann--Roch evaluation spaces and their Schur/multiplication maps
    contain support-specific information beyond dimensions alone, and this signal
    generalizes across independent toy curves.
  unit_of_prediction: >-
    A partial support S of size 1 or 2 for a fixed fresh target R. Label 1 iff S is
    contained in at least one valid 3-point decomposition of R over the factor base.
  forbidden_features:
    - full 3-support determinant or rank
    - direct group addition completing the candidate support
    - scalar/discrete-log information
    - features derived from whether a candidate is already known to be a relation
  candidate_features:
    - shortened-space dimension and Schur-square dimension as negative controls
    - rank change when the target evaluation coordinate is appended to multiplication-map images
    - nullity/intersection dimensions of shortened-space Schur products against target-punctured images
    - counts of low-codimension product-space dependencies involving the target coordinate
    - canonical RREF pivot-pattern summaries over F_p
  evaluation:
    curves: at least 8 independently selected prime-order toy curves over 10-12 bit primes
    factor_bases_per_curve: 3
    targets_per_base: 16
    base_sizes: [24, 32, 40]
    partial_support_sizes: [1, 2]
    metrics:
      - ROC-AUC per curve and pooled
      - precision_at_k where k equals the true-positive count
      - enrichment over random ranking
      - feature stability across coordinate basis changes in L(4O)
      - wall-clock feature cost per partial support
    validation_split: leave-one-curve-out
  controls:
    - random linear codes matched for length and dimension
    - arbitrary random syndromes not lying on the elliptic evaluation image
    - coordinate-only factor bases with frozen selection rules
    - independent fresh targets, never targets constructed from selected base points
    - random invertible basis changes of the Riemann--Roch function basis
  success_gate: >-
    At least one non-forbidden feature family yields reproducible enrichment over
    random ranking on held-out curves, survives basis-change controls, and costs
    asymptotically less than simply checking every full 3-support determinant.
  failure_gate: >-
    Reject the lane if all non-oracle feature families collapse to constants,
    lose signal under basis changes, fail held-out-curve validation, or require
    materializing an object comparable in size to the full source-support tensor.
  output_contract:
    - per_curve_metrics.json
    - pooled_metrics.json
    - feature_costs.json
    - failure_analysis.md
  claim_boundary: >-
    Even a positive ranking signal is not an ECDLP speedup. It becomes algorithmic
    evidence only after an end-to-end relation-generation experiment shows lower
    fully charged work per new independent relation than exhaustive support search.
  created_at: '2026-09-07'
