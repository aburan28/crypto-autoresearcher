execution_report:
  experiment_id: EXP-FB3-001
  experiment_version: 1
  amendment_id: EXP-FB3-001-AMD-001
  hypothesis_id: H-FB3-001
  question_id: RQ-FB3-001
  task_id: TASK-20260724-228
  role: executor
  implementation_commit: e18c9bc0b90e3031cfa28483fe5571c0fb548dfb
  implementation_commit_note: >-
    HEAD at run time, recorded in every run manifest as code.commit with
    dirty_tree true. The implementation, run records, and reports in this
    experiment directory were untracked at run time; they become durable only
    through the Coordinator's snapshot commit (TASK-20260724-230). The executor
    ran no git write command.
  git_dirty_tree_at_run_time: true

  inference:
    requested_policy: executor-terra
    resolved_model: claude-opus-5
    reasoning_effort: unspecified
    fallback_used: true
    fallback_reason: >-
      orchestration/model-policies.yaml routes the executor to a GPT-5.6 Terra
      alias that this Claude-family harness cannot resolve (CLAUDE.md model
      policy note).

  runs:
    completed:
      - id: RUN-FB3-001-CTRL
        purpose: counter verification, conservation controls, machinery controls, H016/H017 port fidelity
        validity: valid
        wall_clock_seconds: 1.99
        peak_memory_mb: 139.0
      - id: RUN-FB3-001-N14
        purpose: exact six-geometry battery at N ~ 2^14
        validity: valid
        wall_clock_seconds: 6.629
        peak_memory_mb: 87.8
      - id: RUN-FB3-001-N16
        purpose: exact six-geometry battery at N ~ 2^16
        validity: valid
        wall_clock_seconds: 24.6
        peak_memory_mb: 137.4
      - id: RUN-FB3-001-N18
        purpose: exact six-geometry battery at N ~ 2^18
        validity: valid
        wall_clock_seconds: 140.11
        peak_memory_mb: 230.6
      - id: RUN-FB3-001-FAMILY
        purpose: Holm family correction, bootstrap CIs, growth slopes, prior-cell accounting, analytic-arm checks
        validity: valid
        wall_clock_seconds: 2.081
        peak_memory_mb: 74.7
    invalid: []
    failed: []
    certificate_discipline:
      all_runs_certificate_kind: none
      reason: >-
        Pure measurement runs. This experiment counts decompositions of every
        target and claims no discrete-log solve and no factor-base relation, so
        there is nothing to certify; kind is stated explicitly rather than left
        blank (docs/claims-and-verification.md).

  cell_terminal_states:
    pre_registered_family:
      definition: >-
        6 pre-registered geometries x 3 sizes x 4 curves x 4 replicate seeds =
        288 cell records; the 8-cell Holm family per size is those 6 geometries
        plus the 2 prior (H016/H017) recorded cells.
      measured: 288
      infeasible: 0
      invalid: 0
      per_geometry:
        high_bit_interval: {measured: 48, infeasible: 0, invalid: 0, evaluation_domain: whole_group}
        small_height: {measured: 48, infeasible: 0, invalid: 0, evaluation_domain: whole_group}
        mixed_two_base: {measured: 48, infeasible: 0, invalid: 0, evaluation_domain: whole_group, typing: "two from x-interval sub-base, one from small-multiples sub-base (primary)"}
        coset_union: {measured: 48, infeasible: 0, invalid: 0, evaluation_domain: whole_group}
        greedy_optimized: {measured: 48, infeasible: 0, invalid: 0, evaluation_domain: held_out_half}
        asymmetric_sizing: {measured: 48, infeasible: 0, invalid: 0, evaluation_domain: whole_group, typed_split: "(8,1,1) primary; full ladder (1,1,1),(2,1,1),(4,1,1),(8,1,1) reported"}
      prior_cells:
        prior_H016_qr_base:
          state_at_2_14: prior_recorded_cell (2 recorded curves, sampled protocol)
          state_at_2_16: censored_not_recorded_at_this_size
          state_at_2_18: censored_not_recorded_at_this_size
          also_recorded_at: 2^17 (2 curves, outside the growth-arm sizes)
        prior_H017_small_multiples:
          state_at_2_14: prior_recorded_cell (2 recorded curves, sampled protocol)
          state_at_2_16: censored_not_recorded_at_this_size
          state_at_2_18: censored_not_recorded_at_this_size
          also_recorded_at: 2^17 (2 curves, outside the growth-arm sizes)
    non_family_measured_arms:
      mixed_two_base__secondary_typing: {measured: 48, note: "the reverse typing of cell 3, reported per the amendment; not a family slot"}
    exploratory_arms:
      qr_walk_H016: {measured: 44, infeasible: 4, reason_for_infeasible: "deterministic r-adding walk cycled after 22 of 47 points on 2^14 curve 1; the walk is keyed to the curve seed, so all four replicate seeds fail identically"}
      small_multiples_H017: {measured: 48, infeasible: 0}
      symmetric_convention/high_bit_interval: {measured: 48, infeasible: 0}
      symmetric_convention/small_height: {measured: 48, infeasible: 0}
      symmetric_convention/coset_union: {measured: 48, infeasible: 0}
      symmetric_convention/matched_random: {measured: 48, infeasible: 0}
    permutation_null:
      shared_null_records: 48
      draws_per_record: 200
      frozen_minimum: 100
      shared: true
      sharing_scope: >-
        one untyped matched-random set per (curve, N, seed, B), shared by all
        untyped cells and used, restricted to the greedy training and held-out
        masks, for the greedy cell; recorded as shared in every size run's
        shared_null_records block. Typed patterns draw their own matched sub-base
        nulls (200 per pattern per record).

  controls:
    - id: closed_form_total
      description: exact sum_r count(r) equals the closed form of the cell's typing pattern
      scope: every structured, null, and exploratory cell in the three size runs
      checks: 67784
      failures: 0
      verdict: pass
    - id: counter_verification_brute_force
      description: full per-target count-vector equality against literal enumeration
      scope: 46 cases (N in {211,307,401,503,1009}, B in {5,8,13,20}, adversarial additive bases, typed_111 and typed_1_2)
      assertions: 148
      failures: 0
      verdict: pass
    - id: independent_recount
      description: primary integer counter vs direct multiset enumeration and vs the FFT route
      scope: 43 cells per size run (all structured cells plus the first 5 null draws per label)
      failures: 0
      verdict: pass
    - id: fft_rounding_margin
      description: max abs(value - round(value)) in the FFT route
      worst_observed: 5.4569682106375694e-12
      safety_threshold: 0.25
      verdict: pass
    - id: curve_order_and_dlog_table
      description: >-
        character-sum order cross-checked by an independent route (N prime, N in
        Hasse interval, N*G = O by double-and-add, enumeration closes at N,
        (N-1)/2 distinct x, x/y pairing, bijective log table, 20 seeded spot
        checks by double-and-add)
      curves_verified: 12
      failures: 0
      verdict: pass
    - id: greedy_incremental_sumset_and_leakage
      description: >-
        incremental Sigma_2/Sigma_3 bitsets vs brute-force recomputation,
        internal tallies vs brute force, first-step gain provably maximal,
        selection function structurally has no access to the held-out mask
      verdict: pass
    - id: height_computation_equivalence
      description: enumerated minimum over representations vs continued-fraction convergents, all x in [0,p) for p = 16381
      disagreements: 0
      verdict: pass
    - id: h017_log_space_claim
      description: dedup-by-x of x(jG), j = 1..2B equals {1,...,B} on a real curve
      verdict: pass
    - id: port_fidelity_h016_h017
      description: >-
        recorded curve orders recomputed exactly; recorded theory mean equals
        C(B+2,3)/N; recorded ratios, bands, and totals re-derived; recorded
        p-value convention identified exactly as 2*min(tail)/n; recorded sampled
        means inside reconstructed sampling bands
      cells: 4
      checks_per_cell: 17
      failures: 0
      verdict: pass
      qualification: >-
        The H016 QR base cannot be replayed bit-exactly (the recorded
        conventions do not pin the walk's RNG stream, index function, or start
        point). The comparison for that base is distributional; the H017 base is
        exactly determined and was reproduced exactly.
    - id: reproduction_from_recorded_command
      description: re-running the recorded command at the recorded revision
      scope: RUN-FB3-001-N14 (twice) and RUN-FB3-001-N18
      result: >-
        raw results bit-identical except 17 wall-clock fields per run (16 greedy
        selection_seconds plus the run timing block); every measured statistic,
        including all 200-draw null sets, identical. The third check re-ran N14
        from the recorded command line at the recorded revision as the final
        completion-gate check and matched the recorded raw result exactly.
      verdict: pass
    - id: matched_size_control
      description: every untyped geometry and its null use B = ceil((6N)^(1/3)); typed geometries use sub-base sizes summing to B
      verdict: pass
    - id: same_curve_same_target_pairing
      description: >-
        all geometries on a given (curve, seed) are counted over the same target
        space (the whole group) with the same null set, so comparisons are
        paired, not pooled
      verdict: pass

  budget:
    limits: {wall_clock_seconds: 7200, memory_gb: 6, maximum_runs: 12}
    used:
      run_wall_clock_seconds_total: 175.4
      auxiliary_wall_clock_seconds: 242.7
      auxiliary_breakdown:
        reproduction_check_N14_seconds: 7.9
        reproduction_check_N18_seconds: 155.4
        pre_run_smoke_and_timing_probes_seconds: 72.7
        final_reproduction_check_N14_seconds: 6.7
      total_wall_clock_seconds_including_auxiliary: 418.1
      peak_memory_mb: 230.6
      peak_memory_gb: 0.23
      runs_created: 5
    within_budget: true
    headroom: >-
      2.4% of the wall-clock budget and 3.8% of the memory budget were used; 5 of
      12 permitted runs. No dimension of the protocol was reduced to fit the
      budget and no run was truncated by a limit.
    censoring: >-
      One censoring only, and it is inherited rather than imposed: the two prior
      (H016/H017) cells were recorded at 2^14 and 2^17, so they contribute
      p-values to the 2^14 family and are marked
      censored_not_recorded_at_this_size at 2^16 and 2^18. Their family slots are
      retained so the Holm family size stays 8 at every size, which is
      conservative. No prior-cell statistic was extrapolated to a size at which
      it was not recorded, and no prior cell was re-run as a family cell (frozen
      amendment rule).

  protocol_deviations:
    - id: D1
      kind: measurement strengthening (inside the frozen contract)
      change: permutation null raised from the frozen minimum of 100 draws to 200
      reason: >-
        With 100 draws the smallest attainable p-value under the (r+1)/(n+1)
        convention is 1/101 = 0.0099, and 8 x 0.0099 = 0.079 > 0.05, so no cell
        could have been Holm-rejected at alpha = 0.05 regardless of the data. 200
        draws give a floor of 0.00498 and 8 x 0.00498 = 0.0398 < 0.05.
      effect_on_criteria: none; the amendment specifies ">= 100"
    - id: D2
      kind: control generalisation
      change: >-
        the closed-form total control was applied with the closed form of each
        cell's own typing pattern; for the mixed_two_base (1,2) pattern that is
        B1*C(B2+1,2) rather than the handoff's B1*B2*B3, which applies to the
        three-sub-base typed pattern
      reason: the (1,2) pattern has two sub-bases, so B1*B2*B3 is not defined for it
      effect_on_criteria: none; the (1,2) closed form is itself verified against brute force in RUN-FB3-001-CTRL block A
    - id: D3
      kind: inherited censoring (recorded, not imposed)
      change: prior cells present only at 2^14; censored at 2^16 and 2^18 with the family slot retained
      reason: the recorded H016/H017 data exist at 2^14 and 2^17 only
      effect_on_criteria: conservative (family size stays 8)
    - id: D4
      kind: fidelity limitation
      change: >-
        the H016 QR geometry is reconstructed as a same-family r-adding walk, not
        replayed; it appears only in the exploratory section
      reason: the recorded conventions do not pin the walk's RNG stream, index function, or start point
      effect_on_criteria: none; it is not a pre-registered cell
    - id: D5
      kind: added derived run
      change: RUN-FB3-001-FAMILY performs no measurement and aggregates the immutable size runs
      reason: the family table, Holm correction, growth slopes, and analytic-arm checks are machine-generated rather than hand-copied
      effect_on_criteria: none
    - id: D6
      kind: operational pinning of prose definitions
      change: >-
        the frozen contract states several quantities in prose; the executor
        pinned them before execution and recorded them in FROZEN inside every
        run's raw-result.json (size window, seed derivation, concentration
        statistic, p-value convention, height enumeration schedule, coset
        ordering, greedy split rule, ladder rounding, mixed primary typing,
        asymmetric element choice, typed-cell family control)
      reason: the definitions had to be operational to be executable at all
      effect_on_criteria: >-
        Two pinnings shape how a cell reads and are called out in
        implementation/implementation.md: (a) the family control for typed cells
        is the untyped matched-random base of the same TOTAL size B, which is the
        frozen wording "matched random base, same size" and the comparison
        consequence (iv) of the analytic arm is about, so both typed cells show a
        typing deficit on the family metric while showing exactly 1.000000
        against a same-typing control (both are reported); (b) the
        asymmetric_sizing sub-bases are random elements, because the frozen
        definition pins only the sizes, which isolates the sizing question H004
        actually asks.
    - id: none_other
      change: >-
        no pre-registered cell was dropped, reordered, or added; no geometry
        variant outside the frozen list entered the family; no stopping rule was
        triggered by an outcome; no result was re-run until favourable (the three
        reproduction checks are byte-comparisons of already-recorded runs and are
        reported above).

  observations:
    - >-
      Primary metric (exact mean-yield ratio over all N targets): the three
      untyped geometries (high_bit_interval, small_height, coset_union) sit at
      exactly 1.000000 at 2^14, 2^16 and 2^18, with zero-width bootstrap CIs and
      point-mass permutation nulls. Growth slope exactly 0.
    - >-
      Three cells have a mean-yield ratio away from 1 and all three are
      DEFICITS: mixed_two_base 0.3726/0.3700/0.3749, asymmetric_sizing
      0.0342/0.0418/0.0420 (both against the untyped same-total-size control,
      matching the closed-form typing penalty to three decimals), and
      greedy_optimized 0.9554/0.9717/0.9806 on its held-out half. No cell at any
      size exceeds 1 on the primary metric.
    - >-
      Holm across the 8-cell family rejects 4 cells at 2^14 (mixed_two_base,
      asymmetric_sizing, greedy_optimized, prior H017) and 3 at 2^16 and 2^18,
      all at p_holm = 0.0398 (0.0495 for the prior cell), and every rejection is
      in the deficit direction.
    - >-
      Secondary metric (exact coverage): mixed_two_base 0.498 and
      asymmetric_sizing 0.066 at 2^18 are large deficits; high_bit_interval and
      small_height are within 0.11% of the null at every size with per-size
      permutation p between 0.33 and 0.66.
    - >-
      The only above-1 numbers anywhere in the battery are two sub-1% coverage
      excesses at 2^18: greedy_optimized +0.30% (family-wise CI excludes 1 at all
      three sizes, per-cell permutation p 0.28-0.47, slope NEGATIVE with CI
      [-0.00196, -0.00037], i.e. decaying with N) and coset_union +0.12%
      (per-size family-wise CI contains 1 at every size, per-size p 0.39-0.77,
      marginally positive slope CI [8.6e-5, 0.00226]).
    - >-
      Greedy transfer: training coverage ratio 1.0887/1.0590/1.0394 versus
      held-out 1.0077/1.0065/1.0030, transfer gap 0.0544/0.0346/0.0235. The
      training-half gain is real and largely does not transfer, and both the gain
      and the gap shrink with N.
    - >-
      Asymmetric ladder: typed/untyped total falls monotonically
      0.2166 -> 0.1812 -> 0.1042 -> 0.0420 from the balanced split to (8,1,1) at
      2^18. No rung dominates the balanced rung; every rung's same-split control
      ratio is exactly 1.000000.
    - >-
      Analytic arm: consequence (i) CONFIRMED (maximum deviation of the exact
      mean from C(B+2,3)/N is exactly 0.0 over 144 untyped cells; 67784/67784
      closed-form total checks pass), (ii) CONFIRMED (all untyped slopes exactly
      0), (iii) CONFIRMED (0 violations of coverage <= min(1, mean) over 336
      cells and the equality condition holds everywhere), (iv) CONFIRMED with the
      asymptotic constants recovered (balanced typing penalty 4.82x/4.69x/4.62x
      approaching 4.5x; mixed (1,2) ratio 0.3749 versus the predicted 0.375).
    - >-
      Exploratory exact recomputation of the prior geometries: QR base mean-yield
      ratio exactly 1.000000 with a ~1% coverage deficit; H017 small-multiples
      base mean-yield ratio exactly 1.000000 with coverage ratio
      0.0126/0.0051/0.0021 and concentration ratio 188/480/1224.
    - >-
      Symmetric-convention arm (D union -D): the conservation identity holds in
      every cell with the effective base size B' (= 2B when no two base elements
      are mutual negatives), the exact mean rises about 8x, coverage saturates at
      0.9997, and structured and random arms agree exactly whenever B' agrees.
    - >-
      Port fidelity: all four recorded H016/H017 curve orders recomputed exactly;
      the recorded harness's own theory mean is the conservation constant
      C(B+2,3)/N; the recorded p-value convention is exactly 2*min(tail)/n; the
      recorded 800-target sampled means all lie inside reconstructed sampling
      bands, including the H017 cell whose recorded sampled ratio was 1.7895 on
      one curve and 0.0000 on another while its exact mean-yield ratio is
      identically 1.

  anomalies:
    - id: A1
      observation: >-
        108 of 144 untyped whole-group cells have a float mean-yield ratio
        differing from 1.0 by at most 4.44e-16 (2 ULP).
      investigation: >-
        Traced to IEEE-754 rounding: the null mean is formed by averaging 200
        identical float64 values before the division. The underlying integer
        totals are identical in all 144 cells and the integer closed-form control
        passes everywhere, so the exact measurement deviation is zero.
      classification: not a measurement effect; reported for completeness
    - id: A2
      observation: >-
        4 of 48 exploratory qr_walk_H016 records are infeasible (walk cycled at
        22 of 47 points on 2^14 curve 1, identically for all four replicate
        seeds).
      investigation: >-
        The walk is keyed to the curve seed, so replicate seeds share it; cycling
        is the standard failure mode of a deterministic additive walk. The
        recorded H016 file carries an attempts field, suggesting the original
        harness retried. No retry was added, because changing an arm after seeing
        its outcome is not permitted. Exploratory only; no pre-registered cell
        affected.
      classification: recorded infeasibility in an exploratory arm
    - id: A3
      observation: >-
        greedy_optimized coverage: the family-wise bootstrap CI excludes 1 at
        every size while the per-cell permutation p-value is 0.28-0.47.
      investigation: >-
        Not a contradiction. The permutation test asks whether one cell is
        extreme against its own 200 matched-random draws (about 1 null SD); the
        bootstrap CI asks whether the MEAN ratio over 16 replicates differs from
        1, and the same small excess recurs in nearly every replicate. Both are
        reported, and the effect fails the frozen growth clause in either
        reading because its slope is negative.
      classification: statistical-resolution note, not an inconsistency
    - id: A4
      observation: >-
        coset_union subgroup order d varies from 4 to 107 across curves
        (d = 4 at 2^18 curve 1 gives 59 tiny cosets).
      investigation: >-
        This is the frozen definition ("largest divisor of p-1 that is <= B")
        behaving as written on curves whose p-1 has no divisor near B; on such
        curves the base degenerates toward a pseudorandom set. Recorded per cell
        rather than repaired, because repairing it would mean changing a frozen
        geometry.
      classification: frozen-definition degeneracy, recorded
    - id: A5
      observation: >-
        mixed_two_base and asymmetric_sizing are Holm-rejected on the primary
        metric, yet show exactly 1.000000 against a same-typing control.
      investigation: >-
        Both facts follow from the conservation identity: the rejection is the
        deterministic typed-versus-untyped size penalty of the frozen "same
        size" control, and the same-typing ratio is forced to 1. Reported in
        both forms so the control choice is visible and cannot be mistaken for
        an element-geometry effect.
      classification: control-choice artefact, fully accounted for

  verdict_against_frozen_criteria:
    success_criterion_met: false
    n_geometries_meeting_success_criterion: 0
    of_geometries: 6
    basis: >-
      No geometry has a yield ratio above 1 at any size, so no geometry can have
      a growth slope "in the alive direction"; the three cells with CI-excluding
      effects are deficits and the three untyped cells are pinned at exactly 1
      with zero-width CIs. Under the secondary coverage metric (which the
      criterion does not name) no geometry satisfies both the CI clause and the
      growth clause either.
    falsification_criterion_clauses:
      all_within_bands_at_every_N: >-
        satisfied for high_bit_interval, small_height, coset_union (exactly at
        the null value on the primary metric, and inside the permutation band on
        coverage at every size); not satisfied literally for the three cells with
        deficits.
      every_nonzero_effect_constant_across_N: >-
        not satisfied literally: the three deficits vary with N. Each variation
        is predicted in closed form by the pre-registered analytic arm and is the
        integer arithmetic of matched sizing, not a mechanism.
      substance: >-
        No geometry produced any advantage at any size on the primary metric, and
        the single sub-1% advantage anywhere in the battery (greedy held-out
        coverage) decays with N. The family-wise correction is reported.
    executor_position: >-
      Observation only. The Coordinator owns the transition; this report does not
      declare the hypothesis supported, weakened, rejected, or closed, and does
      not change any status.

  boundaries:
    - Toy scale only: N ~ 2^14, 2^16, 2^18 (field_bits 14-18). Claim tier `toy`; no statement about medium or cryptographic curves is supported or intended.
    - Measures decomposition YIELD and COVERAGE, not the cost of FINDING a decomposition. A null result closes the yield channel of the F3 family on the tested scope, not the solving channel where the index-calculus cost sits.
    - Discrete logs of factor-base points are known BY CONSTRUCTION for measurement only. No cost, speedup, or attack claim is derived from them, and no step of this experiment is a step of an attack.
    - The greedy_optimized base is SELECTED using the full discrete-log table, so that construction is unavailable to an attacker by definition; its measurement is an oracle-aided upper bound, not an attack ingredient.
    - Convention-bound: m = 3, unsigned multisets, whole-group targets, matched size B = ceil((6N)^(1/3)). The symmetric-convention arm shows the conservation constant changes with the convention while the identity's form does not. Other m, signed conventions, weighted counting, and restricted target sets are untested.
    - 4 generated curves per size (12 total), prime group order, short Weierstrass, generated from recorded seeds; results are scoped to this instance-generation method.
    - Replicate axis: 4 curves x 4 seeds, but the deterministic geometries do not vary with the replicate seed (only the null estimate and the seeded arms do), so the 16-replicate bootstrap is partly pseudo-replicated. A curve-cluster bootstrap over the 4 true independent instances is reported alongside every primary CI in RUN-FB3-001-FAMILY.
    - Prior H016/H017 cells enter the family as SAMPLED statistics from the recorded protocol (800 targets), not as exact counts, and only at 2^14; they are censored at 2^16 and 2^18.
    - The H016 QR geometry is not bit-exactly reproducible from the recorded conventions; its exploratory arm is a same-family reconstruction and 4 of its 48 records are infeasible.
    - Negative-result phrasing: no improvement meeting the predefined threshold was observed over the tested instances, parameters, counting convention, and resource budget.

