experiment:
  id: EXP-ECDLP-fe11f2
  hypothesis_id: H-ECDLP-ec338e
  question_id: RQ-MAYO-001
  goal_id: null
  version: 1
  status: draft
  claim_tier: toy
  title: >-
    Exact degree-4 Macaulay rank of the MAYO whipped system against a uniform
    random null and a planted-isotropy null at four toy cells, with degree 3
    demoted from discriminator to forced-value instrument check because at that
    degree the rank equals the row count in every arm by algebra

  objective: >-
    Measure, as exact integers over F_16, the degree-4 Macaulay rank of a
    MAYO-shaped whipped system against two matched nulls, and measure the
    solving degree and field-operation count of the flat system against its
    bilinear (U, G) remodelling. Decide whether the whipped structure removes
    usable equations relative to a random system, whether any such excess is
    attributable to whipping rather than to a planted isotropic subspace, and
    whether the remodelling wins or loses against its own generic bigraded
    bound. NO FORGERY, NO ATTACK, NO STATEMENT ABOUT PUBLISHED MAYO PARAMETERS.
    NO ELLIPTIC CURVE APPEARS IN THIS EXPERIMENT.

  independent_variables:
    - name: cell
      values:
        - "(q,n,m,o,k) = (16,10,6,2,3)"
        - "(q,n,m,o,k) = (16,10,6,2,5)"
        - "(q,n,m,o,k) = (16,12,8,3,4)"
        - "(q,n,m,o,k) = (16,12,8,3,6)"
    - name: arm
      values: [whipped, uniform_random, planted_isotropy, independent_keys, k_equals_1]
    - name: macaulay_degree
      values: [3, 4]

  inputs:
    field: F_16
    variables_N_per_cell: [30, 50, 48, 72]
    equations_m_per_cell: [6, 6, 8, 8]
    degree_3_rows_per_cell: [180, 300, 384, 576]
    degree_3_columns_per_cell: [4960, 22100, 19600, 64824]
    degree_4_rows_per_cell: [2790, 7650, 9408, 21024]
    generic_degree_4_koszul_deficit_per_cell: [15, 15, 28, 28]
    seeds_per_cell_per_arm: 20
    linear_algebra: exact over F_16, no floating point

  metrics:
    primary:
      - name: degree_4_macaulay_rank
        unit: rank (dimensionless non-negative integer)
        definition: >-
          The exact F_16-rank of the degree-4 Macaulay matrix, reported per
          cell, per arm, per seed, as an integer with no averaging.
      - name: degree_4_excess_deficit
        unit: number of dependencies (dimensionless non-negative integer)
        definition: >-
          rows minus rank minus C(m,2), i.e. the count of dependencies beyond
          the generic Koszul relations. Both the whipped and the null values
          are computed in this same unit and subtracted only after both are
          integers from the same formula.
      - name: measured_solving_degree
        unit: degree (dimensionless positive integer)
        definition: >-
          The first degree at which the system is solved, reported separately
          for the flat whipped arm and the bilinear (U, G) remodelling.
      - name: field_operations_to_solution
        unit: F_16 multiplications (dimensionless count)
        definition: >-
          Counted by instrumenting the arithmetic, not inferred from wall
          clock. Reported for the flat and the remodelled arm at matched hybrid
          fixing so both sides of every ratio are in the same unit.
    secondary:
      - name: degree_3_macaulay_rank
        unit: rank (dimensionless non-negative integer)
        definition: >-
          Instrument check only. See C-DEG3-FORCED.
      - name: seed_dispersion_of_rank
        unit: number of distinct rank values observed over 20 seeds
        definition: >-
          Predicted to be 1 in every arm. Any value above 1 is itself the
          finding and is reported before any deficit is interpreted.
      - name: peak_memory_gb
        unit: gigabytes
        definition: Budget accounting only.

  controls:
    - name: C-NULL-RANDOM
      kind: matched structureless null, PRIMARY, run first
      blocking: true
      description: >-
        A uniformly random sequence of m quadratic forms in kn variables over
        F_16, at identical (kn, m, q, D). Every structured number is reported as
        a deviation from this arm.
    - name: C-NULL-PLANTED-ISOTROPY
      kind: second matched null, separates cause
      blocking: true
      description: >-
        A random sequence of m quadratics in kn variables constructed to vanish
        on a random ko-dimensional subspace, so it carries the same isotropy as
        the whipped system but no emulsifier structure. This separates a deficit
        caused by whipping from a deficit caused by having a large totally
        isotropic subspace. If it reproduces the whipped excess deficit, the
        result is a controlled null and must be reported as one.
    - name: C-DEG3-FORCED
      kind: forced-value instrument check REPLACING a degenerate discriminator
      blocking: true
      description: >-
        AT DEGREE 3 THE DISCRIMINATOR CANNOT FIRE AND IS NOT USED AS ONE. A
        generic quadratic sequence has no linear syzygies, so the degree-3
        Macaulay rank equals the row count m times N exactly, namely 180, 300,
        384 and 576 at the four cells, against 4960, 22100, 19600 and 64824
        columns. Both arms are therefore forced to the same integer and the
        ratio is forced to 1 by algebra, not by parameters. The source
        proposal's "strictly lower at degree 3, by at least 1 percent at k = 3"
        band is unreachable there. IT IS NOT WIDENED. Degree 3 is retained as a
        forced-value check that every arm returns its exact row count, and the
        discriminator is MOVED to degree 4, where the generic deficit is exactly
        C(m,2) and the excess has room to move. A whipped degree-3 rank below
        its row count is a LINEAR SYZYGY of the whipped system and is reported
        under that name as a separate and stronger finding.
    - name: C-K1-ZERO
      kind: forced-zero baseline
      blocking: true
      description: >-
        At k = 1 the whipped system is the underlying UOV system and its
        degree-4 excess deficit against the planted-isotropy null must be
        EXACTLY 0 on every seed. A nonzero excess at k = 1 is a bug and voids
        every other number in the run.
    - name: C-INDEPENDENT-KEYS
      kind: nearby-object control with pre-stated consequence
      blocking: true
      description: >-
        A whipped system built from k independent underlying keys, one per
        block. The claimed cause of the deficit is key reuse, so the excess
        deficit must be 0 here. A nonzero excess means the mechanism is
        misidentified and no whipped number may be interpreted.
    - name: C-PLANTED-DEPENDENCY-LADDER
      kind: positive control with predicted magnitude
      blocking: true
      description: >-
        Plant a defect of known size. Into a uniformly random arm, inject
        j explicit linear combinations that force j additional degree-4
        dependencies, for j in {1, 4, 16, 64}. THE MEASURED EXCESS DEFICIT MUST
        EQUAL j EXACTLY, on every seed. This establishes that the instrument
        has dynamic range at the exact magnitudes the whipped claim lives at,
        and it fails the run if a planted excess of 1 cannot be resolved.
    - name: C-BILINEAR-GENERIC-REFERENCE
      kind: matched reference for claim (B)
      blocking: true
      description: >-
        A uniformly random bilinear system of the same bidegree (1,1) in
        (k^2, kn) variables with m equations, solved by the identical routine.
        Its measured solving degree is the reference the remodelled whipped arm
        is compared against. A remodelled degree below this reference means the
        whipped structure helps beyond bilinearity; a degree equal to it means
        the remodelling is exactly generic and buys nothing beyond the
        substitution.
    - name: C-SEED-EXACTNESS
      kind: dispersion check replacing an over-modelled noise band
      blocking: true
      description: >-
        20 seeds per cell per arm, with the number of DISTINCT rank integers
        reported. At 2790 by 40920 and larger, a uniformly random sequence over
        F_16 has a deterministic Macaulay rank in these degrees, so the
        predicted dispersion is exactly 1. The source proposal's 1-percent
        significance rule against a seed-noise band over-models a noise floor
        that is not there; the replacement rule is exact integer equality
        across seeds, and any dispersion above 1 is reported as an instrument
        finding before any deficit is read.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The degree-4 excess deficit of the whipped arm above the generic Koszul
      count C(m,2), per cell, as an exact integer, and its monotonicity in k.
    formula: >-
      excess(cell) = rows - rank_whipped - C(m,2), with rows equal to
      m times C(N+1,2) and C(m,2) equal to 15, 15, 28 and 28. Predicted
      excess greater than or equal to 1 at k = 3, strictly increasing across
      the k = 3 to k = 5 pair and across the k = 4 to k = 6 pair, and exactly 0
      at k = 1 and on the independent-keys arm.
    source: >-
      The Koszul deficit C(m,2) is the syzygy count of a regular quadratic
      sequence in degree 4 and is a theorem, not a fit. The excess is the
      quantity the emulsifier counting argument in H-ECDLP-ec338e's mechanism
      predicts and it is what this experiment measures.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE ANY BAND WAS FIXED.
    (1) THE SOURCE PROPOSAL'S PRIMARY DISCRIMINATOR IS FORCED AND HAS BEEN
    REPAIRED WITH A COMPUTED REPLACEMENT, NOT A LOOSENED THRESHOLD. At degree 3
    the Macaulay matrix has m times N rows and C(N+2,3) columns, namely 180 by
    4960, 300 by 22100, 384 by 19600 and 576 by 64824. A generic quadratic
    sequence has no linear syzygies, so the rank equals the row count in EVERY
    arm and the ratio to the random null is identically 1. No parameter choice
    inside the declared grid changes this: it is forced by the fact that the
    first syzygies of a quadratic sequence appear in degree 4. The repair is to
    move the discriminator to degree 4 and to keep degree 3 as a forced-value
    check.
    (2) THE REPAIRED BAND CAN MOVE, AND THE ALTERNATIVE IS COMPUTABLE. At
    degree 4 the generic deficit is exactly C(m,2), which is 15, 15, 28 and 28,
    against row counts 2790, 7650, 9408 and 21024. The excess deficit is an
    integer in the range 0 to a few thousand, the null value is exactly 0, and
    the source proposal's target of about 1 percent corresponds to 28, 77, 94
    and 210 additional dependencies at the four cells. Both a null answer and
    the claimed answer are representable, and the planted-dependency ladder
    demonstrates the instrument resolves an excess as small as 1.
    (3) THE NOISE BAND WAS DELETED, NOT WIDENED, BECAUSE IT DOES NOT EXIST. The
    source proposal reserves a seed-noise band and a 1-percent significance
    rule. At these dimensions the Macaulay rank of a random sequence over F_16
    is deterministic, so the correct rule is exact integer equality and the
    replacement control C-SEED-EXACTNESS measures the realised dispersion
    rather than assuming a band.
    (4) CLAIM (B)'s DIRECTION WAS INVERTED ON COMPUTED GROUNDS. The generic
    bigraded degree-of-regularity bound for a bilinear system of bidegree (1,1)
    in (k^2, kn) variables is min(k^2, kn) + 1, which is k^2 + 1 at every
    declared cell since kn is 30, 50, 48 and 72 and k^2 is 9, 25, 16 and 36.
    That gives 10, 26, 17 and 37 against the flat determined-system value
    m + 1, which is 7, 7, 9 and 9. THE GENERIC BOUND ALREADY PREDICTS THE
    REMODELLING LOSES AT EVERY DECLARED CELL. The prediction recorded here is
    therefore the computed one and not the source proposal's; a measured win
    would mean the whipped structure beats genericity, which is the informative
    outcome and is why the arm is still run.
    (5) FEASIBILITY, CHECKED RATHER THAN ASSUMED. The largest object is the
    k = 6 cell's degree-4 Macaulay matrix at 21024 rows by C(75,4) = 1150626
    columns over F_16. Stored densely at 4 bits per entry that is about
    1.2 times 10^10 nibbles, i.e. about 4.8 GB, which is inside the 8 GB
    contract only with a streaming or structured representation. The cell
    therefore carries its own go/no-go gate rather than being scheduled blind,
    and if it does not fit it is reported as infeasible under AGENTS.md rule 5
    and never as a null result.

  scale_relevance:
    tier: toy
    justification: >-
      Four toy cells over F_16 with kn between 30 and 72 and m between 6 and 8.
      The published MAYO parameter set has not been read by any agent in this
      program and no number from it appears here. Transfer assumption, stated
      and NOT discharged: that a trend in k at kn of 30 to 72 is qualitatively
      relevant at published dimensions. Nothing in this contract supports that
      assumption and no result may be extrapolated on it.
    correspondence: null

  tail_checks:
    - >-
      Report the minimum and maximum degree-4 rank observed across all 20 seeds
      per arm as integers. If the whipped rank is not strictly below the MINIMUM
      random rank observed, the claimed deficit lies inside the null's own
      realised range and must not be reported as a finding.
    - >-
      Report the worst single seed for the bilinear arm individually rather
      than averaging. Bilinear solving degrees are usually rigid; seed
      dependence indicates the instance is not in the generic regime and the
      bigraded prediction does not apply to it.

  replication:
    seeds: [1001, 1003, 1007, 1009, 1013, 1019, 1021, 1031, 1033, 1039, 1049,
            1051, 1061, 1063, 1069, 1087, 1091, 1093, 1097, 1103]
    independent_instances: 20

  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1

  stopping_rules:
    - >-
      If the k = 6 degree-4 cell exceeds the 8 GB memory contract, stop that
      cell and record resource_exhaustion. That is an infrastructure outcome
      under AGENTS.md rule 5 and is never evidence about MAYO or about the
      deficit.
    - If C-DEG3-FORCED fails on any arm, stop before any degree-4 run.
    - If C-K1-ZERO returns a nonzero excess, stop the entire run.
    - >-
      If C-PLANTED-DEPENDENCY-LADDER fails to recover j = 1 exactly, stop; the
      instrument cannot resolve the magnitude the claim lives at.

  invalidation_rules:
    - Any rank obtained by a non-exact or floating-point routine.
    - Any comparison between arms computed at different (kn, m, q, D).
    - >-
      Any operation-count comparison between the flat and remodelled arms taken
      at different hybrid fixings, which would charge the two sides of the ratio
      in different units.
    - >-
      Any seed dispersion above 1 that is averaged away rather than reported.
    - >-
      Any citation of a published MAYO number, which no agent in this program
      has read.

  success_criterion: >-
    C-DEG3-FORCED, C-K1-ZERO, C-INDEPENDENT-KEYS and
    C-PLANTED-DEPENDENCY-LADDER all pass; the degree-4 excess deficit is
    reported as an exact integer per cell, per arm, per seed, against both
    nulls; and the flat and remodelled solving degrees are reported with their
    field-operation counts at matched hybrid fixing. The criterion is the
    production of these integers, not any particular value of them.

  falsification_criterion: >-
    Claim (A) is falsified if the whipped degree-4 excess deficit is 0 at every
    cell and every seed, or if it equals the planted-isotropy null's excess at
    every cell, or if it fails to increase across either k pair. Claim (B) as
    restated in H-ECDLP-ec338e is falsified if the remodelled solving degree is
    strictly below the flat degree AND the operation count is also lower, at
    any cell. HEUR-001 is falsified if any uniformly random arm returns a
    degree-3 rank other than its row count or a degree-4 rank other than
    rows minus C(m,2).

  required_artifacts:
    - per cell, per arm, per seed, the exact degree-3 and degree-4 ranks
    - the excess-deficit integers with their formula inputs (rows, C(m,2))
    - the planted-dependency ladder results for j in {1, 4, 16, 64}
    - the k = 1 and independent-keys control outputs
    - flat and remodelled solving degrees with operation counts at matched
      hybrid fixing, and the fixing itself
    - the generic bilinear reference system's measured solving degree
    - the seed dispersion count per arm
    - peak memory and the k = 6 feasibility decision with its evidence
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      NO CURVE-FREE NULL ARM IS RUN, AND THAT IS A PROOF RATHER THAN AN
      OMISSION. Every object in this experiment is a system of quadratic forms
      over F_16; no elliptic curve, no group law and no ECDLP instance appears
      anywhere in it. The signature therefore cannot be misread as a statement
      about elliptic curves, because there is nothing curve-shaped to
      misattribute it to. The structureless null that this design does require,
      and runs, is the uniformly random MQ arm, and the structure-attribution
      null is the planted-isotropy arm.
    - >-
      UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether any measured
      deficit or remodelling gain persists at MAYO's published parameters is
      not testable here and is not testable by any contract this program can
      currently write: the published parameter set has not been read, and exact
      Macaulay rank at those dimensions is out of reach of exact linear algebra
      on this hardware. The deliverable is the shape of the deficit in k at toy
      dimensions and its separation from two nulls.
    - >-
      No forgery is claimed or attempted. No statement about MAYO's security
      level, in either direction, may be derived from this contract, including
      the defender-favourable reading of claim (A).
    - >-
      The bigraded bound used to invert claim (B)'s direction is RECALLED and
      unverified. A reviewer must open the source before the bound is quoted in
      any conclusion; if the bound differs, the inverted prediction must be
      recomputed and recorded as a protocol amendment rather than adjusted
      after the data.
    - >-
      Scope: F_16, four declared cells, degrees 3 and 4, exact linear algebra,
      one solver configuration. Nothing transfers to other q, other degrees,
      other MAYO variants, QR-UOV, SNOVA or plain UOV.

  assigned_to: executor
  approved_by: null
