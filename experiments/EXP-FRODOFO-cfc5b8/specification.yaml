experiment:
  id: EXP-FRODOFO-cfc5b8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-1418f4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-1418f4
  question_id: RQ-FRODO-3260cc
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Indicator-correlation measurement of decryption failures in matched unstructured and negacyclic
    toy encryptions at pinned marginal failure probability, with an independent-coin null and a ring-degree
    structural tell.
  objective: 'One uncertainty is reduced: how much of the joint structure of decryption failures is
    attributable to coordinate coupling, measured at matched marginals with the unstructured arm as
    the reference. (i) IS THE RIG CLEAN. Does the unstructured LWE arm, which is independent by construction,
    reproduce the independent-coin null''s correlation summaries within the resolution floor, and
    does its independence ratio equal one within its bootstrap interval? A failure here means the
    pipeline or the estimator induces correlation and every other number is void. (ii) HOW BIG IS
    THE COUPLING EFFECT. At pinned marginal and pinned coordinate count, what is the difference in
    mean absolute off-diagonal correlation and in top centered eigenvalue between the negacyclic and
    unstructured arms, and is the structured correlation well described as a function of cyclic offset
    alone? (iii) IS IT STRUCTURAL. Sweeping ring degree at fixed marginal, does the summary move?
    Per docs/inventor-protocol.md section 3, a summary that does not move when the parameter meant
    to change it moves is recorded as a controlled null. No hardness estimate is produced and no failure
    rate for any real scheme is claimed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: at the stated toy dimensions,
      ring degrees, marginal failure probability, sample budget and seeds, the negacyclic arm exhibited
      the measured off-diagonal correlation summaries and the unstructured arm the stated reference
      values, with the stated resolution floor and the stated marginal-match residual. WHAT DOES NOT
      FOLLOW: nothing about FrodoKEM or ML-KEM at real parameters, no failure rate for any deployed
      scheme, no statement that failures are exploitable, no hardness discount for structure, and
      no adversary cost of any kind. A measured correlation is a property of a joint distribution;
      converting it into a security statement requires a charged adversary that this design deliberately
      does not construct.'
  inputs:
    procedure: 'STAGE 0, build the shared noise core and the two coupling maps, with a bitwise check
      that the pre-coupling noise stream is identical between arms. Cost: implementation. STAGE 1,
      marginal pinning: threshold search per arm until per-coordinate failure probability matches
      within the frozen tolerance; report the residual. A failure halts the run. Cost: minutes. STAGE
      2, resolution-floor computation from marginal and budget, registered before sampling. Cost:
      none. STAGE 3, sampling: 2^22 ciphertexts per arm across at least 64 independent keys and at
      least 8 independent ring draws, accumulating indicator vectors. Cost: a few CPU-hours. STAGE
      4, estimation: correlation matrix, mean absolute off-diagonal, top centered eigenvalue, independence
      ratio, with bootstrap at both ciphertext and key level. Cost: under one CPU-hour. STAGE 5, independent-coin
      null at the achieved marginal, identical estimator, same invocation. Cost: minutes. STAGE 6,
      offset-function fit and residual. Cost: minutes. STAGE 7, ring-degree sweep at fixed marginal.
      Cost: a few CPU-hours. STAGE 8, monotonicity check of indicator versus underlying correlation
      at two marginals. STAGE 9, immutable run records via harness/runner.py.'
    instrument: Python 3 with numpy for the sampling and the O(n^2) accumulators, and a stdlib fallback
      path required to reproduce identical counts on a reduced budget and checked to do so; random.Random
      and numpy Generator with recorded disjoint seed streams; a hand-written bootstrap so that no
      library default silently chooses the resampling unit, since ciphertext-level and key-level bootstraps
      give different answers here and both are required. Negacyclic multiplication implemented directly
      as a circulant with sign flip, not via any polynomial library, so the two arms share every code
      path except that map. No Sage, no lattice estimator. Run manifests and resolved inference block
      via harness/runner.py; ids via tools/allocate_id.py.
    parameters: 'Coordinate counts n in {64, 128, 256}; ring degrees for the structured arm matching
      those n. Modulus q = 2^12, tabulated small-support noise with |z| <= 6. Target marginal per-coordinate
      failure probability 2^-6, pinned across arms to within a relative tolerance of 5 percent by
      threshold search; a secondary marginal at 2^-4 for the monotonicity check. Sample budget 2^22
      ciphertexts per arm, spread over 64 independent keys and 8 independent ring draws. Bootstrap:
      1000 resamples at ciphertext level and 1000 at key level, reported separately. Independent-coin
      null at the achieved marginal with the identical budget.'
  controls:
  - Independent-coin null at the matched marginal, with identical estimator and bootstrap, in the
    same invocation.
  - Unstructured LWE arm as the pipeline control, isolating pipeline-induced from coupling-induced
    correlation.
  - Marginal-match verification with a frozen tolerance, reported before any correlation is interpreted.
  - Shared pre-coupling noise stream verified bitwise identical between arms.
  - Ring-degree sweep as the structural tell, per inventor-protocol section 3.
  - Resolution-floor computation from the sample budget, registered before the run.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): An INDEPENDENT-COIN arm: indicator vectors generated directly by independent
    Bernoulli draws at the marginal measured in the signal arms, with the identical correlation estimator,
    the identical bootstrap and the identical summaries, run in the same invocation. The null must
    show mean absolute off-diagonal correlation consistent with zero at the resolution floor and an
    independence ratio of one. If the null shows a nonzero mean absolute off-diagonal correlation
    comparable to the structured arm''s, then the estimator is biased at this sample budget and no
    arm''s number means anything. A second null runs the unstructured LWE arm, which is theoretically
    independent by construction but passes through the entire encryption pipeline, so that the difference
    between it and the coin null isolates pipeline-induced correlation from coupling-induced correlation.'
  independent_variables:
  - 'arm: unstructured LWE, negacyclic, independent-coin null'
  - coordinate count n in {64, 128, 256}
  - ring degree, swept at fixed marginal
  - target marginal failure probability, 2^-6 and 2^-4
  - key and ring-element draw index
  metrics:
    primary:
    - mean absolute off-diagonal indicator correlation per arm with bootstrap intervals
    - top eigenvalue of the centered correlation matrix per arm
    - independence ratio per arm
    - residual of the cyclic-offset fit on the structured arm
    - correlation summary as a function of ring degree
    secondary:
    - achieved marginal and match residual per arm
    - resolution floor at the chosen budget
    - key-level versus ciphertext-level bootstrap width
    - spread of the structured summary across independent ring draws
    - monotonicity check outcome at two marginals
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The difference in mean absolute off-diagonal indicator correlation between the negacyclic
      and unstructured arms at pinned marginal, and the independence ratio on the unstructured arm.
    formula: 'Registered before the run: unstructured arm mean absolute off-diagonal correlation at
      most the resolution floor, where the floor equals 1 divided by the square root of the expected
      co-failure count per pair, that is sqrt(1/(S p^2)) for S ciphertexts and marginal p, giving
      about 0.008 at S = 2^22 and p = 2^-6; negacyclic arm mean absolute off-diagonal correlation
      at least 0.02, that is at least twice the floor; independence ratio on the unstructured arm
      equal to 1.0 within its bootstrap interval; cyclic-offset fit residual at most 0.25 of the structured
      arm''s total off-diagonal variance.'
    source: Pre-registered in the parent proposal IDEA-20260816-1418f4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at n in {64, 128, 256}, q = 2^12, marginal failure probability 2^-6, which
      is enormously larger than any real scheme''s failure rate and is chosen precisely so co-failures
      are observable within a feasible budget. TRANSFER ASSUMPTION, stated plainly and not assumed
      benign: the SIGN and the OFFSET-DEPENDENCE of the coupling correlation are expected to transfer
      because they follow from the circulant construction rather than from the marginal, while the
      MAGNITUDE certainly does not, since correlation of rare-event indicators depends strongly on
      the marginal. No number from this run may be quoted at any real failure rate, and any extrapolation
      of magnitude would be a fabrication.'
    correspondence: null
  tail_checks:
  - Report the expected co-failure count per pair, since off-diagonal estimates built on a handful
    of co-failures are noise regardless of the bootstrap.
  - Report the maximum rather than mean absolute off-diagonal correlation, since a single strongly
    coupled offset would be averaged away.
  - Report the spread across independent ring draws, since one atypical ring element could carry the
    whole effect.
  - Report key-level bootstrap widths alongside ciphertext-level, since the ciphertext-level interval
    understates variance when a key is shared.
  - Report the marginal-match residual per arm rather than only the pass or fail flag.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report if marginal pinning cannot be achieved within the frozen tolerance; the residual
    is the deliverable.
  - Halt and report if the unstructured arm differs from the independent-coin null beyond the resolution
    floor, since the attribution would be void.
  - Cap total wall clock at eight CPU-hours; a cap hit is an infrastructure outcome and never negative
    mathematical evidence, and completed configurations are reported as such.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Marginals are pinned within tolerance, the unstructured arm matches the independent-coin
    null within the resolution floor with independence ratio one, and the negacyclic arm shows a mean
    absolute off-diagonal correlation at least twice the resolution floor that is well fitted by a
    function of cyclic offset and that moves as ring degree is swept.
  falsification_criterion:
  - The unstructured arm differs from the independent-coin null beyond the resolution floor.
  - Marginal pinning fails at the frozen tolerance.
  - The negacyclic arm's correlation is below the resolution floor at every ring degree.
  - The cyclic-offset fit leaves more residual than the pre-registered fraction.
  - The independence ratio on the unstructured arm deviates from one beyond its bootstrap interval.
  - The structured summary does not move as ring degree sweeps.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-1418f4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The threshold-tuning approach to pinning marginals changes decoding geometry between arms; a Coordinator
    must decide whether that trade is acceptable or whether a different matching variable should be
    pinned instead.
  - The monotonicity of indicator correlation in underlying correlation is checked at only two marginals;
    whether that suffices to license the projection is a judgement a Coordinator must make before
    approval.
  - How, if at all, this toy result may later be connected to any real failure-rate computation is
    deliberately unspecified here and must not be assumed; the connection would need its own contract.
