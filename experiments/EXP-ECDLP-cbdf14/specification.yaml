# EXP-ECDLP-cbdf14
# Ladder and column arithmetic. No closure.
# Approved by DEC-20261002-96263c.
experiment:
  id: EXP-ECDLP-cbdf14
  hypothesis_id: H-ECDLP-5e4afe
  source_idea: IDEA-20260930-b26bbc
  question_id: RQ-ECDLP-f0a7b0
  version: 1
  title: Ladder gaps and row-column signs
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-96263c
  objective: >-
    Check the four ray gaps of 1, the excess 634, the shortfall 77,
    and the two copies of the gap 131.
  inputs:
    n131: 131
    sixth_gap: 131
    twelfth_gap: 131
    m3_num: 524
    rho_num: 393
    m4_num: 1179
    m3_twelfth: 1048
    ray1: 1
    n1: 23
    l1: 8
    rows1: 3151
    cols1: 2517
    excess1: 634
    ray2: 1
    n2: 29
    l2: 10
    rows2: 6119
    cols2: 6196
    short2: 77
    ray3: 1
    n3: 35
    l3: 12
    rows3: 10535
    cols3: 12951
    short3: 2416
    ray4: 1
    n4: 41
    l4: 14
    rows4: 16687
    cols4: 24158
    short4: 7471
  controls:
    - >-
      Three times 8 minus 23 is 1. Reporting a ray gap of 0
      invalidates the run.
    - >-
      The row count 3151 exceeds 2517 by 634. Reporting a shortfall
      there invalidates the run.
    - >-
      The row count 6119 falls short of 6196 by 77. Reporting 6119
      above 6196 invalidates the run.
    - >-
      Four times 131 minus three times 131 is 131. Nine times 131
      minus eight times 131 is 131.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - cell in {(23, 8), (29, 10), (35, 12), (41, 14)}
    - route in {binomial_sum, scale_and_subtract}
  metrics:
    primary:
      - excess1
      - short2
      - implementations_agree
    secondary:
      - short3
      - short4
      - sixth_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Each ray gap is 1. The excess at (23, 8) is 634. The shortfall
      at (29, 10) is 77. Both exponent gaps at 131 are 131.
    formula: >-
      Subtract n from 3 l. Sum the binomial coefficients of 2 l
      through degree 4, and multiply the degree-at-most-2 sum by n.
      Separately subtract three times 131 from four times 131, and
      eight times 131 from nine times 131.
    source: >-
      IDEA-20260930-b26bbc states the ladder and the pairs 3151 over
      2517, 6119 over 6196, and 10535 over 12951, read 2026-10-02.
      The binomials were recomputed in this design session. That
      computation is not a run. No closure was built.
  scale_relevance:
    tier: toy
    justification: Four cells and one bit length. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The shortfalls 2416 and 7471 are required. A check that stops at the excess 634 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 634 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - A ray gap is not 1.
    - The excess at (23, 8) is not 634.
    - 6119 is reported above 6196.
    - A closure is built or a system is refuted.
  success_criterion: >-
    Both runs agree that each ray gap is 1, that the excess at
    (23, 8) is 634, that the shortfalls are 77, 2416, and 7471, and
    that both exponent gaps at 131 are 131.
  falsification_criterion: >-
    The runs agree that three times 8 minus 23 is 1, and the row
    excess at (23, 8) is not 634.
  required_artifacts:
    - experiments/EXP-ECDLP-cbdf14/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-cbdf14/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-cbdf14/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-cbdf14/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-cbdf14/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-cbdf14/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any mutant closure, certificate, or refutation rate.
    - Any claim that an exponent moves.
    - Any matrix allocation.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
