  experiment_id: EXP-ECDLP-c373eb
  specification_version: 1
  status: completed_valid
  executor: executor
  started_at: 2026-09-02
  git_commit: 5beaf276365214d82c20d066858e6a8ef15626c5
  git_branch: ideas-ecdlp-20260830
  git_tree_dirty: true
  git_dirty_note: >-
    Numerous unrelated paths modified/untracked at run time from concurrent
    multi-agent repository activity (e.g. coordination/goals/GOAL-SSI-001/**,
    experiments/EXP-MONO-*/**, ledger/handoffs/TASK-20260830-*.yaml, and
    other unrelated scratch files); none overlap
    experiments/EXP-ECDLP-c373eb/ prior to this run's own writes.
  command: >-
    cd experiments/EXP-ECDLP-c373eb/implementation &&
    python3 rc1_tabulation_run2.py
  wall_clock_seconds_observed: 0.2
  budget_wall_clock_seconds_per_run: 600
  budget_total_cpu_hours: 0.02
  randomness: >-
    None. The entire computation is deterministic integer/exact-rational
    arithmetic mod p^r (Python arbitrary-precision integers); no seeds are
    used or required. The curve and generator for this SECOND instance were
    chosen deterministically by the executor via a small manual search over
    (p, A, B) among toy-tier primes distinct from RUN-1's p=1009 (p=1013,
    1021, 1031 tried; A,B in [1,5]x[1,5]), selecting the first ordinary
    curve found whose group order has a prime factor distinct from RUN-1's
    n=47, then fixed for this run (documented below), not sampled at random.

  instance_parameters:
    curve:
      p: 1013
      A: 2
      B: 2
      model: 'short Weierstrass y^2 = x^3 + A x + B, minimal at p'
      discriminant_mod_p_nonzero: true
      a_p: 30
      ordinary: true
      note: >-
        a_p != 0, so the reduction is ordinary (not supersingular). This
        instance differs from RUN-1's (p=1009, A=1, B=1) in p and in both
        curve coefficients.
      N_points_over_Fp: 984
      N_factorization: '2^3 * 3^1 * 41^1'
    point_S:
      x: 393
      y: 263
      order_n: 41
      note: >-
        n=41 is prime, distinct from RUN-1's n=47; gcd(n, p) = 1013 mod 41
        != 0, S is not 2-torsion (y != 0).
    precision_r: 8
    canonical_lift_S_hat:
      construction: >-
        Genuine order-n canonical torsion lift, identical method to RUN-1.
        Constructed by defining f(x0) = the Jacobian Z-coordinate of
        [n] * (x0, HenselLift_y(x0)) (a p-adic-analytic function of x0
        alone, since y is Hensel-determined by x0 via the curve equation),
        observing that x0 = S.x is a SIMPLE root of f mod p (v_p(f(S.x)) = 1
        exactly, with df/dx0 mod p computed via a finite-integer-difference
        (f(x0+p)-f(x0))/p and confirmed to be a unit mod p), then applying
        ordinary single-variable Hensel/Newton lifting to that root, one
        p-adic digit of precision per correction step, for r+1 steps.
      x_mod_p_r: '22454942430194572886520'
      y_mod_p_r: '30185837102734218797721'
      independent_certificate: >-
        n * S_hat, recomputed via the SAME double-and-add scalar
        multiplication used everywhere else in this script, equals the exact
        projective identity (0, 1, 0) -- i.e. v_p(Z) >= r holds with equality
        to the full precision cap of 8, not merely "close to O". This is a
        hard, independently checkable pass/fail certificate for the lift's
        order-n property, verified true.
      verified_n_times_S_hat_equals_O_exactly_mod_p_r: true
    null_lift:
      construction: >-
        A different, also-valid Hensel lift of S, obtained by perturbing the
        x-coordinate by +p at the p^1 digit (x0' = S.x + p) before Hensel-
        lifting y from the same S.y mod p. This reduces to S mod p exactly
        (same as the canonical lift) but is NOT the order-n point: measured
        v_p(Z) of [n] * (null lift) is exactly 1, far short of the r=8 cap.
      x_mod_p_r: '1406'
      v_p_of_Z_of_n_times_null_lift: 1

  deviations_from_specification:
    - id: DEV-1
      description: >-
        The specification's inputs section leaves curve/point/n selection to
        the executor ("chosen by the executor and recorded verbatim"); for
        this replication run, the additional (task-level, not specification-
        level) requirement was a curve/p/n distinct from RUN-1's, which was
        honored (p=1013 vs 1009, A=2 B=2 vs A=1 B=1, n=41 vs n=47). This is
        the intended exercise of the specification's executor-choice clause,
        not a deviation from a fixed value.
      severity: none
    - id: DEV-2
      description: >-
        Part 3's sample of six (k1,k2,k3) triples was re-chosen for n=41
        (RUN-1's triples, e.g. (10,15,40) and (1,46,20), reference indices up
        to 46 and are not all valid mod 41). The replacement triples follow
        the same design as RUN-1's: a small mix of near-adjacent, spread,
        and one deliberately degenerate/near-collision triple analogous to
        RUN-1's (3,44,41) with 44 = -3 mod 47 -- here (3,38,35) with
        38 = -3 mod 41. This re-selection is necessitated by the changed n
        and does not narrow or alter the specification's Part 3 method.
      severity: none
    - id: DEV-3
      description: >-
        Schema-completion blocks (code, environment, inputs, timing, result)
        are included from the start of this manifest, per the task brief's
        instruction to avoid RUN-1's initial omission and follow-up fix.
        This is a compliance improvement, not a protocol deviation.
      severity: none

  certificate:
    kind: none
    statement: >-
      This is a pure measurement (tabulation of p-adic valuations); it does
      not claim a discrete-log solve or a factor-base relation. No solution
      certificate is applicable or produced. The canonical-lift order-n
      property IS independently certified (see canonical_lift_S_hat.
      independent_certificate above), which is a construction-correctness
      check, not a claim requiring the discrete-log certificate protocol.
    precision_cap_statement: >-
      All valuations reported at value r=8 mean "v_p >= 8, observed only to
      the finite precision r=8 used in this run" -- never literal infinity.
      No value in raw-result.json should be read as an exact infinite-
      precision claim.

  spot_check:
    description: >-
      For (j, k) = (5, 12) on the canonical lift, x([j]S_hat) and
      x([k]S_hat) were each computed two independent ways: (a) double-and-add
      scalar multiplication (the method used throughout this script), and
      (b) k (or j) repeated additions with no doubling step at all (a
      different code path exercising only jac_add, never jac_dbl in the
      "doubling" role except via its internal same-point fallback). Both
      paths agreed exactly, and D1(5,12) recomputed from the independently-
      obtained values agreed with the tabulated value (0 in both cases). The
      curve equation Y^2 Z = X^3 + A X Z^4 + B Z^6 was also verified to hold
      exactly mod p^8 for both S_hat and the null lift as an additional
      sanity check.
      Consistent with invalidation_rules item 2 of the frozen specification.

  required_artifacts:
