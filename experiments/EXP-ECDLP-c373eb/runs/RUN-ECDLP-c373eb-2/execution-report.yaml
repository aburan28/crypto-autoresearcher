    command: experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/command.txt
    environment: experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/environment.json
    stdout: experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/stdout.log
