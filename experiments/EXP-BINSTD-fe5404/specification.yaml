# EXP-BINSTD-fe5404
# Restart-schedule arithmetic. No racer.
# Approved by DEC-20261002-a3b093.
experiment:
  id: EXP-BINSTD-fe5404
  hypothesis_id: H-BINSTD-ecd982
  source_idea: IDEA-20260922-793fd8
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Restart-schedule arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-a3b093
  objective: >-
    Check the fifteen restart lengths, the five block sums, and the
    light-tail coefficients.
  inputs:
    prefix: [1, 1, 2, 1, 1, 2, 4, 1, 1, 2, 1, 1, 2, 4, 8]
    prefix_sum: 32
    block_k: [1, 2, 3, 4, 5]
    block_index: [1, 3, 7, 15, 31]
    block_length: [1, 2, 4, 8, 16]
    block_sum: [1, 4, 12, 32, 80]
    geometric_p_num: 1
    geometric_p_den: 2
    geometric_square_num: 1
    geometric_square_den: 2
    exponential_cv: 1
    two_orders: 100
    below_two_orders: 64
    below_gap: 36
    above_two_orders: 128
    above_gap: 28
  controls:
    - >-
      The fifteen lengths sum to 32. Reporting another sum invalidates
      the run.
    - >-
      The geometric square at p = 1/2 is 1/2. Reporting the coefficient
      as above 1 invalidates the run.
    - >-
      The exponential coefficient is 1. Reporting it as strictly above
      1 invalidates the run.
    - >-
      128 exceeds 100 by 28. Reporting 128 as inside two orders
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {schedule, coefficients}
    - route in {blocks, sums}
  metrics:
    primary:
      - prefix_sum
      - geometric_square
      - implementations_agree
    secondary:
      - block_sums
      - two_order_gap
      - exponential_cv
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The prefix sum 32 and the geometric square 1/2.
    formula: >-
      A block ends at index 2^k - 1 with length 2 to the power k - 1.
      The sum through that index is k times the length. A geometric
      squared coefficient is 1 minus the success probability.
    source: >-
      IDEA-20260922-793fd8 states the schedule prefix and the tail
      tests, read 2026-10-02. The sums were computed in this design
      session. That computation is not a run. No racer was run.
  scale_relevance:
    tier: toy
    justification: Fifteen lengths and two coefficients. No transfer to a portfolio.
    correspondence: null
  tail_checks:
    - The fifth block sum 80 is required. A check that stops at the written prefix and skips k = 5 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the fifteen-term sum is not 32, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The fifteen-term sum is not 32.
    - A geometric coefficient is reported as above 1.
    - 128 is reported as at most 100.
    - A racer is run or a tail index is estimated from samples.
  success_criterion: >-
    Both runs agree that the fifteen lengths sum to 32, that the five
    block sums are 1, 4, 12, 32 and 80, that the geometric square at
    p = 1/2 is 1/2, and that 128 exceeds 100 by 28.
  falsification_criterion: >-
    The runs agree, the fifteen-term sum stays 32, and any block sum
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-fe5404/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-fe5404/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-fe5404/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-fe5404/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-fe5404/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-fe5404/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any racer, restart trial, or tail-index estimate.
    - Any claim that a portfolio beats a pure walk.
    - Any partial factor-base walk.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
