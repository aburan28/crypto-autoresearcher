  metric_recomputations:
    method: >-
      Two independent routes. (1) j2_recompute.py: written from the
      specification and hypothesis definitions BEFORE reading check.py; recomputes
      every flag from vP, vQ, v_dj and e and every summary field from the rows.
      (2) replay_compare.py: full replay of both seeds (14616 rows, about 3.5 s,
      one core). It follows run.py's rng draw order and uses the producer's
      random_point only to regenerate (P, d, x-digit). It recomputes v_p(Delta j)
      in exact rationals and the Hensel and Teichmuller lifts, v_p(z([p]P^)) and
      the ratio digit with the sealed blind code: a closed-form chord identity,
      cross-checked in phase 1 against a generic p-adic double-and-add on 1566
      cells.
    replay_row_mismatches: {RUN-CZLIFT-041d05: 0, RUN-CZLIFT-6709c9: 0}
    rows:
      - metric: rule_agreement / rule_disagreements
        RUN-CZLIFT-041d05: {recomputed: '1.0 / 0', recorded: '1.0 / 0', match: true}
        RUN-CZLIFT-6709c9: {recomputed: '1.0 / 0', recorded: '1.0 / 0', match: true}
      - metric: nondegenerate_success_rate (vP = 1)
        RUN-CZLIFT-041d05: {recomputed: 2052/2052, recorded: 1.0, match: true}
        RUN-CZLIFT-6709c9: {recomputed: 2052/2052, recorded: 1.0, match: true}
        note: >-
          The set {vP = 1} equals {v_dj < 2e} row for row (rule_agreement = 1), so
          the rate is the same whether conditioned on outcome or on lift.
          Every vP = 1 row has vQ = 1.
      - metric: degenerate_success_rate / degenerate_reference_inv_p / degenerate_z_score (producer code definition, vQ >= vP)
        RUN-CZLIFT-041d05: {recomputed: '93/5178 = 0.017960603 / 0.016932672 / 0.573311', recorded: '0.017960603 / 0.016932672 / 0.573311', match: true}
        RUN-CZLIFT-6709c9: {recomputed: '87/5175 = 0.016811594 / 0.016995721 / -0.102477', recorded: '0.016811594 / 0.016995721 / -0.102477', match: true}
        z_form: pooled binomial SE sqrt(ref(1-ref)/n); the heterogeneous form gives 0.5905 and -0.1056
      - metric: degenerate_success_rate / reference / z (FROZEN definition, all v_p >= 2 samples)
        RUN-CZLIFT-041d05: {recomputed: '93/5256 = 0.0176941 / 0.0177289 / -0.0191', recorded: '0.0179606 / 0.0169327 / 0.5733', match: false}
        RUN-CZLIFT-6709c9: {recomputed: '87/5256 = 0.0165525 / 0.0177289 / -0.6463', recorded: '0.0168116 / 0.0169957 / -0.1025', match: false}
      - metric: degenerate z, symmetric exclusion (vQ = vP only), for reference
        RUN-CZLIFT-041d05: '93/5105 = 0.0182174, ref 0.0163790, z = 1.0349'
        RUN-CZLIFT-6709c9: '87/5103 = 0.0170488, ref 0.0163285, z = 0.4060'
        note: with reference 1/(p-1) instead of the frozen 1/p, |z| <= 1.47 in every variant
      - metric: by_class (n, degenerate, predicted_degenerate, ratio_defined, success, frac_*, success_rate) for all four classes
        result: exact match on both seeds (0 diffs)
      - metric: degenerate_by_section (n, success, inv_p_sum, rates)
        result: exact match on both seeds (0 diffs)
        per_section_heterogeneous_z:
          RUN-CZLIFT-041d05: {hensel_random: 2.360, naive: 1.502, teichmuller: -2.741}
          RUN-CZLIFT-6709c9: {hensel_random: 0.700, naive: 0.962, teichmuller: -1.835}
      - metric: success criterion (both seeds rule_agreement = 1, nondegenerate = 1, |z| <= 4)
        result: satisfied under the producer, frozen and symmetric definitions
      - metric: falsification criterion
        result: not triggered under any definition
    checker_receipt: >-
      check.stdout.log "check ok: rows reproduce, summary re-derives, flags
      consistent" with return code 0 agrees with the validator. However, check.py
      is NOT independent of the producer. It imports run.py and calls
      driver.summarize and czlift.anomalous_cm_curves, and it does not test
      predicted_degenerate against v_dj and e. Independence for J2 rests on
      j2_recompute.py and replay_compare.py, not on check.py.

  control_checks:
    - id: C1
      control: Non-degenerate control (pert_p, v_p(Delta j) = 1 for j != 0 and 3 for j = 0, must recover d for every point lift)
      on_stated_object_v_dj_below_2e: '2052/2052 v_p(z) = 1 and Smart recovers d, on both seeds: pass'
      on_class_label_as_generated: >-
        pert_p success 2055/2088 (seed 20261009) and 2060/2088 (seed 20261010);
        the class as labelled fails "every point lift". All 33 and 28 failures are
        on ONE lift per seed: D = -43, p = 11, model (A, B) = (-4458240, 3623211648).
        run.lift_classes perturbs both a4 and a6 by random multiples of p. The
        draws (r1, r2) = (1, 8) [seed 20261009, lift index 5] and (9, 6)
        [seed 20261010, lift index 3] both satisfy r2/r1 = 3B/(2A) = 8 mod 11.
        That is the direction where dj, proportional to 108 A^2 B (3B dA - 2A dB),
        vanishes to first order. Exact v_p(Delta j) = 2 = 2e on both. The
        generator therefore does not enforce the spec's pert_p definition; the
        chance is about 1/(p-1) per lift. Per-lift pert_p v_p(Delta j) histogram
        on each seed: {1: 35, 3: 22, 2: 1}.
      result: pass_on_object / deviation_in_generator
    - id: C2
      control: Isomorphic re-model behaves like the canonical model
      result: pass
      detail: >-
        Delta j = 0 exactly on every isomorphic lift (recorded v_dj = 8 = cap). frac_degenerate = 1.0 on both seeds.
        Degenerate success 32/2060 and 31/2054 against canonical 16/1031 and 19/1034, all consistent with 1/p.
    - id: C3
      control: j-distance and degeneracy flag are independent instruments
      result: pass
      detail: >-
        In run.py v_dj is computed from (A', B') alone (ZpCurve.j_invariant) and vP from points (smart_ratio); the replay
        recomputes v_dj in exact rationals and vP by a different group-law route; both agree on every row.
    - id: C4
      control: d = +-1 excluded
      result: pass
      detail: >-
        d = rng.randrange(2, p-1); all 14616 replayed d lie in [2, p-2]. Small-p tail check: pooled p <= 19 degenerate
        success 56 vs 60.26 expected (z = -0.58), and 56 vs 60.76 (z = -0.64). No residual excess.
    - id: T1
      control: tail check, canonical frac_degenerate = 1 on every curve
      result: pass on both seeds (29/29 curves)
    - id: T2
      control: tail check, per-section breakdown shows no residual excess
      result: pass (no section z above +2.36)
      observation: >-
        teichmuller shows a deficit on both seeds (z = -2.74 and -1.84). It is
        not a criterion item. It is recorded for the review-evidence round as an
        unexplained same-sign deviation; the producer's metrics do not test it.

  blind_rederivation:
    joint: J3
    sealed_before_phase_2: true
    seal_times_utc: ['2026-10-22T08:09:53Z (SEAL-1)', '2026-10-22T08:10:18Z (SEAL-2)']
    sealed_hashes:
      blind/blind_rederive.py: a4f66b0f52b0a7a1d18a59161b04225443e99698b747df83f0c356b3a35e5c4e
      blind/blind_output.json: cc5a19cd83e1ecef395d6c6dde1725f995b1e4983252f8ccab845146c911b39e
      blind/blind_stdout.log: d66990c9919bccef147987da1a66aeaaa699aad3d2bf8f908b48a5d4aa0239f2
      blind/blind_time.log: c8487ff84126a18aeed2237816eac5ddd0b63422e5fca266aefde56120bba755
      blind/blind_supplement.py: 05bf48d0d52b50bf148edec9f02ad07a44d9cf1749cc9c51b5388b2f4af589a5
      blind/blind_supplement.json: 0794b571dd9baf0f6b06dcc5d2b985fa09f8f94e72986a28474cbb3729586647
      blind/SEAL-1.sha256: 632ede4e1ae1be49dd6c37c2d931853cbf6a04ccc55e7c86df8f5b9a2c2461d8
      blind/SEAL-2.sha256: 75bf5422ef751873083603c86143ef14a875a05e1b3dd1ba2bcd1bd87f282bf0
    independent_choices: >-
      Primes come from 4p = 1 + |D| v^2 with p >= 7, cross-checked by brute-force
      point counting over all twists. Models are y^2 = x^3 - 3j(j-1728)x +
      2j(j-1728)^2, quadratically twisted when the trace is -1, and for j = 0 the
      least b with #E = p; these differ from the producer's models but are
      Z_p-isomorphic canonical lifts. Three points per curve (the least-x point
      plus two random ones, seed 2026102282). Three sections: integer x, fully
      random higher x-digits, Teichmuller x. Precision 10.
      v_p(z([p]P^)) = v_p(x([p-1]P^) - x(P^)) via the chord identity, checked
      against a generic p-adic double-and-add on 1566/1566 cells.
    anomalous_primes_by_D:
      '-3': [7, 19, 37, 61, 127, 271, 331, 397, 547, 631, 919]
      '-11': [223, 619, 1213]
      '-19': [43, 233, 1069, 1373]
      '-43': [11, 97, 269, 1301]
      '-67': [17, 151, 419, 821]
      '-163': [41, 367, 1019]
    comparison:
      curve_list: identical to the producer's curve_list (29 entries, same order) on both runs
      canonical: 'blind v_p(z) histogram {2: 255, 3: 6} over 261 cells; producer {2: 1030, 3: 14} and {2: 1032, 3: 12}; v >= 2 everywhere in both'
      a6_plus_p_literal: >-
        j != 0 (18 curves): v = 1 on 162/162 cells and Smart recovers d 162/162.
        j = 0 (11 curves): a6 + p leaves j = 0, so the lift is canonical:
        v_dj = infinity and v >= 2 on 99/99 cells.
      a4_plus_p (spec pert_p at j = 0, v_dj = 3): v = 1 on 261/261 cells, Smart 261/261; the producer's pert_p rows with v_dj < 2e give 2052/2052 v = 1 per seed
      p2_perturbations: v >= 2 on 522/522 blind cells; producer pert_p2 is degenerate on 2088/2088 rows per seed
      isomorphic: blind v >= 2 on 261/261; producer 2088/2088 per seed
      row_level: the full replay (J2) reproduces every producer valuation with the blind code, 14616/14616
    underspecification_noted: >-
      The quantity names "the lift with a6 perturbed by p". For j = 0 that lift
      keeps j = 0, so it is the canonical lift and not the spec's pert_p class
      (v_p(Delta j) = 3), which needs an a4 perturbation. Both were computed
      blind. The specification names its models only by reference to
      harness.czlift.anomalous_cm_curves (in blind_from); the blind models were
      chosen independently, which the statement allows (any Z_p model with
      j = j_D exactly is the canonical lift).
    blind_side_observation: >-
      Blind canonical next-digit hits were 11 over 251 readable cells against a
      1/p reference of 4.16. Seven of the 11 are at p in {7, 11}, and cells share
      (P, d) across sections, so they are correlated (e.g. +-P with the same d
      under negation-equivariant sections). The producer's larger samples show
      no small-p excess (C4). Not load-bearing.

  proves_too_much:
    id: PTM-1
    object: The pert_p lift class (v_p(Delta j) below 2e)
    expected_failure_signature: Every pert_p sample has v_p(z([p]P^)) = 1 and Smart recovers d; a single degenerate pert_p sample breaks the instrument.
    observed:
      in_object_samples: {RUN-CZLIFT-041d05: 2052, RUN-CZLIFT-6709c9: 2052}
      in_object_vP_eq_1_and_success: {RUN-CZLIFT-041d05: 2052, RUN-CZLIFT-6709c9: 2052}
      in_object_degenerate: {RUN-CZLIFT-041d05: 0, RUN-CZLIFT-6709c9: 0}
      label_pert_p_degenerate_outside_object: {RUN-CZLIFT-041d05: 36, RUN-CZLIFT-6709c9: 36}
    verdict: holds
    reasoning: >-
      The instrument never reaches the known-false conclusion (canonical-lift
      degeneracy on lifts with v_p(Delta j) < 2e). The 36 degenerate samples per
      seed lie on a lift that the producer's own j-distance instrument flagged
      predicted_degenerate (v_dj = 2 = 2e) before any point was measured. The
      validator's exact rational computation confirms v_p(Delta j) = 2 and the
      blind p^2-distance lifts confirm degeneracy there. Read literally on the
      class label, the plan's signature fires. That reading is disclosed rather
      than adopted, because the plan's object is defined by v_p(Delta j), not by
      the label.

  heuristic_validation_checks:
    - check: pre-registered prediction
      result: pass
      detail: >-
        The 1/p reference, the rule and the 4-SE tolerance are in H-CZLIFT-889c9d
        and the spec. Both are hash-bound in the snapshot receipt and committed at
        6756a75613 (2026-10-09 16:02:21Z), before the runs started (16:03:52Z).
        heuristic_under_test is null; no Dickman-type CDF is involved.
    - check: null-object control
      result: pass_with_note
      detail: >-
        The degenerate digit is compared to the random-rate null 1/p. The quantity
        that should decay (a small-p excess from d = +-1) shows none at p <= 19.
        The pert_p lift is the non-degenerate counter-object (C1). The
        teichmuller deficit is not addressed by the producer (T2).
    - check: sample integrity
      result: pass
      detail: >-
        Sample size, seeds and procedure are in the manifest and trial plan. All
        rows were regenerated and re-measured independently.
    - check: correspondence validity
      result: not_applicable
    - check: scale binding
      result: pass
      detail: >-
        Toy tier, p <= 1373, precision 8, declared in the spec. No transfer claim
        is made. Recorded valuations never reach the cap.
  cost_model_checks:
    - not_applicable: no cost table or speedup claim in this contract
  proof_architecture_checks:
    - not_applicable: bounded empirical check, not a proof-oriented task

  discrepancies:
    - id: D1
      joint: J2
      severity: definitional; outcome-invariant
      statement: >-
        degenerate_success_rate, degenerate_reference_inv_p and
        degenerate_z_score (and degenerate_by_section) are computed in run.py
        summarize over rows with ratio_defined, i.e. czlift.smart_ratio's
        vQ >= vP and vP < 8. Rows with vQ < vP are dropped; rows with vQ > vP are
        kept as ratio 0 (failure). The frozen definition is "v_p >= 2 samples;
        precision-p^3 ratio equals d", against mean 1/p over those samples. It
        contains all 5256 degenerate rows per seed.
      raw_rows: >-
        Seed 20261009: 78 dropped rows (canonical 13, isomorphic 28, pert_p 2,
        pert_p2 35), concentrated at small p (D=-3 p=7: 21, D=-67 p=17: 16). Seed
        20261010: 81 dropped rows (canonical 10, isomorphic 34, pert_p 1, pert_p2
        36). Per-curve lists are in probe_borderline_output.json.
      values: >-
        Frozen definition: seed 20261009 rate 0.0176941, ref 0.0177289,
        z = -0.0191; seed 20261010 rate 0.0165525, ref 0.0177289, z = -0.6463.
        Recorded: 0.0179606, 0.0169327, 0.5733 and 0.0168116, 0.0169957, -0.1025.
      mitigating_fact: >-
        The code definition was hash-bound in trial-plan.json (run.py d8cd5549...)
        and frozen with the spec before execution, so it is pre-registered, not
        post hoc. The inconsistency is between two frozen documents.
      remedy_for_coordinator: >-
        An erratum or amendment record stating which definition governs, citing
        this report's frozen-definition values. No re-run is needed: the raw rows
        are verified.
    - id: D2
      joint: J2 / PTM-1
      severity: generator deviation from the spec's class definition; rule metric unaffected
      statement: >-
        The spec defines pert_p as v_p(Delta j) = 1 for j != 0. run.lift_classes
        draws (A + p r1, B + p r2) with r1, r2 in [1, p-1], and these cancel to
        first order with probability about 1/(p-1). On both seeds exactly one
        lift (D = -43, p = 11) has v_p(Delta j) = 2. It is labelled pert_p and
        contributes 36 degenerate rows; class-level pert_p success_rate is 0.98420
        and 0.98659, not 1. On seed 20261009 two pert_p2 lifts likewise have
        v_p(Delta j) = 3 rather than 2. That is harmless, since it is still
        >= 2e and predicted degenerate.

  verdict: failed
  verdict_basis: >-
    J2 breaks. A frozen primary metric family (degenerate_success_rate,
    degenerate_reference_inv_p, degenerate_z_score) does not recompute to its
    recorded value under the specification's referenced definition (D1). The
    receipts are not admissible as-is for those fields. The failure is confined
    to them. Custody (J1), the raw rows (independently replayed 14616/14616),
    rule_agreement, nondegenerate_success_rate and the blind re-derivation (J3)
    all hold. No success or falsification outcome changes under any definition
    (frozen-definition z = -0.0191 and -0.6463). A passed verdict would admit
    recorded primary-metric values that differ from their frozen definition
    because a partial check passed, which agents/validator.md prohibits.
  inference_boundary: >-
    This report says nothing about H-CZLIFT-889c9d's truth, changes no status and
    authorizes no promotion. Interpretation and scope joints are not owned here
    (procedure deviation PD-1).

  limitations:
    - >-
      Rows record neither P, d nor lift coefficients. The replay regenerates
      them through the producer's rng draw order and its random_point (via
      harness/toycurve.py, executed but not read). A shared defect in point
      selection would therefore not be visible, but every measured quantity is
      recomputed with independent code.
    - >-
      The blind models differ from the producer's (and the Q-minimal models);
      agreement relies on Z_p-isomorphism invariance of v_p(z). The isomorphic
      class (C2) is the producer's in-run check of that invariance, and the
      blind isomorphic class agrees.
    - >-
      The archive receipts carry commit_sha null, bound in dispatch_queue.json,
      which is outside read scope and was not read. The binding was checked
