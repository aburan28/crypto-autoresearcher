  joint_verdicts:
    J1: holds
    J2: breaks
    J3: holds
    PTM-1: holds
  joint_verdict_summary:
    J1: >-
      Custody intact. All 18 run-artifact hashes match both execution receipts and
      the ledger archive receipt (TASK-20261009-ea3bbc), with no unlisted or missing
      file. Both execution-receipt.json hashes match the ledger receipt. The
      contract files are byte-identical at the freeze commit 6756a75613, the
      executing commit dcaa880ab6 and HEAD 5c3cfdeef7. command.txt equals the
      trial-plan argv. Seeds, environment and coverage (2/2 trials, 29 curves,
      7308 rows each) agree.
    J2: >-
      Breaks on definition, not on arithmetic. Every recorded number reproduces
      exactly from raw-result.json, and an independent full replay matches
      14616/14616 rows. But the recorded degenerate_success_rate,
      degenerate_reference_inv_p and degenerate_z_score are computed over an
      asymmetric subset (vQ >= vP) that the frozen definition does not contain.
      The frozen definition (H-CZLIFT-889c9d prediction 3, the spec's
      preregistered_prediction.source) is "v_p >= 2 samples". Under it the values
      differ: seed 20261009 z = -0.0191 (recorded 0.5733); seed 20261010
      z = -0.6463 (recorded -0.1025). The raw rows behind the difference are the
      78 and 81 degenerate rows with vQ < vP that the recorded metrics drop, while
      the 73 and 72 rows with vQ > vP are kept as failures. No success or
      falsification outcome changes under any of the three definitions computed
      (max |z| = 1.47).
    J3: >-
      Holds. The sealed blind anomalous-prime list (29 curves, p 7..1373) equals
      the producer curve_list exactly. On the canonical lift, v_p(z([p]P^)) >= 2 on
      every blind cell and every producer row. On every lift with
      v_p(Delta j) < 2e, v_p(z) = 1 and Smart recovers d. The literal "a6 + p" lift
      on j = 0 curves is still j = 0 (canonical), so it is degenerate, as the rule
      predicts. The spec's pert_p (v_p(Delta j) = 3 at j = 0) perturbs a4, and the
      blind a4 + p class gives v = 1 on all 261 cells.
    PTM-1: >-
      Holds on the plan's object, "pert_p lift class (v_p(Delta j) below 2e)":
      2052/2052 samples per seed have v_p(z) = 1 and Smart recovers d, with 0
      degenerate. Disclosed: taken by class LABEL, the literal signature is
      triggered by 36 degenerate pert_p-labelled samples per seed. All 36 are on
      one lift (D = -43, p = 11) whose exact v_p(Delta j) = 2 = 2e, so that lift is
      outside the object and degeneracy is the rule's correct outcome there. See
      control_checks C1 and discrepancy D2.

