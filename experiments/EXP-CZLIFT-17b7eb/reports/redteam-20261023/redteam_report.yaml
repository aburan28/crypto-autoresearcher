red_team_report:
  id: RT-20261023-0b2a4f
  task_id: TASK-20261023-856638
  experiment_id: EXP-CZLIFT-17b7eb
  hypothesis_id: H-CZLIFT-889c9d
  review_plan_id: REVIEW-CZLIFT-17B7EB-EVIDENCE-20261023
  reviewed_snapshot: 14a328a2642222c1ba9aa8c3a6b0e2cfef610eed
  snapshot_note: >-
    Every read-scope path is tracked and clean at 14a328a264 (git status --porcelain empty). Runs
    RUN-CZLIFT-041d05 and RUN-CZLIFT-6709c9 were read only through raw-result.json, programmatically
    by key, plus the first 1.5 KB of one manifest.yaml.
  run_ids: [RUN-CZLIFT-041d05, RUN-CZLIFT-6709c9]
  claim_under_review: >-
    H-CZLIFT-889c9d as stated in the review plan. For ordinary anomalous E/F_p with class-number-one CM,
    v_p(z([p]P^)) >= 2 iff v_p(j(E^) - j_can) >= 2e. Smart's precision-p^2 attack recovers d for every
    point lift when v_p(Delta j) < 2e and for none when v_p(Delta j) >= 2e. On those degenerate lifts the
    next digit equals d "at the random rate 1/p".

  joint_verdicts:
    R1: breaks
    R2: breaks
    PTM-1: holds

  joint_findings:
    R1:
      verdict: breaks
      what_breaks: >-
        The conjunct "the rule is a measured agreement between two independent instruments rather than a
        tautology". The instruments are independent as code (validator C3). The two predicates, however,
        are the same predicate on every Z_p-lift: this follows from Serre-Tate theory, Kummer theory of the
        p-torsion and the ramification of the j-map. rule_agreement = 1 can therefore fail only through an
        implementation error. It calibrates the instruments and is not evidence about mathematics.
        Clause 3 also fails narrowly as stated, because "the random rate 1/p" is not the rate per section
        (see R2 and the counterexample). The rule is NOT falsified. It is upgraded from an empirical claim
        to a theorem, and the experiment's evidential role is downgraded to instrument calibration.
      derivation_two_sides_identical: >-
        (1) Let E/F_p be ordinary with #E(F_p) = p >= 5, and E^/Z_p any lift. Then 0 -> E_1 -> E^(Q_p) ->
        E(F_p) = Z/p -> 0, with E_1 = pZ_p via the formal log (p > 2) and E_n corresponding to p^n Z_p.
        (2) If E^(Q_p) has a point P~ of order p over P, write P^ = P~ + T with T in E_1. Then
        [p]P^ = [p]T lies in E_2, so v_p(z([p]P^)) >= 2 for every P != O and every point lift. Otherwise
        E^(Q_p) = Z_p with E_1 = pZ_p, so [p]P^ lies in E_1 \ E_2 and v_p(z) = 1 for every P and every
        lift. The flag therefore depends on the curve lift alone; equivalently E^(Z/p^2) is (Z/p)^2 or
        Z/p^2. (3) Splitting is the vanishing of the class of E^[p] in Ext^1_{Z_p}(Z/p, mu_p) =
        Z_p^*/Z_p^{*p} = Z/p. By Serre-Tate, the deformation space over W(F_p) is a one-dimensional
        height-one formal group with the canonical lift at the origin, and E^ -> [E^[p]] is a homomorphism
        from its Z_p-points (= Z_p via log, filtration F^n <-> p^n Z_p) onto Z/p. It is non-trivial
        because Smart's non-split lifts exist. Its kernel is the unique index-p subgroup F^2. Hence split
        <=> v_p(t) >= 2, where t is any coordinate at the canonical lift. (4) If Aut(E) = {+-1}, then
        W[[t]] = W[[j - j_can]], so v_p(Delta j) = v_p(t). At j = 0, Aut/{+-1} = Z/3 (order invertible),
        so j = unit * t'^3 and v_p(Delta j) = 3 v_p(t). Therefore split <=> v_p(Delta j) >= 2e, on every
        Z_p-lift.
      evidence:
        - >-
          Full-fiber sweep (rt_r1_fiber.py, own p-adic code, no harness import). All 29 curves were
          covered, with every one of the p classes of lifts mod p^2 along A + p t (A = p t at j = 0) plus
          five p^2-lifts each, 12,778 lifts in total. Rule disagreements 0. Exactly one degenerate class
          mod p^2 per curve: the CM class t = 0.
        - >-
          The flag never depends on the point or the section. For p <= 61 this was checked on every point
          x 3 sections x 3 eps on every lift; for p > 61, on 3 random points x 3 sections per lift.
          Point- or section-dependent lifts: 0.
        - >-
          Outside the tested set, on 10 random NON-CM anomalous curves (p = 53..211, where j_can is not
          explicit), each of two independent lift directions (a + p t and b + p t) has exactly one
          degenerate t. The two degenerate lifts share j mod p^2 on all 10 curves. This is consistent with
          the rule holding for every ordinary anomalous curve (rt_r1_fiber_output.json, key noncm). It is
          red-team evidence, not frozen evidence.
        - >-
          My instrument agrees with exact rational arithmetic on 24/24 cells (v = 1 and v = 2;
          rt_selftest_output.json).
      e_equals_3_check: >-
        Over Z_p, every lift of a j = 0 curve has v_p(Delta j) in 3Z or infinity. A model with A = 0 mod p
        and unit discriminant has v(j) = 3 v(A). The fiber histogram shows only {3, 6, inf}. The data
        therefore pin the j = 0 threshold only to (3, 6]: "2e = 6" is consistent and correct by theory, but
        it is not measured as a constant. The e = 1 boundary (1 vs 2) is tested heavily: pert_p2 always
        gives v = 2, and the D = -43, p = 11 pert_p-labelled lifts with v = 2 are degenerate, as derived.
      scope_covered: >-
        29 class-number-one CM anomalous curves, D in {-3, -11, -19, -43, -67, -163}, 7 <= p <= 1373.
        Unramified Z_p-lifts given by integral short Weierstrass models in four sampled classes, with
        v_p(Delta j) in {1, 2, 3, inf} for e = 1 and {3, 6, inf} for e = 3. Precision p^8. Three sections:
        naive, Teichmuller, Hensel with one random x-digit.
      scope_not_covered: >-
        Non-CM anomalous curves (frozen evidence: none; red-team sweep only at p <= 211). Lifts over
        ramified extensions or W(F_{p^k}), where valuations of Delta j are fractional and the e = 3
        threshold would matter. Higher class number. p = 5 (D = -19) and p = 3 (D = -11) are excluded by
        p >= 7. Any non-anomalous curve. Any crypto-size p.
    R2:
      verdict: breaks
      what_breaks: >-
        Two breaking artifacts from the plan are both present, and neither changes an outcome. (a) A
        definition under which the null is wrong. CORR-20261023-1869c3 makes "all v_p >= 2 rows" the
        governing definition but keeps the reference 1/p. Under the random-section model the matching null
        for that definition is 1/(p+1); 1/p is exact only for the producer's code definition (vQ >= vP).
        For the deterministic sections (naive, Teichmuller) 1/p is wrong per cell: CM automorphisms force
        failures at j = 0, and per-lift rates scatter with relative sd about sqrt(11/p). (b) A plausible
        leak the frozen statistic could not detect: a rho-parity leak (rate 1/sqrt(p)) confined to one
        section at p > 500 has expected z 2.2 and power 0.05 under the frozen pooled |z| <= 4 test.
      right_null_by_definition: >-
        Random-section model on a split lift: tau(P) = P^ - P~ is in E_1, v(tau) - 1 ~ Geometric(1/p), and
        the leading digits are uniform and independent. This gives P(vQ = vP) = (p-1)/(p+1),
        P(vQ > vP) = P(vQ < vP) = 1/(p+1), and P(success) = 1/(p+1). The matching nulls are: producer
        (vQ >= vP) 1/p; frozen/CORR (all v >= 2) 1/(p+1); symmetric (vQ = vP) 1/(p-1); literal
        "read at precision p^3" (p-1)/p^2. Observed vQ < vP / vQ > vP = 78/73 and 81/72 against 86.8 on
        each side; vP >= 3 = 89 and 88 against 93.2.
      z_under_matching_nulls:
        RUN-CZLIFT-041d05: {corr_def_with_1/p: -0.02, corr_def_with_matching_1/(p+1): 0.684, producer_def_1/p: 0.591, symmetric_1/(p-1): 0.279, literal_p3: 0.205, exact_null_conditioned_on_actual_lifts: 1.539}
        RUN-CZLIFT-6709c9: {corr_def_with_1/p: -0.666, corr_def_with_matching_1/(p+1): 0.018, producer_def_1/p: -0.106, symmetric_1/(p-1): -0.343, literal_p3: 0.093, exact_null_conditioned_on_actual_lifts: 0.751}
      teichmuller_deficit_reading: >-
        The validator's deficit (z = -2.74, -1.84 against 1/p) is a null artifact, not a real deficit. All
        of it sits in D = -3 (2 successes per seed out of 660 rows); D != -3 Teichmuller is on null (14 and
        18 against 17.8 and 18.2 exact). Mechanism: on j = 0 lifts with A = 0 mod p^2, the Teichmuller
        section is mu_6-equivariant. [zeta] acts on E_1/E_2 by the CONJUGATE of its eigenvalue lambda on
        E(F_p), because O_K acts on the formal group and on the etale quotient through the two different
        embeddings. So for d in mu_6 \ {+-1} the next-digit ratio is d^{-1}, never d: a forced failure.
        Measured: 0 successes on every mu_6 \ {+-1} pair, on canonical and isomorphic j = 0 lifts, at all
        11 primes 7..919 (rt_r2_exact_output.json, mu6_forced_failure). At p = 7, where F_7^* = mu_6, the
        digit is exactly u(k) = 5/k and the rate is 0 on every j = 0 lift. The lifts were regenerated from
        run.py's draw order; all 406 matched class and v_dj, and the D = -43, p = 11 boundary draws equal
        the validator's (1, 8) and (9, 6). Conditioned on those lifts, exact Teichmuller nulls give
        z = -1.48 and -0.84; the D = -3 Teichmuller cells give 2 against 4.98 and 5.69 exact (15.6 under
        1/p).
      other_cell_artifacts_explained: >-
        Two cells are explained by the exact nulls of the specific lifts. naive|D=-3|pert_p2 at seed
        20261009 (z = 4.03 against 1/(p+1)) is 15 against 10.3 exact, z = 1.71. naive on the D = -43,
        p = 11 boundary lift at seed 20261010 (5/12) has exact rate 0.30 on that lift (3.6 expected).
        hensel_random's exact eps-averaged rate is 0.98-1.01 x 1/(p+1) for p <= 43, which confirms the
        random-section model for the randomized section.
      overdispersion: >-
        A deterministic section on a fixed lift has a lift-specific rate: success count =
        #{k != +-m : w(k) = w(m)} with w = u/k. A random-function collision model predicts relative sd
        about sqrt(11/p) around 1/p. Measured on 40 canonical lifts with p >= 100: standardized deviation
        mean 0.035, sd 0.951 (rt_r2_overdispersion_output.json). The binomial SE with i.i.d. rows at 1/p
        therefore understates the variance of naive and Teichmuller cells unless the null is conditioned
        on the lift.
      power: >-
        Per seed: n = 5256, null count sd 9.0, 4-sigma absolute excess 0.0069. A uniform multiplicative
        leak lambda/(p+1) is detected at lambda >= 1.42 (50% power) or 1.52 (80%). 68.5% of the null mass
        comes from p <= 19, which is 14.4% of the rows. Against a rho-parity leak 1/sqrt(p): at all p,
        E[z] = 47.9; confined to p > 500, E[z] = 6.5 and power 0.97; confined to p > 500 and one section,
        E[z] = 2.2 and power 0.05. A 10/p leak at p > 500 has power 0.04; a 0.05 leak at p = 1373 only has
        power 0.002. A post hoc per-cell reading of the SAME rows does exclude these. At p > 500 each
        section has 1, 2 or 3 successes over 1200 rows, against 40.3 expected under 1/sqrt(p) and 13.9
        under 10/p. Every one of the 29 curves has a 95% upper rate bound below 1/sqrt(p). At p >= 500 the
        per-curve bounds are 7-18 x the null, so per curve the data cannot separate 1/p from about 10/p.
        These exclusions are red-team readings, not frozen criteria.
      rate_a_useful_attack_needs: >-
        On anomalous curves, no degenerate-lift section can be useful. Smart's attack on any non-canonical
        lift is polynomial time, and a uniformly random lift mod p^2 is degenerate with probability exactly
        1/p (one class in p, from the fiber sweep). The useful-rate question only matters for transfer to
        non-anomalous curves. There, a per-trial rate rho at polylog(p) cost beats Pollard rho only if
        rho >~ polylog(p)/sqrt(p), i.e. >= 0.027-0.38 at the tested p. The data exclude rho = 1/sqrt(p)
        at every tested curve, but only through the post hoc reading above.
    PTM-1:
      verdict: holds
      object: >-
        Non-anomalous ordinary class-number-one CM curves: 18 curves (D in {-3, -11, -19, -43, -67, -163},
        three primes each, 53 <= p <= 137, #E != p). Each was tested on the canonical CM lift and on one
        pert_p lift, with 3 sections x 60 samples, using the multiplier n = ord(P), a prime factor of #E
        (rt_ptm1.py).
      argument_run_unchanged:
        S1_multiplication_by_p_lands_in_formal_group: 'fails on every point: pP = O for 0 of all points on all 18 curves; the argument halts at its first step and predicts nothing'
        S2_premise_no_p_torsion_point: 'true on every lift of every curve, canonical included (p does not divide #E)'
        S3_smart_identity_with_the_multiplier_that_reaches_E1: 'canonical 52/3240 vs 46.7 expected at 1/p; pert_p 46/3240 vs 46.7: noise on both, no recovery'
        S4_rule_transplant_flag_is_curve_lift_invariant: 'false: on every curve one point gives both flag values as eps varies; frac v >= 2 about 1/p on the canonical lift (the transplanted rule would predict 1)'
      reasoning: >-
        The known-false conclusion (recovery on the canonical lift of a non-anomalous curve) is not
        reached. The hypothesis carries #E(F_p) = p in its statement and assumptions, and that premise
        stops the argument at S1.
      survival_location: >-
        One sentence of the mechanism would prove too much if detached from #E = p: "On a non-split lift
        no p-torsion point exists, so [p]P^ has valuation exactly 1 and the usual Smart identity holds for
        every pair of lifts". Its premise is true on EVERY lift of the PTM object, canonical included, yet
        recovery fails there (S2, S3). The operative condition is "P has no torsion lift in E^(Q_p)", i.e.
        the reduction sequence mod p^2 is non-split over <P>. That coincides with "E^[p] non-split" only
        when #E(F_p) = p. The evidence record should use the operative wording.

  objections:
    - id: O1
      severity: high
      text: >-
        rule_agreement = 1 is not empirical support for a mathematical regularity. The rule is a theorem
        (derivation above), and its core (Smart's attack needs a non-canonical lift; p-torsion lifting
        kills it) is published prior art: Belding 2007, arXiv:math/0703906, section 7, states "the DLP
        attack requires that the lift of the curve over F_p be non-canonical". The experiment calibrates
        instruments; it does not discover the obstruction.
    - id: O2
      severity: medium
      text: >-
        CORR-20261023-1869c3 pairs the governing all-v>=2 definition with the 1/p reference. The matching
        null is 1/(p+1), so a superseding correction should state the null per definition. Outcome
        unchanged: z = +0.684 and +0.018.
    - id: O3
      severity: medium
      text: >-
        Clause 3, "equals d at the random rate 1/p", is false at the cell level for deterministic sections.
        Teichmuller on j = 0 canonical and isomorphic lifts has forced failure on d in mu_6 \ {+-1} and
        rate exactly 0 at p = 7. Per-lift rates scatter by about sqrt(11/p) relative. The statement holds
        only pooled over lifts and curves.
    - id: O4
      severity: medium
      text: >-
        The frozen pooled statistic is dominated by p <= 19 (68.5% of the null mass) and is blind to leaks
        confined to large p or to one section (power 0.05 against a one-section rho-parity leak at
        p > 500). Exclusion of such leaks rests on post hoc per-cell readings.
    - id: O5
      severity: low
      text: >-
        Rows record neither (P, d) nor lift coefficients. The lifts can be regenerated from run.py's draw
        order (done here, validated on 406 lifts); (P, d) cannot be regenerated without executing harness.
    - id: O6
      severity: low
      text: >-
        The "e = 3" constant is not measured. Over Z_p, j = 0 lifts have v(Delta j) in 3Z, so thresholds 4,
        5 and 6 are indistinguishable.

  required_controls:
    - >-
      State the matching null per metric definition (1/p for vQ >= vP; 1/(p+1) for all v >= 2; 1/(p-1)
      for vQ = vP), in a superseding correction to CORR-20261023-1869c3.
    - >-
      For deterministic sections, compute the exact null per (lift, section) exhaustively over
      (P, d in [2, p-2]) and condition the test on it. Cost is O(p^2) table lookups after p - 1 p-adic
      multiplications; under 6 min on one core for every lift of this experiment (rt_r2_actual_lifts.py).
    - >-
      CM-automorphism control: for j = 0, exclude or separately report d in mu_6 \ {+-1} (and mu_4 at
      j = 1728), as is already done for d = +-1.
    - >-
      Add a large-p, per-section statistic (for example successes at p > 500 per section against the
      exact null) to any claim that "no section leaks".
    - >-
      Record lift coefficients and (P, d) in rows, so that replays need no producer RNG.
    - >-
      Apply the same controls to sibling EXP-CZLIFT-ae0a13 (non-anomalous). Its naive and Teichmuller
      sections on CM curves are deterministic sections with the same exact-null and automorphism issues.

  counterexample_or_mutation: >-
    Counterexample to "the next digit equals d at the random rate 1/p for every section": the Teichmuller
    section on the canonical lift y^2 = x^3 + 5 of the D = -3 anomalous curve at p = 7. The next-digit unit
    is u(kG) = 5/k exactly, so the ratio is d^{-1} != d for every allowed d, and the rate is 0 against 1/7.
    The same forced failure holds for d in mu_6 \ {+-1} on canonical and isomorphic j = 0 lifts at every
    tested p. Mutation: switching the degenerate-rate definition from vQ >= vP to all v >= 2 moves the
    correct null from 1/p to 1/(p+1).

  baseline_comparison: >-
    No cost claim is made, and the spec and hypothesis carry no dominated_by field. If the degenerate-lift
    next digit were framed as an attack, it would be dominated on every axis by three baselines. (1) Smart
    / Satoh-Araki / Semaev on a non-canonical lift: polynomial time, success 1 - 1/p per random lift.
    (2) Pollard rho: about sqrt(pi p / 4) group operations, sqrt(6) fewer at j = 0 using the
    automorphisms. (3) BSGS: about 2 sqrt(p) operations and sqrt(p) memory. At rate about 1/p per trial,
    the next-digit procedure needs about p trials.

  heuristic_challenges:
    - >-
      Prediction 3's "random rate 1/p" is an unnumbered random-model heuristic, and the record states no
      distributional model. The model that makes it exact is "leading digits of tau = s - (torsion section)
      uniform and independent". That transfers to the randomized section (hensel_random: exact
      0.98-1.01 x 1/(p+1)) but not to structured sections. Cheapest exposing experiment: an exhaustive
      (P, d) count for the Teichmuller section on the p = 7 canonical j = 0 lift (rate 0; under 0.1 s).
    - >-
      Derived reading of what the next digit measures: on a split lift, for rows with vP = 2, success iff
      s(dP) = [d]s(P) in E(Z/p^2), i.e. the section is d-homogeneous mod p^2. This was verified on 4214 of
      4214 rows (rt_r2_homogeneity_output.json). The "noise" is the section's non-homomorphy mod p^2. It
      is a property of the section, not of the lift's torsion points.

  cost_model_challenges:
    - not_applicable: no cost table, speedup or exponent claim in this contract.

  reduction_and_scope_challenges:
    - >-
      The RQ-CZLIFT-b9f765 decision target (a) wording "every non-canonical section recovers d at the
      random rate 1/p" is inflated relative to the measurement. Three sections, toy p, pooled, with
      per-cell structure.
    - >-
      DEC-20261009-9f9254's user-clause reading "on anomalous curves the canonical curve lift is the one
      lift where Smart fails" is correct but known. It should cite Belding 2007, section 7, and Serre-Tate,
      not this experiment, as its source.
    - >-
      Nothing here transfers to non-anomalous curves. The PTM-1 measurement shows that every lift of a
      non-anomalous curve behaves like the split case: the flag is point-dependent and Smart's ratio is
      about 1/p on canonical and perturbed lifts alike.

  proof_architecture_challenges:
    - >-
      Observation-fiber attack on the rule: the full fiber of lifts mod p^2 was swept. Exactly one class
      is degenerate, and no point or section separates lifts within a class. No fiber escapes.
    - >-
      Nearby-object attack (PTM-1): the argument separates anomalous from non-anomalous curves only
      through the premise #E = p. The recovery sentence needs the operative condition "P has no torsion
      lift".
    - >-
      Boundary attack: the e = 1 boundary (v = 1 vs v = 2) is sharp and tested. The e = 3 boundary is
      untestable over Z_p beyond (3, 6].

  obstruction_resource_readings:
    - obstruction: 'the canonical lift is exactly the lift on which Smart''s attack degenerates'
      measured_quantity: >-
        A point-independent one-bit invariant of the curve lift: v_p(z([p]P^)) >= 2, equivalently
        E^(Z/p^2) = (Z/p)^2, equivalently the Kummer class of the Serre-Tate parameter mod p^2.
      resource_reading: >-
        This bit is the input to canonical-lift computation. An O(log p) p-adic test recognizes the
        canonical class mod p^2 without knowing j_can; the non-CM sweep recovers j_can mod p^2 on 10
        curves. Theory that takes it as hypothesis: Serre-Tate canonical-lift algorithms (Satoh-type point
        counting; recalled, not retrieved). It is no resource for ECDLP, because anomalous curves are
        already polynomial-time.
    - obstruction: 'on degenerate lifts the next digit is lift-noise'
      measured_quantity: >-
        P_{P,d}[s(dP) = [d]s(P) mod p^2], the d-homogeneity of the section mod p^2 (equivalence verified
        on 4214/4214 rows).
      resource_reading: >-
        Theory that takes it as hypothesis: splitting of 0 -> E_1/E_2 -> E^(Z/p^2) -> E(F_p) -> 0. On a
        split lift the homomorphic sections form a torsor under Hom(E(F_p), F_p) = F_p. The torsion section
        is the trivial point; every other homomorphic section is P~ + c log(P) T0, a DL oracle. A section
        with rate 1/p + eps has DL advantage eps. The obstruction therefore reduces "find a useful section
        on the canonical lift" to "compute a homomorphic non-torsion section mod p^2", which is equivalent
        to DL. That is a reduction, not an impossibility: closure covers the three tested sections at
        p <= 1373 only. For non-anomalous curves the sequence splits on every lift (coprime orders), which
        is the measured PTM-1 behaviour and the structural reason the goal's transfer target sees noise.
        It is consistent with, but independent of, EXP-CZLIFT-ae0a13.
    - obstruction: 'Teichmuller below-rate at j = 0'
      measured_quantity: 'forced failure on d in mu_6 \ {+-1} (0 successes on all canonical and isomorphic j = 0 lifts)'
      resource_reading: >-
        This is the CM automorphism group acting through conjugate embeddings on the formal group and the
        etale quotient. The theory that uses the same automorphisms is the sqrt(|Aut|) Pollard-rho speedup
        (Duursma-Gaudry-Morain; Wiener-Zuccherato; recalled, not retrieved). It is no new leverage.
  spawned_ids: []
  spawned_ids_note: >-
    No ideas were filed; ideas/ and ledger/ are outside the write scope. The second resource reading
    (next digit = homogeneity mod p^2) is a candidate for the Coordinator's ranking only as a design
    simplification for sibling experiments, which can measure section homogeneity mod p^2 directly without
    multiplying by p. It is not a candidate attack.

  narrowest_supported_statement: >-
    The scope is the 29 class-number-one CM anomalous curves with 7 <= p <= 1373 (D in {-3, -11, -19,
    -43, -67, -163}), at precision p^8, on unramified integral short Weierstrass Z_p-lifts in the four
    sampled classes (v_p(Delta j) in {1, 2, 3, inf} at e = 1 and {3, 6, inf} at e = 3), with the naive,
    Teichmuller and one-digit Hensel sections. (a) The point-arithmetic degeneracy flag and the j-distance
    rule agreed on all 14,616 rows. This calibrates two code-independent instruments against a statement
    that follows from Serre-Tate theory; it is not independent evidence for it. (b) Smart's ratio
    recovered d on every non-degenerate row (Smart's theorem). (c) On degenerate lifts the pooled
    next-digit success rate was consistent with the random-section null: all-v >= 2 definition with its
    matching null 1/(p+1), z = +0.68 and +0.02; exact nulls conditioned on the actual lifts, z = +1.54 and
    +0.75. Per-section rates are consistent with exact per-lift nulls (Teichmuller z = -1.48 and -0.84),
    and the Teichmuller shortfall against 1/p is explained by CM-automorphism structure at j = 0. No
    section showed an excess at p > 500: 1-3 successes per section out of 1200 rows, against 40 expected
    under a 1/sqrt(p) leak.

  strength_assessment: >-
    Clauses 1-2 (rule, non-split recovery): established by derivation and prior art, not by this
    experiment. The experiment's contribution is strong instrument calibration: 0 disagreements on 14,616
    rows, and 0 on 12,778 full-fiber lifts in the red-team sweep. Clause 3 (next digit at 1/p): supported
    at toy tier only in the pooled sense, with a corrected null and with per-section exceptions explained.
    The fitting status is "supported (toy), known theory confirmed". It should not be promoted as a new
    obstruction or finding, because the novelty is at most the j-distance form with e = 3 at j = 0 for
    explicit CM j_can. Belding 2007 noted that no simple j-only criterion over Z/p^2 was known to her;
    with j_can explicit the criterion is j = j_can mod p^2 for e = 1, which is immediate from deformation
    theory.

