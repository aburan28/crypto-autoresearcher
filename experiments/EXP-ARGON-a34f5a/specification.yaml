experiment:
  id: EXP-ARGON-a34f5a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0a95c8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0a95c8
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Decomposition of the Argon2 per-lane back-distance profile and depth-reducing-set size into
    a candidate-window-geometry component and an offset-transform component, using two synthetic hybrids
    and a double-destruction null at matched size
  objective: The one uncertainty a run reduces is whether the observable this lane's central mechanism
    claim rests on can distinguish the two structural features that could produce it. (i) The collision
    question -- whether the candidate window's segment geometry alone, with a perfectly uniform draw
    inside it, already produces short position-dependent back distances and a measurable depth effect
    -- is answered by constructing that exact object as HYBRID A and measuring it against a double-destruction
    null with no geometry and no transform. (ii) The attribution question is answered by the second
    hybrid, which preserves the transform's density shape over a full-history support, so that the
    geometry and transform components are defined by construction rather than fitted, and their ratio
    says which dominates. (iii) The separability question -- whether the two causes decompose at all
    -- is answered by the interaction term and by the position range over which it stays small; a
    large interaction means the lane's explanatory vocabulary is under-determined by this observable,
    which is a bound worth more than a number. The run does not test H-ARGON-ef2f0b's hypothesis,
    produces no security statement, and implements no attack.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the four constructed objects
      at the declared p=1 cells, measured with identical code and the lane''s existing greedy threshold,
      the back-distance profiles and depth-reducing-set sizes take the reported values, the geometry
      and transform components and their interaction take the reported values with twenty-draw spreads,
      and the components separate or fail to separate over the reported position range. WHAT DOES
      NOT FOLLOW: nothing about whether either feature causes anything in a design sense; nothing
      that confirms or refutes H-ARGON-ef2f0b, whose hypothesis this run does not test; nothing about
      Argon2''s security or about any parameter set; nothing about multi-lane graphs or recommended
      parameters; and no property of either hybrid is a property of any deployable design, since the
      hybrids exist only inside the harness.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of human time): re-read the offset transform''s exact numeric
      form in KN-LIT-7f3c21, since EV-ARGON-209ece records the earlier recalled form as having the
      right shape and an imprecise exponent, and declare the HYBRID B rescaling rule plus one alternative
      rescaling in a pre-registration file. STAGE 1 (cost: low): implement all four objects behind
      one interface differing only in support rule and density rule. STAGE 2 (cost: negligible): verify
      the double-destruction NULL shows a flat back-distance profile with no sawtooth; halt otherwise.
      STAGE 3 (cost: negligible): cross-check HYBRID A against EXP-ARGON-2608c2''s G_unif construction
      and reconcile any divergence before proceeding. STAGE 4 (cost: minutes per cell): draw twenty
      realizations of each object per cell and measure back-distance profiles, sawtooth amplitudes,
      greedy depth-reducing-set sizes and exact native depths with identical code. STAGE 5 (cost:
      negligible): compute the two components, the interaction and their spreads, and locate the position
      range of separability. STAGE 6 (cost: low): repeat stage 4 for the alternative HYBRID B rescaling
      as a sensitivity check. No attack, no credential data.'
    instrument: Python 3 with numpy for all four object constructions behind one support-rule-and-density-rule
      interface; the lane's existing greedy depth-reducing-set implementation imported unchanged with
      its existing tie-breaking, plus an exact linear-time longest-path DP for native depth; harness/runner.py
      for seeding, parameter capture and manifests; plain JSON serialization of every constructed
      array so any component can be independently recomputed without re-running. Exact integer arithmetic
      for all removal-set sizes and depths; floating point confined to distribution summaries. No
      Sage, no computer-algebra system, no external Argon2 library.
    parameters: 'p=1. Variants Argon2i and Argon2id, with Argon2id reported split at its pass-0-slice-1
      boundary. t in {1, 3}, matching the RFC 9106 recommended pass counts. q in {1024, 4096}. Four
      objects: REAL, HYBRID A (RFC geometry, uniform density), HYBRID B (full-history support, RFC
      density shape rescaled), NULL (full-history support, uniform density). Twenty independent draws
      per object per cell. Greedy depth threshold at 50 percent of native depth, matching H-ARGON-ef2f0b.
      One alternative HYBRID B rescaling carried as a sensitivity arm. Ten synthetic input draws for
      the data-dependent portions. All seed material synthetic and generated in-run; no password,
      credential, leaked corpus or third-party dataset at any stage.'
  controls:
  - Double-destruction NULL with a forced flat back-distance profile and no sawtooth, gating everything
    downstream.
  - Twenty independent draws per object per cell, so that every component carries a spread and unmeasurable
    components are reported as such.
  - Identical measurement code across all four objects, verified by measuring one object through two
    entry points.
  - 'The structural tell: the geometry component must shrink as the window grows toward full history
    within a pass, and a flat geometry component across positions is the artifact signature.'
  - HYBRID A cross-checked against EXP-ARGON-2608c2's G_unif construction, since they should be the
    same object and a disagreement would reveal a specification divergence between contracts.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The double-destruction NULL -- full-history window with a uniform draw
    -- is the zero of the decomposition and is the random object of the same shape in the strict sense:
    same node count, same edge count, same one-reference-edge-per-block structure, no window geometry
    and no transform. Every one of the four objects is measured by identical code in the same invocation.
    For the decomposition to mean anything the NULL must show a flat back-distance profile with no
    sawtooth and no position dependence beyond the trivial growth of available history; if the NULL
    shows a sawtooth, the sawtooth is being introduced by the harness rather than by the geometry
    and everything downstream is invalid. Additionally, each of the four objects is drawn twenty times
    independently so that every reported component carries a spread, and a component smaller than
    its own spread is reported as not measurable rather than as small.'
  independent_variables:
  - support rule, in {RFC candidate window, full history}
  - density rule, in {RFC offset transform, uniform}
  - t, in {1, 3}
  - q, in {1024, 4096}
  - variant, in {Argon2i, Argon2id}
  metrics:
    primary:
    - geometry component of depth-reducing-set size, HYBRID A minus NULL, with spread
    - transform component, HYBRID B minus NULL, with spread
    - ratio of transform component to geometry component
    - interaction term relative to the larger component
    secondary:
    - back-distance distribution by position for each object
    - sawtooth amplitude at slice boundaries for each object
    - exact native depth per object
    - adjacent-position back-distance correlation
    - sensitivity of the transform component to the alternative rescaling
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio of the transform component to the geometry component of the depth-reducing-set
      size, and the size of the interaction term relative to the larger component.
    formula: Let D(X) be the median greedy depth-reducing-set size over twenty draws of object X.
      Geometry component G = D(NULL) - D(HYBRID A). Transform component T = D(NULL) - D(HYBRID B).
      Interaction I = D(NULL) - D(REAL) - G - T. Predicted G outside its twenty-draw spread; predicted
      T/G < 1.0; predicted |I| / max(G, T) < 0.25; NULL sawtooth amplitude forced to indistinguishable
      from zero.
    source: Pre-registered in the parent proposal IDEA-20260816-0a95c8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p=1 and q in {1024, 4096}, two to four binary orders below the second
      RFC 9106 recommended tuple''s per-lane block count. The quantity of interest is a RATIO between
      two components measured on the same graphs at the same size, so the common reduction does not
      obviously bias it; however the geometry component specifically depends on the ratio of window
      size to lane length, which changes with q, so the ratio is expected to move with scale and is
      reported per q rather than pooled. The transfer assumption is stated as unresolved: a geometry-dominant
      reading at q=1024 does not imply one at recommended q, and the two tested q values exist precisely
      so the direction of movement is visible rather than assumed.'
    correspondence: null
  tail_checks:
  - Inspect the back-distance profile position by position across a full pass rather than only its
    summary statistics, since the sawtooth is the signature the whole decomposition rests on.
  - Inspect the extreme draws of each object, since a heavy-tailed removal-set-size distribution would
    invalidate the component spreads.
  - Inspect the first slice of the first pass separately, where the window is smallest and the geometry
    component should be largest.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the double-destruction NULL shows any sawtooth, since the harness would then be introducing
    the signal.
  - Halt and reconcile if HYBRID A disagrees with EXP-ARGON-2608c2's G_unif construction, since two
    contracts would be building different objects under one name.
  - Stop and report partial results if wall clock exceeds two hours, recording completed cells; incompleteness
    is a budget outcome and never a null decomposition.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The NULL shows no sawtooth, HYBRID A reconciles with the existing G_unif construction,
    all four objects complete twenty draws at every cell, and the two components, the interaction
    and their spreads are reported per cell with the separability range -- irrespective of which component
    dominates.
  falsification_criterion:
  - Geometry component indistinguishable from zero.
  - Transform-to-geometry ratio above 1.0.
  - Interaction above a quarter of the larger component across most positions.
  - NULL shows a sawtooth.
  - HYBRID A disagrees with EXP-ARGON-2608c2's G_unif.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0a95c8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The HYBRID B rescaling rule is the construction's load-bearing choice and is declared rather than
    derived; the Coordinator must fix it and rule on whether the single alternative carried as a sensitivity
    arm is sufficient.
  - The exact numeric form of the RFC offset transform must be re-read and written into the contract
    verbatim, since EV-ARGON-209ece records the earlier recalled form as having an imprecise exponent
    that was correctly not asserted.
  - Whether additivity is the right decomposition for a nonlinear graph functional is unresolved;
    the interaction term measures the failure but the Coordinator must decide what interaction size
    makes a decomposition inadmissible rather than merely noisy.
  - Whether Argon2id should be reported split at its indexing boundary or excluded from the decomposition
    entirely is a definitional choice this record leaves open.
