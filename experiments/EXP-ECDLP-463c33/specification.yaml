# EXP-ECDLP-463c33
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-c78546.
experiment:
  id: EXP-ECDLP-463c33
  hypothesis_id: H-ECDLP-728b98
  source_idea: IDEA-20261004-1f8492
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-18 table versus width-17 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-c78546
  objective: >-
    Check the table sizes 131072 and 65536, the product 8589934592, and the nearby gap 0.
  inputs:
    width_hi: 18
    width_lo: 17
    table_hi: 131072
    table_lo: 65536
    table_gap: 65536
    table_product: 8589934592
    table_sum: 196608
    nearby_a: 65536
    nearby_b: 65536
    nearby_gap: 0
    nearby_product: 4294967296
  controls:
    - >-
      Two to the power 17 is 131072. Two to the power 16 is 65536.
      Reporting both tables as size 65536 drops the gap and invalidates
      the run.
    - >-
      One hundred thirty-one thousand seventy-two exceeds sixty-five
      thousand five hundred thirty-six by 65536. The product of the two
      sizes is 8589934592. Their sum is 196608.
    - >-
      Two width-17 tables each store 65536. Their gap is 0 and their
      product is 4294967296.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-18 table stores 131072 entries. The width-17 table stores
      65536. The gap of two width-17 tables is 0.
    formula: >-
      Compute 2 to the power 17. Compute 2 to the power 16. Subtract
      65536 from 131072. Multiply 131072 by 65536. Subtract 65536 from 65536.
    source: >-
      IDEA-20261004-1f8492 states the widths 18 and 17 and the sizes
      131072 and 65536, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 8589934592 and the nearby gap 0 are required. A check that stops at the size 131072 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 131072 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 17 is not 131072.
    - Two to the power 16 is not 65536.
    - The gap is not 65536.
    - The product is not 8589934592.
    - Both tables are reported as size 65536, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-18 table stores 131072 entries, that
    the width-17 table stores 65536, and that 131072 exceeds 65536 by 65536.
  falsification_criterion: >-
    The runs agree that the width-18 table size is computed, and
    that size is not 131072.
  required_artifacts:
    - experiments/EXP-ECDLP-463c33/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-463c33/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-463c33/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-463c33/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-463c33/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-463c33/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 65536 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
