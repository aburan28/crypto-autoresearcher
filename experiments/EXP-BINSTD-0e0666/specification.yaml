# =============================================================================
# EXP-BINSTD-0e0666 -- Frozen contract for H-BINSTD-6428a3: HOLD-R
# supersession — absolute Frobenius has no per-instance symmetry-breaking
# form; Lemma A2-prime coincidence census + C1 loss law at toy n in
# {17,23,31}.
#
# Source: IDEA-20261001-93e740 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved: DEC-20261002-ff7924. Snapshot: TASK-20261002-7dee0c.
# Executor: TASK-20261002-24d44d.
#
# HOLD-X5 (IDEA-20260926-9c5694 / EXP-CERTBIN-a14350 on PR #1565) designed
# separately without folding this Stage-2 census. Opens as its own
# zero-solver BINSTD unit. Supersedes IDEA-20260922-7ab503 content
# (EXP-BINSTD-cfa7cf on the withdrawn reading); original not edited.
# Stages 0-4. ZERO RUNS in the design session. No AUXIN. No Bedrock.
# Claim tier: control / toy. No attack / exponent claim.
# =============================================================================
experiment:
  id: EXP-BINSTD-0e0666
  version: 1
  hypothesis_id: H-BINSTD-6428a3
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-93e740
  supersedes_idea: IDEA-20260922-7ab503
  related_idea_ids:
    - IDEA-20260926-9c5694
    - IDEA-20261001-e740ce
    - IDEA-20260906-a77711
  goal_id: GOAL-ECDLP2M-001
  designed_by_task: TASK-20261002-7dee0c
  snapshot_task: TASK-20261002-7dee0c
  executor_task: TASK-20261002-24d44d
  title: >-
    HOLD-R supersession: Stage-0 ord/lattice/identity worksheet; Stage-1
    setup + Cayley check + fixture F0; Stage-2 n=17 full-G census (cheapest
    discriminator); Stage-3 n=23 stable bases; Stage-4 n=31 halving route +
    200-target sample — A2-prime, H1 Poisson, setwise closure, C1 loss
  status: approved
  approved_by: DEC-20261002-ff7924
  # Top-level frozen/execution_authorized are what tools/experiment_execution.py
  # load_plan reads (nested approval.frozen alone is not sufficient).
  # Surfaced additively by AMD-EXP-BINSTD-0e0666-20261002-admission.
  frozen: true
  frozen_at: '2026-10-02'
  execution_authorized: true
  execution_authorized_stages: [0, 1, 2, 3, 4]
  execution_authorized_note: >-
    Stages 0-4 authorized by DEC-20261002-ff7924 under AGENTS.md standing
    user authorization (2026-09-06). Trial-plan-v1 admits Stages 0-1 first.
    No Magma/Sage/AUXIN/Bedrock. No n>=131 attack. No IC-vs-rho claim.
  approval:
    approved_by: DEC-20261002-ff7924
    standing_authorization: >-
      AGENTS.md standing user authorization (2026-09-06). Protocol complete;
      Coordinator checked required fields before approving.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    frozen: true
    execution_state: >-
      approved frozen contract; trial-plan-v1 + implementation/run.py admit
      Stages 0-1 under TASK-20261002-24d44d (AMD-EXP-BINSTD-0e0666-20261002-admission)

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-0e0666/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-0e0666/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-0e0666/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-0e0666/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-0e0666/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py (+ gf2.py, curve.py) are the hash-bound sources. Stage 0 is
      zero-compute worksheet arithmetic and must be the first admitted trial.
      {run_dir} is substituted by the process supervisor.

  objective: >-
    (1) Freeze Stage-0 zero-compute worksheet: ord_n(2) and stable-subspace
    lattices at n in {17,23,31,41,131,163}; Lemma A2-prime and claim-(D)
    identity written out; H1 design means. (2) Stage-1: build Koblitz toys
    at n=17/23/31, admit G, find lambda, factor Phi_n, build bases, run
    Cayley-accident check, run fixture F0. (3) Stage-2 (cheapest
    discriminator): full-G census at n=17 across five bases — brute Sol,
    coincidences, halving route, setwise closure, C1 + random-hash filter.
    (4) Stage-3: n=23 stable l=11,12. (5) Stage-4: n=31 halving route on
    stable l=15,16 plus 200-target sample for closure/C1. Emit exactly one
    O-* label. Observations only.

  claim_tier: control
  claim_tier_note: >-
    Toy control census at m=2, n in {17,23,31}. No IC-vs-rho claim, no
    deployed-curve verdict, no exponent move. Infrastructure failure →
    O-IMPEDIMENT, never evidence.

  inputs:
    proposal: ledger/proposals/IDEA-20261001-93e740.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-6428a3.yaml
    decision: ledger/decisions/DEC-20261002-ff7924.yaml
    worksheet: >-
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-04a6be/revision/TASK-20260929-3907b4/revision-worksheet.yaml
    related:
      - ledger/proposals/IDEA-20260922-7ab503.yaml
      - ledger/proposals/IDEA-20260926-9c5694.yaml
      - ledger/proposals/IDEA-20261001-e740ce.yaml
      - ledger/proposals/IDEA-20260906-a77711.yaml
      - ledger/decisions/DEC-20260929-7257b2.yaml
      - ledger/decisions/DEC-20260928-63addc.yaml
      - ledger/decisions/DEC-20260924-99ce20.yaml
    hold_x5_pointer: >-
      EXP-CERTBIN-a14350 (PR #1565) — conjugate-attempt correlation /
      Propositions T and Sigma; read-only pointer; do not edit that contract
      under this card.
    superseded_design_pointer: >-
      EXP-BINSTD-cfa7cf (PR #1544) — designed under the withdrawn
      per-instance Frobenius-symmetry reading of 7ab503; do not amend that
      contract under this card; this card supersedes the scientific content.
    off_limits:
      - Editing IDEA-20261001-93e740 / 7ab503 / 9c5694 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Opening IDEA-20260926-89886c / which-algebra NA-2 under this card.
      - Magma / Sage / AUXIN as success path.
      - Amazon Bedrock.
      - Any run at n>=131 or any deployed-curve attack claim.
      - Treating halving coincidences as a cost resource.
      - m!=2 measured arms under this card.

  controls:
    - name: fixture_F0
      description: >-
        (i) Squaring transports every certified Sol(R,V) tuple into
        Sol(sigma R, sigma V) on all of G at n=17. (ii) Brute-force
        coincidence set equals halving-route set tuple-by-tuple.
        (iii) Global C1 survival equals 1/n on every stable base.
    - name: ordinary_curve_null
      description: >-
        RC-1 curve over the n=17 field (b not in F_2); same bases;
        coincidence rate must follow the same formula without endomorphism.
    - name: random_hash_filter
      description: >-
        Keep each tuple at rate 1/n; under H2 must reproduce C1's
        per-target loss statistics.
    - name: nonstable_bases
      description: >-
        Polynomial window V={deg < l} and seeded random V' of the same
        dimension, where sigma does not preserve the base.
    - name: cayley_accident_check
      description: >-
        For each (j,s), test k_{j,s} in <-1,lambda> before any count is
        compared with mu; members reported separately.

  independent_variables:
    - name: field_degree
      levels: [17, 23, 31]
    - name: base_kind
      levels: [stable_V, window_deg, random_V]
    - name: subspace_dim_l
      levels: [8, 9, 11, 12, 15, 16]
    - name: curve_shape
      levels: [koblitz_a1, koblitz_a0, ordinary_RC1]
    - name: arity_m
      levels: [2]
    - name: c1_tuple_order
      levels: [necklace, polynomial_integer]

  primary_metrics:
    - name: coincidence_halving_form_fraction
      definition: >-
        Fraction of common tuples satisfying 2 P_1 = (1 - s lambda^j) R
        for one leg by exact group arithmetic; must be 1.0.
    - name: N_coinc
      definition: >-
        Count of triples (x(R),t,j) with t in Sol(R,V) and Sol(sigma^j R,V),
        with per-(j,s) breakdown; compared to H1 Poisson 99% interval.
    - name: setwise_closure_count
      definition: >-
        Number of targets R with nonempty Sol(R,V) closed under some
        sigma^j; must be 0.
    - name: c1_global_survival_fraction
      definition: Fraction of (R,t) incidences surviving rule C1; must equal 1/n.
    - name: c1_all_lost_fraction
      definition: >-
        Fraction of decomposable targets whose every solution C1 discards;
        compared to binomial thinning prediction.
    - name: outcome_label
      definition: >-
        Exactly one of O-A2PRIME / O-ZERO / O-SYMMETRY / O-NOLOSS / O-MODEL /
        O-ARTIFACT / O-IMPEDIMENT.

  secondary_metrics:
    - name: null_over_koblitz_coincidence_rate
      definition: Ordinary-null vs Koblitz coincidence rate per (R,j).
    - name: kappa_and_F_V
      definition: Measured kappa and |F_V| per cell and base.
    - name: lambda_order
      definition: Order of lambda on G; must equal n.
    - name: cayley_accident_flags
      definition: Per-(j,s) membership of k_{j,s} in <-1,lambda>.
    - name: w_s_histogram
      definition: Measured distribution of solution counts per target.
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed stage.
    - name: wall_clock_seconds
      definition: Wall clock per cell and per stage aggregate.

  seeds_and_replication:
    master_seed: 2026100293
    stage2_coverage: all of G at n=17
    stage3_coverage: all of G at n=23 on stable l=11,12
    stage4_sample_targets: 200
    cheapest_discriminator: >-
      Stage 2 at n=17 alone (seconds): decides among withdrawn per-instance
      symmetry (all-lost=0, closure>0), a77711 original A2 (N_coinc=0), and
      A2-prime (halving-form coincidences at about mu).
    replication: >-
      Single primary replication under this card; seed and instance-set
      rule frozen in stage0/preregistered-predictions.json. Headline
      O-SYMMETRY requires a replicate before interpretation; second seed
      out of scope unless O-ARTIFACT triggers a repair amendment.

  budget:
    wall_clock_seconds: 28800
    memory_gb: 8
    maximum_runs: 3
    cpu_note: >-
      Advisory. Stage 0 is zero compute. Stage 2 estimate seconds; Stage 3
      minutes; Stage 4 hours (halving route). Freeze scientific sample
      counts; do not expand to m!=2, n=41 measurement, or deployed curves
      with leftover wall clock. n=41 remains arithmetic-only.

  stopping_rules:
    - Stage 0 must freeze predictions before any Stage-1 metric is read.
    - Fixture F0 failure → O-ARTIFACT; do not read directional metrics.
    - Non-halving common tuple → O-ARTIFACT; run void until resolved.
    - C1 survival != 1/n → O-ARTIFACT; instrument defect.
    - Timeout / OOM / crash / build failure → O-IMPEDIMENT; never negative evidence.
    - After exactly one O-* is decided, stop; Stage 3/4 may be skipped if Stage 2 alone decides O-ZERO or O-SYMMETRY with F0 pass and the contract's cheapest-discriminator rule is cited.
    - No m!=2 or n>=131 expansion under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze invalidates subsequent stages.
    - Changing seed, base construction, or total order mid-cell without an amendment invalidates counts.
    - Mixing HOLD-X5 conjugate-attempt cells into this card's RESULTS without amendment is out of scope.
    - Any claim of speedup / exponent / deployed break in RESULTS.md invalidates the scientific read (scope defect).
    - Amending EXP-BINSTD-cfa7cf or EXP-CERTBIN-a14350 under this card is out of scope.

  success_criterion: >-
    Decidable from the primary metrics before any run. The experiment
    SUCCEEDS as a measurement (either outcome direction) when all of:
    (1) Stage 0 worksheet present with ord_n(2)/stable lattices,
    Lemma A2-prime, claim-(D) identity, and H1 design means, frozen in
    stage0/preregistered-predictions.json before Stage 1; (2) Fixture F0
    passes OR exactly one of O-ARTIFACT / O-IMPEDIMENT is named with no
    directional read; (3) exactly one O-* label in RESULTS.md decidable
    from primary metrics alone (O-A2PRIME / O-ZERO / O-SYMMETRY / O-NOLOSS /
    O-MODEL / O-ARTIFACT / O-IMPEDIMENT); (4) peak RSS reported beside every
    timed stage; (5) Magma / Sage / AUXIN / Bedrock were not used as the
    success path. Scientific direction is read from the O-* label and does
    not alter success-as-measurement.

  falsification_criterion: >-
    Stated before any run, scoped to the tested (m=2, n in {17,23,31})
    cells. H-BINSTD-6428a3 is falsified directionally by: O-ZERO (N_coinc=0
    on every n=17/23 base — H1 fails toward a77711 original); O-SYMMETRY
    (setwise_closure_count > 0 — per-instance Frobenius symmetry revived);
    O-NOLOSS (C1 all-lost <= 0.5 at n=17 — withdrawn 7ab503 loss prediction
    survives); O-MODEL (N_coinc outside H1 bands on >=2 bases, no Cayley
    accident). Fixture F0 failure, non-halving common tuple, or C1 survival
    != 1/n is O-ARTIFACT (instrument / soundness defect): run void; not
    directional evidence. Timeout / crash / build failure is O-IMPEDIMENT /
    failed_infrastructure, never negative mathematical evidence. No outcome
    under this card asserts an IC-vs-rho, deployed-curve, or exponent claim.

  success_criteria:
    - Stage 0 worksheet present with ord/lattice/identity/H1 means.
    - Fixture F0 pass (or O-ARTIFACT/O-IMPEDIMENT named).
    - Exactly one O-* label in RESULTS.md, decidable from primary metrics alone.
    - Memory reported beside time.
    - No Magma/Sage/AUXIN/Bedrock used as success path.

  falsification_criteria:
    - Per H-BINSTD-6428a3 falsification_criteria (non-halving, N_coinc=0, Poisson band, closure, all-lost, F0/C1 survival).

  required_artifacts:
    - experiments/EXP-BINSTD-0e0666/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-0e0666/stage0/worksheet-note.md
    - experiments/EXP-BINSTD-0e0666/stage1/fixture-F0.json
    - experiments/EXP-BINSTD-0e0666/stage1/curves-bases-lambda.json
    - experiments/EXP-BINSTD-0e0666/stage1/cayley-accident.json
    - experiments/EXP-BINSTD-0e0666/stage2/census-n17.jsonl
    - experiments/EXP-BINSTD-0e0666/stage2/arm-summaries.json
    - experiments/EXP-BINSTD-0e0666/stage3/census-n23.jsonl
    - experiments/EXP-BINSTD-0e0666/stage4/halving-n31.jsonl
    - experiments/EXP-BINSTD-0e0666/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-0e0666/RESULTS.md

  stages:
    - id: 0
      name: zero_compute_worksheet
      description: >-
        ord_n(2) and stable-subspace lattices at {17,23,31,41,131,163};
        Lemma A2-prime and claim-(D) identity written out; H1 design means;
        freeze preregistered predictions including Poisson bands and
        withdrawn comparators (all-lost=0; N_coinc=0).
      compute: none
    - id: 1
      name: setup_fixture_F0_cayley
      description: >-
        Build Koblitz toys n=17/23/31; admit G; find lambda; factor Phi_n;
        construct stable/window/random bases; Cayley-accident check;
        fixture F0 (i)–(iii).
      compute: setup
    - id: 2
      name: n17_full_G_census
      description: >-
        Cheapest valid discriminator. All of G at n=17; five bases;
        brute Sol; coincidences; halving route; setwise closure; C1 +
        random-hash filter; both tuple orders.
      compute: measurement
      cheapest_valid_discriminator: Stage 2 at n=17 alone
    - id: 3
      name: n23_stable_census
      description: Stages 2(a)–(e) on stable l=11 and 12, all of G.
      compute: measurement
    - id: 4
      name: n31_halving_and_sample
      description: >-
        Halving route on stable l=15,16 over all of F_V; 200-target seeded
        sample for Sol/closure/C1. n=41 arithmetic only.
      compute: measurement

  protocol_amendments_path: experiments/EXP-BINSTD-0e0666/amendments/
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
