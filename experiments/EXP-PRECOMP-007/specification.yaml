experiment:
  id: EXP-PRECOMP-007
  status: proposed
  title: Incremental SAT and target-independent learned-clause reuse
  objective: >-
    Separate static point-decomposition constraints from target-dependent
    assumptions, then measure whether incremental solving and reusable learned
    clauses reduce conflicts and wall time on unseen targets.
  fixtures:
    field_bits: [11, 13, 16, 20, 24, 28]
    curve_seeds: [1, 2, 3]
    holdout_targets: 500
    decomposition_arities: [2, 3]
  variants:
    - cold_sat
    - incremental_with_assumptions
    - static_clause_cache
    - validated_target_independent_learned_clause_cache
  safety_rule: >-
    A learned clause is reusable only if its validity under removal/change of
    target assumptions is proven by the solver interface or independently
    checked. Never reuse a target-dependent learned clause by heuristic tagging.
  metrics:
    primary: conflict_reduction_ratio
    required:
      - warm_speedup
      - cold_conflicts
      - warm_conflicts
      - static_clause_count
      - reusable_learned_clause_count
      - clause_cache_bytes
      - fallback_or_reset_count
      - verification_failures
  controls:
    - matched cold SAT solve
    - exact decomposition verification
    - SAT and UNSAT strata reported separately
  success_criterion: >-
    Median conflicts decrease >=5x and median end-to-end time decreases >=3x
    in two >=20-bit cells with zero unsound accepted results.
  strong_signal: >-
    Warm SAT beats the matched warm F4 strategy from PRECOMP-002/004 on
    relation throughput even if cold SAT is slower.
  falsification_hook: >-
    Reusable-clause count remains negligible or conflict/time reduction is <2x
    throughout the completed ladder.
  depends_on: [EXP-PRECOMP-001]
