experiment:
  id: EXP-EQJ-48c911
  hypothesis_id: H-EQJ-7e870f
  derived_from_idea: IDEA-20260807-394cf4
  question_id: RQ-EQJ-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    The two observations DEC-20260718-006 detached and nobody picked up -
    distinct-row collapse at larger k/p and m equal to 5, and the per-block mass
    vector w_lambda measured as a curve invariant across distinct same-order
    curves, against a widened random-subset null and a blocking forced-zero
    isotype gate

  objective: >-
    The one uncertainty a run reduces - whether the two measurements EV-EQJ-001
    recorded and DEC-20260718-006 explicitly detached from the killed isotypic
    cost mechanism are properties of the ECDLP relation module or artifacts of the
    single cell and single curve they were measured on. A run establishes (i) the
    ratio of distinct coefficient rows to relations at two larger k/p ratios and at
    m equal to 5, per prime and never pooled, which is simultaneously the retest of
    the confound EV-EQJ-001 says could mask block-rank arrival at much larger k/p;
    (ii) the between-curve spread of w_lambda across three distinct curves of each
    of two orders, against a random-subset null envelope widened well beyond the
    committed 8 draws, which decides whether the 7.5 to 152 sigma departure carries
    curve-distinguishing bits or is forced by S_3-invariance; and (iii) whether the
    harness reproduces the committed p equal to 4099 distinct-row counts and |z|
    range, without which no new number from it means anything. No attack, break,
    speedup or security consequence is claimed here or would follow from a run.

  what_this_is_not:
  - >-
    Not a revival of the isotypic linear-algebra COST mechanism. EV-EQJ-001 killed
    it, DEC-20260718-006 recorded the kill, and this contract does not dispute
    either. The objects here are the distinct-row count and the block-mass vector.
  - >-
    Not an attack, a distinguisher with a claimed use, or a cost improvement of any
    kind. Compressibility bears on linear-algebra memory and is measured, not
    costed.
  - >-
    Not a status change to any hypothesis, evidence record, decision or goal, and
    not a promotion of any knowledge entry.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at p equal to 1009 and 4099, at the executed k/p
      ratios and m values, the distinct-row ratio has a stated value per cell and a
      stated trend per prime, and w_lambda has a stated between-curve spread across
      the three executed curves per order against a stated null envelope. WHAT DOES
      NOT FOLLOW - nothing about larger p, since HEUR-EQJ2-1 is only weakly tested
      by two primes; no cost number for the linear-algebra stage; no solving-degree
      statement; no attack; and specifically NOT that a measured non-generic
      w_lambda is usable for anything, which would require a separate contract and
      a red-team pass first.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Declare the two larger k/p ratios, the m
      values, the widened null draw count, the definition of between-curve spread,
      and the decision thresholds - what counts as the ratio continuing to fall and
      what counts as a between-curve spread exceeding the within-curve null. All
      fixed before any new cell is computed, because a threshold chosen after
      seeing a spread is a fit to noise.
      STAGE 1 (regression, blocking). Reproduce EV-EQJ-001's committed p equal to
      4099 measurements - 11 to 15 distinct coefficient rows and the per-block |z|
      range 7.5 to 152 against the 8-draw null - on the committed cell before any
      extension. A harness that does not reproduce the committed record is not
      measuring the new cells either.
      STAGE 2 (forced-zero gate, blocking). The 6 representation-theoretically zero
      isotypes must be EXACTLY zero in every cell computed, old and new. A nonzero
      value means the projection is wrong and the run stops.
      STAGE 3 (null widening, run BEFORE any between-curve reading). Extend the
      random-subset null from 8 draws to the Stage 0 declared count at every cell,
      and report the resulting envelope. The committed 8-draw null is too small to
      support a between-curve comparison and the contract says so in advance.
      STAGE 4 (arm C1, compressibility). Compute the distinct-row census at the
      committed k/p ratio and at the two larger ones, and at m equal to 5, at both
      primes. Report the RATIO of distinct rows to relations, never the raw count,
      since larger k/p changes r_full mechanically. Report r_full and k in the same
      row so a block-rank arrival is visible.
      STAGE 5 (arm C2, curve dependence). Compute w_lambda on three distinct curves
      of each order at each prime, recording the isogeny class of each curve, and
      report the between-curve spread per block against the widened null envelope.
      STAGE 6 (zero compute). Assemble the ratio trend per prime with NO pooling
      across primes, the between-curve spread table with isogeny classes attached,
      the HEUR-EQJ2-1 per-p trend, and the refusal statement for any quantity
      outside what was computed.
    instrument: >-
      The isotypic decomposition harness of experiments/EXP-EQJ-001, extended to
      larger k/p ratios, to m equal to 5, and to multiple curves per order.
      Recorded through harness/runner.py with the instrument sha256 recorded
      against the pinned EXP-EQJ-001 instrument.
    parameters: >-
      Primes 1009 and 4099. k/p at the committed ratio plus two larger ratios,
      exact values fixed at Stage 0. m at the committed value plus m equal to 5.
      Three distinct curves per order per prime, each with its isogeny class
      recorded. Random-subset null widened from 8 draws to the Stage 0 declared
      count. Isotypes - 10 blocks, of which 6 are representation-theoretically zero
      and 4 carry mass per EV-EQJ-001.

  controls:
  - >-
    WIDENED RANDOM-SUBSET NULL, mandatory and run first - the 8-draw null
    EV-EQJ-001 implements, extended to the Stage 0 declared count at every new
    cell. The committed 8-draw envelope is too small to support a between-curve
    spread reading, and widening it before the reading rather than after is what
    keeps the reading honest.
  - >-
    SAME-ORDER SECOND AND THIRD CURVE, the null for arm C2 - if w_lambda is
    identical across same-order curves it is not a curve invariant. Isogeny class
    recorded per curve, since same-order curves may be isogenous and that is not
    independence.
  - >-
    FORCED-ZERO ISOTYPE GATE, blocking - the 6 representation-theoretically zero
    isotypes must remain exactly zero in every cell. A nonzero value means the
    projection is wrong and no reading is admissible.
  - >-
    COMMITTED-VALUE REGRESSION, blocking - reproduce the 11 to 15 distinct-row
    counts and the |z| range 7.5 to 152 at p equal to 4099 before extending.
  - >-
    RATIO-NOT-COUNT CONTROL - the distinct-row metric is reported as a ratio to the
    relation count, because larger k/p changes r_full mechanically and a raw count
    would trend for that reason alone.
  - >-
    NO-POOLING RULE - results are reported per prime and never pooled across primes,
    since HEUR-EQJ2-1 is exactly the assumption pooling would smuggle in.

  independent_variables:
  - prime p in 1009, 4099
  - 'k/p ratio - committed value plus two larger values'
  - 'm - committed value and 5'
  - 'curve identity within a fixed order - three distinct curves, isogeny class recorded'
  - 'arm - EC relation module versus widened random-subset null'

  metrics:
    primary:
    - >-
      distinct-row ratio - dimensionless in (0,1] - number of DISTINCT coefficient
      rows divided by number of relations, per (prime, k/p, m) cell, never pooled
      across primes
    - >-
      between-curve spread of w_lambda - same units as w_lambda, one value per
      isotype block - computed as the range over the three distinct same-order
      curves, reported per block per (prime, order) against the widened
      within-curve null envelope
    - >-
      forced-zero verdict - boolean per cell - whether all 6
      representation-theoretically zero isotypes were exactly zero
    - >-
      regression agreement - boolean - whether Stage 1 reproduced the committed
      p equal to 4099 distinct-row counts and |z| range
    secondary:
    - >-
      w_lambda per curve - the full 10-vector, retained raw so a summary cannot
      hide a single block that moved
    - >-
      r_full and k per cell - integers - reported together so a block-rank arrival
      (r_full reaching k) is visible rather than inferred
    - >-
      per-block |z| against the widened null - dimensionless - the analogue of the
      committed 7.5 to 152 range, recomputed against the wider envelope
    - >-
      isogeny class of every curve used, and the number of distinct isogeny classes
      represented per order
    - >-
      widened null envelope width per block, reported alongside the committed
      8-draw width so the effect of widening is visible
    - >-
      wall time and peak memory per cell, and an explicit list of censored cells

  heuristic_under_test:
    id: HEUR-EQJ2-1
    formal_statement: >-
      The distinct-row collapse measured at p at most 4099 is indicative of the
      behaviour at larger p, in the sense that the direction of the trend in
      distinct rows divided by relations as k/p grows does not reverse with p.
    tested_here: partially
    how: >-
      By reporting the trend separately at p equal to 1009 and p equal to 4099 and
      REFUSING to pool them. Two primes is a weak test and is declared as such; the
      parent proposal's validation plan says to extend to a fourth p if the trend is
      ambiguous, which is out of this contract's budget and is recorded as a
      derivation gap rather than performed silently.

  preregistered_prediction:
    quantity: >-
      The distinct-row ratio at the two larger k/p ratios relative to the committed
      ratio at each prime, and the between-curve spread of w_lambda relative to the
      widened within-curve null spread.
    formula: >-
      rho(prime, k/p, m) := |distinct coefficient rows| / |relations|. Predicted
      strictly decreasing in k/p at each prime across the three ratios. Spread(block)
      := range of w_lambda[block] over the three same-order curves; predicted greater
      than the widened within-curve null spread at at least one block. Under the null
      that the collapse is a sampling artifact, rho is flat or increasing in k/p.
      Under the null that w_lambda is forced by S_3-invariance, Spread is at or below
      the null spread at every block.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-394cf4, whose predictions
      block states continued decline at two larger k/p ratios and between-curve
      spread exceeding the within-curve null spread at any block, and whose
      honest_prior_of_survival records 0.7 for the first and 0.35 for the second
      before any run under this contract exists. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at p equal to 1009 and 4099, matching the primes EV-EQJ-001 used, so
      that the committed values can serve as a blocking regression. The whole design
      depends on comparability with that record, which is only available at those
      sizes. The transfer assumption to larger p is HEUR-EQJ2-1, is tested only by a
      two-prime comparison with no pooling, and is NOT used to claim anything about
      larger p.
    correspondence: null

  tail_checks:
  - >-
    Report r_full and k in the same row at every cell; a cell where r_full reaches k
    is the block-rank arrival the confound predicts and must not be summarised away.
  - >-
    Report the full 10-vector w_lambda per curve, not a norm; the free part is only a
    4-vector and a norm can hide a single block that moved.
  - >-
    Report the number of DISTINCT ISOGENY CLASSES among the three same-order curves;
    a spread measured only within one isogeny class is weaker evidence than one
    across classes and must be labelled.
  - >-
    Report the widened null envelope alongside the committed 8-draw envelope, so the
    reader can see how much of any change in |z| is the widening rather than the data.
  - >-
    Refuse any cell with fewer relations than the committed cell had and report the
    shortfall, since a ratio computed on fewer relations is not comparable.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4.0
    maximum_memory_gb: 16
    maximum_runs: 36

  stopping_rules:
  - >-
    Stop immediately if the Stage 1 regression does not reproduce the committed
    p equal to 4099 distinct-row counts and |z| range.
  - >-
    Stop immediately if any of the 6 representation-theoretically zero isotypes is
    nonzero in any cell.
  - >-
    Do not read any between-curve spread before the widened null has been computed at
    that cell in the same invocation.
  - >-
    Stop at the declared k/p ratios and m values. Adding a ratio after seeing a trend
    is a different experiment and requires a new contract.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion
    is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence
    (AGENTS.md rule 5).
  - >-
    A run whose widened null was not computed in the same invocation as the arm it is
    compared against is invalid_measurement.
  - >-
    A run pooling the distinct-row ratio across primes is invalid_measurement -
    pooling smuggles in exactly the heuristic under test.
  - >-
    A run reporting a between-curve spread without the isogeny class of each curve is
    invalid_measurement, since same-order isogenous curves are not independent draws.
  - >-
    A run reporting raw distinct-row COUNTS as the trend metric instead of the ratio
    is invalid_measurement, since the count trends mechanically with k/p.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment
    and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    The Stage 1 regression reproduces the committed p equal to 4099 values, the
    forced-zero gate passes in every cell, the widened null is computed at every
    cell, and the run reports the distinct-row ratio with r_full and k at all three
    k/p ratios and both m values at both primes, together with the full w_lambda
    10-vector and between-curve spread for three distinct curves of each order with
    isogeny classes attached. This criterion is decidable from the primary metrics
    alone and says nothing about which values those quantities take.

  falsification_criterion:
  - >-
    The distinct-row ratio does not fall at the larger k/p ratios at either prime.
    C1 is false, the collapse is an artifact of the tested range, and the isotypic
    kill stands unqualified - which closes the compressibility observation
    DEC-20260718-006 detached, on a measurement.
  - >-
    w_lambda is identical across distinct same-order curves to within the widened
    null spread at every block, at both primes. C2 is false, w_lambda is forced by
    S_3-invariance, and the 7.5 to 152 sigma departure closes as a FORCED VALUE
    rather than remaining an unexplained signal. This is the modal outcome and is a
    first-class deliverable.
  - >-
    Any of the 6 representation-theoretically zero isotypes is nonzero anywhere. The
    projection is misimplemented and no reading of any arm is admissible.
  - >-
    The Stage 1 regression fails. The harness is not measuring the committed object
    and nothing at all is reportable.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model
    and inference block, instrument sha256 against the pinned EXP-EQJ-001 instrument,
    and environment
  - >-
    raw-result.json carrying every per-cell distinct-row count and relation count,
    every per-curve w_lambda 10-vector, and every null draw - not summaries
  - >-
    the widened null's per-draw measurements, in the same file as the signal arm
  - >-
    the Stage 0 pre-declaration text, written before any new cell is computed and
    hashed, containing the k/p ratios, the m values, the widened draw count, the
    spread definition and the decision thresholds
  - >-
    the Stage 1 regression output compared line by line against EV-EQJ-001's
    committed distinct-row counts and |z| range
  - >-
    the curve list with the isogeny class of every curve used, and an explicit list
    of censored cells

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement
    approval is the USER's gate because it authorizes execution and spends compute.
    This contract is NOT approved - approved_by is null and execution_authorized is
    false (AGENTS.md rule 1).
  - >-
    The parent proposal is not proof-oriented and the paired hypothesis records
    not_applicable_reason on its proof_search_map, so no KN-TECH-080 audit is required
    before implementation. Promoting a measured non-generic w_lambda into a
    distinguisher or a cost mechanism would be proof-oriented and needs its own map,
    its own contract, and a red-team pass.
  - >-
    The k/p ratios, m values, widened null draw count, spread definition and decision
    thresholds must be recorded at Stage 0 before any new cell is computed.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260807-394cf4
    authored_at: '2026-08-25'
    note: >-
      Controls, metrics, predictions and falsification conditions are taken from the
      parent proposal's minimal_test, null_object_control, confounders and
      falsification_conditions blocks. The no-pooling rule and the ratio-not-count
      rule are the proposal's own confounders promoted to blocking invalidation rules.
      Committed values (11 to 15 distinct rows at p equal to 4099, |z| 7.5 to 152,
      4 of 10 isotypes carrying mass, r_lambda equal to r_full) are quoted from
      EV-EQJ-001 as that record's claims, not asserted here. Budgets come from the
      parent's declared estimated_cost (implementation low, compute medium). No field
      is invented.

  derivation_gaps:
  - >-
    The two larger k/p ratios are unspecified in the proposal. They must be pinned at
    Stage 0, because ratios chosen after seeing a trend would select for the outcome.
  - >-
    The widened null draw count is unspecified. The proposal says only widen it before
    reading a between-curve spread. A Coordinator must fix the count, and it should be
    derived from the smallest between-curve difference the run must be able to resolve
    rather than chosen by convenience.
  - >-
    Whether three distinct curves of the same order exist in DISTINCT isogeny classes
    at p equal to 1009 and 4099 is not established. If they do not, arm C2's null is
    weaker than intended and the executor must report that rather than substitute
    isogenous curves silently.
  - >-
    The parent's validation plan for HEUR-EQJ2-1 calls for a fourth prime if the trend
    is ambiguous. That is out of this contract's budget; an ambiguous trend is reported
    as ambiguous and triggers a new contract, not an in-flight extension.
  - >-
    Whether the harness supports m equal to 5 without redesign is unknown to this
    contract. If it does not, that arm is an instrumentation task reported as
    infrastructure, not absorbed into the run.
