experiment:
  id: EXP-MONO-4b50b6
  hypothesis_id: RQ-MONO-001
  hypothesis_id_note: >-
    GOAL-MONO-001 has no hypothesis record and active_hypothesis_ids is empty by
    design; this is a measurement against a research question, not a hypothesis
    test. RQ-MONO-001 is named in the hypothesis_id slot following the EV-AES-001
    convention already used in this ledger. NO HYPOTHESIS IS CREATED, ADOPTED OR
    MOVED BY THIS EXPERIMENT.
  goal_id: GOAL-MONO-001
  parent_goal_id: GOAL-PATH-001
  question_id: RQ-MONO-001
  open_problem_ref: KN-OPEN-009
  batch_id: BATCH-003
  version: 1
  supersedes_version: null
  title: >-
    Frobenius cycle-type census of the m=3 Semaev summation cover on generic
    ordinary prime-field curves, with a CM exception screen, under the frozen
    protocol MONO-m3-census-1.1.0-repair-cm-gate
  status: approved
  approved_by: coordinator
  authorizing_decision_id: DEC-20260802-505759
  frozen: true
  frozen_on: '2026-08-02'
  frozen_by_task: TASK-20260802-815548
  archived_by_task: TASK-20260802-d49dee

  protocol:
    version: MONO-m3-census-1.1.0-repair-cm-gate
    path: >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-002/tasks/TASK-20260725-705/monodromy_protocol.yaml
    sha256: 19f81d50dacf5049f03188e7e02c20711b361c8b8bb60b89e9437533fb9f0eb9
    sha256_note: >-
      Byte-identical to the hash recorded in the BATCH-002 snapshot receipt
      (ac09260135c2). The protocol this experiment executes is verifiably the one
      that passed independent red-team review at RT-20260725-707.
    review_status: >-
      red-team PASS RT-20260725-707, evidence EV-MONO-002, decision DEC-20260731-015
    this_experiment_changes_no_protocol_parameter: true

  claim_tier: toy
  confirmatory_status: confirmatory
  confirmatory_status_note: >-
    Confirmatory ONLY about the frozen protocol's named quantities at the pinned
    primes 211/431/809/1601, at m=3, with the pinned seed and sample count. It is
    never crypto-scale, never medium-scale, and is not an asymptotic support path.

  metrics:
    - freq_split_1_1
    - freq_inert_2
    - freq_ramified
    - freq_degree_drop
    - delta_split_vs_S2
    - abs_delta_split_vs_S2
    - weil_floor_abs
    - delta_over_weil
    - joint_relation_proxy_rate
    - quasirandom_relation_prediction
    - delta_relation_vs_quasirandom
    - uniform_window_rate
    - shuffled_window_rate
    - secondary_classifier_mismatches
    - sampled_vs_exact.abs_gap
    - exact_enumeration.delta_split_vs_S2
    - exact_enumeration.ratio_measured_over_quasirandom

  budget:
    wall_clock_seconds: 7200
    memory_gb: 2
    maximum_runs: 1
    actual_wall_clock_seconds: 13.755
    budget_note: >-
      The protocol's own estimate was 7200 s. Actual is 13.755 s because the
      quadratic-discriminant hot path is O(1) per sample and the closed form makes
      the exhaustive histogram O(p) per curve rather than O(p^2). Under budget by
      three orders of magnitude; recorded, not rounded.

  success_criterion: >-
    Exactly one outcome_id from {FULL_MONODROMY_BARRIER_TOY,
    RANDOM_PANEL_CALIBRATION_TOY, EXCEPTIONAL_LOCUS_TOY, SCOPED_PROTOCOL_NO_GO}
    is emitted, computed mechanically from the protocol's barrier_aggregate_rule,
    with every declared control reporting pass/fail alongside the quantity it
    measured, and with a deterministic reproduction command and artifact hashes
    recorded. SUCCESS IS A WELL-FORMED MEASUREMENT, NOT A PARTICULAR OUTCOME:
    SCOPED_PROTOCOL_NO_GO is an equally successful run of this experiment.

  falsification_criterion: >-
    The full-monodromy reading is falsified at toy scope if any admitted random
    ordinary control exceeds abs_delta_split_vs_S2 > 3*(2/sqrt p) after
    independent reverification with CM and automorphism confounds excluded. The
    exceptional-locus reading is falsified if every purported exception is
    j in {0,1728}, supersingular, anomalous, a normalization artifact, or fails
    reverification. Either instrument control failing (CTRL-S3-IDENTITY,
    CTRL-IMON-*) invalidates the protocol instance and supports neither reading.

  controls:
    - CTRL-S3-IDENTITY
    - CTRL-POS-PLANTED-SPLIT
    - CTRL-NEG-UNIFORM-WINDOW
    - CTRL-NEG-SHUFFLED-WINDOW
    - CTRL-IMON-PRODUCT-COVER
    - CTRL-IMON-RANDOM-DEG5
    - CTRL-J-EXCLUSION
    - CTRL-CM-ADMISSION
    - CTRL-CM-GATE-FULL
    - CTRL-CLAIM-WORDING
  additional_controls_beyond_the_frozen_protocol:
    note: >-
      These CONSTRAIN THE RUN FURTHER, never less. Adding controls to a frozen
      protocol is permitted; relaxing one is not, and none is relaxed.
    controls:
      - id: INSTRUMENT-DUAL-CLASSIFIER
        statement: >-
          Two independent classifier code paths (discriminant+Legendre and root
          scan) agree on a deterministic 1-in-50 subsample of every curve's census.
      - id: INSTRUMENT-SAMPLED-VS-EXACT
        statement: >-
          The sampled split frequency agrees with the closed-form exact value at 4
          binomial sigma on every curve.

  parameters:
    m: 3
    fibre_degree: 2
    primes: [211, 431, 809, 1601]
    field_bits: 11
    field_bits_semantics: >-
      Bit size of the largest prime exercised (1601), for the claim-tier check in
      tools/validate_ledger.py.
    master_seed: 20260725
    samples_per_curve: 30000
    curves_per_prime_min: 20
    factor_base_window_W: 4
    cm_screen_minimum: 8

  implementation:
    driver: experiments/EXP-MONO-4b50b6/mono3_census.py
    contract: experiments/EXP-MONO-4b50b6/contract.md
    language: python3
    dependencies: stdlib only

  interpretation_limits:
    - Toy primes only; NO extrapolation to 256-bit ECDLP.
    - >-
      Scoped to m=3, where deg_T S_3 = 2. At m >= 4 the fibre degree is
      2^{m-2} >= 4 and KN-OPEN-009 remains fully open. Nothing here closes it there.
    - >-
      joint_relation_proxy_rate is the frozen protocol's window proxy, not an
      index-calculus campaign, and correcting it confers no advantage over rho.
    - >-
      The 3*(2/sqrt p) envelope is a protocol pin, never a theorem.
    - Changes no hypothesis status; asserts nothing about ECDLP hardness.
