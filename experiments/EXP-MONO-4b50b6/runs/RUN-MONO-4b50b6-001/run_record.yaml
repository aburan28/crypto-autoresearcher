  measurements:
    sampled_census:
      random_panel_split_frequency_range: [0.4908, 0.5065]
      max_abs_delta_split_vs_S2: 0.0092
      max_delta_over_weil_floor: 0.1354
      pinned_envelope_multiplier: 3
      note: >-
        Every curve is inside the pinned 3*(2/sqrt p) envelope with at least a
        7x margin; the binding constraint on the sampled statistic is binomial
        noise (sigma ~ 0.0029 at 30000 samples), not curve-to-curve spread.
    dual_classifier:
      cross_checked_samples_per_curve: 600
      disagreements: 0
    sampled_vs_exact:
      max_abs_gap: 0.00806
      tolerance_4_sigma: 0.01155
      curves_failing: 0
    closed_form_check:
      statement: >-
        delta_split_vs_S2 == (t^2 - 2pZ + Z^2 - 2p + 2Z) / (2 p^2)
      curves_checked: 105
      mismatches: 0
    exact_deviation_bounds:
      random_panel_max_p_times_abs_delta: 0.9994
      cm_panel_max_p_times_abs_delta: 3.9941
      automorphism_panel_max_p_times_abs_delta: 3.9941
      reading: >-
        p * |delta| stays below 1 when Z = 0 and below 4 when Z = 3, matching the
        contract's Corollary C bound exactly. The deviation is O(1/p), not
        O(1/sqrt p).
    planted_split_control:
      trials: 1594
      rate: 1.0
      primes: [211, 431, 809, 1601]
      reading: >-
        Fibres over x-coordinates of genuine F_p-rational points split without a
        single exception. This is the direct empirical face of Corollary E.
    relation_rate_proxy:
      exact_ratio_measured_over_quasirandom_range: [1.4897, 1.5102]
      curves: 80
      off_diagonal_conditional_split_probability: 1.0
      reading: >-
        The quasirandom independence model understates the m=3 joint relation
        proxy by a factor 1/freq_split ~ 2 on the off-diagonal, ~1.5 including
        the x1==x2 degree-drop diagonal at W_eff=4. A CONSTANT FACTOR; it moves
        no exponent.
    instrument_controls:
      product_cover_5cycle_rate: 0.0
      product_cover_4plus1_rate: 0.0
      random_deg5_5cycle_rate: 0.2026
      random_deg5_4plus1_rate: 0.2451
      reading: >-
        The factorization harness demonstrably detects a non-full group before
        any S_2 agreement is trusted.

  failures_and_infrastructure:
    - none
  defects_found_and_fixed_before_the_recorded_run:
    - id: SELF-1
      what: >-
        The first draft compared the reduced j-invariant against the INTEGER
        1728 in three places (random-panel exclusion, exclusion_flags, and
        CTRL-J-EXCLUSION). 1728 reduces to 40, 4, 110 and 127 at the four pinned
        primes, so an extra-automorphism curve could have entered the random
        panel undetected at every pinned prime.
      found_by: producer self-audit before the recorded run
      fixed: >-
        is_extra_automorphism_j compares j mod p against 0 and 1728 mod p.
      did_it_affect_any_recorded_number: >-
        NO. The discarded pre-fix run was checked and contained zero leaked
        curves, but the check was unsound and the recorded run is the post-fix
        one. Recorded rather than omitted.

  interpretation_limits:
    - Toy primes 211-1601 only. NO extrapolation to 256-bit ECDLP.
    - >-
      Everything is scoped to m = 3, where deg_T S_3 = 2. At m >= 4 the fibre
      degree is 2^{m-2} >= 4, no analogous discriminant factorization is claimed,
      and KN-OPEN-009 stays fully open.
    - >-
      joint_relation_proxy_rate is the frozen protocol's window proxy, not an
      index-calculus campaign. It is a planning model, and correcting it confers
      no advantage over Pollard rho.
    - >-
      The 3*(2/sqrt p) envelope is a protocol pin, never a theorem. Only the
      Chebotarev 1/2 prediction is theorem-backed by KN-LIT-039.
    - >-
      This run changes no hypothesis status and asserts nothing about ECDLP
      hardness in either direction.
