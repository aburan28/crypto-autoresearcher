    checks:
      V1_identity_over_Z:
        statement: "disc_T S_3(x1,x2,T) - 16*f(x1)*f(x2) == 0 in Z[x1,x2,A,B]"
        method: >-
          Exact evaluation on the grid [-3,3]^4. The difference has degree at most
          6 in each variable and 7 > 6 points per variable determine it uniquely,
          so vanishing on the grid IS A PROOF over Z - not a probabilistic test
          and not a CAS assertion.
        grid_points: 2401
        grid_counterexamples: 0
        random_points: 20000
        random_counterexamples: 0
        discharges: >-
          RT O-6. RUN-001's contract.md asserted a sympy verification the archived
          package did not contain.
        pass: true
      V2_exhaustive_enumeration:
        statement: >-
          Cycle type of every one of the p^2 specialisations, counted, then
          compared against the closed form. INDEPENDENT OF THE CLOSED FORM: it
          counts, it does not evaluate S^2+N^2-(p-Z).
        curves: 19
        total_pairs_enumerated: 17054059
        disagreements: 0
        polynomial_classifier_spotcheck_mismatches: 0
        ramified_strata_observed: [0, 1254, 2574, 4842, 9594]
        discharges: >-
          RT O-4 and O-5. RUN-001 named its field exact_enumeration while
          computing it from the closed form, which made the census's confirmation
          of Corollary C circular. This breaks the loop.
        pass: true
      V3_trace_formula:
        statement: "delta_split == (t^2 - 2pZ + Z^2 - 2p + 2Z)/(2p^2)"
        curves: 105
        mismatches: 0
        max_p_times_abs_delta: 3.994066208619644
        discharges: "RT O-5: the formula is now evaluated in the harness, not post hoc."
        pass: true
      V4_factor_base_premise:
        statement: >-
          Every off-diagonal factor-base pair CLASSIFIED and chi(f(x)) checked on
          every window element, so Corollary E's numerator is measured rather than
          assumed.
        curves: 105
        off_diagonal_pairs_classified: 1196
        non_split_pairs: 0
        conditional_split_probability: 1.0
        degenerate_windows_found: 2
        degenerate_windows_note: >-
          Two curves (p=809 A=795 B=0; p=1601 A=250 B=0) have a 2-torsion
          lexicographically-smallest point, so the generator has order 2 and
          W_eff collapses to 1. BOTH ARE IN THE QUARANTINED AUTOMORPHISM PANEL
          and enter no aggregate, so nothing reported is affected - but the
          harness has no guard against this and the successor must add one.
          Independently found by RT O-8c.
        discharges: "RT O-8c."
        pass: true
      V5_null_control_power:
        statement: >-
          CTRL-NEG-UNIFORM-WINDOW and CTRL-NEG-SHUFFLED-WINDOW compare an ABSOLUTE
          difference against expected rates of order 1e-4 to 1e-6.
        tolerance_over_expected_by_prime: {211: 56, 431: 232, 809: 818, 1601: 3204}
        largest_W_eff_still_passing_by_prime: {211: 30, 431: 61, 809: 114, 1601: 226}
        empty_window_passes_at_every_prime: true
        verdict: pass_without_power
        discharges: "RT O-7 and validator V-14, both independently."
        note: >-
          THE PROTOCOL IS IMMUTABLE AND THESE CONTROLS ARE NOT RELAXED. They are
          still evaluated and still reported as the protocol requires; this check
          records that their pass carries no information at the pinned primes.
      V6_sampled_census_power:
        statement: >-
          What the frozen SAMPLED census actually yields, so that no downstream
          record can quote a closed-form number as "measured".
        sampled_relation_ratio_range_by_prime:
          211: [0.7536, 2.4117]
          431: [0.0, 4.6533]
          809: [0.0, 10.9812]
          1601: [0.0, 10.7611]
        curves_with_zero_joint_hits: {211: 0, 431: 3, 809: 10, 1601: 16}
        expected_joint_hits_per_curve: {211: 8.09, 431: 1.94, 809: 0.55, 1601: 0.14}
        sampled_p_times_abs_delta_max: {211: 1.625, 431: 3.074, 809: 7.443, 1601: 10.833}
        exact_p_times_abs_delta_max: {211: 0.7275, 431: 0.9988, 809: 0.9994, 1601: 0.9922}
        binomial_sigma_at_30000_samples: 0.00289
        verdict: >-
          THE PER-CURVE SAMPLED CENSUS IS UNDERPOWERED for an O(1/p) effect at
          every pinned prime: sigma 0.00289 exceeds the whole random-panel effect
          bound 1/p at p >= 431 and is comparable to it at p=211.
        discharges: "RT O-3 (blocking) and validator V-19."
      V7_outcome_with_reverification_honoured:
        defect: >-
          RUN-001's aggregate_outcome tests only passes_full_monodromy_test and
          never reads reverify_exception[].disposition, so a curve whose
          reverification returned failed_infrastructure would have been promoted
          to EXCEPTIONAL_LOCUS_TOY - INVERTING AGENTS.md RULE 3.
        found_by: "validator V-20 gap 1"
        reverifications_recorded: 0
        latent_not_exercised: true
        emitted_outcome_id: FULL_MONODROMY_BARRIER_TOY
        outcome_with_disposition_honoured: FULL_MONODROMY_BARRIER_TOY
        pass: true
        note: >-
          The emitted outcome is unaffected because zero exception candidates
          arose. THE DEFECT IS REAL AND LATENT; the successor harness must carry
          the corrected rule. Recorded in the batch correction record.
      V8_pooled_null_object_test:
        statement: >-
          The real factor-base window against a shuffled window of identical size
          - a null object of the same shape - pooled over every random control.
        pooled_draws: 2400000
        real_window_ratio_vs_quasirandom: 1.5313
        real_window_z: 6.3397
        shuffled_null_ratio_vs_quasirandom: 0.7305
        shuffled_null_z: -3.2149
        ratio_of_ratios_real_over_null: 2.0962
        predicted_ratio_of_ratios: "1/freq_split ~ 2.01"
        diagonal_artifact: >-
          BOTH arms are divided by the harness's quasirandom prediction
          freq_split*(W_eff/p)^2, which treats the x1==x2 diagonal as eligible
          when it is always degree_drop and can never split. That inflates the
          denominator by W_eff/(W_eff-1) = 4/3 IN BOTH ARMS, which is exactly why
          the null arm sits at 0.7305 = 0.75 rather than 1.0. THE ARTIFACT CANCELS
          IN THE RATIO OF RATIOS, which is the actual null-object comparison.
        reading: >-
          The excess is present on the real factor base and ABSENT from a null
          window of identical size, and the ratio of ratios recovers the predicted
          factor 2. THIS IS THE EMPIRICAL FACE OF COROLLARY E, and it exists only
          POOLED: per curve the statistic is Poisson noise at p >= 431.
        pass: true
