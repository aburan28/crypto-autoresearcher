experiment:
  id: EXP-SLHDSA-62bb4a
  hypothesis_id: H-SLHDSA-9e09aa
  derived_from_idea: IDEA-20260805-705614
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Standalone quantifier-order audit of the FORS interleaved-target bound - the
    unconditional worst-case-occupancy vacuity computation, the exact S1-versus-S2
    surrogate slack over six FIPS 205 sets and four tail targets, the k = 1
    forced-zero null, the VARIANT-P nearby-object separation, and the
    resubmission-budget ladder that prices the control interface
  objective: >-
    The one uncertainty a run reduces is WHICH SET OF OCCUPANCY VECTORS the
    quantifier over adversaries in the FORS interleaved-target bound ranges over,
    since the bound's tightness reduces entirely to that. A run establishes
    (i) the exact integer p_wc = 2^{k(64-a)-h} in log2 at the six FIPS 205
    parameter sets, deciding unconditionally whether any worst-case-occupancy
    bound can be non-vacuous there; (ii) the exact slack_1(q, s) between the
    max-load surrogate S1 and the exact moment S2 over four tail-probability
    targets, whose SIGN is forced by the power-mean inequality and whose SIZE is
    the measurement; (iii) whether the pipeline reports EXACTLY zero separation
    at k = 1, where the whole apparatus must collapse; (iv) the separation in
    bits between SLH-DSA and the hypothetical VARIANT-P under one identical
    pipeline, which is what the message randomizer is worth on this axis and is a
    number this corpus does not have; (v) whether the achievable max occupancy is
    monotone along a resubmission-budget ladder interpolating between the two
    interfaces; and (vi) whether a verbatim quotation from the primary text
    identifies which rung of the surrogate ladder the published bound stands on.
    NO ATTACK ON SLH-DSA IS PROPOSED, ATTEMPTED, OR IMPLIED BY ANY OUTCOME.
  what_this_is_not:
    - >-
      Not an attack on SLH-DSA, not a forgery, not a key recovery, not a break of
      any kind. The only attack costed is against VARIANT-P, a hypothetical
      control object constructed here.
    - >-
      VARIANT-P IS NOT SLH-DSA AND IS NOT ANY DEPLOYED SCHEME. Reporting it as if
      it were is the principal risk of this work and every artifact carries the
      label.
    - >-
      NOT A FAULT, ROWHAMMER, OR MEMORY-CORRUPTION RESULT, AND NOT COMPARABLE TO
      ONE. That claim class is strictly separate under RQ-SLHDSA-001 and no
      artifact of this contract may cite, combine with, or appear alongside one.
    - >-
      Not a security level for SLH-DSA. Any output sentence of the form "SLH-DSA
      has N bits of security" is an invalidation event, not a result.
    - >-
      Not a claim about the WOTS+ layer or the hypertree, which have their own
      bounds and their own quantifiers.
    - >-
      NOT A SECOND COPY OF THE CONCRETE-COST RE-DERIVATION. That is
      IDEA-20260805-fbe36a's job, carried by EXP-SLHDSA-9cbad4; see
      derivation_gaps for the overlap this contract must be deduplicated against
      before approval.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: derived_exact
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the six FIPS 205 parameter sets, given the
      recalled (h, a, k) tuples and q = 2^64, a worst-case-occupancy bound on the
      FORS interleaved-target advantage is vacuous by the computed number of
      bits; the max-load surrogate S1 is loose against the exact moment S2 by the
      tabulated slack_1(q, s); and under one identical pipeline VARIANT-P
      separates from SLH-DSA by the computed number of bits at 128s. WHAT DOES
      NOT FOLLOW - nothing about SLH-DSA's security; nothing about which rung the
      published text stands on ABSENT A VERBATIM QUOTATION; nothing about
      VARIANT-P as a deployed object, because it is not one; nothing about the
      WOTS+ or hypertree layers; and no operational consequence for any
      standardized parameter set. The vacuity result is EXACT ARITHMETIC
      conditional only on the recalled parameters - if a parameter tuple is
      wrong, that set's result is wrong, which is why the tuples are a Stage-0
      verification item rather than an assumption.
  inputs:
    procedure: >-
      STAGE 0-A (zero compute, ORDERING CONTROL) - commit and HASH the surrogate
      ladder computation and the VARIANT-P derivation BEFORE any primary text is
      read, so the ladder cannot be reverse-engineered to match the text. STAGE
      0-B (reading task, HARD GATE ON HEUR-001) - verify against FIPS 205 that
      SK.prf is in the PRF input in EVERY signing mode, including the
      deterministic mode. If ANY mode makes the index publicly computable, HALT
      AND ESCALATE under AGENTS.md rule 12; do not continue and do not write the
      finding up here. Also verify the six (h, a, k) tuples. If the text is
      unobtainable, record that explicitly and proceed with the parameters marked
      RECALLED-UNVERIFIED throughout. STAGE 1, ARM Q1 (seconds, exact integers) -
      compute p_wc = 2^{k(64-a)-h} in log2 at each of the six sets. If any is at
      most 0 the audit's premise is wrong for that set and the line terminates
      there. STAGE 2, ARM Q2 (seconds) - compute G(s) exactly as the smallest
      integer with 2^h * P[Poisson(lambda) > G] <= 2^{-s} by rational tail
      search, then slack_1(q, s) = log2(q * G^{k-1}) - log2(2^h * T_k(lambda)),
      over six sets crossed with s in {64, 128, 192, 256}. STAGE 3, THE k = 1
      NULL (seconds) - run the identical pipeline at k = 1 and confirm EXACTLY
      zero separation between S0, S1 and S2. STAGE 4, VARIANT-P (one page plus a
      small exact computation, needs NO primary text) - RE-DERIVE the
      multi-collision cost from first principles with every step shown, make the
      coupon-collector step for G rigorous or replace it with an exact
      expected-cover computation, and compute the separation from SLH-DSA in
      bits under the identical pipeline. STAGE 5, THE RESUBMISSION LADDER
      (seconds) - compute the achievable max_i gamma_i for r in {0, 1, 4, 16, 64}
      and check monotonicity, with r = 0 reproducing the pure multinomial
      exactly. STAGE 6, ARM Q4 (reading) - obtain a verbatim quotation with
      equation or theorem number identifying the rung, or record explicitly that
      the text could not be obtained under the goal's declared source-preference
      order. STAGE 7 (zero compute) - assemble the tables and the refusal
      statement.
    instrument: >-
      Pure Python EXACT integer and rational arithmetic. NO FLOATING POINT in any
      reported quantity; the Poisson tail search runs over rationals and G is
      returned as an exact integer. The VARIANT-P grinding cost is a written
      derivation with every step shown, not a formula lookup. SLH-DSA and
      VARIANT-P pass through ONE IDENTICAL pipeline, which is the whole point of
      the control. Recorded through harness/runner.py with a manifest and with
      the STAGE 0-A hash of the pre-committed ladder.
    parameters: >-
      Six FIPS 205 parameter sets with recalled tuples: 128s (h, a, k) =
      (63, 12, 14), 128f (66, 6, 33), 192s (63, 14, 17), 192f (66, 8, 33), 256s
      (64, 14, 22), 256f (68, 9, 35) - EVERY ONE RECALLED-UNVERIFIED and a
      Stage 0-B verification item. Signing-query budget q = 2^64.
      Tail-probability targets s in {64, 128, 192, 256}. Surrogate ladder S0, S1,
      S2, S3. Resubmission budgets r in {0, 1, 4, 16, 64}. VARIANT-P grinding
      parameter G about 2^a * ln(2^a), to be derived rather than assumed.
  controls:
    - >-
      NULL OBJECT, FORCED VALUE PRE-DERIVED, AND IT CAN FAIL - the reachable-set
      analysis at k = 1. With one FORS tree, sum_i gamma_i^1 = q identically for
      EVERY occupancy vector, so max equals min equals q and the worst case
      coincides with the exact moment. FORCED SLACK: EXACTLY 0 bits between S0,
      S1 and S2. If the pipeline reports ANY separation at k = 1 it is
      manufacturing structure and nothing may be reported from any arm.
    - >-
      POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR - VARIANT-P.
      The concentration effect MUST appear there, because the reachable set
      provably contains high-occupancy vectors when the index map is public. If
      the pipeline reports no advantage for VARIANT-P, the instrument is blind to
      the control interface and NO NEGATIVE RESULT ABOUT SLH-DSA MAY BE REPORTED
      FROM ANY ARM.
    - >-
      GRADED CONTROL, FIVE INTERIOR POINTS, MONOTONICITY REPORTED - the
      resubmission-budget ladder r in {0, 1, 4, 16, 64} interpolating between the
      two interfaces. This turns "the randomizer matters" into "here is the RATE
      at which it stops mattering" and localises any failure to a specific
      interface strength.
    - >-
      ORDERING CONTROL - the surrogate-ladder computation and the VARIANT-P
      derivation are committed and HASHED before Stage 0-B's primary text is
      read, so the ladder cannot be reverse-engineered to match the text.
    - >-
      SIGN CONTROL - slack_1 is forced strictly positive by the power-mean
      inequality, so a non-positive value is an arithmetic or implementation
      error rather than a discovery, and the pipeline must flag it as such.
    - >-
      ARCHIVE CHECK (zero compute) - no prior quantifier-order audit exists in
      this corpus for any scheme. Recorded as UNAVAILABLE, not as passed.
    - >-
      DERIVATION-NOT-CITATION CONTROL - the multi-collision cost is re-derived
      from first principles; if the derivation disagrees with the recalled form,
      the recalled form is discarded and the discrepancy recorded.
  independent_variables:
    - FIPS 205 parameter set (six values)
    - tail-probability target s in {64, 128, 192, 256}
    - surrogate rung S0 / S1 / S2 / S3
    - >-
      control interface - SLH-DSA (secret-keyed randomizer) versus VARIANT-P
      (publicly computable index)
    - resubmission budget r in {0, 1, 4, 16, 64}
    - number of FORS trees k, including the degenerate k = 1 null
  metrics:
    primary:
      - >-
        p_wc_log2 - log2 of the worst-case-occupancy per-attempt success
        probability 2^{k(64-a)-h} at q = 2^64 (bits), as an EXACT INTEGER per
        parameter set
      - >-
        slack_1 - log2(q * G^{k-1}) - log2(2^h * T_k(lambda)) (bits), exact, per
        parameter set per tail target s, with the G tail computation shown
      - >-
        k1_null_separation - the separation in bits between S0, S1 and S2 at
        k = 1; forced to be exactly 0
      - >-
        variant_p_separation - the difference in bits between the SLH-DSA and
        VARIANT-P costs under the identical pipeline at 128s
      - >-
        surrogate_rung_of_record - S1, S2, S3, an unlisted surrogate, or
        text_unobtainable (categorical), supported ONLY by a verbatim quotation
        with equation or theorem number
    secondary:
      - >-
        G_of_s - the exact integer G per parameter set per s (unitless), with its
        rational Poisson tail value
      - >-
        resubmission_ladder_max_occupancy - achievable max_i gamma_i (unitless
        count) at each r, plus a monotonicity boolean
      - >-
        multicollision_cost_derived_versus_recalled - the re-derived grinding
        cost in bits alongside the recalled 2^{h(G-1)/G} * G/e form, with the
        discrepancy if any
      - >-
        coupon_collector_status - one of {made_rigorous, replaced_by_exact_cover,
        still_a_sketch} (categorical)
      - >-
        parameter_tuple_verification_status per set - one of
        {verified_against_FIPS205, recalled_unverified, contradicted}
      - >-
        prf_mode_verification_status - one of {sk_prf_in_every_mode,
        index_publicly_computable_in_some_mode, text_unobtainable}; the middle
        value is an escalation event, not a metric reading
      - >-
        ladder_precommit_hash - the hash of the STAGE 0-A committed ladder, and
        whether it matches the ladder actually used
  heuristic_under_test:
    - id: HEUR-001
      formal_statement: >-
        For all adversaries A against SLH-DSA with the stated control interface,
        the reachable set Gamma(A) is supported on the uniform multinomial and A
        cannot shift its extremal k-th power sum by more than the multinomial's
        own upper tail; formally, no strategy A and no leaf i has
        E[gamma_i under A] exceeding q * 2^{-h} * (1 + negl).
      preregistered_prediction: >-
        FIPS 205 keeps SK.prf in the PRF input in EVERY signing mode, including
        the deterministic mode where opt_rand = PK.seed, so the index of an
        unsigned message is unpredictable to the adversary and the r = 0 cell of
        the resubmission ladder reproduces the pure multinomial exactly.
      prediction_source: >-
        RECALLED-UNVERIFIED reading of FIPS 205's signing algorithm, stated in
        IDEA-20260805-705614 and flagged there as "the highest-value reading task
        in the goal". NOT retrieved; NIST's site is recorded in RQ-SLHDSA-001 as
        proxy-blocked.
      scale_access_and_transfer: >-
        No sampling is involved - this heuristic is validated by READING a
        specification, not by measurement, and the VARIANT-P arm demonstrates
        quantitatively what a violation would look like. There is no scale and no
        transfer assumption.
      sample_size_justification: >-
        NOT APPLICABLE - the validation is a documentary check with a binary
        answer. The honest sample-size statement is that ONE verbatim reading of
        the signing algorithm settles it, and that no number of computations can
        substitute for it.
      comparison_metric: >-
        prf_mode_verification_status, supported by a verbatim quotation of the
        line placing SK.prf in the PRF input, per signing mode.
      tail_checks:
        - >-
          Check EVERY mode FIPS 205 defines, not only the default one; the
          failure this gate exists to catch would live in a mode nobody reads.
      falsification_condition: >-
        Any published or derived route by which an adversary influences
        (idx_tree, idx_leaf). Discovery is an AGENTS.md rule 12 EVENT: halt and
        escalate, do not write it up in this contract's artifacts.
    - id: HEUR-002
      formal_statement: >-
        The published FORS multi-target bound stands on rung S1 (max-load tail
        bound) or S2 (exact moment) of the surrogate ladder, not on S0.
      preregistered_prediction: >-
        A verbatim quotation from the primary text identifies S1 or S2. S0 is
        excluded UNCONDITIONALLY by the Q1 vacuity computation given the
        parameters, independently of any reading.
      prediction_source: >-
        Derived in IDEA-20260805-705614 from convexity plus the recalled
        parameters. Which of S1 and S2 is NOT derivable - this heuristic is the
        record's honest statement of what it does not know.
      scale_access_and_transfer: >-
        None. This is a claim about a DOCUMENT, not about a random object, and no
        random model applies to it.
      sample_size_justification: >-
        NOT APPLICABLE. One verbatim quotation with an equation or theorem number
        answers it; a paraphrase, a summary, or a model's recollection of the
        proof does NOT, and the absence of a quotation is recorded as absence.
      comparison_metric: >-
        surrogate_rung_of_record, supported by the quotation, or the explicit
        value text_unobtainable.
      tail_checks:
        - >-
          If the text uses a surrogate NOT on the ladder, record it verbatim and
          treat it as a SUCCESS, more interesting than either predicted rung.
      falsification_condition: >-
        The text stands on S0 - which the Q1 computation says would make the
        bound vacuous, so this outcome would indict either the recalled
        parameters or the reading, and both are re-checked before anything is
        stated.
  preregistered_prediction:
    quantity: >-
      p_wc_log2 at the six parameter sets, the sign of slack_1 everywhere,
      k1_null_separation, and variant_p_separation at 128s.
    formula: >-
      Predicted p_wc_log2 = 665, 1848, 787, 1782, 1036, 1857 at 128s / 128f /
      192s / 192f / 256s / 256f respectively - all strictly greater than 0, hence
      vacuous - as exact integers conditional on the recalled (h, a, k).
      Predicted slack_1 STRICTLY POSITIVE at every set and every s, forced by the
      power-mean inequality; NO NUMERIC PREDICTION IS PRE-REGISTERED FOR ITS
      SIZE, deliberately, because G depends on the tail-probability convention
      and this contract refuses to invent a number it has not derived. Predicted
      k1_null_separation = 0 EXACTLY. Predicted variant_p_separation at least 30
      bits, with a pre-registered estimate of about 57 bits (2^{133.7} for
      SLH-DSA against roughly 2^{76.7} for VARIANT-P); the 30-bit floor sits well
      below the estimate so a rough re-derivation cannot manufacture a pass.
      Predicted resubmission ladder monotone non-decreasing in r with r = 0
      reproducing the pure multinomial exactly.
    source: >-
      Pre-registered in IDEA-20260805-705614's `predictions` block (Q1 through
      Q5) and restated in H-SLHDSA-9e09aa before any run under this contract
      exists. The 2^{133.7} SLH-DSA comparison figure is CITED to
      IDEA-20260805-fbe36a and is NOT a measurement made here. Never tuned to
      data.
  scale_relevance:
    tier: derived_exact
    justification: >-
      This is not a sampling experiment and has no toy surrogate. Q1, Q2, Q3 and
      Q5 are EXACT integer and rational arithmetic evaluated directly AT the six
      FIPS 205 parameter sets - full deployed scale, because the quantities are
      closed forms in (h, a, k, q, s) rather than measurements. The ONLY
      dependence on scale is through the recalled parameter tuples, which is why
      verifying them is a Stage-0 item and why a wrong tuple invalidates exactly
      one set rather than the method. Q4 is a documentary question with no scale
      at all. The VARIANT-P figure is a DERIVED cost for a hypothetical object
      and transfers to nothing, because the object exists nowhere.
    correspondence: null
  tail_checks:
    - >-
      Report p_wc_log2 as an exact integer per set, never rounded, and report
      which (h, a, k) tuple produced it, so a wrong tuple is traceable to its set
      rather than contaminating the table.
    - >-
      Report the rational Poisson tail value at G and at G-1, so the exactness of
      the smallest-integer search is checkable.
    - >-
      Report slack_1 at the LARGEST and SMALLEST s, since the whole point of the
      s sweep is that the surrogate's looseness depends on the tail convention.
    - >-
      Report every step of the multi-collision re-derivation, and report the
      recalled formula alongside so the discrepancy (if any) is visible rather
      than absorbed.
    - >-
      Report the VARIANT-P figure as TIME-ONLY with its uncharged memory named,
      wherever it appears.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 10
  stopping_rules:
    - >-
      HALT AND ESCALATE under AGENTS.md rule 12 if Stage 0-B finds that any
      SLH-DSA signing mode makes the index publicly computable. The work is NOT
      written up in this contract's artifacts.
    - >-
      TERMINATE THE LINE at Stage 1 if p_wc_log2 is at most 0 at any set - the
      audit's premise is wrong for that set and the record must be superseded
      rather than patched.
    - >-
      HALT if the k = 1 null shows any non-zero separation; the pipeline is
      manufacturing structure.
    - >-
      Stop at the frozen six sets, four tail targets and five resubmission
      budgets. The surrogate ladder is committed and hashed BEFORE any text is
      read and is not revised afterwards.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
    - >-
      If the primary text is unobtainable, complete Stages 1 through 5 and record
      Q4 as `text_unobtainable`. Do NOT infer the rung from the numbers.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run in which SLH-DSA and VARIANT-P did NOT pass through the identical
      pipeline in the same invocation is invalid_measurement - the comparison the
      contract exists to make was not made.
    - >-
      A run whose k = 1 null was not executed is invalid_measurement, regardless
      of what the other arms report.
    - >-
      A run in which the ladder_precommit_hash does not match the ladder actually
      used is invalid_measurement; the ordering control failed and the ladder may
      have been fitted to the text.
    - >-
      A run reporting any quantity in floating point where an exact integer or
      rational was specified is invalid_reporting.
    - >-
      A run answering Q4 from a paraphrase, summary or recollection rather than a
      verbatim quotation is invalid_reporting; absence of a quotation is recorded
      as absence.
    - >-
      Any artifact that reports VARIANT-P without its label, or alongside a
      fault/Rowhammer/memory-corruption result, is invalid on its face.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    Stage 0-B returns prf_mode_verification_status of `sk_prf_in_every_mode` or
    `text_unobtainable` (the middle value is an escalation, not a success);
    p_wc_log2 is strictly greater than 0 at all six sets and matches the
    pre-registered integers wherever the parameter tuple was verified;
    k1_null_separation is EXACTLY 0; slack_1 is strictly positive at all
    twenty-four (set, s) cells with the G tail computation shown;
    variant_p_separation is at least 30 bits; the resubmission ladder is monotone
    non-decreasing with r = 0 reproducing the pure multinomial exactly; the
    multi-collision cost is re-derived with every step shown; the
    ladder_precommit_hash matches; and Q4 is answered by a verbatim quotation OR
    recorded explicitly as `text_unobtainable`.
  falsification_criterion:
    - >-
      p_wc_log2 at most 0 at any parameter set - the vacuity conclusion is FALSE
      for that set, the central derivation is wrong there, and the record must be
      superseded.
    - >-
      slack_1 non-positive anywhere - the surrogate ladder is MIS-ORDERED and the
      analysis is defective; the sign is forced by the power-mean inequality, so
      this is an error, not a discovery.
    - >-
      k1_null_separation non-zero - the pipeline is MANUFACTURING STRUCTURE and
      nothing may be reported from any arm.
    - >-
      variant_p_separation zero, or below 30 bits - EITHER the instrument is
      blind to the control interface (in which case no negative about SLH-DSA is
      reportable from any arm) OR, if every other control passes, the message
      randomizer buys much less than the published design rationale implies,
      which is the most interesting outcome available here and requires
      independent review before any statement.
    - >-
      The resubmission ladder is non-monotone in r - the reachable-set model is
      wrong somewhere between the endpoints, and is repaired before any
      separation figure is reported.
    - >-
      Stage 0-B finds a signing mode with a publicly computable index - HEUR-001
      is refuted, VARIANT-P stops being hypothetical, and the work halts and
      escalates.
    - >-
      The ladder_precommit_hash does not match - the ordering control failed and
      the surrogate rung finding is withdrawn.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state,
      resolved model/inference block and environment
    - >-
      raw-result.json carrying p_wc_log2 per set as an exact integer, G(s) and
      its rational tail value per (set, s), slack_1 per (set, s), the k = 1 null
      separation, the resubmission ladder table, and the VARIANT-P cost - not
      summaries
    - >-
      the STAGE 0-A pre-committed surrogate ladder and VARIANT-P derivation, with
      its hash, written BEFORE any primary text was read
    - >-
      the full multi-collision cost re-derivation with every step shown, and the
      recalled formula alongside for comparison
    - >-
      the coupon-collector step made rigorous, or the exact expected-cover
      computation replacing it, or an explicit statement that it remains a sketch
    - >-
      the verbatim quotation identifying the surrogate rung WITH its equation or
      theorem number, or an explicit record that the text could not be obtained
      under the goal's declared source-preference order
    - >-
      the Stage 0-B verification record for SK.prf in every signing mode and for
      the six (h, a, k) tuples, each marked verified or recalled_unverified
    - >-
      the k = 1 null's measurements and the VARIANT-P arm's measurements, in the
      same file as the SLH-DSA arm
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      DEDUPLICATION AGAINST EXP-SLHDSA-9cbad4 IS REQUIRED BEFORE APPROVAL. That
      contract already carries a Stage 0 gate G0-B, a Stage 1 arm QO and a Stage
      5 VARIANT-P contrast under H-SLHDSA-3a403a. Approving both unchanged would
      run the same arithmetic twice under two hypotheses. See derivation_gaps.
    - >-
      H-SLHDSA-9e09aa's proof_search_map is SHARED with H-SLHDSA-3a403a and must
      be audited once against KN-TECH-080, not twice.
    - >-
      Stage 0-B is a rule 12 escalation gate. The escalation path must be named
      before authorization, because the escalating outcome is precisely the one
      that must not be written up in ordinary artifacts.
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260805-705614
    authored_at: '2026-08-25'
    note: >-
      Stages, controls, metrics, predictions Q1-Q5 and every threshold are
      transcribed from the parent proposal's `mechanism`, `minimal_test`,
      `predictions`, `heuristic_assumptions`, `confounders` and
      `falsification_conditions` blocks rather than re-invented. The pre-registered
      integers 665 / 1848 / 787 / 1782 / 1036 / 1857, the 57-bit estimate and the
      30-bit floor are the parent's own pre-registered values and are NOT
      measurements. The 2^{133.7} comparison figure is cited to
      IDEA-20260805-fbe36a. Budget follows the parent's declared estimated_cost
      (implementation low, compute VERY LOW). No field is invented; gaps are
      listed below.
  derivation_gaps:
    - >-
      OVERLAP WITH EXP-SLHDSA-9cbad4 IS REAL AND UNRESOLVED. The parent proposal
      itself states its minimal test is "carried by
      experiments/EXP-SLHDSA-9cbad4/specification.yaml as its Stage 0 gate G0-B,
      Stage 1 arm QO, and Stage 5". This contract is a STANDALONE rendering of
      that audit under its own hypothesis. A Coordinator must decide before
      approval whether to approve this one and narrow 9cbad4, approve 9cbad4 and
      withdraw this one, or approve both with an explicit non-duplication scope.
      Approving both unchanged would run the same arithmetic twice under two
      hypotheses and produce two evidence records for one computation.
    - >-
      THE SIX (h, a, k) TUPLES ARE RECALLED-UNVERIFIED and NIST's site is
      recorded in RQ-SLHDSA-001 as proxy-blocked. Every pre-registered integer in
      the Q1 prediction is conditional on them. The contract treats verification
      as a Stage-0 item and marks unverified sets, but a Coordinator should
      decide before approval whether an unverified table is worth publishing at
      all.
    - >-
      THE TAIL-PROBABILITY CONVENTION FOR G IS NOT SETTLED. slack_1's SIZE - the
      actual deliverable of arm Q2 - depends on it entirely, and the parent
      deliberately pre-registers no numeric prediction for that reason. A
      Coordinator must fix the convention before approval, or accept that the
      table reports a family of numbers rather than a number.
    - >-
      THE COUPON-COLLECTOR STEP FIXING G IS A SKETCH, and the multi-collision
      cost formula is RECALLED. Both are to be re-derived inside the run. If
      either re-derivation fails, variant_p_separation becomes unavailable and
      the positive control cannot pass - which would block every other arm's
      negative. The probability of that is not estimated anywhere.
    - >-
      THE RESUBMISSION-LADDER MODEL IS NOT SPECIFIED beyond "reject and resubmit
      after seeing the index". The exact adversary model at each r - whether
      resubmissions are counted against q, whether the adversary may target a
      specific leaf or only reject unfavourable ones - must be written before
      approval, because monotonicity in r is otherwise not a decidable claim.
    - >-
      Q4's answerability is estimated by the parent at about 0.35. The contract
      makes `text_unobtainable` a first-class recorded outcome, so the run is not
      wasted, but a Coordinator should note that the single most decision-relevant
      arm is the one most likely to return no answer.
