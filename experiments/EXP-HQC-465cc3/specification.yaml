# EXPERIMENT CONTRACT -- EXP-HQC-465cc3 (review_required, unapproved, zero runs).
experiment:
  id: EXP-HQC-465cc3
  hypothesis_id: H-HQC-f11775
  derived_from_idea: IDEA-20261018-4cd7b8
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Estimator calibration
  objective: Hidden constants between estimator and counted ISD.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C ISD suite; CryptographicEstimators (Python)
    parameters: n in {101,163,257}; four algorithms; 100 instances
    procedure: 1. Run counted. 2. Run estimator. 3. Fit offsets.
  controls:
  - 'null: estimator vs itself under different optimisation seeds'
  - 'positive: deliberately mis-specified estimator cost model (GE cost x8)'
  - 'A/A: implementation two seed blocks'
  independent_variables:
  - algorithm
  - cost_model
  metrics:
    primary:
    - offset bits
    secondary:
    - slope
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: offset
    formula: 0 if estimator model exact
    source: estimator
  scale_relevance:
    tier: toy
    justification: 'n reduced; transfer: constant offset'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 30
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - 100 instances per n
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - estimator failure to converge invalid
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success if C3 offsets <= 3 bits and slopes within 5% (P1, P2), with C2 detecting misspecification
    beyond the AA1 noise floor.
  falsification_criterion: Falsified if C3 shows any offset > 5 bits or slope beyond 15%.
  decision_impact:
    on_positive: Apply measured offsets in the HQC matched baseline.
    on_negative: Record estimator as calibrated within 3 bits and use it unadjusted.
  variable_ledger:
    independent:
    - name: algorithm
      levels:
      - stern
      - bjmm
    - name: cost_model
      levels:
      - matched
      - misspecified
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    comparisons:
    - id: C1
      arms:
      - stern matched
      - bjmm matched
      differs_in:
      - algorithm
      design: one_factor
    - id: C2
      arms:
      - stern matched
      - stern misspecified
      differs_in:
      - cost_model
      design: one_factor
    - id: C3
      arms:
      - offset fits all
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - stern matched seed-block A
      - stern matched seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-4cd7b8.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-4cd7b8.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - offsets CSV
  - SVG
  - PDF
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-HQC-465cc3/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-4cd7b8.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
