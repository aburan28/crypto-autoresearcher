experiment:
  id: EXP-DREG-620b15
  hypothesis_id: H-DREG-91be14
  derived_from_idea: IDEA-20260801-002
  question_id: RQ-DREG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Graded pivot-degree Hilbert function on full-column Macaulay sets for the boolean
    chained Semaev system at m = 3, t = 3 - d_reg(n) without a Groebner solve, validated
    against a direct solve at the overlap and read against a T11-support-matched
    semi-regular null ensemble

  objective: >-
    The one uncertainty a run reduces is whether gap(n) = d_reg(n) - d_ff(n) on this
    lane's frozen boolean chained Semaev system TRACKS the T11-support-matched
    semi-regular null or DEPARTS from it, at rungs a Groebner solve cannot reach. A run
    establishes (i) whether the graded pivot-degree pass reproduces a direct
    F4/F5-style solve's solving degree exactly at every n where both complete, which is
    the precondition for the instrument meaning anything; (ii) the measured d_reg(n) and
    gap(n) at every rung the full-column pass reaches within the memory budget; (iii)
    the null ensemble's own spread at each n, without which "departure" is not a
    measurable word; and (iv) the labelled subset-column negative control and the
    homogenization-convention sensitivity, which are the two choices this lane has
    previously been misled by. No attack, no exponent and no ECDLP hardness statement
    follows from a run.

  what_this_is_not:
    - >-
      Not an attack, an algorithm, or a complexity claim. It measures a degree sequence
      on one toy system.
    - >-
      Not a statement about prime-field systems, about m or t other than 3, or about any
      n beyond the rungs actually reached.
    - >-
      Not support for the sub-rho scenario under any outcome. A departure is the failure
      of one attempt to kill it, which is a different fact.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. For the boolean chained Semaev system at m = 3, t = 3
      built by src/semaev_tree.py and Weil-descended to GF(2), at the rungs actually
      reached, under the frozen homogenization convention and over FULL degree-by-degree
      column sets: the measured d_reg(n) sequence, its agreement or disagreement with a
      direct solve at the overlap, and its position relative to the T11-support-matched
      null ensemble and that ensemble's measured spread. WHAT DOES NOT FOLLOW - nothing
      at unreached n; nothing at other m or t; nothing about prime fields; no ECDLP
      hardness statement; and no value beyond the validation overlap except conditionally
      on HEUR-DREG-HILB-1, which must be quoted with it.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, DECLARED FIRST). Freeze the homogenization convention, the
      full-column construction rule, the null-ensemble generation procedure (matched to
      the T11 SUPPORT pattern, not merely degree and variable count), the departure rule
      (three or more consecutive n beyond the ensemble spread, consistent in direction),
      and the per-rung memory and time budgets. Hash the declaration.
      STAGE 1 (minutes to hours, BLOCKING VALIDATION). At every small n where a direct
      F4/F5-style solve completes within budget, run BOTH the direct solve and the
      pivot-degree pass under the same convention and require EXACT integer equality of
      the solving degree. Record the overlap boundary - the largest n at which both
      completed - because every later value is conditional past it.
      STAGE 2 (hours, THE MEASUREMENT). Walk n upward, on and off the n/3 lattice,
      running the full-column pivot-degree pass at each rung: build the column set
      degree by degree under the declared chunking strategy, row-echelonize exactly over
      GF(2), read the pivot degrees, and record the first full-rank-stable degree, the
      full-column rank at each degree, wall time and measured peak RSS. Stop the ladder
      at the first rung exceeding the memory budget and report the reached n.
      STAGE 3 (hours, THE NULL ENSEMBLE). At every reached n, generate 20 draws of the
      T11-support-matched semi-regular null and run the identical pass on each,
      recording the ensemble's mean and spread of gap(n). The spread is what makes
      "departure" decidable and is a primary metric, not a diagnostic.
      STAGE 4 (hours, CONTROLS). Run the subset-column corank pass at every reached n as
      a LABELLED NEGATIVE control and report its sequence beside the full-column one. Run
      the pivot-degree pass under a SECOND homogenization convention at three n and
      report the shift, which must be constant.
      STAGE 5 (zero compute). Assemble gap(n) against the ensemble, apply the frozen
      departure rule, and emit TRACKING, DEPARTURE or INCONCLUSIVE. No verdict is
      emitted at any n beyond the reached ladder.
    instrument: >-
      Python 3.11 with exact GF(2) linear algebra. The system is the frozen boolean
      chained Semaev built by src/semaev_tree.py at m = 3, t = 3, Weil-descended to
      GF(2). Full column sets are constructed degree by degree under a declared chunking
      strategy so the whole matrix is never materialized at once. Peak RSS is measured
      per rung by the harness, not modelled. The direct-solve arm uses this lane's
      existing solver path. Recorded through harness/runner.py.
    parameters: >-
      m = 3, t = 3. n walked upward from the smallest n where the direct solve completes,
      through rungs on and off the n/3 lattice, to the first rung exceeding the memory
      budget. Degrees D from the system's minimum through the first full-rank-stable
      degree plus two, so stability is observed rather than assumed at the last computed
      degree. Null ensemble 20 draws per n. Seeds 2026, 20260825, 20260826. Homogenization
      convention frozen at STAGE 0; a second convention run at three n for the shift
      check.

  controls:
    - >-
      DIRECT-SOLVE VALIDATION, BLOCKING. At every n where an F4/F5-style solve completes,
      the pass's first full-rank-stable degree must equal the solve's solving degree
      exactly under the same convention. This is the only check that the instrument
      measures d_reg rather than some other integer, and it can fail.
    - >-
      T11-SUPPORT-MATCHED SEMI-REGULAR NULL ENSEMBLE, 20 draws per n, run through the
      IDENTICAL pass in the same invocation. Its measured SPREAD - not a nominal
      semi-regular series - is what a departure is judged against.
    - >-
      SUBSET-COLUMN CORANK PASS AS A LABELLED NEGATIVE CONTROL. This lane classifies
      subset-column coranks as artifacts; running the pass and reporting its sequence
      beside the full-column one shows the full-column requirement doing work, or shows
      that it does not - and either is recorded.
    - >-
      HOMOGENIZATION-CONVENTION CONTROL. A second convention at three n; the shift must
      be a constant independent of n. A varying shift makes cross-n comparison invalid
      and the sequence is withheld.
    - >-
      STABILITY MARGIN. Degrees are computed two beyond the first full-rank-stable
      degree, so stability is observed rather than inferred from the last degree the
      budget allowed - the classic way a truncated computation manufactures a stable
      degree.
    - >-
      PEAK RSS MEASURED PER RUNG, since the reached n is the honest limit of the whole
      design and a reach reported without its memory is not checkable.

  independent_variables:
    - n, on and off the n/3 lattice
    - degree D within each rung
    - 'system: measured chained Semaev versus T11-support-matched null draw'
    - 'column set: full versus subset (negative control)'
    - homogenization convention
    - seed

  metrics:
    primary:
      - >-
        d_reg-hat(n), the first degree at which the graded pivot-degree Hilbert function
        of the full-column matrix becomes full-rank-stable, an integer per rung under the
        frozen convention.
      - >-
        gap(n) = d_reg-hat(n) - d_ff(n), an integer sequence over the reached rungs.
      - >-
        Null-ensemble mean and spread of gap(n) at each rung, over 20 matched draws;
        spread reported as the full range and the standard deviation.
      - >-
        Overlap agreement, the count of n at which the pass and the direct solve returned
        the same solving degree, over the count at which both completed - required to be
        a perfect match.
      - >-
        Full-column rank at each degree per rung, as emitted.
      - >-
        Departure verdict in {TRACKING, DEPARTURE, INCONCLUSIVE}, assigned by the frozen
        rule at STAGE 0.
    secondary:
      - Measured peak RSS and wall time per rung and per degree.
      - The largest n reached by the full-column pass, and the rung at which it stopped.
      - Subset-column corank sequence, labelled as an artifact control.
      - Convention shift at the three cross-checked n, with its constancy.
      - Number of degrees computed beyond the stable degree at each rung.
      - sha256 of the STAGE 0 declaration, of the frozen system, and of each null draw's support pattern.

  heuristic_under_test: HEUR-DREG-HILB-1
  heuristic_under_test_note: >-
    This contract's STAGE 1 is the validation experiment for HEUR-DREG-HILB-1 of
    H-DREG-91be14 - the identification of the first full-rank-stable pivot degree with
    d_reg. The heuristic is structural rather than distributional, so the validation is
    an exact-agreement check against a direct solve at the overlap rather than a
    distribution comparison, and every value reported beyond the overlap is explicitly
    conditional on it.

  preregistered_prediction:
    quantity: >-
      The departure verdict for gap(n) against the T11-support-matched semi-regular null
      ensemble, and the overlap agreement count.
    formula: >-
      DEPARTURE is declared if and only if gap(n) lies outside the null ensemble's
      measured spread at three or more CONSECUTIVE reached n, in a consistent direction;
      TRACKING if gap(n) lies inside the spread at every reached n; INCONCLUSIVE
      otherwise. Overlap agreement is predicted to be a perfect match; anything else
      falsifies HEUR-DREG-HILB-1 and voids the sequence beyond the overlap. THE RECORD
      DOES NOT PREDICT WHICH OF TRACKING OR DEPARTURE OCCURS - it predicts that the
      measurement is decidable between them, and the ensemble spread is what makes that
      claim checkable.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-002, whose predictions block
      states that "any nonzero gap(n) sequence that diverges from the T11-matched
      semi-regular null at 3+ consecutive n constitutes a departure signal", and whose
      falsification_conditions name both the tracking and the departure branches. The
      ENSEMBLE SPREAD and the consistency-of-direction requirement are this contract's
      additions, added because divergence from a single nominal null curve is not
      measurable without knowing that null's own variability.

  scale_relevance:
    tier: toy
    justification: >-
      The rungs reached are toy n on a Weil-descended boolean system, and the ladder
      stops where exact GF(2) linear algebra on full column sets exhausts the memory
      budget - a limit this lane has already met around n = 21 by a different route. The
      design's whole scale argument is that the pivot-degree pass removes the Groebner
      reduction blowup while keeping the quantity, so it should reach FURTHER than a
      solve; how much further is measured and reported, not assumed. THE TRANSFER
      ASSUMPTION IS NARROW AND STATED: that the identification validated at the overlap
      persists at the rungs beyond it. That is HEUR-DREG-HILB-1's unvalidated region and
      every value there is labelled conditional.
    correspondence: null

  tail_checks:
    - >-
      Report the null ensemble's full range as well as its standard deviation; a
      departure judged against a standard deviation on 20 draws can be an outlier
      artifact and the range makes that visible.
    - >-
      Report the number of degrees computed beyond the stable degree at each rung; a
      stable degree observed at the last computed degree is not observed stability.
    - >-
      Report per-rung peak RSS beside the reached n, since the ladder's endpoint is a
      resource fact and an unmeasured one is not checkable.
    - >-
      Report the rungs off the n/3 lattice separately, since this lane's structure is
      indexed by k = ceil(n/3) and lattice and off-lattice rungs are not
      interchangeable.

  replication:
    seeds: [2026, 20260825, 20260826]
    independent_instances: 3
    repeat_count_per_cell: 1
    note: >-
      The measured system is frozen and deterministic, so seeds vary the null ensemble
      draws and any randomized element of the construction. d_reg-hat on the measured
      system is deterministic and is not repeated; the null arm is replicated 20 times
      per rung, which is where the variability lives.

  budget:
    wall_clock_seconds: 7200
    wall_clock_seconds_note: Per run. total_cpu_hours bounds the whole contract.
    total_cpu_hours: 16.0
    memory_gb: 24
    maximum_runs: 40

  stopping_rules:
    - >-
      Stop the entire contract if the pass disagrees with the direct solve at any overlap
      n, and report the disagreement at the named n as the deliverable.
    - >-
      Stop the ladder at the first rung exceeding the per-rung memory or time budget and
      report the reached n. A rung not reached is a budget stop, never a value and never
      a negative result (AGENTS.md rule 5).
    - >-
      Stop and withhold the sequence if the homogenization-convention shift varies with
      n; cross-rung comparison is then invalid.
    - >-
      Stop at maximum_runs, total_cpu_hours or memory_gb, whichever binds first.

  invalidation_rules:
    - >-
      A timeout, crash or memory exhaustion makes the run or the rung
      failed_infrastructure and is NEVER negative mathematical evidence about d_reg.
    - >-
      A run reporting d_reg-hat from SUBSET column sets in the primary arm is
      invalid_measurement; subset coranks are a labelled artifact control in this lane
      and using them as the measurement reproduces the artifact more cheaply.
    - >-
      A run in which the null ensemble was not executed in the same invocation, through
      the identical pass, is invalid_measurement.
    - >-
      A run in which the homogenization convention differs between the measured arm, the
      null arm and the validation arm is invalid_measurement.
    - >-
      A run whose stable degree was read at the last computed degree, with no margin
      above it, is invalid_measurement for that rung.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment
      and requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) Overlap agreement
    is a perfect match - the pass and the direct solve return the same solving degree at
    every n where both completed - and at least one such n exists. (2) At every reached
    rung the stable degree was observed with at least two degrees of margin above it.
    (3) The null ensemble ran through the identical pass at every reached rung and its
    spread is reported. (4) The subset-column control and the convention-shift control
    both reported, with the shift constant. A run meeting (1) to (4) is VALID, and the
    verdict on H-DREG-91be14 (D3) is then whatever the frozen departure rule returns:
    TRACKING, DEPARTURE or INCONCLUSIVE. All three are reportable outcomes and the
    contract does not privilege any of them.

  falsification_criterion:
    - >-
      Any disagreement between the pass and the direct solve at an overlap n falsifies
      HEUR-DREG-HILB-1 and (D1); every value beyond the overlap is withdrawn and no gap
      sequence is reported.
    - >-
      gap(n) inside the null ensemble spread at every reached rung falsifies the
      departure branch and resolves (D3) to TRACKING - the sub-rho scenario is killed
      within the tested scope only, and the obstruction is the measured sequence with its
      spread over exactly that scope.
    - >-
      gap(n) outside the spread at three or more consecutive rungs, consistent in
      direction, falsifies the tracking branch and resolves (D3) to DEPARTURE, which
      requires independent replication before any status change.
    - >-
      A convention shift that varies with n falsifies the comparability of the sequence
      across rungs and the sequence is withheld.
    - >-
      No overlap n existing at all means HEUR-DREG-HILB-1 is never validated; no
      d_reg-hat may be reported and the contract's deliverable is that fact.
    - >-
      A stable degree read with no margin above it falsifies that rung's value, which is
      then dropped rather than caveated.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      the STAGE 0 declaration - homogenization convention, full-column rule, null
      generation procedure, departure rule, budgets - hashed before any rung ran
    - raw-result.json with per-rung, per-degree ranks and pivot degrees, not summaries
    - the direct-solve validation outputs at every overlap n, beside the pass's outputs
    - the 20 null-ensemble draws per rung, in the same file as the measured arm
    - the subset-column control sequence, labelled as an artifact control
    - the convention-shift measurements at the three cross-checked n
    - measured peak RSS and wall time per rung, with the reached n stated explicitly

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      USER's gate because it authorizes execution and spends compute.
    - >-
      The blocking direct-solve validation must remain in the frozen protocol. Without at
      least one overlap n, HEUR-DREG-HILB-1 is unvalidated and the instrument measures an
      unidentified integer.
    - >-
      The null ensemble must be generated by matching the T11 SUPPORT pattern. A null
      matched only on degree and variable count is a null about a different system and a
      Coordinator must confirm the matching rule before approval.
    - >-
      A DEPARTURE verdict does not authorize a status change; it triggers independent
      replication, which is a separate decision.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260801-002
    authored_at: '2026-08-25'
    note: >-
      The pivot-degree pass, the full-column requirement, the subset-column negative
      control, the T11-support-matched calibration control and the F4/F5 validation plan
      all come from the parent proposal's mechanism, controls and heuristic_assumptions
      blocks. THE NULL ENSEMBLE'S MEASURED SPREAD, the stability margin, the
      homogenization-convention shift check and the explicit INCONCLUSIVE verdict are
      this contract's additions, added because divergence from a single nominal curve is
      not decidable and because a stable degree read at the last computed degree is not
      observed stability. Budgets come from the parent's estimated_cost (implementation
      medium, compute medium), raised on memory because this lane has already met a
      memory wall. No measurement, timing, run or citation is invented.

  derivation_gaps:
    - >-
      The exact n range is not fixed here. It is bounded below by where the direct solve
      completes and above by where the full-column pass exhausts memory, and neither is
      known before the run. The contract fixes the LADDER RULE, not the numbers, and the
      reached n must be reported as a fact.
    - >-
      d_ff(n) is taken from this lane's existing definition and is not redefined here. A
      Coordinator must confirm that the same definition and convention are used in the
      measured arm, the null arm and the historical values a reader will compare against;
      a silent definitional drift would produce a departure that is an artifact of
      bookkeeping.
    - >-
      Whether 20 null draws per rung give a spread tight enough to make the departure
      rule decidable is not known in advance. If the spread swallows every plausible
      signal, the honest outcome is INCONCLUSIVE and more draws, not a narrower rule.
    - >-
      The chunking strategy for full-column construction is declared by the executor and
      affects the reached n materially. It must be recorded in the manifest, because a
      reach quoted without it is not reproducible.
