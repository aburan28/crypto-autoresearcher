experiment:
  id: EXP-DREG-620b15
  hypothesis_id: H-DREG-91be14
  derived_from_idea: IDEA-20260801-002
  question_id: RQ-DREG-001
  version: 2
  supersedes_version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Graded pivot-degree Hilbert function on full-column Macaulay sets for the boolean
    chained Semaev system at m = 3, t = 3 - d_reg(n) without a Groebner solve, on an
    ENUMERATED, HOST-SERVABLE cell ladder topping at n = 9 (n = 10, 11 precompute-gated,
    n >= 12 out of scope), validated against a direct solve at the overlap and read
    against a T11-support-matched semi-regular null ensemble

  revision_record:
    revised_at: '2026-09-04'
    revised_by: coordinator
    revision_kind: budget_and_staging_revision
    is_this_an_approval: >-
      NO. This revision does not approve, freeze, or authorize execution. status stays
      `review_required`, approved_by stays null, frozen stays false,
      execution_authorized stays false, evidence_eligible stays false. No handoff was
      written and no Executor was dispatched by the act that produced this revision.
    trigger: >-
      MAINTAINER RULING. The repository owner, asked directly on 2026-09-04, ruled
      "revise before approve" on EXP-DREG-620b15. This record is that revision.
    why_revision_and_not_protocol_amendment: >-
      Verified before revising: status `review_required`, approved_by null, frozen
      false, runs/ contains only .gitkeep, amendments/ is empty. NOTHING HAS EXECUTED
      AGAINST THIS CONTRACT, so there is no frozen protocol to amend and no run whose
      comparability an edit could break. Once this contract is approved the SAME change
      would require a recorded `protocol_amendment`; this is the cheap moment, and the
      revision is taken now precisely so that a later amendment is not needed.
    defect_found: >-
      VERSION 1's BUDGET COULD NOT BE SERVED BY THIS HOST, AND ITS CELL LIST WAS NOT A
      LIST. v1 declared memory_gb 24, wall_clock_seconds 7200 per run, total_cpu_hours
      16.0, maximum_runs 40, and specified the n range as an OPEN-ENDED LADDER RULE
      ("walk n upward ... stop the ladder at the first rung exceeding the memory
      budget"), explicitly leaving the numbers unfixed (v1 derivation_gaps item 1).
      Two consequences, both fatal to the approval being worth spending:
      (a) SERVICE. GOAL-DREG-001's next_action records that this lane's most recent
      dispatch, TASK-20260828-955d56 at n = 15 D = 6, returned ALL 6 required (seed,
      arm) runs `failed_infrastructure` / `resource_exhaustion` with ZERO ranks
      obtained, at a measured PREPARE-PHASE peak RSS of 11.73 GiB (sem) and 12.22 GiB
      (null) at seed 2026, before the rank-loop kernel was ever invoked. Approving a
      budget above what this host serves authorizes a run whose return is
      `failed_infrastructure` - an infrastructure stop, which AGENTS.md rule 5 and
      CLAUDE.md rule 3 say is NEVER evidence in either direction. It spends the
      approval gate and buys nothing.
      (b) TRUNCATION. A ladder that runs until it exceeds a cap does not yield a
      smaller result when it exceeds the cap; it yields an infrastructure stop at the
      rung where it stopped. Lowering the cap alone would move the truncation point,
      not remove it. THE CELLS HAD TO CHANGE, NOT ONLY THE CAP.
    budget_before_v1_verbatim:
      wall_clock_seconds: 7200
      wall_clock_seconds_note: Per run. total_cpu_hours bounds the whole contract.
      total_cpu_hours: 16.0
      memory_gb: 24
      maximum_runs: 40
    cells_before_v1_verbatim: >-
      "n walked upward from the smallest n where the direct solve completes, through
      rungs on and off the n/3 lattice, to the first rung exceeding the memory budget.
      Degrees D from the system's minimum through the first full-rank-stable degree plus
      two". No enumerated cell list existed; v1 derivation_gaps item 1 states "The exact
      n range is not fixed here ... The contract fixes the LADDER RULE, not the numbers."
    budget_after_v2:
      wall_clock_seconds: 3300
      per_invocation_cap_seconds: 600
      total_cpu_hours: 15.0
      memory_gb: 8
      maximum_runs: 31
      note: >-
        memory_gb 24 -> 8 is the load-bearing change. 8 is `templates/research-records.md`'s
        declared memory floor for this program ("maximum_memory_gb >= 8 (DREG peaked at
        7.16 GB)") and is the largest envelope under which this lane has a recorded
        `completed_valid` run on this host. wall_clock 7200 -> 3300 per run matches the
        handoff-envelope turn budget this execution surface actually serves; 600 is the
        current foreground command cap (.claude/settings.json BASH_MAX_TIMEOUT_MS =
        600000), so any cell longer than 600 s is served by CHECKPOINT AND RESUME, which
        is now a required instrument property rather than an assumption. total_cpu_hours
        16.0 -> 15.0 is a small change in magnitude and a large one in kind: v1's 16.0
        was asserted, v2's 15.0 is the sum of the enumerated per-stage reservations in
        `budget.stage_reservations` and reconciles with the cell list.
    cells_after_v2: >-
      An ENUMERATED cell list (see `cell_list`), in three declared classes: SERVABLE and
      unconditional (n = 7, 8, 9); PRECOMPUTE-GATED (n = 6, 10, 11), attempted only if a
      ZERO-COMPUTE footprint or construction precompute at STAGE 0B clears them; and OUT
      OF SCOPE and NEVER ATTEMPTED (n >= 12). A rung is never started and then stopped on
      memory: it is either cleared by the precompute or declared out of scope before any
      linear algebra runs.
    what_was_not_changed: >-
      THIS IS A BUDGET-AND-STAGING REVISION, NOT A REDESIGN. Unchanged: the hypothesis
      H-DREG-91be14 and every part of it; the heuristic under test HEUR-DREG-HILB-1 and
      its falsification condition; ALL SIX CONTROLS, none dropped or softened; the null
      ensemble at 20 DRAWS PER RUNG (not reduced); the +2 stability margin; the frozen
      departure rule (3+ consecutive n, consistent direction, outside the ensemble's
      measured spread); every falsification criterion; every invalidation rule; the
      claim tier `toy`; the seeds [2026, 20260825, 20260826]; and the requirement that
      the null arm run through the identical pass under the same STAGE 0 declaration as
      the measured arm. No success criterion was loosened and no claim was narrowed in
      order to make it cheaper to pass.
    what_this_revision_costs:
      - >-
        THE CONTRACT CANNOT REACH n IN {12, 15, 18} AND THEREFORE CANNOT CONTRIBUTE TO
        GOAL-DREG-001's COMPLETION CRITERION. Stated plainly rather than buried. v1 could
        not reach them either - its open ladder would have met the same wall - but v1
        would have discovered that by spending an approval and returning
        `failed_infrastructure`. v2 declares it before approval, at zero compute.
      - >-
        THE PRINCIPAL SCIENTIFIC COST IS THE DEPARTURE RULE'S RESOLUTION. The frozen rule
        needs divergence at THREE OR MORE CONSECUTIVE reached rungs. On the unconditional
        ladder {7, 8, 9} that is exactly three rungs with ZERO MARGIN: a DEPARTURE verdict
        would require all three to diverge in a consistent direction, and a single rung
        inside the spread forces INCONCLUSIVE. A-priori, INCONCLUSIVE is therefore the
        most likely verdict of this contract. That is a real weakness of what this host
        can serve, it is NOT a reason to narrow the rule, and INCONCLUSIVE remains a
        fully reportable outcome the contract does not privilege against.
      - >-
        HEUR-DREG-HILB-1 IS VALIDATED, IF AT ALL, ONLY OVER THE REACHED OVERLAP (n <= 9,
        or <= 11 if the STAGE 0B gate clears those rungs). Every d_reg-hat this contract
        emits beyond that overlap - and there may be none - carries the overlap boundary
        quoted with it, exactly as v1 required.
      - >-
        AT ANY PRECOMPUTE-GATED RUNG THAT CLEARS, ONLY SEED 2026 IS RUN (one seed, not
        three), because those rungs exist to extend the consecutive-rung count and their
        budget comes from a small conditional reserve. Any value read from such a rung is
        LABELLED single-seed in every artifact and may not be presented as replicated.
        This is a disclosed reduction in replication at those rungs only; the
        unconditional rungs keep all three seeds.
    controls_that_cannot_be_run_here: >-
      NONE. Every control of v1 survives at full strength on the v2 ladder, and the
      ladder was sized so that this is true: the top rung is set by the cost of the
      measured arm PLUS its 21-pass null ensemble, not by the measured arm alone. Sizing
      to the measured arm alone would have bought one more rung at the price of making
      "departure" unmeasurable at exactly the rung where it would matter, which is the
      trade this revision refuses.
    numbers_quoted_not_invented: >-
      Every resource figure in this record is quoted from committed state and attributed
      in `host_service_envelope`. NO TIMING, MEMORY FIGURE, OR RUN IS INVENTED HERE, and
      this revision executed nothing.

  objective: >-
    The one uncertainty a run reduces is whether gap(n) = d_reg(n) - d_ff(n) on this
    lane's frozen boolean chained Semaev system TRACKS the T11-support-matched
    semi-regular null or DEPARTS from it, over the enumerated servable ladder. A run
    establishes (i) whether ANY n on this host admits a direct F4/F5-style solve at all,
    which is asked FIRST and at near-zero cost because a negative answer ends the
    contract by its own falsification criterion; (ii) whether the graded pivot-degree
    pass reproduces that solve's solving degree exactly at every n where both complete,
    which is the precondition for the instrument meaning anything; (iii) the measured
    d_reg(n) and gap(n) at every enumerated rung that clears the zero-compute footprint
    precompute; (iv) the null ensemble's own spread at each such n, without which
    "departure" is not a measurable word; and (v) the labelled subset-column negative
    control and the homogenization-convention sensitivity, which are the two choices this
    lane has previously been misled by. No attack, no exponent and no ECDLP hardness
    statement follows from a run.

  what_this_is_not:
    - >-
      Not an attack, an algorithm, or a complexity claim. It measures a degree sequence
      on one toy system.
    - >-
      Not a statement about prime-field systems, about m or t other than 3, or about any
      n beyond the rungs actually reached.
    - >-
      Not support for the sub-rho scenario under any outcome. A departure is the failure
      of one attempt to kill it, which is a different fact.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract, at version 1 or at version 2.
    - >-
      NOT A CONTRIBUTION TO GOAL-DREG-001's COMPLETION CRITERION. That criterion names
      n in {12, 15, 18}; this contract declares n >= 12 out of scope and never attempts
      it. A reader must not count this contract toward that criterion under any outcome.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. For the boolean chained Semaev system at m = 3, t = 3
      built by src/semaev_tree.py and Weil-descended to GF(2), at the enumerated rungs
      actually reached (n <= 9 unconditionally, n = 6, 10, 11 only if the STAGE 0B
      precompute cleared them), under the frozen homogenization convention and over FULL
      degree-by-degree column sets: the measured d_reg(n) sequence, its agreement or
      disagreement with a direct solve at the overlap, and its position relative to the
      T11-support-matched null ensemble and that ensemble's measured spread. WHAT DOES
      NOT FOLLOW - nothing at unreached n; nothing at n >= 12, which is declared out of
      scope and never attempted; nothing at other m or t; nothing about prime fields; no
      ECDLP hardness statement; and no value beyond the validation overlap except
      conditionally on HEUR-DREG-HILB-1, which must be quoted with it.

  host_service_envelope:
    purpose: >-
      The committed resource facts this revision's budget and cell list are derived
      from. Every figure here is QUOTED WITH ITS SOURCE. None is measured, estimated, or
      extrapolated by the act that wrote this record.
    served:
      - figure: measured peak RSS 6.669 GiB (peak_rss_bytes 7160283136, recomputable as 7160283136 / 2^30)
        context: >-
          n = 12, D = 6, restricted-adjacency full-column rank pass, 174,035 columns,
          declared budgets.memory_gb 8, outcome `completed_valid`,
          wall_seconds_aggregate 2298.21 s.
        source: >-
          run_manifest.yaml of the EXP-DREG-004 source run for that cell, as quoted in
          coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260827-765027/lane-contract.yaml
          `exact_budget_if_dispatched.memory_gb`.
        reading: >-
          THE LARGEST FOOTPRINT THIS LANE HAS RECORDED COMPLETING ON THIS HOST. It
          completed under a DECLARED 8 GiB budget, which is why 8 is the v2 cap.
    not_served:
      - figure: prepare-phase peak RSS 11.73 GiB (sem arm) and 12.22 GiB (null arm), seed 2026
        context: >-
          n = 15, D = 6. ALL 6 required (seed, arm) runs returned
          `failed_infrastructure` / `resource_exhaustion`; 0 of 6 reached
          `validity=completed_valid`; ZERO RANKS WERE OBTAINED. The figures are
          PREPARE-PHASE peaks, reached BEFORE the rank-loop kernel was ever invoked, and
          exceed that lane contract's `memory_gb: 8` by 46.6% and 52.75% respectively.
        source: >-
          ledger/goals/GOAL-DREG-001.yaml `next_action`, recording Executor task
          TASK-20260828-955d56 and independently reviewed by TASK-20260828-c7c3a9
          (VAL-20260828-001, terminal verdict `passed`, J1..J5 all HOLD); outcome
          recorded by DEC-20260828-653923.
        reading: >-
          AN INFRASTRUCTURE / RESOURCE STOP, NEVER A NEGATIVE RESULT ABOUT d_reg IN ANY
          DIRECTION (AGENTS.md rule 5). It is quoted here as a fact about the HOST, not
          about the mathematics, and DEC-20260828-653923 deliberately filed NO evidence
          record for it (EV-DREG-e278ab stays reserved and unspent).
    an_asserted_figure_this_revision_declines_to_rely_on:
      figure: 'memory_gb: 48   # host capacity'
      source: experiments/EXP-DREG-004/specification.yaml budget, line 66
      why_declined: >-
        It is an ASSERTED capacity with no measurement attached, it is undated relative
        to the current host, and the only OUTCOME recorded above it is the n = 15 stop at
        11.73/12.22 GiB with zero ranks. The maintainer ruling of 2026-09-04 is the
        operative constraint. Sizing a budget to an unverified capacity figure over a
        measured failure is how v1's 24 GiB was arrived at.
    transfer_caveat_stated_explicitly: >-
      THE 6.669 / 11.73 / 12.22 GiB FIGURES COME FROM A DIFFERENT INSTRUMENT than this
      contract's pivot-degree pass (EXP-DREG-004's restricted-adjacency rank pass). They
      bound THE HOST, not this instrument. That is exactly why n = 10 and n = 11 are
      PRECOMPUTE-GATED rather than either declared servable or declared impossible: the
      gate uses this instrument's OWN constructed row and column counts and its own
      declared bytes-per-entry, and it costs nothing to ask. This contract's per-rung
      peak RSS is MEASURED by the harness, never modelled.

  cell_list:
    variable_count_rule: >-
      N(n) = n + 3k boolean variables after Weil descent, where the single u-variable
      (t - 2 = 1) carries full F_{2^n} support (n coordinates) and each of the t = 3
      x-variables is restricted to the V-subspace of dimension k (k coordinates each).
      This is read off src/semaev_tree.py `build_chained_system_symbolic` and
      `weil_descend_to_F2`, not asserted: the EXECUTOR RECORDS THE ACTUAL N AND THE
      ACTUAL GENERATOR DEGREE per rung in the manifest, and a mismatch against this rule
      is recorded as a construction fact, not silently absorbed.
    column_count_rule: >-
      With boolean field equations the full column set at degree <= D has
      sum_{i=0..D} C(N, i) columns. The figures in the table below are ARITHMETIC on that
      formula, recomputable by any reader with a calculator; they are NOT measurements
      and NOT predictions of memory. They exist to make the ladder's shape checkable.
    degree_ceiling_rule: >-
      D runs from the system's own maximum generator degree (recorded by the instrument,
      not asserted here) through D_expected_stable(n) + 2, the +2 being v1's stability
      margin, kept. D_expected_stable is DECLARED per rung at STAGE 0 from EV-SIG-006's
      recorded freeze degrees (D6 at n = 9, D7 at n = 12, D8 at n = 15). IF THE MEASURED
      STABLE DEGREE EXCEEDS THE DECLARED EXPECTATION, the extra degrees are re-run
      through the STAGE 0B footprint precompute FIRST; if the extra degree's predicted
      footprint exceeds the cap, THE RUNG IS DROPPED as out-of-envelope rather than
      truncated, and its value is not reported. A truncated rung is a contract defect,
      not a smaller result.
    unconditional_servable:
      - n: 7
        k: 3
        N: 16
        D_expected_stable: 6
        D_max: 8
        full_columns_at_D_max: 39203
        seeds: [2026, 20260825, 20260826]
      - n: 8
        k: 3
        N: 17
        D_expected_stable: 6
        D_max: 8
        full_columns_at_D_max: 65536
        seeds: [2026, 20260825, 20260826]
      - n: 9
        k: 3
        N: 18
        D_expected_stable: 6
        D_max: 8
        full_columns_at_D_max: 106762
        seeds: [2026, 20260825, 20260826]
    largest_cell_believed_servable:
      cell: n = 9, D <= 8, full column set, with the 20-draw null ensemble in the same run
      why: >-
        THREE REASONS, EACH CHECKABLE. (1) Its full column count at the degree ceiling,
        106,762, is 0.61x the 174,035-column set that this lane's n = 12 D = 6 pass
        carried to `completed_valid` on this host at a MEASURED peak RSS of 6.669 GiB
        under a DECLARED 8 GiB budget. (2) The 20 ensemble draws run SEQUENTIALLY through
        the identical pass, so the cell's peak RSS is one pass's peak, not twenty - the
        ensemble multiplies TIME, not MEMORY, and time is bounded by the cell's own
        checkpointed budget. (3) The next rung up, n = 10, jumps N from 18 to 22 and the
        column count from 106,762 to 600,370 - 3.45x ABOVE the anchor cell's column count,
        not below it - so it sits outside the 8 GiB envelope on any monotone reading of
        the anchor.
      honesty_about_this_reason: >-
        Reason (1) is a CROSS-INSTRUMENT, SINGLE-POINT comparison and is not a memory
        model. It is used to place n = 9 comfortably INSIDE a measured envelope and to
        place n = 10 and n = 11 OUTSIDE it, which is the only resolution it can carry. It
        is not used to predict this contract's peak RSS at any rung; that is measured.
    precompute_gated:
      - n: 6
        k: 2
        N: 12
        gate: construction_feasibility
        gate_question: >-
          Does `gen_decomposable_R` return t = 3 distinct factor-base points from a
          V-subspace of dimension k = 2 (|V| = 4)? It raises
          ValueError("Only {len} factor-base points found; need {t}") when it cannot.
        gate_cost: zero rank work; construction only, inside STAGE 0B
        if_gate_fails: >-
          Recorded as CONSTRUCTION-INFEASIBLE - an input-construction fact about the
          smallest rung, never a result about d_reg - and the ladder starts at n = 7.
        seeds_if_cleared: [2026, 20260825, 20260826]
      - n: 10
        k: 4
        N: 22
        D_expected_stable: 6
        D_max: 8
        full_columns_at_D_max: 600370
        gate: footprint_precompute
        seeds_if_cleared: [2026]
        replication_note: SINGLE SEED. Any value read here is labelled single-seed and is not replicated.
      - n: 11
        k: 4
        N: 23
        D_expected_stable: 6
        D_max: 8
        full_columns_at_D_max: 880970
        gate: footprint_precompute
        seeds_if_cleared: [2026]
        replication_note: SINGLE SEED. Any value read here is labelled single-seed and is not replicated.
    footprint_precompute_gate:
      when: STAGE 0B, before any linear algebra anywhere in the contract
      cost: zero rank work; combinatorics plus the instrument's own declared bytes-per-entry
      rule: >-
        A gated rung is ATTEMPTED ONLY IF the precompute, using the instrument's OWN
        constructed row and column counts at every degree up to D_max and its own declared
        storage layout, predicts peak resident bytes <= 6.0 GiB - a 25% headroom below the
        8 GiB cap, chosen because the precompute is a prediction and the cap is a hard
        stop. A rung that does not clear it IS NEVER STARTED and is recorded as
        `out_of_envelope_by_precompute` with its predicted figure.
      why_a_gate_and_not_an_attempt: >-
        Directly from the maintainer ruling: a cap that truncates a cell mid-run yields an
        infrastructure stop, not a smaller result. The gate converts what v1 would have
        discovered by burning a run into something answered at zero cost before approval
        is spent.
    out_of_scope_never_attempted:
      - cells: n >= 12 (including n = 12, 15, 18)
        reason: >-
          At n = 12 the degree ceiling is D_expected_stable 7 (EV-SIG-006) + 2 = 9, giving
          sum_{i<=9} C(24, i) = 2,579,130 full columns - 14.8x the 174,035-column anchor
          cell that itself measured 6.669 GiB. At n = 15 the ceiling is D 8 + 2 = 10 and the
          column count is larger again; and this lane has ALREADY MEASURED n = 15 D = 6
          reaching 11.73 / 12.22 GiB IN THE PREPARE PHASE ALONE, with zero ranks obtained.
          These rungs are not attempted, not budgeted, and not capped-and-hoped.
        what_this_costs: >-
          GOAL-DREG-001's completion criterion (n in {12, 15, 18}, >= 3 seeds, with the
          semi-regular null control) is UNREACHABLE by this contract. Recorded here so that
          no reader, and no later decision, can treat this contract as progress toward it.
        successor_condition: >-
          A NEW contract under a NEW EXP id - never an amendment to this one - after either
          (a) a host whose service of this lane's exact GF(2) pass at >= 32 GiB is MEASURED
          and recorded, or (b) an out-of-core / sparse-elimination instrument whose MEASURED
          peak RSS at n = 10 is <= 6 GiB. Neither is specified by this contract and neither
          is claimed to be achievable.
      - cells: any rung off this enumerated list
        reason: >-
          The v1 open-ended ladder rule is WITHDRAWN. There is no "walk upward until it
          breaks" in v2. A rung not in `cell_list` is a DIFFERENT EXPERIMENT and needs a new
          contract (see invalidation_rules).

  inputs:
    procedure: >-
      STAGE 0 (zero compute, DECLARED FIRST). Freeze the homogenization convention, the
      full-column construction rule, the null-ensemble generation procedure (matched to
      the T11 SUPPORT pattern, not merely degree and variable count), the departure rule
      (three or more consecutive n beyond the ensemble spread, consistent in direction),
      the enumerated `cell_list` above including D_expected_stable per rung, and the
      per-rung memory and time budgets. Hash the declaration.
      STAGE 0B (ZERO RANK WORK, GATING, NEW IN v2). Two precomputes, both cheap and both
      before any linear algebra. (a) CONSTRUCTION FEASIBILITY: for every cell in
      `cell_list`, build the system and confirm `gen_decomposable_R` returns t = 3
      factor-base points; record N, k and the actual generator degree per rung. A cell
      that cannot be constructed is recorded CONSTRUCTION-INFEASIBLE, an input fact, and
      dropped. (b) FOOTPRINT PRECOMPUTE: for every precompute-gated cell, compute
      predicted peak resident bytes at every degree up to D_max from the instrument's own
      constructed counts and declared storage layout, and clear or refuse the cell against
      the 6.0 GiB gate. A refused cell is recorded `out_of_envelope_by_precompute` WITH ITS
      PREDICTED FIGURE and IS NEVER STARTED.
      STAGE 1A (GATE A - THE CHEAP REFUTATION, RUN FIRST, TERMINATING). Run the DIRECT
      F4/F5-style solve ALONE, ascending n over the constructible cells, seed 2026, under
      a hard per-cell cap of 600 s and the 8 GiB memory cap. Record, per n, whether a solve
      COMPLETED WITHIN THE PROBE CAP and its solving degree if so. IF NO n RETURNS A
      COMPLETED SOLVE, THE CONTRACT TERMINATES HERE. Its deliverable is that fact - which
      is v1's own falsification criterion ("No overlap n existing at all means
      HEUR-DREG-HILB-1 is never validated; no d_reg-hat may be reported and the contract's
      deliverable is that fact") - and NOTHING IN STAGES 1B THROUGH 5 RUNS. Maximum spend
      on a contract that ends at Gate A: STAGE 0B plus 6 probe cells, i.e. <= 4,200 s CPU,
      <= 7 runs, <= 8 GiB. A probe that hits its 600 s cap at some n records "no solve
      within the probe cap at this n" - a BUDGET fact about the probe, establishing only
      that this n supplies no overlap; it is not evidence about d_reg and not a solve
      failure.
      STAGE 1B (GATE B - BLOCKING VALIDATION). At every n where GATE A returned a completed
      solve, run the pivot-degree pass under the same convention and require EXACT INTEGER
      EQUALITY of the solving degree. Record the overlap boundary - the largest n at which
      both completed - because every later value is conditional past it. A disagreement at
      any such n STOPS THE ENTIRE CONTRACT and the disagreement at the named n is the
      deliverable.
      STAGE 2 (THE MEASUREMENT). For each cleared cell of `cell_list` in ascending n, for
      each declared seed, run the full-column pivot-degree pass: build the column set degree
      by degree under the declared chunking strategy, row-echelonize exactly over GF(2),
      read the pivot degrees, and record the first full-rank-stable degree, the full-column
      rank at each degree, wall time and MEASURED peak RSS. No rung outside `cell_list` is
      attempted. If a measured stable degree exceeds its declared D_expected_stable, the
      extra degrees go back through the STAGE 0B footprint gate before being computed.
      STAGE 3 (THE NULL ENSEMBLE, IN THE SAME RUN AS STAGE 2). At every reached rung,
      generate 20 draws of the T11-support-matched semi-regular null and run the identical
      pass on each, sequentially, WITHIN THE SAME RUN RECORD and under the same STAGE 0
      declaration hash, recording the ensemble's mean, full range and standard deviation of
      gap(n). The spread is what makes "departure" decidable and is a primary metric, not a
      diagnostic. Draws are recorded INCREMENTALLY as they complete: a cell that exhausts
      its budget with k < 20 completed draws reports k, and its spread is INADMISSIBLE for
      the departure rule at that rung.
      STAGE 4 (CONTROLS - BUDGET RING-FENCED, NEVER CROWDED OUT). Run the subset-column
      corank pass at every reached rung as a LABELLED NEGATIVE control and report its
      sequence beside the full-column one. Run the pivot-degree pass under a SECOND
      homogenization convention at three n and report the shift, which must be constant.
      These reservations are ring-fenced in `budget.stage_reservations`: an extra rung is
      never funded out of a control.
      STAGE 5 (zero compute). Assemble gap(n) against the ensemble, apply the frozen
      departure rule, and emit TRACKING, DEPARTURE or INCONCLUSIVE. No verdict is emitted at
      any n beyond the reached ladder, and no verdict is emitted at n >= 12 under any
      circumstance.
    instrument: >-
      Python 3.11 with exact GF(2) linear algebra. The system is the frozen boolean
      chained Semaev built by src/semaev_tree.py at m = 3, t = 3, Weil-descended to GF(2).
      Full column sets are constructed degree by degree under a declared chunking strategy
      so the whole matrix is never materialized at once. Peak RSS is measured per rung by
      the harness, not modelled. The direct-solve arm uses this lane's existing solver
      path. Recorded through harness/runner.py.
      NEW IN v2 AND REQUIRED: the instrument must CHECKPOINT AND RESUME at a granularity
      finer than the 600 s foreground command cap (.claude/settings.json
      BASH_MAX_TIMEOUT_MS = 600000), so that a cell whose budget is 3300 s is served by
      several resumable invocations rather than one command the surface cannot run. It
      must also expose the STAGE 0B footprint precompute as a standalone zero-rank-work
      entry point whose output is the predicted peak resident bytes per degree.
    parameters: >-
      m = 3, t = 3. n TAKEN FROM THE ENUMERATED `cell_list` ONLY - unconditionally
      {7, 8, 9}, plus {6, 10, 11} if and only if their STAGE 0B gates clear; n >= 12 is
      out of scope and never attempted. The list covers rungs both on the n/3 lattice
      (n = 6, 9) and off it (n = 7, 8, 10, 11). Degrees D from the system's own maximum
      generator degree (recorded, not asserted) through D_expected_stable(n) + 2 per the
      `cell_list` degree_ceiling_rule. Null ensemble 20 draws per rung. Seeds
      [2026, 20260825, 20260826] at unconditional rungs; seed 2026 only at gated rungs.
      Homogenization convention frozen at STAGE 0; a second convention run at three n for
      the shift check.

  controls:
    - id: C1
      name: DIRECT-SOLVE VALIDATION (BLOCKING)
      statement: >-
        At every n where GATE A's F4/F5-style solve completed within the probe cap, the
        pass's first full-rank-stable degree must equal the solve's solving degree exactly
        under the same convention. This is the only check that the instrument measures
        d_reg rather than some other integer.
      concrete_input_that_makes_it_fail: >-
        A REAL CELL, NOT A CODE MUTATION: n = 9, seed 2026, frozen convention A. GATE A
        returns solving degree 6 from the direct solver and STAGE 1B's pivot-degree pass
        returns first-full-rank-stable degree 5 (or 7) on the same constructed system.
        That single row falsifies HEUR-DREG-HILB-1, stops the contract, and is the
        deliverable.
    - id: C2
      name: T11-SUPPORT-MATCHED SEMI-REGULAR NULL ENSEMBLE
      statement: >-
        20 draws per rung, run through the IDENTICAL pass, in the SAME run record, under
        the same STAGE 0 declaration hash. Its MEASURED SPREAD - not a nominal
        semi-regular series - is what a departure is judged against.
      concrete_input_that_makes_it_fail: >-
        TWO REAL FAILING INPUTS. (i) MATCHING: at n = 8, seed 20260825, a null draw whose
        recorded support-pattern sha256 differs from the measured system's T11
        support-pattern sha256 - the draw is then a null about a different system and the
        ensemble is refuted as a control at that rung. (ii) DEGENERACY: at n = 8, the 20
        draws return a byte-identical per-degree rank vector and the same d_reg-hat across
        all 20, i.e. zero spread - the draws are not being redrawn, and a departure judged
        against a zero-width spread would be an artifact of the generator, not a
        measurement. Either input refutes the control and withholds the departure verdict
        at that rung.
    - id: C3
      name: SUBSET-COLUMN CORANK PASS (LABELLED NEGATIVE CONTROL)
      statement: >-
        This lane classifies subset-column coranks as artifacts; running the pass and
        reporting its sequence beside the full-column one shows the full-column
        requirement doing work, or shows that it does not - and either is recorded.
      concrete_input_that_makes_it_fail: >-
        At every reached rung (n = 7, 8, 9), seed 2026, the subset-column pass returns BOTH
        the same d_reg-hat integer AND the same per-degree rank vector as the full-column
        pass. The control then separates nothing: the full-column requirement this lane
        imposed is not load-bearing on this instrument. That outcome is a correction to
        this lane's own methodology and is a deliverable in its own right; it does not by
        itself invalidate the gap sequence and must be recorded beside it.
    - id: C4
      name: HOMOGENIZATION-CONVENTION CONTROL
      statement: >-
        A second convention at three n; the shift must be a constant independent of n.
      concrete_input_that_makes_it_fail: >-
        d_reg-hat(convention A) - d_reg-hat(convention B) = 1 at n = 7 and = 2 at n = 9,
        both seed 2026. The convention then interacts with the system's structure rather
        than contributing a constant offset; cross-n comparison is invalid and the entire
        gap sequence is WITHHELD, not caveated.
    - id: C5
      name: STABILITY MARGIN
      statement: >-
        Degrees are computed two beyond the first full-rank-stable degree, so stability is
        observed rather than inferred from the last degree the budget allowed.
      concrete_input_that_makes_it_fail: >-
        At n = 9, seed 2026, the largest degree actually computed is 6 and the first
        full-rank-stable degree read is also 6 - zero margin. That rung's value is DROPPED,
        not caveated. In v2 this is also the trigger for re-running the extra degrees
        through the STAGE 0B footprint gate; if they do not clear it, the rung is dropped
        as out-of-envelope rather than truncated.
    - id: C6
      name: PEAK RSS MEASURED PER RUNG
      statement: >-
        The reached n is the honest limit of the whole design and a reach reported without
        its memory is not checkable.
      concrete_input_that_makes_it_fail: >-
        A run manifest that reports n = 9 as reached with `peak_rss_bytes` absent or null.
        That rung's reach claim is then unverifiable and is withdrawn from the reported
        ladder. (This lane has already paid for the general version of this: the whole of
        the n = 15 finding is the MEASURED 11.73 / 12.22 GiB, and without those figures the
        stop would have been uninterpretable.)
    - id: C7
      name: GATE-A TERMINATION CHECK (NEW IN v2)
      statement: >-
        The contract must be able to end itself before any expensive stage runs. GATE A is
        executed first, alone, and its outcome is recorded before STAGE 1B is entered.
      concrete_input_that_makes_it_fail: >-
        A run record in which any STAGE 2, 3 or 4 artifact exists while GATE A's per-n
        completion table is absent, empty, or records zero completed solves. The control
        then failed to gate: expensive work ran that the contract's own falsification
        criterion forbade, and the whole run is `invalid_measurement`.

  independent_variables:
    - n, restricted to the enumerated cell_list, on and off the n/3 lattice
    - degree D within each rung, up to the declared D_max
    - 'system: measured chained Semaev versus T11-support-matched null draw'
    - 'column set: full versus subset (negative control)'
    - homogenization convention
    - seed

  metrics:
    primary:
      - >-
        GATE A's per-n completion table: for each cell, whether a direct F4/F5-style solve
        completed within the 600 s probe cap, and its solving degree if so. THE EXISTENCE
        OR NON-EXISTENCE OF ANY OVERLAP n IS A PRIMARY METRIC IN v2, because a null answer
        is a complete deliverable.
      - >-
        d_reg-hat(n), the first degree at which the graded pivot-degree Hilbert function
        of the full-column matrix becomes full-rank-stable, an integer per rung under the
        frozen convention.
      - >-
        gap(n) = d_reg-hat(n) - d_ff(n), an integer sequence over the reached rungs.
      - >-
        Null-ensemble mean and spread of gap(n) at each rung, over 20 matched draws;
        spread reported as the full range and the standard deviation, with the completed
        draw count k stated (a rung with k < 20 is inadmissible for the departure rule).
      - >-
        Overlap agreement, the count of n at which the pass and the direct solve returned
        the same solving degree, over the count at which both completed - required to be
        a perfect match.
      - >-
        Full-column rank at each degree per rung, as emitted.
      - >-
        Departure verdict in {TRACKING, DEPARTURE, INCONCLUSIVE}, assigned by the frozen
        rule at STAGE 0.
    secondary:
      - Measured peak RSS and wall time per rung and per degree.
      - >-
        STAGE 0B's per-cell outcome: constructed / construction-infeasible /
        out_of_envelope_by_precompute, with the predicted peak resident bytes for each
        gated cell.
      - The largest n reached by the full-column pass, and why the ladder ended there
        (cell list exhausted, precompute gate, or budget), stated as one of those three.
      - Subset-column corank sequence, labelled as an artifact control.
      - Convention shift at the three cross-checked n, with its constancy.
      - Number of degrees computed beyond the stable degree at each rung.
      - Actual N and generator degree per rung, beside the cell_list's declared values.
      - sha256 of the STAGE 0 declaration, of the frozen system, and of each null draw's support pattern.

  heuristic_under_test: HEUR-DREG-HILB-1
  heuristic_under_test_note: >-
    This contract's GATE A and GATE B are the validation experiment for HEUR-DREG-HILB-1
    of H-DREG-91be14 - the identification of the first full-rank-stable pivot degree with
    d_reg. The heuristic is structural rather than distributional, so the validation is
    an exact-agreement check against a direct solve at the overlap rather than a
    distribution comparison, and every value reported beyond the overlap is explicitly
    conditional on it. In v2 the validation is also the CONTRACT'S FIRST AND CHEAPEST
    ACT: if no overlap exists on this host, the heuristic is never validated, no
    d_reg-hat is reported, and nothing else runs.

  preregistered_prediction:
    quantity: >-
      The departure verdict for gap(n) against the T11-support-matched semi-regular null
      ensemble, and the overlap agreement count.
    formula: >-
      DEPARTURE is declared if and only if gap(n) lies outside the null ensemble's
      measured spread at three or more CONSECUTIVE reached n, in a consistent direction;
      TRACKING if gap(n) lies inside the spread at every reached n; INCONCLUSIVE
      otherwise. Overlap agreement is predicted to be a perfect match; anything else
      falsifies HEUR-DREG-HILB-1 and voids the sequence beyond the overlap. THE RECORD
      DOES NOT PREDICT WHICH OF TRACKING OR DEPARTURE OCCURS - it predicts that the
      measurement is decidable between them, and the ensemble spread is what makes that
      claim checkable. v2 ADDS ONE PRE-REGISTERED CAVEAT AND NO CHANGE TO THE RULE: on
      the unconditional three-rung ladder the rule has zero margin, so INCONCLUSIVE is
      a-priori the most likely verdict. The rule is NOT narrowed to compensate.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-002, whose predictions block
      states that "any nonzero gap(n) sequence that diverges from the T11-matched
      semi-regular null at 3+ consecutive n constitutes a departure signal", and whose
      falsification_conditions name both the tracking and the departure branches. The
      ENSEMBLE SPREAD and the consistency-of-direction requirement are this contract's
      additions (v1), added because divergence from a single nominal null curve is not
      measurable without knowing that null's own variability. The zero-margin caveat is
      v2's, and it reports a consequence of the servable ladder rather than changing the
      rule.

  scale_relevance:
    tier: toy
    justification: >-
      The rungs are toy n on a Weil-descended boolean system, ENUMERATED IN ADVANCE rather
      than discovered by exhausting memory. The ladder tops at n = 9 unconditionally
      because that is the largest cell whose full column set at the degree ceiling sits
      comfortably inside the only memory envelope this host has recorded serving (see
      `host_service_envelope`), with n = 10 and n = 11 gated on a zero-cost footprint
      precompute and n >= 12 declared out of scope. The design's scale argument is that the
      pivot-degree pass removes the Groebner reduction blowup while keeping the quantity,
      so it should reach FURTHER than a solve; how much further is MEASURED and reported,
      not assumed, and v2 does not assume it reaches further than n = 9.
      THE TRANSFER ASSUMPTION IS NARROW AND STATED: that the identification validated at
      the overlap persists at the rungs beyond it. That is HEUR-DREG-HILB-1's unvalidated
      region and every value there is labelled conditional. A SECOND TRANSFER CAVEAT, NEW
      IN v2: the resource figures the ladder is sized against come from a different
      instrument on this host and bound the HOST, not this pass - which is why the gated
      rungs are gated on this instrument's own precompute and why every reach is reported
      with its measured peak RSS.
    correspondence: null

  tail_checks:
    - >-
      Report the null ensemble's full range as well as its standard deviation, and the
      completed draw count k; a departure judged against a standard deviation on 20 draws
      can be an outlier artifact, the range makes that visible, and a rung with k < 20 is
      inadmissible for the departure rule.
    - >-
      Report the number of degrees computed beyond the stable degree at each rung; a
      stable degree observed at the last computed degree is not observed stability.
    - >-
      Report per-rung peak RSS beside the reached n, since the ladder's endpoint is a
      resource fact and an unmeasured one is not checkable.
    - >-
      Report the rungs off the n/3 lattice separately, since this lane's structure is
      indexed by k = ceil(n/3) and lattice and off-lattice rungs are not interchangeable.
      On the v2 ladder n = 9 is on-lattice and n = 7, 8 are off-lattice, so an
      on/off-lattice comparison rests on ONE on-lattice rung unless n = 6 constructs.
      State that when reporting the comparison; do not present it as a two-sided contrast
      it cannot support.
    - >-
      Report STAGE 0B's predicted peak resident bytes beside STAGE 2's MEASURED peak RSS at
      every rung that ran. The precompute is a gate, and a gate whose predictions are never
      compared against measurements silently stops being one.

  replication:
    seeds: [2026, 20260825, 20260826]
    independent_instances: 3
    repeat_count_per_cell: 1
    note: >-
      The measured system is frozen and deterministic given its seed, so seeds vary the
      constructed instance and the null ensemble draws. d_reg-hat on a given measured
      system is deterministic and is not repeated; the null arm is replicated 20 times per
      rung, which is where the variability lives.
      v2 QUALIFICATION, DISCLOSED: three seeds are run at the UNCONDITIONAL rungs
      (n = 7, 8, 9) and at n = 6 if it constructs. At the precompute-gated rungs n = 10 and
      n = 11 only seed 2026 is run, funded from a small conditional reserve; any value read
      there is LABELLED single-seed in every artifact and may not be presented as
      replicated. GATE A, GATE B, the subset-column control and the convention control run
      at seed 2026 only, as in v1.

  budget:
    wall_clock_seconds: 3300
    wall_clock_seconds_per_run: 3300
    wall_clock_seconds_note: >-
      Per run/cell, matching the handoff-envelope turn budget this execution surface
      serves. Equal to `wall_clock_seconds_per_run`; both names are carried because v1 and
      templates/research-records.md use different ones.
    per_invocation_cap_seconds: 600
    per_invocation_cap_note: >-
      The current foreground command cap on this surface (.claude/settings.json
      BASH_MAX_TIMEOUT_MS = 600000). A cell longer than 600 s is served by CHECKPOINT AND
      RESUME across invocations; this is a required instrument property, not an assumption.
    total_cpu_hours: 15.0
    memory_gb: 8
    maximum_memory_gb: 8
    memory_note: >-
      8 GiB is (a) the program's declared memory floor in templates/research-records.md
      ("maximum_memory_gb >= 8 (DREG peaked at 7.16 GB)") and (b) the largest envelope
      under which this lane has a recorded `completed_valid` run on this host (measured
      peak RSS 6.669 GiB at n = 12 D = 6). It is a HARD STOP, and the STAGE 0B precompute
      gate at 6.0 GiB exists so that no cell is started that is expected to approach it.
    maximum_runs: 31
    maximum_workers: 1
    stage_reservations:
      - stage: STAGE 0B precompute (construction + footprint)
        runs: 1
        seconds: 600
        note: zero rank work
      - stage: STAGE 1A GATE A (direct-solve probe, seed 2026, 6 cells)
        runs: 6
        seconds: 3600
        note: 600 s hard cap per cell; this is the whole cost of a contract that terminates at Gate A
      - stage: STAGE 1B GATE B (pivot pass at each overlap n, seed 2026)
        runs: 4
        seconds: 7200
        note: 1800 s per cell; sized for up to four overlap rungs
      - stage: STAGE 2+3 unconditional (n = 7, 8, 9 x 3 seeds, measured arm + 20-draw ensemble in the same run)
        runs: 9
        seconds: 29700
        note: 3300 s per cell; the ensemble multiplies time, not memory
      - stage: STAGE 4 controls (RING-FENCED - subset-column at up to 4 rungs, convention at 3 n)
        runs: 7
        seconds: 6300
        note: 900 s per cell; an extra rung is NEVER funded out of this reserve
      - stage: CONDITIONAL reserve (n = 6 rung and/or precompute-cleared n = 10, 11, seed 2026 only)
        runs: 4
        seconds: 6300
        note: spent only on cells that cleared their STAGE 0B gate; unspent if none clear
    reconciliation: >-
      600 + 3600 + 7200 + 29700 + 6300 + 6300 = 53,700 s = 14.92 h <= total_cpu_hours 15.0.
      Runs 1 + 6 + 4 + 9 + 7 + 4 = 31 = maximum_runs. THE TOTAL IS DERIVED FROM THE CELL
      LIST, NOT ASSERTED OVER IT - which is the substantive difference from v1's 16.0, whose
      cells were unenumerated and therefore could not reconcile with anything.
    superseded_v1_budget:
      wall_clock_seconds: 7200
      total_cpu_hours: 16.0
      memory_gb: 24
      maximum_runs: 40
      superseded_by: this record's revision_record, on the maintainer ruling of 2026-09-04
      preserved_because: >-
        The old numbers are not silently overwritten. They are what an approver would
        otherwise have compared against, and the defect they carried is the whole reason
        this revision exists.

  stopping_rules:
    - >-
      GATE A IS TERMINAL. If no cell returns a direct solve completed within the 600 s
      probe cap, STOP THE ENTIRE CONTRACT at STAGE 1A. The deliverable is that no overlap n
      exists on this host, and no d_reg-hat may be reported. Nothing in STAGES 1B-5 runs.
    - >-
      Stop the entire contract if the pass disagrees with the direct solve at any overlap
      n, and report the disagreement at the named n as the deliverable.
    - >-
      A CELL WHOSE STAGE 0B FOOTPRINT PRECOMPUTE EXCEEDS 6.0 GiB IS NEVER STARTED. It is
      recorded `out_of_envelope_by_precompute` with its predicted figure. There is no
      "start it and see": v1's stop-at-the-first-rung-exceeding-the-budget rule is
      WITHDRAWN, because a rung stopped mid-computation is an infrastructure stop and never
      a value (AGENTS.md rule 5).
    - >-
      A cell that exhausts its declared per-cell wall clock is recorded
      `cell_incomplete_budget` with the work completed (for STAGE 3, the number k of
      completed draws). It yields NO d_reg-hat and NO admissible spread. It is a budget
      fact, never a value and never a negative result.
    - >-
      Stop and withhold the sequence if the homogenization-convention shift varies with n;
      cross-rung comparison is then invalid.
    - >-
      Stop at maximum_runs, total_cpu_hours or memory_gb, whichever binds first. The STAGE 4
      control reservation is RING-FENCED and is spent before any conditional rung: if the
      budget will not cover both, the controls run and the conditional rung does not.
    - >-
      Exhausting total_cpu_hours does not license continuing. More spending on this contract
      requires a committed Coordinator budget decision (AGENTS.md, "Goals are never paused",
      point 3).

  invalidation_rules:
    - >-
      A timeout, crash or memory exhaustion makes the run or the rung
      failed_infrastructure and is NEVER negative mathematical evidence about d_reg.
    - >-
      A run reporting d_reg-hat from SUBSET column sets in the primary arm is
      invalid_measurement; subset coranks are a labelled artifact control in this lane
      and using them as the measurement reproduces the artifact more cheaply.
    - >-
      A run in which the null ensemble was not executed in the same run record, through
      the identical pass, under the same STAGE 0 declaration hash, is invalid_measurement.
      Checkpoint-and-resume across invocations is permitted and expected; a SEPARATE RUN
      RECORD for the null arm is not.
    - >-
      A run in which the homogenization convention differs between the measured arm, the
      null arm and the validation arm is invalid_measurement.
    - >-
      A run whose stable degree was read at the last computed degree, with no margin
      above it, is invalid_measurement for that rung.
    - >-
      A run that computed any rung NOT IN `cell_list`, or any rung whose STAGE 0B gate did
      not clear, is a DIFFERENT experiment and requires a new contract. This includes any
      n >= 12 under any circumstance.
    - >-
      A run in which STAGE 2, 3 or 4 artifacts exist without GATE A's completion table, or
      with a GATE A table recording zero completed solves, is invalid_measurement for the
      whole run: the contract's own terminating gate was not honoured.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment
      and requires a new contract.

  success_criterion: >-
    A run is VALID if it satisfies whichever branch its GATE A outcome selects.
    BRANCH T (GATE A returns no completed solve at any cell). The run is VALID if
    (T1) STAGE 0B's per-cell outcome table is complete, and (T2) GATE A's per-n completion
    table is complete over every constructible cell with its per-cell wall time and peak
    RSS recorded, and (T3) no STAGE 1B-5 artifact exists. The deliverable is that no
    overlap n exists on this host; NO d_reg-hat, NO gap sequence and NO departure verdict
    is emitted, and none may be inferred.
    BRANCH M (GATE A returns at least one completed solve). The run is VALID if ALL of the
    following hold, each decidable from the primary metrics. (1) Overlap agreement is a
    perfect match - the pass and the direct solve return the same solving degree at every
    n where both completed - and at least one such n exists. (2) At every reached rung the
    stable degree was observed with at least two degrees of margin above it. (3) The null
    ensemble ran through the identical pass, in the same run record, at every reached rung,
    completing all 20 draws, and its spread is reported. (4) The subset-column control and
    the convention-shift control both reported, with the shift constant. (5) Every reached
    rung is in `cell_list` and cleared its STAGE 0B gate, and every rung's measured peak RSS
    is recorded beside its STAGE 0B prediction.
    A BRANCH-M run meeting (1) to (5) is VALID, and the verdict on H-DREG-91be14 (D3) is
    then whatever the frozen departure rule returns: TRACKING, DEPARTURE or INCONCLUSIVE.
    All three are reportable outcomes and the contract does not privilege any of them.
    BRANCH T IS A COMPLETE AND SUCCESSFUL OUTCOME OF THIS CONTRACT, not a failure of it.

  falsification_criterion:
    - >-
      Any disagreement between the pass and the direct solve at an overlap n falsifies
      HEUR-DREG-HILB-1 and (D1); every value beyond the overlap is withdrawn and no gap
      sequence is reported.
    - >-
      gap(n) inside the null ensemble spread at every reached rung falsifies the
      departure branch and resolves (D3) to TRACKING - the sub-rho scenario is killed
      within the tested scope only (which on the v2 ladder is n <= 9, or <= 11 if the gates
      cleared), and the obstruction is the measured sequence with its spread over exactly
      that scope.
    - >-
      gap(n) outside the spread at three or more consecutive rungs, consistent in
      direction, falsifies the tracking branch and resolves (D3) to DEPARTURE, which
      requires independent replication before any status change.
    - >-
      A convention shift that varies with n falsifies the comparability of the sequence
      across rungs and the sequence is withheld.
    - >-
      No overlap n existing at all means HEUR-DREG-HILB-1 is never validated; no
      d_reg-hat may be reported and the contract's deliverable is that fact. IN v2 THIS IS
      ASKED FIRST, AT GATE A, FOR <= 4,200 s AND <= 7 RUNS, so the contract can end itself
      before any expensive stage runs.
    - >-
      A stable degree read with no margin above it falsifies that rung's value, which is
      then dropped rather than caveated.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      the STAGE 0 declaration - homogenization convention, full-column rule, null
      generation procedure, departure rule, the enumerated cell_list with per-rung
      D_expected_stable, budgets - hashed before any rung ran
    - >-
      the STAGE 0B precompute table: per cell, constructed / construction-infeasible /
      out_of_envelope_by_precompute, with actual N, k, generator degree, per-degree column
      counts and predicted peak resident bytes for every gated cell
    - >-
      GATE A's per-n completion table: solve completed within cap yes/no, solving degree if
      yes, wall time and peak RSS per probe cell. THIS ARTIFACT IS REQUIRED EVEN WHEN THE
      CONTRACT TERMINATES AT GATE A - it is then the sole deliverable.
    - raw-result.json with per-rung, per-degree ranks and pivot degrees, not summaries
    - the direct-solve validation outputs at every overlap n, beside the pass's outputs
    - the 20 null-ensemble draws per rung, in the same file as the measured arm, with the completed draw count k
    - the subset-column control sequence, labelled as an artifact control
    - the convention-shift measurements at the three cross-checked n
    - >-
      measured peak RSS and wall time per rung, with the reached n stated explicitly and
      the reason the ladder ended (cell list exhausted / precompute gate / budget) stated
      as exactly one of those three

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting and Coordinator REVISION do not approve. This contract is
      review_required and NOT approved; approved_by is null and execution_authorized is
      false. Approval is the USER's gate because it authorizes execution and spends
      compute. The 2026-09-04 maintainer ruling was "REVISE BEFORE APPROVE" and this
      record is the revision, not the approval.
    - >-
      The blocking direct-solve validation must remain in the frozen protocol. Without at
      least one overlap n, HEUR-DREG-HILB-1 is unvalidated and the instrument measures an
      unidentified integer.
    - >-
      The null ensemble must be generated by matching the T11 SUPPORT pattern. A null
      matched only on degree and variable count is a null about a different system and a
      Coordinator must confirm the matching rule before approval.
    - >-
      A DEPARTURE verdict does not authorize a status change; it triggers independent
      replication, which is a separate decision.
    - >-
      NEW IN v2, AND AN APPROVER MUST WEIGH IT EXPLICITLY: this contract cannot reach
      n in {12, 15, 18} and therefore cannot contribute to GOAL-DREG-001's completion
      criterion; and on the unconditional three-rung ladder the departure rule has zero
      margin, making INCONCLUSIVE the a-priori most likely verdict. Approve it for what it
      can deliver - a cheap, terminating answer to whether any overlap n exists at all, and
      a validated instrument plus a small measured gap sequence if one does - or decline
      it. Do not approve it expecting the completion criterion.
    - >-
      NEW IN v2: before approval, a Coordinator confirms that the instrument named in
      `inputs.instrument` actually provides (a) checkpoint-and-resume finer than 600 s and
      (b) the standalone zero-rank-work footprint precompute entry point. Both are required
      properties of this contract, and approving without them would re-create v1's defect
      in a different place.

