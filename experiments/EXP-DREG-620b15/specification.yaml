  derivation_gaps:
    - >-
      CLOSED IN v2. v1 left the n range unfixed ("the contract fixes the LADDER RULE, not
      the numbers"). v2 fixes the numbers: `cell_list` enumerates every cell, in three
      declared classes, and no rung outside it may be computed. What remains open is only
      WHICH of the gated cells clear their zero-cost STAGE 0B gate, which is answered
      before any linear algebra runs.
    - >-
      d_ff(n) is taken from this lane's existing definition and is not redefined here. A
      Coordinator must confirm that the same definition and convention are used in the
      measured arm, the null arm and the historical values a reader will compare against;
      a silent definitional drift would produce a departure that is an artifact of
      bookkeeping. STILL OPEN.
    - >-
      Whether 20 null draws per rung give a spread tight enough to make the departure
      rule decidable is not known in advance. If the spread swallows every plausible
      signal, the honest outcome is INCONCLUSIVE and more draws, not a narrower rule.
      STILL OPEN, and on the v2 three-rung ladder it is sharper: the rule also has zero
      margin in the number of consecutive rungs available.
    - >-
      The chunking strategy for full-column construction is declared by the executor and
      affects the reached n materially. It must be recorded in the manifest, because a
      reach quoted without it is not reproducible. STILL OPEN, and in v2 it also feeds the
      STAGE 0B footprint precompute, so the declared strategy must be the one the
      precompute was computed against.
    - >-
      NEW IN v2 AND OPEN: whether the direct F4/F5-style solve completes within a 600 s
      probe cap at ANY cell on this host is unknown. That is not a gap in the design - it
      is the contract's first question, deliberately asked at near-zero cost, and a
      negative answer is a complete deliverable rather than a defect.
    - >-
      NEW IN v2 AND OPEN: whether n = 6 (k = 2, |V| = 4) admits t = 3 distinct factor-base
      points at all. Answered at zero rank work in STAGE 0B; a negative answer is an
