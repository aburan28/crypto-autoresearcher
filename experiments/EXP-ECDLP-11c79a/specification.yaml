# EXP-ECDLP-11c79a
# Symbol-count arithmetic. No field element is tested.
# Approved by DEC-20261003-002400.
experiment:
  id: EXP-ECDLP-11c79a
  hypothesis_id: H-ECDLP-47b35d
  source_idea: IDEA-20261003-247e49
  question_id: RQ-ECDLP-002
  version: 1
  title: Count of the values -1, 0, and 1
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-002400
  objective: >-
    Check the count 3, the absolute sum 2, and the nearby gap 0.
  inputs:
    value_count: 3
    abs_sum: 2
    abs_product: 0
    count_gap: 1
    count_product: 6
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
  controls:
    - >-
      The values -1, 0, and 1 number 3. Dropping 0 from the set
      changes the count and invalidates the run.
    - >-
      The absolute values 1, 0, and 1 sum to 2 and multiply to 0.
      Three exceeds two by 1. The product of the count and the
      absolute sum is 6.
    - >-
      Two copies of the value 1 have absolute gap 0.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {count, sum, nearby}
    - route in {count, add}
  metrics:
    primary:
      - value_count
      - abs_sum
      - nearby_gap
      - implementations_agree
    secondary:
      - abs_product
      - count_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The count is 3. The absolute sum is 2. The absolute gap of
      two copies of 1 is 0.
    formula: >-
      Count -1, 0, and 1. Add the absolute values 1, 0, and 1.
      Multiply those absolute values. Subtract 2 from 3. Subtract
      1 from 1.
    source: >-
      IDEA-20261003-247e49 states the values -1, 0, and 1, read
      2026-10-03. The count, the absolute sum, and the absolute
      product were recomputed in this design session. That
      computation is not a run. No field element was tested.
  scale_relevance:
    tier: toy
    justification: Three written values. No transfer to a character sum.
    correspondence: null
  tail_checks:
    - The absolute product 0 and the nearby gap 0 are required. A check that stops at the count 3 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the count 3 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The count is not 3.
    - The absolute sum is not 2.
    - The absolute product is not 0.
    - The gap of the count over the absolute sum is not 1.
    - The value 0 is dropped, or a field element is tested.
  success_criterion: >-
    Both runs agree that the count is 3, that the absolute sum is
    2, and that the absolute product is 0.
  falsification_criterion: >-
    The runs agree that the count is computed, and that count is
    not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-11c79a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-11c79a/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-11c79a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-11c79a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-11c79a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-11c79a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any test of a field element or any character sum.
    - Any claim that a count of 3 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
