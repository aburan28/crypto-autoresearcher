experiment:
  id: EXP-ECDLP-1de2ec
  id_allocation_provenance: >-
    Pre-minted by the orchestrating session and verified free in origin/main
    before this design; relayed in the in-session design handoff for
    RQ-ECDLP-78dbc5 on 2026-09-08. Not derived by scanning state.
  hypothesis_id: H-ECDLP-32fad8
  derived_from_idea: IDEA-20260906-a3d6ae
  question_id: RQ-ECDLP-78dbc5
  goal_id: null
  version: 1
  status: approved
  approved_by: coordinator
  approval_decision: DEC-20260908-23a12e
  frozen: true
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: "Stage 0 is discharged at design time (per stopping_rules); only Stage 1 pilot cells may execute under this approval; Stages 2+ require a new Coordinator decision."
  designed_by: coordinator
  designed_at: '2026-09-08'
  approval_note: >-
    APPROVED under the standing user authorization of 2026-09-06 ("all is
    approved. ideas/experiments should be always approved"). Completeness
    self-check passed: inputs (frozen selection rule, P per entry, curve
    family, ladder), controls (a)-(i), independent variables, metrics
    (primary + secondary), seed policy (SplitMix-style, never re-drawn),
    replication, budget, stopping rules (F1 gate, budget exhaustion =
    F-infra), invalidation rules, success criterion (S1-S5), falsification
    criterion (F1-F5), required artifacts, cost model, scale_relevance, and
    interpretation are all present. The U ladder was corrected to be in
    units of T_BL so the decidable negative at U = 4*T_BL is directly
    measurable. Approval is recorded in DEC-20260908-23a12e. This approval
    authorizes Stage 1 (pilot) only; Stages 2-4 are a separate Coordinator
    decision after the pilot. Protocol fields are untouched by this
    approval.

  title: >-
    THE BATCH-GROWN TABLE WITH RELATION-GRAPH ACCOUNTING, MEASURED: does a
    precomputed table of T_0 < T_BL selected entries, grown during a batch
    with the U targets' own terminal distinguished points (solved or not)
    and resolved through a weighted union-find of relations, reduce the
    precomputed entries needed at fixed (P, L, epsilon) below the
    Bernstein-Lange selected-table frontier -- with its own Stage 0
    CGK-multi-DL reading gate, its own Stage 1 pilot that must separate
    "the batch supplies coverage" from "the batch supplies only pending
    relations" before any scale-up, a union-find-disabled null, the
    pure-Kuhn-Struik T_0 = 0 comparator, the LOWER/UPPER bracket accounting,
    the first-10% binding slice, the capped/uncapped memory arms, and a
    certified curve arm.

  objective: >-
    Measure, on a generic keyed-random-function instrument at N = 2^24
    (pilot) and N in {2^24, 2^27, 2^30} (full sweep) and on one toy
    prime-order curve at N about 2^24, the precomputed-entry ratio
    T_0(U)/T_BL(1) at fixed (P, L, epsilon) for the batch-grown table of
    IDEA-20260906-a3d6ae against the static Bernstein-Lange table built from
    the same pool, together with every control that could make the ratio
    misleading: the U = 1 baseline T_BL arm, the pure-Kuhn-Struik T_0 = 0
    arm, the LOWER/UPPER bracket accounting, the union-find-disabled null
    (outcomes (iii)-(iv) dropped), the first-10% binding slice, the
    capped/uncapped memory arms with S_peak, the phi decay, and a certified
    curve arm. Every quantity is counted in group operations and bits, never
    in wall clock. This contract is self-sufficient (its gates are its own)
    and cites EXP-ECDLP-612fb1 and EXP-ECDLP-869870 as the full instrument
    whose validation it does not depend on.

  definitions:
    N: order of the group (or size of the set for the generic instrument)
    T_BL: nominal Bernstein-Lange table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at 2^24, 1024 at 2^30
    T_0: number of precomputed entries STORED before the batch; T_0 in T_BL * {0, 1/8, 1/4, 1/2, 3/4, 1}
    W: expected walk length between DPs, W = sqrt(a N / T_BL); theta = 1/W
    a: T_BL W^2 / N in {1/4 (headline, W = (1/2) sqrt(N/T_BL)), 1/2}
    r: >-
      precomputation pool ratio, the number of DISTINCT distinguished points
      in the pool divided by T_BL, generation continuing until r T_BL
      distinct DPs are found with EVERY generating walk charged to P and
      every walk's (length, +1) credited to its DP -- the paper's procedure
    P: precomputation cost, the sum of all generation walk lengths in group operations, capped walks charged at the cap
    k: online walks per target, k = 4, each from an independent uniform restart, stop at first hit or relation
    cap: 8W steps per walk (paper); a capped walk is a miss, charged 8W, and contributes no DP
    U: number of targets processed; up to 32768
    L: online group operations per target, walk steps only; restart scalar multiplications and lookups counted separately
    epsilon: per-target success probability within the k-walk budget
    weight: published Bernstein-Lange weight S_d + 4 W h_d (S_d total length of walks credited to d, h_d their count)
    S: precomputed advice size in bits, T_0 times bits per entry (frozen below)
    S_peak: peak stored set in bits, max (precomputed + batch entries) times bits per entry
    LOWER bracket: >-
      THE ALGORITHM: only outcomes (i)-(ii) count at the time of the hit
      (solved immediately by a known-log entry)
    UPPER bracket: >-
      DIAGNOSTIC ONLY, generic arm only: any hit on a known DP counts (as if
      all pendings resolve); not an algorithm; bounds the LOWER-bracket loss
    T_0(U): >-
      smallest T_0 at which the GROW arm's batch-average per-target success
      equals epsilon at budget L, by log-linear interpolation on the T_0
      grid; the ratio T_0(U)/T_BL(1) is the headline quantity
    C_sel: coverage of the precomputed selected table (basins above the threshold x*_0 W^2)
    C_batch(m): coverage of the batch's stored basins (below the threshold) after m batch walks
    deferred_resolution_loss: UPPER minus LOWER solved fraction

  instrument:
    generic_walk: >-
      f(x) = mix64(x XOR K) mod N with mix64 a fixed 64-bit mixer (e.g.
      splitmix64 finaliser) and K the walk-key seed; DP predicate
      hash64(x) < floor(2^64 / W) with an independent key so W need not be
      an integer; "hit" = the terminal DP is in the current table or batch
      store; nothing is certified (certificate kind: none) and the arm may
      not be quoted as solving logarithms.
    curve_walk: >-
      Toy prime-order short-Weierstrass curve E/F_p, p about 2^24, #E = N
      prime, found by search over small (a, b) with point counting and
      recorded as curve_id TOY-P24-<hash> with (p, a, b, N, P); r-adding
      walk f(X) = X + M_{j(X)}, j(X) = hash(x(X)) mod 32, M_j = [m_j]P with
      seeded known m_j, independent of every target (the Bernstein-Lange /
      Hitchcock interlude requirement); DP predicate on hash(x(X)) as above;
      online start Q_u + [c]P; a hit at d with accumulated scalar s gives
      k_u = log d - c - s mod N; batch entries from a target's walks get
      log d' = k_u + c' + s' (affine in the unknown).
    certificates: >-
      Curve arm only. Every solved target emits certificate kind
      discrete_log with (curve_id, P, Q_u, k_u), re-verified by the run
      wrapper with an INDEPENDENT scalar multiplication [k_u]P == Q_u not
      sharing code with the walk, AND checked against the seeded logarithm
      x_u (read only by the checker). Either check failing makes the run
      completed_invalid (docs/claims-and-verification.md).
    bits_per_entry_frozen: >-
      Precomputed table entry: 2 ceil(log2 N) bits (point identifier plus
      logarithm; the generic arm stores a placeholder logarithm of the same
      width so S is comparable across arms). Batch entry: table entry plus
      2 ceil(log2 N) bits (the affine-in-unknowns scalar (a_u, b_u)) plus
      32 bits (owner index). Union-find node: 64 bits (parent pointer plus
      affine relation to root). Frozen here; reported per arm as S and
      S_peak.
    charging: >-
      Group operations: one per walk step (generic: one mixer application;
      curve: one point addition). Counted separately: restart scalar
      multiplications (one per online walk, cost 1.5 ceil(log2 N) group
      operations each, reported as a count and as operations), table
      lookups (count), union-find operations (one find or union = one
      operation; path compression counted), certificate scalar
      multiplications (curve arm). Wall clock is recorded in the manifest
      and is never a decision variable.

  inputs:
    stage_plan: >-
      STAGE 0 (reading, HARD GATE, zero-compute): read Corrigan-Gibbs-Kogan's
      multiple-discrete-log preprocessing attack and lower bound; state the
      multi-instance bound form and whether the composition here is already
      one of their attacks. Absence recorded as absence. DISCHARGED AT DESIGN
      TIME (2026-09-08) on the committed coordinator reading of CGK Theorem
      8 (multi-instance lower bound S T^2/M + T^2 = Omega~(eps^{1/M} N M))
      and Theorem 11 (matching algorithm, O~(S) advice, O~(T) online,
      S T^2/M + T^2 = O(MN)) from scratchpad cgk.txt lines 1100-1137 and
      1415-1427 on 2026-09-06, recorded in H-ECDLP-37dc01
      structural_ingredients (internal provenance). RESULT: the
      relation-resolution structure (inter-instance collisions yield
      relations, solved by union-find / linear algebra) is structurally the
      same as CGK's Theorem 11 multi-instance algorithm and as
      Kuhn-Struik/FJM (retrieved summaries); the specific charged
      composition (selected Bernstein-Lange table + batch-grown entries with
      affine scalars + the T_0(U) recurrence) is NOT stated in CGK per the
      committed reading; the committed reading covers the bound and the
      algorithm's cost, not the full algorithmic details, so this is "not
      stated in CGK per the committed reading," not a definitive "not their
      attack." The novelty position is "adaptation" (as the proposal
      states); the record is positioned relative to the CGK multi-instance
      line. The full paper is not re-read in this session; the single-
      instance bound is from the abstract (KN-LIT-013). STAGE 1 (pilot,
      minutes, THE CHEAPEST VALID DISCRIMINATOR): N = 2^24, a = 1/4, r = 2,
      k = 4, T_0 in {T_BL, T_BL/2, 0}, U in {1, 512, 4096}, 3 seeds: solved
      fraction with full resolution accounting, the two brackets, and NULL1.
      This separates "the batch supplies coverage" from "the batch supplies
      only pending relations that never resolve" in one run. THIS IS THE GATE
       THAT MUST SEPARATE BEFORE ANY SCALE-UP (F1). STAGE 2 (hours): the full
       sweep of Step 4 at N in {2^24, 2^27}, 5 seeds, both memory arms, all
       nulls and the phi decay; the U ladder is the proposal's Step 4 ladder
       {1, 8, 64, 512, 4096, 32768} at N = 2^24 PLUS the decidable-negative
       point U = 4*T_BL (= 1024 at N = 2^24), so the falsification criterion
       F1 is directly measurable. STAGE 3 (hours): N = 2^30, 3 seeds, the
      largest cells only, for the N-independence of the T_0(U)/T_BL curve.
      STAGE 4 (hours): toy prime-order curve at N about 2^24, r-adding walk
      r = 32, every resolved logarithm certified. Seeds and CIs as in
      aed829. The order is binding: Stage 0 before Stage 1 is interpreted,
      Stage 1 (F1) before Stage 2 is authorized. THIS HANDOFF DISPATCHES
      STAGE 1 ONLY; Stages 2-4 are a separate Coordinator decision after the
      pilot.
    arms: >-
      ARM BASELINE(T_BL): the static Bernstein-Lange selected table with
      T_BL entries, no batch growth, U = 1 -- THE BASELINE for every ratio;
      the same pool, the same selection rule, the same P per entry. ARM
      GROW-UNCAP(T_0): batch-grown table + union-find relation resolution,
      uncapped memory (all batch DPs stored); T_0 in {T_BL, T_BL/2, 0}. ARM
      GROW-CAP(T_0): as GROW-UNCAP but S_peak <= T_BL (once full, new batch
      DPs are stored only if a relation can be recorded, otherwise dropped);
      T_0 in {T_BL, T_BL/2}. ARM NULL1(T_0): as GROW-UNCAP but union-find
      DISABLED -- outcomes (iii) and (iv) are DROPPED (a walk that lands on a
      batch entry owned by an unsolved target is a MISS, not a relation; a
      new DP is NOT stored); this isolates coverage (outcomes (i)-(ii)) from
      resolution (outcomes (iii)-(iv)); T_0 in {T_BL, T_BL/2}. ARM KS: pure
      Kuhn-Struik, T_0 = 0, P = 0 (the GROW-UNCAP arm at T_0 = 0; the P = 0
      comparator). ARM PHI(phi in {0, 0.25, 0.5, 0.75, 1}, T_0 = T_BL/2):
      as GROW-UNCAP but only a fraction phi of the batch DPs are stored
      (seeded Bernoulli per DP); phi = 1 is GROW-UNCAP, phi = 0 must equal
      KS bit-for-bit. CURVE arms (Stage 4): BASELINE(T_BL), GROW-UNCAP(T_BL),
      GROW-UNCAP(T_BL/2), NULL1(T_BL/2), KS, with certificates; U = 4096.
    per_target_protocol: >-
      For target u: draw up to k = 4 independent uniform restarts; walk each
      to its first DP or the cap; on the first hit, apply the arm's outcome
      rule: (i) hit on a precomputed entry -> solved, certificate (curve) or
      hit (generic); (ii) hit on a batch entry owned by a solved target ->
      solved; (iii) hit on a batch entry owned by an unsolved target ->
      record the relation, merge in union-find, stop walking (GROW arms) or
      miss (NULL1); (iv) new DP -> store with (a_u, b_u, u) and walk again
      (GROW arms) or miss (NULL1). Targets are independent, uniform,
      non-adaptive; the seeded logarithm is never read by the solver.
    selection_rule: >-
      FROZEN: the published Bernstein-Lange weight S_d + 4 W h_d (S_d total
      length of walks credited to d, h_d their count), pool of r T_BL
      DISTINCT distinguished points, walks capped at 8W, ties broken by a
      seeded permutation. The count rule of IDEA-20260906-05ffb8 is a second
      arm in the full sweep (Stage 2) but is NOT the headline; the headline
      is the published weight.
    P_per_entry: >-
      P is charged as the sum of all generation walk lengths in group
      operations, capped walks charged at the cap; P per entry = P / T_0,
      reported beside T_0 on every cell. The same P per entry is used for
      BASELINE and GROW arms at the same T_0, so the ratio T_0(U)/T_BL(1) is
      at equal P per entry.
    curve_family: >-
      Toy ordinary prime-field short-Weierstrass curves of prime order N
      (the object under study is the walk/table structure, which is generic;
      the curve supplies a concrete group and a certificate check). One
      curve at N about 2^24, found by search over small (a, b) with point
      counting, recorded as curve_id TOY-P24-<hash> with (p, a, b, N, P).
      The generic keyed-random-function instrument is the primary object;
      the curve is the certified arm.
    ladder: >-
      T_0 ladder: T_BL * {0, 1/8, 1/4, 1/2, 3/4, 1} (full sweep);
      {T_BL, T_BL/2, 0} (pilot). U ladder (in units of T_BL so the
      decidable negative at U = 4*T_BL is directly measurable): pilot
      {1, 2*T_BL, 16*T_BL} (= {1, 512, 4096} at N = 2^24); full sweep
      {1, T_BL/32, T_BL/4, 2*T_BL, 4*T_BL, 16*T_BL, 128*T_BL} (= {1, 8,
      64, 512, 1024, 4096, 32768} at N = 2^24). k ladder: {2, 4, 8} (full
      sweep); {4} (pilot). N ladder: {2^24, 2^27, 2^30} (full sweep);
      {2^24} (pilot).

  controls:
    - >-
      (a) BASELINE(T_BL): the U = 1 static Bernstein-Lange selected table
      with T_BL entries, no batch growth -- THE BASELINE for every ratio
      T_0(U)/T_BL(1); the same pool, the same selection rule, the same P per
      entry.
    - >-
      (b) KS: the pure-Kuhn-Struik T_0 = 0 arm (P = 0 comparator); the GROW
      arm at T_0 = 0; must be within a factor 2 of sqrt(2 N / U) group
      operations per target at U = 32768.
    - >-
      (c) LOWER/UPPER bracket accounting: the measured solved fraction must
      lie between the LOWER bracket (only outcomes (i)-(ii) count) and the
      UPPER bracket (any hit on a known DP counts); the gap is the
      deferred-resolution loss, reported per cell.
    - >-
      (d) NULL1 (union-find disabled): outcomes (iii) and (iv) dropped; a
      walk that lands on a batch entry owned by an unsolved target is a
      MISS, a new DP is NOT stored; must equal BASELINE(T_0) within CI at
      every U (no T_0 reduction); a reduction is a leak and invalidates the
      run set.
    - >-
      (e) PHI decay in {1, 0.75, 0.5, 0.25, 0}: the T_0 reduction must
      increase monotonically with phi, and the T_0 = 0 arm at phi = 0 must
      be pure per-target rho with no reuse (equal KS bit-for-bit).
    - >-
      (f) STRUCTURAL TELL: the first-10% success must stay BELOW the batch
      average; a batch whose early targets do as well as its late ones is
      not using the growth.
    - >-
      (g) CAPPED memory arm at S_peak = T_BL: the frontier-honest version;
      must still show T_0(U)/T_BL below 0.75 by U = 2 T_BL (a weaker but
      frontier-honest claim).
    - >-
      (h) GENERIC-VERSUS-CURVE transfer check at N = 2^24, a = 1/4:
      BASELINE(T_BL) and GROW-UNCAP(T_BL/2) steady-state success on the
      curve within CI of the generic instrument; a difference is a
      walk-quality finding reported separately, never folded into the gain.
    - >-
      (i) N-independence of the T_0(U)/T_BL curve across 2^24, 2^27, 2^30:
      a curve that drifts with N is the tell that something other than the
      random-function structure is being measured.

  independent_variables:
    - "N in {2^24} (pilot); {2^24, 2^27, 2^30} (full sweep); about 2^24 curve"
    - "a in {1/4} (pilot); {1/4, 1/2} (full sweep)"
    - "T_0 in {T_BL, T_BL/2, 0} (pilot); T_BL * {0, 1/8, 1/4, 1/2, 3/4, 1} (full sweep)"
    - "U in {1, 2*T_BL, 16*T_BL} (pilot); {1, T_BL/32, T_BL/4, 2*T_BL, 4*T_BL, 16*T_BL, 128*T_BL} (full sweep)"
    - "k in {4} (pilot); {2, 4, 8} (full sweep)"
    - "arm in {BASELINE, GROW-UNCAP, GROW-CAP, NULL1, KS, PHI}"
    - "memory arm in {UNCAPPED, CAPPED}"
    - "phi in {0, 0.25, 0.5, 0.75, 1}"
    - "walk in {keyed random function, r-adding curve walk r = 32}"
    - "seed (walk key, targets, union-find tie-break, null stream, phi stream)"

  metrics:
    primary:
      - "T_0(U)/T_BL(1) at U in {T_BL/2, T_BL, 2 T_BL, 4 T_BL}, a = 1/4, r = 2, k = 4, batch average; dimensionless; stratified-by-seed BCa bootstrap 95% CI"
      - "T_0(U)/T_BL(1) for the FIRST 10% of targets at the same epsilon; must be strictly above the batch-average ratio at every U (CI-separated for U >= T_BL)"
      - "measured solved fraction relative to the LOWER and UPPER brackets per cell; the gap (UPPER - measured) below 0.05 when C_sel >= 0.2"
      - "S_peak in bits per arm (UNCAPPED and CAPPED); the CAPPED arm at S_peak = T_BL must still show T_0(U)/T_BL below 0.75 by U = 2 T_BL"
      - "NULL1 T_0(U)/T_BL(1) at every U; must equal 1 within CI (no reduction)"
    secondary:
      - "solved fraction per target index, per cell, with Wilson CIs"
      - "T_0(U) at epsilon in {0.8, 0.9}, batch average and first-10%, bootstrap CI"
      - "group operations per target (online) and P for X_0; P per entry = P / T_0"
      - "S_peak per arm; bits per entry, frozen"
      - "outcome-type histogram (i)-(iv) and time-of-resolution histogram (immediately, later in the batch, never)"
      - "component-size distribution of the relation forest at batch end"
      - "certificate pass count on the curve arm (must equal solved count)"
      - "KS per-target cost at U = 32768 versus sqrt(2 N / U) (Kuhn-Struik order)"
      - "PHI decay: T_0 reduction as a function of phi in {0, 0.25, 0.5, 0.75, 1}; monotonicity and phi = 0 equal KS"
      - "N-independence of the T_0(U)/T_BL curve across 2^24, 2^27, 2^30"
      - "generic-versus-curve differences at 2^24"
      - "union-find operations per target and their ratio to the target's group operations"

  heuristic_under_test: null
  heuristic_note: >-
    The experiment tests the main claim of H-ECDLP-32fad8; HEUR-BGT-1's
    (batch coverage law) validation plan is folded in as a secondary metric
    (the below-threshold coverage at N = 2^24 with exact basins) and
    HEUR-BLT-1/2 are tested in full by EXP-ECDLP-869870, on which this
    contract does NOT depend because it carries its own gates.

  preregistered_prediction:
    quantity: >-
      T_0(U)/T_BL(1) at fixed (P per entry, L = k W with cap 8W, epsilon =
      0.9), a = 1/4, r = 2, k = 4, batch average and first-10%, generic
      instrument at N = 2^24 (pilot) and N in {2^24, 2^27, 2^30} (full
      sweep); together with the solved-fraction trajectory relative to the
      LOWER/UPPER brackets and the S_peak trajectory.
    formula: >-
      T_0(U)/T_BL(1) = 1 at U = 1 exactly (the batch is the static table).
      In the linear regime U k W^2 / N <= 1, T_0(U)/T_BL(1) falls linearly
      in U with slope about -beta k / T_BL, beta in [0.3, 0.7]. Below 0.75
      with CI excluding 1.0 by U = T_BL/2, and below 0.25 by U = 4 T_BL.
      T_0(U) reaches 0 at U_0 of order N/(k W^2) times a constant of order
      1-3 for epsilon = 0.9, which at T_BL = N^{1/3}, a = 1/4, k = 4 is U_0
      of order T_BL to 3 T_BL. The first-10% ratio is strictly above the
      batch-average ratio at every U (CI-separated for U >= T_BL) and above
      0.5 until U >= 4 T_BL. The measured solved fraction is inside the
      LOWER/UPPER brackets at every cell; the gap (UPPER - measured) below
      0.05 when C_sel >= 0.2 and growing as T_0 -> 0. NULL1 equals T_BL
      within CI at every U. KS is within a factor 2 of sqrt(2 N / U) per
      target at U = 32768. S_peak (UNCAPPED) grows about linearly in U k
      (1 - C_known); the CAPPED arm at S_peak = T_BL shows T_0(U)/T_BL below
      0.75 by U = 2 T_BL. Written before any run; never tuned to data; a
      change requires a versioned protocol_amendment and runs already
      executed are never re-scored.
    source: >-
      Model numbers derived in IDEA-20260906-a3d6ae claim (C) from
      IDEA-20260906-aed829 (B1)-(B3) and the batch coverage law H4 --
      UNVERIFIED derivations of this batch; published numbers from
      Bernstein-Lange Section 4 and Table 4.1 (primary text read by the
      coordinator 2026-09-06, scratchpad bl2012.txt); Kuhn-Struik's
      sqrt(2 L N) figure from a WebFetch summary (retrieved, hedged); CGK
      Theorems 8 and 11 from the coordinator's committed reading (internal,
      H-ECDLP-37dc01). The coordinator's scratch (internal, unverified)
      shows the any-known-DP hit rate rising from 0.69 to 0.87 across 40000
      sequential targets at N = 2^30 with T_0 = 1024 -- the UPPER bracket
      only, with no resolution accounting, no null, no certificate; it
      informs the hit-rate ranges only and is never evidence.

  scale_relevance:
    tier: toy
    justification: >-
      Toy scale: curve arm at p about 2^24 (field <= 32 bits); generic
      instrument at N up to 2^30 is not a field and is labelled toy by the
      same ceiling. Every conclusion is a constant-factor statement under
      the generic S T^2 = Omega~(eps N) ceiling (KN-LIT-013) and the
      multi-instance S T^2/M + T^2 = O(MN) line (CGK Theorem 11), and is
      scoped to the tested (N, a, r, k, cap, walk, solver) grid;
      N-independence across 2^24, 2^27, 2^30 is the only transfer evidence
      and extrapolation to cryptographic N is an assumption to be stated per
      evidence record, never a result. Exponents (1/3, 1/3, 2/3) are
      unchanged by construction; the Kuhn-Struik 1/2 with U-amortisation is
      unchanged at U >= U_0.
    correspondence: null

  tail_checks:
    - "The U = 1 GROW arm versus BASELINE(T_BL): bit-identical (deterministic tail of the decay)."
    - "The largest exact basin per seed at N = 2^24 against the Borel(1 - theta) N/W-sample order-statistic 99% band."
    - "The single cell with the largest |NULL1 - BASELINE| across all cells, reported individually with its CI."
    - "The single largest exceedance (if any) of the measured solved fraction over the UPPER bracket, reported with the cell and seed (must be zero or negative)."
    - "The capped-walk fraction and the cycle mass per cell; a cell with capped fraction above 0.01 is flagged and its L re-reported with capped walks charged at the cap."
    - "The seed with the smallest T_0 reduction of GROW-UNCAP(T_BL/2) at U = 4 T_BL, reported beside the pooled value."
    - "Curve arm: certificate pass count equals solved count exactly; any mismatch is completed_invalid."
    - "The first-10% slice reported per seed beside the batch average."
    - "The component-size distribution of the relation forest at batch end, reported per (T_0, U, seed)."

  replication:
    seeds: [1, 2, 3]
    independent_instances: 3
  seed_policy: >-
    Generic arm: walk-key seed s in {1, 2, 3} (pilot) or {1, 2, 3, 4, 5}
    (full sweep), target seed 100 + s, union-find tie-break stream 200 + s,
    NULL1 relabelling stream 300 + s, PHI Bernoulli stream 400 + s; every
    arm at the same s shares the walk, the pool and the target sequence so
    that arms differ only in the declared way. Curve arm: s in {1, 2, 3}
    with the same offsets, plus curve-search seed 1000. Independent
    instances: 3 per (N, a) generic (pilot), 5 (full sweep), 3 on the
    curve. Seeds are derived by a SplitMix-style finaliser from the base
    seed and are NEVER re-drawn: a duplicated or missing seed invalidates
    the cell. Seeds are recorded in every manifest.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 120
    maximum_workers: 1
  budget_note: >-
    Sized to the work, not the tool window. Group-operation counts: at
    2^24 one arm at U = 4096 is about 4096 * 4 * 362 = 5.9e6 walk steps;
    about 20 arm-cells per (a, seed) give about 1.2e8 steps per run,
    vectorised over the round's walks (minutes); 2^27 and 2^30 are 8x and
    64x larger; exact basins at 2^24 need about 5 int32 arrays of 16M
    entries (about 0.4 GB). Curve arm: about 5 arms x 3 seeds x about 1e6
    point additions plus certificates in pure Python, well under an hour.
    Run count: 20 (Stage 1 pilot) + 60 (Stage 2) + 10 (Stage 3) + 6 (Stage
    4) + 4 (analysis) = 100, with 20 spare for recorded infrastructure
    re-runs. The 8 GB figure is the schema floor and is not approached.
    Time and CPU estimates are advisory (docs/research-budget-policy.md);
    the memory cap is machine protection.

  stopping_rules:
    - "Stage 0 is discharged at design time (recorded in inputs.stage_plan); if the committed reading is found to be incomplete or incorrect, the Stage 0 gate is re-opened and Stage 1 is not interpreted until the reading is corrected."
    - "F1 (Stage 1 POS-style gate): the pilot must SEPARATE 'the batch supplies coverage' from 'the batch supplies only pending relations that never resolve' before any scale-up. Separation is declared when: (i) GROW-UNCAP(T_BL/2) shows a T_0 reduction CI-separated from BASELINE(T_BL/2) at U = 4096, AND (ii) NULL1(T_BL/2) shows NO T_0 reduction (equals BASELINE within CI) at U = 4096, AND (iii) the measured solved fraction is inside the LOWER/UPPER brackets at every pilot cell. If any of (i)-(iii) fails, Stages 2-4 are NOT authorized and the Coordinator records the outcome."
    - "Any exceedance of the UPPER bracket by the measured solved fraction stops the run as completed_invalid (implementation error)."
    - "Any certificate failure on the curve arm stops that run as completed_invalid."
    - "Stop at maximum_runs or total_cpu_hours, whichever binds first; a cell not reached is reported as not run, never as a negative (budget exhaustion = F-infra, AGENTS.md rule 5)."
    - "Wall clock per run at 3600 s; a run that exceeds it is failed_infrastructure and is re-planned with a smaller shard, never interpreted."

  invalidation_rules:
    - "Execution while status is not approved or execution_authorized is false: no run under this contract is evidence."
    - "A timeout, crash, memory exhaustion or dependency failure is failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5)."
    - "NULL1 showing a T_0 reduction CI-separated from BASELINE: lookups are leaking; the run set is invalid, not evidence."
    - "The measured solved fraction falling below the LOWER bracket: the accounting or the union-find is wrong; invalid run set."
    - "Any exact coverage above the exact global top-T_0 share: invalid (impossible by disjointness)."
    - "Duplicated or missing seeds, a manifest missing command, commit, dirty-tree state, environment, requested policy or resolved model, or raw/summary disagreement: invalid."
    - "Any solved logarithm on the curve arm without a verified: true certificate, or any certificate failing independent re-verification or the seeded-log check: completed_invalid."
    - "Reading the seeded logarithm anywhere in the solver path: invalid."
    - "Any post-hoc change to the T_0 grid, the U grid, the k grid, the tolerances, the success margin or the pre-registered prediction: requires a versioned protocol_amendment; runs already executed are never re-scored."

  success_criterion: >-
    EFFECT (all of S1-S3, at a = 1/4, r = 2, k = 4, generic instrument at
    N = 2^24, with Stage 0 passed and the pilot gates clean): S1 --
    T_0(U)/T_BL(1) falls below 0.75 with 95% CI (stratified-by-seed BCa
    bootstrap) excluding 1.0 by U = T_BL/2, and below 0.25 by U = 4 T_BL
    (batch average). S2 -- the first-10% slice is strictly above the
    batch-average ratio at every U (CI-separated for U >= T_BL) and above
    0.5 until U >= 4 T_BL. S3 -- the measured solved fraction is inside the
    LOWER/UPPER brackets at every cell; the gap (UPPER - measured) below
    0.05 when C_sel >= 0.2. MECHANISM (both, required for the mechanism
    clause of H-ECDLP-32fad8): S4 -- NULL1's T_0(U) equals T_BL within CI at
    every U (no reduction); S5 -- the KS arm is within a factor 2 of
    sqrt(2 N / U) group operations per target at U = 32768. EFFECT met and
    MECHANISM met -> the hypothesis is supported at toy scale on the tested
    grid (constant factor only). EFFECT met, MECHANISM not met -> effect
    supported, mechanism inconclusive, no mechanism claim promoted. Neither
    S1 nor F1 met (CI straddles) -> inconclusive; extension of U or seeds
    only by amendment. The curve arm must agree with the generic arm within
    CI at 2^24 (control (h)) for any curve-scoped statement; disagreement
    limits every conclusion to the random-function instrument.

  falsification_criterion: >-
    F1 -- at U = 4 T_BL, T_0(U)/T_BL(1) is not below 1 with 95% CI (batch
    average) at a = 1/4, r = 2, k = 4, with the pilot gates passed and nulls
    clean: the batch's own DPs do not substitute for precomputed entries at
    this budget; the hypothesis is REJECTED IN ITS STATED REGIME, with
    T_0(4 T_BL)/T_BL and its CI as the obstruction quantity over the stated
    scope. F2 -- NULL1 shows a T_0 reduction CI-separated from BASELINE:
    artifact, invalid, not a negative. F3 -- the measured solved fraction
    falls below the LOWER bracket: artifact, invalid. F4 -- the first-10%
    slice matches the batch average within CI at U >= T_BL: the mechanism
    clause is falsified (the growth is not what drives the gain). F5 -- the
    CAPPED arm shows no reduction while the UNCAPPED does: the gain is a
    memory trade, reported as a frontier point on the (P, S, L, epsilon, U)
    axis and not as a T reduction. Any gate failure is INVALID, never
    negative.

  required_artifacts:
    - "experiments/EXP-ECDLP-1de2ec/runs/RUN-*/manifest.yaml with exact command, git commit and dirty-tree state, environment, requested policy, resolved model identifier and fallback flag, seeds, wall clock, peak_rss_bytes"
    - "experiments/EXP-ECDLP-1de2ec/runs/RUN-*/raw-result.json with one record per (arm, target): walks used, steps per walk, outcome type (i)-(iv), hit entry, time-of-resolution, and for the curve arm the certificate; per-target S, S_peak, union-find operations, restart and lookup counts"
    - "experiments/EXP-ECDLP-1de2ec/runs/RUN-*/summary.json with per-arm per-U solved fractions (batch average and first-10%), T_0(U)/T_BL(1) with bootstrap CIs, LOWER/UPPER brackets, S_peak, outcome-type histograms, time-of-resolution histograms, component-size distributions"
    - "exact basin-size histograms (compressed) per (N = 2^24, a, seed) and the curve, with cycle and capped mass"
    - "the curve record (p, a, b, N, P, curve_id) with the point-counting verification"
    - "certificates for every solved logarithm on the curve arm in raw-result.json, kind discrete_log, verified: true by the independent verifier, verifier_commit recorded; kind none stated explicitly for generic runs"
    - "the analysis run's CI tables: T_0(U)/T_BL(1), first-10% slice, LOWER/UPPER brackets, S_peak, NULL1, KS, PHI decay, N-independence, with the bootstrap code and resample count"
    - "the instrument implementation at a path declared in the executor handoff, recorded by commit in every manifest; one code path for all arms with arm selection by configuration"
    - "a per-run cost table separating MEASURED (counted) from MODELED (formula) numbers, never mixed in one column"
    - "experiments/EXP-ECDLP-1de2ec/execution-report.yaml per the executor's required output format"

  cost_model:
    measured_vs_modeled: >-
      MEASURED: every count (walk steps, restarts, lookups, union-find
      operations, certificate operations, bits, P), every rate and every
      solved fraction. MODELED: C_sel, C_batch(m), the beta in [0.3, 0.7]
      slope, the U_0 of order T_BL to 3 T_BL, the Kuhn-Struik sqrt(2 N / U)
      -- each labelled with its formula and source and never placed in a
      measured column.
    optimistic_assumptions:
      - "A walk step is one group operation; on a real curve a point addition is about 10 field multiplications and a lookup is a memory access -- the unit is stated, not converted."
      - "Restart scalar multiplications (1.5 log2 N group operations per online walk) are excluded from L, as the paper excludes them; they are counted and reported and are about 36 per walk at 2^24 against a walk of about 362 steps, i.e. NOT negligible at toy scale and reported as such."
      - "Union-find operations are counted in integer operations, which are not group operations; the ratio reported is of counts, not of time."
      - "The batch store is charged as working storage (S_peak), not as advice, following the paper's distinction; the CAPPED arm bounds it."
      - "Targets are uniform and independent; a skewed distribution is out of scope and would re-select a different object."
    memory_accounting: >-
      S = T_0 x 2 ceil(log2 N) bits (advice); S_peak = max (precomputed +
      batch entries) x (2 ceil(log2 N) + 2 ceil(log2 N) + 32) bits (working
      storage); both reported per arm and per target; the UNCAPPED arm's
      S_peak grows about linearly in U k (1 - C_known) and is the number
      most likely to be understated; measured peak_rss_bytes reconciled
      against the analytic sizes in the analysis run.
    hidden_overhead: >-
      None hidden in an o(1) term; the early-batch penalty and the working
      storage are the honest costs and are first-class metrics.
    standardized_parameter_sets: >-
      (N, T_BL, W, a, r, k, cap) = (2^24, 256, 362, 1/4, 2, 4, 8W) as the
      headline pilot cell; (2^27, 2048, 1024, 1/4, 2, 4, 8W) and (2^30,
      1024, 512, 1/4, 2, 4, 8W) as the full-sweep headline cells. No
      cryptographic parameter set is costed by this contract.

  interpretation:
    - >-
      Every conclusion this contract can license is claim_tier toy and is a
      CONSTANT-FACTOR statement under the generic S T^2 ceiling
      (KN-LIT-013) and the multi-instance S T^2/M + T^2 = O(MN) line (CGK
      Theorem 11); it moves no exponent and names no non-generic structure.
      It is scoped to the tested curves (one toy curve), the generic
      instrument, the parameters above, this solver and this budget;
      transfer to other N is an assumption to be stated in the evidence
      record.
    - >-
      The reduction is in PRECOMPUTED entries at fixed (P, L, epsilon) for a
      batch of U uniform targets and is bought with working storage during
      the batch; the CAPPED arm is the frontier-honest point on the
      (P, S, L, epsilon, U) frontier and S_peak is reported beside T_0 on
      every cell (RQ-ECDLP-78dbc5 definition of fewer_DP).
    - >-
      The resolution structure is already CGK's (and Kuhn-Struik's and
      FJM's); the charged T_0(U) recurrence with a selected table is not
      stated in CGK per the committed reading. The record is positioned
      relative to the CGK multi-instance line and does not claim to move it.
    - >-
      The generic arm solves nothing and certifies nothing; only curve-arm
      cells may be quoted as solved logarithms.

  assigned_to: executor
  review_required: true
  review_note: >-
    Claim-relevant producer; on approval the dispatch card must carry
    review_required: true with a dependent Validator task (blind
    re-derivation of the T_0(U)/T_BL(1) ratio and of the LOWER/UPPER
    brackets at 2^24 from the statement of the quantities, blind to the
    producer's implementation) and a Red Team task on the null and decay
    design.
