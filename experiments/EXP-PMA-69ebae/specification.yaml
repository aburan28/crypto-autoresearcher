experiment:
  id: EXP-PMA-69ebae
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-398c6b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-398c6b
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Instrument the constructive decider to count branches and assemblies, measure certificate
    bits against work avoided on the same instances, and test whether gate-obstructed tables are realizable
    over the named quadratic extension
  objective: 'The one uncertainty a run reduces is what a divisor-parity obstruction is WORTH, as
    opposed to whether it is real, which is the second reading docs/inventor-protocol.md section 4
    requires and which no PMA record has performed. Concretely: (i) it measures the serialized certificate
    size in bits under a frozen declared format against the number of orientation-root branches and
    candidate-matrix assemblies the independent constructive decider expands on the same instance
    when run without any use of the gate, producing a branches-avoided-per-bit distribution with median
    and interquartile range, and validating the pipeline against a trivial constant certificate that
    must measure as buying nothing; (ii) it tests the supply reading implied by the frozen assumption
    that quadratic-extension roots do not satisfy ordinary PMA4 over k(t), by attempting realizability
    of each gate-obstructed table over the quadratic extension named by its failing square class and
    requiring a witness matrix whose sixteen principal minors reverify, then comparing the confirmation
    fraction against the background rate on degree-matched non-realizable tables; (iii) it fills the
    obstruction block with examined true and a reading that either names a taker or records explicitly
    that none was found at the stated search size. The run decides nothing about whether divisor parity
    obstructs PMA4 and touches no cryptographic quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the named decider
      implementation and branching order, the frozen certificate serialization format, the tested
      instances and constant fields, the measured distribution of decider branches and assemblies
      avoided per certificate bit, with the timed-out fraction printed beside it; the measured extension-realizability
      confirmation fraction on gate-obstructed instances with reverified witnesses, against a degree-matched
      background; and a filled obstruction block recording the second reading and its search size.
      What does NOT follow: no cryptographic meaning of any kind for the compression ratio, no transfer
      of branch counts to any other decider, no inference from extension realizability to base-field
      realizability, no conclusion about whether divisor parity obstructs PMA4, no closure of the
      obstruction from an empty resource reading, and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): freeze the certificate serialization format, the decider
      branching order, the counter definitions, and the search list for the resource reading. STAGE
      1 (cost: hours, implementation): instrument the constructive decider with branch and assembly
      counters; verify instrumented and uninstrumented verdicts agree on a sample. STAGE 2 (cost:
      minutes to hours): run the decider, with no use of the gate, on gate-obstructed and gate-unobstructed
      instances matched on discriminant degree; record counts and timeouts. STAGE 3 (cost: minutes):
      serialize certificates and measure sizes; recompute a sample with an independent serializer.
      STAGE 4 (cost: minutes): NULL 1 trivial-certificate pipeline check, which must measure zero
      purchasing power. STAGE 5 (cost: hours): supply reading -- for each gate-obstructed instance,
      build the quadratic extension named by its failing class and run the decider there; reverify
      every witness by direct sixteen-minor evaluation. STAGE 6 (cost: hours): NULL 2 background --
      the same extension test on degree-matched uniform non-realizable tables. STAGE 7 (cost: hours,
      human): write the obstruction block with examined true, the reading, and the explicit search
      list, so that an empty reading is checkable rather than merely asserted.'
    instrument: Python 3 with sympy for exact rational-function arithmetic over k(t) and over quadratic
      extensions of the constant field; the constructive decider from the frozen module-B specification,
      implemented and instrumented with branch and assembly counters; an independent sixteen-minor
      reverifier written separately from the decider; a frozen certificate serializer plus an independent
      second serializer for the size cross-check. harness/runner.py for the manifest, seeds and inference
      block. No Sage.
    parameters: 'n = 4. Constant fields: F_q for the largest small odd q the parameter box admits,
      and its quadratic extension for the supply reading; Q with a quadratic number field for the
      supply reading where affordable. Instances: at least 30 gate-obstructed and at least 30 gate-unobstructed,
      matched on discriminant degree. NULL 1: the same instances with a trivial 64-bit constant certificate.
      NULL 2: at least 100 degree-matched uniform tables established non-realizable over the base
      field by the decider, then tested over the extension. Decider budget: 300 s per instance over
      the base field, 600 s over the extension; exceeded instances recorded as timeouts and excluded
      from every ratio. Serialization: a frozen format printed in the run record. Background-difference
      threshold 0.20.'
  controls:
  - 'NULL 1: trivial constant certificate paired with the same branch counts, which must measure as
    zero purchasing power.'
  - 'NULL 2: extension-realizability test on degree-matched uniform non-realizable tables, giving
    the background rate of quadratic-extension realizability.'
  - 'Instrumentation-invariance control: instrumented and uninstrumented decider must return identical
    verdicts on the whole sample.'
  - 'Extension witness control: every claimed extension realization carries a matrix over the extension
    whose sixteen principal minors reverify by direct evaluation in an independent implementation.'
  - 'Timeout accounting control: instances where the decider does not terminate within budget are
    counted and excluded from every ratio, with their fraction printed beside each ratio.'
  - 'Serialization control: the certificate format is frozen before the run and printed, and sizes
    are recomputed by an independent serializer on a sample.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. NULL 1 (compression baseline): the
    identical branches-avoided-per-bit measurement applied to a TRIVIAL certificate that carries no
    information -- a fixed-length constant string emitted for every instance, paired with the same
    decider branch counts. Since the trivial certificate rejects nothing, its true purchasing power
    is zero, and if the measurement pipeline reports a nonzero ratio for it the pipeline is measuring
    the decider''s cost rather than the certificate''s value. NULL 2 (supply baseline): the extension-realizability
    test applied to tables drawn from the degree-matched uniform null rather than from gate-obstructed
    instances, giving the background rate at which an arbitrary non-realizable table becomes realizable
    over a quadratic extension. For the generator to be a generator, its confirmation fraction must
    exceed NULL 2''s background rate; if it does not, the gate is not selecting field-of-definition
    instances, it is selecting non-realizable instances of any kind.'
  independent_variables:
  - 'instance class: gate-obstructed versus gate-unobstructed, matched on discriminant degree'
  - 'certificate: real divisor-parity certificate versus trivial constant certificate'
  - 'field: base constant field versus its quadratic extension'
  - 'arm: signal gate-obstructed instances versus NULL 2 degree-matched non-realizable tables'
  metrics:
    primary:
    - branches-avoided-per-certificate-bit distribution with median and interquartile range
    - decider branch count and candidate-assembly count per instance and per class
    - serialized certificate size in bits per instance under the frozen format
    - extension confirmation fraction on gate-obstructed instances, and NULL 2 background fraction
    - NULL 1 measured purchasing power for the trivial certificate (must be exactly 0)
    secondary:
    - wall-clock ratio per instance, reported beside the branch ratio
    - instrumented-versus-uninstrumented verdict disagreements (must be 0)
    - extension witness reverification failures (must be 0)
    - decider timeout fraction per arm and per field
    - independent serializer size agreement on the sampled certificates; also the obstruction block
      text, its examined flag, and the explicit search list behind the reading
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The purchasing power of a divisor-parity certificate, measured as decider work avoided
      per certificate bit, and the extension-realizability confirmation fraction of gate-obstructed
      instances.
    formula: 'purchasing_power(instance) equals (branch_count plus assembly_count from the uninstrumented-by-gate
      decider run on that instance) divided by (serialized certificate size in bits under the frozen
      format), reported only for instances the decider decides within budget, with the timeout fraction
      printed. Pre-committed: purchasing_power equals 0 for the trivial constant certificate; instrumented
      and uninstrumented verdicts agree exactly; extension witness reverification failures equal 0;
      extension confirmation fraction must exceed NULL 2 background by at least 0.20 for the supply
      reading to be called supported. No value is pre-committed for the purchasing-power distribution
      itself, by explicit refusal recorded in the proposal.'
    source: Pre-registered in the parent proposal IDEA-20260816-398c6b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are n = 4, at least 30 instances per class matched on discriminant
      degree, at least 100 background tables, over one small odd finite field and its quadratic extension
      plus Q where affordable, with per-instance decider budgets of 300 s and 600 s. The extrapolation
      assumptions are stated: branch counts bind to the named decider implementation and branching
      order and transfer to no other decider, and the compression ratio binds to the frozen serialization
      format. Timed-out instances are excluded from every ratio and their fraction is printed, so
      no unbounded avoided-work figure is ever inferred from an infrastructure limit, per AGENTS.md
      rule 3.'
    correspondence: null
  tail_checks:
  - Instances with the largest branch counts are inspected individually, since they dominate any mean
    and are where a timeout would most distort the ratio.
  - Instances whose certificates serialize unusually small are inspected, since they inflate the ratio
    most.
  - Extension witnesses with unusually simple entries are reverified twice, since a trivially simple
    witness often indicates a construction bug.
  - The gate-unobstructed matched instances are checked to confirm the degree matching actually held,
    since instance difficulty is the main confounder.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort and report nothing quantitative if NULL 1 measures nonzero purchasing power for the trivial
    certificate.
  - Abort if instrumented and uninstrumented deciders disagree on any verdict.
  - Report the compression ratio as unavailable, not as large, if the decider times out on more than
    a stated fraction of obstructed instances.
  - Stop the supply reading and report if any extension witness fails sixteen-minor reverification.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The instrumentation-invariance and trivial-certificate controls pass, the decider
    decides enough obstructed and matched-unobstructed instances within budget to report a purchasing-power
    distribution with its timeout fraction, every extension witness reverifies, and the obstruction
    block is filled with examined true and an explicit search list behind its reading.
  falsification_criterion:
  - NULL 1 nonzero purchasing power for a trivial certificate.
  - Any instrumented-versus-uninstrumented verdict disagreement.
  - Any extension witness failing sixteen-minor reverification.
  - 'Branch counts on gate-obstructed instances statistically indistinguishable from matched unobstructed
    ones: the certificate avoids no work, which is a complete and usable negative measurement.'
  - 'Extension confirmation fraction within 0.20 of NULL 2 background: the gate is not selecting field-of-definition
    instances and the supply reading is unsupported.'
  - 'Decider timeout fraction above the stated cap on obstructed instances: the compression ratio
    is unmeasurable at this scale and is reported as unavailable.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-398c6b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The constructive decider of module B is specified in H-PMA-001 but has never been built in this
    repository, and this entry depends on it entirely; the Coordinator must decide whether building
    it is in scope here or a prerequisite handoff.
  - The Coordinator must freeze the certificate serialization format and the decider branching order
    before the run, since the headline ratio is a function of both.
  - The search list for the resource reading must be fixed in advance -- which theories and tools
    are asked whether they want this measurement -- otherwise an empty reading is not checkable.
  - The quadratic extension named by a failing square class needs an explicit rule for the case where
    more than one class fails, since the extension is then not unique.
