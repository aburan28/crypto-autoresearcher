# EXP-ECDLP-91822a
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-022e03.
experiment:
  id: EXP-ECDLP-91822a
  hypothesis_id: H-ECDLP-ea7217
  source_idea: IDEA-20261004-91520b
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 2047
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-022e03
  objective: >-
    Check the counts 11, 10, and 10, the product 1100, and the nearby gap 0.
  inputs:
    bit_length: 11
    doublings: 10
    additions: 10
    length_gap: 1
    doubling_gap: 0
    digit_product: 1100
    digit_sum: 31
    nearby_a: 10
    nearby_b: 10
    nearby_gap: 0
    nearby_product: 100
  controls:
    - >-
      The bit length is 11. The doubling count is 10. The addition
      count is 10. Reporting the addition count as 11 drops the gap
      against the bit length and invalidates the run.
    - >-
      Eleven exceeds ten by 1. Ten equals ten, so that gap is 0.
      The product of 11, 10, and 10 is 1100. Their sum is 31.
    - >-
      Two readings of the addition count are both 10. Their gap is
      0 and their product is 100.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 2047 has bit length 11, 10 doublings, and 10
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 11. Count 10 doublings. Count 10 additions.
      Multiply 11, 10, and 10. Subtract 10 from 10.
    source: >-
      IDEA-20261004-91520b states the counts 11, 10, and 10, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 1100 and the nearby gap 0 are required. A check that stops at the bit length 11 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 10 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 11.
    - The doubling count is not 10.
    - The addition count is not 10.
    - The product is not 1100.
    - The addition count is reported as 11, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 11, that the doubling
    count is 10, that the addition count is 10, and that the product
    of those three counts is 1100.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 10.
  required_artifacts:
    - experiments/EXP-ECDLP-91822a/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-91822a/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-91822a/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-91822a/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-91822a/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-91822a/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
