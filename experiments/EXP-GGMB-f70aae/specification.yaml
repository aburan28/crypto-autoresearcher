experiment:
  id: EXP-GGMB-f70aae
  hypothesis_id: H-GGMB-da21f5
  derived_from_idea: IDEA-20260821-805cae
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Four-arm adjudication of coordinate-selected OUTPUT oracles CSEL(pi) by
    exhaustive measurement of c = log_P(rho_pi(E)) at toy scale - a zero-compute
    withdrawal gate, a uniformity-and-conditional-MI battery with a reported MDE,
    a random-generator null with a sample-size decay sweep, two positive controls
    (c = 1 and the j = 0 Aut-equivariant predicate whose non-uniformity is forced),
    and a transported-isogeny-class arm
  objective: >-
    The one uncertainty a run reduces is whether GOAL-ENDO-001 criterion C3's
    undecided RANGE-SIDE cell - oracles that take no group handle but RETURN one
    selected by a coordinate predicate - is simulable, and it does so by converting
    that modelling question into a statistical one about a single scalar. A run
    establishes (i) FIRST AND MOST CHEAPLY, whether the cell is already adjudicated
    in a primary record, in which case the work is WITHDRAWN at the cost of three
    file reads; (ii) whether c = log_P(rho_pi(E)) is uniform on (Z/N)^* over the
    sampled family, with a reported MINIMUM DETECTABLE EFFECT rather than a bare
    verdict; (iii) whether c is uniform CONDITIONED on each cheap curve label,
    which is a requirement and not a refinement because the marginal test provably
    cannot adjudicate the class; (iv) whether the battery rejects where
    non-uniformity is mathematically FORCED, without which no negative may be
    recorded; and (v) whether c stays uniform along one isogeny class with P
    transported by an isogeny of degree coprime to N. NO EXPONENT MOVES IN EITHER
    OUTCOME, and CSEL is not an attack even if non-simulable, because an adversary
    handed rho(E) must still solve a discrete logarithm to use it.
  what_this_is_not:
    - >-
      Not an attack. CSEL costs the adversary nothing and returns one group element
      per curve; using it still requires solving a discrete logarithm, which is
      another instance of the same problem.
    - >-
      NOT A CHALLENGE TO THE sqrt(N) GENERIC BOUND. A simulable verdict CONFIRMS
      the incumbent for one more oracle cell; a non-simulable verdict LOCATES a
      resource without exhibiting an algorithm that uses it.
    - >-
      NOT A CLASS-WIDE ADJUDICATION. The experiment tests FINITELY MANY predicates,
      so its outcome instantiates the inner quantifiers only, never the outer "for
      all pi". Any record reading it as class-wide is OVER-READING.
    - >-
      Not a statement at cryptographic N. The transfer assumption - that uniformity
      of c is not an artifact of small N - is NAMED AND NOT DISCHARGED.
    - >-
      Not a model-independent verdict. Shoup's and Maurer's simulators differ in
      what an adversary can ask about a returned element; the contract must name
      which is used and the verdict does not automatically transfer.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the tested toy N (10^3 to 10^4), for the
      finitely many named predicates and the declared feature set, under the named
      simulator formulation, c is (or is not) distinguishable from uniform at
      effect sizes above the reported MDE. WHAT DOES NOT FOLLOW - simulability for
      all predicates; anything at cryptographic N; any movement of the sqrt(N)
      generic bound; anything about adversaries that use coordinates directly,
      which is every real non-generic method; and no attack in either branch. A
      simulability verdict is A STATEMENT INSIDE A MODEL and inherits every known
      limitation of generic-group arguments. At N ~ 10^3 the chi-square has few
      counts per cell, so a null EXCLUDES ONLY LARGE EFFECTS and the record must
      state how large.
  inputs:
    procedure: >-
      ARM 0, THE WITHDRAWAL GATE (zero compute, RUNS FIRST) - re-read
      IDEA-20260807-413fcc, IDEA-20260811-b2806a and IDEA-20260807-63056d FROM THE
      PRIMARY RECORDS and confirm the range-side cell is genuinely undecided. If
      any of them already adjudicates it, WITHDRAW and record the withdrawal. This
      is the cheapest possible outcome and it is the first thing to try; the source
      session's own prior on it is 0.35. ARM 1, PRIMARY - sample at least 2000 toy
      curves over primes with 10^3 <= N <= 10^4 and PRIME group order; for each,
      enumerate E(F_p), compute rho_pi(E) for each of at least three named
      predicates, and compute c = log_P(rho_pi(E)) by EXHAUSTIVE discrete
      logarithm; run the uniformity and conditional-MI battery and report the MDE.
      ARM 2, CONTROLS - the same battery on (a) the random-generator null, (b) the
      pi = "return P" constant predicate, (c) the j = 0 Aut-equivariant predicate,
      (d) the decay sweep over instance counts. ARM 3, CLASS ARM - one isogeny
      class with P transported by an explicit isogeny of degree coprime to N, with
      a TRANSPORT CERTIFICATE re-verified INDEPENDENTLY OF THE TRANSPORT CODE, the
      same discipline EV-ENDO-10109d records for the MTGT runs where every
      transported entry was re-verified by recomputing [s]phi(P) on the target
      curve. ARM 4, SIMULATOR ADEQUACY - implement both the real oracle and the
      simulator at N ~ 10^3, run a DECLARED family of adversaries (formal-collision
      hunters, and an adversary that computes group operations on the returned
      handle and tests equalities) for q in {10, 100, 1000}, and measure the
      empirical distinguishing advantage against (statistical distance of c) +
      q^2/N.
    instrument: >-
      Exhaustive enumeration of E(F_p) and EXHAUSTIVE discrete logarithm for c at
      N <= 10^4, so NO HARDNESS ASSUMPTION ENTERS THE MEASUREMENT - the toy scale
      is chosen for exactly that reason. Conditional mutual information against a
      permutation null with at least 10^4 draws. A PRE-REGISTERED, pi-INDEPENDENT
      sampler for P, with its independence argued in the contract rather than
      assumed. Transport certificates re-verified by code independent of the
      transport implementation. Recorded through harness/runner.py with a manifest,
      seeds and source blob hashes.
    parameters: >-
      At least 2000 toy curves over primes with 10^3 <= N <= 10^4 and PRIME group
      order, generic j, in the primary arm; non-cyclic instances EXCLUDED from the
      primary arm and run only in a declared secondary arm. At least three
      coordinate predicates, NAMED AND FROZEN in the contract (for example "least
      x", "least x among points with even y", "least x in a declared window").
      Labels: D_0, two_torsion_x_count, ell = 2 volcano level, j in {0, 1728}, and
      the least-x value itself. Decay sweep over instance counts
      {200, 500, 1000, 2000, 5000}. Permutation null with at least 10^4 draws.
      alpha = 0.05 with a DECLARED family-wise correction over the declared
      (predicate x label) family. Replication at a SECOND prime for any rejection.
      Adversary query budgets q in {10, 100, 1000} in the simulator-adequacy arm.
  controls:
    - >-
      NULL OBJECT - rho replaced by a UNIFORMLY RANDOM GENERATOR of G, which makes
      c uniform BY CONSTRUCTION (a theorem, not a hope). The battery must ACCEPT at
      the nominal rate: 5 percent rejections at alpha = 0.05, inside an exact
      binomial interval. Over-rejection means the battery has a false positive rate
      and NO positive may be read from it.
    - >-
      POSITIVE CONTROL 1 - pi = "return P", so c = 1 constant. The battery must
      REJECT with overwhelming margin. This is simultaneously the baseline-embedding
      reproduction check, since on that slice CSEL collapses into the already-closed
      class.
    - >-
      POSITIVE CONTROL 2, MATHEMATICALLY FORCED - on a curve with j = 0 and
      p = 1 mod 3, Aut(E) contains an automorphism acting on G as a scalar of order
      3, so an Aut-equivariant predicate selects a point whose logarithm is
      confined to a coset of the order-3 subgroup and c is PROVABLY non-uniform.
      THE BATTERY MUST REJECT AT p < 1e-6. A failure to reject VOIDS THE INSTRUMENT
      and forbids recording any negative. Together with the null, BOTH DIRECTIONS
      of the RQ-INSTR-f8faa0 control are exercised, as GOAL-ENDO-001 C4 requires.
    - >-
      DECAY CONTROL over instance count on the null. The rejection rate must stay
      FLAT at the nominal alpha. A rejection rate that GROWS with sample size on a
      null where no effect exists is the canonical artifact tell and VOIDS THE
      BATTERY.
    - >-
      PRE-REGISTERED, pi-INDEPENDENT SAMPLER FOR P, with its independence argued in
      the contract. If P is chosen by any coordinate rule - e.g. "the first
      liftable x", which this campaign's samplers historically did
      (CORR-20260807-a05e1e, CORR-20260807-9f83be) - then c is structured by
      construction and the battery measures the SAMPLER. THIS IS THE PRIMARY RISK.
    - >-
      MULTIPLE-COMPARISON CONTROL - the number of (predicate x label) cells is
      DECLARED IN ADVANCE with a fixed family-wise correction. The campaign has a
      recorded multiplicity problem (IDEA-20260807-caf061 counts seven verdicts per
      class across four classes in one run) and this battery would otherwise repeat
      it: three predicates times five labels times two primes is thirty tests, and
      without correction the expected spurious rejections at alpha = 0.05 is about
      1.5 - LARGER than the effect being hunted.
    - >-
      TRANSPORT CERTIFICATE re-verified INDEPENDENTLY of the transport code
      (docs/claims-and-verification.md).
    - >-
      CONDITIONAL ARM AS A REQUIREMENT, NOT A REFINEMENT - two predicates can share
      the marginal law of c while differing in conditional structure, so the
      marginal test CANNOT adjudicate the class and omitting the conditional arm
      would be the identifiability failure.
  independent_variables:
    - coordinate predicate pi (at least three, named and frozen)
    - curve label - D_0, two_torsion_x_count, volcano level, j, least-x value
    - >-
      arm - real rho, random-generator null, constant predicate, j = 0
      Aut-equivariant predicate, transported class
    - instance count, over {200, 500, 1000, 2000, 5000} for the decay sweep
    - prime, for the replication requirement
    - adversary query budget q in {10, 100, 1000}
  metrics:
    primary:
      - >-
        c_per_instance - the exact value of log_P(rho_pi(E)) in (Z/N)^*
        (unitless residue) per instance per predicate, WITH its enumeration
        certificate
      - >-
        marginal_uniformity_pvalue - chi-square goodness of fit of c against
        uniform on (Z/N)^* (unitless p-value), per predicate
      - >-
        marginal_MDE - the minimum detectable effect in TOTAL-VARIATION DISTANCE
        detectable at 80 percent power at the realised sample size (unitless).
        THIS IS THE RECORDED OBSTRUCTION IN THE NEGATIVE BRANCH
      - >-
        conditional_mutual_information between c and each label (bits), with the
        permutation null's 99th percentile beside it
      - >-
        positive_control_verdicts - the battery verdict on the c = 1 slice and on
        the j = 0 Aut-equivariant predicate (categorical reject/fail-to-reject with
        p-values)
      - >-
        null_acceptance_rate - the battery's rejection rate on the
        random-generator null (unitless fraction), against the exact binomial
        interval at alpha = 0.05
    secondary:
      - >-
        decay_sweep_rejection_rates over instance counts {200, 500, 1000, 2000,
        5000} on the null (unitless fractions), with the exact binomial acceptance
        interval at each
      - >-
        declared_multiple_comparison_family - the cell count and the correction
        applied, declared in advance
      - >-
        transported_class_c_law - the distribution of c along the isogeny class
        (unitless), with its transport certificates
      - >-
        simulator_advantage - the measured distinguishing advantage per adversary
        and per q (unitless), against (statistical distance of c) + q^2/N
      - >-
        arm0_gate_status - one of {cell_undecided_proceed, cell_already_adjudicated_withdraw,
        primary_records_unobtainable} (categorical)
      - >-
        simulator_formulation_used - Shoup random-encoding or Maurer abstract
        (categorical), since a verdict under one does not transfer to the other
      - >-
        noncyclic_secondary_arm_subgroup_choice - the explicit subgroup choice used
        in the declared secondary arm, or `arm_not_run`
      - artifact manifest with hashes, seeds and a from-scratch rebuild receipt
  heuristic_under_test:
    - id: HEUR-001
      formal_statement: >-
        COORDINATE-SELECTION GENERICITY. For a predicate pi depending only on
        coordinates and not on the group structure, c = log_P(rho_pi(E)) is
        distributed as a uniform draw on (Z/N)^*, jointly with the public data, as
        the curve ranges over the sampled family.
      preregistered_prediction: >-
        The empirical distribution of c is not distinguishable from the uniform
        multinomial on (Z/N)^* (p > 0.05), and the conditional mutual information
        with every label sits at or below the permutation null's 99th percentile.
      prediction_source: >-
        The rigorous ingredient is that for a FIXED curve and a UNIFORMLY RANDOM
        generator P, c is exactly uniform on (Z/N)^* - a theorem, and precisely the
        content of the random-generator null arm. The classical statement imitated
        is that an arithmetically defined selection behaves like a random one, the
        same shape of assumption as the genericity of the least quadratic
        non-residue. THE GAP IS STATED: the experiment FIXES P by a sampler and
        VARIES the curve, which is NOT the situation the theorem covers, and
        closing that gap is what the measurement is for.
      scale_access_and_transfer: >-
        THE SHORTCUT THAT MAKES IT FEASIBLE: at 10^3 <= N <= 10^4 the discrete
        logarithm defining c is EXHAUSTIVE, so no hardness assumption enters the
        measurement, and the toy scale is chosen for exactly that reason. THE
        TRANSFER FROM N ~ 10^3-10^4 TO CRYPTOGRAPHIC N IS NOT MADE and is recorded
        as the open gap.
      sample_size_justification: >-
        At least 2000 instances against (Z/N)^* with N ~ 10^3 gives roughly 2 counts
        per cell - too few for a per-cell chi-square, which is why the battery must
        bin and why the MDE in TOTAL-VARIATION DISTANCE, not a p-value, is the
        primary reported quantity. The MDE is derived from the realised sample size
        at 80 percent power and is reported BEFORE any interpretation; the contract
        refuses to interpret any effect below it. Raising N sharpens the alphabet
        but raises the exhaustive-DL cost LINEARLY, which is what bounds the
        design.
      comparison_metric: >-
        Empirical distribution of c against the uniform multinomial on (Z/N)^*, and
        conditional MI against a permutation null with at least 10^4 draws.
      tail_checks:
        - >-
          The MOST and LEAST frequent c values against the multinomial's extreme
          quantiles.
        - >-
          Report the realised counts per bin, so a p-value computed on an
          under-populated alphabet is visible rather than trusted.
      falsification_condition: >-
        Marginal or conditional non-uniformity above the reported MDE, REPLICATED
        AT A SECOND PRIME, with both positive controls firing and the null accepted
        at the nominal rate.
    - id: HEUR-002
      formal_statement: >-
        SIMULATOR ADEQUACY. An adversary's advantage against CSEL(pi) is bounded by
        the statistical distance of c from uniform plus the standard generic-group
        collision term O(q^2/N).
      preregistered_prediction: >-
        The measured distinguishing advantage of every declared adversary, at every
        q in {10, 100, 1000}, lies at or below (statistical distance of c) + q^2/N.
      prediction_source: >-
        The standard generic-group hybrid argument, in which the simulator fails
        only on a formal-versus-real collision of probability at most q^2/N by a
        union bound over query pairs. RECALLED, NOT CHECKED, from Shoup
        (EUROCRYPT 1997) and Maurer. The step actually asserted - that adding one
        fresh symbol costs nothing beyond that symbol's distance from uniform - IS
        THE LOAD-BEARING JOINT and a reviewer must check it.
      scale_access_and_transfer: >-
        NONE. The bound is checked at EXACTLY the parameters used, N ~ 10^3, and
        the adversary family is DECLARED IN ADVANCE so a negative bounds only that
        family.
      sample_size_justification: >-
        Repeated trials at each q, enough that the empirical advantage's standard
        error is small against the predicted bound q^2/N - which at N ~ 10^3 and
        q = 1000 is already order 1, so the q = 1000 cell is VACUOUS and is
        reported as such rather than as a pass. The informative cells are q = 10
        and q = 100, where the bound is 1e-4 and 1e-2 respectively; the trial count
        must be fixed in the contract to resolve those, and the vacuity of the
        largest q is disclosed rather than hidden.
      comparison_metric: >-
        Measured advantage against (statistical distance of c) + q^2/N, per
        adversary and per q.
      tail_checks:
        - >-
          The LARGEST advantage over repeated trials against the predicted bound,
          not the mean.
        - >-
          Flag the q = 1000 cell as vacuous at N ~ 10^3, since q^2/N exceeds 1
          there.
      falsification_condition: >-
        An explicit adversary distinguishes real from simulated CSEL with advantage
        exceeding the sum of those two terms, exhibited at toy scale. The
        reduction's load-bearing joint then fails.
  preregistered_prediction:
    quantity: >-
      marginal_uniformity_pvalue and marginal_MDE, conditional_mutual_information
      per label, both positive_control_verdicts, null_acceptance_rate, and the
      decay-sweep rejection rates.
    formula: >-
      Predicted marginal_uniformity_pvalue > 0.05 (NOT distinguishable) on the
      primary arm, with the MDE reported and no effect below it interpreted.
      Predicted conditional MI at or below the null's 99th percentile for every
      label; an excess of at least 0.01 bits REPLICATED AT A SECOND PRIME is the
      falsifying observation. Predicted rejection at p < 1e-6 on the j = 0
      Aut-equivariant predicate and at overwhelming margin on the c = 1 slice.
      Predicted null_acceptance_rate at the nominal 5 percent rejections at
      alpha = 0.05, inside an exact binomial interval. Predicted decay-sweep
      rejection rates FLAT at alpha across all five instance counts. Under the null
      that the battery is measuring an artifact, the decay-sweep rate GROWS with
      sample size.
    source: >-
      Pre-registered in IDEA-20260821-805cae's `predictions`, `controls` and
      `heuristic_assumptions` blocks and restated in H-GGMB-da21f5 before any run
      under this contract exists. The forced non-uniformity at j = 0 comes from
      H-ENDO-001's scalar automorphism action and is CITED, not measured here.
      Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      10^3 <= N <= 10^4 is chosen SO THAT THE DISCRETE LOGARITHM DEFINING c IS
      EXHAUSTIVE - no hardness assumption enters the measurement, and c is computed
      exactly rather than estimated. That is the design's whole point and also its
      whole ceiling. THE TRANSFER ASSUMPTION IS NAMED AND NOT DISCHARGED: that
      uniformity of c at N ~ 10^3-10^4 predicts uniformity at cryptographic N is
      exactly what the experiment cannot test, since raising N raises the
      exhaustive-DL cost linearly. A negative at this scale excludes only LARGE
      effects, and how large is the reported MDE.
    correspondence: null
  tail_checks:
    - >-
      Report the MDE in total-variation distance BEFORE any p-value is
      interpreted, and refuse to interpret any effect below it.
    - >-
      Report the most and least frequent c values against the multinomial's extreme
      quantiles, and the realised counts per bin.
    - >-
      Report the decay-sweep rejection rate at EVERY instance count against its
      exact binomial interval, not only the largest.
    - >-
      Report the declared (predicate x label) family size and the correction
      applied; thirty uncorrected tests at alpha = 0.05 expect about 1.5 spurious
      rejections, larger than the effect being hunted.
    - >-
      Flag the q = 1000 simulator-adequacy cell as VACUOUS at N ~ 10^3, since
      q^2/N exceeds 1 there.
    - >-
      Report every transport certificate and its independent re-verification, per
      transported instance.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
    - >-
      RUN ARM 0 FIRST. If the range-side cell is already adjudicated in any primary
      record, WITHDRAW and record the withdrawal; no further compute is spent. This
      is the likeliest cheap outcome (source prior 0.35).
    - >-
      STOP ALL MEASUREMENT if either positive control fails to fire. Every arm is
      marked attempted_and_inconclusive and NO negative is recorded
      (GOAL-ENDO-001 P1).
    - >-
      STOP if the null's rejection rate grows with sample size; the battery is
      measuring an artifact and nothing may be read from any arm.
    - >-
      Stop at the frozen predicate list, label list, instance counts and
      correction. All are declared before the run and are not revised after seeing
      a p-value.
    - >-
      Any rejection MUST be replicated at a second prime before it is reported as
      anything other than a candidate.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5). Inability to obtain a primary record in ARM 0 is in this
      category.
    - >-
      A run whose sampler for P was NOT pre-registered, or whose independence from
      pi is not argued, is invalid_measurement - the battery would be measuring the
      sampler, which is exactly the defect CORR-20260807-a05e1e and
      CORR-20260807-9f83be record.
    - >-
      A run that reports a MARGINAL result as a class adjudication is
      invalid_reporting; the marginal test provably cannot adjudicate the class.
    - >-
      A run without a declared multiple-comparison family and correction is
      invalid_reporting.
    - >-
      A run whose control arms were not executed on the IDENTICAL battery code path
      in the same invocation as the signal arm is invalid_measurement.
    - >-
      A run that includes non-cyclic instances in the PRIMARY arm, or that runs the
      secondary arm without declaring its subgroup choice, is invalid_measurement.
    - >-
      A run that does not NAME the simulator formulation used is
      invalid_reporting; a verdict under Shoup's model does not transfer to
      Maurer's.
    - >-
      A run whose transport certificates were verified by the transport code itself
      is invalid_measurement (docs/claims-and-verification.md).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    ARM 0 returns `cell_undecided_proceed`; BOTH positive controls fire (rejection
    at p < 1e-6 on the j = 0 Aut-equivariant predicate and at overwhelming margin
    on the c = 1 slice); the random-generator null is accepted at the nominal rate
    inside its exact binomial interval; the decay sweep is FLAT at alpha across all
    five instance counts; the declared multiple-comparison family and correction
    are reported; the MDE in total-variation distance is reported before any
    interpretation; every transported instance carries an independently re-verified
    certificate; and the simulator-adequacy arm reports measured advantages against
    the predicted bound with the vacuous cell flagged. MEETING THIS MEANS THE
    ADJUDICATION WAS MADE WITH A LICENSED INSTRUMENT - whichever way c came out,
    INCLUDING uniform, which is the predicted and most useful outcome.
  falsification_criterion:
    - >-
      ARM 0 finds the range-side cell ALREADY ADJUDICATED in a primary record. The
      hypothesis is WITHDRAWN at the cost of three file reads and the withdrawal is
      recorded. Listed first because it is the likeliest cheap outcome.
    - >-
      Some predicate shows c non-uniform, or some label shows conditional MI above
      the null's 99th percentile by at least 0.01 bits, REPLICATED AT A SECOND
      PRIME, with both positive controls firing and the null accepted. CSEL(pi) is
      NON-SIMULABLE for that predicate; GOAL-ENDO-001 P3 applies and an independent
      review-adversarial session runs BEFORE any record states the excess.
    - >-
      A positive control fails to fire. The battery cannot detect a signal it is
      guaranteed to face; NO negative may be recorded and every arm is
      attempted_and_inconclusive.
    - >-
      The null's rejection rate GROWS with sample size. The battery is measuring an
      artifact; nothing may be read from any arm.
    - >-
      An explicit adversary distinguishes real from simulated CSEL with advantage
      exceeding (statistical distance of c) + q^2/N at an informative q. The
      reduction's load-bearing joint fails and the simulability criterion itself is
      wrong.
    - >-
      The transported-class arm disagrees with IDEA-20260821-3d5f22's edge-character
      measurement. The two adjacent measurements are inconsistent; that is
      informative ABOUT THE INSTRUMENT and neither may be interpreted until they are
      reconciled.
    - >-
      c is uniform and label-independent within the reported MDE on every tested
      predicate, with all controls passing. THIS IS THE PREDICTED OUTCOME AND IT IS
      A RESULT, NOT A FAILURE: CSEL joins the closed cell for the tested
      predicates, C3 gains a decided entry, and the recorded obstruction is THE MDE
      ITSELF - the effect size the experiment could not have missed.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      raw-result.json carrying c PER INSTANCE PER PREDICATE with its enumeration
      certificate - not summaries
    - >-
      the ARM 0 gate record naming which primary records were read and what each
      says about the range side
    - >-
      the marginal uniformity statistic, its p-value AND its MDE in
      total-variation distance
    - >-
      conditional MI per label with the permutation null's 99th percentile
    - >-
      both positive-control verdicts and the null acceptance rate, in the same file
      as the signal arm
    - >-
      decay-sweep rejection rates against the exact binomial acceptance interval at
      every instance count
    - the declared multiple-comparison family and the correction applied
    - >-
      the transported-class c law with its transport certificates and their
      independent re-verification records
    - >-
      the simulator-adequacy measurements per adversary and per q, against the
      predicted bound, with the vacuous cell flagged
    - >-
      the pre-registered sampler for P and the argument for its independence from
      pi
    - >-
      the named simulator formulation (Shoup random-encoding or Maurer abstract)
    - artifact manifest with hashes, seeds and a from-scratch rebuild receipt
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      ARM 0 SHOULD BE AUTHORIZED SEPARATELY AND FIRST. It costs zero compute, its
      prior of firing is 0.35, and it can retire the whole contract for three file
      reads. Approving the measurement arms before ARM 0 has run risks spending the
      budget on a decided cell.
    - >-
      The sampler for P, the predicate list, the label list and the
      multiple-comparison correction must ALL be fixed before approval. Each is a
      route by which the battery could measure something other than what it claims.
    - >-
      The simulator formulation must be NAMED before approval; the verdict does not
      transfer between Shoup's and Maurer's models.
    - >-
      A non-simulable branch requires an independent review-adversarial session
      before any record states the excess (GOAL-ENDO-001 P3).
