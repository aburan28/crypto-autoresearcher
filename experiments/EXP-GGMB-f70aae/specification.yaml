    authored_at: '2026-08-25'
    note: >-
      Arms, controls, the seven predictions, the falsification conditions and both
      heuristics are transcribed from the parent proposal's `minimal_test`,
      `predictions`, `controls`, `heuristic_assumptions`, `confounders` and
      `proof_search_map` blocks rather than re-invented. The parent's own priors
      are carried where they bear on design: 0.35 that ARM 0 retires the record,
      0.85 that the primary arm finds uniformity if it survives. The forced
      non-uniformity at j = 0 is CITED to H-ENDO-001 and is not a measurement made
      here; IDEA-20260807-413fcc's decision rule is quoted from a one-line digest
      and is flagged as unverified throughout. Budget follows the parent's declared
      estimated_cost (implementation medium, compute low). No field is invented;
      gaps below.
  derivation_gaps:
    - >-
      THE WITHDRAWAL CONDITION IS LIVE AND UNRESOLVED. The source session read
      IDEA-20260807-413fcc, IDEA-20260811-b2806a and IDEA-20260807-63056d ONLY as
      one-line digest summaries and estimates a 0.35 probability that one of them
      already adjudicates this cell. ARM 0 exists to settle it, but a Coordinator
      should note that approving the measurement arms in the same decision would
      spend budget on a question that may already be answered.
    - >-
      THE THREE PREDICATES ARE NOT NAMED. The parent gives examples ("least x",
      "least x among even y", "least x in a declared window") but no frozen list. A
      Coordinator must fix them before approval, since predicate choice after
      seeing a p-value is the obvious inflation route.
    - >-
      THE SAMPLER FOR P IS NOT SPECIFIED, and it is the PRIMARY confound: this
      campaign has been bitten twice by coordinate-rule samplers
      (CORR-20260807-a05e1e, CORR-20260807-9f83be). The contract requires
      pre-registration and an independence argument, but neither exists yet.
    - >-
      THE ALPHABET IS UNDER-POPULATED AT N ~ 10^3. With 2000 instances against
      (Z/N)^* the expected count per residue is about 2, which is too few for a
      per-cell chi-square. The contract routes the verdict through an MDE in
      total-variation distance instead, but the BINNING SCHEME is unspecified and
      must be fixed before approval or the primary metric is not well defined.
    - >-
      THE SIMULATOR-ADEQUACY ARM IS PARTLY VACUOUS. At N ~ 10^3 the bound q^2/N
      exceeds 1 at q = 1000, so that cell can never fail. The contract flags it,
      but a Coordinator may prefer to raise N for that arm alone or drop the cell
      rather than carry a statistic that cannot fail.
    - >-
      MODEL DEPENDENCE IS UNRESOLVED. Shoup's and Maurer's simulators differ in
      what an adversary may ask about a returned element - which is exactly the
      distinction this cell turns on - and neither was read in this program. Naming
      one before approval is required; verifying that the reduction holds under it
      is not achieved by this contract.
    - >-
      THE TRANSPORTED-CLASS ARM OVERLAPS IDEA-20260821-3d5f22's OBJECT. The two are
      deliberately adjacent and disagreement between them is informative about the
      instrument, but no contract composes them and no reconciliation procedure is
      specified.
