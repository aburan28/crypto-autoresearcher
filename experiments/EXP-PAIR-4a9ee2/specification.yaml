experiment:
  id: EXP-PAIR-4a9ee2
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-98a970
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'SCOPE RECORD B - A CERTIFIED EMBEDDING-DEGREE AUDIT OF EVERY STANDARDISED AND WIDELY DEPLOYED
    PRIME-FIELD CURVE, producing for each curve a short independently re-verifiable certificate of
    either the exact k (via the factorisation of N-1 and one exponentiation per prime factor) or a
    lower bound k > K (via K modular multiplications), together with the three degenerate-case checks
    p = 1 mod N, N = p, and N^2 | #E, and delivering the resulting affected-versus-safe split as a
    table rather than as an assertion'
  status: draft
  objective: "(A) WHAT THE PROGRAM CURRENTLY HAS AND WHY IT IS NOT ENOUGH. KN-TECH-032 records the\
    \ correct policy - for the program's target class the embedding degree is \"of size comparable\
    \ to p\", so the pairing route is closed. That statement is quoted from KN-LIT-086 (Balasubramanian-Koblitz)\
    \ as a PROBABILITY over random curves. It is not a statement about P-256, and no record in this\
    \ repository contains the embedding degree, or any bound on it, for a single named deployed curve.\
    \ A campaign lane whose obstruction is \"k is large for the curves we care about\" owes the table.\n\
    (B) THE DELIVERABLE. One row per curve for at least - NIST P-192, P-224, P-256, P-384, P-521;\
    \ secp256k1; Curve25519 and Ed25519; Curve448; brainpoolP256r1 / P384r1 / P512r1 and their twisted\
    \ variants; SM2; the Russian GOST R 34.10 curves; NUMS and the MSR curves; FRP256v1. Each row\
    \ carries -\n  k, exactly, when N-1 can be factored, with the certificate below;\n  otherwise\
    \ a certified lower bound k > K with K stated;\n  the three degenerate flags - is p = 1 mod N\
    \ (k = 1, the ONLY case in\n    which a one-point self-pairing exists, per IDEA-20260807-30868b);\
    \ is\n    N = p (anomalous, KN-TECH-033); is N^2 | #E (full rational N-torsion,\n    the sole\
    \ exception to the distortion-map closure of\n    IDEA-20260807-464ff8);\n  the crossover comparison\
    \ against k*(p, N) from IDEA-20260807-5f24d7,\n    which is what converts a value of k into a\
    \ verdict of affected or safe;\n  a verdict - AFFECTED, SAFE, or UNRESOLVED.\n\n(C) THE CERTIFICATE,\
    \ WHICH IS WHAT MAKES THIS AN AUDIT RATHER THAN A COMPUTATION. Two forms, both short and both\
    \ re-verifiable by a third party in milliseconds, in the sense of docs/claims-and-verification.md\
    \ -\n  EXACT-k CERTIFICATE - the complete factorisation N - 1 = product r_i^{e_i}\n  with a primality\
    \ certificate for each r_i, plus the witness\n  p^{(N-1)/r_i} mod N for each i. If every witness\
    \ differs from 1 then\n  k = N - 1 exactly and p is a primitive root mod N. More generally k is\n\
    \  recovered from the standard order algorithm by dividing out prime powers,\n  and the certificate\
    \ is the resulting chain of witnesses. Verification cost\n  is at most omega(N-1) modular exponentiations,\
    \ i.e. a few dozen.\n  LOWER-BOUND CERTIFICATE - when N-1 resists factoring, the statement\n \
    \ \"k > K\" is certified by the assertion that p^j is not 1 mod N for all\n  j <= K, checkable\
    \ by K modular multiplications with no shortcut. This is\n  the honest fallback - it costs K work\
    \ to verify as well as to produce,\n  and the record must say so rather than pretending the bound\
    \ is succinct.\n\n(D) THE EXPECTED ANSWER, PRE-REGISTERED BEFORE THE COMPUTATION. Every standardised\
    \ prime-field curve is expected to have k either equal to N-1 or a large divisor of it, i.e. of\
    \ the same order of magnitude as N, and therefore to be SAFE against MOV/Frey-Ruck by an astronomical\
    \ margin. Not one is expected to be flagged on any degenerate case. THIS IS STATED AS THE PREDICTION\
    \ SO THAT CONFIRMING IT IS A CONTROLLED RESULT AND NOT A RETROSPECTIVE RATIONALISATION. The reason\
    \ to run it anyway - the claim is currently unverified in this program, it is cheap, and the two\
    \ ways it could surprise are both consequential - a curve with a moderate k, or a curve whose\
    \ N-1 factorisation reveals a structure a designer could have chosen.\n(E) THE HONEST HEADLINE,\
    \ WHICH THE BRIEF ASKS FOR PLAINLY. Pairing-friendly curves are constructed deliberately; standard\
    \ curves such as P-256 are not, and their embedding degree is expected to be of the same size\
    \ as N. AFFECTED SCOPE - curves built by MNT, Barreto-Naehrig, Cocks-Pinch, Freeman, KSS or BLS\
    \ constructions with k typically in {1,...,24}, together with all supersingular curves (k <= 6),\
    \ together with any curve with p = 1 mod N. SAFE SCOPE - every standardised prime-field ECDLP\
    \ curve in (B), pending the audit that this record exists to run. That split affects no deployed\
    \ signature or key-exchange parameter set and this record claims no attack on any of them."
  resource_label: R7 (pairings into F_{p^k}), in scoping mode - the record measures where the R7 precondition
    holds and mounts no transfer.
  admissibility: admissible
  admissibility_argument: Admissible and non-vacuously so - the quantity being measured, ord_N(p),
    is not a group-operation output and is invisible inside the generic group model, so it is a genuine
    R7/representation datum rather than something KN-FIND-b7e091 already closes. It nevertheless supports
    no attack on the audited curves, which is the expected finding and is the point of auditing.
  reachability_gate: NOT APPLICABLE AS A MOVE, AND THE REASON IS THE SCOPE STATEMENT ITSELF. No F_p-isogeny
    changes k, because p and N are class invariants (IDEA-20260807-b92080). So an attacker holding
    a standardised curve cannot reach a small-k curve at any cost - not cheaply, not expensively,
    not at all. A DESIGNER, by contrast, reaches small k for free by choosing a construction. The
    audit's entire value is that it distinguishes these two and shows that no deployed parameter set
    sits on the designer's side of the line.
  inputs:
    procedure: 'STAGE 1 (hours, no compute): transcribe and self-verify every parameter set from primary
      documents. STAGE 2 (HARD GATE, minutes): the planted positives - toy BN k = 12, toy k = 1, toy
      supersingular k = 2. STAGE 3 (minutes): the three degenerate checks and the K = 10^6 lower-bound
      pass over the whole list. STAGE 4 (best effort, hours to days): factor N-1 per curve and emit
      exact certificates where possible. STAGE 5 (zero compute): the verdict column, pending k* from
      IDEA-20260807-5f24d7, and the affected/safe split. THE CHEAPEST DECISIVE SUBSET IS STAGES 2
      AND 3 - under one minute of compute for the entire standardised curve list, and it already settles
      the lane''s scope question.'
    mechanism: 'STEP 1 - ASSEMBLE THE PARAMETERS FROM PRIMARY STANDARDS DOCUMENTS. FIPS 186-5 / SP
      800-186 for the NIST curves, SEC 2 for secp*, RFC 7748 and RFC 8032 for Curve25519 / Ed25519
      / Curve448, RFC 5639 for brainpool, GB/T 32918 for SM2, RFC 5832 for GOST. Every (p, a, b, N,
      h) tuple is transcribed with its source and re-verified by checking that the stated base point
      lies on the curve and has order N. A parameter typed from memory is prohibited; if a document
      cannot be obtained, the row is recorded as UNRESOLVED with the reason. STEP 2 - THE DEGENERATE
      CHECKS, three modular reductions per curve, total cost microseconds - p mod N (flag if 1), N
      versus p (flag if equal), #E = h.N and whether N | h (flag if so, since that is when N^2 | #E).
      STEP 3 - THE LOWER-BOUND PASS. For each curve compute p^j mod N for j = 1..K with K = 10^6,
      recording the smallest j with p^j = 1 if any. This is 10^6 modular multiplications per curve
      at 256 bits - well under a second - and it certifies k > 10^6 for every curve where no such
      j appears. That alone is decisive against MOV, because k > 10^6 puts F_{p^k} far beyond representability
      (see Step 5). STEP 4 - THE EXACT PASS, best effort. Attempt the factorisation of N-1 per curve.
      For 256-bit N this is a small-integer factorisation and is expected to succeed with a standard
      ECM-then-NFS pipeline; for 521-bit N it may not, and the row then keeps its lower bound. Emit
      the exact-k certificate where the factorisation succeeds. NOTE HONESTLY - this program''s environment
      is pure Python with no Sage, so a 521-bit factorisation is very likely out of reach here and
      the honest output is a mixed table. STEP 5 - THE VERDICT COLUMN. Combine k (or its bound) with
      k*(p, N) from IDEA-20260807-5f24d7. Include the representability wall - a single element of
      F_{p^k} occupies k.ceil(log2 p) bits, so even writing down one element is infeasible once k
      exceeds a few million, independently of any index-calculus cost. That is the binding obstruction
      at large k and it is what makes the SAFE verdict robust to any future improvement in NFS. STEP
      6 - PUBLISH THE AFFECTED/SAFE SPLIT of (E) with every cell sourced.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - toy BN-shaped curve k = 12 - must be returned as 12
  - toy curve with p = 1 mod N - must be flagged k = 1 and AFFECTED
  - toy supersingular curve with t = 0 - must be returned as k = 2
  - a curve at the same p as a standard curve but with p = 1 mod N - must be flagged
  - random (p, N) arithmetic null for the order distribution
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING - a measurement instrument that has never
    been shown to fire cannot certify a negative. PLANTED POSITIVE - a deliberately pairing-friendly
    curve inserted into the same pipeline with the same code path - at minimum a toy BN-shaped curve
    with k = 12 and a toy curve with p = 1 mod N (k = 1), and if a published BN or BLS12 parameter
    set can be transcribed, that too. The pipeline MUST return the small k for these and must flag
    them AFFECTED. If it does not, every SAFE verdict in the table is void. SECOND POSITIVE - a supersingular
    toy curve over F_p with t = 0, where p^2 = 1 mod N so k = 2 exactly. The pipeline must return
    2. DECAY PARAMETER - the bound K in the lower-bound pass. As K increases from 10^2 to 10^6 the
    set of curves not yet excluded must shrink to the planted positives and then stop changing. A
    standardised curve that appears at some K and disappears at a larger K indicates a modular-arithmetic
    bug. ARITHMETIC NULL - a random 256-bit prime N and a random p, for which the order should behave
    as the random-element control of IDEA-20260807-6c7540.'
  independent_variables: []
  metrics:
    primary:
    - per curve, k or the certified bound, with the certificate itself
    - per curve, the three degenerate flags
    - per curve, the source document and transcription verification status
    - per curve, k.ceil(log2 p), the representability wall in bits
    secondary:
    - the count of AFFECTED, SAFE and UNRESOLVED rows
    - pass or fail of every planted positive
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of standardised prime-field curves in the list with certified k <= 10^6
    formula: Predicted ZERO. One or more would be a material finding and would trigger an immediate
      independent review before any publication of the table, per AGENTS.md rule 12.
    source: pre-registered in IDEA-20260807-98a970 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Which N. Several standard curves have small cofactors and one prime subgroup, but Curve25519 has
    cofactor 8 and Curve448 cofactor 4; the audit must use the PRIME subgroup order, not the group
    order, and must state which it used per row.
  - Twist security is a different property. A curve can be twist-secure and still have any embedding
    degree, and vice versa. The table must not be read as a twist audit.
  - Cofactor-order primes. A curve's cofactor may itself contain primes with small embedding degree.
    That is irrelevant to ECDLP in the prime subgroup and would be a spurious flag; the audit must
    not report it as one.
  - The verdict depends on an external threshold k*. Publishing a verdict before k* exists would be
    a partial-cost error of exactly the kind KN-TECH-035 and DEC-20260803-004's recorded C_special_MOV
    defect warn about.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted ZERO. One or more would be a material finding and would trigger an
    immediate independent review before any publication of the table, per AGENTS.md rule 12.
  falsification_criterion:
  - Any standardised prime-field curve returning k <= 10^6, or flagging any degenerate check. That
    would be a material cryptographic finding, would require independent review-breakthrough scrutiny
    before any statement is made outside this repository, and the record pre-commits to that route
    rather than to publication.
  - Any planted positive not returned correctly. Instrument failure under AGENTS.md rule 5; the table
    is void and nothing is reported.
  - A transcribed parameter set failing its own self-check (base point not on the curve, or not of
    the stated order). Transcription error; the row is UNRESOLVED and must not be silently corrected
    from memory.
  - Inability to obtain a primary standards document. The row is UNRESOLVED with the reason recorded;
    an omitted row would misstate the audit's coverage.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-98a970
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
