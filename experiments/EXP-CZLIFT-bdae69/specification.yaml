experiment:
  id: EXP-CZLIFT-bdae69
  hypothesis_id: H-CZLIFT-d37231
  source_idea: IDEA-20261009-843cfd
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: 'Multiplicative-group calibration: Teichmuller, naive and Hensel sections of Z_p^* -> F_p^* under log_p(s(x)^{p-1})'
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-575cd3
  execution_authorized: true
  status_note: Frozen at version 1 and approved 2026-10-09 by DEC-20261009-575cd3 under AGENTS.md 'Standing user
    authorization' and the user's request of 2026-10-09 to design and execute all accepted angles; driver and checker
    smoke-tested before freezing. Approval asserts nothing about H-CZLIFT-d37231.
  objective: For 40 seeded primes in (50, 2000) and 40 pairs each, measure per section the homomorphism rate, the
    vanishing rate of the functional, and the success rate of the Smart-style ratio against d mod p with the 1/p
    reference.
  inputs:
    primes: 40 seeded primes in (50, 2000)
    samples_per_prime: 40
    precision: 4
    seeds:
    - 20261009
    - 20261010
  controls:
  - 'The Teichmuller section is the theorem-level control: homomorphic and functional-vanishing on every pair.'
  - The checker verifies log_p additivity and vanishing on a Teichmuller representative independently.
  independent_variables:
  - section (teichmuller, naive, hensel)
  - p
  metrics:
    primary:
    - teichmuller.homomorphism_rate
    - teichmuller.functional_vanishing_rate
    - naive.z_score
    - hensel.z_score
    secondary:
    - homomorphism rates of the non-canonical sections (expected near 1/p)
    - ratio_defined_rate
  heuristic_under_test: null
  preregistered_prediction:
    quantity: teichmuller.homomorphism_rate, teichmuller.functional_vanishing_rate, naive.z_score, hensel.z_score
    formula: teichmuller rates = 1 exactly; |z| <= 4 for naive and hensel on both seeds
    source: H-CZLIFT-d37231 predictions
  scale_relevance:
    tier: toy
    justification: tested parameters as listed under inputs; no crypto-scale statement
    correspondence: null
  tail_checks:
  - every per-run primary metric is recorded so a near-miss on one seed can be compared with the other
  replication:
    seeds:
    - 20261009
    - 20261010
    independent_instances: 2
    replication_note: two trials; a prediction counts only if it holds on both
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
  - Stop after the two planned trials have output_validated receipts.
  - A crash or timeout is failed_infrastructure; never a metric value.
  invalidation_rules:
  - The checker cannot reproduce its re-run subset from the recorded inputs.
  success_criterion: 'On both seeds: teichmuller.homomorphism_rate = 1.0, teichmuller.functional_vanishing_rate
    = 1.0, |naive.z_score| <= 4 and |hensel.z_score| <= 4.'
  falsification_criterion: On both seeds a non-canonical section with z_score > 4, or a Teichmuller identity failing
    (instrument; the run is invalid).
  decision_impact:
    on_positive: 'H-CZLIFT-d37231 moves to supported after review and the G_m calibration is promoted as a knowledge
      note beside KN-TECH-73630e: a canonical section is a homomorphism into torsion and the p-adic logarithm kills
      it, on G_m as on E.'
    on_negative: A non-canonical section of Z_p^* recovering d above 1/p on both seeds would contradict a textbook
      fact and sends the instrument (log_p series) to repair first.
  required_artifacts:
  - experiments/EXP-CZLIFT-bdae69/runs/<RUN-ID>/manifest.yaml
  - experiments/EXP-CZLIFT-bdae69/runs/<RUN-ID>/raw-result.json
  - experiments/EXP-CZLIFT-bdae69/runs/<RUN-ID>/command.txt
  - experiments/EXP-CZLIFT-bdae69/runs/<RUN-ID>/environment.json
  - experiments/EXP-CZLIFT-bdae69/runs/<RUN-ID>/stdout.log
  - experiments/EXP-CZLIFT-bdae69/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-bdae69/trial-plan.json
    driver: experiments/EXP-CZLIFT-bdae69/implementation/run.py
    checker: experiments/EXP-CZLIFT-bdae69/implementation/check.py
    library:
    - harness/czlift.py
    - harness/czlift_run.py
  assigned_to: executor
  out_of_scope:
  - Any claim about a deployed curve.
