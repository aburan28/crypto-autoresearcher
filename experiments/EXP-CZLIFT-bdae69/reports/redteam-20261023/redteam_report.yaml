  recorded_at: '2026-10-23'
  claim_under_review: >-
    For 40 primes 50 < p < 2000 with generator g and precision 4: the Teichmuller section is a
    homomorphism on every sampled pair and the functional log_p(s(x)^{p-1}) vanishes on it identically,
    so its Smart-style ratio is never defined; the naive-integer and random-Hensel sections are
    homomorphic on a fraction near 1/p of pairs and their ratio log_p(s(g^d)^{p-1})/log_p(s(g)^{p-1})
    equals d mod p at a rate within 4 standard errors of the mean of 1/p.
  producer_reading_under_attack: >-
    DEC-20261009-44c288, criterion_readings.EXP-CZLIFT-bdae69 (reading, unexpected_observation,
    claim_boundary) and rationale bullet 2. In short: Teichmuller and Hensel hold, and the naive section
    fails on both seeds (z = 7.65, 9.14). 24 of the 33 successes are the pairs with g^d < p, and the
    other 9 are 'at the random rate (about 5 expected)'. This is 'the integer section being
    multiplicative below p, not a p-adic effect; it has no elliptic analogue because point addition
    always reduces'. The hypothesis is 'falsified as posed'.

  joint_verdicts:
    R1: breaks
    R2: holds
    PTM-1: holds
  joint_verdict_scope:
    R1: >-
      BREAKS ON THE TRANSFER CLAUSE ONLY. The plan's breaking artifact, 'an elliptic analogue the producer
      missed', exists and was measured (O1). The three F_p^* readings hold: Teichmuller kills the
      functional, Hensel is at the random rate within the test's power, and the naive excess is the
      archimedean no-carry region (g^d < p), not p-adic leakage. 'Falsified as posed' is the right
      status in substance; in ledger vocabulary it is 'rejected as posed' (O2). The excess is a property
      of the (section, generator) pair. The section supplies partial multiplicativity on xy < p, which
      shows up in the homomorphism rate whatever g is. The generator's archimedean size decides whether
      its orbit enters that region.
    R2: >-
      HOLDS, WITH CORRECTIONS. The success test is right: the exact criterion (q_p(g) != 0 and
      g^d mod p^2 < p) reproduces 3200/3200 recorded naive bits, and the test runs at the random rate on
      the null objects (Hensel; random-generator naive). Its 1/p null is the rate the hypothesis itself
      asserts, so it is the correct null for the falsification. The homomorphism-rate null 'near 1/p' is
      wrong for BOTH non-canonical sections. It is a secondary, unscored metric, so it does not change
      the falsification (O4). The seed-20261010 residual is a fluctuation, not a systematic effect, and
      the validator's 'rest rate exceeds 1/p at small primes' holds only for particular primes (O7). The
      |z| <= 4 acceptance has low power (O5).
    PTM-1: >-
      HOLDS. Run unchanged against a uniformly random primitive root, the producer's interpretation
      predicts excess only from the sub-p chain, which is non-empty only for roots g < sqrt(p). That
      predicts a population excess of 0.108 x (1/p), and the measured random-root rest region is
      1.016 x (1/p). Over 4000 simulated frozen-protocol runs the naive z has mean 0.184, sd 1.205,
      q95 2.39 and P(z > 4) = 0.0058 per seed. The validator's expected value of about 0.2 is
      reproduced. The interpretation does not imply leakage for every generator, so the declared failure
      signature (the excess vanishes) is observed. The argument that fails is the hypothesis' own
      random-model argument, and it fails in the opposite direction: it predicts no excess for every
      generator, and the smallest root contradicts it. That is the falsification, not a proves-too-much
      failure of the producer's reading.

  joint_evidence:
    R1:
    - >-
      Generator dependence, exhaustive in d over all 288 primes in (50, 2000) (ptm1_generator_controls_output.json).
      Population naive success rate as a multiple of mean 1/p:
      rule A, smallest primitive root (frozen run.py): 5.03;
      rule B, random primitive root: 1.11;
      rule C, smallest root > sqrt(p) (empty sub-p chain): 0.956;
      rule D, rule A restricted to g^d >= p^2: 0.910.
      Frozen-protocol z (mean, sd, P(z>4) per seed):
      A 7.54, 2.45, 0.9375; B 0.184, 1.205, 0.0058; C -0.050, 1.089, 0.0028; D -0.164, 1.167, 0.0020.
    - >-
      Random-root decomposition, exhaustive over every primitive root for the sub-p and band counts
      (ptm1_b_decompose_output.json): sub-p 0.108 x (1/p), rest 1.016 x (1/p), total 1.124 x (1/p).
      The residual excess is exactly the producer's mechanism acting on the minority of roots below
      sqrt(p).
    - >-
      Per-row split of the archived naive rows (r2_nulls_output.json). Seed 20261009: sub-p 11/11
      succeed, band (p <= g^d < p^2) 0/14, rest 2/1575. Seed 20261010: sub-p 13/13, band 0/20,
      rest 7/1567. The recorded success bit equals the exact criterion and the red team's own
      precision-4 p-adic ratio on 1600/1600 rows per seed.
    - >-
      Elliptic analogue (r1_elliptic_analogue_output.json; own code, exact rationals for the global
      multiples, Jacobian arithmetic mod p^10, Smart-style functional log([N]s(.)) read at its first
      nonzero digit). The curve is 37a1 in its short model y^2 = x^3 - 16x + 16 with P~ = (0, 4), which
      has [2..6]P~ = (4,4), (-4,-4), (8,-20), (1,-1), (24,116), all integral, and [7..12]P~
      non-integral. Over 284 good, non-anomalous p in (50, 2000): the balanced integer section gives
      ratio = d on 1420/1420 rows with d in {2,...,6} (Clopper-Pearson 95% lower bound 0.9974). The
      [0, p-1] naive section gives 1136/1136 at d in {2,4,5,6} and 0/284 at d = 3, because x = -4 lifts
      to p - 4. The random-Hensel section gives 2/1420 against 2.99 expected. Off the integral set the
      rest rows run at 1/p: naive 21, balanced 22, Hensel 25, against 21.7 expected. The second curve is
      y^2 = x^3 + 17 (j = 0, the CM D = -3 family) with P~ = (-2, 3) and [2]P~ = (8, -23): the balanced
      section gives 287/287 at d = 2, and the [0, p-1] section 0/287. Instrument control: a lift built
      as [d] s_hensel(P) in E(Z/p^10) returns ratio = d on 11329/11333 and 11407/11411 rows. The misses
      are rows with p | d, where the ratio rule is undefined by convention (control_misses_check_stdout.txt).
      No precision-loss or non-unit flags were raised.
    R2:
    - >-
      Homomorphism-rate null (r2_nulls_output.json). Replaying run.py's RNG call order gives the
      recorded d on 3200/3200 rows and naive hom == (x*y < p) on 3200/3200 rows. Over the exact domain
      (x = g^e with e in [1, p-2], so F_p^* minus {1}), the expected naive hom counts are 9.353 and
      12.960 against 10 and 10 observed, matching the validator's figures. The stated 1/p model gives
      2.052 and 3.334, with P(>= 10) = 5.7e-5 and 2.4e-3. Hensel hom is exactly p^{-3} per pair:
      expected 2.2e-5 and 2.3e-4, observed 0 and 0. Under the stated 1/p model, P(0) = 0.129 and 0.036.
    - >-
      Success null. On the hypothesis' own claim (1/p) the falsification stands. Under the generator-
      specific exact null, conditional on the drawn primes, the expected counts are 11.549 and 17.643
      against 13 and 20 observed. Pooled, 33 against 29.19 gives a ratio of 1.13 (95% CI 0.78-1.59).
      Against mean 1/p, 33 against 5.39 gives 6.13 (CI 4.22-8.61).
    - >-
      Seed-20261010 residual. Rest-only, 7 observed. The 1/p expectation excluding the band is
      lambda = 3.110 with P = 0.039. Including the band (the validator's model) it is 3.240 with
      P = 0.047, but band rows can never succeed. The exact conditional expectation given the drawn
      primes and generators is 4.106 with exact Poisson-binomial P(>= 7) = 0.12. The residual sits in
      p = 151 (g = 6; exact rest set of 6 against 0.95; 3 hits, including a duplicate d = 14),
      p = 157 (set 2; 2 hits, including a duplicate d = 115), p = 277 and p = 307.
    - >-
      Population check of the rest region under rule A, exhaustive in d over 288 primes: 275 successes
      against 279.4 at 1/p, a ratio of 0.984. The rest-set dispersion index is 2.03 (clumping), so the
      standard error is about +/- 0.085. By bin: 50-500 has 77 against 74.5, 500-1000 has 73 against
      71.4, and 1000-2000 has 125 against 133.5. There is no systematic small-prime excess.
    PTM-1:
    - See R1 evidence items 1 and 2 (rule B and its decomposition).

  objections:
  - id: O1
    joint: R1
    severity: major (transfer clause)
    text: >-
      'It has no elliptic analogue because point addition always reduces' is false. On a small-
      coefficient global model, integral points add without any reduction mod p, and the naive
      (integral) section then coincides with the global point. So s([d]P) = [d]s(P) exactly in E(Q_p),
      and any homomorphic functional, including Smart's log([N].), returns exactly d. This was measured
      on 37a1 (on the RQ's own ladder) and on y^2 = x^3 + 17 (the RQ's CM D = -3 family); see R1
      evidence item 4. The correct transfer has three parts. The analogue exists. Its size is fixed by
      the integral multiples of the global lift, a finite set by Siegel's theorem that does not grow
      with p (on G_m the sub-p chain grows like log_g p). It applies only to instances where P lifts to
      a small global point. On those instances the archimedean route (an integral-point table, or the
      height ratio h^([d]P)/h^(P) = d^2) solves the DLP without p-adics, so the analogue carries no DLP
      leverage. On a generic instance (P random in E(F_p)) its probability is negligible.
  - id: O2
    joint: R1
    severity: major (status and pre-registered consequence)
    text: >-
      The hypothesis says only 'with generator g'. The generator was fixed by the frozen, hash-pinned
      run.py (sympy.primitive_root, the smallest root), which test_boundary.implementation names, and
      the choice was made before any data existed. So the falsification is of the hypothesis as posed,
      that is, of the universal reading (every generator). The ledger state is 'rejected' (AGENTS.md
      Research states), scoped to the smallest-root instantiation. The spec's decision_impact.on_negative
      must NOT be executed as written. It says a negative 'would contradict a textbook fact and sends
      the instrument (log_p series) to repair first'. The instrument is verified: 3200/3200 rows by the
      validator, and 3200/3200 by the red team's own p-adic ratio and closed-form criterion. No textbook
      fact is contradicted. The relevant fact, Eisenstein's logarithmic property of the Fermat quotient,
      q_p(ab) == q_p(a) + q_p(b) (mod p) on integers, predicts the excess exactly.
  - id: O3
    joint: R1
    severity: major (design)
    text: >-
      The hypothesis has an implicit, unnumbered heuristic (heuristic_assumptions: []): that a
      non-canonical section's 1-unit discrepancy s(x)/omega(x) behaves randomly relative to d. The naive
      lift of g^d is a structured object (a small integer when g^d < p), not a random one. The cheapest
      computation that exposes this costs nothing: count {d in [2, p-3] : g^d < p} for the chosen
      generator. Before the run it would have predicted an expected z of about 7.5 and a 0.88
      probability of falsifying the hypothesis on both seeds (rule A: P(z > 4) = 0.9375 per seed).
      The mechanism Hom(Z/(p-1), Z_p) = 0 is neither tested nor refuted by the naive clause. The naive
      section is not a homomorphism, and the excess comes from Z, not from F_p^*.
  - id: O4
    joint: R2
    severity: minor for the falsification, major for any promotion
    text: >-
      'Homomorphic on a fraction near 1/p of pairs' is false for both non-canonical sections. The naive
      section is homomorphic exactly when x*y < p, at about 4.5-5.6 times 1/p at this scale. The Hensel
      section is homomorphic with probability p^{-3}, so 0 was observed. The metric is secondary and
      unscored, so the falsification does not depend on it. It does make the hypothesis statement false
      in a second clause, and it must not be carried into a knowledge note.
  - id: O5
    joint: R2
    severity: moderate (power)
    text: >-
      With 2.05 and 3.33 expected events per seed, the |z| <= 4 acceptance band admits up to 7.8 and
      10.6 successes, that is 3.8 and 3.2 times 1/p. 'Hensel at the random rate' is therefore supported
      only to the pooled 95% upper bound of 1.63 x (1/p): 3 against 5.39, ratio 0.56, CI 0.12-1.63.
      Detecting a 1.5x excess at z >= 4 needs about 64 expected null events, about 29,000 pairs at
      mean 1/p = 0.0022.
  - id: O6
    joint: R1
    severity: major (closure)
    text: >-
      RQ-CZLIFT-b9f765 decision_target (a) contains the clause 'every non-canonical section recovers d
      at the random rate 1/p'. It is contradicted on G_m (naive section, smallest root) and on E
      (integral section at integral multiples of a small global point). A negative closure of the RQ
      that states the clause this way would be over-broad. The supportable form is 'off the instances
      on which the section coincides with a homomorphic global section on small-height elements'.
  - id: O7
    joint: R2
    severity: minor (correction to the validator's explanation)
    text: >-
      VAL-20261022-8caa0c says 'the true rest rate exceeds 1/p at small primes'. That is true for
      particular primes (151, 157) but is not a population effect: the population ratio is 0.984 +/-
      0.085, and the 50-500 bin has 77 against 74.5. Clumping (if g^d mod p^2 = r < p/g then d+1 also
      succeeds) raises the variance, giving a dispersion index of 2.03, but not the mean. The validator's
      lambda of 3.24 includes 20 band rows that cannot succeed. The validator's conclusion that the
      residual is ordinary sampling variation is unaffected (exact conditional P = 0.12).
  - id: O8
    joint: R2
    severity: minor
    text: >-
      The z score treats the 1600 rows as i.i.d. Bernoulli(1/p). Clumped success sets and d drawn with
      replacement inflate sd(z) to 1.09-1.21 under the null rules. No criterion outcome changes:
      P(z > 4 on both seeds | random root) is about 3.3e-5.
  - id: O9
    joint: R1
    severity: minor (model dependence)
    text: >-
      'Naive section' on E is model-dependent. On the 37a1 minimal model y^2 + y = x^3 - x the integral
      multiples of (0,0) are d in {1, 2, 3, 4, 6}, because [5]P = (1/4, -5/8). On the short model they
      are d in {1, ..., 6}, because (1, -1) is integral (1 - 16 + 16 = 1). Any elliptic section result
      must name its Weierstrass model and its lift convention ([0, p-1] or balanced).

  required_controls:
  - id: C1
    for: every elliptic Smart-style success statistic in GOAL-CZLIFT-1516d5 that uses a naive, integral or small-height section on a small-coefficient global model
    control: >-
      Enumerate the integral (or small-height) multiples [d]P~ of the global lift of P, with exact
      rationals and at most 12 multiples. Stratify rows by d in D_int and report D_int and off-D_int
      separately. Expected: success 1.0 on D_int for the integral section and 1/p off it (measured here
      21/22 against 21.7). Null object: the random-Hensel section on the same rows (measured 2/1420
      against 3.0).
    cost: no new runs; seconds of exact arithmetic per curve
  - id: C2
    for: any successor G_m calibration
    control: >-
      Separate generator-rule arms: a uniform random primitive root (expected z 0.18 +/- 1.21), the
      smallest root (7.54 +/- 2.45), and the smallest root > sqrt(p) (-0.05 +/- 1.09).
  - id: C3
    for: any successor G_m calibration
    control: >-
      Use the per-row exact null (success iff q_p(g) != 0 and g^d mod p^2 < p). Report the sub-p, band
      and rest regions separately, and test only the rest region against 1/p, using a clumping-aware
      variance (dispersion about 2).
  - id: C4
    for: homomorphism-rate predictions
    control: >-
      Predict P(xy < p) over F_p^* minus {1} for the naive section and p^{-3} per pair for the Hensel
      section, not 1/p.
  - id: C5
    for: any random-rate acceptance claim
    control: >-
      Size the pooled sample so that a 1.5x excess reaches z >= 4 (about 64 expected null events), or
      state the excess the test cannot exclude.

  counterexample_or_mutation: >-
    The cheapest discriminating mutations, all run in this review. (i) Keep the section and replace the
    generator by a random primitive root: the excess vanishes (z 0.18). (ii) Keep the section and use
    the smallest root above sqrt(p): it vanishes (z -0.05). (iii) Keep the smallest root and drop d in
    the sub-p chain and the band: it vanishes (z -0.16). So the excess is entirely the no-carry region.
    The counterexample to the producer's transfer claim is the integral-section analogue on 37a1:
    [2](0,4) = (4,4) and [6](0,4) = (24,116) on Y^2 = X^3 - 16X + 16, and [2](-2,3) = (8,-23) on
    y^2 = x^3 + 17. There the Smart-style ratio equals d on every good, non-anomalous prime tested.

  baseline_comparison: >-
    The record makes no cost claim, and the hypothesis has no dominated_by field, so no frontier
    comparison is owed. Any reading of the naive excess as an attack is dominated on exactly the
    instances it solves. On G_m those instances are h = g^d < p, a log_g(p)/p fraction, and an
    O(log p) integer-logarithm check (repeated division by g, or log h / log g over R) solves them with
    certainty and self-verification. The Smart-style ratio costs one exponentiation mod p^4 and gives
    no certificate. On all other instances its success probability is about 1/p per attempt, so the
    total expected cost is about p * O(log p). Pollard rho and BSGS cost O(sqrt p), and the specialized
    F_p^* baselines (index calculus L_p[1/2], NFS L_p[1/3]) are far below that. On E the instances are
    the integral multiples of a small global point (a finite table) and the comparison is the same;
    generic instances get Pollard rho's O(sqrt N).

  heuristic_challenges:
  - >-
    The heuristic inventory is incomplete. The random-rate predictions rest on the unlisted random-model
    assumption described in O3, while heuristic_assumptions is empty.
  - >-
    The random model does not transfer to these objects. The integer representative of g^d mod p and
    the integral points of a global model are structured (small) objects. Minimality matters here: the
    smallest primitive root maximizes the sub-p chain. Multiplicity matters too: success sets come in
    chains of expected length about 1 + 1/(g-1), which inflates variance. Both are computable at zero
    cost before running (C2, C3).

  cost_model_challenges:
  - not_applicable: no cost claim. Bookkeeping note for any future reading as an attack is under baseline_comparison (total cost = per-attempt cost x inverse success probability).

  reduction_and_scope_challenges:
  - >-
    The result is G_m only. interpretation_limits says it bears on E 'only by analogy', and O1 shows the
    analogy's naive-section clause, as worded by the producer, is wrong. The calibration is not evidence
    about E or about any deployed curve.
  - >-
    The on_positive knowledge note ('a canonical section is a homomorphism into torsion and the p-adic
    logarithm kills it, on G_m as on E') cannot be promoted from this record. The positive branch was
    not reached, and the record's non-canonical clauses are false as stated.
  - >-
    The random-root reading is a review-side computation, not a run record. It may guide a successor
    contract but is not admissible evidence.

  proof_architecture_challenges:
  - >-
    Quantifier order. The generator was fixed before the data by frozen code, not after seeing an
    outcome, so there is no witness-after-instance defect. The statement was underspecified: what was
    refuted is the reading 'for every generator g'. The random-g reading is untested by runs.
  - >-
    Nearby object. The producer's reading separates the smallest root from a random root and from roots
    above sqrt(p), as its mechanism predicts, so it passes. The hypothesis' random-model argument does
    not separate them, and that is where it fails.
  - >-
    Observation fiber. Hold the functional and the rows fixed and vary the section (naive against
    Hensel). The separator is whether the section coincides with a homomorphic global section on the
    instances, not whether it is 'canonical'.

  obstruction_and_resource_reading:
    obstruction_the_record_would_close: >-
      On G_m at toy scale, a homomorphic (canonical) section is killed by log_p, and non-canonical
      sections recover d only at the random rate. The second half is false as stated; see O4 and O6.
    measured_quantities:
    - quantity: Teichmuller functional-vanishing rate
      value: 1.0 (3200/3200 rows; 80 distinct s(g) points; the validator also checked omega(g^d) on 3200/3200)
      units: fraction of rows
      error: exact identity at precision 4 (Clopper-Pearson 95% lower bound 0.99885, as an instrument check only)
    - quantity: Hensel ratio success rate relative to mean 1/p
      value: 0.56
      units: dimensionless rate ratio
      error: 95% CI 0.12-1.63 (3 observed against 5.39 expected, pooled over two seeds)
    - quantity: naive (smallest root) success rate relative to mean 1/p
      value: 6.13
      units: dimensionless rate ratio
      error: 95% CI 4.22-8.61 (33 against 5.39). Sub-p rows 24/24 (95% lower bound 0.858); band 0/34 (impossible by construction); rest 9 against an exact conditional expectation of 6.585, ratio 1.37 (CI 0.63-2.60)
    - quantity: naive (random root) population rate relative to mean 1/p
      value: 1.124 (sub-p 0.108 + rest 1.016)
      units: dimensionless rate ratio
      error: sub-p part exact (all roots); rest part sampled (all roots for p < 600, 16 per prime above). Protocol z 0.18 +/- 1.21
    - quantity: elliptic integral-section success at integral multiples (37a1 short model, balanced lift)
      value: 1.0 (1420/1420)
      units: fraction of rows
      error: 95% lower bound 0.9974. Off-D_int rows 22 against 21.7 at 1/p (ratio 1.01, CI 0.64-1.53)
    resource_reading: >-
      The measured partial homomorphism of the naive section (homomorphic exactly on the no-carry region
      xy < p; certain success on g^d < p) is the hypothesis index calculus runs on in F_p^*. Index
      calculus uses relations among naive integer lifts, valued in Z/l for l | p-1. The Fermat-quotient
      functional is valued in Z/p, and Hom(Z/(p-1), Z/p) = 0 is why it sees the structure only where
      no reduction occurs. The elliptic counterpart, small-height global points that add without
      reduction (O1), is the resource whose scarcity is the Silverman-Suzuki / xedni obstruction, and
      the RQ's part (iii) global-lift lane already measures it. The G_m naive excess and its
      Siegel-bounded elliptic analogue therefore measure one archimedean resource and no p-adic one.
    candidate_not_evidence: >-
      Derived and unmeasured: on E, a rational-reconstruction section (x mapped to its smallest-height
      rational preimage) should extend the elliptic sub-height chain to d up to about
      c*sqrt(log p / h^(P~)), growing slowly with p, while the integral section's chain stays
      Siegel-finite. This is still the archimedean resource, with no DLP leverage. It is a possible
      cross-check row for the global-lift lane, not a lead.
    spawned_ids: []
    spawned_ids_note: >-
      The red team has no ledger write scope. The candidate is passed to the Coordinator to file or
      discard.

  recalled_citations_checked:
  - citation: Eisenstein (1850), logarithmic property of the Fermat quotient, q_p(ab) == q_p(a) + q_p(b) (mod p)
    used_for: O2 (the textbook fact that predicts the excess)
    checked_against: https://en.wikipedia.org/wiki/Fermat_quotient
    delta: >-
      Confirmed, and attributed to Eisenstein there. The red-team scripts derive and use the closed form
      independently, with 0 mismatches on 3200 rows.
  - citation: N. P. Smart, The discrete logarithm problem on elliptic curves of trace one, J. Cryptology 12(3) 193-196 (1999), doi 10.1007/s001459900052
    used_for: naming the Smart-style functional
    checked_against: https://www.doi.org/10.1007/S001459900052 and the Bristol research portal record
    delta: none
  - citation: J. H. Silverman and J. Suzuki, Elliptic curve discrete logarithms and the index calculus, ASIACRYPT 1998, LNCS 1514, 110-125, doi 10.1007/3-540-49649-1_10
    used_for: resource reading
    checked_against: https://iacr.org/cryptodb/data/paper.php?pubkey=487
    delta: none. Its negative conclusion (the natural generalization of index calculus is worse than brute force) matches how it is used here.
  - citation: M. J. Jacobson, N. Koblitz, J. H. Silverman, A. Stein, E. Teske, Analysis of the xedni calculus attack, Des. Codes Cryptogr. 20 (2000) 41-64, doi 10.1023/A:1008312401197
    used_for: resource reading
    checked_against: https://pages.cpsc.ucalgary.ca/~jacobs/PDF/xedni.pdf (listing) and the Springer DOI record
    delta: none on the citation. DBLP gives pages as 1-64, a loose range.
  - citation: LMFDB 37.a1 (minimal model y^2 + y = x^3 - x, short model y^2 = x^3 - 16x + 16, generator (0,0) / (0,4), rank 1, trivial torsion)
    used_for: O1, O9 curve identity
    checked_against: https://www.lmfdb.org/EllipticCurve/Q/37/a/1
    delta: >-
      Model, generator, rank and torsion confirmed. LMFDB's short-model integral-point list, as fetched,
      shows the images of the minimal-model integral points and omits (1, +/-1). That point is integral
      on the short model and equals [+/-5](0,4), verified here with exact rationals. This is a
      convention difference, not an LMFDB error, and it is why O9 exists.
  - citation: Siegel's theorem (finitely many integral points on an elliptic curve over Z)
    used_for: O1 size bound
    checked_against: not retrieved; a standard theorem (Silverman, AEC, ch. IX)
    delta: unverified retrieval. It is load-bearing only for 'finite and independent of p'. The measured content of O1 does not depend on it.
  - citation: KN-TECH-73630e (cited by H-CZLIFT-d37231 structural_ingredients)
    used_for: not used
    checked_against: not read (outside read_scope)
    delta: unchecked

  narrowest_supported_statement: >-
    Scope: toy tier, G_m only. Two seeds; each seed is 40 seeded primes 50 < p < 2000 with 40 pairs
    each (1600 pairs). Precision 4. g is the smallest primitive root, as frozen in run.py. Under that
    scope:
    (i) The Teichmuller section is homomorphic on every sampled pair, log_p(s(x)^{p-1}) vanishes on
    every sampled point, and the Smart-style ratio is never defined.
    (ii) The random-digit Hensel section's ratio equals d on 3 of 3200 pairs against 5.39 expected at
    mean 1/p (ratio 0.56, 95% CI 0.12-1.63).
    (iii) The naive integer section's ratio equals d on 13 and 20 of 1600 pairs (z = 7.65 and 9.14).
    It succeeds exactly on the pairs with g^d mod p^2 < p: all 24 pairs with g^d < p succeed, no pair
    with p <= g^d < p^2 can, and the remaining 9 are consistent with random coincidence given the drawn
    primes (1.37x, CI 0.63-2.60).
    (iv) The naive section is homomorphic on 10 and 10 pairs, matching P(xy < p) (9.35 and 12.96
    expected). The Hensel section is homomorphic on 0 pairs, matching p^{-3}.
    H-CZLIFT-d37231 is therefore rejected as posed, in its naive success clause and its
    homomorphism-rate clause. The falsifying excess is fully accounted for by the archimedean no-carry
    region (Eisenstein's logarithmic property of the Fermat quotient). It carries no discrete-log
    information beyond an O(log p) integer-logarithm check. It is no evidence of p-adic leakage and no
    evidence about elliptic curves.
  strength_assessment: >-
    The falsification as posed is strong. Both seeds exceed the threshold far beyond the random-root
    null: P(z > 4 on both seeds | random root) is about 3.3e-5. The mechanism is identified exactly
    (closed-form criterion, 3200/3200 rows) and the instrument is independently verified. Its
    scientific content is weak. It refutes a mis-derived prediction (O3), not the stated mechanism, and
    the excess is an elementary archimedean effect. The Teichmuller clause is a calibration of the
    instrument against a theorem: strong, but not new knowledge. The Hensel random-rate clause is
    moderate, because the test cannot exclude an excess up to 1.63x. Promotion should be at most an
    internal calibration note recording the exact null and the generator caveat.

  scope_limits:
  - G_m only; no transfer to E as evidence (interpretation_limits). The elliptic analogue in O1 is a review-side computation, not a run record.
  - Smallest primitive root; the random-root behaviour is a review-side computation, not admissible run evidence.
  - p < 2000 and precision 4. At fixed n = 1600 the naive excess per pair, (L-1)/(p-4), falls with p while its ratio to 1/p grows like log_g p, so the measured z depends on scale.
  - No statement about the stated mechanism Hom(Z/(p-1), Z_p) = 0 beyond the Teichmuller identity.

  must_not_claim:
  - That the naive-section falsification contradicts a textbook fact or calls for instrument repair (the on_negative text of the specification).
  - That non-canonical sections are homomorphic on about 1/p of pairs.
  - That every non-canonical section recovers d at the random rate, on G_m or on E (including RQ-CZLIFT-b9f765 decision_target (a) as worded).
  - That the naive excess has no elliptic analogue because point addition always reduces.
  - That the calibration, or its falsification, is evidence of p-adic leakage or about any elliptic curve or deployed curve.
  - That H-CZLIFT-d37231 is supported, or that the on_positive knowledge note is promotable as worded.
  - That the Hensel random rate is pinned tightly (the upper bound is 1.63x).
  - That the random-generator null (z about 0.2) is run evidence.

  next_concrete_action: >-
    Run control C1 before any Smart-style statistic in the elliptic section experiments of
    GOAL-CZLIFT-1516d5 is read as 'random rate'. For each curve model and section convention used
    there, enumerate the integral multiples of the global lift of P with exact rationals, and stratify
    the success counts by d in D_int. This needs no new runs. Then record H-CZLIFT-d37231 as rejected
    as posed with the narrowest statement above, and correct the wording of RQ-CZLIFT-b9f765
    decision_target (a).

