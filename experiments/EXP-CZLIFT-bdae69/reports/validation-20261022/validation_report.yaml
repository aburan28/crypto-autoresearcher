  proves_too_much:
  - id: PTM-1
    object: Teichmuller section (functional identically zero)
    known_false_conclusion: The Teichmuller section recovers d.
    verdict: holds
    expected_signature_observed: true
    detail: >-
      Archived runs: Teichmuller success is 0/1600 on each seed against random-rate expectations of
      2.05 and 3.33 (z = -1.433, -1.828), and the ratio is never defined. The validator ran the
      producer's own functional, val_p, teichmuller and run.py ratio rule on all 288 primes in
      (50, 2000) x 40 rows x 2 fresh seeds (7, 11; 23040 rows): Teichmuller success is 0/23040 and
      ratio_defined 0/23040, against 25.23 expected per seed at the random rate (z = -5.04). As an
      added noise-acceptance probe, the Teichmuller lift was perturbed by 1 + p^j t (functional
      nonzero from digit j = 1, 2, 3). The success test then accepts at the random rate: successes
      24/26/24 and 28/32/29 against 25.23 expected, z between -0.25 and +1.35. The success test
      shows no excess on the PTM object or on precision-floor noise.
    output: experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/replay_j2_ptm_output.json
  blind_rederivation:
    joint: J3
    sealed_at: '2026-10-22T08:30:35Z'
    seal: experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/blind/SEAL.sha256
    seal_hashes:
      blind/fq_blind.py: 8fabf1f6a61bee1140f279e42fb97947f266e369eaf0490568453dc2e8e1aed1
      blind/blind_output.json: 8989ce61895c127f416dd18719b1be298301571d112c11baba1768cd6faac493
      blind/blind_stdout.txt: 354b33229f36825725dad6f0364685d8cdf2e14dc0daf1291b76dfa5fada027e
    seal_reverified_after_phase2: true
    inputs_used: specification.yaml, trial-plan.json, H-CZLIFT-d37231.yaml, general mathematics
    derivation: >-
      For the naive section, L(x)/p == q_p(s(x)) (mod p), so the ratio is
      q_p(g^d mod p)/q_p(g) (mod p). Because q_p is additive on integers, g^d < p gives certain
      success. Otherwise, writing g^d = r + kp gives ratio == d - k/(r q_p(g)) (mod p), so success
      holds iff g^d mod p^2 < p, with heuristic probability 1/p. Hence
      E[S] = #{g^d < p} + sum over the other pairs of 1/p. A cross-check against an independent
      precision-4 p-adic-log ratio found 0 mismatches over 3371 (p, g, d) pairs.
    underspecification_found: >-
      The statement does not fix the generator rule, the seeded prime-sampling procedure, the
      replacement rule for d, or the exact z formula. Two generator readings were computed before
      unsealing. Reading A (smallest primitive root): E[S] = 17.96 per seed (MC 90% interval
      10.66 to 26.90) against a null of 3.50, expected z 7.75 (MC 90% 4.34 to 11.46). Reading B
      (uniform random primitive root): E[S] = 3.88, expected z 0.20. The producer used reading A
      (sympy.primitive_root, the smallest primitive root on 80/80 primes).
    comparison_phase2:
      recorded_naive_successes: {seed_20261009: 13, seed_20261010: 20}
      recorded_naive_z: {seed_20261009: 7.648368866445359, seed_20261010: 9.13641582858141}
      blind_population_interval_contains_both: true
      sealed_evaluator_on_actual_tuples:
        seed_20261009: {pairs_g_pow_d_lt_p: 11, expected_success_count: 13.032, expected_z: 7.675, exact_fermat_quotient_count: 13}
        seed_20261010: {pairs_g_pow_d_lt_p: 13, expected_success_count: 16.240, expected_z: 7.089, exact_fermat_quotient_count: 20}
      exact_fq_vs_recorded_rows: 3200/3200 identical
      conditional_on_drawn_primes_uniform_d:
        seed_20261009: {model: 11.102, exact: 11.549, P_S_ge_observed: 0.371}
        seed_20261010: {model: 16.796, exact: 17.643, P_S_ge_observed: 0.317}
      seed_20261010_residual: >-
        Recorded 20 against the blind model's 16.24 (+3.76). All of the residual sits in the 'rest'
        rows: 7 observed against lambda 3.24, a Poisson tail of 0.047 (2.09 sd). The cause is
        identified. The exact success set {d : g^d mod p^2 < p} clumps: if g^d mod p^2 = r < p and
        g*r < p, then d+1 also succeeds. So the true rest rate exceeds 1/p at small primes: for
        p = 151, g = 6 the exact set is {2,14,15,69,112,113,126}, a rest rate of 0.0411 against
        1/p = 0.0066; for p = 157 it is 0.0133 against 0.0064. Two of the 7 rest successes are
        duplicated d draws. Under the exact success sets the observed count is typical
        (P = 0.32).
    verdict: holds
    verdict_basis: >-
      The blind Fermat-quotient implementation reproduces the recorded naive success bit on every
      row and the recorded counts 13 and 20 exactly. The blind expectation agrees with seed 20261009
      to 0.03 and lies inside the sealed population interval for both seeds. The seed-20261010
      excess over the simple 'g^d < p plus 1/p' model has an identified arithmetic cause. The
      producer's own expected-count figure, if one exists, sits in records outside this task's read
      scope (the decisions), so the comparison is against the recorded raw counts and z-scores and
      against the card's claim text.
    scripts:
    - experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/blind/fq_blind.py
    - experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/recompute_j2.py
    - experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/replay_j2_ptm.py
    - experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/j3_residual_tail.txt
  heuristic_validation_checks:
  - check: pre-registered prediction
    result: pass
    detail: >-
      heuristic_under_test is null. The preregistered prediction (Teichmuller rates exactly 1;
      |z| <= 4 for naive and Hensel on both seeds; source H-CZLIFT-d37231) sits in the
      specification frozen at b553f64e3a (22:35:28Z), which precedes the run commit ca89e1a9f0
      (22:36:21Z) and the run start (22:36:28Z).
  - check: sample integrity
    result: pass
    detail: >-
      Sample size, seeds and procedure are recoverable from the manifest and the frozen run.py.
      Every rate and z was recomputed from raw rows and every naive and Teichmuller row from
      (p, g, d). The tail statistics (conditional MC tail of the naive count, Poisson tail of the
      rest successes) were computed from the raw samples.
  - check: correspondence validity
    result: not_applicable
    detail: >-
      No substitute sampler. The Teichmuller section is a theorem-level control, and it was
      checked directly.
  - check: scale binding
    result: pass
    detail: >-
      Tier toy, p in (50, 2000), 1600 rows per seed, precision 4, no crypto-scale statement. The
      hypothesis' interpretation limit ('bears on elliptic curves only by analogy') is recorded.
  - check: null-object decay statement
    result: not_assessable_in_scope
    detail: >-
      The same-shape null (Hensel) is present and at the random rate. Whether the producer's
      interpretation states what the naive excess should do as the destroying parameter grows
      cannot be checked here, because the decisions are off-limits and the specification does not
      state it. The validator's sealed reading B shows that randomising the generator removes the
      excess (expected z 0.20 against 7.75). Under the smallest-root rule the per-pair excess
      count, about (log_g p - 1)/p, falls with p while its ratio to the 1/p reference grows like
      log p.
  cost_model_checks:
  - not_applicable: no cost table or cost claim in this experiment
  proof_architecture_checks:
  - not_applicable: bounded measurement; hypothesis proof_search_map not_applicable
  discrepancies:
  - id: D1
    severity: minor
    where: review_plan.claim_under_review (task card text, not a receipt)
    text: >-
      The card says 'z = 7.7 and 9.1'. The recorded naive.z_score on seed 20261009 is
      7.648368866445359, which rounds to 7.6. Only the double rounding 7.648 -> 7.65 -> 7.7, or the
      Poisson-binomial variant 7.6529, gives 7.7. Seed 20261010 is 9.136 -> 9.1, which is
      consistent. This does not affect any criterion.
  - id: D2
    severity: minor
    where: specification metrics.secondary and hypothesis statement
    text: >-
      'Homomorphism rates of the non-canonical sections (expected near 1/p)' is wrong for the naive
      section. Naive hom holds iff x*y < p, so the exact expectation is 9.35 and 12.96 rows, not
      1/p's 2.05 and 3.33. The recorded counts of 10 and 10 match the exact expectation. This is a
      flaw in the stated expectation, not in the recorded metric.
  - id: D3
    severity: minor
    where: run.py functional_vanishes field
    text: >-
      Vanishing is evaluated at s(g) only, so the effective sample is 40 distinct points per seed,
      against the spec's 'on every pair'. The validator's own evaluation at omega(g^d) on all 3200
      rows confirms the recorded value of 1.0.
  verdict: passed
  verdict_basis: >-
    J1, J2, J3 and PTM-1 all hold. All bytes are bound to their receipts, and every frozen metric
    and control recomputes exactly from raw-result.json on both seeds. An implementation-independent
    replay reproduces all 3200 rows, the sealed blind derivation reproduces the naive counts, and
    the success test shows the expected failure signature on the Teichmuller PTM object and on
    precision-floor noise. The receipts are admissible evidence.
  inference_boundary: >-
    A passed report makes RUN-CZLIFT-0cefcd and RUN-CZLIFT-a5c1da admissible evidence. It does not
    support or weaken H-CZLIFT-d37231, change any status, demonstrate or refute any ECDLP property,
    or authorize promotion. Interpretation and scope joints (PD-1) remain open for review-evidence.
  limitations:
  - >-
    Interpretation not owned (PD-1). The validator records criterion values only; whether the naive
    excess is 'explained by pairs with g^d < p' is for review-evidence. Numerically, g^d < p
    accounts for 11 of 13 successes on seed 20261009 and 13 of 20 on seed 20261010. The complete
    exact criterion is g^d mod p^2 < p, which accounts for all of them.
  - >-
    The naive excess depends on the unstated generator rule. Reading A (smallest primitive root,
    used by the producer) gives expected z 7.75, and reading B (random primitive root) gives 0.20.
    The specification and hypothesis say only 'generator g'.
  - >-
    The z-score treats the 1600 rows as independent Bernoulli(1/p) trials. In fact d is drawn with
    replacement (48 and 56 duplicate (p, d) rows) and outcomes are deterministic and clumped in d.
    Sensitivity: the distinct-row z is 7.24 and 8.51, so no criterion outcome changes.
  - >-
    Resource and environment records lack peak memory and the sympy version (runtime_lock null).
    Both were mitigated as described under artifact_checks.
  - >-
    The checker is not implementation-independent and re-runs only 2 of 40 primes. Independence was
    supplied by the validator's replay, not by the producer's checker.
  - >-
    Commit-trail labelling: the run packages entered git in a queue commit (08ee02a391) titled for
    another task. Byte custody is intact.
  - >-
    The dispatch_queue.json archive block ('content_at_commit') named by the receipts was not read
    because it is outside read_scope. Commit binding was established from git history instead.
  - >-
    Compute and sampling: all replays were full, since they are cheap. Independent replay covered
    3200 rows, the producer replay covered both seeds in memory, and check.py ran on both runs.
    PTM-1 used 23040 fresh rows. The blind Monte Carlo used 2000 draws of 40 primes, and the
    conditional Monte Carlo used 200000 numpy draws. Total CPU was under 15 s on 1 core. No run
    record was created.
  - >-
    The card's claim text, with producer z values 7.7 and 9.1 and the g^d < p explanation, was known
    before the blind derivation because it is part of the task card. No blind_from path was opened
    before the seal.
  artifact_paths:
  - experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/validation_report.yaml
