      All counts are equal. Floating-point differences are at most 4e-14 (summation order). The
      manifest metrics, raw-result metrics and stdout.log sections are identical to each other.
  - scope: independent per-row recomputation from (p, g, d), own Fermat quotient and own p-adic log
    result: exact
    detail: >-
      naive.success matches 3200/3200 rows under both the Fermat-quotient criterion
      q_p(g^d mod p) == d*q_p(g) and the validator's own precision-4 p-adic-log ratio.
      naive.ratio_defined matches 3200/3200. naive.v_functional equals v_p(L(s(g))) on 3200/3200
