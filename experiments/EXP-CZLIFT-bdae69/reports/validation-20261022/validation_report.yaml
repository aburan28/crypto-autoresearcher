      seed). Teichmuller: by the validator's own omega(x) = x^(p^3) mod p^4, omega(g)^d ==
      omega(g^d) and L(omega(g^d)) == 0 mod p^4 hold on 3200/3200 rows.
  - scope: full independent row replay (shares only the run.py RNG-call protocol; all arithmetic is the validator's)
    script: experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/replay_j2_ptm.py
    output: experiments/EXP-CZLIFT-bdae69/reports/validation-20261022/replay_j2_ptm_output.json
    result: exact
    detail: >-
      Prime lists and generators are equal. All five fields (hom, functional_vanishes, v_functional,
      ratio_defined, success) of all three sections, including the Hensel rows and the random (x, y)
      homomorphism pairs, are identical on 3200/3200 rows.
  - scope: producer determinism replay (in memory, no run record written)
    result: exact
    detail: driver.build(seed, 50, 2000, 40, 40) equals the archived raw-result.json for both seeds.
  - scope: frozen criteria recomputed (values only; interpretation not owned, PD-1)
    detail: >-
      teichmuller.homomorphism_rate = 1.0 and functional_vanishing_rate = 1.0 on both seeds, so no
      Teichmuller identity fails and the instrument-invalidity clause is not triggered. naive.z_score
      = 7.648 and 9.136, both > 4 on both seeds; this holds under every variant: binomial-mean-ref
      (recorded), Poisson-binomial 7.653/9.154, defined-rows-only 7.648/9.136, and distinct-(p,d)
      rows only 7.239/8.510. hensel.z_score = -0.735 and -0.731, with |z| <= 4 under every variant.
      The success criterion is therefore not met, and the falsification condition 'non-canonical
      section with z_score > 4 on both seeds' is met by the naive section.
  - scope: borderline probes
    detail: >-
      Ties: in the code a ratio of 0 (v_p(L(s(g^d))) > v_p(L(s(g)))) can never equal d mod p
      because d >= 2. d = +-1 is excluded by the range, and no row has d in {1, p-2}. Undefined
      ratios: there are 0 naive rows, and Hensel has 1 and 4 rows, all with v_functional = 2,
      counted as failures in n = 1600; the z without them is -0.734 and -0.718. Duplicates: d is
      drawn with replacement, giving 48 and 56 duplicate (p, d) rows, and some successes are
      repeats: (653,2,5)x2 on seed 20261009, and (151,6,14)x2 and (157,5,115)x2 on seed 20261010.
      No silent drop was found: 1600 rows per section per seed, every success row also has
      ratio_defined, and functional_vanishes agrees with v_functional >= 4 on every row.
  - scope: definition fidelity (recorded metric versus the specification and hypothesis wording)
    detail: >-
      (1) z_score = (rate - mean(1/p)) / sqrt(mean(1/p)(1-mean(1/p))/n), matching 'within 4 standard
      errors of the mean of 1/p'. (2) success = ratio == d mod p, matching the spec objective.
      (3) homomorphism_rate is s(xy) == s(x)s(y) mod p^4 on random (x, y), matching 'homomorphic on
      pairs'. (4) functional_vanishing_rate is evaluated only at s(g), one point per prime repeated
      over 40 rows, so the effective sample is 40 distinct points per seed. That is narrower than
      'functional-vanishing on every pair'. Under the broader definition, the validator's own L at
      omega(g^d) on all rows also gives 1.0, so the value is unchanged. (5) The Hensel section draws
      a fresh eps on each evaluation rather than fixing one lift per x. This is statistically
      equivalent for these metrics and is noted only.
  control_checks:
