    seed_20261010:
      teichmuller: {n: 1600, hom: 1600, vanish: 1600, defined: 0, success: 0, z: -1.8279072433120018, recorded_z: -1.8279072433120054}
      naive: {n: 1600, hom: 10, vanish: 0, defined: 1600, success: 20, success_rate: 0.0125, z: 9.136415828581432, recorded_z: 9.13641582858141}
      hensel: {n: 1600, hom: 0, vanish: 0, defined: 1596, success: 2, success_rate: 0.00125, z: -0.7314749361226586, recorded_z: -0.7314749361226641}
