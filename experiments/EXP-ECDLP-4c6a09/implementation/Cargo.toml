[package]
name = "snfs-g3"
version = "0.1.0"
edition = "2021"
description = "EXP-ECDLP-4c6a09 runner: Solinas number fields (H-ECDLP-4da36f)"
publish = false

[[bin]]
name = "g3"
path = "src/main.rs"

[dependencies]
nfield = { path = "../../EXP-ECDLP-84af7b/implementation/nfield" }
serde_json = "1"
sha2 = "0.10"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[features]
default = []
pari = ["nfield/pari"]

[workspace]

[profile.release]
opt-level = 3
debug = false
