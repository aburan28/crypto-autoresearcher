   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(54.276376 86.279729)">36 sparse-prime blocks</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(58.552939 97.477542)">S + nearby random R</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(38.49747 108.675354)">+ residue-matched random C</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(70.373251 119.873167)">108 main moduli</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(312.152679 97.477542)">Uniform curve audit</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(296.808929 108.675354)">32 nonsingular models / p</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(563.748103 97.477542)">Subgroup size + flags</text>
