   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(293.769085 192.043396)">512-model candidate pools</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(292.983147 203.241208)">Subgroup order ratio ≤1.10</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(560.201228 192.043396)">Rho work / √ell + BSGS</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(569.808259 203.241208)">Attack-specific cost</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.430283 242.833758)">Fixed arithmetic workloads</text>
