experiment:
  id: EXP-MTGT-77dda6
  hypothesis_id: H-MTGT-48f3a3
  derived_from_idea: IDEA-20260807-0e8977
  question_id: RQ-MTGT-2cabee
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The transport null battery - five arms on identical instances, an exact affine dose-response
    calibration in the mixing fraction, an isogeny-degree decay axis with a degree-1 dilation
    positive control, an independent certificate layer, and a deliberately broken map that must be
    detected
  objective: >-
    The one uncertainty a run reduces is whether this lane's retention statistic can distinguish a
    table that was transported from a table that was merely relabelled. A run establishes (i) whether
    the identity-map arm returns exactly 1.000, the precondition before any curve is changed;
    (ii) whether the random-relabelling arm's exact pass count is consistent with the binomial chance
    null, which detects a certificate path that leaks by calling the transport routine; (iii) the
    treatment-minus-null retention gap, which is the direct measurement of whether a map was applied
    at all; (iv) the fitted slope, intercept and quality of retention against the mixing fraction
    against their exactly known targets, which is a whole calibration curve rather than two
    endpoints; (v) the degree-1 dilation-invariance control for the encoding-valued predicate, which
    is the detector for the specific prior failure mode of an experiment that applied no map; and
    (vi) whether every deliberately broken map is caught by the isogeny certificate.
    No attack, key recovery, speedup or security consequence is claimed here or would follow from a
    run. Passing the battery proves the instrument works and proves nothing about transport.
  what_this_is_not:
    - >-
      Not an attack, a speedup, or a cryptanalytic result of any kind. It is a control-battery and
      instrument-validation contract.
    - >-
      Not a decision about whether preprocessing advice transfers between curves. The battery exists
      to make that question measurable, not to answer it.
    - >-
      Not a criticism of any prior experiment's execution. Reconstructing a prior chance-baseline
      result inside the battery corrects a READING recorded downstream of it, and that distinction is
      binding on every citation.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed toy field sizes, table sizes, degrees and mixing
      fractions, the instrument did or did not satisfy each of its six acceptance conditions, and the
      resulting battery is or is not a validated fixture that later runs in this lane must pass.
      WHAT DOES NOT FOLLOW - nothing about whether preprocessing advice transfers; nothing about any
      isogeny class; nothing about the ECDLP; nothing at crypto scale, where the exact uniform null
      is not materialisable at all; and specifically NOT that a validated instrument makes any
      particular retention number true.
  inputs:
    procedure: >-
      STEP 1 (zero compute, FREEZE): write down the value predicate for each class - the known
      logarithm pairing, the distinguished-point predicate, the box-membership predicate - and the
      INDEPENDENT check for each. Freeze the encoding of a table entry, the mixing-fraction grid, the
      degree grid, the acceptance bands for slope, intercept and fit quality, and the
      table-size-to-order threshold. Hash all of it.
      STEP 2 (minutes, GATE): ARM P, the identity map. Retention must be exactly 1.000 and the
      certificate path must be exercised. If not, stop.
      STEP 3 (minutes, GATE, ORDERING IS DELIBERATE): run ARM N1, ARM N2 and ARM N3 BEFORE the
      treatment is implemented, and record their exact pass counts. This ordering prevents the
      treatment's implementation from being tuned until it beats the null.
      STEP 4 (minutes, GATE): certify the isogeny - the image of the generator is not the identity,
      the subgroup order kills it, the image of the target equals the known scalar times the image of
      the generator, and the declared degree is coprime to the subgroup order. Record the certificate
      as an artifact. An arm whose isogeny certificate fails is INVALID, never a negative.
      STEP 5 (minutes to an hour): ARM T at each of six declared mixing fractions, five seeds each.
      Fit retention against the mixing fraction and check the slope, intercept and fit quality
      against their pre-declared bands.
      STEP 6 (minutes): the degree sweep for the encoding-valued predicate, with the degree-1
      isomorphism arm as the dilation-invariance positive control, plus composite path lengths 1, 2
      and 3.
      STEP 7 (minutes, GATE): planted-signal detection in the adversarial direction - deliberately
      break the transport (use the correct x-map with the wrong y, and use a map whose degree shares
      a factor with the subgroup order) and confirm the certificate reports failure rather than
      silently producing high retention.
      STEP 8 (minutes): the non-interference receipt - content-hash the table before any target is
      disclosed, under permuted target order, and under a withheld target, and require equality.
      STEP 9 (low hours): repeat the whole battery at three field sizes and five seeds, and archive
      it as the reusable fixture every later run in this lane must pass before its numbers are
      admitted.
    instrument: >-
      Python with arbitrary-precision integers; toy curve construction, isogeny construction by the
      standard kernel-subgroup route, and breadth-first search over the enumerable isogeny class. The
      certificate path is written in a module that does NOT import the transport routine, and this is
      enforced by review as part of the completion gate. The uniform random bijection is sampled by
      permuting an explicit list of the group's elements, which is what caps the battery at toy scale
      and is disclosed as the binding constraint. Separate seed streams for the isogeny and for the
      bijection. Recorded through the program's run wrapper with a manifest.
    parameters: >-
      Field sizes at roughly 12, 16 and 20 bits with enumerable isogeny classes; table size declared
      per instance subject to a table-size-to-order ratio below the frozen threshold; mixing fraction
      over {0, 0.125, 0.25, 0.5, 0.75, 1}; isogeny degree over {1, 2, 3, 5, 7, 11} plus composite path
      lengths 1, 2 and 3; five seeds per cell; both a group-valued and an encoding-valued predicate;
      acceptance bands for slope, intercept and fit quality frozen in STEP 1 and taken from the parent
      proposal's pre-registration.
  controls:
    - >-
      ARM P, IDENTITY-MAP POSITIVE CONTROL, blocking - retention must be exactly 1.000. An instrument
      that fails here is broken before any curve is changed.
    - >-
      ARM N1, RANDOM SIZE-MATCHED RELABELLING, blocking and mandated - same table size, same scalars,
      same value predicate, same certification code, a uniformly random bijection in place of the
      isogeny. This is THE null, because it is identical to the treatment in every respect except
      that no map is applied.
    - >-
      ARM N2, SCALAR SHUFFLE - the same transported points with permuted scalars. Separates "the
      points moved" from "the point-scalar pairing survived".
    - >-
      ARM N3, NO-MAP RECONSTRUCTION - a table built from an independently chosen generator on the
      second curve with no correspondence to the first. This arm exists so the prior experiment's
      measurement can be reproduced INSIDE the new instrument and shown to be a different arm from
      the treatment.
    - >-
      DEGREE-1 DILATION-INVARIANCE POSITIVE CONTROL - under a field isomorphism a dilation-invariant
      encoding-valued predicate must retain EXACTLY. A value at chance here proves no map was
      applied.
    - >-
      BROKEN-MAP ADVERSARIAL CONTROL, blocking - deliberately broken maps must be caught by the
      isogeny certificate at a detection rate of 1.000. An instrument that cannot detect a broken map
      is not a control.
    - >-
      SELF-COMPARISON GUARD - require that the image of the generator differs from the generator and
      that the two curves' j-invariants differ, since a transport routine that returns its input makes
      the treatment identical to the identity arm.
    - >-
      CERTIFICATE-PATH INDEPENDENCE, blocking - the check recomputes the scalar multiple from the
      transported generator alone and never calls the code that produced the transported point.
      Enforced by review.
    - >-
      NON-INTERFERENCE RECEIPT - content-hash equality of the table before target disclosure, under
      permuted target order, and under a withheld target.
    - >-
      SEPARATE SEED STREAMS - the isogeny and the random bijection are drawn from disjoint streams,
      since a shared instance seed would correlate treatment and null.
  independent_variables:
    - 'arm: P (identity) / T (certified isogeny) / N1 (random relabelling) / N2 (scalar shuffle) / N3 (no-map reconstruction)'
    - mixing fraction alpha, over six declared values from 0 to 1
    - isogeny degree, over six declared values starting at 1
    - composite path length, 1 to 3
    - 'value predicate class: group-valued versus encoding-valued'
    - field size in bits
  metrics:
    primary:
      - name: certificate_pass_counts
        units: exact integer count of passing entries, per arm per seed, over the exact table size
        computed: >-
          Number of table entries passing the INDEPENDENT check, counted per arm and per seed and
          reported as exact integers together with the table size and the seed count. Never reported
          as a rounded rate, because at these sizes the expected number of accidental passes under the
          null is a small integer and a rounded rate cannot be distinguished from zero.
      - name: arm_T_minus_arm_N1_gap
        units: dimensionless retention difference in the closed interval from -1 to 1
        computed: >-
          Retention of ARM T minus retention of ARM N1, computed from the exact pass counts on the
          same instances with the same table size. Required to exceed the pre-declared threshold.
      - name: alpha_fit
        units: >-
          fitted slope (dimensionless), fitted intercept (dimensionless), and fit quality
          (dimensionless), each with its pre-declared acceptance band
        computed: >-
          Least-squares fit of retention against the mixing fraction over the six declared values with
          five seeds each, reported with the fitted slope, the fitted intercept, the fit quality and
          the residual at each mixing fraction.
      - name: arm_P_retention
        units: dimensionless retention in the closed interval 0 to 1
        computed: >-
          Retention on the identity-map arm, computed from exact pass counts. Required value is
          exactly 1.000.
      - name: broken_map_detection_rate
        units: exact integer count of detected faults over exact integer count of injected faults
        computed: >-
          Number of deliberately broken maps that the isogeny certificate rejects, over the number
          injected. Required equality; a single miss means the certificate is not load-bearing.
      - name: degree1_dilation_retention
        units: dimensionless retention in the closed interval 0 to 1
        computed: >-
          Retention of the dilation-invariant encoding-valued predicate under the degree-1 field
          isomorphism. Required exactly 1.000; a value at chance proves no map was applied.
    secondary:
      - name: retention_vs_degree
        units: dimensionless retention per degree and per path length
        computed: >-
          Retention of the encoding-valued predicate at each degree and each composite path length,
          from exact pass counts.
      - name: null_arm_agreement
        units: pairwise difference in exact pass counts among ARM N1, N2 and N3, with a binomial test
        computed: >-
          Exact pass counts of the three null arms compared pairwise against the binomial null at the
          declared level.
      - name: isogeny_certificate_outcome
        units: 'categorical per constructed map: pass / fail, with the four checked conditions'
        computed: >-
          Recorded per constructed isogeny - generator image not the identity, killed by the subgroup
          order, target image consistent with the known scalar, declared degree coprime to the
          subgroup order.
      - name: j_invariants_per_member
        units: field element per curve
        computed: >-
          Recorded per class member and required distinct between the two curves of any treatment arm,
          so an isomorphic classmate cannot silently turn the treatment into a degree-1 arm.
      - name: non_interference_hashes
        units: sha256 per table under three disclosure conditions
        computed: Content hash of the table before disclosure, under permuted target order, and under a withheld target.
      - name: wall_clock_and_peak_memory
        units: seconds and bytes
        computed: Per arm, with the explicit group-element list's memory reported separately as the binding constraint.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The tuple (arm_P_retention, certificate_pass_counts on the three null arms,
      arm_T_minus_arm_N1_gap, alpha_fit, degree1_dilation_retention, broken_map_detection_rate).
    formula: >-
      arm_P_retention exactly 1.000. The three null arms' exact pass counts consistent with a
      binomial distribution at the chance baseline of one over the subgroup order, at the declared
      level, and mutually indistinguishable. arm_T_minus_arm_N1_gap at least 0.999. alpha_fit slope
      in the band [0.95, 1.05], intercept below twice the chance baseline, fit quality at least 0.99.
      degree1_dilation_retention exactly 1.000. broken_map_detection_rate exactly 1.000. The
      dose-response target itself is ARITHMETIC, not a prediction - expected retention at mixing
      fraction alpha equals alpha plus one minus alpha times the chance baseline, by linearity of
      expectation.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-0e8977 (claim part B and C, predictions
      block) before any run under this contract exists. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at roughly 12 to 20 field bits. That is not a convenience choice - the exact uniform
      null requires materialising an explicit list of the group's elements, which is affordable only
      at toy scale, and the design DELIBERATELY prefers the exact null over a lazily sampled one and
      accepts the scale cap. The transfer assumption is therefore stated as absent rather than
      minimised: the battery validates an instrument at toy scale and licenses no crypto-scale
      statement of any kind, since the null it depends on cannot even be constructed there.
    correspondence: null
  tail_checks:
    - >-
      Report EXACT pass counts per arm per seed, never rounded rates, since at the declared sizes the
      expected number of accidental passes under the null is a small integer and a rate would hide the
      difference between one and zero.
    - >-
      Report the residual at each mixing fraction, not only the fitted slope, since a good slope with
      a systematic residual pattern means the mixture is not being formed as declared.
    - >-
      Report the minimum table-size-to-order ratio actually achieved, and refuse to report any figure
      from a cell violating the frozen threshold, since a small subgroup order inflates the null.
    - >-
      Report the j-invariant of every class member used, since an isomorphic classmate would silently
      turn the treatment arm into a degree-1 arm and produce retention 1.000 for the wrong reason.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
      - 20260828
      - 20260829
    independent_instances: 5
    note: >-
      Five seeds per (arm, mixing fraction, degree) cell, drawn from a stream disjoint from the
      isogeny stream. Exact counts are pooled only after being reported per seed.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
    - Stop immediately if ARM P does not return exactly 1.000; no other arm is run.
    - Stop if ARM N1's exact pass count exceeds the binomial null at the declared level; the certificate path is leaking.
    - >-
      Stop at STAGE 1 if the ARM T minus ARM N1 gap is below the declared threshold. The parent
      proposal identifies this as the cheapest valid check in the lane and the whole lane stops here
      at a cost of seconds.
    - Stop if any deliberately broken map goes undetected.
    - >-
      Stop at the declared grids - six mixing fractions, six degrees, three path lengths, five seeds,
      three field sizes. The acceptance bands are frozen in STEP 1 and are not revised after a fit is
      seen.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose null arms were not executed in the same invocation and on the same pipeline as the
      treatment arm is invalid_measurement.
    - >-
      An arm whose isogeny certificate fails is INVALID, never a negative on transport.
    - >-
      A run in which the certificate path imports or calls the transport routine is
      invalid_measurement, because retention is then 1.000 by construction.
    - >-
      A run in which the treatment and null share a seed stream is invalid_measurement, because the
      comparison is then correlated by construction.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The battery is validated when ALL of the following hold and are read off the predefined metrics:
    (1) arm_P_retention equals exactly 1.000; (2) the exact pass counts of ARM N1, N2 and N3 are each
    consistent with the binomial chance null at the declared level and mutually indistinguishable;
    (3) arm_T_minus_arm_N1_gap is at least 0.999; (4) alpha_fit's slope lies in [0.95, 1.05], its
    intercept is below twice the chance baseline, and its fit quality is at least 0.99;
    (5) degree1_dilation_retention equals exactly 1.000; (6) broken_map_detection_rate equals 1.000;
    and (7) the non-interference hashes are equal under all three disclosure conditions.
    Failure of ANY of the seven is a failure of the battery, and the battery cannot succeed by
    reporting a comfortable number - each condition names an outcome that would fail it.
  falsification_criterion:
    - >-
      ARM P returns anything other than exactly 1.000 - the instrument is broken before any curve is
      changed and nothing downstream is admitted.
    - >-
      ARM N1's exact pass count exceeds the binomial null - the certificate path is LEAKING, most
      likely by calling the transport routine, and the battery is INVALID rather than negative.
    - >-
      arm_T_minus_arm_N1_gap is below 0.999 - the instrument cannot see transport. This CLOSES THE
      LANE ON INSTRUMENT GROUNDS rather than on mathematics, and it must be reported as exactly that.
    - >-
      alpha_fit misses its pre-declared band - retention is not the mixture statistic it is claimed
      to be and every downstream figure is void.
    - >-
      degree1_dilation_retention is at the chance baseline - NO MAP WAS APPLIED, which is the
      specific prior failure mode this battery exists to detect, and detecting it would show that a
      previously recorded scoped negative on transfer was a reading of an instrument that applied no
      map.
    - >-
      Any deliberately broken map goes undetected - the certificate is not load-bearing and no
      retention count computed under it carries any guarantee.
    - >-
      The non-interference hashes differ - preprocessing peeked at the targets, and no retention
      figure from that run is admissible.
  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - the STEP 1 frozen value predicates, entry encoding, grids and acceptance bands, with their hash
    - raw-result.json carrying EXACT per-arm per-seed pass counts and table sizes, not rates
    - the null arms' measurements, in the same file as the treatment arm, with their run order recorded
    - the isogeny certificate for every constructed map, with its four checked conditions
    - the injected broken maps and their per-fault detection outcome
    - the alpha fit with per-mixing-fraction residuals
    - the j-invariant of every class member used
    - the non-interference content hashes under all three disclosure conditions
    - wall clock and peak memory per arm, with the explicit group-element list's memory separated out
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The parent proposal declares proof_search_map not_applicable with a stated reason, so the
      KN-TECH-080 proof-oriented gate does not bind; the Coordinator must confirm that reading rather
      than inherit it.
    - >-
      Certificate-path independence must be established by CODE REVIEW before STEP 2, not asserted.
      This is the completion gate the parent proposal names and it is the difference between a
      retention count and a tautology.
    - >-
      The run ordering in STEP 3 - nulls before treatment - is part of the contract, not a
      convenience. A run that implements the treatment first is a different experiment.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-0e8977
    authored_at: '2026-08-25'
    note: >-
      Arms, acceptance values, the affine calibration, the degree axis, the certificate layer and the
      broken-map control are transcribed from the parent proposal's claim parts B to E, predictions,
      minimal_test, controls and null_object_control blocks; the non-interference receipt is adopted
      unchanged from the sibling hypothesis the proposal names. Budgets come from the parent's
      declared estimated_cost (implementation low, compute low) through the program's cost table. No
      numeric retention value is asserted anywhere in this contract as measured; every number is a
      pre-registered target.
  derivation_gaps:
    - >-
      The exact table size per instance is not fixed here; it is constrained only by the frozen
      table-size-to-order threshold. It must be chosen and frozen in STEP 1, because the binomial null
      for ARM N1 depends on it and a size chosen afterwards would make that null unfalsifiable.
    - >-
      The declared level for the binomial test on the null arms is named but not chosen. It must be
      fixed in STEP 1 alongside the acceptance bands.
    - >-
      Three value predicates are named (known-logarithm pairing, distinguished point, box membership)
      but only the first has an obvious independent check. The independent check for the other two
      must be written and reviewed before STEP 2, or those predicates must be dropped from the battery
      explicitly rather than silently.
    - >-
      Whether the encoding-valued predicate used in the degree sweep is genuinely dilation-invariant
      is a property of the predicate that must be verified symbolically before STEP 6; otherwise the
      degree-1 positive control tests nothing.
    - >-
      The parent proposal notes that the explicit group-element list is the binding memory constraint
      and caps the battery at toy scale. The maximum field size at which the list is materialisable
      within the declared memory budget must be computed before STEP 9 rather than discovered by an
      out-of-memory failure.
