# =============================================================================
# EXP-BINSTD-b94ec8 -- Frozen contract for H-BINSTD-dfc684: HOLD-X1 optional
# sub-arm / HOLD-T supersession — Frobenius divisor cancels on the orbit
# system; m=4 curve-shape null at n=31 on a Frobenius-stable base.
#
# Source: IDEA-20261001-e740ce under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved: DEC-20261002-e6818c. Snapshot: TASK-20261002-402af9.
# Executor: TASK-20261002-b92ba4.
#
# HOLD-X1 (IDEA-20260926-4b65e3 / EXP-CERTBIN-fad576 on PR #1571) designed
# separately without folding this stable-base cell; DEC-20260929-7257b2
# ranked e740ce as optional sub-arm — this card opens it as its own unit.
# Stages 0-2. ZERO RUNS in the design session. No AUXIN. No Bedrock.
# Claim tier: measurement / toy. No attack / exponent claim.
# =============================================================================
experiment:
  id: EXP-BINSTD-b94ec8
  version: 1
  hypothesis_id: H-BINSTD-dfc684
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-e740ce
  supersedes_idea: IDEA-20260922-493606
  related_idea_ids:
    - IDEA-20260926-4b65e3
    - IDEA-20261001-93e740
    - IDEA-20260926-9c5694
    - IDEA-20260906-a77711
  goal_id: GOAL-ECDLP2M-001
  designed_by_task: TASK-20261002-402af9
  snapshot_task: TASK-20261002-402af9
  executor_task: TASK-20261002-b92ba4
  title: >-
    HOLD-X1 optional sub-arm: Stage-0 counting identity + m=4 admissibility
    screen; Stage-1 setup + fixture E0; Stage-2 Koblitz-vs-ordinary CNF-XOR
    leaf-count null at n=31, l in {5,6} on Frobenius-stable V
  status: approved
  approved_by: DEC-20261002-e6818c
  approval:
    approved_by: DEC-20261002-e6818c
    standing_authorization: >-
      AGENTS.md standing user authorization (2026-09-06). Protocol complete;
      Coordinator checked required fields before approving.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    execution_state: approved frozen contract; awaiting /run under TASK-20261002-b92ba4

  objective: >-
    (1) Freeze Stage-0 zero-compute worksheet: counting identity (A),
    ord_n(2)/stable dimensions at {17,23,29,31,37,41}, m=4 admissibility
    screen = {(31,5),(31,6)}, search sizes, claim-(D) D3/rho arithmetic.
    (2) Stage-1: build F_{2^31}, Phi_31 factors, V5/V6, Koblitz a=0/a=1 and
    ordinary curves; run fixture E0 (export structure + 20 planted SAT).
    (3) Stage-2: complete CNF-XOR search at m=4, 50 UNSAT + 20 SAT targets
    per arm (stable V5/V6 and window bases, Koblitz+ordinary); record leaf
    counts and decide exactly one O-* label. Observations only.

  claim_tier: measurement
  claim_tier_note: >-
    Toy measurement at n=31. No IC-vs-rho claim, no deployed-curve verdict,
    no exponent move. Missing WDSat → O-IMPEDIMENT, never evidence.

  inputs:
    proposal: ledger/proposals/IDEA-20261001-e740ce.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-dfc684.yaml
    decision: ledger/decisions/DEC-20261002-e6818c.yaml
    worksheet: >-
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-04a6be/revision/TASK-20260929-3907b4/revision-worksheet.yaml
    corrections:
      - ledger/corrections/CORR-20260928-4cb669.yaml
      - ledger/corrections/CORR-20260922-81aeab.yaml
      - ledger/corrections/CORR-20260925-649e25.yaml
    related:
      - ledger/proposals/IDEA-20260926-4b65e3.yaml
      - ledger/proposals/IDEA-20260926-9c5694.yaml
      - ledger/proposals/IDEA-20260906-a77711.yaml
      - ledger/decisions/DEC-20260929-7257b2.yaml
      - ledger/decisions/DEC-20260928-63addc.yaml
      - ledger/decisions/DEC-20260924-99ce20.yaml
    hold_x1_pointer: >-
      EXP-CERTBIN-fad576 (PR #1571) — non-stable window / closure-oracle cells;
      read-only pointer; do not edit that contract under this card.
    off_limits:
      - Editing IDEA-20261001-e740ce / 493606 / 4b65e3 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Opening IDEA-20260926-89886c / which-algebra NA-2 under this card.
      - Magma / Sage / AUXIN as success path.
      - Amazon Bedrock.
      - Any run at n>=131 or any deployed-curve attack claim.
      - Per-orbit relation framing (CORR-20260925-649e25) as a speedup.

  controls:
    - name: ordinary_curve
      description: >-
        Ordinary curve at identical (n, V, m, l); blocking baseline where the
        withdrawn divisor is absent by construction.
    - name: polynomial_window_base
      description: >-
        Base {deg < l} of the same dimension; base-shape control with no
        Frobenius-stable structure.
    - name: fixture_E0
      description: >-
        Equal CNF-XOR export structure across arms; 20 planted SAT targets
        per arm certified by group arithmetic.
    - name: koblitz_replicate
      description: Two Koblitz curves (a=0 and a=1) as within-shape replicate.
    - name: search_size_print
      description: >-
        2^{ml}/m! and multiset count printed beside measured median before
        any ratio is read.

  independent_variables:
    - name: curve_shape
      levels: [koblitz_a1, koblitz_a0, ordinary]
    - name: base_kind
      levels: [stable_V, window_deg]
    - name: subspace_dim_l
      levels: [5, 6]
    - name: arity_m
      levels: [4]
    - name: field_degree
      levels: [31]

  primary_metrics:
    - name: koblitz_ordinary_median_leaf_ratio
      definition: >-
        median(UNSAT conflicts, Koblitz) / median(UNSAT conflicts, ordinary)
        at fixed (V,m,l); reported with bootstrap CP95.
    - name: outcome_label
      definition: Exactly one of O-NULL / O-DIVISOR / O-SHAPE / O-ARTIFACT / O-IMPEDIMENT.
    - name: stage0_admissible_cells
      definition: Set of (n,l) pairs declared admissible; must equal {(31,5),(31,6)}.
    - name: certificate_pass_rate
      definition: Fraction of planted SAT targets certified; must be 1.0.

  secondary_metrics:
    - name: median_leaf_over_search_size
      definition: median conflicts / (2^{ml}/m!) and vs multiset count, per arm.
    - name: window_stable_ratio
      definition: window/stable median leaf ratio on Koblitz at same l.
    - name: F_V_cardinality
      definition: '|F_V| per curve and base.'
    - name: clause_xor_row_counts
      definition: CNF clause count and XOR-row count per export.
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed stage.
    - name: wall_clock_seconds
      definition: Wall clock per target and per arm aggregate.
    - name: termination_reason
      definition: Solver termination reason per target.

  seeds_and_replication:
    master_seed: 20261002e7
    unsat_targets_per_arm: 50
    planted_sat_targets_per_arm: 20
    cheapest_discriminator: >-
      l=5, Koblitz vs ordinary on V5, 50 UNSAT each (search size ~4.4e4).
    replication: >-
      Single primary replication under this card; seed and instance-set rule
      frozen in stage0/preregistered-predictions.json. Second seed out of
      scope unless O-ARTIFACT triggers a repair amendment.

  budget:
    wall_clock_seconds: 28800
    memory_gb: 8
    maximum_runs: 3
    cpu_note: >-
      Advisory. Stage 0 is zero compute. Stage 2 estimate seconds-to-minutes
      per instance once WDSat is built; freeze scientific sample counts; do
      not expand to m!=4, other n, or deployed curves with leftover wall clock.

  stopping_rules:
    - Stage 0 must freeze predictions and the admissibility set before any Stage-1 metric is read.
    - Fixture E0 failure → O-ARTIFACT; do not read leaf ratios.
    - Planted certificate failure → O-ARTIFACT; run void.
    - Missing / unbuildable WDSat → O-IMPEDIMENT; do not substitute Magma/Sage/AUXIN.
    - Timeout / OOM / crash → failed_infrastructure / O-IMPEDIMENT; never negative evidence.
    - After exactly one O-* is decided, stop; no m!=4 or n!=31 expansion under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze invalidates subsequent stages.
    - Changing solver, branching order, or seed mid-arm without an amendment invalidates ratios.
    - Mixing HOLD-X1 closure-oracle cells into this card's RESULTS without amendment is out of scope.
    - Any claim of speedup / exponent / deployed break in RESULTS.md invalidates the scientific read (scope defect).

  success_criterion: >-
    Decidable from the primary metrics before any run. The experiment SUCCEEDS
    as a measurement (either outcome direction) when all of: (1) Stage 0
    worksheet present with counting identity, admissibility screen =
    {(31,5),(31,6)}, search sizes, and claim-(D) D3/rho arithmetic, frozen in
    stage0/preregistered-predictions.json before Stage 1; (2) Fixture E0
    passes and certificate_pass_rate = 1.0 on planted SAT targets, OR exactly
    one of O-ARTIFACT / O-IMPEDIMENT is named with no leaf-ratio read;
    (3) exactly one O-* label in RESULTS.md decidable from primary metrics
    alone (O-NULL / O-DIVISOR / O-SHAPE / O-ARTIFACT / O-IMPEDIMENT);
    (4) peak RSS reported beside every timed stage; solver name, version, and
    build hash recorded; (5) Magma / Sage / AUXIN / Bedrock were not used as
    the success path. Scientific direction (null vs divisor vs shape) is read
    from the O-* label and does not alter success-as-measurement.

  falsification_criterion: >-
    Stated before any run, scoped to the tested (n=31, m=4, l in {5,6}) cell.
    H-BINSTD-dfc684's shape-null prediction is falsified by O-SHAPE
    (Koblitz/ordinary median leaf ratio outside [0.8, 1.25], replicated on
    both Koblitz curves and not reproduced by the window control) or by
    O-DIVISOR (replicated ratio <0.1 / near 1/31 on the Koblitz stable arm).
    Fixture E0 failure or any planted-certificate failure is O-ARTIFACT
    (instrument / soundness defect): run void; not directional evidence.
    Stage-0 screen arithmetic that does not equal {(31,5),(31,6)} falsifies
    the admissibility claim of this contract. Timeout / crash / missing WDSat
    is O-IMPEDIMENT / failed_infrastructure, never negative mathematical
    evidence. No outcome under this card asserts an IC-vs-rho, deployed-curve,
    or exponent claim.

  success_criteria:
    - Stage 0 worksheet present with identity, screen={(31,5),(31,6)}, search sizes, claim-(D) arithmetic.
    - Fixture E0 pass; certificate_pass_rate = 1.0 on planted targets (or O-ARTIFACT/O-IMPEDIMENT named).
    - Exactly one O-* label in RESULTS.md, decidable from primary metrics alone.
    - Memory reported beside time; solver name/version/build hash recorded.
    - No Magma/Sage/AUXIN/Bedrock used as success path.

  falsification_criteria:
    - Per H-BINSTD-dfc684 falsification_criteria (ratio band, near-1/31, E0/cert fail, screen arithmetic).

  required_artifacts:
    - experiments/EXP-BINSTD-b94ec8/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-b94ec8/stage0/worksheet-note.md
    - experiments/EXP-BINSTD-b94ec8/stage1/fixture-E0.json
    - experiments/EXP-BINSTD-b94ec8/stage1/curves-and-bases.json
    - experiments/EXP-BINSTD-b94ec8/stage2/leaf-counts.jsonl
    - experiments/EXP-BINSTD-b94ec8/stage2/arm-summaries.json
    - experiments/EXP-BINSTD-b94ec8/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-b94ec8/RESULTS.md

  stages:
    - id: 0
      name: zero_compute_worksheet
      description: >-
        Counting identity written out; ord_n(2) and stable dimensions;
        m=4 admissibility screen; search sizes; claim-(D) D3/rho arithmetic;
        freeze preregistered predictions including the [0.8,1.25] band and
        withdrawn 1/31 comparator.
      compute: none
    - id: 1
      name: setup_and_fixture_E0
      description: >-
        Build F_{2^31}, factor Phi_31, construct V5/V6 and window bases,
        admit curves, export CNF-XOR, run fixture E0 (structure + planted SAT).
      compute: setup
    - id: 2
      name: shape_null_measurement
      description: >-
        Complete CNF-XOR search; 50 UNSAT + 20 SAT per arm across curve_shape
        x base_kind x l; compute ratios; emit exactly one O-*.
      compute: measurement
      cheapest_valid_discriminator: l=5 Koblitz-vs-ordinary on V5

  protocol_amendments_path: experiments/EXP-BINSTD-b94ec8/amendments/
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
