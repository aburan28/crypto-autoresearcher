# =============================================================================
# EXP-BINSTD-f9a860 -- VERSION 1 (APPROVED by DEC-20261001-8570c3) frozen
# contract for H-BINSTD-0514c3: Stage 0 schema+validator scaffolding +
# gitignore for generated view; Stage 1 seed re-derived per-cell shards
# only (HOLD-F); Stage 2 live checks + generated view; Stage 3 six-case
# synthetic-mutation battery on scratch copies.
#
# Source: IDEA-20260922-6028ed under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs HOLD-F review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6028ed.yaml
# (verdict sound_with_corrections): per-cell write-once shards; extended
# schema (unit, m, floor_bits, budget_bits, rho_convention,
# provenance_tier); ECC2K-130 hand-seed from KN-LIT-661e97; seed only
# re-derived cells at proposal_arithmetic.
#
# ZERO RUNS in this design packet. Stages 0-3 authorized for later executor
# TASK-20261001-af8338. No AUXIN. Amazon Bedrock prohibited.
# packaging_only false. Class: tooling — no attack.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Run manifests for this experiment MUST use certificate.kind: none.
# =============================================================================
experiment:
  id: EXP-BINSTD-f9a860
  hypothesis_id: H-BINSTD-0514c3
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6028ed
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Per-cell reachability shards + validate_reachability_table battery
    (HOLD-F corrected schema and seed policy)
  status: approved
  approved_by: DEC-20261001-8570c3
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-8570c3
    composing_decision: DEC-20261001-8570c3
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break. HOLD-F
      defects absorbed. CI wire-up is NOT authorized by this approval —
      only Stages 0-3 tooling + battery.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stages 0-3 are tooling / transcription / synthetic battery only.
      No scientific ECDLP attack runs. No group arithmetic on deployed
      curves. Stage 4 CI proposal is OUT OF SCOPE of this experiment's
      authorized stages (Coordinator infrastructure decision after 6/6).
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Create a per-cell write-once reachability layout and schema with
    HOLD-F extended fields. (B) Seed only independently re-derived cells
    at provenance_tier proposal_arithmetic, including an ECC2K-130 row
    by hand. (C) Implement validator live checks and a gitignored
    generated table view. (D) Pass a six-case synthetic-mutation battery
    on scratch copies (forced 6/6). Claim no curve cost or break.

  class: tooling
  class_note: >-
    Infrastructure carrier for RQ-BINSTD-b6f698's decision_target. Not a
    smoothness heuristic-validation experiment and not a cost-model
    claiming cryptanalytic impact. Measured vs transcribed vs inherited
    columns stay separate. No exponent-moving claim.

  corrections_absorbed:
    hold_f_per_cell_sharding: >-
      One file per cell under
      analysis/binstd-curve-audit/reachability/<curve>/<column>.yaml;
      write-once with superseded_by; generated view gitignored.
    hold_f_extended_schema: >-
      Required fields include unit, m, floor_bits, budget_bits,
      rho_convention (CORR-20260922-81aeab), provenance_tier.
    hold_f_ecc2k130_hand_seed: >-
      ECC2K-130 row added by hand from KN-LIT-661e97 (absent from OpenSSL
      dump).
    hold_f_seed_only_rederived: >-
      Do not seed COMPUTED cells from unrepaired 77bf31 g/B prose; seed
      only re-derived arithmetic / STRUCTURALLY_EMPTY certificates.

  scope:
    included:
      - >-
        Stage 0: author schema module / validate_reachability_table.py
        skeleton; add gitignore entry for
        analysis/binstd-curve-audit/reachability_table.generated.yaml
        (and any other generated aggregate named in implementation/);
        write methodological note.
      - >-
        Stage 1: seed per-cell YAML shards ONLY for re-derived cells
        listed under inputs.seed_cells; mark provenance_tier
        proposal_arithmetic; leave all other cells absent or explicit
        NOT_YET_ASSESSED shards if a full grid is required by the schema
        (prefer ABSENT = not yet assessed to avoid inventing ~175 empty
        files unless the validator needs a declared grid — document the
        choice in stage1/seed-policy.yaml).
      - >-
        Stage 2: implement schema + certificate hash + supersession +
        informational liveness checks; build generated view from shards.
      - >-
        Stage 3: six-case battery on scratch copies; report per-case
        pass/fail with named cell and pointer; runtime and peak RSS.
    excluded:
      - Any scientific ECDLP / GHS / decomposition attack run
      - Seeding COMPUTED cells from unrepaired IDEA-20260922-77bf31 prose
      - Wiring the validator into CI as a blocking check (Stage 4 / later DEC)
      - Editing AUXIN / QSP / SEMBIN records
      - Amazon Bedrock
      - Committing the generated table view
      - Mutating live ledger records for battery cases (scratch only)
      - Claiming retrieved provenance without verified_by / without reading
      - Using non-vocabulary certificate.kind values on run manifests
      - Claiming a break or any curve's attack cost

  inputs:
    proposal: ledger/proposals/IDEA-20260922-6028ed.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6028ed.yaml
    curve_audit: analysis/binstd-curve-audit/
    audit_readme: analysis/binstd-curve-audit/README.md
    subfield_scan: analysis/binstd-curve-audit/subfield_scan.py
    subfield_certify: analysis/binstd-curve-audit/subfield_certify.py
    hypothesis: ledger/hypotheses/H-BINSTD-0514c3.yaml
    rho_convention: ledger/corrections/CORR-20260922-81aeab.yaml
    ecc2k130_lit: knowledge/literature/KN-LIT-661e97.md
    validate_ledger: tools/validate_ledger.py
    claims_doc: docs/claims-and-verification.md
    seed_cells:
      note: >-
        Exact cell set is the HOLD-F concrete_experiment seed list.
        Executor must re-derive or copy only numbers that match the
        review's independent arithmetic to 0.01 bit; otherwise leave
        NOT_YET_ASSESSED / absent and document the gap.
      rows_hint:
        - ECC2K-130  # hand-seed from KN-LIT-661e97
        - FIPS_K_B_ten  # ten FIPS curves from audit dump
        - sect193r1
        - sect193r2
        - sect239k1
        - sect131r1
        - sect131r2
        - c2pnb176v1
        - c2pnb208w1
        - c2pnb272w1
        - c2pnb304w1
        - c2pnb368w1
      columns_hint:
        - matched_rho
        - GHS_cover
        - subfield_rational_base
        - phi_stable_subspace_base
        - decomposition_m2
        - decomposition_m3
        - decomposition_m4
        - decomposition_m5
        - decomposition_m6
        - decomposition_m7
        - decomposition_m8
        - QSP
        - descent
      must_seed_if_rederived:
        - matched_rho on listed rows (CORR-20260922-81aeab convention)
        - GHS_cover STRUCTURALLY_EMPTY on prime-degree rows
        - subfield_rational_base STRUCTURALLY_EMPTY / OPEN as re-derived
        - phi_stable_subspace_base STRUCTURALLY_EMPTY on prime-degree rows
        - ECC2K-130 decomposition floor_bits/budget_bits for m in 2..8
      forbidden_seed_sources:
        - unrepaired IDEA-20260922-77bf31 COMPUTED g/B prose

  controls:
    - name: valid_table_pass
      object: Case 1 — unmutated seeded shards must PASS.
    - name: false_positive_unrelated_record
      object: Case 6 — unrelated new IDEA-* in scratch ledger must PASS.
    - name: scratch_copy_discipline
      object: All mutation cases apply to copies only; live tree untouched.
    - name: transcription_fidelity
      object: >-
        Seeded numbers vs independent re-derivation (review arithmetic /
        CORR-20260922-81aeab / KN-LIT-661e97) within 0.01 bit where
        applicable; human/Coordinator review of fidelity report before
        treating battery as decisive.
    - name: write_once_layout
      object: No committed generated aggregate; cell files write-once.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none. This
        experiment uses none.
    - name: no_break_guard
      object: No break / attack-cost claim in any artifact.

  independent_variables:
    - stage  # 0 | 1 | 2 | 3
    - battery_case  # 1..6
    - curve_row
    - method_column
    - mutation_kind  # none | cert_byteflip | missing_input | supersede | bad_vocab | unrelated
    - seed

  metrics:
    primary:
      - battery_pass_count_out_of_6
      - per_case_pass_fail_with_named_cell_and_pointer
      - transcription_fidelity_fraction
      - schema_unmutated_pass
      - generated_view_gitignored
      - write_once_layout_pass
    secondary:
      - open_cell_liveness_hit_rate_on_planted_examples
      - validator_wall_s
      - peak_rss_bytes
      - cells_seeded_count
      - cells_not_yet_assessed_or_absent_count
      - termination_reason
      - certificate_kind_none_rate

  heuristic_under_test:
    - HEUR-BINSTD-0514c3-H0
    - HEUR-BINSTD-0514c3-H1

  preregistered_prediction:
    quantity: >-
      (A) Unmutated seeded shards validate (schema_unmutated_pass=true);
      (B) battery_pass_count_out_of_6 = 6 with named cell/pointer on each
      failure case;
      (C) transcription_fidelity_fraction = 1.0 on seeded re-derived cells;
      (D) generated view is gitignored and rebuildable;
      (E) NO break / curve-cost claim under any outcome.
    formula: >-
      For each of 6 named cases, expected pass/fail as in procedure.stage3;
      fidelity |bits_seeded - bits_rederived| <= 0.01 when comparable.
    source: >-
      IDEA-20260922-6028ed Stage 3; HOLD-F concrete_experiment; H-BINSTD-0514c3
    claim_tier: observational
    measured_vs_modeled: >-
      Battery outcomes are MEASURED (validator exit codes / named
      failures). Seeded floor_bits/budget_bits are TRANSCRIBED from
      re-derived arithmetic (labeled transcribed) with a separate
      RECOMPUTED comparator column in the fidelity report. No modeled
      attack-cost column is produced by this experiment.

  scale_relevance:
    tier: infrastructure_full_population_schema
    justification: >-
      Schema and validator target the full RQ population (~30 rows × ~6–13
      columns). Seeded content is a small explicit subset. No transfer of
      an attack cost is claimed; transfer of the LAYOUT to future producers
      is by schema contract, not extrapolation of a measured exponent.
    correspondence: null

  sample_size_justification: >-
    Six deterministic battery cases enumerate the named Sigma_ledger
    operations + valid + false-positive controls (exhaustive for the named
    set, not a statistical sample). Seed cell count is whatever the
    re-derived set admits; expected tens of cells, not ~180.

  tail_checks:
    - Any single battery case fail is a hard fail (not averaged).
    - Any seeded cell without unit is a hard fail (HOLD-F).
    - Any seeded number off by >0.01 bit from re-derivation is a hard fail.
    - Presence of a committed generated aggregate is a hard fail of H1.

  replication:
    seeds:
      - 20260922
      - 20261001
    independent_instances: >-
      Stages 0–3 are deterministic given the seed shards and scratch
      mutations. Seeds reserved for any planted OPEN-liveness examples.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 12
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when schema module skeleton, gitignore entry, and
      methodological-note.md exist.
    - >-
      Stage 1 complete when seed-policy.yaml and seeded cell shards exist
      with fidelity-report.yaml drafted.
    - >-
      Stage 2 complete when validate_reachability_table.py implements the
      four checks and can emit the generated view to a gitignored path.
    - >-
      Stage 3 complete when battery-report.yaml records all six cases with
      pass/fail, named cell/pointer on failures, wall_s, peak_rss_bytes.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - Hard stop if Stage 1 attempts to seed from forbidden_seed_sources.

  invalidation_rules:
    - Battery case missing or without named failure detail when fail expected
    - Live ledger or live audit artifact mutated by a battery case
    - Generated view committed to git
    - COMPUTED cell seeded from unrepaired 77bf31 prose
    - Run manifest certificate.kind outside {discrete_log, decomposition, key_recovery, none}
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Claiming retrieved provenance without verified_by / without reading
    - Filing a break or curve attack-cost claim
    - CI workflow edited without a separate Coordinator decision after 6/6

  success_criterion: >-
    Stage 0–2 deliverables present; Stage 3 battery_pass_count_out_of_6=6;
    schema_unmutated_pass=true; transcription_fidelity_fraction=1.0 on
    seeded cells; write_once_layout_pass=true; generated_view_gitignored=true;
    every run manifest certificate.kind=none. Success does NOT include CI
    merge or any cryptanalytic claim.

  falsification_criterion: >-
    Battery <6/6; unmutated seed fails validator; fidelity gap >0.01 bit;
    layout still requires shared mutable aggregate. Distinguish
    infrastructure via invalidation_rules / DO-5.

  required_artifacts:
    - experiments/EXP-BINSTD-f9a860/stage0/methodological-note.md
    - experiments/EXP-BINSTD-f9a860/stage0/schema-outline.yaml
    - experiments/EXP-BINSTD-f9a860/stage1/seed-policy.yaml
    - experiments/EXP-BINSTD-f9a860/stage1/fidelity-report.yaml
    - experiments/EXP-BINSTD-f9a860/stage2/validator-smoke.yaml
    - experiments/EXP-BINSTD-f9a860/stage3/battery-report.yaml
    - tools/validate_reachability_table.py
    - analysis/binstd-curve-audit/reachability/
    - experiments/EXP-BINSTD-f9a860/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-f9a860/runs/*/raw-result.json
    - experiments/EXP-BINSTD-f9a860/runs/*/stdout.log
  required_artifacts_note: >-
    Gitignore change for the generated view is required under Stage 0
    (path documented in methodological-note.md). Cell shard paths under
    analysis/binstd-curve-audit/reachability/ are produced in Stage 1.
    Optional planted liveness examples under stage3/ are allowed.

  procedure:
    stage0:
      - >-
        Write schema-outline.yaml documenting HOLD-F fields and verdict
        enum including NOT_YET_ASSESSED.
      - >-
        Scaffold tools/validate_reachability_table.py (check_* style);
        do not yet require a green battery.
      - >-
        Add gitignore for
        analysis/binstd-curve-audit/reachability_table.generated.yaml.
      - >-
        Write methodological-note.md (HOLD-F corrections; no-break;
        certificate.kind none; CI not in this EXP).
    stage1:
      - Confirm stage0/ exists.
      - >-
        Hand-seed ECC2K-130 row parameters from KN-LIT-661e97; pin
        rho_convention CORR-20260922-81aeab on matched_rho cells.
      - >-
        Seed only re-derived cells as write-once YAML shards; write
        seed-policy.yaml listing every seeded path and its source.
      - >-
        Write fidelity-report.yaml comparing seeded numbers to re-derived
        references (recomputed column separate from transcribed).
    stage2:
      - Confirm stage1/ exists.
      - Implement schema / hash / supersession / liveness checks.
      - Emit generated view to the gitignored path; record smoke result.
    stage3:
      - Confirm stage2/ exists.
      - >-
        Case 1 valid: expect PASS.
        Case 2 one-byte certificate flip on scratch copy: expect FAIL naming cell.
        Case 3 missing input record_id: expect FAIL naming cell+id.
        Case 4 synthetic supersession in scratch ledger: expect FAIL naming cell+id.
        Case 5 bad missing_quantity vocab: expect FAIL (schema).
        Case 6 unrelated new IDEA in scratch: expect PASS.
      - Write battery-report.yaml; every run manifest certificate.kind none.

  optimistic_assumptions_disclosed:
    - >-
      Assuming string-exact missing_quantity matching catches all future
      closeable OPEN cells is optimistic; liveness is informational only.
    - >-
      Scratch-copy battery does not prove behaviour under real concurrent
      git races (disclosed out of scope).
    - >-
      Schema sufficiency for scientific content is NOT assumed — only
      pointer consistency.

  memory_accounting: >-
    Dominant structures: O(cells) YAML records and hash buffers. Measure
    peak_rss_bytes on Stage 2 smoke and Stage 3 battery; reconcile against
    analytic O(cells × record_bytes) in battery-report.yaml.

  assigned_to: executor
  dominated_by: >-
    n/a for attack cost. Tooling carrier; sota_delta is checkability.
  sota_delta:
    time: Zero cryptanalytic movement; enables automatic staleness detection.
    memory: Unaffected for attacks.
    data_queries: N/A.
