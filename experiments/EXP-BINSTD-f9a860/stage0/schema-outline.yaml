# EXP-BINSTD-f9a860 Stage 0 — HOLD-F cell schema outline
# Frozen by specification.yaml; observations only. No break / attack-cost claim.
schema:
  experiment_id: EXP-BINSTD-f9a860
  stage: 0
  layout: >-
    analysis/binstd-curve-audit/reachability/<curve_row>/<method_column>.yaml
    — one write-once shard per cell; corrections set superseded_by to a new path.
  generated_view: analysis/binstd-curve-audit/reachability_table.generated.yaml
  generated_view_policy: gitignored_rebuildable

  required_fields:
    - curve_row
    - method_column
    - verdict
    - unit
    - m
    - floor_bits
    - budget_bits
    - formula
    - N_used
    - rho_convention
    - provenance_tier
    - certificate
    - inputs
    - missing_quantity
    - superseded_by
    - recorded_at
    - seed_source

  verdict_enum:
    - STRUCTURALLY_EMPTY
    - COMPUTED
    - OPEN
    - NOT_YET_ASSESSED

  unit_enum:
    - group_ops_rho_bits
    - field_ops
    - sat_conflicts
    - wall_clock
    - bits
    - none

  provenance_tier_enum:
    - proposal_arithmetic
    - analysis
    - evidence

  rho_convention_required_when: method_column == matched_rho
  rho_convention_value: CORR-20260922-81aeab

  certificate_shape:
    required_when: verdict == STRUCTURALLY_EMPTY
    fields: [artifact_path, sha256, assertion]
  inputs_shape:
    required_when: verdict == COMPUTED
    fields: [record_id, kind]
  missing_quantity_shape:
    required_when: verdict == OPEN
    controlled_vocabulary:
      - covering_genus_g_H
      - factor_base_size_B
      - oracle_cost_per_attempt
      - decomposition_floor_bits
      - lattice_rounding_cost
      - matched_rho_bits
      - qsp_attempt_bound
      - descent_degree_bound
      - other_named_quantity

  decomposition_columns:
    - decomposition_m2
    - decomposition_m3
    - decomposition_m4
    - decomposition_m5
    - decomposition_m6
    - decomposition_m7
    - decomposition_m8

  method_columns:
    - matched_rho
    - GHS_cover
    - subfield_rational_base
    - phi_stable_subspace_base
    - decomposition_m2
    - decomposition_m3
    - decomposition_m4
    - decomposition_m5
    - decomposition_m6
    - decomposition_m7
    - decomposition_m8
    - QSP
    - descent

  floor_formula: >-
    For ECC2K-130 decomposition cells: continuous argmin_l of
    m! * 2^(N-(m-1)l) + m * 2^(2l) with N=131; floor_bits = log2 of that
    minimum (real-valued l). budget_bits = R - floor_bits with R=60.81
    under CORR-20260922-81aeab; null when budget_bits < 0 (recorded as none).

  seed_policy_preference: >-
    ABSENT = not yet assessed preferred over inventing NOT_YET_ASSESSED
    shards for the full ~180-cell grid (documented in stage1/seed-policy.yaml).

  certificate_kind_run_manifests: none
  no_break_guard: true
