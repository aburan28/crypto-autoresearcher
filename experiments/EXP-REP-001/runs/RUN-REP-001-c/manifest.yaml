run:
  id: RUN-REP-001-c
  experiment_id: EXP-REP-001
  command: "sage experiments/EXP-REP-001/rep_model_dreg.sage"
  git_commit: "2a38b41a8478e9dd191273c51275bfa14390febb"
  dirty_tree: true   # executor script added after the protocol commit; recorded here
  environment:
    sage_version: "SageMath version 10.9, Release Date: 2026-05-04"
    platform: "Darwin 24.6.0 arm64"
  parameters:
    p: 65537            # next_prime(2^16)
    m: 2
    factor_base_degrees: [4, 6, 8, 12, 16]
    seeds: [1, 2, 3]
    arms: [W_semaev, W_native_x, ED_x, ED_y, random_null]
  artifacts:
    raw_results: runs/RUN-REP-001-c/raw.json
    stderr_log: runs/RUN-REP-001-c/stderr.txt
  validity_status: valid
  validity_reason: >-
    All arms 0-dimensional (dim=0), planted decomposition verified as a root
    (planted_root=True) for every (arm,d); GB completed well under budget; results
    identical across 3 seeds. Supersedes RUN-REP-001-a (strawman Weierstrass,
    y-membership only) and RUN-REP-001-b (JSON serialization bug, data valid but
    no fair Semaev baseline).
  superseded_runs: [RUN-REP-001-a, RUN-REP-001-b]
