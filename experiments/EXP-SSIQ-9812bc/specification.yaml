# =============================================================================
# EXP-SSIQ-9812bc — version 1, approved. Specified from
# IDEA-20261006-592877 / H-SSIQ-c82b7d. GOAL-SSIQ-001 does not state an
# approval-queue cap. portfolio_kpis.py --capacity GOAL-SSIQ-001 reported
# approved_unrun=0 and headroom=3. Success is the source idea's
# prediction: m(E_A) - m(E_N) >= 4, and that gap is at least the
# absolute difference of the affine counts. The concrete negative is
# that the instrument checks pass and the gap is at most 3. This
# session did not compute the fibers. Source idea bytes are blob
# 39cd8bf5faa3e508cf53a6e0ad2d85f02253bc17.
# =============================================================================
experiment:
  id: EXP-SSIQ-9812bc
  hypothesis_id: H-SSIQ-c82b7d
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea: IDEA-20261006-592877
  version: 1
  title: >-
    Max fiber of the z-coefficient of y on y^2 = x^3 + x over F_361
  status: approved
  approved_by: coordinator
  designed_at: '2026-10-07'
  approved_at: '2026-10-07'
  frozen: true
  execution_authorized: true
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261007-3e731d
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only on y^2 = x^3 + x and y^2 = x^3 + 2x + 3 over F_19,
      affine points over F_361 = F_19[z]/(z^2 - 2). Score the max
      fiber of y1 on each curve. Do not search for a discrete
      logarithm and do not add a prime to the claim.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: true

  objective: >-
    Decide whether m(E_A) - m(E_N) is at least 4 and at least as large
    as the absolute difference of the affine counts. The concrete
    negative is that the instrument checks pass and the difference is
    at most 3. No faster isogeny algorithm is in scope.

  inputs:
    curve_a: >-
      A=1, B=0, model y^2 = x^3 + x over F_19. The discriminant
      residue 4A^3+27B^2 mod 19 is 4. A zero residue is instrument
      failure.
    curve_n: >-
      A=2, B=3, model y^2 = x^3 + 2x + 3 over F_19. The source idea
      records the residue 9. The driver recomputes it. A zero residue
      is instrument failure.
    extension: >-
      F_361 = F_19[z] modulo z^2 - 2. The driver checks that 2 is not
      a square in F_19. Affine points are pairs (x, y) with y^2 equal
      to the right-hand side. The point at infinity is omitted.
    coordinate: >-
      y = y0 + y1 z with y0, y1 in F_19. m(E) is the largest count of
      affine points with a given y1. The gap is m(E_A) minus m(E_N).
    driver: >-
      experiments/EXP-SSIQ-9812bc/implementation/run.py enumerates
      every affine point by testing squares. The checker is
      experiments/EXP-SSIQ-9812bc/implementation/check.py. The
      histogram is not replaced by a trace formula.

  controls:
    - id: rectangle
      statement: >-
        Every y in F_361 has a y1 fiber of size exactly 19. Any other
        size voids the run.
    - id: sign-flip
      statement: >-
        For every affine point of each curve, y1 of the 19-power
        Frobenius equals -y1. One failure voids that arm.
    - id: nonsingular
      statement: Both discriminant residues modulo 19 are nonzero.
    - id: irreducible-basis
      statement: 2 is not a square in F_19.
    - id: sample-size
      statement: >-
        If the gap is at least 4 and strictly smaller than the
        absolute difference of the affine counts, the row is
        sample_size_explains_gap. That row is not success and is not
        the negative.

  independent_variables:
    - which of the two frozen equations is histogrammed
    - the value c in F_19 that labels a fiber of y1

  metrics:
    primary:
      - id: gap
        statement: >-
          m(E_A) minus m(E_N). The idea's prediction is a difference
          of at least 4, and success also requires that difference to
          be at least the absolute difference of the affine counts.
          The concrete negative is a difference of at most 3 with the
          instrument checks passed.
    secondary:
      - id: m_a
        statement: the maximum fiber of y1 on E_A
      - id: m_n
        statement: the maximum fiber of y1 on E_N
      - id: n_a
        statement: the affine point count of E_A, recorded and not predicted
      - id: n_n
        statement: the affine point count of E_N, recorded and not predicted
      - id: sign_flip_failures
        statement: the number of affine points that fail y1(pi(P)) = -y1(P)

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the claim that the maximum y1 bin on E_A exceeds the
    maximum y1 bin on E_N by at least 4. The second scale in the
    source idea, p = 31, is not part of this contract.

  preregistered_prediction:
    quantity: >-
      The difference of the maximum y1 fibers of the affine points of
      y^2 = x^3 + x and y^2 = x^3 + 2x + 3 over F_361.
    formula: >-
      m(E_A) - m(E_N) >= 4, and that difference is at least the
      absolute difference of the affine counts. The concrete negative
      is m(E_A) - m(E_N) <= 3 with the instrument checks passed. A
      gap of at least 4 that is smaller than the absolute count
      difference is a third row, sample_size_explains_gap, and is not
      either sentence. Source idea IDEA-20261006-592877. The fibers
      were not computed before this formula was written.
    source: >-
      IDEA-20261006-592877. KR-RHO-13bf67, KR-RHO-5b1c0a,
      KR-RHO-037e22, KR-IC-b0fcda, and KR-IC-46d822 were opened in
      this session and do not state this fiber gap.

  scale_relevance:
    tier: toy
    justification: >-
      F_361 is below a cryptographic field. No transfer to a larger
      prime is assumed. The sample is these two equations. The
      minimum effect is the idea's own gap of 4.
    correspondence: >-
      Direct enumeration of affine points. No Deuring correspondence
      is used.

  tail_checks:
    - >-
      A gap of at least 4 meets the prediction only when it is also
      at least the absolute difference of the affine counts. A gap of
      at most 3 is the negative. No third threshold is introduced
      after the histograms are seen.
    - >-
      The full histograms are written into the artifact. A single bin
      other than the maximum does not choose the reading row.

  replication:
    seeds:
      - EXP-SSIQ-9812bc|claim|deterministic
    independent_instances: 1
    future_run_slot: RUN-SSIQ-ee5cdb
    note: >-
      The enumeration is deterministic. The replication plan names
      one future run slot, RUN-SSIQ-ee5cdb, which the trial plan
      binds and this session does not launch. The rectangle and the
      sign-flip check are the replication of the instrument.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One manifest covers both curves and the rectangle. The 1 GB
      figure is machine protection for the point lists. A watchdog
      expiry is failed_infrastructure, not a value of the gap.

  stopping_rules:
    - Stop after one reading row is named.
    - Do not change either equation and do not replace the threshold 4 after seeing the gap.
    - Do not let a non-maximum bin choose the row.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A zero discriminant, a reducible basis, a rectangle fiber other than 19, or a failed sign flip voids the run.
    - Scoring any curve other than the two frozen curves voids the run.
    - Replacing the histogram by a trace formula voids the run.

  success_criterion: >-
    The instrument checks pass, m(E_A) - m(E_N) is at least 4, and
    that difference is at least the absolute difference of the affine
    counts. This is the prediction of IDEA-20261006-592877 together
    with the source idea's sample-size confounder. It is reachable as
    a failure when the instrument checks pass and the difference is
    at most 3.

  falsification_criterion: >-
    The instrument checks pass and m(E_A) - m(E_N) is at most 3,
    including a tie and a negative difference. A calibration failure
    and a timeout are not this negative. A gap of at least 4 that is
    smaller than the absolute count difference is not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that these two equations at
      p = 19 have a y1 fiber gap of at least 4 that is not explained
      by the difference of the affine counts. The conditional exponent
      stays 1/3 and the generic exponent stays 1/2. No knowledge
      entry is promoted from this design record.
    on_negative: >-
      A later evidence review may record that these two equations at
      p = 19 have a y1 fiber gap of at most 3, so the predicted bias
      fails on this scope only. The conditional exponent stays 1/3
      and the generic exponent stays 1/2. The two outcomes name
      different inequalities.

  required_artifacts:
    - experiments/EXP-SSIQ-9812bc/runs/RUN-SSIQ-ee5cdb/manifest.yaml
    - experiments/EXP-SSIQ-9812bc/runs/RUN-SSIQ-ee5cdb/raw-result.json
    - experiments/EXP-SSIQ-9812bc/runs/RUN-SSIQ-ee5cdb/reading.yaml

  assigned_to: executor
