experiment:
  id: EXP-SCURVE-3f87f6
  hypothesis_id: null
  hypothesis_id_note: >-
    GOAL-SCURVE-137bd9 HAS NO HYPOTHESIS AND THIS CONTRACT CREATES NONE.
    Retrieving criterion definitions and certifying arithmetic facts about a
    published parameter set are not hypothesis-testing acts about a
    mathematical object; naming a hypothesis here would invite exactly the
    inference this work cannot support. Recorded per DEC-20260904-c42007
    hypothesis_status_transition.
  version: 1
  status: draft
  status_note: >-
    DRAFT, NOT APPROVED. approved_by is null and stays null until a separate
    committed Coordinator decision approves this contract.
    DEC-20260904-c42007 approved OPENING BATCH-a40709 and states in
    what_is_NOT_approved that it approves NO experiment contract and NO run.
    NO RUN IS AUTHORIZED BY THIS FILE.
  goal_id: GOAL-SCURVE-137bd9
  question_id: RQ-SCURVE-960dbd
  batch_id: BATCH-a40709
  authored_by_task: TASK-20260904-f0a889
  title: >-
    Frozen measurement contract for BATCH-a40709: retrieval gate L0, the basic
    parameter lanes, the near-free lane block, one cost-formula evaluation, and
    one gated comparison, for the curve labelled NIST P-224

  objective: >-
    FIX WHAT THIS BATCH WILL MEASURE, WHAT WOULD INVALIDATE A MEASUREMENT, AND
    WHAT ARTIFACT EACH LANE MUST LEAVE BEHIND -- BEFORE ANY MEASUREMENT EXISTS
    TO BE FITTED TO. The contract covers the in-scope lanes named in
    coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml
    in_scope_lanes ranks 1 through 6 (L0; L-EQ, L-FIELD, L-BASE; L-LADDER,
    L-COMPLETE, L-IND, D3, D6; L-RHO) plus the single gated comparison step.
    It re-scopes nothing, re-ranks nothing, and admits no item listed in that
    file's out_of_scope block.
    WHY TWO TEMPLATE BUDGET FLOORS ARE NOT MET, STATED HERE AS THE TEMPLATE
    REQUIRES. The per-run wall-clock ceiling of 600 s is met or exceeded by
    every producer slot except S9 (600 s exactly, a plan-authoring slot that
    runs no computation). The 8 GB memory floor is NOT met: the committed batch
    design fixes 2 GB for every slot except S5 at 4 GB, and max_concurrent 2
    gives a declared peak of 6 GB. The work is pure-Python integer arithmetic on
    integers of a few hundred bits plus a same-shape null family at ONE reduced
    field size; the ceilings come from the committed batch design and are
    ceilings fixed before acquisition, NOT measurements of anything. No run has
    occurred under this goal and none is authorized here.

  claim_ceiling: >-
    analyzed AT BEST, NEVER supported, for every record this contract governs.
    NO STATEMENT THAT ANY CURVE IS SAFE OR UNSAFE IS PERMITTED FROM ANY SLOT.
    Arithmetic verification of a published parameter set is a TRANSCRIPTION
    CHECK, not a security evaluation. No asymptotic-complexity claim is
    proposed, so the four promotion gates in agents/coordinator.md are NOT
    ENGAGED and are certainly not met. Every conclusion is scoped to the curve
    labelled NIST P-224, to the parameters in the committed capsule, to
    pure-Python arithmetic, to this runtime and to the declared budget, and
    transfers to no other curve without re-running.

  parameter_handling_rule: >-
    THIS CONTRACT RESTATES NO PARAMETER VALUE, NO PRIOR VERDICT, NO MARGINAL,
    NO COUNT AND NO EXPECTED VALUE FOR THE AUDITED CURVE, AND THAT IS
    DELIBERATE. Every measurement slot reads its parameters from the committed
    capsule at the path in inputs and records that file's sha256; every quantity
    a slot reports is one its own code computed in that run. A contract that
    carried the answers would be handing a measurement task its result.

  inputs:
    parameter_capsule: >-
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-53ecc0/parameter-capsule.yaml
    audit_plan: >-
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-53ecc0/audit-plan.yaml
    parent_task_report: >-
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-53ecc0/task-report.yaml
    batch_design: coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml
    opening_decision: ledger/decisions/DEC-20260904-c42007.yaml
    capability_finding: coordination/remediation/FINDING-20260904-scurve-execution-capability.md
    goal_head: ledger/goals/GOAL-SCURVE-137bd9/goal.yaml
    parent_archive_binding: >-
      The three BATCH-ef5b1e producer artifacts above are bound by the snapshot
      archive TASK-20260824-4af491 at commit
      5c3bfe273070e0537a21ae5491fb028b7e5efa1e, recorded content-verified in the
      goal head's latest_verified_commit_note. THIS SESSION DID NOT VERIFY THAT
      BINDING: it has no command-execution tool and ran no git command. The
      statement is a citation of the goal head, not a measurement.
    capsule_sha256: null
    capsule_sha256_note: >-
      NULL BY CAPABILITY, NOT BY OMISSION. This session cannot compute a digest.
      Each measurement slot records the sha256 of the capsule IT read, which is
      the binding that matters for reproducibility, and the S4 snapshot receipt
      binds the sealed producer outputs.

  independent_variables: []
  independent_variables_note: >-
    NONE. This is a certification and retrieval protocol against one fixed
    published parameter set, not a parameter sweep. The only varying axis is the
    control bank (positive controls, parameter-matched negatives, same-shape
    nulls), which is declared under controls rather than as an experimental
    factor.

  # =====================================================================
  # METRICS -- per lane, defined as WHAT IS COMPUTED, never as an expected
  # value. Ordering matters: no metric in this block may be compared against
  # any threshold or intake cell except inside the single gated comparison.
  # =====================================================================
  metrics:
    primary:
    - lane: L0
      rank: 1
      owning_slot: S2
      quantities:
      - count of the ten named L0 retrieval targets that returned a stored page,
        each with URL, fetch timestamp, retrieved byte length and sha256
      - count of the eleven criterion thresholds transcribed WITH a direct
        quotation, each naming the stored page it was quoted from
      - per-threshold retrieval provenance entries
      - per-target retrieval-log entries with HTTP status and attempt time for
        every attempt and every failure
      units: counts of retrieved artifacts and quoted thresholds; no arithmetic
      not_a_metric: >-
        No threshold value is a metric of this experiment. A threshold is
        RETRIEVED TEXT. A threshold that cannot be retrieved stays UNRETRIEVED;
        no recalled threshold may enter any record under any circumstances.
    - lane: L-EQ
      rank: 2
      owning_slot: S3
      quantities:
      - the exact integer relation, computed in-run, between the intake decimal
        for the curve's constant coefficient and the retrieved hexadecimal
      - the exact integer relation, computed in-run, between the linear
        coefficient and the field prime
      - the nonsingularity witness value, computed in-run and reported as the
        value itself rather than as a boolean
      - the j-invariant, computed in-run and reported as an exact residue
      units: exact integers and exact residues
    - lane: L-FIELD
      rank: 3
      owning_slot: S3
      quantities:
      - the field prime evaluated as an exact identity against its closed form,
        reported as the computed comparison
      - the bit length, computed
      - the residues that later lanes consume, each computed and named
      - probable primality WITH its round count and its witness list
      units: exact integers, bit counts, residues, round counts
      reporting_rule: >-
        PROBABLE PRIME WITH ROUND COUNT AND WITNESS LIST, NEVER PRIME. A
        primality certificate is OPEN AND UNATTEMPTED and out of scope
        (batch.yaml out_of_scope OOS-2).
    - lane: L-BASE
      rank: 4
      owning_slot: S3
      quantities:
      - the on-curve evaluation for the base point, reported as the computed
        two-sided residue comparison
      - the order of the base point established by the two-sided check
        batch.yaml names, with both sides reported
      - the Hasse-interval uniqueness argument WRITTEN OUT, including the
        interval endpoints as computed and the count of multiples of the order
        inside it
      - the DERIVED group order and the DERIVED cofactor
      - the trace, with the Hasse inequality checked and both sides reported
      units: exact integers and exact residues
      load_bearing_step: >-
        The uniqueness argument. It is the step that makes the group order
        certifiable without point counting, and it silently fails outside the
        regime it assumes; the conditions under which it fails must be written
        out, not asserted.
    - lane: L-LADDER
      rank: 5
      owning_slot: S5
      quantities:
      - route (i): the parity predicate on the certified group order, with the
          Lagrange step written out
      - route (ii): the independent polynomial-gcd route to the same fact
      - an explicit statement of whether the two routes agree
      units: exact predicates, each with the computation that produced it
      two_route_requirement: >-
        TWO INDEPENDENT ROUTES ARE REQUIRED because the fact at issue is a
        negative one and a single buggy route produces a negative for free.
    - lane: L-COMPLETE
      rank: 5
      owning_slot: S5
      quantities:
      - the certified residues named in batch.yaml for this lane, each computed
        from the certified group order
      - the Lagrange argument written out
      units: exact residues
    - lane: L-IND
      rank: 5
      owning_slot: S5
      quantities:
      - two independently certified residues, EACH DERIVED SEPARATELY, with the
        derivation of each recorded
      - an explicit statement that neither residue was derived from the other
      units: exact residues
      independence_requirement: >-
        The two residues are independent inputs to two different recalled
        preconditions. Deriving one from the other collapses the lane to one
        measurement wearing two names.
    - lane: D3
      rank: 5
      owning_slot: S5
      quantities:
      - the j-invariant as computed in this lane
      - the automorphism count as determined from it
      - the discounted cost as evaluated
      units: exact residue, integer count, cost figure with rounding stated
      mandatory_disclosure: >-
        D3'S DISCOUNTED COST IS A CONSTANT-FACTOR DIAGNOSTIC THAT CAN NEVER MOVE
        AN EXPONENT, and it is disclosed as such wherever it appears. Under the
        program's exponent-first bias it is a LOW-VALUE diagnostic, included
        because the goal declares it.
    - lane: D6
      rank: 5
      owning_slot: S5
      quantities:
      - the three gcds against the certified group order that batch.yaml names
      - the count of reachable non-Weierstrass models over the base field, as
        computed from those gcds
      - the symbolic exceptional set of each named Weierstrass coordinate
        conversion, derived symbolically rather than asserted
      units: gcds, a count, and symbolic zero sets
      scope: >-
        Reachability over the base field ONLY. Models over an extension field
        are not tested, and the exceptional-set enumeration covers the named
        standard conversions, not every conversion anyone could write.
    - lane: L-RHO
      rank: 6
      owning_slot: S5
      quantities:
      - one cost-formula evaluation at the certified order, reported as an exact
        integer AND as a log2 figure with its rounding stated
      - the formula used, with its cited source
      units: group operations under the model's own unit
      mandatory_disclosure: >-
        NO SOLVER IS RUN. Every idealisation of the cost model is listed
        explicitly -- unit-cost group operations, no memory or communication
        cost, no cross-target amortisation, no quantum adversary. A number from
        a formula is not evidence about how long any real attack takes.
    - lane: COMPARISON
      rank: gated
      owning_slot: S7
      quantities:
      - per-cell disposition for every one of the eleven criterion cells:
          adjudicated, or OPEN AND UNATTEMPTED with the reason stated as either no
          retrieved definition or no certified measurement
      - for each adjudicated cell, the retrieved threshold quoted verbatim
        beside the certified measurement, with the sealed sha256 of both
      - the list of cells where the RETRIEVED definition differs from the
        RECALLED definition the lane was drafted against, present and explicitly
        empty rather than absent if nothing differs
      units: dispositions, quotations and hash citations
    secondary:
    - per-slot capability outcome (network, arbitrary-precision arithmetic,
      command execution) as declared and as observed
    - per-slot knowledge-retrieval attempt: the query strings issued and the
        outcomes, recorded verbatim
    - per-slot wall-clock consumed against the declared ceiling
    - every value left null, with its reason

  # =====================================================================
  # CONTROLS -- hard gates, run on the identical code path BEFORE any target
  # output from the lane they guard is interpreted.
  # =====================================================================
  controls:
  - id: CTRL-CONSTRUCTED-COMPOSITE
    kind: constructed positive control
    guards: [L-FIELD, L-BASE]
    owning_slot: S3
    construction: >-
      an integer composite BY CONSTRUCTION of the same bit length as the field
      prime, formed as a product of two generated primes, so that no primality
      oracle is trusted
    must_do: the probable-primality checker MUST REJECT it
    if_it_does_not_fire: VOIDS the lanes it guards; report that as the finding it is
  - id: CTRL-CONSTRUCTED-SINGULAR
    kind: constructed positive control
    guards: [L-EQ]
    owning_slot: S3
    construction: a singular curve constructed over the same field prime
    must_do: the nonsingularity check MUST REJECT it
    if_it_does_not_fire: VOIDS the lane it guards
  - id: CTRL-CONSTRUCTED-RANDOMPOINT
    kind: constructed null control
    guards: [L-BASE]
    owning_slot: S3
    construction: a random coordinate pair over the same field prime
    must_do: >-
      the on-curve check MUST ACCEPT it only if it is on the curve; a checker
      that accepts a random pair has no resolving power
    if_it_does_not_fire: VOIDS the lane it guards
  - id: CTRL-RETRIEVED-POSITIVES
    kind: retrieved positive controls
    guards: [L-LADDER, L-COMPLETE, L-IND, D3, D6]
    owning_slot: S5
    depends_on_slot: S2 (control-curve capsule with per-field provenance)
    construction: >-
      the Montgomery-model positive-control curve, the Edwards-model
      positive-control curve and the D3 positive-control curve that batch.yaml
      names, each retrieved by S2 with per-field provenance and two-source
      agreement where obtainable
    must_do: >-
      each positive control must be EXHIBITED ON THE IDENTICAL CODE PATH,
      producing the model or the count it is a positive control for
    if_it_does_not_fire: >-
      the lane it guards produces NO INTERPRETABLE OUTPUT and says so. Without a
      firing positive control, an absence is indistinguishable from a checker
      that always reports absence.
  - id: CTRL-NEG-PARAMETER-MATCHED
    kind: parameter-matched negatives
    guards: [L-EQ, L-FIELD, L-BASE, L-LADDER, L-COMPLETE, L-IND, D3, D6, L-RHO]
    owning_slots: [S3, S5]
    construction: >-
      the two parameter-matched negative curves batch.yaml names, retrieved by
      S2, matched on generation family and coefficient convention and NOT
      matched on field size
    must_do: >-
      run on the identical code path; every matching assumption is stated, and a
      lane whose output depends on field size says so rather than treating the
      negatives as exchangeable
  - id: CTRL-NULL-SAME-SHAPE
    kind: same-shape null family
    guards: [L-LADDER, L-COMPLETE, L-IND, D6]
    owning_slot: S5
    construction: >-
      the same-shape null family at ONE reduced field size, preserving the
      coefficient convention and the model, removing the generation transcript
    must_report: its field size, its sample count, and its measured reachability rates
    hard_gate: >-
      A CHECKER THAT REPORTS ZERO PERCENT REACHABILITY ON THE NULL IS BROKEN AND
      VOIDS THE LANES THAT DEPEND ON IT. That outcome is reported as the finding
      it is, not smoothed over.
    scope_limit: >-
      SINGLE-SCALE ONLY. This contract admits reachability-rate nulls at one
      reduced field size and does NOT use them to place any statistic about the
      audited curve in a distribution. The three-field-size null-distribution
      study that would produce a drift error bar is OPEN AND UNATTEMPTED
      (batch.yaml out_of_scope OOS-8).
  - id: CTRL-COST-CALIBRATION
    kind: declared-absent positive control
    guards: [L-RHO]
    owning_slot: S5
    status: NOT REQUIRED BY THIS CONTRACT AND DECLARED ABSENT RATHER THAN OMITTED
    reason: >-
      The honest positive control for a cost formula is a regime where the true
      cost is independently known, which requires running a solver. NO SOLVER IS
      RUN in this batch. L-RHO therefore reports the formula value WITH NO
      CALIBRATION and states that plainly; it is one formula evaluation and
      claims nothing about any real attack.
  control_ordering_rule: >-
    CONTROLS ARE HARD GATES AND RUN FIRST. For every lane, the guarding controls
    run on the IDENTICAL code path and their outcomes are recorded BEFORE any
    target output from that lane is interpreted or recorded as a reproduction.
    A lane whose positive control did not fire produces no interpretable output
    (AGENTS.md instrument-failure rule). A FAILED CONTROL IS A COMPLETE AND
    VALUABLE OUTCOME, not a batch failure.
  control_cost_honesty: >-
    NEAR-FREE APPLIES TO THE TARGET, NOT TO THE CONTROLS. The arithmetic on the
    audited curve is negligible; the retrieved controls and the null family are
    the real spend and are budgeted as such.

  # =====================================================================
  # PREREGISTRATION
  # =====================================================================
  preregistered_prediction:
    quantity: >-
      NOT RESTATED HERE, AND THAT IS THE DESIGN. The per-lane preregistered
      quantitative predictions already exist, frozen, in the archived audit plan
      at
      coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-ef5b1e/tasks/TASK-20260824-53ecc0/audit-plan.yaml
      (per-lane quantitative_prediction blocks), bound by the BATCH-ef5b1e
      snapshot archive TASK-20260824-4af491. The Coordinator's own prior is
      recorded separately and verbatim in batch.yaml
      coordination_prior_recorded_at_opening.
    why_not_restated: >-
      Copying predicted values into the contract that the measurement slots read
      would put a prior answer in front of the producer and would create a
      second, editable copy of a frozen preregistration. Cite the frozen source;
      do not duplicate it.
    formula: >-
      cited per lane in the archived audit plan; no formula is introduced by this
      contract
    source: >-
      the archived audit plan TASK-20260824-53ecc0 and, for L0, the retrieved
      criterion pages themselves once S2 stores them
    no_new_prediction: >-
      THIS CONTRACT ADDS NO PREDICTION. It fixes metrics, controls, budgets,
      stopping rules, invalidation rules and required artifacts only.

  scale_relevance:
    tier: crypto
    justification: >-
      The measurement lanes run at the published parameter size of the audited
      curve, so the target arithmetic is at deployed scale. THE NULL FAMILY IS
      NOT: it runs at ONE REDUCED FIELD SIZE, because exact order computation
      for random coefficients at the published size needs point counting that
      this runtime is not shown to have. The reduced-scale null therefore
      licenses a statement about WHETHER THE CHECKER HAS RESOLVING POWER and
      licenses NO statement placing any statistic about the audited curve in a
      distribution.
    correspondence: null
    correspondence_note: >-
      null means direct evaluation at the published parameters; no sampling
      correspondence is used and none is claimed.
    transfer_assumptions:
    - >-
      From reduced-scale null to full scale: ASSUMED FOR INSTRUMENT VALIDITY
      ONLY (does the checker fire at all), never for distributional inference.
      Any distributional use is out of scope here.
    - >-
      To any other curve: NONE. Every result is scoped to the tested curve, the
      tested parameters, this runtime and this budget, and transfers to no other
      curve without re-running. The uniqueness argument underlying the derived
      group order depends on a regime hypothesis that must be re-checked for any
      other curve before the same route is used.

  tail_checks: []
  tail_checks_note: >-
    NONE, AND THE REASON IS STRUCTURAL RATHER THAN AN OMISSION. No distributional
    claim is made by any lane in scope: the null family is used as an instrument
    check (does the checker fire at a non-degenerate rate), not as a reference
    distribution for a target statistic. A tail check would presuppose the
    distributional comparison this contract forbids.

  replication:
    seeds: []
    seeds_note: >-
      The target lanes are DETERMINISTIC exact-integer computations; a seed would
      not vary them. The randomised components are the probable-primality witness
      list, the constructed composite, the random coordinate pair and the null
      family. EACH MUST RECORD ITS SEED AND ITS WITNESS OR SAMPLE LIST IN ITS
      OWN OUTPUT so a verifier can re-run exactly. This session records no seed
      values because it runs nothing.
    independent_instances: 0
    independent_instances_note: >-
      Zero at the time of freezing: no run exists under this goal. Independence
      in this batch is supplied by two INDEPENDENT REVIEW SESSIONS (S11
      validator, S12 red team, sibling-blind at review-adversarial xhigh) plus a
      blind re-derivation of one load-bearing quantity assigned in the S9 review
      plan -- not by repeated identical runs of a deterministic computation.

  # =====================================================================
  # BUDGET -- ceilings fixed before acquisition, copied from the committed
  # batch design. Declarations, not measurements.
  # =====================================================================
  budget:
    wall_clock_seconds_per_run: 1800
    wall_clock_seconds_per_run_note: >-
      The largest producer-slot ceiling in the committed batch design (S2 and
      S5). Per-slot ceilings are listed below and each slot is bound by its own,
      not by this maximum.
    total_cpu_hours: null
    total_cpu_hours_note: >-
      NULL BY CAPABILITY, NOT BY OMISSION. The committed batch design declares
      wall clock and memory per slot and no CPU-hour ceiling; this session has no
      command-execution tool and cannot measure or derive one. The campaign
      budget is unbounded (maximum_batches null, total_wall_clock_seconds null)
      under BUDGET-AMEND-20260828-750d51, so no CPU-hour ceiling is implied by a
      campaign total either.
    maximum_memory_gb: 4
    maximum_memory_gb_note: >-
      The largest per-slot ceiling in the committed batch design (S5). Every
      other slot is 2 GB, except S9 at 1 GB. With max_concurrent 2 the declared
      peak is 6 GB. Below the template's 8 GB floor for the reason stated in the
      objective.
    maximum_runs: 64
    maximum_runs_note: >-
      The sum of the four producer slots' committed maximum_runs in the dispatch
      queue: S2 12 + S3 20 + S5 20 + S7 12 = 64. Coordinator and review slots
      carry their own separate ceilings (1 each for the six archive and plan
      slots, 8 each for the two review slots) and are not included in this
      producer total.
    maximum_workers: 1
    maximum_workers_note: >-
      One. No parallel run is declared, no determinism verification has been
      performed, and none is claimed.
    per_slot_ceilings_wall_clock_seconds:
      S0: 900
      S1: 900
      S2: 1800
      S3: 1200
      S4: 900
      S5: 1800
      S6: 900
      S7: 1200
      S8: 900
      S9: 600
      S10: 900
      S11: 900
      S12: 900
      S13: 1200
    declared_batch_total_seconds: 15000
    declared_batch_total_seconds_basis: >-
      Copied from batch.yaml budget_accounting, which states the arithmetic
      explicitly. THESE ARE DECLARATIONS, NOT MEASUREMENTS: no run has occurred
      under this goal, and a slot that halts at its ceiling halts truthfully with
      the ceiling named, which is an operational observation and never a result.
    max_concurrent: 2
    max_concurrent_basis: >-
      The goal head's committed ceiling, NOT RAISED HERE. The dependency graph
      agrees independently: the widest stage is 2, twice (S2 with S3, S11 with
      S12). Every archive runs alone by rule.

  # =====================================================================
  # STOPPING RULES
  # =====================================================================
  stopping_rules:
  - id: STOP-1
    applies_to: every slot
    rule: >-
      Halt at the slot's declared wall-clock ceiling and report a PARTIAL
      CERTIFICATE naming the ceiling, what completed, what did not, and what to
      re-run. A budget stop is an OPERATIONAL OBSERVATION and is never a negative
      mathematical result.
  - id: STOP-2
    applies_to: L0 (S2)
    rule: >-
      Stop retrieval on a target after the attempt limit the archived plan states
      for it, or at the slot ceiling. An unretrieved target is recorded
      UNRETRIEVED with its HTTP status and attempt time. IT IS NEVER PARAPHRASED
      FROM MEMORY, and a partial L0 does not license a recalled threshold.
  - id: STOP-3
    applies_to: L-EQ, L-FIELD, L-BASE, L-LADDER, L-COMPLETE, L-IND, D3, D6
    rule: >-
      Single deterministic pass per lane, no retry logic. Stop when every
      declared quantity for the lane is either computed or recorded as not
      computed with its reason.
  - id: STOP-4
    applies_to: L-RHO
    rule: single formula evaluation; no solver is run and no second evaluation is scheduled
  - id: STOP-5
    applies_to: the null family (S5)
    rule: >-
      Stop at the declared sample count or at the slot ceiling, whichever comes
      first, and report the count ACTUALLY completed alongside the count declared.
  - id: STOP-6
    applies_to: every slot
    rule: >-
      A slot that finds itself needing PARI, gp, cypari, cypari2 or Sage has left
      this batch's scope and STOPS rather than improvising. A slot that finds
      itself wanting to compare a measured quantity against a threshold has found
      a design error and STOPS.

  # =====================================================================
  # INVALIDATION RULES -- fixed before any measurement exists.
  # =====================================================================
  invalidation_rules:
  - id: INV-1
    trigger: a guarding positive control does not fire on the identical code path
    consequence: >-
      THE LANE IT GUARDS PRODUCES NO INTERPRETABLE OUTPUT. Its measurement is
      recorded, is marked uninterpretable, and may not be carried into the
      comparison. This is an instrument failure and is reported as the finding it
      is.
  - id: INV-2
    trigger: the same-shape null family reports a zero percent reachability rate
    consequence: >-
      THE CHECKER IS BROKEN and every lane depending on it is VOIDED. Report the
      broken checker; do not report the target output as a result.
  - id: INV-3
    trigger: >-
      a reported quantity is not reproducible by re-running the committed source
      against the capsule whose sha256 the slot recorded
    consequence: the quantity is INVALID and returns to the producer as a defect
  - id: INV-4
    trigger: a slot performs a comparison it is not the gated comparison slot
    consequence: >-
      the comparison is VOID and the slot's deliverables return to the producer.
      Exactly one slot in this batch may compare.
  - id: INV-5
    trigger: >-
      a threshold enters a comparison without a direct quotation locatable in a
      stored retrieved page
    consequence: >-
      THE COMPARISON IS VOID FOR THAT CELL and the cell reverts to OPEN AND
      UNATTEMPTED. A quotation that cannot be located in a stored page is not a
      quotation. This is the exact failure gate L0 exists to prevent.
  - id: INV-6
    trigger: >-
      the L-EQ exact equality fails, i.e. the intake decimal and the retrieved
      hexadecimal are not equal as exact integers
    consequence: >-
      A REAL CONFLICT BETWEEN USER INTAKE AND RETRIEVED SOURCES. It is reported
      plainly, NOT silently fixed; downstream lanes are not interpreted; it is
      recorded as an IMPEDIMENT ON A STILL-ACTIVE GOAL with what is blocked,
      what clears it and what to re-run, and it fires the goal's third pause
      condition as an impediment. IT IS A RESULT ABOUT INTAKE AND PROVENANCE AND
      ABOUT NO CURVE'S SECURITY.
  - id: INV-7
    trigger: >-
      the Hasse-interval uniqueness argument's regime hypothesis does not hold,
      or the interval contains more than one multiple of the certified order
    consequence: >-
      THE GROUP ORDER IS NOT CERTIFIABLE BY THIS ROUTE and point counting would
      be required. That is an HONEST SCOPE REDUCTION recorded as such, not a
      finding about any curve.
  - id: INV-8
    trigger: >-
      a retrieved definition differs from the recalled definition a lane was
      drafted against
    consequence: >-
      THAT LANE'S COMPARISON STEP IS INVALIDATED (its MEASUREMENT is not), and
      the difference must supersede the archived plan in a NEW record rather than
      be patched into one. Flagged in advance for the definition-sensitive cells
      batch.yaml names, so a scope difference is not mistaken for a disagreement
      or for a discovery.
  - id: INV-9
    trigger: >-
      a producer reads an input that is not bound by path_sha256 in the snapshot
      receipt that governs it
    consequence: THE PRE-READ SEAL IS BROKEN and the output is invalid
  - id: INV-10
    trigger: >-
      a declared capability is unavailable in the dispatched session (network for
      S2; arbitrary-precision arithmetic and command execution for S3, S5, S7;
      the review-adversarial tier for S11 and S12)
    consequence: >-
      THE SLOT IS NOT RUN AND IS NOT REPORTED AS ATTEMPTED. A transcription
      reported as a measurement is exactly the defect this batch exists to
      remove, and an unservable review tier BLOCKS THE CLAIM, NOT THE CAMPAIGN --
      no downgrade, no substitution. The goal stays ACTIVE with the impediment
      recorded. This is an operational observation and is NEVER negative
      mathematical evidence.
  - id: INV-11
    trigger: >-
      any provider, backend, endpoint, fallback or probe selects an identifier
      containing "bedrock", case-insensitively
    consequence: PROHIBITED. Refuse before making the request; the run is invalid if made.

  success_criterion: >-
    THE PROTOCOL RAN AS SPECIFIED AND ITS OUTPUTS ARE CHECKABLE -- not that any
    particular value came out. Concretely: every L0 target is either stored with
    timestamp, byte length and sha256 or logged as unretrieved with its status;
    every in-scope lane either reports the quantities named for it under metrics,
    each with the code path and the input sha256 that produced it, or records
    itself as not measured with a reason; every guarding control ran on the
    identical code path and its outcome is recorded BEFORE the target output it
    guards is interpreted; and every one of the eleven cells carries a
    disposition from the single gated comparison, with every non-adjudicated cell
    naming which of the two reasons applies. A LANE THAT REPORTS ITSELF NOT
    MEASURED, WITH A REASON, SATISFIES THIS CRITERION. A failed control, an
    unreachable retrieval target and a budget stop are complete and valuable
    outcomes.
  success_criterion_negative_clause: >-
    NO OUTCOME OF THIS EXPERIMENT SUPPORTS ANY STATEMENT THAT ANY CURVE IS SAFE
    OR UNSAFE, AND A REPORT THAT READS OTHERWISE HAS OVERCLAIMED.

  falsification_criterion: >-
    THE INSTRUMENT IS FALSIFIED -- not any curve -- when a guarding positive
    control fails to fire on the identical code path, when the null family
    reports a degenerate reachability rate, when a reported quantity does not
    reproduce from the committed source and the recorded input hash, or when a
    threshold in a comparison cannot be located verbatim in a stored retrieved
    page. Each of those invalidates the lane or cell it touches, is recorded as
    the finding it is, and is never converted into a statement about the audited
    curve.

