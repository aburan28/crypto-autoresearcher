      declared in batch.yaml capability_contract. NO CAPABILITY CHECK IS OWED
      BEFORE S0 OR S1 AND NONE IS RECORDED AS RUN BY THIS SESSION.
    bedrock: >-
      PROHIBITED IN EVERY SLOT. No provider, backend, endpoint, fallback or probe
      may select an identifier containing bedrock, case-insensitively. Refuse
      before making a request.

