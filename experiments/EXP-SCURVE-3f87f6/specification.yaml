    artifact_ownership_rule: >-
      EVERY PATH ABOVE IS OWNED BY EXACTLY ONE SLOT, as declared in the dispatch
      queue. This contract does not add, rename or reassign a path; a lane that
      needs an artifact it does not own reads it through the snapshot receipt
      that binds it.
    source_code_rule: >-
