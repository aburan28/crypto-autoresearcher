  # =====================================================================
  # ORDERING AND GATES
  # =====================================================================
  comparison_gate: >-
    EXACTLY ONE SLOT MAY COMPARE A MEASURED QUANTITY AGAINST A THRESHOLD, AND IT
    IS S7 (TASK-20260904-ad952c). Every measurement slot is forbidden from
    comparing, from rendering a cell, and from writing the words safe, unsafe,
    vulnerable or secure about any curve. L0 is blocking FOR COMPARISON ONLY:
    measurement lanes MAY run before L0 closes.
  seal_ordering: >-
    Producers read SEALED content. S5 reads S2 and S3 outputs only as bound by
    path_sha256 in the S4 snapshot receipt; S7 reads only what the S4 and S6
    receipts bind; the review slots read only what the S8 and S10 receipts bind.
    Each reader verifies the sha256 before use and records the verification.
  knowledge_retrieval_obligation: >-
    Every producer MUST attempt search_knowledge before asserting that a quantity
    for this curve has or has not already been computed in this program, and MUST
    record its query strings and outcomes VERBATIM. ABSENCE OF A HIT LICENSES NO
    INFERENCE. The index is DERIVED AND MAY BE EMPTY; if it answers nothing that
    is a fact about the index, recorded as such, and is not evidence that nothing
    was tried.
  capability_declarations:
