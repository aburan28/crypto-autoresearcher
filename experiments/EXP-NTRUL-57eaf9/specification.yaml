experiment:
  id: EXP-NTRUL-57eaf9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-36a599; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-36a599
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute pairwise separability of candidate transition-location laws as a function of dimension
    window and measurement precision, with a reparameterisation null forced to zero and a divergent-pair
    null forced to separate
  objective: The uncertainty reduced is whether an exponent fitted over any dimension window this
    program could afford can identify a law at all, or only describe the window. (i) Does the separation
    machinery pass its two forced nulls, exactly zero for two parameterisations of the identical law
    and at least three standard errors for a deliberately divergent pair, without which every number
    in the table is a fitting artifact; (ii) for each ordered pair of declared candidate laws and
    each declared measurement precision, what is the smallest upper window edge at which median separation
    reaches three standard errors with eight log-spaced points, and which pairs never reach it within
    the largest window considered, since those are precisely the laws this program's data could not
    exclude however clean the measurement; (iii) how sensitive is that table to the nominal parameters
    of the data-generating law, to the separation threshold and to the assumption of constant measurement
    precision, since a table that flips under a modest change of nominal values is describing the
    chosen nominal values rather than the laws. The run costs minutes and touches no lattice, which
    is why it should precede rather than follow any expensive transition-location campaign.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: for the declared five-law candidate
      list, the declared nominal parameters, the declared window grid and precisions, the pairwise
      minimum separating window edges are as tabulated, with the reported sensitivity to threshold,
      nominal parameters and heteroscedasticity, and the two forced nulls returning their forced values.
      What does NOT follow: nothing about where any transition sits; nothing about which law is correct,
      since separability is not correctness; nothing about NTRU or any lattice; nothing about published
      fits, which this program cannot read; and nothing beyond the declared list, which is explicitly
      incomplete.'
  inputs:
    procedure: 'STAGE 0, cost minutes: implement the candidate laws, the weighted least squares fitter
      and the simulation-based separation statistic. STAGE 1, cost minutes: run the reparameterisation
      null across the full window and sigma grid, requiring separation zero to numerical tolerance,
      and the divergent-pair null, requiring at least three standard errors at the smallest window;
      gate the run on both. STAGE 2, cost minutes: for all ordered pairs across the window grid, upper
      edges 64 to 10000, and sigma in {0.1, 0.25, 0.5, 1.0}, run 500 noise realisations each and record
      median and interquartile separations. STAGE 3, cost minutes: invert to minimum separating window
      edge per pair and sigma, and list the pairs that never separate within the grid. STAGE 4, cost
      minutes: monotonicity check of separation under nested window extension, required by the propagation
      claim. STAGE 5, cost minutes: sensitivity sweeps over the threshold, over three nominal parameter
      sets per law, and over the heteroscedastic precision model. STAGE 6, cost minutes: emit the
      table with all sensitivities attached, and the divergence-location artifact showing where in
      n each pair''s laws actually differ.'
    instrument: Pure Python 3. Weighted least squares implemented directly over the fractions or Decimal
      modules for the linear cases and by a simple deterministic optimiser for the nonlinear ones,
      so that no external numerical library is required; a fixed seed schedule makes every realisation
      reproducible. All laws, nominal parameters, windows, precisions and thresholds are declared
      in a single configuration file committed with the contract, so the declaration cannot drift
      after results are seen. harness/runner.py wraps the run and captures the configuration hash
      in the manifest. No Sage, no lattice code, no estimator.
    parameters: 'Five candidate laws: pure power law; power law with a logarithmic correction; power
      law with a multiplicative correction vanishing as 1/n; stretched exponential in sqrt(n); and
      a two-regime piecewise power law. Three nominal parameter sets per law. Window lower edge fixed
      at n = 32; upper edges in {64, 128, 256, 512, 1024, 2048, 4096, 10000}; eight log-spaced points
      per window. Sigma in {0.1, 0.25, 0.5, 1.0} log2 units, plus a heteroscedastic arm with sigma
      proportional to log n. 500 noise realisations per configuration. Separation threshold 3 standard
      errors, swept over {2, 3, 5}.'
  controls:
  - Reparameterisation null with forced zero separation, gating the table.
  - Deliberately divergent pair with forced separation at a small window, confirming the machinery
    has power.
  - Sensitivity sweep over the three-standard-error threshold.
  - Sensitivity sweep over nominal parameter choices for the data-generating law.
  - Heteroscedastic secondary arm where sigma grows with n, since the transition's width may not be
    constant.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The reparameterisation null: two algebraically identical laws written
    with different free parameters, for instance a power law parameterised by (C, c) and the same
    law parameterised by (log C, c). Sep must be exactly zero, to numerical tolerance, at every window
    and sigma. If it is not, the fitting or the chi-squared conversion is producing artifacts and
    no row of the table is admissible. A second null in the opposite direction: two laws that differ
    by a factor growing like n, which must separate at a small window and thus confirm the machinery
    has power at all. Both nulls run in the same invocation as the table and gate its release.'
  independent_variables:
  - ordered pair of candidate laws
  - window upper edge
  - measurement precision sigma
  - nominal parameter set
  - precision model in {homoscedastic, heteroscedastic}
  metrics:
    primary:
    - median separation in standard errors per configuration
    - minimum separating window edge per pair and sigma
    - count of pairs unseparable within the grid
    - null separations, both forced
    - monotonicity violations under window extension
    secondary:
    - interquartile range of separation per configuration
    - sensitivity of the minimum edge to the threshold
    - sensitivity to nominal parameter set
    - location in n where each pair's laws first differ by one sigma
    - wall-clock per configuration
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The minimum window upper edge n_hi at which each ordered pair of candidate laws separates
      at three standard errors, as a function of measurement precision.
    formula: 'Sep(A, B; W, sigma) = median over realisations of (chi2_B - chi2_A) / sqrt(2 * dof),
      with data generated from A at its nominal parameters over window W with Gaussian noise of width
      sigma in log2 q units, both laws fitted by weighted least squares. n_hi(A, B; sigma) = min over
      the grid of upper edges with Sep >= 3. Forced predictions: Sep = 0 for the reparameterisation
      null; Sep >= 3 at the smallest window for the divergent-pair null. Substantive prediction: at
      least one pair with no n_hi within the grid, and n_hi >= 500 for the power-law versus log-corrected
      pair at sigma = 0.25.'
    source: Pre-registered in the parent proposal IDEA-20260816-36a599 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Windows extend to n = 10000 in the analysis, far beyond any dimension this program
      can measure, precisely so that the table can say which pairs are unseparable even under a budget
      nobody has. There is no experimental transfer assumption because no experiment is run; the only
      assumption connecting the table to reality is that the declared candidate list and the declared
      precision range bracket what a real transition measurement would face, which is stated as an
      assumption and not as a finding.
    correspondence: null
  tail_checks:
  - The largest window edge, where fits may become numerically ill-conditioned and separations unreliable.
  - The smallest sigma, where separations grow large and the three-standard-error threshold is reached
    almost immediately for every pair, making the table uninformative.
  - The largest sigma, where nothing separates and the table is trivially saturated.
  - Pairs whose laws cross within the window, where the separation statistic can be non-monotone and
    the inversion ill-defined.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if either forced null fails.
  - Abort if monotonicity under nested window extension is violated for more than a declared small
    fraction of configurations, since the inversion depends on it.
  - Stop extending windows at n = 10000, recording pairs still unseparated as unseparable within the
    grid rather than extrapolating.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both forced nulls return their forced values, monotonicity holds, and the pairwise
    minimum-window table is emitted with its sensitivity sweeps attached, whatever the values.
  falsification_criterion:
  - Reparameterisation null nonzero, invalidating the table.
  - Divergent-pair null failing to separate, showing the machinery has no power.
  - All pairs separating by n_hi = 128, refuting the premise that identifiability constrains this
    program.
  - Monotonicity violations beyond the declared fraction, invalidating the inversion.
  - Qualitative instability of the table under the nominal-parameter sweep, meaning the result describes
    the nominal values rather than the laws.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-36a599
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The candidate list is declared but not justified; a Coordinator must decide whether five forms
    suffice and whether any must be added before the table is used as a gate.
  - The chi-squared-difference separation statistic for non-nested models needs its interpretation
    pinned down, since the simulation avoids the asymptotic distribution but the scaling by sqrt(2
    dof) is still a convention.
  - Nominal parameter choices need a stated rationale; currently they are declared without one, which
    is the entry's weakest point.
  - Whether the eight-point log-spaced design is the right one, as opposed to a design optimised for
    discrimination, is unresolved and would change every number in the table.
