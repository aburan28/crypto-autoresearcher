experiment:
  id: EXP-ECDLP-728bf1
  hypothesis_id: H-ECDLP-50cb6e
  question_id: RQ-SDEG-001
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Is the Semaev solving degree a curve-model invariant - four birational models
    of one curve, a blocking correspondence gate, an ordering-variance null whose
    width decides whether the experiment is powered at all, a swept planted
    degree defect, and a curve-free presentation-change arm

  objective: >-
    If separately approved, authorized and executed, measure the solving degree
    of the Semaev decomposition system for one curve presented in four
    birationally equivalent models, paired per curve, against the within-model
    variance induced by monomial ordering. If the degree is invariant the lane
    gains a robustness result that a cost model needs before it can be
    extrapolated. If it is not, some model is cheaper and the lane's C_decomp is
    overstated by a measurable ratio - which is a CONSTANT FACTOR and, per
    docs/target-result-profile.md, explicitly NOT a target-class result.

  what_this_is_not:
    - Not an attack, an exponent, or a target-class result. A model gain is a constant factor and must never be presented otherwise.
    - Not a statement about generic curves. The ladder is torsion-constrained and therefore non-generic by construction.
    - Not a comparison of group-operation cost across models, which is the fast-arithmetic literature's question and a different quantity.
    - Not a status change to any record. Any refit of C_decomp is a Coordinator decision elsewhere.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is - on a torsion-constrained toy ladder, at one arity,
    under one solver and one model-independent monomial-order convention, the
    solving degree does or does not move across four birational models by more
    than the ordering-induced spread. It cannot certify model-independence as a
    theorem and can certify nothing about generic curves.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) Solution sets correspond exactly under the birational map at tiny size,
    per curve, per model pair.
    (2) The ordering-variance spread is strictly greater than 0 and strictly less
    than 2 degrees.
    (3) Two admissible short-Weierstrass models of one curve are
    indistinguishable within that spread.
    (4) A planted generator of known degree raises the measured solving degree by
    the predicted amount, in EVERY model, at EVERY swept degree.
    (5) INVARIANT is declared if the maximum paired cross-model difference is
    within the ordering spread on at least 8 of 10 ladder curves; NOT INVARIANT
    if one model is strictly lowest by more than the spread on at least 3 curves
    reproducibly; otherwise INCONCLUSIVE.

  measured_quantities:
    - name: solving_degree
      definition: >-
        The highest degree reached by the Groebner computation on the
        decomposition system, under the declared engine and the declared degree
        convention, both frozen before any cell runs.
      units: degree (dimensionless integer)
    - name: ordering_spread
      definition: >-
        max minus min of solving_degree over the declared random variable
        orderings within one fixed model, per curve. REPORTED BEFORE ANY
        CROSS-MODEL NUMBER IS READ.
      units: degree (integer)
    - name: cross_model_difference
      definition: >-
        Paired per-curve difference in solving_degree between two models, at
        matched ordering seed.
      units: degree (integer, signed)
    - name: wall_clock
      definition: Elapsed wall-clock time of the decomposition per (curve, model, ordering).
      units: seconds
    - name: relation_yield
      definition: Relations obtained per target, per (curve, model).
      units: relations per target (dimensionless)
    - name: correspondence_verdict
      definition: >-
        Whether the solution sets of two models' systems correspond exactly under
        the birational map at tiny size.
      units: boolean per (curve, model pair)
    - name: torsion_structure
      definition: The group order and its factorisation for every ladder curve.
      units: integers
    - name: planted_degree_rise
      definition: >-
        Measured increase in solving_degree after injecting a generator of known
        degree, against the pre-computed predicted increase.
      units: degree (integer)
    - name: c_decomp_ratio
      definition: >-
        If a model dominates, the ratio of the incumbent model's cost to the
        dominating model's, with an interval.
      units: dimensionless ratio

  metrics:
    primary: [solving_degree, ordering_spread, cross_model_difference, correspondence_verdict]
    secondary: [wall_clock, relation_yield, torsion_structure, planted_degree_rise, c_decomp_ratio]

  null_and_control_objects:
    - id: GATE-CORRESPONDENCE
      name: birational solution-set correspondence, blocking
      construction: >-
        At tiny size, solve the decomposition system in each pair of models and
        check that the solution sets correspond exactly under the birational map.
      forced_value: exact correspondence for every curve and every model pair
      non_vacuity: >-
        Genuinely capable of failing, and this is the stage most likely to be
        skipped - a summation-polynomial generator that is subtly wrong in a
        less-trodden model produces systems that are not the same problem, and
        without this gate every later timing comparison is meaningless.
    - id: NULL-ORDERING
      name: within-model ordering-variance null
      construction: >-
        One fixed model per curve, solved under at least 5 random variable
        orderings under a model-independent order convention.
      forced_value: spread strictly greater than 0 and strictly less than 2 degrees
      non_vacuity: >-
        THIS NULL'S WIDTH IS ITSELF A RESULT AND BOTH FAILURE MODES ARE REAL. A
        spread of exactly 0 means the null cannot bound anything and the
        comparison basis does not exist. A spread of 2 or more degrees means any
        plausible model effect is swamped and the design is UNDERPOWERED at this
        size - in which case the honest output is the size at which it would not
        be, never a null result.
    - id: NULL-WEIERSTRASS-TWIN
      name: two admissible short-Weierstrass models of one curve
      construction: >-
        The same curve presented under an admissible scaling change of variables,
        giving genuinely different coefficients and the same model family.
      forced_value: indistinguishable within the ordering spread
      non_vacuity: >-
        The coefficients genuinely differ, so movement is possible; a difference
        here means the pipeline responds to something other than the model and
        voids the whole cross-model comparison.
    - id: PLANT-DEGREE
      name: swept planted degree defect
      construction: >-
        A generator of known degree d injected into the decomposition system in
        each model, d swept over at least 3 values, with the predicted rise in
        solving degree computed before the run.
      forced_value: >-
        Measured rise matches the prediction in every model at every d, within
        the ordering spread.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL. Without it, a report that
        the solving degree did not move across models is a report from an
        instrument never shown able to see a move - which is precisely the shape
        of an uninformative null.
    - id: NULL-CURVEFREE
      name: matched-shape curve-free system under an analogous presentation change
      construction: >-
        Random systems over the same field with the same variable count, degree
        sequence and sparsity as the decomposition system, containing NO
        elliptic curve, put through a random invertible change of variables
        chosen to reproduce the degree and support changes a model change
        induces, and solved by the identical pipeline under the identical
        orderings.
      forced_value: none - the arm is the scope gate and a movement bound
      non_vacuity: >-
        It produces its own cross-presentation movement distribution with nonzero
        spread, and can agree with or differ from the model arm.
      consequence_pre_declared: >-
        IF THE CURVE-FREE ARM REPRODUCES THE CROSS-MODEL MOVEMENT WITHIN ITS
        SPREAD, THE OBSERVED EFFECT IS THE SOLVER RESPONDING TO DEGREE AND
        SUPPORT CHANGES, NOT TO ELLIPTIC-CURVE STRUCTURE, AND NOTHING FROM THIS
        EXPERIMENT MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE
        ECDLP. Written before execution so it cannot be reframed afterwards.

  scope_gate: >-
    See NULL-CURVEFREE consequence_pre_declared. The gate is evaluated and
    reported BEFORE the cross-model differences are interpreted, and its verdict
    is printed on the face of every quoted number.

  independent_variables: [curve, model, ordering_seed, planted_degree, arm]

  preregistered_prediction:
    quantity: maximum paired cross-model difference in solving degree, per curve
    formula: >-
      INVARIANT if that maximum is within the curve's own ordering_spread on at
      least 8 of 10 ladder curves. NOT INVARIANT if one model is strictly lowest
      by more than the spread on at least 3 curves, reproducibly across orderings.
      Otherwise INCONCLUSIVE.
    source: ledger/hypotheses/H-ECDLP-50cb6e.yaml predictions P1 through P7
    values_frozen_here:
      models: [short_weierstrass, edwards, montgomery, hessian]
      ladder_curves_admitting_all_four: 10
      orderings_per_curve_model: 5
      ordering_spread_admissible_range: strictly greater than 0 and strictly less than 2 degrees
      invariant_threshold_curves: 8 of 10
      not_invariant_threshold_curves: 3
      planted_degree_values: at least 3

  decision_rule_that_falsifies: >-
    THE RECORD IS FALSIFIED, and its central claim rejected in scope, IF one
    model is strictly lowest by more than the ordering spread on at least 3
    ladder curves, reproducibly across orderings, with every control passing and
    the curve-free arm NOT reproducing the movement. The lane's C_decomp is then
    overstated by the measured ratio at the tested scope - which is a CONSTANT
    FACTOR and is reported as such.
    THE RECORD IS SUPPORTED IN SCOPE IF the maximum paired difference is within
    the ordering spread on at least 8 of 10 curves, with every control passing.
    THE RUN IS INVALID, and no verdict of either kind may be reported, if the
    correspondence gate fails, if the ordering spread is 0 or is 2 or more
    degrees, if the Weierstrass twin differs, or if the planted sweep does not
    fire at the predicted magnitude in every model.

  stages:
    - id: S0
      name: ladder construction, torsion audit, generator parity review
      terminates_run: false
      description: >-
        Construct curves admitting all four models; the torsion conditions force
        the group order to be divisible by 12, so record the torsion structure of
        every ladder curve and REPORT THE LADDER'S NON-GENERICITY explicitly.
        Curves admitting only some models are recorded separately, never dropped.
        Review the four summation-polynomial generators for parity before any
        result is admitted, because an unoptimised or subtly wrong generator in a
        less-trodden model produces a spurious effect in exactly the direction
        this contract is looking for. Fix the monomial order model-independently
        here. Also perform the literature check the source idea requires; if the
        question is already settled externally, report that and stop.
    - id: S1
      name: correspondence gate
      terminates_run: true
      description: >-
        GATE-CORRESPONDENCE at tiny size for every curve and model pair. Failure
        on a curve voids that curve; failure on more than 3 curves ends the run.
    - id: S2
      name: ordering-variance null
      terminates_run: true
      description: >-
        NULL-ORDERING, measured FIRST so the comparison basis exists before any
        cross-model number is read. Spread 0, or 2 or more degrees, ENDS the run
        with the underpowered or unbounded condition and the required size
        reported.
    - id: S3
      name: Weierstrass twin and planted degree sweep
      terminates_run: true
      description: >-
        NULL-WEIERSTRASS-TWIN and PLANT-DEGREE. Either failure ENDS the run; no
        invariance verdict is reportable.
    - id: S4
      name: curve-free arm
      terminates_run: false
      description: >-
        NULL-CURVEFREE under the analogous presentation change. Its movement
        distribution is computed and the scope gate evaluated BEFORE the model
        arm is read.
    - id: S5
      name: cross-model measurement and verdict
      terminates_run: false
      description: >-
        Solving degree, wall clock and relation yield per (curve, model, ordering),
        paired per curve; then the frozen decision rule; then, if a model
        dominates, the C_decomp ratio with its interval, explicitly labelled a
        constant factor and explicitly labelled non-target-class.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 10
    seeds_per_cell: 5
    seeds_policy: >-
      Every cell is addressed by (arm, curve_index, model_label, ordering_index,
      planted_degree) and its seed is derived deterministically as a SHA-256 over
      the ASCII bytes of the domain string, those fields in that order, and the
      declared master seed, reduced to 64 bits. The domain string is
      EXP-ECDLP-728bf1/v1. THE ORDERING INDEX IS SHARED ACROSS MODELS AT A FIXED
      CURVE, so a cross-model difference is taken at matched ordering seed rather
      than across independently drawn orderings; that is what makes the
      comparison paired. The master seed is fixed in the frozen contract before
      any execution and is never re-drawn.
    determinism_requirement: >-
      Re-running any tuple must reproduce the identical solving degree and the
      identical system hash. Any cell failing this is INVALID.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 250
    maximum_memory_gb: 16
    maximum_runs: 400
    maximum_workers: 1
    note: >-
      Sized to the work. The memory profile is the lane's existing Groebner
      profile multiplied by the number of models, which is why the memory ceiling
      is set at 16 GB rather than the 8 GB floor.

  stopping_rules:
    - GATE-CORRESPONDENCE fails on a curve -> that curve is VOID; more than 3 void curves ends the run.
    - NULL-ORDERING spread exactly 0 -> STOP, the comparison basis does not exist.
    - NULL-ORDERING spread 2 degrees or more -> STOP, UNDERPOWERED at this size; report the size at which it would not be, never a null result.
    - NULL-WEIERSTRASS-TWIN differs beyond the spread -> STOP, pipeline artifact, cross-model comparison void.
    - PLANT-DEGREE does not fire at the predicted magnitude in any model -> STOP, no demonstrated dynamic range.
    - Generator parity review finds a defect in any model's generator -> STOP that model until repaired; a defect here produces a spurious effect in the direction sought.
    - Per-run wall clock or memory ceiling exhausted -> STOP that cell, report failed_infrastructure with coverage reached.

  invalidation_rules:
    - Any cross-model difference taken at non-matched ordering seed is invalid; the design is paired at the ordering index.
    - Any cross-model difference on a curve whose correspondence gate failed is invalid.
    - Any comparison under a monomial order that depends on variable NAMES rather than on a model-independent convention is invalid; it would measure the order, not the model.
    - Any invariance verdict reported without the ordering spread reported first is invalid.
    - Any generalisation from the torsion-constrained ladder to generic curves is invalid on its face.
    - Any description of a model gain as an exponent improvement, or as a target-class result, is invalid on its face.
    - Any quoted number lacking the curve-free scope-gate verdict on its face is invalid.

  success_criterion: >-
    ALL of - (a) at least 8 ladder curves pass the correspondence gate; (b) the
    ordering spread lies strictly inside its admissible range on every surviving
    curve; (c) the Weierstrass twin is indistinguishable within that spread; (d)
    the planted degree sweep fires at the predicted magnitude in every model at
    every d; (e) the curve-free arm completes and the scope gate is evaluated;
    (f) solving degree, wall clock and relation yield recorded per (curve, model,
    ordering) with the torsion structure of every ladder curve; (g) the frozen
    decision rule applied and a verdict of INVARIANT, NOT INVARIANT or
    INCONCLUSIVE assigned. Reaching INCONCLUSIVE is a SUCCESSFUL run; only
    failing (a) through (f) is unsuccessful.

  falsification_criterion: >-
    One model strictly lowest by more than the ordering spread on at least 3
    curves, reproducibly, with every control passing and the curve-free arm not
    reproducing it. H-ECDLP-50cb6e's invariance claim is then rejected in the
    tested scope and the lane's C_decomp is overstated by the measured ratio at
    that scope. Secondary falsifiers of the DESIGN rather than the hypothesis - a
    correspondence failure, a degenerate or oversized ordering spread, a
    Weierstrass twin difference, a planted sweep that does not fire, or a
    curve-free arm that reproduces the movement. In every case the failing curve,
    model and stage are named, and forward guidance names the next object.

  required_artifacts:
    - results.json with solving degree, wall clock and relation yield per (arm, curve, model, ordering)
    - correspondence pass or fail per curve and model pair, with the birational maps used
    - ordering spread per curve, written before any cross-model number
    - Weierstrass twin comparison
    - planted-degree predicted and measured rises per model per d
    - torsion structure of every ladder curve, and the separate record of curves admitting only some models
    - the generator parity review, naming what was checked in each model
    - the frozen model-independent monomial-order convention
    - the literature-check outcome from S0
    - the curve-free arm's full movement distribution and the scope-gate verdict
    - artifact manifest with hashes and a rebuild receipt
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - peak resident memory, wall clock and CPU time per cell
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      One toy prime size on a torsion-constrained ladder. The ladder is
      non-generic by construction and nothing transfers to generic curves or to
      larger sizes.
    correspondence: null

  limitations:
    - >-
      Scoped to the tested models, arity, ladder, monomial-order convention and
      solver.
    - >-
      NO STATEMENT ABOUT GENERIC CURVES FOLLOWS FROM A TORSION-CONSTRAINED
      LADDER. Requiring all four models forces 12 to divide the group order, so
      the ladder is not generic, and generalising from it is the extrapolation
      AGENTS.md core rule 7 forbids without an explicit stated assumption.
    - >-
      An invariance result is evidence of robustness within the tested range, NOT
      a theorem of model-independence.
    - >-
      A model gain is a CONSTANT FACTOR. Per docs/target-result-profile.md it is
      explicitly not a target-class result and must never be presented as one.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - whether solving degree remains model-invariant at the sizes where
      C_decomp would actually be extrapolated is beyond any budget this program
      can grant. The contract measures what it can reach and records the transfer
      as unjustified.
    - >-
      Implementation maturity differs across models, and the generator parity
      review at S0 mitigates but does not eliminate the risk that a degree
      difference reflects an unoptimised generator rather than mathematics.
    - >-
      Changes no record's status.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory or missing dependency is INFRASTRUCTURE
    SIGNAL, recorded as failed_infrastructure with its cause and coverage. It is
    NEVER negative mathematical evidence and never counts toward the
    falsification criterion (AGENTS.md core rule 5). In particular, a model whose
    system times out where another completes yields NO cross-model difference on
    that curve - it yields a measurement against a non-measurement, and that pair
    is withdrawn.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record and alters no goal. The source idea's
    requirement to check an adjacent open problem's existing evidence at S0 is
    carried forward as an unresolved obligation on the executing session - the
    authoring agent did not open that record.
