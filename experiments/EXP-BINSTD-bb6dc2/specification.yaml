# EXP-BINSTD-bb6dc2
# FIPS reduction-polynomial term counts. No solver.
# Approved by DEC-20261002-c61585.
experiment:
  id: EXP-BINSTD-bb6dc2
  hypothesis_id: H-BINSTD-8542ac
  source_idea: IDEA-20260922-f37254
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: FIPS reduction-polynomial term counts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-c61585
  objective: >-
    Decode the five FIPS reduction polynomials in the audit file.
    Count set bits, compare each K/R pair, and subtract printed bit
    sizes from the degrees. Reject a term count of 3 at degree 163.
  inputs:
    file: analysis/binstd-curve-audit/binary-curve-params.txt
    file_sha256: ad4678d2703c36a5ee9c5d6dcaa5e886977b13c1c1546daad61f6c7710e4f493
    file_lines: 793
    headings: 31
    polynomials:
      - {degree: 163, terms: 5, exponents: [163, 7, 6, 3, 0], nbytes: 21}
      - {degree: 233, terms: 3, exponents: [233, 74, 0], nbytes: 30}
      - {degree: 283, terms: 5, exponents: [283, 12, 7, 5, 0], nbytes: 36}
      - {degree: 409, terms: 3, exponents: [409, 87, 0], nbytes: 52}
      - {degree: 571, terms: 5, exponents: [571, 10, 5, 2, 0], nbytes: 72}
    trinomial_degrees: [233, 409]
    pentanomial_degrees: [163, 283, 571]
    pairs_equal: 5
    printed_gaps:
      - {name: sect163k1, printed: 163, gap: 0}
      - {name: sect233k1, printed: 232, gap: 1}
      - {name: sect283k1, printed: 281, gap: 2}
      - {name: sect409k1, printed: 407, gap: 2}
      - {name: sect571k1, printed: 570, gap: 1}
      - {name: sect163r2, printed: 163, gap: 0}
      - {name: sect233r1, printed: 233, gap: 0}
      - {name: sect283r1, printed: 282, gap: 1}
      - {name: sect409r1, printed: 409, gap: 0}
      - {name: sect571r1, printed: 570, gap: 1}
    nonzero_gaps: 6
    gap_sum: 8
  controls:
    - >-
      A term count of 3 at degree 163 is false. Reporting that
      invalidates the run.
    - >-
      Reporting any of the five K/R pairs unequal is false. That
      report invalidates the run.
    - >-
      Reporting the degree of sect233k1 as 232 is false. The printed
      size is 232 and the degree is 233. Reporting the degree as 232
      invalidates the run.
    - A sha256 mismatch invalidates the run. Do not edit the file.
    - Two integer routes. They must not import each other.
  independent_variables:
    - degree
    - route in {decode_bits, repeat_module}
  metrics:
    primary:
      - term_counts
      - pair_equalities
      - gap_sum
      - three_terms_at_163_rejected
      - implementations_agree
    secondary:
      - nbytes
      - nonzero_gaps
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Five term counts, five pair bits, and a gap sum of 8.
    formula: >-
      The polynomial integer is the hex block under Polynomial. A
      term is a set bit. The degree is the highest set bit. A pair
      matches when the two hex strings are equal. The gap is the
      absolute difference of that degree and the printed bit size.
    source: >-
      IDEA-20260922-f37254 names the five polynomials. The bits,
      pair matches, and printed sizes were read from the audit file
      in this design session. That read is not a run. A term count
      of 3 at degree 163 is the rejected nearby count. No solver
      was run.
  scale_relevance:
    tier: toy
    justification: A file decode of named polynomials. No transfer to a conflict count.
    correspondence: null
  tail_checks:
    - Degree 571 is required. Stopping after degree 409 and still reporting the 571 exponents is invalid.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If degree 163 is reported to have 3 terms, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The file sha256 differs from the preregistered value.
    - Degree 163 is reported to have 3 terms.
    - Any K/R pair is reported unequal.
    - The degree of sect233k1 is reported as 232.
    - The parameter file is edited.
    - An isomorphism or a conflict count is reported.
  success_criterion: >-
    Both runs agree on the five term counts, the five exponent lists,
    the five pair matches, the six nonzero gaps, and the gap sum 8.
    Degree 163 stays at 5 terms. sect233k1 stays degree 233 with
    printed size 232.
  falsification_criterion: >-
    The runs agree, the file hash matches, degree 163 stays at 5
    terms, every pair stays equal, and any term count, exponent,
    pair bit, or gap differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-bb6dc2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-bb6dc2/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-bb6dc2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-bb6dc2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-bb6dc2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-bb6dc2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any isomorphism, SAT run, or conflict count.
    - A claim that sparsity changes search cost.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
