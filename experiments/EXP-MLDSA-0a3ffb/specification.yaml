# EXPERIMENT CONTRACT -- EXP-MLDSA-0a3ffb (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-0a3ffb
  hypothesis_id: H-MLDSA-651c54
  derived_from_idea: IDEA-20261018-fb4a86
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Fault-position census by signing mode and rnd entropy at ML-DSA-44
  objective: the query price hedging imposes on each fault class and which classes it does
    not affect
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python FIPS 204 implementation with fault-injection hooks, cross-checked against PQClean
      KATs
    parameters: >-
      ML-DSA-44; positions: c_tilde bit, c coefficient sign, mu bit, w1 bit, y zeroing, z
      addition skip, kappa, NTT twiddle, s1 load, h bit, rho'' bit, A entry; h in {0 (deterministic),
      8, 12, 16, 20, 24, 256}; 20 keys per cell
    procedure: >-
      1) KAT. 2) For each position and h, query same message repeatedly with one faulty signing
      among them. 3) Attacker searches for usable pairs and solves. 4) Certify. 5) Classify
      positions.
  controls:
  - 'null: fault-free signing, no recovery'
  - 'positive: deterministic mode with fault on c'
  - 'A/A: h = 16 under two seed blocks'
  independent_variables:
  - rnd_entropy_h
  - fault_position
  metrics:
    primary:
    - queries to recovery
    secondary:
    - class assignment per position
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: median queries
    formula: 1 + sqrt(2 ln 2 * 2^h)
    source: birthday on rnd
  scale_relevance:
    tier: crypto
    justification: real parameters; faults simulated
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop per cell at 20 recoveries or 2^26 queries
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    P1 in C3, P2 and C2 shows y_zero recovers at h = 256 while c_sign does not; AA1 noise
    floor medians within factor 1.5
  falsification_criterion: C3 slope outside [0.35,0.65] or C2 classes inconsistent across
    seeds
  decision_impact:
    on_positive: add a mode-dependence column to the fault-boundary table of GOAL-MLDSA-001
    on_negative: report that hedging does not price as birthday and audit the derivation
  variable_ledger:
    independent:
    - name: rnd_entropy_h
      levels:
      - '0'
      - '8'
      - '12'
      - '16'
      - '20'
      - '24'
      - '256'
    - name: fault_position
      levels:
      - c_sign
      - y_zero
      - mu_bit
      - z_skip
      - others_8
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    comparisons:
    - id: C1
      arms:
      - c_sign h 0
      - c_sign h 16
      differs_in:
      - rnd_entropy_h
      design: one_factor
    - id: C2
      arms:
      - c_sign h 256
      - y_zero h 256
      differs_in:
      - fault_position
      design: one_factor
    - id: C3
      arms:
      - c_sign slope over h
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - c_sign h 16 seed-block A
      - c_sign h 16 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-fb4a86.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-fb4a86.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLDSA-0a3ffb/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-fb4a86.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
