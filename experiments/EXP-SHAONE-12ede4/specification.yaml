experiment:
  id: EXP-SHAONE-12ede4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-8e0b9c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-8e0b9c
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Run identical-prefix and chosen-prefix pipelines end to end against a shared compression
    kernel at three reduced analogue widths, measuring evaluations per success and the ratio R(w)
    against a random-target null arm.
  objective: 'The one uncertainty a run reduces is whether the identical-prefix to chosen-prefix cost
    gap is a stable factor or a width-dependent quantity, measured rather than quoted. Stated as parts:
    (i) it establishes whether both attacks can be implemented against a byte-identical compression
    kernel with a shared evaluation counter, which is the precondition that makes any ratio attributable
    to the attacks rather than to implementation effort, and whose failure is itself a complete and
    reportable outcome that would block every ratio claim; (ii) it measures evaluations per success
    for each pipeline at three declared reduced widths with at least 50 successes per cell, forms
    R(w) with bootstrap intervals, and reports whether the intervals across widths overlap -- deliberately
    without pre-committing to flat or growing, because that is the question; (iii) it runs the identical
    chosen-prefix pipeline against a cardinality-matched random target-difference set in the same
    invocation, giving R_null(w), so that any part of the ratio explained merely by having two phases
    is separated from any part attributable to the structured target. Every collision produced is
    verified by direct recomputation and certificates are emitted only for objects actually computed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: on THIS reduced-step
      analogue at THESE three widths, with THIS shared kernel, the chosen-prefix pipeline costs R(w)
      times the identical-prefix pipeline in compression-function evaluations per success, with these
      intervals, against these null values, at these separately reported memory figures. WHAT DOES
      NOT FOLLOW: no value of R at full width, no statement about SHA-1 or MD5 parameters, no assertion
      that any published factor is correct or incorrect, no security consequence, and no claim that
      a three-point trend establishes any asymptotic behaviour. The analogue is an analogue and the
      contract does not license transferring its numbers.'
  inputs:
    procedure: 'STAGE 0 (cost: 3 human-hours): declare the analogue (reduced-step count and truncation
      width at three levels), the target-difference set and its cardinality, the phase-attribution
      rule for restarts, the success counts, and the seeds. STAGE 1 (cost: 8-20 human-hours, dominant
      human cost): implement the shared compression kernel in C with the evaluation counter inside
      it, record its byte hash, and build both pipelines on top of it; verify with declared test vectors.
      STAGE 2 (cost: 1-4 CPU-hours): run both pipelines at the smallest width to 50 successes each,
      plus the random-target null arm, in one invocation. STAGE 3 (cost: minutes): verify every collision
      by direct recomputation; any failure halts. STAGE 4 (cost: minutes): bootstrap R and R_null
      at the smallest width and decide, by the pre-declared interval-overlap rule, whether to proceed.
      STAGE 5 (cost: 4-40 CPU-hours, budget-gated): repeat STAGE 2 and 3 at the two larger widths.
      STAGE 6 (cost: 2 CPU-hours): assemble R(w), report memory separately per pipeline per width,
      report re-entry rates, and state every disagreement with the predictions as a disagreement.'
    instrument: Python 3.11 orchestration over a single ctypes-wrapped C compression kernel whose
      byte hash is recorded in the run manifest, so the shared-kernel constraint is auditable rather
      than asserted; numpy for the trail table and bootstrap; hashlib for reference vectors before
      reduction; multiprocessing for the birthday phase; harness/runner.py for run manifests, seeds
      and the inference block; direct recomputation verification written independently of the search
      code. No Sage and no computer-algebra dependency.
    parameters: 'Three analogue widths, declared at STAGE 0 and chosen so the identical-prefix attack
      completes in minutes, tens of minutes and hours respectively; reduced step counts declared alongside.
      Target-difference set cardinality: declared, matched exactly between structured and random arms.
      Successes per cell: 50. Seeds: 50 distinct per cell, recorded. Arms: identical-prefix, chosen-prefix
      structured target, chosen-prefix random target, identical-prefix with near-collision machinery
      disabled. Memory ceiling: 8 GiB per pipeline. Bootstrap resamples: 10000.'
  controls:
  - Random target-difference set of matched cardinality, same invocation, same kernel and counter.
  - Shared compression kernel and shared evaluation counter across both pipelines, verified by a byte-identical
    kernel hash recorded in the manifest.
  - Direct recomputation verification of every produced collision, so no certificate rests on the
    pipeline's own report.
  - An identical-prefix run against the reduced-step analogue with the near-collision machinery disabled,
    confirming the baseline is not accidentally paying chosen-prefix costs.
  - At least 50 successes per cell so the ratio carries a bootstrap interval rather than being a single
    draw.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Random target-difference set: run the identical chosen-prefix pipeline,
    in the same invocation and with the same kernel and counter, against a target-difference set drawn
    uniformly at random with cardinality matched to the structured set. This preserves the two-phase
    shape while removing the structure. The null must show a materially different R -- specifically
    a higher R, since an unstructured target should make the birthday phase harder without changing
    the identical-prefix baseline at all. If R_null tracks R across all three widths, the measured
    ratio reflects the generic cost of having two phases rather than anything about chosen-prefix
    structure, and the signal arm means nothing.'
  independent_variables:
  - analogue width
  - pipeline (identical-prefix / chosen-prefix)
  - target-difference set arm (structured / random)
  - reduced step count
  metrics:
    primary:
    - compression-function evaluations per success, per pipeline, per width
    - R(w) with bootstrap confidence interval
    - R_null(w) with bootstrap confidence interval
    - interval-overlap outcome between R and R_null at each width
    secondary:
    - peak memory per pipeline per width
    - birthday-phase re-entry rate
    - phase subtotals of evaluations
    - collisions verified by direct recomputation as a fraction of collisions produced
    - kernel byte hash recorded per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: R(w) at the three declared analogue widths, and the ratio R_null(w)/R(w) at each width.
    formula: Predicted R(w) >= 10 at the largest width, and R_null(w)/R(w) >= 2 at every width, where
      R(w) = (mean chosen-prefix evaluations per success at width w) / (mean identical-prefix evaluations
      per success at width w), means taken over 50 successes with 10000-resample bootstrap intervals.
      No slope for R across w is pre-committed, by design.
    source: Pre-registered in the parent proposal IDEA-20260816-8e0b9c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are three reduced-step, truncated analogue widths chosen so
      that the identical-prefix attack completes within minutes to hours and every collision is verifiable
      by direct recomputation -- the smallest scale at which both full pipelines run end to end, which
      is the only scale where a ratio between them can be measured at all rather than modelled. Transfer
      assumption stated explicitly: NO numeric transfer to full-width parameters is performed. The
      only thing argued to carry is the qualitative question of whether R is flat or growing, and
      even that is a three-point observation that the contract labels as weak rather than asymptotic.'
    correspondence: null
  tail_checks:
  - Report the full distribution of evaluations per success, not just the mean; a heavy tail makes
    a mean ratio unreliable and would require reporting medians instead.
  - Check whether any single success dominates a cell's total, which would indicate 50 successes is
    too few.
  - Check whether the random-target arm's birthday phase hits the memory ceiling more often than the
    structured arm, which would confound R_null with throttling.
  - Check phase subtotals sum to the total evaluation count exactly; a mismatch indicates attribution
    leakage.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop after the smallest width if R and R_null intervals overlap there, and report the overlap
    as the result rather than buying the larger widths.
  - Halt immediately if any produced collision fails direct recomputation.
  - Stop any cell that exceeds its declared wall-clock budget and report it as a budget outcome, explicitly
    not as evidence about either attack.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if both pipelines run against a byte-identical kernel to
    50 verified successes per cell at the smallest width and R and R_null are reported with bootstrap
    intervals -- whichever way the comparison falls.
  falsification_criterion:
  - R and R_null intervals overlap at every completed width, refuting attribution of the ratio to
    chosen-prefix structure.
  - R below 10 at the largest completed width, refuting the large-gap premise at analogue scale.
  - Any collision fails direct recomputation, voiding the run.
  - The kernel byte hash differs between pipelines, showing the shared-kernel constraint was not met
    and no ratio may be reported.
  - Phase subtotals fail to sum to the total, showing attribution leakage and making R uninterpretable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-8e0b9c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The reduced-step analogue's fidelity is asserted, not derived; a Coordinator must decide whether
    a reduced-step compression function preserves the structural relationship between the two attacks,
    or whether that itself needs a prior experiment.
  - The dependency on GOAL-MD5-001's pipeline must be sequenced explicitly, since GOAL-SHA1-001's
    non_duplication clause states it does not own that pipeline.
  - The phase-attribution rule for birthday re-entry needs a precise declaration; several defensible
    rules exist and they give different R.
  - Whether 50 successes per cell suffices under a heavy-tailed cost distribution is unknown before
    the smallest width runs, and the Coordinator should set a rule for raising it rather than leaving
    it to mid-run judgement.
