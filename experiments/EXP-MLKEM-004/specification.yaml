experiment:
  id: EXP-MLKEM-004
  hypothesis_id: H-MLKEM-004
  goal_id: GOAL-MLKEM-002
  version: 1
  title: >-
    Repaired hardened multi-class ML-KEM comparison-conformance gate with
    baseline-invisible synthetic control and mechanism-matched second
    implementation
  status: approved
  approved_by: coordinator   # AGENTS.md rule 1: only the coordinator approves an experiment (CORR-20260802-010)
  frozen: true
  objective: >-
    Repair the two defects that made EXP-MLKEM-003's isolation claim
    unreachable and underpowered: (1) plant a synthetic positive control that
    is invisible to G1 and visible to G2 or G3, and redefine
    generator_hardening_insufficient to fire only when that synthetic control
    is missed; (2) select the second implementation for fixed-bound
    hand-written vector comparison tails. Then decide isolation versus
    systemic under the repaired gate.

  repairs_from_EXP_MLKEM_003:
    KN-TECH_030_reachability: >-
      Synthetic control CTRL-SYNTHETIC-BASELINE-INVISIBLE is G1-silent and
      G2-or-G3-visible by construction. class_marginal_information counts only
      findings the baseline did not produce; rediscovery of the known wolfSSL
      defect must never set a discriminating-power flag to true.
    mechanism_matched_second_impl: >-
      Selection preference prefers fixed-bound hand-written vector comparison
      tails. Length-parameterized verify routines (liboqs-style) are explicitly
      insufficient for the isolation question and may be measured only as a
      secondary reference, never as the load-bearing second implementation.

  inherited_objections_addressed:
    OBJ-001: Decapsulation-boundary tables mandatory; message-stability annotation retained.
    OBJ-002: Synthetic control makes widened-generator adequacy directly observable.
    OBJ-003: No conformance verdict without Algorithm-18 / public-decap evidence.
    OBJ-004: Seeds, digests, and first-key raw vectors archived under vectors/.
    OBJ-005: Strong named anchor required if retrievable; attempts recorded; in-tree self-vectors of the implementation under test may not be graded strong for that same implementation.
    OBJ-RT003-001: Second-impl selection constrained to fixed-bound hand-written tails.
    OBJ-RT003-002: Precedence repaired so isolation is a reachable world.
    OBJ-RT003-003: Build wall-clock must be inside recorded runs or explicitly staged as a pre-run with its own receipt; command.txt must be exact argv.
    OBJ-RT003-004: Anchor grade cites the file actually validated against.
    OBJ-RT003-005: Non-measurements labeled not_measured / refused_by_harness, never adjacent to clean zeros without that label.

  source_lock:
    wolfssl:
      repository: https://github.com/wolfSSL/wolfssl
      prefix_tag: v5.9.1-stable
      prefix_commit_peeled_expected: 1d363f3adceba9d1478230ede476a37b0dcdef24
      postfix_tag: v5.9.2-stable
      postfix_commit_peeled_expected: ac01707f552c611fbd135cc723b2682b3e7f80f2
      role: known_defective_detection_retention_control_and_patched_control
      established_by: EV-MLKEM-005
    second_implementation:
      selection_rule: >-
        Choose exactly one open-source ML-KEM implementation whose ciphertext
        comparison routine uses fixed-bound hand-written vector/SIMD comparison
        tails (a loop bound or iteration count that does not take the runtime
        length as the sole bound, or an assembly routine that compares a
        compile-time or ABI-fixed number of blocks plus an explicit remainder
        that can be mis-sized). Preference order: (1) BoringSSL ML-KEM assembly
        or fixed-bound compare if reachable; (2) PQClean ML-KEM with avx2 or
        aarch64 assembly comparison; (3) another pinned public implementation
        meeting the mechanism criterion. Explicitly insufficient as the
        load-bearing second implementation: length-parameterized portable or
        intrinsic verify that always covers len/vector_width full blocks plus
        a scalar remainder (the liboqs 0.12.0 path measured in EXP-MLKEM-003).
        Record repository, pin, mechanism evidence (file and symbol), why
        chosen, and why each higher preference was rejected.
      requirement: >-
        Both its comparison routine and its public decapsulation entry point
        must be reachable; if only one is reachable, scope the verdict and do
        not claim isolation.
    fips_203:
      publication_date: '2024-08-13'
      doi: 10.6028/NIST.FIPS.203
      normative_algorithms: [17, 18]

  inputs:
    parameter_sets:
      ML-KEM-512: {ciphertext_bytes: 768}
      ML-KEM-768: {ciphertext_bytes: 1088}
      ML-KEM-1024: {ciphertext_bytes: 1568}
    keys_per_parameter_set: 4
    seed_policy: >-
      Four recorded seeds per parameter set. Seeds, ciphertext SHA-256, and
      shared-secret SHA-256 archived for every key; first key per parameter set
      archived as raw bytes under experiments/EXP-MLKEM-004/vectors/.
    synthetic_control:
      id: CTRL-SYNTHETIC-BASELINE-INVISIBLE
      construction: >-
        A harness-side comparator that, for a designated silent region R of the
        ciphertext (default: the final 32 bytes of ML-KEM-1024, indices
        1536..1567), returns equal for every single-byte difference confined to
        R, and returns unequal for at least one seeded multi-byte coordinated
        pattern in R (G2) and for at least one alignment/lane-boundary pattern
        in R (G3). Outside R, the comparator is exact. The comparator must not
        modify any library.
      pass_condition: >-
        G1 silent set on the synthetic control equals R (or a documented
        superset confined to R); G2_minus_G1 or G3_minus_G1 attributable to the
        synthetic control is non-empty; the known wolfSSL defect remains
        separately detected.
    generator_classes:
      G1_single_byte:
        description: xor 0x01 and xor 0xff at every ciphertext index.
      G2_multi_byte:
        description: >-
          Seeded coordinated flips of k contiguous and k scattered bytes for k
          in [2, 4, 8, 16], plus whole 16/32/64 byte block inversions, at seeded
          offsets covering the full length.
      G3_alignment:
        description: >-
          Mutations at every 16, 32, and 64 byte boundary index, at the last
          byte of each aligned block, and at the final partial block.
      G4_malformed_length:
        description: >-
          Truncated by 1/16/32 and extended by 1/16/32 bytes, submitted only to
          the public API. Never counted as a comparison omission.
      G5_key_dependence:
        description: Every class of G1 through G4 replayed across all four keys.
    probe_levels:
      primitive: Ciphertext comparison routine of each backend.
      decapsulation: Public decapsulation API versus honest shared secret and implicit rejection.

  controls:
    - id: CTRL-SYNTHETIC-BASELINE-INVISIBLE
      method: Run G1, G2, and G3 against the synthetic harness comparator before any library conclusion.
      pass_condition: >-
        Undetected by G1 on region R and detected by G2 or G3 with non-empty
        marginal findings attributable to R.
    - id: CTRL-POSITIVE-CONTROL-RETAINED
      method: Run every generator class against wolfSSL v5.9.1 AVX2.
      pass_condition: >-
        Every class reaching 1536..1567 detects that omission at the primitive
        level; decapsulation accepts at least one mutated ciphertext in that
        region.
    - id: CTRL-NEGATIVE-HARNESS
      method: Retain the deliberately truncated harness comparator from EXP-MLKEM-002/003.
      pass_condition: Each class flags exactly the omitted range it can reach.
    - id: CTRL-BACKEND-ATTESTATION
      method: >-
        Attest each backend by build configuration, symbol or disassembly
        evidence, and at least one decapsulation-boundary measurement for every
        backend receiving a conformance verdict.
      pass_condition: No verdict on an unattested or primitive-only backend.
    - id: CTRL-STRONG-ANCHOR
      method: >-
        Validate against NIST ACVP ML-KEM encapDecap vectors if retrievable, or
        an in-tree KAT that is not shipped by the same implementation under
        test when grading that implementation strong.
      pass_condition: >-
        Anchor named and graded. For an implementation under test, its own
        shipped vectors may be used only as weak or in_tree_self. Downloaded
        but unused NIST files must not upgrade the grade.
    - id: CTRL-MESSAGE-STABILITY
      method: Annotate each decapsulation accept with whether the mutated ciphertext still decrypts to the honest message.
      pass_condition: Accepts coincide with message-stable mutations, or every exception is enumerated.
    - id: CTRL-MECHANISM-MATCHED-SECOND-IMPL
      method: >-
        Record mechanism evidence (file, symbol, bound type) for the chosen
        second implementation; reject length-parameterized-only verify as the
        load-bearing second implementation.
      pass_condition: >-
        Selection rationale and mechanism evidence present, or second_impl_unavailable
        recorded after exhausting preference order with attempts.
    - id: CTRL-LENGTH-TABLE-SEPARATION
      method: Record every G4 result in a dedicated malformed-length table.
      pass_condition: No malformed-length result appears in any silent set.
    - id: CTRL-EXACT-COMMAND-AND-BUILD-ACCOUNTING
      method: >-
        Every run's command.txt is exact executable argv. Library clone/configure
        /build wall-clock is either inside a recorded run or in a separately
        archived pre-run stage with its own timing receipt referenced by the
        run manifests.
      pass_condition: No descriptive pipe-notation command strings; no silent build reuse without disclosure and timing.

  metrics:
    primary:
      - id: synthetic_control_marginal_detection
        definition: Whether G2_minus_G1 or G3_minus_G1 attributable to the synthetic control is non-empty.
        decision_use: Decide instrument adequacy under the repaired definition.
      - id: known_defect_detection_by_class
        definition: Per class, whether the known v5.9.1 AVX2 omission is detected.
        decision_use: Detection retention.
      - id: new_silent_indices
        definition: Reproducible silent indices not already in EV-MLKEM-005, per target/backend/parameter set/class.
        decision_use: Isolation versus systemic.
      - id: decapsulation_accept_on_mutation
        definition: Count of mutated equal-length ciphertexts whose decapsulation returns the honest shared secret.
        decision_use: Bind primitive findings to the API boundary.
      - id: second_impl_mechanism_match
        definition: Boolean plus evidence that the second implementation uses fixed-bound hand-written vector tails.
        decision_use: Whether the isolation question was actually asked.
      - id: anchor_grade
        definition: strong, weak, or in_tree_self, with the file actually validated against named.
        decision_use: Qualify differential reference strength.
      - id: class_marginal_information
        definition: >-
          Findings attributable to G2, G3, or G4 that G1 did not produce.
          Rediscovery of the known wolfSSL defect MUST NOT be counted and MUST
          NOT set any added-discriminating-power flag to true.
        decision_use: Instrument adequacy and honesty.
    secondary:
      - mutations_executed_per_class
      - coverage_accounting_per_class
      - message_stability_annotations
      - second_implementation_selection_rationale
      - build_and_attestation_evidence
      - per_stage_wall_clock_seconds
      - peak_memory_gb

  replication:
    seeds: [1, 2, 3, 4]
    seed_policy: Deterministic; multi-byte offsets seeded and recorded.
    independent_instances: 4
    replication_rule: A finding is reportable only if it reproduces across at least two keys within its class.
    planned_runs:
      - id: RUN-MLKEM-013
        purpose: >-
          Clone/configure/build all targets (wall-clock inside this run or a
          referenced pre-run receipt), attest backends, construct and verify the
          synthetic control's G1-silent/G2-visible property, select and pin the
          mechanism-matched second implementation, establish and grade the
          conformance anchor against the file actually used.
      - id: RUN-MLKEM-014
        purpose: Run G1, G2, and G3 at the primitive level across all targets, synthetic control, negative harness, and retained known defect.
      - id: RUN-MLKEM-015
        purpose: Decapsulation-boundary probe for every target and class, message-stability annotation, and G4 malformed-length table.
      - id: RUN-MLKEM-016
        purpose: Cross-implementation comparison, coverage accounting, vector archival, and outcome classification under repaired precedence.
    expected_run_count: 4
    agreement_gate: >-
      A silent index or accept is reportable only if primitive and decapsulation
      observations are consistent or their inconsistency is explicitly recorded.

  outcome_classification:
    precedence:
      - invalid_harness_or_dispatch
      - positive_control_undetected
      - synthetic_control_inadequate
      - systemic_incomplete_comparison
      - second_impl_unavailable
      - generator_hardening_insufficient
      - isolated_to_audited_commits
    invalid_harness_or_dispatch: >-
      A required build fails, a backend cannot be attested, no anchor can be
      established, exact-command or build-accounting control fails, or the
      decapsulation probe cannot be reached for a target that would otherwise
      receive a verdict.
    positive_control_undetected: >-
      A generator class reaching 1536..1567 fails to detect the known v5.9.1
      AVX2 omission, or the negative harness is not flagged.
    synthetic_control_inadequate: >-
      The synthetic control is detected by G1, or its designated G2/G3 patterns
      do not produce a non-empty marginal set. The repair itself failed.
    systemic_incomplete_comparison: >-
      A reproducible silent index or equal-length decapsulation accept appears
      in a wolfSSL post-fix backend or in the mechanism-matched second
      implementation. Stop, record exact target/commit/backend/parameter set/
      class/index list, escalate. Construct no exploitation path.
    second_impl_unavailable: >-
      Preference order exhausted without a buildable mechanism-matched second
      implementation. Record attempts. WolfSSL-only lines may still be reported
      but isolation across implementations is not claimed.
    generator_hardening_insufficient: >-
      The synthetic baseline-invisible control is not detected by G2 or G3
      (empty marginal attributable to the synthetic control). Isolation is not
      licensed. Rediscovery of the known wolfSSL defect is irrelevant to this
      class and must not prevent it from firing when the synthetic control is
      missed, nor cause it to fire when the synthetic control is detected.
    isolated_to_audited_commits: >-
      Synthetic control is G1-silent and G2-or-G3-detected; known defect and
      negative harness are detected; no new reproducible silent index or accept
      appears on any other target under any class; mechanism-matched second
      implementation was measured.

  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 5400
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_processes: 4
    network_operations: source_retrieval_and_package_install_only
    deployed_system_queries: 0
    mutation_cap_per_target_parameter_set: 20000
    stages:
      - id: build_select_anchor_synthetic
        wall_clock_seconds: 1800
        stop_rule: >-
          If no mechanism-matched second implementation can be built, record
          attempts and continue wolfSSL lines; classify second_impl_unavailable
          if isolation would otherwise be claimed.
      - id: primitive_multiclass_grid
        wall_clock_seconds: 1500
        stop_rule: Stop at mutation cap; record coverage as partial for that class.
      - id: decapsulation_boundary_and_length
        wall_clock_seconds: 1200
        stop_rule: Stop at the cap; a partial API table is infrastructure signal, not a null.
      - id: comparison_and_packaging
        wall_clock_seconds: 900
        stop_rule: Stop without interpretation if any required artifact is incomplete.

  stopping_rules:
    - Stop and escalate immediately on any reproducible silent index or accept outside the known v5.9.1 defect; do not characterize further, do not build an exploitation path, contact no third party.
    - Stop the cross-implementation line and record second_impl_unavailable if no mechanism-matched implementation can be built within its stage budget.
    - Stop after the four planned runs; no exploratory fifth run.
    - Stop before any key recovery, oracle construction, query chaining, or attack-cost estimation.
    - Stop before touching any system, network endpoint, or key not created inside this experiment.
    - Stop at 5400 total wall-clock seconds, 2.0 CPU-hours, or 4 GB resident memory.

  invalidation_rules:
    - Any run lacks its exact command (exact argv), commit and dirty state, environment, dependency and compiler versions, timestamps, resource use, stdout, stderr, raw result, summary, or inference metadata.
    - Expected run count is not exactly four or a planned run has no terminal status.
    - A conformance verdict is issued for a backend without decapsulation-boundary evidence.
    - Library comparison logic, buffer lengths, or dispatch conditions were modified.
    - Malformed-length results are counted as comparison omissions.
    - A finding is reported without reproduction across at least two keys.
    - The synthetic control, known-defect positive control, or negative harness is omitted.
    - Rediscovery of the known wolfSSL defect is counted as class_marginal_information or used to set an added-discriminating-power flag true.
    - A length-parameterized-only verify routine is treated as the load-bearing mechanism-matched second implementation.
    - An implementation is graded strong against vectors shipped inside itself.
    - Descriptive/stylized command.txt strings are used in place of exact argv.
    - Library builds are silently reused from a prior experiment without disclosure and timing attribution.
    - Any result is described as an exploit, an attack, or a disclosure-ready vulnerability claim.
    - A build, clone, toolchain, or emulator failure is interpreted as evidence about implementation correctness.

  success_criterion: >-
    The protocol succeeds as an audit if all four runs reach terminal status,
    the synthetic control's G1-silent/G2-or-G3-visible property is demonstrated,
    the known defect and negative harness are detected, every conformance
    verdict rests on attested decapsulation-boundary evidence, the anchor is
    named and honestly graded, coverage is accounted per class, exact commands
    and build accounting pass, and the outcome is uniquely classified under the
    repaired precedence. H-MLKEM-004 is supported within this laboratory
    boundary only under isolated_to_audited_commits.
  falsification_criterion: >-
    H-MLKEM-004 is falsified if a reproducible silent index or equal-length
    decapsulation accept appears in a wolfSSL post-fix backend or in the
    mechanism-matched second implementation. The hardening repair itself is
    falsified under synthetic_control_inadequate or
    generator_hardening_insufficient. Infrastructure failure falsifies nothing.

  required_artifacts:
    - experiments/EXP-MLKEM-004/source-lock.yaml
    - experiments/EXP-MLKEM-004/implementation/build_matrix.sh
    - experiments/EXP-MLKEM-004/implementation/multiclass_generator.py
    - experiments/EXP-MLKEM-004/implementation/synthetic_control.py
    - experiments/EXP-MLKEM-004/implementation/conformance_probe.c
    - experiments/EXP-MLKEM-004/implementation/decap_boundary_probe.c
    - experiments/EXP-MLKEM-004/implementation/run_experiment.py
    - experiments/EXP-MLKEM-004/analysis/second_implementation_selection.md
    - experiments/EXP-MLKEM-004/analysis/class_coverage_report.json
    - experiments/EXP-MLKEM-004/analysis/malformed_length_table.json
    - experiments/EXP-MLKEM-004/analysis/synthetic_control_report.json
    - experiments/EXP-MLKEM-004/vectors/README.md
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/manifest.yaml
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/command.txt
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/environment.json
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/raw.json
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/summary.json
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/stdout.txt
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/stderr.txt
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-014/manifest.yaml
