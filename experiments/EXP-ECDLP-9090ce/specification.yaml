# =============================================================================
# EXP-ECDLP-9090ce -- VERSION 1 (APPROVED by DEC-20261004-b76b5a)
# Graded-omega exchange law Stages 0-1 instrument for H-ECDLP-42f434 /
# IDEA-20261003-0c5564: Stage 0 zero-run worksheet; Stage 1 planted NULL-1
# pipeline (M1-M5). Sibling of EXP-ECDLP-02bd1c and EXP-ECDLP-9e8926.
# ZERO RUNS in this design packet.
# No Magma/Sage/AUXIN/Bedrock. No GOAL-ECDLP2M-001.yaml edit.
# Quote any string containing the substring "run:" .
# =============================================================================
experiment:
  id: EXP-ECDLP-9090ce
  hypothesis_id: H-ECDLP-42f434
  question_id: RQ-ECDLP-bc7a54
  question_ids:
    - RQ-ECDLP-bc7a54
  source_idea: IDEA-20261003-0c5564
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    No goal head is edited. GOAL-ECDLP2M-001.yaml is out of write-scope.
  version: 1
  title: >-
    Stage 0 Lemma V / G1-G3 / phase-diagram worksheet; Stage 1 Python planted
    NULL-1 pipeline for tau-hat, hit-rate H1, Lemma V, kangaroo/rho, and
    biased-offset controls on executed n_bits 16..20
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-04'
  approval_decision: DEC-20261004-b76b5a
  packaging_only: false
  designed_at: '2026-10-04'
  frozen: true
  frozen_at: '2026-10-04'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261004-b76b5a under AGENTS.md standing user
    authorization (2026-09-06). Trial-plan-v1 admits Stages 0-1 only.
    No Magma/Sage/AUXIN/Bedrock. No Stage 2 (curve D_x / j=0 hit-rate arm);
    that is idea Stage 2 deferred to a successor DEC.
  execution_surface:
    trial_plan: experiments/EXP-ECDLP-9090ce/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-ECDLP-9090ce/implementation/run.py --stage 0
      --trial-plan experiments/EXP-ECDLP-9090ce/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-ECDLP-9090ce/implementation/run.py --stage 1
      --trial-plan experiments/EXP-ECDLP-9090ce/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. {run_dir} is substituted by
      the process supervisor. trial-plan.json is a byte-identical twin of
      trial-plan-v1.json.
  approval:
    approval_decision: DEC-20261004-b76b5a
    composing_decision: DEC-20261004-b76b5a
    rule: >-
      Approved under AGENTS.md "Standing user authorization for ideas and
      experiments" (user, 2026-09-06: "all is approved. ideas/experiments should
      be always approved") once the protocol was complete. Approval does not
      assert the hypothesis is true. Stages 0-1 only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      section: Standing user authorization for ideas and experiments
      instruction_date: '2026-09-06'
      quotation: 'all is approved. ideas/experiments should be always approved'
      renewed_user_approval_required: false

  objective: >-
    Decide, on a planted generic-group null at executed n_bits 16..20, whether
    the graded partial-omega exchange law matches measured tau-hat within 0.07
    with geometric hitting (O-LAW-HOLDS), or else a shape-dependent hitting
    defect (O-SHAPE-EFFECT) or instrument artifact is localised, after a
    zero-run Stage-0 worksheet that freezes Lemma V, G1-G3, the phase diagram,
    and the pricing table.

  class: heuristic-validation
  class_note: >-
    Heuristic-validation of H1 (shape-independent hitting) and of the
    G1-G3 cost bookkeeping at toy scale, with Lemma V as the exact total-omega
    control. No exponent-moving claim. Planted oracles are not hint families.

  claim_tier_and_scope:
    claim_tier: toy
    statement: >-
      Planted-oracle bookkeeping on keyed relabelled Z/n at n_bits {16,18,20}.
      No discrete-logarithm solve of a curve. No deployed curve. No natural
      omega is claimed to exist.
    sota_delta: zero on every ECDLP cost axis
    dominated_by: rho / van Oorschot-Wiener at 0.886 sqrt(n)
    certificate_kind: scalar_mul_check
    certificate_note: >-
      Every recovered log is re-verified by independent [k]g == Q on Z/n
      (k == label-decoded exponent). No elliptic-curve DL certificate.
    affected_vs_safe: No deployed or standardized curve is touched.

  scope:
    included:
      - 'Stage 0 (zero scientific trials): Lemma V, G1-G3, phase diagram, pricing table, alpha=1 ceiling, H1-H3, executed-taper disclosure, self-checks, precommit hashes'
      - 'Stage 1: planted NULL-1 pipeline; M1 tau-hat on three executed cells; M2 shape arm; M3 Lemma V; M4 kangaroo/rho; M5 biased-offset'
    excluded:
      - Stage 2 curve D_x hit-rate and j=0 beta-closed factor-3 arm
      - Magma/Sage/AUXIN/Bedrock success paths
      - Deployed curves and cryptographic n
      - Editing GOAL-ECDLP2M-001.yaml or IDEA-20261003-0c5564
      - Algebraic-omega A(1) census (sibling EXP-ECDLP-02bd1c)
      - Spectral C(E)/tau certificate (sibling EXP-ECDLP-9e8926)

  stages:
    stage_0:
      name: Zero-run Lemma V / G1-G3 / phase-diagram worksheet
      deliverables:
        - stage0/preregistered-predictions.json
        - stage0/lemma-v.yaml
        - stage0/exchange-law.yaml
        - stage0/phase-diagram.yaml
        - stage0/pricing-table.yaml
        - stage0/h1-prediction-table.yaml
        - stage0/precommit-hashes.json
        - stage0/selfchecks.json
      blocks_stage_1_until: >-
        Stage-0 self-checks pass and precommit-hashes.json is written BEFORE
        any planted trial. A failed self-check halts Stage 1.
    stage_1:
      name: Python planted NULL-1 pipeline (M1-M5)
      deliverables:
        - stage1/cells.yaml
        - stage1/census.json
        - stage1/decision-rules.json
        - RESULTS.md

  freeze:
    n_bits_declared: [22, 24, 26]
    n_bits_executed: [16, 18, 20]
    alpha_grid_declared: [0.55, 0.6, 0.7, 0.8]
    beta_grid_declared: [0.1, 0.3, 0.5, 0.7]
    m1_cells_executed:
      - {alpha: 0.7, beta: 0.2}
      - {alpha: 0.8, beta: 0.5}
      - {alpha: 0.6, beta: 0.3}
    targets_per_cell_declared: 30
    targets_per_cell_executed: 10
    m2_first_hits_declared: 1000
    m2_first_hits_executed: 200
    r_adding: 16
    s_success: 0.9
    kangaroo_cutoff_c: 4
    tau_abs_tol: 0.07
    m2_band: [0.8, 1.25]
    m4_rel_tol: 0.10
    m5_ratio_band: [2.5, 6.0]
    seeds_base: 2026105564
    gamma_planted: 0.0
    kappa_planted: 0.0
    ratio_note: >-
      Executed n_bits and cell/target counts are a disclosed Python wall-clock
      bound, not a silent change of H1/M1 thresholds. Discriminators are read
      at executed scale only.

  inputs:
    n_bits_executed: [16, 18, 20]
    m1_cells_executed:
      - {alpha: 0.7, beta: 0.2}
      - {alpha: 0.8, beta: 0.5}
      - {alpha: 0.6, beta: 0.3}
    implementation: experiments/EXP-ECDLP-9090ce/implementation/run.py

  controls:
    - 'NULL-1 keyed relabelled Z/n (blocking; all of Stage 1)'
    - 'beta=0 kangaroo 2 sqrt(n) and rho 0.886 sqrt(n) within 10 percent (M4)'
    - 'Lemma V arm at beta=1 with planted exact omega; false certificates forced 0 (M3)'
    - 'Biased-offset nearby-object control; G2 must beat uniform by factor in [2.5, 6] (M5)'
    - 'Decay across executed n_bits {16,18,20}'
    - 'Oracle keys committed in Stage 0 before any target is drawn'
    - 'Timeouts/crashes are O-IMPEDIMENT, never O-LAW-HOLDS / O-SHAPE-EFFECT'

  independent_variables:
    - n_bits in {16, 18, 20}
    - arm in {G1, G2, G3}
    - cell (alpha, beta)
    - D shape in {random, interval, lowweight}
    - offset in {uniform, biased}

  metrics:
    primary:
      - tau_hat
      - tau_law
      - hit_rate_ratio
      - lemma_v_false_certs
      - outcome_label
    secondary:
      - kangaroo_mean_over_2sqrt
      - rho_mean_over_0_886sqrt
      - biased_offset_ratio
      - peak_rss_bytes
      - group_ops_walk
      - group_ops_finish
      - peak_words

  heuristic_under_test: H1
  preregistered_prediction:
    quantity: tau-hat per (alpha, beta, arm) and first-hit ratio versus |D|/n
    formula: >-
      tau_chi = max(1-alpha, (1-beta)/2); tau_claw = 1-(alpha+beta)/2 if
      beta <= alpha else 1-alpha; tau_kang = 1-alpha+(1-beta)/2;
      hit-rate ratio in [0.8, 1.25]; kangaroo 2 sqrt(n); rho 0.886 sqrt(n);
      biased G2 ratio about 4
    source: >-
      IDEA-20261003-0c5564 predictions and minimal_test, copied 2026-10-04;
      executed taper for n_bits and cell counts disclosed in freeze
  scale_relevance:
    tier: toy
    justification: >-
      Executed n_bits {16,18,20} on Z/n. Transfer to declared {22,24,26} or
      to cryptographic n is not claimed. Planted oracles do not exist on
      elliptic curves.
    correspondence: null
  tail_checks:
    - Lemma V false-certificate count must be 0
    - Biased-offset G2 must beat uniform
    - M2 1-percent quantile of scaled first-hit times reported (trapping tell)

  replication:
    seeds_base: 2026105564
    independent_instances: 'per-cell planted targets; n_bits are the replication axis'
    replication_note: Executed taper disclosed above; declared counts remain the idea's.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - 'Stage 0 completes or Stage 1 does not start'
    - 'Lemma V false certificate yields O-ARTIFACT and stops scoring'
    - 'M4 or M5 miss yields O-ARTIFACT'
    - 'A crash, timeout, or memory abort is O-IMPEDIMENT / failed_infrastructure'
    - 'Stop after Stages 0-1; do not start Stage 2'

  invalidation_rules:
    - Dual meters / a different tau_law implementation than the Stage-0 freeze
    - Magma, Sage, AUXIN, or Bedrock is selected as a success path
    - H1 / tau thresholds are edited after any Stage-1 read
    - 'IDEA-20261003-0c5564 or GOAL-ECDLP2M-001.yaml is edited'
    - Oracle keys drawn from the same stream as targets (leakage)

  success_criterion: >-
    Stage 0 self-checks pass. Stage 1 emits exactly one of O-LAW-HOLDS,
    O-SHAPE-EFFECT, O-INCONCLUSIVE, O-ARTIFACT, O-IMPEDIMENT from the frozen
    decision rules, with census tables and controls archived.

  falsification_criterion: >-
    O-LAW-HOLDS is false under the idea's F1 or F2. Audit or planted-control
    failures void the run (O-ARTIFACT).

  outcome_table:
    O-LAW-HOLDS: M1 within 0.07 at every executed cell; M2 in band; M3/M4/M5 pass
    O-SHAPE-EFFECT: M2 out of band for a log-structured D at largest executed n
    O-INCONCLUSIVE: controls pass but neither HOLD nor SHAPE decides cleanly (e.g. M1 misses without 3-cell CI exclusion)
    O-ARTIFACT: Lemma V false cert, M4 miss, M5 miss, or key-commitment failure
    O-IMPEDIMENT: timeout, crash, incomplete discriminator; not a mathematical result

  required_artifacts:
    - experiments/EXP-ECDLP-9090ce/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-9090ce/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-9090ce/runs/<RUN-ID>/RESULTS.md
    - experiments/EXP-ECDLP-9090ce/stage0/preregistered-predictions.json
    - experiments/EXP-ECDLP-9090ce/stage0/precommit-hashes.json
    - experiments/EXP-ECDLP-9090ce/stage1/census.json
  required_artifacts_note: >-
    Supervisor-generated files per trial (launch.json, execution-receipt.json,
    command.txt, environment.json, stdout.log, stderr.log, check.stdout.log,
    check.stderr.log) are reserved to the process supervisor.

  assigned_to: executor
  amazon_bedrock: NOT SELECTED
  out_of_scope:
    - Magma or Sage tabulated discrete logs
    - AUXIN records
    - 'Any "run: Magma" success path'
    - GOAL-ECDLP2M-001.yaml
    - Stage 2 curve D_x / j=0 arm
    - Deployed curves
