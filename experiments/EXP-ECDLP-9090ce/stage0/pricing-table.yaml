pricing_table:
  - row: Dx no omega
    vector: [alpha, 0, null, 0]
    tau: 0.5
    source: docs/n13-ecdlp-hint-family.md section 7 recognizable column
  - row: Dx promised-input omega
    tau: 'max(1-alpha, gamma)'
    n13_target: 'alpha=2/3, gamma<=1/3'
    source: IDEA-20261003-0c5564 pricing table / note section 7
  - row: interval of logs or Dw
    gamma: alpha/2
    tau: '1-alpha/2 > 1/2 for alpha<1'
    source: IDEA-20261003-0c5564 invertible column
  - row: anomalous
    vector: [1, 1, o(1), 0]
    tau: o(1)
    source: KR-RHO-53c89f
  - row: small embedding degree
    tau: subexponential in p^k
    source: KR-RHO-53c89f MOV corner
  amazon_bedrock: NOT SELECTED
