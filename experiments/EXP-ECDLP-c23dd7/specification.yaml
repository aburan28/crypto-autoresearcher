  designed_under_task: TASK-20260913-93d5c1
  source_proposal: IDEA-20260815-e05d09
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  objective: >
    Evaluate the exact identities
    that the reachable marked rate
    is 2/3, reject the 2/4 claim,
    and refuse to merge the unmarked
    pair into the marked
    denominator.
  preregistered_prediction:
    quantity: >
      Stage 0 instrument: 2/3 among
      reachable marked; KF 2/4
      rejected; NULL unmarked not
      merged.
    formula: >
      rate = verifies / (verifies +
      fails); unreachable excluded.
      2 / (2+1) = 2/3.
    source: IDEA-20260815-e05d09 mechanism (internal)
    claim_tier: observational
  inputs:
    fixture:
      real_sample:
        marked:
          - {id: M1, verdict: verify}
          - {id: M2, verdict: verify}
          - {id: M3, verdict: fail}
          - {id: M4, verdict: unreachable}
        rate_among_reachable_num: 2
        rate_among_reachable_den: 3
        must_not_use_4_as_denominator: true
      known_false:
        kind: rate_is_two_over_four
        claimed_num: 2
        claimed_den: 4
        must_reject: true
      matched_null:
        kind: unmarked_separate_category
        unmarked:
          - {id: U1, verdict: verify}
          - {id: U2, verdict: fail}
        must_not_merge_into_marked_denominator: true
  controls:
    - name: known_false_two_over_four
      object: KF claim marked rate is 2/4
    - name: matched_null
      object: unmarked pair as a separate category
  independent_variables:
    - verdict
    - marked
  metrics:
    primary:
      - fixture_pass
      - real_two_over_three_pass
      - known_false_two_over_four_pass
      - null_unmarked_separate_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - real_two_over_three_pass
    - known_false_two_over_four_pass
    - null_unmarked_separate_pass
  secondary_metrics: []
  seeds: []
  replication:
    seeds: []
    independent_instances: 0
  replication_plan: >
    One Stage 0 run. Deterministic
    fraction arithmetic. No sampling.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after the four gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Fetching a primary source or re-scoring a live citation_verified entry invalidates Stage 0.
  success_criterion: >
