experiment:
  id: EXP-MULTIV-6e5d90
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-e810c8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-e810c8
  question_id: RQ-SNOVA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive enumeration of the key-generation fibre at tiny parameters for a SNOVA-shaped
    key, a flattened plain-UOV null and a random-map control, with a closed-form stabiliser prediction
    per arm.
  objective: 'The uncertainty reduced is how many distinct secret oil objects are consistent with
    a single public key, and whether the structured schemes multiply that number. Stated as parts:
    (i) the run enumerates every candidate at cells small enough for exhaustion, verifying completeness
    against the closed-form haystack count, so the resulting fibre size is exact rather than estimated
    and carries no sampling interval at all; (ii) it runs the identical enumeration against a flattened
    plain-UOV key of the same dimensions and against a random quadratic map with no planted module,
    both in the same invocation, so that the baseline is executed and the forced zero proves the annihilation
    test discriminates; (iii) it computes, per algebra, a closed-form prediction for the fibre size
    as the baseline times a stabiliser order, and reports the ratio of measured to predicted, retaining
    the transformations relating fibre members so that the group-structure half of the claim is testable
    rather than asserted. The run recovers nothing, searches for nothing, and supplies no method for
    locating any fibre member; its output is a small table of exact integers and one ratio per cell.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: at the named tiny parameters
      and under the recalled transform definitions, the key-generation fibre has exactly the enumerated
      cardinality in each arm, the enumeration was complete against its closed-form haystack count,
      and the measured-to-predicted ratio is as reported. What does NOT follow: no attack, no search
      method, no cost statement, and no security consequence of any fibre size; nothing about parameters
      where enumeration is impossible, which includes every deployed parameter set; and no claim that
      a fibre excess persists, grows, or is exploitable at any larger scale.'
  inputs:
    procedure: 'STAGE 0, cell selection (cost: human): choose cells whose closed-form haystack count
      is below 10^7 and record those counts before writing any iterator. STAGE 1, enumerator build
      (cost: medium): subspace and submodule iterators with a completeness assertion against the closed-form
      counts. STAGE 2, gating controls (cost: seconds): random-map control must give fibre 0; planted
      module must appear in every structured and null arm. STAGE 3, enumeration (cost: minutes to
      hours per cell): count fibre members for each arm, retaining members for the group-structure
      analysis. STAGE 4, stabiliser computation (cost: minutes): compute the predicted order per algebra
      in closed form and compare. STAGE 5, first-success consistency check (cost: minutes): 100 randomly
      permuted enumerations per arm, comparing mean candidates before success against haystack divided
      by t. STAGE 6, invariance control and reporting (cost: minutes): random change of basis, then
      the table of measured, predicted and ratio per cell.'
    instrument: Python 3 with exact F_q arithmetic via precomputed tables for q in {2, 3, 4}; subspace
      enumeration by canonical reduced-row-echelon iteration so that each subspace is visited exactly
      once, with the visit count asserted against the Gaussian binomial; submodule enumeration by
      the analogous canonical form over the algebra; annihilation testing as a separate module receiving
      only the public map and a candidate basis. No computer algebra system and no Sage. Driven by
      harness/runner.py for seeds and manifest.
    parameters: q in {2, 3, 4}; flattened n in {6, 8, 9}; oil dimension o in {2, 3}; SNOVA-style algebra
      dimension ell in {2, 3}; quotient degree deg f in {2, 3} for the QR-UOV-shaped arm; whipping
      k = 2 for the MAYO-shaped arm; equation count m in {2, 3}. Cells are admitted only if the closed-form
      haystack count is at most 10^7, which excludes q = 4 with n = 9 and o = 3 and this exclusion
      is recorded rather than silently dropped. 20 independent keys per arm per cell.
  controls:
  - Flattened plain-UOV null at identical dimensions, enumerated by the identical routine in the same
    invocation.
  - Random-map control with no planted module, whose fibre must be exactly 0.
  - 'Enumeration completeness control: the number of candidates visited must equal the closed-form
    Gaussian binomial or submodule count exactly, catching an incomplete iterator.'
  - 'Change-of-basis invariance control: apply a random invertible transformation to both key and
    module and confirm the fibre size is unchanged.'
  - 'Planted-module positive control: the planted module must appear among the enumerated fibre members
    in every arm, or the enumeration is skipping valid candidates.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a plain UOV public key over F_q at the flattened
    dimensions of the structured key, with the identical oil dimension, enumerated by the identical
    routine in the same invocation. Its fibre size is the baseline t_0 against which the structured
    t is read. For the structured measurement to mean anything, the null must yield t_0 equal to the
    value forced by the plain-UOV symmetry group at those dimensions - a number computable in closed
    form - and if the null does not reproduce its own forced value, the enumeration or the annihilation
    test is wrong and no structured number may be read. A second null uses a uniformly random quadratic
    map with no planted oil module, whose fibre must be exactly 0.'
  independent_variables:
  - scheme arm (SNOVA-shaped, QR-UOV-shaped, MAYO-shaped, flattened plain UOV, random map)
  - field size q
  - flattened dimension n
  - oil dimension o
  - algebra dimension ell
  metrics:
    primary:
    - exact fibre cardinality t per key
    - candidates visited versus closed-form haystack count
    - closed-form stabiliser prediction
    - ratio of measured to predicted t
    secondary:
    - fibre as a fraction of the haystack
    - mean candidates before first success over 100 permutations
    - transformations relating fibre members
    - per-key dispersion of t within an arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The cardinality t of the key-generation fibre per arm and per cell, and its ratio to
      the closed-form stabiliser prediction.
    formula: 'Predicted fibre size for a structured arm over algebra A: t_A = t_0 * |Stab_A|, where
      t_0 is the measured fibre of the flattened plain-UOV null at identical dimensions and |Stab_A|
      is the order of the group of A-module automorphisms of the oil module that fix the public form,
      computed in closed form per algebra class (for A = F_{q^ell} the predicted factor is (q^ell
      - 1)/(q - 1) per free generator; for A = M_ell(F_q) the predicted factor follows from Morita
      equivalence). Predicted fibre for the random-map control: exactly 0. Predicted candidates visited:
      exactly the Gaussian binomial [n choose o]_q.'
    source: Pre-registered in the parent proposal IDEA-20260816-e810c8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Every cell is chosen so the entire candidate space is enumerable, with haystack
      below 10^7, which is what makes the fibre exact rather than sampled. This is the smallest scale
      at which the question has an answer at all, and it is also the largest at which it can be answered
      without a search heuristic that would import its own bias. No transfer to deployed parameters
      is claimed; the growth of the fibre with parameters is explicitly not measured and is listed
      as an open direction.
    correspondence: null
  tail_checks:
  - q = 2, where isotropic subspaces are most abundant and every fibre is largest
  - odd characteristic q = 3, to separate characteristic-2 form degeneracies from genuine multiplicity
  - the cell with the smallest oil dimension, where the fibre may collapse to the planted module alone
  - the excluded cell at the enumeration ceiling, recorded as not measured rather than as measured-zero
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - abort if any enumerator fails its completeness assertion
  - admit no cell whose closed-form haystack exceeds 10^7; an excluded cell is reported as not measured
  - stop after 20 keys per arm per cell, since t is exact per key and dispersion is the only sampled
    quantity
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every admitted cell yields an exact fibre cardinality for each arm with the enumeration
    verified complete, the random-map control yields exactly 0, the planted module appears in every
    fibre, and the measured-to-predicted ratio is reported per cell whatever its value.
  falsification_criterion:
  - Nonzero fibre for the random-map control.
  - Enumeration completeness assertion fails at any cell.
  - Planted module absent from an enumerated fibre.
  - Structured and null fibres equal at every cell.
  - Measured-to-predicted ratio differing from 1, which falsifies the stabiliser account while leaving
    the measured fibre intact.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-e810c8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The stabiliser group whose order is predicted is described but not derived; a Coordinator must
    have it written down explicitly per algebra class before approval, since the central comparison
    is meaningless otherwise.
  - Whether the structured arms should enumerate F_q-subspaces, A-submodules, or both is a modelling
    choice with a large effect on t and must be fixed, not left to the implementer.
  - The MAYO-shaped arm's oil object is a whipped module whose enumeration canonical form is not specified
    here.
  - RQ-SNOVA-001 constrains experiment design pending primary sources, and approval must address that
    explicitly.
