  # ---------------------------------------------------------------------------
  # OBJECT (reuses EXP-CERTBIN-e94b27 definitions by reference; n = 19 values)
  # ---------------------------------------------------------------------------
  object:
    by_reference: >-
      Ring B = F_2[v_0..v_19]/(v_i^2 + v_i), B_{<=d}, the Macaulay matrix M_D
      (conventions of EXP-CERTBIN-4e92d7 object.macaulay_matrix: row index =
      mu_index * neq + k; mu by degree ascending then ascending sorted index
      tuple; columns descending degrevlex, constant LAST; zero rows retained),
      the mutant closure W_D with its iteration and fixpoint rule, and
      "refuted by X iff 1 in X", are EXACTLY as frozen in EXP-CERTBIN-e94b27
      object (ring, macaulay_M_D, mutant_closure_W_D) with nv = 20, neq = 19,
      and j in 0..19 in rule (ii). The engine implements them as
      closure.Closure(nv, D, neq).macaulay_closure and .w_closure.
    field: >-
      F_{2^19} = F_2[t]/(t^19 + t^5 + t^2 + t + 1). Element <-> 19-bit integer,
      bit j = coefficient of t^j.
    curve: >-
      E: Y^2 + XY = X^3 + A X^2 + B, A = 46693, B = 306147, #E = 523646 =
      2 * 261823. E is cyclic of 2-power part 2, so the order-q subgroup is 2E
      and a subgroup target's x-coordinate lies in x(2E).
    factor_base_and_unknowns: >-
      V = span_F2{1, t, ..., t^9} (l = 10; the integers 0..1023).
      x_1 = sum_{j<10} v_j t^j, x_2 = sum_{j<10} v_{10+j} t^j, variables ordered
      v_0 > v_1 > ... > v_19.
    summation_polynomial: S_3(x_1, x_2, x_3) = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B (KN-TECH-b18366); x_3 = x_R.
    descended_system: >-
      Expand S_3(x_1, x_2, x_R) over F_{2^19} in v_0..v_19 and multilinearize.
      Equation k (k = 0..18) is the coefficient of t^k: a Boolean polynomial of
      degree <= 2 over the 1 + 20 + 190 = 211 multilinear monomials of degree
      <= 2. E_S3(x_R) is the 19 x 211 coefficient matrix.
    E_layout: >-
      A system is a 19 x 211 F_2 matrix E. Row k is f_k. Column j is the j-th
      monomial of mu_order(2, 20): degree ascending, then ascending sorted
      index tuple. Column 0 is the constant, columns 1..20 are v_0..v_19,
      columns 21..210 are the 190 pairs (i, j), i < j. E_hex is a list of 19
      hex integers, bit j (LSB first) = column j. This layout is written into
      the run report and every archive receipt (J1 F-1; DEC-20260924-e61f3b
      NA-5).
    parts: >-
      BILINEAR columns: the 100 pairs (i, 10 + j), i, j in 0..9. QUADRATIC
      columns 21..210. LINEAR columns 1..20. CONSTANT column 0. Coordinator
      reading (checked by C-SUPPORT, never a failure if false): E_S3(x_R) has
      nonzero entries only in bilinear, linear and constant columns; its
      quadratic part is phi_{x_R}(Q) with Q_s = sum_{i+j=s} v_i v_{10+j}
      (s = 0..18); its linear part is [x_R^2 t^{2j}]_k on v_j and v_{10+j}; its
      constant is bit k of B.
    affine_decomposition: >-
      E_S3(r) = E^0 + sum_{j=0..18} r_j E^j over F_2, with r = bits of x_R,
      E^0 = E_S3(0), E^j = E_S3(t^j) xor E^0. Exact, because x_R enters S_3
      only through x_R and x_R^2. Checked on every S_3 system (C-AFF19).
    union_support: >-
      U_k = supp(E^0_k) union (union over j of supp(E^j_k)). S_L = U cap
      (columns 0..20), in row-major order (k ascending, then column
      ascending): the "S_3 support" of the lower-degree bits. Upos =
      flatnonzero(U) in row-major order over the 19 * 211 layout.
    ell_and_rc_b: >-
      ell-substituted fall profile (RC-B), computed per system in phase 3,
      BEFORE any semi-regular prediction is scored:
      (1) Left kernel of the 19 x 190 quadratic-column submatrix, by the
          executor's own elimination. If its dimension is not 1, RC-B is "not
          applicable (kernel dim d)". Expected: dim 1 for S_3 and N-CONV19; for
          N-ELL19 dim >= 1 with e_18 in it (row 18 has no quadratic part; if
          dim > 1, use c = e_18 and record the dimension); dim 0 for N-F219 and
          N-AFF19 (recorded, not a failure if otherwise).
      (2) ell = sum_k c_k f_k for the kernel vector c. For S_3 and N-CONV19,
          c_k must equal Tr(t^k / x_R^2) (C-ELL).
      (3) If ell's linear part is zero: constant 1 -> label
          REFUTED-AT-DEGREE-2 (1 in M_2); constant 0 -> ELL-TRIVIAL. No
          substitution.
      (4) Otherwise j* = the least index in ell's linear support; pi sets
          v_{j*} := ell + v_{j*} (an affine form in the other variables); the
          remaining 19 variables are relabelled in ascending order as 0..18;
          pi(f_k) is reduced multilinearly. For S_3 with
          ell = v_0 + v_10 + Tr(B / x_R^2) this is v_0 := v_10 + Tr(B / x_R^2).
      (5) Record rank R'_3 = Closure(19, 3, 19).macaulay_closure and rank,
          one and dims_by_deg (d = 0..4) of R'_4 = Closure(19, 4, 19)
          .macaulay_closure on the 19 substituted equations.
          sigma = dims_by_deg(R'_4)[3] - 360. T5_applicable iff
          dims_by_deg(R'_4)[3] == rank R'_3. If applicable, the T5 prediction
          is: W_4 refuted iff 1 in R'_4; final_dim(W_4) = rank R'_4 + 1160;
          dim(W_4 cap B_{<=d}) = dims_by_deg(R'_4)[d] + dim B'_{<=d-1} with
          dim B'_{<=-1..3} = 0, 1, 20, 191, 1160.
      (6) Semi-regular reference profiles (Coordinator arithmetic from the
          RT-20260924-d95e70 J8 series, H-CERTBIN-e3ac93 mechanism):
          substituted (18 in 19) [0, 0, 18, 360, 3267], rank R'_3 = 360;
          unsubstituted M_4 (19 in 20) [0, 0, 19, 399, 3819], rank M_3 = 399.
          With T5 and the substituted reference: W_4 not refuted, final dim
          4427, dims_by_deg [0, 1, 38, 551, 4427], iterations_to_fixpoint 1.
    derived_per_instance: >-
      From the M_4 record: P = rank M_4 - dims_by_deg(M_4)[3] (rank of the
      degree-4 projection; L-TOP); fallen = dims_by_deg(M_4)[3];
      linear_forms = dims_by_deg(M_4)[1] - dims_by_deg(M_4)[0];
      syzygy_excess = 3819 - rank M_4 (0 for an exactly semi-regular system).
      Also, for S_3 and N-CONV19: ell_route = whether 1 is in
      rowspace(M_4) + ell * B_{<=3} (one extra elimination; secondary).
    closures_run: >-
      M_3 = Closure(20, 3, 19).macaulay_closure and M_4 =
      Closure(20, 4, 19).macaulay_closure (flat certificate if refuted) on
      every kept system; W_4 = Closure(20, 4, 19).w_closure on every kept
      system (engine record; its flat certificate is kept but NEVER counted
      toward W_4 unless max |mu| <= 2), plus a wdag-v1 certificate on every
      W_4 refutation; rc_b (R'_3, R'_4) on every system where it applies;
      W'_4 = Closure(19, 4, 19).w_closure on the substituted system for the
      C-T4 subsets; ann-v1 on the C-NONREF set. NO closure with D >= 5.
    certificate_format: >-
      certificates.jsonl.gz, one line per (system, closure, format), with keys
      key, closure, format and the body.
      FORMAT flat-v1: C = sorted list of (mu as sorted index list, k); claim
      sum_{C} mu*f_k = 1 in B. It certifies unsatisfiability and 1 in
      rowspace(M_{2 + max|mu|}). It counts toward M_4 only when max |mu| <= 2,
      and NEVER toward W_4 unless max |mu| <= 2 (RT-20260924-d95e70 J7 (a)).
      FORMAT wdag-v1 (RC-D; DEC-20260924-5b1c8e R-8; DEC-20260924-e61f3b
      NA-5): {"D": 4, "nv": 20, "neq": 19, "nodes": [{"id": i, "rows":
      [[mu, k], ...], "prods": [[j, c], ...]}, ...], "output": o}, defining
      poly(i) = sum_{(mu,k) in rows} mu*f_k + sum_{(j,c) in prods}
      v_j * poly(c) in B. VALID iff (a) every child c < i; (b) every
      |mu| <= 2 and every k in 0..18; (c) every child c used in prods has
      deg poly(c) <= 3; (d) every node has deg poly(i) <= 4; (e)
      poly(output) == 1. By induction every node lies in W_4, so a valid
      wdag-v1 certifies 1 in W_4 and unsatisfiability. An M_4 refutation is a
      one-node wdag-v1 with no prods. This is the same format as
      EXP-CERTBIN-ddfe75 wdag-v1 with (nv, neq) = (20, 19); this text governs
      here. Recommended construction (not binding): for a refutation first
      reached at iteration i, write the "1" row as (basis rows of iteration
      i-1) + sum_j v_j * (fallen basis rows of iteration i-1 used with j),
      collapse each of those groups into one node and recurse; where
      ell_route holds, the two-part form sum_{C} mu f_k + ell * a = 1 with a
      expanded as prefix-shared chains v_{j1}(v_{j2}(v_{j3} ell)) is usually
      far smaller (RT-20260924-d95e70 J7 (b) witnesses).
      FORMAT ann-v1 (non-refutation certificate; this contract): {"D": 4,
      "nv": 20, "neq": 19, "L_hex": [...]}: a list of functionals lambda on
      B_{<=4}, each a hex integer whose bit c (LSB first) is lambda's value on
      the c-th monomial of the fixed coordinate order "all multilinear
      monomials of degree <= 4 in v_0..v_19 sorted by (-degree, bitmask
      ascending)" (= closure.column_order(4, 20)). lambda(g) = parity of
      <lambda, g>. Let S = {g in B_{<=4} : lambda(g) = 0 for all lambda in L}.
      VALID iff (A1) every row of M_4 lies in S; (A2) for a basis K of
      S cap B_{<=3} computed by the verifier's own elimination, lambda(v_j k)
      = 0 for every k in K, j in 0..19, lambda in L; (A3) some lambda in L has
      lambda(1) = 1. Soundness (Coordinator derivation): S contains M_4 and
      is closed under g -> v_j g for deg g <= 3 (by linearity it suffices to
      check a basis), so the least fixpoint W_4 is contained in S, and 1 is
      not in S; hence 1 is not in W_4. The natural L is a basis of W_4's
      annihilator, of size codim(W_4) = 6196 - final_dim.
    verifier: >-
      experiments/EXP-CERTBIN-060020/verifier/verify_n19.py, run as a SEPARATE
      PROCESS after the closures. It imports nothing from impl/, from
      crypto_autoresearcher (any module), from any archived impl/ or from any
      review directory. From the run's instance records, the literal
      parameters and the seeds, it:
      (V1) rebuilds every system independently: S_3 systems with its own
           F_{2^19} arithmetic and its own S_3 expansion; drawn parts by its
           own implementation of each draw rule (V3);
      (V2) recomputes s for every kept system by its own exhaustive 2^20
           evaluation, and checks every listed solution of every satisfiable
           control;
      (V3) replays every arm's stream (numpy 2.4.6 PCG64, one generator per
           arm) with its own keep rule and requires the same kept systems (by
           E_sha256) and attempt indices;
      (V4) verifies every flat-v1 and wdag-v1 certificate by (a)-(e) with its
           own multilinear arithmetic;
      (V5) runs the negative controls (C-VERIFIER);
      (V6) verifies every ann-v1 certificate by (A1)-(A3) with its own
           elimination.
      Output: certificate-verification.json, annihilator-verification.json,
      construction-verification.json, draw-replay-verification.json.

  # ---------------------------------------------------------------------------
  # INSTANCE SETS (arms) -- fixed by seed, draw order and keep rule
  # ---------------------------------------------------------------------------
  instance_sets:
    generator_rule: >-
      One numpy.random.Generator(numpy.random.PCG64(seed)) per arm, numpy
      2.4.6 (DEC-20260923-4d7a19 R-2), consumed in the order stated. No other
      call touches it. Arms are independent streams.
    S3-PRIMARY:
      role: PRIMARY
      seed: 2026092460601
      draw_rule: >-
        Stage-1 target rule (EXP-CERTBIN-4e92d7 object.subgroup_points) with
        the literal P, Q: per attempt a = int(g.integers(0, q)),
        b = int(g.integers(0, q)); R = [a]P + [b]Q; if R = O reject (R_is_O).
        x_R = x(R). If x_R < 1024 (x_R in V, including 0) it is DEGENERATE:
        recorded and excluded. A repeated x_R is rejected (duplicate). Every
        other attempt is classified by oracle A and oracle B (C-ORACLE).
      keep_rule: >-
        The first 400 attempts with s = 0 form S3-U400 (the primary arm), in
        draw order. The first 100 attempts with s >= 1 form S3-SAT100. Stop at
        the 400th unsatisfiable attempt (S3-SAT100 is always filled first in
        expectation; if not, continue until it is, without adding to
        S3-U400). Cap: 5000 attempts; a shortfall is recorded, never
        redrawn, and reduces N.
      interpretation_of_400: >-
        "About 400 subgroup targets" (KN-OPEN-3c8f51 criterion 2;
        DEC-20260923-f25b97 NA-5) is read as 400 UNSATISFIABLE attempts, the
        denominator of the rate, matching n = 17's unsatisfiable arm of 386
        (DEC-20260924-f5c3f9 R-4).
    S3-SAT100:
      role: soundness control (S_3)
      rule: see S3-PRIMARY keep_rule
    N-CONV19:
      role: tensor arm (S_3's exact quadratic part; RC-A analogue at n = 19)
      seed: 2026092460602
      slots: the 200 lowest-draw-order systems of S3-U400 (slot i carries that x_R)
      kept_part: the quadratic columns 21..210 of E_S3(x_R), exactly
      drawn_part: >-
        per attempt bits = g.integers(0, 2, size=|S_L|) (one call), placed on
        S_L; every other column 0..20 is zero.
      keep_rule: >-
        Per slot, attempts 0..255. Reject a draw equal to E_S3(x_R) (identity)
        or equal to an already-kept system of the arm (duplicate, by
        E_sha256). Compute s exhaustively. The first s = 0 draw is the slot's
        UNSATISFIABLE system; for slots 0..49 the first s >= 1 draw is its
        SATISFIABLE CONTROL. Stop when the slot's roles are filled. A role
        unfilled after attempt 255 is EXHAUSTED(cap): recorded, never a
        result, and it reduces the arm's denominator.
    N-ELL19:
      role: nearby-object control at W_4 (RC-C; one linear fall, otherwise same-support generic)
      seed: 2026092460603
      draw_rule: >-
        RT-20260924-d95e70 j9-ptm/o2-declaration.yaml `draw`, at n = 19:
        M = zeros(19 * 211); M[Upos] = g.integers(0, 2, size=Upos.size);
        c = int(g.integers(0, 2)); rows 0..17 kept; row 18 REPLACED by
        ell_lin + c, where ell_lin is the linear part of S_3's ell at n = 19
        as determined by C-ELL0 (expected v_0 + v_10).
      keep_rule: >-
        Stream mode. Reject duplicates. Compute s exhaustively. Keep the first
        200 draws with s = 0 and the first 50 with s >= 1. Cap 20000 draws;
        a shortfall is recorded and reduces the denominator.
    N-F219:
      role: same-support null (independent random F_2 draws)
      seed: 2026092460604
      draw_rule: M = zeros(19 * 211); M[Upos] = g.integers(0, 2, size=Upos.size) (the F-NULLF2 construction of EXP-CERTBIN-4e92d7 at n = 19).
      keep_rule: As N-ELL19 (200 unsatisfiable, 50 satisfiable, cap 20000).
    N-AFF19:
      role: same-support affine null, FIVE independent families (answers OBJ-6's effective family count 1)
      seed: 2026092460605
      draw_rule: >-
        First, for d = 1..5 in order: E'^0 = zeros(19 * 211),
        E'^0[flatnonzero(E^0)] = g.integers(0, 2, size), then for j = 0..18 in
        order E'^j = zeros, E'^j[flatnonzero(E^j)] = g.integers(0, 2, size).
        Then family d is evaluated at r(x_R) for the non-degenerate
        S3-PRIMARY attempts in draw order (both strata): system =
        E'^0 xor (xor over j with r_j = 1 of E'^j).
      keep_rule: >-
        Per family, reject duplicates, compute s exhaustively, keep the first
        40 with s = 0 and the first 10 with s >= 1. If the primary attempts
        run out first, the shortfall is recorded. Pooled arm: up to 200
        unsatisfiable and 50 satisfiable; every statistic is also reported per
        family.
    F-RANDX19:
      role: x(2E) split (uniform x_R; S_3 algebra unchanged)
      seed: 2026092460606
      draw_rule: >-
        Per attempt x = int(g.integers(0, 2^19)). Reject x < 1024 (degenerate),
        duplicates, and any x equal to an S3-PRIMARY x_R (recorded). Stratum:
        TWIST iff Tr(x + A + B / x^2) = 1; otherwise lift a point (x, y) and
        X2E iff [q](x, y) = O, else XE-NOT-2E. Cross-check: for x not TWIST,
        X2E iff Tr(x) = Tr(A) (C-TR19).
      keep_rule: >-
        If the stratum already holds 200 unsatisfiable systems, record
        "quota_full" and skip. Otherwise classify s by oracle A and oracle B;
        s = 0 joins the stratum's arm. Satisfiable draws are recorded (s) and
        not processed further. Stop when all three strata hold 200. Cap 30000
        attempts.
    instance_record: >-
      instances.jsonl.gz, one line per kept system: key "<ARM>:<index>", arm,
      role (unsat | sat), slot or stream index, x_R (or null), stratum (for
      F-RANDX19), family (for N-AFF19), attempt index, E_hex, E_sha256, s,
      and for satisfiable controls the list of solutions (20-bit integers).
      Every attempt of every stream is logged in draws-<ARM>.jsonl.gz
      (attempt, x_R or E_sha256, s where computed, outcome).
    sizes_expected: >-
      S3-U400 400, S3-SAT100 100, N-CONV19 200 + 50, N-ELL19 200 + 50,
      N-F219 200 + 50, N-AFF19 200 + 50, F-RANDX19 3 x 200. Total 2150 kept
      systems (fewer only by recorded shortfalls).

  # ---------------------------------------------------------------------------
  # CONTROLS -- each has a FAIL condition and can fail on this run's data, or
  # is declared vacuous up front (DEC-20260924-e61f3b NA-5; F-J3-2)
  # ---------------------------------------------------------------------------
  controls:
    - id: C-ENGINE
      when: phase 0, BEFORE the first frozen draw and before any closure on run data
      what: >-
        (a) engine_provenance.tree_rule and ancestry; (b) sha256 of
        src/crypto_autoresearcher/gf2/_kernels.c equals kernels_c_sha256, and
        the sha256 of every package file is recorded; (c) with
        CRYPTO_AR_GF2_BACKEND=native: `python3 tools/gf2_replay_rc1.py --limit
        1062 --json <run>/engine-provenance/replay-rc1.json` (K = 1062 = every
        RC-1 record) exits 0 and reports 1062 records, 268 certificates and 0
        mismatches; (d) `python3 -m pytest -q -rs tests/test_gf2_kernels.py`
        passes with 0 failures and 0 skipped; (e) build_info reports the
        native backend and a source hash equal to the pin. Outputs are kept
        verbatim under engine-provenance/ with timestamps preceding every
        draws-*.jsonl.gz.
      fails_if: any item fails, or any draw file predates the C-ENGINE record. STOP; no draw (INV-1).
    - id: C-SRC
      what: every inputs.files sha256 equals its governing receipt where one is named.
      fails_if: any mismatch against a governing receipt. STOP (INV-2).
    - id: C-SEED
      what: >-
        Before the first draw, the seven seeds of replication.seeds are
        grepped over experiments/*/specification.yaml,
        experiments/*/amendments/ and experiments/*/trial-plan*.json; each
        occurs only in this specification (and this trial plan).
      fails_if: any other occurrence. STOP and report (INV-3); the Coordinator re-seeds by amendment.
    - id: C-SELF
      what: >-
        Seed S_selftest = 2026092460600. (i) modulus irreducible
        (gcd(t^{2^i} - t, f) = 1 for i = 1..9 and t^{2^19} = t mod f) and the
        four smaller pentanomials reducible; (ii) field axioms on 10^4
        triples; (iii) S_3(x(P_1), x(P_2), x(P_1 +- P_2)) = 0 on 10^3 random
        point pairs of E; (iv) the descended equations against direct
        F_{2^19} evaluation of S_3 on 10^3 (v, x_R); (v) the exhaustive-s
        routine against naive per-assignment evaluation on 200 random systems
        (19 x 211 layout) and against oracle A on 200 random x_R;
        (vi) oracle A's half-trace root finding on 10^4 random quadratics;
        (vii) own substitution against direct evaluation (pi(f)(u') = f(u) for
        u extending u' through ell = 0) on 10^3 cases; (viii) the engine's W_D
        on 30 random small Boolean systems (6 variables, D in {3, 4}) against
        a brute-force literal fixpoint, at least 3 of which reach the
        fixpoint at iteration index >= 2 (constructed if necessary and
        listed; F-J2-1); (ix) native against reference backend (separate
        processes) on 30 random dense systems of shape (20 variables, 19
        equations, degree <= 2): every M_4 and W_4 record field equal; the
        executor's literal W_4 (C-LIT code) equal on 5 of them; (x) the wdag
        and ann extractors on the small systems of (viii), checked by the
        verifier's rules in-process.
      fails_if: any item fails, or fewer than 3 small systems reach iteration index >= 2. STOP (INV-3).
    - id: C-FIX
      what: M_3 is 399 x 1351, M_4 4009 x 6196, R'_3 380 x 1160, R'_4 3629 x 5036 (engine Closure.R and Closure.C).
      fails_if: any dimension differs. STOP (INV-3).
    - id: C-CURVE
      what: >-
        (a) B != 0; (b) #E = 523646 by exact count (1 + 1 + 2 * #{x != 0 :
        Tr(x + A + B / x^2) = 0}); (c) q = 261823 prime; (d) P, Q on E,
        P != O, [q]P = [q]Q = O, Q = [5170]P; (e) Tr(A) = 1; (f) if
        cells.json is present, its n19-l6 modulus, A, B, order, h, q, P, Q and
        k_Q equal literal_parameters.
      fails_if: any item fails. STOP; a contract defect (INV-3).
    - id: C-TR19
      what: On every classified F-RANDX19 x not in TWIST, and every S3-PRIMARY x_R, point-arithmetic 2E membership equals Tr(x) == Tr(A).
      fails_if: any disagreement. The x(2E) split is void (INV-7); S3-PRIMARY needs [q]R = O, which holds by construction and is also checked.
    - id: C-SLICE17
      what: >-
        The BASELINE FIXTURE (KN-TECH-080). The run's own field, descent and
        rc_b code, instantiated at n = 17 (t^17 + t^3 + 1, l = 9, curve of
        RUN-CERTBIN-3b7e05 curve.json), (a) reproduces the archived E_hex of
        all 144 curve instances (U62, S62, C20) of RC-1 instance-sets.json;
        (b) gives ell support {v_0, v_9} on all 144; (c) reproduces the
        red-team substituted profiles (RT-20260924-d95e70 J7 (b)):
        [1, 18, 154, 834, 2213] on U62 idx 27 and [1, 17, 153, 833, 2212] on
        U62 idx 893, through Closure(17, 4, 17).
      fails_if: any mismatch. STOP before phase 1 (INV-4).
    - id: C-ELL0
      what: >-
        Phase 0. Compute tau_j = Tr(t^j) for j = 0..18 by field arithmetic,
        record it, and record whether it equals inputs.tau_reading. ell_lin =
        sum over j < 10 with tau_j = 1 of (v_j + v_{10+j}).
      fails_if: >-
        tau_0 != 1 (impossible for odd n; a field defect): STOP (INV-3). A
        false Coordinator reading is NOT a failure; ell_lin is whatever tau
        gives, and N-ELL19 uses it.
    - id: C-ELL
      what: >-
        On every S_3 system (S3-U400, S3-SAT100, F-RANDX19) and every
        N-CONV19 system: the left kernel of the quadratic-column submatrix is
        1-dimensional and equals c_k = Tr(t^k / x_R^2); and on S_3 systems
        sum_k c_k f_k equals ell_lin + Tr(B / x_R^2) exactly.
      fails_if: any violation. Construction defect; the run is void (INV-8).
    - id: C-AFF19
      what: On every S_3 system, E_S3(x_R) computed directly equals E^0 xor (xor of E^j over r_j = 1).
      fails_if: any violation (INV-8).
    - id: C-SUPPORT
      what: >-
        U, S_L and Upos recomputed and recorded (support.json) with per-row
        sizes; every N-F219 and N-ELL19 system (rows 0..17) lies inside U;
        the Coordinator reading of object.parts is recorded true or false.
      fails_if: a drawn system lies outside U (INV-8). A false reading is NOT a failure.
    - id: C-ORACLE
      what: Oracle A (O(2^l) root-finding, EXP-CERTBIN-4e92d7 controls C-ORACLE rule) and oracle B (exhaustive 2^20) agree on s for every processed curve-algebra attempt (S3-PRIMARY, F-RANDX19).
      fails_if: any disagreement. Every arm-dependent metric is void (INV-7).
    - id: C-ORACLE2
      what: The verifier's own s (V2) equals the run's on every kept system, and every listed solution checks.
      fails_if: any disagreement (INV-7).
    - id: C-DRAW
      what: The verifier's independent replay of every arm's stream (V3) yields the same kept systems and attempt indices.
      fails_if: any difference. The affected arms are void (INV-7).
    - id: C-TOP19
      what: >-
        L-TOP (H-CERTBIN-be6cbd mechanism; n-independent proof). For every
        N-CONV19 slot, P of its unsatisfiable (and, slots 0..49, satisfiable)
        system equals P of the S_3 system at the same x_R.
      fails_if: any inequality. Kept part not kept, or engine defect; the run is void (INV-8).
    - id: C-T4
      what: >-
        T4 (generalized; constant 1160): final_dim(W_4) = final_dim(W'_4) +
        1160 and one(W_4) = one(W'_4), on every N-ELL19 system, the first 50
        S3-U400 systems, the first 50 N-CONV19 unsatisfiable systems, and every
        S3-U400 system W_4 does NOT refute.
      fails_if: any violation. The run is void (INV-8); the report localizes it to the engine or to the substitution code.
    - id: C-PRED
      what: >-
        Written in phase 3, hashed, BEFORE phase 4 (predictions.jsonl.gz):
        (a) for every N-ELL19 system with T5_applicable, the T5 prediction;
        where in addition its substituted profile equals
        [0, 0, 18, 360, 3267], the full record (not refuted, final_dim 4427,
        dims_by_deg [0, 1, 38, 551, 4427], iterations_to_fixpoint 1);
        (b) for every N-F219 / N-AFF19 system whose phase-4 M_3 and M_4
        profile turns out exactly [0, 0, 19, 399, 3819] (checked before W_4
        is scored), the prediction W_4 = M_4, not refuted, fixpoint at
        iteration 0. No prediction is made for any S_3 or N-CONV19 system.
      fails_if: >-
        a W_4 record differs from an applicable prediction: an instrument
        defect (INV-8). A system where the reference profile does not hold is
        "prediction not applicable", recorded as a finding about the random
        model, never a failure.
    - id: C-WDAG
      what: >-
        For every W_4 refutation, the wdag extractor's iteration dimensions
        equal the engine record's dims and one_first_iteration equals the depth
        used. Every refutation the engine reports (M_4 or W_4, any arm) is
        submitted to the verifier.
      fails_if: a dimension mismatch (INV-8). A refutation with no valid wdag-v1 is UNCERTIFIED; reported, not counted, not a failure.
    - id: C-MONO
      what: On every system, one(M_3) implies one(M_4) implies one(W_4) (definitional inclusions).
      fails_if: any violation (INV-8).
    - id: C-PS
      what: >-
        Soundness on every satisfiable control (S3-SAT100 and the satisfiable
        controls of N-CONV19, N-ELL19, N-F219, N-AFF19): no M_3, M_4 or W_4
        refutation, and codim(W_4) = 6196 - final_dim >= s (W_4 lies in the
        vanishing ideal; equality recorded where s <= 31, the Reed-Muller bound
        of RT-20260924-d95e70 J9 O1).
      fails_if: >-
        any refutation of a satisfiable control, or codim < s: the INSTRUMENT
        is falsified and the run is void (INV-5). If a certificate VERIFIES,
        the arm label is wrong instead, and INV-7 applies too.
    - id: C-CERT
      what: Every submitted flat-v1 and wdag-v1 certificate is verified by the separate-process verifier. Counted metrics use verified certificates only.
      fails_if: any submitted certificate fails (INV-6).
    - id: C-NONREF
      what: >-
        For every S3-U400 system that W_4 does NOT refute, an ann-v1
        certificate is extracted from the final W_4 basis and verified (V6).
        Also for the first 5 non-refuted unsatisfiable systems of each control
        arm (exercises the checker). VACUOUS (declared, not cited as passed) if
        W_4 refutes all of S3-U400.
      fails_if: >-
        an ann-v1 certificate fails for an engine non-refutation: the engine's
        W_4 is not closed or not a superspace of M_4, an instrument defect; the
        run is void (INV-8).
    - id: C-VERIFIER
      what: >-
        Negative controls PER KIND (F-J3-1). A kind is (closure, arm) with
        closure in {M_4, W_4} over every arm with >= 1 refutation, plus
        (ann, arm) over every arm with >= 1 ann-v1. For each kind at least 3
        corrupted certificates of each type below, built from verified ones,
        format-valid and algebraically wrong or discipline-violating:
        (a) one row removed; (b) one k changed; (c) degree violation: for
        W_4 a verified wdag-v1 with an inserted pair of identical prods nodes
        on a degree-4 child (sum unchanged, rule (c) violated), or a flat
        certificate with max |mu| = 3 rewritten as a one-node wdag-v1 (rule
        (b) violated); for M_4 a flat-v1 with max |mu| = 3 submitted as M_4;
        (d) a verified certificate re-keyed to another system of the same
        arm; for ann-v1: (e1) a functional added that is nonzero on a named
        M_4 row, (e2) the annihilator of M_4 alone on a system where
        W_4 != M_4 (fails (A2)), (e3) L with every functional's constant
        coordinate cleared (fails (A3)). The verifier must reject every one.
        Its own f_k must equal the executor's E on every system (V1). A type
        not constructible in a kind is declared vacuous for it, with the
        reason.
      fails_if: any corrupted certificate accepted, or any construction disagreement (INV-6).
    - id: C-BACKEND
      what: >-
        In a SEPARATE process with CRYPTO_AR_GF2_BACKEND=reference (the numpy
        definitions copied from the archived engines, which the dispatching
        session did not author): M_4 and W_4 records on the first 10
        unsatisfiable systems of every arm, plus up to 10 S3-U400 systems W_4
        does not refute, equal the native records field for field.
      fails_if: any difference (INV-8).
    - id: C-LIT
      what: >-
        The executor's own literal W_4 (numpy, importing nothing from the
        package; the literal rule of EXP-CERTBIN-e94b27 mutant_closure_W_D) on
        the first 5 unsatisfiable systems of every arm and up to 20 S3-U400
        systems W_4 does not refute: final_dim, one, iterations and
        dims_by_deg equal the engine's.
      fails_if: any difference (INV-8).
    - id: C-DET
      what: >-
        In a SEPARATE process: (a) regenerate every arm's stream and compare
        the sha256 of each draws-<ARM>.jsonl.gz; (b) recompute M_4, W_4 and
        rc_b on the 10 lowest S3-U400 systems, 5 S3-SAT100 and 5 N-CONV19;
        (c) recompute 20 systems with CRYPTO_AR_GF2_THREADS=1 and compare with
        the threaded records.
      fails_if: any difference (INV-9).
    - id: C-NULLS
      what: Every arm runs through the identical closure code path; the sha256 of every impl module used is recorded per arm and phase.
      fails_if: a code-path hash differs between arms. The control comparisons (N19-DR-4, -5, -7) are void.

  independent_variables:
    - arm (S3-U400, S3-SAT100, N-CONV19, N-ELL19, N-F219, N-AFF19, F-RANDX19 by stratum)
    - role (unsatisfiable, satisfiable control)
    - closure (M_3, M_4, W_4; R'_3, R'_4, W'_4 on substituted systems)

  metrics:
    primary:
      - id: MR19-1
        name: w4_refuted_primary
        definition: >-
          w = #{S3-U400 systems with a VERIFIED wdag-v1 certificate for 1 in
          W_4}, out of N (400 minus shortfall), with an exact Clopper-Pearson
          95% interval.
      - id: MR19-2
        name: substituted_fall_excess_primary
        definition: >-
          Per S3-U400 system, sigma = dims_by_deg(R'_4)[3] - 360; the counts
          #{sigma > 0}, #{sigma = 0}, #{sigma < 0} and #{dims_by_deg(R'_4)[3] =
          1160 (all of B'_{<=3}, the n = 17 signature)}, out of N_b (systems
          where rc_b applies), and the full profile distribution.
      - id: MR19-3
        name: controls_and_soundness
        definition: >-
          Per arm and closure (M_4, W_4), the verified refutation count out of
          the arm size with CP95; C-PS counts; certificates submitted,
          verified, failed and uncertified per (closure, arm, format); ann-v1
          submitted and verified.
    secondary:
      - M_4 count of S3-U400 with CP95 (verified flat-v1, max |mu| <= 2); the M_3 count; the W_4 rate on the S3-U400 systems M_4 does not refute (the U62 analogue), with CP95.
      - Per system the M_4 record (rank, dims_by_deg, P, fallen, linear_forms, syzygy_excess), the full W_4 record, the rc_b fields and ell_route; per arm their distributions against the semi-regular references.
      - N-CONV19 against S_3 at the same x_R, paired 2 x 2 tables at M_4 and W_4.
      - F-RANDX19 per-stratum M_4 and W_4 rates with CP95.
      - Per arm, the fraction of systems with the reference profile (substituted or unsubstituted) and the T5_applicable fraction.
      - On satisfiable controls with s <= 31, the fraction with codim(W_4) = s.
      - Draw statistics per arm (attempts, unsatisfiable fraction, rejections by reason, EXHAUSTED counts). Descriptive.
      - Wall time and peak RSS per phase and closure (measured; reported, not a unit).
    primary_unit: verified refutations (counts of systems)

  preregistered_prediction:
    quantity: w (MR19-1) and the sigma counts (MR19-2); the control rates (MR19-3)
    formula: >-
      E-PERSIST (C-P): w >= ceil(0.9 N) (360 at N = 400). E-DECAY:
      w <= floor(0.1 N) (40). E-PERSIST falsified iff w <= floor(N / 2) (200);
      E-DECAY falsified iff w > floor(N / 2). C-M: sigma > 0 on
      >= ceil(0.9 N_b); competitor: sigma = 0 on >= ceil(0.9 N_b). Derived,
      exact: C-TOP19 and C-T4 on every applicable system; C-PRED on controls
      where the reference profile holds. Soundness: 0 refuted satisfiable
      controls.
    source: >-
      H-CERTBIN-e3ac93 PP-1..PP-6, fixed before any l = 10 system exists.
      Thresholds mirror H-CERTBIN-5e71c9 PA-1 and H-CERTBIN-be6cbd PN-1 (90% /
      10% / 50%). n = 17 references: W_4 386/386 (EV-CERTBIN-4a9d2f
      exact_scoped_claim (d), quoted per DEC-20260924-e61f3b NA-4 as 82
      RC-1-certified plus 304 Stage-1 flags); M_4 324/386 = 0.839, CP95
      [0.799, 0.875] (KN-OPEN-3c8f51; EV-CERTBIN-6c3e0a O-10); x(2E) split at
      M_4 0.845 / 0.60 / 0.66 (KN-OPEN-3c8f51); substituted S_3 profile
      [1, 18, 154, 834] on 61/62 (EV-CERTBIN-4a9d2f O-7). Semi-regular series
      from RT-20260924-d95e70 J8 (series.json): n20_m19 1, 20, 171, 760, 1425,
      -2356 and n19_m18 1, 19, 153, 627, 969, -2565. T4/T5 from
      o2-declaration.yaml; L-TOP from H-CERTBIN-be6cbd.
  heuristic_under_test: null
  heuristic_under_test_note: No numbered heuristic is tested. The semi-regular description is read per system (RC-B, N19-DR-7), not validated as a heuristic.
  scale_relevance:
    tier: toy
    justification: >-
      n = 19, one curve (h = 2), one V; synthetic controls built on its
      support. The n = 17 comparison is between two cells that also differ in
      curve, cofactor and subgroup-target class (x(4E) at n = 17, x(2E) here);
      no transfer in n is assumed and nothing is said about n >= 23.
    correspondence: null
  tail_checks:
    - >-
      EXACT ARITHMETIC (RC-3). Every Clopper-Pearson bound, Fisher tail and
      binomial tail uses exact integer/rational arithmetic (math.comb,
      fractions) or log-space summation at >= 50 significant digits (mpmath),
      reported as log10 where below 1e-12.
    - >-
      POWER TABLE BEFORE DATA. trial-plan-v1.json carries an exact table of
      P(w >= 360), P(w <= 40) and P(w <= 200) at N = 400 and of
      P(count >= 180), P(count <= 20) at n = 200, for p in {0.02, 0.05, 0.10,
      0.50, 0.84, 0.90, 0.95, 0.99}, and the CP95 bounds at 0/200, 200/200,
      0/400, 400/400 and 386/386. Computed from the thresholds alone, before
      any draw.
    - >-
      SAMPLE-SIZE JUSTIFICATION (Coordinator design arithmetic, normal
      approximation; the executor's power table is exact and governs).
      N = 400 matches the n = 17 unsatisfiable arm (386). If the rate is near
      1, w = 400 gives a CP95 lower bound near 0.025^(1/400), about 0.991,
      comparable with 386/386 (about 0.990); the 90% threshold then sits
      about 4.6 binomial standard deviations below a true rate of 0.95. At a
      rate near n = 17's M_4 value 0.84 the CP95 half-width is about 0.036,
      so N19-DR-2 resolves a shift of about 0.07 from [0.799, 0.875]. Each
      control arm of 200 gives a CP95 upper bound near 0.018 at 0/200, far
      below the 90% level. The x(2E) strata of 200 each resolve the n = 17
      M_4 gap (0.845 against 0.60-0.66) with room to spare.

  replication:
    seeds: [2026092460600, 2026092460601, 2026092460602, 2026092460603, 2026092460604, 2026092460605, 2026092460606]
    seeds_note: >-
      In order: S_selftest, S3-PRIMARY, N-CONV19, N-ELL19, N-F219, N-AFF19,
      F-RANDX19. Checked absent from every existing specification by the
      Coordinator's grep over experiments/*/specification.yaml (no match for
      20260924606); re-checked by C-SEED. Distinct from RC-1's 2026092430099,
      N-ELL's 2026092431001 and EXP-CERTBIN-ddfe75's 20260924501xx.
    independent_instances: 2150
    plan: >-
      Within run: construction-independent rebuilds (verifier V1, V3), the
      theorem checks C-TOP19, C-T4 and C-PRED on every applicable system,
      C-BACKEND, C-LIT and C-DET in separate processes, the F-RANDX19 x(2E)
      stratum as an in-run replicate of the primary arm's rate, and the
      n = 17 slice (C-SLICE17). Author-independent verification is the review
      round's job (claim_tier_and_review). A second n = 19 curve is a
      successor contract, not this one.

  # ---------------------------------------------------------------------------
  # DECISION RULES (fixed now; applied mechanically)
  # ---------------------------------------------------------------------------
  decision_rules:
    - id: N19-DR-1
      rule: >-
        PRIMARY, KN-OPEN-3c8f51 item (B) at W_4. Compute w twice: L1 with
        every UNCERTIFIED or UNDETERMINED(budget) system counted as not
        refuted, and L2 with those systems excluded from N. For each:
        "PERSISTS" iff w >= ceil(0.9 N); "DECAYS" iff w <= floor(0.1 N);
        "PARTIAL" otherwise. Report w, N and CP95. E-PERSIST is FALSIFIED iff
        w <= floor(N / 2); E-DECAY is FALSIFIED iff w > floor(N / 2). If L1 and
        L2 differ, the verdict is "UNDETERMINED (budget or certification)",
        with both shown. If N < 300, "NOT EVALUABLE (sample)". Also reported:
        "NO DETECTABLE DROP FROM n = 17" iff the CP95 upper bound of w / N is
        >= the exact CP95 lower bound of 386/386, else "BELOW THE n = 17
        FIGURE", always with the reading that the n = 17 figure imports 304
        Stage-1 flags and that the cells differ in curve and cofactor.
    - id: N19-DR-2
      rule: >-
        M_4 against n = 17. m = verified M_4 refutations of S3-U400 with CP95.
        "CONSISTENT" iff the CP95 interval overlaps [0.799, 0.875]; "LOWER"
        iff its upper bound < 0.799; "HIGHER" iff its lower bound > 0.875.
        Also reported: the conditional W_4 rate on the S3-U400 systems M_4
        does not refute, and the M_3 count (n = 17: 0/386). Secondary.
    - id: N19-DR-3
      rule: >-
        PRIMARY-MECHANISM (C-M; RC-B). Over the N_b S3-U400 systems where rc_b
        applies: "NON-SEMI-REGULAR PERSISTS" iff sigma > 0 on
        >= ceil(0.9 N_b); "SEMI-REGULAR AT n = 19" iff sigma = 0 on
        >= ceil(0.9 N_b); "MIXED" otherwise. Report the FULL fraction
        (dims_by_deg(R'_4)[3] = 1160) and the sigma < 0 count. If N_b < 300,
        "NOT EVALUABLE (sample)".
    - id: N19-DR-4
      rule: >-
        S_3-specificity at W_4 and at M_4, against each control arm X in
        {N-F219, N-AFF19 (pooled; per-family table beside it), N-ELL19}:
        "S_3 ABOVE X" iff the CP95 lower bound of S3-U400's rate exceeds the
        CP95 upper bound of X's rate; "NOT DISTINGUISHED" otherwise. The
        N-ELL19 comparison at W_4 is the RC-C control. D <= 5 cleanliness is
        not computed and is not a statistic of this contract.
    - id: N19-DR-5
      rule: >-
        N-CONV19 (tensor arm), W_4, out of n_c: "TENSOR-LEVEL" iff
        w_c >= ceil(0.9 n_c); "BELOW" iff w_c <= floor(0.1 n_c); "MIXED"
        otherwise. "AT S_3's RATE" iff its CP95 interval overlaps S3-U400's;
        "N-CONV19 ABOVE N-ELL19" and "ABOVE N-F219" as in N19-DR-4. The paired
        2 x 2 table on the 200 shared x_R is reported. Secondary; it is read
        beside, not instead of, EXP-CERTBIN-ddfe75 at n = 17.
    - id: N19-DR-6
      rule: >-
        x(2E) split on F-RANDX19, at M_4 and at W_4 separately: one-sided
        Fisher exact test, X2E higher than the pooled XE-NOT-2E and TWIST
        strata. "MODULATED" iff p < 0.01; "WEAK" iff 0.01 <= p < 0.2;
        "ABSENT" iff p >= 0.2; "SATURATED (not evaluable)" iff every system in
        both groups is refuted, or none is. Also "RANDX X2E REPLICATES
        PRIMARY" iff the X2E stratum's CP95 interval overlaps S3-U400's at the
        same closure. The n = 17 M_4 rates 0.845 / 0.60 / 0.66 are quoted
        descriptively. Secondary.
    - id: N19-DR-7
      rule: >-
        Random-model transfer per arm (RC-B read on controls). "SEMI-REGULAR
        TRANSFER HOLDS" iff >= 90% of the arm's systems have the reference
        profile (substituted [0, 0, 18, 360, 3267] for arms with ell;
        unsubstituted [0, 0, 19, 399, 3819] for arms without); "FAILS" iff
        <= 10%; "MIXED" otherwise. Also the T5_applicable fraction.
        Descriptive; no verdict on any heuristic.
    - id: N19-DR-8
      rule: >-
        Instrument. C-ENGINE, C-SRC, C-SEED, C-SELF, C-FIX, C-CURVE, C-TR19,
        C-SLICE17, C-ELL0, C-ELL, C-AFF19, C-SUPPORT, C-ORACLE, C-ORACLE2,
        C-DRAW, C-TOP19, C-T4, C-PRED, C-WDAG, C-MONO, C-PS, C-CERT,
        C-NONREF, C-VERIFIER, C-BACKEND, C-LIT, C-DET and C-NULLS must pass or
        be declared vacuous. Any failure applies its invalidation rule, and no
        N19-DR-1..7 verdict is issued for what it voids.
    - id: N19-DR-9
      rule: >-
        m = 3 pricing flag (DEC-20260924-e61f3b NA-3; DEC-20260923-f25b97
        NA-5), recorded by the executor, decided by the Coordinator after
        review: "ELIGIBLE" iff N19-DR-1 returns PERSISTS under both labels;
        "NOT ELIGIBLE" otherwise. Nothing is priced in this contract.
    - id: N19-DR-10
      rule: Primary verdicts are N19-DR-1 and N19-DR-3. Everything else is secondary.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    watchdog_seconds: 172800
    per_instance_watchdog_seconds: 3600
    total_cpu_hours: null
    maximum_memory_gb: 3
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      CERTBIN is ECC; research time is unbudgeted (CLAUDE.md rule 11). The
      172,800 s run watchdog (checkpoint and --resume) and the 3,600 s
      per-system closure watchdog are machine protection; an expiry is never
      a result (a per-system expiry labels that system UNDETERMINED(budget)).
      maximum_runs = 2: one run plus one re-run after an INFRASTRUCTURE
      failure, the failed attempt retained. maximum_workers = 1 process;
      inside it at most 3 engine threads. Memory cap 3 GB (other CERTBIN
      executors may share the 4-core, 15 GB machine; DEC-20260924-8e2f47
      concurrency). Largest structures (Coordinator arithmetic): the W_4
      stack at most 33216 x 6196 bits (about 26 MB packed), the engine's
      mask2col table 2^20 x 8 bytes (8 MiB) per Closure object, and the
      exhaustive-evaluation monomial tables 211 x 2^20 bits (about 28 MB).
    dominant_cost: See engine_provenance.runtime_model (modeled, not measured).

  stopping_rules:
    - id: SR-1
      rule: Seeds, arms, quotas, slot orders and keep rules are fixed. No arm is extended, trimmed or reordered after any output.
    - id: SR-2
      rule: C-ENGINE, C-SRC, C-SEED, C-SELF, C-FIX, C-CURVE, C-ELL0 or C-SLICE17 failure stops the run BEFORE the first draw. The failed attempt is retained.
    - id: SR-3
      rule: >-
        A watchdog expiry, crash or out-of-memory event checkpoints (per phase,
        per arm) and resumes with --resume. It is never a result. A resumed run
        must reproduce the draw-log hashes (C-DET (a)).
    - id: SR-4
      rule: No closure with D >= 5, no F4, no second curve, no m = 3 system and no pricing in this contract, whatever the outcome.
    - id: SR-5
      rule: Shortfalls and EXHAUSTED(cap) slots are reported and excluded from denominators. They are never redrawn.

  invalidation_rules:
    - {id: INV-1, rule: 'C-ENGINE failure: nothing is drawn; an infrastructure/provenance stop, reported to the Coordinator.'}
    - {id: INV-2, rule: 'C-SRC failure: the run is void (stop).'}
    - {id: INV-3, rule: 'C-SEED, C-SELF, C-FIX, C-CURVE or C-ELL0 failure: the run is void (stop).'}
    - {id: INV-4, rule: 'C-SLICE17 failure: the run is void (stop before phase 1).'}
    - {id: INV-5, rule: 'C-PS failure: the instrument is falsified; the run is void and is not evidence about H-CERTBIN-e3ac93.'}
    - {id: INV-6, rule: 'C-CERT or C-VERIFIER failure: MR19-1, MR19-3 and every refutation count are void.'}
    - {id: INV-7, rule: 'C-ORACLE, C-ORACLE2, C-DRAW or C-TR19 failure: every arm-dependent metric of the affected arms (C-TR19: the x(2E) split) is void.'}
    - {id: INV-8, rule: 'C-ELL, C-AFF19, C-SUPPORT (outside U), C-TOP19, C-T4, C-PRED, C-WDAG (dimension), C-MONO, C-NONREF, C-BACKEND or C-LIT failure: construction or engine defect; the run is void.'}
    - {id: INV-9, rule: 'C-DET mismatch: the run is void.'}
    - {id: INV-10, rule: 'A void run is an implementation failure (AGENTS.md core rule 5). It says nothing about S_3, about n or about the refutation degree.'}

  success_criterion: >-
    The run succeeds iff every control of N19-DR-8 passes or is declared
    vacuous; every kept system of every arm has a record for every closure due
    on it; and N19-DR-1..10 each return a verdict or "not evaluable" with its
    reason. PERSISTS, DECAYS and PARTIAL are all successes; UNDETERMINED and
    NOT EVALUABLE are informative outcomes with a declared successor.
  falsification_criterion: >-
    - E-PERSIST (H-CERTBIN-e3ac93 C-P) is falsified iff w <= floor(N / 2)
      (200 at N = 400).
    - E-DECAY is falsified iff w > floor(N / 2).
    - C-M is falsified iff N19-DR-3 returns SEMI-REGULAR AT n = 19; its
      competitor iff NON-SEMI-REGULAR PERSISTS.
    NOT falsification: a void run (INV-1..INV-10), a watchdog expiry, an
    UNCERTIFIED refutation, an UNDETERMINED(budget) system, a shortfall.

  coordinator_prior: >-
    Written before any l = 10 system exists. A prior, not a prediction; it
    changes no threshold.
    (a) N19-DR-1: PERSISTS about 55%, PARTIAL about 30%, DECAYS about 15%.
        Reason: the source of the n = 17 falls (phi's rank-(n-1) image, the
        cokernel fall) is n-uniform; against it, the semi-regular degree-4
        deficit grows (h_4 612 -> 1425) and M_4's rows grow more slowly than
        its columns.
    (b) N19-DR-2: LOWER about 50%, CONSISTENT about 40%, HIGHER about 10%.
    (c) N19-DR-3: NON-SEMI-REGULAR PERSISTS about 80%; FULL (1160) on most
        systems about 40%.
    (d) N19-DR-4: nulls and N-ELL19 at 0 W_4 refutations (about 90%), and
        their reference profiles hold (N19-DR-7 HOLDS, about 85%).
    (e) N19-DR-5: TENSOR-LEVEL about 50% (no information yet; EXP-CERTBIN-
        ddfe75 decides the n = 17 analogue).
    (f) N19-DR-6: at M_4 MODULATED or WEAK about 60%; at W_4 SATURATED if
        (a) is PERSISTS.
    (g) Certificates: every W_4 refutation gets a verified wdag-v1 (about
        80%); C-NONREF non-vacuous about 45%.
    Most likely to be overturned: (a) and (b), in either direction.

  proof_search_map_audit:
    performed_by: coordinator (DEC-20260924-f5c3f9), before approval
    baseline_fixture: C-SLICE17 (a)-(c), C-FIX, and C-ENGINE's full RC-1 replay before any draw.
    observation_collision: >-
      Refutation side: the flat-certificate fiber (RT-20260924-d95e70 J7 (a))
      is closed by wdag-v1 per-node degree bounds, attacked by C-VERIFIER (c);
      satisfiable controls in every arm are the collision search.
      Non-refutation side (the adverse direction for E-PERSIST): an engine
      that under-computes W_4 is separated by ann-v1 (C-NONREF), C-BACKEND,
      C-LIT and the exact C-PRED dimension 4427 on N-ELL19.
    quantifier_order: Stated in H-CERTBIN-e3ac93. The primary arm is fixed by seed and draw order and is unconditioned on any closure outcome.
    method_ceiling: >-
      W_4 is a degree-bounded closure. A non-refutation is a statement about
      degree-4 derivations only: not F4 step degree, not a proof of hardness.
      The n = 17 comparison carries the curve / cofactor confound. Nearby
      objects: N-ELL19 and the same-support nulls; N-CONV19 locates the
      tensor at n = 19.
    representation_interfaces: >-
      Three interfaces carry proof obligations and have checks: the E_layout /
      support reading (C-SUPPORT, C-AFF19), the ell identity and substitution
      (C-ELL0, C-ELL, C-T4), and the reuse of the curve as literal parameters
      (C-CURVE, C-TR19).
    rc_conditions_of_DEC-20260924-e61f3b_NA-3:
      l_10_400_targets_nulls_x2E_W4_beside_M4: met (instance_sets; closures_run)
      RC-B: met (object.ell_and_rc_b, phase 3 before any scored prediction; N19-DR-3)
      RC-C: met (N-ELL19 at W_4, N19-DR-4; no D <= 5 statistic, SR-4)
      N-CONV_type_arm_at_n19: met (N-CONV19, N19-DR-5); approval therefore not gated on EXP-CERTBIN-ddfe75
      ell_existence_and_support: met (derivation in H-CERTBIN-e3ac93; C-ELL0, C-ELL)
      RC-D_and_author_independent_verification: met (wdag-v1, ann-v1; claim_tier_and_review joint 1)
      price_nothing_at_m3: met (SR-4; N19-DR-9 only flags)
    verdict: No audit failure. Approved.

  attention_contract:
    decisive_evidence: N19-DR-1 and N19-DR-3 on verified certificates (wdag-v1 for refutations, ann-v1 for primary-arm non-refutations).
    positive_next_decision: >-
      PERSISTS (both labels): quote "W_4 refutes w/N at the n = 19 cell
      (h = 2)" beside n = 17's 386/386; the m = 3 pricing of
      DEC-20260923-f25b97 NA-5 becomes eligible for a separate design; the
      next diagonal step (n = 23, l = 12, M_4 6923 x 12951 per
      IDEA-20260923-5d0b8e) and a second n = 19 curve (h = 4) are ranked.
    negative_next_decision: >-
      DECAYS: record the decay at this cell with ann-v1-certified
      non-refutations; KN-OPEN-3c8f51 item (B) is answered negatively at its
      first step for this curve (not closed: one curve, one V); no m = 3
      pricing; the mechanism reading moves to N19-DR-3 (did the falls vanish,
      or stop sufficing?).
    inconclusive_decision: >-
      PARTIAL, UNDETERMINED or NOT EVALUABLE: a successor contract with a
      second n = 19 curve (h = 4, removing the cofactor confound) or with the
      certification fixed, before any n = 19 rate is quoted as characteristic.
    local_ambiguity_rule: Any case the rules do not cover is recorded as "not evaluable" with its reason. No threshold is added after data.
    peripheral_exclusions: [D >= 5, F4, m = 3, n = 23, second curve, pricing]
    rerank_trigger: Completion of this run triggers a CERTBIN rerank (item (B) successor, m = 3 eligibility, KN-OPEN-3c8f51 successor text of DEC-20260924-e61f3b NA-9).

  execution:
    run_id_rule: >-
      RUN_ID is minted by the dispatching session before launch
      (`python3 tools/allocate_id.py --next run --area CERTBIN`, then
      `--check`) and passed as $RUN_ID. The run directory is
      experiments/EXP-CERTBIN-060020/runs/$RUN_ID/, and the id is recorded in
      the manifest and in engine-provenance/.
    environment: >-
      export CRYPTO_AR_GF2_BACKEND=native PYTHONDONTWRITEBYTECODE=1
      CRYPTO_AR_GF2_THREADS=3 (lower if the machine is shared more heavily;
      record it); python3 with numpy 2.4.6; mpmath optional for log-space tails.
    entry_point: experiments/EXP-CERTBIN-060020/impl/driver.py
    engine_provenance_script: experiments/EXP-CERTBIN-060020/impl/engine_provenance.py
    selftest: experiments/EXP-CERTBIN-060020/impl/selftest.py
    verifier: experiments/EXP-CERTBIN-060020/verifier/verify_n19.py
    trial_plan: experiments/EXP-CERTBIN-060020/trial-plan-v1.json
    trial_plan_rule: >-
      Written by the executor from this specification alone, before phase 0:
      input paths and hashes, literal parameters, arms, seeds, slot orders,
      keep rules, quotas and caps, phases, output paths and the exact power
      table; no computed closure value and no draw. Its sha256 is in the
      manifest.
    command: >-
      python3 experiments/EXP-CERTBIN-060020/impl/engine_provenance.py --out
      experiments/EXP-CERTBIN-060020/runs/$RUN_ID/engine-provenance &&
      python3 experiments/EXP-CERTBIN-060020/impl/selftest.py --out
      experiments/EXP-CERTBIN-060020/runs/$RUN_ID/selftest.json &&
      python3 experiments/EXP-CERTBIN-060020/impl/driver.py --spec
      experiments/EXP-CERTBIN-060020/specification.yaml --plan
      experiments/EXP-CERTBIN-060020/trial-plan-v1.json --run-id $RUN_ID
      --out experiments/EXP-CERTBIN-060020/runs/$RUN_ID [--resume]
    determinism_command: >-
      python3 experiments/EXP-CERTBIN-060020/impl/driver.py --spec
      experiments/EXP-CERTBIN-060020/specification.yaml --plan
      experiments/EXP-CERTBIN-060020/trial-plan-v1.json --run-id $RUN_ID
      --out experiments/EXP-CERTBIN-060020/runs/$RUN_ID --phase determinism
    backend_command: >-
      CRYPTO_AR_GF2_BACKEND=reference python3
      experiments/EXP-CERTBIN-060020/impl/driver.py --spec
      experiments/EXP-CERTBIN-060020/specification.yaml --plan
      experiments/EXP-CERTBIN-060020/trial-plan-v1.json --run-id $RUN_ID
      --out experiments/EXP-CERTBIN-060020/runs/$RUN_ID --phase backend
    verify_command: >-
      python3 experiments/EXP-CERTBIN-060020/verifier/verify_n19.py --run
      experiments/EXP-CERTBIN-060020/runs/$RUN_ID --spec
      experiments/EXP-CERTBIN-060020/specification.yaml --out
      experiments/EXP-CERTBIN-060020/runs/$RUN_ID
    phases:
      - 0 C-ENGINE (engine_provenance.py), C-SRC, C-SEED, C-SELF, C-FIX, C-CURVE, C-ELL0, C-SLICE17; trial plan hashed
      - 1 S3-PRIMARY stream (oracles A and B), C-ORACLE, C-TR19 (primary), C-AFF19, C-ELL, U / S_L / Upos (C-SUPPORT)
      - 2 N-CONV19, N-ELL19, N-F219, N-AFF19 and F-RANDX19 streams; keep rules; draw logs
      - 3 rc_b on every applicable system; predictions.jsonl.gz written and hashed (C-PRED)
      - 4 M_3, M_4, W_4 on every system; W'_4 on the C-T4 sets; flat-v1, wdag-v1 and ann-v1 extraction; C-TOP19, C-T4, C-PRED scoring, C-WDAG, C-MONO
      - 5 C-DET (separate process, --phase determinism); C-BACKEND (separate process, backend_command); C-LIT
      - 6 verifier (separate process, verify_command); C-ORACLE2, C-DRAW, C-CERT, C-NONREF, C-VERIFIER
      - 7 aggregation, decision rules, run report (--resume after phase 6)
    output_bound: >-
      Per-system records and certificates are gzipped JSONL. The run package
      stays below 200 MiB. If certificates would exceed it: keep every
      certificate and every ann-v1 of S3-U400, and the first 40 per (arm,
      closure, format) elsewhere; record the sha256 and size of the rest. The
      rest stay counted (verified in-run) but are flagged "not archived". If
      the S3-U400 ann-v1 set alone exceeds 100 MiB, keep the first 40 in draw
      order and hash the rest (flagged); the review then re-derives the
      non-archived ones.
    dispatch_note: >-
      No batch queue exists for this lane, so tools/experiment_execution.py is
      not the launch path. The executor launches the commands above under
      TASK-20260924-a50c5b after TASK-20260924-791da5 verifies.

  constraints:
    - No deployed curve is an attack instance. No discrete logarithm is attempted. The only curve is the literal n = 19 curve (and the n = 17 curve inside C-SLICE17).
    - A timeout, crash or environment restart is execution status, never negative mathematical evidence.
    - EXP-CERTBIN-4e92d7, EXP-CERTBIN-e94b27, EXP-CERTBIN-a58c63, EXP-CERTBIN-ddfe75, coordination/review/ and src/crypto_autoresearcher/gf2/ are read only.
    - The package is imported, never copied or edited. No archived engine file is copied.

  artifact_paths:
    - experiments/EXP-CERTBIN-060020/specification.yaml
    - experiments/EXP-CERTBIN-060020/trial-plan-v1.json
    - experiments/EXP-CERTBIN-060020/impl/
    - experiments/EXP-CERTBIN-060020/verifier/
