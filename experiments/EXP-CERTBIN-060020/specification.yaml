    - certificates.jsonl.gz, annihilators.jsonl.gz, certificate-verification.json, annihilator-verification.json, construction-verification.json, draw-replay-verification.json, negative-controls-certificates.jsonl.gz, negative-controls-verification.json
    - backend-check.json (C-BACKEND), literal-check.json (C-LIT), determinism.json (C-DET)
