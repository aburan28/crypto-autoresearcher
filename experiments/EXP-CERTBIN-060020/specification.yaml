      the dispatching session; impl/ and verifier/ by the executor); the claim
      tier and scope statement verbatim.

  claim_tier_and_review:
    review_required: true
    default: >-
      review-adversarial, under a review_plan the Coordinator writes after
      the run snapshot TASK-20260924-d0f80c verifies and before any reviewer
      runs. Minimum joints:
      (1) AUTHOR-INDEPENDENT VERIFICATION. A validator in an independent
          session that is neither the dispatching session (the engine's
          author) nor the executor writes its own checker without reading
          impl/, verifier/ or src/crypto_autoresearcher/gf2/. It rebuilds
          every counted system from the object definitions, re-decides s by
          its own exhaustive 2^20 evaluation, and re-verifies EVERY archived
          flat-v1, wdag-v1 and ann-v1 certificate.
      (2) A blind re-derivation, from this specification alone, of W_4 and of
          the rc_b profile on a blind subsample chosen by the plan (at least
          10 S3-U400 refuted, 10 S3-U400 not refuted if that many exist,
          5 N-ELL19, 5 N-CONV19).
      (3) A red team on the n-comparison reading (curve, cofactor and
          target-class confound; the 304 imported n = 17 flags), on the RC-B
          reading and the sigma threshold, on ann-v1 soundness, and on what
          N-CONV19 does and does not locate at n = 19.
      Reviewers read from a dedicated worktree at the archive commit with
      PYTHONDONTWRITEBYTECODE=1 (DEC-20260924-e61f3b NA-5).
    escalation: >-
      None expected. If an evidence decision would close a lane or record
      reject_scoped on this basis, review-breakthrough at max comes first
      (AGENTS.md rule 12). A DECAYS verdict is recorded with `weaken` and a
      replication route (a second n = 19 curve) before any reject_scoped.

