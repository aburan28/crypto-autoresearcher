experiment:
  id: EXP-ECDLP-f7ae55
  hypothesis_id: H-ECDLP-79fa89
  version: 1
  title: >-
    Exhaustive-nondecomposition certificate class and its MEASURED power - a
    pre-registered 7 by 5 defect-detection matrix with forced misses, a
    disqualifying false-alarm control on a correct enumerator, a null-defect
    arm, a floor measurement at three reach values, and a curve-free arm that
    separates which invariants carry curve content
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  record_kind: verification_protocol_with_power_measurement
  record_kind_note: >-
    Half audit, half experiment, and specified as both. The AUDIT half asks
    what artifact is checked (an exhaustive enumeration's NEGATIVES), against
    what reference (four independently recomputable invariants, three of them
    exact integers derivable from (B, m) without touching the curve), and
    what result fails it. The EXPERIMENT half MEASURES the audit's power by
    replanting defects of known size and recording which invariant fires on
    which. A certificate suite that has never been shown to catch anything is
    a ritual; this contract exists to make that testable.

  objective: >-
    Define a certificate class for the NEGATIVE half of an exhaustive
    decomposition-rate measurement, demonstrate by construction that its
    three cheap invariants are jointly NON-IDENTIFYING, and measure the
    suite's detection power and its floor against seven planted defects, a
    correct-instrument false-alarm control and a no-op null defect. The
    deliverable is a schema block WITH A MANDATORY PUBLISHED DETECTION FLOOR
    and a plain statement of the defect classes the suite cannot see. This
    contract is DRAFT and confers no execution authority.

  preregistered_prediction:
    quantity: >-
      The 7 by 5 DETECTION MATRIX: for each of seven planted defects and each
      of five invariants (E1, E2, E3, E4, S1), whether the invariant FIRES;
      boolean, with the firing statistic and its value recorded per cell.
      Plus the E1 deviation, an ABSOLUTE INTEGER COUNT of size-m signed
      multisets, and the E4 detection rate, a dimensionless proportion in
      [0,1] with an exact binomial interval over 20 plantings.
    formula: >-
      PRE-REGISTERED MATRIX, INCLUDING FORCED MISSES.
      D1 (2-torsion sampler degeneracy): S1 FIRES with z above 10; E1, E2,
      E3, E4 MISS BY CONSTRUCTION.
      D2 (cancelling-pair severance, present in committed source): E1 FIRES
      with a shortfall of EXACTLY 2B^2 at m = 3.
      D3 (truncated enumeration at 90 percent): E1 FIRES.
      D4 (sign convention dropped, positive lifts only): E1 FIRES with total
      binom(B+m-1,m); E2 FIRES.
      D5 (off-by-one base size): E1 FIRES.
      D6 (unit relabelling): E1, E2, E3 ALL MISS by the collision proof; E4
      fires with probability 1 - (1-eps)^k.
      D7 (membership flipped on a random 1 percent of targets): E1, E2, E3
      MISS; E4 fires with probability 1 - 0.99^k, which at k = 100 is 0.63.
      NEARBY-OBJECT (correct enumerator, 2-torsion-seeded base): ALL PASS,
      using the forced total binom(2B-t+m-1, m).
      NULL DEFECT (no-op refactor): ALL PASS.
    source: >-
      E1 from the conservation double count applied to the signed set
      W = V union -V of size 2B; E2 from W = -W; E3 from the fibre over the
      identity at m = 2 on a 2-torsion-free base; the D2 shortfall from the
      count of size-3 multisets from W containing a plus-minus pair; the E4
      probabilities from independent Bernoulli trials. D6's forced triple
      miss follows from the collision proof: multiplication by a unit permutes
      the group, commutes with negation and fixes the identity, so it
      preserves all three invariants exactly while being wrong about
      membership on a 1 - o(1) fraction of targets.

  inputs:
    fixture: >-
      p = 101, a = 2, b = 3, B in {5, 8, 12}, m in {2, 3}. The forced totals
      are exact integers COMPUTED BY HAND AND STORED IN THIS CONTRACT before
      the run; the enumerator is compared against the stored file, never the
      file against the enumerator.
    clean_cells: "the committed factor-base ladder at p = 4001 and p = 6007, m in {2, 3}, B at most 22"
    base_convention: "V a set of B distinct x-coordinates lifted to W = V union -V, 2-torsion-free unless the 2-torsion arm is running; the convention is a recorded field of every certificate"
    spot_check_sizes: "k in {30, 100, 300}, declared before the run and never tuned after seeing data"
    defect_reach: "eps in {0.01, 0.03, 0.10}, 20 independent plantings each"

  independent_variables:
    - "planted defect: D1..D7, plus the nearby-object correct enumerator and the null no-op defect"
    - "invariant: E1, E2, E3, E4, S1"
    - "k in {30, 100, 300}"
    - "eps in {0.01, 0.03, 0.10}, and independent versus coset-structured placement"
    - "ambient object: elliptic curve arm versus curve-free Z/N arm"

  null_object:
    name: >-
      THE NEARBY-OBJECT CONTROL - a genuinely CORRECT enumerator on a
      2-torsion-seeded base - blocking, and DISQUALIFYING on failure; plus
      THE NULL-DEFECT ARM, a flagged no-op refactor that changes nothing.
    construction: >-
      NEARBY-OBJECT. Seed the factor base with t in {1, 2, 3} 2-torsion
      x-coordinates. Then |W| = 2B - t rather than 2B, and the FORCED TOTAL
      IS binom(2B-t+m-1, m), NOT binom(2B+m-1, m). The enumerator is correct;
      only the forced constant changes. The suite MUST PASS it. A suite that
      flags this correct instrument as defective, or that passes it while
      using the WRONG forced constant, has not identified the load-bearing
      structure and its verdicts are worthless. A false alarm here is a WORSE
      failure than missing a defect and is DISQUALIFYING.
      NULL DEFECT. One flagged "defect" that is a no-op refactor - identical
      arithmetic, different code path. Every invariant must pass. An
      invariant that fires here has a false-positive rate and the suite's
      usable threshold must be restated before any detection number is
      quoted.
    non_degeneracy_check: >-
      REQUIRED AND SATISFIED, AND THE CHECK IS NOT COSMETIC HERE. The
      nearby-object arm can differ from the treatment: it is run through the
      IDENTICAL suite, and the only thing that changes is one forced integer,
      so a suite hard-coding binom(2B+m-1,m) WILL fire on it - which is
      exactly the failure the arm exists to catch. Its two possible outcomes
      (pass, false-alarm) are both reachable and both consequential. The
      null-defect arm likewise has two reachable outcomes. And the DETECTION
      MATRIX itself is non-degenerate by design: it contains BOTH forced hits
      and FORCED MISSES (D1 against E1-E4; D6 against E1-E3), so a suite that
      always fires fails it just as surely as a suite that never fires. A
      matrix with no predicted misses would be a discriminator with a
      width-zero band, and this one is not.
    dynamic_range_demonstration: >-
      THE DEFECT REACH LADDER IS THE DYNAMIC-RANGE MEASUREMENT, and it is
      graded rather than binary. D7 plants a membership flip on a fraction
      eps of targets at eps in {0.01, 0.03, 0.10}, 20 independent plantings
      each, at k in {30, 100, 300}, and the measured detection rate is
      compared against 1 - (1 - eps)^k by an exact binomial test per cell.
      The eps = 0.01, k = 100 cell is chosen deliberately to sit NEAR THE
      SUITE'S FLOOR, with a predicted rate of 0.63, so that the floor is
      MEASURED rather than asserted. Separately, D2 and D4 plant defects
      whose E1 signature is a FORCED EXACT INTEGER - a shortfall of exactly
      2B^2 at m = 3 for D2, and a total of exactly binom(B+m-1,m) for D4 -
      so those two rungs test not merely whether an invariant fires but
      whether it fires AT THE PREDICTED MAGNITUDE. A defect that fires at the
      wrong magnitude halts its arm.
    curve_free_null: >-
      REQUIRED, AND HERE IT DOES REAL SEPARATING WORK RATHER THAN MERELY
      GUARDING. E1, E2 and E3 are identities about size-m multisets drawn
      from a symmetric subset W = -W of ANY finite abelian group, and the
      unit-relabelling collision is a statement about Z/N. THE ARM: run the
      ENTIRE suite and the ENTIRE 7 by 5 matrix with the curve replaced by
      Z/N and W replaced by a symmetric 2B-subset of Z/N, at matched N, B, m
      and k, with the same seven defects reconstructed in the group setting.
      PREDICTED SEPARATION, stated in advance: E1, E2, E3 and defects D2-D7
      are expected to REPRODUCE EXACTLY, because none of them touches the
      curve; whereas D1 (a 2-torsion sampler degeneracy) and the E4
      re-decider (a meet-in-the-middle over curve points) are genuinely
      curve-specific and are expected NOT to reproduce. That predicted split
      is itself the deliverable of the arm.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, BEFORE ANY DEFECT IS PLANTED, AND BINDING. Every
      matrix cell that REPRODUCES in the curve-free Z/N arm is thereby shown
      to carry ZERO elliptic-curve content, and NO certificate resting on it
      may be quoted as a statement about elliptic curves, about Semaev
      decomposition, or about the ECDLP. Concretely, if E1, E2 and E3
      reproduce as predicted, then the three cheap invariants are certifying
      an enumeration in a finite abelian group and nothing more, and the
      certificate schema must SAY SO in its own text - the honest headline is
      "an exhaustive multiset enumeration in a finite abelian group is
      internally consistent", not "a decomposition negative on this curve is
      certified". Only the cells that FAIL to reproduce - expected to be D1
      and E4 - are quotable as carrying curve content, and only within the
      tested scope. If ALL cells reproduce, then the entire suite is
      curve-free and every certificate it emits must carry that scope
      statement in its own body.

  controls:
    - >-
      NEARBY-OBJECT CONTROL (blocking, must PASS, false alarm DISQUALIFYING).
      See null_object.
    - >-
      NULL-DEFECT ARM (blocking, must PASS). See null_object.
    - >-
      FORCED-MISS CONTROL: the pre-registered prediction that E1-E4 are BLIND
      to D1 must hold. If an enumerator-level check fires on a sampler-level
      defect, the analysis of what each invariant measures is wrong and must
      be redone before any schema is proposed.
    - >-
      INDEPENDENCE CONTROL: the E4 re-decider's disjointness from the
      enumerator is established by an IMPORT-GRAPH check and an AST-LEVEL
      STRUCTURAL DIFF, not by reading. A shared helper silently makes E4 a
      tautology.
    - >-
      ORDERING CONTROL: the full detection matrix and every forced integer
      are committed to the run directory BEFORE any defect is planted, with
      their sha256, and the outputs are compared against the committed file
      and never the reverse.
    - >-
      STRUCTURED-DEFECT ARM: D7 repeated with the flipped targets confined to
      a COSET rather than chosen at random - the case the independence clause
      of HEUR-CERT-1 excludes. Its detection rate is reported separately and
      is expected LOWER; if it is not, the independence concern is
      empirically inert at these parameters and that is reported as such.
    - >-
      HAND-COMPUTED FIXTURE at p = 101 (blocking, runs first), with the
      totals stored in this contract before the run.
    - >-
      CURVE-FREE Z/N ARM (blocking) with the pre-declared consequence above.

  metrics:
    primary:
      - "E1 deviation = |measured total multiplicity - binom(2B+m-1,m)| per cell; ABSOLUTE INTEGER COUNT of size-m signed multisets; required exactly 0 on every clean cell"
      - "the full 7 by 5 detection matrix, cell by cell, against the pre-registered matrix; boolean per cell plus the firing statistic and its value"
      - "E4 detection rate over 20 independent plantings per (eps, k); dimensionless proportion in [0,1] with an exact binomial 95 percent interval; compared against 1 - (1 - eps)^k"
      - "nearby-object verdict; boolean PASS/FAIL; a FAIL is disqualifying"
      - "null-defect verdict; boolean PASS/FAIL"
      - "curve-free arm: which matrix cells reproduce and which do not; boolean per cell"
    secondary:
      - "E2 negation-symmetry fraction per cell; dimensionless in [0,1]; forced exactly 1.000"
      - "E3 identity count against B at m = 2; ABSOLUTE INTEGER"
      - "E4 spot-check count k, number of disagreements, and the PUBLISHED DETECTION FLOOR eps = 1 - 0.05^(1/k); dimensionless"
      - "S1: base-point order with its factorization witness, distinct-target count, birthday prediction, z-score in standard deviations, dropped-draw count, declared target support"
      - "D2 E1 shortfall against the forced 2B^2 at m = 3; ABSOLUTE INTEGER, exact match required"
      - "structured-defect (coset) arm detection rate against the independent arm; dimensionless proportions"
      - "import-graph and AST-diff receipt for E4 independence; boolean plus the diff summary"
      - "certified versus uncertified wall-clock seconds and peak RSS in GiB; dimensionless ratios"
      - "counter-map size min(|mW|, N) versus the set size |mW|; integer counts, so the memory cost is disclosed rather than asserted"

  heuristic_under_test: HEUR-CERT-1

  scale_relevance:
    tier: toy
    justification: >-
      p at most 6007, B at most 22, k at most 300, exact enumeration
      throughout. NO CRYPTO-SCALE CLAIM IS MADE OR IMPLIED. The one quantity
      that would matter at scale - the counter map of size min(|mW|, N) - is
      MEASURED here rather than extrapolated, and the contract states in
      advance that at N near a memory wall the counter map becomes the
      binding constraint and the certificate must then be emitted in a
      streaming form or scoped out. THE FULL OBLIGATION THE SCHEMA WOULD
      IMPOSE - that every exhaustive decomposition run at any scale emits
      this certificate - CANNOT BE TESTED AT REACHABLE SCALE, and the
      contract does not shrink it silently: it measures the overhead at toy
      cells and declares the cell size above which the obligation must be
      re-scoped.
    correspondence: null

  tail_checks:
    - "The cell with the LOWEST measured E4 detection rate against the binomial lower tail at 1/1000."
    - "The structured (coset) defect arm, reported separately from the independent arm, since it is the case the independence clause excludes."
    - "The largest B and largest m cells for the overhead measurement, where the counter map is largest relative to the set."
    - "Any cell where E1 is nonzero on a supposedly clean run, reported individually before anything else in the batch."
    - "The 2-torsion arm at each t in {1, 2, 3} separately, so both branches of the base convention are exercised rather than only the convenient one."

  replication:
    seeds: [101, 202, 303, 404, 505]
    independent_instances: 20
  seeds_policy: >-
    Five declared seeds for base construction and target sampling, fixed here
    before execution and never re-drawn after an outcome is seen. The E4
    SPOT-CHECK SAMPLER carries its own recorded seed, distinct from the
    enumerator's, and the certificate PUBLISHES that seed alongside the
    declared target support - this is not bookkeeping, it is what makes the
    independence clause of HEUR-CERT-1 auditable, since a defect correlated
    with the spot-check sampler breaks the detection formula. Each of the
    three (eps, k) floor cells is planted 20 times with 20 distinct declared
    seeds, so the detection rate carries an interval rather than a point. The
    RNG algorithm and state are recorded per planting. A re-planting under a
    new seed is a NEW planting event, never a replacement.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
  budget_note: >-
    Sized to the work. All arms are exact enumeration at p at most 6007 with
    B at most 22; the main matrix uses k at most 100 probes and the floor
    measurement adds 360 planting events. The whole battery is predicted
    under thirty minutes on one core with peak RSS under 500 MB; the 8 GB
    figure is the schema floor and is not expected to be approached. Peak RSS
    and wall clock are REQUIRED reported metrics precisely so the prediction
    can fail, and the certified-versus-uncertified overhead ratio is itself
    one of the deliverables.

  stopping_rules:
    - "STAGE 0, zero compute, HARD GATE: write out the three forced identities for W = V union -V and verify the unit-relabelling collision symbolically. If the collision does NOT hold, E4 may be unnecessary, the record is re-scoped downward to a cheaper and stronger suite, and the run STOPS - which would be a better outcome than the one proposed."
    - "STAGE 0 also re-reads the committed enumerator sources and records their sha256, because planted defect D2 is defined as a property of the committed control flow."
    - "STAGE 0 commits the full 7 by 5 matrix and every forced integer to the run directory with a hash BEFORE any defect is planted."
    - "STAGE 1: the hand-computed p = 101 fixture. A miss STOPS the run."
    - "STAGE 2: clean cells. E1 deviation must be exactly 0, E2 exactly 1.000, E3 exactly B at m = 2. Any deviation halts every arm."
    - "STAGE 3: the seven planted defects, one at a time, behind flags. STAGE 4: nearby-object, null-defect and overhead arms. STAGE 5: the curve-free arm. STAGE 6, zero compute: the schema block with the detection floor as a MANDATORY field."
    - "Budget exhaustion at any stage is an INFRASTRUCTURE outcome under AGENTS.md rule 5 and is never reported as evidence about the suite's power."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Planting a defect before the detection matrix and forced integers are committed with a hash."
    - "Comparing the committed matrix against the outputs in the reverse direction, i.e. writing the matrix after seeing results."
    - "Emitting an exhaustive-nondecomposition certificate for a BUDGETED or heuristic search. The class is defined only for exhaustive enumeration and the certificate must record the regime."
    - "Emitting a certificate without its k and its detection floor. A suite quoted without its floor overstates itself."
    - "Using an E4 re-decider that shares any code path with the enumerator, as determined by the import-graph and AST checks."
    - "Reading any decomposition-rate conclusion off this battery; it measures instrument power, not rates."
    - "Any post-hoc change to the pre-registered matrix, the forced integers, the values of k or eps, or the declared floor. A change requires a versioned protocol_amendment before the affected arms are re-read."

  success_criterion: >-
    The run SUCCEEDS as a power measurement, whatever the suite's measured
    power turns out to be, when: the unit-relabelling collision is verified
    symbolically at Stage 0; the p = 101 fixture reproduces its stored
    integers exactly; E1 is exactly 0, E2 exactly 1.000 and E3 exactly B on
    every clean cell; all seven defects are planted and scored against the
    hash-committed matrix; the nearby-object control PASSES with the correct
    forced constant binom(2B-t+m-1,m) at every t in {1,2,3}; the null-defect
    arm PASSES; the D7 floor is measured at all nine (eps, k) cells with 20
    plantings each and reported with binomial intervals; the structured-coset
    arm is reported separately; the curve-free arm is run and its
    reproduce/not-reproduce split recorded per matrix cell; and the schema
    block is emitted with the detection floor as a MANDATORY field and a
    plain statement of the defect classes the suite cannot see.

  falsification_criterion: >-
    THE SUITE IS A FAILED SUITE if it fires on fewer than five of the seven
    planted defects, or if it fires where a forced miss is predicted (any of
    E1-E4 on D1; any of E1-E3 on D6). THE SUITE IS DISQUALIFIED if the
    nearby-object control false-alarms, since rejecting correct instruments
    is worse than missing a defect. THE SUITE HAS AN UNSTATED FALSE-POSITIVE
    RATE, and its threshold must be restated before any detection number is
    quoted, if the null-defect arm fires. THE BATTERY IS VOID if E1 deviates
    from the forced total on a clean cell, or if D2's shortfall differs from
    the forced 2B^2 at m = 3. THE RECORD IS RE-SCOPED DOWNWARD, and this is
    the best available outcome, if the unit-relabelling collision fails at
    Stage 0. THE OBLIGATION CANNOT BE UNIVERSAL if overhead exceeds 5x wall
    time or 10x memory. THE SCOPE COLLAPSES TO A NON-CURVE STATEMENT for
    every matrix cell that reproduces in the curve-free arm, and the
    pre-declared consequence binds for each such cell individually.

  required_artifacts:
    - "The Stage 0 receipt: the three forced identities written out, the symbolic verification of the unit-relabelling collision, the committed 7 by 5 matrix and forced integers with their sha256, and the sha256 of every enumerator source read."
    - "The hand-computed p = 101 fixture file, stored before the run, and the comparison receipt."
    - "Per-cell clean-run records: p, curve, B, m, seed, base convention, E1 total and deviation, E2 fraction, E3 count."
    - "The measured 7 by 5 detection matrix with the firing statistic and its value per cell, beside the committed matrix."
    - "The D7 floor table: eps, k, 20 plantings each, detection rate with an exact binomial interval, against 1 - (1-eps)^k; plus the structured-coset arm separately."
    - "Nearby-object arm results at t in {1,2,3} with the forced constant used; null-defect arm results."
    - "Import-graph and AST-diff receipt establishing E4 independence."
    - "The curve-free Z/N arm's full matrix and the per-cell reproduce / does-not-reproduce split."
    - "The overhead table: certified versus uncertified wall clock and peak RSS, plus operation counts so the ratio can be re-derived without trusting the timing."
    - "The proposed certificate schema block as concrete YAML, with the detection floor as a MANDATORY field, the regime field (exhaustive versus budgeted), the base convention field, the spot-check seed and declared target support, and a plain statement of the defect classes the suite cannot see."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr."

  assigned_to: executor

  limitations:
    - >-
      NO ATTACK, NO EXPONENT, NO ALGORITHM. Verification infrastructure for
      one measurement at toy scale.
    - >-
      The certificate class covers EXHAUSTIVE enumeration only and does not
      weaken, amend or reinterpret the policy statement about budgeted
      negatives.
    - >-
      A passing certificate says the computation is internally consistent and
      spot-check-consistent. It does not say the rate is interesting, licenses
      no cross-cell comparison, and transfers to no other arity, base, curve
      or scale.
    - >-
      The detection floor of about 3/k is the honest hidden cost, and a
      certificate quoted without its k overstates itself.
    - >-
      A defect IN THE CURVE ARITHMETIC is invisible to both the enumerator
      and the re-decider, because they must share that module to be
      comparable. This blind spot is unremovable by this design and is stated
      in the certificate rather than patched over.
    - >-
      Replanted defects are reconstructions, not the historical code paths.
      No claim is made that the historical batch would have been saved.
    - >-
      Five of the seven planted defects are ones the invariants were designed
      to catch, which proves nothing on its own. The record's credibility
      rests on D6 and D7, chosen to EVADE the suite. If a reviewer can name
      an eighth defect class that evades all five checks, that is a
      successful attack on this contract and must be recorded as such.
    - >-
      Adopting the schema into the program's templates is a Coordinator
      decision that this contract does not perform.
