experiment:
  id: EXP-ALR-9711e4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-9a91df; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-9a91df
  question_id: RQ-ALR-002
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Build and validate a peak live-slot watermark instrument for straight-line programs over
    F_p, and report forward-versus-transpose watermark and operation-count ratios for three matched
    program pairs at sizes 8 to 64
  objective: 'The run reduces one uncertainty: whether an operation-count claim about a transposed
    straight-line program carries a memory claim with it, which matters because the ALR lane states
    its open constructor as an operation count and its obstruction as a memory body. (i) It builds
    a liveness instrument that computes the peak live-slot watermark of a straight-line program under
    a declared slot-reuse policy, and validates it against hand-computed programs and a self-transpose
    null in which the ratio must be exactly one. (ii) It constructs three matched pairs, Horner, Vandermonde
    application and modular composition, each with its transpose, verifies every transpose numerically
    by a bilinear identity on random vectors before any measurement is reported, and records instruction
    count and watermark for all six programs at sizes 8, 16, 32 and 64. (iii) It generates thirty
    shape-matched random straight-line programs per size, matched in length, slot count and operand-reuse
    distribution, transposes and instruments them identically in the same invocation, and reports
    the null watermark-ratio distribution against which the structured pairs are read. The run computes
    nothing about elliptic curves, solves no instance, and measures no ALR route.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: the instrument computes watermarks
      that agree with hand computation on the validation programs, is symmetric on the self-transpose
      null, and reports the stated instruction counts and watermarks for the three constructed pairs
      at the tested sizes under the declared slot-reuse policy, with the stated ratios and the stated
      null distribution. What does NOT follow: that the ALR open constructor would exhibit any of
      these ratios, since it is not measured and does not exist; that transposition must cost memory
      in general; that any lower bound on program memory holds; that the lane''s nN body is or is
      not avoidable; or that any attack, speedup or security consequence exists. The durable output
      is an instrument, and an instrument makes claims checkable rather than making claims.'
  inputs:
    procedure: 'STAGE 0, instrument construction, one day of implementation, no compute: represent
      straight-line programs explicitly, implement the backward liveness pass, declare the slot-reuse
      policy, and write the hand-computed validation cases. STAGE 1, validation, seconds: run the
      instrument on the validation programs and on the self-transpose null; abort on any disagreement.
      STAGE 2, pair construction, half a day: build Horner, Vandermonde application and modular composition
      at sizes 8, 16, 32, 64, and construct each transpose by the standard reversal-and-adjoint rule.
      STAGE 3, transpose verification, seconds: check the bilinear identity on twenty random vector
      pairs per transpose over F_p; no unverified transpose proceeds. STAGE 4, instrumentation, seconds:
      record instruction count and watermark for all six programs at each size. STAGE 5, null arm,
      minutes: thirty shape-matched random programs per size, transposed and instrumented identically.
      STAGE 6, self-checks, seconds: operation-count ratio must sit at one up to the additive term,
      or the run is void. STAGE 7, reporting, minutes: ratio tables and null distributions with the
      slot-reuse policy printed on every table. Compute is trivial; the cost is implementation.'
    instrument: 'Python 3, no external numerical libraries. A straight-line program is a list of typed
      instruction tuples over F_p with explicit operand and result slots; liveness is a backward pass
      with a set of live slots; transposition is implemented as list reversal with per-instruction
      adjoint substitution. Verification uses exact F_p arithmetic on random vectors. Repository modules:
      harness/runner.py for deterministic seeding, manifests and immutable run records, and harness/toycurve.py
      only for its exact field arithmetic conventions. No Sage, no compiler toolchain, no external
      service.'
    parameters: 'Program sizes 8, 16, 32, 64, where size is the polynomial degree or matrix dimension
      of the underlying map. Three structured pairs: Horner evaluation, Vandermonde application, modular
      composition. Thirty shape-matched random programs per size, matched on length, slot count and
      operand-reuse histogram. Twenty random vector pairs per transpose verification. One toy prime
      near 10^5 and one near 10^2 to confirm the watermark is characteristic-independent, which it
      must be since it is structural. Total 4 sizes times (6 structured programs plus 60 null programs)
      times 2 primes.'
  controls:
  - Shape-matched random straight-line programs, thirty per size, transposed and instrumented by the
    identical code path in the same invocation.
  - Self-transpose null, where the ratio must be exactly one, catching instrument asymmetry.
  - Numerical transpose verification by bilinear identity on twenty random vector pairs, before any
    watermark from that transpose is reported.
  - Hand-computed validation programs whose watermarks are known by inspection, run at every invocation
    as a regression check.
  - 'Operation-count self-check: the transpose-over-forward instruction ratio must sit at one up to
    the additive term, or the run is void.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Generate random straight-line programs of the same length, the same
    slot count and the same operand-reuse distribution as each matched pair member, transpose them
    by the identical construction, and instrument both by the identical code path in the same invocation.
    The null gives the watermark ratio attributable to program shape alone. The signal arm means something
    only if the structured programs, composition and its transpose, depart from that shape-matched
    baseline. If they do not, the finding is that the watermark ratio is a property of program shape
    and carries no information specific to modular composition, which is a complete and usable result.
    A second null instruments a program against itself, where the ratio must be exactly one, catching
    any asymmetry in the instrument.'
  independent_variables:
  - program_family
  - program_size
  - forward_or_transpose
  - arm_structured_or_shape_matched_random
  metrics:
    primary:
    - forward_peak_live_slot_watermark
    - transpose_peak_live_slot_watermark
    - watermark_ratio_transpose_over_forward
    - operation_count_ratio_transpose_over_forward
    secondary:
    - shape_matched_null_watermark_ratio_distribution
    - transpose_verification_pass_rate
    - self_transpose_null_ratio
    - validation_program_agreement_flag
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The peak live-slot watermark of each program and its transpose, and the ratio of the
      two, per family and size.
    formula: 'Watermark is defined as max over instruction indices i of the cardinality of the set
      of slots written at or before i and read at some index strictly greater than i, under the declared
      slot-reuse policy. Predicted operation-count ratio: 1 + O((inputs + outputs)/instruction count),
      that is, one up to an additive term, which is asserted as a self-check rather than predicted
      as a result. Predicted watermark ratio for the modular-composition pair: at least 1.5 at size
      32 and above, on the reasoning that composition reads its inner polynomial with high fan-out
      and the transpose converts that fan-out into simultaneously live accumulators. Predicted self-transpose
      null ratio: exactly 1.'
    source: Pre-registered in the parent proposal IDEA-20260816-9a91df before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Program sizes 8 to 64, which are toy by construction and are chosen so that transposes
      can be verified exactly and watermarks hand-checked at the smallest sizes. The watermark is
      a static structural count and is characteristic-independent, which the two-prime control confirms,
      so the only scale question is whether fan-out effects appear at these sizes; the entry reports
      the ratio as a curve in size and explicitly declines to extrapolate it, naming the possibility
      that the effect only appears above the tested range.
    correspondence: null
  tail_checks:
  - Hand-check the size-8 modular composition watermark instruction by instruction, since an off-by-one
    in the liveness pass produces plausible numbers at every size and is only visible by inspection.
  - Report the full null ratio distribution rather than its mean, since the structured pairs must
    be read against its spread and a narrow distribution makes a small gap meaningful while a wide
    one does not.
  - Check the largest size for slot-reuse policy sensitivity by rerunning it under the opposite policy,
    since that is where the two policies diverge most.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at size 64; do not extend the sweep to find a larger ratio.
  - Abort the run if any transpose fails verification or if the operation-count self-check fails at
    any size.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The instrument agrees with hand computation on every validation program, returns
    exactly one on the self-transpose null, every transpose passes bilinear verification, the operation-count
    ratio sits at one up to the additive term at every size, and watermark ratio tables plus the shape-matched
    null distribution are emitted with the slot-reuse policy printed alongside.
  falsification_criterion:
  - Any disagreement with a hand-computed watermark.
  - Self-transpose null ratio other than exactly one.
  - Any transpose failing bilinear verification.
  - Operation-count ratio departing from one beyond the additive term.
  - Structured pairs indistinguishable from the shape-matched null at every size.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-9a91df
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The slot-reuse policy is declared rather than derived, and a Coordinator must choose which policy
    the lane's memory claims are to be made under, since the choice can move a watermark by a factor
    equal to program length.
  - Which transposition variant to use is unsettled; variants that insert accumulation slots change
    the watermark for construction reasons and the contract must fix one before the run.
  - Whether shape matching on the operand-reuse histogram is a sufficient null, or whether fan-out
    depth must also be matched, needs a ruling, since fan-out is the very feature hypothesised to
    drive the effect.
