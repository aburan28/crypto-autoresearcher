experiment:
  id: EXP-ECDLP-1e6502
  hypothesis_id: H-ECDLP-f1e714
  derived_from_idea: IDEA-20260905-3a30d5
  instrument_idea: IDEA-20260905-dacf4f
  question_id: RQ-ECDLP-c1b7b1
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Fermat-quotient, torsion-lift and defect digit census on toy non-anomalous
    curves, with the p-adic instrument built and self-checked in Stage 1 and the
    anomalous attack reproduced as the known-true object
  status: draft
  objective: >-
    Build and validate the p-adic instrument of IDEA-20260905-dacf4f; compute the
    frozen digit library on cofactor-1 non-anomalous curves at field_bits 10 to
    20; run the DL-spectrum statistics of EXP-ECDLP-184fc4 with the random-function
    null; reproduce the anomalous recovery at 10 to 16 bits with certificates and
    measure the Smart functional's spectrum. Decide H-ECDLP-f1e714 claims (1)-(3).
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking): freeze the digit library and the
      post-functions; write the derivation note for the Teichmuller congruence,
      the first-order identity, the defect digit formula, the Smart functional and
      the (t, w)-chart end step. STAGE 1 (instrument, blocking): implement the
      module; run the five self-checks with transcripts; anomalous curve search at
      10 to 16 bits. STAGE 2 (census): non-anomalous ladder, all members, precision
      2 and 3, random null. STAGE 3 (known-true): anomalous arm. STAGE 4 (report):
      beta, Z, half-energy tables, slopes, readings.
    library: >-
      FROZEN. Base digits, each normalised to [0, 1) by division by p: F(R) = x
      q_p(x) mod p; q_p(x); q_p(y); D_t(R) the torsion lift's second x-digit;
      D_t^y the torsion lift's second y-digit; delta_1(R) = (F(R) - D_t(R))
      (2y)^(-1) mod p; delta_2 the corresponding precision-3 digit; the Teichmuller
      lift's third x-digit. Post-functions of each base digit d: 1[d = j mod m] for
      m in {2, 4, 8}, Legendre(d) (with 0 mapped to 0), 1[d < p/2]. About 100
      members. No member may be added after Stage 1.
    mechanism: >-
      For each non-anomalous cell: enumerate G = <P> as iP, tabulate logs, certify
      1000 entries. For each point with y != 0 and x != 0: compute the Teichmuller
      x-lift x^p mod p^3, the Hensel y-lift, the torsion section at precision 3
      via [n-1] s(R) in affine coordinates mod p^5 and the (t, w)-chart end step,
      the defect via the coordinate-difference formula, and the precision-3
      variants; assert precision-3 truncated equals precision-2. Centre each
      member, FFT over the log ordering, record max spike, Z, half-energy fraction
      as in EXP-ECDLP-184fc4; null by seeded permutation of values. Fit beta across
      the ladder. Anomalous arm: for each anomalous curve, choose P a generator, Q
      = [m]P for 20 seeded m; compute Sigma(R) = formal_log([p] s(R)) / p mod p for
      all R, recover m = Sigma(Q) / Sigma(P) mod p, certify [m]P = Q; if Sigma
      vanishes identically mod p^2 perturb the curve lift by p and record it;
      compute Sigma's spectrum over the log ordering.
    instrument: >-
      harness/toycurve.py; the new p-adic module (pure Python); numpy FFT
      (undeclared dependency; the executor installs it and records the version);
      harness/runner.py for run records.
  controls:
    - five instrument self-checks with transcripts (blocking)
    - random-function null per member per cell (blocking, same file)
    - certificate of the log table per curve (blocking)
    - second curve family per size
    - anomalous arm with certified recovery (blocking for claim 3)
    - precision consistency 2 versus 3 on every point (blocking)
  independent_variables:
    - field_bits in {10, 12, 14, 16, 18, 20}
    - seed in {20260905, 20260906, 20260907}
    - precision in {2, 3}
    - library member
  metrics:
    primary:
      - beta per member with bootstrap interval, and the null's beta
      - Z per member per cell, and the null's Z
      - half-energy fraction per member per cell
      - anomalous recovery count with certificates, and Sigma's beta and half-energy fraction
      - self-check pass count
    secondary:
      - argmax frequency per member per cell
      - excluded point counts (y = 0, x = 0) per curve
      - anomalous curves found per size and search cost
      - wall seconds and peak bytes per cell
  heuristic_under_test: HEUR-LIFT-H1
  preregistered_prediction:
    quantity: max over a != 0 of |g^(a)| as a function of N per member; Sigma's spectrum on anomalous curves
    formula: >-
      Non-anomalous members: proportional to N^beta with beta in [0.45, 0.60], Z
      in [0.5, 4], half-energy fraction 0.5 +- 0.05. Sigma: beta = 1, half-energy
      fraction below 8/N, exact certified recovery.
    source: >-
      Pre-registered in IDEA-20260905-3a30d5 and H-ECDLP-f1e714; the Gumbel law
      for a random function and the linearity of the anomalous functional
      (KN-TECH-033) are the models; never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Exhaustive tabulation at 10 to 20 bits, precision 2-3. Evidence capped at
      claim_tier toy; slopes are the only scale statements.
    correspondence: null
  tail_checks:
    - The largest Z observed over all members and cells has null exceedance probability above 1/(members * cells); otherwise re-run at a fourth seed.
    - Members whose marginal is far from uniform at small p (Fermat quotients at 10 bits) are flagged; the null shares the marginal and the flag is informational.
    - The anomalous arm reports any curve lift that had to be perturbed.
  replication:
    seeds: [20260905, 20260906, 20260907]
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 48
  stopping_rules:
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
    - Stop immediately if any self-check or the precision consistency fails; measurements with a failed instrument are attempted_and_inconclusive.
    - Stop and escalate to an independent review-adversarial session if any member shows beta at or above 0.60 on both families at the two largest sizes.
  invalidation_rules:
    - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is never negative mathematical evidence (AGENTS.md rule 5).
    - A curve whose certificate sample fails makes every cell on that curve invalid.
    - A cell whose random null shows beta outside 0.5 +- 0.05 or Z above 4 is an instrument defect and is invalid.
    - An anomalous instance whose recovered scalar fails the certificate makes that instance completed_invalid.
  success_criterion: >-
    Every member has beta in [0.45, 0.60] with the null at 0.5 +- 0.05, Z in
    [0.5, 4], half-energy fraction 0.5 +- 0.05; every anomalous instance is
    recovered with certificate and Sigma has beta = 1; all five self-checks pass.
    This supports H-ECDLP-f1e714 claims (1)-(3) at toy scale.
  falsification_criterion:
    - A member with beta at or above 0.60 on both families at the two largest sizes with the null at 0.5. Claim (1) false for that member.
    - delta_1 or delta_2 above threshold. Claim (2) false.
    - Anomalous recovery failure, Sigma not beta = 1, or any self-check failing. Claim (3) fails; instrument void.
    - Precision inconsistency. Instrument defect; nothing reported.
    - Crashes, timeouts, memory exhaustion. Infrastructure, never negative mathematical evidence.
  required_artifacts:
    - manifest.yaml with command, commit, dirty-tree state, environment (numpy version) and the inference block
    - raw-result.json with every per-member per-cell statistic, the null beside it, excluded counts, and the anomalous arm's certificates
    - the five self-check transcripts
    - the frozen library listing, hashed in the manifest
    - the Stage 0 derivation note
    - the anomalous curve list with search cost
  assigned_to: executor
  approved_by: null
  approval_gate:
    - Coordinator approval required before execution; this contract is a design draft and is NOT approved.
    - Stages 0 and 1 are blocking; no census cell runs before all five self-checks pass.
    - The library may not be extended after Stage 1; a new member is a new versioned amendment.
