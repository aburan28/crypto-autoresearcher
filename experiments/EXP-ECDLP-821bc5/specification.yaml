    H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77,
    H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5,
    H-ECDLP-07c7c6, H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-cb5565
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-2bb9e2
  source_proposal: IDEA-20260902-7952e7
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-cb5565 under the standing 2026-09-06
    user authorization. Stage 0 is the exact W_n
    identity calibrator. Sympy expansion of S_4/S_5,
    specialised-support census, Aut arm, sigma
    ladder, and crater hunt are later stages and
    are not run here.

  objective: >
    Evaluate the exact integer identity
    W_n=(n-1)*2^{n-2} on one frozen
    family (REAL, KF, NULL) and decide
    whether the T1 weight-law
    calibrator works. Stage 0 does not
    expand S_4, does not enumerate Aut,
    and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL W_n at
      n in {3,4,5,6} equals (4,12,32,80)
      and W_6_alt equals 80; KF
      omitted-term W_4 equals 16 not 12;
      NULL zero-sequence equals 0 not
      the closed form; n=2 and n=0
      rejected. Certificate kind none.
    formula: >
      closed_form(n)=(n-1)*2**(n-2).
      w_res(d_f,w_f,d_g,w_g)=
      d_g*w_f + d_f*w_g - d_f*d_g.
      Frozen splits: W_3=4;
      W_4=w_res(2,4,2,4)=12;
      W_5=w_res(2,4,4,12)=32;
      W_6=w_res(4,12,4,12)=80;
      W_6_alt=w_res(2,4,8,32)=80.
      KF omits -d_f*d_g so
      W_4_kf=2*4+2*4=16.
      FORCED Stage 0: fixture_pass,
      real_weight_pass,
      known_false_omit_sylvester_pass,
      reject_invalid_pass,
      null_zero_pass all true.
    source: >
      ledger/proposals/IDEA-20260902-7952e7.yaml
      claim T1 and STAGE 0 hard gate.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260902-7952e7 also flags a
    sympy expansion of S_4 and S_5, a
    specialised-support census at a=0
    and b=0, an Aut arm, and a sigma
    ladder on the N=19507
    crater-versus-floor class. Stage 0
    does not expand those polynomials,
    does not specialise x_n, does not
    enumerate Aut, and does not fit
    sigma. Those arms are Stage 1+
    objects. Exact integer W_n
    identities are the only Stage 0
    arm. This is a disclosed tightening,
    not a silent change of the idea's
    claim. The frozen splits are
    W_3=4 and the four w_res calls
    above. This W_n is not the O2-line
    second moment W.

  inputs:
    fixture:
      n_values: [3, 4, 5, 6]
      w3_frozen: 4
      real:
        id: REAL
        must_W: {3: 4, 4: 12, 5: 32, 6: 80}
        must_W6_alt: 80
        role: real_identity
      known_false:
        id: KF
        omit_sylvester_term: true
        must_W_4: 16
        must_not_equal_real: true
        role: known_false_omitted_sylvester_term
      matched_null:
        id: NULL
        kind: zero_sequence
        must_W: 0
        must_not_equal_real: true
        role: matched_null_zero_sequence
      invalid:
        - id: n-two
          n: 2
          must_reject: true
        - id: n-zero
          n: 0
          must_reject: true
      working_model: >
        Exact W_n identity for frozen
        Sylvester-weight splits. Not a
        sympy expansion. Not an Aut arm.
        Not a sigma ladder. Not a crater
        hunt. Not a rho beat.
      do_not_expand_s4: true
      do_not_enumerate_aut: true
      do_not_fit_sigma: true

  independent_variables:
    - object in the frozen family
    - whether the Sylvester -d_f d_g term is present
    - whether n is in {3,4,5,6}

  null_object:
    name: zero-sequence at n in {3,4,5,6}
    construction: >
      Replace the recurrence by the zero
      sequence. W_n=0, which is not
      (4,12,32,80). This is the
      nearby-object control with the
      structure term removed.
    non_degeneracy_check: >
      known_false_omit_sylvester_pass must
      be true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      n=2 and n=0 must be rejected
      before an identity is read as a
      census.

  controls:
    - KF omitted-Sylvester-term W_4=16 (known-false / proves-too-much)
    - REAL identity at n in {3,4,5,6} plus W_6_alt
    - NULL zero-sequence rejection of collapse
    - n=2 and n=0 rejection
    - exact integer arithmetic, no floats
    - splits frozen before any polynomial is expanded

  metrics:
    primary:
      - fixture_pass boolean
      - real_weight_pass boolean
      - known_false_omit_sylvester_pass boolean
      - reject_invalid_pass boolean
      - null_zero_pass boolean
    secondary:
      - REAL W_n map
      - W_6_alt
      - KF W_4
      - NULL W_n
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen integer splits at n in
      {3,4,5,6}. No transfer to a
      specialised-support census, Aut
      count, sigma, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL is the frozen W_n map (4,12,32,80)
    - KF is the frozen omitted-term W_4=16
    - NULL is the zero sequence
    - n=2 and n=0 are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_weight_pass,
      known_false_omit_sylvester_pass,
      reject_invalid_pass, and
      null_zero_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-WTLAW.
    - Stages 1 and later are not authorized.
    - Do not expand S_4 or S_5.
    - Do not enumerate Aut.
    - Do not fit sigma.
    - Do not hunt a crater.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen splits after this freeze
    - Expanding S_4 because a frozen identity fails
    - Reading Stage 0 as a specialised-support census, Aut count, sigma ladder, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Reading this W_n as the O2-line second moment W
    - Authorizing Stage 1 of EXP-ECDLP-821bc5 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-735974 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-fdae20 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-089e80 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-b3f975 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-daf1bb from this contract
    - Authorizing Stage 1 of EXP-ECDLP-0d1336 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-881d63, H-ECDLP-9a1388, H-ECDLP-7f5b05, H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Dispatching EXP-ECDLP-df601f from BATCH-5a5091

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_weight_pass,
    known_false_omit_sylvester_pass,
    reject_invalid_pass, and
    null_zero_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a specialised-support
    census and not an attack.

  falsification_criterion: >
    A certified KF miss of the gap 16\neq12
    after fixture_pass is a scoped miss
    of P-S0-WTLAW. A certified REAL identity
    miss after fixture_pass is a scoped
    miss of P-S0-WTLAW. Infrastructure bugs
    are not mathematics. Stage 0 does not
    test P-S1-SUPPORT.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Frozen toy splits at n in {3,4,5,6}.
    - Not a sympy expansion. Not an Aut arm.
    - Not a sigma ladder. Not a crater hunt.
    - Not a rho beat. Not the O2-line W.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 821bc5. No Stage 1 of 735974.
      No Stage 1 of fdae20. No Stage 1 of 089e80.
      No Stage 1 of b3f975. No Stage 1 of daf1bb.
      No Stage 1 of 0d1336. No Stage 1 of 1aa0f8.
      No Stage 1 of 79f8c4. No Stage 1 of 628891.
      No Stage 1 of 9e9536. No Stage 1 of 90f602.
      No Stage 2 of 4be480. No Stage 2 of 6a97f4.
      No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - O2-line W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not expand S_4 or S_5.
    - Do not dispatch EXP-ECDLP-df601f from BATCH-5a5091.
