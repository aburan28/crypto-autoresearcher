experiment:
  id: EXP-SIG-007
  hypothesis_id: H-SIG-001
  version: 1
  title: >-
    n=21 residual_5 measurement attempt (D5-born non-rewritable component),
    memory-safe staged instrument: does the n=18 drop (1158 -> 974) mark
    decline onset or lattice fluctuation? Also records the n=21 D5 deficit
    (on-lattice series 909/1322/1862/1999, increments +413/+540/+137).
  status: approved
  objective: >-
    Measure residual_5 = extra_5 - A4_5 at n=21 on >= 2 standard seeds, where
    extra_5 = kernel_dim(M5) - rankK5 and A4_5 = rank mod K5 of the
    multiplication closure of the D3+D4 non-model syzygies at D5 (verbatim
    EXP-SIG-003/005 semantics). The prior attempt (EXP-SIG-005 RUN-n) died on
    memory: the tracked Python-int echelon needs ~25+ GB at n=21 D5
    (nb=42, nrows=279,048, ncols<=974,982, expected rank ~2.7e5). This
    experiment NEVER builds the tracked echelon: it stages (S0) D3/D4 +
    residual_4 + quotient bases + null D3/D4 control, (S1) D5 row/tag
    enumeration + Koszul/principal family K5 + closure images F3/F4, stored
    as compact position lists, (S2) exact ranks rankK5 / A3_5 / A4_5 via the
    REDUCTION-FREE UNION method on dense m4ri matrices (rank(K5 u F3 u
    F4) - rank(K5); the C6 cross-check identity verified on every prior
    cell), and (S3) the full rank(M5) via a checkpointed block-staircase
    m4ri engine (algorithm of src/h012c_block_m4ri.py, re-driven over the
    SIG instrument's own systems and row enumeration; identity-bound
    adjacency checkpoints). extra_5 and residual_5 follow arithmetically
    once S3 completes: extra_5 = (nrows - rank) - rankK5,
    residual_5 = extra_5 - A4_5. The DREG cost model (EV-DREG-001 section 7)
    prices S3 at n=21 at 25,000-32,000 s (~7-9 h) >> this task's 3,300 s
    budget: S3 is expected to CENSOR (infrastructure, AGENTS rule 5, NOT
    evidence); the checkpoint state + exact resume command are deliverables.
  inputs:
    systems: >-
      boolean chained Semaev m = t = 3, ti = 0, n = 21, seeds {1, 2}
      (replacement seeds 3, 4, ... if filtered non-standard). Seed 1 known
      standard (EXP-SIG-005 RUN-n filter record). Input-side standard filter
      verbatim EXP-SIG-002: standard := (R_x != 0) AND (no degree-1
      equation); filtered instances measured, recorded, excluded.
    reference: >-
      support-matched semi-regular null (boolean_null), measured at D3/D4 on
      every n=21 cell (cheap). Null D5 arm: CENSORED a priori by cost (same
      7-9 h scale); consequence: all sem D5-stage quantities are PRELIMINARY
      (no null D5 validation this experiment).
    instrument: >-
      bit-identical copies of the EXP-SIG-001..005 instrument
      (src/h013_f5_signatures.sage sha256
      1ba96fe477c9dc2e7c551c96353c8361d21e40134551342636b2f13015c09087 +
      semaev_tree.py / ic_first_fall_fast.py / macaulay_export.py, hashes
      re-verified at copy time) + a reference (non-executed) copy of
      src/h012c_block_m4ri.py sha256
      0eb38126998c73601687e248439a05f39038e762d5a5b99009598b67e59a0bbb.
      New staged driver SIG7_run.sage (this experiment only).
    anchors: >-
      Gate C3: n=15 seed 1 D3 def/extra 1, D4 def/extra 40, residual pinned
      10 / canonical 11. Closure anchors (EV-SIG-003): n=12 seed 2 sem:
      rank 28,097, extra_5 1,322, A3_5 242, A4_5 444, residual_5 878;
      n=15 seed 1 sem: rank 69,073, extra_5 1,863, A3_5 392, A4_5 705,
      residual_5 1,158. n=18 seed 1 sem (EV-SIG-005 RUN-j): rank 143,882,
      extra_5 2,000, rankK5 6,650, A3_5 578, A4_5 1,026, residual_5 974.
      Derived rankK5 anchors: n=12 s2: 2,093; n=15 s1: 3,944. sr_pred
      anchors (this derivation, cross-checked): 29,418 / 70,935 / 145,881 /
      268,674 at n=12/15/18/21.
    frozen_constants: >-
      n=21 D5 sem: nb=42, nrows=279,048 (21*C(42,<=3) + 21*C(42,<=2)),
      ncols <= 974,982 = C(42,<=5), sr_pred = 268,674 (computed 2026-07-24,
      verified against the n=12/15/18 anchors).
  controls:
    - >-
      C1 gate — support-matched null at n = 9, 12 (D = 3, 4): extra = 0,
      rank == sr_pred, null residual = 0 under BOTH reductions. Runs first;
      no measurement run unless the gate passes.
    - C2 gate — injected known 3-generator constant-multiplier syzygy at
      n = 9 must be detected (verbatim EXP-SIG-002/004/005 semantics).
    - >-
      C3 gate — T2 anchor continuity at n = 15 seed 1: D3 def 1, D4 def 40,
      residual pinned 10, canonical 11.
    - >-
      C4a gate — in-run determinism: n = 15 seed 3 sem computed twice,
      identical modulo timing.
    - C9a staged-path anchors — the S1/S2 staged union-rank path must
      reproduce the EV-SIG-003 closure anchors EXACTLY at n=12 seed 2
      (rankK5 2,093, A3_5 242, A4_5 444) and n=15 seed 1 (rankK5 3,944,
      A3_5 392, A4_5 705), and (budget permitting) the EV-SIG-005 n=18
      seed 1 anchors (rankK5 6,650, A3_5 578, A4_5 1,026 -> residual_5 974
      with the known extra_5 2,000). Mismatch = instrument drift, halt.
    - C9b staircase-engine validation — the block-staircase rank engine at
      n=12 seed 2 sem D5 must give rank == 28,097, under TWO different
      column-chunk sizes (partition consistency, mirrors
      RUN-DREG-001-CONTROL-N12-PARTB), before any n=21 S3 progress is
      recorded.
    - >-
      C5 null arm — n=21 null D3/D4 on every cell: extra = 0 and
      rank == sr_pred (cheap). Null D5: censored by cost (see inputs); all
      sem D5-stage quantities then carry preliminary=true.
    - C6 exactness — the union method is reduction-free by construction
      (rank(K5 u F) - rank(K5)); equivalence to the canonical full_reduce
      mod-K5 ranks is exactly what C9a anchors (they were produced by the
      canonical method and matched union cross-checks on every prior cell).
    - C7 sanity at n=21 — B3 == 1, B4 == 56 == 8n/3, A3_5 <= A4_5,
      rankK5 >= 0, no missing image rows (miss3 == miss4 == 0),
      residual_4 == 15 (the 2n/3+1 law, EV-SIG-004).
    - C8 instance filter — per inputs; replacement seeds recorded.
    - C4b determinism — if two n=21 seeds complete S0-S2, one cell is
      re-run in a separate sage invocation and deep-compared modulo timing.
  independent_variables:
    - n in {9, 12, 15 (gate/anchors); 18 (anchor); 21 (measurement)}
    - seed in {1, 2 (+replacements)} at n=21
    - arm in {sem, null}
  metrics:
    primary:
      - residual_5 at n=21 per standard sem seed (requires S3 completion;
        expected censored)
      - deficit_5 = sr_pred - rank(M5) at n=21 per seed (same dependency)
    secondary:
      - >-
        per seed: filter fields; D3/D4 deficit/extra; residual_4 canonical
        and pinned; B3/B4; D5 nrows/ncols (support coverage vs 974,982);
        rankK5; A3_5; A4_5; null D3/D4 extra/rank
      - >-
        S3 progress: columns processed x/ncols, rank_acc, work-seconds,
        per-unit timings, peak RSS, checkpoint paths, exact resume command
  replication:
    seeds: ">= 2 standard seeds at n=21 for the residual_5 series point"
    independent_instances: "matched null D3/D4 control per seed"
  budget:
    wall_clock_seconds_per_run: 280
    total_wall_clock_seconds: 3300
    maximum_memory_gb: 24
    maximum_runs: 12
  stopping_rules:
    - The C1/C2/C3/C4a gate runs first (RUN-a); no measurement run unless
      it passes.
    - C9a/C9b anchor mismatch halts before any n=21 S3 launch (instrument
      drift, not evidence); already-flushed cells remain valid records.
    - >-
      Harness cap: each Bash invocation is capped ~280 s; the driver
      self-caps sage work at --soft-cap (default 235 s), checks before
      every stage/chunk, and checkpoints to disk. A stage that cannot
      finish within one invocation resumes in the next (identity-checked).
    - >-
      S3 (rank M5) at n=21 is expected to censor by budget: progress,
      work-seconds, peak RSS and the exact resume command are recorded;
      validity_status censored_compute (AGENTS rule 5, NOT evidence).
    - >-
      Scope-reduction order: drop the n=18 anchor first, then seed 2's
      S1/S2 stages (deliver seed 1 fully), then S3 progress (deliver
      S0-S2 only), then seed 2 entirely (single-seed partial, recorded).
    - Stop launching new runs at ~minute 45 of the task wall budget;
      then write summary/analysis/ledger.
  invalidation_rules:
    - Timeout/OOM/kill/ENOSPC = failed_infrastructure or censored_compute
      (AGENTS rule 5), never evidence.
    - A determinism mismatch invalidates the affected cell.
    - A null D3/D4 cell with extra != 0 or rank != sr_pred invalidates the
      run's instrument state (gate semantics).
    - A C9a/C9b anchor mismatch invalidates the staged path (halt).
    - Filtered (non-standard) instances describe only themselves.
  success_criterion: >-
    Numbers only (verdict belongs to the Coordinator): residual_5 and
    deficit_5 at n=21 on >= 2 standard seeds with controls, OR an honest
    checkpointed partial: gate + anchors PASS, n=21 cheap stages (S0-S2)
    on >= 1 standard seed, S3 progress recorded with resume command, and
    validity_status set honestly (in_progress_checkpointed /
    censored_compute). A full censor of S3 with S0-S2 delivered is a
    partial success per the handoff.
  falsification_criterion: >-
    residual_5(21) >= 974 on any standard seed would refute 'decline
    onset' and support lattice fluctuation; residual_5(21) < 974 would
    extend the decline (two-point). deficit_5(21) continuing the
    +413/+540/+137 deceleration vs re-accelerating tests the
    EV-DREG-002 phase-transition confound. (Both require S3; expected
    censored this task.)
  required_artifacts:
    - specification.yaml (this file)
    - implementation.md
    - SIG7_run.sage (staged checkpointing driver)
    - src/ instrument copies (sha256-recorded, incl. reference h012c copy)
    - runs/RUN-EXP-SIG-007-*/manifest.yaml, raw.json, stdout.txt,
      stderr.txt, command.txt, environment.json
    - work/ checkpoints (stage state, position-list pickles, adjacency
      pickle, staircase state + carries, sha256-pinned)
    - summary.json
    - analysis.md
    - ledger/EV-SIG-007.yaml
  assigned_to: executor
  approved_by: coordinator   # handoff TASK-20260724-SIGN21

handoff:
  id: TASK-20260724-SIGN21
  from: coordinator
  to: executor
  objective: >-
    Measure residual_5 at n=21 (>= 2 standard seeds) to decide whether the
    n=18 drop (1158 -> 974) is decline onset or lattice fluctuation; record
    the D5 deficit at n=21. Memory-safe chunked rank computation; kill at
    checkpoint boundaries; honest partial delivery.
  inputs:
    - ledger/EV-SIG-005.yaml, EV-SIG-003.yaml, EV-SIG-004.yaml
    - experiments/EXP-SIG-005/analysis.md
    - experiments/EXP-SIG-004/src/ (copied, unmodified)
  constraints:
    - Write ONLY inside experiments/EXP-SIG-007/ and ledger/EV-SIG-007.yaml;
      no git commits; treat all other paths as read-only (paused
      concurrent session exists).
    - ~280 s harness cap per invocation; driver soft cap 235 s; one seed
      at a time.
    - >-
      Disk is tight (~131 GiB free): clean intermediates, compact position
      lists, no full-matrix dumps.
    - A partial result with honest validity_status is a success;
      fabrication is the only failure.
  deliverables:
    - experiments/EXP-SIG-007/ complete artifact tree
    - ledger/EV-SIG-007.yaml
    - final report to the Coordinator (numbers only, no verdict)
  budget:
    wall_clock_seconds: 3300
    memory_gb: 24
    maximum_runs: 12
  completion_gate:
    - deliverables written
    - controls pass or deviations recorded
    - validity_status set honestly
  return_format: execution_report
