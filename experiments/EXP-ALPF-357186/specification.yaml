experiment:
  id: EXP-ALPF-357186
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c1314e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c1314e
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Frozen two-scale transfer prediction for one ALPF survivor: pre-register degree and cost-ratio
    values at 21 and 25 bits from the archived 13/15/17 bit table, then measure and report the signed
    residual with null and cost-model sensitivity arms.'
  objective: 'The one uncertainty a run reduces is whether the ALPF lane''s toy-scale numbers extrapolate
    the way its downstream reasoning silently assumes. Stated as parts: (i) can the archived 13, 15
    and 17 bit rows of experiments/EXP-ALPF-010/analysis.md be reproduced from the cost formulas that
    analysis states, because a residual measured against an unreproducible baseline is meaningless;
    (ii) with a prediction for 21 and 25 bits committed and hashed BEFORE any new computation, what
    is the signed residual between predicted and observed for the algebraic quantities d_ff and D_reg_pred
    and for the crossbred-to-rho field-operation ratio; (iii) does the split behaviour predicted in
    the proposal hold -- algebraic quantities invariant in the field size at fixed degree profile
    and fixed factor-base size, cost ratio moving as the rho baseline''s sqrt(p) growth requires --
    or do both move, or neither, either of which indicates the cost model rather than the algebra
    is carrying the archived trend. Reducing these replaces an implicit transfer hope with a number
    that has a sign and an interval, and it does so entirely in machine-independent field-operation
    counts.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: over the tested interval
      of 13 to 25 bits, for these representations and factor-base sizes, the pre-registered law predicted
      the observed quantities with signed residual r and interval I, under the stated cost constants,
      with the null and sensitivity arms behaving as reported. What does NOT follow: any statement
      about behaviour beyond 25 bits and specifically nothing about cryptographic scale; any claim
      that crossbred, F4 or rho is faster than another at any size; any claim that the archived ratio
      is achievable as a real cost; and no attack, speedup or security consequence. A small residual
      validates a law over a 12-bit window and is not a licence to extrapolate it further.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute): transcribe the archived cost table and the stated cost
      formulas from experiments/EXP-ALPF-010/analysis.md into a frozen fixture. STAGE 1 (cost: minutes):
      recompute the 13/15/17 bit rows from those formulas and require an exact or documented match;
      abort on failure. STAGE 2 (cost: ~2 hours human, 0 compute): fit the constant-in-p and log-linear
      laws, write predicted values for 21 and 25 bits into prereg.json, hash it and commit it. This
      stage must complete and be committed before STAGE 3 begins. STAGE 3 (cost: ~1 CPU-hour): generate
      10 toy instances per (size, |FB|) at 21 and 25 bits with harness/toycurve.py over 5 seed blocks;
      build the x-ring, e-ring and power-sum representations. STAGE 4 (cost: ~3 CPU-hours): meter
      all instances with the pure-Python Macaulay meter and count field operations under all three
      matrix exponents and all three group-op conversions. STAGE 5 (cost: ~30 CPU-minutes): run the
      profile-matched null arm and the rho-vs-rho unit-ratio control at every size. STAGE 6 (cost:
      minutes): compute signed residuals against prereg.json, report the hash, and tabulate which
      law fit better per quantity.'
    instrument: Python 3 only, no Sage. harness/toycurve.py for instance generation at 21 and 25 bits
      and the seeding convention; harness/semaev.py for the Semaev polynomial expressions and factor-base
      construction; harness/rho.py for the rho baseline operation counts (used for counts, not timings);
      a shared pure-Python Macaulay-rank meter module over F_p; harness/runner.py for run manifests,
      seeds and the inference block; sympy for polynomial algebra. Field-operation counting is instrumented
      in the code, not inferred from wall clock.
    parameters: 'Field sizes: 13, 15, 17 (reproduction only) and 21, 25 (prediction test) bit primes.
      Factor-base sizes |FB| in {3, 4, 5}, matching the archived table. Representations: x-ring baseline,
      e-ring elementary-symmetric, power-sum, as named in the EXP-ALPF-011 table. Instances: 10 per
      (size, |FB|, representation) over 5 seed blocks, giving 10 x 2 x 3 x 3 = 180 new metered instances
      plus 90 reproduction instances if the archived family is reproducible. Matrix exponent sensitivity:
      {2.0, 2.37, 3.0}. Group-op conversion sensitivity: {6, 8, 12} field multiplications. Maximum
      Macaulay degree 14. Null arm: 10 profile-matched systems per (size, profile).'
  controls:
  - Profile-matched null systems at every size, metered identically, to separate instrument p-dependence
    from curve p-dependence.
  - Rho-vs-rho unit-ratio control at every size, to detect size bias in the field-op accounting.
  - 'Cost-exponent sensitivity arm: recompute every ratio with the algebraic matrix exponent set to
    2.0, 2.37 and 3.0, reporting how far the residual moves, so the conclusion is not an artifact
    of one constant.'
  - 'Group-operation conversion sensitivity: recompute rho field ops at 6, 8 and 12 field multiplications
    per group operation.'
  - 'Archived-row reproduction: recompute the 13, 15 and 17 bit rows from the same formulas and require
    they match the committed table before any new size is run.'
  - 'Seed-block control: 5 seed blocks per new size.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both run in the same invocation. First, a null trajectory:
    random homogeneous systems matched to the same degree profile at each of 13, 15, 17, 21, 25 bits,
    metered identically -- these have no curve behind them, so any p-dependence they show is p-dependence
    of the instrument rather than of elliptic curves, and the signal arm''s p-dependence must exceed
    the null arm''s for claim (C) to mean anything. Second, a null cost ratio: the same cost accounting
    applied to a method with a KNOWN scaling, namely rho against rho with different seeds, whose ratio
    must come out flat at 1 within noise at every size; if that control drifts with size, the cost
    accounting is size-biased and no ratio in the archive or in this run is interpretable. For the
    measurement to mean anything the profile-matched null must show flat algebraic quantities and
    the rho-vs-rho control must show a flat unit ratio.'
  independent_variables:
  - field size in bits
  - factor-base size |FB|
  - representation (x-ring, e-ring, power-sum)
  - algebraic cost matrix exponent
  - rho group-operation conversion constant
  metrics:
    primary:
    - signed residual observed minus pre-registered, per quantity per new size
    - d_ff per instance
    - D_reg_pred per cell
    - crossbred-to-rho field-operation ratio per cell
    - archived-row reproduction indicator for 13/15/17 bits
    - pre-registration file hash and containing commit
    secondary:
    - rho-vs-rho null unit ratio per size
    - profile-matched null algebraic quantities per size
    - residual sensitivity to matrix exponent and conversion constant
    - peak Macaulay matrix dimensions per cell
    - per-seed-block spread of each measured quantity
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The values of d_ff, D_reg_pred and the crossbred-to-rho field-operation ratio at 21
      and 25 bit field sizes, for each representation at each factor-base size.
    formula: 'Constant-in-p law: d_ff(b) = d_ff(17) and D_reg_pred(b) = D_reg_pred(17) for all b,
      i.e. for the x-ring baseline at |FB| = 3, both predicted to equal 7 at 21 and 25 bits. Cost-ratio
      law: ratio(b) = ratio(17) * 2^{-(b-17)/2}, since rho field ops scale as sqrt(p) and the crossbred
      count is p-independent; for |FB| = 3 this predicts ratio(21) = 2.01 * 0.25 = 0.50 and ratio(25)
      = 2.01 * 0.0625 = 0.126. Signed residual = observed minus predicted, reported per cell with
      a 5-seed-block interval. The log-linear alternative law is fitted on the three archived points
      and its predictions recorded alongside, so the residual comparison selects between them.'
    source: Pre-registered in the parent proposal IDEA-20260816-c1314e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at 13 through 25 bit primes -- toy throughout; 25 bits is far below any
      cryptographic parameter and is chosen as the largest size the pure-Python Macaulay meter reaches
      at D_reg = 12 within the memory budget. The transfer assumption under test is stated explicitly
      and is confined to this interval: the experiment measures whether a law fitted on 13 to 17 bits
      predicts 21 and 25 bits, and NO extrapolation beyond 25 bits is fitted, reported or implied.
      Any downstream use of the fitted law outside 13 to 25 bits is outside the scope of this contract.'
    correspondence: null
  tail_checks:
  - Report cells where the meter hit the degree ceiling at 25 bits, since these truncate d_ff and
    would produce a spuriously small residual.
  - Report the largest single-instance deviation within each cell, not only the cell mean, since a
    single anomalous curve is the most informative tail here.
  - Report every cell where the residual sign differs across the three matrix exponents.
  - Report instances whose generated curve failed to have a prime-order subgroup of the required size
    and were regenerated, with counts.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort before STAGE 2 if the archived 13/15/17 rows cannot be reproduced or a documented discrepancy
    cannot be characterised.
  - Abort STAGE 3 onward if prereg.json is not committed and hashed first; the run is void without
    it.
  - Drop the 25-bit arm and report only the 21-bit residual if any 25-bit cell exceeds the memory
    budget, leaving the 25-bit prediction explicitly unresolved.
  - Hard stop at 8 total CPU-hours.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The archived rows reproduce, prereg.json is committed and hashed before any new-size
    computation, and a signed residual with a 5-seed-block interval is reported for every quantity
    at 21 bits at minimum.
  falsification_criterion:
  - d_ff or D_reg_pred residual nonzero beyond seed-block spread at fixed profile and |FB|, falsifying
    the algebraic-invariance half of the prediction.
  - Cost-ratio residual exceeding a factor of 1.5 from the pre-registered value, falsifying the sqrt(p)
    transfer law over this interval.
  - Residual sign flipping across the matrix-exponent sensitivity arm, indicating the trend is a proxy
    artifact.
  - rho-vs-rho unit ratio drifting more than 10 percent with size.
  - Failure to reproduce the archived rows, voiding the residual entirely.
  - Profile-matched null arm showing the same p-dependence as the signal arm.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c1314e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The archived 'structured' curve family is not defined in the imported analysis; a Coordinator
    must decide whether to reproduce it from experiments/EXP-ALPF-010/source/ or to declare the comparison
    cross-family and scope the residual accordingly.
  - The exact D_solve column dimension entering the F4 op proxy must be pinned to a formula before
    the prediction can be written.
  - Whether the e-ring and power-sum representations at 21 and 25 bits give the same leading-form
    degree profiles as at 13 to 17 bits must be checked symbolically before freezing, since claim
    (C) presumes it.
  - The memory ceiling at |FB| = 5 and 25 bits needs a dry-run estimate before approval.
