      - >-
        E_max EXTREMES - CONFIRMED. Minimum 1.0184 at m=2, k=18, beta=0.350,
        B=79, from C_all = 3160 and P_pred = 3103.0. Maximum 1.4214 at m=3,
        k=12, beta=0.375, B=23, from C_all = 2300 and P_pred = 1618.1 - the very
        cell the v1 enumeration omitted.
      - >-
        CAUCHY-DAVENPORT FLOOR 0.1241 - CONFIRMED at m=2, k=12, beta=0.425,
        B=34, as (2 x 34 - 1)/539.8 = 67/539.8. No evaluable cell checked in
