      severity: material
      title: >-
        CTRL-NULL-FB is raised from 3 to 10 draws at the small-B evaluable
        cells, and its output becomes a reported empirical null
      before: >-
        CTRL-NULL-FB - "for 3 independent draws" at every criterion-evaluable
        cell. INV-5 routes a deviation that survives factor-base randomisation
        to "AN ESTIMATOR OR CURVE ARTIFACT".
      after: |-
        DRAWS. 10 independent draws at every criterion-evaluable cell with
        measured B at most 64; 3 draws elsewhere, unchanged. The per-draw and
        aggregated E on the random negation-closed factor base, E_randomFB, is
        PROMOTED FROM A CHECK TO A REPORTED EMPIRICAL NULL, with its mean and
        spread, beside the analytic P_pred.
        INV-5 GAINS A THIRD DISPOSITION. A deviation of E from 1 that is
        REPRODUCED under factor-base randomisation while CTRL-NULL-SUMSET passes
        is routed to an explicit third reading - C_red OR P_pred IS
        MIS-SPECIFIED FOR SUMSETS GENERALLY - alongside the two v1 readings of
