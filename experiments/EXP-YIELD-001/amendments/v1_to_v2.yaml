  disagreements_with_the_review:
    - >-
      beta*(2) AT k = 16. The review recomputes 0.5312 where the contract says
      0.5313. This session computes (1 + 1/16)/2 = 0.53125 EXACTLY, so both are
      rounding conventions of the same number and the CONTRACT'S m = 2 ROW IS
      CORRECT AS PRINTED. The review's own text calls that row "exactly right",
      so this is a display inconsistency in the review rather than a defect in
      the contract, and no correction to the m = 2 row is made.
    - >-
      TWO C_red ENTRIES THE REVIEW DID NOT CATCH. At m = 3, beta = 0.275 the v1
      table gives C_red = 1542 at k = 16 (B = 21) and 5424 at k = 18 (B = 31);
      the closed form gives 1550.5 and 4975.5. The review states it reproduced
      "the C_red identity at m=2 and m=3" and all 42 saturation-forced cells,
      which is consistent with checking the identity rather than every entry.
      Neither correction changes any cell's class, so the count of 44 stands.
    - >-
      THE p/N CORRECTION IS NOT CONFINED TO k = 12. The review corrects only the
      k = 12 bound. The same linearisation understates at all four sizes: the
      exact suprema are 1.03200, 1.01581, 1.00786 and 1.00392, against the
      contract's 1.0313, 1.0156, 1.0078 and 1.0039. Only the k = 12 correction
      is numerically visible in any downstream figure.
    - >-
      MANY B VALUES IN THE v1 BASIS TABLE ARE UNATTAINABLE. Measured B is EVEN,
      because N is prime and odd, so F carries no 2-torsion and no identity and
      is closed under negation. Every odd entry in the B = L table - including
      B = 23 at the newly added cell, and B = 15, 21, 31, 79 - can never be a
      measured count, and the half-integer C_red values that follow from them
      (567.5, 2035.5, 1550.5, 4975.5, 82199.5) correspond to no realisable
      configuration. This is INDEPENDENT SUPPORT for the C-2 resolution: the
      enumeration could only ever have been illustrative. The review does not
      make this point.
    - >-
      THE CELL THE ENUMERATION DROPPED IS THE ONE WITH THE MOST ROOM. The review
      reports the E_max range as 1.0184 to 1.421 without locating the maximum.
      This session locates it at (m=3, k=12, beta=0.375), which is exactly the
      44th cell RT-1 recovers. That coincidence is worth recording, because a
      reader of v1 would have concluded that the design's most permissive
      ceiling did not exist.
