      after: >-
        There are 44 such cells of the 136 on the B = L arithmetic basis - 27 at
        m = 2 and 17 at m = 3. Every occurrence of "43 criterion-evaluable
        cells" in the v1 specification, in the v1 feasibility table and in
        H-YIELD-001 reads 44 for the purposes of this experiment. The cell the
        v1 enumeration omits is m = 3, beta = 0.375, k = 12, where B = 23 gives
        h = 23^3/(6 x 4096) = 0.49508, at or below the 0.5 band, and
        C_red = 23 + 23 x 21 + 23 x 21 x 19/6 = 2035.5, at or above 500. It is
        inside the frozen predicate on both clauses.
      basis: >-
        RE-DERIVED INDEPENDENTLY IN THIS SESSION FROM THE PREDICATE, NOT COPIED
        FROM THE REVIEW. At m = 2 the predicate reduces to 32 <= B <= floor(sqrt(p)),
        since h <= 0.5 is B^2 <= p and C_red = B^2/2 >= 500 is B >= 32; the
        surviving B are 34, 42, 52, 64 at k = 12, six values 38 to 128 at
        k = 14, eight values 37 to 256 at k = 16 and nine values 42 to 512 at
        k = 18, hence 4 + 6 + 8 + 9 = 27. At m = 3 the predicate reduces to
        15 <= B <= floor((3p)^(1/3)), since h <= 0.5 is B^3 <= 3p and
        C_red(14) = 462 is below 500 while C_red(15) = 567.5 is above it; the
        ceilings are 23, 36, 58 and 92 at k = 12, 14, 16, 18, giving 3 + 3 + 5 + 6
        = 17. Total 44. THE CAUSE OF THE UNDERCOUNT IS IDENTIFIED AND CONFIRMED -
        the v1 table applied the TIGHTEST h-band in beta, 0.3627 at k = 18, as a
        GLOBAL cut, where the predicate is per size and the k = 12 band is
        0.3770.
      consequence: >-
        Nine evaluable columns stands unchanged - the new cell is alone in its
        column, and a column needs three sizes. The budget is unmoved - the new
        cell costs about 6.3 x 10^3 modular additions. Its ONE substantive
        effect is on the metric ceiling - see C-6, where E_max at this cell is
        1.4214, the LARGEST over the whole evaluable set, so the cell the
        enumeration dropped is the cell with the most room above 1 in the entire
        design.
      corrected_enumeration: |-
        Criterion-evaluable cells on the B = L basis, p = 2^k, 44 total.
        m = 2, 27 cells (B in brackets):
          k=12  beta 0.425 [34], 0.450 [42], 0.475 [52], 0.500 [64]
          k=14  beta 0.375 [38], 0.400 [49], 0.425 [62], 0.450 [79],
                     0.475 [100], 0.500 [128]
          k=16  beta 0.325 [37], 0.350 [49], 0.375 [64], 0.400 [84],
                     0.425 [111], 0.450 [147], 0.475 [194], 0.500 [256]
          k=18  beta 0.300 [42], 0.325 [58], 0.350 [79], 0.375 [108],
                     0.400 [147], 0.425 [201], 0.450 [274], 0.475 [375],
                     0.500 [512]
        m = 3, 17 cells:
          k=12  beta 0.325 [15], 0.350 [18], 0.375 [23]   <- 0.375 is the cell v1 omits
          k=14  beta 0.300 [18], 0.325 [23], 0.350 [30]
          k=16  beta 0.250 [16], 0.275 [21], 0.300 [28], 0.325 [37], 0.350 [49]
          k=18  beta 0.225 [17], 0.250 [23], 0.275 [31], 0.300 [42],
                     0.325 [58], 0.350 [79]
        Evaluable columns, nine, unchanged:
          m=2  beta 0.375 (3 sizes), 0.400 (3), 0.425 (4), 0.450 (4),
                    0.475 (4), 0.500 (4)
          m=3  beta 0.300 (3 sizes), 0.325 (4), 0.350 (4)
    - id: C-2
      objection: RT-2
      severity: blocking
      title: >-
        The measured-B predicate is authoritative and the enumeration is
        illustrative, with class changes handled before measurement
      before: >-
        The v1 contract is emphatic that every criterion is evaluated on
        measured B and never on the interval length L, and simultaneously
        freezes the evaluable SET as a fixed enumeration computed on B = L,
        without saying which governs. That is the exact class of ambiguity ST-3
        instructs the Executor to stop and report on.
      after: |-
        THE PREDICATE ON MEASURED B GOVERNS. The enumeration in C-1 above, and
        in section 5 of the v1 feasibility table, is ILLUSTRATIVE ARITHMETIC ON
        THE B = L BASIS and is NOT the definition of the evaluable set. The
        binding definition and its handling rules are:
          R-1  DEFINITION. A cell is criterion-evaluable if and only if, at its
               MEASURED B, h = B^m/(m! p) <= 0.5 AND C_red(B) >= 500.
          R-2  ORDER OF OPERATIONS, WHICH IS WHAT MAKES THE HANDLING
               PRE-REGISTERED RATHER THAN POST-HOC. B is counted first. The
               class of every cell is computed from measured B ALONE, and is
               FROZEN in the results record, BEFORE the sum set S_m is computed
               and therefore before |S_m|, R or E exists for that cell. The
               class is never a function of an outcome. A cell may not be
               reclassified after its E is known, in either direction, for any
               reason.
          R-3  REPORTING. For all 136 cells the driver records L, measured B,
               B/L, h, C_red, the boolean evaluable_on_measured_B, the boolean
               evaluable_on_B_equals_L, and the flag class_changed_on_measurement.
          R-4  KNIFE-EDGE CELLS, NAMED IN ADVANCE. Two cells sit within one
               ordinary fluctuation of the boundary and are expected to flip
               with probability of order one half each. (m=2, k=18, beta=0.500)
               is evaluable if and only if measured B satisfies B^2 <= p, i.e.
               B <= floor(sqrt(p)), which is 512 for the smallest prime at or
               above 2^18; L = 512 there, so this is close to a coin flip.
               (m=3, k=12, beta=0.375) is evaluable if and only if B^3 <= 3p,
               i.e. B <= 23 at k = 12; since B is EVEN this means B <= 22, and
               L = 23, so this too is close to a coin flip. A flip at either
               cell is an ORDINARY EVENT, is NOT a protocol deviation, is NOT
               an invalidation, and DOES NOT FIRE ST-3.
          R-5  ANY OTHER CELL that changes class on measurement is handled by
               the same rule and recorded with the same flag.
          R-6  REALISED DENOMINATORS. Every pre-registered fraction is evaluated
               against the REALISED set. n_eval is the number of
               criterion-evaluable, non-NOISE-LIMITED cells actually measured;
               the "more than one third" clause of the outcome table uses
               n_eval, not 44. A column is evaluable if it carries at least
               three sizes IN THE REALISED SET; if a column drops below three
               sizes it is not an evaluable column and is reported as dropped
               with its reason.
          R-7  DRIFT DISCLOSURE, NOT A STOPPING RULE. If the realised evaluable
               count differs from 44 by more than 4 cells, the manifest records
               a PROTOCOL OBSERVATION naming every cell that moved and in which
               direction. It is not a deviation, not an invalidation and not a
               stop; it is a fact the Coordinator must see before reading any
               fraction.
      basis: >-
        The v1 contract's own convention block already makes measured B
        authoritative for every criterion; making the SET a function of L while
        the criteria are functions of B is the only inconsistency, and the
        narrow repair is to remove the second authority rather than to weaken
        the first. B is even, because N is prime and odd, so F carries no
        2-torsion and no identity and is closed under negation - a fact this
        session used to observe that many odd B values in the v1 basis table,
        including B = 23 at the newly added cell and B = 15, 21, 31, 79, are
        UNATTAINABLE as measured counts, which is independent evidence that the
        enumeration can only ever have been illustrative.
      consequence: >-
        The evaluable set becomes a REALISED, mildly random object of expected
        size about 44. That is a real cost in tidiness and it is declared: the
        exact denominator of the one-third clause is not known before execution.
        It is the smaller cost. The alternative - freezing the enumeration -
        would evaluate criteria at cells whose measured h exceeds 0.5, i.e.
        inside the saturation band the whole design exists to avoid.
    - id: C-3
      objection: RT-3
      severity: blocking
      title: >-
        The outcome gap is closed - every reachable outcome now maps to a
        pre-registered disposition
      before: >-
        F2 as frozen - "E falls outside [0.90, 1.10] at MORE THAN ONE THIRD of
        the criterion-evaluable, non-noise-limited cells with NO monotone trend
        in p and no consistent sign", with the stated meaning "the analytic null
        is missing a term". S1 requires every cell in band. F1 requires a column
        with E at most 0.80 at its largest size, E non-increasing, and slope at
        most -0.05 with a 95 percent interval excluding zero.
      after: >-
        The four words "and no consistent sign" are DELETED from F2, and F2 is
        SPLIT into two disjoint branches - O-4, consistent sign, the uniform
        multiplicative shift the criterion was actually written for, and O-5,
        mixed sign, heterogeneous cell-dependent scatter. Four further branches
        are added - O-3, a downward trend that has not reached the 0.80
        magnitude; O-6, a sparse out-of-band set with no trend; O-7, a
        significant UPWARD trend, which is reachable from below and fires
        nothing in v1; O-8, columns that disagree in the sign of a significant
        slope. A residual branch O-9 makes the table exhaustive by construction.
        The complete, ordered, mutually exclusive table is in
        outcome_disposition_table below, and it is the binding evaluation
        procedure.
      basis: >-
        The review's argument is correct and this session re-derived its two
        legs. FIRST, a term missing from P_pred or from C_red is MULTIPLICATIVE,
        so it moves every cell in the same direction and produces a consistent
        sign by construction; requiring no consistent sign therefore excludes
        the criterion's own stated cause. SECOND, the counting ceiling
        E_max = min(C_all, N)/P_pred is below 1.10 at 17 of the 44 evaluable
        cells - independently recomputed cell by cell in this session, see
        independent_reconfirmation - so at 39 percent of the evaluable set an
        upward out-of-band deviation is arithmetically impossible and the sign
        cannot be mixed there at all. THE WORKED CASE THE REVIEW NAMES, TESTED
        AGAINST THE NEW TABLE - E about 0.85 at every evaluable cell with no
        trend in p. S1 fails, since the out-of-band set is non-empty. O-8, O-2,
        O-3 and O-7 do not match, since no column carries a significant slope.
        O-1 does not match. O-4 MATCHES - the out-of-band set exceeds one third
        of n_eval and shares one sign. The outcome is classified, with a named
        successor and a CTRL-NULL-FB sub-branch that separates a mis-specified
        C_red or P_pred from an interval-structure effect.
      consequence: >-
        F2's threshold and S1's and F1's thresholds are NOT relaxed and NOT
        tightened. What changes is coverage - the pre-registered map from
        outcomes to dispositions becomes total. This is a coverage repair made
        BEFORE any data exists, which is the only time it can honestly be made.
    - id: C-4
      objection: RT-4
      severity: blocking
      title: >-
        CTRL-NULL-SUMSET is re-specified as an antipodal-pair process, and every
        sigma figure in the design is restated
      before: >-
        CTRL-NULL-SUMSET - "For each criterion-evaluable cell, throw C_red
        uniformly random elements of G into the same N-bit set and count
        distinct occupancy; repeat 30 times where C_red is at most 10^6 and 10
        times otherwise". The control is titled SHAPE-MATCHED. The design-wide
        maximum chance standard deviation of E is stated as 1.05 percent, the
        plus-or-minus 10 percent band as about 9 sigma and F1's 0.80 threshold
        as about 19 sigma.
      after: |-
        THE NULL DRAWS PAIRS. For each criterion-evaluable cell, repeat
        C_red/2 times - draw g uniformly at random from G and insert BOTH g and
        -g into the same N-bit set - then count distinct occupancy. C_red is
        even at every cell, because measured B is even and the involution
        M -> -M has no fixed point among cancellation-free multisets; if an
        implementation ever computes an odd C_red that is an INV-1 implementation
        defect, not a rounding question. Replicate counts are as in C-14 below.
        The v1 independent-throw process is ALSO run and reported, at the same
        cells and the same replicate counts, as a DECLARED CONTRAST so that the
        factor is measured inside the driver and archived rather than asserted;
        the antipodal process is the one that feeds INV-4, the two tail checks
        and the standardized bulk check.
        RESTATED SIGMA FIGURES, BINDING ON EVERY DOWNSTREAM RECORD:
          maximum chance relative sd of E over the evaluable set   1.49 percent
             (v1 said 1.05 percent; attained at m=2, k=12, beta=0.425, B=34)
          the plus-or-minus 10 percent band                        6.7 sigma
             (v1 said about 9 sigma)
          F1's 0.80 threshold                                      13.4 sigma
             (v1 said about 19 sigma)
        Both remain STRUCTURE thresholds rather than noise thresholds, so no
        criterion threshold moves. The NOISE-LIMITED exclusion rule at 2 percent
        of P_pred is UNCHANGED in value and is now much closer to binding - see
        the consequence below.
      basis: |-
        DERIVED ON PAPER IN THIS SESSION, INDEPENDENTLY OF THE REVIEW'S PROBE,
        AND THE PROBE IS NOT USED. F is closed under negation and N is odd, so
        S_m = -S_m exactly. On multisets the involution M -> -M has no fixed
        point among cancellation-free multisets: a fixed point requires the
        induced permutation to pair every element P with -P, which is a
        cancelling pair, and any unpaired element would need -P = P, impossible
        with N odd and the identity absent from F. Hence the C_red balls arrive
        as exactly C_red/2 antipodal PAIRS, each pair covering the bin-pair
        {g, -g}.
        MEAN. C_red/2 throws into (N-1)/2 bin-pairs, each covering 2 bins, gives
        expected distinct count (N-1)(1 - exp(-lambda)) with
        lambda = C_red/(N-1). P_pred is therefore CORRECT to O(1) and NO
        CRITERION THRESHOLD MOVES.
        VARIANCE. With X the number of occupied bin-pairs among M = (N-1)/2
        bins, Var(X) = M exp(-lambda)(1 - (1+lambda) exp(-lambda)), and the
        distinct count is 2X, so Var = 4 Var(X) = 2 (N-1) exp(-lambda)(...),
        which is EXACTLY TWICE the independent-throw variance
        N exp(-lambda)(1 - (1+lambda) exp(-lambda)). Relative sd is multiplied
        by sqrt(2) = 1.4142.
        THE REVIEW'S BALLS-IN-BINS PROBE AT N = 4099, C = 568 IS NOT THE BASIS
        AND IS NOT CITED AS EVIDENCE. It was run outside the repository, is
        unarchived, and the review says so itself. THE ANALYTIC FACTOR OF TWO IS
        THE BASIS. The probe's role, if any, is discharged by the declared
        contrast arm above, which measures the ratio inside the driver and
        archives it.
      consequence: |-
        THE REPAIR IS ONE LINE OF IMPLEMENTATION AND IT MATTERS FOR FOUR
        CONSUMERS. A control reporting an sd 1.41x too small would inflate every
        standardized deviation by 1.41 across all 44 cells and manufacture an
        apparent tail excess in (i) INV-4's three-sd null-recovery test,
        (ii) the Gumbel extreme-value tail check, (iii) the standardized bulk
        check against the standard normal, and (iv) the NOISE-LIMITED exclusion
        rule. The contract calls this control SHAPE-MATCHED in its own title; as
        frozen it was not, and now it is.
        DISCLOSED SECOND-ORDER CONSEQUENCE, NOT REQUESTED BY THE REVIEW. With
        the corrected null the largest chance sd is 1.49 percent against a
        NOISE-LIMITED exclusion rule at 2.0 percent, a margin of 1.34x rather
        than the 1.9x v1 implied. An empirical sd estimated from 30 replicates
        carries a relative sampling error of about 1/sqrt(2 x 29) = 13 percent,
        so the two smallest evaluable cells - (m=2, k=12, beta=0.425) and
        (m=3, k=12, beta=0.325) - can now cross 2 percent ON SD-ESTIMATION NOISE
        ALONE at roughly a 1.3 standard-error excursion. That is a real new risk
        of a spurious NOISE-LIMITED exclusion, and it is why C-14 raises the
        replicate count at the small cells. The 2 percent threshold itself is
        NOT moved, because moving a threshold to accommodate a control repair is
        exactly the manoeuvre a protocol amendment must not make.
    - id: C-5
      objection: RT-5
      severity: material
      title: >-
        The a-priori exclusion is narrowed to its narrowest valid form, and
        1.733 is corrected to 1.7338
      before: >-
        criteria_removed_before_freeze REMOVED-1 verdict - "CANNOT FIRE AT ANY
        CELL ... whose design-wide maximum over all 136 cells is 1.733". The
        feasibility table's supporting step - "R > 2.0 requires ... at m = 3
        requires roughly B < 3 and at m = 2 requires B < 1. Every cell in the
        design has B >= 5."
      after: |-
        NARROWEST VALID FORM, BINDING: R greater than 2.0 CANNOT FIRE AT ANY
        CRITERION-EVALUABLE CELL, where the smallest measured B is 15 at m = 3
        and 34 at m = 2, giving ceilings 1.248 and 1.062, robust to any
        plausible fluctuation of measured B; and the composite three-consecutive-
        sizes form cannot realistically fire anywhere in the design, since it
        would require the degenerate B at three sizes at once.
        The step "Every cell in the design has B >= 5" is STRUCK. It is
        evaluated on B = L while every criterion is evaluated on measured B.
        R_max exceeds 2 exactly when measured B is at most 3 at m = 3 or at most
        1 at m = 2: at m = 3, B = 2 gives R_max = 3.096 and B = 3 gives 2.293.
        At the smallest cell of the design (k=12, beta=0.200, L=5) a measured
        B = 2 means F = {P, -P}, S_3 = {3P, P, -P, -3P}, |S_3| = 4 = C_all and
        R = 3 p/N, about 3.0. That is the event "only one of the five x in the
        interval admits a point", which is NOT rare. The cell is not
        criterion-evaluable, so nothing is lost - but the exclusion must not be
        stated as though it were unconditional.
        The design-wide ceiling is 1.7338, NOT 1.733, and it is CONDITIONAL ON
        B = L; at the smallest cell it rises to about 3.096 if measured B
        collapses to 2.
      basis: >-
        RE-DERIVED IN THIS SESSION. R_max = (p/N) prod_{j=0}^{m-1} (1 + j/B).
        At the smallest cell, m = 3 and B = 5, prod = 1 x 1.2 x 1.4 = 1.68. The
        v1 table multiplies by the LINEARISATION 1 + 2/sqrt(p) = 1.03125 to get
        1.7325, printed as 1.733. The EXACT Hasse supremum is
        p/(p + 1 - 2 sqrt(p)), which at p = 2^12 is 4096/3969 = (64/63)^2 =
        1.0319979, giving 1.68 x 1.0319979 = 1.73376, i.e. 1.7338. The
        degenerate ceilings follow from the same formula: m=3 B=2 gives
        1 x 1.5 x 2 = 3.0 times 1.032 = 3.096; m=3 B=3 gives 20/9 = 2.2222 times
        1.032 = 2.293; m=2 B=1 gives 2 times 1.032 = 2.064. Over the evaluable
        set, m=3 B=15 gives (16/15)(17/15) = 1.20889 times 1.032 = 1.2476 and
        m=2 B=34 gives 1.029412 times 1.032 = 1.0624.
      consequence: >-
        INV-1 is unchanged and keeps its teeth - an observed R above the
        PER-CELL R_max computed on that cell's own measured B remains
        mathematically impossible and therefore an implementation defect, never
        an observation of outcome (b). What changes is only the SCOPE SENTENCE
        that may be written about the exclusion.
    - id: C-6
      objection: RT-6
      severity: material
      title: >-
        E_max and the Cauchy-Davenport floor are reported per cell, and F1's
        supporting claim is replaced by a bound
      before: >-
        The contract reports R_max per cell and not E_max, although E is the
        metric every criterion now runs on. The falsification block asserts
        "nothing in the design bounds E from below".
      after: |-
        REPORTED PER CELL, BESIDE R_max, FOR EVERY CENSUS CELL:
          E_max     = min(C_all, N) / P_pred, the exact counting ceiling on E
          E_floor   = min(N, m B - m + 1) / P_pred, the Cauchy-Davenport floor
          and the statement of whether the interval [0.90, 1.10] is one-sided at
          that cell, i.e. whether E_max < 1.10 or E_floor > 0.90.
        ONE-SIDEDNESS, STATED IN ADVANCE: on the B = L basis, E_max is below
        1.10 at 17 of the 44 evaluable cells, so at 39 percent of the evaluable
        set an out-of-band deviation can only be DOWNWARD. This does not break
        S1 - a ceiling inside the band makes the success side easier, not
        impossible - and it is precisely what makes the C-3 outcome gap bite.
        THE ASSERTION "nothing in the design bounds E from below" IS REPLACED BY
        A BOUND. G has prime order N, so G is isomorphic to Z/NZ and
        Cauchy-Davenport gives |A + B| >= min(N, |A| + |B| - 1); iterating over
        the m-fold sumset, |S_m| >= min(N, m B - m + 1). Over the 44 evaluable
        cells the LARGEST resulting floor is E >= 0.1241, at m = 2, k = 12,
        beta = 0.425, B = 34, and it is below 0.02 at the largest cells. F1's
        0.80 threshold sits far above every floor, SO F1 SURVIVES - on a
        rigorous bound rather than on an assertion.
        INV-1 GAINS A CLAUSE, and this is a new mathematically impossible event
        rather than a relaxation: |S_m| < min(N, m B - m + 1) at any cell is a
        Cauchy-Davenport violation, hence an IMPLEMENTATION DEFECT, hence the
        run is INVALID and it is never evidence about the yield heuristic.
      basis: >-
        RECOMPUTED CELL BY CELL IN THIS SESSION. E_max = C_all/P_pred at every
        m = 2 evaluable cell, since C_all < N there; the minimum over the
