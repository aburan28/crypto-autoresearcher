    REMOVED_1:
      before: >-
        Verdict "CANNOT FIRE AT ANY CELL", design-wide maximum 1.733, and the
        consequence paragraph narrating the derivation as "an answer to the
        exponent question in the PESSIMISTIC direction".
      after: >-
        Verdict reads "CANNOT FIRE AT ANY CRITERION-EVALUABLE CELL", per C-5;
        the design-wide ceiling reads 1.7338 and is declared conditional on
        B = L; and the consequence paragraph is replaced by the
