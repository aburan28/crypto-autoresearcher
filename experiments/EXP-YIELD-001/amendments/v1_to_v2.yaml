      after: >-
        UNCHANGED IN EVERY THRESHOLD, and it is branch O-2 of the outcome table.
        Its supporting claims are corrected: the E floor is now the
        Cauchy-Davenport bound of C-6, whose largest value over the evaluable
        set is 0.1241, far below 0.80, so the negative outcome is genuinely
        reachable ON A BOUND; and 0.80 sits 13.4 per-cell chance standard
        deviations from the null under the corrected control of C-4, while the
        BINDING clause is the interval-excludes-zero clause at 1 or 2 residual
        degrees of freedom, per C-12.
    F2:
      before: >-
        E falls outside [0.90, 1.10] at MORE THAN ONE THIRD of the
        criterion-evaluable, non-noise-limited cells with NO monotone trend in p
        AND NO CONSISTENT SIGN. Neither (a) nor (c) is established, the analytic
        null is missing a term, the correct verdict is INCONCLUSIVE, and a
        scoped successor must identify the missing correction before any yield
        number here is re-used.
      after: >-
        THE FOUR WORDS "and no consistent sign" ARE DELETED, and the criterion
        is SPLIT into two disjoint branches of the outcome table. O-4 covers the
        CONSISTENT-SIGN case, which is the case F2 was written for - a uniform
        p-independent multiplicative shift, i.e. the analytic null missing a
        term - with a CTRL-NULL-FB sub-branch separating a mis-specified C_red
        or P_pred from an interval-specific effect. O-5 covers the MIXED-SIGN
        case - heterogeneous, cell-dependent scatter. Both carry the v1 verdict
        INCONCLUSIVE and the v1 obligation that a scoped successor identify the
        missing correction before any yield number is re-used. The "more than
        one third" threshold is unchanged and is evaluated against the realised
        n_eval of C-2 rule R-6. "No monotone trend in p" is replaced by the
        checkable condition "no evaluable column is DOWN-SIGNIFICANT or
        UP-SIGNIFICANT" as defined in the outcome table.
    INV-1:
      before: >-
        R exceeds R_max, or |S_m| exceeds min(C_all, N), or |S_m| is less than
        |S_(m-2)|, at any cell - each mathematically impossible, so the run is
        INVALID and it is never an observation of outcome (b).
      after: >-
        UNCHANGED, PLUS TWO CLAUSES, both of them newly impossible events rather
        than relaxations. |S_m| < min(N, m B - m + 1) at any cell is a
        Cauchy-Davenport violation (C-6). An odd C_red at any cell is impossible
        because measured B is even and the negation involution is fixed-point-free
        on cancellation-free multisets (C-4). R_max is computed per cell on that
        cell's own MEASURED B (C-5).
    INV-2:
      before: >-
        CTRL-CALIB-AP fails to recover EV-STR-001's per-cell penalty within a
        factor 2 in at least 5 of its 6 cells, or fails the two trend clauses.
        THE CENSUS NUMBERS ARE VOID RATHER THAN NEGATIVE.
      after: >-
        SPLIT PER C-8. INV-2a, a defect in the distinct-count and membership
        routine SHARED with the census, VOIDS the census numbers. INV-2b, a
        failure of AP-supply recovery or of a trend clause, is an INSTRUMENT
        NOTE and does NOT void census data. The factor-2 window is evaluated on
        the ratio of medians over 24 seeds at the two n = 211 cells and 6 seeds
        elsewhere.
    INV-4:
      before: >-
        CTRL-NULL-SUMSET fails to reproduce P_pred within 3 empirical standard
        deviations at any criterion-evaluable cell. Every E value is VOID rather
        than negative.
      after: >-
        UNCHANGED IN FORM. The empirical standard deviation is now that of the
        ANTIPODAL-PAIR process of C-4, at the replicate counts of C-14. Because
        the corrected spread is a factor 1.41 larger, INV-4 becomes SLIGHTLY
        HARDER to fire on chance and slightly easier to pass - which is the
        correct direction, since the v1 control would have fired it on a
        systematically understated denominator.
    INV-5:
      before: >-
        A deviation of E from 1 measured on the interval factor base does NOT
        shrink under CTRL-NULL-FB randomisation at three or more
        criterion-evaluable cells. THE DEVIATION IS AN ESTIMATOR OR CURVE
        ARTIFACT.
      after: >-
        UNCHANGED IN TRIGGER. Its disposition gains a THIRD reading per C-13 - a
        mis-specified C_red or P_pred for sumsets generally - and the three
        readings are reported as an unseparated disjunction rather than as a
        conclusion.
    NOISE_LIMITED_RULE:
      before: >-
        A criterion-evaluable cell whose empirical null sd from CTRL-NULL-SUMSET
        exceeds 2 percent of P_pred is reported NOISE-LIMITED and excluded, with
        its exclusion recorded. "The predicted worst case over the evaluable set
        is 1.05 percent, so no exclusion is expected".
      after: >-
        THRESHOLD UNCHANGED AT 2 PERCENT. The predicted worst case reads 1.49
        percent, so an exclusion is still not expected but the margin is 1.34x
        rather than 1.9x; the replicate counts of C-14 make the sd estimate
        precise enough that the threshold is not crossed on estimation noise;
        and every exclusion is recorded with its empirical sd, its replicate
