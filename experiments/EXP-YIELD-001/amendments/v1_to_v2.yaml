      after: |-
        THREE CHANGES, ALL PRE-DATA.
        (a) SEEDS. The seed count at (n = 211, m = 3) and (n = 211, m = 4) rises
            from 6 to 24. The other four cells stay at 6. The per-cell seeds
            remain derived deterministically from master seed 110601 and all 24
