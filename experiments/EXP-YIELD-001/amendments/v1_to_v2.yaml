      - >-
        RESTATED SIGMA FIGURES - CONFIRMED. Largest chance relative sd 1.0515
        percent under the v1 process at m=2, k=12, beta=0.425 (P_pred = 539.8,
        sd = 5.676), hence 1.487 percent corrected; the plus-or-minus 10 percent
