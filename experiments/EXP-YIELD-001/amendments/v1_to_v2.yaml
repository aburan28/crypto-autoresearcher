  changes:
    - id: C-1
      objection: RT-1
      severity: blocking
      title: The criterion-evaluable set has 44 members, not 43
      before: >-
        criteria_definitions.criterion_evaluable_cell - "There are 43 such cells
        of the 136 - 27 at m = 2 (beta 0.300 to 0.500, partially) and 16 at
        m = 3 (beta 0.225 to 0.350, partially)". cell_priority_order item 1 -
        "the 43 criterion-evaluable cells". run_plan RUN-YIELD-001-NULL-UNIFORM-FB
        and RUN-YIELD-001-NULL-RANDOM-SUMSET - "the 43 criterion-evaluable
