    missing multiplicative term produces a consistent sign by construction.
    RT-4, CTRL-NULL-SUMSET is not shape-matched to S_m, so its empirical
    standard deviation - the denominator of INV-4, of both tail checks and of
    the standardized bulk check - is systematically a factor sqrt(2) too small.
    This amendment is the ONE versioned protocol_amendment cycle RC-11 permits
    after a REVISE verdict, and it is spent here.
  confirmatory_status: exploratory_only
  confirmatory_status_basis: >-
    STATED PLAINLY AND NOT SOFTENED. docs/task-lifecycle.md section 5 governs -
    protocol changes after approval require a versioned amendment, and
    exploratory changes must be labeled exploratory and CANNOT BE EVALUATED
    AGAINST THE ORIGINAL CONFIRMATORY CRITERION. This revision follows an
    ADVERSE independent review of the frozen protocol; it changes the definition
