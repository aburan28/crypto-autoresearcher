        evaluable set, and that the negative outcome is reachable on a bound.
        Neither changes a threshold.
    - id: C-7
      objection: RT-7
      severity: material
      title: >-
        REMOVED-1's narration is corrected - the counting bound closes no
        exponent question
      before: >-
        REMOVED-1.consequence_stated_plainly - "Outcome (b) ... is THE ONLY
        MEASURABLE EVENT ON THE PRESENT FRONTIER THAT WOULD REOPEN A PRIME-FIELD
        EXPONENT BELOW ONE HALF, and this derivation excludes it A PRIORI on
        this metric, for this decomposition shape, at ANY scale. That is an
        answer to the exponent question in the PESSIMISTIC direction".
        Feasibility table section 2 carries the same narration. The
        TASK-20260729-002 snapshot receipt escalates it further, to "the one
        event that would have reopened a sub-1/2 exponent; it is closed by
        counting, not measurement".
      after: |-
        REPLACEMENT TEXT, BINDING ON EVERY DOWNSTREAM RECORD OF THIS BATCH:
        The counting bound |S_m| <= C(B+m-1, m), hence
        R <= (p/N) prod_{j<m} (1 + j/B), is correct, elementary, scale-free and
        near-certainly folklore, and no novelty is claimed for it. IT CLOSES NO
        EXPONENT QUESTION. B^m/(m! p) is a FIRST-MOMENT estimate, so "the number
        of distinct sums is at most the number of objects generating them" is
        close to definitional, and D-1 delivers no new information about any
        exponent. WHAT IT ESTABLISHES is that IDEA-20260727-006's falsification
        condition 1 was MALFORMED AT BIRTH, because it asked whether a
        first-moment upper bound could be exceeded by a factor of two. That is a
        genuine and valuable pre-freeze catch about a CRITERION, not an answer
        about an EXPONENT.
        THE MULTIPLICITY QUALIFIER ATTACHES TO EVERY RESTATEMENT AND MAY NOT BE
        DROPPED: R bounds distinct COVERAGE, not decomposition MULTIPLICITY.
        Index calculus operates in the saturated band, where coverage is 1 by
        definition and the priced quantity is relations harvested per unit work,
        which this argument does not bound above at all. H-YIELD-001's
        interpretation limits carry this qualifier correctly; REMOVED-1's
        narration and the snapshot receipt dropped it.
        A DOWNSTREAM RECORD MAY NOT QUOTE THIS DERIVATION AS AN EXPONENT RESULT,
        AS A CLOSURE, OR AS AN IMPOSSIBILITY CLAIM.
      basis: >-
        The contract's own admission_and_ceiling block already states, correctly
        and bindingly, that EXP-YIELD-001 MOVES NO EXPONENT and is an
        exponent-deciding screen under rule A1. REMOVED-1's narration and the
        receipt's escalation contradict it, and of the two the admission is the
