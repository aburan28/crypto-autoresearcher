    denominator, and the falsification branch structure. A PRIOR BATCH IN THIS
    PROGRAM WAS CORRECTED FOR MARKING EXACTLY THIS SITUATION `preserved`, and
    that correction is followed here rather than re-argued.
    WHAT IS AND IS NOT PRESERVED, SEPARATED SO NEITHER IS OVERSTATED. What is
    NOT preserved - the confirmatory standing of the v1 criteria. No result of
    EXP-YIELD-001 v2 may be reported as a confirmatory test of the v1 success or
    falsification criteria, and no evidence record may claim confirmatory
    strength on their basis. What IS preserved, and it is a different and weaker
    thing - PRE-REGISTRATION ORDER. No run of this contract exists, no curve has
    been selected, no measurement of any kind has been made, and this amendment
    is committed strictly before any measurement, which an independent session
    can check against Git. Pre-registration order is a property of commit order;
    confirmatory status is a property of protocol stability. This amendment has
    the first and not the second, and the two are not interchangeable.
