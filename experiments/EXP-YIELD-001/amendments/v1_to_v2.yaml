        as a disjunction that the design cannot separate further, NOT as a
        conclusion; separating them is named as successor work.
      basis: >-
        CTRL-NULL-SUMSET validates the ARITHMETIC of P_pred against draws that
        are independent by construction; it cannot detect failure of the
        independence assumption itself. CTRL-NULL-FB, whose factor base is
        random and negation-closed, is the control that can, and three draws is
        thin for that role at the small cells where the chance spread is
        largest. The cost is negligible: the entire criterion-evaluable set
        costs about 9.3 x 10^5 modular additions per pass, so ten passes over
        the small-B subset stay far below 10^7 against a 5400-second budget.
      consequence: >-
        The O-4 branch of the outcome table can now route a uniform shift to the
        correct one of three causes rather than to a two-way disjunction that
        omits the reading the ledger's cost models would actually care about.
