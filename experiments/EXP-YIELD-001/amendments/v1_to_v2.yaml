  reason: >-
    TASK-20260729-003 returned REVISE on the frozen contract at
    82327a02bb3041af70566a3f8edfb4468dd2d52d, with four BLOCKING objections and
    seven material or minor ones. The four blocking objections cannot be
    resolved by execution and cannot be resolved by the Executor - each is a
    defect the contract instructs the Executor to STOP AND REPORT on (ST-3), or
    a control that would produce a systematically wrong denominator for every
    standardized statistic in the package, or an outcome the contract cannot
    classify at all. Specifically. RT-1, the frozen predicate admits 44
    criterion-evaluable cells where the contract, the hypothesis and the
    feasibility table all say 43, so an Executor implementing the predicate and
    an Executor copying the enumeration produce different run sets. RT-2, the
    evaluable SET is defined on measured B but frozen as an enumeration computed
    on B equal to L, with two cells on the knife edge and no statement of which
    authority governs. RT-3, the most likely non-null outcome - a uniform
    p-independent shortfall - fires no pre-registered criterion at all, because
