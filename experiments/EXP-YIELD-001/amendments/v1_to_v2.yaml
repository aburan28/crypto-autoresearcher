            rather than of an unrelated enumerator. The routine is named in the
            manifest and the same function object is used by both legs.
        (c) INV-2 IS SPLIT, AND ONLY THE SHARED-CODE HALF CAN VOID.
            INV-2a  SHARED-ROUTINE DEFECT. The shared distinct-count and
                    membership routine fails its own known-answer test. THE
                    CENSUS NUMBERS ARE VOID RATHER THAN NEGATIVE. This retains
                    the real teeth, on the only part of the leg that can
                    actually indict the census.
            INV-2b  AP-SUPPLY RECOVERY OUTSIDE THE WINDOW. The recovered penalty
                    falls outside a factor 2 of the EV-STR-001 per-cell median
                    at two or more of the six cells, or a trend clause fails.
                    THIS IS AN INSTRUMENT NOTE AND DOES NOT VOID CENSUS DATA.
                    It is reported with every per-seed supply, both estimator
                    forms below, and the statement that the AP enumerator was
                    not reproduced.
        ESTIMATOR FORM, PRE-REGISTERED SO IT CANNOT BE CHOSEN AFTER THE FACT.
        The recovered penalty is reported BOTH as the ratio of medians,
        C(B,m)/median(supply), and as the median of ratios,
        median(C(B,m)/supply). The factor-2 window is evaluated against the
        RATIO OF MEDIANS, because that is the form in which the v1 feasibility
        table reconciles all six targets to better than 1.3x, and because the
        median of ratios is inflated by low-supply seeds through Jensen's
        inequality precisely at the cells where supply is smallest.
        B DISCLOSURE. The leg freezes B = ceil(sqrt(n)), which is 15, 32 and 65.
        Reverse-solving EV-STR-001's own medians shows that record used B = 64
        at n = 4099: C(64,4)/154 = 4126.0 against its reported 4128.6, where
        C(65,4)/154 = 4396.4. The leg will therefore recover about 91.6 and
        4396.4 against targets 87.8 and 4128.6 - ratios 1.04 and 1.06, well
        inside the window. The Executor RECORDS WHICH B IT USED and does not
        adjust it.
      basis: >-
        EV-STR-001 itself records "m=4 at p=211 - supply < B in 6/6 seeds (as
        low as 3 tuples)". The calibration leg draws SIX FRESH CURVES from
        master seed 110601, not the six that produced the targets, so at a
        median supply of 8 with per-seed values reaching 3 a fresh median of 3
        gives C(15,4)/3 = 455, which is 2.1x the 214.9 target and outside the
        window. INV-2 tolerates exactly one failing cell, so one miss is
        absorbed and a second, at the similarly small-count (211, m=3) cell,
