      - >-
        VARIANCE DOUBLING - CONFIRMED ANALYTICALLY, INDEPENDENTLY OF THE
        UNARCHIVED PROBE. Fixed-point-freeness of M -> -M on cancellation-free
        multisets, C_red/2 antipodal pairs, mean (N-1)(1 - exp(-lambda))
