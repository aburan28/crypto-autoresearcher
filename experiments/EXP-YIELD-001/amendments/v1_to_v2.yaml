  outcome_disposition_table:
    binding_note: >-
      THIS TABLE IS THE EVALUATION PROCEDURE. Branches are tested in the order
      given; THE FIRST BRANCH WHOSE CONDITION HOLDS GOVERNS, and exactly one
      governs. Every branch names the disposition and, where the decision
      vocabulary of docs/task-lifecycle.md section 9 applies, the label the
      Coordinator would be pointed at. THE INDICATED LABEL IS GUIDANCE, NOT A
      PRE-COMMITMENT - DEC-20260729-001 is the authority, it is written against
      two independent reviews, and `reject_scoped` on a single unreplicated
      empirical-only run set is FORBIDDEN by agents/coordinator.md under every
      branch of this table.
    definitions: |-
      V        the criterion-evaluable, non-NOISE-LIMITED cells actually
               measured, realised on measured B per C-2; n_eval = size of V.
      W        the realised evaluable columns - (beta, m) columns carrying at
               least three sizes in V.
      OUT      cells of V whose E lies outside [0.90, 1.10]; OUT_low below
               0.90, OUT_high above 1.10.
      CONSISTENT SIGN   OUT is non-empty and equals OUT_low, or equals OUT_high.
      DOWN-SIGNIFICANT  a column of W whose E is non-increasing across its
               sizes, whose OLS slope of log E on log p is at most -0.05, and
               whose 95 percent interval excludes zero.
      UP-SIGNIFICANT    a column of W whose E is non-decreasing, whose slope is
               at least +0.05, and whose 95 percent interval excludes zero.
      FLAT     a column of W with absolute slope at most 0.05 and an interval
               containing zero.
      A column may be none of these - absolute slope above 0.05 with an interval
      containing zero - and such a column is UNDERPOWERED. Underpowered columns
      are expected at the three 1-df columns named in C-12.
    branches:
      - id: P0
        condition: >-
          Any of INV-1, INV-2a, INV-3 or INV-4 has fired.
        disposition: >-
          NO OUTCOME BRANCH IS EVALUATED. The corresponding VOID or INVALID
          disposition governs, the manifest says so, and the batch decision is
          `inconclusive` plus a scoped instrument successor. AN INVALID RUN SET
          IS NOT EVIDENCE and its invalidity is never a negative mathematical
          result. INV-2b, INV-5, INV-6 and INV-7 do not stop the table; INV-7 in
          particular is INFRASTRUCTURE SIGNAL and is never negative evidence.
      - id: O-8
        condition: >-
          At least one column of W is DOWN-SIGNIFICANT and at least one is
          UP-SIGNIFICANT.
        disposition: >-
          COLUMNS DISAGREE. No aggregate trend claim may be made in either
          direction. The per-column table is reported with sizes, df, t, slope,
          standard error and interval. Indicated label `inconclusive`, plus a
          named successor - a beta-direction effect is exactly what HEUR-1's
          assumed uniformity of the o(1) in beta assumes away, and this design
          measures trends in p at fixed beta only.
      - id: O-2
        condition: >-
          At least one column of W is DOWN-SIGNIFICANT with E at most 0.80 at
          its largest evaluated size, and the deviation SHRINKS under
          CTRL-NULL-FB. This is F1.
        disposition: >-
          OUTCOME (c), at the tested sizes and nowhere else. The yield falls
          further below the counting heuristic as p grows; every index-calculus
          cost model in this ledger that charges against B^m/(m! p) is
          OPTIMISTIC at these sizes and worsening with size. It FLAGS cost
          models; it does not re-charge them. Indicated label `weaken` PLUS A
          NAMED REPLICATION - never `reject_scoped`, since this is a single
          unreplicated run set. NOT an attack, NOT a closure, NOT an
          impossibility claim, NOT a statement about any field size outside 12
          to 18 bits.
      - id: O-3
        condition: >-
          At least one column of W is DOWN-SIGNIFICANT, but no DOWN-SIGNIFICANT
          column has E at most 0.80 at its largest size.
        disposition: >-
          TREND WITHOUT MAGNITUDE. A downward trend in p is present at the
          tested sizes but has not reached the pre-registered magnitude
          threshold. Neither (a) nor (c) is established at pre-registered
          strength. Indicated label `weaken` on Y2's no-decay clause, scoped to
          the tested sizes, plus a named EXTENSION to larger k and a named
          replication. If the trend does NOT shrink under CTRL-NULL-FB, INV-5
          governs the reading and no interval-structure statement may be made in
          either direction.
      - id: O-7
        condition: >-
          At least one column of W is UP-SIGNIFICANT and none is
          DOWN-SIGNIFICANT.
        disposition: >-
          THE SHORTFALL SHRINKS AS p GROWS. Directionally consistent with
          outcome (a) asymptotically, but NOT establishing it at the tested
          sizes. Indicated label `inconclusive` for the exponent question, plus
          a named extension. BINDING PROHIBITION - THIS IS NOT OUTCOME (b) AND
          MAY NEVER BE QUOTED AS ONE. D-1 bounds R by R_max at every cell and
          C-6 bounds E by E_max per cell, and both ceilings FALL toward 1 as p
          grows, so a rising E cannot become an excess growing in p. An E above
          its own cell's E_max is INV-1, an implementation defect, and never an
          observation of outcome (b).
      - id: O-1
        condition: >-
          OUT is empty, every column of W is FLAT, CTRL-CALIB-AP does not fire
          INV-2a, CTRL-NULL-SUMSET recovers P_pred within 3 empirical standard
          deviations at every cell of V, and no invalidation has fired. This is
          S1.
        disposition: >-
          OUTCOME (a), at 12 to 18 field bits, m in {2, 3}, x-interval factor
          bases on the frozen beta grid, on ONE prime-order curve per size.
          Indicated label `support` at a strength no higher than `preliminary`,
          scoped exactly, with a named replication - FOUR FIELD SIZES ON ONE
          CURVE EACH IS A SIZE SERIES AND NOT A REPLICATION. It does not upgrade
          the heuristic to a theorem, does not certify it at any larger size,
          and leaves the index-calculus lane permanently heuristic-conditional.
      - id: O-4
        condition: >-
          No column of W is DOWN-SIGNIFICANT or UP-SIGNIFICANT; OUT exceeds one
          third of n_eval; and OUT has a CONSISTENT SIGN. This is the branch the
          v1 F2 excluded, and it is the most likely non-null outcome.
        disposition: |-
          UNIFORM p-INDEPENDENT MULTIPLICATIVE SHIFT. The analytic null is
          missing a term that does not grow with p. Neither (a) nor (c) is
          established. Two sub-branches, decided by CTRL-NULL-FB:
            O-4a  the same shift appears on the random negation-closed factor
                  base at the same measured B on the same curve. The missing
                  term is in C_red or in P_pred - a MODEL OR ESTIMATOR
                  mis-specification for sumsets generally, NOT an
                  interval-structure effect. Indicated label `inconclusive` plus
                  `refine`, with the named successor being a re-derivation of
                  C_red and P_pred before any yield number here is re-used.
            O-4b  the shift shrinks materially under factor-base randomisation.
                  The shift is INTERVAL-SPECIFIC and p-independent at these
                  sizes. Indicated label `inconclusive` on the trend question
                  plus `weaken` on Y2's "E equals 1" clause, scoped to the
                  tested sizes.
          In both sub-branches the size of the shift is reported as a measured
          constant with its spread, and NO COST MODEL IS RE-CHARGED on it.
      - id: O-5
        condition: >-
          No column of W is DOWN-SIGNIFICANT or UP-SIGNIFICANT; OUT exceeds one
          third of n_eval; and OUT has MIXED signs.
        disposition: >-
          HETEROGENEOUS, CELL-DEPENDENT SCATTER. The null model is wrong in a
          way that is not a single multiplicative constant. THE CORRECT VERDICT
          IS INCONCLUSIVE, and a scoped successor must identify the missing
          correction before any yield number here is re-used. Note in advance
          that mixed signs are STRUCTURALLY HARDER to observe than they look,
          because E_max is below 1.10 at 17 of 44 cells and an upward
          out-of-band deviation is impossible there.
      - id: O-6
        condition: >-
          No column of W is DOWN-SIGNIFICANT or UP-SIGNIFICANT; OUT is non-empty
          but at most one third of n_eval.
        disposition: >-
          SPARSE OUT-OF-BAND SET. S1 fails and no falsification criterion fires.
          Indicated label `inconclusive` at batch level. EVERY out-of-band cell
          is NAMED INDIVIDUALLY with its B, C_red, lambda, E, E_max, E_floor,
          empirical null sd, replicate count and standardized deviation, and the
          report states whether the out-of-band cells are concentrated at the
          smallest C_red cells - a discreteness and finite-size signature - or
          are spread across the design. NO COST MODEL IS RE-CHARGED.
      - id: O-9
        condition: >-
          RESIDUAL. Any realised pattern not matched above - most likely OUT
          empty with at least one UNDERPOWERED column, which is what a 1-df
          column produces when the point slope is large and the interval is
          wide.
        disposition: >-
          UNCLASSIFIED BUT FULLY REPORTED. Indicated label `inconclusive`. The
          pattern is described exactly, the per-column table with df and t is
          reported in full, and the record STATES THAT A PATTERN REACHING O-9 IS
          A COMPLETENESS DEFECT OF THIS AMENDMENT and names it as such in
          DEC-20260729-001, rather than resolving it by judgement after the
          numbers are seen. This branch exists so the table is exhaustive BY
          CONSTRUCTION and so that no outcome can ever again fall through it
          silently.
  independent_reconfirmation:
    basis_note: >-
      Every figure below was RE-DERIVED IN THIS SESSION from the definitions in
      the committed contract, on paper, and is not copied from the review. The
      session had no interpreter, no shell and no probe. Where this session's
      value differs from the review's, the difference is recorded under
      disagreements_with_the_review.
    confirmed:
      - >-
        44 CRITERION-EVALUABLE CELLS - CONFIRMED. 27 at m = 2 and 17 at m = 3 on
        the B = L basis, by reducing the predicate to 32 <= B <= floor(sqrt(p))
        at m = 2 and 15 <= B <= floor((3p)^(1/3)) at m = 3 and enumerating the
        frozen beta grid at all four sizes. The omitted cell is
        (m=3, k=12, beta=0.375), B = 23, h = 0.49508, C_red = 2035.5.
      - >-
        NINE EVALUABLE COLUMNS - CONFIRMED, and unchanged by the 44th cell,
        which is alone in its column. Six columns at m = 2 (beta 0.375 to 0.500)
        and three at m = 3 (beta 0.300, 0.325, 0.350). Six carry four sizes and
        three carry three.
      - >-
        DESIGN-WIDE CEILING 1.7338 - CONFIRMED. 1.68 times 4096/3969, where
        4096/3969 = (64/63)^2 = 1.0319979 is the exact Hasse supremum at
        p = 2^12 and 1.68 = 1 x 1.2 x 1.4 at m = 3, B = 5. The v1 value 1.733 is
        the linearisation 1 + 2/sqrt(p) = 1.03125 rounded.
      - >-
        DEGENERATE-B CEILINGS - CONFIRMED. 3.096 at m=3 B=2, 2.293 at m=3 B=3,
        1.935 at m=3 B=4, 2.064 at m=2 B=1. Over the evaluable set, 1.248 at
        m=3 B=15 and 1.062 at m=2 B=34.
      - >-
        17 OF 44 CELLS WITH E_max BELOW 1.10 - CONFIRMED BY DIRECT CELL-BY-CELL
        RECOMPUTATION. 16 at m = 2 - three at k = 14 (beta 0.375, 0.400, 0.425),
        six at k = 16 (beta 0.325 to 0.450), seven at k = 18 (beta 0.300 to
        0.450), none at k = 12 - plus exactly one at m = 3, k = 18, beta = 0.300,
