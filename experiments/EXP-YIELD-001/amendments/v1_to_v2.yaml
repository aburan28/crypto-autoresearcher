        touched it. Separately, the warrant for INV-2 is a NON-SEQUITUR as
        frozen: the leg enumerates AP supports at B = ceil(sqrt(n)) and reports
        C(B,m)/supply, while the census computes distinct(S_2 + F) in a
        discrete-log image and reports |S_m|/P_pred. Passing says nothing about
