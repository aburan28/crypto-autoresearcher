  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 1.5
    maximum_memory_gb: 8
    maximum_runs: 6
    budget_feasibility_note: >-
      Derived per cell in section 8 of the criterion feasibility table. The
      largest single cell (k=18, beta=0.600, m=3, B=1783) needs about 4.67 x 10^8
      modular additions; all m=3 cells at k=18 together need about 1.4 x 10^9;
      every other arm is below 10^8. Peak memory is dominated by the k=18 DL
      table plus one 32 KB bit set, well under 1 GB against the 8 GB cap. THE
      BUDGET CARRIES EVERY CELL WITH A WIDE MARGIN, and the binding cost of this
      experiment is IMPLEMENTATION TIME, NOT COMPUTE.
  cell_priority_order:
    - '1 - the 43 criterion-evaluable cells, m = 2 and m = 3, all four sizes'
    - '2 - the remaining unsaturated cells'
    - '3 - the saturated cells, beta above beta*(m), reported as observations only'
  reduced_scope_core: >-
    If any cap binds, the core that MUST complete is - all criterion-evaluable
    cells at m = 2 and m = 3, both nulls at those cells, the calibration leg,
    and the baselines. EVERY CELL AT WHICH ANY CRITERION IS EVALUATED SURVIVES
    THE REDUCED SCOPE, so a budget bind costs observations and not criteria.
  stopping_rules:
    - >-
      ST-1 PER-CELL CAP. A cell whose projected operation count exceeds 5 x 10^8
      is SKIPPED and recorded as SKIPPED_BUDGET with its projection. Only the two
      largest m = 3 saturation cells are at risk, and no criterion-evaluable cell
      is.
    - >-
      ST-2 RUN CAP. 5400 seconds and 8 GB across six runs. Cells are executed in
      the declared priority order; on approaching the cap the run STOPS and names
      EXPLICITLY every cell not reached, with the reason. A PARTIAL CENSUS WITH A
      NAMED GAP IS A RESULT; A SILENTLY TRUNCATED ONE IS NOT. No unreached cell
      may be reported as a measurement, and no estimate may be substituted for a
      measurement that did not happen.
    - >-
      ST-3 STOP AND REPORT ON AMBIGUITY. If the contract cannot be executed as
      written - in particular if the AP admissibility predicate cannot be
      resolved unambiguously from the committed EXP-STR-001 contract - the
      Executor STOPS AND REPORTS and does NOT repair the protocol in flight. Any
      deviation, however small, is recorded in the manifest as a protocol
      deviation and reported; it is never applied silently.
    - >-
      ST-4 NO INTERPRETATION. The run package contains observations only. It must
      not state which of outcomes (a), (b) or (c) obtained, must not write an
      evidence or decision record, and must not touch any hypothesis status.
      Interpretation belongs to TASK-20260729-007, -008 and -009.
  invalidation_rules:
    - >-
      INV-1 IMPOSSIBLE EVENT. R exceeds R_max = (p/N) prod_{j=0}^{m-1} (1 + j/B),
      or |S_m| exceeds min(C_all, N), or |S_m| is less than |S_(m-2)|, at any
      cell. Each is mathematically impossible, so this is an IMPLEMENTATION
      DEFECT - the run is INVALID, it is never evidence about the yield
      heuristic, and IT IS NEVER AN OBSERVATION OF OUTCOME (b).
    - >-
      INV-2 CALIBRATION VOID. CTRL-CALIB-AP fails to recover EV-STR-001's
      per-cell penalty within a factor 2 in at least 5 of its 6 cells, or fails
      to reproduce the monotone growth of the penalty in n at fixed m and its
      superlinear growth in m at fixed n. THE CENSUS NUMBERS ARE VOID RATHER THAN
      NEGATIVE, the manifest says so, and the batch decision is `inconclusive`
      plus a scoped instrument successor.
    - >-
      INV-3 DL TABLE DEFECT. CTRL-DL reports any mismatch between a curve-side
      and a DL-image sum. The entire run set is INVALID.
    - >-
      INV-4 NULL MODEL NOT RECOVERED. CTRL-NULL-SUMSET fails to reproduce P_pred
      within 3 empirical standard deviations at any criterion-evaluable cell. The
      analytic null this contract DERIVES is wrong, and every E value is VOID
      rather than negative.
    - >-
      INV-5 DESTROY-PARAMETER FAILURE. A deviation of E from 1 measured on the
      interval factor base does NOT shrink under CTRL-NULL-FB randomisation at
      three or more criterion-evaluable cells. THE DEVIATION IS AN ESTIMATOR OR
      CURVE ARTIFACT, NOT AN INTERVAL-STRUCTURE SIGNAL, and no interval-structure
      reading may be made in either direction. Reporting this is more valuable
      than any yield number in the package.
    - >-
      INV-6 BASELINE INSTRUMENT DEFECT. Measured rho cost falls more than 20
      percent below 0.886 sqrt(N) on a curve whose automorphism group has order
      2. Every operation-count comparison in the package is then untrustworthy.
    - >-
      INV-7 INFRASTRUCTURE. A timeout, crash, resource exhaustion or
      implementation failure is recorded with its terminal status and IS
      INFRASTRUCTURE SIGNAL - NEVER negative evidence about the yield heuristic
      and never a result.
