experiment:
  id: EXP-YIELD-001
  hypothesis_id: H-YIELD-001
  version: 1
  title: >-
    Exhaustive census of Semaev m-fold decomposition yield against the counting
    heuristic B^m/(m! p), at m in {2,3} on four toy prime fields over a beta
    grid, with a shape-matched occupancy null, a factor-base-randomisation
    destroy-parameter null, an EV-STR-001 calibration leg as an invalidation
    control, and measured matched rho and BSGS baselines
  status: review_required
  status_note: >-
    `review_required` and NOT `approved`. This contract is frozen by
    TASK-20260729-001, snapshot-committed by TASK-20260729-002, and receives an
    INDEPENDENT NON-ORIGINATING PRE-EXECUTION REVIEW at TASK-20260729-003 before
    any compute is spent. NO RUN OF THIS CONTRACT IS AUTHORIZED BY ITS EXISTENCE.
    Under INT-BATCH011-E and RC-11, a REVISE verdict permits AT MOST ONE
    versioned protocol_amendment cycle, which must itself be snapshot-committed
    and independently re-reviewed before execution; the dispatcher CANNOT enforce
    that gate, because a `completed` review carrying REVISE unblocks the Executor
    mechanically. The contract in force at execution is the COMMITTED BLOB at the
    TASK-20260729-002 commit, not the working-tree file.
  objective: >-
    Measure, exhaustively and without any polynomial solver, the fraction of
    targets in a prime-order prime-field elliptic-curve group that decompose as a
    sum of m factor-base elements, and compare it with the counting heuristic
    B^m/(m! p) that every index-calculus cost model in this ledger charges
    against and that EV-IC-001 states in its own text was NOT directly measured
    at bits at or above 16. The measurement discriminates the three explanations
    of prime-field relation yield that no ledger record currently separates -
    (a) the heuristic is correct once two known corrections are applied,
    (b) the yield EXCEEDS the heuristic by a factor growing in p, and
    (c) the yield falls systematically below it and the shortfall grows with p.
  admission_and_ceiling: >-
    CARRIED FORWARD VERBATIM AND BINDING ON EVERY DOWNSTREAM RECORD.
    EXP-YIELD-001 MOVES NO EXPONENT AND IS AN EXPONENT-DECIDING SCREEN, EXPRESSLY
    NOT AN EXPONENT-TARGETING MECHANISM UNDER docs/target-result-profile.md RULE
    A1, AND NO DOWNSTREAM RECORD MAY QUOTE IT AS TARGET-CLASS.
    It is not an attack, not an attack improvement, not a cryptanalytic result,
    not a closure, and not an impossibility claim. Its CLAIM TIER IS CAPPED AT
    TOY. It CAN MEET NO COMPLETION CRITERION OF GOAL-ECDLP-001 UNDER ANY OUTCOME.
    It changes no existing hypothesis status - H-IC-001 stays `weakened`,
    H-STR-002 stays `weakened` with DEFER-BATCH009-001's replication obligation
    still binding its next transition in either direction, H-SUBRES-001 stays
    `weakened`, H-ENDO-001 stays `approved` which carries no evidential standing,
    H-GGM-001 stays `specified`, H-FCP-001 stays `analyzed`. It leaves all four
    asymptotic-claim promotion gates OPEN and attempts none of them. No closure
    quorum is claimed or claimable (INT-BATCH011-D). A TIMEOUT, CRASH, RESOURCE
    EXHAUSTION OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL AND IS NEVER
    NEGATIVE EVIDENCE about the yield heuristic.
  instrument_independence: >-
    NO GROEBNER BASIS, NO POLYNOMIAL SYSTEM SOLVE AND NO SUMMATION-POLYNOMIAL
    COMPUTATION ANYWHERE IN THIS CONTRACT. Decomposition is decided by MEMBERSHIP
    IN THE SET OF FACTOR-BASE m-SUMS, tested by hash lookup. harness/endomorphism_la.py
    and every other part of the EXP-STR-002 instrument MUST NOT be imported, read
    into the driver, or reused. THIS IS THE REASON THE MEASUREMENT DOES NOT
    INHERIT THE INSTRUMENT QUESTION THAT DEC-20260727-009 LEFT UNADJUDICATED
    ABOUT THAT MODULE, where the primary metric may have been a statistic of
    insertion bookkeeping rather than a measurement of the quantity it named. The
    driver is a NEW single file under experiments/EXP-YIELD-001/driver/ and
    nothing under harness/ or tools/ is modified.
  criterion_feasibility_table_ref: >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/tasks/TASK-20260729-001/criterion_feasibility_table.md
    - MANDATORY READING FOR THE REVIEWER AND FOR ANY READER OF A RESULT. Every
    threshold in this contract is evaluated there, with the arithmetic shown, at
    the exact cells that will run (DEFER-BATCH009-003). Three criteria inherited
    from IDEA-20260727-006 were found UNFIRABLE or NON-DISCRIMINATING and were
    removed or replaced BEFORE this freeze; see criteria_removed_before_freeze.
  inputs:
    field_sizes: >-
      Four toy prime fields. p_k is the SMALLEST PRIME AT OR ABOVE 2^k for
      k in {12, 14, 16, 18}, computed by the driver and recorded in every
      manifest. No prime is asserted in this contract, because the authoring
      session had no interpreter and does not fabricate arithmetic it cannot
      check.
    curve_selection_rule: >-
      DETERMINISTIC AND REPRODUCIBLE, so that the selected curve is a function of
      the contract and not of the Executor. For t = 1, 2, 3, ... and for a from 0
      to t with b = t - a, skip any (a, b) with 4a^3 + 27b^2 congruent to 0 mod
      p, skip a = 0 and b = 0 (which give j-invariant 0 and 1728 and hence extra
      automorphisms), and take the FIRST curve y^2 = x^3 + a x + b whose group
      order N is PRIME and different from p. Record (p, a, b, N) in every
      manifest. Prime N removes every cofactor and subgroup-structure confound,
      guarantees no point of order 2 (so the factor base is closed under negation
      and B is even), and makes every group element a legitimate target.
      DECLARED WEAKNESS, NOT HIDDEN - exactly ONE curve per field size is used,
      so a per-size result is a property of that curve as well as of the size;
      the uniform-random factor-base null is what separates the two.
    generator: >-
      The point with the smallest x admitting a point, and the smaller of the two
      y values. Since N is prime any non-identity point generates.
    factor_base: >-
      F = {P in G such that x(P) lies in the interval I = {0, 1, ..., L-1}} with
      L = round(p^beta). B = |F| is COUNTED, never modelled. B is close to L in
      expectation with fluctuation of order sqrt(L), and every criterion is
      evaluated on measured B.
    beta_grid: >-
      0.200 to 0.600 in steps of 0.025, i.e. 17 values, at every field size and
      both arities. 136 census cells in total.
    arity: 'm in {2, 3} only'
    targets: >-
      ALL N group elements. The census is EXHAUSTIVE - it computes the SET S_m of
      all sums of m-element multisets of F and reports |S_m| exactly. There is no
      target sampling and therefore no sampling error in the primary metric.
    decomposition_definition: >-
      A target T decomposes if T is the sum of some m-element MULTISET from F
      (repetition allowed). The sign of each summand is already carried by the
      closure of F under negation, so this is exactly the Semaev m-fold relation
      shape with coefficients in {+1, -1}. Decompositions with other integer
      coefficients, adaptive factor bases, and decomposition MULTIPLICITY are
      OUTSIDE this contract and nothing measured here bears on them.
    computation_domain: >-
      The census is carried out in the DISCRETE-LOGARITHM IMAGE. One full DL
      table of G with respect to the fixed generator is built per field size by
      walking N multiples of that generator, after which every point is an
      integer modulo N, an m-sum is an integer addition, and membership is a bit
      test in an N-bit set. This is a MEASUREMENT DEVICE AND NOT AN ATTACK
      TECHNIQUE and confers no attack advantage - building the table costs N
      group operations, already more than the 0.886 sqrt(N) a matched Pollard rho
      needs to solve the instance outright. Its correctness is CHECKED by control
      CTRL-DL and not assumed.
  conventions_fixed:
    heuristic_denominator: >-
      The counting heuristic is h = B^m/(m! p), using the FIELD PRIME p exactly as
      IDEA-20260727-006 writes it. The observed decomposition probability is
      |S_m|/N using the GROUP ORDER N. Both are reported, together with the ratio
      p/N, which by the Hasse bound lies within 2/sqrt(p) of 1 - at most 3.13,
      1.56, 0.78 and 0.39 percent at k = 12, 14, 16, 18. THE CONVENTION CANNOT
      MOVE ANY THRESHOLD IN THIS CONTRACT and the alternative
      (heuristic B^m/(m! N)) is reported alongside so a reader may recompute.
    interval_versus_point_count: >-
      The heuristic is evaluated on the MEASURED POINT COUNT B, never on the
      interval length L, so the (x, +-y) pairing is handled by measurement rather
      than by a factor-of-two convention. Both B and L are reported per cell, as
      is B/L.
    m_factorial_denominator: >-
      m-sums are counted as UNORDERED MULTISETS WITH REPETITION. The exact count
      is C_all = C(B+m-1, m), and C_all * m! / B^m = prod_{j=0}^{m-1} (1 + j/B)
      is reported per cell so the m! denominator is CHECKED rather than assumed.
      The distinct reachable count |S_m| is reported alongside C_all and
      alongside C(B, m) (the repetition-free subset count) so that all three
      conventions are visible in the run record.
    repeated_elements_and_cancellation: >-
      Repeated factor-base elements ARE permitted in a multiset. Multisets
      containing a cancelling pair {P, -P} sum to the corresponding
      (m-2)-multiset and are handled EXACTLY, not discarded - the
      cancellation-free count is
      C_red = sum_{k=1..m} C(B/2, k) C(m-1, k-1) 2^k, which is B^2/2 at m = 2 and
      B + B(B-2) + B(B-2)(B-4)/6 at m = 3. The identity has no x-coordinate and
      is therefore never in F; it IS in S_m for even m.
    occupancy_prediction: >-
      P_pred = N (1 - exp(-C_red/N)) + |S_(m-2)| exp(-C_red/N), with |S_0| = 1
      and |S_1| = B. This is the SHAPE-MATCHED NULL in analytic form; its null
      value for E is 1 BY CONSTRUCTION and not by fitting. It is validated
      empirically by the RUN-YIELD-001-NULL-RANDOM-SUMSET arm.
  controls:
    - id: CTRL-NULL-SUMSET
      description: >-
        SHAPE-MATCHED OCCUPANCY NULL, measured through the IDENTICAL code path
        and the IDENTICAL distinct-count estimator as the census. For each
        criterion-evaluable cell, throw C_red uniformly random elements of G into
        the same N-bit set and count distinct occupancy; repeat 30 times where
        C_red is at most 10^6 and 10 times otherwise; report the empirical mean
        and standard deviation and compare with P_pred.
      declared_design_choice: >-
        THE QUEUE'S LITERAL WORDING - "a uniformly random subset of the group of
        the same cardinality as the reachable m-sum set" - IS TAUTOLOGICAL: the
        distinct count of a set of given cardinality is that cardinality. The
        non-tautological null with the same shape is the one implemented here,
        matched on the number of BALLS (C_red) rather than on the number of
        occupied BINS. The literal reading is ALSO reported, as the trivial
        identity it is, so the deviation is declared rather than silently
        substituted.
      failure_meaning: >-
        Failure to recover P_pred within 3 empirical standard deviations at any
        criterion-evaluable cell fires INV-4 - the null model this contract
        DERIVES rather than cites is wrong, and every E value is VOID rather than
        negative.
    - id: CTRL-NULL-FB
      description: >-
        DESTROY-PARAMETER NULL. Re-run the census at every criterion-evaluable
        cell with a UNIFORMLY RANDOM NEGATION-CLOSED subset of G of the IDENTICAL
        measured size B, on the IDENTICAL curve, through the IDENTICAL code path,
        for 3 independent draws.
      failure_meaning: >-
        The parameter meant to destroy an interval-structure effect is the
        interval itself. A DEVIATION OF E FROM 1 THAT SURVIVES FACTOR-BASE
        RANDOMISATION IS AN ESTIMATOR OR CURVE ARTIFACT, NOT AN INTERVAL-STRUCTURE
        SIGNAL, and no interval-structure reading may be made in either
        direction. This is stated in advance (INV-5) precisely so it cannot be
        decided after the numbers are seen.
    - id: CTRL-CALIB-AP
      description: >-
        EV-STR-001 CALIBRATION LEG, run in THAT RECORD'S OWN REGIME AND NOWHERE
        ELSE - B = ceil(sqrt(n)), m in {3, 4}, n in {211, 1009, 4099}, shift set
        D = {1..64}, arithmetic-progression supports {x, x+d, ..., x+(m-1)d} as
        defined in the committed experiments/EXP-STR-001/specification.yaml,
        6 seeds per cell. Recover C(B,m)/supply per cell and compare with that
        record's per-cell medians - 17.5x (n=211, m=3), 214.9x (n=211, m=4),
        41.9x (n=1009, m=3), 924.5x (n=1009, m=4), 87.8x (n=4099, m=3) and
        4128.6x (n=4099, m=4).
      convention_warning: >-
        THIS LEG'S CONVENTION IS DIFFERENT FROM THE CENSUS'S. The census uses an
        x-interval factor base at B = p^beta on a grid; this leg uses AP supports
        at B = ceil(sqrt(n)). ANY COMPARISON BETWEEN THE TWO IS QUALITATIVE ONLY
        and must be labelled as such in the run record. Treating EV-STR-001's
        figures as a cross-convention reproduction target would be a category
        error and would manufacture a false calibration failure. THE PENALTY IS
        STRONGLY CELL-DEPENDENT, SPANNING 17.5x TO 4128.6x, AND GROWS WITH n AT
        FIXED m AND SUPERLINEARLY IN m AT FIXED n - QUOTING 17.5x ALONE AS
        CHARACTERISTIC UNDERSTATES THE EFFECT BY UP TO TWO ORDERS OF MAGNITUDE
        AND IS FORBIDDEN.
      failure_meaning: >-
        THIS IS AN INVALIDATION RULE (INV-2), NOT A FALSIFICATION CRITERION. If
        the harness cannot recover a KNOWN penalty in the regime where that
        penalty was actually measured, its yield numbers are not trustworthy and
        THE CENSUS NUMBERS ARE VOID RATHER THAN NEGATIVE.
      named_execution_risk: >-
        The exact admissibility predicate for an AP support must be resolved from
        the COMMITTED EXP-STR-001 contract. IF IT CANNOT BE RESOLVED
        UNAMBIGUOUSLY THERE, THE EXECUTOR STOPS AND REPORTS. A guessed predicate
        would manufacture a calibration verdict in either direction.
    - id: CTRL-DL
      description: >-
        DISCRETE-LOG TABLE INTEGRITY. Per field size, draw 10^4 random
        m-multisets from F, compute their sum BOTH on the curve by explicit point
        addition AND in the DL image by modular addition, and require exact
        agreement on all 10^4.
      failure_meaning: >-
        A single mismatch fires INV-3 and invalidates the entire run set. This is
        the control that stands between a combinatorial measurement and a
        bookkeeping statistic.
    - id: CTRL-EXHAUSTIVE-TRUTH
      description: >-
        EXHAUSTIVE-VERSUS-SAMPLED AGREEMENT. Where a quantity is reported SAMPLED
        at a large cell (the m = 3 collision multiplicity profile above
        C_all = 5 x 10^7), the same estimator is run at the two smallest field
        sizes where the exhaustive value is also computed, and the two must agree
        within sampling error.
      failure_meaning: >-
        Disagreement means the sampled estimator is biased and every SAMPLED
        quantity in the package is reported as unreliable, with the exhaustive
        cells unaffected.
    - id: CTRL-COLLISION-ACCOUNTING
      description: >-
        Report DISTINCT reachable m-sums |S_m| alongside C_all = C(B+m-1, m),
        C(B, m), C_red, the number of multisets summing to the identity, and the
        collision multiplicity profile (maximum load and the load histogram).
      failure_meaning: >-
        This is the control that CHECKS the m! denominator of the heuristic
        rather than assuming it. A profile inconsistent with the occupancy model
        is reported as an observation and feeds INV-4.
    - id: CTRL-BASELINE
      description: >-
        MATCHED BASELINES, MEASURED. Pollard rho with negation and BSGS are RUN
        on 16 random targets per field size on the census curve, each rho solve
        carrying a discrete-logarithm certificate the driver re-verifies
        independently. Measured operation counts are reported beside the model
        positions 0.886 sqrt(N) and about 2 sqrt(N), and BSGS memory is reported
        beside its time.
      failure_meaning: >-
        A measured rho cost more than 20 percent below 0.886 sqrt(N) on a curve
        with automorphism group of order 2 would mean the baseline instrument is
        wrong, and every operation-count comparison in the package is then
        untrustworthy.
  independent_variables:
    - 'field size k in {12, 14, 16, 18}, hence prime p and prime group order N'
    - 'beta in {0.200, 0.225, ..., 0.600}, hence interval length L and measured B'
    - 'arity m in {2, 3}'
    - 'factor-base type in {x-interval, uniform-random negation-closed}'
    - 'estimator arm in {census, occupancy Monte Carlo}'
  metrics:
    primary:
      - >-
        PM-1 |S_m|, the exact number of distinct group elements expressible as a
        sum of an m-element multiset from F, per cell. DETERMINED.
      - >-
        PM-2 R = (|S_m|/N) / (B^m/(m! p)), the observed-over-heuristic yield
        ratio, reported per cell with a Wilson interval on |S_m|/N and beside its
        exact ceiling R_max = (p/N) prod_{j=0}^{m-1} (1 + j/B). DETERMINED.
      - >-
        PM-3 E = |S_m| / P_pred, the occupancy-normalised efficiency, per cell,
        beside the empirical null mean and standard deviation from
        CTRL-NULL-SUMSET. DETERMINED (its null spread is SAMPLED).
      - >-
        PM-4 the ordinary-least-squares slope of log E against log p within each
        beta-column carrying at least three criterion-evaluable sizes, with a 95
        percent interval. DERIVED_FIT over DETERMINED inputs.
    secondary:
      - 'C_all, C(B,m), C_red, h, B, L, B/L, p/N, per cell. DETERMINED.'
      - 'number of m-multisets summing to the identity, per cell. DETERMINED.'
      - >-
        collision multiplicity profile - maximum load and load histogram.
        DETERMINED at m=2 and at m=3 where C_all is at most 5 x 10^7, SAMPLED
        over 10^6 uniform multisets otherwise.
      - 'E on the uniform-random factor base, per cell per draw. DETERMINED per draw, SAMPLED over 3 draws.'
      - 'AP calibration recovered penalty C(B,m)/supply, per cell per seed. DETERMINED per seed.'
      - >-
        measured rho and BSGS group-operation counts and BSGS memory per field
        size (MEASURED), beside 0.886 sqrt(N) and 2 sqrt(N) (DERIVED_MODEL).
      - 'census group-equivalent operations per instance, and their ratio to measured rho operations. MEASURED.'
      - 'per-cell wall clock and peak memory. MEASURED.'
  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: >-
      The occupancy-normalised efficiency E = |S_m| / P_pred at every
      criterion-evaluable cell, and its trend in log p at fixed (beta, m).
    formula: >-
      E = |S_m| / [ N (1 - exp(-C_red/N)) + |S_(m-2)| exp(-C_red/N) ] = 1 + o(1),
      with C_red = sum_{k=1..m} C(B/2, k) C(m-1, k-1) 2^k, and with
      d log E / d log p = 0 at fixed (beta, m). Simultaneously and EXACTLY,
      R = (|S_m|/N)/(B^m/(m! p)) <= (p/N) prod_{j=0}^{m-1} (1 + j/B).
    source: >-
      The upper bound is DERIVED IN PLACE in H-YIELD-001 mechanism and in section
      2 of the criterion feasibility table (every decomposable target is the sum
      of at least one m-multiset, of which there are exactly C(B+m-1, m)); it is
      elementary and near-certainly folklore, NO NOVELTY IS CLAIMED, and NO
      EXTERNAL SOURCE WAS RETRIEVED. The occupancy prediction is the textbook
      balls-in-bins law applied to C_red balls in N bins. NEITHER IS AN IMPORTED
      NUMBER: both are recomputable from this contract alone, and the independent
      pre-execution review is asked to RE-DERIVE rather than to adjudicate by
      quotation.
  criteria_definitions:
    criterion_evaluable_cell: >-
      A census cell with h = B^m/(m! p) at most 0.5 AND C_red at least 500. There
      are 43 such cells of the 136 - 27 at m = 2 (beta 0.300 to 0.500, partially)
      and 16 at m = 3 (beta 0.225 to 0.350, partially) - enumerated with their
      arithmetic in section 5 of the criterion feasibility table. Cells outside
      this set ARE RUN AND ARE REPORTED AS OBSERVATIONS, and NO CRITERION IS
      EVALUATED AT THEM, because saturation forces the ratio there regardless of
      what the curve does.
    evaluable_column: >-
      A (beta, m) column carrying at least THREE criterion-evaluable field sizes.
      There are NINE - six at m = 2 (beta 0.375, 0.400, 0.425, 0.450, 0.475,
      0.500) and three at m = 3 (beta 0.300, 0.325, 0.350).
    noise_limited_cell: >-
      A criterion-evaluable cell whose EMPIRICAL null standard deviation from
      CTRL-NULL-SUMSET exceeds 2 percent of P_pred. Such a cell is reported
      NOISE-LIMITED and EXCLUDED from criterion evaluation, with its exclusion
      recorded. The predicted worst case over the evaluable set is 1.05 percent,
      so no exclusion is expected; the rule exists so that a surprise is handled
      by a pre-registered rule rather than by judgement after the fact.
  success_criterion: >-
    S1. At EVERY criterion-evaluable cell that is not NOISE-LIMITED, the
    occupancy-normalised efficiency E lies in the closed interval [0.90, 1.10];
    AND in EVERY evaluable column the ordinary-least-squares slope of log E
    against log p has absolute value at most 0.05 with a 95 percent interval
    containing zero; AND the calibration leg CTRL-CALIB-AP returns NOT-VOID; AND
    CTRL-NULL-SUMSET recovers P_pred within 3 empirical standard deviations at
    every criterion-evaluable cell; AND no invalidation rule has fired.
    S1 MET MEANS OUTCOME (a) - at 12 to 18 field bits, m in {2,3}, x-interval
    factor bases on the frozen beta grid, on one prime-order curve per size, the
    counting heuristic B^m/(m! p) is correct once the multiset factor
    prod (1 + j/B) and the birthday correction are applied, and no residual trend
    in p is detectable at these sizes. S1 MET IS TOY-SCALE VALIDATION OF A
    HEURISTIC AND NOTHING MORE. It does not upgrade the heuristic to a theorem,
    does not certify it at any larger size, and leaves the index-calculus lane
    permanently heuristic-conditional in exactly the sense
    docs/target-result-profile.md requires to be declared.
  falsification_criterion: >-
    F1. In AT LEAST ONE evaluable column, ALL THREE of the following hold - E is
    at most 0.80 at the largest evaluated field size of that column; E is
    non-increasing across the evaluated field sizes of that column; and the
    ordinary-least-squares slope of log E against log p in that column is at most
    -0.05 with a 95 percent interval excluding zero - AND the deviation SHRINKS
    under factor-base randomisation, that is, CTRL-NULL-FB at the same measured B
    on the same curve does not reproduce a deviation of the same sign and
    comparable magnitude.
    F1 MET MEANS OUTCOME (c) - the yield falls further below the counting
    heuristic as p grows, every index-calculus cost model in this ledger that
    charges against B^m/(m! p) is OPTIMISTIC at these sizes and worsening with
    size, and the shortfall is exponent-relevant in the PESSIMISTIC direction.
    F1 MET IS NOT AN ATTACK, NOT A CLOSURE, NOT AN IMPOSSIBILITY CLAIM, AND NOT A
    STATEMENT ABOUT ANY FIELD SIZE OUTSIDE 12 TO 18 BITS. It FLAGS cost models; it
    does not re-charge them, which is separate work.
    F2. E falls outside [0.90, 1.10] at MORE THAN ONE THIRD of the
    criterion-evaluable, non-noise-limited cells with NO monotone trend in p and
    no consistent sign. Neither (a) nor (c) is established, the analytic null is
    missing a term, THE CORRECT VERDICT IS INCONCLUSIVE, and a scoped successor
    must identify the missing correction before any yield number here is re-used.
    THE FEASIBILITY OF BOTH IS ESTABLISHED IN ADVANCE - F1's 0.80 threshold sits
    about 19 chance standard deviations from the null and nothing in the design
    bounds E from below, so THE NEGATIVE OUTCOME IS GENUINELY REACHABLE.
  criteria_removed_before_freeze:
    - id: REMOVED-1
      inherited_from: 'IDEA-20260727-006 prediction 1 and falsification condition 1'
      text: 'ratio exceeding 2.0 and increasing with p across at least three consecutive sizes'
      verdict: >-
        CANNOT FIRE AT ANY CELL. The counting bound gives
        R <= (p/N) prod_{j=0}^{m-1} (1 + j/B), whose design-wide maximum over all
        136 cells is 1.733, attained at the single smallest cell (k=12,
        beta=0.200, m=3, B=5), and which FALLS toward 1 as p grows at fixed beta.
      disposition: >-
        REMOVED as a criterion; RETAINED as invalidation rule INV-1. An
        observation of R above R_max is mathematically impossible and is
        therefore an implementation defect, never an observation of outcome (b).
      consequence_stated_plainly: >-
        Outcome (b) - yield exceeding the heuristic by a factor growing in p - is
        THE ONLY MEASURABLE EVENT ON THE PRESENT FRONTIER THAT WOULD REOPEN A
        PRIME-FIELD EXPONENT BELOW ONE HALF, and this derivation excludes it A
        PRIORI on this metric, for this decomposition shape, at ANY scale. That
        is an answer to the exponent question in the PESSIMISTIC direction,
        obtained by counting rather than by measurement, and it is scoped in
        H-YIELD-001 interpretation limits to the fixed-factor-base, fixed-arity,
        unweighted decomposition shape.
    - id: REMOVED-2
      inherited_from: 'IDEA-20260727-006 prediction 1, outcome (c) clause'
      text: 'ratio below 0.5 and decreasing'
      verdict: >-
        CANNOT DISCRIMINATE. R below 0.5 is forced by SATURATION ALONE at 42 of
        the 136 cells (every cell with h at least 1.594, since the occupancy null
        gives R_null = (1 - exp(-h))/h), with zero structural content; and inside
        the unsaturated band it requires removing at least 36.5 percent of the
        predicted reachable targets, roughly 35 chance standard deviations out.
      disposition: >-
        REPLACED by criteria on E, whose null value is 1 by construction, and
        restricted to criterion-evaluable cells.
    - id: REMOVED-3
      inherited_from: 'IDEA-20260727-006 prediction 2, falsification condition 2, minimal_test stage 2'
      text: 'empirical crossover beta agrees with the derived (m+1)/(2m) within 0.05, and a crossover more than 0.10 below it falsifies'
      verdict: >-
        CANNOT FIRE. beta_cert(m) = (m+1)/(2m) is 0.75 at m=2 and 0.6667 at m=3,
        both above the top of the frozen grid AND above the saturation threshold
        beta*(m) = (1 + log_p(m!))/m at every tested size. In general
        beta_cert(m) > beta*(m) whenever p > (m!)^{2/(m-1)} - i.e. p > 4 at m=2,
        p > 6 at m=3, p > 11 at m=5, p > 25 at m=10 - so the certification
        threshold lies STRICTLY INSIDE THE REGIME WHERE EVERY TARGET DECOMPOSES
        MANY TIMES OVER and the yield question is trivial. Extending the grid
        would not repair it.
      disposition: >-
        STAGE 2 IS CUT, in addition to stages 4 and 5 already cut by the BATCH-011
        queue. CONSEQUENCE, BINDING - EXP-YIELD-001 DOES NOT MEASURE beta_cert,
        DOES NOT TEST THE (m+1)/(2m) DERIVATION, AND DOES NOT ADJUDICATE
        IDEA-20260727-006'S HEADLINE GAP CLAIM beta_cert - beta_adm at least 2/5
        (which is separately undecidable here as DEFER-BATCH011-002, since
        beta_adm needs an omega_LA this ledger has never measured). NO RECORD
        PRODUCED BY THIS BATCH MAY SAY OTHERWISE.
  matched_baseline_position_RC7:
    operation_unit: one elliptic-curve point addition or doubling
    pollard_rho_with_negation:
      time: '0.886 sqrt(N) group operations - at most 454 at k = 18'
      memory: 'N^{o(1)} - O(1) stored points'
      status_in_this_experiment: 'MEASURED over 16 targets per field size, with a re-verified discrete-log certificate per solve'
    bsgs:
      time: 'about 2 sqrt(N) group operations - at most 1024 at k = 18'
      memory: 'sqrt(N) stored group elements - 512 at k = 18'
      status_in_this_experiment: MEASURED over the same 16 targets per field size
    this_experiment:
      time: 'at least N for the DL table alone, plus about min(C_red, N) x B per cell'
      memory: 'O(N) bits for the sum set, plus the DL table'
    standing_control: >-
      THE CENSUS COSTS MORE GROUP-EQUIVALENT OPERATIONS THAN SOLVING THE INSTANCE
      OUTRIGHT. The ratio census-operations to measured-rho-operations is expected
      to be far above 1, of order 10^2 to 10^6, and is REPORTED PER INSTANCE
      precisely so that no reader can mistake a yield measurement for an attack
      result. A ratio below 1 would be a red flag about the accounting, not an
      attack.
  scale_relevance:
    tier: toy
    justification: >-
      At most 18 field bits, m at most 3, one curve per size, one interval
      anchor, one implementation, one budget. AT 12 TO 18 BITS THE INTERVAL
      FACTOR BASE IS A LARGE FRACTION OF THE FIELD AT THE HIGHER BETA, SO THE
      SHORT-BOX REGIME IS BARELY ENTERED - the confounder IDEA-20260727-006
      declares first, restated here so the red team tests it rather than
      rediscovers it. What DOES transfer beyond toy scale is only the counting
      derivation of REMOVED-1 and the threshold comparison of REMOVED-3, both of
      which are scale-free algebra rather than measurements, and both of which
      are offered for independent re-derivation. NOTHING MEASURED HERE IS
      EVIDENCE ABOUT CRYPTOGRAPHIC-SIZE CURVES IN EITHER DIRECTION, and toy-scale
      agreement is TOY-SCALE VALIDATION OF A HEURISTIC and must never be
      presented as crypto-scale validation.
    correspondence: >-
      null - direct sampling. No correspondence, isometry or transport claim of
      any kind is used to reach scale, and none is available.
  tail_checks:
    - >-
      The largest single-cell |log E| over the criterion-evaluable set, compared
      against the extreme-value (Gumbel) prediction for the maximum of the
      corresponding number of standardized null deviations, using the EMPIRICAL
      null standard deviations from CTRL-NULL-SUMSET. A deviation exceeding the
      predicted maximum is reported as a tail observation and is NOT by itself a
      criterion.
    - >-
      The maximum collision multiplicity (most-loaded sum bucket) against the
      maximum-load prediction of the occupancy model, per cell.
    - >-
      The distribution of (|S_m| - P_pred) divided by the empirical null standard
      deviation across all criterion-evaluable cells, compared against the
      standard normal - checking the BULK as well as the extremes, since a
      systematic small shift across many cells is the signature F2 is written for.
