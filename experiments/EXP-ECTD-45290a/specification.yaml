experiment:
  id: EXP-ECTD-45290a
  hypothesis_id: H-ECTD-3dbda5
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_proposal: IDEA-20260805-4243e6
  version: 1

  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approval_status: >-
    Not approved. No approved_by field is present. Only the Coordinator approves
    an experiment (AGENTS.md rule 1); this is a design draft submitted for
    review, and it neither amends nor supersedes EXP-ECTD-001 or any other
    contract.

  title: >-
    Isogeny-class mass census: the unconditional hiding-budget cap, the exact
    Kronecker fixture, the supersingular positive control, and the security-margin
    table for the public limb of GOAL-ECTD-001

  objective: >-
    If later approved and authorized, measure the size of the endpoint space
    available to an ordinary-F_p secret-isogeny trapdoor designer -- the Hurwitz-
    Kronecker class number H(4p - t^2) across the full trace range at five prime
    sizes -- and emit (i) the exact Kronecker fixture, (ii) the median-exponent
    trend, (iii) the analytic-cap check, (iv) the enumerability fraction f(h0, p),
    (v) the supersingular nearby-object comparison, and (vi) the security-margin
    table MARGIN(c) = log2(0.399 c) under two class-size readings and two
    traversal readings. NO CURVE IS CONSTRUCTED, NO DISCRETE LOGARITHM IS
    COMPUTED, AND NO ATTACK IS RUN.

  what_this_is_not:
    - Not a discrete-logarithm computation, a relation collection, or an ECDLP attack of any kind.
    - Not a trapdoor construction, a trapdoor detection, or a claim that any trapdoor exists or does not.
    - Not an impossibility result. The bound it computes is conditioned on the endpoint weakness being publicly recognizable, and that condition is carried in every output artifact.
    - Not a measurement of c_test or c_step. Both are free symbols; the deliverable is a table of MARGIN as a function of c, and no numeric value of c is asserted anywhere.
    - Not an amendment, re-registration, or criticism of EXP-ECTD-001's mathematics. Its BATCH-003 feasibility output is information addressed to the Coordinator, who alone may act on it.
    - Not a run, an observation, or evidence. No execution has occurred.
    - Not a claim about supersingular curves, extension fields, trapdoor-DDH, or any goal other than GOAL-ECTD-001.

  claim_ceiling:
    tier: toy
    scope: >-
      A run could support, at most: that at primes p <= 10^7 the Kronecker-
      Hurwitz relation reproduces exactly, that the mean class size matches
      sqrt(p)/2 to the stated tolerance, that the median exponent rises
      monotonically inside [0.70, 1.00], that no computed class exceeds the
      analytic cap, that the enumerability fraction falls with p at the stated
      log-log slope, and that the supersingular count has exponent 1. The two
      ANALYTIC limbs (the O(sqrt(p) log p) cap and the MARGIN identity) are
      size-independent algebra and are reported as derivations, NOT as
      measurements -- the computation checks them, it does not establish them.
      NOT CLAIMABLE UNDER ANY OUTCOME: that ordinary-F_p trapdoors are
      impossible; that the campaign's priority families are closed; any
      crypto-scale statement about a 2^40-2^56 class from a 10^7 computation
      other than through the size-independent algebra; any numeric value of
      c_test; any status change to any record.

  inputs:
    primes_exact_fixture: [11, 13, 101, 251, 1009, 10007]
    primes_trend: [1009, 10007, 100003, 1000003, 10000019]
    primes_trend_note: >-
      The largest is included only if Stage 2 completes it within the declared
      wall clock; a truncated ladder REPORTS WHAT IT COVERED and is not a
      failure. Truncation is an infrastructure outcome, never a mathematical one.
    composite_moduli_null: [12, 100, 1000, 10008]
    h0_grid: [8, 64, 256, 1024]
    c_grid: [1, 2, 256, 65536, 1048576, 16777216, 1073741824]
    weighting_conventions: [one_over_aut, unweighted, marked_point]
    class_size_readings: [full_class_H_of_4p_minus_t2, horizontal_only_h_of_O_max]
    rho_convention: sqrt(pi*N/2)
    rho_convention_variant: negation_map_divides_by_sqrt_2
    seeds: []
    seed_derivation_rule: >-
      THERE ARE NO SEEDS AND THERE IS NO RANDOMNESS. Every quantity in this
      contract is a deterministic function of the declared prime list, the
      composite list, and the two grids. A third party reproduces every number
      bit-for-bit from the inputs block alone, with no seed, no sampling, and no
      floating-point in the exact arms. This is stated explicitly because the
      template asks for a seed rule and the honest answer is that the design
      admits none -- which is a strength of the contract, not an omission.
    arithmetic_rule: >-
      Class numbers, the Kronecker sums and the composite-null sums are computed
      in exact rational arithmetic (fractions.Fraction). Floating point appears
      ONLY in the reported exponents (logarithms), the enumerability fractions,
      and the margin table, each to 6 significant figures with the exact rational
      retained in the raw artifact.
    class_number_algorithm: >-
      H(n) for n > 0, n = 0 or 3 mod 4, by enumerating reduced positive-definite
      binary quadratic forms (a, b, c) with b^2 - 4ac = -n, |b| <= a <= c, and
      b >= 0 whenever |b| = a or a = c, with Hurwitz weight 1/2 on forms (a,0,a)
      and 1/3 on forms (a,a,a), and weight 1 otherwise. H(0) = -1/12 by
      convention where it arises. The loop bound is a <= sqrt(n/3); the inner
      loop over b MUST be restricted to b of the correct parity with
      (b^2 + n) divisible by 4a, which is what makes the enumeration
      O(n^{1/2+eps}) rather than O(n) and is what makes p = 10^7 reachable. A
      naive O(n) inner loop will not finish and is an implementation defect, not
      a budget failure.

  arms_and_controls:
    treatment: >-
      For each prime in primes_trend, compute H(4p - t^2) at every integer t with
      t^2 <= 4p, and emit the full trace-indexed spectrum.
    measured_null: >-
      NULL-COMPOSITE. Run the IDENTICAL summation sum_{t^2 <= 4n} H(4n - t^2) at
      each composite n in composite_moduli_null, and compare against BOTH 2n and
      sum_{d | n} max(d, n/d). FORCED VALUE DERIVED BEFORE THE RUN: the two
      disagree at every composite; at n = 12 the divisor form gives
      12 + 6 + 4 + 4 + 6 + 12 = 44 against 2n = 24. THIS NULL CAN FAIL AND ITS
      FAILURE IS DIAGNOSTIC: if the implementation returns 2n at a composite
      modulus, the summation is not measuring the class number and the ENTIRE
      treatment table is void. [The general-n divisor form is RECALLED-UNVERIFIED
      and the run REPORTS BOTH SIDES rather than assuming either.]
    positive_control: >-
      CTRL-SUPERSINGULAR, the nearby object where the hoped-for conclusion FAILS
      and where the effect MUST appear. Count supersingular j-invariants over
      F_{p^2} at each prime in primes_trend, by TWO independent routes: the
      closed form floor(p/12) + eps with eps in {0,1,2} determined by p mod 12
      (RECALLED, re-derived in the run report), and direct enumeration of the
      roots of the supersingular polynomial over F_p at the small primes where
      that is feasible. FORCED: the two agree exactly, and
      log(count)/log(p) = 1.00 +/- 0.02. IF THE INSTRUMENT RETURNS AN EXPONENT
      NEAR 1/2 HERE IT CANNOT DISTINGUISH A p^{1/2} HIDING BUDGET FROM A p^1 ONE
      AND NO NEGATIVE FROM ANY ARM MAY BE REPORTED.
    graded_control: >-
      CTRL-LADDER, five interior points, monotonicity reported. Across the five
      primes of primes_trend, report log(median H)/log(sqrt p) and f(64, p). The
      first must INCREASE monotonically, the second must DECREASE monotonically.
      Reporting both trends localises any obstruction to a size regime instead of
      leaving "the counting did not work", and it is the arm that catches a
      finite-size artifact masquerading as an asymptotic law.
    ordering_control: >-
      NULL-COMPOSITE and CTRL-SUPERSINGULAR are computed, hashed, and their
      results committed BEFORE any treatment spectrum is read. The decision rule
      is then executed on the null first. If the rule emits the same verdict on
      NULL-COMPOSITE as on the treatment it discriminates nothing and MUST be
      rewritten before the treatment arm is looked at. Absence of the pre-commit
      hash is invalid_measurement.
    comparability_policy: >-
      No comparison to EXP-ECTD-001, EXP-ECTD-d971bc, or any other contract may
      be made inside this run's artifacts. This contract measures class sizes;
      EXP-ECTD-001 measures algebraic meters on curves; the two share no
      observable. Any cross-contract comparison requires a separately registered
      comparator naming both domains, both statistics, the expected relation, and
      the failure disposition.

  independent_variables:
    - prime p
    - trace t
    - modulus type (prime treatment vs composite null)
    - weighting convention
    - class-size reading (full class vs horizontal only)
    - c (margin table abscissa)

  metrics:
    primary:
      - kronecker_ratio_exact = [sum_{t^2<=4p} H(4p-t^2)] / (2p), as an exact rational, per prime
      - mean_ratio = mean_t H(4p-t^2) / (sqrt(p)/2), per prime
      - median_exponent = log(median_t H(4p-t^2)) / log(sqrt p), per prime
      - analytic_cap_check = max_t H(4p-t^2) / [(2/pi)(log 4p + 2) sqrt(p)], per prime
      - enumerability_fraction f(h0, p) over the 4 x 5 grid
      - supersingular_exponent = log(#ss j-invariants over F_{p^2}) / log p, per prime
      - composite_null_values against both 2n and sum_{d|n} max(d, n/d)
      - margin_table MARGIN(c) = log2(0.399 c), at the mean and at the observed maximum class size
    secondary:
      - full trace-indexed class-number spectrum per prime (raw artifact)
      - class-number distribution skew (mean/median ratio) per prime
      - weighting-convention deltas in bits
      - twist-pairing check (H(4p-t^2) = H(4p-(-t)^2), forced identical)
      - wall clock and peak RSS per prime
      - the BATCH-003 feasibility statement (expected class size and implied meter evaluations at N bit sizes 40, 48, 56)

  heuristic_under_test: HEUR-ECTD-MASS-1
  heuristic_under_test_secondary: HEUR-ECTD-MASS-2

  preregistered_prediction:
    quantity: >-
      The eight primary metrics above, each with a numeric band or an exact
      value fixed before execution.
    formula: >-
      kronecker_ratio_exact = 1 EXACTLY (exact rational, not a tolerance).
      mean_ratio = 2p / [(2*floor(2 sqrt p) + 1) * sqrt(p)/2], computed in closed
      form before the measured value is read; band [0.97, 1.03] for p >= 10^4.
      median_exponent monotone increasing across the five primes and inside
      [0.70, 1.00] at each. THE BAND IS DELIBERATELY NOT [0.90, 1.00]: a naive
      "the exponent is 1/2 so this ratio is 1" pre-registration would have been
      falsified by finite-size effects rather than by mathematics, and recording
      that near-miss is part of the deliverable.
      analytic_cap_check <= 1 at every prime.
      f(h0, p) strictly decreasing in p at fixed h0, log-log slope in [-2.0,-1.0].
      supersingular_exponent = 1.00 +/- 0.02, with the two routes agreeing exactly.
      composite_null_values differ from 2n at every composite n; at n = 12 the
      divisor form is 44 against 2n = 24.
      MARGIN(c) = log2(0.399 c): forced values -1.33, -0.33, 6.67, 14.67, 18.67,
      22.67, 28.67 bits over c_grid at the mean class size, each 2.32 bits lower
      at the observed maximum class size.
    source: >-
      H-ECTD-3dbda5 predictions G1-G8, derived in IDEA-20260805-4243e6 from the
      Dirichlet class number formula, the Kronecker-Hurwitz relation, and Tate's
      isogeny theorem -- all RECALLED, none cited to a theorem number, page,
      author or venue, and each assigned a verification stage rather than trusted.
    provenance_of_the_fixture_values: >-
      The exact-1.000000 Kronecker ratios at p = 11, 13, 101, 1009, 10007, the
      mean ratio 0.998 at p = 10007, the median exponents 0.790 / 0.846 / 0.870
      at p = 10^4 / 10^5 / 10^6, the max ratios 2.64 / 2.16 / 2.63, and
      f(64, p) = 0.500 / 0.0399 / 0.00104 WERE COMPUTED IN THE IDEATION SESSION
      OF 2026-08-05, OUTSIDE THIS HARNESS, by the reduced-form algorithm declared
      above. THEY ARE FIXTURES TO BE REPRODUCED IN-HARNESS AND ARE NOT
      MEASUREMENTS OF THIS PROGRAM. A run that reproduces them reports agreement;
      a run that does not reports the discrepancy and STOPS, because one of the
      two computations is wrong and the contract does not say which.

  scale_relevance:
    tier: toy
    justification: >-
      Class-number computation runs at p <= 10^7 against a campaign whose own N
      is 2^40-2^56. The two ANALYTIC limbs -- the unconditional cap
      H = O(sqrt(p) log p) and the identity MARGIN(c) = log2(H c / sqrt(pi N/2))
      -- are size-independent algebra, so the computation CHECKS a derivation
      rather than extrapolating a measurement, and that is the only reason a
      toy-scale run can speak about crypto-scale structure at all. THE ONE
      GENUINE EXTRAPOLATION is f(h0, p) projected to 2^40, and every artifact
      containing it must carry the word "extrapolated".
    correspondence: >-
      null. No sampling correspondence is used; the trace range is enumerated
      exhaustively at each prime.

  tail_checks:
    - id: TAIL-MASS-CAP
      check: >-
        Beyond the bulk trend, compare the SINGLE LARGEST computed class at each
        prime against the analytic cap (2/pi)(log 4p + 2) sqrt(p). The bulk
        agreeing with a law while its extreme violates the law is the signature
        of a wrong constant, and the extreme is where a cap is tested.
    - id: TAIL-MASS-SMALL
      check: >-
        Report the SMALLEST computed class at each prime and the trace at which
        it occurs, and check that it sits near the Hasse bound as the mechanism
        predicts. A small class at a trace far from +/-2 sqrt p contradicts the
        derivation and must be reported, not smoothed.
    - id: TAIL-MASS-TWIST
      check: >-
        H(4p - t^2) must equal H(4p - (-t)^2) identically for every t. A forced
        symmetry that fails is an implementation error and voids the spectrum.

  replication:
    seeds: []
    independent_instances: 5
    planned_runs:
      - id: RUN-ECTD-45290a-fixture
        purpose: >-
          Stages 0 and 1 plus the exact Kronecker fixture and the composite null.
          This run alone can terminate the line.
      - id: RUN-ECTD-45290a-census
        purpose: >-
          Stages 2 and 3: the full trend ladder, the supersingular control, the
          enumerability grid, and the margin table.
    interpretation: >-
      Determinism replaces replication here: there is no randomness, so two runs
      of the same code on the same inputs must agree bit-for-bit, and a
      disagreement is an infrastructure fault. The five "independent instances"
      are the five primes of the ladder, which are independent arithmetic
      objects, not repeated draws.

  stages:
    - id: S0
      name: source reading
      cost: zero compute, ~1 hour
      can_terminate: true
      description: >-
        Open the local Teske PDF recorded in KN-LIT-7261 and the local Galbraith
        PDF recorded in KN-LIT-7630, and record VERBATIM whether either addresses
        exhaustive isogeny-class search as an attack on a trapdoor. NOTHING ABOUT
        THEIR CONTENTS IS ASSERTED ANYWHERE IN THIS CONTRACT BEFORE THIS STAGE
        RUNS. If Teske's own analysis addresses class enumeration, its answer is
        the design principle the campaign needs and the run reports it verbatim;
        if it does not, that is a finding about the campaign's exemplar. BOTH
        OUTCOMES ARE USEFUL AND BOTH ARE PRE-REGISTERED. If the PDFs cannot be
        opened, that is an infrastructure signal recorded as such, and the rest
        of the contract proceeds unaffected because no stage depends on them.
    - id: S1
      name: derivation review
      cost: zero compute, ~1 hour
      can_terminate: true
      description: >-
        Write out H-ECTD-3dbda5's limbs L1-L3 in full and hand them to an
        independent reviewer with two specific instructions: attack the claim
        that the class walk needs no separate path-recovery stage, and attack
        HEUR-ECTD-MASS-2's multi-level traversal. A successful attack on either
        terminates or rescopes the line BEFORE any compute is spent, which is the
        cheapest decisive gate in the contract.
    - id: S2
      name: exact fixture and null
      cost: seconds to minutes
      can_terminate: true
      description: >-
        Kronecker ratio at the fixture primes in exact rational arithmetic; the
        composite-modulus null; the twist symmetry check. A failure here is an
        INSTRUMENT FAILURE and the run stops with no mathematical content.
    - id: S3
      name: census and controls
      cost: minutes
      can_terminate: false
      description: >-
        Full trace spectra at the trend primes; median exponent; analytic cap
        check; enumerability grid; supersingular positive control by both routes.
    - id: S4
      name: margin table and feasibility statement
      cost: zero compute
      can_terminate: false
      description: >-
        MARGIN(c) over c_grid under both class-size readings and both traversal
        readings; the BATCH-003 feasibility statement; the explicit restatement
        of the public-recognizability condition that limits every conclusion.
  stage_order_rationale: >-
    Cheapest decisive gate first, as the generation contract requires. S1 costs
    nothing and can end the whole line; S2 costs seconds and can void the
    instrument. No expensive stage runs before a cheap one that could have
    terminated it.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 3
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_total_disk_bytes: 536870912
    no_network: false
    no_network_note: >-
      Network is not required by any stage. S0 reads LOCAL PDFs already recorded
      in the corpus. If those files are absent, S0 reports an infrastructure
      signal; it does not fetch, and it does not block the other stages.

  stopping_rules:
    - Do not execute while status is review_required, frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Stop before S3 if the composite-modulus null has not been computed, hashed and committed.
    - Stop and report instrument_void if the Kronecker fixture is not exactly 1 at every fixture prime.
    - Stop and report instrument_void if the supersingular positive control does not return exponent 1.00 +/- 0.02.
    - Stop the trend ladder at the declared wall clock; a truncated ladder REPORTS WHAT IT COVERED and is never a homogeneity, barrier, or negative claim.
    - Stop if the twist symmetry check fails at any trace.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Missing pre-commit hash for the null and positive-control arms (the ordering control).
    - Any use of floating point inside the Kronecker fixture or the composite null.
    - Any numeric value assigned to c_test or c_step anywhere in the artifacts.
    - Any cross-contract comparison to EXP-ECTD-001 or EXP-ECTD-d971bc without a separately registered comparator.
    - Any output artifact that states a conclusion without the public-recognizability condition attached.

  infrastructure_failure_disposition: >-
    A timeout, a crash, an out-of-memory, an unreadable PDF, or a missing
    dependency is reported as an INFRASTRUCTURE SIGNAL with the exact failing
    command and resource state, and is NEVER negative mathematical evidence
    against H-ECTD-3dbda5 or against any ECTD hypothesis (AGENTS.md rule 5). In
    particular: if the reduced-form enumeration does not reach p = 10^7 within
    the wall clock, the run reports the ladder it completed. That is a budget
    outcome. It is not a statement that the median exponent fails to converge,
    and any report that reads it that way is invalid.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is: the Kronecker fixture exact at every
    fixture prime; the composite null differing from 2n at every composite; the
    supersingular control at exponent 1.00 +/- 0.02 by two agreeing routes; the
    trend ladder completed to at least four primes with the median exponent
    monotone increasing inside [0.70, 1.00] and f(64, p) monotone decreasing; the
    analytic cap unviolated; and the margin table plus the BATCH-003 feasibility
    statement emitted under both class-size and both traversal readings, each
    carrying the public-recognizability condition. THAT DISPOSITION ESTABLISHES
    NO ECDLP ATTACK, NO EXPONENT, NO CRYPTO-SCALE CLAIM, NO TRAPDOOR
    IMPOSSIBILITY, AND NO STATUS CHANGE TO ANY RECORD.

  falsification_criterion: >-
    Any of H-ECTD-3dbda5's F1-F6. In particular: an exhibited design whose
    endpoint weakness is not publicly recognizable voids limb L3 for that design
    (F1, and the most likely and most useful outcome); a median exponent that
    decreases or leaves [0.70, 1.00] falsifies limb L2 at tested scale WHILE
    LEAVING THE UNCONDITIONAL CAP L1 INTACT; an f(64, p) that does not decrease
    voids the BATCH-003 feasibility consequence and the queued screen proceeds as
    frozen.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no mathematical inference.
    future_valid_census: >-
      Only after separate approval, freezing, authorization and a valid
      execution. Scoped toy-tier for every measured number, derivation-tier for
      the two analytic limbs, and never a trapdoor-impossibility claim.
    instrument_void: >-
      Kronecker fixture, supersingular control, or twist symmetry fails. No
      mathematical negative on H-ECTD-3dbda5 or on any ECTD hypothesis.
    infrastructure_or_integrity_failure: >-
      Inconclusive infrastructure signal, never evidence against any proposition
      (AGENTS.md rule 5).

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - Exact command, driver version, git commit and dirty-tree state, environment.json.
    - Verbatim S0 record of what the Teske and Galbraith PDFs do and do not say about class enumeration, or the infrastructure signal if they could not be opened.
    - Independent reviewer's S1 report on limbs L1-L3 and on HEUR-ECTD-MASS-2.
    - Pre-commit hash of the null and positive-control results, timestamped before the treatment arm.
    - Machine-readable trace-indexed class-number spectra, one file per prime, with exact rationals.
    - The eight primary metric tables, the three tail checks, and the margin table under both readings.
    - The BATCH-003 feasibility statement, in a form the Coordinator can act on.
    - Wall clock, peak RSS, stdout, stderr, and an execution report naming which stages completed and which were truncated.

  assigned_to: executor
  approved_by: null

  review_notes:
    - >-
      Reviewers are asked to attack, in this order: (1) the claim that a class
      walk retains its own path and therefore needs no separate path-recovery
      stage -- this is the load-bearing structural step and it is the one a
      referee should break first; (2) HEUR-ECTD-MASS-2's multi-level traversal,
      whose failure would replace H by h(O_max) and change the constant but not
      the exponent; (3) the recalled analytic constant in HEUR-ECTD-MASS-1;
      (4) whether the public-recognizability condition is stated prominently
      enough that no downstream citation can drop it.
    - >-
      This contract deliberately spends under one percent of GOAL-ECTD-001's
      remaining campaign budget and produces an answer to a completion-criterion
      limb that currently has no number anywhere in the campaign. If a reviewer
      judges the S1 derivation review sufficient on its own, S2-S4 may be
      declined and the pen-and-paper result recorded as such -- that would be the
      cheapest acceptable outcome and it is pre-registered as acceptable.
