experiment:
  id: EXP-EQLA-2f2cca
  hypothesis_id: H-EQLA-37b3e2
  derived_from_idea: IDEA-20260807-0e4d83
  question_id: RQ-EQLA-0d3f40
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Informative rank versus ambient rank on a phi-stable factor base - measured informative_gain and
    raw_gain against a frozen size-27 regression fixture, a matched random sigma-closed null, a
    wrong-folding-weight decay sweep, a planted positive, and the relations-needed comparison against
    a size-matched generic factor base
  objective: >-
    The one uncertainty a run reduces is whether the progress metric this lane has been reporting
    measures the object that determines the factor-base logarithms. A run establishes (i) whether
    the instrument is comparable with the lane's committed prior runs, by requiring exact
    reproduction of five committed integers at factor-base size 27 - a hard gate; (ii) informative
    gain, the rank contributed by phi-shifted rows to the folded system, predicted exactly 0, and
    raw_gain, the rank those same rows contribute to the ambient system, predicted about twice the
    base-row count, which is the exact size of the rank illusion; (iii) whether the instrument can
    detect genuine new information, by requiring a planted positive to report a nonzero informative
    gain, and whether the statistic responds to the parameter that must move it, by requiring a
    monotone decay under a wrong folding weight; and (iv) the number of base relations needed for
    the folded matrix to reach full rank, against the same quantity for a size-matched generic factor
    base, which tests the one heuristic in the design.
    No attack, speedup or security consequence is claimed here or would follow from a run. No
    exponent moves and none is claimed; the linear-algebra stage is a small percentage of the charged
    total cost in this program's own prior measurements, and every number here is read against that
    ceiling.
  what_this_is_not:
    - >-
      Not an attack, a speedup, or a cryptanalytic result of any kind. It is a measurement contract
      about what a progress statistic measures.
    - >-
      Not a re-litigation of the lane's displacement-rank statistic. This contract does not assert
      that statistic is an artifact, does not restore it, and does not recompute it as a claim; it
      introduces a different metric whose meaning is derived before it is measured.
    - >-
      Not a claim about relation-collection cost, relation density, or arity. Those are named as the
      dominant cost and are explicitly out of scope.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed toy field sizes and factor-base sizes, on curves of
      j-invariant 0 with complete phi-orbit factor bases, phi-shifted relation rows contributed the
      measured informative gain (predicted exactly 0) and the measured raw gain to the two systems,
      the instrument demonstrably could have detected new information because the planted positive
      showed it, and the relations-needed ratio against a size-matched generic base took the reported
      value. WHAT DOES NOT FOLLOW - nothing about the ECDLP's cost; nothing about relation-collection
      cost or density; nothing at crypto scale; no exponent claim of any kind; and specifically NOT
      that a factor-three saving in relations or a factor-nine saving in linear-algebra operations
      constitutes an attack improvement, since the stage it applies to is a small percentage of the
      charged total.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): archive the derivation of the row-redundancy identity and
      the folding identity, together with the statement that the folding map IS the isotypic
      projection onto the lambda-eigenspace of the sigma-action expressed in orbit-representative
      coordinates. Nothing is measured before this exists as a committed artifact. This is the exact
      gap the lane recorded previously, where a derivation lived only inside review reports.
      STAGE 1 (minutes, HARD GATE): on the frozen size-27 fixture from the lane's committed prior
      experiment, reproduce the five committed integers exactly with the new driver, before any folded
      quantity is computed. Exact integer comparison. A mismatch is an instrument-comparability
      failure and halts the line; it is not a finding.
      STAGE 2 (minutes): compute lambda by solving the quadratic modulo N; verify lambda cubed is 1,
      lambda is not 1, and 1 plus lambda plus lambda squared is 0 modulo N; pin WHICH root by
      checking phi of the first factor-base element equals the element at sigma of 1 and that lambda
      times its logarithm equals the shifted logarithm for that one known pair; build sigma; assert
      sigma cubed is the identity and that sigma has exactly one third of the factor-base size many
      orbits, all of length 3.
      STAGE 3 (minutes, THE MEASUREMENT): harvest base relation rows WITH right-hand sides. Build
      four matrices - the base matrix, the sigma-closed matrix formed by adding each base row's two
      shifts, and the folded versions of both. Report the four ranks and the two differences,
      raw_gain and informative_gain, per cell.
      STAGE 4 (minutes): the nulls, all on the identical pipeline. NULL-1, a matched random
      sigma-closed 0/1 matrix with the same dimensions, row-weight distribution and column-orbit
      partition. NULL-2, refolding with a weight whose cube is not 1, swept over at least five values
      of the correct-fold fraction from 0 to 1. NULL-3, a planted positive - a sigma-closed matrix
      whose rows have sigma-symmetric support but are genuinely independent rather than shifts of one
      another.
      STAGE 5 (minutes): the rank-arrival curve of the folded matrix against the number of base rows
      harvested, and the relations-needed comparison against a size-matched generic factor base of
      the same size on the same curve at the same arity and harvest budget. Report matched baseline
      group-operation counts on the same instances for the Pareto row.
    instrument: >-
      Python with numpy and exact modular linear algebra over the field of N elements; the toy
      instance generator and the decomposition search are the committed lane harness, with a DRIVER
      CHANGE to record the target's coefficient as a right-hand side, declared here because the
      committed harness is recorded as building bare incidence vectors and assembling no linear
      system. The fold is applied ONCE, before any solve. Every factor base and final row list is
      content-hashed per cell. Recorded through the program's run wrapper with a manifest.
    parameters: >-
      Toy prime-field curves of j-invariant 0 at roughly 12 to 32 field bits; at least three
      factor-base sizes spanning an order of magnitude, each divisible by 3, the smallest being the
      frozen 27 fixture; number of base rows harvested per cell declared before Stage 3; correct-fold
      fraction over {0, 0.25, 0.5, 0.75, 1}; size-matched generic factor base of the same size on the
      same curve; 3 seeds per cell. Every instance records N, its primality check, lambda, lambda's
      multiplicative order, and the sigma orbit-length histogram.
  controls:
    - >-
      FROZEN SIZE-27 REGRESSION FIXTURE, blocking - the new driver must reproduce the five committed
      integers of the lane's prior committed run exactly before any folded quantity is reported. An
      instrument that cannot reproduce the lane's own numbers is not comparable with them.
    - >-
      NULL-1, MATCHED RANDOM SIGMA-CLOSED MATRIX - same dimensions, same row-weight distribution,
      same column-orbit partition, closed under sigma. PREDICTED to show the SAME informative gain of
      exactly 0. This is NOT a falsification; the identity quantifies over all rows, so the collapse
      must appear on the null, and the fact that it does establishes that the signature is a property
      of the OPERATOR and carries no elliptic-curve content. Reporting the collapse as a
      curve-specific finding without this null on record is prohibited.
    - >-
      NULL-2, WRONG FOLDING WEIGHT, blocking and load-bearing - refold with a weight whose cube is
      not 1, swept over at least five values of the correct-fold fraction. informative gain must decay
      MONOTONICALLY from roughly twice the base-row count at fraction 0 to exactly 0 at fraction 1,
      approximately linearly in the number of correctly folded orbits. A statistic that stays flat as
      the fraction rises is the canonical artifact tell and voids the measurement.
    - >-
      NULL-3, PLANTED POSITIVE, blocking - a synthetic sigma-closed matrix whose rows are
      deliberately NOT shifts of one another, merely having sigma-symmetric support. The instrument
      must report informative gain strictly greater than 0 there, or it cannot detect genuine new
      information and every zero it reports is void.
    - >-
      SIZE-MATCHED GENERIC FACTOR BASE - the same size on the same curve, same arity, same harvest
      budget. This is the only comparison that isolates the phi structure from factor-base size.
    - >-
      COMPLETE-ORBIT ASSERTION - factor-base size is forced divisible by 3 by construction and
      complete-orbit membership is ASSERTED per instance, so the truncating slice documented in the
      committed harness is never entered and the instance set is not silently filtered.
    - >-
      LAMBDA-ROOT PINNING - the quadratic has two roots and folding with the wrong one projects onto
      the other eigenspace, producing a spurious nonzero informative gain. The correct root is pinned
      by one known factor-base pair, at the cost of a single brute-force logarithm per curve, and
      only one is ever needed.
    - >-
      MATCHED BASELINE ROW - matched Pollard rho with negation and matched baseline group-operation
      counts and memory on the same instances, reported even though no attack is claimed, so the
      dominance statement is checked rather than asserted.
  independent_variables:
    - factor-base size, at least three values spanning an order of magnitude, each divisible by 3
    - number of base relation rows harvested
    - 'matrix arm: base / sigma-closed / folded base / folded sigma-closed'
    - 'null arm: curve / matched random / wrong folding weight / planted positive'
    - correct-fold fraction, over five values from 0 to 1
    - 'factor base type: phi-stable versus size-matched generic'
  metrics:
    primary:
      - name: informative_gain
        units: dimensionless exact integer rank difference
        computed: >-
          Rank over the field of N elements of the folded sigma-closed matrix minus the rank of the
          folded base matrix, per cell. Predicted EXACTLY 0 on the curve arm and on the matched random
          null. Reported as an integer per cell, never averaged.
      - name: raw_gain
        units: dimensionless exact integer rank difference
        computed: >-
          Rank of the ambient sigma-closed matrix minus the rank of the ambient base matrix, per cell.
          Predicted at least one and a half times the number of base rows, expected about twice. This
          is the exact size of the rank illusion that unfolded metrics report.
      - name: null2_decay_curve
        units: informative gain (dimensionless integer) at each of five correct-fold fractions
        computed: >-
          informative gain recomputed with a wrong folding weight at each correct-fold fraction, with
          a monotonicity flag computed as whether the sequence is non-increasing in the fraction.
      - name: null3_planted_positive_gain
        units: dimensionless exact integer
        computed: >-
          informative gain on the planted-positive matrix. Required strictly greater than 0; a zero
          voids every zero the instrument reported.
      - name: relations_needed_ratio
        units: dimensionless ratio of two exact integers
        computed: >-
          Number of base rows at which the folded matrix first attains full rank on the phi-stable
          base, divided by the number at which the size-matched generic base first attains full rank,
          on the same curve at the same arity and harvest budget. Predicted about one third; a value
          above 0.5 refutes HEUR-L5-2.
      - name: fixture_reproduction
        units: 'categorical: exact_match / mismatch, with the five integers side by side'
        computed: >-
          Exact integer comparison of the five committed fields on the size-27 fixture. Required
          exact_match.
    secondary:
      - name: four_ranks_per_cell
        units: four dimensionless exact integers
        computed: Ranks of the base, sigma-closed, folded base and folded sigma-closed matrices, per cell.
      - name: rank_arrival_curve
        units: folded rank as a function of base-row count, both dimensionless integers
        computed: Folded rank recomputed after each additional harvested base row, per cell.
      - name: lambda_and_orbit_receipt
        units: >-
          lambda as a residue, its multiplicative order as an integer, and the sigma orbit-length
          histogram
        computed: >-
          Recorded per instance, with lambda cubed, lambda not 1, and the quadratic identity all
          verified, and the root pinned by the known pair.
      - name: content_hashes
        units: sha256 per factor base and per final row list
        computed: >-
          Hash of the factor base and of the final row list per cell, so a later run can be compared
          exactly and the unresolved provenance gap the lane recorded is closed at zero cost.
      - name: matched_baseline_operations
        units: group operations and bytes of memory
        computed: >-
          Matched Pollard rho with negation and matched baseline counts on the same instances,
          reported for the Pareto row.
      - name: instances_excluded
        units: exact integer with reason codes
        computed: >-
          Instances excluded because N is not prime, lambda's order is not 3, or the factor base is
          not a union of complete orbits, with per-reason counts.
  heuristic_under_test:
    id: HEUR-L5-2
    formal_statement: >-
      The number of base relations required for the folded matrix to reach full rank, namely one
      third of the factor-base size, exceeds that dimension by only a constant - i.e. harvested
      relations behave, after folding, like uniformly random vectors of their weight in the folded
      space.
    rigorous_side: >-
      IMITATES the classical statement that a random sparse matrix over a finite field with row
      weight at least 3 attains full rank after n plus a constant rows with probability bounded away
      from zero, with the rank-defect distribution's mass at zero given by the standard infinite
      product. It is NOT a theorem here - relation rows are supports of decompositions, not uniform
      vectors.
    validation_route: >-
      Measure the excess directly at every factor-base size, phi arm against size-matched generic
      arm, and report the excess as a function of size. Predicted distribution is the finite-field
      random-matrix rank-defect law; tail check is the largest single-instance excess. TOY SCALE ONLY
      and labelled so.
  preregistered_prediction:
    quantity: >-
      The tuple (informative_gain, raw_gain, null2_decay_curve, null3_planted_positive_gain,
      relations_needed_ratio).
    formula: >-
      informative_gain = 0 EXACTLY at every cell, on every instance, at every factor-base size, for
      both the curve arm and the matched random null. raw_gain at least 1.5 times the number of base
      rows, expected about 2 times. null2_decay_curve monotone decreasing in the correct-fold
      fraction, from at least 1.5 times the base-row count at fraction 0 to exactly 0 at fraction 1,
      with at least three interior values measured. null3_planted_positive_gain strictly greater
      than 0. relations_needed_ratio about one third; any value above 0.5 refutes HEUR-L5-2.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-0e4d83 (predictions block) before any run
      under this contract exists. Never tuned to data; a run that reports a different quantity
      reports a different experiment.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at roughly 12 to 32 field bits with factor-base sizes from 27 upward. That is adequate
      for the rank identity, whose value at toy scale is the value the algebra gives, but it is NOT
      adequate for the relations-needed comparison, whose resolution is poor at the smallest size -
      at size 27 the folded matrix is 9 by 9 and a rank statement has almost no resolution. The
      contract therefore requires at least three sizes spanning an order of magnitude before any
      trend in relations_needed_ratio is reported, and any statement about that ratio is scoped to
      the sizes actually measured. Nothing transfers to a standardized parameter set.
    correspondence: null
  tail_checks:
    - >-
      Report the largest single-instance excess of relations needed over the folded dimension, not
      only the mean, since HEUR-L5-2 is a statement whose failure would show first in the tail.
    - >-
      Report the full rank-arrival curve rather than only the endpoint, so a curve that plateaus
      short of full rank is visible.
    - >-
      Report every cell where the smallest factor-base size is used separately, and refuse to include
      it in any trend statement, since a 9 by 9 folded matrix has almost no rank resolution.
    - >-
      Report the number of excluded instances with reasons, since silent exclusion turns a filtered
      instance set into an apparent universal.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Any cell reporting a nonzero informative gain on the curve arm must be replicated with the
      three per-instance checks (N prime, lambda of order 3, complete orbits) re-verified before it
      is reported as anything other than a bug locator.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
    - Do not measure anything before the Stage 0 derivation is archived as a committed artifact.
    - Halt if the size-27 fixture does not reproduce the five committed integers exactly; report the two integer tuples side by side and nothing else.
    - Halt if lambda's multiplicative order is not 3 or sigma cubed is not the identity on an instance; exclude the instance and record the exclusion.
    - >-
      Stop at the declared sweep - three factor-base sizes, three seeds, five correct-fold fractions.
      The declared base-row count per cell is frozen before Stage 3.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose null arms were not executed in the SAME invocation and on the SAME pipeline as the
      curve arm is invalid_measurement - the calibration was not established on the pipeline that
      produced the numbers.
    - >-
      A run in which relation rows carry no right-hand side is invalid_measurement, because the
      reported rank is then the rank of an incidence matrix and not of the linear system the claim is
      about.
    - >-
      A run in which the factor base is not verified to be a union of complete phi-orbits is
      invalid for that cell.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) fixture_reproduction = exact_match on the size-27 fixture; (2) the per-instance checks pass
    and the lambda root is pinned by the known pair; (3) null3_planted_positive_gain is strictly
    greater than 0; (4) null2_decay_curve is monotone in the correct-fold fraction and reaches
    exactly 0 at fraction 1; (5) informative_gain and raw_gain are reported as exact integers at
    every cell for both the curve arm and the matched random null; and (6) relations_needed_ratio is
    reported for at least three factor-base sizes, with the smallest size excluded from any trend
    statement.
    Note that (5) and (6) are satisfied by REPORTING the integers. Whether informative_gain is zero,
    and whether the ratio is near one third, are the findings.
  falsification_criterion:
    - >-
      informative_gain is nonzero at any cell whose three per-instance checks all pass - the identity
      is FALSE AS IMPLEMENTED. The three named bug-locator causes (factor-base truncation, wrong
      root, inconsistent lift) are checked in order, and only if none explains it is the record
      superseded rather than amended.
    - >-
      raw_gain is near zero as well - the appended rows are duplicates rather than shifts, the
      collection rule is the object being measured, and nothing about phi is established in either
      direction.
    - >-
      null3_planted_positive_gain equals 0 - the instrument cannot detect new information; every zero
      it produced is void and the run set is INVALID, not negative.
    - >-
      null2_decay_curve is flat in the correct-fold fraction - canonical artifact tell; the
      measurement is void.
    - >-
      fixture_reproduction = mismatch - instrument incomparability; halt and report as an
      INFRASTRUCTURE outcome under AGENTS.md rule 5, never as mathematical evidence.
    - >-
      relations_needed_ratio exceeds 0.5 at the sizes with adequate resolution - HEUR-L5-2 has FAILED,
      the predicted factor-three saving in relations is not realised, and the finding is about
      relation COLLECTION rather than about the rank identity. Reported as a refutation of the third
      claim, not softened.
  required_artifacts:
    - the Stage 0 derivation of the row-redundancy and folding identities, archived before any measurement
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - raw-result.json carrying the four ranks, raw_gain and informative_gain per cell, plus the full rank-arrival curve
    - the null arms' measurements (matched random, wrong-weight sweep, planted positive) in the same file as the curve arm
    - the size-27 fixture comparison with both integer tuples side by side
    - lambda, its multiplicative order, the root-pinning check, and the sigma orbit-length histogram per instance
    - sha256 of the factor base and of the final row list per cell
    - matched baseline group-operation and memory counts on the same instances
    - the excluded-instance list with reason codes
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The parent proposal is PROOF-ORIENTED and carries a proof_search_map. Per KN-TECH-080 and the
      Coordinator's proof-oriented dispatch gate, that map must be audited before implementation -
      in particular its baseline embedding (the size-27 fixture), its observation collision (the
      curve arm and the matched random null both giving 0, which calibrates rather than falsifies),
      its quantifier order, and its nearby-object control (a group action that is not scalar on the
      subgroup, where the method must be silent).
    - >-
      The Stage 0 derivation must be archived as a committed artifact BEFORE any measurement. This is
      the exact gap the lane recorded previously and it is a precondition, not a formality.
    - >-
      The driver change that records the target's coefficient as a right-hand side must be reviewed
      before Stage 3, because without it every reported rank is the rank of the wrong object.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-0e4d83
    authored_at: '2026-08-25'
    note: >-
      Metrics, nulls, gates, predicted values and the interpretation ceiling are transcribed from the
      parent proposal's claim, mechanism, predictions, minimal_test, null_object_control and
      interpretation_limits blocks, and HEUR-L5-2 is its heuristic_assumptions entry restated with
      its quantifiers. Budgets come from the parent's declared estimated_cost (implementation low,
      compute low) through the program's cost table. The exact committed integers of the size-27
      fixture are deliberately NOT transcribed here - the contract requires the Executor to read them
      from the committed run records, because copying them into a contract from a proposal would put
      a recalled number in the position of a gate.
  derivation_gaps:
    - >-
      The five committed fields of the size-27 fixture are named by the parent proposal but are not
      written into this contract; the Executor must read them from the committed run records and the
      Coordinator must confirm they were read from there. A gate whose target came from prose is not
      a gate.
    - >-
      The declared base-row count per cell is not fixed here. It must be frozen before Stage 3,
      because raw_gain's prediction is stated as a multiple of it and choosing it afterwards would
      make that prediction unfalsifiable.
    - >-
      The exact definition of "full rank" for the rank-arrival curve on the generic arm is ambiguous
      when the generic factor base has a different unknown count. The contract compares folded
      dimension to ambient dimension, and that convention must be confirmed before Stage 5 since the
      predicted one-third ratio depends on it.
    - >-
      The matched random null's row-weight distribution must be matched to the harvested rows'
      empirical distribution, not to a nominal one. How that matching is performed must be fixed
      before Stage 4, since a mismatched null would collapse for the wrong reason.
