experiment:
  id: EXP-ICEX-367f10
  hypothesis_id: H-ICEX-a82385
  derived_from_idea: IDEA-20260731-013
  question_id: RQ-ECDLP-002
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    MEASURE THE MULTI-TARGET SHARING EXPONENT AGAINST A CURVE-FREE NULL, WITH THE
    REPLICATION COUNT SET BY A PRE-RUN POWER COMPUTATION SO THE 0.05 BAND CAN
    ACTUALLY BE CROSSED- three constructions over one shared instance set and one
    shared operation counter, a planted tag-corruption defect that must fire at
    exactly one unresolved target, a negation calibration that must resolve a
    known 12.8 percent constant, a derived sqrt(T) memory prediction rather than a
    floor of 2, and a pre-stated consequence if the curve-free arm matches
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. This ledger multi-target baseline entry reads
    UNVERIFIED- the shared distinguished-point table is credited with about
    sqrt(T*N) total operations and no record measures it. Every multi-target
    amortisation comparison in the ledger is judged against that unmeasured line,
    and a wrong exponent or constant invalidates those comparisons symmetrically
    in both directions.
    (B) WHAT IS BUILT. Three arms over ONE instance set, ONE operation counter and
    ONE storage counter- (A) T independent rho walks with negation
    canonicalisation; (B) one shared distinguished-point table with a per-step tag
    test against all T targets; (NULL) a random function on an N-element state set
    with the identical DP rule and tag semantics and NO group law in the code
    path. Plus a planted tag-corruption defect, a negation calibration, a 4x theta
    sweep and a matched single-target BSGS sanity row.
    (C) THE BAND PROBLEM THIS CONTRACT FIXES, STATED BEFORE THE DESIGN. The source
    proposal pre-registers |gamma_EC - gamma_null| at most 0.05 as agreement and
    above 0.15 as a signal, and specifies NO replication count. With one instance
    per cell the residual spread of log2(total) for a birthday process is of order
    1, so a log-log fit over 10 T-values (standard deviation of log2 T about 2.87)
    has a standard error on gamma of roughly 1.0/(sqrt(10)*2.87) = 0.11 and the
    gap has standard error about 0.16. THE 0.05 BAND WOULD THEN BE CROSSED BY
    CHANCE UNDER THE NULL ABOUT HALF THE TIME AND THE 0.15 SIGNAL THRESHOLD WOULD
    FIRE SPURIOUSLY AT ABOUT 6 PERCENT. The discriminator could not fire cleanly
    in either direction. THE FIX IS TO SET THE REPLICATION COUNT TO THE BAND, NOT
    THE BAND TO THE DATA- stage 0 measures the per-instance spread sigma at one
    pilot cell and the contract then FIXES R at the value that puts the gap
    standard error at or below 0.0167, so that 0.05 is 3 sigma and 0.15 is 9
    sigma. The bands 0.05 and 0.15 are FROZEN HERE and are never re-tuned.
    (D) THE MEMORY PREDICTION THIS CONTRACT CORRECTS. The source predicts a memory
    reduction factor of at least 2 at T = 64. The derived value is sqrt(T) = 8-
    T independent DP tables store about T*theta*sqrt(N) entries while a shared
    table stores about theta*sqrt(T*N). A floor of 2 is overshot fourfold by the
    prediction it is meant to test and cannot discriminate. This contract
    pre-registers sqrt(T) with a factor-2 tolerance in each direction, falsifiable
    in both.
    (E) WHAT IS NOT DECIDED. RQ-ECDLP-002 in either direction; any single-target
    exponent; any crypto-scale constant; anything about parallelisation over
    processors, which is a different axis.
  inputs:
    cost_unit: >-
      ONE CHARGED OPERATION IS ONE GROUP OPERATION. A per-step tag test is charged
      at ONE GROUP ADDITION PER TARGET PER STEP on every arm including the
      curve-free arm, so the accounting is identical across arms. MEMORY IS
      COUNTED IN STORED TABLE ENTRIES and separately in BITS with the entry width
      declared before the run. TIME IS NEVER DIVIDED BY MEMORY AND MEMORY IS NEVER
      ADDED TO TIME- the P4 memory ratio has stored bits on both sides and carries
      no time term.
    unit_discipline: >-
      BINDING. Every reported value carries a tag in {group_ops, stored_entries,
      bits, seconds, dimensionless}. The harness refuses cross-tag arithmetic
      without a named recorded conversion. Wall-clock seconds are recorded for
      budget accounting ONLY and never enter any fit, ratio or comparison- the
      exponent gamma is fitted on GROUP OPERATIONS.
    frozen_before_execution: >-
      The step function, the DP predicate and the DP probability theta, the tag
      test, the negation-canonicalisation rule, the seed list, the fit-quality
      rule (R-squared at least 0.95), the cell-exclusion rule (tag-test share
      above 0.5 excludes a cell from the fit), and the bands 0.05 and 0.15. None
      of these may be changed after any cell runs; a change is a versioned
      protocol_amendment and a new contract version.
    curve_free_null_definition: >-
      A random function f on the state set {0..N-1}, realised as a keyed hash of
      the state with the key drawn from the declared seed, iterated to produce a
      point stream. The DP predicate, the tag set, the tag-test charge and the
      resolution accounting are the SAME OBJECTS as on the elliptic arm. NO GROUP
      LAW, NO CURVE EQUATION AND NO FIELD ARITHMETIC APPEARS IN THIS CODE PATH,
      and the run record must show that by naming the shared and the disjoint
      modules.
    procedure: >-
      STAGE 0 (pilot, blocking, low compute). At the single cell N = 2^20,
      T = 64, run construction (B) for 200 independent instances and MEASURE
      sigma, the standard deviation of log2(total charged operations). Then FIX
      the replication count R for every cell as the smallest integer at least 20
      satisfying sigma / (sqrt(R * 10) * 2.87 * sqrt(2)) <= 0.0167, i.e.
      R >= (sigma / 0.0167)^2 / (10 * 2.87^2 * 2) rounded up. RECORD R IN THE RUN
      MANIFEST BEFORE ANY MAIN CELL RUNS. If the required R exceeds the budget,
      the contract reduces the T-grid rather than widening the band, and records
      that it did.
      STAGE 1 (calibration, blocking). Negation calibration- at N = 2^20 run at
      least 550 single-target rho instances with and without negation
      canonicalisation and require the cost ratio 1.128 within 0.05. Planted
      defect- at N = 2^16, T = 16, corrupt exactly one target tag to a wrong
      multiple and require exactly 1 unresolved and 15 resolved. Either failure
      HALTS and the run is INVALID.
      STAGE 2 (main). For every (construction, N, T) cell with N in
      {2^16, 2^20, 2^24} and T in {1,2,4,8,16,32,64,128,256,512}, run R
      independent instances on IDENTICAL instances and seeds across constructions
      (A), (B) and NULL. Record total charged group operations, stored entries,
      stored bits, per-target resolution order, and the tag-test cost share.
      STAGE 3 (theta sweep). At N = 2^20 only, repeat construction (B) and NULL
      with theta multiplied by 4 and by 1/4, and refit gamma.
      STAGE 4 (fits and report). Fit gamma and c by log-log regression of CELL
      MEAN total operations against T at each N, per construction, with intervals
      and R-squared. Report the gap |gamma_EC - gamma_null| per N with its
      standard error. Report c(T,N) and its trend slope with interval. Report the
      P4 memory ratio against the derived sqrt(T). Report the matched
      single-target BSGS row with its memory, never merged into the rho baseline.
    mechanism: >-
      STEP 1. One walk engine parameterised by (step function, DP rule, tag test),
      one operation counter, one storage counter, one seed list. Arms differ only
      in the step function and in whether a group law exists at all.
      STEP 2. Construction (B) maintains a single table keyed by distinguished
      point; each stored entry records the walk coefficients needed to resolve a
      collision. A collision against a stored entry carrying a different target
      tag resolves that target; resolution is verified by an independent
      recomputation of the recovered scalar against the target, and an unverified
      resolution is a FAILURE and not a resolution.
      STEP 3. Construction (A) runs T independent walks with negation
      canonicalisation and no shared state; its DP-table memory comparator is a
      THIRD configuration - T independent DP-table rho runs at the same theta -
      built explicitly for the P4 ratio and named on every memory row.
      STEP 4. The curve-free arm replaces only the state set and the step
      function. Every counter, DP rule, tag test, stopping rule and reporting path
      is the shared object.
      STEP 5. Every row is reported as (arm, N, T, theta, seed, charged group
      operations, stored entries, stored bits, tag-test share, resolution order,
      wall seconds), never as a scalar.
    instrument: >-
      Pure Python with explicit counters, or a compiled kernel with the identical
      counter semantics recorded in the manifest. The largest object is the shared
      DP table at N = 2^24 with theta chosen so the expected table size stays
      below 2^22 entries; at 128 bits per entry that is under 64 MB, well inside
      the memory cap. NO GROEBNER BASIS AND NO MACAULAY MATRIX IS BUILT.
  controls:
    - >-
      CONTROL 1, CURVE-FREE NULL (blocking, and the point of the experiment). A
      random function on an N-element state set with the identical DP rule and tag
      semantics. PRE-STATED CONSEQUENCE, FROZEN HERE- if the null reproduces gamma
      to within 0.05 and c within the same interval, then the sharing gain is a
      birthday phenomenon in a random function on N states, and NO RESULT OF THIS
      EXPERIMENT MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP.
      That consequence is not renegotiable after the data.
    - >-
      CONTROL 2, INDEPENDENT-RUNS REFERENCE (blocking). Construction (A) on
      identical instances and seeds, supplying the gamma near 1.0 reference line.
      If (A) does not fit gamma in [0.9, 1.1] the harness is not measuring what it
      claims and no (B) exponent is admissible.
    - >-
      CONTROL 3, PLANTED DEFECT OF KNOWN SIZE (blocking). Exactly one target tag
      corrupted to a wrong multiple, at N = 2^16 and T = 16. REQUIRED MAGNITUDE-
      exactly 1 unresolved and exactly 15 resolved. A control that merely returns
      a number proves nothing; this one has a known answer and must produce it.
    - >-
      CONTROL 4, NEGATION CALIBRATION OF KNOWN SIZE (blocking). Ratio of
      single-target rho cost without negation to with negation must be 1.128
      within 0.05, at at least 550 instances - the count derived from the
      per-instance relative spread of about 1.0 needed to resolve 12.8 percent at
      3 sigma. A harness that cannot resolve a known constant cannot certify an
      unknown exponent.
    - >-
      CONTROL 5, THETA SWEEP (blocking for the exponent claim). 4x and 1/4x theta
      at N = 2^20. Gamma must move by at most 0.05. A theta-dependent gamma means
      the DP rule is a confounder and every gamma is withdrawn.
    - >-
      CONTROL 6, MATCHED SINGLE-TARGET BSGS (reported, not blocking). Time and
      memory at each N, reported separately and NEVER merged into the rho
      baseline. Multi-target BSGS amortisation is a different row and is not
      computed here.
  independent_variables:
    - subgroup order N in {2^16, 2^20, 2^24}
    - target count T in {1, 2, 4, 8, 16, 32, 64, 128, 256, 512}
    - construction in {A independent runs, B shared table, NULL curve-free}
    - distinguished-point probability theta (swept 4x and 1/4x at N = 2^20 only)
  metrics:
    primary:
      - >-
        fitted gamma per construction per N, from cell-mean total charged group
        operations, with interval and R-squared (dimensionless)
      - >-
        curve-free gap |gamma_EC - gamma_null| per N, with standard error
        (dimensionless)
      - >-
        c(T,N) = total charged group operations / sqrt(T*N), per cell
        (dimensionless)
    secondary:
      - total charged group operations per cell per seed (group_ops)
      - peak stored table entries and stored bits per cell (stored_entries, bits)
      - >-
        memory ratio, T independent DP-table rho runs over one shared table, both
        sides in stored bits (dimensionless)
      - tag-test cost share per cell (dimensionless fraction)
      - per-target resolution order statistics per cell
      - matched single-target BSGS operations and memory per N
      - wall-clock seconds per run, for budget accounting only
  heuristic_under_test: HEUR-MTRHO-1
  preregistered_prediction:
    quantity: >-
      Total charged group operations to resolve all T targets under construction
      (B), as a function of T at fixed N, and the same quantity for the curve-free
      null.
    formula: >-
      total = c * N^{1/2} * T^{gamma} with gamma in [0.45, 0.60] and c in
      [0.5, 2.0]; |gamma_EC - gamma_null| at most 0.05; memory ratio sqrt(T)
      within a factor 2 in each direction.
    source: >-
      The birthday and coupon-collector analysis of one point stream against T
      tagged orbits, with the rigorous floor total = Omega~(sqrt(T*N)) taken from
      KN-LIT-013 as RELAYED through IDEA-20260731-013 (this agent did not open
      KN-LIT-013). The sqrt(T) memory ratio is derived in this contract from the
      two table sizes theta*sqrt(T*N) and T*theta*sqrt(N).
  scale_relevance:
    tier: toy
    justification: >-
      N at most 2^24 and T at most 512. The exponent in T is a dimensionless
      quantity and is the part with any chance of transferring; the constants c,
      the storage layout and every wall-clock figure are properties of this
      implementation at these sizes. TRANSFER ASSUMPTION, STATED- that the
      birthday regime is entered at the tested (N, T) so the asymptotic form
      applies. At the smallest N and smallest T it may not be, which is why the
      fit-quality rule can drop a size BY THE RULE and never after seeing gamma.
    correspondence: null
  tail_checks:
    - >-
      Resolution-order statistics- the ratio of last-target cost to first-target
      cost per cell, compared against the coupon-collector prediction. Bulk
      agreement on the total with a failure in this tail is the classic sign of a
      biased resolution accounting.
    - >-
      The maximum single-instance total per cell against the exponential tail the
      birthday model predicts, reported per arm.
  replication:
    seeds: >-
      Declared in the run manifest as an explicit list before stage 2. The COUNT
      R per cell is fixed by the stage 0 power computation and is not below 20;
      identical seed lists are used across constructions (A), (B) and NULL so the
      comparison is paired.
    independent_instances: 20
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
    - >-
      A cell that has not resolved all T targets within its per-run wall-clock
      budget is recorded as CENSORED with the budget, the number of targets
      resolved and the operations consumed. A censored cell is an infrastructure
      receipt under AGENTS.md rule 5 and is NEVER counted as evidence about the
      exponent.
    - >-
      Stage 1 failure HALTS the run before stage 2 and the run is reported INVALID.
    - >-
      If the stage 0 power computation demands an R the budget cannot fund, the
      T-grid is reduced to the largest sub-grid the budget supports at that R, and
      the reduction is recorded. THE BAND IS NEVER WIDENED TO FIT THE BUDGET.
    - >-
      Total wall-clock across all runs at the declared cap; on exhaustion the
      remaining cells are recorded as NOT ATTEMPTED, not as failures.
  invalidation_rules:
    - >-
      Any resolution not independently reverified by recomputing the recovered
      scalar against its target invalidates the cell.
    - >-
      Construction (A) failing to fit gamma in [0.9, 1.1] invalidates the whole
      run - the instrument does not reproduce a reference it must reproduce.
    - >-
      The planted defect not firing at exactly one unresolved target invalidates
      the whole run.
    - >-
      The negation calibration missing 1.128 by more than 0.05 at the declared
      instance count invalidates the whole run.
    - >-
      Any arm using a counter, DP rule or tag test not shared with the others
      invalidates the comparison.
  success_criterion: >-
    Construction (B) fits gamma in [0.45, 0.60] with R-squared at least 0.95 at at
    least 2 of 3 tested N; c(T,N) lies in [0.5, 2.0] at every cell with no
    monotone trend; the curve-free gap is at most 0.05 at every N at the declared
    replication; the memory ratio lies in [0.5*sqrt(T), 2*sqrt(T)]; and all six
    controls pass. The ledger baseline entry then moves from UNVERIFIED to
    measured AT TOY SCOPE, with the pre-stated consequence that nothing in it is
    an elliptic-curve statement.
  falsification_criterion: >-
    Construction (B) fits gamma at or above 0.85 at every tested N with all
    targets resolved and the tag-test share below 0.5, OR c(T,N) falls outside
    [0.5, 2.0] with a monotone trend, OR gamma moves by more than 0.05 under the
    theta sweep. Separately and not as a falsifier of the measurement- a
    curve-free gap above 0.15 reproduced across seeds falsifies the generic-model
    null and requires independent review before any interpretation.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with theta, the DP predicate, the tag test and the seed list
    - stage 0 pilot output and the DERIVED replication count R, recorded before stage 2
    - per-cell raw records (arm, N, T, theta, seed, group_ops, stored_entries, bits, tag share, resolution order, wall seconds)
    - per-resolution verification certificates (recovered scalar recomputed against its target)
    - fit outputs- gamma, c, intervals, R-squared, per construction per N
    - the curve-free gap table with standard errors
    - the memory ratio table with the comparator named on every row
    - control outcomes for all six controls, each with pass or fail and its measured value
    - censored and not-attempted cell inventory with budgets
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      TOY SCOPE ONLY- N at most 2^24, T at most 512. The behaviour of a real
      distinguished-point store at cryptographic size, its cache and
      memory-subsystem effects, and the crypto-scale constants ARE NOT TESTABLE AT
      ANY SCALE THIS PROGRAM CAN REACH. That is stated here rather than the claim
      being quietly shrunk to whatever was measured- the hypothesis is about the
      exponent in T at toy N and is not about crypto-scale behaviour.
    - >-
      IF THE CURVE-FREE ARM MATCHES, NOTHING HERE IS AN ELLIPTIC-CURVE OR ECDLP
      STATEMENT. Pre-stated so it cannot be renegotiated after the data.
    - >-
      A measured gamma near 1/2 SATURATES a published floor (KN-LIT-013, relayed)
      and is a calibration, never a novelty and never an attack.
    - >-
      The negation constant applies only to the elliptic arm; the curve-free arm
      has no negation, so constants differ by construction and only the exponent
      is compared across arms.
    - >-
      Multi-target BSGS amortisation is NOT computed and must not be quoted as
      computed. Parallel rho over processors is a different axis and is untouched.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero on every axis.
      Dominated by parallel rho with distinguished points and by BSGS on every row.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
