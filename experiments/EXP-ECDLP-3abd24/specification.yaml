  execution_surface:
    trial_plan: experiments/EXP-ECDLP-3abd24/trial-plan.json
    trial_plan_v1_identical: experiments/EXP-ECDLP-3abd24/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-ECDLP-3abd24/implementation/run.py --stage 0
      --trial-plan experiments/EXP-ECDLP-3abd24/trial-plan.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-ECDLP-3abd24/implementation/run.py --stage 1
      --trial-plan experiments/EXP-ECDLP-3abd24/trial-plan.json
      --run-dir {run_dir}
    note: >-
      trial-plan.json is byte-identical to trial-plan-v1.json. Dual meters
      are Möbius-fast vs Möbius-naive plus two S_3 expansions.

  inputs:
    source_idea: ledger/proposals/IDEA-20260930-ba8184.yaml
    hypothesis: ledger/hypotheses/H-ECDLP-3091c2.yaml
    stream_seed: 202610038184
    stage1_cells:
      - {n: 8, s: 4}
      - {n: 10, s: 5}
      - {n: 12, s: 6}

  controls:
    - name: twin_mobius
      definition: Möbius-fast degree equals Möbius-naive degree on every counted inverse.
    - name: twin_s3
      definition: s3_eval_a == s3_eval_b on every residual evaluation.
    - name: ctl_easy_unit
      definition: f=c+a_0 has deg(g)=1 on both routes (blocking).
    - name: ctl_s3_addition
      definition: S_3 vanishes on checked sums on the tiny curve p=19 (Stage 0).
    - name: null_same_support
      definition: Random full-support units; predicted deg=n (FULL calibration).
    - name: value_spectrum_filter
      definition: Instances with fewer than 4 distinct values are dropped and counted.
    - name: ctl_frozen_cells_integer_n
      definition: stage0/preregistered-predictions.json cells are a list of rows with integer n.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_degree_ladder]
    - name: cell_n
      levels: [8, 10, 12]

  metrics:
    primary:
      - name: frac_full
        unit: dimensionless
        definition: Fraction of unsat draws with deg(f^{-1})=n.
      - name: twin_agreement
        unit: boolean
        definition: Dual Möbius degrees agree.
    secondary:
      - name: frac_half
        unit: dimensionless
      - name: frac_bounded
        unit: dimensionless
      - name: null_frac_full
        unit: dimensionless
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-ECDLP-ba8184-H2

  preregistered_prediction:
    quantity: >-
      deg(f^{-1})=n on ≥90% of 20 unsatisfiable digit-S_3 residuals at each
      Stage-1 cell (FULL), with null also FULL and easy control deg=1.
    formula: >-
      g = pointwise inverse of f on {0,1}^n; deg = max Hamming weight of a
      nonzero ANF coefficient of g; FULL iff #{deg=n}/20 ≥ 0.90.
    source: >-
      ledger/proposals/IDEA-20260930-ba8184.yaml predictions (FULL reading);
      frozen before Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      s≤6, n≤12 Boolean variables, p the least prime above 2^{3s+1} (≤2^19).
      No transfer to cryptographic p or to an ECDLP exponent.
    correspondence: null

  tail_checks:
    - Dual disagreement voids degree claims (O-ARTIFACT).
    - Null FULL fraction <0.90 voids FULL calibration (O-ARTIFACT).
    - Unsat shortfall <20 → O-INCONCLUSIVE.

  seeds_and_replication:
    stream_seed: 202610038184
    independent_instances: 3
    note: Cells n∈{8,10,12} are independent instances. Dual meters replicate each degree.

  replication:
    seeds: [202610038184]
    independent_instances: 3

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-ECDLP-3091c2.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read FULL as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with S_3 identity and easy-control deg=1;
    Stage 1 produces dual-agreed deg(f^{-1}) fractions vs the frozen FULL
    band for each cell (or a named O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE
    stop); RESULTS.md names exactly one O-* label from H-ECDLP-3091c2.

  falsification_criterion: >-
    Any of: twin disagreement; easy-control fail; S_3 identity fail; a
    claimed break/exponent under this card. (O-HALF/O-BOUNDED/O-MIXED are
    valid scientific alternatives to O-FULL, not protocol fails.)

  required_artifacts:
    - experiments/EXP-ECDLP-3abd24/trial-plan.json
    - experiments/EXP-ECDLP-3abd24/trial-plan-v1.json
    - experiments/EXP-ECDLP-3abd24/stage0/preregistered-predictions.json
    - experiments/EXP-ECDLP-3abd24/stage0/identity-and-counts.json
    - experiments/EXP-ECDLP-3abd24/stage1/panels.json
    - experiments/EXP-ECDLP-3abd24/stage1/control-table.json
    - experiments/EXP-ECDLP-3abd24/RESULTS.md
    - experiments/EXP-ECDLP-3abd24/runs/<RUN-ECDLP-*>/manifest.yaml
    - experiments/EXP-ECDLP-3abd24/runs/<RUN-ECDLP-*>/raw-result.json

  assigned_to: executor
