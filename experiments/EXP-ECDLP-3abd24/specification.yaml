      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 mutant W_D / F_p Macaulay engine under this card.
      - Editing IDEA-20260930-ba8184 claim text or GOAL-ECDLP2M-001.yaml.
