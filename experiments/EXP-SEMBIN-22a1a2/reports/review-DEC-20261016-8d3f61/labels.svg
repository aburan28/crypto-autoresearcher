<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>EXP-SEMBIN-22a1a2 labelled first-fall degrees, unshifted vs shifted (RUN-SEMBIN-a818df)</title>
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="bold">Labelled first-fall degrees on S_3 over F_8 (9 bit variables, cap 4)</text>
  <!-- plot area: x 90..610, y(d) = 330 - 55 d -->
  <line x1="90" y1="330" x2="610" y2="330" stroke="#000"/>
  <line x1="90" y1="45" x2="90" y2="330" stroke="#000"/>
  <!-- y ticks -->
  <g text-anchor="end">
    <line x1="85" y1="330" x2="90" y2="330" stroke="#000"/><text x="82" y="334">0</text>
    <line x1="85" y1="275" x2="90" y2="275" stroke="#000"/><text x="82" y="279">1</text>
    <line x1="85" y1="220" x2="90" y2="220" stroke="#000"/><text x="82" y="224">2</text>
    <line x1="85" y1="165" x2="90" y2="165" stroke="#000"/><text x="82" y="169">3</text>
    <line x1="85" y1="110" x2="90" y2="110" stroke="#000"/><text x="82" y="114">4</text>
    <line x1="85" y1="55" x2="90" y2="55" stroke="#000"/><text x="82" y="59">5*</text>
  </g>
  <text x="30" y="190" text-anchor="middle" transform="rotate(-90 30 190)">label value (degree)</text>
  <!-- bound line -->
  <line x1="90" y1="110" x2="610" y2="110" stroke="#c0392b" stroke-dasharray="6,4"/>
  <text x="606" y="104" text-anchor="end" fill="#c0392b">preregistered bound 4 = degree cap = generator degree</text>
  <!-- categories -->
  <g text-anchor="middle">
    <text x="200" y="352">def5_true (unreduced)</text>
    <text x="350" y="352">def6_fake (Boolean)</text>
    <text x="500" y="352">Macaulay syzygy</text>
  </g>
  <!-- def5_true: both 5 -->
  <circle cx="185" cy="55" r="7" fill="#2c7fb8"/>
  <path d="M208,48 L222,62 M222,48 L208,62" stroke="#e66101" stroke-width="3"/>
  <!-- def6_fake: both 4 -->
  <circle cx="335" cy="110" r="7" fill="#2c7fb8"/>
  <path d="M358,103 L372,117 M372,103 L358,117" stroke="#e66101" stroke-width="3"/>
  <!-- macaulay: absent on both, plotted at 5 open markers -->
  <circle cx="485" cy="55" r="7" fill="none" stroke="#2c7fb8" stroke-width="2"/>
  <path d="M508,48 L522,62 M522,48 L508,62" stroke="#e66101" stroke-width="1.5"/>
  <text x="500" y="80" text-anchor="middle" font-size="11">absent on both sides</text>
  <!-- legend -->
  <circle cx="110" cy="378" r="6" fill="#2c7fb8"/><text x="122" y="382">unshifted (matched control)</text>
  <path d="M300,372 L312,384 M312,372 L300,384" stroke="#e66101" stroke-width="3"/><text x="320" y="382">shifted x1 -&gt; x1+1</text>
  <text x="90" y="402" font-size="11">* 5 = no fall found by cap 4 (BOUND+1); open markers = Macaulay label absent. n = 1 deterministic pass per side; no spread.</text>
  <text x="90" y="418" font-size="11">Values: RUN-SEMBIN-a818df raw-result.json (working tree, unpublished). Identical to the values derived in EV-SEMBIN-5e2b97 (D5); shifted-minus-unshifted = 0 on all labels.</text>
</svg>
