# EXP-SEMBIN-22a1a2
# Stage-0 labelled fall certificate for H-SEMBIN-ce9e29.
# Frozen before the official run.
experiment:
  id: EXP-SEMBIN-22a1a2
  hypothesis_id: H-SEMBIN-ce9e29
  source_idea: IDEA-20261006-8f4f02
  question_id: RQ-SEMBIN-9e8f82
  goal_id: GOAL-SEMBIN-fcb7a2
  version: 1
  title: >-
    Labelled first-fall split for one shifted summation polynomial over F_8
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-67e44f
  execution_authorized: true
  objective: >-
    Compute three labels on S_3(x1,x2,x3) = (x1 x2 + x1 x3 + x2 x3)^2
    + x1 x2 x3 + 1 over F_2[z]/(z^3+z+1), and on the same polynomial
    with x1 replaced by x1+1. The labels are the unreduced first-fall
    degree, the Boolean first-fall degree, and the lowest degree of a
    formal syzygy to zero, each capped at 4. A missing fall is recorded
    as 5. The Macaulay matrix has C(13,4) = 715 columns.
  inputs:
    field: "F_2[z]/(z^3+z+1)"
    curve_B: 1
    shift: "x1 -> x1+1"
    bound: 4
    column_count: 715
    named_future_run_slot: RUN-SEMBIN-a818df
  controls:
    - >-
      z^3 equals 1+z in this basis. The Boolean reduction sends
      X0^2+X0 to 0. Both constant terms equal the field element 1.
      The shifted polynomial is not the unshifted polynomial.
    - >-
      The null compares the unshifted labels with themselves and
      must not report a Macaulay divergence.
  independent_variables:
    - whether the first input is shifted by the field element 1
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261006-8f4f02: after the shift, the fake label stays at
    most 4 while the true label exceeds 4 or the Macaulay label moves.
  preregistered_prediction:
    quantity: >-
      def6_fake <= 4 on the shifted side, and either def5_true > 4
      or the Macaulay present/absent bit flips or the Macaulay
      degrees differ by at least 1.
    formula: >-
      A label that never falls by degree 4 is stored as 5. The
      positive reading is the compound statement above. The negative
      reading is its failure on a valid manifest.
    source: >-
      IDEA-20261006-8f4f02 states the bound 4 and a degree-step gap
      of at least 1. Both were fixed before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      Nine bit variables and one summation polynomial. The idea's
      batch at n <= 24 is not this contract.
    correspondence: null
  tail_checks:
    - >-
      Column count is 715. A larger field is not this contract.
    - >-
      Identical shifted and unshifted polynomials invalidate the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-SEMBIN-a818df
    replication_note: >-
      One deterministic pass. No seed is drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-SEMBIN-a818df.
    - Do not add a field, a batch, or a Groebner basis.
    - A missed matrix is the recorded result. Do not change the bound.
  invalidation_rules:
    - The column count is not 715.
    - The shift does not change the polynomial, or a field self-check fails.
    - A timeout, crash, or missing label.
  success_criterion: >-
    The manifest is valid, planted_ok is true, the shifted Boolean
    label is at most 4, and the unreduced label exceeds 4 or the
    Macaulay label disagrees with the unshifted side.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and that compound
    reading fails.
  decision_impact:
    on_positive: >-
      Record that this one shifted polynomial separates the Boolean
      label from the unreduced label or from the Macaulay syzygy
      label. Do not treat that as a certificate for n = 24 and do
      not claim a polynomial-time algorithm.
    on_negative: >-
      Record that this polynomial did not separate the three labels.
      Do not publish an EQS4 batch from this manifest.
  required_artifacts:
    - experiments/EXP-SEMBIN-22a1a2/runs/RUN-SEMBIN-a818df/manifest.yaml
    - experiments/EXP-SEMBIN-22a1a2/runs/RUN-SEMBIN-a818df/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-SEMBIN-22a1a2/trial-plan.json
    driver: experiments/EXP-SEMBIN-22a1a2/implementation/run.py
    checker: experiments/EXP-SEMBIN-22a1a2/implementation/check.py
  out_of_scope:
    - Any n other than 3, any disjoint factor base, and any Groebner basis.
    - Odd characteristic, a deployed curve, and a polynomial-time claim.
