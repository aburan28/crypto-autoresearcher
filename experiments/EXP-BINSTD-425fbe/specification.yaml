# EXP-BINSTD-425fbe
# Retention-schedule arithmetic. No relation is collected.
# Approved by DEC-20261003-3b00c2.
experiment:
  id: EXP-BINSTD-425fbe
  hypothesis_id: H-BINSTD-6013c8
  source_idea: IDEA-20261002-9ff676
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Surplus numerators versus the hour cap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-3b00c2
  objective: >-
    Check the product 24, the quotient 4, and the excess 3.
  inputs:
    num_sum: 9
    num_product: 24
    hour_quotient: 4
    cells: 9
    hour_cap: 6
    cell_excess: 3
    n_sum: 71
    n_product: 12121
    gap_product: 48
    span: 14
  controls:
    - >-
      The product of 2, 3, and 4 is 24. Dropping 2 leaves 12 and
      invalidates the run.
    - >-
      Twenty-four divided by 6 is 4. Nine exceeds 6 by 3. The
      numerator sum is 9, equal to the cell count.
    - >-
      The n sum is 71 and the n product is 12121. The gap product
      is 48 and the span is 14.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {product, quotient, excess}
    - route in {multiply, divide}
  metrics:
    primary:
      - num_product
      - hour_quotient
      - cell_excess
      - implementations_agree
    secondary:
      - num_sum
      - n_product
      - gap_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The product of 2, 3, and 4 is 24. Twenty-four divided by 6 is
      4. Nine exceeds 6 by 3.
    formula: >-
      Multiply 2, 3, and 4. Divide 24 by 6. Subtract 6 from 9.
    source: >-
      IDEA-20261002-9ff676 states the n list 17, 23, and 31, the
      surplus multipliers 1, 3/2, and 2, and the hour cap 6, read
      2026-10-03. It does not name the retention bound as an
      integer. The products were recomputed in this design session.
      That computation is not a run. No relation was collected.
  scale_relevance:
    tier: toy
    justification: Three written surplus multipliers and one written hour cap. No transfer to a retention.
    correspondence: null
  tail_checks:
    - The quotient 4 and the excess 3 are required. A check that stops at the product 24 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 24 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 24.
    - The quotient is not 4.
    - The excess is not 3.
    - The numerator 2 is dropped, or a relation is collected.
  success_criterion: >-
    Both runs agree that the product of 2, 3, and 4 is 24, that 24
    divided by 6 is 4, that 9 exceeds 6 by 3, and that the n product
    is 12121.
  falsification_criterion: >-
    The runs agree that the product of 2, 3, and 4 is computed, and
    that product is not 24.
  required_artifacts:
    - experiments/EXP-BINSTD-425fbe/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-425fbe/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-425fbe/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-425fbe/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-425fbe/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-425fbe/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any relation collection, orbit collapse, or retention measurement.
    - Any claim that a retention stays above a bound.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
