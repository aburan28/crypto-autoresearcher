  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-452b3a
  source_proposal: IDEA-20260825-823de4
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-d36a3d under the standing 2026-09-06
    user authorization. Stage 0 is the exact two-leaf
    unit-product calibrator.

  objective: >
    Evaluate the exact identity that on
    (Z/5Z)^× one has children u0=2,
    u1=3, parent 1, and rejects the
    nearby sum whose parent is 0, on
    one frozen family (REAL, KF, NULL).
    Stage 0 does not form Semaev S_m
    and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL (Z/5Z)^×
      has parent 1; KF sum parent 0
      rejected; NULL empty pair
      rejected; modulus 0 rejected.
      Certificate kind none.
    formula: >
      Ring Z/5Z. Two-leaf product
      S = u0 * u1.
      REAL: u0=2, u1=3, S=6≡1.
      KF: S=u0+u1=5≡0, rejected
      as a generic sum target.
    claim_tier: observational

  inputs:
    fixture:
      real_units:
        modulus: 5
        u0: 2
        u1: 3
        must_parent: 1
      known_false:
        kind: sum_instead_of_product
        must_parent: 0
        must_reject: true
      matched_null:
        kind: empty_pair
        must_reject: true
      invalid:
        - {modulus: 0, must_reject: true}

  controls:
    - name: known_false_sum
      object: KF sum map u0+u1
    - name: matched_null
      object: empty child pair
    - name: invalid_modulus
      object: modulus 0

  independent_variables:
    - modulus
    - u0
    - u1
  primary_metrics:
    - fixture_pass
    - real_product_pass
    - known_false_sum_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact unit tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >
    All five Stage 0 gates true and
    certificate kind none on the
    frozen REAL / KF / NULL toys.
  falsification_criterion: >
    After fixture_pass, any REAL
    parent miss or KF-sum accept
    at the frozen toys.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_unitprod.py
  dependencies:
    - H-ECDLP-bcf723
    - DEC-20260908-d36a3d
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-UNITPROD only. Not
    Semaev. Not a P1553 recurrence.
    Not a factor-base. Not CRT. Not
    Velu. Not a rho beat. No Stage 1
    of EXP-ECDLP-1dc6e1. No Stage 1
    of EXP-ECDLP-6b3d67.
