# EXP-BINSTD-e904ef
# Mitt-count arithmetic. No pool is sampled.
# Approved by DEC-20261003-8a644f.
experiment:
  id: EXP-BINSTD-e904ef
  hypothesis_id: H-BINSTD-d9e1be
  source_idea: IDEA-20261001-5e859e
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Written relative error versus 73/22
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-8a644f
  objective: >-
    Check the cross 4, the excess 146/5, and the remainder 96.
  inputs:
    count: 38
    model_num: 44
    model_den: 5
    excess_num: 146
    excess_den: 5
    rel_num: 73
    rel_den: 22
    written_rel_num: 332
    written_rel_den: 100
    rel_cross: 4
    rel_gap_num: 1
    rel_gap_den: 550
    pool: 96
    ordered: 9216
    unordered: 4560
    pair_quot: 2
    pair_rem: 96
    pair_num: 192
    pair_den: 95
    attempts: 250
    attempt_floor: 200
    attempt_excess: 50
    n_prod: 12121
    band_cross: 16
    band_gap_den: 5
    e_sum: 60
    e_prod: 3000
    pow20: 1048576
  controls:
    - >-
      The written 332/100 exceeds 73/22 by cross 4, and the
      difference is 1/550. Reporting the written relative error
      as 73/22 drops that cross and invalidates the run.
    - >-
      38 exceeds 44/5 by 146/5. Reporting the count as 44/5 drops
      that excess.
    - >-
      At pool size 96, 9216 divided by 4560 is 2 remainder 96.
      The reduced ratio is 192/95. 250 exceeds 200 by 50. The
      product of 17, 23, and 31 is 12121. The band 1/4 exceeds
      1/20 by 1/5. The counts 5, 15, and 40 sum to 60. Two to
      the power 20 is 1048576.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {relative, count, pairs}
    - route in {cross, divide}
  metrics:
    primary:
      - rel_cross
      - excess_den
      - pair_rem
      - implementations_agree
    secondary:
      - n_prod
      - band_cross
      - attempt_excess
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The written 332/100 exceeds 73/22 by 1/550. 38 exceeds
      44/5 by 146/5. 9216 divided by 4560 is 2 remainder 96.
    formula: >-
      Cross 332/100 with 73/22. Subtract 44/5 from 38. Divide
      9216 by 4560. Multiply 17, 23, and 31.
    source: >-
      IDEA-20261001-5e859e states the count 38, the model 8.80,
      the relative error 3.32, the pool size 96, the attempt
      counts 250 and 200, the degrees 17, 23, and 31, the bands
      0.25 and 0.05, the expected counts 5, 15, and 40, and the
      bound 2^20, read 2026-10-03. No group order is named as an
      integer. The crosses were recomputed in this design
      session. That computation is not a run. No pool was
      sampled.
  scale_relevance:
    tier: toy
    justification: One written count, one written model, and one written pool size. No transfer to a hit rate.
    correspondence: null
  tail_checks:
    - The excess 146/5 and the remainder 96 are required. A check that stops at the cross 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The cross is not 4.
    - The excess is not 146/5.
    - The remainder is not 96.
    - The count is reported as 44/5, or a pool is sampled.
  success_criterion: >-
    Both runs agree that 332/100 exceeds 73/22 by cross 4, that
    38 exceeds 44/5 by 146/5, that 9216 divided by 4560 is 2
    remainder 96, and that 17 times 23 times 31 is 12121.
  falsification_criterion: >-
    The runs agree that the cross of 332/100 against 73/22 is
    computed, and that cross is not 4.
  required_artifacts:
    - experiments/EXP-BINSTD-e904ef/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-e904ef/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-e904ef/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-e904ef/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-e904ef/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-e904ef/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any pool sample, hit count, or group-order invention.
    - Any claim that a cross of 4 calibrates a model.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
