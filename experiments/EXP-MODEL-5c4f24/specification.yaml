experiment:
  id: EXP-MODEL-5c4f24
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5f5ace
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE HESSIAN MODEL SEPARATES "MODEL" FROM "COORDINATE" AND PROVES A COORDINATE CAN COST A
    FACTOR 2 - on x^3 + y^3 + 1 = 3dxy negation is (x,y) -> (y,x), so x alone is a DEGREE-3 NON-GALOIS
    coordinate with predicted per-variable summation degree EXACTLY 9 at m = 3, while the negation-invariant
    s = x + y is degree 2 with predicted degree EXACTLY 2; measuring both on ONE curve isolates the
    coordinate as the causal variable and predicts a Bezout ratio of exactly 2 at fixed factor-base
    size
  status: draft
  objective: "(A) THE HESSIAN GEOMETRY, WORKED OUT BY HAND. Take the projective Hessian cubic X^3\
    \ + Y^3 + Z^3 = 3d XYZ with neutral element O = [1 : -1 : 0], for which the group law is \"three\
    \ collinear points sum to O\" and negation is -(X : Y : Z) = (Y : X : Z), i.e. affinely -(x, y)\
    \ = (y, x). Two consequences, both elementary and both decisive:\n  (A1) The affine coordinate\
    \ x is NOT negation-invariant. Its fibres are the\n  intersections of E with the pencil of lines\
    \ X = cZ, which pass through\n  [0 : 1 : 0]. That point is NOT on the curve (0 + 1 + 0 != 0),\
    \ so every line\n  of the pencil meets E in 3 points and x : E -> P^1 has DEGREE 3. The fibre\n\
    \  {P, P', P''} satisfies P + P' + P'' = O (collinearity) and is therefore NOT\n  an orbit of\
    \ any group of automorphisms - the map is non-Galois.\n  (A2) The symmetric coordinate s = x +\
    \ y IS negation-invariant. Its fibres\n  are the intersections with the pencil X + Y = sZ, whose\
    \ base point\n  [1 : -1 : 0] IS on the curve, so each line meets E in the base point plus 2\n\
    \  others and s : E -> P^1 has DEGREE 2. It is the Kummer coordinate.\n\n(B) THE TWO DEGREE PREDICTIONS,\
    \ EXACT INTEGERS.\n  (B1) For s = x + y: deck group {+-1}, so by the fibre count of\n  IDEA-20260807-dadcd2\
    \ (L1), deg_{s_i} S_3^{Hess,s} = 2^(3-2) = 2 exactly,\n  and deg_{s_i} S_m = 2^(m-2). IDENTICAL\
    \ to short Weierstrass.\n  (B2) For x: the deck group inside Aut(E,O) is TRIVIAL, so (L1) does\
    \ not\n  apply and only the general bound (L2) does. Fix x_1, x_2; each has 3\n  preimages; x_3\
    \ = x(-(P_1 + P_2)) ranges over up to 3 x 3 = 9 values, with no\n  diagonal quotient available\
    \ because the fibre is not a group orbit. So\n    deg_{x_i} S_3^{Hess,x} = 9 EXACTLY (generically),\n\
    \  and deg_{x_i} S_m^{Hess,x} = 3^(m-1).\n\n(C) THE FACTOR-BASE TRADE, AND WHY IT LOSES BY EXACTLY\
    \ 2. A membership polynomial of degree d in the coordinate x names 3d points, versus 2d in the\
    \ coordinate s - the coarser coordinate is denser in points per coordinate value, which is the\
    \ only reason anyone would try it. At FIXED rational factor-base size B the Bezout numbers are\n\
    \  s-coordinate: 2^(m-2) (B/2)^(m-1) = B^(m-1)/2\n  x-coordinate: 3^(m-1) (B/3)^(m-1) = B^(m-1)\n\
    so the degree-3 coordinate is worse by EXACTLY a factor 2, independent of m and of B. The density\
    \ gain and the degree loss cancel to first order and the residual is precisely the factor |Gamma_f|\
    \ of the deck-group law. THIS IS THE LANE'S ONE CLEAN QUANTITATIVE DEMONSTRATION that \"coordinate\"\
    \ is a real causal variable with a computable price, and it is a price, not a prize.\n(D) WHY\
    \ THE HESSIAN AND NOT SOMETHING ELSE. Weierstrass, Montgomery, Edwards and the Kummer line all\
    \ have a NEGATION-INVARIANT natural coordinate, so they are all Moebius-equivalent and can only\
    \ differ in support. The Hessian is the only standard model in the brief's list whose natural\
    \ affine coordinate is NOT negation-invariant, because Hessian negation SWAPS the two coordinates\
    \ instead of fixing one. That makes the Hessian the only place in L11 where the coordinate degree\
    \ can actually change, and therefore the only place where the two branches (L1) and (L2) of the\
    \ deck-group law can be told apart experimentally on one curve.\n(E) THE THREE OUTCOMES.\n  OUTCOME\
    \ 1 - measured (2, 9). Both branches of the deck-group law are\n    confirmed, the factor-2 Bezout\
    \ ratio is confirmed, and L11 gains its one\n    demonstrated coordinate effect - a negative one,\
    \ with a named mechanism.\n  OUTCOME 2 - measured x-degree is 3, not 9. Then the Hessian x-fibres\
    \ do\n    admit a diagonal quotient after all, meaning the three collinear points in\n    a fibre\
    \ form a structure I have not identified (a torsor under 3-torsion,\n    say), and the deck-group\
    \ law needs a third branch covering non-Galois maps\n    with special fibre structure. That would\
    \ be the more interesting outcome\n    and it would REOPEN the search for coarse coordinates.\n\
    \  OUTCOME 3 - measured s-degree is not 2. Falsifies (L1) at its most basic\n    instance and\
    \ invalidates every other L11 arm.\n\n(F) THE THIRD ARM THAT MAKES THIS A CONTROL AS WELL AS A\
    \ MEASUREMENT. Both coordinates live on the SAME Hessian curve, with the SAME points and the SAME\
    \ group. So \"model\" is held fixed and only \"coordinate\" varies. Comparing arm (B1) against\
    \ Weierstrass on a birationally equivalent curve holds \"coordinate type\" fixed (degree 2, negation-invariant)\
    \ and varies \"model\". The 2 x 2 design separates the two factors that the phrase \"curve model\"\
    \ conflates, and the corpus currently has no record that distinguishes them."
  resource_label: R2 (curve equation and model), with R1 for the coordinate values.
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE. The resource is R2 - the model and the choice of coordinate
    function - which changes the polynomial system''s coefficient ring and is not producible by the
    generic-group simulator of KN-FIND-b7e091. H-ENDO-001 does not bite: no endomorphism is applied
    to points of G. The prestated ceiling is that of IDEA-20260807-dadcd2 - the coordinate can only
    lose, and by exactly the factor computed in (C).'
  reachability_gate: 'TRIVIAL, AND STATED RATHER THAN LEFT BLANK. T5 gates movement between CURVES;
    this record moves between COORDINATES on one curve at the cost of a substitution, with probability
    1 and no walk. Both coordinates x and s are available simultaneously on the same Hessian curve,
    which is what makes the within-model control free. The model-EXISTENCE condition (3 | #E(F_p))
    is an arithmetic property, checkable for free, and unsatisfiable on a prime-order curve at any
    price - a fact about the curve, not a search cost, recorded here so it is not mistaken for one.'
  inputs:
    procedure: 'STAGE 0 (zero compute, GATE): read Cheng-Kodera-Miyaji 2019 for an existing Hessian
      summation-polynomial degree. A hit reclassifies (B2) as duplicate. STAGE 1 (minutes, GATE):
      build and verify the Hessian curve and its birational Weierstrass model; confirm negation and
      the identity. STAGE 2 (minutes, THE CHEAPEST DECISIVE STEP): fibre enumeration for x and for
      s over 200 random values. This alone settles (A1) and (A2). STAGE 3 (minutes, THE SECOND CHEAPEST
      DECISIVE STEP): numerical count of distinct x(-(P_1 + P_2)) over 9 preimage pairs, 200 random
      (x_1, x_2). This alone settles (B2) without any symbolic elimination. STAGE 4 (minutes to hours):
      symbolic elimination of S_3 in s, then in x. Budgeted; a bust is an infrastructure report. STAGE
      5 (minutes): Bezout and mixed volume in both coordinates at equal B. STAGE 6 (minutes): the
      random-degree-3 null and the n-sweep decay test.'
    mechanism: 'STEP 1 - CONSTRUCT AND VERIFY. Build a toy Hessian curve x^3 + y^3 + 1 = 3dxy over
      a prime with 3 | p - 1 so the model is well populated, and its birational Weierstrass model.
      Verify with 200 random points that the map is a group homomorphism and that negation is (x,
      y) -> (y, x) and that O = [1 : -1 : 0] behaves as the identity. GATE. STEP 2 - CONFIRM THE COORDINATE
      DEGREES DIRECTLY, BEFORE ANY SUMMATION POLYNOMIAL. For 200 random values c, count |{P in E(Fbar_p)
      : x(P) = c}| by solving the curve equation, and likewise for s = x + y. Predicted: 3 and 2.
      This is cheap and it tests (A1)/(A2) independently of any elimination. STEP 3 - S_3 IN s. Eliminate
      to the reduced summation polynomial in s_1, s_2, s_3. Predicted per-variable degree 2, total
      degree 4. Cross-check against the Weierstrass S_3 via the explicit Moebius relation between
      s and the Weierstrass x - they must agree up to a scalar after substitution. STEP 4 - S_3 IN
      x. Eliminate to the reduced summation polynomial in x_1, x_2, x_3. Predicted per-variable degree
      9. This is the expensive elimination and it is where the compute budget goes; if resultant swell
      makes it infeasible, that is an INFRASTRUCTURE outcome (AGENTS.md rule 5) and is reported as
      such, never as evidence about the degree. STEP 5 - THE INDEPENDENT DEGREE CHECK THAT DOES NOT
      NEED THE POLYNOMIAL. Even if Step 4 is infeasible symbolically, the per-variable degree is measurable
      NUMERICALLY: fix random x_1, x_2 in F_p, enumerate the 3 x 3 preimage pairs over an extension
      where they are all defined, compute x(-(P_1 + P_2)) for each, and count distinct values. Predicted
      9. This is O(1) work per sample and it is the real minimal test of (B2). STEP 6 - THE BEZOUT
      COMPARISON. Build the arity-3 decomposition system in each coordinate with factor bases of the
      SAME RATIONAL SIZE B (so d = B/2 for s and d = B/3 for x), compute Bezout numbers and BKK mixed
      volumes, and verify the predicted ratio of exactly 2. STEP 7 - THE 2 x 2 DESIGN. Add the Weierstrass
      arm on the birationally equivalent curve so that (model, coordinate-type) is fully crossed,
      and report the two main effects separately.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - the s-coordinate on the same curve (within-model control)
  - the Weierstrass arm on the birationally equivalent curve (2 x 2 design)
  - a random degree-3 rational function as the matched null
  - the coordinate-degree sweep n = 2, 3, 4 as the decay test
  - deliberately mis-specified negation, to confirm the pipeline rejects a wrong group law rather
    than silently producing a degree
  - 'NULL OBJECT (from the proposal): MANDATORY. Matched null - a RANDOM DEGREE-3 RATIONAL FUNCTION
    on the same curve, of the form r(P) = (cubic in Weierstrass x and y)/(cubic), constructed to have
    degree 3 and no special fibre structure. It has the same shape as the Hessian x - same degree,
    same non-Galois-ness expected - so if the measured per-variable summation degree for the Hessian
    x matches the random degree-3 function, then 9 is a property of "degree 3" and not of "Hessian",
    which is the honest reading and is what (B2) actually predicts. DECAY PARAMETER: the coordinate
    degree n itself, swept over n = 2, 3, 4 via explicit maps. The predicted per-variable summation
    degree must track n^(m-1) for non-Galois maps and n^(m-2) for Galois ones; a measured degree that
    does NOT grow with n is the canonical artifact tell and means the elimination is collapsing something.
    SECOND NULL - the negation-invariant s on the same Hessian curve, which is the within-model control
    that isolates coordinate from model.'
  independent_variables: []
  metrics:
    primary:
    - measured coordinate-map degree per coordinate
    - distinct-value count for x(-(P_1+P_2)) with its empirical distribution
    - per-variable and total degree of each reduced summation polynomial
    - support size and explicit support set per coordinate
    secondary:
    - Bezout, BKK mixed volume, and their ratio at equal B
    - elimination wall time and peak memory, with a declared budget
  heuristic_under_test: null
  preregistered_prediction:
    quantity: null
    formula: null
    source: null
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - '3 | #E(F_p) is required for a Hessian model, so every tested curve has cofactor at least 3 and
    is not a cryptographic curve.'
  - Whether 3 | p - 1 changes how many of the 3-torsion points are rational and hence how much of
    the structure is visible over F_p. Both cases must be run and reported separately.
  - Resultant swell in Step 4 makes non-reduced output very likely; the squarefree gate is mandatory
    and a degree read from non-reduced output is meaningless.
  - The numerical count in Stage 3 needs an extension field where the preimages are defined; working
    over F_{p^k} for the count while claiming a degree over F_p is legitimate for a GEOMETRIC degree
    but must be labelled, and it does NOT license any statement about rational factor-base sizes,
    which is (L3) of IDEA-20260807-dadcd2 and is the exact place this program has previously confused
    geometric with rational counts.
  - '"Hessian" in the corpus also means the Hessian MATRIX (KN-LIT-678); a literature search must
    not conflate the two.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: null
  falsification_criterion:
  - The measured degree of the Hessian x coordinate map is not 3. (A1) is false.
  - The measured degree of s is not 2. (A2) is false and the s arm cannot serve as a control.
  - The distinct-value count in Stage 3 is not 9. (B2) is false as stated; values 3 or 6 REOPEN the
    coarse-coordinate search and are the more valuable failure.
  - Per-variable degree of S_3 in s is not 2. Falsifies IDEA-20260807-dadcd2 (L1) at its simplest
    instance.
  - The Bezout ratio at fixed B is not 2. The accounting in (C) is wrong.
  - The random degree-3 null gives a different count from the Hessian x. Then 9 is Hessian-specific
    rather than degree-specific, which contradicts (B2)'s own reasoning and must be explained before
    anything is reported.
  - Symbolic elimination for the x arm exhausts its budget. INFRASTRUCTURE (AGENTS.md rule 5); Stage
    3 still stands and is reported alone.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
