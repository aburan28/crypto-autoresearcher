# EXP-ECDLP-4ef383
# Constant arithmetic. No character sum is evaluated.
# Approved by DEC-20261003-32c445.
experiment:
  id: EXP-ECDLP-4ef383
  hypothesis_id: H-ECDLP-1af1b2
  source_idea: IDEA-20261003-76df35
  question_id: RQ-ECDLP-bc7a54
  version: 1
  title: Twice a degree of 2
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-32c445
  objective: >-
    Check that twice 2 is 4, that 4 exceeds 2 by 2, and that the nearby gap is 0.
  inputs:
    factor: 2
    degree: 2
    constant: 4
    constant_gap: 2
    constant_product: 4
    constant_sum: 4
    nearby_a: 2
    nearby_b: 2
    nearby_gap: 0
    nearby_product: 4
  controls:
    - >-
      The factor is 2. The degree is 2. Their product is 4.
      Reporting the degree as 1 makes the product 2 and invalidates
      the run.
    - >-
      Four exceeds two by 2. The sum of the two factors is 4.
    - >-
      Two readings of the degree are both 2. Their gap is 0 and
      their product is 4.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {product, gap, nearby}
    - route in {multiply, subtract}
  metrics:
    primary:
      - factor
      - degree
      - constant_product
      - implementations_agree
    secondary:
      - constant_gap
      - constant_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Twice 2 is 4. Four exceeds two by 2. The gap of two degree
      readings is 0.
    formula: >-
      Multiply 2 by 2. Subtract 2 from 4. Add 2 and 2. Subtract 2
      from 2.
    source: >-
      IDEA-20261003-76df35 writes the constant 4 as twice a degree
      for the coordinate x, read 2026-10-03. The product and the
      sum were recomputed in this design session. That computation
      is not a run. No character sum was evaluated.
  scale_relevance:
    tier: toy
    justification: One written constant. No transfer to a set bound.
    correspondence: null
  tail_checks:
    - The product 4 and the nearby gap 0 are required. A check that stops at the factor 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The factor is not 2.
    - The degree is not 2.
    - The product is not 4.
    - The gap is not 2.
    - The degree is reported as 1, or a character sum is evaluated.
  success_criterion: >-
    Both runs agree that twice 2 is 4 and that 4 exceeds 2 by 2.
  falsification_criterion: >-
    The runs agree that the product of 2 and 2 is computed, and
    that product is not 4.
  required_artifacts:
    - experiments/EXP-ECDLP-4ef383/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-4ef383/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-4ef383/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-4ef383/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-4ef383/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-4ef383/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any character sum, set bound, or scalar recovery.
    - Any claim that the constant 4 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
