experiment:
  id: EXP-ECDLP-288336
  hypothesis_id: H-ECDLP-9d5e78
  version: 1
  title: >-
    Charged field-operation reanalysis of m=3 x-oracle MITM versus exhaustive
    and random-query controls
  status: approved
  frozen: true
  frozen_on: '2026-08-08'
  confirmatory_status: successor_reanalysis
  claim_tier_ceiling: toy
  claim_tier_ceiling_note: >-
    All source cells are 7-8 bit prime-field toy cells. This experiment reanalyzes
    committed source bytes and cannot support crypto-scale or asymptotic claims.
  objective: >-
    Recompute a charged field-operation comparison from the existing 40-cell,
    three-arm source run. Primary comparison B versus A measures the MITM split's
    work reduction; secondary comparison B versus C measures the marginal effect
    of structured x-coordinate queries versus matched random queries. Remove the
    prior proposal's t-test and do not call the B-versus-C yield difference a
    speedup or yield result.
  source_artifacts:
    - path: experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py
      sha256: 64d682e56e28472987ebd319f6250a09620c566ab7a881701d53acce3300a540
    - path: experiments/EXP-SEMAEV-f48dd1/runs/RUN-SEMAEV-f48dd1-grid/raw-results.json
      sha256: 6e2d126166b0a6f6ee25c462e121c247b66f571e6e6ffc107e751602ee5ed978
    - path: experiments/EXP-SEMAEV-f48dd1/runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml
      sha256: 1f51fd95f5bdf87e3c4972ed612786ae9164f358aaebe5d5cb0d33b704083211
    - path: experiments/EXP-SEMAEV-f48dd1/runs/RUN-SEMAEV-f48dd1-grid/manifest.yaml
      sha256: 20f758233b5381c3ce8497a6231eb923dd637787d64a0c715c55a2d6ec7f32d8
  controls:
    - id: CTRL-SOURCE-HASHES
      method: Recompute SHA-256 for all four source artifacts before parsing.
      pass_condition: Every hash equals the frozen value above.
    - id: CTRL-SOURCE-CELLS
      method: Require 40 cells, three arms per cell, and all source controls true.
      pass_condition: 120 arm records and 40 valid cells are present.
    - id: CTRL-ARITHMETIC
      method: Recompute A=2|F|^3 and B/C=|F|^2+2*candidates_verified.
      pass_condition: Every source field-operation count matches exactly.
    - id: CTRL-RELATION-EQUALITY
      method: Compare A and B relation counts cell by cell.
      pass_condition: No mismatch is interpreted as a yield gain.
  independent_variables:
    - arm: [A, B, C]
    - prime: [101, 103, 107, 211]
    - b: [0.4, 0.5]
    - seed: [1, 2, 3, 4, 5]
  metrics:
    primary:
      - field_operations_B_over_A
      - field_operations_B_minus_A
    secondary:
      - field_operations_C_over_A
      - candidates_verified_B_over_C
      - candidates_verified_B_over_right_half_pairs
      - candidates_verified_C_over_right_half_pairs
      - cost_per_relation_A
      - cost_per_relation_B
      - cost_per_relation_C
      - relation_count_A_minus_B
      - wall_clock_seconds_source_only
  preregistered_prediction:
    quantity: field_operations_B_over_A
    formula: (|F|^2 + 2*candidates_verified_B) / (2*|F|^3)
    source: frozen implementation arithmetic in experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py
  scale_relevance:
    tier: toy
    justification: >-
      Direct reanalysis of 7-8 bit prime-field cells; no scale correspondence is
      claimed and Pollard rho remains the generic comparison.
    correspondence: null
  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 40
  budget:
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 0.01
    maximum_memory_gb: 1
    maximum_runs: 1
  stopping_rules:
    - Stop after all 40 cells are parsed and validated.
    - Stop immediately with invalid status on any source hash or arithmetic mismatch.
  invalidation_rules:
    - Source hash mismatch.
    - Missing or duplicated cell/arm record.
    - Any source control failure.
    - Any field-operation identity mismatch.
  success_criterion: >-
    All source hashes and controls pass, all 40 cells are analyzed, and the output
    reports split and oracle effects as separate comparisons without statistical
    overclaiming.
  falsification_criterion: >-
    A valid cell or aggregate contradicting the preregistered split-cost direction
    is recorded as a scoped falsification; infrastructure failures are invalid.
  required_artifacts:
    - experiments/EXP-ECDLP-288336/specification.yaml
    - experiments/EXP-ECDLP-288336/code/analyze_mitm_cost.py
    - experiments/EXP-ECDLP-288336/runs/RUN-ECDLP-288336-001/manifest.yaml
    - experiments/EXP-ECDLP-288336/runs/RUN-ECDLP-288336-001/raw-result.json
    - experiments/EXP-ECDLP-288336/runs/RUN-ECDLP-288336-001/stdout.log
    - experiments/EXP-ECDLP-288336/runs/RUN-ECDLP-288336-001/stderr.log
    - experiments/EXP-ECDLP-288336/runs/RUN-ECDLP-288336-001/command.txt
    - experiments/EXP-ECDLP-288336/runs/RUN-ECDLP-288336-001/environment.json
  assigned_to: executor
  approved_by: coordinator
  approval_decision_id: DEC-20260808-d7e914
