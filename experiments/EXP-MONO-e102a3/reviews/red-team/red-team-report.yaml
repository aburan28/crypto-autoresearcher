  proof_architecture_challenges:
    - attack: quantifier-order / circularity attack (continuing
        RT-20260904-001's own H1-challenge)
      finding: >-
        See H1-CHEB-EXTENSION-TO-R3 above. As with R1's bound, any
        Weil/Chebotarev-style justification for "this size of R3
        deviation is unremarkable under S_3" would need to assume
        properties of the S_3-cover (its geometric irreducibility/full
        monodromy) that are logically close to the very conclusion
        G_R=S_3 being tested -- the same structural circularity
        RT-20260904-001 identified for R1, now shown to apply at least as
        strongly to R3 (which additionally lacks even the partial,
        conditional double-cover construction R1 has). The load-bearing,
        non-circular evidence remains the exact-zero/forced-value tests
        (R1 vs 1.0, irreducible density vs 0), not the closeness of R3 to
        1/6, which is corroborating context of uncertain reliability, not
        independent confirmation.
    - attack: nearby-object / null-object-control attack
      finding: >-
        A genuinely useful null-object control that has NOT yet been run
        anywhere in this program: Stage 1's "unconstrained object" (all
        (e1,e2,e3), the full ambient space) has an EXACT, elementarily-
        derived finite-p triple at p=101 of (33/202, 1/2, 34/101) =
        (0.163366, 0.5, 0.336634) -- itself already a small, EXACTLY
        KNOWN (not heuristic) O(1/p) deviation from the naive asymptote
        (1/6, 1/2, 1/3), of magnitude ~0.0033, arising from PURE orbit-
        counting with no Weil bound or arithmetic-geometry input at all.
        But that control has n=1,020,100 points, three orders of
        magnitude more than V_R's ~10^4 -- it is not scale-matched, so it
        cannot calibrate what deviation size is "typical noise" at V_R's
        own n~10^4. The cheap, not-yet-run control this suggests: draw an
        actual iid random sample of ~10^4 points FROM the unconstrained
        object (whose exact finite-p ground truth is already known) and
        measure how much a sample of THAT size deviates from the exact
        ground truth by chance alone. This would be a genuine, literal
        "random function of the same shape" null control, distinguishing
        real sampling noise (which DOES apply to a random 10^4-point
        subsample, unlike to V_R's own exhaustive census) at the correct
        scale, directly answering "is 0.0144 a plausible fluctuation size
        for ~10^4 points" without relying on ANY unproven Weil-type
        heuristic. This is cheap (seconds, reusing the already-committed
        unconstrained-object enumeration) and was not run by either this
        review or the Executor; I name it as a candidate next step
        distinct from, and cheaper/more decisive for the pure "is this
        deviation size plausible for iid noise" question than, the
        p-ladder or R-panel.

  j3_tolerance_model_for_vr:
    part_i_executor_claim_arithmetic: >-
      REPRODUCED, AND THE CLAIM IS FALSE UNDER THE THEORETICALLY-
      CONSISTENT VERSION OF THE EXECUTOR'S OWN MODEL. Naive iid Bernoulli
      SE at R3's own target p=1/6, n=10005: sqrt((1/6)(5/6)/10005) =
      0.0037258; 3*SE = 0.011178. Observed |R3-1/6| = |0.152224-0.166667|
      = 0.014443. 0.014443 > 0.011178: EXCEEDS the 3-sigma band (3.876
      standard errors, not <=3). This confirms the Coordinator's own
      prior finding by independent recomputation. I additionally located
      the exact mechanism: the script (run_galois_cubic_census_v2.py:686)
      computes a SINGLE se=sqrt(0.5*0.5/n)=0.0049988 -- the Bernoulli
      SE for a target of 0.5, not 1/6 -- and reuses it uniformly for R1,
      R2, AND R3. Under this (internally inconsistent) SE, 3*se=0.014996,
      and 0.014443 < 0.014996: the claim is TRUE, but only by a 3.7%
      margin and only because the SE used for R3 is 1.341x too large for
      R3's own target probability. The Executor's "within 3 standard
      errors" statement is therefore an artifact of a formula bug, not a
      correct application of even the (separately contestable, see
      part_ii) naive-iid model.
    part_ii_is_weil_relative_the_correct_frame: >-
      HEUR-CHEB-1's stated form ("error O(p^-1/2) RELATIVE") is the
      theoretically BEST-MOTIVATED available framing -- it matches the
      conventional shape of proven effective-Chebotarev/equidistribution
      theorems for varieties, which are normally stated directly on the
      density via a character-sum bound, not derived by separately Weil-
      bounding a numerator and denominator and dividing. Numerically, the
      relative envelope at p=101 is (1/6)*(1/sqrt(101))=0.016584, which
      comfortably contains 0.014443 (87% of the envelope). BUT: (a) no
      theorem with this exact conclusion, checked hypotheses, and an
      explicit constant has been derived or cited for THIS specific
      S_3-cover W_R->V_R, either here or in H-MONO-572e7e -- it is stated
      as a heuristic assumption, not proven; (b) I attempted the exact
      "propagate the Weil bound through the ratio" derivation the task
      asks about, and it does NOT automatically reproduce the relative
      form -- writing split_count=n/6+D and combining with n=p^2+O(p^1.5)
      gives R3-1/6=D/n, and if D itself is assumed O(p^1.5) (the same
      power as the TOTAL count's own, itself-unproven Lang-Weil term),
      the result is an ABSOLUTE O(p^-0.5) bound on R3, a factor of 6
      LOOSER at p=101 than the "relative" framing (0.2985 using the
      quoted envelope constant 3, vs 0.0166) -- so combining two
      separately-Weil-bounded quantities through a ratio can give a
      DIFFERENT, LOOSER combined bound than simply asserting the relative
      form directly, and choosing between them requires an assumption
      about the sub-locus's own error term that nobody has derived; (c)
      R3 resolves a strictly finer invariant (the single identity
      conjugacy class, 1-of-3, via the full 2-dimensional standard
      representation of S_3) than R1's binary sign character (which has a
      partial, explicit, if conditional, double-cover derivation in
      RT-20260904-001) -- no analogous explicit construction exists for
      R3 anywhere in this program. My honest answer: the relative
      framing is the right SHAPE to reach for, is not obviously wrong,
      and does contain the data -- but it is not rigorously derived here,
      is at least as circular as R1's own already-flagged case (assuming
      something close to G_R=S_3 to justify a bound meant to test
      G_R=S_3), and a naive mechanical alternative derivation gives a
      materially looser (vacuous) bound instead, so "rigorously justified"
      would overstate it; "a plausible, best-available heuristic scaling"
      is the accurate description.
    part_iii_comparing_the_two_objects_own_deviations: >-
      Ratio for R3 specifically: 0.014443/0.001650=8.75x, confirmed
      independently. But decomposed by invariant (a comparison the task
      does not request but which I performed and find load-bearing): R1's
      own deviation ratio is 0.915x (object 2 is SLIGHTLY tighter, not
      looser); irreducible density's own ratio is 1.577x (modest growth);
      only R3 shows the large 8.75x growth. This is NOT a uniform "object
      2 is a noisier surface" effect -- it is concentrated in exactly the
      invariant (R3) with the least-derived, most heuristic error bound
      (per part_ii). With only n=2 objects, no rigorous statement about
      the EXPECTED spread of R3's own deviation across independent
      objects is possible -- estimating a distribution's spread from 2
      draws is not a well-posed statistical question, and I decline to
      call 8.75x either "surprising" or "expected" on that basis alone.
      What CAN be said: relative to the (heuristic, unproven, partially
      circular) 0.016584 envelope, object 1 sits at ~10% and object 2 at
      ~87% -- both individually consistent with a single characteristic
      scale of that size, and having one low and one high draw from 2
      samples is not on its own anomalous -- but object 2's proximity to
      the edge of the very envelope invoked to explain it means a
      THIRD object exceeding that envelope would be immediately
      informative in a way these two, so far, are not. The cheapest way
      to move past "can't tell from n=2" is a same-p R-panel (see
      required_controls), which is cheaper and more directly responsive
      to this specific spread question than the p-ladder.
    part_iv_bottom_line: >-
      MARGINALLY CONSISTENT, WORTH A FLAG -- not comfortably consistent,
      and not (yet) genuine doubt about G_R=S_3 itself, because the part
      of the evidence that actually does the discriminating work (the
      exact-zero tests excluding trivial/C2/A3, see J4) is unaffected and
      remains decisive. But the residual, positive claim "R3 is close
      enough to 1/6 to call this consistent with S_3" specifically: FAILS
      a correctly-parameterized naive-iid 3-sigma test (a model I
      consider conceptually wrong to apply here regardless, per OBJ-2);
      PASSES the Executor's own actually-reported 3-sigma test only
      because of a formula bug (OBJ-1), by a 3.7% margin; and sits at 87%
      of the best-available heuristic envelope (Weil-relative, itself
      unproven and circular for the reasons above), a much smaller margin
      than object 1's 10%. I would not sign off on "comfortably
      consistent" language for this specific number, and recommend the
      Coordinator's evidence record say so explicitly rather than repeat
      the Executor's "within 3 standard errors" framing verbatim.

  j4_overall_reading:
    exclusion_component_is_solid: >-
      Trivial, C_2, and A_3 are excluded on this second object exactly
      as decisively as on the first, and by the SAME exact-zero-forcing
      logic RT-20260904-001 established (not by any statistical
      closeness argument): R1=0.4957 is nowhere near the trivial/A_3
      prediction of 1.0 (a distance of ~0.50, not a marginal call at any
      plausible error scale); irreducible density=0.3434 is nowhere near
      the C_2/trivial prediction of 0 (a distance of ~0.34). Both
      distances are orders of magnitude larger than any of the SE
      formulas discussed in J3, so this part of "two objects both exclude
      named rivals" is genuine, robust, unaffected by the R3-precision
      dispute, and IS real incremental progress: two independent (curve,
      R) at p=101 both leave S_3 as the sole surviving named candidate
      out of the full subgroup lattice of S_3 (trivial, the three
      conjugate C_2's, A_3, S_3 itself -- all four possibilities now
      considered per H-MONO-572e7e's own incorporation of the first
      round's C_2 finding).
    positive_component_is_weaker_on_this_object: >-
      The residual claim -- "and the observed triple is close enough to
      the S_3 asymptotic prediction specifically to call this a positive
      match, not merely a non-exclusion" -- is real but WEAKER here than
      on object 1, per J3: the deviation driving this (R3's 0.014443) is
      marginal under the best-available heuristic standard and fails
      under the naive standard the Executor actually invoked. I recommend
      the overall statement distinguish these two components explicitly:
      "named rivals robustly excluded on 2/2 objects" (strong, unchanged)
      versus "closeness to the S_3 prediction specifically" (present on
      both, but meaningfully tighter on object 1 than object 2 -- 10% vs
      87% of the same heuristic envelope). Collapsing both into one
      undifferentiated "consistent with S_3" sentence for both objects
      alike would overstate what object 2 adds on the positive side,
      though it would NOT overstate the exclusion side.
    overall_verdict: >-
      YES, this constitutes genuine incremental progress toward
      confirming G_R=S_3 -- the alternative-elimination logic, which is
      what actually does the discriminating work (exactly as
      RT-20260904-001 concluded for object 1: closeness to the asymptote
      is corroborating context, not the load-bearing evidence), transfers
      cleanly and robustly to a second, independently-selected object.
      But the larger, R3-concentrated deviation SHOULD temper how
      confidently the POSITIVE "consistent with S_3" language is stated
      for this specific object -- I would write it as "S_3 remains the
      only named candidate not excluded on either object; the second
      object's closeness to the S_3 prediction is more marginal than the
      first's," not as an equally clean second confirmation. A third
      object (same-p R-panel, cheapest; or the p-ladder, more decisive
      for the decay-rate question) remains necessary before stating
      "consistent with S_3" for the FAMILY of objects with the same
      confidence the exclusion claims already warrant individually.
    r3_non_reproduction_and_coincidence: >-
      The non-reproduction of R3=17/101 makes the "first match was a
      coincidence" reading SUBSTANTIALLY MORE PLAUSIBLE than a bare
      non-match would, via a structural argument beyond simple
      cross-multiplication (see counterexample_or_mutation): object 2's
      n=10005 has no factor of 101 at all (10005=3*5*23*29), so
      1523/10005 (already in lowest terms) could NEVER equal k/101 for
      any integer k, regardless of the true dynamics -- whereas object
      1's n=9999=3^2*11*101 DID have a factor of 101, which is exactly
      what let 1683/9999 reduce to 17/101. This names WHY object 1's
      match could occur (an incidental alignment of its own degenerate-
      stratum count with p) and shows that alignment is curve/R-specific,
      not a property of V_R's arithmetic in general -- a materially
      stronger basis for "coincidence" than "we tried again and it
      differed." It does NOT fully settle the question on its own,
      because it also means this particular non-match was, in a sense, a
      test that could not have succeeded here regardless of dynamics --
      it doesn't independently confirm the ABSENCE of some other,
      differently-formulated exact law. A third data point is still
      needed, and I recommend it take one of two forms: (a) an object
      where n again happens to be a multiple of 101 (giving the identical
      literal test a fair second trial), or (b) more informatively, the
      reformulated denominator-independent quantity named in
      required_controls (n*R3-n/6), which tests for a hidden law without
      depending on this incidental divisibility coincidence at all.

  narrowest_supported_statement: >-
    On these two tested (curve, R) at p=101, EXP-MONO-e102a3's Stage-0
    census, independently re-checked by hand (exact fraction arithmetic,
    no floating point, no reuse of Executor code): reproduces R1+R2=1 and
    the disc-square-iff-not-1+2 identity exactly; robustly and decisively
    excludes G_R in {trivial, C_2, A_3} on this second object by the same
    exact-zero-forcing logic as the first, independent of any error-model
    dispute; confirms R3 != 17/101 exactly, and additionally shows this
    specific non-match was structurally guaranteed by 101 not dividing
    10005, a fact with no established bearing on G_R; and shows the
    residual "consistent with S_3" reading is only MARGINALLY supported
    on this object's own R3 value under the best-available (still
    heuristic, still circular) Weil-relative standard, and is NOT
    supported under a correctly-parameterized naive-iid standard, while
    the Executor's own reported "within 3 standard errors" pass is an
    artifact of a locatable SE-formula bug rather than a correct
    application of even that (separately contestable) naive model. This
    supports "two independent objects both exclude named rivals; S_3
    remains the sole named candidate not excluded, more marginally on the
    second object than the first" -- it does not support "G_R=S_3
    confirmed," "the deviation scale is well understood," or any
    relation-rate, cost, or exponent claim, and it does not settle
    whether the first object's exact R3 match was a law or a coincidence
    beyond making the coincidence reading substantially more plausible.

  next_concrete_action: >-
    Run a same-p R-panel at p=101 (>=5-10 further R on the two already-
    identified curves, or the next admissible curve in the same declared
    scan), reusing this exact pipeline unmodified -- this is the
    cheapest available way to (1) build an actual empirical distribution
    of R3's own deviation at fixed p, resolving whether 0.0144 was a
    typical or an upper-tail draw (impossible to say from n=2); (2) give
    the R3=17/101-style exact-form question a fair second trial on an
    object whose own n is again a multiple of 101, or, better, evaluate
    the reformulated n*R3-n/6 quantity directly; and (3) as a
    complementary, even cheaper diagnostic, draw an actual iid random
    sample of ~10^4 points from the ALREADY-EXACTLY-KNOWN unconstrained
    ambient object and measure its own sampling deviation at matched
    scale, giving a genuine (not heuristic) null-object calibration for
    "how much should ~10^4 points fluctuate by chance alone" independent
    of any unproven Weil-type bound. The p-ladder (R7) remains the
    correct, but more expensive, next step specifically for testing
    whether the deviation decays with p as either heuristic predicts.

