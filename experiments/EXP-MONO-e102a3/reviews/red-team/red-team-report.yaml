  objections:
    - id: OBJ-1-MISSPECIFIED-SE-FORMULA
      statement: >-
        experiments/EXP-MONO-e102a3/implementation/run_galois_cubic_census_v2.py:686
        computes `se = (0.5 * 0.5 / n_nondeg) ** 0.5` ONCE and reuses this
        SAME value as the tolerance for all three of `abs(R1-0.5)<=3*se`,
        `abs(R2-0.5)<=3*se`, AND `abs(R3-1/6)<=3*se` (line 687-688). This
        is the maximum-variance Bernoulli SE (variance p(1-p) is maximized
        at p=0.5), correct in scale for R1/R2 (whose own targets ARE 0.5)
        but WRONG for R3, whose target is 1/6: the correct per-target
        Bernoulli variance at p=1/6 is (1/6)(5/6)=0.1389, giving SE=
        0.0037258, not 0.0049988 -- the script's SE for R3 is 1.341x too
        large (0.0049988/0.0037258=1.341), which mechanically LOOSENS
        (not tightens) the 3-sigma pass criterion for R3 specifically. I
        confirmed this is exactly the source of raw-result.json's own
        "standard_error_approx": 0.004998750468554773 (matches
        sqrt(0.25/10005) bit-for-bit) and confirmed by direct arithmetic
        that recomputing with R3's own correct target probability changes
        the pass/fail verdict: observed deviation 0.014443 is UNDER the
        script's own inflated 3*se=0.014996 (passes, by a 3.7% margin) but
        OVER the theoretically consistent 3*se_correct=0.011178 (fails,
        by a 29% margin, i.e. 3.876 standard errors). The Executor's own
        execution_report.yaml claim "within 3 standard errors" is
        therefore TRUE only relative to an internally inconsistent
        formula, and FALSE relative to the theoretically consistent
        version of the SAME (still separately contestable, see OBJ-2)
        naive-iid model.
      severity: substantive_but_bounded
      resolution: >-
        Does not change any archived number and does not, by itself,
        overturn the S_3-consistency reading (see J3/J4 below, and OBJ-2
        for why the naive-iid frame is the wrong standard regardless).
        Should be named to the Coordinator as a candidate for a future
        correction record or standing-rule note, since it is a concrete,
        locatable implementation bug distinct from (but in the same
        family as) CORR-20260904-33fbf3 and CORR-20260904-8cc20f. I did
        not issue a correction myself; that is the Coordinator's call.
    - id: OBJ-2-NAIVE-IID-FRAME-STILL-WRONG-IN-PRINCIPLE
      statement: >-
        Independent of OBJ-1's arithmetic bug, the entire "n=10005,
        p=1/6, treat as an iid Bernoulli sample, compute a sampling
        standard error" framework is conceptually mismatched to what
        Stage 0 measures. V_R'(F_101) is enumerated EXHAUSTIVELY -- every
        point of a fixed, deterministic algebraic surface is counted
        exactly once, with no randomness and no repeated draws. There is
        no sampling error in the classical (CLT/Bernoulli-trials) sense
        at all; what deviates from the idealized infinite-p asymptote
        1/6 is a ONE-TIME arithmetic-geometry quantity (an exact point
        count on a specific surface), whose deviation is governed, if at
        all, by Weil/Lang-Weil/Chebotarev-type bounds -- a completely
        different mathematical object from a sampling standard error,
        even before asking whether the SE formula used is internally
        consistent (OBJ-1). This is not a new criticism: RT-20260904-001
        (the prior round's own Red Team report, J4 part_ii) already
        derived this point in detail and recorded a standing-rule
        recommendation that V_R's own deviation should be judged
        "primarily by the EXACT zero/nonzero or forced-ratio tests,"
        with the SIZE of any residual reported "only alongside an
        explicitly named mechanism and order... never treating
        'exhaustive census, therefore [a sampling band] is the norm' as
        a blanket default." This run's Stage 1 (the null-object controls)
        correctly incorporated the CORRECTION for exact censuses with
        KNOWN closed forms (CORR-20260904-8cc20f, zero tolerance) -- but
        Stage 0's own `outcome_I_s3_confirmed` boolean still runs a
        naive-iid-sampling-style test against V_R itself, the exact
        pattern the PRIOR red-team report already flagged as
        theoretically wrong for an exhaustive census WITHOUT a known
        closed form. The recommendation from RT-20260904-001 was not
        carried forward into this experiment's implementation.
      severity: substantive
      resolution: >-
        Does not invalidate the run (no re-run is warranted; the raw
        R1/R2/R3/irreducible-density numbers are unaffected and are what
        matters). Means the `outcome_I_s3_confirmed: true` boolean
        recorded in raw-result.json and execution_report.yaml should NOT
        be read as a rigorous machine-verified certificate the way the
        Stage-1 exact-match booleans or R8's pass are; it is a soft
        heuristic summary field, sensitive (per OBJ-1) to an arbitrary
        formula choice that flips it depending on which of two
        closely-related naive models is used, and (per this objection)
        built on a model that is arguably the wrong one to apply to V_R
        at all. The Coordinator's interpretation memo should describe
        this triple's closeness to (1/6,1/2,1/3) in the vocabulary
        RT-20260904-001 recommended (named mechanism and order,
        corroborating not decisive) rather than citing the boolean.
    - id: OBJ-3-DEVIATION-GROWTH-IS-CONCENTRATED-IN-R3-NOT-UNIFORM
      statement: >-
        Comparing this object's deviations to EV-MONO-344589's own
        archived object-1 deviations by INVARIANT, not just by R3: R1's
        deviation from 0.5 is 0.004750 (object 1) vs 0.004348 (object 2)
        -- a ratio of 0.915, i.e. object 2's R1 is if anything SLIGHTLY
        TIGHTER, not looser. Irreducible density's deviation from 1/3 is
        0.006401 (object 1) vs 0.010095 (object 2) -- ratio 1.577, a
        modest growth. R3's deviation from 1/6 is 0.001650 (object 1) vs
        0.014443 (object 2) -- ratio 8.752, a large growth. The ~9x
        spread the task asks about is therefore NOT a uniform "object 2
        is a noisier surface" effect across the whole measured triple --
        it is concentrated specifically in R3 (the finest invariant,
        which must resolve the IDENTITY conjugacy class alone out of
        three classes {e},{transpositions},{3-cycles}), while R1 (the
        coarsest invariant, a single quadratic-character/sign-of-
        permutation test) stayed essentially as tight as before. This
        pattern is consistent with (not proof of) the structural point in
        heuristic_challenges below: R1's error term has a partial,
        explicit (if conditional) Lang-Weil-style derivation via a
        degree-4 double cover in RT-20260904-001's own H1-challenge; no
        analogous construction exists anywhere in this program's records
        for R3, which requires the FULL rank-2 standard representation of
        S_3, not merely its sign character. A single coarse invariant
        being stable while a finer one is volatile across only 2 objects
        is exactly what "R3's mechanism and R1's mechanism are of
        different orders/robustness" would look like, though 2 objects
        cannot distinguish this from chance.
      severity: informational
      resolution: >-
        Not a defect; a genuinely new, quantitative observation this
        round contributes. Recommend the Coordinator's write-up report
        the per-invariant deviation ratios (0.92x, 1.58x, 8.75x), not
        only the headline R3 ratio, since collapsing to one number
        obscures that the growth is concentrated in exactly the
        invariant with the least-derived theoretical error bound.

  required_controls:
    - control: >-
        A same-p R-panel at p=101 (the idea's own R5: reuse the two
        already-verified curves, or the next admissible curve in the
        same scan, with >=5-10 further R per curve), reusing this exact
        pipeline unmodified -- seconds of compute per point per the
        run's own measured 6.3s wall time.
      purpose: >-
        This is the CHEAPEST available way to answer the specific
        question J3 asks about spread: with only n=2 samples (0.0016 and
        0.0144), no statement about "expected spread" is statistically
        meaningful at all -- estimating the spread or tail behavior of a
        distribution from 2 draws is not possible in principle. A panel
        of 5-10+ same-p R''s builds an actual empirical distribution of
        the R3 deviation at fixed p, which is what is needed to say
        whether 0.0144 (87% of the stated Weil-relative envelope) is a
        typical draw, a mild upper-tail event, or (if a THIRD point
        exceeded the envelope) evidence the envelope itself is
        mis-scaled. This directly and more cheaply answers the "is 9x
        notable" question than the p-ladder does, since it holds p fixed
        and varies only the object.
    - control: >-
        The idea's own p-ladder check (R7), at minimum one further prime
        (e.g. p=211), on a freshly-selected curve/R by the same rule.
      purpose: >-
        Unchanged from RT-20260904-001's own required_controls: the only
        available way (short of an actual zeta-function computation) to
        distinguish generic Weil-type O(p^-1/2) decay (shrink ~1.44x by
        p=211) from a hidden exact rational correction (shrink ~2.1x)
        from a non-shrinking artifact (S6, voids the arm). Still not run
        after two same-p objects; remains the higher-value but more
        expensive of the two controls named here.
    - control: >-
        A reformulated, denominator-independent version of the "does a
        clean law govern split density" question: track n*R3 - n/6 (the
        raw integer excess of the split count over an exact sixth of the
        total, generalizing (split_count - n/6) rather than the reduced
        fraction R3 itself) across the panel/ladder above.
      purpose: >-
        Per counterexample_or_mutation below, the literal "R3 == k/101"
        test can only pass on an object whose n happens to be a multiple
        of p -- an incidental fact about that object's degenerate-
        stratum count, unrelated (as far as anyone has shown) to G_R or
        to any deep structural law. A quantity that does not require
        this coincidence to even be testable is the fair way to ask
        whether object 1's exact match reflects anything beyond n_1 ≡ 0
        (mod 101).

  counterexample_or_mutation: >-
    A concrete, checkable, and (to my knowledge) previously unstated
    structural fact, derived independently from the already-archived
    raw-result.json and EV-MONO-344589: object 2's n_VR_nondegenerate=
    10005 factors as 3*5*23*29 and has NO factor of 101, whereas object
    1's n_VR_nondegenerate=9999 factors as 3^2*11*101 and IS a multiple
    of 101 (9999/101=99 exactly). Since a reduced fraction's denominator
    must divide its original denominator, 1523/10005 (already in lowest
    terms, gcd(1523,10005)=1, confirmed by factoring both) can NEVER
    equal k/101 for ANY integer k -- not "does not," but CANNOT, as a
    matter of elementary number theory, independent of what the true
    split count is or what G_R actually is. The specific mechanism that
    let object 1's R3 reduce cleanly to 17/101 (1683=99*17, 9999=99*101,
    the common factor 99 cancels) is therefore revealed to hinge on an
    INCIDENTAL fact about that one curve/R's own degenerate-point count
    (which determines n mod 101) -- a quantity with no established
    connection to G_R or to V_R's deeper arithmetic -- rather than on any
    property of the surface that would be expected to recur at a
    differently-shaped n. This is a materially stronger basis for "the
    first exact match was very likely a coincidence" than a bare
    non-match would be, because it names WHY object 1's denominator
    happened to expose a clean p-only fraction and shows that precondition
    (101 | n) simply does not hold on object 2, so the SAME literal test
    never had a fair chance to repeat here. It does not, by itself, fully
    settle the question: a THIRD object where 101 | n again (giving the
    literal form a fair second trial) or, better, the reformulated
    n*R3-n/6 quantity from required_controls (which sidesteps the
    denominator coincidence entirely) is still needed before the
    "coincidence, not a law" reading can be stated with full confidence.
    This mutation (the divisibility check) was performed in this review;
    the further panel/ladder trials it recommends were not (out of
    budget/scope for a review-only session) and are named as the next
    concrete action.

  baseline_comparison: >-
    Not an ECDLP attack, cost, or exponent claim, and this report does
    not dispute that scoping (execution_report's own claim_scope,
    hypothesis's own claim_boundary_and_test_boundary, and specification's
    own what_this_is_not are internally consistent and correctly
    disclaimed). dominated_by (Pollard rho, O(sqrt(N)) time / O(1) memory,
    every prime-field axis) and sota_delta=0, already recorded upstream in
    IDEA-20260904-a1b81b, are unchanged by either outcome of this
    experiment and are not contested here. Unchanged from RT-20260904-001's
    own finding on this point.

  heuristic_challenges:
    - id: H1-CHEB-EXTENSION-TO-R3
      target: >-
        HEUR-CHEB-1 (H-MONO-572e7e's own H1 -- Frobenius equidistribution
        over G_R, error "O(p^-1/2) relative")
      challenge: >-
        The task asks whether the relative-error framing "applies cleanly
        to a DENSITY (a ratio of two Weil-bounded point counts) or whether
        deriving its correct form requires more care." I worked this
        through explicitly. Write split_count = n/6 + D (D the absolute
        deviation of the split count from exactly one sixth of the
        ACTUAL total n, not of p^2); then R3-1/6 = D/n identically, by
        algebra alone, with no Weil bound needed for this step. If a
        hypothetical effective nonabelian-Chebotarev/Deligne-equidistribution
        bound gave |D| = O(p^1.5) (the SAME leading power as the total-
        count Lang-Weil term HEUR-IRR-1 already invokes, an ADDITIONAL,
        separate assumption not established anywhere in this program's
        records), then R3-1/6 = O(p^1.5)/n = O(p^1.5)/p^2 = O(p^-0.5)
        ABSOLUTE on R3 itself -- notably NOT (1/6)*O(p^-0.5) as the
        "relative" framing states. At p=101 these differ by exactly the
        factor 6: an absolute-O(p^-0.5) bound using the SAME implied
        constant (3) HEUR-IRR-1's own envelope quotes gives 3*0.0995=
        0.2985 (vacuous, cleared by anything), while the relative framing
        folds the 1/6 into the bound, giving 0.0166 (informative,
        comfortably but not loosely containing the observation). So
        propagating two separately-Weil-bounded quantities through a
        ratio does NOT automatically reproduce the "relative" shape --
        it can just as easily produce a much LOOSER absolute bound,
        depending on an unverified assumption (that the split-count
        sub-locus's own error term shares the total count's leading
        power and constant). The genuinely correct way to get the
        "relative" shape is the OTHER route: state the bound directly on
        the density via an effective Chebotarev-type theorem for the
        specific S_3-cover W_R -> V_R (the way such theorems are actually
        proven in the literature I am aware of, via a normalized
        character-sum/trace-function bound, not by separately bounding
        numerator and denominator and dividing) -- but NO such theorem
        has been stated with checked hypotheses or an explicit constant
        for this specific cover, in either this record or H-MONO-572e7e.
        Additionally, R3 asks about the IDENTITY conjugacy class
        specifically (1 of 3 classes: {e}, 3 transpositions, 2
        three-cycles), a materially harder object than R1's binary sign
        character: R1's partial derivation (RT-20260904-001's
        H1-challenge) used an explicit degree-4 double cover D built from
        the quadratic character disc(g); the analogous construction for
        R3 would need the full 2-dimensional standard representation of
        S_3 (equivalently, the FULL connected cover W_R, or a cubic-
        resolvent-type auxiliary variety), which no record in this
        program constructs. My conclusion: HEUR-CHEB-1's relative-O(p^-1/2)
        framing is the theoretically BEST-MOTIVATED shape available (it
        matches how genuine equidistribution theorems for varieties are
        conventionally stated, and it comfortably -- if narrowly on this
        object -- contains the data), but it is an UNVERIFIED heuristic
        extrapolation for R3 specifically, one step further from a
        concrete derivation than R1's own (already conditional/circular,
        per RT-20260904-001) case. Neither this report nor its
        predecessor derives it with a checked hypothesis and constant.
    - id: H2-IRR-CONTINUED
      target: HEUR-IRR-1 (|V_R(F_p)|=p^2(1+O(p^-1/2)), "NONE OFFERED"
        rigorous support)
      challenge: >-
        |V_R'(F_101)| - p^2 = 10200-10201 = -1, essentially identical in
        magnitude (though opposite sign) to object 1's own +1 deviation.
        Two objects both landing within |deviation|=1 of a loose envelope
        of ~3045 is, exactly as RT-20260904-001 already cautioned for the
        first instance, a very low bar (clearable by almost any
        well-behaved surface) and should not be read as meaningful
        positive evidence for irreducibility beyond "not obviously
        reducible at either instance so far." I note it only because
        H-MONO-403c01 does not explicitly restate this check, and two
        near-identical tiny deviations (opposite sign) is at least
        consistent with, though far from confirming, a well-behaved
        surface at both objects.

