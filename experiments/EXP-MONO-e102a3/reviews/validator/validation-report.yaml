  metric_recomputations:
    - metric: "curve E' (A,B,p,order,trace,j,ordinary)"
      reported: {A: 1, B: 2, p: 101, order: 100, trace: 2, j: 4, ordinary: true}
      recomputed: {A: 1, B: 2, p: 101, order: 100, trace: 2, j: 4, ordinary: true}
