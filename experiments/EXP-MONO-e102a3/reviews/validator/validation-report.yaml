    - "Stage 1 (nearby-object controls) and Stage R8 (m=3 baseline) were read and their reported PASS/exact-match results are noted, but were not independently re-derived by this Validator, per this task's own explicitly reduced scope (both are unchanged, already-verified pipeline elements per the review_plan's own framing)."
    - "This is a toy-scale (p=101, two curves/R now, one prime) receipt; no claim of any kind about cryptographic-scale ECDLP, relation-rate exponents, or index-calculus cost follows from this report, per the frozen specification's own claim_ceiling."
    - "A 'passed' verdict here means J1's and J2's own artifacts, curve/point re-verification, and Stage-0 census recomputation are admissible and internally consistent, and match the archived numbers exactly under independent code and an independent classification method. It does not authorize interpreting the R3 deviation in either direction, does not decide H-MONO-403c01's status, and does not by itself close or amend the specification -- those remain Coordinator acts, pending the Red Team's J3/J4."

