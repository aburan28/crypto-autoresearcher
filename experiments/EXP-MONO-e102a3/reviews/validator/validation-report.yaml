validation_report:
  id: VAL-20260904-da6453
  task_id: TASK-20260904-a17443
  experiment_id: EXP-MONO-e102a3
  hypothesis_id: H-MONO-403c01
  run_ids:
    - RUN-MONO-e102a3-1

  scope_statement: >-
    This report addresses ONLY the two joints assigned to the Validator by
    TASK-20260904-a17443's review_plan: J1-SECOND-OBJECT-VERIFICATION and
    J2-R3-EXACT-COMPARISON. J3 (the correct error model for judging V_R's
    own deviation from the naive S_3 asymptote) and J4 (overall reading of
    H-MONO-403c01 given J3) are the Red Team's joints and are NOT assessed
    here. No verdict is offered on whether this second object constitutes
    "real progress toward S_3" or on H-MONO-403c01's status -- that
    synthesis is the Coordinator's, after both reports are filed.
    blind_rederivation.required is false for this task (unlike
    EXP-MONO-bb6fa1's own review round), and the dispatching task message
    itself named the target numbers to confirm, so this is an ordinary
    (non-blind) independent verification, not a blind rederivation.

  # ============================================================ J1
  j1_second_object_verification:
    method: >-
      Entirely fresh code, written by the Validator, reusing NONE of
      run_galois_cubic_census_v2.py's or run_galois_cubic_census.py's
      functions (no shared pt_add/pt_mul/curve_order/j_invariant/
      classify_cubic/find_VR_points/specialize_at_T0 calls). Curve
      arithmetic (point add/double/scalar-mul, modular inverse via
      Fermat's little theorem rather than pow(x,-1,p)), point counting
      (Legendre-symbol sum), the j-invariant formula, and the true-order
      confirmation (factor the claimed order, reduce at each prime
      factor) are all independently implemented. The cubic-type
      classifier is a DIFFERENT method from the Executor's
      discriminant-formula classifier: pure ROOT-COUNTING over F_101 (0
      roots -> irreducible; 3 roots -> split; 2 roots -> forced [1,2]
      multiplicity -> degenerate; 1 root -> synthetic-divide out the
      root and check whether the quotient vanishes at that same root
      (triple root -> degenerate) or has a nonsquare discriminant
      (genuine one_plus_two), with an internal assertion that a nonzero
      SQUARE quotient discriminant can never occur when only 1 root was
      found (would force >=2 roots) -- this assertion fired zero times
      across all 10200 V_R' points, itself a nontrivial cross-check that
      the classifier logic is internally consistent). The only artifact
      reused is the frozen, already-symbolically-verified
      s4_symmetric_coeffs.json table (read-only, sha256-checked below);
      the specialization-at-T0 and (e1,e2,e3) enumeration were
      independently re-coded (a flat term accumulation, not the
      Executor's nested-bucket structure, though both are the same
      "direct enumerate e3 over all p values, never solve for it"
      discipline the frozen contract requires).
      Both scripts written to
      /private/tmp/claude-501/-Volumes-SSD990-crypto-autoresearcher/655992ba-4699-434f-a2ad-3a4774fe7a8d/scratchpad/validator_j1.py
      (scratchpad only, not a repository artifact).
    curve_check:
      independently_computed: {A: 1, B: 2, p: 101, order_via_Legendre_sum: 100, trace: 2, j_invariant: 4}
      archived: {A: 1, B: 2, p: 101, order_E: 100, trace: 2, j_invariant: 4}
      matches: true
      ordinary_confirmed: >-
        trace=2, 2 mod 101 != 0, so E' is ordinary (standard criterion for
        p>3: supersingular iff trace ≡ 0 mod p). Independently confirmed,
        not merely re-asserted.
    point_R_check:
      on_curve_independently_checked: true
      claimed_true_order: 50
      order_confirmation_method: >-
        Factor 50 = 2^1 * 5^2. Confirmed 50*R' = O (identity), then for
        each prime factor q in {2,5}, confirmed (50/q)*R' != O. This is
        the standard "reduce at every prime factor" order-confirmation
        algorithm; 50 was never assumed.
      result: >-
        50*R'=O; 25*R' != O; 10*R' != O -- TRUE order of R' is exactly
        50, independently confirmed. Order 50 > 2, so R' is not in E'[2].
      matches_archived: true
    supplementary_non_cherry_picking_check:
      note: >-
        Not explicitly required by J1's checklist, but cheap and directly
        useful: re-ran the SAME declared ascending (A,B) scan rule from
        scratch (independent code) and confirmed the first two admissible
        hits are exactly (A=1,B=1,j=34,order=105,trace=-3) then
        (A=1,B=2,j=4,order=100,trace=2) -- i.e. E' genuinely is "the next
        admissible curve after the first", not a hand-picked curve.
        Also independently confirmed generator G'=(6,27) has true order
        100 (factor 100=2^2*5^2, reduce at each prime) and that
        2*G'=(53,82)=R' exactly, confirming R' was derived by the
        declared rule (R'=kG', k=2).
      first_hit_reproduced: {A: 1, B: 1, j: 34, order: 105, trace: -3}
      second_hit_reproduced: {A: 1, B: 2, j: 4, order: 100, trace: 2}
      generator_true_order_confirmed_100: true
      two_times_G_equals_R_confirmed: true
      matches_archived: true
    stage0_census_independent_recomputation:
      n_VR_total: {independent: 10200, archived: 10200, matches: true}
      n_degenerate: {independent: 195, archived: 195, matches: true}
      n_nondegenerate: {independent: 10005, archived: 10005, matches: true}
      type_counts:
        split: {independent: 1523, archived: 1523, matches: true}
        one_plus_two: {independent: 5046, archived: 5046, matches: true}
        irreducible: {independent: 3436, archived: 3436, matches: true}
        degenerate: {independent: 195, archived: 195, matches: true}
      R1_disc_square_rate_exact: {independent: "57/115", archived: "57/115", matches: true}
      R2_one_plus_two_density_exact: {independent: "58/115", archived: "58/115", matches: true}
      R3_split_density_exact: {independent: "1523/10005", archived: "1523/10005", matches: true}
      irreducible_density_exact: {independent: "3436/10005", archived: "3436/10005", matches: true}
      note: >-
        Every reported quantity matches the archived raw-result.json /
        execution_report.yaml EXACTLY (integer counts and reduced
        fractions.Fraction values), obtained via a fully independent
        enumeration and a fully independent (root-counting, not
        discriminant-formula) classifier. This is exact agreement
        between two mathematically DIFFERENT classification methods, not
        just a re-run of the same code -- the discriminant-square rate
        R1 was derived without ever invoking a discriminant formula at
        all (split and irreducible are the disc-square strata purely by
        Frobenius-parity of the cycle type; one_plus_two is the disc-
        nonsquare stratum), so this is genuine independent corroboration
        of the Executor's disc-formula-based classifier, not a repeat
        measurement with the same instrument.
    proves_too_much_control:
      statement: >-
        Per the review_plan's own proves_too_much block, R1+R2=1 is a
        pure combinatorial identity (split+one_plus_two+irreducible
        exhausts the non-degenerate population, and R1=split+irreducible,
        R2=one_plus_two, so R1+R2 = (split+irreducible+one_plus_two) /
        nondegenerate = 1 identically) that must hold on ANY curve/R,
        independent of the true Galois group. This is a sanity check on
        the classifier's continued correctness on a new object, not
        evidence about G_R'.
      independently_recomputed: "57/115 + 58/115 = 115/115 = 1"
      result: PASSED. Confirmed exactly via fractions.Fraction, as required.
      per_failure_signature: >-
        Per the review_plan's failure_signature, had this NOT held
        exactly, it would indicate a bug in the classifier or in this
        Validator's own method -- it did hold, on the first try, with no
        adjustment.
    full_reexecution_reproducibility_check:
      note: >-
        Not one of the two named joints, but directly useful evidence of
        non-fabrication: re-executed the ACTUAL frozen script
        (run_galois_cubic_census_v2.py) from the exact recorded command
        in command.txt (output redirected to a scratchpad path, no
        repository file touched or overwritten), and diffed the result
        against the archived raw-result.json field-by-field.
      result: >-
        IDENTICAL in every field except wall_seconds/cpu_seconds/
        peak_rss_bytes (expected hardware-timing variance: 6.3s vs 6.3s
        wall, 21659648 vs 21463040 bytes RSS). Every curve-selection,
        generator, R8, Stage-1, and Stage-0 field -- including all exact
        Fraction strings -- reproduced bit-for-bit. stderr.log was empty
        in both runs. This confirms raw-result.json is the actual,
        reproducible output of the frozen script, not a hand-edited or
        fabricated artifact.
      verdict: HOLDS.

  # ============================================================ J2
  j2_r3_exact_comparison:
    method: "Python fractions.Fraction exact rational arithmetic; cross-multiplication as the task specifies."
    cross_multiplication:
      "1523_times_101": 153823
      "17_times_10005": 170085
      equal: false
    exact_fraction_check:
      observed_R3: "1523/10005"
      target: "17/101"
      equal: false
    exact_difference_reduced_fraction: "-16262/1010505"
    difference_verification: >-
      1523*101 - 17*10005 = 153823 - 170085 = -16262 (numerator);
      lcm(10005,101) = 1010505 since gcd(10005,101)=1 (101 is prime and
      does not divide 10005 = 3*5*23*29). Factored the reduced fraction
      independently: numerator 16262 = 2*47*173; denominator 1010505 =
      3*5*23*29*101. No common prime factor, so -16262/1010505 is
      already in lowest terms (also confirmed automatically by Python's
      Fraction, which always stores in reduced form).
    verdict: >-
      CONFIRMED. R3=1523/10005 does NOT equal 17/101 exactly on this
      second object, by exact-fraction cross-multiplication (not
      floating point). This matches the archived
      `r3_equals_17_over_101_exact.matches_exactly: false` and the
      Coordinator's own prior spot-check in the review_plan.

