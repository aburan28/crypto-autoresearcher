  revision_and_dirty_tree: >-
    This Validator's own task environment explicitly instructed: "do not
    run any git commands, do not commit, do not push." That instruction
    was followed exactly -- no git status/log/show/diff was run at any
    point in this review. Consequently commit reachability and
    working-tree dirty-state were NOT independently checked here.
    Content-hash verification (sha256) was performed instead against
    every declared artifact (see artifact_checks above) and matched
    exactly, per this program's own "archive receipts bind to content
    first" doctrine. A full re-execution of the frozen script from the
    exact recorded command also reproduced raw-result.json bit-for-bit
    (see full_reexecution_reproducibility_check above), which is
    stronger evidence of non-fabrication than a commit-sha check alone
    would provide.
    FLAG FOR THE COORDINATOR: manifest.yaml's `code.commit` field already
    contains a full 40-hex-character value
    (d8c149d20ad4ed6dc138e0ea1cacd6d40004b3f1), while the adjacent
    `code.commit_note` field states in the same file that the commit was
    "NOT RECORDED BY THE EXECUTOR ... To be filled in by the Coordinator
    at archive time via a read-only ref read of the branch tip
    immediately before the archive commit." These two statements are in
    tension: either the Coordinator has already filled this field in (in
    which case the note is stale and should be updated to say so), or
    the field holds a value that was never verified against an actual
    branch tip (in which case it should not read as a real, checked
    commit sha). This Validator was directed not to run git and so could
    not resolve which is true; it is reported here as a disclosed,
    unresolved inconsistency for the Coordinator to reconcile before
    treating this run's `code.commit` field as verified.

