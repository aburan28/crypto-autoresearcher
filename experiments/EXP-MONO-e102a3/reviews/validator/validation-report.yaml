    - metric: "Stage 0 |V_R'|, R1, R2, R3, irreducible density (exact fractions)"
      reported: {n_VR_total: 10200, R1: "57/115", R2: "58/115", R3: "1523/10005", irreducible: "3436/10005"}
      recomputed: {n_VR_total: 10200, R1: "57/115", R2: "58/115", R3: "1523/10005", irreducible: "3436/10005"}
      matches: true
      method_independence: "different classifier (root-counting vs discriminant formula), different enumeration code"
    - metric: "R1+R2 identity"
