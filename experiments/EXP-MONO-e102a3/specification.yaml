experiment:
  id: EXP-MONO-e102a3
  version: 1
  status: approved
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-09-04'
  hypothesis_id: H-MONO-403c01
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  coordinator_approval_rationale: >-
    APPROVED. DEC-20260904-7dabde's own named next_action: a second
    object at the same prime, isolating curve/R-dependence and directly
    testing whether the striking R3=(p+1)/(6p) exact match reproduces.
    Reuses EXP-MONO-bb6fa1's own already-independently-verified pipeline
    unmodified except for (a) a different, declared curve/R selection
    and (b) the corrected Stage-1 exact-tolerance criterion per
    CORR-20260904-8cc20f. Seconds of compute, per the prior run's own
    measured 6.4s wall time.

  title: >-
    Second-object replication: does the m=4 residual-cubic Galois group
    measurement (excludes trivial/C2/A3, consistent with S3) and the
    R3=(p+1)/(6p) exact match reproduce on a different curve and point at
    the same prime p=101?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection.
    - Not an ECDLP cost, runtime, or exponent claim, per H-MONO-403c01's own claim_boundary.
    - Not a p-ladder check (different prime) -- that is IDEA-20260904-a1b81b's own R7, named as separate future scope.
    - Not the full multi-curve/multi-R Stage 2/3 scope of IDEA-20260904-a1b81b.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: whether a SECOND (curve,R) at p=101 also excludes named
      rivals and is consistent with S_3, and whether R3 also equals
      17/101 exactly. Two consistent objects is a real step toward
      confirmation, not confirmation; a match on R3's own exact value on
      a genuinely different object would be a striking, reportable
      finding warranting a dedicated derivation attempt.
    what_no_outcome_can_support: >-
      No outcome supports any relation-rate, cost, exponent, or
      cryptographic-scale claim, per IDEA-20260904-a1b81b's own
      interpretation_limits, unchanged.

  inputs:
    construction_reused: >-
      EXP-MONO-bb6fa1's own already-independently-verified enumeration
      method (symmetric-coordinate census of V_R, avoiding the ordered-
      variety trap) and this program's own S_4 resultant recursion
      (experiments/EXP-MONO-815525/implementation/derive_s4.py),
      reused unmodified.
    domain: EXP-MONO-e102a3/v1
    curve_and_point: >-
      p=101 (SAME prime as EXP-MONO-bb6fa1, deliberately). Curve: the
      SECOND ordinary curve with j not in {0,1728} found by the SAME
      ascending (A,B) scan rule EXP-MONO-bb6fa1 used, continuing PAST the
      first curve it already found (E:y^2=x^3+x+1, A=1,B=1) rather than
      restarting the scan -- i.e. resume the identical declared scan
      order from where it left off and take the NEXT admissible curve.
      Point R': generated by the same rule (R'=kG' for the smallest k>=2
      giving a point provably not in E'[2], true order computed and
      asserted, not assumed).
    stage_1_tolerance_correction: >-
      Per CORR-20260904-8cc20f: both nearby-object controls (the
      synthetic A_3 object and the unconstrained object) are compared
      against their EXACT closed-form finite-p triples -- (p-2)/(3p),0,
      2(p+1)/(3p) and (p-2)/(6p),1/2,(p+1)/(3p) respectively at p=101 --
      with ZERO TOLERANCE (exact equality expected, since both are
      exhaustive deterministic censuses with no sampling error), NOT the
      flawed asymptotic-plus-3-standard-error band EXP-MONO-bb6fa1's own
      specification used.

  stage_order:
    stage_0:
      name: "the cheapest decisive discriminator (R1/R2/R3), on the new object"
      compute: seconds
      description: >-
        Identical to EXP-MONO-bb6fa1's own Stage 0, on the new curve/R.
        Report |V_R(F_101)|, R1 (disc-square rate), R2 (1+2 density), R3
        (split density), irreducible density, and every degenerate
        stratum count separately.
    stage_1:
      name: "mandatory nearby-object controls, CORRECTED exact-tolerance gate"
      compute: seconds
      description: >-
        Run the identical classifier on the same two synthetic objects
        (they do not depend on the curve or R, only on p, so re-running
        them is a cheap re-confirmation, not wasted work) and confirm
        EXACT equality (zero tolerance) with the closed-form triples
        above. If either fails to match EXACTLY, STOP and report a
        specification_error -- this would mean either the classifier or
        the closed form itself has a bug, since both were already
        independently verified by two reviewers in EXP-MONO-bb6fa1's own
        review round.
    stage_r8:
      name: "m=3 baseline reproduction check (free, symbolic)"
      compute: seconds
      description: Identical to EXP-MONO-bb6fa1's own R8. Must reproduce DEC-20260904-8c2580's own identity exactly.

  metrics:
    primary:
      - "R1, R2, R3, irreducible density on the new object's own V_R (exact fractions)"
      - "R3_matches_17_over_101: boolean, whether the new object's own R3 equals EXACTLY 17/101"
    secondary:
      - "|V_R(F_101)| against the Lang-Weil expectation p^2=10201"
      - "Stage-1 control results (must be EXACT matches this time, not merely 'close')"
      - "R8 pass/fail"
      - "every degenerate-stratum count, reported separately"

  preregistered_prediction:
    - quantity: R1, R2, R3, irreducible density
      value: "Consistent with S_3 (R1~0.5, R3~1/6, irreducible~1/3), excluding trivial/C2/A3, EXPECTED but not asserted as certain -- a genuinely different outcome on this second object is itself informative and must be reported plainly."
      formula: "Chebotarev density triple for S_3 (or, if it recurs, an as-yet-undetermined but checkable alternative)."
      source: IDEA-20260904-a1b81b mechanism; H-MONO-403c01.
    - quantity: R3_matches_17_over_101
      value: >-
        NOT PREDICTED EITHER WAY -- this is an open, two-sided question
        the idea record itself never anticipated. A match is a striking
        positive finding; a non-match (even while remaining close to
        1/6) is a normal, expected outcome showing the first match was
        object-specific. Neither is a failure of this experiment.
      formula: "17/101 = (p+1)/(6p) at p=101, per EXP-MONO-bb6fa1's own disclosed observation."
      source: EV-MONO-344589 (EXP-MONO-bb6fa1's own Red Team finding).

  replication:
    planned_runs: 1
    seeds: [20260904009]
    interpretation: Deterministic once the curve/R and enumeration order are fixed.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 900
    maximum_cpu_seconds: 900
    maximum_peak_rss_bytes: 134217728
    maximum_total_disk_bytes: 10485760
    maximum_workers: 1
    no_network: true

  environment_preconditions:
    consequence: NO CAS REQUIRED beyond this program's own already-built S_4 resultant recursion (reused read-only). Pure Python otherwise.
    if_a_precondition_fails: A missing interpreter or arithmetic exception is `failed_infrastructure`, never negative mathematical evidence.

  infrastructure_failure_disposition: >-
    Any crash is recorded with its exact cause and classified
    `failed_infrastructure`. Supports and weakens NOTHING about
    H-MONO-403c01 or IDEA-20260904-a1b81b.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - Stage 1's two controls MUST match their exact closed-form triples EXACTLY (zero tolerance). Any mismatch is a specification_error -- stop.
    - R8 must pass exactly (S2). If not, stop and report specification_error.
    - Never enumerate the ordered variety W_R (solve-for-e3) as the primary method.
    - Do not choose the curve/R by any rule other than "resume the same declared scan, take the next admissible curve after the first."

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Enumerating via solve-for-e3 as the primary method.
    - Reporting R1/R2/R3 without both corrected Stage-1 control results alongside them.
    - Selecting the curve/R by re-running the scan from scratch and picking a DIFFERENT admissible curve than "the next one after the first" (which would be an undisclosed, unprincipled choice).

  success_criterion: >-
    A run is well-formed evidence if: both Stage-1 controls are reported
    with exact match/mismatch against the corrected closed-form standard;
    R8's result is reported exactly; and Stage 0's R1/R2/R3 and the
    R3=17/101 check are reported exactly, whatever they show.

  falsification_criterion: >-
    Per H-MONO-403c01's own falsification_condition: a triple matching no
    named subgroup (with controls passing) is an anomaly; R3 != 17/101
    falsifies the curve/R-independent-law reading of that specific
    observation without necessarily falsifying the broader S_3-
    consistency question.

  outcomes:
    reproduces_s3_consistency_and_r3_exact_match: >-
      Both the S_3-consistency reading AND R3=17/101 exactly reproduce on
      the new object. A striking result warranting a dedicated derivation
      attempt for the exact law, and real movement toward confirming
      G_R=S_3 across two objects.
    reproduces_s3_consistency_only: >-
      Named rivals excluded and consistent with S_3 again, but R3 does
      NOT equal 17/101 exactly (though it may still be close to 1/6).
      The EXPECTED, unremarkable outcome under the "the first exact match
      was object-specific, not a law" reading -- still real progress
      toward confirming S_3 across two objects.
    does_not_reproduce_s3_consistency: >-
      The new object's own triple matches a different named rival, or no
      named subgroup at all. A genuinely surprising, reportable finding
      requiring investigation of whether the two objects differ in some
      relevant way (e.g. torsion structure, j-invariant proximity to
      0/1728) that the idea's own design did not anticipate.
    specification_error: >-
      Stage-1 controls or R8 fail to match exactly. Since both were
      already independently verified correct in EXP-MONO-bb6fa1's own
      review round, this would indicate a NEW implementation bug in this
      run's own adaptation, not a repeat of the prior tolerance defect.
    infrastructure_or_construction_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Toy scale, two objects now, one prime. Still far short of the
      general "for all ordinary E, for all R" claim H-MONO-572e7e's own
      parent idea makes; a p-ladder check (different primes) remains
      separate future scope.

  required_artifacts_if_later_authorized:
    - Frozen approved specification (this file).
    - Both corrected Stage-1 control results (exact match/mismatch).
    - R8's result.
    - Run manifest, command, environment, raw-result.json with exact R1-R3, irreducible density, and the R3=17/101 check.
    - Independent Validator + Red Team review before any citation alongside H-MONO-572e7e's own or IDEA-20260904-a1b81b's own broader claim.

  approval_requirements:
    - This contract is DEC-20260904-7dabde's own named next_action.
    - Independent review confirms the curve/R selection followed the declared "resume scan, next admissible curve" rule and the corrected Stage-1 tolerance is applied exactly.

  approval_status: >-
    APPROVED 2026-09-04 by the Coordinator; see `coordinator_approval_rationale` above.

  source_refs:
    - ledger/hypotheses/H-MONO-403c01.yaml
    - ledger/hypotheses/H-MONO-572e7e.yaml
    - ledger/evidence/EV-MONO-344589.yaml
    - ledger/decisions/DEC-20260904-7dabde.yaml
    - ledger/corrections/CORR-20260904-8cc20f.yaml
    - experiments/EXP-MONO-bb6fa1/implementation/run_galois_cubic_census.py
    - experiments/EXP-MONO-815525/implementation/derive_s4.py

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
