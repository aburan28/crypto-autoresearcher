experiment:
  id: EXP-ICINV-b22e97
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-0ff796
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE WITH A NAMED OBSTRUCTION: length-2 relation yield and factor-base decomposition
    probability are EXACT isogeny-class invariants in the mean, because the Semaev relation locus
    S_3(x1, x2, x(R)) = 0 is an F_p-isomorphic copy of E itself, so its F_p-point count is p + 1 -
    t and every observed within-class difference must be sampling noise, box-localisation error, or
    equation-choice (gauge) variation'
  status: draft
  objective: "(A) THE OBJECT. Fix E/F_p: y^2 = f(x) = x^3 + a x + b, non-singular, and a target point\
    \ R in E(F_p) with R not in E[2] and R != O. Define the RELATION LOCUS C_R as the affine plane\
    \ curve {(x1, x2) : S_3(x1, x2, x(R)) = 0}, where S_3 is the third summation polynomial (KN-TECH-002).\
    \ C_R has bidegree (2,2) in (x1, x2); the coefficient of x1^2 is (x3 - x2)^2 evaluated at x3 =\
    \ x(R), so the bidegree is exact and not accidental.\n(B) THE STRUCTURAL FACT, which is the whole\
    \ proposal. The map iota_R : E -> P^1 x P^1, P |-> (x(P), x(R - P)), is a morphism defined over\
    \ F_p whose image is exactly the closure of C_R. iota_R is INJECTIVE on geometric points away\
    \ from {O, R}: iota_R(P) = iota_R(P') forces P' = +-P and R - P' = +-(R - P); the case P' = -P\
    \ with P' != P forces either 2P = O (excluded because then P' = P) or 2R = O (excluded by hypothesis).\
    \ A smooth (2,2) curve on P^1 x P^1 has arithmetic genus (2-1)(2-1) = 1; a birational morphism\
    \ from the genus-1 curve E onto it therefore cannot lower the geometric genus, so the image is\
    \ smooth and iota_R is an ISOMORPHISM E -> closure(C_R) over F_p. The two points of E sent to\
    \ the boundary are P = O and P = R. Consequently\n    #C_R^{affine}(F_p) = #E(F_p) - 2 = p - 1\
    \ - t,\nwhich is a function of (p, t) ALONE and hence constant on the entire F_p-isogeny class.\n\
    (C) WHAT THAT CLOSES. For a factor base V of B x-coordinates drawn uniformly at random from F_p,\
    \ the expected number of ordered length-2 relations is\n    E[#(C_R cap (V x V))] = B^2 (p - 1\
    \ - t) / p^2 (1 + O(1/p)),\na function of (p, N, t) and B only. Therefore RELATION YIELD and FACTOR-BASE\
    \ DECOMPOSITION PROBABILITY at arity 2 have ZERO within-class variance IN THE MEAN. The DECOMPOSITION.md\
    \ section 5 prediction 1 (\"zero variance in relation yield\") is thereby upgraded from an expectation\
    \ to a derived statement, and the axis is closed FOR THIS FUNCTIONAL with the obstruction named:\n\
    \  NAMED OBSTRUCTION (O-YIELD): the mean relation count is the F_p-point\n  count of a curve that\
    \ is F_p-isomorphic to E, and point counts of curves\n  in an isogeny class are determined by\
    \ the class.\n\n(D) THE THREE RESIDUAL CHANNELS, all of which must be measured because each is\
    \ a rival explanation for any observed within-class spread:\n  (D1) SAMPLING NOISE. #(C_R cap\
    \ (V x V)) is a hypergeometric-type count\n    with standard deviation ~ sqrt(B^2/p). It does\
    \ not vanish; it decays\n    RELATIVE to the mean as B^{-1} p^{1/2}. This is the decay parameter.\n\
    \  (D2) BOX-LOCALISATION ERROR. For V an interval I, #(C_R cap (I x I))\n    deviates from |I|^2\
    \ (p-1-t)/p^2 by a Weil/Bombieri-type completion error\n    that this record carries as O(sqrt(p)\
    \ log^2 p) and marks [open] rather\n    than quoting as settled.\n  (D3) GAUGE. Under (x, a, b)\
    \ -> (u^2 x, u^4 a, u^6 b) with u in F_p^*,\n    S_3 is weighted-homogeneous of weight 8 (verified\
    \ by direct expansion:\n    each of the three grouped terms scales by u^8), so C_R transforms\
    \ by the\n    dilation (x1, x2) -> (u^2 x1, u^2 x2). A COORDINATE-DEFINED factor base\n    is\
    \ not carried along by that dilation, so the SAME curve written with a\n    different Weierstrass\
    \ equation gives a different yield. Gauge variance\n    is not class variance and must be separated\
    \ (IDEA-20260807-6eb96b).\n\n(E) WHAT IS NOT CLOSED, stated so this is a closure and not a fatigue\
    \ report. Arity m >= 3: S_4 and above define higher-dimensional loci whose point counts are NOT\
    \ immediately class-determined by this argument, and the argument must be redone or must fail\
    \ there. The VARIANCE and higher moments of the relation count, as opposed to its mean. The distribution\
    \ of relations over a STRUCTURED factor base, where (D2) dominates. And every functional that\
    \ is not a count: solving degree, rank profile, Fourier flatness. This record closes one functional,\
    \ at one arity, in the mean."
  resource_label: 'R1 (x-coordinates as field elements: the relation locus is a plane curve over F_p,
    not a set of group elements) + R2 (the curve equation: S_3''s coefficients are polynomials in
    (a, b)).'
  admissibility: admissible
  admissibility_argument: 'The tracked quantity is the F_p-point count of a plane curve determined
    by the Weierstrass coefficients. It is not the output of any group-operation oracle: an algorithm
    with only add/negate/equality on G cannot even name x1, x2 as field elements, let alone count
    solutions of a polynomial equation in them. The lane therefore escapes KN-FIND-b7e091 and H-ENDO-001,
    which close oracles whose outputs are group elements or scalars on a prime-order subgroup. NOTE:
    admissibility of the RESOURCE does not make the functional useful; this record''s conclusion is
    that the functional is constant, which is a closure, not an attack.'
  reachability_gate: 'T5 IS MOOT FOR THIS FUNCTIONAL AND THE RECORD SAYS SO EXPLICITLY RATHER THAN
    SKIPPING THE FIELD. If the mean yield is constant on the class, there is no minimiser to reach:
    every class member is optimal and the reachability question does not arise. The gate becomes live
    only in the falsification branch, where a class-dependent component of D2 is found; in that branch
    the reachability accounting of IDEA-20260807-c36472 applies verbatim (transport of a SPECIFIED
    class member costs Otilde(p^{1/4}) under standard heuristics and is therefore affordable against
    a p^{1/2} baseline, while IDENTIFYING the minimiser costs h ~ p^{1/2} functional evaluations and
    is not, unless goodness is common or locally detectable).'
  inputs:
    procedure: 'STAGE 0 (zero compute): external literature check for the (2,2)/genus-1 model of the
      S_3 relation locus; record whatever is found in knowledge/literature/ whether or not it supports
      the record. STAGE 1 (minutes, HARD GATE): symbolic verification of bidegree, weight-8 homogeneity
      and disc_{x3} S_3 = 16 f(x1) f(x2) in sympy. STAGE 2 (minutes, HARD GATE): the exact-integer
      regression fixture -- N_R(E) == p - 1 - t on >= 20 curves at p in {4001, 8191}, plus the E[2]
      nearby-object control which must DISAGREE. STAGE 3 (~1 hour): full class enumeration at p in
      [2^12, 2^14] by vectorised character table; bucket by trace; pick the three largest classes.
      STAGE 4 (hours): the four-arm yield measurement (common random V, interval V, gauge orbit, random-(2,2)-form
      null) across every member of those classes, sweeping B over >= 4 values. STAGE 5 (zero compute):
      fit the B-decay, compare class spread with gauge spread, record the closure or its failure.
      Stages 1 and 2 alone are sufficient to kill the record and cost minutes, which is why this is
      the cheapest item in the lane.'
    mechanism: 'STEP 1 -- SYMBOLIC VERIFICATION, ZERO COMPUTE, HARD GATE. Using sympy in harness/semaev.py:
      (i) confirm bideg_{x1, x2} S_3 = (2, 2) and that the coefficient of x1^2 is (x3 - x2)^2; (ii)
      confirm the weight-8 identity S_3(u^2 x1, u^2 x2, u^2 x3; u^4 a, u^6 b) = u^8 S_3(x1, x2, x3;
      a, b) as a polynomial identity in u, a, b, x_i; (iii) confirm the classical identity disc_{x3}
      S_3 = 16 f(x1) f(x2), which is stated here as a fact to be RE-DERIVED by the executor and not
      quoted. Any failure kills the record.

      STEP 2 -- FULL TOY ISOGENY CLASS ENUMERATION. Choose p in [2^12, 2^14]. Build a length-p table
      of quadratic characters chi(v) once. For every j in F_p, construct the curve E_j: a = 3j(1728
      - j), b = 2j(1728 - j)^2 (and handle j = 0, 1728 separately), count #E_j(F_p) = p + 1 + sum_x
      chi(f(x)) by one vectorised table lookup pass, and record its trace; do the same for the quadratic
      twist. Bucket by trace. Every bucket is a complete F_p-isogeny class. Expected class size ~
      h(t^2 - 4p) ~ sqrt(p) (tens of curves at p ~ 2^13), and the enumeration is one p x p character-table
      sweep, which is a few hundred million numpy lookups at p = 2^14.

      STEP 3 -- DIRECT COUNT OF THE RELATION LOCUS. For each class member and a transported target
      R, count N_R(E) = #{(x1, x2) in F_p^2 : S_3 = 0} by solving the quadratic in x2 for each x1
      (using disc = 16 f(x1) f(x_R) style evaluation, or simply evaluating S_3 as a quadratic in x2
      and testing the discriminant''s quadratic character). Cost O(p) per curve. PREDICTION FROM (B):
      N_R(E) = p - 1 - t EXACTLY, identically across the class, with no error term at all. This is
      a hard, exact, integer prediction -- the sharpest kind of falsifier available at this scale.

      STEP 4 -- THE FACTOR-BASE COUNT AND ITS THREE RESIDUALS. For each class member measure #(C_R
      cap (V x V)) for (i) V a common uniformly random subset of F_p of size B, IDENTICAL across class
      members (isolates class effect from V-choice); (ii) V an interval [0, W) (introduces D2); (iii)
      each of a sample of gauge representatives of the SAME curve (isolates D3). Sweep B over at least
      four values so the D1 decay B^{-1} p^{1/2} can be fitted rather than asserted.

      STEP 5 -- TRANSPORT CERTIFICATE. R must be the transported target, not an independently chosen
      point, or the comparison is between different problems. Compute an explicit ell-isogeny chain
      between class members with small ell (Velu on rational ell-torsion kernels found by factoring
      division polynomials at toy scale), transport (P, Q), and re-verify Q'' = [k]P'' by direct scalar
      multiplication in harness/toycurve.py. A failed re-verification is an infrastructure failure
      under AGENTS.md rule 5, never evidence.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - gauge orbit of a fixed class member (the matched null)
  - a common random factor base V shared across class members
  - R in E[2] (nearby object; the count MUST differ)
  - a random (2,2) form with matched support (the counter must distinguish)
  - independent recomputation of
  - transport certificate: Q' = [k]P' re-verified on every transported pair
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. THE MATCHED NULL IS THE GAUGE ORBIT:
    the same curve, same j, same t, same N, same End(E), written with (p-1)/2 different Weierstrass
    equations (a, b) -> (u^4 a, u^6 b). It has exactly the shape of the real arm (a set of curve equations
    with a coordinate-defined factor base) and differs from it in exactly one thing: it holds the
    isogeny class member fixed. THE DECAY PARAMETER IS B, the factor-base size: the D1 sampling channel
    must decay as B^{-1} p^{1/2} relative to the mean, and a within-class spread that does NOT decay
    when B grows is the canonical artifact tell (docs/inventor-protocol.md, KN-TECH-1a5b7e). SECOND
    NULL, for Step 3 only: the exact-count arm has NO sampling noise, so its forced value under the
    derivation is the integer p - 1 - t with spread exactly ZERO -- which means the exact-count arm
    is a MODE-1 null (a control that cannot fail) for anything except an outright error in (B), and
    it is run for exactly that purpose and reported as such, never as evidence of invariance of the
    yield functional. THIRD NULL: a random (2,2) form with the same support but coefficients drawn
    uniformly, whose F_p-point count is NOT p - 1 - t; the pipeline must distinguish it from S_3,
    or the counter is reading the shape and not the curve.'
  independent_variables: []
  metrics:
    primary:
    - exact integer N_R(E) per class member
    - '#(C_R cap (V x V)) per (curve, V-type, B), with V frozen by seed'
    - within-class, within-gauge and between-class variances at matched B
    - the fitted exponent of the B-decay of the relative spread
    secondary:
    - pass/fail of every gate control, reported before any yield number
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'N_R(E) = #{(x1, x2) in F_p^2 : S_3(x1, x2, x(R)) = 0}, for every member of one complete
      toy isogeny class, at fixed transported R'
    formula: 'EXACT INTEGER PREDICTION: N_R(E) = p - 1 - t for every member, with within-class variance
      EXACTLY ZERO. A single member differing by even 1 (after excluding E[2] targets) falsifies (B).
      This is not a statistical threshold; it is an identity.'
    source: pre-registered in IDEA-20260807-0ff796 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - TARGET CHOICE. Comparing curves at independently chosen targets compares different problems. R
    must be transported by an explicit isogeny with a re-verified certificate; this is the single
    most likely way to manufacture a fake within-class signal.
  - FACTOR-BASE CHOICE. A per-curve factor base (e.g. build_factor_base seeded by the instance in
    harness/semaev.py) makes V a function of the curve and confounds V-variance with class-variance.
    The common-V arm exists to remove this and is not optional.
  - GAUGE. The same curve has (p-1)/2 equations. Any comparison that does not fix or randomise gauge
    is measuring equation choice.
  - SMALL-p ARTIFACTS. At p ~ 2^12 the Weil error sqrt(p) is ~1.5% of p, so D2 is visible; at crypto
    scale it would not be. Trends in p must be reported, not a single p.
  - TRACE ZERO. t = 0 classes are supersingular over F_p and behave differently (the twist lies in
    the same class). Exclude or stratify.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'EXACT INTEGER PREDICTION: N_R(E) = p - 1 - t for every member, with within-class
    variance EXACTLY ZERO. A single member differing by even 1 (after excluding E[2] targets) falsifies
    (B). This is not a statistical threshold; it is an identity.'
  falsification_criterion:
  - Any class member with R not in E[2] gives N_R(E) != p - 1 - t. The structural fact (B) is false
    as stated; the record is SUPERSEDED, not amended, and the failure is itself the finding.
  - The symbolic weight-8 identity fails. The gauge analysis in (D3) is wrong and every gauge-null
    design in this lane (including IDEA-20260807-6eb96b) must be revisited.
  - The E[2] control returns p - 1 - t. The counter is not reading the geometry; nothing is reported.
  - Within-class relative spread at matched B exceeds gauge relative spread by more than 1.5x, or
    fails to decay in B. Then relation yield has a class-dependent component the derivation misses,
    the closure is withdrawn, and the lane gets a target instead.
  - Class enumeration at p = 2^14 exceeds the memory budget. INFRASTRUCTURE outcome under AGENTS.md
    rule 5; reduce p and record it as such, never as evidence about invariance.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
