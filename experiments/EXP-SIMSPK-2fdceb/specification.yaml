experiment:
  id: EXP-SIMSPK-2fdceb
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6125be; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6125be
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Round-count-resolved Kendall tau between optimal-differential and optimal-linear orderings
    of the SIMON rotation-constant space, with a random-constant null family and a label-shuffle band,
    computed exhaustively at word size 8 and under declared budgets above it
  objective: 'A run reduces exactly one uncertainty: whether the differential and linear orderings
    of the rotation-constant space carry the same information, and if not, where in round count and
    on which constants they diverge. Concretely it determines (i) the curve tau_b(r) with bootstrap
    confidence intervals, computed over uncensored orbit representatives at each reachable round count,
    together with the number of distinct weight values per measure per round so a reader can see whether
    tau had any resolution to work with; (ii) the same curve computed on a family of structurally
    identical ciphers with uniformly drawn rotation triples, delivered before the real family''s curve
    is interpreted, so that any statement about agreement is a statement about a difference from the
    null rather than about an absolute value; and (iii) the explicit membership of the top-decile
    disagreement set together with the standardized triple''s signed rank difference, which is the
    only region where jointly optimal and optimal-on-two-measures could be separated by any later
    evidence. The run also reports the censoring rate per cell and its correlation with weight, since
    an ordering assembled from budget-limited searches is an ordering of what the solver found easy
    until that number is on the table. No hypothesis is minted and no ranking is declared.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the pinned round-function
      form, at word size 8 exhaustively and at larger word sizes under the declared per-cell budget,
      over the orbit representatives actually scored, at round counts 1 through the largest reached,
      using the specific weight oracles named in the manifest, (a) a measured Kendall tau-b per round
      count with its bootstrap interval; (b) the same measured on the random-constant null family;
      (c) the label-shuffle independence band; (d) the censoring rate and its correlation with weight;
      and (e) an explicit list of the representatives with the largest rank disagreement. What does
      NOT follow: any claim that either ordering is correct, which depends on oracle validity established
      elsewhere; any claim that a constant is optimal, near-optimal, anomalous or unremarkable; any
      statement about margins, since ranks discard them; any transfer of the tau curve or of its maximum''s
      location to word sizes not run; anything about designer intent; and anything about the security
      of any SIMON variant at any round count.'
  inputs:
    procedure: 'STAGE 0, dependency check: confirm the differential and linear weight oracles have
      been validated by their own contracts, and record the validation record identifiers in the manifest;
      if either is unvalidated, the run proceeds only in the n = 8 exhaustive arm and every larger-n
      output is withheld. Cost: minutes. STAGE 1, orbit representatives: load the quotient table if
      the symmetry contract has run, otherwise use the raw grid and record the distortion explicitly.
      Cost: seconds. STAGE 2, exhaustive dynamic-programming trail search at n = 8 for both measures,
      all representatives, r = 1 through 6, no censoring by construction. Cost: roughly 10 to 40 minutes
      single core. STAGE 3, random-constant null family, 200 draws, identical pipeline at n = 8, reported
      before STAGE 5 is interpreted. Cost: comparable to STAGE 2. STAGE 4, label-shuffle null, 1000
      permutations. Cost: seconds. STAGE 5, tau computation with bootstrap, resolution counts, and
      disagreement-set extraction. Cost: seconds. STAGE 6, optional extension to n = 16 under branch
      and bound with a declared per-cell budget, every censored cell flagged, run only if STAGE 2
      shows usable resolution. Cost: bounded by the declared total ceiling and reported as a budget
      outcome if it binds.'
    instrument: CPython 3.11 standard library only; numpy, z3, python-sat and pulp are absent in this
      environment as of 2026-08-16 and Sage is excluded by contract, so both the exhaustive dynamic
      program and the Matsui-style branch-and-bound search are written directly against Python integers
      with explicit masking. Kendall tau-b, Spearman rho and the bootstrap are implemented from scratch
      in the standard library rather than taken from scipy, and their implementations are cross-checked
      against hand-computed values on a fixed 10-element fixture recorded in the run directory. Seeds,
      manifest and per-stage timing follow harness/runner.py conventions. Identifiers minted with
      tools/allocate_id.py --next.
    parameters: 'Primary arm at word size n = 8: 512 triples reduced to their orbit representatives,
      round counts r = 1 through 6, both measures, exhaustive dynamic programming over 2^{16} state
      differences per round. Null family: 200 uniformly drawn triples with a recorded seed, identical
      round counts. Label shuffle: 1000 permutations. Bootstrap: 1000 resamples of representatives.
      Resolution floor declared in advance at 8 distinct weight values, below which tau is reported
      as undefined rather than as a number. Optional extension at n = 16: orbit representatives of
      4096 triples, r = 1 through 12, per-cell budget 30 seconds, total stage ceiling 2400 seconds,
      every censored cell flagged with its budget. Total run ceiling 5400 seconds.'
  controls:
  - Random-constant family null, 200 uniformly drawn triples through the identical pipeline, reported
    before the signal arm.
  - Label-shuffle null, 1000 permutations of one ordering, giving the independence band for tau.
  - Exhaustive-search arm at n = 8, where no cell is censored, used to calibrate how much of any tau
    measured under branch-and-bound censoring at larger n is censoring artifact.
  - 'Tie-structure control: the number of distinct weight values per measure per round is reported
    alongside tau, since tau computed over an ordering with three distinct values is not a correlation
    in any useful sense.'
  - Alternative statistics, Spearman rho and tau-a, computed on the same data as a robustness check
    without substituting for the preregistered tau-b.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both run in the same invocation as the signal arm and through
    the identical pipeline. The primary null object is a family of structurally identical ciphers
    whose rotation triples are drawn uniformly at random from (Z/n)^3 with a recorded seed, scored
    by the same two oracles at the same round counts: this yields tau_null(r), the correlation the
    two measures exhibit when the constants carry nothing designed. For the signal arm to mean anything,
    tau_null(r) must be reported first and any claim about tau(r) must be stated as a difference from
    it, since a high tau on the real family is uninformative if the same tau appears on random constants.
    The secondary null is a label shuffle: permute the linear ordering''s labels within the real family,
    recompute tau over 1000 permutations, and report the resulting null band; the observed tau must
    lie outside that band for any statement of agreement to be made at all. If tau on the real family
    falls inside the shuffle band, the measures are uncorrelated at that round count and the joint-optimality
    distinction is maximally separable there, which is itself a positive and usable finding.'
  independent_variables:
  - round count r
  - measure (differential versus linear)
  - word size n
  - arm (real family, random-constant null, label-shuffle null)
  - search mode (exhaustive dynamic programming versus budgeted branch and bound)
  metrics:
    primary:
    - tau_b(r) with bootstrap confidence interval, real family
    - tau_b(r) with interval, random-constant null family
    - label-shuffle null band per r
    - distinct weight values per measure per round, the resolution metric
    - censored cell count per measure per round
    secondary:
    - Spearman rho and tau-a as robustness checks
    - signed rank difference per representative and the top-decile membership list
    - the standardized triple's signed rank difference per round
    - wall-clock seconds and peak resident memory per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The difference tau_b(r) on the real rotation-constant family minus tau_b(r) on the random-constant
      null family, evaluated at every round count reached, together with the location of the maximum
      of tau_b(r) on the real family.
    formula: 'tau_b = (C minus D) divided by the square root of ((C + D + T_x)(C + D + T_y)), where
      C is the number of concordant representative pairs, D the number of discordant pairs, T_x the
      number of pairs tied only in the differential ordering and T_y the number tied only in the linear
      ordering, computed over uncensored orbit representatives at a fixed round count. The predicted
      law is a shape rather than a value: tau_b(r) on the real family is predicted to be non-monotone
      with an interior maximum, and the predicted difference from the null is not pre-committed to
      a magnitude because the campaign has no prior measurement of either quantity and naming one
      would be fabrication. The resolution floor of 8 distinct values, below which tau is reported
      as undefined, is pre-committed and frozen before STAGE 2.'
    source: Pre-registered in the parent proposal IDEA-20260816-6125be before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The primary arm runs at word size 8 with block size 16 bits and round counts 1
      through 6, against a family whose deployed word sizes are 16, 24, 32, 48 and 64 at 32 to 72
      rounds. The choice is deliberate and is the inventor protocol''s validation-ladder step 2: word
      size 8 is the largest size at which both trail searches complete exhaustively, so the entire
      censoring confound is absent by construction and the tau measured there is a property of the
      measures rather than of a solver budget. The transfer assumption is stated and not made: neither
      the value of tau nor the location of its maximum is claimed to transfer to n = 16 or above,
      and the optional n = 16 extension exists precisely to measure that gap rather than to assume
      it. Any downstream use of this contract''s numbers at deployed word sizes must carry the transfer
      question as open.'
    correspondence: null
  tail_checks:
  - Round counts where either measure has fewer than the declared 8 distinct values are reported with
    tau marked undefined rather than with a number, and the count of such rounds is a headline metric.
  - Representatives whose weight is infinite, meaning no trail exists at that round count, are handled
    explicitly as a separate stratum rather than coerced to a large finite value.
  - The extreme tails of the disagreement distribution, the single largest positive and negative rank
    differences, are reported by name with their weights.
  - The first and last reachable round counts are reported separately since both are boundary regimes
    where tau behaves atypically.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort the n = 16 extension entirely if the n = 8 arm shows resolution below the declared floor
    at every round count, since the statistic would be undefined at larger sizes too.
  - Stop any branch-and-bound cell at its 30-second budget, flag it censored, and continue; never
    extend a cell's budget selectively because its neighbours completed.
  - Halt the run at 5400 seconds total and report the round counts and word sizes actually completed
    as a budget outcome.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run produces tau_b(r) with bootstrap intervals for the real family and for
    the random-constant null family at every round count where resolution exceeds the declared floor,
    together with the label-shuffle band, the censoring rates, and the explicit top-decile disagreement
    list including the standardized triple's signed rank difference.
  falsification_criterion:
  - Resolution below the declared floor of 8 distinct values at every reachable round count, making
    tau undefined throughout and the measurement impossible at this scale.
  - tau on the real family lying inside the label-shuffle band at every round count, refuting any
    redundancy between the measures.
  - tau minus tau_null within bootstrap noise of zero at every round count, a controlled null that
    removes the operational value of the comparison.
  - Monotone tau(r) across the whole reachable range, falsifying the predicted non-monotone shape.
  - Disagreement between the from-scratch tau-b implementation and the hand-computed fixture, which
    invalidates the statistic's implementation.
  - Censoring rate in the n = 16 extension exceeding the declared ceiling with a measured correlation
    to weight, in which case that extension's tau is withheld as uninterpretable rather than reported
    with a caveat.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6125be
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The differential and linear weight oracles must be validated by their own contracts before the
    larger-n arm can be interpreted; the Coordinator must decide whether this contract may run its
    n = 8 arm before that validation exists, since the exhaustive arm has its own ground truth but
    the oracle question is shared.
  - The resolution floor of 8 distinct values is a proposal-level choice and must be confirmed or
    replaced by the Coordinator before freezing; it determines where tau is declared undefined and
    cannot be moved afterwards.
  - Whether orbit representatives or the raw grid is used depends on whether the symmetry-quotient
    contract has run; the Coordinator must fix the choice and the record must state which was used,
    since the two give different taus.
  - The additive round-independence convention for composing trail weights is carried unverified by
    this contract and the Coordinator must decide whether it is separately established or permanently
    named as an assumption in every derived record.
