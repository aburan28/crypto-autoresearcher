experiment:
  id: EXP-SSI-a6132d
  hypothesis_id: null
  hypothesis_note: >-
    Deliberate null. This is a derivation/accounting contract for the admitted
    IDEA-20260806-9c2f80 proposal, not an executed test of a hypothesis and not
    a construction of an attack.
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-f68c05
  source_proposal: IDEA-20260806-9c2f80
  title: >-
    Stage 0/1 accounting contract for the classical per-prime OneEnd advice
    frontier, with a matched random-advice null

  objective: >-
    Freeze and, only after independent review and Coordinator authorization,
    evaluate the symbolic and concrete arithmetic of the proposal's closed
    construction list at log2(p) in {256, 512}. The output is a machine-readable
    table of (advice size S, per-instance query time T), exact control verdicts,
    and the physical-memory comparison. It must not implement isogeny walks or
    claim an attack, a lower bound over all advice, a security result, or an
    exponent improvement.

  claim_ceiling: >-
    At most a derivation about the named closed list and its declared accounting
    conventions. A valid package can show that the listed rows reproduce the
    pre-registered frontier and that the matched null behaves as forced. It
    cannot establish H-ADV-2 or H-ADV-3, cannot validate H-ADV-1, and cannot
    transfer toy or arithmetic output to crypto-scale security.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    frozen_source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    prior_evidence: ledger/evidence/EV-SSI-59f7a2.yaml
    prior_decision: ledger/decisions/DEC-20260805-596d71.yaml
    current_goal: ledger/goals/GOAL-SSI-001/goal.yaml
    duplication_refresh: coordination/goals/GOAL-SSI-001/batches/BATCH-f68c05/tasks/TASK-20260809-b28c39/duplication_knowledge_audit.md
    parameter_sets:
      log2_p: [256, 512]
      sigma: [0.0, 0.1666666667, 0.3333333333, 0.5, 0.6666666667, 0.8, 1.0]
      incumbent_memory_log2: 92.5
    arithmetic_convention: >-
      Exponents are exact rational values in the implementation; displayed
      decimal values are formatting only. S=0 is a distinguished no-advice
      case, not a division-by-zero row.

  closed_constructions:
    - id: A_known_endomorphism_database
      predicted: "S=p^sigma, T=p^(1-sigma) up to polylog factors"
      assumption: H-ADV-2
    - id: B_delta_screen
      predicted: "S=p^(1/2+3*theta/2), T=p^(1/2-3*theta/2)+p^theta"
      collision_note: >-
        At theta=1/5 this is (p^4/5,p^1/5) and collapses to A because the
        stored curves carry known orders.
    - id: C_three_way_p_only_middle
      predicted: "T=p/S^(1/2), strictly dominated by A for S>1"
    - id: incumbent_no_advice
      predicted: "T=p^(1/3+o(1)) at every S when advice is ignored"

  proof_search_map_audit:
    status: passed_for_bounded_closed_list_only
    bottleneck: growth of the resolution fiber |R(a)| per unit advice
    baseline_reproduction: >-
      S=0 must return the incumbent p^(1/3+o(1)) row; S=p^(1/2) must reproduce
      the MITM/Delfs-Galbraith balance embedding.
    observation_collision: >-
      The A/B collision at (p^4/5,p^1/5) is recorded and separated by whether
      the database curves carry their orders.
    quantifier_order: >-
      forall p exists A_p independent of E, |A_p|=S, forall supersingular E,
      query(A_p,E) resolves an endomorphism in T(S); incumbent is forall p
      forall E with no advice.
    method_ceiling: >-
      No all-advice lower bound is permitted. The nearby oriented/CSIDH-shaped
      control must not return the same flat frontier.
    proof_obligations:
      - "Construction A build/query charge and H-ADV-2 status"
      - "Resolution-fiber closure under a walked isogeny"
      - "Construction C middle-table size p^2/(X1^2 X2^2)"
      - "Algorithm 3 random self-reducibility scope"
      - "Composite min-row and monotonicity arithmetic"

  controls:
    - id: CTRL-S0
      kind: known_answer
      forced_result: "T=p^(1/3+o(1)); no advice hit is available"
      failure_action: terminate_without_treatment_rows
    - id: CTRL-RANDOM-ADVICE
      kind: matched_null
      order: before_treatment
      forced_result: "T=p^(1/3+o(1)) for every declared S"
      failure_action: invalidate_instrument_and_report_no_treatment
      matching: same_declared_size_access_model_and_query_budget
    - id: CTRL-S-P
      kind: known_answer
      forced_result: "S=p advice with every curve's order gives polynomial query"
    - id: CTRL-SHUFFLED-FIBER
      kind: negative_control
      forced_result: "permuted orders remove any claimed speedup"
    - id: CTRL-NEARBY-ORIENTED
      kind: nearby_object
      forced_result: >-
        The oriented/CSIDH-shaped object must not return the identical flat
        frontier; otherwise the claimed structure sensitivity is void.

  stages:
    - id: stage-0-symbolic
      purpose: exact construction rows, controls, and proof-map arithmetic
      method: pen_and_paper_plus_stdlib_serialization
      budget_seconds: 3600
      stop_rules:
        - "Stop if CTRL-S0 fails."
        - "Stop if the random-advice null cannot be forced to the incumbent row."
        - "Stop if any row is not monotone non-increasing in S."
    - id: stage-1-arithmetic
      purpose: instantiate declared exponents and physical-memory comparison
      method: python3_standard_library_only
      budget_seconds: 600
      budget_memory_gb: 1
      parameters: {log2_p: [256, 512]}
      output_units: [advice_entries_log2, query_time_exponent, Fp2_operations_exponent]
      stop_rules:
        - "Do not run unless the frozen contract is separately approved and authorized."
        - "Do not add a toy graph arm or an unregistered construction."
        - "Stop at the first exact-gate failure and preserve the partial artifact."

  metrics:
    primary:
      - "T_min(sigma) on the seven closed-list sigma values"
      - "exact S=0 and S=p control verdicts"
      - "random-advice null verdict at every declared sigma"
      - "fiber_ratio by named construction, reported as a prediction/derivation only"
    secondary:
      - "log2 advice entries and log2 query cost at log2(p)=256 and 512"
      - "break-even instance count S / p^(1/3)"
      - "physical-memory comparison against incumbent log2 memory 92.5"
      - "Construction C minus Construction A exponent gap sigma/2"

  preregistered_prediction:
    quantity: T_min(S)
    formula: "min(p^(1/3+o(1)), p^(1+o(1))/S)"
    closed_list_sigma_values: [0.0, 0.1666666667, 0.3333333333, 0.5, 0.6666666667, 0.8, 1.0]
    predicted_time_exponents: [0.3333333333, 0.3333333333, 0.3333333333, 0.3333333333, 0.3333333333, 0.2, 0.0]
    random_advice_null: "0.3333333333 at every sigma"
    construction_c_gap: "sigma/2 > 0 for every sigma > 0"
    source: >-
      Arithmetic and named constructions in IDEA-20260806-9c2f80; the incumbent
      row is conditional on the frozen source's stated Heuristic 1 and is not
      revalidated by this derivation contract.

  scale_relevance:
    tier: derivation
    justification: >-
      Stage 1 uses cryptographic-size exponents but no cryptographic computation.
      Its output is arithmetic under a model and cannot be called crypto-scale
      evidence. Any optional graph experiment is excluded from this contract and
      would be toy tier only.
    correspondence: null

  falsification_criterion: >-
    The package is falsified or terminated if S=0 fails, the matched random-advice
    null improves on the incumbent, a closed-list row beats 1/3 at sigma<=2/3,
    Construction C is not dominated, or an exact arithmetic/control gate fails.
    A timeout, crash, dependency failure, or inability to execute is an
    infrastructure outcome, never mathematical negative evidence.

  stopping_rules:
    - "No execution while frozen=false or execution_authorized=false."
    - "No report of treatment rows before the random-advice null is committed."
    - "No claim beyond the closed named list and declared accounting model."
    - "A positive sub-1/3 row requires independent review-breakthrough at max."

  invalidation_rules:
    - "Any post-observation change to sigma values, controls, or frontier formula."
    - "Any use of numpy, Sage, network access, or isogeny implementation in Stage 1."
    - "Any claim that the result is a lower bound over all p-only advice strings."
    - "Any omission of the physical-memory and build-versus-query caveats."

  required_artifacts:
    - "Frozen specification and SHA-256 freeze receipt"
    - "Proof/control audit and pre-run control hash commitment"
    - "Machine-readable Stage 0/1 arithmetic output"
    - "Exact command, environment, stdout, stderr, and resource receipt if executed"
    - "Snapshot archive before independent review"
    - "Independent Validator and Red Team reports"

  assigned_to: executor
  approved_by: null

