  goal_id: GOAL-ECDLP2M-001
  predecessor_experiment_id: EXP-BINSTD-5b2fd0
  predecessor_evidence_id: EV-BINSTD-a99d47
  predecessor_decision_id: DEC-20261003-f82374
  version: 1
  title: >-
    Catalog-expansion successor: meet ≥3 distinct dim(V·V) and ≥2 distinct
    N_var before Spearman(dim(V·V), N_var)≥0.70 on n=17 toys
  status: approved
  approved_by: DEC-20261003-928974
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-928974 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Do not re-run EXP-BINSTD-5b2fd0 v1.
    Stage 2 not authorized here.
  approval:
    approved_by: DEC-20261003-928974
    composing_decision: DEC-20261003-928974
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized. Cites
      EV-BINSTD-a99d47 / DEC-20261003-f82374 NA-1.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes diversity-seeking V catalogs (≥24, ≤48), Spearman
      band 0.70, new seeds, encoder pin, twin probes, Stage-1 pre-screen.
      Stage 1 runs n=17 ℓ∈{3,4} with twin meters; admission floors before
      any band reading; writes RESULTS.md with exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    After EV-BINSTD-a99d47, decide whether a diversity-seeking catalog meets
    admission floors and then whether Spearman ρ(dim(V·V), N_var) ≥ 0.70 on
    Stage-1 cells under twin agreement; deliver exactly one O-* label from
    H-BINSTD-7cbce1.

  class: heuristic_validation
  class_note: >-
    Pre-registered Spearman band on an encoding-size instrument with
    catalog-power repair. Not an exponent-moving breakthrough; no ECDLP
    attack table.

  scope:
    included:
      - >-
        Stage 0. Diversity-seeking freeze (≥24, ≤48 shapes) for
        (n,ℓ)∈{17,19,23}×{3,4}; freeze preregistered-predictions.json
        (band 0.70, seeds 2026100320/2026100321, admission gates, encoder
        pin); twin self-check; Stage-1 cells pre-screen dimVV/N_var.
      - >-
        Stage 1. For (n,ℓ)∈{(17,3),(17,4)} measure twin dimVV and twin
        N_var; ADMISSION GATE (≥3 distinct dimVV, ≥2 distinct N_var)
        before Spearman band reading; write panels/control-table/RESULTS.md
        with exactly one O-* label.
    excluded:
      - Re-running EXP-BINSTD-5b2fd0 frozen v1 catalog / seed 2026100317.
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 n=19,23 panels and random-Boolean null under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the 0.70 band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Reading O-SUPPORT/O-FAIL-BAND without admission floors.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-16ee30/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-16ee30/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-16ee30/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-16ee30/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-16ee30/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261003-f20e41.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-7cbce1.yaml
    predecessor_evidence: ledger/evidence/EV-BINSTD-a99d47.yaml
    predecessor_decision: ledger/decisions/DEC-20261003-f82374.yaml
    spearman_band: 0.70
    catalog_seed: 2026100320
    bootstrap_seed: 2026100321
    bootstrap_reps: 200
    min_catalog: 24
    max_catalog: 48
    admission_floor_dimVV: 3
    admission_floor_Nvar: 2
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_dimVV
      definition: >-
        product_space.dim_vv_path_a == dim_vv_path_b on every measured V.
    - name: twin_Nvar
      definition: >-
        encode_s3 N_var path A == path B (independent linear elim) on every
        measured V.
    - name: ctl_fixed_dim_V
      definition: Every catalog entry has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Spearman band 0.70 frozen in preregistered-predictions.json.
    - name: ctl_admission_floors_before_band
      definition: >-
        ≥3 distinct dimVV and ≥2 distinct N_var required before any
        O-SUPPORT/O-FAIL-BAND band reading; else O-INCONCLUSIVE.
    - name: ctl_not_v1_catalog_rerun
      definition: >-
        catalog_seed ≠ 2026100317; recipe is diversity-seeking (≥24);
        check.py refuses v1 seed reuse.
    - name: null_random_boolean_matched_catalog
      definition: >-
        Stage 2 only (NOT AUTHORIZED). Named so the Stage-1 reading cannot
        silently claim the null.

  independent_variables:
    - name: stage
      levels: [0_diversity_freeze, 1_admission_then_spearman_n17]
    - name: cell
      levels: ['(17,3)', '(17,4)']
    - name: V_shape_family
      levels: [poly, geometric, shifted_poly, affine_twist, random_expander]

  metrics:
    primary:
      - name: admission_floors_met
        unit: boolean
        definition: ≥3 distinct dimVV and ≥2 distinct N_var on the cell.
      - name: spearman_dimVV_vs_Nvar
        unit: dimensionless
        definition: >-
          Spearman ρ between dim(V·V) and N_var across the catalog;
          band verdict only when admission_floors_met.
      - name: twin_agreement
        unit: boolean
        definition: Both twin meters agree on every measured V.
    secondary:
      - name: bootstrap_ci_95
        unit: interval
      - name: distinct_dimVV
        unit: integer
      - name: distinct_Nvar
        unit: integer
      - name: catalog_size
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-BINSTD-febbe1-H1

  preregistered_prediction:
    quantity: >-
      After admission floors (≥3 distinct dimVV, ≥2 distinct N_var),
      Spearman ρ(dim(V·V), N_var) ≥ 0.70 on each Stage-1 cell under twin
      agreement.
    formula: >-
      N_var = |nonlinear_support \ pivots| after F_2 Gaussian elimination
      of pure-linear equations from Weil-descended S_3; dim(V·V) via twin
      product-space ranks; catalog built by diversity-seeking freeze.
    source: >-
      IDEA-20261003-f20e41 / EV-BINSTD-a99d47 follow-up; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-size instrument on n=17 only under this card. No transfer of
      a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids ρ claims (O-ARTIFACT).
    - Admission floor failure → O-INCONCLUSIVE (band not authorized).
    - v1 catalog seed reuse → protocol invalid / check.py FAIL.

  seeds_and_replication:
    catalog_seed: 2026100320
    bootstrap_seed: 2026100321
    bootstrap_reps: 200
    independent_instances: 2
    note: >-
      Cells (17,3) and (17,4) are independent instances. Twin meters are the
      replication instrument for each V. Seeds deliberately differ from v1
      (2026100317 / 2026100318).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-7cbce1.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.
    - Do not re-run EXP-BINSTD-5b2fd0 v1.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read ρ as support.
    - Band outcome without admission floors → protocol invalid.
    - Re-using v1 catalog seed 2026100317 → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes and catalog_size
    ≥24 on Stage-1 cells; Stage 1 produces admission-floor status and, when
    floors met, Spearman ρ ± CI per cell (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-BINSTD-7cbce1 with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc band edit; band verdict without
    floors; v1 catalog re-run; a claimed break/exponent under this card.
    (O-FAIL-BAND is a valid scientific negative of O-SUPPORT, not a
    protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-16ee30/trial-plan-v1.json
    - experiments/EXP-BINSTD-16ee30/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-16ee30/stage0/v-catalog.json
    - experiments/EXP-BINSTD-16ee30/stage1/
    - experiments/EXP-BINSTD-16ee30/RESULTS.md
    - experiments/EXP-BINSTD-16ee30/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-16ee30/implementation/run.py
    - experiments/EXP-BINSTD-16ee30/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
