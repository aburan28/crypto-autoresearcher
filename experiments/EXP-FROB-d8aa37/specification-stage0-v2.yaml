    "methods": {
      "field": "Construct F8=F2[u]/f with the lex-first monic irreducible cubic, ordered by constant-first binary coefficient tuple. Construct K=F8[z]/g with lex-first monic irreducible cubic whose coefficients use canonical F8 encodings. Encode a0+a1*z+a2*z^2 by a0_enc+8*a1_enc+64*a2_enc; F8 encodes b0+b1*u+b2*u^2 as b0+2*b1+4*b2. Enumerate field elements by integer encoding0..511. Preserve this physical tower across Sage representations with explicit verified embeddings/conversion matrices. Scan normal generators canonically and record all attempts, Frobenius/multiplication matrices and costs. Do not choose a different modulus or absolute-field encoding because an API is easier. Sage conversions MUST decode canonical integer coefficients as polynomial bits sum_i bit_i*u^i; F8(integer_k) for k>1 is prime-field coercion and is forbidden as an encoding conversion. K conversion similarly decodes each F8 coefficient explicitly.",
      "curve_selection": "Enumerate (A_enc,B_enc) in F8^2 lexicographically. Model y^2+x*y=x^3+A*x^2+B with B!=0; reject singular/supersingular and already-selected j after proving their tests. Count E(F8) exactly, compute t=9-#E(F8), use s0=2,s1=t,s_k=t*s_(k-1)-8*s_(k-2) throughk3 and #E(K)=513-s3; on selected candidates independently count all points of E(K) by exact field/point enumeration and require agreement. Select first TWO distinct j passing the subgroup gates, with the complete preceding candidate/rejection log. No null curves are acquired in this stage.",
      "subgroup": "Select the largest prime N>=17 of exponent1 in #E(K) that does not divide #E(F8). ArmB size/cofactor matching ranges do not apply to stage0. Enumerate finite points by (x_enc,y_enc), multiply by cofactor #E(K)/N and select first nonzero generator P. Verify [N]P=O and N prime. Compute pi(P)=(x^8,y^8); solve mu by charged deterministic BSGS with M=ceil(sqrt(N)), baby jP forj0..M-1 and giant pi(P)-iMP, verify [mu]P=pi(P),mu!=1,mu^3=1 and exact order3. Verify P+pi(P)+pi^2(P)=O directly. Any failed gate rejects that curve with certificate, not a silent smaller-N or different-parameter rescue. Exhausted full F8^2 pool with fewer than2eligible distinctj is structural_unavailable.",
      "subspaces": "Enumerate every dimension1 anddimension2 RREF subspace of the3-dimensional F8 vector space K in canonical flattened coefficient order, independently test stability under the Frobenius matrix, and crosscheck complete stable list with exact factorization/kernels of T^3-1. Require characteristic2 not dividing3 for semisimple factor reasoning. Retain all RREF candidates, stable bases and dimensions, including the base-field line. The expected linear-plus-irreducible-quadratic pattern is checked, not imposed. No arbitrary normal-basis prefix substitutes for stable V.",
      "domains": "For each selected curve and every actual stable V ofdimension1or2, F={Q in G{O}: x(Q) inV}; obtain subgroup points by public generator additions and independently test all curve/order/membership premises. F is a coordinate-sorted set of signed points, not x representatives. D=x(F) is its distinct coordinate-sorted x-set. Use exactly F^m and D^m for m2and3, with ordered positions and repetitions allowed. Retain both signs/y lifts that actually lie in F. Identity O is excluded from F but may occur as a tuple sum/intermediate; keep such outcomes. No restriction to arbitrary V^m roots outside D^m and no dropping empty F/D.",
      "targets": "Every nonzero R in G is required on every curve/V/m. Enumerate target public coordinates canonically after generator construction; preserve a separate acquisition/checker-only scalar label if needed, never provide target logs to root/lift solving. No target sampling or early stopping on overlap. Repeated target x for +/-R may share an exact-equation cache, but both signed targets and their lifts remain separately reported with cache key/hits and cost allocation.",
      "polynomials": "Use v1 binary S3(a,b,c)=(a*b+a*c+b*c)^2+a*b*c+B and S2=a-b. For m2 evaluate S3(x1,x2,x_R). For m3 construct S4(x1,x2,x3,x_R)=Res_t(S3(x1,x2,t),S3(x3,x_R,t)) symbolically BEFORE specializing any x values, as the determinant of the formal degree2/degree2 Sylvester matrix; retain the full coefficient polynomial and multiplicity trace. Only divide by a proven nonzero scalar for normalization. Never replace it with a guessed formula or a resultant recomputed after silently lowering specialized degrees.",
      "domain_ideal": "For each V with fixed basis b1..bd write x_i=sum_j u_ij*b_j, variable order (position1 coordinates1..d,thenposition2,...). Descend the Semaev value into its3F8 coefficients. Define g_D(X)=product_{a inD}(X-a), with empty product1; include all3descended coefficients of g_D(x_i) for each position plus u_ij^8-u_ij. Define I_R as the ideal generated by exactly these polynomials over F8. This enforces D^m and has the same finite roots as exhaustive x-only evaluation. Preserve the unspecialized field-only polynomial and exact domain constraints separately.",
      "intersection_union": "Correct the ambiguous v1 words prospectively: the tested overlap is Z(I_R) intersection Z(I_piR)=Z(I_R+I_piR). Z(I_R intersection I_piR) is the UNION, not the overlap. Compute exact finite root-set overlap and union with explicit labels. For the canonical ordered target orbit R,piR,pi^2R retain k1,2,3 prefix union cardinalities and duplicate-root witnesses as set diagnostics; this does not execute the later ArmA invariant-image/elimination degree study or discharge its full k-ladder conclusions.",
      "root_lift_enumeration": "Enumerate all D^m tuples and allnonzeroR. Record raw S_(m+1)=0 outcomes and full target domain cardinalities; for each x tuple enumerate the Cartesian product of its point lifts in F, including repeated positions, and verify actual signed group sum for every lift. Independently enumerate every ordered F^m tuple and route its actual sum to target R orO; counts must reconcile. Keep raw polynomial roots with no valid R-lift, roots with valid lifts and exact ordered lift multiplicities separately. A polynomial zero is not a signed point relation. Cache target-independent tuple sums only with all actual computed/cached work charged.",
      "resultant_specialization": "For every m3raw polynomial root specialize A(t)=S3(x1,x2,t),C(t)=S3(x3,x_R,t), retaining allthree coefficients padded to original degree2. Record specialized affine degrees, identically-zero/constant cases and exact gcd/factor multiplicities. Retain all finite common K-roots and non-K irreducible common factors with their degrees/multiplicities; do not pretend algebraic-closure roots are K-rational. Homogenize both to original degree2: a2*t^2+a1*t*w+a0*w^2; infinity[1:0] occurs when a2=0. Record its order from a2,a1,a0 (zero polynomial means whole projective line, not a finite invented multiplicity), including both-zero case. Distinguish finite-common-root, infinity-only and mixed/degenerate fibers. Do not discard infinity cases as automatically spurious: actual signed lifts, including an intermediateO from inverse pairs, determine validity. m2also retains repeated-coordinate and tangent/inverse/O branches.",
      "covariance_stabilizers": "From actual stable basis compute induced F8 linear mapPhi_V with orientation x(Phi_V*u)=x(u)^8; record its cubeI. Check exact coefficient substitution relating descended target equations forR andpiR, domain generators and field equations with explicit transport witnesses; scalar coordinate variables remain F8 variables under coefficient-field action. Verify root-set transport and signed lift transport by actual point Frobenius. Compute tuple stabilizers under k0,1,2 using actual coordinate/point actions and verify target orbit has length3. Tagged distinct targets alone prove no untagged disjointness.",
      "calibration": "Select the lexicographically first cell by (selectedcurveindex,dimensionV,canonicalRREFbasis,m), among cells with D nonempty, BEFORE inspecting any target solution. On this ONE whole calibration cell solve I_R for EVERY nonzero target R with a second exact lex Groebner/root solver and compare the complete finite roots and all signed lifts to exhaustive enumeration. Also retain v1 deterministic grevlex Buchberger control there: pair order(totalLCMdegree,lexpairindices), monic reductions by oldest applicable reducer, full S-pair/reduction trace; any degree statistic is operational d_solve, never theoretical d_reg/first-fall degree. Identical-equation reuse for +/-R is allowed only on exact serialized equation/domain/order equality, with costs and both target records retained. No solution-conditioned calibration target choice. If all D are empty, retain full census and calibration_unavailable; no whole stage gate pass or empirical confirmation. General solver-cost and degree studies for the other v1 cells remain pending. Use Sage in-process libsingular interfaces for exactlex/calibration Groebner operations; external Singular/pexpect subprocess sessions or detached solver processes are forbidden.",
      "independent_checker": "checker.py uses a different polynomial representation for F8 and K (explicit nested coefficient arithmetic and explicit conversion tests, not the driver Sage finite-field/group routines), independent binary affine/projective point formulas and exact infinity/inverse/doubling branches. Verify all candidate/selected field/curve/order/Frobenius/basis/domain records, every signed tuple sum, x-root/lift membership, resultant coefficient/specialization/projective classifications, covariance and set overlap/union. Independently rebuild formal resultant by polynomial arithmetic/determinant or subresultant identities; check calibration ideals/roots and all required controls. Do not import/execute driver.py. It reads but never edits the eight driver artifacts or adapter-reserved files. Independent arithmetic may use explicitGF8/GF512 coefficient arrays; Sage is needed only for the declared exactlex/ideal crosscheck. No external solver session/detached child.",
      "serialization": "Use fixed roots.jsonl.gz andtuples.jsonl.gz with canonical JSON lines(sortedkeys,compactseparators,ASCIIescaping,LF), gzip mtime0,emptyheaderfilename,compresslevel6; record zlib/version and compressed/decompressed hashes/bytes/linecounts. roots stream covers polynomial/root/lift/projective/overlap records and per-cell totals; tuples stream covers all signed tuple sums, candidates and exact enumeration accounting. Include a schema/header and explicit empty/unavailable terminal records so required streams remain nonempty. Do not dump unbounded caches; finite per-cell working sets and explicit cache entry limit65536, with eviction/costs recorded.",
      "costs": "Charge field/curve search and rejected candidates, point counting/factoring/cofactor andBSGSmu acquisition, stable-subspace enumeration, factor-base membership, all signed/x-domain enumeration and target comparisons, formal polynomial/resultant construction, finite/projective specialization, all root lifts/covariance checks, both calibration solvers, independent checker, compression/serialization and retained artifacts. Record exact available field/group operation vectors plus explicit opaque Sage/solver primitive internals, coefficient bitlengths,cache hits,stage CPU/wall/peakRSS and actual bytes. Analytical domain cardinalities and cache-implied work are not claimed as executed operations. Adapter checker CPU/wall lives in its own process; capture actual checker measurements in check.stdout.log without mutating final manifest. No modeled0cost for unavailable stages and no full-attack,descent/rho/GHS cost claim."
