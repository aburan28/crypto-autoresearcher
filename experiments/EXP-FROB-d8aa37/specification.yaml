      "field": "Write q=p^a. Construct Fq using the lex-first monic irreducible degreea polynomial overFp (coefficient tuple constant-first); a1 is prime field. Construct K=Fq[z]/lex-first monic irreducible degreen. Canonical integer encodings are tower coefficient vectors low-degree first. Normal generators are scanned in canonical order and accepted iff(theta,theta^q,...,theta^(q^(n-1))) has rankn overFq. Record multiplication/Frobenius matrices, every candidate and all conversion costs; canonical physical field is never changed across methods.",
      "curve": "Odd p: y^2=x^3+A*x+B; binary: y^2+x*y=x^3+A*x^2+B with B!=0. Object candidates enumerate(A,B) inFq^2 canonically, reject singular or supersingular and duplicatej. Compute exact base trace and extension group order by Frobenius recurrence plus an independent exact point-count algorithm on selected curves. Choose first TWO distinctj passing the subgroup gates. Null candidates enumerate canonical K coefficient pairs with j of full degree n overFq; choose first TWO matching each object in deterministic order, without solver-cost selection. The finite pools are the entire coefficient domains; checkpoints preserve search position, no substitute field or silent random retry.",
      "subgroup": "Choose largest primeN>=17 of multiplicity1 dividing #E(K), with N not dividing#E(Fq), N within[q^(n-1)/4,4*q^(n-1)] where ArmB matching requests it. Scan canonical points and cofactor-clear until nonzeroP, prove orderN. Independently compute pi(P), solve its scalar mu by charged BSGS and verify [mu]P=pi(P),mu^n=1,mu!=1, exact ordern. Verify Tr(P)=O directly. Do not infer pi-stability or trace-zero membership from extension degree alone. If no eligible prime/subgroup, record structural_unavailable with factor/order certificates. Null Nprime within[N/2,2N], cofactor within[q/4,4q] for ArmB, same characteristic and rational2-torsion cardinality; prove generator order. No Frobenius endomorphism is used on null Eprime: pi maps to a different curve.",
      "subspaces": "Compute Frobenius matrixPhi overFq, factorT^n-1 including multiplicities, enumerate invariant subspaces by exact kernels/products and verify dimensions/invariance; when not semisimple use invariant-subspace RREF enumeration, never assume factor-subset enumeration complete. Normal basis alone does not supply arbitrary stable dimensions. V1=Fq is an explicit wrong-base control. StableV2 exists only when actual module factors admit it; record unavailable at q8,n5 if characteristic-polynomial factors have degrees1,4. Uniform randomV2 density tests sample rank2 RREF spans from independent field vectors by rejection with fixed hash seeds and count duplicates; these V need not be stable.",
      "polynomials": "Odd characteristic S3(x1,x2,x3)=(x1-x2)^2*x3^2-2*((x1+x2)*(x1*x2+A)+2*B)*x3+(x1*x2-A)^2-4*B*(x1+x2). Binary a1=1 model S3=(x1*x2+x1*x3+x2*x3)^2+x1*x2*x3+B. Set S2=x1-x2; build Sr forr>=4 by Res_t(S_(r-1)(x1,...,x_(r-2),t),S3(x_(r-1),x_r,t)), retaining exact coefficient/multiplicity trace and normalizing only a nonzero scalar. Substitute fixed basis coordinates for x_i, targetx, and descend into nFq coefficient equations. The polynomial condition is an x-only necessary decomposition condition; recover all y/sign lifts and check actual point sums for each accepted relation.",
      "exact_solver": "Primary deterministic Buchberger overFq, grevlex with frozen variable order, pair order by total lcm degree then lex indices, monic reduction by oldest applicable reducer. Record every S-pair/reduction and maximum total degree reached; label this operational solving degree d_solve, never assert equality to theoretical d_reg. Record Hilbert-function regularity separately when computed exactly. First-fall degree uses full homogeneous Macaulay kernel at each degree and excludes trivial Koszul/syzygy combinations by exact row-space comparison; if not computed it is unavailable, not d_solve. Field equations u^q-u are added for final finite-field solution enumeration; report pre-field-equation and complete-system degree/cost separately. Independent checker verifies ideal witnesses, substitution, all roots and point lifts. At calibration enumerate full factor-base tuples independently. A second exact lex solver crosschecks the designated smallest complete cell.",
