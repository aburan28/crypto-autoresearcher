    "methods": {
      "stage0": "For each selected q8,n3 curve and each actual stableV of dimension1or2, enumerate full ordered raw factorbase tuples for m2and3 and every nonzeroR. Record (a) signed point tuple sums with targettag, (b) x-only Semaev roots without tags, (c) all possible y/sign lifts for the same xtuple. Compare I_R∩I_piR roots and archive any shared xtuple with distinct valid lifts. Signed tagged pairs are trivially distinguished bytags and cannot prove untagged A2. Prove/check ideal covariance by coefficient substitution, stabilizers by actual tuple actions and nonzero target action. A counterexample to A2 gates only its proposed closure/degree deductions; armB can continue from independently checked subgroup/trace premises.",
      "armA_subspaces": "Include V=Fq wrong-basecontrol and every stableV2 if available; if no stableV2 record sourcecell unavailable for its claimed stable low-dimensional arm, with exact factorization/kernel certificate. Also run source plain V1=span(theta) and V2=span(theta,theta^q) as nonstable controls with transported subspacesV^pi pertarget; no orbitfolding on an unclosed base. Every tuple/root domain is frozen before targets. A1degreecomparison for stable arm is undefined if only wrong-baseV1exists, not an invented successfulzero baseline.",
      "armA_ideals": "Build exact descended S_(m+1) equations for fixedR and x_i inV. Compute k-way untagged union ideal via repeated intersection I∩J=(t*I+(1-t)*J)∩Fq[x], t elimination with complete lexGroebner traces; separately retain tagged disjoint-union algebra using orthogonal idempotent tags. Actual x-root unions deduplicate overlaps; count multiplicity/geometric roots separately. Source k*singlecount is tested, never imposed. Null usesk independent uniform targets on oneEprime and same actual size/base/domain; its union count is NOT presumed sum when fibers overlap.",
      "invariant_rewrite": "At k=n and actual stableV, derive inducedCn matrix on all coordinates; enumerate monomial orbit sums of totaldegree<=n plus constants, including orbit products, as the fixed candidate generator list. Compute invariant image ideal by adjoining y_j-f_j(x) then eliminatingx, with domain equations handled consistently. Verify reconstruction fiber counts and stabilizers; degree-n generator necessity is a separate minimality question, not assumed from presence of an orbitproduct. For k<n, union need not be invariant: record failed closure; still compute image under the same polynomial map as a non-quotient diagnostic with full fiber witnesses, never label it invariant quotient. On unrelated-target/null curves verify action first; failure means no naturalCn quotient, not a fabricated orbitgain. Compare raw single target, full union and invariant IMAGE system degrees/variables with construction+recovery charged and domains explicitly different.",
      "trace_membership": "Build point trace by complete projective group-law circuit with branches for exceptional pairs expanded into a disjoint algebraic cover with denominator-nonzero witnesses. Alln Frobenius conjugate points belong to same object curve. Membership Tr(P)=O is exact projective infinity with all exceptional components retained; do not replace it by only S_n(x,x^q,...) which admits sign/extraneous components. Eliminate auxiliary coordinates only with exact equivalence witnesses; record trace equation degrees. Each factorbase point gets direct trace and subgroup-projection checks.",
