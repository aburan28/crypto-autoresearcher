    "pipeline": {
      "raw_bases": "For object V2, enumerate every x inV2, solve curve equation for all y, retain every nonzero P with exact point traceO. Record rawT base size and density before any subgroup projection, duplication or orbit folding. Let h=#T_n/N with exact trace-kernel order; require gcd(h,N)=1, set projected point B=[h]P and verify[N]B=O. Null raw base uses a fixed1D Fq subspace V1=span(theta), enumerate all point lifts and project by hprime=#Eprime(K)/Nprime. Keep raw-to-projected fibers, zeros and all multiplicities. Relation solvers operate on raw points and actual targetR; after verifying sumP_i=R, project to subgroup and use rhs[h]R. Never substitute projected x coordinates into raw equations.",
      "matching": "Object and null geometric raw bases each keep a native arm; create an additional exact-cardinality matched arm by selecting equal L=min(raw counts) using predeclared SHA order on negation pairs and, for stable quotient arm, whole actual Frobenius orbits. Record any inability to match exact size plus orbit closure; do not claim simultaneously matched sizes and free orbit gains if impossible. B1 uses untrimmed rawT counts. Primary slope uses exact matched-cardinality arms only, with L/q reported.",
      "full_and_large_prime": "For each complete raw geometric base of sizeB and dimension g (objectg=n-1,nullg=n), run ordinary all-small and double-large-prime variants. In the latter small base is firstceil(B^(1-1/g)) negation-pair representatives in predeclared hash ordering, remainder large; round only to full pairs/orbits in the stable arm and record actualsize. Solve m=g raw-point decompositions over the full rawbase. After raw/subgroup/sign verification retain partial relations with at most2 distinct large columns and each large coefficient nonzero; coefficients may be general values after projection/orbit folding and must be retained. Store weighted large-prime graph edges, including one-large edges to a distinguished zero vertex; eliminate large columns with exact sparse Gaussian operations and row-combination witnesses. A cycle yielding no small relation or nontrivial self-loop must be processed algebraically, never counted as an independent relation merely from its graph shape. Charge graph construction, fill, filtering and all rejected>2large decompositions.",
      "collection": "Precompute logs of small projected factorbase representatives relative to publicP by attempts R=[a]P. Enumerate a=1..N-1 once in the seed-defined affine permutation a=(u*t+v) modN, omit0,u!=0. Solve every raw decomposition on the fixed base, canonicalize signed rows, add row rhs h*a modN, and record rank after every attempt. Stop only at full small-column rank and independently verified log solution, or exhaustive finite target-pool exhaustion, or operational checkpoint. Each polynomial solve can produce multiple rows, but rank and independent useful rows are distinct metrics. Orbit transformations on a stable object base produce rows with coefficients mu^k and rhs h*mu^k*a; after quotient these may be scalar multiples with zero newrank. Null has negation only. Cache reuse is explicit and charged; never allocate n independent rows from one orbit by fiat.",
      "linear_algebra": "Order columns by canonical representative; least-column pivot, normalize modprimeN, retain exact row multipliers. Verify original unreduced identities with an independent point implementation. Solve for every base log when rankfull, verify each log against its actual projected point. Incomplete rank at exhaustion is a completed finite rank-deficit observation and makes full-cost ratios/slopes requiring successful solves unavailable; do not call it zero-cost failure or substitute known logs.",
      "descent_recovery": "For each of20 fixed independently generated nonzero targetsQ, try R=Q+[a]P with a in full seed-defined permutation0..N-1, solving over SMALL base only with m=g and retaining all failures. From a verified projected relation sum c_i B_i=[h]Q+[h*a]P and verifiedbase logs l_i, recover x=(sum c_i*l_i)/h-a modN; verify[x]P=Q independently. First verifiedsuccess ends that target. Fullpool exhausted means descent_failure with exact surviving state. If direct collection with alphaP+betaQ is also reported, it is secondary and may not replace this full precompute/LA/descent comparator.",
      "rho": "For each of the same20 targets on object and matchednull, run deterministic 16-adding walk with coefficient state(a,b), precomputed steps[a_j]P+[b_j]Q from independent hashseed, partition SHA256(canonicalpoint) mod16, Floyd cycle detection. Object canonicalization chooses least point among +/-pi^k and multiplies(a,b) by the corresponding +/-mu^k; null usesnegation only. Charge alln point maps/comparisons and coefficients. If equality gives nonzero delta_b recoverx=-delta_a/delta_b and verify; zero denominator/short fruitless cycle restarts with next frozen seed counter, all costs retained. Exhaustion of complete finite coefficient state or memory checkpoint is explicit, never silently presumed random-walk constant. Also report unquotiented and negation-only object controls so the class gain is matched on the same curve as well as across null.",
      "stage_costs": "For each variant report actual total field/bit/group operations and CPU from acquisition through20 verified target logs, all-small vs doublelargeprime, native vs size-matchedbase, stable quotient vs unquotiented. Report preparation amortized over20targets and cold single-target separately. No complete cost ratio unless both pipelines solve all20; show time-to-failure/rank deficit separately. Report empirical success probability per attempt, solves/validrawrelation, solves/independentpivot, and coefficient/large-prime graph size; eta remains unknown unless a preregistered conditional rank-drift bound is independently supported."
