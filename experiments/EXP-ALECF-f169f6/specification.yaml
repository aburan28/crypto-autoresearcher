experiment:
  id: EXP-ALECF-f169f6
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-15c21e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-15c21e
  question_id: RQ-ALECF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Build one reversible affine point addition twice from shared subroutines, once with a compile-time
    classical offset and once with a fully quantum offset, and measure the per-stage Toffoli and ancilla
    dividend against a constant-folding null.
  objective: 'The one uncertainty a run reduces is how much of a point-addition circuit''s measured
    cheapness is attributable to the benchmark''s interface decision to supply the offset as classical
    bits rather than qubits. Concretely: (i) can two interface variants of the identical function
    be emitted from one shared subroutine layer, both passing an identical-function gate and an ancilla-restoration
    gate, so that any resource difference is attributable to the operand labelling and not to two
    separate implementations; (ii) what are the Toffoli-count and peak-ancilla ratios between the
    quantum-offset and classical-offset variants across the tested field widths, and how does the
    dividend decompose across the field-addition, field-multiplication, field-inversion, combination
    and uncomputation stages; (iii) does the dividend exceed the dividend obtained by folding a structurally
    comparable operand into a random reversible program of the same size, which is the null separating
    point-addition-specific specialization from the generic value of constant folding. A run makes
    no statement about what any algorithm requires, does not evaluate the imported ALECF submissions,
    whose source is absent from this repository, and claims no attack, speedup or security consequence.
    The deliverable is the ratio pair with confidence intervals over offsets, the per-stage breakdown,
    the offset-invariance distribution, the null-adjusted excess, and a two-sided statement naming
    which cost estimates the interface choice flatters and which it penalizes.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for these two implementations
      of reversible affine point addition over the tested toy prime fields, built from a shared subroutine
      layer under the declared granularity convention, the quantum-offset variant costs the measured
      multiple of the classical-offset variant in Toffoli count and peak ancilla, decomposed per stage
      as measured, and exceeds or does not exceed a constant-folding null by the measured amount.
      WHAT DOES NOT FOLLOW: nothing about 256-bit circuits, nothing about the correctness or adequacy
      of the ALECF interface, nothing about what offsets any algorithm actually needs, nothing about
      the circuits behind the committed scores, and no attack, speedup, feasibility or security statement
      of any kind. A ratio between two implementations is a property of those implementations at those
      widths.'
  inputs:
    procedure: 'STAGE 0 (cost: one hour): fix the granularity convention, the stage taxonomy, the
      field sizes, the offsets and the seed manifest. STAGE 1 (cost: four to six hours of engineering):
      implement the dual-mode subroutine layer for field addition, multiplication and inversion, where
      each subroutine accepts an operand as either a Python integer or a quantum register and emits
      accordingly. STAGE 2 (cost: two hours): compose the two point-addition variants and instrument
      every emitted gate with its stage tag. STAGE 3 (cost: minutes of compute): run the validity
      gate on both variants at each width, requiring identical-function agreement on the same inputs
      plus ancilla restoration. STAGE 4 (cost: minutes): record resource counts and per-stage breakdowns;
      rebuild variant C for 32 distinct offsets and record the gate-count distribution. STAGE 5 (cost:
      minutes, same invocation): build and measure the constant-folding null pair. STAGE 6 (cost:
      two hours): build the second general-multiplier implementation of variant Q as the sensitivity
      check and repeat STAGE 4 for it. STAGE 7 (cost: one hour): report both ratios, per-stage shares,
      offset-invariance distribution, null-adjusted excess and the two-sided flattery statement.'
    instrument: Python 3.11 standard library for exact integer arithmetic and the dual-mode subroutine
      layer; the classical basis-state reversible interpreter and its four checkers built for this
      bucket's tooling contract, reused so that both variants pass the same validity gate; harness/toycurve.py
      for exact prime-field point arithmetic used to produce reference sums; numpy for the offset-distribution
      statistics; pytest for the dual-mode layer's unit tests, which must assert that the two emission
      modes agree functionally; harness/runner.py for the run record and inference block. No Sage,
      no quantum simulator library, no hardware, no network.
    parameters: 'Prime field widths 8, 13 and 17 bits, one curve per width plus a second curve at
      13 bits as a curve-choice control. Two interface variants (classical offset, quantum offset)
      plus a second general-multiplier implementation of the quantum variant. 32 distinct offsets
      for the offset-invariance control at each width. Validity gate: exhaustive generic inputs at
      8 bits, 4096 random generic input pairs at 13 and 17 bits. Null pair: 30 independently generated
      random reversible program pairs matched on gate count, register shape and subroutine inventory.
      Stage taxonomy: 5 stages.'
  controls:
  - Constant-folding null pair of random reversible programs, run through identical instrumentation
    in the same invocation.
  - Identical-function gate across the two variants on the same inputs, so the ratio cannot come from
    computing different things.
  - Ancilla-restoration gate on both variants.
  - 'Offset-invariance control: variant C rebuilt for 32 distinct offsets, with the distribution of
    its gate count reported rather than a single value.'
  - A second general-multiplier implementation for variant Q as a sensitivity check on implementation
    quality, with both ratios reported.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a pair of random straight-line reversible programs
    of the same gate count, register shape and subroutine inventory as the point-addition circuits,
    one built with a designated operand folded in as a constant and one with the same operand allocated
    as a quantum register, with the operand playing a structurally identical role in both. The identical
    instrumentation and ratio computation runs on the null pair in the same invocation. For the signal
    arm to mean anything the null must show a SMALLER dividend: if a random program with a folded
    operand gains the same ratio, then the measured dividend is the generic value of constant folding
    for a program of this size and says nothing about point addition, and the honest record is a controlled
    null with the generic ratio reported as the finding.'
  independent_variables:
  - field bit width
  - operand-classicality labelling (classical versus quantum offset)
  - offset value
  - general-multiplier implementation choice
  - curve choice at fixed width
  metrics:
    primary:
    - Toffoli-count ratio between variants
    - peak-ancilla ratio between variants
    - per-stage share of the total dividend
    - null-adjusted dividend excess
    secondary:
    - depth ratio between variants
    - gate-count variation of variant C across 32 offsets
    - sensitivity of the ratio to the general-multiplier implementation
    - validity-gate pass rate per variant
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The Toffoli-count dividend R_T and the peak-ancilla dividend R_Q between the quantum-offset
      and classical-offset variants at 13-bit field width, and the null-adjusted excess.
    formula: 'R_T = toffoli(variant Q) divided by toffoli(variant C), and R_Q = peak_ancilla(variant
      Q) divided by peak_ancilla(variant C), both measured under the declared granularity convention
      with variant C averaged over the 32 offsets. Null-adjusted excess E = R_T minus R_T_null, where
      R_T_null is the same ratio for the constant-folding null pair averaged over 30 draws. Predicted:
      R_T at or above 1.5; R_Q at or above 1.1; E at or above 0.2; and the combined multiplication-plus-inversion
      share of the dividend at or above 0.7, where a stage''s share is the change in that stage''s
      Toffoli count divided by the total change.'
    source: Pre-registered in the parent proposal IDEA-20260816-15c21e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at 8, 13 and 17 bit prime fields, chosen as the range over which both variants
      can be fully validity-gated by classical simulation, with exhaustive generic-input checking
      available at the smallest width. The imported ALECF packages concern 256-bit secp256k1 and no
      measurement here is at that width. The transfer assumption, stated and not defended, is that
      the qualitative existence and stage-localization of the classicality dividend persist with width,
      since subroutine specialization is structural; the magnitude is expected to grow with width
      and is explicitly NOT extrapolated, because the toy widths compress exactly the multiplier specialization
      that would dominate at larger sizes.
    correspondence: null
  tail_checks:
  - Inspect the offsets producing the smallest and largest variant-C gate counts, which reveal offset-dependent
    shortcuts such as zero coordinates.
  - Check whether any stage's dividend is negative, meaning the quantum-offset variant is cheaper
    there, which would indicate a stage-tagging error or a genuinely different construction.
  - Examine the smallest width for fixed-overhead dominance in the ancilla ratio.
  - Check the null draws for outliers where the folded operand happened to be structurally load-bearing,
    which would inflate the null.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate after the declared widths, offsets and null draws; no adaptive extension.
  - Abort if the two variants fail the identical-function gate at any width.
  - Abort if variant C's gate count varies across offsets by more than 20 percent, since the labelling
    would then not be the operative variable.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits both variants from a shared subroutine layer, both passing the
    identical-function and ancilla-restoration gates at every tested width, and reports R_T, R_Q,
    the per-stage decomposition, the offset-invariance distribution, the null-adjusted excess, and
    the implementation sensitivity check, whatever their values.
  falsification_criterion:
  - R_T below 1.05.
  - Null-adjusted excess indistinguishable from zero.
  - Variant C gate count varying across offsets by more than 20 percent.
  - The two general-multiplier implementations giving R_T values differing by more than a factor of
    1.5.
  - Identical-function gate failure between variants.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-15c21e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The general modular inversion construction for the quantum-offset variant is not specified; a
    Coordinator must fix it, since the inversion stage is expected to dominate the dividend and the
    choice determines the number.
  - The stage taxonomy needs freezing before the run, because a taxonomy chosen after seeing the breakdown
    would be unfalsifiable.
  - Whether the offset-invariance control's 20 percent tolerance is the right threshold is asserted
    rather than derived.
  - It must be decided whether a partially classical interface, for example classical offset_x with
    quantum offset_y, belongs in this contract as a third arm or in a successor.
