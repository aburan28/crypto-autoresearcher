  protocol_deviations:
    - id: D-1
      what: "C-PSCALE's p1/p2 MEASUREMENT arms are executed here, immediately after acquisition, rather than at execution_order step 11."
      why: "The dispatching Coordinator's handoff message for TASK-20260802-63145a directs the order 'NC2b first, then C-PSCALE, then as much of NC2a as fits'. The frozen contract places C-PSCALE at step 11 behind a >= 900 s remaining-budget gate, i.e. as the first item a truncation drops."
      why_it_cannot_change_a_measured_number: "each p-arm runs in a FORKED CHILD, so the instrument's process-global prime (set_prime) and _G never leave that child; the parent's primary measurement is byte-identical either way, which C-REPRO independently checks against the superseded run. C-PSCALE is non-gating and its ESTIMATOR is still computed in the step-12 fits phase, using the p3 arm taken from the primary measurement."
      recorded_not_tuned: true
    - id: D-2
      what: "the OPTIONAL tail ell 223..251 was not attempted"
      why: "declined by --skip-tail: the tail is explicitly OPTIONAL and non-gating (binds_completion_gate: false). Execution order step 10 measures a tail ell at j-indices 0..3 only, so admitting one would force the common j-index set of the PRIMARY fit down to {0..3} and demote the {0..7} fit that the j_set_rule designates primary; and every tail fetch in RUN-PEC-6be870-a returned a fetch obstruction at the per-ell 64 MiB cap, so the expected yield is zero. Recorded as a decision, not a result."
      recorded_not_tuned: true
    - id: D-3
      what: "manifest.yaml and execution_report.yaml were generated from raw-result.json by a session-scratch helper rather than by the run program itself."
      why: "The queue declares exactly one implementation artifact. Every number in both files is copied from raw-result.json by code, and raw-result.json is unmodified since the run wrote it."
      recorded_not_tuned: true

