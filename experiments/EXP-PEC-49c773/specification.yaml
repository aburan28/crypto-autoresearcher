  # ==================================================================
  # 14. INVENTOR-PROTOCOL SECTION 8 DETERMINATION
  # ==================================================================
  section_8_determination:
    ref: "docs/inventor-protocol.md section 8; knowledge/techniques/KN-TECH-080.md; templates/research-records.md proof_search_map"
    proof_search_map_required: false
    reason: >
      A proof_search_map is a HYPOTHESIS-level field required before the
      Coordinator approves implementation or expensive experiments for a
      PROOF-ORIENTED proposal - a theorem, asymptotic bound, certificate family,
      reduction, or closure argument. EXP-PEC-49c773 proposes none of these. It
      is (a) an arithmetic recomputation from committed data under a corrected
      formula, and (b) a bounded empirical re-measurement of an implementation
      cost profile at the same scale as its predecessor. It advances no
      asymptotic claim and closes no lane. The determination is recorded here
      with its reason rather than omitted, as section 8 requires.
    but_one_component_is_argumentative: >
      The alpha = 1 p-scaling of the intercept (L5) is a DERIVATION about the
      committed pipeline rather than a measurement, and the refutation artifact
      underlying adjudication A was itself labelled `derivation`. That is below
      the threshold of a proof-oriented proposal - it is an argument about the
      cost of specific committed code, checkable by reading that code - but it
      is argumentative enough that the four audits are addressed inline rather
      than silently omitted, and C-PSCALE is added so the derivation acquires an
      in-batch empirical falsifier rather than only a deferred one.
    audit_dispositions:
      baseline_reproduction:
        status: DISCHARGED AND STRENGTHENED
        how: >
          C-BASE.4 reproduces the frozen PoC's count() exactly; C-BASE.6 states
          the unit alignment with Section 4.1 (gamma_paper = 0); and C-REPRO -
          new here - requires bit-for-bit reproduction of every sample
          overlapping RUN-PEC-6be870-a. The baseline being reproduced is now
          both the external reference and this programme's own prior run.
      observation_collision:
        status: APPLICABLE AND NOT CLOSED
        how: >
          Distinct per-entry cost laws produce the same observable over
          ell <= 251 and diverge at ell ~ 2^14. This experiment does not narrow
          that at all, and says so in non_claims. The concrete collision
          candidate remains batched Sutherland-type evaluation; NC2c is the
          separator. A SECOND collision is newly named and IS partially closed
          here: at a single p, "the intercept is a constant" and "the intercept
          is linear in log2 p" are observationally identical, which is exactly
          why the superseded record could not settle alpha. C-PSCALE is the
          discriminating control and is in this contract.
      quantifier_order:
        status: STATED
        how: >
          The supported statement is "for THIS implementation pair, at THIS p,
          there exists gamma such that for all ell in the measured range,
          per_entry ~ A * ell^gamma". The uniform form "for all implementations,
          there exists gamma" is NOT supported - which is precisely why this
          contract reports (gamma_A, gamma_B) as a PAIR rather than a single
          exponent. For L5 the order is "for this pipeline, for all ell, cost is
          linear in log2 p", supported by source inspection and, if C-PSCALE
          runs, by three p values at five small ell.
      method_ceiling_and_nearby_object:
        status: ADDRESSED
        how: >
          C-NULL is the nearby object where the hoped-for ell-growth must NOT
          appear, and in this contract it takes on a second role as the
          acceptance object for the ESTIMATOR (section 7) - the inventor
          protocol's "controls before belief" applied to the inference layer
          rather than to the signal. C-PSCALE's null arm is the nearby object
          for L5: if the p-scaling is a property of the shared poly_powmod loop,
          the null must exhibit the same alpha, and FC-4 fires if it does not.
          The ceiling of the method as a whole is unchanged: it can bound the
          per-entry exponent of an UNOPTIMISED implementation from above; it can
          never establish a lower bound on the cost of an optimal one.

