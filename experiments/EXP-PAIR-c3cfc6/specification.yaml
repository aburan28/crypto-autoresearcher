experiment:
  id: EXP-PAIR-c3cfc6
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-b92080
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: CLOSURE OF THE REVERSE DIRECTION - the isogeny class contains no curve with a smaller embedding
    degree, because k = ord_N(p) is a function of (N, p) and both are F_p-isogeny-class invariants;
    the closure survives the two escapes an attacker would try next, base change (which divides k
    by gcd(k,m) but leaves the TARGET FIELD F_{p^k} and hence the field-DLP cost exactly unchanged)
    and the quadratic twist (whose k genuinely does differ, and which is precisely the curve no F_p-rational
    map reaches); so the MOV cost functional is PROVED constant on the class, which is the decomposition's
    T3 test resolved in the negative for this functional
  status: draft
  objective: "(A) THE CLOSURE. Let E/F_p be ordinary with prime N | #E(F_p) and let E' be F_p-isogenous\
    \ to E. An F_p-isogeny preserves the characteristic polynomial of Frobenius, so #E'(F_p) = #E(F_p)\
    \ and hence the same N divides it; p is unchanged by definition. Therefore\n    k(E') = ord_N(p)\
    \ = k(E),\nidentically, for every curve in the class and every isogeny degree. More strongly,\
    \ the whole EMBEDDING-DEGREE PROFILE - the vector (ord_{N_i}(p))_i over all prime divisors N_i\
    \ of #E(F_p) - is a class invariant, as is the target field F_{p^k} and therefore the entire MOV/Frey-Ruck\
    \ cost functional C_MOV(E) = C_pairing(p, k) + C_fieldDLP(p^k). Consequence - min over the class\
    \ of C_MOV equals C_MOV, the minimisation is vacuous, and no isogeny walk of any length or degree\
    \ improves the transfer by any amount.\n(B) THE TWO ESCAPES, BOTH CLOSED, WHICH IS WHAT MAKES\
    \ THIS MORE THAN A RESTATEMENT. ESCAPE 1 - BASE CHANGE. Work over F_{p^m} instead. The embedding\
    \ degree of G with respect to F_{p^m} is ord_N(p^m) = k / gcd(k, m). Choosing m = k gives embedding\
    \ degree 1, which LOOKS like a total win. It is not - the target field is F_{(p^m)^{k/m}} = F_{p^k},\
    \ the same field, so the field DLP is the identical computation and the only thing that changed\
    \ is the name of the exponent. THE INVARIANT IS THE TARGET FIELD, NOT k. Any record that reports\
    \ an embedding-degree-1 endpoint obtained by base change as a transfer result has made this error,\
    \ and the campaign has one on file (EV-IT-002's planted control, recorded in ideas/catalogue-20260805/A4-transfers-lattice.md\
    \ section 0 as a named off-limits defect). ESCAPE 2 - THE QUADRATIC TWIST, and this is the sharp\
    \ one. The twist E^d has #E^d(F_p) = p + 1 + t, a DIFFERENT order, so it is not in the class -\
    \ and its prime divisors N' are different, so k' = ord_{N'}(p) is genuinely unrelated to k and\
    \ can, in principle, be small. So there IS a nearby curve whose embedding degree differs. It is\
    \ unreachable for a reason that is exact and not a matter of cost - there is no F_p-rational homomorphism\
    \ E -> E^d, the two are isomorphic only over F_{p^2}, and the isomorphism does not carry E(F_p)\
    \ into E^d(F_p). The point P simply does not exist on the twist. So the closure's boundary is\
    \ not \"no curve has smaller k\" - it is \"no curve that can receive P has smaller k\", which\
    \ is the correct and stronger statement.\n(C) WHAT THE CLOSURE DOES NOT SAY. It does not say pairing\
    \ transfers are useless - they work exactly when k is small to begin with. It does not say isogenies\
    \ are useless - they change the j-invariant, the endomorphism-ring level, and everything lanes\
    \ L1, L2 and L11 measure. It says one specific cost functional is constant, which under DECOMPOSITION.md's\
    \ T3 is a legitimate closure with a named obstruction FOR THAT FUNCTIONAL, and it forecloses the\
    \ reachability question T5 for this lane entirely - not because good curves are hard to reach,\
    \ but because there are none.\n(D) FORWARD GUIDANCE, REQUIRED BY THE CLOSURE STANDARD. What remains\
    \ open after this record - (i) isogenies NOT defined over F_p, which change the rational point\
    \ count and are therefore not transport maps for the ECDLP instance, but whose interaction with\
    \ the twist and with F_{p^2}-rational structure is untouched here; (ii) transfers whose target\
    \ is not E' but a Jacobian obtained by a cover or Weil restriction, where the target's embedding\
    \ degree is a different invariant and must be checked separately (KN-TECH-032 explicitly flags\
    \ this and it is out of this lane); (iii) multi-target amortisation of one F_{p^k} precomputation\
    \ across many targets in the same class, which does not need k to vary and is a genuinely different\
    \ question."
  resource_label: R4 (the isogeny graph / class-group action) composed with R7 (pairings into F_{p^k}).
    Both are genuine non-generic resources; the finding is that the R4 resource has zero effect on
    the R7 cost functional.
  admissibility: admissible
  admissibility_argument: Admissible - the isogeny graph acts on curves rather than on points of G,
    so it is not covered by H-ENDO-001's scalar-action argument, and the embedding degree is not a
    group-operation output, so it is not covered by KN-FIND-b7e091's simulability results. The proposal
    therefore clears the campaign's filter on its face. Its result is nevertheless a closure - the
    admitted resource is shown to leave the target functional exactly unchanged. This is the second-best
    outcome a lane can have and is strictly more informative than being filtered out, because it identifies
    WHICH functional the resource fails to move rather than refusing to look.
  reachability_gate: THIS RECORD IS THE REACHABILITY GATE, ANSWERED IN ITS STRONGEST FORM. DECOMPOSITION.md
    T5 asks whether a cost-minimising curve in the class is reachable - by random walk (goodness common)
    or by a local test (goodness detectable). Neither question arises, because the minimiser is every
    curve and the minimum equals the value at the start. Reachability cost is irrelevant when the
    target set is the whole class. The only object outside the class with a different value is the
    quadratic twist, whose reachability cost is not high but INFINITE - no F_p-rational map carries
    P there. This is the cleanest possible resolution of T5 for a lane, and it is negative.
  inputs:
    procedure: 'STAGE 1 (zero compute): write (A), (B) and the twist obstruction. STAGE 2 (HARD GATE,
      minutes): the broken-arithmetic null and the non-isogenous null - the instrument must be shown
      able to see a crossing before any absence of crossings is reported. STAGE 3 (under one CPU-hour):
      bucket 200-500 toy curves by order at p in [2^16, 2^22], verify k constant per bucket, verify
      End-level indicators vary, and walk with small-ell Velu steps confirming no bucket is left.
      STAGE 4 (minutes): the twist arm. THE CHEAPEST DECISIVE STEP IS STAGE 1 - the closure is symbolic
      and costs nothing; Stages 2-4 exist to certify the instrument and to quantify the twist gap,
      not to establish the closure.'
    mechanism: 'STEP 1 (zero compute) - write the argument in (A) with quantifiers explicit, citing
      only the easy half of Tate''s isogeny theorem (F_p-isogenous implies equal point count), which
      follows from equality of the Frobenius characteristic polynomial and does NOT require the converse.
      Note in the record that the converse (equal order implies isogenous), which the catalogue''s
      A4-1 leans on, is not needed here. STEP 2 (zero compute) - write both escapes in (B), including
      the explicit identity ord_N(p^m) = k/gcd(k,m) and the observation that (p^m)^{k/gcd(k,m)} equals
      p^{k m / gcd(k,m)} which contains F_{p^k}; state the twist obstruction as the non-existence
      of an F_p-rational homomorphism. STEP 3 (under one CPU-hour) - the empirical audit. At p in
      [2^16, 2^22], enumerate toy isogeny classes by point-counting a few hundred random curves and
      bucketing by #E(F_p). Within each bucket of size at least two, compute k for every member and
      check it is constant; compute End-ring level indicators (number of rational ell-isogenies for
      small ell) and confirm they DO vary while k does not. Then walk explicitly with small-ell Velu
      steps from a bucket member and confirm the walk never leaves its bucket. STEP 4 (minutes) -
      the twist arm. For each audited curve compute its quadratic twist, its order p + 1 + t, its
      prime divisors and their embedding degrees, and report the empirical distribution of k'' versus
      k. Report how often k'' is small when k is large; this quantifies exactly how much is being
      given up by the unreachability of the twist and is the record''s one genuinely open number.
      STEP 5 (zero compute) - state the closure with the forward guidance in (D).'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - non-isogenous null - k must be seen to vary
  - broken point counter - bucket crossings must appear
  - walk-length sweep 1 to 50 steps - any apparent variation must vanish and stay vanished
  - quadratic twist arm - k' must be seen to differ from k on at least one pair
  - End-level stratification - levels must vary where k does not
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. The audit in Step 3 asserts a negative
    - "k never varies within a bucket" - and such an assertion is worthless unless the instrument
    can be shown to detect variation when it exists. NON-ISOGENOUS NULL - pairs of curves with DIFFERENT
    #E(F_p). Here k is free to differ and MUST be observed to differ in a substantial fraction of
    pairs. If it does not, the instrument has no resolving power and the within-bucket constancy is
    measuring nothing. BROKEN-ARITHMETIC NULL - run the identical bucketing with a deliberately corrupted
    point counter (an off-by-one in the Hasse-interval search). The audit must then report bucket-crossing
    walks. An audit that reports "no crossings" even with a broken counter cannot see a crossing at
    all. This control is taken directly from the catalogue''s A4-1 and is retained because it is the
    right one. DECAY PARAMETER - the walk length. As the number of Velu steps increases from 1 to
    50, any apparent variation in k must go to zero and STAY at zero. A variation that grows with
    walk length is an arithmetic drift bug, not a discovery; a variation that appears at some length
    and disappears at a greater one is the canonical artifact tell.'
  independent_variables: []
  metrics:
    primary:
    - per curve, (p, t,
    - per bucket, the number of members and the variance of k (predicted exactly zero)
    - per bucket, End-level indicators and their variance (predicted non-zero)
    - count of bucket-crossing walks, by walk length
    secondary:
    - for the twist arm, the joint distribution of (k, k')
    - pass or fail of each null
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of observed bucket-crossing isogeny walks (a walk whose endpoint has a different
      embedding degree from its start)
    formula: Exactly ZERO out of every walk performed, at every length up to 50 Velu steps. A single
      crossing means either the point counter or the edge relation is wrong - most likely the edge
      relation is using modular polynomial roots over F_{p^2} rather than F_p - and is decision-relevant
      as an instrument defect, not as mathematics.
    source: pre-registered in IDEA-20260807-b92080 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Edge relation over the wrong field. Modular-polynomial roots can lie in F_{p^2}; an implementation
    that accepts them builds a graph whose edges are not F_p-isogenies, and it WILL produce apparent
    bucket crossings. This is the single most likely source of a false positive and must be checked
    before any crossing is reported as mathematics.
  - 'Small-p coincidences. At p near 2^16 many curves share orders by accident and buckets conflate
    genuinely different classes when #E factors the same way. The audit must verify class membership
    by an explicit walk, not by order equality alone - which is also why only the easy half of Tate''s
    theorem is used.'
  - 'Cofactor primes. A bucket may contain curves whose #E has several prime divisors; the profile
    must be compared as a vector with matched ordering, not as a single k.'
  - Reading the closure as "isogenies are useless". They are useless FOR THIS FUNCTIONAL. Lanes L1,
    L2 and L11 measure functionals that are not known to be constant, and this record must not be
    cited against them.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly ZERO out of every walk performed, at every length up to 50 Velu steps.
    A single crossing means either the point counter or the edge relation is wrong - most likely the
    edge relation is using modular polynomial roots over F_{p^2} rather than F_p - and is decision-relevant
    as an instrument defect, not as mathematics.
  falsification_criterion:
  - Any observed F_p-rational, N-coprime isogeny whose endpoints have different embedding degrees.
    Under (A) this is impossible, so it indicates the harness's edge relation is not an F_p-isogeny
    or the point counter is wrong. Decision-relevant as an instrument correction and must be routed
    as one, never absorbed.
  - The broken-arithmetic null failing to produce crossings. The audit cannot detect what it claims
    to exclude; nothing is reported.
  - The non-isogenous null showing k constant across different orders. Same disposition.
  - Failure to exhibit any toy pair (E, E^d) with materially different embedding degrees. The nearby-object
    control has not been run, and the claim must then be stated in the weaker form "no curve in the
    class" with the twist boundary unexhibited.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
