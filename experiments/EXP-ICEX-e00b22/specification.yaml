experiment:
  id: EXP-ICEX-e00b22
  hypothesis_id: H-ICEX-604b5f
  derived_from_idea: IDEA-20260811-34f29d
  question_id: RQ-JINV-8fc13a
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    A BLOCKING SECONDS-LONG DEGENERACY AUDIT BEFORE ANY EXPENSIVE CELL- machine-verify
    the derivation that the affine singular locus of V(S_3) is the six permutations
    of the roots of x^3 + a x + b for every (a,b), hence (0, 6) universally; then
    measure only the statistics the derivation leaves free - multiplicity excess,
    the separately-labelled homogenised locus, and the Hilbert series - with planted
    defects of known dimension 1 and 2, and with P2 testable only at m = 4 and
    recorded as UNTESTED if that arm is censored
  status: draft
  objective: >-
    (A) THE UNCERTAINTY AS THE SOURCE POSED IT. Two explanations for the eight
    j-line degeneration loci and no record distinguishing them- a COORDINATE
    ACCIDENT in short Weierstrass coordinates, or a GEOMETRIC DEGENERATION whose
    intrinsic invariants move. Singular-locus dimension and degree are
    model-independent, so they were proposed as the discriminator.
    (B) THE BAND-DEGENERACY FINDING, COMPUTED BEFORE THE DESIGN AND STATED FIRST.
    Substituting the three roots of the curve cubic into the committed form of S_3
    gives, by direct arithmetic recorded in H-ICEX-604b5f statement (A), that S_3
    and all three of its partials VANISH at every permutation of those roots, FOR
    EVERY (a, b). So the affine singular locus always contains those six points;
    the committed fixture at (441, 294) shows the Jacobian ideal EQUALS their ideal
    there, giving (0, 6); and that ideal has vector-space dimension 1*2*3 = 6 for
    EVERY (a, b) because its staircase {x2^i x3^j : i < 2, j < 3} does not depend on
    the coefficients. AT a = 0 THE CUBIC IS x^3 + b AND AT b = 0 IT IS x(x^2 + a),
    BOTH WITH THREE DISTINCT ROOTS ON A NONSINGULAR CURVE, SO THE SIX POINTS REMAIN
    SIX DISTINCT POINTS AND THE STATISTIC DOES NOT MOVE. THE SOURCE PRE-REGISTERED
    P1 - dim or deg STRICTLY LARGER at a = 0 and b = 0 - CANNOT FIRE AT m = 3.
    (C) THE SECOND DEFECT. IDEA-20260811-a7c1df states VERBATIM that S_3 HAS NO
    WEIGHT-12 COEFFICIENT FACTOR. The six weight-12 loci therefore first appear at
    m = 4, and the m = 3 arm can only see j = 0 and j = 1728. P2 IS TESTABLE ONLY
    IN THE m = 4 ARM, which the source itself calls a stretch. PRE-REGISTERED HERE-
    A CENSORED m = 4 ARM LEAVES P2 UNTESTED, NEVER CONFIRMED.
    (D) WHAT THIS CONTRACT DOES INSTEAD. It opens with a BLOCKING DEGENERACY AUDIT
    costing seconds- compute all four statistics at m = 3 for generic, a = 0,
    b = 0, ten random curves and each weight-12 locus, and count how many DISTINCT
    values each takes. If a statistic takes one value everywhere it is declared
    NON-DISCRIMINATING before any expensive cell runs. The statistics that survive
    the derivation with freedom are the MULTIPLICITY EXCESS (degree minus the
    number of distinct points, null exactly 0, alternative at least 1), the
    HOMOGENISED (dim, deg) reported in a separate labelled column per
    CORR-20260810-eb9062, and the FULL HILBERT SERIES.
    (E) WHAT IS NOT DECIDED. Any solving-cost consequence - no time is measured.
    Anything about the deployed f_V-bearing system. Any isogeny-class statement,
    since the object collides on twists by construction and, after the derivation,
    collides on everything at m = 3.
  inputs:
    cost_unit: >-
      THERE IS NO COST METRIC. Dimension, degree, multiplicity excess and Hilbert
      coefficients are DIMENSIONLESS NON-NEGATIVE INTEGERS. WALL-CLOCK SECONDS ARE
      RECORDED FOR BUDGET AND CENSORING ONLY and enter no comparison, no ratio and
      no reported statistic. NO TIME IS MEASURED AS A RESULT.
    unit_discipline: >-
      BINDING. Every value carries a tag in {dimension, degree, count, series,
      seconds}. Cross-tag arithmetic requires a named recorded conversion, and the
      only one used is M1 = degree minus count, both integers. NO QUANTITY IN THIS
      CONTRACT IS A TIME DIVIDED BY ANYTHING.
    ideal_definition: >-
      The f_V-FREE Jacobian ideal- S_m together with its m partial derivatives, with
      NO factor-base membership polynomials, so the object is a functional of the
      curve rather than of the factor-base size.
    affine_vs_projective: >-
      BLOCKING, per CORR-20260810-eb9062. The singular locus, its dimension and its
      degree are computed on the UN-HOMOGENISED ideal; the homogenised values are
      computed SEPARATELY; BOTH ARE REPORTED IN SEPARATE LABELLED COLUMNS WITH THE
      RING EACH WAS COMPUTED IN NAMED. Neither may be presented as the other and the
      harness refuses to emit a value without its ring.
    degree_convention: >-
      DECLARED AND SINGLE. Degree is the vector-space dimension of the quotient and
      therefore COUNTS MULTIPLICITY. The number of DISTINCT affine singular points
      is computed separately by radical decomposition or point enumeration. M1 is
      exactly the difference, and reporting either figure as the other is the
      confusion M1 exists to expose.
    characteristic: >-
      p in {2, 3} is EXCLUDED EXPLICITLY, because partial derivatives behave
      differently in small characteristic - p = 3 kills the derivative of x^3. The
      tested primes are 4001 and one prime above 2^20.
    frozen_before_execution: >-
      The fixture, the locus list, the ten random curves, the ten random weight-12
      null loci, the two engines, the two monomial orders, the planted-defect
      polynomials and their predicted dimensions, the same-polytope control, the
      degree convention, and the rule that a censored m = 4 arm leaves P2 UNTESTED.
      None may change after any cell runs.
    procedure: >-
      STAGE 0 (backend provenance, blocking). A FRESH probe recording exact engine
      versions and demonstrating that the SECOND engine independently produces
      dimension, degree and a Hilbert series. The previous provenance file is known
      to carry an over-broad coverage classification that DEC-20260810-d70ece
      corrects, so this probe is re-run and not inherited.
      STAGE 1 (fixture, blocking). Reproduce affine (0, 6) on (a,b) = (441, 294) at
      p = 4001 in BOTH engines, and report homogenised dimension 1 separately. The
      derivation in the objective predicts (0, 6) independently, so agreement is a
      TWO-ROUTE check.
      STAGE 2 (SYMBOLIC DERIVATION CHECK, blocking, seconds). Verify symbolically
      over QQ(a,b) that S_3 and its three partials all vanish when (x1, x2, x3) is
      a permutation of the roots of x^3 + a x + b, and that the Jacobian ideal
      equals (e1, e2 - a, e3 + b) for generic (a, b). THIS MACHINE-CHECKS THE
      DERIVATION THAT THE WHOLE REDESIGN RESTS ON. A failure means the derivation is
      wrong, the source P1 is reinstated, and the run is re-planned before anything
      else.
      STAGE 3 (DEGENERACY AUDIT, BLOCKING, seconds, THE PRIMARY DELIVERABLE). At
      m = 3, compute the affine (dim, deg), the multiplicity excess, the homogenised
      (dim, deg) and the Hilbert series for- a generic curve, a = 0, b = 0, ten
      random curves, and one curve on each of the six weight-12 loci. COUNT THE
      DISTINCT VALUES EACH STATISTIC TAKES. A statistic taking one value across all
      of them is DECLARED NON-DISCRIMINATING and is not run in the main arm.
      STAGE 4 (planted defects, blocking). Run the pipeline on S_3 times a declared
      linear form L, where the singular locus contains V(S_3) intersect V(L) and the
      affine dimension must be EXACTLY 1; and on S_3 squared, where the whole
      surface is singular and the affine dimension must be EXACTLY 2. A pipeline
      that misses a dimension jump of known size cannot certify one.
      STAGE 5 (m = 4 arm, THE ONLY ARM IN WHICH P2 IS TESTABLE). Build the affine
      f_V-free Jacobian ideal of S_4 at the generic curve, at a = 0, at b = 0 and at
      each of the six weight-12 loci, at p = 4001 and, if budget permits, at the
      larger prime. Compute the same four statistics. CENSOR BY TIME OR MEMORY WITH
      THE MECHANISM NAMED. A censored cell leaves its prediction UNTESTED.
      STAGE 6 (controls). C-NULL-LOCUS at ten random weight-12 loci; C-GAUGE at
      (u^4 a, u^6 b) for seeded random u; C-ORDER at two monomial orders; C-ENGINE
      on every computed cell; and the SAME-POLYTOPE RANDOM-POLYNOMIAL control at
      each locus.
      STAGE 7 (report). Emit the degeneracy-audit table with distinct-value counts,
      the eight-row locus table with the generic control row, affine and homogenised
      columns labelled separately with their rings, the multiplicity excess column,
      the Hilbert series per locus, the planted-defect outcomes, all control
      outcomes, and the censored inventory with mechanisms.
    mechanism: >-
      STEP 1. Sing(V(S_m)) is cut out by S_m together with its m partial
      derivatives. Specialising the coefficients to a locus can enlarge that ideal
      zero set by making a partial vanish identically on a component or by creating
      a coincidence among the derivative equations. THE DERIVATION SHOWS NEITHER
      HAPPENS AT m = 3 FOR THE REDUCED LOCUS, so the experiment is aimed at the
      scheme structure and at infinity, which the derivation does not constrain.
      STEP 2. Every cell is computed twice by engines sharing no code path. The
      contract records that the Singular bundled inside a Sage installation is a
      second CODE PATH and NOT a second BACKEND for anything Sage itself calls, and
      names which pair it used.
      STEP 3. Dimension and degree are order-independent mathematically, so the
      two-order check is a cheap strong implementation check whose failure is an
      error and never a result.
      STEP 4. C-GAUGE discharges -the code is right- and NEVER -the difference is
      real-, per the committed C-GAUGE limit, and is labelled as an implementation
      check on every row.
      STEP 5. Every row is reported as (arm, m, locus, a, b, p, ring, engine, order,
      affine dim, affine deg, distinct points, multiplicity excess, homogenised dim,
      homogenised deg, Hilbert series, censored flag and mechanism, wall seconds).
    instrument: >-
      Symbolic computation in two engines sharing no code path, with a Groebner
      basis and staircase post-processing supplying dimension, degree and the
      Hilbert series - all three determined by the initial ideal, unlike graded
      Betti numbers, which are not and which this contract DOES NOT ASK FOR. NO
      MINIMAL FREE RESOLUTION AND NO BETTI TABLE IS REQUIRED, which is why the D1
      backend precondition that paused the predecessor does not bind here.
  controls:
    - >-
      C-DERIVATION (BLOCKING, seconds, and the check the redesign rests on).
      Symbolic verification over QQ(a,b) that the six permutations of the roots of
      x^3 + a x + b are singular points of V(S_3) and that the Jacobian ideal equals
      (e1, e2 - a, e3 + b) generically. Failure reinstates the source P1 and
      re-plans the run.
    - >-
      C-AUDIT (BLOCKING, seconds, THE PRIMARY DELIVERABLE). Distinct-value counts
      for all four statistics across generic, a = 0, b = 0, ten random curves and
      the six weight-12 loci at m = 3. A statistic with one distinct value is
      DECLARED NON-DISCRIMINATING BEFORE ANY EXPENSIVE CELL RUNS.
    - >-
      C-FIXTURE (BLOCKING). Affine (0, 6) on (a,b) = (441, 294) at p = 4001 in both
      engines, with homogenised dimension 1 reported separately.
    - >-
      C-PLANT-DIM (BLOCKING, planted defect of KNOWN magnitude). S_3 times a
      declared linear form must give affine dimension EXACTLY 1; S_3 squared must
      give affine dimension EXACTLY 2. A pipeline that does not detect a dimension
      jump of known size CANNOT DETECT A REAL ONE and every negative it reports is
      VOID.
    - >-
      C-NULL-LOCUS. Ten random weight-12 loci, identical pipeline, predicted generic
      values at all ten. If a random locus moves a statistic, the specialisation
      procedure is at fault and every positive is void.
    - >-
      C-GAUGE. Recompute at (u^4 a, u^6 b) for seeded random u. IMPLEMENTATION CHECK
      ONLY, per the committed C-GAUGE limit- it discharges that the code is right and
      NEVER that a difference is real, and is labelled as such on every row.
    - >-
      C-ORDER. Two monomial orders. Dimension and degree are order-independent, so
      disagreement is an implementation error, never a result.
    - >-
      C-ENGINE. Every cell computed twice by engines sharing no code path, with the
      pair named and with the note that a bundled Singular inside a Sage
      installation is a second CODE PATH and not a second BACKEND.
    - >-
      C-POLYTOPE (curve-free-style control). A random polynomial with the SAME
      NEWTON POLYTOPE as S_m, specialised to the same loci through the identical
      pipeline. PRE-STATED CONSEQUENCE- if it shows the same locus behaviour, any
      result here is about SPECIALISING POLYNOMIALS TO A COEFFICIENT SUBVARIETY and
      NOT about Semaev geometry or elliptic curves, and may not be quoted as one.
  independent_variables:
    - locus in {generic, a = 0, b = 0, the six weight-12 loci, ten random curves, ten random weight-12 null loci}
    - arity m in {3, 4}
    - prime p in {4001, one prime above 2^20}, with p in {2, 3} excluded
    - ring in {affine un-homogenised, homogenised} - reported separately, never merged
    - engine, two sharing no code path
    - monomial order, two
    - object in {S_m, S_3 times L, S_3 squared, same-polytope random polynomial}
  metrics:
    primary:
      - >-
        degeneracy-audit distinct-value count per statistic at m = 3 (count) - THE
        PRIMARY DELIVERABLE
      - >-
        multiplicity excess M1 = affine degree minus number of distinct affine
        singular points, per locus per m (non-negative integer)
      - >-
        homogenised (dimension, degree) per locus per m, in a SEPARATE LABELLED
        COLUMN with its ring named (integers)
    secondary:
      - affine (dimension, degree) per locus per m, with its ring named
      - full Hilbert series of the Jacobian ideal per locus per m
      - number of distinct affine singular points per locus
      - fixture reproduction boolean and the values obtained in each engine
      - symbolic derivation-check outcome over QQ(a,b)
      - planted-defect dimensions obtained against the predicted 1 and 2
      - null-locus values at the ten random weight-12 loci
      - same-polytope random-polynomial values per locus
      - engine and order agreement counts
      - censored cell inventory with mechanism (time or memory)
      - wall-clock seconds per cell, for budget and censoring only
  heuristic_under_test: HEUR-SING-2
  preregistered_prediction:
    quantity: >-
      The affine and homogenised dimension and degree, the multiplicity excess and
      the Hilbert series of the f_V-free Jacobian ideal of S_m, at each degeneration
      locus and at a generic control.
    formula: >-
      DERIVED- at m = 3 the affine pair is (0, 6) at EVERY nonsingular (a, b) in
      characteristic not 2 or 3, including a = 0, b = 0 and every weight-12 locus,
      because the reduced singular locus is the set of six permutations of the roots
      of x^3 + a x + b. Multiplicity excess null value 0, alternative at least 1.
      Homogenised dimension 1 on the fixture. At m = 4 the six weight-12 loci
      predicted identical to generic on all four statistics.
    source: >-
      This contract own derivation, performed on the form of S_3 committed VERBATIM
      in IDEA-20260807-5ddccf claim (A) and recorded in full in H-ICEX-604b5f
      statement (A); together with the committed msolve fixture in
      DEC-20260810-d70ece and the affine-versus-homogenised values in
      CORR-20260810-eb9062. All three records were read verbatim for this contract.
      THE DERIVATION IS OFFERED FOR MACHINE VERIFICATION IN STAGE 2 AND IS NOT
      ASSUMED.
  scale_relevance:
    tier: toy
    justification: >-
      Two primes, m in {3, 4}, one parametrisation per locus. Every quantity is an
      EXACT SYMBOLIC INVARIANT, so contention and load cannot corrupt it and there
      is no statistical scale at all. TRANSFER ASSUMPTION, STATED- the derivation is
      characteristic-uniform away from p in {2, 3}, so an m = 3 result at p = 4001
      is expected to hold at the larger prime, and the second prime tests exactly
      that. NO TRANSFER TO CRYPTOGRAPHIC p IS CLAIMED AND NONE IS NEEDED, since no
      cost is measured.
    correspondence: null
  tail_checks:
    - >-
      The number of DISTINCT affine singular points is reported beside the degree at
      every cell, not only their difference, so a reader can see which of the two
      moved when M1 moves.
    - >-
      The full Hilbert series is reported rather than its leading terms, since a
      change confined to a high-degree coefficient is exactly what a collapse to
      (dim, deg) would hide.
  replication:
    seeds: >-
      Seeded random u for C-GAUGE, seeded ten random curves and ten random
      weight-12 null loci, all listed in the run manifest before stage 3. Symbolic
      computations are deterministic, so replication here means ENGINE AND ORDER
      AGREEMENT rather than repeated sampling.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12.0
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
    - >-
      Stage 0, 1, 2 or 4 failure HALTS the run.
    - >-
      If stage 3 declares EVERY statistic non-discriminating at m = 3, the m = 3
      main arm is NOT RUN and the run proceeds to m = 4 or terminates with the
      audit and the derivation note as its deliverable. That termination is a
      RESULT, not a failure.
    - >-
      An m = 4 cell exceeding its wall-clock or memory cap is CENSORED with the
      mechanism named. THE ASSOCIATED PREDICTION IS THEN UNTESTED, and under
      AGENTS.md rule 5 this is an infrastructure receipt and NEVER a statement that
      the invariants are constant.
    - >-
      If the second engine cannot be made to produce degree or a Hilbert series
      independently, the run terminates as failed_infrastructure and reports so - a
      repeat of the predecessor outcome, which is infrastructure signal and never a
      mathematical statement.
    - >-
      Total wall-clock at the declared cap; remaining cells recorded as NOT
      ATTEMPTED.
  invalidation_rules:
    - >-
      A dimension or degree emitted without its RING named invalidates the row, per
      CORR-20260810-eb9062.
    - >-
      Presenting a homogenised value as an affine one, or merging the two columns,
      invalidates the run.
    - >-
      A planted defect not detected at its known dimension invalidates the whole
      run - the pipeline cannot see a jump it must be able to see.
    - >-
      A random weight-12 null locus moving a statistic invalidates every positive.
    - >-
      Two engines or two monomial orders disagreeing on dimension or degree
      invalidates the affected cells until reconciled.
    - >-
      Reporting the degree as the number of distinct points, or the reverse,
      invalidates the multiplicity-excess column.
    - >-
      Any m = 4 censored cell reported as confirming P2 invalidates the
      interpretation.
  success_criterion: >-
    Stage 0 to stage 4 all pass; the degeneracy-audit table is emitted with
    distinct-value counts for all four statistics; the eight-row locus table is
    emitted with affine and homogenised columns labelled separately and their rings
    named, the multiplicity-excess column filled, and the Hilbert series per locus;
    every control passes; and the m = 4 arm either completes or is censored with its
    mechanism named and its predictions marked UNTESTED. SUCCESS IS THE AUDIT PLUS
    A HONEST TABLE, not a particular direction.
  falsification_criterion: >-
    Every statistic constant at m = 3 declares the m = 3 arm NON-DISCRIMINATING and
    is the predicted outcome- the singular-locus functional cannot separate the
    degeneration divisor because it IS the 2-torsion locus. The affine pair MOVING
    at a = 0 or b = 0 falsifies this contract own derivation and is the most
    interesting available outcome, requiring symbolic re-examination before any
    other reading. A statistic moving at a weight-12 locus at m = 4 is a
    pre-registered positive requiring its own contract. A planted defect not
    detected voids every negative. A censored m = 4 arm falsifies nothing.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - a FRESH backend-provenance file with exact engine versions, not inherited from the previous run
    - the frozen parameter file with the locus list, random curves, null loci, planted polynomials, engines, orders and conventions
    - the stage 2 symbolic derivation-check transcript over QQ(a,b)
    - the stage 3 degeneracy-audit table with distinct-value counts per statistic
    - the fixture reproduction record from both engines, affine and homogenised separately
    - per-cell raw records (arm, m, locus, a, b, p, ring, engine, order, affine dim, affine deg, distinct points, multiplicity excess, homogenised dim, homogenised deg, Hilbert series, censored flag and mechanism, seconds)
    - planted-defect outcomes against the predicted dimensions 1 and 2
    - null-locus, gauge, order, engine and same-polytope control outcomes
    - the censored and not-attempted inventory with mechanisms
    - an explicit UNTESTED marker on every prediction whose cell was censored
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      THE DERIVATION THIS CONTRACT IS BUILT ON IS THE AUTHOR OWN HAND ARITHMETIC ON
      A COMMITTED FORM OF S_3 AND IS MACHINE-VERIFIED IN STAGE 2 RATHER THAN
      TRUSTED. It establishes CONTAINMENT exactly and EQUALITY only on the one
      committed fixture. The analogous m = 4 count of 21 all-2-torsion quadruples is
      a SKETCH with equality unchecked and no fixture available, and the audit tests
      it rather than assuming it.
    - >-
      P2 IS TESTABLE ONLY AT m = 4, because S_3 has no weight-12 coefficient factor.
      IF THE m = 4 ARM IS CENSORED, P2 IS UNTESTED AND NOT CONFIRMED. Whether the
      m = 4 Jacobian ideal is even reachable on this host is UNKNOWN before the
      audit runs, and a budget stop there is an infrastructure receipt.
    - >-
      A j-LINE RESULT, COLLIDING ON TWISTS and therefore carrying no isogeny-class
      information in either direction - and, after the derivation, colliding on
      EVERY nonsingular curve at m = 3.
    - >-
      f_V-FREE FORMULATION ONLY, non-transferable to the deployed f_V-bearing
      system by the same argument that makes it a curve functional at all.
    - >-
      NO TIME IS MEASURED AND NO COST CONSEQUENCE IS ASSERTED. A positive-dimensional
      singular locus is a genuine input to solver behaviour, but this contract
      measures no time and refuses to assert the connection.
    - >-
      IF THE SAME-POLYTOPE RANDOM-POLYNOMIAL CONTROL REPRODUCES THE LOCUS BEHAVIOUR,
      NOTHING HERE IS A STATEMENT ABOUT SEMAEV GEOMETRY OR ELLIPTIC CURVES.
      Pre-stated so it cannot be renegotiated after the data.
    - >-
      Degree counts MULTIPLICITY under the declared convention; the distinct-point
      count is separate; conflating them is exactly what the multiplicity-excess
      column exists to prevent.
    - >-
      Affine and homogenised singular loci differ by behaviour at infinity. Mixing
      them produced a committed correction and is a blocking requirement here.
    - >-
      p in {2, 3} is excluded explicitly, since partial derivatives behave
      differently in small characteristic.
    - >-
      claim_tier toy. No attack, no exponent, no speedup, sota_delta zero.
      Dominated by every row of the attack frontier, since no solver is produced.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
