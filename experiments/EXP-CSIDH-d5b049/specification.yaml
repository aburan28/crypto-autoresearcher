# =============================================================================
# EXP-CSIDH-d5b049 — version 1, approved by DEC-20261006-7eb0c2. Frozen census of invariant-factor lengths for
# IDEA-20261006-df8024. Success is the idea's prediction: at least one
# of the five primes has c(p) >= 2. A finished census in which all five
# groups are certified and every c(p) equals 1 is the concrete negative.
# This design session did not enumerate a form and did not compute an
# invariant factor. No discrete logarithm is authorized. Source idea
# bytes are copied unchanged from origin/design/ssi-2f5c3f-cartier,
# blob 8316f86a1ab5277b5f301b9fc133e9b62fac36fd.
# =============================================================================
experiment:
  id: EXP-CSIDH-d5b049
  hypothesis_id: H-CSIDH-4c10a8
  question_id: RQ-CSIDH-64343f
  source_idea: IDEA-20261006-df8024
  version: 1
  title: >-
    Invariant factors of the five class groups of discriminants -103,
    -107, -127, -131, and -139
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-7eb0c2
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that any group is non-cyclic, does not
      assert a Cohen-Lenstra probability, and does not assert a
      CSIDH security level.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      For each prime in {103, 107, 127, 131, 139}, enumerate the
      reduced positive-definite binary quadratic forms of discriminant
      -p, compute the invariant factors under Gauss composition, and
      repeat with ideal classes in Z[(1+sqrt(-p))/2]. Score c(p) only
      on agreement. Run the same pair of enumerations on discriminant
      -108 and require disagreement or refusal. Do not add a prime,
      do not drop a prime, and do not rank the five class numbers.
      Do not search for a discrete logarithm and do not run a
      quantum circuit.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the set of primes among 103, 107, 127, 131, and 139
    whose certified class group has at least two invariant factors
    strictly greater than 1 is non-empty. A finished census with all
    five groups certified and every c(p) equal to 1 is the concrete
    negative. No faster hidden-shift algorithm is in scope.

  inputs:
    primes: [103, 107, 127, 131, 139]
    congruence: each prime is congruent to 3 modulo 4
    order: Z[(1+sqrt(-p))/2]
    discriminant: -p
    nonfundamental_control: -108
    certificate: >-
      Two enumerations return the same ordered list of invariant
      factors. One enumeration uses reduced positive-definite binary
      quadratic forms and Gauss composition. The other builds ideal
      classes in the order and reduces them to the same form list.
      c(p) is the number of entries in that list that are strictly
      greater than 1. A disagreement leaves that p unscored.
    opposite_forms: >-
      The forms (a, b, c) and (a, -b, c) are one class. Counting
      either twice, or dropping the identification, voids that p.
    parity_check: >-
      A certified group order must be odd. An even order voids that
      p and is instrument_failure. It is not scored as non-cyclic
      and it is not scored as cyclic.
    class_number: >-
      The product of the invariant factors is recorded and then
      ignored. A write-up that ranks the five class numbers is not
      this test.
    cyclic_mass_note: >-
      If every group is certified, compute pi as the Cohen-Lenstra
      cyclic mass from the Aut-weights of all odd-order abelian
      groups of order at most the largest certified class number in
      the window, and record the mean 5*(1-pi) beside the count.
      That mean does not change the reading row. If the mass is not
      computed, record it as absent. Absence of the mean is not
      instrument_failure and does not change the row.

  controls:
    - id: odd-order
      statement: >-
        Each certified group has odd order. An even order fails the
        genus-theory check and voids that p as instrument_failure.
    - id: nonfundamental
      statement: >-
        The same two enumerations on discriminant -108 must either
        disagree or be refused. Silent agreement with a
        fundamental-discriminant code path voids the run.
    - id: class-number-ignored
      statement: >-
        The class number is recorded for each certified p and is not
        used to order the five primes. A ranking of the five class
        numbers is not this test and voids the reading if it is the
        only reported outcome.

  independent_variables:
    - prime p in {103, 107, 127, 131, 139}
    - enumeration in {binary quadratic forms, ideal classes}
    - whether the two lists agree

  metrics:
    primary:
      - id: noncyclic_count
        statement: >-
          The number of p in S with a certified invariant-factor list
          and c(p) >= 2. At least 1 is the idea's prediction.
    secondary:
      - id: factor_lists
        statement: the five invariant-factor lists, or unscored
      - id: agreement_bits
        statement: one agreement bit per prime
      - id: order_parity
        statement: the parity of each certified group order
      - id: tail_flag
        statement: >-
          true when any certified group order exceeds four times the
          median of the certified orders in the window, otherwise
          false. Not scored when fewer than one group is certified.
          The flag does not change the reading row.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says a window of five primes can contain one non-cyclic
    group under an Aut-weighted model. The row all_cyclic is the
    negative for the claim on this window. It is not a refutation of
    the measure on any larger set of discriminants. Do not relabel
    an unscored prime as cyclic.

  preregistered_prediction:
    quantity: >-
      The cardinality of {p in {103, 107, 127, 131, 139} : c(p) >= 2},
      with c(p) certified only by agreement of the two enumerations.
    formula: >-
      The cardinality is at least 1. The concrete negative is a
      finished census in which all five groups are certified and
      every c(p) equals 1. Source idea IDEA-20261006-df8024. No form
      was enumerated before this formula was frozen.
    source: >-
      IDEA-20261006-df8024. KN-LIT-508, opened in this session,
      estimates an indivisibility count and does not predict these
      five lists. The Cohen-Lenstra Aut-weight is recalled and is
      not a numerical prediction of the count.

  scale_relevance:
    tier: toy
    justification: >-
      The census is five prime discriminants, each below 200. No
      transfer to CSIDH-512, and none to a cryptographic class
      group, is assumed. The window is complete for these five
      names, so there is no draw whose tail probability must be
      resolved by extra samples. The minimum effect is the idea's
      own: at least one non-cyclic group.
    correspondence: >-
      Direct enumeration of reduced forms and of ideal classes.
      No Deuring correspondence is used to skip either enumeration.

  tail_checks:
    - >-
      Record whether any certified group order exceeds four times
      the median certified order in the window. That flag does not
      change the reading row.
    - >-
      Record the five class numbers and do not rank them.

  replication:
    seeds:
      - EXP-CSIDH-d5b049|forms
      - EXP-CSIDH-d5b049|ideals
    independent_instances: 5
    note: >-
      The census is deterministic. Five is the number of primes.
      The two seeds name the two enumerations, which must agree
      before a prime is certified. There is no shuffle sample.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the five primes and the discriminant
      -108 control. Wall-clock and CPU figures are advisory and
      null. The 2 GB memory figure is machine protection for the
      form and ideal arithmetic. A watchdog expiry is
      failed_infrastructure, not an empty set and not a non-cyclic
      count.

  stopping_rules:
    - Stop after the five primes, the -108 control, and exactly one reading row are recorded.
    - Do not add a prime or drop a prime after seeing a list.
    - Do not replace a disagreed list with a third enumeration after the fact.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - Any prime outside {103, 107, 127, 131, 139} being scored as one of the five voids the run.
    - Silent agreement on discriminant -108 voids the run.
    - An even certified order voids the run as instrument_failure.
    - Using a disagreed list in the non-cyclic count voids the run.
    - Ranking the five class numbers as the outcome voids the reading.

  success_criterion: >-
    The census finishes, the instrument checks pass, at least one
    prime has an agreed invariant-factor list with c(p) >= 2, and
    no disagreed list is counted. This is the prediction of
    IDEA-20261006-df8024. It is reachable as a failure when all five
    groups are certified and every c(p) equals 1.

  falsification_criterion: >-
    The census is fully scored, the instrument checks pass, all five
    groups are certified, and every c(p) equals 1. That empty set is
    the concrete negative named with the source idea. An even order,
    a silent agreement on discriminant -108, and a disagreed list
    used in the count are instrument rows. None of these is an
    infrastructure event.

  required_artifacts:
    - experiments/EXP-CSIDH-d5b049/runs/RUN-*/manifest.yaml
    - experiments/EXP-CSIDH-d5b049/runs/RUN-*/stdout.txt
    - experiments/EXP-CSIDH-d5b049/runs/RUN-*/stderr.txt
    - experiments/EXP-CSIDH-d5b049/runs/RUN-*/factors.csv
    - experiments/EXP-CSIDH-d5b049/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        a scored prime is outside the five, a prime is not congruent
        to 3 mod 4, discriminant -108 agrees silently, a certified
        group has even order, a disagreed list is used in the count,
        or opposite forms are double-counted
    - id: incomplete
      when: >-
        the instrument checks pass, no certified c(p) is at least 2,
        and fewer than five primes are certified
    - id: all_cyclic
      when: >-
        the instrument checks pass, all five primes are certified,
        and every c(p) equals 1
    - id: some_noncyclic
      when: >-
        the instrument checks pass and at least one certified c(p)
        is at least 2
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the order
    listed. some_noncyclic is the only success row. all_cyclic is the
    concrete negative. incomplete is not a cyclic window and is not a
    non-cyclic hit. instrument_failure is not an empty set. Record
    the five lists, the five agreement bits, the five parities, the
    non-cyclic count, and attack_claimed false beside the row. Those
    fields do not change the row.
