experiment:
  id: EXP-ALR-002
  hypothesis_id: H-ALR-002
  version: 1
  title: AutoLab R183 sparse-projector Prony locator import
  status: approved
  objective: >-
    Archive the verified AutoLab R183 nested-projector and sparse-locator
    package as an immutable crypto-autoresearcher experiment while preserving
    its finite toy scope, source-label collision, charged cost boundary, and
    open SLP-direct successor.
  inputs:
    source_repo: https://github.com/aburan28/autolab
    source_upstream: https://github.com/autolabhq/autolab
    source_commit: 583225fe9224d3f2a3dc910d88108deeb5cb31b6
    source_pr: https://github.com/autolabhq/autolab/pull/10
    source_round: R183
    source_harness_state: V132
    predecessor_experiment: EXP-ALR-001
    import_mode: provenance_pinned_research_receipt
  controls:
    - Replay all twelve R182 controls and one new strided divisor family
    - Compare projector traces to target-chart gcd degrees and direct group-law multiplicities
    - Recover candidate locators from exactly 2c weighted moments without a candidate oracle
    - Preserve source-label failure through an exact source-row-swap collision
    - Give finite exactness, rank, and locator recovery no asymptotic constructor credit
    - Keep Pollard-rho, Shoup, lane-admission, and breakthrough flags false
  independent_variables:
    - curve_family
    - replay_seed
    - source_divisor_family
    - target_chart
  metrics:
    primary:
      - nested_projector_trace_equals_gcd_degree
      - candidate_support_equals_nonzero_multiplicity_support
      - weighted_prony_locator_replay
      - represented_route_exponent_B
    secondary:
      - weighted_hankel_rank
      - target_gcd_multiplicity
      - source_blind_trace_collision
      - target_value_spectrum_degree
  scale_relevance:
    tier: toy
    justification: >-
      All exact controls use small prime fields. They validate the scalar output
      interface, locator recovery, and represented cost accounting, not a
      crypto-scale attack or compact moment constructor.
    correspondence: null
  replication:
    seeds:
      - 16001
      - 16002
      - 18104
      - 18206
      - 18307
    independent_instances: 13
  budget:
    wall_clock_seconds_per_run: 1000
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 1
  stopping_rules:
    - Stop after exact hash verification, source-receipt validation, and immutable package binding
    - Do not launch a new source experiment as part of this import
  invalidation_rules:
    - Any copied source artifact differs from its source-commit SHA-256
    - Any imported claim exceeds the R183 gate or V132 result boundary
    - Any run artifact is mutated rather than superseded by a new RUN id
  success_criterion: >-
    The EXP/RUN package verifies all 11 copied source hashes, binds source commit
    583225f, preserves the 19/28 admission boundary, and introduces no scoped
    ledger-validation errors beyond the merged main baseline.
  falsification_criterion: >-
    The import verifier or scoped ledger validator rejects the package, or the
    source report claims a rho, Shoup, lane, or breakthrough improvement.
  required_artifacts:
    - specification.yaml
    - implementation.md
    - analysis.md
    - verify_import.py
    - source/<11 pinned R183 and V132 artifacts>
    - runs/RUN-ALR-002-import/manifest.yaml
    - runs/RUN-ALR-002-import/command.txt
    - runs/RUN-ALR-002-import/environment.json
    - runs/RUN-ALR-002-import/stdout.log
    - runs/RUN-ALR-002-import/stderr.log
    - runs/RUN-ALR-002-import/raw-result.json
  assigned_to: executor
  approved_by: coordinator
