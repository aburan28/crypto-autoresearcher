# EXP-ECDLP-20ac31
# Stage-0 square-bias worksheet for H-ECDLP-18c7f7.
# Frozen before the official run.
experiment:
  id: EXP-ECDLP-20ac31
  hypothesis_id: H-ECDLP-18c7f7
  source_idea: IDEA-20261006-30b5f6
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Square bias of one four-term x-product on y^2 = x^3 + 6x + 2
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-b97cb8
  execution_authorized: true
  objective: >-
    On E: y^2 = x^3 + 6x + 2, take the smallest prime p with
    23 ≤ p ≤ 120 such that E is nonsingular and has at least 24
    affine points of nonzero y. Freeze the lexicographic first such
    point as Q. Let f be the fraction of the remaining eligible
    points whose element x(P+Q) x(P-Q) - x(P) x(Q) is a nonzero
    square. The positive reading is that |f - 1/2| is strictly above
    order statistic 285 of 300 x-shuffles. This is not a discrete
    logarithm.
  inputs:
    curve: "y^2 = x^3 + 6x + 2"
    prime_min: 23
    prime_max: 120
    minimum_nonzero_y_points: 24
    shuffles: 300
    rank: 285
    seed_label: IDEA-20261006-30b5f6
    named_future_run_slot: RUN-ECDLP-08e0d9
  controls:
    - >-
      Each scored point P, Q, P+Q, and P-Q lies on the curve. The
      discriminant 4*a^3 + 27*b^2 is nonzero at the selected prime.
    - >-
      The Legendre symbol is the field power, computed by built-in
      exponentiation and by repeated squaring. Disagreement voids the cell.
    - >-
      The 300 shuffles are a SHA-256 Fisher-Yates stream named by the
      idea id. The lex-second point is recorded and does not set the cutoff.
  independent_variables:
    - the eligible point P on the selected prime
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - planted_ok
      - sample_size
  heuristic_under_test: >-
    IDEA-20261006-30b5f6: the absolute deviation of the nonzero-square
    rate sits strictly above shuffle rank 285.
  preregistered_prediction:
    quantity: >-
      |2k - n| is strictly greater than the 285th of the 300 shuffle
      numerators, sorted nondecreasing. n is the size of the sample
      and k is the nonzero-square count.
    formula: >-
      The positive reading is that strict inequality. The negative
      reading is a valid sample whose numerator is at most rank 285.
      Equality does not exceed.
    source: >-
      IDEA-20261006-30b5f6 fixes rank 285 of 300 and states that a
      finished value at most that percentile is the concrete negative.
      That pair was fixed before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      One prime at most 120 and 300 shuffles. Pollard rho is not run.
    correspondence: null
  tail_checks:
    - No eligible prime, or an empty sample, invalidates the cell.
    - A point off the curve invalidates the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-ECDLP-08e0d9
    replication_note: >-
      One deterministic pass. The shuffle stream is named, not drawn
      from an unrecorded seed.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-08e0d9.
    - Do not score a later prime or a second curve.
    - A missed matrix is the recorded result. Do not change the rank.
  invalidation_rules:
    - No prime in the window has 24 affine points of nonzero y.
    - The sample is empty, a point leaves the curve, or the two Legendre evaluations disagree.
    - A timeout, crash, or a floating-point percentile.
  success_criterion: >-
    The manifest is valid, planted_ok is true, and the absolute
    numerator is strictly greater than shuffle rank 285.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, the sample is nonempty,
    and the absolute numerator is at most shuffle rank 285.
  decision_impact:
    on_positive: >-
      Record that this one prime beat its own x-shuffle cutoff. Do not
      treat that as a faster discrete logarithm.
    on_negative: >-
      Record that this one prime did not beat the cutoff. Do not move
      the rank and do not run rho from this manifest.
  required_artifacts:
    - experiments/EXP-ECDLP-20ac31/runs/RUN-ECDLP-08e0d9/manifest.yaml
    - experiments/EXP-ECDLP-20ac31/runs/RUN-ECDLP-08e0d9/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-ECDLP-20ac31/trial-plan.json
    driver: experiments/EXP-ECDLP-20ac31/implementation/run.py
    checker: experiments/EXP-ECDLP-20ac31/implementation/check.py
  out_of_scope:
    - Any prime outside 23 through 120, and any second curve.
    - Pollard rho, a factor base, and a security level.
