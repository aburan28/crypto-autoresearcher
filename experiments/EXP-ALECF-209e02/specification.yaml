experiment:
  id: EXP-ALECF-209e02
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-04bcb1; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-04bcb1
  question_id: RQ-QRE-6dba8c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Sweep a named surface-code cost model to map the region of its parameter space where a logical
    Toffoli-times-qubits score and physical space-time volume rank two circuits oppositely, instantiated
    on the two committed ALECF resource vectors.
  objective: 'The one uncertainty a run reduces is whether a logical-layer circuit score is an order-preserving
    proxy for physical cost, and if not, where it stops being one. Concretely: (i) can a surface-code
    cost map be written with every constant either derived in the record or cited to a filed source,
    such that it evaluates only when the sourcing gate passes, and does it satisfy the two structural
    controls, namely zero disagreement for identical vectors and zero disagreement for a dominating
    pair; (ii) over a pre-registered parameter box, and restricted to the model''s declared validity
    domain, what fraction of parameter space ranks the two committed ALECF vectors oppositely under
    the logical product and under space-time volume, and does the analytically solved boundary agree
    with the grid classification to the declared threshold; (iii) does a population of marginal-matched
    but decoupled resource-vector pairs produce the same disagreement volume, which is the null distinguishing
    a property of circuits from a property of the cost function''s geometry. A run reproduces no published
    total, quotes no headline number, and derives no date, timeline, arrival probability or policy
    statement, as RQ-QRE-6dba8c''s constraints require. The deliverable is the boundary, the disagreement
    volume with its validity-domain fraction, the per-input flip counts, the null comparison, and
    an explicit two-sided statement naming one way the model flatters the attacker and one way it
    flatters the defender.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the named surface-code
      cost map as implemented, with its constants as sourced, over the pre-registered parameter box
      and within its declared validity domain, the logical product score and space-time volume rank
      the two given resource vectors oppositely on the measured fraction of that box, with the measured
      boundary. WHAT DOES NOT FOLLOW: nothing about which circuit is actually cheaper on any machine,
      nothing about whether the cost model is correct, nothing about any published estimate''s accuracy,
      nothing about the circuits behind the imported ALECF scores, no timeline, arrival probability
      or policy implication of any kind, and no attack or security consequence. A boundary in a model''s
      parameter space is a fact about that model and about nothing else.'
  inputs:
    procedure: 'STAGE 0 (cost: several hours): enumerate every constant the cost map needs and, for
      each, either derive it in the record or mark it unsourced; implement the gate that refuses evaluation
      while any constant is unsourced. STAGE 1 (cost: three to five hours of engineering): implement
      the surface-code cost map from (T, Q, depth, target logical error rate, physical error rate,
      cycle time, distillation parameters) to (physical qubits, wall-clock time, space-time volume),
      with an explicit validity-domain predicate. STAGE 2 (cost: under an hour): implement and pass
      the two structural controls (identical vectors, dominating pair). STAGE 3 (cost: minutes of
      compute): sweep the pre-registered grid, classify each point by ordering agreement, and record
      the validity-domain mask. STAGE 4 (cost: two hours): solve the boundary inequality analytically
      where the cost map''s form permits and compare cell-by-cell with the grid classification. STAGE
      5 (cost: minutes, same invocation): generate 200 marginal-matched decoupled vector pairs and
      repeat STAGE 3 on them. STAGE 6 (cost: two hours): write the per-input flip counts, the disagreement
      volume at fixed depth slices and integrated, and the two-sided flattery statement naming one
      attacker-flattering and one defender-flattering feature of the model as implemented.'
    instrument: Python 3.11 standard library and numpy for the cost map and the grid sweep; sympy
      for the analytic boundary solution where the cost map's form is symbolic; a small constants
      module in which every value carries a provenance field and the evaluator raises on a missing
      one; matplotlib only for the boundary figure, which is a secondary artifact; harness/runner.py
      for the run record, its inference block and the resolved-policy fields. No Sage, no quantum
      simulator, no hardware, no external service. The two ALECF resource vectors are read directly
      from the committed score.json files under experiments/EXP-ALECF-00{1,3}/source/ and their sha256
      values are recorded.
    parameters: 'Two fixed logical resource vectors from committed artifacts: (T equal to 1316081,
      Q equal to 1152) and (T equal to 1423723, Q equal to 1141). Depth swept over 8 logarithmically
      spaced values across a declared range, since depth is not recorded in the committed artifacts.
      Physical error rate over 6 values; target logical error rate over 4 values; cycle time over
      4 values; distillation scheme over 3 named parameter sets; code-distance selection rule over
      2 variants. Grid total 8 times 6 times 4 times 4 times 3 times 2 equal to 4608 points, evaluated
      for both the real pair and each of 200 null pairs. Analytic boundary compared cell-by-cell on
      the same grid.'
  controls:
  - Marginal-matched decoupled resource-vector pairs as the null population, computed over the identical
    parameter box in the same invocation.
  - Analytic boundary solution cross-checked against the grid sweep, with a declared minimum agreement
    threshold acting as an instrument check.
  - 'Identical-vector control: two identical resource vectors must produce zero disagreement volume
    everywhere, by construction.'
  - 'Dominating-pair control: a vector pair where one dominates the other on every axis must produce
    zero disagreement volume in the entire validity domain, since no monotone physical cost function
    can reverse a dominance.'
  - 'Unsourced-constant gate: the cost map refuses to evaluate if any constant lacks a derivation
    or a filed source, which is a control on the record rather than on the arithmetic.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a population of resource-vector pairs whose per-axis
    marginals match the measured population but whose axes are independently drawn, so that the correlation
    between Toffoli count and peak width induced by real circuit design is destroyed. The identical
    boundary computation and disagreement-volume measurement runs on the null pairs over the identical
    parameter box in the same invocation. For the signal arm to mean anything the null must show a
    DIFFERENT disagreement volume: if arbitrary decoupled pairs disagree over the same fraction of
    parameter space, then the disagreement volume measures the geometry of the cost function alone
    and says nothing about circuits, which is a legitimate and reportable finding but a different
    one from the claimed result.'
  independent_variables:
  - physical error rate
  - target logical error rate
  - cycle time
  - distillation scheme parameter set together with the code-distance selection rule
  - assumed circuit depth
  metrics:
    primary:
    - ordering-disagreement indicator per grid point
    - disagreement volume within the validity domain
    - analytic-versus-grid classification agreement
    - null-population disagreement volume
    secondary:
    - validity-domain fraction of the swept box
    - per-input disagreement-bit flip count
    - physical qubit count and wall-clock time per grid point for each vector
    - provenance-completeness fraction of the constants table
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'The disagreement volume V: the fraction of validity-domain grid points at which the
      logical product ordering of the two committed ALECF vectors is opposite to their space-time-volume
      ordering.'
    formula: 'Let L(T, Q) = round(T) times Q be the logical score and let SV(T, Q, D, theta) be space-time
      volume from the cost map at parameter point theta. Define disagree(theta) = 1 if sign(L(v1)
      minus L(v2)) is not equal to sign(SV(v1, theta) minus SV(v2, theta)), else 0. Then V = (sum
      over validity-domain grid points of disagree) divided by (number of validity-domain grid points).
      Predicted: V at or above 0.05. Supporting arithmetic already fixed: L(v2) divided by L(v1) equals
      1624467943 divided by 1516125312, that is 1.0715, while Q2 divided by Q1 equals 1141 divided
      by 1152, that is 0.9905, and T2 divided by T1 equals 1.0818, so the ordering reverses precisely
      when the physical cost''s elasticity with respect to Q exceeds roughly 8.6 times its elasticity
      with respect to T.'
    source: Pre-registered in the parent proposal IDEA-20260816-04bcb1 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: medium
    justification: 'The logical resource vectors used are the 256-bit secp256k1 point-addition figures
      as committed in this repository''s imported packages, so the arithmetic instance is at cryptographic
      width; but the deliverable is a boundary in a model''s parameter space, not a measurement of
      any circuit or machine, and no circuit is built, simulated or verified at that width. The tier
      is recorded as medium rather than crypto for that reason: the inputs are crypto-width numbers,
      the claim is about a model. The transfer assumption, stated plainly, is that the committed vectors
      are the correct logical inputs for these two packages, which the score-relation recomputation
      supports and which the provenance audit contract in this batch would test independently.'
    correspondence: null
  tail_checks:
  - Inspect grid points at the extreme of the code-distance selection rule, where the validity predicate
    is most likely to be near its boundary and classification is least stable.
  - Check whether the disagreement region is concentrated entirely in one distillation parameter set,
    which would make V a statement about that set rather than about the model.
  - Examine fixed-depth slices for depth values where disagreement is total or absent, indicating
    the depth axis dominates the result.
  - Check for grid points where the two vectors' space-time volumes are equal to within floating-point
    tolerance, which must be classified as ties rather than as agreements.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate after the pre-registered grid; no adaptive refinement, since refining after seeing the
    boundary would bias the volume.
  - Abort and report an instrument failure if either structural control (identical vectors, dominating
    pair) shows nonzero disagreement.
  - Abort if the constants table is not provenance-complete, per the unsourced-constant gate.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run evaluates the full pre-registered grid with a provenance-complete constants
    table, passes both structural controls, reports V with its validity-domain fraction, reports analytic-versus-grid
    agreement at or above the declared threshold, reports the null-population volume from the same
    invocation, and states one attacker-flattering and one defender-flattering feature of the model
    as implemented.
  falsification_criterion:
  - Either structural control failing.
  - Analytic and grid boundaries agreeing on fewer than 98 percent of cells.
  - V equal to zero throughout the validity domain, which closes the question for this model and box
    in the order-preserving direction.
  - The validity domain covering less than 10 percent of the swept box.
  - The constants table failing the provenance gate, in which case no number is reported at all.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-04bcb1
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Every constant in the cost map must be derived in-record or cited to a filed KN-LIT entry before
    approval; because this environment cannot reach external literature, the Coordinator must decide
    whether in-record derivation alone satisfies RQ-QRE-6dba8c's sourcing constraint or whether the
    contract must wait on filed primary reads.
  - The parameter box must be pre-registered with justified ranges; the ranges above are placeholders
    and choosing them after seeing the boundary would be circular.
  - Depth is absent from the committed artifacts, and the Coordinator must decide whether sweeping
    it as an unknown is acceptable or whether the contract should be restricted to synthetic vectors
    with known depth.
  - Whether space-time volume is the right physical ordering, or whether a second ordering charging
    idle logical qubits differently must be run as a co-primary, is not settled here.
