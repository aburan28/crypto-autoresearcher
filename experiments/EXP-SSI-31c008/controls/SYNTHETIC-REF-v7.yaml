control_reference:
  id: SYNTHETIC-REF-v7
  format: SYNTHETIC-REF-v7
  status: design_manifest_no_measurement
  experiment_id: EXP-SSI-31c008
  cells: 8
  targets_per_cell: 16
  initial_state_rule: >-
    Each cell initial numerator, denominator, and censor limit are typed fields
    in the cell manifest. They are not supplied by a treatment observation.
  cell_seed: SHA256(DOMAIN-v7 code=70 body_schema=1 over cell_index(u64))
  target_frame: >-
    SYN-TARGET-v7 is raw 237 bytes: cell_index(u64)||target_index(u64)||
    target_id(32)||state_num(signed560)||state_den(unsigned560)||attempts(u64)||
    successes(u64)||target_digest(32). target_digest is SHA256 of the raw 237
    bytes with only target_digest omitted; denominator is positive and reduced.
  recurrence: >-
    For each ordered target, next_num=num+successes and next_den=den+attempts;
    exact signed560 query FOE accumulates. Censoring is explicit and invalidates
    the cell rather than becoming zero. All initial and recurrence values are
    serialized before any comparison.
  cell_frame: >-
    Cell payload is cell_index(u64)||cell_seed(32)||target_count(u64=16)||
    target_frames(16*237)||cell_digest(32). cell_digest hashes the cell payload
    with only cell_digest omitted. table_digest hashes the eight complete cells.
  admission:
    measured_cells_present: false
    independent_verification_receipt: null
    missing_reference_is: INVALID_CONTROL
    freeze_allowed: false
