experiment:
  id: EXP-SSI-31c008
  version: 12
  schema: SSI-CANONICAL-v12
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: >-
    This is a design-only successor to EXP-SSI-bf10ef. It records a contract
    repair after the v11 Red Team dissent and contains no executed observation
    or cryptanalytic claim.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-5026eb
  source_proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
  direct_predecessor: EXP-SSI-bf10ef
  predecessor_contract: experiments/EXP-SSI-bf10ef/specification.yaml
  supersedes: EXP-SSI-bf10ef
  title: >-
    SSI-CANONICAL-v12 explicit local digests, source-bound advice, total
    terminals, typed edge semantics, deterministic replay, and matched baseline
  objective: >-
    Define one statically reviewable, byte-recomputable, design-only contract
    that closes the v11 observation fibers. V12 distinguishes top-level frames
    from local integrity fields, includes the exact source and algorithm inputs
    in A_p, totalizes finite attempt scheduling and terminal precedence, gives
    every named digest an ordered preimage, fixes HNF and replay equations,
    charges provider/mirror/serialization/memory work, and binds a matched
    incumbent comparison without materializing any run.
  claim_ceiling: >-
    At most a statically reviewable contract and a list of admission gates. It
    cannot establish an SSI attack, a OneEnd result, a lower bound, a security
    result, an exponent change, a performance advantage, an all-advice theorem,
    or a result for EndRing, Isogeny, SQIsign, CSIDH, SIDH, or deployed systems.
  metrics:
    required: [validity_status, terminal_code, total_foe, total_bytes, memory_bytes, success_bit, break_even_q]
    note: No metric is populated; maximum_runs is zero and no execution is authorized.
  budget:
    wall_clock_seconds: 1200
    memory_gb: 2
    maximum_runs: 0
    note: This successor is contract repair only.
  success_criterion: >-
    Not applicable until all registry, source, edge, provider, control, replay,
    incumbent, and independent-review inputs are materialized. No success is
    asserted by this record.
  falsification_criterion: >-
    The contract is falsified as byte-recomputable if two conforming serializers
    can produce different bytes for any top-level frame, local digest preimage,
    source/advice object, finite terminal, event/buffer interval, semantic
    transition, replay arm, control row, or incumbent comparison predicate.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    predecessor_contract: experiments/EXP-SSI-bf10ef/specification.yaml
    predecessor_red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-b0c877/reviews/TASK-20260809-7161f4/red_team_report.md
    predecessor_red_team_receipt: coordination/goals/GOAL-SSI-001/batches/BATCH-b0c877/reviews/TASK-20260809-7161f4/runtime-session-receipt.json
    predecessor_validator: coordination/goals/GOAL-SSI-001/batches/BATCH-b0c877/reviews/TASK-20260809-6b9a85/validation_report.yaml
    frame_registry: experiments/EXP-SSI-31c008/inputs/FRAME-REGISTRY-v7.yaml
    provider_trust: experiments/EXP-SSI-31c008/inputs/PROVIDER-TRUST-v7.yaml
    source_algorithm: experiments/EXP-SSI-31c008/inputs/SOURCE-ALGORITHM-v7.yaml
    source_blob: experiments/EXP-SSI-31c008/inputs/SOURCE-BLOB-v7.yaml
    edge_algorithm: experiments/EXP-SSI-31c008/inputs/EDGE-ALGORITHM-v7.yaml
    incumbent: experiments/EXP-SSI-31c008/inputs/INCUMBENT-BASELINE-v2.yaml
    c_pair_control: experiments/EXP-SSI-31c008/controls/C-PAIR-REF-v7.yaml
    synthetic_control: experiments/EXP-SSI-31c008/controls/SYNTHETIC-REF-v7.yaml
  lineage_rule: >-
    EXP-SSI-bf10ef and earlier contracts are immutable provenance only. No v11
    width, default, formula, digest, terminal, cost, or semantic rule is
    inherited. Every active v12 rule is repeated below; the named predecessor
    files identify only the repair evidence and are not executable inputs.

  wire:
    outer_frame: >-
      Every top-level frame is tag(u8)||version(u8=7)||payload_len(u32 LE)||
      payload(payload_len exact bytes). A top-level digest is the final payload
      field and equals SHA256 of the complete outer frame with only that final
      digest field omitted. The omitted field is not counted in the shortened
      payload length. No top-level object is unframed.
    bytestring: u32 little-endian byte length followed by exactly that many opaque bytes; all paths and names use canonical NFC-prohibited UTF-8 bytestrings.
    integers:
      u8: 1 byte
      u16: 2 bytes little-endian
      u32: 4 bytes little-endian
      u64: 8 bytes little-endian
      digest: 32 bytes
      signed560: sign(u8=0 positive,1 negative)||magnitude(70 bytes LE); negative zero rejected; magnitude < 2^560
      unsigned560: magnitude(70 bytes LE), value < 2^560
    curve_id: >-
      fixed bytes are p_code(u8)||field_bytes(j0)||field_bytes(j1), with
      field_bytes fixed by the p row and canonical coefficients. The curve-id
      table digest hashes these fixed bodies in ascending vertex index order.
    subrecord_rule: >-
      A local subrecord has no tag, version, payload_len, or independent object
      identity. A local digest field is permitted only when the schema catalog
      below lists it; it is an integrity field of the containing raw range, not
      a standalone frame. Every local digest has an explicit ordered preimage.
      A verifier rejects any local record with an unlisted digest or a local
      digest presented as a top-level frame.
    local_digest_rule: >-
      For a local raw record R with local digest d, local_digest is
      SHA256(R bytes with exactly d omitted). The containing frame hashes the
      complete local bytes, including d, unless its own digest preimage says
      otherwise. Local digest omission never changes the containing range.
    admission: >-
      A null registry digest, null schema digest, unknown tag/version, wrong
      local width, negative padding, duplicate identifier, or ambiguous digest
      catalog entry is INVALID_CONTROL and blocks freeze.

  registry_table:
    entries:
      - {tag: 1, name: FRAME-REGISTRY-v7, final_digest: registry_digest}
      - {tag: 2, name: DOMAIN-v7, final_digest: domain_digest}
      - {tag: 3, name: SSJ-MANIFEST-v7, final_digest: manifest_digest}
      - {tag: 4, name: ADVICE-v7, final_digest: advice_digest}
      - {tag: 5, name: TARGET-MANIFEST-v7, final_digest: target_digest}
      - {tag: 6, name: ORDER-v7, final_digest: order_digest}
      - {tag: 7, name: HELPER-v7, final_digest: helper_digest}
      - {tag: 8, name: TARGET-INDEX-v7, final_digest: index_digest}
      - {tag: 9, name: SEED-LIST-v7, final_digest: seed_list_digest}
      - {tag: 10, name: BUILDER-REQUEST-v7, final_digest: request_digest}
      - {tag: 11, name: OWNER-RECORD-v7, final_digest: record_digest}
      - {tag: 12, name: NULL-RECORD-v7, final_digest: null_digest}
      - {tag: 13, name: BUILDER-TERMINAL-v7, final_digest: terminal_digest}
      - {tag: 14, name: EDGE-CERT-v7, final_digest: certificate_digest}
      - {tag: 15, name: PROVIDER-TRUST-v7, final_digest: trust_digest}
      - {tag: 16, name: PROVIDER-RECEIPT-v7, final_digest: receipt_digest}
      - {tag: 17, name: EDGE-TRANSITION-v7, final_digest: transition_digest}
      - {tag: 18, name: PROVIDER-SIGN-MESSAGE-v7, final_digest: sign_digest}
      - {tag: 19, name: MATRIX-v7, final_digest: matrix_digest}
      - {tag: 20, name: OP-LOG-v7, final_digest: op_log_digest}
      - {tag: 21, name: SATURATION-v7, final_digest: saturation_digest}
      - {tag: 22, name: OUTPUT-v7, final_digest: output_digest}
      - {tag: 23, name: EVENT-TRACE-v7, final_digest: trace_digest}
      - {tag: 24, name: PAIR-REQUEST-v7, final_digest: pair_request_digest}
      - {tag: 25, name: ARM-TRACE-v7, final_digest: arm_digest}
      - {tag: 26, name: SHARED-TRACE-v7, final_digest: shared_digest}
      - {tag: 27, name: FINAL-IDENTITY-v7, final_digest: identity_digest}
      - {tag: 28, name: C-PAIR-REF-v7, final_digest: c_pair_digest}
      - {tag: 29, name: SYNTHETIC-REF-v7, final_digest: synthetic_digest}
      - {tag: 30, name: SOURCE-BLOB-v7, final_digest: source_blob_digest}
      - {tag: 31, name: SOURCE-ALGORITHM-v7, final_digest: source_algorithm_digest}
      - {tag: 32, name: EDGE-ALGORITHM-v7, final_digest: algorithm_digest}
      - {tag: 33, name: INCUMBENT-BASELINE-v2, final_digest: incumbent_digest}
    schema_digest_rule: >-
      The registry input carries one schema_digest and final_field_code for each
      entry. schema_digest is SHA256(DOMAIN-v7 domain_code=1 body_schema=2 over
      tag, version, exact grammar bytes, local catalog bytes, and final field
      code). registry_digest is the final digest of tag 1 over entries in
      ascending tag order. Null schema or registry digests are design-time
      placeholders and hard admission failures.
    local_schema_catalog:
      - {name: SLOT-v7, width: 96, local_digest: none}
      - {name: INDEX-RECORD-v7, width: 192, local_digest: none}
      - {name: ENDPOINT-v7, width: variable_512, local_digest: endpoint_digest}
      - {name: PAYLOAD-v7, width: variable, local_digest: payload_digest}
      - {name: EVENT-v7, width: 196, local_digest: event_digest}
      - {name: BUFFER-v7, width: 34, local_digest: none}
      - {name: OP-v7, width: 196, local_digest: op_digest}
      - {name: SATURATION-ROW-v7, width: 110, local_digest: row_digest}
      - {name: ARM-RESULT-v7, width: 193, local_digest: arm_digest}
      - {name: C-PAIR-ROW-v7, width: 384, local_digest: row_digest}
      - {name: SYN-TARGET-v7, width: 237, local_digest: target_digest}

  digest_preimage_catalog:
    top_level: >-
      Every tag 1..33 final digest is SHA256 of its complete outer frame with
      only that final field omitted, including the exact shortened payload_len
      induced by the omission.
    domain: DOMAIN-v7 complete outer frame with domain_digest omitted.
    manifest: >-
      manifest_digest is the tag-3 final digest. curve_id_table_digest is
      SHA256(DOMAIN-v7 domain_code=8 body_schema=1 over p_code||vertex_count||
      ordered fixed curve-id bodies). The manifest includes that digest before
      its own final field.
    source: >-
      source_algorithm_digest is the final digest of tag 31. source_blob_digest
      is the final digest of tag 30. source_domain_digest is
      SHA256(DOMAIN-v7 domain_code=9 body_schema=2 over p_code||tree_commit||
      canonical_path||source_algorithm_digest||source_blob_digest||
      target_free_transcript_digest). No source identity is a bare string.
    map: >-
      map_digest is SHA256(DOMAIN-v7 domain_code=15 body_schema=1 over
      target_digest||advice_digest||target_index||selection_code||pair_key||
      ordered map record bytes). The map record bytes are in the index frame;
      no map oracle is accepted.
    local: >-
      endpoint_digest, payload_digest, event_digest, op_digest, row_digest,
      arm_input_digest, normalized_digest, shared_prefix_digest, and
      null_mutation_digest each use the local_digest_rule over the exact raw
      record named by its schema. A local digest is never hashed over a
      containing table unless the containing final digest explicitly says so.
    local_digest_catalog: >-
      The complete local digest catalog is endpoint_digest on ENDPOINT-v7,
      payload_digest on PAYLOAD-v7, event_digest on EVENT-v7, op_digest on OP-v7,
      row_digest on SATURATION-ROW-v7 and C-PAIR-ROW-v7, target_digest on
      SYN-TARGET-v7, arm_digest on ARM-RESULT-v7, and the named digest fields in
      the replay frames. No other local digest name is valid.
    provider_bytes: >-
      artifact_digest is SHA256(DOMAIN-v7 domain_code=16 body_schema=1 over
      provider_id||canonical_path||artifact_bytes). mirror_digest is the same
      domain with code 17 over provider_id||canonical_mirror_path||mirror_bytes.
      Path bytes, lengths, and all bytes are included in event and buffer cost.
    provider_signature: >-
      sign_digest is the tag-18 final digest with sign_digest omitted. Ed25519
      signs the exact complete tag-18 outer frame with sign_digest omitted;
      receipt signature verification uses that same byte string and the trusted
      public key. Receipt and signature bytes are excluded from this signed
      preimage and charged as separate events.
    stream_terminal: >-
      Let T0 be the tag-13 outer frame whose payload contains request_digest,
      terminal_code, terminal_position, requested_count, emitted_count,
      retained_count, candidate_count, and reason, with payload_len equal to
      exactly that shortened payload and with both stream_digest and
      terminal_digest omitted. stream_digest=SHA256(request complete frame ||
      emitted fixed strides || T0). Let T1 be the complete tag-13 frame with
      only terminal_digest omitted, using its actual payload_len and stream_digest.
      terminal_digest=SHA256(T1). No digest depends on itself or a later length.
    transition_root: >-
      transition_root=SHA256(DOMAIN-v7 domain_code=51 body_schema=1 over
      target_digest||advice_digest||ordered transition_digest values||edge_count).

  bounds:
    p_rows:
      - {p_code: 1, label: SQISign-I, field_bytes: 32, security_bits: 256}
      - {p_code: 2, label: SQISign-V, field_bytes: 64, security_bits: 512}
    vertex_count_max: 4000000
    owner_count_min: 2
    owner_count_max: 8388607
    endpoint_count_min: 2
    endpoint_count_max: 7
    target_count_max: 2000000
    selection_count: 4
    helper_capacity_max: 524288
    attempts_max: 32768
    graph_steps_max: 1048576
    candidate_cap_max: 8388607
    max_reason_bytes: 1024
    max_pair_draws: 8388607
    max_events: 350000
    max_buffers: 65535
    max_edge_count: 80000
    max_transition_factors: 8
    max_hnf_operations: 200000
    max_matrix_rows: 512
    max_matrix_columns: 512
    source_blob_max: 67108864
    trace_bytes_max: 67108864
    output_bytes_max: 8388608

  frame_table:
    registry: >-
      tag 1 payload is entry_count(u16)||entry records in ascending tag order.
      Each entry is tag(u8)||version(u8=7)||name(bytestring)||schema_digest(32)||
      final_field_code(u8). registry_digest is final and all entries must match
      FRAME-REGISTRY-v7 input byte-for-byte.
    domain: >-
      tag 2 payload is domain_code(u16)||body_schema(u8)||body(bytestring)||
      domain_digest(32). Domain code and schema are part of every derivation;
      raw ASCII labels are never implicit preimages.
    manifest: >-
      tag 3 payload is p_code(u8)||p_expression(bytestring)||vertex_count(u64)||
      curve_id_table_digest(32)||curve_ids(bytestring)||manifest_digest(32).
      curve_ids contains exactly vertex_count fixed curve_id bodies in ascending
      index order; its bytes and digest are charged as input.
    advice: >-
      tag 4 payload is p_code(u8)||manifest_digest(32)||source_domain_digest(32)||
      advice_seed(32)||owner_count(u64)||owner_indices(owner_count*u64)||
      owner_set_digest(32)||order_digest(32)||helper_digest(32)||advice_digest(32).
      A_p contains this frame plus complete source blob, source algorithm,
      manifest, order, helper, and their typed source-bound inputs; it contains
      no target, target index, attempt, selection, provider, or query field.
    target_manifest: >-
      tag 5 payload is p_code(u8)||manifest_digest(32)||target_count(u64)||
      target_indices(target_count*u64)||target_digest(32), ascending unique.
      This is phase-1 material after A_p is fixed and is not advice.
    order: >-
      tag 6 payload is p_code(u8)||owner_count(u64)||owner_indices(owner_count*u64)||
      owner_set_digest(32)||order_seed(32)||order_digest(32). The order digest
      is SHA256(DOMAIN-v7 code 12 over p_code||owner_set_digest||order_seed||
      ordered owner indices); no list hash is implicit.
    helper: >-
      tag 7 payload is p_code(u8)||owner_set_digest(32)||order_digest(32)||
      capacity(u64)||slot_count(u64)||slot_body(slot_count*96)||
      payload_blob(bytestring)||helper_digest(32). SLOT-v7 is
      slot_tag(u8=193)||state(u8)||pair_key(32)||owner_index(u64)||
      endpoint_index(u64)||payload_offset(u64)||payload_length(u32)||
      payload_digest(32)||reserved(u16=0). PAYLOAD-BLOB-v7 body is
      payload_count(u64)||ordered PAYLOAD-v7 records; PAYLOAD-v7 is
      owner_index(u64)||endpoint_index(u64)||degree(signed560)||factor_count(u16)||
      factors(factor_count*signed560)||matrix_frame(bytestring)||payload_flags(u8)||
      payload_digest(32), with digest over the raw record without payload_digest.
      Empty slots are 96 zero bytes; ranges are disjoint and pointer lengths are
      checked against the one complete payload blob.
    target_index: >-
      tag 8 payload is p_code(u8)||target_digest(32)||advice_digest(32)||
      map_digest(32)||target_count(u64)||selection_count(u8=4)||record_width(u16=192)||
      records(target_count*4*192)||index_digest(32). INDEX-RECORD-v7 is raw
      record_tag(u8=8)||target_index(u64)||selection_code(u8)||branch_code(u8)||
      owner_index(u64)||endpoint_index(u64)||pair_key(32)||helper_digest(32)||
      slot_index(u64)||payload_offset(u64)||payload_length(u32)||payload_digest(32)||
      query_key(32)||reserved(17). map_digest binds these exact records.
    seed_list: >-
      tag 9 payload is p_code(u8)||request_seed(32)||attempt_count(u64)||
      pairs(attempt_count*(attempt_index(u64)||attempt_seed(32)))||seed_list_digest(32).
      attempt_count<=attempts_max, indices are exactly 0..attempt_count-1,
      seeds are pairwise unique, and attempt_seed is SHA256(DOMAIN-v7 code 3
      body_schema=1 over request_seed||attempt_index).
    request: >-
      tag 10 payload is p_code(u8)||advice_digest(32)||target_digest(32)||
      request_id(u64)||request_seed(32)||seed_list_digest(32)||attempt_count(u64)||
      candidate_cap(u64)||owner_schedule_digest(32)||request_digest(32). The
      schedule digest is SHA256(DOMAIN-v7 code 20 over request_digest||ordered
      attempt-to-owner schedule); candidate_cap<=candidate_cap_max.
    endpoint_owner: >-
      tag 11 payload_len is exactly 4090 and complete frame width is 4096.
      Payload is owner_index(u64)||endpoint_count(u32)||endpoint raw records||
      zero padding||record_digest(32). Padding length is
      4090-(8+4+endpoint_count*512+32), nonnegative. ENDPOINT-v7 is a 512-byte
      raw record: endpoint_index(u64)||curve_id(bytestring)||pair_key(32)||
      slot_index(u64)||payload_offset(u64)||payload_length(u32)||payload_digest(32)||
      zero padding||endpoint_digest(32), where padding is the exact remainder and
      endpoint_digest hashes the raw 512 bytes without itself.
    null: >-
      tag 12 payload_len is exactly 4090 and complete frame width is 4096.
      Payload is position(u64)||null_reason(u8)||request_digest(32)||
      owner_index(u64=0)||endpoint_count(u32=0)||zero endpoint_digest(32)||
      zero padding||null_digest(32). Padding is 4090 minus the listed fixed
      fields; null_digest is the tag-12 final digest with its own field omitted.
    terminal: >-
      tag 13 payload is request_digest(32)||terminal_code(u8)||
      terminal_position(u64)||requested_count(u64)||emitted_count(u64)||
      retained_count(u64)||candidate_count(u64)||reason(bytestring)||
      stream_digest(32)||terminal_digest(32). T0/T1 and their payload lengths
      follow digest_preimage_catalog.stream_terminal exactly.
    transition: >-
      tag 17 payload is p_code(u8)||source_index(u64)||destination_index(u64)||
      degree(signed560)||factor_count(u16)||sorted factors||witness_frame(bytestring)||
      algorithm_digest(32)||transition_digest(32). witness_frame is a complete
      DOMAIN-v7 code 40 frame and transition_digest is final.
    matrix: >-
      tag 19 payload is rows(u32)||columns(u32)||entry_count(u64)||
      row_major(entry_count*signed560)||matrix_digest(32), entry_count=rows*columns.
      The matrix must be recomputed from the typed edge algorithm; asserted
      matrix bytes alone are invalid.
    op_log: >-
      tag 20 payload is matrix_digest(32)||operation_count(u64)||
      OP-v7 records(operation_count*196)||op_log_digest(32). OP-v7 is
      opcode(u8)||row(u64)||pivot_row(u64)||pivot_column(u64)||scalar(signed560)||
      factor_index(u32)||previous_matrix_digest(32)||next_matrix_digest(32)||
      op_digest(32), exactly 196 bytes.
    saturation: >-
      tag 21 payload is matrix_digest(32)||factor_count(u16)||
      SATURATION-ROW-v7 records(factor_count*110)||saturation_digest(32). Each
      row is factor_index(u32)||factor(signed560)||pre_digest(32)||post_digest(32)||
      bit(u8)||row_digest(32); row_digest hashes the raw row without itself.
    output: >-
      tag 22 payload is branch_code(u8)||scalar_class(u8)||witness_count(u16)||
      witnesses(witness_count*signed560)||matrix_digest(32)||op_log_digest(32)||
      saturation_digest(32)||output_digest(32). A non-null class requires the
      typed equations in EDGE-ALGORITHM-v7; a digest-only assertion is invalid.
    event_trace: >-
      tag 23 payload is phase(u8)||event_count(u64)||events(event_count*196)||
      buffer_count(u32)||buffers(buffer_count*34)||trace_digest(32). EVENT-v7 is
      phase(u8)||event_code(u16)||primitive_code(u8)||object_code(u8)||
      operation_count(u64)||input_bytes(u64)||output_bytes(u64)||hash_input_bytes(u64)||
      signature_bytes(u64)||provider_bytes(u64)||serialization_bytes(u64)||
      event_foe(signed560)||operand_digest(32)||event_digest(32). Memory is
      represented only by BUFFER-v7 rows, so no memory counter is duplicated in
      EVENT-v7.
      BUFFER-v7 is buffer_id(u64)||buffer_class(u8)||allocation_step(u64)||
      release_step(u64)||bytes(u64); release at k excludes k and allocation at k
      includes k. Every source, mirror, advice, matrix, replay, and staging
      lifetime has one row.
    replay: >-
      tag 24 payload is p_code(u8)||advice_digest(32)||target_digest(32)||
      attempt_index(u64)||target_index(u64)||query_key(32)||branch_code(u8)||
      treatment_owner(u64)||null_owner(u64)||draw_count(u64)||
      null_mutation_digest(32)||pair_request_digest(32). tag 25 ARM-TRACE-v7
      payload is pair_request_digest(32)||arm_code(u8)||arm_input_digest(32)||
      event_trace_digest(32)||normalized_digest(32)||output_digest(32)||arm_digest(32).
      tag 26 shared payload is shared_prefix_digest(32)||pair_request_digest(32)||
      event_count(u64)||normalized_digest(32)||shared_digest(32). tag 27 final
      payload is target_digest(32)||advice_digest(32)||attempt_index(u64)||
      shared_digest(32)||treatment_arm_digest(32)||null_arm_digest(32)||
      identity_bit(u8)||identity_digest(32). All rejected draws are serialized.
    controls_and_inputs: >-
      Tags 28 and 29 are the exact C-pair and synthetic reference frames in the
      declared control manifests. Tag 30 SOURCE-BLOB-v7, tag 31
      SOURCE-ALGORITHM-v7, tag 32 EDGE-ALGORITHM-v7, and tag 33
      INCUMBENT-BASELINE-v2 are typed top-level inputs with final digests. Their
      null final digests are design-only admission blockers.
    source_blob: >-
      tag 30 payload is provider_or_repo(bytestring)||tree_commit(bytestring)||
      canonical_path(bytestring)||source_length(u64)||source_bytes(bytestring)||
      source_blob_digest(32), with source_length equal to the exact bytestring
      body length and source_blob_digest final.
    source_algorithm: >-
      tag 31 payload is algorithm_version(bytestring)||tree_commit(bytestring)||
      canonical_path(bytestring)||algorithm_bytes(bytestring)||
      target_free_transcript(bytestring)||source_algorithm_digest(32), with the
      final digest covering the complete tag-31 frame without itself.
    edge_algorithm: >-
      tag 32 payload is field_model(bytestring)||opcode_count(u16)||opcode_table||
      witness_equation_count(u16)||witness_equations(bytestring)||
      transcript_schema(bytestring)||implementation_digest(32)||algorithm_digest(32).
      Each opcode row and witness bytecode has the exact fields in
      EDGE-ALGORITHM-v7; algorithm_digest is final and implementation_digest is
      not a substitute for an independent replay receipt.
    incumbent: >-
      tag 33 payload is source_commit(bytestring)||advice_scope_code(u8)||
      preprocessing_scope_digest(32)||setup_foe(signed560)||query_foe(signed560)||
      setup_bytes(u64)||query_bytes(u64)||memory_bytes(u64)||q_convention(bytestring)||
      baseline_digest(32)||incumbent_digest(32), with incumbent_digest final and
      null baseline fields admission-blocking.
    provider_and_certificate: >-
      tag 15 payload is provider_id(bytestring)||key_algorithm(u8)||public_key(32)||
      key_digest(32)||anchor_source_digest(32)||trust_digest(32). Tag 16 payload
      is provider_id(bytestring)||public_key(32)||sign_digest(32)||signature(64)||
      artifact_digest(32)||mirror_digest(32)||mirror_path(bytestring)||
      receipt_digest(32). Tag 18 payload is p_code(u8)||target_digest(32)||
      target_index(u64)||advice_digest(32)||horizon(u64)||edge_count(u64)||
      path_bytes(u64)||artifact_digest(32)||mirror_digest(32)||mirror_path(bytestring)||
      transition_root(32)||sign_digest(32). Tag 14 payload is the same certificate
      identity plus provider_receipt(bytestring)||transition_frames(bytestring)||
      certificate_digest(32); edge_count/path_bytes and transition roots are
      recomputed from complete tag-17 frames. All listed final digests are final
      fields and every signature uses the exact sign preimage above.

  advice_quantifier:
    formula: >-
      For each selected p, A_p is exactly the complete manifest, source blob,
      source algorithm, source_domain frame, target-free owner set, order,
      helper, and their complete digest-bound inputs. forall p exists fixed A_p
      forall E in V_p. Target manifest, target index, attempt request, provider,
      replay, and query frames are phase-1 or per-target material and never A_p.
    owner_selection: >-
      rank_i is the little-endian integer SHA256(DOMAIN-v7 code 10 body_schema=1
      over p_code||manifest_digest||advice_seed||vertex index). Sort by (rank_i,i)
      and take owner_count. owner_set_digest is SHA256(DOMAIN-v7 code 11 over
      p_code||manifest_digest||advice_seed||owner_count||ordered owner indices).
    source_binding: >-
      The source blob and source algorithm are complete tag-30/tag-31 frames,
      not bare digest identifiers. Their canonical path, tree commit, algorithm
      version, exact bytes, source transcript, and target-free predicate are
      included in A_p and charged. A missing source object is INVALID_ADVICE.

  finite_totalization:
    owner_schedule: >-
      For attempt i, schedule_owner(i) is owner_indices[r_i mod owner_count],
      where r_i is the little-endian integer of SHA256(DOMAIN-v7 code 20 over
      request_digest||attempt_index||attempt_seed). The schedule is serialized
      and owner_schedule_digest binds it; no producer may choose an alternate
      mapping.
    terminal_precedence: >-
      At every prefix exactly one first terminal is selected by this precedence:
      INVALID_RECORD, OVERFLOW, REPLAY_IDENTITY_FAILURE, CANDIDATE_CAP,
      OWNER_EXHAUSTED, COMPLETE; ZERO_REQUEST is selected only when requested
      count is zero. A higher-priority predicate at position k prevents later
      predicates from replacing it. terminal_position is the first stride index
      satisfying the selected predicate.
    equations: >-
      requested_count=seed_list.attempt_count; emitted_count is the exact number
      of complete fixed strides through terminal_position; retained_count counts
      non-null owner records; candidate_count counts records satisfying the
      typed candidate predicate; CANDIDATE_CAP requires candidate_count>=cap;
      OWNER_EXHAUSTED requires all scheduled owners through the finite list;
      COMPLETE requires all requested strides and no higher-priority failure.
      Every count and the seed-list digest is recomputed before terminal digest.
    bounds: >-
      request.attempt_count<=attempts_max, candidate_cap<=candidate_cap_max,
      draw_count<=max_pair_draws, event_count<=max_events, and every stream,
      reason, record, and terminal length is checked before allocation.

  semantic_rules:
    edge_algorithm: >-
      EDGE-ALGORITHM-v7 is a typed finite program, not a name. It defines exact
      field addition, multiplication, inversion, curve evaluation, kernel
      construction, isogeny pushforward, witness equations, operand widths,
      operation order, and transcript fields. Every transition is rejected
      unless the independently implemented algorithm and semantic edge replay
      recompute source, destination, degree, factors, matrix, HNF, saturation,
      and witness equations from the serialized inputs.
    hnf: >-
      For column j ascending, choose the lowest-index nonzero pivot row; ties
      use smallest absolute entry then row index. Swap the pivot into place and
      negate the row if pivot is negative. For each other row with entry a and
      positive pivot p, use q=floor(a/p) and r=a-q*p with 0<=r<p; emit one OP-v7
      per operation. Reduce rows in ascending row index, then normalize the
      pivot column, and continue until all columns are processed. No truncating
      quotient is used. Overflow outside signed560 is INVALID_OVERFLOW. Empty
      factors require unchanged matrix and empty op/saturation logs.
    saturation: >-
      A factor is saturated iff pivot columns strictly increase, pivots are
      positive gcd-normalized, every remainder is in the stated interval,
      trailing rows are zero, every changed row has a typed edge witness, and
      the serialized pre/post digest chain is exact. The output scalar predicate
      is evaluated only after this condition.
    replay: >-
      The shared prefix is the canonical byte sequence through the complete
      pair-request frame. Treatment and null arm bytes begin after that prefix
      and never enter shared_digest. null_owner is the next owner in the
      serialized owner order after treatment_owner, wrapping once; equality is
      rejected if owner_count<2. null_mutation_digest hashes the complete domain
      frame describing this rule and all rejected draws. identity_bit=1 iff the
      normalized treatment and null outputs, typed validity bits, and canonical
      witness bytes are byte-equal; otherwise it is 0. All comparisons and
      normalizations are serialized events.

  cost_and_memory:
    event_schedule: >-
      Each primitive is one EVENT-v7 in source order. Codes are setup 1=manifest,
      2=source-read, 3=owner-rank, 4=order, 5=helper, phase-1 100=target-index,
      101=index-read, 102=helper-read, 103=edge-check, 104=provider-verify,
      105=mirror-read, 106=hnf, 107=saturation, 108=output, 109=replay,
      110=terminal, 111=serialize. A single event has one primitive code.
    charge_table: >-
      primitive 1 field foe=operation_count; 2 read and 3 write foe=ceil(bytes/64);
      4 compare foe=ceil(input_bytes/64); 5 SHA256 foe=ceil((hash_input_bytes+9)/64);
      6 Ed25519 verify foe=1 and input_bytes=96; 7 matrix row foe=1; 8 edge
      relation foe=1; 9 serialization foe=serialization_bytes; 10 buffer
      allocation/release foe=0. event_foe is recomputed, total_foe=sum event_foe,
      total_bytes=sum input_bytes+output_bytes+provider_bytes+serialization_bytes
      over all events. Provider, mirror, signatures, paths, and digest bytes are
      never free.
    memory: >-
      Every input frame, source blob, mirror blob, advice object, helper/index,
      owner/endpoint/null record, matrix, factor sort, HNF log, signature context,
      digest context, replay arm, and serialization buffer has one BUFFER-v7 row.
      buffer_class 1=advice and 2=work; M_advice=max live bytes with class 1 and
      M_work=max live bytes with class 2 over allocation_step<=k<release_step.
      Missing rows, overlapping invalid intervals, or uncharged external bytes
      are INVALID_MEMORY. Total memory is the exact sum of live bytes at each k.

  provider_and_baseline:
    provider: >-
      PROVIDER-TRUST-v7 names provider_id, Ed25519 public key, anchor source,
      and trust_digest. Provider receipt is transport evidence only. Certificate
      validity requires trusted key, exact sign_digest signature, exact artifact
      and mirror bytes, path policy, transition root, and independent edge replay.
      Null trust or implementation inputs mean INVALID_CERTIFICATE.
    incumbent: >-
      INCUMBENT-BASELINE-v2 is a typed top-level frame containing source digest,
      advice_scope_code, preprocessing_bytes, setup_foe, per-query foe/bytes/
      memory, common Q convention, and baseline source commit. The successor is
      comparable only when advice_scope_code and preprocessing scope match. The
      break-even equation is q*=(successor_setup-incumbent_setup)/
      (incumbent_query-successor_query), requiring positive denominator and
      independently verified finite values. Null incumbent fields block all
      comparison and break_even_q claims.

  controls:
    c_pair: >-
      C-PAIR-REF-v7 has 32 deterministic DOMAIN-v7 code-60 seeds, a fixed
      endpoint universe, the exact owner schedule, 384-byte C-PAIR-ROW-v7 rows,
      and table digest. row_digest hashes the row without itself and table_digest
      hashes the ordered complete rows. Missing rows or independent replay is
      INVALID_CONTROL, not a negative result.
    synthetic: >-
      SYNTHETIC-REF-v7 has eight cells and sixteen typed SYN-TARGET-v7 rows per
      cell. Each initial rational, recurrence, censor rule, target digest, cell
      digest, and table digest is exact and serialized. Missing cells or replay
      is INVALID_CONTROL.

  hard_gates:
    - registry_digest and every schema_digest are materialized and independently checked
    - all local digest fields are listed with one exact preimage
    - source blob, source algorithm, source transcript, and target-free A_p are materialized
    - EDGE-ALGORITHM-v7 implementation and independent semantic replay exist
    - provider trust, signature, artifact, mirror, and path inputs are typed and verified
    - finite seed list, owner schedule, terminal predicates, and replay draws pass mutation tests
    - event, memory, HNF, output, and replay recomputation audits pass
    - C-pair and synthetic rows/cells and independent receipts exist
    - matched incumbent baseline and break_even_q inputs are independently verified
    - frozen remains false and execution_authorized remains false until every gate closes

  proof_search_map:
    exact_baseline_reproduction: >-
      Reproduce the typed incumbent and common advice/preprocessing scope before
      any comparison; null v12 fields make this audit pending.
    observation_collision_search: >-
      Mutate every local digest placement, shortened payload length, source path,
      attempt schedule, terminal code, HNF quotient, buffer class, replay arm,
      control state, and baseline scope; every mutation must reject.
    quantifier_order: >-
      Verify A_p contains source and helper bytes but no target, query, attempt,
      selection, provider, or replay material; verify target indexing is phase 1.
    method_ceiling_nearby_control: >-
      Use matched paired replay, C-pair, synthetic, and incumbent controls. A
      passing control establishes serialization/accounting consistency only; it
      establishes no SSI attack or asymptotic advantage.

  stopping_and_artifacts:
    stopping_rules:
      - stop on unknown frame, local digest mismatch, width/padding mismatch, overflow, pointer mismatch, semantic-edge failure, invalid control, invalid incumbent, replay identity mismatch, or scope mismatch
      - stop after attempts_max attempts or graph_steps_max steps per attempt
      - preserve every complete censored trace and every buffer interval
      - provider or mirror unavailability is failed_infrastructure, never research evidence
    required_artifacts:
      - exact command, commit, clean state, environment, policy, model provenance, and seeds
      - registry bytes, schema digests, source frames, every top-level frame, and every local preimage
      - finite seed list, owner schedule, builder stream, event trace, buffer table, and replay arm frames
      - provider trust, edge algorithm, certificate, HNF/output, controls, incumbent, and independent review receipts
    completion_gate:
      - every top-level and local schema is present in the registry/catalog
      - every digest dependency is acyclic and byte-recomputable
      - A_p is source-bound, target-free, and phase-1 material is charged
      - finite terminal totalization and replay identity are mutation-tested
      - event and memory totals are recomputable from trace bytes
      - provider, semantic edge, control, and matched incumbent gates are closed
      - execution_authorized remains false and frozen remains false until Coordinator approval
