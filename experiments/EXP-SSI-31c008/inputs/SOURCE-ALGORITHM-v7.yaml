source_algorithm:
  id: SOURCE-ALGORITHM-v7
  format: SOURCE-ALGORITHM-v7
  status: design_manifest_no_measurement
  algorithm_version: null
  tree_commit: null
  canonical_path: null
  algorithm_bytes_digest: null
  target_free_transcript_digest: null
  source_domain_digest: null
  typed_body: >-
    Tag-31 payload is algorithm_version(bytestring)||tree_commit(bytestring)||
    canonical_path(bytestring)||algorithm_bytes(bytestring)||
    target_free_transcript(bytestring)||source_algorithm_digest(32). The final
    digest is over the complete tag-31 frame without source_algorithm_digest.
    The transcript enumerates the finite vertex/edge generator, its input
    widths, order, rejection predicates, and target-free proof; a digest name
    without these bytes is invalid.
  admission:
    materialized: false
    missing_algorithm_bytes_is: INVALID_ADVICE
    freeze_allowed: false
