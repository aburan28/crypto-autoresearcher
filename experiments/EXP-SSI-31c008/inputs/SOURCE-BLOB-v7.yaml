source_blob:
  id: SOURCE-BLOB-v7
  format: SOURCE-BLOB-v7
  status: design_manifest_no_measurement
  provider_or_repo: null
  tree_commit: null
  canonical_path: null
  source_length: null
  source_bytes_digest: null
  source_domain_digest: null
  typed_body: >-
    Tag-30 payload is provider_or_repo(bytestring)||tree_commit(bytestring)||
    canonical_path(bytestring)||source_length(u64)||source_bytes(bytestring)||
    source_blob_digest(32). source_length must equal source_bytes length and be
    <=source_blob_max. The final digest is over the complete tag-30 frame without
    source_blob_digest. Source bytes are A_p input and are charged reads.
  admission:
    materialized: false
    missing_source_bytes_is: INVALID_ADVICE
    freeze_allowed: false
