experiment:
  id: EXP-ECDLP-7c9150
  hypothesis_id: H-ECDLP-3b589b
  version: 1
  title: >-
    Verification protocol - scope-conformance census of every record citing the
    three generic-group simulability findings as a closure, under a
    classification rule frozen and hashed before the search, with two
    known-conformant positive controls, one synthetic non-conformant negative
    control, a four-rung graded ladder at increasing distance from the model
    boundary, and an independent second classification of a declared sample
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260808-ea3b4f into a verification protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. This contract changes no record's status and grants no
    permission to propose against any finding.
  objective: >-
    Count how many records cite the three generic-group simulability findings as
    a CLOSURE, classify each citation as conformant or non-conformant against the
    resource taxonomy, report the direction of every non-conformance, and count
    how many non-oracle-resource ideas were declined with one of the three cited
    as the reason. What artifact is checked (each citing record), against what
    reference (the frozen classification rule plus the quoted resource taxonomy
    plus the three findings' own scope statements), and what result fails it (a
    citation against a non-oracle-resource method with no covering argument) are
    all fixed before the search runs.
  inputs:
    search_scope: >-
      The ledger tree and the idea tree, searched for the three finding
      identifiers. The number of citing records is REPORTED AS A MEASURED FLOOR
      with the search pattern and the searched paths stated, never as an exact
      corpus count.
    references_to_be_opened_before_classification: >-
      (1) The bodies of all three findings, including their own scope statements
      and evidence tiers - the design session read only their title lines and the
      run must open the bodies. (2) The corpus resource taxonomy, quoted verbatim
      into results/taxonomy.md. (3) The status of the open problem asking whether
      index calculus beats the generic baseline for prime-field ECDLP, read at
      run time and quoted.
    classification_rule_frozen_before_search: >-
      Written and HASHED into results/rule.md before the search runs. A hit is
      IN SCOPE only if the citing record uses the finding as a REASON for
      declining, closing, or downgrading something; a citation as RELATED WORK or
      CONTEXT is OUT OF SCOPE and is counted separately - counting context
      citations as non-conformant would manufacture a defect. An in-scope
      citation is CONFORMANT if the cited-against method is oracle-shaped, OR if
      the record states an additional argument covering the non-oracle resource;
      NON-CONFORMANT otherwise. A method that is oracle-shaped in disguise - a
      factor-base membership test IS an oracle - is CONFORMANT, and the rule must
      say so explicitly, because mislabelling those would overstate the defect.
    direction_rule: >-
      Every non-conformant citation is additionally labelled STRONGER (the
      citation claims more than the source supports) or WEAKER (less), with the
      sentence relied on quoted.
  controls:
    - id: CTRL-KNOWN-CONFORMANT
      description: >-
        POSITIVE CONTROLS THE CLASSIFIER MUST NOT FLAG. Two records that submit
        NEW oracle classes to a simulability audit, i.e. examples of correct use.
        The classifier must mark both CONFORMANT.
      failure_meaning: >-
        If it marks either non-conformant it is too strict and its counts are
        meaningless.
    - id: CTRL-SYNTHETIC-NONCONFORMANT
      description: >-
        NEGATIVE CONTROL THE CLASSIFIER MUST FLAG. One synthetic citation
        constructed by the driver: a field-data index-calculus idea declined with
        one of the three findings as the SOLE stated reason and no covering
        argument. The classifier must flag it NON-CONFORMANT and STRONGER.
      failure_meaning: >-
        If it is not flagged the classifier is too lenient and its clean results
        mean nothing. Together with CTRL-KNOWN-CONFORMANT this bounds the
        classifier in both directions, as the inventor protocol requires of any
        instrument.
    - id: CTRL-GRADED-BOUNDARY-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE, FOUR SYNTHETIC CITATIONS AT KNOWN DISTANCES
        FROM THE MODEL BOUNDARY, each with its required outcome fixed before the
        run: (R1) a purely oracle-shaped method declined with a finding cited -
        CONFORMANT; (R2) an oracle-shaped method that additionally consumes a
        field-level side input, with the side input acknowledged and covered -
        CONFORMANT; (R3) a field-data method declined with a finding cited AND a
        stated covering argument for the field-data resource - CONFORMANT; (R4)
        the same field-data method declined with the finding cited and NO
        covering argument - NON-CONFORMANT. The classifier must return exactly
        conformant, conformant, conformant, non-conformant.
      failure_meaning: >-
        A ladder that does not separate R3 from R4 means the classifier is not
        detecting the presence or absence of a covering argument, which is the
        entire discriminating feature. Every label is then VOID. This is what
        demonstrates the classifier resolves a defect of known size and known
        location rather than merely returning a label.
    - id: CTRL-SECOND-CLASSIFIER
      description: >-
        An independent session classifies a declared 20 percent sample of the
        in-scope hits against the same hashed rule, without reading the first
        classification. Disagreements are REPORTED, never silently reconciled.
      failure_meaning: >-
        A disagreement rate is a finding about the rule's determinacy and is
        first-class output.
    - id: CTRL-NONORIGINATING-CLASSIFIER
      description: >-
        The classifying sessions must not have authored any record in the
        classified set, and each declares what it wrote. Records authored by a
        classifier are excluded and the exclusion is counted.
      failure_meaning: >-
        The obvious conflict of interest; stated as a requirement, not a caveat.
    - id: CTRL-CURRENT-STATUS-READ
      description: >-
        The owning goal's status and the open problem's status are read at run
        time and quoted verbatim with the read date. The design session found the
        goal reads `status: completed` on 2026-09-04, contradicting the source
        proposal's pause flag.
      failure_meaning: >-
        Inheriting a stale flag would attach this work to a record state that no
        longer exists.
  independent_variables:
    - 'finding cited, in {the three simulability findings}'
    - 'citation use, in {reason for declining/closing/downgrading, related work or context}'
    - 'cited-against method resource class, from the quoted taxonomy'
    - 'classifier session identity'
  metrics:
    primary:
      - >-
        one row per citing record: the finding cited, the citation use, the
        cited-against method's resource class, the conformance label, and for
        every non-conformance the direction plus the specific statement the
        record would need to add.
      - >-
        conformance rate over in-scope citations, dimensionless, with the
        denominator stated and the citing-record count reported as a measured
        floor.
      - >-
        counts of non-conformances by direction, STRONGER and WEAKER, integers.
      - >-
        number of non-oracle-resource ideas declined or downgraded with one of
        the three cited as the reason, an integer, each listed by id.
      - >-
        control outcomes: two known-conformant, one synthetic non-conformant, and
        the four graded-ladder rungs, seven booleans against seven required
        outcomes.
    secondary:
      - 'count of OUT OF SCOPE context citations, reported separately so they cannot inflate the defect count.'
      - 'inter-classifier disagreement count and rate on the 20 percent sample, with each disagreement listed.'
      - 'the three findings scope statements, quoted verbatim from their bodies.'
      - 'the open problem status quoted verbatim with its read date.'
      - 'the rule hash and the timestamp at which it was written, both preceding the search.'
  heuristic_under_test: HEUR-CENSUS-1
  preregistered_prediction:
    quantity: 'The conformance rate over in-scope citations and the direction split.'
    formula: >-
      No formula. Pre-registered: conformance rate high but strictly below 1,
      with at least one non-conformant citation; essentially all non-conformances
      in the STRONGER direction; a small but possibly zero count of suppressed
      non-oracle-resource ideas. A rate of exactly 1 is a clean null and
      falsifies the concern.
    source: >-
      IDEA-20260808-ea3b4f's predictions block, with the corpus-count figure
      replaced by a measured floor.
  scale_relevance:
    tier: null
    justification: >-
      NO MEASUREMENT AT ANY SCALE. This is a citation census producing facts about
      records. `tier` is null rather than `toy` because a scale label would
      falsely imply a measurement about a curve.
    correspondence: null
  tail_checks:
    - >-
      Every non-conformant citation is listed individually with the sentence
      relied on quoted, rather than only as a count; a single mislabelled hit
      would otherwise be invisible inside a rate.
    - >-
      Every citation the two classifiers disagree on is listed individually with
      both labels and both stated reasons.
    - >-
      The in-scope citation closest to the CONFORMANT/NON-CONFORMANT boundary -
      an oracle-shaped-in-disguise method, or a covering argument that is present
      but thin - is reported individually, since that is where the rule is most
      likely to be wrong in either direction.
  replication:
    seeds:
      - 'RUN-ECDLP-7c9150-1 (open the three finding bodies and the taxonomy; write and hash the rule; build and classify the controls and the graded ladder): master seed 20260904121'
      - 'RUN-ECDLP-7c9150-2 (search and classify every in-scope citation; suppressed-idea census; status reads): master seed 20260904122'
      - 'RUN-ECDLP-7c9150-3 (independent second classification of the declared 20 percent sample): master seed 20260904123'
    independent_instances: 7
    replication_note: >-
      SEEDS POLICY. The only randomness is (a) the CLASSIFICATION ORDER, so a
      classifier cannot infer control membership from position, and (b) the
      selection of the 20 percent sample for RUN-3, drawn from RUN-3's master
      seed AFTER the in-scope set is fixed, so the sample cannot be chosen to
      flatter the first classification. Both derivations are recorded in the
      manifests. `independent_instances: 7` is the control-plus-ladder count that
      must each return its required outcome. The rule hash appears in all three
      manifests. No seed or rule may change after RUN-1; a changed rule is a NEW
      contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 3
    budget_feasibility_note: >-
      Zero compute; the cost is a pattern search plus hand classification, which
      the source proposal estimates at under two hours. Wall clock and memory are
      at the template floors and are not the binding constraint; the binding
      constraint is the number of hits, which the run reports and which bounds
      RUN-2.
  stopping_rules:
    - >-
      ST-0 RULE GATE. No hit may be classified until results/rule.md exists with
      its hash recorded, results/taxonomy.md quotes the resource taxonomy, and
      the three findings' scope statements have been read and quoted.
    - >-
      ST-1 PER-RUN CAP. 600 seconds per run; on approaching the cap the run STOPS
      and names every hit not classified, which is then stated in the denominator.
    - >-
      ST-2 STOP AND REPORT ON AMBIGUITY. A citation whose use cannot be resolved
      as REASON or CONTEXT from its text is labelled AMBIGUOUS with the text
      quoted; it is never resolved by inference and never counted as
      non-conformant.
    - >-
      ST-3 NO INTERPRETATION AND NO REGENERATION. The run package emits the
      citation table and the counts only. It must NOT regenerate any suppressed
      idea, must not propose against any finding, must not write an evidence or
      decision record, and must not touch any status.
    - >-
      ST-4 NO PERMISSION INFERRED. A non-conformant label is a statement about a
      citation, never a licence to propose the flagged idea. The run package must
      say so on every flagged row.
  invalidation_rules:
    - >-
      INV-TOO-STRICT. Either CTRL-KNOWN-CONFORMANT record is marked
      non-conformant: the classifier is too strict; every count VOID.
    - >-
      INV-TOO-LENIENT. CTRL-SYNTHETIC-NONCONFORMANT is not flagged: the
      classifier is too lenient; every count VOID.
    - >-
      INV-LADDER. CTRL-GRADED-BOUNDARY-LADDER does not return exactly its four
      required outcomes, in particular if it fails to separate R3 from R4: every
      label is VOID.
    - >-
      INV-CONTEXT-CONFLATION. Any context citation counted as non-conformant: the
      run is INVALID, because that would manufacture the defect it is measuring.
    - >-
      INV-RULE-DRIFT. The rule hash differs between runs: the runs did not use the
      same instrument and are not comparable.
    - >-
      INV-CONFLICT. A classifier classified a record it authored and that record
      was not excluded: INVALID for that record.
    - >-
      INV-INFRASTRUCTURE. An unreadable file is recorded with its terminal status
      and IS INFRASTRUCTURE SIGNAL, never a non-conformance.
  success_criterion: >-
    S1. The rule and the taxonomy are frozen and quoted before the search; both
    known-conformant controls are marked conformant; the synthetic
    non-conformant control is flagged STRONGER; the four-rung ladder returns its
    required outcomes including the R3-versus-R4 separation; and the citation
    table, the conformance rate with its stated denominator, the direction split,
    and the suppressed-idea count are emitted with a quoted sentence on every
    non-conformant row. S1 MET means the census's readings are admissible as
    facts about citations. IT SHOWS NO CLOSURE TO BE WRONG AND SAYS NOTHING ABOUT
    ANY ELLIPTIC CURVE.
  falsification_criterion: >-
    F1. Zero non-conformant in-scope citations across the examined corpus. The
    concern is unfounded, the check is RETIRED, and the finding - that the corpus
    respects its own model boundaries - is a clean and useful null that
    falsifies H-ECDLP-3b589b's central prediction. F2. A demonstration that the
    three findings DO cover field-level data, for example a simulator reproducing
    x-coordinate field data. The closures are then broader than this record says,
    which would mean prime-field index calculus is closed - contradicting the
    corpus's own open problem and requiring IMMEDIATE INDEPENDENT REVIEW rather
    than a quiet table row. F3, VOIDING RATHER THAN FALSIFYING: any invalidation
    rule fires. F4, DECLARED IN ADVANCE AND BINDING UNDER EVERY OUTCOME: no
    output of this experiment may be quoted as a statement about elliptic curves
    or the ECDLP, and no flagged row creates permission to propose the flagged
    idea.
  required_artifacts:
    - experiments/EXP-ECDLP-7c9150/results/rule.md
    - experiments/EXP-ECDLP-7c9150/results/rule_hash.txt
    - experiments/EXP-ECDLP-7c9150/results/taxonomy.md
    - experiments/EXP-ECDLP-7c9150/results/finding_scope_statements.md
    - experiments/EXP-ECDLP-7c9150/results/synthetic_citations/
    - experiments/EXP-ECDLP-7c9150/results/citation_table.json
    - experiments/EXP-ECDLP-7c9150/results/suppressed_ideas.json
    - experiments/EXP-ECDLP-7c9150/results/status_verbatim.md
    - experiments/EXP-ECDLP-7c9150/results/summary.json
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-1/manifest.yaml
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-1/results.json
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-1/stdout.log
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-2/manifest.yaml
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-2/results.json
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-2/stdout.log
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-3/manifest.yaml
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-3/results.json
    - experiments/EXP-ECDLP-7c9150/runs/RUN-ECDLP-7c9150-3/stdout.log
  required_artifacts_note: >-
    results/rule.md and rule_hash.txt must exist and be recorded in RUN-1's
    manifest before any hit is classified; the same hash appears in RUN-2 and
    RUN-3. results/finding_scope_statements.md carries the scope statement of
    each of the three findings quoted from its body, which the design session did
    NOT read and which the run must open. synthetic_citations/ holds the negative
    control and the four ladder rungs with a sidecar declaring each required
    outcome, written before classification.
  run_plan:
    - id: RUN-ECDLP-7c9150-1
      description: 'open the three finding bodies and the resource taxonomy; write and hash the classification rule; classify CTRL-KNOWN-CONFORMANT, CTRL-SYNTHETIC-NONCONFORMANT and CTRL-GRADED-BOUNDARY-LADDER'
    - id: RUN-ECDLP-7c9150-2
      description: 'search the ledger and idea trees; classify every in-scope citation; suppressed-idea census; goal and open-problem status reads'
    - id: RUN-ECDLP-7c9150-3
      description: 'independent second classification of a seed-selected 20 percent sample by a non-originating session; disagreements reported'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract read the TITLE LINES of
      knowledge/findings/KN-FIND-002.md, KN-FIND-b7e091.md and KN-FIND-982fdf.md
      by pattern search on 2026-09-04 and CONFIRMS the source proposal quotes all
      three faithfully. It read ledger/goals/GOAL-FIND-001.yaml and found
      `status: completed`, CONTRADICTING the proposal's pause flag. It did NOT
      open the bodies of the three findings, the resource taxonomy, the open
      problem entries, or the two records named as conformant controls; all of
      those are scheduled for opening in RUN-1 and RUN-2, not asserted here.
  source_refs:
    - ledger/hypotheses/H-ECDLP-3b589b.yaml
    - ledger/proposals/IDEA-20260808-ea3b4f.yaml
    - knowledge/findings/KN-FIND-002.md
    - knowledge/findings/KN-FIND-b7e091.md
    - knowledge/findings/KN-FIND-982fdf.md
    - ledger/goals/GOAL-FIND-001.yaml
    - ledger/questions/RQ-FIND-001.yaml
    - docs/inventor-protocol.md
  assigned_to: executor
  approved_by: null
