  controls:
  - Same public input, factor-base point digest, RNG stream, target digest, relation
    digest, attempts/rank/LA counts and verified k across all three paired arms.
  - A/A duplicate reference_a vs reference_b differs only in execution slot, setting
    timing noise.
  - Checker-owned affine arithmetic regenerates seeded targets and verifies every
    recovered logarithm.
  - Driver/checker known-false controls exercise a wrong logarithm and duplicated-reference
    strict-speedup rejection.
  - Full reviewer must actually exercise tampered target/config digests and a missing
    worker row against a scratch copy, retaining the checker refusals; these are planned
    review controls, not claimed existing unit-test coverage.
  - Supervisor separately rejects changed bound source/config bytes before launch;
    this is admission coverage and not a driver timing measurement.
  - For every exact bits/curve/solver-seed/arm, the three repetitions must occupy
    slots0,1,2 exactly once; solver seed1 reverses the orientation, yielding all6
    permutations within each curve.
  - Worker environment equals committed environment lock and CPU affinity is [0] (the
    minimum locked allowed CPU). Preserve load before/after and pre/post process census;
    census is diagnostic, not proof of host-wide isolation.
  - 'Negative balance control: the old always-middle candidate schedule must fail
    the successor checker. Existing source tests cover this refusal; fresh reviewer
    independently exercises it on a scratch copy.'
  independent_variables:
  - name: target_generator
    levels:
    - reference
    - fixed_window_w4
  metrics:
    primary:
    - name: complete_solve_seconds
      unit: seconds
      kind: measured
      boundary: External perf_counter_ns around entire solve_index_calculus call;
        includes final solver verification.
    secondary:
    - CPU seconds at the identical boundary (measured, not added to wall time).
    - Full curve group operations and target/setup group operations (distinct measured
      counts).
    - Attempts, successful relations, rank, LA multiply-adds, S3 solves and table
      entries (distinct measured counts).
    - Per-worker peak_rss_bytes and target-table payload bytes (distinct measured/storage
      quantities; payload is not Python RSS).
    - Driver harness_seconds includes fixture generation, process startup and trace
      hashing, and ends before the independent checker; supervisor/checker timings
      and logs record checks separately. Do not merge overlapping boundaries.
    - Failures/timeouts/invalid records, with reason and stderr.
    - 'Matched rho and Bernstein-Lange gaps: unmeasured, no estimate in this optimization
      contract.'
  preregistered_predictions:
  - id: P-balanced-new-curves
    quantity: Complete-solve paired geometric speedup on held-out curve seeds3/4/5
      with balanced execution slots
    direction: C-target success gate, unchanged from original prospective numerical
      gate
    basis: Original arithmetic mechanism and preliminary confounded timing observation;
      new curves have not been timed.
  scale_relevance:
    tier: toy
    justification: Only 12-, 14- and 16-bit prime-field curves, m=2, small_x, mitm,
      no vector acceleration, harvest off.
    correspondence: null
  replication:
    seeds:
      curve:
      - 3
      - 4
      - 5
      solver:
      - 0
      - 1
      target:
      - 0
    independent_instances: 9
    paired_cells: 18
    repetitions: 3
    arm_executions: 162
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_workers: 1
    maximum_runs: 1
  stopping_rules:
  - Execute all54 cell-repetitions and all3 arms (162 workers), regardless of observed
    timings or censored outcomes; no parameter tuning or successful-only reruns.
  - Each worker stops on verified recovery, package default attempt limit 50*N or
    60-second process watchdog; preserve that reason.
  - Supervisor watchdog1200 seconds protects a stuck parent/child process group. An
    interrupted incomplete grid is retained and cannot qualify; a successor run requires
    an additive contract and new run ID.
  invalidation_rules:
  - Any missing/duplicate grid row, mismatched config/source/instance/FB/target/relation
    digest, deterministic paired count, recovered k or independent certificate invalidates
    the comparison.
  - Any failure, timeout or incomplete grid precludes a qualified speedup; retain
    all artifacts as observations.
  - A second scientific producer running during wall-time collection or an uncontrolled
    primary-metric factor makes wall-time inference inconclusive; operation counts
    remain separately observable.
  - Any treatment missing an execution slot within an exact curve/solver-seed/arm
    group, changed orientation, environment/affinity mismatch or missing load invalidates
    the matched comparison.
  analysis:
    paired_ratio: For each of54 cell-repetitions, r=((reference_a.seconds+reference_b.seconds)/2)/fixed_window.seconds.
    point_estimate: exp(mean(log(r))) across all54 pairs; only if all162 are complete
      and valid.
    aa_factor: max(exp(mean(log(reference_a/reference_b))), its reciprocal) across
      the same54 pairs.
    interval: 5000 deterministic percentile bootstrap resamples, seed3065; stratify
      by bits and sample3 curve groups with replacement within each bit stratum, retaining
      both solver seeds and all3 repetitions for each selected curve. Report 2.5%
      and97.5% empirical percentiles.
    failure_policy: No success-only summary. Incomplete/censored/invalid records suppress
      the qualified ratio and interval; counts and raw times still reported.
    units: Wall, CPU, group ops, S3 solves and LA ops are never summed.
  success_criterion: 'C-target / P-balanced-new-curves: all162 workers are valid with
    matched deterministic invariants and independent certificates; geometric paired
    speedup > max(1.05, C-aa aa_factor), and the stratified clustered bootstrap lower95%
    endpoint > 1. Independent review is required before any performance claim. Additionally
    balance-validation must pass, the environment lock and CPU affinity must match,
    and no known concurrent scientific producer may contaminate timing. Load/census
    are reported limitations, not proof of global isolation.'
  falsification_criterion: 'C-target / P-balanced-new-curves: a complete valid workload
    has geometric paired speedup <= 1; an arithmetic or deterministic-invariant mismatch
    separately falsifies correctness of this implementation. A crash or timeout is
    operational signal, not evidence against the mathematical mechanism. Values between
    the falsification and success gates are inconclusive.'
  decision_impact:
    on_positive: After independent review, expose and document the measured optional
      generator at this exact toy scope and record its delta; do not change historical
      defaults or official frontiers.
    on_negative: Retain the reference default, preserve the regression/correctness
      evidence, and inspect the measured setup/collection breakdown before designing
      a successor.
    on_inconclusive: Preserve all observations and the unchanged default; commission
      a new fixed workload only if its controls resolve the recorded uncertainty.
  variable_ledger:
    independent:
    - name: target_generator
      levels:
      - reference
      - fixed_window_w4
    factors:
    - name: field_and_curve
      treatment: randomized
      how: Fixed public generator, bits12/14/16 and unseen curve seeds3/4/5; paired
        arms share exact instance. No selection based on results.
    - name: target_sampling
      treatment: fixed
      how: Public target seed 0; identical solver seeds 0,1, random a,b distribution,
        and target_label default for every paired arm.
    - name: factor_base
      treatment: fixed
      how: small_x and package default_fb_size(N,2), built inside every timed solve;
        bind full point-list digest.
    - name: decomposition_and_elimination
      treatment: fixed
      how: m=2, mitm, scalar accelerate=false, default table arity, min_fill elimination,
        harvest=off; unchanged bound sources.
    - name: source_and_dependencies
      treatment: fixed
      how: Hash-bound unchanged native/base worker sources plus successor driver;
        pre-run and every-worker environment digest must match committed lock, with
        actual Python/package/host/affinity metadata.
    - name: execution_slot
      treatment: crossed
      how: Within each exact curve/solver-seed, cyclic rotations across3 repetitions
        place every arm once in each slot. Solver seeds use opposite orientations,
        all6 permutations per curve. Frozen and checked, not random assignment.
    - name: censoring
      treatment: fixed
      how: Per-worker 60-second process watchdog and package default attempt limit
        50*N for all arms; preserve every timeout/failure, continue the grid.
    - name: hardware_and_load
      treatment: measured
      how: Same locked host/environment and pinned CPU0 for all workers; pre/post
        load and process census recorded. Known concurrent scientific producers preclude
        a qualified timing conclusion; process census cannot establish global isolation.
    - name: measurement_boundary
      treatment: fixed
      how: Timer surrounds complete solve entry through return, including setup, misses,
        LA, recovery and solver verification; fixture generation, process startup,
        trace hashing and separate checker are reported harness overhead.
    - name: cpu_affinity
      treatment: fixed
      how: Each worker pins to CPU0, the minimum allowed affinity in the committed
        environment lock; actual affinity checked.
    comparisons:
    - id: C-target
      arms:
      - reference_a+reference_b
      - fixed_window
      differs_in:
      - target_generator
      design: one_factor
    - id: C-aa
      arms:
      - reference_a
      - reference_b
      differs_in:
      - execution_slot
      design: aa
    crosses_map: false
