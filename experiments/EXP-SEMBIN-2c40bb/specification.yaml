experiment:
  id: EXP-SEMBIN-2c40bb
  hypothesis_id: H-SEMBIN-97ea23
  goal_ids: [GOAL-SEMBIN-5078bc]
  version: 1
  title: >-
    The memory-charged comparison as a two-parameter surface, with the van
    Oorschot-Wiener baseline charged on its own tradeoff curve
  status: approved

  objective: >-
    Replace COST-SEMBIN-8d123b's crossover-per-metric table with the surface it is a
    slice of, and carry the four corrections REVIEW-SEMBIN-20260913-9d649f established.
    Six arms, in this order:

    (ARM R) REPRODUCTION GATE. Reproduce COST-SEMBIN-8d123b exactly at
    (store_log2 = 30, processors = 1, kappa = 1, cofactor = 1): crossovers 303 / 303 /
    435 / 375 and n = 409 margins +37.78 / -8.79 / +11.52. Nothing downstream runs
    until this passes.

    (ARM S) THE SURFACE. crossover_n and the n = 409 margin over the full grid
    (metric x store_log2 x processors_log2 x baseline_charging_mode x kappa x storage
    reading x k reading), reported as DATA and not as argmins, with the collision pairs
    exhibited.

    (ARM B) COHERENT BASELINE. Charge vOW at the minimum of its own T x Mem, and at the
    sect113r2-calibrated ratio w/M ~ 2^13.3, and charge Semaev at the minimum of his own
    curve. Report the shift and the n = 409 verdict under both storage readings.

    (ARM F) FIXED MEMORY BUDGET, hard and soft readings, over the declared budget grid,
    plus memory-weighted time T x M^alpha over the alpha grid. Locate the band in which
    the two storage readings disagree, and its boundaries.

    (ARM I) SECOND IMPLEMENTATION OF THE SPARSE WORKING SET, written from
    KN-LIT-e77232's statement of the formula and NOT imported from
    memory_charged_cost.py, compared cell by cell, and checked against that record's own
    n = 571 arithmetic.

    (ARM N) THE PRIME-FIELD NEARBY-OBJECT CONTROL, instantiated from EXP-ICEX-c32447's
    specified model. This is the control the parent run substituted away from on a
    premise the review showed to be false.

  inputs:
    frozen_source: inputs/SEMAEV-2015-310/paper_fulltext.md
    frozen_tables: inputs/SEMAEV-2015-310/tables.yaml
    parent_record: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml
    parent_raw: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/raw-result.json
    parent_code: experiments/EXP-SEMBIN-f4a17b/code/memory_charged_cost.py
    evidence_composing_the_round: ledger/evidence/EV-SEMBIN-71e5cd.yaml
    reviewer_reports:
      - coordination/review/sembin-20260913-9d649f/red-team-cf9d98/report.md
      - coordination/review/sembin-20260913-9d649f/red-team-cf9d98/recomputations.json
      - coordination/review/sembin-20260913-9d649f/validator-da3982/report.md
      - coordination/review/sembin-20260913-9d649f/validator-da3982/work/j1_memory_from_text.json
      - coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/report-phase-two.md
    sparse_formula_source: knowledge/literature/KN-LIT-e77232.md
    vow_curve_sources:
      - knowledge/techniques/KN-TECH-006.md
      - knowledge/techniques/KN-TECH-035.md
      - knowledge/techniques/KN-TECH-036.md
      - knowledge/techniques/KN-TECH-001.md
      - knowledge/techniques/KN-TECH-018.md
    prime_field_control_model: experiments/EXP-ICEX-c32447/specification.yaml
    prime_field_reference_answer: knowledge/open-problems/KN-OPEN-001.md

  independent_variables:
    - cost_metric: [time_only, time_memory_product, memory_weighted_time_alpha,
        fixed_budget_hard, fixed_budget_soft]
    - store_log2: [0, 10, 20, 30, 40, 48, 60]
    - processors_log2: [0, 20, 40]
    - baseline_charging_mode: [record_point_M1_w30, own_curve_product_minimum,
        sect113r2_calibrated_ratio]
    - kappa: [1, 10, 100]
    - cofactor_h: [1, 2, 4]
    - memory_budget_log2: [30, 40, 50, 60, 64, 65, 70, 80, 89, 90]
    - alpha: [0.0, 0.25, 0.5, 0.75, 0.811, 1.0]
    - storage_reading: [dense_row_echelon, semaev_sparse, rows_times_cols_dense,
        nonzeros_with_index_sparse]
    - k_reading: [unceiled_n_over_m_as_in_table3, ceil_n_over_m]
    - omega: [2.376, 2.807, 3.0]
    - degree_bound: [4, 5, 6]
    - curve_label: [B-409, K-409, B-571, K-571]

  controls:
    - id: C1
      name: reproduction_gate_against_parent_record
      description: >-
        At (store_log2 = 30, processors = 1, kappa = 1, cofactor = 1, degree bound 4)
        return COST-SEMBIN-8d123b's four crossovers and three n = 409 margins EXACTLY,
        and agree with the red team's independent reimplementation to within its stated
        4.8e-5 bits. This is a GATE, not a metric: it establishes that the new
        implementation computes the same object as three that already agree.
      failure_meaning: >-
        A procedure defect in the new implementation. STOP. Do not report a surface
        whose reproduction point disagrees with three independent implementations of
        its parent.
    - id: C2
      name: table3_baseline_reproduction
      description: >-
        All 36 Table 3 cells within 0.7% under the paper's un-ceiled k, argmin over m
        returning 10, 11, 12 at n = 310, 409, 571, and the time-only crossover at
        n = 302. Reuse the truncation convention the freezing session inferred and state
        it.
      failure_meaning: Procedure defect. Stops the costing.
    - id: C3
      name: informative_matched_null
      description: >-
        The null is a baseline charged the 3n bits it actually needs, NOT a baseline
        charged zero memory. Decompose the crossover shift into the part from Semaev's
        memory and the part from the baseline's store, per metric and per storage
        reading. A ZERO-MEMORY comparator must ALSO be run, and where it degenerates
        (log2(0) = -inf, no crossover) it must be reported as DEGENERATE and never as a
        share of zero. That conversion is the specific error EV-SEMBIN-71e5cd O-10
        records.
      failure_meaning: >-
        If the informative null returns a baseline-store contribution near zero, the
        parent's share = 0 was right after all and O-10 is wrong.
    - id: C4
      name: known_false_object_free_yield
      description: >-
        Delete exactly the factor 1/P = m! 2^{n - mk} from stage 1 -- the two terms
        log2(m!) + (n - mk) and nothing else. The crossover MUST move DOWN in every
        (metric, storage) cell. This is the one control no agreement between two
        implementations can replace, since both would share an inverted sign
        convention.
      failure_meaning: An inverted sign convention. Every crossover is void.
    - id: C5
      name: known_false_object_unchained_eq4
      description: >-
        Semaev's single summation polynomial eq. (4) at degree 2^{m-1} must be
        catastrophically worse. RETAINED, but recorded with the finding that it passes by
        1957 to 5977 bits, i.e. 54 to 147 times the record's largest disclosed
        uncertainty, and therefore detects only a transposition in the degree argument.
        It is a typo detector and MUST NOT be counted as a validity check on the cost
        model.
      failure_meaning: A transposition between the chain's D = 4 and eq. (4)'s 2^{m-1}.
    - id: C6
      name: prime_field_nearby_object
      description: >-
        Instantiate EXP-ICEX-c32447's prime-field index-calculus model, with its three
        separated counters and its multi-target rho arm with a shared distinguished-point
        table, and apply THIS experiment's machinery to it. The machinery must not report
        index calculus beating rho for prime-field ECDLP at cryptographic size
        (KN-OPEN-001 is the reference answer). Charge it under the same store grid and
        the same coherent-baseline modes.
      failure_meaning: >-
        The machinery mischarges memory or parallelism in a way that is invisible in the
        binary-field comparison because it cancels there. EVERY row of this experiment
        AND of RUN-SEMBIN-121b59 is void.
    - id: C7
      name: independent_sparse_working_set
      description: >-
        Implement (nm)^4/24 columns at n^3/m nonzeros per row from KN-LIT-e77232's
        statement WITHOUT reading memory_charged_cost.py's implementation of it, compare
        cell by cell, and reproduce that record's own n = 571 arithmetic (2^46.38
        columns, 2^23.89 nonzeros, 2^70.3 total). Report the largest cell-wise
        disagreement.
      failure_meaning: >-
        Disagreement localises to one of two named implementations of the term that moves
        the n = 409 verdict by 20 bits. Report both; do not pick one.
    - id: C8
      name: full_scan_domain_no_hidden_window
      description: >-
        Scan n from 3 rather than from 250, so the low-n artefact (a baseline charged a
        fixed 2^30-point store in a group of 2^3 elements) is SEEN and labelled rather
        than excluded by an undeclared window. Report the cheaper set as intervals, and
        report monotone_after_crossover per cell, so that "first crossing" and
        "persistent crossover" are distinguishable.
      failure_meaning: >-
        Not a failure mode but a disclosure requirement. The parent's crossover_curve
        hardcoded n_lo = 250 and so never saw the artefact.
    - id: C9
      name: invalid_input_rejection
      description: >-
        Reject m < 2, t > m, non-integer n, negative store_log2, budget below 3n bits,
        and kappa <= 0 with an error rather than a number.
      failure_meaning: Silent coercion of invalid parameters into plausible-looking output.
    - id: C10
      name: measurement_comparison_against_frozen_tables
      description: >-
        Compare every storage reading against the 34 MAGMA memory measurements in the
        frozen source's Tables 1-2, under BOTH readings of the MB column -- peak and
        total over 100 systems -- and report both. Report per-row model-minus-measured
        in bits and whether each accounting upper-bounds every row. DO NOT PICK a
        reading of the column: tables.yaml's transcription_limits and the validator's
        process-floor inference disagree, and that disagreement is reported, not settled.
      failure_meaning: >-
        If no accounting upper-bounds the measurements under either reading, the memory
        model is wrong on the only data that exists and ARM S is uninterpretable.

  metrics:
    primary:
      - crossover_n_surface: >-
          crossover n over the full grid, as data. Every reported crossover carries
          (metric, store_log2, processors_log2, baseline_charging_mode, kappa, cofactor,
          storage_reading, k_reading). A crossover quoted without them is a FAILED
          deliverable regardless of its value.
      - margin_at_409_surface: signed bits, same cell labelling
      - crossover_range_over_store: >-
          range in n across store_log2, per metric and per storage reading, set beside
          the range across the metric set. This is the pair that decides C2 of the
          hypothesis.
      - coherent_baseline_shift: >-
          shift in n and in bits from record_point_M1_w30 to own_curve_product_minimum,
          per storage reading
      - budget_disagreement_band: >-
          the interval of memory budgets inside which the two storage readings give
          different verdicts at each FIPS label, with its boundaries and the m attaining
          Semaev's cheapest memory
      - alpha_flip_threshold: the alpha at which each storage reading flips at each FIPS label
    secondary:
      - collision_pairs: >-
          every pair of grid cells returning the same crossover for different reasons
      - matched_null_decomposition: bits and n, per metric, with degeneracies labelled
      - sparse_implementation_delta: largest cell-wise bits of disagreement, ARM I
      - measurement_residuals: per-row model-minus-measured bits, both MB readings
      - kappa_sensitivity: crossover shift in n across kappa
      - cofactor_and_automorphism_shifts: >-
          per curve label, with K-409 charged separately from B-409
      - vow_product_excess: >-
          bits by which the record's baseline charge exceeds the minimum of vOW's own
          product, per n. Predicted constant at 29.0.
      - pareto_min_of_own_curves: crossover and margins charging each algorithm its own minimum

  heuristic_under_test: HEUR-VOW-CURVE
  heuristic_status_note: >-
    UNVALIDATED, and its primary source has not been opened by any agent in this
    program. KN-LIT-012 records that its own full text was not re-read. The run must
    state this in its manifest and must not present the tradeoff model as sourced from
    van Oorschot-Wiener 1999.

  preregistered_prediction:
    written_before_execution: true
    coordinator_prior: >-
      RECORDED BEFORE THE RUN, and the Coordinator's calibration in this batch is poor
      and stated as such: it was wrong about t* < m* in EXP-SEMBIN-81dc96, wrong about
      the dense width^2 reading being a straw (J1), and wrong about the direction of the
      vOW tradeoff (J2). Three priors, three refutations. What follows is therefore held
      loosely.

      The Coordinator EXPECTS all three of H-SEMBIN-97ea23's claims to hold, because
      each is already computed once by the red team from an independent
      reimplementation, and expects the interesting failure to be elsewhere: in ARM N,
      the prime-field control. That arm has never been run in this program, it is the
      one control that can void both experiments at once, and EXP-ICEX-c32447 sits at
      status draft with no runs for reasons nobody has recorded. The Coordinator's prior
      is that instantiating it will be harder than the red team's location of it
      suggests, and that the honest outcome may be a documented impediment rather than a
      passing control.

      Second expectation, weaker: that ARM I will AGREE (the sparse term is probably
      implemented correctly, since KN-LIT-e77232 re-checks it at n = 571) and that the
      real gap is that the formula itself is Semaev's self-estimate, corroborated
      nowhere, so a second implementation of the same formula raises confidence in the
      arithmetic and not in the model. If a reviewer says ARM I is theatre for that
      reason, the Coordinator will agree.

      Third: the Coordinator expects ARM F's disagreement band to come out NARROWER than
      the red team's 2^65 to 2^89, because the red team took Semaev's cheapest memory
      over m in [2,30] without re-optimising the full cost at each budget.
    predicted_values:
      reproduction_gate: {crossovers: [303, 303, 435, 375], margins_at_409: [37.78, -8.79, 11.52]}
      coherent_baseline: {crossover_sparse: 460, crossover_dense: 520,
        margin_409_sparse: -17.48, margin_409_dense: -37.79, shift_in_n: 85,
        product_excess_bits: 29.0}
      store_vs_metric_range: {store_range_sparse_declared_grid: 96, metric_range_sparse: 72,
        store_range_full_grid_dense: 180, store_range_full_grid_sparse: 183}
      budget_band: {lower_log2: 65.33, upper_log2: 80.07, semaev_cheapest_m_sparse: 8,
        semaev_cheapest_m_dense: 6}
      alpha_flip: {dense: 0.811, sparse: none_in_0_to_1}
      matched_null: {semaev_memory_dense: 219, semaev_memory_sparse: 159,
        baseline_store: -87, net_dense: 132, net_sparse: 72}
      cofactor: {shift_per_h: [0, 1, 3], direction: baseline_gets_cheaper}
      sect113r2_calibrated: {crossover_dense: 486, crossover_sparse: 424, margin_409_sparse: -5.18}
      all_corrections_B409: {crossover_dense: 481, crossover_sparse: 421,
        margin_dense: -24.80, margin_sparse: -3.76}

  scale_relevance:
    tested_scale: >-
      n from 3 to 700, covering every FIPS binary label. This is a DERIVATION at
      cryptographic parameters, not a computation at them: nothing is instantiated.
    transfer_assumptions: >-
      None. There is no extrapolation from small to large n; the formulas are evaluated
      directly at every n. What DOES transfer, and is the weakest link, is the memory
      model's calibration: the only measurements of this object are at N ~ 50 while every
      claim is at N = 2790 to 6286, and the gap between the two storage readings WIDENS
      from about 7 bits to 19-21 bits across that range. C10 must report this widening
      explicitly, because EV-SEMBIN-71e5cd O-19 records that the parent did not.
    claim_tier: crypto

  tail_checks:
    - >-
      Report the near-optimal region in m, not only the argmin: the width in m within
      1 bit of the optimum, per metric and per budget, since a knife-edge argmin under a
      metric is itself a finding.
    - >-
      Report the cheaper set as INTERVALS over the full scan domain, so a non-monotone
      margin is visible. The margin saws because ceil(n/m) steps at each multiple of m
      and doubles the relation store.
    - >-
      Report per-cell whether the crossover is a first crossing or a persistent one
      (monotone_after_crossover).

  replication:
    internal: >-
      ARM I is an internal replication of the single term that moves the headline. ARM R
      is a replication of the parent at one slice.
    external: >-
      The red team's recomputations.json already contains an independent reimplementation
      of the parent and of most of the corrections. The run MUST compare against it cell
      by cell and report agreement, and MUST NOT import it.
    determinism: >-
      Deterministic: no randomness anywhere. Re-execution must be bit-identical apart
      from timestamps, and the run must demonstrate that by executing twice and diffing.

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 20
    cpu_cores: 2
    enforcement: advisory
    note: >-
      The whole grid is closed-form arithmetic and the red team estimated under ten
      minutes of compute for the core of it. If a cell is slow, the grid is too fine, not
      the budget too small.

  stopping_rules:
    - >-
      RUN ARM R FIRST AND STOP ON FAILURE. If the reproduction gate does not return the
      parent's four crossovers and three margins exactly, stop and report the
      disagreement. Do not proceed to the surface. Three independent implementations
      already agree at that point, so a fourth that disagrees is the defective one.
    - >-
      Run ARM N (prime-field control) SECOND, before the expensive grid. It can void the
      entire experiment and its parent, so discovering that last is the wrong order.
    - >-
      If C4 (free-yield) fails, stop immediately. An inverted sign convention voids every
      crossover and no further arm is interpretable.
    - >-
      If EXP-ICEX-c32447's model cannot be instantiated within the budget, RECORD A
      CONCRETE IMPEDIMENT naming what is missing and continue with the remaining arms,
      reporting ARM N as UNREACHED with the reason. Do NOT substitute a same-family
      object and count it as this control: that substitution is exactly what the review
      round broke (EV-SEMBIN-71e5cd O-15, O-16).
    - >-
      Do not narrow the grid to make a prediction come out. If a predicted value is
      missed, report the miss.

  invalidation_rules:
    - >-
      Reporting any crossover without its full cell label (metric, store_log2,
      processors_log2, baseline_charging_mode, kappa, cofactor, storage_reading,
      k_reading) INVALIDATES the deliverable regardless of the value.
    - >-
      Reporting a degenerate control as a numeric share invalidates the control. Where a
      zero-memory comparator gives log2(0) = -inf and no crossover exists, the output is
      DEGENERATE, not 0.
    - >-
      Counting C5 (eq. 4) as a validity check on the cost model rather than as a typo
      detector invalidates the control count.
    - >-
      MEASURING OR ASSERTING ANY DEGREE invalidates the run. There is no Groebner engine
      on this host (IMP-SEMBIN-ENGINE) and degree bound 4/5/6 are swept as GIVEN
      PARAMETERS, never as measurements. A statement that a degree is "plausibly 4" is a
      violation.
    - >-
      Editing COST-SEMBIN-8d123b, RUN-SEMBIN-121b59, or any other committed record
      invalidates the run. Corrections supersede; they never overwrite.

  success_criterion: >-
    A surface, not a number: crossover_n and margin_at_409 over the full declared grid,
    with the collision pairs exhibited, the store-versus-metric ranges set side by side,
    the coherent-baseline shift reported under both storage readings, the budget
    disagreement band located with its boundaries, and every control outcome stated
    separately including any recorded UNREACHED with its reason. Success does NOT require
    the predictions to be met -- it requires them to be answered.

  falsification_criterion: >-
    H-SEMBIN-97ea23's C2 -- and with it the whole reason for this experiment -- is
    FALSIFIED if the crossover's range over the parent contract's own declared store
    values (30, 40, 48, 60) does not exceed its range over the metric set for the sparse
    reading. In that case the parent's one-parameter framing was adequate, only its store
    value was undeclared, and the correct output is a one-line correction to
    COST-SEMBIN-8d123b rather than a superseding record. C1 is falsified if the coherent
    baseline moves the crossover by less than 50 in n or leaves either crossover at or
    below 409. C3 is falsified if the two storage readings disagree at n = 409 under any
    hard budget below 2^65 bits.

  required_artifacts:
    - manifest.yaml with the full artifact policy of AGENTS.md, including the requested
      and resolved inference policy and whether it was probe-verified
    - raw-result.json carrying the entire surface as data, one record per grid cell
    - surface.json or surface.csv with the crossover and margin grids in a form a later
      reader can re-plot without re-running
    - controls.json with all ten control outcomes stated separately, degeneracies and
      UNREACHED arms labelled as such
    - reproduction-gate.json comparing cell by cell against COST-SEMBIN-8d123b and
      against the red team's recomputations.json
    - sparse-implementation-comparison.json for ARM I
    - measurement-comparison.json for C10, with BOTH readings of the Tables 1-2 MB column
    - a COST-* concrete cost record, with its figures verified by a transcription checker
      rather than copied by hand
    - determinism-check showing two executions diffing only in timestamps
    - stdout, stderr, exact commands, environment and dependency versions, timings and
      peak memory for every execution including failed attempts

  assigned_to: executor
  approved_by: DEC-20260913-74e208
  approval_basis: >-
    Approved under the standing user authorization of 2026-09-06 (AGENTS.md "Standing
    user authorization for ideas and experiments"). No user confirmation was sought or
    is required. The Coordinator verified protocol completeness: ten controls including
    two known-false objects and a nearby-object control with a settled reference answer,
    numeric preregistered predictions with a prior recorded BEFORE execution, five
    stopping rules with a hard gate first, five invalidation rules, declared budget,
    declared artifacts, and a falsification criterion that can retire the experiment's
    own reason for existing. Approval asserts protocol completeness and ranking; it
    asserts nothing about whether H-SEMBIN-97ea23 is true.

  dependencies:
    - RUN-SEMBIN-121b59
    - EV-SEMBIN-71e5cd
    - TASK-20260913-cf9d98
    - TASK-20260913-da3982

  independence_note: >-
    This experiment consumes the red team's report as an INPUT, so it is not independent
    of it and does not claim to be. It is a producer task: it computes the surface the
    red team argued for. Whether the surface supports H-SEMBIN-97ea23 is a question for a
    LATER independent review round, which must be run by agents that did not write the
    red team report and did not run this experiment. The run must not assert that its
    agreement with recomputations.json is independent corroboration; it is a comparison
    against its own source.

  interpretation_limits:
    - >-
      NOTHING THIS EXPERIMENT PRODUCES IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE, IN
      EITHER DIRECTION. It compares two heuristic cost models. A cell in which parallel
      rho wins does not make B-409 safe; a cell in which the chained algorithm wins does
      not make it attackable.
    - >-
      This corrects a comparison. It proposes no algorithm, moves no exponent, and finds
      no attack. Its best outcome is that a figure in this program's own ledger is
      replaced by a surface with its parameters attached.
    - >-
      It does not impeach COST-SEMBIN-8d123b's arithmetic, reproduced independently three
      times to 4.8e-5 bits. ARM R is required precisely to preserve that.
    - >-
      Every figure inherits Assumption 1 unvalidated. The degree-5 sensitivity (+19.4
      bits at n = 409) exceeds the 29.0-bit baseline correction and the 18-21 bit
      dense/sparse gap, so the largest uncertainty in this family of numbers is untouched
      here and stays impeded.
    - >-
      HEUR-VOW-CURVE rests on two internal records, not on the primary van
      Oorschot-Wiener paper, which no agent in this program has opened. Retrieving and
      reading that paper is a cheap, high-value follow-up and is NOT in this contract's
      scope; the run must state the gap rather than paper over it.
