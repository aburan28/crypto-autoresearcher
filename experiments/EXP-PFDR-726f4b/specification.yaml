experiment:
  id: EXP-PFDR-726f4b
  hypothesis_id: H-PFDR-5b4a4f
  question_id: RQ-SBRG-f31cb2
  idea_id: IDEA-20260829-fa8235
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation. This contract does not modify EXP-SBRG-60c55e, which is a
    separate record with its own status.
  title: >-
    Measure the TARGET-BLOCK RANK ADMISSION RATIO against a curve-free
    degree-profile-matched planted control, calibrated by a planted dependency of
    known size -- because the source idea pre-registered discriminator, the
    8-target elimination speedup with band [1.55, 2.00] and a ceiling of 2.00,
    is shown by arithmetic to place both competing explanations inside the band
    and to make the nominated falsifier unreachable for every value of the rank
    ratio.
  claim_ceiling: >-
    A ceiling on ONE reuse mechanism under ONE cost model and ONE batch schedule.
    No wall-clock claim, no solving-degree claim, no ECDLP claim, no exponent. The
    derived end-to-end gain is a constant and is explicitly non-target-class.
  claim_tier_basis: >-
    Toy tier. Elimination operation counts are deterministic and
    machine-independent under a fixed eliminator, so the reported quantity is a
    RATIO of counts and never a wall-clock time.
  objective: >-
    Establish, IN THIS ORDER: (1) the symbolic ceiling and its two boundary cases,
    zero compute; (2) that the rank instrument MOVES BY A KNOWN AMOUNT when a
    dependency of known size is planted; (3) the target-block rank admission ratio
    on the real system and on the CURVE-FREE degree-profile-matched planted
    control, whose difference is the only quantity that could carry
    Semaev-specific content; (4) the elimination speedup as a COST-MODEL
    CONSISTENCY CHECK ONLY, with its arithmetic inability to discriminate stated
    in advance; and (5) the fully charged composition beside a matched Pollard rho
    count under one frozen conversion.
  band_non_degeneracy:
    statistic: 'the 8-target elimination speedup, as pre-registered by the source idea'
    null_value: '1.78, bookkeeping reuse with a fully dependent target block'
    alternative: >-
      above the ceiling 2.00, the source idea nominated signature of genuine
      structural reuse with an online rank sublinear in the target row count
    computed_check: >-
      EVALUATED IN CLOSED FORM, WITH NO RUN. The speedup formula is
      1 divided by (rho_D plus (1 minus rho_D) times r divided by K), where r is
      the ratio of structural to full rank. At rho_D = 1/2 and K = 8 this is
      1 divided by (0.5 plus 0.5 r divided by 8). A FULLY DEPENDENT target block
      has r = 1 and gives 1.778. A FULLY INDEPENDENT target block, with equal row
      counts, has r = 1/2 and gives 1.882. The supremum over r in [0, 1] is
      attained only in the limit r tending to 0 and equals EXACTLY 2.000. SO BOTH
      COMPETING EXPLANATIONS LIE INSIDE THE PRE-REGISTERED BAND [1.55, 2.00],
      ABOUT 0.10 APART IN A BAND OF WIDTH 0.45, AND THE NOMINATED
      ABOVE-THE-CEILING FALSIFIER IS UNREACHABLE FOR EVERY POSSIBLE VALUE OF THE
      RANK RATIO. The discriminator cannot fire in either direction.
    resolution: >-
      THE PRIMARY DISCRIMINATOR IS CHANGED. It becomes the TARGET-BLOCK RANK
      ADMISSION RATIO, the difference between the full rank and the structural
      rank divided by the target row count, measured by exact GF(2) rank rather
      than inferred from a cost. It is bounded in [0, 1] with the bookkeeping null
      at the top of its range, so the alternative has the whole interval to move
      into; it is the quantity the competing explanation is actually about; and it
      is calibrated by a planted dependency of known size that must move it by
      exactly the planted fraction. The elimination speedup is RETAINED AS A
      COST-MODEL CONSISTENCY CHECK with the band [1.55, 2.00], and an excursion
      outside that band is read as indicting the COST MODEL -- most plausibly
      online density growth -- and NEVER as evidence about the row partition.
  inputs:
    grid:
      n: '{8, 10, 12}'
      t: '{3, 4}'
      representations: 'all four declared in EXP-SBRG-60c55e, including the zero-reuse control'
      field_basis: '{power, normal}'
      orientation: '{prefix, random}'
      master_seeds: '3'
      K: '{1, 2, 4, 8} so the batch-size dependence can be fitted'
    excluded_by_arithmetic: >-
      n = 14 and n = 16 at the largest Macaulay degree are NOT run, because the
      same row and column arithmetic puts them past the 200000-column resource
      guard declared in EXP-SBRG-60c55e. Excluding them by arithmetic before the
      run is deliberate: a guard firing at run time would be an infrastructure
      stop, and this contract avoids the envelope by construction rather than by
      hope.
    schedule: >-
      FROZEN before any cell runs: reduce the structural block once to a carrier,
      then stream each target block against the carrier. A different schedule has
      a different ceiling and this derivation does not apply to it.
    planted_defect_sizes: 'K_dep at 1, 2, 5 and 10 percent of the target row count'
  controls:
    - id: CTRL-PLANTED-DEPENDENCY
      row_class: positive_control
      blocking: true
      object: >-
        exactly K_dep rows of the target block replaced by KNOWN XOR combinations
        of structural rows
      forced_disposition: >-
        The measured rank admission ratio MUST fall by exactly K_dep divided by
        the target row count, at each of the four planted sizes. THIS IS THE
        DYNAMIC-RANGE DEMONSTRATION AND IT IS BLOCKING: an instrument that does
        not move by the predicted amount on a dependency of known size cannot be
        read when it fails to move on the real object, and every null from it is
        void.
    - id: CTRL-CURVE-FREE-DEGREE-PROFILE
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL, which EXP-SBRG-60c55e already specifies as
        its degree-profile control: a random boolean system with the IDENTICAL
        degree histogram and IDENTICAL bipartition, containing no curve, no group
        law and no summation polynomial.
      forced_disposition: >-
        The ceiling is a COUNT and knows nothing about Semaev, so this null MUST
        reproduce it. If the null shows a materially different value, the cost
        model is wrong or the implementation is sensitive to something the count
        does not see, and NO conclusion may be drawn. If the null shows the same
        value and the real system does not exceed it, the measured reuse is
        BOOKKEEPING and NOTHING may be described as a Semaev-specific,
        curve-specific or ECDLP-relevant effect.
    - id: CTRL-ZERO-REUSE-REPRESENTATION
      row_class: instrument
      blocking: true
      object: 'the representation with no target-independent generator group'
      forced_disposition: >-
        FORCED 1.00 within 0.05 at every Macaulay degree and every batch size. Any
        reported reuse there is an instrument artifact and halts the line. The
        cheapest single integrity check in the design, one cell.
    - id: CTRL-SINGLE-TARGET-BATCH
      row_class: instrument
      blocking: true
      object: 'a one-target batch'
      forced_disposition: >-
        FORCED exactly 1.00: nothing can be amortized over one target. An
        implementation reporting above 1.00 is measuring a different quantity.
    - id: CTRL-FIXED-FINGERPRINT
      row_class: instrument
      blocking: true
      object: 'the structural block across the targets of a batch'
      forced_disposition: >-
        FORCED bit-identical. If it is not, the bipartition does not exist and no
        number from that cell means anything. This is the invariant
        EXP-SBRG-60c55e already declares with a harness-void failure effect.
    - id: CTRL-KNOWN-DECOMPOSITION
      row_class: instrument
      blocking: true
      object: 'a planted decomposable target'
      forced_disposition: 'MUST satisfy every descended equation, or the harness is void.'
    - id: CTRL-BASIS-AND-ORIENTATION
      row_class: instrument
      blocking: true
      object: 'both field bases and both factor-base orientations'
      forced_disposition: >-
        The ceiling is basis- and orientation-free by derivation, so the predicted
        values must be invariant across them. Any dependence is a coordinate
        artifact and is reported as one.
    - id: CTRL-MATCHED-RHO
      row_class: pareto_control
      blocking: true
      object: 'Pollard rho on the same instances under ONE frozen operation conversion'
      forced_disposition: >-
        Required so the charged gain in the final stage is a ratio of comparable
        quantities. Counting rho in group operations and the reuse arm in
        elimination operations without a declared conversion would manufacture a
        large factor in either direction.
    - id: CTRL-DENSITY-BOTH-ARMS
      row_class: instrument
      blocking: true
      object: 'sparsity of the baseline and online arms'
      forced_disposition: >-
        Reported in BOTH arms per the 4x density caveat EXP-SBRG-60c55e already
        states. The online arm reduces against a dense carrier while the baseline
        may exploit sparsity early, and faster online density growth lowers the
        measured speedup for a reason that has nothing to do with the partition.
  independent_variables:
    - 'n in {8, 10, 12}'
    - 't in {3, 4}'
    - 'representation, including the zero-reuse control'
    - 'Macaulay degree within the admitted cells'
    - 'field basis and factor-base orientation'
    - 'batch size K in {1, 2, 4, 8}'
    - 'system in {real, curve-free degree-profile-matched control, planted-dependency variants}'
  metrics:
    primary:
      - 'TARGET-BLOCK RANK ADMISSION RATIO: (full rank minus structural rank) divided by target row count, by exact GF(2) rank. UNITS: dimensionless fraction in [0, 1]. THE PRIMARY DISCRIMINATOR.'
      - 'EXCESS RANK ADMISSION RATIO: the curve-free control value minus the real value at identical bipartition, degree histogram, degree, n and K. UNITS: dimensionless fraction'
      - 'planted-dependency calibration: the measured shift in the ratio against K_dep divided by the target row count, at four planted sizes. UNITS: dimensionless fraction'
      - 'structural and target row counts, and structural and full ranks, per cell. UNITS: rows (integer)'
      - 'measured boolean degree histogram per generator block. UNITS: counts by degree'
      - 'rho_D computed from the histogram, and the reciprocal of the chain length beside it. UNITS: dimensionless fraction'
      - 'baseline, offline and online elimination operation counts, SEPARATELY. UNITS: word operations (integer)'
      - 'elimination speedup at K in {1, 2, 4, 8}. UNITS: dimensionless ratio. COST-MODEL CONSISTENCY CHECK ONLY.'
    secondary:
      - 'sparsity in the baseline and online arms'
      - 'peak resident memory and wall time per cell against the predicted bound'
      - 'matched rho operation count under the frozen conversion'
      - 'charged end-to-end gain, the measured reuse factor raised to the composition exponent'
      - 'the fitted eliminator constant and its residuals across the grid'
  heuristic_under_test: >-
    HEUR-001 (generic row independence, whose failure BREAKS the ceiling and is
    therefore the most valuable outcome) and HEUR-002 (the elimination cost model,
    whose constant is fitted once across the grid and then frozen) of
    H-PFDR-5b4a4f.
  preregistered_prediction:
    quantity: >-
      The excess rank admission ratio; the planted-dependency calibration; the
      zero-reuse and single-target controls; rho_D against the reciprocal of the
      chain length; the elimination speedup; the arm ordering across chain
      lengths; and the charged end-to-end gain.
    formula: >-
      EXCESS RANK ADMISSION RATIO PREDICTED 0. Planted-dependency shift FORCED
      exactly the planted fraction at each of four sizes. Zero-reuse
      representation FORCED 1.00 within 0.05. Single-target batch FORCED exactly
      1.00. rho_D PREDICTED at or ABOVE the reciprocal of the chain length and
      never below. Elimination speedup within [1.55, 2.00] at the shorter chain
      as a COST-MODEL CHECK ONLY, with the arithmetic that both explanations lie
      inside it recorded in the contract. Arm ordering FORCED: the longer chain
      must exceed the shorter in every seed. Charged end-to-end gain PREDICTED at
      most 1.6x and therefore exponent-neutral.
    source: >-
      H-PFDR-5b4a4f claims (A) to (F) and predictions P1 to P9. The generator
      counts, the batch size, the zero-reuse representation, the degree-profile
      control and the resource guards were read from EXP-SBRG-60c55e by the
      drafting coordinator on 2026-09-04. FIXED ON 2026-09-04, BEFORE ANY CELL
      RUNS, INCLUDING THE ARITHMETIC DEMONSTRATION THAT THE SPEEDUP BAND CANNOT
      DISCRIMINATE.
  scale_relevance:
    tier: toy
    justification: >-
      Weil-descended chained systems over ordinary binary curves at n at most 12
      in the measured arm. Nothing transfers to prime fields, to non-chained
      topologies, or to cryptographic scale. The ceiling is a statement about a
      row count under one cost model and one schedule, not about any solver.
    correspondence: 'none; systems are constructed directly'
  tail_checks:
    - >-
      The LARGEST-n cell reported separately rather than pooled, because an excess
      that appears only at the smallest n is a small-parameter artifact.
    - >-
      The largest observed excess rank admission ratio over all cells, reported
      individually rather than averaged.
    - >-
      The largest cell by rows times rank times columns, reported separately,
      because the eliminator constant is most likely to drift where sparsity is
      highest.
    - >-
      Every cell where rho_D falls BELOW the reciprocal of the chain length,
      reported individually and hand-derived before anything else is reported,
      since it would contradict the degree-substitution argument.
  replication:
    seeds: ['master seed 20260824', 'master seed 20260825', 'master seed 20260826']
    independent_instances: 8
    reason: >-
      Eight targets per cell as declared in EXP-SBRG-60c55e, three master seeds,
      both field bases and both orientations. A positive excess must PERSIST over
      at least three increasing n and two master seeds; a single-cell signal
      cannot satisfy the rule.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 400
    maximum_workers: 1
    notes: >-
      Restricting to n at most 12 and to the admitted degrees caps the column
      count at about 1.0e5 and the row count at about 8.4e3, so the dense matrix
      and the echelon carrier are each about 107 MB. Peak resident memory is
      predicted below 1 GiB and is a REQUIRED reported metric so the prediction
      can fail. A resource stop is INFRASTRUCTURE signal under AGENTS.md rule 5
      and never negative mathematical evidence.
  stages:
    - id: stage-0-symbolic
      purpose: >-
        derive rho_D for every admitted cell from the generator counts and the
        measured degree histograms; derive the speedup formula; check the two
        boundary cases by hand; and ARCHIVE the closed-form demonstration that the
        speedup band cannot discriminate
      blocking: true
    - id: stage-1-composition
      purpose: >-
        instantiate the end-to-end composition and emit the ceiling at several
        chain lengths, verified numerically; record the regime where reuse stops
        buying anything
      blocking: true
    - id: stage-2-planted-dependency
      purpose: 'the four planted defect sizes; the rank instrument must move by exactly the planted fraction'
      blocking: true
    - id: stage-3-measurement
      purpose: 'the admitted grid, recording all row counts, ranks, histograms, operation counts and densities'
    - id: stage-4-curve-free-control
      purpose: >-
        the degree-profile-matched planted boolean control at the identical
        bipartition; report EXCESS, never a raw value
      blocking: true
    - id: stage-5-report
      purpose: >-
        compare measured against predicted; report the charged gain beside a
        matched rho count; and if the ceiling holds, file the constant-factor
        characterisation as a PROPOSAL for the Coordinator with forward guidance
        naming the object classes the ceiling does not cover
  stopping_rules:
    - 'STOP at stage 0 if either boundary case fails. The formula is wrong.'
    - >-
      STOP at stage 2 if the planted dependency does not move the rank admission
      ratio by the planted fraction. The instrument is not measuring what it
      claims.
    - 'STOP if the zero-reuse representation reports reuse above 1.05, or a one-target batch differs from 1.00.'
    - 'STOP if the structural block is not bit-identical across the targets of a batch.'
    - >-
      Stage 4 is NOT optional. Reporting a raw speedup or a raw rank admission
      ratio without the curve-free control beside it is an invalidation, not a
      shortcut.
    - >-
      Do NOT run n = 14 or n = 16 at the largest degree. Those cells are excluded
      by arithmetic before the run.
  invalidation_rules:
    - >-
      Reporting a bare elimination speedup, without the row counts, the ranks and
      the measured degree histogram beside it, INVALIDATES the report: two
      structurally opposite situations produce values 0.10 apart inside the band.
    - >-
      Using the elimination speedup as a DISCRIMINATOR between the two
      explanations INVALIDATES the artifact making the inference, because the
      closed-form arithmetic archived in stage 0 shows it cannot separate them.
    - >-
      Reading an excursion of the speedup outside [1.55, 2.00] as evidence about
      the row partition INVALIDATES that reading; it indicts the cost model.
    - >-
      Reporting the real system without the CURVE-FREE degree-profile-matched
      control at identical bipartition INVALIDATES the report; only the EXCESS
      over that control may be described as structural.
    - >-
      Describing a measured reuse that the curve-free control reproduces as a
      Semaev-specific, curve-specific or ECDLP-relevant effect INVALIDATES the
      artifact.
    - >-
      Quoting an elimination speedup as an ECDLP speedup INVALIDATES the
      statement; only the charged end-to-end gain, reported beside a matched rho
      count under the frozen conversion, speaks to cost at all.
    - >-
      Changing the batch schedule, the cost model, the planted-defect sizes or any
      forced control value after an outcome is seen INVALIDATES the run.
    - >-
      Making any wall-clock claim INVALIDATES it: the reported quantity is a ratio
      of deterministic operation counts.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the closed-form demonstration
    that the speedup band cannot discriminate is archived in stage 0 before any
    cell runs; (2) the planted dependency moves the rank admission ratio by
    exactly the planted fraction at all four sizes; (3) the zero-reuse
    representation returns 1.00 within 0.05, the single-target batch returns
    exactly 1.00, and the structural fingerprint is bit-identical; (4) every
    admitted cell reports row counts, both ranks, the degree histogram, rho_D, the
    three operation counts and the density in both arms; (5) the CURVE-FREE
    control is run at identical bipartition and the EXCESS is reported for every
    cell; and (6) the charged end-to-end gain is reported beside a matched rho
    count under the frozen conversion.
    SUCCESS IS BATTERY INTEGRITY, NOT A PARTICULAR CEILING.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 CEILING BROKEN, THE MOST VALUABLE OUTCOME: the excess rank admission ratio
    is positive beyond the planted-defect resolution and persists over three
    increasing n and two master seeds. The reuse is not the row partition, the
    surviving mechanism is an online rank sublinear in the target row count, and
    it is a genuine reusable structural dependency worth far more than this
    contract.
    F2 INSTRUMENT DEAD: the planted dependency does not move the ratio by the
    planted fraction.
    F3 INSTRUMENT ARTIFACT: the zero-reuse representation reports reuse above
    1.05, or a one-target batch differs from 1.00, or the fingerprint is not
    invariant.
    F4 SUBSTITUTION ARGUMENT WRONG: measured rho_D falls below the reciprocal of
    the chain length at any cell. Hand-derived before anything else is reported.
    F5 COST MODEL WRONG: the elimination speedup falls outside [1.55, 2.00] at the
    shorter chain. Because both explanations lie inside that band by arithmetic,
    such an excursion indicts the COST MODEL -- most plausibly online density
    growth -- and is never read as evidence about the row partition.
    F6 ATTRIBUTION DENIED: the curve-free degree-profile-matched control shows the
    same rank admission ratio as the real system. The measured reuse is
    bookkeeping, it is reproduced by an object with no curve in it, and NOTHING
    may be described as Semaev-specific or curve-specific.
    F7 EVERYTHING HOLDS: the question acquires a derived ceiling for row-space
    reuse, the lane is characterised as constant-factor and exponent-neutral with
    the constant computed, and the forward guidance names the object classes the
    ceiling does not cover.
  artifact_package_directory: experiments/EXP-PFDR-726f4b/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/band-arithmetic.md (the archived closed-form demonstration that the pre-registered speedup band contains both explanations and that its nominated falsifier is unreachable, written BEFORE any cell runs)'
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/symbolic.yaml (rho_D per admitted cell, the speedup formula, the two boundary cases, the composition ceilings with their numerical verification)'
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/planted-dependency.yaml (the four planted sizes, the predicted shift and the measured shift per cell)'
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/measurements.yaml (per cell: structural and target row counts, structural and full ranks, rank admission ratio, degree histogram, rho_D, baseline and offline and online operation counts, densities, basis, orientation, seed, K)'
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/curve-free-control.yaml (the degree-profile-matched planted control at identical bipartition, and the EXCESS per cell, with an explicit statement of what the comparison licenses and forbids)'
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/charged-gain.yaml (the composition applied to the measured reuse factor, beside a matched rho count under the frozen conversion, with the conversion written out)'
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/resources.yaml (peak resident memory and wall time per cell against the predicted bound)'
    - 'experiments/EXP-PFDR-726f4b/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F7 fired; per-file sha256; the inference block; the eliminator commit and word width; and an explicit statement that no wall-clock claim is made and no prior record was edited)'
  interpretation_limits:
    - >-
      A CEILING ON ONE REUSE MECHANISM UNDER ONE COST MODEL AND ONE SCHEDULE, not
      a closure of the question. It bounds reuse of the Macaulay ROW SPACE and
      says nothing about reuse of a projected variety, of a compressed low-degree
      filter, of Frobenius orbit structure, or of any object not yet enumerated.
    - >-
      NO ECDLP CLAIM, NO EXPONENT, NO ATTACK. The derived end-to-end ceiling is a
      constant and is explicitly non-target-class.
    - >-
      The source idea pre-registered speedup discriminator is retained as a
      cost-model check ONLY. The arithmetic showing it cannot separate the two
      explanations is archived before any cell runs, so the change is recorded
      rather than made silently.
    - >-
      The composition is only as good as the two-term model it composes through,
      which is an unreviewed proposal whose own extension-field control has not
      been run. If that model is wrong, the composition is wrong and the ceiling
      survives unchanged as a statement about the instrument.
    - >-
      Elimination operation counts are deterministic and machine-independent, so a
      ratio of them is meaningful and a wall-clock claim is not made.
    - >-
      Scoped to binary curves at n at most 12 in the measured arm. The prime-field
      radicality argument of the sibling contract concerns a different encoding
      and no transfer is made in either direction.
    - >-
      NOVELTY IS NOT ADJUDICATED. The single most likely location of prior art for
      the target-independence observation was not opened by any agent under this
      task.
  dominated_by: >-
    As an ATTACK: none is mounted, so every frontier row dominates on every axis
    -- Pollard rho, multi-target rho, BSGS, van Oorschot-Wiener, the generic
    preprocessing frontier, and every index-calculus row. As a STATEMENT ABOUT
    REUSE: nothing in this corpus prices batch reuse, so nothing dominates it
    internally, but it may well be dominated by external literature no agent here
    has opened. As an INSTRUMENT RESULT: dominated by any measurement that breaks
    the ceiling, which is why breaking it is the preferred outcome. NOT NULL ON
    ANY AXIS.
  sota_delta: >-
    Zero on every ECDLP cost axis. Content delivered: a derived ceiling on batch
    reuse with its value at each chain length and exactly 1.00 for the zero-reuse
    representation; a REPLACEMENT for a pre-registered discriminator that
    arithmetic shows cannot fire, with the demonstration archived; a rank
    statistic calibrated by a planted dependency of known size; a curve-free
    control that decides whether any measured reuse is about curves; and the first
    end-to-end charged number for this lane.
  id_allocation_provenance: >-
    EXP-PFDR-726f4b pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260829-fa8235. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
