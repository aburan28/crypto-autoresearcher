experiment:
  id: EXP-LATDUAL-3771b8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-fdc8e8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-fdc8e8
  question_id: RQ-MLKEM-003
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the structured-versus-unstructured recovery discount under three techniques of increasing
    strength on one matched-pair population, with a degeneracy check, a ring-deleted null and a budget-matched
    control
  objective: 'The run reduces one uncertainty: whether the module-structure discount grows as the
    attacking technique improves, on a fixed population where the only varied factor is the technique.
    Stated as parts: (i) is the technique axis genuinely ordered, established on the unstructured
    arm by T2 beating T1, and does T3 degenerate exactly to T2 there as its construction forces, which
    together validate the ladder; (ii) what is the three-point profile D(T1), D(T2), D(T3) on the
    structured arm with paired bootstrap intervals, and what is the same profile on the ring-deleted
    null, which must be flat; (iii) does any rise in the structured profile survive the budget-matched
    control that gives the weaker technique equal compute, and does the rotation-count control show
    the effect scaling with the number of reused rotations rather than appearing at the first. The
    run is not asked how large the discount is, is not asked anything about deployed parameters, and
    is not asked to validate any relayed mechanism. A flat profile with tight intervals is a complete
    run: it measures no growth with technique quality at these parameters, which is directly usable
    against KN-OPEN-026''s Q1.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: on the tested population at
      the tested parameters, the measured discount ratio under three techniques ordered by measured
      strength on the unstructured arm had the reported profile with the stated intervals, the ring-deleted
      null''s profile was as reported, and the budget-matched and rotation-count controls behaved
      as reported. WHAT DOES NOT FOLLOW: nothing about whether the true discount grows with technique
      quality in general, since three rungs at one dimension is not a trend; no bit figure, since
      no cost model is applied; no claim that T3 realises any mechanism described in any source; nothing
      about ML-KEM, Kyber, Dilithium or any FHE parameter set; and no mechanism for any rise observed,
      only its presence and its survival of the controls.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~3h human). Freeze the three techniques, the rotation-reuse
      construction, the compute-to-blocksize conversion for the budget-matched control, the seed schedule
      and the monotonicity statistic. STAGE 1 (cost: low). Matched-triple generation per seed: structured,
      NULL A unstructured, NULL B ring-deleted, sharing s and e. STAGE 2 (cost: low). T1 runs on all
      three arms. STAGE 3 (cost: high). T2 runs on all three arms. STAGE 4 (cost: high, dominant).
      T3 runs on all three arms, costing d times T2 on the structured arm and degenerating on the
      others. STAGE 5 (cost: low). Ordering and degeneracy checks on NULL A. STAGE 6 (cost: low).
      D(T) profiles with paired bootstrap intervals for the structured arm and NULL B. STAGE 7 (cost:
      medium). Budget-matched T2 and rotation-count controls on a subsample. STAGE 8 (cost: low).
      Zero-error positive controls and emission of immutable run records through harness/runner.py.'
    instrument: Python 3.11 standard library only; numpy, fpylll and Sage are absent from this environment
      and none is used. Exact-integer primal embedding, fractions.Fraction Gram-Schmidt, an LLL implementation
      for T1, progressive BKZ with integer block enumeration for T2, and for T3 the same BKZ with
      the reduced basis carried across the instance's rotations by an explicit rotation map applied
      to the basis. Babai nearest-plane decoding and exact comparison against the retained secret
      throughout. Bootstrap in pure Python. Seeds and run records through harness/runner.py.
    parameters: q in {769, 3329}; cyclotomic degree d in {8, 16}; module rank k with n = k*d and n
      in {24, 32, 48}; m = 2n; centered binomial eta = 2; blocksize ceiling 24 for T2 and T3, raised
      to a stated value for the budget-matched T2 arm; 80 seeds per grid point; rotation-count control
      at reuse counts 1, d/2 and d on 20 seeds; nine runs per seed across three arms and three techniques.
  controls:
  - NULL A, matched unstructured arm run through all three techniques, including the forced T3-equals-T2
    degeneracy check.
  - NULL B, ring-deleted structured arm with preserved entry multiset, run through all three techniques.
  - Zero-error positive control at every rung, where recovery must succeed at the lowest blocksize
    in all arms.
  - 'Rotation-count control: run T3 with one rotation reused, which must reproduce T2, and with all
    rotations, establishing that any effect scales with rotation count rather than appearing at any
    reuse.'
  - 'Budget-matched control: give T2 a compute budget equal to T3''s rotation-multiplied cost by raising
    its blocksize ceiling, so a rising D(T3) cannot be explained by spending more compute.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls in the same invocation. NULL A, the matched unstructured
    arm, is the denominator of every D(T) and is itself run through all three techniques, which makes
    T3''s degeneracy checkable: with no rotations, T3 must reduce to T2 exactly and its success rate
    must match T2''s within interval. NULL B, the ring-deleted structured instance with entry multiset
    preserved by a seeded within-block permutation, is run through all three techniques; its D(T)
    profile must be flat at 1 across all three rungs. If NULL B shows a rising profile, the rotation
    reuse is exploiting the block layout rather than the ring and the signal profile is an artifact.
    If T3 does not degenerate to T2 on NULL A, the technique ladder is not implemented as specified
    and nothing is interpretable.'
  independent_variables:
  - technique index T in {T1, T2, T3}
  - arm (structured, matched unstructured, ring-deleted)
  - number of reused rotations at T3
  - lattice dimension n
  - cyclotomic degree d
  metrics:
    primary:
    - exact-recovery flag per (seed, arm, technique)
    - beta* per (seed, arm, technique) where defined
    - D(T) with paired bootstrap interval per technique on the structured arm
    - D(T) profile on the ring-deleted null
    secondary:
    - success-rate differences establishing the technique ordering on NULL A
    - T3-versus-T2 degeneracy statistic on NULL A
    - budget-matched T2 success rate
    - rotation-count contrast
    - wall clock per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The three-point profile (D(T1), D(T2), D(T3)) on the structured arm with paired bootstrap
      intervals, the same profile on NULL B, and the monotonicity statistic D(T3) - D(T2) with its
      interval, reported beside the budget-matched T2 success rate.
    formula: 'For technique T and seed i, where beta* is defined (T2, T3), D_i(T) = beta*_i(T, unstructured)/beta*_i(T,
      structured). Where it is not (T1), D_i(T1) is the paired odds ratio [p_struct/(1-p_struct)]
      / [p_unstruct/(1-p_unstruct)] with a Haldane-Anscombe 0.5 correction; the entry states that
      T1''s D is on a different scale from T2''s and T3''s, compares only within scale, and uses the
      normalised increment [D(T3)-D(T2)]/D(T2) as the cross-scale-free monotonicity statistic. Predicted
      flat profile: D(T3) - D(T2) within interval of zero. Predicted rising profile: D(T3) - D(T2)
      exceeding 0.1 with interval excluding zero AND the budget-matched T2 arm failing to reproduce
      it.'
    source: Pre-registered in the parent proposal IDEA-20260816-fdc8e8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at n in {24, 32, 48}, d in {8, 16}, q in {769, 3329}, blocksize ceiling
      at most 24, in pure Python with neither numpy nor fpylll available. Toy parameters are forced
      by two requirements simultaneously: exact recovery against retained ground truth, and a d-fold
      cost multiplier on the T3 rung. The transfer assumption is stated as none. A monotone profile
      over three rungs at n = 32 is not evidence that the discount grows with technique quality at
      deployed parameters, is not converted into bits, and is not projected onto ML-KEM or any FHE
      parameter set.'
    correspondence: null
  tail_checks:
  - The T1 rung, where success rates may be near zero in both arms and the odds ratio becomes unstable;
    the correction and the resulting interval width are reported.
  - The T3 rung at d = 16, where per-instance cost is sixteenfold and censoring may dominate.
  - Seeds where the structured arm succeeds at rotation index zero, contributing nothing to the amortisation
    story, counted separately.
  - The budget-matched T2 arm at its raised ceiling, where a success-rate match with T3 would explain
    the profile by compute.
  - Pairs where NULL B outperforms the structured arm, examined individually as potential generator
    defects.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - Stop at 80 seeds per grid point or 12 wall-clock hours, reporting achieved counts and intervals.
  - Halt and report an implementation defect if T3 does not degenerate to T2 on NULL A within interval.
  - Decline the monotonicity verdict and report only the profile if any D(T) interval width exceeds
    0.3.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three rungs produce a D(T) with a paired bootstrap interval of width at most
    0.3 on the structured arm, NULL A shows T3 degenerating to T2 within interval, and NULL B's profile
    is flat within interval, whatever the structured profile's shape turns out to be.
  falsification_criterion:
  - 'T3 does not degenerate to T2 on the unstructured arm: the ladder is misimplemented and no profile
    is interpretable.'
  - 'NULL B shows a rising profile: the effect tracks block layout and the signal profile is an artifact.'
  - 'The budget-matched T2 arm matches T3''s structured success rate: the rise is compute, not amortisation.'
  - 'The technique ordering fails on NULL A: there is no ordered axis and the design''s premise is
    void.'
  - 'The structured profile is flat within tight intervals: no growth with technique quality at these
    parameters, which is the reported obstruction.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-fdc8e8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - A Coordinator must fix whether T1's odds-ratio D and T2/T3's blocksize D may appear in one profile
    at all, or whether the contract should run a three-rung ladder entirely inside the blocksize scale.
  - The rotation-reuse rung T3 is this program's own construction and its relationship to the mechanism
    KN-OPEN-026 relays is not derived; it must not be described at review as an implementation of
    that mechanism.
  - The budget-matched control's compute-to-blocksize conversion is stated as equal compute but the
    conversion is not derived, and it decides whether a rise is attributable.
  - Whether a three-point monotonicity statistic supports any verdict is a claim-tier decision under
    docs/claims-and-verification.md.
