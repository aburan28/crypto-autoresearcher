experiment:
  id: EXP-CANL-8687b3
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-6533fd
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE HEIGHT-BUDGET EXPONENT IDENTITY FOR ANY LIFT-BASED ATTACK: covering E(F_p) by reductions
    of global points of canonical height <= B forces B = Theta(N^{2/r}), and since the coordinate
    bit-size of a point of height B is Theta(B), the REPRESENTATION COST ALONE of one usable lift
    is N^{2/r} -- so every lift attack at arity r <= 4 is dominated by rho before any search happens,
    and the meet-in-the-middle version loses to rho by exactly N^{1/r}'
  status: draft
  objective: "(A) THE IDENTITY. Let Ẽ be any global model (the Serre-Tate canonical lift or a Xedni-constructed\
    \ curve) with Mordell-Weil rank r and regulator Reg, reducing to E/F_p with |G| = N. Standard\
    \ lattice-point counting for the positive definite quadratic form hhat gives\n    |{P~ : hhat(P~)\
    \ <= B}| = V_r B^{r/2} Reg^{-1/2} (1 + o(1)).\nFor the reductions to cover a constant fraction\
    \ of G,\n    B >= (N sqrt(Reg) / V_r)^{2/r} = Theta(N^{2/r}).\nAnd by the standard comparison\
    \ |hhat(P) - (1/2) h_x(P)| = O(log|Delta|), a point of canonical height B has x-coordinate of\
    \ bit-size Theta(B) + O(log|Delta|). THEREFORE THE BIT-SIZE OF ONE USABLE LIFTED POINT IS Theta(N^{2/r}).\
    \ This is a size bound, not a search bound: it holds even for an adversary who is GIVEN the right\
    \ point for free.\n(B) THE EXPONENT CONSEQUENCE, WHICH IS THE POINT OF THE RECORD.\n    r = 2\
    \ : N^{1.000}   r = 3 : N^{0.667}   r = 4 : N^{0.500}\n    r = 5 : N^{0.400}   r = 8 : N^{0.250}\
    \   r = 9 : N^{0.222}\nAgainst rho at 0.886 N^{1/2} group operations: AT ARITY r <= 4, MERELY\
    \ WRITING DOWN ONE USABLE LIFT COSTS AT LEAST AS MUCH AS RUNNING THE ENTIRE ATTACK. The internal\
    \ reconstruction of the JKSST analysis (ECFG-P1543-R1) records its scope as \"fixed arity 2 <=\
    \ r <= 9\", so HALF THE CLASSICAL SCOPE LIES IN THE DEAD ZONE FOR A REASON THAT HAS NOTHING TO\
    \ DO WITH THE COEFFICIENT BOUND -- it is pure representation size. That is a new decomposition\
    \ of the classical failure and it identifies r = 4 as the exact threshold.\n(C) WHAT REMAINS ABOVE\
    \ THE THRESHOLD, STATED HONESTLY. For r >= 5 the size obstruction disappears. What remains is\
    \ the SEARCH obstruction: given a prescribed target Q in G, find a global point reducing to it.\
    \ This record prices the only generic strategy available, meet-in-the-middle: precompute reductions\
    \ of sums sum a_i G_i over a box A with |A| = M, and of Q - sum b_i G_i over a box of the same\
    \ size; a collision gives the discrete log. To get a collision one needs M = Theta(sqrt(N)), and\
    \ a lattice point in a box of M elements has height Theta(M^{2/r}) = N^{1/r}, hence bit-size N^{1/r}.\
    \ Total work:\n    T_MITM = Theta(N^{1/2} * N^{1/r}) = Theta(N^{1/2 + 1/r}),\nmemory Theta(N^{1/2}\
    \ * N^{1/r}) bits. DOMINATED BY RHO BY EXACTLY N^{1/r}, ON TIME, AND BY N^{1/2+1/r} ON MEMORY.\
    \ The loss is precisely the coordinate size, and it does not vanish at any rank: as r grows the\
    \ loss shrinks toward N^{0} but never turns into a gain, because at r = infinity the method degenerates\
    \ into BSGS.\n(D) WHERE CM ENTERS, AND WHERE IT DOES NOT. CM changes r into 2 r_O (IDEA-20260807-fd5a24),\
    \ so an O-rank of 3 already gives r = 6 > 4 and clears the size threshold. THAT IS THE ONE PLACE\
    \ IN THIS LANE WHERE THE O-MODULE STRUCTURE COULD HAVE MATTERED AT THE LEVEL OF AN EXPONENT, and\
    \ it is why this record exists rather than being folded into fd5a24. But the Z-rank 2r_O is a\
    \ rank of a lattice whose second half is longer by sqrt(|D_E|)/2 (fd5a24 Lemma 1+2), so the COUNTING\
    \ that produces B ~ N^{2/r} must use the effective rank inside the ball of radius sqrt(B), which\
    \ is r_O and not 2 r_O whenever B < (|D_E|/4) hhat_min. Substituting: the effective exponent is\
    \ 2/r_O = 4/r_Z, i.e. TWICE AS BAD as the naive reading, and the threshold moves from r_Z > 4\
    \ to r_Z > 8. CM therefore makes this identity WORSE by a factor 2 in the exponent, and the record's\
    \ central number is that factor.\n(E) THE TWO OUTCOMES. OUTCOME 1: the measured covering exponent\
    \ matches 2/r_eff with r_eff = r_O in the CM arm and r in the non-CM arm. The identity is validated,\
    \ the r = 4 (non-CM) / r_Z = 8 (CM) thresholds are established, and the lane's cost model is settled.\
    \ OUTCOME 2: the measured covering exponent is materially smaller than 2/r_eff -- i.e. reductions\
    \ cover G faster than the lattice count predicts. That would mean the reduction map is far from\
    \ injective on low-height points in a structured way, which is a genuine phenomenon worth chasing\
    \ and would move the threshold. Both are deliverables and neither is vacuous."
  resource_label: 'R6 (lift to characteristic zero: the object whose representation is being costed)
    with R3 entering only in part (D), where the CM order determines the effective rank inside the
    search ball.'
  admissibility: admissible
  admissibility_argument: 'The identity is about the SIZE of characteristic-zero objects and the counting
    of lattice points; it makes no oracle call and applies no endomorphism to a point of G. The meet-in-the-middle
    in part (C) does use group operations on G, and if it were ONLY that it would be a generic algorithm
    closed at exponent 1/2 by Shoup and KN-FIND-b7e091 -- which is exactly what the analysis finds,
    with the additional N^{1/r} penalty for carrying global coordinates. The record''s admissibility
    is therefore honest in a specific way: the non-generic resource (the lift) is present, it is charged,
    and it is found to COST rather than to buy. Recording a non-generic resource that makes an algorithm
    worse is a legitimate and underused deliverable.'
  reachability_gate: 'T5 EVALUATED, AND THIS RECORD IS PARTLY A GATE ITSELF. Moving from E/F_p to
    a global model costs p^{1+o(1)} for the canonical lift (IDEA-20260807-ee6ef7) and O(polylog p)
    for a Xedni-constructed curve -- so on the CONSTRUCTION axis the Xedni route is reachable and
    the canonical route is not, except in the h(D_E) = O(1) class. This record''s identity applies
    to both. The object it would want to reach -- a global model of rank r > 4 with small regulator
    reducing to the given E -- is NOT reachable by any move priced here: within the canonical route
    the lift is a function of E (no choice at all), and within the Xedni route imposing rank is exactly
    the Mestre cost JKSST charge as prohibitive. Goodness (large r) is detectable only by a point
    search of cost B^{r/2}, which is the same search the attack needs, so detection is not cheaper
    than exploitation and the T5 dichotomy resolves negatively on both branches.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write the three lemmas and the two independent derivations
      (direct count and index-N sublattice) and check they agree. STAGE 1 (hours, HARD GATE): rank-1
      closed-form fixture; exact integer match required. STAGE 2 (hours): measure beta on >= 8 curves
      spanning exhibited ranks 1..4, both CM (h(D_E)=1) and non-CM, at 3 primes each. STAGE 3 (hours):
      the CM knee hunt on curves where B_knee is inside range; if no such curve is reachable, RECORD
      THAT THE ARM WAS NOT TESTABLE rather than reporting a null result. STAGE 4 (hours): synthetic
      skew-lattice nearby-object control. STAGE 5 (hours): small MITM with measured bytes per entry.
      STAGE 6 (zero compute): charge both exponents against rho and BSGS.'
    mechanism: 'STEP 1 -- DERIVE THE IDENTITY CLEANLY (zero compute). Combine (i) the lattice-point
      asymptotic, (ii) the naive-versus-canonical height comparison with its O(log|Delta|) constant,
      and (iii) the saturation condition |Im_B| = Theta(N). Record each as a separate lemma with its
      own responsibility, so a failure localises. STEP 2 -- MEASURE beta DIRECTLY. On toy curves over
      Q of known exhibited rank (both CM with h(D_E) = 1 and non-CM), enumerate all points with x
      = u/w^2, |u| <= U, w <= W; compute hhat numerically; bin by B; reduce mod p; count distinct
      images. Fit log|Im_B| against log B and report the local slope, not a single global fit. STEP
      3 -- HUNT THE CM KNEE. On the CM arm, compute the predicted knee location (|D_E|/4) hhat_min
      and check whether the measured slope steps from r_O/2 to r_Z/2 there. THIS IS THE ONE MEASUREMENT
      THAT DIRECTLY TESTS PART (D) and it can fail cleanly: no knee means the effective-rank correction
      is wrong and the threshold is r_Z > 4 after all, which would be a modest improvement in the
      attacker''s direction and must be reported as such. STEP 4 -- IMPLEMENT AND MEASURE THE MITM,
      SMALL. At toy N, build the two tables of part (C) with M well below sqrt(N), measure actual
      bit-costs of the stored global coordinates, and confirm the N^{1/r} penalty appears as a measured
      bytes-per-entry growth. Extrapolate, do not claim. STEP 5 -- CHARGE EVERYTHING against 0.886
      sqrt(N) and against BSGS, in the full-cost model (bits, not group elements), and report both
      exponents.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Random lattice null of matched rank and regulator (expected to match).
  - Rank-1 closed-form positive control.
  - Skew-lattice nearby-object control.
  - Torsion and twist exclusion.
  - Rho and BSGS baselines in the bit-cost model.
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL OBJECT: a RANDOM rank-r lattice
    with the same regulator and a random surjection onto Z/N replacing the genuine (Mordell-Weil lattice,
    reduction map) pair -- i.e. an object of exactly the same shape whose arithmetic content is empty.
    The null must reproduce beta = r/2 exactly; if it does, beta measures lattice shape and NOT arithmetic,
    and no arithmetic conclusion may be drawn from beta alone. THIS NULL IS EXPECTED TO MATCH, and
    that expectation is recorded here so that a match is a confirmed control rather than a disappointment;
    the arithmetic content of the record is then confined to the CM knee, which the null cannot produce.
    DECAY PARAMETER: N. The covering fraction |Im_B|/N at FIXED B must decay with slope -1 against
    N. A covering fraction that fails to decay as N grows is the canonical artifact tell and indicates
    the enumeration is finding torsion or twist-related images. POSITIVE CONTROL: a planted rank-1
    case where all reductions are multiples of one known generator, so |Im_B| is exactly computable
    in closed form; the instrument must match it exactly.'
  independent_variables: []
  metrics:
    primary:
    - '|Im_B| and |{hhat <= B}| per (curve, p, B)'
    - Local slope beta with interval, per curve
    - Empirical max |hhat - h_x/2| per curve
    - B_knee predicted and measured, or "not testable"
    secondary:
    - Bytes per MITM entry against M
    - Full-cost exponents with intervals
  heuristic_under_test: null
  preregistered_prediction:
    quantity: covering exponent beta = local slope of log|Im_B| against log B, on non-CM curves of
      exhibited rank r
    formula: Predicted r/2 with a fit interval excluding r/2 +- 0.4. Measured on at least 4 ranks
      so the linear-in-r prediction is tested rather than a single point.
    source: pre-registered in IDEA-20260807-6533fd before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Search-bound bias. Enumerating x = u/w^2 with |u| <= U, w <= W samples a naive-height box, not
    a canonical-height ball; the two differ by O(log|Delta|) and by the shape of the box. Both arms
    use the identical box, and the empirical |hhat - h_x/2| is reported so the distortion is visible.
  - Small B. Every reachable B is small; the asymptotic's error term O(B^{(r-1)/2}) is a constant
    fraction of the main term at these sizes. Only slopes and CM/null ratios are interpreted.
  - Regulator estimation. Reg is computed from exhibited generators, which may generate a finite-index
    sublattice; that inflates Reg by the index squared and shifts beta's intercept but not its slope.
    Slopes only.
  - Torsion images. Torsion reduces to a fixed O(1) set present at every B; it must be subtracted
    or |Im_B| has a spurious constant.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Predicted r/2 with a fit interval excluding r/2 +- 0.4. Measured on at least
    4 ranks so the linear-in-r prediction is tested rather than a single point.
  falsification_criterion:
  - The rank-1 closed-form fixture does not reproduce exactly. Instrument failure; nothing reported.
  - beta does not track r/2 across ranks. The lattice count is inapplicable at reachable B and the
    identity is unvalidated (not refuted) -- the record must say which.
  - No CM knee where one is predicted and reachable. Part (D) is false; the CM effective-rank halving
    is withdrawn and the threshold returns to r_Z > 4.
  - The injectivity ratio collapses well before the birthday point. Outcome 2; the lane reopens with
    a concrete new object (structured non-injectivity of reduction on low-height points).
  - The random-lattice null reproduces the CM knee. The knee is a lattice artifact and the record
    has no arithmetic content; that must be reported as the finding.
  - The covering fraction fails to decay with N. Artifact tell; no exponent may be reported.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
