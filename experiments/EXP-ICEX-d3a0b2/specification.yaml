experiment:
  id: EXP-ICEX-d3a0b2
  hypothesis_id: H-ICEX-c273c2
  derived_from_idea: IDEA-20260830-21e7c4
  question_id: RQ-RELN-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact enumeration against a sumset-free sampled estimator for the decomposition probability -
    both estimators run on the SAME bases, the SAME target draws and the SAME machine under one
    frozen operation-count definition, with the cost crossover in B, the memory crossover in N,
    the measured variance ratio, two opposite-direction calibration geometries, a same-construction
    null object, and a curve-free subset arm that carries the scope of every law reported
  objective: >-
    Reduce three coupled uncertainties with one instance set. (i) WHERE the cost crossover between
    the two estimators actually falls, measured in charged operations on identical instances,
    rather than inferred from two cost models written in different places. (ii) WHAT the
    statistical efficiency ratio between them actually is, measured as the empirical variance of
    the estimated construction mean over many bases, rather than assumed from an occupancy model.
    (iii) WHICH construction comparisons are decidable at a stated budget and which are not,
    emitted as a per-cell table whose UNDECIDABLE entries are as load-bearing as its DECIDABLE
    ones.
    THE COMPARABILITY DISCIPLINE IS THE POINT. Every cost number in this run is produced by
    running BOTH estimators on the SAME base, the SAME declared target support and the SAME target
    draws, on one named machine, under a single frozen definition of a charged operation. No cost
    is compared against a figure from another paper, another session or another machine, and no
    asymptotic constant is taken from a citation as a substitute for a measurement.
  what_this_is_not:
    - >-
      Not an attack and not an algorithm. Exact enumeration builds the whole sumset and is
      affordable only at toy scale; it is not something an adversary could run.
    - >-
      Not a measurement of the cost of FINDING a decomposition, and not a statement about solve
      cost or relation rank. Yield says nothing about either and this contract inherits that limit
      unchanged.
    - >-
      Not a correctness check of the enumerator. This run measures cost and precision; a
      certificate suite for the enumerator is a PREREQUISITE, and its absence is a stopping
      condition, not a caveat.
    - >-
      Not an amendment of any committed protocol. Freezing a protocol or mandating a metadata block
      is a separate Coordinator decision; nothing here performs one.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      approved_by is null.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the declared cells, on the named machine, under the frozen
      operation-count definition, the measured cost crossover in B is at X, the memory crossover
      in N is at Y under the declared budget, the measured efficiency ratio is Z, and the
      equivalence bound at n bases is W - so that a coverage-ratio difference larger than W between
      two named constructions would have been detected at that cell and one smaller than W would
      not. WHAT DOES NOT FOLLOW: nothing above the memory crossover, nothing about solve cost or
      relation rank, no exponent, nothing at cryptographic scale, and - since the curve-free arm
      carries the same laws - nothing specific to elliptic-curve factor bases.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking, HARD GATE). Write out the exact identity, the two cost
      models and the variance ratio, and verify the crossover condition symbolically. Freeze and
      hash: the definition of a charged operation and the conversion between a group addition and
      a hash probe; the cell list; the declared target support at every cell together with the
      requirement to report the coset-count vector; the ladders in target count and in base count;
      the machine description; the memory budget; and the acceptance bands. Re-read the committed
      harness functions and record what they actually compute. CONFIRM that the enumerator
      certificate suite exists and has passed; if it has not, STOP - an exhaustive enumeration with
      a bug gives a confidently wrong integer and removing sampling noise removes the only thing
      that was visibly noisy.
      STAGE 1 (minutes, reproduction gate, blocking). At each committed cell compute the exact
      value and check it lies inside the archived sampled estimator's interval. Raise the target
      count through the declared ladder at one cell and check convergence to the exact value at
      the square-root rate.
      STAGE 2 (the cost measurement). Implement the sumset-free meet-in-the-middle sampled
      estimator. For every cell of the B ladder at each arity and each group order, run BOTH
      estimators ON THE SAME BASE AND THE SAME TARGET DRAWS, recording charged operations, wall
      time and peak resident set for each. Locate the cost crossover from the OPERATION COUNTS and
      report the timing as a consistency check. Locate the memory crossover by bisection.
      STAGE 3 (the precision measurement). At each precision cell draw at least 200 independent
      random bases; compute the exact coverage of each AND the sampled estimate of each at the
      declared target count. Report the empirical variance of both estimated construction means and
      their ratio against the prediction. Repeat across the base-count ladder to check the
      square-root scaling of the equivalence bound.
      STAGE 4 (calibration and nulls). Run the two derived reference geometries and a matched
      random base at every cell. Run the same-construction null object - two independently seeded
      random bases of the same size compared against each other. Run the CURVE-FREE arm at every
      cell.
      STAGE 5 (zero compute). Emit the decidability table: per cell, the crossover verdict, the
      memory verdict, the equivalence bound at three budgets, the DECIDABLE or UNDECIDABLE label
      with its justifying number, and the mandatory metadata block - declared support, denominator
      group, sign convention, arity, coset-count vector.
    instrument: >-
      Pure Python integer arithmetic under experiments/EXP-ICEX-d3a0b2/driver/. The committed
      enumerators are invoked UNMODIFIED for the incumbent arm. Charged operations are counted by
      an explicit counter under the frozen definition; wall time and peak resident set are recorded
      separately and never substituted for the operation count. Recorded through harness/runner.py.
    parameters: >-
      THE INSTANCE SET IS FIXED IN STAGE 0 AND BOTH ESTIMATORS RUN ON EVERY INSTANCE IN IT. Cost
      ladder: B spanning at least a factor of 128 at arities two and three, at four group orders
      spanning at least a factor of 64. Precision ladder: at least 200 bases per cell at three base
      sizes and three group orders, with the base-count ladder spanning at least a factor of 8.
      Target-count ladder spanning at least a factor of 64 for the convergence check. THE MACHINE
      IS NAMED AND PINNED and appears on every row.
  controls:
    - >-
      CURVE-FREE NULL OBJECT, MANDATORY AND BLOCKING (standing scope constraint from the
      pfdr-battery lane): a uniformly drawn subset of the integers modulo N of the same
      cardinality, with no elliptic curve, no coordinate map and no sign convention beyond
      negation in the group. Every law this run reports - the crossover, the variance ratio, the
      equivalence bound - is defined for it. If it reproduces them, the run's supported statements
      are about subsets of finite abelian groups and MAY NOT be restated as statements about
      elliptic-curve factor bases or the ECDLP.
    - >-
      REPRODUCTION GATE, blocking: the exact value must sit inside the archived sampled interval at
      every committed cell before any new claim is made. This control can fail and would indicate a
      bias in one estimator.
    - >-
      POSITIVE CONTROL, CONCENTRATED GEOMETRY, MUST FIRE: the small-multiples base, whose committed
      coverage ratio is far below random. A protocol that cannot separate it from random has no
      power and no negative from it is admissible.
    - >-
      POSITIVE CONTROL, OPPOSITE DIRECTION, MUST FIRE: the Sidon-type base, whose committed ratio is
      slightly above random. Two controls firing in opposite directions bound the instrument on both
      sides where a single null does not.
    - >-
      SAME-CONSTRUCTION NULL OBJECT: two independently seeded random bases of the same size compared
      against each other. The equivalence test must return "indistinguishable within the bound" and
      the bound must be reported. If two draws of the same construction are declared different, the
      false-positive rate is wrong and the table is void.
    - >-
      TARGET-COUNT LADDER CONTROL: square-root convergence of the sampled estimator to the exact
      value, which is the check that the two estimators target the same quantity at all.
    - >-
      SUPPORT DECLARATION CONTROL: every cell records the declared target support explicitly and the
      coset-count vector of the sumset against it, because the scalar rate is not identifying
      without them.
    - >-
      ORDERING CONTROL, blocking: the cost models, the predicted crossover and the predicted
      variance ratio are written to the run directory and hashed before Stage 2 executes, and every
      output is compared against that committed file.
  independent_variables:
    - estimator - exact enumeration versus sumset-free meet-in-the-middle sampling
    - base size B, across the cost ladder
    - group order N, across four values
    - arity m, two and three
    - number of sampled targets T, across the convergence ladder
    - number of bases n, across the precision ladder
    - geometry - matched random, concentrated, Sidon-type, curve-free subset
  metrics:
    primary:
      - >-
        exact_pair(cell) = (size of the m-fold sumset intersected with the declared support, size of
        the declared support), reported AS TWO INTEGERS. The rate is a derived quantity; reporting
        only the rate is prohibited, because the pair is what makes the number recomputable and
        comparable across constructions.
      - >-
        sampled_pair(cell) = (hit count, target count), reported as two integers with the binomial
        standard error derived from them, never as a bare rate.
      - >-
        charged_operations(cell, estimator): the exact integer count of charged operations under the
        frozen definition, per estimator, on the SAME base and SAME target draw. THE PRIMARY COST
        METRIC. Reported per repeat.
      - >-
        cost_crossover_B(arity, N): the base size at which the two operation counts cross,
        interpolated on the ladder, dimensionless. Read off the operation counts, never off the
        timings.
      - >-
        memory_crossover_N(arity, budget): the largest group order at which the exact sumset fits
        within the declared memory budget on the named machine, located by bisection, with the
        budget and machine stated on the row.
      - >-
        coverage(base, cell): the exact coverage of each individual base, archived as the FULL
        DISTRIBUTION over the at-least-200 bases per cell. The mean alone is not a legitimate
        summary here: the conservation identity fixes the first moment for every base, so the
        comparison lives entirely in the second moment and the mean carries no construction
        information.
      - >-
        efficiency_ratio(cell) = empirical variance of the estimated construction mean under
        sampling divided by the same under exact enumeration, dimensionless, with a bootstrap
        interval, against the predicted 1 + N/T.
      - >-
        equivalence_bound(cell, n): the smallest relative coverage difference excludable at the
        declared confidence with n bases per construction, dimensionless, reported at every n on the
        ladder together with the fitted scaling exponent against the predicted minus one half.
      - >-
        standardized_gap(cell) = (exact rate minus sampled rate) divided by the sampled estimator's
        own standard error, dimensionless, per curve-cell, with the fraction of cells beyond two
        standard errors and the correlation of the gap with the index of the declared support in
        the full group.
    secondary:
      - >-
        wall-clock seconds and peak resident set per cell per estimator on the named machine,
        reported as a distribution over repeats and used ONLY as a consistency check on the
        operation counts.
      - >-
        the fitted exponents from a log-log regression of charged operations against B, per
        estimator, against the predicted m and ceil(m/2).
      - >-
        the coset-count vector of the sumset against the declared support, per cell.
      - >-
        the calibration ratios for the two reference geometries against their committed values.
      - >-
        the same-construction null object's verdict and the bound it was measured at.
      - >-
        the curve-free arm's crossover, efficiency ratio and equivalence bound at every cell.
      - >-
        the Stage 0 committed prediction file and its hash, and the Stage 1 convergence ladder.
      - >-
        the enumerator certificate suite's status, recorded as a precondition outcome.
  heuristic_under_test: HEUR-EXA-1
  preregistered_prediction:
    quantity: >-
      cost_crossover_B; efficiency_ratio; the scaling exponent of equivalence_bound against n;
      standardized_gap; the two calibration ratios; and the curve-free arm's values for all of them.
    formula: >-
      cost_crossover_B is at B such that B^{floor(m/2)} equals the declared target count, so at
      arity three the crossover is at B equal to the target count, and exact enumeration is cheaper
      at every cell of the committed ladder. efficiency_ratio is 1 + N/T at each cell.
      equivalence_bound scales as n to the power minus one half. standardized_gap is standard normal
      with mean zero, with at most the declared small fraction beyond two standard errors. The two
      calibration geometries reproduce their committed ratios to their printed precision. The
      curve-free arm reproduces all of the above within the declared tolerance.
      THE COMMITTED NUMERIC VALUES ARE WRITTEN INTO THE RUN DIRECTORY AND HASHED IN STAGE 0, from
      the frozen cell list and the stated closed forms. They are DERIVATIONS from those closed
      forms, never measurements, and none is transcribed into this contract from any prior run.
    source: >-
      The identity, the two cost models, the crossover condition, the variance ratio and the
      decidability table are derived in IDEA-20260830-21e7c4, read in full by TASK-20260904-8f2f95
      on 2026-09-04. The committed calibration ratios it quotes come from a knowledge finding this
      session did NOT open; Stage 0 re-reads that finding and the run compares against what it
      actually says. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The group orders are chosen so that the exact sumset fits in the declared budget at the lower
      cells and does NOT fit at the upper ones - the ladder must cross its own memory boundary, or
      the no-go half of the deliverable is unsupported. THE TESTED SCALE IS THE CLAIMED SCALE. The
      efficiency gain grows with N, which flatters the recommendation exactly where the
      recommendation stops applying, so the table reports the gain and its availability in the same
      row and quoting the gain above the memory crossover is forbidden.
    correspondence: null
  tail_checks:
    - >-
      Report the most extreme standardized gap across all cells with its cell, since a small average
      gap can hide one badly biased cell.
    - >-
      Report the empirical coverage variance at arity two separately from arity three: the
      negation-forced dependence is largest at arity two and the occupancy model should fail FIRST
      there. Excess at arity two with agreement at arity three localises the failure to a named
      mechanism and is a more useful outcome than uniform agreement.
    - >-
      Report the maximum and minimum coverage observed per cell against the occupancy upper tail, not
      only the variance.
    - >-
      Report the slowest cell's operation count against the fitted cost model, and locate the memory
      crossover by bisection rather than by extrapolating the fit.
    - >-
      Refuse any efficiency ratio computed from fewer than 100 bases and report the shortfall rather
      than a ratio.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 16
  stopping_rules:
    - >-
      STOP AT STAGE 0 if the enumerator certificate suite has not passed. A protocol that mandates
      exact enumeration without mandating the certificate is worse than the one it replaces.
    - >-
      HALT before Stage 2 if the reproduction gate fails - the exact value outside the archived
      sampled interval at a substantial fraction of committed cells. Report the gap and its
      correlation with the support index; publish no table.
    - >-
      HALT and republish the cost model if the fitted exponents differ from the predicted ones
      beyond the declared tolerance. The crossover is then restated from the MEASURED exponents.
    - >-
      Extend the group-order ladder until at least one cell is sampled-only. A table that never
      reaches its memory boundary has not probed it.
    - >-
      Drop the largest group-order cells rather than swapping them for cheaper ones if the memory
      budget binds; a dropped cell is recorded as dropped.
    - >-
      Stop at maximum_runs, total_cpu_hours or the memory budget, whichever binds first. Budget
      exhaustion is a stop, never a negative result.
  invalidation_rules:
    - >-
      A timeout, out-of-memory kill, crash or dependency failure makes that cell
      failed_infrastructure and is NEVER negative mathematical evidence.
    - >-
      A run in which the two estimators were NOT run on the same base and the same target draws at a
      cell is invalid_measurement for that cell; the comparison would then carry a between-arm
      confound the design exists to eliminate.
    - >-
      A run that reads the cost crossover off wall-clock timings rather than off charged operation
      counts is invalid_measurement; at these sizes timings are interpreter-bound.
    - >-
      A run reporting a rate without its underlying integer pair, or without the declared target
      support and the coset-count vector, is invalid_measurement.
    - >-
      A run reporting an efficiency ratio or an equivalence bound without the full per-base coverage
      distribution archived is invalid_measurement.
    - >-
      A run that changes the charged-operation definition, the cell list or the acceptance bands
      after any measurement is invalid_measurement.
    - >-
      A run reporting any law without the curve-free arm's value at the same cell is
      invalid_measurement.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold: (1) the enumerator
    certificate suite passed before Stage 1; (2) the reproduction gate passes at every committed
    cell, or its failures are reported with their correlation to the support index and no table is
    published; (3) both estimators ran on the same base and target draws at every cost cell, with
    charged operations recorded for each; (4) the cost crossover is located from operation counts
    and the memory crossover by bisection, both with the machine and budget stated; (5) at least 200
    bases per precision cell with the full coverage distribution archived; (6) the efficiency ratio
    is reported with a bootstrap interval against its prediction; (7) the equivalence bound is
    reported at every n on the ladder with its fitted scaling exponent; (8) both calibration
    geometries reproduce their committed ratios and the same-construction null returns
    indistinguishable with its bound stated; (9) at least one cell is marked sampled-only;
    (10) the curve-free arm is reported at every cell.
  falsification_criterion:
    - >-
      The measured cost crossover is far from the prediction. The cost model is REFUTED; the
      crossover is republished from the measured exponents and the headline reduces to the precision
      argument.
    - >-
      The efficiency ratio is near 1. The assumed base-to-base variance is REFUTED; construction
      comparisons are base-limited rather than target-limited and the budget recommendation inverts.
    - >-
      A systematic exact-versus-sampled gap uncorrelated with the support index. An unnamed bias
      exists in one estimator; the battery halts and publishes the gap rather than a table.
    - >-
      The equivalence bound does not scale as one over the square root of the base count. Base draws
      are correlated; every bound must be recomputed upward with the measured correlation.
    - >-
      Either calibration control fails to reproduce its committed value. The instrument cannot see a
      known effect; no decidability verdict is admissible.
    - >-
      The same-construction null object is declared different. The false-positive rate is
      mis-specified and the table is void.
    - >-
      The curve-free arm's crossover or variance law differs from the curve arms' beyond tolerance.
      The laws are not generic to finite abelian groups; that is a finding in its own right and
      changes what the table may be quoted for.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment and the NAMED machine
    - the Stage 0 committed prediction file with its hash, written before Stage 2
    - the enumerator certificate suite's status as a recorded precondition outcome
    - raw-result.json with the exact integer pair and the sampled integer pair at every cell, plus the declared support and the coset-count vector
    - charged operation counts for BOTH estimators at every cost cell, on the same base and target draw, per repeat
    - the full per-base coverage distribution at every precision cell, archived as raw values
    - the cost crossover and its interpolation, and the memory crossover with its bisection trace, budget and machine
    - the efficiency ratio with bootstrap intervals, and the equivalence bound at every base count with its fitted scaling exponent
    - the target-count convergence ladder at the declared cell
    - the two calibration geometries' ratios against their committed values, and the same-construction null verdict with its bound
    - the curve-free arm's complete results at every cell
    - wall-clock seconds and peak resident set per cell per estimator, labelled as consistency checks
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. status is draft, frozen is false,
      execution_authorized is false, approved_by is null.
    - >-
      Approval must confirm that the enumerator certificate suite exists and has passed. Without it
      this contract replaces visible noise with an invisible confident error, which is worse than
      the instrument it improves on.
    - >-
      Approval must confirm the charged-operation definition and the group-addition-to-hash-probe
      conversion. The crossover's location depends on it, and choosing it after seeing the counts
      would make the crossover unfalsifiable.
    - >-
      Approval should confirm the group-order ladder reaches beyond the memory crossover. A table
      that never marks a cell sampled-only has not delivered the no-go half of its deliverable.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260830-21e7c4
    authored_at: '2026-09-04'
    note: >-
      The identity, the two cost models, the crossover condition, the variance ratio, the
      decidability table, the seven controls and the seven falsification conditions are taken from
      the parent proposal and restated as measured quantities with units and decision rules. Added
      by this contract: the requirement that both estimators run on the SAME base and target draws
      at every cost cell on one named machine, the frozen charged-operation definition, the
      prohibition on reading the crossover off timings, the requirement that rates be reported as
      integer pairs and coverage as a full distribution rather than a mean, and the CURVE-FREE
      subset arm required by the standing scope constraint. No numeric value from any prior run is
      transcribed here; the committed prediction file is derived in Stage 0.
  derivation_gaps:
    - >-
      The construction-specific verdict for the two literature factor-base families cannot be
      produced: their definitions were not obtained by the parent proposal and are not obtained
      here. The table is therefore delivered construction-agnostic, parameterised by the cell, and
      the construction-specific verdict is explicitly blocked on a literature fixture.
    - >-
      Base-to-base variance is not constant across geometries, so the predicted efficiency ratio is
      the RANDOM arm's and must be recomputed per geometry. The table reports it per geometry rather
      than quoting one number.
    - >-
      The calibration ratios are quoted from a committed finding this session did not open. Stage 0
      re-reads it; if what it says differs from the parent proposal's transcription, the
      transcription is corrected by a new record and the calibration thresholds are restated.
    - >-
      "The existing instrument is wasteful" is cheap to produce and reads as rigour. The
      same-construction null object, the reproduction gate and the hashed pre-registered crossover
      exist so that "sampling was fine" is a reachable, publishable outcome of this run.
