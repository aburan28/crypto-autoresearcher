experiment:
  id: EXP-MLDSA-8c8fa2
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLDSA-2ae88d
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  batch_id: null
  title: >-
    Putting a number under FIPS 204's "a small number of signatures": the
    hint-channel capacity floor for t0 at ML-DSA-44/65/87, the graded
    resampled-t0 null the goal's next_action requires, and a reduced-cell
    positive control that must recover t0 or the negative cannot be reported

  objective: >-
    Replace the unquantified assertion in FIPS 204 Section 6.1 -- that the
    low-order bits of t "can be reconstructed from a small number of signatures
    and, therefore, need not be regarded as secret" -- with derived quantities:
    an unconditional lower bound on the signature count for any adversary of
    any computational power, a tighter bound under one named heuristic, a
    measured per-signature hint-weight distribution at the real parameters, and
    a pilot measurement of realised information at a cell small enough for the
    posterior to be enumerable. The null control demanded by
    GOAL-MLDSA-002.next_action -- t0 resampled independently of the key -- is
    run FIRST and graded, so that a leak statistic surviving it is recognised
    as an artifact before any number is quoted.

  what_this_is_not:
    - Not a key recovery, a forgery, an attack, or a break. t0 is treated as public by the security argument, and recovering it is not key recovery.
    - Not a statement about MLWE, MSIS or SelfTargetMSIS in any direction, at any tier, however phrased.
    - Not a reproduction of the published t0 recovery at real parameters. That is priced in the budget block and declared out of budget in advance; GOAL-MLDSA-002's second completion criterion is therefore only partly served here, and the contract says so rather than under-delivering silently.
    - Not an assertion that t0 CAN be recovered from 34 signatures. The bound is a floor on any adversary, not an achievability claim, and the converse quantifier order is explicitly not claimed.
    - Not a criticism of eprint 2024/1373, which this program has NOT read, nor a judgement on FIPS 204's policy conclusion.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.

  claim_ceiling: >-
    TIER crypto for the floors, the capacity computations and the hint-weight
    measurements, because all are evaluated at the real FIPS 204 parameters and
    need no scaling argument. TIER toy for the reduced-cell Bayesian
    realised-information arm and for the graded null measured at that cell; its
    numbers may never be quoted about a real parameter set, and no crypto-tier
    statement may rest on it. A completed run may support, at most: that no
    algorithm of any cost determines t0 from fewer than 34 / 60 / 58 signatures
    at ML-DSA-44 / -65 / -87; that the tighter floors are 39 / 77 / 71
    CONDITIONAL on HEUR-MLDSA-HINT; that the measured hint weights are as
    stated; and that the distance to the relayed published cost is a factor of
    3.4e3 to 1.5e4 with the upper endpoint labelled unread.

  inputs:
    parameter_sets:
      ML-DSA-44: {k: 4, l: 4, tau: 39, gamma2: 95232, omega: 80, d: 13, t0_entropy_bits: 13312}
      ML-DSA-65: {k: 6, l: 5, tau: 49, gamma2: 261888, omega: 55, d: 13, t0_entropy_bits: 19968}
      ML-DSA-87: {k: 8, l: 7, tau: 60, gamma2: 261888, omega: 75, d: 13, t0_entropy_bits: 26624}
    modulus_q: 8380417
    parameter_provenance: >-
      Transcribed from FIPS 204 Table 1 by the generating session on 2026-08-06
      from the primary PDF (HTTP 200 from
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.pdf, 3,291,746
      bytes, sha256
      57239b9f84c03227eda3ca0991204dc7764c79af9ce2e6824eda774918d46b6b).
      TREATED AS UNVERIFIED. Stage 0 re-obtains the document and re-reads every
      value; a discrepancy terminates the line and is reported.
    reduced_cell:
      n_coefficients: 16
      k: 1
      omega: 5
      d: 13
      gamma2: 95232
      rationale: >-
        The posterior over t0 is 16 coefficients x 8192 values, fully
        enumerable, so exact information-theoretic determination can be
        measured rather than bounded. PILOT TIER.
    graded_resample_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
    master_seed: 8825342
    seed_derivation_rule: >-
      Every random value derives from
      SHAKE256(ASCII("EXP-MLDSA-8c8fa2/v1" || "|" || label || "|" ||
      decimal(master_seed) || "|" || decimal(counter)), output_bytes), counter
      starting at 0 and incremented once per draw, digest integers read
      big-endian unsigned. Labels are exactly: "keygen-seed", "message",
      "rnd", "resample-t0", "resample-mask", "reduced-keygen". This fixes every
      instance bit-for-bit; divergence is an invalidation_rule trigger.
    replication_seeds: [8825342, 8825343, 8825344]
    keypairs_per_parameter_set: 3
    hint_weight_signatures_per_set: 10000
    reduced_cell_signatures_per_arm: 2000

  arms_and_controls:
    treatment: >-
      ARM F0: the conforming signer at f = 0, i.e. the real key's own t0, at
      each real parameter set (for the hint-weight measurement) and at the
      reduced cell (for the realised-information measurement). This is the arm
      whose numbers the deliverable quotes, and it is examined LAST.
    measured_null: >-
      ARM F1: the identical pipeline with t0 RESAMPLED UNIFORMLY AND
      INDEPENDENTLY OF THE KEY before signing, i.e. f = 1. FORCED VALUE DERIVED
      BEFORE THE RUN: the measured information about the TRUE t0 is exactly
      zero and the posterior over the true t0 remains at its prior entropy of
      exactly 13 bits per coefficient. THIS NULL CAN FAIL -- any estimator
      reading the hint weights, the signature bytes, or the key would report a
      nonzero value -- and its failure withdraws every leak number in the
      package before any of them is quoted. Where resampling t0 breaks the
      (t1, t0) encoding consistency, the arm is generated as a SYNTHETIC
      TRANSCRIPT and is labelled as such in the record, never silently.
    positive_control: >-
      THE REDUCED CELL, where recovery MUST occur. At 16 coefficients and
      k = 1 the posterior over t0 is enumerable, so an explicit Bayesian update
      from observed hints must collapse it to a point at some finite signature
      count, and that count must be at least the floor computed by the same
      formula at those reduced parameters. IF RECOVERY DOES NOT OCCUR THERE,
      THE INSTRUMENT CANNOT SEE THE LEAK AND NO NEGATIVE RESULT ABOUT IT MAY BE
      REPORTED AT ANY SCALE. A measured count BELOW the floor is arithmetically
      impossible and halts the package as invalid_measurement rather than
      constituting a finding.
    graded_control: >-
      FIVE POINTS, THREE INTERIOR, MONOTONICITY REPORTED: resample a fraction f
      of t0's coefficients independently of the key, f in
      {0, 0.25, 0.5, 0.75, 1}, and measure the realised information about the
      true t0 at the reduced cell. FORCED SHAPE: strictly decreasing in f,
      approximately proportional to (1 - f) if the coefficients contribute
      independently, and EXACTLY zero at f = 1 within estimator noise. A
      statistic that fails to decay as the destroying parameter increases is
      the canonical artifact tell of docs/inventor-protocol.md section 3, and
      the graded arm localises which part of the pipeline produced it instead
      of leaving "the leak did not vanish".
    second_nearby_object: >-
      s2, which also enters the hint through <<c s2>> and which IS genuinely
      secret. The same estimator is run against s2 at the reduced cell. The
      expected asymmetry is sharp -- t0 determined, s2 not -- and an instrument
      that reports recovering s2 as readily as t0 is not tracking the
      compression map and every verdict in the package is void.
    ordering_control: >-
      Arm F1 (the null) is generated, analysed, and its verdict hash-committed
      BEFORE arm F0 is examined, and the graded arms are analysed in decreasing
      f order. Absence of that commitment is invalid_measurement.
    comparability_policy: >-
      The relayed 200,000-500,000 endpoint is NOT a measurement by this
      program and may never be placed in a table beside these numbers without
      its provenance label. Any comparison across parameter sets uses the
      floors computed at each set's own parameters and never a single averaged
      figure.

  measured_quantity:
    stage1_channel: >-
      Symbolic derivation and direct numerical confirmation on one signature
      that A z - c t1 2^d = w - <<c s2>> + <<c t0>>, hence that h is the only
      t0-dependent signature component; plus exhaustive enumeration at the
      reduced cell that the decodable hint count equals sum_{i<=omega'} C(n',i).
    stage2_floors: >-
      Exact integer computation of 256 k d and of
      log2 sum_{i=0}^{omega} C(256k, i), and of their ratio, at each parameter
      set; then the heuristic version using per-signature entropies
      256k * H2(p) with p = E|<<c t0>>| / (2 gamma2).
    stage3_hint_weights: >-
      Mean and standard deviation of the number of ones in h over 10000
      signatures per real parameter set, and the full weight histogram.
    stage4_realised_information: >-
      At the reduced cell, per graded arm: posterior entropy of t0 after
      N = 1, 2, 4, ..., 2048 signatures under an explicit coefficient-wise
      Bayesian update, and the smallest N at which the posterior collapses to a
      point when it does.

  metrics:
    primary:
      - unconditional floor ceil(256 k d / log2 sum_{i<=omega} C(256k,i)) per parameter set, exact
      - heuristic floor under HEUR-MLDSA-HINT per parameter set
      - measured mean and standard deviation of the hint weight per parameter set
      - realised information about the true t0 per graded arm at the reduced cell, with the f = 1 null reported first
    secondary:
      - hint capacity in bits per parameter set, and the per-signature heuristic entropy
      - gap ratio against the relayed published range, with the provenance label attached to every appearance
      - reduced-cell positive-control recovery count against the reduced-cell floor
      - realised information about s2 at the reduced cell, as the second nearby-object control
      - verbatim FIPS 204 Section 6.1 sentence with its page, and the fetch receipt

  heuristic_under_test: HEUR-MLDSA-HINT

  preregistered_prediction:
    quantity: >-
      (i) the unconditional floors; (ii) the heuristic floors; (iii) the hint
      weight means and standard deviations; (iv) the graded control's shape.
    formula: >-
      (i) 256 k d / log2 sum_{i<=omega} C(256k,i) with
      (13312, 400.7) -> 33.22 -> 34; (19968, 338.0) -> 59.08 -> 60;
      (26624, 459.7) -> 57.92 -> 58. THE ORDERING MUST BE NON-MONOTONE: the
      floor at ML-DSA-65 strictly exceeds the floor at ML-DSA-87. A monotone
      sequence indicates an arithmetic error.
      (ii) per-signature entropies 256k * H2(p) = 343 / 261 / 376 bits, which
      must fall 14 to 23 per cent BELOW the capacities; floors 39 / 77 / 71.
      An entropy exceeding its own capacity is impossible and halts the ladder.
      (iii) 63.4 / 38.7 / 57.1 with standard deviations 7.71 / 6.14 / 7.45,
      from p = E|<<c t0>>| / (2 gamma2), E|<<c t0>>| =
      sqrt(tau (2^26 - 1)/12) * sqrt(2/pi).
      (iv) realised information strictly decreasing in f and exactly 0 at
      f = 1.
    source: >-
      H-MLDSA-2ae88d mechanism steps 2-5, derived before this contract was
      written from FIPS 204 Section 6.1, Table 1 and Algorithms 7, 8, 20, 21,
      24, together with the data-processing inequality and subadditivity of
      Shannon entropy. All numeric values were computed by the generating
      session OUTSIDE the harness with no run record and are re-derivation
      targets, never authorities.

  scale_relevance:
    tier: crypto
    justification: >-
      The floors, the capacities and the hint-weight measurements are all at
      the real FIPS 204 parameter sets and require no transfer argument; the
      floors in particular are exact integer statements about those exact
      parameters and would not become truer at larger scale. The realised-
      information arm is at a reduced cell BECAUSE the posterior must be
      enumerable to be measured exactly, and it is labelled toy: its role is to
      demonstrate the instrument can see a leak at all, not to quantify the
      leak at real parameters. THE CROSS-SCALE LIMIT IS STATED RATHER THAN
      ASSUMED AWAY: nothing licenses extrapolating the reduced cell's realised
      information to 256 coefficients, and the record must not do it.
    correspondence: null

  tail_checks:
    - The heuristic per-signature entropies must lie strictly below the corresponding capacities at every parameter set; an inversion is an arithmetic impossibility.
    - The measured hint weight must never exceed omega in the conforming arm, since Line 28 rejects such attempts; an observation above omega indicates an implementation defect.
    - The reduced-cell recovery count must be at least the reduced-cell floor; a count below it is impossible and invalidates the arm.
    - The measured hint-weight variance is compared with the binomial value; a variance materially below binomial is the expected signature of the coefficient dependence HEUR-MLDSA-HINT ignores and is reported as such, not as a refutation.

  replication:
    seeds: [8825342, 8825343, 8825344]
    independent_instances: 3
    interpretation: >-
      Stages 1 and 2 are deterministic; replication there is re-derivation.
      Stages 3 and 4 are replicated across three seeds and three keypairs per
      parameter set, and the seed-to-seed spread of every reported statistic is
      stated BEFORE any comparison with a predicted value, so that a model
      error smaller than the noise is never reported as a fit.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 3
    no_network_at_run_time: false
    network_note: >-
      Stage 0 requires network access to re-obtain FIPS 204 and to attempt
      eprint 2024/1373 through the declared source-preference order. Stages 1-4
      require none.
    explicitly_out_of_budget: >-
      Reproducing the relayed 200,000-500,000-signature t0 recovery at real
      parameters. At pure-Python signing speed, generating 2e5 signatures alone
      is of order days of wall clock before any recovery work, against
      GOAL-MLDSA-002's declared 10,800-second campaign budget. DECLARED OUT OF
      BUDGET BEFORE EXECUTION. Under AGENTS.md rule 5 that is a budget outcome
      and never evidence about the leak, and the contract states plainly that
      the goal's second completion criterion is therefore only partly served.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived and authorized. It carries no approved_by field because it is not approved.
    - STOP at Stage 0 if the Section 6.1 sentence or any of k, d, omega differs from the inputs block; report the discrepancy as the deliverable.
    - STOP at Stage 1 if any signature component other than h is found to depend on t0; the floor bounds the wrong channel and must be restated.
    - STOP at Stage 1 if the exhaustive reduced-cell enumeration disagrees with sum_{i<=omega'} C(n',i).
    - STOP before examining arm F0 if the arm F1 null reports a nonzero leak about the true t0.
    - STOP if the reduced-cell positive control fails to recover t0 at any signature count; no negative result about the leak may be reported at any scale.
    - STOP and report infrastructure signal if FIPS 204 cannot be obtained or extracted, or if eprint 2024/1373 cannot be obtained after the declared source order is exhausted. The latter is a labelling outcome, not a blocker: the comparator stays relayed and every appearance says so.
    - HALT at the wall-clock or memory ceiling and report what was covered rather than silently reducing the sample.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Absence of the null-before-treatment hash commitment, or examination of arm F0 before arm F1's verdict is committed.
    - Any floating-point value used in the floor computations, where exact integer arithmetic and exact binomial sums are required.
    - Any quotation of the relayed 200,000-500,000 endpoint without its provenance label.
    - Any statement of the form "t0 can be recovered from N signatures" derived from a floor, which inverts the claimed quantifier order.
    - Any citation of the reduced-cell realised-information numbers about a real parameter set.
    - A reduced-cell recovery count below the reduced-cell floor, which is arithmetically impossible.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, failed download, failed PDF
    extraction, or exhausted budget is recorded as INFRASTRUCTURE SIGNAL with
    its exact cause and is NEVER negative mathematical evidence about the leak,
    the floors, or any heuristic (AGENTS.md rules 3 and 5). Two known-fragile
    dependencies: the FIPS 204 text extraction (pdftotext absent; pypdf and
    pdfminer.six both abort on the system `cryptography` package with
    pyo3_runtime.PanicException, worked around by installing a fresh
    `cryptography` into a local --target directory first on PYTHONPATH), and
    eprint PDF access (the ANGLE-BRIEF records eprint.iacr.org PDFs returning
    403 while abstract pages return 200). Neither failure licenses a
    conclusion.

  success_criterion: >-
    A complete readout in which: Stage 0 records the fetch receipt and the
    Section 6.1 sentence verbatim with its page; Stage 1 establishes
    symbolically and numerically that h is the sole t0-bearing component and
    that the decodable hint count matches the binomial sum at the reduced cell;
    Stage 2 returns the unconditional floors 34 / 60 / 58 and the heuristic
    floors 39 / 77 / 71 in exact arithmetic with the non-monotone ordering
    reproduced; Stage 3 returns hint weights within their pre-registered bands
    with seed spread reported first; and Stage 4 returns the graded control
    monotone with the f = 1 null at zero, the reduced-cell positive control
    recovering t0 at or above its floor, and the s2 nearby-object control
    showing the expected asymmetry. The package must state the gap ratio with
    its provenance label, must state which conclusions are unconditional and
    which are conditional on HEUR-MLDSA-HINT, and must state as a first-class
    deliverable that GOAL-MLDSA-002's second completion criterion is partly
    served -- floors and leak rate delivered, full-scale independent recovery
    priced and out of budget -- rather than reporting a partial result as a
    complete one.

  falsification_criterion: >-
    Any of: a signature component other than h depends on t0; the floors do not
    recompute to 34 / 60 / 58 or the non-monotone ordering fails; the reduced-
    cell decodable hint count differs from the binomial sum; the f = 1 null
    reports a nonzero leak about the true t0; the graded control is
    non-monotone; the reduced-cell positive control fails to recover t0; the
    s2 control recovers s2 as readily as t0; or the measured hint weights
    depart from prediction by more than three standard errors. Each
    falsification is scoped: a hint-weight failure withdraws the heuristic
    floors only and leaves the unconditional floors and the channel
    identification untouched, and the report must say which half survived
    rather than issuing a single verdict. Separately and pre-registered as NOT
    a failure: if eprint 2024/1373 is obtained and reports a count within an
    order of magnitude of the floor, the gap evaporates, the standard's "small
    number" is vindicated quantitatively, and THAT is the deliverable.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its sha256.
    - FIPS 204 fetch log with URL, HTTP status, byte count, sha256, timestamp, extraction command and environment; and the Section 6.1 sentence quoted verbatim with its page.
    - A record of the attempt to obtain eprint 2024/1373, listing every source tried and its outcome, whether or not it succeeded.
    - Stage 1 symbolic derivation, the single-signature numerical confirmation, and the exhaustive reduced-cell hint enumeration.
    - Stage 2 exact integer transcript: 256 k d, the binomial sums, both floors, per parameter set.
    - Stage 3 hint weight histograms per parameter set with seeds and seed-to-seed spread.
    - Stage 4 per-arm posterior-entropy curves with the f = 1 null first, the graded monotonicity statement, the reduced-cell recovery count, and the s2 control.
    - Null-before-treatment hash commitment with its timestamp.
    - Manifest, environment, dependency versions, command, stdout, stderr, timings, peak RSS, and validity status with reason.
    - Certificate block with kind: none, stated explicitly rather than left blank, since no solve or relation is claimed; the reduced-cell recovery, if it occurs, carries its own recovered-vs-true t0 comparison as an equality check performed by code independent of the recovery routine.

  execution_order_note: >-
    GOAL-MLDSA-002's next_action directs that the t0 object be scoped FIRST,
    and this contract is that object. It is therefore the one recommended for
    first approval. Its Stage 0 is the same source acquisition
    EXP-MLDSA-462ea2 needs, and that contract's Stage 1 costs six
    multiplications, so a Coordinator may fold both into one opening window.
    That is a scheduling suggestion, not an authorization.

  approval_requirements:
    - Independent review confirms the null (arm F1) can actually fail and that its forced value was derived before the run rather than after.
    - Independent review confirms the reduced-cell positive control is a genuine sensitivity demonstration and that no negative may be reported without it.
    - Independent review confirms the quantifier order is stated correctly and that no metric or conclusion can be read as an achievability claim or as a statement about MLWE, MSIS or SelfTargetMSIS.
    - Coordinator separately approves and freezes; the user separately authorizes execution.
  approval_status: >-
    Pending review. No approved_by field is present because this contract is
    not approved, and only the Coordinator may approve it (AGENTS.md rule 1).
  assigned_to: executor
