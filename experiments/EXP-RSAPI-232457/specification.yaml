experiment:
  id: EXP-RSAPI-232457
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7d1ed0; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7d1ed0
  question_id: RQ-RSA-d46f02
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate the complete root set inside a declared window by exhaustion at small moduli, compare
    it against the set a small-root pipeline returns, and sweep the read-off bound to attribute any
    deficit.
  objective: 'The one uncertainty a run reduces is whether the completeness property that makes small-root
    methods distinctive survives implementation, at parameters where the complete answer can be enumerated
    rather than inferred. Concretely: (i) whether the measurement is sound, established by the trivial-window
    arm where ground truth has exactly one element and the rate must be exactly 1 on success, by the
    requirement that no returned element is spurious, and by the random-congruence null which must
    return essentially none of its own root set; (ii) what the completeness rate is at windows inside,
    at, and past the theoretical bound at the default read-off setting, reported both as a per-instance
    mean and as a pooled ratio with exact binomial intervals; (iii) whether any deficit is attributable
    to the read-off stage, decided by sweeping the number of short vectors used at a fixed window
    and observing whether the rate recovers, together with the recorded certifying vector index for
    each returned root. A run also settles, for the rest of this bucket, whether single-root success
    is an adequate criterion or whether every reach number in the bucket has an unmeasured completeness
    component inside it.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for this reproduced
      construction, this implementation, these window sizes, these read-off bounds and these small
      moduli, the measured fraction of exhaustively enumerated in-window roots that the pipeline returns,
      with exact binomial intervals, spurious-element counts, certifying vector indices and a null
      arm. WHAT DOES NOT FOLLOW: no claim that the method''s completeness property is false, since
      a property under an exact shortest-vector oracle is not a property of a bounded read-off; no
      claim that any deficit is unavoidable, since the read-off sweep exists precisely to price the
      remedy; no claim about windows beyond 24 bits, where exhaustion was not run; and no attack,
      speedup, security consequence or statement about deployed RSA.'
  inputs:
    procedure: 'STAGE 0 (zero compute): declare the construction, the modulus size, the three window
      sizes, the half-open window convention, the read-off bounds, seeds and the success threshold.
      STAGE 1 (engineering, no compute): expose the pipeline''s read-off bound as a parameter and
      implement the exhaustive enumerator with exact integer arithmetic. STAGE 2 (minutes): trivial-window
      self-test; GATE on C equal to 1 on every success. STAGE 3 (minutes to hours): exhaustion over
      all three window sizes on 40 seeded instances each, producing complete ground-truth root sets.
      STAGE 4 (CPU-hours): run the pipeline at the default read-off bound on the identical instances,
      recording returned sets and certifying vector indices. STAGE 5 (CPU-hours, same invocation):
      sweep the read-off bound over four values at the middle window. STAGE 6 (same invocation): random-congruence
      null across all window sizes, including its own exhaustion. STAGE 7 (zero compute): compute
      C per-instance and pooled, verify zero spurious elements, and report intervals and attribution.'
    instrument: Python 3.11. python-flint or gmpy2 for exact integer arithmetic in the exhaustive
      enumerator and in verification of every returned root against the congruence. fpylll 0.6.4 for
      reduction via the route in KN-TECH-14efa5, pinned to one deterministic configuration recorded
      in the manifest, with the read-off vector count exposed as an explicit parameter. harness/runner.py
      for manifests, seeds and the inference block; harness/run.py as the bounded-run wrapper. The
      enumerator needs no lattice library. No Sage.
    parameters: 'Modulus bit-length chosen so that the target window fits in at most 24 bits; concretely
      n in {64, 96}. Three window widths: one comfortably inside the construction''s theoretical bound,
      one at it, one one bit past it, each at most 20 bits so exhaustion is at most about one million
      evaluations per instance. Read-off bound swept over 4 values from the implementation default
      upward. 40 seeded instances per window size and per read-off value, plus 40 random-congruence
      null instances per window size. Trivial-window arm sized so ground truth has exactly one element.
      Per-instance wall-clock cap 900 seconds, memory cap 8 GB.'
  controls:
  - Random-congruence null with its own exhaustively computed root set, same invocation.
  - Trivial-window self-test where the ground-truth set has exactly one element and C must be 1 on
    success.
  - Certifying vector index recorded per returned root, so attribution to the read-off is measured
    rather than inferred.
  - Paired instances shared across window sizes and read-off bounds.
  - Exact verification that every returned root actually satisfies the congruence, so that a returned
    set is never larger than ground truth by containing spurious elements.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical measurement runs against a null in which the target congruence
    is replaced by a random congruence of the same degree and modulus with NO planted structure. Ground
    truth is still computed by the same exhaustion, so the null has a genuine root set of its own,
    typically small and unstructured. The null must show that the pipeline returns a fraction of the
    null root set that is indistinguishable from zero, since there is no small-root structure to exploit;
    a pipeline that achieves a high completeness rate on random congruences is returning window elements
    by a route unrelated to the construction, and every C in the signal arm is void. A second control
    is the trivial-window arm: a window narrow enough that exhaustion returns exactly one root, where
    C must be exactly 1 whenever the pipeline succeeds at all, which self-tests the set comparison
    code.'
  independent_variables:
  - window width in bits
  - read-off bound, that is the number of short vectors used
  - modulus bit-length n
  - arm class (signal, random-congruence null, trivial-window self-test)
  metrics:
    primary:
    - completeness rate C per window and read-off bound, per-instance mean and pooled, with exact
      binomial intervals
    - ground-truth root-set size per instance
    - spurious returned-element count, required to be zero
    - completeness rate on the random-congruence null
    secondary:
    - certifying vector index distribution per returned root
    - exhaustion wall time per instance
    - reduction wall time and peak resident memory per instance
    - trivial-window arm outcome
  heuristic_under_test: null
  preregistered_prediction:
    quantity: C(w, b), the fraction of exhaustively enumerated in-window roots returned by the pipeline
      at window width w and read-off bound b.
    formula: C(w_bound, b_default) < 1, where w_bound is the window at the construction's theoretical
      bound and b_default is the implementation default. C is non-decreasing in b at fixed w. C is
      non-increasing in w at fixed b, restricted to windows inside the bound. C equals exactly 1 in
      the trivial-window arm on every instance where the pipeline succeeded at all. Ground truth is
      the set of integers in the half-open window satisfying the target congruence exactly, enumerated
      without any lattice.
    source: Pre-registered in the parent proposal IDEA-20260816-7d1ed0 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Moduli of 64 and 96 bits with windows of at most 20 bits, chosen precisely so
      that the complete root set is enumerable and every cell is decidable without inference. Ground
      truth is exact and total rather than pointwise. NO TRANSFER to wider windows or larger moduli
      is assumed or claimed: the completeness rate is a property of the tested windows only, and the
      contract states explicitly that behaviour at windows too wide to enumerate is outside its scope
      and cannot be extrapolated from these cells.'
    correspondence: null
  tail_checks:
  - Instances with unusually large ground-truth root sets, examined individually
  - Roots returned only at the highest read-off bound, with their certifying vector indices
  - Roots at or adjacent to the window endpoints, to confirm the half-open convention is applied identically
    by enumerator and pipeline
  - Maximum as well as median exhaustion time per window width
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at the STAGE 2 gate if the trivial-window arm reports a rate other than 1 on a success
  - Halt and report a verification failure if any returned element does not satisfy the congruence
  - Halt an instance at the wall-clock cap and record it as budget-limited, never as a mathematical
    negative
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A run succeeds if the trivial-window arm passes, no spurious elements are returned,
    the random-congruence null is bounded, and C is reported with exact binomial intervals at every
    window width and read-off bound, whether or not any deficit is found.
  falsification_criterion:
  - C equal to 1 everywhere refutes the central claim and is recorded as a clean positive instrument-validity
    result
  - A high completeness rate on the random-congruence null voids every reported C
  - A trivial-window rate other than 1 voids the set-comparison code and all rates
  - Any spurious returned element halts reporting until the verification path is fixed
  - C not increasing with the read-off bound refutes the attribution to the read-off, leaving the
    deficit measured but unattributed
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7d1ed0
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The construction must be filed as a KN-LIT entry from primary text before approval, per RQ-RSA-d46f02's
    constraints, since the theoretical bound defines the middle window width.
  - Whether the implementation's read-off bound can be exposed as a parameter without altering anything
    else is an engineering question STAGE 1 must settle before the sweep is meaningful.
  - The window widths are expressed relative to a theoretical bound that is not yet filed, so their
    absolute values are unset.
  - Whether a 20-bit window at 64 or 96 bit moduli reliably contains at least four roots is unverified;
    a Coordinator should check the expected root count before authorising, since a degenerate root
    set makes the rate uninformative.
