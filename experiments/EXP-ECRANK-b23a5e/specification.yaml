experiment:
  id: EXP-ECRANK-b23a5e
  hypothesis_id: H-ECRANK-7f0ec1
  version: 1
  recorded_at: '2026-09-13'
  designed_by: TASK-20260913-e41247
  converts_idea: IDEA-20260829-c7472b
  title: >
    The trust surface as the tracked object. R1 classifies all 9
    enumerated frontier rungs of RQ-ECRANK-27dcc5's ladder by what a
    from-scratch verifier must ACCEPT rather than recompute. R2, the
    load-bearing measurement, names PARI ellrank's code path on the
    rank-12 curve of EV-ECQ-0d142e, runs bnfcertify on every number field
    it constructs, builds a >=20-curve discriminant ladder from the
    certified pools, and fits the certifiability horizon. R3 writes a
    frozen witness schema extending GOAL-ECQ-e72c0b's completion
    criterion 3 to the eigenspace certificate kind, and measures an
    independent verifier's detection rate against 12 seeded faults plus
    the one historically observed real fault.
  status: approved
  approved_by: coordinator
  approval_note: >
    APPROVED 2026-09-13 by the Coordinator under AGENTS.md standing user
    authorization of 2026-09-06 ('all is approved. ideas/experiments
    should be always approved'), recorded in DEC-20260913-7036ce.
    Protocol completeness checked before this mark (full checklist in
    that decision): objective with decidable outcomes on BOTH branches
    of P1 (M-A/M-B/M-C/M-D); inputs (frozen 9-rung enumeration,
    classification rule fixed before the audit, named ellrank/bnfcertify
    procedure, discriminant ladder and HA-2 survey sample, frozen
    conformance suite with 12 seeded faults plus the 1 real historical
    fault); controls CTL-1 through CTL-5 with invalidation clauses;
    independent variables; primary metrics (trust_surface_table,
    grh_audit_result, certifiability_horizon, conformance_detection_rate)
    and secondary metrics; heuristics HA-1/HA-2/HA-3 stated exactly with
    rigorous-plus-classical justification and validation plans; the
    preregistered_prediction (P1-P4, transcribed verbatim from the
    proposal through the hypothesis, including P1's real vindicating
    branch as a first-class success); sample_size_derivation; scale_relevance
    (toy, honestly stated as sub-cryptographic); tail_checks; replication
    (seeds none, deterministic; independent_instances derived from the
    9-rung enumeration); budget (3 runs, R2's binding worst case ~40
    CPU-hours / 144,000 s stated as the per-run cap with an explicit
    derivation since EXP-ECRANK-52d039's 10800 s precedent does not fit,
    8 GB, 1 worker); stopping and invalidation rules (a bnfcertify
    timeout is `failed_infrastructure`, never evidence, per core rule 3);
    decidable success/falsification criteria with P1's "unconditional,
    certified" branch stated explicitly as a first-class success of the
    decision rather than a failure; and required artifacts, are all
    present and non-null. Executor handoff: TASK-20260913-e41247. Any
    later protocol change is a versioned protocol_amendment under
    experiments/EXP-ECRANK-b23a5e/amendments/, never an edit of this
    frozen contract; executed runs are never re-scored. PRE-APPROVAL
    NOTE, PRESERVED VERBATIM: "DESIGNING IS NOT APPROVING. This frozen
    contract sat at approved_by null, status review_required. Approval
    requires a committed Coordinator decision in a later step under the
    standing user authorization of 2026-09-06 ('all is approved.
    ideas/experiments should be always approved'); no run of this
    experiment is authorized until then. Protocol completeness as of
    this design, checked before this mark: objective, inputs, controls
    CTL-1..CTL-5, independent variables, primary and secondary metrics,
    heuristics HA-1/HA-2/HA-3, preregistered prediction P1-P4, sample
    size derivation, scale relevance, tail checks, replication (seeds
    none, deterministic), budget (3 runs; R2 worst case ~144,000 s;
    8 GB; 1 worker), stopping and invalidation rules, decidable success
    and falsification criteria including P1's vindicating branch as a
    first-class success, and required artifacts, are all present. Any
    later protocol change is a versioned protocol_amendment under
    experiments/EXP-ECRANK-b23a5e/amendments/, never an edit of this
    frozen contract, and executed runs are never re-scored."
  successor_of: null
  objective: >
    Decide, with real possible outcomes on BOTH sides, (M-A) whether
    EV-ECQ-0d142e's claim "rank E(Q) is EXACTLY 12 because PARI ellrank
    returned an unconditional upper bound of 12" is GRH-conditional
    through the class-group computation ellrank performs internally, by
    naming the code path and running bnfcertify on every number field it
    constructs; (M-B) where the certifiability horizon lies in
    log_10|d_A| for this class of 2-descent fields under a frozen
    budget; (M-C) how many of the 9 enumerated frontier rungs of
    RQ-ECRANK-27dcc5's ladder have a trust surface containing only
    EXHIBITED and THEOREM labels; and (M-D) whether an independent
    verifier built from a frozen witness schema alone detects a
    conformance suite of seeded faults, including the one historically
    observed real fault. "Unconditional, certified" for M-A is a
    FIRST-CLASS SUCCESS of this decision, vindicating EV-ECQ-0d142e with
    a basis it currently lacks -- it is not a failure of this
    experiment, and the design states plainly it is the outcome it would
    most like to find.
  inputs:
    mechanism_source: >
      H-ECRANK-7f0ec1 (mechanism blocks trust_surface_classification,
      grh_audit_of_ellrank) and ledger/proposals/IDEA-20260829-c7472b.yaml
      (claim parts A/B/C, five controls, HA-1/HA-2/HA-3, cost model). The
      classification rule, the bnfcertify audit, the discriminant ladder,
      and the conformance suite are implemented from this description.
    solver: >
      R1 and R3: exact stdlib rational arithmetic only (fractions.Fraction),
      matching EXP-ECRANK-e1e30e and EXP-ECQ-f5af06's independent-verifier
      pattern. R2: PARI/GP 2.15.4 with cypari (NOT PRESENTLY INSTALLED in
      this execution environment -- an EXECUTOR SETUP DEPENDENCY, not
      assumed present; matches the environment EV-ECQ-0d142e's numbers
      came from, Python 3.11.15). If cypari/PARI cannot be installed or
      made available, R2 is reported `failed_infrastructure` per AGENTS.md
      rule 3, never as a negative result for HA-1/P1/P2.
    frontier_rungs: >
      The 9 enumerated rungs, frozen, walked in this order (R1). From
      EV-ECRANK-b6c9b6: (1) cert_deg32_eigenspace, rank>=32 over a
      degree-32 multiquadratic field, pure Galois eigenspace argument;
      (2) cert_deg64_eigenspace, rank>=64 over degree 64, pure Galois
      eigenspace argument; (3) cert_deg16_multiplicity, rank>=32 over
      degree 16, eigenspace plus Neron-Tate regulators at 64 digits;
      (4) cert_deg32_multiplicity, rank>=52 over degree 32, eigenspace
      plus regulators; (5) cert_deg2_rank31, rank>=31 over a quadratic
      field, RELATIVE to the external Alpoge-Howell rank-30 record over
      Q plus one locally certified point; (6) cert_deg8_control, the
      null-object control, best configuration reaches 20 (8 exact +
      multiplicities) at degree 8, k=3. From EV-ECQ-0d142e: (7) OBS-3,
      rank E(Q) EXACTLY 12 for t=-65/22 (the audited cell); (8) OBS-9,
      the carried-forward Mestre-style pool's rank-13 lower bound over Q
      (2 curves at 13, 29 at 12, re-certified by the validator). From
      EXP-ECQ-f5af06: (9) RUN-ECQ-f5af06-v2-A-certify, ICARM leaderboard
      curve #302, 31-point F_l reduction / stacked-rank certificate,
      degree 1 over Q.
    classification_rule: >
      Fixed BEFORE the audit and published with the table (mitigates
      classifier subjectivity, HA-independent methodological control): a
      step is EXHIBITED if it is recomputable in exact integer/rational
      arithmetic from the witness alone; THEOREM only if a named theorem
      is cited AND its hypotheses are exhibited and checked in the
      witness; FLOAT if it is a numerical computation with no rigorous
      error bound (e.g. a floating-point or high-precision-but-unbounded
      Neron-Tate regulator); CONDITIONAL if it calls a subroutine whose
      correctness rests on an unproven hypothesis (GRH via bnf machinery);
      NON-INDEPENDENT if it is a call to the producer's own engine rather
      than an independent recomputation (docs/claims-and-verification.md
      forbids this for a verifier). Composition is the UNION of the
      labels of a rung's parts; the rung is reported at its WEAKEST
      label. TWO REVIEWERS label all 9 rungs independently; disagreements
      are reported, never resolved silently.
    ellrank_audit_target: >
      The rank-12 curve of EV-ECQ-0d142e OBS-3: t=-65/22, a-invariants
      [0, 0, 0, -518228207838672723, 141005837549331272675978478]. R2
      must (a) read the PARI ellrank documentation and, where accessible,
      its source, to determine which number field(s) it constructs for
      this curve's 2-descent and whether it internally calls bnf-family
      (GRH-conditional) machinery; (b) re-run ellrank on this exact curve
      with output of every intermediate number field constructed; (c)
      for each such field, compute its exact discriminant; (d) run
      bnfcertify on each field at both frozen budgets (450 s and 3600 s,
      a factor of 8 apart -- BUDGET SYMMETRY control below) under an 8 GB
      memory cap; (e) record success/failure/timeout, wall clock, and
      log_10|d_A| for every field at every budget.
    discriminant_ladder: >
      At least 20 cubic 2-descent fields, drawn from the 137 certified
      fibres of certified_curves.json and the 1,206-curve pool of
      highrank_pool.json, chosen to span log_10|d_A| as widely as the
      pools allow, PLUS the conductor-37 (EV-ECQ-0d142e OBS-8) and
      conductor-53 (EV-ECRANK-b6c9b6 base curve) control fields at the
      small end and the rank-12 curve's own field at the large end. Each
      field is run through the same bnfcertify procedure as
      ellrank_audit_target at both budgets. This also serves HA-1's
      validation_plan sample.
    discriminant_coefficient_survey: >
      HA-2's validation sample: all 137 certified fibres plus a 200-curve
      sample of the 1,206-curve pool (about 340 curves total). For each,
      compute f (the 2-descent cubic), disc(f), the maximal order and
      d_A where feasible, and factor d_A where feasible under a frozen
      per-curve time budget; report incomplete on failure rather than
      omitting the curve. Fits the constant c in log|d_A| = c log H and
      compares the empirical distribution of
      (omega(d_A) - log log|d_A|)/sqrt(log log|d_A|) against the standard
      normal (Erdos-Kac), per HA-2.
    conformance_suite: >
      A single frozen witness schema (R3) covering both certificate kinds
      this question uses -- the eigenspace/character certificate and the
      F_l reduction certificate -- EXTENDING (never duplicating) every
      field GOAL-ECQ-e72c0b's completion criterion 3 already enumerates
      (character basis or basis bindings, good primes and preconditions,
      point and torsion rows, exact F2 matrix, matrix rank, torsion-row
      rank, halving witnesses, and the proof that matrixRank minus
      torsionRank = 32 implies independence) plus whatever fields R1 and
      R2 show to be missing (e.g. an explicit CONDITIONAL/GRH-dependence
      flag per class-group-derived quantity). An independent verifier is
      implemented from the schema ALONE, without reading any producer
      code. The 12 pre-declared seeded faults (below) plus the 1 real
      historical fault are seeded into otherwise-valid witnesses and
      detection is measured.
    seeded_faults:
    - off-curve point
    - torsion point counted as independent
    - duplicated point
    - dependent triple
    - wrong twist model after a coset cancellation
    - non-subgroup V
    - subproduct that is a square
    - prime of bad reduction used
    - torsion row omitted
    - l dividing the lattice index
    - regulator nonsingular for dependent points
    - producer-state read instead of a recompute
    real_historical_fault: >
      16 points landing on an isomorphic but different model through
      coset cancellation, recorded in EV-ECRANK-b6c9b6's "INSTRUMENT
      CHECK THAT FIRED" observation -- the first build of the
      multiplicity certificates was rejected by the independent exact
      verifier for exactly this fault. Included as a REAL positive
      control alongside the 12 synthetic ones; per HA-3's tail check,
      failure to detect it invalidates the suite regardless of the
      synthetic score.
  controls:
  - id: CTL-1-CLASSIFIER-SEPARATION
    control: >
      The nearby-object control (proof_search_map.method_ceiling). The
      degree-32 eigenspace certificate (rung 1) and the 31-point F_l
      certificate (rung 9) must classify clean (EXHIBITED/THEOREM only);
      the degree-16 multiplicity certificate (rung 3) must be flagged
      FLOAT. A classifier that fails this pair reports nothing and R1's
      table is uninterpretable (invalidation rule below).
  - id: CTL-2-GRH-BASELINE
    control: >
      The conductor-37 rank-1 control curve of EV-ECQ-0d142e OBS-8 must
      classify UNCONDITIONAL with bnfcertify succeeding at the small
      budget (450 s). Otherwise the pipeline calls everything
      conditional and the fitted horizon is meaningless. This control
      spans R1 (the classification) and R2 (the bnfcertify measurement
      that grounds it).
  - id: CTL-3-SEEDED-FAULT-SUITE
    control: >
      The null-object control for the whole design (R3). A verifier that
      accepts a witness with a torsion point counted as independent, or
      with V not a subgroup, is not a verifier. The historically observed
      real fault (coset cancellation, EV-ECRANK-b6c9b6) is included as a
      REAL positive control alongside the 12 synthetic ones, per HA-3.
  - id: CTL-4-PRODUCER-STATE-TRAP
    control: >
      One of the 12 seeded faults is a witness whose claimed rank is
      correct but whose supporting matrix is copied from the producer
      rather than recomputed. An independent verifier MUST reject it
      (or flag it NON-INDEPENDENT); one that passes is trusting producer
      state, which docs/claims-and-verification.md forbids explicitly.
  - id: CTL-5-BUDGET-SYMMETRY
    control: >
      Every bnfcertify call in R2 is run at two budgets a factor of 8
      apart (450 s and 3600 s) so the certifiability horizon is measured
      rather than set by the smaller budget alone. Reported per-field,
      per-budget (success/failure/timeout, wall clock).
  independent_variables:
  - the rung (9 enumerated frontier rungs, R1)
  - the number field (every field ellrank constructs on the rank-12
    curve, plus the >=20-field discriminant ladder plus the
    ~340-curve HA-2 survey, R2)
  - the bnfcertify budget (450 s, 3600 s, R2, CTL-5)
  - the seeded fault (12 synthetic + 1 real historical, R3)
  metrics:
    primary:
    - name: trust_surface_table
      definition: >
        R1's per-rung record: (rung_id, per-step labels with artifact/field
        citation, composed label = weakest step label, control outcome
        for CTL-1 and CTL-2 where applicable). Answers M-C and P3.
      answers: [M-C, P3]
    - name: grh_audit_result
      definition: >
        R2's per-field record on the rank-12 curve: (field_index,
        exact_discriminant, log_10|d_A|, bnfcertify_result at each
        budget {success, failure, timeout}, wall_clock_seconds,
        code_path_named). The named code-path determination (does
        ellrank call bnf-family machinery for this curve's descent) plus
        the aggregate P1 binary determination (unconditional-certified /
        GRH-conditional / invalid_measurement). Answers M-A, P1.
    - name: certifiability_horizon
      definition: >
        Fitted from the discriminant-ladder run: the largest log_10|d_A|
        with a bnfcertify success at the 3600 s budget, the smallest
        log_10|d_A| with a bnfcertify timeout at the 3600 s budget, and
        whether these overlap (per HA-1's tail check, an interval is
        reported when they do). Answers M-B, P2.
    - name: conformance_detection_rate
      definition: >
        R3's (faults_detected, faults_total=13, list_of_undetected,
        real_historical_fault_detected boolean). Answers M-D, P4.
    secondary:
    - >-
      HA-2 discriminant/coefficient-size survey: fitted constant c in
      log|d_A| = c log H with residuals; empirical
      (omega(d_A)-loglog|d_A|)/sqrt(loglog|d_A|) distribution vs standard
      normal; whether the rank-12 curve is in the small-d_A tail
    - per-field wall_seconds (internal monotonic AND timestamp span) and
      peak_rss_bytes for every bnfcertify call
    - the list of schema fields R1/R2 show missing from committed witnesses
    - two-reviewer label agreement/disagreement log for R1 (classifier subjectivity confounder)
  heuristic_under_test: [HA-1, HA-2, HA-3]
  heuristics_stated_exactly:
  - >-
    HA-1 (H-ECRANK-7f0ec1): the unconditional-vs-GRH class-group
    verification cost ratio is superpolynomial in log|d_A|
    (|d_A|^{1/2+o(1)} vs (log|d_A|)^{2+o(1)}). Tested by R2's
    discriminant-ladder wall-clock fit. Reported as data (P2); a pattern
    contradicting the modelled slopes is a finding against HA-1 at the
    tested scope, never a run failure unless it stems from a bnfcertify
    timeout.
  - >-
    HA-2 (H-ECRANK-7f0ec1): log|d_A| = c log H (1+o(1)) and omega(d_A)
    follows Erdos-Kac normal fluctuations. Tested by the
    discriminant_coefficient_survey. Reported as data; the rank-12
    curve's own placement in the fitted tail is checked directly.
  - >-
    HA-3 (H-ECRANK-7f0ec1): seeded-fault detection rate estimates unseen
    implementation-fault detection rate (mutation-coupling assumption).
    Tested by R3; the real historical fault's detection is the
    non-negotiable tail check.
  preregistered_prediction:
    written_before_any_run: '2026-09-13 (this frozen contract; no run of this experiment exists)'
    never_adjusted_afterward: >
      This prediction is part of the frozen contract, transcribed
      verbatim from H-ECRANK-7f0ec1's predictions (which transcribe
      IDEA-20260829-c7472b's P1-P4 verbatim). Any later change requires a
      versioned protocol_amendment in
      experiments/EXP-ECRANK-b23a5e/amendments/ and creates a new
      record; it is never an edit of this field, and runs already
      executed are never re-scored against a new one.
    quantity: >
      (1) P1: the GRH status of the upper bound r_high=12 that
      EV-ECQ-0d142e cites as "unconditional", with ellrank's code path
      named and every constructed field's discriminant recorded. (2) P2:
      the certifiability horizon in log_10|d_A| under the frozen 3600 s /
      8 GB budget. (3) P3: the count, of the 9 frontier rungs, whose
      trust surface contains only EXHIBITED and THEOREM. (4) P4: the
      detection rate of the 13-fault (12 seeded + 1 real) conformance
      suite.
    formula: >
      P1: a binary determination (code path + field discriminant
      recorded). Direction: the bound is found to depend on a
      GRH-conditional class/unit-group computation UNLESS bnfcertify
      succeeds on the relevant field. MINIMUM EFFECT AND BOTH BRANCHES,
      TRANSCRIBED VERBATIM AS FIRST-CLASS OUTCOMES: "a binary
      determination with the code path named and the field's
      discriminant recorded. Either answer is a result: 'unconditional,
      certified' restores the claim with a basis it currently lacks;
      'GRH-conditional' means the program's only exact-rank claim over Q
      must be restated under the two-record rule." P2: direction finite
      and small relative to record curves. MINIMUM EFFECT: "the horizon
      lies at log_10|d_A| between 10 and 45, and the rank-12 curve's own
      field (whose discriminant is expected near log_10|d_A| of 50 or
      more, given a6 of order 1.4e26) lies ABOVE it. If the horizon
      exceeds log_10|d_A| = 60 the exactness claim is cheaply rescuable
      and the whole part-(C) concern is smaller than stated -- a
      falsification in the direction that helps the programme." P3:
      direction small; most rungs carry a FLOAT or a CONDITIONAL.
      MINIMUM EFFECT: "at most 4 of 9 clean, with each label traced to a
      named step in a named committed artifact. More than 6 clean means
      the classifier is too permissive and must be re-tested against the
      seeded-fault suite before its column is published." P4: direction
      increase toward 1. MINIMUM EFFECT: "at least 11 of 12 detected by
      an independent verifier given only the witness. Below that, the
      witness FORMAT is underspecified -- some faults are invisible in
      the artifact -- and the missing fields are the deliverable."
    source: >
      IDEA-20260829-c7472b.predictions (P1-P4), transcribed unweakened
      through H-ECRANK-7f0ec1.predictions into this contract. HA-1's
      1/2-vs-2 exponent pair rests on Minkowski's theorem (unconditional)
      and Bach's bound (proven under GRH), both theorems, per
      H-ECRANK-7f0ec1's heuristic_assumptions; no recalled external
      source backs any NUMBER reported by this contract (rule 9) -- every
      number is either exact (discriminants, wall clock, detection
      counts) or a fit derived from this experiment's own measurements.
  sample_size_derivation:
    method: >
      R1: no sampling, a fixed enumeration of 9 already-committed rungs
      (two independent labellers each). R2: HA-1's validation_plan sample
      -- at least 20 cubic 2-descent fields spanning log_10|d_A| as
      widely as the certified pools allow, plus the conductor-37 and
      conductor-53 controls and the rank-12 curve's own field (22+
      fields minimum), each at 2 budgets; plus HA-2's validation_plan
      sample of all 137 certified fibres plus a 200-curve sample of the
      1,206-curve pool (about 340 curves) for the discriminant/coefficient
      survey. R3: HA-3's validation_plan sample of 12 pre-declared seeded
      faults plus the 1 real historical fault, each run against 1
      independent verifier implementation (13 mutants total; the
      proposal's "13 mutants x 2 verifier implementations" reduces to 1
      independent implementation here since this contract fields exactly
      one independent verifier, built from the schema alone -- the
      producer witness itself is the second "implementation" being
      tested, matching the proposal's own framing of detection as a
      property of the independent verifier against producer-shaped
      witnesses).
    smallest_probability_to_resolve: null
    smallest_probability_to_resolve_note: >
      No probability to resolve in the classical sense: R1 and R3 are
      fixed enumerations, and R2's ladder size (>=20) is set directly by
      HA-1's validation_plan rather than by a target tail probability.
    derived_sample_count: >
      R1: 9 rungs x 2 independent labellers = 18 labelling passes.
      R2: >=22 fields (>=20 ladder + conductor-37 + conductor-53,
      the rank-12 curve's field(s) counted within the ladder's large
      end) x 2 budgets = >=44 bnfcertify calls, plus ~340 curves for the
      HA-2 discriminant/coefficient survey (no bnfcertify call; exact
      arithmetic only). R3: 13 witnesses (12 seeded + 1 real) x 1
      independent verifier = 13 detection trials.
  scale_relevance:
    tier: toy
    justification: >
      Claim-tier vocabulary of docs/claims-and-verification.md is
      indexed by ECDLP field bit-size and does not describe a
      trust-surface audit or a class-group certifiability measurement;
      `toy` is recorded as the least-asserting available label. This is
      TOY/SMALL-NUMBER-FIELD SCALE, NOT CRYPTOGRAPHIC SCALE: the largest
      object measured is a single cubic number field of expected
      log_10|d_A| around 50 (a specific, bounded discriminant, not a
      cryptographic security parameter), and the conformance suite
      operates on witnesses of a few dozen points. No claim here
      transfers to cryptographic-size instances without a separately
      frozen follow-up.
    correspondence: null
    correspondence_note: no correspondence trick is used; every field and every witness is a directly named, already-committed object.
  tail_checks:
  - >-
    HA-1: the single largest log_10|d_A| certified and the single
    smallest log_10|d_A| that timed out at the 3600 s budget; if these
    overlap, the horizon is reported as an interval, not a point.
  - >-
    HA-2: the rank-12 curve's own field, checked directly against the
    small-d_A tail of the fitted log|d_A|-vs-log H relation (the single
    most likely route by which P1 resolves in the reassuring direction,
    per the confounder below).
  - >-
    HA-3: the real historical fault (coset-cancellation off-model
    points) MUST be detected; failure there invalidates the suite
    regardless of the synthetic score, independent of the 11/12 minimum
    effect.
  - >-
    CTL-1: the degree-32 eigenspace and 31-point certificates must both
    classify clean AND the degree-16 multiplicity certificate must be
    flagged, checked as a joint pass/fail before any other R1 reading is
    trusted.
  replication:
    seeds: []
    seeds_note: >
      No randomization by construction. The 9 rungs, the discriminant
      ladder membership rule, and the 12 seeded faults are all
      deterministically declared; bnfcertify itself is deterministic
      given its inputs and budget. The declared seed set is empty.
    independent_instances: 9
    independent_instances_note: >
      9 frontier rungs (R1) plus the discriminant ladder (R2, >=20 fields
      drawn from 2 independently certified pools) plus the ~340-curve
      HA-2 survey plus the 13-item conformance suite (R3) are treated as
      4 independent object families across the 3 runs; the template's
      countable "independent_instances" is recorded at the rung count
      (9) as the primary cross-cutting unit RQ-ECRANK-27dcc5's ladder is
      indexed by, with the R2/R3 sample counts recorded separately above
      in sample_size_derivation.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 144000
    wall_clock_seconds_per_run_note: >
      NOT UNIFORM ACROSS RUNS; recorded as the binding (largest) per-run
      cap and derived below rather than forced to EXP-ECRANK-52d039's
      10800 s precedent, which does not fit R2's own stated cost. R1
      (trust-surface audit, all reading): well under 3600 s. R2 (the
      GRH measurement): up to ~144,000 s (40 CPU-hours) worst case for
      20-40 bnfcertify calls at two budgets each, per the proposal's own
      estimated_cost -- "very likely far less because large fields will
      time out fast at the small budget." R3 (conformance suite): about
      2 CPU-hours (7,200 s). The per-run field is set to R2's worst-case
      cap (144,000 s) so no run is artificially truncated below the
      proposal's own worst-case estimate; R1 and R3 are expected to
      finish in a small fraction of that cap.
    total_cpu_hours: 42
    total_cpu_hours_note: >
      Derivation: R1 (Arm 1) negligible, <1 CPU-hour, all reading. R2
      (Arm 2) up to ~40 CPU-hours worst case (proposal estimated_cost).
      R3 (Arm 3) about 2 CPU-hours (proposal estimated_cost). Sum ~42,
      close to but more granular than the proposal's single
      wall_clock_seconds_estimate of 160,000 (~44.4 CPU-hours at 1
      worker), which this decomposition reproduces to within the stated
      "very likely far less" margin.
    maximum_memory_gb: 8
    maximum_memory_gb_note: >
      Frozen budget cap for bnfcertify per the proposal (memory grows
      with the factor base and is the binding resource in practice for
      R2). R1 and R3 are negligible (kilobytes to low megabytes).
    maximum_runs: 3
    maximum_runs_note: >
      Enumerated: (1) R1, the trust-surface audit table over the 9
      frontier rungs; (2) R2, the GRH measurement -- ellrank code-path
      naming, per-field bnfcertify at 2 budgets over the discriminant
      ladder (>=20 fields) plus the ~340-curve HA-2 survey; (3) R3, the
      conformance suite -- frozen witness schema, independent verifier,
      13-fault detection measurement. Infrastructure-retry slots (e.g. a
      bnfcertify timeout re-attempted once at the same budget to rule
      out a transient resource spike) are recorded per field within R2,
      never as new scientific runs.
    maximum_workers: 1
    maximum_workers_note: >
      bnfcertify is not usefully parallel in the available implementation
      per the proposal's tradeoff_note; the audit (R1) and conformance
      suite (R3) are trivially parallel but are not declared with extra
      workers since neither is the binding cost.
    counted_exact_rational_operations_per_run: null
    counted_ops_note: >
      No counted-op stop rule for R1/R3 (small, exact-arithmetic
      workloads bounded by the fixed enumerations). R2 is bounded by
      wall clock per bnfcertify call (the frozen 450 s / 3600 s budgets)
      and by the field-count enumeration (>=20 ladder fields + ~340
      survey curves), not by a counted-op cap.
    maximum_attempts_per_run: null
    descent_calls: unbounded within R2's field enumeration; every
      ellrank call is on the fixed rank-12 curve or the fixed ladder/survey pools
    pari_ellrank_calls: '>=1 (rank-12 curve, R2) plus incidental calls already recorded in the certified pools (read-only, not re-run)'
    bnfcertify_calls: '>=44 (>=22 fields x 2 budgets, R2)'
    network: >
      NONE for R1/R3. R2's only permitted external dependency is the
      PARI documentation/source read named in inputs.mechanism_source
      and inputs.ellrank_audit_target -- a network read if no local PARI
      source/doc copy is available, recorded rather than assumed, per
      the proposal's own confounders block.
  stopping_rules:
  - CTL-1 (classifier separation) must pass before any other R1 reading
    is trusted; on failure R1 is reported invalid (voids the trust-surface
    table) but the run remains a record (core rule 8).
  - CTL-2 (GRH baseline, conductor-37 bnfcertify success at 450 s) must
    pass before any R2 field beyond the controls is read as evidence for
    a horizon; on failure the horizon fit is reported as uninterpretable
    but individual per-field bnfcertify outcomes remain valid records.
  - >-
    Exhaustion is inert in both directions: a bnfcertify timeout, a
    schedule/enumeration exhaustion, or a wall-clock budget exhaustion is
    reported as exhaustion/`failed_infrastructure` and is NEVER a
    positive or negative mathematical result (AGENTS.md rule 3).
  - No early stop and no adaptive budget widening within a declared
    bnfcertify call; each (field, budget) pair is a fixed pass.
  - R3's real-historical-fault check runs to completion regardless of the
    synthetic-fault tally, since it is the non-negotiable tail check
    (HA-3).
  invalidation_rules:
  - CTL-1 failure (classifier flags the eigenspace/F_l rungs, or fails to
    flag the degree-16 multiplicity rung) invalidates R1's trust-surface
    table in full.
  - CTL-2 failure (conductor-37 bnfcertify does not succeed at 450 s)
    invalidates the certifiability-horizon fit; individual bnfcertify
    call records are preserved as data, not discarded.
  - A bnfcertify TIMEOUT or crash on any field, including the controls,
    is `failed_infrastructure`/`invalid_measurement` for THAT field only
    (never a mathematical result per AGENTS.md rule 3) and does not by
    itself invalidate other fields' results; if EVERY field times out at
    BOTH budgets including the conductor-37/53 controls, R2 in its
    entirety is `invalid_measurement` and P1/P2 are unresolved, per the
    hypothesis's own falsification_conditions.
  - PARI/cypari unavailable in the execution environment and not
    installable within budget is a setup-dependency `failed_infrastructure`
    outcome for R2 in full, reported as such, never as evidence for
    either P1 branch.
  - >-
    CTL-4 (producer-state trap) acceptance by the independent verifier
    invalidates R3's conformance result: the suite is reporting a
    verifier that trusts producer state, which is itself the finding.
  - Any run-start recomputed fact (e.g. a discriminant, a re-derived
    curve equation) that fails to match a cited committed value is a
    SPEC OR TRANSCRIPTION DEFECT; the affected field/rung is invalid and
    correction proceeds by a versioned amendment, never a silent edit.
  - Every invalidation is recorded with the failing check's exact inputs;
    a voided reading is never silently dropped (core rule 8).
  success_criterion: >
    DECIDABLE, WITH REAL POSSIBLE OUTCOMES ON BOTH SIDES OF P1 IN
    PARTICULAR. G1 (M-C/P3, primary): the trust-surface table is complete
    for all 9 rungs, CTL-1 passes, and the count of clean (EXHIBITED/
    THEOREM-only) rungs is reported with citations. G2 (M-A/P1, primary):
    ellrank's code path on the rank-12 curve is named, every constructed
    field's discriminant is recorded, and bnfcertify outcomes at both
    budgets are recorded for each -- the binary determination
    (unconditional-certified vs GRH-conditional) is reported EITHER WAY
    as a first-class, decidable result of this experiment; "unconditional,
    certified" is NOT a failure and is explicitly the outcome this
    design would most like to find (it vindicates EV-ECQ-0d142e). G3
    (M-B/P2, primary): the certifiability horizon is fitted from the
    discriminant ladder with its tail-check interval reported (CTL-2
    must pass). G4 (M-D/P4, primary): the conformance suite's detection
    rate is reported out of 13 (12 seeded + 1 real), with the real fault's
    detection status called out separately per HA-3. Negative outcomes
    ARE FIRST-CLASS SUCCESSES OF THE DECISION: the falsification_conditions
    below (classifier separation failure, P1's "unconditional, certified"
    branch, P2's horizon-exceeds-60 branch, P4's sub-11/12 branch, total
    bnfcertify failure) each closing their declared scope is a successful,
    decidable outcome of this experiment, not a failure of it.
  success_criterion_decidability_note: >
    Every clause is machine-checkable from the predefined metrics:
    trust_surface_table for G1, grh_audit_result for G2,
    certifiability_horizon for G3, conformance_detection_rate for G4, and
    the invalidation_rules for the infrastructure branch.
  falsification_criterion: >
    Transcribed from H-ECRANK-7f0ec1.falsification_conditions verbatim
    (5 conditions): (1) classifier separation failure voids R1's table;
    (2) P1 resolving "unconditional, certified" on every field ellrank
    constructs -- A REAL POSSIBLE NEGATIVE FOR THE HYPOTHESIS, STATED AS
    THE OUTCOME THE DESIGN WOULD MOST LIKE TO BE WRONG ABOUT, and NOT a
    failure of this experiment; (3) P2 failing upward (horizon exceeds
    log_10|d_A|=60); (4) P4 failing (fewer than 11 of 12 synthetic faults
    detected, or the real fault missed); (5) total bnfcertify failure at
    both budgets including on the conductor-37 control, which is
    `invalid_measurement`, never evidence that anything is conditional.
    Each falsification closes ONLY its declared scope (core rule 6):
    (1) closes nothing about the rungs, only about the classifier's
    trustworthiness at this run; (2) closes the GRH-conditionality
    question for THIS field/curve/PARI-build, restoring EV-ECQ-0d142e's
    basis rather than weakening it; (3) closes the "small horizon"
    reading of part (C) at the tested ladder; (4) closes the conformance
    suite's current field set as sufficient, naming the missing fields as
    the deliverable instead; (5) closes nothing -- it is an infrastructure
    stop, and P1/P2 remain open pending a working PARI/cypari environment.
  required_artifacts:
  - 'the ledger run schema for EVERY enumerated run, the nested `run:` record carrying RUN_REQUIRED_TOP fields (id, experiment_id, status, code, environment, inputs, results, stdout, stderr, timestamps, resources, validity, model provenance) plus the command.txt and environment.json companions'
  - 'R1: the 9-row trust-surface table with per-step labels, artifact/field citations, the composed (weakest) label per rung, and the two-labeller agreement/disagreement log'
  - 'R2: the named ellrank code path and every number field it constructs on the rank-12 curve, with exact discriminants; the per-field, per-budget bnfcertify outcome table (success/failure/timeout, wall clock, log_10|d_A|); the fitted certifiability horizon with its tail-check interval; the HA-2 discriminant/coefficient survey table (~340 curves) with the fitted constant c and the Erdos-Kac comparison'
  - 'R3: the frozen witness schema document (explicit extension of GOAL-ECQ-e72c0b criterion 3), the independent verifier implementation (built from the schema alone, no producer code read), the 13 seeded/real witness files, and the detection-result table with the undetected-fault list'
  - 'wall_seconds per run (internal monotonic AND timestamp span) and peak_rss_bytes per run'
  - 'execution-report.yaml (executor observations only, no interpretation)'
  - 'implementation.md documenting the R1 classification rule, the R2 PARI code-path finding, and the R3 schema, as implemented'
  assigned_to: executor
  completion_gate:
  - All 3 enumerated runs (R1, R2, R3) finalized with the nested `run:` record schema.
  - validate_ledger.py adds no new violations after the run package.
  - The snapshot archive commits the full run package before any independent review.
  inference:
    requested_policy: executor-implementation
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
