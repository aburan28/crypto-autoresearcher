# =============================================================================
# EXP-ECDLP-6dacdb -- L1 of H-ECDLP-bd1572: pairing transfer is the only door,
# and the form of p does not open it. Part A is a toy census of embedding
# degrees on special versus matched random primes; part B is a deterministic
# exact check of the embedding degree of every deployed special-prime curve
# against a transfer threshold k* computed from stated, optimistic constants.
# status review_required: implemented, not approved, no run, no outcome.
# =============================================================================
experiment:
  id: EXP-ECDLP-6dacdb
  hypothesis_id: H-ECDLP-bd1572
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  version: 1
  designed_at: '2026-10-09'
  title: >-
    Transfer exposure: embedding-degree census of random curves over
    special-form versus matched random toy primes, and the exact embedding
    degree of each deployed special-prime curve against the SNFS/exTNFS
    transfer threshold k*
  status: review_required
  approved_by: null
  claim_tier: toy
  limb: L1
  objective: >-
    (A) Decide whether the polynomial form of p shifts the distribution of
    the embedding degree k of the largest prime-order subgroup of a random
    curve E/F_p, which is the one statistic through which the F_{p^k}^*
    sieve could ever reach E. H-ECDLP-bd1572 predicts no shift. (B) For each
    deployed special-prime curve, compute by exact modular exponentiation
    that the order of p modulo l exceeds 10^6, and tabulate the threshold k*
    below which a transfer into F_{p^k} followed by SNFS, STNFS or exTNFS
    would undercut Pollard rho on the l-subgroup, under constants that are
    flagged recalled and optimistic. The deliverable of (B) is the size of
    the gap k_actual - k*, not a key-size statement.
  inputs:
    part_a:
      primes: >-
        Special arm: for d in {2, 3, 4, 5} and the frozen c list of
        EXP-ECDLP-2535ec, the first three primes p = m^d - c with p in
        [2^15, 2^17) scanning m upward from round(2^(16/d)); random arm: for
        each special prime one seeded random prime of the same bit length.
      curves: >-
        64 seeded random (a, b) per prime with 4a^3 + 27b^2 != 0 mod p;
        anomalous curves (#E = p) are recorded and excluded from k, since l
        = p has no embedding degree.
      point_counting: >-
        Exact: #E = p + 1 + sum over x of chi(x^3 + a x + b) with chi the
        Legendre symbol from a precomputed residue table.
      statistic: >-
        l = largest prime factor of #E; k = multiplicative order of p modulo
        l computed by direct search (k | l - 1); t = (l - 1) / k the
        cofactor. Per arm: fraction with k <= 20, mean of log2 t, histogram
        of t in bins {1, 2, 3-4, 5-16, > 16}.
      tests: >-
        Pre-registered: (i) two-sided permutation test (10000 shuffles,
        seeded) on the arm difference of mean log2 t; (ii) difference of the
        k <= 20 fractions with a two-proportion standard error; (iii)
        chi-square on the t histogram. alpha = 0.01 each.
    part_b:
      curves:
        - name: Curve25519
          p: 2^255 - 19
          special_form: u^5 - 19 at u = 2^51 (also u^d - 19 for every d | 255)
          l: 2^252 + 27742317777372353535851937790883648493
          cofactor: 8
          order_check: >-
            x-only Montgomery ladder on u = 9 over y^2 = x^3 + 486662 x^2 + x
            must give the point at infinity at scalar l.
        - name: P-256
          p: 2^256 - 2^224 + 2^192 + 2^96 - 1
          l: 0xFFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632551
          cofactor: 1
          order_check: "[l]G = O on the FIPS base point"
        - name: secp256k1
          p: 2^256 - 2^32 - 977
          l: 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141
          cofactor: 1
          order_check: "[l]G = O on the SEC2 base point"
        - name: P-521
          p: 2^521 - 1
          l: 0x1FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFA51868783BF2F966B7FCC0148F709A5D03BB5C9B8899C47AEBB6FB71E91386409
          cofactor: 1
          order_check: "[l]G = O on the FIPS base point (constants from aburan28/crypto src/ecc/curve_zoo.rs)"
        - name: Ed448
          p: 2^448 - 2^224 - 1
          special_form: u^2 - u - 1 at u = 2^224
          l: 2^446 - 0x8335dc163bb124b65129c96fde933d8d723a70aadc873d6d54a7bb0d
          cofactor: 4
          order_check: >-
            primality of l and the Hasse interval check |p + 1 - 4 l| <=
            2 sqrt(p) only; no base point is bound in this session, so the
            order is RECALLED and the row says so.
        - name: brainpoolP256r1
          role: random-prime control
          p: 0xA9FB57DBA1EEA9BC3E660A909D838D726E3BF623D52620282013481D1F6E5377
          l: 0xA9FB57DBA1EEA9BC3E660A909D838D718C397AA3B561A6F7901E0E82974856A7
          cofactor: 1
          order_check: "[l]G = O on the RFC 5639 base point (constants from curve_zoo.rs)"
      embedding_degree_check: >-
        Compute p^k mod l iteratively for k = 1..10^6 and record the smallest
        k with p^k = 1 if any; otherwise record k_actual > 10^6.
      threshold_model: >-
        rho cost = 0.886 sqrt(l) group operations. Post-transfer cost =
        L_Q(1/3, c) = exp(c (ln Q)^{1/3} (ln ln Q)^{2/3}) with Q = p^k and
        the o(1) DROPPED (optimistic). Constants, all provenance recalled:
        c_GNFS = (64/9)^{1/3} = 1.923; c_SNFS = (32/9)^{1/3} = 1.526
        (special p, k = 1); c_exTNFS = (48/9)^{1/3} = 1.747 (KN-LIT-3743,
        composite k best case); c_STNFS = 1.526 (special p with composite k,
        recalled from Kim-Barbulescu). k* for each c is the largest k with
        L_{p^k}(1/3, c) < rho cost; a unit mismatch (field multiplications
        versus group operations) is absorbed by also reporting k* with the
        post-transfer cost divided by 10^3.
  controls:
    - >-
      CTRL-COUNT: for every prime, the point count of y^2 = x^3 + x (or the
      first curve) is cross-checked by the order of a random point dividing
      #E and by the Hasse bound; a failure invalidates the prime's cell.
    - >-
      CTRL-SUPERSINGULAR-NEARBY: over each special prime with p = 3 mod 4,
      the supersingular curve y^2 = x^3 + x (k = 2) is scored by the same
      code path and MUST report k = 2 (the nearby object that the transfer
      does reach), so a null census is not an instrument that sees nothing.
    - >-
      CTRL-ARM-SYMMETRY: the random-arm primes are generated by the same
      code with the special-form search disabled; the number of curves,
      seeds and the exclusion rules are identical.
    - >-
      CTRL-PART-B-ORDERS: every deployed l is checked prime (Miller-Rabin,
      64 rounds) and in the Hasse interval for its cofactor; where a base
      point is bound, [l]G = O is checked; Ed448 is explicitly reported as
      recalled-only.
    - >-
      CTRL-REPLAY: seeded replay is byte-identical.
  independent_variables:
    - "prime arm: special | random (part A)"
    - "d in {2, 3, 4, 5} (part A, special arm)"
    - "curve seed 1..64 (part A)"
    - "complexity constant c in {1.526, 1.747, 1.923} (part B)"
  metrics:
    primary:
      - small_k_fraction_difference_special_minus_random_with_standard_error
      - permutation_p_value_mean_log2_cofactor
      - deployed_curve_k_actual_lower_bound_and_k_star_per_constant
    secondary:
      - t_histogram_per_arm
      - anomalous_curve_count_per_arm
      - supersingular_control_k_values
      - wall_clock_seconds
  preregistered_prediction:
    quantity: arm difference in the embedding-degree statistics; deployed gap
    formula: >-
      |fraction(k <= 20)_special - fraction_random| <= 2 SE and permutation
      p > 0.01; k_actual > 10^6 > k* with k* <= 50 for every deployed
      special-prime curve under every constant (the design-session dry run of
      the threshold code gave k* between 9 and 48 across curves and
      constants, largest for P-521 under the SNFS constant).
    source: >-
      Balasubramanian-Koblitz random model (KN-LIT-086); L(1/3) constants
      as recalled above.
  scale_relevance:
    tier: toy
    justification: >-
      Part A is a 16-bit census and tests only whether the form of p shifts
      a distribution; part B is exact arithmetic on public constants and a
      cost model with recalled constants and no o(1). Neither extrapolates.
    correspondence: null
  tail_checks:
    - Report the three smallest k observed per arm with their (p, a, b).
  replication:
    seeds: [1, 2, 3]
    independent_instances: 24
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 1
    maximum_runs: 6
  stopping_rules:
    - Stop part A at 1800 s and record what completed; never as evidence.
    - Part B is deterministic and runs once per seed-independent invocation.
  invalidation_rules:
    - A prime whose CTRL-COUNT fails invalidates its cell.
    - A supersingular control not reporting k = 2 invalidates the whole part A run.
    - A deployed-curve row whose l is not prime or not in the Hasse interval is reported as a constant error and excluded, never silently corrected.
  success_criterion: >-
    Part A shows no arm difference under the three pre-registered tests, the
    supersingular controls report k = 2, and part B shows k_actual > 10^6 and
    k* <= 50 for every deployed special-prime curve: the form of p does not
    open the transfer door at toy scale, and the deployed gap is at least
    four orders of magnitude.
  falsification_criterion: >-
    A pre-registered test rejects at alpha = 0.01 with the controls passing
    (the form of p shifts embedding degrees), or a deployed special-prime
    curve with k_actual <= k* under any constant (the transfer door is open
    for a real curve, which would be a breakthrough-class claim routed to
    review-breakthrough before anyone repeats it).
  decision_impact:
    on_positive: >-
      L1 of H-ECDLP-bd1572 is supported in scope; the Coordinator records
      that the only special-p sieve route reaching E/F_p is through k and
      that k is not moved by the form of p; the transfer lane is not
      reopened for special primes.
    on_negative: >-
      A new RQ is opened on the mechanism by which the form of p shifts k
      (part A) or on the specific curve (part B, breakthrough review); the
      cost-model row is re-derived with read, not recalled, constants.
  required_artifacts:
    - experiments/EXP-ECDLP-6dacdb/specification.yaml
    - experiments/EXP-ECDLP-6dacdb/implementation/run.py
    - experiments/EXP-ECDLP-6dacdb/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-6dacdb/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-6dacdb/runs/<RUN-ID>/deployed-table.md
  launcher:
    command: >-
      python3 experiments/EXP-ECDLP-6dacdb/implementation/run.py --part A B
      --seeds 1 2 3 --curves 64 --out <run_dir>
    runnable_state_at_design: >-
      Implementation committed and smoke-tested at reduced size in the design
      session (no run record was written from the smoke test). Not selectable
      by tools/newest_experiments.py until a Coordinator approval decision
      sets status approved, and then its execution_progress reads
      needs_implementation_or_plan until a dispatch task and a frozen
      trial-plan.json exist. The missing pieces are the approval ceremony
      (DEC-*, TASK-*, handoff) and the trial plan, not code.
  assigned_to: executor
