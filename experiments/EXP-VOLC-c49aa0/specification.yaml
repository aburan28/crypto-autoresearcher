experiment:
  id: EXP-VOLC-c49aa0
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-4f43ac
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: WHAT IS A FREE LEVEL WORTH? End(E) admits a short certificate so verification is asymptotically
    cheaper than computation, and class-level volcano data amortizes to zero over many targets --
    but a level oracle is a CURVE-ONLY CONSTANT and therefore trivially generic-group-simulable, so
    granting it for free changes nothing for any algorithm that does not also consume R1/R2/R5; the
    measurable corollary is that an x-coordinate-indexed precomputation does NOT transport across
    an isogeny, which answers lane L13's sharp question in the negative with a mechanism
  status: draft
  objective: '(A) THE ASYMMETRY. KN-LIT-251 (Bisson-Sutherland, "Computing the endomorphism ring of
    an ordinary elliptic curve over a finite field", arXiv:0902.4670) records as a key claim: "As
    a byproduct, our method yields a short certificate that may be used to verify that the endomorphism
    ring is as claimed." THE ABSTRACT WAS READ; THE PAPER WAS NOT. Taking that claim at face value
    pending Stage 0 verification, End(E) sits in a verify-much-cheaper-than-compute regime. The same
    asymmetry holds, and is derivable here without citing anyone, for the volcano LEVEL: a descending
    path from E to the ell-floor, given as a list of j-invariants with kernel polynomials, is verified
    in O(h) Velu steps, whereas FINDING it costs O(ell * h^2) because each step must try up to ell+1
    neighbours. Verification is therefore cheaper by a factor of about ell * h, and this ratio is
    directly measurable at toy scale.

    (B) THE AMORTIZATION, WHICH SPLITS INTO A TRIVIAL CASE AND A REAL ONE. Class-level volcano data
    -- D_K, c, every height v_ell(c), the whole shape of every volcano -- depends ONLY ON THE TRACE
    t, hence is identical for every curve in the isogeny class. So it is computed once per class and
    amortizes to exactly zero over M targets. Per-CURVE level data does not amortize, but in the standard
    multi-target setting all targets live on ONE curve, so it is computed once too. THE ONLY SETTING
    WHERE LEVEL COST DOES NOT VANISH is multi-target across DIFFERENT curves of one class, and this
    record shows below that the setting has a much bigger problem than the level cost.

    (C) THE PUNCHLINE, AND IT IS A CLOSURE. Suppose the level -- or the whole endomorphism ring --
    is handed to the attacker for free. Does anything change? THE LEVEL IS A FUNCTION OF THE CURVE
    ALONE. It does not depend on P, on Q, or on k. In the generic group model the curve is not part
    of the model at all; an oracle returning a fixed, publicly determined constant is simulated by
    a simulator that stores that constant and returns it. Hence A LEVEL ORACLE, AND INDEED AN End(E)
    ORACLE, IS GENERIC-GROUP-SIMULABLE, and by the Shoup bound an algorithm whose only other access
    is the group oracle remains at exponent 1/2. This is the same argument shape KN-FIND-b7e091 uses
    to close the incidence and endomorphism-image oracles, applied to a new oracle class, and it is
    exactly the audit DECOMPOSITION lane L12 exists to perform. CONSEQUENCE FOR THIS LANE: a free
    level can only help an algorithm that also consumes R1, R2 or R5. Combined with IDEA-20260807-3c6bd8''s
    finding that small-ell levels are cheap anyway, the cost of learning the level is simply not where
    the difficulty lives, in either direction.

    (D) THE MEASURABLE COROLLARY -- PREPROCESSING DOES NOT TRANSPORT. Lane L13 asks: does a table
    built on E retain value on E'' after transport? Here is a mechanism and a prediction. Index-calculus
    preprocessing is indexed by the FACTOR BASE, which is a set of x-COORDINATES defined by a vanishing
    or smallness condition (for example x < B, or x in a fixed subset V). An isogeny phi does NOT
    preserve x-coordinates: phi acts on x by a rational map of degree deg(phi), so the image of a
    smallness-defined factor base is a set of the same cardinality with, by prediction, NO smallness
    structure at all -- the fraction of phi(V) lying below B should be B/p, the value for a uniform
    random set. THE PREDICTION IS FALSIFIABLE IN BOTH DIRECTIONS: if some structure survives, even
    at degree 2, then preprocessing partially transports, L13 has a positive, and the surviving structure
    is an object worth naming. If nothing survives at degree 2, then transport destroys preprocessing
    at the very first step and L13''s question is answered negatively with a mechanism rather than
    a shrug.'
  resource_label: R8 (multi-instance / preprocessing structure), audited against R3/R4 acquisition
    cost; the transport measurement consumes R1
  admissibility: admissible
  admissibility_argument: 'Parts (A) and (B) are cost accounting and consume nothing. Part (C) is
    an ADMISSIBILITY VERDICT and it is negative: it establishes that a level oracle or an End(E) oracle
    is GGM-simulable, hence that any proposal consuming ONLY that oracle plus the group operation
    is inadmissible_generic_group and closed at exponent 1/2. Part (D) is admissible because the measured
    quantity is the distribution of x-COORDINATES as field elements (R1), which is not a group output
    and not simulable by the group oracle. The record therefore contains both an admissible measurement
    and an explicit inadmissibility finding, and labels which is which.'
  reachability_gate: 'THIS RECORD MOVES BETWEEN CURVES ONLY IN CLAIM (D), AND THE MOVE IS CHEAP AND
    ARBITRARY: any isogeny of degree 2, 3, 5, 7 will do, since the prediction is about the destruction
    of structure and not about arriving anywhere in particular. No good object needs to be reached,
    so the gate is passed trivially. The gate''s relevance is INVERTED here: the record''s finding
    is that even if a good curve WERE reachable, an x-coordinate-indexed precomputation could not
    be carried to it. That is a constraint on every future proposal that hopes to combine reachability
    with preprocessing, and it is cheaper to establish now than after such a proposal is built.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE for claim (A)): read KN-LIT-251 and record what the
      certificate actually is and what it verifies. If the certificate claim is weaker than the abstract
      suggests, claim (A)''s first half is restated and the derived level-certificate half stands
      alone. STAGE 1 (minutes): write the simulator of claim (C) and check it on the tested family,
      including at least one adaptive query. STAGE 2 (hours): certificate find-versus-verify measurement
      over ell in {2, 3, 5} and h in {1, 2, 3}. STAGE 3 (hours): the transport measurement of Step
      4 with N1, N2, N3. STAGE 4 (minutes): the amortization schedule arithmetic. This test needs
      the ell in {2,3} Velu code and the existing Semaev harness; no new heavy machinery.'
    mechanism: 'STEP 1 -- CERTIFICATE ASYMMETRY, MEASURED. Implement the level certificate: a descending
      path (list of (a, b) or j, plus the kernel polynomial and claimed direction at each step) from
      E to the ell-floor. Measure (i) the cost of FINDING it by Fouquet-Morain descent, (ii) the cost
      of VERIFYING a given path (recompute each Velu step, check each trace equals t, check the final
      vertex has exactly one rational ell-neighbour). Report the ratio as a function of (ell, h).
      Predicted ~ ell * h; measured is what counts. STEP 2 -- AMORTIZATION SCHEDULE. Compute, for
      M targets, the per-target cost of level knowledge in three settings: (a) all targets on one
      curve -- amortizes to zero; (b) targets spread over M distinct curves of one class -- per-target
      level cost stands, class data still amortizes; (c) targets spread over distinct classes -- nothing
      amortizes. Report the break-even M for each. This is arithmetic on the costs measured in IDEA-20260807-3c6bd8
      and needs no new compute. STEP 3 -- THE SIMULABILITY ARGUMENT, WRITTEN OUT. Give the explicit
      simulator for a level oracle: on input "level of E", return the value stored at setup. Note
      the one condition under which the argument fails -- if the algorithm is allowed to CHOOSE the
      curve adaptively and the oracle answers about curves the simulator did not anticipate. Handle
      it: the level is computable from public data in the cost established by IDEA-20260807-3c6bd8,
      so the simulator computes it rather than storing it, at a cost that is polynomial for small
      ell. The argument is therefore uniform over adaptively chosen curves at small ell, and is stated
      as conditional at large ell. That conditionality is a real gap and it is named, not hidden.
      STEP 4 -- THE TRANSPORT MEASUREMENT. Fix a curve E and a smallness-defined factor base V = {x
      on E : x < B}. Apply phi of degree 2, 3, 5, 7 (composing to reach larger degrees), and after
      each step record: the fraction of the image x-coordinates below B; the Kolmogorov-Smirnov distance
      of the image x-distribution from uniform on [0, p); and the relation yield of an index calculus
      run using the IMAGE set as its factor base, compared against a fresh smallness-defined base
      of the same size on the codomain. STEP 5 -- THE NULL AND THE VERDICT. Compare against a random
      size-matched subset of the codomain''s x-coordinates (the "already destroyed" reference) and
      against the codomain''s own smallness base (the "not destroyed" reference). The image must sit
      at the first if the prediction holds.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - uniform random size-matched subset on the codomain (N1)
  - fresh smallness-defined base on the codomain (N2, blocking positive control)
  - identity isogeny (N3)
  - KN-FIND-b7e091's endomorphism-image simulator re-run for cross-agreement
  - matched rho and BSGS on domain and codomain, which must agree
  - "NULL OBJECT (from the proposal): (N1) THE RANDOM-SUBSET NULL, primary: a uniformly random size-matched\
    \ subset\n  of the codomain's x-coordinates. The transported factor base must be\n  STATISTICALLY\
    \ INDISTINGUISHABLE from this if the destruction prediction\n  holds. This is the \"structure\
    \ fully destroyed\" reference.\n(N2) THE FRESH-BASE POSITIVE CONTROL: a smallness-defined base\
    \ built directly\n  on the codomain. It must be clearly DISTINGUISHABLE from N1 on the same\n\
    \  statistics, or the instrument cannot detect the structure it is claiming is\n  destroyed, and\
    \ every negative it produces is void. This positive control is\n  blocking and is the more important\
    \ of the two.\n(N3) THE IDENTITY CONTROL: phi = identity (degree 1). The statistic must be\n \
    \ unchanged. A pipeline that reports destruction under the identity map is\n  broken.\nDECAY PARAMETER:\
    \ the isogeny degree, and the number of composed steps. Genuine structure should decay MONOTONICALLY\
    \ toward the N1 reference as degree or step count grows; the record's prediction is total collapse\
    \ at the first step, so the honest artifact tell here is the OPPOSITE of the usual one: a statistic\
    \ that stays away from the uniform value at high degree, and does so without a named mechanism,\
    \ is the suspicious observation."
  independent_variables: []
  metrics:
    primary:
    - find cost and verify cost per certificate, per (ell, h)
    - smallness fraction and KS distance to uniform, per isogeny degree and step
    - relation yield per factor-base variant
    - the simulator's transcript agreement rate
    secondary:
    - break-even M per amortization setting
    - pass/fail of every control, with N2's separation reported as an effect size
  heuristic_under_test: null
  preregistered_prediction:
    quantity: (cost of finding a level certificate) / (cost of verifying it), as a function of (ell,
      h)
    formula: Ratio at least 3 at ell = 3, h = 2, and growing with both ell and h, fitted against the
      predicted ell * h. A ratio near 1 means the certificate carries no asymmetry and claim (A)'s
      level half is wrong.
    source: pre-registered in IDEA-20260807-4f43ac before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - The x-coordinate map identifies P and -P, so a factor base of x-coordinates corresponds to twice
    as many points; the cardinality bookkeeping across an isogeny must be exact or the "same size"
    comparisons are wrong by a factor of two.
  - At small p, B/p is not small and the uniform reference is close to the structured one, destroying
    the contrast. B and p must be chosen so N2 separates from N1 by a large effect size BEFORE any
    transport is measured.
  - Composing many small isogenies is not the same as one large isogeny; the record measures composed
    small ones because that is what is implementable, and must say so rather than claiming a result
    about large-degree maps.
  - The "short certificate" of KN-LIT-251 may certify the RING and not the LEVEL, which are different
    objects. The record must not silently substitute one for the other, and the derived level certificate
    exists precisely so it does not have to.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Ratio at least 3 at ell = 3, h = 2, and growing with both ell and h, fitted against
    the predicted ell * h. A ratio near 1 means the certificate carries no asymmetry and claim (A)'s
    level half is wrong.
  falsification_criterion:
  - The simulator of claim (C) cannot be constructed for adaptively chosen curves even at small ell.
    The level oracle is then NOT simulable and the closure fails -- which would be a significant positive
    and would need independent review before anything else in this record is used.
  - Certificate find/verify ratio near 1. Claim (A)'s level half is false; the certificate has no
    value as a certificate.
  - Transported factor base retaining measurable smallness structure after a degree-2 isogeny, with
    N2 passing. Preprocessing partially transports; L13 has a positive and this record's central prediction
    is refuted.
  - N2 failing to separate from N1 -- the instrument cannot tell a structured base from a random one.
    Every transport negative is then void; this is an instrument failure, not a mathematical result.
  - Reading KN-LIT-251 shows the certificate claim does not exist as relayed. Claim (A)'s citation
    half is withdrawn; the derived half stands.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
