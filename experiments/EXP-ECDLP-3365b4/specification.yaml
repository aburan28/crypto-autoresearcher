      quantity: The union 6 and the product 451/500.
      formula: A point is covered when some iterate of order at most the cap lands in the stored set.
        The cost is the mean truncated distance divided by the covered fraction. The constant is table
        size times the square of the cost, divided by the point count. The band products are 11/20 and
        17/20 times 41/25. The series bound uses the partial sum through k = 8 and a geometric tail.
      source: IDEA-20260923-c2a85f states the cover and the band, read 2026-10-02. The counts were computed
