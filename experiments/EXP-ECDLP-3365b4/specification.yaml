  success_criterion: Both separately allocated route runs pass the original controls and agree on complete
    canonical witnesses/measurements; both declared clipping arms match their exact fixed definitions
    and prospective finite sums (path15/17,cycle18/22), with every original rational worksheet predicate
    and the clipD prediction comparison recorded explicitly. The clipDplus1 profile is descriptive; its
    exact finite values remain available for later independent per-arm comparison without claiming a second
    runtime prediction_match flag. This criterion accepts only complete deterministic descriptive verification
    and does not close or re-score the original ambiguous contract.
  falsification_criterion: The two routes agree and original controls remain valid, but some exact named
    clipping-definition/sum or original non-clipping rational predicate is not satisfied. Retain the exact
    scoped miss. A source/provenance/control failure or route disagreement invalidates implementation;
    it does not refute a generic ECDLP statement. Original cost/table predicate misses under either convention
    are recorded under that arm without silently selecting a convention.
