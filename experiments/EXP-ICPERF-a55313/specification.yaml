# =============================================================================
# EXP-ICPERF-a55313 -- Frozen contract for H-ICPERF-c9380d: residual
# Groebner-column measurability (BRiAl + d_solv + C3 discrimination) after
# C1 discharge by EV-ICPERF-390707 / EXP-ICPERF-e21835.
#
# Source: IDEA-20260915-3476de under RQ-ICPERF-94c86e / GOAL-ICPERF-e6b6a4.
# Approved: DEC-20261002-dc4cbc. Snapshot: TASK-20261002-af04f5.
# Executor: TASK-20261002-256f5c.
#
# Revisit_condition of DEC-20260916-3c0cf5 rank-5 met (BATCH-a33cda closed
# by DEC-20260915-927eaa). PTR-ICPERF (DEC-20260928-63addc) routes design
# to this goal's owner. Stages 0-3. ZERO RUNS in the design session.
# No AUXIN. No Bedrock. Claim tier: measurement / tooling.
# =============================================================================
experiment:
  id: EXP-ICPERF-a55313
  version: 1
  hypothesis_id: H-ICPERF-c9380d
  question_id: RQ-ICPERF-94c86e
  source_idea: IDEA-20260915-3476de
  related_idea_ids:
    - IDEA-20260915-eee7e4
    - IDEA-20260915-69941f
  goal_id: GOAL-ICPERF-e6b6a4
  designed_by_task: TASK-20261002-af04f5
  snapshot_task: TASK-20261002-af04f5
  executor_task: TASK-20261002-256f5c
  title: >-
    Residual Groebner column: Stage-0 C1 discharge bind; Stage-1 n15l5-1-S
    RLIMIT_AS vs RSS-watchdog regression; Stage-2 BRiAl (+slimgb) panel on
    (15,5)/(17,6)/(19,6); Stage-3 d_solv parse + nulls + exactly one O-*
  status: approved
  approved_by: DEC-20261002-dc4cbc
  approval:
    approved_by: DEC-20261002-dc4cbc
    standing_authorization: >-
      AGENTS.md standing user authorization (2026-09-06). Protocol complete;
      Coordinator checked required fields before approving.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    execution_state: approved frozen contract; awaiting /run under TASK-20261002-256f5c

  objective: >-
    (1) Freeze Stage-0 worksheet binding C1 discharge to EV-ICPERF-390707
    joint V2 and EXP-ICPERF-e21835 (BATCH-a33cda closed). (2) Stage-1
    regression: n15l5-1-S under RLIMIT_AS 6 GB control vs repaired RSS
    watchdog arm. (3) Stage-2: install/freeze BRiAl (or name O-C2-FAIL);
    run S/U panels at (15,5), (17,6), (19,6) under BRiAl and Singular
    slimgb; compare to WDSat baseline medians. (4) Stage-3: parse d_solv
    and matrix dimensions; run matched nulls; emit exactly one O-* label.
    Observations only.

  claim_tier: measurement
  claim_tier_note: >-
    Tooling / boundary-table measurement. No IC-vs-rho claim, no deployed-
    curve verdict, no exponent move. Missing BRiAl → O-C2-FAIL, never
    evidence that H-C3 is structural.

  class: measurement
  class_note: >-
    Cost-model / instrument measurement with a pre-registered comparative
    prediction (H-C3). Not a heuristic-validation of an asymptotic theorem.

  inputs:
    proposal: ledger/proposals/IDEA-20260915-3476de.yaml
    hypothesis: ledger/hypotheses/H-ICPERF-c9380d.yaml
    decision: ledger/decisions/DEC-20261002-dc4cbc.yaml
    question: ledger/questions/RQ-ICPERF-94c86e.yaml
    c1_discharge_evidence: ledger/evidence/EV-ICPERF-390707.yaml
    repaired_instrument: experiments/EXP-ICPERF-e21835/specification.yaml
    repaired_code: experiments/EXP-ICPERF-e21835/code/bench.py
    predecessor_row: experiments/EXP-ICPERF-66fd51/specification.yaml
    predecessor_run: experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/
    weakened_hypothesis: ledger/hypotheses/H-ICPERF-cc4847.yaml
    successor_hypothesis: ledger/hypotheses/H-ICPERF-2c57cc.yaml
    draft_consumer_row: experiments/EXP-ICPERF-13f001/specification.yaml
    ranking_decision: ledger/decisions/DEC-20260916-3c0cf5.yaml
    batch_close_decision: ledger/decisions/DEC-20260915-927eaa.yaml
    pointer_decision: ledger/decisions/DEC-20260928-63addc.yaml
    off_limits:
      - Editing IDEA-20260915-3476de claim text.
      - Editing shared ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml.
      - Approving or amending EXP-ICPERF-13f001 under this card.
      - Magma F4 / AUXIN as success path.
      - Amazon Bedrock.
      - Any ECDLP attack / exponent / deployed-curve claim.
      - Treating missing BRiAl as evidence that P2 is structural.
      - Re-opening C1 as a new discovery (Stage 1 is regression only).

  controls:
    - name: rlimit_as_abort_reproduction
      description: >-
        Stage 1 arm (a): RLIMIT_AS 6 GB on n15l5-1-S must reproduce the
        historical abort signature before the repaired arm is believed.
    - name: rss_watchdog_repaired_arm
      description: >-
        Stage 1 arm (b): no RLIMIT_AS, 250 ms VmHWM poller, kill at 5.5 GB
        (or e21835's accepted ceiling), 600 s wall.
    - name: wdsat_baseline_medians
      description: >-
        WDSat default medians on the same cells, reproduced or cited from
        archived RUN-ICPERF-305ca3 / accepted successor rows before ratios.
    - name: matched_boolean_nulls
      description: >-
        18 matched random Boolean null objects from the 305ca3 / e21835
        generation, Stage 3.
    - name: singular_slimgb_secondary
      description: >-
        Singular slimgb in a Boolean quotient as secondary Groebner arm;
        does not substitute for a failed BRiAl C2 gate.

  independent_variables:
    - name: cell
      levels: ['(15,5)', '(17,6)', '(19,6)']
    - name: instance_label
      levels: [S, U]
    - name: groebner_engine
      levels: [brial, singular_slimgb, macaulay2_f4_watchdog]
    - name: limit_mode
      levels: [rlimit_as_6gb, rss_watchdog_no_rlimit]

  primary_metrics:
    - name: outcome_label
      definition: >-
        Exactly one of O-STRUCTURAL / O-ENGINE / O-C2-FAIL / O-C1-REGRESS /
        O-ARTIFACT / O-IMPEDIMENT.
    - name: best_groebner_over_wdsat_median_wall_ratio
      definition: >-
        median(wall_s, best finishing Groebner) / median(wall_s, WDSat
        default) per cell; finishing counts beside every median.
    - name: brial_S_completion_rate
      definition: Fraction of S instances completed within 900 s per l=6 cell.
    - name: d_solv_recorded_fraction
      definition: Fraction of finishing Groebner rows with parsed d_solv.
    - name: stage1_control_abort_reproduced
      definition: Boolean; RLIMIT_AS arm matches historical abort signature.

  secondary_metrics:
    - name: peak_rss_bytes
      definition: Peak RSS / VmHWM beside every timed invocation.
    - name: wall_clock_seconds
      definition: Wall clock per instance and per-arm aggregate.
    - name: macaulay_matrix_dims_by_degree
      definition: Per-degree (rows, cols) where the engine exposes them.
    - name: non_finishing_count
      definition: Timeouts / watchdog kills / crashes per (cell, engine).
    - name: engine_version_build_hash
      definition: Recorded for every engine used.

  seeds_and_replication:
    master_seed: 20261002ic
    structured_S_per_cell: 10
    structured_U_per_cell: 10
    null_instances: 18
    cheapest_discriminator: >-
      Stage 1 n15l5-1-S two-arm regression (at most 600 s + control abort).
    replication: >-
      Single primary replication under this card; seeds and instance IDs
      frozen in stage0/preregistered-predictions.json. Second seed out of
      scope unless O-ARTIFACT triggers a repair amendment.

  budget:
    wall_clock_seconds: 21600
    memory_gb: 6
    maximum_runs: 3
    cpu_note: >-
      Advisory. Stage 0 zero compute. Stage 1 <=1200 s. Stage 2 ordered
      l=5 first; stop per-cell after 5 consecutive timeouts on an engine.
      Freeze scientific sample counts; do not expand cells with leftover
      wall clock.

  stopping_rules:
    - Stage 0 must freeze C1 discharge citations and H-C3 band before Stage 1 metrics are read.
    - Stage 1 control abort failure → O-C1-REGRESS / O-ARTIFACT; do not read C3.
    - BRiAl install failure or <5/10 S at an l=6 cell → O-C2-FAIL; still record Singular/M2 rows if obtained; do not claim O-STRUCTURAL.
    - Missing Magma / AUXIN / Bedrock must not be used as success path.
    - Timeout / OOM / crash outside named gates → O-IMPEDIMENT / failed_infrastructure; never negative evidence against H-C3.
    - After exactly one O-* is decided, stop.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze invalidates subsequent stages.
    - Changing engine version, watchdog ceiling, or seed mid-panel without amendment invalidates ratios.
    - Treating O-C2-FAIL as support for O-STRUCTURAL is a scope defect.
    - Any attack / exponent / deployed-break claim in RESULTS.md invalidates the scientific read.
    - Approving EXP-ICPERF-13f001 inside this card's write_scope is out of scope.

  success_criterion: >-
    Decidable from the primary metrics before any run. The experiment
    SUCCEEDS as a measurement (either scientific direction) when all of:
    (1) Stage 0 worksheet present binding C1 discharge to EV-ICPERF-390707
    joint V2 and EXP-ICPERF-e21835, with H-C3 band and cell list frozen in
    stage0/preregistered-predictions.json before Stage 1; (2) Stage 1
    control abort reproduced OR exactly one of O-C1-REGRESS / O-ARTIFACT /
    O-IMPEDIMENT named with no C3 read; (3) exactly one O-* label in
    RESULTS.md decidable from primary metrics alone; (4) peak RSS reported
    beside every timed stage; engine name/version/build hash recorded for
    every engine used OR O-C2-FAIL / O-IMPEDIMENT named for absence;
    (5) Magma F4 / AUXIN / Bedrock were not used as the success path.
    Scientific direction (structural vs engine vs C2-fail) is read from the
    O-* label and does not alter success-as-measurement.

  falsification_criterion: >-
    Stated before any run, scoped to cells (15,5)/(17,6)/(19,6) on this
    host. H-ICPERF-c9380d's H-C3 (structural gap) is falsified by O-ENGINE
    (any l=6 cell best-Groebner/WDSat median wall ratio <10 with finishing
    rows and intact controls). O-C2-FAIL means H-C3 is untested, not
    supported. Stage 1 regression failure is O-C1-REGRESS / O-ARTIFACT
    (instrument), not directional evidence about H-C3. Timeout / crash /
    missing binary outside the C2 gate is O-IMPEDIMENT /
    failed_infrastructure, never negative mathematical evidence. No
    outcome under this card asserts an IC-vs-rho, deployed-curve, or
    exponent claim.

  success_criteria:
    - Stage 0 C1 discharge worksheet + preregistered predictions frozen before Stage 1.
    - Stage 1 control abort reproduced or named O-C1-REGRESS/O-ARTIFACT/O-IMPEDIMENT.
    - Exactly one O-* label in RESULTS.md from primary metrics alone.
    - Memory beside time; engine provenance recorded or named absence outcome.
    - No Magma/AUXIN/Bedrock success path.

  falsification_criteria:
    - Per H-ICPERF-c9380d falsification_criteria (O-ENGINE, O-C2-FAIL, O-C1-REGRESS, C4).

  required_artifacts:
    - experiments/EXP-ICPERF-a55313/stage0/preregistered-predictions.json
    - experiments/EXP-ICPERF-a55313/stage0/c1-discharge-note.md
    - experiments/EXP-ICPERF-a55313/stage1/n15l5-1-S-regression.json
    - experiments/EXP-ICPERF-a55313/stage2/engine-provenance.json
    - experiments/EXP-ICPERF-a55313/stage2/panel-rows.jsonl
    - experiments/EXP-ICPERF-a55313/stage3/d_solv-and-nulls.json
    - experiments/EXP-ICPERF-a55313/runs/<RUN-ICPERF-*>/
    - experiments/EXP-ICPERF-a55313/RESULTS.md

  stages:
    - id: 0
      name: c1_discharge_bind
      description: >-
        Bind EV-ICPERF-390707 joint V2 and EXP-ICPERF-e21835 watchdog
        citations; freeze H-C3 band, cells, seeds, and WDSat baseline
        pointers; record BATCH-a33cda closed (DEC-20260915-927eaa) as the
        met revisit_condition.
      compute: none
    - id: 1
      name: n15l5_regression
      description: >-
        Two-arm n15l5-1-S: RLIMIT_AS 6 GB control vs RSS-watchdog repaired
        arm; record exit, wall, cpu, peak RSS, gbTrace.
      compute: regression
    - id: 2
      name: brial_panel
      description: >-
        Install/freeze BRiAl or name O-C2-FAIL; run S/U panels at three
        cells under BRiAl and slimgb; Macaulay2 watchdog arm optional for
        l=5 continuity; ordered l=5 first.
      compute: measurement
      cheapest_valid_discriminator: BRiAl install probe + (15,5) S subset
    - id: 3
      name: dsolv_nulls_adjudication
      description: >-
        Parse d_solv / matrix dims; run matched nulls; compute ratios;
        emit exactly one O-*.
      compute: adjudication

  protocol_amendments_path: experiments/EXP-ICPERF-a55313/amendments/
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
