experiment:
  id: EXP-POLYMAC-f5114e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-258c69; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-258c69
  question_id: RQ-POLYMAC-7c89e4
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive joint measurement of per-key forgery exposure and per-key commitment participation
    in toy binary-field and prime-field polynomial MACs, with a marginal-preserving relabelling null
    and an order-class cross-tabulation
  objective: The uncertainty reduced is whether the keys exposed to forgery are the keys that participate
    in commitment collisions, in either field. (i) Compute, for every key in a toy key space, a forgery-exposure
    statistic by exhaustive enumeration of achievable difference polynomials, so the first coordinate
    is counted rather than sampled. (ii) Compute, for every key, a commitment-participation statistic
    by a full quadratic pass over key pairs under a bounded and swept search budget, with the budget
    sweep demonstrating saturation so the count is a property of the key and not of the budget. (iii)
    Measure the dependence between the two coordinates and compare it against a 200-draw relabelling
    null that preserves both marginals exactly, plus a partial correlation controlling for message
    length and a cross-tabulation against multiplicative-order class, so that any reported association
    survives the two obvious alternative explanations before it is called an association. The run
    does not reduce uncertainty about commitment at deployed parameters, which belongs to a different
    question entirely.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at n = 12 (and n = 14 if budget allows),
      for the declared toy constructions and the declared statistic definitions, the joint distribution
      of forgery exposure and commitment participation over the entire key space is exactly the tabulated
      one, with the tabulated correlation and its position relative to the relabelling null. WHAT
      DOES NOT FOLLOW: nothing about key commitment in AES-GCM or ChaCha20-Poly1305, nothing about
      forgery at deployed parameters, no certificate, no attack, no security consequence, and no claim
      that the toy commitment condition is the deployed one beyond what the hand-verified example
      check establishes.'
  inputs:
    procedure: 'STAGE 0 (cost: a day, human): freeze both statistic definitions, the toy commitment
      condition, the search budget ladder, and the hand-verified example set. STAGE 1 (cost: minutes):
      implement each statistic twice, independently, and cross-check on the shared sanity cases. STAGE
      2 (cost: minutes): compute forgery exposure for all keys in both fields via the shared enumeration.
      STAGE 3 (cost: tens of minutes): compute commitment participation by a full quadratic pass at
      the smallest budget, then repeat at doubled budgets until saturation. STAGE 4 (cost: seconds):
      form the joint histogram and correlations. STAGE 5 (cost: minutes): run 200 relabellings through
      the identical correlation code. STAGE 6 (cost: minutes): run the random-function control and
      the order-class cross-tabulation. STAGE 7 (cost: seconds): emit the manifest, the joint tables
      and the null interval.'
    instrument: Python 3 standard library; binary field by shift-and-XOR with pinned reduction polynomial,
      prime field with native int. Forgery exposure from the shared achievable-difference enumeration
      module used across this batch. Commitment participation from an independently written solver
      for the toy collision condition, deliberately not sharing code with the forgery path. Correlations
      and permutation nulls computed in plain Python (or numpy for tabulation only). Manifest and
      inference block via harness/runner.py. No Sage, no network, no external statistics package for
      the null.
    parameters: 'Widths n = 12 primary and n = 14 if budget allows, both fields, five primes per width
      for the prime arm. Message length L in {2, 4, 8} with L = 4 as the primary slice. Commitment
      search budget b in {2^8, 2^9, 2^10, 2^11} per key pair, swept for saturation. Relabelling null:
      200 draws. Random-function control: 32 instances. Achievable-difference family capped at 2^16
      per (field, L) given the lower width.'
  controls:
  - Relabelling null preserving both marginals exactly, 200 draws, same invocation.
  - Random-function digest control where neither predicate has algebraic structure.
  - Independent implementations of the two statistics with no shared code path, so a correlation cannot
    arise from a common bug.
  - Search-budget sweep on the commitment statistic to confirm saturation rather than budget-driven
    counts.
  - Hand-verified example set at the smallest width confirming the toy commitment condition reproduces
    known-by-construction collisions.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The RELABELLING NULL: recompute the commitment statistic against a
    uniformly random relabelling of the key space, so that both marginal distributions are preserved
    exactly and any real key-to-key association is destroyed. Run 200 relabellings in the same invocation
    and record the resulting distribution of the correlation coefficient. For the signal to mean anything,
    the observed correlation must lie outside the central 99 percent of the null distribution; if
    it lies inside, the record reports independence with that interval, which is the useful negative.
    A second control computes both statistics for a random-function digest, where neither predicate
    has algebraic structure - both marginals should collapse to their generic values, and if they
    do not, the statistics are picking up something other than the construction.'
  independent_variables:
  - field type (binary extension, prime, random-function control)
  - message length L
  - commitment search budget b
  - choice of prime within a width
  metrics:
    primary:
    - per-key forgery-exposure statistic
    - per-key commitment-participation count
    - Spearman and Pearson correlation per field
    - position of the observed correlation within the relabelling-null distribution
    - partial correlation controlling for L
    secondary:
    - joint histogram cell counts
    - saturation curve of participation against budget
    - order-class cross-tabulation with permutation p-value
    - marginal distributions of both statistics
    - wall clock per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The Spearman correlation rho between per-key forgery exposure and per-key commitment
      participation, in each field at fixed L, and its position relative to the central 99 percent
      interval of the 200-draw relabelling-null distribution of the same statistic.
    formula: 'Forgery exposure e(k) = max over achievable difference polynomials D with D(k) = 0 of
      |roots(D)| / |key space|, with e(k) = 0 if no achievable D vanishes at k. Commitment participation
      c(k) = number of keys k'' not equal to k for which the toy collision condition is satisfiable
      within budget b. Predicted: the relabelling null''s rho distribution is centred on zero within
      0.02; an observed rho is called real only if it falls outside that distribution''s central 99
      percent.'
    source: Pre-registered in the parent proposal IDEA-20260816-258c69 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'n = 12 to 14 is set by the quadratic pass over key pairs, not by the forgery side,
      and is the largest width at which the joint distribution is exactly computable rather than sampled.
      There is no extrapolation to deployed widths and none is offered: the contract''s transfer assumption
      is nil, and the record''s value is the existence and sign of a dependence structure at a scale
      where it can be seen completely.'
    correspondence: null
  tail_checks:
  - keys with zero forgery exposure (no achievable polynomial vanishes there) must be handled explicitly,
    not dropped, since they may be a large fraction at small L
  - the identity key and any key of very small multiplicative order must be inspected individually,
    as they are the most likely to be outliers in both coordinates
  - the largest budget must show participation counts unchanged from the previous budget for at least
    95 percent of keys, or saturation is not established
  - the smallest width must reproduce the hand-verified collision examples exactly
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - halt if the two independent implementations of either statistic disagree on any sanity case
  - stop the budget sweep once 95 percent of keys show unchanged counts across a doubling, and record
    the budget at which that occurred
  - cap total wall clock at 7200 seconds; on exceeding, drop n = 14 and the five-prime sweep to one
    prime and record the reduction
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both statistics are computed for every key in both fields in one invocation,
    the relabelling null is centred on zero within 0.02, saturation is established under the budget
    sweep, and the observed correlation is reported with its position in the null distribution and
    its partial-correlation counterpart.
  falsification_criterion:
  - relabelling null not centred on zero
  - no saturation under the budget sweep
  - independent implementations disagree
  - hand-verified collision examples not reproduced
  - random-function control shows structured marginals
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-258c69
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The toy commitment condition must be ratified by the Coordinator as an analogue of the full collision
    condition, and the hand-verified example set must be agreed before freezing; this is the contract's
    largest open item.
  - Whether a witness count is an acceptable second coordinate, or whether a cost measure is required,
    is a Coordinator decision that changes the instrument.
  - Coordination with RQ-AEADC-8db132 is required so that this contract does not duplicate or contradict
    the nine commitment proposals filed there; the Coordinator must rule on which question owns the
    record.
  - The width cap follows from the quadratic pass; if a subquadratic formulation of the participation
    statistic exists, the Coordinator should require it before approval.
