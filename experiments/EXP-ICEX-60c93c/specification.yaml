experiment:
  id: EXP-ICEX-60c93c
  hypothesis_id: H-ICEX-ce1915
  derived_from_idea: IDEA-20260808-2ef5c8
  question_id: RQ-ICEX-001
  batch_id: BATCH-a70dc3
  version: 1
  title: >-
    Emit the two-regime alpha(theta, m) table with its identity gate and its
    exhibited identifiability collision in exact rational arithmetic, then run the
    ONE empirical cell the record actually contains- 2-way against 4-way splitting
    for the decomposition problem - with a curve-free (Z/N, +) positive control
    whose computed dynamic range is a factor of about 32
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. IDEA-20260808-2ef5c8 corrects a parent cost model by
    writing the per-trial decomposition cost as D_trial = c_D B^theta and adding
    the feasibility constraint trials at least one. H-ICEX-ce1915 re-derives the
    two regimes and verifies the parent's characterisation verbatim. What is NOT
    settled by arithmetic is HA-2's no-Wagner clause- that a k-way split does not
    beat the 2-way meet-in-the-middle when there is exactly one group constraint.
    That is the only cell in the record where a measurement can change a verdict,
    and this contract is built around it.

    (B) WHY THE SYMBOLIC ARM IS A GATE AND NOT A RESULT. The identity
    theta < m-3 iff theta/(m+1-theta) < (m-3)/4 was verified algebraically in
    H-ICEX-ce1915 by cancelling (m+1) and it CANNOT FAIL given m+1-theta
    positive. Emitting it is therefore an instrument check, not a discovery, and
    it is charged as zero compute and blocking. Its one genuine content is the
    PROVISO- the substitution d = theta/(m+1-theta) is undefined at theta = m+1
    and sign-flips beyond, which the parent record does not state, so the
    enumeration must report the cells where the proviso fails rather than skip
    them.

    (C) THE BAND FOR THE EMPIRICAL CELL, COMPUTED BEFORE ANY RUN. A 4-way k-tree
    over a single modular constraint of size N needs each of its four lists to
    reach about N^{1/3}. At N about 2^24 that is 2^8 = 256. At m = 4 each list is
    the factor base itself, so B must be 256; at m = 8 each list holds pairs, so
    binomial(B,2) at least 256 gives B at least 23 and B = 32 is used; at m = 6 a
    (2,2,1,1) split needs the singleton lists at 256, so B = 256. Under those
    choices the k-tree does about 4*2^8 list builds plus two 2^8 merges plus a
    final 2^8 merge, of order 2^11 charged operations, while the 2-way
    meet-in-the-middle at m = 4, B = 256 builds and probes a table of
    binomial(256,2) = 32640, of order 2^16. THE COMPUTED DYNAMIC RANGE IS A
    FACTOR OF ABOUT 32, which is what makes the comparison non-degenerate. A
    control that does not exhibit it means the k-tree is not implemented.

    (D) WHY A CURVE-FREE ARM IS REQUIRED HERE. Whether a k-way split helps is a
    question about whether the merge statistic is sum-compatible. Over
    (Z/N, +) a low-bit filter is sum-compatible up to carries and the k-tree is
    expected to work, so that arm is the POSITIVE control that establishes the
    instrument has dynamic range. Over E(F_p) the same filter on the
    x-coordinate is not sum-compatible, which is the whole content of the clause.
    A negative on the elliptic arm without a passing curve-free positive control
    is a fatigue report, and the contract refuses to record one.

    (E) WHAT THE CONTRACT DOES NOT DO. It does not fill the algebraic theta cell,
    because the label E2-01 that the source idea uses for it resolves to no
    committed record anywhere in this repository- verified by repository-wide grep
    for this task and independently stated in
    experiments/EXP-ICEX-c93308/specification.yaml. Every algebraic row is emitted
    parameterised in theta. It also does not close the parent's inherited
    extension-field known-answer gate, which remains UNRUN because
    IDEA-20260803-fa9839 records its own 2 - 2/n exponent as an unverified
    recollection with primary sources unreachable, and this task obtained none.
  inputs:
    cost_unit: >-
      SYMBOLIC ARM- exact rationals, dimensionless. alpha is an exponent and is
      dimensionless; theta is an exponent and is dimensionless; no quantity in
      the symbolic arm carries a physical unit and none is converted.
      EMPIRICAL ARM- charged group operations, dimensionless counts. One group
      addition equals 1 in E(F_p) and one modular addition equals 1 in (Z/N, +),
      which is the declared convention making the two arms comparable. One
      hash-table probe and one sort comparison are each charged at a single
      constant frozen here and IDENTICAL across arms and splits. Memory is
      charged in BITS and is reported beside, never divided into, any operation
      count.
    unit_discipline: >-
      BINDING. Tags in {dimensionless, group_ops, bits, count, probability,
      seconds}. Every ratio in this contract is formed within one tag- the
      k-way-against-2-way ratio is group_ops over group_ops and the memory ratio
      is bits over bits.
    frozen_operation_convention: >-
      SHARED WITH EXP-ICEX-e0c85b AND EXP-ICEX-64e821. Expected decompositions
      per uniform target is binomial(B+m-1,m)/N. The convention B^m/p is NOT used
      anywhere in this batch. Any number in this contract that a sibling contract
      also reports must be reported under this convention and against the same
      instance-set hash.
    instance_set_hash: >-
      TO BE EMITTED BY THE RUN, NOT PRE-FILLED. SHA-256 over the canonical
      serialisation of (arm, group parameters, N, factor base, arity, split,
      filter, seed) per cell, recorded in the manifest.
    theta_inputs: >-
      theta IS AN INPUT, NEVER AN OUTPUT OF THIS CONTRACT. No cell of the emitted
      table may be filled from a measured or asserted algebraic theta. Rows are
      emitted parameterised in theta with the binding constraint flagged.
  controls:
  - >-
    C1 SYMBOLIC IDENTITY GATE, ZERO COMPUTE, BLOCKING. Assert in exact rational
    arithmetic that theta < m-3 iff theta/(m+1-theta) < (m-3)/4 at every
    (m, theta) with m in 2..12 and theta in 0..m; separately enumerate and REPORT
    the cells where m+1-theta is not strictly positive rather than skipping them.
  - >-
    C2 REGIME-BOUNDARY CONTINUITY CHECK. At theta = 2 both branches must return
    alpha = 2/(m-1) exactly, at every m in 2..12. A discontinuity is an algebra
    error and blocks everything downstream.
  - >-
    C3 FEASIBILITY CHECK PER CELL. B at least 1 and trials at least 1. A reported
    optimum violating either is an instrument failure and the cell is flagged,
    not silently emitted.
  - >-
    C4 FREE-ORACLE NULL. theta = 0 must reproduce the free-oracle floor
    F(beta,m) = max(B, c_LA B^omega_LA) of IDEA-20260727-003. Disagreement
    between the two corpus cost models is itself the finding and must be reported
    as such rather than resolved by preference. NOTE- IDEA-20260727-003 was read
    by this task as a GREP FRAGMENT ONLY; the executor must open it in full
    before running this control.
  - >-
    C5 CURVE-FREE POSITIVE CONTROL, BLOCKING FOR ANY ELLIPTIC NEGATIVE. The
    identical 4-way and 2-way engines over (Z/N, +) with a low-bit filter. The
    4-way MUST cost at most 1/8 of the 2-way. If it does not, the k-tree is not
    implemented and no elliptic-arm result is admissible.
  - >-
    C6 FILTER-LEAK STATIC CHECK, BLOCKING. A static check that the elliptic arm's
    merge filter reads ONLY the x-coordinate of a group element and never the
    discrete logarithm, the factor-base index, or any value derived from the
    instance generator. A leak makes every elliptic number void.
  - >-
    C7 MEMORY-CHARGED COLUMN. Every alpha row carries a memory exponent and a
    time-memory-product column, and every empirical cell carries peak bytes. A
    conclusion surviving only in the time-only column is labelled as such.
  - >-
    C8 FIT-QUALITY CONTROL ON theta. Where any theta is fitted rather than
    supplied, report a confidence interval and a lack-of-fit statistic. A theta
    that drifts with B is reported as MODEL-INAPPLICABLE, never as a number.
  independent_variables:
  - symbolic- arity m in 2..12
  - symbolic- theta in {0, 1, 2, 3, 4, 5, m/2, ceil(m/2), m-1, 2m}
  - empirical- arity m in {4, 6, 8}
  - empirical- split k in {2, 4}
  - empirical- arm in {elliptic E(F_p), curve-free (Z/N, +)}
  metrics:
    primary:
    - >-
      alpha(theta, m) as an exact rational, with a per-cell flag naming which
      constraint binds (interior optimum or trials-at-least-one cap).
    - >-
      charged group operations for the 2-way and the 4-way split, per arm, per
      (m, B, N) cell, and their ratio (dimensionless).
    - >-
      count of distinct (theta, m) pairs mapping to a single alpha inside the
      declared box, with the pairs listed.
    secondary:
    - memory exponent per (theta, m) row and peak bytes per empirical cell
    - the MITM deficit alpha_MITM - 1/2 as an exact rational at every m
    - the (time, memory) plane placing enumeration, MITM and rho, BSGS, van Oorschot-Wiener at their optimal B
    - free-oracle null comparison against IDEA-20260727-003's F(beta, m)
    - false-positive table hits per target on the empirical arm, against the predicted Theta(B^m/N)
    - per-cell filter-leak static check result
    - list sizes actually built per k-tree level, against the required N^{1/3}
  heuristic_under_test: HA-2
  preregistered_prediction:
    quantity: >-
      The charged exponent alpha as a function of (theta, m), and the ratio of
      4-way to 2-way charged operations on each arm.
    formula: >-
      'alpha = theta/(m-1) when theta exceeds 2, and alpha = 2/(m+1-theta) when
      theta is at most 2, continuous at theta = 2 where both give 2/(m-1).
      FORCED- MITM alpha = ceil(m/2)/(m-1), equal to 2/3 at m = 4, 3/5 at m = 6,
      4/7 at m = 8; enumeration alpha = 1 at every m above 3; deficit
      alpha_MITM - 1/2 equal to 1/(2(m-1)) for even m and 1/(m-1) for odd m.
      COLLISION FORCED- (theta=2, m=6) and (theta=4, m=11) both give 2/5.
      EMPIRICAL- on the curve-free arm the 4-way costs at most 1/8 of the 2-way
      (computed range about 2^11 against 2^16, a factor of about 32); on the
      elliptic arm the 4-way costs at least as much as the 2-way.'
    source: >-
      Derived in H-ICEX-ce1915 statements (B) through (E) from the two-term
      charge of IDEA-20260803-fa9839 (opened and read in full by
      TASK-20260904-f2b3db, quoted verbatim there) plus the feasibility
      constraint, composed with the exact mean-yield identity of
      knowledge/findings/KN-FIND-007.md (also read in full). The k-tree list-size
      requirement N^{1/3} for k = 4 over a single constraint is standard
      generalised-birthday accounting and is stated here as the contract's own
      arithmetic, not as a citation.
  scale_relevance:
    tier: toy
    justification: >-
      The symbolic arm is scale-free but conditional- it converts a theta
      supplied from outside into an exponent and takes no position on any theta
      being achievable, so its tier is the tier of whatever theta is fed in and
      no theta is fed in here. The empirical arm is at N about 2^24 with B at
      most 256 and m at most 8. Transfer to cryptographic N is NOT claimed; the
      k-tree list-size requirement N^{1/3} puts a cryptographic-scale test beyond
      reachable memory, which is stated in limitations.
    correspondence: null
  tail_checks:
  - >-
    Report false-positive table hits per target against the predicted
    Theta(B^m/N). An excess signals a hashing defect, not structure.
  - >-
    Report the maximum per-target relation count against the Poisson(mu) upper
    tail for HA-1. KN-FIND-007 measured 1224x concentration for a structured
    base, so a heavy tail on a STRUCTURED base is expected and is not evidence
    against HA-1; the tail check binds on unstructured bases only.
  - >-
    Report the largest and smallest 4-way-to-2-way ratio over seeds within each
    cell. A single lucky seed may not carry a cell.
  replication:
    seeds: [3, 19, 41, 59, 83]
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 60
    maximum_workers: 1
  stopping_rules:
  - >-
    Run C1 and C2 first. Abort the whole run set on failure of either; no
    empirical cell runs against an unverified symbolic gate.
  - >-
    Run the curve-free positive control C5 before any elliptic cell at the same
    (m, B). If it fails, mark every elliptic cell at that (m, B) UNTESTED and do
    not run it.
  - >-
    Stop an empirical cell after 5 seeds complete or at the per-run wall clock,
    whichever is first.
  - >-
    Run m in ascending order 4, 6, 8. Do not start m = 8 until m = 4 and m = 6
    have completed receipts.
  invalidation_rules:
  - The symbolic identity gate C1 or the continuity check C2 fails; the whole run set is invalid.
  - The filter-leak static check C6 fails at any elliptic cell; that cell and every number derived from it are void.
  - >-
    A k-tree level builds a list smaller than N^{1/3}; the algorithm is running
    outside its regime and the cell is invalid rather than a negative.
  - Two runs of one cell with an identical seed disagree on any counted quantity.
  - Any ratio is formed across two different unit tags.
  - Wall-clock or memory exhaustion; recorded as failed_infrastructure under AGENTS.md rule 5.
  success_criterion: >-
    The contract delivers its object when- C1 and C2 pass and the proviso cells
    where m+1-theta is not positive are enumerated and reported; the alpha table
    is emitted machine-readably with exact rationals, per-cell binding-constraint
    flags, and a memory column; the identifiability collisions are enumerated
    with the pairs listed; the curve-free positive control C5 passes at every
    (m, B) where an elliptic cell is run; and the 4-way against 2-way charged
    ratio is reported per arm per cell with bootstrap intervals. Neither outcome
    of the empirical cell is called a success.
  falsification_criterion: >-
    G1 BASELINE, BLOCKING. C1 fails at any cell with m+1-theta strictly positive.
    H-ICEX-ce1915's arithmetic is wrong; void and supersede.

    G2 CONTINUITY. C2 fails at any m. The two-regime formula is misstated; void
    and supersede.

    G3 IDENTIFIABILITY. Exhaustive enumeration over the declared box finds NO
    alpha collision. The identifiability objection is withdrawn and that is
    reported as prominently as a positive.

    G4 HEADLINE FALSIFIER, THE MOST VALUABLE AVAILABLE OUTCOME. The 4-way split
    beats the 2-way in charged group operations on the ELLIPTIC arm at any
    completed cell, with C5 passing and C6 clean. HA-2's no-Wagner clause is
    falsified on the tested scope, the exponent theta_MITM = ceil(m/2) is not the
    ceiling, and the record's headline deficit 1/(2(m-1)) is void.

    G5 CURVE-FREE CONTROL, CONSEQUENCE PRE-STATED. If the 4-way does NOT beat the
    2-way on the curve-free (Z/N, +) arm, the instrument has no demonstrated
    dynamic range and NO elliptic-arm negative may be recorded- the cell is
    reported UNTESTED. If the 4-way beats the 2-way on BOTH arms by comparable
    factors, the elliptic filter is carrying information the group law does not
    supply, C6 has missed a leak, and every elliptic number is void.

    G6 INHERITED GATE, NOT CLOSED. The parent's extension-field known-answer gate
    remains UNRUN. No output of this contract may be quoted as validated against
    a known answer, and no prime-field corollary of the model may be drawn on
    that basis.

    G7 MODEL INAPPLICABILITY. Any theta supplied to the table that is fitted and
    drifts with B, or whose lack-of-fit statistic rejects the power law, makes
    the corresponding rows MODEL-INAPPLICABLE. Those rows are emitted with the
    flag and may not be quoted without it.
  required_artifacts:
  - frozen contract hash and the exact-rational transcript of C1, C2 and C3
  - the machine-readable alpha table with binding-constraint flags and memory column
  - the enumerated identifiability collisions with their (theta, m) pairs
  - the enumerated proviso-failure cells where m+1-theta is not strictly positive
  - the free-oracle null comparison against IDEA-20260727-003, with that record's full text read and cited
  - exact command, git commit, dirty-tree state, environment and dependency versions
  - all seeds, group parameters, factor bases and filter definitions per empirical cell
  - per-cell instance-set SHA-256
  - raw per-level k-tree list sizes and merge counts, per arm, per split
  - charged group operations, peak bytes and wall clock, per arm, per split, per seed
  - the filter-leak static check output per elliptic cell
  - stdout, stderr, timestamps, and per-cell validity status with reason
  assigned_to: executor
  approved_by: null
