# EXP-ECDLP-449613
# Square-gap arithmetic. No walk is run.
# Approved by DEC-20261003-7eb162.
experiment:
  id: EXP-ECDLP-449613
  hypothesis_id: H-ECDLP-9a066b
  source_idea: IDEA-20261003-51448c
  question_id: RQ-ECDLP-001
  version: 1
  title: Order 101 between two squares
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-7eb162
  objective: >-
    Check the gap 1, the gap 20, and the nearby gap 0.
  inputs:
    order: 101
    lo: 10
    hi: 11
    lo_sq: 100
    hi_sq: 121
    under_gap: 1
    over_gap: 20
    gap_sum: 21
    nearby: 100
    nearby_gap: 0
  controls:
    - >-
      Ten times ten is 100. 101 exceeds 100 by 1. Reporting 10
      squared as 101 drops that gap and invalidates the run.
    - >-
      Eleven times eleven is 121. 121 exceeds 101 by 20. The two
      gaps sum to 21.
    - >-
      At the nearby order 100, 10 squared meets the order, so the
      gap is 0.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {under, over, nearby}
    - route in {square, subtract}
  metrics:
    primary:
      - under_gap
      - over_gap
      - nearby_gap
      - implementations_agree
    secondary:
      - lo_sq
      - hi_sq
      - gap_sum
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      101 exceeds 100 by 1. 121 exceeds 101 by 20. The gap at
      order 100 is 0.
    formula: >-
      Square 10. Square 11. Subtract 100 from 101. Subtract 101
      from 121. Subtract 100 from 100.
    source: >-
      IDEA-20261003-51448c states the order 101 and the integers
      10 and 11, read 2026-10-03. The squares were recomputed in
      this design session. That computation is not a run. No walk
      was run.
  scale_relevance:
    tier: toy
    justification: One written order and two written integers. No transfer to a walk.
    correspondence: null
  tail_checks:
    - The gap 20 and the nearby gap 0 are required. A check that stops at the gap 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The square of 10 is not 100.
    - The gap is not 1.
    - The gap of 121 over 101 is not 20.
    - 10 squared is reported as 101, or a walk is run.
  success_criterion: >-
    Both runs agree that 10 squared is 100, that 101 exceeds 100
    by 1, that 11 squared is 121, and that 121 exceeds 101 by 20.
  falsification_criterion: >-
    The runs agree that 10 squared is computed, and that square
    is not 100.
  required_artifacts:
    - experiments/EXP-ECDLP-449613/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-449613/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-449613/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-449613/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-449613/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-449613/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk or scalar recovery.
    - Any claim that a gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
