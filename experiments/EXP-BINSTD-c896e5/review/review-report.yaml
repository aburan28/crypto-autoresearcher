  joints:
    - id: J1
      label: J1 validity
      verdict: holds
      finding: >-
        Two runs. RUN-BINSTD-4e0a84 raw outcome O-STAGE0-OK. RUN-BINSTD-41f31f
        raw outcome O-FAIL-BAND, matching RESULTS.md. Both receipts
        output_validated, returncode 0, check_returncode 0, check stdout OK.
        Both manifests completed_valid, code.dirty false, certificate.kind
        none, verified null. claims.break, claims.exponent_move, and
