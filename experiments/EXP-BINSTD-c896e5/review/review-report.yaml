      verdict: holds
      code_read_after_product_comparison:
        - experiments/EXP-BINSTD-c896e5/implementation/run.py
        - experiments/EXP-BINSTD-c896e5/implementation/check.py
      finding: >-
        decide() returns O-ARTIFACT when twins disagree, O-INCONCLUSIVE when
        both unique counts are 0, O-SUPPORT when nagao_rps * rho_den >=
        chained_rps * rho_numer, and O-FAIL-BAND otherwise. check.py refuses
        O-FAIL-BAND when that inequality is true, and refuses a band outcome
        without twin_ok. Archived unique counts are 4 and 5, twins_agree is
        true, and 64.57166792817132 * 1 is strictly below
        2572.3310277774244 * 1, so band_holds is false and the label is
        O-FAIL-BAND. Those implementation files were read for this label
        order after the product comparison. They are not inputs to the
        blind rederivation and are not listed in sources_read.
    - id: J3
      label: J3 replay
      verdict: holds
      finding: >-
        Copied the experiment tree to /tmp/review-binstd-c896e5, deleted
        that copy's stage1/panels.json, stage1/control-table.json, and
        RESULTS.md, and ran implementation/run.py --stage 1
        --trial-plan trial-plan-v1.json --run-dir
        /tmp/review-binstd-c896e5-stage1-run. Outcome O-FAIL-BAND,
        nagao_unique 4, chained_unique 5. Replay rps floats were
        54.79363710040227 and 2098.516684800475. Archived stage files
        were not overwritten; their sha256 values matched the pre-replay
        digests.

  proves_too_much:
