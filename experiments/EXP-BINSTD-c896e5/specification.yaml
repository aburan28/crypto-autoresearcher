    breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze V catalogs as list rows with integer n∈{17,19,23}
        and ℓ∈{3,4}, ρ=1, B=0.05s, N_rep=3, Nagao G-partition, charge
        rule; twin mul + unique-set probe.
      - >-
        Stage 1. n=17 ℓ=3 timed Nagao vs chained S_3 unique-rels/sec;
        TableField twin; N_rep null; one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Magma-missing as a scientific verdict.
      - Stage-2 remaining (n,ℓ) cells under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing ρ after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - JSON freeze files that use n as object-key strings.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-c896e5/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-c896e5/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-c896e5/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-c896e5/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-c896e5/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are Field vs
      TableField. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261002-df6215.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-b130e3.yaml
    rho_numer: 1
    rho_den: 1
    b_wall_seconds: 0.05
    n_rep: 3
    null_seeds: [2026100311, 2026100312, 2026100313]
    curve_A: 0
    curve_B: 1
    stage1_cells:
      - {n: 17, ell: 3}

  controls:
    - name: twin_field_meters
      definition: schoolbook unique relation sets == TableField sets.
    - name: ctl_matched_wall_budget_B
      definition: Both arms repeat their scan until wall ≥ B.
    - name: ctl_same_charge_rule_both_arms
      definition: rps = unique * passes / wall on both arms.
    - name: null_random_search_off_V
      definition: N_rep seeds of random x not in V; FB-hit counts recorded.
    - name: ctl_frozen_rho
      definition: ρ = 1 frozen in stage0/preregistered-predictions.json.
    - name: ctl_frozen_V_catalog
      definition: V/FB frozen as cells list of rows each with integer n.
    - name: ctl_no_n_object_keys
      definition: check.py refuses digit-string JSON object keys.
    - name: ctl_no_posthoc_rho_edit
      definition: check.py refuses mutated ρ.
    - name: ctl_no_midtick_lib_provision
      definition: No Magma/Sage/AUXIN/Bedrock success path.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_n17_ell3_race]
    - name: arm
      levels: [nagao_disjoint_coset, chained_s3]
    - name: field_route
      levels: [schoolbook_Field, TableField]

  metrics:
    primary:
      - name: nagao_over_chained_rps_ratio
        unit: dimensionless
        definition: Nagao unique-rels/sec divided by chained unique-rels/sec.
      - name: twin_agreement
        unit: boolean
        definition: Unique relation sets agree on both field routes.
      - name: unique_relations_each_arm
        unit: integer
        definition: Unique P+Q+R=O triples per arm per pass.
    secondary:
      - name: null_fb_hits
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: passes
        unit: integer
      - name: fb_size
        unit: integer

  heuristic_under_test: HEUR-BINSTD-df6215-H1

  preregistered_prediction:
    quantity: >-
      After twin agreement, (unique-rels/sec)_Nagao /
      (unique-rels/sec)_chainedS3 ≥ 1 on the Stage-1 cell.
    formula: >-
      unique = |{sorted triples P+Q+R=O with P,Q,R in FB}|;
      Nagao scans G-canonical pairs only; chained scans all unordered
      pairs; rps = unique * passes / wall with the same B.
    source: >-
      IDEA-20261002-df6215; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Relation-source instrument on n=17, ℓ=3 only under this card. No
      transfer of a ρ band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids R claims (O-ARTIFACT).
    - Both arms unique=0 → O-INCONCLUSIVE.
    - Digit-string JSON object keys → check.py FAIL.

  seeds_and_replication:
    null_seeds: [2026100311, 2026100312, 2026100313]
    independent_instances: 1
    note: >-
      Stage-1 cell (17,3) is the authorized instance. Twin Field/TableField
      meters are the replication instrument. N_rep seeds drive the null.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-b130e3.
    - maximum_runs = 4.
    - Do not open Stage-2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read R as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.
    - JSON n-as-object-key freeze files → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true; Stage 1 produces unique
    counts, rps, and R vs ρ=1 (or a named O-ARTIFACT/O-IMPEDIMENT/
    O-INCONCLUSIVE stop); RESULTS.md names exactly one O-* label from
    H-BINSTD-b130e3 with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc ρ edit; a claimed break/exponent
    under this card; Magma-missing used as the verdict. (O-FAIL-BAND is a
    valid scientific negative of O-SUPPORT, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-c896e5/trial-plan-v1.json
    - experiments/EXP-BINSTD-c896e5/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-c896e5/stage0/v-catalog.json
