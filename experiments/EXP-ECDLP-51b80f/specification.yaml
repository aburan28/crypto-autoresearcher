experiment:
  id: EXP-ECDLP-51b80f
  hypothesis_id: H-ECDLP-7a019b
  derived_from_idea: IDEA-20260725-006
  question_id: RQ-ECDLP-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact symbolic relation dimension over Q(a,b) plus a four-family surrogate ablation, deciding
    whether the degree-4 S_4 X-coefficient syzygy's 27-zero support mask is a
    (2,2)-resultant-composition invariant or is specific to the Semaev polynomial
  objective: >-
    The single uncertainty a run reduces is WHICH generating structure fixes the universal shape of
    the degree-4 syzygy. A run establishes (i) whether the 27-position zero mask and the four dyadic
    entries reproduce across all 9 committed cells of RUN-TTN-002-c, which is currently checked by
    hand in only 5 of them; (ii) the EXACT relation dimension at degrees 2, 3 and 4 over Q(a,b) for
    the true system, computed symbolically with no sampling, no CRT and no rational reconstruction,
    which is what removes the CRT height ceiling that made the superseded formulation unsound; and
    (iii) whether four surrogate families on the identical Newton polytope reproduce that dimension
    and that mask, under an interpretation map fixed before execution. No attack, relation, speedup
    or security consequence is claimed here or would follow from a run. No statement is made about
    the external literature. No direction is declared impossible.
  what_this_is_not:
    - >-
      Not an attack, a key recovery, a factor-base relation, a distinguisher, or a cryptanalytic
      result of any kind. It is an exact symbolic measurement plus a matched ablation.
    - >-
      Not a reopening of H-TTN-001, which is rejected_scoped, and not a statement about the
      chi-law slope or any bond-rank law.
    - >-
      Not a derivation of the number 4. The degree of the swept image hypersurface remains a
      measured quantity; the composition argument supplies only bi-quadraticity in each coefficient
      triple.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No
      run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope, at the executed primes and sample counts and for arities m at most
      3, the degree-4 relation space of the S_4 X-coefficient map over Q(a,b) has a stated dimension
      and a stated support mask, and each of four named surrogate families does or does not
      reproduce them. WHAT DOES NOT FOLLOW: no attack cost, no bond-rank law, no statement about
      arities beyond the tested set, no statement about other curve models, no claim that the
      composition explanation excludes the classical-covariant explanation when both fire, and
      nothing whatever about ECDLP hardness.
  inputs:
    procedure: >-
      STAGE 0 (seconds, gating, no new claim may be made before it passes). Recompute AKEYS from the
      pinned ttn2_bond_rank_cert.sage and pin the index-to-monomial map. Parse all 9 cells'
      child.syzygy_AM/BM and redraw.syzygy_AM/BM from RUN-TTN-002-c/raw.json. Emit per cell the zero
      mask, normalization index and value vector; emit cross-cell mask_agreement,
      universal_entry_index_set with rational identification by per-prime inversion, and the three
      paired-index equalities (21,26), (28,41), (52,61). Reproduce the committed anchors before
      anything else. STAGE 1 (symbolic, PRIMARY). Build S_4 symbolically over Q(a,b)[x1,x2,x3] with
      the pinned formal-degree convention, extract a_0..a_4, form the 15 / 35 / 70 monomial products
      at degrees 2 / 3 / 4, and compute each kernel EXACTLY over Q(a,b). Then test M5 directly by
      checking, after binomial rescaling, whether the universal sub-vector equals
      a_0^3 a_4 - (2 a_1^2 - 3 a_0 a_2)^2. STAGE 2 (ablation ensemble). Reuse S4Xcoeffs,
      monomial_products and kernel_witness verbatim with s3_coeffs replaced by family A (generic
      fully-symmetric tridegree-at-most-(2,2,2), 10-dimensional), family A-prime (a generic triple
      of symmetric bidegree-(2,2) forms in (x1,x2)), family B (generic tridegree-at-most-(2,2,2)
      with no symmetry, 27-dimensional) and family C (five random polynomials with the same
      per-variable degrees as a_0..a_4 but arising from no composition). Ten samples per family at
      p = 101 and ten at p = 10007, 96 points plus a 128-point redraw per sample. STAGE 3 (zero
      compute). Apply the interpretation map below, which is fixed before execution, and assemble
      the tables.
    instrument: >-
      Sage only, no Python-numeric substitution. S4Xcoeffs, monomial_products and kernel_witness are
      taken verbatim from experiments/EXP-TTN-002/ttn2_bond_rank_cert.sage; only s3_coeffs is
      swapped per surrogate family. Formal-degree padding is applied at EVERY nesting level, because
      Sage's .resultant() uses actual degrees and unpadded surrogates corrupt degenerate sample
      points silently. Each surrogate family's Newton-polytope support is asserted programmatically
      against s3_coeffs' support before any kernel is computed. Recorded through harness/runner.py.
    parameters: >-
      Committed cells at p in {101, 431, 1009}. Ablation at p = 101 and p = 10007. Ten samples per
      surrogate family per prime, four families, two point streams (96 and 128) per sample, giving
      at most 160 kernel computations on matrices of at most 224 rows by 70 columns. Monomial
      product counts 15 / 35 / 70 at degrees 2 / 3 / 4. Symbolic Stage 1 carries a 900 second hard
      kill per kernel, with the fallback ladder declared in stopping_rules.
  controls:
    - >-
      COMMITTED-ANCHOR REPRODUCTION before any new claim, at the p = 101 seed-20260717 cell,
      requiring rank_AM = rank_BM = 69, rank_E = 68, rank_form = 68, rank_S_mod_p = 70,
      child_S_rank_QQ = 70 and root rank 45.
    - >-
      POSITIVE DETECTOR CONTROL, planting a known quartic relation into a type-(C) surrogate and
      confirming recovery with dimension exactly 1 and the planted witness. Without this a null in
      the type-(C) arm is uninterpretable.
    - >-
      NULL OBJECT (mandatory under docs/inventor-protocol.md): the type-(C) non-composed family,
      degree-matched but arising from no composition, which MUST return relation_dim_deg4 = 0 in at
      least 9 of 10 samples. If it does not, the apparatus manufactures relations and the whole
      Stage 2 comparison is void in BOTH directions.
    - >-
      Two independent point streams (96 and 128) per surrogate sample; a sample whose streams
      disagree is discarded and counted rather than silently dropped.
    - >-
      Large-prime replication at p = 10007 to exclude accidental mod-101 relations.
    - >-
      NORMALIZATION CONTROL, re-normalizing every witness at a different pivot index; mask_agreement
      and universal_entry_index_set must be unchanged.
    - >-
      NEWTON-POLYTOPE EQUALITY ASSERTION, checking each surrogate family's support programmatically
      against s3_coeffs' support, since an off-by-one in the support silently changes the comparison.
    - >-
      MATCHED-CONTROL DECLARATION required by RQ-ECDLP-002 constraint 3 and
      docs/claims-and-verification.md. Pollard rho, BSGS and generic lower bounds are NOT applicable
      and are deliberately omitted. This test performs no solve, produces no factor-base relation
      and asserts no attack-cost quantity; the run carries certificate kind none. This sentence must
      appear in the run manifest rather than the field being left blank.
  independent_variables:
    - >-
      surrogate family, one of A (fully-symmetric (2,2,2)), A-prime (symmetric bidegree-(2,2)
      triple), B (generic non-symmetric (2,2,2)), C (non-composed degree-matched control), and the
      true Semaev composition
    - monomial-product degree, one of 2, 3, 4
    - prime, one of 101, 431, 1009 for committed cells and 101, 10007 for the ablation
    - point-stream size, one of 96 or 128
    - normalization pivot index
  metrics:
    primary:
      - >-
        mask_agreement, units count of cells out of 9, computed as the number of committed cells
        whose normalized degree-4 witness has the identical 27-position zero mask
      - >-
        universal_entry_index_set, units a set of monomial indices with rational values, computed by
        per-prime inversion of the residue at each index and cross-cell intersection of indices whose
        rational value agrees
      - >-
        relation_dim_deg4_over_Q_ab, units dimension (a non-negative integer), computed as the exact
        kernel dimension of the 70-column monomial-product matrix over the field Q(a,b), with no
        sampling and no CRT
      - >-
        surrogate_relation_dim_deg4_symmetric, units dimension per sample, computed on family A over
        10 samples per prime, reported as the count of samples returning exactly 1
      - >-
        surrogate_mask_match_fraction_symmetric, units dimensionless fraction in [0,1], computed as
        the fraction of family-A samples whose degree-4 witness has exactly the pinned 27-zero mask
    secondary:
      - >-
        relation_dim_deg2_over_Q_ab and relation_dim_deg3_over_Q_ab, units dimension, computed
        exactly over Q(a,b) on the 15-column and 35-column systems
      - >-
        nonsymmetric_surrogate_mask_match_fraction, units fraction in [0,1], computed on family B
        exactly as the family-A fraction
      - >-
        paired_index_equalities_hold, units three booleans per cell, computed by comparing values at
        index pairs (21,26), (28,41), (52,61) within each cell
      - >-
        m5_covariant_identity_holds, units boolean, computed by symbolic equality of the rescaled
        universal sub-vector against a_0^3 a_4 - (2 a_1^2 - 3 a_0 a_2)^2
      - >-
        planted_control_recovered, units boolean, computed as dimension exactly 1 with the planted
        witness recovered in the positive detector control
      - >-
        typeC_false_relation_count, units count out of 10 per prime, computed as the number of
        type-(C) samples returning relation_dim_deg4 at least 1
      - >-
        stream_disagreement_count, units count of discarded samples, computed as the number of
        samples whose 96-point and 128-point streams disagree
      - >-
        wall_seconds and peak_rss_gb, units seconds and gigabytes, per stage and per sample
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The pair (surrogate_relation_dim_deg4_symmetric, surrogate_mask_match_fraction_symmetric) on
      family A, against the type-(C) control, together with relation_dim_deg4_over_Q_ab on the true
      system.
    formula: >-
      Predicted, before any run under this contract, relation_dim_deg4_over_Q_ab = 1 exactly;
      surrogate_relation_dim_deg4_symmetric = 1 in at least 9 of 10 samples;
      surrogate_mask_match_fraction_symmetric at least 0.9; type-(C) relation_dim_deg4 = 0 in at
      least 9 of 10 samples; relation_dim_deg2 = relation_dim_deg3 = 0; mask_agreement = 9 of 9;
      universal_entry_index_set exactly {4, 9, 16, 35} with values 1, -1/4, 1/8, -1/64. Under the
      null that the composition class is irrelevant, surrogate_mask_match_fraction_symmetric is at
      most 0.1 or the surrogate dimension is 0.
    source: >-
      Pre-registered in the parent proposal IDEA-20260725-006 before any run under this contract
      exists, with the interpretation map from proposal minimal_test fixed before execution. Never
      tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at p in {101, 431, 1009} for the committed cells and p = 10007 for the ablation, with
      m = 6 short-Weierstrass prime-field curves and arities m at most 3. That is far below any
      cryptographic scale and the design does not attempt transfer. The one arm that IS
      scale-independent is Stage 1, which computes over the function field Q(a,b) and therefore
      makes a statement about the generic curve rather than about any prime; that arm is what
      carries the exact relation dimension and it is labelled separately from every mod-p arm.
    correspondence: >-
      Stage 1's exactness over Q(a,b) is the only route by which any result here escapes the tested
      primes, and it escapes them only for the relation dimension and support, never for a cost.
  tail_checks:
    - >-
      Report the four not-yet-hand-checked cells separately from the five checked ones, so a
      disagreement cannot be diluted by pooling.
    - >-
      Report the height of every reconstructed rational against the CRT bound about 4,686; a
      reconstruction at or above that height is an instrument shortfall, not a coefficient.
    - >-
      Report the per-sample dimension distribution in the surrogate families, not only the modal
      value, so a 9/10 that is really 5/10 plus 4 borderline samples cannot hide.
    - >-
      Report the number of degenerate sample points rejected by the formal-degree padding check per
      surrogate family.
  replication:
    seeds:
      - 20260725
      - 20260726
      - 20260727
    independent_instances: 3
  budget:
    wall_clock_seconds: 7200
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6.0
    memory_gb: 4
    maximum_memory_gb: 4
    maximum_runs: 20
  stopping_rules:
    - >-
      Stage 1 carries a 900 second hard kill per symbolic kernel. On a kill, the fallback ladder is,
      in order, (i) specialize (a,b) to at least 3 random rationals and compute the kernel exactly
      over Q, then (ii) extend the prime set beyond {101, 431, 1009} until the CRT bound exceeds ten
      times the largest observed reconstructed height. If both fail, the stage is CENSORED
      INFRASTRUCTURE and is reported as inconclusive.
    - >-
      Abort the line if Stage 0 fails to reproduce the committed anchors; no new claim may be made
      before Stage 0 passes.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The interpretation map and the surrogate family definitions are frozen before execution and
      are not revised after seeing any kernel.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose type-(C) null arm is missing, or whose control arm was not executed in the same
      invocation as the signal arm, is invalid_measurement: the comparison the contract exists to
      make was not made.
    - >-
      A run in which the positive detector control fails to recover a planted relation is
      invalid_measurement; a null in the type-(C) arm is then uninterpretable.
    - >-
      A run in which any surrogate family's Newton-polytope support differs from s3_coeffs' support
      is invalid_measurement, because the ablation compared a different object.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
      a new contract; it is never a repair of this one.
  success_criterion: >-
    The run is a success as a MEASUREMENT (not as a confirmation) when all of the following hold and
    are reported: Stage 0 reproduces the committed anchors and emits mask_agreement,
    universal_entry_index_set and paired_index_equalities_hold for all 9 cells; Stage 1 returns
    exact values for relation_dim_deg2, relation_dim_deg3 and relation_dim_deg4 over Q(a,b), or
    declares the censored-infrastructure branch with the fallback ladder attempted and recorded; the
    planted positive control is recovered; the type-(C) null arm returns relation_dim_deg4 = 0 in at
    least 9 of 10 samples at both ablation primes; and surrogate_relation_dim_deg4 and
    surrogate_mask_match_fraction are reported for all four families at both ablation primes with
    per-sample values, not summaries. Each of these is decidable from the primary metrics above.
  falsification_criterion:
    - >-
      The fully-symmetric (2,2,2) surrogate returns relation_dim_deg4 = 0 in at least 9 of 10
      samples. PART B OF THE HYPOTHESIS IS FALSIFIED and M2 is promoted. This is the principal
      negative outcome the contract exists to make reachable.
    - >-
      The symmetric surrogate returns dimension 1 with surrogate_mask_match_fraction at most 0.1.
      Part B as stated is falsified; the dimension is compositional but the shape is S_3-specific.
    - >-
      mask_agreement is below 9 of 9, or universal_entry_index_set differs from {4, 9, 16, 35} with
      the stated values. PART A is falsified and the record is superseded rather than amended.
    - >-
      relation_dim_deg4_over_Q_ab is 0. The recorded phenomenon is an evaluation artifact and rule 8
      of DEC-20260722-002 must be re-scoped.
    - >-
      relation_dim_deg2 or relation_dim_deg3 over Q(a,b) is nonzero. The one-irreducible-quartic
      reading is wrong.
    - >-
      typeC_false_relation_count is at least 2 of 10 at either ablation prime. The apparatus
      manufactures relations; the Stage 2 comparison is VOID and no conclusion may be drawn in
      either direction.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and
      inference block, environment, and the matched-control declaration sentence verbatim
    - >-
      raw-result.json carrying every per-cell and per-sample measurement, including per-sample
      surrogate dimensions and masks, not summaries
    - >-
      the type-(C) null arm's measurements and the planted positive control's result, in the same
      file as the signal arm
    - >-
      the recomputed AKEYS index-to-monomial map, archived so every index statement in any later
      record is checkable
    - >-
      the pre-registration text and the frozen interpretation map, written before the first run and
      hashed
    - >-
      certificate kind none, recorded explicitly rather than omitted
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval
      is the user's gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is partly proof-oriented; its proof_search_map has been carried into
      H-ECDLP-7a019b and must be audited against KN-TECH-080 before implementation.
    - >-
      Stage 0's AKEYS recomputation must be treated as a blocking gate in the handoff, since every
      index-level statement in the parent proposal is conditional on it.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260725-006
    authored_at: '2026-08-25'
    note: >-
      Every metric, control, prediction and falsification condition is transcribed from the parent
      proposal's predictions, controls, required_metrics and falsification_conditions blocks, or
      derived from them by the fixed table for boilerplate (invalidation rules, required artifacts,
      approval gate, replication seeds). Budgets come from the parent's declared estimated_cost of
      implementation medium and compute low, and from its stated ceiling of 2 hours wall clock and
      4 GB RSS, widened to 20 runs to accommodate the four-family ablation at two primes. No field is
      invented: a value the proposal did not supply is null or is recorded as a derivation gap.
  derivation_gaps:
    - >-
      The AKEYS ordering is ASSUMED, not verified. Every index-level statement in this contract,
      including {4, 9, 16, 35}, is conditional on it, and Stage 0 must confirm it from the pinned
      code before any of them is used or reported.
    - >-
      M1 and M5 are not mutually exclusive. The contract does not specify how to report the case
      where both the composition ablation and the covariant identity fire; the correct report is
      that the two explanations are not separated, and a coordinator must fix that wording before
      approval so it cannot be chosen after seeing the result.
    - >-
      The surrogate families' sampling distributions (how coefficients are drawn over F_p) are not
      specified by the parent proposal and must be fixed before approval, since a distribution that
      concentrates on degenerate points would bias the mask-match fraction in either direction.
    - >-
      The four not-yet-hand-checked committed cells are not identified by name in the parent
      proposal. They must be listed explicitly in the frozen contract so a partial check cannot
      later be reported as complete.
