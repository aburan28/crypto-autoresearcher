  # ---------------------------------------------------------------------------
  definitions:
    ambient_and_sizes: >-
      ECC2K-130: y^2 + xy = x^3 + 1 over F_2[z]/(z^131 + z^13 + z^2 + z + 1),
      #E = 4 r, r = 680564733841876926932320129493409985129 (prime; #E = 4r
      recomputed by the Lucas recurrence in TASK-20260928-d5024b E06), log2 r =
      129.000000. The product law's ambient is N = #E = 4r
      (CORR-20260928-4cb669). N_prime = r/262 (negation and 131 Frobenius
      classes), log2 N_prime = 120.966577. Matched rho: rho_1 = sqrt(pi r /
      (4 x 131)) = 2^60.8090 (CORR-20260922-81aeab), equal to
      sqrt(pi N_prime / 2) because N_prime / 2 = r / 524 (C1).
    cap_locus_and_constants: >-
      B_cap(m) = (m! 2^131)^(1/m); mu(B) = B^m / (m! 2^131); A(mu) = 1/(1 -
      exp(-mu)) attempts per success (A(1) = 1.581977, 0.661728 bit);
      retry_m = 1/(1 - m exp(-m)) (1.079054 at m = 4, 1.034864 at m = 5);
      kappa_m = A(1) retry_m (log2 0.771496 at m = 4, 0.7112 at m = 5), the
      deployed-arity per-target attempt constant, conservative against
      multi-decomposition acceptance by 0.046 bit (m = 4) and 0.021 bit
      (m = 5) (TASK-20260928-a75ba7); LA_m(B) = m B^2 modular multiply-adds.
      These exact forms are unchanged from version 1 (audit sheet constants).
    model_Mm: >-
      For arity m, base size B, per-attempt cost C and L targets:
      T_shared(B, C) = B A(mu(B)) C + m B^2; per_target(B, C) = A(mu(B))
      retry_m C; IC(L) = T_shared + L per_target. Units: C in group-operation
      equivalents and LA in modular multiply-adds, summed at an assumed
      one-to-one rate, a MODEL ASSUMPTION (H-BINSTD-7951d2 A6; R-J1-6) shared
      with the pinned product law. Generic side under H2: rho(L) = c rho_1
      sqrt(L) with c = 1 (column_conventions). Window at (m, B, C): with
      s = sqrt(L), a = per_target / rho_1, b = T_shared / rho_1, the open
      interval between the roots of a s^2 - s + b = 0 when 4ab < 1, empty
      otherwise; log2 L_lo = 2 log2(2b / (1 + sqrt(1 - 4ab))), log2 L_hi =
      2 log2((1 + sqrt(1 - 4ab)) / (2a)). The m = 5 window is evaluated at
      B = B_cap(5) only (a B = B_cap statement; no m = 5 envelope, R-J1-4).
      The m = 4 envelope at g is the union over the ONE committed range of
      the windows at C = 2^(D3(4) + g): log2 B in [29.036035, 35.996035],
      0.01-bit grid from 29.036035, 697 points (R-J1-1), with lower edge,
      upper edge, closing g and contiguity per g.
    conventions_for_g: >-
      D3 convention (the comparator, C2): C = 2^(D3(m) + g) with D3(5) =
      33.075936 (one attempt per relation at B_cap(5)) and D3(4) = 11.010251
      (sub-cap, log2 B = 29.036035), UNROUNDED (R-J4-3). Proposal convention
      (shown beside, never the comparator): C = 2^(32.414212 + g) at m = 5,
      32.414212 = D3(5) - log2 A(1), which charges 1.58 attempts. For the same
      C, g_D3 = g_prop - 0.661728 at m = 5. Tie rule: a window lower root with
      |log2 L_lo| below 1e-4 is read as the L = 1 tie, never as an advantage.
    column_conventions: >-
      R-J3-2. (i) Advice S = B_cap WORDS of 129 bits (a factor-base
      logarithm), stored at 17 bytes. In CGK Theorem 2's unit (bits), T_gen is
      lower by 0.5 log2 129 = 3.5056 bit. (ii) Group size N_prime = r/262,
      matching C1's rho; CGK Theorem 2 is for a prime-order group (here r) and
      at N = r T_gen is higher by 0.5 log2 262 = 4.0167 bit; the choice of
      N_prime is the tougher bar for index calculus. (iii) The windows use the
      generic multi-target constant c = 1 in rho(L) = c rho_1 sqrt(L).
      Kuhn-Struik Theorem 1 gives c = 2/sqrt(pi) = 1.128 for L << N^(1/4)
      (SRC-KS); the Bernstein-Lange measured points give L-target constants
      of about 2.15 to 2.36 (red-team arithmetic on SRC-BL). Sensitivity:
      log2 L_hi moves by +2 log2 c, that is +0.35, +2.21 and +2.48 bit; every
      shift widens the window, so c = 1 is the narrowest reading. (iv) "On
      the frontier within 0.5 bit" is a statement in the Bernstein-Lange
      convention only (words, N_prime, the measured constants); relative to
      CGK's lower bound the frontier is located only up to logarithmic
      factors. (v) The precomputation axis P_gen = sqrt(N_prime S) is CGK
      Theorem 10 (P T + T^2 = Omega(epsilon N)), at T = T_gen.
    frontier: >-
      At advice S = B_cap words, T_gen = sqrt(N_prime / S), P_gen =
      sqrt(N_prime S). Identity: B_cap T_gen = P_gen. With the attempt
      constant kept, P_IC(T_gen) = A(1) P_gen + m B_cap^2, 0.666 bit above
      P_gen at m = 4 and 0.662 at the other m; online kappa_m T_gen is 0.77
      (m = 4) and 0.71 (m = 5) bit above T_gen. Against the Bernstein-Lange
      measured points an oracle at exactly C = T_gen neither dominates nor is
      dominated (TASK-20260928-a75ba7 PTM-A): ON the frontier in that
      convention, never below.
    cells:
      CTRL-ZN: >-
        The additive group Z/NZ with N the least prime above 2^20 (1048583 by
        TASK-20260928-d5024b E06; recomputed at setup), presented through a
        seeded random permutation pi of {0, ..., N-1}: an element z is handled
        only as its label pi(z); add(a, b) = pi(pi_inv(a) + pi_inv(b) mod N),
        one group operation; the generator P0 is the label of 1. Base: 2^7 =
        128 distinct nonzero residues drawn from the 'base' stream, with the
        RESEED RULE (R-J2-6): base draw k = 0, 1, 2, ... until the 128
        residues contain no pair z, N - z (no pair F, -F); k is recorded.
        Columns: the 128 base elements; signed set of 256 elements.
        Enumeration oracle at m = 2: one attempt performs 2 x 128 hash lookups
        (one oracle work unit each) and returns every unordered decomposition
        R = s F_i + t F_j. mu_ZN = 256^2 / (2 N) = 0.0312498 by construction
        (reported; AR-MU does not apply, R-J2-8).
      BIN-ORD-19: >-
        Ordinary y^2 + xy = x^3 + A x^2 + B over F_2[t]/(t^19 + t^5 + t^2 + t
        + 1), A = 46693, B = 306147 (integer bit patterns in the polynomial
        basis), #E = 2 q, q prime, G the order-q subgroup. #E recomputed by
        the trace count and the naive count; q proved prime (deterministic
        Miller-Rabin below 3.3e24); the cell halts on any disagreement with
        the pointer 2 x 261823 (KN-FIND-c3a917). Generator P0 = [h] P for P
        drawn from the 'generator' stream (reseed until P0 is not O).
      BIN-KOB-19: >-
        Koblitz y^2 + xy = x^3 + 1 over the same field, #E = 4 l, l prime,
        recomputed and proved the same way and cross-checked against the
        Lucas recurrence (pointer 4 x 130873, which TASK-20260928-d5024b E06
        reproduced by the recurrence). Generator as above.
      binary_factor_base: >-
        V = {x in F_2^19 : deg x below 10} (1024 x-values), F = {P affine :
        x(P) in V}, closed under negation; columns are the G-classes {+Q, -Q}
        of pi_G(P) = [h (h^-1 mod q)] P, merged when equal up to sign (merge
        count reported); B_c = the class count (design expectation about
        512). mu_c = |F|^2 / (2 #E), which must lie in [0.5, 2] (AR-MU,
        binary cells only).
      oracle_A: >-
        For a target R in G, for each x1 in V solve the quadratic S_3(x1, X,
        x(R)) = 0 in X (the root-finding of
        experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py oracle_A, copied
        with provenance, with |V| = 2^10 and a GF(2^19) field), keep roots in
        V, lift the candidate points and their negatives, keep the sign
        choices with s1 P1 + s2 P2 = R verified by point addition, and return
        every unordered decomposition as ((i, s), (j, t)) with R = s rep_i +
        t rep_j in G (the class signs folded in). One attempt = 2^10 root
        solves = 2^10 oracle work units.
    impl_layout: >-
      R-J4-2. Every instrument lives under experiments/EXP-BINSTD-517186/impl/:
      binstd_core.py and stage0.py (extracted verbatim from the audit sheet);
      gf2_19.py (I3; a general-n variant of
      experiments/EXP-CERTBIN-e94b27/impl/gf2n.py, copied with provenance);
      bincurve.py (a curve adapter derived from
      experiments/EXP-CERTBIN-e94b27/impl/curve.py with the interface of
      I4); oracle_a19.py (oracle A, derived from oracles_rc1.py); driver.py
      (I5); verify.py (the separate certificate verifier); and
      impl-provenance.json naming every source file and its sha256. No file
      under src/crypto_autoresearcher/index_calculus/ is modified, and none
      is imported.
    observables_and_tests: >-
      Per reuse arm of a cell c with B_c columns, mu_c, w_c oracle work units
      per attempt, n_t fresh targets and L cells L_IC: shared_units = oracle
      work units of the relation phase (relation attempts x w_c; setup and
      group operations are separate columns); per-target units = oracle work
      units of that target's attempts; p_bar = mean per-target units;
      delta_hat = determined columns / B_c (from I1); tau_hat = touched
      columns / B_c (diagnostic); u_hat = the fraction of ALL decompositions
      returned on the reuse arm's attempts whose both legs are DETERMINED
      columns (the metric exactly as the prediction P2 defines it); n_dec =
      their number; a_bar = mean attempts per target, where an attempt is one
      oracle call on Q_t + c P0 and the count runs to the first attempt that
      returns a usable decomposition, inclusive (the ONE unit for retries,
      R-J2-3). Predictions: u_pred = delta_inf^2 = 0.634909; a_pred(mu) =
      1/(1 - exp(-mu u_pred)); K_pred = B_c A(mu_c) / a_pred(mu_c);
      sigma_pred = least-squares slope of log2(K_pred / L + 1) on log2 L over
      the arm's L cells. AM1 knee ratio KR = (shared_units / p_bar) / K_pred.
      AM2 flattening ratio FR = p_bar / (a_pred(mu_c) w_c), the flat level of
      the per-target cost beyond the knee against the validation-arity attempt
      constant times the attempt cost; FR_by_L = per_target_cost(L) /
      (a_pred w_c) is reported per L. AM3 d_sigma = sigma_hat - sigma_pred,
      where sigma_hat is the least-squares slope of log2 per_target_cost(L) =
      log2((shared_units + sum of the cell's per-target units) / L) on log2 L
      over ALL the arm's L cells (no admission rule selects cells; bootstrap
      interval by 1000 resamples of targets within cells, reported). Tests
      (two-sided; 'low' means less amortisation than predicted): T_delta
      |delta_hat - delta_inf| <= 3.3 x 0.403 / sqrt(B_c), below low; T_u
      |u_hat - delta_hat^2| <= 3 sqrt(delta_hat^2 (1 - delta_hat^2) / n_dec),
      below low; T_a |a_bar - 1/p| <= 3 sqrt(1 - p) / p / sqrt(n_t) with p =
      1 - exp(-mu_c u_hat), above low; AM1 KR in [0.8, 1.25], below low; AM2
      FR in [0.8, 1.25], above low; AM3 d_sigma in [-0.1, 0.1], above low;
      T_cmp (binary cells only, against CTRL-ZN) |u_hat_c - u_hat_ZN| <= 3.3
      sqrt(var_c + var_ZN), var = u_hat (1 - u_hat) / n_dec + (2 delta_hat
      0.403 / sqrt(B))^2, below low. Per-cell class: PASS if no test fails;
      LOW-COV if every failing test is low and at least one of T_delta, T_u,
      T_cmp fails; LOW-RETRY if every failing test is low and none of those
      three fails; HIGH if every failing test is high; SPLIT otherwise. The
      functions are gate_tests and classify_cell of binstd_core.py.
      Admissible ranges for arbitrary data: audit sheet admissible_ranges.
    null_arm: >-
      CTL-8, the no-reuse null (R-J3-1): the shared phase is charged in full
      (the same shared_units as the reuse arm); then each of 21 further fresh
      targets (t = 1365 to 1385, L cells 1, 4, 16) is solved by a fresh
      single-target pipeline that reuses no relation and no logarithm (one
      target decomposition, then fresh relations until both legs of a stored
      decomposition are determined, checked every max(1, B // 16) relations;
      one more target attempt after every 4 B relations; abandoned at 16 B
      relations with its units kept as a lower bound). Identical accounting:
      the same units, the same observable functions (KR, FR, d_sigma over the
      null's L cells with the reuse arm's K_pred). It must lie outside all
      three AM bands and read KR below 0.125 (IR-9). Run on CTRL-ZN (in G1)
      and BIN-ORD-19.
    pooling_constant: >-
      c(L) = mean over 30 seeds of total walk_ops at L, divided by sqrt(L) W1,
      where W1 is the mean walk_ops of 150 single-target reference solves
      (targets 0 to 4, 30 seeds each) through the same I2 code. exponent_rho =
      least-squares slope of log2(mean total walk_ops / L) on log2 L over L in
      1, 4, 16, 64, 256; identically exponent_rho = -0.5 + the slope of
      log2 c(L) (disclosed link, audit sheet admissible_ranges).
    dp_admission: >-
      dp_bits per cell = max(0, floor(log2(sqrt(N_G / 256) / 8))), N_G the
      subgroup order, so the distinguished-point overshoot is at most one
      eighth of the smallest per-target walk. Design expectation: 3 on
      CTRL-ZN; 1 on both binary cells (log2 of 3.998 and 2.826; version 1
      wrote 2). walk_ops and setup_ops are reported separately; only walk_ops
      enters the rho fit.

  # ---------------------------------------------------------------------------
  instruments:
    - id: I1
      name: full-logarithm-vector solve (FullVectorElim in binstd_core.py)
      specification: >-
        Incremental elimination modulo the subgroup order; solve_all reduces
        every pivot row, in reverse creation order, to its pivot plus free
        columns (reduced row echelon form), so a column is determined iff its
        reduced row is the pivot alone; touched-but-undetermined columns get
        no logarithm. Every multiply-add is charged to la_ops. CERT-LOG on
        EVERY determined column on every cell. Self-test (procedure step 2): a
        seeded 6-unknown system modulo N_ZN with a known solution and one
        free column ('selftest' stream) returns exactly the five determined
        values.
    - id: I2
      name: shared-table multi-target rho (rho_multi in binstd_core.py)
      specification: >-
        Group-generic over an adapter with add, mul, zero, gen, N, label and
        an operation counter. P0-only r-adding steps (r = 20), so every walk of
        every target shares one step function; a walk for target t starts at
        a P0 + b Q_t with fresh a, b. A point is distinguished when
        (label // 20) has its low dp_bits bits zero. At a NEW distinguished
        point the walk stores it and CONTINUES; after 20 x 2^dp_bits steps the
        walk is abandoned and a fresh walk starts (R-J2-5). On a hit: same
        target with a different b solves; a solved earlier target solves by
        substitution; otherwise the walk is abandoned. Targets are solved in
        order with the table carried across them. Every k_t is certified
        (CERT-DL) before it is used or reported. Reported per L and seed:
        walk_ops, setup_ops, walks, abandoned walks, table entries and bytes
        (four 8-byte integers per entry), per-target walk_ops.
    - id: I3
      name: GF(2^19) field module (impl/gf2_19.py)
      specification: >-
        A general-n variant of experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
        (schoolbook and table multiplication, inverse, trace, half-trace,
        sqrt, irreducibility of t^19 + t^5 + t^2 + t + 1), copied with
        provenance. Self-test: the modulus is irreducible; x^(2^19) = x on 100
        seeded elements; trace and half-trace identities on 100 elements
        (AR-FIELD).
    - id: I4
      name: binary curve adapter and oracle A (impl/bincurve.py, impl/oracle_a19.py)
      specification: >-
        Adapter interface of binstd_core.run_cell: N (the subgroup order),
        ops, zero (O), gen (P0), add and mul in the SCHOOLBOOK multiplication
        path (so every certificate is checked independently of the table path
        oracle A uses), label (an injective integer label of a point, for
        example 2 x int(x) + y-bit, with O mapped to a reserved integer).
        Oracle interface: B (class count), reps (class representatives in G),
        sigma_size (|F|), ambient (#E), units_per_attempt (1024), units, and
        decompose(R). Self-tests: orders two ways and primality (AR-ORDER);
        100 seeded points on the curve; add and mul agree between the table
        and schoolbook paths on 100 seeded pairs; on 10 seeded targets the
        decompositions returned equal a brute-force enumeration over F pairs.
    - id: I5
      name: Stage 2 driver and verifier (impl/driver.py, impl/verify.py)
      specification: >-
        driver.py loads fixture.json (the CTRL-ZN values for T_cmp), runs
        binstd_core.run_cell on BIN-ORD-19 (with_null true) and BIN-KOB-19
        (with_null false), and calls binstd_core.stage2_outcome; it adds no
        observable and no rule. verify.py, a separate process with no shared
        import, re-verifies every CERT-REL, CERT-LOG and CERT-DL from the
        recorded relations, logarithm vector and target records.
    - id: I0
      name: Stage 0 script (impl/stage0.py)
      specification: The committed stage0_code, run unchanged; stage0.json is a design artifact, never a result.

  # ---------------------------------------------------------------------------
  stages:
    stage_0:
      compute: zero
      m4_envelope_range: "[29.036035, 35.996035] in log2 B; step 0.01; 697 points; first point 29.036035"
      what: >-
        Run stage0.py. It writes stage0.json: log2 N_prime; log2 rho_1 in both
        forms; per m in 4, 5, 6, 8, 16 the column, identity residual, LA and
        its margin, P_IC(T_gen)/P_gen, S bytes, LA matrix bytes, Krylov bytes,
        LA total bytes, T_gen in the bits and prime-order conventions, D3
        recomputed and both relaxations; the 4b65e3 section; the m = 5 window
        at B = B_cap(5) at g in 0, 2, 6, 10, 12, 13, 13.2, 14 in both
        conventions with critical g by bisection and closed form; the m = 4
        sub-cap slice at g in 0, 6, 10, 13, 14, 15 and the cap slice at
        log2 C in 11.010251, 20, 30, 35 with critical values; the m = 4
        envelope over the committed range at g in 0, 6, 10, 13, 14, 20, 30
        (lower edge, upper edge, contiguity with minimum overlap, closing g,
        the per-B table); the L = 1 quantities from the model terms (IC(1)
        over rho_1 and the tie budget at the m = 4 sub-cap base and at
        B_cap(5)); the comparator memory at every window upper end; the m = 2
        prediction constants; the Kuhn-Struik pooled constants.
      acceptance: >-
        S0: stage0.py compares every figure with its DESIGN table (the audit
        sheet design_figures) at 0.05 bit (columns, memory, D3), 1 bit
        (window and envelope bounds), 0.2 (critical and closing g), exact
        (contiguity, emptiness, N_ZN, dp_bits), 1e-4 bit (L = 1 ties, frozen
        inputs), and the stated tolerances for the m = 2 constants, and exits
        0 iff all pass. A disagreement is a design defect referred to the
        Coordinator before Stage 1, never a result.
    stage_1:
      compute: minutes
      what: >-
        The complete CTRL-ZN cell by binstd_core.py run unchanged: the reuse
        arm (R = 128 relations, 1365 fresh targets in L cells 1, 4, 16, 64,
        256, 1024), the null arm (21 targets), the rho arm (30 seeds per L in
        1, 4, 16, 64, 256 and 150 reference solves). Pass criterion G1, stated
        here before execution and coded as g1_checks: (a) T_delta, T_u, T_a,
        AM1, AM2 and AM3 all pass on the reuse arm; (b) the null arm reads KR
        below 0.125 and lies outside the AM1, AM2 and AM3 bands; (c) CTL-6:
        relations = 128, shared units = relation attempts x 256, delta_hat
        below 0.95; (d) exponent_rho in [-0.6, -0.4]; (e) c(L) in [0.5, 2] at
        every L; (f) every CERT-REL and CERT-LOG, CERT-DL on every solved
        reuse target, null target, rho run and reference solve, and no
        inconsistent relation row (R-J2-4); (g) no reuse target reaches
        100000 attempts. NO BINARY CELL IS READ BEFORE G1 PASSES (S1, IR-1).
        Its output is the CTRL-ZN arm of Stage 2 (SD-4).
    stage_2:
      compute: minutes to an hour per cell
      what: >-
        On BIN-ORD-19 and BIN-KOB-19: setup (orders two ways, primality, the
        factor base, class count and merge count, mu_c and AR-MU, dp_bits);
        binstd_core.run_cell with the Stage 1 CTRL-ZN values for T_cmp; the
        null arm on BIN-ORD-19; every certificate re-verified by verify.py;
        the outcome by binstd_core.stage2_outcome.
    stage_3:
      compute: zero
      what: >-
        The preprocessing column (T_gen, P_gen, S bytes, LA time and bytes,
        with its conventions) filed into the RQ-BINSTD-b6f698 table beside the
        pinned single-target column as an analysis note under the run
        directory, carrying the outcome labels, every gated observable with
        its band, and the statement_note constants; labelled CONDITIONAL on
        H1, H2 and the oracle cost C. The note states no oracle cost, no point
        below any budget, no first-below-the-line clause and no reading of any
        window with a measured per-attempt cost.

  procedure:
    - 1. Stage 0 (stage0.py); stop unless S0 passes.
    - 2. Instrument self-tests (I1 on the seeded 6-unknown system modulo N_ZN; I3 field; I4 adapters and oracle A against brute force). No prime-field curve is used.
    - 3. Stage 1 (binstd_core.py on CTRL-ZN); stop unless G1 passes.
    - 4. Stage 2 (driver.py on BIN-ORD-19 and BIN-KOB-19); verify.py re-checks every certificate.
    - 5. The outcome by stage2_outcome; the Stage 3 note.

  # ---------------------------------------------------------------------------
  controls:
    - id: CTL-1
      name: relabelled Z/NZ with the enumeration oracle (blocking; Stage 1)
      role: The random model of H1 holds there by construction (uniform random base and targets), so the H1 tests and the amortisation gates must PASS on it (G1 (a)); its u_hat and delta_hat are the reference of T_cmp.
    - id: CTL-2
      name: ordinary against Koblitz at n = 19 (wired into the outcome table)
      role: No Frobenius is used, so the normalised predictions are identical on both cells; exactly one of the two passing is the declared outcome H1-MIXED (or H2-MIXED), a CTL-2 disagreement, never a positive.
    - id: CTL-3
      name: certificates on every logarithm and relation (blocking)
      role: CERT-DL (independent scalar multiplication), CERT-REL (point addition in the schoolbook path), CERT-LOG (every determined column), re-verified by verify.py; docs/claims-and-verification.md.
    - id: CTL-4
      name: single-target reproduction at L = 1 (arithmetic; can fail)
      role: >-
        stage0.py evaluates IC(1)/rho_1 and the tie budget FROM THE MODEL TERMS
        (R-J1-3): at the m = 4 sub-cap base it must reproduce the pinned D3
        tie (design 0.0000 within 1e-4); at B_cap(5) the tie budget must sit
        log2 A(1) = 0.6617 below D3(5) and IC(1) at D3(5) must read 0.6077
        bit above rho_1 (the stated convention difference). Part of S0.
    - id: CTL-5
      name: rho pooling constant against the toy range
      role: c(L) in [0.8, 1.3] is the H2 prediction; outside [0.5, 2] is an instrument defect (G1 (e) on CTRL-ZN; IR-3b on a binary cell).
    - id: CTL-6
      name: over-complete and setup-dominated artefact separation (wired into IR-10)
      role: The relation count must equal B_c, shared oracle units must equal relation attempts x units per attempt (so setup work cannot enter the knee), and delta_hat must be below 0.95; otherwise the cell's IC reading is ARTIFACT and reads nothing.
    - id: CTL-7
      name: admission rules
      role: AR-MU (mu_c in [0.5, 2]) on the BINARY cells only (R-J2-8); AR-ORDER (orders two ways, primality); AR-DP (dp_admission); AR-FIELD (I3 self-test). A failed admission halts the cell before any figure is read.
    - id: CTL-8
      name: no-reuse null arm (definitions.null_arm; blocking through IR-9)
      role: The same shared cost, then per-target solves reusing nothing, with identical accounting, on CTRL-ZN and BIN-ORD-19; it must fail AM1, AM2 and AM3 and read KR below 0.125, or the amortisation gates do not discriminate and the IC reading is invalid.

  independent_variables:
    - L in 1, 4, 16, 64, 256, 1024 for the index-calculus reuse arm; 1, 4, 16 for the null arm; 1, 4, 16, 64, 256 for rho (fresh disjoint targets)
    - cell in CTRL-ZN, BIN-ORD-19, BIN-KOB-19
    - arm in reuse (I1 plus the oracle), null (CTL-8), rho (I2)
    - rho seed 0 to 29 per L

  metrics:
    primary:
      - name: KR (AM1)
        unit: dimensionless
        definition: definitions.observables_and_tests, per cell and for the null arm
      - name: FR (AM2)
        unit: dimensionless
        definition: definitions.observables_and_tests, per cell and for the null arm
      - name: d_sigma (AM3)
        unit: dimensionless (difference of slopes)
        definition: definitions.observables_and_tests, per cell and for the null arm
      - name: delta_hat, u_hat, a_bar with T_delta, T_u, T_a, T_cmp
        unit: fractions of columns and of decompositions; attempts
        definition: definitions.observables_and_tests, per cell
      - name: exponent_rho and pooling_constant
        unit: dimensionless
        definition: definitions.pooling_constant, per cell
      - name: stage0_column
        unit: bits and bytes
        definition: the Stage 0 outputs (design artifact)
    secondary:
      - name: shared_units, per-target units, group_ops, la_ops
        unit: oracle work units, group operations, multiply-adds (separate columns)
        definition: fixture_code run_ic_shared and run_ic_reuse
      - name: tau_hat, rank, dependent rows
        unit: fraction of columns; counts
        definition: I1 outputs
      - name: FR_by_L and per_target_cost(L)
        unit: dimensionless; oracle work units
        definition: definitions.observables_and_tests
      - name: sigma_hat bootstrap interval, exponent_rho bootstrap interval
        unit: dimensionless
        definition: 1000 resamples (reported, not gated)
      - name: walk_ops, setup_ops, table_entries, table_bytes, abandoned walks
        unit: counts and bytes
        definition: I2 outputs per L and seed
      - name: certificate_pass_rate
        unit: fraction
        definition: verify.py, per certificate kind
      - name: termination_reason
        unit: label per cell
        definition: completed | timeout | crash | admission_failed | halted

  heuristic_under_test: H1 and H2 of H-BINSTD-7951d2 (both; Stages 1 and 2 are their validation, the pairing DEC-20260928-63addc C5 requires)
  preregistered_prediction:
    quantity: >-
      P1 the Stage 0 figures; P2 the determined fraction and the usable
      probability per decomposition at m = 2, R = B; P3 attempts per target;
      P4 the amortisation observables KR, FR, d_sigma; P5 the pooled rho law;
      P6 the null arm's position.
    formula: >-
      P1: the audit sheet design_figures (column 43.535168, 46.692600,
      48.775634, 51.339588, 55.006722 bits of T_gen; m = 5 critical g 12.256
      in the D3 convention and 12.918 in the proposal convention; m = 4
      envelope closing g 31.517). P2: delta_hat = delta_inf = 0.796812, the
      root of y = 1 - exp(-2y), and u_hat = delta_hat^2, u_pred =
      delta_inf^2 = 0.634909 (determined columns; the touched values 0.864665
      and 0.747645 are diagnostics). P3: attempts geometric with p = 1 -
      exp(-mu_c u), mean a_pred = 2.1276 at mu = 1 and 50.903 on CTRL-ZN
      (mu = 0.0312498). P4: KR = 1, FR = 1, d_sigma = 0, with K_pred 81.731 on
      CTRL-ZN and B_c A(mu_c) / a_pred(mu_c) on the binary cells (380.70 at
      B = 512, mu = 1), sigma_pred -0.640 on CTRL-ZN and about -0.832 at the
      nominal binary parameters. P5: c(L) in [0.8, 1.3] with the Kuhn-Struik
      model values 1.000, 1.094, 1.120, 1.126, 1.128 and exponent_rho
      -0.4805. P6: the null outside every AM band with KR below 0.125 (design
      expectation KR about 1/K_pred, FR about K_pred, d_sigma about +0.7).
    source: >-
      H1: the giant-component law of the random multigraph (Erdos-Renyi,
      recalled, a pointer) with the reviewer Monte Carlo of the abstract
      relation graph (TASK-20260928-d5024b E05, internal); the Poisson
      decomposition count with independent usability; KN-FIND-007 for the
      exact mean. H2: Kuhn-Struik Theorem 1 (SRC-KS, retrieved);
      IDEA-20260920-2e37b3's toy range. Model M_m of definitions. Derivations
      in the audit sheet derivation_notes D-3 to D-8.
    fixed_before_execution: true

  scale_relevance:
    tier: toy
    justification: >-
      Subgroup orders about 2^17 to 2^20 on the executable cells (field bit
      size 19 on the curves; N about 2^20 on the control), m = 2, L up to 1024
      (index calculus) and 256 (rho). The deployed column at n = 131 is
      arithmetic on the model; the transfer assumptions are H1 (the form of
      the uniform-leg law) and H2 (the pooled law's form) and are stated as
      heuristics, never as bounds. The windows' upper ends at deployed L
      (2^29 to 2^99) are not validated by any toy cell.
    correspondence: null

  tail_checks:
    - id: TC-1
      check: >-
        In ATTEMPTS (R-J2-3): the maximum attempts per target on each cell
        against the 0.999 quantile of the maximum of n_t geometric draws with
        p = 1 - exp(-mu_c u_hat) (design: about 22.3 on a binary cell and 712
        on CTRL-ZN at n_t = 1365; expected maxima about 11.4 and 364). An
        excess is reported as a tail anomaly.
    - id: TC-2
      check: The largest decomposition count in any single attempt against the 0.999 quantile of the maximum of Poisson(mu_c) over all attempts; reported.
    - id: TC-3
      check: The 90th percentile over the mean of the per-seed rho totals at each L, against the L = 1 ratio; an L above 2.5 times the L = 1 ratio is reported.

  replication:
    generator: >-
      random.Random (Mersenne Twister) seeded with the SHA-256 digest, read as
      a big-endian integer, of the label string formed by joining the labels
      with "|" (fixture_code seeded). One stream per label; no other source of
      randomness.
    seeds:
      - "permutation: EXP-BINSTD-517186|CTRL-ZN|perm|0"
      - "base (reseed rule): EXP-BINSTD-517186|CTRL-ZN|base|<k>, k = 0, 1, 2, ..."
      - "relations: EXP-BINSTD-517186|<cell>|relation|<j>, j the relation ATTEMPT index from 0"
      - "targets: EXP-BINSTD-517186|<cell>|target|<t>, t = 0 to 1364 (reuse; L cells t in [0,1), [1,5), [5,21), [21,85), [85,341), [341,1365)) and t = 1365 to 1385 (null; [1365,1366), [1366,1370), [1370,1386))"
      - "re-randomisation: EXP-BINSTD-517186|<cell>|attempt|<t>|<i>, i the attempt index from 0"
      - "null arm: EXP-BINSTD-517186|<cell>|null|<t>|attempt|<i> and EXP-BINSTD-517186|<cell>|null|<t>|relation|<j>"
      - "rho: EXP-BINSTD-517186|<cell>|rho|<L>|<seed>, seed 0 to 29; reference: EXP-BINSTD-517186|<cell>|rhoref|<t>|<seed>, t 0 to 4"
      - "bootstrap: EXP-BINSTD-517186|<cell>|bootstrap|<ic | null | rho>"
      - "binary generator: EXP-BINSTD-517186|<cell>|generator|<k>; I1 self-test: EXP-BINSTD-517186|selftest|i1 (driver streams, same generator)"
    independent_instances: 3
    independent_instances_note: three cells; 1365 reuse targets each, 21 null targets on two cells, 30 rho seeds per L; every label string recorded in the manifest

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 12
    maximum_memory_gb: 2
    maximum_runs: 3
    maximum_workers: 1
    note: >-
      One scientific run (Stages 0 to 3 in one run) plus at most two
      infrastructure reruns. Estimate, advisory: binary relation phase about
      512 x 1.58 x 2^10 root solves; reuse targets about 1365 x 2.13 x 2^10;
      the null arm on BIN-ORD-19 about 21 x 1.0 x 512 x 1.58 x 2^10 (about
      2^24 root solves, the largest item); rho at N_G 2^17 to 2^18 with 30
      seeds per L. Minutes to about an hour per binary cell in pure Python.
      The CTRL-ZN permutation holds 2^20 labels (tens of MB). Zero runs in
      the design batch.

  stopping_rules:
    - S0. Stage 0 (stage0.py) exits non-zero on any DESIGN disagreement or failed self-check; the run stops before Stage 1.
    - S1. Stage 2 does not start, and no binary cell is read, until G1 passes on CTRL-ZN with binstd_core.py run unchanged.
    - S2. Stage 1 runs binstd_core.py to completion (it computes every quantity and does not stop at the first failed certificate); if G1 fails the run ends with fixture.json and fixture.log preserved (RUN-ARTIFACT; failed_infrastructure if the failure is a certificate or termination, design defect if a model test fails on the control).
    - S3. A cell halts at a failed admission rule (AR-MU, AR-ORDER, AR-DP, AR-FIELD); the other cell continues; the halted cell is reported not measured.
    - S4. The run ends when every cell has completed or halted, or at the wall-clock ceiling, with every partial artifact preserved and the termination reason per cell.
    - S5. A reuse target reaching 100000 attempts halts that cell as failed_infrastructure (IR-8).

  invalidation_rules:
    - IR-1. Any binary-cell figure produced before G1 passed is invalid and is not read; the run is invalid.
    - IR-2. A failed certificate (CERT-DL, CERT-REL, CERT-LOG) on any reported logarithm or relation, or an inconsistent relation row, invalidates the run (invalid_measurement).
    - IR-3. G1 failing on CTRL-ZN, on any of its conjuncts (a) to (g), including the IC amortisation gates AM1 to AM3 and the H1 tests on the control, invalidates every reading of the run; nothing about any curve is read.
    - IR-3b. A pooling constant outside [0.5, 2] at any L on a binary cell invalidates that cell's rho reading (the H2 axis reads H2-ARTIFACT).
    - IR-4. A cell whose order or primality check disagrees between the two routines, or whose mu_c is outside [0.5, 2] (binary cells), is invalid for that cell (both axes read INCOMPLETE).
    - IR-5. Per-target and shared units summed into one figure, or any fit computed over other than the declared L cells, invalidates the run.
    - IR-6. Any deviation from binstd_core.py or stage0.py as extracted (sha256 differing from the snapshot receipt's extracted_sha256) invalidates the run.
    - IR-7. Any value read from a source replacing a frozen figure (SR-NOSUB) invalidates the run.
    - IR-8. A timeout or crash is failed_infrastructure, never a negative observation; the affected cell reads INCOMPLETE.
    - IR-9. The no-reuse null arm on BIN-ORD-19 lying inside any AM band, or reading KR at or above 0.125, invalidates the IC reading (H1-ARTIFACT); on CTRL-ZN it fails G1.
    - IR-10. CTL-6 failing on a binary cell (relation count differing from B_c, shared units differing from relation attempts x units per attempt, or delta_hat at or above 0.95) invalidates the IC reading (H1-ARTIFACT); on CTRL-ZN it fails G1.

  success_criterion: >-
    Decidable from the primary metrics by binstd_core.stage2_outcome, stated
    before any run. POSITIVE iff all of: S0 passed; G1 passed; no run-wide
    invalidation (IR-1, IR-2, IR-5, IR-6, IR-7); the H1 axis reads
    H1-POSITIVE (both binary cells class PASS: T_delta, T_u, T_a, T_cmp, AM1,
    AM2 and AM3 all inside their two-sided bands, the BIN-ORD-19 null outside
    every AM band, CTL-6 holding); and the H2 axis reads H2-POSITIVE
    (exponent_rho in [-0.6, -0.4] and c(L) in [0.8, 1.3] at every L on all
    three cells). NEGATIVE, a decidable and valid outcome: G1 passed, no
    run-wide invalidation, and either the H1 axis reads H1-NEGATIVE-COVERAGE
    or H1-NEGATIVE-DEVIANT or the H2 axis reads H2-NEGATIVE.
    NOT-VALIDATED: every other valid combination (an axis MIXED, INCOMPLETE
    or ARTIFACT with no axis NEGATIVE). RUN-ARTIFACT: S0 or G1 failed or a
    run-wide invalidation fired; nothing is read. The outcome_table gives the
    axis definitions; the audit sheet outcome_reachability shows a reaching
    pattern for every outcome.

  falsification_criterion: >-
    Stated before any run. H1 (uniform touching at m = 2 on subspace bases, at
    the tested cells) is falsified by H1-NEGATIVE-COVERAGE (both binary cells
    LOW-COV: the amortisation is coverage-limited, the proposal's negative
    outcome) or H1-NEGATIVE-DEVIANT (both binary cells fail an H1 test or an
    amortisation gate, not both in the coverage direction). H2 (i) at the
    tested group orders and L is falsified by H2-NEGATIVE (both binary cells
    outside the H2 band with the control's gate passed). The frontier
    statement (C) is withdrawn by a nonzero identity residual at any m (S0),
    or by a published generic preprocessing algorithm off the S T^2 line, or
    by a source read stating a bound of a different form (the retrieved CGK
    Theorem 2 is of the stated form); the split (A) then stands. An
    instrument failure, timeout or crash falsifies nothing.

  outcome_table:
    certifies_only: >-
      The column with its conventions, the identity, the m = 5 window at
      B_cap(5), the m = 4 slices and envelope (design figures recomputed), and
      the toy validation record of H1 and H2 at m = 2 on the tested cells.
      Nothing else.
    per_cell_class: >-
      PASS, LOW-COV, LOW-RETRY, HIGH, SPLIT (definitions.observables_and_tests;
      binstd_core.classify_cell), a total function of the test results.
    h1_axis:
      H1-ARTIFACT: IR-9 or IR-10 fired on a binary cell (the gates did not discriminate, or an over-complete or mis-accounted relation phase); nothing is read about H1.
      H1-INCOMPLETE: a binary cell halted (S3, S5, IR-4, IR-8) and H1-ARTIFACT does not apply; nothing is read about H1; infrastructure, rerun.
      H1-POSITIVE: both binary cells PASS.
      H1-MIXED: exactly one binary cell PASS (a CTL-2 disagreement); not validated, not falsified.
      H1-NEGATIVE-COVERAGE: both binary cells LOW-COV.
      H1-NEGATIVE-DEVIANT: both binary cells non-PASS and not both LOW-COV (LOW-RETRY, HIGH, SPLIT, or a LOW-COV with any of these); the pair is recorded; a LOW-RETRY pair (per-target cost above the attempts law with coverage normal) is referred to an instrument audit before it is interpreted.
    h2_axis:
      H2-ARTIFACT: IR-3b fired on a binary cell.
      H2-INCOMPLETE: a binary cell halted and H2-ARTIFACT does not apply.
      H2-POSITIVE: all three cells pass the H2 band.
      H2-NEGATIVE: both binary cells fail the H2 band.
      H2-MIXED: every other combination (one binary cell fails, or only the control fails).
    contract_label:
      RUN-ARTIFACT: S0 or G1 failed, or IR-1, IR-2, IR-5, IR-6 or IR-7 fired.
      POSITIVE: H1-POSITIVE and H2-POSITIVE. The column is filed conditional on H1, H2 and C with the validation record.
      NEGATIVE: any axis NEGATIVE. The column carries the measured law for that axis (for H1-NEGATIVE-COVERAGE the amortisation is recorded as coverage-limited on subspace bases at the tested cells).
      NOT-VALIDATED: no axis NEGATIVE and at least one axis MIXED, INCOMPLETE or ARTIFACT. The column is filed as not validated at toy scale, with the measured observables; the next step is a Coordinator decision (replication or an instrument audit).
    most_likely: >-
      Under the contract's random model the modal pattern is P1 of the audit
      sheet outcome_reachability, assigned POSITIVE; the most likely
      non-POSITIVE patterns are a single-L pooling excursion or a
      distinguished-point drift at L near sqrt(N_G), both assigned H2-MIXED
      (NOT-VALIDATED) or, on both binary cells, H2-NEGATIVE.
    tw01_caution: >-
      R-J4-1, carried from the version-1 red team (TASK-20260928-a75ba7
      tripwires_at_top TA-1 caution). Every non-empty crossing window is a
      conditional whose antecedent lies in the TW-01 parameter region (the
      critical log2 C sits 1.34 to 1.40 bits under T_gen at B = B_cap, and
      1.01 bit under it over all m = 4 bases). ANY window reading made with a
      measured per-attempt cost, by anyone, is a TW-01 reading: it is not an
      outcome of this contract and is routed to review-breakthrough at max in
      its own round.
    never_an_outcome: >-
      That any oracle sits below T_gen at n = 131; that index calculus is
      below the generic preprocessing frontier on any deployed row; that any
      algorithm is the first below the S T^2 = N_prime line; that any oracle
      meets any budget; any deployed-curve verdict; what another contract
      (HOLD-X1's ladder included) states, which is a Coordinator act.
      Pre-registered tripwire TW-01 (DEC-20260928-63addc C3; plan TA-1).

  memory_beside_time:
    note: >-
      C6 and R-J2-7. Advice S = B_cap words at 17 bytes (a 129-bit logarithm);
      LA memory = the sparse matrix (m B_cap entries at 8 bytes) plus three
      Krylov working vectors of B_cap residues at 17 bytes (a model
      assumption: a Wiedemann or Lanczos solve keeps at least the current
      vector, the projection vector and an accumulator). Design figures (bits
      of time; log2 bytes), recomputed by stage0.py.
    rows:
      - {m: 4, log2_B_cap: 33.896, S_bytes: '2^37.98 (about 270 GB)', LA_time_bits: 69.79, LA_total_bytes: '2^40.27 (matrix 2^38.90, vectors 2^39.57)', T_gen_bits: 43.54, P_gen_bits: 77.43, pinned_D3_bits: 11.01, record_mu1_bits: 11.0}
      - {m: 5, log2_B_cap: 27.581, S_bytes: '2^31.67 (about 3.4 GB)', LA_time_bits: 57.48, LA_total_bytes: '2^34.09 (matrix 2^32.90, vectors 2^33.25)', T_gen_bits: 46.69, P_gen_bits: 74.27, pinned_D3_bits: 33.08, record_mu1_bits: 32.4}
      - {m: 6, log2_B_cap: 23.415, S_bytes: '2^27.50 (about 190 MB)', LA_time_bits: 49.42, LA_total_bytes: '2^30.04 (matrix 2^29.00, vectors 2^29.09)', T_gen_bits: 48.78, P_gen_bits: 72.19, pinned_D3_bits: 37.39, record_mu1_bits: 36.7}
      - {m: 8, log2_B_cap: 18.287, S_bytes: '2^22.37 (about 5.4 MB)', LA_time_bits: 39.57, LA_total_bytes: '2^25.13 (matrix 2^24.29, vectors 2^23.96)', T_gen_bits: 51.34, P_gen_bits: 69.63, pinned_D3_bits: 42.52, record_mu1_bits: 42.2}
      - {m: 16, log2_B_cap: 10.953, S_bytes: '2^15.04 (about 34 KB)', LA_time_bits: 25.91, LA_total_bytes: '2^18.44 (matrix 2^17.95, vectors 2^16.63)', T_gen_bits: 55.01, P_gen_bits: 65.96, pinned_D3_bits: 'not pinned (recomputed 49.86)', record_mu1_bits: 49.7}
    window_memory: >-
      Index-calculus side: S = 2^31.67 bytes throughout the m = 5 window; on
      the m = 4 sub-cap slice 2^33.12 bytes (2^29.036 words); on the cap
      slice 2^37.98 bytes; on the envelope, S at the maximising base (up to
      2^40.08 bytes at log2 B = 35.996). Comparator side (R-J2-7): for pooled
      rho to reach per-target cost rho_1 / sqrt(L) under the overshoot rule,
      the distinguished-point table holds at least 8 L entries; at 34 bytes
      per entry (a 17-byte point label and a 17-byte logarithm, a model
      assumption) that is 2^57.04 entries and 2^62.13 bytes at the m = 5 D3
      upper end at g = 0 (L = 2^54.04), and 2^63.50 entries and 2^68.59 bytes
      at the m = 4 sub-cap upper end at g = 0. At L = 2^30 the minimum is 2^33
      entries, 2^38.09 bytes. The version-1 example (2^56 entries at L = 2^30
      with theta = 2^-20) is withdrawn: it overstated the minimum by about
      2^23. The windows compare time at unequal memory; both memories are
      stated and neither side is charged the other's.
    proposal_discrepancy_noted: >-
      The proposal states about 580 GB for S at m = 4; 2^33.90 words at 17
      bytes is 2^37.98 bytes, about 270 GB. Recorded; the proposal is not
      edited.

