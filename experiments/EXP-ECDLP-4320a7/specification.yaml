experiment:
  id: EXP-ECDLP-4320a7
  hypothesis_id: H-ECDLP-f3d2fd
  source_proposal: IDEA-20260815-3c9919
  derived_from_idea: IDEA-20260815-3c9919
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    The charged Pollard-rho baseline at 16 to 28 bits -- known-answer gated step
    counts against the birthday prediction for a DECLARED walk variant,
    distinguished-point overhead and peak memory as first-class metrics, a
    MEASURED parallel speedup curve over 1 to 8 workers, and BSGS on the same
    instances as a second baseline

  objective: >-
    The uncertainty a run reduces is what Pollard rho actually costs on this
    program's hardware, as opposed to what it is cited as costing. A run
    establishes, at 16, 20, 24 and 28 bits and only there: (i) that every
    instance's known solution is recovered and its certificate re-verified
    before any timing is admitted; (ii) the fitted step-count constant with a
    bootstrap interval, against the birthday prediction for the walk variant
    declared at approval; (iii) the distinguished-point overhead share, the peak
    resident memory and the peak table occupancy per (size, theta) cell; (iv)
    the MEASURED speedup and total-work inflation over 1, 2, 4 and 8 workers,
    which the one approved rho contract in this repository models rather than
    measures; and (v) BSGS operations and peak memory on the identical
    instances.
    NO NEW ALGORITHM IS PROPOSED AND NO ATTACK IS PERFORMED. Every instance's
    solution is generated before the solve and is known to the harness.
    BUDGET FLOOR NOTE. wall_clock_seconds_per_run is 3600 and maximum_memory_gb
    is 8, both at or above the template floors. The rho work itself is small;
    the budget is sized to the replication count, the parallel arm and BSGS
    table construction at 28 bits.

  what_this_is_not:
    - >-
      Not an attack and not a key recovery. Scalars are drawn and recorded by
      the harness before each solve; nothing secret is targeted.
    - >-
      Not an improvement to Pollard rho. The incumbent is measured here and
      explicitly not improved, as the parent proposal states.
    - >-
      Not a cryptographic-scale statement. Bit sizes 16 to 28 only, and no
      extrapolation beyond 28 bits is offered for any quantity.
    - >-
      Not a re-adjudication of any past charged comparison in the campaign.
      Re-reading an earlier comparison against a newly measured baseline is a
      separate Coordinator act with its own decision record.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope -- for prime-order subgroups at 16, 20, 24 and
      28 bits, on the named execution host, under the declared walk variant,
      theta and charging convention: the fitted step-count constant with its
      interval and its slope against log N; the wall-clock constant per size;
      the distinguished-point overhead share, peak resident memory and peak
      table occupancy per cell; the measured speedup and total-work inflation
      at 2, 4 and 8 workers; and BSGS operations and peak memory on the same
      instances.
      WHAT DOES NOT FOLLOW -- no statement about any size above 28 bits, no
      statement about any other implementation or host, no statement that any
      competitor is better or worse than rho, no wall-clock statement that
      transfers across sizes, and specifically no re-reading of any prior
      comparison in the campaign.

  inputs:
    procedure: >-
      STAGE 0 (reading; CAN TERMINATE THE LINE, ZERO COMPUTE). Open
      experiments/EXP-RHO-60da4f/specification.yaml and enumerate its runs
      directory. Record verbatim, with paths, whether any COMPLETED run reports
      a collision constant, a distinguished-point table size and a peak resident
      memory. If one does, STOP and report: the parent proposal's premise that
      no record measures rho's constant is false at the tested scope,
      conjuncts C2 and C3 are superseded, and the contract narrows to the
      parallel arm or terminates. In the same stage open KN-TECH-001 and
      KN-TECH-006 and record verbatim what constant and what parallelisation law
      the committed corpus actually states; the recalled values 0.8862, 1.2533
      and 'near-linear' are NOT used until this reading is recorded. Record the
      search commands and their output verbatim.
      STAGE 1 (instrument gate; nothing downstream runs until it passes).
      Construct the instance sets at all four sizes with certified subgroup
      order, base-point order and non-anomalous condition, with the scalar drawn
      and recorded before the solve. Run rho and verify 100 percent recovery
      with independent re-verification of each recovered scalar against the
      original instance. Run the random-oracle walk control and record its
      constant. Run BSGS unconstrained on the same instances. WRITE the verdicts
      of this stage, timestamped, BEFORE any constant is fitted.
      STAGE 2 (the constant). Fit the step-count constant per size and pooled,
      with a bootstrap interval, and its slope against log N with an interval.
      Report against BOTH candidate predictions, 0.8862 and 1.2533, with the
      DECLARED variant marked as the acceptance test and the other shown for
      reference. Report the wall-clock constant per size in a separate column
      that is never combined with the step-count column.
      STAGE 3 (the memory and the distinguished-point term). Per (size, theta)
      cell record peak resident bytes, peak table entries, table bytes, the
      distinguished-point predicate evaluation count and the share of total
      charged cost attributable to the distinguished-point machinery. Include
      the 4x theta sweep at 20 bits as its own cells.
      STAGE 4 (the parallel curve, MEASURED). At 24 bits, run at worker counts
      1, 2, 4 and 8, recording per worker count the wall clock, the TOTAL group
      operations across all workers, the peak aggregate memory and the speedup
      against the 1-worker wall clock. Report total-work inflation separately
      from speedup; a curve reported without it is incomplete.
      STAGE 5 (write-up). Produce the measured-versus-modeled table, the
      optimistic-assumption list with the direction of each bias, and the
      time-memory statement with its interpolation range. Every table carries
      peak memory beside time.
    instrument: >-
      The program's toy-curve arithmetic and rho harness with distinguished
      points, plus a BSGS implementation with an instrumented table. Python 3;
      a compiled inner loop may be used and is recorded if it is. Bootstrap
      intervals from 10000 resamples with the resample seed recorded. All runs
      recorded through harness/runner.py. NO network access is required and none
      may be used.
    parameters: >-
      Subgroup bit sizes 16, 20, 24, 28. At least 200 instances per size. Walk
      variant declared at approval and frozen, either negation-quotiented with
      predicted constant 0.8862 or un-quotiented with predicted constant 1.2533.
      Acceptance band plus or minus 5 percent on the fitted constant against the
      declared prediction. Distinguished-point rate theta frozen before Stage 1,
      with a 4x sweep at 20 bits only. Worker counts 1, 2, 4, 8 at 24 bits.
      Parallel acceptance floor 0.6 times worker count at 8 workers. Charging
      convention: group-operation equivalents for time, one point addition equal
      to one operation; memory in peak resident bytes and in table bits,
      reported separately and never merged into the time column.

  controls:
    - >-
      NULL 1, KNOWN-SOLUTION VERIFICATION, BLOCKING, CAN FAIL. Every instance
      carries a scalar drawn and recorded before the solve, and the recovered
      scalar is re-verified against the original instance by an independent code
      path. FORCED: 100 percent recovery on admitted instances. This is the
      parent proposal's first control and it runs BEFORE any timing is admitted,
      not alongside it.
    - >-
      NULL 2, BSGS SECOND BASELINE ON THE SAME INSTANCES, BLOCKING, CAN FAIL.
      FORCED: with an unconstrained table, BSGS uses fewer group operations than
      rho at every tested size. If it does not, one of the two implementations
      is wrong and neither baseline is admissible. The parent proposal's stated
      purpose for this control is preserved: a single baseline hides
      implementation-quality problems that a second one exposes.
    - >-
      RANDOM-ORACLE WALK CONTROL, CAN FAIL. A walk driven by a keyed hash into
      the group realises the ideal random-map constant by construction. The
      instrumented walk must not beat it by more than the acceptance band; a
      candidate that does falsifies the measurement rather than the band. A
      COORDINATOR ADDITION, adopted from EXP-RHO-60da4f control
      C2_random_oracle_walk: the parent proposal names implementation quality as
      its dominant risk but supplies no instrument for it.
    - >-
      IMPLEMENTATION-QUALITY GATE, BLOCKING. The fitted constant must lie within
      the acceptance band of the prediction for the declared variant. Outside
      it, the correct verdict is 'the implementation is weak or the cost model
      differs' and BOTH must be resolved before the baseline is used by
      anything. The parent proposal states the direction of the danger and it is
      preserved: a weak rho baseline flatters every competitor measured against
      it.
    - >-
      ORDERING RULE, BLOCKING. Stage 1's recovery verdict, the BSGS null and the
      random-oracle control are computed, recorded and timestamped BEFORE any
      constant is fitted in Stage 2, so that no constant can be reported off an
      instrument that already failed.
    - >-
      THETA CONTROL. The distinguished-point rate is frozen before Stage 1 and
      held identical across sizes and worker counts. The 4x sweep at 20 bits is
      a separate declared cell, not a re-tuning: a theta chosen after seeing a
      constant is a tuned baseline and voids the package.
    - >-
      SUPERSESSION GATE, ZERO COMPUTE, CAN TERMINATE. Stage 0's search of
      EXP-RHO-60da4f and its runs is a falsifiable claim about this repository
      and is executed rather than asserted, with paths and verbatim quotations
      recorded. Absence of a result is not evidence that no such measurement
      exists elsewhere, and in particular this worktree cannot see unmerged
      branches; that limit is recorded in the run report.

  independent_variables:
    - subgroup bit size, over 16, 20, 24 and 28
    - distinguished-point rate theta, at its frozen value and at a 4x sweep at 20 bits
    - worker count, over 1, 2, 4 and 8, at 24 bits
    - algorithm, over rho, the random-oracle walk control and BSGS
    - instance seed

  metrics:
    primary:
      - >-
        recovery_rate -- fraction of admitted instances whose scalar is
        recovered AND independently re-verified against the original instance.
        Dimensionless. Forced value 1.0. MEASURED.
      - >-
        step_count_constant -- measured group operations to solution divided by
        sqrt(N), per size and pooled, with a bootstrap interval and the achieved
        relative standard error. Dimensionless. MEASURED.
      - >-
        constant_size_slope -- fitted slope of step_count_constant against
        log N, with interval. Dimensionless. MEASURED. Consistency with zero is
        the transferability test for HEUR-RHO-BASE-1.
      - >-
        dp_overhead_share -- share of total charged cost spent in the
        distinguished-point predicate, table insertion and table lookup, per
        (size, theta). Dimensionless fraction. MEASURED.
      - >-
        peak_resident_bytes and peak_table_entries -- per (size, theta, worker
        count). Bytes and entries. MEASURED. Reported beside time in every
        table; a table without them is out of contract.
      - >-
        parallel_speedup -- 1-worker wall clock divided by w-worker wall clock,
        at w in 1, 2, 4, 8 at 24 bits, with interval. Dimensionless. MEASURED.
      - >-
        total_work_inflation -- total group operations across all workers at w
        divided by total group operations at w equal to 1. Dimensionless.
        MEASURED. Reported alongside speedup; speedup without it is incomplete.
      - >-
        bsgs_operations and bsgs_peak_bytes -- on the identical instances with
        an unconstrained table, per size. MEASURED.
    secondary:
      - >-
        wall_clock_constant -- measured seconds to solution divided by sqrt(N),
        per size, in its OWN column, with the explicit note that it does not
        transfer across sizes because per-step field arithmetic grows with p.
        MEASURED.
      - >-
        random_oracle_walk_constant -- the control walk's fitted constant, per
        size. MEASURED.
      - >-
        theta_sweep_table -- peak table entries, restart cost and step count at
        the frozen theta and at 4x theta, at 20 bits. MEASURED.
      - >-
        per_step_field_multiplications -- charged field-multiplication count per
        group operation, per size. MEASURED.
      - >-
        stage0_supersession_log -- verbatim commands, paths and quotations from
        the EXP-RHO-60da4f and KN-TECH-001/006 reading.
      - >-
        slowest_decile_profile -- the step counts of the slowest decile of
        instances per size, for the tail check.

  measured_vs_modeled:
    measured:
      - group operations to solution, per instance, from instrumented runs
      - wall clock and peak resident bytes, per run
      - distinguished-point predicate evaluations, table entries and table bytes
      - parallel speedup and total-work inflation at 2, 4 and 8 workers
      - BSGS operations and peak memory on the same instances
      - the fitted constants and every interval, from the measured samples
    modeled:
      - >-
        the predicted step-count constants 0.8862 and 1.2533, which are
        analytic values for the two walk variants and are the comparison target,
        never a measurement
      - >-
        the near-linear parallelisation law, which is the prediction the
        measured curve is compared against and is not itself measured
      - >-
        any statement about behaviour above 28 bits, which is extrapolation and
        is labelled as such wherever it appears
    optimistic_assumptions_with_bias_direction:
      - >-
        Curve arithmetic is not assembly-optimised. BIAS: inflates the absolute
        wall-clock constant, i.e. makes rho look SLOWER than a tuned
        implementation would be, which FLATTERS any future competitor compared
        against it. This is the dangerous direction and it is the reason for the
        random-oracle walk control and the acceptance band.
      - >-
        The distinguished-point rate theta is chosen once and frozen rather than
        optimised per size. BIAS: unknown in sign, because theta trades table
        memory against restart cost; it is reported per cell and swept once so
        the reader can see the sensitivity rather than trust the choice.
      - >-
        Peak resident bytes include interpreter and harness overhead that a
        production implementation would not pay. BIAS: OVERSTATES rho's memory,
        which makes rho look worse on the memory axis and flatters
        memory-hungry competitors. Table entries and table bytes are reported
        separately precisely so the algorithmic memory can be read without the
        overhead.
      - >-
        The parallel arm runs 8 workers on one host with shared memory, not a
        cluster with a real interconnect. BIAS: OVERSTATES achievable speedup
        relative to a distributed deployment, because the distinguished-point
        store is local and free to reach. Stated in every parallel table.
      - >-
        Instances are uniform random curves at each size rather than
        standardised curves. BIAS: none expected on the constant, but it means
        no statement about any named curve follows.
    time_memory_tradeoff: >-
      Rho's memory is the distinguished-point table, whose size scales as theta
      times the walk length; lowering theta shrinks the table and raises expected
      restart and traversal cost. The contract measures TWO points on this curve
      only -- the frozen theta and 4x theta, at 20 bits -- so the interpolation
      range is exactly [theta, 4*theta] at 20 bits and nothing outside it may be
      quoted. BSGS sits at the opposite endpoint: sqrt(N) table entries and no
      restarts. The two endpoints are reported as endpoints, not as a fitted
      curve, because two points do not determine one.

  heuristic_under_test: HEUR-RHO-BASE-1

  preregistered_prediction:
    quantity: >-
      step_count_constant per size and pooled, its slope against log N,
      recovery_rate, the BSGS operation-count ordering, and parallel_speedup at
      2, 4 and 8 workers.
    formula: >-
      Expected group operations to solution equal c * sqrt(N), with c equal to
      sqrt(pi/4) approximately 0.8862 for the negation-quotiented walk and
      sqrt(pi/2) approximately 1.2533 for the un-quotiented walk; the DECLARED
      variant fixes which is the acceptance test and the acceptance band is plus
      or minus 5 percent. The slope of c against log N is predicted to be zero.
      recovery_rate is predicted to be exactly 1.0. BSGS is predicted to use
      fewer group operations than rho at every size with an unconstrained table.
      Parallel speedup is predicted near-linear, with the pre-registered failure
      floor at 0.6 times the worker count at 8 workers.
      UNDER THE NULL that the implementation is weak, the fitted constant
      exceeds the prediction and the random-oracle control does not, which is
      how the two are distinguished.
    source: >-
      The birthday analysis of collision search and the van Oorschot-Wiener
      distinguished-point parallelisation, both RECALLED in the parent proposal
      IDEA-20260815-3c9919 and neither opened by any agent in this program.
      Stage 0 reads KN-TECH-001 and KN-TECH-006 and records what the committed
      corpus states before these values are used. The sqrt(pi/4) versus
      sqrt(pi/2) distinction is a DERIVATION by the converting Coordinator: the
      parent proposal names sqrt(pi*N/4) without saying which walk variant it
      assumes, and the two differ by sqrt(2), so the variant is declared at
      approval rather than chosen after seeing the data. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      TOY AND ACTUALLY TOY. Prime-order subgroups at 16, 20, 24 and 28 bits are
      CONSTRUCTED and solved, so toy-scale evidence genuinely exists and the
      label is earned rather than conservative. Every tested size is at or below
      28 bits and therefore within the program's toy band. What is claimed to
      transfer beyond the tested range is ONLY the step-count constant, and that
      transfer is HEUR-RHO-BASE-1, which this experiment tests across a 12-bit
      range and cannot test beyond it. The wall-clock constant is claimed NOT to
      transfer, for the reason the heuristic itself states. Resulting evidence
      may not exceed claim_tier toy under any outcome, and no number produced
      here may appear in a cryptographic-scale cost statement.
    correspondence: null
    correspondence_note: >-
      Null because instances are sampled directly at the tested sizes. No
      correspondence trick is used to reach a scale the computation cannot
      reach, and none is claimed.

  tail_checks:
    - >-
      The slowest decile of instances at each size, checked against the Rayleigh
      tail of the collision-time distribution and against
      distinguished-point-parameter effects. The parent proposal names this
      check explicitly. A heavy tail that is not a theta artifact is a walk
      quality problem, not a finding about rho.
    - >-
      The fastest decile, checked for instances that terminated implausibly
      early, which is the signature of an instance whose scalar leaked into the
      walk or whose subgroup order is not what the certificate says.
    - >-
      The 4x theta cell at 20 bits, checked to confirm that the step-count
      constant is theta-invariant within its interval while the table size is
      not. A theta-dependent step-count constant means theta is a confounder
      rather than a parameter and the constant is not reportable as a single
      number.
    - >-
      The 8-worker cell, checked to confirm that total group operations across
      workers has not fallen below the 1-worker total. A total-work DECREASE
      under parallelisation is impossible for independent walks sharing one
      store and indicates double-counted or lost work.

  replication:
    seeds: []
    seeds_note: >-
      DELIBERATELY EMPTY AT CONTRACT TIME AND FILLED AT APPROVAL. This
      experiment is genuinely stochastic -- instance curves, base points,
      scalars and walk start points are all drawn at random -- so seeds are
      required, unlike a purely deterministic contract. They are not enumerated
      here because the instance count is 200 per size across four sizes and the
      seed list is generated from a single recorded master seed at approval
      time. The BINDING requirement is that the master seed is recorded in the
      approval decision before execution, that every derived seed is logged per
      instance, and that the same instance set is reused verbatim by the BSGS
      arm, the random-oracle control and every worker count. A run that draws
      fresh instances per arm has not made the paired comparison this contract
      specifies and is completed_invalid.
    independent_instances: 2
    independent_instances_note: >-
      Two full independent executions from the same master seed, required to
      produce identical group-operation counts per instance. The walk is
      deterministic given its seed, so any difference between the two is an
      implementation or environment defect. The parallel arm is exempt from
      byte-identity on wall clock but not on total group operations.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 8

  stopping_rules:
    - >-
      Stop and report if Stage 0 finds a completed run already reporting rho's
      collision constant with its table size and peak memory. The premise is
      answered, C2 and C3 are superseded, and the run cites that record rather
      than re-measuring.
    - >-
      Abort the package if Stage 1's recovery verdict is below 1.0 on admitted
      instances, and report the instrument failure rather than any constant.
    - >-
      Abort the package if the BSGS null misbehaves, i.e. BSGS uses more group
      operations than rho at any size with an unconstrained table.
    - >-
      Stop the parallel arm at 8 workers. No worker count is added after seeing
      a speedup curve, and the arm is never re-run at a different theta to
      improve a curve.
    - >-
      Stop at the declared four sizes, the declared theta and its single 4x
      sweep. No size is added and no theta is re-tuned after a constant has been
      seen.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop and is reported as censoring, never as a negative
      result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion, descheduled worker or dependency
      failure makes the run failed_infrastructure and is NEVER negative
      mathematical evidence about rho (AGENTS.md rule 5).
    - >-
      A run reporting any timing for an instance whose solution was not
      independently re-verified is completed_invalid.
    - >-
      A run whose walk variant differs from the one declared in the approval
      decision is a DIFFERENT experiment and requires a new contract; it is
      never a repair of this one.
    - >-
      A run that re-tunes theta, the instance count or the acceptance band after
      observing a fitted constant is completed_invalid. Changing a success
      criterion after seeing an outcome requires a versioned protocol_amendment.
    - >-
      A run reporting a rho or BSGS cost without peak memory beside it, or
      merging a measured and a modeled number into one column, is
      completed_invalid regardless of the numbers.
    - >-
      A run reporting a parallel speedup without the accompanying total-work
      inflation is completed_invalid, because speedup alone cannot distinguish
      real parallel gain from redundant work.
    - >-
      A run that draws fresh instances for a comparison arm rather than reusing
      the frozen instance set is completed_invalid; the comparison the contract
      specifies was not made.
    - >-
      A run quoting any constant at a bit size outside 16 to 28, or in a
      cryptographic-scale cost statement, is completed_invalid.

  success_criterion: >-
    All seven of the following hold, each decidable from the primary metrics --
    (1) Stage 0 is executed and its log recorded verbatim, and either no
    superseding completed run is found or the run stops and reports one;
    (2) recovery_rate equals 1.0 on admitted instances at all four sizes;
    (3) step_count_constant is reported per size and pooled with a bootstrap
    interval whose achieved relative standard error is at or below 5 percent,
    and lies within plus or minus 5 percent of the prediction for the DECLARED
    walk variant at all four sizes;
    (4) constant_size_slope is reported with an interval and its consistency
    with zero stated;
    (5) dp_overhead_share, peak_resident_bytes and peak_table_entries are
    reported for every (size, theta) cell, and peak memory appears beside time
    in every table;
    (6) parallel_speedup and total_work_inflation are reported at 1, 2, 4 and 8
    workers, with speedup at 8 workers at or above 0.6 times 8;
    (7) bsgs_operations and bsgs_peak_bytes are reported on the identical
    instances and BSGS uses fewer group operations than rho at every size.
    The experiment SUCCEEDS AS AN INSTRUMENT whichever way the constant comes
    out within its band; it fails only when a blocking control fails or a
    required quantity is unreported.

  falsification_criterion:
    - >-
      recovery_rate is below 1.0 on admitted instances. The implementation is
      wrong; every timing in the affected cells is void and no constant is
      reportable. Instrument outcome, not a statement about rho.
    - >-
      step_count_constant lies outside the acceptance band for the declared
      variant, reproduced across sizes, while the random-oracle walk control is
      also outside it. Either the implementation is weak or the cost model
      differs, and BOTH must be resolved before this baseline is used by
      anything. C2 is rejected at the tested scope.
    - >-
      constant_size_slope excludes zero. HEUR-RHO-BASE-1's transferable half is
      refuted at the tested scope: the step-count constant does not transfer
      across the tested range, every constant is scoped to its own size, and no
      pooled constant may be quoted anywhere.
    - >-
      parallel_speedup at 8 workers falls below 0.6 times 8. Carried from the
      parent proposal: this indicates an IMPLEMENTATION PROBLEM and is reported
      as one. It is explicitly not evidence that parallel rho fails to scale,
      and C4 is reported as unmeasured rather than as measured-and-negative.
    - >-
      total_work_inflation grows faster than the speedup, so that wall-clock
      gain is bought entirely with redundant work. The parallel arm's honest
      output is then that this implementation's parallelisation is not free at
      these sizes, scoped to the tested worker counts and to a single shared-
      memory host.
    - >-
      BSGS uses more group operations than rho at any size with an unconstrained
      table. One of the two implementations is wrong; neither baseline is
      admissible and no comparison in the campaign may cite either until it is
      resolved.
    - >-
      Stage 0 finds a completed run already reporting the collision constant,
      the table size and peak memory. The parent proposal's premise is FALSE at
      the tested scope; C2 and C3 are superseded and this is reported as the
      headline outcome rather than as a footnote.
    - >-
      The step-count constant proves theta-dependent at the 4x sweep beyond its
      interval. theta is a confounder rather than a parameter and no single
      constant is reportable; the deliverable becomes a constant-versus-theta
      table.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, host description, resolved model/inference block and environment
    - raw-result.json with one row per instance carrying seed, size, theta, worker count, group operations, wall clock, peak resident bytes, peak table entries and the recovery verdict -- never summaries alone
    - the per-instance solution certificates and the independent re-verification log
    - the Stage 0 supersession log with verbatim commands, paths and quotations from EXP-RHO-60da4f, KN-TECH-001 and KN-TECH-006
    - the Stage 1 instrument verdicts, timestamped before any fitted constant
    - the fitted-constant table per size and pooled, with bootstrap intervals, achieved relative standard error, and BOTH candidate predictions shown with the declared one marked
    - the wall-clock constant table in its own file or its own clearly separated column
    - the (size, theta) memory table with peak resident bytes, peak table entries, table bits and distinguished-point overhead share
    - the parallel table with speedup and total-work inflation at 1, 2, 4 and 8 workers and the shared-memory-host caveat stated in place
    - the BSGS table with operations and peak memory on the identical instances
    - the measured-versus-modeled table, the optimistic-assumption list with each bias direction, and the time-memory statement with its interpolation range [theta, 4*theta] at 20 bits
    - the tail-check outputs for the slowest and fastest deciles
    - the pre-registration text, written before the first run and hashed

  assigned_to: executor
  approved_by: null

  approval_gate:
    - >-
      Coordinator drafting does not confer approval. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false. Approval is a separate act because it
      authorizes execution and spends compute.
    - >-
      THE WALK VARIANT MUST BE DECLARED IN WRITING BEFORE APPROVAL --
      negation-quotiented or un-quotiented. The acceptance test is the
      prediction for that variant and the two candidates differ by sqrt(2). A
      contract approved without a declared variant has no decidable acceptance
      criterion and must not be executed.
    - >-
      The master seed must be recorded in the approval decision before
      execution, so that the instance set is fixed before any arm runs and
      cannot be redrawn after an unfavourable cell.
    - >-
      maximum_workers is declared as 8, which authorises the run to create
      descendant processes. Per templates/research-records.md this may be
      declared only for work that has passed parallel.verify_determinism. That
      check must be run and its result recorded before approval; if it has not
      passed, the parallel arm is removed and maximum_workers returns to 1
      under a new contract version rather than being relaxed here.
    - >-
      Stage 0 must be run and its log reviewed before the compute-bearing stages
      are authorised, because it can terminate the line at zero cost.

  derivation_provenance:
    tool: coordinator-authored contract under the backlog-conversion task
    source_record: IDEA-20260815-3c9919
    authored_under_task: TASK-20260904-35fbe5
    authored_at: '2026-09-04'
    note: >-
      Metrics, controls, nulls and falsifiers are taken from the parent
      proposal's predictions, minimal_test, controls, required_metrics,
      falsification_conditions, confounders and interpretation_limits, and
      restated as measurable quantities with units. Boilerplate identical across
      contracts by program rule -- invalidation rules, required artifacts,
      approval gate -- follows the fixed table. No field is invented; a value the
      proposal did not supply is null, is recorded as a derivation gap below, or
      is flagged in place as a Coordinator addition.

  coordinator_additions_flagged:
    - >-
      THE FOUR CONCRETE BIT SIZES. The proposal says 'four sizes' without naming
      them. 16, 20, 24 and 28 are chosen by the converting Coordinator to give a
      12-bit lever arm for the size-slope test while keeping every instance
      inside the toy band.
    - >-
      THE INSTANCE COUNT OF 200, above the proposal's minimum of 30, with the
      Rayleigh-limit derivation of why 30 cannot decide a 5 percent band. The
      derivation is a model statement and the ACHIEVED interval is what the
      success criterion reads.
    - >-
      THE ACCEPTANCE BAND OF PLUS OR MINUS 5 PERCENT and the parallel failure
      floor of 0.6 times worker count. The proposal requires only that the
      constant not be 'far from' the published expectation and that the parallel
      curve not be 'far from' linear, neither of which is decidable as written.
      Declared before measurement and attributed to the Coordinator.
    - >-
      THE WALK-VARIANT DECLARATION AND THE TWO CANDIDATE CONSTANTS. See
      derivation_gaps below; this is the largest single addition and it exists
      because without it the proposal's own acceptance test is ambiguous by a
      factor of sqrt(2).
    - >-
      THE RANDOM-ORACLE WALK CONTROL, adopted from EXP-RHO-60da4f. The proposal
      names implementation quality as the dominant confounder and supplies no
      instrument for it.
    - >-
      THE STAGE 0 SUPERSESSION TERMINATOR against EXP-RHO-60da4f. The proposal
      asserts that no record in this corpus measures rho's constant; an approved
      contract that contracts exactly that measurement exists in this worktree,
      so the assertion is checked rather than inherited.
    - >-
      TOTAL-WORK INFLATION as a required companion to speedup. The proposal asks
      for a speedup curve only, which cannot distinguish real parallel gain from
      redundant work.

  derivation_gaps:
    - >-
      THE CONSTANT'S VARIANT AMBIGUITY, THE LARGEST GAP. The parent proposal's
      HEUR-RHO-BASE-1 names sqrt(pi*N/4), approximately 0.8862 * sqrt(N), as its
      rigorous ingredient. That value corresponds to a walk over an effectively
      halved state space, i.e. the negation-quotiented walk; the un-quotiented
      walk predicts sqrt(pi*N/2), approximately 1.2533 * sqrt(N). The proposal
      does not say which it assumes. This contract does not resolve the
      ambiguity by choosing -- it makes the choice an approval-time declaration
      and reports both candidates, because resolving it after seeing the data
      would make the acceptance test unfalsifiable.
    - >-
      THE PREMISE IS PARTLY REFUTED ALREADY, AND THE CONTRACT SAYS SO RATHER
      THAN CARRYING IT. EXP-RHO-60da4f is an APPROVED contract in this worktree
      whose secondary metrics include 'collision_constant: measured steps /
      sqrt(N/2)' and 'peak_rss_bytes and distinguished-point table size'. Its
      tier is medium at 2^32 to 2^48. Whether any run under it has COMPLETED was
      not determined during conversion; Stage 0 determines it. The parent
      proposal's claim that no record measures rho's constant is therefore
      already false at the CONTRACT level and possibly at the RUN level.
    - >-
      WHAT SURVIVES THAT OVERLAP IS THE PARALLEL ARM, AND IT SURVIVES CLEANLY.
      EXP-RHO-60da4f states in its own optimistic-assumption list:
      'Parallelisation is modeled as near-linear per KN-TECH-006 rather than
      measured on a cluster.' The measured speedup curve is therefore genuinely
      unmeasured in this repository, which is why C4 carries the most content
      and why this contract remains worth running even if Stage 0 supersedes C2
      and C3.
    - >-
      THIS WORKTREE CANNOT SEE UNMERGED BRANCHES. A working-tree search
      establishes only what is present here. Another branch may already carry a
      measured rho baseline, and Stage 0 cannot rule that out. The limitation is
      recorded rather than resolved.
    - >-
      NO CLUSTER. The parallel arm runs on one shared-memory host, so it
      measures shared-memory parallelism and not distributed collision search.
      The distinguished-point store is local and free to reach, which is the
      optimistic direction. Nothing here supports a distributed speedup claim.
    - >-
      TWO POINTS DO NOT DETERMINE A TIME-MEMORY CURVE. The theta sweep gives one
      pair at one size, so the interpolation range is stated as exactly
      [theta, 4*theta] at 20 bits and no functional form is fitted.
