experiment:
  id: EXP-HQCX-9cc3a7
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b0322a; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b0322a
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Two-arm ring-ablation measurement of the HQC block-failure-count distribution: quasi-cyclic
    ring versus matched non-circulant surrogate, one invocation, one seed ladder, one estimator, with
    a planted-artefact positive control'
  objective: 'The one uncertainty a run reduces: how much of the failure-law structure GOAL-HQC-001
    has measured inside the quasi-cyclic ring is attributable to the ring at all. Concretely a run
    establishes (i) whether the histogram of S = sum_j F_j is distinguishable between a circulant
    arm and a matched non-circulant arm at a MEASURED sensitivity, where the sensitivity is fixed
    by a planted-artefact positive control rather than assumed; (ii) whether the pairwise joint-failure
    structure in the circulant arm is a function of block separation - which stationarity forces it
    to be if the ring matters and which the null arm forces to be flat if it does not; and (iii) what
    fraction of the committed joint-moment deficit of EV-HQC-b71230 survives the ring ablation, which
    bounds how much of that deficit any circulant explanation could ever own. The run reduces uncertainty
    in exactly one direction: it converts an untested attribution - ''the measured deficit is about
    HQC''s ring'' - into either a measured arm difference or a measured detection bound. Both outcomes
    are usable and the bound is the more likely one. No attack, break, speedup or security consequence
    is claimed here or would follow from a run. No statement is made about what the published literature
    does or does not contain; this environment cannot reach external literature. No direction is declared
    impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support: at the single reduced
      parameter set actually executed, with the stated weights, truncation fraction, decoder, tie
      rule, sampler and trial count, the block-failure-count distribution of the circulant arm either
      does or does not differ from the matched non-circulant arm by more than the calibrated 5-sigma
      threshold, and the pairwise joint-failure structure either is or is not a function of block
      separation. WHAT DOES NOT FOLLOW: nothing about HQC''s deployed parameter sets, nothing about
      the decryption failure rate at any security level, nothing about whether any measured difference
      is algorithmically usable, nothing about key recovery, and nothing about the correctness of
      the specification''s own analytic model, which this run does not evaluate.'
  inputs:
    procedure: 'STAGE 0 (zero compute): verify ord_n(2) = n-1 at every candidate n and abort otherwise;
      record the derived stationarity statement that forces per-block marginal equality. STAGE 1 (minutes):
      implement both arms behind one interface; run the bit-identity check on the shared seed prefix;
      assert the F[:, block] shape invariants. STAGE 2 (minutes, 1e6 trials per arm): emit the S histogram,
      the per-block marginal vector and the pairwise joint-failure matrix for both arms at N/n = 0.98.
      STAGE 3 (minutes): run the planted-artefact positive control in the signal arm at three planting
      magnitudes and fit the detection threshold. STAGE 4 (tens of minutes): repeat STAGE 2 across
      the truncation ladder N/n in {0.25, 0.5, 0.75, 0.98} and across three n values, to give the
      survival score. STAGE 5 (zero compute): compute the three gates, the two-sample statistics and
      the surviving fraction of the committed log2 A-hat_2 deficit; write the run record with every
      gate''s pass/fail state.'
    instrument: Python 3.11 with numpy only; NO Sage anywhere. GF(2) vectors bit-packed into numpy
      uint64 arrays; cyclic products by numpy convolution over the integer lift followed by a parity
      reduction, cross-checked against a naive shift-and-xor implementation on every 1000th trial;
      inner Reed-Muller RM(1,m) maximum-likelihood decoding by a fast Walsh-Hadamard transform written
      in numpy, with the deployed deterministic tie rule applied to the arg-max; outer bounded-distance
      stage as a pure threshold on S, which is exact for a bounded-distance decoder and needs no field
      arithmetic. New module under harness/, following harness/runner.py's manifest conventions so
      the resolved inference block and seeds land in the run manifest. Seeds from a declared ladder
      recorded in the specification before any data is generated.
    parameters: 'n in {101, 227, 587} (each with ord_n(2) = n-1 verified at run time, fail-closed).
      Inner code RM(1,5), length 32, duplication 1. n_e in {3, 7, 18} chosen so n_e * 32 <= n at the
      declared truncation fraction. Truncation ladder N/n in {0.25, 0.5, 0.75, 0.98}. Input weights
      tuned once, before the measurement run and on a separate seed stream, so the per-block failure
      rate lands in [1e-3, 1e-2]; the tuning seeds are recorded and never reused. Trials T = 1e6 per
      arm per cell for the main measurement, T = 1e5 per cell for the ladder. Positive-control planting
      magnitudes at three levels spanning a factor of 10. Total cells: 2 arms x 4 truncation values
      x 3 n values = 24, plus 9 positive-control cells.'
  controls:
  - Non-circulant surrogate arm, same invocation, same seed ladder, same estimator code path.
  - Per-block marginal equality gate between arms; failure aborts the comparison as unmatched.
  - Flat-block-separation-profile gate on the null arm; a non-flat profile voids the run.
  - Planted low-autocorrelation support as a positive control in the signal arm, with a pre-declared
    magnitude, so an agreement result carries a measured sensitivity.
  - Bit-identity check on the shared random prefix consumed by both arms, reported as pass/fail counts.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the non-circulant surrogate: the same n, the same
    n_e and n_2, the same fixed-weight samplers at the same weights, the same truncation, the same
    decoder and tie rule, but products taken against a uniformly random binary matrix of matched row
    weight rather than a circulant. It runs in the SAME process invocation, off the same seed ladder,
    through the same estimator code path. FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW:
    (i) the per-block marginal failure rate agrees between arms to within its own Monte-Carlo error
    - if it does not, the arms are not matched and no comparison is reportable; (ii) the block-separation
    profile of pairwise joint failures is FLAT in the null arm, since a random matrix has no separation
    to be a function of - a non-flat null profile means the estimator is manufacturing structure and
    the run is void; (iii) the planted-artefact positive control fires in the signal arm at the pre-declared
    magnitude, so that an agreement result carries a measured sensitivity rather than an assumed one.'
  independent_variables:
  - 'ring: quasi-cyclic circulant versus matched random non-circulant'
  - truncation fraction N/n
  - ring dimension n
  - planted-artefact magnitude (positive-control arm only)
  metrics:
    primary:
    - histogram of S per arm
    - two-sample Anderson-Darling statistic between arms
    - per-block marginal failure rate vector per arm
    - block-separation profile of pairwise joint failures per arm
    - log2 A-hat_2 per arm
    secondary:
    - flatness statistic of the null arm's separation profile
    - calibrated 5-sigma detection threshold from the positive control
    - bit-identity pass counts on the shared seed prefix
    - wall-clock seconds and trial throughput per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The signed difference between the arms in log2 A-hat_2, and the two-sample Anderson-Darling
      statistic on the S histograms, both at N/n = 0.98 and n = 227.
    formula: 'Under Q1 (compression-only), E[log2 A-hat_2(circulant) - log2 A-hat_2(non-circulant)]
      = 0 exactly, and the Anderson-Darling statistic is distributed as its null distribution. Definitions
      taken verbatim from H-HQC-18d1b4: mubar_k = E[C(S,k)]/C(n_e,k), q = E[S]/n_e, A_k = mubar_k
      / q^k. Under Q2 the difference is non-zero with unpredicted sign; the sign is therefore a reported
      observation and not a prediction.'
    source: Pre-registered in the parent proposal IDEA-20260816-b0322a before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at n in {101, 227, 587} with RM(1,5) inner blocks and n_e up to 18 - three
      to four orders of magnitude below any deployed HQC parameter set, chosen because at these sizes
      the failure rate is observable at 1e6 trials without any extrapolation. NO transfer assumption
      is made and none is offered: the run''s conclusions are scoped to the executed cells. The only
      thing claimed to transfer is the SYMMETRY argument of STAGE 0, which is exact at every n with
      ord_n(2) = n-1 and is a statement about stationarity, not about magnitudes.'
    correspondence: null
  tail_checks:
  - Report the S histogram's far-tail counts explicitly with Poisson error bars and refuse any conclusion
    from a cell whose tail count is below 30.
  - Re-run the top truncation cell at 10x trials on one arm pair and check the arm difference is stable
    to within its confidence interval.
  - Check the per-block marginal equality gate separately in each tail decile of S, not only in aggregate.
  - Confirm that the positive control's detection threshold does not itself drift across the truncation
    ladder.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort the whole run if ord_n(2) != n-1 at any tested n.
  - Abort the comparison at any cell where the per-block marginal gate fails, and report that cell
    as unmatched rather than as a result.
  - Stop after the declared cell list; no adaptive cell addition, since the estimator and thresholds
    are frozen before data generation.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three validity gates pass, the positive control fires and yields a finite
    calibrated sensitivity, and the run emits a per-cell signed arm difference in log2 A-hat_2 with
    confidence intervals - whether or not any difference exceeds the calibrated threshold.
  falsification_criterion:
  - 'The arm difference exceeds the calibrated threshold at no cell across the whole ladder: Q2 is
    bounded at the measured sensitivity, and the bound with its error bars is the recorded obstruction.'
  - 'The per-block marginal gate fails at every cell: the surrogate construction is defective and
    no ring conclusion is reportable.'
  - 'The null arm''s separation profile is not flat: the estimator manufactures structure and the
    instrument is void.'
  - 'The positive control fails to fire at the largest planting magnitude: the run has no demonstrated
    sensitivity and reports none.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b0322a
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The matching rule between the circulant code and the random surrogate is specified here only as
    'same length, rate and row weight'; a Coordinator must fix the exact surrogate construction and
    the exact matching tolerance before approval, because that construction is the load-bearing part
    of the design.
  - The planted-artefact positive control needs its planting construction written out explicitly,
    with the magnitude parameterisation and the pre-declared expected detection level, before any
    data is generated.
  - The weight-tuning stage must have its own frozen seed stream and a written rule preventing reuse
    in the measurement stage; the rule is stated but not yet operationalised.
  - Whether the outer stage should be a pure threshold on S or an explicit Reed-Solomon decode must
    be settled; the threshold is exact for a bounded-distance decoder but the equivalence should be
    recorded as a derivation, not assumed.
