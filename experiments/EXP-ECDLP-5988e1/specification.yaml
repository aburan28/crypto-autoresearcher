# =============================================================================
# EXP-ECDLP-5988e1 — version 1, approved by DEC-20261006-5ee94d. Frozen
# y-axis prefix census for IDEA-20261006-688a37. Success is the idea's
# prediction: Z_1*N_2 and Z_2*N_1 differ by at least 1, after both
# models are nonsingular and ordinary. The concrete negative is that
# the instrument checks pass and the two products are equal. This
# design session did not enumerate either curve and did not record a
# hit count. No discrete logarithm is authorized. Source idea bytes
# are copied unchanged from origin/design/ectd-e7ad98-conductor, blob
# 51b7c6c2d2c4b08264742473401566e857c5e7cc.
# =============================================================================
experiment:
  id: EXP-ECDLP-5988e1
  hypothesis_id: H-ECDLP-3192e4
  question_id: RQ-ECDLP-4fcbd3
  source_idea: IDEA-20261006-688a37
  version: 1
  title: >-
    Y-axis hits of scalars 2, 5, and 11 on two cubics over F_2053
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-5ee94d
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the cross products differ, does
      not assert that the rates agree, and does not assert that an
      exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only at p = 2053 on y^2 = x^3 + x + 1 and
      y^2 = x^3 + x + 2. Count hits of x = 0 under the maps [2], [5],
      and [11]. Recompute each scalar by repeated addition. Report
      the frozen label permutation beside the cubic counts. Do not
      search for a discrete logarithm and do not move to another
      prime.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether Z_1*N_2 and Z_2*N_1 differ by at least 1. The
    concrete negative is that the instrument checks pass and the two
    products are equal. No faster discrete-logarithm algorithm is in
    scope.

  inputs:
    field: >-
      F_2053 = {0, 1, ..., 2052}. Confirm 2053 is prime by trial
      division by every prime at most 43. If a prime divisor is
      found, the reading is instrument_failure and no curve is built.
    curve_E1: >-
      y^2 = x^3 + x + 1. Compute D1 = 4*(1)^3 + 27*(1)^2 = 31. The
      model is singular when 31 = 0 in F_2053. It is not. Recompute
      D1 anyway. A recomputed zero is unmeasured_singular.
    curve_E2: >-
      y^2 = x^3 + x + 2. Compute D2 = 4*(1)^3 + 27*(2)^2 = 112. The
      model is singular when 112 = 0 in F_2053. Recompute D2. A
      recomputed zero is unmeasured_singular.
    point_census: >-
      For each curve, for x from 0 through 2052, evaluate the
      right-hand side and collect both square roots when the value
      is a nonzero square, one point when it is 0, and no point when
      it is a nonsquare. Append the point at infinity. N_i is that
      count. The integer representatives of y are the two values in
      0 through 2052. The point (0, 1) must appear on E1. A census
      that misses it is instrument_failure.
    prefixes: >-
      The only scalars are 2, 5, and 11. Binary method, most
      significant bit first, leading 1 loaded as P. For 2 = 10_2 the
      only step after the leading 1 is a doubling. For 5 = 101_2 the
      steps after the leading 1 are double, then double-and-add.
      For 11 = 1011_2 the steps after the leading 1 are double, then
      double-and-add, then double-and-add. Repeated addition starts
      at infinity and adds P, m times. The two images of each scalar
      on each point must be identical. One disagreement is
      instrument_failure.
    hit_rule: >-
      A hit is an affine image whose x-coordinate is 0. Infinity is
      never a hit. Z_i is the number of pairs (P, m) with P in
      E_i(F_p), including infinity, and m in {2, 5, 11}, whose image
      is a hit. Three misses at infinity are expected and do not
      increment Z_i. A point that hits for two scalars counts twice.
    ordinary_rule: >-
      The curve is ordinary for this cell when N_i is not 2054. If
      either count equals 2054, the reading is unmeasured_not_ordinary
      and the products are not compared.
    integer_comparison: >-
      The gap is the absolute value of Z_1*N_2 - Z_2*N_1. The
      prediction holds when that gap is at least 1. The negative
      holds when the gap is 0. Both comparisons are exact integer
      comparisons. No rounding is used.
    label_control: >-
      List the affine points of each curve by increasing x, and for
      equal x by increasing y in 0 through 2052. Let L be the list of
      their x-coordinates, in that order. Shuffle L with the
      recurrence s_0 = 5988e1 interpreted as the integer 5867745,
      s_{k+1} = (1103515245 * s_k + 12345) mod 2^31, taking the next
      index as s mod the count of still-unshuffled entries, Fisher-Yates
      from the end. Assign the shuffled labels back to the same
      points. A control hit is an affine image whose shuffled label
      is 0. Report the control cross products beside the cubic
      products. Do not store them in Z_i. Substituting the labels
      for the true x-coordinates in Z_i is instrument_failure.
    hit_check: >-
      Every reported hit is substituted back into the cubic. A point
      that fails the cubic is instrument_failure. Infinity stored
      with x = 0 is instrument_failure.

  controls:
    - id: ordinary-pair
      statement: >-
        Both discriminants are recomputed, and both point counts are
        compared with 2054. A zero discriminant or a count of 2054
        leaves the cell unmeasured. It is not a rate comparison.
    - id: point-zero-one
      statement: >-
        The census of E1 contains (0, 1). A miss voids the instrument.
        The control does not require (0, 1) to be the image of a prefix.
    - id: two-addition-chains
      statement: >-
        Double-and-add and repeated addition agree on every point and
        every prefix. One disagreement voids the cell.
    - id: prefix-set
      statement: >-
        The prefix list is exactly {2, 5, 11}. A run that multiplies
        only by 11 and skips 2 and 5 does not measure Z_i.
    - id: label-permutation
      statement: >-
        The shuffled-label cross products are reported beside the
        cubic products and are not written into Z_1 or Z_2.

  independent_variables:
    - which curve is scored, E1 or E2
    - which prefix scalar is applied, 2 or 5 or 11
    - whether the predicate reads the true x-coordinate or the shuffled label

  metrics:
    primary:
      - id: cross_product_gap
        statement: >-
          The absolute difference of Z_1*N_2 and Z_2*N_1. The idea's
          prediction is that the difference is at least 1. The
          concrete negative is that the difference is 0 while the
          instrument checks pass.
    secondary:
      - id: raw_counts
        statement: the four integers N_1, N_2, Z_1, and Z_2
      - id: label_gap
        statement: >-
          the absolute difference of the shuffled-label cross
          products, reported beside the primary gap and not
          substituted for it
      - id: hit_rate_versus_axis
        statement: >-
          Z_i / (3 N_i) and the fraction of points with true
          x-coordinate 0, both recorded for HEUR-1 and neither used
          to choose the reading row

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 compares the prefix hit rate with the fraction of points
    on the y-axis. That comparison is written into the artifact and
    does not choose the reading row. The row is chosen from the
    cross-product gap. Do not relabel an instrument failure or an
    unmeasured search as rate equality. The next two primes above
    2053 are outside this cell.

  preregistered_prediction:
    quantity: >-
      The absolute difference of Z_1*N_2 and Z_2*N_1 at p = 2053 on
      the two named cubics, together with the four integers.
    formula: >-
      The gap is at least 1, both discriminants are nonzero, and
      neither N_i equals 2054. The concrete negative is a gap of 0
      under those same checks. A gap of 0 is not a confirmation.
      Source idea IDEA-20261006-688a37. No curve was enumerated
      before this formula was frozen.
    source: >-
      IDEA-20261006-688a37, whose prediction is that the two cross
      products differ by at least 1. KR-RHO-13bf67, KR-RHO-fb88e6,
      KR-RHO-cd86f5, KR-RHO-6239aa, and KR-RHO-6654ba were opened in
      this session and do not state this gap.

  scale_relevance:
    tier: toy
    justification: >-
      The only field is F_2053, which has bit length 12, inside the
      question's window of 12 to 24. No transfer to a larger prime
      is assumed. The sample is two named curves, not a tail draw.
      The minimum effect is the idea's own gap of 1.
    correspondence: >-
      Direct enumeration of both curves and direct evaluation of the
      three scalar maps. No Deuring correspondence is used.

  tail_checks:
    - >-
      A hit count of 0 is kept as 0. It is not replaced by a
      pseudocount. Two zero hit counts with positive N_i produce a
      gap of 0 and are the negative when the instrument checks pass.
    - >-
      A gap of 1 meets the prediction. A gap of 0 is the negative.
      No third band is introduced after the counts are seen.

  replication:
    seeds:
      - EXP-ECDLP-5988e1|label-shuffle|s0=5867745
    independent_instances: 1
    note: >-
      One is the number of primes scored. The census is deterministic.
      The label shuffle is the only seeded step, and its seed is
      frozen. Repeated addition is the replication of each scalar.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers both curves, both addition methods, and
      the label shuffle. Wall-clock and CPU figures are advisory and
      null. The 1 GB memory figure is machine protection for the
      point lists. A watchdog expiry is failed_infrastructure, not a
      gap.

  stopping_rules:
    - Stop after a reading row is named.
    - Do not add a fourth scalar and do not drop 2 or 5 after seeing a count.
    - Do not replace the gap threshold 1 after seeing a count.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A prime divisor of 2053, a missing point (0, 1), an addition-chain disagreement, a cubic check failure, or infinity stored as x = 0 voids the run.
    - Scoring a singular curve as ordinary voids the run.
    - Comparing products when either N_i equals 2054 voids the run.
    - Writing the shuffled labels into Z_i voids the run.
    - Using any scalar outside {2, 5, 11} voids the run.
    - Replacing a zero hit count by a pseudocount voids the run.

  success_criterion: >-
    The instrument checks pass, both models are nonsingular, neither
    N_i equals 2054, and the absolute difference of Z_1*N_2 and
    Z_2*N_1 is at least 1. This is the prediction of
    IDEA-20261006-688a37. It is reachable as a failure when the
    instrument checks pass and the two products are equal.

  falsification_criterion: >-
    The instrument checks pass, both models are nonsingular, neither
    N_i equals 2054, and Z_1*N_2 equals Z_2*N_1. That equality is the
    concrete negative named with the source idea: the two y-axis
    rates agree. A gap of at least 1 is the prediction and is not
    this negative. A singular model, a count N_i = 2054, a missing
    point (0, 1), and a timeout are not this negative.

  required_artifacts:
    - experiments/EXP-ECDLP-5988e1/runs/RUN-*/manifest.yaml
    - experiments/EXP-ECDLP-5988e1/runs/RUN-*/stdout.txt
    - experiments/EXP-ECDLP-5988e1/runs/RUN-*/stderr.txt
    - experiments/EXP-ECDLP-5988e1/runs/RUN-*/counts.csv
    - experiments/EXP-ECDLP-5988e1/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        2053 is composite, (0, 1) is missing from E1, the two addition
        methods disagree, a reported hit fails the cubic, infinity is
        stored as x = 0, the prefix set is not exactly {2, 5, 11},
        the shuffled labels were written into Z_i, or a zero hit
        count was replaced
    - id: unmeasured_singular
      when: either recomputed discriminant is 0
    - id: unmeasured_not_ordinary
      when: >-
        both discriminants are nonzero and either N_i equals 2054
    - id: rates_agree
      when: >-
        the instrument checks pass, both discriminants are nonzero,
        neither N_i equals 2054, and Z_1*N_2 equals Z_2*N_1
    - id: rates_differ
      when: >-
        the instrument checks pass, both discriminants are nonzero,
        neither N_i equals 2054, and the absolute difference of
        Z_1*N_2 and Z_2*N_1 is at least 1
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the
    order listed. rates_differ is the only success row. rates_agree
    is the concrete negative. The unmeasured rows are not rates.
    instrument_failure is not a rate. Record N_1, N_2, Z_1, Z_2, the
    gap, the label gap, and attack_claimed false beside the row.
    Those fields do not change the row.
