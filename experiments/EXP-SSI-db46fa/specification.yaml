# EXP-SSI-db46fa
# Toy orbit-deficit census for H-SSI-bff8d9.
# Frozen before any run. D >= 1 is a prediction, not a result.
experiment:
  id: EXP-SSI-db46fa
  hypothesis_id: H-SSI-bff8d9
  source_idea: IDEA-20261006-c7b357
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  version: 1
  title: >-
    Galois-orbit deficit of membership j-invariants in F_361
  status: approved
  frozen: true
  designed_at: '2026-10-07'
  approved_by: coordinator
  approval_decision_id: DEC-20261007-254d55
  execution_authorized: true
  objective: >-
    Sweep every j in F_361, keep those with a nonsingular model or
    twist of point count 324 or 400, and record the orbit deficit D
    against the pre-registered prediction that D is at least 1.
  inputs:
    p: 19
    field_model: F_19[z]/(z^2 - 2)
    membership_counts: [324, 400]
    j_formula: >-
      j = 1728 * (4A)^3 / (16 * (4A^3 + 27 B^2)). The source idea
      recalled the same ratio without the 16. The model
      k = j/(1728 - j), A = 3k, B = 2k inverts this formula.
      j = 0 uses y^2 = x^3 + 1. j = 1728 uses y^2 = x^3 + x.
    predicted_D_minimum: 1
    predicted_deficit_F19: 0
    predicted_deficit_instrument: 1
    instrument_set: "{z, z^19}"
    named_future_run_slot: RUN-SSI-989893
  controls:
    - >-
      Null set of the same shape: every element of F_19, viewed in
      F_361. Required deficit 0. A nonzero value invalidates the
      orbit counter.
    - >-
      Positive instrument: the set {z, z^19}. Required deficit 1.
    - >-
      Duplicate-model control: the model scaled by u = 2, via
      A' = A u^4 and B' = B u^6, must accept the same set of j.
    - >-
      Two square tests. Euler's criterion and the exhaustive set of
      squares must agree on every right-hand side. A disagreement
      invalidates the cell.
    - >-
      Round trip: the j-invariant of the constructed model must equal
      the j that was requested. A mismatch invalidates the cell.
  independent_variables:
    - the enumeration order is fixed; there is no sampled factor
  metrics:
    primary:
      - D
      - deficit_F19
      - deficit_instrument
    secondary:
      - size_S
      - O
      - duplicate_ok
      - roundtrip_ok
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      Orbit deficit D = |S| - O for the membership set S in F_361.
    formula: >-
      D is at least 1. The deficit of F_19 is 0. The deficit of
      {z, z^19} is 1.
    source: >-
      IDEA-20261006-c7b357, prediction fixed before any run. The
      recalled supersingularity criterion was not re-proved in this
      design session.
  scale_relevance:
    tier: toy
    justification: >-
      One prime, p = 19, and the 361 field elements. No transfer to
      a cryptographic prime or to a path-finding cost.
    correspondence: null
  tail_checks:
    - >-
      j = 0 and j = 1728 are reported inside the sweep even when
      Frobenius fixes them. Dropping either j invalidates the run.
    - >-
      z^2 = 2 and z^19 = -z are checked before D is accepted. A
      failure invalidates the run.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-SSI-989893
    replication_note: >-
      One deterministic sweep. RUN-SSI-989893 is the future slot
      named here and is not launched by the design commit.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-SSI-989893.
    - Do not add the p = 31 repeat in this contract.
    - Do not continue after a square-test disagreement or a round-trip failure.
  invalidation_rules:
    - The deficit of F_19 is not 0, or the deficit of {z, z^19} is not 1.
    - The two square tests disagree.
    - A constructed model does not return the requested j.
    - The scaled model accepts a different set of j.
    - z^2 is not 2, or z^19 is not -z.
    - A timeout, crash, or partial sweep of F_361.
  success_criterion: >-
    The manifest is valid, the deficit of F_19 is 0, the deficit of
    {z, z^19} is 1, the duplicate-model sets agree, the j round trip
    holds, and D is at least 1.
  falsification_criterion: >-
    The manifest is valid, the deficit of F_19 is 0, the deficit of
    {z, z^19} is 1, the duplicate-model sets agree, the j round trip
    holds, and D equals 0.
  decision_impact:
    on_positive: >-
      Record that D is at least 1 at p = 19 under this membership
      test. Do not change a hardness exponent. A later contract may
      repeat the same deficit at p = 31. This hypothesis is not
      promoted by the positive count alone.
    on_negative: >-
      Record that D equals 0 at p = 19 under this membership test,
      which falsifies the orbit-deficit prediction at that prime
      only. Do not schedule the p = 31 repeat as confirmation of the
      same prediction, and do not close the supersingular isogeny
      problem.
  required_artifacts:
    - experiments/EXP-SSI-db46fa/runs/RUN-SSI-989893/manifest.yaml
    - experiments/EXP-SSI-db46fa/runs/RUN-SSI-989893/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-SSI-db46fa/trial-plan.json
    driver: experiments/EXP-SSI-db46fa/implementation/run.py
    checker: experiments/EXP-SSI-db46fa/implementation/check.py
  out_of_scope:
    - Any prime other than 19, including the p = 31 repeat named in the idea.
    - Any claim of an isogeny, an endomorphism ring, or a cost below p^{1/2}.
    - Path finding on the supersingular isogeny graph.
