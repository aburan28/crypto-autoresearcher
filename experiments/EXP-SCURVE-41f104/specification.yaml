# EXP-SCURVE-41f104
# Stage-0 automorphism certificate for H-SCURVE-a8507f.
# Frozen before the official run.
experiment:
  id: EXP-SCURVE-41f104
  hypothesis_id: H-SCURVE-a8507f
  source_idea: IDEA-20261007-f8ac02
  question_id: RQ-SCURVE-7af163
  goal_id: GOAL-SCURVE-873d08
  version: 1
  title: >-
    j-invariant and no-extra-divisor check for Montgomery A = 117050
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-a41af1
  execution_authorized: true
  objective: >-
    Compute the Montgomery j-invariant of A = 117050 as an exact
    rational. Negation-only automorphism order is 2 when that value is
    neither 0 nor 1728. The costing ratio against a baseline that
    already divides by sqrt(2) must sit within 5 percent of 1. A = 0
    is the j = 1728 control and must leave that band. No rho is run.
  inputs:
    curve_A: 117050
    negative_A: 0
    j_formula: "256 * (A^2 - 3)^3 / (A^2 - 4)"
    band: "361 * aut_adjusted <= 400 * aut_base <= 441 * aut_adjusted"
    toy_order: 10007
    named_future_run_slot: RUN-SCURVE-5bc4fd
  controls:
    - >-
      The j denominator A^2 - 4 is nonzero for both coefficients.
      A zero denominator invalidates the cell.
    - >-
      A = 0 is the negative control. The null removes the
      automorphism and costs both sides with order 1.
  independent_variables:
    - the Montgomery coefficient, either 117050 or 0
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - aut_order
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261007-f8ac02: automorphism order 2 is already the
    negation baseline, so no further divisor applies.
  preregistered_prediction:
    quantity: >-
      aut order is 6, 4, or 2 according as j is 0, 1728, or neither.
      The ratio of adjusted to baseline costs is sqrt(aut_base /
      aut_adjusted). The band is absolute deviation at most 1/20.
    formula: >-
      The positive reading is aut order 2 for A = 117050, that ratio
      inside the band, A = 0 outside the band with aut order 4, and
      the null inside the band. The negative reading is any other
      pattern with both j values defined.
    source: >-
      IDEA-20261007-f8ac02 states a pass band of 0.05 around 1 given
      negation already in the baseline, and requires the j = 0 or
      1728 control to show an extra divisor. The integer form of the
      band was fixed before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      One rational j value and a toy order 10007. No 221-bit iteration
      count and no distinguished-point table.
    correspondence: null
  tail_checks:
    - >-
      The toy order is 10007. A run on the M-221 subgroup is not this
      contract.
    - >-
      A zero j denominator invalidates the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-SCURVE-5bc4fd
    replication_note: >-
      One deterministic rational arithmetic pass. No random order is
      drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 30
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-SCURVE-5bc4fd.
    - Do not add a coefficient, a processor grid, or a rho execution.
    - A missed matrix is the recorded result. Do not change the band.
  invalidation_rules:
    - A j denominator is zero.
    - A timeout, crash, or missing automorphism order.
  success_criterion: >-
    The manifest is valid, planted_ok is true, A = 117050 has
    automorphism order 2 inside the band, A = 0 has order 4 outside
    the band, and the null stays inside the band.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and any of those three
    readings fails.
  decision_impact:
    on_positive: >-
      Record that A = 117050 has negation-only automorphism order and
      no further divisor inside the 5 percent band. Do not treat that
      as a 221-bit rho certificate and do not claim an attack.
    on_negative: >-
      Record that the costing matrix failed. Do not publish an
      M-221 iteration table from this manifest.
  required_artifacts:
    - experiments/EXP-SCURVE-41f104/runs/RUN-SCURVE-5bc4fd/manifest.yaml
    - experiments/EXP-SCURVE-41f104/runs/RUN-SCURVE-5bc4fd/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-SCURVE-41f104/trial-plan.json
    driver: experiments/EXP-SCURVE-41f104/implementation/run.py
    checker: experiments/EXP-SCURVE-41f104/implementation/check.py
  out_of_scope:
    - Any executed rho, the M-221 subgroup order, and a processor grid.
    - Any safety verdict and any claim of an attack improvement.
