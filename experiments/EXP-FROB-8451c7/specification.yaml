    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Price the least covering arity of a rational-point Couveignes factor
    base at Weil ceilings g=5 and g=6 against 2^{131}; measure the n=17
    torus fibre Boolean count against equal-cardinality subspace and
    Z/17Z controls; deliver exactly one O-* label from H-FROB-66d9ae.

  class: measurement
  class_note: >-
    Cost-model / structural-certificate measurement of forced arity and
    toy Boolean count. Not an exponent-moving breakthrough; no ECDLP
    attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Successive multiplication
        of 6725 and 39201 until product >= 2^{131}; record least m and
        2^{m-2}; verify 8*ceiling^3 < 2^{51}; recompute Phi_8(2)=17;
        freeze stage0/preregistered-predictions.json and
        stage0/arm-a-ledger.json.
      - >-
        Stage 1. Arm B at n=17: deterministic Koblitz-shaped curve search
        (first (a,b) with E(F_{2^{17}}) having a prime factor of bit length
        >= 15); cyclotomic torus of dimension 4 with Phi_8(2)=17;
        fibre of an element t of order 17; Weil descent Boolean count
        before/after dependency quotient; first-fall degree; |F|;
        controls: dim-8 subspace, orbit-union (rep,shift), identity
        projection, relabelled Z/17Z, null curve over F_{2^{17}} not
        defined over F_2 with same cardinality.
      - RESULTS.md naming exactly one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock / WDSat as success path.
      - Extension-family constructions (Mumford / Kummer / Artin-Schreier).
      - Editing IDEA-20261002-cad44c claim text or GOAL-FROB-6333a9.yaml.

  execution_surface:
    trial_plan: experiments/EXP-FROB-8451c7/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-FROB-8451c7/implementation/run.py --stage 0
      --trial-plan experiments/EXP-FROB-8451c7/trial-plan-v1.json
    command_stage1: >-
      python3 experiments/EXP-FROB-8451c7/implementation/run.py --stage 1
      --trial-plan experiments/EXP-FROB-8451c7/trial-plan-v1.json
    note: >-
      Declared runnable surface so /run can admit this EXP without a
      separate protocol-authoring detour. implementation/run.py is written
      by the executor under TASK-20261002-56c557 write_scope; Stage 0 is
      pure integer arithmetic and must be the first admitted command.

  inputs:
    ceilings:
      g5: 6725
      g6: 39201
      source: knowledge/open-problems/KN-OPEN-095df5.md
    n_ledger: 131
    n_toy: 17
    phi8_check: 17
    source_idea: ledger/proposals/IDEA-20261002-cad44c.yaml
    hypothesis: ledger/hypotheses/H-FROB-66d9ae.yaml
    gf2n_reference_readonly: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py

  controls:
    - name: phi8_recompute
      definition: Phi_8(2)=2^4+1 must equal 17 before any fibre is built.
    - name: subspace_dim8
      definition: F_2-subspace of dimension 8 in F_{2^{17}}, same pipeline.
    - name: orbit_union_shift
      definition: KN-FIND-47da4e (representative, shift) encoding of that subspace.
    - name: identity_projection
      definition: Predicted Boolean count equal to ambient dimension with b=1.
    - name: relabelled_Z17
      definition: Fibre equation replaced by +1 in Z/17Z; match with torus => encoding artifact.
    - name: null_curve
      definition: Curve over F_{2^{17}} not defined over F_2, same cardinality.

  independent_variables:
    - name: arm
      levels: [A_integer_ledger, B_torus_n17]
    - name: control_family
      levels: [torus, subspace, orbit_union, identity, Z17, null_curve]

  metrics:
    primary:
      - name: least_m_g5
        unit: integer
        definition: Least m with 6725^m >= 2^{131}.
      - name: least_m_g6
        unit: integer
        definition: Least m with 39201^m >= 2^{131}.
      - name: semaev_degree_g5
        unit: integer
        definition: 2^{least_m_g5 - 2}.
      - name: semaev_degree_g6
        unit: integer
        definition: 2^{least_m_g6 - 2}.
      - name: boolean_count_before_quotient
        unit: integer
        definition: g*n descended coordinates before dependency quotient (Arm B).
      - name: boolean_count_after_quotient
        unit: integer
        definition: Rank after row-reducing those coordinates (Arm B).
      - name: first_fall_degree
        unit: integer
        definition: First-fall degree of the Arm B descended system (or UNDETERMINED under cap).
    secondary:
      - name: image_fraction_bound_m3
        unit: dimensionless
        definition: 8 * ceiling^3 / 2^{131} upper bound at g=6.
      - name: factor_base_size_F
        unit: integer
        definition: Measured |F| on the Arm B fibre.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage 0-1 processes.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).

  heuristic_under_test: H1; H2

  preregistered_prediction:
    quantity: >-
      least_m_g5=11, least_m_g6=9, semaev degrees 512 and 128;
      8*39201^3 < 2^{51}; Phi_8(2)=17; Arm B boolean_count_after_quotient
      matches subspace arm within band (O-LEDGER prior).
    formula: >-
      m* = min{m : ceiling^m >= 2^{131}}; deg = 2^{m*-2};
      image_bound_m3 = 8 * ceiling^3; Phi_8(2) = 2^4 + 1.
    source: >-
      ledger/proposals/IDEA-20261002-cad44c.yaml predictions +
      proof_search_map; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Arm A is parameter arithmetic at n=131 (no curve). Arm B is n=17 only.
      No transfer of Boolean-count drop (if any) to n=131 is claimed.
    correspondence: null

  tail_checks:
    - >-
      Any single n=17 witness with m=3 image size > 8*|F|^3 voids H1 for
      that arm.
    - >-
      Rank deficiency of g*n coordinates must be listed as an explicit set
      of linear forms (H2 tail).

  replication:
    seeds: [2026100217]
    independent_instances: 2
    note: >-
      Torus arm and subspace arm are independent instances at n=17.
      Curve-search seed recorded with found (a,b). Arm A is deterministic
      (no seed).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and arm-a-ledger.json.
    - Stage 1 complete for torus + subspace + Z/17Z controls, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-FROB-66d9ae.
    - maximum_runs = 4.
    - Do not open n>17 for Arm B or g>6 ceilings under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock/WDSat used as success path → protocol invalid.
    - Arm A disagreeing with m*=11/9 after a passing multiplication check → O-ARTIFACT; do not read Arm B as support for (A).
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence against (A)-(C).
    - Claiming an n=131 exponent move from Arm B → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with least_m_g5=11, least_m_g6=9, degrees
    512/128, Phi_8(2)=17, and 8*39201^3 < 2^{51}; Stage 1 produces Boolean
    counts (before/after quotient), first-fall degree, |F|, and control
    table for torus/subspace/Z17; RESULTS.md names exactly one O-* label
    from H-FROB-66d9ae with cited artifacts.

  falsification_criterion: >-
    Any of: Arm A least-m mismatch; Phi_8(2) or field-arithmetic check
    failure; Arm B Boolean count below subspace with Z/17Z not matching
    (that is O-POSITIVE-TOY, a valid scientific outcome, not a protocol
    fail); or a claim of break/exponent under this card.

  required_artifacts:
    - experiments/EXP-FROB-8451c7/trial-plan-v1.json
    - experiments/EXP-FROB-8451c7/stage0/preregistered-predictions.json
    - experiments/EXP-FROB-8451c7/stage0/arm-a-ledger.json
    - experiments/EXP-FROB-8451c7/stage1/
    - experiments/EXP-FROB-8451c7/RESULTS.md
