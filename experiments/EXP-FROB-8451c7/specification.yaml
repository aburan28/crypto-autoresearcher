  version: 1
  title: >-
    Weil-cap arity ledger: Arm A least-m at g=5/6 ceilings vs 2^{131};
    Arm B n=17 torus fibre Boolean count vs subspace and Z/17Z controls
  status: approved
  approved_by: DEC-20261002-93fc80
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-93fc80
    composing_decision: DEC-20261002-93fc80
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes Arm A ledger (m*, Semaev degrees, 8*ceiling^3 check)
      and Phi_8(2)=17. Stage 1 runs Arm B torus fibre Boolean count with
      subspace, orbit-union, identity, Z/17Z, and null-curve controls.
