experiment:
  id: EXP-ALPF-853fd9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-da106b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-da106b
  question_id: RQ-ALPF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Constructive generic-group simulability test of the m=3 e-ring Semaev oracle: build the
    simulator, diff transcripts over distinct-element and repeated-element query classes, and report
    either a counted overhead or a minimal divergent query.'
  objective: 'The one uncertainty a run reduces is whether the ALPF lane''s concrete prime-field survivor
    supplies anything a generic group does not, on a precisely stated query class. Stated as parts:
    (i) with the e-ring oracle''s signature and the simulator''s permitted public data fixed in advance
    and written down, does an observation-collision audit find two distinct toy instances producing
    identical transcripts on the tested query class, which would bound in advance what any divergence
    could mean; (ii) does a constructed simulator with only handle-based generic group access reproduce
    the oracle''s transcript on random query sequences of all-distinct factor-base tuples, and with
    what measured overhead in generic group operations per oracle query; (iii) does that simulator
    continue to match on sequences containing repeated factor-base elements, where the elementary-symmetric
    coordinates degenerate, or does it diverge at a specific query that can be printed in full as
    a minimal witness. Reducing these executes KN-OPEN-005''s stated screen against an ALPF-native
    candidate for the first time, at a compute cost of minutes, and yields either a scoped closure
    or a concrete object for a later session.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for this oracle signature,
      this public-data boundary, this query distribution and these toy curves, the simulator matched
      or diverged as reported, with the stated overhead, and the nulls behaved as required. What does
      NOT follow: that the e-ring representation supplies or fails to supply relations below any bound;
      that any candidate family is closed outside the tested query class; that any attack, speedup,
      relation-collection advantage or security consequence exists or is excluded; and nothing whatsoever
      about EXP-ALPF-011''s early-fall measurement, which is an algebraic degree observation and is
      untouched by a simulability result in either direction.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~half a day human): write the oracle signature, the simulator''s
      permitted public data, the transcript canonicalisation, and the explicit quantifier order of
      the simulability claim; freeze them. STAGE 1 (cost: 0 compute): observation-collision audit
      -- search symbolically and by small enumeration for two distinct instances with identical transcripts
      on a fixed short sequence; record collisions found. STAGE 2 (cost: ~half a day human, seconds
      compute): implement the real e-ring oracle over harness/toycurve.py points using harness/semaev.py
      expressions, behind a handle-based group interface that counts every group operation. STAGE
      3 (cost: ~1 day human): implement the candidate simulator against the same interface, with no
      access to the discrete logarithm or to point coordinates except through the interface. STAGE
      4 (cost: minutes): run 200 distinct-element and 200 repeated-element sequences of length 50
      on one 13-bit curve; record match or first divergence and the overhead count. STAGE 5 (cost:
      minutes): run the random-oracle null and the shuffled-answer null, 50 sequences each; require
      simulator failure. STAGE 6 (cost: minutes): replicate the smallest cell on a 15-bit curve; print
      any minimal divergent query in full with its context.'
    instrument: Python 3 only, no Sage. harness/toycurve.py for the curve, point arithmetic and instance
      generation, wrapped in a handle-based group interface that counts operations and refuses coordinate
      access; harness/semaev.py for s3_expr and s4_expr and build_factor_base to define the real oracle;
      a hand-written simulator module; a transcript differ with a fixed canonicalisation; harness/runner.py
      for run manifests, seeds and the inference block. No Groebner or Macaulay computation is required
      by this experiment at all.
    parameters: 'Curves: one 13-bit prime-field toy curve with a prime-order subgroup, plus one 15-bit
      curve for replication. |FB| = 4, matching the archived firing cells. m = 3, matching the archived
      e-ring rows. Query sequences: 200 all-distinct and 200 with a repetition rate of 0.3, each of
      length 50, per curve. Null sequences: 50 against the random-oracle null and 50 against the shuffled-answer
      null. Overhead accounting: every group operation counted, reported per oracle query. Collision
      audit: exhaustive over 500 randomly drawn instance pairs on a fixed length-5 sequence.'
  controls:
  - Random-oracle null of the same signature, against which the simulator must fail, run in the same
    invocation.
  - 'Shuffled-answer null: real oracle answers permuted across queries, which the simulator must also
    fail, confirming sensitivity to content.'
  - 'Overhead accounting: every generic group operation the simulator performs is counted by the interface,
    so the O(1)-overhead question is measured not asserted.'
  - 'Query-class separation: distinct-element and repeated-element sequences reported separately,
    never pooled.'
  - Second curve replication at a different bit size for the smallest cell, to show a divergence is
    not curve-specific.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a random oracle of the same signature: a function
    returning uniformly random elements of the same output shape for each distinct query, with consistency
    across repeats, carrying no curve behind it. The IDENTICAL simulator is run against it in the
    same invocation. The simulator must FAIL against the null -- immediately and on essentially every
    sequence -- because there is nothing there to reconstruct. If the simulator matches the null''s
    transcripts, the equivalence test is vacuous (for example the comparison is too coarse or the
    outputs are being canonicalised away) and no conclusion may be drawn about the e-ring oracle.
    A second null is a shuffled-answer oracle: the real e-ring oracle with its answers permuted across
    queries, which the simulator must also fail, confirming the test is sensitive to answer content
    and not only to output shape.'
  independent_variables:
  - query class (all-distinct tuples vs repeated-element tuples)
  - oracle arm (real e-ring oracle, random-oracle null, shuffled-answer null)
  - curve (13-bit primary, 15-bit replication)
  - sequence length
  metrics:
    primary:
    - transcript match rate per (query class, oracle arm)
    - index of first divergence per sequence
    - simulator overhead in counted generic group operations per oracle query
    - the minimal divergent query printed in full, if any
    - collision count from the observation-collision audit
    secondary:
    - distribution of divergence indices
    - per-sequence repetition rate versus divergence indicator
    - wall-clock seconds per sequence
    - number of oracle queries answered per second by each arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The simulator's transcript match rate against the real e-ring oracle, per query class,
      and its overhead in generic group operations per oracle query.
    formula: 'match(class) = (# sequences with no divergence) / 200. overhead = (total counted group
      operations by the simulator) / (total oracle queries answered). Pre-registered predictions:
      match(all-distinct) = 1.0; overhead = 3 exactly, equal to the tuple length for m = 3, and constant
      as the field size changes from 13 to 15 bits; match(random-oracle null) < 0.01 and match(shuffled-answer
      null) < 0.01. No value is pre-committed for match(repeated-element), which is the informative
      cell.'
    source: Pre-registered in the parent proposal IDEA-20260816-da106b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested on 13-bit and 15-bit prime-field toy curves with |FB| = 4 and m = 3, matching
      the archived ALPF firing cells exactly. No transfer to medium or cryptographic scale is assumed
      or claimed. The one property checked across scale is the simulator overhead, measured at both
      bit sizes precisely so that its constancy is observed rather than assumed; two points is stated
      as too few to fit a law and is used only to detect gross growth.
    correspondence: null
  tail_checks:
  - Report the full context of the earliest divergence across all sequences, not a summary, since
    a single witness query is the deliverable if one exists.
  - Report sequences where the simulator matched but its overhead exceeded the predicted tuple length,
    since silent extra work is a form of cheating.
  - Report any null-arm sequence the simulator matched, individually with its seed.
  - Report collisions found in the audit individually, with both instances, since a collision bounds
    the meaning of every other result.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort before STAGE 4 if the simulator matches the random-oracle null on any sequence during a
    smoke test, since the comparison would be vacuous.
  - Stop the repeated-element arm early and report if the first 20 sequences all diverge at query
    1, since the witness is already in hand.
  - Hard stop at 1 total CPU-hour; this experiment is not compute-bound and exceeding that indicates
    an implementation fault.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The nulls are failed by the simulator, the collision audit is reported, and a
    match rate with a counted overhead is reported for both query classes on both curves.
  falsification_criterion:
  - Simulator matches the random-oracle null on any sequence.
  - Simulator diverges on all-distinct sequences, indicating a mis-specified signature rather than
    a structural result.
  - Simulator overhead grows between the 13-bit and 15-bit curves, falsifying the constant-overhead
    prediction.
  - A divergence on the 13-bit curve that does not reproduce on the 15-bit curve.
  - The collision audit finds identical transcripts for distinct instances on the tested class, bounding
    what any divergence could mean and requiring the conclusion to be rescoped.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-da106b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact e-ring oracle signature used in the archived EXP-ALPF-011 rows must be recovered from
    experiments/EXP-ALPF-011/source/ rather than reconstructed from the profile column, or the result
    answers a different question.
  - The public-data boundary for the simulator (curve equation, group order, factor base, nothing
    else) must be fixed by a Coordinator, since it determines the answer.
  - The transcript canonicalisation must be specified explicitly, including how residues are compared,
    before freeze.
  - Whether the collision audit is feasible by enumeration at 13 bits or needs a symbolic argument
    must be settled before approval.
