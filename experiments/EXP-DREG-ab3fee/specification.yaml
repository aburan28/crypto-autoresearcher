experiment:
  id: EXP-DREG-ab3fee
  hypothesis_id: H-DREG-b6bfd1
  question_id: RQ-DREG-d7b6d6
  derived_from_idea: IDEA-20260922-f1e5b7
  version: 1
  title: >-
    Slope census of last-fall degree and grevlex solving degree on one toy
    F_4-isogeny class, rungs n=1 and n=2
  status: approved
  objective: >-
    Measure the increment from rung n=1 to rung n=2 of last-fall degree and of
    grevlex solving degree on every certified model in the base curve's
    F_4-isogeny class, and test whether those increments equal the base
    increment. Read the result only if EXP-DREG-dd668d did not return label
    instrument. No ECDLP exponent is claimed.
  inputs:
    ladder: "experiments/EXP-DREG-dd668d/specification.yaml#frozen_ladder"
    prerequisite_run: experiments/EXP-DREG-dd668d/runs
    prerequisite_rule: >-
      A completed metrics.json whose outcome_label is not instrument and not
      homogeneous-no-op. If the label is instrument or homogeneous-no-op, this
      contract stops with label blocked-instrument and computes no class range.
  controls:
    - id: IDENTITY-BASE
      description: At n=1 the identity frame matches the native base r(d) bit for bit before any other vertex is read.
    - id: GROWING-REGIME
      description: >-
        Record the base last-fall increment and whether last-fall or grevlex
        solving degree at n=2 is strictly above first_fall. If the base never
        leaves that floor and every finished vertex matches the base
        increments, label not-growing-regime and do not call a range of 0
        evidence about explosion. A finished vertex that differs by at least
        1 is not this label.
    - id: FIRST-FALL
      description: first_fall is recorded beside the two growth metrics and is never substituted for them.
  independent_variables:
    - the certified vertex
    - the rung n in {1, 2}
  metrics:
    primary:
      - within-class range of the last-fall increment on finished vertices, using the ladder rule that reads last_fall none as 0
      - within-class range of the grevlex solving-degree increment on finished vertices
      - outcome_label in {equal, gap, not-growing-regime, uncertified-class, blocked-instrument, unmeasured}
    secondary:
      - per-vertex r(d) for d <= 4
      - per-vertex first_fall
      - coverage, the fraction of same-trace models reached by a certified edge
  heuristic_under_test: HEUR-b6bfd1
  preregistered_prediction:
    quantity: both within-class increment ranges
    formula: '0 on finished vertices, read only when the base left the first-fall floor'
    source: H-DREG-b6bfd1
  scale_relevance:
    tier: toy
    justification: >-
      At most 12 ordinary models over F_4, two rungs, D_max 4, at most 12
      boolean variables at n=2. No transfer beyond this ladder.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [20260922]
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - One protocol execution. Do not add a third rung.
    - Do not drop a same-trace model to shrink the range.
  invalidation_rules:
    - Prerequisite label is instrument or homogeneous-no-op. Label blocked-instrument.
    - certified is false. Label uncertified-class. The number reported is a coverage fraction, not a class range.
    - A cell whose basis or matrix does not finish is unmeasured and is excluded from the range. It is not a large degree.
    - Subset-column ranks are not admissible.
  success_criterion: >-
    certified is true, the base left the first-fall floor, every finished
    vertex has both increments equal to the base increments, and both ranges
    are 0. Label equal.
  falsification_criterion: >-
    certified is true, at least one vertex has both rungs finished, and that
    vertex's last-fall increment or grevlex solving-degree increment differs
    from the base by at least 1. Label gap, including when the base stays at
    the first-fall floor. not-growing-regime does not apply to this case.
  required_artifacts:
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/per_vertex.json
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260922-e53e23
  claim_ceiling:
    tier: toy
    forbids:
      - an ECDLP exponent
      - calling an unfinished cell an explosion
      - a class range when certified is false
