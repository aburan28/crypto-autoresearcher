experiment:
  id: EXP-IC-74cbb1
  hypothesis_id: H-IC-4fb1db
  version: 1
  title: polynomial exact finite-field lattice interface experiment
  status: review_required
  frozen: false
  objective: Run the complete prescribed polynomial finite schedule and preserve certificates, adverse controls,
    zero yields and instrument limits.
  inputs:
    prospective_protocol_path: research/lattice_ic_experiments_20261015/coordinator/prospective-protocols.json
    source_main: 7f11ebacb149fe7936ff45b6bdeff2918ad0edf9
    parameters:
      curves:
      - - 43
        - 1
        - 0
      - - 97
        - 0
        - 2
      - - 101
        - 2
        - 3
      windows:
      - 2
      - 4
      - 8
      oracle_m:
      - 2
      - 3
      - 5
      reduction_m:
      - 2
      - 3
      t:
      - 1
      - 2
      L:
      - 0
      - 1
      row_rank_cap: 64
      monomial_cap: 256
      coefficient_bit_cap: 4096
      target_schedule: For reduction, canonical nonzero P,2P and first nonzero sum of lex ordered m-tuple of actual
        window base, deduplicated. Planting labeled separately; full all-target law comes from exhaustive count/DP
        oracle, never from this subset.
      reducer: fpylll0.6.4 exact integer matrix LLL(delta=0.99,eta=0.51); exact Sympy1.14 HNF/Gram/Groebner and
        independent certificate checks; missing deps instrument-stop, no silent fallback
    protocol_panels:
    - Admit curves/G; F_W consists of actual nonzero G points with canonical 0<=x<W, both signs retained; W is not
      M. Exact dynamic-programming group-sum counts for all targets,m2/3/5, full first moment M^m/r and coverage,
      with a separate reconstructible witness. Oracle cost charged and never called a lattice recovery.
    - "m2 polynomial is S3(x1,x2,xR); S3=(x1-x2)^2*x3\xB2-2*((x1+x2)*(x1*x2+A)+2B)*x3+(x1*x2-A)^2-4B*(x1+x2). m3\
      \ uses exact resultant_T S3(x1,x2,T),S3(x3,xR,T); coefficients reduced modp then lifted centered, preserve\
      \ degenerate cases. Target O uses separate group oracle, not fake x(O)."
    - Dense shifts x^a*f^b*p^(t-b), b0..t, |a|<=L. Sparse-support target K=union_{j=0..t}(supp(f^j)+A_L), actual
      integer coefficient supports after cancellation; candidate a in nonnegative coordinate box0..max(K_i), retain
      iff a+supp(f^b) subsetK. This exact finite support arm is a prospective sharpening, not a claimed implementation
      of the original full convex Newton-polytope arm. Order descendingb,totaldegree,lex.
    - Build integer weighted rows with column weights product W_i^e_i; retain exact unimodular/HNF membership certificates
      so no arbitrary rational-dependence row dropping changes the Z-lattice. Compute actual candidate rows, monomial
      support D, row rank n and Gram determinant before classifying a cap. Reject n>64,D>256 or coefficientbits>4096
      as explicitly derived instrument-stop; do not assert uncomputed overflow.
    - "Actual LLL reduced vectors plus row-lattice membership certificate; strict achieved D*norm\xB2<p^(2t), unweight\
      \ exactly to integer g. Compute Groebner ideal dimension; only certified zero-dimensional extracted equations\
      \ qualify as finite-system success. Perform exact bounded integer-root extraction and original modular/rational-y/sign/subgroup/sum\
      \ checks; retain all exceptional branches. Exhaustive-box extraction is a separate charged oracle, not free\
      \ lattice success."
    - Univariate slices fix x2 at0,1, compare direct finite-field factorization and certified lattice root outputs.
      Positive-dimensional multiples of x-y and x(x-y) are required false-sufficiency controls. Nonrational repeated-coordinate
      S4(t,t,xR,xR) with RHS nonsquare is an adverse lift control; actual modular root required before reporting
      it.
    - m5 has executed density and addition-tree/height accounting only, NOT expanded S6 or lattice/root-solver coverage.
      Fixed tiny split tree preserves group/witness constraints and records intermediate coordinates; label expanded
      m5 solver outside initial instrument explicitly.
    route_interfaces: research/lattice_ic_experiments_20261015/coordinator/route-interfaces.md
    user_intake: research/lattice_ic_experiments_20261015/intake.md
  controls:
  - dense same-cap shifts
  - same-box exact/DP oracle
  - size-matched random point base
  - permuted coordinate labels
  - generic relabeled cyclic group
  - planted versus uniform law
  - coefficient-independent but positive-dimensional multiples
  - nonrational/outsideG modular roots
  - univariate finite-field root finding
  independent_variables:
  - curves
  - windows
  - oracle_m
  - reduction_m
  - t
  - L
  - row_rank_cap
  - monomial_cap
  - coefficient_bit_cap
  - target_schedule
  - reducer
  metrics:
    primary:
    - exact M and uniform valid target coverage
    - actual n,D,covolume,membership and achieved strict norm certificate
    - zero-dimensional independent equations and actual valid roots
    - new valid quotient rank per paid phase, or explicit zero yield
    secondary:
    - Exact case coverage and explicit adverse/inadmissible/instrument-stop counts
    - Per-phase operations,time,RSS; unpriced_work and source/manifest provenance
  scale_relevance:
    tier: toy
    justification: Synthetic explicitly enumerated finite fields and bounded integer boxes; no crypto transfer.
    correspondence: null
  replication:
    seeds:
    - 1729
    independent_instances: 0
    plan: One deterministic frozen finite schedule, seeded controls only; no independent replication asserted.
  budget:
    enforcement: advisory
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
  - Exactly one finite prescribed schedule; no adaptive target/curve/box replacement.
  - Dimension/bit caps, dependency absence or machine protection stop retain incomplete case and logs; never mathematical
    refutation.
  invalidation_rules:
  - Missing controls, mismatched source/spec/plan hashes or changed parameters.
  - Accepted invalid field/point/ring/lattice/root certificate; wrong denominator or improper affine O handling.
  - Oracle/planted truth injected into candidate solver or uncharged extraction described as candidate success.
  success_criterion: Prescribed coverage and mandatory integrity/control checks complete, with every valid negative/zero
    yield and derived instrument-stop explicit. This is trial integrity, not support or improvement.
  falsification_criterion: Short vectors without certified equations/extraction are zero usable yield; cap or dependency
    failure is inconclusive instrument limit, not rejection of generic small-root methods.
  required_artifacts:
  - raw-result.json
  - manifest.yaml
  - stdout.log
  - stderr.log
  - check.stdout.log
  - check.stderr.log
  - command.txt
  - environment.json
  - launch.json
  - execution-receipt.json
  assigned_to: executor
  approved_by: null
  execution_authorized: false
