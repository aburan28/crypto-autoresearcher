  interpretation_limits:
  - Synthetic tiny fields only; no asymptotic extrapolation, novelty or performance claim.
  - Development tests are software checks, not admitted scientific evidence.
  - Hypothesis remains proposed until specification/approval; no scientific promotion without independent review.
  - The original largest-prime>=5 valuation-one subgroup rule is literal; inadmissible curves and dependent cells
    retained without substitution.
  - Expanded S3/S4 reductions use m2/3 only; m5 has density and fixed split-tree/height accounting, never expanded
    S6/root-solver coverage.
  - Sparse support is the finite prescribed support union, not a full convex Newton-polytope implementation.
  - Exact integer HNF/LLL and strict norm certificates do not by themselves establish finite roots; zero-dimensional
    extraction and all original rational/subgroup relations are required.
  - All-target DP, planting, exhaustive boxes, finite-field roots and generic controls are paid oracles, excluded
    from candidate recovery and useful rank.
  - "Public-known normalization uses only O/\xB1P, never DP/planted verifier log tables."
  - Actual factorbase and pairing observations are complete but unreviewed; this is an independently requested next
    track, not positive-result expansion.
  - All phase counts, timings and ratios are descriptive; explicit unpriced work bars any speedup or ECDLP cost
    claim.
  - Five global independent mathematical/cost joints and local artifact-integrity review remain pending actual observations.
