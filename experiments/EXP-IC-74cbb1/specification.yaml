  scientific_scope_sharpening: 'Before implementation or observations: use m2/3 for expanded S3/S4 reductions, L0/1
    and a fixed P/2P/planted target subset to bound actual algebra work. Keep complete all-target DP density for
    m2/3/5, all W and three original curves; keep m5 explicit tree/height only. Sparse support is exact finite union,
