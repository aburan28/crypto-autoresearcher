experiment:
  id: EXP-ECTD-abb8be
  hypothesis_id: H-ECTD-19c623
  derived_from_idea: IDEA-20260731-016
  question_id: RQ-ECTD-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Full-class Semaev and Macaulay meter screen across at least five ordinary F_p
    isogeny classes at 40 to 56 bits - within-class heavy-tail statistics against an
    out-of-class control, a degree-profile null, and a planted-easy positive control,
    with censored solver cells recorded as censored
  objective: >-
    The one uncertainty a run reduces is whether an equation-dependent algebraic
    weakness varies enough inside a single ordinary F_p isogeny class to hide a rare
    easy endpoint. A run establishes, per class and per curve, the meter vector -
    Semaev relation density at arity 3 and 4, factor-base decomposition probability,
    solving degree or first fall under a fixed budget, and Macaulay rank defect at the
    first fall - together with the class median, interquartile range and maximum, the
    max-over-median ratio per meter, the same statistics on random same-p curves
    outside the class, the same statistics on random systems of matched degree profile
    with a planted solution, and the rank of a deliberately planted easy instance. It
    also establishes the censoring rate of the declared solver budget, without which
    no solving-degree number is interpretable. No attack is mounted and no discrete
    logarithm is claimed solved except by the matched rho and BSGS baselines run for
    comparison.
  what_this_is_not:
    - >-
      Not a trapdoor construction and not a demonstration that one exists. An outlier
      meter is a presence measurement; path hiding and public undetectability are
      separate questions with separate records.
    - >-
      Not a hardness measurement. A solver that exhausts its budget produces a CENSORED
      cell, never a large solving degree, under AGENTS.md rule 5.
    - >-
      Not a statement about cryptographic scale. A null here bounds 40 to 56 bits and
      nothing wider.
    - >-
      Not an attack on any deployed curve and not a security claim in either direction.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. On the enumerated classes at 40 to 56 bits, under the
      declared factor-base convention and solver budget, the within-class meter
      distribution does or does not contain a curve exceeding the class median by the
      pre-registered factor, and that excess does or does not exceed the out-of-class and
      degree-profile controls. WHAT DOES NOT FOLLOW. No claim that such a curve exists at
      any larger N; no claim that an outlier is exploitable or that any discrete logarithm
      on it is cheaper - only a matched, charged solve could support that and none is
      attempted; no claim that an outlier is findable without enumerating the class, which
      is the property a trapdoor would actually need; and no claim that a homogeneity
      result at this scale extends beyond the classes enumerated.
  inputs:
    procedure: >-
      STAGE 0, zero compute, ORDERING CONTROL. Declare and hash the factor-base
      convention, the arity set, the solver budget per cell, the censoring rule, the
      meter definitions, and the outlier thresholds. Nothing measured may change any of
      them afterwards.
      STAGE 1, hours, BASELINE REPRODUCTION GATE. Recompute the meters on the curves
      H-ISO-001 measured and require agreement with its committed values within the
      tolerance they were reported at. A disagreement means the meter definitions have
      drifted and the full-class numbers would not be comparable to the committed
      negative; the run halts.
      STAGE 2, hours. Generate at least five ordinary F_p classes with prime N of 40 to
      56 bits and enumerated size at least 64 via ell in {2, 3, 5, 7}. Record the
      enumeration completeness per class; an incomplete class is scoped to its enumerated
      subset rather than reported as a class.
      STAGE 3, the budget-dominant stage. For every curve in every class compute the full
      meter vector under the declared convention and budget, recording each solving-degree
      cell as measured or CENSORED.
      STAGE 4, hours. Run the OUT-OF-CLASS control: random same-p curves with matched N
      where possible and matched bit size otherwise, same count as the class, identical
      pipeline and budget.
      STAGE 5, hours. Run the DEGREE-PROFILE null: random systems with the same
      multi-homogeneous degree profile and a planted solution, identical solver and budget.
      STAGE 6, hours. Run the PLANTED-EASY positive control: place an artificially easy
      Semaev instance on one known curve per class and require the screen to rank it as
      the class extreme on the meter it was planted in.
      STAGE 7, hours. Run matched Pollard rho and BSGS on the same N per class, as the
      cost baselines any meter advantage must be charged against.
      STAGE 8, zero compute. Emit per-class meter distributions with medians, IQRs, maxima
      and max-over-median ratios; the control and null distributions beside them; the
      planted-control rank; the censoring rate; and the KS distance and extreme-value
      exceedances of each class's empirical CDF against a fitted light-tailed null.
    instrument: >-
      Python 3.11 with numpy, plus a bounded Groebner or F4-style solver invoked with a
      hard per-cell budget and a censoring return rather than an exception. A new
      standalone driver under experiments/EXP-ECTD-abb8be/driver/ performs class
      enumeration, factor-base construction under the declared convention, Semaev system
      assembly at arity 3 and 4, the bounded solve, and Macaulay rank measurement. The
      factor base is constructed from data that does NOT depend on the curve equation
      beyond what the convention declares, and the convention is asserted in the test
      suite so equation structure cannot leak into the base. Recorded through
      harness/runner.py.
    parameters: >-
      At least five ordinary F_p classes, prime subgroup order N of 40 to 56 bits,
      enumerated class size at least 64, enumeration by ell in {2, 3, 5, 7}. Semaev arity
      m in {3, 4}. Fixed factor-base convention and fixed per-cell solver budget, both
      declared at Stage 0. Censoring rule: a cell that reaches its budget is recorded
      CENSORED with the degree reached, and is excluded from every outlier statistic.
      Outlier thresholds pre-registered at a max-over-median decomposition probability of
      100, or a class maximum solving degree at least 2 below the class median.
  controls:
    - >-
      PLANTED-EASY POSITIVE CONTROL, mandatory and blocking. An artificially easy Semaev
      instance on one known curve per class. The screen must rank it as the class extreme
      on the meter it was planted in. An instrument that cannot recover a planted signal
      cannot support a negative, so a failure voids every class result.
    - >-
      NULL OBJECT, OUT-OF-CLASS. Random same-p curves outside the class with matched N
      where possible and matched bit size otherwise, run in the same invocation with the
      identical pipeline and budget. If the class and the out-of-class set have the same
      spread and the same extremes, the within-class measurement carries no class-specific
      information.
    - >-
      DEGREE-PROFILE NULL. Random algebraic systems with the same multi-homogeneous degree
      profile and a planted solution. Any claimed outlier's advantage must exceed the
      maximum observed here, or it is attributed to the system shape rather than to the curve.
    - >-
      MATCHED COST BASELINE. Pollard rho and BSGS on the same N per class, so a meter ratio
      is never read as an attack advantage. These are not expected to move and are run so
      that the charge can be stated.
    - >-
      BASELINE REPRODUCTION against H-ISO-001's committed short-neighbour meter values,
      as a hard gate before any full-class number is produced.
    - >-
      CENSORING DISCIPLINE. Every budget-exhausted cell is recorded as censored with the
      degree reached, and is excluded from outlier statistics. Treating a censored cell as
      a large solving degree would manufacture homogeneity; treating it as missing would
      manufacture a tail.
    - >-
      ORDERING CONTROL. Conventions, budgets, meter definitions and thresholds are hashed
      at Stage 0 before any measurement.
  independent_variables:
    - isogeny class identity, at least five levels
    - curve within class
    - Semaev arity m, at 3 and 4
    - 'arm: within-class / out-of-class control / degree-profile null / planted-easy control'
  metrics:
    primary:
      - >-
        Semaev factor-base decomposition probability per curve per arity, dimensionless.
        Computed as the fraction of sampled targets admitting a decomposition over the
        declared factor base within the declared budget.
      - >-
        Class max-over-median decomposition probability ratio per class per arity,
        dimensionless. Computed over uncensored cells only, reported with the class size.
      - >-
        Solving degree or first-fall degree per curve per arity, an integer, each cell
        labelled MEASURED or CENSORED. Class median and class minimum reported over
        measured cells only.
      - >-
        Macaulay rank defect at the first fall per curve per arity, an integer.
      - >-
        Planted-easy control rank, an integer position in the class ordering on the
        planted meter. A rank other than the extreme voids the run set.
    secondary:
      - >-
        Semaev relation density per curve per arity.
      - >-
        Out-of-class control meter distribution, with median, IQR and maximum.
      - >-
        Degree-profile null meter distribution, with its maximum, which is the threshold
        any claimed outlier must exceed.
      - >-
        Censoring rate, the fraction of solving-degree cells recorded CENSORED.
      - >-
        Enumeration completeness per class, and the enumerated size.
      - >-
        Matched Pollard rho and BSGS cost on the same N, in the declared operation unit.
      - >-
        KS distance of each class's empirical meter CDF against a fitted light-tailed null,
        and the count of extreme-value exceedances.
      - >-
        Peak memory of the largest Macaulay computation, measured, beside the analytic
        size of the matrix.
  heuristic_under_test: HEUR-ECTD-TAIL-1
  preregistered_prediction:
    quantity: >-
      The class max-over-median decomposition probability ratio at arity 3 and 4, and the
      gap between the class minimum and class median solving degree, over at least five
      classes.
    formula: >-
      Predicted at least one class with a ratio of 100 or more, OR at least one class whose
      minimum solving degree is at least 2 below its class median, over uncensored cells.
      Under the null of within-class homogeneity - which the parent proposal names as the
      likelier outcome - every class's ratio stays below 10 and no minimum is more than 1
      below its median. The heuristic HEUR-ECTD-TAIL-1 is compared by fitting a
      light-tailed null to each class's empirical meter CDF and reporting the KS distance
      and the extreme-value exceedance count.
    source: >-
      Pre-registered in the parent proposal IDEA-20260731-016, whose claim block states the
      factor-100 and degree-2 criteria and whose falsification_conditions state the
      factor-10 homogeneity negative. Written before any run under this contract exists and
      never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at prime subgroup orders of 40 to 56 bits, because full class enumeration
      and per-curve Groebner measurement are only affordable there. The sample-size
      justification is structural rather than distributional: the hypothesis asks for a
      RARE extreme whose predicted relative density is o(1 over the square root of the
      class size), so a class of size at least 64 gives an expected exceptional count near
      1 at the heuristic's own boundary, and at least five classes are required so the
      screen is not resting on a single draw. That is a weak design at this budget and the
      contract says so: it can detect a tail that is present in most classes and cannot
      exclude a tail present in one class in fifty. The transfer assumption for any
      homogeneity finding - that homogeneity at 40 to 56 bits says anything at larger N -
      is NOT made.
    correspondence: null
  tail_checks:
    - >-
      Report the smoothest and the extreme observed sample per class against the fitted
      null's predicted probability for it, since the hypothesis is about a tail and a
      median comparison cannot see one.
    - >-
      Report the exceedance count above the fitted null's 99th percentile per class, and
      refuse any outlier claim from a class with fewer than 32 uncensored cells on the
      relevant meter.
    - >-
      Report the censoring rate per class per meter, and mark any class whose censoring
      exceeds 20 percent as not carrying a solving-degree verdict.
    - >-
      Report every claimed outlier's full meter vector, since a genuine algebraic outlier
      should move several coupled meters and a single-meter extreme is more likely an
      artifact.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 24.0
    maximum_memory_gb: 64
    maximum_runs: 60
  stopping_rules:
    - >-
      Halt if the Stage 1 baseline reproduction against H-ISO-001's committed values fails.
      The meter definitions have drifted and nothing downstream is comparable.
    - >-
      Halt the class if enumeration cannot reach size 64; report the enumerated subset and
      scope any statement to it.
    - >-
      Abandon the solving-degree arm, reporting it UNRUN, if censoring exceeds 20 percent
      overall. The remaining meters are reported on their own.
    - >-
      Stop at the declared class count and solver budget; neither is extended after a
      measurement, and a budget increase after seeing a censored cell would be a protocol
      amendment requiring its own record.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is
      a stop, never a negative result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence. A per-cell budget
      exhaustion is different and is recorded as CENSORED within a valid run.
    - >-
      A run whose out-of-class control or degree-profile null was not executed in the same
      invocation as the within-class arm is invalid_measurement.
    - >-
      A run whose planted-easy control is missing, or whose planted control was constructed
      after the class meters were inspected, is invalid_measurement.
    - >-
      A run whose factor-base convention, solver budget or outlier threshold differs from
      the Stage 0 hash is invalid_measurement.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when, for at least five enumerated classes, the full per-curve
    meter vectors, class medians, IQRs, maxima and max-over-median ratios are reported over
    uncensored cells; the out-of-class control, degree-profile null and planted-easy control
    are reported from the same invocation; the censoring rate and enumeration completeness
    are reported per class; and matched rho and BSGS costs are reported on the same N.
    Success means a DECIDABLE run. H-ECTD-19c623 is confirmed only if, in addition, at least
    one class exhibits a max-over-median ratio of 100 or more or a minimum solving degree at
    least 2 below its median, that excess exceeds the degree-profile null's maximum, the
    out-of-class control does not reproduce it, and the planted control passes.
  falsification_criterion:
    - >-
      Every class is factor-10 homogeneous on every primary meter with no minimum solving
      degree more than 1 below its median, the planted control passes, and censoring is
      under 20 percent. The hypothesis is FALSE at the tested scale. The measured
      obstruction is the class max-over-median ratio distribution with its units, error bars
      and the runs it is read from, scoped to the enumerated classes at 40 to 56 bits.
    - >-
      The planted-easy control is not ranked as the class extreme. The instrument is VOID;
      neither a positive nor a negative may be reported from any class.
    - >-
      A claimed outlier's advantage does not exceed the degree-profile null's maximum. The
      outlier is attributed to the system's degree shape, not to the curve, and the claim is
      withdrawn.
    - >-
      The out-of-class control reproduces the within-class spread and extremes. The
      measurement is not class-specific; no within-class conclusion is available from that
      run set.
    - >-
      Censoring exceeds 20 percent of solving-degree cells. That arm is UNRUN at this
      budget under AGENTS.md rule 5, not negative.
    - >-
      Stage 1 disagrees with H-ISO-001's committed meter values. The meters have drifted and
      the run is INVALID rather than negative.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and
      inference block, and environment.
    - >-
      The Stage 0 hash of the factor-base convention, arity set, solver budget, censoring
      rule, meter definitions and outlier thresholds, written before any measurement.
    - >-
      raw-result.json carrying every per-curve, per-arity meter value with its
      measured-or-censored label, not summaries.
    - >-
      The class enumerations with completeness records and the curve equations, so any class
      statistic is independently recomputable.
    - >-
      The out-of-class control and degree-profile null measurements, in the same file as the
      within-class arm.
    - >-
      The planted-easy instances as constructed, with the meter they were planted in.
    - >-
      Matched rho and BSGS baseline measurements on the same N.
    - >-
      The analytic size of the largest Macaulay matrix beside its measured peak memory.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement approval
      is the USER's gate because it authorizes execution and spends compute. This contract is
      review_required and is NOT approved; approved_by is null and execution_authorized is
      false.
    - >-
      The parent proposal is measurement-oriented but this hypothesis carries a
      proof_search_map, so its bottleneck, baseline embedding, observation collision,
      quantifier order and method ceiling must be audited before this expensive experiment is
      approved, per KN-TECH-080.
    - >-
      This is the most expensive contract in its batch. Its budget must be reconciled against
      the campaign estimate before approval, and the Stage 1 baseline reproduction gate must
      be run and passed before Stage 3 is funded.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260731-016
    authored_at: '2026-08-25'
    note: >-
      Class count, size floor, bit range, arity set, meter list, the factor-100 and degree-2
      outlier criteria, the factor-10 homogeneity negative, the out-of-class null, the
      degree-profile null and the planted positive control all come from the parent
      proposal's minimal_test, predictions and falsification_conditions. The censoring rule
      and its 20 percent bound, the Stage 1 baseline reproduction gate against H-ISO-001, the
      ordering hash and the requirement that a claimed outlier exceed the degree-profile
      null's MAXIMUM are coordinator additions made so that a solver budget cannot be read as
      hardness and so that an outlier claim is decidable. Budgets come from the parent's
      declared high implementation and high compute.
  derivation_gaps:
    - >-
      The factor-base convention is NOT specified by the parent and must be fixed by a
      Coordinator before approval. A convention that leaks curve-equation structure into the
      base would manufacture exactly the within-class variation being measured, which is the
      single most likely way this contract silently becomes a claim.
    - >-
      The solver budget per cell is not derived. It is a coordinator choice that determines
      the censoring rate, and a budget chosen after seeing a censoring rate would be a
      protocol amendment requiring its own record.
    - >-
      Whether five classes of size 64 at 40 to 56 bits are reachable at this compute budget
      is unverified. If they are not, the contract's scope shrinks to what was enumerated and
      the sample-size weakness stated under scale_relevance becomes larger.
    - >-
      The light-tailed null used for the KS distance and exceedance counts is not fixed here.
      Choosing a null family after seeing the meter histogram is the classic way a tail claim
      becomes unfalsifiable; the family must be declared at Stage 0.
    - >-
      No route from an outlier meter to a charged attack advantage is specified. The matched
      rho and BSGS baselines are run so the charge CAN be stated, but this contract does not
      attempt a solve on any outlier and cannot support an advantage claim.
