experiment:
  id: EXP-EWALK-c4beb0
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-06cc5d
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'MIXING BY MULTIPLICATION, AND THE EXTERNAL INGREDIENT THAT SIZES IT: the Chung-Diaconis-Graham
    process X -> 2X + b mixes in about 1.01 log2 q steps where the purely additive walk needs a polynomial
    number, so a rho step R -> [lambda]R + T_s should reach Teske''s ideal collision constant at r
    = 2 or 3 table points instead of 16-20 -- but the multiplier costs a point doubling (about 1.7x
    per step in Jacobian coordinates) against a collision-constant prize capped at Teske''s ~20 percent,
    so the derived verdict is a NET LOSS of about 1.4x on every curve EXCEPT those with an O(1)-evaluable
    non-unit endomorphism, i.e. small-|D_0| CM curves, which T4 makes unreachable from any other isogeny
    class'
  status: draft
  objective: "(A) THE EXTERNAL INGREDIENT, VERIFIED AT ABSTRACT LEVEL AND CITED WITH ITS LIMITS. Chung,\
    \ Diaconis and Graham, \"Random Walks Arising in Random Number Generation\", Annals of Probability\
    \ 15(3), 1987, doi 10.1214/aop/1176992088, study the process X_{n+1} = 2 X_n + b_n mod q with\
    \ b_n uniform on {-1, 0, +1}. The mixing time is at most about 1.02*log2(q) for almost all odd\
    \ q; Hildebrand (2009) gives a matching-order lower bound of about 1.004*log2(q); and Eberhard\
    \ and Varju, \"Mixing time of the Chung-Diaconis-Graham random process\", Probability Theory and\
    \ Related Fields (2020), arXiv:2003.08117, sharpen this to (c + o(1))*log2(q) with c = 1.01136...\
    \ for almost all odd q. The purely ADDITIVE walk X_{n+1} = X_n + b_n on Z/q with the same three-element\
    \ step set needs a polynomial-in-q number of steps to mix. VERIFICATION STATUS: titles, venues,\
    \ identifiers and the abstract-level statements above were confirmed by web search on 2026-08-07;\
    \ the primary texts were NOT read in full, no theorem numbering is quoted, and every use below\
    \ is flagged [external, abstract-level] rather than asserted as a read result. A KN-LIT entry\
    \ should be minted for these before they are cited elsewhere.\n(B) WHY A MIXING RESULT IS RELEVANT\
    \ TO A COLLISION ALGORITHM, AND WHERE THE ANALOGY STOPS. Mixing time is not collision time, and\
    \ confusing the two is the obvious way to overclaim here, so the boundary is drawn first. Rho\
    \ does NOT need the walk to reach stationarity: it needs enough decorrelation that the visited\
    \ points behave like a random map, and the birthday floor Omega(sqrt(N)) is untouchable regardless\
    \ of how fast the chain mixes (KN-TECH-005). The link between the two quantities is the object\
    \ of Kijima-Montenegro, \"Collision of random walks and a refined analysis of attacks on the discrete\
    \ logarithm problem\" (KN-LIT-2945), which develops a method for the expected time to first collision\
    \ of a Markov chain and, as reported there, proves the first rigorous non-trivial lower bound\
    \ for Rho and matching upper and lower bounds under a mild assumption; and of Kim-Montenegro-Peres-Tetali,\
    \ \"A Birthday Paradox for Markov chains, with an optimal bound for collision in the Pollard Rho\
    \ algorithm for discrete logarithm\", recorded in research/pollard-rho-generic/literature.md as\
    \ the reason this program measures collision quality under stated partition assumptions rather\
    \ than assuming independence. SO THE CLAIM IS BOUNDED BEFORE IT IS MADE: a multiplier can move\
    \ the walk from the poorly-mixing small-r regime to the well-mixing regime, and the entire prize\
    \ for doing so is the gap between a poorly-mixing walk's collision constant and the ideal one\
    \ -- which KN-TECH-006 records as Teske's ~20 percent between Pollard's 3-branch map and a well-chosen\
    \ r-adding walk, and which the program's baseline convention has ALREADY BANKED.\n(C) THE CONSTRUCTION.\
    \ Step: R |--> [lambda] R + T_{s(R)}, with exponent update (a, b) |--> (lambda*a + c_s, lambda*b\
    \ + d_s) mod N. Memoryless, so van Oorschot-Wiener merging survives (KN-TECH-006). Three choices\
    \ of lambda, with sharply different cost profiles:\n  (C1) lambda = 2, i.e. the endomorphism [2].\
    \ Available on EVERY curve, no\n    CM structure required, and this is the exact CDG multiplier.\
    \ Cost: one\n    point doubling per step in addition to the usual addition.\n  (C2) lambda = the\
    \ eigenvalue of an efficiently computable NON-UNIT\n    endomorphism. Over F_p these exist for\
    \ small |D_0| -- the classical\n    GLV-type small-degree endomorphisms on curves with CM by\n\
    \    sqrt(-2), sqrt(-7), sqrt(-11) and similar. Cost: a handful of field\n    operations, potentially\
    \ cheaper than a doubling.\n  (C3) lambda = the eigenvalue of a UNIT, i.e. an automorphism. Then\n\
    \    ord(lambda) <= 6 and the construction is exactly the orbit-choice map\n    of IDEA-20260807-59fed3,\
    \ which is FREE but whose multiplier set has\n    only 6 elements. This record therefore does\
    \ not duplicate that one; it\n    covers the complementary, non-unit half of End(E).\n\n(D) THE\
    \ COST DERIVATION, DONE BEFORE ANY RUN, AND IT PRODUCES A NEGATIVE. Charge in F_p multiplications\
    \ with the curve model named. In Jacobian coordinates a mixed addition is about 11M and a doubling\
    \ about 8M (model- dependent by a few M; the exact constants are a Stage-0 obligation, not a quotation).\
    \ So:\n  additive step:            about 11M\n  (C1) affine step:         about 19M, i.e. 1.73x\n\
    \  collision-constant prize: at most about 1.20x (Teske's headroom)\n  NET:                  \
    \    about 19/11 / 1.20 = 1.44x WORSE.\nA doubling-multiplier walk is therefore a derived NET\
    \ LOSS of roughly 1.4x on any curve, and no measurement is needed to establish the sign -- only\
    \ to establish the exact constants. THAT DERIVATION IS THE PROPOSAL'S PRIMARY DELIVERABLE, because\
    \ it is the cheapest possible way to decline a whole family of \"use an endomorphism in the step\"\
    \ ideas with a stated reason rather than by fatigue.\n(E) THE ONE CELL THAT COULD PAY, AND ITS\
    \ GATE. (C2) is the only regime where the multiplier can cost less than the ~20 percent it can\
    \ buy: an endomorphism evaluable in about 2-4 field multiplications on a small-|D_0| CM curve,\
    \ giving an affine step of about 13-15M against 11M, i.e. 1.18-1.36x, against a 1.20x prize. That\
    \ is a coin flip, not a win, and it is decided by measurement rather than argument -- which is\
    \ exactly the kind of question worth one bounded experiment and not worth a campaign. AND IT IS\
    \ GATED TWICE: (i) the curve must have small |D_0|, which by T4 is fixed by the isogeny class,\
    \ so this is a property of the target and not something an attacker can acquire; (ii) even where\
    \ it holds, the prize is bounded by Teske and is zero at r >= 20, so the mechanism only matters\
    \ if one wants r = 2 or 3 for table-size reasons.\n(F) THE TWO OUTCOMES, BOTH DELIVERABLES.\n\
    \  OUTCOME 1 -- the affine walk at r = 3 attains the ideal collision\n    constant that the additive\
    \ walk needs r >= 16 to reach. The CDG\n    analogy transfers to the collision statistic, the\
    \ mechanism is\n    confirmed, and the honest headline is \"a rho walk needs a table of 3\n  \
    \  instead of 16-20 if it can afford a multiplier\", with the cost\n    derivation (D) attached\
    \ saying it usually cannot.\n  OUTCOME 2 -- the affine walk at r = 3 does NOT attain the ideal\
    \ constant.\n    Then mixing time and collision time diverge for this family, which is a\n   \
    \ substantive statement about the Kijima-Montenegro / Kim-Montenegro-\n    Peres-Tetali bridge\
    \ in the specific case of affine maps on Z/N, and it\n    is worth recording precisely because\
    \ the CDG result would have\n    predicted otherwise.\n  Neither outcome is an attack and neither\
    \ moves an exponent."
  resource_label: R3 (End(E) as a ring -- specifically its NON-UNIT elements, and the multiplicative
    order of their eigenvalues mod N; complementary to the unit group used by every other L6 proposal).
    Secondary dependence on R2 through the curve model, because the whole verdict is a per-step field-multiplication
    comparison and the model sets those constants.
  admissibility: inadmissible_generic_group
  admissibility_argument: 'INADMISSIBLE, AND THE ARGUMENT IS SHARPER HERE THAN ELSEWHERE IN THE LANE
    BECAUSE THE MULTIPLIER IS EXPLICITLY A SCALAR. On a prime-order G every endomorphism acts as multiplication
    by a scalar (H-ENDO-001), so [lambda]R is computable from R by log2(lambda) group operations and
    the step map R -> [lambda]R + T_s is a composition of group-oracle calls. That is precisely Oracle
    D of KN-FIND-b7e091, generic-group simulable, and therefore closed at exponent 1/2 by Shoup (KN-TECH-005).
    The efficient computability of phi buys ARITHMETIC SPEED, not information: a generic simulator
    reproduces the same walk at a log-factor overhead and reaches the same collision at the same step
    index. Nothing here escapes the model and nothing is claimed to; the record is filed as a recorded
    closure of a natural-looking family, with an external ingredient that sizes the prize and a cost
    derivation that spends it.'
  reachability_gate: 'THE GATE IS THE VERDICT HERE, NOT A FOOTNOTE. The only cell that could pay is
    (C2): a curve with an O(1)-evaluable NON-UNIT endomorphism, which over F_p means small |D_0|.
    By T4 the isogeny class fixes t, hence D, hence D_0 -- so whether a target curve has such an endomorphism
    is a property of its class and cannot be acquired. From a class with generic D_0, NO isogeny walk
    of any length reaches a small-|D_0| curve, at any cost: it is not expensive, it is impossible,
    because no such curve is in the class. And within a class that does have one, reaching it is free
    (0 steps, or a short walk if a specific curve is wanted, and by T5 reaching a SPECIFIED curve
    is the vectorization problem at about p^{1/4}, which for merely selecting a curve with a known
    endomorphism is unnecessary because the endomorphism exists on the whole class by transport).
    CONSEQUENCE: the (C2) cell is a statement about which curves are slightly cheaper to attack, not
    a technique an attacker can apply to a given target. That is the honest framing and it caps the
    mechanism''s operational value at zero for any target with generic D_0.'
  inputs:
    procedure: 'STAGE 0 (zero compute, and it may terminate the proposal): exact per-step operation
      counts for the chosen model; recompute (D); external literature search for prior affine-step
      rho walks. IF THE (C2) CELL IS ALSO NET-NEGATIVE ON PAPER, STOP AND RECORD THE CLOSURE -- total
      cost, one afternoon, and the deliverable is a family declined with a stated reason. STAGE 1
      (hours, HARD GATE): implement; lambda = 1 byte-identical regression; certificate check on every
      solve; construct or fail to construct the small-|D_0| CM toy family and report which. STAGE
      2 (hours): the r-sweep collision-constant measurement in STEPS, arms ADD / MUL2 / MULCM, with
      the free-multiplier calibrator. STAGE 3 (hours): charging and the net verdict. STAGE 4 (minutes):
      the composition unit test showing mixing and space gains do not compose for non-unit lambda.
      THE CHEAPEST DECISIVE CELL IS STAGE 2 AT r = 3, arm MUL2 versus arm ADD: if the multiplier does
      not move the constant there, the whole mechanism is absent and Stage 3 is unnecessary.'
    mechanism: "STAGE 0 (zero compute, and it may end the line). Fix the curve model and write the\
      \ exact per-step field-multiplication counts for: mixed addition, doubling, the (C2) endomorphism\
      \ evaluation on each candidate small-|D_0| family, and the partition/DP predicate. Compute the\
      \ derived net ratio of (D) with those numbers instead of the indicative 11M/8M. If the (C2)\
      \ cell also comes out net-negative for every candidate family, STOP AND RECORD THAT -- the whole\
      \ proposal reduces to a two-line closure and costs nothing further, which is the best possible\
      \ outcome per cost.\nSTAGE 1 (instrument, HARD GATE). Implement the affine step in the existing\
      \ harness with exact exponent bookkeeping mod N, and verify on toy instances that the recovered\
      \ k satisfies [k]P = Q on every solve (the certificate discipline of docs/claims-and-verification.md;\
      \ harness/toycurve.py is the independent verifier). Reproduce the plain additive walk's constant\
      \ 1.2533 at r >= 20 in the same harness.\nSTAGE 2 (the mixing measurement, in STEPS not in cost,\
      \ deliberately). For r in {2, 3, 4, 8, 16, 32} measure the empirical collision constant steps/sqrt(N)\
      \ for:\n  arm ADD: R -> R + T_s (the Teske baseline);\n  arm MUL2: R -> [2]R + T_s (the CDG\
      \ multiplier, available everywhere);\n  arm MULCM: R -> [lambda_phi]R + T_s on a small-|D_0|\
      \ CM curve.\nPRE-REGISTERED: arm MUL2 and arm MULCM at r = 3 attain the same constant as arm\
      \ ADD at r >= 16, within the bootstrap band. Measuring in STEPS first is deliberate: it isolates\
      \ the mixing question from the charging question, so Outcome 1 versus Outcome 2 can be decided\
      \ even though the charged verdict is already derived to be negative.\nSTAGE 3 (the charging,\
      \ which is the verdict). Re-report every cell in F_p multiplications with the model named. Report\
      \ the net ratio against arm ADD at its best r. The expected report is: mixing confirmed, charging\
      \ negative, net loss about 1.4x for MUL2 and within measurement error of 1.0 for MULCM.\nSTAGE\
      \ 4 (the composition check, zero compute plus one unit test). Verify the derived incompatibility:\
      \ attempt [lambda]canon(A) + T_s on an Aut-quotient with a non-unit lambda and confirm by unit\
      \ test that the m orbit elements of a point do NOT all map to the same class. This turns \"\
      the mixing gain and the space gain do not compose\" from an assertion into a checked fact."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - arm ADD at matched r, same seeds, same run (blocking)
  - lambda = 1 byte-identical regression to arm ADD (blocking)
  - free-multiplier calibrator (multiplier uncharged) -- must show the gain
  - random-oracle walk at the ideal constant (blocking)
  - r = 32 and r = 64 zero-advantage decay control
  - certificate re-verification of every claimed solve
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, WITH AN EXPLICIT DECAY PARAMETER. (1)
    THE MATCHED ADDITIVE NULL: arm ADD at the same r, same curve, same table, same seeds, same DP
    granularity, measured in the same run. THE DECAY PARAMETER IS r. The advantage of the multiplier
    arms over arm ADD must DECAY TO ZERO as r grows past the Teske threshold (about 16-20), because
    arm ADD is then already at the ideal constant and there is nothing left to win. An advantage that
    persists at r = 32 or 64 means an arm is beating the ideal random map, which the band derivation
    of IDEA-20260806-37eab9 forbids, and therefore falsifies the instrument rather than the band.
    (2) THE SCALAR-DEGENERACY NULL: lambda = 1, which makes the affine step identical to the additive
    step. Arm MUL with lambda = 1 must produce a BYTE-IDENTICAL step sequence to arm ADD on the same
    seed. Any divergence is an implementation defect. (3) THE RANDOM-ORACLE WALK realising the ideal
    constant by construction, as the reference all arms are measured against.'
  independent_variables: []
  metrics:
    primary:
    - collision constant steps/sqrt(N) with bootstrap interval, per arm, per r
    - r* per arm, the first r attaining the ideal within the band
    - fully charged cost in F_p multiplications, per-block attributed, model named
    - exact operation counts for addition, doubling and the CM endomorphism
    secondary:
    - block entropy of the branch-symbol sequence at lengths 1 to 4
    - stored-point count per arm
    - certificate pass/fail per solve
    - whether the small-|D_0| CM toy family was constructible, with its D_0
  heuristic_under_test: null
  preregistered_prediction:
    quantity: table size r* at which the walk first attains the ideal collision constant, per arm
    formula: r*(MUL2) <= 4 against r*(ADD) in [12, 20]. A measured r*(MUL2) above 8 means the CDG
      mixing does not transfer to the collision statistic at this scale, which is Outcome 2 and is
      a reportable finding about the mixing-to-collision bridge.
    source: pre-registered in IDEA-20260807-06cc5d before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - MIXING VERSUS COLLISION. The two are different statistics and the whole proposal rests on a transfer
    between them. Measuring in steps first and charging second keeps the two separable, and the block-entropy
    metric gives an independent read on mixing that does not go through the collision constant.
  - CURVE-MODEL ARITHMETIC. Whether a doubling is 8M or 5M or 12M changes the magnitude of the derived
    loss materially. Exact counts at Stage 0, and the model named on every number.
  - SEED LUCK AT SMALL r. At r = 2 or 3 the collision constant has enormous variance; medians with
    bootstrap intervals over many seeds, and cells with overlapping intervals reported as indistinguishable.
  - SMALL-N ARTEFACTS. The CDG bound is about log2(q) and at q ~ 2^20 that is 20 steps -- comparable
    to the r values under test, so at toy scale the mixing regime and the collision regime are not
    cleanly separated. This is a genuine limitation of toy-scale measurement of a mixing claim and
    it must be disclosed with every number.
  - LAMBDA OF SMALL ORDER. If the chosen lambda happens to have small multiplicative order mod N,
    the arm degenerates toward the unit case and measures IDEA-20260807-59fed3's object instead. ord(lambda)
    mod N must be computed and reported per instance.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: r*(MUL2) <= 4 against r*(ADD) in [12, 20]. A measured r*(MUL2) above 8 means
    the CDG mixing does not transfer to the collision statistic at this scale, which is Outcome 2
    and is a reportable finding about the mixing-to-collision bridge.
  falsification_criterion:
  - The lambda = 1 regression is not byte-identical to arm ADD. Implementation defect; nothing is
    reported.
  - A claimed solve fails its [k]P = Q certificate. Solver defect; the run set is invalid, not negative.
  - 'arm MUL2 shows no reduction in r* against arm ADD. Outcome 2: the CDG mixing does not transfer
    to the collision statistic here, and the report is that finding rather than a speedup.'
  - The free-multiplier calibrator shows no gain. The instrument cannot see mixing; every negative
    it produced is void.
  - A multiplier arm retains an advantage at r = 64. Instrument failure by the band derivation.
  - The charged verdict comes out positive for arm MUL2. The doubling is not being charged; a charging
    error, not a result, until independently re-derived.
  - Crashes, timeouts, memory exhaustion. INFRASTRUCTURE outcome under AGENTS.md rule 5.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-06cc5d
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
