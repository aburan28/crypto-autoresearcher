experiment:
  id: EXP-PFDR-a697f6
  hypothesis_id: H-PFDR-f73cc9
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  claim_tier_note: >-
    TOY because nothing is executed at deployment scale and no certified computation
    exists. RQ-PAIR-f2e31f caps this question at cost-model and calibration claims only,
    and the admissible output form is a statement of the shape - under machine model M
    and stated conventions the target-field cost is a triple, and the published figure
    corresponds to a particular model and particular conventions.
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the affected
    data is generated. NOTHING HERE IS A MEASUREMENT.

  approval_precondition: >-
    BLOCKING AND NON-WAIVABLE AT THIS CONTRACT'S LEVEL. RQ-PAIR-f2e31f constraint 1,
    which TASK-20260904-5423ad read verbatim, states that no cost claim may be recorded
    before the extended tower sieve reference and at least one pairing-curve key-size
    estimation paper are filed as knowledge-corpus entries. NO SUCH ENTRY EXISTS AND NO
    PRIMARY SOURCE HAS BEEN READ BY THIS PROGRAM. This contract MAY NOT be moved to
    review_required or approved until an agent with working retrieval has filed both, and
    the filing task and the resulting record identifiers must be named in the approving
    decision. A run executed without them is out of scope, not merely premature.

  title: >-
    Re-solving the extended tower sieve balancing step under a communication-charged
    objective - the argmin as the tracked object, a forced zero-price baseline, and a
    twenty-draw random-functional control that separates the physics of data movement from
    the optimiser's own sensitivity.

  objective: >-
    Write the extended tower sieve cost function with the machine model as an explicit
    parameter; verify symbolically that at zero communication price it reproduces the
    published optimum and both degenerate slices; measure the displacement of its
    minimiser as the price is turned up; report a triple of operations, memory and bytes
    moved at each minimiser rather than a scalar; and map the one-bit level set to
    determine whether a bit level identifies a resource profile at all.

  inputs:
    cost_function:
      source: >-
        Written from the FILED knowledge-corpus entries required by the approval
        precondition. NOT from memory and NOT from this contract. The entries' identifiers
        and content hashes are recorded in the manifest.
      form: >-
        Relation-collection term plus linear-algebra term, with an explicit communication
        term parameterised by the aggregate bandwidth, the mesh dimension, the bytes per
        matrix entry and the bytes per vector coordinate.
      optimised_tuple: 'the two tower degrees, the smoothness bound, the sieve region and the blocking width'
    price_grid:
      range: 'from free to severely bandwidth-limited, on a declared grid of at least 9 points'
      second_arm: 'a mesh area-time arm, declared separately'
    machine_models:
      count: 'at least 5, each named and each carrying its own convention vector'
    micro_benchmark:
      dimensions: 'from 10 to the 5 to 10 to the 6'
      row_weights: 'from 20 to 100'
      blocking_widths: 'from 1 to 64'
      modulus: 'a prime of the deployed subgroup size'
      seeds_per_cell: 5
      quantity: 'achieved modular multiply-adds per byte moved, and achieved bandwidth, against a matched dense kernel measuring the host flop-to-byte ratio'
    nearby_object:
      construction: >-
        An executed record computation in a small tower field whose actual resource
        consumption is published, taken from a filed corpus entry.
      purpose: >-
        The charged optimiser must BRACKET that record's consumption. If it cannot, it
        has not identified the load-bearing structure and its deployed-parameter output is
        uninterpretable.

  controls:
  - >-
    NULL-1 ZERO-PRICE REPRODUCTION (FORCED, BLOCKING). At zero communication price the
    optimiser must reproduce the published operation-count optimum and the published
    exponent constant SYMBOLICALLY - the zero-price stationarity condition reducing
    algebraically to the published expression for the optimal smoothness bound. If it does
    not, the cost function is wrong and nothing downstream may be reported. This is the
    likeliest failure and it is a useful one.
  - >-
    NULL-2 DEGENERATE-TOWER SLICES (FORCED, BLOCKING). Collapsing the tower to the
    non-tower setting, and then to the base setting, must reproduce each slice's own
    published constant at zero price. This is the baseline embedding run as a control
    rather than asserted.
  - >-
    NULL-3 RANDOM-FUNCTIONAL CONTROL (THE DECISIVE ATTRIBUTION CONTROL). Replace the
    physically derived communication term by a random smooth positive term of the SAME
    magnitude but with an arbitrary exponent in the smoothness bound, drawn from a declared
    range. AT LEAST 20 DRAWS. The physically derived term's argmin displacement must
    exceed the 95th PERCENTILE of the random draws' displacements. If it sits inside the
    bulk, the displacement is measuring the optimiser's sensitivity to a perturbation of
    that magnitude rather than the physics of data movement, and the result is a controlled
    null, not a finding.
  - >-
    NULL-4 INTENSITY CONTROL. The bandwidth-bound premise is itself measurable. If the
    measured arithmetic intensity exceeds the host's flop-to-byte ratio at any blocking
    width in the modelled range, the linear algebra is NOT bandwidth-bound there, HEUR-003
    is falsified at that width, and the optimiser is restricted to widths where it holds.
  - >-
    C-NEARBY-BRACKET. The charged optimiser must bracket the executed record computation's
    reported consumption.
  - >-
    C-TRANSCRIPTION. The deployed prime and subgroup order are checked against TWO
    independent published statements, both filed, before any number using them is computed.
  - >-
    C-CONVENTION-SWEEP. Before declaring the cost function wrong on a NULL-1 failure, the
    conventions - the smoothness estimate, the filtering assumption - are swept, because a
    NULL-1 failure may be a convention mismatch rather than an error, and distinguishing
    the two is required.
  - >-
    C-STAGE-SEPARATION. Operations and bytes moved are reported per stage and added only
    across the two stages, which are disjoint in time. Adding operation counts across
    stages with incomparable arithmetic intensities is the standard error and is forbidden.

  independent_variables:
  - communication price, on the declared grid
  - machine model, at least 5
  - objective arm - bandwidth-charged or mesh area-time
  - tower slice - full tower, collapsed tower, base setting
  - blocking width, in the micro-benchmark
  - random-functional draw index, 20 draws

  metrics:
    primary:
    - >-
      argmin_displacement, in bits, the change in the base-two logarithm of the smoothness
      bound between the zero-price and the charged minimiser, per price point per machine
      model.
    - >-
      reoptimisation_gap, in bits, the cost of the published tuple evaluated under the
      charged objective minus the cost of the re-optimised tuple under the same objective.
    - >-
      level_set_memory_span, a dimensionless ratio, the range of memory across tuples whose
      total cost is within 1 bit of the optimum.
    - >-
      arithmetic_intensity, in modular multiply-adds per byte moved, measured, against the
      measured host flop-to-byte ratio in the same units.
    secondary:
    - the cost TRIPLE at each argmin - operations, memory in bytes, bytes moved - NEVER a scalar
    - the recovered exponent constant at zero price for the target field and both degenerate slices
    - the random-functional displacement distribution over 20 draws, with its 95th percentile
    - the bracket interval around the executed record computation's reported consumption
    - achieved bandwidth in the micro-benchmark, per dimension and blocking width
    - the ratio of the spread of charged cost to the spread of free cost across the convention ensemble, reported without a directional prediction
    - the bytes-moved figure for the relation-collection stage, to check the negligibility assumption rather than assume it
    - wall time and peak resident memory of the optimiser itself, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-003

  preregistered_prediction:
    quantity: >-
      The argmin displacement, the re-optimisation gap, and the one-bit level set memory
      span.
    formula: >-
      argmin_displacement at least 1.0 bit AND above the 95th percentile of 20
      random-functional draws. reoptimisation_gap at least 8 bits, noting that the gap is
      non-negative by construction so all informative content is in the magnitude.
      level_set_memory_span at least a factor of 2 to the 10. arithmetic_intensity below
      the measured host flop-to-byte ratio.
    source: >-
      NONE OF THESE IS DERIVED FROM A THEOREM AVAILABLE TO THIS PROGRAM, and they are
      recorded as pre-registered decision thresholds. The 8-bit floor rests on a RECALLED
      external claim that an area-time re-optimisation moves a complexity constant rather
      than a constant factor in the non-tower setting; if that recollection is wrong the
      floor loses its justification and the contract must be re-scoped to a
      constant-factor measurement before approval, which is stated in H-PFDR-f73cc9
      structural_ingredients.

  scale_relevance:
    tier: crypto
    tier_note: >-
      THIS FIELD DESCRIBES THE PARAMETER SET THE COST MODEL IS EVALUATED AT AND NOTHING
      ELSE. No computation at that scale is performed, no relation is collected, no
      discrete logarithm is attempted, and the CLAIM TIER remains toy. The micro-benchmark
      is at dimensions six to seven orders of magnitude below deployment.
    justification: >-
      The cost model is evaluated at the deployed prime because that is the parameter set
      whose published label the record examines. Nothing is executed there.
    correspondence: null

  tail_checks:
  - >-
    The most extreme argmin in the price grid is reported with its full cost triple, so
    that a headline displacement is never quoted without the tuple that produced it.
  - >-
    The largest blocking width is reported separately in the micro-benchmark, since
    HEUR-003 is weakest there by construction.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    seeds_policy: >-
      One master seed per run recorded in the manifest, from which the 20
      random-functional exponent draws, the micro-benchmark matrix generation and the
      five seeds per micro-benchmark cell are derived by a declared deterministic stream.
      The symbolic reduction and the optimiser are deterministic given the grid. Seeds are
      fixed before execution and never redrawn after an outcome is seen.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 16
    maximum_runs: 6
    maximum_workers: 1
    budget_note: >-
      NO SIEVE IS RUN. The cost is the symbolic reduction, the numerical optimisation over
      the declared grid, and the micro-benchmark.

  stopping_rules:
  - >-
    SR0 BLOCKING, BEFORE ANY OTHER STEP. Confirm that both required knowledge-corpus
    entries exist and record their identifiers and content hashes. If either is missing the
    run does not start and the receipt reports the approval precondition as unmet.
  - >-
    SR1 BLOCKING. NULL-1 and NULL-2 run first. If either fails, sweep the conventions under
    C-CONVENTION-SWEEP; if the failure survives the sweep, the run HALTS and reports the
    discrepancy as its result. Nothing downstream is reported.
  - >-
    SR2 BLOCKING. C-TRANSCRIPTION on the prime and subgroup order against two independent
    filed statements, before any number using them is computed.
  - >-
    SR3. NULL-3 runs with all 20 draws before the headline displacement is quoted.
  - >-
    SR4. NULL-4 runs before the charged objective is applied at any blocking width; the
    optimiser is restricted to widths where the bandwidth premise holds, and the restriction
    is recorded.
  - >-
    SR5. Budget exhaustion stops the run and reports the price points completed. An
    infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    A cost figure is emitted without its machine model and convention vector attached.
  - >-
    A scalar bit level is emitted with no memory statement - explicitly inadmissible output
    under RQ-PAIR-f2e31f constraint 2.
  - >-
    Operation counts are added across the two stages.
  - >-
    A parameter value is taken from this contract or from memory rather than from a filed
    corpus entry.
  - >-
    A recalled external constant is reported as verified without an opened status.
  - >-
    Any statement that a deployed curve is broken or safe appears in any artifact. This is
    a scope violation and voids the run.
  - >-
    A timeout, crash or optimiser non-convergence is recorded as failed_infrastructure and
    is NEVER counted as negative mathematical evidence.

  success_criterion: >-
    NULL-1 and NULL-2 reproduce the published constants symbolically; the deployed prime is
    transcription-checked against two filed statements;
    argmin_displacement at least 1.0 bit and above the 95th percentile of the 20
    random-functional draws; reoptimisation_gap at least 8 bits; level_set_memory_span at
    least a factor of 2 to the 10; measured arithmetic intensity below the host
    flop-to-byte ratio at the modelled blocking widths; and the charged optimiser
    bracketing the executed record computation.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) NULL-1 fails after the convention
    sweep - the cost function is wrong; the record reports that and stops. THIS IS THE
    MOST LIKELY OUTCOME AND IT IS A USEFUL ONE. (F2) argmin_displacement below 1.0 across
    the whole price grid - C1 is false, the published tuple is robust to the machine model,
    and the operation-count convention is defensible for this target. THIS IS A GENUINE
    REASSURANCE ABOUT THE DEPLOYED LABELS AND MUST BE REPORTED AS ONE, not buried as a
    null. (F3) reoptimisation_gap below 8 bits - C2 is false at the stated threshold, and
    the reading is that the published tuple is near-optimal even under a charged objective.
    (F4) level_set_memory_span below a factor of 2 to the 10 - C3 is false; the bit level
    is well defined once the objective is fixed, and this program's standing worry about
    unpriced memory reduces to a single number rather than an identifiability problem. (F5)
    The physically derived displacement sits inside the bulk of the 20 random-functional
    draws - the displacement is an artifact of optimiser sensitivity; CONTROLLED NULL, no
    finding. (F6) NULL-4 fails - the linear algebra is compute-bound at the tested scale,
    HEUR-003 is falsified there, and the extrapolation to deployment scale must be
    re-argued or abandoned.

  required_artifacts:
  - the identifiers and content hashes of the two required knowledge-corpus entries
  - the symbolic zero-price stationarity reduction and its comparison against the published expression
  - the recovered exponent constants at zero price for the target field and both degenerate slices
  - the argmin tuple per price point per machine model, with the displacement in bits
  - the cost TRIPLE at each argmin - operations, memory bytes, bytes moved - never a scalar
  - the one-bit level set enumeration with its memory span and bytes-moved span
  - the 20 random-functional draws, their displacements, and the 95th percentile
  - measured modular multiply-adds per byte and achieved bandwidth, per dimension, weight and blocking width, with the matched dense-kernel host ratio
  - the bracket interval around the executed record computation's reported consumption
  - the transcription check on the prime and subgroup order against two filed statements
  - the per-stage bytes-moved figures, including the relation-collection stage
  - the convention sweep results, if NULL-1 failed
  - command, environment, seeds, tool versions, and resource measurements

  limitations:
  - >-
    THIS CONTRACT IS BLOCKED AND MAY NOT BE APPROVED UNTIL ITS APPROVAL PRECONDITION IS
    MET. RQ-PAIR-f2e31f constraint 1 is unmet - no primary source has been read by this
    program and neither required corpus entry exists.
  - >-
    THE LOAD-BEARING EXTERNAL INGREDIENT IS RECALLED, NOT READ. That an area-time
    re-optimisation moves a complexity constant rather than a constant factor is the
    justification for C2's 8-bit floor and it has not been checked. If the recollection is
    wrong, the contract must be re-scoped to a constant-factor measurement BEFORE approval.
  - >-
    NO ATTACK, NO SIEVE, NO DISCRETE LOGARITHM, AND NO SECURITY STATEMENT ABOUT ANY
    DEPLOYED CURVE is derivable from any output.
  - >-
    NO CURVE-FREE NULL IS REQUIRED AND THE REASON IS RECORDED. This contract contains no
    elliptic curve; a pairing-friendly curve enters only as the source of a prime, the
    object is a cost function and a machine model, and no elliptic-curve claim is made or
    derivable. The standing scope constraint is satisfied vacuously rather than ignored.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The deployment-scale
    computation is never executed and cannot be - performing it is exactly what the
    security level asserts is infeasible. The micro-benchmark bounds the bandwidth premise
    only at dimensions six to seven orders of magnitude below deployment, on one host, and
    nothing about a hypothetical deployment-scale machine is measured. The absolute cost
    levels inherit an unverified transcription, an engineering choice of bytes per entry, a
    filtering convention, and a lower-order term that is not small at the target field
    size. ONLY THE DIFFERENCE BETWEEN TWO EVALUATIONS OF THE SAME INSTRUMENT IS DEFENSIBLE.
  - >-
    A FLAT SURFACE MAKES THE ARGMIN NUMERICALLY UNSTABLE. An apparent displacement may be
    numerical, which is why the level set is reported alongside the argmin and why NULL-3
    is a rank test against 20 draws rather than a single comparison.
  - >-
    A NULL-1 FAILURE MAY BE A CONVENTION MISMATCH RATHER THAN AN ERROR, and the conventions
    are swept before the cost function is declared wrong.
  - >-
    Re-optimisation cannot hurt the MODEL'S minimiser. That is a statement about the model,
    not about real attackers, who face engineering constraints the model omits.

  assigned_to: executor
  approved_by: null
