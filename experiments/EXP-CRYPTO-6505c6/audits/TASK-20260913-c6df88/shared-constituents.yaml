# shared-constituents.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
# Detail supporting obligation column O05 across all 16 cases. Not one of
# the two frozen 160/400-cell matrices; obligation-results.yaml carries the
# authoritative per-cell status.
shared_constituents:
  provenance:
    source_spec: experiments/EXP-CRYPTO-6505c6/specification.yaml (main_transfer_target.shared_locus, controls.forgotten_structure)
    source_digest: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
  goursat_machinery_gap: >-
    Section 3 of the primary source ("Around Goursat's Lemma," 3.1 "Goursat's
    Lemma," 3.2 "A criterion for vanishing of coinvariants," 3.3 "The
    orthogonal case," 3.4 "A property of gallant sheaves") is titled exactly
    on-point for classifying subgroups of a product of two monodromy groups
    and when the resulting representation has no invariants/coinvariants --
    precisely the tool a shared-constituent analysis of E_Q x E_R would need.
    Its actual statements were NOT retrieved (source-digest.md Sec.5/Sec.7
    item 2); only section titles and the general framing are known. This is
    flagged in the digest as "the single most promising unexploited lead...
    and should be the first thing a follow-on fetch pass targets" -- this
    task does not attempt that fetch (no web access) and does not invent
    what those sections would say.
  by_case:
    - case: case-03
      family: K
      base: main
      locus: diagonal (Q=R)
      verdict: CERTIFIED (obligation-results.yaml O05)
      reasoning: >-
        Elementary, source-independent: on Q=R, f_Q and f_R are identical
        functions of P, so f_Q^*(j_!F) and f_R^*(j_!(F^dagger)) are pullbacks
        along the SAME map -- the shared-constituent locus is trivially the
        entire object, not a proper subvariety. No Goursat-Lemma-style
        classification of a product monodromy group is needed to see this;
        it follows from the diagonal parameter locus alone.
    - case: case-04
      family: L
      base: main
      locus: diagonal (Q=R)
      verdict: CERTIFIED (obligation-results.yaml O05)
      reasoning: Same diagonal argument as case-03; independent of family L's
        own (unknown) monodromy content.
    - case: case-05
      family: K
      base: main
      locus: "off-diagonal shared-constituent/translation-stabilizer locus;
        size unknown"
      verdict: OPEN (obligation-results.yaml O05)
      reasoning: >-
        This case IS the object O05 asks to characterize. Its size/
        dimension/degree is explicitly declared unknown by the
        specification itself ("Do not assume this locus is small or omit
        it to force the target"). Resolving it requires the unretrieved
        Goursat's-Lemma/coinvariant-vanishing criterion (Sec.3.1-3.2)
        applied to K's specific monodromy, which this task cannot supply.
    - case: case-06
      family: L
      base: main
      locus: same as case-05, for family L
      verdict: OPEN (obligation-results.yaml O05)
      reasoning: Same gap as case-05, compounded by family L's total
        absence from the source (no monodromy data of any kind is stated
        for L, classical SL_2 monodromy notwithstanding -- that classical
        fact is not this paper's content and is not asserted here as a
        certified derivation).
    - case: case-07
      family: K
      base: main
      locus: "independently generic (Q0,R0) in a separate symbolic copy of X"
      verdict: OPEN (obligation-results.yaml O05)
      reasoning: >-
        Generic independent points are geometrically PLAUSIBLE candidates
        for vanishing coinvariants (no special stabilizer relation is
        imposed), but "plausible" is not a certificate: the actual
        vanishing-of-coinvariants criterion needed to certify this (Sec.3.2)
        was not retrieved. Per specification.controls.matched_nulls:
        "Missing required matching certificate means OPEN and overall
        inconclusive, not N/A."
    - case: case-08
      family: L
      base: main
      locus: same as case-07, for family L
      verdict: OPEN (obligation-results.yaml O05)
      reasoning: Same as case-07, compounded by family L's absence from source.
    - cases: [case-01, case-02, case-09, case-10, case-11, case-12, case-13, case-14]
      locus: "Full X (main-target and excluded-base-diagnostic roles)"
      verdict: OPEN (obligation-results.yaml O05, all eight cases)
      reasoning: >-
        Full-X shared-locus analysis for K or L requires the same
        unretrieved Goursat's-Lemma/coinvariant machinery as case-05/06;
        the base stratum (main, D0, D1, D01) does not change which source
        content is missing, since the gap is in Sections 3.1-3.2, which
        say nothing about elliptic curves or bases at all.
    - cases: [case-15, case-16]
      family: [C1, C2]
      locus: "Full X"
      verdict: CERTIFIED (obligation-results.yaml O05, both cases)
      reasoning: >-
        A constant sheaf's monodromy representation is TRIVIAL (the
        structure group acts as the identity). The coinvariants of a
        trivial representation are the whole representation everywhere --
        an elementary, universally known fact about trivial group actions
        that requires no Goursat-Lemma-style classification of a genuinely
        nontrivial product monodromy group. The shared-constituent locus for
        C1/C2 is therefore trivially all of X.
  forgotten_structure_note: >-
    specification.controls.forgotten_structure: "Compare shared constituents/
    coinvariants at certified equal coarse rank/conductor wherever
    available; equality of coarse invariants alone is not a cancellation
    hypothesis." No case above treats coarse-invariant equality as
    discharging a cancellation claim; where coarse invariants ARE certified
    equal (e.g. C1/C2's trivial rank/conductor data in complexity-ledger.yaml),
    this file does not use that equality to infer any cancellation result.
