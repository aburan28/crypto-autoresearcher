# new reading of the primary source; every entry below is attributed to the
# digest (or, for the six sections listed in
# implementation/source-obligations.yaml.already_read_by_parent, to the
# earlier parent control-plane session that DEC-20260907-d42056 cites).
source_readings:
  primary_source:
    url: https://arxiv.org/html/2511.09459v1
    title_recalled: "Fouvry, Kowalski, Michel and Sawin, Bilinear forms with trace functions"
    read_by_this_task: false
    read_by:
      - session: TASK-20260913-0d9fe6 (idea-generator, web_search authority)
        method: repeated WebFetch calls, LLM-mediated summarization (no
          direct rendered/raw-HTML view), confidence built by re-asking
          differently-worded prompts and cross-checking stability
        record: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
      - session: TASK-20260913-4e7c6d (idea-generator, prior pass, superseded
          for artifact production but its literature finding stands)
        method: WebFetch, corroborated the ineffectiveness finding independently
        record: ledger/handoffs/TASK-20260913-4e7c6d.yaml (coordinator_correction_20260913)
      - session: parent_control_plane/01a07d9c-ceb4-7892-ae01-260e4b5f0374
        method: unspecified prior reading, recorded in
          experiments/EXP-CRYPTO-6505c6/implementation/source-obligations.yaml
        sections_read: [Theorem 1.1, Definition 1.2, Remark 1.2, Theorem 2.4,
          Corollary 3.14, Section 9.10]
  sections_covered_by_digest:
    - section: "1 Introduction (1.1-1.5)"
      status: outline_only
      note: headings retrieved consistently across repeated fetches; body
        text of 1.1/1.4 not read
    - section: "1.2 General statements (Theorem 1.1, Definition 1.2, Remark 1.2)"
      status: quoted
      note: Definition 1.2 (gallant/light) and Remark 1.2 (effectiveness
        disclaimer) quoted from two agreeing fetch passes
    - section: "1.3 An exceptional case (sulfatic/oxozonic, SO4/O4)"
      status: quoted_partial
      note: sulfatic/oxozonic definitions partially reproduced; one clause
        of the oxozonic definition could not be fully reproduced verbatim
        (source-digest.md Sec.4.2)
    - section: "2 Algebro-geometric preliminaries"
      status: quoted_partial
      note: L_chi/L_psi notation, F^∨ duality, middle-extension definition,
        j_! zero-extension convention, Theorem 2.4 statement all quoted;
        formal definitions of "lisse" and "pure of weight w" NOT FOUND in
        this section (assumed from prior literature by the paper itself)
    - section: "3 Around Goursat's Lemma (3.1-3.6)"
      status: not_retrieved
      note: only section/subsection TITLES known (Goursat's Lemma; criterion
        for vanishing of coinvariants; the orthogonal case; property of
        gallant sheaves; oxozonic sheaves; diagonal estimates); actual
        statements NOT retrieved. Directly affects O05 for every non-trivial
        case (see open-obligations.yaml)
    - section: "4 General estimates for bilinear forms (4.1-4.3)"
      status: partial
      note: one targeted fetch of 4.3 ("reduction to a stratification
        statement") retrieved the complexity-as-output-not-input finding;
        4.1/4.2 not read
    - section: "5 Moment estimates for gallant sheaves"
      status: not_retrieved
      note: two independent targeted WebFetch attempts both returned
        "content not present in retrieved excerpt." This is where the
        paper's actual moment-bound proof for gallant sheaves would live --
        the single largest disclosed gap (source-digest.md Sec.7 item 1)
    - section: "6 Stratification for gallant sheaves and conclusion of the proof"
      status: not_retrieved
      note: same gap as Section 5; this is where Theorem 2.4 is applied to
        conclude Theorem 1.1
    - section: "7 Bounds for trilinear sums with monomial arguments"
      status: not_read
      note: not attempted in this pass; not asserted irrelevant, only unread
    - section: "8 The oxozonic case"
      status: not_read
      note: not attempted beyond the Sec.1.3/Theorem-1.6 pointer
    - section: "9 Ubiquity of gallant sheaves (9.1-9.10)"
      status: partial
      note: worked-example subsection titles known; a dedicated Kummer/
        Legendre negative search covered this section's catalogue and found
        no elliptic-fibration R^1-pi_* example by name; individual worked
        examples not read line by line
  negative_findings_confirmed_by_dedicated_search:
    - claim: "'Kummer sheaf' appears only once, as bare generic L_chi notation"
      search_type: targeted confirmatory search, cross-checked
      result: confirmed
    - claim: "'quadratic character' does not appear anywhere in the paper"
      search_type: dedicated negative search
      result: confirmed_negative
    - claim: "'Legendre' does not appear anywhere in the paper"
      search_type: dedicated yes/no negative search (framed to reduce risk
        of a false positive from the summarizing model)
      result: confirmed_negative
  disclosed_data_quality_caveats:
    - Every quote in source-digest.md is an LLM-mediated transcription via
      WebFetch's own summarizing model, not a hand-verified reading of raw
      HTML/PDF by a human or a tool with direct text access.
    - "The 'n vs d' ambiguity in Theorem 2.4 conclusion (3): two independent
      fetches both rendered the word 'n' where a bound in terms of the fixed
      ambient dimension 'd' would be expected; the tool itself flagged this
      as a likely typo but held to 'n' on re-query. UNRESOLVED. This task
      does not silently substitute 'd' for 'n' anywhere below; see
      stratification-application.yaml and normalization-and-weights.yaml."
    - "Theorem number 'Theorem 1.6' for the oxozonic-case extension (source-digest.md
      Sec.4.2) rests on a single fetch pass, not independently reconfirmed;
      its numbering is treated as tentative wherever cited."
    - >-
      "[Pisa]", the comparison work Remark 1.2 cites for polynomial
      dependency, was not opened or read; no claim is made about what it
      actually proves.
  critical_finding_verification:
    theorem_2_4_effectiveness:
      resolution: INEFFECTIVE_AS_STATED
      corroboration_count: 2 (TASK-20260913-4e7c6d and TASK-20260913-0d9fe6,
        independent fetch passes with overlapping but non-identical quote sets)
      recorded_before_any_O06_dependent_cell_marked_CERTIFIED: true
      quotes: [
        "[QUOTE, Sec.1.2, Remark 1.2]: 'Our method is in one respect less
         efficient than that of [Pisa]: whereas the latter provides estimates
         where the dependency on the complexity (when it applies) is
         polynomial, this is not the case in this paper, due to the use of
         qualitative results in Quantitative Sheaf Theory.'",
        "[QUOTE, Sec.2, Theorem 2.4(4)]: '...where the implicit constant
         depends only on d and c(M).' -- no accompanying explicit formula."
      ]
    family_L_absence:
      resolution: TOTAL_ABSENCE_CONFIRMED
      corroboration_count: 1 (dedicated negative search, this pass)
      quote: "[QUOTE-search result]: 'The term \"Legendre\" does not appear
        in this paper, nor is the Legendre family of elliptic curves
