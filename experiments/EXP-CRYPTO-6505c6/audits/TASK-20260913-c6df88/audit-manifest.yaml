# audit-manifest.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
audit_manifest:
  audit_task_id: TASK-20260913-c6df88
  experiment_id: EXP-CRYPTO-6505c6
  hypothesis_id: H-CRYPTO-fde1f1
  specification_version: 1
  approval_decision_id: DEC-20260907-d42056
  role: executor
  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    fallback_used: false
  pipeline_position: >-
    Stage 3 of a 3-stage corrected pipeline. Stage 1 (TASK-20260913-4e7c6d,
    idea-generator, misrouted for artifact production, disclosed and
    superseded) independently corroborated Theorem 2.4's ineffectiveness.
    Stage 2 (TASK-20260913-0d9fe6, idea-generator, in web_search authority)
    produced coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md,
    a complete literature digest of the cited primary source. Stage 3 (this
    task, executor, in may_execute_experiments authority) formalizes that
    digest plus specification.yaml's own text into this 20-file frozen
    artifact bundle, without itself fetching or inventing any primary-source
    content.
  inputs:
    - path: experiments/EXP-CRYPTO-6505c6/specification.yaml
      role: frozen contract (families, strata, addition charts, 160-cell
        obligation matrix, 400-cell chart matrix, controls, artifact layout)
    - path: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
      role: literature digest this task formalizes; sole source of any
        primary-source content used below (this task performed no new
        reading of https://arxiv.org/html/2511.09459v1)
    - path: ledger/handoffs/TASK-20260913-4e7c6d.yaml
      role: background on the role-routing correction and the first-pass
        ineffectiveness finding the digest re-confirms
    - path: coordination/design/BATCH-aa0d38/design-note.md
      role: design-time framing (unchanged by this task)
    - path: coordination/design/BATCH-aa0d38/checkpoint.md
      role: prior-status checkpoint (unchanged by this task)
    - path: experiments/EXP-CRYPTO-6505c6/implementation/obligation-matrix.yaml
      role: unfilled preparation schema (case/obligation key set, phase and
        case order) reused here only for its structural keys, never for a
        prior verdict (all statuses there are null)
    - path: experiments/EXP-CRYPTO-6505c6/implementation/symbolic-fixtures.yaml
      role: unfilled preparation schema (chart-pair key set) reused here
        only for its structural keys
    - path: experiments/EXP-CRYPTO-6505c6/implementation/certificate-schema.json
      role: certificate/bundle structural schema followed for
        certificate-bundle.md/dependency-dag.yaml/checker-results.yaml
  scope_and_capability_boundary: >-
    This task has no web_search or WebFetch capability and did not attempt
    to fetch or invent any primary-source content beyond what source-digest.md
    already reports. Where the digest records [NOT FOUND], an unretrieved
    section, or an unresolved ambiguity, that gap is preserved as-is in every
    downstream file below -- it is never silently filled in, resolved in
    either direction, or upgraded to a certified fact.
  headline_findings_carried_forward:
    - id: FINDING-INEFFECTIVE-O06
      statement: >-
        Theorem 2.4's implicit constant depends on (d, c(M)) with no explicit
        formula given anywhere retrievable in the paper; Remark 1.2
        explicitly disclaims polynomial/effective dependency for this
        paper's own method. Obligation O06, and every cell whose CERTIFIED
        status would depend on a certified effective bound, is recorded OPEN
        with this exact missing prerequisite, per specification.stopping_rule.
      source: source-digest.md Sec.3.3 (independently corroborating
        TASK-20260913-4e7c6d's coordinator_correction_20260913 finding)
    - id: FINDING-FAMILY-L-ABSENT
      statement: >-
        Family L ("Legendre R^1") does not appear anywhere in the cited
        primary source -- confirmed by a dedicated negative search. Every
        case row using family L (case-02, case-04, case-06, case-08,
        case-10, case-12, case-14) carries an honest OPEN status for its
        family-specific obligations, not REFUTED or CERTIFIED.
      source: source-digest.md Sec.2.2
  independent_review_status: >-
    NOT YET PERFORMED. Per specification.independent_checker_plan.semantic_output,
    "requires an independent qualified review task, not this preparation
    Executor." Every verdict in this bundle is this task's own best-effort
    formalization of specification.yaml plus source-digest.md, not an
    independently reviewed result. See audit-report.md.
  root_files:
    - audit-manifest.yaml
    - source-readings.yaml
    - source-hypothesis-matrix.yaml
    - case-index.yaml
    - obligation-results.yaml
    - chart-coverage.yaml
    - normalization-and-weights.yaml
    - complexity-ledger.yaml
    - shared-constituents.yaml
    - moment-certificates.yaml
    - stratification-application.yaml
    - control-results.yaml
    - counterexamples.yaml
    - open-obligations.yaml
    - work-and-resources.yaml
    - audit-report.md
    - certificate-bundle.md
    - dependency-dag.yaml
    - checker-results.yaml
    - artifact-sha256.json
  exact_root_file_count: 20
  hash_note: >-
    artifact-sha256.json hashes every one of the other 19 files listed above;
    it is itself hashed only by the Coordinator's archive step
    (specification.artifacts.binding), not by this manifest.
