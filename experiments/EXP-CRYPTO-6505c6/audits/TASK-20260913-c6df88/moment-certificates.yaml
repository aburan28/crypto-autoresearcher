# moment-certificates.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
# Detail supporting obligation column O06 (all-extension fourth-moment
# statement and effective B(C)) across all 16 cases. Not one of the two
# frozen 160/400-cell matrices.
moment_certificates:
  provenance:
    source_spec: experiments/EXP-CRYPTO-6505c6/specification.yaml (main_transfer_target.moment, .effective_B)
    source_digest: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
  target_statement: >-
    sum_{(Q,R) in X(F_(p^n))} |S_F,n(Q,R)|^4 <= B(C)*|F_(p^n)|^5, for every
    n>=1, with m=2, A=5 (specification.main_transfer_target.moment_parameters).
  headline_finding_FINDING-INEFFECTIVE-O06:
    verdict: OPEN for every case using family K or L (case-01 through case-14)
    reason: >-
      Theorem 2.4's own conclusion (4) states an implicit constant
      "depend[ing] only on d and c(M)" with NO explicit formula given
      anywhere retrievable in the paper. Remark 1.2 explicitly disclaims
      polynomial (hence any concretely effective) dependency: "this is not
      the case in this paper, due to the use of qualitative results in
      Quantitative Sheaf Theory" (contrasted against a cited but unread
      comparison work, "[Pisa]", said to achieve polynomial dependency).
      Separately and independently, the actual PROOF of the moment
      hypothesis for gallant sheaves (which Theorem 2.4 takes as a
      hypothesis to be supplied, not something it proves) lives in the
      unretrieved Section 5, and its application to conclude the main
      theorems lives in the unretrieved Section 6. Neither an explicit
      formula for the implicit constant, nor a proof of the moment
      hypothesis for the elliptic-addition correlation complex, is
      available to this task. specification.main_transfer_target.effective_B
      is explicit: "a finite observed maximum, n-dependent C, or ineffective
      existence does not discharge this target." O06 CANNOT be marked
      CERTIFIED for family K or L from this source alone.
    corroboration: >-
      Independently corroborated by two prior passes:
      TASK-20260913-4e7c6d's coordinator_correction_20260913 finding and
      TASK-20260913-0d9fe6's own independent re-read (source-digest.md Sec.3.3).
    caveat: >-
      Both corroborating reads are LLM-mediated WebFetch transcriptions of
      dense HTML/MathML, not from-source symbol-by-symbol human verification.
      This remains a real, disclosed limitation of the underlying evidence,
      not a reason to soften the OPEN verdict.
  by_case_K_L:
    cases: [case-01, case-02, case-03, case-04, case-05, case-06, case-07,
      case-08, case-09, case-10, case-11, case-12, case-13, case-14]
    status: OPEN (all 14 cases; see obligation-results.yaml O06 rows)
    missing_prerequisites:
      - "An explicit computable formula for Theorem 2.4's implicit constant
        in terms of (d, c(M))."
      - "A proof (not just a hypothesis) of the all-extension 2m-th moment
        bound for the SPECIFIC elliptic-addition correlation complex built
        for family K or L, which requires the unretrieved Section 5."
  control_cases_C1_C2:
    cases: [case-15, case-16]
    status: REFUTED (see obligation-results.yaml O06 rows, and
      counterexamples.yaml CTREX-01/CTREX-02)
    computation: >-
      Per specification.yaml's target_sum definition S_F,n(Q,R) =
      sum_P t_F(f_Q(P))*conj(t_F(f_R(P))): for constant trace t_F=c (c=1
      for C1, c=2 for C2), each of the |E(F_(p^n))| terms in the P-sum
      equals c*conj(c)=c^2 regardless of f_Q, f_R (t_F ignores its
      argument), so S_F,n(Q,R) = c^2*|E(F_(p^n))| for EVERY (Q,R) in X,
      independent of Q and R (no cancellation is possible when the trace
      function does not vary with the addition-shift argument at all).
      |X(F_(p^n))| = |E(F_(p^n))|^2 exactly (X = E x E, each factor of
      size q_n). Then:
        sum_{(Q,R) in X(F_(p^n))} |S_F,n(Q,R)|^4
          = |X(F_(p^n))| * (c^2*|E(F_(p^n))|)^4
          = q_n^2 * c^8*q_n^4 = c^8*q_n^6.
      [Corrected during Coordinator independent verification,
      TASK-20260913-627c97: the original draft used S_F,n(Q,R)=t_F*q_n
      (c^1) and then dropped the t_F-dependence from the final line
      entirely ("~q_n^2*q_n^4=q_n^6" regardless of c). For c=1 (C1) this
      coincided with the correct value since 1^8=1, masking the error;
      for c=2 (C2) the correct value is c^8*q_n^6=256*q_n^6, not q_n^6 --
      see counterexamples.yaml CTREX-01/CTREX-02 for the case-by-case
      figures.] The target requires this sum <= B(C)*q_n^5 for an
      n-INDEPENDENT B(C). Since c^8*q_n^6 / q_n^5 = c^8*q_n -> infinity as
      n grows for any fixed c>0 and fixed base p, NO n-independent B(C)
      can satisfy the bound, for either C1 (c=1) or C2 (c=2). This is an
      exact, elementary, checkable counterexample requiring no sheaf
      theory or source citation.
    interpretation: >-
      Per specification.controls.constants ("Both constant ranks must
      expose full-support correlation/exceptional behavior and be rejected
      by the cancellation argument") this REFUTED verdict is the CORRECT,
      expected control outcome, not a defect: the audit's own machinery
      correctly identifies that the moment target fails for non-gallant,
      non-irreducible (trivial-monodromy) objects, exactly the
      discriminating behavior the control is designed to exercise.
    scope_limitation: >-
      Per specification.falsification_criterion, "A checked exact
      counterexample to the fixed main-family quantified target is
      scope-limited negative evidence for that target only." This
      counterexample is scoped strictly to family C1/C2 and does NOT
      constitute or imply any counterexample to the K/L main-target moment
      claim, which remains separately OPEN, not REFUTED, for K/L.
