# source-hypothesis-matrix.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
# Hypothesis-by-hypothesis match of Theorem 2.4 (the only source theorem this
# audit invokes by name, per specification.main_transfer_target.stratification)
# against the specification's constructed X = E_Q x E_R and correlation
# complex. Feeds obligation column O07. Discharges no premise by itself.
source_hypothesis_matrix:
  provenance:
    source_digest: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
    source_section: "Sec.3.1 (Theorem 2.4 exact hypothesis, quoted)"
  theorem: "Theorem 2.4 (Fouvry-Kowalski-Michel-Sawin, arXiv:2511.09459v1, Sec.2)"
  theorem_quote: >-
    "Let k be a finite field and l a prime number different from the
    characteristic of k. Let X be a quasiprojective variety with a locally
    closed embedding in P^d_k for some integer d>=0. Let M be an object of
    D^b_c(X, Qbar_l) which is mixed of integral weights. Assume that there
    exists a positive integer m, a real number A and a real number B>=1 such
    that sum_{x in X(k_n)} |t_M(x,k_n)|^{2m} <= B*|k_n|^A for all integers n>=1."
  hypothesis_items:
    - id: H1
      statement: "k a finite field, l a prime != char(k)."
      match_target: "k = F_p, p>=5 prime (specification.frozen_symbolic_domain.base); l chosen != p."
      match_status: CERTIFIED
      note: Trivially satisfiable; no obstruction identified.
    - id: H2
      statement: "X quasiprojective with a FIXED, a priori locally closed
        embedding into P^d_k for some d>=0, fixed BEFORE the moment
        quantifier over n."
      match_target: "specification.frozen_symbolic_domain.embedding: Projective
        Weierstrass E in P2 and E_Q x E_R in P8 by Segre; specification is
        explicit this convention 'must be source-matched and certified, not
        inferred from conductor alone.'"
      match_status: OPEN
      note: >-
        The quantifier-order requirement itself matches
        (source-digest.md Sec.3.1: "this embedding and its d are fixed
        BEFORE the quantifier over n... which matches specification.yaml's
        own quantifier-order requirement"), but the SPECIFIC embedded-degree
        d for X = E_Q x E_R in P8 has not itself been certified against the
        source's own conventions (specification.main_transfer_target.complexity_C
        obligation); see complexity-ledger.yaml.
    - id: H3
      statement: "M an object of D^b_c(X, Qbar_l), mixed of INTEGRAL weights."
      match_target: "specification.correlation.candidate_complex: unshifted
        R pi_! of f_Q^*(j_!F) tensor-derived with f_R^*(j_!(F^dagger))."
      match_status: OPEN
      note: >-
        Whether the specific constructed candidate_complex is mixed of
        integral weights depends on family K/L's own weight data, which is
        OPEN per O01 (source-digest.md Sec.2.1/2.2 -- no purity/weight facts
        stated for K or L in the cited source).
    - id: H4
      statement: "Existence of m (positive integer), A (real), B>=1 (real)
        such that the 2m-th moment of t_M over X(k_n), for EVERY n>=1, is
        bounded by B*|k_n|^A."
      match_target: "specification.main_transfer_target.moment (m=2, A=5),
        specification.main_transfer_target.effective_B."
      match_status: OPEN
      note: >-
        source-digest.md Sec.3.1: "the specification is asking the audit to
        SUPPLY this hypothesis for the specific correlation complex M it
        builds (not asking Theorem 2.4 to prove it; Theorem 2.4 ASSUMES
        it)." Proving this hypothesis for the elliptic-addition correlation
        complex requires the unretrieved Section 5 (moment estimates for
        gallant sheaves). This is the same gap recorded as O06 OPEN.
  no_additional_restrictions_found:
    statement: >-
      source-digest.md Sec.3.1/4.3: no stated restriction on n, on |k|=q, or
      on finite-vs-infinite monodromy attached to Theorem 2.4 itself; it is
      monodromy-agnostic (does not mention "gallant," "light," or any
      monodromy-group condition). The finite/infinite split and the
      SO4/sulfatic exclusion (source-digest.md Sec.4.1-4.2) are conditions on
      which sheaves the paper's MAIN bilinear-sum theorems (1.1, 1.3, 1.4,
      1.6) apply to, not on Theorem 2.4 as invoked here.
    consequence: >-
      Family K/L need not be shown "gallant" to invoke Theorem 2.4 itself;
      they need only satisfy H1-H4 above. This narrows, but does not close,
      the O07 obligation: H4 (the moment hypothesis) remains the binding
      constraint, and it is exactly the one blocked on the unretrieved
      Section 5 proof.
  overall_match_verdict: >-
    H1 CERTIFIED; H2, H3, H4 OPEN. Per specification.obligation_matrix.O07
    ("Source theorem hypothesis-by-hypothesis match; no unproved
    monomial-to-addition identification"), the match is INCOMPLETE for
    families K and L in every case using them; see obligation-results.yaml
    O07 rows. No monomial-to-addition identification is asserted anywhere in
    this file.
  control_case_note: >-
    For the constant-sheaf controls (case-15, case-16), H4 is checked
    directly and FAILS (see counterexamples.yaml CTREX-01/CTREX-02), so the
    match is REFUTED at H4 for those cases specifically, not merely open;
    see obligation-results.yaml O06/O07/O08 for case-15/case-16.
