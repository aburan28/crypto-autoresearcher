  chart_pattern_definitions:
    FULL_X: >-
      Q and R range independently over the case's full parameter locus.
      Chart-pair compatibility derived by elementary elliptic-addition-law
      case analysis (see chart-coverage.yaml): P_identity self-pair
      compatible; P_identity crossed with any other tag empty (shared P
      forces identical classification); all 16 non-identity-tag
      combinations compatible (Q, R chosen independently).
    DIAGONAL: >-
      Q=R exactly. Only same-tag pairs are compatible (5 of 25); every
      cross-tag pair is empty by construction, since Q=R forces identical
      chart classification for the (P,Q) and (P,R) slots.
    OFFDIAG: >-
      Q!=R but confined to the off-diagonal shared-constituent/
      translation-stabilizer locus, whose size and definition are
      themselves an OPEN obligation (O05). The P_identity self-pair/
      cross-pair facts still hold universally (they depend only on P), but
      the remaining 16 non-identity-tag combinations are OPEN pending
      identification of that locus.
