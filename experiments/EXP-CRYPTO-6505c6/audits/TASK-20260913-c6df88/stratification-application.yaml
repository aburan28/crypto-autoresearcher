# stratification-application.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
# Detail supporting obligation column O08 (exceptional dimension/degree,
# off-locus residual correlation, effective constants) across all 16 cases.
stratification_application:
  provenance:
    source_spec: experiments/EXP-CRYPTO-6505c6/specification.yaml (main_transfer_target.stratification)
    source_digest: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md (Sec.3.2)
  theorem_2_4_conclusions_quoted:
    - conclusion_1: "We have X^(w) subset X^(w-1) for all w."
    - conclusion_2: "We have dim X^(w) <= floor(A) - m*w for all w."
    - conclusion_3: "Each X^(w) is a union of subvarieties of total degree
        bounded only in terms of n and c(M)."
      flag: >-
        Possible transcription defect: two independent fetch passes both
        rendered "n" here where a bound in the fixed ambient dimension "d"
        would be structurally expected; UNRESOLVED (see
        normalization-and-weights.yaml.n_vs_d_ambiguity). This task does not
        substitute "d" for "n"; every downstream use of conclusion (3)
        below is qualified by this unresolved flag.
    - conclusion_4: "For all n>=1 and x in (X minus X^(w+1))(k_n), we have
        t_M(x,k_n) << |k_n|^(w/2), where the implicit constant depends only
        on d and c(M)."
  X_w_definition: >-
    "[QUOTE, inside the proof of Theorem 2.4, not a separate numbered
    definition]: We then define X^(w), for w in Z, to be the union over i
    of the connected components of dimension <= A - m*w of [a family of
    subschemes Y_i built in the proof]." The Y_i/Y_{i-1} construction itself
    was not retrieved cleanly (source-digest.md Sec.3.2).
  applicability_to_main_transfer_target.stratification: >-
    specification requires "certify a closed exceptional Sigma in X of
    dimension<=1, effective degree bound D(C), and |S|<=K(C)*sqrt(q_n) off
    Sigma." Matching this to Theorem 2.4's X^(w) stratification requires (a)
    the moment hypothesis to actually hold for the constructed M (O06, OPEN
    for K/L), (b) an explicit/effective value for the implicit constant in
    conclusion (4) (also blocked on O06's ineffectiveness finding), and (c)
    resolving the n/d ambiguity in conclusion (3) before any degree bound
    D(C) can be stated with confidence in its dependency set.
  by_case:
    - cases: [case-01, case-02, case-03, case-04, case-05, case-06, case-07,
        case-08, case-09, case-10, case-11, case-12, case-13, case-14]
      status: OPEN (all 14 K/L cases; see obligation-results.yaml O08 rows)
      reason: >-
        Blocked jointly on O06 (moment hypothesis unproved / implicit
        constant ineffective) and, for cases other than the diagonal
        case-03/case-04, on O05 (shared-locus dimension undetermined). The
        SO4/"sulfatic" exceptional-case material (source-digest.md Sec.4.2)
        is flagged in the digest only as ITS OWN speculative structural
        observation for family L's potential rank-2 shared-locus behavior,
        explicitly NOT a fact the paper states about elliptic curves; this
        task treats it the same way -- a pointer for a future audit pass to
        check, not a certified input here.
    - cases: [case-15, case-16]
      status: REFUTED (see obligation-results.yaml O08 rows, and
        counterexamples.yaml)
      reason: >-
        The exact counterexample recorded in moment-certificates.yaml
        (sum |S|^4 ~ q_n^6, violating the required <= B*q_n^5 bound for any
        n-independent B) holds with the failure spread UNIFORMLY across all
        of X (X = E x E is 2-dimensional, and S_F,n(Q,R) = t_F^2*|E(F_(p^n))|
        for every single (Q,R) in X -- t_F^2, not t_F; see
        moment-certificates.yaml's corrected computation -- with no
        dependence on the point at all). Consequently no exceptional set
        Sigma of dimension <=1 can
        confine the failure -- the required off-locus bound
        |S|<=K(C)*sqrt(q_n) fails identically ON ALL OF X, not merely off
        some small Sigma. This is the expected, correct rejection outcome
        for a known-false control per specification.controls.constants.
  sulfatic_oxozonic_pointer_for_family_L: >-
    source-digest.md Sec.4.2 (speculative, digest's own framing, NOT a
    paper claim): if the audit's O05 shared-locus/coinvariant analysis for
    family L ever produces a tensor or fiber product of two independent
    rank-2 SL_2-monodromy objects whose combined monodromy sits inside O_4
    or SO_4, the paper's dedicated "sulfatic"/"oxozonic" exceptional-case
    treatment (Sections 3.5, 8, and the tentatively-numbered "Theorem 1.6"
    with its "c odd" condition) could become relevant. This is recorded here
    as an open pointer for a future audit pass, not evaluated further by
    this task -- doing so would require actually performing the O05
    monodromy computation for family L, which remains OPEN, and would
    require independently confirming "Theorem 1.6"'s numbering and full
    statement, which source-digest.md itself flags as tentative (single,
    unconfirmed fetch pass).
