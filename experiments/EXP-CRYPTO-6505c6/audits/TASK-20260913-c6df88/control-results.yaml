# control-results.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
# Dedicated summary for the two control classes required by
# specification.controls: known_false_cancellation_control (case-15,
# case-16) and matched_nulls (case-07, case-08). Worked FIRST/SECOND per
# case_order, as required.
control_results:
  known_false_cancellation_controls:
    worked_order: 1st and 2nd (case-15 before case-16), per
      specification.obligation_matrix.case_order
    case-15:
      family: C1
      definition: "Constant rank-1 sheaf with trace 1 and full lisse domain
        on P1 (specification.families.C1)."
      required_behavior: "Must expose full-support correlation/exceptional
        behavior and be REJECTED by the cancellation argument
        (specification.controls.constants)."
      actual_result: >-
        REJECTED as required. O06/O07/O08 all REFUTED with an exact
        elementary counterexample (moment-certificates.yaml,
        counterexamples.yaml CTREX-01): the required all-extension 4th
        moment bound fails at scale q_n^6 vs the required O(q_n^5), and the
        failure is full-support (not confined to any dim<=1 exceptional
        set). O09 CERTIFIED: this failure is correctly explained by
        Definition 1.2's irreducibility requirement (trivial monodromy of a
        constant sheaf is reducible, hence outside the gallant class the
        source's cancellation machinery targets).
      classification: CORRECTLY_REJECTED
    case-16:
      family: C2
      definition: "Constant rank-2 direct sum with trace 2 and full lisse
        domain on P1 (specification.families.C2)."
      required_behavior: same as case-15
      actual_result: >-
        REJECTED as required, by the identical elementary argument scaled
        for trace 2 (counterexamples.yaml CTREX-02). O09 CERTIFIED: a
        rank-2 direct sum of trivial representations is manifestly
        decomposable (reducible), doubly disqualified from Definition 1.2's
        irreducibility requirement.
      classification: CORRECTLY_REJECTED
    admission_gate_result: >-
      Both known-false controls are correctly rejected before any
      exceptional-geometry, matched-null, excluded-base-diagnostic or
      main-target case was worked, per case_order and this program's
      null-object-before-belief discipline (docs/inventor-protocol.md).
      This does NOT by itself certify anything about the main target; it
      only confirms the audit's own machinery discriminates correctly on
      objects the source's own irreducibility hypothesis (Definition 1.2)
      excludes.
  matched_nulls:
    worked_order: 5th and 6th in case_order (case-07, case-08), after
      exceptional-geometry (case-03..case-06) and before excluded-base
      diagnostics (case-09..case-14)
    case-07:
      family: K
      definition: "Independently algebraically generic (Q0,R0) in a
        separate symbolic copy of X over the same base
        (specification.symbolic_cases)."
      required_certificate: "Equal lisse rank, translated ramification
        support and local inertia/tame/Swan data between the translated
        pullback and the corresponding generic-main pullback, with derived
        Artin/Swan totals (specification.controls.matched_nulls)."
      actual_result: >-
        OPEN. The required matching certificate cannot be produced because
        family K's own rank/ramification facts are themselves OPEN
        (obligation-results.yaml O01/O04), and the coinvariant-vanishing
        criterion needed to certify "no special stabilizer relation" for
        generic Q0,R0 (Sec.3.2) was not retrieved (shared-constituents.yaml).
      classification_per_spec_rule: >-
        specification.controls.matched_nulls is explicit: "Missing required
        matching certificate means OPEN and overall inconclusive, not N/A."
        This case is therefore recorded OPEN, not
        NOT_APPLICABLE_WITH_CERTIFICATE and not a favorable default.
    case-08:
      family: L
      definition: same structure as case-07, for family L
      required_certificate: same as case-07
      actual_result: OPEN, for the same reasons as case-07, compounded by
        family L's total absence from the cited source.
      classification_per_spec_rule: same rule as case-07; recorded OPEN.
    no_forced_matching_or_favorable_resampling: >-
      Per specification.controls.matched_nulls ("Never force matching to a
      diagonal tensor... NONMATCH or exceptional null is retained without
