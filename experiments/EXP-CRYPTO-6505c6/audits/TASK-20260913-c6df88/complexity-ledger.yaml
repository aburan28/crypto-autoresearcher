# complexity-ledger.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
# Separate ledger fields for rank, Artin/Swan conductor, and embedded-derived
# complexity per family, per specification.main_transfer_target.conductor_separation
# ("none substitutes automatically for another"). Feeds obligation column O04.
complexity_ledger:
  status_field_note: >-
    Free-text detail file, not one of the two frozen 160/400-cell matrices.
    obligation-results.yaml O04 rows use only the six canonical statuses.
  provenance:
    source_spec: experiments/EXP-CRYPTO-6505c6/specification.yaml
    source_digest: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
  family_K:
    rank: {value: null, expected_classical_value: 1, status: OPEN,
      note: "specification.families.K states rank_expected=1 as the AUDIT's
        own prospective expectation, not a certified fact; the cited source
        states no rank for L_chi (source-digest.md Sec.2.1)."}
    artin_conductor: {value: null, status: OPEN}
    swan_conductor: {value: null, status: OPEN}
    embedded_derived_complexity_c_M: {value: null, status: OPEN,
      note: "c(M) is cited by the paper to Sawin's Quantitative Sheaf Theory
        (external reference) and is itself an OUTPUT of the constructed
        complex, not a pre-fixed input (source-digest.md Sec.5, the
        Sec.4.3 finding); it cannot be assigned a value before M is fully
        constructed, which in turn is blocked on O01/O03."}
    operation_costs: {value: null, status: OPEN}
    n_independent_uniform_bound: {value: null, status: OPEN,
      note: "Even once c(M) is computable, Remark 1.2 disclaims polynomial
        or otherwise concretely effective dependency for this paper's
        method (source-digest.md Sec.3.3); see moment-certificates.yaml."}
  family_L:
    rank: {value: null, expected_classical_value: 2, status: OPEN,
      note: "specification.families.L states rank_expected=2 as the AUDIT's
        own prospective expectation; the source contains no content on L at
        all (source-digest.md Sec.2.2)."}
    artin_conductor: {value: null, status: OPEN}
    swan_conductor: {value: null, status: OPEN}
    embedded_derived_complexity_c_M: {value: null, status: OPEN}
    operation_costs: {value: null, status: OPEN}
    n_independent_uniform_bound: {value: null, status: OPEN}
  family_C1:
    rank: {value: 1, status: CERTIFIED, note: "Constant rank-1 sheaf by
      specification.families.C1's own definition; elementary, not
      source-dependent."}
    artin_conductor: {value: 0, status: CERTIFIED, note: "Unramified
      everywhere on P1 by definition of a constant sheaf; elementary."}
    swan_conductor: {value: 0, status: CERTIFIED, note: "Tame everywhere
      (in fact lisse everywhere), Swan conductor 0; elementary."}
    embedded_derived_complexity_c_M: {value: null, status: OPEN,
      note: "c(M) as the paper's own external Sawin-defined invariant is not
        computed here (the paper's own recipe for c(M) was never retrieved,
        source-digest.md Sec.5), but this does not block O04's rank/conductor
        fields above, which are elementary and self-contained."}
    operation_costs: {value: null, status: OPEN,
      note: "No numerical run performed (budget: zero numerical runs); no
        fabricated peak-byte/operation-count figure is recorded."}
    n_independent_uniform_bound: {value: 1, status: CERTIFIED,
      note: "Trace function is the literal constant 1 for every n; trivially
        n-independent."}
  family_C2:
    rank: {value: 2, status: CERTIFIED, note: "Constant rank-2 direct sum by
      specification.families.C2's own definition."}
    artin_conductor: {value: 0, status: CERTIFIED}
    swan_conductor: {value: 0, status: CERTIFIED}
    embedded_derived_complexity_c_M: {value: null, status: OPEN}
    operation_costs: {value: null, status: OPEN}
    n_independent_uniform_bound: {value: 2, status: CERTIFIED,
      note: "Trace function is the literal constant 2 for every n."}
  complexity_C_definition_note: >-
    specification.main_transfer_target.complexity_C requires "a positive
    integer bound, fixed before n, for the exact source embedded-complex
    complexity of X and the correlation complex." Per the Sec.4.3 finding
    (source-digest.md), complexity is intrinsic to the constructed complex
    M ("an output of the algebraic object, not a pre-fixed external
    parameter"), so C cannot be freely chosen in advance of constructing M.
    For K and L, M's construction itself is blocked on O01/O03 (OPEN); C is
    therefore recorded null/OPEN for both, not a fabricated placeholder
    integer. For C1/C2 the correlation complex is degenerate/trivial (see
    moment-certificates.yaml) and no positive C beyond the elementary values
    above is needed to reach a verdict.
  no_free_constants_check: >-
    Per specification.main_transfer_target.no_free_constants, D(C), K(C),
    B(C), weights and all source dependence remain explicit obligations;
    none is assumed polynomial or otherwise effective anywhere in this file.
