# counterexamples.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
# Every exact, checked counterexample recorded anywhere in this bundle.
# Per specification.falsification_criterion, each is scope-limited negative
# evidence for its own named family/base/claim only.
counterexamples:
  entries:
  - id: CTREX-01
    scope:
      case_id: case-15
      family: C1
      obligation_ids: [O06, O07, O08]
    claim_falsified: >-
      specification.main_transfer_target.moment restricted to family C1:
      sum_{(Q,R) in X(F_(p^n))} |S_F,n(Q,R)|^4 <= B(C)*|F_(p^n)|^5 for an
      n-independent B(C).
    derivation: >-
      Per specification.yaml's target_sum definition S_F,n(Q,R) =
      sum_P t_F(f_Q(P))*conj(t_F(f_R(P))): constant trace t_F=1 contributes
      1*conj(1)=1^2=1 at every P regardless of f_Q, f_R, so S_F,n(Q,R) =
      1^2*|E(F_(p^n))| = |E(F_(p^n))| for EVERY (Q,R) in X = E x E,
      independent of Q, R. |X(F_(p^n))| = |E(F_(p^n))|^2 exactly. Hence
      sum_{(Q,R)} |S_F,n(Q,R)|^4 ~ q_n^2 * q_n^4 = q_n^6. The target bound
      requires this <= B*q_n^5; since q_n^6/q_n^5 = q_n -> infinity as
      n grows for any fixed p, no n-independent B(C) exists. Exact,
      elementary, checkable without sheaf theory or the primary source.
    exactness: exact (asymptotic order, not an approximation of an unknown
      quantity -- S_F,n(Q,R) is computed exactly for every (Q,R))
    checked_independently_of_solver: >-
      This is a direct algebraic computation carried out in this audit
      report, not produced by the same machinery being tested; it requires
      no certificate re-verification beyond the arithmetic shown, per
      docs/claims-and-verification.md's requirement that a solve/relation
      claim's certificate be independently checkable (here, elementary
      arithmetic, independently reproducible by inspection).
    consequence: >-
      O06 REFUTED at this scope. Per specification.falsification_criterion,
      this is scope-limited negative evidence for family C1 ONLY; it says
      nothing about family K, L, C2, or the main target.
    expected_or_anomalous: >-
      EXPECTED. Per specification.controls.constants, C1 "must expose
      full-support correlation/exceptional behavior and be rejected by the
      cancellation argument" -- this counterexample IS that expected
      rejection, not an anomaly requiring further investigation.
  - id: CTREX-02
    scope:
      case_id: case-16
      family: C2
      obligation_ids: [O06, O07, O08]
    claim_falsified: same target as CTREX-01, restricted to family C2
    derivation: >-
      Identical argument with constant trace t_F=2: per specification.yaml's
      target_sum definition S_F,n(Q,R) = sum_P t_F(f_Q(P))*conj(t_F(f_R(P))),
      a real constant t_F=c contributes c*conj(c)=c^2 at every P regardless
      of what f_Q, f_R compute (t_F ignores its argument entirely), so
      S_F,n(Q,R) = c^2*|E(F_(p^n))| = 4*|E(F_(p^n))| for every (Q,R) --
      c^2, not c. [Corrected during Coordinator independent verification,
      TASK-20260913-627c97: the original draft wrote
      S_F,n(Q,R)=2*|E(F_(p^n))|, i.e. c*q_n instead of c^2*q_n. CTREX-01's
      c=1 example did not expose this since 1^2=1.] Hence
      sum_{(Q,R)} |S_F,n(Q,R)|^4 ~ q_n^2*(4*q_n)^4 = 256*q_n^6, again
      violating <= B*q_n^5 for any n-independent B.
    exactness: exact (asymptotic order)
    checked_independently_of_solver: same basis as CTREX-01
    consequence: O06 REFUTED at this scope; family C2 only.
    expected_or_anomalous: EXPECTED, same rule as CTREX-01.
  no_counterexample_found_for_main_families: >-
    No exact counterexample to the K or L main-target claims is recorded
    anywhere in this bundle. Every K/L cell that is not CERTIFIED,
    NOT_APPLICABLE_WITH_CERTIFICATE, or the diagonal-case O05
    full-overlap CERTIFIED result is OPEN, not REFUTED -- consistent with
    specification.falsification_criterion's rule that "absence of proof
    cannot refute the main target" and this task's own instruction not to
    manufacture a counterexample where none was found.
