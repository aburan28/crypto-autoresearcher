# normalization-and-weights.yaml -- EXP-CRYPTO-6505c6 audit TASK-20260913-c6df88
normalization_and_weights:
  status_field_note: >-
    This file is supporting detail, not one of the two frozen 160/400-cell
    matrices; its "status" values are free-text annotations for readability
    and are NOT obligation-cell verdicts. Every corresponding
    obligation-results.yaml cell uses only the six statuses from
    specification.obligation_matrix.statuses; where this file says
    CERTIFIED_AS_GENERIC_CONVENTION or CERTIFIED_AS_STRUCTURAL_MATCH it
    means "the generic/structural sub-claim is settled" while the full
    obligation cell it feeds remains OPEN, as stated explicitly in each entry.
  provenance:
    source_spec: experiments/EXP-CRYPTO-6505c6/specification.yaml (families, addition_charts)
    source_digest: coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
  family_K:
    specification_normalization: "Quadratic character on nonzero arguments,
      zero at the declared boundary (0, infinity)."
    source_content: >-
      NONE beyond bare L_chi notation (source-digest.md Sec.2.1). The paper
      never specializes chi to quadratic and states no rank/purity/
      trace-normalization/zero-extension fact for it.
    status: OPEN
    missing_prerequisite: >-
      A source-matched or independently certified classical reference for
      L_chi's normalization when chi is quadratic (rank 1, purity weight 0,
      zero-extension at {0, infinity}, compatible quadratic-norm characters
      under base change). Not supplied by the cited primary source; not
      independently derived by this task (constraint: no invented
      derivation beyond what the digest reports).
  family_L:
    specification_normalization: "Fix sqrt(p) mapping to the positive real
      root; at extension n use p^(-n/2) times the H1 Frobenius trace, with
      one consistent geometric-Frobenius convention."
    source_content: NONE -- family L does not appear in the cited primary
      source at all (source-digest.md Sec.2.2, dedicated negative search).
    status: OPEN
    missing_prerequisite: The entire normalization convention for R^1 of the
      Legendre family requires an independent source or derivation; this
      paper supplies zero content to check it against.
  duality_and_conjugate_trace:
    source_quote: >-
      "[QUOTE, Sec.2]: The dual of F is defined to be the sheaf
      F^∨ = Hom-bar(F, Qbar_l); it is lisse on U and coincides there with
      the lisse sheaf associated to the contragredient of the representation
      corresponding to F. In particular, if F is pure of weight 0 on U, then
      the trace function of F^∨ on U is (under iota) the complex conjugate
      of the trace function of F."
    conditional_hypothesis: purity of weight 0 on the relevant open set U.
    status: OPEN
    missing_prerequisite: >-
      specification.correlation.candidate_complex requires F^dagger to have
      "the conjugate trace under the chosen normalization"; this generic
      fact discharges that requirement ONLY if the specific F used (K or L)
      is established pure of weight 0 on the domain actually used, which is
      blocked on family_K/family_L above being OPEN.
  zero_extension_convention:
    source_quote: >-
      "[QUOTE, Sec.2]: ...the arithmetic (resp. geometric) monodromy group
      of F coincides with that of the sheaf j_!j*F. This allows us to assume
      in many proofs that F is the extension by zero of a lisse sheaf on
      some dense open subset of X."
    status: CERTIFIED_AS_GENERIC_CONVENTION
    note: >-
      This matches specification.correlation.candidate_complex's own use of
      j_!F as a general working assumption, but it is a standing convention
      for the paper's OWN proofs, not a definition transferable automatically
      to the elliptic-addition setting or to a specific boundary set for K/L.
      Recorded here as CERTIFIED at the generic-convention level only; the
      corresponding obligation-results.yaml cells (O01/O02/O03) remain OPEN
      because the family-specific boundary content is still missing.
  mixed_integral_weights_convention:
    source_quote: >-
      Theorem 2.4 itself requires M "mixed of integral weights" (source-digest.md
      Sec.3.1); "gallant and light" (Definition 1.2) additionally requires
      "mixed of integral weights <=0 and pure of weight 0 on a dense open subset."
    status: OPEN
    missing_prerequisite: Whether the specific correlation complex
      constructed for K or L satisfies "mixed of integral weights" depends
      on the same missing family-specific weight data.
  quantifier_order:
    specification_text: >-
      "For every allowed p and base instance, fix sheaf/normalization and
      n-independent complexity data before requiring the target for every
      n>=1 and all (Q,R) in E(F_(p^n))^2."
    source_match: >-
      source-digest.md Sec.3.1: Theorem 2.4's embedding-before-moment-
      quantifier structure matches this quantifier order exactly (embedding
      and d fixed before the moment hypothesis over all n>=1).
    status: CERTIFIED_AS_STRUCTURAL_MATCH
    note: The QUANTIFIER STRUCTURE matches; this does not certify that any
      specific instance satisfies the moment hypothesis (see O06, OPEN).
  n_vs_d_ambiguity:
    location: Theorem 2.4 conclusion (3)
    quote_as_transcribed: >-
      "[QUOTE]: Each X^(w) is a union of subvarieties of total degree
      bounded only in terms of n and c(M)."
    disclosed_gap: >-
      Two independent WebFetch passes both rendered "n" here; a bound
      depending on the extension index n (rather than the fixed ambient
      dimension d) would be a materially different and stronger/stranger
      claim. The retrieving tool itself flagged this as looking like a
      possible transcription defect but could not resolve it, and this task
      has no direct-access tool to check the raw HTML/PDF either.
    status: UNRESOLVED
    binding_rule: >-
      Per the handoff: this must be resolved by a human or tool with direct
      source access before any O04/O08 cell depending on conclusion (3)'s
      exact dependency set is marked CERTIFIED. This task does NOT silently
      pick "d" because it looks more sensible -- that would be inventing
      text. All O08 cells in obligation-results.yaml remain OPEN and cite
      this ambiguity explicitly where relevant (see stratification-application.yaml).
  addition_chart_normalization:
    source: specification.addition_charts (self-contained, not source-dependent)
    status: CERTIFIED_INTERNALLY
    note: >-
      The five-tag precedence order, boundary semantics (P=S=O belongs only
      to P_identity; affine two-torsion belongs to inverse, not tangent) and
      the 25-ordered-pair convention are given directly and completely by
      the frozen specification text; disjointness/exhaustiveness of the five
      cases for a fixed (P,S) pair is elementary Weierstrass addition-law
      case analysis, independent of the primary source and independent of
      family K/L/C1/C2. This CERTIFIED status covers only the STRUCTURAL
      exhaustiveness/disjointness of the five-tag classification itself, not
      the family-specific zero-boundary matching (which remains OPEN; see
      obligation-results.yaml O02).
