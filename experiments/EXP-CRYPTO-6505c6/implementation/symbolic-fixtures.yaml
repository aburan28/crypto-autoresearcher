symbolic_fixtures:
  provenance:
    experiment_id: EXP-CRYPTO-6505c6
    specification_status: approved
    scientific_execution_authorized: false
    note: >-
      Structural placeholders only. No case listed below is claimed proved,
      refuted, certified, or otherwise resolved. Each entry names what the
      case IS (family, base stratum, parameter locus, role, chart-pair key
      set), not what has been shown about it. All mathematical content
      (statements, proofs, certificates, verdicts) is explicitly out of
      scope for this preparation task (maximum_runs: 0).
  frozen_symbolic_domain:
    base_curve: "E/F_p: y^2 = x^3 + a*x + b, p >= 5 prime, Delta = 4*a^3 + 27*b^2 != 0; O is the projective identity."
    main_base_condition: "b != 0 and c1 = 1 + a + b != 0 (fixed prospectively for both nonconstant families)"
    degeneration_strata:
      D0: "b = 0, c1 != 0, Delta != 0"
      D1: "b != 0, c1 = 0, Delta != 0"
      D01: "b = 0, c1 = 0, Delta != 0"
    quantifier_order: >-
      Fix p, E, family, embedding/normalization and an n-independent
      certified complexity bound C first; then require the target for
      every n >= 1 and all (Q,R) in E(F_(p^n))^2. No fill-in of this
      quantifier order is performed here.
    coefficient_field: "Qbar_2 with a fixed embedding into C; p is odd."
    embedding: "Projective Weierstrass E in P2, and E_Q x E_R in P8 by Segre; degree/complexity conventions remain a source-matched audit obligation, not asserted here."
  families:
    K:
      kind: main_nonconstant
      definition: "Quadratic Kummer sheaf L_chi on Gm, extended by zero at 0 and infinity; compatible quadratic norm characters over finite extensions."
      rank_expected: 1
      trace_declaration: "Quadratic character on nonzero arguments, zero at the declared boundary."
      resolved_status: unresolved
      source_boundary_obligations:
        - definition
        - purity
        - trace_normalization
        - pullback_behavior
    L:
      kind: main_nonconstant
      definition: "R1 of the Legendre family v^2 = z*(z-1)*(z-u) over u != 0,1,infinity, normalized by a compatible unramified Weil twist."
      rank_expected: 2
      normalization_declaration: "Fix sqrt(p) mapping to the positive real root; at extension n use p^(-n/2) times the H1 Frobenius trace, one consistent geometric-Frobenius convention."
      boundary_declaration: "Extend by zero at 0, 1, infinity."
      resolved_status: unresolved
      source_boundary_obligations:
        - rank
        - lissity
        - purity
        - geometric_constituents
        - gallantry
        - conductor_values
    C1:
      kind: constant_control
      definition: "Constant rank-1 sheaf with trace 1 and full lisse domain on P1; negative cancellation control."
      rank_expected: 1
      resolved_status: unresolved
    C2:
      kind: constant_control
      definition: "Constant rank-2 direct sum with trace 2 and full lisse domain on P1; negative cancellation control."
      rank_expected: 2
      resolved_status: unresolved
  bases:
    main:
      condition_ref: main_base_condition
      note: "Excludes both named branch coincidences from the main theorem target; exclusion itself is not asserted as a proved obstruction."
    D0:
      condition_ref: degeneration_strata.D0
      role: excluded_base_diagnostic
    D1:
      condition_ref: degeneration_strata.D1
      role: excluded_base_diagnostic
    D01:
      condition_ref: degeneration_strata.D01
      role: excluded_base_diagnostic
  addition_chart_tags:
    order: [P_identity, S_identity, secant, tangent, inverse]
    definitions:
      P_identity: {condition: "P = O", value: S}
      S_identity: {condition: "P != O and S = O", value: P}
      secant: {condition: "P,S affine and xP != xS", slope: "(yS - yP)/(xS - xP)", x_sum: "slope^2 - xP - xS"}
      tangent: {condition: "P,S affine, xP = xS, yP = yS, 2*yP != 0", slope: "(3*xP^2 + a)/(2*yP)", x_sum: "slope^2 - 2*xP"}
      inverse: {condition: "P,S affine, xP = xS, yS = -yP, after prior cases", value: O}
    boundary_semantics: >-
      P=S=O belongs only to P_identity; affine two-torsion belongs to
      inverse, not tangent. Disjointness/exhaustiveness and compatibility
      with global addition are audit obligations, not verified here.
    ordered_pair_keys: >-
      Cartesian product of the five tags, left tag applied to (P,Q), right
      tag applied to (P,R): 5 x 5 = 25 keys per case, identical key set for
      every case (structural, not case-dependent). Listed once below and
      referenced by each case via chart_pair_key_set: standard_25.
  chart_pair_key_sets:
    standard_25:
      - [P_identity, P_identity]
      - [P_identity, S_identity]
      - [P_identity, secant]
      - [P_identity, tangent]
      - [P_identity, inverse]
      - [S_identity, P_identity]
      - [S_identity, S_identity]
      - [S_identity, secant]
      - [S_identity, tangent]
      - [S_identity, inverse]
      - [secant, P_identity]
      - [secant, S_identity]
      - [secant, secant]
      - [secant, tangent]
      - [secant, inverse]
      - [tangent, P_identity]
      - [tangent, S_identity]
      - [tangent, secant]
      - [tangent, tangent]
      - [tangent, inverse]
      - [inverse, P_identity]
      - [inverse, S_identity]
      - [inverse, secant]
      - [inverse, tangent]
      - [inverse, inverse]
  cases:
    - {id: case-01, family: K, base: main, parameter_scope: "Full X including exceptional parameters.", role: main_target, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-02, family: L, base: main, parameter_scope: "Full X including exceptional parameters.", role: main_target, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-03, family: K, base: main, parameter_scope: "Diagonal Q=R.", role: exceptional_geometry, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-04, family: L, base: main, parameter_scope: "Diagonal Q=R.", role: exceptional_geometry, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-05, family: K, base: main, parameter_scope: "Off-diagonal shared-constituent/translation-stabilizer locus; size unknown.", role: exceptional_geometry, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-06, family: L, base: main, parameter_scope: "Off-diagonal shared-constituent/translation-stabilizer locus; size unknown.", role: exceptional_geometry, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-07, family: K, base: main, parameter_scope: "Independently algebraically generic (Q0,R0) in a separate symbolic copy of X over the same base.", role: matched_null, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-08, family: L, base: main, parameter_scope: "Independently algebraically generic (Q0,R0) in a separate symbolic copy of X over the same base.", role: matched_null, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-09, family: K, base: D0, parameter_scope: "Full X.", role: excluded_base_diagnostic, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-10, family: L, base: D0, parameter_scope: "Full X.", role: excluded_base_diagnostic, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-11, family: K, base: D1, parameter_scope: "Full X.", role: excluded_base_diagnostic, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-12, family: L, base: D1, parameter_scope: "Full X.", role: excluded_base_diagnostic, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-13, family: K, base: D01, parameter_scope: "Full X.", role: excluded_base_diagnostic, chart_pair_key_set: standard_25, resolved_status: unresolved}
    - {id: case-14, family: L, base: D01, parameter_scope: "Full X.", role: excluded_base_diagnostic, chart_pair_key_set: standard_25, resolved_status: unresolved}
