  # Section 2: future primary reading/proof obligations. None of these is
  # discharged by this preparation task; each is an explicit open item for the
  # future proof-producing audit and its independent reviewer.
  future_reading_and_proof_obligations:
    - id: FRO-01
      topic: sheaves
      obligation: >-
        Independently open and re-read the source's definitions of the
        Kummer character sheaf L_chi and the Legendre-family R^1 sheaf,
