        match specification.families.K/.L exactly, not by paraphrase.
      status: OPEN
      responsible: future proof-producing audit + independent semantic reviewer
    - id: FRO-02
      topic: ramification
      obligation: >-
        Determine local inertia/tame/Swan data for both families under the
        translated addition-pullback maps f_Q, f_R, and the derived Artin/Swan
        totals required by specification.controls.matched_nulls; no ramification
        claim is made or assumed by this preparation package.
      status: OPEN
      responsible: future proof-producing audit
    - id: FRO-03
      topic: weights
      obligation: >-
        Establish the mixed weight/purity bookkeeping for the candidate
        complex (unshifted R pi_! of f_Q^*(j_!F) tensor-derived with
        f_R^*(j_!(F^dagger))), including cohomological shifts/signs, per
        specification.correlation.required_verifications.
      status: OPEN
      responsible: future proof-producing audit
    - id: FRO-04
      topic: trace_formula
      obligation: >-
        Verify the Grothendieck trace formula application connecting the
        correlation sum S_F,n(Q,R) to the pushforward trace, including the
        dagger/dual identification for F^dagger's conjugate trace, against the
        source's own trace-formula conventions (not assumed transferable).
      status: OPEN
      responsible: future proof-producing audit
    - id: FRO-05
      topic: effectiveness
      obligation: >-
        Independently open Theorem 2.4 / Corollary 3.14 and Section 9.10 of
        the primary source in full (beyond the parent's already-read
        statement/remark level) to determine whether B(C), D(C), K(C) are
        given as explicit computable functions there, or only as ineffective
        existence statements; a finite observed maximum or n-dependent
        constant does not discharge specification.main_transfer_target.effective_B.
      status: OPEN
      responsible: future proof-producing audit + independent semantic reviewer
    - id: FRO-06
      topic: hypothesis_matching
      obligation: >-
        Produce source-hypothesis-matrix.yaml: a hypothesis-by-hypothesis match
        of Theorem 2.4's stated conditions against the embedded X = E_Q x E_R
        and its correlation complex, per obligation column O07. No
        monomial-to-addition identification may be asserted without this
        match.
      status: OPEN
      responsible: future proof-producing audit

  citation_discipline: >-
    No entry in future_reading_and_proof_obligations names a source claim as
    settled. Every future obligation cites the exact source location to be
    opened and states OPEN, not a provenance or verified_by value, because no
    reading has yet occurred against it. This avoids the templates/
    research-records.md prohibition on an unsupported supporting citation:
    nothing here is asserted as retrieved, kb, or internal beyond what the
    parent actually read and recorded.
