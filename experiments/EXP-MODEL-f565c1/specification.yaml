experiment:
  id: EXP-MODEL-f565c1
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-a575c8
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: A MODEL IS A PLACEMENT OF FOUR BRANCH POINTS PLUS A CHOICE OF CENTRE - the degree-2 coordinates
    on E are indexed by a point Q (the involution P -> Q - P) and a Moebius map, so "curve model"
    resolves into two measurable degrees of freedom; OFF-CENTRE models such as the Jacobi quartic
    pay an exact factor 2 in summation degree (predicted 4, not 2, at m = 3) unless the target is
    shifted, and among CENTRED models the two sparsity sources - O at infinity (13 monomials, short
    Weierstrass) and diagonalised rational 2-torsion (at most 14 monomials but only about 8 free coefficients,
    twisted Edwards / Legendre) - are PROVABLY INCOMPATIBLE, so the lane's one remaining question
    is which of them wins on a measured cost
  status: draft
  objective: "(A) THE CLASSIFICATION THAT REPLACES THE LIST OF MODEL NAMES. Every degree-2 map f :\
    \ E -> P^1 arises as the quotient by an involution of the form iota_Q(P) = Q - P for some Q in\
    \ E, followed by a Moebius parametrisation of the quotient line. (Degree-2 maps correspond to\
    \ degree-2 linear systems, i.e. to divisor classes of degree 2, i.e. to points of E.) So the model\
    \ space of L11 is\n  {degree-2 coordinates} = E(F_p) x PGL_2(F_p),\na CENTRE Q and a PARAMETRISATION.\
    \ The named models are points of this space:\n  Q = O, O sent to infinity                    \
    \   -> short Weierstrass x\n  Q = O, a 2-torsion point at 0 and O at infinity -> Montgomery x\n\
    \  Q = O, O at 1 and a 2-torsion point at -1       -> twisted Edwards y\n  Q = O, all four branch\
    \ points rational at 0,1,lambda,infinity -> Legendre x\n  Q = T (a 2-torsion point), NOT centred\
    \ at O      -> Jacobi quartic x\nWriting the lane this way turns \"try more models\" into \"sweep\
    \ two explicit parameters\", which is the only version of the lane that can be exhausted.\n(B)\
    \ THE CENTRING RESULT, WHICH IS A FACTOR 2 AND IS COUNTERINTUITIVE. Let f = x_R(P) := x(P - R),\
    \ the quotient by iota_Q with Q = 2R. Its deck group is {identity, iota_Q}, which lies inside\
    \ Aut(E, O) ONLY when Q = O. Hence by the deck-group law of IDEA-20260807-dadcd2, g = 2 for the\
    \ centred coordinate and g = 1 for every off-centre one. Concretely at m = 3, for the relation\
    \ P_1 + P_2 + P_3 = O: fix t_1, t_2, write P_i = R + eps_i Q_i, then\n  t_3 = x(P_3 - R) = x(3R\
    \ + eps_1 Q_1 + eps_2 Q_2),\nand the four sign patterns give FOUR generically distinct values\
    \ because the global sign flip sends 3R + ... to -3R - ..., whose x-value differs from x(3R +\
    \ ...) unless 3R = O. So\n  deg_{t_i} S_3^{x_R} = 4 for generic R, versus 2 for R = O.\nTHE OFF-CENTRE\
    \ COORDINATE IS EXACTLY TWICE AS EXPENSIVE. And the escape is exact and worth stating because\
    \ it is the null used elsewhere in this batch: the DECOMPOSITION problem does not ask for a sum\
    \ equal to O, it asks for a sum equal to a target; substituting P_i = R + P_i' turns \"sum P_i\
    \ = target\" into \"sum P_i' = target - mR\", which is the ordinary centred system. So the factor\
    \ 2 is recovered in full by RETARGETING, and the honest statement is: centring is a free choice\
    \ that costs a factor 2 if you forget to shift the target, and nothing if you remember. The Jacobi\
    \ quartic is the standard model that sits off-centre, because its coordinate x is the quotient\
    \ by P -> T - P (its deck transformation is (x, y) -> (x, -y), which has four fixed points at\
    \ the roots of the quartic and is therefore an involution of the form Q - P, whereas Jacobi-quartic\
    \ negation is (x, y) -> (-x, y)).\n(C) THE BRANCH LOCUS, WHICH IS WHAT \"MODEL\" REALLY MEANS\
    \ ONCE THE CENTRE IS FIXED AT O. The quotient E -> E/{+-1} = P^1 is ramified at exactly four points\
    \ - O and the three 2-torsion points - by Riemann-Hurwitz. A centred model is therefore a choice\
    \ of WHERE THOSE FOUR POINTS SIT in P^1, i.e. an element of PGL_2 modulo the stabiliser. The cross-ratio\
    \ of the four points is the Legendre parameter lambda, which is an invariant OF THE CURVE and\
    \ cannot be changed; everything else is free. So:\n  the model space is 3-dimensional (PGL_2)\
    \ and the curve contributes one\n  invariant (lambda) that no model change can move.\nThat is\
    \ the exact sense in which \"the model changes and the curve does not\".\n(D) THE TWO SPARSITY\
    \ SOURCES AND THEIR INCOMPATIBILITY, WHICH IS THE ONE GENUINELY OPEN QUESTION LEFT IN THE LANE.\n\
    \  SOURCE 1 - PUT O AT INFINITY. Short Weierstrass does this, and the resulting\n  S_3 has exactly\
    \ 13 of the 27 monomials of multidegree at most (2,2,2)\n  (hand-expanded in IDEA-20260807-e6d79e).\
    \ The sparsity comes from the standard\n  normalisation, not from any curve structure, and it\
    \ is available on EVERY\n  curve including prime-order ones.\n  SOURCE 2 - DIAGONALISE A RATIONAL\
    \ 2-TORSION INVOLUTION. A rational 2-torsion\n  point T induces an involution iota_T on the Kummer\
    \ line; choosing the\n  coordinate so that its two fixed points go to 0 and infinity makes it\n\
    \  t -> -t, and S_3 becomes supported on the 14 even-total-degree monomials\n  (twisted Edwards\
    \ y is exactly this choice - IDEA-20260807-78eafe). If E has\n  FULL rational 2-torsion (Legendre\
    \ form with lambda rational, cofactor at\n  least 4), a SECOND commuting involution acts and imposes\
    \ a palindromic\n  relation within those 14, leaving about 8 independent coefficients.\n  THE\
    \ INCOMPATIBILITY. Source 1 requires the branch point O at infinity. Source\n  2 requires a FIXED\
    \ POINT OF iota_T at infinity. The fixed points of iota_T on\n  the Kummer line are NOT branch\
    \ points (they are the images of the points P\n  with P + T = -P, i.e. 2P = -T, which are 4-torsion-type\
    \ points, not\n  2-torsion). So infinity cannot simultaneously be O and a fixed point of\n  iota_T:\
    \ THE TWO NORMALISATIONS ARE MUTUALLY EXCLUSIVE. A model gets one or\n  the other, never both.\n\
    \  THE QUESTION, THEREFORE: 13 monomials with no symmetry, or at most 14\n  monomials with a Klein-four\
    \ symmetry group acting? The first is smaller; the\n  second is structured. Which produces the\
    \ lower measured cost is NOT decidable\n  from the counts and IS the experiment.\n\n(E) THE OPTIMISATION\
    \ THAT MAKES THIS A SEARCH RATHER THAN A COMPARISON. Because the model space is explicitly E(F_p)\
    \ x PGL_2(F_p), one can ask for the MINIMUM of a cost functional over it, rather than comparing\
    \ five named points. At toy scale this is a direct search: sample thousands of Moebius maps, compute\
    \ the support size of the reparametrised S_3 for each, and report the empirical minimum and the\
    \ argmin. PREDICTED: the minimum over the whole 3-parameter family is 13, attained on the PGL_2-orbit\
    \ of the short Weierstrass normalisation, i.e. NO model beats short Weierstrass on support. If\
    \ the search finds a coordinate with support strictly below 13, that is a genuine discovery, it\
    \ is cheap to find, and nobody in this program has looked.\n(F) THE THREE OUTCOMES.\n  OUTCOME\
    \ 1 - the minimum support over PGL_2 is 13 and short Weierstrass\n    attains it. Then L11's support\
    \ question is CLOSED by exhaustion over the\n    model space, which is a much stronger closure\
    \ than comparing five names.\n  OUTCOME 2 - some coordinate achieves support below 13. Then the\
    \ lane has\n    found a model nobody has named, the argmin identifies it, and the follow-on\n\
    \    is to recompute the BKK constants of KN-FIND-2a8b7e / KN-FIND-c7d31e there.\n  OUTCOME 3\
    \ - support ties but the symmetry-carrying coordinates measure\n    cheaper after the null battery.\
    \ Then the winning quantity is the SYMMETRY\n    GROUP, not the support, which is the Faugere-Gaudry-Huot-Renault\
    \ mechanism\n    (KN-LIT-004) confirmed in a new coordinate and quantified against a\n    matched-support\
    \ control that their paper did not run."
  resource_label: R2 (curve equation and model), with R1 for the coordinate values.
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE. The resource is R2: the choice of coordinate changes the ideal
    and its coefficient ring, which the generic-group simulator of KN-FIND-b7e091 cannot produce -
    it answers group and equality queries and has no access to the monomial support of a polynomial
    over F_p. H-ENDO-001 does not apply, since no endomorphism is applied to points of G. The prestated
    ceiling is the deck-group law: no point of the model space can change the per-variable degree
    away from 2^(m-2), so the admissible resource can purchase support and symmetry only, and Source
    2 additionally requires rational 2-torsion, which a prime-order curve does not have.'
  reachability_gate: 'TRIVIAL, AND STATED EXPLICITLY RATHER THAN LEFT BLANK. T5 (DECOMPOSITION.md
    section 3) charges about p^(1/4) for reaching a SPECIFIED curve in an isogeny class; this record
    reaches no curve. Both coordinates of the model space are free to sample: a centre Q is one point
    of E(F_p), drawn in O(1); a parametrisation is one element of PGL_2(F_p), drawn from four field
    elements. So the entire 3-plus-1-dimensional model space is reachable uniformly at O(1) cost per
    sample with probability 1 - which is what makes the OPTIMISATION in (E) meaningful at all, and
    is the sharpest contrast with L1 and L2, where the corresponding "sweep the family" move is blocked
    by exactly this gate. The one thing that is NOT free is model EXISTENCE for Source 2: a rational
    2-torsion point either exists (cofactor at least 2) or does not, decided by the curve''s group
    order at zero cost and unobtainable at any cost when absent. That is arithmetic, not search, and
    it is recorded here so it is not mistaken for a reachability cost.'
  inputs:
    procedure: 'STAGE 0 (zero compute, GATE): read Cheng-Kodera-Miyaji 2019 and the FGHR 2014 body.
      A hit on (B) or (D) reclassifies this record. STAGE 1 (minutes, AND IT IS THE CHEAPEST SURPRISING
      TEST IN THE BATCH): the centring measurement - 20 random R, per-variable degree of S_3 for the
      O-relation, predicted 4; then retargeted, predicted 2. STAGE 2 (minutes): the Jacobi quartic
      construction and its deck-transformation fibre check. STAGE 3 (minutes): branch-locus extraction
      and cross-ratio comparison across all models of one curve. STAGE 4 (minutes): the incompatibility
      check - fixed points of iota_T versus the image of O. STAGE 5 (an hour): the 10000-sample PGL_2
      support sweep with the distribution, minimum and argmin, on a cofactor-4 curve and on a prime-order
      curve. STAGE 6 (hours): the head-to-head at matched support using the panel of IDEA-20260807-1354d8
      and the null battery of IDEA-20260807-4fc635.'
    mechanism: 'STEP 1 - THE CENTRING MEASUREMENT, WHICH IS CHEAP AND SURPRISING. On one toy curve,
      build the coordinate x_R(P) = x(P - R) for 20 random R and compute the per-variable degree of
      the reduced S_3 for the relation P_1 + P_2 + P_3 = O. PREDICTED: 4 for every R with 3R != O,
      and 2 for R = O. Then repeat with the RETARGETED system (sum P_i'' = target - 3R) and confirm
      the degree returns to 2 and every metric matches the baseline exactly. This is simultaneously
      the proposal''s first result and the calibration of NULL-3 in IDEA-20260807-4fc635. STEP 2 -
      THE JACOBI QUARTIC AS THE NAMED OFF-CENTRE MODEL. Build a Jacobi quartic y^2 = x^4 + 2 delta
      x^2 + 1 with identity (0, 1) and negation (x, y) -> (-x, y). Verify by fibre enumeration that
      the deck transformation of the coordinate x is (x, y) -> (x, -y) and that it has four fixed
      points at the roots of the quartic - hence that x is NOT the negation quotient. PREDICTED per-variable
      degree of S_3 in x for the O-relation: 4. This is the specific checkable degree for the fourth
      named model and it is the one prediction in this batch that is likely to surprise a reader.
      STEP 3 - THE BRANCH LOCUS EXTRACTION. For each model in the lane''s set, compute the images
      of O and the three 2-torsion points under the coordinate, and the cross-ratio. PREDICTED: cross-ratio
      identical across all models of the same curve (it is the curve''s lambda); placements different.
      This is a direct verification that the model space is PGL_2 and the curve contributes one number.
      STEP 4 - THE INCOMPATIBILITY CHECK. On a curve with a rational 2-torsion point T, compute the
      fixed points of iota_T on the Kummer line and confirm that neither is the image of O. That is
      the whole proof of (D) and it is a two-point computation. STEP 5 - THE PGL_2 SUPPORT SEARCH.
      Sample 10000 random Moebius maps, compute the support size of the reparametrised S_3 for each,
      and report the distribution, the minimum, and the argmin. Then do a local search from the argmin.
      PREDICTED: minimum exactly 13, attained on the short Weierstrass orbit; the modal value 27;
      the even-parity coordinates at 14. STEP 6 - THE HEAD-TO-HEAD AT MATCHED SUPPORT. Compare the
      short Weierstrass coordinate (13 monomials, trivial symmetry group) against the diagonalised
      2-torsion coordinate (at most 14 monomials, Klein-four symmetry) on the same curve, same points,
      same factor base, using the full panel of IDEA-20260807-1354d8 and the null battery of IDEA-20260807-4fc635.
      This is the only experiment in the lane that could show a model beating short Weierstrass, and
      the counts alone do not predict the winner. STEP 7 - THE PRIME-ORDER SCOPE STATEMENT. Repeat
      Step 5 on a PRIME-ORDER curve, where Source 2 is unavailable. PREDICTED: the minimum is still
      13 and the even-parity coordinates do not exist, so the search returns short Weierstrass. That
      is the sentence the lane owes about cryptographic curves and it must be measured rather than
      asserted.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - R = O as the centred baseline within Stage 1
  - retargeted shifted system, predicted to match the baseline exactly
  - a curve with NO rational 2-torsion (Source 2 must be absent)
  - a curve with rational 2-torsion but IRRATIONAL iota_T fixed points, where the symmetry exists
    but is not diagonalisable over F_p
  - the random-Moebius reference distribution from IDEA-20260807-4fc635
  - a deliberately wrong branch-locus computation (three points instead of four), which the cross-ratio
    check must reject
  - 'NULL OBJECT (from the proposal): MANDATORY AND OF TWO KINDS. NEGATIVE NULL - the random-Moebius
    battery of IDEA-20260807-4fc635 supplies the reference distribution for the support search in
    Step 5; the named models are only interesting where they sit in the TAIL of that distribution,
    and a named model whose support equals the modal random value (27) carries no information. DECAY
    PARAMETER: the number of randomised variables r, 0 to m; the minimum support over the sample must
    not fall below 13 as r grows, and if it does the claimed extremum is wrong. POSITIVE NULL - a
    curve with FULL rational 2-torsion versus a curve with NONE, both swept over the same 10000 Moebius
    maps. The even-parity coordinates must exist in the first sweep and be ABSENT from the second;
    if 14-monomial coordinates appear on a curve with no rational 2-torsion, the parity structure
    is not coming from the torsion and every symmetry claim in this batch is misattributed. SECOND
    POSITIVE NULL - the centring measurement of Step 1, whose predicted answer is an exact 4 versus
    2 and which therefore validates that the pipeline can detect a factor-2 degree change at all.'
  independent_variables: []
  metrics:
    primary:
    - per-variable degree per centre R, before and after retargeting
    - deck-transformation fibre check output for the Jacobi quartic
    - branch-locus placement and cross-ratio per model
    - support size distribution over 10000 samples with min, mode, argmin
    secondary:
    - symmetry group order per sampled coordinate
    - full panel metrics for the head-to-head, with null distributions
    - explicit statement of sampled-minimum versus true-minimum in every report
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-variable degree of the reduced S_3 for the O-relation in the shifted coordinate
      x_R, over 20 random R
    formula: EXACTLY 4 for every R with 3R != O, and EXACTLY 2 for R = O. Zero tolerance. A uniform
      2 would falsify the centring result (B).
    source: pre-registered in IDEA-20260807-a575c8 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SAMPLED VERSUS TRUE MINIMUM. 10000 samples from a group of size about 2^48 at 16 bits is a vanishing
    fraction; the sweep bounds the minimum from above and nothing more. Reporting the sampled minimum
    as the minimum is the most likely overclaim available here and is pre-empted in every prediction.
  - RATIONALITY OF THE FIXED POINTS. The symmetry can exist while the diagonalising coordinate does
    not exist over F_p. This is a separate control curve, not a footnote.
  - CENTRING VERSUS RETARGETING. The factor 2 in (B) is entirely an artifact of which relation is
    being encoded, and presenting it as a cost of the Jacobi quartic without the retargeting caveat
    would be exactly the kind of framing-dependent claim this program's rule 4 forbids.
  - MODEL EXISTENCE. Source 2 needs cofactor at least 2 (or 4 for the full Klein group), so every
    measurement of it is on a non-cryptographic curve, and Stage 7's prime-order sweep is the only
    arm whose scope reaches them.
  - Accidental coefficient vanishing at 16 bits inflates sparsity and would contaminate the argmin.
    The sweep must be repeated over five primes and an argmin that does not recur across primes must
    be discarded.
  - CROSS-RATIO ORDERING gives six values for four unordered points; comparisons must use the j-invariant-style
    symmetric function, not a raw cross-ratio.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 4 for every R with 3R != O, and EXACTLY 2 for R = O. Zero tolerance.
    A uniform 2 would falsify the centring result (B).
  falsification_criterion:
  - The shifted coordinate gives per-variable degree 2 for the O-relation. (B) is false and the centring
    degree of freedom does not exist.
  - The retargeted shifted system does NOT match the baseline exactly. Then either (B)'s escape clause
    is wrong or the pipeline has a retargeting bug; either way NULL-3 of IDEA-20260807-4fc635 is invalid
    and that record must be revised.
  - The Jacobi quartic x turns out to be the negation quotient after all. Then the classification
    of that model in (A) is wrong.
  - Cross-ratios differ across models of the same curve. (A) and (C) are wrong.
  - A fixed point of iota_T coincides with the image of O. (D) is false, both sparsity sources combine,
    and the lane gains a strictly better coordinate. This is the outcome most worth hoping for.
  - The sweep finds support below 13. (E)'s prediction is wrong and a new model exists.
  - 14-monomial coordinates appear on a curve with no rational 2-torsion. The parity structure is
    misattributed and every symmetry claim in this batch is affected.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
