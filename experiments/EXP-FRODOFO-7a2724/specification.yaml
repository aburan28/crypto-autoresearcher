experiment:
  id: EXP-FRODOFO-7a2724
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-3949c8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-3949c8
  question_id: RQ-FRODO-3260cc
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Per-message decryption failure map and multiplicity-corrected max-to-mean ratio in a translation-encoded
    unstructured toy scheme versus a compressed one, with a message-independent Bernoulli null.
  objective: 'One uncertainty is reduced: whether the gap between an average correctness error and
    a worst-case one is measurable, and how large it is, at toy scale. (i) DOES THE FORCED VALUE HOLD.
    On the unstructured translation-encoded arm, where a symbolic argument registered before the run
    predicts a max-to-mean ratio of exactly one, does the multiplicity-corrected measurement agree?
    A significant excess there means the rig, the decoder tie-breaking, or the correction is wrong,
    and nothing downstream is interpretable. (ii) IS THE ESTIMATOR HONEST. Does the message-independent
    Bernoulli null, run through the identical estimator and correction, return a ratio of one, and
    does its apparent ratio decay toward one as the per-message sample budget grows? Without this,
    a maximum over many noisy estimates is guaranteed to exceed the mean and the headline number would
    be an artifact. (iii) HOW BIG IS THE COMPRESSED-ARM GAP. Sweeping compression aggressiveness up
    to the point where decoding collapses, how does the corrected ratio move, is the movement monotone,
    and which message attains the maximum? No claim about FrodoKEM, ML-KEM or HQC at real parameters
    is made, and no transform statement is asserted.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: at the stated toy dimension,
      noise setting, frozen 64-message subset, sample budget and seeds, the unstructured arm''s multiplicity-corrected
      max-to-mean ratio was the measured value with its interval, the Bernoulli null''s was the measured
      value, and the compressed arm''s rose to the measured value at the stated compression settings,
      with the stated maximizing message. WHAT DOES NOT FOLLOW: nothing about any real scheme''s correctness
      error, no claim that any published delta is wrong, no claim that any transform''s correctness
      hypothesis is violated, no failure-boosting procedure, and no security consequence. The reported
      maximum is over a frozen subset and is a lower bound on the true maximum, so even the ratio
      itself is a lower bound and may not be quoted as an estimate.'
  inputs:
    procedure: 'STAGE 0, symbolic derivation and registration: write the encoding, the decoder and
      the translation-invariance argument; register the forced value of 1.0 and the identification
      of the step that breaks it under compression. Cost: human, no compute. STAGE 1, rig build with
      shared noise core and shared key generator, differing only in the compression step, with a bitwise
      check of the shared pre-compression path. Cost: implementation. STAGE 2, decoder tie-break audit
      on the unstructured arm. Cost: minutes. STAGE 3, per-message sampling: 64 frozen messages including
      all-zero, all-one and alternating patterns, 2^16 ciphertexts each, per arm, across at least
      16 keys. Cost: a few CPU-hours. STAGE 4, estimation with binomial intervals and the pre-fixed
      multiplicity correction; report corrected and uncorrected ratios separately. Cost: minutes.
      STAGE 5, Bernoulli null at the measured mean rate through the identical estimator, same invocation.
      Cost: minutes. STAGE 6, sample-budget ladder at 2^12, 2^14, 2^16 per message to observe the
      null''s decay. Cost: under an hour. STAGE 7, compression sweep over a frozen ladder, stopping
      at decoding collapse. Cost: a few CPU-hours. STAGE 8, immutable run records via harness/runner.py
      with seeds, message subset and resolved inference block.'
    instrument: Python 3 with numpy for the sampling loops and a stdlib fallback required to reproduce
      identical counts on a reduced budget; random.Random and numpy Generator with recorded disjoint
      seed streams; binomial confidence intervals computed by an exact Clopper-Pearson implementation
      written directly rather than taken from a statistics package, so the interval convention is
      explicit and auditable; the multiplicity correction implemented as a declared function fixed
      before the run. Encoding, decoding and compression written directly as integer arithmetic with
      no polynomial or lattice library, so both arms share every code path except the compression
      step. No Sage, no lattice estimator. Run manifests and resolved inference block via harness/runner.py;
      ids via tools/allocate_id.py.
    parameters: 'Coordinate count n = 128 with nbar = 4, modulus q = 2^12, tabulated noise with |z|
      <= 6, decoding threshold set so the mean per-ciphertext failure probability is about 2^-8. Frozen
      message subset: 64 messages comprising all-zero, all-one, alternating, single-bit-set for 16
      positions, and 45 uniformly drawn under recorded seeds. Sample budgets per message: 2^12, 2^14,
      2^16. Keys: 16 independent, resampled across the budget. Compression ladder: 8 levels of retained
      ciphertext bits from none dropped to the level at which mean failure exceeds 0.25, at which
      point the sweep stops. Arms: unstructured, compressed, Bernoulli null.'
  controls:
  - Message-independent Bernoulli null through the identical estimator and multiplicity correction,
    in the same invocation.
  - Unstructured translation-encoded arm as a forced-value control with a symbolically derived expected
    ratio of exactly one.
  - Structured-extreme messages included in the frozen subset, so a message-dependence concentrated
    at extremes is not missed by random sampling.
  - Sample-budget ladder, confirming the null's apparent ratio decays toward one while a genuine ratio
    does not.
  - Shared noise core and shared key generator across arms, verified bitwise on the pre-compression
    path.
  - Decoder tie-breaking audit, confirming no message-dependent tie-break exists on the unstructured
    arm.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A MESSAGE-INDEPENDENT BERNOULLI arm: failure indicators drawn from
    a fixed Bernoulli at the measured mean rate, independent of the message, passed through the IDENTICAL
    per-message estimator, the identical multiplicity correction and the identical max-to-mean summary,
    in the same invocation. The null must return an estimated ratio of one within the multiplicity-corrected
    interval. This is the essential control because a maximum over many noisy estimates always exceeds
    the mean, so a naive ratio above one is the DEFAULT outcome of the estimator rather than a finding;
    if the null''s apparent ratio is comparable to the compressed arm''s, the measurement has shown
    nothing. A second null is the unstructured arm itself, whose predicted ratio is exactly one by
    the symbolic argument, so it serves simultaneously as a forced-value check on the whole pipeline:
    a ratio significantly above one there indicates a rig defect, not a discovery.'
  independent_variables:
  - 'arm: unstructured translation-encoded, compressed, message-independent Bernoulli null'
  - message identity within the frozen 64-message subset
  - compression level, 8 frozen ladder steps
  - 'sample budget per message: 2^12, 2^14, 2^16'
  - key index
  metrics:
    primary:
    - delta(m) per message with Clopper-Pearson interval
    - maximum, mean and max-to-mean ratio per arm, corrected and uncorrected
    - ratio as a function of compression level
    - null apparent ratio as a function of sample budget
    - identity and stability across seeds of the maximizing message
    secondary:
    - mean failure probability per arm and per compression level
    - decoder tie-break audit outcome
    - shared-core bitwise check outcome
    - per-key spread of the ratio
    - compression level at which decoding collapse begins
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The multiplicity-corrected max-to-mean ratio on each arm, and the corrected ratio's
      dependence on compression level.
    formula: 'Registered before the run: unstructured arm corrected ratio exactly 1.0, where the ratio
      is max over the frozen subset of delta(m) divided by the mean of delta(m) over that subset,
      and the correction subtracts the expected maximum of M independent binomial estimates at the
      common mean and budget; Bernoulli null corrected ratio at most 1.05; compressed arm corrected
      ratio at least 1.3 at the most aggressive level before decoding collapse; at least 80 percent
      of adjacent compression-ladder steps show a non-decreasing corrected ratio before collapse.'
    source: Pre-registered in the parent proposal IDEA-20260816-3949c8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at n = 128, nbar = 4, q = 2^12, mean failure probability about 2^-8, and
      a 64-message subset of a 2^128-sized space. TRANSFER ASSUMPTION, stated plainly: the translation-invariance
      argument is dimension-independent and transfers as an ARGUMENT wherever its three named conditions
      hold, while every measured ratio is a toy artifact set by the chosen compression ladder and
      by the frozen message subset. The maximum over 64 messages is a lower bound on the true maximum
      with an unbounded gap, so no ratio measured here may be extrapolated to a full message space
      or to any real scheme.'
    correspondence: null
  tail_checks:
  - Report the uncorrected ratio alongside the corrected one, since their difference is the size of
    the artifact the correction removes.
  - Report the identity of the maximizing message per seed, since instability across seeds means the
    maximum is selecting noise.
  - Report the smallest per-message failure count observed, since a message with a handful of failures
    dominates the maximum for budgetary reasons.
  - Report behaviour at the two compression levels adjacent to decoding collapse separately, since
    the ratio is expected to turn over there for a trivial reason.
  - Report the per-key spread of the ratio, since a single atypical key could carry the effect.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt and report if the unstructured arm's corrected ratio is significantly above one; the discrepancy
    with the registered forced value is the deliverable.
  - Halt the compression sweep at the first level where mean failure probability exceeds 0.25, and
    report that level.
  - Cap total wall clock at six CPU-hours; a cap hit is an infrastructure outcome and never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The unstructured arm reproduces the registered forced ratio of one within its
    corrected interval, the Bernoulli null returns a corrected ratio at most 1.05 whose uncorrected
    value decays toward one as budget grows, and the compressed arm's corrected ratio exceeds 1.3
    before decoding collapse with at least 80 percent of ladder steps non-decreasing.
  falsification_criterion:
  - The unstructured arm's corrected ratio is significantly above one.
  - The Bernoulli null's corrected ratio is comparable to the compressed arm's.
  - The compressed arm's corrected ratio never exceeds the null's at any level.
  - The corrected ratio is non-monotone in compression level before collapse.
  - The maximizing message is unstable across seeds.
  - The null's uncorrected ratio does not decay as the budget grows, indicating the correction is
    misspecified.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-3949c8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The multiplicity correction is specified as a declared function but its exact form is not yet
    fixed; a Coordinator must fix it before approval, since choosing it after seeing data would determine
    the headline number.
  - The frozen 64-message subset is proposed rather than justified, and the gap between a subset maximum
    and a true maximum is unbounded; a Coordinator must decide whether that limitation is acceptable
    or whether an adversarially chosen subset is needed, which would change the design's character.
  - Whether any transform's correctness hypothesis actually requires a worst-case delta is deliberately
    not asserted here and cannot be, since no transform statement is filed in this corpus; a Coordinator
    must not let the run's framing imply otherwise.
