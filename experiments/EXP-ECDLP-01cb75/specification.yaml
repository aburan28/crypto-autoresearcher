# EXP-ECDLP-01cb75
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-cd58ea.
experiment:
  id: EXP-ECDLP-01cb75
  hypothesis_id: H-ECDLP-dfe24f
  source_idea: IDEA-20261003-9fe422
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-4 table versus width-3 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-cd58ea
  objective: >-
    Check the table sizes 8 and 4, the product 32, and the nearby gap 0.
  inputs:
    width_hi: 4
    width_lo: 3
    table_hi: 8
    table_lo: 4
    table_gap: 4
    table_product: 32
    table_sum: 12
    nearby_a: 4
    nearby_b: 4
    nearby_gap: 0
    nearby_product: 16
  controls:
    - >-
      Two to the power 3 is 8. Two to the power 2 is 4. Reporting
      both tables as size 4 drops the gap and invalidates the run.
    - >-
      Eight exceeds four by 4. The product of the two sizes is 32.
      Their sum is 12.
    - >-
      Two width-3 tables each store 4. Their gap is 0 and their
      product is 16.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-4 table stores 8 entries. The width-3 table stores
      4. The gap of two width-3 tables is 0.
    formula: >-
      Compute 2 to the power 3. Compute 2 to the power 2. Subtract
      4 from 8. Multiply 8 by 4. Subtract 4 from 4.
    source: >-
      IDEA-20261003-9fe422 states the widths 4 and 3 and the sizes
      8 and 4, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 32 and the nearby gap 0 are required. A check that stops at the size 8 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 8 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 3 is not 8.
    - Two to the power 2 is not 4.
    - The gap is not 4.
    - The product is not 32.
    - Both tables are reported as size 4, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-4 table stores 8 entries, that
    the width-3 table stores 4, and that 8 exceeds 4 by 4.
  falsification_criterion: >-
    The runs agree that the width-4 table size is computed, and
    that size is not 8.
  required_artifacts:
    - experiments/EXP-ECDLP-01cb75/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-01cb75/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-01cb75/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-01cb75/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-01cb75/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-01cb75/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 4 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
