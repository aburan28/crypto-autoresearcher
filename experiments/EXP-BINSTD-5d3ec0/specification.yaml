# =============================================================================
# EXP-BINSTD-5d3ec0 -- VERSION 1 (APPROVED by DEC-20261001-3e0cf7) frozen
# contract for H-BINSTD-4a07ff: Stage 0 product-law / |Gamma_13| / n=19
# order re-derivation; Stage 1 collision-form DLP with Koblitz + ordinary
# + relabelled controls; Stage 2 coupled one-hot vs per-pattern solve ratio
# at w=2.
#
# Source: IDEA-20260926-b48c9d under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# ZERO RUNS in this design packet. Stages 0-2 authorized for later
# executor TASK-20261001-eaf0c5. No AUXIN. Amazon Bedrock prohibited.
# packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Stage-0 / metric-only manifests use none.
# Runs that claim a DLP solution MUST use certificate.kind: discrete_log
# and re-verify [x]P=Q independently. Relation hits that claim a
# decomposition into (P,z) use decomposition and re-verify by curve
# arithmetic.
# =============================================================================
experiment:
  id: EXP-BINSTD-5d3ec0
  hypothesis_id: H-BINSTD-4a07ff
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-b48c9d
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Tau-adic Gamma_w-orbit quotient: Stage-0 product law + n=19 collision
    form with genericity controls + coupled one-hot escape ratio
  status: approved
  approved_by: DEC-20261001-3e0cf7
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-3e0cf7
    composing_decision: DEC-20261001-3e0cf7
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break or rho
      competitiveness. Does NOT authorize deployed-curve attacks.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    optional_stages:
      - id: SAT-arm
        status: optional_missing_engine
        note: >-
          CaDiCaL / WDSat SAT arm for Stage 2 is optional; primary engine is
          pure-Python macaulay/closure. Missing engine → skip arm, not
          failed_infrastructure for the primary path.
    scientific_execution_authorized_note: >-
      Stages 0-2 are the required success path. Stage 0 is analysis /
      arithmetic and MUST complete before Stage 1. Stages 1-2 are toy
      n=19 only. No deployed-curve attacks. No Amazon Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Freeze Stage-0 re-derivation of claim (B) product law, |Gamma_13|,
    and n=19 Koblitz order 4*130873 (with 2-Sylow cyclic check) BEFORE any
    scientific run.
    (B) At n=19 measure collision-form DLP cost (scalar multiplications
    until two hits share a representative) for Koblitz a=0 vs ordinary
    random-Gamma vs relabelled Z/(4l), w in {1,2}, l' in {8,10,12},
    50 instances — genericity certificate for the enumerated form.
    (C) At w=2 measure coupled one-hot vs summed per-pattern Macaulay/
    closure work ratio at the same l' cells (20 targets) — price the
    escape (HEUR-H2).
    Claim no deployed attack and no exponent move.

  class: heuristic_validation
  class_note: >-
    Hybrid: Stage 0 is a structural_certificate (product-law arithmetic);
    Stage 1 is genericity / collision-cost validation of claim (B);
    Stage 2 is heuristic-validation of HEUR-BINSTD-4a07ff-H2 (coupled
    escape). Measured vs modeled columns stay separate. No
    exponent-moving claim.

  scope:
    included:
      - >-
        Stage 0: write product-law-n131.yaml (|Gamma_w| / attempts for
        w=1..15 with exact C(131,w)*2^w upper bounds and |Gamma_13|
        re-derivation); n19-order-check.yaml (order 4*130873, primality of
        130873, unique 2-torsion (0,1)); preregistered-predictions.yaml;
        methodological-note.md; w=1 baseline arithmetic row.
      - >-
        Stage 1: n=19 Koblitz cell; V' random F_2-subspace dim l' in
        {8,10,12}; Gamma_w for w in {1,2}; 50 targets R=aP+bQ with known
        (a,b), seeds 2026092601..50; enumerate z in Gamma_w, test
        x([z^{-1}]R) in V'; continue until two hits share P; solve DLP;
        verify certificate. Repeat on ordinary control (random scalar set
        size |Gamma_w|) and relabelled Z/(4l) with SAME V' transported.
      - >-
        Stage 2: w=2 coupled Weil descent of S_3(x^{2^{j1}}, x^{2^{j2}},
        x_R) with x in V' (19 eqs in l' bits) via macaulay/closure at
        D<=4; sum work over patterns; build one-hot-over-j system; report
        ratio. Primary engine pure Python; SAT arm optional/missing.
    excluded:
      - Any scientific ECDLP attack at n>=41
      - Claiming the mechanism beats matched rho on any deployed curve
      - Claiming an exponent improvement from the tau-adic object
      - Quietly editing IDEA-20260926-b48c9d claim text
      - Using non-vocabulary certificate.kind values
      - AUXIN edits
      - Amazon Bedrock
      - Re-scoring predictions after observing Stage 1+ without protocol_amendment
      - Extrapolating Stage-2 ratio to n=131

  inputs:
    proposal: ledger/proposals/IDEA-20260926-b48c9d.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-4a07ff.yaml
    brief: analysis/binstd-idea-review-20260926/BRIEF.md
    frobenius_orbit: analysis/frobenius-orbit-ecc2k130/README.md
    rho_baseline: knowledge/findings/KN-FIND-aa2efc.md
    onehot_baseline: knowledge/findings/KN-FIND-47da4e.md
    curve_lit: knowledge/literature/KN-LIT-661e97.md
    code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/instances.py
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py
    cells:
      Stage0-n131:
        n: 131
        role: structural_certificate_product_law
        w_sweep: [1, 2, 3, 5, 8, 10, 13, 15]
        predicted_gamma13_log2: 71.0
        predicted_attempts_w13_log2: 60.0
        tolerance_bits: 0.5
      BIN-TOY-n19-koblitz:
        n: 19
        irreducible: t^19 + t^5 + t^2 + t + 1
        curve: y^2 + xy = x^3 + 1
        predicted_group_order: 4 * 130873
        w: [1, 2]
        l_prime: [8, 10, 12]
        targets: 50
        seeds: '2026092601..50'
        role: primary_collision_form
      BIN-TOY-n19-ordinary:
        n: 19
        A: 46693
        B_curve: 306147
        h: 2
        Gamma: random_matched_size
        role: null_object_no_tau
      BIN-TOY-n19-relabelled:
        n: 19
        group: Z/(4*130873)
        bijection: random_recorded
        role: blocking_genericity_control
      Stage2-coupled:
        n: 19
        w: 2
        l_prime: [8, 10, 12]
        targets: 20
        closure_degree_max: 4
        role: escape_pricing_H2

  controls:
    - name: relabelled_Z_NZ
      object: >-
        Relabelled Z/(4l) with same V' transported through a random
        bijection (blocking for genericity reading of Stage 1).
    - name: ordinary_random_Gamma
      object: >-
        Ordinary curve same field with random scalar set of size
        |Gamma_w| (null object of the same shape; no tau).
    - name: w1_orbit_union_baseline
      object: >-
        w=1 must reproduce orbit-union gain n and no more
        (KN-FIND-47da4e / frobenius-orbit README).
    - name: certificate_reverification
      object: >-
        Every relation and DLP solution re-verified by direct curve
        arithmetic on a fresh object (certificate.kind discrete_log /
        decomposition as applicable).
    - name: l_prime_sweep_linearisation
      object: >-
        Sweep l' to C(l',2)+l' > n to separate trivial-linearisation
        artifact from genuine coupled-solve gain.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_break_guard
      object: No break / attack-cost / rho-beating / exponent claim in any artifact.
    - name: seed_control
      object: Stage-1 seeds 2026092601..50 recorded per instance; Stage-2 targets recorded.

  independent_variables:
    - arm  # koblitz | ordinary | relabelled
    - n
    - w
    - l_prime
    - seed
    - target_index
    - solve_mode  # enumerate_Gamma | coupled_perpattern | coupled_onehot

  metrics:
    primary:
      - scalar_mults_to_dlp
      - hits_per_target
      - representative_collision_count
      - koblitz_vs_control_cost_ratio
      - coupled_onehot_vs_perpattern_work_ratio
      - gamma13_log2
      - certificate_pass_rate
    secondary:
      - distinct_z_count
      - pattern_count
      - closure_rows_eliminated
      - peak_rss_bytes
      - wall_clock_s
      - termination_reason
      - linearisation_regime_flag

  heuristic_under_test:
    - HEUR-BINSTD-4a07ff-H1
    - HEUR-BINSTD-4a07ff-H2

  preregistered_prediction:
    quantity: >-
      (A) Stage-0 |Gamma_13| log2 within 0.5 bit of 71; attempts_w13 log2
      within 0.5 bit of 60; n=19 order = 4*130873 after re-check
      (structural / arithmetic; not a statistical prediction).
      (B) Stage-1 collision cost within factor 1.5 of 2^{n-l'/2} × pattern
      constant; Koblitz/relabelled/ordinary ratios in [0.67, 1.5] on every
      cell.
      (C) Stage-2 coupled_onehot_vs_perpattern_work_ratio >= 1.0 on every
      cell (HEUR-H2 / closure). Ratio < 0.5 at two cells is DO-2.
      (D) certificate_pass_rate = 1.0.
    formula: >-
      |Gamma_w| <= C(n,w)*2^w;
      attempts_free = 2^n / |Gamma_w|;
      collision_cost ≈ 2^{n - l'/2} scalar multiplications;
      H2: work_onehot / sum_j work_perpattern_j >= 1.
    source: >-
      IDEA-20260926-b48c9d claims (B)-(C) and predictions; H-BINSTD-4a07ff;
      KN-FIND-47da4e for independent-summand one-hot overhead band
      (transplanted, not identity). Solinas 2000 constant recalled — not
      in measured formulas.
    claim_tier: observational_plus_structural
    measured_vs_modeled: >-
      scalar_mults_to_dlp, hits, collisions, closure_rows_eliminated,
      wall_s, RSS, certificate outcomes are MEASURED. Stage-0 |Gamma_w|
      tables, attempts columns, and 2^{n-l'/2} bands are MODELED /
      arithmetic predictions written before Stage 1 and never retuned to
      Stage 1+ data without a protocol_amendment. Ratio bands are labeled
      predictions, not post-hoc fits.

  scale_relevance:
    tier: toy
    justification: >-
      Executable cells at n=19; n=131 contribution is Stage-0 product-law
      arithmetic only. No transfer of measured Stage-2 ratios to deployed
      solving cost is claimed — only the structural domination number
      2^{131-l'/2} (arithmetic) and the genericity direction.
    correspondence: >-
      None exact for solving cost. Transfer assumption for heuristic
      direction of H2 only, disclosed; Stage-0 dims/counts need no transfer.

  tail_checks:
    - Smoothest / cheapest Stage-1 cell vs 2^{n-l'/2} prediction.
    - Largest Stage-1 Koblitz/control deviation across the grid.
    - Smallest Stage-2 ratio observed (escape tail); flag if <0.5.
    - Distinct-z deficit vs |Gamma_w| at toy n (Gamma collisions).

  replication:
    seeds:
      - 2026092601
      - 2026092602
      - 2026092603
      - 2026092604
      - 2026092605
    independent_instances: >-
      Stage 0 deterministic arithmetic (seed-free). Stage 1: 50 instances
      with seeds 2026092601..50 (list full range in run manifests; five
      seeds named here as the primary reported quintile plus the contract
      requires all 50). Stage 2: 20 recorded targets. Optional replicate
      seeds only via protocol_amendment.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 40
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when product-law table, |Gamma_13| re-derivation, n=19 order check, preregistered predictions, and methodological note are written BEFORE Stage 1.
    - Stage 1 complete when scalar_mults_to_dlp and koblitz_vs_control ratios reported for all required (w,l',arm) cells with certificates.
    - Stage 2 complete when coupled_onehot_vs_perpattern_work_ratio reported for l' in {8,10,12}.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - If a cell's enumeration is infeasible: record IMP and stop that cell as infrastructure — do not invent costs.

  invalidation_rules:
    - Stage 0 |Gamma_13| or order check fails without identified arithmetic bug → supersede, do not proceed as if Stage 0 passed
    - Claiming rho-beating, exponent improvement, or deployed attack cost
    - Retuning preregistered bands after Stage 1+ without protocol_amendment
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - certificate.kind outside vocabulary → invalid run
    - DLP / relation claimed without independent re-verification
    - Editing IDEA-20260926-b48c9d claim text

  success_criterion: >-
    Stage 0: product-law + |Gamma_13| + n=19 order artifacts committed
    before Stage 1.
    Stage 1: Koblitz/control ratios in [0.67,1.5] on all cells OR
    documented DO-3; certificates pass; costs within 1.5× of
    2^{n-l'/2} band OR documented exception.
    Stage 2: ratio >= 1.0 on all cells (DO-1) OR ratio < 0.5 at two
    cells with Stage-1 OK (DO-2 surprise) — both are decidable success
    paths for the protocol; DO-2 is not a silent support of the escape.
    Decidable from predefined metrics. Positive agreement does NOT
    authorize a deployed claim.

  falsification_criterion: >-
    Stage-0 arithmetic fails beyond tolerance; OR Stage-1 Koblitz/control
    ratio outside [0.67,1.5] on any cell with certificates intact and no
    instrument bug found; OR Stage-2 ratio < 0.5 at two cells (falsifies
    HEUR-H2 / closure prediction — triggers DO-2, not silent support);
    OR certificate_pass_rate < 1.0; OR any rho-beating / exponent / break
    claim.

  required_artifacts:
    - experiments/EXP-BINSTD-5d3ec0/stage0/product-law-n131.yaml
    - experiments/EXP-BINSTD-5d3ec0/stage0/n19-order-check.yaml
    - experiments/EXP-BINSTD-5d3ec0/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-5d3ec0/stage0/methodological-note.md
    - experiments/EXP-BINSTD-5d3ec0/stage0/w1-baseline-row.yaml
    - experiments/EXP-BINSTD-5d3ec0/stage1/collision-summary.yaml
    - experiments/EXP-BINSTD-5d3ec0/stage1/genericity-ratios.yaml
    - experiments/EXP-BINSTD-5d3ec0/stage2/coupled-ratio-summary.yaml
    - experiments/EXP-BINSTD-5d3ec0/runs/
    - experiments/EXP-BINSTD-5d3ec0/implementation/

  optimistic_assumptions_disclosed:
    - >-
      |Gamma_w| upper-bounded by C(n,w)*2^w; collisions among patterns
      (same z mod l) only lower coverage — bias favours the object.
    - >-
      Stage-1 "within 1.5× of 2^{n-l'/2}" uses the heuristic coverage
      model H1; labeled heuristic band, not a theorem.
    - >-
      H2 transplants KN-FIND-47da4e's independent-summand overhead to the
      coupled shape; if the transplant is wrong, DO-2 fires — disclosed.
    - >-
      Solinas ≈2^5.5 constant is recalled and does not enter measured
      Stage-1 units (scalar multiplications).
    - >-
      Pure-Python closure at D<=4 may under-count work vs a SAT engine;
      optional SAT arm missing — primary comparisons are within the same
      instrument.

  memory_accounting: >-
    Dominant structures: Gamma_w enumeration tables at w=2
    (C(19,2)*2^2 = 684 patterns — tiny); hit stores of size ~2^{l'/2}
    (<=2^6 at l'=12) for toy collision; Macaulay/closure matrices for
    Stage 2 at l'<=12, n=19 — peak_rss_bytes reported per run and
    reconciled against declared buffers. No van Oorschot–Wiener tradeoff
    in this contract. At n=131 the collision form would need 2^{l'/2}
    memory (up to 2^65) — disclosed as dominated, not measured.

  certificate:
    kind_vocabulary:
      - discrete_log
      - decomposition
      - key_recovery
      - none
    stage0_kind: none
    dlp_solution_kind: discrete_log
    relation_hit_kind: decomposition
    note: >-
      DLP solutions carry certificate.kind discrete_log and are
      independently re-checked ([x]P=Q on a fresh curve object).
      Relation hits claiming (P,z) decomposition use decomposition and
      re-verify Q=[z]P with x(P) in V'. Metric-only and Stage-0 arithmetic
      use none.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
