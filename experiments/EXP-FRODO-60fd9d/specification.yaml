experiment:
  id: EXP-FRODO-60fd9d
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-FRODO-e0c651
  question_id: RQ-FRODO-3260cc
  goal_id: GOAL-FRODO-001
  batch_id: null
  title: >-
    Review-required design: a thirteen-integer conservation gate, a mutation control
    with a magnitude derived before the run, a closed-form Rademacher null, and a
    certified-enclosure recomputation of FrodoKEM's decryption failure rate

  objective: >-
    If separately approved, frozen and authorized: (1) run five exact integer and
    rational identities on the transcribed FrodoKEM sampling table as a
    transcription-and-document gate, in milliseconds, before anything else; (2)
    build the failure-rate pipeline and validate it against a null with a closed-form
    answer, a degenerate null, and a same-variance nearby object; (3) demonstrate,
    with a magnitude derived before the run, that the pipeline detects a seeded
    one-unit table perturbation; and only then (4) recompute the decryption failure
    rate at the standardised parameter sets as a certified rational enclosure and
    apply a decision rule frozen in advance. This is an instrument-and-measurement
    design proposal. No run has happened, no primary text has been read, and nothing
    here is evidence.

  source_gate:
    status: SHUT
    rule: >-
      RQ-FRODO-3260cc.constraints[0] forbids designing an experiment for execution
      before the FrodoKEM specification and the primary failure-rate analysis are
      filed as KN-LIT entries at stated provenance levels with extraction damage
      marked. GOAL-FRODO-001.next_action adds that the MUTATION CONTROL MUST BE
      DESIGNED BEFORE THE RECOMPUTATION, and this contract does that literally:
      Stage 4 (mutation) precedes Stage 5 (recomputation) and Stage 5 may not run
      until Stage 4 has passed. THIS CONTRACT IS A DESIGN, NOT AN AUTHORIZATION.
    prerequisite_deliverables:
      - KN-LIT entry for the FrodoKEM specification or standard proposal, provenance level stated, extraction damage marked
      - KN-LIT entry for the primary decryption-failure analysis, or a recorded statement that it could not be obtained
      - a transcription of the sampling table, the noise structure, the decoding threshold, the coordinate count and the published failure rates, each with a reference and a numbered assumption list

  what_this_is_not:
    - Not an attack, not a break, not a failure-boosting attack, and not a statement about deployed FrodoKEM.
    - Not a claim that any published failure rate is wrong. No prediction of agreement or disagreement is made; only a decision rule is frozen.
    - Not an estimate of LWE hardness at Frodo's dimensions and not a derivation of any sieve, BKZ or core-SVP cost (out of lane, GOAL-FRODO-001.non_duplication).
    - Not an analysis of any FrodoKEM implementation, timing channel or fault behaviour (KN-LIT-2088, KN-LIT-3859, KN-LIT-118, KN-TECH-047 are out of scope).
    - Not a Renyi-divergence computation; that is EXP-FRODO-02bbaa's.
    - Not a costing of any discrepancy. That is a separate record at a separate tier and this contract must not perform it.
    - Not an approval, a freeze, an execution authorization, a run, an observation, or evidence.

  claim_ceiling:
    tier: crypto_for_arithmetic_only
    arithmetic_scope: >-
      CRYPTO tier is available for exactly one class of statement: that a certified
      rational enclosure of the decryption failure rate, computed independently of
      the reference implementation, does or does not contain the published figure at
      Frodo-640/976/1344, with the enclosure width and any discrepancy's size
      stated. This is reachable at crypto tier because the computation is performed
      AT the standardised parameters with no toy proxy and no extrapolation
      heuristic. The enclosure width is part of the claim, not a footnote: an
      enclosure wider than the discrepancy sought supports nothing.
    security_scope: >-
      TOY tier, without exception, for every security reading. A discrepancy in a
      failure rate is NOT an attack, is not evidence about LWE hardness, and is a
      documentation or analysis defect until costed with a charged attacker cost and
      independently reviewed (RQ-FRODO-3260cc.constraints). A run that records both
      classes at one tier has failed regardless of what it computed
      (GOAL-FRODO-001.next_action).

  inputs:
    parameter_sets: [Frodo-640, Frodo-976, Frodo-1344]
    to_be_read_from_primary_text:
      - the sampling table per parameter set, and the normalisation convention (magnitude table with denominator M, or two-sided table with denominator 2M)
      - the sampler's pseudocode, specifically the sign-bit and bit-budget convention
      - sigma per parameter set, and whether the ideal object is a ROUNDED Gaussian or a DISCRETE Gaussian (different distributions, different variances)
      - the decryption noise structure and the number of product terms
      - the decoding threshold t and how it derives from q and the number of extracted bits
      - the coordinate count over which the failure rate is unioned
      - the published failure rate per parameter set, its printed precision, AND its convention (per coordinate / per key; average over keys / worst case)
    provisional_values_for_design_only:
      note: >-
        EVERY VALUE IN THIS BLOCK IS RECALLED FROM MODEL MEMORY OR READ FROM THE
        EXTRACTION-DAMAGED EXCERPT IN RQ-FRODO-3260cc.provenance. NONE IS A VALUE
        THIS PROGRAM HAS ESTABLISHED. They make the design concrete and let a
        reviewer check the arithmetic; the Stage 0 transcription overwrites them and
        they are never used in a reported result.
      excerpt_table_frodo640: [9288, 8720, 7216, 5264, 3384, 1918, 958, 422, 164, 56, 17, 4, 1]
      excerpt_sigma_frodo640: "2.8"
      excerpt_failure_rates: ["2^-138.7", "2^-199.6", "2^-252.5"]
      recalled_frodo640: {n: 640, q: 32768, extracted_bits: 2, nbar: 8, mbar: 8, product_terms: 1280, threshold: 4096, coordinates: 64}
      derived_from_excerpt_scout_computed:
        two_sided_sum: 65536
        variance_exact: "64895/8192"
        kurtosis_chi: "2.99508"
        kurtosis_product: "8.970"
        var_X: "80333.2587"
        t_over_sd: "14.4515"
        d_log2DFR_dv: "38.033 bits per unit of v"
        predicted_mutation_response: "-0.1671 bits"
        gaussian_bracket_log2: "-148.84"
      derived_provenance: >-
        SCOUT-COMPUTED on this machine outside the harness, from an
        extraction-damaged excerpt and recalled structural values. RE-RUN IN-HARNESS
        BEFORE CITING. These are the design's own arithmetic, not FrodoKEM facts.
    identities:
      C1_normalisation: "p_0 + 2*sum_{k>=1} p_k == M exactly, M a power of two, zero tolerance"
      C2_second_moment: "|Var(chi) - (sigma^2 + 1/12)|/(sigma^2 + 1/12); band 5e-3 at Frodo-640 and Frodo-976, 5e-2 at Frodo-1344"
      C3_convention: "determine magnitude-table vs two-sided-table from the sampler pseudocode; record the reference"
      C4_unimodality: "zero non-strict descents in (p_0..p_12); zero repeated cumulative entries"
      C5_kurtosis: "kurt(chi) exact; kurt(product) = kurt(chi)^2; must exceed 3"
    mutation: "p_12 -= 1, p_0 += 2 (normalisation preserved); dv = -288/M exactly"
    mutation_predicted_response_bits: "-0.1671"
    mutation_acceptance_band_bits: [-0.33, -0.08]
    graded_u: [1, 2, 4, 8, 16]
    reduced_dimension_ladder_n: [8, 16, 32, 64, 128]
    threshold_triple_epsilon: "0.01 (tail evaluated at t*(1-eps), t, t*(1+eps) so the local log-curvature is available)"
    arithmetic: >-
      Exact integers and fractions.Fraction for the table gate, the Rademacher null,
      the degenerate null and the reduced-dimension ladder. Directed-rounding
      fixed-point intervals with exact rational endpoints for the true-dimension
      convolution. NO FLOATING POINT in any reported quantity; floats permitted only
      in a clearly labelled human-readable column.
    master_seed: 60601344
    domain: "EXP-FRODO-60fd9d/v1"
    seed_derivation_rule: >-
      Randomness is consumed only by the random-table null arm and the Monte-Carlo
      positive control. A draw uses SHA-256 over the ASCII bytes of
      domain || "|" || arm_label || "|" || decimal(parameter_set_index) || "|" ||
      decimal(counter), big-endian unsigned. Random tables are generated by taking
      thirteen successive digests modulo the corresponding excerpt magnitude and
      then, for the constrained null only, adjusting p_0 to satisfy C1 exactly. The
      Monte-Carlo control draws chi samples by inverting the table on 16 digest bits
      per sample, counter advancing once per sample. Counter starts at 0. This rule
      reproduces every instance bit for bit from the master seed alone.

  arms_and_controls:
    treatment: >-
      The five identities on the transcribed table, and the certified-enclosure
      failure rate at each parameter set, evaluated at the three thresholds
      t*(1-eps), t, t*(1+eps).
    measured_null_1: >-
      RANDOM TABLE SUBJECT TO C1. Thirteen integers drawn from the seed rule and
      adjusted so C1 holds exactly. FORCED VALUES DERIVED PRE-RUN: C4 fails with
      probability overwhelmingly close to 1 (a random composition is monotone
      decreasing with probability 1/13! ~ 1.6e-10) and C2 fails by orders of
      magnitude. C1 is NOT tested by this arm because it is imposed by construction
      -- that is stated explicitly rather than counted as a pass, because a control
      that cannot fail proves nothing (KN-TECH-1a5b7e). 100 instances.
    measured_null_2: >-
      RANDOM TABLE WITHOUT THE NORMALISATION CONSTRAINT. FORCED VALUE: C1 fails with
      probability 1 - O(1/M). This is the arm that gives C1 discriminating power and
      it is separated from null 1 deliberately. 100 instances.
    measured_null_3: >-
      RADEMACHER NULL, CLOSED FORM, SAME SHAPE AS THE TREATMENT. chi_null(+1) =
      chi_null(-1) = 1/2. X becomes a sum of exactly 2n+1 Rademacher variables and
      FORCED VALUE, derived pre-run:
      P(|X| >= t) = 2 * sum_{j : 2j-(2n+1) >= t} C(2n+1, j) / 2^{2n+1},
      an exact rational computed by an INDEPENDENT code path (binomial coefficients,
      no convolution). The pipeline must return it BIT FOR BIT as a Fraction. This is
      the null-object-with-a-closed-form-answer that
      GOAL-FRODO-001.completion_criteria requires, instantiated rather than gestured
      at, and it CAN FAIL.
    measured_null_4: >-
      DEGENERATE NULL. chi_null = point mass at 0, so X = 0 identically and
      P(|X| >= t) = 0 EXACTLY for any t > 0. Declared explicitly as a smoke test that
      a correct pipeline cannot fail, and therefore NOT counted as a sensitivity
      demonstration.
    positive_control_1: >-
      TABLE-GATE POSITIVE CONTROL, THRESHOLD DECLARED PRE-RUN. Construct the rounded
      Gaussian at the stated sigma independently, by error-function evaluation
      rounded and renormalised to the stated denominator. C1, C2, C4 and C5 MUST ALL
      PASS on it, with C2 below 1e-3 at sigma = 2.8. IF ANY FAILS, THE GATE IS BROKEN
      AND NO NEGATIVE RESULT ABOUT THE PUBLISHED TABLE MAY BE REPORTED AT ALL.
    positive_control_2: >-
      PIPELINE POSITIVE CONTROL AGAINST AN INDEPENDENT METHOD, THRESHOLD DECLARED
      PRE-RUN. Lower the threshold (or scale chi) until the failure probability is
      about 2^-20; estimate it by seeded Monte-Carlo with 2^26 draws; THE EXACT
      PIPELINE'S ANSWER MUST LIE INSIDE THE 99 PER CENT SAMPLING INTERVAL. IF IT DOES
      NOT, THE EXACT MACHINERY IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED. This
      is the only control that tests the exact machinery against a genuinely
      different method rather than against another derivation, and it is the one that
      discharges RQ-FRODO-3260cc.constraints's independence-from-the-reference-
      implementation requirement.
    mutation_control: >-
      THE CONTROL THE GOAL RECORD REQUIRES, IN ITS STRONG FORM. Apply
      "p_12 -= 1, p_0 += 2" and recompute. PREDICTED RESPONSE -0.1671 bits, derived
      before the run in H-FRODO-e0c651.mechanism; ACCEPTANCE BAND [-0.33, -0.08] bits,
      fixed here. A response of zero, of the wrong sign, or outside the band is a
      FAILURE, and no agreement with a published failure rate may then be reported as
      a verification. THE WEAK FORM OF THIS CONTROL -- "did the output change?" -- IS
      EXPLICITLY REJECTED AS INSUFFICIENT, because it is passed by any pipeline whose
      output depends on its input at all.
    graded_control_1: >-
      MUTATION LADDER, FIVE INTERIOR POINTS. u in {1,2,4,8,16}. FORCED: strictly
      monotone decreasing, responses in ratio 1:2:4:8:16 to within 15 per cent at
      u <= 8, fitted slope within a factor of 2 of the derived 38.03 bits per unit of
      v. Saturation or non-monotonicity localises the defect rather than leaving "it
      did not work"; report which.
    graded_control_2: >-
      REDUCED-DIMENSION LADDER, FIVE RUNGS. n' in {8,16,32,64,128} with the true chi
      and a scaled threshold, where a FULLY EXACT rational answer is affordable. The
      certified enclosure MUST contain the fully exact answer at every rung, and the
      enclosure width must grow as derived. This is the only validation of the
      interval-arithmetic policy itself, which is otherwise the least-tested part of
      the design (HEUR-FD-3).
    nearby_object_control: >-
      SAME VARIANCE, DIFFERENT KURTOSIS. A two-point distribution at +-sqrt(v)
      (rationalised), whose variance equals Var(chi) exactly by construction and
      whose kurtosis is 1. FORCED: its failure rate must differ from chi's by MORE
      THAN 5 BITS, because the tail at 14.5 standard deviations is governed by
      kurtosis rather than by variance. IF THE PIPELINE RETURNS SIMILAR ANSWERS FOR
      THE TWO, IT IS RESPONDING TO VARIANCE ALONE AND HAS NOT IDENTIFIED WHAT
      DETERMINES THE TAIL; the directional bracket and the sensitivity derivation are
      then suspect and must be re-derived before any reproduction claim.
    ordering_control: >-
      All four nulls, both positive controls, the mutation control, both graded
      ladders and the nearby-object control are computed and hash-committed BEFORE
      the unmutated published table's failure rate is computed or looked at. The
      frozen decision rule is executed on the mutated arm first. Absence of the
      commitment is invalid_measurement.
    comparability_policy: >-
      No result here may be compared to another experiment's without a separately
      registered comparator contract naming both domains and both seed rules. In
      particular these results may not be combined with EXP-FRODO-02bbaa's into a
      single security statement: the two sit at different tiers and a combined
      statement would be a tier violation.

  procedure:
    stage_0_source_gate:
      cost: reading, zero compute
      content: >-
        Acquire and file the primary sources; transcribe every quantity in
        inputs.to_be_read_from_primary_text with a reference, TWICE INDEPENDENTLY,
        and diff. A transcription that does not survive its own diff does not reach
        Stage 1, and the excerpt values may NOT be used to resolve a disagreement.
      terminates_run: >-
        Yes, by pause. Acquisition failure is reported as an access and
        infrastructure outcome (GOAL-FRODO-001.pause_conditions), never as evidence.
    stage_1_table_gate:
      cost: "<= 300 s, milliseconds of compute"
      content: "C1, C3, C4 in exact integer arithmetic; C2 and C5 in exact rationals; positive_control_1; measured_null_1 and measured_null_2."
      terminates_run: >-
        YES, AND THIS IS THE CHEAPEST DECISIVE GATE IN THE CONTRACT. If C1 fails on a
        table that survived its own transcription diff, the run HALTS and reports a
        transcription or document defect. Everything downstream would be void
        regardless of how carefully it were computed. Cost of finding out:
        milliseconds.
    stage_2_pipeline_nulls:
      cost: "<= 600 s"
      content: "Build the pipeline; run measured_null_3 (Rademacher, exact) and measured_null_4 (degenerate); run the nearby-object control."
      terminates_run: "Yes, on any Rademacher inequality or any non-zero degenerate result."
    stage_3_positive_control:
      cost: "<= 1800 s"
      content: "positive_control_2: exact pipeline against seeded Monte-Carlo at a raised failure rate."
      terminates_run: "Yes. If the exact value falls outside the sampling interval, halt; no negative may be reported."
    stage_4_mutation:
      cost: "<= 3600 s"
      content: >-
        The mutation control and graded_control_1, computed and hash-committed BEFORE
        the unmutated published table is evaluated. This ordering is
        GOAL-FRODO-001.next_action's explicit instruction and is not negotiable.
      terminates_run: "Yes, on a response outside the acceptance band."
    stage_5_recomputation:
      cost: "<= 21600 s, <= 8 GB, THE EXPENSIVE AND EXPENDABLE STAGE"
      content: >-
        graded_control_2 (reduced-dimension ladder) first, then the certified
        enclosure at the true dimensions, smallest parameter set first, evaluated at
        the three thresholds. Apply the frozen decision rule.
      terminates_run: >-
        No, but it may be abandoned. Abandonment reports the ladder, the enclosure
        achieved, and the budget outcome AS A BUDGET OUTCOME -- never as evidence
        about the number being computed (AGENTS.md rule 5, and
        GOAL-FRODO-001.pause_conditions in its own words).

  metrics:
    primary:
      - "C1 as an exact integer, per parameter set, against the stated power of two"
      - "C2 relative residual as an exact rational, per parameter set"
      - "certified enclosure [lo, hi] of log2 DFR per parameter set, as exact rationals, with its width in bits"
      - "the frozen decision rule's verdict per parameter set, with the difference from the published figure in bits"
      - "mutation response in bits, against the pre-derived -0.1671 and the band [-0.33, -0.08]"
      - "Rademacher null: pipeline output against the independently computed binomial tail, exact equality or not"
    secondary:
      - "C4 descent and repeat counts; C5 kurt(chi) and kurt(product) as exact rationals"
      - "graded mutation ladder: five responses and the fitted slope against the derived 38.03 bits per unit of v"
      - "reduced-dimension ladder: fully exact answer beside the enclosure at every rung, and the containment check"
      - "nearby-object control: log2 DFR of the same-variance two-point distribution, and its difference from chi's"
      - "directional bracket: exact log2 DFR against the Gaussian tail at matched variance"
      - "local log-curvature of the tail from the three-threshold evaluation (the discriminator between a scale and a shape difference)"
      - "positive-control sampling interval and the exact value's position in it"
      - "null-arm pass/fail counts out of 100 for each of measured_null_1 and measured_null_2"
      - "the published figure's convention as read (per coordinate / per key; average / worst case) with its reference"

  preregistered_prediction:
    quantity: >-
      The mutation control's response in bits, and the Rademacher null's exact value.
    formula: >-
      Var(X) = 2n v^2 + v with v = Var(chi);
      d log2 DFR/dv = (t^2/(2 Var(X)^2 ln 2)) * (4 n v + 1);
      for the mutation "p_12 -= 1, p_0 += 2", dv = -2*144/M exactly, giving
      Delta log2 DFR = -(d log2 DFR/dv) * (2*144/M).
      Rademacher null:
      P(|X| >= t) = 2 * sum_{j : 2j-(2n+1) >= t} C(2n+1, j) / 2^{2n+1}.
    source: >-
      Derived in H-FRODO-e0c651.mechanism and IDEA-20260805-411b60.mechanism. The
      tail-slope step is HEUR-FD-2 (Gaussian slope), which is exact for a Gaussian
      and approximate for the leptokurtic sum X actually is -- which is why the
      acceptance band is a factor of two and why the derived value is expected to
      slightly OVER-estimate the true response in magnitude. The Rademacher formula
      is exact and unconditional.
    prediction: >-
      Mutation response -0.1671 bits, band [-0.33, -0.08]. Rademacher null exact to
      the last bit. Graded ladder monotone with responses in ratio 1:2:4:8:16 to
      within 15 per cent at u <= 8. Nearby-object control differing from chi by more
      than 5 bits. Exact log2 DFR strictly above the Gaussian bracket of -148.84 at
      Frodo-640 under the recalled parameters.
    not_predicted: >-
      WHETHER THE PUBLISHED FAILURE RATES REPRODUCE. Predicting agreement would be
      predicting the answer to the question the goal exists to ask; predicting
      disagreement would be worse. Only the decision rule is frozen.
    frozen_decision_rule: >-
      |recomputed - published| in bits of log2 DFR: below 0.5 = REPRODUCED WITHIN THE
      PUBLISHED FIGURE'S OWN PRINTED PRECISION (one decimal place in the exponent is
      +/- 0.05 bits of slack, so 0.5 bits is ten times the document's own
      resolution). Above 2.0 = STATED DISCREPANCY with its size. Between =
      INCONCLUSIVE, with the enclosure width reported beside it. FURTHER, FIXED HERE
      BEFORE ANY NUMBER IS SEEN: a difference of about 6 bits is read FIRST as the
      per-coordinate versus per-key convention (log2 of 64 coordinates) and only
      SECOND as an error in the document. THE RULE MAY NOT BE REVISED AFTER ANY
      NUMBER IS OBSERVED (EV-IC-002 precedent).

  scale_relevance:
    tier: crypto
    justification: >-
      The convolution is performed at FrodoKEM's true dimensions with the true
      table and the true threshold. There is no toy proxy, no extrapolation and no
      correspondence trick, so the ARITHMETIC conclusion transfers to the real
      parameters because it is computed there. The reduced-dimension ladder is a
      validation of the enclosure machinery, not a source of the result, and every
      artifact must label it as such.
    limit: >-
      Crypto tier applies to the arithmetic statement ONLY, and it is further
      conditioned on the enclosure width: an enclosure wider than the decision rule's
      thresholds supports no verdict at all. Every security reading remains TOY. If
      the true-dimension stage is abandoned and only the ladder completes, the
      resulting claim tier drops to TOY and must be recorded as such -- a ladder
      result is never a crypto-scale result.
    correspondence: null

  replication:
    seeds: [60601344, 60601345, 60601346]
    independent_instances: 3
    interpretation: >-
      The table gate, the Rademacher null, the reduced-dimension ladder and the
      enclosure are deterministic; their three replicates must agree bit for bit and a
      byte-level disagreement is an integrity failure that invalidates the package.
      Only the random-table nulls and the Monte-Carlo positive control are stochastic,
      and their seeds are declared above.

  budget:
    wall_clock_seconds_per_run: 28800
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 3
    maximum_workers: 1
    no_network_during_computation: true
    stage_budgets:
      stage_1: 300
      stage_2: 600
      stage_3: 1800
      stage_4: 3600
      stage_5: 21600
    environment_note: >-
      Stages 1 to 4 use only the Python standard library, deliberately: the container
      is DISPUTED by two independent 2026-08-05 sweeps, one reporting no numpy, no
      sympy, no Sage and no fpylll verified by pip list, the other reporting a null
      run with numpy 2.4.6 on the same machine. THE EXECUTOR MUST RUN THE IMPORT
      ITSELF AND RECORD THE RESULT IN THE MANIFEST BEFORE COSTING STAGE 5. If Stage
      5's cheapest path needs an absent package, that is an INFRASTRUCTURE REQUEST,
      not an experimental result (AGENTS.md rule 3).

  stopping_rules:
    - Do not execute while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Do not execute any stage consuming a FrodoKEM figure until the source gate's prerequisite deliverables are committed.
    - Stop at Stage 1 if C1 fails on a twice-transcribed table, or if positive_control_1 fails.
    - Stop at Stage 2 if the Rademacher null is not reproduced exactly, or the degenerate null returns non-zero.
    - Stop at Stage 3 if the exact value falls outside the Monte-Carlo interval.
    - Stop at Stage 4 if the mutation response falls outside [-0.33, -0.08] bits.
    - Stop at Stage 5 if the enclosure fails to contain the fully exact answer at any ladder rung.
    - Stop before the treatment comparison if the ordering control's hash commitment is absent.
    - Stop on exhaustion of any stage budget and report the exhaustion as a budget outcome.

  invalidation_rules:
    - Any floating-point value in a reported primary metric.
    - Any comparison of a recomputed failure rate to a published figure made before the ordering control's commitment.
    - Any revision of the frozen decision rule, the mutation acceptance band, the C2 bands or the six-bit convention reading after a number has been observed, other than through a versioned protocol amendment recorded as exploratory_only.
    - Any use of the provisional excerpt values in a reported result.
    - Any reported enclosure whose containment was not validated at every ladder rung.
    - Any statement combining an arithmetic-tier and a security-tier conclusion into one claim.
    - Any costing of a discrepancy inside this package (out of contract; a separate record at a separate tier).
    - Any derivation of a sieve, BKZ, core-SVP or lattice-estimator cost (out of lane, GOAL-FRODO-001.non_duplication).
    - Any use of the words break, attack or vulnerable about FrodoKEM in any artifact of this package.

  success_criterion: >-
    THIS DRAFT HAS NO CURRENT SUCCESS OUTCOME BECAUSE IT IS NOT AUTHORIZED FOR
    EXECUTION. If a separately approved, frozen and authorized successor is executed,
    its only positive disposition is a complete readout in which: C1 returns the
    stated power of two exactly at every parameter set and C2, C4, C5 fall inside
    their declared bands; positive_control_1 passes; the Rademacher null is
    reproduced bit for bit and the degenerate null returns exactly zero; the
    nearby-object control differs from chi by more than 5 bits; positive_control_2's
    exact value lies inside the sampling interval; the mutation response lies inside
    [-0.33, -0.08] bits and the graded ladder is monotone with the derived slope; the
    enclosure contains the fully exact answer at every ladder rung; and a certified
    enclosure of width below 0.05 bits is reported for each parameter set with the
    frozen decision rule's verdict and the tail's local log-curvature beside it.
    THAT DISPOSITION ESTABLISHES NO ATTACK, NO EXPONENT, NO SECURITY CLAIM ABOVE
    TOY, AND NOTHING ABOUT LWE.

  falsification_criterion: >-
    The package falsifies H-FRODO-e0c651 if any of: C1 fails on a twice-transcribed
    table (F1, and everything downstream is void for that parameter set); the
    Rademacher null is not reproduced exactly (F2, hard pipeline failure); the
    mutation response falls outside the band (F3, control failure blocking any
    reproduction claim -- distinguish a HEUR-FD-2 failure from a pipeline failure by
    whether the graded ladder is linear); the nearby-object control returns a result
    within 5 bits of chi's (F4, the pipeline responds to variance rather than to the
    tail); the enclosure fails containment at a ladder rung (F5, HEUR-FD-3 refuted);
    or the exact result falls below the Gaussian bracket (F6, wrong parameters or
    broken pipeline). NOTE F7, FIXED IN ADVANCE: a discrepancy of about 6 bits is
    read FIRST as a convention difference and only SECOND as a document error.

  outcomes:
    no_execution_authorization: >-
      The only current disposition. Review-required draft; no run, no observation,
      no evidence, no mathematical inference.
    future_clean_readout: >-
      Only after separate approval, freezing, authorization, a committed source
      filing, and a valid execution. Arithmetic conclusions at crypto tier
      (conditioned on the enclosure width), security conclusions at toy tier,
      recorded separately and never merged.
    future_discrepancy: >-
      A stated discrepancy with its size, at ARITHMETIC tier only. It is a
      documentation or analysis defect until costed with a charged attacker cost and
      independently reviewed (RQ-FRODO-3260cc.constraints). It is not an attack and
      may not be described as one. If a discrepancy is proposed as a breakthrough or
      as contradicting established evidence, AGENTS.md rule 12 routes it to
      independent review-breakthrough at max effort before anything is written up.
    ladder_only_outcome: >-
      If Stage 5's true-dimension enclosure is abandoned on budget, the package still
      reports the table gate, all controls, the mutation ladder and the
      reduced-dimension ladder, at TOY tier, with the budget outcome stated as a
      budget outcome. THAT IS A COMPLETE DELIVERABLE, not a failure; a run that stops
      without emitting it HAS NOT FINISHED.
    source_acquisition_failure: >-
      Reported as an access and infrastructure outcome per
      GOAL-FRODO-001.pause_conditions. NEVER evidence about any FrodoKEM quantity.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, missing dependency or memory exhaustion is infrastructure
      signal and is NEVER negative mathematical evidence about H-FRODO-e0c651 or
      about FrodoKEM (AGENTS.md rule 5).

