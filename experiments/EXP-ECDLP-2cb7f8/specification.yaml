        "finite_y_zero": "P=(a,0): t=y; set y=t and x=a+sum_{k=1}^4 d_k*t^k. Solve t^2-x^3-x-1=0 recursively modulo t^5 using 3a^2+1!=0. If that derivative is zero, the smoothness/membership gate fails; do not apply an invalid division. Local basis is (1,x,y,x^2).",
