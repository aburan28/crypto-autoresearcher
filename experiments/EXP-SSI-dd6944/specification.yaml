experiment:
  id: EXP-SSI-dd6944
  hypothesis_id: H-SSI-4295dc
  derived_from_idea: IDEA-20260821-f48215
  question_id: RQ-SSI-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Heuristic-validation of structured-target covering (H3) and ball growth (H4) at three toy primes,
    with a matched-random-target null, radius-stratified accounting and a symbolic frontier fixture
    that must reproduce Delfs-Galbraith at s = 0
  objective: >-
    The one uncertainty a run reduces is whether the SOLE heuristic under the batch preprocessing
    frontier -- that a streamed smooth-degree codomain list hits the structured set W_s at the rate a
    uniformly random set of the same cardinality would -- holds at measurable scale, and if not, in
    which direction it fails. A run establishes (i) that the symbolic frontier reproduces
    Delfs-Galbraith at s = 0, whole-graph tabulation at s = 1/2 and (p^{1/3}, p^{2/3}) at s = 1/6,
    which is a gate rather than a result; (ii) the hit-rate ratio against the covering prediction,
    PER BALL-RADIUS STRATUM, at three toy primes and three list radii, with a matched-random-target
    null and a shuffled-list control whose forced value is exactly the covering bound; (iii) measured
    ball growth against p^{1/2} 2^r compared with a matched random anchor set, which separates
    clustering of V_p from ordinary saturation; and (iv) the single-instance total with precomputation
    charged, measured rather than merely derived, which is the record's own negative headline. NO
    EXPONENT IMPROVEMENT is claimed here or would follow from a run.
  what_this_is_not:
    - >-
      Not a single-instance algorithm and not an exponent improvement. Every point of the frontier
      costs at least p^{1/2+o(1)} for one instance once precomputation is charged, which is strictly
      worse than the incumbent p^{1/3+o(1)}.
    - >-
      Not a statement, an implication, or a structure suggesting that a p^{1/4} algorithm over
      F_{p^2} exists, is likely, or is nearly obtained.
    - >-
      Not a concrete security prediction. The illustrative NIST-I figures in the parent proposal are
      exponent arithmetic sitting above a disclosed superpolynomial o(1).
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope, at the executed toy primes, radii and list radii, the measured
      hit-rate ratio against the covering prediction lies inside or outside a stated band, per radius
      stratum, and the measured ball growth departs or does not depart from p^{1/2} 2^r earlier than a
      matched random anchor set does. WHAT DOES NOT FOLLOW: nothing about the hit rate at
      cryptographic p, since this heuristic has no known route to cryptographic-scale validation;
      nothing about single-instance cost, which the frontier's own arithmetic already bounds below by
      p^{1/2}; and no attack, no exponent movement and no security consequence.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking gate). Emit the symbolic frontier and its three calibration
      slices with a frozen fixture asserting (p^{1/2}, p^{1/2}) at s = 0, (p^{o(1)}, p) at s = 1/2,
      (p^{1/3}, p^{2/3}) at s = 1/6, and the single-instance domination statement
      p^{1/2+s} + p^{1/2-s} >= p^{1/2}. If the s = 0 slice does not return Delfs-Galbraith, STOP; the
      cost model is wrong and nothing else is recorded. STAGE 1 (small compute). At three primes with
      log2 p in [20, 40], enumerate the supersingular vertex set V, identify V_p, BFS from V_p to
      radius R assigning each vertex to its MINIMAL radius, and record |W_r| against p^{1/2} 2^r;
      construct a MATCHED RANDOM ANCHOR SET of cardinality |V_p| and repeat the BFS. STAGE 2 (the
      heuristic arm). For at least 200 uniformly random target curves E per prime, stream
      smooth-degree codomains and measure the hit rate against W_s, STRATIFIED BY BALL RADIUS, at
      three list radii X, together with the matched-random-target null, the shuffled-list control and
      the decay control. STAGE 3 (correctness). Expand every pullback and verify it does not act as a
      scalar on a random torsion basis. STAGE 4 (zero compute). Report the ratios with bootstrap
      intervals, the measured saturation radius, the measured (time x storage)/p at at least three
      values of s, and the single-instance total against p^{1/2}.
    instrument: >-
      Exact vertex-set enumeration and modular-polynomial isogeny steps at toy primes, with the
      2-isogeny graph for the ball and smooth-degree cyclic isogenies for the streamed list. Vertices
      are assigned to minimal radius so the stratified accounting is exact. Hit rates are computed
      per (prime, radius stratum, list radius, arm) with bootstrap intervals over targets. The
      shuffled-list control replaces streamed codomains by uniformly random vertices, whose forced
      value is exactly the covering bound N|W|/|V|. Recorded through harness/runner.py.
    parameters: >-
      Three primes with log2 p in [20, 40], declared numerically and frozen before any run. At least
      200 target curves per prime. Ball radii 0..R with per-stratum reporting, R chosen so the ball
      reaches saturation at each prime. Three list radii X, declared before any run, for the decay
      control. At least three storage exponents s for the time x storage arm. SAMPLE-SIZE
      JUSTIFICATION, derived from the smallest probability the design must resolve: the per-target
      hit probability is N|W_s|/|V|; the streamed list length N per target is set so the EXPECTED hit
      count per target is at least 5, and with at least 200 targets per (prime, radius stratum, list
      radius) cell the expected total hit count per cell is at least 1000, whose Poisson relative
      standard error is at most 3.2 percent -- comfortably inside the [0.8, 1.25] acceptance band the
      contract must decide. Any cell whose realized hit count falls below 100 is REFUSED rather than
      reported, since its interval cannot decide the band.
  controls:
    - >-
      PRIMARY NULL, MATCHED RANDOM TARGET SET: replace W_s by a uniformly random subset of the vertex
      set of the SAME cardinality and measure the hit rate of the same streamed list. FORCED VALUE:
      the two rates must agree, because the frontier assumes W_s behaves like a random set of its
      size. A DIFFERENCE IS THE FINDING, in either direction, and its sign selects outcome B or C.
    - >-
      RADIUS-STRATIFIED HIT ACCOUNTING (defeats the named observation collision): a hit into V_p
      itself at radius 0 is a much denser event at small r than a hit into the ball proper, and
      pooling them would inflate the measured rate at exactly the toy parameters where r is forced to
      be small. Rates are reported PER STRATUM, never pooled.
    - >-
      SHUFFLED-LIST CONTROL: recompute the hit rate with streamed codomains replaced by uniformly
      random vertices. FORCED VALUE exactly N|W|/|V|. This separates "the list is unusual" from "the
      target set is unusual" and is what makes a deviation attributable.
    - >-
      DECAY CONTROL at three list radii X. A genuine deviation must SHRINK as X grows, because a
      longer smooth walk mixes. A deviation constant in X is the canonical artifact signature of
      docs/inventor-protocol.md section 3 and is reported as an artifact, not a finding.
    - >-
      MATCHED RANDOM ANCHOR SET of cardinality |V_p| for the ball-growth arm, which is what isolates
      clustering of V_p from ordinary saturation. Without it, "the ball saturated" is uninterpretable.
    - >-
      WITNESS-VALIDITY CHECK (correctness positive control): for every hit, expand the pullback and
      verify it does not act as a scalar on a random torsion basis. FORCED VALUE 1.00. A construction
      producing scalars is broken and no rate from it counts.
    - >-
      SYMBOLIC FIXTURE for the three calibration slices and the single-instance domination statement,
      run at Stage 0 as a blocking gate.
    - >-
      DEGENERACY GATE: a prime at which the ball saturates within two steps has almost no dynamic
      range; such a cell is reported as a scope limit, not as a measurement.
  independent_variables:
    - prime, one of three declared values with log2 p in [20, 40]
    - ball radius stratum r, from 0 to R
    - list radius X, one of three declared values
    - storage exponent s, at least three declared values
    - >-
      target set arm, one of the true ball W_s or the matched random target set of equal cardinality
    - list arm, one of the streamed smooth-degree list or the uniformly shuffled list
    - anchor arm, one of V_p or the matched random anchor set of equal cardinality
  metrics:
    primary:
      - >-
        hit_rate_over_covering_prediction, units a dimensionless ratio, computed as (measured number
        of targets whose streamed list meets W_s, divided by the number of targets) divided by the
        covering prediction 1 - exp(-N|W_s|/|V|), reported per prime, per radius stratum, per list
        radius, with a bootstrap interval over targets. FORCED VALUE 1.00.
      - >-
        ball_growth_ratio, units dimensionless, computed as |W_r| / (|V_p| * 2^r) at each radius r,
        reported against the same quantity for the matched random anchor set, with the radius at which
        it first falls below 0.8 reported as the measured saturation boundary
      - >-
        measured_time_times_storage_over_p, units dimensionless, computed as (measured per-instance
        streamed-list length) x (measured stored-vertex count) divided by |V| scaled to p, at at least
        three values of s. FORCED VALUE 1.00 up to p^{o(1)}.
      - >-
        single_instance_total_over_p_half, units dimensionless, computed as (precomputation cost in
        modular-polynomial steps + per-instance streamed-list length) divided by p^{1/2}, per s.
        FORCED to be at least 1.0.
    secondary:
      - >-
        nonscalar_pullback_fraction, units a fraction in [0,1], computed as the fraction of expanded
        pullbacks not acting as a scalar on a random torsion basis. FORCED VALUE 1.00 exactly; any
        deviation is a bug, not a statistic.
      - >-
        shuffled_list_control_ratio, units dimensionless, computed exactly as the primary hit-rate
        ratio but with uniformly random vertices in place of streamed codomains. FORCED VALUE 1.00.
      - >-
        matched_random_target_ratio, units dimensionless, the primary null's own hit-rate ratio
      - >-
        decay_slope_in_X, units ratio change per list-radius step, computed by least squares on the
        three list radii, with an interval
      - >-
        realized hit counts per cell, units count, reported so a refused cell is visible rather than
        absorbed
      - >-
        precomputation cost in modular-polynomial steps and peak stored-vertex count, units steps and
        vertices, per prime and per s
      - >-
        wall_seconds and peak_rss_gb per stage
  heuristic_under_test:
    id: H3
    formal_statement: >-
      STRUCTURED-TARGET COVERING. For a uniformly random supersingular E over F_{p^2}, with C_N(E) the
      set of the first N distinct codomains of smooth-degree cyclic isogenies from E and W the
      radius-r ball around the F_p-rational locus with |W| = p^{1/2+s} and s < 1/2,
      Pr[C_N(E) intersect W non-empty] = 1 - exp(-Theta(N |W| / |V|)), uniformly for N|W| between
      p^{1-eps} and p^{1+eps}.
    companion_heuristic:
      id: H4
      formal_statement: >-
        BALL GROWTH. For 2^r <= p^{1/2-eps}, the radius-r non-backtracking ball around the
        F_p-rational locus has cardinality Theta(p^{1/2} 2^r).
    scale_access_and_transfer: >-
      NO EXACT CORRESPONDENCE IS AVAILABLE. Unlike a Deuring-side sampling shortcut, this measurement
      needs the graph's GLOBAL geometry rather than one curve's lattice, so it can only be run where
      the vertex set is enumerable. TRANSFER ASSUMPTIONS, RECORDED: (T1) toy primes have tiny V_p, so
      the measured ratio bounds nothing at cryptographic p and is reported as a toy-scale bound only;
      (T2) the ball saturates quickly at toy scale, so only small s is testable and the large-s end of
      the frontier is UNTESTED BY CONSTRUCTION; (T3) this heuristic therefore has NO known route to
      cryptographic-scale validation, which is the honest ceiling of the evidence.
  preregistered_prediction:
    quantity: >-
      hit_rate_over_covering_prediction, per prime and per radius stratum, and ball_growth_ratio
      against the matched random anchor set.
    formula: >-
      Predicted, before any run: hit_rate_over_covering_prediction = 1.00, accepted at the tested
      scope if it lies in [0.8, 1.25] at three toy primes and three radii; ball_growth_ratio = 1.00
      while 2^r <= p^{1/2-eps}; nonscalar_pullback_fraction = 1.00 exactly;
      measured_time_times_storage_over_p = 1.00 up to p^{o(1)}; single_instance_total_over_p_half at
      least 1.0 for every s. Under the alternative that the F_p locus is clustered or biased, the hit
      ratio lies outside [0.5, 2.0] at two or more primes with the shuffled control at 1.00 and the
      deviation decaying in X.
    source: >-
      Pre-registered as heuristics H3 and H4 in the parent proposal IDEA-20260821-f48215, whose
      covering prediction N|W|/|V| is an exact forced value derived from the expander mixing lemma
      applied to the graph's quasirandomness, and whose acceptance band [0.8, 1.25] and finding band
      outside [0.5, 2.0] are stated there before any run exists. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at three primes with log2 p in [20, 40], where the full supersingular vertex set is
      enumerable and V_p is a few dozen to a few hundred curves. That enumerability is the entire
      design: the covering prediction is EXACT at these primes and can be compared without any
      approximation. The cost is that the ball saturates after few steps, so the dynamic range in s is
      small and the large-s end of the frontier is untested. The transfer assumption is stated in
      full under heuristic_under_test and is explicitly NOT used to claim any hit rate at
      cryptographic p.
    correspondence: null
  tail_checks:
    - >-
      Report the hit-count distribution per cell, not only the mean, and REFUSE any cell with fewer
      than 100 realized hits rather than reporting a ratio from it.
    - >-
      Report the radius-0 stratum (hits landing in V_p itself) separately at every prime, since it is
      the collision the design exists to separate and it dominates at small r.
    - >-
      Report the most extreme target (the one whose streamed list met W_s soonest and the one that
      never met it) against its predicted probability, so a heavy tail is visible.
    - >-
      Report the ratio's upper and lower bootstrap halves separately, so an unstable ratio driven by a
      few targets cannot be averaged away.
    - >-
      Report the measured saturation radius per prime and per anchor arm, since a saturation earlier
      than the matched random anchor set is exactly the H4 falsifier.
  replication:
    seeds:
      - 20260821
      - 20260822
      - 20260823
    independent_instances: 3
  budget:
    wall_clock_seconds: 10800
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 8.0
    memory_gb: 16
    maximum_memory_gb: 16
    maximum_runs: 24
  stopping_rules:
    - >-
      Abort the whole line if the Stage 0 symbolic fixture fails at s = 0, s = 1/6 or s = 1/2, or if
      the single-instance domination statement does not evaluate as claimed.
    - >-
      Abort the run if any expanded pullback is scalar; the construction is broken and nothing is
      reportable.
    - >-
      Refuse and report any (prime, stratum, list radius) cell with fewer than 100 realized hits,
      rather than emitting a ratio from it.
    - >-
      Report a prime whose ball saturates within two steps as a SCOPE limit, and do not read a
      hit-rate verdict from it.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The acceptance band [0.8, 1.25], the finding band outside [0.5, 2.0], the primes, radii and list
      radii are frozen before data generation and are not revised after seeing any ratio.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose matched-random-target null arm is missing, or whose null arm was not executed in the
      same invocation as the signal arm, is invalid_measurement: the comparison the contract exists to
      make was not made.
    - >-
      A run whose shuffled-list control does not return the covering bound is invalid_measurement; the
      instrument, not the target set, is then the unusual object and no deviation is attributable.
    - >-
      A run reporting POOLED hit rates rather than radius-stratified ones is invalid_measurement,
      because the named observation collision was not separated.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the Stage 0
    fixture passes at all three calibration slices; nonscalar_pullback_fraction is exactly 1.00; the
    shuffled-list control returns the covering bound within its interval; the matched-random-target
    null arm was executed in the same invocation; and hit_rate_over_covering_prediction is reported
    with bootstrap intervals for every non-refused (prime, radius stratum, list radius) cell,
    alongside ball_growth_ratio against the matched random anchor set,
    measured_time_times_storage_over_p at at least three values of s, and
    single_instance_total_over_p_half. Each is decidable from the primary metrics above. Note
    explicitly: a ratio of 1.00 and a ratio of 0.4 are BOTH successes of the measurement; the
    criterion is about completeness, and the scientific verdict is read from the falsification
    criteria below.
  falsification_criterion:
    - >-
      The measured hit-rate ratio lies outside [0.5, 2.0] at two or more primes, with the shuffled
      control at 1.00 and the deviation decaying in X. H3 IS FALSE AT THE TESTED SCOPE. A DEFICIT
      means the frontier is worse than derived and Delfs-Galbraith's own analysis carries an uncharged
      correction; a SURPLUS means smooth-reachable sets are biased toward the subfield locus. Both are
      findings and they are not symmetric restatements.
    - >-
      Ball growth falls below 0.8 of p^{1/2} 2^r at a radius materially smaller than the matched
      random anchor set's, replicated at two primes. H4 IS FALSE at the tested scope and the storage
      exponent is optimistic.
    - >-
      The Stage 0 fixture fails at s = 0. The cost model is wrong and nothing else in the run is
      recorded.
    - >-
      Any expanded pullback acts as a scalar. The construction is broken and the degree argument is
      misstated; this is a correctness failure, not a statistic.
    - >-
      single_instance_total_over_p_half is measured BELOW 1.0 at any s. Either the precomputation was
      not charged or the accounting is wrong; in neither case is it an algorithmic result, and the
      run is returned for defect analysis.
    - >-
      NOT a falsification: a deviation that is CONSTANT in the list radius X. That is the canonical
      artifact signature and is reported as an artifact.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, and the frozen primes, radii, bands and list radii
    - >-
      raw-result.json carrying every per-target, per-stratum, per-radius, per-arm measurement, not
      summaries, including realized hit counts and refused cells
    - >-
      the matched-random-target null arm's and the shuffled-list control's measurements, in the same
      file as the signal arm
    - >-
      the Stage 0 symbolic fixture's output for all three calibration slices and the single-instance
      domination statement
    - >-
      the per-hit non-scalarity verification results
    - >-
      the pre-registration text with the acceptance and finding bands, written before the first run
      and hashed
    - >-
      certificate kind none for the covering measurement; any claimed non-scalar endomorphism carries
      its own certificate re-verified independently by the run wrapper
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is
      the user's gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented and carries a proof_search_map; that map must be audited
      against KN-TECH-080 before any expensive arm is authorized. The Stage 0 fixture is the cheap
      part of that audit and should be run first regardless.
    - >-
      The three primes and the three list radii must be declared NUMERICALLY in the frozen contract
      before approval, since the decay control and the sample-size derivation are meaningless without
      them.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-f48215
    authored_at: '2026-08-25'
    note: >-
      Every metric, forced value, control and falsification condition is transcribed from the parent
      proposal's predictions, null_object_control, minimal_test and falsification_conditions blocks,
      or from its heuristic_assumptions H3 and H4. The sample-size derivation (expected hit count at
      least 5 per target, at least 1000 per cell, refusal below 100) is authored here from the
      proposal's own covering prediction, since the proposal states 200 targets per prime but derives
      no resolution from it; that derivation is arithmetic on the forced value, not a measurement.
      Boilerplate identical across contracts by program rule comes from a fixed table. Budgets come
      from the parent's declared estimated_cost of implementation medium and compute low, widened for
      three primes times three radii times three list radii times two target-set arms.
  derivation_gaps:
    - >-
      The three primes are not fixed numerically by the parent proposal, only as a range log2 p in
      [20, 40]. They must be declared before approval, because at the bottom of that range the vertex
      set is a few hundred curves and the measurement has almost no dynamic range.
    - >-
      The smooth-degree list construction (which degrees, in what order, and whether codomains are
      deduplicated) is not specified. Two different constructions give different N for the same
      nominal list, and the covering prediction is a function of N.
    - >-
      The relationship between the list radius X and the streamed list length N is left implicit. It
      must be pinned before approval so that the decay control varies mixing rather than varying N.
    - >-
      The value of eps in "2^r <= p^{1/2-eps}" is unspecified, so the boundary of H4's claimed
      validity is not numerically decidable as written. A coordinator must fix it, or the design must
      report the measured saturation radius INSTEAD of a pass/fail against a boundary.
    - >-
      Whether the pullback non-scalarity check on a random torsion basis is sound at toy primes with
      small torsion is not established; a basis too small could pass a scalar. The torsion basis size
      must be justified before approval.
