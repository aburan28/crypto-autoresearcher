    curves:
      family: 'y^2+xy=x^3+x^2+b over F_(2^n), #E = 2q, q prime'
      per_n: 3
      selection: 'the driver enumerates b upward from 1 and keeps the first three b with #E = 2q, q prime; if
        fewer than three exist at some n it records the count and runs those (never fewer than one); the cell
        table reports curves_used'
      source: design memo; m45-closure-pilot README (object); Coordinator resolution g
    targets:
      rule: 'x(2P) from the seeded stream: the first 10 unique UNSAT targets per (curve, V) and every unique SAT
        target among the first 150, so a cell with three curves has >= 30 UNSAT'
      source: design memo; sample rule per the trial plan (Coordinator, 2026-10-17)
    factor_base:
      V_poly: '{deg < k}'
      V_rand: 'one random k-dimensional F_2-subspace per curve: per (trial seed s, curve index c) the subspace
        seed is the first 8 bytes of sha256("V|" + str(s) + "|" + str(c)) read as an integer; a uniformly
        random full-rank k x n F_2 matrix is drawn with that seed and its row space is V'
      source: design memo; RQ-SEMBIN-fa2e3f scope (both V, since KN-LIT-fa346d Table 1 starred rows differ);
        Coordinator resolution f
    cells:
      source: 'design memo Stage 1 (all k >= 3, |V| >= 8); N = (m-2)n + mk and columns = C(N,<=4) per
        IDEA-20261010-066c44.notes.md section 1; column values at (3,9),(3,11),(3,15),(4,9),(4,11),(4,13),(5,11)
        are the notes/pilot numbers, (3,13) is the notes table row, (5,9,k=3) is evaluated by the same formula,
        124,314; the m45 pilot README quotes about 112,000 for that cell, an underestimate (Coordinator
        resolution l)'
      list:
      - {cell: m3-n9-k3, m: 3, n: 9, k: 3, N: 18, columns_D4: 4048}
      - {cell: m3-n11-k4, m: 3, n: 11, k: 4, N: 23, columns_D4: 10903}
      - {cell: m3-n13-k5, m: 3, n: 13, k: 5, N: 28, columns_D4: 24158}
      - {cell: m3-n15-k5, m: 3, n: 15, k: 5, N: 30, columns_D4: 31931}
      - {cell: m4-n9-k3, m: 4, n: 9, k: 3, N: 30, columns_D4: 31931}
      - {cell: m4-n11-k3, m: 4, n: 11, k: 3, N: 34, columns_D4: 52956}
      - {cell: m4-n13-k4, m: 4, n: 13, k: 4, N: 42, columns_D4: 124314}
      - {cell: m5-n9-k3, m: 5, n: 9, k: 3, N: 42, columns_D4: 124314}
      - {cell: m5-n11-k3, m: 5, n: 11, k: 3, N: 48, columns_D4: 213053}
    closures_per_instance:
      list: [M_3, W_3, M_4, W_4]
      W_5: 'only where columns at D = 5 are <= 4e4 (design memo; threshold confirmed, Coordinator resolution k):
        by C(N,<=5) this is the m3-n9-k3 cell alone (12,616 columns; m3-n11-k4 has 44,552)'
    eliminators:
      m4ri: 'closure.c with libm4ri 0.0.20200125 on this host (the release with a documented large-elimination
        defect, pilot READMEs)'
      independent: 'myclosure.c, bit-packed GF(2), no M4RI; PRIMARY above 50,000 columns (design memo; it used
        109 MB where M4RI used 1.3 GB at m=5 n=7 in pilot #2)'
      rule: both run and must agree wherever both run
    enumerators:
      curve_level: chain_solutions (pilot2_lib)
      boolean: count_chain.c
      point_level: point-level check of every solution; evaluation check at known zeros on SAT instances
      source: design memo; m45-closure-pilot README (labels)
    nulls:
      where: trial RUN-SEMBIN-d8aaa8 (design memo; cell coverage per the trial plan)
      support_matched: same monomials, iid coefficients; >= 10 UNSAT; run at all nine S_3 cells (poly V,
        curve 0)
      dense_matched: boolsys.matched_null; >= 10 labelled; run at the five cells with N <= 30 (m3-n9-k3,
        m3-n11-k4, m3-n13-k5, m3-n15-k5, m4-n9-k3); above that, support null only (Coordinator resolution m)
    block_local_secondary_arm:
      variant: L2adj1 restriction of W_4 (pilot3.py variant naming)
      cells: the m = 4 cells, inside trial RUN-SEMBIN-a7e245 (m4-poly)
      records: columns and refutation rate
      prediction: same refutation rate as full W_4 with fewer columns (design memo; secondary metric, not part
        of the success criterion)
      provenance: 'analysis/ecdlp2m-iteration-20261009/block-local-closure-pilot/results/ (m4-n9 adj1, L2adj1
        rows from the final driver line) and its README once present; aggregate.md for the earlier variants;
        exploratory provenance only'
    censoring:
      per_job_rss_gb: 6
      per_job_wall_s: 1800
      rule: a job exceeding either limit is recorded as censored, never as refuted or not refuted; the cell is
        reported with its censored count; censoring is not evidence (AGENTS.md rule 5; design memo)
  controls:
  - id: C1
    name: pilot gate
    check: "the m=3 n=9 poly cell on pilot #1's n9-poly instance ids (pick_curve seed 0, target seed 0, first 60
      unique UNSAT + all 8 SAT) reproduces 60/60 W_4 refutations of UNSAT and 0/8 false refutations of SAT;
      pass flag 60/60 and 0/8"
    role: baseline embedding; a failed gate voids the run as an instrument defect
    provenance: 'design memo; m3-closure-pilot README n=9 row (reproduced instance-by-instance in pilot #2,
      results/repro-m3-n9-poly.jsonl)'
  - id: C2
    name: m=2 control
    check: 'm=2 chained control at (n,k) in {(9,3),(11,4)}, 20 UNSAT + all SAT targets among the first 100,
      closures W_3 and W_4; W_3 refutes >= 90% of UNSAT and 0 SAT'
    role: 'instrument control, not part of success: a lower-arity object where the degree-3 closure suffices,
      so a flat 4 at m >= 3 is not a property of the instrument'
    provenance: "design memo; pilot #1 m2ctrl (W_3 25/25 UNSAT, 0/35 SAT, 988 columns at D=3;
      m3-closure-pilot aggregate.md and instances/m2ctrl.json); cell parameters by Coordinator resolution e"
  - id: C3
    name: SAT controls
    check: 'on every enumeration-certified SAT instance: contains_one == false at every D run
      (false_refutations == 0) and codim(W_4) == nsol where computed'
    role: soundness of Prop S and of the eliminators; a refuted SAT instance voids the run
    provenance: design memo; pilot READMEs (codim equals the number of solutions on every SAT instance checked)
  - id: C4
    name: nulls
    check: 'support-matched null r_4 >= 0.9 at every S_3 cell (all nine, poly V, curve 0); dense matched null r_4
      <= 0.1 at every cell with N <= 30 (the five cells where it is run; above N = 30 the support null alone is
      run, Coordinator resolution m) (P2)'
    role: separates sparse-support refutation from curve coefficients (support null) and from counting
      (dense null); a dense null with r_4 >= 0.5 makes the cell non-discriminating (IDEA falsification
      condition 2)
    provenance: IDEA-20261010-066c44 prediction 2; design memo
  - id: C5
    name: eliminator cross-check
    check: 'for every job both eliminators ran: identical contains_one, and identical rank where contains_one is
      false (both eliminators stop as soon as 1 enters the closure, so rank at refutation is not canonical);
      elimination_faults == 0'
    role: the host M4RI is the 2020 release with a documented defect; disagreement voids the run
    provenance: design memo; pilot READMEs
  - id: C6
    name: determinism replicate
    check: inside RUN-SEMBIN-d8aaa8 the m=3 n=9 poly cell is rerun with seed 20261017 (the m3-poly trial's
      seed) and its per-instance rows must match RUN-SEMBIN-07f442's field by field with wall_s, peak_rss_mb
      and the rep tag stripped (Coordinator resolution d)
    role: the pipeline is deterministic given the seed; the replicate checks the implementation, not sampling
      noise
    provenance: design memo
  independent_variables:
  - m in {3, 4, 5}
  - (n, k) per the cell list; N = (m-2)n + mk
  - V in {poly, rand}
  - closure in {M_3, W_3, M_4, W_4, W_5 where run}
  - eliminator in {m4ri, independent}
  - instance family in {S_3 curve system, support-matched null, dense matched null, m=2 control}
  - block-local variant in {full, L2adj1} at m = 4 (secondary)
  metrics:
    primary:
    - name: r_4 per cell
      pointer: 'over /instances[] with family == S3, closure_kind == W, D == 4, label == UNSAT, censored ==
        false, grouped by (cell, v_type): count(contains_one == true) / count; with Clopper-Pearson 95%;
        the primary eliminator per cell (independent above 50,000 columns, else m4ri)'
      prediction: P1
    - name: false_refutations
      pointer: 'count of /instances[] with label == SAT and contains_one == true, any family, closure_kind, D
        or eliminator'
      prediction: must be 0 (invalidation, not a prediction)
    - name: M_4 refutation count per cell
      pointer: 'count of /instances[] with family == S3, closure_kind == M, D == 4, label == UNSAT,
        contains_one == true, grouped by (cell, v_type)'
      prediction: P3
    - name: D_W distribution per cell
      pointer: 'per (instance_id, eliminator) with family == S3 and label == UNSAT: min /D over entries with
        closure_kind == W and contains_one == true, or not_refuted_at_max_D; grouped by (cell, v_type)'
      prediction: P1 (descriptive beyond r_4)
    secondary:
    - name: codim equals solution count
      pointer: '/instances[]/codim == /instances[]/nsol on label == SAT, closure_kind == W, D == 4'
      prediction: C3
    - name: eliminator agreement count
      pointer: 'pairs of /instances[] entries equal in (instance_id, closure_kind, D) and differing in
        /eliminator, with equal contains_one and, where contains_one is false, equal rank'
      prediction: C5
    - name: per-job cost fields
      pointer: '/instances[]/cols, /rank, /rows, /iterations, /ops_proxy, /wall_s, /peak_rss_mb, /censored'
      prediction: P4 (descriptive; see heuristic_validation.comparison_metric)
    - name: null r_4
      pointer: r_4 as above with family == NULL (support-matched) and family == NULL2 (dense matched)
      prediction: P2
    - name: m=2 control rate
      pointer: 'r_4-style rate with family == M2CTRL, closure_kind == W, D == 3 (and D == 4), grouped by cell'
      prediction: C2
    - name: block-local columns and r_4 at m=4
      pointer: 'rate and /instances[]/cols with closure_kind == L2adj1, D == 4, against closure_kind == W, D ==
        4 on the same instance_id at the m=4 cells'
      prediction: secondary arm prediction (same rate, fewer columns); no criterion
    - name: ops_to_1 vs N
      pointer: '/instances[]/ops_proxy (the independent eliminator sum over closure iterations of rows x cols)
        with eliminator == independent, family == S3, label == UNSAT, closure_kind == W, D == 4, censored ==
        false, against /instances[]/n, /m, /k (N = (m-2)n + mk)'
      prediction: P4
  preregistered_predictions:
  - id: P1
    claim: Assumption 1 operationalised (D_W = 4) on the UNSAT arm
    test: r_4 >= 0.90 in every S_3 cell m <= 5 with |V| >= 8 (poly and random V)
    source: IDEA-20261010-066c44 prediction 1, copied without adjustment (design memo)
  - id: P2
    claim: sparse-support mechanism, not counting
    test: support-matched null r_4 >= 0.9 and dense matched null r_4 <= 0.1
    source: IDEA-20261010-066c44 prediction 2, copied without adjustment
  - id: P3
    claim: the refutation needs the mutant closure, not the plain Macaulay matrix
    test: M_4 refutes 0 UNSAT S_3 instances at every cell
    source: design memo P3 (IDEA claim "plain Macaulay M_4 refutes none")
  - id: P4
    claim: cost law at fixed D (secondary)
    test: 'log2(ops to 1) grows as a power of N (power-law fit beats 2^(cN) by AIC >= 4 across the ladder);
      operationalised as ops_proxy, the independent eliminator sum over closure iterations of rows x cols,
      pooled over all uncensored S_3 UNSAT cells, AIC comparing log2(ops_proxy) ~ a + b log2 N against
      ~ a + c N'
    source: IDEA-20261010-066c44 prediction 3, copied without adjustment; operationalisation by Coordinator
      resolution h; not part of the success criterion (design memo); power is limited (IDEA notes section 4,
      decidable at m = 3 only)
  preregistered_prediction:
    quantity: r_4 per cell against 0.90; null r_4 against 0.9 (support) and 0.1 (dense); M_4 count against 0;
      the functional form of ops_to_1 in N
    formula: 'P1 r_4 >= 0.90; P2 support >= 0.9, dense <= 0.1; P3 0; P4 power law in N preferred over 2^(cN) by
      AIC >= 4'
    source: IDEA-20261010-066c44 predictions 1-3 and claim; design memo
  heuristic_under_test: A1
  heuristic_validation:
    heuristic: >-
      A1, Semaev 2015 Assumption 1 (KN-LIT-fa346d, wording as recorded in RQ-SEMBIN-fa2e3f): for the Boolean
      systems of eq. (5) at the parameters the paper uses, d_F4 - the maximal total degree of polynomials
      occurring strictly before F4 terminates (Section 4.4) - is at most 4. Quantifiers as tested here: for
      every enumeration-certified UNSAT instance of every tested cell (m in {3,4,5}; (n,k) per the cell list;
      V poly and random; up to three curves per n), 1 in W_4, i.e. D_W = 4; the prediction tolerates a 10%
      non-refuted share per cell (P1).
    source: RQ-SEMBIN-fa2e3f (Assumption 1 statement); IDEA-20261010-066c44 (operationalisation D_W via H1)
    rigorous_support: >-
      D_W <= d_F4 on UNSAT (IDEA notes section 3, derivation sketch, unchecked), so D_W >= 5 on an instance
      implies d_F4 >= 5 there; the converse (d_F4 <= D_W + 1) is heuristic H1 of H-SEMBIN-106967 and is not
      tested here. Columns C(N,<=4) are polynomial in N (IDEA notes section 1).
    operationalization: >-
      W_D is the mutant closure to fixpoint of the Boolean chained-S_3 system with field equations; 1 in W_D
      is a certificate of UNSAT (Prop S). D_W = min{D : 1 in W_D} over the closures run. r_4 is the share of
      UNSAT instances with 1 in W_4. Flat 4 (P1) leaves Assumption 1 not contradicted on the UNSAT arm at the
      tested cells; growth (r_4 < 0.5 at a cell) with the support null still at 4 reads, via the sketched
      inequality, as Assumption 1 measured false at that cell on the UNSAT arm; growth with the support null
      also >= 5 reads as a property of the presentation's support (IDEA notes section 4 reading table).
    what_is_uniform: >-
      Nothing is assumed uniform. The comparison objects are the support-matched null (same monomials, iid
      coefficients) and the dense matched null (same per-degree monomial counts, uniform monomials), which
      separate curve coefficients, sparse support and counting (IDEA proof_search_map observation_collision).
    scale_access: >-
      toy scale only (n <= 15, m <= 5, N <= 48, columns <= 213,053 at D = 4); no correspondence reaches a
      larger scale and no transfer to n = 131 or any cryptographic size is claimed.
    sample_size_justification: >-
      >= 30 UNSAT instances per (cell, V), drawn as the first 10 unique UNSAT targets per (curve, V) over three
      curves: resolves r_4 >= 0.9 against 0.5 with a Clopper-Pearson 95% width
      below 0.2 (design memo). IDEA notes section 4: 30/30 has CP95 lower bound 0.884, 60/60 gives 0.940, and
      30 UNSAT detect a true 20% non-refuted share with probability 1 - 0.8^30 = 0.9987. A rate >= 0.9 at 30
      does not exclude a constant non-refuted share (H4). Nulls: >= 10 labelled per null per cell (design memo).
    comparison_metric: >-
      per (cell, V) r_4 with Clopper-Pearson 95% against 0.90; null r_4 against 0.9 and 0.1; M_4 count against
      0; D_W distribution per cell; P4 by AIC comparison of log2(ops_proxy) ~ a + b log2 N against ~ a + c N
      on independent-eliminator counts pooled over all uncensored S_3 UNSAT cells.
    tail_checks_available: >-
      the D_W distribution per cell reports every non-refuted UNSAT instance individually (the tail of P1);
      the minimal refuting D is reported where W_5 ran; the censored count per cell is reported beside r_4;
      the per-key block-local rate is reported beside the full-W_4 rate on the same instances.
    controls_for_heuristic: C1-C6 above; the dense matched null is the synthetic control of the same shape.
  scale_relevance:
    tier: toy
    justification: >-
      n in {9, 11, 13, 15}, m in {3, 4, 5}, up to three curves per n, |V| in {8, 16, 32}; no cryptographic-scale
      statement; no transfer or extrapolation assumption is made (RQ-SEMBIN-fa2e3f constraints; AGENTS.md
      rule 7).
    correspondence: null
  tail_checks:
  - every non-refuted UNSAT instance is listed with its cell, V, curve and the closures run
  - every censored job is listed with its cell, columns, wall_s and peak_rss_mb
  - the m=5 cells are reported individually with their UNSAT counts, since the inconclusive criterion turns on
    them
  - block-local L2adj1 and full W_4 rates are reported on the same instance ids at every m=4 cell
  replication:
    seeds: [20261017, 20261018, 20261019, 20261020, 20261021, 20261022]
    seed_rule: 20261017 + trial index, trials indexed 0..5 in the order below (design memo)
    independent_instances: 6
    trials:
    - trial_id: m3-poly
      run_id: RUN-SEMBIN-07f442
      seed: 20261017
    - trial_id: m3-rand
      run_id: RUN-SEMBIN-1ca24c
      seed: 20261018
    - trial_id: m4-poly
      run_id: RUN-SEMBIN-a7e245
      seed: 20261019
      note: includes the block-local L2adj1 secondary arm
    - trial_id: m4-rand
      run_id: RUN-SEMBIN-baa77d
      seed: 20261020
    - trial_id: m5-poly-and-rand
      run_id: RUN-SEMBIN-bb9a72
      seed: 20261021
      note: watchdog 50400 s for this trial (design memo)
    - trial_id: nulls-and-controls
      run_id: RUN-SEMBIN-d8aaa8
      seed: 20261022
      note: 'C1; C2 (m=2 control at (9,3) and (11,4)); C6 (the m=3 n=9 poly cell rerun with seed 20261017,
        compared field by field against RUN-SEMBIN-07f442 with wall_s, peak_rss_mb and the rep tag stripped);
        support-matched nulls at all nine S_3 cells (poly V, curve 0) and dense nulls at the five cells with
        N <= 30'
    replication_note: >-
      Three curves per n and two V per curve are the within-cell replication; the C6 replicate is a
      determinism check, not sampling replication. A cell counts only where it is uncensored with >= 20 UNSAT
      instances (success and falsification criteria).
    determinism_excluded_fields: [wall_s, peak_rss_mb, rep tag]
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 36000
    wall_clock_seconds_per_run_overrides:
      RUN-SEMBIN-bb9a72: 50400
    maximum_memory_gb: 6
    maximum_runs: 6
    maximum_workers: 1
    note: 'machine protection only: one worker process; 6 GB RSS cap and 1800 s per job (censoring, not a
      result); a cell whose jobs are censored three times in a row skips its remaining jobs (plan default
      skip_after_consecutive_censored = 3), skipped jobs recorded as censored, never as results; watchdog per
      trial 10 h (m5 trial 14 h); expected 20-30 CPU hours on a 4-CPU 15 GB host (design memo estimate,
      advisory). Not a research budget.'
  stopping_rules:
  - Stop a trial when every (cell, V) of its plan has its first 10 unique UNSAT targets per (curve, V) and every
    unique SAT target among the first 150 run through its closures (>= 30 UNSAT per cell with three curves), or
    its target stream of 150 per (curve, V) is exhausted.
  - A job exceeding 6 GB RSS or 1800 s is censored and recorded; the cell continues; the cell is reported with
    its censored count.
  - A cell whose jobs are censored three times in a row skips its remaining jobs (plan default
    skip_after_consecutive_censored = 3); skipped jobs are recorded as censored, never as results. Machine
    protection, not a research budget.
  - A trial exceeding its watchdog (36000 s; 50400 s for RUN-SEMBIN-bb9a72) stops and is recorded with the
    cells completed; it is failed_infrastructure for the unfinished cells, never a metric value.
  - Stop after the six planned trials have checker-validated outputs; no seventh run without a protocol
    amendment and a new approval.
  - A crash, timeout or memory kill is failed_infrastructure or censoring; never a metric value (AGENTS.md
    rule 5).
  invalidation_rules:
  - any false refutation (a SAT instance with contains_one == true at any D); the run is completed_invalid
  - any eliminator disagreement (contains_one differs between the M4RI and independent eliminators on a job
    both ran, or rank differs on such a job where contains_one is false), or any elimination_faults > 0; the
    run is completed_invalid
  - any enumerator disagreement (chain_solutions and count_chain.c label or solution set differ on an
    instance); the run is completed_invalid
  - any evaluation-check mismatch (evalcheck_mismatch > 0 on a SAT instance with a known zero); the run is
    completed_invalid
  - check.py exits 3 on a run directory (schema violation, recount mismatch of r_4 or false refutations,
    re-labelling disagreement on its seeded sample of >= 10 instances per cell, or codim/solution
    disagreement); the run is invalid
  - C1 pilot gate fails or C6 determinism replicate differs; RUN-SEMBIN-d8aaa8 is invalid and the other
    trials are held for review before any reading
  success_criterion: >-
    SUPPORT (scoped to the tested cells, up to three curves per n, both V, chained S_3, the two eliminators, one
    host class): r_4 >= 0.9 in every uncensored S_3 cell with |V| >= 8 and >= 20 UNSAT instances (P1); P2 and
    P3 hold on every such cell; false_refutations = 0; controls C1-C6 pass; both eliminators agree wherever
    both run; check.py exits 0 on all six runs.
  falsification_criterion: >-
    FALSIFY: any uncensored S_3 cell with |V| >= 8 and >= 20 UNSAT instances has r_4 <= 0.8 (the IDEA's
    pre-registered GROWTH threshold, >= 20% non-refuted) on a checker-valid run with C1-C6 passing (then D_W
    grows with m or n in that cell; the minimal D that refutes is reported where W_5 ran, and the support-null
    reading at that cell is reported beside it). A falsifying value with a failed control goes to independent
    review before the decision.
  inconclusive_criterion: >-
    INCONCLUSIVE: any uncensored S_3 cell with |V| >= 8 and >= 20 UNSAT instances has 0.8 < r_4 < 0.9 (neither
    support nor falsification); or every m=5 cell is censored; or fewer than 20 UNSAT instances in every m=5
    cell. A checker-invalid run is not evidence. A timeout, memory kill or crash is censoring or
    failed_infrastructure, never evidence.
  heuristic_criterion: >-
    P1-P3 pass leaves A1 (Assumption 1) not contradicted on the UNSAT arm at the tested cells, at toy scale,
    via the sketched inequality D_W <= d_F4 only; it never confirms d_F4 <= 4. A falsifying cell with the
    support null still refuted at 4 reads as A1 measured false at that cell on the UNSAT arm; with the support
    null also unrefuted at 4 it reads as a presentation-support effect, not curve structure. A dense null with
    r_4 >= 0.5 makes its cell non-discriminating and excluded from the structural reading. P4 bears on the
    cost-law reading only and never on A1. Assumption 2 is untouched by any outcome (RQ-SEMBIN-fa2e3f
    constraint).
  decision_impact:
    on_positive: >-
      H-SEMBIN-106967 may move to analyzed and, after independent review including a blind recount of r_4 and
      false_refutations from instances[] and an independent re-labelling sample, to supported at the tested
      scope. The reading recorded is "Assumption 1 not contradicted on the UNSAT arm at m <= 5, n <= 15, |V|
      >= 8, both V", which routes the next work to the SAT-arm degrees, the n ladder beyond 15 and W_5 on a
      larger host, and the H1 check with an F4 engine; no cost record, frontier row or speedup claim changes.
    on_negative: >-
      Instrument before theory: the eliminator cross-check, enumerator agreement and C1 gate are re-examined
      and the run goes to independent review first. On a checker-valid falsifying cell H-SEMBIN-106967 is
      weakened at most (a single unreplicated empirical-only run never supports reject_scoped); a replication
      contract at that cell with W_5 and an F4 step-degree reading is the next dispatch; the support-null
      reading decides whether the growth is attributed to coefficients or to the presentation's support.
  interpretation_limits:
  - no speedup is measured or claimed; at fixed D the per-attempt cost is polynomial in N with a prohibitive
    constant on toy sizes (pilot READMEs), and the derivation at
    analysis/ecdlp2m-iteration-20261009/wwit-ecc2k130/README.md is cited only as the reason no cost claim is
    made, not as a result
  - no claim at n = 131 and nothing about the security of any deployed curve in either direction
    (RQ-SEMBIN-fa2e3f)
  - presentation = chained S_3 only (t = m); the direct S_{m+1} presentation is out of scope
  - one host class; wall_s and peak_rss_mb are descriptive and are excluded from the determinism replicate
  - M4RI 2020 caveat; the host libm4ri is 0.0.20200125 with a documented large-elimination defect, so the
    independent eliminator is primary above 50,000 columns and both must agree wherever both run; if libm4ri
    is absent the trial runs independent-only with a recorded flag and C5 is reported as not run
  - the pilots are exploratory provenance for the cell choice only, never evidence; their numbers are quoted
    here as provenance, not as expectations that bind the reading
  - check.py is producer-written; it re-derives schema, recounts r_4 and false refutations, re-labels a seeded
    sample of >= 10 instances per cell with the Boolean C enumerator from source and verifies codim/solution
    agreement; it is still not independent review, which precedes any status move
  - censoring at the 6 GB / 1800 s limits is expected to concentrate on the cells with >= 124,314 columns
    (m4-n13-k4, m5-n9-k3, m5-n11-k3); a censored cell is reported with its count and is never negative
  - the thresholds are the IDEA's pre-registered ones (support at r_4 >= 0.9, falsification at r_4 <= 0.8);
    a cell between them makes the contract inconclusive, and no threshold is moved after a run without a
    versioned protocol_amendment
  - Assumption 1 and Assumption 2 are different claims and are never refuted as one (RQ-SEMBIN-fa2e3f)
