experiment:
  id: EXP-SEMBIN-d9767f
  hypothesis_id: H-SEMBIN-106967
  source_idea: IDEA-20261010-066c44
  question_id: RQ-SEMBIN-fa2e3f
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: 'Heuristic validation of Semaev 2015 Assumption 1 on the UNSAT arm: minimal refuting mutant-closure
    degree D_W of chained-S_3 descended decompositions at m in {3,4,5}, n in {9,11,13,15}, |V| >= 8, poly and
    random V, with support-matched and dense nulls, two eliminators and two enumerators'
  experiment_class: heuristic-validation
  status: review_required
  frozen: true
  designed_at: '2026-10-17'
  designed_under_task: TASK-20261017-083b0f
  approved_by: null
  approval_decision: DEC-20261017-3fa9e1
  execution_authorized: false
  status_note: >-
    Frozen at version 1 and approved 2026-10-17 by DEC-20261017-3fa9e1 under AGENTS.md 'Standing user
    authorization'. The Coordinator checked completeness (controls, metrics, budgets, stopping rules, artifact
    paths, dependencies, launcher) before recording approval; approval asserts nothing about H-SEMBIN-106967.
    Any change after approval is a versioned protocol_amendment under experiments/EXP-SEMBIN-d9767f/amendments/.
    Every number in this contract carries its provenance (design memo, IDEA-20261010-066c44 and its notes, or a
    pilot README); the pilots are exploratory provenance for the cell choice only, never evidence.
  objective: >-
    For each cell (m; n,k) of the Stage-1 ladder, build enumeration-certified chained-S_3 descended
    decomposition systems (t = m, Semaev 2015 eq. (5)) on up to three curves per n (curves_used reported per
    cell) for both V = {deg < k} and a seeded
    random k-dimensional V, label every instance SAT/UNSAT by two independent exhaustive enumerators, run the
    closures M_3, W_3, M_4, W_4 (W_5 where columns <= 4e4) with two GF(2) eliminators, and record per cell the
    UNSAT share refuted by W_4 with its Clopper-Pearson 95% interval, the false-refutation count on SAT
    instances, the M_4 refutation count and the D_W distribution, beside the same statistics on a
    support-matched null and a dense matched null and a block-local secondary arm at m = 4. The experiment
    measures a degree; it measures no cost against rho and claims no speedup.
