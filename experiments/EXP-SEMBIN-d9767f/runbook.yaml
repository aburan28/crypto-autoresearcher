schema: crypto.autoresearch.runbook.v1
experiment_id: EXP-SEMBIN-d9767f
session_id: RBS-SEMBIN-d9767f
title: Run the six frozen closure-degree trials of EXP-SEMBIN-d9767f through the supervisor, in plan order
purpose: >-
  Measures, per cell (m in 3..5; n, k per the plan; V polynomial and random), the share of
  enumeration-certified UNSAT chained-S_3 descended systems refuted by the degree-4 mutant closure
  W_4 (with its Clopper-Pearson 95% interval), the false-refutation count on SAT instances, the
  plain Macaulay M_4 refutation count and the D_W distribution, beside the same statistics on
  support-matched and dense nulls, the m=2 control, the block-local L2adj1 arm at m=4, the C1
  pilot gate and the C6 determinism replicate, with two GF(2) eliminators and two enumerators.
  Observations only; check.py re-derives every count from instances[] and re-labels a seeded
  sample from source. No speedup, no cost against rho and no statement at n = 131 is claimed.
executor_tier: mechanical
approval:
