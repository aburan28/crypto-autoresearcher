environment:
  programs: [python3, git, gcc, sh]
  env:
    PYTHONHASHSEED: "0"
steps:
- id: S01-trials
  kind: trials
  title: Execute the six frozen trials once each, in plan order, under the supervisor claim
  explain: Runs run.py then check.py for every trial of trial-plan.json under the supervisor claim and keeps every output file.
  plan: experiments/EXP-SEMBIN-d9767f/trial-plan.json
  engine: supervisor
  claim:
    ttl_minutes: 840
  timeout_seconds: 50400
  validity:
    files:
    - path: manifest.yaml
    - path: results.jsonl
    - path: instances.json
    - path: raw-result.json
      json: true
      assertions:
      - {pointer: /schema, equals: sembin.closure_degree.result.v1}
      - {pointer: /experiment_id, equals: EXP-SEMBIN-d9767f}
      - {pointer: /hypothesis_id, equals: H-SEMBIN-106967}
      - {pointer: /trial_id, equals: "{trial_id}"}
      - {pointer: /run_id, equals: "{run_id}"}
      - {pointer: /environment/m4ri_available, type: boolean}
      - {pointer: /cells, type: array}
      - {pointer: /instances, type: array}
      - {pointer: /instances, min_length: 1}
      - {pointer: /summary/false_refutations, type: integer}
      - {pointer: /summary/censored_jobs, type: integer}
      - {pointer: /summary/eliminator_disagreements, type: integer}
      - {pointer: /instances_canonical_sha256, matches: '^[0-9a-f]{64}$'}
      - {pointer: /status, in: [completed_valid, completed_invalid]}
  by_trial:
    m3-poly:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - {pointer: /seed, equals: 20261017}
        - {pointer: /run_id, equals: RUN-SEMBIN-07f442}
        - {pointer: /trial_id, equals: m3-poly}
    m3-rand:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - {pointer: /seed, equals: 20261018}
        - {pointer: /run_id, equals: RUN-SEMBIN-1ca24c}
        - {pointer: /trial_id, equals: m3-rand}
    m4-poly:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - {pointer: /seed, equals: 20261019}
        - {pointer: /run_id, equals: RUN-SEMBIN-a7e245}
        - {pointer: /trial_id, equals: m4-poly}
    m4-rand:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - {pointer: /seed, equals: 20261020}
        - {pointer: /run_id, equals: RUN-SEMBIN-baa77d}
        - {pointer: /trial_id, equals: m4-rand}
    m5-poly-and-rand:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - {pointer: /seed, equals: 20261021}
        - {pointer: /run_id, equals: RUN-SEMBIN-bb9a72}
        - {pointer: /trial_id, equals: m5-poly-and-rand}
    nulls-and-controls:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - {pointer: /seed, equals: 20261022}
        - {pointer: /run_id, equals: RUN-SEMBIN-d8aaa8}
        - {pointer: /trial_id, equals: nulls-and-controls}
        - {pointer: /summary/c1, type: object}
        - {pointer: /summary/c6, type: object}
  controls: [nulls-and-controls]
  replay:
    mode: fields
    sample: 2
    compare:
    - file: raw-result.json
      pointers: [/cells, /instances_canonical_sha256, /determinism_excluded_fields, /summary/false_refutations, /summary/m4_refutations, /summary/r4_by_cell]
  on_invalid: stop
  on_failure:
  - when: {timed_out: true}
    class: resource_exhaustion
    action: stop
  - when: {exit_code: 3}
    class: implementation_error
    action: stop
  - when: {validity: false}
    class: invalid_measurement
    action: stop
  tell_on_failure: Report the tool-recorded terminal class and this step's log paths, preserve all files, and stop this session without retry.
