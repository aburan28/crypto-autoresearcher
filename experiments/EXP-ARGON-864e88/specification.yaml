experiment:
  id: EXP-ARGON-864e88
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-504122; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-504122
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact native longest path and maximum antichain width of the full multi-lane Argon2 reference
    DAG as parallelism sweeps at fixed total memory, against a lanes-only forced-value null and a
    window-matched uniform null
  objective: The one uncertainty a run reduces is how the sequentiality of the Argon2 dependency graph
    actually behaves as the parallelism parameter changes, at fixed total memory, on the full multi-lane
    object that no record in this repository has yet built. (i) The decay question -- whether native
    depth falls as 1/p, as the per-lane chain length alone would give, or more slowly because cross-lane
    reference edges stitch lanes into longer paths -- is answered exactly by a linear-time longest-path
    DP over a p sweep and a fitted exponent with residuals. (ii) The attribution question -- whether
    any slower-than-1/p decay comes from the RFC offset transform or merely from the existence of
    cross-lane candidate windows -- is answered only by the window-matched uniform null, which preserves
    the crossing opportunity and destroys the transform. (iii) The instrument question -- whether
    the multi-lane builder is correct at all, which is the single largest risk in this design -- is
    answered by the lanes-only null, whose depth is forced to t*m/p - 1 by construction and which
    must return that value exactly at every p before any real number is read. The run reduces no uncertainty
    about depth robustness under node removal, about tradeoff-attack cost, or about the security or
    adequacy of any parameter set.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the constructed full multi-lane
      reference DAG of the named variants at the declared fixed total m, t values, and swept p, the
      exact native longest path takes the reported integer values, the fitted decay exponent alpha
      takes the reported value with the reported residuals, the maximum antichain takes the reported
      exact values at the three declared cells and the reported lower bounds elsewhere, and these
      differ from the two nulls by the reported amounts. WHAT DOES NOT FOLLOW: nothing about depth
      robustness under node removal, which is a strictly harder quantity this run does not touch;
      nothing about tradeoff-attack cost or attacker advantage; nothing about the safety, adequacy
      or preferability of any p, including the recommended value; nothing about behaviour at recommended
      total memory; and no security consequence of any kind from a decay exponent below 1.'
  inputs:
    procedure: 'STAGE 0 (cost: significant human time): re-read the multi-lane candidate-window and
      segment rules in KN-LIT-7f3c21 directly, since they were not among the independently verified
      C1-C7 claims, and freeze the construction rule, the p sweep, the null definitions and the fit
      procedure as a pre-registration file. STAGE 1 (cost: high human time, the dominant cost of the
      whole design): implement the full multi-lane graph builder for all three variants, with slice
      boundaries, segment finish conditions and cross-lane eligibility. STAGE 2 (cost: negligible):
      implement the lanes-only null and verify its depth equals t*m/p - 1 exactly at every p; do not
      proceed otherwise. STAGE 3 (cost: minutes): run the longest-path DP over the full sweep for
      the real arm. STAGE 4 (cost: minutes): build and measure ten draws of the window-matched uniform
      null across the sweep. STAGE 5 (cost: the compute bottleneck): compute the exact maximum antichain
      at p in {1,2,4} and level-decomposition lower bounds elsewhere. STAGE 6 (cost: negligible):
      fit alpha for the real arm and each null draw, report residuals, and run the depth-times-width
      consistency check. No attack is implemented and no credential data is touched.'
    instrument: Python 3 with numpy for graph construction and the longest-path DP over an explicit
      edge array in generation order; networkx or a hand-written push-relabel min-flow for the exact
      maximum antichain at the three affordable cells only, with the choice declared in the contract;
      exact integer arithmetic for every depth and width value, floating point confined to the log-log
      fit; harness/runner.py for seeding and run manifests. Graph construction written directly from
      KN-LIT-7f3c21, not extracted from any external Argon2 library, so the real arm and both nulls
      share one code path parameterized by the target-selection rule. No Sage, no computer-algebra
      system.
    parameters: Total m fixed at 16384 blocks of 1024 bytes. t in {1, 3}, matching the RFC 9106 recommended
      pass counts. p swept over {1, 2, 4, 8, 16, 32}, bracketing the recommended p=4 by two binary
      orders each way; q = m/p accordingly, from 16384 down to 512. Variants Argon2i, Argon2d, Argon2id.
      Ten independent draws of the window-matched uniform null per cell. For data-dependent variants,
      the input-draw count is inherited from the companion input-ensemble contract in this batch rather
      than chosen here, with a floor of ten. Exact antichain computed at p in {1, 2, 4} only. All
      seed material synthetic and generated in-run; no password, credential, leaked corpus or third-party
      dataset at any stage.
  controls:
  - Lanes-only null with the forced depth value t*m/p - 1, validating the longest-path DP at every
    p.
  - Window-matched uniform null preserving cross-lane opportunity and destroying the offset transform,
    in ten independent draws.
  - p=1 cell, where the real graph, the lanes-only null and the existing p=1 lane records must all
    agree on depth, cross-validating this builder against the rest of the lane.
  - Consistency check that depth times width never exceeds the node count, which any correct pair
    of computations must satisfy.
  - alpha confined to [0,1] by construction, checked as an artifact detector rather than reported
    as a finding.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL ONE, the lanes-only graph: identical construction with every cross-lane
    reference edge deleted and replaced by an intra-lane edge drawn from the intra-lane portion of
    the same window. Its depth is exactly t*m/p - 1 by construction, a forced value, so it validates
    the longest-path DP at every p before any real number is trusted. NULL TWO, the window-matched
    uniform graph: identical candidate windows, including their cross-lane portions, with targets
    drawn uniformly within them, which preserves the OPPORTUNITY to cross lanes and destroys the RFC
    offset transform. For the signal arm to mean anything, null one must return the forced value exactly
    at every p, and the real arm''s alpha must differ from null two''s alpha by more than the spread
    over declared repeated draws. If the real and null-two alphas agree, the correct record is a controlled
    null: the decay of depth with p is set by the window and segment structure alone, and the offset
    transform contributes nothing to it -- a reusable measured obstruction against attributing multi-lane
    depth behaviour to the indexing rule.'
  independent_variables:
  - p, in {1, 2, 4, 8, 16, 32}, at fixed total m
  - t, in {1, 3}
  - variant, in {Argon2i, Argon2d, Argon2id}
  - arm, in {real, lanes-only forced-value null, window-matched uniform null}
  metrics:
    primary:
    - exact native longest path per cell
    - fitted alpha with residuals, real arm and each null draw
    - exact maximum antichain at p in {1,2,4}
    - lanes-only null depth against its forced value at every p
    secondary:
    - level-decomposition antichain lower bound at all p
    - largest p at which real depth exceeds lanes-only depth by more than one percent
    - depth times width against node count
    - fraction of reference edges that are cross-lane, per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exponent alpha describing how native longest path decays with p at fixed total memory,
      for the real graph and for the window-matched uniform null.
    formula: depth(p) = A * p^(-alpha), fitted by least squares on log depth against log p over the
      six swept p values, where depth(p) is the exact longest path of the full multi-lane DAG. Predicted
      alpha <= 0.9 for the real arm; predicted |alpha_real - alpha_uniform| >= 0.05 and outside the
      ten-draw null spread; lanes-only null forced to depth exactly t*m/p - 1, hence alpha exactly
      1.
    source: Pre-registered in the parent proposal IDEA-20260816-504122 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Total m fixed at 16384 blocks, which is one binary order below the second RFC
      9106 recommended tuple''s total of 2^16 KiB and seven below the first tuple''s 2^21 KiB. The
      swept p range brackets the recommended p=4. The fitted alpha is a property of the tested total
      memory; because cross-lane opportunity depends on the ratio of window size to lane length, alpha
      is NOT assumed to be scale-invariant, and no extrapolation to recommended m is performed or
      implied. The transfer assumption, stated: if alpha is reported at recommended m by any successor,
      it must be re-measured there, since the linear cost of the longest-path DP makes that a budget
      question rather than a feasibility one.'
    correspondence: null
  tail_checks:
  - Fit alpha separately on the small-p half and the large-p half of the sweep and report both, since
    a single log-log fit can hide curvature.
  - Inspect the deepest path itself at the largest p, counting how many lane crossings it makes, since
    alpha below 1 with zero crossings would indicate a builder defect.
  - Inspect the cells where lane length falls below the maximum candidate-window size, where boundary
    effects dominate.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt before any real measurement if the lanes-only null returns anything other than its forced
    value at any p.
  - Stop the antichain stage and report level-decomposition bounds only if its wall clock exceeds
    two hours; an unfinished exact antichain is a budget outcome and is never reported as a bound
    being tight.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The lanes-only null returns its forced depth exactly at every p, the full sweep
    completes for the real arm and ten uniform-null draws, and alpha with residuals, the depth table,
    and the antichain values and bounds are reported per cell -- irrespective of whether alpha differs
    from 1 or from the null.
  falsification_criterion:
  - alpha equals 1.0 within fit error at every t and variant.
  - Lanes-only null returns any depth other than t*m/p - 1.
  - Real alpha inside the ten-draw uniform-null spread.
  - alpha outside [0,1].
  - Depth times width exceeds node count at any cell.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-504122
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact multi-lane candidate-window and cross-lane eligibility rule must be re-read from KN-LIT-7f3c21
    and written into the contract verbatim before approval; it was not among the C1-C7 claims independently
    verified per EV-ARGON-209ece, and it is the single load-bearing detail of the construction.
  - Whether to sweep p at fixed total m or at fixed per-lane q is a real design fork with different
    deployment meanings; this contract picks fixed total m and a Coordinator should record why the
    other sweep is deferred rather than wrong.
  - The exact-antichain algorithm is named only as a choice between two options; the Coordinator must
    fix one and bound its cost before approval.
  - The input-draw count for the data-dependent variants is deliberately inherited from a companion
    contract that may not be approved; if it is not, a floor must be set here explicitly.
