experiment:
  id: EXP-ARGON-8357f3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b7f2fe; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b7f2fe
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact oracle-lookahead live-set profile, orphan fraction and integral-to-rectangle ratio
    of the per-lane Argon2 reference DAG at p=1, against a window-matched uniform null and a degree-preserving
    rewiring null
  objective: 'The one uncertainty a run reduces is how much of the area-time rectangle the AT accounting
    charges is actually occupied by a clairvoyant evaluator on the real Argon2 reference DAG, and
    whether that occupancy is a property of the RFC 9106 indexing function or only of the graph''s
    degree and window structure. (i) The occupancy question is answered exactly: two linear passes
    give last-use per block and the live-set profile, with no heuristic and no approximation, so the
    integral-to-rectangle ratio is a computed number and not an estimate. (ii) The attribution question
    is answered only by the degree-preserving rewiring null, which holds the in-degree multiset and
    the backward-pointing structure fixed and destroys everything else; if the real graph''s ratio
    lies inside that null''s spread, the indexing function contributes nothing measurable to retention.
    (iii) The instrument-validity question is answered by two graphs with closed-form live-set profiles
    -- the chain-only graph and the all-reference-block-zero graph -- which the same code must reproduce
    exactly, and by the pre-committed direction of the ratio''s movement as t increases, whose failure
    is an artifact signature rather than a finding. The run reduces no uncertainty about Argon2''s
    security, about any recommended parameter set, or about any adversary''s achievable cost.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the constructed p=1 per-lane
      reference DAG of the named variants at the declared (t, q) grid, the exact live-set profile,
      its peak, its integral, the integral-to-rectangle ratio, the orphan fraction and the lifetime
      distribution take the reported values, and these differ from the two null families by the reported
      amounts with the reported null spreads. WHAT DOES NOT FOLLOW: no adversary can be said to achieve
      the integral; clairvoyance is not an attack capability and is unavailable for data-dependent
      addressing; nothing follows about deployed parameters, about multi-lane graphs, about wall-clock
      or hardware cost, about Argon2''s security, or about the adequacy of any recommended parameter
      set; and a gap between the integral and the rectangle is a statement about an accounting convention
      only.'
  inputs:
    procedure: 'STAGE 0 (cost: hours of human time): freeze the parameter grid, the two null definitions,
      the rewiring sampler and its mixing check, and the pre-committed t-direction, as a pre-registration
      file. STAGE 1 (cost: low): implement the per-lane DAG builder for all three variants at p=1
      directly from KN-LIT-7f3c21, in C or Python with exact integer arithmetic. STAGE 2 (cost: negligible):
      implement the two-pass live-set computation and validate it against the chain-only and all-reference-zero
      closed forms before any Argon2 graph is measured. STAGE 3 (cost: seconds per cell): measure
      the real graph across the grid, with multiple synthetic input draws for the data-dependent variants.
      STAGE 4 (cost: minutes): implement and mix the degree-preserving rewiring sampler, run its mixing
      check, and draw twenty samples per cell; implement the window-matched uniform null and draw
      twenty per cell. STAGE 5 (cost: negligible): measure both null families with the identical code
      path. STAGE 6 (cost: low): assemble the tables, the profile plots showing slice-boundary sawtooth,
      the null spreads, and the t-direction check. No stage implements or evaluates any attack, and
      no stage touches any credential data.'
    instrument: Python 3 with numpy for graph construction and the two-pass accumulation, exact integer
      arithmetic throughout, no floating point in any reported primary metric; a small C helper only
      if q=16384 with forty null draws per cell proves too slow, which is not expected. Driver and
      manifest capture via harness/runner.py so the resolved model, seed and parameters land in the
      run manifest. Graph construction is written directly from KN-LIT-7f3c21 rather than extracted
      from any external Argon2 library, so the null and real arms share every code path except the
      index-selection rule. No Sage and no computer-algebra system anywhere.
    parameters: Variants Argon2i, Argon2d, Argon2id. p=1. t in {1, 3, 6}, where 1 and 3 mirror the
      RFC 9106 recommended tuples' pass counts and 6 exists solely to test the pre-committed t-direction.
      q in {1024, 4096, 16384} blocks per lane, the largest of which equals the second recommended
      tuple's per-lane block count. Twenty independent draws of each null family per cell. For the
      data-dependent variants, ten independent synthetic input draws per cell, all seed material generated
      in-run from declared PRNG seeds; no password, credential, leaked corpus or third-party dataset
      at any stage.
  controls:
  - Window-matched uniform-reference null, same chain and same window, uniform target selection.
  - Degree-preserving rewiring of the real graph, same in-degree multiset, backward-pointing preserved,
    with a declared mixing check.
  - Chain-only degenerate graph with no reference edges, whose live set is exactly 1 at every step,
    verifying the accumulation code against a case with a known closed form.
  - Complete-backward graph in which every block references block 0, whose live set has a second known
    closed form, checking the code in the opposite extreme.
  - The t-monotonicity structural tell, run as a control on the measurement rather than as a result.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both built and measured by the identical pipeline in the
    same invocation. NULL ONE: a window-matched uniform-reference DAG -- same chain, same candidate
    window W(j) at every j, reference target drawn uniformly from W(j) instead of by the RFC transform.
    NULL TWO, and this is the one the bucket directive requires: a degree-preserving rewiring of the
    real graph -- the same in-degree multiset, the same number of edges, the same node count, with
    reference targets permuted subject to remaining backward-pointing. For the signal arm to mean
    anything, both nulls must produce integral-to-rectangle ratios that are computed by the same code
    path and reported alongside, and the real arm''s ratio must sit outside the spread of a declared
    number of independent null draws. If the real ratio lies inside the null spread, the correct record
    is a controlled null: the live-set profile is fully explained by the in-degree distribution and
    the window structure, and the RFC offset transform contributes nothing to it -- which is itself
    a clean, reusable measured obstruction against the recency-bias mechanism narrative.'
  independent_variables:
  - variant, in {Argon2i, Argon2d, Argon2id}
  - t, in {1, 3, 6}
  - q, in {1024, 4096, 16384}
  - arm, in {real, window-matched uniform null, degree-preserving rewiring null}
  metrics:
    primary:
    - integral of L(j) divided by m times T
    - peak live-set size divided by q
    - orphan fraction
    - null spread of the integral-to-rectangle ratio over twenty draws per null family
    secondary:
    - in-degree histogram
    - block-lifetime distribution and its 99th percentile
    - sawtooth amplitude of L(j) at slice boundaries
    - spread of the ratio across the ten synthetic input draws for data-dependent variants
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The integral-to-rectangle ratio of the real per-lane DAG, its difference from the degree-preserving
      rewiring null, and the direction of its movement in t.
    formula: 'R = (sum over j from 2 to T of L(j)) / (q * T), where T = t*q - 1, L(j) = |{i < j :
      last[i] >= j}| and last[i] = max{j : r[j] = i or j = i+1}. Predicted R <= 0.75 for the real
      Argon2i graph at every cell; predicted R_real <= R_rewire - 0.05 and outside the twenty-draw
      null spread; predicted R strictly increasing in t at fixed q.'
    source: Pre-registered in the parent proposal IDEA-20260816-b7f2fe before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p=1 and q in {1024, 4096, 16384}. The largest tested q equals the second
      RFC 9106 recommended tuple''s per-lane block count exactly, so that cell is at recommended lane
      length under the p=1 simplification; the first recommended tuple''s q of 524288 is out of scope
      here only because forty null draws per cell at that q multiplies the cost, not because the measurement
      itself is infeasible -- unlike the depth-reducing-set lane, this computation is linear, so a
      successor experiment could reach it directly. Transfer assumption stated: p=1 excludes cross-lane
      edges, which can only lengthen lifetimes, so every reported ratio is conservative in the direction
      of a small live set relative to a real p=4 run.'
    correspondence: null
  tail_checks:
  - Inspect the 99th percentile and maximum of the block-lifetime distribution, since a small number
    of very long-lived blocks can dominate the integral while leaving the median untouched.
  - Inspect L(j) in the first hundred and last hundred steps of every pass, where window growth and
    pass boundaries make the profile atypical.
  - Inspect the extreme null draws, not just the null mean, and report whether the real value falls
    inside the full observed null range rather than inside a standard-deviation band.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report partial results if wall clock exceeds one hour, recording which cells completed;
    incompleteness is a budget outcome and never a negative result about the graph.
  - Halt the run if either closed-form control fails to reproduce, since every downstream number would
    then be uninterpretable.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both closed-form controls reproduce exactly, all grid cells complete for the
    real arm and both null families, and the integral-to-rectangle ratio, orphan fraction, lifetime
    distribution and null spreads are reported per cell -- irrespective of whether the real arm separates
    from the nulls.
  falsification_criterion:
  - Real ratio inside the degree-preserving null's full observed range at every cell.
  - Real ratio above 0.95 at every cell.
  - Either closed-form control fails to reproduce.
  - Ratio constant in t under exact arithmetic.
  - Orphan fraction differs between real and degree-preserving rewiring, indicating a broken null.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b7f2fe
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The degree-preserving rewiring sampler is not specified here beyond its invariants; a Coordinator
    must fix the sampling procedure and the mixing criterion before approval, because a badly mixed
    sampler quietly makes the strongest null the weakest one.
  - The number of synthetic input draws needed for the data-dependent variants is set at ten by judgement,
    not by a power calculation; a Coordinator should either derive it or record it as arbitrary.
  - Whether the all-reference-block-zero graph's closed form is the right second control, or whether
    a third control with an intermediate lifetime profile is needed, is unresolved.
