experiment:
  id: EXP-CRYPTO-9389a1
  hypothesis_id: H-CRYPTO-21e529
  source_proposal: IDEA-20260807-f73d98
  derived_from_idea: IDEA-20260807-f73d98
  question_id: RQ-CRYPTO-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    A dated per-source retrievability probe with forced-value hosts, a
    challenge-detection gate and PDF artifact validation -- measuring whether the
    inherited source-gate premise blocking 22 research questions and eleven
    never-launched goals is still true from this environment

  objective: >-
    The one uncertainty a run reduces is whether the premise that blocks 22 RQ
    records and eleven draft goals -- that no primary source is reachable from
    this environment -- is true on the run date, and for which named sources. A
    run establishes (i) that the probe can return BOTH verdicts, demonstrated by
    a deliberately non-existent host reporting unreachable and a known-good host
    reporting reachable in the same invocation; (ii) that the probe classifies
    the BODY rather than the status code, demonstrated on a live bot-challenge
    page and on a validated PDF; (iii) a dated per-source verdict table over nine
    declared source classes; and (iv) a count of how many of the 22 gated
    questions have at least one named primary source retrievable on that date.
    NO MATHEMATICAL OR SECURITY CLAIM IS MADE OR WOULD FOLLOW FROM A RUN. No
    source gate is opened by this contract; opening one is a separate Coordinator
    act.
    BUDGET FLOOR NOTE. wall_clock_seconds_per_run is 1800 and maximum_memory_gb
    is 8, both at or above the template floors. The cost is network latency and
    the retry schedule, not compute.

  what_this_is_not:
    - >-
      Not research. It supports no mathematical claim, no security claim, and no
      statement about the ECDLP or any cryptosystem.
    - >-
      Not a reading of any source. A retrieved PDF is a retrieved PDF; the
      transcription work a gate exists to require is created by this measurement,
      not discharged by it.
    - >-
      Not a KN-LIT creation, a citation-provenance upgrade, or a discharge of any
      `recalled` entry anywhere in the corpus.
    - >-
      Not the opening of any question's source gate and not a change to any goal
      status or next_action. Those are Coordinator acts (AGENTS.md rule 1) that
      this contract neither performs nor requests.
    - >-
      Not a circumvention of any access control. A challenge page is RECORDED as
      a challenge and never solved, bypassed or worked around, and no
      authenticated or credentialed endpoint is probed.
    - >-
      Not a durable fact. Every verdict is valid only on its date and for the
      routes and client tried.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output,
      or evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: null
    exact_scope_a_run_could_support: >-
      Maximal supportable scope -- on a stated date, from this execution
      environment, through a stated client and stated routes, each of nine named
      source classes returned a stated HTTP status with a stated content type and
      byte size, whose body was or was not a validated artifact; and a stated
      number of the 22 gated RQ records have at least one named primary source in
      the reachable set.
      WHAT DOES NOT FOLLOW -- no statement about any other date, any other route,
      any other client, or any other environment; no statement that a retrieved
      document has been read or is correct; no statement that any gate should
      open; no statement about the contents of any retrieved source; and nothing
      whatever about the ECDLP or any cryptosystem.

  inputs:
    procedure: >-
      STAGE 0 (reading, zero network). Quote verbatim, with file path and line
      number, the premise sentence in PUBLICATION-CANDIDATES.md and its date.
      Extract from each of the 22 committed RQ records the exact constraint text
      and the specific primary sources it names, and from each of the eleven
      draft goal records the next_action text naming the gate. Classify each
      named source as PROBEABLE (a specific document with a resolvable URL) or
      UNRESOLVABLE (a source class rather than a document), and freeze that
      classification before any request is made. Read the GATHER series and
      KN-OPEN-3f7a21 and record what each says about reachability, or record that
      they could not be read.
      STAGE 1 (forced-value controls, FIRST). In one invocation, probe the
      deliberately non-existent domain and the known-good host. Record both
      verdicts and WRITE them before any other request is issued. If the
      known-good host does not report reachable, STOP and report
      failed_infrastructure. If the non-existent domain reports reachable, STOP
      and report an instrument failure.
      STAGE 2 (the source-class table). Probe each of the nine declared source
      classes, recording per row: URL class, HTTP status, content type, byte
      size, artifact-or-challenge classification, client, and timestamp. Retry
      per the declared schedule and record every attempt, not only the last.
      STAGE 3 (artifact validation). For every body classified as a retrieved
      PDF, parse it as a PDF -- header, trailer, page count -- and record the
      result. A body counted by status code alone is not an artifact.
      STAGE 4 (named-document arm). Probe FIPS 203, FIPS 204 and FIPS 205 on
      nvlpubs.nist.gov specifically, since GOAL-MLDSA-002 is blocked on FIPS 204
      and GOAL-SLHDSA-001 on FIPS 205, and record byte sizes against the parent
      proposal's pre-registered figures.
      STAGE 5 (the count). For each of the 22 gated questions, record how many of
      its PROBEABLE named sources are in the retrievable set, and report the three
      way split: at least one retrievable, none retrievable, no probeable source
      named. Emit the dated verdict table as the committed artifact a gate could
      cite.
    instrument: >-
      Python 3 standard library HTTP client. A single request per source class
      per attempt, with the declared timeout and retry count. PDF validation by
      structural parse, never by status code or content-type header alone. No
      credentials, no authenticated endpoints, no challenge solving, no
      user-agent spoofing intended to defeat a bot posture -- a challenge is
      recorded as a challenge. The client identifier and version are recorded on
      every row. All runs recorded through harness/runner.py.
    parameters: >-
      Nine source classes: nvlpubs.nist.gov, csrc.nist.gov, arxiv.org abstract,
      arxiv.org PDF, eprint.iacr.org abstract, eprint.iacr.org PDF, Crossref,
      DBLP, raw.githubusercontent.com. Two forced-value hosts, one non-existent
      and one known-good. Per-request timeout 30 seconds, 3 attempts per source,
      all attempts recorded. 22 gated RQ records, 11 gated draft goal records.
      Three named documents in the pre-registered arm: FIPS 203, FIPS 204, FIPS
      205.

  controls:
    - >-
      FORCED-UNREACHABLE CONTROL, MUST FIRE, CAN FAIL. A deliberately
      non-existent domain must report UNREACHABLE. A probe that reports
      everything reachable is a control that cannot fail, which is exactly the
      failure mode that produced the current situation in the opposite direction.
      Run in the same invocation as the treatment arm.
    - >-
      FORCED-REACHABLE CONTROL, MUST FIRE. A known-good host must report
      REACHABLE with a validated artifact body. IF IT DOES NOT FIRE, THE
      ENVIRONMENT HAS NO EGRESS: the run is failed_infrastructure and NO verdict
      about any named source may be reported, and in particular the inherited
      premise gains no support (AGENTS.md rule 5). This is the single most
      important control in the contract.
    - >-
      CHALLENGE-DETECTION GATE, CAN FAIL. The probe must classify a body that is
      a bot-challenge page as NOT-AN-ARTIFACT even when the status is not an
      error, and must classify a valid PDF body as an artifact even when the
      status is unusual. The eprint PDF endpoint is the expected live instance.
      A naive status-code reading was wrong in BOTH directions historically and
      the gate exists to catch exactly that.
    - >-
      ARTIFACT VALIDATION CONTROL. Every retrieved PDF is parsed structurally.
      A body counted as a PDF by status code or content-type header alone is a
      contract violation, not a measurement.
    - >-
      ORDERING RULE. The two forced-value hosts are probed, recorded and their
      verdicts written BEFORE any source class or named document is probed, so
      that no source verdict can be reported off an instrument already known to
      be broken or off an environment already known to have no egress.
    - >-
      CLIENT AND DATE CONTROL. Every row carries its client, its routes and its
      timestamp. No verdict is generalised across clients or dates, and a row
      missing any of the three is dropped rather than reported.
    - >-
      ALL-ATTEMPTS CONTROL. Every retry is recorded, not only the successful or
      final one, so that an intermittent source is visible as intermittent rather
      than collapsed into one verdict.
    - >-
      UNIFORM-TABLE SUSPICION CHECK. A verdict table that is uniformly reachable
      or uniformly unreachable across all nine classes is reported as such AND
      flagged, because an environment that returns one verdict everywhere is
      indistinguishable from an instrument that returns one verdict everywhere;
      the forced-value hosts are what separate them and their verdicts are quoted
      alongside.

  independent_variables:
    - source class, over the nine declared classes
    - endpoint kind, abstract page versus PDF, probed separately for arxiv and eprint
    - forced-value arm versus treatment arm
    - attempt index within the retry schedule

  metrics:
    primary:
      - >-
        forced_unreachable_verdict -- the verdict for the non-existent domain.
        Categorical. Forced value UNREACHABLE.
      - >-
        forced_reachable_verdict -- the verdict for the known-good host.
        Categorical. Forced value REACHABLE with a validated artifact.
      - >-
        source_verdict_table -- one row per source class per attempt, carrying
        URL class, HTTP status (integer), content type (string), byte size
        (integer), artifact_or_challenge (categorical), client (string),
        timestamp (ISO 8601 with date).
      - >-
        challenge_classified_correctly -- boolean per row where the body is a
        challenge page, with the discriminating features recorded.
      - >-
        pdf_valid -- boolean per retrieved PDF, from a structural parse, with
        byte size and page count.
      - >-
        gated_questions_with_retrievable_source -- integer out of 22, with the
        three-way split into at-least-one-retrievable, none-retrievable, and
        no-probeable-source-named.
      - >-
        fips_arm -- per-document verdict and byte size for FIPS 203, FIPS 204 and
        FIPS 205, reported beside the parent proposal's pre-registered figures of
        1,252,341, 3,291,746 and 1,055,752 bytes with the difference stated.
    secondary:
      - >-
        per_gated_goal_status -- for each of the eleven draft goals naming the
        gate in next_action, whether its named sources are in the retrievable set.
        Reported as a fact about sources, never as a status change.
      - >-
        unresolvable_source_count -- integer, the number of gated questions naming
        a source class rather than a probeable document. A third outcome that must
        not be folded into either verdict.
      - >-
        premise_quotation -- the verbatim sentence from PUBLICATION-CANDIDATES.md
        with its file path, line number and stated date.
      - >-
        attempt_variance -- for any source whose verdict differed across the three
        attempts, all three verdicts reported rather than one.
      - >-
        prior_art_reading -- what the GATHER series and KN-OPEN-3f7a21 record
        about reachability, or an explicit statement that they could not be read.

  heuristic_under_test: HEUR-SRC-1

  preregistered_prediction:
    quantity: >-
      forced_unreachable_verdict, forced_reachable_verdict, the FIPS arm's three
      verdicts and byte sizes, the eprint PDF endpoint's classification, and
      gated_questions_with_retrievable_source.
    formula: >-
      Forced values, fixed before any request: the non-existent domain returns
      UNREACHABLE; the known-good host returns REACHABLE with a validated
      artifact; the eprint PDF endpoint returns a body classified as CHALLENGE
      rather than artifact; FIPS 203, 204 and 205 return validated PDFs; and
      gated_questions_with_retrievable_source is at least 3. Under the null that
      the inherited premise is still true, every source class returns
      not-an-artifact while the forced-reachable control still fires, and the
      count is 0.
    source: >-
      The session that filed IDEA-20260807-f73d98 measured, on 2026-08-07 and
      OUTSIDE THE HARNESS with no run record, that nvlpubs.nist.gov served FIPS
      203, 204 and 205 as valid PDFs of 1,252,341 / 3,291,746 / 1,055,752 bytes,
      that csrc.nist.gov returned 200, that an arXiv PDF returned 200 and 706,116
      bytes of valid PDF, that an eprint abstract page returned 200 with correct
      metadata, and that only the eprint PDF endpoint returned 403 with a
      Cloudflare challenge body. THOSE FIGURES ARE A PRE-REGISTRATION, NOT
      EVIDENCE. Never tuned to data; a disagreement between them and the run is a
      fact about the date rather than a defect in either.

  scale_relevance:
    tier: null
    justification: >-
      TIER IS NULL AND THE NULL IS THE HONEST ENTRY. This contract instantiates
      no curve, no group and no cryptographic computation at any size. It
      produces no toy, medium or cryptographic evidence about the ECDLP, and
      labelling it `toy` would falsely imply toy-scale ECDLP evidence exists. What
      it measures is the retrievability of documents from this execution
      environment on one date, which has no scale coordinate at all. Transfer
      assumption, stated explicitly: none is made to any other date, route,
      client or environment, and none is permitted.
    correspondence: null

  tail_checks:
    - >-
      Probe each source class three times spaced across the run window rather
      than back to back, so that an intermittent posture -- a rate limit or a
      challenge that appears only after repeated requests -- is visible instead of
      being averaged into one verdict.
    - >-
      Record the FULL body size and the first bytes of every non-artifact body,
      so that a challenge page which changes shape between attempts is detectable
      and a body misclassified as a challenge can be re-examined from the record.
    - >-
      Compare each retrieved FIPS document's byte size against the parent
      proposal's pre-registered figure and report the difference explicitly. A
      document that retrieves at a substantially different size is either a
      revised document or a truncated retrieval, and both must be visible rather
      than collapsed into a boolean.
    - >-
      Record the verdict for the arxiv and eprint ABSTRACT and PDF endpoints
      separately and never merge them into a per-host verdict, since the parent
      proposal's central observation is that they differ on one host.

  replication:
    seeds: []
    seeds_note: >-
      EMPTY AND JUSTIFIED. The probe performs no random sampling: the source
      classes, the forced-value hosts and the named documents are an exhaustively
      declared list, and the 22 gated questions are enumerated rather than
      sampled. A seed would be inert and recording one would falsely imply a
      stochastic component. The genuine variability here is the network's, and it
      is addressed by the retry schedule and by independent_instances below rather
      than by a seed.
    independent_instances: 3
    independent_instances_note: >-
      Three runs, separated in time within the run window, because the measured
      quantity is a third party's posture and can change between requests. A
      source whose verdict differs across the three runs is reported as
      INTERMITTENT with all three verdicts, never as one verdict, and a gate may
      not be cited against an intermittent source without that qualification.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
    - >-
      Stop immediately and report failed_infrastructure if the forced-reachable
      control does not fire. No source verdict may be reported, and the inherited
      premise gains no support from the stop.
    - >-
      Stop immediately and report an instrument failure if the non-existent
      domain reports reachable.
    - >-
      Stop and report if the probe cannot distinguish a challenge body from an
      artifact body on the case where both are available; the instrument is
      unusable until repaired.
    - >-
      Stop at three attempts per source class. No source is retried further to
      turn an unreachable verdict into a reachable one, and no timeout is extended
      after seeing a result.
    - >-
      Stop at the nine declared source classes. No class is added after seeing the
      table, and no named document is added to the pre-registered arm.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A timeout, crash, DNS failure, proxy error or dependency failure makes the
      run failed_infrastructure and is NEVER evidence that a source is
      unreachable as a matter of policy (AGENTS.md rule 5). The distinction
      between an environment with no egress and a source that is genuinely
      blocked is the whole point of the forced-reachable control.
    - >-
      A run whose forced-value hosts were not probed in the same invocation as
      the source classes is invalid_measurement -- the comparison this contract
      exists to make was not made.
    - >-
      A run reporting a body as a retrieved PDF without a structural parse is
      completed_invalid.
    - >-
      A run emitting any verdict row without its date, its routes and its client
      is completed_invalid, because such a row repeats in the opposite direction
      exactly the undated-premise error the contract exists to fix.
    - >-
      A run that solves, bypasses or works around a bot challenge, or that probes
      a credentialed endpoint, is completed_invalid and must be reported as a
      contract breach rather than a measurement.
    - >-
      A run that creates a KN-LIT entry, edits a question's constraints, or
      changes any goal's status or next_action is completed_invalid; those are
      Coordinator acts outside this contract's write scope.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    All five of the following hold, each decidable from the primary metrics --
    (1) forced_unreachable_verdict is UNREACHABLE;
    (2) forced_reachable_verdict is REACHABLE with pdf_valid or an equivalent
    artifact validation true;
    (3) challenge_classified_correctly is true on every row whose body is a
    challenge page, with the discriminating features recorded;
    (4) the source_verdict_table is complete for all nine classes across all three
    attempts, every row carrying status, content type, byte size,
    artifact_or_challenge, client and timestamp;
    (5) gated_questions_with_retrievable_source is at least 3, reported with its
    three-way split and with the FIPS arm's byte sizes stated beside the
    pre-registered figures.

  falsification_criterion:
    - >-
      gated_questions_with_retrievable_source is 0 WHILE the forced-reachable
      control fires and the challenge gate works. The inherited premise is
      CORRECT as of the run date, the hypothesis is rejected at the tested scope,
      and the premise becomes a dated measurement instead of an inherited
      sentence. This is a clean negative and a genuine deliverable.
    - >-
      The FIPS arm returns not-an-artifact for all three documents while the
      forced-reachable control fires. The parent proposal's central quantitative
      claim is false on the run date and the hypothesis's C2 is rejected at the
      tested scope.
    - >-
      challenge_classified_correctly is false on any available case. The
      instrument cannot distinguish a challenge from an artifact; the package is
      void and returns to the Executor for repair. Instrument failure, not a
      negative result about sources.
    - >-
      forced_unreachable_verdict is REACHABLE. The probe is a control that cannot
      fail; every verdict in the package is void.
    - >-
      forced_reachable_verdict is UNREACHABLE. FAILED_INFRASTRUCTURE, never a
      negative result and never support for the inherited premise. Listed here
      explicitly so that a no-egress environment can never be written up as a
      confirmation of the gate.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying every attempt as its own row, never only the final attempt per source
    - the dated per-source verdict table as a standalone committed record that a source gate can cite, with date, routes and client on every row
    - the forced-value host verdicts, written and timestamped before any source-class row in the same file
    - the first bytes and full byte size of every non-artifact body, so a classification can be re-examined from the record
    - the structural PDF parse result for every retrieved PDF, with page count
    - the verbatim premise quotation from PUBLICATION-CANDIDATES.md with file path, line number and date
    - the per-question extraction of named sources with the frozen probeable-versus-unresolvable classification, written before the first request
    - the pre-registration text, written before the first run and hashed

  assigned_to: executor
  approved_by: null

  approval_gate:
    - >-
      Coordinator drafting does not confer approval. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false. Approval is a separate human-reviewed act
      because it authorizes execution and spends compute.
    - >-
      NETWORK EGRESS MUST BE EXPLICITLY AUTHORIZED BEFORE APPROVAL. This is the
      only contract in this batch that makes outbound requests. The approver must
      confirm that probing the nine declared public endpoints is permitted, that
      no credentialed endpoint is in the list, and that the no-challenge-solving
      rule is understood as binding.
    - >-
      The known-good host and the non-existent domain must both be NAMED in
      writing before approval, so that neither can be chosen after seeing a result
      to make a control fire.
    - >-
      The probeable-versus-unresolvable classification of each gated question's
      named sources must be frozen before approval, so that evaluability is not
      decided per question after seeing whether its source retrieved.

  derivation_provenance:
    tool: coordinator-authored contract under the backlog-conversion task
    source_record: IDEA-20260807-f73d98
    authored_under_task: TASK-20260904-e1420d
    authored_at: '2026-09-04'
    note: >-
      Metrics, controls, forced values and falsifiers are taken from the parent
      proposal's predictions, minimal_test, null_object_control and
      falsification_conditions and restated as measurable quantities with units.
      Boilerplate identical across contracts by program rule -- invalidation
      rules, required artifacts, approval gate -- comes from the fixed table.
      Budgets are set from the parent's declared estimated_cost of low
      implementation and low compute, and raised to the template floors. No field
      is invented; a value the proposal did not supply is null or is recorded as a
      derivation gap below.

  derivation_gaps:
    - >-
      The parent proposal's `assumptions` list is EMPTY. The assumptions carried
      in H-CRYPTO-21e529 were derived by the converting Coordinator from the
      proposal's confounders and interpretation limits, and are flagged here so
      that a reviewer does not read them as the proposer's own.
    - >-
      The parent proposal's 2026-08-07 figures were measured OUTSIDE the harness
      with no run record. They are treated here strictly as a pre-registration.
      Until a run under this contract reproduces them, they support nothing.
    - >-
      The known-good host and the non-existent domain are not named by the parent
      proposal. Naming them is deferred to the approval gate deliberately, because
      a control host chosen after seeing a result is not a control.
    - >-
      The parent proposal names seven source classes; this contract declares nine
      by splitting arxiv and eprint into their abstract and PDF endpoints, since
      the proposal's own central observation is that those differ on one host.
      That split is a Coordinator addition and is recorded rather than silently
      absorbed.
    - >-
      Which of the 22 gated questions name a probeable document versus a source
      class is UNKNOWN to this contract and is measured in Stage 0. The predicted
      floor of three rests only on the three FIPS documents, whose gated goals
      (GOAL-MLDSA-002 on FIPS 204, GOAL-SLHDSA-001 on FIPS 205) are named in the
      parent proposal.
    - >-
      Whether a retrieved source should then be transcribed, and by whom, is out
      of scope. This contract creates transcription work and discharges none of
      it, and the downstream open problem KN-OPEN-3f7a21 is named rather than
      addressed.
