experiment:
  id: EXP-XEDN-007
  hypothesis_id: H-XEDN-005
  version: 1
  title: >-
    Denser p=31 free-x relation search under joint deg-x≤3 / deg-b=10
  status: approved
  objective: >-
    Settle the p=31 cell left unmeasurable by EXP-XEDN-006: recover ≥1
    (target ≥3) group-law-verified short free-x MW relations on
    plant-discovered non-isotrivial surfaces with a≠0, deg a≤2, deg b=10,
    free-x deg x≤3 / deg y≤5 at p=31, and report max_|coeff| or document
    continued density failure under an expanded budget.
  inputs:
    primes: [31]
    family:
      form: "y^2 = x^3 + a(t) x + b(t)"
      deg_a_max: 2
      deg_b: 10
      a_nonzero: true
      j_nonconstant_required: true
    section_shape:
      deg_x_max: 3
      deg_y_max: 5
    enumeration: >-
      Force planted deg-x=3 section; full deg x≤3 enumeration (no sampling).
    eligibility:
      - a ≠ 0
      - j non-constant
      - disc nonzero
      - ≥2 free-x slots
    relation_verification:
      method: group-law short search primary; specialisation ≥20 fibres
      primary_metric: infinity-norm of shortest nonzero integer relation
  controls:
    - Isotrivial a=0 excluded.
    - Baseline: EXP-XEDN-006 p=31 density (0/48 with relations).
  metrics:
    primary:
      - n_with_verified_relation
      - max_abs_coeff_at_p31
      - slot_count_histogram
  replication:
    seeds: [2026073031, 2026073032]
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 3600
    maximum_memory_gb: 4
    maximum_runs: 4
  stopping_rules:
    - Stop after ≥3 eligible surfaces with verified relations, or budget.
  success_criterion: >-
    ≥1 verified relation with max_|coeff|∈{1,2,3} at p=31, or explicit
    density-failure report after ≥60 fully enumerated planted surfaces.
  falsification_criterion: >-
    Any verified shortest relation with infinity-norm ≥4.
  required_artifacts:
    - experiments/EXP-XEDN-007/runs/*/manifest.yaml
    - experiments/EXP-XEDN-007/runs/*/raw-result.json
    - experiments/EXP-XEDN-007/execution_report.md
  assigned_to: executor
  approved_by: coordinator
