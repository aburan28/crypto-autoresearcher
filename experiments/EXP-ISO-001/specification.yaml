experiment:
  id: EXP-ISO-001
  hypothesis_id: H-ISO-001
  version: 1
  title: Isogeny-neighborhood audit of m=3 Semaev d_reg and decomposition yield vs matched controls.
  status: approved
  objective: Reduce RQ-ISO-001 uncertainty — is any l-isogeny neighbor a weak PDP instance vs coefficient-variance controls?
  controls: [8 random same-p curves (coefficient variance, various orders); isogeny neighbors share the base order]
  independent_variables: [curve (base | iso_l | ctl)]
  metrics: {primary: [m=3 Semaev d_reg, decomposition yield = distinct reachable R / N], secondary: [order, j]}
  replication: {seeds: [20260716], independent_instances: 1}
  budget: {maximum_runs: 100, wall_clock_seconds_per_run: 300}
  success_criterion: An isogeny neighbor with d_reg<2 OR yield > control mean + 3sd.
  falsification_criterion: All neighbors d_reg>=2 AND yields inside the control band.
  required_artifacts: [runs/<id>/manifest.yaml, raw.json, stderr.txt, analysis.md]
  assigned_to: executor
  approved_by: coordinator
