experiment:
  id: EXP-MTIC-001
  hypothesis_id: H-MTIC-001
  goal_id: GOAL-ECDLP-001
  version: 2
  title: >-
    Multi-target index-calculus amortization crossover K* versus the generic
    preprocessing frontier S*T^2 = N, with measured S_rel and S_LA and a
    target-independence non-interference control
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-27'
  claim_tier: toy
  heuristic_under_test: null
  source_proposal: IDEA-20260726-001
  objective: >-
    Measure, on the same toy instances, the one-time index-calculus
    preprocessing costs (S_rel by enumeration-assisted relation collection,
    S_LA by a real Wiedemann solve), the per-target descent cost T_desc
    (S_4 Groebner solves including failures and capped attempts), and the
    matched per-target Pollard-rho baseline; compute the multi-target
    crossover K* = ceil((S_rel + S_LA)/(sqrt(N) - T_desc - T_verify)) per
    instance; and decide which of the two predicted regimes holds at toy
    scale: (i) T_desc >= sqrt(N) so K* is infinite and the route is closed
    at toy scale, or (ii) K* is finite but the measured point
    (S, T) = (S_rel + S_LA, T_desc + T_verify) lies on or above the
    S*T^2 = N frontier (KN-LIT-013), i.e., no non-generic multi-target
    advantage. A measured point strictly below the frontier is the
    pre-registered falsifier (a non-generic signal) and is escalated to
    review-breakthrough, not promoted. This experiment repairs the specific
    evidentiary gaps of EV-IC-001: S_rel is measured (never estimated),
    the frontier comparison is restored, and a non-interference control
    certifies target-independence of the factor-base log table.
  inputs:
    instances:
      description: >-
        3 toy prime-field short-Weierstrass curves with prime-order subgroup
        of order N, one per bit size {16, 20, 24}, generated by
        harness/toycurve.py generate_instance(seed, field_bits,
        min_prime_order_bits=field_bits-2) with the pinned seed-to-size
        mapping seed 1 -> 16 bits, seed 2 -> 20 bits, seed 3 -> 24 bits
        (amendment AMEND-EXP-MTIC-001-001). Frozen with SHA-256 in
        RUN-MTIC-001.
    targets:
      descent_targets: >-
        50 per curve, R_i = a_i*P + b_i*Q with a_i, b_i drawn from the
        seeded RNG; (a_i, b_i) recorded; used for T_desc measurement and for
        the matched rho baseline (same targets, same order).
      harvesting_targets: >-
        2000 per curve with known (a, b), used only as the lookup pool for
        enumeration-assisted relation collection.
    factor_base:
      primary: B = ceil(sqrt(N)) on-curve x-coordinates via harness/semaev.py build_factor_base
      ablation_at_20bit: [ceil(N^(1/3)), ceil(N^(2/5))]
      freeze: per-instance factor base SHA-256 recorded in RUN-MTIC-001
    decomposition_arity: m = 3 (S_4 summation systems, harness/semaev.py s4_expr)
    solver:
      groebner: sympy Buchberger (implementation-bound; per-solve cap 60 s; capped attempts counted at full cap cost)
      linear_algebra: Wiedemann over Z/N (relation matrix, ~B x B, sparse)
      solver_honesty: >-
        sympy exposes no degree-of-regularity; only observable proxies (wall
        time, basis size, maximum total degree) are reported, labeled
        implementation-bound per harness/semaev.py's honesty note.
    cost_model:
      unit: group-operation equivalents
      calibrations:
        - rho_walk_rate: total_group_operations / wall_seconds of harness/rho.py per size
        - bsgs_construction_rate: group operations / wall_seconds of BSGS table construction per size
      calibration_audit: >-
        Every crossover sign and frontier-side decision is reported under
        group-operation accounting (primary), wall-clock accounting, and
        both calibrations (HEUR-001 dual-accounting audit).
    frontier_reference: S*T^2 = N with S = S_rel + S_LA, T = T_desc + T_verify (KN-LIT-013, KN-TECH-005)
  controls:
    - id: CTRL-NONINTERFERENCE
      method: >-
        The factor-base log table is built only from (curve, factor base,
        harvested relations). Three hash checks: (a) table content SHA-256
        is identical for every descent target; (b) a table rebuilt with the
        target list permuted has identical SHA-256; (c) a table rebuilt
        under a withheld-target protocol (descent targets generated only
        after table freeze) has identical SHA-256.
      pass_condition: All three hash-equality booleans are true.
      role: >-
        Load-bearing: the S = S_rel + S_LA advice charging of the frontier
        comparison is valid only if preprocessing is target-independent.
    - id: CTRL-RHO-BASELINE
      method: >-
        harness/rho.py solve on the same 50 descent targets per curve,
        reporting total_group_operations (precompute + walk + verify) with
        verified discrete-log certificates; median per-target cost is the
        measured sqrt(N)-scale baseline. Never quoted from literature.
      pass_condition: All baseline solves carry verified certificates; median recorded per instance.
    - id: CTRL-BSGS-BASELINE
      method: BSGS group-operation count and table memory measured per instance.
      pass_condition: Recorded for the memory-honest comparison; no pass/fail gate.
    - id: CTRL-SINGLE-TARGET
      method: >-
        Total IC cost at K = 1 (S_rel + S_LA + T_desc + T_verify) compared
        to the measured rho per-target cost on the same instance.
      pass_condition: >-
        K = 1 IC cost exceeds rho per-target cost on every instance
        (consistency with KN-OPEN-001; a violation triggers the K* = 1
        falsifier path).
    - id: CTRL-CALIBRATION-AUDIT
      method: >-
        Recompute every crossover/frontier decision under wall-clock
        accounting and under both frozen calibrations.
      pass_condition: >-
        No decision flips across the three accountings (HEUR-001); a flip
        is recorded as refutation of HEUR-001 and makes the affected
        conclusion inconclusive.
  independent_variables:
    - instance: bit size {16, 20, 24} x seed {1, 2, 3} (one seed per size)
    - factor_base_size: B = ceil(sqrt(N)) primary; ablation {ceil(N^(1/3)), ceil(N^(2/5))} at 20 bits
    - target_index: 50 descent targets per curve
    - enumeration_cap: 5e7 tuple evaluations per instance (fixed)
  metrics:
    primary:
      - id: t_desc_median_iqr_group_ops
        definition: >-
          Median and IQR of per-target S_4 solve cost in group-operation
          equivalents over the 50 descent targets, failures and capped
          solves counted at full cap cost; censor counts reported.
      - id: s_rel_group_ops
        definition: >-
          Measured relation-collection cost to ceil(1.2*B) independent
          verified relations (enumeration-assisted harvesting); a censored
          partial yield is recorded as a lower bound, never extrapolated
          silently.
      - id: s_la_group_ops
        definition: Measured Wiedemann solve cost of the relation matrix, with solution verified against a sample of harvested relations.
      - id: crossover_K_star
        definition: ceil((S_rel + S_LA)/(sqrt(N) - T_desc - T_verify)) per instance; infinite when the denominator is non-positive.
      - id: frontier_product_ratio
        definition: ((S_rel + S_LA)*(T_desc + T_verify)^2) / N per instance; >= 1 on/above the frontier, < 1 strictly below.
      - id: amortized_cost_at_K_star
        definition: C_IC(K*)/K* in group-operation equivalents (also at 10*K* when K* is finite), versus measured rho per-target median.
    secondary:
      - t_verify_group_ops
      - rho_median_group_ops_per_target
      - bsgs_group_ops_and_memory
      - single_target_ic_cost_vs_rho
      - noninterference_hash_equality_flags
      - b_ablation_t_desc_and_K_star
      - relation_yield_curve (relations found vs tuple evaluations, per instance)
      - calibration_factors_per_size (both calibrations)
      - wall_clock_artifacts (per-phase seconds; implementation-bound)
  scale_relevance:
    tier: toy
    justification: >-
      No transfer claim: 16-24-bit measurements of Groebner-bound costs are
      implementation-bound and say nothing about crypto-scale behavior. The
      frontier comparison is meaningful only as a toy-scale accounting audit
      of whether measured IC preprocessing lies on the generic frontier at
      these sizes. Evidence from this experiment must carry claim_tier toy.
    correspondence: null
  replication:
    seeds: [1, 2, 3]
    seed_policy: >-
      Deterministic: one seed per bit size, all instances, targets, factor
      bases, and enumeration orders derived from the frozen seeds via
      harness/toycurve.py and frozen derivation tags; every run manifest
      records the seeds actually used.
    independent_instances: 3
    planned_runs:
      - id: RUN-MTIC-001
        purpose: >-
          Generate and freeze instances, factor bases (primary + 20-bit
          ablation), descent and harvesting targets; record SHA-256 of all
          frozen artifacts and both calibration factors per size.
      - id: RUN-MTIC-002
        purpose: Relation collection (S_rel) at 16 bits to ceil(1.2*B) independent verified relations; per-relation certificates; yield curve.
      - id: RUN-MTIC-003
        purpose: Relation collection (S_rel) at 20 bits; same protocol.
      - id: RUN-MTIC-004
        purpose: Relation collection (S_rel) at 24 bits; same protocol; censored partial yield recorded as lower bound.
      - id: RUN-MTIC-005
        purpose: Wiedemann linear algebra (S_LA) for all three instances; verify recovered factor-base logs against a sample of harvested relations.
      - id: RUN-MTIC-006
        purpose: >-
          CTRL-NONINTERFERENCE: build the factor-base log table under the
          three protocols (as-is, permuted targets, withheld targets) and
          compare content SHA-256; static audit that the table code path
          reads only (curve, factor base, relations).
      - id: RUN-MTIC-007
        purpose: T_desc measurement at 16 bits (50 targets, failures and capped solves at cap cost).
      - id: RUN-MTIC-008
        purpose: T_desc measurement at 20 and 24 bits (50 targets each, same protocol).
      - id: RUN-MTIC-009
        purpose: >-
          Baselines: per-target rho on the same 50 targets per curve with
          verified certificates; BSGS ops and memory; CTRL-SINGLE-TARGET
          K = 1 comparison.
      - id: RUN-MTIC-010
        purpose: >-
          B ablation at 20 bits (T_desc on 25 targets per ablation base,
          S_rel sampling) and final aggregation: K*, frontier product,
          amortized costs, calibration audit, analysis.md.
    expected_run_count: 10
  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 13200
    total_cpu_hours: 3.7
    maximum_memory_gb: 4
    maximum_runs: 10
    stages:
      - id: freeze
        wall_clock_seconds: 600
        stop_rule: >-
          If instance generation fails primality/structure checks twice for
          a size, record failed_infrastructure for that size and continue
          with the others; do not reinterpret.
      - id: relation_collection
        wall_clock_seconds: 5400
        stop_rule: >-
          Per instance: stop at ceil(1.2*B) verified relations, at 5e7 tuple
          evaluations, or at 1500 s cumulative; a partial yield is a
          censored lower bound on S_rel (recorded as such), never silently
          extrapolated.
      - id: linear_algebra_and_noninterference
        wall_clock_seconds: 1500
        stop_rule: >-
          If the Wiedemann solve fails to converge within the stage cap,
          record resource_exhaustion for S_LA; the non-interference control
          still runs on the partial table if one exists, else the affected
          runs are invalid.
      - id: descent_and_baselines
        wall_clock_seconds: 4500
        stop_rule: >-
          Per-solve cap 60 s; per-run cumulative cap 1500 s; targets not
          attempted when the cumulative cap hits are recorded
          cancelled_by_budget with the measured prefix retained.
      - id: ablation_and_analysis
        wall_clock_seconds: 1200
        stop_rule: Stop without interpretation if any required artifact from an earlier stage is incomplete.
  stopping_rules:
    - >-
      Any crash, unprepared solver exception, or harness error: record the
      run failed_infrastructure; never interpret it as evidence for or
      against the hypothesis (AGENTS.md rule 5).
    - Stop after the 10 planned runs; no exploratory additional runs.
    - Stop any run at 1800 s wall clock or 4 GB resident memory; record the
      terminal status honestly (resource_exhaustion or cancelled_by_budget).
    - Stop the whole experiment at 13200 s total wall clock; remaining
      planned runs are recorded cancelled_by_budget.
    - >-
      A below-frontier measurement (frontier_product_ratio < 1) does not
      stop the experiment; it completes the planned protocol and is then
      escalated to review-breakthrough before any interpretation is
      promoted.
  invalidation_rules:
    - Any run missing its manifest, exact command, environment, raw result, summary, stdout, or stderr is invalid.
    - Any run with dirty: true in its manifest is invalid (code revision must be pinned).
    - Frozen-artifact SHA-256 mismatch against RUN-MTIC-001 records invalidates dependent runs (specification drift).
    - Duplicated or missing seeds, or disagreement between raw and summarized data, invalidates the affected run.
    - Non-interference hash inequality invalidates the affected preprocessing runs (evidence-integrity failure, not a mathematical result).
    - Unverified relation or discrete-log certificates invalidate the runs that rely on them.
    - A timeout, crash, or resource exhaustion is never evidence against the hypothesis (AGENTS.md rule 5); it is recorded as an infrastructure signal.
  success_criterion: >-
    All 10 planned runs reach terminal status with valid artifacts;
    CTRL-NONINTERFERENCE passes (all three hash equalities hold);
    CTRL-RHO-BASELINE and CTRL-BSGS-BASELINE are measured on the same
    instances with verified certificates; CTRL-SINGLE-TARGET holds (K = 1 IC
    cost exceeds rho per-target cost on every instance); and for every
    instance the outcome falls in one of the two pre-registered regimes:
    (i) median T_desc >= sqrt(N) so K* is infinite (route closed at toy
    scale), or (ii) K* is finite, >= 2, and frontier_product_ratio >= 1
    (measured amortized cost on or above the S*T^2 = N frontier) — with the
    regime assignment stable across the group-operation accounting, the
    wall-clock accounting, and both frozen calibrations (CTRL-CALIBRATION-AUDIT).
  falsification_criterion: >-
    Reachable by an actual run in two ways: (a) any instance yields
    median T_desc < sqrt(N) AND frontier_product_ratio < 1 — a measured
    amortized cost strictly below the S*T^2 = N frontier, a non-generic
    signal contradicting H-MTIC-001 and escalated to review-breakthrough
    before any promotion; or (b) K* = 1 on any instance, contradicting
    KN-OPEN-001 and triggering investigation of the measurement. An
    inconclusive outcome (HEUR-001 refuted — the regime assignment flips
    across accountings — or the crossover sign undecidable under the frozen
    censoring rule) is recorded as inconclusive, not as falsification and
    not as support.
  required_artifacts:
