execution_report:
  experiment_id: EXP-MTIC-001
  handoff_id: TASK-20260727-001
  terminal_condition: specification_error   # agents/executor.md failure taxonomy:
                                            # contract incomplete/contradictory; NOT
                                            # evidence for or against H-MTIC-001
  stopped_at_lifecycle_step: "6 (execution), pre-run contract validation"
  implementation_commit: 0d0cbf88bd67b65bbb762296d049c960ccc68933  # HEAD at stop; no
                                                                   # implementation
                                                                   # code was written
  worktree: codex/main-ecdlp-main-latest-work (dedicated worktree car-run)

  specification_error:
    ambiguous_required_field: inputs.instances (and, secondarily, the seed-to-size mapping)
    spec_text: >-
      inputs.instances.description: "3 toy prime-field short-Weierstrass curves with
      prime-order subgroup of order N, one per bit size {16, 20, 24}, seeds {1, 2, 3}
      mapped one-to-one to sizes, generated by harness/toycurve.py generate_instance.
      Frozen with SHA-256 in RUN-MTIC-001."
    findings:
      - id: SPECERR-1
        title: >-
          The named generator with the frozen seeds does not realize the instance
          distribution the frozen protocol's own calibrations, censoring analysis,
          and regime logic require
        probe_evidence: >-
          Implementation-validation probes (toolchain check only; NOT planned runs,
          NOT evidence for or against H-MTIC-001; no run records created):
          harness/toycurve.py generate_instance(seed, field_bits) at default
          parameters yields, under the natural ascending seed-to-size mapping
          (1->16, 2->20, 3->24):
            (bits=16, seed=1): p=52721,    N=23     (subgroup 5 bits),  gen=0.4 s
            (bits=20, seed=2): p=836873,   N=4271   (subgroup 13 bits), gen=0.8 s
            (bits=24, seed=3): p=11000273, N=349    (subgroup 9 bits),  gen=10.8 s
          generate_instance accepts the first non-singular curve whose largest
          prime factor has >= min_prime_order_bits=3 (default) bits, so N is the
          largest prime factor of #E(F_p), typically far below 2^field_bits.
        contradiction:
          - >-
            (16-bit, seed=1) N=23: sqrt(N) ~= 4.8, so B = ceil(sqrt(N)) = 5 and the
            frozen K* denominator sqrt(N) - T_desc - T_verify <= 4.8 - 0 - 3 < 0 for
            ANY T_desc >= 0 (T_verify frozen at m = 3 group ops). Regime (i)
            (K* infinite) is forced ARITHMETICALLY before any measurement; the
            success_criterion's regime assignment would not be a measurement
            outcome. The relation target ceil(1.2*B) = 6 against the frozen
            enumeration_cap of 5e7 tuple evaluations is vacuous.
          - >-
            (24-bit, seed=3) N=349: sqrt(N) ~= 18.7, B = 19, ceil(1.2*B) = 23
            relations; expected harvesting-pool hits ~ 2000/349 ~= 5.7 PER TUPLE,
            so the hypothesis's feasibility/budget assumption for
            enumeration-assisted relation collection ("expected decomposition
            count per random target ~sqrt(N)/6 at these sizes makes relation
            collection ... feasible within budget") and the fixed 5e7 cap are
            miscalibrated by orders of magnitude.
          - >-
            (20-bit, seed=2) N=4271: sqrt(N) ~= 65.4, B = 66; the frozen 20-bit
            ablation bases become ceil(N^(1/3)) = 17 and ceil(N^(2/5)) = 29
            (vs the intended ~2^7 / ~2^8 scale), so the ablation's scaling
            comparison is not the designed one.
          - >-
            The spec's own falsification_criterion justifies the censoring rule by
            "the cap is ~60 s at calibration ~8e5 group-ops/s, far above
            sqrt(N) <= 2^12", and the hypothesis assumptions state
            "sqrt(N) ~ 2^8-2^12" (16-24 bit primes). Measured sqrt(N) values under
            the frozen seeds are 4.8 / 65.4 / 18.7 -- 1.5 to 7+ bits below the
            assumed scale at every size; the pre-registered prediction
            ("median T_desc/sqrt(N) >= 1.0 on at least 2/3 of tested instances")
            would be decided by instance degeneracy, not by the S_4 solve cost.
      - id: SPECERR-2
        title: Seed-to-size mapping is not pinned
        detail: >-
          "seeds {1, 2, 3} mapped one-to-one to sizes" does not state which seed
          pairs with which bit size. Probes of alternate pairings show the
          degeneracy is not mapping-specific (subgroup bits observed:
          (24,s1)=10, (16,s3)=9, (24,s2)=12, (20,s1)=17, (20,s3)=9, (16,s2)=10),
          but the mapping still changes which instance carries which measurement
          and must be pinned for reproducibility.
    why_executor_cannot_resolve:
      - >-
        Both readings are defensible and produce categorically different evidence:
        (a) literal generator defaults -> degenerate subgroups, regime assignments
        forced a priori, caps/calibrations vacuous; (b) constraining the subgroup
        (e.g., generate_instance(seed, bits, min_prime_order_bits=bits-2)) ->
        spec-assumption-conform instances. Choosing between them selects the input
        distribution -- a frozen contract element.
      - >-
        Protocol changes after approval require a versioned protocol_amendment
        approved by the Coordinator (docs/task-lifecycle.md section 5; handoff
        TASK-20260727-001 constraints item 1). Pinning min_prime_order_bits, an
        N-acceptance window, or the seed-to-size mapping is such a change; the
        Executor is prohibited from silently modifying the protocol or selecting
        inputs beyond the frozen definition.
      - >-
        Standing execution instruction for this handoff: "missing/ambiguous
        required field -> STOP, report specification_error."
    suggested_minimal_amendment:
      note: >-
        For the Coordinator's decision only; NOT executed, NOT scored. Probe-verified
        feasibility is recorded so the amendment cost is known.
      option_A: >-
        Pin inputs.instances to generate_instance(seed, field_bits,
        min_prime_order_bits=field_bits-2) and pin the mapping seed 1->16, 2->20,
        3->24. Probe (implementation-validation only): yields N = 17623 (15 bits,
        gen 0.6 s), N = 139753 (18 bits, gen 5.8 s), N = 11000719 (24 bits,
        gen 55.2 s) for seeds 1/2/3 -- sqrt(N) within ~1 bit of the assumed
        2^8/2^10/2^12 scale, within the freeze-stage 600 s budget. The existing
        freeze-stage stop rule ("fails ... twice for a size -> failed_infrastructure
        for that size and continue") already covers seeds where the 2000-try curve
        search finds no conform curve.
      option_B: >-
        Alternatively pin an explicit acceptance window on the subgroup order
        (e.g., N >= 2^(field_bits-2)) with the same mapping and stop rule.
      confirmatory_status_note: >-
        No run has been executed under either reading, so confirmatory_status can be
        preserved for the amended protocol (no completed runs exist to re-score).

