protocol_amendment:
  id: AMEND-EXP-MTIC-001-001
  experiment_id: EXP-MTIC-001
  version_from: 1
  version_to: 2
  reason: >-
    Executor STOP (specification_error) at contract validation under handoff
    TASK-20260727-001: the frozen inputs.instances text named
    harness/toycurve.py generate_instance with seeds {1, 2, 3} but did not pin
    min_prime_order_bits or the seed-to-size mapping. At generator defaults
    (min_prime_order_bits=3), the frozen seeds yield subgroup orders
    N = 23 (16-bit), 4271 (20-bit), 349 (24-bit) under the natural mapping —
    1.5 to 7+ bits below the frozen protocol's assumed sqrt(N) ~ 2^8/2^10/2^12
    scale. Regime assignment would be forced arithmetically before any
    measurement (K* denominator negative for any T_desc at 16-bit), and the
    enumeration cap, 20-bit ablation bases, and censoring justification are
    miscalibrated by orders of magnitude. Zero runs were executed under
    version 1; the stop asserts nothing about H-MTIC-001.
  changes:
    - field: inputs.instances
      prior_value: >-
        3 toy prime-field short-Weierstrass curves with prime-order subgroup
        of order N, one per bit size {16, 20, 24}, seeds {1, 2, 3} mapped
        one-to-one to sizes, generated by harness/toycurve.py
        generate_instance. Frozen with SHA-256 in RUN-MTIC-001.
      corrected_value: >-
        3 toy prime-field short-Weierstrass curves with prime-order subgroup
        of order N, one per bit size {16, 20, 24}, generated by
        harness/toycurve.py generate_instance(seed, field_bits,
        min_prime_order_bits=field_bits-2) with the pinned seed-to-size
        mapping seed 1 -> 16 bits, seed 2 -> 20 bits, seed 3 -> 24 bits.
        Frozen with SHA-256 in RUN-MTIC-001.
  probe_verification:
    note: >-
      Executor's labeled implementation-validation probes (not experiment
      runs, not evidence for or against H-MTIC-001; recorded in
      experiments/EXP-MTIC-001/execution-report.yaml of the stopped attempt).
    pinned_call_outcomes: >-
      generate_instance(seed, bits, min_prime_order_bits=bits-2) yields
      N = 17623 (~15 bits, 0.6 s) for seed 1, N = 139753 (~18 bits, 5.8 s)
      for seed 2, N = 11000719 (~24 bits, 55.2 s) for seed 3 — sqrt(N)
      within ~1 bit of the assumed 2^8/2^10/2^12 scale and within the
      freeze-stage budget. The existing freeze-stage stop rule (twice-failed
      generation for a size -> failed_infrastructure for that size and
      continue) already covers seeds whose 2000-try search finds no
      conforming curve.
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approved_at: '2026-07-28'
