  observations:
    - "Every attempted S_4 Groebner solve at every size (16/20/24-bit primary and both 20-bit ablation bases) hit the frozen 60 s per-solve cap: T_desc medians are 60.0 s (charged full cap) with IQR 0 over the attempted prefixes (25/13/12 and 13/12 targets); the frozen censoring rule makes T_desc/sqrt(N) >= 2.3e4 on every instance and accounting, so K* is infinite everywhere and regime is (i), stable across all three accountings."
    - "S_rel is measured, never estimated: 160/449/3981 distinct certificate-verified relations in 0.022/0.062/9.86 s; no censoring at any size; the 24-bit collection needed only 2 of 2000 harvest targets (decompositions plentiful; aux probe hit counts up to 2875/target at 24-bit)."
    - "S_LA is a real Wiedemann solve: weight-3 signed relation matrices at ceil(1.2*B) rows are rank-deficient (ranks 129/133, 364/374, 3272/3317; deficit recorded), plain Wiedemann cannot converge on them (measured in pre-run smoke), and the maxrank nonsingular subsystem construction (EXP-ENDO-001 DEV-7 precedent) converged on attempt 1 at all sizes with solutions verified against ALL harvested rows; 4/10/45 factor-base columns undetermined (free, zeroed) and recorded."
    - "The factor-base log table is target-independent by measurement: identical content SHA-256 under as-is, permuted-target, and withheld-target builds at every size, and identical for every descent target."
    - "K = 1 IC cost exceeds the measured rho per-target median on every instance and accounting (margins >= 3e3x); the K* = 1 falsifier path is not triggered."
    - "Aux enumeration ground truth found a certificate-verified signed decomposition for every attempted primary descent target (0 ideal/enumeration disagreements; no comparison possible on capped solves since their ideal verdict is None); ablation targets decompose rarely (B=52) to occasionally (B=115), consistent with C(B,3)/N."
    - "Wall-clock and group_ops_rho frontier ratios agree to ~1e-6 relative (T_verify conversion; disclosed); group_ops_bsgs ratios differ by the calibration constant (up to ~5x at 16-bit) with zero regime flips."

