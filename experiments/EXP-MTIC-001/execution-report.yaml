      detail: "24-bit relation collection reached ceil(1.2*B) = 3981 distinct verified relations from only 2 harvest targets (of 2000); expected decompositions per target ~ sqrt(N)/6 ~ 550 at B = ceil(sqrt(N)) at these sizes (hypothesis assumption confirmed as a measurement, not relied upon)."
