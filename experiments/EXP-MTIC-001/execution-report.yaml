    - id: DEV-2
      text: "Descent execution order across instances/bases is round-robin under the shared frozen cumulative cap (order unpinned by the protocol); guarantees every instance/basis receives measured targets when the cap hits (13/12 at 20/24-bit, 13/12 ablation). Recorded in run metrics and implementation.md decision 10."
    - id: DEV-3
      text: "S_LA solve construction: maxrank nonsingular r x r subsystem (row basis x column basis) with true harvested rhs, zero-extended on B-r free columns, verified on ALL harvested rows; plain Wiedemann on the rank-deficient square matrices cannot converge (measured). EXP-ENDO-001 DEV-7 precedent adapted to the frozen 1.2*B harvest. implementation.md decision 8."
    - id: DEV-4
      text: "Relation matrix rows carry summand signs [[col, +/-1]] (the harvested system is exactly consistent only with signs; unsigned 0/1 rows failed 31-708 rows in pre-run smoke). Collector also fixes the ENDO engine's s==1 mis-signing (undercount-only there). implementation.md decision 6."
    - id: DEV-5
      text: "T_verify = 3 group ops (m = 3 summands; frozen reading recorded in the v1 stop report) in op accountings; measured seconds (~2e-6) in the wall accounting. implementation.md decision 5."
    - id: DEV-6
      text: "Aux enumeration ground truth on descent targets (uncharged to any metric, costs recorded separately) provides decomposition certificates and T_verify timing; fV polynomials built by exact numpy int64 convolution with recorded verification (full coefficient equality at B <= 500, seeded point checks above); S4/fV one-time setup recorded, excluded from per-target T_desc (preprocessing-derivable). implementation.md decision 9."
    - id: DEV-7
      text: "Wall-clock accounting converts sqrt(N) by rho_rate and N in the (cubic) frontier product by rho_rate^3; wall and group_ops_rho ratios then agree up to the T_verify conversion (~1e-6 relative) -- identity disclosed; the non-trivial audit is rho-vs-bsgs constants. implementation.md decision 5."
    - id: DEV-8
      text: "Partial-component rules (disclosed): missing/unconverged S components are >= 0, so the K*-infinite sign and the K=1 comparison are computed on measured partial sums where robust; the frontier product is not computable without S and would be recorded as such (not triggered: S complete everywhere). implementation.md decisions 13-14."
    - id: DEV-9
      text: "Memory enforcement: darwin rejects setrlimit(RLIMIT_AS); 4 GB cap enforced post-hoc against measured peak RSS plus proactive self-abort at 3.75 GB (mechanism in every manifest). Max peak RSS 842 MB."
    - id: DEV-10
      text: "Repair successor RUN-MTIC-010b executed after RUN-MTIC-010 failed_implementation (implementation_error; failed record preserved immutably; repair is not an exploratory additional run -- it completes the same planned run with an implementation bug fixed). 11 terminal records for 10 planned runs."

