seed_env_manifest:
  experiment_id: EXP-ECDLP-bbb42f
  seeds:
    RUN-ECDLP-bbb42f-1: 20260902001
    RUN-ECDLP-bbb42f-2: 20260902002
    RUN-ECDLP-bbb42f-3: 20260902003
    RUN-ECDLP-bbb42f-4: 20260902004
    RUN-ECDLP-bbb42f-5: 20260902005
    RUN-ECDLP-bbb42f-6: 20260902006
  seed_usage_note: >-
    Each master seed is the Python random.Random() seed for that run's
    curve/baseline sampling RNG, exactly as committed in
    experiments/EXP-ECDLP-bbb42f/specification.yaml's replication.seeds
    field. RUN-1/2/3 use their master seed for curve sampling
    (random.Random(master_seed)) and master_seed+1 for the baseline-solver
    RNG (point selection, rho multiplier schedule). RUN-4 uses its master
    seed for anomalous-curve search and derives a per-bit-size sub-seed
    (master_seed + bit_size) for the forward-walk RNG. RUN-5 derives a
    per-s sub-seed (master_seed + s) for each Monte Carlo trial batch.
    RUN-6 uses its master seed directly for the exit-map spot-check sample.
  environment:
    operating_system: "Ubuntu 24.04.4 LTS"
    architecture: x86_64
    python_version: "3.11.15"
    kernel: "Linux 6.18.44-fc-v24"
    dependencies:
      note: >-
        No third-party packages used by the driver (pure Python 3 standard
        library: random, math, hashlib, json, time, sys, os). No
        sympy/numpy/pari/sage, per division_poly.py's own documented
        constraint (reused from experiments/EXP-ISOU-2ac81f).
  code_provenance:
    reused_modules_adapted_from_EXP-ISOU-2ac81f:
      - poly.py
      - division_poly.py
      - velu.py
      - ec_affine.py
      - curve_utils.py
      - class_walk.py (superseded for actual runs by bounded_walk.py's
        capped variant; retained in driver/ for reference and defect
        comparison, see implementation.md)
    new_modules_written_for_this_experiment:
      - point_counting.py
      - predicates.py
      - cost_model.py
      - rho_bsgs.py
      - exit_map.py
      - rrg_null.py
      - smart_ass.py (documented as producing INFEASIBLE_WITHIN_BUDGET,
        not a working solver -- retained for the record per "record every
        deviation" rather than deleted)
      - bounded_walk.py
      - isogeny_transfer_census.py (main orchestrator)
      - make_summary.py, make_baseline_manifests.py (aggregation only, no
        new cost/measurement computation)
    certificate_checker: certificate_verify.py (copied verbatim from
      experiments/EXP-ISOU-2ac81f/implementation/certificate.py; shares no
      code path with rho_bsgs.py's solver, per certificate independence
      requirement)
