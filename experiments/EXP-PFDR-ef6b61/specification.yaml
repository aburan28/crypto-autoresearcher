experiment:
  id: EXP-PFDR-ef6b61
  hypothesis_id: H-PFDR-14ca22
  question_id: RQ-PAIR-21313f
  idea_id: IDEA-20260901-2d3f07
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation. Nothing here changes the status of H-PAIR-713241, which is
    itself a proposed hypothesis, nor of RQ-PAIR-21313f.
  title: >-
    Verify the rank-1 collapse of the self-pairing space on a prime-order cyclic
    subgroup, EXHIBIT ITS EDGE on an object where the rank is 4, and execute the
    downstream reduction against a DISCLOSED CHEATING ORACLE -- with an
    abstract-group instantiation establishing that the collapse is a fact about
    cyclic groups with no curve in it, so the deliverable may not be written as a
    property of elliptic curves.
  claim_ceiling: >-
    A closure by dimension count, not a hardness result. It moves no exponent,
    mounts no attack, and makes no curve safer than an existing screen already
    does. What it changes is which questions remain open in the lane. NO ATTACK IS
    RUN: the only scalar recovered anywhere is in a toy calibration and by a
    disclosed harness cheat.
  claim_tier_basis: >-
    Toy tier for every measured number. Every recovered scalar is certified on the
    curve by a verifier sharing no state with the producer. The reduction
    demonstration uses an oracle that was GIVEN the discrete logarithms and is
    soundness-losing by construction.
  objective: >-
    Establish, IN THIS ORDER: (1) that the dimension count separates prime cyclic
    order from full rational torsion, by measuring rank exactly 1 on cyclic cells
    and exactly 4 on a full-rational-torsion curve with the same code; (2) that
    the proportionality instrument has resolving power, via a non-torsion null and
    a deliberately broken instrument copy; (3) the downstream reduction executed
    end to end at toy sizes with a DISCLOSED cheating oracle and an independent
    on-curve certificate, against a random-output oracle control that must certify
    nothing; (4) the smoothness census that validates the one heuristic the
    reduction rests on; and (5) the ABSTRACT-GROUP INSTANTIATION, which reproduces
    the collapse with no curve and therefore fixes how the result may be
    described.
  band_non_degeneracy:
    statistic: >-
      the rank over the integers modulo the subgroup order of the span of four
      bilinear forms
    null_value: 'exactly 1 on every cyclic-subgroup cell'
    alternative: 'exactly 4 on a full-rational-torsion curve'
    computed_check: >-
      The statistic is an INTEGER RANK with predicted values 1 and 4 on two
      objects run through the SAME code at the same field size. The separation is
      three integer units and there is no tolerance to tune; the alternative is
      not a perturbation of the null but a different integer. THE DEGENERACY THIS
      DESIGN GUARDS AGAINST IS NOT WIDTH BUT VACUITY: measuring rank 1 everywhere
      is an unfalsifiable constant unless the same instrument is shown to report 4
      where 4 is provably correct, which is why the full-rational-torsion arm is
      BLOCKING and is the cheapest decisive step in the contract.
    resolution: >-
      Retained as written, with one addition. The proportionality check has its own
      decay parameter -- the number of sampled point pairs per curve -- and the
      fitted exponent relating two pairing values must be EXACTLY CONSTANT with
      ZERO VARIANCE as the sample grows. An exponent that CONVERGES rather than
      sitting at one value is an instrument artifact and not a measurement, and
      that distinction is what separates a real rank-1 finding from a numerical
      one.
  inputs:
    curves:
      - 'at least 20 constructed toy curves with small embedding degrees, field size 16 to 28 bits'
      - 'one constructed curve with FULL RATIONAL torsion at the subgroup order'
      - 'three cyclic-subgroup control curves at the same field size as the full-torsion curve'
    reduction_sizes: 'subgroup orders of about 2^20, 2^24 and 2^28'
    smoothness: 'bound set to the fourth root of the subgroup order; at least 10^4 random curves per size, orders computed exactly'
    point_pairs: 'at least 200 per curve, swept so the exponent variance can be checked'
    exclusions: 'anomalous instances and instances with smooth subgroup order are excluded per this question own constraints'
  controls:
    - id: CTRL-NEARBY-OBJECT-RANK-4
      row_class: positive_control
      blocking: true
      object: 'the full-rational-torsion curve, where the rank is provably 4 and two named pairings are not proportional'
      forced_disposition: >-
        MUST return rank EXACTLY 4 and exhibit non-proportionality, using the SAME
        code that returns 1 on the cyclic cells. THIS IS THE DYNAMIC-RANGE
        DEMONSTRATION AND THE CHEAPEST DECISIVE STEP. If the instrument reports
        proportionality there, it is measuring itself and every rank-1 report is
        void. If the construction does not produce such a curve within budget the
        outcome is UNEXHIBITED and is an INFRASTRUCTURE outcome, never evidence
        about the dimension count.
    - id: CTRL-NON-TORSION-NULL
      row_class: null_object
      blocking: true
      object: 'random extension-field points NOT in the relevant torsion'
      forced_disposition: >-
        Every emitted value MUST FAIL the root-of-unity membership test. This
        proves the proportionality check has resolving power rather than passing
        vacuously.
    - id: CTRL-BROKEN-INSTRUMENT
      row_class: negative_control
      blocking: true
      object: 'a deliberately broken instrument copy with the final exponentiation removed'
      forced_disposition: >-
        MUST BREAK the proportionality check. An instrument reporting
        proportionality with the final exponentiation removed is not measuring the
        reduced pairing at all.
    - id: CTRL-RANDOM-OUTPUT-ORACLE
      row_class: negative_control
      blocking: true
      object: 'the reduction re-run with the oracle replaced by one returning random outputs'
      forced_disposition: >-
        MUST certify 0 percent. A pipeline that recovers the scalar from a
        random-output oracle is reading the harness cheat rather than running the
        reduction.
    - id: CTRL-DISCLOSED-CHEAT
      row_class: honesty
      blocking: true
      object: 'every artifact from the reduction stage'
      forced_disposition: >-
        FORCED: each artifact carries, in its own words, the sentence that the
        oracle was GIVEN the discrete logarithms. The oracle is soundness-losing by
        construction, the demonstration attacks nothing, and any reader taking it
        as an attack has misread it.
    - id: CTRL-ABSTRACT-GROUP
      row_class: null_object
      blocking: true
      object: >-
        THE CURVE-FREE INSTANTIATION. The dimension count and both reductions
        re-derived and re-executed on the integers modulo the subgroup order with a
        synthetic representation. No curve anywhere.
      forced_disposition: >-
        FORCED to reproduce the rank-1 collapse and both reductions EXACTLY,
        because the arguments contain no curve. BLOCKING FOR ATTRIBUTION: since the
        null is EXPECTED to reproduce the result in full, the deliverable must be
        written as a statement about prime-order cyclic groups with a named
        COMPUTABILITY caveat, and NO artifact may describe the collapse as a
        property of elliptic curves.
    - id: CTRL-CERTIFICATE
      row_class: honesty
      blocking: true
      object: 'every recovered scalar'
      forced_disposition: >-
        FORCED: verified on the curve by code sharing no state with the producer,
        per this question own constraints.
    - id: PARETO-BASELINES
      row_class: pareto_control
      blocking: true
      object: >-
        the generic collision method with distinguished points, the memory-heavy
        generic method, and the automorphism-discounted variant on
        special-invariant instances
      forced_disposition: >-
        MANDATORY matched controls on every toy instance, per this question own
        constraints. NO DOMINATION IS CLAIMED ON ANY AXIS.
  independent_variables:
    - 'curve class in {small-embedding-degree toy curves, full-rational-torsion curve, cyclic controls}'
    - 'embedding degree among the constructed values'
    - 'number of sampled point pairs, as a decay parameter'
    - 'subgroup order in the reduction sizes'
    - 'oracle in {cheating, random-output}'
    - 'group in {elliptic-curve subgroup, ABSTRACT cyclic group}'
  metrics:
    primary:
      - 'the fitted per-curve exponent relating pairing values, and its VARIANCE over point pairs. UNITS: exponent modulo the subgroup order; variance forced exactly 0'
      - 'the rank over the integers modulo the subgroup order of the span of the four bilinear forms, per curve. UNITS: integer, forced 1 on cyclic cells and 4 on the full-torsion curve'
      - 'reduction runs ending with an independently verified on-curve certificate, out of runs where a smooth auxiliary group was found. UNITS: fraction, forced 1'
      - 'random-output-oracle control certification rate. UNITS: fraction, forced 0'
      - 'fraction of random curves with a smooth order at the declared bound, per size. UNITS: fraction'
      - 'ABSTRACT-GROUP instantiation outcomes for the collapse and both reductions. UNITS: categorical. THE ATTRIBUTION METRIC.'
    secondary:
      - 'per curve: field size, subgroup order, embedding degree, and the auxiliary point used in every pairing evaluation'
      - 'the root-of-unity membership check result for every emitted value'
      - 'per reduction run: the subgroup order, the smoothness bound, the auxiliary group and its order'
      - 'matched generic baseline counts on every toy instance'
      - 'wall clock and peak memory per stage'
      - 'the UNEXHIBITED count: reduction runs where no smooth auxiliary group was found within budget, and whether the full-torsion construction succeeded'
  heuristic_under_test: >-
    HEUR-001 (the smooth auxiliary group condition) of H-PFDR-14ca22. The
    dimension count and the two reductions are DERIVATIONS and are not heuristics;
    they are verified by execution rather than validated statistically.
  preregistered_prediction:
    quantity: >-
      The proportionality exponent and its variance; the rank on cyclic cells and
      on the full-torsion curve; the certified reduction fraction and the
      random-oracle control; the smoothness fraction; and the abstract-group
      instantiation.
    formula: >-
      Proportionality holds on 100 percent of cells with the exponent CONSTANT and
      ZERO variance across at least 200 point pairs per curve. RANK EXACTLY 1 on
      every cyclic cell and EXACTLY 4 on the full-rational-torsion curve.
      CERTIFIED REDUCTION FRACTION 100 percent of runs where a smooth auxiliary
      group was found; RANDOM-OUTPUT ORACLE 0 percent. SMOOTHNESS FRACTION within
      the classical prediction by a two-sided binomial test at the 5 percent
      level; at the declared bound the predicted fraction is about 0.0049, so 10^4
      samples give about 49 expected successes with a standard deviation near 7,
      resolving a relative shift of roughly 30 percent -- ADEQUATE TO DETECT A
      GROSS FAILURE OF THE HEURISTIC AND EXPLICITLY NOT ADEQUATE TO CONFIRM THE
      CONSTANT, which is stated here rather than left to be inferred.
      ABSTRACT-GROUP INSTANTIATION reproduces everything exactly.
    source: >-
      H-PFDR-14ca22 claims (C1) to (C6) and predictions P1 to P7. The three
      residual cells this contract addresses were read verbatim by the drafting
      coordinator in H-PAIR-713241 interpretation_limits. FIXED ON 2026-09-04,
      BEFORE ANY CELL RUNS.
  scale_relevance:
    tier: toy
    justification: >-
      Field sizes of 16 to 28 bits, small constructed embedding degrees, subgroup
      orders up to about 2^28 for the reduction demonstration. Nothing
      extrapolates. The dimension count itself is a DERIVATION and does not depend
      on scale; the measurement verifies the implementation over a finite range,
      not the derivation.
    correspondence: 'none; curves are constructed directly'
  tail_checks:
    - >-
      Any cell with a PAIR-DEPENDENT exponent, reported individually with the
      diagnosis order pre-committed: final exponentiation first, auxiliary divisor
      second. No number is reported from such a cell.
    - >-
      The single smoothest observed auxiliary order per size against its predicted
      extreme probability times the sample size.
    - >-
      Every UNEXHIBITED reduction run, listed with its subgroup order and the
      budget consumed. An unexhibited run is neither a pass nor a fail and must
      not be counted as either.
    - >-
      The full-rational-torsion construction attempt, reported in full including
      failure, since a failure there leaves the closure without its exhibited edge
      and that must be visible rather than absorbed.
  replication:
    seeds: ['recorded per curve construction and per smoothness sample batch']
    independent_instances: 20
    reason: >-
      At least 20 constructed curves for the proportionality arm and at least 10^4
      random curves per size for the smoothness census, so the census is a
      measurement rather than an anecdote. The rank arm is an exact integer
      computation and needs three cyclic controls beside the full-torsion curve
      rather than many replicates.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 120
    maximum_workers: 1
    notes: >-
      Pairing evaluations in small extension fields, exact order computations for
      the smoothness census, and a reduction whose only large object is a
      polylogarithmic table. Budget exhaustion is an INFRASTRUCTURE outcome under
      AGENTS.md rule 5 and is reported as UNEXHIBITED, never as evidence about the
      dimension count.
  stages:
    - id: stage-0-derivation
      purpose: >-
        write the dimension count and the rank-4 statement for full rational
        torsion; a reviewer confirms the two cases separate before any machine time
        is spent
      blocking: true
    - id: stage-1-proportionality
      purpose: 'the proportionality measurement on the constructed toy curves, with the non-torsion null and the broken-instrument control'
      blocking: true
    - id: stage-2-rank-edge
      purpose: >-
        the rank measurement on the full-rational-torsion curve and on three cyclic
        controls at the same field size; THE CHEAPEST DECISIVE STEP
      blocking: true
    - id: stage-3-reduction
      purpose: >-
        the end-to-end reduction at the three sizes with the DISCLOSED cheating
        oracle, the random-output control, and independent on-curve certificates
    - id: stage-4-smoothness-census
      purpose: 'the smoothness fraction at each size against the classical prediction'
      blocking: true
    - id: stage-5-abstract-group
      purpose: 'the curve-free instantiation of the collapse and both reductions; BLOCKING FOR ATTRIBUTION'
      blocking: true
    - id: stage-6-report
      purpose: >-
        state which residual cells are reduced to which, name the taxonomy the
        surviving cell is retired into, and record explicitly that the collapse is
        a fact about cyclic groups
  stopping_rules:
    - 'STOP at stage 0 if a reviewer finds the two cases do not separate.'
    - >-
      STOP at stage 1 if any cell shows a pair-dependent exponent that survives the
      broken-instrument and membership controls.
    - >-
      STOP at stage 2 if the full-rational-torsion curve returns rank 1. The
      argument proves too much and the record is void. If NO such curve is
      constructible within budget, report UNEXHIBITED and continue, noting that the
      closure then has no exhibited edge.
    - >-
      STOP the reduction stage if the random-output-oracle control certifies
      anything. The pipeline is reading the harness cheat.
    - >-
      Stage 5 is NOT optional. Reporting the collapse without the abstract-group
      instantiation is an invalidation, not a shortcut.
  invalidation_rules:
    - >-
      Any artifact from the reduction stage lacking the explicit statement that the
      oracle was given the discrete logarithms INVALIDATES that artifact.
    - >-
      Presenting the reduction demonstration as an attack, a break, or evidence of
      any weakness INVALIDATES the artifact making the statement.
    - >-
      Reporting a pairing value without its root-of-unity membership check and the
      auxiliary point used INVALIDATES that value.
    - >-
      Counting a run where no smooth auxiliary group was found as a FAILURE of the
      reduction INVALIDATES the tally. It is UNEXHIBITED at that size.
    - >-
      Describing the rank-1 collapse as a property of ELLIPTIC CURVES INVALIDATES
      the artifact: the abstract-group instantiation reproduces it exactly and the
      curve enters only through computability.
    - >-
      Reading the result as a statement about pairings whose second argument leaves
      the subgroup INVALIDATES the reading; those are the classical transfer and
      are not covered.
    - >-
      Changing the status of H-PAIR-713241 or of RQ-PAIR-21313f from inside this
      run package INVALIDATES it. Only a Coordinator decision may do that.
    - >-
      Reporting the lift that rests on a RECALLED reduction as established
      INVALIDATES the statement until an agent opens the source and records the
      exact conditions.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the derivation and the rank-4
    statement are written and confirmed to separate the two cases; (2)
    proportionality holds on every cell with a constant exponent and zero variance,
    with the non-torsion null failing membership and the broken-instrument copy
    breaking the check; (3) the rank is exactly 1 on every cyclic cell and exactly
    4 on the full-torsion curve, or the full-torsion arm is reported UNEXHIBITED
    with its construction attempt in full; (4) every reduction run with a found
    auxiliary group certifies on the curve, the random-output control certifies
    nothing, and every artifact carries the cheat disclosure; (5) the smoothness
    census is reported with its binomial interval and its stated resolution; and
    (6) the ABSTRACT-GROUP instantiation is run and its implication for how the
    result may be described is stated in the report.
    SUCCESS IS PROTOCOL INTEGRITY. A run that reports the full-torsion arm as
    unexhibited is a partial success and says so.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 ELEMENTARY ALGEBRA CONTRADICTED: a bilinear map on the cyclic subgroup not
    of the predicted form. This would be an instrument or definition error and is
    reported as such.
    F2 PROVES TOO MUCH: proportionality holds on the full-rational-torsion curve
    where rank 4 is predicted. The argument is void.
    F3 REDUCTION FAILS: a run with a found auxiliary group and a genuine oracle
    that fails to certify. Either the reduction is misapplied or the recalled
    statement is wrong; the record is superseded after the source is opened.
    F4 HEURISTIC FAILS: the smoothness fraction is inconsistent with the classical
    prediction at all three sizes. The downstream lift becomes conditional on an
    unvalidated assumption; the direct reduction is unaffected.
    F5 UNEXHIBITED, NOT FAILED: no smooth auxiliary group found within budget at
    some size, or the full-torsion construction not produced in budget. Reported as
    UNEXHIBITED, never as evidence about the dimension count.
    F6 ATTRIBUTION: the abstract-group instantiation reproduces everything, which
    is the PREDICTED outcome. The deliverable is a statement about prime-order
    cyclic groups with a computability caveat, and no elliptic-curve language may
    be used for the collapse itself.
    F7 EVERYTHING HOLDS: the three residual cells are shown to be one cell and
    that cell is the goal; the forward guidance retires the surviving content into
    the existing one-point-map taxonomy; and the closure carries an exhibited edge
    at rank 4. NOTHING in this outcome changes any record status.
  artifact_package_directory: experiments/EXP-PFDR-ef6b61/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/derivation.md (the dimension count and the rank-4 statement, written out, with the reviewer confirmation that the two cases separate)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/proportionality.yaml (per curve: the fitted exponent, its variance over point pairs, the sampled pair count, the membership check per value, the auxiliary point used)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/rank-edge.yaml (the rank on the full-torsion curve and on the three cyclic controls, with the construction attempt reported in full including failure)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/reduction.yaml (per run: subgroup order, smoothness bound, auxiliary group and order, certificate result, and the CHEAT DISCLOSURE sentence; plus the random-output-oracle control results)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/smoothness-census.yaml (the fraction per size with its binomial interval, the stated resolution, and the smoothest observed order against its extreme prediction)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/abstract-group.yaml (the curve-free instantiation of the collapse and both reductions, with an explicit statement of how the result may and may not be described)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/baselines.yaml (matched generic baseline counts on every toy instance, including the automorphism-discounted variant where applicable)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/certificates/ (independent on-curve verification of every recovered scalar)'
    - 'experiments/EXP-PFDR-ef6b61/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F7 fired; per-file sha256; the inference block; the UNEXHIBITED list; and explicit statements that no attack was run, that the oracle was given the logs, and that no record status was changed)'
  interpretation_limits:
    - >-
      A CLOSURE BY DIMENSION COUNT, NOT A HARDNESS RESULT. It moves no exponent,
      mounts no attack, and makes no curve safer than an existing screen does.
    - >-
      Scoped to ordinary prime-field curves and prime cyclic subgroups. On
      supersingular curves and on full rational torsion the rank is larger and the
      families are genuinely different, which the edge arm measures.
    - >-
      THE DOWNSTREAM LIFT RESTS ON A RECALLED REDUCTION that no agent in this
      program has opened, plus the smoothness heuristic. Until the source is read
      the lift is STATED and not relied on; the direct reduction needs neither.
    - >-
      THE ARGUMENT IS CURVE-FREE. The collapse and both reductions are facts about
      cyclic groups of prime order and are reproduced exactly by the abstract-group
      instantiation. Describing the collapse as a property of elliptic curves would
      attribute a group-theoretic fact to a curve.
    - >-
      THE REDUCTION DEMONSTRATION USES AN ORACLE THAT WAS GIVEN THE LOGARITHMS. It
      is soundness-losing by construction, it attacks nothing, and every artifact
      carries that sentence.
    - >-
      The smoothness census resolves a gross failure of the heuristic and
      explicitly does not confirm the constant; that limit is stated rather than
      inferred.
    - >-
      NOVELTY IS NOT ADJUDICATED. The core downstream observation is external and
      only its abstract was read, by another agent in another session; what is new
      to this corpus is the PLACEMENT of that observation as the closure of the
      lane residual cells.
  dominated_by: >-
    AS AN ATTACK: none is mounted; checked row by row against the frontier and
    dominated on every axis by the generic collision method with distinguished
    points, by the automorphism-discounted variant on special-invariant curves, by
    the memory-heavy generic method, by the small-subgroup decomposition where
    applicable, by generic preprocessing, and by the classical transfers on their
    own families. Data and queries: no oracle queries are consumed and none is
    claimed. AS A STRUCTURAL CONTRIBUTION: dominated by the external
    self-bilinear-map observation itself; NOT dominated inside this corpus on the
    PLACEMENT of that observation as the closure of the lane residual cells. NOT
    NULL ON ANY AXIS.
  sota_delta: >-
    Zero on time, memory and data. Content delivered: three declared-open cells
    reduced to one at zero compute by a dimension count; the surviving cell shown
    to be the goal itself, exactly for easy targets and conditionally for the
    subgroup target; one nearby object exhibited where the closure fails, so the
    closure has a measured edge; one executed toy reduction with independent
    certificates and a disclosed cheat; and an abstract-group instantiation fixing
    how the result may be described.
  id_allocation_provenance: >-
    EXP-PFDR-ef6b61 pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260901-2d3f07. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
