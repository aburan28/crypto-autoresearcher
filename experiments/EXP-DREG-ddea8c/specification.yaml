# EXP-DREG-ddea8c
# Degree-3 Macaulay rank of one planted linear factor.
# Not the proposal's d_lf_obs meter. Approved by DEC-20261001-dd55a6.
experiment:
  id: EXP-DREG-ddea8c
  hypothesis_id: H-DREG-49869c
  source_idea: IDEA-20260922-1d595f
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: Planted linear factor versus an unplanted copy, degree cap 3
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-dd55a6
  objective: >-
    Build degree-at-most-3 Macaulay matrices over F_2 for the unplanted
    generators x^2 + y and y^2 + x, for the planted generators x(x^2 + y)
    and y^2 + x, for an exact neighbor copy, and for one gauge substitution
    x |-> x + y with the factor transported to x + y. Compare ranks.
  inputs:
    field: F_2
    degree_cap: 3
    monomial_order: grevlex
    unplanted: ["x^2 + y", "y^2 + x"]
    known_zero: [0, 0]
    planted_factor: x
    synthetic: true
    gauge: "x |-> x + y, y |-> y"
  controls:
    - The neighbor generators equal the unplanted generators.
    - (0, 0) is a zero of the planted generators. If it is not, the run is invalid.
    - Two builders with opposite variable order. They must not import each other. Ranks must agree.
  independent_variables:
    - generating set in {unplanted, planted, neighbor, gauge}
    - variable order
  metrics:
    primary:
      - unplanted_rank
      - planted_rank
      - neighbor_rank
      - gauge_rank
      - planted_drop
      - neighbor_drop
      - gauge_drop
      - known_zero_survives
      - synthetic_flag
      - implementations_agree
    secondary:
      - monomial_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Rank drops at degree cap 3.
    formula: >-
      planted_drop = unplanted_rank - planted_rank, predicted >= 1.
      neighbor_drop = unplanted_rank - neighbor_rank, predicted = 0.
      gauge_drop uses the substituted unplanted rank as its baseline and is
      predicted >= 1.
    source: >-
      IDEA-20260922-1d595f plant rule, read 2026-10-01. The fall-meter
      definition named there was not opened. These ranks are not that meter.
      The numerical ranks were not computed in this design session.
  scale_relevance:
    tier: toy
    justification: Two variables over F_2 and degree cap 3. No curve and no transfer.
    correspondence: null
  tail_checks:
    - The degree-3 monomials are all present. Dropping x^3 or y^3 and still reporting a rank is invalid.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run uses the opposite variable order.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the known zero fails or the synthetic flag is false, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either builder imports the other.
    - known_zero_survives is false.
    - synthetic_flag is false.
    - The output calls the rank d_lf_obs or reports a discrete logarithm.
  success_criterion: >-
    Both runs agree, the known zero survives, the synthetic flag is true,
    planted_drop is at least 1, neighbor_drop is 0, and gauge_drop is at
    least 1.
  falsification_criterion: >-
    The runs agree, the zero survives, the flag is true, and planted_drop
    is 0, or neighbor_drop is not 0, or gauge_drop is 0 while planted_drop
    is at least 1. A planted drop of 0 is no dynamic range on this system.
    A neighbor drop other than 0 is a calibration failure. A gauge drop of
    0 is a coordinate artifact.
  required_artifacts:
    - experiments/EXP-DREG-ddea8c/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-ddea8c/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-ddea8c/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-ddea8c/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-ddea8c/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-ddea8c/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Semaev systems and elliptic curves.
    - The unread fall-meter definition named by the proposal.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
