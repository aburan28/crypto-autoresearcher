experiment:
  id: EXP-ICEX-e0c85b
  hypothesis_id: H-ICEX-87ad66
  derived_from_idea: IDEA-20260731-012
  question_id: RQ-ECDLP-002
  batch_id: BATCH-a70dc3
  version: 1
  title: >-
    Measure the LP-1 exchange rate against its forced value (B + m - 1) / m, and
    locate the precompute amortisation crossover against its computed position
    n* = 2*log2(S_m) - log2(B), on a ladder that straddles it- with a curve-free
    (Z/N, +) arm whose agreement would strip every number here of any
    elliptic-curve content
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. IDEA-20260731-012 proposes that splitting arity m into
    (m-1, 1) with a large-prime pool reduces charged cost per usable relation for
    prime-field point decomposition. H-ICEX-87ad66 derives that it cannot- the
    LP-1 lookups per harvested relation are N / S_{m-1} and the direct lookups
    are N / S_m, whose ratio is exactly (B + m - 1) / m and is independent of the
    pool size. This contract asks whether an implementation charging both sides
    identically reproduces that forced ratio, and whether the source idea's
    pre-registered win band is, as computed, an artifact of the declared toy bit
    sizes sitting below the amortisation crossover.

    (B) WHY THE SOURCE IDEA'S DECLARED CELLS CANNOT DECIDE ANYTHING, COMPUTED
    BEFORE ANY RUN. The direct side pays S_m for its table and B * N / S_m for
    its harvest; those are equal at N = S_m^2 / B. At B = 64 and m = 4 that is
    766480^2 / 64 = 9.1795e9, i.e. n* = 33.10 bits. The source declares 16, 20
    and 24 bits, ALL BELOW IT. Evaluating the source's own charging at n = 24
    gives direct 766480 + 1401 = 767881 and LP-1 45760 + 46929 + 128 = 92817,
    so R_LP = 0.121- inside the band 'R_LP below 0.7' with no mechanism
    involved. Evaluating the same formulas at n = 44 gives R_LP = 33.5. THE BAND
    AS DECLARED IS DEGENERATE- its outcome is fixed by where N sits relative to
    S_m^2 / B. THE REPAIR IS A COMPUTED REPLACEMENT, NOT A LOOSENED THRESHOLD-
    the ladder is moved to n in 24, 28, 32, 36 so that it straddles n* = 33.10,
    and the decision statistic is changed from the scale-dependent scalar R_LP to
    the scale-free exchange rate plus the LOCATION of the measured crossover.

    (C) THE CURVE-FREE ARM IS REQUIRED, NOT OPTIONAL. Every quantity above is a
    multiset count in a finite abelian group and mentions no elliptic curve. A
    curve-free object can therefore reproduce the entire signature, so an arm on
    (Z/N, +) is run at the identical parameters and its consequence is
    pre-stated in falsification_criterion.

    (D) WHAT IS NOT DECIDED HERE. Whether any large-prime variant of point
    decomposition helps at cryptographic scale; whether an LP-2 or cycle-finding
    recombination behaves differently; and whether the multi-target amortisation
    the source idea points at is favourable. All three are outside this contract
    and are named in limitations.
  inputs:
    cost_unit: >-
      GROUP-OPERATION EQUIVALENTS, dimensionless. One elliptic-curve point
      addition equals 1. One hash-table probe is charged at a single constant
      c_probe, frozen in this contract before any run and IDENTICAL on both sides
      and in every arm. One (Z/N, +) addition is also charged at 1, which is the
      declared convention making the curve-free arm comparable. Memory is charged
      in BITS as (table entries) times (key bit-width) and is reported beside,
      never divided into, any time column.
    unit_discipline: >-
      BINDING. Every recorded value carries a tag in {group_ops, bits, count,
      probability, dimensionless, seconds}. Cross-tag arithmetic requires a named
      recorded conversion. RATIOS ARE CHARGED ON BOTH SIDES IN THE SAME UNIT- the
      cost-per-hit ratio is group_ops over group_ops, the table-memory ratio is
      bits over bits, and no ratio in this contract mixes tags.
    frozen_operation_convention: >-
      SHARED WITH EXP-ICEX-60c93c AND EXP-ICEX-64e821. The number of size-m
      multisets from a factor base of B distinct points is
      S_m := binomial(B + m - 1, m), and the expected decompositions per uniform
      target is S_m / N. The alternative convention B^m / p, used in the source
      material of EXP-ICEX-64e821, is NOT used anywhere in this batch- at B = 8,
      m = 3 it gives 512 against S_3 = 120, a factor 4.27, so the two are not
      interchangeable. Any record in this batch quoting a decomposition count
      must quote it under this convention and must cite the instance-set hash
      below.
    instance_set_hash: >-
      TO BE EMITTED BY THE RUN, NOT PRE-FILLED. The executor emits a SHA-256 over
      the canonical serialisation of (curve parameters, N, factor base, pool,
      arity, bit size, seed) for every cell and records it in the manifest. Two
      contracts in this batch that quote a number derived from the same cell must
      quote the same hash, which is what makes a disagreement between them
      decidable rather than a matter of description.
    factor_base: >-
      B distinct points of G drawn by a declared deterministic sampler from the
      seed. The unstructured arm uses uniform random points; a structured arm is
      NOT run in this contract.
    pool: >-
      B_pool distinct points of G, disjoint from the factor base, drawn by the
      same sampler and frozen before harvest.
  controls:
  - >-
    C1 DERIVATION FIXTURE, ZERO COMPUTE, BLOCKING. Assert in exact rational
    arithmetic that binomial(B+m-1,m) / binomial(B+m-2,m-1) equals (B+m-1)/m for
    every B in 8..256 and every m in 3..6, and assert the literal values
    S_4 = 766480, S_3 = 45760 and the ratio 16.75 at B = 64, m = 4. No curve is
    generated until this passes.
  - >-
    C2 CURVE-FREE NULL, REQUIRED, BLOCKING FOR INTERPRETATION. The identical
    harvest, combining and charging on (Z/N, +) with B random residues as the
    factor base and B_pool random residues as the pool, at every completed
    (B, B_pool, m, n) cell. Consequence pre-stated in falsification_criterion.
  - >-
    C3 STRUCTURE-DESTRUCTION NULL, per IDEA-20260731-011 read in full. The
    membership predicate is replaced by a keyed random oracle of identical
    charged cost, with the combining pass retained unchanged because it is
    combinatorial and predicate-independent. Thresholds are the template's own
    0.95, not the source idea's 0.9.
  - >-
    C4 PLANTED-BUG POSITIVE CONTROL. Corrupt 5 percent of harvested relations.
    The combining pass must still produce a matrix whose solve is detected as
    inconsistent by the terminal certificate check. A run set in which the
    planted corruption is NOT detected is void.
  - >-
    C5 RANK CONTROL. No usable-relation cost is credited on either side before
    the combined matrix reaches rank B-1, verified by exact linear algebra over
    Z/N.
  - >-
    C6 MATCHED BASELINE CONTROL. Pollard rho with the negation map and BSGS on
    the identical instances, counted in the same group-operation unit, with BSGS
    memory reported in bits. These are context rows and are never divided into
    the LP-1 or direct columns.
  - >-
    C7 B_pool CANCELLATION CHECK. The cost-per-hit ratio must be invariant across
    B_pool in {32, 64, 128} at fixed (B, m, n), because B_pool cancels in the
    derivation. A ratio that varies with B_pool by more than a factor 1.1
    indicates the pool loop is not charged as declared.
  - >-
    C8 SEED-ORDER CONTROL. Two runs of the same cell with the same seed must
    agree bit-for-bit on every counted quantity; two runs with different seeds
    must agree on the cost-per-hit ratio within the bootstrap interval.
  independent_variables:
  - bit size n in {24, 28, 32, 36}, straddling the computed n* = 33.10 at (B=64, m=4)
  - factor base size B in {64}, with B = 128 as a budget-gated secondary
  - pool size B_pool in {32, 64, 128}
  - arity m in {4}, with m = 5 as a budget-gated secondary
  - arm in {elliptic real, elliptic random-oracle null, curve-free (Z/N,+)}
  metrics:
    primary:
    - >-
      cost_per_hit_lp and cost_per_hit_direct, each in group_ops per harvested
      relation, and their ratio (dimensionless). FORCED VALUE of the ratio is
      (B + m - 1) / m, equal to 16.75 at B = 64, m = 4.
    - >-
      table_entries_direct and table_entries_lp (count) and table_bits_direct and
      table_bits_lp (bits), and their ratio. FORCED VALUE 16.75 at B = 64, m = 4,
      with the literal counts 766480 and 45760.
    - >-
      measured amortisation crossover n_cross- the bit size at which R_LP crosses
      1, obtained by fitting the two charged curves and solving. FORCED VALUE
      n* = 2*log2(S_m) - log2(B) = 33.10 at B = 64, m = 4.
    secondary:
    - R_LP and R_LP_null with bootstrap 95 percent intervals, per cell
    - measured P_hit per attempt against lambda = B_pool * S_{m-1} / N, per cell
    - normalised residual |P_hit - lambda| / lambda across the four-rung ladder
    - N_hit, B_pool_used, combining yield N_hit - B_pool_used, final matrix rank
    - C_precompute, C_harvest, C_combine, C_LA charged separately on both sides
    - precompute fraction of total charged cost, per side, per cell
    - multiset-collision rate in S_{m-1} and hash-collision rate in the pool key
    - matched rho and BSGS group-operation counts; BSGS memory in bits
    - peak resident memory in bytes and serialized artifact bytes, per cell
  heuristic_under_test: HEUR-LP-1
  preregistered_prediction:
    quantity: >-
      The ratio of LP-1 to direct charged lookups per harvested relation, and the
      ratio of direct to LP-1 table entries.
    formula: >-
      'both equal S_m / S_{m-1} = (B + m - 1) / m, with
      S_m = binomial(B + m - 1, m); at B = 64, m = 4 the value is 67/4 = 16.75,
      with S_4 = 766480 and S_3 = 45760. The amortisation crossover is at
      N = S_m^2 / B, i.e. n* = 2*log2(S_m) - log2(B) = 33.10 bits at that cell.'
    source: >-
      Derived in H-ICEX-87ad66 statement (A) by cancelling factorials in the
      multiset counts, composed with the mean-yield conservation identity of
      knowledge/findings/KN-FIND-007.md (opened and read in full by
      TASK-20260904-f2b3db). No external citation is relied on for the
      arithmetic.
  scale_relevance:
    tier: toy
    justification: >-
      n at most 36 bits, B at most 128, m at most 5. The EXCHANGE RATE is
      scale-free by the identity and is the quantity this contract is powered to
      measure. The CROSSOVER LOCATION is scale-dependent and is measured only
      where the ladder straddles it. Transfer to cryptographic N is NOT claimed
      and would require a table of about B^{m-1} entries at B of order 2^40,
      which is out of reach; that limit is stated in limitations rather than
      silently absorbed.
    correspondence: null
  tail_checks:
  - >-
    Compare the observed maximum number of pool hits on a single pool element
    against the Poisson(lambda) upper tail at the same cell. A heavy upper tail
    means concentration and invalidates the independence half of HEUR-LP-1 for
    that cell specifically.
  - >-
    Compare the smallest observed cost-per-hit over all replicates in a cell
    against the smallest over an equal number of random-oracle-null replicates. A
    real effect must shift the whole distribution, not one lucky replicate.
  - >-
    Report the largest per-cell deviation of measured P_hit from lambda and the
    bit size at which it occurs; a deviation growing with n is a departure from
    the counting model in an n-dependent way and must be reported, not corrected.
  replication:
    seeds: [11, 23, 37, 53, 71]
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 240
    maximum_workers: 1
  stopping_rules:
  - >-
    Stop a cell as soon as the combined matrix reaches rank B-1 on both sides and
    at least 5 seeds have completed, or at the per-run wall clock, whichever is
    first.
  - >-
    Stop the ladder at the first rung whose projected LP-1 harvest exceeds 1e9
    charged probes, and record that rung as BUDGET-CENSORED rather than as a
    result.
  - >-
    Run the rungs in ascending n and the arms in the order {derivation fixture,
    curve-free, elliptic real, random-oracle null}. Abort the whole run set if
    the derivation fixture fails.
  - >-
    Do not start the B = 128 or m = 5 secondaries until every primary cell has a
    completed receipt.
  invalidation_rules:
  - >-
    The derivation fixture C1 fails. The whole run set is invalid and no cell is
    interpreted.
  - >-
    The planted-bug control C4 is not detected at any cell. The certificate path
    is not working and every solve in the run set is invalid.
  - >-
    The cost-per-hit ratio varies with B_pool by more than a factor 1.1 at fixed
    (B, m, n). The pool loop is not charged as declared; the affected cells are
    invalid.
  - >-
    Two runs of one cell with an identical seed disagree on any counted quantity.
    The harness is nondeterministic and the run set is invalid.
  - >-
    Any charged quantity is recorded without its unit tag, or any ratio is formed
    across two different tags. Invalid by unit discipline.
  - >-
    Wall-clock, memory, or probe-budget exhaustion. Recorded as
    failed_infrastructure under AGENTS.md rule 5, never as evidence about the
    mechanism.
  success_criterion: >-
    A run set is INFORMATIVE, not successful, and success language is not used
    for either outcome. The contract delivers its object when- C1 passes; every
    primary cell has a completed receipt with rank B-1 reached on both sides; the
    cost-per-hit ratio and the table-memory ratio are each reported with
    bootstrap intervals against their forced value (B + m - 1) / m; the measured
    crossover n_cross is reported against the computed n* = 33.10; the
    residual-decay statistic is reported across all four rungs; and the
    curve-free arm C2 and the structure-destruction null C3 are each reported at
    every completed cell.
  falsification_criterion: >-
    F1 DERIVATION. C1 does not return (B+m-1)/m exactly, or does not return
    766480, 45760 and 16.75 at B = 64, m = 4. H-ICEX-87ad66's arithmetic is
    wrong; the hypothesis is void and must be superseded, not amended.

    F2 EXCHANGE RATE. The measured cost-per-hit ratio is not (B+m-1)/m within a
    factor 1.25 at a completed, control-passing cell. Either the derivation is
    misapplied or the implementation does not charge the declared object; no cost
    conclusion may be drawn from that cell, and the discrepancy is itself the
    reported result.

    F3 SOURCE-CLAIM FALSIFIER, THE EXPECTED OUTCOME. The measured cost-per-hit
    ratio IS (B+m-1)/m within a factor 1.25 AND the measured crossover n_cross is
    within 2 bits of n* = 33.10. Then IDEA-20260731-012's collection-side saving
    is refuted on the tested scope- LP-1 is a memory-for-lookups exchange at a
    forced rate, any R_LP below 0.7 at a rung below n* is recorded as an
    unamortised-table artifact, and it may NEVER be cited as support for the
    source claim. The hypothesis is not thereby supported as a positive result;
    the derivation is, and the scope is the tested cells.

    F4 NULL PARTITION, TOTAL. Whenever R_LP is below 0.7 on the elliptic real
    arm- R_LP_null at least 0.95 admits the cell; R_LP_null strictly below 0.5
    VOIDS it as a predicate-engine artifact; R_LP_null in the closed interval
    0.5 to 0.95 marks it INCONCLUSIVE, citable in neither direction. There is no
    unassigned value.

    F5 CURVE-FREE NULL, CONSEQUENCE PRE-STATED. If the (Z/N, +) arm reproduces
    the cost-per-hit ratio, the table-memory ratio and n_cross within the same
    tolerances as the elliptic arm, then every quantity produced by this contract
    is a statement about multiset counting in a finite abelian group and carries
    NO elliptic-curve or ECDLP content. Any evidence record drawn from this
    contract must then state that in its boundaries, and the result may not be
    reported under an ECDLP heading.

    F6 HEURISTIC. The measured P_hit departs from lambda by more than 15 percent
    systematically across three consecutive rungs, or the normalised residual
    fails to decay by a factor 2 across the ladder. HEUR-LP-1 is falsified on the
    tested scope and every cost number that assumed it is withdrawn.
  required_artifacts:
  - frozen contract hash and the derivation-fixture transcript with exact rationals
  - per-cell instance-set SHA-256 as defined in inputs.instance_set_hash
  - exact command, git commit, dirty-tree state, environment and dependency versions
  - all seeds, sampler parameters, factor base and pool serialisations
  - raw per-attempt counters- probes, hits, group operations, per side and per arm
  - the four charged components C_precompute, C_harvest, C_combine, C_LA per side
  - table entry counts and table bits per side, tagged as count and bits
  - combined matrix, its rank certificate, and the terminal solve certificate
  - planted-bug detection log for C4
  - matched rho and BSGS counters with BSGS memory in bits
  - stdout, stderr, timestamps, peak RSS, and per-cell validity status with reason
  - a machine-readable results table keyed by (arm, n, B, B_pool, m, seed)
  assigned_to: executor
  approved_by: null
