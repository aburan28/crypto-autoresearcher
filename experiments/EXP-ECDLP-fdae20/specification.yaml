    H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4,
    H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6,
    H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931,
    H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6,
    H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-2c6cee
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-600f34
  source_proposal: IDEA-20260904-ca8865
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-2c6cee under the standing 2026-09-06
    user authorization. Stage 0 is the exact charged-bar
    identity calibrator. Ledger audit, stored-walk
    calibration, and a frontier table are later stages
    and are not run here.

  objective: >
    Evaluate the exact integer identity
    C_prep(M, σ*) = 2√(M n) on one frozen
    family (REAL, KF, NULL) and decide
    whether the charged-bar calibrator
    works. Stage 0 does not scan the
    ledger, does not store a walk, and
    does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL C_prep at
      (n, M, σ*)=(16, 4, 1/2) equals 16
      equals 2√(M n), and the M=1 baseline
      equals 8 equals 2√n; KF at σ=0
      equals 20 not 16; NULL cheap-offline
      equals 8 not 16; n=1 and M=0
      rejected. Certificate kind none.
    formula: >
      C_prep(M, σ) = n^{(1+σ)/2} + M n^{(1-σ)/2}.
      At σ* = log M / log n, C_prep = 2√(M n).
      Frozen n=16=2^4 so every required root
      is an integer power of two. FORCED
      Stage 0: fixture_pass,
      real_identity_pass,
      known_false_subopt_pass,
      reject_invalid_pass,
      null_cheap_offline_pass all true.
    source: >
      ledger/proposals/IDEA-20260904-ca8865.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260904-ca8865 also flags a
    ledger audit of committed "beats rho"
    thresholds, a stored-walk calibration
    at toy scale, and a frontier table.
    Stage 0 does not scan the ledger, does
    not implement a walk, and does not
    emit a table. Those arms are Stage 1+
    objects. Exact integer C_prep
    identities are the only Stage 0 arm.
    This is a disclosed tightening, not a
    silent change of the idea's claim.
    The frozen pair is (n, M)=(16, 4).

  inputs:
    fixture:
      n: 16
      M: 4
      sigma_star:
        num: 1
        den: 2
      real:
        id: REAL
        n: 16
        M: 4
        sigma_num: 1
        sigma_den: 2
        must_c_prep: 16
        must_bar: 16
        m1_n: 16
        m1_M: 1
        m1_sigma_num: 0
        m1_sigma_den: 1
        m1_must_c_prep: 8
        m1_must_bar: 8
        role: real_identity
      known_false:
        id: KF
        n: 16
        M: 4
        sigma_num: 0
        sigma_den: 1
        must_c_prep: 20
        must_bar: 16
        must_not_equal_bar: true
        role: known_false_suboptimal_sigma
      matched_null:
        id: NULL
        kind: cheap_offline
        n: 16
        M: 4
        sigma_num: 1
        sigma_den: 2
        must_c_null: 8
        must_bar: 16
        must_not_equal_bar: true
        role: matched_null_cheap_offline
      invalid:
        - id: n-one
          n: 1
          M: 4
          must_reject: true
        - id: M-zero
          n: 16
          M: 0
          must_reject: true
      working_model: >
        Exact charged-bar identity for one
        frozen (n, M) pair. Not a stored
        walk. Not a ledger audit. Not a
        frontier table. Not a rho beat.
      do_not_scan_the_ledger: true
      do_not_store_a_walk: true

  independent_variables:
    - object in the frozen family
    - whether σ equals σ* = log M / log n
    - whether offline is charged as S·T or zeroed

  null_object:
    name: cheap-offline (offline=0) at σ* on (n, M)=(16, 4)
    construction: >
      Drop the offline term of C_prep.
      C_null = M n^{(1-σ*)/2} = 8, which
      is not the bar 16. This is the
      nearby-object control from the
      idea's method_ceiling.
    non_degeneracy_check: >
      known_false_subopt_pass must be
      true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      n=1 and M=0 must be rejected
      before an identity is read as a
      census.

  controls:
    - KF suboptimal σ=0 (known-false / proves-too-much)
    - REAL identity at σ* plus M=1 baseline
    - NULL cheap-offline rejection of collapse
    - n=1 and M=0 rejection
    - exact integer arithmetic, no floats
    - pair frozen before any cost is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_identity_pass boolean
      - known_false_subopt_pass boolean
      - reject_invalid_pass boolean
      - null_cheap_offline_pass boolean
    secondary:
      - REAL C_prep and bar
      - M=1 baseline C_prep
      - KF C_prep
      - NULL C_null
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One frozen integer pair (n, M)=(16, 4).
      No transfer to a ledger audit,
      stored-walk law, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL is the frozen pair (16, 4) at σ*=1/2
    - KF is the frozen suboptimal σ=0 at (16, 4)
    - NULL is cheap-offline at σ*
    - n=1 and M=0 are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_identity_pass,
      known_false_subopt_pass,
      reject_invalid_pass, and
      null_cheap_offline_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-BARS.
    - Stages 1 and later are not authorized.
    - Do not scan the ledger.
    - Do not implement a stored walk.
    - Do not emit a frontier table.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen (n, M) after this freeze
    - Scanning the ledger because a frozen identity fails
    - Reading Stage 0 as a stored walk, ledger audit, frontier table, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Authorizing Stage 1 of EXP-ECDLP-fdae20 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-089e80 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-b3f975 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-daf1bb from this contract
    - Authorizing Stage 1 of EXP-ECDLP-0d1336 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-7f5b05, H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Dispatching EXP-ECDLP-df601f from BATCH-5a5091

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_identity_pass,
    known_false_subopt_pass,
    reject_invalid_pass, and
    null_cheap_offline_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a rho-beat claim
    and not an attack.

  falsification_criterion: >
    A certified KF miss of the gap 20≠16
    after fixture_pass is a scoped miss
    of P-S0-BARS. A certified REAL identity
    miss after fixture_pass is a scoped
    miss of P-S0-BARS. Infrastructure bugs
    are not mathematics. Stage 0 does not
    test P-S1-LEDGER.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One frozen toy pair (n, M)=(16, 4).
    - Not a stored walk. Not a ledger audit.
    - Not a frontier table. Not a rho beat.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of fdae20. No Stage 1 of 089e80.
      No Stage 1 of b3f975. No Stage 1 of daf1bb.
      No Stage 1 of 0d1336. No Stage 1 of 1aa0f8.
      No Stage 1 of 79f8c4. No Stage 1 of 628891.
      No Stage 1 of 9e9536. No Stage 1 of 90f602.
      No Stage 2 of 4be480. No Stage 2 of 6a97f4.
      No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not scan the ledger.
    - Do not dispatch EXP-ECDLP-df601f from BATCH-5a5091.
