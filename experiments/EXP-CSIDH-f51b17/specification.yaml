# EXP-CSIDH-f51b17
# Integer slice of one class number and one memory-cap formula.
# No hidden-shift probe is run. Approved by DEC-20261007-53eaf7.
experiment:
  id: EXP-CSIDH-f51b17
  hypothesis_id: H-CSIDH-272b17
  source_idea: IDEA-20261005-1896e8
  question_id: RQ-CSIDH-64343f
  version: 1
  title: Probe ratio 2 versus blind ratio 1 at class number 9
  status: approved
  frozen: true
  designed_at: '2026-10-07'
  approved_by: coordinator
  approval_decision_id: DEC-20261007-53eaf7
  objective: >-
    Check the class number 9, the probe ratio 2, and the blind ratio 1.
  inputs:
    class_number: 9
    bit_length: 4
    memory_cap: 4
    cost_at_2: 8
    cost_at_cap: 4
    probe_ratio: 2
    blind_ratio: 1
    ratio_gap: 1
    ratio_product: 2
    ratio_sum: 3
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      Discriminant -419 has the nine forms with coefficients 1, 1, 105
      and 3, -1, 35 and 3, 1, 35 and 5, -1, 21 and 5, 1, 21 and
      7, -1, 15 and 7, 1, 15 and 9, -7, 13 and 9, 7, 13.
    - >-
      The probe cost at cap 2 is 8 and at cap 4 is 4. Their ratio is
      2. The blind ratio is 1. Reporting both ratios as 1 drops the
      gap and invalidates the run.
    - >-
      Two exceeds one by 1. The product of 2 and 1 is 2. Their sum
      is 3. Two readings of the blind ratio are both 1, and their
      product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {forms, costs}
  metrics:
    primary:
      - class_number
      - probe_ratio
      - blind_ratio
      - implementations_agree
    secondary:
      - cost_at_2
      - cost_at_cap
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Discriminant -419 has class number 9. The probe ratio is 2 and
      the blind ratio is 1. The gap of two blind ratios is 0.
    formula: >-
      Count the reduced forms of discriminant -419. Set n to 4.
      Set the memory cap to 2 to the power 2. Divide the cost 8 by
      the cost 4. Divide the blind cost by itself.
    source: >-
      IDEA-20261005-1896e8 writes discriminant -419 and the probe
      formula, read 2026-10-07. The forms and the costs were
      recomputed in this design session. That computation is not a
      run. No hidden-shift probe was run.
  scale_relevance:
    tier: toy
    justification: One written class number and one written formula. No transfer to CSIDH-512.
    correspondence: null
  tail_checks:
    - The probe ratio 2 and the nearby gap 0 are required. A check that stops at the class number 9 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the probe ratio 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The class number is not 9.
    - The probe costs are not 8 and 4.
    - The probe ratio is not 2.
    - Both ratios are reported as 1, or a hidden-shift probe is run.
  success_criterion: >-
    Both runs agree that the class number is 9, that the probe ratio
    is 2, and that the blind ratio is 1.
  falsification_criterion: >-
    The runs agree that the probe ratio is computed, and that ratio
    is not 2.
  decision_impact:
    on_positive: >-
      Agreement that the class number is 9 and the probe ratio is 2
      records that the written formulas separate at this class number.
      It does not run a hidden-shift probe.
    on_negative: >-
      Agreement that the probe ratio is not 2 records that the written
      formulas do not separate at class number 9. A search for a
      different class number stays open.
  required_artifacts:
    - experiments/EXP-CSIDH-f51b17/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CSIDH-f51b17/runs/<RUN-ID>/command.txt
    - experiments/EXP-CSIDH-f51b17/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CSIDH-f51b17/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CSIDH-f51b17/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CSIDH-f51b17/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any hidden-shift probe, isogeny walk, or CSIDH-512 security figure.
    - Any claim that a ratio gap of 1 moves an exponent.
    - Any count of points on a curve over the prime 419.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
