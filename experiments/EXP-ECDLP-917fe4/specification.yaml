# EXP-ECDLP-917fe4
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-57115a.
experiment:
  id: EXP-ECDLP-917fe4
  hypothesis_id: H-ECDLP-c53531
  source_idea: IDEA-20261004-0f7a2d
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-32 table versus width-31 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-57115a
  objective: >-
    Check the table sizes 2147483648 and 1073741824, the product 2305843009213693952, and the nearby gap 0.
  inputs:
    width_hi: 32
    width_lo: 31
    table_hi: 2147483648
    table_lo: 1073741824
    table_gap: 1073741824
    table_product: 2305843009213693952
    table_sum: 3221225472
    nearby_a: 1073741824
    nearby_b: 1073741824
    nearby_gap: 0
    nearby_product: 1152921504606846976
  controls:
    - >-
      Two to the power 31 is 2147483648. Two to the power 30 is 1073741824.
      Reporting both tables as size 1073741824 drops the gap and invalidates
      the run.
    - >-
      Two billion one hundred forty-seven million four hundred eighty-three
      thousand six hundred forty-eight exceeds one billion seventy-three
      million seven hundred forty-one thousand eight hundred twenty-four by
      1073741824. The product of the two sizes is 2305843009213693952. Their
      sum is 3221225472.
    - >-
      Two width-31 tables each store 1073741824. Their gap is 0 and their
      product is 1152921504606846976.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-32 table stores 2147483648 entries. The width-31 table stores
      1073741824. The gap of two width-31 tables is 0.
    formula: >-
      Compute 2 to the power 31. Compute 2 to the power 30. Subtract
      1073741824 from 2147483648. Multiply 2147483648 by 1073741824. Subtract 1073741824 from 1073741824.
    source: >-
      IDEA-20261004-0f7a2d states the widths 32 and 31 and the sizes
      2147483648 and 1073741824, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 2305843009213693952 and the nearby gap 0 are required. A check that stops at the size 2147483648 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 2147483648 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 31 is not 2147483648.
    - Two to the power 30 is not 1073741824.
    - The gap is not 1073741824.
    - The product is not 2305843009213693952.
    - Both tables are reported as size 1073741824, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-32 table stores 2147483648 entries, that
    the width-31 table stores 1073741824, and that 2147483648 exceeds 1073741824 by 1073741824.
  falsification_criterion: >-
    The runs agree that the width-32 table size is computed, and
    that size is not 2147483648.
  required_artifacts:
    - experiments/EXP-ECDLP-917fe4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-917fe4/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-917fe4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-917fe4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-917fe4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-917fe4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 1073741824 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
