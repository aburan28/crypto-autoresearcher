experiment:
  id: EXP-SDITH-991951
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SDITH-f1acdd
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: >-
    MPCitH grinding audit: exact-rational evaluation of the two-strategy forgery
    cost, its interior optimum against the naive product bound, and a
    quantifier-order classification of the specification's soundness statement

  objective: >-
    If later approved, frozen and authorized, answer the second half of
    GOAL-SDITH-001's objective -- "whether the MPCitH transform's soundness
    leaves any grinding slack" -- with a computation rather than an inherited
    assurance. Build an exact-rational evaluator for the two-strategy forgery
    cost min over tau' of [ 1/P_1(tau',tau,p) + N^{tau-tau'} ], validate it
    against a forced-value null and a 47.52-bit positive control, and then either
    compare it against SDitH's transcribed claim or, if no specification can be
    obtained, deliver the validated evaluator and its family-level results and
    say plainly that no statement about SDitH follows.

  what_this_is_not:
    - >-
      NOT a forgery. No signature is generated, no hash is ground, no message is
      signed, no verifier is run, and no SDitH implementation is executed or
      required.
    - >-
      NOT a break, at any claim tier. docs/claims-and-verification.md requires a
      claimed forgery to carry a signature that a run wrapper independently
      re-verifies; none exists here because nothing is forged.
    - >-
      NOT a new attack. The evaluated strategy is recalled to be a standard and
      well-known one, and the contract says so rather than dressing it as
      discovery.
    - >-
      NOT a security proof or a security level for SDitH. One charged attack is
      not a proof, and the audit cannot see the GGM-tree/VOLE soundness question,
      within-repetition strategy mixing, or any implementation attack.
    - >-
      NOT a statement about syndrome-decoding hardness. That independence is
      deliberate: a finding here survives whatever EXP-SDITH-162cc1 concludes.
    - >-
      NOT approval, freezing, execution authorization, a run, an observed output,
      or evidence. Every numeric value in this contract is a PRE-REGISTERED
      PREDICTION derived on 2026-08-05 during ideation, not a measurement.

  claim_ceiling:
    tier: toy
    scope: >-
      TIER toy, and again the limiter is object rather than scale. The arithmetic
      is exact at the parameter magnitudes real schemes use -- tau up to 64,
      N up to 256, exact rational tails -- so nothing is extrapolated. But the
      object is a cost-function evaluation, no forgery exists, and no certificate
      is producible, so docs/claims-and-verification.md admits nothing above toy.
      The exact scope a completed run could support: "for the cost function
      stated in the hypothesis, at the (tau, N, p) triples enumerated in inputs,
      the interior optimum is the stated number of bits, the optimal split is the
      stated tau*, and (if Stage 0 succeeded) the transcribed claim differs from
      it by the stated amount." Nothing broader, and in particular no sentence of
      the form "SDitH is secure" or "SDitH is insecure" is admissible from this
      contract under any outcome.

  inputs:
    illustrative_grid:
      tau: [1, 2, 4, 8, 16, 17, 32, 48, 64]
      N_and_p_pairs:
        - {N: 256, p: "1/256"}
        - {N: 256, p: "1/251"}
        - {N: 32, p: "1/251"}
        - {N: 32, p: "1/32"}
        - {N: 2, p: "1/2"}
        - {N: 256, p: "0"}
        - {N: 2, p: "0"}
    grid_provenance: >-
      ALL ILLUSTRATIVE AND NONE IS SDitH'S. Chosen during ideation to span a
      large-N and a small-N regime, to include p = 1/N where the half-exponent
      structure is cleanest, to include p = 0 as a second null, and to include
      tau = 1 as the primary null. SDitH's specification is NOT READ and its
      (tau, N, p) are unknown to this contract.
    sdith_parameters: >-
      TO BE TRANSCRIBED IN STAGE 0 IF OBTAINABLE. Required fields: tau, N, the
      first-phase false-positive rate p and how the specification defines it, the
      claimed forgery security in bits, the claimed EUF-CMA security level, and
      the verbatim soundness statement with a page reference. If Stage 0 fails,
      this field remains empty and every downstream statement is scoped to the
      illustrative grid, per stopping rule SR-4.
    cost_function: >-
      cost(tau, N, p) = min over integers tau' in [0, tau] of
      [ 1/P_1(tau',tau,p) + N^(tau-tau') ], where
      P_1(tau',tau,p) = sum over i in [tau', tau] of C(tau,i) p^i (1-p)^(tau-i).
      Terms with P_1 = 0 are inadmissible and are skipped, not treated as
      infinite cost by floating-point overflow.
      THIS FUNCTION IS RECALLED-UNVERIFIED. It is written from memory of a
      standard forgery attack on parallel-repeated 5-round Fiat-Shamir
      identification. NO AUTHOR, VENUE, YEAR, THEOREM NUMBER OR PAGE IS
      ASSERTED. Verifying it against a primary source is Stage 0 and its failure
      voids every number this contract predicts.
    naive_bound: "min(tau * log2(1/p), tau * log2 N) bits"
    seeds: []
    seed_derivation_rule: >-
      NO SEEDS ARE USED AND NONE MAY BE INTRODUCED. Every stage is
      DETERMINISTIC: an exhaustive minimization over tau + 1 integers in exact
      rational arithmetic. There is no sampling, no randomness, no Monte Carlo,
      and therefore no seed. A third party reproduces every number bit-for-bit
      from the grid above and the cost function above using nothing but a bare
      Python interpreter with fractions and math.
    environment_measured_2026_08_05:
      python: "3.11.15"
      numpy: "2.4.6 importable"
      sympy: "NOT INSTALLED"
      note: >-
        Recorded because the session ANGLE-BRIEF reports two scouting sweeps
        disagreeing about this container. Measured directly. Neither library is
        used: fractions.Fraction and math.comb suffice, and Fraction is REQUIRED
        rather than preferred -- see the exactness clause in tail_checks.

  arms_and_controls:
    treatment: >-
      ARM T1: for every (tau, N, p) in the illustrative grid, compute in exact
      Fractions the cost, its log2, the minimizing tau*, the naive bound, the
      slack (naive minus exact), and the ratio (exact / naive).
      ARM T2 (only if Stage 0 succeeded): the same quantities at SDitH's
      transcribed (tau, N, p), plus the signed difference between the
      specification's claimed forgery security and the computed interior optimum.
      ARM T3 (pen and paper, no compute): classify the specification's soundness
      statement as "FOR ALL adversaries ... with the minimum over tau' inside the
      bound" or "THERE EXISTS tau' such that FOR ALL adversaries ...", quoting the
      sentence verbatim with a page reference.
    measured_null: >-
      NULL-1 (tau = 1), THE PRIMARY NULL. The identical code path with a single
      repetition, where the minimization ranges over only the two endpoints and
      no interior point exists. FORCED VALUE DERIVED BEFORE ANY RUN: slack is
      NON-POSITIVE, computed as -0.01 bits at (N,p) = (256, 1/256) and -0.58 bits
      at (2, 1/2). IT CAN FAIL, AND THE WAYS IT FAILS ARE NAMED IN ADVANCE: an
      off-by-one in the tail sum's lower limit, or dropping the additive +1
      terms, each produces a positive slack here. This is a null of the same
      shape, not a decoration.
      NULL-2 (p = 0), THE SECOND NULL, BRACKETING FROM THE OPPOSITE SIDE. With no
      first-phase cheating possible, P_1(tau',tau,0) = 0 for every tau' >= 1, only
      tau' = 0 is admissible, and the cost is FORCED to exactly 1 + N^tau with
      slack exactly 0 against the naive bound tau log2 N. This separates
      "grinding is possible" from "grinding helps".
    positive_control: >-
      POS-1, THE EFFECT MUST APPEAR: (tau, N, p) = (64, 2, 1/2). FORCED VALUE
      DERIVED BEFORE ANY RUN: slack = 47.52 bits (naive 64.00, exact 16.48), with
      tau* = 48. IF THE INSTRUMENT RETURNS UNDER 20 BITS OF SLACK HERE IT CANNOT
      DETECT GRINDING SLACK AT ALL, AND NO NEGATIVE CONCLUSION ABOUT SDitH MAY BE
      REPORTED FROM THIS RUN.
      POS-2, A SECOND SENSITIVITY DEMONSTRATION AT THE OPPOSITE END OF THE N
      RANGE: (tau, N, p) = (32, 256, 1/256), forced slack 140.59 bits with
      tau* = 18. Two positive controls at N = 2 and N = 256 mean an instrument
      that is sensitive only in one N regime is caught.
    graded_control: >-
      GRAD-1 (tau-axis, 4 interior points, monotonicity reported). tau in
      {1, 2, 4, 8, 16, 32} at N = 256, p = 1/256. PRE-REGISTERED VALUES derived
      2026-08-05: slack = -0.01, 7.41, 15.78, 31.98, 69.22, 140.59 and tau* =
      0, 1, 2, 4, 9, 18. The slack must be strictly increasing for tau >= 1.
      REPORTING tau* ALONGSIDE THE SLACK IS WHAT MAKES THIS DIAGNOSTIC RATHER
      THAN DECORATIVE: a slack that grows while tau* stays pinned at an endpoint
      means the minimization is not exploring the interior, and a slack-only
      report would hide exactly that failure.
      GRAD-2 (N-axis, a SECOND and independent axis). N in {2, 32, 256} at
      p = 1/N, tau in {2, 4, 8, 16, 32, 48, 64}. PRE-REGISTERED ratios
      exact/naive: at N = 256, 0.5366, 0.5070, 0.5003, 0.4592, 0.4508, 0.4476,
      0.4458; at N = 32, 0.5593, 0.5116, 0.4844, 0.4394, 0.4217, 0.4174, 0.4138;
      at N = 2, 0.8685, 0.5946, 0.4283, 0.3360, 0.2838, 0.2656, 0.2575. Each row
      must be decreasing in tau, and the rows must be ordered N = 2 below N = 32
      below N = 256 at every tau >= 8. Agreement on the tau axis while failing on
      the N axis LOCALIZES the error to the binomial-multiplicity term rather
      than leaving "the numbers were off".
      GRAD-3 (split-fraction axis). tau*/tau at p = 1/N: pre-registered at least
      0.5 at every cell, with the excess above 0.5 strictly larger at N = 2
      (rising to 0.750) than at N = 256 (rising to 0.562).
    ordering_control: >-
      MANDATORY AND ITS ABSENCE IS AN INVALIDATION. Execute, record and
      hash-commit NULL-1, NULL-2, POS-1, POS-2 and both graded sweeps BEFORE any
      SDitH parameter is read, transcribed or evaluated, and before the
      specification's claimed security figure is looked at. The frozen decision
      rule -- "slack above +10 bits is grinding slack; below -10 bits is
      conservatism; within 2 bits is no slack" -- is applied to NULL-1 and POS-1
      first. If it emits the same label on both, it discriminates nothing and
      must be rewritten before any treatment arm is read.
    comparability_policy: >-
      Costs at different (tau, N, p) are NOT comparable as absolute magnitudes
      and may not be pooled. Only the derived within-cell quantities -- slack,
      ratio, tau*/tau -- may be compared across cells, and only as a pattern.
      The grinding budget and the generic hash-security budget are SEPARATE and
      must never be merged into a single reported figure; if the specification's
      headline is a minimum over both, that structure is reported explicitly.
      Comparison against MQOM or FAEST requires their own transcribed triples and
      may not reuse SDitH's.

  metrics:
    primary:
      - >-
        Exact interior optimum log2 cost(tau, N, p), as a Fraction converted to
        log2 once at presentation.
      - >-
        Grinding slack in bits: naive product bound minus the exact interior
        optimum.
      - >-
        Signed difference between SDitH's claimed forgery security and the exact
        interior optimum at SDitH's own triple (Stage 2 only).
      - >-
        Quantifier-order classification of the specification's soundness
        statement, as a binary verdict with the verbatim sentence attached.
    secondary:
      - Optimal split tau* and the fraction tau*/tau per cell.
      - Ratio (exact / naive) per cell.
      - Whether the specification's tau leaves MARGIN above lambda or sits exactly at it.
      - >-
        Whether the specification's construction correlates randomness across
        repetitions, which decides whether the binomial model applies at all.
      - Source-provenance record: every attempt, its status, and what was obtained.
      - Float-versus-Fraction cross-check residual per cell.

  heuristic_under_test: HEUR-SDITH-F1A-2
  heuristic_under_test_note: >-
    HEUR-SDITH-F1A-2 (independence of first-phase outcomes across repetitions) is
    the heuristic this contract most directly tests, and it is tested BY READING
    THE CONSTRUCTION in Stage 0 rather than by computation -- if the repetitions
    share randomness through a seed tree or hypercube optimization, the binomial
    tail is the wrong model and reporting that is the finding. HEUR-SDITH-F1A-1
    (the recalled cost function) is tested by Stage 0's source check.
    HEUR-SDITH-F1A-3 (no better strategy) is tested only by Stage 3's
    pen-and-paper argument and is NOT closed by this contract; until it is, every
    computed cost is an UPPER BOUND on the forger's cost and every comparison
    carries that direction.

  preregistered_prediction:
    quantity: >-
      Seven gates K1 through K7, fixed before any execution and not tunable to
      the data.
    formula: >-
      K1: slack <= 0 at tau = 1 for every (N, p); derived -0.01 at (256,1/256)
          and -0.58 at (2,1/2).
      K2: slack = 47.52 +/- 0.05 bits at (64, 2, 1/2), with tau* = 48.
      K3: slack = 0 exactly at p = 0 for every (tau, N), with tau* = 0.
      K4: slack strictly increasing across tau in {1,2,4,8,16,32} at
          (N,p) = (256,1/256), matching -0.01, 7.41, 15.78, 31.98, 69.22, 140.59
          within 0.05 bits and tau* matching 0, 1, 2, 4, 9, 18 EXACTLY.
      K5: ratio exact/naive within [0.44, 0.54] at N = 256, p = 1/256, for tau in
          [2,64], decreasing; derived 0.5366, 0.5070, 0.5003, 0.4592, 0.4508,
          0.4476, 0.4458.
      K6: tau*/tau >= 0.5 at every cell with p = 1/N, with the excess above 0.5
          strictly larger at N = 2 than at N = 256.
      K7: SDitH's claimed forgery security within 2 bits of the exact interior
          optimum, if Stage 0 supplies the triple. Above +10 bits is grinding
          slack; below -10 bits is conservatism; both are reported with equal
          weight.
    source: >-
      Derived on 2026-08-05 during ideation, in exact fractions.Fraction
      arithmetic, from the cost function stated in this contract's inputs and in
      H-SDITH-f1acdd's mechanism field, and recorded in IDEA-20260805-bf6448
      before this contract was written. The cost function itself is
      RECALLED-UNVERIFIED and its verification is Stage 0.

  scale_relevance:
    tier: toy
    justification: >-
      There is NO SCALE GAP in the arithmetic: the grid's tau and N are the
      magnitudes real MPCitH schemes use, and the tails are exact rationals, so
      nothing is extrapolated from a small case to a large one. The tier is toy
      because the object is a cost-function evaluation with no certificate, not
      because the numbers are small. What limits transfer is therefore stated as
      an object limit and not as a scale limit: the conclusion transfers to any
      scheme whose forgery cost is the stated function and whose (tau, N, p) are
      known, and transfers nowhere else.
    correspondence: >-
      null. Nothing is sampled; the minimization is exhaustive over a finite
      index set.

  tail_checks:
    - >-
      EXACTNESS IS REQUIRED, NOT PREFERRED. Every tail sum is computed in
      fractions.Fraction. A float recomputation is reported alongside and any
      disagreement above 1e-9 in the log2 is an INTEGRITY FAILURE, not a rounding
      note. The reason is concrete: at tau = 64 with p = 1/256 the terms
      C(64,i) p^i (1-p)^(64-i) underflow double precision for large i, and a
      float implementation returns a WRONG tau* silently, with no error and no
      warning. A run that cannot demonstrate it used exact arithmetic is invalid.
    - >-
      ENDPOINT CONSISTENCY. cost evaluated at tau' = 0 must equal 1 + N^tau
      exactly, and at tau' = tau must equal 1/p^tau + 1 exactly, at every cell.
      These are closed forms and any deviation is an implementation error.
    - >-
      INTERIORITY. For every cell with tau >= 2, 0 < p < 1 and N > 1, the
      minimizer must satisfy 0 < tau* < tau. A minimizer at an endpoint in that
      regime contradicts the structural claim and must be reported, investigated,
      and not smoothed over.
    - >-
      MONOTONICITY OF P_1. P_1(tau',tau,p) must be non-increasing in tau' at
      every cell, by construction of an upper tail. A violation is an
      implementation error.
    - >-
      BUDGET SEPARATION. The reported grinding cost must never be silently
      combined with a generic hash bound. If the specification's headline is a
      minimum over both, both are reported and the minimum is shown as a
      derivation, not as a single number.

  replication:
    seeds: []
    independent_instances: 0
    interpretation: >-
      REPLICATION IS NOT APPLICABLE AND SAYING SO IS MORE HONEST THAN LISTING A
      SEED. Every stage is a deterministic exhaustive minimization; a second run
      returns identical bits and tests the machine, not the result. What replaces
      replication is INDEPENDENT RE-DERIVATION: every primary number must be
      reproduced by a second implementation written from the cost function alone,
      without reference to the first, and both sources archived and diffed. A
      disagreement halts the run under SR-6 and is reported rather than resolved
      by picking a side.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.1
    maximum_memory_gb: 1
    maximum_runs: 3
    stage_budgets:
      stage0_source_acquisition_seconds: 5400
      stage1_controls_seconds: 60
      stage2_sdith_comparison_seconds: 60
      stage3_pen_and_paper_seconds: 3600
    note: >-
      The compute is MILLISECONDS. The entire wall clock is Stage 0's reading and
      Stage 3's reasoning. THE CHEAPEST STAGE IS DECISIVE AND RUNS FIRST.

  stage_order:
    - >-
      STAGE 0 (reading; may fail; failure is infrastructure signal). Two
      independent acquisitions, each recorded separately. (0a) An SDitH
      specification: transcribe tau, N, p, the claimed forgery security, the
      verbatim soundness statement, and whether the construction correlates
      randomness across repetitions. (0b) A primary source for the forgery cost
      function: check the recalled formula against it. Declared source-preference
      order for both: the scheme's own project page, then a versioned public code
      repository, then an ePrint abstract page, then an arXiv record, then an
      author-hosted copy. Every attempt and its HTTP status is logged. If (0b)
      shows the recalled function is wrong, the run STOPS and the finding is
      recorded as a correction to this contract's premise -- and that is a real
      deliverable, not a wasted batch.
    - >-
      STAGE 1 (milliseconds; runs regardless of Stage 0's outcome; CAN TERMINATE
      THE RUN). NULL-1, NULL-2, POS-1, POS-2, GRAD-1, GRAD-2, GRAD-3, committed
      and hashed before anything from Stage 0 is evaluated.
    - >-
      STAGE 2 (milliseconds; only if 0a succeeded). K7 at SDitH's triple, with
      the margin analysis.
    - >-
      STAGE 3 (pen and paper). The quantifier-order classification, and the
      HEUR-SDITH-F1A-3 check: can a forger do better by mixing strategies WITHIN a
      repetition, or by adaptively re-grinding already-settled repetitions? If
      neither can be discharged, every computed cost is relabelled an upper bound
      and every comparison carries that direction.

  stopping_rules:
    - >-
      SR-0. Do not execute unless this contract is separately approved, frozen,
      archived and authorized by the Coordinator. No approved_by field is present
      because it is not approved.
    - >-
      SR-1. Stop and report if K1 fails (positive slack at tau = 1). The
      implementation is wrong and no number may be reported.
    - >-
      SR-2. If K2 fails, complete the run but report NO negative conclusion about
      SDitH's grinding accounting. The instrument's sensitivity is
      undemonstrated.
    - >-
      SR-3. Stop and report if Stage 0b shows the recalled cost function is not
      the right one. The premise is void; the correction is a new superseding
      record and never an edit to this one.
    - >-
      SR-4. If Stage 0a obtains no specification, run Stage 1 and Stage 3 and
      scope every statement to the illustrative grid. PRE-REGISTERED AS A
      NON-FAILURE: GOAL-SDITH-001 carries a pause condition anticipating exactly
      this, and the deliverable degrades from "SDitH's number" to "a validated
      evaluator plus the family's structure".
    - >-
      SR-5. If Stage 0a shows the repetitions share randomness, STOP evaluating
      K7 and report that fact as the finding. Evaluating a binomial model that
      does not apply would be worse than reporting no number.
    - >-
      SR-6. Stop if the two independent implementations disagree on any primary
      metric beyond the exactness tolerance, and report the disagreement rather
      than picking a side.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - >-
      Any SDitH parameter or claimed security figure read or evaluated before the
      nulls, positive controls and graded sweeps are committed and hashed. The
      ordering control is not advisory: knowing the target number before running
      the instrument is exactly how a threshold gets adjusted.
    - >-
      Any use of floating point in a tail sum or in a comparison against a
      declared threshold.
    - >-
      Any threshold or gate value adjusted after a number is observed. An
      amendment requires a versioned protocol_amendment marked exploratory_only.
    - >-
      Any merging of the grinding budget with a generic hash-security budget into
      a single reported figure.
    - >-
      Any assertion of an author, venue, year, theorem number or page for the
      cost function that was not actually obtained in Stage 0b. The formula
      remains RECALLED-UNVERIFIED until a source is in hand, and a run record
      that upgrades that label without a source is invalid.
    - >-
      Any statement of the form "SDitH is secure" or "SDitH is insecure" anywhere
      in the run record or its summary.

  success_criterion: >-
    THIS CONTRACT HAS NO CURRENT SUCCESS OUTCOME BECAUSE IT IS NOT AUTHORIZED FOR
    EXECUTION. If a later, separately approved and frozen successor is executed,
    its only positive disposition is: NULL-1 non-positive and NULL-2 exactly
    zero; POS-1 at 47.52 +/- 0.05 bits with tau* = 48 and POS-2 at 140.59 bits
    with tau* = 18; both graded sweeps monotone within their pre-registered bands
    with tau* matching exactly; the exactness cross-check passing at every cell;
    the ordering control satisfied and hash-committed; and either K7 evaluated
    with its margin analysis or an explicit record that no specification was
    obtained. THAT DISPOSITION ESTABLISHES NO FORGERY, NO BREAK, AND NO SECURITY
    LEVEL. It establishes one validated evaluator and, at most, one arithmetic
    comparison.

  falsification_criterion: >-
    The hypothesis H-SDITH-f1acdd is falsified in whole or in part by any of:
    K4 or K5 failing (the half-exponent account refuted); K6 failing (the
    binomial-multiplicity account refuted); Stage 0b showing the recalled cost
    function is wrong (part G1 and G2 void, superseded not edited); Stage 0a
    showing the repetitions share randomness (HEUR-SDITH-F1A-2 refuted and the
    binomial model inapplicable, which is a MORE valuable finding than the
    arithmetic because it would mean the standard accounting is the wrong model
    rather than a stale number); or K7 exceeding +10 bits (part G3 refuted,
    grinding slack present, and AGENTS.md rule 12 routing any consequent claim to
    independent review-breakthrough at max BEFORE it is written anywhere,
    including in a batch summary). Each of these is a RESULT and none is a
    failure of the run.

  infrastructure_failure_disposition: >-
    A network failure, proxy rejection, missing document, timeout, crash or
    absent dependency is INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE MATHEMATICAL
    EVIDENCE (AGENTS.md rule 5, restated because Stage 0's likeliest outcome is a
    failed fetch). Specifically: an inability to obtain the SDitH specification
    is NOT evidence that the transform leaves no grinding slack, NOT evidence
    that it does, and NOT a licence to substitute remembered parameters.
    Remembered (tau, N, p) may not be used at all; the illustrative grid is
    labelled illustrative so that no reader can mistake it for SDitH's. A stage
    that cannot complete for infrastructure reasons is recorded as
    failed_infrastructure with the stage named, the reason, and every attempt
    logged -- not as invalid, and not as a negative result.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - >-
      Two independent implementations of the cost function, each written from the
      formula alone, with both sources archived and their outputs diffed.
    - >-
      Stage 0 provenance log, split into 0a and 0b: every URL or path attempted,
      the HTTP status or filesystem result, and either the transcribed material
      with page references or an explicit record that nothing was obtained.
    - >-
      Committed and hashed control outputs, timestamped before any SDitH-derived
      output exists.
    - >-
      Complete grid table: cost, log2 cost, tau*, tau*/tau, naive bound, slack
      and ratio at every cell, with the Fraction-versus-float residual.
    - Both graded sweeps with explicit monotonicity verdicts and the N-ordering check.
    - >-
      The verbatim soundness statement with its page reference and its
      quantifier-order classification, or a record that it could not be obtained.
    - >-
      An explicit statement of whether the specification's construction
      correlates randomness across repetitions, or that this could not be
      determined.
    - >-
      The Stage 3 argument on within-repetition mixing and adaptive re-grinding,
      with its verdict, and a relabelling of all costs as upper bounds if it is
      not discharged.
    - Manifest, environment record, exact command, stdout, stderr, and an execution report.
    - >-
      A forward-guidance section naming what remains open regardless of outcome:
      within-repetition strategy mixing; the shared GGM-tree/VOLE soundness
      question spanning SDitH, MQOM and FAEST that no record in this program
      owns; whether the specification's tau carries margin above lambda; and the
      identical computation for MQOM and FAEST, for which this instrument is
      unchanged.

  approval_requirements:
    - >-
      Independent review confirms that the cost function is labelled
      RECALLED-UNVERIFIED everywhere it appears, that no author, venue or theorem
      number is asserted anywhere in the contract, and that Stage 0b is a genuine
      gate rather than a formality.
    - >-
      Independent review confirms that every numeric value in this contract is
      labelled as a pre-registered prediction derived during ideation and that
      none is presented as a measurement.
    - >-
      Independent review confirms the ordering control is enforceable as written:
      that no SDitH figure can be read before the controls are hash-committed.
    - Coordinator separately approves and freezes without editing this draft.
    - Execution is separately authorized after the approved frozen package is delivered.

