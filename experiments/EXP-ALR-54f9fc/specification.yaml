experiment:
  id: EXP-ALR-54f9fc
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-21ae6c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-21ae6c
  question_id: RQ-ALR-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Zero-compute dimensional audit of the ALR cost comparison: reconstruct the base of B in
    the represented-route 7/2 exponent and in the 5/2 rho proxy from committed records, with two bracketing
    commensurability nulls'
  objective: 'The run reduces one uncertainty: whether the single comparison that carries the ALR
    lane''s cost verdict is well posed. (i) It quotes verbatim from EV-ALR-001 and EV-ALR-002 the
    sentences charging the represented routes at B^(7/2) against a B^(5/2) rho proxy, and attempts
    to reconstruct, from committed records alone, a definition of B on each side in terms of primitive
    parameters, reporting per represented route whether such a definition is reconstructible and flagging
    any substitution the experimenter had to supply. (ii) It checks whether the two reconstructed
    maps terminate in the same primitive parameter set and, if so, computes the residual of the single
    substitution that reconciles them at the recorded toy parameters. (iii) It brackets the procedure
    with two nulls in the same invocation: two represented routes sharing an exponent, which must
    return commensurable, and a bit count against a group-operation count, which must return incommensurable.
    A procedure failing either null voids the signal arm and the run reports that instead of a verdict.
    No timing is performed, no machine is measured, and no cost model is proposed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: from the committed text of EV-ALR-001
      and EV-ALR-002 and the records they reference, the base B is or is not reconstructible for each
      of the five represented routes and for the rho proxy, the two sides do or do not terminate in
      a common primitive parameter set, and the reconciling substitution has the reported residual
      at the recorded toy parameters. What does NOT follow: that either exponent is wrong; that Pollard
      rho is faster or slower than any represented route; that the ALR lane''s conclusions are invalid;
      that this program''s cost model, timing instrument or measurement discipline is defective, which
      is a different question owned by a different lane; or that any attack, speedup or security consequence
      exists. A verdict of incommensurable means a sentence needs restating, nothing more.'
  inputs:
    procedure: 'STAGE 0, verbatim extraction, one hour, no compute: copy the audited sentences and
      the two hypotheses prediction blocks into the contract with exact quotes and record their record
      ids and line context. STAGE 1, source-reference check, two hours, no compute: inspect the committed
      source references cited by EV-ALR-001 and EV-ALR-002 to determine whether B is defined anywhere
      in the imported package, since an audit that misses an existing definition would be worthless.
      STAGE 2, base reconstruction, one hour with sympy: solve for B on each side, per represented
      route, flagging every experimenter-supplied substitution. STAGE 3, parameter-set comparison,
      minutes: check termination in a common primitive parameter set. STAGE 4, reconciliation, minutes:
      compute the residual of a single substitution at each recorded toy parameter tuple. STAGE 5,
      nulls, minutes: run both bracketing null pairs through the identical procedure. STAGE 6, units
      table, one hour of writing: emit each exponent with its base definition, per-operation charge
      and memory charge. Compute cost is seconds; the cost is human reading.'
    instrument: 'Python 3 with sympy for symbolic substitution and residual computation, and PyYAML
      for reading committed ledger records; under one hundred lines. Repository modules: harness/runner.py
      for immutable run-record and manifest discipline. The substantive instrument is the committed
      text of EV-ALR-001, EV-ALR-002, H-ALR-001 and H-ALR-002 together with the source references
      those evidence records list. No timing harness, no benchmarking, no Sage, no external service.'
    parameters: 'Two cost statements from two evidence records. Five represented routes named in EV-ALR-001:
      represented remainder, Newton trace, inverse certificate, triangular norm, target half-GCD.
      Recorded toy parameter tuples from the three curve families and seeds 16001, 16002, 18104, 18206,
      18307. Two null pairs. Primitive parameter set declared as {n, N, p, group order}. Total: 6
      base reconstructions in the signal arm plus 4 in the nulls, evaluated at up to 13 recorded instances.'
  controls:
  - 'Null arm one: two represented routes that EV-ALR-001 charges at the same exponent, which the
    procedure must return commensurable.'
  - 'Null arm two: a deliberately incommensurable pair, a bit count against a group-operation count,
    which the procedure must return incommensurable.'
  - 'Verbatim-quotation control: the audited sentences are quoted from the committed records, not
    paraphrased, and the quotes are included in the run artifacts.'
  - 'Per-route stability check: the base B is reconstructed independently for each of the five represented
    routes and reported per route rather than assumed shared.'
  - 'Experimenter-blindness on substitutions: any substitution supplied by the experimenter rather
    than derived from the statement is flagged as such in the output.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Apply the IDENTICAL dimensional procedure, in the same invocation,
    to two cost statements that are known to be commensurable inside this repository: two of the five
    represented routes that EV-ALR-001 charges at the same B^(7/2). The procedure must return commensurable
    for that pair. If it flags two statements the lane already treats as directly comparable as incommensurable,
    the procedure is broken and no verdict about the 7/2 versus 5/2 pair may be recorded. A second
    null runs the procedure on a deliberately incommensurable pair constructed by the experimenter,
    a cost in bits against a cost in group operations, where the procedure must return incommensurable.
    Both nulls are required, because a procedure that says everything is commensurable and one that
    says nothing is fail in opposite directions.'
  independent_variables:
  - cost_statement_identity
  - represented_route_identity
  - arm_signal_or_null
  metrics:
    primary:
    - reconstructed_base_definition_per_route
    - primitive_parameter_set_agreement_flag
    - reconciling_substitution_residual
    - null_arm_verdicts
    secondary:
    - count_of_experimenter_supplied_substitutions
    - discarded_factors_carrying_a_primitive_parameter
    - source_reference_definition_found_flag
  heuristic_under_test: null
  preregistered_prediction:
    quantity: For each of the six cost statements, the reconstructed definition of B in primitive
      parameters, and the binary verdict of whether the represented side and the rho side are commensurable.
    formula: 'Represented side: B is defined by nN = B^(7/2), hence B = (nN)^(2/7), a function of
      divisor degrees only. Rho side: a generic square-root search over a group of order r costs about
      sqrt(r) group operations, so B^(5/2) requires B = r^(1/5) times whatever additional per-step
      or memory charge is folded in, a function of the group order. Predicted verdict: the two bases
      are functions of disjoint primitive parameters, so the procedure is predicted to return not-commensurable-without-an-additional-assumption,
      and the deliverable is the additional assumption stated explicitly rather than a claim that
      either exponent is wrong. Nulls: same-exponent pair must return commensurable with residual
      zero; bits-versus-group-operations pair must return incommensurable.'
    source: Pre-registered in the parent proposal IDEA-20260816-21ae6c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: The audit is symbolic and parameter-free, and the only numeric evaluation is the
      reconciling residual at the recorded toy parameters of EXP-ALR-001 and EXP-ALR-002 on prime
      fields near 10^5. No transfer is claimed and none is needed, because a units verdict about how
      two sentences are written does not scale with the parameters; the residual, which does depend
      on parameters, is reported per recorded instance and never extrapolated.
    correspondence: null
  tail_checks:
  - Check the represented route with the most complex schedule separately, since it is the most likely
    to require a different base and therefore the most likely to break the shared-B assumption.
  - Report each experimenter-supplied substitution individually rather than as a count, since a single
    supplied substitution can rescue the comparison and must be visible.
  - Examine any discarded constant that carries p or the group order, because discarding it is exactly
    how an incommensurability hides.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report if a definition of B is found in the committed source references, since the audit's
    premise then fails and the correct output is that definition rather than a reconstruction.
  - Stop and report void if either bracketing null returns the wrong verdict.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both bracketing nulls return their forced verdicts, every base reconstruction
    is reported per route with its experimenter-supplied substitutions flagged, and a units table
    is emitted giving each exponent's base, per-operation charge and memory charge together with the
    reconciliation residual at each recorded instance.
  falsification_criterion:
  - Null arm one returns incommensurable for two same-exponent routes.
  - Null arm two returns commensurable for the bits-versus-group-operations pair.
  - No base is reconstructible for any route without experimenter supply, leaving nothing to compare.
  - A definition of B already exists in the committed source references, which falsifies the entry's
    premise.
  - The five represented routes require five different bases, so the shared symbol was never well
    defined.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-21ae6c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether the imported source packages referenced by EV-ALR-001 and EV-ALR-002 may be read for a
    definition of B without that counting as re-execution or as re-litigating an accepted import needs
    a Coordinator ruling.
  - What exactly the phrase rho proxy denotes in this lane is not defined in any committed record
    read here, and a Coordinator must either supply it or accept that the audit's rho-side reconstruction
    is conditional.
  - Whether a not-commensurable verdict obliges a correction record superseding the evidence observation,
    or is recorded as an open note, is a process question this entry does not decide.
