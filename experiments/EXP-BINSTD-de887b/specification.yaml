# EXP-BINSTD-de887b
# Integer divisor certificate. Does not settle Aut(E).
# Approved by DEC-20261001-0bf8ad.
experiment:
  id: EXP-BINSTD-de887b
  hypothesis_id: H-BINSTD-33862c
  source_idea: IDEA-20260922-c07598
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Frobenius-eigenvalue order and the 2k rho divisor on five ANSI curves
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-0bf8ad
  objective: >-
    For each of five composite-degree curves, parse r and h, solve
    X^2 - t X + q ≡ 0 (mod r), and check that a root has order k. Reject the
    divisor 32k because B is not in F_2. The sect163k1 control must show B in
    F_2.
  inputs:
    parameter_file: analysis/binstd-curve-audit/binary-curve-params.txt
    audit_certificate: analysis/binstd-curve-audit/audit-certificate.txt
    q: 65536
    rows:
      - {name: c2pnb176v1, k: 11, published_cofactor: 65390, implied_trace: 147}
      - {name: c2pnb208w1, k: 13, published_cofactor: 65096, implied_trace: 441}
      - {name: c2pnb272w1, k: 17, published_cofactor: 65286, implied_trace: 251}
      - {name: c2pnb304w1, k: 19, published_cofactor: 65070, implied_trace: 467}
      - {name: c2pnb368w1, k: 23, published_cofactor: 65392, implied_trace: 145}
    control: {name: sect163k1, b_in_prime_field: true}
  controls:
    - >-
      sect163k1 nearby object. B is 1. Reporting b_in_prime_field false for
      this curve invalidates the run.
    - >-
      Two square-root implementations of opposite sign. They need not return
      the same root. Each must return a root of order k, or both must agree
      that none exists.
    - >-
      aut_group_settled must be false. A true value invalidates the run.
  independent_variables:
    - curve among the five rows and sect163k1
    - choice of square-root sign
  metrics:
    primary:
      - r_is_prime
      - cofactor_matches
      - eigenvalue_order
      - b_in_prime_field
      - certified_divisor
      - rejected_divisor
      - aut_group_settled
      - implementations_agree
    secondary:
      - mu_residue
      - discriminant_is_square
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Existence of a root of order k, and the divisors 2k and 32k. The residue
      mu itself is not preregistered.
    formula: >-
      t = q + 1 - h. mu^2 - t*mu + q ≡ 0 (mod r), mu^k ≡ 1, mu ≠ 1.
      certified_divisor = 2k. rejected_divisor = 32k.
    source: >-
      IDEA-20260922-c07598 claims (A) and (B). Cofactors and traces were read
      from the audit certificate on 2026-10-01. mu was not computed in this
      design session.
  scale_relevance:
    tier: crypto
    justification: >-
      The five orders are the deployed subgroup orders, 161 to 353 bits as
      reported by the audit. The work is modular arithmetic on those integers.
    correspondence: null
  tail_checks:
    - >-
      c2pnb368w1 is the largest order. Both implementations must run the
      order check on the full integer, not on a truncated bit length.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the opposite square-root sign.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the sect163k1 control fails, mark the attempt invalid and do not score the five rows.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - The sect163k1 control reports B outside {0, 1}.
    - aut_group_settled is true.
    - The output quotes a rho bit cost or claims a discrete logarithm.
  success_criterion: >-
    Both runs agree, every row has r prime, cofactor match, eigenvalue order
    k, B outside {0, 1}, certified_divisor 2k, rejected_divisor 32k, and
    aut_group_settled false. The control reports B inside {0, 1}.
  falsification_criterion: >-
    The control passes, aut_group_settled is false, the implementations agree,
    and at least one row has a prime r with no root of order k, or has B in
    {0, 1}. That row is a negative result for claim (A) or (B). A composite r
    is a negative result for the "order in F_r" reading of that row, not a
    proof that the eigenvalue statement is false in the group.
  required_artifacts:
    - experiments/EXP-BINSTD-de887b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-de887b/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-de887b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-de887b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-de887b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-de887b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - j-invariant and the full group Aut(E).
    - Toy point counts at dk <= 41.
    - Numerical rho step counts.
