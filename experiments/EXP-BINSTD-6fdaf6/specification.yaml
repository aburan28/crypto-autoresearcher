# EXP-BINSTD-6fdaf6
# Exact leaf-count divisions. No search.
# Approved by DEC-20261002-7d805d.
experiment:
  id: EXP-BINSTD-6fdaf6
  hypothesis_id: H-BINSTD-99d894
  source_idea: IDEA-20260922-493606
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Exact leaf-count quotients at m=3, 4 and 5
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-7d805d
  objective: >-
    Divide five powers of two by the stated factorials and mu values.
    Reduce the ratio of the m=4 mu=37 count to the m=3 count. Check the
    three admissibility bits. Reject equality of 64/37 with 173/100.
  inputs:
    divisions:
      - {name: m3_l8, power: 24, divisor: 6, quotient: 2796202, remainder: 4, nearest: 2796203}
      - {name: m4_mu1, power: 32, divisor: 24, quotient: 178956970, remainder: 16, nearest: 178956971}
      - {name: m4_mu37, power: 32, divisor: 888, quotient: 4836674, remainder: 784, nearest: 4836675}
      - {name: m5_mu1, power: 30, divisor: 120, quotient: 8947848, remainder: 64, nearest: 8947849}
      - {name: m5_mu29, power: 30, divisor: 3480, quotient: 308546, remainder: 1744, nearest: 308547}
    ratio: {numerator: 64, denominator: 37}
    ratio_below_173_over_100: true
    admissibility:
      - {m: 4, l: 8, n: 37, holds: true}
      - {m: 5, l: 6, n: 23, holds: false}
      - {m: 5, l: 6, n: 29, holds: true}
    log2_37_between_5_and_6: true
  controls:
    - >-
      64/37 equals 173/100 is false. Reporting that equality invalidates
      the run.
    - >-
      5*5 <= 23 is false. Reporting that cell admissible invalidates
      the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - division
    - route in {direct_division, repeat_module}
  metrics:
    primary:
      - quotient_by_name
      - remainder_by_name
      - nearest_by_name
      - ratio_64_over_37
      - ratio_not_equal_173_over_100
      - admissibility_bits
      - implementations_agree
    secondary:
      - log2_37_bounds
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Five quotients, five remainders, one ratio, and three admissibility bits.
    formula: >-
      Divide 2^{power} by the divisor. The nearest integer is the
      quotient plus one when twice the remainder exceeds the divisor.
      The exact ratio is 2^8 * 6 / 888 = 64/37.
    source: >-
      IDEA-20260922-493606 claim paragraphs B, D and E, read 2026-10-02.
      The divisions were recomputed in this design session. That
      computation is not a run. The proposal's written integers match
      the nearest integers, not the exact quotients. No search was run.
  scale_relevance:
    tier: toy
    justification: Five integer divisions. No transfer to a measured search.
    correspondence: null
  tail_checks:
    - The m=5 mu=29 division is required. Stopping after m=4 and still reporting 308547 is invalid.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If 64/37 is reported equal to 173/100, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - 64/37 is reported equal to 173/100.
    - The n=23 cell is reported admissible.
    - A search, a solver, or a claim that m=4 beats rho is reported.
  success_criterion: >-
    Both runs agree on the five quotients, remainders and nearest
    integers, the ratio 64/37, the three admissibility bits, and
    2^5 < 37 < 2^6. Equality of 64/37 with 173/100 is rejected.
  falsification_criterion: >-
    The runs agree, that equality stays rejected, the n=23 cell stays
    inadmissible, and any quotient, remainder, nearest integer, ratio,
    or admissibility bit differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-6fdaf6/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-6fdaf6/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-6fdaf6/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-6fdaf6/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-6fdaf6/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-6fdaf6/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any search or solver run.
    - A claim that m=4 or m=5 beats rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
