experiment:
  id: EXP-PAIR-b19f80
  hypothesis_id: H-PAIR-713241
  derived_from_idea: IDEA-20260807-30868b
  question_id: RQ-PAIR-21313f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Three-way agreement sweep for the self-pairing boundary on ordinary
    prime-field curves - [N | disc(End(E))] versus [ord_N(p) = 1] versus
    [reduced Tate t(P,P) non-trivial] - with a k = 1 planted positive, a k > 1
    forced null, a coprime-to-Delta_O null object, and a broken-instrument arm
  objective: >-
    The one uncertainty a run reduces is whether the two independent derivations
    in H-PAIR-713241 (the discriminant/congruence route and the Galois
    equivariance route) agree with direct computation on every curve tested, and
    therefore whether the "self-pairing computable from one point" branch of
    RQ-PAIR-21313f is empty except at embedding degree 1. A run establishes
    (i) the three-way agreement matrix of the booleans [N divides disc(End(E))],
    [ord_N(p) = 1] and [t(P,P) not equal to 1] over a pre-declared toy curve
    sweep; (ii) whether the k > 1 population is EXACTLY trivial rather than
    mostly trivial, which is the difference between a derivation and a trend;
    (iii) whether the k = 1 planted positive returns a primitive N-th root of
    unity, without which no negative on the k > 1 side may be certified at all;
    and (iv) whether the observable is associated with any CM datum at fixed
    (p, N), which under the hypothesis is impossible and therefore functions as
    a bookkeeping check. A run makes NO claim about ECDLP hardness, mounts no
    attack, and does not by itself prove the equivalence - the proof burden sits
    on the derivation and the sweep is a consistency check on it.
  what_this_is_not:
    - >-
      Not an attack, key recovery, distinguisher, or cryptanalytic result. The
      k = 1 branch reproduces the classical Frey-Ruck transfer exactly and
      improves it on no axis; sota_delta is zero.
    - >-
      Not a claim about all self-pairings. Only the Weil, Tate and
      CHM-oriented families are quantified over. Self-pairings incompatible with
      oriented isogenies, pairings into groups other than mu_N, and
      non-divisorial bilinear maps are untouched.
    - >-
      Not a verification of KN-LIT-7489 against its primary text. Stage 0 is a
      transcription task inside this contract and its failure voids argument B
      only, never argument C.
    - >-
      Not a status change to any hypothesis, evidence, decision or goal record,
      and not a knowledge promotion.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No
      run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - over the executed sweep (ordinary E/F_p,
      p in [2^12, 2^20], group order exactly divisible by the odd prime N, and
      the constructed trace-two family), the three booleans agreed on every
      curve or did not, and the reduced Tate self-pairing was trivial on every
      k > 1 curve or was not. WHAT DOES NOT FOLLOW - no statement about
      cryptographic-scale curves beyond the derivation the sweep is consistent
      with; no statement about supersingular curves, extension fields, or
      composite subgroup order; no statement about self-pairings outside the
      three named families; and no security consequence for any deployed
      parameter set. A universal claim rests on the DERIVATION, and the run may
      only be cited as a consistency check that failed to falsify it at toy
      scale.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE, blocking for argument B only) - obtain
      the primary text of the Castryck-Houben-Merz result and verify the
      constraint m | Delta_O verbatim, including the 2-adic refinements
      (2m | Delta_O when 4 | Delta_O, 4m | Delta_O when 8 | Delta_O) and the
      exact hypotheses on the orientation and on cyclicity of the domain. Write
      a verified transcription. If the primary text is not reachable in this
      environment, record that plainly and mark argument B unverified; DO NOT
      substitute the abstract relay for the primary text. STAGE 1 (zero compute)
      - write arguments B and C with quantifiers explicit, as an archived
      derivation note. STAGE 2 (minutes) - the agreement sweep: for each of 500
      curves compute independently disc(Z[pi]) and disc(End(E)) where computable,
      k = ord_N(p), and the reduced Tate self-pairing t(P,P) with explicit final
      exponentiation by (p^k - 1)/N, then fill the 3-way agreement matrix.
      STAGE 3 (HARD GATE, minutes) - the four control arms of the `controls`
      block, all executed in the SAME invocation as Stage 2. STAGE 4 (up to one
      hour) - the trace-two family (group order exactly p - 1): confirm t(P,P)
      has exact multiplicative order N on every member, and perform ONE
      end-to-end toy ECDLP solve through the F_p DLP with an independently
      re-verified certificate [k]P = Q, charging the field-DLP cost in full.
      STAGE 5 (zero compute) - assemble the agreement matrix, the control
      pass/fail table, and an explicit refusal statement for every family the
      sweep does not quantify over.
    instrument: >-
      A computer algebra system providing elliptic curves over prime fields,
      point counting, endomorphism-ring discriminant computation, and Tate
      pairing with an explicitly controllable final exponentiation. The final
      exponentiation MUST be applied explicitly and separately so the
      broken-instrument arm can omit it. Divisor-shift auxiliary points are
      drawn independently per evaluation. All runs recorded through
      harness/runner.py with a manifest.
    parameters: >-
      500 ordinary curves over prime fields with p in [2^12, 2^20]. Curves are
      selected so that the sweep contains at least 50 with k = 1 and at least
      50 each with k in {2, 3, 4, 5, 6}, chosen by construction so that F_{p^k}
      arithmetic stays feasible; the exact selection procedure and its seed are
      frozen before any pairing is evaluated. N is the largest prime exactly
      dividing the group order, subject to N > 2 sqrt(p) + 2 on at least 100
      curves so the trace-two corollary is in force on a stated subpopulation.
      20 independent divisor-shift auxiliary points R per pairing evaluation.
      Trace-two family - at least 20 curves with group order exactly p - 1.
      Fixed-(p, N) CM sweep - at least 5 distinct p, each with at least 4 curves
      in one isogeny class at different endomorphism-ring levels.
  controls:
    - >-
      PLANTED POSITIVE (k = 1, trace-two curve) - t(P,P) must have exact
      multiplicative order N. An instrument that cannot produce the positive
      cannot certify any negative, so this is a hard gate on the whole run.
    - >-
      FORCED NULL (k > 1) - t(P,P) must equal exactly 1 on 100 percent of curves
      and 100 percent of auxiliary points. Derivable before measurement from
      argument C, which is what makes the instrument able to fail.
    - >-
      NULL OBJECT OF MATCHED SHAPE - a random cyclic subgroup of E[N'] with N'
      coprime to Delta_O. By argument B alone the pairing there is exactly
      trivial with no exceptions. Same control H-SPR-71a843 uses in the
      supersingular setting, calibrating the same instrument.
    - >-
      BROKEN-INSTRUMENT ARM - the final exponentiation by (p^k - 1)/N is
      omitted. The planted positive must then return a value OUTSIDE mu_N and
      the arm must be rejected by the run's own check. An instrument that cannot
      detect its own breakage cannot certify triviality.
    - >-
      AUXILIARY-POINT INVARIANCE - every reported pairing value must be
      identical across all 20 independent R. Dependence on R is an
      implementation defect that would masquerade as a discovery.
    - >-
      FIXED-(p, N) CM SWEEP - curves in one isogeny class at different
      endomorphism-ring levels must all return the same observable. This is the
      distinct-preimage search of the proof_search_map and is EXPECTED to find
      abundant collisions; their abundance is the evidence that the observable
      is a function of (p, N) alone.
    - >-
      DECAY-SHAPE CONTROL - the fraction of points with a non-trivial
      self-pairing is recorded as a function of k. The predicted shape is a STEP
      (1 at k = 1, 0 at every k >= 2). A gradual decline is the canonical
      artifact tell and invalidates the measurement rather than supporting a
      partial effect.
  independent_variables:
    - embedding degree k = ord_N(p)
    - >-
      endomorphism-ring level within a fixed isogeny class (volcano level), at
      fixed (p, N)
    - CM discriminant |D_0| and conductor
    - >-
      subgroup family - cryptographic subgroup of order N versus a subgroup of
      order N' coprime to Delta_O
    - instrument arm - correct final exponentiation versus omitted
  metrics:
    primary:
      - >-
        three_way_agreement_count - number of sweep curves (of 500, unitless
        count) on which the booleans [N | disc(End(E))], [ord_N(p) = 1] and
        [t(P,P) != 1] all coincide; computed by evaluating each boolean from an
        independent code path and comparing
      - >-
        nontrivial_fraction_k_gt_1 - fraction (unitless, in [0,1]) of k > 1
        sweep curves on which the reduced Tate self-pairing differs from 1,
        computed over all curves and all 20 auxiliary points each
      - >-
        primitive_order_fraction_k_eq_1 - fraction (unitless, in [0,1]) of
        trace-two / k = 1 curves on which t(P,P) has exact multiplicative order
        N, computed by explicit order determination in F_p
      - >-
        control_pass_table - boolean pass/fail (unitless) for each of the seven
        named control arms, computed from that arm's own declared criterion
    secondary:
      - >-
        auxiliary_point_invariance_rate - fraction (unitless) of pairing
        evaluations whose value is identical across all 20 auxiliary points R
      - >-
        cm_association_at_fixed_pN - number of fixed-(p, N) groups (unitless
        count) in which curves at different endomorphism-ring levels returned
        DIFFERENT observables; predicted zero
      - >-
        nontrivial_fraction_by_k - the fraction above resolved per k value,
        for the step-versus-decay shape check
      - >-
        stage0_transcription_status - one of {verified_against_primary_text,
        primary_text_unreachable, contradicted} (categorical)
      - >-
        trace_two_solve_certificate_status - one of {verified, failed,
        not_attempted} for the single end-to-end toy ECDLP solve
      - >-
        field_dlp_cost_seconds - measured wall clock of the F_p DLP in the
        trace-two solve, reported so the k = 1 branch is charged in full
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      three_way_agreement_count and nontrivial_fraction_k_gt_1 over the frozen
      500-curve sweep.
    formula: >-
      Predicted three_way_agreement_count = 500 of 500 (100 percent, zero
      tolerance) and nontrivial_fraction_k_gt_1 = 0 exactly (zero tolerance),
      with primitive_order_fraction_k_eq_1 = 1 exactly. Under the null that the
      derivation carries no information, nontrivial_fraction_k_gt_1 would be
      strictly positive on some k > 1 curve and the agreement count would fall
      below 500.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-30868b (predictions
      block) and restated in H-PAIR-713241 before any run under this contract
      exists. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at p in [2^12, 2^20], far below any deployed curve, because
      F_{p^k} arithmetic and endomorphism-ring discriminant computation must
      both remain feasible on the same curve for the three booleans to be
      compared at all. The transfer assumption is stated and narrow - the
      equivalence under test is an identity of ARITHMETIC PREDICATES with no
      size-dependent term, so the derivation, not the sweep, is what would carry
      it to cryptographic scale; the sweep can only fail to falsify it. It is
      explicitly NOT used to assert anything about curves at deployed sizes.
    correspondence: null
  tail_checks:
    - >-
      Report the count of k > 1 curves actually evaluated per k value and refuse
      to state the k > 1 negative for any k with fewer than 20 curves.
    - >-
      Report the smallest N in the sweep; at toy scale mu_N can lie in F_p for
      reasons unrelated to the intended family, inflating the k = 1 population.
      The prime ladder must include N large relative to p on the stated
      subpopulation so the corollary is in force.
    - >-
      For every reported divisibility, name WHICH discriminant was used -
      disc(End(E)) or disc(Z[pi]) - since they differ by a square factor and the
      implication direction is easy to invert.
    - >-
      Report the number of curves on which disc(End(E)) was not computable and
      exclude them from the first boolean rather than substituting disc(Z[pi]).
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
    - >-
      Abort the run if the planted k = 1 positive fails; no negative on the
      k > 1 side may be reported from an instrument that cannot produce the
      positive.
    - >-
      Abort the run if the broken-instrument arm is NOT rejected by the run's
      own check.
    - >-
      Stop at the frozen 500-curve sweep plus the declared control and
      trace-two families. Curve selection and its seed are frozen before any
      pairing is evaluated and are not revised after seeing results.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
    - >-
      If F_{p^k} arithmetic exceeds budget before any k > 1 curve is measured,
      stop and record failed_infrastructure.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run whose control arms were not executed in the same invocation as the
      signal arm is invalid_measurement - the comparison the contract exists to
      make was not made.
    - >-
      A run in which any pairing value varies across the 20 auxiliary points R
      is invalid_measurement for that evaluation; the defect is reported, never
      averaged away.
    - >-
      A run showing a GRADUAL decline of nontrivial_fraction_by_k rather than a
      step at k = 1 is invalid_measurement - it is an instrument property, most
      likely an omitted or incorrect final exponentiation.
    - >-
      Any claimed ECDLP solve whose certificate [k]P = Q fails independent
      re-verification by the run wrapper makes the run completed_invalid
      (docs/claims-and-verification.md).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    All seven control arms pass; three_way_agreement_count equals 500 of 500;
    nontrivial_fraction_k_gt_1 equals exactly 0 with at least 20 curves
    evaluated at each k in {2,3,4,5,6}; primitive_order_fraction_k_eq_1 equals
    exactly 1; cm_association_at_fixed_pN equals 0; and the trace-two
    end-to-end solve returns a certificate that re-verifies. Stage 0 reports its
    transcription status explicitly, and a `primary_text_unreachable` status
    caps the run's support to argument C alone rather than invalidating it.
  falsification_criterion:
    - >-
      nontrivial_fraction_k_gt_1 > 0 on any curve surviving every control -
      argument C is refuted, the one-point route reopens, and the result demands
      independent replication before any interpretation.
    - >-
      primitive_order_fraction_k_eq_1 < 1 with controls passing - the Frey-Ruck
      non-degeneracy step is wrong; the exceptional family is empty too and the
      closure is STRONGER, reported as such.
    - >-
      three_way_agreement_count < 500 - argument B, argument C, or the
      instrument is wrong; the pre-committed diagnostic order is instrument
      first (re-run the planted positive), then C, then B.
    - >-
      cm_association_at_fixed_pN > 0 - logically impossible under B and C, so
      the run indicts its own bookkeeping and reports no mathematical
      conclusion.
    - >-
      Stage 0 finds the CHM constraint contradicted by the primary text -
      argument B is void; the hypothesis must be superseded by a narrower one
      resting on C alone.
    - >-
      The planted positive fails, or the broken-instrument arm passes - nothing
      is reportable.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state,
      resolved model/inference block and environment
    - >-
      raw-result.json carrying the per-curve tuple (p, t, group order, N, k,
      disc(Z[pi]), disc(End(E)) where computable, t(P,P), its exact
      multiplicative order, and the three booleans) for every curve - not
      summaries
    - the full 3-way agreement matrix and the per-k breakdown
    - >-
      every control arm's measurements, in the same file as the signal arm,
      including the broken-instrument arm's rejected values
    - the Stage 1 derivation note for arguments B and C with explicit quantifiers
    - >-
      the Stage 0 transcription (or an explicit statement that the primary text
      was unreachable in this environment)
    - >-
      the certificate for the single trace-two ECDLP solve, independently
      re-verified by the run wrapper
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      This is a proof-oriented proposal, so H-PAIR-713241's `proof_search_map`
      must be audited against KN-TECH-080 before implementation.
    - >-
      The final-exponentiation control must be reviewed as implemented before
      any k > 1 negative is treated as evidence.
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260807-30868b
    authored_at: '2026-08-25'
    note: >-
      Objective, controls, metrics and criteria are transcribed from the parent
      proposal's `minimal_test`, `predictions`, `null_object_control` and
      `falsification_conditions` blocks rather than re-invented. Budget follows
      the parent's declared estimated_cost.compute of "low". No field is
      invented - where the proposal supplied no value the field is null and the
      gap is listed below.
  derivation_gaps:
    - >-
      The parent proposal does not name the CAS or pairing implementation. The
      instrument must be fixed by name and version before approval, because a
      library that folds the final exponentiation into its pairing call makes
      the broken-instrument control unimplementable as written.
    - >-
      The curve selection procedure guaranteeing at least 50 curves at each of
      k in {1,...,6} is not specified in the proposal and must be written and
      frozen before approval; selecting curves after seeing pairing values would
      silently turn this contract into a claim.
    - >-
      Whether disc(End(E)) is computable within budget for every sweep curve is
      unknown. The contract requires such curves be excluded and counted rather
      than substituted with disc(Z[pi]), but the expected exclusion rate is
      unmeasured and could shrink the first boolean's population below
      usefulness.
    - >-
      Stage 0 depends on reaching a primary text that this environment may not
      be able to retrieve. The contract treats unreachability as a disclosed
      status rather than a failure, but a Coordinator must decide before
      approval whether a run limited to argument C is worth the budget.
