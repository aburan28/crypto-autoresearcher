experiment:
  id: EXP-ECTD-001
  hypothesis_id: H-ECTD-001
  goal_id: GOAL-ECTD-001
  source_proposal: IDEA-20260731-016
  version: 1
  title: >-
    Full-class Semaev/Macaulay heavy-tail screen for rare ordinary F_p
    trapdoor endpoints at toy N, with planted outlier and permutation nulls
  status: approved
  approved_by: coordinator
  approved_by_note: >-
    Originally frozen at review_required / approved_by null pending
    independent validation TASK-20260731-052 and ledger archive
    TASK-20260731-053. Validator TASK-20260731-052 returned
    approve_for_execution (checklist all PASS); TASK-20260731-053 then
    recorded the substantive Coordinator approval as
    DEC-20260731-013 (decision: approve_experiment_for_execution,
    commit 80013bf311348fc5e5b9a78d2b60615220b161b4, independently
    verified: dispatch_plan.json gate completed_archive_commits_verified:
    true), following the EXP-DS-001 "D-1 prophylaxis" convention of not
    rewriting the frozen contract's own status field. That convention is
    undocumented in AGENTS.md/docs/task-lifecycle.md and produced exactly
    the status/approved_by vs. next_action ambiguity resolved in
    coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/SCOPE-DECISION.md.
    This status/approved_by correction (2026-08-06) makes that standing,
    already-verified approval durable in the one place a reader naturally
    looks. No scientific content (objective, controls, decision_table,
    budget, success/falsification criteria) is changed by this correction.
  status_corrected_on: '2026-08-06'
  status_correction_basis: DEC-20260731-013
  status_correction_record: coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/SCOPE-DECISION.md
  frozen: true
  frozen_on: '2026-07-31'
  frozen_by_task: TASK-20260731-050
  archived_by_task: TASK-20260731-051
  claim_tier: toy
  confirmatory_status: exploratory
  confirmatory_status_note: >-
    First full-class heavy-tail measurement for RQ-ECTD-001 family (1).
    Confirmatory only about named toy cells after independent review and a
    completed valid run set; never crypto-scale and never a trapdoor existence
    claim alone.

  objective: >-
    Measure whether ordinary F_p isogeny classes (N in 40–56 bits, class size
    >=64, >=5 classes) contain a Semaev/FB/Macaulay meter outlier >=100× class
    median (or d_reg <= median_d_reg - 2) that survives outside-class,
    Semaev-shaped degree-profile, and within-class permutation nulls, with a
    mandatory planted positive control recovering as an outlier. Matched
    Pollard rho and BSGS baselines are recorded on the same N. An outlier
    licenses only a follow-on path-hiding/detection experiment — not a
    trapdoor claim.

  claim_ceiling: >-
    Toy-tier presence/absence of >=100× (or d_reg-2) heavy tails under frozen
    meters, null-control outcomes, and planted-control validity on 40–56 bit
    prime-order subgroups. NOT CLAIMABLE UNDER ANY OUTCOME: crypto-scale ECDLP
    exponent improvement; Teske-class trapdoor existence; path-hiding success;
    Galbraith conductor-gap path hardness; reopening H-ISO-001 beyond its
    short-neighbor scope; GOAL-ECTD-001 completion. All four asymptotic-claim
    promotion gates remain OPEN.

  what_this_experiment_is_NOT:
    - Not a cryptanalytic attack on any deployed curve or live key.
    - Not a trapdoor construction (no secret path, no public-detection test).
    - Not a vertical-conductor EXP (that is IDEA-20260731-017 / future EXP).
    - Not an ordinary trapdoor-DDH gate (IDEA-20260731-018 / future EXP).
    - Not a reopen of H-ISO-001's short-neighbor rejected_scoped result as global.

  heuristic_under_test: HEUR-ECTD-TAIL-1
  preregistered_prediction:
    quantity: >-
      Within-class max/median ratios on primary meters; exchangeability of
      meter ranks under label permutation
    formula: >-
      Primary success: on >=1 of >=5 classes, max(M)/median(M) >= 100 for a
      primary meter M, or min(d_reg) <= median(d_reg) - 2, AND the outlier
      identity is stable under within-class label permutation (same curve ID
      after unshuffle), AND the outlier advantage exceeds the Semaev-shaped
      degree-profile null and outside-class null, AND the planted control is
      recovered. Homogeneity (scoped null): every primary meter on every curve
      in all >=5 classes lies in [0.1,10]× class median — reported as
      "no >=100× outlier under frozen meters at toy N," not as family closure.
    source: >-
      IDEA-20260731-016; admit conditions TASK-20260731-049; HEUR-ECTD-TAIL-1
      as test hypothesis only (JMV does not justify Semaev exchangeability).

  scale_relevance:
    tier: toy
    justification: >-
      Direct enumeration and per-curve GB/Macaulay at 40–56 bit N only.
      No correspondence to crypto-scale classes is claimed.
    correspondence: null

  tail_checks:
    - id: TAIL-ECTD-EXCEEDANCE
      check: >-
        Report extreme-value exceedance of the class max vs median under an
        exchangeability null (permutation of labels within class); if the
        reported outlier is not extreme under that null, do not call it a
        heavy-tail hit.
    - id: TAIL-ECTD-PERM-STABLE
      check: >-
        After shuffling curve labels within a class while holding the meter
        multiset fixed, the unshuffled identity of any claimed outlier must be
        unchanged; otherwise the tail claim is a labeling artifact.

  decision_table:
    primary_statistic: >-
      For each class and primary meter M: R = max(M)/median(M) (or
      delta_d = median(d_reg) - min(d_reg)). Aggregate: number of classes with
      a permutation-stable outlier passing null gates and planted control.
    branches:
      - id: heavy_tail_hit
        condition: >-
          >=1 class with R>=100 or delta_d>=2, permutation-stable, nulls pass,
          planted control recovered
        interpretation: >-
          Toy-scale endpoint-meter candidate exists; next action is a separate
          path-hiding/detection EXP — not trapdoor existence.
      - id: scoped_homogeneity
        condition: >-
          All >=5 classes factor-10 homogeneous on every primary meter;
          planted control recovered; permutation null does not manufacture
          false outliers
        interpretation: >-
          No >=100× Semaev/Macaulay outlier under frozen FB/solver conventions
          at toy N. Forward guidance: private factor-base precomputation,
          path-hiding, detection, and vertical (017) / DDH (018) lanes remain
          open. Not inventor-protocol family closure.
      - id: instrument_void
        condition: Planted >=100× (or d_reg-2) control not recovered as outlier
        interpretation: Harness void; no mathematical negative on H-ECTD-001.
      - id: resource_incomplete
        condition: Budget exhaustion before >=5 classes complete
        interpretation: Incomplete; not a homogeneity claim.

  inputs:
    n_bit_range: [40, 56]
    min_classes: 5
    min_class_size: 64
    isogeny_degrees_ell: [2, 3, 5, 7]
    preferred_conductor: >-
      Prefer classes whose End conductor has a moderate prime factor (for later
      reuse with IDEA-20260731-017); not required for primary analysis.
    meters_primary:
      - semaev_m3_relation_density
      - semaev_m4_relation_density
      - fb_decomposition_probability
      - groebner_solving_degree_d_reg
      - macaulay_rank_defect_at_first_fall
    factor_base_rule: >-
      Deterministic FB convention frozen in the run driver and hashed into each
      run manifest; identical convention across all curves in a class and all
      null arms.
    solver_budget: >-
      Fixed F4/GB wall and memory budget per curve, recorded in the run
      manifest; timeouts labeled infrastructure (not hardness).
    class_invariant_negative_control: >-
      Optionally include known anomalous/MOV/smooth-order curves as
      negative-control arms only — never as secret endpoints. Detector must
      flag them as class-invariant.

  controls:
    - id: CTRL-OUTSIDE-CLASS
      method: >-
        Random same-p curves outside the enumerated class with matched N when
        possible, else matched bit size.
      pass_condition: >-
        Putative outlier meters must not systematically match outside-class
        draws at the same rate as within-class neighbors.
    - id: CTRL-DEGREE-PROFILE
      method: >-
        Random multi-homogeneous systems with the same Semaev/Weil-shaped
        multi-degree profile and variable count and a planted solution
        (ALBIN lesson: not underdetermined planted systems).
      pass_condition: >-
        Outlier advantage on real curves must exceed the degree-profile null
        advantage; otherwise structure-free artifact.
    - id: CTRL-PERMUTATION
      method: >-
        Within-class curve-label permutation holding the meter multiset fixed;
        report whether outlier identity is stable after unshuffle.
      pass_condition: Claimed outliers are permutation-stable (TAIL-ECTD-PERM-STABLE).
    - id: CTRL-PLANTED-OUTLIER
      method: >-
        Mandatory: artificially easy Semaev instance on one curve in at least
        one class (planted >=100× decomp probability or d_reg-2 relative to
        class median under the frozen meters).
      pass_condition: >-
        Planted curve recovered as outlier; else instrument_void.
    - id: CTRL-RHO
      method: Matched Pollard rho (negation) on the same N.
      pass_condition: Valid rho receipt per completed class N; baseline only.
    - id: CTRL-BSGS
      method: Matched BSGS cost on the same N.
      pass_condition: Reported alongside rho.
    - id: CTRL-NO-CLASS-INVARIANT-ENDPOINT
      method: Embedding-degree / anomalous / smooth-order detectors on any nominated E_s.
      pass_condition: Nominated secret endpoints are not class-invariant weak curves.

  independent_variables:
    - class_seed
    - n_bits
    - meter_id
    - object_kind: [real_class_curve, outside_class, degree_profile_null, planted]

  metrics:
    primary:
      - class_max_over_median_per_meter
      - delta_d_reg
      - permutation_stable_outlier: boolean
      - planted_control_recovered: boolean
      - null_gates_passed: boolean
      - decision_branch: heavy_tail_hit | scoped_homogeneity | instrument_void | resource_incomplete
    secondary:
      - per_curve_meter_vector
      - class_median_IQR
      - KS_distance_to_exchangeability_null
      - matched_rho_group_ops
      - matched_bsgs_group_ops
      - timeout_count_infra

  replication:
    seeds: [201, 202, 203, 204, 205]
    seed_policy: >-
      Five master seeds each attempt to build one ordinary class with
      prime-order N in [40,56] bits and size >=64. Additional seeds may be
      drawn if a seed fails class construction; record failures as
      infrastructure, not homogeneity.
    independent_instances: 5
    planned_runs:
      - id: RUN-ECTD-001-impl
        purpose: Implement meters, planted control, and three null arms; smoke on one small class.
      - id: RUN-ECTD-001-screen
        purpose: Full >=5-class screen within budget.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 2

  stopping_rules:
    - Stop a curve's GB arm at the frozen solver budget; label timeout as infrastructure.
    - Stop the experiment when total_cpu_hours exhausted; incomplete classes → resource_incomplete.
    - On CTRL-PLANTED-OUTLIER failure, stop and report instrument_void.

  invalidation_rules:
    - Planted control not recovered → void for mathematical claims.
    - Factor-base convention differs across curves in a class → void.
    - Class-invariant curve nominated as secret endpoint → void for trapdoor-endpoint reading.
    - Fabricated or missing meter artifacts → void.

  success_criterion: >-
    Valid decision_branch recorded with all required controls present
    (including planted and permutation); claim_tier remains toy.

  success_criteria:
    - >-
      Valid decision_branch recorded with all required controls present
      (including planted and permutation).
    - claim_tier remains toy; no trapdoor or exponent language in the run report.

  falsification_criterion: >-
    scoped_homogeneity under valid planted control: H-ECTD-001's heavy-tail
    prediction fails at tested toy scope (scoped null, not family barrier).

  falsification_criteria:
    - >-
      scoped_homogeneity under valid planted control: H-ECTD-001's heavy-tail
      prediction fails at tested toy scope (scoped null, not family barrier).
    - instrument_void: no evidence against the mathematical hypothesis.

  required_artifacts:
    - exact command / driver version
    - git commit and dirty-tree state
    - environment.json
    - per-class meter tables (machine-readable)
    - planted and null-arm receipts
    - permutation stability table
    - matched rho/BSGS receipts
    - stdout/stderr
    - raw-result.json with decision_branch

  analysis_plan: >-
    Pre-register decision_table branches. Do not tune thresholds post-hoc.
    Report HEUR-ECTD-TAIL-1 status only via KS/permutation evidence, never via
    JMV citation alone. Cite EXP-ECTD-001 / RUN-* IDs in any conclusion.
