# EXP-BINSTD-01c519
# Pattern-count bounds at weights 12 and 13. No enumeration.
# Approved by DEC-20261002-042c44.
experiment:
  id: EXP-BINSTD-01c519
  hypothesis_id: H-BINSTD-f2512a
  source_idea: IDEA-20260926-b48c9d
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Pattern-count bounds at weights 12 and 13
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-042c44
  objective: >-
    Compute C(131, 12) and C(131, 13). Multiply by 2^12 and 2^13.
    Compare with the neighbouring powers of two. Reject a binomial
    at most 2^58 and a weight-13 pattern count equal to 2^71.
  inputs:
    degree: 131
    cells:
      - {w: 12, binomial: 31725968343212000, pattern: 129949566333796352000, at_least_pow: 66, below_pow: 67}
      - {w: 13, binomial: 290414633295556000, pattern: 2379076675957194752000, above_pow: 71, below_pow: 72}
    binomial_13_above_58: true
    binomial_13_below_581_tenths: true
    binomial_13_above_579_tenths: true
    pattern_12_below_702_tenths: true
    pattern_13_above_702_tenths: true
    first_weight_clearing_71: 13
    half_dimension_exponent: 66
    sixty_six_tenths: 660
    rho_tenths: 608
  controls:
    - >-
      C(131, 13) at most 2^58 is false. The binomial is strictly
      larger. Reporting that bound invalidates the run.
    - >-
      The weight-13 pattern count equal to 2^71 is false. The count
      is strictly larger and strictly below 2^72. Reporting equality
      invalidates the run.
    - >-
      Weight 12 already clearing 2^{70.2} is false. Its pattern
      count is strictly below 2^67. Reporting that invalidates
      the run.
    - >-
      660 at most 608 is false. The half-dimension exponent 66
      stays strictly above 60.8. Reporting the reverse invalidates
      the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - weight
    - route in {falling_product, repeat_module}
  metrics:
    primary:
      - binomials
      - pattern_counts
      - above_58_rejected_as_upper
      - equal_71_rejected
      - implementations_agree
    secondary:
      - first_clearing_weight
      - exponent_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two binomials, two pattern counts, and four power bits.
    formula: >-
      C(131, w) is the product of (131-i)/(i+1) for i from 0
      through w-1, taken in integer arithmetic. The pattern count
      is that binomial times 2^w. Compare a tenth-power by raising
      the binomial to the 10th and comparing with 2^579 and 2^581.
      The half-dimension exponent at l' = 130 is 131-65.
    source: >-
      IDEA-20260926-b48c9d names C(131, 13) about 2^58.0 and the
      weight-13 count about 2^71, read 2026-10-02. The integers
      were recomputed in this design session. That computation is
      not a run. Both written powers sit strictly below the exact
      counts. No scalar set was enumerated.
  scale_relevance:
    tier: toy
    justification: Two binomials. No transfer to a collision count.
    correspondence: null
  tail_checks:
    - Weight 13 is required. Stopping after weight 12 and still reporting the weight-13 power bits is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If C(131, 13) is reported at most 2^58, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - C(131, 13) is reported at most 2^58.
    - The weight-13 pattern count is reported equal to 2^71.
    - Weight 12 is reported to clear 2^{70.2}.
    - 660 is reported at most 608.
    - A scalar enumeration or a collision count is reported.
  success_criterion: >-
    Both runs agree on both binomials, both pattern counts, the
    four power brackets, the first clearing weight 13, and the
    comparison 660 greater than 608. C(131, 13) stays strictly
    above 2^58. The weight-13 pattern count stays strictly above
    2^71.
  falsification_criterion: >-
    The runs agree, C(131, 13) stays above 2^58, the weight-13
    count stays above 2^71, and any binomial or pattern count
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-01c519/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-01c519/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-01c519/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-01c519/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-01c519/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-01c519/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any scalar enumeration, coupled solve, or collision count.
    - A claim that the construction beats rho or does not.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
