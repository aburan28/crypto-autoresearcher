experiment:
  id: EXP-SHATWO-37186f
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f5dc22; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f5dc22
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Three-object rank-profile decomposition: SHA-256, SHA-512, and a chimera with SHA-512 widths
    and SHA-256 sigma amounts, under two normalization conventions with per-object random-tap null
    bands'
  objective: The one uncertainty a run reduces is what factor a solver-free deficit profile actually
    tracks. (i) It computes, by one shared code path, the normalized surviving-freedom profile of
    the carry-fixed expanded schedule for three objects that differ in a controlled way - SHA-256
    at 32-bit words and 64 steps, SHA-512 at 64-bit words and 80 steps, and a chimera carrying SHA-512's
    arithmetic shape with SHA-256's sigma rotation and shift amounts - so that the SHA-256-to-SHA-512
    difference is decomposed into a constants factor and a width factor rather than reported as one
    lump. (ii) It reduces the artifact uncertainty by scoring each object against its own 500-draw
    random-tap null band computed on its own word width, so that no pairwise distance is read unless
    at least one object is distinguishable from generic taps at all, and by requiring a bitwise identity
    check in which the chimera with SHA-512's own amounts substituted back reproduces SHA-512 exactly.
    (iii) It exposes the design's weakest joint by running two normalization conventions and treating
    a disagreement in the pairwise distance ordering as a failure of the decomposition rather than
    as a finding. A run does NOT reduce uncertainty about the reachable step count of any search on
    either function, and makes no comparison whatsoever to published results for either.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope: for SHA-256, SHA-512 and the declared chimera
      as specified, in the sampled carry classes and under the declared condition-support family and
      the two declared normalization conventions, the normalized surviving-freedom profiles took the
      emitted values, the three pairwise distances took the emitted values and ordering, and each
      object did or did not fall outside its own 500-draw random-tap null band. WHAT DOES NOT FOLLOW:
      anything about the reachable step count of any search on SHA-256 or SHA-512; any comparison
      to published analysis of either function, which this contract cannot make; any property of the
      chimera transferring to a real function; any statement about the true schedule outside the sampled
      carry classes; and nothing about full-round SHA-256 or SHA-512, HMAC, TLS certificate chains,
      code signing, or Bitcoin.'
  inputs:
    procedure: 'STAGE 0 (hours, human): write and hash the preregistration - the chimera''s substituted
      sigma triples written out explicitly, the two normalization conventions, the condition-support
      scaling rule, carry-class sample, null draw count. STAGE 1 (half a day human, minutes machine):
      implement SHA-512 twice from FIPS 180-4, cross-validate both against hashlib on NIST test vectors,
      and abort on mismatch; reuse the already-validated SHA-256 pair. STAGE 2 (hours human, minutes
      machine): extend the existing carry-fixed linearizer to parameterized width, block size, step
      count and tap set; run the identity check by substituting SHA-512''s own amounts into the chimera
      path and requiring bitwise reproduction of the SHA-512 matrix; assert rank(A_16) equals block
      size for each object. STAGE 3 (minutes machine): compute the three profiles over all step counts
      in all sampled carry classes. STAGE 4 (10-40 minutes machine): 500 random-tap draws per object
      through the identical code, emitting full draw distributions. STAGE 5 (minutes): normalize under
      both conventions, emit the three pairwise distances and their ordering under each, and flag
      any ordering disagreement as a failed decomposition. STAGE 6 (minutes): emit the run manifest
      with seeds, code hash and resolved inference block.'
    instrument: Python 3.11 with numpy for uint64 bit-packed GF(2) elimination, sharing the same linearizer
      module as the single-object rank ledger with width, block size, step count and tap set as parameters;
      hashlib as the independent FIPS 180-4 cross-check for both SHA-256 and SHA-512 against the hand-written
      implementations; harness/runner.py for the manifest, deterministic seeds and the inference block.
      No SAT solver is used anywhere in this contract, no computer-algebra system, and no Sage.
    parameters: 'SHA-256: 32-bit words, 512-bit block, 64 steps, sigma0 = ROTR7 xor ROTR18 xor SHR3
      and sigma1 = ROTR17 xor ROTR19 xor SHR10 as in FIPS 180-4. SHA-512: 64-bit words, 1024-bit block,
      80 steps, sigma0 = ROTR1 xor ROTR8 xor SHR7 and sigma1 = ROTR19 xor ROTR61 xor SHR6. Chimera:
      64-bit words, 1024-bit block, 80 steps, with SHA-256''s amounts (7, 18, 3) and (17, 19, 10)
      applied unchanged. Carry classes: all-zero plus 16 sampled per object. Condition-support family:
      one construction scaled by the declared rule. Null draws: 500 per object, seeds fixed in the
      preregistration. Normalization conventions: two, both declared in advance.'
  controls:
  - Per-object random-tap null bands computed by identical code on each object's own width, same invocation.
  - 'Identity check: chimera with SHA-512 sigma amounts substituted back must reproduce SHA-512''s
    matrix bit for bit.'
  - Two normalization conventions reported side by side so a convention-dependent verdict is visible.
  - hashlib cross-validation of both SHA-512 implementations and both SHA-256 implementations on NIST
    test vectors before any rank is computed.
  - Forced value check rank(A_16) equal to the block size in bits for each object, which is 512 for
    SHA-256 and 1024 for SHA-512 and the chimera.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Per-object random-tap null bands, all three computed in the same invocation
    by the identical code: for each object, sigma0 and sigma1 are replaced by uniformly sampled GF(2)
    linear maps of matched fan-in on that object''s word width, 500 draws each, and the object''s
    own normalized profile is scored against its own band. For the three-way comparison to mean anything,
    at least one of the three real objects must fall outside its own random-tap band; if all three
    sit inside their bands, no pairwise distance among them is interpretable and the run records a
    controlled null closing the predictive reading. A second control is the identity check: the chimera
    with SHA-512''s own sigma amounts substituted back must reproduce the SHA-512 profile bit for
    bit, proving the substitution machinery changes nothing else.'
  independent_variables:
  - object (SHA-256, SHA-512, chimera)
  - step count within each object's range
  - carry class
  - normalization convention
  - arm (real taps versus random-tap null draw)
  metrics:
    primary:
    - normalized surviving-freedom profile per object
    - the three pairwise profile distances per convention
    - pairwise distance ordering per convention
    - per-object escape flag against its own random-tap null band
    secondary:
    - per-object null band percentiles from 500 draws
    - identity-check bitwise agreement flag
    - rank(A_16) forced value per object
    - carry-class spread of each profile
    - wall-clock and peak memory per object
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ordering of the three pairwise normalized profile distances d(SHA-256, SHA-512),
      d(SHA-256, chimera) and d(SHA-512, chimera), computed under each of the two normalization conventions,
      together with the count of objects escaping their own random-tap null band.
    formula: 'd(X, Y) = L2 distance between the normalized surviving-freedom profiles of X and Y sampled
      at 32 equally spaced normalized step positions in [0, 1], where normalized position is step
      index divided by the object''s total step count and the profile value is surviving freedom divided
      by the object''s block size in bits. Reading rule frozen in advance: if the escape count is
      0, report a controlled null and interpret no distance. If the two conventions disagree on the
      ordering, report a failed decomposition. Otherwise, d(SHA-512, chimera) smallest scores WIDTH-TRACKING;
      d(SHA-256, chimera) smallest scores CONSTANTS-TRACKING; d(SHA-256, SHA-512) smallest is scored
      ANOMALOUS and reported without interpretation.'
    source: Pre-registered in the parent proposal IDEA-20260816-f5dc22 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'All three objects are computed at their FULL real parameter sets - 32-bit and
      64-bit words, 512-bit and 1024-bit blocks, 64 and 80 steps - so there is no parameter-dimension
      extrapolation whatsoever; the tier is toy because the measured quantity is a linear-algebraic
      shadow, not the primitive. The transfer assumptions stated and not tested: that carry-class
      sampling represents the true schedules, that the condition-support scaling rule makes families
      comparable across widths, and that normalization places 32-bit and 64-bit profiles on one axis.
      The last is the weakest and is why disagreement between the two conventions is defined in advance
      as a failure rather than a result.'
    correspondence: null
  tail_checks:
  - Report the full 500-draw null distribution per object, not just percentiles, so a bimodal null
    on the wider word is visible.
  - Report the substituted chimera sigma triples explicitly in the output, so a degenerate substitution
    is visible to a reader who never opens the code.
  - Check rank(A_16) equals block size for each object as a forced value before any profile is read.
  - Report the carry-class spread per object next to the smallest between-object distance, so an unresolvable
    comparison is declared rather than resolved.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if the identity check fails, if either SHA-512 implementation misses a NIST test vector,
    or if rank(A_16) is not the block size for any object.
  - Stop at 500 null draws per object as preregistered; do not extend after seeing the bands.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The identity check passes bitwise, all forced values hold, and the three normalized
    profiles, three pairwise distances under both conventions, and three null bands are emitted in
    full - including when the escape count is zero or the conventions disagree, because a controlled
    null and a declared failed decomposition are both complete deliverables that close the predictive
    reading with a measured number rather than an opinion.
  falsification_criterion:
  - Zero of the three objects escape their own random-tap null band, closing the predictive reading
    of the deficit integer at the section 4 standard.
  - The two normalization conventions disagree on the pairwise distance ordering, falsifying the decomposition
    as convention-independent.
  - The identity check fails, falsifying the substitution machinery and voiding the chimera arm.
  - rank(A_16) is not the block size for some object, falsifying that object's linearizer.
  - Within-object carry-class spread exceeds the smallest between-object distance, falsifying resolvability
    at this carry sampling.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f5dc22
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Neither normalization convention is derived; both are declared, and the contract handles this
    by treating disagreement as failure rather than by choosing. A Coordinator must accept that stance
    or supply a principled convention.
  - No argument establishes that SHA-256's rotation amounts on 64-bit words give a representative
    third point rather than a degenerate one.
  - The condition-support scaling rule across word widths is a second undeclared-in-principle convention
    layered on the first, and its interaction with normalization is not separated.
  - This contract depends on the single-object rank pipeline passing its own forced-value gate first
    and cannot be approved before that.
