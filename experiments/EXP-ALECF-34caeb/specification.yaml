experiment:
  id: EXP-ALECF-34caeb
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-e93eb8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-e93eb8
  question_id: RQ-ALECF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate the exceptional set of the affine addition formula on toy curves, inject a defect
    supported exactly on it, and measure the miss rate of uniform shot-based validation against the
    closed form and a density-matched random-subset null.
  objective: 'The one uncertainty a run reduces is how much of a point-addition circuit''s input space
    a shot-based validation rule actually certifies, and specifically whether the algebraically distinguished
    inputs most likely to be mishandled are reachable by that rule at the sizes where it is applied.
    Concretely: (i) what is the exact density of the exceptional set of the implemented affine addition
    formula among ordered point pairs on toy curves, computed by two independent enumerations that
    must agree, and does that density follow the expected inverse-group-order law across the tested
    widths; (ii) for a defect supported exactly on that set, does the measured miss rate of uniform
    N-shot validation match the closed form (1 minus d) to the N across a swept shot count, or does
    the sampler behave otherwise; (iii) does a defect supported on a structureless random subset of
    identical cardinality produce the same miss rate, which is the null that distinguishes density-blindness
    from structure-sensitivity. A run does not claim any real circuit is defective, does not evaluate
    the ALECF benchmark''s adequacy, does not analyze any attack, and does not touch the imported
    packages beyond reading their committed README for the stated shot count. The deliverable is the
    exact density table, the measured-versus-predicted miss-rate table, the null comparison, and the
    arithmetic crossover width at which 9024-shot coverage of the exceptional set falls below one
    half, with that crossover labelled as arithmetic rather than measurement.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the specific affine short-Weierstrass
      addition formula implemented here, on the specific toy curves tested, the exceptional set has
      the measured density, and uniform N-shot validation misses an exceptional-set-only defect at
      the measured rate, matching or not matching the closed form and matching or not matching a density-matched
      null. WHAT DOES NOT FOLLOW: no conclusion that the ALECF benchmark''s validation is insufficient,
      no conclusion that any submitted circuit mishandles any input, no statement about circuits using
      complete or projective addition formulas whose exceptional set may be empty, no statement about
      what input distribution any real caller presents, no measurement at 256 bits, and no attack,
      break or feasibility claim. The crossover width is a consequence of arithmetic on the density
      law and is not a measured result.'
  inputs:
    procedure: 'STAGE 0 (cost: under an hour): fix the addition formula, the degeneracy taxonomy,
      the curves, and the seed manifest. STAGE 1 (cost: two hours of engineering, minutes of compute):
      enumerate the exceptional set exhaustively at 8 bits and by structured counting at 13 and 17
      bits; compute d by two independent routes and require exact agreement. STAGE 2 (cost: three
      to four hours of engineering): implement the reversible affine point-add circuit in the classical
      basis-state interpreter, plus the exceptional-set-only defective variant and the density-matched
      random-subset variant. STAGE 3 (cost: minutes of compute): run the uniform sampler at N in {64,
      512, 4096, 9024}, 2000 repetitions per cell, recording detection for the exceptional arm. STAGE
      4 (cost: minutes, same invocation): run the identical sweep for the density-matched null, for
      the density-0.5 positive control, and for the undefective circuit. STAGE 5 (cost: under an hour):
      fit the density law across widths, compute Wilson intervals, tabulate measured versus closed-form
      miss rates, and derive the crossover width arithmetically. STAGE 6 (cost: under an hour): emit
      the tables with the formula, the curves, and the uniformity assumption stated on the face of
      the record.'
    instrument: Python 3.11 standard library for exact integer and rational arithmetic; harness/toycurve.py
      for short-Weierstrass point arithmetic over F_p, including its explicit point-at-infinity representation
      and its recomputation-based verification discipline; the classical basis-state reversible interpreter
      built for this bucket's tooling contract, reused so that the validity gate is shared; numpy
      and scipy for Wilson intervals and the density-law fit; pytest for the enumeration cross-check;
      harness/runner.py for run records. No Sage, no quantum simulator, no hardware, no network. The
      Autolab Rust harness is not present in this repository (source/ contains only README.md, results.tsv
      and score.json), so the sampler is reimplemented from the README's description and that reimplementation
      is declared rather than claimed to be identical.
    parameters: 'Three toy curves at 8, 13 and 17 bits, each with recorded group order and count of
      order-2 points; a fourth curve at 13 bits with a different order-2 structure as a curve-choice
      control. Shot counts N in {64, 512, 4096, 9024}. Repetitions 2000 per (arm, width, N) cell.
      Arms: exceptional-set defect, density-matched random-subset defect, density-0.5 positive control,
      undefective circuit. Wilson intervals at 95 percent. Enumeration: exhaustive over all ordered
      pairs at 8 bits, structured counting at 13 and 17 bits with an exhaustive spot check on a random
      2 to the 16 sample.'
  controls:
  - Density-matched random-subset null defect, injected and validated in the same invocation as the
    exceptional-set defect.
  - A generic-support defect (support density 0.5) as a positive control, whose miss rate must be
    indistinguishable from zero at every tested shot count.
  - An undefective circuit control, whose detection rate must be zero at every shot count, checking
    that the harness does not report spurious failures.
  - 'Exact enumeration cross-check: d computed by two independent routes (direct classification and
    a count of degeneracy causes) which must agree exactly.'
  - Both arms use the same seed stream and the same sampler code path.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a defect supported on a uniformly random subset
    of ordered point pairs having exactly the same cardinality as the exceptional set E, but no algebraic
    structure. The identical circuit-injection, sampling and detection pipeline runs on it in the
    same invocation. For the signal arm to mean anything the null must show the SAME miss rate: if
    it does, the measurement has established that shot-based validation is blind to any rare defect
    purely by density, and the exceptional set is unremarkable except that it is the rare set an implementer
    is most likely to get wrong. If instead the exceptional-set arm is missed more often than the
    density-matched random arm, the sampler is not merely density-blind and the difference must be
    explained before either number is reported, most likely as a bug in the sampler or in the enumeration.'
  independent_variables:
  - curve bit width
  - shot count N
  - defect arm
  - curve order-2 structure
  metrics:
    primary:
    - exact exceptional-set density d per curve
    - measured miss rate per (arm, width, N)
    - closed-form predicted miss rate per cell
    - exceptional-arm minus null-arm miss-rate difference
    secondary:
    - degeneracy-cause breakdown of the exceptional set
    - positive-control miss rate
    - undefective-circuit false-detection rate
    - fitted constant in the density law
    - structured-count versus spot-check agreement
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The miss rate M(width, N) of uniform shot-based validation for a defect supported exactly
      on the exceptional set, and its agreement with the closed form.
    formula: 'M(width, N) = (1 minus d(width)) raised to the power N, where d(width) is the exactly
      enumerated density of the exceptional set among ordered point pairs on the curve of that width.
      Pre-registered checks: |M_measured minus M_predicted| at or below 0.02 in every cell; |M_exceptional
      minus M_null| at or below 0.02 in every cell; and the crossover width w such that (1 minus d(w))
      to the 9024 equals 0.5 is predicted to satisfy w at or below 26 bits, derived by solving the
      same formula with d(w) taken from the fitted law.'
    source: Pre-registered in the parent proposal IDEA-20260816-e93eb8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested on curves of 8, 13 and 17 bits, chosen because the exceptional set can be
      enumerated exactly at those sizes and because 9024 shots straddle the coverage transition there,
      which is precisely the regime that makes the measurement informative. The 256-bit setting of
      the imported ALECF packages is not tested and is not extrapolated to as a measurement; the only
      extrapolation performed is arithmetic evaluation of the closed form at larger widths using the
      fitted density law, and it is labelled as such wherever it appears. The transfer assumption
      stated is that the density law's inverse-group-order form persists, which is a counting statement
      about the formula rather than about circuits.
    correspondence: null
  tail_checks:
  - Inspect the degeneracy-cause breakdown for causes that appear only at the smallest width, which
    would indicate finite-size artifacts in the enumeration.
  - Check cells where zero detections occur in 2000 repetitions, where the Wilson upper bound rather
    than the point estimate carries the content.
  - Examine the curve with different order-2 structure for a shifted density constant, confirming
    that curve choice and width are not confounded.
  - Check whether the structured count at 17 bits agrees with the exhaustive spot check on every sampled
    pair, since a single disagreement invalidates the density.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate after the declared cells; no adaptive increase in repetitions for cells with zero detections.
  - Abort if the two independent computations of d disagree at any width.
  - Abort if the undefective-circuit control reports any detection.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits exact exceptional-set densities agreeing across two independent
    enumerations, measured miss rates with Wilson intervals for all four arms across all swept shot
    counts, the closed-form comparison, and the arithmetically derived crossover width, with the positive
    and undefective controls behaving as required.
  falsification_criterion:
  - Measured and closed-form miss rates differing by more than 0.02 in any cell.
  - Exceptional and density-matched-null arms differing by more than 0.02 in any cell.
  - The positive control being missed at a measurable rate.
  - The undefective circuit reporting detections.
  - The two enumerations of d disagreeing.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-e93eb8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact addition formula and its intermediate degeneracies must be written into the contract
    before approval, since the exceptional set is a property of the formula and the current description
    is a taxonomy rather than a specification.
  - Whether the reimplemented sampler should attempt to mirror the Fiat-Shamir derivation described
    in the committed README, or should be plainly uniform with the difference declared, is a Coordinator
    decision.
  - The structured-counting method at 17 bits needs specifying; 'structured rather than brute force'
    is not yet an algorithm.
  - It must be decided whether a complete-addition-formula arm belongs in this contract or in a successor,
    since an empty exceptional set would make the coverage question vacuous for that formula and that
    is a materially different experiment.
