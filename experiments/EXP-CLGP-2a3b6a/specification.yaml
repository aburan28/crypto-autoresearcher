experiment:
  id: EXP-CLGP-2a3b6a
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-8cdc79
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE KN-TECH-081 TWO-STAGE DISCIPLINE TRANSFERRED TO THE ORDINARY PRIME-FIELD SETTING, WHERE
    IT COLLAPSES: for an imaginary quadratic order the unit group has Dirichlet rank ZERO, so the
    log-unit lattice is the zero lattice and stage 2 (shorten the generator) is VACUOUS -- PIP equals
    SG-PIP and both are subexponential -- so no L10 mechanism may rest on "the principal ideal problem
    is hard"; the operative stage-2 ANALOGUE is relation-lattice CVP, which prices ACTION EVALUATION
    and not vectorization, and neither stage sits on the ECDLP side of the missing bridge'
  status: draft
  objective: "(A) WHAT KN-TECH-081 ACTUALLY DEMANDS. Its single most transferable instruction is that\
    \ a proposal resting on \"PIP is hard\" must say WHICH STAGE it means: stage 1, find some generator\
    \ of a principal ideal; stage 2, shorten it by decoding the log-unit lattice. The commutative\
    \ cyclotomic history is unambiguous that these break at different times, and that Soliloquy died\
    \ at stage 2. This record applies that discipline, without exception, to the ordinary prime-field\
    \ setting of lane L10.\n(B) THE TRANSFER, AND THE COLLAPSE. Here the ring is O, an order in an\
    \ IMAGINARY QUADRATIC field K = Q(sqrt(t^2 - 4p)). By Dirichlet's unit theorem the rank of O_K^*\
    \ is r_1 + r_2 - 1 = 0 + 1 - 1 = 0. The unit group is therefore FINITE: {+-1} for disc < -4, order\
    \ 4 for disc -4, order 6 for disc -3, and {+-1} for every non-maximal order of conductor f > 1\
    \ except the small exceptional cases. Consequences, stated sharply:\n  (B1) THE LOG-UNIT LATTICE\
    \ IS THE ZERO LATTICE. There is nothing to\n       decode. Given one generator g of a principal\
    \ ideal, every other\n       generator is ug with u in a group of size at most 6, so the\n   \
    \    SHORTEST generator is found by trying at most 6 candidates.\n  (B2) STAGE 2 IS VACUOUS. PIP\
    \ and SG-PIP coincide in this setting. The\n       distinction KN-TECH-081 exists to preserve\
    \ is REAL in the\n       cyclotomic and quaternion settings and is EMPTY here, and saying so\n\
    \       is the transfer's first result.\n  (B3) STAGE 1 IS SUBEXPONENTIAL, NOT HARD. Computing\
    \ the class group and\n       solving PIP in an imaginary quadratic order is done by index\n \
    \      calculus on ideals: Hafner-McCurley give expected time\n       L_{|D|}(1/2, sqrt(2) + o(1))\
    \ (Las Vegas; GRH-conditional\n       refinements give exponent 3/sqrt(8)). So neither stage is\
    \ a source\n       of hardness.\nNET: NO MECHANISM IN LANE L10 MAY REST ON \"PIP IS HARD\". That\
    \ is a prohibition this record establishes and hands to the rest of the campaign, and it is cheap,\
    \ checkable, and permanent.\n(C) WHERE THE HARDNESS ACTUALLY LIVES -- THE OPERATIVE STAGE-2 ANALOGUE.\
    \ The two-stage shape does transfer, but to a different pair of problems:\n  STAGE 1' (structure):\
    \ compute Cl(O) and express a target class in terms\n    of a chosen generating set of small split\
    \ primes l_1, ..., l_n.\n    Subexponential (Hafner-McCurley).\n  STAGE 2' (shortening): given\
    \ the class as an exponent vector, find a\n    SHORT equivalent vector by decoding the RELATION\
    \ LATTICE\n    L = {e in Z^n : prod l_i^{e_i} = 1 in Cl(O)}. This is a CVP instance,\n    and\
    \ it is exactly the step CSI-FiSh performed for the CSIDH-512 order\n    (KN-LIT-3339). It is\
    \ what makes the group action EVALUABLE in\n    polynomial time for an arbitrary class.\nSo the\
    \ true analogue of \"shorten the generator\" is \"shorten the exponent vector\", and the lattice\
    \ being decoded is the RELATION lattice, not the unit lattice. This is the substantive content\
    \ of the transfer.\n(D) THE DECISIVE OBSERVATION FOR L10, AND IT IS A NEGATIVE. Stage 1' and stage\
    \ 2' both control the cost of EVALUATING the action a |-> [a] * E. NEITHER controls the cost of\
    \ INVERTING it, which is vectorization, and which stays at ~sqrt(h) (KN-TECH-027) even when Cl(O)'s\
    \ structure and a reduced relation lattice are fully known -- indeed CSI-FiSh publishes that structure\
    \ and the scheme's security rests on vectorization remaining hard with it in hand. Therefore:\n\
    \  (D1) Making the action cheap does not make the torsor invertible. The\n       group side being\
    \ fully solved and the torsor side remaining hard is\n       the sharpest available demonstration\
    \ of the group/torsor\n       distinction, and it is empirical rather than conjectural: a\n  \
    \     published computation exists on one side and no attack followed on\n       the other.\n\
    \  (D2) Neither stage sits on the ECDLP side of the bridge. Stage 1'\n       operates on ideals,\
    \ stage 2' on an integer lattice; neither\n       consumes or produces a point of E, so neither\
    \ can be the missing\n       bridge map that IDEA-20260807-5d7606 and IDEA-20260807-bbdcf3 show\n\
    \       to be absent.\nNET: the KN-TECH-081 discipline, correctly applied, tells L10 where NOT\
    \ to look, and that is its value here.\n(E) THE ONE PLACE IT COULD STILL BITE, NAMED SO IT IS\
    \ NOT LOST. Stage 2' is a lattice problem in dimension n (the number of small primes used), and\
    \ its difficulty grows with n. If a class-group route to ECDLP ever existed, stage 2' would be\
    \ on its critical path, because the route would have to EVALUATE the action to test candidate\
    \ classes. So the honest forward guidance is: stage 2' is a cost multiplier on any future L10\
    \ attack, never a source of one. Recording the multiplier now is cheaper than rediscovering it\
    \ later."
  resource_label: 'R3 (End(E) as a ring: ideals, principality, unit group, class group structure and
    the relation lattice). R4 appears only as the setting the evaluated action lives in.'
  admissibility: admissible
  admissibility_argument: 'Admissible: unit rank, principality, and relation lattices are properties
    of the RING O and are entirely invisible to a generic group oracle for G. No step applies an endomorphism
    to a point of G, so H-ENDO-001''s scalar collapse does not apply and neither closed oracle class
    of KN-FIND-b7e091 is used. The proposal then reaches a negative for a reason unrelated to admissibility:
    both stages are on the curve/ideal side of a bridge that does not exist.'
  reachability_gate: 'T5 IS ADDRESSED DIRECTLY AND THIS RECORD IS WHERE ITS COST IS SET. Stage 2''
    is exactly the machinery that determines what "one step" costs on the Cayley graph, and hence
    how expensive the T5 dichotomy''s two sides are: reaching a UNIFORMLY RANDOM curve is O(log p)
    small-prime steps (GRH-conditional rapid mixing) and needs no lattice; reaching a SPECIFIED curve
    given its class needs the relation lattice to turn the class into a short walk, and reaching a
    specified curve NOT given its class is vectorization at ~sqrt(h). So this record supplies the
    per-step cost that every other L10 proposal''s reachability accounting multiplies by, and cell
    M1 is precisely that number measured. It does not itself need to reach any specified curve, so
    it passes the gate at the cost of one lattice reduction per class.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): the rank computation and the prohibition. Free,
      and it is the whole first deliverable. STAGE 1 (minutes): generator counting on toy imaginary
      quadratic orders, plus the real-quadratic control. STAGE 2 (hours): build Cl(O) and the relation
      lattice for toy classes with h in {64, 256, 1024, 4096}; sweep n in {1, 4, 8, 16}; record the
      successive-minima profile. STAGE 3 (hours, THE DISCRIMINATOR): the two-by-two design M1-M4,
      in action evaluations, with the shuffled-lattice null. STAGE 4 (zero compute): write the prohibition
      and the forward guidance.'
    mechanism: "STEP 1 (zero compute, symbolic, HARD GATE). State and check the rank computation:\
      \ r_1 = 0, r_2 = 1, rank = 0; enumerate the finite unit groups by discriminant (order 6 at -3,\
      \ order 4 at -4, order 2 otherwise; order 2 for every f > 1 except the exceptional small cases).\
      \ Conclude (B1), (B2). If any toy instance produces a unit group of rank > 0, the implementation\
      \ is wrong, since the theorem admits no exceptions.\nSTEP 2 (toy compute). Instrument stage\
      \ 1 directly: for toy discriminants, (a) generate principal ideals by multiplying a random element's\
      \ ideal, (b) recover a generator by the standard reduction of the corresponding binary quadratic\
      \ form to the principal form, (c) enumerate all generators and confirm the count equals |O^*|.\
      \ Metric: the number of distinct generators per principal ideal. PREDICTED: exactly |O^*| in\
      \ {2, 4, 6}. This is the empirical face of stage-2 vacuity and it is nearly free.\nSTEP 3 (toy\
      \ compute). Build the relation lattice: choose n small split primes; compute Cl(O) structure\
      \ at toy scale by direct enumeration of reduced forms; build L as the kernel of Z^n -> Cl(O);\
      \ reduce L (LLL is sufficient at these dimensions); measure lambda_1, the covering radius estimate,\
      \ and the CVP cost for random targets.\nSTEP 4 (toy compute, THE COST SPLIT -- this is the discriminating\
      \ measurement). On the same toy classes, measure in identical units (action evaluations, and\
      \ separately wall clock):\n  (M1) cost of EVALUATING [a] * E for a uniformly random class a,\
      \ WITH the\n       reduced relation lattice available (stage 2' used);\n  (M2) the same WITHOUT\
      \ it (naive: factor the ideal, walk with the raw\n       exponent vector);\n  (M3) cost of INVERTING\
      \ the action -- vectorization by kangaroo/MITM on\n       the Cayley graph -- WITH the reduced\
      \ lattice available;\n  (M4) the same WITHOUT it.\nPREDICTED: M1 << M2 by a large and growing\
      \ factor (stage 2' matters a lot for evaluation); M3 ~ M4 within noise, and both ~ sqrt(h) (stage\
      \ 2' matters not at all for inversion). THAT CONTRAST IS THE RESULT. It is a two-by-two design\
      \ with a pre-registered pattern, and any of the four cells coming out differently is informative.\n\
      STEP 5 (zero compute). Write the prohibition (B3-net) and the forward guidance (E) into the\
      \ lane's record so later proposals cannot re-import \"PIP is hard\"."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - real quadratic order (unit rank 1) -- the pipeline MUST see a nonzero rank there
  - shuffled relation lattice of matched dimension and determinant -- M1 must degrade, M3 must not
    change
  - n = 1 degeneracy check (M1 = M2 exactly)
  - vectorization baseline fitted against sqrt(h) before any ratio is computed
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and it is a POSITIVE control because
    the predicted result in cells M3/M4 is a null. Matched object of the same shape: a REAL quadratic
    order of comparable discriminant size, where the unit rank is 1 and the regulator is nontrivial.
    Run Step 2''s generator-counting pipeline there. It MUST report infinitely many generators (in
    practice: a generator family growing with the fundamental unit''s powers, so the measured count
    blows past |O^*| immediately). A pipeline that reports a finite bounded generator count in the
    real quadratic case cannot detect a nonzero unit rank at all, so its rank-0 finding on imaginary
    quadratic orders is vacuous and the run set is INVALID rather than negative. SECOND NULL, for
    Step 4: a SHUFFLED relation lattice -- replace L by a random lattice of the same dimension and
    determinant. Cell M1 must DEGRADE to roughly M2 with the shuffled lattice (the speedup is a property
    of L, not of having any lattice), while M3 must be unchanged. DECAY PARAMETER: n, the number of
    small primes generating the lattice. The M1-versus-M2 gap must GROW with n (larger n gives shorter
    vectors and cheaper walks); a gap that fails to grow with n means the measurement is reading implementation
    overhead rather than lattice quality, which is the canonical artifact tell.'
  independent_variables: []
  metrics:
    primary:
    - generator counts per principal ideal, by discriminant
    - relation-lattice dimension, determinant, and full successive-minima profile
    - M1, M2, M3, M4 in action evaluations, per (h, n), with seeds
    - the same on the shuffled-lattice null
    secondary:
    - real-quadratic control generator counts
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of distinct generators of a principal ideal in a toy imaginary quadratic order
    formula: Exactly |O^*| in {2, 4, 6}, on 100 percent of tested ideals, matching the discriminant.
      Any ideal with more falsifies the rank computation and halts the line.
    source: pre-registered in IDEA-20260807-8cdc79 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - UNIT-GROUP EXCEPTIONS. Discriminants -3 and -4 have units of order 6 and 4. Toy ladders overweight
    small discriminants, so these appear far more often than at crypto scale. Report the discriminant
    with every generator count and never average across them.
  - NON-MAXIMAL ORDERS. For conductor f > 1 the unit group is {+-1} even at D_K = -3 or -4, and h(O)
    follows the conductor formula rather than h(O_K). A pipeline that silently uses O_K in place of
    O will produce wrong class numbers and wrong lattices.
  - LATTICE REDUCTION QUALITY. LLL versus BKZ versus exact CVP give different M1 values. The reduction
    algorithm and its parameters are frozen before Stage 3 and reported with every number, or M1/M2
    measures the reduction library rather than the mathematics.
  - UNIT MISMATCH. "Action evaluations" must be counted with a fixed generator set; comparing M1 (few
    large steps) against M2 (many small steps) in wall clock instead of evaluations would produce
    a spurious speedup from implementation detail.
  - TOY h IS SMALL. At h = 64 the relation lattice is nearly trivial and stage 2' has almost nothing
    to do. The ladder must reach h >= 1024 before the n-sweep is interpreted.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly |O^*| in {2, 4, 6}, on 100 percent of tested ideals, matching the discriminant.
    Any ideal with more falsifies the rank computation and halts the line.
  falsification_criterion:
  - M3/M4 falls below 0.5 persistently. Knowledge of the relation lattice assists INVERSION; the group/torsor
    separation is weaker than assumed; escalate for independent review and reclassify this record
    as an attack lead rather than a prohibition.
  - Any toy imaginary quadratic order exhibits a principal ideal with more than 6 generators. Contradicts
    Dirichlet; halt and debug, and do not report as mathematics until independently replicated.
  - The real-quadratic control shows a bounded generator count. Instrument blind; run set INVALID
    rather than negative.
  - M1/M2 does not decrease with n. The lattice-quality measurement is reading overhead; the evaluation
    half of the claim is unsupported and must be withdrawn, though the rank-0 prohibition survives
    untouched.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
