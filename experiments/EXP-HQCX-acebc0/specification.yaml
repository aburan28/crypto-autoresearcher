experiment:
  id: EXP-HQCX-acebc0
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6f9d8f; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6f9d8f
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive small-n measurement of autocorrelation-profile lossiness, symbolic check of the
    integer-lift composition law, and a parity-survival ladder locating where a shift-invariant secret
    summary stops propagating in HQC
  objective: 'The one uncertainty a run reduces: whether the cyclic autocorrelation profile is a genuinely
    lossy projection of an HQC secret support, and if so how far it propagates before dissolving.
    A run establishes (i) the exact integer count of profile classes versus rotation classes at every
    enumerable (n, w), which converts the lossy-projection test from prose into a number; (ii) whether
    the integer-lift composition law holds as a checked symbolic identity, which is the precondition
    for calling the propagation deterministic at all; and (iii) how the parity-survival ratio rho(n,
    w) behaves as w grows, which is the structural tell that separates surviving structure from a
    measurement artefact. The run also produces (iv) an upper bound on how much block-level failure
    variance the profile still explains after truncation, which is expected to be near zero and is
    worth measuring precisely because a near-zero result closes a direction with a number. No attack,
    break, speedup or security consequence is claimed here or would follow from a run. No statement
    is made about what the published literature does or does not contain; this environment cannot
    reach external literature. No direction is declared impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at the enumerated (n, w) pairs, the
      autocorrelation profile is or is not strictly more collapsing than rotation, by a stated integer;
      the composition identity holds to a stated numerical tolerance; rho takes stated values across
      the stated w ladder; and post-truncation explained variance is bounded above by a stated number
      with its confidence interval. WHAT DOES NOT FOLLOW: nothing about deployed HQC parameters, nothing
      about whether an adversary could compute any of these quantities from public data, nothing about
      the decryption failure rate, nothing about the specification''s analytic model, and no distinguishing
      advantage of any kind.'
  inputs:
    procedure: 'STAGE 0 (seconds, zero compute risk): verify ord_n(2) = n-1 for each n; emit the derived
      shift-invariance statement. STAGE 1 (seconds): exhaustive enumeration of supports at (n, w)
      in {11,13,19,29} x {3,4,5}; compute and class every profile; report collision counts, rotation
      baseline and excess, on both the signal and the random-support null arm. STAGE 2 (seconds):
      symbolic check of the integer-lift composition identity on 10^4 random pairs at n = 29 and n
      = 227, reporting max deviation. STAGE 3 (minutes): estimate rho(n, w) at n = 227 for w in {3,4,5,6,7,8}
      at T = 10^5 samples per cell, both arms. STAGE 4 (tens of minutes): run the truncated pipeline
      at n = 227, N/n = 0.98, T = 10^6, and regress block-failure counts on profile features; report
      explained variance with its null-arm counterpart.'
    instrument: Python 3.11 with numpy and itertools only; NO Sage. Exhaustive enumeration by itertools.combinations;
      profiles as numpy int32 vectors classed by exact tuple comparison after a hash prefilter; cyclic
      convolution over the integer lift by numpy, with a naive O(n^2) reference implementation used
      to cross-check every 100th product; parity reduction by bitwise and; inner Reed-Muller decoding
      for STAGE 4 by the same numpy fast Walsh-Hadamard routine used elsewhere in this batch. New
      module under harness/ following harness/runner.py manifest conventions, seeds from a ladder
      frozen in the specification before data generation.
    parameters: 'STAGE 1: n in {11, 13, 19, 29}, w in {3, 4, 5}; largest cell C(29,5) = 118755 supports.
      STAGE 2: n in {29, 227}, 10^4 random pairs each, weights w in {5, 12}. STAGE 3: n = 227, w in
      {3, 4, 5, 6, 7, 8}, T = 10^5 samples per cell, two arms. STAGE 4: n = 227, RM(1,5) inner blocks,
      n_e = 7, N = 224 (N/n = 0.987), T = 10^6, two arms. Every n satisfies ord_n(2) = n-1, checked
      at run time. All seeds drawn from a frozen ladder; the STAGE 3 tuning of weights uses a disjoint
      seed stream that is never reused downstream.'
  controls:
  - Random-support null arm run through the identical STAGE 1 to STAGE 4 code path in the same invocation.
  - 'Rotation-only baseline: report collisions attributable to rotation separately from the excess,
    so the excess is a difference and not a total.'
  - Symbolic identity check on the integer-lift composition law before any sampling.
  - Decay-in-w structural tell on rho, with a flat rho treated as an instrument artefact rather than
    a finding.
  - Exhaustive ground truth at n <= 29 used to calibrate the sampled estimates at larger n.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a uniformly random support of the same size w in
    the same Z_n, run through the IDENTICAL STAGE 1 to STAGE 4 pipeline in the same invocation. For
    a random support the autocorrelation is flat in expectation with mean w(w-1)/(n-1) off zero and
    a known variance, so the null fixes what ''no structure'' looks like for every statistic reported.
    FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW: (i) collision counts at STAGE 1 consistent
    with rotation-only collapse plus the chance rate, so that any excess collapse measured on HQC-sampled
    supports is an excess and not the baseline; (ii) a parity-survival ratio rho that also decays
    in w, at the same rate - if the null''s rho decays identically then the decay is generic and carries
    no information about HQC; (iii) STAGE 4 explained-variance consistent with zero. Note honestly
    that HQC''s own secrets ARE uniform fixed-weight supports, so the null and signal arms coincide
    at STAGE 1 by construction; the arms separate only from STAGE 2 onward, where the signal arm''s
    supports are coupled through the shared public h and the null arm''s are not. That coincidence
    is stated rather than hidden, and it is why STAGE 1 is reported as a lossiness measurement rather
    than as a signal.'
  independent_variables:
  - ring size n
  - support weight w
  - pipeline stage (integer lift / mod-2 / truncated)
  - 'arm: HQC-coupled supports versus independent random supports'
  metrics:
    primary:
    - profile-class count and rotation-class count per (n, w)
    - excess collision count beyond rotation
    - max deviation in the symbolic composition-law check
    - parity-survival ratio rho(n, w)
    - post-truncation explained variance of block-failure counts
    secondary:
    - hash-collision rate in the profile-classing step
    - wall-clock seconds per stage
    - mean and variance of A_S(d) for d != 0 versus the analytic random-support baseline w(w-1)/(n-1)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The excess collision count at (n, w) = (29, 5), and the ratio rho(227, 8) / rho(227,
      3).
    formula: Excess collisions := (number of supports) minus (number of profile classes) minus (number
      of supports minus number of rotation classes), i.e. the collapse not accounted for by the free
      Z_n rotation action; predicted strictly positive. rho(n, w) := the fraction of coefficients
      of the integer product x*y whose parity is determined by (A_x, A_y, C_{x,y}) together with the
      total weight, estimated by sampling; predicted rho(227,8)/rho(227,3) <= 0.5. Under the null
      of no structure both quantities take their chance-rate values, which are computed in the same
      invocation.
    source: Pre-registered in the parent proposal IDEA-20260816-6f9d8f before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Everything is executed at n <= 227 and w <= 12, which is three orders of magnitude
      below deployed HQC. STAGE 1 and STAGE 2 are EXACT at the sizes run - exhaustive enumeration
      and symbolic identity checking, so no extrapolation is involved in them at all. STAGE 3 and
      STAGE 4 are sampled and their conclusions are scoped to the executed cells. No transfer assumption
      to deployed parameters is made, offered, or required for the deliverable, which is the location
      of propagation failure at the tested sizes.
    correspondence: null
  tail_checks:
  - Report profile classes of size 1 separately, since a projection that is injective on most supports
    and collapses a rare few is a different object from one that collapses uniformly.
  - Check rho's confidence interval width at the largest w, where the estimate is noisiest.
  - Verify that the STAGE 4 regression is not driven by a handful of extreme trials by reporting the
    result with the top 1 percent of trials removed.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if ord_n(2) != n-1 at any n.
  - Halt the ladder at any (n, w) whose exhaustive enumeration would exceed 10^7 supports, and record
    the halt rather than sampling silently.
  - Stop at the declared cell list; no adaptive extension after data has been seen.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits, for every declared cell, the excess collision count with its rotation
    baseline, the composition-law deviation, rho with confidence intervals, and the post-truncation
    explained variance - each with its null-arm counterpart computed in the same invocation.
  falsification_criterion:
  - 'Excess collisions are zero at every enumerated cell: the object is a change of coordinates up
    to phase, and the proposal closes on that integer.'
  - 'The composition-law check fails: the implementation is defective and nothing is reportable.'
  - 'rho is flat in w: the measurement is an artefact under inventor-protocol section 3 and the structural
    reading is withdrawn.'
  - 'The random-support null reproduces the signal arm at every stage: a controlled null is recorded,
    not a finding.'
  - 'Post-truncation explained variance is bounded above by its null-arm value: the object dies at
    truncation and the bound is the deliverable.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6f9d8f
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The definition of 'parity determined by (A_x, A_y, C_{x,y}) and the total weight' must be made
    precise and implementable before approval; as written it is a research sketch and it is the single
    place where a careless definition would manufacture the predicted decay.
  - The profile features used in the STAGE 4 regression are unspecified; a Coordinator must fix the
    feature set in advance, because choosing features after seeing failure data would void the explained-variance
    number.
  - Whether the cross-correlation C_{x,y} counts as part of the tracked object or as side information
    needs a ruling; the propagation law uses it and the lossiness argument is weaker if it does.
