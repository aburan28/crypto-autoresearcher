# EXP-ECDLP-8dac2e
# Band-edge arithmetic. No energy.
# Approved by DEC-20261002-11bb4d.
experiment:
  id: EXP-ECDLP-8dac2e
  hypothesis_id: H-ECDLP-32f0c0
  source_idea: IDEA-20261002-760272
  question_id: RQ-ECDLP-002
  version: 1
  title: Band-edge arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-11bb4d
  objective: >-
    Check that 2^20 is 631040 below 6^8, and that 2^21 exceeds 6^8
    by 417536.
  inputs:
    band: 6
    six_squared: 36
    six_fourth: 1296
    six_eighth: 1679616
    two_20: 1048576
    gap_20: 631040
    two_21: 2097152
    excess_21: 417536
    band_low_den: 6
    band_product: 1
    rho_factor_square: 6
  controls:
    - >-
      Two to the twentieth is 631040 below six to the eighth.
      Reporting 2^20 as at least 6^8 invalidates the run.
    - >-
      Two to the twenty-first exceeds six to the eighth by 417536.
      Reporting 2^21 as at most 6^8 invalidates the run.
    - >-
      Six times one sixth equals 1. The square of the order-6 factor
      is 6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - power in {20, 21}
    - route in {repeated_square, subtraction}
  metrics:
    primary:
      - gap_20
      - excess_21
      - implementations_agree
    secondary:
      - six_eighth
      - band_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 2^20 is 631040 below 6^8, and 2^21 exceeds it by 417536.
    formula: >-
      Square 6 three times to reach 6^8. Subtract 2^20. Subtract 6^8
      from 2^21.
    source: >-
      IDEA-20261002-760272 states the constant band from 1/6 to 6 and
      the power N to the 1/8 at N near 2^20, read 2026-10-02. The
      powers were computed in this design session. That computation
      is not a run. No energy was measured.
  scale_relevance:
    tier: toy
    justification: Two integers. No transfer to a curve.
    correspondence: null
  tail_checks:
    - The excess at 2^21 is required. A check that stops at 2^20 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 631040 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The gap of 6^8 over 2^20 is not 631040.
    - 2^20 is reported as at least 6^8.
    - 2^21 is reported as at most 6^8.
    - An energy is measured or a curve is built.
  success_criterion: >-
    Both runs agree that 6^8 is 1679616, that 2^20 is 631040 below
    it, that 2^21 exceeds it by 417536, and that six times one sixth
    equals 1.
  falsification_criterion: >-
    The runs agree that 6^8 is 1679616, and 2^20 is not 631040 below
    it.
  required_artifacts:
    - experiments/EXP-ECDLP-8dac2e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-8dac2e/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-8dac2e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-8dac2e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-8dac2e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-8dac2e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any additive-energy measurement and any curve.
    - Any claim that a j = 0 curve has a smaller listing exponent.
    - Any measured rho iteration count.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
