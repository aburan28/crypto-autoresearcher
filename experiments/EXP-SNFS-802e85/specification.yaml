experiment:
  id: EXP-SNFS-802e85
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7c9222; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7c9222
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Observation-collision audit for the SNFS detectability observable: a completely labelled
    toy prime population, quantised battery bucketing, and a collision-rate surface over battery size
    and resolution'
  objective: 'The one uncertainty a run reduces is whether the observable the whole detectability
    campaign relies on can identify class membership even in principle, before any effort is spent
    measuring how well it does so. (i) Do collisions exist: over a completely enumerated prime population
    with exactly decided membership, is there any bucket of the quantised battery score vector containing
    both an in-class and an out-of-class prime, since a single such pair is an explicit counterexample
    to identifiability for that battery and needs no statistical inference to be believed. (ii) Do
    they survive refinement: as the battery is enlarged and the quantisation is refined, does the
    collision count fall toward zero, indicating the classes are separable at fine enough resolution,
    or does it plateau, indicating genuinely coincident score vectors that no refinement of this observable
    will separate, which is a named obstruction rather than a screening report. (iii) Does the audit
    have power: do the fabricated random label and the trivially readable label controls bracket the
    real result as they must, and does bucket occupancy remain above one over the resolution range,
    since below that the absence of collisions is an artifact of population size and not a property
    of the battery.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for this battery,
      this quantisation, this class and this completely enumerated population, collisions exist at
      the reported rate, or do not exist and the collision-free margin is as measured, with the controls
      behaving as reported. What does NOT follow: nothing about any observable outside the audited
      battery, nothing about whether the class is detectable by other means, nothing at any size other
      than the one enumerated, and nothing whatever about real, published or deployed parameters.'
  inputs:
    procedure: 'STAGE 0, seconds: fix the battery, the quantisation rule and the resolution ladder,
      and hash them before the population is built. STAGE 1, minutes: enumerate all primes in the
      declared range and store them. STAGE 2, tens of minutes: decide membership exactly for every
      prime by sweeping the derived admissible base interval and testing the coefficient bound, recording
      witnesses where found. STAGE 3, minutes: run the independent membership re-decision on a random
      subsample as an audit of the labels. STAGE 4, minutes: compute and quantise the battery on the
      whole population. STAGE 5, seconds: bucket and list mixed buckets at every point of the resolution
      ladder. STAGE 6, seconds: run the fabricated-label and readable-label controls over the same
      buckets. STAGE 7, seconds: check monotonicity across the ladder and compute the collision-free
      margin where applicable. STAGE 8: emit the collision-rate surface, the explicit collision pairs,
      and the run manifest.'
    instrument: Pure Python 3.11 standard library only; numpy, sympy, gmpy2 and fpylll are absent
      here and Sage is excluded by contract. A sieve of Eratosthenes for the population, divmod-based
      centred-digit membership testing reusing harness/snfs_digits.py, dictionaries for bucketing,
      hashlib for the freeze receipt, json for the surface. New module harness/snfs_collision.py holds
      the population builder, the membership decider, the bucketer and the controls; harness/runner.py
      records the manifest.
    parameters: Prime bit size n = 26, population being all primes in [2^25, 2^26), about 1.6 million,
      subsampled to a declared 10^5 with recorded seed if the full set exceeds the memory cap. Class
      C(d,H) with d = 3 and H in {4, 8}. Battery size K over nested subsets at K in {2, 4, 6, 10}.
      Quantisation ladder at 4, 8, 16 and 32 bins per coordinate. Membership re-decision subsample
      1000 primes. Memory cap 2 GB, wall-clock cap 1800 seconds.
  controls:
  - The fabricated random-label control on the identical population and buckets.
  - The trivially-readable-label control, using p modulo 4, which must show near-zero collisions.
  - A monotonicity check across every refinement step of both K and quantisation.
  - A bucket-occupancy report, so that resolution exhaustion is distinguished from genuine separation.
  - A membership-decision audit on a random subsample, re-deciding membership by an independent method
    to confirm the labels are correct.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The fabricated-label control: the identical population, the identical
    battery, the identical bucketing, with the class membership bit replaced by a random bit at the
    same marginal rate. Collisions must then be far more numerous than in the real run, since a random
    label cannot be predicted from any observable. The null must show a collision rate near the ceiling
    implied by bucket occupancy; if the real run''s collision rate is not clearly below the fabricated
    one, the battery carries no information about membership at all and the audit result is that the
    observable is uninformative rather than merely non-identifying. A second control, a deliberately
    informative label such as p modulo 4 which is trivially readable from any digit statistic, must
    show a collision rate near zero, confirming the pipeline can detect identifiability when it exists.'
  independent_variables:
  - battery size K
  - quantisation bins per coordinate
  - coefficient bound H
  - 'label type: real, fabricated random, or trivially readable'
  metrics:
    primary:
    - number of mixed buckets and collision pairs per (K, resolution)
    - collision rate normalised by bucket count and by class prevalence
    - collision-free margin where no collision exists
    - control collision rates for fabricated and readable labels
    secondary:
    - mean and maximum bucket occupancy per resolution
    - class prevalence in the population
    - membership re-decision disagreement count
    - wall-clock seconds and peak memory
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The collision rate C(K, q), defined as the number of unordered in-class and out-of-class
      prime pairs sharing a quantised score bucket, divided by the total number of such cross-class
      pairs available in the population.
    formula: Under an uninformative observable, C(K,q) would equal the probability that two independent
      primes land in the same bucket, approximately the sum over buckets of the squared bucket share,
      which is computed directly from the observed bucket occupancy distribution and serves as the
      fabricated-label prediction. The prereg statement is the inequality C_real(K,q) <= C_fabricated(K,q)
      at every ladder point, with equality meaning the observable carries no membership information,
      and monotone non-increasing behaviour of C in both K and q.
    source: Pre-registered in the parent proposal IDEA-20260816-7c9222 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Prime size 26 bits is chosen because the entire population can be enumerated and
      every membership bit decided exactly by a bounded base sweep, and completeness is the property
      that makes one collision decisive rather than suggestive. No transfer is claimed to any other
      size: class prevalence, bucket occupancy and the achievable resolution all depend on population
      size, and the specification forbids reporting a collision rate for a size that was not enumerated.
      The only statement offered beyond this size is the structural monotonicity, which follows from
      the construction rather than from the data.'
    correspondence: null
  tail_checks:
  - Inspect the largest mixed buckets, which dominate the collision count and may be driven by one
    degenerate statistic.
  - Inspect in-class primes with extreme score vectors, since those set the collision-free margin.
  - Check the resolution point where bucket occupancy first falls near one, and mark every finer point
    as population-limited.
  - Inspect any prime whose membership re-decision disagrees, since a single mislabel can manufacture
    or destroy collisions.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop refining the resolution ladder once mean bucket occupancy falls below two, and mark finer
    points as not evaluable.
  - Stop at the 1800-second cap and report the ladder points completed.
  - Abort if the membership re-decision disagrees on any subsampled prime, since the labels are then
    untrustworthy.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The collision-rate surface is reported over the full evaluable ladder with explicit
    collision pairs where they exist and a measured margin where they do not, both controls behave
    as predicted, and every resolution point is annotated with its bucket occupancy so population-limited
    results are visible.
  falsification_criterion:
  - Collision count increases under refinement, indicating an implementation error.
  - The readable-label control shows substantial collisions, showing the audit cannot detect identifiability
    when it exists.
  - The real-label collision rate exceeds the fabricated-label rate, which is structurally impossible
    and indicates a labelling error.
  - Membership re-decision disagrees anywhere in the subsample.
  - Bucket occupancy falls below two before any resolution point of interest, making the audit uninformative
    at this population size.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7c9222
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Membership is decided here only for the digit-representable subclass, which understates the in-class
    population; a Coordinator must either accept that scoping or require a full lattice sweep for
    exact membership.
  - The quantisation rule is a design choice that determines the collision count, and it must be fixed
    and justified before the population is built rather than tuned afterwards.
  - The relationship between the collision-free margin and any operational detector threshold is not
    derived here and must be supplied before the margin is quoted as an instrument property.
