  moduli_and_cells_definitions:
    declared_moduli:
      S_all: every odd M with 3 <= M <= 4095 (2047 moduli)
      S_fold: M = 2^k - 1 and M = 2^k + 1 for every integer 2 <= k <= 32
      S_div: every divisor d > 1 of every element of S_fold (all odd); factorisations computed by the executor (trial division up to 65536 and multiplication back), not quoted
      S_decl_cell: (S_all union S_fold union S_div) intersected with [3, 2^m] for the cell's m; this is the "declared moduli" of the idea for R, M2 and the tables
      closed_form_rows: moduli in S_fold union S_div above 2^m are injective on [0, 2^m) (G = |W|, n_max = 1) and are tabulated in closed form; they never enter a minimum
      baseline_rows: M = 1 (G = 1, kangaroo) and M = 2^m - 1 (G = |W|, brute force) are fixtures (M1), excluded from min_M R by definition because they are the baseline slices and cannot affect any threshold decision
    fold_type: >-
      M is fold-type iff M divides 2^k - 1 or 2^k + 1 for some 1 <= k <= 32 (every
      element of S_fold union S_div, including every M with ord_M(2) <= 32).
      Non-fold = odd M not fold-type. Computed in Stage 0 from the definition and
      stored with ord_M(2) for every modulus. Coordinator operational detail:
      the idea says "non-fold" without defining it.
    modulus_class_label: FOLD if M is in S_fold; FOLD_DIV if M is in S_div but not S_fold; GENERAL otherwise.
    methods: >-
      DP over positions with state (weight used, residue) for every M <= 65537
      (O(m w M)); direct enumeration of W with distinct-residue counting for
      M > 65537 and for the cross-check set. For k in (16, 32] fold moduli and
      their divisors above 65537 only enumeration is used, as in the idea.
    counter_quantities:
      n_sigma: exact class size of residue sigma (integer)
      G_M: number of non-empty classes
      n_max: largest class size
      D_M: M * n_max / |W| (exact rational, stored as the integer pair M * n_max, |W|)
      A_M: expected guess rank sum_j j n_(j) / |W| over class sizes sorted decreasing (exact rational, stored as the integer pair P, |W|)
      kappa_M: 2 sqrt(2^m / M), real, MODELED
      C_worst: G_M times kappa_M, MODELED
      C_avg: A_M times kappa_M, MODELED
      B: min(2 * 2^{m/2}, |W|), integer
      R_worst: C_worst / B, MODELED
      R_avg: C_avg / B, MODELED
    exact_threshold_forms: >-
      All threshold tests are made by integer cross-multiplication, never by
      floating point. With G, P, Q = |W|, B, M, m as above:
      R_worst <= 1/4 iff 64 G^2 2^m <= B^2 M; R_worst >= 1/2 iff 16 G^2 2^m >= B^2 M;
      R_avg <= 1/4 iff 64 P^2 2^m <= Q^2 B^2 M; R_avg >= 1/2 iff 16 P^2 2^m >= Q^2 B^2 M;
      D_M / sqrt(M) < 1 iff M n_max^2 < |W|^2; D_M / sqrt(M) > 2 iff M n_max^2 > 4 |W|^2.
      Floating-point values are stored for display only. R_cell is min over
      S_decl_cell of R_M with the argmin M recorded (ties to the smallest M).
      Coordinator operational detail: the idea states the thresholds, not the
      arithmetic form.

