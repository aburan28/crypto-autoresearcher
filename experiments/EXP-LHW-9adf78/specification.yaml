  approved_by: DEC-20261002-33bacf
  approved_at: '2026-10-02'
  packaging_only: false
  approval:
    approved_by: DEC-20261002-33bacf
    composing_decision: DEC-20261002-33bacf
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") once the protocol was
      complete (all required fields non-null). Approval does not assert the
      hypothesis is true. Stages 0-1 only. Approval was first withheld inside the
      same uncommitted design packet while AB-1 was open and recorded here after
      AB-1 was resolved at design time (history in DEC-20261002-33bacf context).
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stages 0-1 only. Stage 0 is the zero-run note and closed forms. Stage 1 is
      exact integer arithmetic on the eight declared cells with zero group
