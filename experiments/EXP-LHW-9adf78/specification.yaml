    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  approval_blockers:
    - id: AB-1
      status: RESOLVED_AT_DESIGN_TIME_BEFORE_ANY_RUN
      field: controls.positive_control_residue_planted and controls.positive_control_W_clu_positional (idea fields minimal_test.design W_clu k0 = 8, S0 = {0,1,2}; predictions M5; method_ceiling.nearby_object_control)
      defect: >-
        The idea requires the instrument to report C_M / B <= 0.25 for M =
        2^{k0} - 1 on the planted class W_clu (positions i with i mod 8 in
        {0, 1, 2}) at k0 = 8 (M = 255). At M = 255 the per-guess cost is
        2 sqrt(2^m / 255) = (2 * 2^{m/2}) / sqrt(255), so the ratio to the
        kangaroo cost is G_255 / sqrt(255) = G_255 / 15.97, and the ratio to
        B = min(kangaroo, |W|) is at least that. A ratio of at most 0.25 would
        need G_255 <= 3 residues. For S0 = {0, 1, 2} the residue of x is
        w + c1 + 3 c2 (c_j = number of set bits at positions congruent to j mod 8),
        which takes 9 to 13 distinct values on the eight cells.
      derivation_label: >-
        Derived by the Coordinator by hand from the multiplicity formula
        C(n, c0) C(n, c1) C(n, c2) (n = 3 positions per class at m = 24 and 4 at
        m = 28, 32) and CONFIRMED INDEPENDENTLY by an exact enumeration of the
        dispatching session (message to the Coordinator, 2026-10-02; the session
        reports distinct residues 9, 10, 9, 12, 13, 12, 13, 12, class sizes |W_clu|
        = 84, 126, 84, 495, 792, 495, 924, 495, worst-case ratios to kangaroo 0.564,
        0.626, 0.564, 0.751, 0.814, 0.751, 0.814, 0.751, average-case ratios 0.215,
        0.215, 0.215, 0.235, 0.245, 0.235, 0.258, 0.235 and D_255 / sqrt(255) =
        0.58, 0.79, 0.58, 2.58, 3.82, 2.58, 4.45, 2.58, so at the three m = 24 cells
        D_M < sqrt(M) and Lemma 2 itself says guess-and-kangaroo cannot beat
        kangaroo there). Re-derived again in Stage 0
        (stage0/wclu-closed-form.json).
        Worst-case G_255: 9 at (24,3), 10 at (24,4), 9 at (24,6), 12 at (28,4),
        13 at (28,7), 12 at (32,4), 13 at (32,6), 12 at (32,8); ratio to the
        kangaroo cost 0.56 to 0.81, hence C_M / B >= 0.56 at every cell.
        Average-case reading (expected rank under decreasing class mass, exact
        multiplicities): ratio to the kangaroo cost about 0.215 at (24,3),
        (24,4), (24,6), 0.236 at (28,4), (32,4), (32,8), 0.245 at (28,7) and
        0.258 at (32,6); at (24,3), (28,4) and (32,4) B equals |W| (brute-force
        regime) which is smaller than the kangaroo cost, so C_M / B there is about
        0.87, 0.38 and 0.86. Under the average-case reading the 0.25 gate is met
        at four cells and missed at four.
      consequence: >-
        Failure of M5 means by the idea's own text that the instrument cannot
        detect concentration and the run is void (idea falsification F4). Stage 1
        as frozen would therefore be void by construction at every cell under the
        worst-case reading, an executor run with a predetermined outcome. The
        idea's nearby_object_control sentence says guess-and-kangaroo merely
        "beats kangaroo" on W_clu (ratio below 1), which is attainable
        (G_255 <= 13 < 15.97) and is inconsistent with the 0.25 in M5.
      resolution:
        decision: >-
          Design-time decision of the Coordinator, authorised by the dispatching
          session, taken before any data exists so nothing is loosened after the
          fact. (1) M5's threshold is UNCHANGED: C_M / B <= 0.25 at M = 2^{k0} - 1,
          k0 = 8, verbatim. (2) The OBJECT was repaired because the idea's stated
          parameters cannot satisfy it: a 0.25 gate needs G_255 <= 3 (G / sqrt(255)
          <= 0.25 gives G <= 3.99) and no position-restricted support delivers that
          at these cells (S0 of size 1 would leave C(m/8, w) elements, one at
          (24,3) and none for w > 3 at m = 24). The BLOCKING positive control is
          now a RESIDUE-PLANTED set (controls.positive_control_residue_planted).
          (3) The idea's original positional W_clu (k0 = 8, S0 = {0,1,2}) is
          retained as a second, NON-blocking DESCRIPTIVE row
          (controls.positive_control_W_clu_positional) reported with its measured G,
          D_255 / sqrt(255) and both cost ratios. (4) The decay ladder (blocking)
          runs on the residue-planted class. (5) No threshold, outcome-table row or
          falsification condition of the idea is altered.
        control_sizing_rule: >-
          The idea never fixes the size of the planted control, and its B is a
          function of the set: B(m, n) = min(2 * 2^{m/2}, n). The residue-planted
          control P_c at each cell therefore has |P_c| = max(|W|, 2^{m/2 + 1}),
          i.e. at least the kangaroo cost, so that brute force cannot be the
          minimum in the idea's own formula and B(m, |P_c|) = 2 * 2^{m/2} at every
          cell. M5's threshold C_M / B <= 0.25 and the idea's B formula are
          therefore both LITERAL, evaluated on the control's own set. (With a
          planted set of exactly |W| elements and the cell's B, a set with G = 3
          would give about 0.76 at (24,3), 0.30 at (28,4) and 0.69 at (32,4) and
          could not pass at the three brute-force cells; the dispatching session
          confirmed these figures.) Sizes |P_c| = 8192, 10626, 134596, 32768,
          1184040, 131072, 906192, 10518300 at (24,3), (24,4), (24,6), (28,4),
          (28,7), (32,4), (32,6), (32,8) (derived by the Coordinator from the rule,
          to be re-derived in Stage 0). Feasibility: the class x mod 255 = r below
          2^m has floor((2^m - 1 - r) / 255) + 1 members, so the three classes hold
          about 197 thousand (m = 24), 3.2 million (m = 28) and 50 million (m = 32)
          distinct integers, all at least |P_c|.
        history: >-
          The first draft of this packet withheld approval (decision revise) on
          exactly this defect and offered candidate repairs R-A (kangaroo-only B
          with the average-case reading, which still missed at (32,6)), R-B (S0 of
          size 1, attainable but degenerate) and R-C (replace the gate by "beats
          kangaroo", a threshold change). The dispatching session chose to keep the
          threshold and repair the object; R-C was not taken. A later interim
          reading that judged the planted control against the kangaroo cost
          instead of the cell's B was replaced, before any run, by the sizing rule
          above so that the idea's B formula stays literal.
      completeness_note: >-
        With AB-1 resolved, every line of the DESIGN-BRIEF section 4 checklist
        holds and the approval is recorded.

  objective: >-
    (A) Stage 0: check Lemmas 1-2, Theorem 3 and P-FOLD-2 by hand, tabulate the
    closed-form bounds, freeze the moduli set and hash both before any count
    runs. (B) Stage 1: compute exact residue class sizes of W(m, w) modulo every
    declared odd modulus on eight cells, derive G_M, D_M, C_M (worst and average)
    and R per cell against the idea's thresholds, and decide E1 versus E2 under
    the idea's outcome table with its controls. Zero group operations.

  class: cost-model-measurement
  class_note: >-
    Proof-oriented closure-or-lead discriminator. Stage 0 is derivation-level
    arithmetic (cost-model floor table); Stage 1 is an exhaustive structure
    census (exact counts, no sampling except NULL-1) plus heuristic validation of
    H1 and H1' (HEUR-LHW-371a91-H1, -H1P) by exhaustive sampling of the moduli
    population, a Poisson-maximum comparison and a tail list. Not an
    exponent-moving mechanism: the target-result-profile bias is respected by
    stating plainly that a positive outcome (E2) would be an exponent-level lead
    and a negative (E1) is a scoped closure; neither is claimed here.

  scope:
    included:
      - >-
        Stage 0 (zero scientific trials): hand check of Lemma 1, Lemma 2,
        Theorem 3 (counting step, concavity, crossing), P-FOLD-2; closed-form
        table of C(k, w), kappa_M = 2 sqrt(2^m / M) and the Theorem-3 lower bound
        for every cell and every k; frozen moduli set with factorisations of
        2^k -+ 1 for k <= 32; closed-form table of the positional W_clu and of the
        residue-planted construction; self-checks; sha256 of the closed-form table
        and of the moduli set written before any Stage 1 count.
      - >-
        Stage 1 (exact integer arithmetic, zero group operations): eight cells
        {(24,3), (24,4), (24,6), (28,4), (28,7), (32,4), (32,6), (32,8)}; exact
        residue class sizes for W by DP and by independent enumeration; NULL-1
        (random set of equal size, five seeds), NULL-2 (interval), the
        residue-planted positive control (blocking), the positional W_clu with
        k0 = 8 and S0 = {0, 1, 2} (non-blocking descriptive row) and the decay
        ladder; H1 / H1' validation;
        observation-collision search; identity fixtures; mechanical verdict.
    excluded:
      - Stage 2 and every task that performs group operations. Named as designed ONLY IF Stage 1 returns E2 OR the cost law must be confirmed for the closure record (idea next_gate); not designed and not approved here.
      - M6 and F5 of the idea (Stage-2 measured cost versus the law), the plain-kangaroo / brute-force / Coppersmith rows, the elliptic consistency arm, certificates of solves.
      - Moduli outside the declared set; cells outside the eight; hash-iterated walks, nested collision search, approximate group-side filters.
      - Any edit of H-LHW-8e8cff or EXP-LHW-22aefa and any use of their inputs, outputs or run ids.
      - Amazon Bedrock.

