# =============================================================================
# EXP-LHW-9adf78 -- VERSION 1 (APPROVED by DEC-20261002-33bacf, Stages 0-1 only)
# frozen contract for H-LHW-371a91: Stage 0 zero-run note (Lemmas 1-2, Theorem 3,
# P-FOLD-2, hashed closed-form table, frozen moduli set, closed-form tables of the
# planted controls); Stage 1 exact residue tables on eight cells with m in
# {24, 28, 32} for every odd modulus up to 4095 and every modulus 2^k -+ 1
# (k <= 32) with its divisors, against the random-set null, the interval null,
# the residue-planted positive control (blocking), the positional W_clu row
# (non-blocking, descriptive) and the decay ladder. Zero group operations.
# Stage 2 is NOT designed and NOT approved here.
#
# Source: IDEA-20260930-750de2 under RQ-LHW-1877bb (goal_id null). Every
# threshold, outcome-table row and falsification condition is copied from the
# idea and fixed now; this design adds only operational detail, each item of
# which is labeled "Coordinator operational detail" below.
#
# DESIGN FINDING AB-1 (RESOLVED BEFORE APPROVAL, section approval_blockers): the
# idea's positive control M5 (C_M / B <= 0.25 at M = 2^{k0} - 1 on W_clu with
# k0 = 8, S0 = {0, 1, 2}) was arithmetically unattainable (confirmed by an
# independent exact enumeration of the dispatching session), so Stage 1 as
# written would have been ARTIFACT_VOID by construction. M5's threshold is
# UNCHANGED; the control OBJECT was repaired at design time, before any run, to a
# residue-planted set; the original positional W_clu is kept as a non-blocking
# descriptive row. No threshold, outcome-table row or falsification condition of
# the idea is altered.
#
# Not edited and not depended upon: H-LHW-8e8cff / EXP-LHW-22aefa (carry-mixture
# source supply; different object, different cells, no shared input or output).
# Amazon Bedrock prohibited. packaging_only false. ZERO RUNS in this packet.
# =============================================================================
