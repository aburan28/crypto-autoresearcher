        Idea M1 and baseline_embedding.reproduction_check: (i) sum over sigma of
        n_sigma = C(m, w) at every cell and every modulus; (ii) first-moment
        checksum of the enumeration, sum over x in W of x = (2^m - 1) C(m-1, w-1)
        (Coordinator operational detail, an exact identity added as an
        enumeration checksum); (iii) M = 1 gives G = 1; (iv) M = 2^m - 1 gives
        G = |W|; (v) G_M = M at M in {3, 5, 7} at every cell, checked against
        direct enumeration.
      pass_fail: >-
        PASS iff every identity holds exactly at all eight cells. ANY mismatch is
        an instrument defect: verdict ARTIFACT_VOID, nothing else is read (idea
        M1: FORCED exact equality).
    - name: counter_agreement
      object: >-
        DP counter and enumeration counter are independent code paths.
        Coordinator operational detail: they must agree exactly on (G_M, n_max,
        sorted class-size vector hash) for all fold moduli with M <= 65537, for
        the five most concentrated non-fold moduli per cell (by D_M and by
        D_M / sqrt(M)) and for 64 further moduli of S_all per cell chosen as every
        32nd odd modulus.
      pass_fail: PASS iff exact agreement everywhere compared; any disagreement is an instrument defect (ARTIFACT_VOID).
    - name: null_random_set_NULL1
      object: >-
        Idea NULL-1 (BLOCKING): W' uniform random subset of [0, 2^m) with |W'| =
        |W|, five seeds, identical counter, G_M, D_M, A_M, C_M / B tabulated on
        the same declared moduli. Seed rule: numpy PCG64 stream per (cell index c,
        replicate r in 0..4) from SeedSequence(entropy=20261002, spawn_key=(1, c,
        r)); sampling procedure: repeatedly draw rng.integers(0, 2^m, size=1.1 *
        remaining + 16), keep first-occurrence order of distinct values, until
        |W| distinct values, take them in first-occurrence order (uniform by
        symmetry; the algorithm is explicit so the stream, not a library choice
        of choice(replace=False), fixes the set). Coordinator operational detail:
        procedure and seed rule.
      prediction_reported: >-
        G_M(W') about M (1 - exp(-|W| / M)) (the idea's prediction) beside the
        exact hypergeometric expectation E[G] = sum_sigma (1 - C(2^m - c_sigma,
        |W|) / C(2^m, |W|)) with c_sigma the class size in [0, 2^m) (Coordinator
        operational detail); relative deviation of the five-seed mean from each
        is reported, not gated.
      pass_fail: >-
        Idea F3 operationalised (Coordinator operational detail, outcome-blind).
        Cell separation holds iff there exists a fold modulus M in S_fold with
        3 <= M <= 2^m such that (a) G_M(W) < min_s G_M(W'_s) - 3 (max_s G_M(W'_s) -
        min_s G_M(W'_s)) OR (b) n_max_M(W) > max_s n_max_M(W'_s) + 3 (max_s n_max -
        min_s n_max), s over the five seeds (strict inequalities; if the null range
        is 0 the condition is strict inequality against the null value). The factor
        3 is a Coordinator design parameter, not derived from the idea. If no fold
        modulus separates W from W' at a cell, F3 fires: instrument measuring set
        size, ARTIFACT_VOID. Also PASS requires the identity fixtures on W' (size
        exactly |W|, all elements distinct and in [0, 2^m), class sizes sum to |W|).
    - name: null_interval_NULL2
      object: >-
        Idea NULL-2: W_I = [0, |W|), same counter. Exact prediction (derived by the
        Coordinator, to be confirmed): for every declared M with 3 <= M <= |W|,
        G_M = M, n_max = ceil(|W| / M), D_M = M ceil(|W| / M) / |W| <= 2. Interval
        cost law on W_I: C_I = G_M * 2 sqrt(|W| / M) against the kangaroo cost
        2 sqrt(|W|), giving the ratio sqrt(M) >= sqrt(3).
      pass_fail: >-
        PASS iff the exact identities hold for every declared M in [3, |W|] and
        the minimum over those M of the ratio to 2 sqrt(|W|) is at least 1 (the
        family returns kangaroo on W_I to within the constant; M = 1 is the exact
        kangaroo slice). Moduli above |W| are excluded here for the same
        per-guess-cost floor as elsewhere. Failure is an instrument defect.
    - name: positive_control_residue_planted
      object: >-
        BLOCKING POSITIVE CONTROL of the idea (minimal_test.controls POSITIVE
        CONTROL, predictions M5), object repaired at design time (AB-1). For each
        cell (m, w), a set P_c of exactly n_c = max(C(m, w), 2^{m/2 + 1}) distinct
        integers x < 2^m (the control_sizing_rule of AB-1; n_c = 8192, 10626,
        134596, 32768, 1184040, 131072, 906192, 10518300 on the eight cells)
        drawn uniformly from those with x mod 255 in the frozen residue set
        R3 = {17, 18, 19}. The value r0 = 17 is arbitrary and frozen here; no other
        value was considered. k0 = 8 is kept (M = 2^{k0} - 1 = 255). Sampling
        (Coordinator operational detail): numpy PCG64 stream per cell index c from
        SeedSequence(entropy=20261002, spawn_key=(2, c)); N_r = floor((2^m - 1 - r)
        / 255) + 1 for r in R3, N = sum N_r; draw u uniform in [0, N) (oversampled
        by 1.1 and repeated), map u to the u-th integer of the residue blocks in
        the order 17, 18, 19 (x = r + 255 t), keep distinct values in
        first-occurrence order until n_c values. By construction n_sigma = 0 for
        every sigma outside R3, so G_255 = 3 and n_max >= n_c / 3, giving
        D_255 / sqrt(255) at least 85 / 15.97 = 5.3 (Coordinator arithmetic).
      pass_criterion: >-
        M5 THRESHOLD VERBATIM FROM THE IDEA (predictions M5 and
        minimal_test.controls): C_M / B <= 0.25 for M = 2^{k0} - 1, i.e. the
        instrument must report C_M < B / 4 on the planted class; failure means the
        instrument cannot detect concentration and the run is void (F4 unchanged).
        B is the idea's own formula B(m, n) = min(2 * 2^{m/2}, n) evaluated on the
        control's own set of size n_c, which equals 2 * 2^{m/2} at every cell by
        the sizing rule (approval_blockers AB-1 resolution.control_sizing_rule).
        Decided by the integer form 64 G^2 2^m <= B^2 M with G the measured G_255
        and B = 2^{m/2 + 1}; with G = 3 this reads 576 <= 1020 (ratio 3 /
        sqrt(255) = 0.188 at all eight cells, Coordinator arithmetic). PASS iff the
        measured G_255 equals 3 EXACTLY (n_sigma = 0 outside R3, sum of n_sigma =
        n_c) AND the integer inequality holds at all eight cells. Reported, not
        gated: D_255 / sqrt(255), A_255 and the average-case ratio.
    - name: positive_control_W_clu_positional
      object: >-
        The idea's ORIGINAL clustered class, retained as a NON-BLOCKING
        DESCRIPTIVE row: W_clu = {x in W : every set bit i has i mod 8 in
        {0, 1, 2}} with k0 = 8, at the eight cells (same m and w), same counter,
        tables at the declared moduli, closed form in Stage 0 (n_j positions per
        class j: 3 at m = 24, 4 at m = 28 and 32; multiplicity C(n, c0) C(n, c1)
        C(n, c2)). It shows where positional clustering does and does not pay.
      pass_fail: >-
        INSTRUMENT AGREEMENT ONLY: PASS iff the DP and enumeration counters agree
        exactly with each other and with stage0/wclu-closed-form.json at all eight
        cells (hand and independent counts: G_255 = 9, 10, 9, 12, 13, 12, 13, 12;
        |W_clu| = 84, 126, 84, 495, 792, 495, 924, 495). The 0.25 ratio is NOT a
        gate on this row. Reported: G_255, D_255 / sqrt(255), worst and average
        ratios to the kangaroo cost and to B, as in approval_blockers AB-1.
    - name: decay_ladder
      object: >-
        Idea DECAY PARAMETER q (BLOCKING), run on the residue-planted class. For
        q in {0, 0.25, 0.5, 0.75, 1} let f(q) = floor(q n_c + 1/2); the set P(q)
        consists of the first n_c - f(q) elements of the planted sequence P_c of the
        positive control plus f(q) uniformly random elements of [0, 2^m) (distinct
        from the retained ones, drawn from a second stream with spawn_key (3, c),
        first-occurrence order), total exactly n_c distinct integers; q = 0 is P_c
        and q = 1 is a uniform random subset of [0, 2^m) of size n_c. Coordinator
        operational detail: the reading of "mixing fraction q of uniformly random
        elements", the rounding rule f(q) and the streams. D_255(q) = 255 n_max /
        n_c is computed exactly at each q (n_max the largest class size mod 255),
        and G_255(q) and the cost ratios are reported.
      pass_fail: >-
        PASS iff D_255(q) is non-increasing along q in {0, 0.25, 0.5, 0.75, 1}
        (exact rationals) AND D_255(q = 0) > D_255(q = 1) strictly, i.e. the
        measured gain decreases monotonically in q at the frozen rungs per the
        idea's decay rule. A flat or non-monotone D_255 is the artifact tell of
        docs/inventor-protocol.md section 3 and voids the arm (idea F4).
        Coordinator operational detail: the operationalisation of "monotone" and
        "flat". W's own D_255 is reported beside the ladder for reference.
    - name: observation_collision_search
      object: >-
        Idea proof_search_map.observation_collision (REQUIRED before D_M is used
        as a flag): search, per cell, over pairs (modulus M for W, modulus M' for
        W' of one seed, M = M' allowed) in the declared set with D_M(W) /
        sqrt(M) within a factor 1.1 of D_M'(W') / sqrt(M') and R_M(W) / R_M'(W')
        outside [1/2, 2]. The factor 1.1 and the factor 2 (the ratio of the E1
        and E2 thresholds 0.5 and 0.25) are Coordinator design parameters.
      pass_fail: >-
        Deliverable control, not a gate on E1/E2: PASS iff the search ran to
        completion and the report states either at least one exhibited pair
        (D_M is then declared non-decisive on its own, as the idea states) or that
        none exists in the declared set. The M4 flag is reported only with this
        statement attached.
    - name: kangaroo_constant_and_group_arms_DEFERRED
      object: >-
        Plain kangaroo, brute force and Coppersmith-split rows with storage
        traces, the elliptic consistency arm, M6 and F5 (Stage 2).
      pass_fail: >-
        DEFERRED to Stage 2, owner Coordinator, trigger: Stage 1 returns E2, or
        the cost law must be confirmed for the closure record. Until then every
        C_M and R is labeled MODELED and the closure language of the hypothesis
        limits applies.

  independent_variables:
    - cell  # one of the eight (m, w)
    - modulus_M  # odd, 3 <= M <= 2^m, from S_decl_cell
    - arm  # W | NULL1_seed_r | NULL2_interval | residue_planted | W_clu_positional | decay_q
    - cost_reading  # worst_case | average_case

  metrics:
    primary:
      - G_M, n_max, D_M, A_M per (cell, M) as exact integers or integer pairs
      - R_worst and R_avg per cell, with the minimising modulus and its class label and ord_M(2)
      - M2 comparison G_M versus C(k, w) for M = 2^k - 1 and 2^k + 1, every k in [w, m], every cell
      - M4 per cell, max over non-fold M <= min(4095, |W|) of D_M / sqrt(M) (exact squared form)
      - null, interval, positive-control and decay tables
      - sha256 of every table and of the Stage 0 closed form
    secondary:
      - M4 restricted to ord_M(2) >= m (the H1 domain)
      - H1 validation, expected maximum of M iid Poisson(|W| / M) classes versus n_max, with tail probability of the observed maximum, and the five most concentrated non-fold moduli per cell by D_M and by D_M / sqrt(M)
      - H1' validation, eps_M = min(M, G_N) / G_M - 1 for every divisor pair M | N, N = 2^k -+ 1, largest shortfall per k
      - C_ceil variant with the quotient interval ceil(2^m / M) in place of 2^m / M, reported for sensitivity only
      - matched-weight trend at w = 4 across m = 24, 28, 32
      - closed-form Theorem-3 lower bound ratio LB_k / B per (cell, k)
      - peak_rss_bytes, wall_s, termination_reason per run
    poisson_comparison_formula: >-
      E[max] = sum_{t >= 1} (1 - F_lambda(t - 1)^M) with F the Poisson(lambda =
      |W| / M) CDF; observed-maximum tail probability p_M = 1 - F_lambda(n_max -
      1)^M. The classes are not independent Poisson (the counts sum to |W|); the
      comparison is the idea's stated heuristic reference and is labeled
      approximate. Coordinator operational detail: the formula.

  decision_rule:
    source: >-
      Idea predictions M3 and M4, minimal_test.design OUTCOME TABLE and
      FALSIFICATION THRESHOLDS; thresholds copied verbatim, arithmetic form and
      the trend definition added.
    hard_gates: >-
      Every identity fixture, counter agreement, NULL-1 separation and
      identities, NULL-2 identities, the blocking residue-planted positive control
      (M5), the instrument agreement of the positional W_clu row, the decay
      ladder, the Stage 0 self-checks and the determinism re-run must pass. Any
      hard-gate failure gives the overall verdict ARTIFACT_VOID, nothing about W is
      read, and a repair is a successor run (new run id) under an additive
      amendment when the protocol changes.
    outcomes:
      E1:
        thresholds_verbatim: >-
          E1: R >= 0.5 at all cells, M4 below 1, controls pass -> record the
          closure of class F_M at the section-4 standard (obstruction quantity
          G_M, value per cell, scope the ladder) and forward guidance to hash-walk
          and nested classes. (E1 iff R >= 0.5 at every cell, predictions M3.)
        decidable_form: >-
          Hard gates pass AND for each of the eight cells every modulus in
          S_decl_cell satisfies 16 G^2 2^m >= B^2 M (worst case) AND M4 is below 1
          at every cell (M n_max^2 < |W|^2 for every non-fold M <= min(4095, |W|)).
        avg_case_reading: >-
          The same rule on R_avg is computed and reported as the average-case
          reading; the verdict label comes from the worst case. A divergence is
          stated in the report and in any closure record, whose scope is then the
          worst case only (Coordinator operational detail).
      E2:
        thresholds_verbatim: >-
          E2: R <= 0.25 at two or more cells with the m-trend, controls pass ->
          the minimising moduli are a lead; a hypothesis is designed for the
          corresponding algorithm at larger m. (E2 iff R <= 0.25 at two or more
          cells AND the minimising moduli form a family whose R decreases with m
          across the three m values, predictions M3.)
        decidable_form: >-
          Hard gates pass AND at least two cells have some modulus in S_decl_cell
          with 64 G^2 2^m <= B^2 M AND the trend condition holds.
        trend_condition: >-
          Coordinator operational detail, outcome-blind. For each m in {24, 28,
          32} let R_m be the minimum of R_worst over the cells with that m, and
          M_m its minimising modulus. The trend holds iff R_24 > R_28 > R_32 (strict,
          compared as exact rationals through R^2 = 4 G^2 2^m / (M B^2)) AND the
          three minimising moduli carry the same modulus_class_label. The
          matched-weight (w = 4) trend is reported beside it and never decides.
      INCONCLUSIVE:
        thresholds_verbatim: Between, INCONCLUSIVE at this ladder.
        sub_labels:
          E1_R_ONLY: all cells R >= 0.5 but M4 at or above 1 at some cell
          LOW_R_NO_TREND: R <= 0.25 at two or more cells but the trend condition fails; the minimising moduli are reported as a lead for replication, not as E2
          MID_R: every other valid outcome, including any cell with R strictly between 0.25 and 0.5 and fewer than two cells at or below 0.25
      ARTIFACT_VOID:
        thresholds_verbatim: >-
          ARTIFACT: positive control fails, decay flat, NULL-1 shows the same
          concentration, or M1 mismatch -> void, nothing about W is read.
      falsification_thresholds_verbatim: >-
        Theorem 3 is falsified by any G_M < C(k, w) at a fold modulus; E1 is
        falsified by R <= 0.25 at two cells with the m-trend; E2 is falsified by
        R >= 0.5 at every cell.
    m4_flag: >-
      M4 above 2 at two or more cells (M n_max^2 > 4 |W|^2 for some non-fold
      M <= min(4095, |W|) at each) is the E2 flag; it is recorded with the
      observation-collision statement attached and is followed by listing C_M / B
      for every flagged modulus before anything is believed. It does not itself
      move the verdict, which is decided through R.
    theorem3_check: >-
      F1: any fold modulus 2^k -+ 1 with k in [w, m] and G_M < C(k, w) falsifies
      Theorem 3's counting step: record superseded; this is read independently of
      E1/E2 and independently of the positive-control gate only if the identity
      fixtures pass.
    verdict_artifact: stage1/verdict.yaml, written mechanically by the aggregator run; the Coordinator reads it and records the official decision later.

  heuristic_under_test:
    - HEUR-LHW-371a91-H1
    - HEUR-LHW-371a91-H1P
    - HEUR-LHW-371a91-H0 (cost law, modeled here; confirmation deferred to Stage 2)

  preregistered_prediction:
    quantity: >-
      Idea M1 to M5 as copied in H-LHW-371a91 predictions: exact identities;
      G_M >= C(k, w) at fold moduli; E1 iff R >= 0.5 at every cell, E2 iff R <=
      0.25 at two or more cells with the m-trend; M4 below 1; positive-control
      detection. The idea's honest prior favours E1; E2 is kept as the favourable
      branch and is not de-weighted.
    formula: >-
      G_M = |{x mod M : x in W}|; D_M = M n_max / |W|; C_M = G_M * 2 sqrt(2^m /
      M); B = min(2 * 2^{m/2}, |W|); R = min_M C_M / B.
    source: >-
      IDEA-20260930-750de2 (Lemmas 1-2, Theorem 3, Conjecture 4, H1, H1',
      predictions, minimal_test); worked-cell hand figures of the idea are
      estimates reproduced in Stage 0 within the S0-1 tolerance.
    claim_tier: toy
    measured_vs_modeled: >-
      MEASURED (exact counts, enumerations): n_sigma, G_M, n_max, D_M, A_M, null
      and control tables, class-size hashes, wall_s, peak_rss. RECOMPUTED
      arithmetic: C(k, w), the Stage 0 closed-form table, the closed-form W_clu
      table. MODELED: kappa_M, C_M, R, B (kangaroo law K(L) = 2 sqrt(L)), the
      Poisson maximum, the idea's G(W') approximation. The two kinds never share
      a column.

  scale_relevance:
    tier: toy
    justification: >-
      Cells have m in {24, 28, 32} and 2^{m/2} from 2^12 to 2^16 against
      cryptographic exponents; the ladder tests the finite statement C_M >= B / 2,
      not the exponent. H1 is extrapolated by the idea from the classical range to
      M up to |W|; no transfer beyond m = 32 is claimed.
    correspondence: >-
      Eight cells span three m values and weights 3 to 8 (alpha = w / m from 0.125
      to 0.25 by Coordinator arithmetic, to be re-derived), including both
      regimes (brute force at (24,3), (28,4), (32,4); kangaroo elsewhere).

  tail_checks:
    - The five most concentrated non-fold moduli per cell (by D_M and by D_M / sqrt(M)), re-checked by direct enumeration (counter_agreement).
    - The cell and modulus attaining each R_cell minimum, with the next five smallest R values per cell.
    - The fold modulus with the largest H1' shortfall per k.
    - The smallest observed G_M / C(k, w) over all fold moduli and k (how close M2 comes to binding).

  optimistic_assumptions:
    - assumption: Per-guess cost 2 sqrt(2^m / M) exactly (asymptotic kangaroo constant 2, no overhead)
      bias_direction: Optimistic for the attacker (real toy constants are not below the law); R is a lower-cost bound
    - assumption: Every wrong guess is charged one full kangaroo budget K and the correct guess is charged one
      bias_direction: Neutral to slightly pessimistic for the attacker; A_M kappa_M is the best-order guess count times the full per-guess cost
    - assumption: Average-case reading assumes the attacker holds the offline class-mass ordering of M words
      bias_direction: Optimistic for the attacker (the table is advice, charged separately and not in C_avg)
    - assumption: Integer work of unranking the guess list is not charged in C_M
      bias_direction: Optimistic for the attacker; reported beside group additions only in a later stage
    - assumption: Moduli above 2^m are excluded from every minimum
      bias_direction: None on decisions; their R is at least 1 by the per-guess floor of one group addition

  memory_accounting: >-
    Analytic estimate, not a measurement: DP table at most (w + 1) * 65537 int64
    words (about 4.7 MB) per modulus; the largest enumeration array is
    C(32, 8) = 10518300 int64 (about 84 MB) with a sort or bincount copy of the
    same order, so a peak of the order of 0.5 to 1 GB per cell process against the
    declared 4 GB bound; NULL-1 adds one array of the same size per seed in
    sequence, never concurrently. Measured peak_rss_bytes is reconciled against
    this estimate in each run summary.

  hidden_overhead_honesty: >-
    Theorem 3's o(1) hides the polynomial factor sqrt(k) of C(k, w) and the
    kangaroo constant; no superpolynomial term is hidden. The Stage 1 tables are
    analysis cost (O(m w M) per modulus), never solver memory; a stored residue
    table of M words is advice, not polynomial memory. The finite-size confounder
    (poly(m) factors at the scale of the exponents) is stated in the hypothesis
    interpretation_limits.

  standardized_parameter_sets:
    - name: LHW-residue-ladder-24
      cells: [[24, 3], [24, 4], [24, 6]]
    - name: LHW-residue-ladder-28
      cells: [[28, 4], [28, 7]]
    - name: LHW-residue-ladder-32
      cells: [[32, 4], [32, 6], [32, 8]]

  affected_vs_safe_scope: >-
    AFFECTED (conclusions are scoped to): class F_M (known partial exponents plus
    a guessed residue), odd moduli, the eight cells, moduli in the declared set,
    the modeled kangaroo cost. SAFE / untouched: every deployed ECDLP; hash-
    iterated walks; nested collision search (Esser-May); approximate group-side
    filters; the parent question RQ-LHW-1877bb. No security statement of any kind
    is made.

  design_notes_for_stage0:
    note: >-
      Coordinator-noted checks for the Stage 0 note. They are observations made
      while designing, to be CONFIRMED OR REFUTED by hand in stage0/lemma-note.md.
      None changes a threshold; Theorem 3 proper does not use P-FOLD-2.
    items:
      - id: DN-1
        text: >-
          The idea writes L(kappa) >= 1/2 "for kappa >= alpha/0.89". H(alpha/kappa)
          >= 1/2 holds exactly for alpha/kappa in [0.1100, 0.8900], i.e. kappa in
          [alpha/0.89, alpha/0.11]. Theorem 3 uses only concavity and the two
          endpoint values L(1.124 alpha) >= 1/2 (because 1/(1 - p*) <= 1.124 for the
          root p* = 0.1100 of H(p) = 1/2, to be computed to five digits) and
          L(1) = H(alpha), so the conclusion stands; the Stage 0 note states the
          corrected range.
      - id: DN-2
        text: >-
          P-FOLD-2's split 2^a = 2^{a-1} + 2^{a-1+k} is a residue identity modulo
          2^k - 1 only (2^k = 1). Modulo 2^k + 1 the two terms sum to 2^{a-1}(1 +
          2^k) = 0, not 2^a. The note must supply a Fermat variant (e.g. position
          a-1+2k, which needs m >= a + 2k) or restrict P-FOLD-2 to M = 2^k - 1 and
          state that Fermat moduli with k < 1.124 w are covered only by the
          exhaustive ladder check. It must also state the side conditions: a >= 1,
          non-colliding positions, w - floor(k/2) <= number of splittable bits, and
          a - 1 + k <= m - 1.
      - id: DN-3
        text: >-
          Derived by the Coordinator from ceil(1.124 w), to be re-derived: on the
          eight cells the only k in [w, 1.124 w) is k = w (w = 3, 4, 6, 7, 8 give
          3.37, 4.50, 6.74, 7.87, 8.99), where the counting bound C(w, w) = 1 is
          trivial. P-FOLD-2 is therefore needed on the ladder only at k = w, and F1
          is vacuous there; for k >= ceil(1.124 w) Theorem 3 applies.
      - id: DN-4
        text: >-
          The idea's cost law is stated with the quotient interval ceil(2^m / M) in
          Lemma 2 and with the real 2^m / M in Theorem 3, Conjecture 4 and the
          Stage 0 table. The contract freezes the real form for every decision and
          reports the ceiling form as a sensitivity row.
      - id: DN-5
        text: >-
          The formula 2 sqrt(2^m / M) falls below 1 for M above 4 * 2^m. The
          declared set stops at M = 2^m; moduli above that are injective closed-form
          rows with R at least 1. Restriction of R to M <= 2^m follows the idea's own
          scope (Theorem 3: k <= m; Conjecture 4: M <= 2^m).
      - id: DN-6
        text: >-
          Worked-cell reproduction: the idea's hand figures (32,6): 229824 at k = 8,
          1.89e6 at k = 12, 4.10e6 at k = 16, 4.31e6 at k = 24; (24,3): 20644 at
          k = 6, 28160 at k = 12, 13056 at k = 18. Coordinator spot arithmetic
          (hand, to be re-derived) gives 28 * 2 sqrt(2^32 / 255) of about 229825
          and 20 * 2 sqrt(2^24 / 63) of about 20642, in agreement with the printed
          figures within 0.02 percent; Stage 0 recomputes all of them (self-check
          S0-1).

  stage_gating:
    stage0:
      deliverables:
        - stage0/lemma-note.md
        - stage0/closed-form-table.json
        - stage0/closed-form-table.sha256
        - stage0/moduli-set.json
        - stage0/moduli-set.sha256
        - stage0/wclu-closed-form.json
        - stage0/self-checks.yaml
      description: >-
        lemma-note.md: hand check of Lemma 1, Lemma 2, Theorem 3 (counting step,
        concavity derivative, crossing root, endpoint inequality) and P-FOLD-2,
        addressing DN-1 to DN-6. closed-form-table.json: for each cell and each
        k in [2, m], C(k, w) exact, kappa_M for M = 2^k - 1 and 2^k + 1, the
        Theorem-3 lower bound LB_k = C(k, w) * 2 sqrt(2^m / (2^k + 1)), LB_k / B,
        the Theorem-3 range flag (k >= ceil(1.124 w)), |W|, B and the regime, and
        the worked-cell reproduction rows; its sha256 is written to
        closed-form-table.sha256 before any Stage 1 count runs. moduli-set.json:
        S_all, S_fold, S_div with factorisations of 2^k -+ 1 (k <= 32), class
        labels, ord_M(2) and fold-type flag for every modulus, the per-cell M4
        populations; sha256 likewise. wclu-closed-form.json: (i) exact positional
        W_clu class sizes, G_255, A_255 and the ratios of AB-1 for the eight
        cells, re-deriving the hand and dispatching-session counts; (ii) the
        residue-planted construction: R3 = {17, 18, 19}, the sizes n_c =
        max(C(m, w), 2^{m/2 + 1}), N_r and N per cell with N >= n_c (feasibility),
        B(m, n_c) = 2^{m/2 + 1}, the attainability reading G = 3, 3 / sqrt(255) =
        0.188 and the integer inequality 576 <= 1020.
      self_checks:
        - S0-1: worked-cell reproduction (DN-6) within 0.5 percent relative of every printed figure; a larger discrepancy must be explained in the note by an identified arithmetic error before Stage 1 may start
        - S0-2: crossing root p* of H(p) = 1/2 computed to five digits and 1/(1 - p*) <= 1.124 confirmed
        - S0-3: concavity derivative L'(kappa) = -log2(1 - alpha/kappa) - 1/2 re-derived and checked numerically at three kappa per cell
        - S0-4: the P-FOLD-2 domain on the eight cells re-derived (DN-3) and the Fermat variant or restriction stated (DN-2)
        - S0-5: moduli set built, factorisations verified by multiplying back and by a deterministic primality test of each prime factor; counts and class labels recorded
        - S0-6: both counters agree exactly on an implementation self-test cell (m, w) = (16, 4) for every odd M <= 255 and on the first-moment checksum; a self-test, not a result
        - S0-7: cell table values (C(m, w), 2^{m/2+1}, B, regime) re-derived and equal to this contract's cells block
        - S0-8: positive-control attainability read from wclu-closed-form.json against the criterion frozen in controls.positive_control_residue_planted (G = 3 and the integer inequality at all eight cells) and the positional counts re-derived (9, 10, 9, 12, 13, 12, 13, 12); a failing reading blocks Stage 1 and returns the contract to the Coordinator
        - S0-9: sha256 of closed-form-table.json and moduli-set.json computed and written, and re-verified at the start of every Stage 1 run
      gate: Stage 1 does not start until every self-check S0-1 to S0-9 is recorded as passed in stage0/self-checks.yaml.
    stage1:
      deliverables:
        - stage1/pins.json
        - stage1/identity-fixtures.json
        - stage1/residue-tables-W.jsonl
        - stage1/cell-summary.json
        - stage1/fold-bound-check.json
        - stage1/null1-tables.jsonl
        - stage1/null2-tables.jsonl
        - stage1/positive-control-tables.jsonl
        - stage1/decay-ladder.json
        - stage1/h1-validation.json
        - stage1/h1prime-validation.json
        - stage1/observation-collision.json
        - stage1/counter-agreement.json
        - stage1/determinism-rerun.json
        - stage1/table-hashes.json
        - stage1/verdict.yaml
      description: >-
        residue-tables-W.jsonl: one line per (cell, M) with M, class label, ord_M(2),
        G_M, n_max, the integer pairs for D_M and A_M, and the class-size
        histogram hash; closed-form injective rows flagged. cell-summary.json: per
        cell B, R_worst and R_avg minima with argmin, the exact threshold flags,
        M4 (squared form), per-m minima for the trend. fold-bound-check.json: M2
        per (cell, fold modulus, k) with G_M, C(k, w) and the margin. determinism-
        rerun.json: the sha256 of every table from the first execution and from an
        independent second execution in a fresh process (and with the DP and the
        enumeration swapped where both can produce the table), required equal.
      determinism_proof: >-
        Stage 1 is a finite exhaustive integer computation: W, W_I and the
        positional W_clu are enumerated completely; only NULL-1, the
        residue-planted control and the decay-ladder mixing draw randomness, from
        the recorded PCG64 streams (spawn keys (1, c, r), (2, c), (3, c)). Determinism is proven, not assumed: (i) the two counters
        agree exactly (counter_agreement); (ii) the full pipeline is run twice in
        separate processes and every table hash must match; (iii) NULL-1 sets are
        regenerated from the seed rule and their hash compared; (iv) canonical JSON
        (sorted keys, no whitespace) is hashed. No sampling error exists on any
        W, W_I or W_clu quantity. NULL-1 has five replicate seeds fixed by the idea.
      sample_size_note: >-
        No sample size is derived for W (exhaustive). For NULL-1 the idea fixes five
        seeds; the estimand G_M(W') has an exact closed-form expectation reported
        beside it, so the five seeds test separation (the F3 rule), not a rate.
        The smallest predicted probability to resolve is not applicable because
        no tail probability of a sampled statistic is claimed.

  replication:
    seeds: SeedSequence entropy 20261002; NULL-1 spawn_key (1, c, r), residue-planted control spawn_key (2, c), decay mixing spawn_key (3, c), c = 0..7 cell index, r = 0..4 replicate
    independent_instances: 1
    independent_instances_note: >-
      Stage 0 and all W, W_I and positional W_clu tables are deterministic
      exhaustive computations. NULL-1 uses five replicate seeds (idea); the
      residue-planted control and the decay mixing use one recorded stream per
      cell and are regenerated and hash-compared in the re-run. The determinism
      re-run (second process) is the replication of every table.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 28800
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 12
    maximum_workers: 1
  budget_note: >-
    Advisory (docs/research-budget-policy.md). Estimate, not a measurement, from
    the idea: Stage 1 is on the order of 10^9 elementary integer operations for the
    DP on the largest cell plus enumeration passes over at most 10518300 elements
    for a few hundred to a thousand moduli per cell (minutes to a few hours); the
    NULL-1 arm multiplies the enumeration passes by five. Run plan: one Stage 0
    run, eight Stage 1 cell runs, one aggregator run, two spare for an
    infrastructure retry under a new run id. Fixed scientific counts (all eight
    cells, all moduli, five NULL-1 seeds) are not truncated by the advisory
    wall clock; a watchdog expiry is failed_infrastructure.

  stopping_rules:
    - Stop Stage 0 after the seven Stage 0 artifacts and the self-checks file are written; Stage 1 starts only if S0-1 to S0-9 all passed.
    - Stop Stage 1 after the eight cell runs and the aggregator run complete, or on a hard-gate failure (retain partial artifacts, classify as procedure failure).
    - A timeout, crash, memory abort or missing dependency is failed_infrastructure, never a mathematical result.
    - If F1 fires (a fold modulus with G_M < C(k, w)), archive the counterexample table before any decision.
    - Do not start Stage 2 or any group-operation task; designing it is a separate Coordinator decision after Stage 1.

  invalidation_rules:
    - Missing required artifacts invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
    - Changing success or falsification criteria, the cell set, the moduli set, the seed rule or the cost-law reading after observing outcomes without a versioned protocol_amendment invalidates interpretation.
    - Mixing measured, recomputed and modeled quantities in one column invalidates the tables.
    - A threshold comparison made in floating point instead of by the integer forms invalidates that comparison.
    - Reading H-LHW-8e8cff or EXP-LHW-22aefa inputs or outputs into this experiment invalidates scope.
    - Any claim of a deployed-curve break, an exponent move or a closure beyond the tested scope invalidates the report.
    - A Stage 1 run begun before the Stage 0 hashes exist and self-checks pass invalidates that run.

  success_criterion: >-
    Stage 0: all seven artifacts present, self-checks S0-1 to S0-9 passed, hashes
    written. Stage 1: all deliverables present; all hard gates passed (identity
    fixtures, counter agreement, NULL-1, NULL-2, resolved positive control, decay
    ladder, determinism); the verdict file applies the decision rule to the
    exact integer comparisons and states one of E1, E2, INCONCLUSIVE (with
    sub-label) or ARTIFACT_VOID. Every outcome of the idea's outcome table is
    decidable from the predefined metrics; an INCONCLUSIVE or VOID outcome is a
    valid completed run and not a failure of the contract.

  falsification_criterion: >-
    Theorem 3 is falsified by any G_M < C(k, w) at a fold modulus (F1); E1 is
    falsified by R <= 0.25 at two cells with the m-trend (F2); E2 is falsified by
    R >= 0.5 at every cell; the arm is void on F3 or F4 or an M1 mismatch. A
    timeout, crash or implementation failure is infrastructure signal, never a
    negative mathematical result.

