experiment:
  id: EXP-BINSTD-4b846c
  hypothesis_id: H-BINSTD-07aa73
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261003-c9c6c3
  goal_id: GOAL-ECDLP2M-001
  predecessor_experiment_id: EXP-BINSTD-9b18fc
  predecessor_evidence_id: EV-BINSTD-90c856
  predecessor_decision_id: DEC-20261003-9f58a7
  prior_evidence_id: EV-BINSTD-69cb29
  ancestor_evidence_id: EV-BINSTD-a99d47
  version: 1
  title: >-
    Cell-scoped (17,4) HEUR + (17,3) product-rank escape/instrument-boundary
    + Stage-2 null after EV-BINSTD-90c856
  status: approved
  approved_by: DEC-20261003-7fbcb8
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1, 2]
  execution_authorized_note: >-
    Stages 0-2 authorized by DEC-20261003-7fbcb8 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Do not re-run EXP-BINSTD-9b18fc,
    EXP-BINSTD-16ee30, or EXP-BINSTD-5b2fd0 v1.
  approval:
    approved_by: DEC-20261003-7fbcb8
    composing_decision: DEC-20261003-7fbcb8
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized. Cites
      EV-BINSTD-90c856 / DEC-20261003-9f58a7 NA-1 and EV-BINSTD-69cb29.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes product-rank-escape (17,3) + cell-scoped diversity
      (17,4) catalogs (≥32, ≤72), Spearman band 0.70, new seeds, encoder pin,
      twin probes, Stage-2 authorization. Stage 1 runs package (17,4) with
      floors before band + diagnostic (17,3). Stage 2 runs null when (17,4)
      floors met. RESULTS.md with package + diagnostic + null labels.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    After EV-BINSTD-90c856, decide whether cell-scoped HEUR on (17,4) meets
    admission floors and then whether Spearman ρ(dim(V·V), N_var) ≥ 0.70;
    independently whether product-rank escape clears or crystallizes the
    (17,3) instrument boundary; and, when (17,4) floors met, whether Stage-2
    null shows the fail-band is structure-specific.

  class: heuristic_validation
  class_note: >-
    Pre-registered Spearman band on an encoding-size instrument with
    cell-scoped package amendment, diagnostic escape arm, and Stage-2 null.
    Not an exponent-moving breakthrough; no ECDLP attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze product-rank-escape catalog for (17,3) and
        cell-scoped diversity catalog for (17,4) (≥32, ≤72); freeze
        preregistered-predictions.json (band 0.70, seeds 2026100340/41/42,
        package_scope={(17,4)}, diagnostic escape rule, Stage-2 auth,
        encoder pin); twin self-check; Stage-1 cells pre-screen.
      - >-
        Stage 1. Measure twin dimVV and twin N_var on (17,3) diagnostic and
        (17,4) package; PACKAGE admission floors on (17,4) only before
        package Spearman band; diagnostic escape/boundary label on (17,3);
        write panels/control-table/RESULTS.md.
      - >-
        Stage 2. When (17,4) floors met: permutation dimVV null +
        random-Boolean matched-catalog null; write stage2/null-results.json
        and append Stage-2 section to RESULTS.md.
    excluded:
      - Re-running EXP-BINSTD-9b18fc (seed 2026100330), EXP-BINSTD-16ee30
        (2026100320), or EXP-BINSTD-5b2fd0 (2026100317).
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Re-imposing FORALL {(17,3),(17,4)} package gate under this card.
      - Editing IDEA claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the 0.70 band after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.
      - Reading package O-SUPPORT/O-FAIL-BAND without (17,4) admission floors.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-4b846c/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-4b846c/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-4b846c/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-4b846c/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-4b846c/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-BINSTD-4b846c/implementation/run.py --stage 2
      --trial-plan experiments/EXP-BINSTD-4b846c/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261003-c9c6c3.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-07aa73.yaml
    predecessor_evidence: ledger/evidence/EV-BINSTD-90c856.yaml
    predecessor_decision: ledger/decisions/DEC-20261003-9f58a7.yaml
    prior_evidence: ledger/evidence/EV-BINSTD-69cb29.yaml
    ancestor_evidence: ledger/evidence/EV-BINSTD-a99d47.yaml
    spearman_band: 0.70
    catalog_seed: 2026100340
    bootstrap_seed: 2026100341
    null_seed: 2026100342
    bootstrap_reps: 200
    null_reps: 200
    min_catalog: 32
    max_catalog: 72
    admission_floor_dimVV: 3
    admission_floor_Nvar: 2
    forbidden_catalog_seeds: [2026100317, 2026100320, 2026100330]
    package_cells:
      - {n: 17, ell: 4}
    diagnostic_cells:
      - {n: 17, ell: 3}
    stage1_cells:
      - {n: 17, ell: 3}
      - {n: 17, ell: 4}

  controls:
    - name: twin_dimVV
      definition: >-
        product_space.dim_vv_path_a == dim_vv_path_b on every measured V.
    - name: twin_Nvar
      definition: >-
        encode_s3 N_var path A == path B (independent linear elim) on every
        measured V.
    - name: ctl_fixed_dim_V
      definition: Every catalog entry has exactly ℓ basis elements (dim ℓ).
    - name: ctl_frozen_V_catalog
      definition: Catalog frozen in stage0/v-catalog.json before Stage 1.
    - name: ctl_no_posthoc_band_edit
      definition: Spearman band 0.70 frozen in preregistered-predictions.json.
    - name: ctl_admission_floors_before_band_package_cells_only
      definition: >-
        ≥3 distinct dimVV and ≥2 distinct N_var required on EVERY package
        cell (here: only (17,4)) before any package O-SUPPORT/O-FAIL-BAND;
        else package O-INCONCLUSIVE. Diagnostic (17,3) does not gate.
    - name: ctl_diagnostic_17_3_independent_of_package
      definition: >-
        O-ESCAPE-OK-17-3 / O-INSTRUMENT-BOUNDARY-17-3 recorded independently;
        neither restores FORALL package HEUR under this card.
    - name: ctl_not_prior_catalog_rerun
      definition: >-
        catalog_seed not in {2026100317, 2026100320, 2026100330}; check.py
        refuses prior seed reuse.
    - name: null_permutation_dimVV
      definition: >-
        Stage 2: shuffle observed dimVV against fixed N_var; compare band reach.
    - name: null_random_boolean_matched_catalog
      definition: >-
        Stage 2: independent draws from observed dimVV support (matched
        cardinality); no Weil product-space structure.

  independent_variables:
    - name: stage
      levels:
        - 0_escape_and_cell_scoped_freeze
        - 1_cell_scoped_package_and_diagnostic
        - 2_null_on_17_4
    - name: cell
      levels: ['(17,3)-diagnostic', '(17,4)-package']
    - name: V_shape_family
      levels:
        - poly
        - geometric
        - product_rank_escape
        - sparse
        - random_dim_first

  metrics:
    primary:
      - name: admission_floors_met_17_4
        unit: boolean
        definition: ≥3 distinct dimVV and ≥2 distinct N_var on package cell (17,4).
      - name: spearman_dimVV_vs_Nvar
        unit: dimensionless
        definition: >-
          Spearman ρ between dim(V·V) and N_var on (17,4); package band
          verdict only when (17,4) admission_floors_met.
      - name: diagnostic_17_3_outcome
        unit: categorical
        definition: O-ESCAPE-OK-17-3 or O-INSTRUMENT-BOUNDARY-17-3 (or O-ARTIFACT).
      - name: cell_scoped_17_4_outcome
        unit: categorical
        definition: Continuity label including O-CELL-FAIL-BAND-17-4.
      - name: stage2_null_outcome
        unit: categorical
        definition: Stage-2 null discrimination label.
      - name: twin_agreement
        unit: boolean
        definition: Both twin meters agree on every measured V.
    secondary:
      - name: bootstrap_ci_95
        unit: interval
      - name: distinct_dimVV
        unit: integer
      - name: distinct_Nvar
        unit: integer
      - name: catalog_size
        unit: integer
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-BINSTD-4b846c-H1-CELL-17-4

  preregistered_prediction:
    quantity: >-
      After (17,4) admission floors (≥3 distinct dimVV, ≥2 distinct N_var),
      Spearman ρ(dim(V·V), N_var) ≥ 0.70 on the cell-scoped package cell under
      twin agreement. Independently: (17,3) product-rank escape yields
      O-ESCAPE-OK-17-3 or O-INSTRUMENT-BOUNDARY-17-3. When (17,4) floors met,
      Stage-2 null decides structure-specific vs artifact fail-band.
    formula: >-
      N_var = |nonlinear_support \ pivots| after F_2 Gaussian elimination
      of pure-linear equations from Weil-descended S_3; dim(V·V) via twin
      product-space ranks; (17,3) catalog by product-rank-escape; (17,4) by
      cell-scoped diversity freeze; Stage-2 nulls as frozen.
    source: >-
      IDEA-20261003-c9c6c3 / EV-BINSTD-90c856 follow-up; frozen before
      Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Encoding-size instrument on n=17 only under this card. No transfer of
      a Spearman band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids ρ claims (O-ARTIFACT).
    - (17,4) admission floor failure → package O-INCONCLUSIVE (band not authorized).
    - Prior catalog seed reuse → protocol invalid / check.py FAIL.
    - Diagnostic (17,3) boundary does not restore FORALL package HEUR.
    - Stage-2 without (17,4) floors → O-IMPEDIMENT (gate), not a null result.

  seeds_and_replication:
    catalog_seed: 2026100340
    bootstrap_seed: 2026100341
    null_seed: 2026100342
    bootstrap_reps: 200
    null_reps: 200
    independent_instances: 2
    note: >-
      Package cell (17,4) and diagnostic cell (17,3) are measured together;
      package HEUR uses (17,4) only. Twin meters are the replication
      instrument for each V. Seeds deliberately differ from 9b18fc
      (2026100330/31), 16ee30 (2026100320/21), and 5b2fd0 v1 (2026100317/18).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 6.0
    maximum_memory_gb: 2
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and v-catalog.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - Stage 2 complete with stage2/null-results.json when Stage-1 authorizes, OR named O-IMPEDIMENT if gate fails.
    - RESULTS.md names package O-* from H-BINSTD-07aa73, diagnostic_17_3_outcome, and Stage-2 null when run.
    - maximum_runs = 6.
    - Do not re-run EXP-BINSTD-9b18fc, EXP-BINSTD-16ee30, or EXP-BINSTD-5b2fd0 v1.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read ρ as support.
    - Package band outcome without (17,4) admission floors → protocol invalid.
    - Re-using catalog seeds 2026100317, 2026100320, or 2026100330 → protocol invalid.
    - Re-imposing FORALL {(17,3),(17,4)} package gate under this card → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming an n≥131 exponent move → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on probes and catalog_size
    ≥32 on Stage-1 cells; Stage 1 produces cell-scoped package outcome,
    diagnostic_17_3_outcome, and cell_scoped_17_4_outcome (or a named
    O-ARTIFACT/O-IMPEDIMENT stop); Stage 2 produces null_outcome when
    authorized (or O-IMPEDIMENT if gate fails); RESULTS.md names package
    O-* from H-BINSTD-07aa73 plus diagnostic and null labels with cited
    artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc band edit; package band verdict
    without (17,4) floors; prior catalog re-run; re-imposed FORALL package
    gate; a claimed break/exponent under this card.
    (O-FAIL-BAND, O-INSTRUMENT-BOUNDARY-17-3, and Stage-2 null outcomes are
    valid scientific negatives of support / in-band, not protocol fails.)

  required_artifacts:
    - experiments/EXP-BINSTD-4b846c/trial-plan-v1.json
    - experiments/EXP-BINSTD-4b846c/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-4b846c/stage0/v-catalog.json
    - experiments/EXP-BINSTD-4b846c/stage1/
    - experiments/EXP-BINSTD-4b846c/stage2/
    - experiments/EXP-BINSTD-4b846c/RESULTS.md
    - experiments/EXP-BINSTD-4b846c/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-4b846c/implementation/run.py
    - experiments/EXP-BINSTD-4b846c/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
