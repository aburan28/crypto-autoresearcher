experiment:
  id: EXP-SQISIGN-e15acb
  hypothesis_id: H-SQISIGN-1d9721
  derived_from_idea: IDEA-20260821-211586
  question_id: RQ-SQISIGN-39f231
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Kani-template margin ledger for the SQIsign Round-3 published surface - three margins
    in bits, a priced search exponent per item, the minimum over items against a named
    baseline tier, and derivatives in the scheme's own parameters, gated on a reading
    stage and on two controls that must fire

  objective: >-
    The one uncertainty a run reduces is whether the obstruction this question asks to be
    NAMED is a quantity with a scope rather than a sentence - specifically, how far the
    Round-3 published surface is from the SIDH/Kani template's inequality, in bits, and
    what an adversary would pay to close the gap. A run establishes (i) whether the
    required primary sources can be filed as KN-LIT at all, which is this question's own
    gate; (ii) the exponent c and the exact form of the embedding condition, extracted
    with theorem and page; (iii) whether the ledger reproduces LIVE with e = 0 on SIDH
    parameters and on the constructed SQIsign-WEAK null, without which no negative about
    the real scheme may be recorded; (iv) M1, M2, M3 and a priced e per published item,
    with the MINIMUM over items compared against both named baseline tiers; and (v)
    dM1/dt and dM2/dt over the declared tweakable-parameter list. EVERY STAGE IS ZERO
    COMPUTE. No attack is proposed and no cell may be filled from memory.

  what_this_is_not:
    - >-
      Not an attack on SQIsign, on SIDH, or on anything else. No cryptanalysis is
      performed; the deliverable is a documentary ledger with a decision rule.
    - >-
      Not a security assessment. The ledger measures DISTANCE TO ONE TEMPLATE with one
      exponent c, and a large distance from this attack is not a distance from any other.
    - >-
      Not a claim about endomorphism-ring hardness or transcript distinguishability, which
      belong to other goals; the endomorphism-ring cost enters only as the named yardstick.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been
      executed under this contract, and every technical statement about SQIsign in it is
      unverified.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. Against THIS template with the embedding condition as
      stated in the FILED primary sources and the recorded exponent c, the Round-3
      published surface leaves a deficit of e bits minimised over published items, with the
      per-item margins and the undetermined cells as reported, and the ledger reproduces
      LIVE with e = 0 on SIDH and on SQIsign-WEAK. WHAT DOES NOT FOLLOW - nothing about
      other templates; nothing about future higher-dimensional embeddings with a smaller c;
      no security claim about SQIsign or any deployment; no concrete-parameter conclusion
      above the conditional baseline's superpolynomial o(1); and nothing at all if either
      control misses.

  inputs:
    procedure: >-
      STAGE 0 - THE GATE, AND IT IS THIS QUESTION'S OWN CONSTRAINT, NOT AN OPTION. File the
      NIST Round-3 SQIsign submission package and the primary higher-dimensional-design
      papers as KN-LIT entries at stated provenance levels. NO LATER STAGE MAY RUN BEFORE
      THIS, AND NO CELL MAY BE FILLED FROM MEMORY OR FROM A SEARCH SNIPPET. If the sources
      cannot be filed, the deliverable is that fact and the ledger stays empty.
      STAGE 1 (zero compute, documentary). Extract c and the exact form of the embedding
      condition from the filed primary sources, RECORDING THE THEOREM AND PAGE. Fix the
      ledger's columns. Record whether smoothness of the auxiliary completion is required -
      a column, not an assumption.
      STAGE 2 (zero compute, HISTORICAL CONTROL). Run the ledger on SIDH/SIKE published
      parameters as reported in the filed sources. Require LIVE, e = 0. If it misses, stop
      and record only that.
      STAGE 3 (zero compute, CONSTRUCTED NULL). Run the ledger on SQIsign-WEAK - the same
      scheme with the published torsion modulus raised until M1 >= 0 at M2 = 0 and M3 = 2.
      Require LIVE, e = 0. Also run the NEGATIVE historical control - a scheme publishing no
      image of any secret map - and require CLOSED with e undefined-by-absence rather than a
      large finite e, so deficit and structural absence are visibly different in the output.
      STAGE 4 (zero compute). Fill the Round-3 cells. Mark every unfillable one
      UNDETERMINED-BY-SPECIFICATION. Compute the MINIMUM of e over items - never a product -
      and apply the decision rule against BOTH baseline tiers with the tier named.
      STAGE 5 (zero compute). Compute dM1/dt and dM2/dt across the declared parameter list
      and run the graded control across the M1 = 0 crossing, requiring e to fall
      monotonically to zero.
      STAGE 6 - ONLY IF SOME CELL IS LIVE, AND ONLY UNDER A NEW CONTRACT: a toy-scale
      end-to-end instantiation at small primes, at the toy tier this question imposes
      without exception. IT IS NOT AUTHORIZED BY THIS CONTRACT.
    instrument: >-
      Documentary. A ledger table with fixed columns - item, M1, M2, M3 with each published
      point tagged deterministic or secret-dependent, e, verdict, baseline tier, source line
      with theorem and page. Every cell traces to a filed KN-LIT entry. No compute is
      performed and no code is executed beyond assembling the table; the run record carries
      the table and the source lines.
    parameters: >-
      c and the embedding condition as extracted at STAGE 1 and recorded prominently, since
      a margin quoted without its c is meaningless and the ledger must be re-runnable when c
      moves. Baseline tiers named in every verdict - p^{1/3+o(1)} time and memory conditional
      on Heuristic 1 of the frozen source, and p^{1/2}(log p)^{O(1)} time at polynomial
      memory unconditionally. Decision thresholds pre-registered: M1 >= 0 escalates;
      -80 < M1 < 0 is a live avenue requiring the priced search to be compared; M1 <= -128 is
      a closed cell with a number. Graded sweep of the published torsion exponent across the
      M1 = 0 crossing with at least three interior points.

  controls:
    - >-
      SQIsign-WEAK, THE PRIMARY NULL, A PRECONDITION AND NOT A ROBUSTNESS CHECK. The
      identical scheme and the identical ledger with the published torsion modulus raised
      until M1 >= 0 at M2 = 0 and M3 = 2. THE LEDGER MUST RETURN LIVE, e = 0, cost poly. This
      is the question's own binding methodological requirement, implemented as a one-number
      substitution: an audit that concludes the attack does not apply without ever having
      been shown to fire when the ingredient is present has demonstrated nothing about
      SQIsign, only about the audit.
    - >-
      SIDH/SIKE HISTORICAL CONTROL. The ledger must return LIVE with e = 0 on published SIDH
      parameters, reproducing the published break. Distinct from SQIsign-WEAK because it is
      not a construction of ours and cannot be tuned to pass.
    - >-
      NEGATIVE HISTORICAL CONTROL. A scheme publishing NO image of any secret map, where
      M3 = 0 and the ledger must return CLOSED with e UNDEFINED-BY-ABSENCE rather than a
      large finite e. The distinction between a deficit and a structurally absent ingredient
      must be visible in the output, or the ledger conflates the two situations its own
      collision analysis identifies.
    - >-
      GRADED CONTROL WITH AT LEAST THREE INTERIOR POINTS. Sweep the published torsion
      exponent across the M1 = 0 crossing and require e to fall MONOTONICALLY to zero. A
      ledger whose e does not move monotonically with the parameter it is a function of is
      mis-implemented.
    - >-
      UNDETERMINED-CELL AUDIT. Count the cells that cannot be filled from filed sources and
      report the count. A ledger with no undetermined cells, from a specification this
      program had not read when the contract was written, would be evidence of guessing
      rather than of completeness.
    - >-
      MINIMUM-NOT-PRODUCT CHECK. The combined price is explicitly computed as a minimum over
      items and the computation is shown, because a ledger that multiplies deficits
      systematically overstates security and that is the single most likely way this
      instrument returns a wrong verdict.

  independent_variables:
    - published item of the Round-3 surface
    - 'scheme arm: Round-3 SQIsign / SQIsign-WEAK / SIDH-SIKE / no-published-image negative control'
    - tweakable parameter t, for the derivative arm
    - published torsion exponent, across the graded sweep
    - 'baseline tier: conditional p^{1/3+o(1)} versus unconditional p^{1/2}(log p)^{O(1)}'
    - the template exponent c

  metrics:
    primary:
      - >-
        M1 in bits per published image of a secret map, computed as c log2(N) - log2(d) from
        values extracted with their source line.
      - >-
        M2 in bits per item, the entropy of the secret degree given all published data, zero
        if the degree is a fixed public parameter.
      - >-
        M3 per item in {0, 1, 2}, with each published point tagged DETERMINISTIC or
        SECRET-DEPENDENT.
      - >-
        Search exponent e per item, and THE MINIMUM OF e OVER ITEMS, computed as a minimum
        with the computation shown.
      - >-
        Ledger verdict per arm in {LIVE, CLOSED_WITH_e, UNDEFINED_BY_ABSENCE,
        UNDETERMINED_BY_SPECIFICATION}, with the baseline TIER named in every comparison.
      - >-
        dM1/dt and dM2/dt per declared tweakable parameter, in bits per unit, computed from
        the one-step propagation rules rather than judged.
      - >-
        Control outcomes - the verdict and e returned on SIDH, on SQIsign-WEAK and on the
        no-published-image negative control.
    secondary:
      - c and the exact embedding condition, with the source, theorem and page cited.
      - Whether smoothness of the auxiliary completion is required, as an extracted column.
      - Counts of CLOSED, LIVE and UNDETERMINED cells, with the denominator.
      - The graded sweep of e across the M1 = 0 crossing with its monotonicity flag.
      - The declared tweakable-parameter list, so its completeness can be attacked.
      - Every cell's source line, so no number is unattributable.

  heuristic_under_test: HEUR-SQI-1
  heuristic_under_test_note: >-
    HEUR-SQI-1 - search-price additivity in the exponent, and specifically the unit-cost
    DETECTABILITY of a wrong guess - is the assumption that turns every deficit into a
    price, so every e in this ledger is conditional on it. IT IS NOT VALIDATED BY THIS
    CONTRACT, which is documentary and zero compute. Its validation route is stated on the
    hypothesis - toy-prime instantiation with a deliberately withheld quantity of e bits for
    e in {4, 8, 12}, measuring invocations to success against the predicted 2^{e-1} and the
    verification check's false-acceptance rate - and requires a SEPARATE contract at toy
    primes. What this contract does instead, and must do, is extract from the filed Round-3
    verification equation WHETHER a wrong candidate is detectable at unit cost at all; if it
    is not, every e is an underestimate and the ledger says so in the same line.

  preregistered_prediction:
    quantity: >-
      The verdict and e on SIDH and on SQIsign-WEAK; the minimum of e over Round-3 published
      items against each named baseline tier; and the sign pattern of dM1/dt and dM2/dt.
    formula: >-
      FORCED - SIDH returns LIVE with e = 0; SQIsign-WEAK returns LIVE with e = 0; the
      no-published-image control returns CLOSED with e undefined-by-absence. NOT PREDICTED -
      any value of M1 for the Round-3 surface, because the specification has not been read
      and predicting it would be fabrication. PRE-REGISTERED INSTEAD is the DECISION RULE:
      an avenue is LIVE iff 2^e * poly is below the applicable baseline tier, named; M1 >= 0
      escalates; -80 < M1 < 0 is live pending the priced comparison; M1 <= -128 is closed
      with a number. A nonzero derivative for any t means PARAMETRIC; all-zero across a
      complete list means STRUCTURAL, and that is the only licence for the word.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-211586 predictions and
      null_object_control blocks, and restated in H-SQISIGN-1d9721 before any run under this
      contract exists. The refusal to predict M1 is itself pre-registered there, for the
      stated reason that predicting an unread specification's numbers would be fabrication.

  scale_relevance:
    tier: toy
    justification: >-
      The ledger is DOCUMENTARY: its numbers are exact integers read from a specification
      and carry no asymptotics, which is precisely why they are worth having. Scale access
      is therefore not a sampling question - the Round-3 parameters themselves are the
      object - but the CLAIM tier remains toy without exception per this question's ceiling,
      because every technical statement about SQIsign here is unverified until the reading
      gate completes and because the instrument has no attack behaviour to demonstrate at
      any scale. THE ONE TRANSFER ASSUMPTION, stated: that the template's condition as
      recorded in the filed sources is the condition that governs applicability. That is
      (K1), it is checkable by reading, and it is the assumption on which the record stands
      or falls.
    correspondence: null

  tail_checks:
    - >-
      Report e per item AND the minimum, with the minimum's computation shown, so a reader
      can see it was not a product.
    - >-
      Report the baseline TIER in the same line as every verdict; a comparison against the
      older tier when the conditional tier applies mis-ranks the cell.
    - >-
      Report c prominently at the head of the table, since a future move in c rescales every
      M1 and a margin quoted without it is meaningless.
    - >-
      Report the declared tweakable-parameter list in full, so a reviewer can show it
      incomplete and thereby revert a STRUCTURAL verdict to unverified.
    - >-
      Report the undetermined count with its denominator, since an incomplete minimum over
      items is not a minimum over items.

  replication:
    seeds: []
    seeds_note: >-
      No seeds. Every stage is documentary and deterministic; there is no stochastic element
      to replicate. Replication here means INDEPENDENT RE-EXTRACTION.
    independent_instances: 2
    repeat_count_per_cell: 2
    note: >-
      Each Round-3 cell is extracted TWICE by independent passes over the filed sources, and
      a disagreement between passes makes the cell UNDETERMINED until reconciled. That is the
      only replication a documentary instrument admits, and it is required because a
      single-pass reading is exactly the basis this program does not accept for a claim of
      this shape.

  budget:
    wall_clock_seconds: 600
    wall_clock_seconds_note: >-
      Per run, and generous for a zero-compute documentary task. total_cpu_hours bounds the
      whole contract.
    total_cpu_hours: 0.2
    memory_gb: 2
    maximum_runs: 10

  stopping_rules:
    - >-
      STOP AT STAGE 0 if the Round-3 package and the primary design papers cannot be filed as
      KN-LIT. The ledger stays empty and that is the complete, honest result.
    - >-
      STOP AT STAGE 2 if the ledger misses LIVE, e = 0 on SIDH, and record only that.
    - >-
      STOP AT STAGE 3 if the ledger fails to fire on SQIsign-WEAK. No negative conclusion
      about the real scheme may be recorded at all.
    - >-
      ESCALATION STOP. If any published item shows M1 >= 0 with M2 = 0 and M3 = 2, or the
      minimum e falls below the applicable baseline exponent, STOP. Treat it as an extraction
      error until independently confirmed and escalate immediately to an independent
      review-breakthrough session per AGENTS.md rule 12. DO NOT REPORT IT FROM THIS RUN.
    - >-
      Stop at maximum_runs or total_cpu_hours. Budget exhaustion is a stop, never a negative
      result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      A run in which any cell was filled from memory, from a search snippet, or from a source
      not filed as KN-LIT is invalid_measurement. This is the question's own binding
      constraint.
    - >-
      A run in which the SQIsign-WEAK null or the SIDH control was not executed is
      invalid_measurement; no negative about the real scheme is interpretable without both.
    - >-
      A run whose combined price MULTIPLIES deficits rather than taking a minimum is
      invalid_measurement, because it systematically overstates security.
    - >-
      A run reporting any verdict without naming the baseline tier is invalid_measurement.
    - >-
      A run reporting a margin without recording its c is invalid_measurement, because the
      number is not re-runnable when c moves.
    - >-
      A run in which the two independent extraction passes disagreed and the disagreement was
      resolved by choosing a value rather than marking the cell UNDETERMINED is
      invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) STAGE 0 completed -
    the required sources are filed as KN-LIT and c is extracted with theorem and page. (2)
    The ledger returns LIVE with e = 0 on SIDH/SIKE published parameters. (3) The ledger
    returns LIVE with e = 0 on SQIsign-WEAK, and CLOSED with e undefined-by-absence on the
    no-published-image negative control. (4) e falls monotonically to zero across the graded
    sweep of the M1 = 0 crossing. (5) Every Round-3 cell carries M1, M2, M3, an e or an
    explicit UNDETERMINED-BY-SPECIFICATION, a source line, and two agreeing extraction
    passes; the minimum over items is computed as a minimum and compared against BOTH named
    tiers; and dM1/dt, dM2/dt are computed over the declared parameter list. A run meeting
    (1) to (5) is VALID and the ledger is the deliverable. A run failing (2) or (3) yields
    NOTHING about SQIsign and reports only the control miss.

  falsification_criterion:
    - >-
      The ledger failing LIVE, e = 0 on SIDH falsifies the INSTRUMENT; it does not reproduce
      a published break and nothing else is recorded.
    - >-
      The ledger failing to fire on SQIsign-WEAK falsifies the instrument against this
      question's own binding constraint; no negative about the real scheme may be recorded.
    - >-
      The filed primary sources showing the template's applicability is NOT governed by a
      quantitative inequality falsifies (K1); the margin framing dies for the
      non-quantitative conditions and the honest deliverable is the list of which conditions
      are quantitative.
    - >-
      e failing to fall monotonically across the graded sweep falsifies the implementation.
    - >-
      The negative historical control returning a large finite e rather than
      undefined-by-absence falsifies the ledger's ability to distinguish a deficit from a
      structurally absent ingredient - the second collision its own analysis names.
    - >-
      All derivatives zero across a parameter list a reviewer shows to be incomplete
      falsifies any STRUCTURAL verdict, which reverts to unverified.
    - >-
      Any published item with M1 >= 0, M2 = 0 and M3 = 2 falsifies the expected reading
      entirely and triggers mandatory escalation rather than a report.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - the KN-LIT entry ids for the Round-3 package and the primary design papers, filed at STAGE 0
    - c and the exact embedding condition, with source, theorem and page cited
    - the ledger table with every cell's value, verdict, baseline tier and SOURCE LINE
    - both independent extraction passes per cell, with disagreements marked UNDETERMINED
    - the SIDH, SQIsign-WEAK and no-published-image control rows, in the same table
    - the graded sweep of e across the M1 = 0 crossing with its monotonicity flag
    - the dM1/dt and dM2/dt table with the declared tweakable-parameter list in full
    - the counts of CLOSED, LIVE and UNDETERMINED cells with the denominator

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and NOT
      approved; approved_by is null and execution_authorized is false. Approval is the USER's
      gate because it authorizes execution and spends compute.
    - >-
      STAGE 0 IS A HARD GATE IMPOSED BY THE QUESTION RECORD ITSELF. No experiment may be
      designed or run against the Round-3 surface until the submission package and the
      primary higher-dimensional-design papers are filed as KN-LIT entries. Approving this
      contract does not waive that gate.
    - >-
      STAGE 6 - any toy-prime end-to-end instantiation of the template, and any validation of
      HEUR-SQI-1 - IS NOT AUTHORIZED HERE and requires its own contract at toy tier.
    - >-
      The escalation stop is binding. A cell coming out LIVE is escalated to an independent
      review-breakthrough session and is never published from a single session's reading.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-211586
    authored_at: '2026-08-25'
    note: >-
      The three margins, the pricing rule, the minimum-over-items quantifier, the derivative
      column, the SQIsign-WEAK and SIDH controls, the negative historical control, the graded
      sweep and the undetermined-cell audit are all taken from the parent proposal's claim,
      mechanism, null_object_control, predictions and minimal_test blocks. THE TWO INDEPENDENT
      EXTRACTION PASSES and the explicit invalidation on multiplying deficits are this
      contract's additions. Budgets come from the parent's estimated_cost (implementation low,
      compute low) and are nominal because every stage is zero compute. No measurement,
      timing, run or citation is invented, and every technical statement about SQIsign is
      carried at provenance recalled and unverified.

  derivation_gaps:
    - >-
      c AND THE EXACT EMBEDDING CONDITION ARE NOT KNOWN HERE. They are the ledger's first
      extraction task. Until they are extracted, every column heading in this contract is a
      placeholder and no margin exists.
    - >-
      WHETHER A WRONG CANDIDATE IS DETECTABLE AT UNIT COST is a property of the Round-3
      verification equation and is the non-rigorous half of HEUR-SQI-1. If it is not, every e
      is an underestimate. This contract can only extract the answer; it cannot measure it,
      and the measurement needs a separate toy-prime contract.
    - >-
      The tweakable-parameter list is declared by the executor from the filed specification
      and its completeness cannot be established from inside the run. A STRUCTURAL verdict is
      therefore always provisional against a reviewer who extends the list, and the contract
      says so rather than letting the word harden.
    - >-
      The parent proposal's nearest filed record, IDEA-20260815-af4007, was known to its
      author only from a one-line digest summary and was not opened. A reviewer must open it
      before crediting the distinction this contract claims over prior binary audits.
