<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <rect width="960" height="300" fill="#fbfaf7"/>
  <style>
    .box { fill:#fff; stroke:#263238; stroke-width:2; rx:12; }
    .title { font:700 18px sans-serif; fill:#17212b; }
    .body { font:15px sans-serif; fill:#263238; }
    .pass { fill:#eff8f1; stroke:#2e7d32; stroke-width:2; rx:12; }
    .arrow { stroke:#455a64; stroke-width:3; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#455a64"/>
    </marker>
  </defs>
  <text x="36" y="34" class="title">RUN-TORS-e2dcdc — factor-count comparison</text>
  <rect x="36" y="86" width="220" height="126" class="box"/>
  <text x="58" y="119" class="title">Frozen inputs</text>
  <text x="58" y="149" class="body">p = 23, ell = 7</text>
  <text x="58" y="174" class="body">curve + nonsquare twist</text>
  <text x="58" y="199" class="body">multiplicity-weighted I(C)</text>
  <line x1="256" y1="149" x2="350" y2="149" class="arrow"/>
  <rect x="350" y="86" width="248" height="126" class="box"/>
  <text x="372" y="119" class="title">Measured outputs</text>
  <text x="372" y="149" class="body">I(E) = 10</text>
  <text x="372" y="174" class="body">I(E^c) = 10</text>
  <text x="372" y="199" class="body">gap = 0</text>
  <line x1="598" y1="149" x2="692" y2="149" class="arrow"/>
  <rect x="692" y="86" width="232" height="126" class="pass"/>
  <text x="714" y="119" class="title">Validated reading</text>
  <text x="714" y="149" class="body">counts_agree</text>
  <text x="714" y="174" class="body">11/11 controls true</text>
  <text x="714" y="199" class="body">checker returncode 0</text>
  <text x="36" y="260" class="body">Secondary: p = 29 gap 0; null range 2–8; secondary does not choose the row</text>
</svg>
