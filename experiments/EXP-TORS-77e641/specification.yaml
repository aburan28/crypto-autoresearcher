# =============================================================================
# EXP-TORS-77e641 — version 1, approved by DEC-20261006-42d750. Frozen
# factor-count comparison for IDEA-20261006-923439. Success is the
# idea's prediction: the absolute difference of I(E) and I(E^c) is at
# least 1. The concrete negative is that the two counts are equal after
# the instrument checks pass. This design session built psi_7 far enough
# to see degree 24 and leading coefficient 7 on y^2=x^3+x+1 over F_23.
# It did not factor the polynomial and did not record the gap. No
# discrete logarithm is authorized. Source idea bytes are blob
# 6907a3dcb59bdef251c639d5d789542ad0396b12.
# =============================================================================
experiment:
  id: EXP-TORS-77e641
  hypothesis_id: H-TORS-550da9
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  source_idea: IDEA-20261006-923439
  version: 1
  title: >-
    Multiplicity-weighted factor counts of psi_7 for y^2=x^3+x+1 over
    F_23 and its quadratic twist
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  designed_at: '2026-10-06'
  frozen: true
  execution_authorized: true
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-42d750
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null and
      the trial plan names a driver. Approval does not assert that the
      factor counts differ, does not assert that they agree, and does
      not assert that an exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only at p=23, A=1, B=1, ell=7, with c the smallest nonsquare
      in F_23 and the twist model y^2=x^3+c^2 x+c^3. Count irreducible
      factors with multiplicity. The c=1 model, the degrees, the
      discriminants, and the trace negation are instrument checks.
      Repeat the twist comparison at p=29 and draw 30 uniform random
      monic degree-24 polynomials over F_23 with seed 20261006. Those
      two secondary numbers are written beside the gap and do not
      choose the reading row. Do not search for a discrete logarithm
      and do not add a prime to the claim.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether |I(E)-I(E^c)| is at least 1. The concrete negative
    is that the instrument checks pass and the two counts are equal.
    No faster discrete-logarithm algorithm is in scope.

  inputs:
    curve: >-
      p=23, A=1, B=1, model y^2=x^3+x+1. The discriminant
      4A^3+27B^2=31 is 8 mod 23. A zero discriminant is
      instrument_failure.
    twist: >-
      c is the smallest element of F_23 that is not a square, found by
      squaring every field element. The twist is y^2=x^3+c^2 x+c^3.
      Using a square repeats the c=1 control and does not score the
      claim.
    c1_control: >-
      The model with c=1 is y^2=x^3+x+1. Its factor count must equal
      I(E). Inequality is instrument_failure.
    division_polynomial: >-
      The monic 7-division polynomial is psi_7 made monic. The
      recurrence is psi_5=psi_4 psi_2^3-psi_1 psi_3^3 and
      psi_7=psi_5 psi_3^3-psi_2 psi_4^3, with the base cases in
      experiments/EXP-ECTD-001/driver/divpoly.py, reduced by the curve
      equation. Each polynomial is built twice. A coefficient mismatch
      is instrument_failure. Degree other than 24 is instrument_failure.
      The driver is experiments/EXP-TORS-77e641/implementation/run.py.
      The checker is experiments/EXP-TORS-77e641/implementation/check.py.
    factor_count: >-
      I(C) is the sum of the multiplicities of the monic irreducible
      factors of that polynomial in F_23[x]. A square-free count that
      drops multiplicity is a different integer and does not score the
      claim.
    trace: >-
      a_p is p+1-N, with N counted by evaluating the right-hand side
      at every field element and applying Euler's criterion, plus the
      point at infinity. The twist must return the negation of a_p(E).
      Any other relation is instrument_failure.
    secondary: >-
      At p=29, with the same coefficient pair and ell=7, record the
      analogous gap. Draw 30 uniform random monic degree-24 polynomials
      over F_23 from random.Random(20261006), record the minimum and
      maximum of their multiplicity-weighted factor counts, and record
      whether I(E) and I(E^c) lie in that closed range. Neither number
      chooses the reading row.

  controls:
    - id: square-control
      statement: >-
        c=1 must give a factor count equal to I(E). Inequality
        invalidates the instrument.
    - id: degree-control
      statement: >-
        Both claim polynomials and the c=1 polynomial have degree 24.
        Otherwise the polynomial is wrong and the claim is not scored.
    - id: twist-trace-control
      statement: >-
        a_p of the twist equals the negation of a_p(E). A different
        relation means the model is not the quadratic twist.
    - id: nonsquare-control
      statement: >-
        c is the smallest nonsquare, found by enumerating squares.
        A square does not score the claim.
    - id: rebuild-control
      statement: >-
        Building each polynomial a second time reproduces the
        coefficient list.

  independent_variables:
    - whether the model is E, the nonsquare twist, or the c=1 model
    - the prime used for the secondary repeat, which does not choose the row

  metrics:
    primary:
      - id: gap
        statement: >-
          The absolute difference of I(E) and I(E^c). The idea's
          prediction is that the difference is at least 1. The concrete
          negative is that the difference is 0 while the instrument
          checks pass.
    secondary:
      - id: I_E
        statement: the multiplicity-weighted factor count of the monic psi_7 of E
      - id: I_twist
        statement: the same count for the nonsquare twist
      - id: I_c1
        statement: the same count for the c=1 model
      - id: traces
        statement: a_p(E) and a_p of the twist
      - id: p29_gap
        statement: >-
          the same absolute difference at p=29, or unavailable if that
          build fails. This metric does not choose the reading row.
      - id: null_range
        statement: >-
          the minimum and maximum factor counts among 30 random monic
          degree-24 polynomials over F_23. This metric does not choose
          the reading row.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the gap at p=23. The p=29 gap and the random range are
    the second comparison named in the source idea and are written
    into the artifact. They do not choose the reading row. Do not
    relabel an instrument failure as a zero gap.

  preregistered_prediction:
    quantity: >-
      The absolute difference of I(E) and I(E^c), where c is the
      smallest nonsquare in F_23 and I counts irreducible factors of
      the monic 7-division polynomial with multiplicity.
    formula: >-
      The absolute difference is at least 1. The concrete negative is
      that the instrument checks pass and the difference is 0. A zero
      is not a confirmation. Source idea IDEA-20261006-923439. Neither
      polynomial was factored before this formula was frozen.
    source: >-
      IDEA-20261006-923439, whose prediction is a difference of at
      least 1. KR-IC-5931ee, KR-IC-5a43e5, KR-IC-955fd6, KR-IC-9e610d,
      KR-RHO-13bf67, KR-RHO-755e35, and KR-RHO-53c89f were opened in
      this session and do not state this gap.

  scale_relevance:
    tier: toy
    justification: >-
      p=23 is inside the question's toy window and far below a
      cryptographic prime. No transfer to a larger field is assumed.
      The sample is one twist pair, not a tail draw. The minimum
      effect is the idea's own gap of one. The p=29 repeat is a
      second toy prime and is not a transfer argument.
    correspondence: >-
      Direct construction of psi_7 and direct factorization over
      F_23. No Deuring correspondence is used.

  tail_checks:
    - >-
      A gap of 1 meets the prediction. A gap of 0 is the negative.
      No third band is introduced after the count is seen.
    - >-
      The random-polynomial minimum and maximum are reported. A claim
      gap that sits inside that range is still scored from the gap
      itself. The range does not move the threshold.

  replication:
    seeds:
      - EXP-TORS-77e641|claim|deterministic
      - '20261006'
    independent_instances: 1
    note: >-
      One is the number of twist pairs scored at p=23. The claim
      computation is deterministic. The second build of each
      polynomial is the replication of the coefficient list. The seed
      20261006 draws only the 30 null polynomials.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the claim pair, the c=1 model, both
      builds, the trace check, the p=29 repeat, and the 30 null
      polynomials. Wall-clock and CPU figures are advisory and null.
      The 1 GB memory figure is machine protection for the coefficient
      lists. A watchdog expiry is failed_infrastructure, not a value
      of the gap.

  stopping_rules:
    - Stop after a reading row is named.
    - Do not change p=23 and do not replace the threshold 1 after seeing a count.
    - Do not let the p=29 gap or the null range choose the row.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A zero discriminant, a degree other than 24, a c=1 mismatch, a trace that does not negate, a square used as c, or a rebuild mismatch voids the run.
    - Dropping multiplicity voids the run.
    - Using the p=29 gap or the null range to choose the reading row voids the run.
    - Scoring any curve other than the frozen pair voids the run.

  success_criterion: >-
    The instrument checks pass and the absolute difference of I(E) and
    I(E^c) is at least 1. This is the prediction of
    IDEA-20261006-923439. It is reachable as a failure when the
    instrument checks pass and the two counts are equal.

  falsification_criterion: >-
    The instrument checks pass and I(E) equals I(E^c). That equality
    is the concrete negative named with the source idea. A difference
    of at least 1 is the prediction and is not this negative. A degree
    failure, a zero discriminant, a c=1 mismatch, a trace mismatch,
    and a timeout are not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that this one twist pair has
      a factor-count gap of at least 1. The generic exponent stays
      1/2. No knowledge entry is promoted from this design record, and
      no discrete logarithm is claimed.
    on_negative: >-
      A later evidence review may record that this one twist pair has
      equal factor counts, so the E-scale reading holds for the pair
      and the existence claim is falsified on this pair only. The
      generic exponent stays 1/2. The two outcomes name different
      integers and different readings.

  required_artifacts:
    - experiments/EXP-TORS-77e641/runs/RUN-*/manifest.yaml
    - experiments/EXP-TORS-77e641/runs/RUN-*/raw-result.json
    - experiments/EXP-TORS-77e641/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        a discriminant is 0, a claim polynomial has degree other than
        24, c is a square or is not the smallest nonsquare, the c=1
        count differs from I(E), the twist trace is not the negation,
        or a rebuild disagrees
    - id: counts_agree
      when: the instrument checks pass and the absolute difference is 0
    - id: counts_differ
      when: the instrument checks pass and the absolute difference is at least 1
  reading_rule: >-
    Name exactly one row. counts_differ is the only success row.
    counts_agree is the concrete negative. instrument_failure is not
    a value of the gap. Record both counts, the gap, the c=1 count,
    both traces, the integer c, the p=29 gap or unavailable, the null
    minimum and maximum, and attack_claimed false beside the row.
    Those fields do not change the row.
