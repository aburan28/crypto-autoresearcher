experiment:
  id: EXP-ICEX-502d4c
  hypothesis_id: H-ICEX-cb494a
  derived_from_idea: IDEA-20260809-5797e8
  question_id: RQ-ROS-595c15
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    A VERIFICATION PROTOCOL FOR THE TIGHTNESS TABLE- what artifact is checked,
    against what reference, and what result fails it - with two SEALED PLANTED
    PROOFS of known loss exponent 0 and 2 that a blinded extractor must separate,
    independent double extraction with a reported disagreement rate, an uncited
    cell defined as undetermined, and a blocking KN-LIT acquisition gate that
    leaves the whole table undetermined if it is not discharged
  status: draft
  objective: >-
    (A) WHAT IS CHECKED. For each named deployed two-round Schnorr-type protocol,
    the ARTIFACT is its filed security proof; the CHECK extracts three fields - the
    assumption class, the loss exponent in the concurrent-session count, and the
    loss exponent in the signing-query count - each with the specific citing
    passage; and the OUTPUT is an effective-bits-versus-concurrency curve at a
    declared group size, with the loss function printed beside it so a reader can
    recompute it.
    (B) AGAINST WHAT REFERENCE. Against the filed proof itself, cited by passage.
    An uncited cell is undetermined BY DEFINITION, because this experiment is a
    claim about documents and about nothing else.
    (C) WHAT RESULT FAILS IT, AND WHY THE SOURCE HAD NO SUCH RESULT. The source
    proposal controls are -cite the passage- and -extract at least one proof twice-.
    Both measure reliability; NEITHER CAN FAIL IN A WAY THAT DEMONSTRATES THE
    EXTRACTOR CAN TELL A TIGHT PROOF FROM A LOOSE ONE, because a citation to a real
    passage can accompany a wrong reading of it and two readers can share a
    misunderstanding. THIS CONTRACT ADDS A PLANTED DEFECT OF KNOWN SIZE- two
    SYNTHETIC proof texts, one TIGHT with session-loss exponent 0 and one with a
    KNOWN QUADRATIC session loss, exponent 2, written by an agent that does not
    perform the extraction, inserted into the corpus indistinguishably in register
    and length, with their true exponents SEALED until after extraction. THE
    EXTRACTOR MUST RETURN 0 AND 2. A DEMONSTRATED DYNAMIC RANGE OF TWO EXPONENT
    UNITS. FAILURE VOIDS EVERY CELL.
    (D) THE BLOCKING PRECONDITION. RQ-ROS-595c15 states VERBATIM that no
    certificate is recorded before the ROS reference and the specification of each
    protocol under test are filed as KN-LIT entries. The source refs are RECALLED
    and unread by any agent in this program. STAGE 0 IS ACQUISITION; IF IT FAILS,
    EVERY CELL IS undetermined AND THE DELIVERABLE IS THE UNDETERMINED TABLE WITH
    THE MISSING SOURCES NAMED. That is a legitimate result and not a failure.
    (E) WHAT IS NOT DONE. NO ROS SOLVER IS IMPLEMENTED, RUN OR TIMED. NO PROTOCOL
    IS EXECUTED. NO FORGERY IS ATTEMPTED. No third-party wallet, service, node,
    chain or repository is probed. The measured ROS cost curve that
    RQ-ROS-595c15 also asks for is a DIFFERENT deliverable this contract does not
    supply.
  inputs:
    cost_unit: >-
      THERE IS NO COMPUTATIONAL COST UNIT IN THIS EXPERIMENT. LOSS EXPONENTS ARE
      DIMENSIONLESS. EFFECTIVE BITS IS THE BASE-2 LOGARITHM OF A DIMENSIONLESS
      SECURITY RATIO at a declared group size, and the instantiation that produced
      it is printed on every row. NO WALL-CLOCK, OPERATION-COUNT OR MEMORY QUANTITY
      APPEARS ANYWHERE, and none may be introduced.
    unit_discipline: >-
      BINDING. Every value carries a tag in {exponent, bits, count, session_count,
      passage_id, class_code}. Cross-tag arithmetic requires a named recorded
      conversion. The effective-bits curve is bits against a SESSION COUNT and is
      never collapsed to a scalar.
    extraction_form: >-
      A STRUCTURED FORM, frozen before any proof is read, with exactly these
      fields per proof- protocol name; document identifier and its KN-LIT entry;
      assumption class from a CLOSED declared vocabulary; session-count loss
      exponent; signing-query loss exponent; the citing passage identifier for each
      of the three; and an explicit UNDETERMINED marker with a reason for any field
      that cannot be extracted. A form with a filled value and no passage
      identifier is INVALID and the harness refuses to accept it.
    blinding: >-
      BLOCKING. The extractors do not know which corpus entries are the planted
      synthetic proofs. The planting agent does not perform any extraction. The true
      planted exponents are SEALED - recorded in a separate file whose hash is
      published before extraction and whose contents are opened only after every
      form is submitted.
    frozen_before_execution: >-
      The protocol list, the extraction form and its closed assumption-class
      vocabulary, the declared group size, the concurrency range 1 to 2^20, the
      10-bit materiality threshold, the number of independent extractions, the
      third-read tie-break rule, and the sealed planted exponents. None may change
      after any extraction begins.
    procedure: >-
      STAGE 0 (ACQUISITION GATE, BLOCKING). File the ROS reference and the
      specification and security proof of every protocol under test as KN-LIT
      entries, each read at source by the agent that files it. IF THIS FAILS FOR A
      PROTOCOL, THAT PROTOCOL ROW IS undetermined WITH ITS MISSING SOURCE NAMED,
      and no cell for it may be filled. If it fails for ALL protocols the run
      delivers only the undetermined table and the planted control.
      STAGE 1 (planting, by a non-extracting agent). Write two synthetic proof
      texts of comparable length and register- one TIGHT, session-loss exponent 0;
      one with a KNOWN QUADRATIC session loss, exponent 2. Seal their true
      exponents and publish the seal hash. Insert both into the extraction corpus.
      STAGE 2 (blinded extraction). Each extractor fills the frozen form for every
      corpus entry, real and planted alike, without knowing which is which. At
      least two INDEPENDENT extractors cover at least one real proof in common.
      STAGE 3 (unseal and gate). Open the seal. THE EXTRACTOR MUST HAVE RETURNED
      EXPONENT 0 ON THE TIGHT PLANTED PROOF AND EXPONENT 2 ON THE QUADRATIC ONE. A
      failure VOIDS EVERY CELL and the table is not published in any form.
      STAGE 4 (reliability). Compare the independent extractions field by field.
      Disagreements are resolved by a THIRD independent read before recording, and
      the DISAGREEMENT RATE is reported.
      STAGE 5 (instantiation). Instantiate each extracted loss function at the
      declared group size over the concurrency range and emit the
      effective-bits-versus-concurrency curve per protocol, with the loss function
      printed beside it.
      STAGE 6 (report). Emit the tightness table with every cell either cited or
      marked undetermined with a reason, the planted-control outcome, the
      disagreement rate, the curves, and the acquisition-gate record.
    mechanism: >-
      STEP 1. The extraction form is the instrument and it is frozen before any
      document is opened, so a field cannot be invented to fit what a proof happens
      to say.
      STEP 2. The assumption-class vocabulary is CLOSED. A proof that does not fit
      any declared class is recorded as undetermined with the reason, never as a
      new class invented during extraction.
      STEP 3. The planted proofs pass through the identical form and the identical
      extractors. If the instrument is only reliable on synthetic text that is
      itself a finding, and is reported.
      STEP 4. Every row is reported as (protocol, document, KN-LIT entry,
      assumption class, session-loss exponent, query-loss exponent, three passage
      identifiers, extractor identity, undetermined markers and reasons).
      STEP 5. The effective-bits evaluator prints the loss function it instantiated
      on every curve, so the curve is recomputable from the table alone.
    instrument: >-
      A structured extraction form and an arithmetic evaluator. NO CRYPTOGRAPHIC
      CODE IS EXECUTED, no key is generated, no session is run and no forgery is
      attempted. Compute is negligible; the cost of this experiment is ACQUISITION
      AND READING.
  controls:
    - >-
      CONTROL 1, SEALED PLANTED PROOFS OF KNOWN LOSS EXPONENT (blocking, and the
      entire validity argument). One tight synthetic proof with session-loss
      exponent 0 and one with a known quadratic session loss, exponent 2, written by
      a non-extracting agent, inserted indistinguishably, exponents sealed until
      after extraction. REQUIRED MAGNITUDE- the extractor returns EXACTLY 0 and
      EXACTLY 2, a demonstrated range of two exponent units. AN EXTRACTOR THAT
      RETURNS THE SAME VALUE ON BOTH, OR MISSES EITHER, IS VOID AND NO CELL IT
      PRODUCED MAY BE QUOTED.
    - >-
      CONTROL 2, INDEPENDENT DOUBLE EXTRACTION (blocking). At least one real proof
      extracted twice independently, with agreement required on ALL THREE fields.
      Disagreements resolved by a third independent read BEFORE recording, and the
      disagreement rate reported rather than hidden. THIS MEASURES RELIABILITY AND
      NOT CORRECTNESS, and the report says so.
    - >-
      CONTROL 3, PASSAGE CITATION (blocking per cell). Every filled cell cites its
      specific passage. A filled cell with no passage identifier is INVALID; an
      uncited cell is undetermined BY DEFINITION.
    - >-
      CONTROL 4, CLOSED ASSUMPTION VOCABULARY. A proof that fits no declared class
      is undetermined with a reason, never a class invented mid-extraction.
    - >-
      CONTROL 5, ACQUISITION GATE. Every cell is undetermined until the KN-LIT
      entries for that protocol exist. An undetermined cell is reported as
      undetermined with the missing source named, never as an estimate.
    - >-
      CONTROL 6, BLINDING AUDIT. The run record states which agent planted, which
      extracted, and confirms the planting agent performed no extraction. A
      violation voids the planted control and therefore the whole table.
  independent_variables:
    - protocol, at least three deployed two-round Schnorr-type protocols
    - corpus entry type in {real filed proof, planted tight, planted quadratic}
    - extractor identity, at least two independent extractors on at least one common proof
    - concurrent session count, over the declared range for the instantiation
  metrics:
    primary:
      - >-
        extracted session-count loss exponent per proof, with its citing passage
        (exponent)
      - >-
        planted-control outcome- exponent returned on the tight and the quadratic
        planted proofs (exponent)
      - >-
        effective bits versus concurrent session count per protocol at the declared
        group size (bits against session_count)
    secondary:
      - extracted assumption class per proof, from the closed vocabulary (class_code)
      - extracted signing-query loss exponent per proof (exponent)
      - count of protocols resting on an idealized model, with citations (count)
      - independent-extraction disagreement rate, per field (dimensionless)
      - undetermined-cell count and the reason for each (count)
      - acquisition-gate record- which KN-LIT entries exist and which do not
  heuristic_under_test: HEUR-TIGHT-1
  preregistered_prediction:
    quantity: >-
      The session-count loss exponent extracted from each filed proof, and the
      effective-bits curve obtained by instantiating that loss at the declared group
      size over the concurrency range.
    formula: >-
      Planted control- exponent EXACTLY 0 on the tight synthetic proof and EXACTLY
      2 on the quadratic one. Real proofs- at least one protocol losing at least 10
      BITS between 1 session and 2^20 concurrent sessions, and more than one
      protocol resting on an idealized model. No degradation anywhere is a clean
      result and is recorded plainly.
    source: >-
      RQ-ROS-595c15, read in full for this contract, which names the
      assumption-surface table as a target and imposes the KN-LIT precondition and
      the claim ceiling. The proofs themselves are RECALLED AND UNREAD by any agent
      in this program and are subject to the stage 0 gate; no numeric prediction is
      taken from them.
  scale_relevance:
    tier: null
    justification: >-
      THIS EXPERIMENT HAS NO COMPUTATIONAL SCALE. It reads documents and evaluates
      arithmetic. The declared group size is a PARAMETER OF AN INSTANTIATION, not a
      tested scale, and no computation is performed at it. TRANSFER ASSUMPTION,
      STATED- that an extractor which recovers the known exponents of two synthetic
      proofs recovers the exponents of real proofs with comparable reliability. The
      planted control bounds that from below; NOTHING BOUNDS IT FROM ABOVE and the
      contract says so rather than implying the control settles it.
    correspondence: null
  tail_checks:
    - >-
      The effective-bits curve is reported at BOTH ends of the concurrency range
      and at intermediate points, not summarised by a single loss figure, because
      the whole question is a dependence on concurrency.
    - >-
      The undetermined-cell count is reported as a fraction of all cells. A table
      with zero undetermined cells and a passing planted control is plausible; a
      table with zero undetermined cells and NO passing planted control is not
      credible and is treated as such.
  replication:
    seeds: >-
      Not applicable- there is no random process. REPLICATION HERE IS INDEPENDENT
      RE-EXTRACTION- at least two independent extractors on at least one common real
      proof, with a third read reserved for tie-breaking.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 10
  stopping_rules:
    - >-
      Stage 0 acquisition failure for a protocol marks that protocol row
      undetermined and the run continues on the remaining protocols and the planted
      control. Failure for ALL protocols leaves the undetermined table and the
      planted control as the whole deliverable.
    - >-
      Stage 3 planted-control failure HALTS the run and the table is not published
      in any form.
    - >-
      A proof that cannot be extracted within its declared reading budget is marked
      undetermined with the reason, never estimated.
    - >-
      Total wall-clock at the declared cap; remaining entries recorded as NOT
      INSPECTED rather than implied clean.
  invalidation_rules:
    - >-
      A filled cell with no citing passage identifier invalidates the cell.
    - >-
      An assumption class outside the closed declared vocabulary invalidates the
      cell.
    - >-
      The planting agent performing any extraction voids the planted control and
      therefore the whole table.
    - >-
      Unsealing the planted exponents before every form is submitted voids the
      planted control.
    - >-
      An effective-bits row emitted without the loss function it instantiated
      invalidates the row.
    - >-
      Any execution of protocol code, key generation or forgery attempt is OUT OF
      SCOPE for this contract and invalidates the run.
  success_criterion: >-
    The planted control separates 0 from 2; every filled cell carries its citing
    passage; the independent extractions agree on all three fields or are resolved
    by a third read with the disagreement rate reported; and the tightness table and
    the effective-bits curves are emitted with every undetermined cell marked and
    explained. If the acquisition gate fails, success is the undetermined table with
    the missing sources named and the planted control passing.
  falsification_criterion: >-
    The extractor returning the same loss exponent on the tight and the
    quadratic-loss planted proofs VOIDS the instrument and the table may not be
    published. Systematic disagreement between independent extractions means the
    reading procedure is unreliable and the table is withdrawn. Reductions that
    cannot be extracted in enough detail produce undetermined cells RATHER THAN
    ESTIMATES, which is the correct behaviour. No protocol showing material
    degradation is a clean result reported plainly with its detectable effect size.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen extraction form with its closed assumption-class vocabulary
    - the acquisition-gate record listing every KN-LIT entry filed and every one missing
    - the sealed planted-exponent file, its published hash, and the unsealing record
    - the planting record naming the planting agent and confirming it performed no extraction
    - every completed extraction form, per proof per extractor, with passage identifiers
    - the planted-control outcome with the exponents returned and the exponents sealed
    - the independent-extraction comparison and the disagreement rate per field
    - the third-read tie-break records, where used
    - the tightness table with every undetermined cell marked and its reason given
    - the effective-bits-versus-concurrency curve per protocol, each printed beside the loss function it instantiated
    - stdout, stderr, timestamps
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      A LOOSE REDUCTION IS NOT AN ATTACK AND NO ROW MAY IMPLY ONE. The table
      describes what each proof GUARANTEES, not what an adversary can do. Under
      RQ-ROS-595c15 no claim that a standardized protocol is broken may be recorded.
    - >-
      NO CELL MAY BE FILLED BEFORE THE ROS REFERENCE AND THE PROTOCOL SPECIFICATION
      ARE FILED AS KN-LIT ENTRIES. That is the RQ verbatim constraint and it binds
      this contract absolutely.
    - >-
      THE OBJECT IS DOCUMENTS. NO CURVE, GROUP ELEMENT OR GROUP OPERATION IS
      COMPUTED, no protocol is executed and no forgery is attempted. Recorded as a
      PROOF rather than discharged by a curve-free arm, because a curve-free version
      of this experiment would be the identical experiment. PRE-DECLARED- NO OUTCOME
      IS AN ELLIPTIC-CURVE STATEMENT AND NO OUTCOME IS A STATEMENT ABOUT ANY
      ADVERSARY CAPABILITY.
    - >-
      THE PLANTED CONTROL BOUNDS THE EXTRACTOR RELIABILITY FROM BELOW ONLY. Success
      on synthetic text does not establish that a reading of a real proof is
      correct, and two independent extractors can share a misunderstanding that no
      control here detects. That gap is stated rather than papered over.
    - >-
      AN UNCITED CELL IS undetermined BY DEFINITION. A table with no undetermined
      cells and no passing planted control is not credible.
    - >-
      THE EFFECTIVE-BITS CURVE IS AN EVALUATION OF AN EXTRACTED LOSS FUNCTION, NOT A
      MEASURED COST. The measured ROS cost curve RQ-ROS-595c15 also asks for is a
      different deliverable this contract does not supply and must not be read as
      supplying.
    - >-
      claim_tier is bounded by RQ-ROS-595c15 claim_tier_ceiling. No attack, no
      exponent moved, sota_delta zero. Comparative tightness analysis is standard
      practice and no methodological novelty is claimed.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
