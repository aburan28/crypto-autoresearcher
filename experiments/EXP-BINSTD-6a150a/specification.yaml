# =============================================================================
# EXP-BINSTD-6a150a -- VERSION 1 (APPROVED by DEC-20261004-173be8) frozen
# contract for H-BINSTD-ceae35: retrieve ANSI X9.62 / TIER-P params for five
# c2pnb* rows left NOT COMPUTED under IMP-X962; rerun Part-1 k|r-1 census.
# Source: IDEA-20261001-262544 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261004-fbe3cd. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. NO Part-2 ranks. certificate.kind=none.
# Prefer patterns from EXP-BINSTD-178742 Part-1 / EV-BINSTD-fba851.
# =============================================================================
experiment:
  id: EXP-BINSTD-6a150a
  hypothesis_id: H-BINSTD-ceae35
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-262544
  goal_id: GOAL-ECDLP2M-001
  prior_experiment: EXP-BINSTD-178742
  prior_evidence: EV-BINSTD-fba851
  version: 1
  title: >-
    Clear IMP-X962: TIER-P retrieval for five c2pnb rows + Part-1 k|r-1 census
  status: approved
  approved_by: DEC-20261004-173be8
  approved_at: '2026-10-04'
  frozen: true
  frozen_at: '2026-10-04'
  execution_authorized: true
  execution_authorized_stages: [0, 1, 2]
  execution_authorized_note: >-
    Stages 0-2 authorized by DEC-20261004-173be8 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No Part-2 ranks. No n≥131 attack. certificate.kind=none.
  approval:
    approved_by: DEC-20261004-173be8
    composing_decision: DEC-20261004-173be8
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes retrieval allow-list before any download. Stage 1
      attempts TIER-P retrieval and writes admission_receipt. Stage 2 scores
      five k|r-1 rows and writes RESULTS.md with exactly one O-* label.
      No Magma/Sage. No AUXIN. No Bedrock. No ECDLP solve. No Part-2.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Clear IMP-X962 for the five c2pnb Part-1 rows left NOT COMPUTED by
    EXP-BINSTD-178742 / EV-BINSTD-fba851: retrieve TIER-P (k,r) with
    provenance, recompute k|r-1 under the same modular instrument, and
    deliver exactly one O-* label from H-BINSTD-ceae35. Retrieval failure
    stays NOT COMPUTED (never fabricated TRUE).

  class: measurement
  class_note: >-
    Provenance / parameter-census measurement. Not an exponent-moving
    breakthrough; no ECDLP attack table; no Part-2 ranks.

  scope:
    included:
      - >-
        Stage 0. Freeze retrieval protocol: document-class allow-list
        (TIER-P: published ANSI X9.62 or primary standard reproducing it
        verbatim; TIER-D information-only; secondary dumps forbidden as
        sources of r), tokenizer/field extraction allow-list, SR-SRC-*
        rules carried from EXP-BINSTD-178742, and preregistered-predictions
        before any download.
      - >-
        Stage 1. Attempt retrieval of ANSI X9.62 (or documented TIER-P
        equivalent) under the frozen allow-list; write
        stage1/admission_receipt.json with path/URL, date, sha256, tier,
        and per-row mapping attempts. Unreachable → logged IMP-X962.
      - >-
        Stage 2. Recompute five k|r-1 rows with the Part-1 modular scorer
        (identical predicate to EXP-BINSTD-178742 part1_surface.
        k_divides_r_minus_1); write stage2/part1_rows.json,
        stage2/control-table.json, RESULTS.md with exactly one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Part-2 rank identities / Semaev / PDP / orbit-quotient work.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Inventing or recalling r / k strings without TIER-P provenance.
      - Using analysis/binstd-curve-audit/ or OpenSSL dumps as TIER-P (IR-10).
      - Editing IDEA-20261001-262544 claim text or GOAL-ECDLP2M-001.yaml.
      - Editing the Stage-0 allow-list after freeze to admit a secondary dump.
      - Treating infra failure as mathematical evidence.
      - Claiming O-SUPPORT / break / exponent from parameter retrieval alone.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-6a150a/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-6a150a/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-6a150a/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-6a150a/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-6a150a/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage2: >-
      python3 experiments/EXP-BINSTD-6a150a/implementation/run.py --stage 2
      --trial-plan experiments/EXP-BINSTD-6a150a/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. implementation/run.py +
      check.py + kdiv.py are the hash-bound sources. Twin modular routes
      are the dual-implementation control. {run_dir} is substituted by the
      process supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20261001-262544.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-ceae35.yaml
    prior_part1_rows: experiments/EXP-BINSTD-178742/runs/RUN-BINSTD-372339/part1_rows.json
    prior_part1_surface: experiments/EXP-BINSTD-178742/implementation/typed/part1_surface.py
    prior_specification: experiments/EXP-BINSTD-178742/specification.yaml
    prior_evidence: ledger/evidence/EV-BINSTD-fba851.yaml
    certificate_kind: none
    primary_sources:
      - id: SRC-X962
        rows: [c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1]
        document: >-
          ANSI X9.62, the edition and annex that publishes these five curves,
          or a primary standard that reproduces them verbatim and says so
          (TIER-P under SR-SRC-6 of EXP-BINSTD-178742).
        provenance: NOT RETRIEVED at design time (IMP-X962 carried)
        impediment: >-
          IMP-X962. Repository holds no ANSI X9.62 text under inputs/ at
          design time. Stage 1 attempts retrieval under the Stage-0 freeze;
          failure keeps rows NOT COMPUTED.
    cross_check_only:
      path: analysis/binstd-curve-audit/
      rule: >-
        Secondary (OpenSSL named-curve tables). May be compared with a
        primary-sourced value only after that value is computed. Never
        supplies r, a, b, m, k or a field polynomial (SR-SRC-2 / IR-10).
    rows:
      - {name: c2pnb176v1, m: 176, label_derived_k_if_dmin_16: 11}
      - {name: c2pnb208w1, m: 208, label_derived_k_if_dmin_16: 13}
      - {name: c2pnb272w1, m: 272, label_derived_k_if_dmin_16: 17}
      - {name: c2pnb304w1, m: 304, label_derived_k_if_dmin_16: 19}
      - {name: c2pnb368w1, m: 368, label_derived_k_if_dmin_16: 23}

  source_rules_for_executor:
    - >-
      SR-SRC-1. For every decidable row, r, k, m and the field polynomial are
      read from a TIER-P source. Record document, edition, section, page,
      URL or path, retrieval date and sha256 of the exact file read.
      Provenance must be retrieved.
    - >-
      SR-SRC-2 / IR-10. analysis/binstd-curve-audit/, OpenSSL dumps, recall,
      or unnamed reproductions never supply r/k. Substitution invalidates
      that row (O-ARTIFACT).
    - >-
      SR-SRC-3. If a primary source is unreachable, the row is NOT COMPUTED
      with every attempt logged. Impediment, never evidence. Run continues.
    - >-
      SR-SRC-6. TIER-P vs TIER-D as in EXP-BINSTD-178742. TIER-D is
      information-only and never yields a counted TRUE/FALSE verdict.
    - >-
      SR-SRC-7. Name mapping: accept iff the source prints exactly one char-2
      curve over a pentanomial-basis field of degree m matching the label's m
      whose printed stem is c2pnb followed by m; record printed suffix.
    - >-
      SR-SRC-8. Comparisons only within one tier. NOT COMPUTED vs computed is
      "not comparable".

  controls:
    - name: ctl_freeze_before_download
      definition: Stage-0 allow-list frozen before any Stage-1 retrieval byte is read.
    - name: ctl_ir10_no_secondary_dump
      definition: No TRUE/FALSE from OpenSSL/audit/recall (IR-10).
    - name: ctl_source_sha256_logged
      definition: Every TIER-P file used for (k,r) has sha256 in admission_receipt.
    - name: ctl_not_computed_on_retrieval_failure
      definition: Unreachable TIER-P → NOT COMPUTED, never fabricated TRUE.
    - name: ctl_no_recalled_true
      definition: fabricated_true_count = 0 hard gate.
    - name: twin_kdiv_routes
      definition: >-
        Route A = (r-1) % k == 0; route B = pow(r,1,k) == 1. Must agree on
        every decidable row.
    - name: ctl_part1_instrument_pin
      definition: >-
        Modular predicate matches EXP-BINSTD-178742 part1_surface.
        k_divides_r_minus_1 (embedded in kdiv.py; no silent rewrite).

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_retrieve, 2_census]
    - name: row
      levels: [c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1]

  metrics:
    primary:
      - name: c2pnb_decidable_count
        unit: count
        definition: Number of five rows with TIER-P verdict TRUE or FALSE.
      - name: fabricated_true_count
        unit: count
        definition: Count of TRUE rows lacking TIER-P provenance (hard gate = 0).
      - name: twin_kdiv_agreement
        unit: boolean
        definition: Route A and route B agree on every decidable row.
    secondary:
      - name: not_computed_count
        unit: count
      - name: true_count
        unit: count
      - name: false_count
        unit: count
      - name: source_sha256
        unit: hex
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-262544-H1

  preregistered_prediction:
    quantity: >-
      Under successful TIER-P retrieval, each of the five rows becomes TRUE
      iff r ≡ 1 (mod k), else FALSE; fabricated_true_count = 0. Under
      retrieval failure, all five remain NOT COMPUTED with logged IMP-X962.
    formula: >-
      For decidable row: verdict = TRUE if (r-1) % k == 0 else FALSE.
      For undecided row: verdict = NOT COMPUTED with reason IMP-X962 or
      name_mapping_ambiguous. Success of clearance meter: decidable_count >= 1
      with fabricated_true_count == 0 (O-CLEAR-X962), or all five decidable
      (O-ALL-DECIDED), or all still NOT COMPUTED honestly (O-STILL-IMP-X962).
    source: >-
      ledger/proposals/IDEA-20261001-262544.yaml predictions; EXP-BINSTD-178742
      Part-1 modular instrument; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: standardized_parameter_census
    justification: >-
      Deployed ANSI/OpenSSL-named binary curves; measurement is exact integer
      arithmetic on published orders, not a toy transfer claim.
    correspondence: null

  tail_checks:
    - fabricated_true_count must be 0 or the run is O-ARTIFACT.
    - Twin disagreement voids decidable claims (O-ARTIFACT).
    - Label-derived k alone never yields TRUE/FALSE without primary r.

  seeds_and_replication:
    seeds: []
    independent_instances: 2
    note: >-
      Deterministic modular census. Twin modular routes are the replication
      instrument for each decidable row. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and retrieval-protocol-freeze.json.
    - Stage 1 complete with admission_receipt.json (success or logged IMP-X962).
    - Stage 2 complete with part1_rows/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-ceae35.
    - maximum_runs = 4.
    - Do not open Part-2 under this card.

  invalidation_rules:
    - Editing retrieval allow-list after Stage-0 freeze to admit a secondary dump → protocol invalid.
    - TRUE from secondary dump / recall → O-ARTIFACT / IR-10.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin modular disagreement → O-ARTIFACT.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming break / exponent / Part-2 O-SUPPORT → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen before any download; Stage 1 writes
    admission_receipt with provenance attempts; Stage 2 produces five-row
    part1_rows with fabricated_true_count=0 and twin agreement on decidable
    rows (or a named O-ARTIFACT/O-IMPEDIMENT/O-STILL-IMP-X962 stop);
    RESULTS.md names exactly one O-* label from H-BINSTD-ceae35 with cited
    artifacts. O-CLEAR-X962 requires decidable_count ≥ 1; O-ALL-DECIDED
    requires decidable_count = 5; O-STILL-IMP-X962 is an honest non-clearance.

  falsification_criterion: >-
    Any of: fabricated TRUE; IR-10 secondary substitution; twin disagreement;
    post-hoc allow-list edit admitting a dump; a claimed break/exponent /
    Part-2 O-SUPPORT under this card.

  required_artifacts:
    - experiments/EXP-BINSTD-6a150a/trial-plan-v1.json
    - experiments/EXP-BINSTD-6a150a/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-6a150a/stage0/retrieval-protocol-freeze.json
    - experiments/EXP-BINSTD-6a150a/stage1/admission_receipt.json
    - experiments/EXP-BINSTD-6a150a/stage2/part1_rows.json
    - experiments/EXP-BINSTD-6a150a/stage2/control-table.json
    - experiments/EXP-BINSTD-6a150a/RESULTS.md
    - experiments/EXP-BINSTD-6a150a/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-6a150a/implementation/run.py
    - experiments/EXP-BINSTD-6a150a/implementation/check.py
    - experiments/EXP-BINSTD-6a150a/implementation/kdiv.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
