experiment:
  id: EXP-AES-20583d
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-AES-b02749
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
  batch_id: null
  batch_id_note: >-
    NULL BY NECESSITY, NOT BY OMISSION. No BATCH-005 queue exists in
    coordination/goals/GOAL-AES-001/batches at the time of writing, and naming a
    batch directory for a file that has not been written would be a fabrication
    under AGENTS.md rule 9. The Coordinator binds this field when the queue
    exists.

  title: >-
    Algebraic degree in the key argument: exact measurement of the AES key
    schedule's low-order key-direction degrees by higher-order differentiation,
    with an affine-S-box positive control, a matched degree-7 random-permutation
    null, and a four-point graded S-box family with a forced monotone saturation
    index

  objective: >-
    If a later approval and execution authorization are granted, measure the
    algebraic degree of AES round keys as functions of the master key -- the
    KEY argument, not the data argument -- for Nk = 4, 6, 8, and decide whether
    the derived saturation indices (3, 4, 4) bound every degree-based
    key-direction propagation object inside RQ-AES-001's 3-to-7-round window.
    This contract is an instrument and protocol design only. NO RUN HAS
    OCCURRED. The predicted outcome is a NEGATIVE -- a scoped barrier statement,
    GOAL-AES-001's second completion horn -- and that is stated in advance rather
    than discovered later as a disappointment.

  what_this_is_not:
    - Not a distinguisher, key recovery, or attack; no key is recovered and no ciphertext is produced.
    - Not a statement about the AES DATA PATH, whose degree grows independently and which nothing here bounds.
    - Not a statement about the COMPOSITE data-and-key object.
    - Not a bound on the DIVISION PROPERTY, which is strictly finer than algebraic degree and can survive where a degree argument dies.
    - Not a bound on subkey-word DIFFERENTIAL relations, which RQ-AES-001's object list names separately and which this contract does not touch.
    - Not a statement about full-round AES, AES-NI-deployed AES, related-key or chosen-key models, or the security of any system using AES.
    - Not a claim that the family is new: this IS the division-property / higher-order-differential family pointed at the key argument, and whether the literature already contains it is UNKNOWN and is a checkable stage below, not an assertion.
    - Not an approval, freezing, execution authorization, run, observation, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that the AES S-box has algebraic degree 7 in every output bit;
      that for AES-128 every tested 8-dimensional affine master-key subspace is
      balanced at round key 1 and D_1 = 7 exactly; that a witness subspace
      demonstrates D_2 >= d for the largest d actually witnessed; that the
      derived saturation indices are (3, 4, 4) as a symbolic consequence of the
      measured S-box degree and the pinned layer counts; and that the graded
      S-box family's saturation index is monotone in delta over the four tested
      degrees. IT COULD NOT SUPPORT any exact degree at k >= 2, any upper bound
      obtained from a sample, any statement about the data path or the composite
      object, any statement about the division property, or any statement about
      AES at any round count. Toy evidence is never crypto-scale evidence
      (AGENTS.md rule 7).

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      The DEGREE BOUND is a structural fact about the circuit and is
      scale-independent, so it transfers as a derivation rather than as an
      extrapolation. THE MEASUREMENTS DO NOT SCALE: D_k is measured exactly only
      up to d = 8 and as a lower bound only up to d = 16, because the cost is
      2^d key expansions per candidate subspace. NOTHING measured here says
      anything about round counts of the CIPHER, because the key schedule is one
      of two components and this contract touches only one. That boundary is the
      most important thing about this experiment and it is stated first rather
      than in a footnote.

  inputs:
    key_sizes: [128, 192, 256]
    Nk: [4, 6, 8]
    key_schedule_rules_under_test: >-
      W_i = W_{i-1} XOR W_{i-Nk} for i not congruent to 0 mod Nk (and, for
      Nk = 8, not congruent to 4 mod 8);
      W_i = SubWord(RotWord(W_{i-1})) XOR Rcon(i/Nk) XOR W_{i-Nk} for
      i = 0 mod Nk;
      W_i = SubWord(W_{i-1}) XOR W_{i-Nk} for Nk = 8 and i = 4 mod 8.
      THE Nk = 8 EXTRA RULE IS THE STEP MOST LIKELY TO BE WRONG IN THE PAIRED
      HYPOTHESIS AND IS UNDER TEST HERE, not assumed: stage S0 pins the
      implemented schedule against FIPS-197 known-answer vectors, which would
      catch a wrong rule regardless of what any document says.
    field: GF(2^8)
    field_modulus: "x^8 + x^4 + x^3 + x + 1 (0x11B), the AES polynomial"
    sbox_construction: >-
      Built from the GF(2^8) multiplicative inverse composed with the FIPS-197
      affine transform, CONSTRUCTED IN CODE rather than transcribed from a
      table, and pinned against S(00) = 63, S(01) = 7c, S(53) = ed before use.
    sbox_variants:
      - id: SB-AES
        definition: "The real AES S-box."
        forced_degree: 7
      - id: SB-D1
        definition: "x -> x^2 over GF(2^8); F_2-linear."
        forced_degree: 1
      - id: SB-D3
        definition: "x -> x^7; gcd(7, 255) = 1 so it is a permutation; binary weight of 7 is 3."
        forced_degree: 3
      - id: SB-D5
        definition: "x -> x^31; gcd(31, 255) = 1; binary weight of 31 is 5."
        forced_degree: 5
      - id: SB-D7
        definition: "x -> x^127; gcd(127, 255) = 1; binary weight of 127 is 7."
        forced_degree: 7
      - id: SB-NULL
        definition: >-
          A seeded random permutation of GF(2^8) whose MEASURED algebraic degree
          is 7; draws of measured degree other than 7 are REJECTED and the
          rejection is logged.
        forced_degree: 7
    sbox_degree_verification: >-
      EVERY variant's per-coordinate algebraic degree is RECOMPUTED by Moebius
      transform over all 256 inputs and reported, including the forced values
      above. A variant whose measured degree differs from its forced degree
      invalidates that arm and is reported, not silently corrected.
    subspace_dimensions: [2, 4, 8, 12, 16]
    subspace_families:
      - id: ALIGNED
        definition: >-
          Affine subspaces spanned by whole key BYTES at declared byte positions,
          with the complementary bytes fixed to a seeded constant.
      - id: RANDOM
        definition: >-
          Affine subspaces spanned by d seeded random linearly independent
          vectors in F_2^n, with a seeded offset.
    subspace_family_reporting_rule: >-
      ALIGNED and RANDOM are REPORTED SEPARATELY AND NEVER POOLED, because
      RotWord interacts with byte alignment and pooling would hide a
      systematic hit or miss.
    declared_candidate_subspaces_per_cell: 64
    declared_candidate_subspaces_note: >-
      DECLARED BEFORE THE RUN AND NOT EXPANDED. The density of witnessing
      subspaces is not derived anywhere (HEUR-B02-3 records this as a weakness),
      so the search is a fixed budget rather than "search until a witness
      appears". Expanding it after seeing a null outcome is an invalidation rule
      below.
    master_seed: 8271043
    domain: "EXP-AES-20583d/v1"
    seed_derivation_rule: >-
      Every random draw is deterministic so a third party reproduces the
      instance set bit-for-bit. Let seed_bytes(label, key_size, dim, counter) be
      the ASCII bytes of domain || "|" || label || "|" || decimal(key_size) ||
      "|" || decimal(dim) || "|" || decimal(counter), and let
      h = SHA-256(seed_bytes(...)) as a big-endian unsigned integer, extended by
      re-hashing the previous digest when more bytes are needed. Subspace bases
      for label "basis" take the first ceil(d*n/8) bytes as d vectors of n bits
      in big-endian order; a draw whose vectors are linearly dependent over F_2
      is REJECTED, counter incremented, rejection logged. Offsets use label
      "offset". Fixed constants use label "fixed". SB-NULL permutations use
      label "nullsbox" via a Fisher-Yates shuffle driven by the digest stream.
      NO SYSTEM RNG IS USED ANYWHERE.
    environment_probe_required: >-
      Stage S0 records, inside the dispatched task: python3 version; exit codes
      of `import Crypto`, `import cryptography`, `import numpy`; `openssl
      version`; and the null probes `import sympy` (expected failure) and
      `import json` (expected success). RATIONALE: RQ-AES-001's FIRST HARD
      CONSTRAINT requires FIPS-197 agreement under BOTH pycryptodome and the
      openssl CLI, and pycryptodome was measured ABSENT from this container when
      this contract was written, making that gate unsatisfiable as written. The
      contract does not assume either state; it measures, records, and -- if
      pycryptodome is absent -- pins under the openssl CLI and `cryptography`
      instead, DECLARING THE SUBSTITUTION IN THE RECEIPT rather than making it
      silently. Restating RQ-AES-001's constraint is a COORDINATOR ACT that this
      contract does not perform.

  arms_and_controls:
    treatment: >-
      ARM-T. The real AES key schedule with SB-AES, for Nk = 4, 6, 8. Measure:
      the exact D_1 for AES-128 at d <= 8; the balance of every tested
      8-dimensional subspace at RK_1; the largest witnessed d in {8, 12, 16} for
      RK_2; and the derived saturation index per key size.
    measured_null: >-
      ARM-N (MATCHED NULL, SAME SHAPE, FORCED VALUE PRE-DERIVED, CAN FAIL).
      Identical wiring, identical Rcon, identical Nk, identical subspace set,
      with SB-AES replaced by SB-NULL -- a seeded random permutation of MEASURED
      degree 7. FORCED VALUE DERIVED BEFORE THE RUN: the degree bounds and the
      saturation index are IDENTICAL, because the bound depends on the S-box only
      through its degree. PRE-DECLARED CONSEQUENCE, RECORDED SO IT CANNOT BE SPUN
      AFTER THE FACT: if the measured sequences agree, the phenomenon belongs to
      the WIRING and NO SENTENCE OF THE WRITE-UP MAY ATTRIBUTE IT TO AES
      SPECIFICALLY. If they disagree, something beyond degree is operating and
      that is a finding. The null can fail in either direction, which is what
      makes it a null and not a decoration.
    positive_control: >-
      ARM-P (NEARBY OBJECT WHERE THE EFFECT MUST APPEAR). SB-D1 = x^2, which is
      F_2-linear, making the whole key schedule affine in the master key. FORCED
      VALUE: D_k = 1 for every k, hence EVERY 2-dimensional affine master-key
      subspace has XOR-sum EXACTLY ZERO at EVERY round key through RK_14.
      Threshold declared before the run: exact zero, no tolerance. IF THE
      INSTRUMENT REPORTS ANY NONZERO SECOND DERIVATIVE HERE IT IS BROKEN AND NO
      RESULT MAY BE REPORTED FROM ANY STAGE, POSITIVE OR NEGATIVE.
    graded_control: >-
      ARM-G. Four interior points: SB-D1, SB-D3, SB-D5, SB-D7 at algebraic
      degrees 1, 3, 5, 7. FORCED SATURATION INDEX k*(delta) = ceil(log_delta cap):
      infinity, 5, 4, 3. MONOTONICITY IS REPORTED, NOT ASSUMED. A saturation
      index that fails to decrease as delta -- the parameter meant to destroy the
      property -- increases is the canonical artifact tell
      (docs/inventor-protocol.md) and means the instrument is not measuring
      degree. This arm localises a failure to a specific degree regime instead of
      leaving "it did not work".
    ordering_control: >-
      ARM-P AND ARM-N ARE RUN, THEIR OUTPUTS COMMITTED WITH SHA-256, AND THE
      FROZEN VERDICT RULE EXECUTED ON THEM, BEFORE ARM-T IS LOOKED AT. If the
      rule emits the same label on ARM-P (where the property survives forever)
      and on ARM-T, the rule discriminates nothing and MUST be rewritten and
      re-frozen before the treatment arm is read.
    comparability_policy: >-
      Every arm uses the identical subspace set (same seeds, same counters, same
      rejection log), the identical key-schedule code path with only the S-box
      table swapped, and the identical XOR-sum routine. Any divergence in
      subspace set, seed stream, or rejection handling between arms INVALIDATES
      the comparison.
    frozen_verdict_rule: >-
      FROZEN BEFORE ANY NUMBER IS OBSERVED. barrier_verdict :=
      BARRIER_CONFIRMED if D_1 = 7 exactly for AES-128, every tested
      8-dimensional subspace is balanced at RK_1, and a witness demonstrates
      D_2 >= 12;
      BARRIER_WEAKER_THAN_DERIVED if D_1 < 7;
      BOUND_REFUTED if any 8-dimensional subspace is unbalanced at RK_1 or any
      S-box coordinate degree differs from its forced value;
      INCONCLUSIVE_SEARCH if D_1 = 7 and the RK_2 search finds no witness at
      d >= 12 within the declared 64 candidate subspaces -- WHICH IS REPORTED AS
      A SEARCH OUTCOME AND NEVER AS AN UPPER BOUND ON D_2.

  metrics:
    primary:
      - id: P1
        name: sbox_degree_per_coordinate
        definition: >-
          Algebraic degree of each of the eight coordinate functions of each
          S-box variant, by Moebius transform over all 256 inputs.
        units: integer, eight values per variant
      - id: P3
        name: D1_exact_aes128
        definition: >-
          The largest d <= 8 for which some tested d-dimensional affine
          master-key subspace has nonzero XOR-sum of AES-128 RK_1.
        units: integer
      - id: BV
        name: barrier_verdict
        definition: The categorical label emitted by the frozen verdict rule.
        units: categorical
    secondary:
      - id: P2
        name: unbalanced_count_at_8
        definition: >-
          Number of tested 8-dimensional affine subspaces with nonzero XOR-sum of
          AES-128 RK_1, reported separately for ALIGNED and RANDOM.
      - id: P4
        name: D2_largest_witnessed
        definition: >-
          The largest d in {8, 12, 16} for which a witness subspace is found for
          AES-128 RK_2, together with the NUMBER OF SUBSPACES TESTED at each d.
      - id: P5
        name: saturation_index_by_key_size
        definition: >-
          The derived first k at which min(delta^(a(k)), cap) reaches the cap,
          for Nk = 4, 6, 8, computed from the MEASURED S-box degree and the
          PINNED layer counts.
      - id: P6
        name: graded_saturation_index
        definition: k* per S-box variant in ARM-G, with the per-step difference.
      - id: P7
        name: null_sequence_agreement
        definition: >-
          Whether ARM-N's measured degree sequence equals ARM-T's at every k
          measured, per key size.
      - id: P8
        name: affine_control_unbalanced_count
        definition: >-
          Number of 2-dimensional subspaces with nonzero XOR-sum at any round key
          through RK_14 under SB-D1. Forced 0.
      - id: P9
        name: layer_counts_pinned
        definition: >-
          The measured a(k) per key size, derived from the implemented schedule
          by tracing SubWord applications, compared against the derived
          (k), (0,1,1,2,3,...), (0,0,1,2,3,...).
      - id: P10
        name: literature_check_outcome
        definition: >-
          A recorded statement of whether a search for prior work on
          key-direction algebraic degree of the AES key schedule found anything,
          WITH THE EXACT QUERIES AND ENDPOINTS USED and their HTTP statuses. A
          null outcome is recorded as "no prior work found by these queries",
          NEVER as "no prior work exists".

  preregistered_prediction:
    - quantity: P1 (SB-AES)
      formula: "max over eight coordinates of the algebraic degree by Moebius transform"
      predicted_value: 7
      source: >-
        Recomputed by the proposer on this machine from the FIPS-197
        construction, SCOUT-COMPUTED and requiring in-harness re-run. The
        literature value is RECALLED-UNVERIFIED and is NOT used.
      tolerance: exact, all eight coordinates
    - quantity: P2
      formula: "count of unbalanced 8-dimensional subspaces at AES-128 RK_1"
      predicted_value: 0
      source: "deg RK_1 <= delta^1 = 7 < 8, so the 8th derivative vanishes identically."
      tolerance: "exact zero; a single nonzero sum refutes the bound"
    - quantity: P3
      formula: "largest d <= 8 with a witness at AES-128 RK_1"
      predicted_value: 7
      source: >-
        Upper bound 7 from one SubWord layer; attainment from HEUR-B02-2, whose
        argument is that affine words cannot cancel a degree-7 term at k = 1.
      tolerance: "exact; below 7 refutes attainment, above 7 refutes the bound"
    - quantity: P4
      formula: "largest witnessed d for AES-128 RK_2"
      predicted_value: ">= 16"
      source: "Bound 49 at two SubWord layers, comfortably above 16."
      tolerance: >-
        One-sided. A null outcome is INCONCLUSIVE_SEARCH with the number of
        subspaces tested stated, and is NEVER reported as an upper bound.
    - quantity: P5
      formula: "first k with min(delta^(a(k)), cap) = cap"
      predicted_value: "(3, 4, 4) for Nk = 4, 6, 8"
      source: >-
        Layer counts a(k) = k, (0,1,1,2,3,...), (0,0,1,2,3,...) with delta = 7,
        cap = 127 / 191 / 255. Purely symbolic.
      tolerance: exact
    - quantity: P6
      formula: "k*(delta) = ceil(log_delta cap) for delta = 1, 3, 5, 7"
      predicted_value: "infinity, 5, 4, 3 -- strictly decreasing"
      source: "The same bound evaluated at the measured degree of each variant."
      tolerance: "monotone strictly decreasing; non-monotone means the instrument is not measuring degree"
    - quantity: P8
      formula: "count of unbalanced 2-dimensional subspaces under SB-D1"
      predicted_value: 0
      source: "An F_2-linear S-box makes the whole schedule affine, so every degree is 1."
      tolerance: "exact zero; any nonzero value halts everything"
    - quantity: P7
      formula: "ARM-N sequence equals ARM-T sequence"
      predicted_value: >-
        IDENTICAL. NO THRESHOLD IS SET BECAUSE BOTH OUTCOMES ARE USABLE:
        identical means the phenomenon is a property of the wiring and the
        attribution limit binds; different means something beyond degree is
        operating and that is a finding.
      source: "The bound depends on the S-box only through delta."
      tolerance: n/a

  procedure:
    stage_order_rationale: >-
      CHEAPEST FIRST, AND STAGES S0-S2 CAN EACH TERMINATE THE EXPERIMENT. S1 (the
      S-box degree) costs milliseconds and voids every later stage if it comes
      out wrong; S2 (the affine positive control) costs seconds and forbids any
      report if it fails. Together they cost under a minute and gate everything
      that follows.
    stages:
      - id: S0
        name: environment probe and FIPS-197 pinning
        cost: minutes
        can_terminate: true
        description: >-
          Run the environment probes including the sympy/json null probes.
          Implement the key schedule for Nk = 4, 6, 8 from scratch and pin the
          full encryption against FIPS-197 known-answer vectors under TWO
          independent implementations, at least one of which is not the code
          under test. If pycryptodome is absent, use the openssl CLI and
          `cryptography` and DECLARE THE SUBSTITUTION. IF THE SCHEDULE DOES NOT
          PIN, HALT: infrastructure signal, never a statement about AES.
      - id: S1
        name: S-box degree recomputation, all variants
        cost: seconds
        can_terminate: true
        description: >-
          Moebius transform over all 256 inputs for every coordinate of every
          S-box variant. Verify each variant's measured degree against its forced
          degree, and verify each power map is a permutation by recomputing
          gcd(d, 255) = 1 and checking bijectivity of the table. IF SB-AES IS NOT
          DEGREE 7 ON ALL EIGHT COORDINATES, HALT and rederive.
      - id: S2
        name: affine positive control
        cost: seconds
        can_terminate: true
        description: >-
          Under SB-D1, compute the XOR-sum over every tested 2-dimensional
          subspace at every round key through RK_14, for all three key sizes.
          MUST BE EXACTLY ZERO EVERYWHERE. FAILURE HALTS EVERYTHING.
      - id: S3
        name: layer-count pinning
        cost: seconds
        can_terminate: false
        description: >-
          Trace SubWord applications in the implemented schedule and derive a(k)
          empirically for each Nk; compare against the derived counts. A
          disagreement at Nk = 8 is the anticipated failure and is reported
          against the paired hypothesis's named weakest assumption rather than
          quietly corrected.
      - id: S4
        name: matched null, then treatment
        cost: minutes
        can_terminate: false
        description: >-
          Run ARM-N in full, commit its output and SHA-256, execute the frozen
          verdict rule on it and record the label. ONLY THEN run ARM-T: P2 at
          d = 8, P3 at d <= 8, P4 at d in {8, 12, 16} within the declared 64
          candidate subspaces per cell, ALIGNED and RANDOM reported separately.
      - id: S5
        name: graded S-box family
        cost: minutes
        can_terminate: false
        description: >-
          Repeat the degree measurements under SB-D1, SB-D3, SB-D5, SB-D7 and
          report the saturation index against the forced monotone sequence.
      - id: S6
        name: literature check, recorded either way
        cost: under one hour
        can_terminate: false
        description: >-
          Attempt to determine whether key-direction algebraic degree of the AES
          key schedule appears in prior work, recording the exact queries,
          endpoints and HTTP statuses. RQ-AES-001's third constraint requires a
          renamed variant of a known family to be recorded as a REDISCOVERY, and
          this stage is that recording. A null outcome is "no prior work found by
          these queries", never "no prior work exists". NOTE that
          eprint.iacr.org PDF bodies returned 403 in the session that wrote this
          contract while abstract pages, arxiv.org and csrc.nist.gov returned
          200; a 403 is recorded as a status, not as an absence.

  replication:
    seeds: [8271043, 8271044, 8271045]
    seed_role: >-
      The subspace sets, the fixed constants, and the SB-NULL permutation are
      re-drawn under all three master seeds. P1, P5, P6 and P9 are
      SEED-INVARIANT BY CONSTRUCTION, so seed variation in them is a defect
      indicator and is reported as such. P2, P3, P4, P7 and P8 are
      subspace-sample-dependent and their SEED-TO-SEED SPREAD IS REPORTED BEFORE
      any comparison against a predicted value, so that a model error is never
      read against unreported noise.
    replicates_per_cell: 3

  budget:
    wall_clock_seconds: 3600
    cpu_cores: 4
    memory_gb: 2
    max_runs: 18
    compute_reported_separately: >-
      Per protocol-amendment-GOAL-AES-001-005 Part B clause C4, this declaration
      is calibrated against AUTHORING-INCLUSIVE session elapsed and the compute
      component is reported separately. Estimated compute: under 600 seconds
      across all stages. Worst-case compute is bounded by
      64 candidate subspaces x 2^16 key expansions x 3 seeds at the single
      largest cell.
    stamp_duty: >-
      Per clause C2, the executing task records a first-act UTC stamp with
      start_utc, the declared budget and a COMPUTED binding_stop_utc; a stamp at
      every stage boundary; a halt at binding_stop_utc; and commits the stamps as
      a declared artifact.

  stopping_rules:
    - S0 fails to pin against FIPS-197 -> HALT, report as infrastructure signal, run nothing further.
    - S1 returns any SB-AES coordinate degree other than 7 -> HALT and rederive.
    - S2 returns any nonzero second derivative under SB-D1 -> HALT, report instrument failure, forbid any conclusion.
    - S0's null probes misbehave (sympy imports, or json fails) -> HALT, report as infrastructure.
    - binding_stop_utc reached -> HALT, report reached coverage as coverage.
    - The declared 64 candidate subspaces per cell are exhausted without a witness -> STOP that cell and report INCONCLUSIVE_SEARCH with the count.

  invalidation_rules:
    - The candidate-subspace budget expanded after a null outcome is observed -> INVALID; expansion requires a versioned amendment with confirmatory_status exploratory_only, never an edit.
    - ALIGNED and RANDOM results pooled into one figure -> INVALID.
    - Any "no witness found" reported or paraphrased as an upper bound on a degree -> INVALID; this is the contract's central reporting rule.
    - The frozen verdict rule altered after any number is observed -> INVALID.
    - ARM-T read before ARM-P and ARM-N outputs are committed with their SHA-256 -> INVALID.
    - Any key-schedule conclusion phrased as a conclusion about AES, about a round count, or about the data path -> INVALID.
    - A saturation index reported using an S-box whose MEASURED degree differs from its forced degree -> INVALID for that arm.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, unfetchable source, or absent
    implementation is reported as INFRASTRUCTURE SIGNAL with the reached coverage
    stated, and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    SPECIFICALLY: absence of pycryptodome is an environment fact and is
    discharged by substituting a declared second implementation, not by
    abandoning the pinning; a 403 on a literature endpoint in S6 is a recorded
    status and never evidence that no prior work exists; and exhaustion of the
    declared subspace budget is a search outcome, not a degree bound.

  success_criterion: >-
    S0 pins the key schedule for all three key sizes under two independent
    implementations; S1 returns degree 7 on all eight SB-AES coordinates and the
    forced degree on every other variant; S2 returns exactly zero everywhere;
    S3's empirical layer counts agree with the derived ones or the disagreement
    is reported; and the frozen verdict rule, executed on ARM-P and ARM-N first
    and then on ARM-T, emits a label. THE SUCCESS CRITERION IS THAT THE
    EXPERIMENT ANSWERS, NOT THAT IT ANSWERS IN THE PREDICTED DIRECTION: a
    BARRIER_WEAKER_THAN_DERIVED verdict is a successful run and a far more
    consequential one, since it would convert a predicted barrier into a lead.

  falsification_criterion: >-
    Any of: an SB-AES coordinate degree other than 7; a nonzero XOR-sum over any
    8-dimensional subspace at AES-128 RK_1; a nonzero second derivative under
    SB-D1 at any round key; a non-monotone graded saturation index; a measured
    D_1 strictly below 7; or an empirical layer count disagreeing with the
    derived one. Each falsifies a named component of H-AES-b02749 and the record
    states which, rather than reporting an undifferentiated failure.

  required_artifacts:
    - The environment probe receipt: per-probe command, exit code, stdout, timestamp, git commit.
    - The FIPS-197 pinning receipt naming BOTH implementations, the vector set, and the agreement count per key size.
    - The S-box construction code, its three pinned entries, and the full per-coordinate ANF degree table for every variant.
    - The ARM-P and ARM-N outputs with their SHA-256, committed BEFORE ARM-T is executed, each with the frozen verdict rule's label.
    - The full subspace log per arm and per cell: dimension, family, basis, offset, XOR-sum, balanced flag, and the rejection log.
    - The exact D_1 value with its witnessing subspace committed.
