experiment:
  id: EXP-ECDLP-90f602
  hypothesis_id: H-ECDLP-4afa77
  version: 1
  title: >
    Pair-versus-triple correlation instrument on two
    frozen cyclic groups Z/13 and Z/17
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-e47501
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-e47501 after TASK-20260908-e70fa5.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-2ac931,
    H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6,
    H-ECDLP-2ade73, or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-e47501
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-e70fa5
  source_proposal: IDEA-20260905-c5113d
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-e47501 under the standing 2026-09-06
    user authorization. Stage 0 is the pair-versus-triple
    correlation instrument. A sparse identifiability
    search is a later stage and is not run here.

  objective: >
    Compute C2 and C3 on one frozen family of subsets
    of Z/13 and Z/17, for a offset set S chosen before
    any subset is read, and decide whether the
    pair-versus-triple instrument works. Stage 0 does
    not search a smaller S, does not decode a scalar,
    and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: C2 and C3 well-defined on
      every frozen admissible subset; every translate
      and every reflection shares both certificates;
      each frozen C2-homometric non-equivalent pair
      has unequal C3 on the frozen S; size-wrong and
      empty objects rejected. Certificate kind none.
    formula: >
      For F subset Z/n, C2(F)[a] = |{x in F : x+a in F}|
      for a in 0..n-1. For (a,b) in S,
      C3(F;S)[(a,b)] = |{x in F : x+a in F and x+b in F}|.
      Equivalence is the dihedral action x |-> x+t and
      x |-> -x+t. FORCED Stage 0: fixture_pass true;
      translate_share_pass true; reflection_share_pass
      true; pair_homometric_pass true; phase_sep_pass
      true; reject_invalid_pass true.
    source: >
      ledger/proposals/IDEA-20260905-c5113d.yaml
      predictions[0] and minimal_test.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_sparseid: >
    IDEA-20260905-c5113d also flags that a compact
    tensor certificate at size below the full truth
    table is a separate question, and that Fourier
    support disconnects are explicit exceptions.
    Stage 0 does not search a sparse S and does not
    claim identifiability outside the frozen family.
    That comparison is a Stage 1+ object. This is a
    disclosed tightening, not a silent change of the
    idea's claim.

  inputs:
    fixture:
      groups:
        - id: G13
          n: 13
          k: 4
          offsets: [[1, 2], [1, 3], [1, 4], [2, 3], [2, 5], [3, 6]]
          subsets:
            - id: F13-A
              points: [0, 1, 3, 9]
              role: homometric_rep
            - id: F13-B
              points: [0, 1, 4, 6]
              role: homometric_mate
              c2_must_equal: F13-A
              c3_must_differ: F13-A
            - id: F13-A-T
              points: [3, 4, 6, 12]
              role: translate
              of: F13-A
              shift: 3
              c2_must_equal: F13-A
              c3_must_equal: F13-A
            - id: F13-A-R
              points: [0, 4, 10, 12]
              role: reflection
              of: F13-A
              c2_must_equal: F13-A
              c3_must_equal: F13-A
            - id: F13-N
              points: [0, 1, 2, 5]
              role: matched_null
              size: 4
        - id: G17
          n: 17
          k: 6
          offsets: [[1, 2], [1, 3], [1, 5], [2, 4], [2, 6], [3, 7]]
          subsets:
            - id: F17-A
              points: [0, 1, 2, 3, 8, 12]
              role: homometric_rep
            - id: F17-B
              points: [0, 1, 2, 6, 7, 9]
              role: homometric_mate
              c2_must_equal: F17-A
              c3_must_differ: F17-A
            - id: F17-A-T
              points: [0, 5, 6, 7, 8, 13]
              role: translate
              of: F17-A
              shift: 5
              c2_must_equal: F17-A
              c3_must_equal: F17-A
            - id: F17-N
              points: [0, 1, 2, 3, 4, 5]
              role: matched_null
              size: 6
      invalid:
        - id: F13-empty
          n: 13
          points: []
          must_reject: true
        - id: F13-wrongk
          n: 13
          points: [0, 1, 2]
          must_reject: true
      working_model: >
        Exact pair and triple correlation on Z/n.
        Not a Fourier learner. Not a scalar decoder.
      sparse_s_not_searched: true
      do_not_hunt_a_new_subset: true

  independent_variables:
    - subset in the frozen family
    - pair certificate versus triple certificate

  null_object:
    name: translate and reflection of a frozen subset
    construction: >
      F13-A-T is F13-A shifted by 3. F13-A-R is
      -F13-A. F17-A-T is F17-A shifted by 5. All
      three must share C2 and C3 with their source.
    non_degeneracy_check: >
      translate_share_pass and reflection_share_pass
      must be true before any C3 inequality is read
      as a measurement.
    dynamic_range_demonstration: >
      F13-empty and F13-wrongk must be rejected
      before certificates are read as fibers. An
      argument that still reports a C3 separation
      on those objects proves too much.

  controls:
    - translate identity (known-false / proves-too-much)
    - reflection identity (dihedral nearby-object)
    - matched-null same-size subsets F13-N and F17-N
    - size-wrong and empty rejection
    - exact C2/C3, no sampling
    - S frozen before any subset is read

  metrics:
    primary:
      - fixture_pass boolean
      - translate_share_pass boolean
      - reflection_share_pass boolean
      - pair_homometric_pass boolean
      - phase_sep_pass boolean
      - reject_invalid_pass boolean
    secondary:
      - per-subset C2 equality class
      - per-subset C3 equality class
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Two cyclic groups of order 13 and 17 with a
      frozen handful of subsets. No transfer to
      cryptographic n or to an elliptic relation
      fiber. Stages 1+, when authorized, remain
      toy-scale until a later amendment says
      otherwise.
    correspondence: null

  tail_checks:
    - every frozen subset has the declared size and lives in Z/n
    - F13-A-T equals F13-A shifted by 3
    - F13-A-R equals -F13-A
    - F17-A-T equals F17-A shifted by 5
    - F13-empty and F13-wrongk are rejected
    - S13 and S17 are exactly the frozen offset lists

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      translate_share_pass, reflection_share_pass,
      pair_homometric_pass, phase_sep_pass, and
      reject_invalid_pass. A miss classifies the run
      failed_infrastructure if it is a size, shift,
      or encoding bug, otherwise it is a scoped
      falsification of P-S0-TRIPLECORR or
      P-S0-PHASESEP.
    - Stages 1 and later are not authorized.
    - Do not hunt a new subset.
    - Do not enlarge or shrink S.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing n, k, S, or the subset lists after this freeze
    - Hunting a new subset because a frozen pair fails
    - Searching a sparse S as a Stage 0 metric
    - Reading Stage 0 as a Fourier learner or scalar decoder
    - Reading Stage 0 as H1, a W class, or an ECDLP advantage
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b from Stage 0 of this experiment
    - Changing H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73 from Stage 0 of this experiment

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, translate_share_pass,
    reflection_share_pass, pair_homometric_pass,
    phase_sep_pass, and reject_invalid_pass are
    true, and the run manifest carries
    certificate.kind none. Success is instrument
    reproduction, not a sparse-identifiability
    claim and not an attack.

  falsification_criterion: >
    A certified C2 or C3 mismatch between a frozen
    subset and its frozen translate or reflection,
    after fixture_pass, is a scoped miss of
    P-S0-TRIPLECORR. A certified C3 equality on a
    frozen C2-homometric non-equivalent pair is a
    scoped miss of P-S0-PHASESEP. Infrastructure
    bugs are not mathematics. Stage 0 does not
    test P-S1-SPARSEID, P-S1-FROBENIUS, P-S1-DIGIT,
    H-ECDLP-2ac931, or W.

  required_artifacts:
    - Stage 0 raw-result.json with fixture_pass,
      translate_share_pass, reflection_share_pass,
      pair_homometric_pass, phase_sep_pass,
      reject_invalid_pass, and per-subset
      equality-class labels
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Two toy cyclic groups.
    - Dense frozen S. No sparse identifiability search.
    - No Fourier learner. No scalar decoder.
    - No cryptographic transfer.
    - No disposition of H-ECDLP-2ac931, e9d9bb,
      77caa5, 07c7c6, 2ade73, or a3598b.
    - No Stage 2 of 4be480. No Stage 2 of 6a97f4.
      No Stage 17 of 420e73. No Stage 5 of a98ea9.
    - Certificate kind none. No solve, relation, or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new subset.
