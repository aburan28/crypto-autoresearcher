experiment:
  id: EXP-INSTR-8015ee
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-efc8de
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE PLANTED-SIGNAL POSITIVE CONTROL, INJECTED INTO THE REAL PIPELINE: three planted families
    -- a synthetic per-class offset that yields a per-functional minimum detectable effect, an F_p-isomorphism-orbit
    family whose within-group effect is exactly 1 by construction, and a volcano-level family whose
    within-class effect is real mathematics -- because the campaign''s committed positive control
    (RUN-INSTR-p4001-a) plants into a synthetic binomial that never touches a curve and validates
    only one of the three nulls in use'
  status: draft
  objective: "(A) WHAT THE CAMPAIGN'S POSITIVE CONTROL DOES TODAY. harness/run_icinv.py::instrument_control\
    \ draws n_curves = 40 synthetic Bernoulli(rate) count vectors, once with a common rate and once\
    \ with rates spread by +-planted_spread, and asks whether harness/exp_icinv.py::binomial_null_verdict\
    \ says \"invariant\" on the first and \"over-dispersed\" on the second. RUN-INSTR-p4001-a records\
    \ detects_planted_signal: true, rejects_matched_null: true, instrument_passes: true, smallest_detected_spread:\
    \ 0.02. It is a genuine two-directional control and it is blocking, which is right.\n(B) WHAT\
    \ IT DOES NOT COVER, ENUMERATED.\n  (B1) IT NEVER TOUCHES A CURVE. No elliptic curve, no factor\
    \ base, no sum set,\n    no isogeny class is constructed. It validates the arithmetic of a\n \
    \   chi-square dispersion test, not the pipeline that feeds it. Every step\n    between \"a curve\"\
    \ and \"a count\" -- factor_base_fixed_size, lift_x, the sum\n    set, _targets -- is unvalidated\
    \ by it.\n  (B2) IT VALIDATES ONE NULL OF THREE. NULL-B (binomial over-dispersion) is\n    exercised.\
    \ NULL-C (the label permutation, harness/exp_icinv.py::\n    permutation_null) has NO positive\
    \ control at all, and neither does\n    exact_null_verdict. NULL-C is the null that answers the\
    \ campaign's actual\n    gating question -- \"does the isogeny-class grouping carry information\"\
    \ --\n    and there is currently no evidence that it can detect a grouping effect it\n    ought\
    \ to detect.\n  (B3) ITS PLANTED SIGNAL IS THE WRONG SHAPE FOR THE HYPOTHESIS. The planted\n \
    \   spread alternates rate by +-spread with the index parity\n    (2*((i % 2)) - 1), i.e. it plants\
    \ a WITHIN-GROUP two-point spread. The L1\n    alternative hypothesis is the opposite: a per-CLASS\
    \ offset making curves in\n    one class MORE alike than pooled curves. A control for over-dispersion\
    \ is\n    not a control for grouping information.\n  (B4) THE MDE IT REPORTS IS FOR THE SYNTHETIC\
    \ MODEL, NOT FOR THE FUNCTIONALS.\n    smallest_detected_spread = 0.02 is in units of a Bernoulli\
    \ rate at 400\n    trials. The campaign's functionals include a sum-set size, a monomial\n   \
    \ count, a 2-torsion count and a windowed character sum, none of which are\n    Bernoulli rates.\
    \ There is currently no minimum detectable effect for any\n    functional the campaign actually\
    \ measures.\n\n(C) THE THREE PLANTED FAMILIES, AND WHY EACH IS NEEDED SEPARATELY.\n\n  FAMILY\
    \ 1 -- SYNTHETIC PER-CLASS OFFSET (calibration; gives the MDE).\n    Take the REAL measured vector\
    \ C(E) over the real pooled classes. Form\n    C~(E) = C(E) + delta * g(class(E)), with g a fixed\
    \ per-class offset drawn\n    once from a standard normal and frozen. Push C~ through the IDENTICAL\n\
    \    analysis -- the same stratified permutation, the same variance components,\n    the same\
    \ estimator. Sweep delta and record the smallest delta at which the\n    pipeline rejects at the\
    \ declared level. That delta*, in the functional's own\n    units, is the campaign's minimum detectable\
    \ effect. It converts every L1\n    null result from \"no effect\" into \"no effect above delta*\"\
    , which is the\n    only form docs/claims-and-verification.md permits and the form that\n    completion\
    \ criterion C4 of GOAL-ENDO-001 requires.\n    Why it discriminates: it plants an effect of the\
    \ EXACT shape the alternative\n    hypothesis predicts (a class offset), on the REAL noise, through\
    \ the REAL\n    analysis. If the pipeline cannot see delta = 1 sigma of the observed\n    within-class\
    \ spread, the pipeline cannot support a negative and the lane\n    must stop.\n\n  FAMILY 2 --\
    \ F_p-ISOMORPHISM ORBIT (a planted effect of size exactly 1, free).\n    For a fixed curve E =\
    \ (a,b) and u in F_p^*, the curves (u^4 a, u^6 b) are\n    F_p-ISOMORPHIC to E: same class, same\
    \ j, same N, same everything an\n    isogeny-class functional could legitimately depend on. Group\
    \ the orbit of\n    each of several curves as a pseudo-class. Under the hypothesis that C is an\n\
    \    invariant of the curve, within-pseudo-class variance is EXACTLY ZERO and\n    eta^2 = 1:\
    \ the strongest planted signal available and it costs one\n    exponentiation per member.\n  \
    \  THIS CONTROL IS TWO-EDGED AND BOTH EDGES ARE DELIVERABLES.\n      If within-orbit variance\
    \ is zero, the instrument's most extreme positive\n      case is confirmed and C is established\
    \ as an isomorphism invariant.\n      If within-orbit variance is NOT zero, then C depends on\
    \ the Weierstrass\n      MODEL and not on the curve, and every L1 within-class number is\n   \
    \   contaminated by a model choice that has nothing to do with isogenies.\n    The second is the\
    \ likely outcome for several committed functionals and can\n    be predicted before running: liftable_density\
    \ over a WINDOW [0,W) depends on\n    x-coordinates, and isomorphism acts by x -> u^2 x, which\
    \ does not preserve\n    the window; s3_monomial_support depends on which of a,b vanish, which\
    \ IS\n    isomorphism-invariant; two_torsion_x_count is isomorphism-invariant since\n    x^3 +\
    \ u^4 a x + u^6 b = u^6 f(x/u^2); the exact sum-set size |sums| is\n    invariant if the factor\
    \ base is transported by x -> u^2 x and NOT invariant\n    if the factor base is rebuilt by the\
    \ fixed rule factor_base_fixed_size.\n    So this control sorts the campaign's functionals into\
    \ invariants and\n    model-dependent quantities, by measurement, at negligible cost. That sort\
    \ is\n    itself the deliverable.\n\n  FAMILY 3 -- VOLCANO LEVEL (a planted effect that is real\
    \ mathematics).\n    For an ordinary curve, E(F_p) is a module over End(E) and its two-generator\n\
    \    group structure Z/n1 x Z/n2 is governed by the endomorphism order, i.e. by\n    the curve's\
    \ level in the ell-volcano for ell dividing the conductor f of\n    Z[pi]. The order N is class-constant;\
    \ the STRUCTURE is not. So\n    harness/exp_icinv.py::group_structure is a functional with a genuine,\n\
    \    structurally caused, within-class effect whose cause is nameable in advance.\n    NOTE THE\
    \ DOCSTRING CONFLICT AND THE PREDICTION IT MAKES CHECKABLE:\n    group_structure's docstring calls\
    \ it a \"Class-invariant check\". This record\n    predicts the opposite -- that (n1, n2) varies\
    \ within a class exactly when\n    the class contains curves at different volcano levels, and\
    \ is constant on\n    each level. If the prediction holds, Family 3 is a positive control with\
    \ a\n    known cause AND the natural stratifier for lane L2. If it fails, the\n    docstring is\
    \ right, the prediction is falsified, and that is recorded.\n    Why this family is worth having\
    \ beyond Families 1 and 2: it is the only\n    planted signal that is neither synthetic nor a\
    \ coordinate artifact. An\n    instrument that recovers Family 1 and 2 but misses Family 3 is\
    \ detecting\n    arithmetic it was handed and missing arithmetic it had to find.\n\n(D) THE PASS\
    \ RULE, DECLARED BEFORE RUNNING. The instrument passes only if it (i) recovers Family 2 with within-orbit\
    \ variance exactly zero for every functional it classifies as an invariant, (ii) recovers Family\
    \ 3's level stratification if and only if the level prediction holds, and (iii) reports a finite\
    \ delta* per functional from Family 1. Any functional for which delta* exceeds the observed total\
    \ spread is declared UNUSABLE for a negative result and is reported as such rather than dropped."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: No oracle, no attack, no group-operation advantage. The lane instruments
    L1's R1/R2 functionals and L2's R3/R4 stratification. KN-FIND-b7e091 and H-ENDO-001 close oracle
    classes; this record proposes none. Family 3 touches End(E) as a ring (R3) only as the CAUSE of
    a measured variance, never as a resource consumed by an algorithm.
  reachability_gate: NOT APPLICABLE, and stated rather than omitted. No curve is reached by walking;
    Family 2 moves within an F_p-isomorphism class by an explicit algebraic substitution of unit cost,
    and Family 3 only LABELS curves already enumerated. T5 is untouched. If Family 3's level effect
    were ever read as an attack direction, T5 would become binding immediately, and this record does
    not license that reading.
  inputs:
    procedure: 'STAGE 0 (minutes, and it can halt the lane): Family 2 on the target class of RUN-ICINV-p4001-a.
      K = 8 base curves, M = 6 values of u, every committed functional. Produces the invariant/model-dependent
      table. This is the cheapest stage and the one most likely to change what the campaign believes
      it is measuring. STAGE 1 (minutes): the delta = 0 and singleton-orbit null arms. STAGE 2 (an
      hour): Family 1''s delta sweep, 8 grid points times S = 200 draws of g, on the already-measured
      vectors -- no new curve measurement at all, because the planting is additive on the measured
      values. STAGE 3 (hours): Family 3, level assignment plus group_structure on the target class.
      group_structure is O(p) lift_x calls per curve, so this is the expensive stage and is deliberately
      last. STAGE 4 (zero compute): the frozen table and the usable/unusable verdict per functional.'
    mechanism: 'STEP 1 -- FREEZE THE ANALYSIS. delta* is a property of the pipeline, so the pipeline
      (functional definitions, null, estimator, level) is frozen and its commit recorded before any
      planting.

      STEP 2 -- FAMILY 2 FIRST, BECAUSE IT IS FREE AND IT CAN HALT EVERYTHING. For each of K declared
      base curves and each of M declared u in F_p^*, build (u^4 a mod p, u^6 b mod p), verify it is
      non-singular and has the same trace (a cheap independent check via harness/isogeny_class.py::trace_of_frobenius),
      and measure every functional. Report within-orbit variance per functional. Classify each functional
      as ISOMORPHISM-INVARIANT (variance exactly 0) or MODEL-DEPENDENT (variance > 0), and record
      the classification as a frozen table. A functional found model-dependent may still be measured,
      but every L1 statement using it must carry the model qualifier.

      STEP 3 -- FAMILY 3. Compute the volcano level of every curve in the target class. Do NOT use
      harness/isogeny_class.py::rational_isogeny_count for this without first settling IDEA-20260807-a4f5c5''s
      audit of it: as read on 2026-08-07 that function returns 0 whenever ell does not divide #E(F_p),
      while the existence of an F_p-rational ell-isogeny is governed by whether X^2 - tX + p has a
      root modulo ell, which is a different condition. Use instead the conductor decomposition already
      present as harness/isogeny_class.py::fundamental_discriminant, together with harness/exp_icinv.py::group_structure,
      and record the two stratifications and whether they agree. Measure whether (n1, n2) is constant
      on each level.

      STEP 4 -- FAMILY 1 AND THE MDE SWEEP. For each functional, take the real measured vector, add
      delta * g(class), sweep delta over a declared geometric grid spanning 1/16 to 4 of the observed
      within-class standard deviation, and for each delta run the full frozen analysis over S independent
      draws of g. Report the detection probability curve and read delta* off at power 0.8. Repeat
      with g drawn to be orthogonal to N across classes, so that the planted effect cannot be recovered
      through the N confound (IDEA-20260807-34754f) -- otherwise the MDE would be optimistically biased
      by the very nuisance the null is being blocked against.

      STEP 5 -- REPORT. One table: functional, isomorphism-invariant yes/no, observed within-class
      sd, delta* at power 0.8, delta*/sd, and usable-for-a-negative yes/no.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - delta = 0 arm; must fire at no more than the nominal alpha
  - singleton-orbit arm; variance identically zero by construction, so it tests the plumbing rather
    than the mathematics
  - level labels randomly reassigned with the level-size profile preserved
  - g orthogonalised against N, as the confound-proof MDE
  - RUN-INSTR-p4001-a's synthetic control re-run unchanged, as the regression fixture
  - 'NULL OBJECT (from the proposal): MANDATORY, AND FOR A POSITIVE CONTROL THE NULL IS THE UNPLANTED
    ARM. Every family runs with delta = 0 (Family 1), with M = 1 so the orbit is a singleton (Family
    2), and with the level labels randomly reassigned while preserving the level-size profile (Family
    3). The pipeline must NOT fire on any of them at the declared level. DECAY PARAMETER: delta itself.
    The detection probability must DECAY to the nominal false-positive rate alpha as delta -> 0, monotonically.
    A detection probability that stays above alpha at delta = 0 means the analysis is firing on something
    other than the planted effect and everything halts. A detection probability that does NOT rise
    toward 1 as delta grows past the observed spread means the pipeline is saturated or broken. Both
    tails of the delta sweep are pass/fail gates, not decoration.'
  independent_variables: []
  metrics:
    primary:
    - within-orbit variance per functional per base curve
    - trace of every orbit member, independently recomputed
    - detection probability versus delta, per functional, with S draws
    - delta* at power 0.8, both raw and orthogonalised, in functional units and as a multiple of the
      within-class sd
    secondary:
    - volcano level and (n1, n2) per curve in the target class
    - the frozen invariant/model-dependent classification table
  heuristic_under_test: null
  preregistered_prediction:
    quantity: within-F_p-isomorphism-orbit variance of each committed functional
    formula: 'Pre-registered per functional: EXACTLY ZERO for two_torsion_x_count and for s3_monomial_support;
      STRICTLY POSITIVE for liftable_density over a window [0,W) with W < p and for window_fb_size,
      because isomorphism acts by x -> u^2 x and does not preserve the window; and ZERO for the exact
      sum-set size only if the factor base is transported by x -> u^2 x rather than rebuilt by factor_base_fixed_size.
      Any deviation from this table is either a bug or a fact, and either is reportable.'
    source: pre-registered in IDEA-20260807-efc8de before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'ADDITIVE PLANTING IS AN ASSUMPTION. Family 1 adds an offset; if a functional''s class effect
    would in truth be multiplicative or would change the within-class variance rather than the mean,
    delta* understates the difficulty. Mitigation: run a second planting mode that scales rather than
    shifts, and report both.'
  - 'REUSING THE MEASURED VECTOR. Family 1 plants on the SAME data the campaign will analyse, so delta*
    and the L1 result are not independent. Mitigation: the MDE is reported as a property of the design
    and is recomputed on a second, disjoint class before any negative is published.'
  - ORBIT SIZE AND AUT. The isomorphism orbit of a curve has size (p-1)/|Aut(E)|, so j = 0 and j =
    1728 curves have smaller orbits. Family 2 must either restrict to |Aut| = 2 or report per-|Aut|
    separately; mixing them silently biases the within-orbit variance estimate.
  - LEVEL ASSIGNMENT IS ITSELF AN INSTRUMENT. If the volcano level is computed by a defective routine,
    Family 3 tests the defect and not the mathematics. That is exactly why Step 3 routes around rational_isogeny_count
    pending IDEA-20260807-a4f5c5.
  - SHARED RANDOMNESS. The S draws of g must be independent of the seed that generated the targets
    and factor bases, or the planted effect can correlate with the measurement noise.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'Pre-registered per functional: EXACTLY ZERO for two_torsion_x_count and for
    s3_monomial_support; STRICTLY POSITIVE for liftable_density over a window [0,W) with W < p and
    for window_fb_size, because isomorphism acts by x -> u^2 x and does not preserve the window; and
    ZERO for the exact sum-set size only if the factor base is transported by x -> u^2 x rather than
    rebuilt by factor_base_fixed_size. Any deviation from this table is either a bug or a fact, and
    either is reportable.'
  falsification_criterion:
  - Family 2 gives nonzero within-orbit variance for two_torsion_x_count or s3_monomial_support. Those
    are algebraically isomorphism-invariant, so a nonzero variance is a bug in the measurement chain
    and every number from that chain is attempted_and_inconclusive until it is found.
  - The delta = 0 arm fires above alpha. The analysis has a false-positive problem and no negative
    result may be reported from it.
  - Detection probability does not reach 0.8 for any delta within the swept range for a given functional.
    That functional cannot support a negative result and is declared unusable; this is a legitimate
    and expected outcome for at least one functional.
  - The pipeline fails to detect the Family-3 level stratification when the level prediction holds.
    Decisive instrument failure; triggers P1.
  - The level prediction itself fails -- (n1,n2) constant across the whole class. Family 3 is withdrawn
    and the group_structure docstring stands. This is a falsifier of this record's own claim, not
    of the instrument.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
