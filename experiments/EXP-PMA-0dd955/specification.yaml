experiment:
  id: EXP-PMA-0dd955
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-fd8f23; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-fd8f23
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the orbit-quotient reduction factor for principal-minor enumeration at n = 3 and
    n = 4 over small F_q, complete the (n=4, q=3) census, and report the exhaustion boundary with
    measured throughput
  objective: 'The one uncertainty a run reduces is where exhaustive computation actually stops for
    principal-minor assignment, stated as a measured number rather than as an impression. Concretely:
    (i) it establishes whether the diagonal-conjugation-plus-transposition normalisation is a genuine
    PMA symmetry by checking minor preservation, idempotence and orbit closure on samples, so that
    any reduction factor reported afterwards is trustworthy rather than asserted; (ii) it measures
    the actual reduction factor at (n=3, q=3), (n=3, q=5) and (n=4, q=3) against the closed-form prediction,
    separating the free locus from the exceptional non-free class, which is the only honest way to
    state the reduction; (iii) it completes the (n=4, q=3) representative enumeration and its exact
    orbit-sum accounting, producing the first complete 4x4 principal-minor image in this repository,
    and then measures throughput to state the projected cost of (n=4, q=5) as a labelled projection.
    The run reduces no uncertainty about k(t), about infinite fields, about the divisor-parity predicate,
    or about any cryptographic quantity. A budget overrun at any stage is recorded as an exhaustion
    boundary and is explicitly not treated as evidence about the mathematics.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for each of (n=3,
      q=3), (n=3, q=5) and (n=4, q=3), the exact representative count under the declared normalisation,
      the exact reduction factor, an exactly closing orbit-sum accounting identity, and at (n=4, q=3)
      the complete image of the 15-tuple principal-minor map; plus a throughput-based projected cost
      for (n=4, q=5) labelled as a projection. What does NOT follow: nothing about PMA4 over F_5 or
      any larger field or size as mathematics, nothing about k(t), no claim that this normalisation
      is the strongest available reduction, no claim that the boundary is a property of the problem
      rather than of this budget and implementation, and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes, human): freeze the normalisation rule, the exceptional-class
      definition, the null group action seed, and the per-(n,q) budget caps. STAGE 1 (cost: seconds):
      normalisation correctness -- idempotence, minor preservation, orbit closure, on 10^5 / 10^5
      / 10^3 samples per (n, q). Abort everything on any violation. STAGE 2 (cost: seconds to a minute):
      representative enumeration at (n=3, q=3) and (n=3, q=5); closed-form versus measured reduction
      factor; orbit-sum accounting; exceptional-class count. STAGE 3 (cost: seconds to a minute):
      identical stages 1 and 2 for the null group action, same invocation, same code path. STAGE 4
      (cost: minutes to about an hour): full representative enumeration at (n=4, q=3) with the 15-tuple
      image accumulated and the orbit-sum accounting asserted exactly. STAGE 5 (cost: minutes): throughput
      measurement on a uniform random subsample of the (n=4, q=5) representative index space, with
      variance; compute and label the projected wall clock. STAGE 6 (cost: minutes): write the boundary
      table -- (n, q, closed-form representatives, measured representatives, completed yes/no, measured
      or projected seconds, binding resource) -- and the run record.'
    instrument: Python 3 with numpy for vectorized modular arithmetic and the representative enumeration
      (exact integer reduction after every multiply; no floating point, no library determinant). Explicit
      cofactor expansion for all 2^n minus 1 principal minors. A pure-Python reference normalisation
      and reference minor routine for the cross-checks. harness/runner.py for the run manifest, seed
      discipline and the inference block. No Sage and no computer algebra system.
    parameters: 'Pairs run to completion: (n=3, q=3) with 19683 matrices, (n=3, q=5) with 1953125,
      (n=4, q=3) with 43046721. Pair projected only, never run: (n=4, q=5) with 152587890625. Closed-form
      orbit-size bound (q-1)^(n-1) times 2: 8 at (n=3,q=3), 32 at (n=3,q=5), 16 at (n=4,q=3), 128
      at (n=4,q=5). Sample sizes: 10^5 for idempotence and minor preservation, 10^3 for orbit closure,
      10^6 uniformly drawn representative indices for the (n=4, q=5) throughput measurement. Per-pair
      caps: 300 s at n = 3, 5400 s at (n=4, q=3), 16 GB peak memory. Null group action: a random permutation
      action of order (q-1)^(n-1) times 2 on the matrix space from a declared seed.'
  controls:
  - 'Idempotence control: normalise(normalise(A)) equals normalise(A) for 10^5 sampled matrices per
    (n, q).'
  - 'Minor-preservation control: the 2^n minus 1 nonempty principal minors of A and of normalise(A)
    agree exactly for 10^5 sampled matrices.'
  - 'Orbit-closure control: for 10^3 sampled matrices, every element of the explicitly generated orbit
    normalises to the identical representative.'
  - 'Accounting control: sum of orbit sizes over representatives plus the exceptional class equals
    q^(n^2) exactly.'
  - 'Null-arm control: identical normalisation machinery driven by a random group action of the same
    order, run in the same invocation, must close its accounting and must NOT reproduce the minor
    image from a reduced set.'
  - 'Exceptional-class control: matrices where the normalisation is not free are enumerated separately
    and their count is reported, never folded into the reduction factor.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical normalisation and identical orbit accounting are applied
    to a null object of the same shape: matrices over F_q equipped with a RANDOM group action of the
    same order, namely a fixed random permutation action of a group of order (q-1)^(n-1) times 2 on
    the matrix space, drawn once from a declared seed. The null must show that the orbit accounting
    closes (any correct group action does) but that the representative set has NO reduction advantage
    for the minor map -- specifically, the null''s representatives must not collapse the minor-tuple
    image at all, whereas the signal arm''s representatives must reproduce the full image with strictly
    fewer enumerated points. If the null arm also reproduces the full minor image from its representatives,
    then the reduction is an accounting trick with no relation to principal minors and the record
    says so.'
  independent_variables:
  - matrix size n in {3, 4}
  - constant field q in {3, 5}
  - 'arm: signal (diagonal-conjugation and transposition) versus null (random group action of equal
    order)'
  - 'locus: free versus exceptional non-free'
  metrics:
    primary:
    - measured representative count per (n, q) and per arm
    - reduction_factor equal to q^(n^2) divided by representative count, per (n, q) and per arm
    - orbit_sum_accounting_residual per (n, q) and per arm (must be exactly 0)
    - minor_preservation_violations and idempotence_violations
    - image cardinality of the 15-tuple map at (n=4, q=3)
    secondary:
    - exceptional non-free class size per (n, q)
    - measured throughput in representatives per second, with variance, per (n, q)
    - projected wall clock and projected representative count for (n=4, q=5), labelled as projections
    - binding resource per pair (time or memory)
    - normalisation cost per matrix, so that count reduction and wall-clock reduction are reported
      separately
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The reduction factor at each completed (n, q), the exactness of the orbit-sum accounting,
      and the placement of the exhaustion boundary strictly between (n=4, q=3) and (n=4, q=5).
    formula: 'representative_count(n, q) times average_orbit_size plus exceptional_class_total equals
      q^(n^2) exactly. reduction_factor(n=4, q=3) at least 8. closed-form reduction_factor(n=4, q=5)
      at least 32 with projected representative count at least 1e9. Boundary placement: (n=4, q=3)
      completes within 5400 s; (n=4, q=5) is projected above 1e9 representatives and is not run.'
    source: Pre-registered in the parent proposal IDEA-20260816-fd8f23 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested parameters are exactly (n=3, q=3), (n=3, q=5) and (n=4, q=3), enumerated
      in full under the declared normalisation with no sampling in the primary arm. The (n=4, q=5)
      figure is a PROJECTION from a measured throughput on a uniform subsample and is labelled as
      such everywhere it appears; it is the only extrapolation in the contract and it extrapolates
      a rate, not a mathematical property. No transfer to k(t), to larger n, or to larger q is assumed
      or offered.
    correspondence: null
  tail_checks:
  - The exceptional non-free class is enumerated separately and its matrices inspected, since it is
    where a wrong reduction factor would hide.
  - The largest orbits and the smallest orbits are printed individually and checked against the closed-form
    bound.
  - Tables in the (n=4, q=3) image realizable only by singular matrices are counted separately.
  - Throughput subsample variance is reported; a coefficient of variation above 0.25 invalidates the
    projection and it is reported as unavailable rather than as a number.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort the entire run on any minor-preservation, idempotence or orbit-closure violation in stage
    1.
  - Abort and report the boundary at the first pair exceeding its wall-clock or memory cap, recording
    which resource bound.
  - Never start an (n=4, q=5) full enumeration under any circumstance; it is a projection by contract.
  - Abort if the orbit-sum accounting residual is nonzero at any completed pair.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Stage 1 passes with zero violations, the orbit-sum accounting closes exactly
    at all three completed pairs, the (n=4, q=3) representative enumeration finishes within budget
    with its 15-tuple image stored, and a boundary table is produced giving measured reduction factors
    and a variance-qualified projection for (n=4, q=5).
  falsification_criterion:
  - Any minor-preservation or idempotence violation, or any orbit member normalising to a different
    representative.
  - Nonzero orbit-sum accounting residual at any completed pair.
  - Measured reduction factor at (n=4, q=3) below 8.
  - Projected representative count at (n=4, q=5) below 1e9, which would mean the boundary crosses
    q = 5 and the pre-committed placement was wrong.
  - The null arm reproduces the full 15-tuple image from a reduced representative set, showing the
    reduction is unrelated to principal minors.
  - Throughput subsample coefficient of variation above 0.25, in which case the projection is withheld
    rather than reported.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-fd8f23
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix the exact normalisation rule for matrices where the first-row off-diagonal
    entries are zero, which is the whole exceptional class and the main threat to the reduction factor.
  - The Coordinator must specify the null group action concretely enough that it is a genuine action
    and not a random relabelling that trivially closes accounting while meaning nothing.
  - The memory model for materialising the (n=4, q=3) image needs a pilot; whether the binding resource
    is time or memory is currently unknown and the boundary attribution depends on it.
  - 'Whether transposition should be included in the group at all needs a decision: it doubles the
    reduction but complicates the representative rule, and the closed-form factors quoted here assume
    it is included.'
