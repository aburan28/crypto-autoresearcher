experiment:
  id: EXP-NCP-01d366
  hypothesis_id: H-NCP-4cc527
  derived_from_idea: IDEA-20260807-0085af
  question_id: RQ-NCP-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Abelianization diagnostic on a MULTI-VERTEX isogeny quiver - measured
    abelianization fraction of target-reaching word relations at p about 431 and
    p about 1009, with a random-group-isomorphism null, a one-vertex regression
    against EV-NCP-001, and a forced-value gate

  objective: >-
    The one uncertainty a run reduces - whether the commutative collapse recorded
    in EV-NCP-001 is a property of elliptic-curve path algebras or an artifact of
    the one-vertex quiver on which it was measured, whose arrow group is
    virtually abelian and for which the collapse is close to forced a priori. A
    run establishes (i) the abelianization fraction of target-reaching word
    relations on a quiver with genuine vertex-changing isogeny arrows, at two
    primes and three translation-set sizes; (ii) whether that fraction is
    reproduced by a null in which the isogenies are replaced by random group
    isomorphisms of matching orders, which is what separates elliptic-curve
    structure from groupoid bookkeeping; and (iii) whether the harness reproduces
    EV-NCP-001's committed one-vertex negative, without which no new number from
    it means anything. No attack, break, speedup or security consequence is
    claimed here or would follow from a run. No direction is declared impossible.

  what_this_is_not:
  - >-
    Not an attack, a key recovery, a distinguisher, a relation-search speedup or
    a cryptanalytic result of any kind. It is a structure measurement.
  - >-
    Not a dispute of EV-NCP-001 inside that record's declared test boundary. What
    is at issue is the program-wide reading of it in DEC-20260804-139a86.
  - >-
    Not a status change to any hypothesis, evidence record, decision or goal, and
    not a promotion of any knowledge entry.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed primes, arrow sets and word
      degrees, the abelianization fraction of target-reaching word relations on
      the multi-vertex isogeny quiver has a stated value, the random-isomorphism
      null has a stated value, and the one-vertex regression does or does not
      reproduce EV-NCP-001. WHAT DOES NOT FOLLOW - nothing about word degrees
      above 6; nothing about isogeny degrees other than 2 and 3; nothing about
      larger primes; no attack and no cost consequence at any scale; and
      specifically NOT that a non-commutative relation, if found, is cheaper to
      locate than the commutative search, which is a separate question requiring
      its own contract.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Fix the two primes exactly and record
      them. For each candidate translation set T at each vertex, check
      symbolically that phi(P) is different from P for at least one P in T and at
      least one isogeny arrow phi; record the check per (prime, arrow set). If it
      fails everywhere at a prime, the quiver is one-vertex in disguise there and
      that cell is void by contract rather than by interpretation.
      STAGE 1 (regression, blocking). Re-run the harness on EV-NCP-001's original
      one-vertex arrow set and reproduce its committed abelianization fraction of
      1.0 with 0 violations across the shadow-replay control. A harness that does
      not reproduce the committed negative is not measuring the new object
      either, and the run stops.
      STAGE 2 (forced-value gate, blocking). On a vertex pair joined by an
      isogeny for which phi(P) equals P for every P in the translation set,
      the diagnostic MUST report abelianization fraction 1.0. If it does not, the
      diagnostic is broken and the run stops.
      STAGE 3 (primary null, run BEFORE any positive reading). Build the quiver
      with the isogeny arrows replaced by random group isomorphisms between the
      vertex groups of matching order, with no curve behind them. Enumerate words
      to degree 6, collect target-reaching relations, compute commutative images,
      report the abelianization fraction. Three independent random isomorphism
      draws per cell.
      STAGE 4 (signal arm). Identical enumeration on the genuine isogeny quiver
      at both primes, for |T| in 2, 3, 4, at word degrees 4, 5 and 6, with the
      shadow-replay control active.
      STAGE 5 (zero compute). Assemble the abelianization table across
      (prime, |T|, degree, arm), the reachability comparison against the
      commutative quotient, and the degree trend for HEUR-NCPQ-1. Record any
      censored cell as infrastructure.
    instrument: >-
      The noncommutative Groebner / path-algebra diagnostic already implemented
      in experiments/EXP-NCP-001 (ncp1_quiver_gb.sage) plus its shadow-replay
      control, extended to accept a quiver with more than one vertex and
      vertex-changing arrows. Composability checked on vertices before any
      product is formed. Recorded through harness/runner.py. Any extension to the
      engine is committed as a diff against the pinned EXP-NCP-001 instrument and
      its sha256 recorded.
    parameters: >-
      Primes p approximately 431 and p approximately 1009, exact values fixed at
      Stage 0. Vertices - E and its 2-isogenous and 3-isogenous neighbours inside
      one F_p-isogeny class, so the point-group orders match. Arrows - phi_2,
      phi_3, their duals, negation at each vertex, and a translation set T with
      |T| in 2, 3, 4 at each vertex. Word degree bound swept over 4, 5 and 6.
      Three random-isomorphism draws per null cell.

  controls:
  - >-
    PRIMARY NULL, mandatory and run first - isogeny arrows replaced by random
    group isomorphisms of matching order with no curve behind them. If the
    diagnostic reports the same non-abelianization rate there, any effect is
    groupoid bookkeeping and carries nothing about elliptic curves.
  - >-
    ONE-VERTEX REGRESSION, blocking - reproduce EV-NCP-001's abelianization
    fraction 1.0 with 0 violations on its original arrow set before any new
    number is trusted.
  - >-
    FORCED-VALUE GATE, blocking - on an isogeny with phi(P) equal to P for every
    P in the translation set the diagnostic MUST report 1.0. A diagnostic that
    cannot report the forced value cannot report anything.
  - >-
    Shadow replay, as already implemented in EXP-NCP-001, active on every signal
    cell.
  - >-
    Non-degeneracy check at Stage 0 - phi(P) different from P for at least one P
    in T, recorded per cell before any enumeration, so a void cell is identified
    in advance rather than explained afterwards.

  independent_variables:
  - >-
    quiver - multi-vertex genuine isogeny arrows versus one-vertex EV-NCP-001
    arrow set versus random-isomorphism null
  - prime p
  - translation set size |T| in 2, 3, 4
  - word degree bound in 4, 5, 6

  metrics:
    primary:
    - >-
      abelianization fraction - dimensionless in [0,1] - computed as the number
      of target-reaching word relations whose commutative image is also
      target-reaching, divided by the total number of target-reaching word
      relations, reported per (arm, prime, |T|, degree) cell with no pooling
    - >-
      null-arm abelianization fraction - dimensionless in [0,1] - the same
      quantity on the random-isomorphism arm, reported per draw and as the range
      over the three draws
    - >-
      one-vertex regression fraction and violation count - dimensionless and
      integer - the same quantity on EV-NCP-001's arrow set, which must be 1.0
      and 0 respectively
    - >-
      forced-value gate verdict - boolean per cell - whether the diagnostic
      returned exactly 1.0 on the phi(P) equals P construction
    secondary:
    - >-
      target-reaching relation count - integer per cell - the denominator of the
      abelianization fraction, reported so a fraction computed on a handful of
      relations cannot be read as a rate
    - >-
      word-degree histogram of target-reaching relations - counts per degree 1 to
      6 per cell
    - >-
      reachability fraction under word-order constraints versus the commutative
      quotient - two integers per cell, the analogue of EV-NCP-001's 350 of 439
      against 437 of 439
    - >-
      non-degeneracy record - for each cell, the number of pairs (phi, P) in the
      arrow set with phi(P) different from P
    - >-
      wall time and peak memory per cell, and an explicit list of censored cells
      recorded as infrastructure

  heuristic_under_test:
    id: HEUR-NCPQ-1
    formal_statement: >-
      The abelianization behaviour of target-reaching relations at word degree at
      most 6 is directionally representative of longer words, in the sense that a
      fraction of exactly 1.0 at degrees 4, 5 and 6 makes a fraction below 1.0 at
      degree 7 or more unlikely.
    tested_here: partially
    how: >-
      By sweeping the word-degree bound over 4, 5 and 6 and reporting the trend
      rather than a single value. This is a weak test and is declared as such - it
      cannot reach degree 7 within budget, so the heuristic caps every null
      reading at degree 6 and the contract says so in claim_ceiling.

  preregistered_prediction:
    quantity: >-
      The abelianization fraction on the multi-vertex genuine-isogeny arm at
      degree 6, and its difference from the random-isomorphism null arm at the
      same cell.
    formula: >-
      A(cell) := |{target-reaching relations whose commutative image is
      target-reaching}| / |{target-reaching relations}|. Predicted A strictly
      below 1.0 on the genuine arm in at least one (prime, |T|) cell at degree 6,
      with the null arm at 1.0 in the same cell. Under the null that vertex-changing
      arrows change nothing, A equals 1.0 on both arms in every cell, which is
      exactly EV-NCP-001's measured value.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-0085af, whose
      predictions block states minimum_effect as any value below 1.0 surviving
      the random-isomorphism null, and whose honest_prior_of_survival records
      0.30 for this outcome before any run exists. Never tuned to data.

  scale_relevance:
    tier: toy
    justification: >-
      Executed at p approximately 431 and 1009, the same toy sizes EXP-NCP-001
      used, because the object under test is an algebraic structure of the path
      groupoid rather than a cost. Nothing about the abelianization fraction is
      claimed to transfer to larger p, and no transfer assumption is used
      anywhere in the reading. The one extrapolation in the vicinity, from word
      degree 6 to longer words, is stated as HEUR-NCPQ-1 and is only weakly
      tested.
    correspondence: null

  tail_checks:
  - >-
    Refuse any cell with fewer than 50 target-reaching relations and report the
    shortfall rather than a fraction, since a fraction over a handful of
    relations is not a rate.
  - >-
    Report the SMALLEST word degree at which a non-commutative image first
    appears, per cell, since a first appearance only at the degree bound is
    evidence the bound is binding rather than that the effect is absent below it.
  - >-
    Report the three random-isomorphism draws separately as well as their range,
    since a null summarised by a mean can hide a draw that matches the signal.
  - >-
    Report whether any target-reaching relation on the genuine arm uses zero
    isogeny arrows; such relations live in the one-vertex sublattice and must be
    excluded from the multi-vertex reading and counted separately.

  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 24

  stopping_rules:
  - >-
    Stop immediately if the Stage 1 one-vertex regression does not reproduce
    EV-NCP-001's abelianization fraction 1.0 with 0 violations.
  - >-
    Stop immediately if the Stage 2 forced-value gate does not return exactly 1.0.
  - >-
    Do not read any signal cell before its matching null cell has been executed in
    the same invocation.
  - >-
    Stop at the declared word-degree bound of 6. Extending it after seeing a
    fraction is a different experiment and requires a new contract.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
    exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion, Groebner-engine failure or dependency
    failure makes the run failed_infrastructure and is NEVER negative
    mathematical evidence (AGENTS.md rule 5). In particular, an engine that
    rejects a multi-vertex quiver is an instrumentation cost and not a result.
  - >-
    A run whose null arm is missing, or whose null arm was not executed in the
    same invocation as the signal arm, is invalid_measurement - the comparison the
    contract exists to make was not made.
  - >-
    A cell in which phi(P) equals P for the entire translation set is VOID, not
    negative. It is reported as void with its Stage 0 record and excluded from
    every fraction.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT
    experiment and requires a new contract; it is never a repair of this one.

  success_criterion: >-
    The Stage 1 regression reproduces EV-NCP-001 (fraction 1.0, 0 violations),
    the Stage 2 forced-value gate returns exactly 1.0, at least one non-void cell
    per prime carries at least 50 target-reaching relations, and the run reports
    the abelianization fraction on the genuine arm and on all three
    random-isomorphism draws for every non-void cell at degrees 4, 5 and 6,
    together with the reachability comparison. This criterion is decidable from
    the primary metrics alone and says nothing about which value the fraction
    takes.

  falsification_criterion:
  - >-
    The abelianization fraction is exactly 1.0 on the genuine multi-vertex arm at
    both primes, all three |T| values and degree 6, with both gates passing. The
    hypothesis is false, the commutative collapse extends to the arrow class that
    was supposed to break it, and the measured fraction plus its relation counts
    are the recorded obstruction for KN-OPEN-008 at word degree at most 6.
  - >-
    The random-isomorphism null returns a fraction below 1.0 at the same rate as
    the genuine arm. Any effect is groupoid bookkeeping about vertex-changing
    arrows and carries nothing about elliptic curves; no reading of the signal arm
    is admissible.
  - >-
    Every cell is void because phi(P) equals P throughout the translation set at
    the tested parameters. The design is void at these parameters and requires
    re-parameterisation; it is not evidence in either direction.
  - >-
    The one-vertex regression does not reproduce EV-NCP-001. The harness is not
    measuring the committed object and nothing at all is reportable.

  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
    model and inference block, instrument sha256 against the pinned EXP-NCP-001
    instrument, and environment
  - >-
    raw-result.json carrying every per-cell and per-relation measurement, not
    summaries, including the full list of target-reaching relations and their
    commutative images
  - >-
    the null arm's measurements for all three draws, in the same file as the
    signal arm
  - >-
    the Stage 0 non-degeneracy record and the Stage 2 forced-value gate output
  - >-
    the Stage 1 one-vertex regression output compared line by line against
    EV-NCP-001's committed values
  - >-
    an explicit list of void and censored cells with the reason for each

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement
    approval is the USER's gate because it authorizes execution and spends
    compute. This contract is NOT approved - approved_by is null and
    execution_authorized is false (AGENTS.md rule 1).
  - >-
    The parent proposal is not proof-oriented and the paired hypothesis records
    not_applicable_reason on its proof_search_map, so no KN-TECH-080 audit is
    required before implementation. If a non-commutative relation is found and
    anyone proposes converting it into a search procedure, that is a new
    proof-oriented proposal needing its own map.
  - >-
    The exact primes and translation sets must be fixed and recorded at Stage 0
    before any enumeration; a run that chooses them after seeing a fraction is a
    different experiment.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260807-0085af
    authored_at: '2026-08-25'
    note: >-
      Controls, metrics, predictions and falsification conditions are taken from
      the parent proposal's minimal_test, null_object_control and
      falsification_conditions blocks rather than re-invented, so the contract
      tests what the proposal intended. Budgets come from the parent's declared
      estimated_cost (implementation medium, compute low) and from EXP-NCP-001's
      recorded scale of work. No field is invented - a value the proposal did not
      supply is null or is listed under derivation_gaps.

  derivation_gaps:
  - >-
    The exact primes are given in the proposal only as approximately 431 and
    approximately 1009. They must be pinned at Stage 0 and recorded, because a
    prime chosen after a non-degeneracy check failed would silently select for
    the outcome.
  - >-
    Whether the pinned EXP-NCP-001 Groebner engine accepts a multi-vertex quiver
    is unknown to this contract. If it does not, the extension is an
    instrumentation task whose cost is not budgeted here and which must be
    reported as infrastructure rather than absorbed into the run.
  - >-
    The definition of target-reaching on a multi-vertex quiver needs pinning -
    whether the target is a point at a designated vertex or a point at any vertex
    changes the relation census. The proposal does not settle it; the executor
    must declare the convention at Stage 0 and hold it fixed across arms.
  - >-
    The random-isomorphism null draws isomorphisms of matching order but the
    proposal does not say whether they must respect the dual-arrow relation. If
    they do not, the null is weaker than the signal arm in a way that flatters the
    signal, and the executor must record which convention was used.
