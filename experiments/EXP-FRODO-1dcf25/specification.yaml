experiment:
  id: EXP-FRODO-1dcf25
  hypothesis_id: H-FRODO-b7bd03
  derived_from_idea: IDEA-20260821-b19e5e
  question_id: RQ-FRODO-3260cc
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exhaustive sampler pushforward plus the 96-cell ideal-distribution convention grid as an oracle -
    exact pmf numerators by 2^16-input enumeration, certified divergence enclosures per cell, two
    opposite forced-value arms, a closed-form null at the largest published order, and a set-valued
    surviving-cell deliverable
  objective: >-
    The one uncertainty a run reduces is what the published divergence figures are a divergence
    AGAINST. A run establishes (i) the sampler's exact output law by complete enumeration of all
    65536 inputs, cross-checked against the numerators derived analytically from the filed table, so
    that every remaining ambiguity is provably on the ideal side; (ii) whether the divergence
    pipeline can reproduce a two-point closed form at the largest published order, where naive
    exponentiation fails silently and a wrong answer looks exactly like a convention mismatch;
    (iii) the two opposite forced-value dispositions - the cells that must return positive infinity
    and the cells that must return a finite value - which detect a hidden truncation and a support
    mismatch respectively and neither of which can see the other's defect; (iv) the certified
    enclosure width per cell, reported BEFORE any comparison, since a width exceeding the printed
    precision means the oracle cannot be read at all; and (v) the SET of cells whose enclosures
    contain the published figure simultaneously at all three parameter sets.
    No attack, break, exponent or statement about lattice hardness is claimed here or would follow
    from a run. A convention ambiguity is a documentation finding; a discrepancy, if found, is a
    documentation or analysis defect and this contract does not cost it.
  what_this_is_not:
    - >-
      Not an attack, a break, an exponent claim, or any statement about lattice hardness at the
      scheme's dimensions.
    - >-
      Not a claim that any published figure is wrong. The strongest available conclusion is that a
      named set of conventions is or is not consistent with the printed figures.
    - >-
      Not a claim about what the designers' script computed. The method can never certify that, and
      the set-valued deliverable is the honest form of the limit.
    - >-
      Not the failure-rate side of this lane's audit, whose ingredients are rational and which is a
      different quantity with a different instrument.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: arithmetic_claim_at_standardized_parameter_sets
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - the sampler's output law is exactly the enumerated pmf; the two
      forced-value subsets returned as derived or did not; the enclosure widths took the reported
      values; and the reported SET of convention cells is consistent with the three published figures
      at their printed precision while the complement is not. Because the input space is exhausted
      rather than sampled, the pmf statement is exact. WHAT DOES NOT FOLLOW - nothing about what the
      designers computed; nothing about a convention outside the enumerated grid; nothing about
      lattice hardness; no attack; and specifically NOT that a single surviving cell is "the"
      convention unless exactly one survives, in which case the claim is still consistency and not
      identification of intent.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): fetch and FILE the primary specification, satisfying the
      lane's source gate. The parent proposal's own source is a draft view whose table was visibly
      truncated and whose content is a summariser's extraction, and it records that the primary
      specification was NOT read. Transcribe the sampler pseudocode and the full tables from the filed
      text. Independently RE-DERIVE, mechanically, every count in the grid - the total cell count, the
      per-direction split, the per-truncation split, the forced-infinite subset size, the forced-finite
      subset size, and the oracle candidate count - directly from the axis definitions. A mismatch
      between the executor's recount and the record's counts HALTS the run.
      STAGE 1 (milliseconds): pushforward by exhaustion. Implement the sampler exactly as transcribed
      and run it on ALL 65536 inputs, tabulating exact counts. Emit a pmf with the common denominator
      and integer numerators, obtained with NO reading of the table as a cumulative distribution and
      NO assumption about boundary conventions. Then, and only then, compare with the numerators
      derived analytically from the filed table. Agreement is a two-route cross-check; disagreement
      localises the boundary convention to a specific index and is the finding.
      STAGE 2 (seconds): construct the 96 candidate ideals as CERTIFIED ENCLOSURES with proved
      remainder bounds - the rounded candidate from differences of the enclosed cumulative function,
      the discrete candidate from enclosed exponentials normalised by an enclosed partition function
      with a proved tail bound. Record the enclosure width at every step and REPORT IT BEFORE ANY
      COMPARISON.
      STAGE 3 (seconds): evaluate the grid. For each cell and each parameter set, compute the
      divergence enclosure at the published order. Tabulate the finite/infinite disposition of every
      reversed-direction cell against the derived split.
      STAGE 4 (zero compute): the oracle reading. Exclude the forced-infinite cells from candidacy
      BEFORE the comparison, so the false-match accounting uses the reduced candidate count. Report
      the SET of cells consistent with all three parameter sets SIMULTANEOUSLY - not the single best
      cell.
      STAGE 5 (seconds): the derived-sign mutation control. Move one unit of mass off the zero point
      onto the extreme support point and recompute the winning cell's divergence. The predicted SIGN
      is written down first - under the premise that the published table is a local minimiser within
      its class, every one-unit perturbation must INCREASE the divergence. A decrease refutes local
      optimality or exposes a bug, and either way is the result.
    instrument: >-
      Python with exact rational arithmetic on the sampler side and an arbitrary-precision interval
      library on the ideal side, with the remainder bounds implemented from their definitions rather
      than assumed. The closed-form null family is implemented independently of the grid code. No
      floating point is used anywhere in the divergence evaluation, because exponentiation at the
      largest published order on quantities near the published magnitudes destroys naive floating
      point silently and a wrong answer there looks exactly like a convention mismatch. Recorded
      through the program's run wrapper with a manifest.
    parameters: >-
      All three standardized parameter sets as filed; all 65536 sampler inputs per parameter set; the
      five convention forks and their 96-cell product; the published order per parameter set as filed;
      the closed-form null at at least six parameter combinations including the largest published
      order; the perturbation ladder at five magnitudes with the comparator named and the threshold
      declared before the run. All frozen in Stage 0.
  controls:
    - >-
      CLOSED-FORM NULL, blocking - evaluate the pipeline on a two-point family for which the
      divergence has a closed form, at at least six parameter combinations INCLUDING the largest
      published order. Require agreement within the pipeline's own declared enclosure width. A
      pipeline that cannot reproduce a two-point closed form at the largest order has no business
      being pointed at the real distribution, and this arm fails loudly when the exponentiation is
      done naively.
    - >-
      FORCED-INFINITE ARM, blocking - the reversed-direction, untruncated cells must return positive
      infinity for every order above 1, by the support argument. A FINITE return in any of them means
      the enclosure machinery is silently truncating the ideal, and the grid is void until fixed.
    - >-
      FORCED-FINITE ARM, blocking and OPPOSITE - the remaining reversed-direction cells must return a
      FINITE value for every order above 1, because truncation places the ideal's support inside the
      sampler's and the sampler is strictly positive at every one of its support points. An INFINITE
      return means a support mismatch. BOTH ARMS ARE REQUIRED - a pipeline with a hidden truncation
      passes the second and fails the first, a pipeline with a support mismatch passes the first and
      fails the second, and either arm alone is one-sided.
    - >-
      MECHANICAL AXIS RECOUNT, blocking - the executor recomputes every count in the grid directly
      from the axis definitions before any arm is read, and a mismatch with this contract's counts
      halts the run. The parent record was repaired once for exactly this failure, having mis-derived
      a forced value by treating an axis product as non-interacting.
    - >-
      SENSITIVITY LADDER WITH A NAMED COMPARATOR AND A PRE-DECLARED THRESHOLD - perturb the
      pushforward at one support point at five magnitudes, with the comparator named as the
      unperturbed winning cell, the threshold declared before the run, and MONOTONICITY in the
      magnitude of the perturbation reported explicitly. The divergence is a minimum at an optimal
      table, so it is NOT monotone in a SIGNED perturbation and IS expected to be monotone in the
      magnitude; the contract declares which it is testing and reports both.
    - >-
      ENCLOSURE-WIDTH GATE, blocking - no cell is reported as surviving unless its width is below the
      printed precision, checked and reported BEFORE any comparison rather than after.
    - >-
      CROSS-PARAMETER-SET SIMULTANEITY - a cell survives only if its enclosure contains the published
      figure at ALL THREE parameter sets. This is what prevents a coincidental single-set match from
      being reported and is the mitigation for the multiple-comparisons hazard over the candidate
      cells.
    - >-
      BASELINE-CELL EMBEDDING - the tacit reading currently used everywhere in this lane is one
      specific cell of the grid, and the grid reproduces it exactly as one of its rows. If it wins,
      the baseline is CONFIRMED rather than assumed, which is the point of embedding it.
  independent_variables:
    - 'convention fork 1: rounded versus discrete candidate ideal'
    - 'convention fork 2: which parameter convention the subscript denotes'
    - 'convention fork 3: untruncated / truncated-unnormalised / truncated-renormalised'
    - 'convention fork 4: direction of the asymmetric divergence'
    - 'convention fork 5: which quantity is printed'
    - parameter set, all three standardized values
    - perturbation magnitude on the sensitivity ladder, five values
  metrics:
    primary:
      - name: pmf_numerators
        units: exact integers over the common denominator, one per support point per parameter set
        computed: >-
          Counted from the complete enumeration of all 65536 sampler inputs, and separately derived
          analytically from the filed table. BOTH are reported; zero difference is REQUIRED at every
          support point, and any difference localises a boundary convention to a named index.
      - name: zero_point_numerator
        units: exact integer
        computed: >-
          The numerator of the mass at zero from the enumeration, at the largest-width parameter set.
          PREDICTED exactly two more than the sign-bit-free reading, i.e. twice the first table entry
          plus two. The prediction is exact and a single unit of disagreement refutes it.
      - name: surviving_cell_set
        units: >-
          set of convention cells, with its cardinality as an exact integer, drawn from the
          non-forced candidate cells
        computed: >-
          The cells whose divergence enclosure contains the published figure at its printed precision
          at ALL THREE parameter sets simultaneously. Reported as a SET; reducing it to a single best
          cell is prohibited.
      - name: forced_value_dispositions
        units: >-
          finite or infinite per reversed-direction cell, tabulated against the derived split into a
          forced-infinite subset and a forced-finite subset
        computed: >-
          The returned value's finiteness per reversed-direction cell, compared cell by cell against
          the mechanically re-derived split. Both subsets must match exactly.
      - name: relative_enclosure_width
        units: >-
          enclosure width divided by the published figure's last significant digit, dimensionless, per
          cell per parameter set
        computed: >-
          Absolute enclosure width and its ratio to the printed precision, reported BEFORE any
          comparison. A ratio at or above 1 means no cell may be reported as surviving.
      - name: closed_form_null_residual
        units: >-
          difference between the pipeline's enclosure and the closed-form value, per parameter
          combination, dimensionless
        computed: >-
          At at least six combinations including the largest published order. Required to be within
          the pipeline's own declared enclosure width.
    secondary:
      - name: axis_recount_agreement
        units: 'categorical: match / mismatch, with both count tuples side by side'
        computed: >-
          The executor's mechanically re-derived counts against this contract's counts. A mismatch
          halts the run.
      - name: sensitivity_ladder_values
        units: divergence enclosure at each of five perturbation magnitudes, with a monotonicity flag
        computed: >-
          The winning cell's divergence recomputed at each magnitude, with monotonicity in the
          magnitude reported explicitly and separately from behaviour under a signed perturbation.
      - name: mutation_control_sign
        units: 'categorical: increase / decrease / within enclosure'
        computed: >-
          Sign of the change in the winning cell's divergence when one unit of mass is moved off the
          zero point, against the predicted increase written down first.
      - name: baseline_cell_outcome
        units: 'categorical: survives / does not survive'
        computed: >-
          Whether the lane's tacit reading, embedded as one specific grid cell, is in the surviving
          set.
      - name: per_cell_enclosure_endpoints
        units: pair of rationals per cell per parameter set
        computed: Endpoints of every cell's divergence enclosure, recorded exactly.
      - name: false_match_rate_estimate
        units: dimensionless probability
        computed: >-
          Derived BEFORE the run from the candidate-cell count and the printed precision, so that a
          surviving set of a given size can be read against the rate at which chance would produce it.
  heuristic_under_test:
    numbered_heuristics:
      - id: H1
        formal_statement: >-
          The certified enclosure of the Gaussian cumulative function used to build each candidate
          ideal has a PROVED remainder bound, so that for every support point and every candidate the
          returned interval provably contains the true value; and the propagated enclosure of the
          divergence at the published order is therefore a rigorous bracket, not an estimate.
        rigorous_side: >-
          The rigorous ingredient is the alternating-series or Taylor remainder bound for the error
          function, which supplies a proved two-sided bound. The heuristic content is only that the
          implementation realises the bound it claims.
        validation_route: >-
          Validated at the REAL parameters, not at toy scale, because each support has at most a few
          dozen points. Route - recompute every candidate value at two different series truncation
          indices and require the two enclosures to be NESTED; recompute with an independent
          arbitrary-precision path at several times the working precision and require containment; and
          a tail check on the extreme support point, where the enclosure is widest in relative terms,
          against an independently derived tail bound. TRANSFER ASSUMPTION - NONE; the validation is
          at the standardized parameters themselves.
      - id: H2
        formal_statement: >-
          The set of 96 enumerated conventions CONTAINS the one used to produce the published figures,
          and that convention is among the non-forced cells.
        rigorous_side: >-
          No rigorous support exists and none is claimed. This is the assumption most likely to be
          false and it is named as such rather than hidden. Its rigorous companion is only the
          negative - the grid is CLOSED under the five forks as stated, so a failure localises the
          missing convention to something outside those five axes. The restriction to the non-forced
          subset is not an assumption but a derived consequence, since a published finite figure
          cannot have come from a cell whose value is provably infinite.
        validation_route: >-
          FALSIFIED DIRECTLY BY THE RUN - if no cell survives, this heuristic is refuted at the
          enumerated grid, and the response is to widen the grid along a NAMED sixth axis, recorded as
          an amendment and never as a re-read of the original.
  preregistered_prediction:
    quantity: >-
      The tuple (pmf_numerators agreement, zero_point_numerator, forced_value_dispositions,
      relative_enclosure_width, cardinality of surviving_cell_set, mutation_control_sign).
    formula: >-
      pmf_numerators - zero difference at every support point between the enumeration and the analytic
      derivation. zero_point_numerator - exactly twice the first table entry plus two, an exact
      prediction that a single unit refutes; the parent proposal's hand reconciliation names the
      specific integer 9288 at the largest-width parameter set, and that integer is a HAND-DERIVED
      PREDICTION by the proposing agent, NOT a measurement, and must be re-derived by machine.
      forced_value_dispositions - the reversed-direction untruncated cells all infinite and the
      remaining reversed-direction cells all finite, matching the mechanically re-derived split
      exactly. relative_enclosure_width strictly below 1 for every reported cell.
      Cardinality of surviving_cell_set - the TARGET is 1; 0 means a discrepancy or an incomplete
      enumeration; 2 or more means the printed precision does not determine the convention and the
      surviving set is the deliverable. The parent proposal's own honest prior favours 2 or 3, and
      that expectation is recorded here so that a set-valued result is not read as a failure.
      mutation_control_sign - increase, by the local-optimality premise; a decrease refutes local
      optimality or exposes a bug.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-b19e5e (claim, predictions, mechanism and
      null_object_control blocks, as corrected in its 2026-08-24 repair) before any run under this
      contract exists. Never tuned to data.
  scale_relevance:
    tier: standardized_parameter_set
    justification: >-
      Every quantity is evaluated at the three standardized parameter sets themselves, not at a
      reduced scale, and the sampler's input space is EXHAUSTED rather than sampled. There is
      therefore no scale transfer assumption anywhere in this contract, and the validation of the
      enclosure heuristic is likewise at the real parameters. The binding constraint is not scale but
      the DOCUMENT - if the published figures carry only three significant digits, the oracle's
      resolving power is set by the document and no amount of precision fixes it, which is why the
      enclosure-width gate is a reporting precondition rather than a discovered disappointment.
    correspondence: >-
      Exact - the enumerated pushforward is the sampler's law, with no sampling and no reduction.
  tail_checks:
    - >-
      Report the enclosure width at the EXTREME support point separately, where it is widest in
      relative terms, and check it against an independently derived tail bound.
    - >-
      Report the finite/infinite disposition of EVERY reversed-direction cell individually, not a
      pooled count, since the two forced subsets detect opposite defects and a pooled count would hide
      one behind the other.
    - >-
      Report the closed-form null residual at the LARGEST published order separately from the others,
      since that is where naive exponentiation fails and where a silent failure would masquerade as a
      convention mismatch.
    - >-
      Report the pairs of cells that are indistinguishable at the printed precision, by name, whenever
      more than one cell survives - the identity of what cannot be separated is the deliverable in
      that branch.
  replication:
    seeds: []
    independent_instances: 1
    note: >-
      There is NO randomness in this experiment. The sampler input space is exhausted and every
      candidate ideal is a deterministic enclosure, so the seed list is empty by design rather than by
      omission. Replication is by INDEPENDENT RECOMPUTATION - the enclosure validation route requires
      recomputation at two truncation indices and at higher precision by an independent path, and the
      axis counts are re-derived mechanically by the executor rather than transcribed.
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 12
  stopping_rules:
    - Halt if the primary specification cannot be fetched and filed in Stage 0; the sampler is not transcribed from a draft view or a summariser's extraction.
    - Halt if the executor's mechanical recount of any axis count disagrees with this contract's counts.
    - Halt if the closed-form null fails at any tested combination, especially the largest published order.
    - Halt if any forced-infinite cell returns finite, or any forced-finite cell returns infinite.
    - >-
      Do not report a surviving set if any reported cell's relative enclosure width is at or above 1;
      the deliverable shrinks to the widths themselves.
    - >-
      Stop at the declared grid. Widening the grid along a sixth axis after seeing that no cell
      survives is an AMENDMENT with its own record, never a re-read of the original.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run in which any divergence value was computed in floating point is invalid_measurement -
      exponentiation at the published orders destroys naive floating point silently, and a wrong
      answer there is indistinguishable from a convention mismatch.
    - >-
      A run whose forced-value arms were not executed on the identical divergence code path as the
      grid is invalid_measurement.
    - >-
      A run that reports a single winning cell where more than one survives is invalid_reporting and
      is returned to the Executor; the deliverable in that branch is the set.
    - >-
      A run whose enclosure widths were computed or reported AFTER the comparison with the published
      figures is invalid_measurement, since the gate must bind before the comparison.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) axis_recount_agreement = match; (2) pmf_numerators show zero difference between the
    enumeration and the analytic derivation at every support point, and zero_point_numerator equals
    the predicted value; (3) closed_form_null_residual is within the declared enclosure width at every
    tested combination including the largest published order; (4) forced_value_dispositions match the
    derived split exactly in BOTH subsets; (5) relative_enclosure_width is reported for every cell
    BEFORE any comparison, and is below 1 for every cell reported as surviving; and
    (6) surviving_cell_set is reported AS A SET with its cardinality, together with the pairs of cells
    the printed precision cannot separate.
    Note that (6) is satisfied at cardinality 0, 1 or more than 1. Which of the three occurs is the
    finding, and the parent proposal's own expectation is that more than one survives.
  falsification_criterion:
    - >-
      The enumeration disagrees with the analytic numerators - a boundary convention is misread and
      the index at which they diverge is the finding.
    - >-
      zero_point_numerator is not the predicted value - the strict-inequality plus wasted-sign-bit
      reading is REFUTED and the parent proposal's hand derivation is withdrawn.
    - >-
      No cell reproduces all three figures - either the enumeration of conventions is INCOMPLETE,
      which is the first hypothesis and is tested by widening the grid along a named sixth axis, or
      there is a discrepancy, quantified per cell and reported as a documentation defect, never as an
      attack.
    - >-
      More than one cell reproduces all three - the oracle is not discriminating at the printed
      precision. The deliverable becomes the surviving set plus a statement of what precision would
      separate it, and NO convention determination is reported.
    - >-
      Any forced-infinite cell returns a finite value - HIDDEN TRUNCATION of the ideal; the grid is
      void until fixed.
    - >-
      Any forced-finite cell returns infinity - SUPPORT MISMATCH; the grid is void until fixed. This
      condition and the previous one are opposite in direction and BOTH are required.
    - >-
      Enclosure widths exceed the printed precision - the instrument cannot read the oracle, no
      surviving set may be reported, and the deliverable shrinks to the widths, which is still a
      usable obstruction with a number.
    - >-
      The mutation control DECREASES the divergence - local optimality of the published table is
      refuted at that perturbation, which contradicts the reported design criterion and is a
      substantive finding for a sibling record's lane.
    - >-
      The closed-form null fails at the largest published order - the exponentiation is being done in
      a way that destroys precision silently, and every grid value is void.
  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - the Stage 0 fetch receipt for the primary specification, with URL, HTTP status, byte count and sha256
    - the transcribed sampler pseudocode and full tables from the filed text
    - the executor's mechanically re-derived axis counts alongside this contract's counts
    - raw-result.json carrying exact pmf numerators for every support point and every parameter set
    - per-cell divergence enclosure endpoints as rationals, for all cells and all parameter sets
    - per-cell enclosure width, absolute and relative to the printed precision, timestamped before the comparison
    - the finite/infinite disposition of every reversed-direction cell against the derived split
    - the surviving set as a set, with the indistinguishable pairs named
    - closed-form null residuals at every tested combination, with the largest-order one called out
    - the sensitivity ladder values with the monotonicity flag, and the mutation control's sign against its pre-written prediction
    - the pre-run false-match rate estimate derived from the candidate-cell count and the printed precision
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The parent proposal is PROOF-ORIENTED and carries a proof_search_map. Per KN-TECH-080 and the
      Coordinator's proof-oriented dispatch gate, that map must be audited before implementation - in
      particular its baseline embedding (the lane's tacit reading as an explicit grid cell), its
      observation collision (several cells agreeing at three significant digits, which is the EXPECTED
      failure mode and a named outcome), its quantifier order (a single cell working for all parameter
      sets, not a cell per parameter set), and its nearby-object control.
    - >-
      The lane's SOURCE GATE is a precondition. The parent proposal records that the primary
      specification was not read and that its own table came back truncated from a draft view. Reading
      a summariser's extraction as primary text would put every number in the run at risk.
    - >-
      The parent record was REPAIRED once for a mis-derived forced value, and its repair session had
      no shell and could not run a parse check. The Coordinator must confirm the mechanical axis
      recount is wired as a HALTING GATE before Stage 1, not as a reported diagnostic.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260821-b19e5e
    authored_at: '2026-08-25'
    note: >-
      The five forks, the grid, the two opposite forced-value arms, the closed-form null, the
      enclosure-width gate, the cross-parameter-set simultaneity requirement, the derived-sign mutation
      control and the three named outcomes of the oracle are transcribed from the parent proposal's
      claim, mechanism, null_object_control, predictions, minimal_test and repair_provenance blocks as
      corrected on 2026-08-24. The numeric predictions the parent derived BY HAND are carried here
      explicitly labelled as hand-derived predictions requiring machine re-derivation, never as
      measurements. Budgets come from the parent's declared estimated_cost (implementation medium,
      compute low) through the program's cost table.
  derivation_gaps:
    - >-
      The published order and divergence figures are research targets carried from this repository's
      own question record and corroborated only by a search summary. They are the oracle's TARGETS, so
      if the filed text differs, every comparison in Stage 4 changes. Stage 0 must re-read them and
      the Coordinator must confirm them before Stage 3.
    - >-
      The exact numeric counts of the grid's axis products are asserted in the parent record and are
      deliberately not restated as authoritative here; the executor's mechanical re-derivation is the
      authority and a mismatch halts. A contract that hard-coded them would repeat the failure the
      parent record was repaired for.
    - >-
      Fork 5 - which quantity is printed - can masquerade as fork 3 at these magnitudes, since the
      candidate printed quantities differ by about the size of the figure itself. The design treats
      them as independent axes and reports a set rather than a winner, but whether that suffices to
      separate them at three significant digits is not established in advance.
    - >-
      The false-match rate estimate must be DERIVED before the run from the candidate-cell count and
      the printed precision. If it is computed afterwards it cannot inform the reading of a
      multi-cell surviving set, which is the parent proposal's own expected outcome.
    - >-
      The parent proposal's own honest prior lowers confidence in its arithmetic discipline after its
      repair. The Coordinator should consider dispatching the mechanical recount and the enclosure
      construction to separate agents, so that the check and the thing checked do not share an author.
