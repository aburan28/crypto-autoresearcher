# EXP-ECDLP-965117
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-f708d7.
experiment:
  id: EXP-ECDLP-965117
  hypothesis_id: H-ECDLP-df719b
  source_idea: IDEA-20261003-3e6677
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-7 table versus width-6 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-f708d7
  objective: >-
    Check the table sizes 64 and 32, the product 2048, and the nearby gap 0.
  inputs:
    width_hi: 7
    width_lo: 6
    table_hi: 64
    table_lo: 32
    table_gap: 32
    table_product: 2048
    table_sum: 96
    nearby_a: 32
    nearby_b: 32
    nearby_gap: 0
    nearby_product: 1024
  controls:
    - >-
      Two to the power 6 is 64. Two to the power 5 is 32. Reporting
      both tables as size 32 drops the gap and invalidates the run.
    - >-
      Sixty-four exceeds thirty-two by 32. The product of the two
      sizes is 2048. Their sum is 96.
    - >-
      Two width-6 tables each store 32. Their gap is 0 and their
      product is 1024.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-7 table stores 64 entries. The width-6 table stores
      32. The gap of two width-6 tables is 0.
    formula: >-
      Compute 2 to the power 6. Compute 2 to the power 5. Subtract
      32 from 64. Multiply 64 by 32. Subtract 32 from 32.
    source: >-
      IDEA-20261003-3e6677 states the widths 7 and 6 and the sizes
      64 and 32, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 2048 and the nearby gap 0 are required. A check that stops at the size 64 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 64 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 6 is not 64.
    - Two to the power 5 is not 32.
    - The gap is not 32.
    - The product is not 2048.
    - Both tables are reported as size 32, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-7 table stores 64 entries, that
    the width-6 table stores 32, and that 64 exceeds 32 by 32.
  falsification_criterion: >-
    The runs agree that the width-7 table size is computed, and
    that size is not 64.
  required_artifacts:
    - experiments/EXP-ECDLP-965117/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-965117/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-965117/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-965117/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-965117/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-965117/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 32 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
