experiment:
  id: EXP-XEDN-1bcf87
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-XEDN-906489
  question_id: RQ-XEDN-003
  goal_id: GOAL-XEDN-002
  title: >-
    Lattice-forcing audit of the XEDN coefficient observable: recompute the
    Shioda pairing on archived slot data, test the two-valued dichotomy, recompute
    the affine mark ceiling, and establish the reachable range of the incumbent
    relation search

  objective: >-
    If separately approved, frozen and authorized, decide three things about the
    observable that GOAL-XEDN-001, -002 and -003 rest on. (1) Whether
    max_|coeff| is a two-valued function of the realised Mordell-Weil root system
    (1 when a non-A1 component exists, undefined when the system is A1^r), rather
    than a measurement of p or deg a. (2) Whether the infinity norm of any
    minimal-support relation in the chi = 1 window is bounded by 6 with the value
    5 impossible, recomputing the affine marks from the E8 root system rather
    than from a remembered table. (3) Whether the incumbent primary search
    shortest_relation_group_law can return the value H-XEDN-004 nominates as its
    falsifier. NO NEW SURFACE FAMILY IS PROPOSED AND NO ATTACK IS ATTEMPTED.

  what_this_is_not:
    - Not a discrete-logarithm computation, relation collection, lifting attack, or ECDLP attack of any kind.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - Not a re-run of EXP-XEDN-005; that contract requires Sage, which is absent from this environment, and this contract does not attempt it.
    - Not a status change to GOAL-XEDN-001/002/003, H-XEDN-001..005, EV-XEDN-001..006 or KN-FIND-005/010/011; those are Coordinator records.
    - Not a closure of the lifting route, the multi-section route, or the Mordell-Weil relation-source route. DEC-20260724-021's published forbidden-sentence list binds this contract verbatim.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.
    - Not a claim that any recalled theorem of Shioda's Mordell-Weil lattice theory is verified; the recalled statements are carried as HEUR-X1 and HEUR-X2 and are tested by their consequences.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on rational elliptic surfaces y^2 = x^3 + a(t)x + b(t) over
      F_p(t) with deg a <= 4, deg b = 6, squarefree discriminant and
      p in {7,13,19,31}, restricted to the surfaces recorded in the committed
      EXP-XEDN-005 and EXP-XEDN-007 artifacts plus a bounded fresh enumeration,
      the observable max_|coeff| took only the values 1 and undefined and those
      values were predicted in advance from the realised root system; that a
      recomputed affine mark table for E8 gives an absolute ceiling of 6 with 5
      absent; and that one named function in one committed implementation cannot
      return a value >= 4. NOTHING ABOVE TOY. No outcome may be cited as
      crypto-scale validation, as an attack, or as evidence about any curve
      outside the tested primes.

  environment_preconditions:
    measured_this_session_not_assumed:
      numpy: "2.4.6, imports"
      sympy: "ABSENT (ModuleNotFoundError)"
      sage: "ABSENT (ModuleNotFoundError); experiments/EXP-XEDN-005/implementation/run_census.sage therefore CANNOT be re-executed here"
      frozen_predicate: >-
        experiments/EXP-XEDN-001/xedni_sections.py, sha256
        76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f,
        imports cleanly and exposes trim, pmul, padd, is_square_poly. Pure
        Python.
    consequence: >-
      Every arm of this contract is pure-Python exact integer and F_p arithmetic,
      including the Mordell-Weil group law over F_p(t), which is implemented on
      polynomial pairs rather than delegated to a CAS. If an executor finds a CAS
      necessary, that is an infrastructure request and a report of infrastructure
      signal, never negative mathematical evidence (AGENTS.md rule 5).

  inputs:
    archived_sources:
      - path: experiments/EXP-XEDN-005/runs/RUN-XEDN-005-MAIN/raw-result.json
        use: per-surface (a, b, slot list, recorded naive rank/corank, recorded metric, planted control)
      - path: experiments/EXP-XEDN-005/runs/RUN-XEDN-005-CTRL/raw-result.json
        use: control arm of the same census
      - path: experiments/EXP-XEDN-007/runs/
        use: chi = 2 null arm, deg b = 10 slot data
      - path: experiments/EXP-XEDN-005/implementation/run_census.sage
        use: read-only, for the reachability audit of shortest_relation_group_law
      - path: experiments/EXP-XEDN-001/xedni_sections.py
        use: frozen square predicate for the independent re-enumeration arm
    archived_sources_required_integrity: >-
      Record the sha256 of every archived file read, before reading it. A file
      whose hash cannot be recorded is not used and its absence is reported as
      an absence, never worked around.
    primes: [7, 13, 19, 31]
    treatment_family:
      form: "y^2 = x^3 + a(t) x + b(t) over F_p(t)"
      deg_a_max: 4
      deg_b: 6
      section_shape: "deg x <= 2, deg y <= 3"
      required: "a != 0, 4a^3 + 27b^2 not identically zero, j non-constant"
    null_family:
      form: "same, deg b in {7,8,9,10,11,12}"
      note: "chi = 2; minimal integral-section height 2 chi = 4; the root argument does not apply"
    pairing:
      primary: "Shioda: <P,P> = 2 chi + 2 (P.O) - sum_v contr_v(P); at chi = 1 with irreducible fibres <P,P> = 2 and <P,Q> = 1 - (P.Q)"
      recorded_beside_it: "the naive-degree Gram of the incumbent implementation, reported for comparison and NEVER used in a conclusion"
    seeds:
      master_seed: 906489
      domain: "EXP-XEDN-1bcf87/v1"
      derivation_rule: >-
        A stream label L and counter n give the seed bytes
        SHA-256(UTF-8 of (domain || "|" || L || "|" || decimal(p) || "|" ||
        decimal(n))). Digest integers are interpreted big-endian unsigned. Stream
        labels used: "enum" (fresh re-enumeration surface draws), "graded"
        (deg-b sweep draws), "synth" (synthetic root configurations). No other
        stream exists; a third party reproduces every instance bit-for-bit from
        the master seed, the label, p and n.
    surface_draw_rule_for_fresh_arms: >-
      For stream L and counter n, take the first 5 bytes-groups of the digest to
      form a coefficients in F_p (deg <= 4) and the next 7 to form b (deg = 6
      exactly; if the leading coefficient reduces to 0, increment n and redraw,
      recording the number of redraws). This is UNIFORM sampling of the family
      and is deliberately NOT the plant-and-solve sampler used by EXP-XEDN-005;
      the difference is itself reported.

  stages:
    ordering_rationale: >-
      Cheapest-first, and the cheapest stage is decisive. Stage 0 and Stage 1
      together can terminate the entire contract with ZERO curve compute, because
      they test the algebra and the instrument rather than the surfaces.
    stage_0:
      name: E8 construction and the dichotomy on synthetic saturated sets
      cost: seconds, pure Python, no archived data opened
      content: >-
        Build the 240 roots of E8 exactly (the 112 vectors +/-e_i +/-e_j and the
        128 half-integer vectors with an even number of minus signs), verify the
        Gram is integral with diagonal 2, verify by orbit computation that the
        generated reflection group is transitive on the roots, and enumerate the
        (rank, positive-root count) pairs realisable by root subsystems. Then
        test the Case-O / Case-R dichotomy mechanically on saturated subsets,
        including adversarially chosen ones.
      can_terminate: >-
        YES. If the dichotomy fails on any synthetic saturated subset, the
        derivation is wrong, the contract stops, and that failure is the
        deliverable.
    stage_1:
      name: affine marks and instrument reachability
      cost: minutes, pure Python, no archived surface opened
      content: >-
        Enumerate affine subdiagrams inside E8, RECOMPUTE their marks from the
        root system (no remembered table is used), confirm the ceiling 6 and the
        absence of 5, and build the attaining affine-E8 circuit explicitly.
        Separately, read shortest_relation_group_law and establish its reachable
        range by feeding it a synthetic point configuration whose only relation
        has infinity norm 4.
      can_terminate: >-
        YES on the mark half: if the recomputed marks contradict the ceiling, P2
        of H-XEDN-906489 dies here. The reachability half cannot terminate the
        run but its result stands independently of everything else.
    stage_2:
      name: recomputation over archived slot data
      cost: under one CPU-minute, pure Python
      content: >-
        For every surface in the archived EXP-XEDN-005 results: recompute the
        discriminant and factor it over F_p[t], classify each fibre, recompute
        the Shioda height of every listed slot, build the Shioda Gram, compute
        rank, Dynkin type, the full relation lattice, and every minimal-support
        relation with its infinity norm; verify each relation in the group law
        over F_p(t) and, separately, by specialisation at >= 20 good fibres,
        reporting both. Report the recorded naive rank and recorded metric
        alongside, never merged.
      can_terminate: no
    stage_3:
      name: null arm, positive control, graded control, independent re-enumeration
      cost: bounded minutes
      content: >-
        The chi = 2 null arm on archived deg b = 10 data; the archived planted
        control's premise audit; the graded deg-b sweep; and an independent
        re-enumeration of a subset of surfaces with the frozen predicate to check
        the archived slot lists rather than trust them.
      can_terminate: no

  arms_and_controls:
    treatment: >-
      Archived chi = 1 surfaces (deg a <= 4, deg b = 6) with squarefree
      discriminant and all slots at recomputed Shioda height 2 -- the pure
      stratum. Surfaces failing any premise are reported SEPARATELY and are never
      pooled into the treatment.
    measured_null: >-
      NULL-A, chi = 2. The archived deg b = 10 slot data of EXP-XEDN-006/007,
      run through the identical recomputation code path. FORCED VALUE DERIVED
      PRE-RUN: recomputed Shioda diagonal 4, not 2, and (rank, count) pairs NOT
      constrained to the ADE table. THIS NULL CAN FAIL: if the chi = 2 family
      returns diagonal 2 and ADE-admissible pairs, the recomputation is reporting
      a property of the code and no conclusion may be drawn about either family.
    positive_control: >-
      CTRL-P, the archived EXP-XEDN-005 planted surface a = [2,4,0,3,3],
      b = [1,2,3,3,6,5,2] at p = 7 with 3 slots, specialisation 20/20 and
      max_abs_coeff = 2. The dichotomy FORBIDS 2 among saturated height-2 roots
      at support <= 3. The control passes only if exactly one named premise
      violation is found: non-squarefree discriminant, a fibre that is not I1, or
      a slot at height /= 2. IF NO VIOLATION IS FOUND, THE DERIVATION IS REFUTED
      BY AN ALREADY-COMMITTED NUMBER AND NO NEGATIVE STATEMENT ABOUT THE LANE'S
      OBSERVABLE MAY BE REPORTED.
    second_positive_control: >-
      CTRL-L, the synthetic affine ladder. Hand-built circuits of type affine A4,
      D4, D6, E6, E7, E8 must return infinity norms 1, 2, 2, 3, 4, 6 with the
      affine-E8 coefficient multiset {1,2,3,4,5,6,4,3,2}. This is the sensitivity
      demonstration the incumbent instrument never had: if the machinery cannot
      see a coefficient of 6 when one is placed in front of it, no coefficient
      conclusion may be drawn from any arm.
    graded_control: >-
      CTRL-G, deg b in {6,7,8,9,10,11,12} at fixed deg a <= 4, at least 200
      uniformly drawn surfaces per cell. The reported quantity is the fraction of
      surfaces on which the dichotomy holds. It MUST be 1.00 at deg b = 6 and
      MUST fall above it. A fraction that stays at 1.00 across the whole sweep is
      the canonical artifact tell -- a quantity that does not decay when the
      parameter meant to destroy it increases -- and forces an artifact report
      rather than a finding. Monotonicity across the seven cells is reported
      explicitly.
    ordering_control: >-
      Stage 0 and Stage 1 outputs -- the E8 root list, the admissible
      (rank, count) table, the recomputed mark table, the ceiling 6, the
      forbidden value 5, and the instrument's reachable range -- are written and
      hash-committed BEFORE any archived surface record is opened. The
      predictions G1 = 0, G2 = 1.00, G3 = 1.00 are frozen at the same moment.
      NULL-A is run and committed before the treatment arm is looked at.
    comparability_policy: >-
      No number from this contract may be compared with a number from
      EXP-XEDN-002..007 except where this contract recomputes it from the same
      committed inputs and reports both side by side. In particular the
      recomputed Shioda rank and the recorded naive-Gram rank are DIFFERENT
      QUANTITIES and their difference is never reported as a finding about a
      surface. Cross-contract comparison beyond that requires a separately
      registered comparator.

  metrics:
    primary:
      - G1_dichotomy_violations: count of pure-stratum surfaces whose group-law-verified shortest relation has infinity norm neither 1 nor absent
      - G2_case_O_identification_rate: fraction of null-metric surfaces whose recomputed root system is exactly A1^r
      - G3_ade_admissibility_rate: fraction of recomputed (rank, positive-root count) pairs realisable inside E8 under the Shioda pairing
      - G4_instrument_max_return: the maximum value shortest_relation_group_law returns on the synthetic inf-norm-4 configuration
      - G5_planted_control_premise_violation: which premise, if any, CTRL-P violates
    secondary:
      - G6_affine_ladder_norms: the six returned norms for affine A4, D4, D6, E6, E7, E8
      - G7_null_arm_diagonal: recomputed Shioda diagonal and ADE admissibility on the chi = 2 arm
      - G8_graded_dichotomy_fraction: per-cell fraction across deg b in {6..12}, with monotonicity
      - G9_dynkin_type_spread: number of distinct realised Dynkin types
      - per-surface table: discriminant, squarefree flag, fibre types, per-slot Shioda height, Shioda Gram, rank, type, relation lattice basis, minimal-support relations, recorded naive rank, recorded metric
      - re-enumeration agreement rate between the frozen predicate and the archived slot lists

  preregistered_prediction:
    - quantity: G1_dichotomy_violations
      formula: "0, exactly"
      source: "H-XEDN-906489 P1, derived from the (rank, positive-root count) classification of simply-laced root systems"
    - quantity: G2_case_O_identification_rate
      formula: "1.00, exactly"
      source: "H-XEDN-906489 P1 Case O: N = r iff A1^r iff no relation exists"
    - quantity: G3_ade_admissibility_rate
      formula: "1.00 on the pure stratum"
      source: "HEUR-X1: the realised system is a root subsystem of E8"
    - quantity: G4_instrument_max_return
      formula: "None or fall-through; never 4"
      source: "read from run_census.sage: coeff_bound = 3, max_support = 3, plus a support-4 arm restricted to {-1,+1}"
    - quantity: G6_affine_ladder_norms
      formula: "(1, 2, 2, 3, 4, 6), non-decreasing in that order"
      source: "largest marks of affine A_n, D_n, E6, E7, E8, recomputed in Stage 1 rather than quoted"
    - quantity: G7_null_arm_diagonal
      formula: "4, not 2"
      source: "hhat = 2 chi with chi = 2 at deg b = 10"
    - quantity: G8_graded_dichotomy_fraction
      formula: "1.00 at deg b = 6, strictly falling for deg b >= 7"
      source: "the root argument holds only at chi = 1"
    - quantity: minimal_support_norm_spectrum
      formula: "subset of {1,2,3,4,6}; the value 5 is impossible"
      source: "H-XEDN-906489 P2, affine mark ceiling"

  replication:
    seeds: [906489, 906490]
    independent_instances: 2
    note: >-
      Stages 0-2 are deterministic given the archived inputs and are not
      seed-dependent; the two seeds govern the fresh-enumeration and graded arms
      only. Reporting the same deterministic number twice is not replication and
      is not counted as such.

  budget:
    maximum_runs: 4
    maximum_wall_seconds: 5400
    maximum_cpu_seconds: 10800
    maximum_memory_gb: 2
    maximum_total_disk_bytes: 2147483648
    maximum_workers: 1
    no_network: true

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived and authorized by the Coordinator; it carries no approved_by field.
    - Stop after Stage 0 if the dichotomy fails on any synthetic saturated set; that failure is the deliverable.
    - Stop after Stage 1 if the recomputed affine marks contradict the ceiling of 6 or produce a largest mark of 5.
    - Stop before the treatment arm if NULL-A has not been run and hash-committed.
    - Stop and report an artifact if CTRL-G's dichotomy fraction does not fall for deg b >= 7.
    - Stop on any budget, memory or integrity failure.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any conclusion drawn from the naive-degree Gram rather than the recomputed Shioda pairing.
    - Any pooling of premise-violating surfaces into the treatment stratum.
    - Any relation counted as verified on specialisation alone, without group-law verification over F_p(t).
    - Any archived file used without its sha256 recorded first.
    - CTRL-P found to satisfy every premise while reporting 2 -- in which case the package reports the refutation and NO negative statement about the lane's observable.
    - CTRL-L failing to return 6 on the affine-E8 circuit -- in which case no coefficient conclusion may be reported from any arm.

  success_criterion: >-
    A complete, controlled readout in which: the Stage-0 dichotomy holds on every
    synthetic saturated set; the Stage-1 recomputed mark table gives a ceiling of
    6 with no largest mark equal to 5 and CTRL-L returns (1,2,2,3,4,6);
    G1 = 0 exactly, G2 = 1.00 and G3 = 1.00 on the pure stratum; G4 never returns
    4; CTRL-P's deviation is explained by exactly one named premise violation;
    NULL-A returns diagonal 4 with non-ADE-constrained pairs; CTRL-G's fraction
    is 1.00 at deg b = 6 and falls above it; and G9 >= 4 distinct Dynkin types,
    so the replacement observable is shown to have comparator spread. That
    disposition supports ONLY the toy-scope statement in claim_ceiling, and
    establishes no ECDLP attack, cost, exponent, cryptographic-scale or
    deployed-scheme conclusion.

  falsification_criterion: >-
    Any of: a pure-stratum surface with a group-law-verified shortest relation of
    infinity norm >= 2 (G1 > 0); a minimal-support relation of infinity norm
    exactly 5 or greater than 6; shortest_relation_group_law returning >= 4 on
    the synthetic driver; CTRL-P satisfying every premise while reporting 2;
    NULL-A reproducing the chi = 1 behaviour exactly; CTRL-L failing to return 6;
    or CTRL-G showing no decay above deg b = 6. Each falsifies a named part of
    H-XEDN-906489 and each is reported as the primary result rather than as a
    setback.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: review_required draft; no run, no evidence,
      no mathematical inference.
    controlled_confirmation: >-
      Only after separate approval, freezing and authorization. Scoped toy-only.
      MUST be accompanied by the replacement deliverable -- the per-surface
      Dynkin type table and its spread -- or the package is incomplete under
      stopping rule F7 of H-XEDN-906489.
    controlled_refutation: >-
      Any falsification criterion firing. This is a first-class outcome and the
      package is complete when it names which premise failed and what remains
      open.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, missing archived file, missing dependency, or unreadable
      artifact is reported as INFRASTRUCTURE SIGNAL and is NEVER negative
      mathematical evidence against H-XEDN-906489 or any ECDLP proposition
      (AGENTS.md rule 5). In particular, the absence of Sage in this environment
      is an infrastructure fact about the container, not a fact about the
      mathematics, and no arm may be reported as failed on that ground.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      The algebraic core -- the root-system dichotomy and the affine mark ceiling
      -- is a statement about lattices and does not depend on p at all, so if it
      holds it holds for every prime, including cryptographic ones. THAT IS NOT A
      CRYPTO-SCALE RESULT AND MUST NOT BE READ AS ONE: what transfers is a
      statement about an OBSERVABLE on a toy surface family, not about any curve,
      any attack, or any cost. The empirical arms are toy in the ordinary sense
      (p in {7,13,19,31}, a handful of surfaces per cell) and support nothing
      beyond their own cells. The graded arm's conclusions are limited to
      deg b <= 12, and no arm licenses any statement about chi >= 3.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its sha256.
    - Stage-0 output: the 240-root E8 list, its Gram, the transitivity orbit computation, the admissible (rank, count) table, all hashed.
    - Stage-1 output: the recomputed affine mark table with attaining configurations, the ceiling, the absence of 5, and the instrument-reachability driver with its synthetic configuration, all hashed before Stage 2 opens any archived file.
    - The sha256 of every archived file read, recorded before reading.
    - Stage-2 per-surface table with every column named in metrics.secondary, in a canonical JSON encoding with sorted keys.
    - Group-law verification transcripts for every relation reported, and specialisation transcripts reported separately.
    - NULL-A, CTRL-P, CTRL-L and CTRL-G results with their forced values quoted beside the measured ones.
    - Re-enumeration agreement rate against the archived slot lists.
    - manifest.yaml, environment.json, command.txt, stdout.log, stderr.log per run, with git commit and dirty-tree state, and the resolved inference block.
    - execution_report.md stating, in its first paragraph, which stage could have terminated the run and whether it did.

  approval_requirements:
    - Independent review confirms that the forced values are derived rather than fitted, and that every one of them can actually fail.
    - Independent review confirms that CTRL-P and CTRL-L are genuine sensitivity demonstrations and that the no-negative-without-them rule is enforceable as written.
    - Coordinator separately approves and freezes without editing this draft.
    - Coordinator confirms that nothing in the package licenses a sentence on DEC-20260724-021's forbidden list.

  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    draft is not approved, and only the Coordinator may approve it
    (AGENTS.md rule 1).
