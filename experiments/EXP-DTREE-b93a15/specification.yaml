experiment:
  id: EXP-DTREE-b93a15
  hypothesis_id: H-DTREE-8636a3
  version: 1
  title: >-
    PER-RUN IMMUNITY AUDIT of the 21 archived runs of EXP-MTIC-001 and
    EXP-FIB-001 against the confirmed harness/semaev.py s4_expr
    variable-collision bug and the build_factor_base whole-curve sampling:
    provenance read first, bit-exact recomputation with the fix only where
    the path is exposed, the EV-DTREE-2e8f6a cells as the instrument's
    positive control, and a 21-row classification table (AFFECTED / IMMUNE
    / SUPERSEDED with reason strings) as the deliverable
  status: approved
  status_note: >-
    Frozen at version 1 and approved on 2026-10-05 by the Coordinator
    decision DEC-20261005-a67fea under the STANDING USER AUTHORIZATION
    (AGENTS.md). Protocol readiness verified: every field non-null; controls,
    metrics, budget, stopping rules, invalidation rules, artifact paths and
    assignment present; both criteria decidable from the metrics. Approval
    authorizes the audit and asserts nothing about H-DTREE-8636a3. No run
    authorized before this mark; execution awaits a dispatched executor card
    satisfying the standing three preconditions. Changes require a versioned
    protocol_amendment under experiments/EXP-DTREE-b93a15/amendments/.
  source_proposal: null
  source_proposal_note: >-
    Designed from knowledge/open-problems/KN-OPEN-5b3a08; see
    H-DTREE-8636a3 source_note.
  objective: >-
    Produce the 21-row per-run classification that closes KN-OPEN-5b3a08's
    audit half: for each archived run of EXP-MTIC-001 and EXP-FIB-001,
    whether the confirmed shared-harness defects (D1 s4_expr variable
    collision; D2 build_factor_base whole-curve sampling) reach its code
    path, and where they do, whether recomputation with the fix reproduces
    every reported number bit-exactly. AFFECTED runs get superseding repair
    records under new ids (never edits); IMMUNE and SUPERSEDED runs close
    their rows. NO SCIENCE IS RE-RUN beyond same-computation recomputation
    on archived inputs and seeds.
  class: >-
    evidence-integrity audit (provenance reading + bit-exact recomputation),
    succeeding EXP-DTREE-001's exposure discovery. No distributional
    statistics; the only control content is the positive-control
    reproduction of the known-affected cells.
  inputs:
    archived_runs: >-
      The 21 runs named by KN-OPEN-5b3a08: EXP-MTIC-001 (11 runs) and
      EXP-FIB-001 (10 runs), each read at its manifest's recorded code
      identity (git checkout of the recorded commit, never the current
      tree). A run the audit finds exposed in those experiments but absent
      from the named list is added with its id.
    defects:
      D1: harness/semaev.py s4_expr variable-collision (.subs() calls), confirmed by EV-DTREE-2e8f6a.
      D2: build_factor_base whole-curve (non-target-subgroup) sampling, per KN-OPEN-5b3a08.
    code_reuse: >-
      The EV-DTREE-2e8f6a verifier may be copied into implementation/ with
      provenance; every classification must rest on this audit's own reads
      and recomputations with manifests carrying the AGENTS.md
      artifact-policy fields.
  controls:
    - >-
      C1 POSITIVE CONTROL (instrument gate, runs first): reproduce
      EV-DTREE-2e8f6a's known-affected cells exactly -- the independent
      point-addition verifier's outputs and the direct source-read
      conclusion. The classifier must mark those cells AFFECTED (under the
      pre-workaround path). Disagreement invalidates the audit before any
      of the 21 rows.
    - >-
      C2 UNREADABLE-PROVENANCE NULL: a run whose manifest lacks code
      identity is classified from its experiment specification's named code
      path; if that is also absent, it is AFFECTED-UNKNOWN with the gap
      recorded -- never silently IMMUNE.
    - >-
      C3 RECOMPUTE-ONLY-WHERE-EXPOSED: recomputation happens only for runs
      whose path is shown exposed; an unexposed path is IMMUNE by reading,
      and the reason string cites the import analysis.
  independent_variables:
    - the 21 (or audit-extended) archived runs
    - defect in {D1, D2} per run's path exposure
  metrics:
    - per-run classification with reason string
    - recomputation mismatches (archived number, fixed number, delta) where exposed
    - wall time (diagnostic only)
  heuristic_under_test: null
  heuristic_under_test_note: >-
    No heuristic: a provenance and reproducibility audit. H-DTREE-8636a3's
    claim is read off the completed table.
  preregistered_prediction: >-
    Not directional: all-IMMUNE/SUPERSEDED supports the claim; any
    AFFECTED run falsifies it at that run and triggers the superseding
    repair. Both outcomes are recorded.
  scale_relevance: >-
    Evidence integrity for 21 archived toy-tier runs; no new scale claims.
    The audit protects the citations of every other harness-dependent record.
  tail_checks:
    - C1 gate passes before any of the 21 rows is classified.
    - Every IMMUNE row's reason string cites the import analysis (path shown clean) or the bit-exact recomputation.
    - Every AFFECTED row names the defect, the changed number, and the repair-record id once written.
  replication: >-
    Deterministic (reads at recorded commits; recomputation on archived
    seeds); a rerun is bit-comparable. Independent-session replication is
    the normal review path.
  budget:
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 1
    workers: 1
    note: >-
      Machine protection only; reading and small recomputations dominate.
      The shared-harness FIX itself is out of scope (separate code task).
  stopping_rules:
    - >-
      Stop after the single audit covers every named (and audit-added) run,
      or at the first unclassifiable run (recorded as AFFECTED-UNKNOWN or
      its gap), whichever comes first; archive either way.
    - >-
      Timeout, crash, environment gap (a recorded commit that no longer
      builds): infrastructure stop at that run, never evidence.
  invalidation_rules:
    - >-
      C1 disagreement (the known-affected cells do not reproduce): audit
      invalid, no row stands.
    - >-
      A classification whose reason string does not name its evidence
      (import analysis or recomputation) is not a classification; the row is
      redone.
    - >-
      No claim wording beyond H-DTREE-8636a3's interpretation limits: no
      statement about other experiments' runs and no harness-fix claim.
  success_criterion: >-
    A completed audit with C1 passing and a 21+-row table where every row
    carries AFFECTED / IMMUNE / SUPERSEDED with a reason string, plus the
    mismatch list for every recomputed run. Either verdict (all clean, or
    named AFFECTED set with repairs) completes the experiment.
  falsification_criterion: >-
    Any run classified AFFECTED (exposed path + a number that changes
    under the fix, with C1 passing). The repair record under a new id is
    the refutation artifact.
  required_artifacts:
    - experiments/EXP-DTREE-b93a15/specification.yaml
    - experiments/EXP-DTREE-b93a15/implementation/ (provenance reader + recomputation harness)
    - experiments/EXP-DTREE-b93a15/runs/<RUN-ID>/ (command.txt, environment.json, stdout.log, stderr.log, manifest.yaml, the classification table JSON)
    - experiments/EXP-DTREE-b93a15/RESULTS.md (the table + verdict)
    - a Coordinator evidence record and decision citing both, on review.
  measured_vs_modeled: >-
    Measured: classifications and mismatches. Modeled: none. The archived
    numbers are the baseline the fixed recomputation is compared to
    bit-exactly.
  claim_tier_note: >-
    Integrity-audit tier. Observations only until the separate review
    process supports a state transition; an AFFECTED verdict questions a
    run's numbers, never the hypotheses it tested.
  drafting_provenance: >-
    Contract restated from H-DTREE-8636a3's frozen fields by the
    Coordinator session of 2026-10-05 (opencode runtime, branch
    coord/s4expr-audit-20261005) under DEC-20261005-a67fea's approval. No
    new scientific content beyond the hypothesis record.
  assigned_to: executor
  approved_by: coordinator
