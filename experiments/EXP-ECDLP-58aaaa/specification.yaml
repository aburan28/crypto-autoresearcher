# =============================================================================
experiment:
  id: EXP-ECDLP-58aaaa
  hypothesis_id: H-ECDLP-03e287
  question_id: RQ-ECDLP-bc7a54
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-4c39d3
  version: 1
  title: >-
    Ordinary-to-random interpolation degree ratio on the small-x set
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-fade50
    withheld_reason: >-
      check_approval_capacity rejects an approval of this contract.
      python3 tools/portfolio_kpis.py --capacity GOAL-ECDLP-001
      reports approved_unrun=7 against cap 3, headroom 0. The seven
      contracts are EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc,
      EXP-ECDLP-b2e5d1, EXP-ECDLP-c74a83, EXP-LHW-22aefa,
      EXP-SEMAEV-a097b5, and EXP-SMTH-9d04ba. This decision does not
      retire one of them. The launcher is also missing. There is no
      committed program that tabulates a prime-order subgroup, draws
      S inside {Q : x(Q) < p^{2/3}}, and reports the minimal total
      degree of a bivariate polynomial over F_p agreeing with the
      discrete log on S, the same degree for two random bijections,
      and the same degree on one anomalous curve. A search of
      origin/main for the phrase "minimal total degree" under *.py
      and *.md returned no path. A trial plan requires status
      approved, which this capacity check refuses. This session did
      not compute a degree.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval both frees a capacity slot and adds the
      missing degree driver, work only at N in (2^{10}, 2^{12}), on
      two ordinary curves and one anomalous curve, with two random
      bijections. Do not build a window table. Do not use bit windows
      of width 32 or 33. Do not use y^2 = x^3 + x + 1. Do not transfer
      a degree ratio to cryptographic N.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the ordinary degree ratio is at least 1/2. The
    ratio is the minimal total degree of a bivariate polynomial
    agreeing with the discrete log on S, divided by the minimum of
    the same degree on two random bijections. The concrete negative
    is a ratio strictly below 1/2 on both ordinary curves. No faster
    discrete-logarithm algorithm is in scope.

  inputs:
    curves: >-
      Two ordinary prime-order short-Weierstrass curves over F_p with
      subgroup size N in (2^{10}, 2^{12}), and one anomalous curve of
      similar size. The equation y^2 = x^3 + x + 1 is not used.
    subset: >-
      D_x is the set of subgroup points with integer x strictly less
      than p^{2/3}. S is a subset of D_x with |S| = min(|D_x|,
      ceil(2 N^{1/2})), quotiented by negation so that Q and -Q are
      not both charged as independent targets.
    random_labels: >-
      Two independent bijections from Z/N to labels in F_p^2. The
      denominator of the ratio is the minimum of their two minimal
      total degrees on a subset of the same size.
    anomalous: >-
      The same fitter on one anomalous curve of similar size. The
      degree ratio there must be strictly below 1/2, or the instrument
      is blind.
    excluded: >-
      Do not build a window table. Do not use bit windows of width 32
      or 33. Do not use y^2 = x^3 + x + 1.

  controls:
    - id: random-stability
      statement: >-
        The two random bijections differ by at most a factor of 2 in
        minimal degree. A wider gap is instrument_failure.
    - id: dimension-threshold
      statement: >-
        Each random degree is at least half the smallest d with
        (d+1)(d+2)/2 >= |S|. A lower random degree fails HEUR-1 and
        voids the comparison.
    - id: anomalous-drop
      statement: >-
        The anomalous degree ratio is strictly below 1/2. Otherwise
        the instrument is blind and the ordinary ratio is not evidence.
    - id: negation-quotient
      statement: >-
        Q and -Q are not both charged as independent targets. Scoring
        them as two points voids the run.
    - id: subset-size
      statement: >-
        |D_x| is large enough that |S| is at least 2 N^{1/2}, or |S|
        equals |D_x| and that shortfall is reported. A |D_x| below 2
        voids the cell.
    - id: excluded-curve
      statement: >-
        y^2 = x^3 + x + 1 is not used. Using it voids the run.

  independent_variables:
    - whether the arm is an ordinary curve, the anomalous curve, or a random bijection
    - which of the two ordinary curves in the ladder
    - which of the two random bijections

  metrics:
    primary:
      - id: degree_ratio_ordinary
        statement: >-
          Minimal total degree on an ordinary curve, divided by the
          minimum of the two random-bijection degrees. The idea's
          prediction is a ratio at least 1/2 on both ordinary curves.
          The concrete negative is a ratio strictly below 1/2 on both.
    secondary:
      - id: degree_ordinary
        statement: minimal total degree on each ordinary curve
      - id: degree_random
        statement: minimal total degree on each random bijection
      - id: degree_ratio_anomalous
        statement: the anomalous degree ratio
      - id: subset_sizes
        statement: N, |D_x|, and |S| on each curve
      - id: random_degree_factor
        statement: the ratio of the larger random degree to the smaller

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says a random labelling meets the dimension threshold up
    to a factor of 2. It is scored on the two bijections before the
    ordinary ratio is read. A random degree below half the dimension
    threshold fails HEUR-1 and does not by itself replace the ratio
    test.

  preregistered_prediction:
    quantity: >-
      The ordinary-to-random degree ratio on the small-x set, and the
      anomalous calibration ratio.
    formula: >-
      degree_ratio_ordinary >= 1/2 on both ordinary curves, and
      degree_ratio_anomalous < 1/2. The concrete negative is
      degree_ratio_ordinary < 1/2 on both ordinary curves after the
      anomalous ratio is strictly below 1/2 and the two random degrees
      differ by at most a factor of 2. Source idea
      IDEA-20261006-4c39d3, predictions minimum_effect >= 1/2 and
      < 1/2. No degree was computed before this formula was written.
    source: >-
      IDEA-20261006-4c39d3. KR-RHO-13bf67, KR-RHO-ea34b8,
      KR-RHO-fb88e6, KR-RHO-5b1c0a, and KR-IC-f5c584 were opened in
      this session. They do not state this ordinary-to-random degree
      ratio.

  scale_relevance:
    tier: toy
    justification: >-
      N lies in (2^{10}, 2^{12}). No transfer to cryptographic N is
      assumed. The minimum effect is the idea's own: a ratio of at
      least 1/2.
    correspondence: >-
      Direct tabulation of the subgroup. No Deuring correspondence
      is used.

  tail_checks:
    - >-
      A ratio of at least 1/2 on both ordinary curves meets the
      prediction. A ratio strictly below 1/2 on both, with the
      instrument checks passed, is the negative. No third threshold
      is introduced after a degree is seen.
    - >-
      The anomalous ratio must be strictly below 1/2 or the ordinary
      ratio is not read as evidence.

  replication:
    seeds:
      - EXP-ECDLP-58aaaa|ordinary-1|deterministic
      - EXP-ECDLP-58aaaa|ordinary-2|deterministic
      - EXP-ECDLP-58aaaa|anomalous|deterministic
      - EXP-ECDLP-58aaaa|bijection-1|deterministic
      - EXP-ECDLP-58aaaa|bijection-2|deterministic
    independent_instances: 1
    note: >-
      One later manifest would cover both ordinary curves, the
      anomalous curve, and both bijections. No run id is minted in
      this session. The replication plan does not name a future run
      slot, because the trial plan is not frozen while status is
      review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen ladder. Wall-clock
      and CPU figures are not set. The 4 GB figure is machine
      protection for one tabulated group of size at most 2^{12} and
      one degree search. A watchdog expiry is failed_infrastructure,
      not a degree ratio.

  stopping_rules:
    - Stop after a reading row is named from the two ordinary ratios and the anomalous ratio.
    - Do not change the threshold 1/2 after seeing a degree.
    - Do not run a discrete-log solve beyond the exhaustive table that the degree check uses.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - Random degrees differing by more than a factor of 2, a random degree below half the dimension threshold, a |D_x| below 2, a missing negation quotient, or use of y^2 = x^3 + x + 1 voids the run.
    - An anomalous ratio that is not strictly below 1/2 makes the instrument blind. The ordinary ratio is then not evidence.
    - Transferring a toy degree ratio to cryptographic N voids the run.

  success_criterion: >-
    The instrument checks pass, the anomalous degree ratio is strictly
    below 1/2, and the ordinary degree ratio is at least 1/2 on both
    ordinary curves. That ratio threshold is the prediction of
    IDEA-20261006-4c39d3. The conjunction is reachable as a failure
    when the instrument checks pass and both ordinary ratios are
    strictly below 1/2.

  falsification_criterion: >-
    The instrument checks pass, the anomalous degree ratio is strictly
    below 1/2, and the ordinary degree ratio is strictly below 1/2 on
    both ordinary curves. That is the concrete negative. One ordinary
    curve below 1/2 and the other at least 1/2 is not this sentence.
    An anomalous ratio that is not strictly below 1/2 is a blind
    instrument and is not this sentence. A calibration failure and a
    crash are not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that both ordinary degree
      ratios are at least 1/2 at this toy N, with the anomalous ratio
      strictly below 1/2. The rho exponent stays 1/2. No knowledge
      entry is promoted from this design record.
    on_negative: >-
      A later evidence review may record that both ordinary degree
      ratios are strictly below 1/2, with the instrument checks passed
      and the anomalous ratio strictly below 1/2, so this interpolation
      claim is falsified on this toy ladder only. The rho exponent
      stays 1/2. The two outcomes name different ratios.

  required_artifacts:
    - experiments/EXP-ECDLP-58aaaa/runs/RUN-*/manifest.yaml
    - experiments/EXP-ECDLP-58aaaa/runs/RUN-*/raw-result.json
    - experiments/EXP-ECDLP-58aaaa/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the random degrees differ by more than a factor of 2, a random
        degree is below half the dimension threshold, |D_x| is below 2,
        the negation quotient is missing, or y^2 = x^3 + x + 1 is used
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: blind
      when: >-
        the other instrument checks pass and the anomalous degree ratio
        is not strictly below 1/2
    - id: ratio_below
      when: >-
        the instrument checks pass, the anomalous ratio is strictly
        below 1/2, and both ordinary ratios are strictly below 1/2
    - id: ratio_mixed
      when: >-
        the instrument checks pass, the anomalous ratio is strictly
        below 1/2, and exactly one ordinary ratio is strictly below 1/2
    - id: ratio_at_least_half
      when: >-
        the instrument checks pass, the anomalous ratio is strictly
        below 1/2, and both ordinary ratios are at least 1/2
  reading_rule: >-
    Name exactly one row. ratio_at_least_half is the only success row.
    ratio_below is the concrete negative. ratio_mixed is not support
    and is not the falsification sentence. blind, instrument_failure,
    and infrastructure are not ratios. Record N, |D_x|, |S|, both
    ordinary degrees, both random degrees, the anomalous degree, and
    attack_claimed false beside the row. Those fields do not change
    the row.
