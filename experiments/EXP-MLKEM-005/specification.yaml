experiment:
  id: EXP-MLKEM-005
  hypothesis_id: H-MLKEM-005
  goal_id: GOAL-MLKEM-002
  version: 1
  title: >-
    Library-facing adequacy probe and preflight-or-widen second peer for the
    ML-KEM comparison-conformance isolation gate
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-24'
  claim_tier: laboratory_implementation_conformance
  objective: >-
    Repair the two DEC-20260724-015 defects that left EXP-MLKEM-004 incomplete:
    (1) replace the harness-tautology synthetic control with a library-facing
    interposed or independently injected defective comparator object that
    G2/G3 must detect through the library call path without special-casing
    len(diffs)==1; (2) either pin a concrete fixed-bound hand-written
    comparison target with design-time preflight mechanism evidence, or
    explicitly widen the mechanism criterion with recorded rationale so a real
    optimized-compare peer is measured rather than predetermined
    second_impl_unavailable. Then decide isolation versus systemic under the
    repaired gate.

  repairs_from_EXP_MLKEM_004:
    library_facing_adequacy: >-
      CTRL-LIBRARY-FACING-ADEQUACY replaces CTRL-SYNTHETIC-BASELINE-INVISIBLE.
      Detection must be observed through the library's compare/decap entry that
      services the interposed or injected defective comparator object. Generator
      and marginal scoring must not special-case len(diffs)==1.
    preflight_or_widen_second_peer: >-
      Design-time preflight cites EV-MLKEM-007: BoringSSL, PQClean avx2/aarch64
      verify, mlkem-native, and aws-lc were rejected as length-parameterized
      compares under the strict fixed-bound-tail criterion, emptying the
      preferred public neighborhood. Strict fixed-bound remains preferred if a
      new preflight finds a reachable target. Otherwise the load-bearing
      criterion widens to optimized_compare_neighborhood with recorded rationale,
      defaulting to PQClean ml-kem-1024 avx2 verify as the first widened peer.

  design_time_preflight:
    date: '2026-07-24'
    basis:
      - EV-MLKEM-007
      - experiments/EXP-MLKEM-004/analysis/second_implementation_selection.md
      - experiments/EXP-MLKEM-004/source-lock.yaml
    strict_fixed_bound_search:
      disposition: empty_preferred_public_neighborhood
      exhausted_candidates:
        - {name: BoringSSL, result: rejected_mechanism_mismatch}
        - {name: PQClean_avx2_verify, result: rejected_mechanism_mismatch}
        - {name: PQClean_aarch64_verify, result: rejected_mechanism_mismatch}
        - {name: mlkem-native, result: rejected_mechanism_mismatch}
        - {name: aws-lc, result: rejected_mechanism_mismatch}
      note: >-
        No additional offline fixed-bound hand-written ML-KEM comparison target
        was identified at design time beyond the EXP-MLKEM-004 exhaustion set.
        Executor must still re-check the strict preference order once at run
        start before applying the widened lock.
    widening:
      active_at_freeze: true
      criterion_id: optimized_compare_neighborhood
      rationale: >-
        DEC-20260724-015 requires the isolation question to be asked of a real
        peer rather than predetermined second_impl_unavailable. With the strict
        fixed-bound neighborhood empty among preferred public candidates
        (EV-MLKEM-007), the load-bearing second peer is the nearest reachable
        optimized CT-compare implementation: vectorized or block-stepped
        ciphertext verify, including length-parameterized SIMD verify.
      claim_boundary: >-
        A null under optimized_compare_neighborhood does not license isolation
        under the strict fixed-bound-tail mechanism class of H-MLKEM-004.
      default_widened_peer:
        name: PQClean
        repository: https://github.com/PQClean/PQClean
        path_hint: crypto_kem/ml-kem-1024/avx2/verify.c
        reason: >-
          Previously rejected only for strict fixed-bound mismatch; under the
          widened criterion it is an evidenced optimized-compare peer already
          inspected in EXP-MLKEM-004.

  inherited_objections_addressed:
    OBJ-DEC015-001: Library-facing interposed/injected control replaces harness tautology.
    OBJ-DEC015-002: Preflight-or-widen second-peer rule prevents predetermined unavailability.
    OBJ-RT003-001: Strict fixed-bound remains preferred; widened peer is explicitly scoped.
    OBJ-RT003-002: KN-TECH-054 precedence reachability retained.
    OBJ-RT003-003: Exact-command and build accounting retained.
    OBJ-RT003-004: Anchor grade cites the file actually validated against.
    OBJ-RT003-005: Non-measurements labeled not_measured / refused_by_harness.

  source_lock:
    wolfssl:
      repository: https://github.com/wolfSSL/wolfssl
      prefix_tag: v5.9.1-stable
      prefix_commit_peeled_expected: 1d363f3adceba9d1478230ede476a37b0dcdef24
      postfix_tag: v5.9.2-stable
      postfix_commit_peeled_expected: ac01707f552c611fbd135cc723b2682b3e7f80f2
      role: known_defective_detection_retention_control_and_patched_control
      established_by: EV-MLKEM-005
    second_implementation:
      selection_rule: >-
        At run start, re-evaluate the strict fixed-bound preference order:
        (1) BoringSSL ML-KEM assembly or fixed-bound compare if reachable;
        (2) PQClean ML-KEM with fixed-bound hand-written assembly comparison
        tails if reachable; (3) another pinned public fixed-bound target.
        If any strict candidate is buildable with mechanism evidence, pin it
        as criterion_used=strict_fixed_bound. Otherwise lock
        criterion_used=widened_optimized_compare and select the first buildable
        peer from: (W1) PQClean ml-kem-1024 avx2 verify; (W2) liboqs 0.12.x
        ML-KEM verify used as an optimized-compare peer (not as a silent
        fixed-bound stand-in); (W3) another pinned public optimized CT-compare.
        Record repository, pin, mechanism evidence, criterion_used, why chosen,
        and why each higher preference was rejected.
      requirement: >-
        Both its comparison routine and its public decapsulation entry point
        must be reachable; if only one is reachable, scope the verdict and do
        not claim isolation.
    fips_203:
      publication_date: '2024-08-13'
      doi: 10.6028/NIST.FIPS.203
      normative_algorithms: [17, 18]

  inputs:
    parameter_sets:
      ML-KEM-512: {ciphertext_bytes: 768}
      ML-KEM-768: {ciphertext_bytes: 1088}
      ML-KEM-1024: {ciphertext_bytes: 1568}
    keys_per_parameter_set: 4
    seed_policy: >-
      Four recorded seeds per parameter set. Seeds, ciphertext SHA-256, and
      shared-secret SHA-256 archived for every key; first key per parameter set
      archived as raw bytes under experiments/EXP-MLKEM-005/vectors/.
    library_facing_adequacy_control:
      id: CTRL-LIBRARY-FACING-ADEQUACY
      construction: >-
        An externally interposed or independently injected defective comparator
        object on the library compare call path that, for a designated silent
        region R of the ciphertext (default: the final 32 bytes of ML-KEM-1024,
        indices 1536..1567), returns equal for every single-byte difference
        confined to R, and returns unequal for at least one seeded multi-byte
        coordinated pattern in R (G2) and for at least one alignment/lane-
        boundary pattern in R (G3). Outside R, the comparator is exact. Library
        source, buffer lengths, and dispatch conditions are never modified.
        Attestation must show the interposed/injected object is the compare
        path exercised by the primitive and/or decapsulation probes.
      scoring_rule: >-
        G2_minus_G1 / G3_minus_G1 must be computed only from compare-return and
        decap-accept observations. Generators and scorers must not special-case
        len(diffs)==1 or hard-code acceptance of single-byte-in-R patterns.
      pass_condition: >-
        G1 silent set on the adequacy control equals R (or a documented
        superset confined to R); G2_minus_G1 or G3_minus_G1 attributable to the
        control is non-empty via the library call path; the known wolfSSL
        defect remains separately detected on unmodified library builds.
    generator_classes:
      G1_single_byte:
        description: xor 0x01 and xor 0xff at every ciphertext index.
      G2_multi_byte:
        description: >-
          Seeded coordinated flips of k contiguous and k scattered bytes for k
          in [2, 4, 8, 16], plus whole 16/32/64 byte block inversions, at seeded
          offsets covering the full length.
      G3_alignment:
        description: >-
          Mutations at every 16, 32, and 64 byte boundary index, at the last
          byte of each aligned block, and at the final partial block.
      G4_malformed_length:
        description: >-
          Truncated by 1/16/32 and extended by 1/16/32 bytes, submitted only to
          the public API. Never counted as a comparison omission.
      G5_key_dependence:
        description: Every class of G1 through G4 replayed across all four keys.
    probe_levels:
      primitive: Ciphertext comparison routine of each backend.
      decapsulation: Public decapsulation API versus honest shared secret and implicit rejection.

  controls:
    - id: CTRL-LIBRARY-FACING-ADEQUACY
      method: >-
        Run G1, G2, and G3 through the library entry that exercises the
        interposed/injected defective comparator before any substantive
        isolation conclusion.
      pass_condition: >-
        Undetected by G1 on region R and detected by G2 or G3 with non-empty
        marginal findings attributable to R, without len(diffs)==1 special-casing.
    - id: CTRL-POSITIVE-CONTROL-RETAINED
      method: Run every generator class against unmodified wolfSSL v5.9.1 AVX2.
      pass_condition: >-
        Every class reaching 1536..1567 detects that omission at the primitive
        level; decapsulation accepts at least one mutated ciphertext in that
        region.
    - id: CTRL-NEGATIVE-HARNESS
      method: Retain the deliberately truncated harness comparator from EXP-MLKEM-002/003/004.
      pass_condition: Each class flags exactly the omitted range it can reach.
    - id: CTRL-BACKEND-ATTESTATION
      method: >-
        Attest each backend by build configuration, symbol or disassembly
        evidence, and at least one decapsulation-boundary measurement for every
        backend receiving a conformance verdict. Attest interposition/injection
        for the adequacy control separately.
      pass_condition: No verdict on an unattested or primitive-only backend.
    - id: CTRL-STRONG-ANCHOR
      method: >-
        Validate against NIST ACVP ML-KEM encapDecap vectors if retrievable, or
        an in-tree KAT that is not shipped by the same implementation under
        test when grading that implementation strong.
      pass_condition: >-
        Anchor named and graded. For an implementation under test, its own
        shipped vectors may be used only as weak or in_tree_self. Downloaded
        but unused NIST files must not upgrade the grade.
    - id: CTRL-MESSAGE-STABILITY
      method: Annotate each decapsulation accept with whether the mutated ciphertext still decrypts to the honest message.
      pass_condition: Accepts coincide with message-stable mutations, or every exception is enumerated.
    - id: CTRL-SECOND-PEER-SELECTION
      method: >-
        Record criterion_used (strict_fixed_bound or widened_optimized_compare),
        mechanism evidence, and preference-order disposition.
      pass_condition: >-
        Selection rationale and mechanism evidence present, or
        second_impl_unavailable recorded after exhausting the frozen order.
    - id: CTRL-LENGTH-TABLE-SEPARATION
      method: Record every G4 result in a dedicated malformed-length table.
      pass_condition: No malformed-length result appears in any silent set.
    - id: CTRL-EXACT-COMMAND-AND-BUILD-ACCOUNTING
      method: >-
        Every run's command.txt is exact executable argv. Library clone/configure
        /build wall-clock is either inside a recorded run or in a separately
        archived pre-run stage with its own timing receipt referenced by the
        run manifests.
      pass_condition: No descriptive pipe-notation command strings; no silent build reuse without disclosure and timing.

  metrics:
    primary:
      - id: library_facing_adequacy_marginal_detection
        definition: Whether G2_minus_G1 or G3_minus_G1 attributable to the library-facing adequacy control is non-empty via the library call path.
        decision_use: Decide instrument adequacy under the DEC-015 repair.
      - id: known_defect_detection_by_class
        definition: Per class, whether the known v5.9.1 AVX2 omission is detected on unmodified library builds.
        decision_use: Detection retention.
      - id: new_silent_indices
        definition: Reproducible silent indices not already in EV-MLKEM-005, per target/backend/parameter set/class.
        decision_use: Isolation versus systemic.
      - id: decapsulation_accept_on_mutation
        definition: Count of mutated equal-length ciphertexts whose decapsulation returns the honest shared secret.
        decision_use: Bind primitive findings to the API boundary.
      - id: second_peer_criterion_and_match
        definition: criterion_used plus mechanism evidence for the pinned second peer.
        decision_use: Whether the isolation question was actually asked, and under which criterion.
      - id: anchor_grade
        definition: strong, weak, or in_tree_self, with the file actually validated against named.
        decision_use: Qualify differential reference strength.
      - id: class_marginal_information
        definition: >-
          Findings attributable to G2, G3, or G4 that G1 did not produce.
          Rediscovery of the known wolfSSL defect MUST NOT be counted and MUST
          NOT set any added-discriminating-power flag to true.
        decision_use: Instrument adequacy and honesty.
    secondary:
      - mutations_executed_per_class
      - coverage_accounting_per_class
      - message_stability_annotations
      - second_peer_selection_rationale
      - interposition_attestation
      - build_and_attestation_evidence
      - per_stage_wall_clock_seconds
      - peak_memory_gb

  replication:
    seeds: [1, 2, 3, 4]
    seed_policy: Deterministic; multi-byte offsets seeded and recorded.
    independent_instances: 4
    replication_rule: A finding is reportable only if it reproduces across at least two keys within its class.
    planned_runs:
      - id: RUN-MLKEM-017
        purpose: >-
          Clone/configure/build all targets (wall-clock inside this run or a
          referenced pre-run receipt), attest backends, construct and attest
          the library-facing adequacy control, re-check strict then widened
          second-peer selection, establish and grade the conformance anchor.
      - id: RUN-MLKEM-018
        purpose: Run G1, G2, and G3 at the primitive level across all targets, adequacy control, negative harness, and retained known defect.
      - id: RUN-MLKEM-019
        purpose: Decapsulation-boundary probe for every target and class, message-stability annotation, and G4 malformed-length table.
      - id: RUN-MLKEM-020
        purpose: Cross-implementation comparison, coverage accounting, vector archival, and outcome classification under frozen precedence.
    expected_run_count: 4
    agreement_gate: >-
      A silent index or accept is reportable only if primitive and decapsulation
      observations are consistent or their inconsistency is explicitly recorded.

  outcome_classification:
    precedence:
      - invalid_harness_or_dispatch
      - positive_control_undetected
      - synthetic_control_inadequate
      - systemic_incomplete_comparison
      - second_impl_unavailable
      - generator_hardening_insufficient
      - isolated_to_audited_commits
    invalid_harness_or_dispatch: >-
      A required build fails, a backend cannot be attested, interposition cannot
      be attested, no anchor can be established, exact-command or build-
      accounting control fails, or the decapsulation probe cannot be reached
      for a target that would otherwise receive a verdict.
    positive_control_undetected: >-
      A generator class reaching 1536..1567 fails to detect the known v5.9.1
      AVX2 omission on an unmodified library build, or the negative harness is
      not flagged.
    synthetic_control_inadequate: >-
      The library-facing adequacy control is detected by G1, its designated
      G2/G3 patterns do not produce a non-empty marginal set through the
      library call path, or scoring special-cases len(diffs)==1. The repair
      itself failed.
    systemic_incomplete_comparison: >-
      A reproducible silent index or equal-length decapsulation accept appears
      in a wolfSSL post-fix backend or in the pinned second peer. Stop, record
      exact target/commit/backend/parameter set/class/index list, escalate.
      Construct no exploitation path.
    second_impl_unavailable: >-
      Preference order exhausted under both strict and widened criteria without
      a buildable pinned second peer. Record attempts. WolfSSL-only lines may
      still be reported but isolation across implementations is not claimed.
    generator_hardening_insufficient: >-
      The library-facing adequacy control is not detected by G2 or G3 through
      the library call path. Isolation is not licensed. Rediscovery of the
      known wolfSSL defect is irrelevant to this class.
    isolated_to_audited_commits: >-
      Library-facing adequacy control is G1-silent and G2-or-G3-detected via
      the library call path; known defect and negative harness are detected;
      no new reproducible silent index or accept appears on any other target
      under any class; pinned second peer was measured. Record criterion_used
      in the outcome; do not upgrade a widened_optimized_compare null to a
      strict_fixed_bound isolation claim.

  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 5400
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_processes: 4
    network_operations: source_retrieval_and_package_install_only
    deployed_system_queries: 0
    mutation_cap_per_target_parameter_set: 20000
    stages:
      - id: build_select_anchor_adequacy
        wall_clock_seconds: 1800
        stop_rule: >-
          If no second peer can be built under strict then widened orders,
          record attempts and continue wolfSSL lines; classify
          second_impl_unavailable if isolation would otherwise be claimed.
      - id: primitive_multiclass_grid
        wall_clock_seconds: 1500
        stop_rule: Stop at mutation cap; record coverage as partial for that class.
      - id: decapsulation_boundary_and_length
        wall_clock_seconds: 1200
        stop_rule: Stop at the cap; a partial API table is infrastructure signal, not a null.
      - id: comparison_and_packaging
        wall_clock_seconds: 900
        stop_rule: Stop without interpretation if any required artifact is incomplete.

  stopping_rules:
    - Stop and escalate immediately on any reproducible silent index or accept outside the known v5.9.1 defect; do not characterize further, do not build an exploitation path, contact no third party.
    - Stop the cross-implementation line and record second_impl_unavailable if no pinned second peer can be built within its stage budget under the frozen orders.
    - Stop after the four planned runs; no exploratory fifth run.
    - Stop before any key recovery, oracle construction, query chaining, or attack-cost estimation.
    - Stop before touching any system, network endpoint, or key not created inside this experiment.
    - Stop at 5400 total wall-clock seconds, 2.0 CPU-hours, or 4 GB resident memory.

  invalidation_rules:
    - Any run lacks its exact command (exact argv), commit and dirty state, environment, dependency and compiler versions, timestamps, resource use, stdout, stderr, raw result, summary, or inference metadata.
    - Expected run count is not exactly four or a planned run has no terminal status.
    - A conformance verdict is issued for a backend without decapsulation-boundary evidence.
    - Library comparison logic, buffer lengths, or dispatch conditions were modified in-tree.
    - Malformed-length results are counted as comparison omissions.
    - A finding is reported without reproduction across at least two keys.
    - The library-facing adequacy control, known-defect positive control, or negative harness is omitted.
    - Adequacy scoring special-cases len(diffs)==1 or hard-codes single-byte-in-R acceptance.
    - Rediscovery of the known wolfSSL defect is counted as class_marginal_information or used to set an added-discriminating-power flag true.
    - A widened_optimized_compare null is described as answering the strict fixed-bound-tail isolation question.
    - An implementation is graded strong against vectors shipped inside itself.
    - Descriptive/stylized command.txt strings are used in place of exact argv.
    - Library builds are silently reused from a prior experiment without disclosure and timing attribution.
    - Any result is described as an exploit, an attack, or a disclosure-ready vulnerability claim.
    - A build, clone, toolchain, or emulator failure is interpreted as evidence about implementation correctness.

  success_criterion: >-
    The protocol succeeds as an audit if all four runs reach terminal status,
    the library-facing adequacy control's G1-silent/G2-or-G3-visible property
    is demonstrated through the library call path without len(diffs)==1
    special-casing, the known defect and negative harness are detected, every
    conformance verdict rests on attested decapsulation-boundary evidence, the
    anchor is named and honestly graded, the second peer is pinned under
    criterion_used or second_impl_unavailable is evidenced, coverage is
    accounted per class, exact commands and build accounting pass, and the
    outcome is uniquely classified under frozen precedence. H-MLKEM-005 is
    supported within this laboratory boundary only under
    isolated_to_audited_commits scoped to criterion_used.
  falsification_criterion: >-
    H-MLKEM-005 is falsified if a reproducible silent index or equal-length
    decapsulation accept appears in a wolfSSL post-fix backend or in the
    pinned second peer. The adequacy repair itself is falsified under
    synthetic_control_inadequate or generator_hardening_insufficient.
    Infrastructure failure falsifies nothing.

  required_artifacts:
    - experiments/EXP-MLKEM-005/source-lock.yaml
    - experiments/EXP-MLKEM-005/implementation.md
    - experiments/EXP-MLKEM-005/implementation/build_matrix.sh
    - experiments/EXP-MLKEM-005/implementation/multiclass_generator.py
    - experiments/EXP-MLKEM-005/implementation/library_facing_adequacy.py
    - experiments/EXP-MLKEM-005/implementation/conformance_probe.c
    - experiments/EXP-MLKEM-005/implementation/decap_boundary_probe.c
    - experiments/EXP-MLKEM-005/implementation/run_experiment.py
    - experiments/EXP-MLKEM-005/analysis/second_implementation_selection.md
    - experiments/EXP-MLKEM-005/analysis/class_coverage_report.json
    - experiments/EXP-MLKEM-005/analysis/malformed_length_table.json
    - experiments/EXP-MLKEM-005/analysis/library_facing_adequacy_report.json
    - experiments/EXP-MLKEM-005/vectors/README.md
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/manifest.yaml
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/command.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/environment.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/raw.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/summary.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/stdout.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/stderr.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/manifest.yaml
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/command.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/environment.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/raw.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/summary.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/stdout.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/stderr.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/manifest.yaml
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/command.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/environment.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/raw.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/summary.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/stdout.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/stderr.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-020/manifest.yaml
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-020/command.txt
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-020/environment.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-020/raw.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-020/summary.json
    - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-020/stdout.txt
