experiment:
  id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  source_proposal: IDEA-20260731-007
  mandatory_null_control_proposal: IDEA-20260731-011
  version: 1
  title: >-
    Degree-split Semaev claw membership cost vs naive (m-1)-tuple search at
    toy prime-field ECDLP, with HEUR-DS-1 sampling and structure-destruction
    null control
  status: review_required
  approved_by: null
  approved_by_note: >-
    THE NULL IS BY DESIGN (D-1 prophylaxis). This contract is frozen at
    `review_required` with `approved_by: null` and is NEVER edited after the
    BATCH-017 freeze snapshot (TASK-20260731-015). The Coordinator's approval
    determination is recorded in the pre-execution approval receipt
    (TASK-20260731-017) before any run is unblocked. `approved_by: null` MUST
    NOT be read as evidence that the contract was never approved.
  frozen: true
  frozen_on: '2026-07-31'
  frozen_by_task: TASK-20260731-014
  archived_by_task: TASK-20260731-015
  claim_tier: toy
  confirmatory_status: exploratory
  confirmatory_status_note: >-
    First measurement of the degree-split claw rewrite. Confirmatory only about
    the named toy cells after independent review and a completed valid run set;
    never crypto-scale and never an asymptotic support path alone.

  objective: >-
    Measure whether a degree-split meet-in-the-middle / smoothness claw rewrite
    of prime-field Semaev membership yields a charged per-relation cost ratio
    R = cost_split / cost_naive strictly below 0.5 that survives a same-shape
    null object (IDEA-20260731-011), and report HEUR-DS-1 toy validation status
    (KS / tail) against the pre-registered Dickman prediction. Matched Pollard
    rho (negation) and BSGS baselines are recorded on the same instances.
    Assembled exponent proxy E is reported for honesty against rho; a toy R
    win is not a crypto-scale ECDLP break.

  claim_ceiling: >-
    Toy-tier charged-cost ratio R, null-control R_null, HEUR-DS-1 toy
    distribution status, and assembled E proxy on 16/20/24-bit prime-order
    subgroups with B in {64,128,256} and m in {4,5}. NOT CLAIMABLE UNDER ANY
    OUTCOME: crypto-scale ECDLP exponent improvement; asymptotic support for
    HEUR-DS-1; GOAL-ECDLP-001 completion; reopening or altering H-STR-002 /
    H-IC-001 statuses. All four asymptotic-claim promotion gates in
    agents/coordinator.md remain OPEN.

  what_this_experiment_is_NOT:
    - Not a cryptanalytic attack on any deployed curve or live key.
    - Not STR / phi_alpha / displacement-rank instrument polish.
    - Not a reopen of weakened H-IC-001 or H-STR-002.
    - Not sufficient alone to move any asymptotic claim to `supported`.

  heuristic_under_test: HEUR-DS-1
  preregistered_prediction:
    quantity: >-
      B-smoothness law of intermediate degrees from half-arity Semaev partial
      maps (and the charged cost ratio R implied if early-abort is justified)
    formula: >-
      For intermediate degree bitlength corresponding to bound D and factor-base
      size B, let u = log D / log B. Under HEUR-DS-1 the probability an
      intermediate is B-smooth is within a constant factor of Dickman rho(u).
      Separately, the algorithm claim predicts R = cost_split/cost_naive < 0.5
      at B>=64 on >=2 bit sizes with R_null >= 0.9 whenever R < 0.5.
    source: >-
      IDEA-20260731-007 (HEUR-DS-1; metric R); Dickman–de Bruijn / CEP for
      rho(u); IDEA-20260731-011 for the null-object gate; Semaev degree bounds
      KN-LIT-001 / KN-TECH-002.
  scale_relevance:
    tier: toy
    justification: >-
      Direct sampling and membership search at 16–24 bit subgroups only.
      Crypto-size HEUR-DS-1 sampling would require a separate correspondence
      experiment (IDEA-20260731-009 / SG-ECDLP-003) and is out of scope.
    correspondence: null
  tail_checks:
    - id: TAIL-DS-1
      check: >-
        Report the smoothest observed intermediate sample's implied
        probability under rho(u) and whether it is an extreme outlier relative
        to the sample size (>=10^5 intermediates per reported bit size when
        the HEUR arm completes).
    - id: TAIL-R-BOOTSTRAP
      check: >-
        Report bootstrap 95% CIs for R and R_null at each completed (bits,B,m)
        cell; do not declare R<0.5 from a point estimate whose CI includes 0.5.

  inputs:
    bit_sizes: [16, 20, 24]
    factor_base_sizes: [64, 128, 256]
    arities_m: [4, 5]
    instance_generation: >-
      harness.toycurve.generate_instance(seed, field_bits) with frozen seeds
      listed under replication; prime-order subgroup required. Record p, n, A, B,
      generator, and factor-base x-list hashes per instance.
    factor_base_rule: >-
      Deterministic subset of E(F_p) of exact size B, built by the EXP-DS-001
      driver from a frozen rule recorded in the run manifest (sorted
      x-coordinates; identical list used by naive, split, and null arms).
    membership_methods:
      naive: >-
        (m-1)-tuple enumeration into the shared Groebner/resultant backend until
        a usable relation is found or the per-method attempt budget is exhausted.
      degree_split_claw: >-
        Half-arity enumerations with intermediate invariant table (claw), early
        abort under the declared smoothness test when HEUR-DS-1 abort is enabled;
        same backend and calibration as naive.
    null_object:
      id: NULL-DS-RANDOM-MULTIHOMOGENEOUS
      construction: >-
        Replace Semaev-shaped systems with random multihomogeneous polynomial
        systems of matched multidegree and variable count, preserving API shape
        and charged cost accounting (IDEA-20260731-011 structure-destruction).
        Specification hash of the null sampler is recorded per run.
      planted_bug_positive_control: >-
        CTRL-NULL-PLANT: artificially divide reported operation counts by 4 on
        one arm; the null gate must FLAG it (R_null also low). If not detected,
        the harness is void for sub-birthday claims.
      honest_rho_negative_control: >-
        CTRL-NULL-RHO: honest matched rho on real vs null must show
        R_real ≈ R_null ≈ 1 (calibration sanity).
    cost_unit: >-
      Group-operation equivalents via matched rho calibration
      (total_group_operations / wall_seconds) on the same host, plus explicit
      peak_rss_bytes for the claw table. Wall-clock is secondary.
    relation_success_definition: >-
      A usable relation is one that the driver's linear-algebra accounting can
      count toward rank progress; relations that cannot contribute to rank B-1
      are labeled incomplete and excluded from the primary yield-charged cost.

  controls:
    - id: CTRL-RHO
      method: >-
        Matched Pollard rho with negation on the same instances; report
        total_group_operations and wall_seconds; use for calibration and
        assembled-E comparison.
      pass_condition: >-
        Every completed instance has a valid matched rho receipt; missing rho
        invalidates assembled-E comparison for that instance (infrastructure),
        not a mathematical negative on H-DS-001.
    - id: CTRL-BSGS
      method: Matched BSGS cost 2*ceil(sqrt(N)) group ops with ceil(sqrt(N)) stored elements.
      pass_condition: Reported for every completed instance alongside rho.
    - id: CTRL-NULL-SHAPE
      method: >-
        Run identical claw machinery on NULL-DS-RANDOM-MULTIHOMOGENEOUS; compute
        R_null = cost_split_null / cost_naive_null (same charging).
      pass_condition: >-
        Null arm present whenever a real-arm R is reported; if R < 0.5 then
        R_null must be reported and compared to the 0.9 gate.
    - id: CTRL-NULL-PLANT
      method: Planted 4x false speedup; must be detected by the null gate.
      pass_condition: Detection flag true; otherwise harness void.
    - id: CTRL-NULL-RHO
      method: Honest rho real vs null calibration sanity.
      pass_condition: R_real and R_null for honest rho near 1 (within pre-registered band ±0.15).
    - id: CTRL-BACKEND-IDENTICAL
      method: >-
        Naive, split, and null share one Groebner/resultant backend and
        calibration; ±10x calibration perturbation must not flip the decisive
        sign of (R - 0.5) when the unperturbed CI excludes 0.5.
      pass_condition: Perturbation table recorded; sign-stability reported.
    - id: CTRL-RANK
      method: Usable relations require path to matrix rank B-1 or labeled incomplete.
      pass_condition: Incomplete relations never counted in primary R numerator/denominator yields.
    - id: CTRL-CERT
      method: Any recovered discrete log carries a certificate re-verified by the run wrapper.
      pass_condition: Certificate verify true, or no DL claimed.

  independent_variables:
    - field_bits: [16, 20, 24]
    - factor_base_size_B: [64, 128, 256]
    - arity_m: [4, 5]
    - membership_method: [naive, degree_split_claw]
    - object_kind: [semaev_real, null_random_multihomogeneous]

  metrics:
    primary:
      - R: cost_split / cost_naive in group-op equivalents, yield-charged
      - R_null: same ratio on the null object
      - R_bootstrap_ci_95: bootstrap CI for R and R_null
      - HEUR_DS_1_KS_distance: KS distance of empirical intermediate-degree (or LPF) CDF to Dickman rho(u)
      - HEUR_DS_1_tail_ok: boolean from TAIL-DS-1
    secondary:
      - assembled_E_proxy: max(beta*m/2*(1-o(1)), omega_LA*beta, beta) style proxy vs matched rho
      - per_attempt_cost_gops
      - yield_charged_cost_gops
      - relations_harvested
      - peak_rss_bytes_claw_table
      - null_object_spec_hash
      - planted_bug_detected
      - calibration_perturbation_sign_stable

  replication:
    seeds: [101, 102, 103]
    seed_policy: >-
      Three master seeds per bit size; factor base and targets derived
      deterministically from (seed, bits, B, m). HEUR-DS-1 sampling uses a
      disjoint stream derived from seed + 1000.
    independent_instances: 9
    planned_runs:
      - id: RUN-DS-001-impl
        purpose: Implement naive, claw, null arms with shared backend; dry-check certificates and planted-bug detection on one 16-bit cell.
      - id: RUN-DS-001-measure
        purpose: Full matrix over bits x B x m for real and null arms within budget; stop per stopping_rules.
      - id: RUN-DS-001-heur
        purpose: HEUR-DS-1 sampling >=10^5 intermediates per completed bit size; KS and tail artifacts.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 48
    maximum_memory_gb: 16
    maximum_runs: 3
    stage_estimates:
      implementation_and_smoke: '<= 8 CPU-hours'
      measurement_matrix: '<= 32 CPU-hours'
      heur_sampling: '<= 8 CPU-hours'

  stopping_rules:
    - >-
      Per (bits,B,m,method,object): stop after 200 successful usable relations
      or wall_clock_seconds_per_run, whichever first.
    - Stop the whole experiment when total_cpu_hours budget is exhausted; record incomplete cells as resource_exhaustion.
    - On CTRL-NULL-PLANT failure, stop and report harness void (no mathematical negative).

  invalidation_rules:
    - Naive and split backends differ (hash mismatch of solver identity) → invalid.
    - Factor-base list mismatch across arms of the same instance → invalid.
    - Missing matched rho for a cell that reports assembled E → that cell's E comparison invalid.
    - Fabricated or imputed missing relation counts → entire run set invalid.
    - Any edit to this specification after TASK-20260731-015 without a versioned amendment → integrity failure.

  success_criterion: >-
    S1: On at least two distinct bit sizes, at B>=64, with successful harvest
    meeting the per-cell minimum or an explicit resource stop that still yields
    enough relations for a bootstrap CI excluding 0.5 from above: R < 0.5 AND
    R_null >= 0.9 AND CTRL-NULL-PLANT detected AND CTRL-BACKEND-IDENTICAL
    sign-stable. HEUR-DS-1 status (pass/fail at toy) is reported alongside and
    does not by itself constitute S1.

  falsification_criterion: >-
    F1: R >= 0.9 at all tested (B,m) cells with successful harvest → claw
    rewrite adds no charged saving at tested scope.
    F2: R < 0.5 and R_null < 0.5 on the matched null → gain is engine artifact
    (IDEA-20260731-011); mechanism claim fails the structure gate.
    F3: HEUR-DS-1 KS/tail fail at all completed bit sizes with adequate samples
    → heuristic reported failed at toy scale (does not alone reject the
    algorithmic rewrite if R still survives F2, but blocks any smoothness-based
    exponent narrative).

  outcome_disposition:
    S1_met: >-
      weaken-or-expand decision space: consider follow-on design for larger toy
      / correspondence HEUR validation; do NOT claim crypto-scale break; do NOT
      set asymptotic_claim supported.
    F1_met: reject_scoped or weaken H-DS-001 to tested parameters; park claw rewrite.
    F2_met: reject_scoped mechanism interpretation; treat as packaging/engine artifact.
    F3_only: record HEUR-DS-1 failed at toy; R decision still follows S1/F1/F2.
    infrastructure_incomplete: inconclusive; AGENTS.md rule 5; no mathematical negative.

  required_artifacts:
    - experiments/EXP-DS-001/specification.yaml
    - experiments/EXP-DS-001/runs/*/manifest.json
    - experiments/EXP-DS-001/runs/*/raw-result.json
    - experiments/EXP-DS-001/runs/*/stdout.txt
    - experiments/EXP-DS-001/results/summary.json
    - experiments/EXP-DS-001/results/R_table.json
    - experiments/EXP-DS-001/results/HEUR_DS_1_report.json
    - experiments/EXP-DS-001/results/null_control_report.json
    - Per-run null_object_spec_hash and certificate verify logs when DL claimed

  assigned_to: executor
  approval_determination_location:
    the_route_declared_in_advance: >-
      Approval is NOT a field in this file. It is recorded in
      TASK-20260731-017 snapshot_commit_receipt.json (APPROVAL_DETERMINATION)
      after TASK-20260731-016 independent review, and again in a Coordinator
      decision when a ledger transition is warranted. No Executor handoff is
      authorized until APPROVAL_DETERMINATION is APPROVED.

  does_not_modify_hypotheses:
    - H-IC-001
    - H-STR-002
