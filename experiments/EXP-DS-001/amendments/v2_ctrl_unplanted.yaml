protocol_amendment:
  id: PA-DS-001-v2-ctrl-unplanted
  experiment_id: EXP-DS-001
  from_version: 2
  to_version: 2.1-ctrl
  kind: control_addendum
  batch: BATCH-020
  queue_amend_id: QUEUE-AMEND-20260731-003
  authoring_task: TASK-20260731-040
  snapshot_task: TASK-20260731-041
  re_review_task: TASK-20260731-042
  approval_task: TASK-20260731-043
  prior_disposition: >-
    DEC-20260731-018 inconclusive on EXP-DS-001 v2 relations=200 planted
    package (EV-DS-002; snapshot 1eb431f1; RT-20260731-038). Exact next
    action was CTRL-RT025-UNPLANTED (+ live plant). This amendment does not
    reopen BATCH-017's spent RC-17 v1→v2 cycle; it is a new BATCH-020 control
    addendum with its own one-cycle review cap (RC-20).
  parent_contract_path: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  control_protocol_path: experiments/EXP-DS-001/controls/CTRL-RT025-UNPLANTED.yaml
  immutable_parent: >-
    specification.v2.yaml remains the immutable APPROVED matrix contract.
    This amendment MUST NOT edit specification.v2.yaml, specification.yaml,
    or specification.v1-frozen-df613af6.yaml. Control execution binds to
    v2 cost identities / backend constraints PLUS the control protocol file.
  cycle_cap: >-
    RC-20: at most one amendment/review cycle for this control addendum.
    A REVISE after TASK-20260731-042 is BATCH-020 non-execution failure for
    the control run (no second cycle in this batch). Cycle-cap ruling on any
    further request is assigned to a session that did NOT author TASK-040.
  discharges:
    - objection: CTRL-RT025-UNPLANTED
      source: RT-20260731-038 / DEC-20260731-018
      severity: BLOCKING_ON_NEXT_ACTION
      change: >-
        Adds single-cell unplanted remeasure protocol for bits=20, B=64,
        m=4, seed=101; forbids planted m-sums as primary yield; requires
        same backend id; smoothness_abort=false; relations_target=200 or
        honest resource stop.
    - objection: CTRL-RT025-PLANT-LIVE
      source: RT-20260731-038
      severity: BLOCKING_ON_NEXT_ACTION
      change: >-
        Requires live /4 plant on one real arm without synthetic
        known-answer; null gate must flag without hardcoded detection.
    - objection: RT038-B7
      source: RT-20260731-038
      severity: BLOCKING_ON_DECISION
      change: >-
        Declares that planted relations=200 does not discharge the
        unplanted control; control results are a separate package.
  non_changes:
    - Does not change S1/F1/F2/F3 success criteria of the v2 matrix.
    - Does not authorize re-running the full 54-cell matrix.
    - Does not re-run HEUR-DS-1.
    - Does not alter H-IC-001 or H-STR-002.
    - Does not move any asymptotic promotion gate.
    - Does not supersede EV-DS-002 as the planted-package operative record;
      EV-DS-003 (if filed) is the control-package evidence record.
  hypothesis_alignment: >-
    H-DS-001 remains analyzed until a later ledger decision after the
    control run + independent review. No status transition in this
    amendment alone.
  binding: >-
    Executor, if APPROVED at TASK-20260731-043, MUST execute
    RUN-DS-001-ctrl-unplanted against specification.v2.yaml constraints
    as narrowed by controls/CTRL-RT025-UNPLANTED.yaml. Planted matrix
    re-execution is out of scope.
  no_run_authorized_until_approval: true
