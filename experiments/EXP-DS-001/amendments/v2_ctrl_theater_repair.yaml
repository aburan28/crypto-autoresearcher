protocol_amendment:
  id: PA-DS-001-v2-ctrl-theater-repair
  experiment_id: EXP-DS-001
  from_version: 2
  to_version: 2.2-ctrl-theater
  kind: control_addendum
  batch: BATCH-021
  queue_amend_id: QUEUE-AMEND-20260731-005
  authoring_task: TASK-20260731-054
  snapshot_task: TASK-20260731-055
  re_review_task: TASK-20260731-056
  approval_task: TASK-20260731-057
  prior_disposition: >-
    DEC-20260731-012 inconclusive on CTRL-RT025-UNPLANTED (EV-DS-003; snapshot
    d28fb191; RT-20260731-047). Exact next action was BATCH-021 theater repair:
    PLANT-INDEPENDENT + RHO-CALIB + NULL-SPLIT-COMPOSITION, with CI-IDENTITY and
    SPARSE-P-SUCCESS deferred. This amendment does not reopen RC-20; it is a
    new BATCH-021 control addendum with its own one-cycle review cap (RC-21).
  parent_contract_path: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  related_prior_control: experiments/EXP-DS-001/controls/CTRL-RT025-UNPLANTED.yaml
  related_prior_evidence:
    - EV-DS-003
    - EV-DS-002
  control_protocol_paths:
    - experiments/EXP-DS-001/controls/CTRL-RT025-PLANT-INDEPENDENT.yaml
    - experiments/EXP-DS-001/controls/CTRL-RT025-RHO-CALIB.yaml
    - experiments/EXP-DS-001/controls/CTRL-RT025-NULL-SPLIT-COMPOSITION.yaml
  deferred_control_ids:
    - CTRL-RT025-CI-IDENTITY
    - CTRL-RT025-SPARSE-P-SUCCESS
  immutable_parent: >-
    specification.v2.yaml remains the immutable APPROVED matrix contract.
    This amendment MUST NOT edit specification.v2.yaml, specification.yaml,
    or specification.v1-frozen-df613af6.yaml. Control execution binds to
    v2 cost identities / backend constraints PLUS the three co-required
    control protocol files.
  cycle_cap: >-
    RC-21: at most one amendment/review cycle for this theater-repair
    addendum. A REVISE after TASK-20260731-056 is BATCH-021 non-execution
    failure for the theater-repair run (no second cycle in this batch).
    Cycle-cap ruling on any further request is assigned to a session that
    did NOT author TASK-054.
  discharges:
    - objection: CTRL-RT025-PLANT-INDEPENDENT
      source: RT-20260731-047 / RT047-B3 / residual RT038-B3
      severity: BLOCKING_ON_NEXT_ACTION
      change: >-
        Requires non-tautological live plant: inject /4 (or equivalent)
        into the harvest reporting path before an independent null-gate
        reads costs; forbid in-detector divide-then-echo; require
        null_gate_f2_shape or equivalent non-arithmetic FLAG without
        hardcoded planted_bug_detected.
    - objection: CTRL-RT025-RHO-CALIB
      source: RT-20260731-047 / residual RT038-B3
      severity: BLOCKING_ON_NEXT_ACTION
      change: >-
        Replace hardcoded rho_calib_ratio_real=rho_calib_ratio_null=1.0
        with a measured real-vs-null rho calibration that can fail.
    - objection: CTRL-RT025-NULL-SPLIT-COMPOSITION
      source: RT-20260731-047 / inventor-protocol null destroy
      severity: BLOCKING_ON_NEXT_ACTION
      change: >-
        Repair null_split so half-keys compose; demonstrate R_null can
        fall below 0.9 under a packaging-like real arm.
  deferred_not_executed_this_batch:
    - id: CTRL-RT025-CI-IDENTITY
      reason: >-
        Protocol-named for follow-on after plant non-theater lands; not
        co-required for RUN-DS-001-ctrl-theater authorization in BATCH-021.
    - id: CTRL-RT025-SPARSE-P-SUCCESS
      reason: >-
        Deferred until plant non-theater lands; then remeasure where
        unplanted p̂ decays and charge total expected cost = per-attempt × 1/p̂.
  non_changes:
    - Does not change S1/F1/F2/F3 success criteria of the v2 matrix.
    - Does not authorize re-running the full 54-cell planted matrix.
    - Does not re-run HEUR-DS-1.
    - Does not alter H-IC-001 or H-STR-002.
    - Does not move any asymptotic promotion gate.
    - Does not supersede EV-DS-002 or EV-DS-003; EV-DS-004 (if filed) is the
      theater-repair package evidence record.
  hypothesis_alignment: >-
    H-DS-001 remains analyzed until a later ledger decision after the
    theater-repair run + independent review. No status transition in this
    amendment alone.
  binding: >-
    Executor, if APPROVED at TASK-20260731-057, MUST execute
    RUN-DS-001-ctrl-theater against specification.v2.yaml constraints as
    narrowed by the three co-required control protocols. Planted matrix
    re-execution is out of scope.
  no_run_authorized_until_approval: true
  claim_ceiling: toy
