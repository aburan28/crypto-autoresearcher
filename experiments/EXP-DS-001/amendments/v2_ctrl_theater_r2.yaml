        parent ±0.15 band deferred to post-run interpretation.
    - objection: CTRL-RT056-NULL-SPLIT-HARD-DESTROY
      source: RT-20260731-056 / RT056-B1 / inventor-protocol null destroy
      severity: BLOCKING_ON_NEXT_ACTION
      change: >-
        Split statuses: composition_repaired; destroy_demonstrated iff
        measured R_null < 0.9; falsifiability_failed is terminal
        non-discharge (not soft PASS). pass_condition requires
        destroy_demonstrated.
