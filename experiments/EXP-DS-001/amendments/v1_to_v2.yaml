  prior_disposition: >-
    TASK-20260731-017 recorded APPROVAL_DETERMINATION NOT APPROVED after
    RT-20260731-016 / TASK-20260731-016 returned REVISE (B-1, B-2 blocking).
    No Executor run was authorized. This is the single RC-17 protocol_amendment
    cycle inside BATCH-017.
  v1_path: experiments/EXP-DS-001/specification.yaml
  v1_freeze_blob: experiments/EXP-DS-001/specification.v1-frozen-df613af6.yaml
  v1_snapshot_commit: df613af684f6b878378b6e7696d1ce3ef8975a4c
  v1_sha256: c1792bf1733e56f631b04585f50272c9a3342302459daa62a64d1e5fdc4c3889
  v2_path: experiments/EXP-DS-001/specification.v2.yaml
  cycle_cap: >-
    RC-17: at most one amendment cycle on REVISE. A second REVISE after
    TASK-20260731-020 is BATCH-017 non-execution failure. Cycle-cap ruling on
    any further request is assigned to a session that did NOT author this
    amendment.
  discharges:
    - objection: B-1
      source: RT-20260731-016
      severity: BLOCKING
      change: >-
        Added heur_ds_1_decision_rule: sampled quantity is B-smoothness
        indicators / LPF statistics of intermediate integers (degree-CDF vs
        rho forbidden); D(bits,m)=2**(bits*d_half[m]) with d_half={4:2,5:4};
        u*=ln(D)/ln(B) tabulated before sampling; RATE-DS-1 band with c=8;
        KS-DS-1 threshold max(0.05, 1.63/sqrt(n)) on LPF-derived Z_j CDF;
        TAIL-DS-1 fail iff p_ext*n < 1; F3 tied to bit_size_pass.
    - objection: B-2
      source: RT-20260731-016
      severity: BLOCKING
      change: >-
        Aligned F2 with the S1 R_null gate: F2 fires on R < 0.5 AND
        R_null < 0.9 (covers hard echo R_null < 0.5 and soft echo
        0.5 <= R_null < 0.9). Mutually exclusive with S1 on the null axis.
        outcome_disposition.F2_met names structure_gate_failed.
    - objection: M-1
      source: RT-20260731-016
      severity: MAJOR
      change: >-
        Froze cost_identities for cost_naive, cost_split, R, R_null with
        included phases; require identities in summary.json.
    - objection: M-2
      source: RT-20260731-016
      severity: MAJOR
      change: >-
        Added prediction_not_met_inconclusive_partial for complete valid runs
        where neither S1 nor F1 nor F2 fires.
    - objection: M-3
      source: RT-20260731-016
      severity: MAJOR
      change: >-
        CTRL-NULL-RHO metrics renamed rho_calib_ratio_real /
        rho_calib_ratio_null; R / R_null reserved for split-vs-naive.
    - objection: M-4
      source: RT-20260731-016
      severity: MAJOR
      change: >-
        Froze claw_key_definition, smoothness_abort_predicate, and
        semaev_multidegree_vectors for m in {4,5} (real and null-matched).
  hypothesis_alignment: >-
    H-DS-001 status unchanged (specified). Its HEUR-DS-1 falsification_condition
    already defers thresholds to EXP-DS-001; those thresholds are now the v2
    heur_ds_1_decision_rule. Its structure-gate bullet naming R_null < 0.5 is
    superseded for EXP-DS-001 adjudication by v2 F2 (R_null < 0.9); no
    hypothesis status transition. H-IC-001 and H-STR-002 untouched.
