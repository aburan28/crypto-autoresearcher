protocol_amendment:
  id: PA-DS-001-v2-ctrl-matched-null
  experiment_id: EXP-DS-001
  from_version: 2
  to_version: 2.2-ctrl
  kind: control_addendum
  batch: BATCH-021
  authoring_task: TASK-20260801-001
  snapshot_task: TASK-20260801-002
  re_review_task: TASK-20260801-003
  approval_task: TASK-20260801-004
  execution_task: TASK-20260801-005

  prior_disposition: >-
    DEC-20260801-003 (issued in the BATCH-020 queue as DEC-20260731-020)
    recorded `inconclusive` on the H-DS-001 mechanism with partial repair
    confirmed, on EV-DS-003 / RUN-DS-001-ctrl-unplanted at snapshot
    1d241a878b4f0e74cadbb5e2e0995c0bf6f97cbd. Validator VAL-20260801-001
    returned ADMISSIBLE; Red Team RT-20260731-047 returned five blocking
    objections RT047-B1..B5. The packaging branch of the frozen
    packaging_falsification_rule was FALSIFIED, structure was NOT ESTABLISHED,
    and the run landed outside both branches of a rule drafted as a dichotomy.
    The exact single next action recorded was RT047-CTRL-1 variant (a), the
    matched-ALGORITHM null. This amendment is that action, frozen as a
    reviewable contract.

  parent_contract_path: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  parent_approval_decision: DEC-20260731-022
  control_protocol_path: experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml

  immutable_parent: >-
    specification.v2.yaml remains the immutable APPROVED matrix contract. This
    amendment MUST NOT edit specification.v2.yaml, specification.yaml, or
    specification.v1-frozen-df613af6.yaml. Control execution binds to the v2
    cost identities and backend constraints PLUS the control protocol file.

  relation_to_prior_control_addendum: >-
    SUPERSEDING BY ADDITION, NOT BY EDIT. PA-DS-001-v2-ctrl-unplanted and
    controls/CTRL-RT025-UNPLANTED.yaml are NOT edited, re-scored, reopened or
    invalidated by this amendment, and the RUN-DS-001-ctrl-unplanted package
    and EV-DS-003 stand exactly as archived. What is superseded is the FORWARD
    READING of the null axis only - NULL-DS-RANDOM-MULTIHOMOGENEOUS is declared
    an unmatched null for structure-dependence purposes (RT047-B2) and
    NULL-DS-ADDITIVE-Z753848 replaces it for that purpose in this and
    subsequent controls. Prior R_null figures remain valid as measurements and
    are reported alongside; they simply license no structure claim.

  cycle_cap: >-
    RC-21 - at most one amendment/review cycle for this control addendum. A
    REVISE at TASK-20260801-003 is a BATCH-021 non-execution failure for the
    control run, with no second cycle in this batch. This amendment does not
    reopen BATCH-017's spent RC-17 v1-to-v2 cycle or BATCH-020's spent RC-20
    cycle. A cycle-cap ruling on any further request is assigned to a session
    that did NOT author TASK-20260801-001.

  discharges:
    - objection: RT047-CTRL-1
      source: RT-20260731-047 / DEC-20260801-003
      severity: BLOCKING_ON_NEXT_ACTION
      change: >-
        Adds a matched-ALGORITHM null control protocol. naive_search and
        split_search run unchanged - same code, smoothness_abort false, same
        charge_backend_units, same frozen wall-derived cost identity, 200
        relations, seed 101 - against the additive group Z/753848Z with a
        128-element negation-closed random signed factor base and 200 uniform
        random targets. Adds same-host real-arm re-measure arms for
        comparability and carries the legacy null arms for disclosure only.
    - objection: RT047-B2
      source: RT-20260731-047
      severity: BLOCKING_ON_DECISION
      change: >-
        Declares NULL-DS-RANDOM-MULTIHOMOGENEOUS an UNMATCHED null for
        structure-dependence readings and installs NULL-DS-ADDITIVE-Z753848 as
        the matched null. States on the record that the real arm ran
        structure-free with an identity encoding and an exact-equality join.
    - objection: RT047-B1
      source: RT-20260731-047
      severity: BLOCKING_ON_DECISION
      change: >-
        Makes the two-proxy disclosure a property of the INSTRUMENT rather than
        the write-up. Every ratio is reported as an ordered pair of wall proxy
        and charged-unit proxy with neither privileged, and the summary must
        state verbatim that charged units never enter the frozen cost identity.
    - objection: VAL-20260801-001 defect D-3
      source: VAL-20260801-001 / DEC-20260801-003 limitations
      severity: MINOR_BUT_MANDATORY_BEFORE_DRIVER_REUSE
      change: >-
        Declares PER_TARGET_CAP_SECONDS = 5.0 in the contract, requires it in
        manifest, raw-result and summary with per-arm capped-attempt counts,
        states that it biases the NAIVE arm first at larger parameters and
        therefore biases R downward, and adds a pre-registered guard that
        SUSPENDS the disposition map if any arm records a capped attempt.
    - objection: RT047-M1
      source: RT-20260731-047
      severity: MAJOR_ADVISORY
      change: >-
        Requires the bootstrap CI to be reported under an overhead-resampled
        variant as well, or an explicit statement that only the unresampled
        estimator was computed.

  new_binding_content:
    - >-
      A PRE-REGISTERED, FROZEN DISPOSITION MAP with five exhaustive branches
      D-1 through D-5 over the pair (wall R_matched_null, charged-unit
      R_matched_null), fixed before any data exists. This is the substantive
      point of BATCH-021 - the lane's central inference is finally being tested,
      so the reading rule is written before the number.
    - >-
      An explicit prohibition on running the live plant in this batch.
      CTRL-RT025-PLANT-LIVE stays UNDISCHARGED; RT047-CTRL-3 gates it and ranks
      behind.
    - >-
      An advance declaration of the new driver path
      experiments/EXP-DS-001/implementation/ds001_ctrl_matched_null.py and of
      the appended experiments/EXP-DS-001/implementation/implementation.md, so
      that the snapshot archive's expected commit scope is complete on the
      first attempt rather than by later queue amendment.

  non_changes:
    - Does not change the S1/F1/F2/F3 success criteria of the v2 matrix.
    - Does not change R-1.
    - Does not authorize re-running the 54-cell matrix.
    - Does not sweep B; that is RT047-CTRL-2.
    - Does not re-run HEUR-DS-1 and neither validates nor refutes it.
    - Does not alter H-IC-001 or H-STR-002.
    - Does not move any asymptotic promotion gate; G1-G4 remain OPEN.
    - >-
      Does not supersede EV-DS-002 as the planted-package operative record or
      EV-DS-003 as the unplanted-control operative record. EV-DS-004, if filed,
      is the matched-null-package evidence record.
    - Does not discharge CTRL-RT025-PLANT-LIVE.
    - Does not touch FAEST, XEDN, or any goal other than GOAL-ECDLP-001.

  hypothesis_alignment: >-
    H-DS-001 remains `analyzed` under this amendment alone. Any transition
    happens only at the TASK-20260801-009 ledger decision, after the run and
    both independent reviews, and only along the branch the frozen disposition
    map assigns. Under branch D-1 that transition is analyzed -> weakened,
    scoped to the structure attribution and explicitly not to the mechanism's
    viability; under every other branch H-DS-001 remains `analyzed`.

  binding: >-
    The Executor, if and only if TASK-20260801-004 records
    APPROVAL_DETERMINATION APPROVED, MUST execute RUN-DS-001-ctrl-matched-null
    against specification.v2.yaml constraints as narrowed by
    controls/CTRL-RT047-MATCHED-NULL.yaml. Planted matrix re-execution, B
    sweeps, HEUR sampling, plant application, and v1 execution are all out of
    scope.
  no_run_authorized_until_approval: true
  confirmatory_status: exploratory_control
  approved_by: coordinator
