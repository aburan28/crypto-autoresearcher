control_protocol:
  id: CTRL-RT025-CI-IDENTITY
  status: executable
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-026
  protocol_amendment_id: PA-DS-001-v2-ctrl-ci-identity
  extends_note: >-
    Measurement-honesty control. Does not edit prior control blobs. Reuses
    existing charged-units / yield accounting from EXP-DS-001 v2 driver paths.
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  parent_approval_decision: DEC-20260731-003
  discharges:
  - RT047-B2
  - RT079-B6
  - RT101-B6
  sources:
  - RT-20260731-047
  - RT-20260731-079
  - RT-20260731-101
  - DEC-20260731-029
  - EV-DS-008
  - EV-DS-003
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: >-
    Toy-tier CI-identity honesty control only. NOT CLAIMABLE: crypto-scale ECDLP
    improvement; asymptotic support; S1_met; structure_gate; GOAL completion;
    any change to H-IC-001 / H-STR-002. Promotion gates remain OPEN.
  purpose: >-
    Scientifically attack RT047-B2 / RT079-B6 / RT101-B6 by requiring that any
    reported bootstrap CI used for CI-honesty claims is a CI of the same
    cost-identity / yield-charged R that defines the reported point estimate
    (or an explicitly declared identical numeric transform). Forbid claiming
    CI honesty when the CI is of a wall-ratio / proxy quantity that fails to
    contain the reported R (point-outside-CI pathology). Allow honest
    ci_identity_fail.
  method:
    definitions:
      cost_identity_R: >-
        The yield-charged / charged-units ratio R that the protocol uses as the
        primary point estimate for advantage claims (same definition as in
        specification.v2 / prior EV-DS reports for the cell).
      ci_of_cost_identity_R: >-
        Bootstrap (or declared) CI computed on resamples of that same
        cost_identity_R quantity — not on a different wall-time proxy unless
        the protocol proves the proxy equals cost_identity_R for every resample.
      ci_contains_point_estimate: >-
        Reported point R lies inside the reported CI interval (closed interval
        containment).
      ci_identity_pass: >-
        ci_of_cost_identity_R is true AND ci_contains_point_estimate is true AND
        required fields present AND CI quantity label matches cost_identity_R.
      ci_identity_fail: >-
        Honest negative when CI is of a non-identity proxy, or point R lies
        outside the CI, or required fields missing — not infrastructure failure;
        not reject_scoped / lane death.
    forbid:
    - claiming CI honesty when CI quantity ≠ cost_identity_R
    - point-outside-CI while asserting CI honesty
    - S1_met
    - support
    - asymptotic_promotion
    - structure_gate_passed
    - laundering RUN-DS-001-ctrl-theater / EXP-IT-001
    - status abandoned_before_archive
    required_report_fields:
    - cell_record
    - R_point
    - cost_identity_definition_ref
    - ci_quantity_label
    - ci_low
    - ci_high
    - ci_method
    - ci_of_cost_identity_R
    - ci_contains_point_estimate
    - ci_identity_pass
    - ci_identity_fail
    - raw_costs_ref
    pass_condition: >-
      ci_identity_pass true IFF required fields present, ci_quantity_label names
      cost_identity_R (or documented identical transform), ci_of_cost_identity_R
      true, and ci_contains_point_estimate true. Otherwise set ci_identity_fail=true
      and ci_identity_pass=false — honest negative observation on CI honesty
      (compatible with RT047-B2 point-outside-CI / wrong-quantity CI), NOT
      infrastructure failure and NOT lane death.
    falsifies_if: >-
      CI honesty claimed while ci_of_cost_identity_R false or point outside CI;
      OR required fields missing; OR unauthorized theater/EXP-IT WIP reused; OR
      control status is not executable.
  scope:
    primary_cell:
      bits: 20
      B: 64
      m: 4
      seed: 101
      note: >-
        EV-DS-003 / unplanted default cell where RT047-B2 CI pathology was named
        (R≈0.028; wall-proxy CI issues). Primary CI-identity measurement cell.
    secondary_cell:
      bits: 16
      B: 128
      m: 4
      seed: 102
      note: Optional secondary; EV-DS-007/008 ladder cell.
    matrix: No full 54-cell re-run. Single cell or ≤2 cells.
    does_not_supersede: EV-DS-002 / EV-DS-003 / EV-DS-004 / EV-DS-006 / EV-DS-007 / EV-DS-008
  required_artifacts:
  - experiments/EXP-DS-001/results/ctrl_ci_identity/summary.json
  - experiments/EXP-DS-001/results/ctrl_ci_identity/ci_identity_report.json
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-ci-identity/
