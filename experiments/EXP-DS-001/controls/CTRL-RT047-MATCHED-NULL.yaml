      Branches D-1 through D-4 partition every (W,U) pair in the extended
      reals - D-1 covers LOW/LOW, D-2 covers HIGH/HIGH, D-3 covers MID/MID, and
      D-4 covers all six mixed-band combinations. D-5 pre-empts all four when
