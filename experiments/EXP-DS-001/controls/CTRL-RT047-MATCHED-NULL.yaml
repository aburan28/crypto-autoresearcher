control_protocol:
  id: CTRL-RT047-MATCHED-NULL
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-021
  protocol_amendment_id: PA-DS-001-v2-ctrl-matched-null
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  parent_approval_decision: DEC-20260731-022
  authoring_task: TASK-20260801-001
  snapshot_task: TASK-20260801-002
  re_review_task: TASK-20260801-003
  approval_task: TASK-20260801-004
  execution_task: TASK-20260801-005

  supersession_semantics: >-
    SUPERSEDING-STYLE ADDENDUM, NOT A REWRITE. This control protocol is a NEW
    record under a NEW id. It does not overwrite, edit, re-score, re-open or
    invalidate CTRL-RT025-UNPLANTED.yaml, CTRL-RT025-PLANT-LIVE, the
    RUN-DS-001-ctrl-unplanted run package, EV-DS-001, EV-DS-002, EV-DS-003, or
    any BATCH-020 artifact. Those records stand exactly as archived. What this
    addendum supersedes is only the FORWARD READING of the null axis: it
    declares NULL-DS-RANDOM-MULTIHOMOGENEOUS an unmatched null (RT047-B2) and
    installs a matched-ALGORITHM null in its place for all future
    structure-dependence readings in this lane. Prior R_null figures remain in
    the record as measured; they simply no longer license a structure claim.

  sources:
    - RT-20260731-047
    - DEC-20260801-003
    - EV-DS-003
    - VAL-20260801-001
    - RT-20260731-038
  discharges_attempted:
    - RT047-CTRL-1
  explicitly_not_discharged_here:
    - id: RT047-CTRL-3
      why: >-
        Plant-detector specificity is a contract-drafting item ranked BEHIND
        this control by DEC-20260801-003. CTRL-RT025-PLANT-LIVE stays
        UNDISCHARGED and no plant is executed in this batch.
    - id: RT047-CTRL-2
      why: >-
        The B-sweep artifact tell is the immediate follow-on, and is only
        interpretable once the object-level matched null is known.
    - id: RT047-CTRL-4
      why: >-
        The sparse-target success-probability regime is a separate control; the
        matched null deliberately preserves this cell's representation density
        so that the object, not the regime, is the only thing that changes.

  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: >-
    Toy-tier single-cell matched-null control only. NOT CLAIMABLE UNDER ANY
    OUTCOME - crypto-scale ECDLP improvement; asymptotic support; S1_met on
    this cell or any cell; F1_met; structure_gate_passed; GOAL completion;
    HEUR-DS-1 validation or refutation; any change to H-IC-001 or H-STR-002;
    any affected-scheme scope statement; dominated_by null anywhere downstream.
    All four asymptotic promotion gates G1-G4 remain OPEN. RT038-B1..B7+M1 and
    RT047-B1..B5+M1 continue to bind interpretation.

  purpose: >-
    Decide the single load-bearing inference of the EXP-DS-001 lane - that
    "R < 0.5 while R_null >= 0.9 means the split arm's advantage is
    structure-dependent" - by running the IDENTICAL ALGORITHM against an object
    from which all elliptic-curve and Semaev structure has been removed while
    the composition law and the factor-base geometry are preserved. Per
    docs/inventor-protocol.md section 3.2 a null object must be the identical
    measurement on a random instance of the SAME SHAPE. The legacy null changes
    the algorithm and leaves the structure question untouched (RT047-B2); this
    control changes only the object.

  # ====================================================================
  # THE OBJECT
  # ====================================================================
  matched_null_object:
    id: NULL-DS-ADDITIVE-Z753848
    group: >-
      The additive cyclic group Z/NZ with N = 753848, i.e. integers modulo
      753848 under addition. N is exactly the full curve group order
      #E(F_p) = 753848 recorded in
      experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/raw-result.json for
      the BATCH-020 cell (p = 752627, subgroup_order_n = 241). Order matching is
      mandatory - a different order would confound object with size.
    what_is_destroyed: >-
      Every elliptic-curve and Semaev property. There is no curve, no
      x-coordinate, no point at infinity, no summation polynomial, no degree,
      no resultant, no multihomogeneous structure, and no smoothness-bearing
      algebraic intermediate. Group elements are bare residues.
    what_is_preserved: >-
      The composition law (an abelian group operation on a set of size 753848),
      the group order, the factor-base cardinality and its closure under
      negation, the arity m = 4, the target count, the seed, the stopping rule,
      the cost identity, and - critically - the ALGORITHM. naive_search and
      split_search are the same code paths.
    element_encoding: >-
      A group element is a Python int in [0, N). Negation is (N - g) mod N.
      Addition is (a + b) mod N. No other operation is defined on the object.
    representation_density_matching: >-
      With 128 signed base elements and m = 4, the multiset count C(131,4) is
      about 1.2e7 against N = 753848, giving about 16 expected representations
      per uniform random target - the same density as the BATCH-020 curve cell
      (Executor AN-3). This is deliberate. The matched null must differ from
      the real object in STRUCTURE ONLY; changing the success-probability
      regime as well would make the comparison uninterpretable. The sparse
      regime is RT047-CTRL-4's job, not this control's.

  factor_base_construction:
    size_unsigned: 64
    size_signed: 128
    closed_under_negation: true
    procedure: >-
      Using the frozen seed 101 stream and a DECLARED, RECORDED draw order,
      draw unsigned base elements g_1..g_64 uniformly at random from
      [1, N-1], rejecting (a) zero, (b) any duplicate of an already-accepted
      g_i, (c) any g with 2*g mod N == 0 (i.e. g == N/2 = 376924, which is its
      own negation and would break the 128-element signed cardinality), and
      (d) any g whose negation N-g has already been accepted. The signed factor
      base is then the 128-element list [g_1, N-g_1, g_2, N-g_2, ...] in that
      exact order.
    required_recording: >-
      The run MUST record factor_base_sha256 over the canonical serialization
      of the 128 signed elements, the accepted 64 unsigned elements in draw
      order, the rejection counts by rejection class (a)-(d), and the seed and
      draw-order description, so an independent session can regenerate the base
      byte-for-byte from seed 101 alone.
    forbidden: >-
      Any structured, deterministic-subset, small-residue, arithmetic-
      progression, or otherwise non-uniform base. The base must be random
      residues. Reusing curve x-coordinates as residues is FORBIDDEN - that
      would smuggle curve structure into the null object.

  target_mode:
    id: matched_null_uniform_random
    count: 200
    description: >-
      200 uniform random residues drawn from [0, N) with the same seed-101
      stream discipline. Planted m-sums are FORBIDDEN as the yield source, as
      in CTRL-RT025-UNPLANTED.
    required_recording: >-
      target_stream_sha256, attempted_targets, success_count, and the empirical
      success probability per arm. Do not impute planted yield.

  # ====================================================================
  # THE ALGORITHM - FROZEN, UNCHANGED
  # ====================================================================
  algorithm_invariance:
    binding: >-
      naive_search and split_search run UNCHANGED. The ONLY permitted
      difference from RUN-DS-001-ctrl-unplanted is the object the arms operate
      on - the group operation, the element type, and the base/target sources.
      If the Executor cannot achieve that by parameterizing the object without
      touching the search logic, that is itself a reportable finding and must
      be declared as a protocol deviation with the exact diff, not silently
      absorbed.
    frozen_settings:
      smoothness_abort: false
      relations_target: 200
      seed: 101
      m: 4
      B: 64
      charge_backend_units: >-
        Unchanged. The frozen charge_backend_units function and its constant
        per-call charge (40 for m = 4) apply identically to every arm.
      backend_id: ds001-v2-point-sum-membership+charged-units-v1
      backend_id_note: >-
        The backend ID is carried unchanged for comparability with BATCH-020.
        The Executor MUST additionally record
        backend_object: "additive-Z753848" on the matched-null arms so that no
        reader mistakes those arms for point-sum membership on a curve. Backend
        identity change beyond this recorded object field voids the comparison.
      encode_intermediate_and_D: >-
        Unchanged. At these parameters D = 2^40 while every residue is
        < 753848 < 2^20, so encode_intermediate remains the identity map, as
        RT047-B2 derived for the curve case. This is expected and must be
        recorded, not fixed.
      join_predicate: >-
        Unchanged - exact equality of the encoded intermediate, via the same
        claw_key hash-join. On the additive object exact equality is equality
        of residues.
    cost_identity: >-
      FROZEN AND UNCHANGED from specification.v2.yaml -
      cost_arm = reported_wall_seconds * rho_gop_per_second / max(n_usable,1).
      Charged units DO NOT enter this identity (RT047-B1). That fact must be
      stated in the summary rather than described as "optimistic for both arms
      equally".

  # ====================================================================
  # DECLARED PARAMETER - VALIDATOR DEFECT D-3
  # ====================================================================
  declared_parameters:
    PER_TARGET_CAP_SECONDS:
      value: 5.0
      units: seconds
      status: DECLARED_IN_CONTRACT
      provenance: >-
        Carried unchanged from ds001_ctrl_unplanted.py lines 67, 207, 278,
        where it was a HARD-CODED, UNDECLARED per-attempt truncation. Validator
        VAL-20260801-001 raised this as defect D-3 (severity minor, class
        undeclared_parameter, admissibility_impact none_on_this_run) because it
        appeared in no contract, manifest, raw-result or summary field.
        DEC-20260801-003 carried it as a standing limitation requiring
        declaration before any reuse of this driver. This clause is that
        declaration.
      semantics: >-
        A single per-target search attempt is truncated after 5.0 seconds of
        wall time and recorded as an incomplete attempt.
      known_bias: >-
        THE CAP BIASES THE NAIVE ARM FIRST. The naive arm is the slower arm by
        construction (depth-3 enumeration versus a depth-2 hash join), so as
        parameters grow it reaches the cap first; truncating the numerator's
        competitor shortens the naive arm's measured wall and therefore biases
        R DOWNWARD, in the direction that flatters the split arm. At the
        BATCH-020 cell the cap demonstrably never bound - the largest
        per-relation wall observed was 0.1196 s on real_naive, 42x under the
        cap - but that is a property of the cell, not of the driver.
      mandatory_reporting: >-
        The value 5.0 MUST appear as an explicit field in manifest.json,
        raw-result.json and summary.json, together with
        per_arm_capped_attempt_count for every arm.
      pre_registered_guard: >-
        IF per_arm_capped_attempt_count > 0 ON ANY ARM, the disposition map
        below is SUSPENDED for that run. A cap-truncated R is not a measurement
        of the quantity the map is about. The run is then reported as
        cap_truncated, the Coordinator decision is `inconclusive` on the
        instrument, and the repair is to raise or remove the cap and re-run -
        it is NOT a mathematical result in either direction (AGENTS.md rule 5).

  # ====================================================================
  # REQUIRED MEASUREMENTS AND REPORTING TEMPLATE
  # ====================================================================
  required_arms:
    - id: matched_null_naive
      object: NULL-DS-ADDITIVE-Z753848
      procedure: naive_search (unchanged)
    - id: matched_null_split
      object: NULL-DS-ADDITIVE-Z753848
      procedure: split_search (unchanged)
    - id: real_naive_remeasure
      object: E(F_p) as in RUN-DS-001-ctrl-unplanted
      procedure: naive_search (unchanged)
      why_required: >-
        SAME-HOST, SAME-SESSION COMPARABILITY. The disposition map compares
        R_matched_null against the real-arm R. Comparing a fresh measurement
        against a figure captured in a different session on a possibly
        differently-loaded host would import host drift into the decision. This
        arm is a RE-MEASURE for comparability only. It creates no new claim, it
        does not supersede RUN-DS-001-ctrl-unplanted, and any difference from
        the archived R = 0.0322 / 0.0147 is a host-variance observation to be
        reported, never a correction to EV-DS-003.
    - id: real_split_remeasure
      object: E(F_p) as in RUN-DS-001-ctrl-unplanted
      procedure: split_search (unchanged)
      why_required: See real_naive_remeasure.
    - id: legacy_null_naive
      object: NULL-DS-RANDOM-MULTIHOMOGENEOUS
      procedure: null_naive_search (unchanged)
      why_required: >-
        The legacy null arms are carried ONLY so that R_null is reported beside
        R_matched_null and the reader can see the two nulls disagree. The
        legacy null is declared UNMATCHED by this protocol (RT047-B2) and its
        R_null MAY NOT be used to support any structure reading.
    - id: legacy_null_split
      object: NULL-DS-RANDOM-MULTIHOMOGENEOUS
      procedure: null_split_search (unchanged)
      why_required: See legacy_null_naive.

  reporting_template:
    both_proxies_mandatory: >-
      EVERY ratio is reported as an ORDERED PAIR (wall proxy, charged-unit
      proxy) with NEITHER PRIVILEGED. Any table, summary line or prose sentence
      that gives one number without the other is a protocol violation. This
      requirement carries RT047-B1's proxy-sensitivity disclosure into the
      instrument itself rather than leaving it to the write-up.
    required_ratios:
      - name: R_matched_null
        definition: cost(matched_null_split) / cost(matched_null_naive)
        proxies: [wall, charged_units]
        role: THE DECISION VARIABLE
      - name: R_real_remeasure
        definition: cost(real_split_remeasure) / cost(real_naive_remeasure)
        proxies: [wall, charged_units]
        role: same-host comparability anchor
      - name: R_null_legacy
        definition: cost(legacy_null_split) / cost(legacy_null_naive)
        proxies: [wall, charged_units]
        role: reported for disclosure only; licenses no structure reading
    required_per_arm_fields:
      - reported_wall_seconds
      - reported_backend_units
      - n_enum
      - n_usable
      - attempted_targets
      - success_count
      - empirical_success_probability
      - peak_claw_table_entries
      - peak_rss_bytes
      - reported_overhead_wall_seconds
      - table_build_reported_wall_seconds
      - per_arm_capped_attempt_count
      - stop_reason
    required_disclosures:
      - >-
        A verbatim statement that the frozen cost identity is wall-derived and
        that charged units NEVER enter R, superseding the BATCH-020 summary's
        optimistic_assumptions_restated[0] wording (RT047-B1 discharging
        requirement 1).
      - >-
        The archived BATCH-020 figures quoted for reference as
        R_wall = 0.0322 and R_unit = 0.0147, and R_null_wall = 111.445 against
        R_null_unit = 0.9569, with the 2.20x and 116.5x proxy disagreements
        named (RT047-B1 discharging requirement 2).
      - >-
        A statement that the frozen R_null >= 0.9 gate is NOT robust to proxy
        choice - under the charged-unit ledger the BATCH-020 legacy null passed
        it by 6 percent, not by 12,000 percent (RT047-B1 discharging
        requirement 3).
      - >-
        A statement that the split arm's amortization asymmetry (real arm
        builds its claw table once; the legacy null arm rebuilds a table inside
        every attempt) is present unchanged, and whether the matched-null split
        arm amortizes ONCE like the real arm. If it does not, R_matched_null is
        not comparable to R_real and the disposition map is SUSPENDED, exactly
        as under the cap guard.
      - >-
        RT047-M1 advisory carried - bootstrap CIs add each arm's fixed overhead
        unresampled and are therefore anticonservative. Report the CI under
        BOTH the current estimator and an overhead-resampled variant, or state
        plainly that only the current estimator was computed.
      - >-
        dominated_by MAY NOT be null. Carry the BATCH-020 statement forward -
        matched Pollard-rho (measured 744 group operations on the curve
        instance) and BSGS (modeled 32 operations / 16 stored elements) - and
        add the matched-null object's own trivially-cheap baseline, since a
        discrete log in Z/NZ is solvable by one modular inverse. That last
        point is not a defect of the control; it is why the control measures
        ALGORITHM COST ONLY and claims nothing about hardness.
    certificate_requirement: >-
      Every claimed relation on every arm carries a certificate - the list of
      signed factor-base indices - re-verified by an INDEPENDENT verifier path
      that recomputes the sum in the relevant group and checks equality with
      the target, arity m = 4, and index validity. Report verified/total per
      arm. Anything below 100 percent verification makes the run
      completed_invalid, not a negative result.

  # ====================================================================
  # PRE-REGISTERED DISPOSITION MAP - FROZEN BEFORE THE RUN
  # ====================================================================
  disposition_map:
    status: PRE_REGISTERED_AND_FROZEN
    frozen_at_task: TASK-20260801-001
    frozen_before_run: true
    binding_statement: >-
      THIS MAP IS FROZEN BEFORE ANY DATA EXISTS. It is the point of BATCH-021.
      No branch, threshold, band, or reading below may be altered after
      RUN-DS-001-ctrl-matched-null produces a number, except by a versioned
      protocol_amendment recorded BEFORE the Coordinator sees the result and
      justified on grounds independent of the result. Changing a success
      criterion after observing an outcome without such an amendment is
      forbidden outright.
    decision_variable: >-
      W = R_matched_null under the wall proxy, U = R_matched_null under the
      charged-unit proxy. Both are required; neither is privileged. Bands per
      proxy - LOW is value < 0.5, MID is 0.5 <= value < 0.9, HIGH is
      value >= 0.9. The 0.5 and 0.9 thresholds are NOT new - they are the
      thresholds already frozen in H-DS-001's own prediction clause and in
      R-1's F2 branch.
    reference_values_from_batch020:
      R_real_wall: 0.0322
      R_real_unit: 0.0147
      note: >-
        Anchors quoted from the archived RUN-DS-001-ctrl-unplanted package for
        the D-1a/D-1b split below. The same-host re-measure arms supply the
        live comparison; if the re-measure differs from these anchors by more
        than a factor of 2 on either proxy, that is a host-variance finding to
        be reported and the D-1a/D-1b split is evaluated against the LIVE
        re-measure, not against these archived numbers.

    branches:
      - id: D-1
        name: ARTIFACT_CONFIRMED / GENERIC MEET-IN-THE-MIDDLE
        condition: W < 0.5 AND U < 0.5
        anchor_expectation: >-
          The RT047-predicted artifact values are W about 0.03 and U about
          0.015, i.e. approximately equal to the real-arm R, because the
          observed win would then be generic meet-in-the-middle that transfers
          to any group.
        sub_branches:
          - id: D-1a
            name: QUANTITATIVE TRANSFER
            condition: >-
              D-1 holds AND both W and U are within a factor of 2 of the
              corresponding live real-arm re-measure ratio.
            reading: >-
              The advantage transfers essentially in full to an object with no
              elliptic-curve structure whatsoever. The strongest form of the
              artifact finding.
          - id: D-1b
            name: PARTIAL TRANSFER
            condition: >-
              D-1 holds AND W or U exceeds twice the corresponding live
              real-arm re-measure ratio.
            reading: >-
              The advantage is predominantly generic but is attenuated on the
              structure-free object. The write-up MUST say the transfer is
              PARTIAL and MUST NOT round it to "identical". The residual gap is
              a live quantity, not noise, and RT047-CTRL-2's B-sweep is the
              instrument that would resolve it.
        fires: >-
          H-DS-001's OWN falsification condition - "R_null < 0.5 whenever
          R < 0.5, apparent gain is an engine artifact, not Semaev structure" -
          and R-1's F2 branch. THIS WOULD BE THE FIRST TIME EITHER HAS FIRED IN
          THE ENTIRE EXP-DS-001 SERIES (f2_eligible = 0 across 54 cells per
          RT038-B3).
        coordinator_decision: weaken
        hypothesis_status_transition: >-
          H-DS-001 analyzed -> weakened, SCOPED EXACTLY to the claim that the
          measured R evidences Semaev/multihomogeneous structure. It is NOT a
          finding that the mechanism fails, because the mechanism was never
          exercised - smoothness_abort has been false on every real arm in the
          series and is_B_smooth has never been called.
        reattribution: >-
          The win is REATTRIBUTED to generic meet-in-the-middle - a depth-3 to
          depth-2 enumeration change with a hash table, available on any group
          with any factor base, buying roughly the |signed|/2 saving already
          visible in the BATCH-020 charged-unit ledger.
        explicitly_not: >-
          EXPLICITLY NOT reject_scoped, NOT reject-as-impossibility, and NOT a
          closure of the lane. Premature closure is a failure mode symmetric
          with overclaiming (docs/inventor-protocol.md section 4). A
          reject_scoped on a single unreplicated empirical-only run is
          forbidden by the Coordinator contract in any case.
        refutation_artifact_required: >-
          Before the weaken decision is recorded, the strongest checkable
          refutation artifact the result admits MUST be archived - in order of
          preference (1) a counterexample certificate, namely the verified
          matched-null relation certificates themselves, which constitute the
          RT047 counterexample construction executed and verified;
          (2) failing full verification, a derivation note; (3) failing that, a
          declared empirical_only basis. The artifact is archived in or before
          the same ledger commit as the decision that relies on it.
        mandatory_companions: >-
          The weaken decision MUST be paired with (i) a scheduled REPLICATION
          at a second seed, and (ii) RT047-CTRL-2's B-sweep, both ranked into
          the BATCH-022 opening. Weaken plus replication is the contract's
          prescribed route where reject_scoped is unavailable.
        knowledge_promotion_expectation: >-
          A weaken on a single unreplicated preliminary run does NOT satisfy
          the KN-FIND promotion gate, which requires support or reject_scoped
          on replicated/strong evidence. Expect `not_warranted` with the
          concrete reason, and record the methodological lesson as the first
          KN-FIND candidate once replication lands. Pre-registering this
          prevents a post-hoc promotion.

      - id: D-2
        name: STRUCTURE EVIDENCE
        condition: W >= 0.9 AND U >= 0.9
        reading: >-
          The split arm LOSES its advantage when elliptic-curve structure is
          removed while the algorithm is held fixed. This would be THE FIRST
          GENUINE STRUCTURE EVIDENCE THIS EXPERIMENT HAS PRODUCED.
        coordinator_decision: replicate
        hypothesis_status_transition: >-
          H-DS-001 remains `analyzed`. NOT `supported` and NOT `replicated`.
          Two independent bars block promotion regardless of how favourable the
          number is - the AGENTS.md state machine requires `replicated` before
          `supported`, and H-DS-001's own criterion demands R < 0.5 at B >= 64
          on at least TWO bit sizes among {16,20,24} while this package supplies
          one. That is arithmetically unmeetable from this run. Pre-registered
          so that a favourable result cannot be promoted on enthusiasm.
        immediate_follow_on: >-
          RT047-CTRL-2's B-sweep becomes the immediate follow-on and the
          BATCH-022 single next action - R must be measured against
          B in {32,64,128,256} on both the real and the matched-null object,
          because a structure reading predicts a departure from the 1/(2B)
          generic-MITM curve and that prediction is the checkable one.
        also_required: >-
          Even under D-2, all five RT047-B objections and RT038-B1..B7+M1
          remain binding, no asymptotic gate moves, the cost model stays broken
          (RT047-C1..C6), and the claim ceiling stays toy.

      - id: D-3
        name: PARTIAL ATTENUATION / MID BAND ON BOTH PROXIES
        condition: 0.5 <= W < 0.9 AND 0.5 <= U < 0.9
        reading: >-
          The advantage is materially attenuated on the structure-free object
          but not eliminated. Neither the generic-MITM explanation nor the
          structure explanation accounts for the observation on its own. THIS
          BRANCH EXISTS SO THAT THE MIDDLE IS NOT A GAP INVITING POST-HOC
          INTERPRETATION.
        coordinator_decision: inconclusive
        hypothesis_status_transition: H-DS-001 remains `analyzed`. No transition.
        why_not_weaken: >-
          H-DS-001's falsification condition is stated at the 0.5 threshold and
          is NOT met in this band, so the hypothesis's own falsifier does not
          fire and a weaken would be the Coordinator inventing a threshold
          after the fact.
        why_not_structure: >-
          The frozen structure gate is 0.9 and is not met either. A partial
          attenuation is consistent with a constant-factor implementation
          difference between the two objects (modular addition versus curve
          addition) and does not discriminate.
        next_action_if_fired: >-
          RT047-CTRL-2's B-sweep, for the reason that a single point estimate
          in the middle band cannot discriminate loop depth from structure but
          the SCALING of R with B can. Additionally require an
          object-cost-parity measurement - the per-operation cost of modular
          addition versus curve addition on this host - because a constant
          object-level cost ratio would move R_matched_null relative to R_real
          for a reason that has nothing to do with structure.

      - id: D-4
        name: PROXY DISAGREEMENT / COST-MODEL FINDING
        condition: >-
          W and U fall in DIFFERENT bands (any combination not covered by D-1,
          D-2 or D-3, for example W >= 0.9 with U < 0.5, or W < 0.5 with U in
          the mid band).
        reading: >-
          The choice of cost proxy determines the SIGN of the conclusion. This
          is not an ambiguity to be resolved by picking a proxy - it is a
          POSITIVE, REPORTABLE FINDING that establishes RT047-B1 and RT047-H4
          as measured defects rather than objections. Neither proxy is
          privileged, and a decision that picked one would be a post-hoc choice
          of the outcome.
        coordinator_decision: inconclusive
        decision_label: inconclusive_on_mechanism_with_cost_model_defect_established
        hypothesis_status_transition: H-DS-001 remains `analyzed`. No transition.
        next_action_if_fired: >-
