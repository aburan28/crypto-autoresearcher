        name: RUN NOT ADMISSIBLE / GUARD FIRED
        condition: >-
          Any of - Validator returns INADMISSIBLE; certificate verification is
          below 100 percent on any arm; per_arm_capped_attempt_count > 0 on any
          arm; the matched-null split arm does not amortize its claw table once
          as the real split arm does; an arm fails to reach 200 relations for
