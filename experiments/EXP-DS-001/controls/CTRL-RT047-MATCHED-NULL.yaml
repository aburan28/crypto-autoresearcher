          undeclared code change; or the run terminates by timeout, crash,
          resource exhaustion, or budget cancellation.
        coordinator_decision: inconclusive
        reading: >-
          INFRASTRUCTURE OR INSTRUMENT SIGNAL, NEVER A MATHEMATICAL RESULT
          (AGENTS.md rule 5). The disposition map is SUSPENDED - branches D-1
          through D-4 do not apply and no band is read off a defective run.
        hypothesis_status_transition: H-DS-001 remains `analyzed`. No transition.
        next_action_if_fired: >-
          A scoped repair task with the concrete defects listed, then a re-run
          of RUN-DS-001-ctrl-matched-null under the SAME frozen disposition
          map. The map is not re-drafted for the repair.

