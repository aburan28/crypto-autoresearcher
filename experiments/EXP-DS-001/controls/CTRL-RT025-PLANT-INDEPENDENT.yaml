control_protocol:
  id: CTRL-RT025-PLANT-INDEPENDENT
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-021
  protocol_amendment_id: PA-DS-001-v2-ctrl-theater-repair
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  parent_approval_decision: DEC-20260731-003
  discharges:
    - RT047-B3
    - residual RT038-B3 plant-theater
  sources:
    - RT-20260731-047
    - DEC-20260731-012
    - RT-20260731-038
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: >-
    Toy-tier plant-gate repair only. NOT CLAIMABLE: crypto-scale ECDLP
    improvement; asymptotic support; S1_met; GOAL completion; any change to
    H-IC-001 / H-STR-002. Promotion gates remain OPEN.

  purpose: >-
    Discharge echo-factor tautology in CTRL-RT025-PLANT-LIVE by requiring a
    non-tautological plant detection path: plant must be injected into the
    harvest reporting path before an independent null-gate reads costs.

  method:
    inject: >-
      Apply live /4 (or equivalent cost inflation) to reported split costs
      in the harvest/reporting path BEFORE the null-gate detector runs.
    forbid:
      - in-detector divide-then-echo arithmetic (null_gate_echo_factor alone)
      - synthetic known-answer synth_R / synth_Rn OR-path
      - hardcoded planted_bug_detected=true without a gate FLAG
    require_detection_path:
      - null_gate_f2_shape
      - or equivalent non-arithmetic FLAG documented in plant_independent_report.json
    pass_condition: >-
      planted_bug_detected true via a non-echo path; echo-only detection is
      insufficient for discharge.
    falsifies_if: >-
      Detection relies solely on null_gate_echo_factor, or planted_bug_detected
      is hardcoded true, or synthetic shortcuts are used.

  scope:
    cells:
      - bits: 20
        B: 64
        m: 4
        seed: 101
    matrix: Single cell / small ladder only. No full 54-cell re-run.
    does_not_supersede: EV-DS-002 / EV-DS-003 remain immutable prior records.

  required_artifacts:
    - experiments/EXP-DS-001/results/ctrl_theater/plant_independent_report.json
