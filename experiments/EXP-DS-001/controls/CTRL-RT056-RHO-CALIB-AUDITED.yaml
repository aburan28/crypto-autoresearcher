control_protocol:
  id: CTRL-RT056-RHO-CALIB-AUDITED
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-022
  protocol_amendment_id: PA-DS-001-v2-ctrl-theater-r2
  supersedes_protocol: CTRL-RT025-RHO-CALIB
  supersedes_note: >-
    Fresh protocol path for BATCH-022. Does not edit the rejected
    BATCH-021 freeze blob CTRL-RT025-RHO-CALIB.yaml. Carries RT056-M1
    audit-schema tightening (non-blocking alone in RT-056; included for
    completeness).
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  discharges:
    - residual RT038-B3 rho-calib theater
    - RT056-M1 (audit fields)
  sources:
    - RT-20260731-056
    - RT-20260731-047
    - DEC-20260731-015
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: Toy-tier rho-calibration honesty only. No asymptotic claim.

  purpose: >-
    Replace hardcoded rho_calib_ratio_real=rho_calib_ratio_null=1.0 with a
    measured real-vs-null rho calibration that can fail, with auditable raw
    fields.

  method:
    measure: >-
      Compute rho_calib_ratio_real and rho_calib_ratio_null from measured
      rho wall/gop on real and null arms (or an explicit measured proxy
      documented in rho_calib_audited_report.json). Values MUST be writable
      as non-1.0; a forced constant 1.0 is a protocol violation.
    required_report_fields:
      - rho_wall_real
      - rho_gop_real
      - rho_wall_null
      - rho_gop_null
      - rho_calib_ratio_real
      - rho_calib_ratio_null
      - proxy_formula_if_used
    parent_band_binding: >-
      Parent v2 ±0.15 calibration band is DEFERRED INTERPRETATION for this
      control — not an acceptance gate for CTRL-RT056-RHO-CALIB-AUDITED pass.
      Anti-hardcode theater discharge does not require band membership.
    pass_condition: >-
      Report records measured ratios and the required raw wall/gop fields (or
      named proxy formula + inputs); if measurement fails, status is
      failed_infrastructure / incomplete — not a mathematical negative on
      H-DS-001 (AGENTS.md rule 5).
    falsifies_if: >-
      Both ratios remain hardcoded 1.0 with no measurement path; OR the
      report claims measured while code forces 1.0; OR required raw fields
      (or proxy formula+inputs) are omitted while claiming measured.

  scope:
    cells:
      - bits: 20
        B: 64
        m: 4
        seed: 101
    does_not_supersede: EV-DS-002 / EV-DS-003 / EV-DS-004 remain immutable prior records.

  required_artifacts:
    - experiments/EXP-DS-001/results/ctrl_theater_r2/rho_calib_audited_report.json
