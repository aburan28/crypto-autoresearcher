control_protocol:
  id: CTRL-RT025-NULL-SPLIT-COMPOSITION
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-021
  protocol_amendment_id: PA-DS-001-v2-ctrl-theater-repair
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  discharges:
    - residual RT038-B3 null-split asymmetry
    - inventor-protocol null-object destroy parameter
  sources:
    - RT-20260731-047
    - DEC-20260731-012
    - docs/inventor-protocol.md
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: Toy-tier null_split composition repair only. No asymptotic claim.

  purpose: >-
    Repair null_split so half-keys compose; demonstrate that R_null can fall
    below 0.9 under a packaging-like real arm (destroy parameter for a
    non-falsifiable null gate).

  method:
    compose: >-
      Null-object split half-keys must compose under the same claw/join
      machinery as the real arm (document composition rule in
      null_split_report.json). Asymmetric crippling of null_split that
      forces R_null ≫ 1 by construction is forbidden.
    destroy_parameter_check: >-
      Under at least one packaging-like real-arm configuration on the
      declared cell (or a documented adjacent toy cell), show R_null can
      fall below 0.9, OR report honestly that R_null could not be driven
      below 0.9 after the composition repair (failure of falsifiability —
      observation, not H-DS-001 mathematical negative alone).
    pass_condition: >-
      Composition rule documented; R_null behavior under destroy attempt
      recorded with raw costs.
    falsifies_if: >-
      null_split remains asymmetrically non-composing with no repair, or
      report claims composition while half-keys cannot join.

  scope:
    cells:
      - bits: 20
        B: 64
        m: 4
        seed: 101
    matrix: No full 54-cell re-run.
    does_not_supersede: EV-DS-002 / EV-DS-003 remain immutable prior records.

  required_artifacts:
    - experiments/EXP-DS-001/results/ctrl_theater/null_split_report.json
