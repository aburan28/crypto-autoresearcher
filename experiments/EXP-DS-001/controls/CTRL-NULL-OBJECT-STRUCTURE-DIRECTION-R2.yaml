control_protocol:
  id: CTRL-NULL-OBJECT-STRUCTURE-DIRECTION-R2
  status: executable
  restored_by_decision: DEC-20260731-025
  supersedes_cancelled_blob_commit: 1aa3b957b54c62704be82f001f1fe56474c89f50
  restore_note: >-
    Race commit 1aa3b957 wrote cancelled_before_approval stubs under DEC-024 pivot.
    DEC-20260731-025 supersedes that fork for execution and restores this executable
    package. Abandoned BATCH-024 stubs at 32165e30 remain untouched.
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-025
  protocol_amendment_id: PA-DS-001-v2-ctrl-structure-null-r2
  supersedes_non_executable: CTRL-NULL-OBJECT-STRUCTURE-DIRECTION
  supersedes_note: >-
    Does not edit experiments/EXP-DS-001/controls/CTRL-NULL-OBJECT-STRUCTURE-DIRECTION.yaml
    (abandoned_before_archive stub at 32165e30). Fresh executable path for BATCH-025.
  extends_protocol: CTRL-RT056-NULL-SPLIT-HARD-DESTROY
  extends_note: >-
    Reuse composing null-object / null_split packaging hygiene from
    CTRL-RT056-NULL-SPLIT-HARD-DESTROY without editing that blob.
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  parent_approval_decision: DEC-20260731-003
  discharges:
  - RT079-B3
  - RT070-B3
  sources:
  - RT-20260731-079
  - RT-20260731-070
  - DEC-20260731-022
  - EV-DS-007
  - docs/inventor-protocol.md
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: >-
    Toy-tier structure-null direction control only. NOT CLAIMABLE: crypto-scale
    ECDLP improvement; asymptotic support; S1_met; structure_gate from plant
    contrast alone; GOAL completion; any change to H-IC-001 / H-STR-002.
    Promotion gates remain OPEN.
  purpose: >-
    Scientifically attack RT079-B3 / RT070-B3 by requiring that any structure
    credit demand R_null >= 0.9 (or a documented rising ladder toward 1) while R
    is advantageous under the same null-object packaging. Forbid renaming
    plant-contrast success / planted_bug_detected as structure_gate_passed.
    Allow honest structure_direction_fail.
  method:
    reuse: >-
      Reuse composing null-object / null_split packaging hygiene from
      CTRL-RT056-NULL-SPLIT-HARD-DESTROY (do not re-edit that blob). Measure R and
      R_null on declared cells with raw costs.
    definitions:
      advantageous_R: R < 0.5
      R_null_threshold_0_9: 0.9
      structure_null_ok: R_null >= 0.9
      structure_gate_eligible: advantageous_R AND structure_null_ok
      rising_ladder_ok: >-
        documented adjacent ladder (<=6 cells) where R_null increases toward
        >= 0.9 while R remains advantageous under identical packaging rules
    forbid:
    - structure_gate_passed true unless structure_gate_eligible or rising_ladder_ok
    - equating planted_bug_detected / contrastive_discriminative with structure support
    - S1_met
    - support
    - asymptotic_promotion
    - status abandoned_before_archive
    - laundering RUN-DS-001-ctrl-theater / results/ctrl_theater
    - laundering uncommitted EXP-IT-001 / H-IT-001
    - editing abandoned BATCH-024 stub blobs
    required_report_fields:
    - cell_or_ladder_search_record
    - R
    - R_null
    - advantageous_R
    - structure_null_ok
    - structure_gate_eligible
    - rising_ladder_ok
    - structure_direction_pass
    - structure_direction_fail
    - packaging_rule_ref
    - raw_costs_ref
    pass_condition: >-
      structure_direction_pass true IFF structure_gate_eligible OR rising_ladder_ok,
      with required fields and raw costs. If advantageous_R holds but R_null stays
      < 0.9 and no rising ladder is demonstrated, set structure_direction_fail=true
      and structure_direction_pass=false — honest negative observation on structure
      claim eligibility (expected under RT079-B3 / EV-DS-007 R_null≪1), NOT
      infrastructure failure and NOT reject_scoped / lane death on H-DS-001.
    falsifies_if: >-
      structure_gate_passed / structure_direction_pass claimed while
      structure_gate_eligible false and rising_ladder_ok false; OR plant-contrast
      alone used as structure credit; OR required fields missing; OR unauthorized
      theater WIP or EXP-IT WIP reused; OR control status is not executable.
  scope:
    primary_cell:
      bits: 16
      B: 128
      m: 4
      seed: 102
      note: >-
        EV-DS-007 contrastive plant-success cell; R_null≪1 previously (≈0.016).
        Primary structure-null measurement cell.
    secondary_cell:
      bits: 20
      B: 64
      m: 4
      seed: 101
      note: Default cell; optional secondary measure.
    optional_harden_ladder:
      max_cells: 6
      intent: >-
        Increase bits and/or harden B; record whether R_null rises toward 0.9
        while R stays advantageous.
    matrix: No full 54-cell re-run.
    does_not_supersede: EV-DS-002 / EV-DS-003 / EV-DS-004 / EV-DS-006 / EV-DS-007
  required_artifacts:
  - experiments/EXP-DS-001/results/ctrl_structure_null_r2/summary.json
  - experiments/EXP-DS-001/results/ctrl_structure_null_r2/structure_null_report.json
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-structure-null-r2/
