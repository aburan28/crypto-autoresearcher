control_protocol:
  id: CTRL-RT056-NULL-SPLIT-HARD-DESTROY
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-022
  protocol_amendment_id: PA-DS-001-v2-ctrl-theater-r2
  supersedes_protocol: CTRL-RT025-NULL-SPLIT-COMPOSITION
  supersedes_note: >-
    Fresh protocol path for BATCH-022. Does not edit the rejected
    BATCH-021 freeze blob CTRL-RT025-NULL-SPLIT-COMPOSITION.yaml.
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  discharges:
    - RT056-B1
    - residual RT038-B3 null-split asymmetry
    - inventor-protocol null-object destroy parameter
  sources:
    - RT-20260731-056
    - RT-20260731-047
    - DEC-20260731-015
    - docs/inventor-protocol.md
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: Toy-tier null_split hard-destroy repair only. No asymptotic claim.

  purpose: >-
    Repair null_split so half-keys compose, and hard-require
    destroy_demonstrated iff measured R_null < 0.9. Soft-passing on
    honest non-falsifiability is forbidden (RT056-B1).

  method:
    compose: >-
      Null-object split half-keys must compose under the same claw/join
      machinery as the real arm (document composition rule in
      null_split_hard_destroy_report.json). Asymmetric crippling of
      null_split that forces R_null ≫ 1 by construction is forbidden.
    status_split:
      composition_repaired: >-
        Half-keys join under the same claw/join as the real arm; rule
        documented with raw join evidence.
      destroy_demonstrated: >-
        Measured R_null < 0.9 under a packaging-like real arm on the
        declared cell (or a documented adjacent toy cell), with raw costs
        recorded. This bit is true IFF the measured inequality holds.
      falsifiability_failed: >-
        composition_repaired is true BUT measured R_null cannot be driven
        below 0.9. This is a TERMINAL NON-DISCHARGE for the co-required
        package (redesign required) — NOT a soft PASS and NOT a
        mathematical negative on H-DS-001 alone (AGENTS.md rule 5 /
        inventor-protocol §3 observation of non-falsifiability).
    destroy_parameter_check: >-
      Under at least one packaging-like real-arm configuration, attempt to
      drive R_null below 0.9. Set destroy_demonstrated iff measured
      R_null < 0.9 with raw costs. If composition is repaired but
      R_null >= 0.9 after the destroy attempt, set falsifiability_failed
      and fail the co-required control package.
    pass_condition: >-
      composition_repaired AND destroy_demonstrated (measured R_null < 0.9
      with raw costs). Recording destroy-attempt behavior without
      destroy_demonstrated is NOT a pass.
    falsifies_if: >-
      null_split remains asymmetrically non-composing with no repair; OR
      report claims composition while half-keys cannot join; OR
      falsifiability_failed is true; OR pass is claimed while measured
      R_null >= 0.9; OR soft-pass language treats non-destroy as discharge.

  scope:
    cells:
      - bits: 20
        B: 64
        m: 4
        seed: 101
    matrix: No full 54-cell re-run.
    does_not_supersede: EV-DS-002 / EV-DS-003 / EV-DS-004 remain immutable prior records.

  required_artifacts:
    - experiments/EXP-DS-001/results/ctrl_theater_r2/null_split_hard_destroy_report.json
