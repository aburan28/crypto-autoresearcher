control_protocol:
  id: CTRL-RT056-PLANT-CLOSED-PATH
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-022
  protocol_amendment_id: PA-DS-001-v2-ctrl-theater-r2
  supersedes_protocol: CTRL-RT025-PLANT-INDEPENDENT
  supersedes_note: >-
    Fresh protocol path for BATCH-022. Does not edit the rejected
    BATCH-021 freeze blob CTRL-RT025-PLANT-INDEPENDENT.yaml.
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  parent_approval_decision: DEC-20260731-003
  discharges:
    - RT056-B2
    - RT047-B3
    - residual RT038-B3 plant-theater
  sources:
    - RT-20260731-056
    - RT-20260731-047
    - DEC-20260731-015
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: >-
    Toy-tier plant-gate repair only. NOT CLAIMABLE: crypto-scale ECDLP
    improvement; asymptotic support; S1_met; GOAL completion; any change to
    H-IC-001 / H-STR-002. Promotion gates remain OPEN.

  purpose: >-
    Discharge RT056-B2 / RT047-B3 echo-tautology class by closing the plant
    detection_path enum and forbidding any FLAG whose truth is entailed by
    detector-applied plant arithmetic on the same reported costs.

  method:
    inject: >-
      Apply live /4 (or equivalent cost inflation) to reported split costs
      in the harvest/reporting path BEFORE the null-gate detector runs.
      Record injection_site in plant_closed_path_report.json.
    forbid:
      - in-detector divide-then-echo arithmetic (null_gate_echo_factor)
      - synthetic known-answer synth_R / synth_Rn OR-path
      - hardcoded planted_bug_detected=true without a gate FLAG
      - any "equivalent non-arithmetic FLAG" escape (open equivalence banned)
      - any FLAG whose truth is entailed by detector-applied plant arithmetic
        on the same reported costs (echo-entailment class)
    allowed_detection_path_enum:
      - null_gate_f2_shape
    require_detection_path: >-
      Exactly one path from allowed_detection_path_enum. No other path is
      admissible for co-required package discharge in BATCH-022.
    echo_entailment_definition: >-
      A FLAG is echo-entailed if its truth value is a logical consequence of
      arithmetic the detector itself applies to the same costs it reads
      (e.g. divide reported costs by 4, then observe factor-4). Such FLAGS
      have no detection power and are forbidden even under a new name.
    required_report_fields:
      - injection_site
      - costs_as_read_by_gate
      - detection_path
      - echo_entailment_check
    pass_condition: >-
      planted_bug_detected true via detection_path=null_gate_f2_shape;
      echo_entailment_check=false; injection_site and costs_as_read_by_gate
      recorded. Echo-only or entailment-class detection is insufficient.
    falsifies_if: >-
      Detection relies on null_gate_echo_factor; OR planted_bug_detected is
      hardcoded true; OR synthetic shortcuts are used; OR detection_path is
      outside allowed_detection_path_enum; OR echo_entailment_check is true
      or omitted; OR any FLAG in the echo-entailment class is used as the
      sole detection basis.

  scope:
    cells:
      - bits: 20
        B: 64
        m: 4
        seed: 101
    matrix: Single cell / small ladder only. No full 54-cell re-run.
    does_not_supersede: EV-DS-002 / EV-DS-003 / EV-DS-004 remain immutable prior records.

  required_artifacts:
    - experiments/EXP-DS-001/results/ctrl_theater_r2/plant_closed_path_report.json
