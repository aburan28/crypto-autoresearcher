control_protocol:
  id: CTRL-RT025-UNPLANTED
  companion_control_id: CTRL-RT025-PLANT-LIVE
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-020
  protocol_amendment_id: PA-DS-001-v2-ctrl-unplanted
  parent_contract: experiments/EXP-DS-001/specification.v2.yaml
  parent_contract_sha256: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
  parent_approval_snapshot: 65f3c82babae49a9acea64cfa2650d4f3d45cf72
  parent_approval_decision: DEC-20260731-022
  discharges:
    - RT038-B7
    - CTRL-RT025-UNPLANTED
    - CTRL-RT025-PLANT-LIVE
  sources:
    - RT-20260731-038
    - DEC-20260731-018
    - DEC-20260731-023
    - RT-20260731-025
  claim_tier: toy
  confirmatory_status: exploratory_control
  claim_ceiling: >-
    Toy-tier single-cell control remeasure only. NOT CLAIMABLE: crypto-scale
    ECDLP improvement; asymptotic support; S1_met on this cell alone; GOAL
    completion; any change to H-IC-001 / H-STR-002. All four asymptotic
    promotion gates remain OPEN. RT038-B1–B7 + M1 still bind interpretation
    of any later promotion request.

  purpose: >-
    Discriminate planted-yield packaging from a structure-dependent claw win
    by remeasuring the DEC-recommended control cell with unplanted random
    targets, and repair CTRL-NULL-PLANT to a live /4 without synthetic
    known-answer.

  scope:
    cells:
      - bits: 20
        B: 64
        m: 4
        seed: 101
    matrix: >-
      Single cell only. Do NOT re-run the full 54-cell planted matrix.
    heursampling: >-
      Not required for this control. Do not re-run RUN-DS-001-heur. Prior
      HEUR-DS-1 F3 observation (EV-DS-002) remains standing.
    does_not_supersede: >-
      Does not overwrite or re-score the planted relations=200 package
      (EV-DS-002 / snapshot 1eb431f1). Control results are a separate run
      package under RUN-DS-001-ctrl-unplanted.

  target_mode:
    id: unplanted_uniform_random
    description: >-
      Uniform random curve targets (or sparse random targets with explicit
      success-probability accounting in the raw result). Forbidden: planted
      random m-sums used as the primary yield source for this control cell.
    sparse_alternative_ok: true
    sparse_requires: >-
      If sparse targets are used, record attempted_targets, success_count,
      and empirical success probability; do not impute planted yield.

  backend:
    must_match_planted_package_id: ds001-v2-point-sum-membership+charged-units-v1
    note: >-
      Same backend id as EXP-DS-001 v2 planted package. Backend identity change
      voids the control comparison.

  smoothness_abort: false
  relations_target: 200
  resource_stop: >-
    Stop on relations_target=200 usable relations OR honest resource_exhaustion
    (cell wall / total budget). Resource exhaustion is infrastructure /
    scope-limited, never a mathematical negative on H-DS-001 (AGENTS.md rule 5).

  cost_identities: >-
    Identical to specification.v2.yaml cost_identities (yield-charged
    wall * rho_gop_per_second / max(n_usable,1)). Report n_usable_naive,
    n_usable_split, and whether either arm hit relations_target.

  companion_live_plant:
    id: CTRL-RT025-PLANT-LIVE
    method: >-
      On one real-arm measurement of the same cell, inflate reported split
      costs by live /4 (divide reported split ops or multiply charged split
      cost by 4 inverse as specified in driver) WITHOUT synthetic
      known-answer synth_R/synth_Rn shortcuts. Null gate must FLAG the plant
      (R_null echo) without hardcoded planted_bug_detected=true.
    pass_condition: >-
      planted_bug_detected true via live /4 detection path; synthetic-only
      detection is insufficient for discharge.
    falsifies_if: >-
      Live plant not detected while summary still claims
      planted_bug_detected=true.

  null_control:
    required: true
    object: NULL-DS-RANDOM-MULTIHOMOGENEOUS
    gate: >-
      Report R and R_null for the unplanted cell. R-1 remains binding: if
      R<0.5 and R_null<0.9, observation label is F2_eligible (overrides S1).

  packaging_falsification_rule: >-
    Expected under planted-yield packaging: unplanted R rises toward ≥0.5,
    and/or usable yield collapses to resource_exhaustion with near-zero
    successes. Expected under true structure-dependent rewrite: R remains
    <0.5 with bootstrap CI honestly excluding 0.5 from above AND R_null≥0.9
    AND live plant detected. A packaging-consistent outcome is NOT
    reject_scoped-as-impossibility on a single unreplicated empirical_only
    control; prefer weaken or keep analyzed pending replication.

  required_run:
    id: RUN-DS-001-ctrl-unplanted
    artifacts:
      - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/manifest.json
      - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/raw-result.json
      - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/stdout.txt
      - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/stderr.txt
      - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/command.txt
      - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/environment.json
      - experiments/EXP-DS-001/results/ctrl_unplanted/summary.json
      - experiments/EXP-DS-001/results/ctrl_unplanted/R_cell.json
      - experiments/EXP-DS-001/results/ctrl_unplanted/null_control_report.json
      - experiments/EXP-DS-001/results/ctrl_unplanted/live_plant_report.json

  budget:
    wall_clock_seconds: 7200
    memory_gb: 16
    maximum_runs: 1
    note: >-
      Prefer contractual cell_wall from specification.v2.yaml (7200s). If a
      shorter wall is used, record it as a protocol deviation, not as a
      mathematical negative.

  does_not_modify_hypotheses:
    - H-IC-001
    - H-STR-002

  run_authorization: >-
    No Executor run until TASK-20260731-043 records APPROVAL_DETERMINATION
    APPROVED for PA-DS-001-v2-ctrl-unplanted / this control protocol. Parent
    v2 matrix approval (65f3c82b) does not by itself authorize this control
    remeasure while planted-target deviations remain the operative package.
