# EXP-BINSTD-7622f5
# Distinguished-point exponent arithmetic. No point pool.
# Approved by DEC-20261002-c6d2ad.
experiment:
  id: EXP-BINSTD-7622f5
  hypothesis_id: H-BINSTD-e314fa
  source_idea: IDEA-20260922-6237e5
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Distinguished-point exponent arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-c6d2ad
  objective: >-
    Check the progress fraction, the density gaps, and the walk-index
    census on weights 0 through 34.
  inputs:
    progress_tenths: 583
    budget_tenths: 609
    gap_tenths: 26
    fifth: 13
    power_excess: 597139456
    fifth_power: 320597139456
    band_power: 320000000000
    seventeen_excess: 1631468544
    log_low_thousandths: 2599
    measured_dp_tenths: 331
    implied_density_tenths: 252
    paper_density_hundredths: 2527
    density_gap_hundredths: 7
    quotient_hundredths: 3303
    completion_dp_hundredths: 3563
    completion_gap_hundredths: 2527
    weight_cap: 34
    weight_count: 35
    index_low: 3
    index_high: 10
    index_at_cap: 4
    index_three_count: 6
    index_four_count: 5
    index_other_count: 4
  controls:
    - >-
      The fifth-power excess is 597139456. Reporting the progress
      fraction as at least 33/200 invalidates the run.
    - >-
      The measured density is 7/100 below 2527/100. Reporting the two
      densities as equal invalidates the run.
    - >-
      The index at weight 34 is 4. Reporting it as 3 invalidates the
      run.
    - >-
      Subtracting 3563/100 from 609/10 gives 2527/100. Reporting
      another difference invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {exponents, indices}
    - route in {tenths, powers}
  metrics:
    primary:
      - progress_fraction
      - index_at_cap
      - implementations_agree
    secondary:
      - density_gap
      - completion_identity
      - index_counts
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The excess 597139456 and the index 4 at weight 34.
    formula: >-
      The progress gap in tenths is 609 minus 583. The fraction is
      below 33/200 when 2^13 times 33^5 exceeds 200^5. The walk index
      is half the weight, modulo 8, plus 3.
    source: >-
      IDEA-20260922-6237e5 states the exponents and the weight cutoff,
      read 2026-10-02. The comparisons were computed in this design
      session. That computation is not a run. No point pool was sampled.
  scale_relevance:
    tier: toy
    justification: One exponent triple and 35 weights. No transfer to a relation search.
    correspondence: null
  tail_checks:
    - The weight 34 index is required. A census that stops at weight 33 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the progress fraction is reported as at least 33/200, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The fifth-power excess is not 597139456.
    - The index at weight 34 is not 4.
    - The density gap is not 7/100.
    - A point pool is sampled or a relation is searched.
  success_criterion: >-
    Both runs agree that the fifth-power excess is 597139456, that the
    measured density is 7/100 below 2527/100, that 609/10 minus 3563/100
    equals 2527/100, and that the index at weight 34 is 4.
  falsification_criterion: >-
    The runs agree, the fifth-power excess stays 597139456, and any
    factor differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-7622f5/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-7622f5/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-7622f5/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-7622f5/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-7622f5/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-7622f5/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any sampling of a point pool.
    - Any relation search or replay of a walk.
    - Any claim that a distinguished-point filter enriches a relation rate.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
