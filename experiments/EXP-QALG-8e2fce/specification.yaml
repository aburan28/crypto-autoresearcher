experiment:
  id: EXP-QALG-8e2fce
  hypothesis_id: H-QALG-b74bd1
  derived_from_idea: IDEA-20260813-55d3a0
  question_id: RQ-QALG-74bf20
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact toy-scale verification of the CRT projection of a dihedral coset sample,
    over every measurement outcome and every shift, with a degenerate-split positive
    control, a wrong-factorization negative control, an identifiability collision
    search, and a separate class-group-order factorization arm
  objective: >-
    The one uncertainty a run reduces is whether measuring the Z_{N2} component of a
    dihedral coset sample leaves a genuine D_{N1} coset sample behind - the single
    algebraic fact on which a CRT divide-and-conquer of the hidden-shift instance
    would rest. A run establishes (i) the EXACT fidelity between the reduced
    (coin, Z_{N1}) state and the directly constructed ground-truth D_{N1} coset
    state, for EVERY measurement outcome and EVERY shift, at every toy modulus pair
    on the declared ladder including deliberately unbalanced splits; (ii) whether
    two distinct shifts differing mod N1 can produce identical projected observables,
    which fidelity alone cannot see; (iii) the number of D_N samples consumed per
    usable D_{N1} sample as toy N grows, which is the cost the shared coin bit
    imposes; and (iv), in a separable arm, whether a standardized CSIDH class-group
    order admits a comparable-size coprime factorization at all, obtained with a
    citation and not adopted from any in-progress internal reconstruction. No attack
    is implemented, no quantum hardware is used, and no security level is asserted.
  what_this_is_not:
    - >-
      Not an attack on CSIDH or on any isogeny-based scheme, and not a claim about any
      parameter set's security level.
    - >-
      Not a modification of the reduction that produces the hidden-shift instance, and
      not a new quantum algorithm. It asks only whether an existing instance decomposes
      further given a public factorization.
    - >-
      Not an exponent-form improvement even in its best case. The strongest available
      outcome is a PARAMETER REDUCTION inside an unchanged exponent form, and the
      deliverable is forbidden from describing it otherwise.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record,
      and not a promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the executed toy moduli, over every measurement
      outcome and every shift, the projected state did or did not equal the ground-truth
      D_{N1} coset state exactly; no identifiability collision was found within the
      exhaustive toy sweep; and the coin-handling cost did or did not grow across the
      ladder. Separately: a standardized class-group order does or does not admit a
      comparable-size coprime split, with a citation. WHAT DOES NOT FOLLOW: no security
      claim; no cost figure at cryptographic scale; no exponent-form statement; and NOT
      that a positive toy result transfers - that transfer is HEUR-QALG-b74bd1-1 and
      carries its own falsification condition.
  inputs:
    procedure: >-
      STAGE 1 (zero compute, symbolic): derive CRT compatibility with the dihedral
      involution on paper, and FREEZE three conventions before anything runs - the coset
      state's normalization, the exact form of the publicly computable relabeling, and
      the fidelity definition. A relabeling chosen after seeing the reduced state can
      absorb any discrepancy, which is the single most likely way this contract would
      silently become a claim.
      STAGE 2 (seconds, POSITIVE CONTROL, read FIRST): the degenerate case N1 = N, no
      split. The construction must reproduce the ordinary coset state EXACTLY, entry for
      entry over the cyclotomic field. A failure voids the run.
      STAGE 3 (seconds, NEGATIVE CONTROL, read SECOND): a deliberately wrong
      pseudo-factorization with non-coprime factors. The compatibility check must REJECT
      it. If it accepts, the check cannot detect an incompatibility and no acceptance it
      later issues means anything.
      STAGE 4 (minutes, signal arm): for every toy pair (N1, N2) on the ladder - balanced
      and deliberately unbalanced - construct the D_N coset state exactly, apply CRT,
      trace out the Z_{N2} register for EVERY outcome x2*, and compare the reduced
      (coin, x1) density matrix against a ground-truth D_{N1} coset state constructed
      DIRECTLY, for every shift d. Exhaustive, not sampled.
      STAGE 5 (minutes, identifiability): sweep all pairs of shifts (d, d') with
      d1 != d1' and test whether their projected observables coincide after relabeling.
      STAGE 6 (minutes, cost): count D_N samples consumed per usable D_{N1} sample,
      including any post-selection on the coin, as a function of toy N across the ladder.
      STAGE 7 (arithmetic arm, separable): obtain a standardized CSIDH class-group order
      WITH A CITATION and factor it; report the split or the absence of one. If no
      citable value can be obtained in this container, report the arm as UNAVAILABLE.
      STAGE 8 (zero compute): assemble the verdict, scoped, with the forbidden-sentence
      list from the method ceiling applied.
    instrument: >-
      Pure Python 3.11 with EXACT rational and cyclotomic arithmetic - Fractions over a
      cyclotomic basis, or an equivalent exact representation. NO floating point anywhere
      in the fidelity computation: the claim is exact equality, and a float would turn a
      genuine falsification into a rounding question. No SageMath, which is absent from
      this container. No quantum hardware and no approximate simulator. Integer
      factorization for STAGE 7 by exact methods with the factorization certified by
      re-multiplication. Recorded through harness/runner.py.
    parameters: >-
      Toy ladder: at least four coprime pairs (N1, N2) with log2(N1*N2) <= 20, spanning
      BALANCED splits (log2 N1 close to log2 N2) and deliberately UNBALANCED ones, since
      the quantifier audit names size-comparability as the critical risk. Exhaustive over
      all x2* and all d at each pair - partial sampling is forbidden, because a mechanism
      that fails on one outcome fails. Degenerate control at N1 = N. Negative control at
      a non-coprime pseudo-split. STAGE 7 operates on standardized parameter sets only.
  controls:
    - >-
      POSITIVE CONTROL, exact, forced value, read FIRST. The degenerate case N1 = N must
      reproduce the ordinary dihedral coset state exactly, entry for entry. Free,
      unpassable by accident, and a failure voids every arm.
    - >-
      NEGATIVE CONTROL, forced value, read SECOND. A deliberately non-coprime
      pseudo-factorization must be REJECTED by the compatibility check. This is the
      control that gives the check the ability to fail; without it, an acceptance on the
      real split carries no information (the failure mode catalogued in this program as a
      control that cannot fail).
    - >-
      GROUND-TRUTH CONTROL. The comparison target is a D_{N1} coset state constructed
      DIRECTLY, never derived from the projection. Comparing the projection against
      itself in different notation is the mirror failure and is excluded by construction.
    - >-
      EXHAUSTIVENESS CONTROL. Every measurement outcome and every shift is tested at
      every toy pair. A mechanism claimed to hold "for every outcome" and tested on a
      sample has not been tested; at log2 N <= 20 exhaustiveness is affordable and is
      therefore mandatory.
    - >-
      UNBALANCED-SPLIT CONTROL. At least one deliberately unbalanced pair is included,
      because the quantifier audit names the comparable-size condition as the critical
      risk and a mechanism verified only on balanced splits has not been tested against
      it.
    - >-
      IDENTIFIABILITY CONTROL, blocking. An exhaustive collision search over shift pairs
      differing mod N1. Fidelity 1 and identifiability are DIFFERENT properties, and only
      the second supports recovery of d1; a run reporting fidelity without the collision
      search has not answered the question.
    - >-
      CONVENTION-FREEZE CONTROL. The coset normalization, the relabeling and the fidelity
      definition are hash-committed at STAGE 1, before any state is built. A relabeling
      chosen afterwards can absorb any discrepancy and would make the fidelity
      unfalsifiable.
    - >-
      ORDERING CONTROL. The degenerate and wrong-factorization controls are computed,
      recorded and hash-committed BEFORE the signal arm's fidelities are looked at.
    - >-
      PROVENANCE CONTROL on STAGE 7. The class-group order is used only with a citation
      and is explicitly NOT adopted from any in-progress internal reconstruction; if no
      citable value is reachable, the arm reports UNAVAILABLE rather than a number.
  independent_variables:
    - the toy coprime pair (N1, N2), including balanced and unbalanced splits
    - the measurement outcome x2*
    - the true shift d, hence (d1, d2)
    - 'factorization validity: genuine coprime split / non-coprime pseudo-split / degenerate N1 = N'
  metrics:
    primary:
      - name: projection_fidelity
        units: exact rational (a fidelity, taking the value 1 or a value strictly below 1)
        computed_as: >-
          exact fidelity between the reduced (coin, x1) density matrix after tracing out
          Z_{N2}, relabeled by the frozen public relabeling, and the DIRECTLY constructed
          ground-truth D_{N1} coset density matrix with shift d1. Computed over exact
          cyclotomic arithmetic, per outcome x2*, per shift d, per toy pair. Reported as
          the MINIMUM over all outcomes and shifts, never as an average - an average
          hides the single failing outcome that decides the question.
      - name: identifiability_collisions
        units: count of shift pairs
        computed_as: >-
          the number of pairs (d, d') with d1 != d1' whose relabeled projected observables
          are exactly equal, over the exhaustive toy sweep. Forced value 0.
      - name: degenerate_reproduction_pass
        units: boolean per toy pair
        computed_as: >-
          exact entry-for-entry equality of the N1 = N construction with the ordinary
          coset state. POSITIVE CONTROL, forced true.
      - name: wrong_factorization_rejected
        units: boolean
        computed_as: >-
          the compatibility check rejects the non-coprime pseudo-split. NEGATIVE CONTROL,
          forced true.
      - name: class_group_split_exists
        units: boolean plus the factorization
        computed_as: >-
          whether the cited standardized class-group order admits a coprime factorization
          with log2 of both factors within a declared constant factor of (log2 N)/2, with
          the factorization certified by re-multiplication. Reported as UNAVAILABLE if no
          citable order can be obtained.
    secondary:
      - name: coin_handling_cost
        units: D_N samples consumed per usable D_{N1} sample
        computed_as: >-
          including any post-selection on the coin register, measured per toy pair and
          reported as a trend across the ladder. Forced flat under HEUR-QALG-b74bd1-2.
      - name: fidelity_by_outcome
        units: exact rational per (x2*, d) cell
        computed_as: the full table, not a summary, so a single failing cell is visible.
      - name: balanced_versus_unbalanced
        units: comparison of the minimum fidelity across split types
        computed_as: >-
          minimum fidelity on balanced pairs against minimum fidelity on unbalanced pairs,
          which is the direct test of the quantifier audit's named risk.
      - name: combined_cost_estimate
        units: symbolic
        computed_as: >-
          symbolic cost of the two-instance approach versus the direct instance at the toy
          size, with any extrapolation to a standardized set EXPLICITLY FLAGGED as
          extrapolation and reported only if STAGE 7 found a favourable split.
      - name: factorization_certificate
        units: the factors and their product
        computed_as: re-multiplication check, so the factorization is certified rather than asserted.
  heuristic_under_test:
    id: HEUR-QALG-b74bd1-1
    formal_statement: >-
      The exact algebraic identity verified at toy N continues to hold at
      cryptographic-size N, since CRT compatibility with negation is scale-invariant in
      its derivation.
    validation: >-
      Validated only in the weak sense a ladder permits: the fidelity is re-checked at
      successively larger toy N and required to remain EXACTLY 1 with no degradation
      trend. A downward trend in a quantity that is supposed to be exactly 1 is the
      tail-consistency check firing, and it must be diagnosed before any generalization
      is written. No transfer to cryptographic scale is claimed by any outcome.
    second_heuristic:
      id: HEUR-QALG-b74bd1-2
      formal_statement: >-
        Handling the shared coin bit costs at most a constant factor per sample,
        independent of N.
      validation: >-
        Measured directly as coin_handling_cost across the ladder. This is the assumption
        the whole cost claim rests on and the parent proposal's own confounders flag it as
        needing verification; a growth trend erases the gain even at perfect fidelity.
  preregistered_prediction:
    quantity: >-
      The MINIMUM projection_fidelity over all measurement outcomes and all shifts at
      every toy pair, and the identifiability_collisions count.
    formula: >-
      Under the mechanism, minimum fidelity = 1 EXACTLY - the algebra is exact, not
      probabilistic, so there is no tolerance band and any value strictly below 1 is a
      falsification - and identifiability_collisions = 0. Under the alternative that the
      shared coin bit's phase is scrambled by an x2*-dependent term, the minimum fidelity
      is strictly below 1 on at least one outcome.
    source: >-
      Pre-registered in the parent proposal IDEA-20260813-55d3a0
      (predictions.minimum_effect, "1.0 (exact) ... any measured fraction below 1.0
      (beyond exact-arithmetic tolerance) falsifies the mechanism as stated") before any
      run under this contract exists. This contract removes even the tolerance clause,
      because the arithmetic is exact and a tolerance on an exact identity is a place for
      a falsification to hide.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at log2 N <= 20, where the state vector can be built and traced out
      EXACTLY over every outcome. The design deliberately trades scale for exactness and
      exhaustiveness: a decisive algebraic answer at toy size is worth more here than a
      sampled answer at larger size, because the claim is an identity rather than a
      statistic. The transfer to cryptographic N is HEUR-QALG-b74bd1-1 and is claimed by
      no outcome.
    correspondence: null
    transfer_assumption: >-
      Stated and narrow: that a scale-invariant algebraic derivation verified exhaustively
      at toy size continues to hold. It is NOT used to attach any cost or security figure
      to any parameter set.
  tail_checks:
    - >-
      Report the MINIMUM fidelity over outcomes, never the mean. A single failing outcome
      falsifies the mechanism and an average would conceal it - this is the most likely
      way a negative result would be lost.
    - >-
      Report the full (x2*, d) fidelity table, so a structured failure (for example one
      confined to a coset of outcomes) is visible as structure rather than as noise.
    - >-
      Report the unbalanced-split results separately from the balanced ones; a mechanism
      that holds only on balanced splits has a quantifier restriction that must be stated.
    - >-
      Report the fidelity at each rung of the toy ladder to expose any degradation trend
      in a quantity that should be exactly 1.
    - >-
      Report the identifiability sweep's coverage explicitly - which shift pairs were
      tested - so an absence of collisions is scoped rather than asserted.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 4
    repeat_count: 1
    note: >-
      The signal arm is DETERMINISTIC and exhaustive: every outcome and every shift is
      enumerated, so repeating it changes nothing and a seed governs only the order of
      enumeration and any sampling in the cost arm. "independent_instances: 4" refers to
      the four toy pairs of the ladder, which are the real replicates here. Saying this
      plainly is preferable to recording seed replication that adds no statistical power.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    memory_gb: 4
    maximum_memory_gb: 4
    maximum_runs: 15
  stopping_rules:
    - >-
      Stop and void the run if the degenerate control fails or the wrong-factorization
      control is accepted.
    - >-
      Stop growing the toy ladder at the largest log2 N whose exhaustive sweep terminates
      inside wall_clock_seconds_per_run; a pair that times out is censored and recorded as
      such, never reported as a fidelity.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is
      a stop, never a negative result (AGENTS.md rule 5).
    - >-
      The conventions frozen at STAGE 1 - normalization, relabeling, fidelity definition -
      are not revised after any state is built.
    - >-
      STAGE 7 stops at UNAVAILABLE rather than substituting an uncited class-group order.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run computing the fidelity in floating point is invalid_measurement: the claim is
      exact equality and a float converts a falsification into a rounding question.
    - >-
      A run that samples rather than exhausts the (x2*, d) space at any toy pair is
      invalid_measurement; the claim quantifies over every outcome.
    - >-
      A run whose relabeling was adjusted after a reduced state was inspected is
      completed_invalid: the frozen convention is what makes the fidelity falsifiable.
    - >-
      A run whose degenerate or wrong-factorization control was not executed in the same
      invocation as the signal arm is invalid_measurement.
    - >-
      A run adopting a class-group order without a citation, or from an in-progress
      internal reconstruction, is completed_invalid for the arithmetic arm.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The degenerate control passes exactly, the wrong-factorization control is rejected,
    the (x2*, d) sweep is exhaustive at every toy pair including at least one unbalanced
    split, and the run reports the minimum projection_fidelity as an exact rational per
    pair, the identifiability collision count with its coverage, the coin-handling cost
    trend, and the arithmetic arm's verdict or an explicit UNAVAILABLE. The hypothesis
    H-QALG-b74bd1 is SUPPORTED if and only if the minimum fidelity is exactly 1 at every
    pair, the collision count is 0, the coin-handling cost is flat across the ladder, AND
    the arithmetic arm finds a comparable-size coprime split with a citation.
  falsification_criterion:
    - >-
      Minimum projection_fidelity is strictly below 1 at any toy pair, on any outcome,
      with both controls behaving. P1 is FALSIFIED: the partial measurement does not
      preserve the coset structure. The failing (x2*, d) cell is recorded as a
      COUNTEREXAMPLE CERTIFICATE, which is the strongest refutation artifact this design
      admits and is archived before any decision that rests on it.
    - >-
      identifiability_collisions > 0. d1 is not recoverable from the projected state even
      at fidelity 1, and the recovery claim has no basis.
    - >-
      coin_handling_cost grows across the toy ladder. The claimed gain is erased on cost
      grounds even if the algebra is sound.
    - >-
      The cited standardized class-group order has no comparable-size coprime split. P2
      is FALSIFIED for that parameter set and the mechanism is vacuous THERE; this closes
      that parameter set with a named obstruction and explicitly does not close others.
    - >-
      The degenerate control fails or the wrong-factorization control is accepted. Nothing
      is reportable from any arm; the harness cannot detect an incompatibility.
    - >-
      The minimum fidelity is 1 on balanced splits and below 1 on unbalanced ones. The
      mechanism carries an unstated size-comparability restriction, which is a finding and
      must be reported as a quantifier restriction rather than as a clean pass.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      raw-result.json carrying the full per-(x2*, d) fidelity table as exact rationals at
      every toy pair, and not summaries
    - the degenerate and wrong-factorization control results, in the same file as the signal arm
    - the STAGE 1 frozen conventions - normalization, relabeling, fidelity definition - hashed before any state is built
    - the identifiability sweep with its enumerated coverage
    - the class-group order with its citation and its re-multiplication certificate, or an explicit UNAVAILABLE record
    - a counterexample certificate for any outcome with fidelity below 1, if one is found
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      user's gate because it authorizes execution and spends compute.
    - >-
      STAGE 1's convention freeze is a HARD GATE. A relabeling fixed after a reduced state
      is inspected makes the primary metric unfalsifiable, and a contract approved without
      the freeze would be approving an unfalsifiable measurement.
    - >-
      The paired hypothesis is proof-oriented and carries a filled proof_search_map
      (KN-TECH-080). Its observation-collision audit is implemented as the identifiability
      arm and its nearby-object control as the degenerate and wrong-factorization arms;
      all three are preconditions of approval, not optional.
    - >-
      The method ceiling forbids describing any outcome as an exponent-form improvement.
      That forbidden-sentence rule binds the deliverable.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260813-55d3a0
    authored_at: '2026-08-25'
    note: >-
      Controls, forced values, the two-stage structure and the exactness requirement are
      taken from the parent proposal's minimal_test and proof_search_map. This contract
      strengthens two things deliberately and says so: the tolerance clause on the
      fidelity is removed, because an exact identity with a tolerance is a place for a
      falsification to hide; and the unbalanced-split arm is made mandatory, because the
      parent's own quantifier audit names size-comparability as the critical risk while
      its minimal test does not require testing it. Budgets come from the parent's
      declared estimated_cost (implementation low, compute low).
  derivation_gaps:
    - >-
      The exact form of the "publicly computable relabeling" is NOT specified in the parent
      proposal and is not invented here. It must be derived and frozen at STAGE 1; without
      a fixed relabeling, "fidelity 1 up to relabeling" is not a decidable statement.
    - >-
      The toy ladder's specific (N1, N2) pairs are not fixed. They must be chosen at
      STAGE 1 by the exhaustiveness-and-termination criterion and must include at least
      one deliberately unbalanced split, not chosen after seeing which pairs give
      fidelity 1.
    - >-
      "Within a constant factor of (log2 N)/2" needs its constant declared before STAGE 7
      runs, or the arithmetic arm's verdict is a judgement call made after seeing the
      factorization.
    - >-
      Whether a standardized class-group order is obtainable WITH A CITATION in this
      container is unknown. If it is not, the arithmetic arm is unavailable and the
      contract delivers the algebra alone - which is a smaller but still complete
      deliverable, and the reduction in scope must be recorded rather than papered over.
