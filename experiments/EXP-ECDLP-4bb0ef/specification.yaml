  historical_scientific_protocol:
    objective: 'On E: y^2 = x^3 + x + 2 over F_41, evaluate the KN-TECH-002 polynomial S_3 at the six
      chord sums of (0, 17), (1, 2), (3, 14), and (5, 3), and again at third coordinate 7. The positive
      reading is six zeros on the true sums and the six residues 13, 33, 35, 11, 28, 38 in pair order.
      This is not a discrete logarithm.'
    preregistered_prediction:
      quantity: true_sum_nonzero_count is 0 and the six values at third coordinate 7 equal 13, 33, 35,
        11, 28, 38 in pair order.
      formula: The positive reading is that exact match. The negative reading is a nonzero true sum or
        any other residue, on a valid manifest.
      source: IDEA-20261006-06fe5e states both the six zeros and the six residues. That pair was fixed
        before this driver was executed.
    success_criterion: The manifest is valid, planted_ok is true, every true-sum value is 0, and the six
      values at third coordinate 7 are 13, 33, 35, 11, 28, and 38 in pair order.
    falsification_criterion: The manifest is valid, planted_ok is true, and either some true-sum value
      is nonzero or some value at third coordinate 7 differs from that list.
    decision_impact:
      on_positive: Record that this one curve matches the twelve pre-registered residues. Do not treat
        that as an index-calculus speedup.
      on_negative: Record that the worksheet missed the pre-registered residues. Do not replace the list
        and do not charge a decomposition cost.
    stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-8f5190.
    - Do not add a pair, a second curve, or a factor base.
    - A missed matrix is the recorded result. Do not change the residues.
    invalidation_rules:
    - A planted point fails the curve equation, or the two evaluations disagree.
    - A chord sum is the point at infinity.
    - A timeout, crash, or missing value.
    replication:
      seeds: []
      independent_instances: 1
      named_future_run_slot: RUN-ECDLP-8f5190
      replication_note: One deterministic pass. No seed is drawn.
