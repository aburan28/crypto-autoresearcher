  controls:
  - Each of the four points satisfies the curve equation in expanded form and in Horner form. The discriminant
    4*a^3 + 27*b^2 is nonzero modulo 41.
  - Each of the twelve triples is evaluated by a per-operation reduction and by a delayed Horner form.
    Disagreement voids the cell.
  - S_3(x, x, 7) for each planted x is recorded and is not an input to the success test.
