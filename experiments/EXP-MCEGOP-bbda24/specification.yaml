experiment:
  id: EXP-MCEGOP-bbda24
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-554b67; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-554b67
  question_id: RQ-MCE-e65b3c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Executed Prange and Stern on toy Goppa fixtures and matched random codes with planted weight-t
    errors at n = 16..64: counted iterations, counted peak list memory, counted collisions, and the
    measured ratio between structured and unstructured arms'
  objective: 'One uncertainty is reduced: whether generic information-set decoding, as actually implemented
    and executed, behaves identically on a structured binary Goppa code and on a matched random code,
    and whether its measured cost tracks the closed form it is always quoted from. Stated in parts:
    (i) CALIBRATION -- does a real Prange implementation, run on random codes with planted weight-t
    errors at the tested sizes, produce a median iteration count within a factor of 2 of the analytic
    expectation for its (n, k, t)? If not, no other number in the run may be read, so this is a gate
    and not a result. (ii) STRUCTURE-BLINDNESS, MEASURED -- what is the ratio of median iteration
    counts between a Goppa arm and a matched random arm handed to the identical solver through an
    interface that hides which is which? The assumption that this ratio is 1 is load-bearing throughout
    code-based cryptography and has never been measured anywhere in this repository; measuring it
    at toy scale gives a number with an interval where there is currently a convention. (iii) MEMORY
    AND COLLISIONS AS COUNTED QUANTITIES -- what are Stern''s peak list size and collisions per iteration
    when counted by the implementation rather than modelled by an accounting basis? Every existing
    ISD record here is arithmetic on transcribed exponents; this supplies the execution data those
    arguments have been conducted without. The contract adopts no costing convention, computes nothing
    about any standardized parameter set, and treats a solved toy instance as a measurement and never
    as an attack.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that at the tested
      cells with n <= 64, over the declared samplers, planted-error distribution and iteration caps,
      the implemented Prange and Stern solvers produced the reported per-instance iteration counts,
      peak list sizes and collision counts; that the random arm''s median stood in the reported ratio
      to the closed-form expectation; and that the two arms'' medians stood in the reported ratio
      with the reported bootstrap interval and replication status. What does NOT follow: no exponent
      for any adversary; no statement about Classic McEliece or any standardized parameter set; no
      adoption of any costing convention and specifically no binding to ISD-FC-2026; no claim that
      solving a toy instance constitutes an attack, a break or a key recovery; and no extrapolation
      of the arm ratio to any larger n, since the ratio is measured on a censored geometric distribution
      at small parameters.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Freeze cells, sample sizes, planted-error distribution, iteration
      cap, Stern parameters (p,l) and seeds. STAGE 1 (cost: 1 day, human). Implement Prange and Stern
      over bitmask GF(2) rows with explicit counters for iterations, peak list entries and collisions.
      STAGE 2 (cost: minutes). Validate on hand-checkable instances: a code with a weight-1 planted
      error where Prange must succeed almost immediately, and a repetition code where the answer is
      known. STAGE 3 (cost: minutes per cell). Generate 200 Goppa instances per cell from the certified
      fixture with planted uniform weight-t errors, and 200 matched random-code instances at identical
      measured k, resampling to enforce the match. STAGE 4 (cost: 15 minutes to several hours per
      cell in pure Python). Solve every instance with Prange under the iteration cap; verify each
      returned error by weight and syndrome; record the counters. STAGE 5 (cost: as STAGE 4). Repeat
      with Stern at the frozen (p,l). STAGE 6 (cost: minutes). Run the over-weight null at weight
      t+2 to confirm censoring is visible. STAGE 7 (cost: minutes). Compute medians, bootstrap intervals,
      arm ratios, censoring fractions and measured/predicted ratios; replicate the smallest and largest
      cells under a second seed family. Total budget 12 CPU-hours with unreached cells reported.'
    instrument: Python 3.11 standard library only (numpy absent, verified). New solver module with
      GF(2) rows as Python ints, Gaussian elimination by XOR, itertools for information-set draws
      and Stern list construction, and explicit integer counters for every reported quantity. Consumes
      the certified fixture emitted by proposal 1 via its hash-pinned JSON artifact, and shares no
      code with it beyond the field and elimination primitives so that a fixture bug and a solver
      bug are not correlated. Driven through harness/runner.py with domain-separated random.Random
      seeds so the manifest records the resolved inference block. Wall-clock recorded but excluded
      from every comparison. No Sage, no external package, no network.
    parameters: 'Cells: (m,t,n) in {(4,2,16), (5,3,32), (5,2,28), (6,3,48), (6,4,64)}, with k taken
      from the fixture''s measured rank in each case. Planted errors uniform over weight-t vectors,
      200 instances per arm per cell for Prange and 100 per arm per cell for Stern. Iteration cap
      10^5 for Prange, 10^4 for Stern. Stern parameters frozen at (p,l) = (1,2) and (2,4), reported
      separately and never optimised post hoc. Over-weight null at weight t+2, 50 instances per cell.
      Second seed family for replication on the smallest and largest cells only.'
  controls:
  - Matched random binary code with planted weight-t error, identical solver interface, same invocation.
  - 'Closed-form calibration: each arm''s measured median against the analytic Prange expectation
    for its own (n,k,t).'
  - 'Over-weight null: planted error of weight t+2, where the cap should bind, confirming censoring
    is visible and not a silent wrong answer.'
  - 'Solved-instance verification: every returned error vector is checked to have weight <= t and
    to reproduce the syndrome, so a ''success'' is verified rather than reported.'
  - 'Seed replication: the entire cell re-run under a second seed family, with the arm ratio required
    to replicate inside its interval.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a matched random binary [n, k] code with a planted
    uniformly random weight-t error, generated in the same invocation from a domain-separated seed
    and handed to the IDENTICAL solver through the identical interface, so the solver cannot tell
    the arms apart. For the Goppa arm''s numbers to mean anything the null must show: (a) a median
    iteration count within the pre-registered interval of the Goppa arm''s, since generic decoding
    is assumed structure-blind, and (b) a measured/predicted ratio against the closed-form Prange
    expectation that is itself close to 1, since the random arm is the case the closed form was derived
    for. Part (b) is what makes the null a calibration rather than merely a comparison: if the random
    arm does not match the closed form, the implementation is wrong and the Goppa arm''s number means
    nothing. A second null runs the solver on a code with a planted error of weight t+2, where success
    is not expected, to confirm the iteration cap behaves as censoring and not as a silent wrong answer.'
  independent_variables:
  - cell (m, t, n)
  - arm (goppa | matched-random | over-weight null)
  - solver (prange | stern(1,2) | stern(2,4))
  - seed family
  metrics:
    primary:
    - per-instance iteration count
    - median iterations and bootstrap interval per arm
    - arm ratio of medians
    - Stern peak list size in entries
    - collisions per iteration
    secondary:
    - censoring fraction
    - measured/predicted ratio against the closed-form Prange expectation
    - wall-clock (recorded, excluded from comparisons)
    - count of unverified successes, required zero
    - resample count enforcing the (n,k) match
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio of median Prange iteration counts between the Goppa arm and the matched random
      arm, per cell, and each arm's measured/predicted ratio against the closed form.
    formula: 'The closed-form Prange expectation is E[iterations] = 1 / P(success per iteration) with
      P = C(n-t, k) / C(n, k), the probability that a uniformly random size-k information set avoids
      all t error positions. Pre-registered: median(random arm) / E[iterations] within a factor of
      2; R = median(goppa) / median(random) pre-registered at 1.00 with rejection band [0.85, 1.18];
      Stern peak list size equal to C(k/2, p) exactly.'
    source: Pre-registered in the parent proposal IDEA-20260816-554b67 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'n <= 64, t <= 4, k <= 40 -- inside RQ-MCE-b38a8b''s toy boundary and chosen so
      that instances are solvable in pure Python inside the iteration cap with a censoring fraction
      below 0.05. NO extrapolation is offered: the arm ratio is a measurement on a censored geometric
      distribution at small parameters, and its value at n = 64 carries no information about n = 6960.
      The only quantity treated as scale-independent is the combinatorial identity defining the closed-form
      success probability, which is used as a calibration target and not as a result.'
    correspondence: null
  tail_checks:
  - The upper tail of the iteration-count distribution is reported explicitly per arm, since a geometric
    tail is where a censored comparison goes wrong first.
  - Instances hitting the cap are reported individually with their seed rather than dropped.
  - The cell with the largest t relative to n is checked first for censoring, since it is where the
    cap binds soonest.
  - 'Any instance whose returned error has weight strictly less than the planted weight is reported:
    it means a lighter solution exists, which is a fact about the code''s minimum distance and not
    a solver error.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop and report if the random arm's measured/predicted ratio falls outside a factor of 2 at the
    smallest cell.
  - Abort any cell whose censoring fraction exceeds 0.05 and report it as uncomparable.
  - Cap total wall-clock at 12 CPU-hours and report unreached cells rather than reducing sample sizes.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every reported success is verified by weight and syndrome, the random arm calibrates
    within a factor of 2 of the closed form at every cell, censoring stays below 0.05 in every compared
    cell, and the arm ratio is reported per cell with a bootstrap interval and a replication result
    under a second seed family.
  falsification_criterion:
  - Any unverified success.
  - Random arm measured/predicted ratio outside a factor of 2.
  - Stern peak list size differing from the combinatorial prediction.
  - Censoring above 0.05 in a cell reported as compared.
  - An arm ratio outside the band that fails to replicate under the second seed family.
  - The over-weight null succeeding above chance.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-554b67
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Stern parameters (p, l) are frozen at two settings by fiat; the Coordinator must decide whether
    optimising them per cell is permitted, since post hoc optimisation would invalidate the peak-list-size
    prediction.
  - Whether this contract may proceed without the certified fixture -- running only the random arm
    as a calibration exercise -- is a Coordinator sequencing decision with real consequences for what
    the run can claim.
  - The rejection band [0.85, 1.18] for the arm ratio is asserted rather than derived from a power
    calculation at the declared sample size; that calculation must be done before freezing.
  - Whether counted operations, list entries and collisions constitute an adequate cost currency without
    adopting any convention needs an explicit Coordinator ruling, given RQ-MCE-e65b3c's prohibition
    on deriving a competing convention.
