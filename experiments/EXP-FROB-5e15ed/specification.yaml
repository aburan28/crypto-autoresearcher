experiment:
  id: EXP-FROB-5e15ed
  hypothesis_id: H-FROB-855915
  version: 1
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-30'
  source_decision: DEC-20260930-f693b9
  source_proposal: IDEA-20260926-197ecf
  frozen: true
  amendment_note: >-
    Version 1 has no amendment. experiments/EXP-FROB-5e15ed/amendments/ is
    empty. This contract does not authorize an amendment. A later change is
    a new file in that directory plus a new decision, never an edit of this
    file.

  title: >-
    Toy heuristic validation of tau-Horner H1: exact yield ratio P1, W_4
    closure ratio P2, ordinary [2]-link degree P3, and a modeled budget column
  objective: >-
    Test heuristic H1 on the frozen Koblitz panel by solver-free enumeration.
    P1 is the pooled distinct-relation yield of the tau-Horner chain over the
    plain chain. P2 is the matched W_4 closure-work ratio at m = 3. P3 is the
    ordinary [2]-Horner descended degree. The claim (D) budget column is
    recomputed in Python and labeled modeled, not measured. This experiment
    does not claim an ECDLP exponent improvement. The predicted move is a
    constant of about 2 to 2.5 bits after rebalancing. It does not beat
    Pollard rho.

  heuristic_under_test: H1

  inputs:
    proposal: ledger/proposals/IDEA-20260926-197ecf.yaml
    hypothesis: ledger/hypotheses/H-FROB-855915.yaml
    read_only_instruments:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py
    instrument_rule: >-
      Copy what is needed into experiments/EXP-FROB-5e15ed/implementation/.
      Do not edit the CERTBIN sources. A general-n field is required for
      n = 19. The new code is an ordered-tuple enumerator, a relabelled
      Z/NZ replica, and a two-link chain builder with an optional node-block
      rotation. Both the normal-basis rotation and the n-by-n F_2 squaring
      matrix are implemented and must agree on every link used.
    rc1_regression_archive: >-
      Archived RC-1 W_4 labels of EXP-CERTBIN-e94b27 (RUN-CERTBIN-c417e0 and
      the U62/S62 checkpoints it carries; scope in KN-FIND-5a8d3e). The
      regression set is exactly 10 U62 systems and 5 S62 systems, taken in
      ascending archived instance-id order. No further systems are added.
      The regression cell stays the archived one (n = 17, m = 2, l = 9,
      V = {deg < 9}, A = 97044, B = 126251). It is not retargeted onto the
      Koblitz (m, l) list.

  frozen_panel:
    added_cells: none
    koblitz:
      - id: K17-m2
        n: 17
        model: 'y^2 + xy = x^3 + x^2 + 1'
        field: 'F_2[t]/(t^17 + t^3 + 1)'
        order: '2 * 65587'
        m: 2
        l: 8
        seed: 2026092701
      - id: K17-m3
        n: 17
        model: 'y^2 + xy = x^3 + x^2 + 1'
        field: 'F_2[t]/(t^17 + t^3 + 1)'
        order: '2 * 65587'
        m: 3
        l: 6
        seed: 2026092702
        note: >-
          ml = 18 > n = 17, outside the proposal H1 side condition ml <= n.
          The cell remains. The P1 bands are not relaxed.
      - id: K19-m2
        n: 19
        model: 'y^2 + xy = x^3 + 1'
        field: 'F_2[t]/(t^19 + t^5 + t^2 + t + 1)'
        order: '4 * 130873'
        m: 2
        l: 9
        seed: 2026092703
      - id: K19-m3
        n: 19
        model: 'y^2 + xy = x^3 + 1'
        field: 'F_2[t]/(t^19 + t^5 + t^2 + t + 1)'
        order: '4 * 130873'
        m: 3
        l: 6
        seed: 2026092704
    ordinary_controls:
      - id: RC-1
        n: 17
        field: 'F_2[t]/(t^17 + t^3 + 1)'
        A: 97044
        B: 126251
        archived_order: '4 * 32603'
        archived_order_source: KN-FIND-5a8d3e
        role: >-
          Plain-arm W_4 regression (10 U62, 5 S62) and Stage-3 [2]-Horner
          degree.
      - id: CERTBIN-n19
        n: 19
        field: 'F_2[t]/(t^19 + t^5 + t^2 + t + 1)'
        A: 46693
        B: 306147
        archived_order: '2 * 261823'
        archived_order_source: KN-FIND-c3a917
        role: Stage-3 [2]-Horner degree on the second ordinary curve.
    V: '{deg < l} in the polynomial basis'
    seeds: [2026092701, 2026092702, 2026092703, 2026092704]
    seed_rule: >-
      One PCG64 seed per Koblitz cell, in the quantifier order of
      IDEA-20260926-197ecf. No other seeds.

  controls:
    - >-
      Plain chain on the same V and the same targets. This is the object
      that still has the m! symmetry.
    - >-
      Relabelled Z/NZ control, one per Koblitz cell, on the same tuples and
      targets, with lambda replaced by one recorded element of multiplicative
      order n drawn from that cell's PCG64 stream after the 200 targets.
      Must land in the same P1 band [0.8 m!, 1.2 m!]. This is a counting
      fact. Out of band is an instrument defect.
    - >-
      Ordinary [2]-Horner link on RC-1 and on CERTBIN-n19. Symmetry broken
      at a degree cost. Null object of the same shape without tau.
    - >-
      RC-1 plain-arm regression against archived W_4 labels, 10 U62 and 5 S62.
    - >-
      Every relation re-verified as a group identity. Every refutation
      certificate checked by code that does not import the closure engine.

  independent_variables:
    - >-
      Chain map at fixed V, targets, and code path: plain sum versus
      tau-Horner. This is the treatment H1 is about.
    - >-
      Curve family as a control axis only: Koblitz, ordinary [2]-Horner, and
      the Z/NZ relabel. No further families.
    - >-
      Cell index inside the four frozen Koblitz cells. m in {2, 3}; l in
      {8, 6} at n = 17 and {9, 6} at n = 19, paired as listed, not crossed
      into extra cells.

  metrics:
    primary:
      - P1_yield_ratio
      - P2_closure_work_ratio
      - P3_link_degree
    secondary:
      - P4_modeled_budget_column
      - certificate_pass_rate
      - rc1_regression_pass
      - znz_yield_ratio
      - order_recompute_pass
  metric_definitions:
    P1_yield_ratio: >-
      Per Koblitz cell, (total distinct verified tau-Horner relations across
      the 200 targets) / (total distinct verified plain-chain relations
      across the same 200 targets). Pooled counts, not a mean of per-target
      ratios. The Z/NZ arm uses the same formula.
    P2_closure_work_ratio: >-
      Per m = 3 Koblitz cell, (total GF(2) 64-bit-word XOR row operations of
      W_4 on the tau-Horner descent) / (the same total on the plain descent),
      over 40 matched targets. Also record W_3 and the first iteration
      containing 1, per arm. A zero plain denominator is invalid_instrument.
    P3_link_degree: >-
      Boolean degree, from the ANF, of the descended ordinary [2]-Horner
      link S_3(x([2]u), x_k, x(u_k)), with x([2]u) = u^4 + b/u^2 cleared by
      multiplying through by u^2. Reported separately on RC-1 and on
      CERTBIN-n19. The plain link's degree on the same instrument is 3.
    P4_modeled_budget_column: >-
      Python recomputation of IDEA-20260926-197ecf claim (D). Labeled
      modeled, not measured. Formula as written there:
      T(B) = m! * 2^131 * C / B^{m-1} + m * B^2, then the same model with
      m! removed from the first term and B re-optimised. Comparison figures,
      all modeled: free-oracle floor 2^48.44 to about 2^46.1 at m = 5;
      per-attempt budget 2^13.96 to about 2^16.3 at m = 5; 2^19.77 to about
      2^22.3 at m = 6; reference 2^27.37 at m = 8; cap model
      B_cap = 2^{131/m} rises by about 2.1 bits at m = 5; P4 deltas about
      2.3, 2.5, 2.7 bits above 2^13.96, 2^19.77, 2^27.37. The quoted
      cap-locus column 2^32.4, 2^37, 2^42 at m = 5, 6, 8 is an unreviewed
      proposal figure and is not a measurement. C is not invented: record
      the value implied by the published before-figures, or record that the
      before-figures do not determine it. A gap above 0.5 bit versus a
      stated figure is an arithmetic error for a superseding record, not a
      curve result.

  preregistered_prediction:
    quantity: >-
      P1 per frozen Koblitz cell, P2 per m = 3 cell, P3 on each ordinary
      [2]-link, and the modeled P4 bit deltas.
    formula: >-
      P1 is predicted inside the closed interval [0.8 m!, 1.2 m!], that is
      [1.6, 2.4] at m = 2 and [4.8, 7.2] at m = 3. H1 is falsified if
      P1 < 0.5 m! or P1 > 2 m!, that is P1 < 1 or P1 > 4 at m = 2 and
      P1 < 3 or P1 > 12 at m = 3, on any Koblitz cell while Z/NZ is inside
      the closed success band and certificates pass. P2 is predicted inside
      the closed interval [0.83, 1.2] on each of K17-m3 and K19-m3. P2 < 0.5
      or P2 > 2 on both of those cells is outcome (ii). P3 >= 5 against
      plain degree 3; P3 = 3 withdraws Koblitz-specificity. P4 is a constant
      of about 2 to 2.5 bits, modeled.
    source: >-
      IDEA-20260926-197ecf heuristic H1 and predictions P1, P2, P3, P4,
      written before any run of EXP-FROB-5e15ed. Bands are transcribed, not
      refit.

  scale_relevance:
    tier: toy
    justification: >-
      n = 17 and n = 19 do not transfer to n = 131. n = 131 is out of scope
      except as arithmetic on published constants. No transfer to deployed
      curves. Direct enumeration is feasible only because 2^{m l} <= 2^18
      on these cells.
    correspondence: null

  tail_checks:
    - >-
      Per Koblitz cell, report (distinct verified tau-Horner relations) /
      (ordered tau-Horner solutions) against 1, and the birthday term
      |F_V|^m / 2^n. The proposal's validation plan treats a deficit above
      20 percent on that ratio as a tail reading. It is reported. It does
      not replace the falsification criterion. H1 is falsified only when
      P1 < 0.5 m! or P1 > 2 m! with the Z/NZ control in band and
      certificates passing.
    - >-
      The cell with the largest deficit of distinct-relations/ordered-solutions
      below 1 is named. A deficit that pushes P1 outside [0.8 m!, 1.2 m!]
      fails success. It falsifies H1 only when P1 is also outside the outer
      band and the Z/NZ control is in band.
    - >-
      Z/NZ must sit in [0.8 m!, 1.2 m!] on every cell. That is the counting
      control, not a tail of the curve.

  replication:
    seeds: [2026092701, 2026092702, 2026092703, 2026092704]
    independent_instances: 4
    note: >-
      Four frozen cells, one seed each, inside a single execution
      (maximum_runs = 1). This is not a second replication campaign.

  procedure:
    - >-
      Stage 0, arithmetic and setup. Recompute each Koblitz group order and
      the primality of 65587 and 130873. Recompute RC-1 and CERTBIN-n19
      orders. Re-check x(tau P) = x(P)^2 and lambda^n = 1 on each Koblitz
      cell. Recompute claim (D) in Python and label it modeled. Any order
      mismatch with the frozen integers invalidates the run.
    - >-
      Stage 1, solver-free. For each of the 200 subgroup targets per Koblitz
      cell, enumerate all ordered tuples in F_V^m and count solutions of
      R = sum P_k and of R = sum_k tau^{m-k} P_k. Count distinct relation
      vectors. Verify every relation as a group identity. Repeat on the
      Z/NZ relabel. Report pooled P1.
    - >-
      RC-1 regression. Run the plain-chain path on the 10 U62 and 5 S62
      archived systems and compare W_4 labels. Any miss invalidates.
    - >-
      Stage 2. On K17-m3 and K19-m3 only, descend both chains at m = 3 and
      run W_3 and W_4 on the first 40 targets of that cell's Stage-1 PCG64
      stream, matched across arms. Report P2 and the first iteration
      containing 1. Do not add targets or cells.
    - >-
      Stage 3. On RC-1 and on CERTBIN-n19, build the [2]-Horner link and
      measure descended Boolean degree from the ANF. Report P3 against
      plain degree 3.
    - >-
      Write the outcome label by the precedence below. Do not change the
      prediction after seeing the numbers.

  budget:
    enforcement: machine_protection_only
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    scientific_panel: >-
      Frozen cells only; 200 Stage-1 subgroup targets per Koblitz cell; 40
      Stage-2 matched targets per m = 3 cell; 10 U62 and 5 S62 regression
      systems. Machine protection plus these frozen counts. Not a research
      spending cap. maximum_runs 1 means one execution of this panel.

  stopping_rules:
    - >-
      Stop at 14400 seconds or 4 GiB and record failed infrastructure.
      That outcome is invalid_instrument, not evidence against H1.
    - >-
      Stop on the first order mismatch, the first relation that fails
      group-identity verification, the first RC-1 label miss, or the first
      Z/NZ cell outside [0.8 m!, 1.2 m!]. Do not mine the remaining cells
      for a negative H1 reading.
    - Do not add cells, seeds, targets, degrees, or an n = 131 enumeration.
    - Do not edit this specification. Do not retune a band after output.
    - One execution of the panel. No second scientific run under this version.

  invalidation_rules:
    - >-
      Recomputed order differs from 2 * 65587, 4 * 130873, 4 * 32603, or
      2 * 261823 on the curve that cites it, or 65587 or 130873 is not prime.
    - Any relation or refutation certificate fails verification.
    - RC-1 plain-arm regression misses an archived W_4 label.
    - Any Z/NZ P1 lies outside the closed interval [0.8 m!, 1.2 m!].
    - The two squaring implementations disagree on a link that is used.
    - Timeout, crash, or implementation failure.
    - >-
      These are instrument defects. They are not falsification of H1 and
      not a curve result. A claim (D) gap above 0.5 bit is an arithmetic
      error for a superseding record, also not a curve result; the yield
      panel is still classified by the rules below if the instrument checks
      passed.

  success_criterion: >-
    Success if and only if all of the following hold: every frozen order
    recomputes to its stated integer and 65587 and 130873 are prime; the
    RC-1 plain-arm regression passes on all 10 U62 and all 5 S62 systems;
    every relation and every refutation certificate verifies; every Z/NZ
    cell has P1 inside the closed interval [0.8 m!, 1.2 m!]; every Koblitz
    cell has P1 inside the closed interval [0.8 m!, 1.2 m!]; every Stage-2
    cell (K17-m3 and K19-m3) has P2 inside the closed interval [0.83, 1.2];
    and P3 >= 5 on both ordinary [2]-Horner links (RC-1 and CERTBIN-n19)
    against plain degree 3. Anything else is not success.

  falsification_criterion: >-
    H1 is falsified on this panel if and only if the instrument is intact
    (orders recompute, every relation verifies, RC-1 regression passes, and
    every Z/NZ P1 is inside [0.8 m!, 1.2 m!]) and P1 < 0.5 m! or P1 > 2 m!
    on any Koblitz cell. Instrument failures are invalidation, not
    falsification. Outcome (ii) is not this falsification: it is P2 < 0.5
    or P2 > 2 on both Stage-2 cells with the instrument intact and H1 not
    falsified, and it suspends the budget claim rather than passing silently.

  outcome_precedence:
    - id: invalid_instrument
      when: >-
        Any invalidation rule fires, including a Z/NZ ratio outside
        [0.8 m!, 1.2 m!], before any negative reading of H1 is taken.
    - id: falsified_h1
      when: >-
        The instrument is intact and P1 < 0.5 m! or P1 > 2 m! on any
        Koblitz cell.
    - id: outcome_ii_closure
      when: >-
        The instrument is intact, H1 is not falsified, and P2 is outside
        [0.5, 2] on both Stage-2 cells. Report it. Suspend the budget
        claim. Do not call it success.
    - id: success
      when: The success_criterion conjunction holds.
    - id: not_success
      when: >-
        The panel finishes, the instrument is intact, H1 is not falsified,
        and outcome (ii) does not fire, but the success conjunction fails.
        Covers P1 inside the outer band but outside [0.8 m!, 1.2 m!], P2
        outside [0.83, 1.2] on fewer than two cells at the [0.5, 2]
        threshold, and P3 < 5, including P3 = 3 which withdraws the
        Koblitz-specificity clause. not_success is not a pass.

  claim_ceiling: toy
  dominated_by: Pollard rho at exponent 1/2
  sota_delta:
    time_exponent: 0
    memory_exponent: 0
    note: >-
      Constant of about 2 to 2.5 bits on the relation term after
      rebalancing, and only if the panel succeeds and the modeled column
      agrees. Exponent 0. Not a win over rho. Not an ECDLP speedup.

  required_artifacts:
    - command.txt
    - environment.json
    - stdout.log
    - stderr.log
    - raw-result.json
    - analysis.yaml
    - manifest.yaml
    - execution-report.yaml
    - stage0-orders.yaml
    - stage0-budget-modeled.yaml
    - stage1-yields.yaml
    - stage2-closure.yaml
    - stage3-degree.yaml
    - rc1-regression.yaml
    - verification-summary.yaml

  assigned_to: executor
  implementation:
    path: experiments/EXP-FROB-5e15ed/implementation/
    note: >-
      Not present at approval. The executor writes it. specification.yaml
      stays frozen.

  inference:
    requested_policy: executor-implementation
    no_bedrock: true
    resolved_model_id: null
    model_verified: false
