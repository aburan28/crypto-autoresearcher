experiment:
  id: EXP-MDFIVE-6ee1ad
  hypothesis_id: H-MDFIVE-8a7666
  derived_from_idea: IDEA-20260821-e46061
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Round-1-restricted two-free-word meet-in-the-middle partial-preimage
    instrument at a declared 20-bit bounded scale -- measured speedup against a
    naive all-pairs baseline over the same space, a blocking result-set
    identity control on a fully-enumerable subset, a Poisson goodness-of-fit
    validation of the uniformity heuristic, and MD5 as an identically-scaled
    nearby-object control with its own null-constant replication

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether the elementary splice-and-cut
    meet-in-the-middle mechanism operates correctly on the real Round-1 message
    schedule at a bounded, fully-checkable scale, and whether the uniformity
    heuristic it relies on survives contact with the actual 9-step composition.
    A run establishes -- (i) H2a, that forward and backward step functions
    compose to the identity over a large random sample, which gates everything;
    (ii) M2, that the meet-in-the-middle result set is IDENTICAL AS A SET to
    the naive all-pairs result set on a fully-enumerable reduced-window
    control subset; (iii) F1, that the declared search space contains a true
    solution by the target-generation protocol; (iv) M1, the measured speedup
    against the naive baseline OVER THE SAME RESTRICTED SPACE, against a
    pre-registered 4-fold floor; (v) H1a and H1b, the goodness-of-fit of the
    matching-window collision distribution against Poisson and of the
    conditional full-target hit rate against its predicted value; and (vi) R1
    and R2, the cross-primitive cost ratio at identical scale with and without
    the null-constant replication. NO CLAIM ABOUT FULL 48-STEP MD4 OR FULL
    64-STEP MD5 is made or may be inferred.

  what_this_is_not:
    - >-
      NOT an attack on MD4 or MD5. It is a bounded model problem over two free
      message words and a 20-bit target, and the baseline it beats is this
      program's own naive enumeration of the same tiny space, not any
      full-primitive figure.
    - >-
      Not evidence about full-primitive preimage resistance in either
      direction, and not progress toward the full-primitive method-ceiling
      question this research question actually asks.
    - >-
      Not a rescalable estimate. The measured ratio is specific to the declared
      window sizes and reproduces none of the techniques the literature reports
      needing at full scale; no free word survives a full-round chunk, which is
      exactly why those techniques exist.
    - >-
      Not a comparison against the full-scale complexity figures recorded in
      this program's corpus for these primitives, which are UNVERIFIED
      (bulk-seed relay and metadata-only provenance) and are cited only as
      reference points for a scale this program is nowhere near attempting.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "a partial preimage on the declared 20-bit
      window of the matching register after step 9 of MD4's Round 1 was found
      using [M1] chunk evaluations, independently re-verified against the naive
      all-pairs baseline on a fully-enumerable 6-bit-window control subset with
      identical result sets; the matching-window collision distribution [did /
      did not] fit Poisson(256) at the declared level; and the MD5-to-MD4 cost
      ratio at identical scale was [R1], with [R2] under the null-constant
      control." WHAT DOES NOT FOLLOW -- nothing about full 48-step MD4 or full
      64-step MD5; nothing about the real 128-bit output; nothing about any
      published full-primitive complexity; and no extrapolation of the measured
      speedup ratio to any larger window size, which is a separate,
      unvalidated heuristic (HEUR-MD-H3) explicitly not tested here.

  inputs:
    procedure: >-
      STAGE 0 (zero compute) -- freeze and hash, BEFORE any run -- the split
      step, the free-word indices, all window sizes, the 14 fixed message words
      (from a documented seed, NON-ZERO), the target-generation protocol
      including its independent seed, the chi-square BINS and significance
      level, the null-constant shift amount, and the pre-registered 4-fold
      speedup floor and [0.5, 2.0] ratio band. Verify the specification texts
      for BOTH primitives are available in a sha256-PINNED form and record the
      hashes; if the MD4 text is not pinned, the MD4 arm is BLOCKED and the run
      reports that rather than citing an unpinned transcript.
      STAGE 1 (minutes, GATE) -- implement forward and backward Round-1 step
      functions with explicit 32-bit masking, and run the inversion regression
      fixture over at least 10,000 random tuples. ANY failure blocks everything.
      STAGE 2 (minutes, GATE) -- on the fully-enumerable control subset with
      both free-word windows reduced to 6 bits, run BOTH the meet-in-the-middle
      search and the naive all-pairs search and compare their result sets AS
      SETS. A difference blocks everything.
      STAGE 3 (minutes) -- verify F1 on every generated target, then run the
      MD4 instrument against the declared target and measure evaluation counts
      for both the meet-in-the-middle and naive modes over the same restricted
      space.
      STAGE 4 (minutes) -- the heuristic-validation arm -- draw independent
      random targets in the declared sample range, record per target the
      matching-window collision count and the full-target hit count, and
      compare the collision-count distribution against Poisson at the declared
      bins and level, and the conditional hit rate against its predicted value.
      STAGE 5 (minutes) -- the MD5 arm through the IDENTICAL code path with
      MD5's own shift amounts and per-step constants substituted, at the
      IDENTICAL scale and never larger, and then the null-constant replication
      of BOTH primitives.
      STAGE 6 (zero compute) -- assemble M1, M2, H1a, H1b, H2a, F1, R1, R2 with
      the scope statement.
    instrument: >-
      Python 3.11, standard library plus numpy. Every addition and rotation
      masked to 32 bits explicitly -- Python integers are arbitrary-precision
      and will silently give wrong answers without it, and NO standard test
      vector covers a truncated 16-step no-feedforward primitive, so the
      Round-1-only regression fixture must be built fresh and is part of the
      deliverable. Chunk evaluations are counted by the wrapper, not estimated
      from wall clock. Hash table keyed on the matching-window value. Target
      generation independently seeded from the search. Recorded through
      harness/runner.py.
    parameters: >-
      Split step S = 9. Free words 8 (forward chunk) and 9 (backward chunk),
      each restricted to a 10-bit low-order window. The other 14 message words
      fixed to a declared NON-ZERO pre-registered pseudorandom constant.
      Matching window 12 bits on the register updated at the split step.
      Declared target 20 bits. Control subset -- both free-word windows reduced
      to 6 bits, fully enumerable in both modes. Inversion fixture -- at least
      10,000 random 32-bit tuples. Heuristic-validation arm -- between 200 and
      2000 independently drawn targets, budget permitting. Null-constant
      variant -- both primitives' round constants cyclically shifted by a
      declared amount. MD5 arm at the IDENTICAL scale, never larger.
  controls:
    - >-
      BRUTE-FORCE RESULT-SET IDENTITY CONTROL, BLOCKING -- on the
      fully-enumerable 6-bit-window subset, the meet-in-the-middle result set
      must be IDENTICAL AS A SET to the naive all-pairs result set, not merely
      equal in cardinality. A speedup over a baseline that finds different
      solutions is not a speedup.
    - >-
      BACKWARD-INVERSION REGRESSION FIXTURE, BLOCKING -- forward then backward
      must recover the input EXACTLY on at least 10,000 random tuples. This is
      an exact identity, so any single failure is decisive and no tail check is
      needed. It exists because masking, sign handling and rotation direction
      are precisely what breaks silently.
    - >-
      TRUE-SOLUTION-PRESENCE CONTROL -- the target-generation protocol must
      restrict the true free-word values to the SAME declared windows the
      search uses, and this must be VERIFIED per target. Without it a reported
      success rate measures the generator.
    - >-
      NON-ZERO FIXED-WORD CONTROL -- the 14 fixed words are declared, seeded
      and NON-ZERO, because the Round-1 auxiliary function collapses whenever
      two of its inputs are zero, which would bias the matching-window
      statistics for reasons unrelated to the mechanism.
    - >-
      INDEPENDENT SEEDING CONTROL -- target generation and search enumeration
      are independently seeded, both seeds declared before the run, so
      correlation cannot inflate the apparent success rate.
    - >-
      NEARBY-OBJECT CONTROL -- MD5's Round 1 through the identical instrument
      at the identical scale, substituting only the two elements the
      specification itself names as MD5's hardening over MD4. Predicted
      INDISTINGUISHABLE, stated in advance.
    - >-
      NULL-CONSTANT CONTROL, the nearby object's own control -- repeat the
      cross-primitive comparison with BOTH primitives' round constants
      cyclically shifted by the same declared amount. If a divergence appears
      here too, it is an artifact of the specific constant VALUES rather than
      of the design difference.
    - >-
      PRE-DECLARED BINS -- the chi-square goodness-of-fit bins and significance
      level are frozen before any data is drawn. Bins chosen after seeing the
      collision counts would make the test unfalsifiable.
    - >-
      PINNED-INPUT CONTROL -- both specification texts must be available in a
      sha256-pinned form with the hashes recorded. An unpinned best-effort
      transcript may NOT be cited as a frozen input.

  independent_variables:
    - "primitive (MD4 control / MD5 nearby object)"
    - "constant set (specification constants / declared shifted null variant)"
    - "search mode (meet-in-the-middle / naive all-pairs)"
    - "free-word window size (10-bit main arm / 6-bit fully-enumerable control)"
    - target instance (independently drawn, for the heuristic-validation arm)

  metrics:
    primary:
      - >-
        M1 speedup_ratio -- (chunk/step evaluations by the naive all-pairs
        search) divided by (chunk/step evaluations by the meet-in-the-middle
        search) to the first full-target match, over the SAME restricted space.
        Counted by the wrapper, not estimated from wall clock. Unit --
        dimensionless ratio. Pre-registered floor 4.
      - >-
        M2 result_set_identity -- boolean, whether the two search modes return
        the IDENTICAL SET of full-target matches on the fully-enumerable
        6-bit-window control subset. Unit -- boolean. BLOCKING; required true.
      - >-
        H1a poisson_goodness_of_fit -- the chi-square statistic between the
        observed matching-window collision-count distribution across
        independent target draws and Poisson(lambda = 256), at the
        pre-declared bins and significance level. Unit -- test statistic and
        p-value.
      - >-
        H1b conditional_full_target_rate -- the empirical fraction of
        matching-window hits that also satisfy the full declared target, with
        its interval, against the predicted 2^-8. Unit -- fraction.
      - >-
        H2a inversion_identity_failures -- failures of
        backward(forward(x)) equals x over at least 10,000 random tuples.
        Unit -- dimensionless count. BLOCKING; required 0.
      - >-
        F1 true_solution_presence -- per generated target, whether the declared
        search space contains the true free-word pair. Unit -- boolean per
        target; required true for all.
      - >-
        R1 cross_primitive_ratio -- (MD5-Round-1 cost per success) divided by
        (MD4-Round-1 cost per success) at the identical declared scale. Unit --
        dimensionless ratio. Pre-declared band [0.5, 2.0].
      - >-
        R2 null_constant_ratio -- the same ratio with both primitives'
        constants replaced by the declared shifted variant. Unit --
        dimensionless ratio. Reported alongside R1 always.
    secondary:
      - matching-window (12-bit) collision counts per target, individually, not pooled
      - full-target (20-bit) hit counts per target and the bit positions of each hit
      - wall clock per run alongside the wrapper-counted evaluations, so an interpreter effect is separable from an algorithmic one
      - peak memory and hash-table entry count
      - the sha256 hashes of both pinned specification texts
      - the declared 14 fixed message words and both seeds, as recorded
      - the number of targets actually drawn in the validation arm, against the declared range

  heuristic_under_test: HEUR-MD-H1
  preregistered_prediction:
    quantity: >-
      M1 at least 4; M2 true; H2a = 0; F1 true for every target; H1a failing to
      reject Poisson(256) at the declared level; H1b consistent with 2^-8; and
      R1 within [0.5, 2.0].
    formula: >-
      Predicted meet-in-the-middle cost is on the order of
      2^k1 + 2^k2 + 2^(k1+k2-m) chunk evaluations against a naive baseline of
      2^(k1+k2) over the same restricted space, giving a modeled roughly
      500-fold reduction at the declared sizes; THE PRE-REGISTERED FLOOR IS 4,
      deliberately far below it, so that hash-table and interpreter overhead
      cannot manufacture a failure. Expected matching-window hits per target
      are 2^(k1+k2-m) = 256, of which about 2^-(k-m) = 2^-8, i.e. about one,
      also satisfy the full target. Under the NULL that Round 1 alone carries
      none of MD5's added margin, R1 lies within [0.5, 2.0] -- and THAT IS
      STATED AS THE EXPECTED, UNSURPRISING OUTCOME so that it is recorded as a
      controlled null rather than spun as a ceiling finding.
    source: >-
      Pre-registered in IDEA-20260821-e46061 (its three predictions, its
      heuristic H1 with its validation plan, and its
      expected_result_stated_in_advance block) and restated as M1-M2, H1a-H1b,
      H2a, F1, R1-R2 in H-MDFIVE-8a7666 before any run exists. Never tuned to
      data.

  scale_relevance:
    tier: toy
    justification: >-
      Deliberately and explicitly a TINY model problem -- one round, two free
      words, a 20-bit target -- chosen so that every claim is checkable by
      complete enumeration against a naive baseline in the same invocation.
      SCALE ACCESS IS THE POINT AND SO IS ITS LIMIT. The declared parameters
      are a budget-safe FLOOR, and the parent proposal notes they likely
      under-use the per-run ceiling by orders of magnitude, so a Coordinator
      may reasonably scale the window sizes up (keeping the birthday
      relationship that gives an expected single true match, or widening it for
      a stronger tail check) BEFORE the run and as a recorded amendment, never
      after. THE TRANSFER ASSUMPTION IS NAMED AND EXPLICITLY NOT VALIDATED --
      HEUR-MD-H3, that the uniformity prediction survives as the windows grow,
      is a second-order extrapolation of an already-unproved heuristic and is
      not tested here. The gap to a real multi-round instrument is structural,
      not budgetary -- no free word survives a full-round chunk.
    correspondence: null

  tail_checks:
    - >-
      Compare the SINGLE LARGEST observed matching-window collision count
      across all targets against its Poisson tail probability, with an explicit
      p-value. A distribution that fits in the body and fails in the tail is
      exactly the structural tell being hunted.
    - >-
      Report the collision count per target INDIVIDUALLY, never pooled, so a
      reproducible excess across at least 3 draws is distinguishable from one
      anomalous target.
    - >-
      Report the bit positions of full-target hits, since hits clustering in
      particular bit positions would indicate the window filter and the target
      are not independent in the way the heuristic assumes.
    - >-
      Report wall clock beside wrapper-counted evaluations, so a speedup that
      exists in evaluations but vanishes in wall clock is visible as an
      overhead effect rather than an algorithmic failure.
    - >-
      Report the number of targets actually drawn against the declared range,
      since a validation arm truncated by budget has correspondingly less power
      and the chi-square verdict must be read with it.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    note: >-
      Seeds govern target generation and the fixed-word derivation; the search
      enumeration is seeded INDEPENDENTLY and both seeds are declared before
      the run. The inversion fixture and the fully-enumerable control-subset
      comparison are DETERMINISTIC and must be identical across seeds. The
      reproducibility requirement in the H1 falsifier -- a non-shrinking excess
      across at least 3 independent target draws -- is what these three
      instances exist to supply.

  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.5
    maximum_memory_gb: 2
    maximum_runs: 6

  stopping_rules:
    - >-
      DO NOT RUN the MD4 arm if the MD4 specification text is not available in
      a sha256-pinned form. Report BLOCKED. An unpinned best-effort transcript
      may not be cited as a frozen input, and approximating the constants is
      not an option.
    - >-
      ABORT at Stage 1 if the inversion fixture reports any failure. Every
      search result is blocked and the deliverable is the implementation
      defect.
    - >-
      ABORT at Stage 2 if the result sets differ. Baseline reproduction has
      failed and nothing else is admissible.
    - >-
      ABORT the success-rate reporting if F1 is false for any target; the
      reported rate would measure the target generator.
    - >-
      Run the MD5 arm at the IDENTICAL scale, NEVER larger. Scaling it
      separately would make the comparison meaningless.
    - >-
      Stop at maximum_runs, the per-run wall clock ceiling or total_cpu_hours,
      whichever binds first. Budget exhaustion is a stop, never a negative
      result (AGENTS.md rule 5) -- a validation arm truncated at fewer targets
      reports fewer targets, not a failed heuristic.

  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run reporting M1 without the naive all-pairs baseline executed in the
      SAME invocation over the SAME space is invalid_measurement.
    - >-
      A run reporting R1 without R2, or with the MD5 arm at a different scale
      from the MD4 arm, is invalid_measurement.
    - >-
      A run whose chi-square bins or significance level were chosen after any
      collision count was observed is completed_invalid.
    - >-
      A run citing an unpinned specification transcript as a frozen input is
      completed_invalid.
    - >-
      A run whose fixed message words are all-zero, or whose target and search
      seeds are not independent, is completed_invalid.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract. In particular, a run at larger
      window sizes is a different experiment unless a recorded protocol
      amendment preceded it.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) both specification texts
    were pinned with recorded hashes, or the affected arm is reported BLOCKED;
    (b) H2a = 0; (c) M2 is true; (d) F1 is true for every generated target;
    (e) M1 is reported with both modes' wrapper-counted evaluations over the
    same space; (f) H1a and H1b are reported at the pre-declared bins and level
    with per-target collision counts attached; and (g) R1 and R2 are reported
    together at identical scale. CLAIM M is SUPPORTED at toy tier if M2 is true
    and M1 is at least 4. CLAIM H is SUPPORTED if H1a fails to reject at the
    declared level and H1b is consistent with its predicted value. CLAIM R is
    SUPPORTED, AS A CONTROLLED NULL, if R1 lies within [0.5, 2.0].

  falsification_criterion:
    - >-
      M2 false -- the meet-in-the-middle result set differs from the naive
      all-pairs result set on the fully-enumerable control subset. The
      implementation or the mechanism as designed is FALSIFIED and nothing else
      is admissible.
    - >-
      M1 below 4 while M2 is true. The mechanism is correct but does not earn
      its complexity at this scale; Claim M fails operationally and the measured
      ratio is the recorded obstruction.
    - >-
      H1a shows a reproducible, non-shrinking heavier-than-Poisson tail across
      at least 3 independent target draws. HEUR-MD-H1 is FALSIFIED at this
      scale for this primitive -- a structural tell, and a genuine finding about
      the 9-step composition.
    - >-
      H1b departs systematically from its predicted value. The window filter
      and the full target are not independent in the way the heuristic assumes.
    - >-
      H2a > 0 -- any single inversion identity failure. Correctness is
      falsified before any search result can be trusted.
    - >-
      F1 false for any target -- the declared space does not contain the true
      solution. The feasibility obligation fails and any success rate is
      invalidated.
    - >-
      R1 outside [0.5, 2.0] AND R2 within it. The null that Round 1 alone
      carries no MD4-versus-MD5 margin difference is FALSIFIED. This is a
      REPORTABLE FINDING, not a defect to be explained away, and it remains
      scoped strictly to this 20-bit two-free-word slice.
    - >-
      R1 outside the band and R2 ALSO outside it. The effect is an artifact of
      the specific constant values and NO divergence finding may be reported.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying per-target matching-window collision counts, full-target hit counts and hit bit positions, individually and not pooled
    - the naive all-pairs baseline's evaluations and result set, in the same file as the meet-in-the-middle arm
    - the fully-enumerable 6-bit-window control subset's two result sets and their set-identity verdict
    - the inversion regression fixture's sample size and failure count
    - the MD5 arm and the null-constant replication of both primitives, at identical scale, in the same file
    - the Stage-0 pre-registration (split step, window sizes, fixed words, seeds, chi-square bins and level, null-constant shift, 4-fold floor, [0.5, 2.0] band), hashed before any run
    - the sha256 hashes of both pinned specification texts, or an explicit BLOCKED record for any arm whose text is unpinned
    - wrapper-counted evaluations alongside wall clock, per arm

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented in part; its proof_search_map is
      carried in H-MDFIVE-8a7666 and must be audited before implementation
      (KN-TECH-080).
    - >-
      INPUT-PINNING GATE -- the MD4 specification text is NOT sha256-pinned in
      this program, per the parent proposal's own disclosure. A Coordinator
      must either arrange a pinned acquisition before approval or accept that
      the MD4 arm reports BLOCKED. Approving a run that cites an unpinned
      transcript as a frozen input would be approving a fabricated input.
    - >-
      SCALE DECISION -- the declared parameters are a budget-safe FLOOR and
      likely under-use the per-run ceiling substantially. If a Coordinator
      wants a materially stronger tail check, the window sizes must be raised
      BEFORE approval as part of the frozen contract, never after a run.
    - >-
      A Coordinator must confirm that approving this contract licenses NO
      statement about full 48-step MD4 or full 64-step MD5 under any outcome,
      including the surprising one.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260821-e46061
    authored_at: '2026-08-25'
    note: >-
      Metrics M1, M2, H1a, H1b, H2a, F1, R1 and R2, the controls and the
      criteria render the parent proposal's three predictions, its three
      minimal_test controls, its five falsification conditions and its two
      heuristics with their validation plans into quantities decidable from a
      recorded number. The parent's own
      expected_result_stated_in_advance block for the cross-primitive ratio is
      preserved exactly as a pre-declared controlled null, which is what keeps
      the MD5 arm from being unfalsifiable in either direction. M2 is
      strengthened here from cardinality to SET IDENTITY, and F1 is promoted to
      a per-target verified metric rather than a construction assumption.
      Budgets come from the parent's declared estimated_cost (implementation
      low, compute low) and from its own 300-second per-run ceiling. No field
      is invented; unsupplied values are listed in derivation_gaps.

  derivation_gaps:
    - >-
      THE MD4 SPECIFICATION TEXT IS NOT SHA256-PINNED. The parent proposal
      discloses that its MD4 round schedule came through a summarising fetch
      rather than a byte-exact acquisition and files the excerpt as a
      best-effort transcript, flagging the pinning as an open acquisition item.
      This contract treats an unpinned text as BLOCKING for the MD4 arm rather
      than approximating it; a Coordinator must resolve the acquisition before
      approval.
    - >-
      The 14 fixed message words are required to be non-zero and seeded, but
      the seed and the resulting words are not specified here. They must be
      written into the frozen pre-registration.
    - >-
      The chi-square BINS and significance level are not specified. They must
      be frozen before any data is drawn; bins chosen after seeing collision
      counts would make HEUR-MD-H1 unfalsifiable.
    - >-
      The null-constant shift amount is named by convention but not given.
      It must be declared, since the null-constant control is what decides
      whether a cross-primitive divergence is a design effect or a
      constant-value artifact.
    - >-
      HEUR-MD-H3 -- that the uniformity prediction persists as the windows grow
      -- is NOT validated by this contract and is explicitly not attempted. It
      is a second-order extrapolation of an already-unproved heuristic and is
      recorded as an open direction.
    - >-
      The gap to a genuine multi-round instrument is STRUCTURAL, not
      budgetary -- no free word survives a full-round chunk, so any multi-round
      extension needs a different chunking strategy that this design does not
      provide and does not attempt to design. The omission is disclosed so no
      reader treats this contract as a scaled-down version of a full attack.
