experiment:
  id: EXP-ECDLP-1a7928
  hypothesis_id: H-ECDLP-a0d3ea
  version: 1
  title: >-
    Selectivity lift of the C_2^{m-2} quadratic-character filter as a
    factor-base membership predicate on the partial locus, with a forced-vacuum
    full-locus null, a planted lift of known size, and a curve-free
    multiquadratic tower that decides whether any lift is about the Semaev
    cover at all
  status: draft
  objective: >-
    Price what the C_2^{m-2} monodromy BUYS, which DEC-20260804-4f37d5 disposed
    of in one clause carrying no evidence reference, no experiment id and no
    run. THE SELECTIVITY IS NOT THE OPEN QUESTION AND THIS CONTRACT DOES NOT
    TREAT IT AS ONE. EV-MONO-a0a89c OBS-5 forces, unconditionally at every m,
    that a factor-base member makes every coordinate rational, the fibre split
    completely over F_p, and every character in the tower trivial, so filter
    sensitivity is exactly 1.000 and the selectivity lift is about 2^{m-2} for
    a sparse base. Both are theorems here, not measurements.
    TWO THINGS REMAIN OPEN AND ARE WHAT THIS CONTRACT MEASURES. First, the
    false-positive rate on NON-members, predicted 2^{-(m-2)} under
    uncorrelated characters, which is the one distributional quantity OBS-5
    does not settle. Second, and decisively, the charged F_p-operation cost per
    confirmed membership decision against the enumerate-and-test route. A
    filter with perfect sensitivity whose ceiling is removing a 1 - 2^{-(m-2)}
    fraction of candidates may still cost more than it saves once the tower and
    m-2 Legendre symbols are charged, and that is the outcome this contract
    exists to decide either way.
  inputs:
    curve_family: >-
      Toy prime-field short-Weierstrass curves at three primes, hygiene-screened
      with a factored group order and an explicit "#E(F_p) != p" check. Per
      RQ-MONO-001 constraint 2, j=0 and j=1728 curves are EXCLUDED from the
      random controls and, if run at all, are reported as a separate stratum
      and never pooled.
    arities_m: [4, 5]
    loci:
      partial: >-
        m-2 factor-base coordinates fixed, one free. At least three distinct
        choices of which coordinates are fixed, declared before any measurement
        and reported separately, never pooled.
      full: >-
        All coordinates free, where the summation fibre splits completely by
        the group law.
    candidates_per_cell: 100000
    factor_base: >-
      The interval factor base declared before any measurement, plus a
      size-matched random x-subset as a second arm.
    curve_free_null_object: >-
      A random multiquadratic tower of degree 2^{m-2} over the same F_p,
      unrelated to any curve, with a size-matched random x-subset standing in
      for the factor base.
    prior_art_not_duplicated: >-
      EXP-MONO-12ce1c Stage 3 already measured the factor-base sublocus
      coincidence rate against the forced formula 6*(tau-1)/N at m=4 and
      16*tau/N + 24*(tau-1)/N at m=5, with exactly zero collisions on every
      tau=1 curve over 20,000 valid tuples per cell in both runs. Its
      dual-path fixture verified deg_T(S_4) = 4 as a fully symbolic identity.
      Those results are consumed as fixtures here and are not re-measured.
  controls:
    - >-
      FORCED-VALUE CHECK, BLOCKING, RUN FIRST, TWO SIDED. On the partial locus
      the filter's SENSITIVITY must be exactly 1.000, and on the full
      factor-base locus its false-positive rate must be exactly 1.000. Both are
      forced by EV-MONO-a0a89c OBS-5 via the group law. Either coming back
      below 1.000 means the tower is built wrong and nothing else in the run is
      admissible. Neither is evidence.
    - >-
      PLANTED FALSE-POSITIVE RATE OF KNOWN SIZE, BLOCKING. A synthetic filter
      whose acceptance probability on non-members is set to exactly 0.400, a
      value distinguishable from both 0.250 and 1.000 at the declared sample
      size. The estimator must return 0.400 within plus or minus 0.010. An
      estimator that cannot recover a planted rate cannot report a real one and
      voids every rate in the run.
    - >-
      NAMED NULL, BLOCKING, CURVE-FREE. The identical filter and estimator on a
      random multiquadratic tower of the same degree over the same F_p with a
      size-matched random x-subset. CONSEQUENCE PRE-STATED, if its NON-MEMBER
      false-positive rate matches the Semaev arm within the pooled interval,
      that rate is a property of multiquadratic towers over F_p and MAY NOT be
      reported as a statement about the Semaev cover, about factor bases, or
      about the ECDLP. The SENSITIVITY side cannot be reproduced by this null,
      because it comes from the group law and a curve-free tower has none, so
      the two halves are scoped separately and never pooled.
    - >-
      RANDOM-SUBSET FACTOR BASE. The same measurement with the interval factor
      base replaced by a random x-subset of the same size. A lift specific to
      the interval base is a statement about that base's arithmetic structure
      and is reported separately.
    - >-
      MATCHED ENUMERATE-AND-TEST BASELINE. The committed enumerate-and-test
      membership route on the identical candidates, in the same F_p-operation
      unit, so that the cost ratio is charged on both sides in the same unit.
    - >-
      TOWER COST GATE. Tower construction and discriminant computation are
      charged to the resolvent side in full and reported as a separate line.
      No amortisation model is applied unless it is stated and its assumptions
      are reported with it.
  independent_variables:
    - arity m in {4, 5}
    - prime, three values
    - locus, partial versus full
    - choice of the fixed m-2 coordinates, at least three
    - factor base, interval versus size-matched random subset
    - object class, Semaev cover versus curve-free multiquadratic tower
  metrics:
    primary:
      - >-
        non-member false-positive rate, dimensionless, the fraction of
        candidates with the free coordinate NOT in the factor base that the
        filter accepts, with a two-sided 95 percent binomial interval
      - >-
        charged F_p operations per confirmed factor-base membership decision,
        resolvent route divided by enumerate-and-test route, dimensionless,
        with tower construction and all m-2 Legendre symbols on the resolvent
        side
    secondary:
      - filter sensitivity on the partial locus, forced to 1.000, an instrument check
      - false-positive rate on the full factor-base locus, forced to 1.000, an instrument check
      - derived selectivity lift 1/Pr[accept], reported with its inputs, never as a measurement
      - raw filter acceptance rate, dimensionless, per m and locus
      - base membership rate, dimensionless, per cell
      - tower construction cost in F_p operations, charged separately
      - Legendre-symbol count and measured cost per symbol, in F_p operations
      - bit-vector frequency table over the 2^{m-2} patterns, per cell
      - per-fixed-coordinate-choice breakdown of every primary metric
  heuristic_under_test: HEUR-MONOIMP-1
  preregistered_prediction:
    quantity: >-
      The false-positive rate of the m-2 quadratic-character filter on
      NON-members, on the partial locus, and the charged F_p-operation ratio
      per confirmed membership decision.
    formula: >-
      Non-member false-positive rate = 2^{-(m-2)}, that is 0.250 at m = 4 and
      0.125 at m = 5, on the assumption that the tower's m-2 characters are
      jointly uncorrelated on coordinates that are not factor-base elements.
      The competing regime is correlation, which drives the rate toward 1.
      Charged operation ratio strictly below 1.00 under the hypothesis, at or
      above 1.00 under the competing reading.
      NOT PREDICTED BECAUSE FORCED, sensitivity 1.000 on the partial locus,
      false-positive rate 1.000 on the full factor-base locus, and a
      selectivity lift of about 2^{m-2}; all three follow from EV-MONO-a0a89c
      OBS-5 and the group law.
    source: >-
      EV-MONO-a0a89c OBS-5, read in this task, for the forced half.
      DEC-20260804-4f37d5's C_2^{m-2} result and KN-OPEN-009's two-sided
      statement, both read verbatim, for the tower's structure. The
      uncorrelatedness of the non-member characters is derived in
      H-ECDLP-a0d3ea as HEUR-MONOIMP-1 and is undischarged.
  band_non_degeneracy:
    checked_before_freezing: true
    arms_found_degenerate_and_repaired:
      - >-
        SOURCE ARM REJECTED AS DEGENERATE. IDEA-20260807-5126f4 pre-registers
        "false-positive rate of the m-2 character filter below 1/2 at m = 4"
        with the falsifier "rate is about 1". COMPUTED, that band cannot
        discriminate. The tower has m-2 = 2 bits at m = 4, so a filter
        demanding a specific bit-pattern accepts about 2^{-(m-2)} = 1/4 of
        candidates for purely structural reasons, whatever the bits mean. A
        false-positive rate below 1/2 is therefore FORCED by the arity, and is
        obtained even when the bit-vector is statistically independent of
        factor-base membership. The nominated falsifier, a rate near 1,
        requires the filter to accept essentially everything, which contradicts
        the tower having 2^{m-2} distinct patterns and is unreachable for every
        parameter value in the declared range.
      - >-
        FIRST REPAIR, SUBSEQUENTLY FOUND DEGENERATE ITSELF AND RECORDED HERE
        RATHER THAN QUIETLY DROPPED. An earlier version of this contract
        replaced the rate by the selectivity lift
        rho_filter = Pr[x in FB | accept] / Pr[x in FB], with a null band
        [0.97, 1.03] against a hypothesis value at or above 1.30 and a planted
        1.50 control. READING EV-MONO-a0a89c OBS-5 KILLED THAT BAND TOO, IN THE
        OPPOSITE DIRECTION. OBS-5 establishes unconditionally at every m that
        if x_1..x_{m-1} are x-coordinates of rational points then every root of
        S_m lies in F_p, so the fibre splits completely on the factor-base
        locus. A true member therefore makes every character in the tower
        trivial, the filter never rejects one, sensitivity is exactly 1.000,
        and rho_filter = 1/Pr[accept] is forced to about 2^{m-2}, that is about
        4 at m = 4 and 8 at m = 5, for a sparse base. The "alternative" the
        band was to detect is a committed theorem, so measuring it would
        re-measure OBS-5 and could not decide anything.
      - >-
        SECOND REPAIR, COMPUTED, NOT A LOOSENED THRESHOLD. The measured set is
        split along exactly the line OBS-5 draws. The MEMBER side is removed
        from evidence and retained as a forced-value instrument check,
        sensitivity 1.000 on the partial locus and false-positive rate 1.000 on
        the full factor-base locus. The NON-MEMBER side becomes the primary
        distributional metric, predicted 2^{-(m-2)}, which OBS-5 does not
        settle and which correlation among the tower's characters would move
        toward 1. The COST becomes the primary decisional metric, since a
        perfectly sensitive filter can still fail to pay.
    surviving_bands_and_their_separations:
      - >-
        NON-MEMBER FALSE-POSITIVE RATE. Predicted 2^{-(m-2)}, that is 0.250 at
        m = 4 and 0.125 at m = 5. At 100,000 candidates per cell the standard
        error at 0.250 is 0.0014, so a band of 0.250 plus or minus 0.010 is
        about seven standard errors wide and is not a threshold chosen to be
        easy to clear. The competing regime, correlated characters, drives the
        rate toward 1 and is separated from the band by an order of magnitude.
        NON-DEGENERATE, and it is the only distributional claim in the record.
      - >-
        CHARGED OPERATION RATIO. Predicted strictly below 1.00 by the
        hypothesis and at or above 1.00 by the competing reading, with nothing
        in the construction pinning it to either side, since it is a ratio of
        two measured operation counts whose relative size depends on the tower
        construction cost that OBS-5 says nothing about. NON-DEGENERATE, and it
        is what decides the record.
    forced_quantities_recorded_as_proofs_not_arms:
      - >-
        SENSITIVITY = 1.000 on the partial locus, forced by OBS-5 via the group
        law. Retained as an instrument check; a value below 1.000 means the
        tower is built wrong.
      - >-
        FALSE-POSITIVE RATE = 1.000 on the full factor-base locus, forced by
        the same theorem, since there every coordinate is a base element and
        every candidate is accepted. The filter is vacuous there by theorem.
      - >-
        SELECTIVITY LIFT about 2^{m-2} for a sparse base, forced as an
        arithmetic consequence of sensitivity 1 and acceptance rate
        2^{-(m-2)}. Reported as a derived number with its inputs, never as a
        measured confirmation.
      - >-
        The lossiness of the projection root -> bit-vector, 2^{m-2} roots onto
        m-2 bits, is a counting fact. It bounds the filter to being a filter
        and is recorded as a derivation in H-ECDLP-a0d3ea rather than tested.
  scale_relevance:
    tier: toy
    justification: >-
      Three toy primes, m at most 5, 100,000 candidates per cell. The lift is a
      statement about those cells. Nothing here bears on the relation-collection
      exponent, and a favourable outcome is a CONSTANT-factor claim in a stage
      whose dominance in the end-to-end cost this Coordinator could not verify,
      see H-ECDLP-a0d3ea's disclosed FINDING-PF-IC-001 gap. Behaviour at
      cryptographic m and p is UNTESTABLE AT REACHABLE SCALE here and is not
      extrapolated to.
    correspondence: null
  tail_checks:
    - >-
      The least frequent bit-vector pattern in each cell, checked against the
      uniform expectation over 2^{m-2} patterns. A pattern that never occurs
      indicates a degenerate tower construction rather than a selective filter.
    - >-
      rho_filter recomputed on the single most-selective and least-selective
      fixed-coordinate choice separately, so that a pooled lift cannot be
      carried by one choice.
    - >-
      The upper tail of the per-candidate Legendre-symbol cost, so that a
      favourable mean cost ratio cannot hide a heavy tail.
  replication:
    seeds: [20260904, 20260905]
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
  stopping_rules:
    - >-
      DISPATCH GATE, BEFORE ANY RUN, INHERITED FROM THE OWNING GOAL. This
      contract sits under RQ-MONO-001, owned by GOAL-MONO-001, whose record at
      ledger/goals/GOAL-MONO-001/goal.yaml is "paused" with campaign budget
      exhausted and whose next_action gates any new batch on the five
      CORR-20260802-1d8384 OI-1 repairs AND on a fresh budget grant from
      GOAL-PATH-001. Neither may be waived at approval time.
    - >-
      BLOCKING PRECONDITION, CHEAPER THAN THIS CONTRACT AND HIGHER PRIORITY.
      DEC-20260810-2f86db D-5 states that its symbolic transport check, whether
      the symmetry of S_3 carries disc_T S_3(x1,x2,T) = 16 f(x1) f(x2) to
      disc_{x2} S_3(x1,x2,T0) = 16 f(x1) f(T0), is UNVERIFIED and "must precede
      any harness work". Settle it and record the outcome before any cell of
      this contract runs. It decides the D-4 successor route, not this
      contract's cost question, but it is cheap and it is owed first.
    - >-
      Run the two FORCED-VALUE checks next. If partial-locus sensitivity is
      below 1.000, or full-locus false-positive rate is below 1.000, halt and
      report the implementation defect. No non-member rate is read.
    - >-
      Run the planted-rate control after them. If it does not return 0.400
      within plus or minus 0.010, halt. A rate from an instrument that cannot
      recover a planted rate is not admissible.
    - >-
      If the measured interval half-width on the non-member rate exceeds 0.010
      at the declared sample size, increase the candidate count to the value
      that reaches 0.010 under the observed variance, or report the cell as
      UNDERPOWERED with that required count. The band is never widened.
    - >-
      Stop at m = 5 or when tower construction at a cell exceeds one third of
      the run's wall-clock budget, and report which.
  invalidation_rules:
    - >-
      Fixed-coordinate choices are selected or reported after seeing a lift.
    - >-
      Results are pooled across fixed-coordinate choices, across loci, or
      across the interval and random factor bases.
    - >-
      Tower construction cost is amortised away without stating the
      amortisation model.
    - >-
      The symbolic degree fixture disagrees with deg_T(S_4) = 4 or
      deg_T(S_5) = 8 as verified in EXP-MONO-12ce1c's committed dual-path
      cross-check.
    - >-
      j=0 or j=1728 curves are used inside the random controls, contrary to
      RQ-MONO-001 constraint 2 and KN-OPEN-009's own caveat.
    - >-
      Any timeout, crash or memory exhaustion. An infrastructure outcome per
      AGENTS.md rule 5, never evidence about the tower.
  success_criterion: >-
    All of the following on the same committed run set. The full-locus null
    returns rho_filter in [0.97, 1.03]; the planted-lift control returns 1.50
    within +/- 0.05; the partial-locus rho_filter interval lies entirely at or
    above 1.30 at m = 4 and again at m = 5, at all three primes and at every
    declared fixed-coordinate choice; the charged F_p-operation ratio is
    strictly below 1.00 at both arities; and the curve-free multiquadratic null
    does NOT reproduce the Semaev arm's lift within the pooled interval.
    Anything weaker is reported as such and is not a success.
  falsification_criterion: >-
    Any of the following, scoped to the tested primes, arities, loci,
    fixed-coordinate choices and budget. rho_filter's interval lies inside
    [0.97, 1.03] on the partial locus at every cell while the planted-lift
    control fires, which closes KN-OPEN-009's imprimitivity half with an
    argument and a number rather than an assertion, at the tested scope. Or the
    charged operation ratio is at or above 1.00 at every tested m even where a
    lift exists, so the decomposition is not a cheaper predicate. Or the
    curve-free multiquadratic null reproduces the lift, in which case no
    Semaev, factor-base or ECDLP statement may be drawn whatever the lift is.
  required_artifacts:
    - implementation source at a pinned revision, with the tower construction code identified
    - explicit tower and discriminant data per cell, retained
    - per-cell raw candidate tables with bit-vector, membership flag and cost
    - the full-locus vacuity null's results, reported before any partial-locus number
    - the planted-lift control's results, with the planted value stated in advance
    - the curve-free multiquadratic null's results in the same schema
    - the matched enumerate-and-test baseline's operation counts on identical candidates
    - the symbolic degree fixture output, checked against EXP-MONO-12ce1c's committed values
    - per-fixed-coordinate-choice breakdown of every primary metric, unpooled
    - manifest per AGENTS.md artifact policy, including seeds, environment and dirty-tree state
  assigned_to: executor
  approved_by: null
