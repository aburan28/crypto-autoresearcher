experiment:
  id: EXP-VOLC-ece740
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-a6fb2a
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'ARITHMETIC SIZE IS LEVEL-BLIND BUT ALGEBRAIC SIZE IS NOT: bit length, Hamming weight and
    multiplicative order of j are uniform at every volcano level because reduction mod p destroys
    height, yet the MINIMAL DEGREE OF A SMALL-COEFFICIENT INTEGER POLYNOMIAL ANNIHILATING j -- which
    is h(disc End E) -- grows with the conductor, giving an LLL-based level detector that uses no
    isogeny computation at all, plus a named coefficient-sparsity artifact at j = 0 and j = 1728 that
    a random isomorphic remodelling must kill'
  status: draft
  objective: "(A) THE NEGATIVE HALF, STATED SHARPLY. Over F_p there is no archimedean size. The j-invariants\
    \ of the curves at level i of the ell-volcano are the roots in F_p of the Hilbert class polynomial\
    \ H_{D_K f^2}(X) mod p, where f is the conductor at that level. REDUCTION MOD p DESTROYS HEIGHT:\
    \ a root of a degree-h polynomial modulo p is an element of F_p and carries no residual smallness.\
    \ Therefore every ARITHMETIC size functional -- bit length of the canonical representative in\
    \ [0, p), Hamming weight, popcount of (a, b), multiplicative order of j in F_p^*, the height of\
    \ the smallest rational number congruent to j modulo p by rational reconstruction -- is predicted\
    \ to be indistinguishable from its distribution on a uniform random element of F_p, AT EVERY LEVEL,\
    \ INCLUDING THE CRATER. This is a prediction with a direction and an effect size, not a shrug:\
    \ the Kolmogorov-Smirnov distance between the level-i sample and the uniform reference must lie\
    \ inside the sampling band, at every level.\n(B) THE POSITIVE HALF, AND IT IS THE POINT OF THE\
    \ RECORD. There is a size functional that DOES see the level, and it is algebraic rather than\
    \ arithmetic. Define\n  d(j) = the least d such that there exist integers (c_0, ..., c_d), not\
    \ all\n         zero, with |c_i| <= C and sum_i c_i j^i congruent to 0 mod p,\nfor a declared\
    \ coefficient bound C. Because the level-i j-invariants are roots of H_{D_K f^2} mod p, a curve\
    \ at conductor f satisfies such a relation at degree h(D_K f^2) with the coefficients of that\
    \ class polynomial. And h(D_K f^2) = h(D_K) * f * (w_f/w_1) * prod_{l | f} (1 - (D_K/l)/l), which\
    \ GROWS ESSENTIALLY LINEARLY IN f -- the exact formula machine-checked at 180 cells in IDEA-20260805-38aebb.\
    \ So:\n  ASCENDING THE VOLCANO STRICTLY REDUCES THE ALGEBRAIC DEGREE OF j.\nAt the crater of a\
    \ class-number-one class, h(D_K) = 1 and j is the reduction of one of the thirteen RATIONAL CM\
    \ j-invariants (the class-number-one discriminants -3, -4, -7, -8, -11, -12, -16, -19, -27, -28,\
    \ -43, -67, -163; RECALLED, standard, and checkable directly by table lookup at toy scale). At\
    \ a level with conductor f the degree is about f * h(D_K). The signal is real, it is graded, and\
    \ it is a function of the SCALAR conductor f, not of any single ell-coordinate -- which places\
    \ it squarely in the H_size branch of IDEA-20260807-a2b59a's trichotomy, and that record's factorial\
    \ is what would confirm it.\n(C) THE DETECTOR, AND WHY IT IS INTERESTING BEYOND MEASUREMENT. d(j)\
    \ is computable by LLL on the lattice generated by the rows of the (d+1) x (d+2) matrix encoding\
    \ (1, j, j^2, ..., j^d) mod p with a weight on the modular coordinate: a short vector in that\
    \ lattice IS a small-coefficient annihilating polynomial. So THE VOLCANO LEVEL CAN BE READ OFF\
    \ j ALONE BY LATTICE REDUCTION, WITH NO ISOGENY COMPUTATION, NO MODULAR POLYNOMIAL AND NO WALK.\
    \ Cost: one LLL in dimension d+1 with entries of size p, which is polynomial in d and log p. FEASIBILITY\
    \ BOUNDARY, stated honestly: this works only while d = h(D_K f^2) is small enough for LLL, i.e.\
    \ a few hundred, which by h ~ f sqrt(|D_K|) means only near the crater of a SMALL-DISCRIMINANT\
    \ class. That is exactly where the signal exists, so the detector's range and the signal's range\
    \ coincide -- which is a coherence check the record passes rather than a coincidence to be celebrated.\n\
    (D) THE ARTIFACT, NAMED IN ADVANCE. At j = 0 the curve is y^2 = x^3 + b (so a = 0) and at j =\
    \ 1728 it is y^2 = x^3 + a x (so b = 0). A vanishing coefficient makes the Semaev summation polynomial\
    \ SPARSER, which makes sympy's Groebner routine measurably faster for reasons that are entirely\
    \ about term counts and nothing about mathematics. Because j = 0 and j = 1728 occur only at craters\
    \ of the D_K = -3 and D_K = -4 classes, THIS SPARSITY ARTIFACT WILL PRESENT AS A CRATER SPEEDUP\
    \ unless controlled. THE CONTROL IS EXACT AND CHEAP: re-run the same measurement on a random ISOMORPHIC\
    \ model of the same curve, (a, b) -> (u^4 a, u^6 b) for random u in F_p^*, which is the same curve\
    \ with the same group, the same level, the same everything -- except dense coefficients. If the\
    \ speedup vanishes under remodelling it was sparsity; if it survives it is something else. Any\
    \ crater-versus-floor result in this lane that has not been run through this control is uninterpretable,\
    \ and this record exists partly to put that requirement on the record before such a result appears."
  resource_label: R2 (the curve equation / model) primarily, with R3 entering only as the stratifying
    conductor
  admissibility: admissible
  admissibility_argument: 'Every measured quantity is a function of the curve''s EQUATION or of its
    j-INVARIANT as a field element -- R2, and in the LLL detector''s case R2 plus integer lattice
    reduction. None of it is a group-operation output, so KN-FIND-b7e091''s simulability argument
    does not apply; none of it applies an endomorphism to a point of G, so H-ENDO-001 does not apply;
    and none of it factors through the abstract triple (G, P, Q), so IDEA-20260807-5cabfc''s closure
    leaves it open. Note carefully what admissibility does NOT mean here: the detector in (C) reads
    the level from public curve data, and by IDEA-20260807-4f43ac''s argument a level so obtained
    is a curve-only constant and is worth nothing to a group-only algorithm. Admissible means the
    MEASUREMENT is outside the closed model, not that an attack follows.'
  reachability_gate: 'THE DETECTOR CHANGES THE REACHABILITY PICTURE IN ONE SPECIFIC WAY AND NOT MORE.
    Determining the level normally requires walking (IDEA-20260807-3c6bd8: O(ell * h^2) isogeny computations,
    infeasible at large ell). The LLL detector determines the SCALAR conductor from j alone with no
    walk, in time polynomial in h(disc End E) and log p. So for small-class-number classes the level
    is LOCALLY DETECTABLE at a vertex with no graph exploration whatsoever, which strengthens the
    "goodness is locally detectable" branch of DECOMPOSITION T5 for exactly those classes. IT DOES
    NOT HELP AT CRYPTO SCALE for random curves, where h(D_K) is already about sqrt(p) and the lattice
    is far out of reach -- and that limitation is not incidental, it is the reason no attack follows.
    Reaching a target level still costs what bb03d3 says it costs; only the detection is cheapened.'
  inputs:
    procedure: 'STAGE 1 (minutes): arithmetic statistics on an enumerated class plus the uniform null.
      Pure integer work, no curves needed beyond the enumeration. STAGE 2 (hours): the LLL detector
      with the weight sweep and the random-j control. numpy or a hand-rolled LLL suffices at these
      dimensions; no Sage. STAGE 3 (minutes): the class-number-one table check. STAGE 4 (hours): horizontal-invariance
      and descending-step propagation tests. STAGE 5 (hours): the j = 0 / j = 1728 sparsity measurement
      with remodelling. STAGES 1, 3 AND 5 CAN RUN WITHOUT ANY ISOGENY CODE, which makes this the most
      independent item in the batch and a useful early check on the others.'
    mechanism: 'STEP 1 -- THE ARITHMETIC NEGATIVE. On a completely enumerated toy class (IDEA-20260807-3f5545
      Step 2), compute per curve: bit length and Hamming weight of j, a, b; multiplicative order of
      j in F_p^*; and the rational-reconstruction height of j (the smallest max(|u|,|v|) with u/v
      congruent to j mod p, by the extended Euclidean algorithm -- exact, cheap, no LLL needed). Compare
      each statistic''s distribution per level against the uniform reference computed on random elements
      of F_p, by two-sample KS. STEP 2 -- THE ALGEBRAIC POSITIVE. For each curve, run LLL on the lattice
      spanned by the rows of [[1, 0, ..., 0, W], [0, 1, ..., 0, W j], ..., [0, ..., 1, W j^d], [0,
      ..., 0, W p]] for increasing d and a weight W chosen so that a short vector forces the modular
      relation. Record the smallest d at which a vector with coefficients bounded by C appears. Compare
      against h(D_K f^2) computed from the level label. STEP 3 -- THE HORIZONTAL INVARIANCE TEST.
      Walk horizontally at fixed level and check d is unchanged; walk vertically and check d scales
      by about ell. This is the propagation rule as an experiment. STEP 4 -- THE CLASS-NUMBER-ONE
      TABLE CHECK. In a class with h(D_K) = 1, verify that the crater j equals the reduction mod p
      of the tabulated rational CM j-invariant for that D_K. This is an exact equality check and it
      is the cheapest possible confirmation that the level labelling and the detector agree with classical
      theory. STEP 5 -- THE SPARSITY ARTIFACT AND ITS CONTROL. Measure the frozen Semaev meter on
      j = 0 and j = 1728 curves and on random isomorphic remodellings of the same curves, plus on
      generic-j curves at the same level. Report the speedup with and without remodelling. The difference
      IS the artifact size, and reporting it is a service to every other record in this lane.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - uniform random field elements for the arithmetic half (N1, blocking)
  - random isomorphic remodelling of the same curve (N2, blocking)
  - random-j input to the LLL detector (N3, blocking)
  - LLL weight and coefficient-bound sweep (N4)
  - cross-check of every level label against the isogeny-counting instrument of IDEA-20260807-b1b604
    -- two independent instruments must agree
  - "NULL OBJECT (from the proposal): (N1) THE UNIFORM-FIELD-ELEMENT NULL for the arithmetic half:\
    \ random elements\n  of F_p, same sample size. Every arithmetic statistic must be\n  indistinguishable\
    \ from this at every level. Blocking for claim (A).\n(N2) THE RANDOM-ISOMORPHIC-REMODELLING NULL\
    \ for the sparsity artifact: the\n  SAME curve with (a, b) -> (u^4 a, u^6 b). Same curve, same\
    \ group, same\n  level, same j, dense coefficients. Any speedup that vanishes here was\n  sparsity.\
    \ Blocking for any crater-versus-floor cost claim.\n(N3) THE RANDOM-j NULL for the LLL detector:\
    \ run the detector on uniformly\n  random elements of F_p. It must report d at or above the LLL\
    \ bound -- i.e.\n  find NO small-coefficient annihilator of low degree -- because a random\n \
    \ element satisfies no such relation. A detector that finds low-degree\n  relations for random\
    \ elements is measuring lattice noise, not CM structure,\n  and this is the single most important\
    \ control in the record.\n(N4) THE WEIGHT-SWEEP CONTROL: vary the LLL weight W and the coefficient\
    \ bound\n  C over a declared grid and report d as a function of both. A d that depends\n  strongly\
    \ on W is a parameter artifact.\nDECAY PARAMETER: the conductor f, equivalently the level. d must\
    \ GROW like f; the arithmetic statistics must NOT change with f at all. Two opposite predicted\
    \ behaviours in the same experiment is what makes this a discrimination rather than a fishing\
    \ trip: an instrument that moved both, or neither, would be telling on itself."
  independent_variables: []
  metrics:
    primary:
    - each arithmetic statistic per curve, per level, with KS distances
    - d(j) per curve, with the recovered annihilating polynomial
    - h(D_K f^2) per level from the class-number formula
    - horizontal-walk d sequence and descending-step d ratios
    secondary:
    - LLL dimension, wall time and peak memory per detection
    - Groebner wall time for j = 0 / j = 1728 with and without remodelling
    - agreement rate between the LLL detector and the isogeny-counting labeller
  heuristic_under_test: null
  preregistered_prediction:
    quantity: two-sample KS distance between the per-level distribution of each arithmetic statistic
      (bit length, Hamming weight, multiplicative order, rational-reconstruction height of j) and
      the uniform reference
    formula: 'PREDICTED NULL: KS distance inside the sampling band at every level, for every statistic.
      Any statistic exceeding the band, reproducibly across two classes, is the surprise and would
      need independent review before being reported. Note the trap: rational-reconstruction height
      is the one where a naive implementation can manufacture a signal by reconstructing to a fixed
      bound; the bound must be sqrt(p) and stated.'
    source: pre-registered in IDEA-20260807-a6fb2a before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - COEFFICIENT BOUND C IS NOT UNIFORM. Hilbert class polynomial coefficients grow with |D|, so a
    C large enough at one class is too small at another. C must be declared per class and the sensitivity
    reported; a fixed global C would manufacture level-dependent detection failures that look like
    signal.
  - CLASS-NUMBER COINCIDENCES. Two conductors can give the same h, so d does not determine f uniquely.
    The coincidences must be enumerated in advance for the tested classes and excluded from the resolution
    claim.
  - RATIONAL RECONSTRUCTION BOUND. Reconstructing j to a bound smaller than sqrt(p) gives failures
    whose rate depends on j in ways unrelated to CM; the bound must be exactly sqrt(p) and stated.
  - j = 0 and j = 1728 have extra automorphisms as well as sparse coefficients. Remodelling kills
    the sparsity but NOT the automorphisms, so a surviving effect could still be the KN-TECH-018 discount
    rather than something new. Both explanations must be separated before either is claimed.
  - LLL implementation quality at dimension a few hundred with entries of size p is a real engineering
    variable in pure Python; the weight sweep is the guard and the achieved reduction quality must
    be reported.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'PREDICTED NULL: KS distance inside the sampling band at every level, for every
    statistic. Any statistic exceeding the band, reproducibly across two classes, is the surprise
    and would need independent review before being reported. Note the trap: rational-reconstruction
    height is the one where a naive implementation can manufacture a signal by reconstructing to a
    fixed bound; the bound must be sqrt(p) and stated.'
  falsification_criterion:
  - Any arithmetic statistic showing a reproducible level dependence. Claim (A) is false and the mechanism
    must be found before anything else is reported.
  - d(j) not constant along a horizontal walk. The propagation rule is false and d is not a conductor
    invariant.
  - The LLL detector finding low-degree small-coefficient relations for random field elements. The
    detector is void; nothing from Stage 2 may be reported.
  - Detector-versus-isogeny-labeller disagreement above 5 percent. One of the two instruments is wrong
    and the lane's level labels are unreliable until it is resolved. This is the most consequential
    possible outcome of this record, because every other proposal in the batch depends on those labels.
  - The j = 0 speedup surviving random isomorphic remodelling. Not sparsity; requires a new explanation,
    and casts doubt on prior measurements taken on a = 0 curves.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-a6fb2a
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
