experiment:
  id: EXP-NTRUL-7e521f
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-49b818; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-49b818
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Sweep orbit rank along the divisor ladder of a block-circulant NTRU family at fixed dimension,
    determinant, plant rank and secret norm, measuring the structure discount by correlation determinant
    and by certified-recovery budget
  objective: The uncertainty reduced is whether the contribution of ring structure to lattice density
    has a growth direction in the amount of structure, at fixed everything else, and whether a zero-compute
    measure of it predicts a reduction-based one. (i) Can the ladder be constructed so that dimension,
    determinant, modulus, plant rank and total secret Frobenius norm are exactly matched across all
    rungs, verified by an explicit matching certificate that aborts the run on failure, since without
    that guarantee no observed curve is attributable to orbit rank; (ii) what is the shape of the
    correlation log-determinant as a function of log r across the divisor ladder, adjudicated among
    extensive, saturating and flat forms, with the r = 1 rung serving as the matched unstructured
    control produced by the same code in the same invocation and the shuffled-plant null required
    to return that rung's value from a high-r rung; (iii) does the minimum reduction budget for certified
    recovery at fixed success probability move across the ladder, and does it rank-correlate with
    the cheap measure, which is the only way to learn whether the covolume-side quantity sees what
    a reduction algorithm sees. A flat curve on both coordinates is a complete and useful negative
    and is recorded as a measured obstruction with its CIs.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: within this constructed block-circulant
      family, at n = 24 and the tested modulus and secret distribution, the correlation log-determinant
      varies with orbit rank as fitted with the reported shape and CIs, the certified-recovery budget
      varies as reported, and the two rank-correlate at rho with its CI. What does NOT follow: nothing
      about NTRU or module NTRU at any deployed parameter; nothing about attack cost, since the reduction
      arm runs at dimension 48 and recovery there is a fact about a small lattice; no conversion of
      the measured discount into bits; and no claim that this family''s r is a general measure of
      structure for other lattice families.'
  inputs:
    procedure: 'STAGE 0, cost hours of implementation: build the block-circulant module NTRU generator
      parameterised by r, with exact determinant computation and rejection-based norm matching; implement
      the matching certificate gate. STAGE 1, cost minutes: run the certificate across all rungs and
      abort on any failure; report rejection rates. STAGE 2, cost tens of minutes: 200 instances per
      rung, correlation log-determinant computed exactly, with and without the all-ones spectral contribution.
      STAGE 3, cost minutes: shuffled-plant null at r = n, required to return the r = 1 value within
      Monte-Carlo error. STAGE 4, cost minutes: fit the three shapes to the cheap coordinate with
      explicit weighting for the uneven divisor spacing, report AIC weights. STAGE 5, cost hours and
      capped, conditional on a reduction implementation being available: per rung, increase block
      size on a declared ladder until certified recovery reaches 50 percent over 40 instances or the
      cap is hit, recording budgets and non-recoveries. STAGE 6, cost minutes: rank-correlate the
      two coordinates across rungs and report with CI.'
    instrument: Pure Python 3 with exact integer arithmetic for construction, determinant, correlation
      and certificate. The matching certificate is the checker specified in the companion tooling
      contract in this batch, imported rather than reimplemented. The reduction arm requires a lattice-reduction
      routine; the contract permits fpylll if the Coordinator confirms availability, or an exact-integer
      LLL plus a small BKZ loop in harness/ held to a known-answer control, following the precedent
      in tools/sage_free_estimator/README.md where a shim is trusted only after reproducing archived
      references. Recovery certificates are re-verified by harness/runner.py independently of the
      reduction code. No Sage.
    parameters: n = 24 with rungs r in {1, 2, 3, 4, 6, 8, 12, 24} and m = n / r; secondary n = 36
      with rungs r in {1, 2, 3, 4, 6, 9, 12, 18, 36} if budget allows. Lattice dimension 2n = 48 and
      72. Modulus fixed at q = 2^13 for the primary sweep, with a secondary q = 2^17 cell. Ternary
      secrets, total Frobenius norm matched across rungs to 0.5 percent by rejection. 200 instances
      per rung for the cheap coordinate; 40 per rung per block size for the reduction arm; block-size
      ladder declared in advance with a wall-clock cap per cell.
  controls:
  - The r = 1 rung as the matched unstructured control, executed in the same invocation by identical
    code.
  - Shuffled-plant null at high r, required to return the r = 1 correlation value.
  - Matching certificate gate on dimension, determinant, plant rank and total norm across all rungs,
    aborting the run on failure.
  - Certified recovery in the reduction arm, with the certificate re-verified independently of the
    reduction code.
  - Rejection-rate reporting for the norm matching, since a very low acceptance rate would mean the
    rungs carry different effective secret distributions.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The r = 1 rung is the matched unstructured control and is a rung of
    the ladder itself, so signal and control are produced by identical code in the same invocation
    with no possibility of a construction discrepancy. In addition, a shuffled-plant null: take a
    rung with r > 1 and replace its orbit-structured plant by an independent plant of the same rank
    and matched total norm, which should reproduce the r = 1 correlation determinant; if it does not,
    the ladder''s rungs differ in something besides orbit rank and the whole attribution fails. For
    any claim of a discount, the curve must be monotone in r and must return to the r = 1 value under
    shuffling.'
  independent_variables:
  - orbit rank r along the divisor ladder
  - n in {24, 36}
  - modulus q in {2^13, 2^17}
  - plant type in {orbit-structured, shuffled independent}
  metrics:
    primary:
    - correlation log-determinant per instance and rung
    - fitted shape and AIC weights for the discount in log r
    - minimum block size for 50 percent certified recovery per rung
    - shuffled-null deviation from the r = 1 rung
    - rank correlation between the two coordinates
    secondary:
    - norm-matching rejection rate per rung
    - correlation determinant with the all-ones contribution excluded
    - certificate verification results in the reduction arm
    - count of non-recoveries at the cap per rung
    - wall-clock per rung
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The correlation log-determinant of the planted sublattice as a function of orbit rank
      r, and the minimum certified-recovery block size as a function of r, at fixed n, q, plant rank
      and total secret norm.
    formula: 'S(r) = -log det C(r), where C(r) is the diagonal-normalised Gram matrix of the n planted
      generators arranged as m orbits of size r; discount D(r) = S(r) - S(1). Predicted: D(r) monotone
      non-decreasing in log r with D(1) = 0 by definition; shuffled-plant null at r = n reproducing
      S(1) within one Monte-Carlo standard error; rank correlation between D(r) and the negative of
      the recovery block size at least 0.5.'
    source: Pre-registered in the parent proposal IDEA-20260816-49b818 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: n = 24 and 36, lattice dimensions 48 and 72, with the reduction arm at dimension
      48 only. These are the largest sizes at which several block sizes across eight rungs fit a bounded
      budget. The cheap coordinate could be computed at deployed degrees at negligible cost, and the
      contract permits reporting such a curve as descriptive, explicitly labelled as unvalidated against
      any reduction measurement and carrying no claim.
    correspondence: null
  tail_checks:
  - The r = 1 and r = n endpoints, which carry the control burden and the strongest structure respectively
    and where an implementation error would be least visible.
  - Rungs with small m, where the number of independent objects is small and the norm matching is
    coarsest.
  - The all-ones spectral contribution at small r, where it is a larger fraction of the total.
  - Reduction-arm cells that hit the cap without reaching 50 percent recovery, recorded as budget
    outcomes and excluded from the budget curve with counts published.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort if the matching certificate fails at any rung.
  - Abort if the shuffled-plant null does not return the r = 1 value.
  - Cap the reduction arm per cell in wall-clock; exhaustion is a budget outcome under AGENTS.md rule
    3 and never evidence about hardness.
  - Stop the block-size ladder for a rung once 50 percent certified recovery is reached.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The certificate passes at every rung, the shuffled null returns the r = 1 value,
    and the discount curve is reported against log r with CIs and a fitted shape, with the reduction-arm
    curve and the rank correlation reported if that arm completes.
  falsification_criterion:
  - Flat discount across the ladder within CIs, recording the negative as a measured obstruction.
  - Non-monotone discount, falsifying the propagation prediction.
  - Shuffled-null failure or certificate failure, invalidating the ladder.
  - Rank correlation below 0.5 between coordinates, recording the cheap measure as non-predictive
    within this family.
  - No rung reaching 50 percent recovery within the cap, leaving the expensive coordinate unmeasured
    and reported as such.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-49b818
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact determinant of the block-circulant lattice as a function of r must be derived and checked,
    not assumed to be q^n at every rung; non-invertible blocks are the risk.
  - Whether total Frobenius norm or per-object norm is the right matching target across rungs needs
    a Coordinator ruling, since they differ when m changes.
  - Reduction-implementation availability and its known-answer control are unresolved and gate STAGE
    5.
  - The weighting used to fit a shape over an unevenly spaced divisor ladder needs to be fixed before
    the fit is run.
