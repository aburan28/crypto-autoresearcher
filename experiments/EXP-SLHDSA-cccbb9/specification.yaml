experiment:
  id: EXP-SLHDSA-cccbb9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-a7b433; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-a7b433
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Fill and injection-test a layer-by-property requirement matrix for a scaled-down SLH-DSA
    signer, reporting REQUIRED, NOT-REQUIRED and UNDETERMINED per cell alongside the measured per-layer
    failure matrix under single-property injections
  objective: 'The one uncertainty a run reduces is whether the phrase hash properties, which every
    SLH-DSA record in this repository uses collectively, decomposes into a finite per-layer attribution
    that a measurement can contradict. Concretely: (i) whether the declared d+2 by ten grid can be
    filled with three-valued cells such that every UNDETERMINED cell names a specific joint-call property
    that blocks it, which is a symbolic output and costs no compute; (ii) whether a toy hash violating
    exactly one declared property, with retention of the others verified by exhaustive enumeration
    rather than argument, causes above-floor forgery rates at exactly the layers the table marks REQUIRED
    for that property, measured against an ideal-random-oracle arm run in the same invocation; (iii)
    how large the disagreement set is between the symbolic table and the injection matrix, and whether
    the disagreements concentrate in the multi-target columns as the composition rule predicts. A
    run reduces uncertainty (i) to a completed artifact, (ii) to a per-cell agree/disagree/unreachable
    label with rates and seed spreads, and (iii) to three integers. The objective explicitly admits
    the outcome that the table and the injections disagree widely, which would be a measured obstruction
    against the whole property-attribution framing and is recorded as such rather than as a failure
    of the run.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: for the declared row and
      column lists, at a toy signer with the stated (h, d, a, k, w, output size), the requirement
      matrix as filled, together with the measured per-layer above-floor forgery rates under each
      verified single-property injection, their ideal-oracle null rates, and the resulting per-cell
      agreement labels with their seed spreads. WHAT DOES NOT FOLLOW: nothing about any FIPS 205 parameter
      set, nothing about SHA-2 or SHAKE or any concrete hash, no security level in bits for any scheme,
      no forgery, no attack, no statement that any parameter set is adequate or inadequate, no statement
      about what the literature contains, and nothing whatsoever about the fault or memory-corruption
      claim class. A REQUIRED cell validated at toy size is a statement about a toy signer, and its
      transfer to deployed parameters is an assumption stated in scale_justification, not a result.'
  inputs:
    procedure: 'STAGE 0, freeze (zero compute, ~3h human): write the row list, the column list, and
      the per-layer adversarial goal sentences into the contract before any cell is filled; register
      the structural floor for each layer analytically. STAGE 1, fill (zero compute, ~6h human): fill
      every cell as REQUIRED, NOT-REQUIRED or UNDETERMINED with a one-sentence reason and, for UNDETERMINED,
      the blocking joint property. STAGE 2, separating constructions (~2h compute): for each column,
      build a candidate hash on 16-bit outputs violating that column only; verify retention of the
      other columns by full enumeration of 2^16 inputs; record UNSEPARABLE columns. STAGE 3, instrument
      (~4h human, minutes compute): build the toy signer with a pluggable hash interface, plus the
      lazily sampled ideal-oracle backend; clear it against the mutation battery of the companion
      tooling entry. STAGE 4, injection (~4h compute): for each separable column, run the per-layer
      forgery battery at 10^4 attempts per layer per arm per seed, three seeds, signal and ideal-oracle
      arms in one invocation, plus the label-permutation control. STAGE 5, adjudicate (zero compute):
      cross STAGE 1 against STAGE 4, emit agreement/disagreement/unreachable counts and the superseding
      notes for any wrong cell.'
    instrument: Python 3.11 only. hashlib for the concrete toy hash backends (SHA-256 truncated to
      16 bits and SHAKE-128 truncated to 16 bits), secrets and a seeded random.Random for the lazily
      sampled ideal-oracle backend, itertools for the exhaustive retention enumerations, and numpy
      for the rate and confidence-band arithmetic. The signer is a new module under harness/ following
      the existing single-file module convention of harness/rho.py and harness/toycurve.py, executed
      through harness/runner.py so that the run manifest records the resolved inference block, seeds
      and parameters. Ledger and contract validation via tools/validate_ledger.py. No Sage, no external
      cryptographic library, no network access.
    parameters: 'Toy signer: hash output n in {12, 16} bits; hypertree height h in {4, 6}; layers
      d in {1, 2}; FORS a in {2, 3}, k in {2, 3, 4}; Winternitz w in {4, 16}. Rows: 10 structural
      layers. Columns: 10 declared properties. Injections: one per separable column. Forgery battery:
      10^4 attempts per layer per arm per seed. Seeds: 3 independent. Arms per injection: signal,
      ideal-oracle null, label-permutation control. Retention enumerations: full 2^16 domain per separating
      construction. Total toy hash evaluations bounded above by 10 columns x 10 layers x 3 arms x
      3 seeds x 10^4 attempts x (a few hundred hash calls per attempt), capped in the contract at
      10^11 evaluations with a hard wall-clock stop.'
  controls:
  - 'Ideal-random-oracle arm: the identical signer with every tweakable-hash call answered by a lazily
    sampled independent oracle keyed by its address, executed in the same invocation as the signal
    arm.'
  - 'Label-permutation control: inject property P and watch the layers whose cells say REQUIRED for
    a different property Q; mismatched pairs must show the structural floor.'
  - 'Retention verification: for each separating hash, exhaustive enumeration of the toy domain to
    confirm the properties it is supposed to retain are retained at that size.'
  - 'Floor calibration: for each layer, the guessing rate at that layer''s output size computed analytically
    and confirmed by a no-injection arm.'
  - 'Seed control: every arm repeated at three independent seeds, with the between-seed spread reported
    alongside every rate.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical STAGE C injection battery is run against a toy signer
    whose every tweakable-hash call is answered by a lazily sampled independent random oracle keyed
    by its address, in the same invocation and with the same transcript, seeds, and forgery budget.
    In that arm no declared property is violated, so the null must show a per-layer forgery success
    rate statistically indistinguishable from the structural floor (the rate a forger achieves by
    guessing at the layer''s output size), for every layer and every injection slot. If any layer
    in the null arm shows a rate above its floor, the battery is detecting the harness rather than
    the property and no cell in the table may be adjudicated. A second null permutes the injection
    labels: property P is injected while the layers whose cells say REQUIRED for a different property
    Q are watched, and the mismatched pairs must show the floor rate.'
  independent_variables:
  - injected property column
  - structural layer under attack
  - arm (signal / ideal-oracle null / label-permutation)
  - toy parameter set (n, h, d, a, k, w)
  - seed
  metrics:
    primary:
    - per-cell table value with reason and, for UNDETERMINED, the named blocking joint property
    - per-layer above-floor forgery rate under each injection, signal arm
    - per-layer above-floor forgery rate, ideal-oracle null arm
    - per-cell agreement label in {agree, disagree, unreachable}
    - count of UNSEPARABLE columns with reasons
    secondary:
    - between-seed spread of every rate
    - distinct tweaks materialized per signature in the toy signer
    - wall-clock and hash-evaluation counts per arm
    - label-permutation control rates
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The per-layer above-floor forgery rate in the ideal-random-oracle null arm, for every
      layer, every injection slot and every seed.
    formula: 'Predicted value zero within the binomial confidence band: for 10^4 attempts the one-sided
      99 percent band on an above-floor excess of zero is approximately 5.3e-4, so the pre-registered
      prediction is that every null-arm above-floor rate lies below 5.3e-4. Above-floor rate is defined
      as (observed success rate) minus (structural floor), where the structural floor for a layer
      with effective output size m bits and t attempts per forgery is 1 - (1 - 2^{-m})^t, computed
      analytically in STAGE 0 and frozen before any run.'
    source: Pre-registered in the parent proposal IDEA-20260816-a7b433 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at n in {12,16} bit hash outputs, h in {4,6}, d in {1,2}, a in {2,3}, k
      in {2,3,4}, w in {4,16}. These are chosen as the smallest parameters at which every promotion
      step present in a deployed hypertree appears at least once, and at which the retention enumerations
      are exhaustive rather than sampled. The transfer assumption, stated and not established: that
      the per-layer property attribution is a function of the composition structure and not of the
      output size, so that a cell validated at 16-bit outputs holds at deployed output sizes. That
      assumption is exactly what a disagreement in STAGE 5 would attack, and no result is reported
      as a statement about any deployed parameter set under AGENTS.md rule 4.'
    correspondence: null
  tail_checks:
  - Recompute every reported rate at a second, independently written implementation of the toy signer
    and require agreement within the seed spread.
  - Check that each separating construction violates its column at the predicted rate and no other
    column at above-floor rate, by exhaustive enumeration.
  - Check that the ideal-oracle backend, run against a second independently seeded copy of itself,
    produces no above-floor rate on any metric.
  - Check that the number of distinct tweaks materialized per signature matches the value computed
    structurally in STAGE 0.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and adjudicate nothing if the ideal-oracle null arm shows any above-floor rate exceeding
    the pre-registered band.
  - Stop the injection stage for a column as soon as its separating construction fails retention verification,
    and record the column UNSEPARABLE.
  - Hard wall-clock stop at 24 CPU-hours; a stop is an infrastructure outcome and is never reported
    as negative mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A completed three-valued matrix with every cell filled and every UNDETERMINED
    cell naming its blocking joint property, together with a per-cell agreement label for every cell
    an injection could reach, a clean ideal-oracle null arm, and the disagreement set reported as
    an explicit list rather than a summary.
  falsification_criterion:
  - 'The ideal-oracle null arm shows above-floor rates: no cell may be adjudicated and the run reports
    an instrument failure.'
  - 'More than half the columns are UNSEPARABLE at toy size: the injection validation cannot carry
    the table and the run reports a symbolic table with its validation gap.'
  - 'The label-permutation control matches the matched pairs: the observable carries no property information.'
  - Two independent implementations disagree on the STAGE 4 matrix beyond the seed spread.
  - 'A REQUIRED cell shows no above-floor rate at the full attempt budget: that cell reverts to UNDETERMINED
    with the budget recorded.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-a7b433
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The row list is written from RQ-SLHDSA-001 and H-SLHDSA-3a403a, both of which record their own
    structural claims as UNVERIFIED against primary text; a Coordinator must decide whether the audit
    proceeds on that basis with the caveat carried into every artifact, or blocks on filing a primary
    source as a KN-LIT entry.
  - The column list needs a Coordinator ruling on whether multi-target and single-target versions
    of each property are separate columns (doubling the grid) or one column with a quantifier annotation;
    the injection dynamic range depends on this choice.
  - Whether the structural floor formula in prereg_formula is the right floor for the compression
    layers, where an adversary has more than one target per attempt, must be settled before freezing.
  - The per-layer attack isolation in STAGE 4 holds the other layers ideal, which is an idealization;
    a Coordinator must approve it explicitly as a stated limit rather than let it enter silently.
