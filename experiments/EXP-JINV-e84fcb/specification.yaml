experiment:
  id: EXP-JINV-e84fcb
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-477e40
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: Decide, by exact symbolic support computation rather than by timing, whether setting a=0
    (j=0) or b=0 (j=1728) in the Semaev decomposition system is a DEGREE reduction, a SUPPORT/COEFFICIENT
    reduction, or NOTHING - with the m=2 answer pre-registered as "nothing after specialisation" and
    the m=3 answer pre-registered as "support restricted to total-x-degree 0 mod 3 for a=0, with per-variable
    degree unchanged at 4"
  status: draft
  objective: "(A) WHAT IS ACTUALLY SIMPLER. The third summation polynomial for y^2 = x^3 + a x + b\
    \ (KN-TECH-002, harness/semaev.py:s3_expr) is\n  S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) +\
    \ 2b) x3\n        + ((x1 x2 - a)^2 - 4 b (x1+x2)).\nExpanded, it carries exactly 13 monomials\
    \ in (x1,x2,x3). Setting a=0 kills the four monomials whose coefficient is a multiple of a or\
    \ a^2 (namely x1x3, x2x3, x1x2 and the constant), leaving 9. Setting b=0 kills the three monomials\
    \ with coefficient -4b (namely x3, x1, x2), leaving 10. Per-variable degree is 2 in every case;\
    \ total degree is 4 in every case. So on the UNSPECIALISED polynomial the effect is a 31 percent\
    \ (a=0) or 23 percent (b=0) support reduction and NOT a degree reduction. [derived in this record\
    \ by hand; to be re-verified symbolically as the experiment's first act, and treated as a pre-registered\
    \ prediction, not as a measurement.]\n(B) THE PART THAT MATTERS IS THE SPECIALISED SYSTEM, AND\
    \ THERE THE EFFECT APPEARS TO BE ZERO. Index calculus never solves S_3; it solves S_3(x1, x2,\
    \ x_R) with x_R the target's x-coordinate, together with factor-base membership. Collecting coefficients\
    \ of the 9 surviving monomials in (x1,x2):\n  1        : a^2 - 4 b x_R\n  x1, x2   : -2 a x_R\
    \ - 4 b\n  x1x2     : -2 x_R^2 - 2a\n  x1^2,x2^2: x_R^2\n  x1^2x2, x1x2^2 : -2 x_R\n  x1^2x2^2\
    \ : 1\nFor generic x_R and b != 0 the a=0 specialisation leaves ALL NINE coefficients nonzero;\
    \ for a != 0 the b=0 specialisation likewise. Therefore THE SPECIALISED SYSTEM AT m=2 HAS IDENTICAL\
    \ SUPPORT, IDENTICAL NEWTON POLYGON AND IDENTICAL BKK BOUND ON j=0, j=1728 AND GENERIC CURVES.\
    \ The a=0 / b=0 simplification is invisible to any solver whose cost is a function of the support.\
    \ That is the answer \"NOTHING\", stated in advance and falsifiable by one sympy call.\n(C) THE\
    \ PART THAT IS GENUINELY OPEN, AND WHY. S_3 restricted to a=0 is WEIGHTED-HOMOGENEOUS of weight\
    \ 4 under deg(x_i)=1, deg(b)=3; restricted to b=0 it is weighted-homogeneous of weight 4 under\
    \ deg(x_i)=1, deg(a)=2. [derived here; verifiable by inspection of the nine/ten monomials.] Because\
    \ the resultant of two weighted-homogeneous polynomials is weighted- homogeneous, S_4 = Res_t(S_3(x1,x2,t),\
    \ S_3(x3,x4,t)) inherits weight 2*4 + 2*4 - 2*2*1 = 12. Setting u = zeta_3 (so u^3 = 1 and b is\
    \ fixed) gives S_4|_{a=0}(zeta x1, ..., zeta x4) = zeta^{12} S_4|_{a=0} = S_4|_{a=0}: S_4 on a\
    \ j=0 curve is INVARIANT under the diagonal mu_3 action, so its support is confined to monomials\
    \ of total x-degree congruent to 0 mod 3. That is a factor-approximately-3 support restriction\
    \ that has no analogue on a generic curve. Whether it survives the specialisation x4 := x_R -\
    \ which breaks the diagonal action, because x_R is a constant - is the single open question this\
    \ proposal exists to answer.\n(D) WHAT IS BEING CLAIMED BEYOND THE sqrt(|Aut|) CONSTANT: NOTHING.\
    \ Per KN-TECH-018 the automorphism discount is a constant at most sqrt(6) and never an exponent.\
    \ This proposal claims no speedup of any kind. Its output is a set of exact integers (monomial\
    \ counts, Newton polytope vertices, BKK mixed volumes, Groebner solving degrees) that either license\
    \ or forbid every downstream L3 claim about \"the equation is simpler on j=0 curves\". It is filed\
    \ as BASELINE CALIBRATION, not as an attack.\n(E) THE THREE OUTCOMES, EACH WITH ITS MEANING FIXED\
    \ IN ADVANCE.\n  O1 DEGREE REDUCTION. Per-variable or total degree of the specialised\n    system\
    \ drops at a=0 or b=0, or S_4|_{a=0} FACTORS over F_p into pieces\n    of strictly lower degree.\
    \ This would be the first genuine structural\n    gain in L3 and would move the lane from calibration\
    \ to target. Predicted\n    probability: low, because the leading coefficients of S_3 in t\n \
    \   ((x1-x2)^2 and (x3-x4)^2) contain neither a nor b, so the t-degree and\n    hence the resultant\
    \ degree cannot drop.\n  O2 SUPPORT REDUCTION ONLY. Support and BKK shrink (predicted: by about\
    \ a\n    third on unspecialised S_3, by about two thirds on unspecialised S_4 at\n    a=0 via\
    \ the mod-3 grading) while per-variable degree and measured\n    Groebner solving degree do not.\
    \ Meaning: a constant-factor arithmetic\n    saving in building the Macaulay/F4 matrices, bounded\
    \ by the support\n    ratio, with no exponent movement.\n  O3 NOTHING. Specialised support, Newton\
    \ polygon, BKK and solving degree\n    are identical to generic. Meaning: the a=0 / b=0 \"simplification\"\
    \ is an\n    artifact of how S_3 is written, and every L3 argument that leans on\n    \"the equation\
    \ is simpler\" is void. This is the predicted outcome at m=2."
  resource_label: 'R2 - the curve equation (a,b) and the polynomial system it induces. This is the
    resource, not the group: nothing here applies any map to a point of G.'
  admissibility: admissible
  admissibility_argument: 'The measured objects are the monomial support, Newton polytope, BKK mixed
    volume and Groebner solving degree of a polynomial system over F_p. None of these is a group-operation
    output, so the H-ENDO-001 scalar-action argument does not apply: that argument says every endomorphism
    acts on the prime-order G as multiplication by a scalar, which constrains what can be done WITH
    POINTS OF G and says nothing about the shape of the equation whose solutions those points are.
    The KN-FIND-b7e091 GGM closure likewise bounds oracles simulable by group operations and equality
    tests; the coefficient vector of S_3 is field data the generic-group oracle does not return (DECOMPOSITION.md
    section 2, resource R1/R2). Admissible - and admissible is not the same as useful; see (D).'
  reachability_gate: 'NOT APPLICABLE AS A WALK - this proposal fixes the curve and performs no isogeny
    step, so T5 imposes no cost. But T4 is binding on how the result may be read: j = 0 requires D_0
    = -3 and j = 1728 requires D_0 = -4, so a curve whose isogeny class does not already contain such
    a curve CANNOT BE WALKED TO ONE AT ANY PRICE. Consequently, even outcome O1 would apply only to
    curves already in a D_0 = -3 or D_0 = -4 class and would confer nothing on any other curve. This
    limit is stated here so that no downstream record can read a positive result as generally applicable.'
  inputs:
    procedure: THE CHEAPEST VALID DISCRIMINATOR IS STEP 1 ALONE, AND IT COSTS SECONDS. Symbolically
      specialise S_3(x1,x2,x_R) over Q[a,b,x_R], collect in (x1,x2), list the nine coefficients, and
      check which vanish identically at a=0 and at b=0. If none vanish, the lane's premise "the equation
      is genuinely simpler on a=0 curves" is FALSE at m=2 and every downstream claim in this batch
      that leans on it is void without any compute at all. Steps 0, 2, 3, 4 add the m=3 answer for
      minutes more. Only Step 6 costs real compute, and it is run only if Steps 1-5 produce a nonzero
      gap worth chasing.
    mechanism: 'STEP 0 (minutes, symbolic, ZERO risk). Re-derive (A) mechanically: sympy.Poly(s3_expr(a,b),
      x1,x2,x3) over Q[a,b], count monomials; substitute a=0 and b=0; count again. Assert 13 / 9 /
      10. A mismatch means the hand derivation in (A) is wrong and everything downstream is re-based
      on the machine numbers before anything is reported.

      STEP 1 (minutes). Specialise x3 := x_R symbolically over Q[a,b,x_R], collect in (x1,x2), and
      record which of the 9 coefficients vanish identically under a=0 and under b=0. Assert: none,
      for generic x_R. This is the (B) prediction and it is the cheapest possible test of the lane''s
      premise.

      STEP 2 (minutes). Verify the weighted-homogeneity in (C): check that S_3|_{a=0} is homogeneous
      of weight 4 with deg(b)=3 and S_3|_{b=0} is homogeneous of weight 4 with deg(a)=2, by evaluating
      the weight of every monomial.

      STEP 3 (minutes to an hour). Compute S_4 = Res_t(S_3(x1,x2,t), S_3(x3,x4,t)) generically (harness/semaev.py
      already has s4_expr), then at a=0 and at b=0. Record: per-variable degree, total degree, monomial
      count, and - for a=0 - the distribution of total x-degree mod 3. Assert per-variable degree
      4 in all three cases and, at a=0, support confined to x-degree congruent to 0 mod 3.

      STEP 4 (minutes). Attempt sympy.factor on S_4, S_4|_{a=0}, S_4|_{b=0} over Q and over F_p for
      three declared primes. A factorisation at a=0 that does not occur generically is outcome O1
      and is the one interesting event; report it and stop, because it would need independent verification
      before anything else in this lane is run.

      STEP 5 (hours). Newton polytope vertices and BKK mixed volume for the specialised systems at
      m=2 and m=3, generic vs a=0 vs b=0, computed on the identical code path.

      STEP 6 (hours). The empirical arm, and the only one that costs real compute: on matched toy
      instances (see minimal_test), run the existing harness/semaev.py Groebner measurement on the
      three curve families and record groebner_basis_max_degree, groebner_basis_size and groebner_seconds.
      These are implementation-bound proxies and harness/semaev.py''s own docstring says so; they
      are reported as proxies and never as the degree of regularity.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - generic-j curve at the same p, same factor-base size, same target
  - 'representation null: the same j=0 curve written with b replaced by u^6 b for three declared u,
    which must give identical everything'
  - 'nearby-object control: a curve with a,b both nonzero but b a sixth power, on which no support
    change may be reported'
  - 'degenerate stratum measured separately: x_R = 0 on a j=0 curve with b a square, where the coefficient
    list genuinely does collapse'
  - frozen fixture reproducing harness/semaev.py's s3_expr and s4_expr term for term before any specialisation
    is computed
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. Matched null: a GENERIC-j curve at the
    same prime p, with (a,b) both nonzero, drawn from the same generator, measured on the identical
    code path at the identical factor-base size. The comparison is generic vs a=0 vs b=0 and never
    a=0 against nothing. DECAY PARAMETER: the arity m. A support/BKK gap at a=0 that does NOT grow
    with m is a coefficient-writing artifact and not structure - because the mod-3 grading argument
    in (C) predicts the gap to grow (weight 4 at m=2, weight 12 at m=3, weight growing with m), while
    a fixed-size gap is what a bookkeeping artifact looks like. A gap that is constant in m is the
    canonical artifact tell of docs/inventor-protocol.md section 3 and must be reported as such. SECOND
    NULL (representation null, and it is the sharp one): the SAME j=0 curve written with a different
    b. Over F_p, b and u^6 b give F_p-ISOMORPHIC curves for any u in F_p^*, hence identical ECDLP
    and identical everything intrinsic. Any support, BKK or solving-degree difference between b and
    u^6 b is measuring the representative, not the curve, and voids the instrument.'
  independent_variables: []
  metrics:
    primary:
    - monomial count and full support list, per (m, specialisation)
    - per-variable degree and total degree, per (m, specialisation)
    - Newton polytope vertex list and BKK mixed volume, per (m, specialisation)
    - distribution of total x-degree mod 3 for S_4|_{a=0}
    secondary:
    - factorisation result over Q and over each declared F_p
    - sympy Groebner max-degree proxy, basis size, wall time, per (curve family, seed, factor-base
      size), labelled implementation-bound proxy
    - pass/fail of every control above
  heuristic_under_test: null
  preregistered_prediction:
    quantity: monomial count of unspecialised S_3 over Q[a,b], generic / a=0 / b=0
    formula: Exactly 13 / 9 / 10. Any other triple falsifies the derivation in (A) and the record
      is superseded rather than amended.
    source: pre-registered in IDEA-20260807-477e40 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - MONOMIAL COUNT IS NOT SOLVING COST. A system with fewer monomials can be harder to solve. Every
    reported count is accompanied by the BKK bound and by the empirical proxy, and no count is reported
    as a cost.
  - SYMPY IS NOT F4. groebner_basis_max_degree is a property of the returned reduced basis, not the
    maximum degree reached during computation. A difference in this proxy without a support/BKK difference
    is a solver artifact.
  - SPECIALISATION ORDER. Specialising x_{m+1} := x_R before versus after taking the resultant can
    give different intermediate supports. The order is frozen before Step 3 and stated with every
    number.
  - SMALL p. At p < 2^10 accidental coefficient collisions mod p can shrink support for reasons unrelated
    to a=0. All support work is done over Q[a,b] first and only then reduced mod each declared p,
    and the two are reported separately.
  - COORDINATE CHOICE. Everything here is short Weierstrass. Lane L11 (RQ-MODEL-e61cb2) owns the model
    question and a support result in one model does not transfer to another.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 13 / 9 / 10. Any other triple falsifies the derivation in (A) and the
    record is superseded rather than amended.
  falsification_criterion:
  - The 13/9/10 counts are wrong. The derivation in (A) is false; supersede this record before proceeding.
  - Any of the nine specialised coefficients in (B) vanishes identically at a=0 or at b=0 for generic
    x_R. Prediction (B) is false and the lane gains a target; this must be independently replicated
    before it is used.
  - S_4|_{a=0} has a monomial of total x-degree not congruent to 0 mod 3. The weighted-homogeneity
    argument in (C) is false as stated.
  - 'The representation null fires: b and u^6 b give different support, BKK or solving degree. The
    instrument is measuring the representative and every number it produced is void.'
  - The resultant at m=3 exceeds the memory budget before any support is resolved. That is an INFRASTRUCTURE
    outcome under AGENTS.md rule 5, recorded as such, and is not evidence about support.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-477e40
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
