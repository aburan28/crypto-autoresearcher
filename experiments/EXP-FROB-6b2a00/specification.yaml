# EXP-FROB-6b2a00
# Normal-basis squaring rotation on F_2^5, plus a polynomial-basis control.
# Approved by DEC-20261001-3dfd17.
experiment:
  id: EXP-FROB-6b2a00
  hypothesis_id: H-FROB-080bd0
  source_idea: IDEA-20260926-197ecf
  question_id: RQ-FROB-7d8dd4
  version: 1
  title: Normal-basis squaring rotation on F_2^5
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-3dfd17
  objective: >-
    On F_2[x]/(x^5+x^2+1), build the normal basis of successive squares of
    3 and check that squaring rotates coordinates as (c4, c0, c1, c2, c3).
    Count the opposite rotation and the same rotation on polynomial-basis
    bits. Reject a report of zero polynomial-basis failures.
  inputs:
    modulus_integer: 37
    modulus_low_to_high: [1, 0, 1, 0, 0, 1]
    seed: 3
    basis_order: successive_squares
    predicted:
      orbit: [3, 5, 17, 12, 26]
      rank: 5
      square_rotation: [c4, c0, c1, c2, c3]
      square_rotation_matches: 32
      opposite_rotation: [c1, c2, c3, c4, c0]
      opposite_rotation_matches: 2
      polynomial_basis_failures: 30
      failure_example: 1
  controls:
    - >-
      Zero polynomial-basis failures is false. Reporting that count as 0
      invalidates the run.
    - >-
      The opposite rotation matching all 32 elements is false. Reporting
      that match invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - route in {normal_basis, repeat_module}
    - coordinate system in {normal_basis, polynomial_basis}
  metrics:
    primary:
      - orbit
      - rank
      - square_rotation_matches
      - opposite_rotation_matches
      - polynomial_basis_failures
      - failure_example_is_1
      - implementations_agree
    secondary:
      - modulus_irreducible
  heuristic_under_test: null
  preregistered_prediction:
    quantity: One orbit, one rank, and three counts on a 32-element field.
    formula: >-
      Square coordinates (c4, c0, c1, c2, c3) in basis order
      [a, a^2, a^4, a^8, a^16]. Opposite rotation matches 2. Polynomial-basis
      bits fail that rotation on 30 elements.
    source: >-
      IDEA-20260926-197ecf claim paragraphs A and B, read 2026-10-01. The
      F_2^5 table was computed in this design session with a short field
      script. That computation is not a run. No relation was counted.
  scale_relevance:
    tier: toy
    justification: One field of 32 elements. No transfer to n = 17, n = 19, or ECC2K-130.
    correspondence: null
  tail_checks:
    - The integer 1 is a required failure example. Omitting it and still reporting 30 failures is invalid.
  replication:
    seeds: []
    independent_instances: 32
    replication_note: Deterministic. The second run is the other arithmetic module.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If polynomial_basis_failures is 0, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - polynomial_basis_failures is 0.
    - opposite_rotation_matches is reported as 32.
    - An m! count, a summation polynomial, or a solve at n = 17 or n = 19 is reported.
  success_criterion: >-
    Both runs agree, the orbit is 3, 5, 17, 12, 26, the rank is 5, the
    square rotation matches 32 elements, the opposite rotation matches 2,
    the polynomial basis fails on 30 elements including the integer 1, and
    the modulus is reported irreducible.
  falsification_criterion: >-
    The runs agree, polynomial_basis_failures is positive,
    opposite_rotation_matches is not 32, and any orbit entry, the rank, the
    square-rotation count, the opposite-rotation count, the failure count,
    or the status of integer 1 differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-FROB-6b2a00/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-FROB-6b2a00/runs/<RUN-ID>/command.txt
    - experiments/EXP-FROB-6b2a00/runs/<RUN-ID>/stdout.log
    - experiments/EXP-FROB-6b2a00/runs/<RUN-ID>/stderr.log
    - experiments/EXP-FROB-6b2a00/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-FROB-6b2a00/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Relation counts, summation polynomials, and solves at n = 17 or n = 19.
    - Any ECC2K-130 budget column.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
