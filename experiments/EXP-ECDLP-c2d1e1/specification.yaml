experiment:
  id: EXP-ECDLP-c2d1e1
  hypothesis_id: H-ECDLP-5f6028
  question_id: RQ-DREG-001
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    VERIFICATION PROTOCOL AND REPAIR - the T11 null constructs a degree-histogram
    match, not a support match, and the literal fix is degenerate over GF(2) - a
    blocking degeneracy declaration, forced column-count gates, a full-support
    calibration, a swept planted rank defect, and a memory measurement that can
    fail

  objective: >-
    If separately approved, authorized and executed, establish whether the null
    construction the lane calls T11 matches the Semaev system's monomial SUPPORT
    or only its per-equation DEGREE HISTOGRAM, correct it toward a genuinely
    support- or block-restricted construction, and measure whether the correction
    reduces the null arm's peak memory. Two competing explanations are
    discriminated, and BOTH are reportable - the memory excess is dominated by
    the column count and the fix reduces it, or the memory excess is dominated by
    something column-count-independent and the fix corrects admissibility while
    barely moving memory.

  verification_protocol:
    artifact_checked: >-
      The null-construction function in src/h012_peel_rank.py, and the column
      counts and peak memory of the null arm at the lane's instrumented cells.
    reference_checked_against: >-
      (1) RQ-DREG-001's own declared reference, which names the null verbatim as
      a "T11-certified support-matched semi-regular null as the reference", and
      H-DREG-001's assumption, verbatim, that "The T11 null has identical
      monomial support / degree profile with only coefficients randomized (the
      miscalibrated D6 null is excluded)".
      (2) The lane's forced column counts for a support-matched null at the cheap
      cells, which are exact integers with zero tolerance and are RE-DERIVED
      NUMERICALLY at Stage 1 rather than taken on trust.
      (3) The committed calibration that a full-support null attains the
      semi-regular prediction exactly.
    result_that_would_fail_it: >-
      A strict support-copy null whose column count does NOT equal the Semaev
      column count exactly at a cheap cell. Either the column identity or the
      construction is wrong, and the discrepant monomial must be exhibited.
    what_a_pass_means: >-
      A pass establishes that the corrected construction matches the declared
      reference on the one property that is checkable before any rank is
      computed. It establishes NOTHING about the degree of regularity in either
      direction.

  what_this_is_not:
    - Not a degree-of-regularity measurement. The cells reached sit below the relevant degrees and no such conclusion follows in either direction.
    - Not a resolution of any hypothesis's status, and not a completion rung for any goal.
    - Not a silent replacement of a committed rank. A corrected null is a DIFFERENT OBJECT and any rank under it is a NEW measurement.
    - Not a statement about elliptic curves or the ECDLP. The object measured is a boolean polynomial system and a null-model choice inside a Macaulay pipeline.
    - Not an edit of src/h012_peel_rank.py. The corrected generator lives beside it.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is - at the cells actually reached, the current null
    construction does or does not match the Semaev support, a corrected
    construction gives a stated column count, and the corrected null arm's peak
    memory is a stated value against the current construction's re-measured
    baseline. It cannot support a statement about degree of regularity, about
    larger cells, about prime fields, or about any cost.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) STAGE 0 DECLARES THE LITERAL FIX DEGENERATE. Over GF(2) a monomial
    present in the support has 1 as its only nonzero coefficient, so a strict
    "support fixed, coefficients randomized" null reproduces the Semaev system
    exactly, the treatment and the null coincide, and the discriminator has width
    zero. The strict copy is therefore run ONLY as a column-identity check and is
    declared inadmissible as a null.
    (2) The strict support copy's column count equals the Semaev column count
    EXACTLY at every cheap cell, zero tolerance. The block-restricted variant's
    count lies strictly between the Semaev count and the current construction's
    count.
    (3) The full-support calibration returns deficit exactly 0 at the cheap
    cells.
    (4) A planted syzygy of known multiplicity reaches at least its pre-computed
    forced deficit bound at every swept multiplicity, increasing with it.
    (5) The block-restricted null's seed spread is strictly greater than 0 and
    strictly less than a quarter of the deficit under study.
    (6) Peak memory of the corrected arm at the stretch cell is lower than the
    re-measured baseline, or it is not - no direction is forced, and both answers
    discriminate the two explanations.

  measured_quantities:
    - name: ncols
      definition: >-
        Number of distinct monomials in the Macaulay column set of a given
        construction at a given cell.
      units: monomials (dimensionless integer)
    - name: rank_exact
      definition: >-
        Exact GF(2) rank of the degree-D Macaulay matrix, computed as the sum of
        per-chunk new pivots with the per-chunk table retained so the total is
        auditable.
      units: rank (dimensionless integer)
    - name: deficit
      definition: The semi-regular prediction at that cell minus rank_exact.
      units: rank (dimensionless integer)
    - name: seed_spread
      definition: >-
        max minus min of rank_exact over the corrected null's seeds at a cell.
        REPORTED BEFORE ANY COMPARISON TO A SEMAEV RANK.
      units: rank (integer)
    - name: peak_rss
      definition: >-
        Peak resident set size of the null arm's prepare phase at a cell, under
        conditions identical to the baseline re-measurement.
      units: gibibytes
    - name: planted_deficit
      definition: >-
        Measured deficit after planting a syzygy of known multiplicity, against
        its pre-computed forced lower bound.
      units: rank (integer)
    - name: support_source
      definition: >-
        Whether the corrected construction used the Semaev system's own
        per-equation supports (PREFERRED) or a derived block template (FALLBACK).
      units: categorical

  metrics:
    primary: [ncols, rank_exact, deficit, seed_spread, peak_rss]
    secondary: [planted_deficit, support_source]

  null_and_control_objects:
    - id: GATE-DEGENERACY
      name: Stage 0 declaration that the literal fix is degenerate over GF(2)
      construction: >-
        Construct the strict per-equation support copy and compare it, system by
        system, against the Semaev system.
      forced_value: >-
        IDENTICAL. Over GF(2) the coefficient on a present monomial has one
        nonzero value, so a strict support copy IS the Semaev system.
      non_vacuity: >-
        THIS GATE IS THE CONTRACT'S FIRST DELIVERABLE, NOT A FORMALITY. It states
        in advance that the obvious repair produces a null whose comparison
        against the treatment has width exactly zero - the failure mode this
        control lane exists to prevent. If instead the constructed strict copy
        DIFFERS from the Semaev system, the construction is wrong and that is the
        finding.
      consequence: >-
        The strict copy is used ONLY as a column-identity check. The
        block-restricted variant, which draws monomials from the equation's own
        variable block and therefore retains genuine randomness, is the only
        admissible corrected null, and its randomness source is declared
        explicitly.
    - id: GATE-NCOLS
      name: forced column-count gate, blocking, minutes of cost
      construction: >-
        Build every arm's column set and compare its count to the lane's forced
        values, re-derived numerically at this stage rather than taken on trust.
      forced_value: >-
        Strict copy EXACTLY equal to the Semaev count; block-restricted strictly
        between the Semaev count and the current construction's count;
        full-support equal to the full degree-bounded monomial space.
      non_vacuity: >-
        Zero-tolerance integers, checkable before any rank or memory number
        exists, and a mismatch stops the run at minutes of cost. This is the
        cheapest decisive gate in the design.
    - id: NULL-FULLSUPPORT
      name: full-support calibration
      construction: >-
        The existing full-support random null at the cheap cells.
      forced_value: deficit EXACTLY 0
      non_vacuity: >-
        The instrument's calibration and it CAN fail. If it fails, the rank code
        is broken, no number from any arm is admissible, and NO negative may be
        reported from anywhere in the run.
    - id: PLANT-RANKDEFECT
      name: swept planted rank defect
      construction: >-
        Into the corrected null, force one equation to be the GF(2) sum of r
        others, r swept over at least 3 values, with the forced deficit lower
        bound computed before the run from the number of Macaulay rows that
        equation generates.
      forced_value: >-
        Measured deficit at least its forced bound at every r, increasing with r.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL. A rank routine that fires
        at one planted multiplicity has shown it detects PRESENCE; sweeping r
        forces it to track SIZE, which is what makes a later small measured
        deficit interpretable.
    - id: NULL-SPREAD
      name: corrected null seed spread
      construction: >-
        At least 5 independently seeded corrected nulls at the cheap cell.
      forced_value: >-
        Spread strictly greater than 0 and strictly less than a quarter of the
        deficit under study.
      non_vacuity: >-
        Both failure modes are real and both are stopped on. Zero spread means
        the coefficient sampler is not random and the corrected null is not a
        null at all; a quarter or more means the comparison at that cell is
        withdrawn and a distribution is reported instead of a share.

  scope_gate: >-
    DECLARED IN ADVANCE RATHER THAN DISCOVERED. Every number this experiment
    produces is a statement about a Macaulay construction and a null-model choice
    inside it. The measured object is a boolean polynomial system and its null;
    there is no elliptic-curve content anywhere in the measurement. NOTHING FROM
    THIS EXPERIMENT MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE
    ECDLP, and no degree-of-regularity conclusion follows from it in either
    direction.

  independent_variables: [cell, null_construction_variant, seed, planted_multiplicity]

  preregistered_prediction:
    quantity: ncols per corrected variant at the cheap cells, and peak_rss at the stretch cell
    formula: >-
      A null whose per-equation supports equal the Semaev system's has, by
      construction, the same Macaulay up-closure and therefore the same column
      count. The block-restricted variant's up-closure is a proper superset of
      the Semaev support's and a proper subset of the full space's, so its count
      lies strictly between.
    source: ledger/hypotheses/H-ECDLP-5f6028.yaml predictions P1 through P7
    values_frozen_here:
      strict_copy_ncols_rule: exactly equal to sem ncols at every cheap cell, zero tolerance
      block_restricted_ncols_rule: strictly between sem ncols and the current construction's ncols
      full_support_deficit: exactly 0 at the cheap cells
      seed_spread_admissible_range: strictly greater than 0 and strictly less than one quarter of the deficit under study
      planted_multiplicities: at least 3 values
      memory_material_threshold: 5 percent reduction from the re-measured baseline
      forced_ncols_provenance: re-derived numerically at Stage 1, never taken on trust

  decision_rule_that_falsifies: >-
    EXPLANATION 1 IS SUPPORTED IF the corrected construction's column count is
    confirmed lower and peak memory falls by more than the frozen threshold.
    EXPLANATION 2 IS SUPPORTED - and H-ECDLP-5f6028's memory expectation is
    rejected in scope - IF the column count is confirmed lower and peak memory
    changes by less than the frozen threshold. That is a valuable reportable
    negative, meaning the memory is dominated by something
    column-count-independent, and it must be stated as a result rather than as a
    disappointment.
    THE RUN IS INVALID, and no verdict of either kind may be reported, if the
    strict copy's column count misses the Semaev count at a cheap cell, if the
    full-support calibration is not exactly 0, if the planted sweep does not
    track r, or if the corrected null's seed spread is exactly 0.

  stages:
    - id: S0
      name: degeneracy declaration and support recovery
      terminates_run: false
      description: >-
        Declare GATE-DEGENERACY with the field argument stated explicitly. Attempt
        to recover the Semaev per-equation supports from a committed system
        artifact; declare PREFERRED or FALLBACK and record which on the face of
        every number. A FALLBACK result may NOT be described as support-matched.
        Record the environment probe verbatim.
    - id: S1
      name: column-count gate
      terminates_run: true
      description: >-
        Re-derive the forced column counts numerically, then run GATE-NCOLS on
        every arm at the cheap cells. A mismatch ENDS the run before any rank or
        memory number is produced, and the discrepant monomial is exhibited.
    - id: S2
      name: calibration and planted defect
      terminates_run: true
      description: >-
        NULL-FULLSUPPORT at the cheap cells and PLANT-RANKDEFECT at every swept
        multiplicity. Either failure ENDS the run and no arm is reported.
    - id: S3
      name: corrected null at the cheap cells
      terminates_run: false
      description: >-
        The block-restricted corrected null at the cheap cells over the declared
        seeds. Report NULL-SPREAD first, then any rank. Any rank recomputed here
        is a NEW measurement and is labelled as such.
    - id: S4
      name: stretch cell memory measurement
      terminates_run: false
      description: >-
        Re-measure the CURRENT construction's peak memory at the stretch cell
        under the identical conditions, then measure the corrected construction's
        peak memory at the same cell. Run only if S1 through S3 complete inside
        budget. If the cell exhausts memory or wall clock, that is
        failed_infrastructure and the cheap cells plus a resource receipt are the
        result.
    - id: S5
      name: verdict
      terminates_run: false
      description: >-
        Apply the frozen decision rule, report which explanation the memory
        measurement supports, and print the scope-gate statement on the face of
        the result.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 5
    seeds_per_cell: 5
    seeds_policy: >-
      Every constructed system is addressed by (arm_label, cell, seed_index,
      planted_multiplicity) and its seed is derived deterministically as a
      SHA-256 over the ASCII bytes of the domain string, those fields in that
      order, and the declared master seed, reduced to 64 bits. The domain string
      is EXP-ECDLP-c2d1e1/v1. Coefficients are drawn as independent uniform bits
      over the arm's support in sorted canonical monomial order; supports, where
      randomly drawn, are drawn without replacement in sorted index order. A
      third party reproduces every system bit-for-bit from the tuple. NO SEMAEV
      RANK IS RECOMPUTED - the Semaev side is read from committed artifacts and
      its provenance (run receipt, source comment, or unresolved) is a required
      reported field. The master seed is fixed in the frozen contract before any
      execution and is never re-drawn.
    determinism_requirement: >-
      Re-running any tuple must reproduce the identical system hash, the
      identical column-set hash and the identical rank. Any arm failing this is
      INVALID.

  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 120
    maximum_memory_gb: 16
    maximum_runs: 60
    maximum_workers: 1
    note: >-
      Sized to the work. The stretch cell dominates entirely and is the one most
      likely to exhaust the ceiling; the memory ceiling is set above the lane's
      recorded prepare-phase footprint precisely so that an exhaustion is
      informative rather than pre-ordained. If it exhausts anyway, that is
      infrastructure, not a result.

  stopping_rules:
    - Strict support copy's ncols does not equal the Semaev ncols exactly at a cheap cell -> STOP, exhibit the discrepant monomial, report the identity or the construction as wrong.
    - NULL-FULLSUPPORT deficit is not exactly 0 -> STOP, instrument broken, no arm reported, no negative admissible.
    - PLANT-RANKDEFECT does not reach its forced bound, or does not grow with r -> STOP, no demonstrated dynamic range.
    - Corrected null seed spread exactly 0 -> STOP that cell, degenerate ensemble, the corrected null is not a null.
    - Corrected null seed spread a quarter or more of the deficit under study -> the comparison at that cell is WITHDRAWN; report a distribution.
    - The stretch cell exhausts memory or wall clock -> STOP, report the cheap cells plus a resource receipt as failed_infrastructure.

  invalidation_rules:
    - Any result obtained under the FALLBACK support source that is described as support-matched is invalid.
    - Any rank recomputed here that is presented as a replacement for a committed rank, rather than as a NEW measurement, is invalid.
    - Any rank not equal to the sum of its per-chunk new pivots is invalid.
    - Any deficit reported without the seed spread reported first is invalid.
    - Any memory comparison against a baseline not re-measured under identical conditions in this same run is invalid.
    - Any conclusion about degree of regularity, cost, exponents, prime fields or cryptographic scale drawn from this contract is invalid on its face.
    - Any statement about elliptic curves or the ECDLP drawn from this contract is invalid on its face.
    - Any edit to src/h012_peel_rank.py under this contract is a scope violation; the corrected generator lives beside it and both hashes are recorded.

  success_criterion: >-
    ALL of - (a) GATE-DEGENERACY declared with its field argument and its
    consequence for the design; (b) GATE-NCOLS passes at every arm at every cheap
    cell against numerically re-derived forced values; (c) NULL-FULLSUPPORT
    returns deficit exactly 0; (d) PLANT-RANKDEFECT reaches its forced bound at
    every swept multiplicity and grows with it; (e) the corrected null completes
    at the cheap cells with a seed spread strictly inside its admissible range;
    (f) the stretch cell's peak memory measured for BOTH the current and the
    corrected construction under identical conditions, or its exhaustion recorded
    as infrastructure; (g) the frozen decision rule applied and the supported
    explanation named. Supporting EXPLANATION 2 - the fix corrects admissibility
    and barely moves memory - is a SUCCESSFUL run of this contract; only failing
    (a) through (f) is unsuccessful.

  falsification_criterion: >-
    Peak memory of the corrected null arm not meaningfully lower than the
    re-measured baseline despite a confirmed column reduction. The memory floor
    is then not mainly attributable to this construction defect, and the lane's
    sparsity and representation work becomes the primary lever. Secondary
    falsifiers of the DESIGN rather than the hypothesis - a column-count
    mismatch, a failed full-support calibration, a planted defect without dynamic
    range, or a degenerate corrected null. In every case the failing cell, arm
    and seed are named, and forward guidance names the next object.

  required_artifacts:
    - the GATE-DEGENERACY declaration with the GF(2) argument stated in full
    - the numerically re-derived forced column counts and the measured counts per arm per cell
    - results.json with ncols, rank, deficit, seed spread and peak RSS per arm per cell per seed
    - per-chunk pivot tables for every rank, summing to the reported rank
    - system hashes and column-set hashes per arm per seed
    - the declared support source (PREFERRED or FALLBACK) with its evidence
    - the Semaev-side provenance table (run receipt, source comment, or unresolved) per cell
    - planted-defect forced bounds and measured deficits at every multiplicity
    - the re-measured current-construction baseline memory and the corrected memory, side by side, with the identical conditions documented
    - the corrected generator as a separate file, with src/h012_peel_rank.py's hash recorded before and after and shown unchanged
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      Small boolean systems below the relevant degrees. Nothing transfers upward,
      and the contract fits no trend.
    correspondence: null

  limitations:
    - >-
      Removes a construction and admissibility defect from a null arm. NO
      DEGREE-OF-REGULARITY CONCLUSION FOLLOWS FROM IT in either direction.
    - >-
      Does not resolve any hypothesis's status and does not supply a completion
      rung for any goal.
    - >-
      A corrected null is a DIFFERENT OBJECT from the committed one. Any rank
      recomputed under it is a NEW measurement and is never a silent replacement
      of a committed value.
    - >-
      The committed lower-cell null result may already be affected by this same
      construction, in which case an existing evidence record's headline may need
      this as an additional named confound. THIS CONTRACT FLAGS THAT FOR REVIEW
      AND CHANGES NO EVIDENCE RECORD'S STATUS.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - the degrees at which the lane's actual solving-degree question
      lives are far above the cells reached here, and no fix to a null
      construction at these cells transfers upward.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing dependency, unrecoverable support or
    unresolvable committed rank is INFRASTRUCTURE SIGNAL, recorded as
    failed_infrastructure with its cause and its chunk coverage. It is NEVER
    negative mathematical evidence (AGENTS.md core rule 5). This clause is
    load-bearing here - this lane's recorded history includes destroyed
    checkpoints, host storage incidents and a large-memory stop, which is why
    chunking with per-chunk receipts is REQUIRED rather than advisory, so that a
    crash costs a chunk rather than a cell.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record, computes no Semaev rank, and does
    not modify src/h012_peel_rank.py. The forced column counts it gates on are
    taken from a hypothesis record the authoring agent read; the hypothesis where
    they are DERIVED was not opened, which is why S1 re-derives them numerically
    before using them.
