experiment:
  id: EXP-SNFS-7f4c98
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-046ca8; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-046ca8
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Forward census of the special-form prime class: exhaustive enumeration of bounded polynomials
    and bases, counted accidental base rate, symmetry-quotiented fibre distribution, and forward-backward
    cross-validation'
  objective: 'The one uncertainty a run reduces is the prevalence of the class C(d,H) among ordinary
    primes, which is the floor beneath every false-positive rate this campaign will report and which
    no record in this program currently holds. (i) What is beta: by exhaustively enumerating the forward
    map from bounded polynomials and admissible bases to primes below a bound, how many primes below
    that bound lie in the class, and what fraction of all primes below it is that, counted rather
    than estimated so that the number is exact for the enumerated range. (ii) Is the class uniform:
    what is the distribution of fibre sizes, that is how many essentially distinct witnesses each
    in-class prime carries once the derived trivial symmetries are quotiented out, since a class in
    which most members carry one witness poses a very different detection problem from one in which
    members carry many, and the campaign''s detectors are affected differently by each. (iii) Are
    the two directions consistent: does deciding membership backward, by sweeping the admissible base
    interval on a random sample of primes, reproduce the forward count within sampling error, which
    validates both the enumerator and the interval derivation the other contracts depend on, and localises
    the error if it does not.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for the enumerated
      box and range, the accidental base rate is exactly the counted value, the symmetry-quotiented
      fibre distribution is as reported, the counted value stands in the reported relation to the
      naive prediction, and forward and backward decisions agree to the reported precision. What does
      NOT follow: no detectability statement of any kind, no extrapolation of beta to sizes or boxes
      not enumerated, nothing about any real, published or deployed prime, and no security consequence
      whatever.'
  inputs:
    procedure: 'STAGE 0, zero compute: derive the analytic pair count, the naive prediction for beta,
      and the trivial fibre symmetries, and record them before the enumeration runs. STAGE 1, minutes:
      implement Horner evaluation, the enumerator and the witness dictionary, and validate the enumerator
      against a hand-enumerated tiny box. STAGE 2, tens of minutes: run the full enumeration per cell,
      accumulating primes and witnesses. STAGE 3, minutes: compute beta against pi(X) from a sieve-derived
      prime count, and the raw fibre distribution. STAGE 4, minutes: apply the symmetry quotient and
      audit it on a hand-checked fibre sample. STAGE 5, minutes: run the two nulls, the random-prime
      set and the random-filter variant. STAGE 6, tens of minutes: run the backward cross-validation
      on 10000 sampled primes using the derived admissible interval. STAGE 7, minutes: sweep H and
      d within the affordability boundary and record beta growth against the predicted factor. STAGE
      8: emit the census, the fibre distributions and the run manifest.'
    instrument: Pure Python 3.11 standard library only; numpy, sympy, gmpy2 and fpylll are absent
      here and Sage is excluded by contract. Horner evaluation in arbitrary-precision int, a sieve
      of Eratosthenes for pi(X) at the tested ranges, Miller-Rabin for the larger cells, dictionaries
      for the witness accumulation, itertools.product for the coefficient box. New module harness/snfs_census.py
      holds the enumerator, the fibre accounting, the symmetry quotient and the backward validator,
      reusing the interval derivation from harness/snfs_interval.py; harness/runner.py records the
      manifest.
    parameters: Range bounds X in {2^24, 2^27, 2^30}. Degrees d in {2, 3}. Coefficient bounds H in
      {4, 8, 16}, with the (d,H) cells restricted to those where (2H+1)^(d+1) times the base range
      stays below 5 times 10^8 evaluations. Bases m from 2 upward until |f(m)| exceeds X. Backward
      validation sample 10000 primes per (X,d,H) cell. Memory cap 4 GB, per-cell wall-clock cap 1800
      seconds.
  controls:
  - The random-prime-set null with identical fibre counting, which must show fibres of size one.
  - The random-filter null replacing primality at the same acceptance rate, isolating primality's
    contribution to fibre structure.
  - The forward-backward cross-validation on a random prime subsample.
  - An analytic pair-count check against the loop count, confirming the enumeration is complete.
  - A symmetry-quotient audit on a hand-checked sample of fibres, confirming the quotient removes
    exactly the derived symmetries and nothing else.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A random set of the same cardinality as the in-class prime population,
    drawn uniformly from the primes below X, subjected to the identical fibre-counting and identical
    downstream analysis. The null must show fibre sizes of exactly one for essentially every element,
    since a random prime has no reason to carry multiple witnesses, and it must reproduce the same
    population size by construction. If the in-class fibre distribution matches the null''s, then
    the class is behaving like a random set of the same size, beta is fully explained by counting
    alone, and no structural statement about the class is available from this measurement. That is
    a complete and honest outcome. A second null, the same enumeration with the primality filter replaced
    by a random filter of the same acceptance rate, isolates how much of the fibre structure comes
    from primality rather than from the polynomial box.'
  independent_variables:
  - range bound X
  - degree d
  - coefficient bound H
  - 'direction: forward enumeration or backward membership decision'
  metrics:
    primary:
    - in-class prime count and beta against pi(X)
    - raw and symmetry-quotiented fibre-size distributions
    - counted-to-predicted beta ratio
    - forward-backward agreement with sampling interval
    secondary:
    - beta growth factor under H and d steps against the predicted ((2H+3)/(2H+1))^(d+1)
    - enumeration loop count against analytic pair count
    - null fibre distributions for both controls
    - wall-clock seconds and peak memory per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: beta(X,d,H), the fraction of primes below X that lie in C(d,H), counted by exhaustive
      forward enumeration.
    formula: The naive prediction is beta_pred(X,d,H) = (number of admissible pairs with 0 < f(m)
      <= X) divided by (mean fibre size) divided by pi(X) times the density correction for primality
      among the enumerated values, where the admissible pair count is computed analytically at STAGE
      0 and the mean fibre size is set to 1 for the prediction. The prereg statement is that counted
      beta lies within a factor of 3 of beta_pred, with any larger discrepancy reported as a falsification
      of the naive model rather than of the census.
    source: Pre-registered in the parent proposal IDEA-20260816-046ca8 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Range bounds up to 2^30 and boxes up to (2H+1)^(d+1) of about 10^5 are used because
      complete forward enumeration is possible there, and completeness is the whole point: a counted
      beta is exact for its range while an estimated one would inherit the sampling error this measurement
      exists to eliminate. No transfer is claimed. beta depends on the box and the range through a
      formula that could be evaluated anywhere, but the specification permits reporting that formula
      only as a prediction validated at the enumerated cells and forbids quoting a beta value for
      any unenumerated cell.'
    correspondence: null
  tail_checks:
  - Inspect in-class primes with the largest quotiented fibres, which are the easiest to detect and
    skew any detector's apparent power.
  - Inspect primes near the top of the range, whose fibres are truncated by the bound X.
  - Inspect the smallest bases, which contribute disproportionately many values.
  - Check cells where the counted-to-predicted ratio is extreme for enumeration or filtering bugs.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Skip any (d,H,X) cell whose analytic pair count exceeds the 5 times 10^8 evaluation budget, recording
    it as out of budget rather than as unmeasured.
  - Stop a cell at its 1800-second cap and record it as budget-truncated, never as a count.
  - Abort if the loop count disagrees with the analytic pair count.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every in-budget cell reports an exact in-class count, beta against pi(X), raw
    and quotiented fibre distributions, the counted-to-predicted ratio, and a forward-backward agreement
    result, with both nulls executed in the same invocation.
  falsification_criterion:
  - Forward and backward counts disagree beyond sampling error.
  - The enumeration loop count disagrees with the analytic pair count.
  - The random-prime null shows fibres above size one at material rate.
  - The symmetry quotient audit finds the quotient removing elements the derived symmetries do not
    account for.
  - beta growth under the H sweep departs from the predicted factor without an identified structural
    explanation.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-046ca8
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The trivial fibre symmetries are asserted to be derivable but are not enumerated in this draft;
    a Coordinator must require the explicit list before the quotient is applied, since an incomplete
    list silently inflates the reduced fibre sizes.
  - The backward validator depends on the admissible-interval derivation from a sibling contract,
    and the approval order between the two must be settled.
  - The primality density correction in the naive prediction is stated loosely and needs a precise
    definition before the counted-to-predicted ratio can be interpreted as a test of anything.
