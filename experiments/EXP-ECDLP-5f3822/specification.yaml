    - Changing H-ECDLP-62befe, H-ECDLP-7253e7, H-ECDLP-7df817, H-ECDLP-92e64c, H-ECDLP-881d63, H-ECDLP-9a1388, H-ECDLP-7f5b05, H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Dispatching EXP-ECDLP-df601f from BATCH-5a5091
    - Designing IDEA-20260902-2327a5 as a Stage 0 duplicate of EXP-ECDLP-821bc5
    - Stealing IDEA-20260905-40aa90 or IDEA-20260905-3e9133

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_count_pass,
    known_false_asymmetric_pass,
    reject_invalid_pass, and
    null_empty_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not elliptic M_S
    and not an attack.

  falsification_criterion: >
    A certified KF miss of the
    not-symmetric and not-colliding
    gap after fixture_pass is a scoped
    miss of P-S0-SHIFT. A certified REAL
    identity miss after fixture_pass is
    a scoped miss of P-S0-SHIFT.
    Infrastructure bugs are not
    mathematics. Stage 0 does not
    test P-S1-METER.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
