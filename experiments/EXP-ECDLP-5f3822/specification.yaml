  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-a4ac47 under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    additive-group Kummer-fold iff calibrator at
    n=7. Elliptic M_S and the (L,b) meter are
    later stages and are not run here.

  objective: >
    Evaluate the exact boolean identity
    symmetric(S, n) equals
    collision(S, n) on one frozen
    family (REAL, KF, NULL) at n=7
    and decide whether the additive-
    group Kummer-fold calibrator
    works. Stage 0 does not form
    elliptic M_S and does not
    authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL is
      symmetric and colliding so iff
      is true; KF is not symmetric and
      not colliding so iff is true;
      NULL empty or |S|<2 rejected;
      n=0 rejected. Certificate kind
      none.
    formula: >
      toy_x(t) = min(t % n, (n-t) % n).
      symmetric(S, n) is true iff there
      exists c with S == {(c-s)%n for
      s in S}. M_S(x) is the frozenset
      of toy_x((x+s)%n) for s in S.
      collision(S, n) is true iff there
      exist distinct x, y with
      M_S(x) == M_S(y). The Stage 0
      iff is symmetric == collision.
      Frozen REAL: n=7, S={1,6},
      symmetric at c=0, colliding
      pairs (1,6), (2,5), (3,4).
      Frozen KF: n=7, S={1,2,4}, not
      a 2-set, not symmetric, all
      seven M_S values distinct.
      NULL is empty S or |S|<2.
      Invalid is n=0. FORCED Stage 0:
      fixture_pass, real_count_pass,
      known_false_asymmetric_pass,
      reject_invalid_pass,
      null_empty_pass all true.
    source: >
      ledger/proposals/IDEA-20260905-579fcc.yaml
      (M1) dichotomy as Stage 0
      hard-gate identity on toy_x.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260905-579fcc Stage 0 here is
    a disclosed tightening: the
    additive-group Kummer-fold iff at
    frozen n=7 only, not the proposal's
    elliptic M_S, not the (L,b) meter,
    not an Aut census. Exact boolean
    identities are the only Stage 0 arm.

  inputs:
    fixture:
      n_frozen: 7
      toy_x: min(t % n, (n-t) % n)
      real_shift:
        id: REAL
        S: [1, 6]
        must_symmetric: true
        must_collision: true
        must_iff: true
        symmetry_c: 0
        colliding_pairs: [[1, 6], [2, 5], [3, 4]]
        role: real_symmetric_pair
      known_false:
        id: KF
        S: [1, 2, 4]
        must_symmetric: false
        must_collision: false
        must_iff: true
        must_not_equal_real: true
        must_not_be_pair: true
        role: known_false_asymmetric
      matched_null:
        id: NULL
        kind: empty_or_short_S
        must_reject: true
        role: matched_null_empty_or_short_S
      invalid:
        - id: n-zero
          n: 0
          must_reject: true
      working_model: >
        Exact additive-group
        Kummer-fold iff at frozen n=7.
        Not elliptic M_S. Not an
        (L,b) meter. Not an Aut
        census. Not an orbit cost.
        Not a rho beat.
      do_not_form_elliptic_ms: true
      do_not_run_lb_meter: true
      do_not_enumerate_aut: true
      do_not_cost_orbit: true
      do_not_use_pair_as_kf: true

  independent_variables:
    - object in the frozen family
    - whether S is centrally symmetric
    - whether n is the frozen positive order

  null_object:
    name: empty-or-short S at frozen n
    construction: >
      Replace S by the empty set or
      a singleton. The iff is not
      read. This is the nearby-object
      control with the structure term
      removed.
    non_degeneracy_check: >
      known_false_asymmetric_pass must
      be true before any REAL identity
      is read as a measurement. KF
      must not be a 2-set.
    dynamic_range_demonstration: >
      n=0 must be rejected before an
      identity is read as a census.

  controls:
    - KF asymmetric not-symmetric and not-colliding (known-false / proves-too-much)
    - REAL symmetric and colliding
    - NULL empty-or-short-S rejection of collapse
    - n=0 rejection
    - exact integer arithmetic, no floats
    - n frozen before any elliptic M_S is formed
    - KF is not a 2-set

  metrics:
    primary:
      - fixture_pass boolean
      - real_count_pass boolean
      - known_false_asymmetric_pass boolean
      - reject_invalid_pass boolean
      - null_empty_pass boolean
    secondary:
      - REAL symmetric
      - REAL collision
      - KF symmetric
      - KF collision
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen boolean identities at
      n=7. No transfer to elliptic
      M_S, an (L,b) meter, or
      cryptographic p.
    correspondence: null

  tail_checks:
    - REAL is symmetric and colliding
    - KF is not symmetric and not colliding
    - NULL empty or |S|<2 is rejected
    - n=0 is rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_count_pass,
      known_false_asymmetric_pass,
      reject_invalid_pass, and
      null_empty_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-SHIFT.
    - Stages 1 and later are not authorized.
    - Do not form elliptic M_S.
    - Do not run an (L,b) meter.
    - Do not enumerate Aut.
    - Do not cost an orbit.
    - Do not use a 2-set as KF.
    - Do not identify a rho cost.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen n or S after this freeze
    - Using S={1,2} or any 2-set as KF
    - Forming elliptic M_S because a frozen identity fails
    - Reading Stage 0 as elliptic M_S, an (L,b) meter, an Aut census, orbit cost, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Authorizing Stage 1 of EXP-ECDLP-5f3822 from this contract
