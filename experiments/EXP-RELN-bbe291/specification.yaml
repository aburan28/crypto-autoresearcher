      "null_interpretation": "For a coordinate-predictive routing interpretation also require the real policy’s selected-chart loss computed from the common measured fixed-chart target-cost matrix to be<=0.95 of the null policy’s analogous loss per curve and real<null in at least5 of6 stream pairs. This is a supplemental predeclared finite separation guard, not a replacement for R_c<=0.8. It excludes extra permutation-construction overhead from this diagnostic only; both full costs retain that overhead. A full-cost gain without null separation is reported as finite algorithmic gain not separated from the null, not as a geometry/ECDLP claim.",
