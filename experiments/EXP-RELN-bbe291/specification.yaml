    "mathematical_contract": {
      "fixture_contract": {
        "field_selection": "For rung b, enumerate integers p in [2^b,2^b+2^(b-3)) ascending, certify primality by complete trial division up to floor(sqrt(p)), retain the first at most32 primes satisfying p mod4=3. For each retained p, scan A,B in{0,...,63} lexicographic order. Reject 4A^3+27B^2=0. Select the first p having three qualifying curves of distinct j in Fp; retain the first three such curves in coefficient order. If no such p exists, all three rung slots are unavailable; do not extend the pool or replace the field.",
        "curve_eligibility": "Full group order N=#E(Fp) must be an odd prime, N!=p, N!=p+1 and 2^b-2^(b-4)<=N<=2^b+2^(b-4). Record trace t=p+1-N and nonzero t. j=1728*4A^3/(4A^3+27B^2) modp is used solely to avoid repeated isomorphism class within the selected field. Special j values are not silently discarded if ordinary.",
        "cardinality_certification": "Primary generator builds the exact map y^2->sorted y for all y in Fp, enumerates every x and obtains all affine points plus O. An independently implemented checker uses Euler/residue tests and the p mod4=3 root formula y=rhs^((p+1)/4), checks y^2=rhs and both signs, and compares complete point lists/counts. The point-count paths share no root table or group-add implementation. Every rejected candidate records its exact coefficient/eligibility reason, primality/count transcript and charged work; successful curves retain the entire point list.",
        "generator": "P is the lexicographically first nonidentity affine point by numeric (x,y). Because full N is prime, a nonidentity point has order N; independently verify [N]P=O and P!=O. Full curve-order proof is required, not a helper returning only a prime subgroup.",
        "points_and_encoding": "Field elements are integers0..p-1. Encode O as tag0; affine points tag1 followed by exactly w=ceil(bit_length(p)/8) big-endian bytes for x and y. Numeric point order is O first, then (x,y); no x-only keys. A negation class is {Q,-Q}, represented by the lexicographically lesser affine pair. On these odd-prime-order curves there is no nonidentity y=0 point. Controls include that case separately.",
        "randomness": "Counter stream SHA256 over UTF8 compact JSON array [\"EXP-RELN-bbe291/v1\",b,curve_slot,stream_seed,phase,purpose,counter]. Strings are literal ASCII, integers decimal with no leading zeros, separators comma/colon and no whitespace, no Unicode normalization. Counter starts0 per purpose; digest interpreted unsigned big-endian. Draw range M by rejecting u>=floor(2^256/M)*M, then u modM. Log every counter/rejection. Independence is the declared seed-stream construction, not a proof that deterministic hashes are random.",
        "base_selection": "Let K_b be8,20,48. Sort all (N-1)/2 nonidentity negation classes by numeric x. Draw a uniform offset w0 in0..((N-1)/2-2K_b) with purpose base-offset. Keep the consecutive2K_b classes from w0. Allow coincident offsets across independent seed streams, label them and do not resample by cost. Their both-sign union U has exactly4K_b points.",
        "charts": "D0 takes local class indices0..K-1; D1 takes K/2..3K/2-1; D2 takes K..2K-1, always both signs. Each chart has2K points, adjacent overlaps K points, D0∩D2 empty and no triple overlap. D3=U is the full-union fixed strategy/fallback. Record exact endpoints ell_j=x(first class),u_j=x(last class), all class/sign maps, memberships and raw point lists.",
        "interval_digit_membership_mapping": "Each Dj is precisely the curve points whose x lies in integer interval[ell_j,u_j], because its classes are consecutive among all eligible x values. Equivalently write x=ell_j+sum_{k=0}^{d_j-1}2^k z_k as an integer, z_k∈{0,1}, d_j=ceil(log2(u_j-ell_j+1)), impose0<=sum<=u_j-ell_j and x<p; no modular wrap. The exact finite membership polynomial is the factored product over the K distinct selected x values. Degree K and all factors are stored; no expansion or polynomial solving is falsely claimed cheap. The verifier checks interval, digit/range and root-list membership agree on the complete curve-point list. The tested solver materializes these same points; untested polynomial-solver claims are excluded.",
        "challenge": "For each curve/seed instance draw Q uniformly from the full group point list with purpose challenge, rejecting O, ±P and every point in U. Do not compute or store log_P(Q) or factor-base logs. The fixed point Q is used only to generate public targets and verify final optional rank solutions.",
        "target_split": "Generate a Fisher-Yates permutation of the complete sorted group point list using phase split/purpose target-partition and the fixed counter law. First floor(N/4) points form C; the rest H. Freeze both sets before training, but keep the heldout sample sequence unmaterialized until actual policy publication. Require |C|>=128 and |H|>=2048; otherwise the instance is unavailable without new seeds or substitution. Only membership/hash commitments are exposed outside the input controller as necessary.",
        "target_sampling": "For each phase sample independent a,beta uniformly from F_N using purpose target-a and target-b; form R=[a]P+[beta]Q with the fixed double-and-add algorithm and record its construction cost. Reject if R is outside that phase pool or already selected in that same phase. Retry at most1,048,576 candidate pairs per accepted target position; preserve failures. Exactly128 calibration and2048 holdout targets are distinct within phase and disjoint across phases for that instance. Public a,beta do not enter router features. The target law is uniform without replacement on the declared C or H pool under the stated uniform-draw model; all strategies share the identical samples.",
        "unavailable_rule": "A missing field/curve/base/challenge/target construction is an unavailable source slot, not a replacement, successful sample or negative mathematical result. Preserve all attempts and gate later complete conclusions. No exact parameter values are claimed generated by this design.",
        "scalar_multiplication": "Use nonnegative scalar representatives0..N-1, MSB-first binary double-and-add starting O; for each bit double then conditionally add the input point, including explicit scalar0. No window/precomputed scalar table or uncharged batch method. The independent checker may use its separately frozen projective path, with all its work separately charged."
      },
      "solver": {
        "name": "Complete m3 pair-table first-witness chart solver with full-union fallback",
        "arithmetic": "Primary point operations use affine short-Weierstrass addition with O first, inverse/equal-x exceptional cases, y=0 doubling to O, slope (y2-y1)/(x2-x1) for distinct x and (3x1^2+A)/(2y1) for doubling. y3=lambda*(x1-x3)-y1. Modp inversion is extended Euclid. Independent checker uses projective formulas with RFC6090 verified erratum3920 identity/inverse/distinct/double branches; zero u with nonzero v is a valid distinct-point branch. Arithmetic outputs are checked on curve.",
        "table": "For each enabled chart Dj sort its points numerically. Materialize all unordered pairs (i,j),0<=i<=j<|Dj|, compute full point sum, and store every pair under the complete encoded sum key. Lists sort by (j,i). Retain all pairs and their construction transcripts; identical sums never drop pairs. Canonical serialization sorts keys as encoded bytes then pair indices. The full ambient pair universe, including repeats and O sums, is certified.",
        "query": "For k=0,...,|Dj|-1 compute T=R-Dj[k]. Lookup T. A qualifying pair exists exactly when the first pair in its (j,i)-sorted list has j<=k. Return the first such triple, canonical order (k,j,i), with complete point/membership/group certificate. If all k fail, return none with the table-closure and complete query-trace certificate. No guess, early negative, x-only merge or supplied count is allowed.",
        "start_strategies": "S_j for j0,1,2 queries Dj first and, only if no triple exists there, queries D3=U. S_3 queries U directly. Every strategy uses the same chart/query order, group arithmetic, full input U and certificate policy. All tables it actually constructs are paid; a router may cache only the frozen enabled set J of subcharts plus U within one repetition. No target-result cache, because target identities are distinct within the declared stream; cache reset between repetitions/instances.",
        "coverage": "Every successful Dj triple is in U. A failed small-chart search invokes the complete U search, so every S_j and router has exactly the same existential success set on U. The primary timed task returns one canonical certified witness or certified absence; it does not claim to enumerate every union witness during its first-witness stage.",
        "complete_solution_audit": "Independently enumerate every unordered triple from U with a separate projective group path, store its full sum and every original triple, and derive exact full-union solution sets for every target including O. Chart flags on each triple derive exact Dj solution lists. This reference census is checker-only and is never given to timed solvers or the policy selector. For all128 calibration targets run each chart in audit-all mode, enumerate all k/qualifying pairs, and compare complete lists against that census. Every output pipeline retains the independently checked full solution list for each sampled target as audit data; no missed solution is hidden by equal counts. Holdout checks all timed witnesses/absences against the complete private census. The independent frozen-verifier stage rechecks these artifacts later with all work charged.",
        "exhaustive_scope": "Exhaustive means the entire pair/triple domain and exact sampled-target solution sets; no claim that the primary timed engine measured every group target. Small synthetic QA also exhausts all group targets. The source’s full12/16/20-bit ordinary ladder is retained; synthetic controls do not replace ordinary targets.",
        "quarantine": "The oracle/checker process passes no solution/count/rank/heldout cost data to the selector or timed router. For each calibration RUN, finalize calibration-measurements.json containing only permitted calibration features/timing/setup/score data, then seal policy-core.json with its exact measurement hash and chosen routers/fixed/H1 records. Only after that core is sealed may the private checker flush complete oracle tables. Final RUN manifests bind core/measurement outputs. The global selected-policies.json is assembled after all three RUNs and copies sealed cores exactly, binding their actual hashes and RUN manifests; it never reselects or hashes later global summaries. Holdout samples/timings are generated only after the actual published bundle and activation.",
        "rank_and_recovery": "Use one returned decomposition per successful target. Convert both signs to the canonical2K class representatives with signed multiplicities. If a representative equals P or -P, eliminate its known log±1 exactly into the RHS. Other representatives and x=log_P(Q) are unknown columns. For target R=aP+beta Q, row has signed class counts and -beta for x, with RHS a minus known-generator contribution. Reduce over F_N, verify augmented consistency, keep all original row coefficients and exact row operations, and count only independent increments after free sign/generator identities. Attribute increment to chosen start chart/fallback. A full-rank solution is checked by point multiplication for every solved class and Q; if rank is deficient, retain that exact status. No row-count/cycle-count proxy or hidden log is permitted. Determine Q-identifiability separately: e_Q must lie in the row span of the unknown-coefficient matrix, with an exact multiplier certificate lambda*A=e_Q; then x=lambda*rhs is checked by[x]P=Q. Equal rank alone does not certify the same target information. Record rank and Q-identifiability per prefix and every seed.",
        "rank_scope": "Fixed target counts do not stop at rank saturation. Primary comparisons require no lost existential target and no lower final informative rank than the primary best-fixed benchmark on each paired instance; report all prefix ranks, first-full-rank work and collisions separately. No claim that this component defeats generic DLP search follows. Candidate must also preserve Q-identifiability whenever the minimizing fixed benchmark identifies it. No external descent is assumed free: this finite pipeline retains Q as a challenge column and charges direct row-span recovery/checking; a general descent algorithm is outside the tested engine and any broader DLP claim needs a separate contract. The operative baseline includes the explicit charged free-input equality/negation rows; only additional row-space dimension is credited. Large toy samples may expose generic input collisions, so a direct challenge solution already available from those rows is labeled input-derived and supplies no routing/DLP advantage.",
        "proof_outline": "Pair-table completeness follows because each unordered triple has unique sorted indices i<=j<=k and is encountered by its maximal k; the sorted pair list contains a qualifying pair iff its minimum j<=k. Union fallback gives the same existential domain for all start choices. Both-sign class compression and known-generator elimination preserve exact linear relations, not arbitrary graph invariants. These are manual proof obligations for protocol review and executable certificate checks, not formal or experimental results.",
        "free_input_information": "Before attributing any informative rank to decomposition, independently account for all equality/negation information in the public input records under the declared lookup operation set: R_i=±R_j; R_i in{O,±P,±Q}; and R_i equal to a signed base representative. Build the corresponding exact modular rows from recorded a,beta and known signs, verify their group identities, and charge the lookup/history/check work equally to every arm. Carry already available calibration free rows into the heldout baseline without exposing solved scalars to selector/router. Report each arm’s added rank modulo this common row space and whether Q was already identifiable from input collisions; such information is never credited to routing or treated as free source savings. No arbitrary uncharged discrete-log or higher-cost relation oracle is assumed.",
        "certificate_order": "Before ordinary timing repetitions, complete the approved synthetic QA and the calibration audit-all correctness/completeness pass against the private independently implemented census for all128 calibration targets and all four charts. The census/check outputs remain inside the private checker and cannot enter policy selection; raw oracle tables are flushed only after policy-core sealing. Pre-timing correctness work is fully charged. Later independent frozen-verifier receipts are additionally required before any recorded timing is admitted as a scientific cost result.",
        "matrix_order": "Order unknown base columns by the existing numeric-x class order after removing known ±P classes; append the Q-log column last and the RHS separately. Process public-input free rows in deterministic source-record order before decomposition rows in target-generation order. For each RREF insertion scan columns left to right, reduce by existing unit pivots in ascending column order, choose the first remaining nonzero as pivot, normalize modulo prime N, then clear that pivot from all other retained pivot rows. Keep exact multipliers back to original rows. A zero coefficient row with nonzero RHS is invalid certificate/inconsistent data, not rank gain. To solve lambda*A=e_Q use the same pivot ordering and set free multipliers to zero; retain and independently verify the resulting witness."
      }
