    "policy_contract": {
      "feature_input": "Only [is_O,x,y,p,ell0,u0,ell1,u1,ell2,u2] from the current public feature point is available. Original R remains separate solver input. a,beta,Q logs, planted decompositions, c(R), witness lists, target rank and heldout timing are forbidden feature fields. No arbitrary expression/code, network or filesystem access is permitted by the policy interpreter. For O use x=y=0 as guarded dummy fields; all affine-only predicates return false. In the null arm is_O/x/y describe the permuted feature point, never replace the original solver target.",
