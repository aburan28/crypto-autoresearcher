      "grammar": "Choose a bit mask M in0..255. Evaluate only selected predicates in increasing ID order; use the chart assigned to the first true predicate, else the explicit default chart. Assignments are from enabled J, where J is one of the8 subsets of{0,1,2,3} containing3. Every selected predicate and the default has exactly one chart. The priority rule partitions every input, including O; no overlapping cell is scored twice.",
      "calibration_measurements": "For each curve/seed measure every fixed S_j over the identical128 calibration targets with3 fresh-cache stream repetitions. Retain total and per-stage/per-target process-group CPU nanoseconds and exact operation traces. For each (j,t), c_jt is the median of the3 active-query plus fallback/recovery CPU values; zero/nonpositive resolution is flagged invalid_measurement. Separately record each actual table-build cost and permitted-routing-prefix cost with3 repetitions. Full acquisition, correctness oracle, controls and optimization work remain charged in C_cal.",
      "optimizer": "For each of256 masks and8 enabled sets J, partition the calibration targets. In each nonempty priority cell choose j∈J minimizing the sum of c_jt in that cell; tie by smaller j. Empty cells/default with no training examples use chart3. Score = sum chosen cell costs + median measured total routing-prefix CPU for M + sum median actual build costs of all tables in J, with union counted once. Enabled but unused tables are still built/charged in deployment. Minimize the exact integer score; ties by(popcount M,popcount J,M,J-bitmask,assignments in selected-ID order then default). Store all2048 scores, component sums and chosen assignments, not just the winner. This is the fixed algorithm, not a claim of global optimality over arbitrary routers.",
      "subset_scope": "The eight primitive predicates and their order are fixed before calibration; only the subset, enabled chart set and assignments are fitted on the allowed calibration records. Thus at most eight predicates are used, while all members of the source’s fixed eight-element family are examined. No ninth feature, threshold search or rule permutation is allowed.",
      "fixed_deployable_comparator": "Record j_star minimizing the calibration sum c_jt plus its observed setup; tie smaller j. Its later performance is derived from the identical measured fixed S_j stream with its own calibration-selection charge. This is secondary to the source’s hindsight min_j mean fixed-chart benchmark.",
      "H1_witness_selection": "For every curve, primitive predicate i and side v, require at least32 calibration targets in that cell in each of its six streams. For each stream choose j_cell in{0,1,2,3} minimizing the sum of c_jt over that cell; tie smaller j. Compare the sum of those selected cell costs over six streams with the sum of costs of each stream's already calibration-selected j_star on the same cell. Select the (i,v) minimizing this pooled positive-denominator ratio by exact cross multiplication; tie(i,v), false before true. Store all eligible/ineligible candidates, the six j_cell values and all sums. Run the identical definition for the null feature association. Freeze the single curve-level real/null H1 witness and six cell-chart assignments before holdout. Zero denominator is invalid measurement; no eligible stratum is explicit insufficient information, without replacing a cell or sampling again.",
      "policy_artifact": "Each calibration RUN first writes calibration-measurements.json and seals policy-core.json with its exact measurement/source/fixture hashes,36 real/null routers,18 fixed choices and3+3 H1 witnesses or explicit no-eligible entries. After the private oracle flush and complete RUN manifests, global selected-policies.json copies the three sealed cores verbatim and binds their actual hashes/manifests, totaling54 real+54 null policies,54 fixed choices and9+9 H1 records. It does not hash itself, calibration-summary.json or the later global policy-score-index.json. The calibration+policy snapshot externally binds the actual global bundle SHA before holdout activation.",
      "phase_gate": "All3 calibration RUNs, required controls and raw policy-score records must be complete. The actual calibration/policy snapshot and subsequent calibration-integrity decision-only ledger TASK-20260909-341475 with DEC-20260909-406441 must be published. The separate holdout activation names the actual policy bundle SHA256, calibration source/claim/record hashes and immutable implementation lock. If any binding is absent, changed or inconsistent, refuse holdout before sampling any heldout target.",
      "null_association": "For every curve/seed and phase, uniformly permute the phase target-feature records with Fisher-Yates using purpose feature-permutation. The real arm uses the identity row map; the null arm uses the frozen permutation. Solver targets, all a/beta labels, U/Dj, overlap and target set remain unchanged. Only router-visible coordinate features are reassigned. Calibration and holdout permutations are independent. Both arms use the same full-length feature-row input structure and lookup API; permutation construction/storage and all actual extra work are charged.",
      "null_shape": "Permutation is a bijection of the exact phase features, so all one-/multi-predicate feature histograms and chart/base union/overlap are preserved. A cost-column label is never permuted into the router. Null policies use exactly the same2048-candidate optimizer and receive only their training feature association.",
      "holdout_order": "Use the identical2048 targets for all six active strategies. Repetition0 order is[S0,S1,S2,S3,real_router,null_router], repetitions1 and2 rotate left by2 and4. Every repetition starts fresh tables and process state, with one worker and no cross-method cache. Any physically common fixture/reference work has an explicit full-charge event attribution to every compared strategy.",
      "independence": "Scientific Executor implements the frozen selector; it may not edit policy by judgement, inspect heldout cost for selection or retry until a favorable policy appears. The policy validator is a separate fresh session and cannot alter the producer bytes. A defect requires an additive protocol/implementation correction and new admission.",
      "calibration_reproducibility": "The selector is deterministic given the retained measured calibration matrix and setup/prefix costs, not from the seed alone: fresh CPU measurements may choose another valid policy. This is why actual score records and actual selected-policy bytes/hash are frozen and snapshotted before holdout. Replaying the exact retained matrix must reproduce the same mask/J/assignments/H1 choices bit-for-bit. No fresh calibration is repeated to seek a favorable policy."
