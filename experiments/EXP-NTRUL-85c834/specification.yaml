experiment:
  id: EXP-NTRUL-85c834
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-cc82fa; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-cc82fa
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Reduce four Hermite-verified identical presentations of the same NTRU lattice and of a matched
    random lattice at two budgets, and report profile spread against the dense-sublattice kink amplitude
    in the same units
  objective: The uncertainty reduced is whether the Gram-Schmidt profile is a usable observable of
    an NTRU lattice at the reduction budgets this program can afford, or whether it is substantially
    a property of how the lattice was presented. (i) Does the pipeline pass its forced nulls, meaning
    identical presentations give exactly zero spread and every presentation is verified by Hermite
    normal form to span the same lattice, without which nothing else in the run means anything; (ii)
    how large is max_i d(i), the worst-index spread across four presentations, relative to the amplitude
    of the dense-sublattice kink measured in the same log Gram-Schmidt units on an instance deliberately
    placed deep in the plant regime, this ratio being the quantity that decides whether profile-based
    detection has an error bar it can live with; (iii) does the spread contract with increased reduction
    budget, and at what rate, since a contraction rate converts the tolerance into a budget requirement
    that later contracts can simply satisfy. The run deliberately measures the null lattice through
    the same channel so that spread can be read as instrument noise rather than as a structural property,
    and it fixes the kink index window in advance so that the comparison cannot be tuned after the
    fact.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: at the tested n, moduli, presentation
      family, reduction implementation and budgets, the worst-index Gram-Schmidt profile spread across
      verified-identical presentations is X in log units, the kink amplitude is Y in the same units,
      their ratio is X/Y with the reported CI, and the spread contracts by factor Z between the two
      budgets. What does NOT follow: nothing about the existence or location of the overstretched
      transition; nothing about any other reduction implementation, which could behave differently;
      nothing about adversarially chosen presentations; and no verdict on IDEA-20260809-24eec3 beyond
      supplying the tolerance its measurement requires.'
  inputs:
    procedure: 'STAGE 0, cost hours of implementation: obtain or implement a deterministic reduction
      routine with a known-answer control, following the discipline of tools/sage_free_estimator/
      where a shim is trusted only after reproducing archived reference values. STAGE 1, cost minutes:
      implement the four presentation generators and the exact Hermite normal form equality assertion;
      run the identical-presentation forced null and gate on d(i) = 0. STAGE 2, cost hours: for n
      = 24 and three moduli, 20 NTRU instances per modulus, produce four presentations each, reduce
      all at LLL-only budget with a fixed seed, record profiles. STAGE 3, cost hours: repeat STAGE
      2 at one small block size, giving the budget ladder. STAGE 4, cost hours: repeat STAGES 2 and
      3 on 20 matched random q-ary instances per modulus. STAGE 5, cost minutes: measure the kink
      amplitude on the deepest-regime cell, fix the index window from it before analysing anything
      else, then compute d(i), max_i d(i), the ratio and the contraction factor with bootstrap CIs.
      STAGE 6, cost minutes: recompute all profiles in exact arithmetic from the output bases to bound
      reduction-internal numerical error.'
    instrument: Python 3. Exact integer Hermite normal form and exact-arithmetic Gram-Schmidt recomputation
      implemented in a new harness/ module with no external dependency. The reduction itself requires
      a lattice-reduction routine; the contract permits fpylll if the Coordinator confirms its availability
      in this environment, or an exact-integer LLL plus a simple BKZ loop implemented in harness/
      and held to a known-answer control before use, with the choice and its control results recorded
      in the manifest. harness/runner.py wraps the runs and captures the environment. No Sage.
    parameters: 'n = 24 (lattice dimension 48) for the primary sweep, with a secondary n = 32 cell
      at LLL-only budget only. Three moduli per n, chosen as 2^8, 2^13 and 2^18 to straddle the region
      of interest. Four presentations per instance: standard block basis, Hermite normal form, small-entry
      unimodular transform with entries bounded by 4, large-entry unimodular transform with entries
      bounded by 2^16. 20 instances per (arm, n, q) cell, two arms, two budgets. Budgets: LLL-only
      with delta 0.99, and BKZ at block size 10 with a fixed tour cap.'
  controls:
  - Identical-presentation forced null, d(i) = 0 exactly, gating the pipeline.
  - Matched random q-ary lattice, same dimension, determinant and modulus, four presentations, same
    budgets.
  - Same-basis different-seed arm if the reduction implementation is randomised, separating algorithmic
    randomness from basis effects.
  - Budget ladder, at least two budgets, so contraction is measured.
  - Hermite normal form equality assertion on every presentation pair, which aborts the run if any
    two presentations are not the same lattice.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The matched random q-ary lattice with the same dimension 2n, determinant
    q^n and modulus, presented in the identical four ways and reduced at the identical budget. This
    null has no dense sublattice, so any d(i) it exhibits is pure instrument spread with no feature
    to confuse it with. The null must show d(i) of the same order as the NTRU arm''s d(i) outside
    the kink window for the instrument interpretation to hold; if the NTRU arm''s spread were much
    larger everywhere, the spread would itself be structure-dependent, which is a different and also
    reportable finding. A second forced-value null: two presentations that are identical by construction
    must give d(i) = 0 exactly, which gates the pipeline.'
  independent_variables:
  - presentation in the four-element declared family
  - reduction budget in {LLL-only, BKZ-10 capped}
  - arm in {NTRU, matched random q-ary}
  - modulus q in {2^8, 2^13, 2^18}
  metrics:
    primary:
    - max_i d(i) per cell and budget
    - d(i) restricted to the pre-registered kink index window
    - kink amplitude in log GS units
    - ratio of spread to kink amplitude with CI
    - contraction factor of max_i d(i) between budgets
    secondary:
    - per-presentation root Hermite factor
    - exact-arithmetic versus implementation-reported profile difference
    - wall-clock and algorithm-step counts per presentation
    - count of Hermite assertion failures, which must be zero
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio R = max_i d(i) divided by the dense-sublattice kink amplitude, at LLL-only
      budget, on the NTRU arm.
    formula: 'd(i) = max over presentations p of log ||b*_i(p)|| minus min over p of log ||b*_i(p)||;
      kink amplitude A = max over i in the pre-registered window of the deviation of the deepest-regime
      profile from the linear fit to the same profile outside the window; R = max_i d(i) / A. Predicted:
      R >= 0.5 at LLL-only budget, and R at BKZ-10 no more than half its LLL-only value.'
    source: Pre-registered in the parent proposal IDEA-20260816-cc82fa before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: n = 24 and 32, lattice dimensions 48 and 64, with a modest block size. These are
      chosen as the largest dimensions at which four reductions per instance across 240-plus instances
      fit in a bounded budget. The tolerance measured is explicitly a function of (n, budget) and
      no extrapolation to larger n is performed; the contract states that a profile-based measurement
      at any other n needs its own tau.
    correspondence: null
  tail_checks:
  - The large-entry unimodular presentation, which is the stress case and may dominate the spread;
    reported separately as well as pooled.
  - Cells where the kink is absent, where A is undefined and R cannot be formed; these are reported
    as such rather than assigned a value.
  - Instances where reduction fails to complete within the step cap, recorded as budget outcomes under
    AGENTS.md rule 3 and never as evidence about structure.
  - The smallest modulus cell, where the lattice may be nearly orthogonal and the profile nearly flat,
    making both d(i) and A small and their ratio unstable.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort if the identical-presentation forced null gives nonzero spread.
  - Abort if any Hermite normal form equality assertion fails.
  - Cap reduction at a fixed number of algorithm steps per presentation; exhaustion is a budget outcome,
    recorded and excluded from the ratio, never reported as a structural finding.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Forced nulls pass, all presentations verify as the same lattice, and R is reported
    with a bootstrap CI at every completed cell and both budgets, together with the contraction factor,
    whatever their values.
  falsification_criterion:
  - Forced null nonzero, invalidating the run.
  - R below 0.2 at every cell and budget, refuting the concern and licensing profile-based detection
    with a small stated error bar.
  - No contraction of spread with budget, falsifying the propagation claim.
  - Hermite assertion failure, making the comparison meaningless.
  - Matched-null spread an order of magnitude below the NTRU arm outside the kink window, contradicting
    the pure-instrument reading.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-cc82fa
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Reduction-implementation availability and its known-answer control are unresolved in this environment
    and must be settled by the Coordinator before approval.
  - The definition of the kink index window needs to be written down concretely, including how the
    linear fit outside the window is taken, before any data is analysed.
  - Whether budget should be equalised in algorithm steps or in wall-clock needs a ruling; the contract
    proposes steps, which disadvantages the large-entry presentation in wall-clock terms.
