experiment:
  id: EXP-SHATHREE-665b36
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0a8d21; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0a8d21
  question_id: RQ-SHATHREE-cd2cb2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Closed-form observation-collision audit of the symmetry-decay observable: characterise its
    2^768 constant-schedule fiber, verify bit-identical decay statistics across sampled members, and
    test whether a frozen collision harness can distinguish them'
  objective: The uncertainty a run reduces is whether the decay observable this bucket relies on identifies
    anything beyond itself. (i) It establishes in closed form, and then verifies by direct computation,
    that the map from round constants to the injection sequence eps has kernel exactly the tau_32-symmetric
    vectors, so that a 768-dimensional subspace of schedule differences leaves every decay statistic
    bit-identical; and it confirms that members of this fiber are genuinely different permutations
    by measuring mean output Hamming distance on common inputs, which must be near half the state
    width for the collision to be real rather than nominal. (ii) It runs the frozen certificate-first
    collision harness at r = 1..4 and a fixed conflict budget over 100 fiber members and over the
    FIPS schedule with 10 seeds each, and compares between-member variance in verified certificate
    counts against the seed-only within-member variance measured in the same invocation, so that any
    apparent cross-fiber effect is read against solver noise rather than against intuition. (iii)
    It repeats the analysis for the order-permutation fiber and tabulates exactly which decay statistics
    collide under which fiber, producing a map of what each summary can and cannot identify -- which
    is the deliverable regardless of whether a difference is detected.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''the symmetry-decay observable used
      in this bucket has a closed-form fiber of dimension 768 over constant schedules; sampled fiber
      members give bit-identical decay statistics while differing as permutations by the recorded
      Hamming distance; and under this harness, this budget and these seeds, verified certificate
      counts did or did not vary across the fiber beyond the measured seed-only variance.'' What does
      NOT follow: that the decay model is false, that any schedule is stronger or weaker, that non-detection
      over 100 samples establishes sufficiency over the whole fiber, any attack or complexity, or
      anything about full 24-round SHA-3.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Import the hashlib-validated Keccak transcription and the
      companion contract''s decay-statistic functions and collision harness, both unchanged. STAGE
      1 (cost: ~5 min CPU). Verify on 10^5 random (RC, s) pairs with s tau_32-symmetric that eps is
      unchanged; compute the kernel dimension of RC -> eps by rank and confirm 32 per round. STAGE
      2 (cost: ~10 min CPU). Sample 1000 fiber members around FIPS; recompute every companion decay
      statistic for each; require bit-identity and halt on any difference. STAGE 3 (cost: ~10 min
      CPU). Measure output Hamming distance between fiber members on 10^4 common random inputs at
      full 24 rounds; require a mean near 800 bits. STAGE 4 (cost: ~12h CPU). Run the frozen harness
      at r = 1..4 with a fixed conflict budget on 100 fiber members, 10 seeds each, and on the FIPS
      schedule with 100 seeds as the within-member null. STAGE 5 (cost: ~6h CPU). Run the out-of-fiber
      null: 100 matched-support schedules with differing eps, same grid. STAGE 6 (cost: ~1h). Repeat
      stages 2-3 for the order-permutation fiber; tabulate which statistics collide under which fiber;
      emit the run manifest.'
    instrument: Python 3.11; the hashlib-validated pure-Python Keccak-f[1600] with a parameterised
      constant schedule; the companion tooling contract's frozen Tseitin CNF encoder and pinned Cadical
      build via python-sat; numpy for GF(2) rank and for variance analysis. No Sage. Manifests, seeds,
      budgets and the inference block via harness/runner.py; identifiers via tools/allocate_id.py.
    parameters: 'Fiber sampling: 1000 members for the structural stages, 100 members for the search
      stages, drawn by adding uniformly random tau_32-symmetric vectors to each of the 24 FIPS constants.
      Seeds: 10 per member for fiber arms; 100 seeds on FIPS alone for the within-member null. Round
      counts r = 1..4, digest size SHA3-256 only for the search stages to control cost. Fixed conflict
      budget 10^7. Out-of-fiber null: 100 matched-support schedules. Order-permutation fiber: 1000
      random permutations of the 24-constant order. PCG64 seeds 1..5000 declared in advance.'
  controls:
  - 'Seed-only null: FIPS schedule, 100 seeds, identical constants, giving within-member variance.'
  - 'Out-of-fiber null: 100 schedules with matched support shape whose eps sequences differ, giving
    the harness''s resolution floor.'
  - 'Fiber-identity control: every decay statistic must be bit-identical across fiber members, checked
    before any search runs.'
  - 'Permutation-difference control: mean output Hamming distance between fiber members must be near
    800 bits.'
  - 'Encoding-freeze control: the CNF hash must be constant across seeds within a member, so only
    the constants vary.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The seed-only arm IS the null and it runs in the same invocation: the
    FIPS schedule alone, 100 repetitions with different seeds and identical constants, giving the
    variance attributable to solver randomness with no fiber variation at all. For a cross-fiber difference
    to mean anything, the between-member variance must exceed this within-member variance by a declared
    margin. A second null uses 100 schedules drawn OUTSIDE the fiber with matched support shape, whose
    decay curves differ; those must show at least as much between-member variance as the fiber arm,
    otherwise the harness cannot distinguish any constant schedules and the whole test has no resolution.'
  independent_variables:
  - fiber arm in {curve-preserving fiber, out-of-fiber matched support, seed-only}
  - fiber member index
  - round count r
  - solver seed
  - fiber type in {additive symmetric, order permutation}
  metrics:
    primary:
    - kernel dimension of RC -> eps by rank
    - bit-identity verdict for every decay statistic across fiber members
    - mean output Hamming distance between fiber members
    - verified certificate count per member per round per seed
    - between-member versus within-member variance ratio
    secondary:
    - conflicts to first solution per invocation
    - CNF hash constancy per member
    - collision table of decay statistics under the order-permutation fiber
    - distribution of Hamming distances rather than the mean alone
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The fiber dimension d of the map RC -> eps over a 24-round schedule, and the variance
      ratio V = between-member variance of certificate counts divided by within-member seed-only variance.
    formula: 'd = 24 * dim{v in GF(2)^64 : tau_32 v = v} = 24 * 32 = 768, because eps = RC XOR tau_32
      RC is unchanged exactly when the added vector is tau_32-symmetric, and the symmetric subspace
      of a single 64-bit lane under rotation by 32 has dimension 32. V := Var_between / Var_within,
      computed from the 100-member 10-seed grid against the 100-seed FIPS-only grid. Predicted: d
      = 768 exactly. NO value of V is pre-committed -- V is the audit''s output and pre-committing
      would prejudge whether the observable is sufficient; the declared decision margin V > 2 is fixed
      in advance as the threshold for calling a difference detected.'
    source: Pre-registered in the parent proposal IDEA-20260816-0a8d21 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Full-width permutation and the real FIPS schedule for the structural stages; search
      stages restricted to SHA3-256 and r = 1..4, which carry no security meaning and are chosen because
      they are the only regime where the harness has any success at all. Transfer assumption stated
      explicitly: the structural fiber result holds for the observable as defined at any round count,
      since it is closed-form; the empirical non-detection or detection is scoped strictly to r <=
      4, SHA3-256, this budget, these seeds and 100 sampled members out of 2^768.'
    correspondence: null
  tail_checks:
  - Every sampled fiber member must reproduce the FIPS eps sequence exactly before it is used.
  - CNF hashes must be constant across seeds within a member.
  - The within-member seed-only variance must be nonzero, otherwise the harness is deterministic and
    the variance ratio is undefined.
  - Output Hamming distances must be reported as a full distribution, since a near-800 mean with a
    bimodal distribution would indicate a sampling bug.
  - The order-permutation fiber must leave multiset statistics identical and round-indexed statistics
    different, as an internal consistency check on the two fiber definitions.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if stage 2 finds any decay statistic differing across the fiber.
  - Halt if stage 3 mean Hamming distance is below 700 bits.
  - Fixed member and seed counts with no adaptive extension after seeing the variance ratio.
  - Total wall-clock ceiling 24 hours; unfinished cells are recorded as not attempted, never as negative
    evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if the fiber dimension is confirmed at 768, decay statistics
    are bit-identical across all sampled members, fiber members are shown to be genuinely different
    permutations, and the variance ratio V is reported against a nonzero measured within-member null
    -- whatever V turns out to be.
  falsification_criterion:
  - The kernel dimension is not 768.
  - Any decay statistic differs across fiber members.
  - Mean output Hamming distance is below 700 bits.
  - The out-of-fiber null shows a variance ratio at or below 1, indicating the harness has no resolution.
  - The within-member seed-only variance is zero, leaving V undefined.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0a8d21
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The decision margin V > 2 is declared rather than derived and a Coordinator must accept it or
    replace it with a resolution requirement before the run.
  - Restricting the search stages to SHA3-256 and r <= 4 is a cost decision that limits the audit's
    reach; whether that reach suffices for the audit to bind on companion contracts is a Coordinator
    judgement.
  - How to report a non-detection over 100 of 2^768 members without implying sufficiency needs an
    agreed wording fixed in the contract before results exist.
  - Whether the order-permutation fiber should count as a second observation collision or as a separate
    audit is unsettled and both are reported without a verdict.
