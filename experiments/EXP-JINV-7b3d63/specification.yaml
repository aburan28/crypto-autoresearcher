# =============================================================================
# EXP-JINV-7b3d63 — version 1, approved by DEC-20261006-f983da.
# Frozen measurement of the orbit-normalised doubling-slope character
# gap in IDEA-20261006-fc2714. Success is the idea's prediction: the
# maximum matched-trace cross-j gap is at least 1/10, with the same-j
# maximum strictly below 1/10. A finished cross-j maximum strictly
# below 1/10, under the gates below, is the concrete negative. This
# design session did not enumerate a point and did not compute a mean.
# No discrete logarithm is authorized. Source idea bytes are copied
# unchanged from origin/design/frob-1e54b5-theta.
# =============================================================================
experiment:
  id: EXP-JINV-7b3d63
  hypothesis_id: H-JINV-f20ba3
  question_id: RQ-JINV-8fc13a
  source_idea: IDEA-20261006-fc2714
  version: 1
  title: >-
    Orbit-normalised doubling-slope character gap between j=1728 and a
    matched-trace ordinary curve over F_29
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-f983da
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the gap is at least 1/10, and it
      does not assert that a gap is a rho speedup.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Census lex-smallest short-Weierstrass models over F_29, drop
      singular and supersingular models, average the Legendre symbol
      of the doubling slope on Aut-orbit representatives, and compare
      matched-trace gaps as exact rationals against 1/10. Do not change
      the prime, the threshold, or the representative rule. Do not
      search for a discrete logarithm and do not run a walk.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether, over F_29, the maximum absolute difference of
    orbit-normalised means of (λ/29) between an ordinary j=1728 model
    and an ordinary model with j outside {0, 1728}, at equal trace
    #E-(29+1), is at least 1/10, while the same maximum inside one
    j-class stays strictly below 1/10. A finished cross-j maximum
    strictly below 1/10 under the gates below is the concrete negative.
    No faster discrete logarithm is in scope.

  inputs:
    p: 29
    residues: '{0, 1, ..., 28}'
    gap_threshold: '1/10'
    trace_definition: '#E(F_29) - 30'
    model: 'y^2 = x^3 + A x + B'
    r1728_check: >-
      Let r1728 be the remainder of 1728 on division by 29. It is an
      instrument failure unless r1728 equals 17. The check 29*59 = 1711
      and 1728-1711 = 17 is part of the frozen arithmetic, not a
      measured gap.
    hasse_bound: >-
      Let H be the greatest integer whose square is at most 4*29 = 116.
      10*10 = 100 and 11*11 = 121, so H = 10. An enumerated trace whose
      absolute value exceeds 10 is instrument_failure.
    singularity: >-
      A model is singular when (4*A*A*A + 27*B*B) mod 29 is 0. Drop
      singular models before isomorphism reduction.
    j_invariant: >-
      For a nonsingular model, let den be (4*A*A*A + 27*B*B) mod 29,
      which is nonzero, and let num be
      (r1728 * ((4*A) mod 29)^3) mod 29. j is (num * inv(den)) mod 29.
      j=1728 means j = r1728. j=0 means j = 0. Generic means j is
      neither. If B = 0, A ≠ 0, and the model is nonsingular, j must
      equal r1728. If A = 0, B ≠ 0, and the model is nonsingular, j
      must equal 0. Any other result is instrument_failure.
    isomorphism: >-
      For u in 1..28, the image of (A, B) is
      ((u^4 * A) mod 29, (u^6 * B) mod 29). The representative of a
      nonsingular model is the lexicographically smallest pair in that
      orbit, A then B, both in 0..28. Keep a model only when it equals
      its representative. One model per class.
    trace: >-
      Count affine points by scanning x from 0 through 28 and y from 0
      through 28, keeping (x, y) when
      (y*y - (x*x*x + A*x + B)) mod 29 is 0. Let n_affine be that
      count. The idea's trace is n_affine + 1 - 30, which is
      n_affine - 29. Ordinary means that integer is not 0. A
      supersingular model is excluded from every scored pair. If the
      absolute value of the trace exceeds H, the run is
      instrument_failure.
    eligible_points: >-
      S is the set of affine points on the model with y ≠ 0. Residues
      of y are in 0..28, so y ≠ 0 is the same condition as 2y ≠ 0.
    automorphisms: >-
      Identity is (x, y) mapped to (x, y). Negation is (x, y) mapped
      to (x, (-y) mod 29). Let i0 be the smallest integer in 1..28
      with (i0*i0) mod 29 = 28, if any such integer exists. The two
      extra candidates are (x, y) mapped to ((-x) mod 29, (i0*y) mod 29)
      and (x, y) mapped to ((-x) mod 29, ((-i0)*y) mod 29). Retain a
      map only when every affine point of the model is sent to an
      affine point of the model. Identity and negation must be
      retained. If either is not, the run is instrument_failure. The
      order |Aut| is the number of retained maps. It must be 2 or 4.
      Any other order is instrument_failure.
    orbits: >-
      For P in S, the orbit is the set of images of P under retained
      automorphisms. Those images lie in S when the maps were retained
      and y ≠ 0 is preserved by units. The representative is the
      lexicographically smallest (x, y) in the orbit, x then y, both
      in 0..28. R is the set of representatives. N is the cardinality
      of R. A model with N = 0 is not scoreable.
    slope_and_character: >-
      For a representative (x, y), λ is
      ((3*x*x + A) * inv(2*y)) mod 29, in 0..28. The character is
      λ^14 mod 29, sent to 0 when the power is 0, to +1 when the power
      is 1, and to -1 when the power is 28. Any other power is
      instrument_failure. The orbit mean is the sum of these integers
      divided by N, as an exact rational. The raw mean is the same sum
      over every point of S, not only representatives.
    doubling: >-
      For P = (x, y) in S, λ is the slope above, x3 is
      (λ*λ - 2*x) mod 29, and y3 is (λ*(x - x3) - y) mod 29. Then
      2P = (x3, y3). 2P is in S when y3 ≠ 0.
    branching: >-
      A tested model is an ordinary scoreable j=1728 representative,
      or an ordinary scoreable generic representative that shares its
      trace with at least one ordinary scoreable j=1728 representative.
      On a tested model, consider P in S with 2P in S. If fewer than
      two such P exist, the model is branching_untested and does not
      make the character a function. If at least two exist, group them
      by the character of λ(P). The character of λ(2P) is a function
      of the character of λ(P) when every nonempty group has exactly
      one image value. One tested model with that functional
      dependence makes the reading row branching_functional.
    pairs: >-
      A cross-j pair is one ordinary scoreable j=1728 representative
      and one ordinary scoreable generic representative with the same
      trace. A same-j pair is two distinct ordinary scoreable
      representatives with the same trace that are either both j=1728
      or both generic. j=0 representatives are counted and are not
      members of either pair set. The gap of a pair is the absolute
      difference of the two orbit means.
    exact_gap: >-
      For sums s1, s2 and denominators N1, N2, the gap is at least
      1/10 exactly when 10 * |N2*s1 - N1*s2| ≥ N1*N2, and strictly
      below 1/10 when that inequality fails. Compare two gaps by
      cross-multiplying the rationals
      |N2*s1 - N1*s2| / (N1*N2). A floating-point comparison voids
      the run. Record the maximizing gap as a reduced fraction.
    same_j_gate: >-
      If there is at least one same-j pair and the maximum same-j gap
      is at least 1/10, the row is not_separable and the cross-j claim
      is not scored. If there is no same-j pair, the same-j maximum
      does not reach 1/10, same_j_pair_count is 0, and the separability
      gate does not block scoring.
    raw_means: >-
      Compute the same cross-j and same-j maxima from raw point means
      on S. Record them beside the orbit maxima. They do not change
      the reading row. A raw gap that is at least 1/10 while the orbit
      gap is strictly below 1/10 does not satisfy the claim.

  controls:
    - id: same-j-dispersion
      statement: >-
        Same-j matched-trace pairs are the dispersion control. If
        their orbit gap reaches 1/10, do not score the cross-j claim.
    - id: raw-versus-orbit
      statement: >-
        The raw point-mean gap is reported beside the orbit-normalised
        gap. Only the orbit gap can meet the claim.
    - id: automorphism-equation
      statement: >-
        Every retained automorphism sends every affine point to a
        point on the model. Identity and negation are mandatory.
    - id: supersingular-exclusion
      statement: >-
        A j=1728 model with trace 0 is counted and is not a scored
        partner.
    - id: hasse-and-j-checks
      statement: >-
        A trace outside the Hasse bound, or a j-invariant that
        disagrees with the B=0 or A=0 checks, is instrument_failure
        and is not a gap.

  independent_variables:
    - isomorphism representative (A, B) over F_29
    - j-class in {j1728, generic, j0}
    - trace integer #E-(29+1)
    - mean kind in {orbit, raw}

  metrics:
    primary:
      - id: cross_j_orbit_gap
        statement: >-
          The maximum absolute difference of orbit-normalised means
          over matched-trace ordinary cross-j pairs, as a reduced
          rational, together with whether it is at least 1/10.
    secondary:
      - id: same_j_orbit_gap
        statement: >-
          The maximum same-j orbit gap, the same-j pair count, and
          whether that maximum is at least 1/10
      - id: census_counts
        statement: >-
          counts of ordinary scoreable j=1728 models, ordinary
          scoreable generic models, supersingular j=1728 models, and
          matched-trace cross-j pairs
      - id: aut_orders
        statement: whether each scored j=1728 model used |Aut| = 2 or |Aut| = 4
      - id: raw_gaps
        statement: the raw-mean cross-j maximum and the raw-mean same-j maximum
      - id: heur1_flag
        statement: >-
          true when the same-j orbit maximum is at least 1/10, which
          is the falsifier of HEUR-1, and false otherwise

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the same-j tail gate against 1/10. A mismatch is the
    row not_separable. Do not relabel a mismatch as a cross-j gap
    below 1/10, and do not relabel a cross-j gap below 1/10 as a
    mismatch.

  preregistered_prediction:
    quantity: >-
      The maximum absolute difference of orbit-normalised means of
      (λ/29) over matched-trace ordinary pairs with one j=1728 model
      and one model whose j is outside {0, 1728}.
    formula: >-
      The maximum is at least 1/10, and the same-j maximum is
      strictly below 1/10. The concrete negative is a finished
      cross-j maximum strictly below 1/10 under those gates. Source
      idea IDEA-20261006-fc2714, prediction minimum_effect at least
      0.10. The rational 1/10 is that threshold. No sample was drawn
      before this formula was frozen.
    source: >-
      IDEA-20261006-fc2714. KR-RHO-0528e7 and KN-TECH-018, opened in
      this session, fix the iteration constants and do not predict
      the character gap. KR-RHO-755e35 is the matched point-count
      criterion and does not predict the gap.

  scale_relevance:
    tier: toy
    justification: >-
      The census is every isomorphism representative over one prime,
      p=29. No transfer to a larger prime is assumed. The full census
      replaces a sample-size calculation: every ordinary model is
      scored, so the tail is the extreme pair in that finite set, not
      an estimate from a draw. The threshold 1/10 is the idea's
      minimum effect, not a fitted quantile.
    correspondence: null

  tail_checks:
    - >-
      Record the same-j maximum beside the cross-j maximum. The
      same-j maximum is the separability gate, not a second success
      row.
    - >-
      Record the raw-mean maxima. They do not change the row.

  replication:
    seeds:
      - EXP-JINV-7b3d63|census
    independent_instances: 1
    note: >-
      The census is deterministic. One is the number of primes. There
      is no shuffle sample.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the full F_29 census. Wall-clock and CPU
      figures are advisory and null. The 2 GB memory figure is machine
      protection. A watchdog expiry is failed_infrastructure, not a
      gap below 1/10.

  stopping_rules:
    - Stop after the census, the controls, and exactly one reading row are recorded.
    - Do not change p, the threshold, or the lex-smallest rule after seeing a gap.
    - A timeout voids the run. It does not fill a gap below 1/10.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - Any prime other than 29 voids the run.
    - A floating-point gap comparison voids the run.
    - instrument_failure is an instrument row. It is not a gap below 1/10.
    - Scoring a singular or trace-zero model inside a pair voids the run.
    - Keeping two isomorphic models voids the run.

  success_criterion: >-
    At least one ordinary scoreable j=1728 model exists, at least one
    matched-trace cross-j pair exists, no tested model has the
    doubling-slope character as a function of itself, the same-j
    maximum is strictly below 1/10 or there is no same-j pair, and the
    cross-j orbit maximum is at least 1/10. This is the prediction of
    IDEA-20261006-fc2714. It is reachable as a failure when the
    finished cross-j maximum is strictly below 1/10 under those same
    gates.

  falsification_criterion: >-
    The census is fully scored, the instrument checks pass, an ordinary
    scoreable j=1728 model and a matched-trace generic partner exist,
    the doubling character is not a function of itself, the same-j
    gate does not block scoring, and every matched-trace cross-j pair
    has orbit-normalised gap strictly below 1/10. That finished
    maximum is the concrete negative. No ordinary j=1728 model, no
    shared trace, a same-j gap of at least 1/10, and a functional
    doubling character are the other outcomes named with the source
    idea. None of these is an infrastructure event.

  required_artifacts:
    - experiments/EXP-JINV-7b3d63/runs/RUN-*/manifest.yaml
    - experiments/EXP-JINV-7b3d63/runs/RUN-*/stdout.txt
    - experiments/EXP-JINV-7b3d63/runs/RUN-*/stderr.txt
    - experiments/EXP-JINV-7b3d63/runs/RUN-*/census.csv
    - experiments/EXP-JINV-7b3d63/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        r1728 is not 17, a trace has absolute value above 10, a B=0 or
        A=0 j-check fails, identity or negation is not retained, |Aut|
        is not 2 or 4, or a Legendre power is outside {0, 1, 28}
    - id: no_ordinary_j1728
      when: no ordinary isomorphism representative has j = r1728
    - id: mean_undefined
      when: >-
        at least one ordinary j=1728 representative exists and every
        one of them has N = 0
    - id: no_shared_trace
      when: >-
        an ordinary scoreable j=1728 model exists and no ordinary
        scoreable generic model shares its trace
    - id: branching_functional
      when: >-
        a tested model has at least two points P in S with 2P in S,
        and the character of λ(2P) is a function of the character of
        λ(P)
    - id: not_separable
      when: >-
        the earlier gates pass and the maximum same-j orbit gap is at
        least 1/10
    - id: gap_met
      when: >-
        the earlier gates pass and the maximum cross-j orbit gap is at
        least 1/10
    - id: gap_below
      when: >-
        the earlier gates pass and the maximum cross-j orbit gap is
        strictly below 1/10
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the order
    listed. gap_met is the only success row. gap_below is the concrete
    negative. no_ordinary_j1728, mean_undefined, no_shared_trace,
    branching_functional, and not_separable are the other non-success
    rows named with the source idea. instrument_failure is not a gap.
    Record the cross-j pair count, the reduced cross-j gap, the
    reduced same-j gap, the heur1 flag, and attack_claimed false
    beside the row. Those fields do not change the row.
