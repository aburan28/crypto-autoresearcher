experiment:
  id: EXP-GGMB-bed755
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-413fcc
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE WITH A NAMED OBSTRUCTION -- the zero-information oracle class: any oracle whose
    answer is a function of the curve data and adversary-supplied field elements alone, taking no
    group handle as an argument, is simulable at ZERO group operations and carries exactly zero bits
    about k, because k is independent of the public curve data; this closes the j-invariant, volcano-
    level, class-group-action, curve-level torsion-structure, Hilbert-class- polynomial and summation-polynomial-evaluation
    oracles in one argument, and the forward guidance names precisely the point-dependent variants
    that escape'
  status: draft
  objective: "(A) THE CLASS, DEFINED SO MEMBERSHIP IS DECIDABLE BY INSPECTION. Call an oracle O CURVE-MEASURABLE\
    \ if its signature takes NO group handle as an argument: O : (p, a, b, N ; field elements and\
    \ integers supplied by the adversary) -> answer. Membership is decided by reading the signature.\
    \ No analysis is required and no compute is spent.\n(B) THE OBSTRUCTION, NAMED. Fix the curve\
    \ E/F_p and the generator P. The scalar k is drawn independently of (p, a, b, N) -- it is a property\
    \ of the CHALLENGE, not of the curve. Any curve-measurable oracle's answer is a deterministic\
    \ function of (p, a, b, N) and of arguments the adversary itself chose. Therefore the answer is\
    \ measurable with respect to the sigma-algebra generated by the public curve data and the adversary's\
    \ own randomness, and that sigma-algebra is independent of k. Hence\n  I(O-answers ; k | p, a,\
    \ b, N, P, Q) = 0\nexactly, not approximately and not heuristically. THE OBSTRUCTION IS THAT k\
    \ IS INFORMATION ABOUT A POINT AND THESE ORACLES ARE FUNCTIONS OF A CURVE. This is the same obstruction\
    \ DECOMPOSITION.md states for lane L7 (\"k is information about a point, not about the curve;\
    \ any curve-only statistic is k-independent by construction\"), lifted from a lane-specific warning\
    \ to a closure over an oracle class.\n(C) THE ARGUMENT, TWICE, BECAUSE ONE ROUTE IS STRONGER THAN\
    \ THE OTHER.\n  ROUTE 1 (simulation): the simulator answers a curve-measurable query by\n    computing\
    \ the same function, using only (p, a, b, N) which it has and the\n    adversary's own arguments\
    \ which it sees. T_sim = 0 GROUP OPERATIONS.\n    Shoup (KN-TECH-005) applies verbatim to the\
    \ simulated algorithm, so the\n    augmented problem retains exponent 1/2 with NO loss whatsoever\
    \ -- unlike\n    every other simulability verdict in this campaign, this one has no T_sim\n  \
    \  caveat, which is why it is worth separating out.\n  ROUTE 2 (information): even outside the\
    \ generic model, where Shoup does not\n    apply, the mutual-information identity in (B) holds.\
    \ So a curve-\n    measurable oracle cannot help ANY adversary, generic or not. This is\n    strictly\
    \ stronger than Route 1 and does not depend on the generic model\n    at all. Route 2 is the reason\
    \ this is a closure rather than a\n    model-relative observation.\n\n(D) THE MEMBERS, WITH THEIR\
    \ SIGNATURES, SO NOTHING IS CLOSED BY ASSERTION.\n  j-invariant oracle:            (a, b) -> j\
    \ = 1728*4a^3/(4a^3+27b^2). Member.\n  volcano-level oracle:          (a, b, p, ell) -> level\
    \ of E in the\n                                 ell-volcano. Member.\n  class-group-action oracle:\
    \     (a, b, p; ideal class c) -> the curve c * E.\n                                 Member --\
    \ it returns a CURVE.\n  curve-level torsion oracle:    (a, b, p, ell) -> the group structure\
    \ of\n                                 E[ell] as a Galois module, division-\n                \
    \                 polynomial factorisation pattern,\n                                 Elkies/Atkin\
    \ type of ell. Member.\n  Hilbert-class-polynomial /\n  CM-discriminant oracle:        (a, b,\
    \ p) -> D, D_0, h(O), H_D(X). Member.\n  summation-polynomial oracle,\n  EVALUATION form:    \
    \           (a, b; x_1..x_m) -> S_m(x_1..x_m). Member --\n                                 its\
    \ arguments are FIELD ELEMENTS, not\n                                 handles. (Its SEARCH form\
    \ is NOT a member\n                                 and is adjudicated in IDEA-20260807-7270d1.)\n\
    \  embedding-degree oracle:       (p, N) -> least k with N | p^k - 1. Member.\n  endomorphism-ring\
    \ oracle:      (a, b, p) -> End_{F_p}(E) as an abstract\n                                 order,\
    \ its conductor, its class number.\n                                 Member.\nEight of the campaign's\
    \ named oracle ideas, closed by reading their signatures.\n(E) THE FORWARD GUIDANCE, WHICH IS\
    \ WHAT SEPARATES A CLOSURE FROM A FATIGUE REPORT. Exactly one syntactic feature lets an oracle\
    \ escape: TAKING A GROUP HANDLE AS AN ARGUMENT. The escapes are therefore enumerable and are named\
    \ here as the classes that remain open after this closure:\n  E1. POINT-DEPENDENT CURVE CONSTRUCTIONS.\
    \ \"Given handle h, form the curve\n      E_h by some construction depending on h, and return\
    \ its j-invariant /\n      volcano level / torsion structure.\" Not a member. Whether such a\n\
    \      construction exists that is (i) computable without k and (ii) not a\n      function of\
    \ lambda(h) is OPEN and is the only interesting descendant of\n      this closure. A concrete\
    \ candidate to test: the curve obtained by\n      Velu's formulas from the subgroup generated\
    \ by h -- but h has prime\n      order N, so that quotient is the trivial one and the construction\n\
    \      degenerates. That degeneration is itself informative and is the first\n      thing E1 should\
    \ check.\n  E2. COORDINATE-VALUED ORACLES. Anything returning x(h) or a function of it,\n    \
    \  including factor-base membership and model change. These are resource\n      R1/R2 and are\
    \ adjudicated in IDEA-20260807-070d03.\n  E3. TRANSPORT ORACLES returning phi(h) on another curve.\
    \ Resource R4;\n      adjudicated in IDEA-20260807-d73e83 (also closed, by a different\n     \
    \ argument -- relabeling).\n  E4. ORACLES INTO A DIFFERENT GROUP: pairings (R7), lifts (R6).\n\
    \      Adjudicated in IDEA-20260807-569c82 and IDEA-20260807-fd2d89.\n  E5. AMORTIZED / ADVICE\
    \ ORACLES (R8) whose answer depends on many instances.\n      Outside this argument's scope: the\
    \ independence in (B) is per-instance.\nThat five-item list is exhaustive over signatures, which\
    \ is what makes this a closure at the docs/inventor-protocol.md section 4 standard: named obstruction\
    \ (k is independent of curve data), argument (the two routes in (C)), forward guidance (E1-E5).\n\
    (F) WHAT THIS DOES NOT CLOSE, STATED PLAINLY. It does NOT close lanes L2, L3, L10 or L7. Those\
    \ lanes do not have to route their structure through an ORACLE: they may instead claim that curve-level\
    \ structure changes the COST of a non-generic algorithm run on that curve -- e.g. that the Groebner\
    \ solving degree of the Semaev system differs between two curves in one isogeny class. That is\
    \ a claim about an algorithm's cost as a function of public curve data, which is not an oracle\
    \ at all and is untouched by (B). This closure kills the ORACLE FRAMING of those lanes and leaves\
    \ their COST-FUNCTIONAL framing entirely intact. Any reading of this record as \"L2/L3/L10 are\
    \ dead\" is wrong and is the misreading this paragraph exists to prevent."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'Consumes no resource: it is an audit that adjudicates the resources claimed
    by others. Its VERDICT, however, is that the eight listed oracles are inadmissible_generic_group
    in the DECOMPOSITION.md section 2 sense -- they name resources R2, R3, R4, R5 but deliver those
    resources in a form that contains no information about k, so the resource label is nominal and
    the admissibility filter rejects them. That is the strongest form of the filter''s verdict and
    it is reached without any measurement.'
  reachability_gate: 'APPLIES TO ONE MEMBER AND IS DISCHARGED BY THE CLOSURE. The class-group- action
    oracle proposes motion between curves and would ordinarily owe the T5 reachability analysis: reaching
    a RANDOM curve in the class costs O(log p) isogeny steps under GRH; reaching a SPECIFIED one is
    vectorization at roughly p^{1/4} classically. This record makes that analysis MOOT for the oracle
    framing: since the oracle returns a CURVE and carries zero information about k, no reachability
    cost can be worth paying, at any price including zero. A good object is not merely unreachable
    here -- it does not exist. The reachability gate does still bind for the POINT-transport form
    of the same map, phi_c(P), which is a different oracle and is adjudicated in IDEA-20260807-d73e83.'
  inputs:
    procedure: 'STAGE 0 (zero compute, 1 hour): write the independence argument and the simulator;
      classify the eight signatures; run the Step 4 smuggled-handle audit on each. This is the entire
      mathematical test. STAGE 1 (zero compute): check the degenerate-slice baseline against H-GGM-001''s
      public-curve control verdict. STAGE 2 (toy compute, <= 5 minutes, INSTRUMENT ONLY): implement
      the mutual-information estimator; run it on the independent-variable null, on the planted t-bit
      leak ladder, and only then on the eight oracles at p <= 2^20 with 10^4 resamples of k at fixed
      curve and P. STAGE 3 (zero compute): publish the closure with its escape list, and file E1 (point-dependent
      curve constructions) as the one open descendant, including the Velu degeneration check named
      in (E).'
    mechanism: "STEP 1 (zero compute) -- STATE THE INDEPENDENCE PRECISELY. Model the instance generation:\
      \ E/F_p and P are fixed (public); k is drawn uniformly from [1, N-1] independently; Q = [k]P.\
      \ Then for any deterministic function F(p, a, b, N, args) the random variables F and k are independent,\
      \ so I(F ; k) = 0 and, conditioning on the public data, I(F ; k | public) = 0. Repeating over\
      \ polynomially many queries with adaptively chosen args changes nothing, because the args are\
      \ functions of the adversary's own view which is itself independent of k until a handle is touched\
      \ -- and by hypothesis no handle is touched. Write this out; it is four lines and it is the\
      \ whole theorem.\nSTEP 2 (zero compute) -- STATE THE SIMULATOR. One line: the simulator computes\
      \ F. T_sim = 0 group operations. Record it so the Shoup route is available independently of\
      \ the information route.\nSTEP 3 (zero compute) -- CLASSIFY BY SIGNATURE. For each of the eight\
      \ named oracles, write the signature and check \"no handle argument\". Publish the table. This\
      \ is clerical by design; a closure that requires cleverness per member is not reusable.\nSTEP\
      \ 4 (zero compute, THE PART THAT COULD FAIL) -- HUNT FOR A MEMBER THAT IS NOT REALLY A MEMBER.\
      \ The failure mode is an oracle that LOOKS curve- measurable but smuggles a handle in through\
      \ a field argument. Two concrete traps to check explicitly:\n  TRAP 1: \"S_m(x_1, ..., x_{m-1},\
      \ x(R))\" -- if the adversary must supply\n    x(R) for a handle R, then obtaining x(R) required\
      \ a coordinate oracle,\n    and the COMPOSITE is not curve-measurable even though S_m itself\
      \ is. The\n    record must state that the closure covers S_m evaluation at ADVERSARY-\n    CHOSEN\
      \ field elements and says nothing about where those field elements\n    came from.\n  TRAP 2:\
      \ \"the volcano level of the curve reached by walking from E in the\n    direction determined\
      \ by handle h\". Handle argument, not a member, class\n    E1.\nAny oracle that survives Step\
      \ 4 is closed; any that does not is routed to its proper adjudication and this record names\
      \ which.\nSTEP 5 (bounded toy compute, <= 5 minutes, OPTIONAL AND ONLY AS AN INSTRUMENT CHECK)\
      \ -- the empirical null. On toy curves at p <= 2^20, compute each of the eight oracle answers,\
      \ then resample k 10^4 times with the CURVE AND P FIXED, and measure the empirical mutual information\
      \ between the answer vector and k. It must be zero up to the estimator's finite-sample bias,\
      \ and the bias must be reported by running the identical estimator on two independent uniform\
      \ variables. THIS MEASURES NOTHING ABOUT MATHEMATICS -- the answer is forced by Step 1 -- IT\
      \ TESTS THE INSTRUMENT, and it is the cheapest available check that the campaign's mutual-information\
      \ estimator does not manufacture signal from independent variables. That is its only purpose\
      \ and the record must not present it as evidence for the closure."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - independent-variable null for the estimator (mandatory, blocking)
  - planted t-bit leak ladder, t in {0,1,2,4,8,16} (mandatory, blocking)
  - sample-count ladder n in {10^2, 10^3, 10^4} for bias decay
  - H-GGM-001 public-curve-data control as the degenerate-slice baseline
  - matched random curve at the same p, to confirm the measured value does not depend on the curve
    being structured
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, in both directions, because Step 5 uses
    an estimator. NULL OBJECT: two independent uniform random variables of the same alphabet sizes
    as (answer vector, k). The mutual-information estimator run on them must return the same value
    it returns for the eight oracles, and that common value is the estimator''s finite-sample bias,
    which must be reported rather than subtracted silently. PLANTED SIGNAL: a SHAM ORACLE that returns
    the low 8 bits of k. The estimator must report approximately 8 bits for it. An estimator that
    reports 0 for the planted oracle cannot detect information and every zero it reports elsewhere
    is void. DECAY PARAMETER: the number of leaked bits t in the planted oracle, t in {0, 1, 2, 4,
    8, 16}. Measured mutual information must increase monotonically and approximately linearly in
    t and must return to the null level at t = 0. A measured quantity that does NOT fall to the null
    level at t = 0 is the canonical artifact tell and voids the instrument. SECOND DECAY PARAMETER:
    sample count n in {10^2, 10^3, 10^4}. Estimator bias must decay as n grows; bias that does not
    decay means the estimator is misconfigured.'
  independent_variables: []
  metrics:
    primary:
    - handle-arity of each of the eight signatures
    - T_sim per oracle (expected 0 group operations)
    - empirical mutual information per oracle, with the estimator's measured bias reported beside
      it
    - estimator response curve over the planted-leak ladder
    secondary:
    - the escape classification of any oracle that fails Step 4
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of the eight named oracles whose signature contains a group handle
    formula: 0 of 8. Pre-registered. If any one of the eight turns out to require a handle argument
      to be useful as its lane intends, that oracle is NOT closed here and must be routed to E1-E5;
      the closure then covers seven or fewer and the record must say so rather than quietly redefining
      the oracle.
    source: pre-registered in IDEA-20260807-413fcc before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SMUGGLED HANDLES, the dominant confounder and the reason for Step 4. An oracle stated as curve-measurable
    whose lane intends to feed it x(R) for a handle R is a composite, and the composite is not closed.
  - ESTIMATOR BIAS. Mutual-information estimators on finite samples return positive values for independent
    variables. The independent-variable null is mandatory and its value must be reported, never subtracted
    silently.
  - READING THE CLOSURE AS A HARDNESS CLAIM. The trace-one collision shows curve data can determine
    that a fast algorithm exists while carrying zero information about k. Paragraph (F) and the method
    ceiling exist to block this reading, and reviewers should check the write-up for it specifically.
  - SCOPE DRIFT TO MULTI-INSTANCE. The independence is per-instance. A record that cites this closure
    in an amortized setting is citing it outside its scope.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 0 of 8. Pre-registered. If any one of the eight turns out to require a handle
    argument to be useful as its lane intends, that oracle is NOT closed here and must be routed to
    E1-E5; the closure then covers seven or fewer and the record must say so rather than quietly redefining
    the oracle.
  falsification_criterion:
  - Any of the eight oracles is found, in Step 4, to require a group handle to deliver what its lane
    wants. That oracle is not in the class; the closure covers fewer members; the record states the
    reduced list rather than redefining the oracle to fit.
  - The estimator returns nonzero mutual information for a curve-measurable oracle, beyond its measured
    bias, and the planted-leak control passed. The independence argument or the implementation is
    wrong; the closure is suspended and the discrepancy is investigated as a suspected implementation
    fault BEFORE it is reported as anything else, since the theoretical value is exactly zero.
  - The planted t-bit leak oracle is not detected. The estimator cannot see information and every
    zero it produced is void -- an instrument failure, not a mathematical result, per AGENTS.md rule
    5 and RQ-INSTR-f8faa0.
  - Someone exhibits a handle-free oracle whose answers help an adversary. That contradicts the independence
    identity and would mean the instance model in the assumptions does not describe the setting; the
    model, not the theorem, is what would be wrong.
  - The escape list E1-E5 is shown non-exhaustive by an oracle taking a handle that fits none of the
    five. The closure survives (it is about handle-free oracles) but the forward guidance is incomplete
    and must be superseded.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
