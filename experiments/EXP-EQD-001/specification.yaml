  frozen: true
  frozen_on: '2026-08-01'
  frozen_by_task: TASK-20260801-019
  archived_by_task: TASK-20260801-020
  claim_tier: toy
  confirmatory_status: exploratory
  confirmatory_status_note: >-
    Confirmatory only about the named toy cells, the frozen fibre-invariant map INT-2,
    the frozen deterministic factor base, the frozen matched null construction, the
    frozen statistic family and the thresholds calibrated under CAL-EQD-1 - and only
    after an independent review, an approval snapshot and a completed valid real arm.
    It is never crypto-scale, never medium-scale, and never an asymptotic support path.

  # ==================================================================
  why_this_experiment_exists_and_what_it_replaces:
    origin: >-
      BATCH-022 froze EXP-SMTH-001 to test HEUR-DS-1 by sampling half-arity Semaev
      intermediates, encoding them as integers in [1, p**2] under ENC-B, and comparing
      their B-smoothness statistics against the asymptotic Dickman law. The independent
      review REV-20260801-012 returned REVISE with two fatal, arithmetically and
      empirically demonstrated defects, and TASK-20260801-013 recorded
      APPROVAL_DETERMINATION NOT APPROVED. No run of EXP-SMTH-001 was ever executed and
      no evidence record for it exists.
    rv012_a1_restated: >-
      TAIL-DS-1 fails on a CORRECT uniform null. p_ext = min_j rho(u_j) makes
      n * p_ext asymptotically Exp(1), so the analytic pass probability is 1/e and not
      the 1 - 1/e the contract asserted; and the reviewer measured the declared null arm
      passing 0 of 8 at bits 16 and 0 of 8 at bits 20, because asymptotic rho
      under-predicts deep-tail smoothness at X of order 2**32 to 2**40. M-5 leg (a)
      therefore fired deterministically and M-1, M-2, M-4 and M-6 were jointly
      unreachable.
    rv012_a2_restated: >-
      The leading coefficient of S_3(x_1, x_2, Z) in Z is (x_1 - x_2)**2, zero over F_p
      exactly on the diagonal x_1 = x_2, so the fibre invariants were undefined on
      exactly 512 of the 131328 enumerated half-tuples i <= j, and the integrity guard
      M-0 fired on every possible outcome.
    what_is_carried_over_from_EXP_SMTH_001: >-
      NOTHING IS INHERITED BY EDITING. experiments/EXP-SMTH-001/specification.yaml is
      hash-bound at commit d40bf3adde9cefd2b79fafdd56fde7bc61614894 and is NOT edited,
      amended, versioned or superseded by overwrite anywhere in this batch. What is
      carried over is carried as QUOTATION AND AS LESSON - the u = 6 handling discipline
      (declare an unattainable band in advance and confine it to a role its
      unattainability does not spoil), the decision-variable variation check, the
      declaration and quarantine of derivably degenerate variables, the forbidden
      anti-pattern AP-1, and the manifest.yaml ruling.
    why_a_new_experiment_id_rather_than_a_v2: >-
      A protocol_amendment under docs/task-lifecycle.md answers the question "why the
      original protocol cannot proceed unchanged" while keeping the same experiment -
      the same measured quantity, the same objective, the same hypothesis binding. That
      machinery does not fit here. THE MEASURED QUANTITY CHANGES. EXP-SMTH-001 measures
      B-smoothness functionals (largest prime factor, smooth fraction, tail extremum) of
      an integer encoding of the fibre, against an asymptotic analytic model. THIS
      experiment measures the joint law of the fibre invariants themselves, factors
      nothing, invokes no Dickman model, has no smoothness ladder, and tests a different
      hypothesis (H-EQD-001, not H-SMTH-001). Its objective line, its decision variables,
      its objects, its null, its reading rule and its budget are all different. A v2
      under EXP-SMTH-001 would inherit a title, an objective, an
      experiment.hypothesis_id and a claim scope that would all be false of it, and
      would present a change of question as a repair of parameters. A NEW EXP ID IS
      THEREFORE THE HONEST FILING, and EXP-SMTH-001 v1 is left standing, unedited,
      NOT APPROVED, with its defects recorded in the review that found them.

  # ==================================================================
  where_this_design_departs_from_the_reviewers_forward_guidance:
    the_guidance_quoted: >-
      REV-20260801-012 forward guidance - "since ENC-B is a bijection, the question the
      experiment actually asks is whether (e_1, e_2) is equidistributed on F_p x F_p. A
      direct chi-square or two-dimensional KS on (e_1, e_2) answers that with far more
      power, no factorization, no Dickman model, and no finite-X bias at all."
    what_is_adopted: >-
      THE METHOD IS ADOPTED IN FULL. Measure the fibre invariants directly. No
      factorization, no Dickman model, no asymptotic analytic reference, and therefore
      none of the finite-X bias that produced RV012-A1. It is also far cheaper.
    what_is_NOT_adopted_and_why: >-
      THE REFERENCE DISTRIBUTION IS NOT ADOPTED, ON THE MERITS, AND THIS IS THE MOST
      IMPORTANT PARAGRAPH IN THIS CONTRACT. Taken literally, a chi-square or
      two-dimensional KS of (e_1, e_2) against the UNIFORM law on F_p x F_p is
      DERIVABLY REJECTED for a reason that has no Semaev content whatever. The roots of
      S_3(x_i, x_j, Z) are x(P_i + P_j) and x(P_i - P_j), which are x-coordinates of
      points of E(F_p); the set X_E of such x-coordinates has size about p/2; and
      (e_1, e_2) determines the unordered root pair as the roots of
      t**2 - e_1 t + e_2. So the admissible support of (e_1, e_2) has size about
      |X_E|**2 / 2, that is about p**2 / 8, a DENSITY OF ABOUT ONE EIGHTH in F_p x F_p.
      A statistic with enough resolution to see the support therefore rejects the
      uniform law with certainty, and it rejects it because half of F_p consists of
      non-x-coordinates - an elliptic-curve fact, not a Semaev fact, and the exact
      analogue of the x(P) = x(-P) factor 2 that turned out to be the entire structural
      content of the BATCH-020 measurement. Freezing that comparison as the substantive
      decision variable would have been a fresh instance of the degeneracy class that
      ended BATCH-021 and BATCH-022. THE REFERENCE IS THEREFORE A MATCHED NULL OF THE
      SAME SHAPE, and the uniform-on-F_p-squared comparison is retained only as a
      declared derivation and as an instrument characterization, never as evidence.
    consequence_for_the_question_asked: >-
      Because the reference changes, the question changes, and this contract states the
      changed question rather than letting the old words stand over new arithmetic. See
      what_this_establishes_and_what_it_leaves_untested below. The reviewer is directed
      to attack the one-eighth density derivation FIRST, because if it is wrong the
      design should move back toward the guidance as written.

  # ==================================================================
  what_this_establishes_and_what_it_leaves_untested:
    three_limb_decomposition: >-
      The question "do the half-arity Semaev fibre invariants look generic" splits into
      three limbs and this contract is explicit about which limb it measures.
    limb_L1_derivable_no_experiment_needed: >-
      (e_1, e_2) IS NOT UNIFORM ON F_p x F_p. Its admissible support is the set of pairs
      whose associated root multiset lies in X_E, of density about 1/8. This is a
      DERIVATION, is recorded as one, is checked empirically by CAL-4 as an instrument
      characterization, and IS NOT PRESENTED AS AN EXPERIMENTAL FINDING OF THIS BATCH
      under any branch of the reading rule.
    limb_L2_what_this_experiment_measures: >-
      GIVEN the curve algebra that L1 describes, does the FROZEN DETERMINISTIC FACTOR
      BASE, enumerated exhaustively over its C(512, 2) unordered half-tuples with
      i < j, produce fibre invariants DISTINGUISHABLE, at the calibrated thresholds and
      the frozen resolutions, from those produced by a uniformly random 512-point
      factor base of E(F_p) under the IDENTICAL map and the IDENTICAL enumeration. That
      is the substantive measurement and it is the load-bearing input to any claim that
      the intermediates attached to the claw table behave generically.
    limb_L3_instrument_characterization: >-
      Does the half-tuple DEPENDENCY STRUCTURE itself - each factor-base point appearing
      in 511 pairs - move the statistic. Measured in the calibration run by comparing a
      random-factor-base draw against independently drawn point pairs. This is why the
      matched null must be a random FACTOR BASE and not independent pairs, and it is an
      instrument fact, never a result about the map.
    relation_to_HEUR_DS_1_stated_precisely: >-
      EQUIDISTRIBUTION OF THE FIBRE INVARIANTS IS A LOAD-BEARING INPUT TO HEUR-DS-1 AND
      IS NOT IDENTICAL TO IT, AND NOTHING IN THIS BATCH MAY BLUR THAT. HEUR-DS-1 is a
      statement about B-SMOOTHNESS of the intermediates - that the probability an
      intermediate is B-smooth is within a constant factor of Dickman rho(u). This
      experiment measures no smoothness, factors no integer, and computes no largest
      prime factor. What a favourable outcome here would establish is that one route by
      which HEUR-DS-1 could fail - a detectable factor-base-induced departure in the
      joint law of the fibre invariants at the tested resolutions - is not present at
      this n and these cells. What it would NOT establish, under any branch, is
      (1) that the induced integer law carries the Dickman smoothness law at the toy X,
      which is a separate and unmeasured quantitative claim and which the finite-X
      corrections measured by REV-20260801-012 make non-trivial precisely at the large-u
      end; (2) anything about the alternative faithful encoding of the intermediate, the
      x-coordinate x(P_i +/- P_j) below p, which the claw table is actually keyed on;
      (3) anything at m = 5, at any other factor-base size, at any non-toy field size,
      or for target-driven rather than factor-base-driven half-tuples; (4) any cost
      consequence, any early abort, any exponent.
    the_smoothness_measurement_is_still_owed: >-
      YES, AND IT IS FILED RATHER THAN IMPLIED. The direct smoothness measurement of
      HEUR-DS-1 remains UNPERFORMED across twenty-three batches. It is carried as
      declared open item OPEN-BATCH023-A with its two named repairs - calibrate KS,
      RATE and TAIL against a MEASURED null at the actual X instead of against the
      asymptotic rho, and enumerate i < j - and it is ranked into the BATCH-024 opening.
      No outcome of this experiment discharges it and no deliverable of this batch may
      say that it does.

  # ==================================================================
  forbidden_anti_pattern:
    id: AP-1
    statement: >-
      CARRIED VERBATIM IN SUBSTANCE FROM EXP-SMTH-001 AND BINDING HERE. Setting
      smoothness_abort = true on the existing EXP-DS-001 arms and calling the H-DS-001
      mechanism exercised is forbidden as a substitute for, or a supplement to, any
      experiment in this lane. At those parameters the flag causes is_B_smooth to be
      called on an identity-encoded curve x-coordinate below 2**20 with B = 64, a
      STAND-IN and not the half-arity intermediate. If that flag is ever flipped it is
      labelled a PLUMBING CHECK, it produces no evidence record, and it discharges
      nothing.
  forbidden_anti_pattern_2:
    id: AP-2
    statement: >-
      NEW IN THIS BATCH AND IT IS THE LESSON OF BATCH-022. NO THRESHOLD MAY BE FROZEN
      THAT HAS NEVER BEEN MEASURED AGAINST ITS OWN NULL. Deriving a threshold from an
      asymptotic law and asserting that a correct apparatus passes it is forbidden in
      this contract and in any successor that cites it. The reviewer's closing line at
      BATCH-022 is the rule - measuring the null costs less than reviewing it, and two
      minutes of CPU would have caught RV012-A1 before the freeze. Every threshold in
      this experiment is a stated quantile of a MEASURED null distribution, fixed by a
      rule that is itself frozen before the measurement is taken.

  # ==================================================================
  objective: >-
    Compute the half-arity Semaev fibre invariants exhaustively over the frozen
    deterministic factor base at two toy field sizes; compute the identical quantity
    over uniformly random factor bases of the same size under the identical map and
    enumeration; and decide, at thresholds calibrated from a measured null distribution
    under a rule frozen before that calibration ran, whether the two are
    distinguishable. Certify the rejection side of every substantive branch by a
    measured power curve against pre-declared planted deviations, so that no branch is
    reachable only in argument.

  what_this_experiment_is_NOT:
    - Not a search. No membership search, no relation harvest, no claw table, no naive or split arm.
    - Not a smoothness measurement. No factorization, no largest prime factor, no smooth fraction, no Dickman rho, no u ladder.
    - Not a cost measurement. No wall-clock decision variable, no charged units, no cost identity, no R.
    - Not a cryptanalytic attack on any deployed curve or live key. No discrete logarithm is computed or claimed.
    - Not a reopen or re-score of H-DS-001, H-IC-001, H-STR-002, H-SMTH-001, EV-DS-001, EV-DS-002, EV-DS-003 or EV-DS-004.
    - Not a repair, amendment, version or supersession-by-edit of experiments/EXP-SMTH-001/specification.yaml.
    - Not sufficient alone, under ANY outcome, to move any asymptotic claim toward `supported`.
    - Not a validation or a refutation of HEUR-DS-1 at any tier under any branch.

  claim_ceiling: >-
    TOY. The only claimable objects are the empirical statistics of the frozen map INT-2
    at the two named field sizes over the frozen factor base, their comparison to the
    matched random-factor-base null at the calibrated thresholds, and the instrument
    characterizations of the calibration run. NOT CLAIMABLE UNDER ANY OUTCOME -
    crypto-scale or medium-scale validity or invalidity of HEUR-DS-1; any statement that
    HEUR-DS-1 has been validated or refuted; any asymptotic exponent statement; any
    affected-scheme scope statement; any movement of the four asymptotic promotion gates
    G1-G4, which remain OPEN; S1_met, F1_met, F2_met or structure_gate_passed, none of
    which this experiment can evaluate because it runs no search; `support` for
    H-EQD-001, H-SMTH-001 or H-DS-001; reject_scoped on this single unreplicated run,
    and in particular reject_scoped-as-impossibility; GOAL-ECDLP-001 completion; and
    dominated_by null.

  # ==================================================================
  # THE MEASURED QUANTITY
  fibre_invariant_map:
    id: INT-2
    name: frozen half-arity Semaev fibre-invariant map at m = 4
    step_1_partial_map: >-
      For m = 4 the meet-in-the-middle splits the 4-tuple as (P1, P2 | P3, P4). The
      half-arity partial map sends an unordered pair of factor-base x-coordinates
      (x_i, x_j) to the fibre of intermediate x-coordinates Z with
      S_3(x_i, x_j, Z) = 0, where S_3 is the third Semaev summation polynomial over
      F_p. This is the map whose image the claw table is keyed on.
    step_2_coefficients: >-
      f_ij(Z) = c_2 Z**2 + c_1 Z + c_0 with
      c_2 = (x_i - x_j)**2,
      c_1 = -2 * ((x_i + x_j) * (x_i * x_j + a) + 2 * b),
      c_0 = (x_i * x_j - a)**2 - 4 * b * (x_i + x_j),
      all reduced mod p. This is the form REV-20260801-012 verified against a real toy
      curve by checking that it vanishes exactly at x(P + Q) and x(P - Q).
    step_3_invariants: >-
      e_1 = (-c_1) * c_2**(-1) mod p and e_2 = c_0 * c_2**(-1) mod p, the two elementary
      symmetric functions of the root multiset. The pair (e_1, e_2) determines and is
      determined by the root multiset, so it is a COMPLETE invariant of the half-arity
      partial map's image at that half-tuple. THE PAIR IS THE MEASURED OBJECT. It is
      never encoded into a single integer anywhere in this experiment, because the
      encoding step is what made the previous design a lossy functional of the quantity
      of interest.
    step_4_degenerate_case_excluded_by_construction: >-
      c_2 = (x_i - x_j)**2 is zero over F_p if and only if x_i = x_j. THE DIAGONAL IS
      THEREFORE EXCLUDED BY CONSTRUCTION AND NOT COUNTED AND THEN DROPPED. Every
      enumeration in this contract is over i < j with x_i distinct from x_j, the sample
      count is DECLARED at C(512, 2) = 130816 accordingly, and every threshold derived
      from n uses 130816. This is the direct repair of RV012-A2 and it is a design
      choice made before any datum exists, not a post-freeze implementation reading. If
      any run records a single c_2 = 0 draw on any arm, that is an integrity failure and
      fires N-0.
    step_5_null_side_degeneracy: >-
      On the null side a randomly drawn 512-point factor base could contain two points
      with the same x-coordinate (that is, Q = -P). The sampler must REJECT AND REDRAW
      to maintain 512 DISTINCT x-coordinates, and must record the rejection count. This
      is declared in advance, matches the real side exactly (the deterministic factor
      base is a set of distinct x-coordinates by construction), and is the only place
      any redraw is permitted anywhere in this experiment.
    step_6_faithfulness_control_required: >-
      INT-2 IS NOT ASSUMED TO BE THE INTERMEDIATE, IT IS CHECKED. See CTRL-EQD-S3. For
      a frozen sample of 1000 half-tuples per cell, the run must verify by ACTUAL POINT
      ARITHMETIC that the root multiset of f_ij equals {x(P_i + P_j), x(P_i - P_j)},
      and must record verified over total. This is the direct answer to RT047-H2 and
      RT048-H1, which caught exactly the error of sampling a quantity that was not the
      intermediate.
    bit_size_labelling_caveat: >-
      RT047-B5 discipline applies and is discharged rather than inherited. In this
      experiment `bits` names the FIELD prime p and nothing else. The prime-order
      subgroup order is irrelevant here, because this experiment computes no discrete
      logarithm, harvests no relation and runs no search. No sentence in any deliverable
      may say "at 20 bits" without saying that it is the FIELD.

  # ==================================================================
  objects:
    - id: OBJ-REAL
      description: >-
        Fibre invariants under INT-2 computed EXHAUSTIVELY over every unordered
        half-tuple (i, j) with i < j drawn from the FROZEN DETERMINISTIC factor base of
        512 x-coordinates. n = C(512, 2) = 130816. Carries no sampling seed and no
        sampling noise; reproducible bit for bit from the factor base alone.
      role: the object under test
      appears_in: the real arm only, never in the calibration run
    - id: OBJ-NULL-RFB
      description: >-
        Fibre invariants under INT-2 computed EXHAUSTIVELY over every unordered
        half-tuple (i, j) with i < j drawn from a UNIFORMLY RANDOM 512-point subset of
        E(F_p) with 512 distinct x-coordinates, through the IDENTICAL code path with no
        difference except the source of the 512 points. n = 130816.
      role: >-
        THE MATCHED NULL OBJECT required by docs/inventor-protocol.md section 3.2. It is
        matched in count, in the map, in the enumeration, in the half-tuple dependency
        structure, in the field, in the curve and in the code path. The ONLY difference
        from OBJ-REAL is the factor-base selection policy. That is what makes the
        decision variables able to vary with the thing they measure.
      appears_in: calibration replicates and the real arm
    - id: OBJ-NULL-IND
      description: >-
        130816 fibre invariants computed from INDEPENDENTLY drawn uniform point pairs
        (P, Q) on E(F_p) with x(P) distinct from x(Q), through the identical map.
      role: >-
        DEPENDENCY-STRUCTURE CHARACTERIZATION, NOT AN INTERPRETIVE NULL. Compared
        against OBJ-NULL-RFB in the calibration run only, to measure how much of the
        statistic is attributable to the shared-point structure of a half-tuple
        enumeration. A disagreement is an instrument fact and is never a result about
        the Semaev map. It appears in no branch condition of the reading rule.
    - id: OBJ-NULL-UNIF2
      description: >-
        130816 pairs (e_1, e_2) drawn uniformly at random from [0, p) x [0, p), with no
        curve arithmetic at all.
      role: >-
        DERIVABLY NON-MATCHED, AND DECLARED SO IN ADVANCE. Its admissible-support
        fraction is about 1/8 by the derivation in
        where_this_design_departs_from_the_reviewers_forward_guidance, against 1.0 for
        every curve-derived object. It is used ONLY to measure that support fraction
        (CAL-4) and is NEVER a reference distribution for any decision variable. Its
        rejection by any support-sensitive statistic is an elliptic-curve fact and may
        not be reported as evidence about the Semaev map or about HEUR-DS-1.
    - id: OBJ-PLANT-delta
      description: >-
        An OBJ-NULL-RFB draw in which a declared fraction delta of the 130816 pairs has
        its e_1 coordinate REPLACED by a uniform draw from [0, floor(p/2)) and its e_2
        coordinate left unchanged, the replaced indices being chosen by the frozen plant
        stream. delta ranges over the FROZEN LADDER [0.005, 0.01, 0.02, 0.05, 0.10].
      role: >-
        PRE-DECLARED PLANTED DEVIATION, AND THE INSTRUMENT THAT CERTIFIES THE REJECTION
        SIDE OF THE SUBSTANTIVE BRANCHES BY MEASUREMENT RATHER THAN BY ARGUMENT. The
        distortion is deliberately of the SAME KIND the decision statistics are meant to
        detect - a shift in the joint law of the pair at the tested resolutions - which
        is the defect REV-20260801-012 found in the ENC-A certificate, whose power was
        certified against a different alternative from the one that mattered.
      plant_construction_is_frozen_here: >-
        The construction, the ladder and the stream derivation are frozen in THIS file,
        before the calibration runs, so that no distortion may be chosen after seeing
        which one the apparatus happens to detect.

  # ==================================================================
  sample_counts:
    n_per_sample_set: 130816
    n_derivation: >-
      n = C(Bfb, 2) = C(512, 2) = 512 * 511 / 2 = 130816, the exact number of unordered
      half-tuples (i, j) with i < j over a factor base of Bfb = 512 elements, the
      diagonal being excluded by construction under
      fibre_invariant_map.step_4_degenerate_case_excluded_by_construction.
    n_clears_the_carried_minimum: >-
      130816 >= 100000, the sample minimum carried from the BATCH-021 next_action and
      from EXP-DS-001 min_samples_per_bit_size, with a margin of 30.816 percent. The
      minimum is carried as a floor on sample adequacy; NO EXP-DS-001 threshold that
      depends on an asymptotic smoothness model is reused anywhere in this experiment,
      because AP-2 forbids it.
    every_arm_matched_at_n: >-
      Every object above is measured at exactly n = 130816 per cell. Two-sample
      statistics assume matched sample sizes and every arm is matched by construction,
      not by argument.

  factor_base:
    Bfb: 512
    notation_warning: >-
      Bfb is the FACTOR-BASE SIZE. There is no smoothness bound anywhere in this
      experiment, so the Bfb versus Bsm collision that cost the previous lane a
      measurement cannot arise here; the symbol B is never written alone in this
      contract, in its driver or in any deliverable that cites it.
    real_rule: >-
      Deterministic subset of E(F_p) of exact size 512, built as the first 512
      x-coordinates in F_p, in increasing integer order, that are x-coordinates of
      points of E(F_p). This is the frozen_deterministic_subset policy that
      H-DS-001.test_boundary.parameters.factor_base_policy names. Record
      factor_base_sha256 over the canonical decimal newline-joined x-list.
    null_rule: >-
      512 points drawn uniformly at random from E(F_p) with distinct x-coordinates,
      rejecting and redrawing on an x-collision, from the frozen null stream. Record
      each draw's x-list sha256 and the rejection count.
    why_512: >-
      C(512, 2) = 130816 clears the carried 10**5 minimum with 30.8 percent of margin,
      and it is the size EXP-SMTH-001 already justified under ATTAIN-FB-1 and that
      REV-20260801-012 ruled ADMISSIBLE AND CORRECTLY REASONED, noting explicitly that
      the Bfb = 512 choice survives the i < j repair intact. Bfb = 512 is outside
      H-DS-001.test_boundary.instances, which lists 64, 128 and 256; that is a declared
      departure, it is admissible because this experiment tests H-EQD-001 and not
      H-DS-001, and nothing about H-DS-001's test boundary is altered or annotated.

  # ==================================================================
  # THE STATISTIC FAMILY. FORM IS FROZEN HERE. NUMBERS COME FROM CALIBRATION.
  statistic_family:
    id: STAT-EQD-1
    frozen_here_note: >-
      THE FUNCTIONAL FORM OF EVERY STATISTIC, THE RESOLUTION LADDER, THE BINNING RULE
      AND THE THRESHOLD RULE ARE FROZEN IN THIS FILE AT TASK-20260801-019, BEFORE THE
      CALIBRATION RUN EXISTS. The calibration supplies NUMBERS and never a CHOICE. See
      anti_tuning_safeguard.
    binning_rule: >-
      For resolution K, the cell index of a pair is
      (floor(lift(e_1) * K / p), floor(lift(e_2) * K / p)) with lift the representative
      in [0, p). Cell widths differ by at most one field element when K does not divide
      p; that mild unevenness is IDENTICAL in every arm and in every calibration
      replicate, so it cancels in every two-sample comparison and is absorbed into the
      measured null distribution. It is stated rather than left implicit.
    resolution_ladder_K: [16, 64]
    resolution_ladder_powered_check: >-
      At K = 16 there are 256 cells and the expected count per cell per arm is
      130816 / 256 = 511 exactly. At K = 64 there are 4096 cells and the expected count
      per cell per arm is 130816 / 4096 = 31.9375. Both clear the conventional
      five-per-cell floor for a two-sample chi-square by a wide margin and both are
      powered.
    resolution_rung_declared_unattainable_in_advance:
      id: POW-EQD-1
      statement: >-
        K = 256 IS DECLARED UNATTAINABLE AS A CHI-SQUARE DECISION IN ADVANCE AND IS
        EXCLUDED FROM THE LADDER. It would give 65536 cells at an expected count of
        130816 / 65536 = 1.996 per cell per arm, far below the five-per-cell floor, so
        the chi-square approximation and the calibrated permutation threshold would both
        be dominated by empty-cell noise. THE SAMPLE SIZE THAT WOULD POWER IT IS STATED
        RATHER THAN HIDDEN - n >= 5 * 65536 = 327680 for the five-per-cell floor and
        n >= 30 * 65536 = 1966080 for a thirty-per-cell floor, the former reachable at
        Bfb = 810 since C(810, 2) = 327645 and C(811, 2) = 328455, the latter at
        Bfb = 1984 since C(1984, 2) = 1967136. THIS IS DECLARED BEFORE THE RUN PRECISELY
        SO THAT A POST-HOC EXCLUSION IS IMPOSSIBLE, and it is the u = 6 discipline of
        EXP-SMTH-001 - the one thing REV-20260801-012 said to carry forward verbatim -
        applied to this design.
      and_it_is_not_retained_for_a_secondary_role: >-
        Unlike the u = 6 rung, K = 256 is retained for NOTHING. There is no statistic
        here whose noise at that resolution is provably conservative, so the honest
        handling is total exclusion rather than a confined role.
    statistics:
      - id: STAT-CHI-K
        form: >-
          Two-sample Pearson chi-square of homogeneity on the K x K contingency table of
          the two arms, with degrees of freedom K**2 - 1, computed with the pooled-count
          expectation and with cells empty in BOTH arms omitted from the sum and from
          the degrees of freedom, the omission count recorded.
        instances: [STAT-CHI-16, STAT-CHI-64]
        reference: the MEASURED null distribution from CAL-1, never the analytic chi-square law
        reference_note: >-
          THE ANALYTIC CHI-SQUARE LAW IS NOT USED AS A THRESHOLD ANYWHERE. One arm of
          the real comparison is a deterministic exhaustive enumeration rather than a
          random sample, the support is discrete and irregular, and the pairs within an
          arm are dependent because each point occurs in 511 half-tuples. Each of those
          three facts breaks the nominal law. All three are present IDENTICALLY in the
          calibration replicates, so the measured null distribution absorbs them. This
          is the structural repair of RV012-A1.
      - id: STAT-KS1-E1
        form: >-
          One-dimensional two-sample Kolmogorov-Smirnov statistic on lift(e_1) between
          the two arms.
        reference: the MEASURED null distribution from CAL-1
      - id: STAT-KS1-E2
        form: >-
          One-dimensional two-sample Kolmogorov-Smirnov statistic on lift(e_2) between
          the two arms.
        reference: the MEASURED null distribution from CAL-1
      - id: STAT-DUP
        form: >-
          The count of exactly repeated (e_1, e_2) values within a single arm.
        reference: the MEASURED null distribution from CAL-1, as a two-sided band
        role: THE ARTIFACT TELL
        why_it_is_the_tell: >-
          A duplicate count far ABOVE its null band says the sampled quantity is
          collapsing onto a small support - the canonical signature that the driver is
          computing a stand-in rather than the fibre invariant. A count far BELOW says
          the sampler is deduplicating or is drawing without replacement somewhere it
          should not. Its idealized expectation is n**2 / (2 * S) with S the admissible
          support size of about p**2 / 8, which at bits 16 is of order tens and at bits
          20 is below one - A CONTRAST LARGE ENOUGH THAT AN ASYMPTOTIC THRESHOLD WOULD
          HAVE BEEN WRONG AT ONE CELL AND RIGHT AT THE OTHER, which is exactly why this
          band is calibrated and not derived. The two figures above are stated as
          ORDER-OF-MAGNITUDE PRE-RUN EXPECTATIONS FROM AN IDEALIZED SUPPORT SIZE and are
          NOT thresholds; they may not be cited as such anywhere.
    statistics_excluded_and_why:
      - >-
        NO ANALYTIC-REFERENCE STATISTIC OF ANY KIND. No comparison of any arm against a
        closed-form law - not chi-square, not uniform, not Dickman. AP-2.
      - >-
        NO TWO-DIMENSIONAL KOLMOGOROV-SMIRNOV STATISTIC. It has no
        distribution-free reference in two dimensions, its value depends on the ordering
        convention of the quadrant scan, and the grid chi-square at two resolutions
        covers the same alternatives with a reference that this design can actually
        measure. The reviewer's guidance named it as one option of two; the chi-square
        option is taken.

  # ==================================================================
  calibration_protocol:
    id: CAL-EQD-1
    what_it_is: >-
      A NON-EVIDENTIAL MEASUREMENT OF THE INSTRUMENT, EXECUTED BEFORE THE READING RULE
      IS FROZEN AND BEFORE ANY REAL DATA EXISTS. It measures what the frozen statistics
      DO on objects whose law is known, and it supplies the numbers that the frozen
      threshold rule turns into thresholds.
    it_is_declared_non_evidential: >-
      RUN-EQD-001-calib IS EXPRESSLY NON-EVIDENTIAL ABOUT H-EQD-001, ABOUT HEUR-DS-1 AND
      ABOUT H-SMTH-001, IN EITHER DIRECTION. It touches no real object. No evidence
      record may cite it as bearing on any hypothesis, and no deliverable of this batch
      may present any calibration number as a result about the Semaev map. Its outputs
      are instrument constants and instrument characterizations, nothing else.
    it_never_sees_the_real_data: >-
      STRUCTURALLY, NOT BY INSTRUCTION. The calibration run enumerates NO half-tuple of
      the deterministic factor base. The driver's real-arm entry point is not invoked.
      The calibration run package contains no OBJ-REAL sample, no deterministic
      factor-base x-list, and no statistic computed from one. The Validator at
      TASK-20260801-029 and the reviewer at TASK-20260801-025 are both charged with
      confirming this from the archived package rather than from this sentence.
    cal_1_null_distribution:
      id: CAL-1
      procedure: >-
        Per bit size, draw M_PAIRS = 200 INDEPENDENT REPLICATE PAIRS of OBJ-NULL-RFB
        (that is 400 independent random factor bases per cell), and for each pair record
        STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1 and STAT-KS1-E2 between the two members of
        the pair. Separately record STAT-DUP for each of the 400 individual draws.
      output: the 200 replicate values of each two-sample statistic and the 400 values of STAT-DUP, per bit size, archived in full
      why_disjoint_pairs: >-
        Disjoint pairs are used rather than a chained pool so that the 200 replicate
        values are INDEPENDENT and the order-statistic threshold below has its stated
        exact level. A chained pool would halve the cost and would break exchangeability
        with the new observation, which is the property the threshold rule relies on.
    cal_2_power_curve:
      id: CAL-2
      procedure: >-
        Per bit size and per delta on the frozen ladder [0.005, 0.01, 0.02, 0.05, 0.10],
        draw R_REPS = 20 independent OBJ-PLANT-delta objects and compare each against a
        fresh independent OBJ-NULL-RFB draw, recording every statistic of STAT-EQD-1 and
        whether it exceeds the CAL-1 threshold.
      output: the measured detection rate of each statistic at each delta at each bit size
      purpose: >-
        TO CERTIFY THE REJECTION SIDE BY MEASUREMENT. BATCH-022's fatal defect was a
        favourable branch that no correct measurement could reach; the symmetric defect
        is an adverse branch that no achievable deviation could reach. CAL-2 measures
        both sides of that question before the rule is frozen.
    cal_3_dependency_structure:
      id: CAL-3
      procedure: >-
        Per bit size, 20 comparisons of an OBJ-NULL-IND draw against an OBJ-NULL-RFB
        draw, recording every statistic.
      output: whether the half-tuple dependency structure alone moves the statistics beyond the CAL-1 thresholds
      purpose: >-
        Instrument characterization only, and the empirical justification for choosing
        OBJ-NULL-RFB rather than independent pairs as the matched null. If CAL-3 rejects,
        that CONFIRMS the choice; if it does not, the choice was merely conservative.
        Neither outcome is a result about the Semaev map and neither appears in any
        branch condition.
    cal_4_support_density:
      id: CAL-4
      procedure: >-
        Per bit size, record #E(F_p), the 2-adic valuation of #E(F_p), |X_E|, the
        measured admissible-support fraction of one OBJ-NULL-UNIF2 draw (the fraction
        whose associated root multiset lies in X_E), and the admissible-support fraction
        of one OBJ-NULL-RFB draw (which must be exactly 1.0).
      purpose: >-
        To check the one-eighth density derivation empirically and to expose the
        2-torsion caveat. If #E(F_p) is even, halving is not a bijection on E and the
        realizable set of root pairs is smaller than all of X_E choose 2, which moves
        the density figure. The reviewer at TASK-20260801-025 must rule on the derivation
        against these measured numbers.
      it_is_not_evidence: >-
        CAL-4 measures an elliptic-curve fact. It is not evidence about the Semaev map
        and it is not a finding of this batch.
    threshold_rule:
      id: THR-EQD-1
      frozen_before_calibration: true
      frozen_by_task: TASK-20260801-019
      one_sided_statistics: >-
        For each of STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1 and STAT-KS1-E2, the frozen
        threshold is the 199th ORDER STATISTIC (ascending) of that statistic's 200
        CAL-1 replicate values at that bit size. A comparison REJECTS iff its statistic
        is STRICTLY GREATER than that threshold.
      exact_level_of_that_rule: >-
        For 201 exchangeable values, P(a fresh value exceeds the 199th order statistic of
        the other 200) = (201 - 199) / 201 = 0.00995. So each individual test has an
        exact false-rejection probability of 0.00995 ON THE MEASURED NULL, by
        construction and not by model. THIS IS THE STRUCTURAL REPAIR OF RV012-A1 - a
        threshold set as a quantile of the measured null CANNOT fail on a correct null
        more often than its declared level, whatever the finite-size behaviour of the
        statistic happens to be.
      two_sided_statistic: >-
        For STAT-DUP the frozen band is [3rd order statistic, 398th order statistic] of
        the 400 CAL-1 STAT-DUP values at that bit size. The tell FIRES iff the observed
        count lies strictly outside that band, an exact two-sided level of
        (2 + 3) / 401 = 0.01247.
      family_wise_statement_declared_in_advance: >-
        STATED RATHER THAN DISCOVERED LATER. The favourable branch N-2 requires all four
        two-sample tests to fail to reject at BOTH bit sizes, which is eight independent
        tests at level 0.00995 each. On a correct null the probability that N-2 is
        reached is therefore about (1 - 0.00995)**8 = 0.9234 and the probability that a
        correct null is misread as a deviation is about 0.0766. THAT FIGURE IS THE
        ATTAINABILITY OF THE FAVOURABLE BRANCH AND IT IS MEASURED-CALIBRATED RATHER THAN
        MODELLED. Contrast EXP-SMTH-001, whose favourable branch required a tail rule
        that a correct null passed 0 times in 16.
      no_other_threshold_exists: >-
        There is NO threshold anywhere in this experiment that is not produced by this
        rule from CAL-1 values. Any number appearing as a threshold in the reading rule
        that cannot be traced to a specific order statistic of a specific CAL-1 output is
        an integrity failure and fires N-0.
    certified_delta_rule:
      id: CERT-EQD-1
      frozen_before_calibration: true
      rule: >-
        The CERTIFIED DELTA is the SMALLEST delta on the frozen ladder whose measured
        CAL-2 detection rate is at least 0.95 at BOTH bit sizes for at least one of
        STAT-CHI-16 or STAT-CHI-64. That certified delta and the certifying statistic
        are written into the frozen reading rule and the corresponding OBJ-PLANT object
        is re-run inside the real arm as the in-run power certificate PC-1.
      it_is_a_rule_and_not_a_choice: >-
        The ladder, the detection-rate bar, the both-cells requirement and the
        tie-breaking (smallest delta first, then STAT-CHI-64 before STAT-CHI-16) are all
        fixed HERE, before any calibration number exists. The calibration selects nothing;
        it evaluates a predicate that was written down first.
    cal_stop_rule:
      id: CAL-STOP-1
      statement: >-
        A PRE-DECLARED STOP, AND IT IS THE MECHANISM THAT PREVENTS SHIPPING AN
        UNATTAINABLE REJECTION BRANCH. If NO delta on the frozen ladder reaches a 0.95
        detection rate at both bit sizes, the apparatus has NO CERTIFIED POWER against
        the alternative class it exists to detect. In that case TASK-20260801-023 DOES
        NOT FREEZE A READING RULE, the batch records NON-EXECUTION for the real arm, and
        the named repairs are a larger n (a larger factor base) or a different statistic
        - never a relaxed threshold and never a weaker delta bar. Recording the stop is
        the deliverable in that case.
      second_stop_leg: >-
        Likewise if CAL-1 shows any of the four two-sample statistics to have a
        DEGENERATE null distribution - zero variance, an identically zero value, or a
        threshold that the CAL-2 plant at the largest delta cannot exceed - that
        statistic is DECLARED UNATTAINABLE AND EXCLUDED at TASK-20260801-023 with the
        measured reason recorded, and the reading rule is frozen over the remaining
        statistics only. Excluding a statistic AFTER the calibration is permitted ONLY
        on this pre-declared ground and ONLY toward removing a variable that cannot
        discriminate; a variable may never be excluded because it is inconvenient, and
        no variable may be ADDED after calibration under any circumstances.

  # ==================================================================
  anti_tuning_safeguard:
    id: ATS-1
    heading: >-
      CALIBRATING THRESHOLDS ON THE NULL MUST NOT BECOME A MECHANISM FOR TUNING THE
      EXPERIMENT TOWARD A DESIRED OUTCOME ON THE REAL OBJECT. THE SAFEGUARD IS
      STRUCTURAL AND IT IS STATED IN FULL RATHER THAN ASSERTED.
    clause_1_the_rule_precedes_the_measurement: >-
      THE THRESHOLD RULE IS FROZEN BEFORE THE CALIBRATION RUNS, NOT AFTER. THR-EQD-1,
      CERT-EQD-1, CAL-STOP-1, the statistic family, the resolution ladder, the binning
      rule, the plant construction and the delta ladder are all fixed in THIS FILE at
      TASK-20260801-019 and are hash-bound by the TASK-20260801-020 snapshot commit,
      which is an ancestor of the calibration run. THE CALIBRATION SUPPLIES A NUMBER AND
      NEVER A CHOICE.
    clause_2_the_null_arm_never_sees_the_real_data: >-
      THE CALIBRATION ARM NEVER SEES THE REAL DATA. No half-tuple of the deterministic
      factor base is enumerated in RUN-EQD-001-calib, the real-arm entry point of the
      driver is not invoked, and the calibration run package contains no OBJ-REAL sample
      and no statistic computed from one.
    clause_3_the_calibration_is_non_evidential: >-
      THE CALIBRATION IS DECLARED NON-EVIDENTIAL ABOUT THE HYPOTHESIS - about H-EQD-001,
      about HEUR-DS-1 and about H-SMTH-001, in either direction. IT MEASURES THE
      INSTRUMENT, NOT THE OBJECT.
    clause_4_substitution_only: >-
      THE CALIBRATION OUTPUT IS ADMITTED ONLY AS THE SUBSTITUTION OF MEASURED NUMBERS
      INTO THE FROZEN FORM. Any change to a statistic, to K, to the number of replicates,
      to the quantile, to the plant construction, to the delta ladder or to the branch
      structure after the calibration numbers are seen is a versioned protocol_amendment,
      is recorded BEFORE the real arm runs, is justified on grounds independent of any
      real datum, and RESETS confirmatory status to exploratory_only. The single
      exception is the pre-declared exclusion of a degenerate statistic under
      CAL-STOP-1 second_stop_leg, which removes a variable and never adds one.
    clause_5_the_driver_is_frozen_by_the_calibration_snapshot: >-
      THE DRIVER IS AUTHORED COMPLETE AT TASK-20260801-021, INCLUDING THE REAL-ARM ENTRY
      POINT THAT IS NOT EXECUTED THERE, AND ITS sha256 IS BOUND BY THE TASK-20260801-022
      SNAPSHOT. TASK-20260801-027 must execute the IDENTICAL file with no edit; the real
      run manifest records the driver sha256 and the Validator re-checks that it equals
      the calibration-time hash. A code change between calibration and the real arm would
      be an undetected route to tuning, and this closes it.
    clause_6_the_reviewer_owns_this_as_a_named_duty: >-
      THE INDEPENDENT REVIEWER AT TASK-20260801-025 IS CHARGED, AS A NAMED AND EXPLICIT
      DUTY WITH ITS OWN DELIVERABLE FILE, WITH CHECKING AGAINST GIT THAT THE FROZEN
      THRESHOLD RULE PREDATES THE CALIBRATION COMMIT, THAT THE NUMBERS SUBSTITUTED INTO
      THE READING RULE ARE THE ONES THE CALIBRATION ACTUALLY MEASURED, AND THAT NO
      SELECTION AMONG ALTERNATIVES OCCURRED WHERE THE CONTRACT PERMITTED ONLY A
      SUBSTITUTION. IF THE CALIBRATION APPEARS TO HAVE TUNED RATHER THAN SUPPLIED, THAT
      IS A REVISE.

  # ==================================================================
  metrics:
    note: >-
      DESCRIPTIVE INVENTORY OF WHAT THE TWO RUNS RECORD, AND NOTHING MORE. Every entry
      below is already fixed elsewhere in this file - in statistic_family STAT-EQD-1, in
      calibration_protocol CAL-EQD-1, in decision_variables DV-1 through DV-7, or in
      controls. THIS BLOCK ADDS NO STATISTIC, NO DECISION VARIABLE, NO THRESHOLD, NO
      RESOLUTION RUNG AND NO BRANCH CONDITION, and if it is ever read as adding one, the
      blocks named above govern and this one is wrong. Threshold NUMBERS appear nowhere
      here; they exist only as order statistics of the measured CAL-1 outputs under
      THR-EQD-1, substituted into reading_rule.yaml at TASK-20260801-023.
    primary_real_arm:
      - EQD_chi16: two-sample Pearson chi-square of homogeneity at K = 16 between OBJ-REAL and OBJ-NULL-RFB, per bit size, DV-1
      - EQD_chi64: two-sample Pearson chi-square of homogeneity at K = 64 between OBJ-REAL and OBJ-NULL-RFB, per bit size, DV-2
      - EQD_ks1_e1: one-dimensional two-sample Kolmogorov-Smirnov statistic on lift(e_1) between the two arms, per bit size, DV-3
      - EQD_ks1_e2: one-dimensional two-sample Kolmogorov-Smirnov statistic on lift(e_2) between the two arms, per bit size, DV-4
      - EQD_chi16_reject: boolean, EQD_chi16 strictly greater than its calibrated THR-EQD-1 threshold
      - EQD_chi64_reject: boolean, EQD_chi64 strictly greater than its calibrated THR-EQD-1 threshold
      - EQD_ks1_e1_reject: boolean, EQD_ks1_e1 strictly greater than its calibrated THR-EQD-1 threshold
      - EQD_ks1_e2_reject: boolean, EQD_ks1_e2 strictly greater than its calibrated THR-EQD-1 threshold
      - EQD_dup_real: count of exactly repeated (e_1, e_2) values within OBJ-REAL, per bit size, DV-5
      - EQD_dup_tell_fired: boolean, EQD_dup_real strictly outside its two-sided calibrated band, THE ARTIFACT TELL
      - EQD_power_certificate_rejected: boolean, PC-1 under CERT-EQD-1 re-run inside the real arm, DV-6, MUST be true
      - EQD_apparatus_identity_ok: boolean, the certifying statistic between two fresh independent OBJ-NULL-RFB draws failing to reject, DV-7, MUST be true
      - EQD_bit_size_not_distinguishable: boolean per bit size, the conjunction that none of DV-1 through DV-4 rejects
    primary_calibration_non_evidential:
      - CAL1_replicate_values: the 200 replicate values of each of STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1 and STAT-KS1-E2, per bit size, archived in full
      - CAL1_dup_values: the 400 individual STAT-DUP values, per bit size, archived in full
      - CAL2_detection_rate: measured detection rate of each statistic at each delta on the frozen ladder, per bit size
      - CAL2_certified_delta: the smallest delta meeting the CERT-EQD-1 predicate at both bit sizes, with its certifying statistic
      - CAL3_dependency_statistics: every statistic on 20 OBJ-NULL-IND versus OBJ-NULL-RFB comparisons, per bit size, instrument characterization only
      - CAL4_curve_order: the order of E(F_p), per bit size
      - CAL4_two_adic_valuation: the 2-adic valuation of the order of E(F_p), per bit size
      - CAL4_x_coordinate_set_size: the size of X_E, per bit size
      - CAL4_support_fraction_unif2: measured admissible-support fraction of one OBJ-NULL-UNIF2 draw, per bit size, an elliptic-curve fact and never a finding
      - CAL4_support_fraction_rfb: measured admissible-support fraction of one OBJ-NULL-RFB draw, per bit size, which must be exactly 1.0
    secondary_and_integrity:
      - pairs_recorded_per_arm: must be exactly 130816 on every arm, CTRL-EQD-RANGE
      - degenerate_draw_count: half-tuples with c_2 = 0, which must be exactly zero on every arm because the diagonal is excluded by construction
      - null_redraw_count: x-collision rejections on each random-factor-base draw, the only redraw permitted anywhere in this experiment
      - support_fraction_real: admissible-support fraction of OBJ-REAL, which must be exactly 1.0
      - s3_faithfulness_verified: verified over total for CTRL-EQD-S3, which must be 1000 of 1000 at both cells
      - empty_cell_omission_count: contingency-table cells empty in BOTH arms, omitted from the chi-square sum and from the degrees of freedom
      - factor_base_sha256: over the canonical decimal newline-joined x-list of the frozen deterministic factor base
      - null_factor_base_sha256: over the x-list of each random-factor-base draw
      - stream_hashes: the calibration null, plant, independent-pair and uniform-pair streams and the disjoint real-arm null stream
      - driver_sha256: hash of the frozen driver, compared by CTRL-EQD-DRIVER-HASH against the calibration-time value
      - fibre_invariant_map_sha256: hash of the frozen INT-2 implementation function source
      - peak_rss_bytes: resource accounting
      - wall_seconds_total: RECORDED FOR BUDGET ACCOUNTING ONLY, never a decision variable
    metrics_expressly_absent: >-
      NO largest prime factor, NO smoothness indicator, NO smooth fraction, NO Dickman
      rho evaluation, NO u ladder, NO factorization certificate, NO charged unit, NO
      operation count, NO cost ratio, NO R and NO search outcome is recorded anywhere in
      either run, because this experiment measures none of them.

  # ==================================================================
  decision_variables:
    - id: DV-1
      name: STAT-CHI-16 between OBJ-REAL and OBJ-NULL-RFB, per bit size
      threshold: calibrated under THR-EQD-1 from CAL-1
    - id: DV-2
      name: STAT-CHI-64 between OBJ-REAL and OBJ-NULL-RFB, per bit size
      threshold: calibrated under THR-EQD-1 from CAL-1
    - id: DV-3
      name: STAT-KS1-E1 between OBJ-REAL and OBJ-NULL-RFB, per bit size
      threshold: calibrated under THR-EQD-1 from CAL-1
    - id: DV-4
      name: STAT-KS1-E2 between OBJ-REAL and OBJ-NULL-RFB, per bit size
      threshold: calibrated under THR-EQD-1 from CAL-1
    - id: DV-5
      name: STAT-DUP on OBJ-REAL, per bit size
      threshold: two-sided calibrated band under THR-EQD-1
      role: THE ARTIFACT TELL. Fires branch N-1.
    - id: DV-6
      name: >-
        PC-1, the in-run power certificate - the certifying statistic of CERT-EQD-1
        between the certified OBJ-PLANT-delta object and a fresh OBJ-NULL-RFB draw
      required_outcome: MUST REJECT
      role: >-
        NOT EVIDENCE ABOUT H-EQD-001 OR HEUR-DS-1, AND IT MAY NOT BE CITED AS SUCH. It
        certifies IN THE SAME RUN, ON THE SAME CODE PATH, that the decision statistic can
        reject the alternative class it was calibrated against. Unlike EXP-SMTH-001's
        ENC-A certificate, which REV-20260801-012 found certified power against a
        DIFFERENT alternative from the one that mattered, this certificate is defined
        against exactly the alternative class the decision statistics face.
    - id: DV-7
      name: APPARATUS IDENTITY - the certifying statistic between two fresh independent OBJ-NULL-RFB draws
      required_outcome: MUST NOT REJECT
      role: >-
        Derivably the same law. A rejection is an implementation defect and suspends the
        map under N-5. ITS AGREEMENT IS NOT CORROBORATION OF ANYTHING and may not be
        reported as such. This is the RT048-H4 two-proxy reporting error handled in
        advance.

  decision_variable_variation_check:
    id: DV-CHECK
    why_this_block_exists: >-
      MANDATED BY THE BATCH-021 CLOSE AND RE-MANDATED BY THE BATCH-022 CLOSE. EV-DS-004
      N-2 and RT048-B1 established that the previous lane's charged-unit proxy was a
      CLOSED FORM IN THE PROTOCOL'S OWN MATCHED PARAMETERS, so the object cancelled and
      the variable could not discriminate the objects it compared. Every decision
      variable here is checked against that failure mode in advance and in writing, and
      the reviewer is directed to attack the check.
    dv_1_to_dv_4:
      verdict: VARY WITH WHAT THEY MEASURE, BY CONSTRUCTION OF THE MATCHED NULL
      argument: >-
        OBJ-REAL and OBJ-NULL-RFB share the field p, the curve (a, b), the map INT-2,
        the enumeration over i < j, the sample count n = 130816, the half-tuple
        dependency structure, the binning rule, the resolution ladder and the entire code
        path. THE ONLY DIFFERENCE IS THE SOURCE OF THE 512 POINTS. Therefore DV-1 through
        DV-4 deviate from their calibrated null values IF AND ONLY IF the deterministic
        factor-base policy induces structure in the fibre invariants that a uniformly
        random 512-point factor base does not. No protocol parameter survives into the
        comparison - not Bfb, not n, not K, not a seed - so no analogue of the 2/129
        degeneracy is available, and unlike charge_backend_units's constant 40 per call
        there is no closed form in the matched parameters. This is a checkable derivation.
      the_qualification_stated_honestly: >-
        "Deviates if and only if" is a statement about the SUPPORT of the deviation, not
        about the POWER to detect it - the exact qualification REV-20260801-012 recorded
        against the previous design, and it is repeated here rather than dropped. The
        power question is not left to argument this time: CAL-2 MEASURES the detection
        rate against a pre-declared alternative class, and CERT-EQD-1 turns that
        measurement into an in-run certificate. What remains uncertified is power against
        alternatives OUTSIDE the plant class, and that limitation is declared here and
        must be repeated in the evidence record.
    dv_5:
      verdict: VARIES WITH THE SUPPORT OF THE SAMPLED QUANTITY
      argument: >-
        STAT-DUP is a function of one arm alone and depends on no protocol parameter
        except n, which is matched. Its band is a measured quantile and not a modelled
        one, which matters because its idealized expectation differs by orders of
        magnitude between the two cells.
    dv_6:
      verdict: DELIBERATELY A PREDICTION, AND USED ONLY AS SUCH
      argument: >-
        PC-1's rejection is expected by construction, which under the BATCH-021 lesson
        makes it worthless as evidence. It is therefore NOT evidence, it is confined to
        certifying power, and the contract forbids citing it for any other purpose.
        Declaring the degeneracy and confining the variable to a role the degeneracy does
        not spoil is the correct handling.
    dv_7:
      verdict: DERIVABLY NON-REJECTING, AND CONFINED TO A GUARD
      argument: >-
        Two independent draws of the same object must not be distinguishable at a
        threshold calibrated on exactly that comparison. Its non-rejection carries no
        interpretive weight and is expressly declared NOT to be corroboration.
    variables_expressly_excluded: >-
      No wall-clock time, no charged unit, no operation count, no cost ratio, no R, no
      smoothness indicator, no largest prime factor and no Dickman evaluation appears
      anywhere in this experiment's decision space.

  # ==================================================================
  reading_rule_location:
    id: RR-EQD-1
    frozen_where: experiments/EXP-EQD-001/reading_rule.yaml
    frozen_by_task: TASK-20260801-023
    frozen_when: >-
      AFTER the calibration run and its snapshot, and BEFORE the independent review, the
      approval snapshot and the real arm. It is a SEPARATE FILE precisely so that this
      specification is written once and never edited - immutability is preserved by
      addition, not by versioning a hash-bound file.
    what_it_will_contain: >-
      The branch set N-0, N-5, N-1, N-2, N-4, N-6 with a declared precedence order; the
      NUMERIC thresholds substituted from CAL-1 under THR-EQD-1; the certified delta and
      the certifying statistic under CERT-EQD-1; any statistic excluded under
      CAL-STOP-1 second_stop_leg with its measured reason; and the attainability argument
      ATTAIN-RR-EQD-1 stating for every band and every branch, WITH MEASURED NUMBERS
      FROM THE CALIBRATION, that some achievable measurement lands there.
    branch_skeleton_frozen_here_so_the_numbers_cannot_reshape_it:
      precedence: >-
        N-0, then N-5, then N-1, then exactly one of N-2, N-4, N-6. The first branch in
        that order whose condition holds is the branch that fires. No result may be read
        into more than one branch and no result may fall outside all of them.
      N-0:
        name: INTEGRITY GUARD
        condition: >-
          ANY of the following - a sample set with other than 130816 recorded pairs; any
          recorded c_2 = 0 draw on any arm; a real-arm admissible-support fraction other
          than 1.0; a driver sha256 differing from the TASK-20260801-022 calibration-time
          hash; a CTRL-EQD-S3 faithfulness check below 1000 of 1000 at either cell; a
          threshold in the reading rule not traceable to a named CAL-1 order statistic;
          the frozen INT-2 map not reproducible by the Validator from the manifest alone;
          or any timeout, crash, resource exhaustion or budget cancellation.
        disposition: >-
          MAP SUSPENDED. Infrastructure or instrument signal, NEVER a mathematical result
          about H-EQD-001 or HEUR-DS-1 in either direction (AGENTS.md rule 5). Scoped
          repair, then re-run under the same frozen rule.
        hypothesis_transition: none
      N-5:
        name: APPARATUS FAILURE
        condition: >-
          ANY of three legs - (a) DV-6 PC-1 FAILS TO REJECT, so the apparatus cannot
          detect a deviation it was measured to detect at a rate of at least 0.95;
          (b) DV-7 REJECTS, so two draws of the same object are being distinguished;
          (c) the in-run null-vs-null statistics fall outside the archived CAL-1
          distribution by a margin declared numerically in the frozen reading rule, so
          the run-time instrument is not the calibrated instrument.
        disposition: MAP SUSPENDED. Instrument failure. No disposition in either direction.
        hypothesis_transition: none
      N-1:
        name: ARTIFACT TELL
        condition: DV-5 STAT-DUP falls outside its calibrated band on OBJ-REAL at either bit size.
        disposition: >-
          `inconclusive` on H-EQD-001, with a POSITIVE instrument finding - the sampled
          quantity is not behaving like the fibre invariant, so INT-2 as implemented is a
          stand-in. NOT a refutation and NOT support. Repair and re-run under the same
          frozen rule.
        hypothesis_transition: H-EQD-001 stays `analyzed`.
      N-2:
        name: NOT DISTINGUISHABLE FROM THE MATCHED NULL AT BOTH TOY CELLS
        condition: >-
          No N-0, no N-5, no N-1, AND at BOTH bits 16 and bits 20 every retained
          statistic of DV-1 through DV-4 fails to reject at its calibrated threshold.
        disposition: >-
          `replicate`. The deterministic factor base's fibre invariants are not
          distinguishable from a random factor base's at these resolutions, this n and
          these two toy cells. EXPLICITLY NOT `support`; NOT validation of HEUR-DS-1 at
          any tier; NOT a smoothness result of any kind; NOT S1_met, F1_met or F2_met;
          NOT any movement of G1-G4; and NOT a licence for any conditional asymptotic
          statement.
        hypothesis_transition: H-EQD-001 `analyzed` -> stays `analyzed`.
        mandatory_companions: >-
          A second-seed replication at a different curve instance per bit size, and the
          owed smoothness measurement OPEN-BATCH023-A, both ranked into the BATCH-024
          opening.
        knowledge_promotion_expectation: >-
          NOT WARRANTED. The gate fires on `support` or `reject_scoped` with `replicated`
          or `strong` evidence; `replicate` on a preliminary unreplicated set is neither.
      N-4:
        name: DISTINGUISHABLE FROM THE MATCHED NULL AT BOTH TOY CELLS
        condition: >-
          No N-0, no N-5, no N-1, AND at BOTH bit sizes at least one retained statistic
          of DV-1 through DV-4 rejects at its calibrated threshold.
        disposition: >-
          `weaken` on H-EQD-001, SCOPED EXACTLY to INT-2, the frozen deterministic
          factor-base policy at Bfb = 512, the two tested toy field sizes, m = 4 and the
          frozen resolution ladder. EXPLICITLY NOT `reject_scoped` and in particular NOT
          reject_scoped-as-impossibility - a single unreplicated run may not carry a
          scoped rejection. AND EXPLICITLY NOT AN ADVERSE FINDING ABOUT HEUR-DS-1 - a
          detected departure in the joint law at these resolutions does not establish
          that the induced smoothness law departs from Dickman, because this experiment
          measures no smoothness at all. It localizes where such a departure would have
          to come from.
        refutation_artifact_required: >-
          MANDATORY AND ARCHIVED BEFORE THE DECISION THAT RELIES ON IT. In order -
          (1) a COUNTEREXAMPLE CERTIFICATE, namely the contingency-table cells carrying
          the excess with their real and null counts and the half-tuples that populate
          them, from which an independent reader can recompute the offending statistic;
          then (2) a DERIVATION NOTE identifying the algebraic reason the deterministic
          factor base induces the departure; then (3) a declared `empirical_only` basis.
          The basis actually achieved must be declared; an undeclared basis is the
          failure, not the absence of a proof.
        hypothesis_transition: >-
          H-EQD-001 `analyzed` -> `weakened`, WITH A `status_scope` BLOCK WRITTEN INTO THE
          HYPOTHESIS RECORD IN THE SAME LEDGER COMMIT (RT048-B5 - a bare status field is
          unscoped by construction).
        knowledge_promotion_expectation: NOT WARRANTED on this package alone.
      N-6:
        name: SPLIT VERDICT ACROSS THE TWO CELLS
        condition: >-
          No N-0, no N-5, no N-1, AND exactly one of the two bit sizes satisfies the N-2
          conjunction while the other does not.
        disposition: >-
          `inconclusive`. The data do not discriminate the explanations. Record which cell
          rejected, on which statistic, at what value against what calibrated threshold.
          NO post-hoc success label and NO post-hoc failure label; in particular the
          passing cell may not be reported alone.
        hypothesis_transition: H-EQD-001 stays `analyzed`.
        knowledge_promotion_expectation: NOT WARRANTED.
      exhaustiveness_argument: >-
        Given that N-0, N-5 and N-1 do not fire, each of the two bit sizes either
        satisfies the N-2 conjunction or does not. Both satisfy -> N-2. Neither
        satisfies -> N-4. Exactly one satisfies -> N-6. Mutually exclusive, jointly
        exhaustive, with N-0, N-5 and N-1 pre-empting in the declared order.

  attainability_argument_form:
    id: ATTAIN-RR-EQD-1
    frozen_where: experiments/EXP-EQD-001/reading_rule.yaml at TASK-20260801-023
    why_it_is_mandatory: >-
      RETAINED AND EXTENDED. The attainability duty was introduced at BATCH-022 because
      BATCH-021 shipped a map that was exhaustive, honestly applied, and whose favourable
      branch was arithmetically unreachable. IT WORKED ON ITS FIRST USE - it caught two
      fatal defects before any compute was spent, and it caught them because the reviewer
      MEASURED the null rather than reasoning about it. It is retained here as a named
      duty of the independent reviewer and its rejection remains a REVISE. IT IS EXTENDED
      BY THE BATCH-022 LESSON - the attainability of each side of each branch must now be
      shown WITH MEASURED CALIBRATION NUMBERS, not with an analytic argument.
    what_it_must_contain:
      - >-
        For N-2 - the measured probability that a correct null reaches it, computed from
        the CAL-1 level and the eight-test structure, with the family-wise figure stated.
      - >-
        For N-4 - the measured CAL-2 detection rate at the certified delta at both cells,
        which is the demonstration that an achievable deviation lands there.
      - >-
        For N-1 - the measured CAL-1 STAT-DUP distribution at both cells, showing that
        the band is neither trivially wide nor trivially narrow, and a concrete
        achievable defect that would breach it.
      - >-
        For N-5 - a concrete achievable implementation for each of the three legs, and
        the measured margin by which a correct implementation does NOT fire it.
      - >-
        For N-0 - reachability by construction, with the wall-clock stop and the
        faithfulness control named.
      - >-
        For N-6 - a concrete route by which the two cells can diverge.
      - >-
        For EVERY RUNG of the resolution ladder - powered or declared unpowered in
        advance, with the n that would power it.
      - >-
        A statement, for each retained statistic, that BOTH SIDES of its threshold are
        reachable by an achievable measurement, with the measured number for each side.

  # ==================================================================
  controls:
    - id: CTRL-EQD-NULL
      method: OBJ-NULL-RFB through the identical pipeline at matched n = 130816 and the same curve.
      pass_condition: >-
        Present at every bit size for which a real sample is reported. If absent, no
        distributional reading of the real sample is admissible at all.
    - id: CTRL-EQD-S3
      method: >-
        For a frozen sample of 1000 half-tuples per cell, chosen as the first 1000 in the
        enumeration order, verify by ACTUAL POINT ARITHMETIC on E(F_p) that the root
        multiset of f_ij equals {x(P_i + P_j), x(P_i - P_j)}, through a code path that
        does not reuse the coefficient formula.
      pass_condition: 1000 of 1000 at both cells, or N-0 fires.
      why: >-
        This is the control that decides whether INT-2 is the intermediate or a new
        stand-in. RT047-H2 and RT048-H1 caught exactly that error in the previous
        sampling, twenty-one batches late.
    - id: CTRL-EQD-POWER
      method: PC-1 under CERT-EQD-1, re-run inside the real arm.
      pass_condition: MUST REJECT. Failure to reject suspends the map under N-5 leg (a).
    - id: CTRL-EQD-IDENTITY
      method: Two fresh independent OBJ-NULL-RFB draws against each other.
      pass_condition: MUST NOT REJECT. Rejection suspends the map under N-5 leg (b).
    - id: CTRL-EQD-RANGE
      method: Assert every recorded e_1 and e_2 lies in [0, p) and every recorded arm has exactly 130816 pairs.
      pass_condition: No violation, or N-0 fires.
    - id: CTRL-EQD-DRIVER-HASH
      method: >-
        Assert the driver sha256 recorded in the real run manifest equals the sha256
        bound by the TASK-20260801-022 calibration snapshot receipt.
      pass_condition: Equal, or N-0 fires. This is ATS-1 clause 5 made checkable.

  independent_variables:
    - field_bits: [16, 20]
    - object: [OBJ-REAL, OBJ-NULL-RFB, OBJ-NULL-IND, OBJ-NULL-UNIF2, OBJ-PLANT-delta]
    - resolution_K: [16, 64]
    - plant_delta: [0.005, 0.01, 0.02, 0.05, 0.1]
  fixed_variables:
    arity_m: 4
    factor_base_size_Bfb: 512
    real_factor_base_policy: frozen_deterministic_subset
    n_per_sample_set: 130816

  replication:
    master_seed: 2301
    seed_policy: >-
      Master seed 2301, chosen disjoint from the EXP-DS-001 seeds 101, 102 and 103 and
      from the EXP-SMTH-001 seed 2201, so that no stream of this experiment can coincide
      with a stream of either lane. The curve instance at each bit size is generated by
      harness.toycurve.generate_instance(2301, field_bits). The calibration null stream
      is 2301 + 10000 + field_bits, the calibration plant stream is 2301 + 20000 +
      field_bits, the calibration independent-pair stream is 2301 + 30000 + field_bits,
      the calibration uniform-pair stream is 2301 + 40000 + field_bits, and the REAL-ARM
      null stream is 2301 + 50000 + field_bits, disjoint from every calibration stream so
      that the real arm's matched null is not a calibration replicate. All stream hashes
      are recorded. OBJ-REAL IS EXHAUSTIVE AND CARRIES NO SAMPLING SEED.
    independent_instances: 2
    runs_planned: 2
    replication_status_declared: >-
      NONE. Two runs are planned and they are not replicates of each other - one is a
      non-evidential calibration and one is the single unreplicated real arm. No
      replication is claimed anywhere. A second-seed replication is a mandatory companion
      of N-2 and of N-4 and is ranked into the BATCH-024 opening under either.
    planned_runs:
      - id: RUN-EQD-001-calib
        purpose: >-
          CAL-1, CAL-2, CAL-3 and CAL-4 at both bit sizes, on NULL AND PLANTED OBJECTS
          ONLY. NON-EVIDENTIAL about every hypothesis. Gated on CALIBRATION_AUTHORIZATION
          at TASK-20260801-020.
      - id: RUN-EQD-001-real
        purpose: >-
          OBJ-REAL at both bit sizes against a fresh matched OBJ-NULL-RFB, plus the in-run
          PC-1 power certificate, the apparatus-identity pair, CTRL-EQD-S3 and the
          integrity controls. Gated on APPROVAL_DETERMINATION APPROVED at
          TASK-20260801-026.

  budget:
    calibration_run:
      wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 1
      dominant_cost: >-
        About 400 OBJ-NULL-RFB draws per cell for CAL-1 plus about 140 further draws for
        CAL-2, CAL-3 and CAL-4, each of 130816 fibre-invariant computations, that is of
        order 1.4 x 10**8 modular inversions in total across both cells. NO
        FACTORIZATION IS PERFORMED ANYWHERE, which is why this design is far cheaper than
        the one it replaces.
      memory_policy: >-
        Statistics are computed per replicate and only the per-replicate statistic values,
        the calibrated thresholds and the stream hashes are retained. The 1.4 x 10**8
        pairs are NOT archived; one representative OBJ-NULL-RFB draw per cell is archived
        for reproducibility, with its stream and seed recorded so that any replicate can
        be regenerated exactly.
    real_run:
      wall_clock_seconds: 1800
      maximum_memory_gb: 4
      maximum_runs: 1
    total_cpu_hours: 2
    new_dependencies: >-
      NONE beyond what the harness already records. No factorization library is needed
      at all. If any new dependency proves necessary the run is cancelled and reported,
      not extended.

  stopping_rules:
    - >-
      Calibration - stop when CAL-1 through CAL-4 are complete at both cells, or at
      wall_clock_seconds, whichever comes first. An incomplete calibration is reported
      incomplete; the reading rule is NOT frozen on a partial calibration and the batch
      records non-execution for the real arm.
    - >-
      Real arm - stop when every declared arm reaches n = 130816, or at
      wall_clock_seconds. A short arm is reported short and fires N-0; it is never
      padded, imputed or extrapolated.
    - Stop the whole run on any CTRL-EQD-S3 or CTRL-EQD-RANGE failure and report it.
    - >-
      A timeout, crash, memory exhaustion or budget cancellation is recorded as such and
      is NEVER a mathematical negative (AGENTS.md rule 5).

  invalidation_rules:
    - Any recorded e_1 or e_2 outside [0, p) invalidates its sample set.
    - Any arm with other than 130816 pairs invalidates the comparison it enters.
    - Any recorded c_2 = 0 draw invalidates the run, the diagonal being excluded by construction.
    - >-
      Real and null arms differing in n, in the curve, in the map, in the enumeration or
      in any pipeline code path other than the source of the 512 points invalidates the
      comparison.
    - >-
      A real-arm driver sha256 differing from the calibration-time hash invalidates the
      real run outright.
    - >-
      Any threshold used in the reading rule that is not traceable to a named CAL-1
      order statistic invalidates the reading.
    - >-
      Any edit to THIS file after TASK-20260801-020, or to reading_rule.yaml after
      TASK-20260801-024, without a versioned protocol_amendment is an integrity failure,
      not a result.
    - >-
      Any search arm, timing decision variable, cost identity, R, factorization or
      smoothness statistic appearing anywhere in either run package invalidates that
      package for scope violation.

  success_criterion: >-
    S-EQD-1 - a COMPLETE VALID CALIBRATION under CAL-EQD-1 with a certified delta under
    CERT-EQD-1, followed by a COMPLETE VALID REAL ARM with every declared arm at
    n = 130816, CTRL-EQD-S3 at 1000 of 1000 at both cells, no N-0 guard fired and no N-5
    apparatus leg fired, so that exactly one of N-1, N-2, N-4 or N-6 can be read off the
    frozen rule. S-EQD-1 IS A COMPLETENESS CRITERION AND NOT A DIRECTIONAL ONE - this
    experiment is a measurement and it succeeds by measuring, not by the measurement
    coming out any particular way. No branch constitutes `support` for anything.

  falsification_criterion: >-
    F-EQD-1 - branch N-4, the real sample distinguishable from the matched null at both
    cells at the calibrated thresholds, with PC-1 rejecting and DV-7 not rejecting.
    H-EQD-001 is then reported FAILED AT TOY SCALE, scoped exactly to INT-2, the
    deterministic factor-base policy at Bfb = 512, the two field sizes, m = 4 and the
    frozen resolution ladder. This is a `weaken`, never a `reject_scoped`, and it is
    never a statement about HEUR-DS-1 in either direction.
    F-EQD-2 - branch N-1, the artifact tell, which falsifies the INSTRUMENT and not the
    hypothesis and is labelled as such.
    F-EQD-3 - CAL-STOP-1, no certified power at any delta on the frozen ladder. That
    falsifies the APPARATUS before the real arm runs, records non-execution, and is
    never a result about any object.

  outcome_disposition:
    N-0_or_N-5: inconclusive on the instrument; infrastructure signal; AGENTS.md rule 5; no mathematical negative.
    N-1: inconclusive on H-EQD-001 with a positive instrument finding; repair INT-2.
    N-2: replicate; explicitly not support; companions ranked into BATCH-024.
    N-4: weaken scoped, with a status_scope block and a refutation artifact archived first; never reject_scoped; never an adverse finding about HEUR-DS-1.
    N-6: inconclusive; no post-hoc label; a third field size and a second seed next.
    CAL-STOP-1: non-execution of the real arm; apparatus repair named; no disposition about any hypothesis.

  required_artifacts:
    - experiments/EXP-EQD-001/specification.yaml
    - experiments/EXP-EQD-001/implementation/eqd001_driver.py
    - experiments/EXP-EQD-001/implementation/implementation.md
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/manifest.yaml
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/raw-result.json
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/command.txt
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/environment.json
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/stdout.log
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/stderr.log
    - experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json
    - experiments/EXP-EQD-001/results/calib/power_curve.json
    - experiments/EXP-EQD-001/results/calib/instrument_characterization.json
    - experiments/EXP-EQD-001/reading_rule.yaml
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/manifest.yaml
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/raw-result.json
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/command.txt
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/environment.json
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/stdout.log
    - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/stderr.log
    - experiments/EXP-EQD-001/results/real/EQD_report.json
    - experiments/EXP-EQD-001/results/real/matched_null_comparison.json
    - experiments/EXP-EQD-001/results/real/power_certificate.json

  manifest_filename_policy:
    decision: manifest.yaml
    rationale: >-
      CARRIED FORWARD FROM DEC-20260801-006.manifest_filename_ruling AND ITS REASON IS
      REPEATED RATHER THAN ASSUMED. tools/validate_ledger.py indexes run records by
      globbing experiments/*/runs/*/manifest.yaml only, so a manifest.json run is
      invisible and any evidence record citing it is reported as referencing an unknown
      run. Both runs of this experiment therefore emit manifest.yaml.
    consequences_accepted: >-
      Because manifest.yaml IS indexed, check_run applies in full, so both run packages
      carry the exact companion filenames it demands - command.txt, environment.json,
      stdout.log, stderr.log and raw-result.json, NOTE THE .log RATHER THAN .txt - and
      the manifest's required fields id, experiment_id, status, code with commit and
      command, environment, inputs, timing and result. Neither run claims a discrete
      logarithm or a decomposition, so result.certificate.kind is the literal string
      none in both.
    it_repairs_nothing_upstream: >-
      THIS REPAIRS NOTHING IN EXP-DS-001 AND IS NOT A REPAIR OF IT. Those contracts and
      run packages are immutable and are not touched. The defect is carried as
      OPEN-BATCH022-A.

  assigned_to: executor
  approval_determination_location:
    calibration: >-
      CALIBRATION_AUTHORIZATION, with the literal value AUTHORIZED or NOT AUTHORIZED, in
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json.
    real_arm: >-
      APPROVAL_DETERMINATION, with the literal value APPROVED or NOT APPROVED, in
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-026/snapshot_commit_receipt.json,
      after the independent review at TASK-20260801-025. No Executor handoff for the real
      arm is authorized until that receipt records APPROVED. Committing a review is not
      approving it.

  does_not_modify_hypotheses:
    - H-DS-001
    - H-IC-001
    - H-STR-002
    - H-SMTH-001
    - H-SEMAEV-001
    - H-SEMAEV-002
  does_not_modify_records:
    - experiments/EXP-DS-001 (every file, including all specifications, controls, amendments, drivers, runs and results)
    - experiments/EXP-SMTH-001/specification.yaml
    - EV-DS-001
    - EV-DS-002
    - EV-DS-003
    - EV-DS-004
    - every DEC record other than DEC-20260801-007 and the declared BATCH-023 close
    - GOAL-FAEST-001 and every FAEST artifact
    - every XEDN artifact

  binding_constraints_inherited:
    note: >-
      Carried forward from the BATCH-021 and BATCH-022 closes and binding on every
      deliverable that cites this contract.
    ids:
      - RT047-B5
      - RT048-B1
      - RT048-B2
      - RT048-B5
      - RT048-B9
      - RT048-H1
      - RT048-H2
      - RT048-M1
      - RV012-A1
      - RV012-A2
      - RV012-B1
      - RV012-B2
      - RV012-B3
      - RV012-B6
    how_each_RV012_finding_is_addressed:
      RV012-A1: >-
        Repaired structurally. No analytic-model threshold exists anywhere in this
        contract; every threshold is a measured quantile with an exact stated level.
      RV012-A2: >-
        Repaired by construction. The diagonal is excluded by enumerating i < j, the
        sample count is declared at 130816 accordingly, and any c_2 = 0 draw is an
        integrity failure rather than an undeclared implementation reading.
      RV012-B1: >-
        Addressed by not making the attainability argument analytic at all. Every leg of
        ATTAIN-RR-EQD-1 must cite a measured calibration number.
      RV012-B2: >-
        Addressed by removing the knife-edge entirely - there is no fixed threshold whose
        margin against systematic model bias could be consumed, because there is no model.
      RV012-B3: >-
        The trap is not carried. The EXP-SMTH-001 u = 6 remedy is NOT ranked into this
        batch and is NOT inherited; POW-EQD-1 states its own sample-size remedy for its
        own excluded rung and that remedy is a sample-size statement about a chi-square
        cell count, not about a smoothness rate.
      RV012-B6: >-
        Addressed by deleting the encoding step. There is no ENC-B, no integer encoding
        and therefore no vacuous justification for one; the pair is measured directly and
        CTRL-EQD-S3 checks that the pair is the fibre invariant.
