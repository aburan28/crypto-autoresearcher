experiment:
  id: EXP-EQD-001
  hypothesis_id: H-EQD-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  question_id: RQ-ECDLP-002
  batch_id: BATCH-023
  source_review: REV-20260801-012
  source_review_files:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  authorizing_decision_id: DEC-20260801-007
  version: 1
  supersedes_version: null
  protocol_amendment_id: null
  title: >-
    Direct measurement of the joint law of the half-arity Semaev fibre invariants
    (e_1, e_2) against a matched random-factor-base null, with every threshold
    calibrated from a measured null distribution before the reading rule is frozen,
    and with the rejection side of every substantive branch certified by a measured
    power curve against pre-declared planted deviations
  status: review_required
  approved_by: null
  approved_by_note: >-
    NULL BY DESIGN. Approval is NOT a field in this file and is never recorded by
    editing it. TWO SEPARATE AUTHORIZATIONS EXIST IN THIS BATCH AND THEY ARE NOT THE
    SAME THING. (1) CALIBRATION_AUTHORIZATION for the NON-EVIDENTIAL calibration run
    RUN-EQD-001-calib is recorded in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json.
    (2) APPROVAL_DETERMINATION for the real arm RUN-EQD-001-real is recorded in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-026/snapshot_commit_receipt.json,
    after the independent review at TASK-20260801-025. No Executor handoff for the
