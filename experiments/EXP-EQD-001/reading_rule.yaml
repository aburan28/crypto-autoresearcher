# =====================================================================
# RR-EQD-1 - THE FROZEN READING RULE FOR EXP-EQD-001
#
# Frozen at TASK-20260801-023 by the Coordinator, AFTER the calibration run
# RUN-EQD-001-calib and its snapshot 53e202dd, AFTER the independent
# calibration validation VAL-20260801-003 returned ADMISSIBLE, and BEFORE the
# independent review at TASK-20260801-025, the approval determination at
# TASK-20260801-026 and the real arm at TASK-20260801-027.
#
# THIS FILE ADDS NUMBERS TO A FROZEN FORM. It does not amend, version or
# supersede experiments/EXP-EQD-001/specification.yaml, which is hash-bound at
# sha256 295d85c748cf9d1d14e2746d3067fbbbc0a7fc9ebd8b62ccbdbe021a6dc99431
# (the 7792331b hash-binding named in the handoff) and is not edited here.
# Immutability is preserved by ADDITION, which is why the reading rule is a
# separate file.
#
# THE `reading_rule:` MAPPING BELOW IS THE MACHINE-READ PART. Everything under
# `record:` is documentation for human readers and reviewers and is not read by
# the driver. The driver's load_reading_rule() requires exactly five fields -
# retained_statistics, thresholds, dup_band, certified_delta,
# certifying_statistic - and run_real_arm() indexes thresholds and dup_band
# with an INTEGER bit-size key. The bit-size keys below are therefore written
# as BARE INTEGERS. See record.driver_shape_conformance.
# =====================================================================

reading_rule:

  # -------------------------------------------------------------------
  # THE FIVE FIELDS THE DRIVER READS
  # -------------------------------------------------------------------

  # DV-1, DV-2, DV-3 retained. DV-4 (STAT-KS1-E2) EXCLUDED under CAL-STOP-1
  # second_stop_leg - see record.excluded_statistics.
  retained_statistics:
    - STAT-CHI-16
    - STAT-CHI-64
    - STAT-KS1-E1

  # THR-EQD-1. Each value is the 199th ASCENDING ORDER STATISTIC of that
  # statistic's 200 CAL-1 replicate values at that bit size, taken from
  # experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json at
  # cells.<bits>.replicate_values.<STAT> and cross-checked against
  # cells.<bits>.measured_order_statistics.<STAT>.value_at_199th_order_statistic.
  # A comparison REJECTS iff its statistic is STRICTLY GREATER than the value.
  thresholds:
    16:
      STAT-CHI-16: 315.4755320010126
      STAT-CHI-64: 4345.885305765976
      STAT-KS1-E1: 0.006191903131115506
    20:
      STAT-CHI-16: 326.2209621328956
      STAT-CHI-64: 4293.229704961268
      STAT-KS1-E1: 0.006841670743639949

  # THR-EQD-1 two-sided band for DV-5 / STAT-DUP - [3rd order statistic,
  # 398th order statistic] of the 400 CAL-1 STAT-DUP values at that bit size,
  # from null_replicate_statistics.json cells.<bits>.dup_values. The tell FIRES
  # iff the observed count lies STRICTLY OUTSIDE the band.
  # ITS DECLARED EXACT LEVEL OF 0.01247 IS NOT ATTAINED AT EITHER CELL AND THE
  # BELOW-BAND LEG IS UNREACHABLE AT BOTH. See record.stat_dup_handling.
  dup_band:
    16: [0, 110]
    20: [0, 0]

  # CERT-EQD-1, evaluated as the frozen predicate against the archived CAL-2
  # detection rates. See record.certified_delta_derivation.
  certified_delta: 0.05
  certifying_statistic: STAT-CHI-16

# =====================================================================
# DOCUMENTATION. NOT READ BY THE DRIVER.
# =====================================================================
record:

  id: RR-EQD-1
  experiment_id: EXP-EQD-001
  hypothesis_id: H-EQD-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-023
  frozen_by_task: TASK-20260801-023
  frozen_on: '2026-08-01'
  archived_by_task: TASK-20260801-024
  claim_tier: toy
  version: 1
  supersedes_version: null
  protocol_amendment_id: null

  sources_of_every_number_in_this_file:
    - >-
      experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json at
      snapshot 53e202dd - the 200 raw CAL-1 replicate values per statistic per
      cell and the 400 raw STAT-DUP values per cell.
    - >-
      experiments/EXP-EQD-001/results/calib/power_curve.json at snapshot
      53e202dd - the 20 raw CAL-2 replicate rows per delta per cell and the
      mechanically computed detection rates.
    - >-
      experiments/EXP-EQD-001/results/calib/instrument_characterization.json at
      snapshot 53e202dd - CAL-3, CAL-4 and the representative null draw.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-032/calibration_validation_report.yaml
      (VAL-20260801-003, sha256
      8eb593a0c4ef035f4e1b672bde00b431c611c3bf255041181094b764d40312c5), verdict
      passed, admissibility ADMISSIBLE.
  no_real_datum_consulted: >-
    NO STATISTIC OF OBJ-REAL EXISTS AND NONE WAS CONSULTED. The real arm has not
    been run, is not authorized here, and its authorization gate is
    TASK-20260801-026. This file authorizes nothing.
  no_hypothesis_disposition: >-
    NO DISPOSITION IS STATED HERE ABOUT H-EQD-001, HEUR-DS-1, H-SMTH-001,
    H-DS-001, H-IC-001 or H-STR-002, in either direction. RUN-EQD-001-calib is
    expressly NON-EVIDENTIAL about every hypothesis and every number in this file
    is an INSTRUMENT CONSTANT, never a result about the Semaev map.

  # ===================================================================
  # 1. THE CAL-STOP-1 GATE, CHECKED FIRST AND STATED EXPLICITLY
  # ===================================================================
  cal_stop_1_gate_check:
    checked_before_anything_else: true
    rule_as_frozen: >-
      CAL-STOP-1 first leg - if NO delta on the frozen ladder reaches a 0.95
      detection rate at both bit sizes, TASK-20260801-023 DOES NOT FREEZE A
      READING RULE, the batch records NON-EXECUTION for the real arm, and the
      named repairs are a larger n or a different statistic.
    how_it_was_checked: >-
      The full CAL-2 detection-rate table was read directly out of
      power_curve.json cells.<bits>.per_delta.<delta>.measured_detection_rates
      at both cells, all five deltas and all four statistics, and the CERT-EQD-1
      predicate was evaluated against it by hand. The Validator's arithmetic was
      NOT adopted; it was recomputed here and then compared, and it agrees.
    measured_detection_rate_table_STAT_CHI_16_and_STAT_CHI_64:
      - >-
        delta 0.005 - STAT-CHI-16 0/20 at bits 16 and 0/20 at bits 20;
        STAT-CHI-64 0/20 and 0/20. Bar not met.
      - >-
        delta 0.01 - STAT-CHI-16 0/20 and 0/20; STAT-CHI-64 1/20 and 0/20. Bar
        not met.
      - >-
        delta 0.02 - STAT-CHI-16 1/20 and 0/20; STAT-CHI-64 0/20 and 1/20. Bar
        not met.
      - >-
        delta 0.05 - STAT-CHI-16 20/20 at bits 16 AND 20/20 at bits 20, that is
        1.00 and 1.00, BOTH at or above 0.95. STAT-CHI-64 5/20 and 9/20, bar not
        met. THE BAR IS MET HERE, BY STAT-CHI-16, AT BOTH CELLS.
      - >-
        delta 0.10 - STAT-CHI-16 20/20 and 20/20; STAT-CHI-64 20/20 and 20/20.
        Bar met, but 0.10 is not the smallest such delta.
    first_leg_result: >-
      CAL-STOP-1 FIRST LEG IS NOT MET. A delta on the frozen ladder does reach
      a 0.95 detection rate at both bit sizes for one of the two statistics
      CERT-EQD-1 admits, namely delta 0.05 via STAT-CHI-16 at 20 of 20 in each
      cell. The apparatus therefore has certified power against the pre-declared
      alternative class and the stop does not fire.
    consequence: >-
      A READING RULE IS FROZEN. Non-execution is NOT recorded. This is the
      outcome the measured data support and it was determined by evaluating the
      frozen predicate on the archived table before any other question in this
      task was considered.
    second_leg_result: >-
      CAL-STOP-1 SECOND LEG IS MET FOR EXACTLY ONE STATISTIC, STAT-KS1-E2, which
      is excluded below with its measured reason. It is met for no other
      statistic. Excluding one of the four two-sample statistics does not fire
      the first leg, because the first leg is a statement about STAT-CHI-16 and
      STAT-CHI-64 only and both are retained.
    precision_caveat_carried_forward: >-
      With R_REPS = 20 the 0.95 bar can only be met by 19 of 20 or 20 of 20, so
      the certification is effectively a 20-of-20 test. A statistic whose true
      power is 0.90 passes it about 12 percent of the time and one whose true
      power is 0.97 fails it about 46 percent of the time. THE CERTIFIED DELTA IS
      A COARSE QUANTITY. That is a limitation of the calibration budget, not of
      the arithmetic, and it is carried into every deliverable that cites this
      file.

  # ===================================================================
  # 2. THE FROZEN THRESHOLDS AND THEIR ORDER-STATISTIC PROVENANCE
  # ===================================================================
  threshold_provenance:
    rule_applied: >-
      THR-EQD-1 one_sided_statistics, unchanged - the 199th ascending order
      statistic of that statistic's 200 CAL-1 replicate values at that bit size,
      with a strict-greater rejection rule and an exact false-rejection
      probability of (201 - 199) / 201 = 0.00995 on the measured null.
    verification_performed_here: >-
      For the certifying statistic STAT-CHI-16 the 199th order statistic was
      verified DIRECTLY FROM THE RAW ARRAY at both cells, not from the archived
      summary. At bits 16, cells.16.replicate_values.STAT-CHI-16 contains
      exactly two values at or above 315.4755320010126 - the value itself and
      321.9563383966048 - so 315.4755320010126 is the 199th of 200 ascending and
      321.9563383966048 is the 200th. At bits 20, cells.20.replicate_values
      .STAT-CHI-16 contains exactly two values at or above 326.2209621328956 -
      the value itself and 335.54712432476106 - giving the same conclusion. The
      remaining thresholds were taken from
      cells.<bits>.measured_order_statistics.<STAT>.value_at_199th_order_statistic
      and independently corroborated by the reference_199th_order_statistic
      recorded at every CAL-2 call site in power_curve.json, which the driver
      recomputes from the CAL-1 raw values on each call, and by the Validator's
      mechanical recomputation from raw (VAL-20260801-003 metric recomputation
      M-1, EXACT AGREEMENT at all eight statistic-by-cell combinations).
    entries:
      - statistic: STAT-CHI-16
        bits: 16
        value: 315.4755320010126
        provenance: >-
          199th ascending order statistic of the 200 values at
          null_replicate_statistics.json cells.16.replicate_values.STAT-CHI-16.
          200th (max) is 321.9563383966048, min 182.87972687693338, median
          251.63297092830422, mean 253.00642261409135, sample stdev
          24.687859401225193.
      - statistic: STAT-CHI-64
        bits: 16
        value: 4345.885305765976
        provenance: >-
          199th ascending order statistic of the 200 values at
          cells.16.replicate_values.STAT-CHI-64. 200th 4369.967486822548, min
          3796.966669012837, median 4102.650595717392, stdev 88.5028592288289.
      - statistic: STAT-KS1-E1
        bits: 16
        value: 0.006191903131115506
        provenance: >-
          199th ascending order statistic of the 200 values at
          cells.16.replicate_values.STAT-KS1-E1. 200th 0.006604696673189858, min
          0.0013224681996086285, median 0.0032488380626223, stdev
          0.0010071426979296023.
      - statistic: STAT-CHI-16
        bits: 20
        value: 326.2209621328956
        provenance: >-
          199th ascending order statistic of the 200 values at
          cells.20.replicate_values.STAT-CHI-16. 200th 335.54712432476106, min
          191.40792384797555, median 259.16705582373555, stdev
          25.60403655591454.
      - statistic: STAT-CHI-64
        bits: 20
        value: 4293.229704961268
        provenance: >-
          199th ascending order statistic of the 200 values at
          cells.20.replicate_values.STAT-CHI-64. 200th 4386.004326990979, min
          3823.527058864991, median 4096.8640921252145, stdev
          93.98343213614984.
      - statistic: STAT-KS1-E1
        bits: 20
        value: 0.006841670743639949
        provenance: >-
          199th ascending order statistic of the 200 values at
          cells.20.replicate_values.STAT-KS1-E1. 200th 0.006933402641878694, min
          0.0017046844422700658, median 0.003214438600782743, stdev
          0.0010658171230544695.
      - statistic: STAT-DUP
        bits: 16
        value: '[0, 110]'
        provenance: >-
          3rd and 398th ascending order statistics of the 400 values at
          cells.16.dup_values. VERIFIED DIRECTLY FROM THE RAW ARRAY HERE - the
          400 entries contain exactly 11 zeros, exactly 5 values equal to 110 and
          exactly 2 values strictly above 110 (182 and 132), so positions 1-11
          are 0 (making the 3rd order statistic 0) and positions 394-398 are 110
          (making the 398th 110). min 0, max 182, median 20.0, mean 30.8225.
      - statistic: STAT-DUP
        bits: 20
        value: '[0, 0]'
        provenance: >-
          3rd and 398th ascending order statistics of the 400 values at
          cells.20.dup_values. VERIFIED DIRECTLY FROM THE RAW ARRAY HERE - all
          400 entries are exactly 0. min 0, max 0, median 0.0, mean 0.0, sample
          variance exactly 0.
    no_other_threshold_exists: >-
      Every number used as a threshold anywhere in this file is one of the eight
      entries above, plus the two N-5 leg (c) margins, which are themselves named
      order statistics of the same named CAL-1 arrays (the 1st and 200th
      ascending of cells.<bits>.replicate_values.STAT-CHI-16). There is no other
      threshold. Any number appearing as a threshold that cannot be traced to a
      named CAL-1 order statistic is an integrity failure and fires N-0.

  # ===================================================================
  # 3. CERT-EQD-1 - THE CERTIFIED DELTA
  # ===================================================================
  certified_delta_derivation:
    predicate_as_frozen: >-
      The SMALLEST delta on the frozen ladder [0.005, 0.01, 0.02, 0.05, 0.10]
      whose measured CAL-2 detection rate is at least 0.95 at BOTH bit sizes for
      at least one of STAT-CHI-16 or STAT-CHI-64, tie-broken smallest delta
      first, then STAT-CHI-64 before STAT-CHI-16.
    evaluation: >-
      Deltas 0.005, 0.01 and 0.02 fail the bar for both admitted statistics at
      one or both cells. Delta 0.05 meets it for STAT-CHI-16 at 20 of 20 in each
      cell and fails it for STAT-CHI-64 at 5 of 20 and 9 of 20. The smallest
      qualifying delta is therefore 0.05 and the tie-break between the two
      statistics does not arise, because only STAT-CHI-16 qualifies at 0.05.
    certified_delta: 0.05
    certifying_statistic: STAT-CHI-16
    n_replaced_at_this_delta: >-
      6541 of 130816 pairs, equal to int(round(0.05 * 130816)) at both cells, as
      recorded in every CAL-2 replicate row at delta 0.05.
    in_run_use: >-
      PC-1 under DV-6 / CTRL-EQD-POWER re-runs an OBJ-PLANT-0.05 object against
      a fresh OBJ-NULL-RFB draw inside the real arm and compares STAT-CHI-16
      against the frozen threshold at that cell. PC-1 MUST REJECT; failure to
      reject fires N-5 leg (a). PC-1 IS NOT EVIDENCE ABOUT H-EQD-001 OR HEUR-DS-1
      AND MAY NOT BE CITED AS SUCH.
    a_measured_fact_that_does_not_change_the_certified_delta: >-
      STAT-KS1-E1 reaches 20 of 20 at BOTH cells already at delta 0.02, a
      stronger measured power fact than the certifying statistic's. CERT-EQD-1
      admits only STAT-CHI-16 and STAT-CHI-64 as certifying statistics, so this
      does not lower the certified delta and is recorded as a measured fact
      rather than acted on. Acting on it would be selection where the contract
      permits only substitution.

  # ===================================================================
  # 4. STATISTICS EXCLUDED UNDER CAL-STOP-1 SECOND_STOP_LEG
  # ===================================================================
  excluded_statistics:
    - id: STAT-KS1-E2
      decision_variable: DV-4
      excluded: true
      ground: >-
        CAL-STOP-1 second_stop_leg, third ground - a threshold that the CAL-2
        plant at the largest delta cannot exceed.
      reading_of_cannot_exceed_applied_and_why: >-
        THE READING APPLIED IS "HAS NO POWER AGAINST THE DECLARED ALTERNATIVE
        CLASS BY CONSTRUCTION", NOT "DID NOT HAPPEN TO EXCEED IN 20 REPLICATES",
        and the reason is that the second reading is not a property of the
        statistic at all. Under the sampling reading the two cells disagree - at
        bits 20 the largest-delta plant exceeded the threshold 0 of 20 times and
        at bits 16 it exceeded it 1 of 20 times - so that reading would exclude
        the statistic at one cell and retain it at the other, which the branch
        structure cannot express. The construction reading resolves the cells
        uniformly and is the one the leg's own stated purpose names - it permits
        exclusion "ONLY toward removing a variable that cannot discriminate".
      measured_reason: >-
        DEDUCTIVE, FROM THE PLANT CONSTRUCTION FROZEN AT TASK-20260801-019 BEFORE
        ANY CALIBRATION NUMBER EXISTED. OBJ-PLANT-delta replaces the e_1
        coordinate of a delta fraction of pairs with a uniform draw from
        [0, floor(p/2)) and LEAVES e_2 UNCHANGED (specification.yaml objects
        OBJ-PLANT-delta; driver lines 435-447, out1 modified and e_2 returned as
        a copy; verified against the source by VAL-20260801-003 DS-b).
        STAT-KS1-E2 is a marginal two-sample statistic on e_2 alone. Under
        OBJ-PLANT-delta its law is therefore EXACTLY the null law, at every delta
        on the ladder, at both cells. Its measured "detection rates" ARE ITS
        FALSE-REJECTION RATES.
      measured_numbers: >-
        bits 16 - 0/20, 1/20, 0/20, 1/20, 1/20 at deltas 0.005, 0.01, 0.02, 0.05,
        0.10, that is 4 exceedances in 100 CAL-2 comparisons against an expected
        0.995 at the per-test level of 0.00995 (Poisson P(X >= 4 | 1) is about
        0.019, mildly high and not a signal). bits 20 - 0/20 at every delta, 0
        exceedances in 100. The plant-arm MEAN of STAT-KS1-E2 differs from the
        null mean by at most 0.66 null standard deviations at any delta at either
        cell, and the SIGN of the shift is not monotone in delta (+0.03, +0.16,
        -0.25, +0.58, +0.06 at bits 16; -0.66, +0.11, +0.02, +0.05, -0.50 at
        bits 20). There is no decay-with-parameter structure to find because
        there is no parameter dependence.
      why_this_matters_for_the_freeze: >-
        A THRESHOLD FROZEN ON THIS STATISTIC WOULD BE A DECISION VARIABLE THAT
        CANNOT DECIDE. It could only ever move the reading rule away from N-2 by
        false rejection, at 0.00995 per cell, with no compensating power against
        the alternative class the apparatus exists to detect. That is the
        BATCH-021 degeneracy class - a variable whose value does not depend on
        the thing it is supposed to measure - arriving through a different door,
        and the pre-declared mechanism exists precisely to remove it.
      what_is_NOT_claimed: >-
        The exclusion is scoped to the alternative class on the frozen ladder.
        STAT-KS1-E2 retains a live role against alternatives that move the e_2
        marginal; no such alternative is on the ladder, so the calibration
        certifies nothing about it in either direction. This is a statement about
        an uncertified instrument, not about the Semaev map.
      this_removes_a_variable_and_adds_none: >-
        The branch set, the precedence, the statistic forms, K, the replicate
        counts, the quantile, the plant construction and the delta ladder are all
        unchanged. Exactly one decision variable is removed. NO VARIABLE IS ADDED
        ANYWHERE IN THIS FILE.
    - id: STAT-CHI-64
      decision_variable: DV-2
      excluded: false
      measured_reason_for_retention: >-
        RETAINED. It meets NONE of the three second_stop_leg grounds - its null
        distribution has non-zero variance (stdev 88.50 at bits 16 and 93.98 at
        bits 20), it is not identically zero, and the largest-delta plant DOES
        exceed its threshold, 20 of 20 at both cells. The non-monotone detection
        sequence at bits 16 (0.00, 0.05, 0.00, 0.25, 1.00) is NOISE, not
        degeneracy - the underlying plant-arm mean shift is monotone at -0.33,
        +0.10, +0.05, +1.84, +7.22 null standard deviations across the ladder,
        and the lone exceedance at delta 0.01 is one draw of 20 reaching 4387.97
        against a threshold of 4345.89, entirely consistent with the per-test
        level of 0.00995 (P of at least one in 20 draws is 0.18).
      declared_limitation: >-
        IT IS A LOW-POWER STATISTIC AGAINST THIS ALTERNATIVE CLASS AND THAT IS
        DECLARED HERE RATHER THAN DISCOVERED LATER. At delta 0.05 at bits 16 its
        plant-arm mean shift is +1.84 null sd against STAT-CHI-16's +6.22, which
        is the expected cost of spreading 130816 points over 4096 cells instead
        of 256. It reaches the 0.95 bar only at delta 0.10. Its retention is
        therefore conservative - it can reject and does so at the calibrated
        level, but a non-rejection by STAT-CHI-64 alone is weak information and
        no deliverable may present it otherwise.
      precision_caveat: >-
        Each CAL-2 rate rests on 20 replicates, so a rate of 0.25 carries a
        standard error of about 0.10. The ORDERING of two statistics' rates at a
        single delta is not resolved by these numbers; the mean-shift figures are
        the better-resolved quantity and are the ones cited above.
    - id: STAT-CHI-16
      decision_variable: DV-1
      excluded: false
      measured_reason_for_retention: >-
        RETAINED and it is the certifying statistic. Non-zero variance (stdev
        24.69 and 25.60), not identically zero, and exceeded by the largest-delta
        plant 20 of 20 at both cells and by the delta-0.05 plant 20 of 20 at both
        cells.
    - id: STAT-KS1-E1
      decision_variable: DV-3
      excluded: false
      measured_reason_for_retention: >-
        RETAINED. Non-zero variance (stdev 0.001007 and 0.001066), not
        identically zero, and exceeded by the largest-delta plant 20 of 20 at
        both cells. It is the most sensitive retained statistic against this
        alternative class, reaching 20 of 20 at both cells at delta 0.02 - which
        is expected, since the plant acts on the e_1 marginal and this is the
        marginal test on e_1.

  # ===================================================================
  # 5. STAT-DUP / DV-5 - RETAINED WITH ITS DEGENERACY DECLARED
  # ===================================================================
  stat_dup_handling:
    is_it_excluded: >-
      NO, AND THE REASON IS TEXTUAL AS WELL AS STRUCTURAL. CAL-STOP-1
      second_stop_leg is written over "the four two-sample statistics"; STAT-DUP
      is a one-arm statistic and is not one of them, so the pre-declared
      exclusion mechanism does not reach it, and inventing a reach for it would
      be exactly the post-calibration latitude ATS-1 clause 4 forbids.
      Independently, run_real_arm unpacks rr["dup_band"][cell.bits] at both
      cells unconditionally, so a band must be supplied at both cells or the run
      does not produce a package at all. THE CORRECT HANDLING IS THEREFORE THE
      u = 6 DISCIPLINE CARRIED FROM EXP-SMTH-001 - declare the unattainability in
      advance, in writing, and confine the variable to the role its
      unattainability does not spoil.
    D1_the_declared_exact_level_is_not_attained: >-
      MATERIAL AND STATED PLAINLY. THR-EQD-1 declares a two-sided exact level of
      (2 + 3) / 401 = 0.01247 for the band [3rd, 398th] of 400. THAT LEVEL IS NOT
      ATTAINED AT EITHER CELL, because the order-statistic level argument needs a
      non-degenerate distribution and the measured STAT-DUP distribution has
      heavy ties at both band edges. At bits 16, 11 of the 400 draws sit AT the
      lower edge 0, which is the minimum attainable value of a count, so no draw
      can ever lie strictly below it; 5 sit at the upper edge 110 and only 2 lie
      strictly above it. THE REALIZED TWO-SIDED LEVEL AT BITS 16 IS 2/400 =
      0.005, carried entirely by the upper tail. At bits 20 all 400 draws sit at
      both edges simultaneously and THE REALIZED LEVEL IS 0/400 = 0.0, with a
      rule-of-three 95 percent upper bound of about 0.0075 and no point estimate
      obtainable from a sample in which the statistic never varied.
      THE FIGURE 0.01247 IS THEREFORE NOT CARRIED TO EITHER CELL AND IS RESTATED
      HERE AS THE REALIZED 0.005 AND 0.0. The direction of the error is
      conservative for false alarms - the tell fires LESS often on a correct null
      than declared - so it does not inflate false N-1 firings.
    D1_consequence_the_below_band_leg_is_dead: >-
      THE "FAR BELOW ITS NULL BAND" HALF OF THE ARTIFACT TELL CANNOT FIRE AT
      EITHER BIT SIZE. The specification gives that half as one of the two
      reasons STAT-DUP is the tell - it is meant to catch a sampler that
      deduplicates or draws without replacement. At bits 16 the lower band edge
      is 0 and at bits 20 the band is [0, 0]; a count cannot be strictly below 0.
      SO THE DEDUPLICATION / WITHOUT-REPLACEMENT FAILURE MODE STAT-DUP EXISTS TO
      CATCH IS UNDETECTABLE UNDER THIS FROZEN BAND, AT BOTH CELLS. It is declared
      unreachable here, in advance of the real arm, and no deliverable of this
      batch may claim that failure mode was checked and passed.
    D2_bits_20_is_a_structural_constant: >-
      MATERIAL AND STATED PLAINLY. The bits-20 STAT-DUP band is not a calibrated
      null distribution; it is a structural constant. Two half-tuples of one base
      collide iff they give the same unordered root pair {x(P+Q), x(P-Q)};
      translating BOTH points by the same 2-torsion point leaves P+Q and P-Q
      unchanged and is a collision generator. At bits 20, #E(F_p) = 767427 is ODD
      (independently confirmed by exhaustive point counting in
      VAL-20260801-003 M-6), so E(F_p)[2] is trivial and that generator does not
      exist; 52.3 million half-tuples across 400 arms produced ZERO collisions.
      At bits 16, #E(F_p) = 46860 has 2-adic valuation 2, there is exactly one
      nontrivial 2-torsion point at x = 39489, and on the archived representative
      draw every duplicate has multiplicity exactly 2 - the signature of a single
      involution rather than of birthday collisions.
      CONSEQUENCE, RECORDED SO IT CANNOT BE MISCITED - AT BITS 20 DV-5 IS A
      CONTROL THAT CANNOT FAIL ON A CORRECT INSTRUMENT, ITS FALSE-POSITIVE RATE
      IS NOT ESTIMABLE FROM THIS CALIBRATION, AND IT MUST NEVER LATER BE CITED AS
      A PASSED INTEGRITY CHECK. A control that cannot fail supplies no assurance.
    the_specs_own_idealized_model_is_falsified_at_bits_20: >-
      SAID PLAINLY BECAUSE THIS IS EXACTLY WHAT CALIBRATION EXISTS TO CATCH. The
      specification's pre-run expectation for STAT-DUP is n**2 / (2 S) with S the
      admissible support of about p**2 / 8. At bits 16 that predicts 31.4 per arm
      against a measured mean of 30.82, a good match. At bits 20 it predicts
      0.116 per arm, that is about 46 duplicates across the 400 arms; ZERO WERE
      OBSERVED, an event of probability about e**(-46) under that model. THE
      SPEC'S IDEALIZED MODEL IS FALSIFIED AT BITS 20 BY THE CALIBRATION'S OWN
      DATA. The specification declared that figure an order-of-magnitude
      expectation and not a threshold, and named the cross-cell contrast as its
      reason to calibrate rather than derive, so the falsification is inside what
      the contract anticipated and is not a contract violation - but the
      calibrated replacement at bits 20 turned out to be a constant rather than a
      distribution, which is a worse outcome than the contract expected and is
      recorded as such.
    what_the_retained_band_still_does: >-
      THE ABOVE-BAND LEG IS LIVE AND REACHABLE AT BOTH CELLS, and that is the leg
      that catches the failure mode this experiment most needs to catch - the
      driver computing a stand-in that collapses onto a small support. See
      attainability_argument.N_1.
    it_is_not_a_two_sample_statistic_and_enters_no_family_wise_count: >-
      DV-5 is a function of the real arm alone. It is not one of the six
      calibrated two-sample tests and it is not counted in the family-wise figure
      below; its effect on reaching N-2 is stated separately as a pre-emption
      probability.

  # ===================================================================
  # 6. THE BRANCH SET AND ITS PRECEDENCE - CARRIED VERBATIM IN SUBSTANCE
  #    FROM specification.yaml, WITH NUMBERS SUBSTITUTED AND NOTHING ELSE
  # ===================================================================
  branches:
    precedence: >-
      N-0, then N-5, then N-1, then exactly one of N-2, N-4, N-6. The first
      branch in that order whose condition holds is the branch that fires. No
      result may be read into more than one branch and no result may fall outside
      all of them. THIS ORDER IS THE ONE FROZEN IN THE CONTRACT AND IS NOT
      CHANGED HERE. No branch is added, removed or reordered.
    what_changed_from_the_contract_form: >-
      ONLY TWO THINGS. (1) Threshold placeholders became the numbers in
      reading_rule.thresholds and reading_rule.dup_band. (2) The retained set of
      DV-1..DV-4 shrank from four to three by the pre-declared exclusion of
      STAT-KS1-E2, so "every retained statistic of DV-1 through DV-4" now means
      DV-1, DV-2 and DV-3. Nothing else changed.
    N-0:
      name: INTEGRITY GUARD
      order: 1
      condition: >-
        ANY of the following - a sample set with other than 130816 recorded
        pairs; any recorded c_2 = 0 draw on any arm; a real-arm
        admissible-support fraction other than 1.0; a driver sha256 differing
        from bdb2601b195f314a4430fa80fcf8ab15ec0b605335a8386a93c2b9b3c7d7b02f,
        the value bound by the TASK-20260801-022 snapshot receipt and recorded in
        the calibration manifest; a CTRL-EQD-S3 faithfulness check below 1000 of
        1000 at either cell; a threshold in this reading rule not traceable to a
        named CAL-1 order statistic; the frozen INT-2 map not reproducible by the
        Validator from the manifest alone; or any timeout, crash, resource
        exhaustion or budget cancellation.
      disposition: >-
        MAP SUSPENDED. Infrastructure or instrument signal, NEVER a mathematical
        result about H-EQD-001 or HEUR-DS-1 in either direction (AGENTS.md rule
        5). Scoped repair, then re-run under this same frozen rule.
      hypothesis_transition: none
    N-5:
      name: APPARATUS FAILURE
      order: 2
      condition_leg_a: >-
        DV-6 PC-1 FAILS TO REJECT - the STAT-CHI-16 value between the
        OBJ-PLANT-0.05 object and a fresh OBJ-NULL-RFB draw is not strictly
        greater than 315.4755320010126 at bits 16 or not strictly greater than
        326.2209621328956 at bits 20.
      condition_leg_b: >-
        DV-7 REJECTS - the STAT-CHI-16 value between two fresh independent
        OBJ-NULL-RFB draws IS strictly greater than 315.4755320010126 at bits 16
        or strictly greater than 326.2209621328956 at bits 20.
      condition_leg_c: >-
        THE NUMERIC MARGIN THE CONTRACT REQUIRES THIS FILE TO DECLARE. Leg (c)
        fires iff the in-run null-versus-null STAT-CHI-16 value (the DV-7 value)
        lies STRICTLY OUTSIDE the full measured CAL-1 support at that cell, that
        is strictly below the 1st ascending order statistic or strictly above the
        200th ascending order statistic of
        null_replicate_statistics.json cells.<bits>.replicate_values.STAT-CHI-16.
        The declared interval is [182.87972687693338, 321.9563383966048] at bits
        16 and [191.40792384797555, 335.54712432476106] at bits 20. Both endpoints
        are named order statistics of a named CAL-1 array, as THR-EQD-1
        no_other_threshold_exists requires.
      leg_c_relation_to_leg_b_stated_honestly: >-
        On the UPPER side leg (c) is strictly weaker than leg (b), since the
        200th order statistic exceeds the 199th, so an upper-side (c) firing is
        always already a (b) firing. THE DISTINCTIVE CONTENT OF LEG (c) IS THE
        LOWER SIDE - a null-versus-null statistic implausibly SMALL, which leg
        (b) cannot see at all. That is the check that catches an arm being
        compared against itself.
      disposition: >-
        MAP SUSPENDED. Instrument failure. No disposition about any hypothesis in
        either direction.
      hypothesis_transition: none
    N-1:
      name: ARTIFACT TELL
      order: 3
      condition: >-
        DV-5 STAT-DUP on OBJ-REAL falls STRICTLY OUTSIDE its calibrated band at
        either bit size - strictly outside [0, 110] at bits 16 or strictly
        outside [0, 0] at bits 20. AS CALIBRATED, ONLY THE ABOVE-BAND LEG CAN
        FIRE AT EITHER CELL; the below-band leg is unreachable and is declared
        so in stat_dup_handling.
      disposition: >-
        `inconclusive` on H-EQD-001, with a POSITIVE instrument finding - the
        sampled quantity is not behaving like the fibre invariant, so INT-2 as
        implemented is a stand-in. NOT a refutation and NOT support. Repair and
        re-run under this same frozen rule.
      hypothesis_transition: H-EQD-001 stays `analyzed`.
    N-2:
      name: NOT DISTINGUISHABLE FROM THE MATCHED NULL AT BOTH TOY CELLS
      order: 4
      condition: >-
        No N-0, no N-5, no N-1, AND at BOTH bits 16 and bits 20 every RETAINED
        statistic - STAT-CHI-16, STAT-CHI-64 and STAT-KS1-E1 - fails to reject at
        its calibrated threshold, that is all six values are less than or equal
        to their thresholds in reading_rule.thresholds.
      disposition: >-
        `replicate`. The deterministic factor base's fibre invariants are not
        distinguishable from a random factor base's at these resolutions, this n
        and these two toy cells. EXPLICITLY NOT `support`; NOT validation of
        HEUR-DS-1 at any tier; NOT a smoothness result of any kind; NOT S1_met,
        F1_met or F2_met; NOT any movement of G1-G4; and NOT a licence for any
        conditional asymptotic statement.
      hypothesis_transition: H-EQD-001 `analyzed` -> stays `analyzed`.
      mandatory_companions: >-
        A second-seed replication at a different curve instance per bit size, and
        the owed smoothness measurement OPEN-BATCH023-A, both ranked into the
        BATCH-024 opening.
      knowledge_promotion_expectation: >-
        NOT WARRANTED. The gate fires on `support` or `reject_scoped` with
        `replicated` or `strong` evidence; `replicate` on a preliminary
        unreplicated set is neither.
      additional_scope_note_forced_by_the_exclusion: >-
        A NON-REJECTION HERE IS SILENT ABOUT THE e_2 MARGINAL BEYOND WHAT THE TWO
        GRID CHI-SQUARES SEE. The marginal test on e_2 was excluded as
        uncertifiable against the declared alternative class, so the joint
        chi-squares at K = 16 and K = 64 are the only retained statistics that
        touch e_2 at all. Any deliverable reading N-2 must say so.
    N-4:
      name: DISTINGUISHABLE FROM THE MATCHED NULL AT BOTH TOY CELLS
      order: 4
      condition: >-
        No N-0, no N-5, no N-1, AND at BOTH bit sizes at least one RETAINED
        statistic of STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1 rejects at its
        calibrated threshold.
      disposition: >-
        `weaken` on H-EQD-001, SCOPED EXACTLY to INT-2, the frozen deterministic
        factor-base policy at Bfb = 512, the two tested toy field sizes, m = 4 and
        the frozen resolution ladder. EXPLICITLY NOT `reject_scoped` and in
        particular NOT reject_scoped-as-impossibility - a single unreplicated run
        may not carry a scoped rejection. AND EXPLICITLY NOT AN ADVERSE FINDING
        ABOUT HEUR-DS-1 - this experiment measures no smoothness at all.
      refutation_artifact_required: >-
        MANDATORY AND ARCHIVED BEFORE THE DECISION THAT RELIES ON IT. In order -
        (1) a COUNTEREXAMPLE CERTIFICATE, namely the contingency-table cells
        carrying the excess with their real and null counts and the half-tuples
        that populate them, from which an independent reader can recompute the
        offending statistic; then (2) a DERIVATION NOTE identifying the algebraic
        reason the deterministic factor base induces the departure; then (3) a
        declared `empirical_only` basis. The basis actually achieved must be
        declared; an undeclared basis is the failure, not the absence of a proof.
      hypothesis_transition: >-
        H-EQD-001 `analyzed` -> `weakened`, WITH A `status_scope` BLOCK WRITTEN
        INTO THE HYPOTHESIS RECORD IN THE SAME LEDGER COMMIT.
      knowledge_promotion_expectation: NOT WARRANTED on this package alone.
    N-6:
      name: SPLIT VERDICT ACROSS THE TWO CELLS
      order: 4
      condition: >-
        No N-0, no N-5, no N-1, AND exactly one of the two bit sizes satisfies
        the N-2 conjunction while the other does not.
      disposition: >-
        `inconclusive`. The data do not discriminate the explanations. Record
        which cell rejected, on which statistic, at what value against what
        calibrated threshold. NO post-hoc success label and NO post-hoc failure
        label; in particular the passing cell may not be reported alone.
      hypothesis_transition: H-EQD-001 stays `analyzed`.
      knowledge_promotion_expectation: NOT WARRANTED.
    exhaustiveness_argument: >-
      Given that N-0, N-5 and N-1 do not fire, each of the two bit sizes either
      satisfies the N-2 conjunction over the three retained statistics or does
      not. Both satisfy -> N-2. Neither satisfies -> N-4. Exactly one satisfies
      -> N-6. Mutually exclusive, jointly exhaustive, with N-0, N-5 and N-1
      pre-empting in the declared order. The exclusion of STAT-KS1-E2 does not
      disturb this, because the argument is over the conjunction of whatever the
      retained set is.

  # ===================================================================
  # 7. ATTAIN-RR-EQD-1 - ATTAINABILITY, WITH MEASURED CALIBRATION NUMBERS
  # ===================================================================
  attainability_argument:
    id: ATTAIN-RR-EQD-1
    why_it_is_here: >-
      The attainability duty was introduced at BATCH-022 because BATCH-021
      shipped a map whose favourable branch was arithmetically unreachable, and
      it caught two fatal defects on its first use. It is discharged here WITH
      MEASURED NUMBERS rather than with an analytic argument, as the contract
      requires, because this time real calibration numbers exist.

    N_0:
      firing_side: >-
        REACHABLE BY CONSTRUCTION. Each listed condition is a property the run
        either has or does not - a short arm, a c_2 = 0 draw, a support fraction
        other than 1.0, a driver hash mismatch, an S3 shortfall, an untraceable
        threshold, or an infrastructure stop. The wall-clock stop is the real
        run's declared budget of 1800 seconds and the faithfulness control is
        CTRL-EQD-S3 at 1000 of 1000 per cell on the real enumeration.
      non_firing_side_with_measured_numbers: >-
        MEASURED ON THE CALIBRATION. degenerate_draw_count 0 at both cells;
        range_violations 0 at both cells; every one of the arms enumerated in the
        calibration carried exactly 130816 pairs; empty_cell_omission_count 0 at
        K = 16 and 0 at K = 64 across all 200 replicates at both cells;
        CTRL-EQD-S3 1000 of 1000 at both cells on the representative null draw,
        independently re-verified by VAL-20260801-003; admissible-support
        fraction of an OBJ-NULL-RFB draw exactly 1.0 at both cells. A correct
        implementation measurably does not fire N-0.
      wall_clock_margin: >-
        The whole calibration - about 742 arms per cell, that is 621 CAL-1 and
        CAL-2 and CAL-3 and CAL-4 null draws plus 100 plant arms plus 20
        independent-pair arms plus 1 uniform-pair arm, at both cells - completed
        in 59.19 seconds of a 3600 second budget with peak RSS 175636480 bytes of
        a 4 GiB budget. The real arm enumerates six arms per cell. The 1800
        second real-arm budget therefore carries a margin of roughly two orders
        of magnitude, stated as an order-of-magnitude figure derived from the
        measured 59.19 seconds and not as a prediction of the real arm's runtime.
    N_5:
      leg_a_concrete_achievable_implementation: >-
        A plant stream mis-indexed so that n_replaced comes out 0 would make PC-1
        a null-versus-null comparison, which rejects with probability 0.00995 and
        therefore fails to reject about 99 times in 100. Leg (a) would fire.
      leg_a_measured_margin_for_a_correct_implementation: >-
        MEASURED. At the certified delta 0.05 the certifying statistic exceeded
        its threshold in 20 of 20 CAL-2 replicates at bits 16 and 20 of 20 at
        bits 20. The SMALLEST plant-arm value measured at bits 16 is
        356.59175248031295 against a threshold of 315.4755320010126, a margin of
        41.12, that is 1.67 null standard deviations; the largest is
        461.91632096032276. At bits 20 the smallest is 359.02551837653743 against a
        threshold of 326.2209621328956, a margin of 32.80, that is 1.28 null
        standard deviations; the largest is 477.6809573553279. The margin is
        real but is NOT large, and the honest reading is that PC-1 is expected to
        reject and is not guaranteed to.
      leg_b_concrete_achievable_implementation: >-
        Drawing the two OBJ-NULL-RFB arms of DV-7 from different curve instances,
        or applying the binning rule with two different p values, would make two
        derivably identical objects distinguishable and would fire leg (b).
      leg_b_measured_margin_for_a_correct_implementation: >-
        MEASURED, AND IT IS EXACTLY THE CAL-1 DISTRIBUTION, because DV-7 is
        precisely a CAL-1 replicate comparison. The median null-versus-null
        STAT-CHI-16 is 251.63297092830422 at bits 16 against a threshold of
        315.4755320010126, that is 2.59 null standard deviations below it, and
        259.16705582373555 at bits 20 against 326.2209621328956, that is 2.62
        null standard deviations below it. By exchangeability with the 200
        calibration replicates the probability that a correct implementation
        fires leg (b) is exactly 2/201 = 0.00995 per cell.
      leg_c_concrete_achievable_implementation: >-
        Comparing an arm against ITSELF - a stream index reused, or the same
        array passed twice - yields a two-sample chi-square of 0 at every
        resolution, which is far below the declared lower endpoints 182.88 and
        191.41 and fires leg (c) immediately. This defect is INVISIBLE to leg (b)
        and to every rejection-side check in the design, which is why leg (c)
        exists and why its lower side is the load-bearing half.
      leg_c_measured_margin_for_a_correct_implementation: >-
        MEASURED. All 200 CAL-1 replicate values per cell lie inside the declared
        interval by construction, since the endpoints ARE the extreme order
        statistics of that array. By exchangeability the probability that a
        correct implementation's DV-7 value falls strictly outside is 2/201 =
        0.00995 per cell, of which the lower side contributes 1/201 = 0.004975.
        Combining legs (b) and (c), which are computed from the same DV-7 value,
        the probability that a correct instrument fires N-5 at a cell is
        3/201 = 0.014925.
    N_1:
      measured_CAL1_STAT_DUP_distribution: >-
        bits 16 - 400 values, min 0, 3rd order statistic 0, median 20.0, mean
        30.8225, 398th order statistic 110, max 182; 11 draws at 0, 5 at 110, 2
        strictly above 110. bits 20 - 400 values, all exactly 0, sample variance
        exactly 0.
      is_the_band_trivially_wide_or_trivially_narrow: >-
        AT BITS 16 IT IS NEITHER. [0, 110] covers 398 of the 400 measured null
        draws and excludes 2, which is a realized level of 0.005 - not so wide
        that nothing can breach it and not so narrow that a correct null breaches
        it routinely. AT BITS 20 IT IS DEGENERATELY NARROW ON THE UPPER SIDE AND
        VACUOUS ON THE LOWER - [0, 0] fires on a single duplicate and cannot fire
        below. Both are stated rather than smoothed over.
      concrete_achievable_defect_that_breaches_the_band: >-
        THE FAILURE MODE THE TELL EXISTS TO CATCH, WITH ARITHMETIC. If the driver
        computed a stand-in whose support is of order p rather than the
        admissible support of order p**2 / 8 - for example returning only
        x(P_i + P_j), or e_1 alone, or any single field element - the expected
        duplicate count would be about n**2 / (2 p), which is 1.83e5 at bits 16
        and 1.11e4 at bits 20. Both are enormously above the upper band edges 110
        and 0, so the above-band leg FIRES DECISIVELY under exactly the defect
        that RT047-H2 and RT048-H1 caught twenty-one batches late in the previous
        lane. The above-band leg is reachable at BOTH cells.
      the_below_band_leg_is_declared_unreachable: >-
        AT BOTH CELLS, IN ADVANCE. 0 is the minimum attainable value of a count
        and it is the lower band edge at both cells, so nothing can lie strictly
        below. The deduplication and without-replacement failure modes are
        therefore NOT covered by this instrument and are carried as an open
        instrument gap rather than as a passed check.
      false_firing_rate_on_a_correct_null: >-
        MEASURED AT 0.005 at bits 16 (2 of 400 draws outside the band) and
        UNESTIMABLE at bits 20 (0 of 400, rule-of-three 95 percent upper bound
        about 0.0075, and the 2-torsion mechanism argues the true rate is 0 for
        any base on this curve).
    N_2:
      measured_probability_a_correct_null_reaches_it: >-
        THE FAMILY-WISE FIGURE, RESTATED FOR THE RETAINED SET. Each of the
        retained two-sample tests has an exact false-rejection probability of
        2/201 = 0.00995 on the measured null, by construction of the threshold.
        With three retained statistics at two cells there are SIX such tests, and
        the probability that a correct null reaches N-2 on the decision tests
        alone is (1 - 0.00995)**6 = 0.94177. THE CONTRACT'S DECLARED FIGURE OF
        0.9234 OVER EIGHT TESTS NO LONGER HOLDS AS WRITTEN AND IS SUPERSEDED BY
        0.9418; see family_wise_consequences_of_the_exclusion.
      end_to_end_figure_including_the_pre_empting_guards: >-
        STATED BECAUSE THE SIX-TEST FIGURE ALONE OVERSTATES IT. N-1 and N-5
        pre-empt N-2, so the probability that a fully correct null-and-instrument
        run reaches N-2 is about 0.94177 times (1 - 0.005) for N-1 at bits 16
        times (1 - 0.0075) for the bits-20 N-1 upper bound times
        (1 - 0.014925)**2 for the combined N-5 legs (b) and (c) at the two cells,
        which is about 0.90. Both figures are reported; neither is presented as
        the other.
    N_4:
      measured_CAL2_detection_rate_at_the_certified_delta: >-
        THE DEMONSTRATION THAT AN ACHIEVABLE DEVIATION LANDS IN N-4. At delta
        0.05 the certifying statistic STAT-CHI-16 rejected in 20 of 20 CAL-2
        replicates at bits 16 AND 20 of 20 at bits 20, that is a measured
        detection rate of 1.00 at both cells. An OBJ-PLANT-0.05 object therefore
        satisfies the N-4 condition at both cells in every one of the 40
        replicates measured. N-4 IS NOT REACHABLE ONLY IN ARGUMENT.
      what_remains_uncertified: >-
        POWER AGAINST ALTERNATIVES OUTSIDE THE PLANT CLASS. The plant moves the
        e_1 marginal only. Nothing here certifies power against a deviation that
        preserves both marginals and moves only the dependence between them, and
        that limitation must be repeated in the evidence record. The exclusion of
        STAT-KS1-E2 does not change this, since it had no power against the plant
        class either.
    N_6:
      concrete_measured_route_by_which_the_cells_diverge: >-
        MEASURED, NOT HYPOTHESISED. At delta 0.01 the retained statistics
        exceeded their thresholds at bits 16 in 0 of 20 (STAT-CHI-16), 1 of 20
        (STAT-CHI-64) and 7 of 20 (STAT-KS1-E1) replicates, so the per-cell
        probability that at least one retained statistic rejects is between 0.35
        and 0.40; at bits 20 the counts are 0 of 20, 0 of 20 and 7 of 20, so the
        per-cell probability is exactly 0.35. The two cells use disjoint streams
        and different curve instances; treating them as independent, an
        OBJ-PLANT-0.01 deviation produces a SPLIT VERDICT with probability about
        2 x 0.375 x 0.625, that is roughly 0.47. A deviation of that size lands
        in N-6 about half the time, which is the concrete route.
    resolution_ladder_every_rung:
      K_16:
        powered: true
        measured_evidence: >-
          Expected count 130816 / 256 = 511 exactly per cell per arm, far above
          the five-per-cell floor. MEASURED - empty_cell_omission_count 0 across
          all 200 CAL-1 replicates at both cells, so every chi-square used the
          full 256 cells with df = 255, and STAT-CHI-16 detects the certified
          delta at 20 of 20 at both cells. Powered by measurement, not by
          argument.
      K_64:
        powered: true
        measured_evidence: >-
          Expected count 130816 / 4096 = 31.9375 per cell per arm, above the
          five-per-cell floor and above a thirty-per-cell floor. MEASURED -
          empty_cell_omission_count 0 across all 200 CAL-1 replicates at both
          cells, so no cell was omitted. It is VALID at this rung and
          measurably LESS SENSITIVE than K = 16 against this alternative class,
          reaching the 0.95 bar only at delta 0.10 (20 of 20 at both cells) with
          0.25 and 0.45 at delta 0.05. Retained, with that limitation declared.
      K_256:
        powered: false
        declared_unattainable_in_advance: >-
          POW-EQD-1, declared at TASK-20260801-019 before any datum existed and
          carried here unchanged. 65536 cells at an expected 1.996 per cell per
          arm, far below the five-per-cell floor. The n that would power it is
          stated rather than hidden - n >= 327680 for a five-per-cell floor,
          reachable at Bfb = 810 since C(810, 2) = 327645 and C(811, 2) = 328455;
          n >= 1966080 for a thirty-per-cell floor, reachable at Bfb = 1984 since
          C(1984, 2) = 1967136. It is retained for NOTHING and is excluded
          entirely.
    both_sides_of_every_retained_threshold:
      preamble: >-
        For each retained statistic at each cell, the measured number for the
        non-rejecting side and the measured number for the rejecting side.
      STAT-CHI-16_bits_16: >-
        BELOW-THRESHOLD SIDE REACHABLE - 199 of the 200 CAL-1 null replicates lie
        at or below 315.4755320010126 (min 182.87972687693338, median
        251.63297092830422). ABOVE-THRESHOLD SIDE REACHABLE - 20 of 20 CAL-2
        replicates at delta 0.05 lie above it, spanning 356.59175248031295 to
        461.91632096032276.
      STAT-CHI-16_bits_20: >-
        BELOW-THRESHOLD SIDE REACHABLE - 199 of 200 CAL-1 replicates at or below
        326.2209621328956 (min 191.40792384797555, median 259.16705582373555).
        ABOVE-THRESHOLD SIDE REACHABLE - 20 of 20 CAL-2 replicates at delta 0.05
        above it, spanning 359.02551837653743 to 477.6809573553279.
      STAT-CHI-64_bits_16: >-
        BELOW-THRESHOLD SIDE REACHABLE - 199 of 200 CAL-1 replicates at or below
        4345.885305765976 (min 3796.966669012837, median 4102.650595717392).
        ABOVE-THRESHOLD SIDE REACHABLE - 20 of 20 CAL-2 replicates at delta 0.10
        above it, spanning 4553.685732695058 to 4900.991243102777.
      STAT-CHI-64_bits_20: >-
        BELOW-THRESHOLD SIDE REACHABLE - 199 of 200 CAL-1 replicates at or below
        4293.229704961268 (min 3823.527058864991, median 4096.8640921252145).
        ABOVE-THRESHOLD SIDE REACHABLE - 20 of 20 CAL-2 replicates at delta 0.10
        above it, and 9 of 20 already at delta 0.05.
      STAT-KS1-E1_bits_16: >-
        BELOW-THRESHOLD SIDE REACHABLE - 199 of 200 CAL-1 replicates at or below
        0.006191903131115506 (min 0.0013224681996086285, median
        0.0032488380626223). ABOVE-THRESHOLD SIDE REACHABLE - 20 of 20 CAL-2
        replicates at delta 0.02 above it, spanning 0.007040423189823841 to
        0.014661815068493067.
      STAT-KS1-E1_bits_20: >-
        BELOW-THRESHOLD SIDE REACHABLE - 199 of 200 CAL-1 replicates at or below
        0.006841670743639949 (min 0.0017046844422700658, median
        0.003214438600782743). ABOVE-THRESHOLD SIDE REACHABLE - 20 of 20 CAL-2
        replicates at delta 0.02 above it, and 20 of 20 at deltas 0.05 and 0.10.
      STAT_DUP_both_cells: >-
        ABOVE-BAND SIDE REACHABLE AT BOTH CELLS by the support-collapse
        arithmetic above (1.83e5 and 1.11e4 expected duplicates against upper
        edges 110 and 0). INSIDE-BAND SIDE REACHABLE AT BOTH CELLS - 398 of 400
        measured null draws at bits 16 and 400 of 400 at bits 20 lie inside.
        BELOW-BAND SIDE UNREACHABLE AT BOTH CELLS AND DECLARED SO.
      a_conservative_tie_property_recorded: >-
        The KS statistics are lattice-valued - VAL-20260801-003 M-1 reports 186
        and 173 distinct values out of 200 in the two KS replicate arrays it
        examined, without stating which array is which, so the attribution is not
        asserted here - and ties do occur elsewhere in their distributions. At
        all six retained statistic-by-cell combinations
        exactly one of the 200 CAL-1 values equals the 199th order statistic and
        exactly one is strictly greater, so the strict-greater rule is
        unambiguous. A future value landing exactly ON a threshold does not
        reject, which makes the test CONSERVATIVE and never anti-conservative.

  # ===================================================================
  # 8. WHAT THE EXCLUSION DOES TO THE FAMILY-WISE ERROR
  # ===================================================================
  family_wise_consequences_of_the_exclusion:
    the_contracts_declared_figure: >-
      THR-EQD-1 family_wise_statement_declared_in_advance states that N-2
      requires all FOUR two-sample tests to fail to reject at BOTH bit sizes,
      eight tests at level 0.00995 each, giving an attainability of
      (1 - 0.00995)**8 = 0.9234 and a misread probability of about 0.0766.
    the_corrected_figure: >-
      WITH STAT-KS1-E2 EXCLUDED THERE ARE SIX TESTS, NOT EIGHT. The corrected
      attainability of the favourable branch on a correct null is
      (1 - 0.00995)**6 = 0.94177, rounded to 0.9418, and THE CORRECTED
      PROBABILITY THAT A CORRECT NULL IS MISREAD AS A DEVIATION IS 0.0582, NOT
      0.0766. The contract's 0.9234 and 0.0766 no longer hold as written and are
      superseded by these numbers in every deliverable that cites this file.
    the_direction_of_the_bias_stated_plainly: >-
      THE EXCLUSION MAKES THE FAVOURABLE BRANCH EASIER TO REACH, by 1.84
      percentage points. That is a bias in the direction a Coordinator would be
      tempted to want, and it is therefore stated first and loudest rather than
      buried. Two things bound it. First, the exclusion is DEDUCTIVE FROM THE
      PLANT CONSTRUCTION FROZEN AT TASK-20260801-019, before any calibration
      number existed - the same conclusion was derivable at freeze time from the
      contract alone, and the calibration merely confirmed it. Second, the
      alternative is worse in a way that is not symmetric - retaining
      STAT-KS1-E2 would keep two tests whose rejections against the declared
      alternative class are PURE FALSE ALARMS at 0.00995 each and whose power
      against that class is zero by construction, which buys 1.84 points of
      apparent stringency with no detection capability at all. Neither
      consideration makes the exclusion costless, and the corrected number is
      what must be reported.
    what_the_exclusion_costs_in_coverage: >-
      IT COSTS THE ONLY DEDICATED TEST OF THE e_2 MARGINAL. After the exclusion,
      e_2 is seen only through the two joint grid chi-squares. An alternative
      that perturbs the e_2 marginal while leaving the joint grid counts near
      their null values would now be missed, and the calibration certifies
      nothing about such an alternative in either direction because none is on
      the frozen ladder. This is carried as an instrument limitation into the
      evidence record and into the BATCH-024 opening.
    it_does_not_change_any_other_number: >-
      The certified delta, the certifying statistic, the six retained thresholds,
      the STAT-DUP band, the branch set and the precedence are all unaffected by
      the exclusion. The per-test level remains 0.00995 exactly.

  # ===================================================================
  # 9. CONFORMANCE TO THE FROZEN DRIVER (DEFECT D-4 DEFUSED)
  # ===================================================================
  driver_shape_conformance:
    defect_addressed: >-
      VAL-20260801-003 defect D-4. run_real_arm indexes rr["thresholds"][cell.bits]
      and rr["dup_band"][cell.bits] with an INTEGER key at driver lines 754-755.
      A reading_rule.yaml written with quoted keys "16" and "20" yields string
      keys and raises KeyError; KeyError is not among the exceptions main()
      catches (TimeoutError, PermissionError, ValueError, RuntimeError), so it
      would escape as an uncaught traceback and NO RUN PACKAGE WOULD BE WRITTEN
      AT ALL, not even a failed_infrastructure record. The driver may not be
      edited under ATS-1 clause 5, so the whole constraint falls on this file.
    what_was_done: >-
      THE BIT-SIZE KEYS IN reading_rule.thresholds AND reading_rule.dup_band ARE
      WRITTEN AS BARE INTEGERS, 16 and 20, not as quoted strings, so
      yaml.safe_load produces integer keys and cell.bits indexes them directly.
      The driver's load_reading_rule() docstring at lines 716-731 was read and
      the shape written here matches it exactly.
    field_by_field_conformance:
      - >-
        retained_statistics - a list of three strings, consumed as
        list(rr["retained_statistics"]) at line 756 and used to key thr[sid] at
        line 781. Every listed id has an entry in thresholds at BOTH cells.
      - >-
        thresholds - a mapping from integer bit size to a mapping from statistic
        id to float. Contains exactly the three retained ids at each cell; no
        threshold is supplied for the excluded STAT-KS1-E2, which is consistent
        with its exclusion and is never indexed, because rejects is built only
        over the retained list.
      - >-
        dup_band - a mapping from integer bit size to a two-element list,
        unpacked as dup_lo, dup_hi at line 755. Both cells are supplied, as the
        unconditional unpack requires.
      - >-
        certified_delta - a float, consumed as float(rr["certified_delta"]) at
        line 791.
      - >-
        certifying_statistic - the string STAT-CHI-16, consumed at line 787 and
        used to key both flat_two_sample_values(...)[cs] and thr[cs] at lines 795
        to 803. STAT-CHI-16 is present in thresholds at both cells, so thr[cs]
        resolves.
    residual_verification_owed: >-
      A mechanical load-and-index check of this file with integer keys is owed
      before the real arm is dispatched. This session has no shell and did not
      perform it; the check is assigned to TASK-20260801-024 as part of the
      archive and to TASK-20260801-025 as a named review duty. AN UNVERIFIED
      PARSE IS NOT A VERIFIED PARSE AND IS NOT REPORTED AS ONE.

