  # ===================================================================
  # 11. SCOPE, LIMITS AND WHAT THIS FILE DOES NOT DO
  # ===================================================================
  scope_and_limits:
    claim_tier: toy
    field_sizes: >-
      p = 46663 (16-bit) and p = 767551 (20-bit). `bits` names the FIELD prime
      and nothing else; no subgroup order is involved, because this experiment
      computes no discrete logarithm, harvests no relation and runs no search.
    scope_of_every_threshold_here: >-
      Each threshold is the measured null distribution of a UNIFORMLY RANDOM
      512-point factor base on ONE curve instance per bit size at ONE master seed
      (2301). No across-instance variability was measured, so none of these
      thresholds is known to be stable across curve instances at the same bit
      size. That limitation must appear in the evidence record.
    not_evidence: >-
      Every number in this file is an instrument constant derived from a run
      declared NON-EVIDENTIAL about H-EQD-001, HEUR-DS-1 and H-SMTH-001 in either
      direction. Nothing here is a result about the Semaev map, about
      equidistribution, about smoothness, or about any exponent.
    this_file_authorizes_nothing: >-
      No run is authorized here. The real arm RUN-EQD-001-real is gated on
      APPROVAL_DETERMINATION APPROVED at TASK-20260801-026, after the independent
      review at TASK-20260801-025. Committing or freezing a reading rule is not
      approving a run.
    the_owed_measurement_is_still_owed: >-
      OPEN-BATCH023-A, the direct smoothness measurement of HEUR-DS-1, remains
      UNPERFORMED. No outcome of this experiment discharges it and nothing in
      this file says that it does.
    dominated_by: >-
      Not applicable and NOT set to null. This file states no mechanism, no cost
      and no frontier position; it is an instrument calibration record.
