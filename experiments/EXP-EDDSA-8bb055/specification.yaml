experiment:
  id: EXP-EDDSA-8bb055
  hypothesis_id: H-EDDSA-45c713
  derived_from_idea: IDEA-20260809-022eb5
  question_id: RQ-EDDSA-9b8473
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exhaustive enumeration of the Ed25519 verification-divergence candidate space - exact
    cardinality factored into small-order, encoding and S-range components, its behaviour quotient
    under a frozen set of admissible readings, and an independent recount
  objective: >-
    The one uncertainty a run reduces is whether this goal's divergence matrix can be an enumeration
    over a finite object or must remain a search over chosen vectors. A run establishes (i) whether
    two independently written implementations reproduce the official Ed25519 test vectors
    bit-exactly, which is the gate that decides whether any integer produced here may be recorded at
    all; (ii) the exact integer cardinality of the candidate separating space, factored into its
    three components, together with the wall time and memory of a complete pass over it; and
    (iii) the number of distinct behaviour vectors realised over the space under the frozen set of
    admissible verification readings, and therefore whether the behaviour quotient is proper.
    No attack, forgery, key recovery or security consequence is claimed here or would follow from a
    run. No claim of completeness against any published verification taxonomy is made; this
    environment has not located one. No statement is made about any deployed library.
  what_this_is_not:
    - >-
      Not an attack, a forgery, a key recovery, or a cryptanalytic result of any kind. It is an
      enumeration and measurement contract over a specification-reading question.
    - >-
      Not a claim that any deployed Ed25519 implementation diverges from any other. No library is
      tested and none is named.
    - >-
      Not a completeness claim against the published verification-taxonomy literature, which the
      parent proposal records as recalled and not located.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal record, and not a
      promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: exact_enumeration
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - under the reading set frozen in Stage 0 and the primary
      specification filed in Stage 0, the candidate separating space has the stated exact cardinality
      with the stated factorisation, a complete pass costs the stated time and memory, and the space
      realises the stated number of distinct behaviour vectors. Because the space is enumerated
      exhaustively rather than sampled, these are exact statements about that space and not
      estimates. WHAT DOES NOT FOLLOW - nothing about any deployed library; nothing about
      exploitability; nothing about a reading set other than the frozen one; and specifically NOT
      that the frozen reading set is exhaustive of admissible readings, which is an assumption whose
      failure changes every integer reported.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE): fetch and file the primary specification under a run
      record, since the parent proposal records it as required and unread. From the filed text, and
      from any other filed governing specification, write down the FROZEN list of admissible
      verification readings as explicit predicates - cofactored versus non-cofactored equation,
      canonical-encoding rejection on R, canonical-encoding rejection on the public key, S-range
      rejection, small-order rejection on R, small-order rejection on the public key - each with a
      citation to the line of filed text that licenses it. Freeze the list, hash it, and do not
      revise it after any candidate is evaluated. A reading not licensed by filed text is not
      admissible.
      STAGE 1 (minutes, HARD GATE): implementation A - curve arithmetic, point decoding and encoding,
      and each reading predicate, written from first principles. Reproduce the official test vectors
      bit-exactly, including the negative vectors. GATE - no enumeration output is recorded until
      this passes.
      STAGE 2 (seconds to minutes): enumerate each component separately and report its exact size -
      the small-order subgroup by explicit construction and order check on every element; the
      encoding classes by direct construction over the field elements admitting a non-canonical
      32-byte serialization plus the strings whose decode fails; the S-range classes by direct
      partition of the range under the frozen rejection predicates. Report each component size as an
      exact integer with the construction that produced it.
      STAGE 3 (seconds to minutes): enumerate the full product, evaluate every candidate under every
      frozen reading, and emit the candidate list with its behaviour vector. Report the exact
      cardinality, the exact number of distinct behaviour vectors, the quotient map, and the wall
      time and peak memory of the complete pass.
      STAGE 4 (minutes, HARD GATE): implementation B - a second, independent implementation of
      everything in Stages 1 to 3, written without reference to implementation A, by a separate
      dispatch. Recompute every integer. GATE - the two must agree exactly; a disagreement halts and
      nothing is recorded.
      STAGE 5 (zero compute): report the factored cardinality, the behaviour quotient, the per-class
      representative candidates, and an explicit statement of which readings the enumeration covers
      and which it does not.
    instrument: >-
      Python with arbitrary-precision integers only; no third-party curve library on either
      implementation path, because a library would import a reading convention and the reading
      convention is the object under study. Implementation A and implementation B must not share a
      module, a constant table, or a decoder. Both recorded through the program's run wrapper with a
      manifest.
    parameters: >-
      Ed25519 at its single standardized parameter set, as filed in Stage 0. The frozen reading list
      from Stage 0 (expected to be on the order of six independent binary predicates, giving at most
      2 to the 6 nominal readings, of which only those licensed by filed text are admitted). No
      sweep, no seeds beyond the fixed test-vector set, because the enumeration is exhaustive and
      deterministic.
  controls:
    - >-
      ARITHMETIC CONTROL, blocking - both implementations reproduce the official test vectors
      bit-exactly, including negative vectors, before any enumeration output is recorded. An
      enumeration produced by a subtly wrong decoder is the single most likely way to manufacture a
      false integer here.
    - >-
      INDEPENDENT RECOUNT, blocking - the cardinality, the three component sizes, and every behaviour
      vector are recomputed by a second implementation written without reference to the first. The
      integers must agree exactly.
    - >-
      FROZEN READING SET, blocking - the admissible reading list is hashed before Stage 2 and every
      reported integer names that hash. A reading added after seeing results makes the cardinality a
      description of a choice.
    - >-
      NULL READING PAIR - include in the frozen list one pair of readings that are known to be
      IDENTICAL as predicates (the same reading written two ways). The enumeration must report zero
      separating candidates for that pair. A pipeline that reports a separating candidate for two
      identical readings is comparing something other than the readings.
    - >-
      DEGENERATE-CANDIDATE CONTROL - include the canonical, in-range, prime-order candidate (an
      ordinary valid signature) in the enumeration. Every admissible reading must accept it, giving
      the all-accept behaviour vector. A candidate space in which the ordinary case does not appear
      with the all-accept vector is mis-constructed.
    - >-
      COMPONENT INDEPENDENCE CHECK - report the product of the three component sizes alongside the
      directly counted size of the enumerated product. They must be equal; an inequality means the
      components are not independent as claimed and the factorisation is wrong.
  independent_variables:
    - 'candidate component: small-order class / encoding class / S-range class'
    - admissible verification reading, over the frozen list
    - 'implementation: A or B'
  metrics:
    primary:
      - name: candidate_space_cardinality
        units: dimensionless exact integer
        computed: >-
          The number of distinct candidate inputs enumerated in Stage 3, counted directly, and
          separately as the product of the three Stage 2 component sizes. Both numbers reported; they
          must agree.
      - name: component_sizes
        units: three dimensionless exact integers
        computed: >-
          Size of the small-order class set, the encoding class set, and the S-range class set, each
          from the explicit construction that enumerated it, with the construction recorded.
      - name: distinct_behaviour_vectors
        units: dimensionless exact integer
        computed: >-
          The number of distinct tuples of accept/reject outcomes across the frozen reading list,
          taken over all candidates. Reported together with the ratio to candidate_space_cardinality.
      - name: recount_agreement
        units: boolean, plus the list of any disagreeing integers
        computed: >-
          Exact equality of every integer produced by implementation A and implementation B. Required
          value is true.
      - name: test_vector_pass
        units: fraction of official test vectors reproduced bit-exactly, in the closed interval 0 to 1
        computed: >-
          Byte-for-byte comparison of each implementation's verification outcome and any intermediate
          encoding against the official vectors. Required value is 1 for both implementations.
    secondary:
      - name: complete_pass_wall_time
        units: seconds on one core
        computed: Wall time of the full Stage 3 pass, median of 3 repetitions, per implementation.
      - name: complete_pass_peak_memory
        units: bytes, peak resident set size
        computed: Peak RSS sampled during the Stage 3 pass, per implementation.
      - name: null_reading_pair_separations
        units: dimensionless exact integer
        computed: >-
          Number of candidates separating the deliberately identical reading pair. Required value is
          exactly 0.
      - name: behaviour_class_sizes
        units: histogram of exact integers
        computed: >-
          Number of candidates mapping to each distinct behaviour vector, reported as a full
          histogram with one named representative candidate per class.
      - name: per_reading_accept_counts
        units: exact integer per reading
        computed: Number of candidates accepted by each admissible reading, over the whole space.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The pair (candidate_space_cardinality, distinct_behaviour_vectors), together with the boolean
      that a complete pass costs seconds on one core.
    formula: >-
      candidate_space_cardinality is finite and small enough that complete_pass_wall_time is under
      60 seconds on one core; and distinct_behaviour_vectors is STRICTLY LESS than
      candidate_space_cardinality. Under the null that the components carry no redundancy,
      distinct_behaviour_vectors equals candidate_space_cardinality and the quotient buys nothing.
      No numeric value of the cardinality is predicted, because none is derivable before the primary
      specification is filed in Stage 0; predicting one now would be inventing a measurement.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-022eb5 (predictions block) before any run
      under this contract exists. Never tuned to data.
  scale_relevance:
    tier: standardized_parameter_set
    justification: >-
      The enumeration is executed at Ed25519's own standardized parameter set, not at a reduced one,
      because the candidate space is small by construction and exhaustive enumeration is affordable
      there. There is therefore NO transfer assumption and no scale gap for the cardinality itself.
      The scale limit lies elsewhere and is stated - the result is scoped to the FROZEN reading set,
      and a reading outside that set is not spoken for.
    correspondence: >-
      Exact - the object enumerated is the object the goal's matrix is stated over, with no sampling
      and no reduction.
  tail_checks:
    - >-
      Report the behaviour-class histogram in full, including every singleton class, since a
      separating candidate is by construction a member of a small class and a summary statistic would
      hide it.
    - >-
      Report the candidates lying on every boundary of every threshold predicate (the largest
      accepted S and the smallest rejected S, and the analogous pairs for each encoding predicate),
      since off-by-one boundary readings are the failure mode this enumeration exists to expose.
    - >-
      Report explicitly any component whose enumerated size is 0 or 1, since a collapsed component
      makes the product misleadingly small and usually means a construction bug rather than a fact.
    - >-
      Report the exact count, not a rate, for every quantity. No frequency in this contract is
      reported as a rounded proportion.
  replication:
    seeds:
      - 20260825
    independent_instances: 2
    note: >-
      The enumeration is exhaustive and deterministic, so replication is by INDEPENDENT
      IMPLEMENTATION rather than by reseeding. The two instances are implementation A and
      implementation B, which must be produced by separate dispatches that do not read each other's
      code. The single seed governs only the ordering of the test-vector sampling and the
      wall-time repetitions.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 12
  stopping_rules:
    - Halt if the primary specification cannot be fetched and filed in Stage 0; the reading set may not be fixed from recall.
    - Halt if either implementation fails any official test vector; report the failing vector and nothing else.
    - Halt and record nothing if implementations A and B disagree on any integer; report the disagreeing integers and the first candidate index at which they differ.
    - >-
      Halt if any component's enumeration exceeds the declared budget; report the partial component
      size reached and the budget as the obstruction, and do NOT report a cardinality.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run in which the reading set was modified after any candidate was evaluated is
      invalid_measurement, because the cardinality then describes a choice made with knowledge of the
      answer.
    - >-
      A run in which implementations A and B share any module, constant table or decoder is
      invalid_measurement - the recount is not independent and its agreement carries no information.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
    - >-
      A run that reports a cardinality without the component-independence check (product equals
      directly counted size) is incomplete and is returned to the Executor.
  success_criterion: >-
    The run is successful when ALL of the following hold and are read off the predefined metrics:
    (1) test_vector_pass = 1 for both implementations; (2) recount_agreement = true, with every
    integer matching exactly; (3) candidate_space_cardinality is reported as an exact integer, with
    component_sizes whose product equals it; (4) the enumeration of the full product completed within
    budget, with complete_pass_wall_time and complete_pass_peak_memory reported;
    (5) null_reading_pair_separations = 0 and the ordinary valid candidate carries the all-accept
    behaviour vector; and (6) distinct_behaviour_vectors is reported with its full class histogram.
    Note that success does NOT require the quotient to be proper - criterion (6) is satisfied by
    reporting the number in either direction, and whether it is strictly smaller than the cardinality
    is the finding.
  falsification_criterion:
    - >-
      distinct_behaviour_vectors equals candidate_space_cardinality - the behaviour quotient is
      trivial, the parent proposal's second prediction is REFUTED, and the goal's matrix must be
      stated over the full candidate space. Reported as a negative, not softened.
    - >-
      Any component is unbounded under some admissible reading, or the product cannot be enumerated
      within the declared budget - the premise that this goal's matrix can be complete is FALSIFIED
      and the goal's completeness claim is withdrawn in favour of an explicitly partial one.
    - >-
      The two independent counts disagree - NOTHING IS RECORDED until the discrepancy is localised
      and resolved. This is an implementation defect, never a finding about Ed25519.
    - >-
      Either implementation fails the official test vectors - the arithmetic control has failed, the
      run is invalid rather than negative, and no integer is admissible.
    - >-
      The product of the component sizes does not equal the directly counted cardinality - the
      components are not independent and the three-way factorisation claim is refuted.
    - >-
      The null reading pair produces a nonzero separation count - the pipeline is comparing something
      other than the readings and every separating candidate it reports is void.
  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved inference block and environment
    - the Stage 0 fetch receipt for the primary specification, with URL, HTTP status, byte count and sha256
    - the frozen admissible-reading list with its hash, and a citation to the filed line licensing each reading
    - raw-result.json carrying the full candidate list with each candidate's behaviour vector, not summaries
    - the component enumerations, each with the construction that produced it
    - both implementations' outputs in the same archive, with the diff of any disagreeing integer
    - the official test-vector comparison output for both implementations
    - the behaviour-class histogram with one named representative candidate per class
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Approval is required before execution and is the USER's gate, because it authorizes execution
      and spends compute. This contract is review_required and NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      Stage 0's specification filing is itself a precondition of approval-to-proceed-past-Stage-0.
      The Coordinator must confirm the fetch receipt exists before Stage 2 runs, because the frozen
      reading set is the object every reported integer is scoped to.
    - >-
      Implementation A and implementation B must be dispatched as SEPARATE tasks with disjoint write
      scopes. A single agent writing both does not produce an independent recount, and an
      unsatisfied independence requirement makes criterion (2) meaningless.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260809-022eb5
    authored_at: '2026-08-25'
    note: >-
      Objective, components, controls and predictions are transcribed from the parent proposal's
      claim, predictions, minimal_test and controls blocks. The null reading pair, the
      degenerate-candidate control and the component-independence check are added here because the
      proposal's success condition was otherwise not decidable against a possible negative. Budgets
      come from the parent's declared estimated_cost (implementation small, compute negligible)
      through the program's cost table. No numeric cardinality is stated anywhere in this contract,
      because none is derivable before Stage 0 and stating one would be inventing a measurement.
  derivation_gaps:
    - >-
      The exact list of admissible readings is NOT fixed in this contract - it cannot be, because the
      primary specification is recorded by the parent proposal as unread. Stage 0 fixes it, and the
      Coordinator must review the frozen list before Stage 2, since every reported integer is scoped
      to it.
    - >-
      The parent proposal names the small-order subgroup's order as a specific integer. This contract
      deliberately does not repeat that integer, requiring the run to read it off the filed
      specification and check it, because carrying a recalled constant into an exact-enumeration
      claim is exactly the failure mode the arithmetic control exists to prevent.
    - >-
      Whether the encoding-class component should include strings that fail to decode under EVERY
      reading (and are therefore separating for no pair) is a scoping choice that changes the
      cardinality. It must be settled explicitly before Stage 2 and stated in the report.
    - >-
      The 60-second threshold in the pre-registered prediction is derived from the parent proposal's
      "seconds on one core" and is a convenience threshold, not a derived one. A Coordinator who
      wants it decidable at a different value must amend before the run rather than after.
