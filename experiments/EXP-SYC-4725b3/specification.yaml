    repair_item_C_system_peak_live_bytes:
      blocker_id: SYSTEM-PEAK-LIVE-CONCURRENCY
      disposition: REPAIRED_BY_REPLACEMENT_RULE_PLUS_DISCRIMINATING_KAT
      what_was_wrong: >-
        The predecessor retracted shard-invariance but froze the wrong
        replacement: a maximum over per-shard peak streams. Peak system memory
        is a maximum over TIME of a SUM across simultaneously live allocations,
        with shared bytes charged exactly once. A maximum across workers
        undercounts by up to eightfold on eight disjoint simultaneous
        allocations, as TASK-20260813-e04de4's fixture shows.
      superseded_rule:
        predecessor_bsgs_interval: '[max(S_peak_lower,B_peak_lower), max(S_peak_upper,B_peak_upper)]'
        status: SUPERSEDED_NOT_EDITED
      replacement_rule:
        time_base:
          clock: >-
            one monotonic clock source read by every shard; all eight shards and
            the setup process co-located on a single host
          event_model: >-
            every allocation and every free is an event (t, shard, region_id,
            bytes, sign); occupancy functions are piecewise constant and
            right-continuous, changing only at events
          evaluation: >-
            the maximum over t is evaluated EXACTLY over the finite set of event
            times, not by periodic sampling; periodic sampling yields only a
            lower bound and is forbidden
        quantities:
          B_0_of_t: >-
            bytes live in the co-located setup process's NON-shared private
            regions at time t (the RT-OBJ-F addition; the setup process is
            declared present by the time_base above)
          S_of_t: >-
            bytes live in shared regions at time t, each shared region counted
            exactly once no matter how many shards map it
          B_j_of_t: 'bytes live in shard j''s NON-shared regions at time t, j = 1..8'
          m_j_of_t: 'bytes of shared regions mapped by shard j at time t'
          P_j_of_t: 'shard j''s own reported live bytes, equal to B_j(t) + m_j(t)'
          D_of_t: 'the deduplication term, equal to sum_j m_j(t) - S(t)'
        frozen_formula: 'system_peak_live_bytes = max_t ( B_0(t) + S(t) + sum_{j=1..8} B_j(t) )'
        RT_OBJ_F_REPAIR: >-
          Finding RT-OBJ-F (BATCH-a723af): the predecessor's frozen formula
          max_t (S(t) + sum_{j=1..8} B_j(t)) had no term for the co-located
          setup process's private non-shared allocations, which the record's own
          time_base declares present, so it returned 0 for a host holding only
          setup allocations while budget.maximum_memory_gb = 2 is a host-level
          quantity. This repair adds the missing setup-process term B_0 to the
          frozen formula (above) AND adds the KAT-PEAK-F fixture below that
          exposes its absence, plus FORBIDDEN-R7.
        equivalent_form_from_per_shard_totals: 'max_t ( B_0(t) + sum_j P_j(t) - D(t) )'
        equivalence_condition: >-
          the two forms agree identically because B_0(t) + sum_j P_j(t) - D(t)
          = B_0(t) + sum_j B_j(t) + sum_j m_j(t) - (sum_j m_j(t) - S(t))
          = B_0(t) + S(t) + sum_j B_j(t)
        retained_bracket:
          lower: 'max_j max_t P_j(t)'
          upper: 'sum_j max_t P_j(t) + max_t S_solo(t) + max_t B_0(t)'
          S_solo_definition: >-
            bytes live in shared regions that are mapped by NO shard at time t
          validity: >-
            lower holds because S(t) >= m_j(t) for every j and t; upper holds
            because every live shared byte is either mapped by at least one
            shard or counted in S_solo, and the setup private bytes are bounded
            by max_t B_0(t)
          use: >-
            a computed system peak outside this bracket invalidates the
            accounting; the bracket is a check, never a substitute for the
            frozen formula
        forbidden_rules:
          - id: FORBIDDEN-R1-max-over-shard-peaks
            rule: 'max_j max_t P_j(t) used AS the system peak'
            defect: undercounts simultaneous disjoint allocations by up to 8x
          - id: FORBIDDEN-R2-sum-of-per-shard-maxima
            rule: 'sum_j max_t P_j(t) used AS the system peak'
            defect: overcounts whenever per-shard peaks are not time-aligned
          - id: FORBIDDEN-R3-sum-without-dedup
            rule: 'max_t sum_j P_j(t) with D(t) omitted'
            defect: charges every shared region once per mapping shard
          - id: FORBIDDEN-R4-periodic-sampling
            rule: sampling occupancy on a fixed grid
            defect: misses any peak shorter than the sampling period
          - id: FORBIDDEN-R5-division-averaging-or-five-way-reuse
            rule: dividing or averaging peak by shard count, or reusing a five-way maximum
            defect: peak is a maximum axis and is never divided, averaged, or inherited across shard widths
          - id: FORBIDDEN-R6-missing-shard
            rule: omitting any of the eight shard streams
            defect: invalidates the accounting outright
          - id: FORBIDDEN-R7-omitted-setup-stream
            RT_OBJ_F_REPAIR: added with the B_0 term
            rule: 'omitting the setup process''s private non-shared stream B_0 from the system peak'
            defect: >-
              returns 0 for a host holding only setup allocations, undercounting
              the host-level peak that budget.maximum_memory_gb = 2 bounds
      static_kat_fixtures:
        status: >-
          STATIC CONTRACT. These fixtures are SPECIFIED, not executed. No
          fixture was run, no byte was allocated, and no measurement exists.
        units: bytes; times are abstract ticks on the shared monotonic base
        fixtures:
          - id: KAT-PEAK-A-eight-simultaneous-nonshared
            setup: 'shared: none. shard j allocates 1 non-shared byte live on [2,8), j = 1..8'
            expected_system_peak: 8
            rejects: [FORBIDDEN-R1]
            values_under_rejected_rules: {FORBIDDEN-R1: 1}
          - id: KAT-PEAK-B-eight-staggered-nonshared
            setup: 'shared: none. shard j allocates 1 non-shared byte live on [2j, 2j+1), j = 1..8, pairwise disjoint'
            expected_system_peak: 1
            rejects: [FORBIDDEN-R2]
            values_under_rejected_rules: {FORBIDDEN-R2: 8}
          - id: KAT-PEAK-C-shared-counted-exactly-once
            setup: 'one shared region of 1 byte live on [0,10) and mapped by all eight shards throughout; no non-shared bytes'
            expected_system_peak: 1
            rejects: [FORBIDDEN-R2, FORBIDDEN-R3]
            values_under_rejected_rules: {FORBIDDEN-R2: 8, FORBIDDEN-R3: 8}
          - id: KAT-PEAK-D-seven-simultaneous-one-staggered-one-shared
            purpose: >-
              the single discriminating fixture the BATCH-080a9c checkpoint
              names: simultaneous shards, a staggered shard, and a shared
              allocation counted exactly once, all in one timeline
            VAL_A723AF_R3_REPAIR: >-
              Finding VAL-A723AF-R3 (BATCH-a723af): this fixture binds SEVEN
              simultaneous shards (shards 1..7), not the EIGHT the frozen
              BATCH-080a9c blocker SYSTEM-PEAK-LIVE-CONCURRENCY names, while the
              predecessor claimed literal conformance. This is recorded as a
              REASONED DEVIATION, not literal conformance: the 7 simultaneous +
              1 staggered choice improves discrimination between FORBIDDEN-R2
              and FORBIDDEN-R3 (a full 8-simultaneous fixture would make R2 and
              R3 harder to separate on this timeline).
            setup:
              shared: 'one 1-byte region live on [0,20), mapped by all eight shards throughout'
              simultaneous: 'shards 1..7 each allocate 2 non-shared bytes live on [4,9)'
              staggered: 'shard 8 allocates 2 non-shared bytes live on [12,15)'
            occupancy_timeline:
              - {interval: '[0,4)', S: 1, sum_B: 0, total: 1}
              - {interval: '[4,9)', S: 1, sum_B: 14, total: 15}
              - {interval: '[9,12)', S: 1, sum_B: 0, total: 1}
              - {interval: '[12,15)', S: 1, sum_B: 2, total: 3}
              - {interval: '[15,20)', S: 1, sum_B: 0, total: 1}
            expected_system_peak: 15
            rejects: [FORBIDDEN-R1, FORBIDDEN-R2, FORBIDDEN-R3]
            values_under_rejected_rules: {FORBIDDEN-R1: 3, FORBIDDEN-R2: 24, FORBIDDEN-R3: 22}
            dedup_check: 'at t in [4,9): sum_j P_j = 7*3 + 1 = 22, D = 8 - 1 = 7, 22 - 7 = 15'
            bracket_check: 'lower 3 <= 15 <= upper 24'
          - id: KAT-PEAK-E-sub-sample-transient
            setup: 'shard 1 allocates 1024 non-shared bytes live on [5.4, 5.6); all other shards idle; no shared bytes'
            expected_system_peak: 1024
            rejects: [FORBIDDEN-R4]
            values_under_rejected_rules: {FORBIDDEN-R4_integer_tick_sampling: 0}
          - id: KAT-PEAK-F-setup-private-allocation
            RT_OBJ_F_REPAIR: >-
              Finding RT-OBJ-F (BATCH-a723af): one-line fixture exposing the
              absence of the setup-process term in the predecessor's frozen
              formula. With the B_0 term added, the peak is 4096; the
              predecessor's formula (without B_0) returns 0.
            setup: 'setup process allocates 4096 private non-shared bytes live on [0,20); no shard allocation, no shared regions'
            expected_system_peak: 4096
            frozen_formula_with_B_0: 4096
            predecessor_formula_without_B_0_returns: 0
            rejects: [FORBIDDEN-R7]
            values_under_rejected_rules: {FORBIDDEN-R7-omitted-setup-stream: 0}
        completeness_claim: >-
          Fixtures A, B, C isolate one defect each; D rejects R1, R2 and R3
          simultaneously (recorded as a reasoned seven-versus-eight deviation,
          VAL-A723AF-R3); E rejects R4; F rejects R7 (the omitted setup stream,
          RT-OBJ-F). R5 and R6 are refused by contract and have no numeric
          fixture, which is stated rather than papered over.
