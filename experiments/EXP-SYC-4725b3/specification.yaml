  # PROMINENT HA-2 LIMITATION STATEMENT (unchanged in logic/conclusion; carried
  # forward from EXP-SYC-dc854f, which carried it from EXP-SYC-edf98d /
  # EXP-SYC-793304. Items A/B were label/arithmetic fixes only; V2 and the
  # twelve V4 items restore supporting prose only. None of these touches this
  # proof's logic or conclusion.).
  # Repeated in design-repair-report.yaml. This successor carries the
  # EXP-SYC-75f7d2 parallel-lane C-HA2 clause analysis and system-peak KAT
  # contract (see merged_parallel_lane_exp_syc_75f7d2 below) with the six
  # BATCH-a723af repairs, and applies to this statement the RT-82A8CB-OBJ7
  # family-size annotation and the RT-82A8CB-OBJ15 foreclosure narrowing
  # (non-blocking carry of BATCH-7d9b78).
  # ---------------------------------------------------------------------------
  prominent_ha2_limitation_statement: >-
    THIS DESIGN CANNOT SUPPLY A NON-VACUOUS SIMULTANEOUS (FAMILYWISE) TAIL
    GUARANTEE FOR candidate_index OCCUPANCY, AND THAT IS PROVED BELOW RATHER
    THAN MERELY ASSERTED. A justified worst-case contract IS supplied and it is
    NEGATIVE: the deterministic per-tuple bound 8*(L-1) equals 504, 1016, 2040,
    4088, and 8184 at bits 18/21/24/27/30 and exceeds capacity 32 at every
    ladder size. A justified TUPLEWISE tail contract IS supplied and it is
    SHARP but NON-CERTIFYING: from HA-2's expectation alone the best possible
    bound is P(X >= 33) <= mu/33, attained exactly by the mandated negative KAT
    X=33 with probability mu/33 and X=0 otherwise. Extending either bound over
    the 98304 accounting tuples per size (the valid-but-looser variant; the
    operative distinct-variable count is 32768, see family_size_correction and
    family_size_reconciliation below) by a union bound is VACUOUS at every
    ladder size and at both gamma_x slices (the familywise bound ranges from
    938.297567 to 1489.454545 at gamma_x=5/18 and is 2978.909091 at
    gamma_x=1/3, all far above 1), and it remains vacuous under HA-3's
    second-moment shape for every admissible kappa >= 1. THE COST: capacity 32
    is not certified adequate in any probabilistic sense; the thirty-third
    distinct value continues to invalidate the apparatus without truncation;
    no bound on the probability of mid-run invalidation exists FROM THE
    COMMITTED HEURISTICS ALONE, so no per-attempt-cost times
    inverse-success-probability bookkeeping is admissible from the committed
    heuristics alone (an archived ROUTE-A validation measuring the realized
    invalidation rate would supply the missing factor empirically, scoped to
    the tested ladder), and therefore no cost, frontier, dominance, or
    advantage claim is admissible from the committed heuristics alone; and the
    HA-2 promotion gate for numbered heuristics with archived validation
    remains unsatisfied, which caps any dependent claim below `supported`.

