      synchronized_time_base:
        clock: >-
          one host monotonic clock (CLOCK_MONOTONIC_RAW), single source for
          every allocate and free event of ALL TEN streams: the setup-private
          B_0 stream (the setup process's private, non-shared, non-shard
          allocations), the shared/setup context, and all eight shards
        evaluation: >-
