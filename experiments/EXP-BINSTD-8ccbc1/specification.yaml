# EXP-BINSTD-8ccbc1
# Yield-race count arithmetic. No relation is collected.
# Approved by DEC-20261003-b4bf98.
experiment:
  id: EXP-BINSTD-8ccbc1
  hypothesis_id: H-BINSTD-c4310a
  source_idea: IDEA-20261002-df6215
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Schedules versus the hour cap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-b4bf98
  objective: >-
    Check the excess 4, the cross 0, and the difference 386.
  inputs:
    n_sum: 59
    n_product: 7429
    cells: 6
    arms: 2
    schedules: 12
    hour_cap: 8
    schedule_excess: 4
    ratio_cross: 0
    stage_product: 51
    rest_product: 437
    stage_gap: 386
  controls:
    - >-
      Twelve exceeds 8 by 4. Reporting one arm makes the schedule
      count 6, which does not exceed 8, and invalidates the run.
    - >-
      Twelve over 8 equals 3/2. The cross of 12/8 against 3/2 is 0.
      Seventeen times 3 is 51. Nineteen times 23 is 437. Four
      hundred thirty-seven exceeds 51 by 386.
    - >-
      The n sum is 59 and the n product is 7429. Two times 6 is 12.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {schedules, ratio, stage}
    - route in {difference, cross}
  metrics:
    primary:
      - schedule_excess
      - ratio_cross
      - stage_gap
      - implementations_agree
    secondary:
      - schedules
      - stage_product
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Twelve exceeds 8 by 4. The cross of 12/8 against 3/2 is 0.
      Four hundred thirty-seven exceeds 51 by 386.
    formula: >-
      Subtract 8 from 12. Cross 12/8 with 3/2. Subtract 51 from 437.
    source: >-
      IDEA-20261002-df6215 states the n list 17, 19, and 23, the
      dimensions 3 and 4, the stage-1 cell at n 17 and dimension 3,
      and the hour cap 8, read 2026-10-03. It does not name the
      yield ratio as an integer. The products were recomputed in
      this design session. That computation is not a run. No
      relation was collected.
  scale_relevance:
    tier: toy
    justification: Six listed cells and one written hour cap. No transfer to a yield.
    correspondence: null
  tail_checks:
    - The cross 0 and the difference 386 are required. A check that stops at the excess 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The excess is not 4.
    - The cross is not 0.
    - The difference is not 386.
    - One arm is reported, or a relation is collected.
  success_criterion: >-
    Both runs agree that 12 exceeds 8 by 4, that the cross of 12/8
    against 3/2 is 0, and that 437 exceeds 51 by 386.
  falsification_criterion: >-
    The runs agree that 12 minus 8 is computed, and that difference
    is not 4.
  required_artifacts:
    - experiments/EXP-BINSTD-8ccbc1/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-8ccbc1/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-8ccbc1/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-8ccbc1/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-8ccbc1/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-8ccbc1/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any relation collection, wall-time race, or yield measurement.
    - Any claim that one source is faster than another.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
