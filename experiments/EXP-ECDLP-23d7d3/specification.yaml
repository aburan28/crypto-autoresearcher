experiment:
  id: EXP-ECDLP-23d7d3
  hypothesis_id: H-ECDLP-3165ff
  question_id: RQ-SBRG-f31cb2
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    The closed-form frontier for EXPLICIT reusable precomputation, with two
    pre-registered corrections to its own algebra - a blocking extension-field
    nearby-object gate, a k = 1 embedding check, a Sidon-base control, a matched
    Pollard rho arm, a swept planted cost inflation, a ladder wide enough to
    actually discriminate the predicted exponent, and a curve-free abelian-group
    arm whose expected success is the scope gate

  objective: >-
    If separately approved, authorized and executed, verify symbolically that the
    three-term cost total for k-fold-table reuse of the target-independent part
    of a chained decomposition system optimises to a time and memory exponent
    strictly above one half for every finite k, and check achievability on a toy
    ladder against a matched Pollard rho arm under one frozen operation-counting
    convention. THE DELIVERABLE IS A NEGATIVE FRONTIER FOR ONE FAMILY, offered
    with forward guidance rather than as a closure of the question.

  what_this_is_not:
    - Not an improvement of anything. The exponent moves in the UNFAVOURABLE direction and this contract claims no advantage of any kind.
    - Not an ECDLP hardness result and not a lower bound on anything. It prices ONE family of reusable precomputations under ONE cost model.
    - Not a statement about IMPLICIT or compressed representations. The whole content lives inside the word EXPLICIT.
    - Not a closure of RQ-SBRG-f31cb2. Premature closure is a failure mode symmetric with overclaiming.
    - Not a novelty adjudication. Two likely locations of prior art are named and unopened.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier DERIVATION for the exponent statements and TOY for the measured arm,
    unraisable by any downstream citation. The exact scope a completed run could
    support is - within the stated three-term cost model, explicit table-based
    reuse attains the stated time-memory pair and is dominated by Pollard rho on
    both axes at every k; and on the tested ladder the measured operation counts
    do or do not track that prediction inside a declared band. Any summary
    dropping the word EXPLICIT is overclaiming under AGENTS.md core rule 4.

  preregistered_corrections_to_the_source_algebra: >-
    RECORDED BEFORE ANY EXECUTION, VERIFIED BY HAND, AND CARRIED AS OBLIGATIONS
    ON STAGE 1 RATHER THAN INHERITED.
    CORRECTION 1 - CO-DOMINANCE AT k = 2. The source idea asserts the
    linear-algebra term is subdominant for every k at least 2. At k = 2 the
    linear-algebra exponent 2 over (2k minus 1) equals 2 over 3, which is exactly
    the optimum exponent k over (2k minus 1). The term is CO-DOMINANT, not
    subdominant, at precisely the value of k the measurement arm uses. The
    conclusion is unaffected because the exponent is unchanged, but the stated
    justification is wrong at the tested case and Stage 1 must re-derive it
    explicitly rather than reproduce it.
    CORRECTION 2 - A DEGENERATE DISCRIMINATOR. The source idea pre-registers that
    the measured operation count divided by the predicted quantity must stay
    inside a factor-4 band across a ladder spanning 6 bits of the group order.
    Over that span, a truth of the one-half exponent would make that ratio fall
    by exactly a factor of 2, which is INSIDE the factor-4 band. THE BAND
    THEREFORE CANNOT DISCRIMINATE THE TWO HYPOTHESES IT EXISTS TO SEPARATE. To
    separate them by a factor F the ladder must span more than 6 times the
    base-2 logarithm of F bits of the group order, so a factor-4 band needs a
    span above 12 bits. This contract requires EITHER a ladder spanning more than
    12 bits with the factor-4 band, OR a tightened band of at most factor 1.6
    over a 6-bit ladder, and which was chosen is declared before the run.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) The symbolic optimum of the three-term total gives time and memory
    exponent k over (2k minus 1) at every tested k and arity, verified to 1e-12,
    WITH the k = 2 co-dominance reported explicitly.
    (2) The extension-field nearby-object gate PASSES - the accounting does not
    return worse-than-rho at every degree for the algebraic variant.
    (3) The k = 1 slice reproduces the algebra-free brute-force total.
    (4) A Sidon factor base gives the SAME frontier exponent, because the
    frontier depends on cardinality and not on multiplicity.
    (5) The matched Pollard rho arm lands at the textbook constant within the
    seed spread and is below the table arm at every ladder cell by a factor
    growing with the group order.
    (6) Measured operation counts track the predicted exponent inside the
    declared band over a ladder wide enough to discriminate it.
    (7) A swept planted cost inflation moves the measured band by the predicted
    amount at every magnitude.

  measured_quantities:
    - name: symbolic_exponents
      definition: >-
        Time and memory exponents obtained by numerically minimising the
        three-term total over the factor-base size at each parameter pair,
        against the closed form.
      units: dimensionless, verified to 1e-12
    - name: total_group_operations
      definition: >-
        Total group operations for one complete solve using the table scheme,
        counted under ONE convention frozen before any cell runs.
      units: group operations (dimensionless integer)
    - name: stage_operations
      definition: >-
        Table-build, online-lookup and linear-algebra operations, counted
        separately under the same convention.
      units: group operations (dimensionless integer, three values)
    - name: rho_group_operations
      definition: >-
        Total group operations for a matched Pollard rho run on the IDENTICAL
        instances under the IDENTICAL frozen convention.
      units: group operations (dimensionless integer)
    - name: peak_memory
      definition: Peak memory of the table arm, against the predicted table size.
      units: bytes, and as a ratio to the predicted size
    - name: measured_yield
      definition: >-
        Mean per-target decomposition yield, against the conservation mean, with
        the deviation required to be exactly 0.
      units: decompositions per target (dimensionless), deviation an exact integer
    - name: st2_product
      definition: >-
        Advice size times online time squared for the family, expressed as a
        power of the group order.
      units: dimensionless exponent
    - name: certificate_verification
      definition: >-
        Whether every recovered logarithm and every claimed relation was
        independently re-verified by group arithmetic.
      units: boolean per recovered logarithm, plus a fraction required to be 1.0

  metrics:
    primary: [symbolic_exponents, total_group_operations, rho_group_operations, peak_memory]
    secondary: [stage_operations, measured_yield, st2_product, certificate_verification]

  null_and_control_objects:
    - id: GATE-EXTFIELD
      name: extension-field nearby-object gate, BLOCKING, runs first, zero compute
      construction: >-
        Instantiate the identical accounting in the extension-field regime where
        index calculus demonstrably works, for the enumerative and the algebraic
        variants separately.
      forced_value: >-
        The accounting must NOT return worse-than-rho at every degree for the
        ALGEBRAIC variant.
      non_vacuity: >-
        This is the object on which the conclusion "explicit reuse is always
        dominated" is KNOWN FALSE, because index calculus demonstrably works
        there. If the accounting returns a no-go for the algebraic variant, THE
        ACCOUNTING IS WRONG AND NOTHING IN THIS CONTRACT MAY BE REPORTED. Zero
        compute, and it runs before anything else.
    - id: CONTROL-K1
      name: k = 1 embedding check
      construction: >-
        Evaluate the formula at k = 1, where the table is the factor base itself
        and the online charge is the full enumeration.
      forced_value: reproduces the algebra-free brute-force total
      non_vacuity: Capable of failing on an algebra error, which halts the record.
    - id: CONTROL-SIDON
      name: Sidon-base control
      construction: >-
        Re-run the frontier derivation and the toy ladder with a Sidon factor
        base, which has no repeated sums and which this program's conservation
        finding measures at a coverage ratio above 1.
      forced_value: SAME frontier exponent
      non_vacuity: >-
        A different exponent means a multiplicity assumption has been smuggled
        into a derivation that is supposed to depend only on cardinality, and the
        derivation must be redone.
    - id: NULL-MATCHED-RHO
      name: matched Pollard rho on identical instances
      construction: >-
        Pollard rho on the IDENTICAL instances under the IDENTICAL frozen
        operation-counting convention.
      forced_value: >-
        Lands at the textbook constant times the square root of the group order
        within the seed spread, AND is below the table arm at every ladder cell
        by a factor growing with the order.
      non_vacuity: >-
        A comparison whose baseline arm does not reproduce the textbook constant
        is not measuring a ratio at all, and that cell is void. This is also the
        question's own mandatory control.
    - id: PLANT-INFLATION
      name: swept planted cost inflation
      construction: >-
        A known multiplicative inflation injected into the table arm's charged
        operations at at least 3 magnitudes.
      forced_value: >-
        The measured ratio band moves by the predicted amount at every magnitude.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL AND THE SOURCE IDEA LACKS
        ONE. Without it the exponent check has no demonstrated ability to detect
        a deviation of known size, and its agreement with the prediction means
        nothing.
    - id: CONTROL-YIELD
      name: exact-yield check against the conservation identity
      construction: >-
        Per cell, compare the measured mean per-target yield against the
        conservation mean.
      forced_value: deviation EXACTLY 0
      non_vacuity: >-
        A nonzero deviation means the harvester is not sampling targets uniformly
        and every count from that cell is void.
    - id: NULL-CURVEFREE
      name: curve-free finite abelian group arm
      construction: >-
        The identical three-term accounting and the identical toy measurement
        over a curve-free finite abelian group with a random subset of the same
        size as its factor base, containing no elliptic curve anywhere.
      forced_value: none - the arm is the scope gate
      non_vacuity: >-
        It produces its own exponents and ladder behaviour with intervals.
      consequence_pre_declared: >-
        THIS ARM IS EXPECTED TO REPRODUCE THE ENTIRE FRONTIER AND THE CONSEQUENCE
        IS WRITTEN DOWN IN ADVANCE FOR EXACTLY THAT REASON. The derivation
        depends only on the cardinality of a multiset sumset in a finite abelian
        group and on a counting identity, with no elliptic-curve content
        anywhere. IF THE CURVE-FREE ARM REPRODUCES THE EXPONENTS AND THE LADDER
        BEHAVIOUR, THE FRONTIER IS A STATEMENT ABOUT EXPLICIT PRECOMPUTATION OVER
        FINITE ABELIAN GROUPS AND NOTHING FROM THIS EXPERIMENT MAY BE QUOTED AS A
        STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP.

  scope_gate: >-
    See NULL-CURVEFREE consequence_pre_declared. The gate is evaluated and
    reported BEFORE the frontier is published, and its verdict is printed on the
    face of every quoted exponent.

  independent_variables: [k, arity, group_order, factor_base_size, seed, base_geometry, planted_inflation, arm]

  preregistered_prediction:
    quantity: symbolic time and memory exponents, and the measured operation-count ratio across the ladder
    formula: >-
      Minimising the total over the factor-base size B, with the trial term
      proportional to the group order times B to the (1 minus k), the table term
      B to the k, and the linear-algebra term proportional to B squared, gives B
      of order the group order to the one over (2k minus 1) and time and memory
      both of order the group order to the k over (2k minus 1). That exceeds one
      half exactly when 2k exceeds 2k minus 1, hence strictly for every finite k,
      with the exponent gap one over twice (2k minus 1). At k = 2 the
      linear-algebra term is CO-DOMINANT with the optimum, not subdominant.
    source: >-
      ledger/hypotheses/H-ECDLP-3165ff.yaml predictions P1 through P9, with the
      two pre-registered corrections above verified by hand under
      TASK-20260904-c0edda.
    values_frozen_here:
      k_symbolic: 2 through 12
      arity_symbolic: 3 through 8
      measured_k: 2
      symbolic_tolerance: 1e-12
      ladder_requirement: EITHER span above 12 bits of the group order with a factor-4 band, OR a factor-1.6 band over a 6-bit span; declared before the run
      seeds_per_cell: 5
      factor_base_sweep: at least a 16-fold range at each ladder point
      planted_inflation_magnitudes: at least 3
      yield_deviation_required: exactly 0
      certificate_verification_fraction_required: 1.0
      peak_memory_band: factor 2 around the predicted table size across the ladder

  decision_rule_that_falsifies: >-
    THE ACCOUNTING IS WRONG AND NOTHING IS REPORTED IF the extension-field gate
    returns a no-go for the algebraic variant. The record is withdrawn rather
    than re-scoped.
    THE SYMBOLIC CLAIM IS FALSIFIED IF the optimum does not give the predicted
    exponent at any tested parameter pair. Algebra error; halt.
    THE ACHIEVABILITY CLAIM IS FALSIFIED IF measured operation counts deviate
    from the prediction beyond the declared band on a ladder wide enough to
    discriminate it. The deviation's direction says which term is mis-charged.
    THE SIZE LOWER BOUND IS WEAKENED IF measured peak memory grows materially
    slower than the predicted table size - coordinate collisions are then
    collapsing the table and the cardinality count is wrong. THIS IS THE MOST
    INTERESTING WAY FOR THE RECORD TO BE WRONG and the correction is itself a
    reportable quantity.
    THE RUN IS INVALID if the matched rho arm does not reproduce the textbook
    constant, if the yield deviation is nonzero at a cell, if the planted
    inflation sweep does not move the band by the predicted amount, or if any
    recovered logarithm lacks an independently re-verified certificate.

  stages:
    - id: S0
      name: extension-field gate and Sidon control, zero compute, HARD GATE
      terminates_run: true
      description: >-
        GATE-EXTFIELD first, for both variants. A no-go for the algebraic variant
        ENDS everything and nothing is reported. Then CONTROL-SIDON - the
        frontier exponent must be unchanged under a Sidon base.
    - id: S1
      name: symbolic derivation, zero compute
      terminates_run: true
      description: >-
        Derive the three-term optimum, emit the exponent table over the declared
        parameter ranges, verify to 1e-12, run CONTROL-K1, and REPORT THE k = 2
        CO-DOMINANCE EXPLICITLY rather than reproducing the source idea's
        subdominance claim. Any deviation is an algebra error and halts the run
        before any cell.
    - id: S2
      name: preprocessing-frontier comparison, zero compute
      terminates_run: false
      description: >-
        Compute the advice-size-times-online-time-squared product for the family
        and compare it against the generic preprocessing frontier, WITH THE
        ACHIEVABILITY CAVEAT ATTACHED IN THE TEXT AND NOT IN A FOOTNOTE - the
        achievability result is recalled and was not verified by the authoring
        agent or by the source idea's session.
    - id: S3
      name: ladder specification and power declaration
      terminates_run: true
      description: >-
        Declare the ladder span and the band, satisfying the power requirement in
        CORRECTION 2. A ladder that cannot discriminate the predicted exponent
        from one half at the declared band ENDS the run before any compute is
        spent, because the check would be unfalsifiable.
    - id: S4
      name: achievability ladder
      terminates_run: false
      description: >-
        Implement the k = 2 table scheme at the smallest admissible arity over
        the declared ladder, sweeping the factor-base size at each point,
        counting GROUP OPERATIONS under one frozen convention and not wall clock.
        Every recovered logarithm carries a certificate that an INDEPENDENT
        verifier re-checks by group arithmetic. Run NULL-MATCHED-RHO on the
        identical instances. Screen cells whose conservation mean falls outside
        its admissible range BEFORE the run, not after.
    - id: S5
      name: planted inflation sweep
      terminates_run: true
      description: >-
        PLANT-INFLATION at every magnitude. Failure to move the band by the
        predicted amount ENDS the run; the fit has no demonstrated dynamic range.
    - id: S6
      name: curve-free arm
      terminates_run: false
      description: >-
        The identical accounting and ladder over a curve-free finite abelian
        group. Its verdict is computed and the scope gate evaluated BEFORE the
        frontier is published.
    - id: S7
      name: fit, screening rule, forward guidance
      terminates_run: false
      description: >-
        Compare measured against predicted, emit the screening rule with its
        numbers, and state the forward guidance naming the implicit-representation
        class that this frontier does NOT cover.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 5
    seeds_per_cell: 5
    seeds_policy: >-
      Every cell is addressed by (arm, group_order, factor_base_size,
      base_geometry, seed_index, planted_inflation) and its seed is derived
      deterministically as a SHA-256 over the ASCII bytes of the domain string,
      those fields in that order, and the declared master seed, reduced to 64
      bits. The domain string is EXP-ECDLP-23d7d3/v1. THE TABLE ARM AND THE
      MATCHED RHO ARM CONSUME THE IDENTICAL INSTANCES at each cell - that is what
      makes the comparison a ratio rather than two independent measurements - and
      the curve-free arm is generated at matched orders and factor-base sizes
      from the same derivation with a different arm label. The symbolic stages
      consume no seeds. The master seed is fixed in the frozen contract before any
      execution and is never re-drawn.
    determinism_requirement: >-
      Re-running any tuple must reproduce the identical operation counts and the
      identical recovered logarithm. Any cell failing this is INVALID.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 60
    maximum_memory_gb: 8
    maximum_runs: 200
    maximum_workers: 1
    note: >-
      MEMORY DISCIPLINE STATED BECAUSE THIS PROGRAM HAS A RECORDED MEMORY WALL.
      The largest object anywhere is the k = 2 table at the top of the ladder,
      which by the derivation holds a modest number of entries and occupies a few
      megabytes. This design builds NO Macaulay matrix, NO Groebner basis and NO
      echelon carrier, so it cannot reproduce this program's recorded
      large-memory stops. Peak memory is a REQUIRED reported metric precisely so
      that this prediction can fail.

  stopping_rules:
    - GATE-EXTFIELD returns a no-go for the algebraic variant -> STOP, the accounting is wrong, NOTHING is reported, the record is withdrawn.
    - The symbolic optimum does not give the predicted exponent -> STOP, algebra error.
    - CONTROL-K1 does not reproduce the brute-force total -> STOP, algebra error.
    - CONTROL-SIDON changes the frontier exponent -> STOP, a multiplicity assumption has been smuggled in.
    - The declared ladder cannot discriminate the predicted exponent from one half at the declared band -> STOP before any compute; the check would be unfalsifiable.
    - NULL-MATCHED-RHO does not reproduce the textbook constant at a cell -> that cell is VOID.
    - Yield deviation nonzero at a cell -> that cell is VOID; the harvester is not sampling uniformly.
    - PLANT-INFLATION does not move the band by the predicted amount -> STOP, no demonstrated dynamic range.
    - A cell's conservation mean falls outside its admissible range -> that cell is EXCLUDED BEFORE the run, never explained after.

  invalidation_rules:
    - Any comparison between the table arm and the rho arm counted under different operation conventions is invalid; a mismatch manufactures a factor of order 10 in either direction.
    - Any ratio reported over a ladder that cannot discriminate the predicted exponent at the declared band is invalid; it is an unfalsifiable check.
    - Any recovered logarithm without an independently re-verified certificate is invalid, per the question's own constraint.
    - Any statement about IMPLICIT or compressed representations drawn from this contract is invalid on its face; the frontier bounds EXPLICIT representations only.
    - Any summary of the frontier that drops the word EXPLICIT is overclaiming and is invalid.
    - Any POSITIVE reading of this contract is invalid on its face. The cost model omits the coupon-collector factor and pins the linear-algebra constant, both of which move the conclusion in the SAFE direction for a NEGATIVE reading and the unsafe direction for a positive one.
    - Any quotation of the preprocessing-frontier comparison without its achievability caveat is invalid.
    - Any quoted exponent lacking the curve-free scope-gate verdict on its face is invalid.

  success_criterion: >-
    ALL of - (a) GATE-EXTFIELD passes for the algebraic variant; (b) the symbolic
    optimum reproduces the predicted exponent at every parameter pair to 1e-12
    with the k = 2 co-dominance reported; (c) CONTROL-K1 reproduces the
    brute-force total; (d) CONTROL-SIDON leaves the exponent unchanged; (e) the
    declared ladder satisfies the power requirement; (f) NULL-MATCHED-RHO
    reproduces the textbook constant and is below the table arm at every
    surviving cell; (g) yield deviation exactly 0 at every surviving cell; (h)
    PLANT-INFLATION moves the band by the predicted amount at every magnitude;
    (i) certificate verification fraction 1.0; (j) the curve-free arm completed
    and the scope gate evaluated; (k) the screening rule emitted with its numbers
    and the forward guidance naming the implicit-representation class. Measuring
    a ladder deviation that FALSIFIES the achievability claim is a SUCCESSFUL run
    of this contract; only failing (a) through (j) is unsuccessful.

  falsification_criterion: >-
    Measured operation counts deviating from the prediction beyond the declared
    band over a ladder wide enough to discriminate it, with every control
    passing. The k = 2 accounting is then falsified at the tested scale and the
    deviation's direction says which term is mis-charged. A SECOND, MORE
    INTERESTING FALSIFIER - measured peak memory growing materially slower than
    the predicted table size, meaning coordinate collisions are collapsing the
    table and the cardinality count that the whole size lower bound rests on is
    wrong. A THIRD - an IMPLICIT representation exhibited whose size is smaller
    than the finite set's cardinality and which answers membership faster than
    enumeration; the screening rule does not apply to it, the exhibited object is
    far more valuable than anything here, and it becomes the priority. In every
    case the failing control and cell are named.

  required_artifacts:
    - the extension-field gate's arithmetic for both variants, and its pass or fail
    - the symbolic exponent table over every parameter pair, verified to 1e-12, with the k = 2 co-dominance stated
    - the k = 1 embedding check and the Sidon control's exponent
    - the declared ladder span and band, with the power calculation showing it can discriminate
    - the frozen operation-counting convention, recorded before any cell
    - results.json with total and per-stage operation counts per (arm, cell, seed)
    - matched rho operation counts on the identical instances
    - measured peak memory against the predicted table size
    - measured yield against the conservation mean, with the deviation
    - planted-inflation predicted and measured band movements
    - the advice-size-times-online-time-squared product with its achievability caveat in the text
    - certificate verification pass or fail for every recovered logarithm, with the fraction
    - the curve-free arm's full results and the scope-gate verdict
    - the emitted screening rule and the forward guidance
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - peak resident memory and wall clock per cell
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      The measured arm is toy scale. THE EXPONENT STATEMENTS ARE DERIVATIONS
      UNDER A STATED COST MODEL, NOT MEASUREMENTS, and nothing above the tested
      ladder is validated by any part of this design.
    correspondence: null

  limitations:
    - >-
      NOT AN ECDLP HARDNESS RESULT AND NOT A LOWER BOUND ON ANYTHING. It prices
      ONE family of reusable precomputations under ONE cost model, and it does
      not interact with generic-group bounds - those bound generic algorithms,
      this prices a specific non-generic family, and neither implies the other.
    - >-
      SCOPED TO EXPLICIT REPRESENTATIONS. This contract must NEVER be quoted as
      closing reusable dependencies for this question.
    - >-
      Dominated within a stated cost model is not domination in fact. The model
      omits the coupon-collector factor and pins the linear-algebra constant
      without deriving it; both move the conclusion in the SAFE direction for a
      NEGATIVE reading and the UNSAFE direction for a positive one, so NO
      POSITIVE READING MAY BE TAKEN FROM THIS CONTRACT.
    - >-
      The preprocessing-frontier comparison is CONDITIONAL on an achievability
      result that the authoring agent did not verify and that the source idea
      records as recalled and unopened. If only the lower bound is established,
      the honest statement weakens to "does not saturate the barrier".
    - >-
      A short ladder cannot separate asymptotic forms in general, which is why
      the load-bearing content is the zero-compute derivation and the measurement
      is an achievability and constant check - and why CORRECTION 2 above
      requires the ladder to be wide enough to discriminate at the declared band.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - whether the frontier holds at cryptographically relevant group
      orders cannot be measured here. The exponent statements are derivations and
      the measured ladder is toy; no extrapolation is claimed.
    - >-
      NOVELTY IS NOT ADJUDICATED. Two likely locations of prior art are named in
      the hypothesis and NEITHER WAS OPENED by the authoring agent; the honest
      status is unverified.
    - >-
      Changes no record's status.

  infrastructure_failure_disposition: >-
    A timeout, crash or out-of-memory is INFRASTRUCTURE SIGNAL, recorded as
    failed_infrastructure with its cause and coverage. It is NEVER negative
    mathematical evidence (AGENTS.md core rule 5). The zero-compute stages S0
    through S3 carry the load-bearing content and survive any failure of the
    measurement arm, so a compute failure downgrades the deliverable to the
    derivation rather than voiding the contract.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record and alters no goal. Two corrections
    to the source idea's own algebra are pre-registered above and are obligations
    on S1 and S3 rather than inherited claims.
