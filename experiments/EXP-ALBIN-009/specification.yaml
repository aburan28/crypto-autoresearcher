experiment:
  id: EXP-ALBIN-009
  hypothesis_id: H-ALBIN-009
  version: 1
  title: 'Autolab binary-field BIN-EXP-009: m=4 diagonal'
  status: approved
  objective: 'Archive Autolab experiment `bin_exp009` (binary-field ECDLP) as an immutable harness reproduction
    package. Source finding: m=4 D_solv was blocked in BIN-EXP-008 by the `S5.subs` symbolic-descent explosion
    (S₅ = degree 32, per-variable degree 8). **Unblocked here by a substitution-free EVALUATION descent**:
    build each F₂-component of Φ = S₅(x₁,…,x₄,xR) by evaluating S₅ over all 2^nvars boolean c-assignments
    and Möbius-transforming each F₂-coordinate into a boolean polynomial. **Validated byte-identical to
    the symbolic descent at m=3, n=11** (component sets equal). (Fixed a Sage `^`-vs-`^^` XOR-preparse
    bug in the Möb'
  inputs:
    source_repo: /Volumes/Volume/autolab
    source_commit: dca04ac33e9ffcfc51edb3ae7e7bd558b1962d95
    source_id: bin_exp009
    import_tool: tools/port_autolab_experiments.py
    port_tag: autolab-port-20260731
  controls:
  - Preserve original Autolab scripts/logs/result artifacts under source/
  - Do not re-interpret Autolab negatives as universal impossibility
  - Certificate kind=none unless independently re-verified in-harness
  independent_variables:
  - source_id
  metrics:
    primary:
    - import_complete
    - source_artifact_sha256
    secondary:
    - source_result_present
    - source_script_present
  scale_relevance:
    tier: toy
    justification: Autolab campaigns are predominantly toy/feasibility scale; this import does not raise
      the claim ceiling.
    correspondence: null
  replication:
    seeds:
    - historical
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 1
    total_cpu_hours: 0
    maximum_memory_gb: 1
    maximum_runs: 1
  stopping_rules:
  - Single historical import run; no re-execution in this experiment
  invalidation_rules:
  - Missing source result artifact
  - Mutating runs/ after import (supersede with new RUN id instead)
  success_criterion: Harness package contains specification, analysis, implementation, and one RUN with
    the six required companion artifacts, linked to a hypothesis under the area research question.
  falsification_criterion: Import package fails tools/validate_ledger.py schema checks, or source artifacts
    cannot be located at the pinned Autolab commit.
  required_artifacts:
  - specification.yaml
  - implementation.md
  - analysis.md
  - runs/<RUN>/manifest.yaml
  - runs/<RUN>/command.txt
  - runs/<RUN>/environment.json
  - runs/<RUN>/stdout.log
  - runs/<RUN>/stderr.log
  - runs/<RUN>/raw-result.json
  assigned_to: executor
  approved_by: coordinator
