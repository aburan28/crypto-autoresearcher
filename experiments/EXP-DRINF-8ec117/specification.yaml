# =============================================================================
# EXP-DRINF-8ec117 — version 1, approved by DEC-20261006-619380.
# Frozen measurement: H_coeff versus H_gcd on the six rank-2 Drinfeld
# modules over F_3, and the gap on tau^2 + tau^3. This is not a torsion
# cardinality and not an isogeny-class count. No polynomial was scored
# in this design. Source idea IDEA-20261005-cd4cf5 is copied unchanged
# from origin/design/drinf-474802-torsion because it is not on main.
# =============================================================================
experiment:
  id: EXP-DRINF-8ec117
  hypothesis_id: H-DRINF-79fb00
  question_id: RQ-DRINF-6b5a9d
  source_idea: IDEA-20261005-cd4cf5
  goal_id: null
  version: 1
  title: >-
    Height split of the six rank-2 Drinfeld modules over F_3 by
    tau-valuation, against the gcd of exponents, with neighbor
    tau^2 + tau^3
  status: approved
  approved_by: DEC-20261006-619380
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: DEC-20261006-619380
    approved_by_role: coordinator
    composing_decision: DEC-20261006-619380
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the split is 4+2, and it does not assert that the neighbor heights
      differ.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the six modules split 4+2 by H_coeff, whether H_gcd
    equals H_coeff on each of them, and whether H_coeff minus H_gcd on
    tau^2 + tau^3 equals 1. A different split is a negative. Equal
    heights on that neighbor are a negative. Do not count geometric
    roots and do not compute a Frobenius characteristic polynomial.

  inputs:
    field: F_3
    frobenius: tau is the map x |-> x^3
    characteristic: (T)
    definitions:
      H_coeff: least i with a nonzero coefficient of tau^i
      H_gcd: gcd of the tau-exponents that appear
    modules:
      - id: M00
        rule: Phi_T = 0*tau + 1*tau^2
        g: 0
        Delta: 1
      - id: M01
        rule: Phi_T = 0*tau + 2*tau^2
        g: 0
        Delta: 2
      - id: M10
        rule: Phi_T = 1*tau + 1*tau^2
        g: 1
        Delta: 1
      - id: M11
        rule: Phi_T = 1*tau + 2*tau^2
        g: 1
        Delta: 2
      - id: M20
        rule: Phi_T = 2*tau + 1*tau^2
        g: 2
        Delta: 1
      - id: M21
        rule: Phi_T = 2*tau + 2*tau^2
        g: 2
        Delta: 2
    set_size: 6
    carlitz:
      id: C
      rule: Psi_T = tau
      role: nearby_object_on_which_the_two_definitions_still_coincide
    rank3_neighbor:
      id: N3
      rule: Phi_T = tau^2 + tau^3
      role: nearby_object_on_which_coincidence_is_predicted_to_fail
    forbidden:
      - Do not count geometric roots of any polynomial.
      - Do not compute a Frobenius characteristic polynomial.
      - Do not recount an isogeny-class integer.
      - Do not claim an ECDLP exponent improvement.
      - Do not rename a third PDF rule onto H_coeff or H_gcd.

  controls:
    - id: carlitz-agreement
      statement: >-
        Psi_T = tau has H_coeff = 1 and H_gcd = 1. Agreement there is
        the nearby object on which the two definitions still coincide.
      pass_condition: both integers on the Carlitz module equal 1
      on_fail: Negative. The two definitions were separated on the rank-1 control.
    - id: rank3-separation
      statement: >-
        On tau^2 + tau^3 the coefficient reading returns 2 and the gcd
        reading returns 1. If the two integers are equal, the definitions
        were not separated.
      pass_condition: H_coeff minus H_gcd equals 1 on the neighbor
      on_fail: Negative. Equal heights on the neighbor.
    - id: delta-scaling
      statement: >-
        At fixed g, replacing Delta by the other nonzero value in F_3
        must not change H_coeff or H_gcd. The pairs are (M00, M01),
        (M10, M11), and (M20, M21).
      pass_condition: each pair shares both integers
      on_fail: >-
        The support was mis-read. The run is invalid. Do not score the
        split.

  independent_variables:
    - which of the six pairs (g, Delta) is scored
    - which definition is applied, H_coeff or H_gcd, on the same written polynomial

  metrics:
    primary:
      - id: height1_count
        statement: Number of the six modules with H_coeff = 1.
      - id: height2_count
        statement: Number of the six modules with H_coeff = 2.
      - id: six_module_definition_disagreements
        statement: Number of the six modules on which H_gcd differs from H_coeff.
      - id: rank3_height_difference
        statement: H_coeff minus H_gcd on Phi_T = tau^2 + tau^3.
    secondary:
      - id: rank3_H_coeff
        statement: H_coeff on tau^2 + tau^3.
      - id: rank3_H_gcd
        statement: H_gcd on tau^2 + tau^3.
      - id: carlitz_H_coeff
        statement: H_coeff on Psi_T = tau.
      - id: carlitz_H_gcd
        statement: H_gcd on Psi_T = tau.
      - id: per_module_pair
        statement: The pair (H_coeff, H_gcd) for each of M00, M01, M10, M11, M20, M21.
      - id: scaling_unchanged
        statement: Whether each fixed-g pair shares both integers.

  heuristic_under_test: HA-1
  heuristic_under_test_note: >-
    HA-1 is agreement of the two heights on all six rank-2 modules and
    a difference of 1 on tau^2 + tau^3. A different split, or equal
    heights on that neighbor, is a negative on this field. It is not
    an ECDLP exponent.

  preregistered_prediction:
    quantity: >-
      The 4+2 split of the six modules by H_coeff, agreement of H_gcd
      with H_coeff on each of them, and the difference 1 on
      tau^2 + tau^3.
    formula: >-
      height1_count = 4. height2_count = 2.
      six_module_definition_disagreements = 0.
      rank3_H_coeff = 2. rank3_H_gcd = 1. rank3_height_difference = 1.
      Carlitz H_coeff = Carlitz H_gcd = 1.
      A different split, or equal heights on the neighbor, is the
      negative.
    source: >-
      The prediction is copied from IDEA-20261005-cd4cf5 before any
      run of EXP-DRINF-8ec117. This design session read
      knowledge/literature/KN-LIT-174.md and
      knowledge/literature/KN-LIT-1515.md and did not open either PDF.
      Neither note states a height integer. Drinfeld 1974 is recalled
      and not opened.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are q = 3, deg(T) = 1, six rank-2 modules,
      one rank-1 control, and one rank-3 neighbor. A result on these
      polynomials is not a result at larger q, at larger rank, or at
      a cryptographic field. No extrapolation is authorized.
    correspondence: >-
      Direct reading of the written support. No Deuring correspondence
      and no sampling equivalence is used.

  tail_checks:
    - >-
      There is no sampled tail. The census is six modules. The extreme
      checks are the Carlitz control, where the two integers are
      predicted to agree at 1, and the neighbor, where they are
      predicted to differ by 1. Both are reported.

  replication:
    seeds:
      - name: arithmetic
        algorithm: deterministic reading of the written support of each frozen polynomial
        seed: 0
        note: >-
          No random generator is consulted. seed 0 records that fact.
          Substituting a random sample of modules is forbidden.
    independent_instances: 6
    independent_instances_note: >-
      The six modules are the census. They are not six draws from a
      distribution. The Carlitz module and the rank-3 neighbor are
      controls, not further draws.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not cap the frozen
      polynomials. maximum_runs is 2 so one infrastructure retry may
      take a new run id. Watch expiry is failed_infrastructure, never
      a negative mathematical result.

  procedure:
    score_support: >-
      For each written polynomial, list the exponents with nonzero
      coefficients. H_coeff is the least such exponent. H_gcd is the
      gcd of that set. Do not discard a unit coefficient. Do not take
      the gcd of the coefficient values.
    six: >-
      Score M00, M01, M10, M11, M20, and M21. Count how many have
      H_coeff = 1 and how many have H_coeff = 2. Count how many have
      H_gcd different from H_coeff.
    controls: >-
      Score Psi_T = tau and tau^2 + tau^3. Record both integers on
      each. Compare the three fixed-g pairs and record whether scaling
      Delta changed either integer.
    third_column: >-
      If a later read of the PDF named by KN-LIT-174 defines height by
      a third rule, record that integer in its own column and do not
      rename it to H_coeff or H_gcd. If the PDF is not opened, leave
      the third column unread. The two-column prediction is still
      scored. An unread PDF does not withdraw the split.
    mechanism_assignment:
      - observation: >-
          height1_count is 4, height2_count is 2,
          six_module_definition_disagreements is 0,
          rank3_height_difference is 1, both Carlitz integers are 1,
          and scaling_unchanged is true.
        assigns_to: >-
          The predicted 4+2 split, with agreement on the six modules
          and a gap of 1 on the neighbor. Does not transfer to another
          q or another rank. Does not count torsion or isogeny classes.
      - observation: >-
          height1_count is not 4, or height2_count is not 2, and the
          support was read without a suppressed unit and without taking
          the gcd of coefficients.
        assigns_to: >-
          Negative. The split is not 4+2.
      - observation: >-
          Any of the six modules has H_gcd different from H_coeff, and
          the gcd was taken of the exponents.
        assigns_to: >-
          Negative. The two definitions do not coincide on the six modules.
      - observation: >-
          The two integers on tau^2 + tau^3 are equal.
        assigns_to: >-
          Negative. Equal heights on the neighbor.
      - observation: >-
          The Carlitz integers differ, or either Carlitz integer is not 1.
        assigns_to: >-
          Negative. The rank-1 control did not keep the two definitions together.
      - observation: >-
          Scaling Delta changes an integer, a unit coefficient was
          suppressed, the gcd was taken of coefficients rather than
          exponents, the watch expires, or a dependency is missing.
        assigns_to: >-
          Invalid or failed_infrastructure. Not evidence for either height.

  stopping_rules:
    - Stop when both integers are recorded for the six modules, the Carlitz control, and the neighbor, and one assignment row is named.
    - Do not add a seventh rank-2 module, another q, or another characteristic.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing dependency is failed_infrastructure and is not evidence against the hypothesis.
    - Taking the gcd of the coefficients, rather than the gcd of the exponents, invalidates the run.
    - Suppressing a unit coefficient and thereby hiding a tau-power invalidates the run.
    - A change under Delta scaling, reported as a completed split, invalidates the run.
    - Changing the pre-registered 4+2 split or the neighbor gap of 1 after seeing the integers is forbidden. A correction is a new amendment record, and existing runs are not re-scored against it.

  success_criterion: >-
    The run is a success for the predicted split exactly when the first
    row of mechanism_assignment holds. Any other completed assignment is
    not this success. A different split is not a success. Equal heights
    on tau^2 + tau^3 are not a success. Success can fail.

  falsification_criterion: >-
    The 4+2 split is falsified when the second row of
    mechanism_assignment holds. Agreement of the two definitions on the
    six modules is falsified when the third row holds. The neighbor gap
    of 1 is falsified when the fourth row holds. The Carlitz agreement
    is falsified when the fifth row holds. The sixth row falsifies nothing.

  required_artifacts:
    - experiments/EXP-DRINF-8ec117/runs/RUN-*/manifest.yaml
    - experiments/EXP-DRINF-8ec117/runs/RUN-*/stdout.txt
    - experiments/EXP-DRINF-8ec117/runs/RUN-*/stderr.txt
    - experiments/EXP-DRINF-8ec117/runs/RUN-*/raw-result.json
    - experiments/EXP-DRINF-8ec117/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      The pair (H_coeff, H_gcd) for M00, M01, M10, M11, M20, M21, the
      Carlitz module, and the neighbor; height1_count; height2_count;
      six_module_definition_disagreements; rank3_height_difference;
      scaling_unchanged; and the third-column status unread or a
      quoted third rule. No torsion count and no characteristic
      polynomial.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row.
      It does not change hypothesis status.

  assigned_to: executor
  zero_runs_in_design: true
