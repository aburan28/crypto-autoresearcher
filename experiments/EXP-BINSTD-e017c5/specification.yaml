# EXP-BINSTD-e017c5
# Geometric-mean arithmetic. No walk.
# Approved by DEC-20261003-3e09c8.
experiment:
  id: EXP-BINSTD-e017c5
  hypothesis_id: H-BINSTD-ad984f
  source_idea: IDEA-20261001-6d1b48
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Geometric means and the band cross gap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-3e09c8
  objective: >-
    Check the shared value 56, the cross gap 1, and the sample gap
    104.
  inputs:
    mean_hi: 8
    mean_lo: 64
    mean_ratio: 8
    mean_gap: 56
    var_hi: 56
    var_ratio_hi: 7
    var_lo: 4032
    var_ratio_lo: 63
    band_factor: 2
    artifact_gap: 1
    sample_floor: 200
    histogram_n: 96
    sample_gap: 104
    product_56: 56
  controls:
    - >-
      Sixty-four divided by 8 is 8. Sixty-four minus 8 is 56. Eight
      times 7 is 56. Reporting the two means as equal invalidates
      the run.
    - >-
      The variance at 1 over 8 is 56. The variance at 1 over 64 is
      4032, and 4032 divided by 64 is 63.
    - >-
      Seven over 5 is twice 7 over 10. Three times 5 minus 2 times 7
      is 1. Reporting 3 over 2 as inside 7 over 5 invalidates the
      run. Two hundred minus 96 is 104.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {mean, variance, band}
    - route in {reciprocal, cross_gap}
  metrics:
    primary:
      - mean_gap
      - artifact_gap
      - implementations_agree
    secondary:
      - var_lo
      - sample_gap
      - band_factor
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The mean gap is 56, and it equals 8 times 7. The cross gap of
      3 over 2 against 7 over 5 is 1. The sample gap is 104.
    formula: >-
      Divide 64 by 8 and subtract 8 from 64. Multiply 8 by 7.
      Subtract 2 times 7 from 3 times 5. Subtract 96 from 200.
    source: >-
      IDEA-20261001-6d1b48 states the probability interval, the band
      from 0.7 to 1.4, the factor 1.5, and the counts 200 and 96,
      read 2026-10-03. The products were recomputed in this design
      session. That computation is not a run. No walk was run.
  scale_relevance:
    tier: toy
    justification: Two written probabilities and one written band. No transfer to a walk.
    correspondence: null
  tail_checks:
    - The variance 4032 and the sample gap 104 are required. A check that stops at the mean 8 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cross gap 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The mean gap is not 56.
    - The cross gap is not 1.
    - The sample gap is not 104.
    - A walk is run, or 3 over 2 is reported as inside 7 over 5.
  success_criterion: >-
    Both runs agree that 64 divided by 8 is 8, that 64 minus 8 is
    56, that 8 times 7 is 56, that the variance at 1 over 64 is
    4032, that 3 times 5 minus 2 times 7 is 1, and that 200 minus 96
    is 104.
  falsification_criterion: >-
    The runs agree that 64 divided by 8 is 8, and 3 times 5 minus 2
    times 7 is not 1.
  required_artifacts:
    - experiments/EXP-BINSTD-e017c5/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-e017c5/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-e017c5/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-e017c5/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-e017c5/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-e017c5/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, distinguished-point sample, or distribution fit.
    - Any claim that a waiting time is geometric.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
