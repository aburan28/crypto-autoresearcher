experiment:
  id: EXP-PFDR-fd901a
  hypothesis_id: H-PFDR-09e1b0
  question_id: RQ-PFDR-ae2fba
  idea_id: IDEA-20260903-26aa81
  version: 1
  recorded_at: '2026-09-03'
  drafted_under_task: TASK-20260903-b5d2ae
  battery_position: 1 of 6 (calibration; runs first)
  title: >-
    p-independence calibration of the digit-presented decomposition system
    at fixed shape (m, d, s) = (2, 2, 3): the same 64-column Macaulay
    invariants at p = 4099, at a 64-bit prime, and at the P-256 prime, with
    the small-p rank-drop rate measured and a shape-changing positive control
  status: review_required
  approved_by: null
  assigned_to: executor
  objective: >-
    Establish, before any toy cell in this battery is interpreted, how much
    of a toy-scale degree measurement can be a small-p artifact, by running
    the SAME fixed-shape system at three primes spanning 12 to 256 bits and
    recording every graded invariant per (curve, target, arm). The
    derivation of H-PFDR-09e1b0 says the invariants are p-flat above a
    threshold; this contract measures the threshold and the rank-drop rate
    at 4099, and hands that rate to EXP-PFDR-cbdefb and EXP-PFDR-20ee58 as
    their artifact budget. It also decides, at the two large primes, whether
    the Semaev arm and the random same-support null differ by the same
    integers (Semaev structure carried p-independently) or not at all
    (shape-determined). STAGE 0 (zero compute): write the (2, 2, 3) matrix
    family explicitly at D = 4 and bound the minor degree. STAGE 1: F_p
    engine (the shared meter port) at arbitrary p; frozen-fixture agreement
    with EXP-PFDR-5726af on the shared (2, 2, 3), p = 4099 instance. STAGE
    2: positive control (direct presentation, B = round(p^{1/2}), p in
    {4099, 16411}). STAGE 3: the p-sweep at (2, 2, 3) with all arms, 8
    curves x 5 targets per (cell, p), plus the named P-256 curve; the
    256-bit cells scheduled last. STAGE 4 (zero compute): flatness labels,
    rank-drop rates with intervals, Semaev-minus-null table, outcome.
    Budget note: budgets are at or above the template floors; the run
    granularity is one prime (or one positive-control prime) over all
    curves, targets and arms.
  inputs:
    shape: '(m, d, s) = (2, 2, 3); n = 6 digit variables; window [0, 8)'
    primes:
      - 4099
      - 'the largest prime below 2^64 (expected 2^64 - 59; primality re-confirmed by a deterministic test recorded in the manifest; if it fails, the nearest prime above 2^64 is used and recorded)'
      - 'the P-256 prime 2^256 - 2^224 + 2^192 + 2^96 - 1'
    curves: >-
      8 random short-Weierstrass curves per prime with nonzero discriminant
      and at least two on-curve x in [0, 8) (rejection count reported), plus
      the named NIST P-256 curve at the 256-bit prime (public parameters; if
      it has fewer than two on-curve x in [0, 8), its cell uses a random
      target and is reported separately).
    targets: >-
      5 planted targets per curve: x_R = x(P_1 + P_2) with x(P_1), x(P_2) in
      the window, certificate re-verified by independent point addition;
      the non-curve arm plants via a root of its own S_3 formula.
    generators: >-
      a_{k,i}(a_{k,i} - 1) for k in {1, 2}, i in {0, 1, 2}; S_3(ell_1,
      ell_2, x_R) with ell_k = a_{k,0} + 2 a_{k,1} + 4 a_{k,2}, reduced in
      the multilinear quotient.
    shared_meter: >-
      REQUIRED INPUT (shared prerequisite, DEC-20260903-8cdf8d next_actions
      item 1): the F_p port of experiments/EXP-SBRG-60c55e/driver/
      macaulay.py with arbitrary-precision residues, exposing fall_dim,
      syzygy_dim and the full rank profile per degree, in squarefree mode
      (digit rows) and ordinary-monomial mode (the positive control), with
      (a) the p = 2 known answer against KN-FIND-006 (deficit(3) = 1,
      deficit(4) = 31 at n = 12, null 0) and (b) the planted-syzygy positive
      control passed in the same manifest lineage. This contract does not
      assume the meter exists; it is dispatched only after the tooling
      handoff reports.
    null_series: '(1 + z)^6 (1 - z^4); null d_reg = ceil((6 + 4)/2) = 5 (84cdb7 convention), D_null = 6 (H-PFDR-4148b8 convention); both recorded'
    frozen_fixture: 'the (2, 2, 3), p = 4099 instance shared with EXP-PFDR-5726af (curve seed 1101, target seed 1)'
  controls:
    - id: CTRL-FROZEN-FIXTURE
      blocking: true
      object: 'the shared (2, 2, 3), p = 4099 instance'
      forced_disposition: >-
        Exact integer agreement of the rank profile at every D <= 6 with
        EXP-PFDR-5726af's engine on the same instance (or, if that contract
        has not run, with an independent second implementation of the same
        rank in the same run). A mismatch halts the line.
    - id: CTRL-POSITIVE-P-DEPENDENCE
      blocking: true
      object: 'direct presentation, m = 2, B = round(p^{1/2}), p in {4099, 16411}, 3 curves, 2 planted targets each'
      forced_disposition: >-
        d_ff strictly increasing from p = 4099 (B = 64, predicted 65) to
        p = 16411 (B = 128, predicted 129), the null d_reg = B + 1 of
        IDEA-20260808-093497 with no early fall. Flatness here means the
        instrument is blind to p and no O1 may be reported.
    - id: NULL-SUPPORT
      blocking: true
      object: 'random polynomial of the same multidegree support in the digit variables in place of the substituted S_3, coefficients uniform in F_p, 5 seeds per (curve, target, p)'
      forced_disposition: >-
        p-flat above p_0 by the same derivation; its realised degree
        distribution reported. Its Semaev-minus-null difference at the large
        primes is the shape-versus-structure reading and carries no forced
        value in this contract (H-PFDR-4148b8 predicts d_ff 5 versus 6).
    - id: NEARBY-NON-CURVE-CUBIC
      blocking: false
      object: 'the S_3 formula evaluated at (A, B) with 4 A^3 + 27 B^2 = 0 (singular Weierstrass cubic, no elliptic group law), same digit generators, planted via a root of the formula'
      forced_disposition: >-
        Reported per cell; no direction pre-committed. A profile identical
        to the Semaev arm at every p means the p-axis carries nothing about
        the curve, which is consistent with H-PFDR-4148b8 and is reported
        as such.
    - id: CTRL-SECONDARY-DIRECT-FIXED-B
      blocking: false
      object: 'direct presentation at fixed B = 8, m = 2, at the three primes, 3 curves, 2 targets'
      forced_disposition: >-
        p-flat by the same argument with B extra parameters; reported.
    - id: CTRL-NAMED-CURVE
      blocking: false
      object: 'NIST P-256 named curve at the 256-bit prime'
      forced_disposition: >-
        Within the random-curve spread at fixed shape; a named curve
        outside it is a curve-specific rank drop and is reported
        individually with its minors' content check.
    - id: CTRL-CONFOUNDERS-NAMED
      blocking: false
      object: >-
        (i) the CRT / complete-splitting artifact of IDEA-20260830-cb8e46:
        the ideal is the vanishing ideal of a tiny point set and every
        ideal-invariant observable is determined by it; only generator-level
        observables (rank profiles) are read here. (ii) the output-degree
        proxy of IDEA-20260807-899c5e: no Groebner-basis degree is read or
        compared; every number is an exact graded rank.
      forced_disposition: >-
        Named and excluded by construction; any Groebner output degree
        appearing in the artifacts is a covariate, never a metric.
  independent_variables:
    - 'prime p in the three-value ladder (plus the two positive-control primes)'
    - 'arm: Semaev | NULL-SUPPORT | non-curve cubic'
    - 'curve (8 random per p, plus P-256 named) and planted target (5 per curve)'
    - 'degree D in 3..6'
  metrics:
    primary:
      - 'full rank profile rank(M_D), fall_dim(D), syzygy_dim(D) per (p, arm, curve, target) for D in 3..6'
      - 'd_ff per draw and the p-flatness label per invariant per arm (identical integers at the two large primes in at least 95 percent of draws)'
      - 'rank-drop event count and rate at p = 4099 against the 64-bit profile, with binomial 95 percent interval'
      - 'positive-control d_ff at B = 64 and B = 128'
      - 'Semaev minus NULL-SUPPORT per invariant at each large prime'
    secondary:
      - 'deficit at D = 3 and D = 4 against the null series per arm'
      - 'frozen-fixture agreement record'
      - 'content-prime check: small primes dividing the maximal minors at D = 4 (Stage 0 bound)'
      - 'field-element size, peak RSS, wall time per cell; certificate pass/fail per planted target'
  heuristic_under_test: HEUR-001 (rank-drop density) of H-PFDR-09e1b0, with HEUR-002 (shape-determination) read as a secondary arm
  preregistered_prediction:
    quantity: >-
      p-flatness of every graded invariant of the (2, 2, 3) Semaev arm across
      the two large primes, the rank-drop rate at p = 4099, and the
      positive-control d_ff pair.
    formula: >-
      Semaev-arm invariants identical at the 64-bit and 256-bit primes in
      at least 38 of 40 draws per cell; rank-drop rate at 4099 at most
      c_D / 4099 with c_D bounded by the minor degree (below 0.1 per draw);
      positive control d_ff = B + 1 = 65 at p = 4099 and 129 at p = 16411;
      Semaev-minus-null d_ff difference at the large primes equal to
      5 - 6 = -1 (inherited from H-PFDR-4148b8, IDEA-20260903-e1e38b).
    source: >-
      IDEA-20260903-26aa81 claim (A) and (D) (generic rank plus
      Schwartz-Zippel); IDEA-20260808-093497 (null d_reg = B + 1) and
      IDEA-20260808-afe4ce (no early fall in the direct presentation) for
      the positive control; IDEA-20260903-e1e38b (D5) for the cross-check
      value. Fixed on 2026-09-03 before any run; never adjusted afterward.
  scale_relevance:
    tier: toy
    justification: >-
      The tested shape is (2, 2, 3), a 64-column matrix; the 64-bit and
      256-bit primes are reached by the fixed-shape p-sweep, which is a
      sampling shortcut for THESE invariants only. Transfer assumption
      stated: results transfer across p at FIXED s and say nothing about the
      s-axis. The 256-bit cells are degree invariants, not solves, and no
      cryptographic-scale ECDLP claim follows.
    correspondence: >-
      Fixed-shape specialization of one integer matrix family over
      Z[A, B, x_R] (IDEA-20260903-26aa81 claim A); the computation runs on
      the F_p side at each prime; uniformity of sampling is over random
      (A, B) and planted x_R, which is NOT uniform in x_R (the HEUR-001
      content).
  tail_checks:
    - >-
      The cell with the highest rank-drop rate at 4099 and the degree at
      which its drops occur (a drop concentrated at one degree points to a
      content prime or a planting artifact).
    - >-
      Any draw at a large prime whose profile differs from the majority
      profile, reported individually with its curve, target and minors'
      content check.
    - >-
      The named P-256 curve cell against the random-curve spread.
  replication:
    seeds:
      - 'curve seeds 1101..1108 per prime (curve k uses seed 1100 + k)'
      - 'target seeds 1..5 per curve'
      - 'null seeds 7, 11, 13, 17, 19 per (curve, target, p)'
      - 'positive-control curve seeds 2101..2103, target seeds 1..2'
    independent_instances: >-
      8 random curves x 5 targets = 40 draws per (cell, p) on the sweep
      (plus the named curve at 256 bits); 3 curves x 2 targets on the
      positive control; 3 curves x 2 targets on the secondary arm.
      Justification: with the flatness threshold at 95 percent, one
      rank-drop event among 40 draws does not flip a label, and the rate at
      4099 is resolved to about 0.05 with a binomial interval.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 12
    maximum_workers: 1
    notes: >-
      One run = one prime over all curves, targets and arms (3 sweep runs)
      or one positive-control prime (2 runs) or the frozen-fixture check
      (1 run); the remaining budget covers re-runs after an infrastructure
      stop. The 256-bit run is the longest (about 16x word-size field cost
      on 64 columns) and is scheduled last. Above the template floors.
  stages:
    - id: stage-0-derivation
      purpose: 'explicit (2, 2, 3) matrix family at D = 4; minor-degree bound; content primes'
      dominant_operation: writing
      machine_compute: none required
    - id: stage-1-fixture
      purpose: 'engine at arbitrary p; frozen-fixture agreement'
      dominant_operation: exact rank over F_p
      machine_compute: seconds
    - id: stage-2-positive-control
      purpose: 'direct presentation with p-dependent shape'
      dominant_operation: exact rank over F_p on up to 8646 columns
      machine_compute: minutes
    - id: stage-3-sweep
      purpose: 'the p-sweep at (2, 2, 3), all arms; 256-bit last'
      dominant_operation: exact rank over F_p on 64 columns with big residues
      machine_compute: minutes to an hour
    - id: stage-4-analysis
      purpose: 'flatness labels, rank-drop rates, Semaev-minus-null table, outcome'
      dominant_operation: writing
      machine_compute: none required
  stopping_rules:
    - >-
      Stop before Stage 2 if the frozen fixture disagrees; record the
      disagreement as an instrument finding.
    - >-
      Stop before Stage 3 if the positive control is flat in p; record it;
      no sweep number is admissible.
    - >-
      Stop the sweep after the 64-bit prime if the Semaev arm at 4099 and
      at 64 bits disagree in more than 20 percent of draws and the located
      fault is not resolved within the run budget; report O2 candidate.
    - >-
      Stop when all planned cells have a terminal state (measured |
      censored | invalid); no iteration or tuning.
  invalidation_rules:
    - >-
      A timeout, OOM or crash on any cell is failed_infrastructure and is
      never evidence about p-dependence or about the derivation.
    - >-
      A run whose shared meter has not passed the p = 2 known answer
      against KN-FIND-006 and the planted-syzygy positive control in the
      same manifest lineage is invalid.
    - >-
      A planted target whose certificate fails independent re-addition
      invalidates that draw (invalid_measurement), never a rank statement.
    - >-
      Any Groebner output degree used as a metric, any subset-column rank,
      or any timing used as evidence invalidates the cell.
    - >-
      Any cell mixing planted and unplanted targets in one flatness label is
      invalid (the planted subvariety and the uniform family have different
      generic ranks).
  success_criterion: >-
    ALL of: (1) the frozen fixture agrees exactly; (2) the positive control
    shows d_ff = 65 and 129 (strictly increasing); (3) every Semaev-arm
    invariant is identical at the 64-bit and 256-bit primes in at least 38
    of 40 draws per cell; (4) the rank-drop rate at 4099 is reported with
    its interval and is below 0.1 per draw; (5) the Semaev-minus-null table
    at the large primes is reported and is the same at both. This is outcome
    O1 and it is CALIBRATION ONLY: it changes no hypothesis status, mounts
    no attack, and licenses HEUR-FF-1 of IDEA-20260731-009 only conditionally
    on subtracting the measured offset.
  falsification_criterion: >-
    ANY of: O2 -- a Semaev-arm invariant moves between the large primes in
    more than 2 of 40 draws with no fault located (the derivation's
    hypotheses are re-examined and H-PFDR-09e1b0 is weakened with that
    finding); a rank-drop rate at 4099 above 0.1 per draw or one that does
    not fall between 4099 and the 64-bit prime (HEUR-001's small-p model is
    wrong; the measured curve replaces the budget). A positive-control
    failure or a fixture mismatch is an instrument outcome, not a
    falsification, and is reported as such.
  required_artifacts:
    - 'experiments/EXP-PFDR-fd901a/runs/<run-id>/manifest.yaml (command, commit, dirty-tree hash, environment, seeds, parameters, inference block, timing, peak RSS, per-file sha256 of the run package)'
    - 'experiments/EXP-PFDR-fd901a/runs/<run-id>/raw-result.json (per-draw rank profiles, fall_dim, d_ff, deficit, arm, curve, target, certificate results)'
    - 'experiments/EXP-PFDR-fd901a/runs/<run-id>/stdout.log and stderr.log'
    - 'experiments/EXP-PFDR-fd901a/stage0-derivation.md (matrix family, minor-degree bound, content primes)'
    - 'experiments/EXP-PFDR-fd901a/analysis.md (flatness labels, rank-drop rates with intervals, Semaev-minus-null table, positive-control table, verdict against the frozen criteria, censoring table)'
  interpretation_limits:
    - >-
      Calibration of the p-column at fixed s; nothing about the s-axis, no
      yield, no cost, no attack, no cryptographic-scale ECDLP claim.
    - >-
      The 256-bit cells are exact ranks of a 64-column matrix and are
      labelled toy-tier evidence reached by a fixed-shape shortcut.
  id_allocation_provenance: >-
    EXP-PFDR-fd901a pre-allocated by the tasking Coordinator in
    TASK-20260903-b5d2ae (first experiment id, in order). No state was
    scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before this contract is relied on.
