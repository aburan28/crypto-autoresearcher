        status: completed_valid
        wall_seconds: 0.264568
        peak_rss_bytes: 60710912
        certificate: none (6 planted certificates in raw, 0 failed)
      - id: RUN-PFDR-fd901a-posctrl-p16411
        stage: stage-2-positive-control
        status: completed_valid
        wall_seconds: 1.04534
        peak_rss_bytes: 62644224
        certificate: none (6 planted certificates in raw, 0 failed)
      - id: RUN-PFDR-fd901a-sweep-p4099
        stage: stage-3-sweep
        status: completed_valid
        wall_seconds: 1.191595
        peak_rss_bytes: 61800448
        draws: 286
        certificate: none (86 planted certificates in raw, 0 failed)
      - id: RUN-PFDR-fd901a-sweep-p64
        stage: stage-3-sweep
        status: completed_valid
        wall_seconds: 1.71361
        peak_rss_bytes: 61792256
        draws: 286
        certificate: none (86 planted certificates in raw, 0 failed)
      - id: RUN-PFDR-fd901a-sweep-p256
        stage: stage-3-sweep
        status: completed_valid
        wall_seconds: 3.25187
        peak_rss_bytes: 62083072
        draws: 316
        certificate: none (91 planted certificates in raw, 0 failed)
    invalid: []
    failed: []
    censored: []
    tally:
      planned: 6
      completed_valid: 6
      failed_infrastructure: 0
      invalid_measurement: 0
      censored: 0
      runs_used_of_maximum: '6 of 12'
      budget: 'longest run 3.25 s of 3600 s; peak RSS 64 MB of 8 GB; one worker'

  stopping_rules:
    - rule: 'Stop before Stage 2 if the frozen fixture disagrees'
      triggered: false
      evidence: 'RUN-PFDR-fd901a-fixture-p4099: S~ coefficient agreement true; rank profile agreement at D = 3, 4, 5, 6 true (meter = sympy = naive)'
    - rule: 'Stop before Stage 3 if the positive control is flat in p'
      triggered: false
      evidence: 'first fall 66 -> 130 and top-block-full-rank degree 65 -> 129 between p = 4099 and 16411; not flat'
    - rule: 'Stop the sweep after the 64-bit prime if Semaev at 4099 and at 64 bits disagree in more than 20 percent of draws'
      triggered: false
      evidence: 'analyze.py --stop-check-only after RUN-PFDR-fd901a-sweep-p64: any-difference fraction 0.0 of 40'
    - rule: 'Stop when all planned cells have a terminal state'
      triggered: true
      evidence: 'all six planned runs completed_valid; no iteration, no tuning'

  observations:
    frozen_prediction_reference: >-
      specification.preregistered_prediction (fixed 2026-09-03, never
      adjusted): Semaev-arm invariants identical at the 64-bit and 256-bit
      primes in at least 38 of 40 draws per cell; rank-drop rate at 4099 at
      most c_D / 4099 (below 0.1 per draw); positive control d_ff = 65 at
      p = 4099 and 129 at p = 16411; Semaev-minus-null d_ff difference at the
      large primes = -1 (IDEA-20260903-e1e38b D5 via H-PFDR-4148b8).
    stage_0:
      matrix_family: 'stage0-derivation.md: M_4 is the single row S~ with 49 nonzero entries of degree <= 2 in (A, B, x_R); top-degree block constant in the parameters'
      minor_degree_bound: '2 r_D <= 2 rows(D): 2, 12, 30 at D = 4, 5, 6; uniform Schwartz-Zippel bound at 4099: 0.00049, 0.0029, 0.0073 (union 0.0107)'
      content: 'integer content of the D = 4 row = 1; every entry of digit-degree >= 3 has content divisible by 4 and every degree-4 entry by 16, so p = 2 kills the top block (content prime of the top block); no odd prime divides any entry content'
      small_prime_specialisations: 'uniform samples, 24 per prime, equal to the 2^64-59 reference profile: q=2: 0/24 (generator degenerates to degree 2); q=3: 23/24; q=5,7,11,13,17,19,23: 24/24'
    stage_1_fixture:
      instance: 'p = 4099, curve seed 1101 (A = 941, B = 428), target seed 1 (x1 = 4, x2 = 7, x_R = 3690)'
      agreement: 'S~ coefficients identical (meter vs sympy); (rows, cols, full_rank, top_rank) at D = 3: (0, 42, 0, 0); D = 4: (1, 57, 1, 1); D = 5: (6, 63, 6, 2); D = 6: (15, 64, 15, 1) -- meter = DomainMatrix = naive at every D'
      fixture_agrees: true
    stage_2_positive_control:
      p4099: 'B = 64: first-fall d_ff = 66 (6 of 6 draws); first D with top_rank = #monomials(D) = 65 (6 of 6); series d_reg = 65; frozen value 65'
      p16411: 'B = 128: first-fall d_ff = 130 (6 of 6); top-block-full-rank degree 129 (6 of 6); series d_reg = 129; frozen value 129'
      strictly_increasing: true
      first_fall_equals_frozen_integer: false
      top_block_full_rank_degree_equals_frozen_integer: true
      note: 'see deviation D5; both readings recorded, prediction unchanged'
    stage_3_sweep:
      semaev_profile_full_top_D3_to_D6:
        p4099: '[(0,0),(1,1),(6,2),(15,1)] in 40 of 40 draws; d_ff = 5; fall_dim = [0,0,4,14]; deficit_series at D = 3, 4 = 0, 0'
        p64: 'identical, 40 of 40'
        p256: 'identical, 40 of 40; NIST P-256 named curve (window x = {0,5,6}, planted) identical in 5 of 5'
      null_support_profile:
        p4099: '[(0,0),(1,1),(6,6),(15,1)] in 200 of 200; d_ff = 6; fall_dim = [0,0,0,14]'
        p64: 'identical, 200 of 200'
        p256: 'identical, 200 of 200 (+ 25 of 25 on the named curve)'
      noncurve_cubic_profile:
        all_primes: '[(0,0),(1,1),(6,2),(15,1)] in 40 of 40 at each prime; d_ff = 5; fall_dim = [0,0,4,14] -- identical to the Semaev arm at every p (the contract names this reading as consistent with H-PFDR-4148b8; reported, not interpreted)'
      secondary_direct_B8:
        all_primes: 'first-fall d_ff = 10 = B + 2 in 6 of 6 at each prime; top-block-full-rank degree 9 = B + 1 = series d_reg; fall_dim profile D = 4..10 = [0,0,0,0,0,0,2]'
      certificates: '0 failures of 263 planted certificates (decomposition: harness.toycurve re-addition; S_3 root: harness.semaev.s3_eval); every generator vanishes at its planted digit vector'
      curve_rejections: 'one window rejection in total (curve seed 1102 at p = 4099); zero singular-discriminant rejections; zero t = 0 rejections'
      prime_check: '2^64 - 59 prime by 12-base Miller-Rabin and sympy.isprime; no prime in (2^64 - 59, 2^64) -- largest below 2^64 confirmed; fallback not fired. P-256 prime confirmed by both tests.'
    comparison_statistics:
      criterion_3_flatness_64_vs_256: 'Semaev arm: 40 of 40 paired draws identical on EVERY recorded invariant (full_rank, top_rank, fall_dim, syzygy_dim, deficit_series at D = 3..6, d_ff, cumulative profile); threshold 38 of 40 -> condition met (observation). Null arm 200 of 200; non-curve arm 40 of 40; secondary direct arm 6 of 6.'
      criterion_4_rank_drop_at_4099: 'Semaev arm: 0 rank-drop events in 40 draws against the 64-bit modal profile; rate 0.0000, exact Clopper-Pearson 95% interval [0.0000, 0.0881]; any-difference events 0. Null arm 0 of 200 [0, 0.0183]; non-curve arm 0 of 40 [0, 0.0881]. Threshold 0.1 -> below (observation); interval upper bound 0.0881 is itself below 0.1.'
      criterion_5_semaev_minus_null: 'Identical table at 4099, 2^64 - 59 and the P-256 prime: nonzero differences only at D = 5: top_rank -4, fall_dim +4, and d_ff -1 (5 versus 6); every other invariant difference 0. Same at both large primes -> condition met (observation). d_ff difference -1 equals the frozen cross-check value.'
      e1e38b_cross_check: 'Semaev d_ff = 5 with fall_dim(5) = 4 in 120 of 120 draws over the three primes; null d_ff = 6 in 600 of 600; both equal to the frozen IDEA-20260903-e1e38b D5 values (4 + floor(3/2) = 5, D_null = 6, fall_dim 4).'
      rank_drop_rate_versus_p: 'The contract measured the rate at 4099 only (its prime ladder has no 2^16 / 2^20 rung); the falsification clause "does not fall between 4099 and the 64-bit prime" cannot be tested for a rate that is 0 at both; recorded as such.'
    tail_checks:
      highest_rank_drop_cell: 'all three arms at 4099 have 0 events; drops by degree 0 at every D'
      large_prime_deviating_draws: 'none: no draw at 2^64 - 59 or at the P-256 prime deviates from its arm''s modal profile, and no paired 64/256 draw differs'
      named_curve: 'NIST P-256: 5 planted targets, profile equal to the random-curve mode, d_ff = 5; within the random-curve spread (which has zero width)'
    contract_outcome_labels_as_observation: >-
      Frozen success criterion items: (1) fixture agrees: true; (2) positive
      control d_ff 65 and 129: FALSE under the first-fall reading (66 / 130)
      and TRUE under the top-block-full-rank / series-d_reg reading, strictly
      increasing under both; (3) 40 of 40 >= 38: true; (4) rate 0.0 with
      interval [0, 0.088] below 0.1: true; (5) Semaev-minus-null table
      identical at both large primes: true. No falsification clause fired: no
      Semaev invariant moved between the large primes, no rank-drop rate above
      0.1. Whether item (2) is read as satisfied, and whether the labels
      constitute O1, is for the Reviewer and Coordinator; the executor records
      the integers only.

  anomalies:
    - id: A1
      description: >-
        Positive-control integer offset: first-fall d_ff = B + 2 in all 12
        draws while the frozen integer B + 1 is the degree at which the top
        block becomes full-rank (= series d_reg). Deviation D5; recorded,
        not resolved here.
    - id: A2
      description: >-
        The non-curve (nodal cubic) arm is integer-identical to the Semaev arm
        at every prime and every degree. The contract pre-committed no
        direction; recorded.
    - id: A3
      description: >-
        Zero spread anywhere: every arm has a single profile at every prime,
        so every 'within the spread' comparison is a comparison against a
        point. The 95 percent interval on the 4099 rate is therefore
        [0, 0.088], not a point estimate.
    - id: A4
      description: >-
        Wrapper inference block default 'executor-terra' (deviation D9);
        harness/runner.py _inference_block is defined twice.
    - id: A5
      description: >-
        Another executor wrote untracked files under experiments/EXP-PFDR-5726af/
        in the shared worktree during this task (visible in git status);
        they were not read, used or touched.
    - id: A6
      description: >-
        stderr.log is empty in all six runs: no process wrote to stderr
        (RLIMIT_AS was set successfully, so its warning path never fired).

  controls_present:
    CTRL-FROZEN-FIXTURE: 'RUN-PFDR-fd901a-fixture-p4099 (blocking; agrees)'
    CTRL-POSITIVE-P-DEPENDENCE: 'RUN-PFDR-fd901a-posctrl-p4099, -p16411 (blocking; not flat; integer offset A1)'
    NULL-SUPPORT: '200 draws per sweep prime + 25 on the named curve'
    NEARBY-NON-CURVE-CUBIC: '40 draws per sweep prime'
    CTRL-SECONDARY-DIRECT-FIXED-B: '6 draws per sweep prime'
    CTRL-NAMED-CURVE: '5 planted Semaev + 25 null draws on NIST P-256 in RUN-PFDR-fd901a-sweep-p256'
    CTRL-CONFOUNDERS-NAMED: 'statement in analysis.md; no Groebner degree, no subset-column rank, no ideal-level invariant anywhere'

  artifact_paths:
    - experiments/EXP-PFDR-fd901a/implementation.md
    - experiments/EXP-PFDR-fd901a/stage0-derivation.md
    - experiments/EXP-PFDR-fd901a/run_experiment.py
    - experiments/EXP-PFDR-fd901a/analyze.py
    - experiments/EXP-PFDR-fd901a/analysis.md
    - experiments/EXP-PFDR-fd901a/analysis.json
    - experiments/EXP-PFDR-fd901a/execution-report.yaml
    - experiments/EXP-PFDR-fd901a/runs/RUN-PFDR-fd901a-fixture-p4099/
    - experiments/EXP-PFDR-fd901a/runs/RUN-PFDR-fd901a-posctrl-p4099/
    - experiments/EXP-PFDR-fd901a/runs/RUN-PFDR-fd901a-posctrl-p16411/
    - experiments/EXP-PFDR-fd901a/runs/RUN-PFDR-fd901a-sweep-p4099/
    - experiments/EXP-PFDR-fd901a/runs/RUN-PFDR-fd901a-sweep-p64/
    - experiments/EXP-PFDR-fd901a/runs/RUN-PFDR-fd901a-sweep-p256/

  inference:
    requested_policy: executor-implementation
    requested_reasoning_effort: medium
    adapter_resolution: 'python3 -m orchestration.adapter resolve --role executor -> anthropic:claude-sonnet-5 (effort=medium)'
    runtime_reported_model: claude-fable-5-1
    model_verified: false
    model_verified_note: >-
      The adapter binding (claude-sonnet-5) and the model identifier reported
      by the running session (claude-fable-5-1) differ; the executing agent
      cannot verify its own binding from inside the session. Reported as-is
      for the orchestrator to adjudicate.
    fallback_used: unknown
    degraded: false
    independent_session: true
    run_manifests: >-
      run.inference (wrapper-written, deterministic code, no model in the
      loop; carries the harness default 'executor-terra', see D9) and
      inputs.parameters.executor_session_inference (this block) in all six
      manifests.

  completion_gate:
    G1_all_planned_runs_terminal: 'met: 6 of 6 planned runs completed_valid, each with manifest.yaml, command.txt, environment.json, stdout.log, stderr.log, raw-result.json (plus checksums.sha256)'
    G2_raw_and_tables_agree: 'met: analysis.md / analysis.json are generated by analyze.py from runs/*/raw-result.json only; no hand-edited number; stage0-derivation.md quotes raw.stage0_content_check of the fixture run'
    G3_all_controls_present: 'met: see controls_present'
    G4_manifest_contents: 'met with one qualification: commit, dirty flag, per-file sha256 of every executed source file (meter modules included), meter snapshot commit and per-file sha256, meter self-test in lineage, seeds, parameters, wall time (bracket named in timing_source, D1), peak RSS, certificate results, inference blocks; the per-file sha256 of the run package itself is in the sidecar checksums.sha256 because a manifest cannot contain its own hash'
    G5_execution_report: 'met: this file; stopping rules, deviations, observed values against each frozen criterion as observation'
    G6_write_scope: 'met: only experiments/EXP-PFDR-fd901a/ written; no record edited; no status changed; nothing committed; smoke tests confined to the session scratchpad'
    reproduction_check: 'RUN-PFDR-fd901a-fixture-p4099 and RUN-PFDR-fd901a-sweep-p64 re-run from their recorded commands into the scratchpad: metrics and raw (minus self-test timing) byte-identical'

  executor_assessment:
    protocol_complete: true
    data_quality: good
    requires_rerun: false
    note: >-
      Observations only. The executor does not declare H-PFDR-09e1b0
      supported, refuted or calibrated, and does not declare HEUR-001 or
      HEUR-002 validated; the positive-control integer offset (A1 / D5) is
      the one item on which the contract's own label depends on a reading
      that the review round must choose.
