execution_report:
  experiment_id: EXP-PFDR-fd901a
  hypothesis_id: H-PFDR-09e1b0
  handoff_id: TASK-20260903-5a62de
  implementation_commit: 3a9c1b0257923bf7772b811963beaf57d67aa713
  implementation_commit_note: >-
    HEAD (level with origin/main) when every run executed; dirty flag false in
    all six manifests (no tracked file modified). The run script
    experiments/EXP-PFDR-fd901a/run_experiment.py was untracked at run time
    and is pinned by sha256 in every manifest's code.source.files.
  meter:
    package: harness/macaulay_fp
    snapshot_commit: 2d2083e5
    selftest: 'python3 -m pytest tests/test_macaulay_fp.py -q: 52 passed, in every run lineage (recorded in each manifest)'
    per_file_sha256_recorded_in_every_manifest: true
  recorded_at: '2026-09-03'
  executor: executor (Claude Code subagent, independent session)

  protocol_deviations:
    - id: D1
      description: >-
        harness.runner.run_wrapped requires the terminal status before the run
        function executes; the status here is decided by the measurement. The
        script reproduces run_wrapped's bracket verbatim (time.time +
        monotonic clock around fn, then write_run with the measured
        wall_seconds) and passes the decided status; timing.timing_source in
        every manifest names this bracket explicitly. Timing is a covariate,
        never a metric, in this contract.
    - id: D2
      description: >-
        CTRL-FROZEN-FIXTURE: EXP-PFDR-5726af has no run directory, so the
        contract's own fallback was used -- an independent second
        implementation in the same run (sympy-built S~ from
        harness.semaev.s3_expr, dense Macaulay layers, sympy DomainMatrix rank
        over GF(4099) and a naive elimination), compared at every D in 3..6.
    - id: D3
      description: >-
        The frozen null seeds 7, 11, 13, 17, 19 are mixed with (p, curve seed,
        target seed) into the RNG seed (sha256, recorded per draw as
        rng_seed_mixed); used verbatim on the identical support they would
        produce the same null polynomial for every (curve, target).
    - id: D4
      description: >-
        CTRL-SECONDARY-DIRECT-FIXED-B names no seeds; positive-control seeds
        2101..2103 / targets 1..2 were used and recorded.
    - id: D5
      description: >-
        The frozen positive-control prediction 'd_ff = B + 1 = 65 / 129':
        under the contract's d_ff definition (first degree with fall_dim > 0,
        per-layer, the definition applied to every other arm) the measured
        first fall is B + 2 = 66 / 130 in all 12 draws; the first degree at
        which the top block reaches full column rank (= the semi-regular
        series d_reg = B + 1 of IDEA-20260808-093497) is exactly 65 / 129.
        Both readings are reported; the prediction was not adjusted and
        nothing was re-scored. The forced disposition 'strictly increasing'
        holds under either reading, so stopping rule 2 did not fire.
    - id: D6
      description: >-
        With one generator of degree 4 the per-layer matrix at D = 3 has no
        rows; its invariants are recorded as 0 (the contract lists D in 3..6).
    - id: D7
      description: >-
        Read-only git commands (rev-parse, status, show, ls-files) were run by
        the wrapper to pin commit and hashes and by the executor to confirm
        the approval commit; no git write, nothing committed.
    - id: D8
      description: >-
        Deliverable name: the handoff's execution-report.yaml is used (the
        task text said execution_report.yaml).
    - id: D9
      description: >-
        The wrapper-written run.inference block carries the harness default
        requested_policy 'executor-terra' and resolved_model_id 'none
        (deterministic harness execution)': harness/runner.py defines
        _inference_block twice and the later, constant definition shadows the
        adapter-aware one. harness/ is outside this task's write scope, so it
        was not changed; the handoff's policy and the session identifiers are
        recorded in every manifest under
        inputs.parameters.executor_session_inference (see inference below).
        Reported to the Coordinator as a harness finding.

  runs:
    completed:
      - id: RUN-PFDR-fd901a-fixture-p4099
        stage: stage-1-fixture
        status: completed_valid
        wall_seconds: 3.170505
        peak_rss_bytes: 63778816
        certificate: none (planted decomposition certificate in raw, verified independently)
      - id: RUN-PFDR-fd901a-posctrl-p4099
