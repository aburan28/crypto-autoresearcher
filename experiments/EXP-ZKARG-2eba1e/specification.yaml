experiment:
  id: EXP-ZKARG-2eba1e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-49d3ea; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-49d3ea
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Tabulate the exact query-phase detection gap between with-replacement and without-replacement
    verifier sampling over a frozen grid of domain sizes, query counts and corruption rates, with
    zero-corruption and single-query nulls
  objective: 'The one uncertainty a run reduces: how much detection probability the standard with-replacement
    query-phase accounting leaves on the table relative to without-replacement sampling, at named
    shapes rather than in the abstract. Specifically (i) it computes both miss probabilities in exact
    rational arithmetic at every cell of a frozen grid, having first verified both closed forms by
    direct subset enumeration at a tiny domain size and by a seeded Monte Carlo cross-check, so the
    table rests on a checked instrument; (ii) it reports the signed bit discrepancy at forty significant
    digits and the effective with-replacement query count that matches each without-replacement setting,
    giving both the accounting correction and the practically usable conversion; (iii) it separates
    the cells where the discrepancy exceeds one tenth of a bit from those below 2 to the minus 20
    bits, so future contracts in this question can cite a computed boundary rather than assume the
    sampling scheme is immaterial or invoke it vaguely. The run examines no implementation, executes
    no protocol, and searches for no forgery.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: under the stated model of
      a fixed corrupted set and uniform sampling, the exact detection-probability gap between the
      two query-sampling schemes is the tabulated bit discrepancy at each named (N, t, m), and the
      matching with-replacement query count is the reported effective t. What does NOT follow: that
      any implementation anywhere uses either scheme, since none is examined; that any accounting
      in use is wrong, since the with-replacement form is conservative for a without-replacement sampler;
      that the table applies when corruption is adaptive, which is explicitly excluded; anything about
      any deployed, third-party or standardized argument system; and no attack, break, speedup or
      security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Freeze the grid of domain sizes, query counts and corruption
      rates, the bit thresholds, the exact-arithmetic requirement and the print precision. STAGE 1
      (cost: seconds) Implement both miss probabilities in exact rationals and verify them at N equal
      to 12 by enumerating every subset of size t; abort on disagreement. STAGE 2 (cost: seconds)
      Run the Monte Carlo cross-check at small N with a declared seed and report the counting interval.
      STAGE 3 (cost: seconds) Compute both probabilities and the signed bit discrepancy at every cell
      of the grid. STAGE 4 (cost: seconds) Solve by bisection for the effective with-replacement query
      count at every cell to three decimals. STAGE 5 (cost: seconds) Run the three nulls, m equal
      to zero, t equal to one and the Monte Carlo arm, in the same invocation and require their forced
      values. STAGE 6 (cost: seconds) Run the boundary controls at t equal to N minus m and t equal
      to N minus m plus one. STAGE 7 (cost: minutes) Emit the table, the threshold counts, the maximising
      cell, and the floating-point comparison note, then write the immutable run record.'
    instrument: 'Python 3 standard library only, no Sage and no third-party numerics on the load-bearing
      path: math.comb for exact binomial coefficients, fractions.Fraction for exact probabilities,
      decimal.Decimal at 60-digit context for logarithms and bisection, and the random module with
      a declared seed for the Monte Carlo cross-check. The subset enumeration verifier at N equal
      to 12 is written as a separate routine sharing no code with the closed-form implementation.
      Execution is wrapped by harness/runner.py so commit, environment, timing, resources and seeds
      are captured and the run record is immutable, and every table cell is recomputed by an independently
      written verifier from N, t and m alone.'
    parameters: 'Domain sizes N in {12, 256, 4096, 65536, 1048576}, where 12 exists only for the enumeration
      cross-check. Query counts t in {1, 2, 8, 32, 128, 512}, truncated at N minus m where the without-replacement
      form terminates. Corruption rates m over N in {0, 0.001, 0.01, 0.05, 0.25, 0.5}, with m taken
      as the rounded integer and reported exactly. Bit thresholds: one tenth of a bit for material,
      2 to the minus 20 bits for immaterial. Print precision 60 digits, reporting 40 significant digits.
      Monte Carlo cross-check: 1000000 samples at N equal to 256 with a declared seed. Total cells
      5 times 6 times 6 equal to 180 plus boundary controls. Sample size is not applicable to the
      primary path: every cell is exact.'
  controls:
  - Zero-corruption null at m equal to zero, requiring discrepancy exactly zero.
  - Single-query null at t equal to one, requiring discrepancy exactly zero.
  - Monte Carlo cross-check of the hypergeometric miss probability at small N with a declared seed
    and a reported counting interval.
  - Direct subset enumeration at N equal to 12 verifying both closed forms exactly.
  - Degenerate control at t equal to N minus m, where the without-replacement miss probability must
    be exactly the reciprocal of a binomial coefficient and at t equal to N minus m plus one where
    it must be exactly zero.
  - A parallel floating-point recomputation reported only to show how many cells floating point rounds
    to zero.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: the zero-corruption case m equal to zero, run through
    the identical exact-arithmetic pipeline in the same invocation, where both miss probabilities
    must be exactly one and the discrepancy exactly zero at every (N, t). A second null is t equal
    to one, where the two sampling schemes are identical by definition and the discrepancy must again
    be exactly zero. A third null replaces the hypergeometric computation with a Monte Carlo sampler
    drawing subsets uniformly without replacement and counting misses over a large sample, which must
    agree with the exact value inside its counting interval. For the signal arm to mean anything all
    three nulls must return their forced values; a nonzero discrepancy at m equal to zero or at t
    equal to one would prove the pipeline manufactures bits, most likely through a floating-point
    conversion, and no signal number could be reported.'
  independent_variables:
  - domain size N
  - query count t
  - corruption rate m over N
  - sampling scheme (with replacement versus without replacement)
  metrics:
    primary:
    - exact with-replacement miss probability per cell
    - exact without-replacement miss probability per cell
    - signed bit discrepancy per cell
    - effective with-replacement query count per cell
    - count of cells above one tenth of a bit
    secondary:
    - count of cells below 2 to the minus 20 bits
    - maximising cell over the grid
    - Monte Carlo cross-check deviation and its counting interval
    - number of cells a floating-point recomputation rounds to zero
    - wall time of the full table
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The signed bit discrepancy D(N, t, m) between the two query-phase miss probabilities
      at every grid cell, and the effective with-replacement query count t_eff that matches the without-replacement
      detection probability at the same cell.
    formula: 'P_with(N, t, m) equals (1 minus m/N) to the power t. P_without(N, t, m) equals the binomial
      coefficient (N minus m choose t) divided by (N choose t), and equals zero for t greater than
      N minus m. D equals log2 P_with minus log2 P_without. t_eff is the real solution of (1 minus
      m/N) to the power t_eff equal to P_without(N, t, m), that is, t_eff equals log P_without divided
      by log(1 minus m/N). Pre-registered values: D equals exactly zero when m equals zero or t equals
      one; D is strictly positive for t at least two and m at least one; t_eff is at least t always.'
    source: Pre-registered in the parent proposal IDEA-20260816-49d3ea before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Every cell is computed exactly, including at N equal to 2 to the 20, so there
      is no numerical scale gap: cryptographic-size domains are evaluated directly rather than extrapolated.
      The toy tier is assigned because the object evaluated is an accounting model rather than a protocol
      execution, and because the fixed-corrupted-set assumption that makes the hypergeometric form
      correct is verified nowhere in this run. The only transfer assumption is the model itself, namely
      fixed corruption and uniform sampling, and it is stated rather than tested.'
    correspondence: null
  tail_checks:
  - Report the maximising cell and confirm its discrepancy respects the boundary behaviour at t approaching
    N minus m.
  - Report the cells where the without-replacement probability is exactly zero and confirm they are
    flagged as an infinite discrepancy boundary rather than printed as a finite number.
  - Inspect the largest t at the smallest N separately, since that is where dependence between draws
    is strongest and where averaging across the grid would hide the effect.
  - Report the smallest nonzero discrepancy and confirm the exact-arithmetic path did not underflow
    where the closed form says it should not.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the N equal to 12 subset enumeration disagrees with either closed form.
  - Halt if any null returns a nonzero discrepancy or any cell returns a negative one.
  - The run carries no compute risk; if wall time exceeds five minutes the binomial arithmetic is
    being recomputed rather than cached and must be fixed rather than extended.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if both closed forms are verified by enumeration and by the
    Monte Carlo cross-check, all three nulls return their forced values, and the full grid of exact
    probabilities, signed bit discrepancies and effective query counts is emitted with the threshold
    counts and the maximising cell, whether or not any cell exceeds the material threshold.
  falsification_criterion:
  - Subset enumeration at N equal to 12 disagrees with either closed form.
  - Any null returns a nonzero discrepancy.
  - Any cell returns a negative discrepancy.
  - The Monte Carlo cross-check falls outside its counting interval.
  - Every cell falls below 2 to the minus 20 bits, falsifying the existence of a material shape in
    the named grid and closing with that obstruction and the parameter regions needed to reopen it.
  - The effective query count is not monotone in t at fixed N and m.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-49d3ea
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The material threshold of one tenth of a bit is arbitrary and needs a Coordinator ruling or replacement
    by a relative criterion tied to a stated soundness target.
  - Whether the grid should be extended to samplers built from pseudorandom permutations, which are
    neither of the two schemes and are arguably the common case, or whether that belongs in a separate
    record.
  - How the table should present the t greater than N minus m boundary, where the without-replacement
    probability is exactly zero and the discrepancy is unbounded.
  - Whether the adaptive-corruption exclusion should be accompanied by a named successor record, since
    that is where the interesting version of this question lives.
