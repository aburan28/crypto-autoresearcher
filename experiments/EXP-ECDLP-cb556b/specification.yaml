experiment:
  id: EXP-ECDLP-cb556b
  hypothesis_id: H-ECDLP-7525ef
  version: 1
  title: >-
    Verification protocol - score the seven 2026-08-04 prime-field ECDLP barrier
    claims against the closure standard's three bits under a rubric frozen and
    hashed before any record is opened, with a four-record discrimination null
    that must separate, a forced-FAIL and a forced-PASS gate, and a synthetic
    ladder of records carrying exactly 0, 1, 2 and 3 of the required elements
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260807-5a8d61 into a verification protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. This contract changes no record's status and discharges no
    owed promotion; it produces a scored table only.
  objective: >-
    Determine, by reading, whether each of the seven headline barrier claims
    carries the three elements a closure must have to be reusable - a named
    obstruction, an argument, and forward guidance naming what remains open -
    and report the undischarged owed promotions and the current status of the two
    open-problem entries. What artifact is checked (the eight decision records
    and their batch producer artifacts), against what reference (the frozen
    rubric derived from the closure standard), and what result fails it (a bit
    scoring 0 with the missing element named) are all fixed before any record is
    opened for scoring.
  inputs:
    records_under_check: >-
      The eight decision records of the 2026-08-04 closure series named in
      IDEA-20260807-5a8d61's source_refs, plus every producer artifact in the
      batch directories that series wrote, plus the three earlier decision
      records the proposal identifies as stating on their own record that the
      relevant theorem remains unproven.
    reference_rubric: >-
      Written and HASHED BEFORE ANY OF THE SEVEN IS OPENED, into
      results/rubric.md. It must state, for each of the three bits, the exact
      textual conditions under which the bit scores 1: BIT-1 NAMED OBSTRUCTION,
      a single sentence which, if false, reopens the lane, stated as a property
      of the OBJECT rather than of the attempt - a count of mechanisms tried
      scores 0 and never becomes 1 by being longer; BIT-2 ARGUMENT, a derivation,
      a cited theorem, or a measurement with its scope, present in the record or
      cited by exact path from it - a record whose own limitations field states
      the underlying theorem is unproven scores 0; BIT-3 FORWARD GUIDANCE, an
      explicit statement of what remains open and what would reopen the lane.
    claim_tier_labels: >-
      Each claim additionally receives the tier its supporting evidence
      justifies, taken from docs/claims-and-verification.md's tier table, read at
      run time rather than assumed.
    scoring_order: >-
      The control records are scored FIRST, in a randomised order fixed by the
      declared seed, before any of the seven is opened. The scorer records which
      records it has read at each point.
  controls:
    - id: NULL-FOUR-CLASSIFIED
      description: >-
        NAMED DISCRIMINATION NULL, CAN FAIL. Four closures the corpus already
        classifies - two it treats as genuine (carrying an argument and a named
        obstruction) and two it treats as weak or superseded - frozen and hashed
        into results/control_set.yaml before scoring. The rubric must score every
        genuine one strictly above every weak one.
      failure_meaning: >-
        If the rubric gives all four the same score, it discriminates nothing,
        it is a control that cannot fire, and NO verdict on the seven is
        admissible. This is the primary guard and it is a real possible outcome.
    - id: CTRL-FORCED-FAIL
      description: >-
        FORCED FAIL GATE. The decision record whose own limitations field states
        that the underlying theorem remains unproven MUST score 0 on BIT-2. The
        exact limitations sentence is quoted verbatim into the run package.
      failure_meaning: >-
        A rubric that passes the argument bit on a record that says of itself
        that its theorem is unproven is too lenient, and every PASS it issued is
        void.
    - id: CTRL-FORCED-PASS
      description: >-
        FORCED PASS GATE. A closure whose obstruction is a cited theorem with a
        reproduction check MUST score 3 of 3.
      failure_meaning: >-
        A rubric that fails such a record is too strict, and every FAIL it issued
        is void. Together with CTRL-FORCED-FAIL this bounds the rubric on both
        sides, which a single control does not.
    - id: CTRL-PLANTED-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE, PLANTED DEFECTS OF KNOWN SIZE. Four synthetic
        decision records are constructed by the driver, containing exactly 0, 1,
        2 and 3 of the three required elements respectively, each element present
        in a form the rubric's text conditions accept. The rubric must return
        total scores of exactly 0, 1, 2 and 3 AND must name exactly the missing
        elements in each case.
      failure_meaning: >-
        A rubric that does not return the planted counts, or that names the wrong
        missing element, is not resolving the three bits independently, and every
        score it produced is VOID. This converts the rubric from something that
        returns a number into an instrument with a demonstrated response to a
        defect of known size.
    - id: CTRL-BLIND-CONTROL-MEMBERSHIP
      description: >-
        The scorer is not told which records are in NULL-FOUR-CLASSIFIED. Where
        that is impractical, the control set is at minimum frozen and hashed in
        advance and the scoring order is randomised from the declared seed.
      failure_meaning: >-
        A scorer that knows the expected answers is measuring its own
        expectations.
    - id: CTRL-SECOND-SCORER
      description: >-
        A second, non-originating session independently scores ALL seven claims
        and all controls against the same hashed rubric, without reading the
        first scorer's output. Disagreements are REPORTED per bit, never
        reconciled silently.
      failure_meaning: >-
        Disagreement on a bit is a finding about the rubric's determinacy and is
        first-class output, not noise to be averaged away.
    - id: CTRL-CURRENT-STATUS-READ
      description: >-
        The status field of the two open-problem entries is READ AT RUN TIME and
        quoted verbatim, together with the date of the read. The design session
        already confirmed both read `status: open` on 2026-09-04; a change by run
        time is reported rather than absorbed.
      failure_meaning: >-
        Assuming a status that has since changed would build a row against a
        field that no longer exists.
    - id: CTRL-DIRECTORY-LISTING
      description: >-
        For each batch of the closure series, the full top-level directory
        listing is recorded verbatim, so the presence or absence of a reviews
        directory is a recorded observation rather than an assertion.
      failure_meaning: >-
        An absence claim over directories that were never listed is not an
        observation.
  independent_variables:
    - 'claim identity, over the seven headline claims'
    - 'compliance bit, in {named_obstruction, argument, forward_guidance}'
    - 'scorer, in {first session, second non-originating session}'
    - 'record class, in {seven claims, four control closures, four synthetic planted records}'
  metrics:
    primary:
      - >-
        per-claim three-bit vector (three booleans) and claim tier label, with
        the specific missing element named for every bit scoring 0 and the exact
        sentence relied on quoted for every bit scoring 1.
      - >-
        number of the seven claims passing all three bits, an integer out of 7.
      - >-
        number of owed KN-FIND promotions still undischarged, an integer, with
        the id and the naming decision for each.
      - >-
        reconciliation status of the two open-problem entries, as a verbatim
        status string with the read date.
      - >-
        per-batch presence of a reviews directory, a boolean with the full
        directory listing recorded.
    secondary:
      - 'NULL-FOUR-CLASSIFIED scores, four rows, with the separation statistic.'
      - 'CTRL-PLANTED-LADDER returned scores against planted scores, four rows.'
      - 'per-bit inter-scorer disagreement count between the two independent scorings.'
      - 'the hash of results/rubric.md and the timestamp at which it was written, both preceding every score.'
  heuristic_under_test: HEUR-AUDIT-1
  preregistered_prediction:
    quantity: >-
      The number of the seven claims passing all three closure-standard bits.
    formula: >-
      No formula. Pre-registered value: strictly fewer than seven, with at least
      one claim failing BIT-2 because its own record states the underlying
      theorem remains unproven. The vectors must not all be identical.
    source: >-
      IDEA-20260807-5a8d61's predictions block, together with the closure
      standard as stated in AGENTS.md's inventor-protocol section, which this
      design session read in full.
  scale_relevance:
    tier: null
    justification: >-
      NO MEASUREMENT IS MADE AT ANY SCALE. This is a reading protocol producing
      facts about records. `tier` is null rather than `toy` because a scale label
      would falsely imply a measurement.
    correspondence: null
  tail_checks:
    - >-
      The individual claims where the two scorers disagree are reported by name
      and by bit, rather than only as a disagreement count; those are where the
      rubric is either underspecified or informative.
    - >-
      The claim whose score most disagrees with the corpus's existing treatment
      is reported individually, in both directions - a claim the corpus treats as
      weak that scores 3 of 3 is as informative as the reverse.
  replication:
    seeds:
      - 'RUN-ECDLP-cb556b-1 (write and hash the rubric; construct and score the planted ladder and the control set): master seed 20260904071'
      - 'RUN-ECDLP-cb556b-2 (first scoring of the seven claims and the batch directory listings): master seed 20260904072'
      - 'RUN-ECDLP-cb556b-3 (second independent scoring by a non-originating session): master seed 20260904073'
    independent_instances: 2
    replication_note: >-
      SEEDS POLICY. The only randomness in this protocol is the SCORING ORDER,
      which is drawn from the declared master seed so that the order is
      reproducible and so that a scorer cannot infer control membership from
      position. The derived order is recorded in the manifest. Replication is by
      INDEPENDENT RE-SCORING: RUN-3 is performed by a session that has read
      neither RUN-2's output nor its scoring notes, using the same hashed rubric.
      The rubric hash is recorded in all three manifests to prove the same rubric
      was used. No seed or rubric may change after RUN-1; a changed rubric is a
      NEW contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 3
    budget_feasibility_note: >-
      Zero compute; the cost is careful reading of eight decision records, the
      batch producer artifacts, four control closures and four synthetic
      records. Wall clock and memory are set at the template floors and are not
      the binding constraint.
  stopping_rules:
    - >-
      ST-0 RUBRIC GATE. No claim may be scored until results/rubric.md exists
      and its hash is recorded. A run that scores before the rubric is hashed is
      INVALID.
    - >-
      ST-1 PER-RUN CAP. 600 seconds per run; on approaching the cap the run
      STOPS and names every record not reached, with its reason. A partial table
      with a named gap is a result.
    - >-
      ST-2 STOP AND REPORT ON MISSING ARTIFACTS. A batch artifact that cannot be
      read is recorded as UNCOVERED with its path; it is never scored, and never
      inferred from the decision prose that references it.
    - >-
      ST-3 NO INTERPRETATION AND NO REPAIR. The run package emits the scored
      table only. It must NOT file any owed KN-FIND entry, must not supersede any
      open-problem entry, must not downgrade any claim, and must not write an
      evidence or decision record. Those are Coordinator actions on the audit's
      output.
    - >-
      ST-4 SEPARATION OF ROLES. The scoring session must not, in the same run,
      propose replacements for any claim it fails. An auditor who also proposes
      replacements has an incentive to fail claims, and the two outputs are
      separate records.
  invalidation_rules:
    - >-
      INV-NULL. NULL-FOUR-CLASSIFIED does not separate the genuine from the weak
      control closures: the rubric is not measuring closure quality and every
      count is VOID.
    - >-
      INV-FORCED-FAIL. The forced-FAIL record passes BIT-2: the rubric is too
      lenient; every PASS is VOID.
    - >-
      INV-FORCED-PASS. The forced-PASS record fails: the rubric is too strict;
      every FAIL is VOID.
    - >-
      INV-LADDER. CTRL-PLANTED-LADDER does not return exactly the planted counts
      with exactly the planted missing elements named: every score is VOID.
    - >-
      INV-RUBRIC-DRIFT. The rubric hash recorded in RUN-2 or RUN-3 differs from
      RUN-1's: the runs did not use the same instrument and are not comparable.
    - >-
      INV-CONSTANT. All seven claims receive an identical three-bit vector: the
      rubric has no comparator spread on this set and the counts are VOID.
    - >-
      INV-INFRASTRUCTURE. A missing or unreadable file is recorded with its
      terminal status and IS INFRASTRUCTURE SIGNAL, never a compliance failure of
      the record it belongs to.
  success_criterion: >-
    S1. The rubric is written and hashed before any scoring; NULL-FOUR-CLASSIFIED
    separates strictly; CTRL-FORCED-FAIL scores 0 on BIT-2; CTRL-FORCED-PASS
    scores 3 of 3; CTRL-PLANTED-LADDER returns exactly 0, 1, 2, 3 with the
    correct missing elements named; the seven vectors are not all identical; and
    both independent scorings are completed with disagreements reported per bit.
    S1 MET means the scored table is admissible as a set of facts about what the
    seven records contain. IT ESTABLISHES NOTHING MATHEMATICAL, REOPENS NO LANE,
    AND SAYS NOTHING ABOUT ANY ELLIPTIC CURVE.
  falsification_criterion: >-
    F1. All seven claims pass all three bits under a rubric that also passes
    every control. The program legitimately owns the strongest set of barrier
    statements it has produced and H-ECDLP-7525ef's central prediction is
    falsified - a real and welcome outcome. F2. The producer artifacts contain
    arguments the decision records omitted: the defect is in the decision prose,
    not in the research, and the repair is a superseding record rather than a
    downgrade. F3, VOIDING RATHER THAN FALSIFYING: any invalidation rule fires,
    in which case no verdict on any of the seven is admissible. F4, DECLARED IN
    ADVANCE AND BINDING UNDER EVERY OUTCOME: a claim scoring below 3 of 3 is
    recorded as `unverified`, which is NOT a statement that the direction is open
    or promising, and no output of this experiment may be quoted as a statement
    about elliptic curves or the ECDLP.
  required_artifacts:
    - experiments/EXP-ECDLP-cb556b/results/rubric.md
    - experiments/EXP-ECDLP-cb556b/results/rubric_hash.txt
    - experiments/EXP-ECDLP-cb556b/results/control_set.yaml
    - experiments/EXP-ECDLP-cb556b/results/planted_records/
    - experiments/EXP-ECDLP-cb556b/results/scored_table.json
    - experiments/EXP-ECDLP-cb556b/results/owed_promotions.json
    - experiments/EXP-ECDLP-cb556b/results/batch_directory_listings.txt
    - experiments/EXP-ECDLP-cb556b/results/open_problem_status_verbatim.md
    - experiments/EXP-ECDLP-cb556b/results/summary.json
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-1/manifest.yaml
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-1/results.json
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-1/stdout.log
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-2/manifest.yaml
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-2/results.json
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-2/stdout.log
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-3/manifest.yaml
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-3/results.json
    - experiments/EXP-ECDLP-cb556b/runs/RUN-ECDLP-cb556b-3/stdout.log
  required_artifacts_note: >-
    results/rubric.md and results/rubric_hash.txt must exist and be recorded in
    RUN-1's manifest before any claim is scored; the same hash appears in RUN-2
    and RUN-3. results/open_problem_status_verbatim.md quotes the status line of
    each open-problem entry with the date of the read. planted_records/ holds the
    four synthetic decision records with their planted element counts declared in
    a sidecar file written before scoring.
  run_plan:
    - id: RUN-ECDLP-cb556b-1
      description: 'write and hash the rubric; build and score CTRL-PLANTED-LADDER and NULL-FOUR-CLASSIFIED, plus the forced-FAIL and forced-PASS gates'
    - id: RUN-ECDLP-cb556b-2
      description: 'first scoring of the seven claims; batch directory listings; owed-promotion census; open-problem status read'
    - id: RUN-ECDLP-cb556b-3
      description: 'second independent scoring by a non-originating session against the same hashed rubric; per-bit disagreement report'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract verified on 2026-09-04,
      by pattern search, that knowledge/open-problems/KN-OPEN-005.md and
      knowledge/open-problems/KN-OPEN-009.md both still carry `status: open`,
      confirming that specific claim of IDEA-20260807-5a8d61. It read AGENTS.md's
      inventor-protocol section in full. It did NOT open any of the eight
      decision records, any batch directory, docs/inventor-protocol.md, or any
      KN-FIND entry named in the proposal; every other claim in the proposal
      about those files is scheduled for verification in RUN-2, not asserted here.
  source_refs:
    - ledger/hypotheses/H-ECDLP-7525ef.yaml
    - ledger/proposals/IDEA-20260807-5a8d61.yaml
    - knowledge/open-problems/KN-OPEN-005.md
    - knowledge/open-problems/KN-OPEN-009.md
    - ledger/questions/RQ-ECDLP-002.yaml
    - AGENTS.md
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md
  assigned_to: executor
  approved_by: null
