seed_register:
  schema: crypto.autoresearch.ecdlp.seed-register.v2
  source_groups:
    - {group_id: G01, role: train, seed: 101, field_bits: 12}
    - {group_id: G02, role: train, seed: 103, field_bits: 12}
    - {group_id: G03, role: train, seed: 107, field_bits: 13}
    - {group_id: G04, role: train, seed: 109, field_bits: 13}
    - {group_id: G05, role: train, seed: 113, field_bits: 14}
    - {group_id: G06, role: train, seed: 127, field_bits: 14}
    - {group_id: G07, role: train, seed: 131, field_bits: 15}
    - {group_id: G08, role: train, seed: 137, field_bits: 15}
    - {group_id: G09, role: held_out, seed: 139, field_bits: 12}
    - {group_id: G10, role: held_out, seed: 149, field_bits: 13}
    - {group_id: G11, role: held_out, seed: 151, field_bits: 14}
    - {group_id: G12, role: held_out, seed: 157, field_bits: 15}
  calibration_groups:
    anomalous: [CAL-A01, CAL-A02, CAL-A03, CAL-A04]
    low_embedding: [CAL-K01, CAL-K02, CAL-K03, CAL-K04]
  allocation_rule: >-
    Group role and field_bits are fixed before candidate generation. The first
    accepted row under the deterministic candidate function owns the group;
    all rejected candidates and reasons remain in the manifest. No group may be
    replaced after a walk outcome is observed.
  run_count:
    primary_groups: 12
    primary_variants_per_group: 6
    calibration_variants: 8
    maximum_runs: 80
