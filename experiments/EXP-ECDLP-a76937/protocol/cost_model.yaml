cost_model:
  id: COST-ECDLP-a76937-v1
  version: 1
  unit: integer charged_work_units
  formula: >-
    W = FADD + 4*FMUL + 3*FSQR + 80*FINV + 12*PADD + 12*PDBL +
    20*AUT + 2*CANON + 8*CYCLE + 20*RECOVER + RETRY + SERIAL_BYTES +
    ceil(PEAK_MEMORY_BYTES/64) + PRECOMPUTE
  weights:
    FADD: 1
    FMUL: 4
    FSQR: 3
    FINV: 80
    PADD: 12
    PDBL: 12
    AUT: 20
    CANON: 2
    CYCLE: 8
    RECOVER: 20
    RETRY: 1
    SERIAL_BYTES: 1
    PEAK_MEMORY_BYTES_DIVISOR: 64
    PRECOMPUTE: 1
  primary_metric: W / sqrt(subgroup_order)
  charge_scope:
    - instance_generation_and_certificate_replay
    - walk_partition_and_transition
    - automorphism_and_inverse_map
    - orbit_canonicalization
    - cycle_detection_and_fruitless_retries
    - collision_recovery_and_independent_scalar_verification
    - serialized_precomputation_and_raw_receipt_bytes
    - peak_memory_bytes_divided_by_64_rounded_up
  raw_vector_required: true
  recomputation: >-
    Validator recomputes W from the raw counter vector and rejects any summary
    whose arithmetic differs. Wall time is secondary and never replaces W.
  paired_invariance:
    target_scalar: identical_per_source_control_pair
    partition_seed: identical_per_source_control_pair
    stopping_rule: identical_for_all_variants
    cost_model_id: exact_match_required
