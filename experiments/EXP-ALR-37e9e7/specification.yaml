experiment:
  id: EXP-ALR-37e9e7
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-93ea1e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-93ea1e
  question_id: RQ-ALR-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Zero-compute derivation and null-task validation of the read-plus-write traffic floor for
    the open ALR constructor, with the compression factor tabulated at recorded toy instances
  objective: 'The run reduces one uncertainty: whether the softly O(n+N+c) constructor that RQ-ALR-001
    and RQ-ALR-002 leave open is an improvement request or an optimality request. (i) It derives the
    read floor and the write floor implied by the interface exactly as H-ALR-001 and H-ALR-002 state
    it, sums them, and compares the sum against the quoted target, reporting whether they coincide
    to within polylog factors. (ii) It validates that the derivation is sensitive to the output specification
    by applying the identical code path to two null tasks in the same invocation: emission of the
    full remainder array, whose write floor must come out at nN field elements, and emission of a
    single bit, whose floor must collapse to the read term. A derivation that gives all three tasks
    the same floor is void and the run reports that rather than a grading. (iii) It tabulates the
    compression factor nN/(n+N+c) at every recorded ALR instance, reusing the charging model of the
    size ledger so that the two entries remain commensurable. The run computes nothing about curves,
    solves nothing, and asserts no lower bound in any computational model.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: under the stated uniform single-target
      charging model, the interface as written in H-ALR-001 and H-ALR-002 has read floor (n+N)*ceil(log2
      p) bits and write floor c*ceil(log2 p) bits plus support, these coincide with the quoted target
      to within polylog factors, the derivation distinguishes the three tasks as reported, and the
      compression factor takes the tabulated values at the recorded instances. What does NOT follow,
      and must never be inferred: any lower bound on circuits, straight-line programs, RAM machines
      or data structures; any statement that the constructor is hard, unlikely or impossible; any
      statement that the represented routes are near-optimal; any attack, speedup or security consequence.
      The floor is evaded by each of the three escapes the record names, and a run does not close
      any of them.'
  inputs:
    procedure: 'STAGE 0, interface transcription, one hour of reading, zero compute: copy the input
      and output specification verbatim from H-ALR-001 and H-ALR-002 into the contract, with quotes,
      so the derivation is anchored to committed text rather than to paraphrase. STAGE 1, floor derivation,
      minutes: write read and write floors as closed forms in (n, N, c, p). STAGE 2, comparison, seconds:
      evaluate the ratio of the quoted target to the derived floor symbolically and confirm it is
      polylog. STAGE 3, null tasks, seconds: run the identical derivation code path on full-remainder
      emission and on single-bit output, assert three distinct floors. STAGE 4, compression table,
      seconds: evaluate nN/(n+N+c) at every recorded instance from EXP-ALR-001 and EXP-ALR-002 under
      the same charging model as the size ledger entry. STAGE 5, escape instantiation, two hours of
      writing, zero compute: state each of the three dissolution points with the exact additional
      assumption it requires and what it would take to realise it. STAGE 6, cross-check, minutes:
      confirm the charging model matches the size ledger entry element for element. Total compute
      is seconds; total human cost is a few hours of careful writing.'
    instrument: 'Python 3 with sympy for the symbolic polylog comparison and PyYAML for reading committed
      specifications; roughly fifty lines. Repository modules: harness/runner.py for run-record and
      manifest discipline so that even a zero-compute derivation produces an immutable record. No
      curve arithmetic is required, no Sage, no external service. The substantive instrument is the
      committed text of H-ALR-001 and H-ALR-002, quoted rather than paraphrased.'
    parameters: 'All recorded ALR instances: three curve families, seeds 16001, 16002, 18104, 18206,
      18307, 13 independent instances, with (n, N, c, p) as recorded. Plus a synthetic grid n in 4,
      8, 16, 32, 64 crossed with N in 4, 8, 16, 32, 64, 128 and c in 1, 2, 4, 8, 16 for the compression-factor
      surface. Three tasks: locator emission, full remainder emission, single-bit output. Two charging
      models, ceil(log2 p) bits per element and log2 p bits per element, to confirm the ratio is insensitive
      to the rounding choice.'
  controls:
  - Null task one, full remainder emission, whose write floor must be nN field elements, run by the
    identical code path in the same invocation.
  - Null task two, single-bit output, whose floor must collapse to the read term alone.
  - 'Charging-model consistency check against the size ledger entry: both must use ceil(log2 p) bits
    per field element or their ratios are not comparable.'
  - 'Escape enumeration completeness: each of the three named dissolution points is instantiated with
    the specific extra assumption it needs, so that none is left as a vague caveat.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Apply the IDENTICAL floor derivation, in the same invocation of the
    same script, to a task of the same shape whose answer provably requires the full remainder array:
    emit the entire target-divisor remainder R_P for every source point P. For that task the write
    floor must come out at nN*ceil(log2 p) bits, not n+N+c. If the derivation returns the same floor
    for both tasks, it is insensitive to the output specification and measures nothing, and the signal
    arm is void. A second null runs the derivation on a task whose output is a single bit, where the
    floor must collapse to the read term alone. Both nulls run by the same code path in the same invocation.'
  independent_variables:
  - task_specification
  - source_divisor_degree_n
  - target_divisor_degree_N
  - candidate_count_c
  - charging_model
  metrics:
    primary:
    - read_floor_bits
    - write_floor_bits
    - total_floor_field_elements
    - ratio_quoted_target_over_derived_floor
    secondary:
    - null_task_write_floor_full_remainder
    - null_task_floor_single_bit
    - compression_factor_surface
    - charging_model_sensitivity
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The total traffic floor in field elements for each of the three tasks, and the ratio
      of the quoted softly O(n+N+c) target to the derived floor for the locator task.
    formula: 'Locator task: floor = (n + N + c) field elements, defined as input read of the source
      divisor of degree n plus the deduplicated target divisor of degree N, plus output write of the
      degree-c locator. Full-remainder task: floor = (n + N + nN) field elements, dominated by the
      nN write. Single-bit task: floor = (n + N) field elements plus one bit. Predicted ratio of quoted
      target to locator floor: exactly 1 up to polylog factors. Predicted compression factor: nN/(n+N+c),
      predicted to exceed 4 at every recorded instance.'
    source: Pre-registered in the parent proposal IDEA-20260816-93ea1e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The recorded instances are the toy parameters of EXP-ALR-001 and EXP-ALR-002 on
      prime fields near 10^5, and the synthetic grid extends only to n, N at most 128. The derivation
      itself is parameter-free and holds symbolically, so the only scale-dependent output is the compression-factor
      table, which is scoped to those instances. The transfer assumption, stated: the floor formula
      is symbolic and therefore applies at any size, but the compression factor is reported only where
      n, N and c are recorded, and no crypto-scale value is asserted.'
    correspondence: null
  tail_checks:
  - Check the recorded instance with the smallest nN against the largest n+N+c, since that is where
    the compression factor could approach one and make the grading vacuous, and report it explicitly
    rather than reporting only the mean factor.
  - Confirm the single-bit null task's floor does not accidentally include a write term, which would
    indicate the derivation charges output unconditionally.
  - Recompute both floors under the alternative charging model and confirm the ratio is unchanged,
    since a ratio sensitive to rounding is a rounding artifact.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop after the three tasks and the recorded instances are evaluated; do not extend the synthetic
    grid to make the compression factor look larger.
  - Abort and report if the interface transcription from H-ALR-001 and H-ALR-002 is ambiguous about
    what the constructor must emit.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The three tasks receive three distinct floors from the identical code path, the
    locator floor equals (n+N+c) field elements, the ratio of quoted target to derived floor is 1
    up to polylog under both charging models, and a compression-factor table is emitted for every
    recorded instance with its parameters attached.
  falsification_criterion:
  - Two of the three tasks receive the same floor, showing the derivation is blind to output specification.
  - The interface transcription shows the constructor must emit more than the locator, so the write
    floor is not c.
  - The ratio of quoted target to derived floor depends on the charging model.
  - Any recorded instance has compression factor below 2, making the grading vacuous at the lane's
    own parameters.
  - The quoted target is found to be a time bound not commensurable with a traffic floor.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-93ea1e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether deduplication is inside or outside the constructor's job must be ruled on, since it moves
    the read floor from N to the raw target degree.
  - Whether the downstream consumer of the ALR lane requires an explicit locator or would accept an
    implicit representation is not settled by any committed record and directly determines the write
    floor.
  - The escape list is stated as three items and is explicitly not claimed complete; a Coordinator
    should decide whether an incomplete escape list is acceptable in an approved contract or whether
    completeness must be argued first.
