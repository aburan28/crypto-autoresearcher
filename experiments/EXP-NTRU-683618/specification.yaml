experiment:
  id: EXP-NTRU-683618
  hypothesis_id: H-NTRU-31de9f
  derived_from_idea: IDEA-20260809-24eec3
  question_id: RQ-NTRU-9015ee
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Profile-departure detector for the overstretched NTRU event at toy dimension, measured against
    a matched-volume random-lattice null across a q sweep and a block-size ladder, with recovery
    rate measured on the same instances as the incumbent comparator
  objective: >-
    The single uncertainty a run reduces is whether the Gram-Schmidt log-norm profile carries a
    measurable signature of the dense-sublattice event at parameters where recovery does not
    succeed. A run establishes, at one toy n, (i) the empirical distribution of the declared
    departure statistic D on NTRU instances and on matched-volume random lattices, per cell of the
    q sweep and per rung of the block-size ladder, reported as an AUC with a bootstrap interval;
    (ii) the recovery rate on the SAME instances at the same block size, so the comparison against
    the incumbent observable is made inside one invocation rather than across records; (iii)
    beta_detect and beta_recover, the smallest block sizes at which each observable separates or
    succeeds, at each q; and (iv) whether the separation is monotone in block size, which
    distinguishes a structural signal from a reduction artifact. No attack, break or speedup is
    claimed here or would follow from a run, and no statement is made about deployed NTRU
    parameters.
  what_this_is_not:
  - Not an attack, a key recovery, or a speedup of any lattice algorithm. It is a measurement contract.
  - >-
    Not a claim about deployed NTRU parameter sets. The design runs at toy dimension by necessity,
    because the comparison requires the recovery threshold to be reachable inside budget.
  - >-
    Not an estimate of the fatigue point. A detector must be calibrated before it may be used to
    locate a transition; locating one is a separate contract that would consume this run's output.
  - >-
    Not a status change to any hypothesis, evidence, decision or goal record.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the executed n, q ladder, block-size ladder and pinned
      reduction implementation, the declared departure statistic separates NTRU lattices from
      matched-volume random lattices with a stated AUC and interval per cell, the recovery rate on
      the same instances is a stated value per cell, and beta_detect and beta_recover take stated
      values. WHAT DOES NOT FOLLOW - no value or bound for the fatigue point at any parameter set;
      no statement about deployed NTRU or about NTRU-based KEM security; no attack and no speedup;
      and specifically NOT that the measured detection advantage persists at larger n, which is a
      separate numbered heuristic requiring its own approval and its own evidence.
  inputs:
    procedure: >-
      STAGE 0 (zero compute) - pre-declare, and hash into the manifest before any lattice is
      generated, the exact definition of the departure statistic D, the window over which the
      localization is taken, the separation metric, the AUC threshold, the bootstrap procedure, and
      the point in the reduction schedule at which the profile is read. A statistic or window
      chosen after seeing a profile would be fitted to it, and that is the single most likely way
      this contract silently becomes a claim. STAGE 1 (minutes) - the WIRING GATE - generate one
      NTRU instance and one matched random lattice, confirm identical dimension and determinant by
      exact integer arithmetic, confirm the profile has the expected length, and confirm the
      recovery certificate path fires on a deliberately easy instance. STAGE 2 (hours) - the MAIN
      MATRIX - at fixed n, sweep q across the declared ladder; at each q, run the declared block-
      size ladder; at each (q, beta) cell run 20 NTRU instances and 20 matched random lattices in
      the SAME invocation with disjoint seed streams; record the full GSO profile of every instance,
      not a summary, plus the recovery outcome and its certificate. STAGE 3 (minutes) - compute D
      per instance, the per-cell AUC with bootstrap intervals, the per-cell recovery rate, and
      beta_detect and beta_recover per q. STAGE 4 (minutes) - the NULL-NULL arm - compute the AUC
      between two disjoint halves of the matched-random population, whose forced value is 0.5.
      STAGE 5 (zero compute) - assemble the tables and the refusal statement for any regime outside
      the executed ladder.
    instrument: >-
      A single pinned lattice-reduction implementation with its exact version recorded in the
      manifest, invoked with identical parameters and identical schedule for both arms. GSO
      log-norms are read at one declared point of the schedule for every instance. Recovery is
      declared only on a certificate the run wrapper re-verifies independently against the planted
      secret (docs/claims-and-verification.md). Statistics in Python with numpy; bootstrap by numpy
      resampling with a frozen seed. Recorded through harness/runner.py.
    parameters: >-
      One toy n, declared in the contract and not varied within a run. A q ladder of at least six
      rungs spanning the predicted transition at that n, with the rungs fixed before any run. A
      block-size ladder of at least four rungs. 20 NTRU instances and 20 matched random lattices
      per cell, each with a recorded seed drawn from disjoint streams. Matched random lattices are
      constructed at identical dimension and identical determinant, verified per instance by exact
      integer arithmetic rather than asserted.
  controls:
  - >-
    MATCHED-VOLUME NULL (primary, mandatory). Random lattices of identical dimension and identical
    determinant, generated and reduced in the SAME invocation as the NTRU arm with the same
    implementation, schedule and block size. Without it any profile departure could be an artifact
    of volume rather than of structure. It can fail - a determinant mismatch on any instance voids
    that cell.
  - >-
    NULL-NULL ARM, FORCED VALUE DERIVED BEFORE THE RUN. Compute the identical AUC between two
    disjoint halves of the matched-random population. FORCED VALUE 0.5 within the bootstrap
    interval. If the pipeline reports a separation between random lattices and other random
    lattices, the statistic or the estimator is broken and NO cell's NTRU-versus-random AUC may be
    reported.
  - >-
    RECOVERY ARM ON THE SAME INSTANCES. The incumbent observable - recovery success - is measured
    on the identical instances at the identical block size, so the claimed advantage is a
    within-invocation comparison and not a comparison against a number from another record.
  - >-
    BLOCK-SIZE LADDER AS AN ARTIFACT CONTROL. The statistic is computed at four or more block
    sizes; a departure appearing at exactly one rung and absent at both neighbours is reported as a
    reduction artifact rather than as a signal.
  - >-
    CERTIFICATE GATE ON RECOVERY. A recovery is counted only when the run wrapper independently
    re-verifies the recovered vector against the planted secret. A norm-threshold heuristic is not
    a recovery, and a claimed recovery whose certificate fails makes the run completed_invalid.
  - >-
    PRE-DECLARED STATISTIC AND WINDOW, hashed before any lattice is generated.
  - >-
    DETERMINANT-MATCH VERIFICATION PER INSTANCE, by exact integer arithmetic, recorded in the raw
    results rather than assumed from the construction.
  independent_variables:
  - modulus q, across the declared ladder at fixed n
  - BKZ block size, across the declared ladder
  - 'arm: NTRU instance versus matched-volume random lattice'
  - 'observable: departure statistic D versus certified recovery success'
  metrics:
    primary:
    - >-
      separation_auc per (q, beta) cell - dimensionless area under the ROC curve for D separating
      the 20 NTRU instances from the 20 matched random lattices in that cell, with a bootstrap
      confidence interval from 1000 resamples on the frozen seed.
    - >-
      recovery_rate per (q, beta) cell - dimensionless fraction of the 20 NTRU instances whose
      recovered vector passes independent certificate re-verification.
    - >-
      beta_detect and beta_recover per q - integers, the smallest ladder rung at which
      separation_auc exceeds the pre-declared threshold and at which recovery_rate exceeds zero
      respectively, with UNREACHED recorded explicitly where the ladder does not attain it.
    - >-
      block_size_gap per q - integer, beta_recover minus beta_detect, with UNREACHED propagated
      rather than imputed.
    secondary:
    - >-
      null_null_auc per cell - dimensionless, forced to 0.5 within interval.
    - >-
      determinant_match_pass_rate - dimensionless fraction of instance pairs verified at identical
      determinant, forced to 1.0.
    - >-
      per-instance D value and the full GSO log-norm profile, retained raw for every instance.
    - >-
      wall clock and peak resident memory per cell, so the cost of detection versus recovery is
      reported rather than asserted.
    - >-
      seed and reduction-implementation version per instance.
  heuristic_under_test: HEUR-NTRU-PROF-1
  preregistered_prediction:
    quantity: >-
      separation_auc in the cells whose recovery_rate is exactly zero, and the block_size_gap
      beta_recover minus beta_detect at each q.
    formula: >-
      Predicted separation_auc at least 0.80, with the lower end of its bootstrap interval above
      0.60, in at least one (q, beta) cell whose measured recovery_rate is exactly 0. Predicted
      block_size_gap at least 1 rung at at least one q. Under the null that the profile carries no
      information beyond volume, separation_auc equals 0.5 in every cell and block_size_gap is
      undefined because beta_detect is UNREACHED.
    source: >-
      Pre-registered in the parent proposal IDEA-20260809-24eec3, whose predictions block states
      both 'separation appears at q values below the recovery threshold' and 'detection at strictly
      smaller block size, which is the entire value proposition'. The numeric AUC threshold of 0.80
      and the interval floor of 0.60 are the Coordinator's operationalization of those statements
      and are fixed here before any run; they are never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at one small n, far below any deployed NTRU parameter set, and that is forced by the
      design rather than chosen for convenience - the claimed advantage is measured AGAINST the
      recovery rate, so the recovery threshold must be reachable inside budget, which it is only at
      toy dimension. The transfer assumption is stated and is narrow - that a detection advantage
      measured at this n is indicative of an advantage at larger n - and it is explicitly NOT used
      to claim any fatigue-point value or any statement about deployed parameters. It is named here
      as a candidate for its own future heuristic-validation contract, not asserted.
    correspondence: null
  tail_checks:
  - >-
    Report the number of instances in the tail of the D distribution that drive the AUC, and refuse
    a cell whose AUC is driven by fewer than three instances.
  - >-
    Report the AUC computed on the upper and lower halves of the bootstrap distribution separately,
    to expose an unstable estimate.
  - >-
    Report the smallest and largest D observed on the matched-random arm alongside the NTRU arm's
    range, so an overlap that an AUC summarizes away is visible.
  - >-
    Report the recovery rate and the AUC in the same table row, so no cell can be cited for a
    detection advantage without its recovery number attached.
  - >-
    Report every instance whose reduction did not complete the declared schedule, since a truncated
    reduction produces a profile that is not comparable and must be excluded explicitly, not
    silently.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 24.0
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
  - Abort if the determinant-match verification fails on any instance pair; that cell is void.
  - >-
    Abort if the null-null arm's AUC differs from 0.5 by more than its bootstrap interval; the
    estimator is broken and nothing is reportable.
  - >-
    Stop climbing the block-size ladder at a given q once recovery_rate reaches 1.0, since the
    comparison has no content above that rung; record the stop rather than extrapolating.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5) - in particular, a cell not reached is UNREACHED and
    is never reported as no-separation.
  - >-
    The statistic, window, threshold and schedule read-point are frozen before Stage 1 and are not
    revised after any profile is seen.
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 3). A cell whose reductions timed
    out is UNREACHED, not a cell with no separation.
  - >-
    A run whose matched-random arm was not executed in the same invocation as the NTRU arm is
    invalid_measurement - the comparison the contract exists to make was not made.
  - >-
    A run whose null-null arm is missing is invalid_measurement.
  - >-
    Any claimed recovery whose certificate fails independent re-verification by the run wrapper
    makes the run completed_invalid (docs/claims-and-verification.md).
  - >-
    A run whose profiles are read at different points of the reduction schedule between arms is
    completed_invalid; the departure would then measure the schedule, not the lattice.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
    new contract; it is never a repair of this one.
  success_criterion: >-
    The wiring gate passes, the determinant-match rate is 1.0, the null-null AUC is 0.5 within its
    bootstrap interval, and the run reports separation_auc with intervals and recovery_rate for
    every cell of the q-by-beta matrix together with beta_detect, beta_recover and block_size_gap
    per q. H-NTRU-31de9f is SUPPORTED only if separation_auc reaches at least 0.80 with its
    interval floor above 0.60 in at least one cell whose recovery_rate is exactly 0, AND
    block_size_gap is at least 1 rung at at least one q, AND separation is non-decreasing in block
    size across the ladder at that q. Any other outcome is reported as it is, not as a partial
    success.
  falsification_criterion:
  - >-
    separation_auc stays at or below 0.60 in every cell whose recovery_rate is zero - the statistic
    has no power where success counting has none, the proposal's value claim fails, and the
    measured AUC ladder is the recorded obstruction.
  - >-
    block_size_gap is zero or negative at every q - detection is not cheaper than recovery, so the
    detector is dominated by the incumbent observable on the only axis claimed.
  - >-
    Separation is non-monotone in block size with no trend - the departure is a reduction artifact
    and no transition-location estimate may rest on it.
  - >-
    The null-null AUC differs materially from 0.5 - the estimator manufactures separation and no
    number is reportable.
  - >-
    The determinant-match verification fails - the control is not matched, every departure is
    confounded with volume, and nothing is reportable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, reduction-implementation version, resolved model/inference block and environment
  - raw-result.json carrying the full GSO log-norm profile and D value of every instance, not summaries
  - the matched-random arm's measurements, in the same file as the NTRU arm
  - the null-null arm's measurements, in the same file
  - the pre-registration text defining D, the window, the threshold and the schedule read-point, written before the first run and hashed
  - certificates for every claimed recovery, independently re-verified by the run wrapper
  - per-instance determinant values for both arms, as exact integers
  - per-cell wall clock and peak resident memory
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract
    is review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The departure statistic D and its localization window are a derivation gap below and MUST be
    fixed in writing before approval. Choosing them after seeing a profile is the single most
    likely way this contract silently becomes a claim.
  - >-
    The n, q ladder and block-size ladder must be set to values whose recovery threshold is
    demonstrably inside budget, or the comparison against recovery cannot be made and the contract
    has no content.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260809-24eec3
    authored_at: '2026-08-25'
    note: >-
      Controls and predictions are taken from the parent proposal's controls and predictions blocks,
      which name the matched-volume null and the block-size ladder and state both predicted effects.
      The null-null arm, the certificate gate and the same-instance recovery arm are Coordinator
      additions required by AGENTS.md rules 3 and 4 and by docs/claims-and-verification.md.
      Boilerplate identical across contracts by program rule comes from the fixed table. No field is
      invented; a value the proposal did not supply is left as a declared derivation gap.
  derivation_gaps:
  - >-
    The departure statistic D is UNSPECIFIED here. The parent proposal says only 'a localized
    deviation over the profile'. A Coordinator must fix its exact definition, its window and its
    normalization before approval, because a statistic chosen after seeing the histogram is a fit
    and not a measurement.
  - >-
    The value of n, the q ladder and the block-size ladder are not fixed by the parent proposal.
    They must be chosen so that beta_recover is attainable within total_cpu_hours at at least two q
    values, or the block_size_gap metric is UNREACHED by construction and the run cannot decide the
    hypothesis.
  - >-
    The construction of a matched random lattice at identical determinant is stated as a
    requirement but not as a procedure. The exact construction must be named before approval, since
    a mismatch invalidates every cell.
  - >-
    Twenty instances per cell is the parent's figure and gives a coarse AUC. The sample size is NOT
    derived from a target resolution; whether 20 suffices to resolve an AUC of 0.80 from 0.60 at
    the declared interval width must be checked before approval, and increased if it does not.
  - >-
    The reduction implementation and its schedule are not pinned here. Two implementations produce
    different profiles, so the pin must be recorded in the manifest and the result scoped to it.
