# EXP-ECDLP-3c166b
# Stage-0 lower-half x-count for H-ECDLP-85fe43.
# Frozen before the official run.
experiment:
  id: EXP-ECDLP-3c166b
  hypothesis_id: H-ECDLP-85fe43
  source_idea: IDEA-20261006-43905e
  question_id: RQ-ECDLP-4fcbd3
  goal_id: GOAL-ECDLP-001
  version: 1
  title: >-
    Lower-half x-count gap of two curves over F_29
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-77c0f3
  execution_authorized: true
  objective: >-
    Over F_29, count affine points of y^2 = x^3 - x + 1 and
    y^2 = x^3 + x whose x lies in {0, ..., 14} or in {15, ..., 28}.
    The positive reading is the four counts 20, 16, 10, and 9, hence
    imbalances 4 and 1 and gap 3. Counting the first curve twice has
    gap 0. This is not a discrete logarithm.
  inputs:
    prime: 29
    low_end: 14
    curves:
      - name: E1
        equation: "y^2 = x^3 - x + 1"
        expected_low: 20
        expected_high: 16
        expected_projective: 37
      - name: E2
        equation: "y^2 = x^3 + x"
        expected_low: 10
        expected_high: 9
        expected_projective: 20
    expected_gap: 3
    named_future_run_slot: RUN-ECDLP-4a3ca0
  controls:
    - >-
      A y-scan and a Legendre count agree on every residue. A point
      is contributed exactly when the right-hand side is a square,
      including zero.
    - >-
      Counting E1 twice has imbalance gap 0. The discriminants are
      23 and 4 in F_29, both nonzero.
    - >-
      The projective totals are low + high + 1. The pre-registered
      totals are 37 and 20.
  independent_variables:
    - the curve, E1 or E2
  metrics:
    primary:
      - matrix_holds
      - beyond_matrix
    secondary:
      - planted_ok
  heuristic_under_test: >-
    IDEA-20261006-43905e: the half-counts are 20, 16 on the first
    curve and 10, 9 on the second.
  preregistered_prediction:
    quantity: >-
      The four half-counts equal 20, 16, 10, and 9, so the absolute
      gap of the imbalances is 3.
    formula: >-
      The positive reading is that exact match, including projective
      totals 37 and 20. The negative reading is any other pair on a
      valid scanner.
    source: >-
      IDEA-20261006-43905e states those four integers and the gap 3.
      That list was fixed before this driver was executed.
  scale_relevance:
    tier: toy
    justification: >-
      One 29-element field and two cubics. No rho step is run.
    correspondence: null
  tail_checks:
    - A method disagreement or a nonzero self-gap invalidates the cell.
    - A singular model is not scored.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-ECDLP-4a3ca0
    replication_note: >-
      One deterministic pass. No seed is drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-4a3ca0.
    - Do not add a curve, a second prime, or a rho walk.
    - A missed matrix is the recorded result. Do not change the four integers.
  invalidation_rules:
    - The two enumerations disagree, or the self-count gap is nonzero.
    - A named discriminant is zero.
    - A timeout, crash, or missing half.
  success_criterion: >-
    The manifest is valid, planted_ok is true, the four half-counts
    are 20, 16, 10, and 9, and the projective totals are 37 and 20.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and either half-count
    differs from that list or a projective total differs from 37 or 20.
  decision_impact:
    on_positive: >-
      Record that these two curves match the pre-registered half-counts.
      Do not treat the gap as a discrete logarithm or as a rho step.
    on_negative: >-
      Record that the recount missed the pre-registered integers. Do
      not replace the list and do not run rho from this manifest.
  required_artifacts:
    - experiments/EXP-ECDLP-3c166b/runs/RUN-ECDLP-4a3ca0/manifest.yaml
    - experiments/EXP-ECDLP-3c166b/runs/RUN-ECDLP-4a3ca0/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-ECDLP-3c166b/trial-plan.json
    driver: experiments/EXP-ECDLP-3c166b/implementation/run.py
    checker: experiments/EXP-ECDLP-3c166b/implementation/check.py
  out_of_scope:
    - Any prime other than 29, and any third curve.
    - Point halving, a Semaev decomposition, Pollard rho, and a security level.
