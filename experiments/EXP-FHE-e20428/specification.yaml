experiment:
  id: EXP-FHE-e20428
  hypothesis_id: H-FHE-d413e9
  derived_from_idea: IDEA-20260807-a06996
  question_id: RQ-FHE-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Shipped-default census - extracting (N, log q, h, sigma) for sparse and
    uniform secret modes from OpenFHE, Lattigo and TFHE-rs at pinned commits,
    with a sparsity gate at h/N at most 0.05, a uniform-secret baseline, a
    pinning gate and a blocking no-claim gate

  objective: >-
    The one uncertainty a run reduces - whether the parameter sets the
    sparse-secret hybrid attack line targets are anything production libraries
    ship by default, which decides whether RQ-FHE-001 is a deployment question or
    a paper-parameter question and therefore whether it deserves a goal at all. A
    run establishes (i) the shipped default tuple (ring degree N, log q, secret
    Hamming weight h, error sigma) per library per security preset, recorded
    verbatim with a commit sha, a file path and a line reference for every value;
    (ii) the sparsity ratio h/N of every shipped default, against a threshold of
    0.05 fixed before extraction, which decides whether shipped defaults are
    sparse or full-weight ternary; (iii) the same tuples for the UNIFORM-secret
    modes as a baseline, so that any later comparison attributing a difference to
    sparseness alone can be checked for confounding; and (iv) an explicit list of
    every value that could NOT be extracted, with the reason. Arm B, the overlap
    with the reported at-risk published parameter sets, is CONDITIONAL on obtaining
    those sets from a filable source and is expected to be recorded blocked. NO
    security level, bit count or estimator output is produced by any arm, and
    emitting one invalidates the run.

  what_this_is_not:
  - >-
    Not an attack, not an estimator run, not a security analysis, and not a claim
    that any parameter set is or is not secure. It is a source census.
  - >-
    Not a statement about deployed systems. HEUR-FHE-1, that shipped defaults are
    representative of deployments, is NOT tested and is stated as a limit.
  - >-
    Not a reading of any primary attack source. RQ-FHE-001's provenance records
    eprint.iacr.org as unreachable and no primary source as read; that state is
    unchanged by this contract.
  - >-
    Not coverage of HEaaN, which RQ-FHE-001 names in scope but whose source
    availability is not established here. Its absence is recorded, not substituted
    for.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output or
    evidence. No run has been executed under this contract.

  claim_ceiling:
    tier: >-
      census - below toy, because no mathematical object is measured at all. The
      claim_tier_ceiling in RQ-FHE-001 is toy-until-certified-recovery, and this
      contract sits strictly below it.
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the three pinned commits, the shipped default
      tuples are the recorded values, the sparsity ratios are the recorded values,
      the uniform-secret baseline tuples are the recorded values, and a stated list
      of fields was not extractable. WHAT DOES NOT FOLLOW - no security level for
      any parameter set; no bit count; no statement about whether any attack works;
      no statement about deployed configurations, since users override defaults; no
      statement about HEaaN or about any library not read; and no statement about
      the reported at-risk published sets unless arm B actually executed against a
      filable source.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Define DEFAULT precisely and PER LIBRARY -
      which preset, which constructor, which named security level - and record the
      definition before any value is read, because a default chosen after seeing
      the values would select the answer. Pin one commit sha per library. Fix the
      sparsity threshold at h/N at most 0.05. Declare the no-claim gate.
      STAGE 1 (baseline arm, run FIRST). Extract the UNIFORM-secret shipped
      defaults for the same libraries at the same commits. This is the null object
      - if the sparse and uniform envelopes coincide in (N, log q) then sparseness
      is the only variable and any later comparison is clean; if they do not, the
      confound is recorded here rather than discovered later.
      STAGE 2 (signal arm). Extract the sparse or ternary secret shipped defaults -
      N, log q, h, sigma - per preset per library, verbatim, each with file path
      and line reference. Where h is a runtime parameter rather than a constant,
      record WHERE it is set and its documented default; where neither exists,
      record h as NOT EXTRACTABLE for that preset.
      STAGE 3 (sparsity gate). Compute h/N for every shipped default and compare
      against the 0.05 threshold declared at Stage 0.
      STAGE 4 (arm B, CONDITIONAL). Attempt to obtain the identity of the reported
      at-risk published parameter sets from a source that can be filed as a KN-LIT
      entry with citation_verified other than web. IF AND ONLY IF that succeeds,
      tabulate each set as inside or outside each shipped envelope. If it does not
      succeed, record arm B as BLOCKED with the specific source attempted and the
      failure mode, and compute NO fraction.
      STAGE 5 (zero compute). Assemble the census table, the not-extractable list,
      the confound statement from Stage 1, and the explicit refusal statement - no
      security level is emitted.
    instrument: >-
      Source reading at pinned commits over raw.githubusercontent.com, which
      RQ-FHE-001's provenance records as reachable and already used to verify these
      libraries' operation surface. No library is built, no library code is
      executed, no estimator is invoked, no attack is run. Every extracted value is
      accompanied by the URL, the commit sha, the file path and the line range, so
      a reader can re-fetch it. Recorded through harness/runner.py.
    parameters: >-
      Libraries - OpenFHE, Lattigo, TFHE-rs, one pinned commit each. Fields - ring
      degree N, modulus chain and log q, secret Hamming weight h, error sigma. Arms
      - sparse or ternary secret defaults, and uniform secret defaults. Sparsity
      threshold h/N at most 0.05, fixed at Stage 0. HEaaN excluded and recorded as
      excluded.

  controls:
  - >-
    NON-SPARSE BASELINE, mandatory and run FIRST - the shipped defaults for the
    UNIFORM-secret modes of the same libraries at the same commits. If the sparse
    and uniform envelopes coincide in (N, log q) then sparseness is the only
    variable and the comparison is clean; if they do not, the confound is stated.
  - >-
    PINNING GATE, blocking - every extracted value carries a commit sha, a file
    path and a line reference, or it is NOT RECORDED. An unpinned parameter is not
    a shipped parameter.
  - >-
    NO-CLAIM GATE, blocking - the census emits no security level, no bit count and
    no estimator output. A record that quotes bits has exceeded its scope and the
    run is invalid.
  - >-
    NOT-EXTRACTABLE LEDGER - every field that could not be extracted is listed
    explicitly with the reason, so a missing value is visibly missing rather than
    silently absent. Missing data stays missing (AGENTS.md rule 5).
  - >-
    DEFAULT-DEFINITION CONTROL - the meaning of default is fixed per library at
    Stage 0 before any value is read.
  - >-
    ARM B GATE - no overlap fraction is computed unless the published set list came
    from a source filable with citation_verified other than web.

  independent_variables:
  - 'library - OpenFHE, Lattigo, TFHE-rs'
  - 'secret mode - sparse or ternary versus uniform'
  - security preset within a library

  metrics:
    primary:
    - >-
      shipped default tuple - (N as an integer, log q in bits, h as an integer
      Hamming weight, sigma as a real) - one row per (library, preset, secret mode),
      each field carrying commit sha, file path and line range
    - >-
      sparsity ratio h/N - dimensionless - computed per shipped default, reported
      against the 0.05 threshold declared at Stage 0
    - >-
      extractability count - integer out of 3 libraries - the number for which every
      field of the default tuple was extracted at a pinned commit, with the missing
      fields named for the others
    - >-
      envelope coincidence verdict - boolean per library - whether the sparse and
      uniform shipped envelopes coincide in (N, log q)
    secondary:
    - >-
      overlap fraction (ARM B, conditional) - dimensionless - the fraction of
      reported at-risk published parameter sets lying inside a shipped default
      envelope, computed ONLY if the set list came from a filable source; otherwise
      the literal value BLOCKED with the source attempted and the failure mode
    - >-
      per-library preset count - integer - how many named security presets exist,
      so a default is visibly one choice among a known number
    - >-
      h provenance per preset - one of compile_time_constant,
      runtime_parameter_with_documented_default, or not_extractable
    - >-
      the verbatim source excerpt for every recorded value, retained so the census
      is re-checkable without re-fetching
    - >-
      wall clock and the exact URLs fetched, with any fetch failure recorded

  heuristic_under_test:
    id: HEUR-FHE-1
    formal_statement: >-
      Shipped defaults are representative of deployed configurations, in the sense
      that a parameter set outside every shipped default envelope is unlikely to be
      in production use.
    tested_here: false
    consequence: >-
      NOT TESTED and NOT TESTABLE by a source census, because users override
      defaults and no distribution over deployments is observable from source. It
      is recorded as a limit of the census exactly as the parent proposal
      specifies. Every conclusion is therefore about SHIPPED DEFAULTS and never
      about deployed systems, and claim_ceiling enforces that.

  preregistered_prediction:
    quantity: >-
      The number of libraries yielding a complete default tuple at a pinned commit,
      and the minimum sparsity ratio h/N over shipped defaults within each library.
    formula: >-
      Extractability := |{libraries with N, log q, h and sigma all extracted at a
      pinned commit}|; predicted 3 of 3. Sparsity(library) := min over shipped
      defaults of h/N; predicted at most 0.05 in each library. Under the null that
      shipped secrets are full-weight ternary, Sparsity is above 0.05 in every
      library. Under the null that the question is unworkable at all, Extractability
      is below 3 with the missing fields named.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-a06996, whose predictions
      block gives the overlap fraction as the headline and whose
      honest_prior_of_survival records 0.9 that the defaults are extractable at
      pinned commits, 0.45 that a majority of reported at-risk sets lie inside a
      shipped envelope, and 0.0 that this produces a security claim, which it must
      not. The sparsity threshold of 0.05 and the recasting of the primary metric
      onto extractability and sparsity are this contract's response to the fact
      that the published set list is behind an unreachable source; both are fixed
      before any extraction. Never tuned to data.

  scale_relevance:
    tier: >-
      not applicable - no mathematical scale is involved. The census reads real
      shipped parameters, which is the only sense in which it reaches relevant
      scale, and it converts them into no claim about hardness at any size.
    justification: >-
      The design deliberately reaches production-relevant OBJECTS (shipped defaults)
      while reaching zero mathematical claims. That asymmetry is the point - it is
      the cheapest available step that changes what the program knows about
      RQ-FHE-001, and it is the one step the question's own constraints do not
      block, being the question's fifth declared method.
    correspondence: null

  tail_checks:
  - >-
    Report the number of presets per library alongside the defaults, so a default
    is visibly one choice among a known number rather than the only configuration.
  - >-
    Report the SMALLEST and LARGEST h/N per library, not just the minimum, since a
    library shipping one sparse preset among many dense ones is a different fact
    from one shipping sparse defaults throughout.
  - >-
    Report every h whose provenance is runtime_parameter_with_documented_default
    separately from compile-time constants, because a runtime default is weaker
    evidence about what is shipped.
  - >-
    Report the exact URL and fetch timestamp for every value, since a commit sha
    without a reachable URL is not re-checkable.
  - >-
    If arm B executes, report which published sets were EXCLUDED from the
    comparison and why, since a comparison over a filtered subset is not the
    comparison the metric names.

  replication:
    seeds: []
    independent_instances: 1
    note: >-
      Seeds are EMPTY and independent_instances is 1 because the object is a
      deterministic source read at a pinned commit, not a stochastic measurement.
      Replication here means a second reader re-fetching the same commit shas and
      obtaining byte-identical values, which is required as an artifact rather than
      as a repeated run.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 6

  stopping_rules:
  - >-
    Stop and record NOT EXTRACTABLE for a field rather than inferring it from
    documentation, a blog post, or another library's convention.
  - >-
    Do not compute an overlap fraction unless the published set list came from a
    source filable with citation_verified other than web. Record BLOCKED instead.
  - >-
    Stop immediately if any arm would require emitting a security level, a bit
    count or an estimator output.
  - >-
    Stop at the three declared libraries and the pinned commits. Adding a library
    or moving a commit after seeing a sparsity ratio is a different experiment.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
    exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
  - >-
    A network failure, proxy refusal or fetch timeout makes the run
    failed_infrastructure and is NEVER evidence that a default is unextractable
    (AGENTS.md rule 5). Unextractable means read at a pinned commit and not present;
    unreachable means not read.
  - >-
    A run recording any value without a commit sha, a file path and a line
    reference is invalid_measurement - the pinning gate defines what counts as a
    shipped parameter.
  - >-
    A run emitting any security level, bit count or estimator output is
    invalid_measurement and has exceeded the contract's declared scope.
  - >-
    A run computing an overlap fraction from a web-search summary rather than a
    filable source is invalid_measurement.
  - >-
    A run whose definition of DEFAULT was fixed after values were read is
    invalid_measurement.
  - >-
    A run whose libraries, commits or threshold differ from the frozen contract is a
    DIFFERENT experiment and requires a new contract.

  success_criterion: >-
    The Stage 0 default definitions, commit shas and the 0.05 threshold are recorded
    before any value is read; the uniform-secret baseline arm is executed before the
    sparse arm; and the run reports, for all three libraries, either a complete
    default tuple with commit sha, file path and line range for every field, or an
    explicit not-extractable entry naming the missing field and the reason -
    together with the sparsity ratio of every extracted default, the envelope
    coincidence verdict, and either an executed arm B or an explicit BLOCKED record
    with the source attempted. This criterion is decidable from the primary metrics
    alone and says nothing about which values are found.

  falsification_criterion:
  - >-
    Every shipped default in every library has h/N above 0.05. A2 is false, no
    shipped default is sparse in the sense the attack line targets, the reported
    security loss is a paper-parameter problem on this axis, and RQ-FHE-001 does not
    deserve a goal on deployment grounds. This is a cheap and durable negative
    obtained without reading anything blocked.
  - >-
    One or more libraries' default tuples are incomplete at a pinned commit, with
    the missing field named. A1 is false for that library and the question stays
    blocked FOR A STATED REASON that names what would unblock it.
  - >-
    Arm B executes and NO reported at-risk published set lies inside any shipped
    envelope. Claim B is false and the reported loss is confined to published sets
    nobody ships.
  - >-
    Any recorded value lacks a commit sha or a file path. The pinning gate failed and
    the census is void.
  - >-
    The run emits any security level or bit count. The no-claim gate failed and the
    record has exceeded its scope; nothing in it may be cited.

  required_artifacts:
  - >-
    manifest.yaml with the exact commands, commit sha of this repository, dirty-tree
    state, resolved model and inference block, the three library commit shas, every
    URL fetched with its timestamp, and environment
  - >-
    raw-result.json carrying one row per (library, preset, secret mode) with every
    field, its commit sha, file path, line range and verbatim source excerpt - not
    summaries
  - >-
    the uniform-secret baseline rows, in the same file as the sparse rows
  - >-
    the Stage 0 pre-declaration text, written before any value is read and hashed,
    containing the per-library definition of DEFAULT, the pinned commit shas, the
    0.05 sparsity threshold and the no-claim gate
  - >-
    the explicit NOT EXTRACTABLE list with a reason per entry
  - >-
    the arm B record - either the executed comparison with the filable source cited,
    or a BLOCKED entry naming the source attempted and the failure mode

  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution, and under this engagement
    approval is the USER's gate because it authorizes execution and spends compute.
    This contract is NOT approved - approved_by is null and execution_authorized is
    false (AGENTS.md rule 1).
  - >-
    BLOCKING SCOPE RULING REQUIRED, AND IT IS NOT MINE TO MAKE. RQ-FHE-001
    constraint 1 states that no experiment may be designed until the relevant primary
    sources are read and filed as KN-LIT entries with citation_verified other than
    web. The parent proposal argues that a source census is the question's own fifth
    declared method, needs no eprint, makes no security claim, and is therefore
    outside that block. That argument may be right, but the constraint is written
    without an exception and only the approver can rule on it. EITHER the approver
    records a ruling that a no-claim source census falls outside constraint 1, OR a
    versioned amendment to RQ-FHE-001 is recorded first. Executing this contract
    without one of those two would work around a declared blocker, which
    RQ-FHE-001's second constraint expressly forbids.
  - >-
    The parent proposal is not proof-oriented and the paired hypothesis records
    not_applicable_reason on its proof_search_map, so no KN-TECH-080 audit is
    required. Any later estimator recount or attack at these parameters is a
    different record with its own gates.
  - >-
    The per-library definition of DEFAULT, the pinned commit shas and the 0.05
    sparsity threshold must be recorded before any value is read.

  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3 to 5
    source_record: IDEA-20260807-a06996
    authored_at: '2026-08-25'
    note: >-
      Controls (uniform-secret baseline, pinning gate, no-claim gate), the tracked
      object and the falsification conditions are taken from the parent proposal's
      minimal_test and null_object_control blocks. TWO DEPARTURES FROM THE PROPOSAL,
      both recorded rather than silent. First, the proposal's headline metric - the
      fraction of reported at-risk published sets inside the shipped envelope -
      depends on a set list held behind eprint.iacr.org, which RQ-FHE-001's
      provenance records as unreachable; that metric is therefore demoted to a
      conditional arm B and the primary metrics are recast onto extractability and
      sparsity, which are decidable from reachable sources alone. Second, the
      sparsity threshold h/N at most 0.05 is this contract's addition, introduced so
      that some possible extraction outcome counts as negative; it is fixed before
      any extraction. Reachability of raw.githubusercontent.com and the reported 12
      of 16 claim are quoted from RQ-FHE-001 as that record's statements, both of
      them explicitly unverified there. Budgets come from the parent's declared
      estimated_cost (implementation low, compute low). No field is invented.

  derivation_gaps:
  - >-
    The per-library definition of DEFAULT is genuinely ambiguous - libraries ship
    several presets and some expose a security-level enum rather than a single
    default. A Coordinator or the executor must fix it at Stage 0 and record it; a
    definition chosen after seeing the values would select the answer.
  - >-
    The 0.05 sparsity threshold is this contract's choice and is not derived from any
    source. It is defensible as a boundary between sparse and full-weight ternary,
    but a shipped default landing near it must be reported as near it rather than
    binned.
  - >-
    HEaaN is in RQ-FHE-001's declared scope and is not covered. Whether its source is
    obtainable at all is unknown to this contract and is recorded as a gap rather
    than assumed either way.
  - >-
    Whether the Hamming weight is a compile-time constant in each library is unknown
    before the run. If it is a runtime parameter everywhere, arm A2 becomes much
    weaker evidence about what is shipped, and that weakness must be stated in the
    result rather than absorbed.
  - >-
    Arm B has no fallback. If the published set list is unobtainable, the contract
    delivers a shipped-parameter census with nothing to compare it against, which is
    less than the parent proposal promised. That shortfall is disclosed here so the
    approver can decide whether the census alone is worth the budget.
