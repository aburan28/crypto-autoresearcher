experiment:
  id: EXP-ALBIN-25b768
  hypothesis_id: H-ALBIN-913542
  derived_from_idea: IDEA-20260808-b188d0
  question_id: RQ-ALBIN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Verbatim transcription of the last-fall-degree bound's explicit
    m-dependence and of the published factor-base diagonal, composed into a
    time-and-memory cost curve against the published subexponential expression,
    with a gating fixed-m reproduction, a fixed-m negative control, a
    nearby-problem-family arm, and an acquisition register

  objective: >-
    THE ONE UNCERTAINTY A RUN REDUCES -- whether the published subexponential
    binary-ECDLP claim rests on a heuristic or on a theorem, which is decidable
    from the growth of the last-fall-degree bound L(m) in the decomposition
    arity m evaluated on the diagonal the factor-base balance dictates. A run
    establishes -- (i) T1, that the theorem was transcribed VERBATIM with its
    numbering, every hypothesis and its explicit m-dependence; (ii) T2, that
    the transcription reproduces the published n-independence headline on the
    fixed-m slice, which is GATING; (iii) L1, the growth class of L in m, as a
    four-way categorical verdict with the closed form quoted; (iv) D1, the
    diagonal m(n) recovered from the published factor-base balance, or reported
    as not recoverable; (v) C1, the composite cost curve in TIME AND MEMORY
    plotted beside the published subexponential expression; (vi) N1, the
    fixed-m negative control, which must come out polynomial in n; (vii) H1,
    the same composition on the nearby problem family; and (viii) A1, the
    acquisition register. ZERO EXPERIMENTAL COMPUTE. NO NEW ALGORITHM IS
    PROPOSED AND NO ATTACK IS CLAIMED. Binary fields only.

  what_this_is_not:
    - >-
      Not a new algorithm and not an attack. It is a quantifier audit of two
      existing published results, which is the audit KN-TECH-080 mandates
      before compute.
    - >-
      Not a claim of this program's own. If the polynomial outcome fires, the
      resulting unconditional statement belongs to the source authors' theorem
      and is obtained here by composition; it would require independent
      breakthrough-tier review before any status moved.
    - >-
      Not a statement about prime fields, where this corpus argues a different
      obstruction applies to the analogous bound.
    - >-
      Not a resolution of the constants hidden inside the published O(). The
      composition does not resolve them and does not pretend to.
    - >-
      Not approval, freezing, execution authorization, a run, an observed
      output, or evidence. approved_by is null.

  claim_ceiling:
    tier: crypto
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE -- "the primary text states, verbatim and as
      theorem [number], a last-fall-degree bound of the form [closed form] with
      hypotheses [list]; those hypotheses [do / do not] hold for the family the
      published subexponential analysis uses; the diagonal implied by its
      factor-base balance is [form]; and the composite time and memory curves
      are [these], plotted against the published expression." The crypto tier
      applies because the object is a published asymptotic claim about
      binary-field ECDLP at any n, NOT because anything was executed at scale.
      WHAT DOES NOT FOLLOW -- no new complexity result of this program, no
      lowering of any true complexity, nothing about prime fields, nothing
      about the constants inside the O(), and no status change on this run
      alone if the polynomial outcome fires.

  inputs:
    procedure: >-
      STAGE 0 (zero compute) -- declare and hash, before retrieval -- the exact
      list of items to transcribe (theorem statement, numbering, every
      hypothesis, the explicit m-dependence, the factor-base balance and the
      variable count the analysis uses), the four-way classification rule for
      L1, and the requirement that memory be reported beside time. Record the
      corpus's currently-relayed headline for the source, read verbatim from
      the committed entry with path and line, so the T2 comparison target
      exists before the source is opened.
      STAGE 1 (agent hours) -- attempt acquisition of each primary source and
      RECORD every attempt (URL, HTTP status, timestamp, attempt count). IF A
      SOURCE CANNOT BE OBTAINED, report UNRUN for the parts depending on it,
      with the log, and draw NO conclusion from the failure.
      STAGE 2 (agent hours) -- transcribe VERBATIM, with theorem numbering and
      every hypothesis. A paraphrase is not admissible. Record the explicit
      m-dependence as a closed form.
      STAGE 3 (minutes, GATING) -- verify that the transcribed statement at m
      constant yields a constant bound matching the corpus's recorded headline.
      A mismatch means the transcription is wrong; STOP.
      STAGE 4 (agent hours) -- check every transcribed hypothesis against the
      family the published subexponential analysis uses. A mismatch VOIDS the
      composition and is the deliverable. Transcribe the factor-base balance
      and recover the diagonal m(n) and the variable count the analysis
      actually uses.
      STAGE 5 (minutes) -- classify L1 by the pre-declared four-way rule.
      Compose the Macaulay column count at the transcribed L in the analysis's
      own variable count, raised to the declared linear-algebra exponent, and
      emit the TIME and MEMORY curves against n, plotted beside the published
      subexponential expression. Run the FIXED-m negative control and the
      NEARBY-PROBLEM-FAMILY arm through the identical composition.
      STAGE 6 (zero compute) -- record whether the sources state the low-degree
      counts that a standing corpus finding numerically corroborates, and
      assemble the verdict with its acquisition register.
    instrument: >-
      Document retrieval by the executor's fetch tooling with every attempt
      logged. A fetch returning a model-SUMMARISED rendering rather than source
      text is NOT a transcription source and must be recorded as such -- a
      paraphrase imported as a theorem is exactly the failure this design
      exists to prevent. Transcription is verbatim text with theorem numbering.
      The composition is exact integer and symbolic arithmetic in Python 3.11
      with numpy; NO Sage and NO sympy, whose absence in this container is
      recorded in prior lane records and must be re-checked and RECORDED at run
      time. Binomial column counts are computed exactly and reported in log2.
      Recorded through harness/runner.py.
    parameters: >-
      Sources -- the primary texts recorded in this corpus as the references
      for the last-fall-degree bound on Weil-descent summation systems, plus
      the published subexponential binary-ECDLP analysis. Arms -- the ECDLP
      diagonal arm, the ECDLP fixed-m negative control, and the nearby problem
      family treated in the same sources. Classification rule for L1 --
      polynomial, singly exponential, doubly exponential, or NOT-STATED,
      declared at Stage 0. Linear-algebra exponent -- declared at Stage 0 with
      its value and its source. n range for the curves -- declared at Stage 0.
      ZERO experimental compute; the arithmetic is seconds.
  controls:
    - >-
      TRANSCRIPTION FIDELITY, BLOCKING -- the theorem is quoted VERBATIM with
      its numbering and every hypothesis. A paraphrase is not admissible, and
      any hypothesis dropped in paraphrase is exactly how a vacuous bound gets
      quoted as a strong one.
    - >-
      FIXED-m SLICE REPRODUCTION, GATING -- the transcribed statement at m
      constant must reproduce the corpus's recorded n-independence headline for
      the source. If it does not, the transcription is wrong and nothing
      composed from it may be reported.
    - >-
      NEGATIVE CONTROL ON THE DIAGONAL -- evaluate the composite at m FIXED,
      not on the diagonal, and confirm the cost is POLYNOMIAL in n, as it must
      be by construction. A composition failing this check is mis-assembled and
      every curve from it is void.
    - >-
      NEARBY-OBJECT ARM -- apply the identical composition to the other problem
      family the same sources treat, where analogous quasi-polynomial claims
      are reported to depend on heuristics. If the method cannot DISTINGUISH
      the two cases, it has not identified the load-bearing structure.
    - >-
      FAMILY-IDENTITY CHECK -- every transcribed hypothesis is checked against
      the family the subexponential analysis uses. A mismatch VOIDS the
      composition, and that voiding is a legitimate reportable outcome.
    - >-
      MEMORY-BESIDE-TIME REQUIREMENT -- the output table carries both columns.
      Published analyses of this family are routinely quoted in time and not in
      memory, and a comparison at fixed time that ignores memory favours the
      algebraic route artificially.
    - >-
      COMPARISON-TARGET PRE-REGISTRATION -- the corpus's currently-relayed
      headline is read from its committed entry with path and line and hashed
      BEFORE the source is opened, so the T2 target cannot drift toward
      whatever the source turns out to say.
    - >-
      ACQUISITION REGISTER -- every fetch attempt logged with URL, HTTP status,
      attempt count and timestamp, so UNRUN is distinguishable from
      not-attempted and from a source that was read and says nothing.

  independent_variables:
    - "arm (ECDLP diagonal / ECDLP fixed-m negative control / nearby problem family)"
    - decomposition arity m
    - extension degree n
    - "evaluation mode (m fixed / m on the recovered diagonal)"
    - "cost axis (time / memory)"

  metrics:
    primary:
      - >-
        T1 transcription_completeness -- whether the theorem statement, its
        numbering, every hypothesis and the explicit m-dependence were quoted
        verbatim from primary text. Unit -- categorical, with the quoted text
        attached.
      - >-
        T2 fixed_m_reproduction -- whether the transcribed statement at m
        constant yields a constant bound matching the corpus's pre-registered
        recorded headline. Unit -- boolean. GATING.
      - >-
        L1 growth_class_of_L -- the growth class of L in m, classified by the
        pre-declared four-way rule as polynomial, singly exponential, doubly
        exponential or NOT-STATED, with the closed form quoted. Unit --
        categorical.
      - >-
        D1 diagonal_form -- the diagonal m(n) implied by the published
        factor-base balance, with its explicit form, or NOT RECOVERABLE. Unit
        -- symbolic expression or categorical.
      - >-
        C1 composite_cost_curve -- log2 of the Macaulay column count at the
        transcribed L, in the analysis's own variable count, raised to the
        declared linear-algebra exponent, as a function of n, in BOTH time and
        memory, plotted beside the published subexponential expression. Unit --
        log2 operations and log2 bytes against n.
      - >-
        N1 fixed_m_negative_control -- the composite cost at m fixed, which
        must be POLYNOMIAL in n. Unit -- growth class. Required polynomial.
      - >-
        H1 nearby_family_verdict -- the same composition applied to the other
        problem family, and whether its verdict DIFFERS from the ECDLP arm's.
        Unit -- categorical plus boolean.
      - >-
        A1 acquisition_outcome -- per source, retrieved or an acquisition
        failure with URL, HTTP status, attempts and timestamp. Unit --
        categorical per source.
    secondary:
      - >-
        K1 whether the sources state the low-degree counts a standing corpus
        finding numerically corroborates, reported as stated-with-values or
        not-stated with the named search terms
      - the variable count the published analysis actually uses, against the naive n*m
      - any additive or multiplicative term relating last fall degree to the degree at which a basis is actually obtained
      - the declared linear-algebra exponent with its stated source
      - the pre-registered corpus headline with its path and line
      - a recorded check of whether sage and sympy import

  heuristic_under_test: HEUR-ALBIN-1
  preregistered_prediction:
    quantity: >-
      L1's growth class, and the position of C1's curve relative to the
      published subexponential expression.
    formula: >-
      Composite time := (binomial(V + L, L))^omega where V is the variable
      count the published analysis uses and L is the transcribed bound
      evaluated at m = m(n); composite memory := binomial(V + L, L) entries at
      the declared entry width. THE PRE-DECLARED THREE-WAY MEANING -- L1
      polynomial makes the published claim unconditional on the first-fall
      assumption; L1 singly exponential makes the bound vacuous on the
      diagonal; L1 doubly exponential confines it to small m. A FOURTH VALUE,
      NOT-STATED, is admitted in advance so that "the sources do not answer
      this" is a reportable outcome rather than a forced classification. Under
      the NULL that the composition is mis-assembled, N1 is not polynomial in
      n; under the NULL that the method has no discriminating power, H1 gives
      the same verdict on both families.
    source: >-
      Pre-registered in IDEA-20260808-b188d0 (its predictions -- transcribed
      L(m) with a three-outcome reading, the composite cost exponent on the
      diagonal, and internal consistency with a standing corpus finding) and
      restated as T1-T2, L1, D1, C1, N1, H1, K1, A1 in H-ALBIN-913542 before
      any run exists. The NOT-STATED fourth value and the memory-beside-time
      requirement are added here; the parent identifies the memory omission as
      a correction to how the published claim is usually stated.

  scale_relevance:
    tier: crypto
    justification: >-
      SCALE ACCESS IS SYMBOLIC, NOT EXPERIMENTAL, AND THAT IS THE ENTIRE POINT.
      The object under audit is a published asymptotic claim about binary-field
      ECDLP as n grows, and it is settled by reading a theorem's explicit
      m-dependence and composing it -- no instance at any size is solved, and
      zero experimental compute is spent. The crypto tier therefore describes
      the SCOPE OF THE CLAIM BEING AUDITED, not a scale at which anything was
      executed, and the claim_ceiling says so explicitly. TRANSFER ASSUMPTIONS,
      STATED -- the composition transfers to no other field type; binary only.
      The corpus argues a different obstruction blocks the analogue over prime
      fields, and that contrast is named, not tested here.
    correspondence: >-
      The composition's validity rests entirely on FAMILY IDENTITY -- that the
      transcribed theorem's hypotheses hold for the exact system family the
      subexponential analysis uses. That correspondence is CHECKED at Stage 4
      rather than assumed, and its failure voids the composition.

  tail_checks:
    - >-
      Report every hypothesis of the transcribed theorem individually against
      the subexponential analysis's family, since a single dropped hypothesis
      is how a vacuous bound becomes a strong quotation.
    - >-
      Report the composite at the SMALLEST and LARGEST n in the declared range
      separately, since an asymptotic comparison whose crossing lies outside
      any interesting range means something different from one that does not.
    - >-
      Report the memory curve's value at the n where the time curves cross,
      since a crossing that is only reachable at infeasible memory is not a
      crossing in any operational sense.
    - >-
      Report whether any fetched rendering passed through a summarising model
      rather than returning source text, since such a rendering is not a
      transcription source.
    - >-
      Report the variable count the published analysis uses beside the naive
      n*m, since a difference there changes the composite by more than the
      bound's growth class does.

  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 2
    note: >-
      There is no stochastic component; seeds are recorded for manifest
      uniformity only. The replication device is a SECOND INDEPENDENT
      TRANSCRIPTION of the theorem statement and its hypotheses by a different
      reader, compared verbatim, which is the only replication that can detect
      a paraphrase imported as a theorem. Two independent instances means two
      readers, not two fetches by one.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 0.2
    agent_hours_estimate: 8
    maximum_memory_gb: 2
    maximum_runs: 3

  stopping_rules:
    - >-
      If a primary source cannot be obtained, report UNRUN for the parts
      depending on it, attach the full acquisition register, and draw NO
      conclusion from the failure in either direction. The blocking resource
      here is document access, not CPU.
    - >-
      STOP at Stage 3 if the fixed-m slice does not reproduce the
      pre-registered headline. The transcription is wrong and nothing composed
      from it may be reported.
    - >-
      STOP the composition at Stage 4 if any transcribed hypothesis fails on
      the subexponential analysis's family. The family mismatch is the
      deliverable.
    - >-
      STOP all curve reporting if the fixed-m negative control is not
      polynomial in n. The composition is mis-assembled.
    - >-
      ESCALATE IMMEDIATELY, WITHOUT RECORDING A STATUS, if L1 is POLYNOMIAL and
      C1 sits below the published expression. That outcome requires independent
      breakthrough-tier review under AGENTS.md rule 12 before anything is
      recorded, and the run's job ends at reporting it.
    - >-
      Stop at maximum_runs or the agent-hour estimate, whichever binds first.
      Budget exhaustion is a stop, never a negative result (AGENTS.md rule 5).

  invalidation_rules:
    - >-
      An HTTP failure, paywall, timeout or crash is an acquisition failure or
      failed_infrastructure and is NEVER evidence about the m-dependence in
      either direction (AGENTS.md rule 5). Specifically, an unobtainable source
      does NOT support the obstruction reading.
    - >-
      A run whose transcription is a paraphrase, or came from a
      model-summarised rendering rather than source text, is
      invalid_measurement.
    - >-
      A run reporting a composite curve without the fixed-m negative control
      and the nearby-family arm executed in the same invocation is
      invalid_measurement.
    - >-
      A run reporting only a time curve, without the memory column, is
      completed_invalid -- the parent proposal identifies that omission as a
      correction to how the published claim is usually stated.
    - >-
      A run whose T2 comparison target was read from the corpus AFTER the
      source was opened is completed_invalid.
    - >-
      A run that records a status change, or asserts an unconditional
      complexity claim without the independent breakthrough-tier review, is
      completed_invalid.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT
      experiment and requires a new contract.

  success_criterion: >-
    The run is SUCCESSFUL as a measurement when -- (a) A1 is reported per
    source and, for every retrieved source, T1 is complete and verbatim with a
    second independent transcription attached; (b) T2 reproduces the
    pre-registered headline; (c) every transcribed hypothesis is checked
    against the subexponential analysis's family and the verdict is reported;
    (d) L1 is classified by the pre-declared four-way rule with the closed form
    quoted, and D1 is reported or marked not recoverable; (e) C1 is emitted in
    BOTH time and memory beside the published expression, with N1 polynomial in
    n and H1 reported. The hypothesis H-ALBIN-913542 is RESOLVED when L1 is
    classified -- and its three substantive values carry three different
    consequences, none of which is a "pass". A NOT-STATED verdict resolves the
    record as "the published texts do not answer this question", which is also
    a complete answer.

  falsification_criterion:
    - >-
      L1 = POLYNOMIAL with C1 below the published subexponential expression.
      The obstruction reading is FALSE and the published claim becomes
      unconditional on the first-fall assumption. THIS TRIGGERS IMMEDIATE
      INDEPENDENT BREAKTHROUGH-TIER REVIEW under AGENTS.md rule 12; no status
      moves on this run alone, and the theorem belongs to its authors.
    - >-
      A transcribed hypothesis fails on the subexponential analysis's family.
      The composition is INVALID and the record's premise is wrong.
    - >-
      T2 fails -- the fixed-m slice does not reproduce the pre-registered
      headline. The transcription is wrong; nothing composed may be reported.
    - >-
      N1 is not polynomial in n. The composition is MIS-ASSEMBLED and every
      curve is void.
    - >-
      H1 gives the same verdict on the nearby problem family as on ECDLP. The
      method has not identified the load-bearing structure and no composed
      conclusion is admissible.
    - >-
      A1 shows the sources unobtainable. UNRUN; no conclusion in either
      direction, and specifically not the obstruction reading.
    - >-
      L1 = NOT-STATED. The question is not answered by the published texts;
      reported as an absence with the named search terms used to establish it.

  required_artifacts:
    - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
    - raw-result.json carrying the composite curves point by point in time and memory, not summaries
    - the VERBATIM transcribed theorem with its numbering and every hypothesis, plus a second independent transcription and their comparison
    - the transcribed factor-base balance, the recovered diagonal m(n), and the variable count the analysis actually uses
    - the Stage-0 pre-registration (transcription item list, four-way classification rule, linear-algebra exponent with its source, n range, memory requirement, and the corpus headline with its path and line), hashed before retrieval
    - the fixed-m negative control and the nearby-problem-family arm, in the same file as the ECDLP arm
    - the per-hypothesis family-identity check table
    - the full acquisition register (URL, HTTP status, attempts, timestamp) including any UNRUN record
    - the K1 verdict on the low-degree counts with its named search terms
    - a recorded check of whether sage and sympy import

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; approved_by is null and
      execution_authorized is false (AGENTS.md rule 1). Approval is the user's
      gate because it authorizes execution and spends compute.
    - >-
      The parent proposal is proof-oriented; its proof_search_map is carried in
      H-ALBIN-913542 and must be audited before implementation (KN-TECH-080).
    - >-
      THE ESCALATION PATH MUST BE AGREED BEFORE APPROVAL. If L1 comes out
      polynomial with the curve below the published expression, the run
      REPORTS and STOPS -- AGENTS.md rule 12 breakthrough-tier review is
      required before any status moves, and the four asymptotic promotion gates
      in agents/coordinator.md apply in full to anything downstream.
    - >-
      A Coordinator must confirm the linear-algebra exponent, the n range and
      the entry width used for the memory column before approval; all three
      change the composite and none may be chosen after seeing a curve.
    - >-
      A Coordinator should note that source accessibility is the binding
      resource, not CPU. Approving this contract may buy an UNRUN, and that is
      an acceptable and pre-declared outcome rather than a failure.

  derivation_provenance:
    tool: coordinator-subagent design pass
    source_record: IDEA-20260808-b188d0
    authored_at: '2026-08-25'
    note: >-
      Metrics T1-T2, L1, D1, C1, N1, H1, K1 and A1 render the parent proposal's
      three predictions, its four controls and its three falsification
      conditions into quantities decidable from a recorded artifact. TWO THINGS
      ARE ADDED HERE AND ARE DISCLOSED -- the fourth classification value
      NOT-STATED, so that "the published texts do not answer this" is a
      reportable outcome rather than a forced classification; and a second
      independent transcription, because the parent names transcription
      fidelity as its binding control but provides no device to check it.
      Budgets follow the parent's own statement that implementation is none,
      compute is zero, and the blocking resource is document access. No field
      is invented; unsupplied values are listed in derivation_gaps.

  derivation_gaps:
    - >-
      THE PRIMARY SOURCES ARE NAMED IN THE PARENT PROPOSAL BUT ARE NOT
      RESTATED HERE AS VERIFIED REFERENCES. The corpus entries relaying them
      record that their full texts were not read, so the identification itself
      is unverified. A Coordinator must confirm the reference list before
      approval; transcribing the wrong paper answers a different question.
    - >-
      The linear-algebra exponent used in the composite is not specified. It
      must be fixed before approval WITH ITS SOURCE, since the composite's
      position relative to the published expression depends on it and choosing
      it afterwards would be fitting.
    - >-
      The n range for the curves and the entry width for the memory column are
      unspecified. Both must be frozen before the run.
    - >-
      The nearby problem family is described by role rather than named,
      because naming it would import the parent's unverified attribution. It
      must be identified from the transcribed sources themselves at Stage 4.
    - >-
      SOURCE ACCESSIBILITY IS UNKNOWN AND IS THE BINDING RESOURCE. The parent
      proposal records that its own session could not open any primary source
      and prices obtainability at about 0.4 from this environment. The contract
      is written so that UNRUN is a first-class pre-declared outcome rather
      than an aborted run, but a Coordinator should weigh that before spending
      agent hours.
