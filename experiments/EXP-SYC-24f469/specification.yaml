      cpu_hard: sum_c(cpu_ns_c*n_c/q_c)<=25*3600*10^9
      wall_planned: max_shard(sum_c(wall_ns_c*n_c/(q_c*shards_c)))<=9600*10^9
      wall_hard: max_shard(sum_c(wall_ns_c*n_c/(q_c*shards_c)))<=12000*10^9
      prefix_reuse: >-
        Each q_c prefix is executed once in S3a, hash-frozen, and reused by
        its unique class owner. q_c is never recharged in S3b. Any missing
        class, zero prefix, duplicate owner, replay mismatch, or projection
        excess invalidates before treatment.
    per_size_fully_charged_cost:
      model_root_denominator_per_size: 32*256*4
      C_root: >-
        For each b, input i, and model m, sum the CPU ns, wall ns, physical
        bytes, joules, and selected-table line touches of exactly one fresh
        model-root attempt using class and stage ownership. C_root_ns(b) is the
        maximum over i,m of max(cpu_ns/shards,wall_ns), rounded upward. No
        generator, analysis, null, audit, or baseline work enters C_root twice.
      wiring: >-
        W_root(b)=max(1,max_live_unique_64_byte_lines(b)^(1/3)), rounded upward
        at 512 bits from the wiener_wiring_charge class.
      setup: >-
        G_candidate(b) is the fully charged generator, certification,
        commitment, and one-time archive cost assigned to size b. It is added
        once, never multiplied by restarts.
      harmonic_upper: T_candidate_plus(b)=G_candidate_plus(b)+H_b_plus*C_root_plus(b)*W_root_plus(b)
      harmonic_lower: T_candidate_minus(b)=G_candidate_minus(b)+H_b_minus*C_root_minus(b)*W_root_minus(b)
      rho: >-
        T_rho_minus(b) and T_rho_plus(b) are the directed bounds from the
        frozen Pollard-rho class on the same 32 public inputs, including setup,
        failed walks, public verification, physical memory, energy, archive,
        and wiring under the identical hardware-time convention.
      direct_positive_gate: T_candidate_plus(b)<T_rho_minus(b) for all five b
      direct_negative_gate: T_candidate_minus(b)>=T_rho_plus(b) for all five b
      pareto_gates: >-
        Candidate peak memory, joules, physical bytes, archive bytes, and
        communication must each be reported beside rho; no row may be called
        dominating unless it is no worse on every axis and strictly better on
        at least one. Pollard rho remains the baseline absent a valid run.

