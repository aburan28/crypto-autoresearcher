  restart_semantics:
    probability_unit: one_curve_target_one_fresh_root_one_uniform_public_model
    model_draw: >-
      Each operational attempt draws model_id as the low two bits of one fresh
      SHAKE256 byte under EXP-SYC-24f469/RESTART-MODEL/v1 keyed by bits,
      curve_id, root_index. Values 0 through 3 are equiprobable. An attempt
      evaluates only that model. The experimental four-model vector reuses the
      same root solely to estimate the uniform-model mean and is never counted
      as four independent restarts or as an OR of four models.
    fresh_root: >-
      Every attempt derives new a,b,z and four without-replacement lists from
      the attempt key. No table, mutable state, candidate, or verifier result
      crosses attempts.
    exact_probability: >-
      p_i=E_root[(1/4)*sum_(m=0)^3 S(i,m,root)], so independent attempts have
      geometric mean restart count 1/p_i under HA-4.
    invalidations:
      - holding one model fixed while using the averaged p_i
      - running an OR over four models while using 1/p_i
      - root, list, table, or candidate reuse across attempts

  simultaneous_confidence_box:
    frozen_inputs: 160
    root_vectors_per_input: 256
    two_sided_tail_count: 320
    familywise_error: 1/200
    per_tail_error: 1/64000
    precision_bits: 512
    arithmetic: MPFR_RNDD_for_lower_bounds_MPFR_RNDU_for_upper_bounds
    mean: m_i=(1/256)*sum_root((1/4)*sum_model S_i_model_root)
    radius: e=sqrt(log(64000)/(2*256))
    intervals:
      lower: L_i=max(0,m_i-e)_rounded_down
      upper: U_i=min(1,m_i+e)_rounded_up
    simultaneous_implication: >-
      By 320 Hoeffding tails and a union bound, with probability at least
      199/200 every p_i lies in [L_i,U_i]. No bootstrap or pointwise plug-in
      transformation is used for the slope decision.
    harmonic_bounds:
      lower: H_b_minus=(1/32)*sum_(i_at_b)1/U_i_rounded_down
      upper: H_b_plus=(1/32)*sum_(i_at_b)1/L_i_rounded_up
      zero_rule: any L_i=0 makes H_b_plus positive_infinity and rejects the positive branch
    ladder:
      bits: [18, 21, 24, 27, 30]
      x_b: (b-24)*log(2)
      z_b: 2^(-b/3)-2^(-24/3)
      x_bar: 0
      S_xx: 90*log(2)^2
    extremum_for_each_eta:
      corrected_interval: >-
        y_b is in [log(H_b_minus)-eta*z_b,
        log(H_b_plus)-eta*z_b].
      coefficient: a_b=x_b/S_xx
      delta_min: sum_b a_b*(y_lower_b if a_b>=0 else y_upper_b)
      delta_max: sum_b a_b*(y_upper_b if a_b>=0 else y_lower_b)
      gamma_lower: 1/3-delta_max
      gamma_upper: 1/3-delta_min
      endpoint_rounding: >-
        Logs, products, and sums contributing to delta_min are rounded down;
        those contributing to delta_max are rounded up. gamma_lower subtracts
        the rounded-up delta_max with downward rounding; gamma_upper subtracts
        the rounded-down delta_min with upward rounding. Comparisons use exact
        rational 5/18, never a decimal.
    decisions:
      positive_toy: gamma_lower>5/18 for eta=-4,0,4 and every other gate passes
      negative_scoped: gamma_upper<=5/18 for eta=-4,0,4 and every apparatus gate passes
      inconclusive: any other interval pattern, eta disagreement, infinity, or apparatus failure
    forbidden:
      - fitting log(H_b_plus) and calling its slope a lower confidence bound
      - selecting one admissible p vector after observing its decision
      - whole-curve bootstrap inference to an undeclared superpopulation

  canonical_bytes_and_public_family:
    tuple_encoding: >-
      A domain is UTF-8 preceded by u16be byte length, followed by key count
      u16be and each key as a one-byte type tag, u16be payload length, and
      payload. Unsigned integers use minimal big-endian payload with zero as
      one 00 byte; signed eta uses two's-complement i8. Each tuple starts a
      fresh SHAKE256 stream at offset zero.
    record_encoding: RFC8785_JCS_UTF8_LF_no_trailing_space
    field_encoding: fixed_width_unsigned_big_endian_width_ceil_bit_length_p_over_8
    scalar_encoding: fixed_width_unsigned_big_endian_width_ceil_bit_length_r_over_8
    point_encoding: >-
      Infinity is 00. An affine point is 02||x for even canonical y or 03||x
      for odd canonical y, with fixed-width x. Decoding rejects x>=p,
      nonsquares, noncanonical length, and any re-encoding mismatch.
    xof_domains:
      field_prime: EXP-SYC-24f469/FIELD-PRIME-CANDIDATE/v1
      curve_coefficients: EXP-SYC-24f469/CURVE-COEFFICIENTS/v1
      base_point: EXP-SYC-24f469/BASE-POINT/v1
      target_scalar: EXP-SYC-24f469/TARGET-SCALAR/v1
      decoy_scalar: EXP-SYC-24f469/VERIFIER-DECOY-SCALAR/v1
      restart_model: EXP-SYC-24f469/RESTART-MODEL/v1
      null_label: EXP-SYC-24f469/SAME-PATH-NULL-LABEL/v1
    prime_algorithm: >-
      For attempt 0..4095 read u64be w, set p=(w mod 2^(bits+1)) OR
      2^bits OR 1, and accept the first p with no divisor in the ordered list
      2,3,5,... of primes through floor(sqrt(p)). Since p<2^31 this complete
      trial division is a deterministic proof. The certificate is the JCS
      object with algorithm=trial_division_v1, p as decimal string,
      tested_prime_count, and last_tested_prime. Replay repeats the same list.
    coefficient_algorithm: >-
      coefficient_id 0 means a and 1 means b. For attempts 0..3 read u64be w,
      let T=floor(2^64/p)*p, reject w>=T, and otherwise emit w mod p. A curve
      search index is rejected if either coefficient exhausts. The ordered
      pair uses fixed field encoding and discriminant 4a^3+27b^2 mod p.
    point_count_algorithm: >-
      Use deterministic Schoof_v1: division polynomials are generated by the
      standard integer recurrence with coefficients reduced to [0,p-1]; ell
      runs through increasing primes not equal to p; t mod ell is the least
      residue satisfying the Frobenius equation; CRT uses the least
      nonnegative representative and stops at the first product greater than
      4*floor(sqrt(p))+4. Choose the unique t in the Hasse interval and set
      order=p+1-t. The canonical certificate contains only decimal strings
      p,a,b,t,order and the ordered ell/residue list; replay recomputes every
      residue and CRT step before accepting the bytes.
    curve_acceptance: >-
      In increasing curve_search_index order accept the first 32 curves per
      size with nonzero discriminant, order=h*r for h in {1,2,3,4}, prime r
      of exactly bits bits and at least bit_length(p)-2 bits, order!=p,
      j not 0 or 1728, and embedding degree of r with respect to p greater
      than 20. Factor order by increasing-prime trial division and encode the
      unique h,r and all predicates in JCS. No treatment statistic is read.
    square_root_algorithm: >-
      Canonical Tonelli-Shanks_v1 factors p-1=q*2^s with q odd, selects the
      least quadratic nonresidue z>=2, and in each loop selects the least i
      with t^(2^i)=1. Of the two roots choose the one whose low bit equals the
      requested sign; decoding then re-encodes and compares bytes.
    base_point_algorithm: >-
      For point_attempt 0..255 read 16 bytes; map the first u64 by the same
      threshold rule to x in F_p and take the low bit of the second u64 as
      sign. Reject a nonsquare RHS. Decode R canonically, compute P=[h]R by
      left-to-right binary double-and-add, and accept the first P!=O with
      [r]P=O. Log every word, rejection code, R, P, and equality transcript.
    scalar_algorithm: >-
      For attempt 0..7 read u128be w, set d=r-1 and T=floor(2^128/d)*d,
      reject w>=T, otherwise emit 1+(w mod d). The decoy uses an independent
      seed and additionally rejects equality to the true audit scalar.
    target_algorithm: >-
      Compute Q=[k]P with the same binary double-and-add and publish P,Q. The
      hidden k is benchmark truth only and is never an input to the selector,
      public verifier, V, S, stopping, or scientific analysis.
    sealed_seed_replay: >-
      Commit SHA-256(seed) before public inputs. Seal seed with RFC8439
      ChaCha20-Poly1305 using a 32-byte replay key held outside the repository,
      a fresh 12-byte nonce, and AAD equal to the SHA-256 of the ordered public
      manifest. Envelope bytes are ASCII SYC3, nonce, u32be ciphertext length,
      ciphertext, and tag. Authorized replay opens the envelope, verifies the
      commitment, regenerates every byte, and destroys the replay key copy.
    known_answer_requirements:
      - one accept and one rejection vector for every threshold mapper
      - one prime accept, composite reject, and exhaustion vector
      - one curve accept and each curve rejection predicate
      - one square-root sign branch and nonsquare reject
      - one base-point accept, nonpoint reject, and subgroup reject
      - target, decoy-equality reject, seal, open, commitment, and replay vectors
      - two independent implementations with byte-identical outputs

  lossless_success_interface:
    tracked_tuple: [D, Y, X, V, S]
    exact_match_identity: canonical_compressed_A_bytes
    witness_identity: >-
      tuple(list_id_left,index_left,list_id_right,index_right,scalar_left,
      scalar_right,compressed_A,compressed_B) under the canonical tuple encoder
    candidate_derivation: >-
      Each exact A+B=Q_prime witness has known u,v with
      Q_prime=[a]Q+[b]P and a in [1,r-1]. Derive
      k_hat=(u+v-b)*a^(-1) mod r by extended Euclid. Publicly verify
      [k_hat]P=Q. Any exact match lacking an invertible a, canonical scalar,
      or passing public equality invalidates the root.
    deduplication: >-
      Deduplicate by compressed A. For multiple witnesses of the same A retain
      the lexicographically least complete witness identity. Candidate identity
      is tuple(compressed_A,scalar_encoding(k_hat)); collision on A with
      different k_hat invalidates.
    definitions:
      X: number of distinct compressed-A identities in the complete exact-match stream
      V: number of those identities delivered exactly once and accepted by the secretless public verifier
      S: 1 if and only if V is greater than zero
    universal_gate: >-
      For every valid treatment root and every valid null root, before any fit,
      require a one-to-one join from the complete X identity set to candidate
      records and public-verifier records, X=V, and S=1[X>0]=1[V>0]. Archive
      the sorted reconciliation digest. This is treatment-wide, not fixture-only.
    capacity_per_model_root: 32
    overflow: >-
      Continue complete-stream deduplication after storage reaches 32. Detection
      of the 33rd distinct A invalidates with all 33 identities and no metric,
      truncation, replacement, sampling, spill, or favorable branch.
    mutations:
      - 33 distinct A identities must invalidate before fit
      - flipped scalar orientation must invalidate the root with X-to-V mismatch
      - duplicate witnesses for one A must choose the same canonical witness
      - two A identities mapping to one scalar remain two verified identities

  same_path_null:
    id: CTRL-SAME-PATH-BALANCED-NULL
    block_size: 4*L
    algorithm: >-
      For each bits,curve_id,model_id,root_index block and every position
      t=list_id*L+position in [0,4L), compute the 16-byte SHAKE256 key under
      the null-label domain with the full block tuple and t. Sort positions by
      (key,t). The rank permutation is therefore total even with key collisions.
      Label rank 2j as +1 and rank 2j+1 as -1. The involution maps the position
      at rank 2j to rank 2j+1 and vice versa, proving sign complement and exact
      2L/2L balance for every odd L. The label is position-keyed independently
      of point bytes, so conditioning on public inputs it is a deterministic
      balanced selection null.
    treatment_label: canonical_centered_signed_y_sign_and_bucket_v1
    null_label: canonical_rank_pair_sign_v1
    identical_path: >-
      One selector executable, configuration schema, curve/model/root/list
      bytes, widths, buffers, serialization, SHAKE implementation, sort, join,
      exact equality, candidate derivation, overflow, verifier, metrics,
      counters, stream digests, and archive code serve both lanes. A committed
      label object is the only configurable delta.
    single_delta_manifest:
      compared_fields:
        - executable_sha256
        - configuration_schema_sha256
        - public_manifest_sha256
        - root_and_list_manifest_sha256
        - widths_and_capacities_sha256
        - serialization_sha256
        - sort_join_equality_sha256
        - candidate_overflow_verifier_sha256
        - metrics_counters_archive_sha256
        - label_object_id
        - label_object_sha256
      allowed_differences: [label_object_id, label_object_sha256]
      required_other_mismatch_count: 0
      required_manifest_schema: crypto.autoresearch.single_delta_manifest.v1
