    baseline_reproduction: >-
      Preserve the five exact size rows, the symbolic 1/6, 1/9, and 5/18
      crossovers, and run rho and BSGS on the same 160 inputs under the same
      physical schema. The finite direct cost gate, not symbolic algebra alone,
      decides any prospective toy comparison.
    observation_collision: >-
      CTRL-HARMONIC-CONFIDENCE-SET-SLOPE exhibits one confidence box with a
      favorable plug-in slope but an admissible extremal slope below 5/18.
      CTRL-TOTAL-COST-SLOPE-COLLISION requires per-size allocation so aggregate
      physical totals cannot conceal opposite rho decisions.
    quantifier_order: >-
      For every probability vector in the simultaneous box and every eta, the
      extremal gate must clear; witnesses, models, curves, labels, and physical
      allocations are fixed before treatment and cannot depend on the outcome.
    method_ceiling: >-
      At most this design can support a toy statement about the exact 18--30-bit
      manifest. A flattening continuation is observationally indistinguishable,
      so no asymptotic or cryptographic-scale conclusion is identifiable.
    nearby_object_control: CTRL-SAME-PATH-BALANCED-NULL with single-delta manifest
    representation_obligations:
      - canonical byte replay of every field, curve, certificate, point, scalar, target, and seed envelope
      - all-root X-to-candidate-to-V bijection and overflow invalidation
      - public-verifier secret noninterference over the finite invocation graph
      - one-to-one 28-class throughput, ownership, and per-size cost compilation

  decisions_and_invalidation:
    positive_branch: >-
      Every preserved gate passes; every confidence interval is finite;
      gamma_lower>5/18 for all eta; the direct fully charged candidate upper
      cost is below the rho lower cost at all five sizes; every Pareto, null,
      replay, lossless, cost, noninterference, throughput, and cap gate passes;
      and two fresh independent reviews return PASS. Even then the result is
      only a toy finite-manifest observation requesting Coordinator review.
    negative_branch: >-
      A valid gamma_upper<=5/18 for all eta or direct candidate lower cost no
      better than rho upper cost for all sizes narrows only the exact frozen
      finite manifest. No universal ECDLP conclusion follows.
    inconclusive: >-
      Any confidence-box collision with the threshold, eta disagreement,
      infinity, partial baseline comparison, missing physical counter,
      canonicalization mismatch, cap stop, or apparatus failure is inconclusive.
    hard_invalidations:
      - any pointwise plug-in slope presented as a confidence lower bound
      - any class not mapped exactly once or any q_c equal to zero
      - any physical, energy, memory, wiring, candidate, or audit residual
      - any implementation-dependent public input, certificate, point, scalar, null, or replay byte
      - X not equal to V or S not equal to 1[V>0] on any valid treatment or null root
      - any treatment/null executable delta beyond the two committed label fields
      - any selector or public-verifier secret input or secret-dependent V or S
      - any budget increase, control deletion, favorable reroll, or post-data selection
      - any implementation or execution while authorization is false or maximum_runs is zero
    evidence_boundary: >-
      Static consistency, failure, timeout, exhaustion, or invalidity is not
      evidence against H-SYC-b854f4 or ECDLP. No result exists in this record.

