experiment:
  id: EXP-SIG-4fe529
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  hypothesis_id: H-SIG-8f7399
  question_id: RQ-SIG-001
  goal_id: GOAL-SIG-001
  source_idea_ids: [IDEA-20260805-bbfca9]

  title: >-
    Boolean-admissibility audit of the trivial syzygy enumerator: count the
    multipliers the additive degree bound omits, measure the rank they add, and
    decide whether the below-freeze D6 null defect of 7110 is an enumeration
    artifact -- set arithmetic over frozen supports, no echelon, no null
    construction, no new instance

  review_context: >-
    GOAL-SIG-001's next_action defers the SIG-D6-NULL-RECAL-v2 calibration
    executor "until campaign capacity prioritizes D >= 6 null recalibration".
    Three null constructions have already failed at D6 (N0 old, N2
    forced-consistent, N1 exact-column-matched; EV-SIG-006) and the n = 12 cell
    that was supposed to confirm the freeze theory instead falsified it
    (EV-SIG-008). This contract advances that same next_action by a route it has
    not considered: instead of building a fourth null, audit the SUBTRACTION.
    EV-SIG-008's unresolved_confounds opens with "Mechanism of the below-freeze
    null D6 collapse (7,110) at n=12: neither semiregular nor variety-saturating;
    decomposition OPEN". This contract proposes and tests one specific
    decomposition, at a fraction of the calibration executor's cost.

  objective: >-
    Determine whether the model syzygy family K_D built by
    koszul_principal_vectors omits genuine boolean trivial syzygies because its
    multiplier bounds use polynomial-ring additive degree in a ring where
    multiplication is set union; count the omitted multipliers from the frozen
    supports; measure the rank they add; and report the corrected extra_D beside
    the uncorrected value at every audited cell.

  what_this_is_not:
    - >-
      NOT a null-baseline construction and NOT a claim that any null validates.
      It computes a correction to a subtraction; whether a corrected null is
      semi-regular requires the corrected family to be COMPLETE, which adding one
      family does not establish.
    - >-
      NOT a cascade measurement and NOT a claim about the sem. Corrected sem
      values are recorded so a later Coordinator decision has them, and are
      asserted about nothing.
    - >-
      NOT a claim that the goal's prior numbers are wrong. If the correction is
      zero the enumerator was right; if it is positive the enumerator was
      incomplete in a specific, stated, repairable way, and every prior number
      remains a correct measurement of the quantity it was defined to be.
    - >-
      NOT a statement about d_reg, solving degree, prime fields, or crypto scale.
    - >-
      NOT an approval. status is review_required, there is no approved_by field,
      and only the Coordinator may authorize execution (AGENTS.md rule 1).

  claim_ceiling: >-
    TIER: toy. The most a completed run may support is: at the audited cells
    (boolean chained Semaev m = 3 t = 3, n in {9, 12}, D in {4, 5, 6}, the
    recorded seeds), the boolean trivial syzygy module in degree <= D is larger
    than the family K_D enumerates by a measured rank R, and the corrected
    extra_D equals the stated number. It may NOT support any statement about
    other sizes, other seeds, the completeness of the corrected family, the
    semi-regularity of any system, the cascade, or anything at crypto scale.
    Toy evidence is never crypto-scale evidence (AGENTS.md rule 7).

  inputs:
    source_under_audit: >-
      experiments/EXP-SIG-006/src/h013_f5_signatures.sage, function
      koszul_principal_vectors (pairwise Koszul loop bound
      `md in range(0, D - di - dj + 1)`; principal Frobenius loop bound
      `md in range(0, D - 2*di + 1)`), plus its caller, plus semireg_rank_pred.
      Instrument hash 1ba96fe4 is recorded by EV-SIG-008 as the pinned copy.
    frozen_supports: >-
      The equation supports of the sem and of the nulls N0 / N1 at (n = 9,
      seed 1) and (n = 12, seed 2). Recorded support structure at n = 12:
      12 cubics with support sizes 13-105, 12 quadratics with support sizes
      13-33; safe pools (di,d) = (2,1) 24, (2,2) 47, (3,1) 24, (3,2) 276,
      (3,3) 904 (EV-SIG-008). Column sets: n = 9 D6 sem/N1 29332, N0 31180;
      n = 12 D6 174033 of 190051 full monomials (91.57% coverage).
    audit_cells:
      - {n: 12, D: 5, arm: null_matched, target_extra: 0, role: pre-known-zero gate}
      - {n: 9,  D: 5, arm: null_matched_N1, target_extra: 369, role: ceiling check}
      - {n: 12, D: 6, arm: null_matched, target_extra: 7110, role: DECISIVE}
      - {n: 9,  D: 6, arm: null_N0_spread, target_extra: 4986, role: ordering (at freeze; mixed mechanism)}
      - {n: 9,  D: 6, arm: null_matched_N1, target_extra: 7226, role: ordering}
      - {n: 9,  D: 6, arm: sem, target_extra: 8897, role: ordering + corrected value}
      - {n: 12, D: 6, arm: sem, target_extra: 17982, role: corrected value only}
    regression_targets_to_reproduce_before_any_new_number:
      nrows: "nrows(12,6) = 183312; nrows(12,5) = 31512"
      sr_pred: "156520 at (12,6); 29418 at (12,5); 28068 and 9504 at (9,6) and (9,5)"
      anchors: "A4_5 = 444 and residual_5 = 878 at n = 12 (pinned full-kernel path)"
      frobenius_counts: >-
        sum_i sum_{k <= D - 2 d_i} C(2n, k) = 9 / 171 / 1557 at n = 9 for
        D = 4 / 5 / 6, and 12 / 300 / 3624 at n = 12
      provenance: >-
        All regression targets were computed by the idea generator in this
        session OUTSIDE THE HARNESS (label: SESSION-COMPUTED) or quoted from
        EV-SIG-006 / EV-SIG-008. They are targets, not results. Disagreement is a
        stop condition.
    seeds:
      synthetic_control_seeds: [1, 2, 3]
      seed_derivation_rule: >-
        Every random choice draws from a stream keyed by
        SHA-256("EXP-SIG-4fe529|" + arm_label + "|" + str(n) + "|" + str(D) +
        "|" + str(blocks) + "|" + str(seed_index)), taken little-endian and used
        to seed a counter-mode SHA-256 byte stream; the k-th 32-bit draw is bytes
        [4k, 4k+4) of SHA-256(key || k as 8-byte big-endian), rejection-sampled to
        range. arm_label is one of: synth_disjoint, synth_graded, handbuilt.
        The audited cells themselves use the FROZEN supports and draw nothing.
    environment_preconditions:
      measured_this_session: >-
        numpy 2.4.6 present; Sage, Singular, msolve, sympy ABSENT
        (`import sage` raises ModuleNotFoundError; `which sage singular msolve`
        returns nothing).
      consequence: >-
        Stages 0-2, including the DECISIVE count, need no solver and run in this
        environment. Stage 3 needs a GF(2) rank over bitmask vectors, which is a
        bounded pure-Python/numpy port or a Sage-bearing environment. Which was
        used MUST be recorded. An unavailable dependency is
        failed_infrastructure, never negative mathematical evidence (rule 5).

  stages_cheapest_first:
    - id: S0
      name: read the enumerator and reproduce the anchors
      terminates_run: true
      description: >-
        Read koszul_principal_vectors and its caller in full; quote both loop
        bounds with line numbers; confirm no further trivial family is appended
        by the caller. Reproduce every regression target. THIS STAGE CAN END THE
        EXPERIMENT: if the enumerator already uses a union-degree bound, or if
        the caller appends the missing family, the audit is answered in the
        negative and that answer is the deliverable.
      cost: reading plus seconds of arithmetic; no solver
    - id: S1
      name: the containment proof
      terminates_run: true
      description: >-
        Prove or refute, on paper, that (a) the union conditions
        max_{c in supp(f_j)} |mu UNION c| <= D - d_i and
        max_{c in supp(f_i)} |mu UNION c| <= D - d_j are exactly the conditions
        for every named tag to be a real row, and (b) K_D^poly subset-of
        K_D^bool subset-of kernel(M_D). A refutation ends the line at zero
        compute.
      cost: pen and paper
    - id: S2
      name: DECISIVE COUNT -- set arithmetic over frozen supports
      terminates_run: true
      description: >-
        Compute |U_D| at every audit cell by the hitting-set predicate, with NO
        linear algebra. Run the pre-known-zero gate FIRST: at (n = 12, D = 5),
        where extra_5 = 0, the correction is forced to contribute zero rank, so
        |U_5| there must either be 0 or consist entirely of vectors dependent on
        K^poly. A count that cannot be reconciled with extra_5 = 0 stops the run.
      cost: minutes to an hour of set operations; the whole decisive question is here
    - id: S3
      name: rank of the corrected family
      terminates_run: false
      description: >-
        Compute rank(K_D^bool) at the audit cells and report the difference
        against rank(K_D^poly). The (n = 12, D = 6) cell is the expensive one
        (~27000 bitmask vectors of length 183312) and is checkpointed.
      cost: bounded rank, no Macaulay echelon
    - id: S4
      name: corrected values and residue
      terminates_run: false
      description: >-
        Recompute extra_D and residual_D at each audited cell with the corrected
        subtraction and report corrected BESIDE uncorrected, never replacing.
        If the correction is small, report the RESIDUE explicitly and name the
        remaining candidate mechanisms; a count of eliminated mechanisms without
        a quantified residue is a fatigue report, not a result.
      cost: arithmetic

  arms_and_controls:
    treatment: >-
      The frozen sem and null systems at the audit cells; |U_D| and
      rank(K_D^bool) - rank(K_D^poly) computed from their committed supports.
    measured_null: >-
      THE PRE-KNOWN-ZERO NULL. The (n = 12, D = 5) column-matched null, recorded
      by EV-SIG-008 with extra_5 = 0 and rank == sr_pred at D3/D4/D5. FORCED
      VALUE, DERIVED BEFORE THE RUN AND ABLE TO FAIL: because K^bool is contained
      in the kernel, a positive rank correction at this cell would push extra_5
      below zero, which is impossible. Therefore
      rank(K_5^bool) - rank(K_5^poly) MUST be 0 here. A positive value means the
      computation is wrong and the run stops. This control costs seconds and can
      genuinely fail.
    second_null_disjoint_supports: >-
      A synthetic boolean system with the same degree histogram and variable
      count but PAIRWISE DISJOINT supports wherever the degree budget allows.
      FORCED VALUE: |U_D| = 0 EXACTLY, because the union bound and the additive
      bound coincide when the multiplier is disjoint from every support monomial.
      A positive |U_D| here means the enumeration of omitted multipliers is
      wrong. Independent of the first null and it fails for a different reason.
    positive_control: >-
      A hand-built two-equation boolean system whose supports are chosen so that
      EXACTLY ONE omitted multiplier is admissible, the triple computed by hand
      before any code runs and the resulting vector verified in the kernel by
      direct substitution. FORCED VALUE: |U_D| = 1 and the vector found. IF THE
      PIPELINE DOES NOT FIND IT, THE INSTRUMENT IS BLIND AND NO NEGATIVE RESULT
      FROM S2-S4 MAY BE REPORTED AT ALL.
    graded_control: >-
      Synthetic systems at fixed (n, D, degree histogram) with supports drawn
      from 1, 2, 3, 4 variable blocks -- FOUR interior points -- reporting |U_D|
      and the rank correction as a function of concentration, with every
      consecutive difference. HEUR-BOOL-2 predicts monotone increase as
      concentration rises. A flat curve localises the failure to the
      support-geometry mechanism rather than leaving "the correction was small".
    nearby_object_where_conclusion_must_fail: >-
      The three n = 9 D6 systems (N0 spread, N1 matched, sem) are the natural
      contrast set: the mechanism predicts corr(N0) < corr(N1) <= corr(sem).
      EQUAL corrections across all three is the constant-of-the-apparatus tell
      and FALSIFIES the support-geometry mechanism regardless of magnitude.
    ordering_control: >-
      The pre-known-zero null, the disjoint-support null and the hand-built
      positive control are computed, recorded and hash-committed BEFORE any
      audited-cell number is read. The decision bands are frozen in this
      contract.
    comparability_policy: >-
      The n = 9 D6 cells are AT the freeze degree, where EV-SIG-006 already
      attributes 3111 of N0's 4986 to the D5-quotient collapse and leaves 1875
      open. Those cells mix two mechanisms and the correction MUST be reported
      against the 1875 residue, not against the full 4986. The n = 12 D6 cell is
      BELOW freeze and is the only clean decisive cell; the ordering check across
      the n = 9 trio is used for its ORDER, never for its magnitudes. No
      comparison to EXP-SIG-002/003/005/007 numbers is made without citing the
      reduction path each was produced under.

  independent_variables: [n, D, arm, support concentration (blocks), multiplier size |mu|]

  metrics:
    primary:
      - "|U_D| per audit cell, with the admitting hitting-set condition recorded per element"
      - "rank(K_D^bool) - rank(K_D^poly) per audit cell"
      - "the decisive value at (n = 12, D = 6, null) against the three pre-declared bands"
      - "ordering of the correction across N0 / N1 / sem at n = 9 D6"
    secondary:
      - "corrected extra_D and residual_D beside uncorrected, per cell"
      - "the residue (uncorrected extra minus correction) per cell, always reported"
      - "|U_D| and rank correction across the 1/2/3/4-block graded sweep"
      - "count of degree-admissible mixed Frobenius-Koszul relations (target: 132 at n=12 D6, 72 at n=9 D6)"
      - "identification of the 'textbook Bardet' formula and whether its gap to the pinned series equals the Frobenius count"
      - "wall clock, peak RSS, checkpoint count for S3"

  heuristic_under_test: HEUR-BOOL-2

  preregistered_prediction:
    quantity: "rank(K_6^bool) - rank(K_6^poly) at (n = 12, seed 2, column-matched null)"
    formula: >-
      Three bands, all pre-declared and all useful, against the ceiling
      extra_6 = 7110 (quoted from EV-SIG-008):
      BAND A, >= 6400 (>= 90%): the below-freeze collapse is an enumeration
      artifact; the freeze theory stands; the D >= 6 baseline exists.
      BAND B, 700 to 6400: partial; the residue is the real phenomenon and is now
      quantified for the next null construction.
      BAND C, < 700 (< 10%): the mechanism is not the explanation; a clean
      negative with one candidate eliminated and the residue stated.
      HARD CONSISTENCY BOUND: the correction may never exceed 7110; a value above
      it contradicts K^bool subset-of kernel and is an implementation failure.
    source: >-
      H-SIG-8f7399 mechanism and proof_search_map; ceiling quoted from
      ledger/evidence/EV-SIG-008.yaml. FIXED BEFORE EXECUTION AND NEVER TUNED TO
      THE DATA.

  scale_relevance:
    tier: toy
    justification: >-
      The CONTAINMENT K^poly subset-of K^bool subset-of kernel is an algebraic
      identity and holds at every size, so the qualitative finding (the
      enumerator is incomplete, or it is not) transfers. The MAGNITUDE of the
      correction depends on support geometry and is measured at two sizes and
      three seeds' worth of frozen systems only; it does not transfer. The stated
      limit: no conclusion at n > 12, at other seeds, or about the completeness
      of the corrected family.
    correspondence: null

  tail_checks:
    - >-
      Every element of the computed U_D is verified to lie in the measured kernel
      by direct substitution on a random sample of at least 50 elements per cell
      (all of them where |U_D| <= 50). A single failure invalidates the cell.
    - Sanity: correction <= extra_D at every cell; residual_D >= 0 after correction.
    - >-
      Determinism: the (n = 12, D = 5) pre-known-zero gate is re-run under an
      identical key and compared field by field.

  replication:
    seeds: [1, 2, 3]
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 12
    maximum_memory_gb: 16
    maximum_runs: 30

  stopping_rules:
    - S0 finding a union-degree bound already in use: STOP, the audit is answered negatively.
    - S0 failing to reproduce a regression target: STOP, reproduction failure.
    - S1 refuting the containment: STOP at zero compute.
    - A positive rank correction at the (n = 12, D = 5) pre-known-zero gate: STOP, computation is wrong.
    - "|U_D| > 0 on the disjoint-support synthetic null: STOP, enumeration is wrong."
    - The hand-built positive control's single omitted syzygy not found: STOP, no negative may be reported.
    - S3 exceeding 16 GB or 1800 s at the n=12 D6 cell: checkpoint, report as infrastructure, do not retry blind.
    - Total runs reaching 30: stop and report what was completed.

  invalidation_rules:
    - Any audited-cell number read before the three control arms are hash-committed invalidates that cell.
    - A correction exceeding the measured extra_D at any cell invalidates that cell.
    - A run whose seed derivation deviates from the stated rule is invalid.
    - >-
      A timeout, crash, out-of-memory, missing dependency or absent solver is
      recorded as failed_infrastructure and is NEVER evidence for or against
      H-SIG-8f7399 (AGENTS.md rule 5). The absence of Sage is an implementation
      request, not a result.
    - >-
      Any n = 9 D6 magnitude used as if it were a clean below-freeze measurement
      invalidates that comparison; those cells are at the freeze degree and mix
      two mechanisms.

  success_criterion: >-
    S0 reproduces every regression target AND S1 establishes the containment AND
    all three control arms return their forced values AND |U_D| plus the rank
    correction are computed at the decisive cell. Under those conditions the run
    yields a decidable answer against the three pre-declared bands, whichever
    band it lands in. "Success" means an interpretable measurement, NOT
    confirmation: bands A, B and C are all successful outcomes and all three
    advance GOAL-SIG-001's next_action.

  falsification_criterion: >-
    H-SIG-8f7399's explanatory claim is falsified by a correction below 700 at
    the decisive cell (band C), or by equal corrections across N0 / N1 / sem at
    n = 9 D6, or by a flat |U_D| across the block-concentration sweep. Its
    CONTAINMENT claim is falsified only by exhibiting an element of U_D that is
    not in the kernel, and the two must not be conflated in any evidence record.

  outcomes_and_their_dispositions:
    - condition: band A (correction >= 6400)
      disposition: >-
        Evidence at toy tier that the (n = 12, seed 2, D = 6) null defect is an
        enumeration artifact. It does NOT by itself validate the null or make any
        cascade quantity admissible -- completeness of the corrected trivial
        family is not established by adding one family, and admission is a
        Coordinator decision. The correct next step is a completeness audit of
        the corrected family, not an admission.
    - condition: band B (700 to 6400)
      disposition: >-
        Partial explanation with a quantified residue. The residue is handed to
        the SIG-D6-NULL-RECAL-v2 lane as a target the next construction must
        explain. This is the most likely outcome.
    - condition: band C (< 700)
      disposition: >-
        Clean negative. One candidate mechanism eliminated, the residue stated,
        and the successor candidates named explicitly (mixed Frobenius-Koszul
        polynomial-multiplier families; the top-slice relation conjecture
        EV-SIG-006 leaves unchecked for the 1875 residue at n = 9; an
        instance-dependent baseline built from the measured variety). A count of
        eliminated mechanisms without those successors would be a fatigue report
        and is forbidden by inventor protocol section 4.
    - condition: control failure or infrastructure exhaustion
      disposition: >-
        failed_infrastructure or invalid as applicable; never reported as
        evidence about the null, the baseline, or the cascade.

  required_artifacts:
    - both loop bounds quoted verbatim with file path and line numbers, and the caller's family list
    - the containment proof or refutation, written out
    - "|U_D| per cell with the admitting condition per element, and the substitution-check sample"
    - "rank(K_D^bool) and rank(K_D^poly) per cell, with the checkpoint trail for the n=12 D6 cell"
    - the three control-arm results with their pre-commit hashes and timestamps
    - the block-concentration sweep table, unaggregated
    - corrected and uncorrected extra_D and residual_D side by side, with the residue
    - exact commands, git commit and dirty-tree state, dependency versions, seeds, peak RSS, wall clock
    - resolved model policy, backend, model identifier and probe-verification status per AGENTS.md artifact policy
    - a statement of which execution environment provided the GF(2) rank (Sage or ported)

  approval_requirements:
    - Coordinator approval is required before any execution (AGENTS.md rule 1).
    - >-
      S0 and S1 are reading and pen-and-paper stages and should be reviewed as a
      unit before S2 is authorized, since either can end the line at zero cost.
    - >-
      No evidence record may be written from this contract until it carries
      status: approved and a run receipt.

  assigned_to: executor
