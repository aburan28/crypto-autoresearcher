experiment:
  id: EXP-CSIDH-462e02
  hypothesis_id: H-CSIDH-5fc69f
  derived_from_idea: IDEA-20260809-666d3d
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Independent reversible-circuit construction and gate count for the CSIDH
    class group action at three toy parameter sizes, gated on exact simulation
    agreement against a validated direct implementation and on clean ancilla
    uncomputation, with measured and modeled columns kept strictly separate
  objective: >-
    The one uncertainty a run reduces is whether this program can own a
    per-query cost for the CSIDH class group action - the factor every quantum
    cost estimate multiplies its oracle-query count by - as a constructed,
    counted and VALIDATED artifact rather than as a figure adopted from one side
    of a published dispute. A run establishes (i) whether the reversible circuit
    computes the same action as a direct classical implementation on 500 random
    inputs at each of three parameter sizes; (ii) whether every ancilla register
    is returned clean by explicit uncomputation inside the counted circuit,
    which is the gate that decides whether the count is usable in a
    fault-tolerant estimate at all; (iii) the gate counts themselves under a
    declared gate set, with peak ancilla width as a first-class metric sized
    analytically and reconciled against measurement; and (iv) whether the
    measured counts reproduce the scaling the construction's own structure
    implies. A run adjudicates NO published model, compares against NO published
    figure, and produces NO security verdict for CSIDH.
  what_this_is_not:
    - >-
      Not a security level, not an attack, and not a verdict on CSIDH. A gate
      count is one factor in models this program does not adjudicate.
    - >-
      Not a claim of novelty for the construction. Concrete reversible costs for
      this action have been published; the delta claimed is INDEPENDENCE and
      executable validation, not a lower number.
    - >-
      Not a comparison against published costings. The parent proposal's own
      novelty screen records "WEB NOT CHECKED"; the published figures are
      recalled and unretrieved, and no agreement or disagreement with them may
      be stated from this run.
    - >-
      Not a measurement at any deployed parameter set. CSIDH-512 and larger
      appear only as MODELED cells, labeled as such, never as measured.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No
      run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the three named toy parameter sets, under
      the declared gate set and memory model, the constructed reversible circuit
      computes the class group action correctly on the tested inputs, returns
      its ancilla clean, and costs the measured number of gates with the
      measured peak ancilla width. WHAT DOES NOT FOLLOW - no per-query cost at
      CSIDH-512, CSIDH-1024 or CSIDH-1792 (those are modeled extrapolations of a
      formula, and the model's error at toy scale bounds nothing at deployed
      scale); no comparison with any published count; no query-count model is
      endorsed or refuted; and no statement about CSIDH's security in either
      direction. A count without its gate set, ancilla model and word size is
      not a number this experiment produced.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, declaration) - freeze the gate set, the memory
      model, the arithmetic word size, the three parameter sets, the analytic
      size formula for the dominant ancilla register, and the construction's
      implied gate-count formula. All five are written BEFORE any circuit is
      built, because a formula fitted afterwards is not a prediction. STAGE 1
      (implementation) - build the DIRECT classical implementation of the group
      action and validate it against known small-parameter results; this is a
      HARD GATE and nothing downstream is meaningful without it. STAGE 2
      (implementation) - build the reversible circuit for isogeny evaluation
      parameterized by the prime set and exponent bounds, with EXPLICIT
      uncomputation of every intermediate inside the counted circuit. STAGE 3
      (minutes) - simulate the circuit on 500 random inputs per parameter size,
      recording per-input output agreement against the direct implementation and
      per-input ancilla state at the end of execution. STAGE 4 (minutes) - count
      gates by traversal of the constructed circuit, per gate type, and measure
      peak ancilla width. STAGE 5 (zero compute) - assemble the cost table with
      MEASURED and MODELED columns strictly separated, every optimistic
      assumption listed with the DIRECTION of its bias, the dominant register
      sized analytically and reconciled against measurement, and an explicit
      statement of what is hidden in lower-order terms. STAGE 6 (zero compute) -
      write the refusal statement naming every parameter set and every published
      model this table does NOT speak to.
    instrument: >-
      A reversible-circuit construction and simulation stack, with gate counting
      by traversal rather than by formula. The direct classical implementation
      of the group action is a SEPARATE code path used only as ground truth,
      written independently of the circuit so a shared bug cannot make both
      agree. Recorded through harness/runner.py with a manifest and source blob
      hashes for both code paths.
    parameters: >-
      Three toy CSIDH-shaped parameter sets, fixed in STAGE 0 and frozen: small
      odd prime sets of sizes n1 < n2 < n3 with p = 4 * prod(l_i) - 1 and a
      declared exponent bound, chosen so that the direct implementation can be
      exhaustively cross-checked at the smallest size and the circuit is still
      simulable at the largest. 500 random inputs per parameter size. The gate
      set, the ancilla/memory model and the arithmetic word size are declared
      once and reported with EVERY count. The exact prime sets, exponent bounds,
      gate set and memory model are NOT supplied by the parent proposal and MUST
      be fixed by a Coordinator before approval (see derivation_gaps).
  controls:
    - >-
      REVERSIBILITY CHECK (hard gate) - ancilla must be returned clean, verified
      by simulation on every input. Dirty ancilla would understate the cost
      dramatically and is the classic failure mode here, so it is gated rather
      than assumed.
    - >-
      DIRECT-IMPLEMENTATION CONTROL (hard gate) - the classical action
      implementation is validated against known small-parameter results BEFORE
      it is used as ground truth. A circuit validated against an unvalidated
      oracle certifies nothing.
    - >-
      INDEPENDENT-CODE-PATH CONTROL - the circuit and the direct implementation
      are written as separate modules with no shared isogeny routine, so that
      agreement is evidence rather than a tautology. The absence of shared
      routines is itself reported.
    - >-
      IDENTITY-ACTION NULL - the zero exponent vector must produce the identity
      action and, in the circuit, must leave the input register unchanged with
      clean ancilla. A construction that cannot produce the trivial case
      correctly cannot certify the non-trivial one.
    - >-
      INVERSE-ACTION CONTROL - applying the exponent vector e and then -e must
      return the original curve, checked in both the direct implementation and
      the circuit. This tests the group structure, not just individual outputs.
    - >-
      DELIBERATELY BROKEN-UNCOMPUTATION ARM - one variant with the uncomputation
      stage removed. Its ancilla_clean_fraction must be strictly less than 1 and
      its gate count strictly lower. If the instrument cannot detect its own
      omitted uncomputation, the reversibility check is not measuring anything.
    - >-
      SCALING CONTROL - the measured count is compared against the construction's
      implied count declared in STAGE 0, per parameter size and per gate type,
      so a traversal bug shows up as a structured discrepancy rather than as a
      plausible number.
  independent_variables:
    - parameter set size (three toy sizes)
    - exponent bound
    - gate type within the declared gate set
    - >-
      circuit variant - full construction versus the deliberately
      broken-uncomputation arm
    - random input (500 per size)
  metrics:
    primary:
      - >-
        simulation_agreement_fraction - fraction (unitless, in [0,1]) of the 500
        random inputs per size on which the circuit's output register equals the
        direct implementation's output; computed by exact comparison, not by
        hashing
      - >-
        ancilla_clean_fraction - fraction (unitless, in [0,1]) of simulated
        executions in which every ancilla register is exactly the zero state at
        the end of the circuit
      - >-
        gate_count_by_type - MEASURED counts (unitless, per gate type in the
        declared gate set) obtained by traversal of the constructed circuit, per
        parameter size
      - >-
        peak_ancilla_width - MEASURED peak number of ancilla qubits held
        simultaneously (qubits), per parameter size
    secondary:
      - >-
        modeled_gate_count - the count the STAGE 0 construction formula implies
        (unitless), reported in a SEPARATE column from the measured count and
        never mixed into it
      - >-
        measured_to_modeled_ratio - gate_count_by_type divided by
        modeled_gate_count (unitless), per size and per gate type
      - >-
        analytic_ancilla_size - the analytically derived size of the dominant
        ancilla register (qubits), reconciled against peak_ancilla_width
      - >-
        broken_uncomputation_delta - the gate-count reduction (unitless) and the
        ancilla_clean_fraction of the broken arm, showing the instrument detects
        its own breakage
      - >-
        direct_implementation_validation_status - one of {validated_against_known,
        failed, no_reference_available} (categorical)
      - >-
        identity_and_inverse_control_status - pass/fail (boolean) for the
        identity-action null and the inverse-action control
      - >-
        circuit_depth and total qubit width (unitless / qubits), reported
        because a gate count alone hides a time-memory tradeoff
      - >-
        simulation_wall_clock_seconds per size, reported so the cost of the
        VALIDATION is visible alongside the cost of the circuit
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      simulation_agreement_fraction, ancilla_clean_fraction, and
      measured_to_modeled_ratio at each of the three parameter sizes.
    formula: >-
      Predicted simulation_agreement_fraction = 1.0 exactly and
      ancilla_clean_fraction = 1.0 exactly at every size, with zero tolerance on
      both. Predicted measured_to_modeled_ratio within [0.8, 1.25] per gate type
      per size, where modeled_gate_count comes from the construction formula
      frozen in STAGE 0 BEFORE the circuit is built. Predicted
      peak_ancilla_width within a factor of 1.25 of analytic_ancilla_size. Under
      the null that the construction is wrong or the traversal is buggy, at
      least one of these fails - and the contract pre-commits to the diagnostic
      order traversal, then uncomputation, then model.
    source: >-
      Pre-registered in IDEA-20260809-666d3d's `predictions` block ("One.
      Anything less invalidates the count." for simulation agreement; "a count
      that does not scale as the construction implies indicates a bug in
      traversal or in uncomputation") and restated in H-CSIDH-5fc69f before any
      run under this contract exists. The 1.25 tolerances and the ancilla-width
      prediction are added here as the decidable form of the parent's
      qualitative statement, and are frozen before any circuit is built.
  scale_relevance:
    tier: toy
    justification: >-
      Three small parameter sets, chosen so that a direct classical
      implementation can be cross-checked exhaustively at the smallest size and
      the reversible circuit remains simulable at the largest. That overlap is
      the entire design - a gate count is only ever validated where the circuit
      can be simulated against ground truth. THE TRANSFER ASSUMPTION IS STATED
      AND IS NOT USED: the construction's implied scaling formula, once
      reproduced at toy scale, is the only thing that could carry a number to
      CSIDH-512, and a formula reproduced within a factor of 1.25 at three toy
      points bounds NOTHING at a deployed parameter set. Deployed-parameter cells
      appear only as modeled, labeled, and accompanied by the direction of every
      optimistic assumption feeding them.
    correspondence: null
  cost_model_disclosure:
    measured_vs_modeled: >-
      Every cell of the deliverable table is labeled MEASURED (traversal of a
      constructed circuit, with a manifest) or MODELED (the STAGE 0 formula,
      with the formula printed in the table). The two never share a column. The
      three toy sizes have both; every deployed parameter set has only modeled
      cells.
    optimistic_assumptions:
      - assumption: >-
          Ideal gates with no error correction, no routing, no connectivity
          constraint and no magic-state distillation cost.
        direction_of_bias: >-
          UNDERSTATES the true fault-tolerant cost, by a factor that is itself
          the subject of the models this experiment refuses to adjudicate.
      - assumption: >-
          Ancilla are free to allocate up to peak_ancilla_width and are reused
          optimally.
        direction_of_bias: >-
          UNDERSTATES cost, and specifically understates it MORE at larger
          parameters, so it biases any extrapolation optimistically.
      - assumption: >-
          Field arithmetic is counted at the declared word size with no
          allowance for carry-chain depth beyond what the circuit contains.
        direction_of_bias: UNDERSTATES depth; direction is optimistic.
      - assumption: >-
          The three toy parameter sets exhibit the same structural bottleneck as
          deployed sets.
        direction_of_bias: >-
          UNKNOWN DIRECTION, and this is the most dangerous of the four. It is
          flagged rather than resolved, and is why no deployed-parameter cell is
          labeled measured.
    memory_accounting: >-
      Peak ancilla width is a PRIMARY metric, not a footnote. The dominant
      ancilla register is sized ANALYTICALLY in STAGE 0 from the field size and
      the number of simultaneously live intermediates, and the measured
      peak_ancilla_width is reconciled against it; a mismatch beyond a factor of
      1.25 is a defect finding. Circuit depth and total qubit width are reported
      alongside, because a gate count alone conceals the time-memory tradeoff
      that any downstream estimate must make.
    hidden_overhead: >-
      Stated plainly - the per-query cost measured here excludes error
      correction, layout and routing, and the cost of the coherent superposition
      the oracle is actually queried in. Those are not lower-order terms; they
      are multiplicative factors this experiment does not measure, and any table
      quoting this number without them is quoting it wrongly.
    standardized_parameter_sets: >-
      The named deployed sets a downstream reader will want - CSIDH-512,
      CSIDH-1024, CSIDH-1792 - are listed in the table with MODELED cells only,
      and each carries the modeled/measured label and the optimistic-assumption
      list above. AFFECTED-VS-SAFE SCOPE - this experiment establishes no attack
      and therefore places NO parameter set in an affected category; the scope
      statement is that all deployed sets are unaffected by this run, which is a
      statement about the run, not about their security.
  tail_checks:
    - >-
      Report the number of distinct random inputs actually simulated per size
      and refuse to state agreement for any size with fewer than 500.
    - >-
      Report whether the 500 random inputs cover the full exponent range at each
      size, since agreement on a degenerate subrange is not agreement.
    - >-
      Report the largest single-gate-type count and its share of the total, so a
      count dominated by one primitive is visible rather than averaged away.
    - >-
      Report per-input ancilla state failures individually, never as an
      aggregate rate alone; one dirty execution is disqualifying.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6.0
    maximum_memory_gb: 16
    maximum_runs: 25
  stopping_rules:
    - >-
      HALT if the direct classical implementation fails validation against known
      small-parameter results. There is no ground truth and nothing about the
      circuit is certifiable.
    - >-
      HALT if the broken-uncomputation arm is NOT detected by the reversibility
      check; the check is not measuring anything.
    - >-
      Stop at the three frozen parameter sizes. The gate set, memory model, word
      size, parameter sets and construction formula are frozen in STAGE 0 before
      the circuit is built and are not revised after seeing a count.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
    - >-
      If the largest parameter size proves unsimulable within budget, report the
      two smaller sizes and record the third as not_attempted; do NOT substitute
      a modeled count for a measured one.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run in which the circuit and the direct implementation share an isogeny
      routine is invalid_measurement - agreement would be tautological.
    - >-
      A run reporting a gate count without its gate set, ancilla model and
      arithmetic word size is invalid_reporting; the number is not
      interpretable.
    - >-
      A run whose table mixes measured and modeled values in one column is
      invalid_reporting, regardless of the values.
    - >-
      A run whose control arms were not executed in the same invocation as the
      signal arm is invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    The direct implementation passes its validation gate; the
    broken-uncomputation arm is detected (its ancilla_clean_fraction < 1 and its
    gate count strictly lower); the identity-action null and inverse-action
    control pass; simulation_agreement_fraction = 1.0 and
    ancilla_clean_fraction = 1.0 at all three sizes over 500 inputs each; every
    measured_to_modeled_ratio lies in [0.8, 1.25] per gate type per size; and
    peak_ancilla_width is within a factor of 1.25 of analytic_ancilla_size. The
    deliverable table separates measured from modeled cells, lists every
    optimistic assumption with its direction of bias, and carries the
    affected-vs-safe scope statement.
  falsification_criterion:
    - >-
      simulation_agreement_fraction < 1.0 at any size - the circuit does not
      compute the group action, the count is VOID, and the deliverable is a
      defect report with no number published.
    - >-
      ancilla_clean_fraction < 1.0 at any size - the count is not a valid input
      to any fault-tolerant estimate; the record states exactly that and reports
      the obstruction rather than an understated cost.
    - >-
      Any measured_to_modeled_ratio outside [0.8, 1.25] after traversal and
      uncomputation bugs are excluded - either the construction formula or the
      circuit is wrong; the discrepancy is reported as a defect and may be
      reported as an unmodeled cost only after both are excluded.
    - >-
      peak_ancilla_width outside a factor of 1.25 of analytic_ancilla_size - the
      memory model is wrong and the cost table's memory column is withdrawn.
    - >-
      The direct implementation fails validation, or the broken-uncomputation
      arm goes undetected - instrument failure; measurement stops and no count
      is recorded.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state,
      resolved model/inference block and environment
    - >-
      raw-result.json carrying PER-INPUT simulation agreement and PER-INPUT
      final ancilla state for all 500 inputs at every size - not summaries
    - >-
      the constructed circuit itself, serialized, so the count is reproducible
      by an independent traversal
    - >-
      the STAGE 0 declaration - gate set, memory model, word size, parameter
      sets, analytic ancilla size formula and construction gate-count formula -
      written before the circuit was built and hashed
    - >-
      the direct implementation's validation record against known small-parameter
      results
    - >-
      the broken-uncomputation arm's measurements, in the same file as the
      signal arm
    - >-
      the cost table with MEASURED and MODELED columns separated, the optimistic
      assumption list with directions of bias, the memory reconciliation, the
      hidden-overhead statement, and the affected-vs-safe scope statement
    - source blob hashes for both code paths
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      The STAGE 0 declaration must be reviewed and frozen BEFORE implementation
      begins. A construction formula written after the circuit exists is not a
      prediction and turns this contract into a self-fulfilling one.
    - >-
      The parent proposal declares implementation cost medium-to-high; a
      Coordinator must confirm the implementation budget is available before
      authorizing, since the compute is trivial and the engineering is not.
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260809-666d3d
    authored_at: '2026-08-25'
    note: >-
      Objective, controls and the two hard gates are transcribed from the parent
      proposal's `minimal_test`, `controls`, `predictions` and
      `falsification_conditions` blocks. The parent is SPARSE by comparison with
      other records in this batch - it names three sizes, 500 inputs, a
      reversibility check and a direct-implementation control, and nothing more.
      Everything added here (the 1.25 tolerances, the broken-uncomputation arm,
      the identity and inverse controls, the independent-code-path requirement,
      the cost_model_disclosure block) is the decidable form of the parent's
      qualitative statements, added under the cost-model measurement pattern of
      .claude/skills/design-experiment. No measurement, count or citation is
      invented; where the parent supplied no value the gap is listed below.
  derivation_gaps:
    - >-
      THE THREE PARAMETER SETS ARE NOT NAMED. The parent says only "three small
      parameter sizes". The exact prime sets and exponent bounds must be fixed
      and frozen by a Coordinator before approval; choosing them after seeing a
      count would make the scaling check meaningless.
    - >-
      THE GATE SET IS NOT NAMED. A count under Clifford+T, under Toffoli+CNOT,
      and under a raw reversible-gate model differ by large constant factors and
      are not comparable. The gate set must be fixed before approval or the
      primary metric is not well defined.
    - >-
      THE MEMORY MODEL IS NOT NAMED, and neither is the arithmetic word size.
      Both are required for peak_ancilla_width and analytic_ancilla_size to be
      comparable at all.
    - >-
      THE CONSTRUCTION'S IMPLIED GATE-COUNT FORMULA does not exist yet. The
      parent's prediction is "follows the construction's structure", which is
      not decidable until that formula is written down. STAGE 0 exists to write
      it, and approval must confirm it was written before the circuit.
    - >-
      "KNOWN SMALL-PARAMETER RESULTS" for validating the direct implementation
      are RECALLED and unretrieved. If none can be reached in this environment,
      the direct-implementation control degrades to internal consistency checks
      (identity, inverse, commutativity of the action) and the Coordinator must
      decide before approval whether that weaker ground truth justifies the
      implementation budget.
    - >-
      The published costings this program would eventually compare against are
      unretrieved ("WEB NOT CHECKED"). The comparison is therefore explicitly
      OUT OF SCOPE for this contract and needs its own retrieval task first.
