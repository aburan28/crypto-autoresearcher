experiment:
  id: EXP-ICEX-48d649
  hypothesis_id: H-ICEX-51839b
  derived_from_idea: IDEA-20260811-6c893b
  question_id: RQ-JINV-8fc13a
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    THE SIX FIXED SPECIAL-j CURVES OVER Q AGAINST THE SEMICIRCLE AND AGAINST TEN
    RANDOM NON-CM CONTROLS- with a CM positive control whose Kolmogorov-Smirnov
    statistic must exceed 0.25 against a computed band of 0.0049, a decay control
    with a computed factor-13.3 target, a family-wise correction fixed before any
    statistic is computed, and the rare-event discriminant count DECLARED
    UNDERPOWERED IN ADVANCE if its control rate is below 10
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. The six Semaev degeneration j are FIXED RATIONALS defined
    over Q, so each is a single curve up to quadratic twist and its reductions form a
    family indexed by p. Whether that family is arithmetically special - whether the
    algebraic degeneration divisor of this lane is coupled to endomorphism structure
    - has never been examined, only assumed away.
    (B) WHAT IS BUILT. One point-counting pipeline over all good primes below a
    declared bound, applied identically to- the six special curves and their
    quadratic twists; the j = 0 and j = 1728 CM baselines as a BLOCKING POSITIVE
    CONTROL; and ten fixed random non-CM curves whose own spread defines the band.
    Four pre-registered tests, a decay control at three prime bounds, and a
    pre-registered family-wise correction.
    (C) THE TWO POWER COMPUTATIONS THIS CONTRACT PERFORMS BEFORE THE DESIGN, SO THAT
    NEITHER CONTROL IS A NUMBER THAT PROVES NOTHING.
      POSITIVE CONTROL SEPARATION. Under complex multiplication about half the primes
      are inert and have a_p = 0, so the empirical distribution has an atom of about
      0.5 at theta = pi/2 while the semicircle is continuous with cumulative 0.5
      there; the supremum difference is therefore AT LEAST ABOUT 0.25. At the target
      bound there are about 78500 good primes below 2^20, so the two-sided 95 percent
      Kolmogorov-Smirnov band is about 1.36/sqrt(78500) = 0.0049. THE CM CONTROL MUST
      EXCEED ITS BAND BY A FACTOR OF ABOUT FIFTY, and if it does not the instrument
      has no power and every null is void.
      DECAY CONTROL TARGET. The good-prime counts at bounds 2^12, 2^16 and 2^20 are
      about 446, 6542 and 78500, so the sample grows by about 176 and the statistic
      should fall by about sqrt(176) = 13.3. PRE-REGISTERED BAND- the measured ratio
      lies in [6.6, 26.6], a factor-2 tolerance around 13.3.
    (D) THE ARM DECLARED UNDERPOWERED BEFORE THE DATA. Counting primes at which
    |D_0| lies among the nine class-number-one values is a RARE EVENT- small |D_0|
    requires the square part of a_p^2 - 4p to be of order p, a density of order
    1/sqrt(p), so the expected count per curve is of order at most ten. IF THE POOLED
    TEN-CURVE CONTROL COUNT IS BELOW 10, A POISSON INTERVAL AROUND IT CONTAINS 0
    THROUGH 3 AND NO ALTERNATIVE CAN CROSS IT. THE CONTRACT COMPUTES THE CONTROL RATE
    FIRST AND, IF IT IS BELOW 10, DECLARES THAT ARM UNDERPOWERED AND FALLS BACK TO
    THE TWO-SAMPLE TEST ON log|D_0|, WHICH USES THE FULL SAMPLE.
    (E) WHAT IS NOT DECIDED. Any solving cost - no cost measurement is made. Any
    independence claim - a null bounds the coupling at the detectable effect size and
    nothing more. And no crypto-scale statement, since the prime range is chosen for
    feasibility.
  inputs:
    cost_unit: >-
      THERE IS NO COST METRIC. theta is an ANGLE IN RADIANS on [0, pi]; the
      Kolmogorov-Smirnov statistic is a DIMENSIONLESS supremum of a
      cumulative-distribution difference; a_p, D_0 and f are INTEGERS; counts are
      integers; p-values are probabilities. WALL-CLOCK SECONDS ARE RECORDED FOR
      BUDGET ONLY and enter no statistic.
    unit_discipline: >-
      BINDING. Every value carries a tag in {radians, dimensionless, integer, count,
      probability, seconds}. Cross-tag arithmetic requires a named recorded
      conversion. NO QUANTITY IN THIS CONTRACT IS A TIME DIVIDED BY ANYTHING.
    quantifier_discipline: >-
      BLOCKING. Every statistic is computed PER CURVE OVER p. A p-BY-p STATISTIC
      ACROSS CURVES MAY NEVER BE REPORTED AS EVIDENCE - it would be a claim about six
      numbers. The harness refuses to emit a cross-curve per-prime statistic.
    multiple_comparisons: >-
      BLOCKING AND PRE-REGISTERED BEFORE ANY STATISTIC IS COMPUTED. Six curves times
      four tests times three prime bounds is 72 tests. The family-wise correction -
      Holm-Bonferroni at family-wise alpha 0.05 - is fixed in this contract, so the
      per-test threshold can be as low as 0.05/72, and no correction may be chosen
      after the p-values are seen.
    band_computation: >-
      BANDS ARE COMPUTED PER CURVE FROM ITS OWN EFFECTIVE SAMPLE SIZE, because the
      six have different conductors and therefore different bad-prime counts. A band
      computed once and applied to all is inadmissible.
    frozen_before_execution: >-
      The curve list, the prime-bound ladder, the lower prime cut, the family-wise
      correction, the CM control threshold of 0.25, the decay band [6.6, 26.6], the
      underpowered-arm rule at control count 10, the cited CM j-invariant table to be
      looked up, and the requirement that the Sato-Tate citation be verified in the
      run record. None may change after any statistic is computed.
    procedure: >-
      STAGE 0 (construction and classification, blocking). Verify the j-to-curve
      construction SYMBOLICALLY. Perform the integrality check on the five
      non-integral rational j by five exact divisibility tests. LOOK UP the sixth,
      -13824, AGAINST A CITED TABLE of the rational CM j-invariants - NOT FROM
      MEMORY. If it is on the table, that curve arm is restated against the CM law
      before any of its statistics are computed. VERIFY THE SATO-TATE CITATION with a
      specific reference recorded in the run record.
      STAGE 1 (point counting). For every good prime below the achieved bound and
      every curve - six special, their twists, two CM baselines, ten random controls -
      compute a_p, excluding and COUNTING bad-reduction primes and primes dividing
      the denominators. Report the effective sample size per curve.
      STAGE 2 (derived quantities). Compute theta_p, D = a_p^2 - 4p, its
      factorisation into D_0 f^2, and the class number where cheap.
      STAGE 3 (BLOCKING POSITIVE CONTROL). Run the Sato-Tate test on the j = 0 and
      j = 1728 CM baselines. REQUIRED- Kolmogorov-Smirnov statistic AT LEAST 0.25
      and a fraction of primes with a_p = 0 NEAR 0.5. FAILURE MEANS THE INSTRUMENT
      HAS NO POWER, THE RUN IS INVALID, AND NO NULL MAY BE REPORTED.
      STAGE 4 (BLOCKING DECAY CONTROL). Recompute the Kolmogorov-Smirnov statistic
      at three prime bounds and require the ratio between the smallest and largest
      bound to lie in [6.6, 26.6]. A statistic that does not decay as the sample
      grows is an artifact of the pipeline.
      STAGE 5 (POWER GATE, before any count verdict). Compute the pooled ten-curve
      control count of primes with |D_0| among the nine class-number-one values. IF
      IT IS BELOW 10, DECLARE THE COUNT ARM UNDERPOWERED and record that the verdict
      rests on the log|D_0| two-sample test instead.
      STAGE 6 (main tests). The four pre-registered tests per curve under the
      pre-registered family-wise correction, with the achieved minimum detectable
      effect reported on every null.
      STAGE 7 (twist and isogeny checks). Run each twist separately and verify that
      theta reflects while the D_0 statistics are unchanged. Check that no two of the
      six, and no special-control pair, are Q-isogenous.
      STAGE 8 (report). Per curve, never pooled across the six. Twists reported
      separately. Effective sample sizes, bands, achieved bound, and the achieved
      minimum detectable effect on every null.
    mechanism: >-
      STEP 1. One point-counting pipeline, one derived-quantity module, one testing
      module, one reporting path, applied identically to every curve. A curve with
      its own code path is not comparable and is not run.
      STEP 2. Bad-reduction primes and denominator-dividing primes are excluded AND
      COUNTED, and the effective sample size is carried into every band computation
      per curve.
      STEP 3. The CM baselines pass through the identical pipeline. Their rejection
      is what licenses reading any null from the special curves.
      STEP 4. The twists are a FREE INTERNAL CONSISTENCY CHECK- a_p negates, theta
      reflects, and D = a_p^2 - 4p is unchanged, so D_0 statistics must be identical.
      Any asymmetry beyond the reflection is an implementation error.
      STEP 5. Every row is reported as (curve, twist flag, prime bound, effective
      sample size, KS statistic, band, p-value, corrected threshold, D_0 summary,
      conductor summary, class-number-one count, fraction with a_p zero, achieved
      minimum detectable effect, wall seconds).
    instrument: >-
      Standard point counting at the upper end of the prime range and exhaustive
      counting at small p, with an independent recomputation of a_p on a random
      subsample as a self-check. Embarrassingly parallel and memory-trivial, so the
      budget is wall-clock only.
  controls:
    - >-
      C-CM-BASELINE (BLOCKING POSITIVE CONTROL, with its magnitude computed). j = 0
      and j = 1728 must be REJECTED by the Sato-Tate test at a Kolmogorov-Smirnov
      statistic of AT LEAST 0.25, against a band of about 0.0049 at the target bound
      - a separation of about fifty band-widths - and must show the a_p = 0 signature
      at a fraction near 0.5. THIS IS THE PLANTED SIGNAL OF KNOWN SIZE. If it does
      not fire, the instrument has no power and EVERY NULL IN THE RECORD IS VOID.
    - >-
      C-RANDOM-CURVE (BLOCKING null object of the same shape). Ten fixed random
      non-CM curves over Q with small coefficients, through the identical pipeline.
      The special six must be indistinguishable from these, and THE CONTROL OWN
      SPREAD DEFINES THE BAND for the two-sample comparisons.
    - >-
      C-DECAY (BLOCKING artifact tell, with its target computed). The
      Kolmogorov-Smirnov statistic must decay like one over the square root of the
      sample size across three prime bounds. COMPUTED TARGET- a factor about 13.3
      between the 2^12 and 2^20 bounds, with a pre-registered band [6.6, 26.6]. A
      STATISTIC THAT DOES NOT DECAY AS THE SAMPLE GROWS IS AN ARTIFACT OF THE
      PIPELINE, NOT A PROPERTY OF THE CURVE. This is the single most important
      control in the design and it is cheap.
    - >-
      C-TWIST. Each quadratic twist run separately. a_p negates so theta reflects and
      the semicircle is symmetric; a_p^2 - 4p is unchanged so D_0 statistics are
      twist-invariant. VERIFIED RATHER THAN ASSUMED; any asymmetry beyond the
      reflection is an implementation error.
    - >-
      C-POWER-GATE (BLOCKING for the count arm). The pooled control count of
      class-number-one discriminants computed BEFORE any count verdict. Below 10, the
      arm is DECLARED UNDERPOWERED and the verdict falls back to the log|D_0|
      two-sample test.
    - >-
      C-ISOGENY. No two of the six, and no special-control pair, may be Q-isogenous.
      If any are, the samples are not independent and the pooled comparisons are
      redone.
    - >-
      C-CLASSIFICATION (BLOCKING). The sixth j looked up against a CITED table of
      rational CM j-invariants, NOT from memory, and the Sato-Tate citation verified
      with a specific reference in the run record. A curve found to be CM has its arm
      restated against the CM law BEFORE its statistics are computed.
    - >-
      NOTE ON THE ABSENCE OF A CURVE-FREE ARM, DECLARED RATHER THAN OMITTED. A
      Frobenius trace sequence is not produced by any non-curve object, so no
      curve-free null of the same shape exists. C-RANDOM-CURVE and C-CM-BASELINE
      replace it, and the CM control is what supplies the demonstrated dynamic range.
  independent_variables:
    - curve in {six special-j, their quadratic twists, j = 0, j = 1728, ten random non-CM controls}
    - prime bound in {2^12, 2^16, 2^20 or the achieved fallback}
    - statistic in {Sato-Tate KS, log|D_0| two-sample KS, class-number-one count, fraction with a_p zero}
  metrics:
    primary:
      - >-
        Kolmogorov-Smirnov statistic against the semicircle law, per curve per prime
        bound, with its per-curve band (dimensionless)
      - >-
        two-sample Kolmogorov-Smirnov p-value on log|D_0|, each special curve against
        the pooled ten-curve control (probability)
    secondary:
      - a_p per curve per prime (integer)
      - empirical theta cumulative distribution per curve
      - D_0 and conductor distribution per curve
      - count of primes with |D_0| among the nine class-number-one values, per curve
      - fraction of primes with a_p equal to zero, per curve
      - bad-reduction and excluded prime counts per curve, and the effective sample size
      - decay ratio of the KS statistic between the smallest and largest prime bound
      - twist consistency check outcomes
      - Q-isogeny check outcomes among all curve pairs
      - achieved minimum detectable effect on every null
      - wall-clock seconds per curve, for budget accounting only
  heuristic_under_test: HEUR-ST-1
  preregistered_prediction:
    quantity: >-
      The empirical distribution of normalised Frobenius angles, and of the
      fundamental discriminant and conductor, for each fixed special-j curve over Q
      as p varies over good primes below the achieved bound.
    formula: >-
      theta_p equidistributes with respect to (2/pi) sin^2 theta for a non-CM curve
      over Q, so the KS statistic lies inside the two-sided 95 percent band of about
      1.36/sqrt(n). CM baseline predicted at KS at least 0.25 against a band of about
      0.0049 at the target bound. Decay ratio predicted about 13.3 between the 2^12
      and 2^20 bounds, band [6.6, 26.6]. Fraction with a_p zero below 0.01 for non-CM
      and near 0.5 for CM.
    source: >-
      The Sato-Tate theorem for non-CM elliptic curves over Q, RECALLED AND UNREAD BY
      THIS AGENT and REQUIRED TO BE VERIFIED WITH A SPECIFIC REFERENCE IN THE RUN
      RECORD before any evidence record quotes it. The six fixed rational j come from
      IDEA-20260811-a7c1df, read in full for this contract; the non-CM classification
      from IDEA-20260811-df6c0f, read as a declared partial read. The numeric bands
      are computed in this contract from the good-prime counts.
  scale_relevance:
    tier: toy
    justification: >-
      The prime range is chosen for FEASIBILITY, not for cryptographic relevance.
      TRANSFER ASSUMPTION, STATED EXPLICITLY- Sato-Tate convergence is SLOW, so a
      null at the achieved bound bounds any coupling only at the effect size the
      sample supports, and that effect size is reported on every null row rather than
      the target one. NO TRANSFER TO CRYPTO-SCALE p IS CLAIMED OR POSSIBLE, since
      point counting over a comparable number of cryptographic-size primes is not
      reachable at any budget this program can spend.
    correspondence: null
  tail_checks:
    - >-
      The count of primes with |theta - pi/2| exceeding 1.3 - the extreme-trace tail -
      against the semicircle own tail probability, per curve. BULK AGREEMENT WITH A
      TAIL FAILURE IS THE CLASSIC SIGN OF A TRUNCATED OR BIASED SAMPLER.
    - >-
      The largest observed conductor per curve against the control maximum, since the
      discriminant arm is about the tail of the conductor distribution and a mean
      comparison would miss it.
    - >-
      Results reported WITH AND WITHOUT the declared lower prime cut, since for small
      p the semicircle is a poor approximation and D_0 statistics are dominated by
      boundary effects.
  replication:
    seeds: >-
      The ten random control curves are drawn from a declared seed recorded in the
      run manifest before stage 1. Point counting is deterministic, so replication
      here means the INDEPENDENT RECOMPUTATION of a_p on a random subsample and the
      three-bound decay ladder, not repeated sampling.
    independent_instances: 10
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24.0
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
    - >-
      The prime-bound fallback ladder 2^12 / 2^16 / 2^20 is DECLARED IN ADVANCE so a
      budget stop yields a SMALLER BUT VALID SAMPLE rather than an infrastructure
      failure. The ACHIEVED bound is reported and every band is recomputed for it.
    - >-
      Stage 0 classification failure for a curve restates that curve arm against the
      CM law rather than halting the run.
    - >-
      Stage 3 CM-baseline failure HALTS the run and marks it INVALID; no null may be
      reported.
    - >-
      Stage 4 decay-control failure HALTS interpretation; the statistic is an
      artifact.
    - >-
      Total wall-clock at the declared cap; curves not completed are recorded as NOT
      ATTEMPTED with the bound reached.
  invalidation_rules:
    - >-
      A cross-curve per-prime statistic reported as evidence invalidates the run, since
      the claim is per curve over p.
    - >-
      A band computed once and applied to all curves invalidates the comparison; bands
      are per curve from its own effective sample size.
    - >-
      A family-wise correction chosen after the p-values are seen invalidates every
      null.
    - >-
      A null reported without its achieved minimum detectable effect is inadmissible.
    - >-
      Quoting the rational CM j-invariant table from memory rather than from a cited
      source invalidates the classification.
    - >-
      Bad-reduction primes silently dropped rather than excluded and counted
      invalidates the effective sample sizes and therefore every band.
    - >-
      A count-arm verdict issued when the pooled control count is below 10, without
      the underpowered declaration, invalidates that verdict.
  success_criterion: >-
    Stage 0 classification completes with the sixth j looked up against a cited table
    and the Sato-Tate citation verified; the CM baselines are rejected at KS at least
    0.25 with the a_p = 0 signature; the decay ratio lies in [6.6, 26.6]; the power
    gate is evaluated before any count verdict; and the four tests are reported per
    curve under the pre-registered correction with the achieved minimum detectable
    effect on every null. SUCCESS IS A POWERED, CONTROLLED MEASUREMENT, not a
    particular direction.
  falsification_criterion: >-
    The CM baseline not rejected at KS 0.25 means the instrument has no power and the
    run is INVALID. The KS statistic failing to decay in [6.6, 26.6] means it is a
    pipeline artifact and every conclusion is void. Two or more special curves outside
    the Sato-Tate band under the pre-registered correction falsifies the null
    prediction and requires checking whether the deviating curves are the ones whose
    non-CM status rests on the table lookup. A small-|D_0| excess above 3 standard
    deviations, with the control rate at least 10, indicates arithmetic coupling and
    must be replicated at a second prime range before description.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the frozen parameter file with the curve list, prime ladder, lower cut, correction, thresholds and the power-gate rule
    - the symbolic verification of the j-to-curve construction
    - the five integrality divisibility tests and the CITED-TABLE lookup for the sixth j, with the source named
    - the verified Sato-Tate citation with a specific reference
    - a_p per curve per prime, with bad-reduction and excluded primes counted
    - the independent recomputation of a_p on a random subsample
    - theta empirical cumulative distributions per curve
    - KS statistics with PER-CURVE bands at every prime bound
    - the CM-baseline control outcome with its KS statistic and a_p-zero fraction
    - the decay ladder with the measured ratio against the band [6.6, 26.6]
    - D_0 and conductor distributions per curve, with the tail checks
    - the power-gate computation and the underpowered declaration if it fires
    - the four test results per curve under the pre-registered correction, with achieved minimum detectable effects
    - twist consistency and Q-isogeny check outcomes
    - the achieved prime bound and every band recomputed for it
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      A NULL DOES NOT PROVE INDEPENDENCE of the algebraic and arithmetic divisors. It
      bounds the coupling by the detectable effect size, which is reported on every
      null row. A null with unreported power is not a null.
    - >-
      NOTHING HERE BEARS ON SOLVING COST. No cost measurement is made and none is
      claimed.
    - >-
      NO MECHANISM IS KNOWN FOR A POSITIVE OUTCOME. A deviation would be an anomaly
      requiring explanation before any use, and this contract commits to treating it
      that way rather than describing it.
    - >-
      THE CLAIM IS PER CURVE OVER p, NEVER PER p OVER CURVES. A p-by-p statistic may
      never be reported as evidence.
    - >-
      THERE IS NO CURVE-FREE NULL AND NONE IS POSSIBLE for a Frobenius trace
      sequence. C-RANDOM-CURVE and C-CM-BASELINE replace it and that substitution is
      declared rather than left implicit.
    - >-
      SATO-TATE CONVERGENCE IS SLOW. The achieved bound and the achieved detectable
      effect are reported rather than the target ones.
    - >-
      72 TESTS. The family-wise correction is pre-registered before any statistic is
      computed, or every null is one lucky rejection away from being a finding.
    - >-
      THE RARE-EVENT COUNT ARM IS DECLARED UNDERPOWERED IN ADVANCE if the pooled
      control count is below 10, because a Poisson interval around a mean below 10
      contains the alternative.
    - >-
      THE CM j-INVARIANT TABLE IS NEVER REPRODUCED FROM MEMORY. The lookup is against
      a cited source recorded in the run record.
    - >-
      claim_tier toy. NO TRANSFER TO CRYPTO-SCALE p IS CLAIMED OR POSSIBLE. No
      attack, no exponent, no speedup, sota_delta zero.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
