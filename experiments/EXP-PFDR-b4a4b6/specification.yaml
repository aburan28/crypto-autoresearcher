experiment:
  id: EXP-PFDR-b4a4b6
  hypothesis_id: H-PFDR-05d754
  question_id: RQ-SBRG-f31cb2
  idea_id: IDEA-20260829-57b1eb
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation. 'draft' is the first state of the experiment machine in
    AGENTS.md.
  title: >-
    Measure the excess low-degree boolean vanishing dimension of the descended
    reachable chain-node set W against an EXACT integer null of 0, a planted
    positive forced to n minus b, and a CURVE-FREE IMAGE NULL of matched domain
    dimension and matched algebraic degree -- because the competing explanation
    attributes any excess to W being the image of a low-degree map from a
    low-dimensional domain, which is a property of low-degree maps and not of
    elliptic curves.
  claim_ceiling: >-
    A STRUCTURE PROBE, not an algorithm and not an attack. No exponent is claimed
    in either direction, no ECDLP statement is made, and a positive result carries
    an explicitly named remaining obligation -- closed-form derivation of the
    filters from the summation recursion -- before it could become an algorithm.
  claim_tier_basis: >-
    Toy tier. No solve is claimed. dim L_d is the corank of an exactly computed
    GF(2) linear map, so every reported dimension is an exact integer.
  objective: >-
    Establish, IN THIS ORDER: (1) that the instrument has POWER, by returning the
    planted positive excess exactly n minus b; (2) that the exact random null
    returns exactly 0; (3) the excess_d of the real reachable set across the
    admitted grid; (4) the excess_d of a CURVE-FREE image null at matched domain
    dimension, matched algebraic degree and matched cardinality, which governs
    every attribution; and (5) the excess of the rationality locus, which is a
    known target-independent dependency and must be subtracted rather than
    rediscovered. Only the part of any excess exceeding BOTH the curve-free image
    null AND the rationality locus may carry a curve-specific reading.
  band_non_degeneracy:
    statistic: 'excess_d = dim L_d(W) minus max(0, M_d minus |W|), an integer'
    null_value: 'exactly 0, predicted from linear algebra rather than estimated'
    alternative: 'excess_d at least 1, growing with n at fixed d'
    computed_check: >-
      The statistic is a nonnegative integer whose null value is exactly 0, so the
      alternative occupies the whole positive integers and the discriminator has
      unbounded width upward. THE REAL DEGENERACY RISK IS ADMISSIBILITY, not
      width: below |W| = M_d a nonzero dimension exists for counting reasons
      alone. The screen |W| at least 10 times M_d is therefore enforced BEFORE the
      run. ARITHMETIC CHECKED BY THE DRAFTING COORDINATOR: at n = 16,
      M_2 = 137, M_3 = 697, M_4 = 2517, M_5 = 6885; at n = 20, M_3 = 1351,
      M_4 = 6196, M_5 = 21700; at n = 24, M_3 = 2325, M_4 = 12951, M_5 = 55455.
    resolution: >-
      THE CELL n = 16 WITH d = 5 IS INADMISSIBLE FOR EVERY POSSIBLE W AND IS
      EXCLUDED BY ARITHMETIC RATHER THAN BY A SCREEN FIRING AT RUN TIME, because
      10 times M_5 is 68,850 while the entire ambient space has only 2^16 = 65,536
      elements. IDEA-20260829-57b1eb lists d = 5 in its n = 16 grid and describes
      that cell as merely the tightest on the grid; it is not tight, it is
      impossible. The admitted-cell table is computed and frozen at Stage 0 and
      every cell records its M_d, its measured |W| and its ratio so the screen can
      be audited after the fact.
  inputs:
    grid:
      n: '{16, 20, 24}'
      d: '{2, 3, 4, 5}, subject to the Stage 0 screen; n = 16 with d = 5 excluded by arithmetic'
      t: '{3, 4}'
      curves: 'at least 8 ordinary binary curves per n'
      field_basis: '{power, normal}'
      subspace_seeds: 'at least 3'
    screen: '|W| at least 10 times M_d, enforced before the run and audited after with the measured |W| reported'
    W_construction: >-
      by DIRECT GROUP ARITHMETIC from the factor base -- signed sums of t minus 1
      factor-base points, x-coordinates, deduplicated into a bitmap -- with NO
      summation polynomial anywhere on that code path
    rank_method: >-
      STREAMING the |W| evaluation columns against an M_d by M_d echelon carrier,
      so the evaluation matrix is never materialised
  controls:
    - id: CTRL-PLANTED-POSITIVE
      row_class: positive_control
      blocking: true
      object: >-
        the t = 2 slice, where the reachable set is the factor-base subspace
        itself and satisfies exactly n minus b independent linear relations; plus
        a random affine-image set of matched size and known relation count
      forced_disposition: >-
        MUST return excess_1 exactly n minus b, ZERO TOLERANCE, in every cell.
        THIS IS THE DEFECT OF KNOWN SIZE THAT DEMONSTRATES DYNAMIC RANGE. An
        instrument that cannot see known structure has no power and its zeros on
        the real object mean nothing. A miss HALTS the line and is an instrument
        defect, never a finding.
    - id: CTRL-EXACT-RANDOM-NULL
      row_class: null_object
      blocking: true
      object: 'a uniformly random subset of the rational-x locus at matched cardinality'
      forced_disposition: >-
        MUST return excess_d exactly 0 in every cell. A nonzero value means the
        cardinality screen is violated or the rank routine is wrong, and voids the
        battery. Twenty independent draws per cell; a single nonzero draw is
        investigated individually rather than averaged away.
    - id: CTRL-CURVE-FREE-IMAGE-NULL
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL. The image of a random F_2-polynomial map of
        MATCHED ALGEBRAIC DEGREE from a MATCHED (t minus 1) times b dimensional
        boolean domain into F_2^n, deduplicated to MATCHED CARDINALITY. It
        contains no curve, no group law and no summation polynomial.
      forced_disposition: >-
        MEASURED AND REPORTED BESIDE EVERY REAL-SET VALUE, with NO predicted value
        committed. BLOCKING FOR ATTRIBUTION: the competing explanation attributes
        an excess to W being the image of a low-degree map from a low-dimensional
        domain, which this object also is. IF THIS NULL REPRODUCES THE EXCESS AT
        MATCHED PARAMETERS, the excess is a property of low-degree map images and
        NOTHING in the run may be described as a statement about Semaev structure,
        summation polynomials, elliptic curves or the ECDLP. Only
        excess_d(W) minus excess_d(this null) may carry a curve-specific reading.
    - id: CTRL-RATIONALITY-LOCUS
      row_class: known_dependency
      blocking: true
      object: 'the set of x in F_{2^n} admitting a rational point'
      forced_disposition: >-
        MEASURED AND REPORTED SEPARATELY, with no prediction committed. It is a
        KNOWN target-independent dependency whose boolean degree this program has
        never measured, and it must be subtracted before any excess on W is
        attributed. Reporting an excess on W without this arm is PROHIBITED.
    - id: CTRL-BASIS-AND-SUBSPACE-INVARIANCE
      row_class: instrument
      blocking: true
      object: 'both field bases and at least three subspace seeds'
      forced_disposition: >-
        An excess must PERSIST across power and normal bases and across at least
        three subspace seeds, or it is a coordinate artifact and is reported as
        one. Boolean degree under Weil descent is basis-dependent and this is the
        single most likely source of a spurious positive.
    - id: CTRL-NO-SEMAEV-INDEPENDENCE
      row_class: instrument
      blocking: true
      object: 'the code path that builds W'
      forced_disposition: >-
        FORCED: group arithmetic only. If any code path touches a summation
        polynomial, the measurement is not independent of the object it is testing
        and the cell is VOID.
    - id: CTRL-DEDUPLICATION-AUDIT
      row_class: instrument
      blocking: true
      object: 'the measured cardinality of W'
      forced_disposition: >-
        FORCED: |W| measured exactly against the predicted cardinality with the
        collision count reported, so x-collisions and sign identifications are
        COUNTED rather than assumed, and so the filter-power ceiling rests on a
        measured number.
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: 'Pollard rho at 0.886 sqrt(N) group operations with O(1) memory'
      forced_disposition: >-
        The prior column of any cost statement. NO DOMINATION IS CLAIMED ON ANY
        AXIS: this contract mounts no attack.
  independent_variables:
    - 'n in {16, 20, 24}'
    - 'd within the admitted table'
    - 't in {3, 4}'
    - 'field basis in {power, normal}'
    - 'subspace seed'
    - 'object in {W, planted positive, exact random null, curve-free image null, rationality locus}'
  metrics:
    primary:
      - 'M_d, measured |W|, rank(Ev_d(W)), s_d and excess_d per cell. UNITS: dimension (integer)'
      - 'excess_d on the planted positive. UNITS: dimension (integer), forced n minus b'
      - 'excess_d on the exact random null. UNITS: dimension (integer), forced 0'
      - 'excess_d on the CURVE-FREE IMAGE NULL. UNITS: dimension (integer). THE ATTRIBUTION METRIC.'
      - 'excess_d on the rationality locus. UNITS: dimension (integer)'
      - 'filter power p, by uniform sampling with at least 10^6 samples per cell, with a Clopper-Pearson interval, quoted against the ceiling n minus log2 of the MEASURED |W|. UNITS: bits. REPORTED ONLY WHEN excess_d is at least 1 AND the curve-free null licenses a curve-specific reading.'
    secondary:
      - 'per-cell field basis, subspace seed, curve coefficients and curve order'
      - 'measured |W| against the predicted cardinality with the collision count'
      - 'peak resident memory and wall time per cell against the M_d squared over 8 formula'
      - 'the frozen admitted-cell table with each cell M_d, |W| and ratio'
      - 'the rank distribution over the 20 random-null draws per cell, which must be the constant M_d'
  heuristic_under_test: >-
    HEUR-001 (degree pseudorandomness of the reachable set, which is the NULL
    HYPOTHESIS of the experiment rather than a supporting assumption) and
    HEUR-002 (filter independence, tested only in cells where an excess is found
    and licensed) of H-PFDR-05d754.
  preregistered_prediction:
    quantity: >-
      excess_d on the real set, on the planted positive, on the exact random null,
      on the curve-free image null and on the rationality locus; and the filter
      power where licensed.
    formula: >-
      excess_d EXACTLY 0 on the real set in every admitted cell. Planted positive
      EXACTLY n minus b. Exact random null EXACTLY 0. Curve-free image null and
      rationality locus MEASURED WITH NO PREDICTED VALUE. A confirmed positive
      requires excess_d at least 1 persisting across BOTH field bases, at least
      three subspace seeds and at least three increasing n, AND exceeding the
      curve-free image null at matched parameters.
    source: >-
      H-PFDR-05d754 claims (A) to (E) and predictions P1 to P8. The exact random
      null value follows from the linearity of the evaluation map and a union
      bound. The M_d values and the n = 16 d = 5 inadmissibility were recomputed
      by the drafting coordinator. FIXED ON 2026-09-04, BEFORE ANY CELL RUNS.
  scale_relevance:
    tier: toy
    justification: >-
      Ordinary binary curves at n in {16, 20, 24}, Weil descent, chained
      representations, subspace factor bases, boolean polynomial degree. THREE
      VALUES OF n CANNOT ESTABLISH A GROWTH LAW and none is fitted; the negative
      is scoped to the tested cells exactly. No transfer to prime fields, to
      non-subspace factor bases, to other notions of compression, or to
      cryptographic scale is claimed or licensed.
    correspondence: 'none; W is enumerated directly by group arithmetic'
  tail_checks:
    - >-
      The cell with the TIGHTEST ratio of measured |W| to M_d, reported
      separately, since that is where the union bound behind the exact null is
      weakest.
    - >-
      The largest admitted d at each n, reported separately.
    - >-
      The LARGEST-n cell reported separately rather than pooled, because a signal
      that appears only at the smallest n is a small-parameter artifact.
    - >-
      When any excess is found: the single most selective filter reported
      individually, so a result driven by one polynomial is visible as such; and
      the measured rejection rate against both the independence prediction and the
      ideal ceiling.
  replication:
    seeds:
      - 'subspace seed 1'
      - 'subspace seed 2'
      - 'subspace seed 3'
    independent_instances: 8
    reason: >-
      At least 8 curves per n and at least 3 subspace seeds, with both field
      bases, because the persistence rule for a positive requires agreement across
      bases, seeds and increasing n, and a single-cell signal cannot satisfy it.
      Twenty independent draws of the exact random null per cell.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 320
    maximum_workers: 1
    notes: >-
      The largest object anywhere is the M_d by M_d echelon carrier, about 384 MB
      at the largest admitted cell (n = 24, d = 5), plus a bitmap of W. NO
      Macaulay matrix and NO Groebner basis is built, and the carrier is bounded
      by the MONOMIAL COUNT SQUARED rather than by rank times a monomial space.
      Peak resident memory is predicted below 500 MB and IS A REQUIRED REPORTED
      METRIC so that the prediction can fail. A resource stop is INFRASTRUCTURE
      signal under AGENTS.md rule 5 and never negative mathematical evidence.
  stages:
    - id: stage-0-feasibility
      purpose: >-
        compute the M_d table, the carrier bytes and the required |W|, freeze the
        ADMITTED CELL LIST with a sha256, and record that n = 16 with d = 5 is
        excluded by arithmetic
      blocking: true
    - id: stage-1-planted-positive
      purpose: 'the t = 2 slice and the random affine image; excess_1 forced to n minus b'
      blocking: true
    - id: stage-2-exact-null
      purpose: 'the uniformly random subset of the rational-x locus, 20 draws per cell; excess forced 0'
      blocking: true
    - id: stage-3-main-grid
      purpose: 'build W by group arithmetic and compute excess_d over the admitted grid'
    - id: stage-4-curve-free-null
      purpose: >-
        the matched-degree, matched-domain-dimension, matched-cardinality
        random-map image; BLOCKING FOR ATTRIBUTION and reported beside every real
        value
      blocking: true
    - id: stage-5-rationality-locus
      purpose: 'the known target-independent dependency, measured and reported separately'
      blocking: true
    - id: stage-6-report
      purpose: >-
        if excess is zero everywhere, write the closure with its named
        obstruction, its exact argument and its forward guidance, as a PROPOSAL
        for the Coordinator and never as a status change; if nonzero and licensed,
        estimate the filter power and state the remaining derivation obligation
  stopping_rules:
    - 'STOP at stage 1 if the planted positive does not return excess_1 exactly n minus b. Nothing is reported.'
    - 'STOP at stage 2 if the exact random null returns nonzero excess. The battery is void.'
    - >-
      Do NOT stop early on a zero. The zero is the predicted outcome and its value
      comes from the whole grid, so every admitted cell is run and reported.
    - >-
      Stage 4 is NOT optional and is NOT conditional on stage 3 outcome. Reporting
      stage 3 without stage 4 is an invalidation, not a shortcut.
    - >-
      A cell exceeding 1 GiB peak resident memory STOPS the grid extension until
      the rank routine is fixed; that is an INFRASTRUCTURE stop and never
      mathematical evidence.
  invalidation_rules:
    - >-
      Running any cell that fails the |W| at least 10 times M_d screen INVALIDATES
      that cell. Cells are excluded BEFORE the run, never explained after.
    - >-
      Any code path building W that touches a summation polynomial INVALIDATES
      that cell.
    - >-
      Reporting an excess on W without the rationality-locus arm INVALIDATES the
      report.
    - >-
      Reporting an excess on W without the CURVE-FREE IMAGE NULL beside it
      INVALIDATES the report.
    - >-
      Describing any excess that the curve-free image null reproduces as a
      property of Semaev structure, of elliptic curves or of the ECDLP INVALIDATES
      the artifact making the statement.
    - >-
      Quoting a filter power inferred from s_d rather than measured by sampling,
      or quoted against a nominal rather than the MEASURED |W|, INVALIDATES it.
    - >-
      Describing a positive result as an algorithm or a speedup INVALIDATES the
      artifact: computing the vanishing space requires enumerating W at the same
      cost the compressed class exists to avoid.
    - >-
      Changing the screen, the persistence rule, the admitted-cell table or any
      forced control value after an outcome is seen INVALIDATES the battery.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the admitted-cell table is
    frozen with a sha256 before any cell runs and records M_d, |W| and the ratio
    per cell; (2) the planted positive returns exactly n minus b in every cell and
    the exact random null returns exactly 0 in every draw; (3) every admitted cell
    reports excess_d with its measured |W| and collision count; (4) the CURVE-FREE
    IMAGE NULL and the RATIONALITY LOCUS are measured and reported beside every
    real value; and (5) the four tail checks are complete and peak resident memory
    is reported per cell against the formula.
    SUCCESS IS BATTERY INTEGRITY, NOT A PARTICULAR EXCESS.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 INSTRUMENT DEAD: the planted positive misses n minus b.
    F2 BATTERY VOID: the exact random null returns nonzero excess.
    F3 NULL HYPOTHESIS FALSIFIED WITH ATTRIBUTION: excess_d at least 1 persisting
    across both bases, three subspace seeds and three increasing n, AND exceeding
    the curve-free image null. A target-independent low-degree dependency exists
    and its filter power becomes the priority measurement.
    F4 ATTRIBUTION DENIED: excess_d at least 1 but the CURVE-FREE IMAGE NULL
    reproduces it at matched parameters. The finding is about images of low-degree
    maps, NOT about elliptic curves, and every artifact must say so in its own
    words with no ECDLP or Semaev language anywhere.
    F5 COORDINATE ARTIFACT: excess in one basis only.
    F6 KNOWN DEPENDENCY REDISCOVERED: the rationality-locus arm accounts for the
    excess. An instrument calibration and nothing more.
    F7 MEMORY MODEL WRONG: peak resident memory exceeds the formula by more than
    25 percent. INFRASTRUCTURE, never mathematical evidence.
    F8 NULL HYPOTHESIS HOLDS: excess_d exactly 0 everywhere on the admitted grid.
    The low-degree compressed-filter class is closed over the tested cells with a
    named obstruction, an exact argument and forward guidance naming the surviving
    classes.
  artifact_package_directory: experiments/EXP-PFDR-b4a4b6/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/admitted-cells.yaml (the frozen table with M_d, required |W| and carrier bytes per cell, its sha256, and the excluded cells with reasons including n = 16 d = 5)'
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/excess.yaml (per cell: M_d, measured |W|, collision count, rank, s_d, excess_d, basis, seed, curve coefficients, curve order)'
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/controls.yaml (planted positive, exact random null with all 20 draws per cell, curve-free image null with its matched parameters, rationality locus)'
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/attribution.yaml (excess_d(W) minus excess_d(curve-free null) per cell, and an explicit statement of what the comparison licenses and forbids)'
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/filter-power.yaml (only where licensed: sampled rejection rate with its Clopper-Pearson interval, the ceiling from the MEASURED |W|, and the single most selective filter reported individually)'
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/resources.yaml (peak resident memory and wall time per cell against the formula)'
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/w-construction-audit.md (evidence that no summation polynomial appears on the W code path)'
    - 'experiments/EXP-PFDR-b4a4b6/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F8 fired; per-file sha256; the inference block; and an explicit statement of the enumeration cost that makes a positive a probe rather than an algorithm)'
  interpretation_limits:
    - >-
      A STRUCTURE PROBE, NOT AN ALGORITHM AND NOT AN ATTACK. Computing the
      vanishing space requires enumerating W at the very cost the compressed
      class exists to avoid; a positive result carries a named remaining
      obligation and any reader taking it as a speedup is reading past it.
    - >-
      Scoped to ordinary binary curves at n in {16, 20, 24}. It does not transfer
      to prime fields, to non-subspace factor bases, to other notions of
      compression, or to cryptographic scale.
    - >-
      A negative closes the LOW-DEGREE POLYNOMIAL compression class over the
      tested cells only, and is written with its named obstruction, argument and
      forward guidance rather than as an exhaustion claim.
    - >-
      Any excess the curve-free image null reproduces is NOT a statement about
      elliptic curves, and the design is arranged so this cannot be discovered
      after the fact.
    - >-
      Boolean degree is basis-dependent, so any positive is a statement about a
      basis until it is shown invariant.
    - >-
      Even a PERFECT low-degree filter at these cells is capped at n minus log2 of
      the measured |W|, only a few bits, so it would save a small constant factor
      and not an exponent; whether the power grows with n is the exponent
      question and three values of n cannot settle it.
    - >-
      NOVELTY IS NOT ADJUDICATED. The first-fall papers and the binary-field point
      decomposition preprint are the most likely locations of prior art and none
      was opened by any agent under this task.
  dominated_by: >-
    As an ATTACK: none is mounted, so every frontier row dominates on every axis
    -- Pollard rho, multi-target rho, BSGS, van Oorschot-Wiener, the generic
    preprocessing frontier, and every index-calculus row. As a STRUCTURAL
    MEASUREMENT of the reachable set: no prior record in this corpus measures it,
    so nothing dominates it internally; externally it may well be dominated by
    first-fall literature that no agent here has opened. As an INSTRUMENT: it is
    dominated by any exact algebraic derivation of the low-degree part of the
    vanishing ideal from the summation recursion, which is precisely what its
    forward guidance asks for. NOT NULL ON ANY AXIS.
  sota_delta: >-
    Zero on every ECDLP cost axis. Content delivered: the first measurement in
    this program of the low-degree algebraic structure of the descended reachable
    set, on a frozen admitted grid; an EXACT INTEGER null predicted from linear
    algebra rather than estimated; a planted positive of known magnitude
    demonstrating the instrument has power; a pre-registered two-sided
    discriminator between two named explanations with a persistence rule; and a
    CURVE-FREE IMAGE NULL that decides whether any excess is about curves at all.
  id_allocation_provenance: >-
    EXP-PFDR-b4a4b6 pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260829-57b1eb. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
