experiment:
  id: EXP-ICEX-146ff5
  hypothesis_id: H-ICEX-9e54c2
  question_id: RQ-ICEX-001
  source_proposal_id: IDEA-20260803-fa9839
  version: 1
  title: >-
    The arity threshold - a fully charged, calibration-gated closed-form comparison of
    point-decomposition index calculus against matched Pollard rho and BSGS, emitting the
    winning window W(m, omega) of decomposition-oracle exponents and the integer
    solving-degree table it induces for GOAL-SDEG-001, GOAL-DREG-001 and GOAL-SIG-001
  status: approved_execution_withheld
  status_enactment_note: >-
    Enacted 2026-08-08 by the Coordinator: DEC-20260806-e91b0f (2026-08-06)
    already states this experiment's status as approved_execution_withheld
    (unchanged, immutable, no successor spec written), and the status_note
    below already described exactly that condition in prose -- but the
    literal status: field still read plain 'approved', contradicting its own
    governing decision. Found during a survey for approved-but-unrun
    experiments to dispatch; this experiment was correctly excluded from
    that dispatch as a result of finding this gap, not despite it. Prior
    value: approved.
  status_note: >-
    APPROVED AS A FROZEN CONTRACT BY THE COORDINATOR UNDER TASK-20260806-cd81c5.
    APPROVAL OF A CONTRACT IS NOT AUTHORIZATION OF A RUN. See execution_authorization
    below - three preconditions are open and none of them is discharged by this file.
    The contract in force at any execution is the COMMITTED BLOB at the
    TASK-20260806-fb85f5 snapshot commit, never the working-tree file.
  execution_authorization:
    granted: false
    preconditions:
    - >-
      P1 INDEPENDENT RED-TEAM PASS. TASK-20260806-7e7ce3 reviews this contract in an
      independent session. An adverse finding - unrunnable dependency set, a calibration
      gate incapable of failing, or a materially omitted cost term - requires exactly one
      versioned protocol_amendment, itself snapshot-committed and independently
      re-reviewed, before any execution. A `completed` review carrying REVISE unblocks an
      Executor mechanically and the dispatcher cannot enforce this gate; it is stated here
      so the Coordinator does.
    - >-
      P2 GOAL BINDING UNRESOLVED. BATCH-156658/SCOPE-DECISION.md (owed to the ledger as
      DEC-20260805-bb162b) DECLINED to bind IDEA-20260803-fa9839 to GOAL-ECDLP-001 and
      routed it to GOAL-ICEX-001, whose next_action reads "NO ICEX MEASUREMENT
      AUTHORIZED" and defers "until charged SDEG/MONO/RELN measurement packages exist".
      That deferral is on MEASUREMENT and this contract performs none, but the reading is
      GOAL-ICEX-001's Coordinator's to make on its own record, preserving its own single
      next action. THIS FILE DOES NOT MAKE IT AND DOES NOT PRE-EMPT IT.
    - >-
      P3 REVISIT CONDITION R-D OF THE DECLINE IS THE REASON THIS CONTRACT EXISTS AND MUST
      BE ADJUDICATED, NOT ASSUMED. The decline named R-D - "the proposal is extended to
