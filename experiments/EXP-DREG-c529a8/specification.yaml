# EXP-DREG-c529a8
# Symmetric-group dimension sums. No Macaulay matrix.
# Approved by DEC-20261002-1d31cb.
experiment:
  id: EXP-DREG-c529a8
  hypothesis_id: H-DREG-9a3a25
  source_idea: IDEA-20260916-c38e50
  question_id: RQ-DREG-bd6c86
  version: 1
  title: Symmetric-group dimension sums
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-1d31cb
  objective: >-
    Sum the irreducible dimensions of S_4 and S_5 and compare the
    exact work factors with the written bounds.
  inputs:
    dims4: [1, 3, 2, 3, 1]
    sum_sq4: 24
    sum_cu4: 64
    max4: 3
    bound4: 192
    exact4: 216
    peak4: 64
    dims5: [1, 4, 5, 6, 5, 4, 1]
    sum_sq5: 120
    sum_cu5: 596
    max5: 6
    bound5: 2400
    exact_num5: 1728000
    exact_den5: 596
    exact5_above_2899: true
    exact5_below_2900: true
    peak5: 400
    two_divides_24: true
    two_divides_120: true
    ord3: 2
    square_gain_num: 9
    square_gain_den: 4
    exp_gain_above_3: true
    exp_gain_below_16_over_5: true
  controls:
    - >-
      An exact m = 5 work factor of 2400 is the bound, not the
      cube-sum quotient. That quotient is strictly above 2899 and
      strictly below 2900. Reporting 2400 as the exact factor
      invalidates the run.
    - >-
      An exact m = 4 factor of 192 is the bound. The cube-sum
      factor is 216. Reporting 192 as the exact factor invalidates
      the run.
    - >-
      A square sum other than the factorial is false. The S_4
      squares sum to 24 and the S_5 squares sum to 120. Reporting
      otherwise invalidates the run.
    - >-
      An odd value of 24 or 120 is false. Both are even, so
      characteristic 2 divides the group order. Reporting either
      odd invalidates the run.
    - >-
      A gain of 2.25 as the value of 9 over 2^1.58 is false. That
      power ratio is strictly above 3 and strictly below 16/5.
      The square ratio 9/4 is 2.25. Reporting them equal
      invalidates the run.
    - Two dimension routes. They must not import each other.
  independent_variables:
    - degree
    - route in {hooks, listed_sum}
  metrics:
    primary:
      - sum_cu5
      - exact5_sides
      - exact4
      - implementations_agree
    secondary:
      - peak5
      - exp_gain_sides
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The cube sum 596 and the exact factor sides.
    formula: >-
      The square sum of the irreducible dimensions equals m
      factorial. The exact work factor is m factorial cubed over
      the cube sum. The bound replaces the cube sum by m factorial
      times the largest dimension. The peak factor is the square
      of m factorial over that largest dimension.
    source: >-
      IDEA-20260916-c38e50 states the factors 192, 64, 2400 and
      400, read 2026-10-02. The dimension sums were computed in
      this design session. That computation is not a run. The
      exact m = 5 factor is not 2400. No matrix was built.
  scale_relevance:
    tier: toy
    justification: Two group-order sums. No transfer to a matrix rank.
    correspondence: null
  tail_checks:
    - The S_5 row is required. Stopping after S_4 and still reporting the cube sum 596 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other dimension route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the exact m = 5 factor is reported as 2400, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The exact m = 5 factor is reported as 2400.
    - The exact m = 4 factor is reported as 192.
    - A square sum is reported different from the factorial.
    - 24 or 120 is reported odd.
    - 9 over 2^1.58 is reported equal to 9/4.
    - A Macaulay matrix or a degree fall is reported.
  success_criterion: >-
    Both runs agree on the S_4 sums 24 and 64, the factors 192,
    216 and 64, the S_5 sums 120 and 596, the bound 2400, the
    peak 400, and the exact quotient strictly above 2899 and
    strictly below 2900. The exact m = 5 factor stays above the
    bound. Both factorials stay even.
  falsification_criterion: >-
    The runs agree, the exact m = 5 factor stays above 2899, the
    factorials stay even, and any sum differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-c529a8/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-c529a8/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-c529a8/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-c529a8/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-c529a8/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-c529a8/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Macaulay matrix, rank profile, or degree-fall measurement.
    - A claim that symmetrization preserves or destroys degree.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
