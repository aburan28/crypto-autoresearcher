# =============================================================================
# EXP-FROB-70ce69 — version 1, approved by DEC-20261006-e2ae0a.
# Frozen kernel-count for IDEA-20261005-1e54b5. The prediction is the triple
# (1, 1, 4). Any other triple on a model of this P(T) is a negative.
# No ECDLP exponent. No factor base at degree 131. No run in this design.
# The source idea is on origin/design/cycle-20261005-domain and is not copied.
# =============================================================================
experiment:
  id: EXP-FROB-70ce69
  hypothesis_id: H-FROB-cd38a5
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261005-1e54b5
  goal_id: null
  version: 1
  title: >-
    Kernel sizes of [2] on the order-19 genus-2 class over F_2, predicted
    (1, 1, 4) over F_2, F_4, and F_8
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    approved_by_role: coordinator
    composing_decision: DEC-20261006-e2ae0a
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the triple is (1, 1, 4), does not assert an ECDLP exponent
      improvement, and does not assert a factor base at degree 131.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide which completed outcome the 2048-pair enumeration supports. Success
    is at least one genus-2 model of P(T) = T^4 + 3T^3 + 5T^2 + 6T + 4 whose
    every hit has kernel triple (1, 1, 4), with the controls passing. A hit
    whose triple is anything else is a negative, so success can fail. Zero
    hits, with the controls passing, leaves the degree unmeasured.

  inputs:
    polynomial:
      P: T^4 + 3T^3 + 5T^2 + 6T + 4
      P_at_1: 19
      mod_2: T^2 (T^2 + T + 1)
    field: F_2
    model: y^2 + h(x) y = f(x)
    degree_bounds:
      h: at most 3
      f: at most 6
    pair_count: 2048
    enumeration_order: >-
      Lexicographic on the 4 coefficients of h and then the 7 coefficients of
      f, each coefficient in {0, 1}, low degree first. Seed 0 names this
      order. It is not a pseudorandom draw. Visiting a count other than 2048
      invalidates the run.
    point_count_convention:
      source: experiments/EXP-FROB-7d51ae/implementation/hyperelliptic.py
      affine: >-
        Over F_{2^k}, for each x let b = h(x) and c = f(x). If b = 0 there
        is exactly one y, because squaring is bijective. If b ≠ 0, set
        z = y/b and solve z^2 + z = c/b^2; there are two solutions when the
        absolute trace of c/b^2 is 0, and none otherwise.
      infinity: >-
        If deg h = 3, add two points at infinity. Otherwise add one. This is
        the convention in the opened helper. Do not substitute another.
      curve_counts: >-
        N1 is the point count of the curve over F_2, including infinity.
        N2_curve is the point count over F_4, including infinity. N2_curve
        is not the kernel size.
    characteristic_polynomial:
      formula: >-
        a1 = N1 - 3. a2 = (N2_curve - 5 + a1^2) / 2, and a2 must be an
        integer. The polynomial is T^4 + a1 T^3 + a2 T^2 + 2 a1 T + 4.
        The Jacobian order over F_2 is (N1^2 + N2_curve) / 2 - 2, and that
        integer must equal 5 + 3 a1 + a2.
      identity_at_6_6: >-
        Before any curve is counted, substitute N1 = 6 and N2_curve = 6.
        The formula must return a1 = 3, a2 = 5, the polynomial P, and order
        19. If it does not, the run is invalid.
    hit: >-
      A pair is a hit when N1 = 6, N2_curve = 6, the characteristic
      polynomial equals P, and the Jacobian order formula equals 19. Every
      hit is kept. A split of kernel triples across hits is reported as a
      split and is the negative.
    kernel:
      name: n2(F_{2^k})
      meaning: >-
        The number of points Q of the Jacobian over F_{2^k} with 2Q equal
        to the identity, for k = 1, 2, 3. This is the kernel size, not the
        number of elements of order exactly 2, except that size 4 is the
        identity plus three points of order 2.
      representation: >-
        Reduced Mumford representatives (u, v) over F_{2^k}[x], u monic of
        degree at most 2, deg v < deg u, satisfying v^2 + h v + f ≡ 0 mod u,
        plus the identity. The F_2 case of this filter is in the opened
        helper. Extend the same congruence to F_4 and F_8. Do not copy a
        stored hit list from EXP-FROB-7d51ae.
      group_law: >-
        Cantor composition and reduction in characteristic 2. Doubling is
        Q+Q. A point is in the kernel when the reduced sum is the identity.
      order_check: >-
        Let C be the companion matrix of P whose characteristic polynomial
        is P, so det(x I - C) = P(x). The predicted order over F_{2^k} is
        det(I - C^k), in exact integer arithmetic. For k = 1 this equals
        P(1) = 19, and that equality is checked before any curve is counted.
        On each hit, the number of enumerated Mumford points over F_{2^k}
        must equal det(I - C^k) for k = 1, 2, 3. A mismatch means the
        enumerator is broken. The kernel sizes are then not read, and the
        run is invalid.
    elliptic_control:
      models: >-
        All a1, a2, a3, a4, a6 in F_2 for
        y^2 + a1 x y + a3 y = x^3 + a2 x^2 + a4 x + a6.
        A model is kept when it has no affine point at which both partial
        derivatives vanish. Partial with respect to x is a1 y + x^2 + a4.
        Partial with respect to y is a1 x + a3. In characteristic 2 the
        derivative of y^2 is 0 and the derivative of x^2 is 0.
      expected_orders: [1, 2, 3, 4, 5]
      rule: >-
        The set of #E(F_2) among kept models, counting the point at
        infinity, must equal {1, 2, 3, 4, 5}. On the lexicographically
        first kept model of each order, count points P with 2P equal to
        the identity by the chord-and-tangent law. Orders 2 and 4 must
        each have kernel size greater than 1. Orders 1, 3, and 5 must
        each have kernel size 1.
    seeds: [0]
    forbidden:
      - Do not claim an ECDLP exponent improvement.
      - Do not construct a factor base at degree 131.
      - Do not treat a result here as a statement about dimension 5, dimension 6, or the norm-one torus of dimension 48.
      - Do not copy a stored genus-2 hit list in place of the enumeration.
      - Do not change the infinity convention or the characteristic-polynomial formula after seeing a kernel size.
      - Do not score a kernel size when the elliptic control failed.

  controls:
    - id: polynomial
      statement: >-
        P(1) is recomputed as 19, P modulo 2 is recomputed as
        T^2 (T^2 + T + 1), the (6, 6) substitution returns P, and
        det(I - C) equals 19, before any curve is counted.
      pass_condition: all four identities hold
      on_fail: The run is invalid. No kernel size is read.
    - id: even-order-elliptic
      statement: >-
        At least the classes of order 2 and 4 show a rational kernel of
        [2] of size greater than 1.
      pass_condition: n2(F_2) > 1 on the first model of order 2 and of order 4
      on_fail: >-
        The instrument cannot see rational 2-torsion. The run is invalid.
        No surface kernel size is read.
    - id: odd-order-elliptic
      statement: >-
        A class of order 1, 3, or 5 has kernel size 1 over F_2.
      pass_condition: n2(F_2) = 1 on the first model of each of those orders
      on_fail: >-
        The counter invents 2-torsion. The run is invalid. No surface
        kernel size is read.
    - id: jacobian-order
      statement: >-
        On each hit the enumerated Jacobian over F_2 has size 19, and the
        sizes over F_4 and F_8 equal det(I - C^k).
      pass_condition: the three enumerated orders match the companion formula
      on_fail: The enumerator is broken. The run is invalid.

  independent_variables:
    - the pair (h, f), all 2048 of them, in lexicographic order
    - the extension degree k in {1, 2, 3} at which the kernel is counted
    - the elliptic order in {1, 2, 3, 4, 5}, as the control arm

  metrics:
    primary:
      - id: kernel_triple
        statement: >-
          For each hit, the triple (n2(F_2), n2(F_4), n2(F_8)). The
          prediction is (1, 1, 4). Any other triple is the negative.
      - id: hit_count
        statement: >-
          The number of pairs whose curve counts are (6, 6) and whose
          characteristic polynomial equals P. Zero is the unmeasured outcome.
    secondary:
      - id: per_hit_models
        statement: The coefficient bits of h and f for every hit.
      - id: enumerated_orders
        statement: >-
          For each hit and each k in {1, 2, 3}, the number of Mumford
          points and det(I - C^k).
      - id: elliptic_kernel
        statement: n2(F_2) on the first kept model of each order in {1, 2, 3, 4, 5}.
      - id: elliptic_orders_seen
        statement: The set of point counts of the kept elliptic models.
      - id: polynomial_identities
        statement: P(1), P modulo 2, and the (6, 6) characteristic polynomial.
      - id: pairs_visited
        statement: Must equal 2048.

  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 is the identification of T^2 + T + 1 with Frobenius on A[2]^et.
    A triple other than (1, 1, 4) falsifies it on this class. A kernel
    larger than 4 falsifies H2. Neither is an exponent result. Zero hits
    falsifies neither.

  preregistered_prediction:
    quantity: >-
      The kernel triple (n2(F_2), n2(F_4), n2(F_8)) on every genus-2 model
      of this P(T) in the 2048-pair list.
    formula: >-
      The triple equals (1, 1, 4). Any other triple is the negative. The
      hit count is a separate integer: zero means the degree is unmeasured.
      No numeral for the hit count is written here. The executor measures it.
    source: >-
      The triple is copied from IDEA-20261005-1e54b5 before any run of
      EXP-FROB-70ce69. The point-count formulas are the ones in the opened
      file experiments/EXP-FROB-7d51ae/implementation/hyperelliptic.py,
      checked at (N1, N2_curve) = (6, 6) against P. The Mumford level-structure
      sentence is provenance recalled and is not this formula.

  scale_relevance:
    tier: toy
    justification: >-
      The tested object is one isogeny class over F_2 of order 19. A result
      here is not a result at degree 131, not a result in dimension 5 or 6,
      and not an exponent. No extrapolation is authorized.
    correspondence: >-
      Direct enumeration of the 2048 models. No Deuring correspondence and
      no sampling equivalence to a larger field is used.

  tail_checks:
    - >-
      There is no smoothness tail. The extreme check is the hit whose kernel
      size over F_8 is farthest from 4, and the elliptic class of even order
      whose kernel size is closest to 1. Report those. A single odd kernel
      size on one hit is already the negative. The all-hits rule still decides.

  replication:
    seeds:
      - name: lex-coeff
        algorithm: coefficient order described in inputs.enumeration_order
        seed: [0]
        note: >-
          One exhaustive pass. Adding a second scientific enumeration order
          is a protocol amendment. Seed 0 does not draw a sample.
    independent_instances: 1
    independent_instances_note: >-
      One complete finite list. The elliptic control is not a second surface instance.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not change the 2048 pairs.
      maximum_runs is 2 so one infrastructure retry may take a new run id.
      Watch expiry is failed_infrastructure, never a negative mathematical result.

  procedure:
    identities: >-
      Recompute P(1), P modulo 2, the (6, 6) characteristic polynomial, and
      det(I - C). Stop as invalid if any identity fails.
    pairs: >-
      Visit all 2048 pairs in the frozen order. Record the count visited.
    counts: >-
      For each pair compute N1 and N2_curve with the frozen affine and
      infinity rules. Apply the characteristic-polynomial formula. Keep the
      hits.
    kernels: >-
      On each hit, enumerate Mumford points over F_2, F_4, and F_8, check
      the three orders against det(I - C^k), and count points with 2Q equal
      to the identity. If an order mismatches, stop as invalid and do not
      emit a triple.
    elliptic: >-
      Enumerate the 32 Weierstrass coefficient tuples. Keep the nonsingular
      models. Record the set of orders. On the first model of each order in
      {1, 2, 3, 4, 5}, count the kernel of [2]. If the set of orders is not
      exactly that set, or a control inequality fails, stop as invalid.
    mechanism_assignment:
      - observation: >-
          The polynomial identities hold, 2048 pairs were visited, the
          elliptic controls pass, the Jacobian orders match, hit_count is
          at least 1, and every hit has triple (1, 1, 4).
        assigns_to: >-
          The prediction holds on this class. The level-structure degree
          read from the jump is 3. This is not an exponent and not a
          factor base.
      - observation: >-
          The same controls pass, hit_count is at least 1, and at least one
          hit has a triple other than (1, 1, 4).
        assigns_to: >-
          Negative. H1 is false for this class, or H2 is false if a kernel
          exceeds 4. The observed triple is the datum. Success does not hold.
      - observation: >-
          The same controls pass and hit_count is 0.
        assigns_to: >-
          No genus-2 model of this P(T) in the 2048-pair list. The kernel
          triple is unmeasured. This is not success and not the negative.
      - observation: >-
          An identity fails, the pair count is not 2048, an elliptic
          control fails, or an enumerated Jacobian order disagrees with
          det(I - C^k).
        assigns_to: >-
          Invalid. Not evidence for either reading of the triple.
      - observation: >-
          The watch expires, a dependency is missing, or the process crashes.
        assigns_to: >-
          failed_infrastructure. Not evidence.

  stopping_rules:
    - Stop when every hit has a triple, or when hit_count is 0 after the full list, or when an invalid row fires.
    - Do not add pairs outside the 2048, another field, or a degree-131 factor base.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing dependency is failed_infrastructure and is not evidence against the hypothesis.
    - Reading a surface kernel size after a failed elliptic control invalidates the run.
    - Using an infinity convention other than the frozen one, or editing the characteristic-polynomial formula after seeing a triple, invalidates the run.
    - Reporting success when any hit has a triple other than (1, 1, 4) invalidates the run.
    - Copying a stored hit list from EXP-FROB-7d51ae in place of the enumeration invalidates the run.

  success_criterion: >-
    The run is a success for the prediction exactly when the first row of
    mechanism_assignment holds: every hit has kernel triple (1, 1, 4). Any
    other completed assignment is not this success. The second row is a
    negative, so success can fail. The third row is not success either.

  falsification_criterion: >-
    The prediction is falsified when the second row holds: a model of this
    P(T) has a kernel triple other than (1, 1, 4). A kernel larger than 4
    is included in that negative and also falsifies H2. The third row
    falsifies nothing. The fourth and fifth rows falsify nothing.

  required_artifacts:
    - experiments/EXP-FROB-70ce69/runs/RUN-*/manifest.yaml
    - experiments/EXP-FROB-70ce69/runs/RUN-*/stdout.txt
    - experiments/EXP-FROB-70ce69/runs/RUN-*/stderr.txt
    - experiments/EXP-FROB-70ce69/runs/RUN-*/raw-result.json
    - experiments/EXP-FROB-70ce69/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      The four polynomial identities, pairs_visited, every hit as
      coefficient bits with N1, N2_curve, the kernel triple, the enumerated
      orders, det(I - C^k), the elliptic orders seen, and the five elliptic
      kernel sizes.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row. It
      does not change hypothesis status. It does not claim an exponent.

  assigned_to: executor
  zero_runs_in_design: true
