experiment:
  id: EXP-SCR-002
  hypothesis_id: H-SCR-002
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    SOURCE-LOCATOR-OPEN repaired admission sheet: deterministic static
    admission audit against the frozen P1552/P1553 six-list frontier
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-27'
  source_proposal: IDEA-20260723-004
  claim_tier: toy
  claim_tier_basis: >-
    This is a pure read-and-adjudicate audit: zero compute beyond table
    construction, no sampling, no curve arithmetic. The repaired sheet is
    scale-independent in form (static requirements over committed records
    with symbolic exponent arithmetic), but its conclusion is scope-bounded
    to the checked SOURCE-LOCATOR-OPEN interface material; per AGENTS.md
    rule 6 a zero-admissible table closes only the exact checked scope and
    proves no lower bound. Tier is recorded as toy because the audit rests on
    toy-tier prior evidence and authorizes no medium or cryptographic claim
    in either direction.
  objective: >-
    Apply the frozen repaired admission sheet (requirements R1-R7 below)
    mechanically to the 7 frozen audit items, producing a complete
    requirement-by-item admissibility matrix. Decide: zero admissible
    operations (success; scoped sheet failure supported, first failure at
    requirement_1) versus at least one operation passing R1-R7 with lambda,
    mu at most 0.45 and one fresh query inside B^(5/4+o(1)) (falsification;
    record the operation as an unfiled theorem candidate). This is design
    only: execution is deferred to a separate Executor task after approval.

  inputs:
    corpus_snapshot:
      pinned_commit: b8af1551e45fbe4435745239d29f4d141eea3356
      verification_rule: >-
        The audit reads git blob content at the pinned commit (git cat-file),
        never the working tree. At run start the executor materializes
        corpus_manifest.json mapping every path below to its expected git
        blob SHA-1 (from this manifest) and to the SHA-256 of the blob
        content actually read; any missing path or hash mismatch invalidates
        the run (corpus integrity control).
      hash_manifest:
        - {path: ledger/proposals/IDEA-20260723-003.yaml, git_blob_sha1: 3832f30c26417e2d00695613e856d3c88b567bb0}
        - {path: ledger/proposals/IDEA-20260723-004.yaml, git_blob_sha1: 770b9da7fd6dace2e9dbba9905d4b20c6014f652}
        - {path: ledger/evidence/EV-CRYPTO-002.yaml, git_blob_sha1: efb66d5df4703aadd48e370b5f2e7a89709120c8}
        - {path: ledger/evidence/EV-CRYPTO-005.yaml, git_blob_sha1: 8d63dba2aedaf585119b2ccc2464374306a18877}
        - {path: ledger/evidence/EV-CRYPTO-006.yaml, git_blob_sha1: 04b94a980cc8520353d1486de9c9cebe53f4a225}
        - {path: ledger/decisions/DEC-20260723-004.yaml, git_blob_sha1: 9abce21fe37dfe6625a4db57ceac6265ebc15a85}
        - {path: ledger/decisions/DEC-20260724-004.yaml, git_blob_sha1: ca44b24ab6fba678c7568977fb70f614a46089f4}
        - {path: knowledge/INDEX.md, git_blob_sha1: ab1da88b80f870bb8f9d23a54bf64352dab4172e}
        - {path: knowledge/open-problems/KN-OPEN-005.md, git_blob_sha1: ba29ca70b62ac1e9e7f8061dc15aa5594a5f18a3}
        - {path: knowledge/techniques/KN-TECH-005.md, git_blob_sha1: 2d07572a7e56ee0d50465022a887b06d58a68d5a}
        - {path: knowledge/literature/KN-LIT-011.md, git_blob_sha1: 981953514f3fc6e40d6f9ce6468b5d26c9c36772}
        - {path: ideas/reviews/P1552_MECHANISM_FRONTIER_20260718.md, git_blob_sha1: 69cc833aa010cc08e2c5d84b448caa3cbd387c3a}
        - {path: ideas/artifacts/ECDLP-IDEA-012/p1553_six_list_incidence_model_gate.md, git_blob_sha1: cd0290769a0e19be1fb247a1ff0fe5adcc5377a1}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-002/tasks/TASK-20260723-201/admission_report.yaml, git_blob_sha1: e0b047267d9eea6dcc96c75936205c151e4c272d}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-002/tasks/TASK-20260723-201/constructor_admission.md, git_blob_sha1: 27989596959a0a2b81a6fdd267d4c332432bb564}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-005/tasks/TASK-20260723-501/candidate_report.yaml, git_blob_sha1: f8f0f1134c662861e2d8fb05b59604f59cae0286}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-005/tasks/TASK-20260723-501/mechanism_note.md, git_blob_sha1: c8e54b03279d6998d190e1e31da6e5ad6575a820}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-005/tasks/TASK-20260723-503/red_team_report.yaml, git_blob_sha1: ce7227d2d9dd4792713a78214a9e38fc3d4296b7}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-005/tasks/TASK-20260723-503/falsification_review.md, git_blob_sha1: e067cd98fe117dddbec26c18052f744fa9473cc4}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-006/tasks/TASK-20260723-601/admission_report.yaml, git_blob_sha1: bd200a835907c675fedf319f79e58090b309dbef}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-006/tasks/TASK-20260723-601/source_locator_admission.md, git_blob_sha1: f4b305934c0c1c5ac68946bf6edc8844637bb646}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-006/tasks/TASK-20260723-603/red_team_report.yaml, git_blob_sha1: a950b257bfde53b9f3e8f212eb8a8af46f351c6d}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-006/tasks/TASK-20260723-603/admission_review.md, git_blob_sha1: 834f0fe0a16aca7090163e9cccc554005915bf36}
    external_references:
      rule: >-
        No external retrieval is performed; the only external anchor is the
        pinned knowledge record KN-LIT-011 (Shoup EUROCRYPT 1997) inside the
        snapshot. Any voluntary re-retrieval is informational only, must be
        pinned by URL, version, retrieval date, and content hash in the run
        manifest, and may not change any verdict.
      items: []
    audit_item_index:
      items:
        - {id: I1, name: supplied_residue_source_scalar_or_B3_provenance, expected_rejection_basis: hidden_input}
        - {id: I2, name: compact_z_R_resultant_common_factor_or_source_dictionary, expected_rejection_basis: renamed_IDEA-20260723-001_interface}
        - {id: I3, name: unnamed_zero_minor_or_hyperplane_signature_locator, expected_rejection_basis: free_oracle}
        - {id: I4, name: target_fitted_coefficients_or_hidden_advice, expected_rejection_basis: target_dependent_leakage}
        - {id: I5, name: determinant_pair_wedge_or_Abel_endpoint_zero_test, expected_rejection_basis: exact_predicate_for_supplied_sources_not_a_locator}
        - {id: I6, name: direct_source_labelled_3_plus_3_separator, expected_rejection_basis: explicit_generic_baseline_not_semantically_distinct_costs_B3}
        - {id: I7, name: current_explicit_six_list_source_labelled_campaign_control, expected_rejection_basis: work_and_memory_exponent_0.60_fresh_query_0.60}
      item_count: 7
    frozen_admission_sheet:
      asymptotic_regime:
        subgroup_order: N
        factor_scale: B = N^(1/5)
        beta_in_N: 0.20
        exponent_convention: >-
          All exponents are in N and absorb poly(log(N)) factors only; field,
          group, and bit operations and memory traffic keep their
          polynomial-log conversion factors. B^(9/4) = N^0.45,
          B^(5/2) = N^0.50, B^3 = N^0.60, B^(5/4) = N^0.25.
      R1_explicit_semantically_distinct_operation: >-
        The item supplies a new public operation with typed inputs, outputs,
        coefficient provenance, subset semantics, and exact signed occurrence
        output. Direct 3+3 matching is the known generic control; a
        determinant/pair-wedge form is a supplied-tuple predicate; a
        product/common-factor or zero-minor route is an excluded interface or
        an unnamed oracle; an open exception is not an operation. Else fail
        at requirement_1_explicit_semantically_distinct_operation.
      R2_O1_GGM_simulator_exclusion: >-
        Mandatory. The item must exhibit an exact target-dependent transcript
        -- relation_mode: (target occurrence j; signed factor occurrences
        (i_1,s_1),...,(i_5,s_5); public certificate sum_h s_h*A_(h,i_h)=R_j);
        fresh_mode: (fresh masked target tag; signed factor occurrences
        (i_1,s_1),...,(i_5,s_5); public certificate
        sum_h s_h*A_(h,i_h)=Q+[t]P) -- and show that no O(1)-overhead
        generic-group simulator with the same public inputs, preprocessing,
        advice, and charged backends can reproduce it. A supplied-tuple
        determinant/wedge zero bit is equivalent to a group-sum equality and
        is reproduced with O(1) generic group operations; merely reading
        coordinates or writing a target-dependent aggregate does not prove
        separation. Missing candidate transcript: fail_independently at R2.
      R3_subset_stable_occurrence_replay: >-
        The item provides an exact yes/no restricted-existence call
        Exists(S_1,...,S_k;R) on occurrence-labelled rectangular subsets
        (k=6 known-log campaign, k=5 fixed fresh target), preserving
        duplicate labels, colours, signs, and exceptional strata, with
        deterministic depth-first replay (at most 1+2*s*D_k calls,
        D_k = sum_h ceil(log2(|S_h|)) = O(log B)) and every root, child,
        empty sibling, rebuild, output, and verification call charged.
        Supplying a residue, source, scalar, source dictionary, or B^3
        provenance assumes the missing inverse and is rejected.
      R4_rank_yield_and_rejected_batch_charge: >-
        Deterministic proof that every accepted batch has rank at least
        rho_star = Theta(B) over the actual factor columns (then
        eta_rank = 0), or a proved tail Pr[rank >= rho_star] >=
        N^(-eta_rank+o(1)) over the frozen deck and target distribution with
        rejected batches fully charged (relation location, replay, misses,
        ambiguity, row verification, rank computation, deck rebuilds,
        discarded state). If neither is proved: r = 0, eta_rank unknown, and
        admission fails; expected Theta(B) rows are not a rank theorem.
      R5_restricted_calls_and_live_state: >-
        The item enumerates and charges every restricted call, coefficient or
        data-structure rebuild induced by restriction, target-dependent
        translation, miss, traversal frontier, source-label and sign output,
        and exact group-equality verification at each positive leaf; live
        state covers the depth-first stack O(log B) descriptors, the current
        source tuple (at most six occurrence labels, signs, points), all
        candidate preprocessing and source sidecars, the relation matrix of
        Theta(B) constant-weight verified rows, and any cached restrictions,
        dictionaries, ambiguity lists, or replay tables.
      R6_fresh_scalar_blind_query: >-
        One fresh scalar-blind masked target completes online within
        B^(5/4+o(1)) = N^(0.25+o(1)) including target-dependent setup,
        misses and retries, every restricted replay call, occurrence-level
        output, ambiguity and sign/orientation handling, unmasking, and the
        final public group-equality verification, using the same source
        inverse as the known-log campaign.
      R7_complete_threshold_and_baseline: >-
        With the frozen derived terms c_rel = max(q_rel, q_rel_replay+o_rel,
        o_rel); L_rel = max(0, beta-r) + delta_rel + eta_rank + c_rel;
        tau = delta_t + u_t + max(q_t, q_t_replay+o_t, o_t);
        lambda = max(a, L_rel, ell, tau, beta, b_w);
        mu = max(a_m, q_rel_m, beta, ell_m, m_replay, m_output, b_m):
        admission requires 0 <= r <= o_rel, eta_rank = 0 only with a
        deterministic rank guarantee, tau <= 0.25, lambda <= 0.45, and
        mu <= 0.45. Unknown terms are admission failures, not zeros. Any
        lambda > 0.45, mu > 0.45, or fresh-query violation fails; the 0.50
        Pollard-rho exponent is only the baseline and creates no admissible
        (0.45, 0.50] interval.
      verdict_rule: >-
        ADMIT only if R1-R7 all pass. Every rejected item receives
        independent per-requirement statuses (fail at first failure,
        fail_independently for the rest) and a named rejection basis.
        Undecidable predicates yield undecidable_with_reason, never a silent
        verdict.
    calibration_fixtures:
      - id: CAL-PASS-SCR-002
        kind: must_pass
        synthetic_fixture: true
        expected_verdict: ADMIT
        description: >-
          Synthetic typed source-locator fixture with an explicit operation,
          a frozen transcript certified non-O(1)-simulable by its own proof
          sketch, deterministic rank guarantee (r = 0.20, eta_rank = 0),
          fully enumerated replay schedule, tau = 0.25, and lambda = mu =
          0.44 with every term assigned. It exists only to prove the sheet
          can emit ADMIT; it is excluded from the corpus admissibility
          matrix and is not evidence about H-SCR-002.
      - id: CAL-FAIL-SCR-002
        kind: must_fail
        synthetic_fixture: false
        expected_verdict: >-
          fail at R1 with independent fail at R2 (supplied-tuple predicate,
          O(1)-simulable)
        description: >-
          The determinant/pair-wedge/Abel-endpoint zero test of item I5, run
          through the sheet first; it must fail R1 as an exact predicate for
          supplied sources and fail R2 independently as O(1)-overhead
          generic-group simulable.

  controls:
    - id: CTRL-CORPUS-INTEGRITY
      method: >-
        Every audited path is pinned to commit
        b8af1551e45fbe4435745239d29f4d141eea3356 with the embedded hash
        manifest; the run reads git blob content and records SHA-256 per file
        in corpus_manifest.json.
      pass_condition: zero missing paths and zero hash mismatches.
    - id: CTRL-SHEET-CALIBRATION
      method: >-
        Run the frozen sheet on CAL-PASS-SCR-002 and CAL-FAIL-SCR-002 before
        any corpus item is adjudicated.
      pass_condition: >-
        CAL-PASS-SCR-002 receives ADMIT and CAL-FAIL-SCR-002 fails at R1 with
        an independent R2 failure; any other outcome invalidates the run
        (instrument failure, not a scientific result).
    - id: CTRL-DEDUP-PRIOR-NEGATIVES
      method: >-
        Every rejected item must carry its named rejection basis matching the
        pinned BATCH-006 excluded_nonconstructors list or the named explicit
        control, including the EV-CRYPTO-002 z_R closure for item I2.
      pass_condition: 100 percent rejection-basis coverage over rejected items.
    - id: CTRL-THRESHOLD-RECOMPUTATION
      method: >-
        Recompute the exponent arithmetic B^(9/4) = N^0.45, B^(5/2) = N^0.50,
        B^3 = N^0.60, B^(5/4) = N^0.25 and the lambda/mu aggregates for the
        named explicit control (I7) symbolically inside the run.
      pass_condition: >-
        recomputed exponents match the frozen sheet; the named control fails
        R6 and R7 with certifiable work exponent at least 0.60.
    - id: CTRL-REPLAY-DETERMINISM
      method: Apply the frozen sheet twice over the full item index.
      pass_condition: byte-identical requirement matrices on both passes.

  independent_variables:
    - audit_item_id: the 7 frozen audit items (I1-I7).
    - calibration_fixture_id: the 2 frozen calibration fixtures.
    - sheet_requirement: R1 through R7 of the frozen repaired sheet.

  metrics:
    primary:
      - admissible_operation_count: number of items with verdict ADMIT; success requires exactly 0.
      - requirement_matrix: 7 items x 7 requirements with independent per-requirement statuses; must be complete.
      - first_failed_requirement_per_item: the requirement id at which each rejected item first fails; expected requirement_1 for items presenting no typed operation.
      - calibration_accuracy: fraction of the 2 calibration fixtures receiving their pre-declared verdicts; must be exactly 1.0 before corpus verdicts are read.
    secondary:
      - lambda_mu_recomputation: symbolic lambda/mu aggregates for the named explicit control (I7) and for any admitted item.
      - unknown_exponent_term_count: terms left unassigned per item; each must be counted as an admission failure, never zero.
      - rejection_basis_coverage: fraction of rejected items with a named basis; must be exactly 1.0.
      - undecidable_items: count and reasons; must be 0 for success.
      - corpus_hash_mismatch_count: must be 0.
      - wall_clock_and_memory_per_stage.

  heuristic_under_test: null
  preregistered_prediction:
    quantity: admissible_operation_count over the 7 frozen audit items
    formula: >-
      count of items passing R1 and R2 and R3 and R4 and R5 and R6 and R7,
      with lambda <= 0.45, mu <= 0.45, tau <= 0.25, and no unassigned
      exponent term.
    source: >-
      Scoped sheet-failure claim of IDEA-20260723-004 as recorded in the
      pinned BATCH-006 admission report and EV-CRYPTO-006 (first failure
      requirement_1_explicit_semantically_distinct_operation); thresholds
      from KN-TECH-005 / KN-LIT-011 and the Corrigan-Gibbs-Kogan preprocessing
      tradeoff recorded in KN-TECH-005 (KN-LIT-013).
  scale_relevance:
    tier: toy
    justification: >-
      The sheet requirements and exponent arithmetic are static and
      scale-independent in form, but the conclusion is scope-bounded to the
      checked frozen interface material and rests on toy-tier prior evidence;
      no medium or cryptographic claim is authorized in either direction.
    correspondence: null
  tail_checks:
    - >-
      Dual-pass consistency: the sheet is applied twice over all 7 items;
      any status flip between passes is recorded and invalidates the run.
    - >-
      Interval check: any item scoring lambda or mu in (0.45, 0.50] is
      recorded as failing R7 explicitly (no intermediate admissible
      interval), per the frozen sheet and the BATCH-005 red-team repair.

  replication:
    seeds: []
    seed_policy: deterministic audit, no randomness.
    independent_instances: 7
    independent_instances_note: >-
      The 7 frozen audit items are the distinct candidate operation routes
      adjudicated (six excluded nonconstructors plus the named explicit
      control); the sheet and snapshot are fixed.
    planned_runs:
      - id: RUN-SCR-002-A
        purpose: >-
          Materialize and verify the corpus hash manifest; run the two
          calibration fixtures through the frozen sheet; run the
          threshold-recomputation control; abort as invalid if calibration
          is not 2/2.
      - id: RUN-SCR-002-B
        purpose: >-
          Adjudicate R1-R4 over all 7 items with independent per-requirement
          statuses, rejection bases, and the dedup control.
      - id: RUN-SCR-002-C
        purpose: >-
          Adjudicate R5-R7 over all 7 items, run the determinism replay,
          emit the requirement matrix, the first-failed-requirement table,
          and the admission decision table.
    expected_run_count: 3

  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 3900
    total_cpu_hours: 1.1
    maximum_memory_gb: 4
    maximum_runs: 3
    stages:
      - id: freeze_calibrate_recompute
        wall_clock_seconds: 900
        stop_rule: >-
          Stop and mark the run invalid if the corpus manifest mismatches, if
          either calibration fixture misses its pre-declared verdict, or if
          the threshold recomputation disagrees with the frozen sheet.
      - id: adjudicate_r1_to_r4
        wall_clock_seconds: 1500
        stop_rule: >-
          Stop with the run inconclusive (not negative) if any item's
          requirement status cannot be decided from the pinned record; record
          undecidable_with_reason for that item.
      - id: adjudicate_r5_to_r7_and_aggregate
        wall_clock_seconds: 1500
        stop_rule: >-
          Stop without issuing a verdict if any required artifact
          (requirement matrix, corpus manifest, calibration receipt) is
          incomplete.

  stopping_rules:
    - Stop after the three planned runs; no exploratory fourth run and no new audit items without a versioned amendment.
    - Zero compute beyond table construction: no fixtures, no curve execution, no sampling.
    - >-
      A crash or tooling failure is recorded as failed_infrastructure and is
      evidence for nothing (AGENTS.md rule 5).
    - Stop at 3900 total wall-clock seconds, 1.1 CPU-hours, or 4 GB resident memory.
  invalidation_rules:
    - Any run missing its manifest, exact command, environment, stdout, stderr, or raw machine-readable requirement matrix is invalid.
    - Any corpus hash mismatch or missing corpus path invalidates the run.
    - Calibration accuracy below 2/2 or a failed threshold recomputation invalidates the run (sheet unsound as instrumented).
    - Non-identical requirement matrices across the two determinism passes invalidate the run.
    - An incomplete matrix (fewer than 7 items x 7 requirements) is invalid unless every missing cell is recorded undecidable_with_reason, in which case the run is inconclusive rather than invalid.
    - >-
      A zero-admissible matrix or a matrix with a passing operation is a
      scientific outcome, never an invalidation.
  success_criterion: >-
    The frozen repaired sheet applied mechanically to the frozen corpus
    yields a complete 7 x 7 requirement matrix with zero admissible
    operations (scoped sheet failure supported), requirement_1 recorded as
    the first failure for every item presenting no typed operation, 100
    percent rejection-basis coverage, the threshold recomputation confirming
    the named explicit control fails R6/R7, calibration at 2/2, and corpus
    integrity verified.
  falsification_criterion: >-
    At least one frozen item passes R1-R7 with lambda <= 0.45, mu <= 0.45,
    and one fresh scalar-blind query inside B^(5/4+o(1)): the sheet-failure
    claim is refuted and the passing operation must be recorded with its
    typed interface, transcript, rank guarantee or tail, replay schedule, and
    complete cost ledger as an unfiled theorem candidate.

  required_artifacts:
    - experiments/EXP-SCR-002/specification.yaml
    - experiments/EXP-SCR-002/sheet/apply_sheet.py
    - experiments/EXP-SCR-002/sheet/calibration_receipt.json
    - experiments/EXP-SCR-002/corpus_manifest.json
    - experiments/EXP-SCR-002/requirement_matrix.json
    - experiments/EXP-SCR-002/admission_decision.json
    - experiments/EXP-SCR-002/runs/RUN-SCR-002-A/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-002/runs/RUN-SCR-002-B/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-002/runs/RUN-SCR-002-C/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-002/analysis.md
    - experiments/EXP-SCR-002/execution-report.yaml
    - ledger/hypotheses/H-SCR-002.yaml

  assigned_to: executor
  inference_receipt:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
