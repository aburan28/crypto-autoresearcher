# EXP-OAKLEY-d36694
# Subfield membership of the two Oakley b values, plus the written tenths.
# Approved by DEC-20261001-05625b.
experiment:
  id: EXP-OAKLEY-d36694
  hypothesis_id: H-OAKLEY-2bd379
  source_idea: IDEA-20260922-70a67c
  question_id: RQ-OAKLEY-264353
  version: 1
  title: Oakley subfield test and written degree bounds
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-05625b
  objective: >-
    On both Oakley fields, check that b^{2^p}, b^{32}, and b^2 differ from
    b. Check 5! = 120, that 2^{20} squared is 2^{40}, and that the written
    tenths subtract to 389 and 484 with 400 strictly between them.
  inputs:
    groups:
      - {name: group3, m: 155, p: 31, poly_exponents: [155, 62, 0], b: 471951}
      - {name: group4, m: 185, p: 37, poly_exponents: [185, 69, 0], b: 7913}
    predicted_membership:
      in_subfield: false
      fixed_by_2_to_the_5: false
      fixed_by_squaring: false
    integers:
      factorial_5: 120
      generic_degree_exponent: 20
      square_exponent: 40
      divided_by_16_exponent: 16
      one_twenty_to_10_exceeds_2_to_69: true
      one_twenty_below_128: true
      tenth_155: 389
      tenth_185: 484
      floor_exponent: 400
      floor_above_155: true
      floor_below_185: true
  controls:
    - >-
      b^{2^p} = b on either group is false. Reporting either membership
      bit true invalidates the run.
    - >-
      400 <= 389 is false. Reporting the floor under the 155 tenth
      invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - group in {group3, group4}
    - route in {field_powers, integer_tenths}
  metrics:
    primary:
      - in_subfield_by_group
      - fixed_by_32_by_group
      - fixed_by_square_by_group
      - tenth_155
      - tenth_185
      - floor_above_155
      - floor_below_185
      - implementations_agree
    secondary:
      - factorial_5
      - degree_exponents
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Six membership bits and the integer table above.
    formula: >-
      Square b, p times or 5 times or once, in F_2[u]/(the named
      trinomial). Membership is equality with b. Tenths are
      758 - 310 - 59 and 913 - 370 - 59. The floor exponent 400 is
      compared with those two results.
    source: >-
      IDEA-20260922-70a67c claim paragraphs C, D, and F, and the curve
      lines in RQ-OAKLEY-264353, read 2026-10-01. The powers were
      computed in this design session. That computation is not a run.
      No Groebner basis was built. The tenths are the proposal's written
      figures, not a new rho estimate.
  scale_relevance:
    tier: toy
    justification: Two field elements and a handful of integers. No transfer to a measured decomposition cost.
    correspondence: null
  tail_checks:
    - Group 4 is required. Stopping after group 3 and still reporting group 4 false is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic module.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If either b is reported inside its subfield, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Either in_subfield bit is true.
    - floor_above_155 is false.
    - A Groebner basis, a SAT solve, or an Oakley discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, every membership bit is false, 5! is 120, the
    exponents are 20, 40, and 16, 120^10 exceeds 2^69, 120 is below 128,
    the tenths are 389 and 484, and 400 is above 389 and below 484.
  falsification_criterion: >-
    The runs agree, both subfield bits stay false, floor_above_155 stays
    true, and any membership bit, factorial, exponent, power comparison,
    or tenth differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-OAKLEY-d36694/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-OAKLEY-d36694/runs/<RUN-ID>/command.txt
    - experiments/EXP-OAKLEY-d36694/runs/<RUN-ID>/stdout.log
    - experiments/EXP-OAKLEY-d36694/runs/<RUN-ID>/stderr.log
    - experiments/EXP-OAKLEY-d36694/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-OAKLEY-d36694/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Groebner bases over F_{2^p} and any measurement of K_5.
    - A closure claim for either Oakley group.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
