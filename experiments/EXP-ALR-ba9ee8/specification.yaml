experiment:
  id: EXP-ALR-ba9ee8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-82de84; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-82de84
  question_id: RQ-ALR-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact F_p bond-rank measurement of the first two levels of a committed ALR target-divisor
    contraction schedule at N up to 6, with forced-bound attribution and a thirty-draw random-tensor
    null per bipartition
  objective: 'The run reduces one uncertainty: whether the ALR chart-wise target-divisor elimination
    has bond-rank structure of the kind KN-OPEN-007 asks about for the Semaev tree, at the sizes where
    exact measurement is possible. (i) It commits and hashes an explicit contraction schedule for
    the ALR elimination, checked against the route EV-ALR-001 records, so that every rank reported
    afterwards is attached to a stated tree rather than to an implicit one. (ii) It materialises each
    first- and second-level intermediate at N in 3 to 6 and n in 2 to 4 over two toy primes, and computes
    exact rank across every bipartition of legs by Gaussian elimination with no truncation and no
    tolerance, per the norm-free requirement KN-OPEN-007 states for F_p. (iii) It ranks thirty uniformly
    random tensors of identical shape by the identical code path in the same invocation and reports,
    per bond, the measured rank, the null distribution, the forced bounds implied by leg dimensions
    and by affineness in v, and the storage an exact rank-r representation would need against the
    dense intermediate. The run performs no solve, emits no candidate factor and prices no contraction.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for the committed schedule, at N
      at most 6 and n at most 4 over the two tested primes, the bonds of the ALR contraction tree
      have the reported exact ranks, those ranks stand in the reported relation to random tensors
      of identical shape, and the reported fraction of any deficiency is attributable to forced dimensional
      bounds. What does NOT follow: any asymptotic bond-rank growth law, which KN-OPEN-007 explicitly
      leaves open; that a low rank yields a fast or memory-cheap contraction, since contraction cost
      is not measured; that the result transfers to a different contraction order; that anything follows
      for the Semaev tree; or that any attack, speedup or security consequence exists.'
  inputs:
    procedure: 'STAGE 0, schedule commitment, hours of careful reading, no compute: write the ALR
      contraction schedule explicitly, check it against the route recorded in EV-ALR-001, hash it,
      and record the hash before any measurement. STAGE 1, leaf construction, minutes: build coefficient
      tensors for W and per-chart K_P at each cell. STAGE 2, contraction and materialisation, the
      binding memory cost, minutes to hours at N = 6: contract the v bond exactly over F_p and hold
      each intermediate. STAGE 3, forced bounds, instant: compute trivial rank bounds from leg dimensions
      and from affineness in v, per bipartition. STAGE 4, exact rank, minutes: Gaussian elimination
      over F_p on every matricisation. STAGE 5, null arm, same cost times thirty: uniform random tensors
      of identical shape, identical elimination. STAGE 6, second prime, repeat stages 1 to 5. STAGE
      7, reporting, minutes: per-bond table of measured rank, null distribution, forced bounds, ratio,
      and implied storage; plus a rank-growth fit over N with its standard error and an explicit note
      that a four-point fit is not an asymptotic law.'
    instrument: 'Python 3 with exact modular integer arithmetic and a Gaussian elimination routine
      written over F_p in the experiment, deliberately not a floating-point or SVD-based rank, per
      the norm-free requirement of KN-OPEN-007. numpy is used only for integer array reshaping and
      bookkeeping, never for rank. Repository modules: harness/toycurve.py for toy fields and the
      ALR chart conventions, harness/runner.py for deterministic seeding, manifests and immutable
      run records. No Sage, no tensor library, no external service.'
    parameters: Target divisor degree N in 3, 4, 5, 6. Source count n in 2, 3, 4. Chart count in 1
      and 2. Two toy primes, one near 10^5 drawn from the recorded curve families and one near 10^2
      for the characteristic control. Thirty random tensors per bond per bipartition. Contraction
      tree restricted to the first two levels. Memory cap 4 GB per cell, wall clock 1800 seconds per
      cell. Total 4 N-values times 3 n-values times 2 chart counts times 2 primes = 48 cells, each
      with all bipartitions ranked and each with a thirty-draw null.
  controls:
  - Thirty uniformly random tensors of identical shape per bond, same invocation, same elimination
    code path.
  - 'Forced-bound check: compute the trivial rank bounds implied by leg dimensions and by the affineness
    of K_P in v, and report any measured rank that merely attains a forced bound as forced rather
    than as structure.'
  - 'Schedule commitment: the contraction schedule is written and hashed before measurement, so ranks
    cannot be reported against a schedule chosen after seeing them.'
  - 'Bipartition completeness: every bipartition of legs is ranked, not only the one that looks favourable.'
  - Second toy prime per cell, since exact rank over F_p can be characteristic-dependent.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): For each bond, draw thirty tensors with entries independent and uniform
    over the same F_p and the identical shape, and run the identical rank-revealing elimination on
    the identical bipartitions in the same invocation. The null must show full rank, the minimum of
    the two bipartition dimensions, with probability approaching one, since a uniformly random matrix
    over F_p is full rank except with probability O(1/p). If the null arm is not full rank at some
    bond, the shape itself forces rank deficiency, the measured rank is not evidence of structure,
    and the run reports the forced bound instead. This check runs before any measured rank is interpreted.'
  independent_variables:
  - target_divisor_degree_N
  - source_count_n
  - chart_count
  - characteristic_p
  - bond_index_in_committed_schedule
  metrics:
    primary:
    - measured_bond_rank_per_bipartition
    - null_bond_rank_distribution
    - rank_ratio_measured_over_null
    - forced_rank_bound_attribution_fraction
    secondary:
    - rank_r_storage_versus_dense_shape
    - fitted_rank_growth_exponent_and_standard_error
    - second_prime_rank_agreement_rate
    - cells_hitting_memory_or_wall_clock_cap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: For each bond of the committed schedule and each bipartition of its legs, the exact
      rank over F_p of the measured intermediate and the minimum rank over thirty random tensors of
      identical shape.
    formula: 'Predicted null: random rank equals the minimum of the two bipartition dimensions with
      probability at least 1 minus 1/(p-1), so the null minimum over thirty draws is predicted to
      equal that minimum in at least 95 percent of bonds. Predicted signal at the first level: measured
      rank at most 0.5 times the bipartition minimum, driven by the leg dimension two that affineness
      of K_P in v forces, and therefore predicted to be classified as forced rather than structural
      by the forced-bound metric. Structure is defined here as a measured rank strictly below every
      null draw and strictly above no forced bound, and its predicted occurrence at the second level
      is left uncommitted.'
    source: Pre-registered in the parent proposal IDEA-20260816-82de84 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'N at most 6, n at most 4, two levels of tree, on toy primes near 10^5 and 10^2.
      The bound is materialisation: the run must hold each intermediate in full, which is the very
      cost the ALR lane exists to avoid, so this measurement can never scale and says so. No transfer
      to crypto scale is assumed and the rank-growth fit over four N values is reported as a description
      of the tested range with its standard error, explicitly not as the asymptotic law KN-OPEN-007
      asks about.'
    correspondence: null
  tail_checks:
  - Report the full thirty-draw null distribution per bond rather than its minimum alone, since a
    null with unexpected spread would indicate the shape forces deficiency.
  - Hand-check one bond at N = 3 against a directly computed rank, since a matricisation index error
    produces plausible but wrong ranks everywhere and is invisible in aggregate.
  - Examine the small-prime cells separately for accidental rank drops, which is where characteristic-dependent
    degeneracy would first appear.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop increasing N at the first cell that exceeds the memory or wall-clock cap and record it as
    an instrument limit rather than a mathematical boundary.
  - Abort and report if the committed schedule hash does not match the schedule actually contracted.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The committed schedule is hashed before measurement and matches at run time,
    the null arm attains full rank in at least 95 percent of bonds, every bipartition is ranked at
    every completed cell, and a per-bond table of measured rank, null distribution, forced-bound attribution
    and implied storage is emitted for both primes.
  falsification_criterion:
  - Measured ranks lie inside the null distribution at every bond and bipartition.
  - Every measured deficiency is fully attributed to a forced bound, leaving no structural content.
  - The null arm fails to attain full rank in more than 5 percent of bonds, invalidating the comparison
    until forced bounds are substituted.
  - Ranks disagree between the two primes beyond the reported tolerance.
  - The committed schedule cannot be reconciled with the route EV-ALR-001 records, so the measured
    tree is not the ALR tree.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-82de84
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The faithful contraction-tree presentation of the ALR elimination is not derived here and is the
    main thing a Coordinator must fix before approval, since ranks are meaningless against an unstated
    schedule.
  - 'Whether the source index is properly a tensor leg or an outer loop needs a ruling: treating it
    as a leg creates bonds that treating it as a loop does not, and the two give different answers.'
  - The tolerance for declaring two ranks equal across primes, and the definition of the forced-bound
    attribution fraction, must both be fixed before the run.
