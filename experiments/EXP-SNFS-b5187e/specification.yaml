experiment:
  id: EXP-SNFS-b5187e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-dd425d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-dd425d
  question_id: RQ-SNFS-005666
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Power-lattice normalised first-minimum detector for the special-form prime class C(d,H):
    matched planted and random arms at 48, 64 and 80 bits with a frozen base grid, threshold and scoring
    function'
  objective: 'The single uncertainty a run reduces is whether the normalised power-lattice first minimum
    is a usable classifier for membership in C(d,H) at sizes where ground truth is constructible,
    and at what false-positive cost. (i) Is there a separation at all: does the grid-minimum statistic
    on primes planted with a recorded witness sit measurably below the same statistic on random primes
    of identical bit length, scored by the identical function in the identical invocation. (ii) Is
    the separation the planted structure or the instrument: does a shuffled-label control collapse
    to chance, does the separation survive a change of LLL delta, and does the argmin base coincide
    with the recorded witness base, all of which distinguish a real anomaly from a reduction-behaviour
    artifact or a pipeline leak. (iii) Does the anomaly obey the derived propagation law: is the measured
    base window over which the anomaly persists within a stated factor of the Pascal-matrix prediction
    (log2(GH) - log2(sqrt(d+1)H))/d, since a law that holds converts the detector from an empirical
    curve into a statement about how far the structure survives, and a law that fails is itself the
    more informative outcome because it says the operative constraint is something else. The run is
    designed so that every one of the three has a decidable answer from the same two score vectors,
    and so that a total absence of separation is recorded as a controlled null with its measured false-positive
    floor rather than as a failure.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal claim a run could support is: for the named parameters,
      the normalised power-lattice grid minimum separates self-planted C(d,H) primes from uniform
      primes of the same length with the measured true-positive and false-positive rates, and the
      anomaly persists over the measured base window. What does NOT follow: nothing about any prime
      this program did not generate, nothing about any published or deployed parameter set, nothing
      about detectability at cryptographic sizes or at degrees and coefficient bounds outside the
      tested grid, and no statement about factoring, discrete logarithms, security, or the intent
      of any party.'
  inputs:
    procedure: 'STAGE 0, zero compute: derive and record the Gaussian-heuristic normalisation and
      the Pascal-matrix Lipschitz constant, and freeze the scoring function, the base grid rule, the
      threshold rule and the metric list to a hashed file before any prime is generated. STAGE 1,
      minutes: implement and unit-test the exact-arithmetic LLL at rank up to 8 against ten hand-checked
      bases with known reduced forms. STAGE 2, minutes: implement both samplers behind one interface,
      generate 200 planted and 200 null primes per size in {48, 64, 80}, recording seeds and witnesses.
      STAGE 3, the bulk, estimated tens of minutes of pure-Python time: score every prime over the
      frozen grid, emitting per-prime records. STAGE 4, minutes: run the four controls, namely shuffled
      labels, witness-excluded grid, delta = 0.75, and the size sweep. STAGE 5, seconds: compute ROC,
      false-positive rate at the fixed true-positive threshold, and the measured window, and compare
      the window against the STAGE 0 prediction. STAGE 6: emit the run manifest and the immutable
      run record.'
    instrument: Pure Python 3.11 standard library only. This environment has no numpy, no sympy, no
      gmpy2 and no fpylll, all four checked by import at proposal time, and Sage is excluded by contract;
      the specification therefore requires a self-contained exact-arithmetic LLL over fractions.Fraction
      and arbitrary-precision int, a Miller-Rabin primality routine over random and pow, and statistics
      from the statistics module. A new module harness/snfs_detect.py holds the sampler, the lattice
      builder, the reducer and the scorer. harness/runner.py records the run manifest and the inference
      block. Determinism comes from explicit seeds per prime, recorded in the run record.
    parameters: 'Bit sizes n in {48, 64, 80}. Degrees d in {2, 3, 4}. Coefficient bounds H in {16,
      64, 256}. Sample size 200 planted and 200 null primes per (n, d, H) cell, giving 27 cells and
      10800 primes total. Base grid: 2001 consecutive integers centred on the integer nearest p^(1/d),
      with an additional blind variant of 2001 integers offset by a seeded random shift in [-10^4,
      10^4]. LLL delta in {0.99, 0.75}. Hard cap of 2001 reductions per prime and a per-cell wall-clock
      cap of 600 seconds.'
  controls:
  - The random-prime null arm, run in the same invocation with only the sampler swapped.
  - 'A shuffled-label control: recompute the ROC after permuting the arm labels, which must return
    an area under the curve of about 0.5.'
  - 'A witness-removed control: score planted primes with the true base excluded from the grid, isolating
    how much of the signal requires hitting the exact base.'
  - 'A reduction-budget control: rerun at LLL delta = 0.75 to show whether the statistic is reduction-quality
    dependent.'
  - A size control at n = 48 and n = 80 with d and H fixed, to check that the normalisation is not
    absorbing a bit-length effect.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Uniform random n-bit primes generated by the identical Miller-Rabin
    routine, scored by the identical detector over the identical base grid with the identical per-prime
    LLL call budget, in the same invocation and the same process, with only the sampler swapped. The
    null must show two things for the signal arm to mean anything: first, that the normalised profile
    on random primes concentrates near zero with a spread that does not widen as n grows, so the normalisation
    is doing its job rather than absorbing a size effect; and second, that the fraction of null primes
    whose grid minimum falls below the detection threshold is small and is consistent with the independently
    measured base rate of accidental membership in C(d,H). If the null arm reaches the same minima
    at comparable rate, the result is a controlled null and no detection is recorded.'
  independent_variables:
  - bit size n
  - degree d
  - coefficient bound H
  - LLL delta
  - base grid centring, centred or blind-shifted
  metrics:
    primary:
    - grid-minimum normalised log2 profile per prime
    - ROC area under the curve per cell
    - false-positive rate at the 90 percent true-positive threshold
    - measured detection window half-width in base steps
    - argmin-to-witness base distance on the planted arm
    secondary:
    - achieved LLL approximation factor
    - wall-clock seconds per prime
    - peak resident memory
    - number of primality candidates rejected per accepted prime
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The half-width, in base steps, of the interval around the recorded witness base over
      which the normalised profile stays below the frozen detection threshold.
    formula: W_pred = (log2(sqrt((d+1)/(2 pi e)) * p^(1/(d+1))) - log2(sqrt(d+1) * H)) / d, where
      the numerator is the log2 gap between the Gaussian-heuristic first minimum for a rank-(d+1)
      determinant-p lattice and the norm bound on the planted witness vector, and the denominator
      d is the per-step log2 Lipschitz constant from the Pascal matrix. The prediction is that the
      measured half-width lies within a factor of 2 of W_pred for every cell with d in {2,3,4}.
    source: Pre-registered in the parent proposal IDEA-20260816-dd425d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at 48, 64 and 80 bits with degrees 2 to 4 and coefficient bounds 16 to 256,
      because at those sizes the full base grid containing the witness is enumerable and every membership
      fact is known by construction. The only transfer assumption offered is the explicit cost accounting,
      namely that a complete sweep at fixed d has grid size of order p^(1/d); no assumption is made
      that the ROC, the threshold or the window transfers to larger n, and the specification forbids
      reporting any extrapolated detection rate.
    correspondence: null
  tail_checks:
  - Inspect the extreme tail of the null arm, the ten lowest grid minima, and check by exhaustive
    search whether those primes genuinely lie in C(d,H).
  - Check the planted arm for cases where the argmin base is far from the witness base, which would
    indicate a second, unintended witness.
  - Check whether any null prime scores below the planted arm minimum, which would collapse the separation
    regardless of the medians.
  - Check the largest wall-clock outliers for reduction failures rather than genuine cost.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop a cell at its 600-second wall-clock cap and record it as budget-truncated, never as a negative
    result.
  - Stop the whole run if the shuffled-label control returns an area under the curve above 0.6, since
    the pipeline is leaking and no further data is interpretable.
  - Stop if the LLL unit tests fail on the hand-checked bases.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every cell yields a scored ROC with its false-positive rate at the fixed true-positive
    threshold, the shuffled-label control returns chance performance, and the measured detection window
    is reported against W_pred, whether or not any separation is found.
  falsification_criterion:
  - Null and planted score distributions overlap so that the area under the curve is at or below 0.6
    in the centred-grid cells, which records a controlled null for this statistic.
  - The measured window is outside a factor of 2 of W_pred in a majority of cells, falsifying the
    propagation law as stated.
  - Separation vanishes entirely under the blind-shifted grid, showing the detector requires the answer
    as input.
  - The shuffled-label control shows the separation is a pipeline artifact.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-dd425d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must decide whether the class C(d,H) as defined here is the right stand-in for
    the construction named in RQ-SNFS-005666, since that record forbids reimplementing a remembered
    construction and this specification deliberately defines its own class instead of reproducing
    one.
  - The detection threshold rule must be fixed numerically before generation and hashed; this draft
    states the rule but not the constant.
  - The accidental-membership base rate that sets the false-positive floor is not measured by this
    contract and must come from a census run before the false-positive numbers can be interpreted.
  - Whether the blind-shifted grid variant is scored as a separate arm or as a robustness check needs
    a Coordinator ruling, since it changes what the headline number means.
