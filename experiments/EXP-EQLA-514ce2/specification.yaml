experiment:
  id: EXP-EQLA-514ce2
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-45a69f
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ONE PLACE MORE THAN A CONSTANT COULD COME FROM, AND THE EXPLICIT MAP THAT KILLS IT:
    a factor base closed under a NON-UNIT endomorphism psi has orbit length ord_N(mu), which is unbounded
    rather than capped by |Aut| <= 6, so the unknown count falls by an unbounded factor - and the
    construction is then a table of known multiples of one point, which is the incidence oracle, which
    is generic-group simulable, and which this record reduces to BSGS with an explicit cost map rather
    than dismissing'
  status: draft
  objective: "(A) WHY THIS IS THE ONLY EXPONENT-SHAPED IDEA IN THE LANE. Every other L5 proposal is\
    \ capped at a constant because the group acting on the factor base is Aut(E), of order at most\
    \ 6 and at most 3 on x-coordinates (IDEA-20260807-9ecc6f). That cap comes from insisting the acting\
    \ map be an AUTOMORPHISM. Drop that. Let psi be any endomorphism in End_{F_p}(E) of small norm\
    \ d > 1 - for a j = 0 curve, End = Z[zeta_3] and psi = 1 - zeta_3 has norm 3, psi = 2 - zeta_3\
    \ has norm 7, and so on. Then:\n  - psi acts on x-coordinates by a rational map of degree d, so\
    \ one orbit\n    step costs O(d) field operations: CHEAP;\n  - psi acts on G as multiplication\
    \ by mu = a + b lambda mod N, whose\n    MULTIPLICATIVE ORDER L = ord_N(mu) is generically about\
    \ N, and in any\n    case is not bounded by 6;\n  - a factor base that is a union of psi-orbits\
    \ of length L has only B/L\n    independent unknowns, because log([mu^t]P) = mu^t log(P);\n  -\
    \ so B/L relations suffice, and L is unbounded.\nAT L = B (one single orbit) the factor base carries\
    \ ONE unknown, one relation suffices, and the relation-count saving is a factor B - which at B\
    \ = ceil(sqrt(N)) is sqrt(N), an exponent-shaped quantity, not a constant. THIS RECORD THEREFORE\
    \ CLAIMS MORE THAN A CONSTANT IN ITS HYPOTHETICAL LIMB, AND NAMES EXACTLY WHERE THE EXTRA COMES\
    \ FROM: from psi not being a unit, so that ord_N(mu) replaces |Aut(E)| as the orbit length.\n\
    (B) THE OBSTRUCTION, NAMED, AND THE REDUCTION THAT MAKES IT QUANTITATIVE. A psi-orbit is {P, [mu]P,\
    \ [mu^2]P, ...}: every element is a KNOWN multiple of the first. So a psi-orbit-closed factor\
    \ base of size B is a table of B points whose logarithms are known integers times a small number\
    \ of unknowns. Finding a decomposition of a target over such a table is exactly the INCIDENCE\
    \ QUERY - which subsets of the table sum to the target - and KN-FIND-b7e091 records that the incidence\
    \ oracle is generic-group simulable in O(m) group operations per query, hence closed at exponent\
    \ 1/2 by Shoup. The closure is not asserted abstractly here; it is made concrete:\n  AT ARITY\
    \ m = 2, the algorithm implied by the construction is: store the\n  table T = {[mu^t]P : t < B};\
    \ for each trial target R, for each entry,\n  test whether R - entry lies in T. Per-trial cost\
    \ B (or O(1) amortised with\n  a hash, at B memory). Success probability about B^2 / (2N). Trials\
    \ to one\n  relation: about 2N / B^2. Total: about 2N / B group operations at B memory.\n  At\
    \ B = sqrt(N) this is about 2 sqrt(N) operations and sqrt(N) memory.\n  THAT IS BSGS (KN-TECH-031:\
    \ 2 sqrt(N) operations, sqrt(N) storage), obtained\n  by a different route and dominated by it\
    \ on every axis, and dominated by\n  parallel rho on memory by a factor sqrt(N).\nTHE OBSTRUCTION\
    \ IN ONE SENTENCE: an orbit under a map that acts as a scalar on G is a table of known multiples,\
    \ so lengthening the orbit converts index calculus into a meet-in-the-middle over a precomputed\
    \ table, and the exponent it reaches is 1/2 by construction.\n(C) THE PRECISE STATEMENT OF WHAT\
    \ WOULD HAVE TO BE TRUE TO ESCAPE, WHICH IS THE RECORD'S REAL DELIVERABLE. The reason the analogous\
    \ construction IS a genuine published result on subfield curves (eprint 2020/1315: factor 1/n\
    \ on polynomial systems, n^2 on linear algebra) is NOT that Frobenius orbits are longer. Frobenius\
    \ also acts as a scalar on a prime-order subgroup, so its orbits are also tables of known multiples.\
    \ The difference is that a Frobenius-stable factor base is CUT OUT BY A LOW-DEGREE ALGEBRAIC CONDITION\
    \ - x in F_q, i.e. x^q - x = 0 - so the decomposition test is a polynomial-system solve whose\
    \ cost does NOT scale with the orbit length, and one system solve yields relations for a whole\
    \ orbit of targets. A psi-orbit over F_p is cut out by its vanishing polynomial, of degree exactly\
    \ L, so the algebraic test costs at least L and the L-fold saving cancels exactly. SO THE OPEN\
    \ PROBLEM, STATED SHARPLY AND HANDED FORWARD:\n  Does there exist, over F_p, a set S of x-coordinates\
    \ that is\n    (i) cut out by a condition of degree polylog(p) (so that the Semaev\n        system\
    \ stays tractable), and\n    (ii) stable under an endomorphism whose eigenvalue on G has\n   \
    \     multiplicative order superconstant?\n  For the automorphisms the answer is yes and the order\
    \ is at most 3. For\n  non-unit endomorphisms this record exhibits no such S and argues that the\n\
    \  orbit's own vanishing polynomial has degree L. It does NOT prove none\n  exists, and it must\
    \ not be read as doing so.\n\n(D) THE TWO OUTCOMES, BOTH DELIVERABLES.\n  OUTCOME 1 (predicted)\
    \ - the measured cost of the psi-orbit construction\n    tracks the explicit BSGS map of (B) to\
    \ within a constant across the whole\n    (B, L) grid. Then the lane's exponent-shaped route is\
    \ closed with a named\n    obstruction, an explicit reduction and a quantitative cost map - which\
    \ is\n    the docs/inventor-protocol.md section 4 standard, not a fatigue report.\n  OUTCOME 2\
    \ - the measured cost falls materially BELOW the BSGS map at some\n    (B, L). Then either the\
    \ simulation argument has a gap or the\n    implementation is exploiting something unaccounted\
    \ for; either way it is\n    the single most important event this lane could produce and it triggers\n\
    \    independent review at review-breakthrough before any interpretation."
  resource_label: 'R3 primarily (End(E) as a ring: a non-unit endomorphism, its norm, and its eigenvalue''s
    multiplicative order), with R1 for the degree-d rational map on x-coordinates that makes the orbit
    computable.'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'INADMISSIBLE, and filed anyway as a recorded closure with its obstruction
    named, exactly as the BATCH-cb71b5 brief provides for. The reason is the DECOMPOSITION section
    2 filter applied honestly: although the orbit is BUILT by field operations (R1/R3, genuinely non-generic
    and genuinely cheap), the INFORMATION the construction extracts is entirely "which subsets of
    a table of known multiples sum to the target", which is the incidence oracle of KN-FIND-b7e091
    Oracle C, simulable in O(m) group operations per query and therefore closed at exponent 1/2 by
    Shoup. The non-generic resource buys the orbit cheaply; it does not buy any congruence the generic
    algorithm lacks, which is H-ENDO-001''s point in its sharpest form - adding endomorphism coordinates
    adds coordinates, never congruences. The record''s value is that it makes the closure QUANTITATIVE
    (an explicit reduction to BSGS with matched exponents on time and memory) rather than categorical,
    and that it isolates the exact property whose absence causes the failure (a low-degree defining
    condition), which is what (C) hands forward.'
  reachability_gate: 'T5''s isogeny-walk form does not apply directly - the construction fixes one
    curve - but T5''s SPIRIT applies with full force and is the reason this record is written at all.
    The lane''s ambition was "find a curve where the acting group is large". T4 says the acting AUTOMORPHISM
    group is class-determined and capped at 6, so no walk helps. This record asks whether a NON-UNIT
    endomorphism escapes the cap, which requires no walk at all: End_{F_p}(E) is available on the
    curve you already have, and psi of norm 3 exists on every j = 0 curve. So the good object is REACHABLE
    AT ZERO COST - which is exactly why the obstruction must be located in the decomposition test
    rather than in reachability, and it is. Cost of reaching a psi with L large: O(1) field operations
    plus one factorisation of N - 1. Availability is not the problem; usability is.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): STEP 1''s verification that psi''s rational map
      agrees with [mu]. If it does not, nothing downstream exists. STAGE 1 (minutes): compute L =
      ord_N(mu) on every instance; record the distribution (HEUR-L5-13). STAGE 2 (minutes, HARD GATE):
      the planted-known-logarithm positive control. STAGE 3 (minutes): both baseline slices - L =
      1 must reproduce ordinary index calculus, L = B with m = 2 must reproduce the BSGS map exactly.
      STAGE 4 (hours): the (B, L) grid, psi arm and NULL 1 (BSGS) and NULL 2 (random-exponent table),
      same instances, same accounting, certificates on every claimed solve. STAGE 5 (hours): STEP
      6''s algebraic limb - solving degree and time as a function of L, plus the extension-field contrast
      arm. STAGE 6 (hours, small p only): the sumset coverage enumeration for HEUR-L5-14. STAGE 7
      (zero compute): write the closure at the section-4 standard. THE CHEAPEST DECISIVE SUBSET is
      STAGES 0, 2, 3: verifying that the construction reproduces BSGS exactly at L = B costs minutes
      and already establishes the domination at the one parameter value where the claim was exponent-shaped.'
    mechanism: "STEP 1 (zero compute, derivation). Fix a j = 0 toy curve. Compute End_{F_p}(E) = Z[zeta_3]\
      \ or the relevant order; pick psi = 1 - zeta_3 (norm 3) and psi' = 2 - zeta_3 (norm 7). Write\
      \ down the degree-d rational map on x-coordinates explicitly, either via Velu from the kernel\
      \ or by composing the known automorphism with a small-degree isogeny, and VERIFY it: for random\
      \ P, check that psi(P) computed by the rational map equals [mu]P computed by scalar multiplication,\
      \ where mu = a + b lambda mod N. This verification is the whole foundation and it is a known-answer\
      \ test.\nSTEP 2 (cheap). Compute L = ord_N(mu) by factoring N - 1 at toy scale. Record the distribution\
      \ of L over instances: predicted to be a large divisor of N - 1, usually N - 1 itself or N -\
      \ 1 over a small factor.\nSTEP 3. Build psi-orbit-closed factor bases at several (B, L) with\
      \ L | B, by choosing B/L orbit representatives and iterating psi. Confirm exact closure and\
      \ that the orbit lengths are exactly L.\nSTEP 4. Run the decomposition search at arity m = 2\
      \ and m = 3, measuring attempts, hits, and INFORMATIVE rank arrival (the unknown count is B/L,\
      \ so the target is B/L). Charge every group operation and every field operation.\nSTEP 5. Run\
      \ the explicit BSGS map of (B): implement the meet-in-the-middle of (B) on the same table, on\
      \ the same instance, with the same accounting, and measure its cost. THE COMPARISON IS THE RESULT.\
      \ Report the ratio\n  measured psi-orbit index-calculus cost / measured BSGS-on-the-same-table\n\
      \  cost\nacross the (B, L) grid. Predicted: bounded above and below by constants, with no trend\
      \ in L.\nSTEP 6. Run the algebraic-cost limb, which is where the cancellation of (C) is made\
      \ visible. Construct the vanishing polynomial of a psi-orbit of length L (degree L by construction)\
      \ and measure the Semaev system's solving degree and time with that polynomial as the factor-base\
      \ membership condition, as a function of L. Predicted: cost growing at least linearly in L,\
      \ cancelling the L-fold relation saving exactly. CONTRAST ARM: the same measurement with the\
      \ membership condition x^q - x = 0 in an extension-field toy instance, where the degree is q\
      \ and the orbit length is n and they are NOT tied together - which is precisely why eprint 2020/1315\
      \ works there. Running both arms in one experiment is what turns the (C) argument into a measurement.\n\
      STEP 7. Write the closure at the section-4 standard: obstruction (B), argument (STEPS 5-6),\
      \ forward guidance (C's open problem). Explicitly not an impossibility claim."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL 1 - BSGS on the same table, first-class arm, same accounting unit
  - NULL 2 - random-exponent table of the same size, same informational content
  - planted-known-logarithm positive control
  - L = 1 and L = B baseline slices, both reproduced exactly
  - extension-field contrast arm, where the argument must NOT close the case
  - matched parallel Pollard rho with negation (0.886 sqrt(N/6) on these curves) reported in group
    operations with memory beside it
  - independent certificate verification on every claimed solve, per docs/claims-and-verification.md
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL 1 - THE DOMINATION OBJECT ITSELF:
    BSGS with a table of the same size B on the same instance, in the same accounting unit, run as
    a first-class arm rather than quoted from KN-TECH-031. The psi-orbit construction is claimed to
    BE this algorithm; measuring both and comparing is the whole test, and if the two costs do not
    track, one of them is implemented wrong. NULL 2 - RANDOM TABLE: a factor base of B points that
    are known multiples of P but chosen with RANDOM exponents rather than the geometric sequence mu^t.
    It has the same informational content (one unknown, known multipliers) and none of the psi structure.
    PREDICTED: identical cost. If the psi arm beats the random-exponent arm, something about the geometric
    structure is being used and that is the one interesting event. DECAY PARAMETER: L, the orbit length.
    As L falls from B to 1, the construction must interpolate continuously from "one unknown, BSGS"
    to "B unknowns, ordinary index calculus", and the measured cost must move monotonically along
    that interpolation. A cost that is flat in L means L is not doing what the mechanism says it does
    and every number is void. SECOND DECAY PARAMETER for the algebraic limb: the degree of the membership
    condition. STEP 6''s contrast arm holds the orbit length fixed while varying the condition degree,
    which is the only way to separate the two effects that (C) claims are tied together over F_p and
    untied over F_{q^n}. PLANTED POSITIVE: an instance where the construction MUST win - a factor
    base of B points all of whose logarithms are known and whose target is chosen to decompose. The
    pipeline must recover the logarithm immediately. If it does not, the pipeline cannot exploit known
    logarithms at all and every negative it produces is void.'
  independent_variables: []
  metrics:
    primary:
    - psi rational-map verification result per instance
    - L = ord_N(mu) per instance, and its empirical distribution
    - total group operations and peak memory, psi arm and both nulls, per cell
    - Semaev solving degree and wall time as a function of L
    secondary:
    - the same in the extension-field contrast arm as a function of n
    - m-fold sumset coverage and maximum multiplicity, psi arm and generic arm
    - the L = 1 and L = B baseline reproduction results, exactly
    - certificates for every claimed solve, with independent verification status
  heuristic_under_test: null
  preregistered_prediction:
    quantity: measured psi-orbit construction cost divided by measured BSGS cost on the same table,
      same instance, same unit
    formula: PREDICTED in [0.5, 4] with NO trend in L across the grid. A ratio falling with L, reaching
      below 0.5 at the largest L, is OUTCOME 2 and triggers review-breakthrough per AGENTS.md rule
      12 before any interpretation.
    source: pre-registered in IDEA-20260807-45a69f before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - MEMORY IS NOT FREE. The construction stores a table of B points and so competes against BSGS,
    not against constant-memory rho. KN-TECH-031 records Wiener's point that BSGS is sqrt(N) processor
    steps but N^{2/3+o(1)} FULL cost once memory is charged, and that treating the two as interchangeable
    is wrong. Every cost in this record must be reported with memory beside it and the full-cost comparison
    stated, or the domination claim is understated in the construction's favour.
  - TOY-SCALE L. At p up to 2^32, N - 1 factors easily and L is knowable; at crypto scale it may not
    be. This does not affect the closure but it does affect any claim that the construction is implementable
    at scale.
  - SMALL-NORM psi MAY NOT EXIST on a given curve. End_{F_p}(E) is an order of conductor f_E, and
    the available norms are constrained by the discriminant. Instances where no small-norm non-unit
    psi exists must be recorded as skipped rather than silently dropped.
  - psi AND ITS CONJUGATE. psi and its complex conjugate generate the same orbits up to relabelling;
    running both as if independent would double-count.
  - THE m = 2 CASE IS ALREADY GENERIC. At arity 2 the decomposition test is a meet-in-the-middle by
    construction and the reduction to BSGS is almost immediate. The interesting arithmetic is at m
    >= 3, where the algebraic route is the only alternative to a B^{m-1} search, and STEP 6 is where
    the record earns its conclusion.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: PREDICTED in [0.5, 4] with NO trend in L across the grid. A ratio falling with
    L, reaching below 0.5 at the largest L, is OUTCOME 2 and triggers review-breakthrough per AGENTS.md
    rule 12 before any interpretation.
  falsification_criterion:
  - 'STEP 1''s verification fails: psi''s rational map does not agree with [mu]. The construction
    does not exist as described; halt.'
  - The L = B, m = 2 slice does not reproduce the BSGS cost map to within a constant. Either the implementation
    or the reduction in (B) is wrong, and the record's central argument is unsupported until reconciled.
  - 'The measured cost ratio against BSGS falls below 0.5 and decreases with L. The closure is FALSE,
    the construction beats BSGS, and this is a claimed sub-birthday result requiring review-breakthrough
    at max effort per AGENTS.md rule 12, an independently verified certificate, and replication before
    any interpretation. This is stated first among the falsifiers deliberately: the record must not
    make its own negative easy to reach.'
  - The Semaev solving cost is independent of L. The degree-L cancellation argument of (C) is false
    and the algebraic route is reopened with a concrete target.
  - The extension-field contrast arm ALSO shows the cancellation. The argument is too strong, would
    contradict a published result, and is wrong as stated; it must be narrowed before it can be a
    closure.
  - The planted positive control is not solved. The pipeline cannot exploit known logarithms and every
    negative it produces is void.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
