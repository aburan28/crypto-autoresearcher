# EXP-AUXIN-2e5cf0
# Dyadic interval and squared thresholds. No transcript.
# Approved by DEC-20261002-9ba724.
experiment:
  id: EXP-AUXIN-2e5cf0
  hypothesis_id: H-AUXIN-754d2e
  source_idea: IDEA-20260930-68326c
  question_id: RQ-AUXIN-f8d8c0
  version: 1
  title: Dyadic interval and squared thresholds
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-9ba724
  objective: >-
    Check the interval gap 1, the pessimistic excess 1059794199 at
    262144, the optimistic shortfall 11046433761 at 1024, and the
    split signs at 16384.
  inputs:
    k: 12
    q_max: 4095
    dyadic_floor: 2048
    outside_power: 4096
    interval_gap: 1
    bits: 255
    coef_num: 117
    coef_den: 125
    pess_num: 3825
    pess_den: 8
    opt_num: 1275
    opt_den: 32
    cutoff_num: 2822265625
    pess_cutoff_den: 10816
    opt_cutoff_den: 1557504
    d_below: 262144
    pess_left: 229663309824
    pess_right: 228603515625
    pess_excess: 1059794199
    pess_cutoff_excess: 13083879
    d_inert: 1024
    opt_left_inert: 14353956864
    opt_right: 25400390625
    opt_short_inert: 11046433761
    opt_cutoff_short: 1227381529
    d_mid: 16384
    opt_excess_mid: 204262919199
    pess_short_mid: 214249558761
    opt_cutoff_excess_mid: 22695879911
    pess_cutoff_short_mid: 2645056281
    d_near_low: 131072
    pess_short_near: 113771860713
    pess_cutoff_short_near: 1404590873
    d_near_high: 2048
    opt_excess_near: 3307523103
    opt_cutoff_excess_near: 367502567
  controls:
    - >-
      4096 equals 4095 plus 1. Reporting the next power of two inside
      the interval invalidates the run.
    - >-
      The pessimistic excess at 262144 is 1059794199. Reporting a
      shortfall there invalidates the run.
    - >-
      The divisor 131072 falls short of the pessimistic cutoff by
      1404590873. Reporting it above that cutoff invalidates the run.
    - >-
      The divisor 2048 exceeds the optimistic cutoff by 367502567.
      Reporting it inert invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - divisor in {262144, 16384, 1024, 131072, 2048}
    - route in {square_cross, cutoff_product}
  metrics:
    primary:
      - interval_gap
      - pess_excess
      - implementations_agree
    secondary:
      - opt_short_inert
      - opt_excess_mid
      - pess_short_mid
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The interval gap is 1. The pessimistic excess at 262144 is
      1059794199. The optimistic shortfall at 1024 is 11046433761.
      The divisor 16384 is above the optimistic cutoff and below the
      pessimistic cutoff.
    formula: >-
      Compare 117 squared times d times the denominator squared with
      the numerator squared times 125 squared. Separately compare d
      times 10816 and d times 1557504 with 2822265625. Separately
      compare 4096 with 4095 plus 1.
    source: >-
      IDEA-20260930-68326c states the released bound 2^k minus 1 and
      the ratio with coefficient 0.936, read 2026-10-02. The products
      were computed in this design session. That computation is not a
      run. No curve order was pinned.
  scale_relevance:
    tier: toy
    justification: Five divisors and one width. No transfer to a deployment.
    correspondence: null
  tail_checks:
    - The nearby signs at 131072 and 2048 are required. A check that stops at 262144 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the pessimistic excess 1059794199 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The interval gap is not 1.
    - The pessimistic excess at 262144 is not 1059794199.
    - 131072 is reported above the pessimistic cutoff.
    - 2048 is reported inert.
    - A curve order is pinned or a transcript is read.
  success_criterion: >-
    Both runs agree that the interval gap is 1, that the pessimistic
    excess at 262144 is 1059794199, that the optimistic shortfall at
    1024 is 11046433761, that 16384 splits the two cutoffs, and that
    the nearby signs at 131072 and 2048 are the opposite verdicts.
  falsification_criterion: >-
    The runs agree that 4096 equals 4095 plus 1, and the pessimistic
    excess at 262144 is not 1059794199.
  required_artifacts:
    - experiments/EXP-AUXIN-2e5cf0/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-AUXIN-2e5cf0/runs/<RUN-ID>/command.txt
    - experiments/EXP-AUXIN-2e5cf0/runs/<RUN-ID>/stdout.log
    - experiments/EXP-AUXIN-2e5cf0/runs/<RUN-ID>/stderr.log
    - experiments/EXP-AUXIN-2e5cf0/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-AUXIN-2e5cf0/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any pinned curve order, ceremony transcript, or factorization.
    - Any claim that a deployment is below rho.
    - Any measured walk or group-operation timing.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
