experiment:
  id: EXP-SPR-f90830
  hypothesis_id: H-SPR-71a843
  version: 1
  title: >-
    Oriented self-pairing admissibility screen over the surviving supersingular
    assumptions, with a forced-value arithmetic null and a toy instrument
  status: review_required
  objective: >-
    Obtain the exact criterion of KN-LIT-7489 from primary text; build a toy
    instrument that evaluates the isogeny-compatible self-pairing on O-oriented
    supersingular curves; verify the forced null (m coprime to Delta_O gives the
    trivial pairing) and the transport law under one horizontal step; measure the
    value collision rate against the 1/m prediction; and fill a five-field
    admissibility screen for CGL, SQIsign and CSIDH with an explicit verdict and,
    for every UNDETERMINED, the exact missing fact.
  experiment_class: control
  inputs:
    primary_text: >-
      KN-LIT-7489 full text, obtained at Stage 0. If it cannot be obtained the
      experiment HALTS at Stage 0 and reports that, at zero compute. No
      implementation is written from the corpus abstract.
    primes: [103, 251, 419, 1019]
    orientations: >-
      Imaginary quadratic orders of small discriminant, curves constructed by CM
      so the orientation is known and evaluable by construction.
    m_values: >-
      Every divisor of each Delta_O, plus at least three values coprime to
      Delta_O for the arithmetic null.
    screen_fields: >-
      Per assumption: (i) orientation and its order; (ii) Delta_O and its
      divisors; (iii) is a cyclic subgroup of order m > 2 with m | Delta_O
      exposed by public data; (iv) is the orientation EVALUABLE on that subgroup;
      (v) verdict EXPOSED / NOT_EXPOSED / UNDETERMINED with the exact missing
      fact. Field (iv) may never be omitted -- it is the field most likely to
      empty the screen and omitting it would let the screen pass by silence.
  controls:
    - id: C1_arithmetic_null
      description: >-
        m coprime to Delta_O. Forced value: trivial pairing. BLOCKING. Derived
        before measurement, so the instrument can fail.
    - id: C2_unoriented_null
      description: >-
        A supersingular curve with only j published and no orientation supplied.
        The screen must return NOT_EXPOSED and the evaluator must return no
        value. An implementation that returns a value has invented an
        orientation. BLOCKING.
    - id: C3_positive_control
      description: >-
        A curve and subgroup pair that the primary text's own criterion says
        carries a non-trivial pairing. Must return non-trivial. BLOCKING: a
        screen that has never returned a positive cannot be shown able to.
    - id: C4_vertex_set_agreement
      description: >-
        Two independent constructions of the supersingular vertex set must agree
        exactly at every prime before any pairing is computed. BLOCKING.
    - id: C5_transport_law
      description: >-
        Walking one horizontal (class-group) step must transport the value by the
        law stated in the primary text. A mismatch means the compatibility
        property is not implemented as specified.
  independent_variables:
    - prime p (4 values)
    - orientation discriminant Delta_O
    - subgroup order m (divisors of Delta_O, and coprime values for the null)
    - assumption under screen (3 targets)
  metrics:
    primary:
      - >-
        screen_verdict per assumption, with all five fields populated and, for
        UNDETERMINED, the exact missing fact named.
      - >-
        null_pass: the pairing value on every m coprime to Delta_O, required to
        be exactly trivial.
    secondary:
      - pairing value and its multiplicative order per (p, Delta_O, m)
      - collision rate of values across distinct secret classes, against 1/m
      - transport-law agreement rate under one horizontal step
      - extractable-bits ceiling log2(m) per exposed configuration
  measured_vs_modeled:
    measured:
      - pairing values, their orders, collision rates, transport agreement
    modeled:
      - the m | Delta_O divisibility constraint, from KN-LIT-7489 as read at Stage 0
      - the 1/m collision prediction, from HEUR-SPR-1
    rule: measured and modeled never share a column; every modeled entry names its source
  optimistic_assumptions:
    - >-
      Toy discriminants are small and divisor-rich, so the toy EXPOSED rate
      overstates what deployed parameters would show. BIAS: flatters the
      exposure claim. Direction: makes the screen look more likely to fire than
      it is at scale.
    - >-
      Orientations are constructed by CM and therefore evaluable by
      construction, which is exactly the condition field (iv) tests in the real
      assumptions. BIAS: the toy instrument is easier than the real setting.
      Stated so the toy result is never read as evidence about deployed data.
  optimistic_assumption_rule: >-
    Every toy number is labeled an instrument measurement, not an exposure
    estimate for any deployed parameter set, and the list above is reproduced in
    the results report with the direction of each bias.
  heuristic_under_test: HEUR-SPR-1
  preregistered_prediction:
    quantity: collision rate of the self-pairing value across distinct secret ideal classes
    formula: collision_rate = 1/m
    source: >-
      HEUR-SPR-1 in H-SPR-71a843, from the torsor structure of the class-group
      orbit. Frozen before execution; a revision is a protocol_amendment.
  scale_relevance:
    tier: toy
    justification: >-
      p <= 1019 permits exact enumeration of the full class-group orbit, so the
      collision rate is computed by exhaustive count rather than sampled and
      carries no statistical error. Nothing measured transfers to deployed
      parameters; what transfers is the SCREEN, which is a derivation over
      published data inventories and is independent of the toy runs. Resulting
      evidence is capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      The most frequent pairing value's multiplicity against the uniform
      prediction |Cl(O)|/m, per (p, Delta_O, m).
    - >-
      The largest m for which a non-trivial pairing is observed, compared against
      the largest divisor of Delta_O -- these must coincide, and a gap indicates
      an implementation limit rather than a mathematical one.
  replication:
    seeds: [7, 14, 21]
    independent_instances: 3
    note: >-
      Orbits are enumerated exhaustively, so seeds vary only the choice of base
      curve and subgroup generator. Results must be identical up to relabelling;
      a seed-dependent value indicates a bug, not variance.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 8
    maximum_memory_gb: 4
    maximum_runs: 200
  stopping_rules:
    - >-
      HALT at Stage 0 if the primary text cannot be obtained, or if its criterion
      requires data no assumption in scope publishes. This is a legitimate,
      intended, zero-cost outcome and is reported as such.
    - Stop at the CPU-hour cap, reporting completed primes and naming the rest.
  invalidation_rules:
    - Any BLOCKING control failing invalidates every verdict at the affected prime.
    - >-
      A screen row reported without field (iv) is invalid regardless of its
      verdict.
    - >-
      Crashes and timeouts are infrastructure outcomes under AGENTS.md rule 5,
      never evidence about exposure.
  success_criterion: >-
    Stage 0 yields the exact criterion; C1-C4 pass; the collision rate is
    measured against 1/m; and the five-field screen is filled for all three
    assumptions with an explicit verdict and, where UNDETERMINED, the exact
    missing fact. The experiment succeeds whichever way the verdicts fall.
  falsification_criterion: >-
    H-SPR-71a843 is REFUTED if any assumption in scope scores EXPOSED with all
    five fields populated -- i.e. it publishes both an evaluable orientation and
    a cyclic subgroup of order m > 2 dividing Delta_O. Separately, HEUR-SPR-1 is
    refuted by a measured collision rate off 1/m by more than a factor 2.
    Instrument failures (C1-C4) refute neither and report nothing.
  required_artifacts:
    - the Stage-0 knowledge entry recording the exact criterion and its citation
    - frozen curve and orientation parameters per prime
    - per-run manifest with command, commit, environment, seed, resolved model
    - full pairing-value tables per (p, Delta_O, m)
    - control outcomes C1-C5 with pass/fail
    - the five-field screen table with per-row verdict and missing facts
    - measured-vs-modeled table, columns unmixed
  assigned_to: executor
  approved_by: null
  approval_note: >-
    Status is review_required. Approval authorises compute and is the user's
    call; it has not been given.
