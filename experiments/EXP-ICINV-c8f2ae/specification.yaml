experiment:
  id: EXP-ICINV-c8f2ae
  hypothesis_id: H-ICINV-b81659
  derived_from_idea: IDEA-20260807-0a3272
  question_id: RQ-ICINV-475b5e
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Within-class stratified measurement of the Semaev solving-degree proxy by the rational-2-torsion
    count r, with a blocking single-stratum null class run first, a gauge interval as the comparator,
    and inclusion/exclusion factor-base arms that convert a correlation into a named mechanism or refute
    it
  objective: >-
    The one uncertainty a run reduces is whether a within-class, gauge-invariant, locally computable
    invariant -- the number r of F_p-roots of the defining cubic -- moves a relation-collection cost
    proxy, and if so whether the cause is non-transversality of the Semaev ideal at 2-torsion
    x-coordinates. A run establishes (i) whether both strata r = 1 and r = 3 occur inside a reachable toy
    class with at least 8 members each, which is the design's own precondition and could fail; (ii) the
    stratified contrast in the Groebner basis maximum total degree at a DELIBERATELY 2-torsion-LOADED
    factor base, scored against an at-least-8-draw gauge interval; (iii) the same contrast at a factor
    base EXCLUDING 2-torsion x-coordinates, which is the arm that separates mechanism (C2) from any other
    cause; (iv) the decay of the effect in factor-base size B, whose predicted 1/B law is the artifact
    tell; and (v) the single-stratum null class verdict, computed and reported BEFORE the real arm's
    verdict is looked at. NOTHING HERE BEARS ON THE ECDLP; the claim is about a relation-collection proxy
    only.
  what_this_is_not:
    - >-
      Not an attack and not a speedup. Even a positive outcome would be a constant-factor change in one
      stage of point-decomposition index calculus at toy scale, which is baseline calibration.
    - >-
      Not a statement about the ECDLP in the prime-order subgroup G. r is a 2-part invariant and the
      2-part is irrelevant to the discrete logarithm there.
    - >-
      Not a degree-of-regularity measurement. The Groebner outputs are implementation-bound proxies and
      the measuring module says so; they are never reported as degrees of regularity.
    - >-
      Not a test of any hypothesis about endomorphism action on G. No endomorphism is applied to any
      point of G.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
      been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at p in [2^12, 2^14], on the retained classes, with the declared factor
      bases and sympy's Groebner routine, the solving-degree PROXY does or does not differ between the
      r = 3 and r = 1 strata by at least one full degree outside the gauge interval, and that difference
      does or does not vanish when 2-torsion x-coordinates are excluded from the factor base. WHAT DOES
      NOT FOLLOW: nothing about the degree of regularity; nothing about the ECDLP; nothing about other
      solvers, other encodings, other curve models or larger p; and no attack. Even a positive result
      would establish REACHABILITY of a minimiser, not that the prize is more than a constant.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, gating). Re-derive disc_{x3} S_3 = 16 f(x1) f(x2) and the symmetry of S_3
      SYMBOLICALLY; verify r is gauge- and twist-invariant on at least 100 curves; re-verify or downgrade
      the Lenstra citation. A failure here costs minutes and removes mechanism (C2) before any Groebner
      run. STAGE 1 (about 1 hour). Enumerate complete classes at p about 2^13, compute r for every
      member, and CONFIRM that both strata occur inside at least one class with at least 8 members each.
      If no class at reachable p has both strata, the design is scoped out at toy scale and that is
      reported as a SCOPE limit, not as a negative. Class selection is on r ALONE and never on the cost
      proxy, which would be circular. STAGE 2 (hours, BLOCKING, RUN FIRST). The single-stratum null
      class: run the identical pipeline on classes with one stratum, splitting their members arbitrarily
      into two groups of the same sizes as the real strata. The rule MUST return no effect there, and
      this verdict is computed and reported before the real arm's verdict is looked at. STAGE 3 (hours).
      The stratified measurement at random, EXCLUDED and LOADED factor bases, at least 5 seeds per vertex
      so within-vertex variance is known before any between-vertex contrast, and at least 8 gauge draws
      per member. STAGE 4 (zero compute). Apply the frozen rule; report the decay fit in B; record the
      outcome with the reachability bookkeeping -- the cost of computing r at a vertex, the number of
      2-isogeny steps needed to move between strata, the effect size, and the resulting change (if any)
      in total attack cost against the 0.886 sqrt(N) baseline.
    instrument: >-
      Class enumeration and r computation by factoring the defining cubic over F_p.
      harness/semaev.py's measure_s3_decomposition for the cost proxies, at a COMMON factor base and a
      TRANSPORTED target with a re-verified transport certificate on every transported target. Each
      member is measured at a canonical gauge representative or averaged over at least 8 gauge draws,
      otherwise gauge variance enters the stratum contrast. All four recorded proxies are reported;
      reporting only the one that fires is forking and is prohibited. Recorded through harness/runner.py.
    parameters: >-
      p in [2^12, 2^14], with the enumeration stage at p about 2^13. At least 3 independent classes
      containing both strata with at least 8 members each. Three factor-base types: random,
      2-torsion-EXCLUDED, 2-torsion-LOADED. At least 4 factor-base sizes B for the decay fit. At least 5
      factor-base seeds per vertex. At least 8 gauge draws per member, reported as an interval with the
      derived 2/n false-positive rate quoted beside every OUTSIDE verdict. At least 1000 generated factor
      bases per (p, B) for the Binomial(B, r/p) uniformity check of the harness's generator.
  controls:
    - >-
      MATCHED NULL, BLOCKING, RUN FIRST: single-stratum classes -- those with a trivial 2-volcano, or odd
      order where r = 0 throughout -- split arbitrarily into two groups of the same sizes as the real
      strata. Same p, same class structure, same measurement, same group sizes, and NO r contrast. The
      rule must return nothing. Its verdict is reported BEFORE the real arm's.
    - >-
      GAUGE NULL: at least 8 gauge representatives per member as the comparator spread. Because r is
      gauge-INVARIANT, the gauge arm cannot produce the stratification by construction, which is exactly
      why it is the right spread reference for THIS contrast. The derived 2/n false-positive rate is
      quoted beside every OUTSIDE verdict.
    - >-
      MECHANISM ARM, EXCLUSION: a factor base that EXCLUDES every 2-torsion x-coordinate. Under (C2) the
      stratification must VANISH here. If it survives, (C2) is refuted even if the correlation is real.
    - >-
      MECHANISM ARM, INCLUSION: a factor base DELIBERATELY LOADED with all r 2-torsion x-coordinates.
      Under (C2) the stratification must be AMPLIFIED here. This arm exists because the forced value
      rB/p < 1 means a random factor base contains essentially none of them.
    - >-
      DECAY PARAMETER, the factor-base size B, over at least 4 values. Mechanism (C2) predicts the effect
      DECAYS as r/B, because the stratification is driven by how many of the B factor-base elements are
      2-torsion x-coordinates and there are at most 3 of them in all of F_p. An effect that does NOT
      decay as B grows is the canonical artifact tell for this design and is stated before the run.
    - >-
      WITHIN-VERTEX REPEAT MEASUREMENTS, at least 5 seeds per vertex, so solver noise is established
      BEFORE any between-vertex contrast is computed. sympy's Groebner routine is not an optimised F4 and
      its wall time varies substantially run to run.
    - >-
      TRANSPORT CERTIFICATE on every transported target, re-verified independently.
    - >-
      GENERATOR-UNIFORMITY CHECK: the empirical count of 2-torsion elements over at least 1000 generated
      factor bases per (p, B) against Binomial(B, r/p) by exact chi-square. A deviation is an instrument
      finding of independent value.
  independent_variables:
    - stratum, r = 1 or r = 3, within a fixed isogeny class
    - class identity, over at least 3 independent classes containing both strata
    - factor-base type, one of random, 2-torsion-excluded, 2-torsion-loaded
    - factor-base size B, over at least 4 values
    - gauge representative, over at least 8 draws per member
    - factor-base seed, over at least 5 per vertex
    - >-
      class type, one of two-stratum (signal) or single-stratum (matched null with an arbitrary split)
  metrics:
    primary:
      - >-
        groebner_basis_max_total_degree, units degree (integer), computed by harness/semaev.py per
        (vertex, seed, factor-base type) and LABELLED IMPLEMENTATION-BOUND PROXY in every row; the
        stratified contrast is the r = 3 stratum's value minus the r = 1 stratum's within one class
      - >-
        stratum_contrast_versus_gauge_interval, units degrees relative to the gauge interval, computed as
        the contrast scored against the at-least-8-draw gauge interval per member, with the derived 2/n
        false-positive rate quoted beside every OUTSIDE verdict
      - >-
        single_stratum_null_class_verdict, units a boolean plus the contrast value, computed on
        single-stratum classes split arbitrarily into groups of matched sizes, REPORTED BEFORE the real
        verdict
      - >-
        fitted_B_decay_exponent, units the exponent in effect size proportional to B^{-k}, computed by
        least squares over at least 4 values of B, with an interval. Predicted k at least 1.
    secondary:
      - >-
        r per class member and the class's 2-volcano height, units an integer in {0,1,3} and a level count
      - >-
        groebner_basis_size, groebner_seconds and the trivial-ideal flag, units count, seconds and
        boolean, per (vertex, seed, factor-base type), all four proxies reported and never only the one
        that fires
      - >-
        within_vertex_variance of every proxy, units the proxy's own units, established BEFORE any
        between-vertex contrast
      - >-
        gauge_interval_width and its number of draws, per member
      - >-
        stratum sizes per class, units member counts, reported beside every contrast, since at toy p a
        stratum may have fewer than 8 members and no interval-based verdict is then admissible
      - >-
        random_factor_base_2torsion_count against Binomial(B, r/p), units counts plus a chi-square
        statistic, over at least 1000 generated factor bases per (p, B)
      - >-
        reachability bookkeeping: cost of computing r at a vertex, 2-volcano height, and the implied
        change (if any) in total attack cost against the 0.886 sqrt(N) baseline
  heuristic_under_test:
    id: H1
    formal_statement: >-
      STRATUM OCCUPANCY. Within a fixed F_p-isogeny class whose 2-volcano has height at least 1, both
      r = 1 and r = 3 occur, and the fraction of members with r = 3 is bounded away from 0 and 1 as p
      grows.
    companion_heuristic:
      id: H2
      formal_statement: >-
        RANDOM FACTOR-BASE 2-TORSION COUNT. The number of 2-torsion x-coordinates in a uniformly random
        factor base of size B is Binomial(B, r/p) with mean rB/p, below one element for every (B, p) in
        the toy range.
    scale_access_and_transfer: >-
      Access is by EXHAUSTIVE enumeration of every class at p in {4001, 8191, 16381}, tabulating the
      empirical stratum fractions against the class-number-weighted prediction and checking the tail --
      the classes with the most extreme fractions against prediction. TRANSFER: toy scale only and
      labelled as such; the fraction's asymptotic behaviour is NOT established by tens of classes at
      13-bit primes, and no transfer is offered.
  preregistered_prediction:
    quantity: >-
      The stratified contrast in groebner_basis_max_total_degree between the r = 3 and r = 1 strata,
      within one class, at a deliberately 2-torsion-loaded factor base, and the same contrast at an
      excluded factor base.
    formula: >-
      Predicted, before any run: at a LOADED factor base the contrast is at least 1 full degree and
      outside the at-least-8-draw gauge interval in at least 2 of 3 independent classes; at an EXCLUDED
      factor base the contrast FALLS inside the gauge interval; the effect decays at least as fast as
      1/B over at least 4 values of B; the single-stratum null class returns NO effect; and the number of
      2-torsion elements in a random factor base is Binomial(B, r/p) with mean rB/p < 1 at every toy
      parameter. A contrast smaller than one full degree is declared INCONCLUSIVE IN ADVANCE, so neither
      branch can be reached by rounding. NOTE THE DIRECTION THAT MATTERS: because rB/p < 1, a LARGE
      observed effect at a RANDOM factor base would be evidence AGAINST mechanism (C2), not for it.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-0a3272, whose predictions block states the
      one-degree minimum effect, the exclusion-arm requirement, the 1/B decay and the null-first rule, and
      whose null_object_control derives the forced value rB/p before any run. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at p in [2^12, 2^14], where complete isogeny classes can be enumerated and r computed for
      every member -- which is what makes a WITHIN-CLASS stratified contrast possible at all. The cost is
      that strata may have fewer than 8 members, that sympy is not an optimised F4, and that the proxies
      are implementation-bound. No transfer to larger p or to other solvers is claimed, and the
      reachability bookkeeping is reported as reachability, not as benefit.
    correspondence: null
  tail_checks:
    - >-
      Report stratum sizes beside every contrast; a stratum with fewer than 8 members admits no
      interval-based verdict and must be reported as such rather than contributing a number.
    - >-
      Report all four Groebner proxies, not the one that fires, and do not multiply their rates; reporting
      the firing proxy alone is forking.
    - >-
      Report within-vertex variance FIRST, before any between-vertex contrast, so a contrast smaller than
      solver noise is visible as such.
    - >-
      Report the classes with the most extreme r = 3 fractions against the class-number-weighted
      prediction, as the tail check on H1.
    - >-
      Report the effect at the LARGEST B explicitly, since the 1/B prediction makes the largest B the
      place where a genuine (C2) effect should have vanished and an artifact should not have.
  replication:
    seeds:
      - 20260807
      - 20260808
      - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds: 14400
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 12.0
    memory_gb: 16
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
    - >-
      Stage 0 is a gate. If the disc identity fails to re-derive symbolically, mechanism (C2) is withdrawn
      BEFORE any Groebner run and the line either proceeds on (C1) alone with a new discriminating arm or
      halts.
    - >-
      Stage 2, the single-stratum null class, is BLOCKING and runs first. If it shows an effect, nothing
      is reported and measurement halts.
    - >-
      If no class at reachable p contains both strata with at least 8 members each, stop and report a
      SCOPE limit with the largest p reached; do not report a negative about r.
    - >-
      If the effect does not decay in B, halt for instrument review rather than reporting.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop, never
      a negative result (AGENTS.md rule 5).
    - >-
      The class-selection criterion (on r alone), the one-degree minimum effect, the gauge-draw count and
      the B ladder are frozen before any measurement and are not revised afterwards.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is
      NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose single-stratum null class arm is missing, or was not executed in the same invocation as
      the signal arm, is invalid_measurement, and a run that read the real verdict before the null verdict
      is invalid for the same reason.
    - >-
      A run whose classes were selected on the COST PROXY rather than on r is invalid_measurement, because
      the selection is then circular.
    - >-
      A run whose members were measured at uncontrolled gauge representatives, without either a canonical
      representative or averaging over at least 8 draws, is invalid_measurement: gauge variance would
      enter the stratum contrast.
    - >-
      A run reporting only the proxy that fired, out of the four recorded, is invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new
      contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the disc identity
    and the symmetry of S_3 re-derive symbolically, or (C2) is explicitly withdrawn; r is verified
    gauge- and twist-invariant on at least 100 curves; at least one class with both strata at at least 8
    members each is found, or a scope limit is reported with the largest p reached; the single-stratum
    null class verdict is computed and reported BEFORE the real verdict and returns no effect;
    within-vertex variance is established before any between-vertex contrast; the stratified contrast is
    reported at all three factor-base types with the gauge interval and the derived 2/n false-positive
    rate; the B-decay exponent is fitted over at least 4 values with an interval; and all four Groebner
    proxies are reported. Each is decidable from the primary metrics above. Note explicitly: OUTCOME S
    and OUTCOME F are BOTH successes of the measurement; the criterion is completeness, and the
    scientific verdict is read from the falsification criteria below.
  falsification_criterion:
    - >-
      OUTCOME F: the contrast is inside the gauge interval at EVERY factor-base loading, including the
      deliberately loaded one, in at least 2 of 3 classes. THE HYPOTHESIS IS FALSIFIED. This is the
      expected outcome and it is a NEGATIVE AGAINST A NAMED MECHANISM, which is worth more than an
      unnamed null.
    - >-
      The contrast SURVIVES the 2-torsion-EXCLUDED factor base at full size. Mechanism (C2) is refuted
      even if the correlation is real; the honest report is an unexplained within-class stratification by
      r and it must NOT be dressed as (C2).
    - >-
      The effect does not decay at least as fast as 1/B. Not (C2), probably apparatus; halt for instrument
      review rather than report.
    - >-
      The single-stratum null class shows an effect. The rule fires on its own null; nothing is reported.
    - >-
      The symbolic identity disc_{x3} S_3 = 16 f(x1) f(x2) fails, or S_3 is not symmetric as assumed.
      Mechanism (C2) is withdrawn and the inclusion/exclusion arms lose their interpretation.
    - >-
      r is found to vary across gauge draws or across the quadratic twist. r is not the invariant claimed
      and the entire design is void.
    - >-
      NOT a falsification: no class at reachable p containing both strata. That is a SCOPE limit reported
      with the largest p reached, never evidence that r has no effect.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, and the frozen class-selection criterion
    - >-
      raw-result.json carrying every per-vertex, per-seed, per-gauge-draw, per-factor-base-type
      measurement of all four proxies, not summaries, plus r and the 2-volcano height per class member
    - >-
      the single-stratum null class arm's measurements and its verdict timestamped BEFORE the real
      verdict, in the same file as the signal arm
    - >-
      the Stage 0 symbolic re-derivation of the disc identity and the gauge/twist invariance check on at
      least 100 curves
    - >-
      the generator-uniformity check against Binomial(B, r/p) over at least 1000 factor bases per (p, B)
    - >-
      transport certificates for every transported target, re-verified independently by the run wrapper
    - >-
      the pre-registration text with the one-degree minimum effect and the 1/B decay prediction, written
      before the first run and hashed
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is the
      user's gate because it authorizes execution and spends compute.
    - >-
      Stage 0 costs minutes and can remove mechanism (C2) before any Groebner run. It should be approved
      and run first regardless of the rest.
    - >-
      Stage 1's precondition (a reachable class containing both strata with at least 8 members each) may
      fail. The handoff must state that such a failure is a SCOPE limit and not a negative, so the
      distinction is not decided after the fact.
    - >-
      The mechanistic sub-measurement (the exclusion and inclusion arms) is what converts a correlation
      into a mechanism. Without it the contract may report only a correlation, and that restriction must
      be fixed in the handoff.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260807-0a3272
    authored_at: '2026-08-25'
    note: >-
      Every metric, control, prediction and falsification condition is transcribed from the parent
      proposal's predictions, minimal_test, controls, required_metrics, null_object_control and
      falsification_conditions blocks, or from its heuristics H1 and H2. The forced value rB/p and its
      consequence -- that a large effect at a RANDOM factor base is evidence AGAINST (C2) -- come from the
      proposal's own null_object_control and are carried here as pre-registration arithmetic. Boilerplate
      identical across contracts by program rule comes from a fixed table. Budgets come from the parent's
      declared estimated_cost of implementation medium and compute medium, widened for three factor-base
      types times four B values times at least five seeds per vertex times at least eight gauge draws.
  derivation_gaps:
    - >-
      The disc identity is CLASSICAL but unverified in this program and mechanism (C2) rests on it
      entirely. Stage 0 must re-derive it symbolically before any Groebner run, and a coordinator must
      decide in advance whether the line proceeds on (C1) alone if it fails.
    - >-
      The three primes are named as a range with p about 2^13 for enumeration but the exhaustive-class
      stage names p in {4001, 8191, 16381}. These must be reconciled and fixed numerically before
      approval.
    - >-
      The B ladder is unspecified beyond "at least 4 values". It must be declared, and its largest value
      chosen so that the predicted 1/B decay is actually resolvable against the measured within-vertex
      variance -- otherwise the decay test cannot fire.
    - >-
      The gauge interval's construction (which statistic of the 8 draws forms the interval) is not
      specified, and the derived 2/n false-positive rate depends on it. It must be pinned before approval.
    - >-
      What counts as "the same class" operationally -- whether members are all F_p-isomorphism classes in
      the class or only those reachable by the enumeration tool -- is not stated, and a biased enumeration
      would bias the stratum fractions that H1 is scored on.
    - >-
      Whether a 2-torsion-LOADED factor base remains a valid factor base for the relation-collection step
      (loading shrinks the usable base) is not costed. The proposal charges it in prose; the contract needs
      a number before a positive outcome could be interpreted as anything but an artifact of loading.
