  artifact_schema:
    raw_result: 'raw-result.json: experiment, trial_id, run_id, summary (selftest_pass | cells, cells_ok,
      curves_planned | jobs, failed_infrastructure | outcome, flagged_cells, calibration, fraction_valid),
      invalid_reason'
    manifest: 'manifest.yaml /run: id, experiment_id, hypothesis_id, task_id, trial_id, status, validity, code
      (commit, dirty, command, code_sha256 of every .py and .c under implementation/, trial_plan_sha256),
      environment (host, operating_system, python_version, processor_count), inputs, timing, resources
      (peak_rss_bytes, cpu_seconds), result (certificate kind none: exact counts, no logarithm, relation or
      speedup claimed), artifacts'
    jobs_jsonl: 'one record per (cell, block, curve index): cell, block, c, p, a, b_coef, N, b, status (ok |
      failed_infrastructure:<reason>), null (20 counts), pairs, struct, struct_meta, struct_pairs, plant,
      plant_L, plant_internal, plant_feasible, seconds'
    design_json: 'experiment, rule, cells[] (cell, bits, theta, d, b, status, pilot_mean_null, n_curves,
      expected_null_total, powered_by_design)'
    analysis_json: 'experiment, outcome, calibration (n, mean, sd, pass), fraction_valid, flagged_cells,
      secondary_slope_logkappa_per_theta, cells[] (cell, bits, theta, d, b, cls, curves, S, M, V, kappa, ci95,
      z, plant_kappa, plant_z, plant_feasible_all, z_cal, b_matched, powered, planted_recovered, replication)'
    selftest_json: pass, checks[] (bits, c, base, kernel, brute)
    environment_record: manifest.yaml /run/environment; the environment.json in a run directory is written by
      the supervisor, not by run.py
  launcher:
    trial_plan: experiments/EXP-PFDR-ca5e01/trial-plan.json
    driver: experiments/EXP-PFDR-ca5e01/implementation/run.py
    checker: experiments/EXP-PFDR-ca5e01/implementation/check.py
    kernel: experiments/EXP-PFDR-ca5e01/implementation/paircount.c (compiled by run.py into a temporary build
      directory per trial)
    command: python3 experiments/EXP-PFDR-ca5e01/implementation/run.py trial --run-dir {run_dir} --run-id <RUN>
      --trial-id <trial> --plan experiments/EXP-PFDR-ca5e01/trial-plan.json
    checker_command: python3 experiments/EXP-PFDR-ca5e01/implementation/check.py {run_dir}
      experiments/EXP-PFDR-ca5e01/trial-plan.json <trial>
    runbook: experiments/EXP-PFDR-ca5e01/runbook.yaml
    runbook_session: RBS-PFDR-ca5e01
    library:
    - gcc with C11 and unsigned __int128
    - Python 3 standard library and PyYAML (manifest writing)
  assigned_to: executor
  out_of_scope:
  - h >= 3 coincidences and any N above 2^22 or b above 8192
  - any base family other than window and rank-d label GAP with d <= 3
  - any cost table, crossover, extrapolation or comparison against rho
  - any statement about Choi's characteristic-0 theorem or about the security of any deployed curve
