experiment:
  id: EXP-ICEX-b8b2b6
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-ICEX-4ccbaa
  question_id: RQ-ICEX-001
  goal_id: GOAL-ICEX-001
  assigned_to: executor
  approved_by: null

  title: >-
    Review-required instrument audit: is the frozen ICEX exponent observable an
    exponent? Unit-covariance identity, the matched-rho null that excludes 1/2,
    the rho-versus-BSGS separation, the per-coordinate baseline table, the
    Fieller crossover, and the ladder's resolution floor -- on generic baselines
    and synthetic cost oracles only

  objective: >-
    If a later approval and execution authorization are granted, determine
    whether alpha_coord = log(C)/log(ell), as frozen in
    coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
    ic_exponent_protocol.yaml, can carry the verdict named in GOAL-ICEX-001's
    sole completion criterion; and, whichever way that comes out, report the
    sealed ladder's exponent resolution floor and the attempts-per-replica
    requirement, which the goal needs either way. All measured arms are generic
    baseline algorithms with KNOWN exponents; the treatment arm is a synthetic
    cost oracle with programmable (A, a). This is an instrument-design audit.

  what_this_is_not:
  - Not an ICEX measurement. No SDEG, MONO, or RELN feed is read, no C_IC is assembled, no icex_feed package is consumed, and no ICEX cell is sealed.
  - Not an index-calculus computation. No summation polynomial, no factor base, no relation search, no Groebner computation, no descent, no linear algebra over a relation matrix.
  - Not a discrete-logarithm attack, not a cost improvement, not an exponent claim, not an ECDLP lower bound, not a crypto-scale or deployed-scheme claim.
  - Not an amendment, supersession, edit, or invalidation of the frozen ICEX protocol, of GOAL-ICEX-001, of RQ-ICEX-001, of EV-ICEX-001, or of DEC-20260731-015. Only the Coordinator changes official status (AGENTS.md rule 1).
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened and no number below is a measurement.
  - Not a claim that any past ICEX conclusion is contaminated. EV-ICEX-001 records that no ICEX measurement has ever executed.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: that on prime-field short-Weierstrass curves with subgroup orders
      of 8, 10, 12 and 16 bits, using Pollard rho (serial, negation, and van
      Oorschot-Wiener at 2^theta stored points), BSGS with a full baby table,
      and synthetic cost oracles, the frozen observable behaves as derived --
      including the unit-covariance shift, the alpha values returned on the
      matched rho null, the rho-versus-BSGS separation, the measured
      per-coordinate baseline exponents, the Fieller coverage properties, and
      the measured resolution floor. A run CANNOT support any statement about
      index-calculus cost, about ECDLP hardness, about any exponent at any
      scale, about crypto-scale relevance, or about whether the ICEX programme
      should proceed. Toy evidence is never crypto-scale evidence (AGENTS.md
      rule 7), and the negative-result scoping rule (rule 6) binds every
      sentence of any resulting evidence record.

  inputs:
    field_bits: [8, 10, 12, 16]
    ladder_source: >-
      Chosen to EQUAL the frozen protocol's
      fixture_ladder.bit_sizes_toy_ordered [8, 10, 12, 16] exactly, so that the
      resolution analysis applies to the sealed design rather than to a ladder
      of this contract's choosing. Deviating from it would void the deliverable.
    hard_cap_bits: 16
    replicas_per_cell: 3
    attempts_per_replica: [1, 4, 17, 64]
    coordinates_recorded: [group_operations_total, group_operations_add, group_operations_dbl, peak_stored_group_elements, cpu_time_ns, cpu_time_s]
    arms: [rho_serial, rho_negation, rho_vw_theta, bsgs, synthetic]
    rho_vw_theta_values: [0, 0.125, 0.25, 0.5]
    synthetic_grid_a: [0.40, 0.45, 0.50, 0.55, 0.60]
    synthetic_grid_A: [1, 10, 1000, 1000000, 1000000000]
    fieller_eps: 0.05
    monte_carlo_replications: 10000
    master_seed: 4030485
    domain: EXP-ICEX-b8b2b6/v1
    seed_derivation_rule: >-
      Every random value in the package derives from
      seed(label, bits, arm, replica, attempt) := SHA-256 of the ASCII bytes of
      domain || "|" || label || "|" || decimal(bits) || "|" || arm || "|" ||
      decimal(replica) || "|" || decimal(attempt), with digest integers read
      big-endian unsigned. No other entropy source is permitted; os.urandom,
      time-seeded generators, and unseeded random module state are forbidden and
      their presence is an invalidation. The master_seed appears only inside the
      curve/prime construction labels below. THIS RULE EXISTS SO A THIRD PARTY
      REPRODUCES EVERY INSTANCE BIT-FOR-BIT.
    prime_construction: >-
      For each bits value b: h = int(SHA-256(seed("prime", b, "-", 0, 0))),
      L = 2^(b-1), U = 2^b, c0 = L + 1 + 2*(h mod 2^(b-2)); test c_k = c0 + 2k
      for k = 0, 1, ... while c_k < U, in that order; a candidate is prime
      exactly when it exceeds 1, is odd, and has no odd divisor d in
      3, 5, ..., floor(sqrt(c_k)) (deterministic trial division, not a
      probabilistic test). The first prime is p. If c_k reaches U without a
      prime, the cell terminates as CONSTRUCTION_FAILURE; do not wrap, reseed,
      or substitute a nearby size.
    curve_construction: >-
      For t = 0, 1, ..., 65535: a_t = int(SHA-256(seed("curve-a", b, "-", 0, t)))
      mod p, b_t = int(SHA-256(seed("curve-b", b, "-", 0, t))) mod p. Reject if
      (4 a_t^3 + 27 b_t^2) mod p = 0. Otherwise compute #E(F_p) by the character
      sum 1 + sum_{x=0}^{p-1} (1 + chi(x^3 + a_t x + b_t mod p)) with chi(0) = 0,
      chi(y) = 1 iff y^((p-1)/2) mod p = 1, else -1. Accept the first candidate
      that is ordinary (#E mod p != 1) AND whose largest prime factor ell of
      #E satisfies ell > #E / 4, so that a large prime-order subgroup exists.
      Record p, a, b, #E, ell, the cofactor, and a generator P of the
      ell-subgroup. If t = 65535 is rejected, terminate the cell as
      CONSTRUCTION_FAILURE.
    n_definition: >-
      n := log2(ell) computed from the ACTUAL subgroup order ell, never from the
      nominal bit size. The discrepancy log2(ell) - bits is recorded per cell,
      because at 8 bits a 20 per cent shortfall in ell moves n by 0.32 and alpha
      by about 0.02, which is not negligible against the effect sought.
    rho_specification: >-
      r-adding walk with r = 20 partition classes assigned by
      (x-coordinate mod r); Brent cycle detection; each step charged as one
      group operation of the declared type; the FULL step count to collision is
      recorded per attempt with no cap (capping is the subject of the sibling
      contract EXP-ICEX-01a79b and is out of scope here). The negation variant
      canonicalizes each point to min(y, p-y) and walks on ell/2 classes.
    bsgs_specification: >-
      m = ceil(sqrt(ell)); build the full baby table {jP : 0 <= j < m} in a
      dictionary; then giant steps Q - i*(mP) for i = 0, 1, ... until a hit.
      Charge every point addition and doubling; record peak dictionary size in
      group elements.
    synthetic_specification: >-
      C(ell) = round(A * ell^a) exactly, with multiplicative log-normal noise
      exp(N(0, sigma^2)) whose sigma is set per configuration from the MEASURED
      rho log-spread of stage 3 (or to the derived 0.925164 bits when stage 3
      has not yet run, with which value was used recorded per figure). Pure
      arithmetic; no cryptography.

  arms_and_controls:
    treatment: >-
      The synthetic cost oracle over the 5 x 5 (a, A) grid, plus the frozen
      estimator applied to every real arm. The treatment is the ESTIMATOR, not
      an algorithm.
    measured_null: >-
      THE MATCHED POLLARD-RHO CONTROL, whose true group-operation exponent is
      exactly 1/2 by construction and which the frozen protocol itself mandates
      as CTRL-MATCHED-RHO. Forced values derived pre-run in H-ICEX-4ccbaa,
      prediction G2: 0.47822 / 0.48257 / 0.48548 / 0.48911 at n = 8/10/12/16
      under A_rho = 0.886227, or 0.54072 / 0.53257 / 0.52715 / 0.52036 under
      A_rho = 1.253314. THIS NULL CAN GENUINELY FAIL -- if the frozen
      estimator's CIs contain 1/2 at every cell the instrument is vindicated and
      the hypothesis dies.
    positive_control: >-
      TWO, both of which MUST FIRE or no negative may be reported.
      (P1) SLOPE RECOVERY. The OLS slope estimator must return |a_hat - a_true|
      < 0.01 on all 15 synthetic (a, A) cells, independent of A. If it cannot
      recover an exponent that is known by construction, the analysis pipeline
      is broken and nothing may be concluded about the frozen estimator
      (AGENTS.md rule 5).
      (P2) DISAGREEMENT PRODUCIBILITY. On a synthetic arm with memory exponent
      0.30, the frozen rule ("alpha excludes 1/2") and the matched rule
      ("delta > 0 against a serial-rho memory baseline of 0") must return
      OPPOSITE verdicts. If a case constructed to exhibit a disagreement does
      not produce one, the comparison harness is broken.
    graded_controls: >-
      THREE, each with at least 3 interior points and each reporting
      monotonicity pass/fail per adjacent pair.
      (G-A) THE A LADDER: A in {1, 10, 10^3, 10^6, 10^9} at fixed a = 0.50.
      FORCED, at n = 12: the frozen estimator returns 0.5000, 0.7768, 1.3300,
      2.1610, 2.9920 -- strictly increasing with equal steps in log A -- while
      the slope estimator returns 0.500 at all five.
      (G-B) THE THETA LADDER: VW-rho with theta in {0, 1/8, 1/4, 1/2}. FORCED:
      measured memory exponent = theta, strictly increasing; and the number of
      synthetic IC-shaped arms surviving the protocol's coordinatewise-dominance
      check must be monotone non-decreasing in theta, which exhibits the verdict
      moving with a baseline parameter the protocol never pins.
      (G-C) THE ATTEMPTS LADDER: k in {1, 4, 17, 64} attempts per replica.
      FORCED: the slope estimator's CI half-width scales as k^{-1/2}, and the
      resolvable eps = 2.228 * sigma / (sqrt(105 k)) crosses 0.05 between k = 4
      and k = 17. This localises the resolution limit to a specific k rather
      than leaving "the ladder is too short".
    nearby_object_control: >-
      BSGS. It is the closest object to rho where the hoped-for conclusion
      FAILS, and it is included precisely because it cuts against the headline
      in two ways: on the MEMORY coordinate its baseline exponent is exactly
      1/2, so the frozen threshold is RIGHT there; on the FULL-COST coordinate
      KN-TECH-035 puts it at 2/3, so the frozen threshold is too HARSH by 1/6 --
      the opposite direction of error. Both cells are mandatory reports. An
      account predicting a uniform direction of error is refuted here.
    ordering_control: >-
      COMMIT THE NULL BEFORE THE TREATMENT. The full rho arm -- construction
      transcript, per-attempt step counts, measured A_rho, frozen-estimator
      alphas, slope, and the "excludes 1/2" verdict -- is generated, written to
      disk, and SHA-256 hash-committed BEFORE any synthetic treatment arm or any
      BSGS arm is generated. Absence of that commitment, or any modification of
      the null arm after a treatment arm exists, is invalid_measurement.
      Additionally, the frozen decision rule is executed and its label written
      down on the null arm before any treatment label is computed.
    comparability_policy: >-
      All arms at a cell use the SAME curve, the SAME subgroup, the SAME ell,
      the SAME group-operation charging vocabulary, and the SAME unit for each
      coordinate. Cross-cell comparison is permitted only through the declared
      ladder fit. Comparison to any artifact outside this contract -- including
      the frozen ICEX protocol's own hypothetical measurements, EXP-SMTH-*,
      EXP-DS-*, or any SDEG/MONO/RELN package -- is FORBIDDEN and would require
      a separately registered comparator contract naming both domains, streams,
      statistics, and failure dispositions.
    archive_check: >-
      Prior measurements of the same observables in this corpus: NOT AVAILABLE.
      EV-ICEX-001 records that no ICEX measurement or solver campaign was
      executed and that DEC-20260731-015 authorized none. This unavailability is
      recorded as unavailability, not reported as a passed check.

  independent_variables:
  - log2(subgroup order) n in {8, 10, 12, 16}
  - arm in {rho_serial, rho_negation, rho_vw_theta, bsgs, synthetic}
  - cost coordinate and its unit (group ops; peak stored elements; cpu_time in ns and in s)
  - synthetic true exponent a in {0.40, 0.45, 0.50, 0.55, 0.60}
  - synthetic constant A in {1, 10, 10^3, 10^6, 10^9}
  - attempts per replica k in {1, 4, 17, 64}
  - VW storage exponent theta in {0, 1/8, 1/4, 1/2}

  metrics:
    primary:
    - alpha_frozen[arm, cell, coordinate] = log(C)/log(ell), with the within-cell replica CI computed exactly as the frozen protocol's confidence_interval_rule prescribes (Student-t on replica alphas).
    - a_hat[arm, coordinate] = OLS slope of log2(C) on n across the ladder, with its CI and SE.
    - delta[arm_pair, cell, coordinate] = log(C_1/C_2)/log(ell), the unit-invariant matched statistic.
    - Fieller set for log ell* from the pooled two-arm fit, reported as an interval, a complement, or all of R, together with the delta-method interval on identical data.
    - Measured resolution floor: sigma_{log2 C} per arm per cell, SE(a_hat) = sigma/sqrt(105 k), and the implied minimum k for eps in {0.20, 0.10, 0.05}.
    secondary:
    - Measured A_rho, A_bsgs from each arm's own mean operation count, reported against the theory values 1.253314 / 0.886227 / 1.5.
    - R^2 and intercept of the regression of (alpha(n) - 1/2) on 1/n, per arm.
    - Sub-ladder slope spread |a_hat({8,10,12}) - a_hat({10,12,16})| per arm, as the model-adequacy statistic.
    - Empirical mean step count and empirical sd of log2(steps) per cell, against sqrt(pi ell/2) and 0.925164 bits.
    - Per-coordinate measured baseline exponents (rho memory, VW memory at each theta, BSGS memory).
    - Verdict-flip count between the frozen rule and the matched rule on the pre-registered 12-cell synthetic grid.
    - Construction transcript per cell: p, a, b, #E, ell, cofactor, generator, and log2(ell) - bits.

  heuristic_under_test: HEUR-BF-R1

  preregistered_prediction:
    quantity: >-
      alpha_frozen for the matched Pollard-rho arm on the group-operation
      coordinate, at n = 8, 10, 12, 16, together with the unit-covariance shift
      at n = 12 and the rho-versus-BSGS separation.
    formula: >-
      alpha_rho(n) = 1/2 + log2(A_rho)/n, where A_rho = sqrt(pi/2) = 1.253314
      for the plain walk and sqrt(pi/4) = 0.886227 for the negation walk;
      alpha_bsgs(n) - alpha_rho(n) = log2(A_bsgs/A_rho)/n with A_bsgs = 1.5;
      alpha(ns) - alpha(s) = log2(10^9)/n. All three follow from the identity
      alpha = a + log(A)/log(ell) with a = 1/2 exactly.
    source: >-
      DERIVED IN-REPO in H-ICEX-4ccbaa mechanism Parts 1-2 and in
      IDEA-20260805-c8524f. The birthday survival function underlying A_rho is
      HEUR-BF-R1, re-derived rather than cited; NO EXTERNAL SOURCE IS ASSERTED
      and the recalled attribution is not used as authority. Numeric values:
      0.47822 / 0.48257 / 0.48548 / 0.48911 (A = 0.886227); 0.54072 / 0.53257 /
      0.52715 / 0.52036 (A = 1.253314); separation +0.03240 / +0.02592 /
      +0.02160 / +0.01620; unit shift 2.4914 at n = 12.

  scale_relevance:
    tier: toy
    justification: >-
      The DERIVATIONS (unit covariance, the per-coordinate baseline exponents,
      the Fieller construction, the OLS variance identity) are algebraic and
      scale-free, so a confirming measurement is a CHECK OF A DERIVATION rather
      than an extrapolation. The MEASUREMENTS are 8-16 bit generic baselines and
      transfer nowhere: nothing here says how an index-calculus arm behaves,
      what any exponent is, or whether any conclusion holds at crypto scale.
      The resolution-floor result in particular is a statement about THIS
      four-cell ladder and not about exponent estimation in general.
    correspondence: >-
      null -- direct construction. No sampling correspondence is used and none
      is needed, because the arms are run directly at the sizes reported.

  tail_checks:
  - Kolmogorov-Smirnov comparison of the recorded rho step counts against the birthday survival exp(-t^2/(2 ell)) at every cell, reported BEFORE any alpha is compared to a forced value.
  - Extreme-value check: the smallest and largest observed step counts per cell against their predicted order statistics under the birthday model.
  - Sub-ladder refit spread as the curvature diagnostic, on arms whose true exponent is known exactly (rho, BSGS) so that a large spread is unambiguously a ladder failure rather than a model failure.
  - Recomputation of every SESSION-COMPUTED constant in the hypothesis by an independent code path (exact rational or high-precision arithmetic) before it is used as a prediction.

  replication:
    seeds: [4030485]
    seed_expansion: >-
      All per-attempt seeds derive from master_seed 4030485 through the
      seed_derivation_rule above and are listed exhaustively in the sealed
      schedule before execution.
    independent_instances: 4
    planned_runs: 1
    interpretation: >-
      One run is an instrument-audit attempt. It cannot by itself support,
      reject, or validate any ECDLP proposition, any exponent, or any claim
      about index calculus. Its strongest possible output is a scoped statement
      about the behaviour of one formula on generic baselines at four toy sizes.

  budget:
    wall_clock_seconds_per_run: 8400
    stage_wall_clock_seconds:
      stage0: 900
      stage1: 1800
      stage2: 300
      stage3: 3600
      stage4: 1800
    total_cpu_hours: 3
    maximum_memory_gb: 2
    maximum_runs: 1
    no_network: true

  stage_order_and_termination:
    principle: >-
      Strictly cheapest-first, and the cheapest gate is decisive. Stages 0 and 1
      cost ZERO COMPUTE and either can end the entire line before any program is
      written.
    stage0:
      cost: zero compute
      content: >-
        Record, from the Coordinator, (i) whether alpha is intended per-cell or
        across-cell, and (ii) which coordinate is intended primary. Record the
        answer verbatim.
      can_terminate: >-
        YES. If the answer is "across-cell OLS slope on the dimensionless
        group-operation coordinate", defect D1's unit half is VOID BY INTENT,
        the record says so plainly rather than salvaging the headline, and the
        run continues only for D2, D3 and the resolution floor.
    stage1:
      cost: zero compute
      content: >-
        Re-derive by hand, and independently recompute in exact arithmetic,
        every SESSION-COMPUTED value in H-ICEX-4ccbaa: the identity
        alpha = a + log A/log ell; the eight alpha_rho values; the four
        separation values; the unit shifts; S_xx = 35 R; sigma_{log2 X} =
        0.925164 from Var(ln X) = pi^2/24; the attempts floor k >= 17; the
        Fieller leading-coefficient criterion; and the per-coordinate baseline
        table.
      can_terminate: >-
        YES, AND THIS IS THE PRIMARY FALSIFIER. Any disagreement between the
        hand derivation and the stated values halts the line at zero compute and
        routes to a superseding record. A closure at stage 1 is a first-class
        deliverable.
    stage2:
      cost: microseconds
      content: synthetic cost oracle, both estimators, the 5 x 5 (a, A) grid, the A ladder, and the Fieller Monte Carlo.
      can_terminate: >-
        YES via positive control P1. If the slope estimator cannot recover
        a_true on the synthetic grid, the pipeline is broken, the outcome is
        failed_infrastructure, and NO negative may be reported.
    stage3:
      cost: seconds to minutes
      content: real matched rho (serial, negation, VW at four theta) and BSGS on the constructed toy curves; all coordinates; k in {1,4,17,64}.
      can_terminate: NO -- it is the measurement stage; it reports whatever it finds.
    stage4:
      cost: minutes
      content: resolution floor, attempts-per-replica requirement, verdict-flip count, and the deliverable statement required by falsification condition F9 of H-ICEX-4ccbaa.
      can_terminate: NO -- it is the reporting stage and is mandatory under every outcome.

  stopping_rules:
  - Do not execute unless this contract is separately reviewed, approved, frozen, archived, and explicitly authorized by the Coordinator. GOAL-ICEX-001's committed next_action keeps ICEX non-executing and nothing here overrides it.
  - Stop at stage 1 if any hand derivation disagrees with a stated SESSION-COMPUTED value; emit the disagreement as the deliverable.
  - Stop at stage 2 if positive control P1 fails; emit failed_infrastructure and report no negative about anything.
  - Stop before any treatment arm if the null arm's hash commitment is absent.
  - Stop and emit CONSTRUCTION_FAILURE for a cell whose prime or curve construction terminates as specified; do not substitute a nearby size, reseed, or wrap.
  - Stop on exceeding any declared stage wall-clock, CPU, or memory budget; record the exhaustion as an infrastructure outcome.
  - Stop immediately if any stage requires reading an SDEG, MONO, or RELN artifact, assembling a C_IC, or invoking a summation polynomial. That is scope drift and it invalidates the package rather than extending it.

  invalidation_rules:
  - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
  - Any use of entropy outside the declared seed_derivation_rule (os.urandom, time seeding, unseeded random state).
  - Any modification of the committed null arm after a treatment arm exists, or any absence of the null-before-treatment hash commitment.
  - Any comparison to an artifact outside this contract without a separately registered comparator contract.
  - Any missing construction transcript, per-attempt record, or independent recomputation of a preregistered constant.
  - Any report of alpha for a cell whose actual ell was not used in log(ell), or any use of the nominal bit size in place of log2(ell).
  - Any statement in the run report that ascribes an index-calculus, ECDLP-cost, exponent, or crypto-scale meaning to any measurement here.
  - Any adjustment to a preregistered prediction after a corresponding number has been observed. A revision requires a versioned protocol_amendment marked exploratory_only and is never an edit; EV-IC-002 is this program's own precedent for a support verdict retracted because a criterion was revised after the prior criterion was seen to fail.

  success_criterion: >-
    This draft has NO current success outcome because it is not authorized for
    execution. If a later, separately approved and frozen successor is executed,
    its only positive disposition is a complete instrument readout in which:
    (i) stage 1 reproduces every preregistered constant by an independent code
    path; (ii) positive controls P1 and P2 both fire; (iii) the null arm's
    forced values are reported first and its hash commitment precedes every
    treatment arm; (iv) all three graded ladders report monotonicity pass/fail
    per adjacent pair; (v) the nearby-object (BSGS) memory and full-cost cells
    are both reported, including the one that cuts against the headline; and
    (vi) the resolution floor and attempts-per-replica requirement are stated
    numerically. That disposition establishes no ECDLP attack, cost, exponent,
    crypto-scale, or deployed-scheme claim, and no status change for any record.

  falsification_criterion: >-
    The hypothesis H-ICEX-4ccbaa is falsified, in whole or in the named part, by
    any of: alpha proving unit-invariant (G1 returns 0, kills D1); alpha_rho(n)
    flat in n with R^2 below 0.95 (G4, kills the contamination mechanism); every
    alpha_rho CI containing 1/2 at k >= 16 (G2, kills the null-fails headline);
    measured serial-rho memory exponent not 0 or BSGS memory exponent not 1/2
    (G6, kills D2's table); the Fieller and delta-method procedures agreeing at
    b3 = 0 (G7, kills D3). A stage-0 Coordinator statement that alpha was always
    an across-cell slope on the dimensionless coordinate voids D1's unit half BY
    INTENT and must be reported as such rather than worked around.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, import failure, or exhausted budget is
    reported as an INFRASTRUCTURE SIGNAL and is NEVER negative mathematical
    evidence and never evidence about the frozen protocol (AGENTS.md rule 5 and
    the frozen protocol's own OBL-TERMINAL-VOCABULARY). Specifically: the
    environment was probed on 2026-08-05 and numpy 2.4.6 imports while sympy and
    sage do NOT (ModuleNotFoundError). Every stage MUST run on the Python 3
    standard library alone; numpy is optional. If any stage is found to require
    an absent dependency, that is an INFRASTRUCTURE REQUEST to the Coordinator
    and not an experiment, and the stage is reported as not run rather than as
    failed. A failed positive control is likewise an instrument outcome: it
    blocks every negative conclusion in the package.

  required_artifacts_if_later_authorized:
  - Frozen approved specification and a freeze receipt binding its SHA-256.
  - Stage-0 record of the Coordinator's reading, verbatim, with its timestamp.
  - Stage-1 hand derivation and independent exact-arithmetic recomputation of every preregistered constant, with the two outputs side by side.
  - Construction transcript per cell (p, a, b, #E, ell, cofactor, generator, log2(ell) - bits) and its SHA-256.
  - Null-arm hash commitment recorded before any treatment arm exists.
  - Per-attempt raw records for every arm, cell, replica, and attempt, with seeds, terminal status, and all recorded coordinates.
  - Kolmogorov-Smirnov survival goodness-of-fit output per cell, reported before any alpha comparison.
  - All three graded-ladder tables with per-adjacent-pair monotonicity pass/fail.
  - Fieller Monte Carlo output under both normal errors and errors resampled from measured rho log-residuals.
  - The resolution-floor table (sigma per arm per cell, SE(a_hat), minimum k for eps in {0.20, 0.10, 0.05}).
  - Manifest, environment and dependency versions, exact command, git commit and dirty-tree state, requested policy, backend, resolved model identifier and whether it was probe-verified, reasoning effort, stdout, stderr, timestamps, and resource measurements (AGENTS.md artifact policy).
  - Execution report, then a Coordinator snapshot archive, then independent validation and red-team review before any evidence record is written.

  approval_requirements:
  - Independent review confirms that the null arm can genuinely fail, that both positive controls can genuinely fail, and that no stage reads an SDEG/MONO/RELN artifact or assembles a C_IC.
  - Independent review confirms that the preregistered constants are derived rather than fitted, and that stage 1 can terminate the line.
  - Coordinator separately approves and freezes a successor contract without editing this draft.
  - Coordinator separately authorizes execution, since GOAL-ICEX-001's next_action currently keeps ICEX non-executing (DEC-20260731-015 / EV-ICEX-001).

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved; only the Coordinator approves an experiment (AGENTS.md rule 1).
