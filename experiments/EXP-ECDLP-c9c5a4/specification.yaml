# EXP-ECDLP-c9c5a4
# Cover counts and band products. No large graph.
# Approved by DEC-20261002-eace37.
experiment:
  id: EXP-ECDLP-c9c5a4
  hypothesis_id: H-ECDLP-3db46b
  source_idea: IDEA-20260923-c2a85f
  question_id: RQ-ECDLP-78dbc5
  version: 1
  title: Cover counts and band products
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-eace37
  objective: >-
    Check the depth-capped covers, the cycle constant, the band
    products, and the series bound on 1 minus 1/e.
  inputs:
    path_n: 8
    path_stored: [3, 5]
    path_cap: 4
    cover_sizes: [4, 5]
    intersection: 3
    union: 6
    size_sum: 9
    basin_sizes: [4, 2]
    uncovered: 2
    path_truncated_sum: 15
    path_cost_num: 5
    path_cost_den: 2
    path_table: 2
    path_constant_num: 25
    path_constant_den: 16
    path_gap_num: 31
    path_gap_den: 400
    cycle_n: 8
    cycle_stored: 0
    cycle_cap: 3
    cycle_truncated_sum: 18
    cycle_cost_num: 9
    cycle_cost_den: 2
    cycle_constant_num: 81
    cycle_constant_den: 32
    cycle_gap_num: 713
    cycle_gap_den: 800
    oracle_num: 41
    oracle_den: 25
    band_low_num: 451
    band_low_den: 500
    band_low_gap_num: 1
    band_low_gap_den: 500
    band_high_num: 697
    band_high_den: 500
    band_high_gap_num: 3
    band_high_gap_den: 500
    falsifier_num: 779
    falsifier_den: 500
    spacing_ratio_num: 3
    spacing_ratio_den: 8
    published_num: 16
    published_den: 5
    twice_gap_num: 2
    twice_gap_den: 25
    series_k: 8
    series_num: 109601
    series_den: 40320
    one_minus_low_num: 69281
    one_minus_low_den: 109601
    one_minus_high_num: 5611771
    one_minus_high_den: 8877691
    bound_low_num: 632
    bound_low_den: 1000
    bound_high_num: 633
    bound_high_den: 1000
    lambda_costs_num: [5, 101, 11]
    lambda_costs_den: [2, 40, 4]
    rung_values: [1, 2, 4, 8, 16]
    rung_product: 1024
  controls:
    - >-
      The path union is 6. The size sum is 9. Reporting the union as
      9 invalidates the run.
    - >-
      The cover sizes are 4 and 5. The basin sizes are 4 and 2.
      Reporting the cover sizes as 4 and 2 invalidates the run.
    - >-
      The low band product is 451/500. Reporting it as 9/10
      invalidates the run.
    - >-
      The spacing ratio is 3/8. Reporting it as 1/2 invalidates the
      run.
    - >-
      Twice 41/25 is 82/25, which exceeds 16/5 by 2/25. Reporting
      those two values as equal invalidates the run.
    - >-
      1 minus 1/e lies strictly above 632/1000 and strictly below
      633/1000. Reporting it as 63/100 invalidates the run.
    - Two counting routes. They must not import each other.
  independent_variables:
    - graph in {path, cycle}
    - route in {forward, backward}
  metrics:
    primary:
      - cover_union
      - band_low
      - implementations_agree
    secondary:
      - path_constant
      - spacing_ratio
      - series_bound
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The union 6 and the product 451/500.
    formula: >-
      A point is covered when some iterate of order at most the cap
      lands in the stored set. The cost is the mean truncated distance
      divided by the covered fraction. The constant is table size
      times the square of the cost, divided by the point count. The
      band products are 11/20 and 17/20 times 41/25. The series bound
      uses the partial sum through k = 8 and a geometric tail.
    source: >-
      IDEA-20260923-c2a85f states the cover and the band, read
      2026-10-02. The counts were computed in this design session.
      That computation is not a run. No large graph was built.
  scale_relevance:
    tier: toy
    justification: Two graphs of 8 points. No transfer to a random mapping.
    correspondence: null
  tail_checks:
    - The cycle row is required. Stopping after the path and still reporting the constant 81/32 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other counting route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the path union is reported as 9, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The path union is reported as 9.
    - The cover sizes are reported as 4 and 2.
    - The low band product is reported as 9/10.
    - The spacing ratio is reported as 1/2.
    - 82/25 is reported as equal to 16/5.
    - 1 minus 1/e is reported as 63/100.
    - A graph larger than 8 points is built.
  success_criterion: >-
    Both runs agree that the path covers have sizes 4 and 5, the
    union is 6, the cost is 5/2, the constant is 25/16, the cycle
    constant is 81/32, the band products are 451/500 and 697/500, the
    spacing ratio is 3/8, and 1 minus 1/e lies strictly between
    632/1000 and 633/1000.
  falsification_criterion: >-
    The runs agree, the path union stays 6, and any factor differs
    from the preregistered table.
  required_artifacts:
    - experiments/EXP-ECDLP-c9c5a4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-c9c5a4/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-c9c5a4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-c9c5a4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-c9c5a4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-c9c5a4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any functional graph larger than 8 points.
    - Any measured hub constant or attack cost.
    - Any claim that a first-hit table is improved.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
