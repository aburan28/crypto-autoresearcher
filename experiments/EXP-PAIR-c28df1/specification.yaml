# EXP-PAIR-c28df1
# Class-polynomial traces at the smallest split and inert prime
# in each of the 16, 20, 24, and 28 bit bins.
# Frozen before any run. The table is a prediction, not a result.
experiment:
  id: EXP-PAIR-c28df1
  hypothesis_id: H-PAIR-48510d
  source_idea: IDEA-20261005-3a18d1
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  version: 1
  title: >-
    Named 16-bit through 28-bit trace verdicts for the class polynomial
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-295703
  objective: >-
    Recompute the three class polynomials and score the 12 split
    cells and 12 inert cells by point counting both twists.
  inputs:
    weierstrass: >-
      j = 0 gives y^2 = x^3 + 1. j = 1728 gives y^2 = x^3 + x.
      Otherwise k = j / (1728 - j) and the model is
      y^2 = x^3 + 3*k*x + 2*k.
    bit_bin: >-
      A B-bit prime satisfies 2^(B-1) <= p < 2^B. The split
      prime is the smallest prime in that interval with
      Kronecker symbol (D/p) = 1 for which 4p = t^2 - v^2 D
      has positive integers t and v. The inert prime is the
      smallest prime in that interval with (D/p) = -1.
    discriminants:
      - {D: -7, class_number: 1}
      - {D: -23, class_number: 3}
      - {D: -47, class_number: 5}
    split_cells:
      - {D: -7, bits: 16, p: 32771, t: 164, v: 122, roots: 1}
      - {D: -7, bits: 20, p: 524309, t: 1238, v: 284, roots: 1}
      - {D: -7, bits: 24, p: 8388619, t: 2924, v: 1890, roots: 1}
      - {D: -7, bits: 28, p: 134217757, t: 22590, v: 1948, roots: 1}
      - {D: -23, bits: 16, p: 32783, t: 72, v: 74, roots: 3}
      - {D: -23, bits: 20, p: 524389, t: 166, v: 300, roots: 3}
      - {D: -23, bits: 24, p: 8388637, t: 4994, v: 612, roots: 3}
      - {D: -23, bits: 28, p: 134217823, t: 6872, v: 4614, roots: 3}
      - {D: -47, bits: 16, p: 32843, t: 252, v: 38, roots: 5}
      - {D: -47, bits: 20, p: 524341, t: 758, v: 180, roots: 5}
      - {D: -47, bits: 24, p: 8388619, t: 4276, v: 570, roots: 5}
      - {D: -47, bits: 28, p: 134218171, t: 11644, v: 2922, roots: 5}
    inert_cells:
      - {D: -7, bits: 16, p: 32779, roots: 1, norm_hits: 0}
      - {D: -7, bits: 20, p: 524341, roots: 1, norm_hits: 0}
      - {D: -7, bits: 24, p: 8388617, roots: 1, norm_hits: 0}
      - {D: -7, bits: 28, p: 134217779, roots: 1, norm_hits: 0}
      - {D: -23, bits: 16, p: 32771, roots: 1, norm_hits: 0}
      - {D: -23, bits: 20, p: 524341, roots: 1, norm_hits: 0}
      - {D: -23, bits: 24, p: 8388617, roots: 1, norm_hits: 0}
      - {D: -23, bits: 28, p: 134217757, roots: 1, norm_hits: 0}
      - {D: -47, bits: 16, p: 32779, roots: 1, norm_hits: 0}
      - {D: -47, bits: 20, p: 524347, roots: 1, norm_hits: 0}
      - {D: -47, bits: 24, p: 8388617, roots: 1, norm_hits: 0}
      - {D: -47, bits: 28, p: 134217757, roots: 1, norm_hits: 0}
    predicted_split_matches: 12
    predicted_split_mismatches: 0
    predicted_inert_norm_hits: 0
    predicted_degree_mismatches: 0
    predicted_counter_disagreements: 0
    predicted_counter_checks: 36
  controls:
    - >-
      The class-number-1 discriminant -7. A degree or trace
      mismatch there invalidates the pipeline.
    - >-
      Two constructions of each H_D must agree as elements of
      Z[X] before traces are scored. Disagreement invalidates
      that discriminant.
    - >-
      Second counter. On every split root, the sage cardinality
      of the Weierstrass model and the pari cardinality of that
      same model must agree. A disagreement voids the cell.
    - >-
      Both twists are counted on every split cell. Scoring one
      model only is invalid.
  independent_variables:
    - arm in {split, inert}
    - bit length in {16, 20, 24, 28}
  metrics:
    primary:
      - split_matches
      - inert_norm_hits
    secondary:
      - degree_minus_class_number
      - counter_disagreements
      - root_counts
  heuristic_under_test: HEUR-CM-SPLIT-1
  preregistered_prediction:
    quantity: >-
      Split matches 12 of 12. Inert norm hits 0 of 12, with one
      root on each inert cell. Degree mismatches 0. Sage and pari
      agree on all 36 split-root models.
    formula: >-
      A split match means 4p = t^2 - v^2 D and the two twist
      traces are exactly t and -t. An inert hit means
      (trace^2 - 4p) / D is a nonnegative square.
    source: >-
      IDEA-20261005-3a18d1, specialized to the cells named in
      inputs. The counts were computed in the design session
      and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      The largest prime is 134218171, which is 28 bits. Class
      numbers are 1, 3, and 5. No transfer to a cryptographic
      discriminant or to an unnamed prime in the same bin.
    correspondence: null
  tail_checks:
    - >-
      The cell D = -47, bits = 28, p = 134218171, t = 11644 has
      five roots. Dropping that cell invalidates the split arm.
    - >-
      Each inert cell has one root. Treating a present root as
      an empty failure is not the inert prediction.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. One manifest per arm. The second instance
      is the second construction of H_D, not a second sample.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two valid manifests, one per arm.
    - Do not add a discriminant, a bit length, or a prime.
  invalidation_rules:
    - The two constructions of H_D disagree.
    - Degree differs from the class number.
    - 4p is not t^2 - v^2 D on a listed split cell.
    - The second counter disagrees on a split root.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    Both manifests are valid. Degree mismatches are 0. Split
    matches are 12 and mismatches are 0. Inert norm hits are 0
    and each inert cell has one root. Counter disagreements are
    0 across 36 split-root models.
  falsification_criterion: >-
    The polynomials agree, the degrees match, the second counter
    agrees, and a split cell has twist traces other than {t, -t},
    or an inert root solves the norm equation.
  required_artifacts:
    - experiments/EXP-PAIR-c28df1/runs/<run-id>/command.txt
    - experiments/EXP-PAIR-c28df1/runs/<run-id>/stdout.txt
    - experiments/EXP-PAIR-c28df1/runs/<run-id>/stderr.txt
    - experiments/EXP-PAIR-c28df1/runs/<run-id>/result.json
  assigned_to: executor
  out_of_scope:
    - The height regression of EXP-PAIR-894a7f.
    - The primes at most 1811 named in EXP-PAIR-ef9af7.
    - Any prime that is not one of the 24 named cells.
    - A pairing value, an embedding degree, or an MOV cost.
    - A discrete logarithm.
    - Editing any other PAIR contract.
