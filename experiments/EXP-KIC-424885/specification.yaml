  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/readiness_receipt.json
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/control_receipts.jsonl
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/control_replay.json
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/receipts.jsonl
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/raw_outputs.tar.gz
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/raw_manifest.json
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/cnf_xor_manifest.json
