experiment:
  id: EXP-KIC-424885
  hypothesis_id: H-KIC-9416d9
  version: 1
  title: N7 affine-flat SAT/XOR decomposition discriminating control
  status: approved
  objective: Measure complete cold decomposition/replay cost of A against identical-domain and null controls.
  inputs:
    normative_protocol: &id001
      path: research/golden_factor_base_sat_20260921/design_completion.json
      sha256: 1419bc2107601476c4fd44f90d67475ec15e98eef68a35888df9abfaed0aa3e5
    proposal: ledger/proposals/IDEA-20260921-f4a758.yaml
    source_context: research/golden_factor_base_sat_20260921/inputs/ledger_refresh_bindings.json
  controls:
  - explicit_domain_same_B
  - same_cardinality_random_orbit_null
  - direct_cold_MITM
  - true_UNSAT_domain_G_negG
  independent_variables:
  - encoding_arm
  metrics:
    primary:
    - complete cold decision wall per target
    - held-out paired flat/explicit_same_B,flat/direct_mitm,flat/null_sat wall ratios
    secondary:
    - static prefix contradiction fraction and paired difference
    - exact candidate/null coverage over70nonzero subgroup targets
    - raw per-process wait4 CPU/RSS and explicitly scoped descendants
    - field/base/encoding/solver/verification timings
    - CNF/XOR counts and diagnostic rounds/assignments
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Finite effect on the fixed valid N7 held-out panel
    formula: All8held-out cases completed valid for all4arms; candidate full-nonzero-subgroup exact-three
      coverage>=null coverage; median paired flat/explicit,flat/direct,flat/null cold walls each<=0.80
      and each fixed paired-bootstrap95% upper<1; prefix paired median improvement>=0.10 with>=4eligibleheldout
      cases. Bootstrap Random("GFB-SAT-N7-v1-bootstrap"),10000 resamples of8 paired case indices, type7
      endpoints. No reselection.
    source: Proposal A refined by Coordinator-adopted normative completion; no theorem-derived speed prediction.
  scale_relevance:
    tier: toy
    justification: N7 permits exhaustive group and model replay
    correspondence: null
  tail_checks:
  - all_models_group_replayed
  - unsat_control_exact
  - timeout_or_missing_eligibility_inconclusive
  - static_prefix_not_CDCL_pruning
  replication:
    seeds:
      flat: For candidate c=00..63, t=0,1 and z=a,b,c, v=SHA256("GFB-SAT-N7-v1-flat-CC-T-Z")little mod128,
        with CC two decimal digits and T/Z substituted literally. v is a normal-basis coefficient mask.
        Convert to polynomial coordinates. Reject candidate if either b or c vector is zero or b=c. Define
        both affine2flats and all7 Frobenius shifts.
      'null': Scan i=000..255. Set x=SHA256("GFB-SAT-N7-v1-null-III")little mod128, III three decimal
        digits. Skip x=0 or no rational odd-subgroup lifts; canonicalize its x-Frobenius orbit by minimum
        integer and require full length7. Keep new orbits in arrival order. After each new orbit, inspect
        its pairs with earlier accepted orbits in earlier-arrival order; choose the first pair whose unordered
        representative set differs from candidateB. Use both signs of all14xvalues, validate all28 subgroup
        points. If no pair after256 labels, record NULL_INADMISSIBLE and launch no target workers. This
        avoids an artificially expensive full subgroup catalogue in the timed null constructor.
      targets: Hash-rank integers d=1..70 by SHA256("GFB-SAT-N7-v1-target-D"), where D is decimal with
        no padding; take first16. This gives distinct public-known-answer scalars. Compute Q=[d]G outside
        timing as given inputs. Send only curve/Q/base recipe/solver configuration to cold workers.
      solver_random_seed: 0
      bootstrap_seed: GFB-SAT-N7-v1-bootstrap
    independent_instances: 16
    holdout_instances: 8
    adaptation_after_target_observation: false
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 134
    maximum_workers: 3
    worker_note: 70 untimed control pipeline workers +64scientific pipeline workers; driver+oneworker+atmostoneCMS
      child; one active compute worker. Watchdogs in normative contract protect processes, not campaign
      spending.
  stopping_rules:
  - 70 control pipeline workers +64 scientific pipeline workers =134 fixed outerworkers; controls68 CMS
    descendants, science at most48 descendants with exact planned count calculated from frozen targets/base
    membership before StageB. No replacement/retries. Unit tests and post-run prefix diagnostics separately
    recorded, not added to scientific timing sample.
  - 120s perouterworker including solving;30s CMS internal cap plus outerwatchdog.480s each native correctness/diagnostic
    phase as explicit implementation watchdog, preserving progress; timeout is censored. No campaign spending
    cap.
  - No replacement or retry; source/model/domain/group failure stops later launches pending additive protocol/implementation
    correction.
  invalidation_rules:
  - Any purported SAT model violating original CNF/XOR, point-domain or group equations
  - Any supposedly refuted prefix with an exact canonical group completion
  - Any use of target scalar or full subgroup lookup in cold workers
  - Missing required wall/wait4 CPU/RSS with valid units invalidates cost comparison; short-lived unsampled
    footprint is not zero memory.
  success_criterion: All native/external control verdicts agree, exact same-B SAT/direct science outcomes
    agree, all models/certificates valid, complete fixed receipts and positive cost telemetry. All8held-out
    cases completed valid for all4arms; candidate full-nonzero-subgroup exact-three coverage>=null coverage;
    median paired flat/explicit,flat/direct,flat/null cold walls each<=0.80 and each fixed paired-bootstrap95%
    upper<1; prefix paired median improvement>=0.10 with>=4eligibleheldout cases. Bootstrap Random("GFB-SAT-N7-v1-bootstrap"),10000
    resamples of8 paired case indices, type7 endpoints. No reselection.
  falsification_criterion: Only a complete valid effect panel that fails its specified finite thresholds
    narrows this tested N7 implementation. Model/domain/group discrepancies are implementation-invalid;
    timeouts, resource failures, incomplete panel and insufficient prefix eligibility are inconclusive.
  required_artifacts:
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/source_closure.json
  - experiments/EXP-KIC-424885/runs/RUN-KIC-c2b1b7/basis_manifest.json
