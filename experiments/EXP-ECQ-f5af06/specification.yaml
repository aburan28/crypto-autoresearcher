experiment:
  id: EXP-ECQ-f5af06
  version: 1
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. No hypothesis of this program's own is under test. This contract does three
    things to an EXTERNAL object: it certifies a claim someone else made (part A), it tries to
    falsify that same claim (part B), and it triages the object's neighbours (part C). Naming an
    H-ECQ-* record here would invite exactly the inference the runs cannot support -- that a
    mechanism of ours was tested. The governing question is RQ-ECQ-e9b361 and the governing goal is
    GOAL-ECQ-2298dc; a mechanism from the IDEA-20260824-* set gets its own hypothesis record when it
    is dispatched, and not before.
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  batch_id: null
  batch_id_note: >-
    No BATCH-* identifier was minted for this campaign; the task runs directly under
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/. See GOAL-ECQ-2298dc
    current_batch_note.

  title: >-
    Certify the live rank->=31 record curve (ICARM no. 302), test the board's own rank-exactly-31
    claim against a frozen search box, and triage its quadratic twists against a matched
    near-neighbour null

  contract_provenance: >-
    PRE-REGISTERED. AUTHORED BEFORE ANY RUN OF THIS EXPERIMENT EXISTS AND BEFORE THE PRODUCER
    STARTS. This contract is frozen at the commit that introduces it. TASK-20260824-261bb4 must not
    start until that commit exists and is pushed to a branch with an open PR against main; any
    change to this file after the producer starts is a versioned protocol_amendment record, never an
    edit. The task was ONCE DISPATCHED WITHOUT THIS FILE, on 2026-08-24, and the executor refused it
    as `specification_error` and started nothing. That refusal was correct and is recorded as
    correct behaviour on ledger/handoffs/TASK-20260824-261bb4.yaml under `procedure_deviation`; the
    fault is the orchestrating session's. This file is the remedy, and it is the reason the task is
    now dispatchable.

  status: approved
  approved_by: coordinator
  approved_at: '2026-08-24'
  assigned_to: executor
  assigned_task_id: TASK-20260824-261bb4

  objective: >-
    ANSWER THREE BOUNDED QUESTIONS ABOUT ONE EXTERNAL CURVE, EACH WITH ITS OWN STOPPING RULE.
    (A) CAN THIS PROGRAM INDEPENDENTLY CERTIFY rank(ICARM no. 302) >= 31, in exact arithmetic, from
    the 31 published witness points? This is a BASELINE CAPABILITY CHECK before anything else: IF 31
    CANNOT BE REPRODUCED, 32 IS NOT CLAIMABLE BY THIS PROGRAM AT THIS SCALE, and that is a
    reportable finding about the instrument rather than about the mathematics.
    (B) IS THERE A 32ND INDEPENDENT POINT ON no. 302 INSIDE A SEARCH BOX FROZEN IN THIS CONTRACT?
    This is a cheap FALSIFICATION TEST OF THE BOARD'S OWN CLAIM, which reads "BSD + GRH certified to
    rank 31" -- if that claim is accurate then the rank IS exactly 31 and no such point exists. The
    prior is recorded below, before the run, precisely so the expected negative cannot later be
    dressed up as a discovery.
    (C) DO THE QUADRATIC TWISTS OR THE NEAR NEIGHBOURS OF no. 302 CARRY RANK? Rank is NOT
    twist-invariant: the 31 points do not transfer to E^(D), and E^(D) has its own rank, which may be
    anything. Cheap Mestre-Nagao triage over a frozen discriminant range, then an EXACT height and
    independence gate on a frozen number of survivors, against a matched null.
    BUDGET NOTE STATED IN THE OBJECTIVE AS THE TEMPLATE REQUIRES: the memory cap is 3 GB, BELOW the
    templates/research-records.md floor of 8 GB. The floor is stated for descent- and
    Groebner-class work; every computation here is stdlib integer and Fraction arithmetic on numbers
    of at most a few hundred digits, plus F_l linear algebra on a matrix of at most 31 rows, and
    peak resident memory is expected in the tens of megabytes. 3 GB is the budget the dispatching
    Coordinator was given and it is roughly two orders of magnitude above the expected requirement.
    If it nevertheless binds, that is an INFRASTRUCTURE OUTCOME that bounds coverage and is never
    negative mathematical evidence (AGENTS.md rule 5).

  standing_negative: >-
    RANK >= 31 OVER Q IS THE LIVE WORLD RECORD AND IT IS CLAIMED, by ICARM curve no. 302, posted
    2026-08-23. IT IS NOT UNCLAIMED, and no artifact of this experiment may describe it as such --
    an earlier session in this program made exactly that error. NOTHING IN PARTS A OR C IS PROGRESS
    TOWARD RANK 32 OVER Q. Part A certifies someone else's curve, which is an external positive
    control and never this program's own result. Part C searches objects whose expected certified
    rank in the frozen box is zero. Only a part-B or part-C positive, meeting the claim bar in full,
    would be a new result, and its prior is recorded below as low. No ECDLP claim, no speedup claim
    and no asymptotic-complexity claim is made or implied, so the four asymptotic promotion gates of
    agents/coordinator.md are not engaged.

  proof_orientation: not_applicable
  proof_orientation_reason: >-
    No theorem, asymptotic bound, reduction or closure argument is proposed, so the
    docs/inventor-protocol.md section 8 proof_search_map gate does not fire. The certificate
    hierarchy used here is not new: it is the published reduction / mod-l independence argument
    already implemented and used in this repository, cited in inputs below.

  inputs:
    target_curve: >-
      coordination/goals/GOAL-ECQ-2298dc/inputs/ICARM-302.json -- ICARM curve no. 302, five
      a-invariants and 31 witness points as exact rationals. VERIFIED READ-ONLY BY THE EXECUTOR
      BEFORE REFUSAL: the file parses, and carries exactly 31 witness points and exactly 5
      a-invariants.
    target_curve_provenance_caveat: >-
      CARRIED FORWARD, NOT DROPPED. The file's own `_provenance` field records that its contents
      were retrieved on 2026-08-24 from https://elliptic-rank.icarm.cloud/curve/302 THROUGH A
      SUMMARISING FETCH TOOL, NOT BY DIRECT PAGE-SOURCE INSPECTION, and that the board comment
      string "BSD + GRH certified to rank 31, found by Claude, Levent Alpoge, and Ava Howell" is
      unverified at source. CONSEQUENCES THAT BIND THIS EXPERIMENT. (1) Every artifact that repeats
      the rank-31 claim, the naive height, the submitter or the date attributes it to that fetch and
      repeats the caveat. (2) The a-invariants and the points are NOT trusted as published: they are
      re-derived through on-curve verification and exact recomputation of c4, c6 and the
      discriminant, and a mismatch is a blocking defect (see controls). (3) A transcription error in
      the fetched data would surface as an on-curve failure, which is why that check is not skipped
      even though membership is a cited input.
    membership_already_verified_do_not_recommission: >-
      MEMBERSHIP IS AN INPUT, NOT WORK COMMISSIONED HERE. The orchestrating session verified on
      2026-08-24, in exact rational arithmetic, that ALL 31 LISTED POINTS SATISFY THE WEIERSTRASS
      EQUATION, and recomputed log max(|c4|^3, c6^2) = 468.2771 -- matching the board's published
      naive height -- and log|disc| = 453.0469. That computation is NOT backed by a committed run
      record and is cited with that limitation stated. It is cited rather than re-run because the
      executor correctly declined to re-verify it without an approved contract, and because
      re-running a check to reproduce a number already in hand is not what this budget is for.
      RECONCILIATION WITH PART A, WHICH IS NOT OPTIONAL: the exact certifier performs its own
      on-curve check as step (0) of its own algorithm and cannot be asked not to, so the numbers
      will be recomputed as a side effect. They are therefore COMPARED, not assumed -- see
      CTL-CITED-INPUT-AGREEMENT.
    certifier: >-
      coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/scripts/exact_certify.py
      (identical earlier copy at
      coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-01d3d9/pipeline/exact_certify.py).
      EXECUTOR-VERIFIED PRESENT AT BOTH PATHS. Stdlib-only, no PARI, no floating point, no analytic
      rank, no Selmer bound, no regulator. Its documented basis is the reduction / mod-l
      independence argument: an exact torsion bound from gcd of #E(F_p) over good p (Silverman
      VII.3.1, VII.3.4); the homomorphism psi_p(X) = (N_p / l) X killing l*E(F_p) and the torsion of
      E(Q) for l coprime to the torsion bound; and F_l-rank of the stacked images. REUSE IT. Do not
      rewrite it. If it must be extended (see part A search bounds) the extension is a NEW FILE under
      the task directory that imports it, so the reused instrument stays byte-identical and the
      diff is visible.
    frozen_board_snapshot: >-
      coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json, sha256
      118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59, retrieved 2026-08-23T00:43Z;
      frontier at coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json. THE SNAPSHOT
      PREDATES CURVE NO. 302 (posted 2026-08-23) and will not contain it. That is a fact about the
      timeline and must be reported as one; it is not a defect and not a licence to re-baseline.
    state_of_the_art_records: >-
      ledger/ideas/IDEA-20260824-155411.yaml and the seven sibling IDEA-20260824-* records, for the
      retrieved state of the art and its provenance caveats.
    prior_contract_for_shape: >-
      experiments/EXP-ECQ-0e0cbb/specification.yaml -- EXECUTOR-VERIFIED TO EXIST. Read its
      run_path_requirement and its coverage clause; both are reproduced and tightened here.
    environment_precheck: >-
      The executor verified read-only, before refusing, that cypari imports and round-trips
      ellinit, and that the working tree was clean at 62d350ad5. cypari/PARI is NOT required by any
      certification step of this contract and MAY NOT appear in one; it is permitted only for the
      Mestre-Nagao triage of part C, where nothing is certified.

  independent_variables:
  - the 31 witness points of ICARM no. 302 (part A -- the subset certified is the readout)
  - the x-coordinate search box, frozen below (part B)
  - the squarefree twisting discriminant D over a frozen range (part C)
  - the additive perturbation of a6, over a frozen range (part C null object)

  protocol:

    part_a_certify_rank_31:
      question: >-
        Can this program certify, in exact arithmetic and independently of whoever produced them,
        that the 31 published witness points of ICARM no. 302 are independent in E(Q) modulo
        torsion -- and hence that rank E(Q) >= 31?
      why_it_is_first: >-
        BASELINE CAPABILITY CHECK. A program that cannot certify 31 cannot certify 32. Every claim
        this campaign could ever make about rank >= 32 rests on an instrument that must first be
        shown to work at 31 on a curve where the answer is asserted by others. Running it second, or
        skipping it, would leave any later positive resting on an uncalibrated instrument.
      method: >-
        Run the exact certifier on (a-invariants, 31 points). NO FLOATING POINT ANYWHERE IN THE
        DECISION -- not in the torsion bound, not in the point counts, not in the linear algebra, and
        no Neron-Tate height pairing matrix, whose positive-definiteness cannot be decided in
        floating point and is not admitted here in any form. The certificate must record: the
        torsion bound and the primes it was taken over; the prime l used; every good prime p used;
        the F_l-rank of the stacked matrix; and the indices of the points certified independent.
      search_bounds_are_the_executors_to_raise_and_must_be_recorded: >-
        The certifier's defaults are max_prime = 1500, torsion_primes = 8, max_good_primes = 60 and
        l in (2, 3, 5, 7, 11, 13). E(F_p)[l] has F_l-rank at most 2, so each usable prime contributes
        at most 2 columns and AT LEAST 16 USABLE PRIMES ARE NEEDED to reach F_l-rank 31; a prime is
        usable only if it is good, if l divides #E(F_p), and if every point is p-integral, and the
        witness points carry denominators including 4, 9, 25, 49, 484, 841, 961, 8922169 and
        3630906049, which removes primes 2, 3, 5, 7, 11, 23, 29, 31 and more from the pool. THE
        DEFAULTS MAY THEREFORE BE INSUFFICIENT AND THE EXECUTOR MAY RAISE THEM. These are SEARCH
        BOUNDS, not claims: raising them changes nothing about what is proved. Record the exact
        values used in the manifest inputs and in certification.json. Note that #E(F_p) is counted in
        O(p) by the certifier, so max_prime is a real cost driver and raising it is charged to the
        part-A time cap.
      stopping_rule: >-
        HARD TIME CAP 1500 s FOR PART A. On reaching it, or on the certifier returning a rank below
        31, STOP AND REPORT -- A PARTIAL CERTIFICATION IS A REPORTABLE RESULT, NOT A FAILURE. Report
        (i) the LARGEST INDEPENDENT SUBSET CERTIFIED as k of 31, with the point indices, (ii) the
        WALL CLOCK consumed, (iii) the search bounds actually reached, and (iv) the certifier's own
        inconclusiveness statement verbatim. THE CERTIFIER ALREADY SAYS THE ONLY THING THAT MAY BE
        SAID ABOUT k < 31 AND ITS WORDING BINDS: the remaining points "are INCONCLUSIVE (they may be
        dependent, or the search bound may be too small) -- this is not evidence of low rank". A
        partial k MAY NOT be reported as evidence that no. 302 has rank below 31, and MAY NOT be
        reported as a defect in the board's claim. It is a measurement of THIS INSTRUMENT at THIS
        budget.
      certificate_kind: independence_certificate
      what_a_full_success_means: >-
        k = 31 establishes that this program can certify independence at record scale, and
        INDEPENDENTLY CONFIRMS the board's rank lower bound of 31 for no. 302 -- a confirmation of
        someone else's result. It establishes nothing whatever about rank 32 and may not be
        described as progress toward it.

    part_b_search_for_a_32nd_point:
      question: >-
        Does a 32nd rational point exist on ICARM no. 302, independent of the 31 known ones, inside
        the search box frozen in this contract?
      the_prior_is_recorded_here_before_the_run: >-
        THE COORDINATOR'S PRIOR, RECORDED BEFORE ANY RUN EXISTS: NO SUCH POINT WILL BE FOUND. The
        board's own comment reads "BSD + GRH certified to rank 31", and if that is accurate the rank
        IS EXACTLY 31 and no 32nd independent point exists at any height whatsoever. Independently of
        the board's claim, the 31 known points have x-numerators of about 33 decimal digits, while
        the frozen box below reaches 7; a point of that height would be found by this box only by an
        accident of no predictable frequency. THE EXPECTED OUTCOME IS A NULL, AND A NULL IS THEREFORE
        NOT A DISCOVERY, NOT A SURPRISE, AND NOT A RESULT ABOUT THE CURVE. This paragraph exists so
        that the negative cannot afterwards be dressed up as one.
      the_test_is_asymmetric_and_that_is_the_point: >-
        A HIT WOULD REFUTE THE BOARD'S OWN CLAIM and would be a world record, so it is worth 700 s to
        look. A MISS IS CONSISTENT WITH THE BOARD'S CLAIM AND EQUALLY CONSISTENT WITH THE BOX BEING
        FAR TOO SMALL, and CANNOT DISTINGUISH THE TWO. The miss therefore supports NO statement of
        the form "the rank is 31", "the rank is not above 31", or "no further points exist". The only
        sentence a miss licenses is: "no point of E(Q) outside the frozen box description was found
        within the frozen box, at coverage n / N".
      frozen_search_box_B: >-
        FIXED HERE, BEFORE THE RUN, SO THAT NEITHER NUMERATOR NOR DENOMINATOR CAN BE CHOSEN WITH
        KNOWLEDGE OF THE OUTCOME. Search candidate x-coordinates x = u / w^2 in lowest terms, with
        w an integer in [1, 30], gcd(u, w) = 1, and |u| <= U(w) where U(1) = 1000000 and U(w) = 10000
        for 2 <= w <= 30. The DENOMINATOR N_B is the exact count of admissible (u, w) pairs in that
        description; it is a fixed integer determined by this contract alone, it MUST BE COMPUTED AND
        RECORDED BEFORE ANY CANDIDATE IS TESTED, and it may not be recomputed afterwards. The
        NUMERATOR n_B is the count of candidates actually tested. Coverage is reported as n_B / N_B.
      test_per_candidate: >-
        EXACT AND FLOATING-POINT-FREE. For candidate x, the point exists over Q iff the quadratic
        y^2 + (a1 x + a3) y - (x^3 + a2 x^2 + a4 x + a6) = 0 has a rational root, iff its
        discriminant D(x) = (a1 x + a3)^2 + 4 (x^3 + a2 x^2 + a4 x + a6) is a square in Q. Decide
        that with exact integer square-root tests on the numerator and denominator of D(x) in lowest
        terms (math.isqrt and an equality check). Never with a floating-point square root.
      classify_every_hit_before_reporting_it: >-
        A FOUND POINT IS NOT AUTOMATICALLY A 32ND INDEPENDENT POINT AND THE DISTINCTION IS THE WHOLE
        RESULT. A point Q with m*Q in the subgroup generated by the 31 known points for some m >= 1
        REDUCES THE INDEX of that subgroup and DOES NOT RAISE THE RANK; reporting it as a rank
        increase would be a false world-record claim. Every hit is therefore passed to the exact
        certifier as a 32-POINT SET together with the 31 known points, and is reported as
        RANK-INCREASING only if the certifier returns certified rank lower bound 32, and as
        INDEX-REDUCING OR DEPENDENT otherwise. Both outcomes are recorded with the point.
      certificate_kind: >-
        EXPLICITLY STATED FOR BOTH BRANCHES AS REQUIRED. NO HIT (the expected branch): the run is a
        pure measurement with nothing to certify and its certificate kind is `none`. A HIT CERTIFIED
        RANK-INCREASING: the certificate is an `independence_certificate` over the 32-point set, and
        the claim bar below applies in full. A HIT CLASSIFIED INDEX-REDUCING OR DEPENDENT: the
        certificate kind is `none` for rank purposes, and the point is reported as an exhibited
        rational point with its classification, never as a rank result.
      stopping_rule: >-
        HARD TIME CAP 700 s FOR PART B, or exhaustion of the frozen box, whichever comes first. On
        either, STOP AND REPORT n_B / N_B, the hits with their classifications, and the wall clock.
        A time-capped stop bounds coverage and is never negative mathematical evidence. If a
        rank-increasing hit appears, DO NOT STOP the remaining parts: the positive and the coverage
        figure are both reportable, and the positive routes to review-breakthrough under AGENTS.md
        rule 12.

    part_c_twists_and_near_neighbours:
      question: >-
        Does any quadratic twist of ICARM no. 302 within a frozen discriminant range, or any near
        neighbour within a frozen perturbation range, carry certifiable rank -- and does the twist
        family show any enrichment over a matched null?
      rank_is_not_twist_invariant: >-
        STATED FIRST BECAUSE IT IS THE THING MOST EASILY ASSUMED AWAY. The 31 points of no. 302 DO
        NOT TRANSFER to the twist E^(D). E^(D) has its own Mordell-Weil rank, about which the rank of
        no. 302 says nothing, and which must be established from scratch by exhibited points on
        E^(D) itself. Any artifact that treats a twist as inheriting rank invalidates its own
        conclusion.
      the_number_field_trap: >-
        READ THIS BEFORE REPORTING ANY POSITIVE TWIST RESULT. rank E(Q) + rank E^(D)(Q) = rank
        E(Q(sqrt D)). Since rank E(Q) >= 31, ANY twist of positive rank immediately gives rank >= 32
        OVER THE QUADRATIC FIELD Q(sqrt D). THAT IS NOT THIS GOAL'S OBJECTIVE AND MUST NEVER BE
        PRESENTED AS MEETING IT OR APPROACHING IT: GOAL-ECQ-2298dc C1 is rank >= 32 OVER Q, and a
        previous campaign's rank->=31 result over multiquadratic fields was REJECTED for exactly this
        reason. A positive twist is reported as rank over Q of E^(D) -- a small number -- and the
        number-field consequence, if mentioned at all, is mentioned together with the sentence that
        it does not meet C1.
      frozen_twist_set_denominator: >-
        FIXED HERE, BEFORE THE RUN. The twist set is exactly: every squarefree integer D in
        [-200, -2], every squarefree integer D in [2, 200], and D = -1. D = 1 is excluded because
        E^(1) is E itself and is already part A. Both signs are included because the sign of the
        twisting discriminant is not a nuisance parameter here -- it changes the real place and
        therefore the sign of the functional equation. The twist E^(D) is taken on the minimal model
        of no. 302 in the standard way and its
        own minimal model computed. THE DENOMINATOR N_C_TWIST is the exact count of such D, a fixed
        integer determined by this contract alone. IT IS COMPUTED AND RECORDED BEFORE ANY TWIST IS
        SCORED and may not be recomputed, narrowed or widened afterwards. If the budget forces fewer
        twists to be scored, THAT IS A COVERAGE SHORTFALL REPORTED AS A FRACTION, NEVER A
        REDEFINITION OF THE DENOMINATOR.
      frozen_null_object_denominator: >-
        THE NEAR NEIGHBOURS ARE THE NULL OBJECT, AND THEY ARE FROZEN THE SAME WAY. Take the 200
        curves obtained from no. 302 by a6 -> a6 + v for v in {-100, ..., -1, 1, ..., 100},
        discarding any with zero discriminant and recording the discard. THE DENOMINATOR N_C_NULL is
        that count, computed and recorded before any is scored. WHY THESE ARE THE RIGHT NULL: a
        curve of naive height 468 perturbed additively in a6 by a number below 100 is, arithmetically,
        a random curve of enormous height sharing nothing with no. 302 but its size. It is the same
        shape of object as a twist, at the same cost, with the structure removed -- which is what a
        null object is for (docs/inventor-protocol.md, controls before belief). ANY APPARENT
        ENRICHMENT IN THE TWIST FAMILY IS AN ARTIFACT UNTIL MEASURED AGAINST THIS ARM.
      frozen_triage_threshold: >-
        FIXED HERE, BEFORE THE RUN, AND DELIBERATELY EXPRESSED AS A SELECTION RULE RATHER THAN AN
        ABSOLUTE SCORE, BECAUSE RAW MESTRE-NAGAO SCORES ARE NOT COMPARABLE ACROSS CONDUCTOR SCALES
        AND AN ABSOLUTE CUT WOULD BE THE FIRST THING TUNED AFTER SEEING THE DATA. Score every
        candidate in each arm with S = sum over primes p <= 500 of (a_p * log p) / p, computed with
        the SAME implementation, the SAME prime bound and the SAME conventions in both arms. THE
        EXACT GATE IS THEN APPLIED TO EXACTLY THE TOP 20 CANDIDATES BY S IN EACH ARM AND TO NO
        OTHERS -- 20 twists and 20 null curves -- with ties broken deterministically by smallest
        |D| (respectively smallest |v|), then by positive sign before negative. The gated count is
        therefore 20 per arm BY CONSTRUCTION, fixed before anything runs and independent of the
        scores observed. Neither the range, the prime bound, the score definition nor the top-20 rule
        may be changed after any survivor is known; changing any of them requires a versioned
        protocol_amendment record and must be reported as one.
      exact_gate_on_survivors: >-
        For each of the 40 gated curves: compute a1..a6 of its minimal model, b-invariants, c4, c6
        and the discriminant IN EXACT INTEGER ARITHMETIC; report the naive height as
        log max(|c4|^3, c6^2) and log|disc|; then run the frozen point search of part B at the
        REDUCED BOX B-C -- x = u / w^2 with w in [1, 10], gcd(u, w) = 1, |u| <= 100000 for w = 1 and
        |u| <= 2000 for 2 <= w <= 10, whose denominator is likewise fixed by this contract and
        recorded before use -- and pass every point found to the exact certifier to obtain a
        CERTIFIED RANK LOWER BOUND with an independence certificate. No floating point in any of it.
      certificate_kind: >-
        `independence_certificate` for every gated curve on which at least one point is found and
        certified; `none` for triage-only rows and for gated curves on which no point is found. The
        triage score itself CERTIFIES NOTHING and no row may carry a certificate on the strength of
        a score.
      prior_recorded_before_the_run: >-
        Expected certified rank lower bound is 0 for essentially every gated curve in both arms,
        because the reduced box reaches 5-digit x-numerators on curves of naive height near 468, and
        because a twist of a large-conductor curve is not thereby a high-rank curve. The
        INFORMATIVE readout of part C is therefore expected to be the COMPARISON between arms and
        the coverage fractions, not a rank.
      stopping_rule: >-
        HARD TIME CAP 1100 s FOR PART C, split as: at most 600 s for the triage of both arms, at
        most 500 s for the exact gate. On either cap, STOP AND REPORT the coverage fractions
        n_C_twist / N_C_TWIST, n_C_null / N_C_NULL and gated / 20 per arm, plus every completed row.
        A cap reached mid-arm is a coverage shortfall reported as a fraction. IF THE TRIAGE CANNOT
        COVER BOTH ARMS, TRIAGE THE ARMS IN LOCKSTEP -- alternating candidates -- so that a truncated
        run still yields a matched comparison rather than a complete twist arm and an empty null.

    reserve_and_priority_order: >-
      300 s OF THE 3600 s TASK BUDGET IS RESERVED FOR WRITING ARTIFACTS AND IS NOT AVAILABLE TO ANY
      PART. If wall clock bites, the order is A, then B, then C, and within C the triage before the
      gate. STOP AND REPORT rather than silently truncating. Artifacts are never dropped to buy
      compute: a part that produced nothing still reports its zero with its denominator.

  controls:
  - id: CTL-CITED-INPUT-AGREEMENT
    control: >-
      The certifier's step-(0) on-curve check must report `on_curve_failures` EMPTY for all 31
      points, and the recomputed c4, c6 and discriminant must reproduce log max(|c4|^3, c6^2) =
      468.2771 and log|disc| = 453.0469 to the 4 decimal places quoted. The logarithms are the only
      quantity in this contract that may be computed in floating point, because they are REPORTING
      quantities and no decision depends on them; the underlying c4, c6 and disc are exact integers
      and are recorded as such.
    failure_meaning: >-
      A BLOCKING DEFECT. It means the fetched input is corrupt or transcribed wrongly, which is
      precisely the risk the summarising-fetch caveat warns about. STOP, report the mismatch with
      both values, and interpret nothing further -- not part A, not part B, not part C, all of which
      take the same a-invariants as input.
  - id: CTL-POSITIVE-INDEPENDENCE
    control: >-
      Run the certifier on a curve of small conductor and KNOWN rank with published generators --
      at least one of rank 2 and one of rank 3, named in the artifact with their source. It must
      certify the known generators independent and return the known rank as its lower bound.
    failure_meaning: >-
      The instrument is not working and NO part-A, part-B or part-C certification may be reported
      from this run.
  - id: CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH
    control: >-
      Run the identical certifier on sets where independence is KNOWN FALSE: {P, 2P} on a rank-1
      curve, and {P, Q, P + Q} on a rank-2 curve. PASS is that it certifies rank lower bound 1 and 2
      respectively -- i.e. IT REFUSES TO CERTIFY THE DEPENDENT SET AS INDEPENDENT. State what PASS
      looks like before running it, or the control cannot fail.
    failure_meaning: >-
      A certifier that certifies a dependent set as independent has proved too much and EVERY
      independence result in this experiment is void, including part A. This is the single control
      that stands between a 32-point claim and a false world record.
  - id: CTL-SATURATION-DISTINCTION
    control: >-
      Exercise the part-B classifier on a constructed case where the answer is known: take a rank-1
      curve with generator P, present the "known subgroup" as {2P}, and confirm that the classifier
      reports a discovered P as INDEX-REDUCING rather than as rank-increasing.
    failure_meaning: >-
      Without this, an index-reducing point on no. 302 would be reported as a 32nd independent point.
      That is the exact shape of a false record claim and the control is mandatory whatever the
      budget does.
  - id: CTL-MATCHED-NULL
    control: >-
      The near-neighbour arm of part C, scored with the same implementation, the same prime bound
      and the same top-20 rule as the twist arm, and gated with the same reduced box. Report both
      arms' score distributions and both arms' certified ranks side by side, with the
      generated-against-scored-against-gated counts per arm.
    failure_meaning: >-
      Differential attrition or a different instrument between arms voids the comparison whatever it
      shows. This program has already manufactured a result once through differential attrition
      across arms (EV-ECQ-8ee697 OBS-9).
  - id: CTL-PROVENANCE
    control: >-
      Every curve this experiment REPORTS is checked against the frozen snapshot at
      coordination/goals/GOAL-ECQ-002/baseline/ by curve_key AND by a-invariants. Report the outcome
      per curve. Note honestly, rather than claiming a check that means nothing, that Cremona's
      tables cover conductors far below anything here, so a Cremona check is VACUOUS for no. 302 and
      its twists and is recorded as not-applicable-with-reason rather than as a pass.
    failure_meaning: >-
      A rediscovered board curve reported as this program's own is the error BATCH-541940 made when
      it reported frozen board curve id 108 as its own at three rank thresholds.
  - id: CTL-NO-FLOATING-POINT-IN-A-DECISION
    control: >-
      No certification, independence decision, squareness test, minimality decision or comparison
      that determines an outcome may use floating point. Floating point is permitted ONLY for the
      reported logarithms of exact integers and for the Mestre-Nagao triage score, neither of which
      decides a certification. State in the report where floating point appears and why it is
      decision-free.
    failure_meaning: >-
      Any certification touched by floating point is invalid and is withdrawn.

  metrics:
    primary:
    - part_a_largest_independent_subset_certified_k_of_31
    - part_a_wall_clock_seconds_and_search_bounds_reached
    - part_b_coverage_n_B_over_N_B_with_N_B_recorded_before_testing
    - part_b_rank_increasing_hits_count_and_index_reducing_hits_count
    - part_c_triage_coverage_per_arm_numerator_over_denominator
    - part_c_gated_count_per_arm_over_20
    - part_c_max_certified_rank_lower_bound_per_arm
    secondary:
    - part_a_torsion_bound_and_primes
    - part_a_prime_l_used_and_good_primes_used_and_stacked_matrix_Fl_rank
    - recomputed_c4_c6_disc_and_naive_height_against_the_cited_values
    - part_b_hits_with_exact_coordinates_and_classification
    - part_c_mestre_nagao_score_distribution_per_arm
    - part_c_exact_naive_height_per_gated_curve
    - wall_clock_and_peak_memory_per_part
    - attempted_rows_with_status_and_reason
    - control_outcomes_for_all_six_controls

  coverage_is_a_contract_term_not_a_hope: >-
    EVERY COVERAGE FIGURE IS REPORTED AS NUMERATOR OVER DENOMINATOR, BESIDE EVERY NEGATIVE STATEMENT
    IN EVERY DELIVERABLE. The denominators N_B, N_C_TWIST, N_C_NULL and the reduced-box denominator
    are FIXED BY THIS CONTRACT, are computed and recorded BEFORE any candidate is tested or scored,
    and MAY NOT BE ADJUSTED AFTERWARDS. THE REASON THIS IS A CONTRACT TERM RATHER THAN A REQUEST:
    BATCH-541940 reported no coverage fraction at all, both reviewers charged it, a reviewer had to
    reconstruct 37.0 percent from raw run records, and the campaign lost its strongest negative
    because the number that made it a negative was missing. AND THE REASON THE DENOMINATORS ARE
    FROZEN HERE RATHER THAN CHOSEN AT RUN TIME: a range or threshold picked after the survivors are
    known makes the numerator and the denominator both functions of the outcome, which is the same
    defect class as reading a target after the data exists -- a defect this program has already paid
    for twice. A negative without its coverage fraction does not satisfy this contract.

  preregistered_prediction:
    quantity: >-
      k, the largest subset of the 31 witness points certified independent; whether a 32nd
      independent point exists in the frozen box B; and the maximum certified rank lower bound in
      each arm of part C.
    formula: >-
      PART A: k = 31 if the instrument and the budget suffice. The Coordinator's recorded prior is
      that the points ARE independent -- the board's claim is very likely correct -- and that the
      live risk is INSTRUMENTAL, namely that reaching F_l-rank 31 needs more usable primes than
      1500 as a prime bound supplies within 1500 s, in which case a partial k is the honest reading
      and says nothing about the curve.
      PART B: NO rank-increasing hit. Expected count of hits is not estimable from any measured rate
      in this program, and no rate is invented here to dress the zero up as informative.
      PART C: maximum certified rank lower bound 0 or 1 in BOTH arms, with no measurable separation
      between the twist arm and the null arm at these coverages. A separation would be a genuine
      surprise and would need replication before being believed.
    source: >-
      Coordinator prior for TASK-20260824-261bb4, recorded in this contract before any run exists,
      and in GOAL-ECQ-2298dc odds_assessment.

  scale_relevance:
    tier: null
    tier_reason: >-
      The toy/medium/crypto ladder describes security parameters and no security parameter appears
      here. Setting a tier would import a claim this experiment does not make. The field is present
      and explicitly null so a reader cannot mistake it for an overlooked one.
    justification: >-
      The tested scale is one curve of naive height 468.2771 with 31 published witness points; a
      frozen x-coordinate box reaching 7-digit numerators; 200-odd squarefree twisting discriminants
      with |D| <= 200; 200 additive perturbations of a6 with |v| <= 100; Mestre-Nagao scores to
      p <= 500; exact stdlib integer and Fraction arithmetic on one machine, single worker, against
      a board snapshot frozen at 2026-08-23T00:43Z and an input fetched 2026-08-24.
    transfer_assumptions: >-
      NONE ARE MADE. Nothing here transfers to another curve, another family, another height range
      or another search method. Part A's result is about ONE curve and ONE instrument. Part B's
      result is about ONE box. Part C's result is about ONE frozen twist range and its matched null.

  replication:
    seeds: [20260824]
    independent_instances: 1
    independent_instances_note: >-
      One producer instance. Every part of this protocol is DETERMINISTIC -- there is no sampling
      anywhere, the boxes and the twist and perturbation sets are fully enumerated by their frozen
      descriptions, and the seed is recorded only for schema completeness and for any tie-breaking
      the implementation needs. Independence comes from an independent reviewer re-running the
      committed certificate, not from a second producer instance.

  budget:
    wall_clock_seconds_per_run: 3600
    task_wall_clock_seconds_total: 3600
    total_cpu_hours: 1.0
    maximum_memory_gb: 3
    maximum_runs: 40
    maximum_workers: 1
    per_part_caps:
      part_a_seconds: 1500
      part_b_seconds: 700
      part_c_seconds: 1100
      artifact_reserve_seconds: 300
    artifact_size_budget:
      committed_total_mib: 25
      per_file_mib: 5
      exceptions_declared: []
      rule: >-
        Non-null per DEC-20260823-ee9162 R15. Raw per-candidate dumps that would exceed either
        figure are REDUCED AT SOURCE to summary rows, or retained out of band with sha256, row count
        and the exact regeneration command recorded in the run record. NEVER capped whatever the
        budget: manifest.yaml, command.txt, environment.json, stdout.log, stderr.log and a
        machine-readable summary of results. BATCH-541940 committed 328.0 MiB across 100 files and
        the only cost-free moment to prevent that was before the producer wrote.
  budget_note: >-
    THE BINDING CAP IS 3600 s FOR THE WHOLE TASK, not per run; wall_clock_seconds_per_run is set
    equal to it because the schema requires a per-run figure and no single run may exceed the task.
    The per-part caps above sum to 3300 s with 300 s reserved for artifacts. The 3 GB memory cap sits
    below the templates/research-records.md floor of 8 GB, and the reason is stated in the objective
    as that template requires. This 3600 s sits inside the campaign's declared 10800 s, under an
    accounting convention that charges producer wall clock only and therefore understates true
    consumption -- a measurement convention, not a claim (GOAL-ECQ-2298dc campaign_budget).

  stopping_rules:
  - >-
    PART A: hard cap 1500 s, or the certifier returning. STOP AND REPORT the largest independent
    subset certified as k of 31, the point indices, the search bounds reached and the wall clock. A
    PARTIAL CERTIFICATION IS A REPORTABLE RESULT and carries the certifier's own inconclusiveness
    wording; it is never evidence of low rank.
  - >-
    PART B: hard cap 700 s, or exhaustion of the frozen box B, whichever first. STOP AND REPORT
    n_B / N_B, every hit with its rank-increasing or index-reducing classification, and the wall
    clock. A cap reached is a coverage bound, never a mathematical negative.
  - >-
    PART C: hard cap 1100 s, split 600 s triage and 500 s gate. Triage the two arms IN LOCKSTEP so a
    truncated run still yields a matched comparison. STOP AND REPORT both arms' coverage fractions
    and the gated counts.
  - >-
    TASK WALL CLOCK 3600 s with 300 s reserved for artifacts. On reaching it, emit every completed
    row, every coverage fraction with numerator and denominator, and the outcome of every control
    that ran.
  - >-
    MEMORY 3 GB. On breach, stop the run and record the breach; do not silently shrink a frozen box,
    which would change a denominator fixed by this contract.
  - >-
    RUN COUNT 40. A run that dies on a bad flag or a crash is superseded by a successor run and BOTH
    are recorded.
  - >-
    POSITIVE EARLY REPORT. If a rank-increasing 32nd point appears in part B, or a gated part-C curve
    certifies rank >= 32, DO NOT STOP the remaining coverage work. The positive and the coverage
    fractions are both reportable, and the positive routes to independent `review-breakthrough`
    review at `max` effort under AGENTS.md rule 12 before it is stated anywhere as a result.

  invalidation_rules:
  - >-
    ANY independence, squareness, minimality or classification decision made with floating point
    INVALIDATES that decision and everything resting on it.
  - >-
    ANY point reported without exact verification that it lies on the minimal model INVALIDATES its
    use in any certificate.
  - >-
    ANY run written outside experiments/EXP-ECQ-f5af06/runs/RUN-<id>/, or with run.experiment_id
    unset, or with a manifest missing the validator's schema, INVALIDATES that run's indexability. A
    fifth post-hoc repair port is not permitted; see run_path_requirement.
  - >-
    ANY coverage figure reported without both numerator and denominator, or with a denominator
    computed after candidates were tested or scored, INVALIDATES the negative statement it supports.
  - >-
    ANY change to the frozen box B, the frozen reduced box B-C, the twist range |D| <= 200, the
    perturbation range |v| <= 100, the prime bound 500 or the top-20 gate rule, made after any score
    or survivor is known and without a versioned protocol_amendment record, INVALIDATES the claim
    that rests on it.
  - >-
    ANY twist result presented as bearing on rank(no. 302), or any number-field rank presented as
    meeting or approaching GOAL-ECQ-2298dc C1, INVALIDATES that inference.
  - >-
    ANY disagreement between the recomputed c4, c6, discriminant or naive height and the cited input
    values that is not reported as a blocking defect INVALIDATES every downstream statement.
  - >-
    ANY network call inside a run INVALIDATES the run. ANY submission to the ICARM endpoint
    INVALIDATES THE EXPERIMENT OUTRIGHT. Nothing is submitted here. The live-board re-read required
    by the claim bar is a Coordinator step performed outside the runs, at claim time, and recorded
    in the decision.
  - >-
    ANY attempted candidate lost to an arithmetic difference between attempted and reported, with no
    identifier and no reason recorded, INVALIDATES the coverage figure it belongs to. 462 families
    vanished that way in BATCH-541940.

  success_criterion: >-
    DECLARED IN ADVANCE, PER PART, IN BRANCHES THAT EXHAUST THE OUTCOME SPACE.
    A-FULL: k = 31. This program can certify independence at record scale, and the board's rank
    lower bound for no. 302 is independently confirmed. It is a confirmation of someone else's
    result and establishes nothing about 32.
    A-PARTIAL: k < 31 within the cap. A reportable measurement of THIS INSTRUMENT at THIS budget,
    carrying the certifier's own inconclusiveness wording. It fires pause condition P4 of
    GOAL-ECQ-2298dc: 32 is not claimable by this program at this scale until the instrument is
    extended. It is not evidence about the curve.
    B-NULL (expected): no rank-increasing hit in the frozen box, reported as n_B / N_B. Consistent
    with the board's claim AND with the box being far too small; it distinguishes neither and
    supports no statement about the rank of no. 302.
    B-POSITIVE: a hit certified rank-increasing against the 31 known points. A WORLD RECORD, subject
    to the claim bar in full and to review-breakthrough before it is stated as a result anywhere.
    B-INDEX-REDUCING: a hit classified as index-reducing or dependent. An exhibited rational point
    and a fact about the saturation of the published subgroup; NOT a rank result and never reported
    as one.
    C-NULL (expected): no gated curve in either arm certifies rank above 0 or 1, with no separation
    between arms. The coverage fractions and the two score distributions ARE the result.
    C-POSITIVE: a gated curve certifying rank >= 32 over Q. Same claim bar as B-POSITIVE. A gated
    curve certifying a modest rank is a modest rank over Q of that twist and nothing more.
    THE EXPERIMENT SUCCEEDS AS AN EXPERIMENT IN EVERY BRANCH, provided k, the coverage fractions with
    their pre-recorded denominators, the branch labels and the control outcomes are reported. IT
    FAILS ONLY BY REPORTING A BRANCH IT DID NOT EARN.

  falsification_criterion: >-
    THE BOARD'S "rank exactly 31" READING OF no. 302 IS FALSIFIED BY BRANCH B-POSITIVE, and by
    nothing else in this experiment -- in particular not by any twist result, since rank is not
    twist-invariant. THIS PROGRAM'S CAPABILITY TO CERTIFY AT RECORD SCALE IS FALSIFIED BY BRANCH
    A-PARTIAL with k materially below 31. THE MATCHED-NULL DESIGN OF PART C IS FALSIFIED if the null
    arm and the twist arm cannot be scored with the same instrument at the same coverage, in which
    case the comparison is withdrawn whatever it showed. NOT FALSIFIED by any timeout, alarm, crash
    or memory outcome, all of which bound coverage and are never negative mathematical evidence
    (AGENTS.md rule 5).

  certificate_kinds_and_a_schema_reconciliation:
    part_a: independence_certificate
    part_b: >-
      `none` in the expected no-hit branch -- a pure measurement run with nothing to certify, stated
      explicitly rather than left blank. `independence_certificate` over the 32-point set if and
      only if a hit is certified rank-increasing. `none` for a hit classified index-reducing or
      dependent, which is reported as an exhibited point and not as a rank result.
    part_c: >-
      `independence_certificate` for every gated curve on which a point is found and certified;
      `none` for triage-only rows and for gated curves with no point found.
    manifest_field_reconciliation: >-
      STATED IN THE CONTRACT RATHER THAN DISCOVERED AT VALIDATION TIME. `independence_certificate`
      is the PROTOCOL-level artifact kind used above and recorded inside certification.json,
      extension_search.json and twist_search.json. IT IS NOT A LEGAL VALUE OF
      run.result.certificate.kind: tools/validate_ledger.py admits only discrete_log,
      decomposition or none there (docs/claims-and-verification.md), so a manifest carrying
      `independence_certificate` in that field FAILS VALIDATION ON EVERY RUN. Manifests therefore set
      run.result.certificate.kind to `none` and reference the protocol certificate by PATH in
      run.result. This is a schema reconciliation, NOT a weakening: the certificate requirement is
      enforced by the artifact itself, by the controls, and by the claim bar below, none of which
      this reconciliation touches.

  run_path_requirement:
    decision: >-
      RUNS ARE WRITTEN DIRECTLY UNDER experiments/EXP-ECQ-f5af06/runs/RUN-<id>/ FROM THE START, with
      run.experiment_id set to EXP-ECQ-f5af06 in every manifest from the start. THIS CONTRACT
      REQUIRES IT; it does not permit a post-hoc port.
    manifest_schema: >-
      Every manifest carries the VALIDATOR'S schema -- `code` (with commit and command),
      `environment`, `timing`, `result`, `inputs`, plus id, experiment_id and status -- and not only
      producer-local field names, so that no mapping port is ever needed. Companion artifacts
      command.txt, environment.json, stdout.log, stderr.log and raw-result.json sit beside each
      manifest in the same run directory; the validator checks for all five by name.
    why: >-
      tools/validate_ledger.py indexes runs ONLY at experiments/*/runs/*/manifest.yaml. Writing them
      anywhere else makes every evidence record that cites them unresolvable, and has cost this
      program FOUR post-hoc repair ports across four batches (EXP-ECQ-89de3c, EXP-ECQ-139c9f,
      EXP-ECQ-7ea4c3, EXP-ECQ-a7d948). A NOTE IN A RECORD FAILED TO PREVENT THIS THREE TIMES; the
      mechanical fix -- write_scope plus this clause -- worked last batch and is repeated here
      unchanged. It is in the contract, not in a note.
    what_lands_where: >-
      RUN RECORDS under experiments/EXP-ECQ-f5af06/runs/RUN-<id>/. DELIVERABLES under
      coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/ exactly as the handoff's
      artifact_paths declare. THE PRODUCER'S write_scope IN TASK-20260824-261bb4 ALREADY INCLUDES
      experiments/EXP-ECQ-f5af06 for this purpose, so no queue amendment is needed before dispatch;
      that scope permits writing under runs/ ONLY. THIS FILE IS FROZEN and may not be modified by
      the producer under any circumstances.

  claim_bar_for_a_positive_result: >-
    32 INDEPENDENT POINTS WOULD BE A WORLD RECORD. EVERY CLAUSE BELOW IS REQUIRED BEFORE THE WORDS
    "rank 32" APPEAR IN ANY ARTIFACT, INCLUDING report.md.
    (1) EVERY point verified to lie on the GLOBALLY MINIMAL MODEL in exact rational arithmetic, with
    the minimality established rather than assumed.
    (2) INDEPENDENCE certified with NO FLOATING POINT ANYWHERE in the decision path, by the exact
    reduction / mod-l argument, with the torsion bound, the prime l, every good prime used, and the
    stacked F_l-rank recorded.
    (3) THE CERTIFICATE RE-RUNNABLE END TO END BY A THIRD PARTY from the committed artifacts alone:
    the a-invariants, the 32 points, the code, and one command. A certificate that only reproduces
    inside this repository is not re-runnable by a third party and does not meet this bar.
    (4) THE CURVE CHECKED AGAINST BOTH the frozen ICARM snapshot at
    coordination/goals/GOAL-ECQ-002/baseline/ -- by curve_key AND by a-invariants -- AND the LIVE
    BOARD re-read at claim time, with any third-party movement in between REPORTED rather than
    absorbed. The live re-read is a Coordinator step outside the runs; no run makes a network call.
    (5) CONTROLS CTL-POSITIVE-INDEPENDENCE, CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH and
    CTL-SATURATION-DISTINCTION all PASSED in the same run set, because a 32-point claim is exactly
    what a broken certifier or a missing saturation check would produce.
    (6) INDEPENDENT `review-breakthrough` REVIEW AT `max` EFFORT in a separate session, per AGENTS.md
    rule 12, before the claim is stated as a result anywhere.
    UNDER-CLAIM RATHER THAN OVER-CLAIM. The strongest admissible statement is a CERTIFIED RANK LOWER
    BOUND of 32 for an explicitly given curve; rank equality is never claimed, BSD and GRH are never
    invoked, and the phrase "world record" is used only after clause (4) and clause (6) are both
    discharged.

  claim_tier_ceiling: >-
    The strongest claim any evidence record may draw from this experiment is a CERTIFIED RANK LOWER
    BOUND from exhibited points verified in exact arithmetic on a model proved globally minimal, for
    a curve checked against the frozen board on both keys. Rank equality is never claimed. Part A's
    output is a confirmation of an EXTERNAL result and may never be recorded as this program's own
    rank result. Nothing above these tiers may be asserted from these runs
    (docs/claims-and-verification.md).

  required_artifacts:
  - experiments/EXP-ECQ-f5af06/runs/RUN-<id>/manifest.yaml for every run, schema-complete with id, experiment_id, status, code (commit and command), environment, inputs, timing and result, plus the seed, the dirty-tree flag, resource measurements, exit code, time_budget_reached and any alarm count
  - experiments/EXP-ECQ-f5af06/runs/RUN-<id>/command.txt for every run
  - experiments/EXP-ECQ-f5af06/runs/RUN-<id>/environment.json for every run
  - experiments/EXP-ECQ-f5af06/runs/RUN-<id>/stdout.log for every run
  - experiments/EXP-ECQ-f5af06/runs/RUN-<id>/stderr.log for every run
  - experiments/EXP-ECQ-f5af06/runs/RUN-<id>/raw-result.json for every run
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/certification.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/extension_search.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/twist_search.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/report.md

  required_artifact_contents:
    certification.json: >-
      Part A. The a-invariants as used; the recomputed c4, c6 and discriminant as exact integers;
      the recomputed naive height and log|disc| beside the cited 468.2771 and 453.0469 with the
      agreement stated; the certifier's full output including on_curve_failures, torsion bound and
      its primes, every independence attempt with its l and its F_l-rank, the good primes used, and
      the indices of the points certified independent; k as a number out of 31; the search bounds
      actually used; wall clock; and the outcome of CTL-POSITIVE-INDEPENDENCE and
      CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH.
    extension_search.json: >-
      Part B. The frozen box description reproduced verbatim; N_B COMPUTED AND RECORDED BEFORE ANY
      CANDIDATE WAS TESTED; n_B; the coverage fraction; every hit with exact x and y, its
      classification as rank-increasing or index-reducing or dependent, and the certifier output
      that decided it; the outcome of CTL-SATURATION-DISTINCTION; and wall clock.
    twist_search.json: >-
      Part C. The frozen twist range and perturbation range reproduced verbatim; N_C_TWIST and
      N_C_NULL COMPUTED AND RECORDED BEFORE ANY CANDIDATE WAS SCORED; per arm, the
      generated / scored / gated counts and coverage fractions; every scored candidate with its
      identifier (D or v) and its score; the 20 gated curves per arm with exact c4, c6, discriminant,
      naive height, the reduced-box coverage, the points found, and the certified rank lower bound
      with its certificate; and the provenance check outcome per reported curve.
    report.md: >-
      What was run, what was measured, what failed, and WHAT WAS NOT REACHED AND WHY. The branch
      label for each part named explicitly and defended against its pre-declared condition. Every
      negative carries its coverage fraction. Every claim carries its scope. The summarising-fetch
      provenance caveat on the input repeated wherever the board's data is relied on. An explicit
      statement of where floating point appears and why it decides nothing. NO SENTENCE describing
      rank >= 31 over Q as unclaimed, and NO SENTENCE presenting a number-field rank as meeting or
      approaching the goal's objective.

  outcome_pointer: >-
    On completion, the Coordinator verifies run validity BEFORE interpreting anything -- expected run
    count, schema-complete manifests, the pre-recorded denominators, raw-versus-summary agreement,
    and control comparability -- and only then writes the evidence and decision records. An invalid
    or incomplete run set returns to the executor with concrete defects listed; it is not evidence.
