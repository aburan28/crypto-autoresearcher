  amendment_type: correction_and_resize_overlay
  parent_contract: experiments/EXP-ECQ-f5af06/specification.yaml
  prior_overlays: []
  reruns_under_this_amendment: TASK-20260824-02c3e4

  authority:
  - ledger/goals/GOAL-ECQ-2298dc/goal.yaml
  - ledger/questions/RQ-ECQ-e9b361.yaml
  - experiments/EXP-ECQ-f5af06/specification.yaml
  - ledger/handoffs/TASK-20260824-261bb4.yaml

  frozen: true
  frozen_on: '2026-08-24'

  # ---------------------------------------------------------------------------
  # MECHANISM
  # ---------------------------------------------------------------------------

  mechanism_chosen: protocol_amendment_overlay
  mechanism_rationale: >-
    THIS IS AN OVERLAY, NOT A SECOND CONTRACT, AND THE CHOICE IS FORCED BY WHAT THIS REPOSITORY
    ACTUALLY VALIDATES. Four reasons, in order of weight. (1) tools/validate_ledger.py discovers
    experiment contracts by globbing experiments/*/specification.yaml and nothing else; a file
    named specification.v2.yaml is therefore NEVER schema-checked, so the governing contract would
    be the one the validator cannot see while the superseded one keeps the validator's attention.
    That is the exact inversion this program cannot afford, and 7099 records currently validate
    clean. (2) docs/task-lifecycle.md defines a protocol_amendment block with the fields
    experiment_id, version_from, version_to, reason, changes, affected_runs, confirmatory_status
    and approved_by; that is the mechanism the repository documents for a post-approval change, and
    it is used here with those field names unchanged. (3) The repository's only working precedent
    for a post-approval change is the overlay form at
    experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml, which keeps its parent
    immutable, declares precedence over conflicting clauses, and lists prior overlays. This file
    copies that shape. (4) Roughly ninety-five percent of v1's clauses are unchanged here, and a
    full v2 copy would make every one of them a second source of truth that can silently diverge
    from the first. The correction being made is two clauses wide plus a resizing; the honest shape
    of that is an overlay.
  mechanism_rejected_alternative: >-
    A specification.v2.yaml alongside the immutable v1 IS a form this repository has used --
    experiments/EXP-IT-001 carries specification.yaml, specification.v2.yaml and
    specification.v3.yaml -- so it is not forbidden, and this record does not pretend it is. It was
    rejected for the four reasons above, of which reason (1) is decisive on its own. Note that in
    EXP-IT-001 the base specification.yaml still exists and is the file the validator reads, and
    the vN files were full re-designs of a long-running experiment rather than a targeted
    correction of two clauses.
  precedence: >-
    experiments/EXP-ECQ-f5af06/specification.yaml IS IMMUTABLE AND REMAINS BINDING IN FULL. This
    overlay supersedes ONLY the clauses named explicitly in `changes` below. EVERY UNMENTIONED v1
    CLAUSE REMAINS BINDING WORD FOR WORD, including in particular the claim bar, the run-path
    requirement, the certificate-kind reconciliation, the invalidation rules, the no-floating-point
    rule, the coverage-is-a-contract-term clause, all six v1 controls, and the standing_negative.
    A conflict not resolved explicitly here invalidates admission; the Executor may not choose a
    preferred reading and must report the conflict as a defect instead.

  # ---------------------------------------------------------------------------
  # REASON
  # ---------------------------------------------------------------------------

  reason: >-
    THE PART-C TRIAGE GATE FROZEN IN v1 IS SIGN-INVERTED, AND THE DEFECT IS THE COORDINATOR'S, NOT
    THE EXECUTOR'S. v1 froze the score S = sum over primes p <= 500 of (a_p log p) / p and then
    applied the exact gate to the TOP 20 CANDIDATES BY S in each arm. S DECREASES with rank, so
    top-by-S selects the LOWEST-rank candidates in each arm, which is the opposite of the triage's
    stated purpose. The Executor applied the frozen rule exactly as written, refused to
    self-authorise a change, recorded the inversion as a blocking finding, and preserved every
    per-candidate score so that a re-gate needs no new scoring run. That was correct behaviour on
    every count. CONSEQUENCE FOR v1's READOUT, STATED PLAINLY AND NOT SOFTENED: v1's C-NULL branch
    is REAL AS RECORDED and is UNINFORMATIVE ABOUT THE TWIST NEIGHBOURHOOD. The pre-registered
    part-C prior of certified rank 0 in both arms was met, and it was met for the wrong reason --
    the gate examined the twenty candidates each arm's own score ranks as LEAST promising. v1's
    C-NULL is not evidence that the twist neighbourhood of no. 302 is barren and may never be cited
    as such.
  secondary_reason_budget: >-
    EVERY FROZEN REGION IN v1 WAS SIZED FAR BELOW WHAT THE BUDGET SUPPORTED. Producer wall clock
    was 23.8 s of a 3600 s task budget across 7 runs of a maximum 40: part A 1.9 s of a 1500 s cap,
    part B 3.418 s of a 700 s cap (0.5 percent), part C 13.4 s of an 1100 s cap. Under-sizing a
    frozen region is not a neutral conservatism -- it buys a smaller measurement at the same price
    and it makes every negative weaker than the budget could have made it. v2 re-sizes every frozen
    region, and states its sizing arithmetic and its safety margin in `sizing_basis` below so the
    choice can be checked rather than trusted.

  # ---------------------------------------------------------------------------
  # WHAT THIS AMENDMENT IS. THE HONEST FRAMING, STATED BEFORE THE CHANGES.
  # ---------------------------------------------------------------------------

  what_this_amendment_is: >-
    THIS AMENDMENT CHANGES A SELECTION RULE AFTER SCORES WERE SEEN. That is normally the defect
    class this program has already paid for twice, it is named as such in v1's own
    coverage_is_a_contract_term_not_a_hope clause, and this record does not claim to be exempt from
    the concern. It claims to be a checkably different instance, and the check is stated below so a
    reviewer can reject it on the evidence rather than on the assurance.
  why_this_instance_is_different:
    the_correction_is_fixed_by_an_external_fact: >-
      THE DIRECTION OF THE CORRECTION IS DETERMINED BY THE SIGN OF a_p, NOT BY ANY CANDIDATE'S
      SCORE. a_p = p + 1 - #E(F_p). A curve of high rank has many rational points, which reduce to
      many points mod p, so #E(F_p) is large and a_p is small or negative, so S = sum (a_p log p)/p
      becomes MORE NEGATIVE as rank increases. This is the standard Mestre-Nagao heuristic and it
      is used here ONLY for its SIGN. No quantitative form of it is asserted, relied on or needed:
      the score certifies nothing, it only orders candidates for an exact gate that decides
      everything. Had every candidate score in v1 been deleted, this amendment would set exactly
      the same rule.
    the_calibration_ground_truth_is_disjoint_from_the_candidate_set: >-
      The direction is confirmed empirically against five curves NONE OF WHICH IS A CANDIDATE IN
      EITHER ARM -- four published curves of small conductor and one external record curve. No
      twist of no. 302 and no a6-perturbation of no. 302 appears in the calibration. The rule is
      therefore a function of ground truth OUTSIDE this experiment's candidate set, not of which
      candidates happened to score well. That is the discriminating property, and it is the one a
      reviewer should test.
    the_direction_survives_two_independent_implementations: >-
      The Executor's convention includes EVERY prime p <= 500, good or bad, counting the naive
      affine points of the stated model over F_p plus the point at infinity. The Coordinator's
      independent re-derivation SKIPS p dividing the discriminant. The two conventions differ in
      absolute scale and reconcile exactly by that choice; the ORDERING AND THE DIRECTION ARE
      IDENTICAL UNDER BOTH. A rule tuned to the observed candidates would not be reproduced by an
      independent re-derivation under a different convention.
    it_is_made_falsifiable_rather_than_asserted: >-
      CTL-GATE-DIRECTION below re-runs the calibration inside the v2 run set and BLOCKS THE GATE if
      the monotone decrease fails. The direction is therefore not a claim in prose that a future
      reader must take on trust; it is a control with a stated PASS condition that can fail.
    what_is_not_repaired_by_any_of_that: >-
      IT REMAINS TRUE THAT THE SCORES OF 443 CANDIDATES WERE OBSERVED BEFORE THIS RULE WAS WRITTEN.
      No framing removes that, and re-scoring those 443 would not remove it either, since the
      values were seen regardless of which run produced them. A reader is entitled to discount any
      between-arm INFERENTIAL statement drawn from those 443. That is why v2 restricts every
      pre-registered inferential comparison to the v2-only candidate subset, which is disjoint from
      everything scored in v1 -- see part_c_between_arm_comparison below.
  coordinator_judgement_on_the_framing: >-
    THE FRAMING IS SUFFICIENT FOR THE GATE DIRECTION AND INSUFFICIENT FOR THE BETWEEN-ARM
    COMPARISON, and this record adopts a stricter route for the second rather than accepting the
    first for both. For the gate direction the framing holds: the rule is fixed by the sign of a_p,
    calibrated on a disjoint external set, reproduced under two conventions, and made falsifiable
    by a blocking control. For the between-arm comparison it does not hold, because 443 of the
    scores entering any pooled statistic were already seen, and because a Mann-Whitney z of +3.24
    on those 443 has already been observed. THE STRICTER ROUTE ADOPTED: every pre-registered
    inferential threshold in v2 applies ONLY to the v2-only subset -- twist candidates with
    200 < |D| <= 10000 and null candidates with 100 < |v| <= 6000 -- whose scores do not exist
    anywhere yet; the pooled and the v1-subset comparisons are DESCRIPTIVE ONLY and are labelled so
    in the deliverable. This is stricter than what the amendment was asked to do and the difference
    is deliberate.
  the_v1_result_stands: >-
    THE v1 TOP-20 RESULT STANDS AS RECORDED AND IS REPORTED ALONGSIDE, NEVER REPLACED. v2's
    deliverable must carry, for each arm, the v1 top-20 gated set with its certified ranks
    (0 in both arms) beside the v2 bottom-200 gated set with its certified ranks, both labelled
    with the rule that produced them. Deleting, overwriting or quietly superseding the v1 rows is
    forbidden: the two gates answer different questions and both answers are part of the record.
    The v1 run records, deliverables and coverage fractions are IMMUTABLE and are not reinterpreted
    by this overlay beyond the re-scoping already stated in `reason`.

  # ---------------------------------------------------------------------------
  # ONE CORRECTION TO v1's FRAMING, MADE EXPLICIT SO NO REVIEWER MISREADS PART C
  # ---------------------------------------------------------------------------

  the_number_field_trap_restated_correctly: >-
    THE NUMBER-FIELD TRAP DOES NOT CONDEMN PART C, AND AN EARLIER COORDINATOR FRAMING THAT IMPLIED
    IT DOES WAS WRONG. WHAT THE TRAP FORBIDS IS ADDING RANKS. rank E(Q) + rank E^(D)(Q) =
    rank E(Q(sqrt D)), so pairing no. 302's rank >= 31 with a positive-rank twist to announce
    rank >= 32 OVER THE QUADRATIC FIELD Q(sqrt D) is the rejected shape, and GOAL-ECQ-2298dc C1 is
    rank >= 32 OVER Q. A previous campaign's rank->=31 result over multiquadratic fields was
    rejected for exactly that reason and this overlay does not weaken that rejection by one word.
    WHAT THE TRAP DOES NOT FORBID: a quadratic twist E^(D) whose OWN Mordell-Weil rank OVER Q is
    at least 32 IS A LEGITIMATE RANK->=32 CURVE OVER Q and WOULD MEET C1 IN FULL, subject to the
    claim bar. E^(D) is an elliptic curve over Q like any other; that it happens to be a twist of
    no. 302 is a fact about how it was found, not a defect in what it is, and rank is not
    twist-invariant so nothing is inherited or added. PART C'S DIRECTION IS THEREFORE SOUND. ONLY
    ITS GATE WAS BROKEN. No artifact of v2 may describe part C as structurally disqualified, and no
    artifact of v2 may add a twist's rank to no. 302's.
  the_two_readings_a_positive_twist_admits: >-
    Stated as a pair so neither can be confused for the other. READING THAT IS FORBIDDEN: 31 + r
    over Q(sqrt D). READING THAT IS PERMITTED AND IS THE ONLY ONE v2 REPORTS: rank_Q(E^(D)) = r,
    a rank over Q of the named curve E^(D), certified from exhibited points on E^(D) itself, with
    no reference to no. 302's 31 points, which do not transfer.

  # ---------------------------------------------------------------------------
  # CHANGES. EVERYTHING NOT LISTED HERE IS UNCHANGED FROM v1.
  # ---------------------------------------------------------------------------

  changes:

  - id: CHG-1-GATE-DIRECTION
    clause: part_c_twists_and_near_neighbours.frozen_triage_threshold
    change_type: correction
    from: >-
      The exact gate is applied to EXACTLY THE TOP 20 CANDIDATES BY S in each arm and to no others,
      ties broken deterministically by smallest |D| (respectively smallest |v|), then positive sign
      before negative.
    to: >-
      The exact gate is applied to EXACTLY THE 200 CANDIDATES OF SMALLEST S IN EACH ARM AND TO NO
      OTHERS -- most negative first, equivalently the top 200 by -S. Ties are broken by exactly the
      v1 rule, unchanged: smallest |D| (respectively smallest |v|), then positive sign before
      negative. The score definition S = sum over primes p <= 500 of (a_p log p) / p, the prime
      bound 500, the bad-prime convention and the model normalisation are UNCHANGED from what v1's
      producer implemented, so that v1 scores remain comparable and reusable.
    direction_statement_that_must_travel_with_the_rule: >-
      S DECREASES WITH RANK. HIGH RANK IS THE MOST NEGATIVE END OF THE DISTRIBUTION. SELECT THE
      BOTTOM OF THE ORDERING. Any implementation that sorts descending and takes the head has
      inverted this rule and must fail CTL-GATE-DIRECTION before it can gate anything.
    calibration_table_that_fixes_the_direction:
      note: >-
        Reproduced here so the direction cannot invert again by being restated in prose alone. Both
        columns are recorded. The `executor_convention` column is the v1 producer's, including every
        prime p <= 500 good or bad. The `coordinator_convention` column is an independent
        re-derivation skipping p dividing the discriminant. The two reconcile exactly by that choice
        and the direction is identical under both.
      rows:
      - curve: 11a1
        rank_used: 0
        rank_basis: >-
          EXTERNAL AND NOT VERIFIED BY THIS PROGRAM. Rank 0 cannot be certified by exhibiting
          points, so this program's certifier cannot confirm it. Recorded as a published value and
          NOT relied on by CTL-GATE-DIRECTION.
        S_executor_convention: 1.57
        S_coordinator_convention: 0.66
      - curve: 37a1
        rank_used: 1
        rank_basis: >-
          CERTIFIED RANK LOWER BOUND 1 INSIDE THIS PROGRAM, in v1's
          CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH and CTL-SATURATION-DISTINCTION rows.
        S_executor_convention: -4.06
        S_coordinator_convention: -4.65
      - curve: 389a1
        rank_used: 2
        rank_basis: >-
          CERTIFIED RANK LOWER BOUND 2 INSIDE THIS PROGRAM, in v1's CTL-POSITIVE-INDEPENDENCE row.
        S_executor_convention: -11.04
        S_coordinator_convention: -11.74
      - curve: 5077a1
        rank_used: 3
        rank_basis: >-
          CERTIFIED RANK LOWER BOUND 3 INSIDE THIS PROGRAM, in v1's CTL-POSITIVE-INDEPENDENCE row.
        S_executor_convention: -18.10
        S_coordinator_convention: -18.79
      - curve: ICARM no. 302
        rank_used: 31
        rank_basis: >-
          CERTIFIED RANK LOWER BOUND 31 INSIDE THIS PROGRAM, v1 part A branch A-FULL, 31 of 31,
          independently re-verified by a checker written without importing the solver.
        S_executor_convention: -38.83
        S_coordinator_convention: -38.78
      what_the_table_rests_on: >-
        THE FOUR ROWS THAT CTL-GATE-DIRECTION USES ARE ALL CERTIFIED RANK LOWER BOUNDS PRODUCED BY
        THIS PROGRAM'S OWN RUNS -- 1, 2, 3 and 31 -- so the gate direction does not depend on any
        external rank claim at all. The 11a1 row is carried for completeness and is excluded from
        the control, because rank 0 is a rank EQUALITY claim and this program certifies only lower
        bounds. This is a deliberate strengthening over the calibration as it was handed to the
        Coordinator, and it is stated so the difference is visible.
      what_the_table_does_not_establish: >-
        IT IS NOT A PROOF AND IS NOT OFFERED AS ONE. Certified lower bounds do not pin the true
        ranks, five curves are not a distribution, and the Mestre-Nagao heuristic is a heuristic.
        The table establishes a DIRECTION for a SEARCH HEURISTIC that certifies nothing. Every rank
        reported by part C is decided by the exact gate, never by S.

  - id: CHG-2-GATE-SIZE
    clause: part_c_twists_and_near_neighbours.frozen_triage_threshold gate size
    change_type: resize
    from: 20 gated candidates per arm
    to: 200 gated candidates per arm
    basis: >-
      Frozen before any v2 score exists, and identical in both arms as CTL-MATCHED-NULL requires.
      Sizing arithmetic in sizing_basis below. If an arm contains fewer than 200 scored candidates
      the gated count for that arm is the whole arm and BOTH arms are then gated to the smaller of
      the two counts, so the arms stay matched; the reduction is reported as a fraction over 200.

  - id: CHG-3-TWIST-RANGE
    clause: part_c_twists_and_near_neighbours.frozen_twist_set_denominator
    change_type: resize
    from: >-
      every squarefree integer D in [-200, -2], every squarefree integer D in [2, 200], and D = -1;
      D = 1 excluded
    to: >-
      every squarefree integer D in [-10000, -2], every squarefree integer D in [2, 10000], and
      D = -1; D = 1 excluded because E^(1) is E itself and is already part A. Both signs included
      for the reason v1 gives, unchanged: the sign of the twisting discriminant changes the real
      place and therefore the sign of the functional equation.
    containment: >-
      THE v2 RANGE STRICTLY CONTAINS THE v1 RANGE. Every candidate v1 scored is a v2 candidate, so
      v1's numerator and denominator remain recoverable as a sub-fraction of v2's and nothing is
      dropped.

  - id: CHG-4-PERTURBATION-RANGE
    clause: part_c_twists_and_near_neighbours.frozen_null_object_denominator
    change_type: resize
    from: >-
      a6 -> a6 + v for v in {-100, ..., -1, 1, ..., 100}
    to: >-
      a6 -> a6 + v for v in {-6000, ..., -1, 1, ..., 6000}, discarding any with zero discriminant
      and RECORDING EVERY DISCARD with its v and its reason. The null-object rationale is unchanged
      from v1 and still holds at this range: a curve of naive height 468 perturbed additively in a6
      by a number below 6000 is, arithmetically, a random curve of enormous height sharing nothing
      with no. 302 but its size.
    containment: >-
      THE v2 RANGE STRICTLY CONTAINS THE v1 RANGE, same property as CHG-3.

  - id: CHG-5-REDUCED-BOX
    clause: part_c_twists_and_near_neighbours.exact_gate_on_survivors reduced box B-C
    change_type: resize
    from: >-
      x = u / w^2 in lowest terms, w in [1, 10], gcd(u, w) = 1, |u| <= 100000 for w = 1 and
      |u| <= 2000 for 2 <= w <= 10
    to: >-
      x = u / w^2 in lowest terms, w in [1, 15], gcd(u, w) = 1, |u| <= 500000 for w = 1 and
      |u| <= 10000 for 2 <= w <= 15
    containment: >-
      THE v2 REDUCED BOX STRICTLY CONTAINS THE v1 REDUCED BOX.

  - id: CHG-6-BOX-B
    clause: part_b_search_for_a_32nd_point.frozen_search_box_B
    change_type: resize
    from: >-
      x = u / w^2 in lowest terms, w in [1, 30], gcd(u, w) = 1, |u| <= 1000000 for w = 1 and
      |u| <= 10000 for 2 <= w <= 30
    to: >-
      x = u / w^2 in lowest terms, w in [1, 100], gcd(u, w) = 1, |u| <= 30000000 for w = 1 and
      |u| <= 300000 for 2 <= w <= 100
    why_widening_a_box_after_a_null_is_not_the_defect_class_CHG_1_is: >-
      STATED BECAUSE THE TWO LOOK ALIKE AND ARE NOT. CHG-1 changes a SELECTION RULE over a scored
      population, which is why it needs the external-fact argument above. CHG-6 changes a SEARCH
      REGION whose description, whose denominator and whose stopping rule are all frozen before any
      v2 candidate is tested, and which strictly contains the v1 region, so no candidate is dropped
      and no numerator or denominator becomes a function of an outcome. v1's B-NULL stands exactly
      as recorded at 2347563 / 2347563 and is reported beside v2's fraction. What widening cannot
      do is convert a null into information about the rank of no. 302: the known points have
      x-numerators of about 33 decimal digits, v1's box reached 7 and v2's reaches 8. THE GAP IS
      NOT CLOSED BY THIS OR ANY AFFORDABLE BOX and the interpretation clause below is unchanged.
    containment: >-
      THE v2 BOX B STRICTLY CONTAINS THE v1 BOX B.

  - id: CHG-7-MINIMALITY-AT-THE-GATE
    clause: part_c_twists_and_near_neighbours.exact_gate_on_survivors
    change_type: addition
    added_requirement: >-
      EVERY GATED CURVE IN EITHER ARM MUST CARRY AN EXPLICIT `minimality_status` FIELD. No gated row
      may omit it and no gated row may leave it null. Permitted values and what each requires are
      in the minimality_regime block below. v1 established no minimality for its 40 gated curves,
      which was harmless there because every certified rank was 0, but which would block claim-bar
      clause (1) the moment a rank were found. This closes that.

  - id: CHG-8-PER-PART-CAPS
    clause: budget.per_part_caps and the part stopping rules
    change_type: resize
    from: >-
      part_a_seconds 1500, part_b_seconds 700, part_c_seconds 1100 split 600 triage and 500 gate,
      artifact_reserve_seconds 300
    to: >-
      part_a_seconds 200, part_b_seconds 700, part_c_seconds 2400 split 600 triage, 1500 exact gate
      and 300 minimality screen, artifact_reserve_seconds 300; total 3600 unchanged
    basis: >-
      Part A measured 1.9 s in v1 at the bounds v2 also uses, so 1500 s was ninety-nine percent
      idle reservation; 200 s is still a hundredfold margin and it releases 1300 s to the part that
      can actually use it. The task budget, the memory cap, the run cap and the maximum worker
      count are UNCHANGED.

  - id: CHG-9-EXCLUDED-PRIME-LIST
    clause: part_a_certify_rank_31.search_bounds_are_the_executors_to_raise_and_must_be_recorded
    change_type: correction
    from: >-
      v1's illustrative list of primes removed from the usable pool by the witness-point
      denominators names 2, 3, 5, 7, 11, 23, 29, 31 and more.
    to: >-
      23 IS NOT EXCLUDED. It divides no witness-point denominator. The primes actually excluded, as
      measured by v1 and recorded in its report, are 2, 3, 5, 7, 11, 29, 31, 43, 103, 229 and
      60257. This list is ILLUSTRATIVE AND NON-BINDING in v1 and remains illustrative and
      non-binding in v2: it changes no frozen quantity, no search bound and no result. It is
      corrected because a wrong number in a contract is a wrong number in a contract.

  # ---------------------------------------------------------------------------
  # SIZING. WHAT WAS CHOSEN AND WHY, WITH THE ARITHMETIC EXPOSED.
  # ---------------------------------------------------------------------------

  sizing_basis:
    the_question_being_answered: >-
      v1 consumed 23.8 s of 3600. The instruction driving this overlay is to size the frozen
      regions so they actually consume the budget. The sizing below is stated as arithmetic rather
      than as a judgement so that a reviewer can check it and so that the Executor can report
      measured throughput against it.
    measured_throughput_constants_from_v1:
      point_test_seconds_per_candidate: 1.46e-06
      point_test_source: >-
        v1 part B exhausted N_B = 2347563 candidates in 3.418 s on one worker. The same constant is
        consistent with v1's part-C gate, which tested 40 curves against a 220901-candidate reduced
        box in 11 s.
      triage_score_seconds_per_candidate: 0.0054
      triage_score_source: >-
        v1 scored 443 candidates at p <= 500 in 2.4 s. The cost is dominated by counting #E(F_p)
        for the 95 primes below 500 and is independent of the size of the curve coefficients, since
        the coefficients are reduced mod p first.
    sizing_constant_actually_used: 2.0e-06
    sizing_constant_rationale: >-
      2.0e-06 s per point test, deliberately ABOVE the 1.46e-06 measured, because v2's boxes reach
      w = 100 and D up to 10000, and w^6 and D^3 enlarge the integers entering math.isqrt by
      roughly forty bits each. The margin is stated rather than hidden so a reviewer can see that
      the projected consumption below is a conservative projection and not a measurement.
    projected_consumption_against_the_new_caps:
      part_a_projected_seconds: 10
      part_a_cap_seconds: 200
      part_b_projected_seconds: 192
      part_b_cap_seconds: 700
      part_c_triage_projected_seconds: 131
      part_c_triage_cap_seconds: 600
      part_c_gate_projected_seconds: 934
      part_c_gate_cap_seconds: 1500
      part_c_minimality_projected_seconds: 15
      part_c_minimality_cap_seconds: 300
      total_projected_seconds: 1282
      total_task_budget_seconds: 3600
      projected_fraction_of_task_budget: 0.36
      projected_fraction_of_the_3300_s_compute_allocation: 0.39
    why_not_size_to_one_hundred_percent_of_the_caps: >-
      BECAUSE THE CAPS ARE HARD STOPS AND A REGION SIZED TO EXACTLY FILL ITS CAP AT A NOMINAL
      THROUGHPUT TRUNCATES ON ANY SLOWER MACHINE, converting a COMPLETE measurement into a coverage
      fraction. The choice made here is a projected consumption near forty percent of the compute
      allocation with a safety factor of roughly 2.5 against the sizing constant, which itself
      already carries a 1.4x margin over the measured constant -- about 3.5x end to end. On the v1
      machine that is a fifty-fold increase in consumed budget over v1 with full coverage expected
      in every region. If the machine is faster, the regions still exhaust and the surplus is
      reported as unused. If the machine is three times slower than projected, the caps bite and
      the shortfall is reported as a fraction over the unchanged frozen denominators. THE
      DENOMINATOR IS NEVER REDEFINED TO MATCH WHAT WAS REACHED.
    approximate_denominators_for_sizing_only:
      binding: false
      warning: >-
        THESE ARE THE COORDINATOR'S ESTIMATES, COMPUTED BY HAND FOR SIZING, AND THEY ARE NOT
        BINDING AND NOT TO BE COPIED INTO ANY DELIVERABLE. THE BINDING DENOMINATORS ARE THE EXACT
        COUNTS THE EXECUTOR COMPUTES FROM THE FROZEN DESCRIPTIONS AND WRITES TO DISK BEFORE ANY
        CANDIDATE IS TESTED OR SCORED. If an exact count disagrees with an estimate here, THE EXACT
        COUNT GOVERNS and the estimate is simply wrong.
      N_B_v2_estimate: 96000000
      N_C_TWIST_v2_estimate: 12159
      N_C_NULL_v2_estimate: 12000
      reduced_box_v2_estimate: 1167031
      how_the_estimates_were_formed: >-
        Box B: 2 x 30000000 + 1 for w = 1, plus 600001 x sum over w in [2,100] of phi(w)/w, with
        that sum approximated by 99 x 6/pi^2. Twist arm: 6/pi^2 x 10000 squarefree integers per
        sign, doubled, plus D = -1. Null arm: exactly 12000 minus any zero-discriminant discards.
        Reduced box: 1000001 for w = 1 plus 20001 x sum over w in [2,15] of phi(w)/w.

  # ---------------------------------------------------------------------------
  # FROZEN v2 QUANTITIES, GATHERED IN ONE PLACE
  # ---------------------------------------------------------------------------

  frozen_v2_quantities:
    freeze_discipline: >-
      SAME DISCIPLINE AS v1, RESTATED BECAUSE IT IS THE POINT. Every denominator below is computed
      from the frozen description ALONE, is WRITTEN TO DISK BEFORE the first candidate in its
      region is tested or scored, and MAY NOT BE RECOMPUTED, NARROWED OR WIDENED AFTERWARDS. A
      budget shortfall is a COVERAGE FRACTION over the unchanged denominator, NEVER a redefinition
      of the denominator. This is a contract term, not a request, for the reason v1 states at
      length and does not need repeating here.
    box_B: >-
      x = u / w^2 in lowest terms, w an integer in [1, 100], gcd(u, w) = 1, |u| <= 30000000 for
      w = 1 and |u| <= 300000 for 2 <= w <= 100. Denominator N_B_v2.
    reduced_box_B_C: >-
      x = u / w^2 in lowest terms, w an integer in [1, 15], gcd(u, w) = 1, |u| <= 500000 for w = 1
      and |u| <= 10000 for 2 <= w <= 15. Denominator N_BC_v2.
    twist_set: >-
      every squarefree integer D in [-10000, -2], every squarefree integer D in [2, 10000], and
      D = -1; D = 1 excluded. Denominator N_C_TWIST_v2.
    null_set: >-
      a6 -> a6 + v for v in {-6000, ..., -1, 1, ..., 6000}, zero-discriminant curves discarded and
      every discard recorded with its v. Denominator N_C_NULL_v2.
    triage_score: >-
      S = sum over primes p <= 500 of (a_p log p) / p, computed with the SAME implementation, the
      SAME prime bound and the SAME conventions in both arms and in both v1 and v2. UNCHANGED FROM
      v1 BY DESIGN, so that v1's recorded per-candidate scores stay comparable and reusable.
    triage_conventions_pinned_because_reuse_depends_on_them: >-
      PINNED EXPLICITLY, because reusing v1's scores is only sound if the implementation is the
      same one. (i) EVERY prime p <= 500 is included, good or bad. (ii) #E(F_p) is the naive affine
      point count of the STATED MODEL over F_p plus the point at infinity, which at a bad prime is
      the count on the singular model -- a uniform convention applied identically to every
      candidate in both arms, and NOT the arithmetic a_p of the curve. (iii) Both arms are scored
      and gated on the standard integral model [0, b2, 0, 8 b4, 16 b6]; the twist arm is
      [0, b2 D, 0, 8 b4 D^2, 16 b6 D^3] and the null arm is the same transformation applied to
      [1, 1, 1, a4, a6 + v]. (iv) These are the v1 producer's conventions, adopted verbatim. If the
      v2 producer cannot reproduce them exactly, CTL-SCORE-REUSE-AGREEMENT fails and reuse is
      forbidden; see that control.
    gate_rule: >-
      The exact gate is applied to EXACTLY the 200 candidates of SMALLEST S in each arm and to no
      others -- most negative first, equivalently top 200 by -S -- with ties broken by smallest |D|
      (respectively smallest |v|), then positive sign before negative. The gated count is 200 per
      arm BY CONSTRUCTION, fixed before anything runs and independent of the scores observed.
    per_part_caps:
      part_a_seconds: 200
      part_b_seconds: 700
      part_c_triage_seconds: 600
      part_c_exact_gate_seconds: 1500
      part_c_minimality_screen_seconds: 300
      artifact_reserve_seconds: 300
      task_total_seconds: 3600
    unchanged_from_v1:
    - the 3 GB memory cap and the reason it sits below the templates floor
    - maximum_runs 40 and maximum_workers 1
    - the seed 20260824 and the determinism note
    - the artifact_size_budget of 25 MiB total and 5 MiB per file with no declared exceptions
    - the claim bar, all six clauses, word for word
    - the claim_tier_ceiling
    - the run_path_requirement and the manifest schema
    - the certificate_kinds_and_a_schema_reconciliation block
    - every invalidation rule, read with the v2 numbers substituted for the v1 numbers
    - the no-network-call and no-ICARM-submission rules
    - the six v1 controls
    - the standing_negative and the provenance caveat on the fetched input

  # ---------------------------------------------------------------------------
  # SCORE REUSE
  # ---------------------------------------------------------------------------

  score_reuse:
    decision: >-
      THE v1 SCORES ARE REUSED AND ARE THE VALUES OF RECORD FOR THE 443 CANDIDATES v1 SCORED. They
      are recorded per candidate in
      coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/twist_search.json under
      `all_candidates`, each row carrying `arm`, `identifier_name`, `identifier`, `status`, `S`,
      `gated` and `gate_status`. The 243 twist rows with 2 <= |D| <= 200 or D = -1, and the 200
      null rows with |v| <= 100, are read from that file rather than re-derived, and the
      deliverable must say so per row with a `score_source` field valued `v1_reused` or
      `v2_scored`. NO NEW SCORING RUN IS NEEDED FOR THEM.
    but_verify_because_it_is_free: >-
      CTL-SCORE-REUSE-AGREEMENT below re-scores all 443 anyway, because at the measured 5.4 ms per
      candidate that costs 2.4 s of a 600 s triage cap -- about four tenths of one percent -- and
      it converts an assumption about implementation identity into a checked fact. THE REUSED v1
      VALUES REMAIN THE VALUES OF RECORD; the re-score is a control, not a replacement. If they
      agree, nothing changes. If they disagree, the pooled distribution is invalid and the run
      stops and reports.
    what_reuse_does_not_buy: >-
      RE-SCORING WOULD NOT MAKE THOSE 443 SCORES UNSEEN. The reuse question is about
      implementation drift only. The epistemic question -- that a selection rule changed after
      those scores were observed -- is handled by restricting pre-registered inference to the
      v2-only subset, and by nothing else.

  # ---------------------------------------------------------------------------
  # MINIMALITY
  # ---------------------------------------------------------------------------

  minimality_regime:
    the_instruction_and_the_honest_reading: >-
      THE INSTRUCTION TO THIS AMENDMENT WAS THAT v2 MUST REQUIRE MINIMALITY FOR ANY CANDIDATE THAT
      REACHES THE EXACT GATE. Read as "establish global minimality for all 400 gated curves before
      gating", that is INFEASIBLE AT ANY BUDGET and the Coordinator says so rather than writing an
      unsatisfiable clause: Laska-Kraus-Connell minimalisation needs the factorisation of
      discriminants of roughly 450 to 900 decimal digits. WHAT IS WRITTEN INSTEAD, AND THE
      DIFFERENCE IS DELIBERATE AND FLAGGED: minimality must be ADDRESSED on every gated row, a
      genuine partial minimality statement must be COMPUTED on every gated row, and ESTABLISHED
      minimality is required exactly where it binds -- on any row that could support a rank claim.
      A reviewer who thinks the stricter reading was affordable should say so and this clause
      should be amended again.
    why_it_does_not_touch_the_measurement: >-
      A CERTIFIED RANK LOWER BOUND FROM EXHIBITED POINTS IS INVARIANT UNDER Q-ISOMORPHISM AND NEEDS
      NO MINIMAL MODEL. Minimality binds the CLAIM BAR, clause (1), not the arithmetic. v1 stated
      this correctly and v2 does not weaken it.
    required_on_every_gated_row:
      field: minimality_status
      permitted_values:
      - established_globally_minimal
      - minimal_at_all_primes_up_to_B_with_B_recorded
      - not_established_with_reason
      partial_screen_that_must_be_computed: >-
        For every gated curve in both arms, trial divide the exact discriminant by every prime
        p <= 100000 and, for each such p with p^12 dividing the discriminant, test whether the
        Kraus-Laska descent at p applies. Report `minimal_at_all_primes_up_to_B` with B = 100000
        when no p <= B admits a descent, and report the list of primes that do when any does. THIS
        IS A PARTIAL STATEMENT AND MUST BE LABELLED PARTIAL. It does NOT satisfy claim-bar
        clause (1) and no artifact may say it does.
      cost: >-
        Roughly 9592 primes per curve against a 400-curve gated set, projected at about 15 s
        against a 300 s cap. If the cap binds, the screen is truncated and reported as a fraction
        over 400; a truncated screen never becomes an assumed minimality.
      naive_height_labelling: >-
        Every reported naive height in part C is a height OF THE STATED MODEL and must be labelled
        so, exactly as v1 did.
    where_established_minimality_actually_binds:
    - >-
      ANY GATED CURVE RETURNING A CERTIFIED RANK LOWER BOUND OF 1 OR MORE. The row is reported as a
      certified rank lower bound over Q ON THE STATED MODEL, with minimality_status carried beside
      it, and the deliverable must state explicitly whether claim-bar clause (1) is discharged. If
      it is not, the row may not be cited in support of any rank claim beyond the stated model.
    - >-
      ANY GATED CURVE RETURNING A CERTIFIED RANK LOWER BOUND OF 32 OR MORE. This is the branch that
      meets GOAL-ECQ-2298dc C1. The Executor DOES NOT ATTEMPT MINIMALITY INLINE and DOES NOT STOP
      the remaining coverage work: it reports the row, flags claim-bar clause (1) as OUTSTANDING,
      and the Coordinator opens a dedicated task for global minimality plus the independent
      review-breakthrough review at max effort required by clause (6) before the words rank 32
      appear anywhere.

  # ---------------------------------------------------------------------------
  # NEW CONTROLS. THE SIX v1 CONTROLS ARE UNCHANGED AND STILL BINDING.
  # ---------------------------------------------------------------------------

  controls_added:
  - id: CTL-GATE-DIRECTION
    blocking: true
    when: BEFORE any candidate is gated in either arm, and after the triage implementation exists
    control: >-
      Score the four calibration curves 37a1, 389a1, 5077a1 and ICARM no. 302 with the SAME
      implementation, the SAME prime bound 500 and the SAME conventions used for both arms, and
      also score 11a1 for the record. PASS is that S is STRICTLY DECREASING across the four curves
      in increasing order of their certified rank lower bounds 1, 2, 3, 31, and that the gate
      implementation, given those four curves as a toy population, selects ICARM no. 302 as its
      first pick and 37a1 as its last.
    pass_condition_stated_before_it_runs: >-
      S(37a1) > S(389a1) > S(5077a1) > S(ICARM no. 302), and the gate's own selection routine
      returns them in the order 302, 5077a1, 389a1, 37a1. The 11a1 row is reported but is NOT part
      of the pass condition, because rank 0 is a rank EQUALITY claim that this program cannot
      certify.
    reference_values_for_comparison: >-
      Under the v1 producer's convention the expected values are approximately -4.06, -11.04,
      -18.10 and -38.83. Disagreement in the third decimal is not a failure; a DIFFERENT ORDER or a
      DIFFERENT SIGN PATTERN is.
    failure_meaning: >-
      THE GATE IS INVERTED AGAIN, OR THE SCORE IMPLEMENTATION HAS DRIFTED. STOP. No candidate is
      gated in either arm, part C reports its triage coverage and its score distributions only, and
      the failure is reported as a blocking defect. This control exists because the identical
      defect went undetected through an entire frozen contract once already.
  - id: CTL-SCORE-REUSE-AGREEMENT
    blocking: true
    when: BEFORE any pooled score distribution or between-arm statistic is computed
    control: >-
      Re-score, with the v2 implementation, all 443 candidates v1 scored -- the 243 twist
      candidates with 2 <= |D| <= 200 or D = -1, and the 200 null candidates with |v| <= 100 -- and
      compare each against the value recorded in v1's twist_search.json `all_candidates`. PASS is
      agreement within 1.0e-06 absolute on every one of the 443.
    failure_meaning: >-
      THE IMPLEMENTATION HAS DRIFTED AND THE POOLED DISTRIBUTION IS NOT ONE DISTRIBUTION. Reuse is
      then FORBIDDEN. Report every disagreeing candidate with both values and the difference, and
      either score the whole v2 population fresh under one implementation within the triage cap or,
      if the cap will not allow it, stop part C's pooled statistics and report the triage coverage
      alone. Never mix two implementations into one distribution.
  - id: CTL-MINIMALITY-DISCLOSURE
    blocking: false
    when: on every gated row in both arms
    control: >-
      Every gated row carries a non-null minimality_status from the permitted values, and every
      reported part-C naive height is labelled as a height of the stated model.
    failure_meaning: >-
      A gated row with a null or absent minimality_status is an INCOMPLETE ROW and its rank figure
      may not be cited in any claim, though the coverage fraction it belongs to survives. This is
      not blocking for the run because every expected certified rank is 0; it is blocking for any
      citation of a nonzero one.
  controls_unchanged_and_still_binding:
  - CTL-CITED-INPUT-AGREEMENT
  - CTL-POSITIVE-INDEPENDENCE
  - CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH
  - CTL-SATURATION-DISTINCTION
  - CTL-MATCHED-NULL
  - CTL-PROVENANCE
  controls_note: >-
    ALL NINE CONTROLS RUN IN THE v2 RUN SET. The three mandatory ones -- CTL-POSITIVE-INDEPENDENCE,
    CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH and CTL-SATURATION-DISTINCTION -- must PASS in the
    SAME RUN SET as any positive, because claim-bar clause (5) requires exactly that and a control
    that passed in v1 does not discharge it for v2. CTL-MATCHED-NULL is read with the v2 gate size
    200 substituted for 20; its substance, that both arms are scored with one instrument and gated
    to the same depth with no differential attrition, is unchanged. v1's DEV-A-01 is a standing
    warning here: the 5077a1 generator triple {(-1,3), (0,2), (2,0)} IS DEPENDENT and the correct
    rank-3 generators are {(-2,3), (-1,3), (0,2)}.

  # ---------------------------------------------------------------------------
  # PART C BETWEEN-ARM COMPARISON
  # ---------------------------------------------------------------------------

  part_c_between_arm_comparison:
    v1_descriptive_result_carried_forward_unchanged:
      status: descriptive_only
      twist_n: 243
      null_n: 200
      twist_mean: 1.479
      null_mean: 0.298
      mean_difference_twist_minus_null: 1.181
      twist_sd: 4.035
      null_sd: 4.009
      twist_range: 20.059
      null_range: 23.073
      mann_whitney_z_normal_approximation: 3.24
      probability_a_random_twist_scores_above_a_random_null: 0.5895
      binding_caveat: >-
        NO SIGNIFICANCE THRESHOLD WAS PRE-REGISTERED IN v1 AND NONE IS ASSERTED NOW. These are
        DESCRIPTIVE STATISTICS ONLY and must be reported as such in v2's deliverable, unchanged and
        not recomputed. Note the direction: since S DECREASES with rank, the twist arm scoring
        HIGHER than the null arm is, in the score's own logic, the twist arm looking LOWER-rank
        than its matched null, which is the OPPOSITE direction from enrichment. The effect is small
        relative to a within-arm standard deviation near 4.0.
      why_it_is_carried: >-
        Because the distributions are NOT FLAT -- each arm spans 20 to 23 units of S with a
        standard deviation near 4.0 -- so a corrected bottom-200 gate WILL select a distinctly
        different and well-separated set of candidates rather than an arbitrary one. That is the
        operative fact for CHG-1, and it comes from v1's measurement.
    v2_preregistered_comparison:
      status: confirmatory
      population: >-
        THE v2-ONLY SUBSET AND NOTHING ELSE: twist candidates with 200 < |D| <= 10000, and null
        candidates with 100 < |v| <= 6000. This population is DISJOINT from every candidate scored
        in v1, so no score entering it exists anywhere at the time this record is frozen. That
        disjointness is the whole reason a threshold may honestly be pre-registered here.
      statistic: >-
        Two-sided Mann-Whitney U on the v2-only subset, twist against null, reported with the
        normal-approximation z, together with the common-language effect size
        P(a random twist scores above a random null) = U / (n_twist * n_null).
      preregistered_threshold: >-
        A result is called NOTABLE only if BOTH |z| >= 3.0 AND the common-language effect size
        falls outside [0.45, 0.55]. BOTH conditions are required and the second is the operative
        one: with n near twelve thousand per arm, a z of 3.0 is reachable from an effect too small
        to mean anything, so a z threshold alone would be a machine for manufacturing findings.
      what_notable_would_and_would_not_license: >-
        NOTABLE MEANS "REPLICATE THIS", NOT "THIS IS TRUE". It would license one replication
        experiment on a fresh disjoint discriminant range, and nothing else. It would NOT license a
        statement that the twist neighbourhood of no. 302 is enriched, NOT a rank claim of any
        kind, and NOT an evidence record above `weak` on a single unreplicated run. The score
        certifies nothing.
      confounds_recorded_before_the_run: >-
        The two arms are structurally different families scored under one shared bad-prime
        convention, and the twist arm's coefficients grow like D^3 across a range now reaching
        10000 while the null arm's grow not at all. A between-arm difference is therefore
        confounded with coefficient growth and with bad-prime handling, and neither confound is
        removed by any statistic computed here.
    pooled_comparison:
      status: descriptive_only
      rule: >-
        Any statistic computed over v1 and v2 candidates together is DESCRIPTIVE ONLY, is labelled
        so in the deliverable, and carries no pre-registered threshold. It is reported for
        completeness and may not be cited as a finding.

  # ---------------------------------------------------------------------------
  # PRIORS AND BRANCHES, PRE-REGISTERED BEFORE ANY v2 RUN EXISTS
  # ---------------------------------------------------------------------------

  preregistered_prediction_v2:
    part_b: >-
      NO RANK-INCREASING HIT. The widened box reaches 8-digit x-numerators; the 31 known points
      have x-numerators of about 33 decimal digits. A hit would refute the board's own
      "BSD + GRH certified to rank 31" reading and would be a world record, which is why it is
      worth 700 s to look, but the expected outcome is a null and a null is therefore not a
      discovery, not a surprise and not a result about the curve. No expected hit rate is estimable
      from anything this program has measured and none is invented here.
    part_c: >-
      MAXIMUM CERTIFIED RANK LOWER BOUND 0 IN BOTH ARMS, EVEN UNDER THE CORRECTED GATE. Correcting
      the gate changes WHICH candidates are examined; it does not change the height gap. The
      reduced box reaches 6-digit x-numerators on curves whose naive height is at least that of
      no. 302 and, for large |D|, considerably more, since twisting by D multiplies the model's
      coefficients by powers of D. A nonzero certified rank in either arm would be a genuine
      surprise; a certified rank of 32 or more would be a world record and would engage the claim
      bar in full.
    what_is_actually_expected_to_be_informative: >-
      The coverage fractions, the two score distributions at roughly fifty times v1's sample size,
      and the pre-registered between-arm comparison on the disjoint v2-only subset. Not a rank.
    part_a: >-
      k = 31, reproducing v1. Part A is re-run in v2 ONLY to re-establish the mandatory controls in
      the same run set and to keep the instrument calibrated; ITS RESULT IS NOT A NEW RESULT and
      A-FULL as recorded in v1 is not superseded, strengthened or re-earned by re-running it.
    source: >-
      Coordinator prior for TASK-20260824-02c3e4, recorded in this overlay before any v2 run
      exists.

  success_criterion_v2:
    unchanged_branches: >-
      A-FULL, A-PARTIAL, B-NULL, B-POSITIVE and B-INDEX-REDUCING keep their v1 definitions exactly,
      read against the v2 box B and its denominator N_B_v2.
    part_c_branches_restated_under_the_corrected_gate:
      C2-NULL: >-
        EXPECTED. No gated curve in either arm certifies rank above 0 under the corrected
        bottom-200 gate. UNLIKE v1's C-NULL, THIS ONE IS INFORMATIVE ABOUT THE TWIST NEIGHBOURHOOD,
        because the gate now examines the candidates each arm's own score ranks as MOST promising.
        Its scope is nonetheless exact and narrow: no certifiable rank was found within the frozen
        reduced box B-C, among the 200 lowest-S candidates per arm, over the frozen ranges
        |D| <= 10000 and |v| <= 6000, at the reported coverage fractions. It is NOT a statement
        that the twist neighbourhood is barren, because the reduced box reaches 6 digits and the
        candidates are of enormous height; it is a statement that this gate at this depth found
        nothing.
      C2-MODEST: >-
        A gated curve certifies a rank lower bound between 1 and 31 over Q for E^(D) or for a
        perturbed curve. THAT IS A MODEST RANK OVER Q OF THAT CURVE AND NOTHING MORE. It is not
        added to no. 302's 31, it is not a number-field result, and it does not meet or approach
        GOAL-ECQ-2298dc C1. It carries its minimality_status and it is reported with the arm it
        came from, since a null-arm hit and a twist-arm hit mean different things.
      C2-POSITIVE: >-
        A gated curve certifies a rank lower bound of 32 or more OVER Q FOR ITS OWN
        MORDELL-WEIL GROUP. THIS MEETS GOAL-ECQ-2298dc C1 AND IS A WORLD RECORD, whether the curve
        came from the twist arm or the null arm, because a twist of no. 302 is an elliptic curve
        over Q like any other and rank is not twist-invariant so nothing is inherited. It is
        subject to the six-clause claim bar IN FULL, including established global minimality and
        independent review-breakthrough review at max effort, and the words rank 32 may not appear
        in any artifact until every clause is discharged.
    the_experiment_succeeds_in_every_branch: >-
      Unchanged from v1: it succeeds as an experiment in every branch provided k, the coverage
      fractions with their pre-recorded denominators, the branch labels, the nine control outcomes
      and the v1-beside-v2 gate comparison are all reported. IT FAILS ONLY BY REPORTING A BRANCH IT
      DID NOT EARN.

  falsification_criterion_v2: >-
    Unchanged from v1 in substance, with one addition. THE BOARD'S "rank exactly 31" READING OF
    no. 302 IS FALSIFIED BY BRANCH B-POSITIVE AND BY NOTHING ELSE HERE, in particular not by any
    twist result, since rank is not twist-invariant. THIS PROGRAM'S CAPABILITY TO CERTIFY AT RECORD
    SCALE IS FALSIFIED BY A-PARTIAL with k materially below 31. THE MATCHED-NULL DESIGN IS
    FALSIFIED if the arms cannot be scored with the same instrument at the same coverage and gated
    to the same depth, in which case the comparison is withdrawn whatever it showed. ADDED IN v2:
    THE CORRECTED GATE ITSELF IS FALSIFIED BY CTL-GATE-DIRECTION, and a failure there withdraws
    every part-C gating decision in the run while leaving the triage coverage and the score
    distributions reportable. NOT FALSIFIED by any timeout, alarm, crash or memory outcome, all of
    which bound coverage and are never negative mathematical evidence.

  # ---------------------------------------------------------------------------
  # RUNS AND SCOPE
  # ---------------------------------------------------------------------------

  affected_runs: []
  affected_runs_note: >-
    EMPTY BECAUSE NO RAW RUN RECORD IS ALTERED, SUPERSEDED OR REPAIRED BY THIS OVERLAY, which is
    the prohibition docs/task-lifecycle.md states for amendments. The seven v1 runs stand on disk
    exactly as written, including the two superseded ones. What this overlay does change is the
    INTERPRETATION available from RUN-ECQ-f5af06-C-twists: its C-NULL branch is re-scoped by
    `reason` above from "the twist neighbourhood carries no certifiable rank" -- which it never
    licensed -- to "the twenty lowest-ranked candidates by S in each arm carry no certifiable rank
    in the frozen reduced box". That re-scoping is a statement about what the run always supported,
    not an edit to it.
  runs_authorized_by_this_overlay: >-
    The v2 run set dispatched by TASK-20260824-02c3e4, written under
    experiments/EXP-ECQ-f5af06/runs/RUN-<id>/ with run.experiment_id set to EXP-ECQ-f5af06 from the
    start, subject to the unchanged maximum_runs of 40. Run identifiers must be distinguishable
    from v1's at a glance; use a v2 marker in the run id.
  confirmatory_status: reset
  confirmatory_status_note: >-
    RESET, WITH THE PER-PART READING SPELLED OUT BECAUSE ONE ENUM VALUE CANNOT CARRY IT. PART A:
    PRESERVED. v1's A-FULL stands and is not re-earned; the v2 re-run exists only to put the
    mandatory controls in the same run set as any v2 positive. PART B: RESET. The box changed, so
    the v2 coverage figure is a new confirmatory measurement against a newly pre-registered prior,
    and v1's B-NULL stands beside it at its own denominator. PART C GATE: RESET. The confirmatory
    readout under a correctly-signed gate has never been run; its prior is pre-registered above
    before any v2 score exists. PART C BETWEEN-ARM COMPARISON: CONFIRMATORY on the disjoint
    v2-only subset with the threshold pre-registered above, EXPLORATORY_ONLY on the 443 v1-scored
    candidates and on any pooled statistic. Nothing in v2 may be evaluated against a criterion it
    was not pre-registered against.

  # ---------------------------------------------------------------------------
  # DELIVERABLE REQUIREMENTS ADDED OR CHANGED
  # ---------------------------------------------------------------------------

  required_artifact_contents_delta:
    twist_search.json: >-
      In addition to everything v1 required, read with the v2 denominators substituted: the
