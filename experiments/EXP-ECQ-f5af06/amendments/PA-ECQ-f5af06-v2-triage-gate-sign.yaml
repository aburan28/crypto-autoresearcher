  id: PA-ECQ-f5af06-v2-triage-gate-sign
  experiment_id: EXP-ECQ-f5af06
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, unchanged from v1. No hypothesis of this program's own is under test.
    See experiments/EXP-ECQ-f5af06/specification.yaml hypothesis_id_note, which this overlay
    does not touch.
  batch_id: null
  version_from: 1
  version_to: 2
  authored_at: '2026-08-24'
  authored_by: coordinator
  approved_by: coordinator
  authoring_task: null
  authoring_task_note: >-
    This overlay was authored by the Coordinator in the orchestrating session directly, without a
    minted authoring TASK identifier, because the authoring session has no shell and cannot run
    tools/allocate_id.py. That is recorded as a gap rather than papered over. It binds on the
