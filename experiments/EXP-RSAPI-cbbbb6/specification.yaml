experiment:
  id: EXP-RSAPI-cbbbb6
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-684f4a; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-684f4a
  question_id: RQ-RSA-d46f02
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Evaluate exact impossibility, guarantee and undecided regions of the dimension-by-leakage
    plane for a reproduced small-root construction using rational arithmetic only, then overlay measured
    frontiers from existing run records.
  objective: 'The one uncertainty a run reduces - here almost entirely without running anything -
    is how much of the concrete parameter plane is actually decided by exact argument, as opposed
    to being the undecided territory in which every measurement in this bucket will land. Concretely:
    (i) whether the three predicates can be evaluated exactly at all for the reproduced construction,
    which requires the determinant as an exact integer expression and a declared counting model, and
    which is the gating question; (ii) what the areas of the impossibility, guarantee and undecided
    regions are on a declared grid at each tested modulus size, in exact rationals, with signed margins
    per cell and a grid-refinement stability check; (iii) where the success frontiers already measured
    by other entries in this bucket sit relative to those regions, using only existing run records
    and never commissioning a new run for the overlay, together with the null-lattice arm that makes
    the overlay interpretable. A run also delivers a pre-screen that every other grid in this bucket
    can use, dropping cells that are provably uninformative and marking cells that serve as positive
    controls.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for this reproduced
      construction, this declared counting model, this declared shortest-vector bound and this grid,
      the exact areas and boundaries of the three regions at the tested modulus sizes, together with
      the region membership of previously measured success frontiers. WHAT DOES NOT FOLLOW: nothing
      about the tightness of any published bound, since a sufficient condition may leave an arbitrarily
      large undecided band and remain correct; no claim that success is impossible anywhere except
      in the counting region I, and I is exact only relative to its declared model; no prediction
      about what any implementation will do, since the guarantee region assumes an oracle no implementation
      provides; and no attack, security consequence or statement about deployed RSA.'
  inputs:
    procedure: 'STAGE 0 (zero compute): declare the construction, the grid in n, D and u, the counting
      model for I, the shortest-vector bound for G, and the definition of the reachable plane. STAGE
      1 (minutes, exact arithmetic): compute the determinant as an exact integer expression and evaluate
      the guarantee predicate at every cell. STAGE 2 (minutes): evaluate the counting predicate at
      every cell and mark I. STAGE 3 (minutes): assemble U, compute all three areas as exact rationals,
      and record signed margins per cell. STAGE 4 (minutes): degenerate-case self-tests at u = 1 and
      at D = 1, and the grid-refinement recomputation at half step. STAGE 5 (minutes): parallel floating-point
      evaluation to confirm no boundary was decided by rounding. STAGE 6 (CPU-hours, only if an overlay
      is made): run the null-lattice arm on the instances of whichever existing run record is being
      overlaid, in one invocation with the overlay analysis. STAGE 7 (zero compute): report regions,
      areas, margins and overlay membership.'
    instrument: Python 3.11 with python-flint or gmpy2 for exact integer and rational arithmetic;
      the fractions module is acceptable for the predicate evaluation. No lattice library is required
      for STAGES 0 through 5. fpylll 0.6.4 via the route in KN-TECH-14efa5 is used only in STAGE 6
      for the null-lattice arm. harness/runner.py for the manifest, so that the symbolic outputs are
      recorded as immutable run artifacts like any other; harness/run.py as the bounded-run wrapper.
      No Sage.
    parameters: Modulus bit-length n in {64, 128, 256, 512, 1024}. Lattice dimension D from 8 to 64
      in steps of 4, refined to steps of 2 in the refinement control. Leaked fraction u on a grid
      of 0.005 over the full unit interval, refined to 0.0025. Counting-model margin declared as a
      factor of 2 in expected consistent candidates. Reachable plane defined as D at most 64 and u
      in the interval where the construction is defined. STAGE 6 null-lattice arm, if used, at 40
      instances matching the overlaid record.
  controls:
  - Null lattice of matched dimension and determinant with no planted structure, showing that I and
    G carry no construction-specific information.
  - Executable null arm confirming that measured success vanishes on the null lattice, run in the
    same invocation as any overlay.
  - 'Grid-refinement control: all three region areas recomputed at half the grid step.'
  - 'Degenerate-case control: at u = 1 the leak determines the prime entirely and I must be empty
    and G must contain the cell, which is a self-test of the predicates.'
  - 'Exact-arithmetic control: every predicate evaluated in exact rationals, with a parallel floating-point
    evaluation reported only to confirm no boundary is decided by rounding.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical symbolic computation runs against a null construction:
    a lattice of the same dimension and the same determinant built from a random unimodular transform
    of a generic basis with NO planted polynomial structure. The null must show that region I is unchanged,
    since counting depends only on the leak and not on the lattice, while region G is essentially
    unchanged as well, since the shortest-vector guarantee depends only on dimension and determinant.
    That is the point of the null: it demonstrates that G and I carry no information about the CONSTRUCTION,
    only about its coarse invariants, and therefore that any predictive content about a particular
    construction must live in U. A second, executable null is required before the overlay in Stage
    5: measured success from any other entry, when re-run on the null lattice, must vanish, confirming
    that success in U is a property of the planted structure.'
  independent_variables:
  - modulus bit-length n
  - lattice dimension D
  - leaked fraction u
  - grid step (refinement control)
  metrics:
    primary:
    - exact rational area of U as a fraction of the reachable plane
    - exact rational areas of I and G
    - region label and signed margin of each previously measured success frontier
    - grid-refinement stability of all areas
    secondary:
    - signed margin to each boundary per cell
    - count of exact-versus-floating-point disagreements, required to be zero
    - degenerate-case self-test outcomes
    - null-lattice arm recovery rate in any overlay
  heuristic_under_test: null
  preregistered_prediction:
    quantity: A(U, n), the area of the undecided band as an exact rational fraction of the declared
      reachable plane at modulus size n.
    formula: A(U, 256) >= 0.25. Every previously measured success frontier satisfies region label
      equal to U, with strictly positive signed margin to the boundary of G. No previously measured
      success lies in I. G is defined by the exact Howgrave-Graham norm requirement holding for the
      declared shortest-vector bound at the cell's exact determinant and dimension; I is defined by
      the declared counting model exceeding one consistent candidate by the declared margin.
    source: Pre-registered in the parent proposal IDEA-20260816-684f4a before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The symbolic stages cover modulus sizes from 64 to 1024 bits and dimensions to
      64, because symbolic evaluation costs nothing and there is no reason to restrict it. That breadth
      is NOT a claim of validity at cryptographic scale: the regions are exact consequences of declared
      definitions at each cell and involve no extrapolation whatsoever, and the only empirical content,
      the overlay, is confined to whatever sizes existing run records actually cover. The scale tier
      is recorded as toy because every empirical arm in this contract is at toy scale, and the symbolic
      breadth must not be read as a cryptographic-scale result.'
    correspondence: null
  tail_checks:
  - Cells with signed margin within one grid step of a boundary, listed individually
  - Behaviour of all three regions at the extreme values u near 0 and u near 1
  - Behaviour at the smallest dimension D = 8, where closed-form bounds are weakest
  - Whether the area of U is dominated by a thin strip or by a broad region, reported as the width
    distribution of U along u
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report if the determinant cannot be expressed exactly, since every downstream boundary
    would then be approximate
  - Do not perform any overlay unless the null-lattice arm can be run in the same invocation
  - Halt the STAGE 6 arm at the per-instance cap and record it as budget-limited
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A run succeeds if all three regions are evaluated in exact arithmetic at every
    grid cell, areas are stable under grid refinement, degenerate-case self-tests pass, no boundary
    is decided by rounding, and any overlay is accompanied by a null-lattice arm run in the same invocation.
  falsification_criterion:
  - Empty G over the reachable grid falsifies the area comparison and is reported as a vacuous guarantee
    region
  - A(U, 256) below 0.25 refutes the central claim
  - Any previously measured success falling in I invalidates either the counting model or the instance
    generator
  - Grid-refinement instability beyond the declared error falsifies the reported areas
  - Any exact-versus-floating-point disagreement requires recomputation of the affected cells before
    any area may be reported
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-684f4a
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The construction must be filed as a KN-LIT entry from primary text before approval, per RQ-RSA-d46f02's
    constraints; an approximate determinant makes every boundary silently wrong.
  - The counting model for region I is described here in outline and must be written exactly, including
    how many primes of the target size are consistent with a given leak and what margin counts as
    impossible.
  - Which closed-form shortest-vector bound to use for G is a Coordinator decision, and the choice
    changes the area of U materially; the contract must name one and report the area as conditional
    on it.
  - The definition of the reachable plane is a choice that all reported fractions depend on and it
    must be fixed before evaluation rather than after seeing the regions.
