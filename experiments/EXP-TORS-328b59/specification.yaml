experiment:
  id: EXP-TORS-328b59
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-053a55
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE KERNEL-OR-INJECTIVE DICHOTOMY FOR ELL-ISOGENY POINT TRANSPORT: the images (phi(P), phi(Q))
    under an F_p-rational Elkies ell-isogeny are genuinely point-dependent, publicly computable ell-torsion
    data obtainable without any discrete logarithm, and they create exactly zero new information about
    k -- because every isogeny is either injective on G (a relabelling with an efficiently computable
    inverse) or contains G in its kernel (annihilating the instance), with no intermediate case, and
    the unique annihilating isogeny has degree N, costs Otilde(sqrt(N)) by sqrt-elu, and does not
    depend on Q at all'
  status: draft
  objective: "(A) THE POINT-DEPENDENT DATA, NAMED AS THE LANE DEMANDS. Let ell be an Elkies prime\
    \ for E, i.e. X^2 - tX + p has a root mod ell, equivalently t^2 - 4p is a square mod ell, equivalently\
    \ Frobenius has an eigenvalue in F_ell on E[ell], equivalently E admits an F_p-rational subgroup\
    \ C of order ell. Let phi: E -> E' = E/C be the corresponding Vélu isogeny. The data\n  D_ell(E,\
    \ P, Q) = (E', phi(P), phi(Q))\nis POINT-dependent (it changes when P or Q changes with E fixed),\
    \ and it is PUBLICLY COMPUTABLE WITHOUT A DISCRETE LOGARITHM by an explicit three-step procedure:\
    \ (i) build psi_ell over F_p by the standard recurrence, degree (ell^2-1)/2 <= 84 for ell <= 13;\
    \ (ii) factor psi_ell over F_p and identify the degree-(ell-1)/2 kernel polynomial h_C whose root\
    \ set is the x-coordinate set of a Galois-stable order-ell subgroup, tested directly by closure\
    \ of the root set under the x-only group law; (iii) apply Vélu's formulae to h_C to get E' and\
    \ the rational maps of phi, then evaluate phi at P and at Q. Nothing in this pipeline uses k.\n\
    (B) WHAT IT LEAKS ABOUT k: NOTHING, AND THE REASON IS A DICHOTOMY WITH NO MIDDLE CASE. Let psi:\
    \ E -> E'' be ANY isogeny defined over F_p. Then ker(psi) intersect G is a subgroup of G. Since\
    \ |G| = N is prime, that intersection is either trivial or all of G. Exactly two cases:\n  CASE\
    \ I -- ker(psi) ∩ G = {O}. Then psi restricted to G is an injective group\n    homomorphism onto\
    \ psi(G), which is cyclic of order N, and\n    psi(Q) = psi([k]P) = [k]psi(P). The instance transports\
    \ with k UNCHANGED\n    (DECOMPOSITION.md T1). Moreover psi|_G is EFFICIENTLY INVERTIBLE: the\
    \ dual\n    isogeny satisfies psihat(psi(R)) = [deg psi]R, so\n    R = [ (deg psi)^{-1} mod N\
    \ ] psihat(psi(R)), and (deg psi)^{-1} mod N is a\n    single modular inversion. Hence the transported\
    \ instance and the original\n    are inter-reducible in O(polylog) group operations plus the cost\
    \ of one\n    isogeny evaluation. FORMAL CONSEQUENCE (a simulator, in the style of\n    KN-FIND-b7e091\
    \ but for a different oracle class): any algorithm A that is\n    given (E, P, Q) together with\
    \ D_ell for a set of Elkies primes can be\n    simulated by an algorithm A' given only (E, P,\
    \ Q), at an additive cost of\n    one isogeny construction and evaluation per ell. Therefore D_ell\
    \ cannot\n    reduce the query complexity of solving for k below what A' achieves.\n  CASE II\
    \ -- G ⊆ ker(psi). Then psi(P) = psi(Q) = O and the instance is\n    annihilated: both points\
    \ collapse to the identity and every trace of k is\n    destroyed. Because G is cyclic of prime\
    \ order, the minimal such psi is the\n    quotient by G itself, of degree exactly N.\nTHERE IS\
    \ NO THIRD CASE. In particular no isogeny PARTIALLY degenerates G, so no isogeny can create a\
    \ claw or a collision in k that did not already exist. This is the exact structural reason the\
    \ SIDH-style torsion-image attacks (KN-TECH-025, KN-TECH-026) have no ECDLP analogue: there the\
    \ SECRET IS THE ISOGENY and the published torsion images are auxiliary data about it; here the\
    \ isogeny is public and computable and the secret is a scalar on which every isogeny acts invertibly.\n\
    (C) THE ANNIHILATING ISOGENY IS COMPUTABLE AND USELESS, WITH A COST FIGURE. Case II's isogeny\
    \ E -> E/G is computable: its kernel is G = <P>, which is known. Vélu's formulae cost O(N) field\
    \ operations; the sqrt-elu construction of Bernstein, De Feo, Leroux and Smith (KN-LIT-764) computes\
    \ E/<P> and phi(R) in Otilde(sqrt(N)) field operations. So the cost of the ONLY isogeny that could\
    \ touch k is Otilde(sqrt(N)) -- the same exponent as the rho baseline (KN-TECH-006) and BSGS (KN-TECH-031)\
    \ -- and its output E/G depends only on the subgroup G, hence only on P, and is COMPLETELY INDEPENDENT\
    \ OF Q and therefore of k. A quantity that is independent of Q cannot distinguish two targets.\
    \ So the case that is not closed by the simulator is closed by a cost bound AND by a Q-independence\
    \ argument, jointly.\n(D) WHAT THE DATA IS ACTUALLY GOOD FOR, STATED SO THE CLOSURE IS A REDIRECTION\
    \ AND NOT A DEAD END. D_ell is the ONLY publicly computable way to move a POINT-CARRYING ECDLP\
    \ instance between curves of an isogeny class. It is therefore the required instrument for every\
    \ campaign lane that wants to compare attack cost across the class while keeping the same k: L1\
    \ (RQ-ICINV-475b5e), L2 (RQ-VOLC-f6253b), L13 (RQ-MTGT-2cabee), and the multi-step walk version\
    \ in IDEA-20260807-631e80. This proposal therefore delivers (i) a closure of the k-information\
    \ question with a named obstruction, and (ii) a verified, certificate-carrying transport primitive\
    \ that the rest of the campaign consumes. Both are deliverables; the second is why the proposal\
    \ is worth implementing rather than only deriving.\n(E) HARD-CONSTRAINT ENGAGEMENT. The lane's\
    \ hard constraint says a curve-only statistic is k-independent by construction, so only point-dependent\
    \ publicly computable data is interesting. D_ell passes that filter: it is point-dependent and\
    \ publicly computable. This record's contribution is to show that passing the filter is NECESSARY\
    \ BUT NOT SUFFICIENT, and to supply the second filter the lane actually needs: point-dependent\
    \ data is uninteresting whenever the map producing it is efficiently invertible on G, because\
    \ then a simulator exists. That second filter is reusable and is the record's main transferable\
    \ output."
  resource_label: R5
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE as a resource use, with the closure delivered anyway. The admissibility
    filter excludes lanes whose only use of a map is to apply it to points of G. This proposal''s
    PRIMARY consumption of R5 is not that: the Elkies condition, the factorisation of psi_ell over
    F_p, and the identification of the Galois-stable order-ell subgroup are all statements about E[ell]
    as a Galois module, invisible to the generic group oracle, and the kernel polynomial h_C is field
    data of exactly the kind R1 and R5 are defined to supply. HOWEVER -- and this is the honest part
    -- the moment the constructed phi is applied to P and Q, the filter bites in full: phi|_G is an
    injective homomorphism of a prime-order group, hence multiplication by a scalar under any identification
    (H-ENDO-001), and the resulting oracle is simulable by the explicit simulator in claim (B) Case
    I. So the resource genuinely escapes the generic model at the CURVE level and genuinely fails
    to escape it at the POINT level, and this record''s job is to prove that boundary rather than
    to assert either side of it.'
  reachability_gate: 'REQUIRED AND ANSWERED, because this proposal moves between curves. IS A GOOD
    OBJECT REACHABLE, AND AT WHAT COST? One Elkies step reaches a SPECIFIC ell-isogenous neighbour
    at cost O(polylog p) field operations at toy scale (measured in STAGE 3), and there are at most
    2 horizontal plus level-dependent descending neighbours per Elkies ell. Under T5, a UNIFORMLY
    RANDOM curve in the class is reachable in O(log p) steps because the crater is a Cayley graph
    of Cl(O) and is a rapid mixer under GRH (KN-LIT-237, relayed from abstract). A SPECIFIED curve
    is the vectorization problem and costs ~sqrt(h(O)) ~ p^{1/4} classically at best. THIS PROPOSAL
    DOES NOT NEED EITHER GUARANTEE: it makes a claim about ONE step and about the composition of steps,
    both of which are cheap and local. The reachability gate therefore does not bind here -- but it
    binds hard on IDEA-20260807-631e80, which is exactly why that proposal is separate and carries
    the mixing measurement. Recording the gate as non-binding, with the reason, is the honest answer
    rather than an omission.'
  inputs:
    procedure: 'STAGE 0 (zero compute, the primary deliverable): the dichotomy, the simulator, the
      Q-independence argument, and the SIDH contrast, written out. STAGE 1 (hours): implement 2a-2d
      and validate on the ell = 3 frozen fixture with the independent order recomputation. STAGE 2
      (HARD GATE): the four-part transport certificate on every transport. No downstream number is
      reported until this passes at 100 percent. STAGE 3 (hours): transport cost measurement across
      ell in {3,5,7,11,13} and 16/20/24 field bits, 5 seeds each; report field operations and wall
      clock per step and the Elkies-prime distribution. STAGE 4 (minutes): the Case II Q-independence
      check at 12-16 bits by plain Vélu at degree N. STAGE 5 (hours): the random-bijection null and
      the composed-step decay test. BUDGET NOTE: ell is capped at 13 because deg psi_ell = (ell^2-1)/2
      reaches 84 there and the kernel-subset search in 2c grows with the factor count; ell = 17 (degree
      144) is explicitly out of scope for this contract.'
    mechanism: "STEP 1 (zero compute) -- write the dichotomy and the simulator. The simulator must\
      \ be exhibited concretely: given an algorithm A expecting (E, P, Q, {D_ell}), the simulator\
      \ A' constructs each D_ell itself from (E, P, Q) by the pipeline in claim (A) and forwards it.\
      \ State the exact additive cost per ell in field operations and note that it does not depend\
      \ on k. This is the whole closure and it costs nothing.\nSTEP 2 (implementation, medium) --\
      \ the transport primitive:\n  2a. psi_ell over F_p for ell in {3,5,7,11,13} (shared with\n \
      \     IDEA-20260807-df906f; build once, cache).\n  2b. Elkies test: check whether t^2 - 4p is\
      \ a square mod ell, where t is\n      obtained from the curve's order (computable exactly at\
      \ toy scale by\n      harness/toycurve.py's order()/order_bsgs()).\n  2c. Kernel-polynomial\
      \ extraction: factor psi_ell over F_p; for each candidate\n      product of irreducible factors\
      \ of total degree (ell-1)/2, test whether\n      the root set is the x-coordinate set of a subgroup\
      \ by checking closure\n      under the x-only addition. Report ALL rational kernels found, because\n\
      \      their COUNT is the volcano-level statistic used by\n      IDEA-20260807-1d9c5f.\n  2d.\
      \ Vélu: construct E' and the rational maps; evaluate at P and Q.\n  2e. CERTIFICATE (mandatory,\
      \ docs/claims-and-verification.md): for every\n      transport, emit and re-verify independently\
      \ of the constructor --\n      phi(P) lies on E'; phi(P) has order exactly N; phi(Q) = [k]phi(P)\
      \ where\n      k is the harness ground truth; and the round trip\n      [ell^{-1} mod N] * phihat(phi(P))\
      \ = P. A transport that fails any of\n      these four is an infrastructure failure (AGENTS.md\
      \ rule 5), not evidence.\n\nSTEP 3 (the measurement that is not implied by the dichotomy) --\
      \ transport COST, which the theory does not give: measure field operations and wall clock per\
      \ Elkies step as a function of ell and field bits, and the number of Elkies primes among {3,5,7,11,13}\
      \ per curve. This is the input L1, L2 and IDEA-20260807-631e80 need in order to charge their\
      \ own designs honestly, and it is not derivable from the dichotomy.\nSTEP 4 (the Case II cost\
      \ check, small and decisive) -- construct E/<P> by plain Vélu at small N (N up to a few thousand,\
      \ i.e. 12-16 field bits) and confirm (i) that phi(P) = phi(Q) = O, and (ii) that the resulting\
      \ curve E/G is IDENTICAL for two different targets Q and Q' on the same (E, P). The second check\
      \ is the Q-independence claim made concrete; it is cheap and it is the only empirical content\
      \ Case II has. sqrt-elu (KN-LIT-764) is cited for the asymptotic Otilde(sqrt(N)) figure and\
      \ is NOT implemented here; the record must not present the toy plain-Vélu run as validating\
      \ the sqrt-elu cost."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random-bijection null [m]R with m uniform in (Z/N)^* (blocking)
  - random-curve second null: transported curve must share t, random curve must not (blocking)
  - independent recomputation of
  - four-part transport certificate per transport (blocking)
  - composed-step decay test at 1, 2, 4 steps
  - 'Atkin-prime negative control: for a prime ell where t^2 - 4p is a non-residue mod ell, the pipeline
    must find NO rational kernel polynomial. An implementation that returns a kernel for an Atkin
    prime is wrong.'
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: replace the Elkies
    isogeny phi by a RANDOM BIJECTION of G onto a cyclic group of order N -- concretely, R |-> [m]R
    for a uniformly random m in (Z/N)^*, composed with an arbitrary relabelling. This null has the
    same shape as transport (an injective homomorphism of G with an efficiently computable inverse)
    and the SAME information content, so every k-related statistic computed after transport must match
    it. This is deliberately the same null shape that EV-ICI-0bdaaa used and that produced |aug -
    null| < 0.004 in the factor-base setting; reusing it makes the two results directly comparable.
    DECAY PARAMETER: the number of composed transport steps. If any statistic appears to distinguish
    real transport from the random-bijection null, that difference must GROW with the number of steps
    if it reflects isogeny structure and must be flat or shrink if it is an artifact of one-step implementation
    detail. A difference identical at 1, 2 and 4 steps is the canonical artifact tell (docs/inventor-protocol.md
    section 3). SECOND NULL, for the curve half: compare the transported curve E'' against a uniformly
    random curve of the same p -- E'' must be in the same isogeny class (same t) and the random curve
    must not, which is a blocking check that the transport is real and not a relabelling bug.'
  independent_variables: []
  metrics:
    primary:
    - certificate pass/fail per transport, with the four sub-checks separately
    - null
    - field operations and wall clock per Elkies step, by ell and field bits
    - number and identity of Elkies primes per curve
    secondary:
    - j-invariant of E/<P> for paired (Q, Q') at 12-16 bits
    - random-bijection null statistics on the identical pipeline
    - kernel count per (curve, ell) -- handed to IDEA-20260807-1d9c5f
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'Transport certificate pass rate: phi(P) on E'', order of phi(P) equal to N, phi(Q)
      = [k]phi(P) against harness ground truth, and the dual round trip'
    formula: 100 percent pass across all Elkies ell in {3,5,7,11,13} and all cells at 16, 20 and 24
      field bits. Any failure is an implementation failure under AGENTS.md rule 5 and blocks every
      downstream lane that consumes this primitive. BASIS - derivation (T1 plus the dual-isogeny relation);
      NOT measured anywhere in this campaign.
    source: pre-registered in IDEA-20260807-053a55 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Kernel ambiguity when several rational ell-isogenies exist. On a curve at the crater of the ell-volcano
    there can be two or more rational kernels; the transport is then not canonical and the choice
    must be recorded per transport, or two runs that differ only in kernel choice will look like irreproducibility.
  - The ramified case ell | (t^2 - 4p), where the characteristic polynomial has a double root mod
    ell. The Elkies/Atkin dichotomy has this third, exceptional branch and the driver must classify
    it explicitly rather than forcing it into one side.
  - Vélu normalisation. E' is determined up to F_p-isomorphism by the formulae used; a different normalisation
    changes (a', b') and hence the j-invariant comparison. The convention must be frozen before STAGE
    3 and reported with every transported curve.
  - 'Toy-scale curve generation (KN-TECH-034): anomalous curves (#E = p, KN-TECH-033) and smooth-order
    curves (KN-TECH-030) must be excluded from the run set before any cost number is interpreted.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 100 percent pass across all Elkies ell in {3,5,7,11,13} and all cells at 16,
    20 and 24 field bits. Any failure is an implementation failure under AGENTS.md rule 5 and blocks
    every downstream lane that consumes this primitive. BASIS - derivation (T1 plus the dual-isogeny
    relation); NOT measured anywhere in this campaign.
  falsification_criterion:
  - A transport is found for which phi(Q) != [k]phi(P) with the certificate's other three checks passing.
    This contradicts T1 and an elementary property of group homomorphisms; treat as a suspected implementation
    error and replicate independently before reporting anything else.
  - An isogeny is exhibited whose kernel meets G in a proper non-trivial subgroup. This contradicts
    primality of N and is an arithmetic error.
  - E/<P> differs between two instances sharing (E, P). The Q-independence claim is false as stated
    and the Case II half of the closure is withdrawn.
  - The Atkin-prime negative control returns a rational kernel polynomial. The kernel-extraction test
    is wrong and every kernel count it produced is void.
  - The kernel-subset search at ell = 11 or 13 exceeds the wall-clock budget on a majority of curves.
    That is an INFRASTRUCTURE outcome under AGENTS.md rule 5, is recorded as a scope reduction of
    the declared ell ladder, and is not evidence about the dichotomy.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
