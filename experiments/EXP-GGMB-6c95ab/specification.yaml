experiment:
  id: EXP-GGMB-6c95ab
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5876b8
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ORACLE-FRAMING COLLAPSE: because a prime-field ECDLP instance is fully specified by
    public data, every realizable augmenting oracle is either GGM-simulable (hence closed at exponent
    1/2 in charged work) or poly-time self-computable from that public data (hence not a resource
    at all but a named subroutine whose implementation cost must be charged) -- so a NON-SIMULABLE
    verdict, by itself, carries zero information about attack cost'
  status: draft
  objective: "(A) THE MODEL, FIXED BEFORE ANY VERDICT. An instance is I = (p, a, b, N, P, Q) with\
    \ Q = [k]P and G = <P> of prime order N. A GENERIC adversary A holds opaque handles and may (i)\
    \ request the group operation on handles, (ii) test handles for equality, (iii) query an augmenting\
    \ oracle O. A SIMULATOR S for O has A's interface -- handles, the group oracle, and the non-encoding\
    \ public parameters (p, a, b, N) -- but NOT the concrete coordinates of P and Q and NOT k. Every\
    \ handle A can ever hold was built from the two initial handles by group operations, so S can\
    \ maintain for each handle h the FORMAL LINEAR FORM lambda(h) = (alpha, beta) in (Z/N)^2 with\
    \ h = [alpha]P + [beta]Q. S knows lambda exactly. S does not know k. This lambda is the tracked\
    \ object of the whole generic model and of this lane.\n(B) SUFFICIENT CRITERION FOR SIMULABILITY\
    \ (S1). If O's answer on a handle tuple (h_1..h_r) plus adversary-supplied field/public arguments\
    \ args is a function f(lambda(h_1), ..., lambda(h_r), p, a, b, N, args) computable WITHOUT k,\
    \ then S answers by computing f, with simulator overhead T_sim = cost(f). S1 is not a heuristic;\
    \ it is a construction.\n(C) THE LEMMA THAT COLLAPSES THE TAXONOMY (L1). S1 implies SELF- COMPUTABILITY.\
    \ The real adversary, unlike the generic one, HAS the concrete coordinates of P and Q, and it\
    \ also knows lambda(h) for every handle h it built -- it chose the scalars. So it can evaluate\
    \ the same f itself, in poly(log p) time whenever cost(f) is poly. Therefore\n  SIMULABLE ==>\
    \ SELF-COMPUTABLE,\nand contrapositively NOT SELF-COMPUTABLE ==> NOT SIMULABLE. The two axes are\
    \ not independent: one implies the other, and the informative direction is the contrapositive.\n\
    (D) THE DICHOTOMY. For prime-field ECDLP every augmenting oracle O falls in exactly one of four\
    \ cells, and each cell has a DIFFERENT adjudication:\n  (a) SIMULABLE. Shoup (KN-TECH-005) applies\
    \ to the simulated algorithm:\n      g + q*T_sim >= c*sqrt(N), where g is A's own group-operation\
    \ count and\n      q its query count. The lane is closed at exponent 1/2 IN CHARGED WORK.\n  \
    \    The exact sense of \"charged\" is the subject of IDEA-20260807-7270d1\n      and matters\
    \ when T_sim is large.\n  (b) NOT SIMULABLE, but SELF-COMPUTABLE in poly(log p) time from\n  \
    \    (p, a, b, N, P, Q, query). Then the oracle hands the real adversary\n      NOTHING IT DID\
    \ NOT ALREADY HAVE. The augmented model is equal to the\n      plain non-generic model; the GGM\
    \ adjudication is SILENT, not negative;\n      and the only remaining question is whether the\
    \ concrete algorithm that\n      computes O, charged at its real cost, beats 0.886*sqrt(N). The\
    \ oracle\n      framing must be discarded and replaced by a charged cost analysis.\n      Every\
    \ R1/R2/R7 oracle the campaign has named lands here.\n  (c) NOT SELF-COMPUTABLE in poly time,\
    \ but REALIZABLE at some cost C. The\n      oracle is HIDING WORK. Adjudication is arithmetic:\
    \ does\n      q*C + g < 0.886*sqrt(N) hold for the q the algorithm needs? This is the\n      only\
    \ cell where a real cryptanalytic question survives, and the\n      campaign's live targets (arity-m\
    \ decomposition over F_p; a shortest-\n      isogeny oracle) sit in it.\n  (d) NOT REALIZABLE\
    \ WITHOUT k. Oracle A of KN-FIND-b7e091 (the first-jet\n      oracle, which needs k to evaluate\
    \ dQ = k*dG) is the type case. This is\n      not an attack model; no adversary can instantiate\
    \ it.\n\n(E) THE CONSEQUENCE THIS LANE EXISTS TO ENFORCE. \"Non-simulable\" is a disjunction over\
    \ cells (b), (c), (d). In (b) and (d) it carries ZERO information about attack cost. KN-FIND-b7e091\
    \ already observed this empirically for two oracles -- Oracle A \"non-simulable but privately\
    \ computable\", Oracle B \"non-simulable but no k-recovery\" -- and recorded them as a completeness\
    \ footnote. This proposal asserts those are not exceptions but the RULE, with a reason: Oracle\
    \ A is cell (d), Oracle B is cell (b) (elliptic-net values W(m,n) are computable in poly time\
    \ by the adversary, which knows the index (m,n) it asked about and the coordinates of P and Q).\
    \ Therefore: NO LANE IN THIS CAMPAIGN MAY REPORT NON-SIMULABILITY AS PROGRESS. A lane must place\
    \ its oracle in (b), (c) or (d) and, if (c), produce C.\n(F) WHAT WOULD REFUTE IT, AND THAT IS\
    \ THE VALUABLE BRANCH. Exhibit a prime-field oracle that is realizable, not self-computable in\
    \ poly time, and for which q*C + g < 0.886*sqrt(N) with q the query count an actual algorithm\
    \ needs. That is a cell-(c) inhabitant with a WINNING cost accounting, i.e. a sub-rho prime-field\
    \ algorithm. The dichotomy is designed so that the search for a counterexample IS the search for\
    \ an attack, which is the correct place for the campaign's effort to go.\n(G) WHAT THIS IS NOT.\
    \ It is not a hardness proof, not a lower bound, and not a claim that cell (c) is empty -- it\
    \ is provably non-empty. It is a claim about where adjudication effort should be spent and about\
    \ what a verdict may be said to mean."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'This proposal consumes no non-generic resource because it mounts no attack.
    It is the admissibility filter itself, stated as a dichotomy rather than as a case list. Its output
    is a classification obligation imposed on other lanes: each must name its cell. The proposal is
    admissible under DECOMPOSITION.md section 2 in the same way L12 is -- as an audit -- and it is
    the audit''s theoretical backbone.'
  reachability_gate: 'NOT APPLICABLE: this proposal moves between no curves and proposes no isogeny
    walk, so T5 does not bind. It does however BOUND the reachability question for lanes that do:
    see IDEA-20260807-d73e83, which shows that the walk itself is simulable, so reachability cost
    can never be the source of an advantage -- only the resource consumed after arrival can be.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE, hours): write the model of (A), the criterion S1,
      the lemma L1, and derive the four b7e091 verdicts. This is pencil work and it is the whole experiment;
      if it fails, nothing else runs. STAGE 1 (zero compute): run the three null-object controls --
      sham oracle, constant oracle, DLP oracle -- through the same derivation and check the required
      verdicts (a, a, c). STAGE 2 (zero compute): apply to the ten candidate classes and publish the
      cell table with the pre-registered prediction alongside the outcome. STAGE 3 (toy compute, <=
      10 min, OPTIONAL): mechanize Stage 0 as a frozen regression fixture over the eight oracle specifications
      (4 baseline + 3 nulls + 1 new) so future oracles are adjudicated against it. Toy curves at p
      <= 2^20 are used ONLY to make the (N-weak) witnesses concrete and independently checkable; they
      do not bound the verdicts, which are arguments and are scale-independent (this is the same standing
      distinction H-GGM-001 records).'
    mechanism: "STEP 1 (zero compute) -- WRITE THE MODEL DOWN. Fix the four-cell definition in (D)\
      \ with the simulator's knowledge set stated exactly: {handles, group oracle, p, a, b, N, lambda},\
      \ explicitly excluding {coordinates of P and Q, k}. Ambiguity in this set is the single largest\
      \ source of bogus verdicts, because a simulator granted the coordinates can answer EVERY point-valued\
      \ oracle honestly and the whole model trivializes.\nSTEP 2 (zero compute, HARD GATE) -- BASELINE\
      \ REPRODUCTION. Derive all four KN-FIND-b7e091 verdicts from the dichotomy:\n  Oracle C (incidence,\
      \ VERIFICATION form: does h_{i1} + ... + h_{im} = h_Q?):\n    answer = [ sum_j lambda(h_{ij})\
      \ == lambda(h_Q) ] -- a function of lambda\n    alone. Cell (a), T_sim = O(m). Reproduces the\
      \ finding exactly.\n  Oracle D (endomorphism image): phi acts on G as multiplication by a public\n\
      \    scalar (H-ENDO-001), so lambda(phi(h)) = mu*lambda(h). Cell (a),\n    T_sim = O(log N).\
      \ Reproduces the finding exactly.\n  Oracle A (first jet): dQ = k*dG by the invariant-differential\
      \ identity, so\n    the answer is a function of k. No simulator without k; no adversary\n  \
      \  without k either. Cell (d). Reproduces \"privately computable\".\n  Oracle B (elliptic net):\
      \ W(m,n) depends on x([m + nk]P), an encoding\n    quantity, so not a function of lambda --\
      \ but the adversary supplied\n    (m, n) and holds the coordinates of P and Q, so it computes\n\
      \    [m]P + [n]Q and then W(m,n) itself in poly time. Cell (b). Reproduces\n    \"no k-recovery\
      \ below standard DLP\", and explains it.\nIF ANY OF THE FOUR FAILS TO REPRODUCE, THE DICHOTOMY\
      \ IS FALSE AND THIS PROPOSAL ENDS AT STEP 2 WITH THE FINDING UNCHANGED.\nSTEP 3 (zero compute)\
      \ -- CELL (c) NON-EMPTINESS, so the dichotomy is not vacuous. Exhibit the arity-m DECOMPOSITION\
      \ oracle over F_p (given a target handle h_R and a declared factor base S of size L, return\
      \ m factor-base elements summing to R, or bottom). Not a function of lambda: the answer depends\
      \ on which points have x-coordinates in S. Not poly-time self-computable at useful L by any\
      \ known method: the brute-force route costs binomial(L, m) and the algebraic route is a Groebner\
      \ computation on the Semaev system whose recorded prime-field cost exceeds sqrt(N) (KN-FIND-f8c290,\
      \ KN-TECH-004, KN-TECH-011). Realizable at some cost C. So cell (c) is inhabited by exactly\
      \ the object the index-calculus lane studies.\nSTEP 4 (zero compute) -- APPLY TO THE CAMPAIGN'S\
      \ TEN CANDIDATE ORACLES and publish a cell per oracle, with the witness required by IDEA-20260807-63056d.\n\
      STEP 5 (bounded compute, TOY) -- MECHANIZE STEP 2 as a regression fixture so that any future\
      \ oracle spec added to the campaign is re-adjudicated against the four frozen b7e091 verdicts\
      \ before its own verdict is trusted."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - 'sham oracle O_rand (uniform random answers): must be cell (a), T_sim = 0, useless'
  - 'constant oracle: must be cell (a), T_sim = 0, useless'
  - 'DLP oracle: must be cell (c) with C = best known DLP cost; a verdict of (a) or (b) voids the
    instrument'
  - the four frozen KN-FIND-b7e091 specifications, as the baseline fixture
  - 'decay control: append r independent uniform random bits to each oracle''s answer for r in {0,
    8, 64}; every verdict must be invariant in r'
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL OBJECT: the SHAM ORACLE O_rand,
    which on any query returns a uniformly random element of the answer type, independent of the instance.
    O_rand must be adjudicated CELL (a), SIMULABLE with T_sim = 0 group operations (the simulator
    tosses coins), and USELESS. DECAY PARAMETER: the number r of independent uniform random bits appended
    to a genuine oracle''s answer. Appending r random bits must leave the cell verdict and the usefulness
    verdict UNCHANGED for every r; a procedure whose verdict moves with r is reading noise as structure
    and is void. SECOND NULL: the CONSTANT ORACLE returning 0 always -- cell (a), T_sim = 0. THIRD
    NULL, in the opposite direction: the DLP ORACLE itself (given a handle, return lambda''s second
    coordinate resolved against k, i.e. return k). It must be adjudicated NOT SIMULABLE and NOT SELF-COMPUTABLE,
    i.e. cell (c) with C = the cost of the best known DLP algorithm -- so that the arithmetic q*C
    + g >= 0.886*sqrt(N) is satisfied with equality at q = 1, which is the correct and self-consistent
    answer. A dichotomy that places the DLP oracle in (a) or (b) is unsound and every verdict it produced
    is void.'
  independent_variables: []
  metrics:
    primary:
    - cell label in {a, b, c, d} per oracle, with the witness required by cell
    - T_sim in group operations per query, as an explicit function or bound
    - C_impl in field operations per query, or "not poly" with the reason
    - which quantifier form (N-weak / N-strong) each non-simulable verdict establishes
    secondary:
    - pass/fail of every null control and of the four-verdict fixture
    - the pre-registered ten-oracle cell prediction beside the outcome
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of KN-FIND-b7e091 oracle verdicts reproduced by the dichotomy, out of 4
    formula: 4 of 4, with the explicit f and T_sim exhibited for C and D and the explicit obstruction
      exhibited for A and B. 3 or fewer falsifies the proposal outright. Pre-registered before any
      derivation is written down.
    source: pre-registered in IDEA-20260807-5876b8 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SIMULATOR KNOWLEDGE-SET DRIFT. A simulator granted the concrete coordinates of P and Q answers
    every point-valued oracle honestly and the model trivializes; a simulator granted k answers everything.
    The set is frozen in (A) and every verdict must restate it. This is the single largest confounder
    in the lane and it is silent when it strikes.
  - POLY / NON-POLY BOUNDARY AT TOY SCALE. At p <= 2^20 every cost is small and "poly-time self-computable"
    is not empirically distinguishable from "cheap". The cell (b)/(c) boundary must be decided by
    an asymptotic argument about the implementing algorithm, never by a toy timing.
  - ORACLE SPECIFICATION AMBIGUITY. "The incidence oracle" names at least two different objects with
    different T_sim (verification form and search form); see IDEA-20260807-7270d1. A cell label attached
    to an ambiguous specification is meaningless. Specifications must be frozen with their quantifier
    structure before adjudication.
  - 'CONFLATING THE ORACLE WITH ITS IMPLEMENTING ALGORITHM. The x-coordinate / anomalous-lift collision
    is the standing warning: cell (b) says the interface is not a resource; it says nothing about
    the algorithm behind it.'
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 4 of 4, with the explicit f and T_sim exhibited for C and D and the explicit
    obstruction exhibited for A and B. 3 or fewer falsifies the proposal outright. Pre-registered
    before any derivation is written down.
  falsification_criterion:
  - Any of the four KN-FIND-b7e091 verdicts fails to fall out of the dichotomy. The dichotomy is not
    a generalization of the standing finding; this record is superseded and the finding is unchanged.
  - The DLP oracle is adjudicated cell (a) or (b). The dichotomy is unsound, because it would then
    claim the DLP oracle confers no advantage, and every verdict it produced is void.
  - Someone exhibits a realizable prime-field oracle that is simulable but NOT self-computable, i.e.
    a counterexample to L1. The two axes are then independent, the four cells are not exhaustive,
    and the collapse claim in (C) is false.
  - A verdict changes when r random bits are appended to an oracle's answer. The classification is
    reading noise and is void.
  - An oracle among the campaign's ten lands in cell (c) with C such that q*C + g < 0.886*sqrt(N)
    for an algorithm's actual q. This does not falsify the dichotomy -- it CONFIRMS it and simultaneously
    identifies an attack. Recorded as a falsification of the pre-registered prediction, not of the
    mechanism, and it triggers GOAL-ENDO-001 pause condition P3.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-5876b8
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
