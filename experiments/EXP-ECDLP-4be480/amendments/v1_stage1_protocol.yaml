protocol_amendment:
  experiment_id: EXP-ECDLP-4be480
  version_from: 1
  version_to: 1
  amendment_id: v1_stage1_protocol
  recorded_at: '2026-09-08'
  recorded_by_task: TASK-20260908-63f6e9
  archived_by: TASK-20260908-f0ad36
  reason: >-
    DEC-20260908-c2cb8b held Stage 0 of
    EXP-ECDLP-4be480 as a P-S0-DIMTRIPLE
    instrument. Ranked next is Stage 1
    protocol completeness for the next
    disclosed information-retention object
    after the rank collision. This
    amendment writes that protocol. It
    does not authorize Stage 1 execution.
    A marked Frobenius is not constructed.
    Kedlaya is not run. Serre-Tate is not
    certified. The frozen Stage 1 object
    is P-S1-LDIV: explicit bases of L(D)
    on the same Stage 0 curve and pairs.
  predecessor_path: experiments/EXP-ECDLP-4be480/specification.yaml
  predecessor_sha256: 0e0b4affa1f5b0186748c1f72f005acdb4fb3d55de38c99579b0a25580055138
  scientific_parameters_changed: true
  preregistered_prediction_changed: true
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_decision: DEC-20260908-5f59d2
  standing_authorization: >-
    AGENTS.md user instruction of 2026-09-06.
    This amendment freezes the Stage 1
    protocol text, including budget,
    artifacts, and replication. Coordinator
    completeness for execution authorization
    is a later decision and is not performed
    here.
  execution_authorized_stages_remain: [0]
  stage1_authorized_by_this_amendment: false
  exp_6a97f4_stage2_authorized: false
  exp_420e73_stage17_authorized: false
  exp_a98ea9_stage5_authorized: false
  SMALL_W_or_LARGE_W: false
  fit_of_a: false
  not_an_H1_claim: true
  not_a_frobenius: true
  not_kedlaya: true
  not_a_canonicality_claim: true
  certificate:
    kind: none
  claim_tier: observational
  scale_relevance:
    tier: toy
    justification: >
      One Weierstrass curve over Q reused
      from Stage 0. No transfer to
      cryptographic n or to p-adic
      cohomology.
    correspondence: null

  design_tightening_stage1_is_ldiv_not_frobenius: >-
    IDEA-20260905-8829cc says the dimension
    triple collides and that additional
    structured extension data, filtrations,
    connections, or a compatible marked
    Frobenius are separate questions.
    Stage 0 already measured the declared
    split cone and found the predicted
    collision (3, 2, 1). Stage 1 does not
    construct a marked Frobenius and does
    not run Kedlaya. It freezes P-S1-LDIV:
    explicit two-dimensional bases of L(D)
    for the same frozen pairs D1, D2, and
    the u=2 image of D1. Dimension
    collision of l(D)=2 is the predicted
    Stage 1 rank fact. A residue or leading
    coefficient of the non-constant basis
    function is an observation, not a gate,
    and is not a Frobenius. This is a
    disclosed tightening, not a silent
    upgrade to P-S1-FROBENIUS.

  curve_reused_from_stage0:
    id: S0-E-Q-A1B1
    A: 1
    B: 1
    discriminant: -496
    model: y^2 = x^3 + x + 1 over Q
    do_not_change_stage0_curve: true
    do_not_hunt_a_new_cell: true

  fixture:
    pairs:
      - id: D1
        P: [0, 1]
        Q: [0, -1]
        L_basis:
          - '1'
          - 1/x
        construction_note: >
          x vanishes at both marks of D1
          and has a double pole at O, so
          1/x lies in L(D1).
      - id: D2
        P: [0, 1]
        Q: ['1/4', '-9/8']
        Q_equals: 2P
        L_basis:
          - '1'
          - (x - x_3P) / (y - 1 + (17/2)*x)
        construction_note: >
          Chord through P and 2P has slope
          -17/2. Third intersection is -3P.
          Miller: ell = y-1+(17/2)x,
          f = (x - x_3P)/ell is in L(P+2P).
          3P is the group-law sum P+2P.
          The executor computes 3P; it is
          not a second frozen curve.
      - id: D1-scaled
        u: 2
        A: 16
        B: 64
        P: [0, 8]
        Q: [0, -8]
        L_basis:
          - '1'
          - 1/x
        construction_note: >
          On the u=2 model both marks still
          have x=0, so 1/x is again in L(D).
    invalid_repeated:
      id: D_eq
      P: [0, 1]
      Q: [0, 1]
      must_reject: true
    working_model: >
      Rational function fields of the
      frozen Weierstrass model over Q.
      L(D) is spanned by the frozen
      two-function bases. Not crystalline,
      not rigid, not a p-adic lift, not
      Serre-Tate, not a marked Frobenius.
    frobenius_not_constructed: true

  independent_variables:
    - pair in {D1, D2, D1-scaled}
    - constant versus non-constant basis function

  null_object:
    name: unmarked L(0) = constants
    construction: >
      l(0) = 1 on any curve. The constant
      function 1 is in every L(D). The
      second basis function must be
      linearly independent of 1.
    non_degeneracy_check: >
      The two frozen functions on each
      admissible pair are linearly
      independent over Q before any
      residue is read.
    dynamic_range_demonstration: >
      Repeated marks D_eq must be rejected
      before any L(D) basis is read as a
      two-mark space. An argument that
      still reports l(D)=2 from a declared
      split without the frozen bases
      proves too much.

  controls:
    - unmarked constants (nearby-object)
    - D_eq repeated-mark rejection (proves-too-much)
    - unit scaling u=2 of D1 (presentation independence of l(D))
    - smoothness Delta != 0
    - P != Q and both on E for D1 and D2
    - D2 Q equals 2P
    - exact bases, no sampling

  metrics:
    primary:
      - fixture_pass boolean
      - ldiv_pass boolean
      - mark_collision_pass boolean
      - reject_repeated_marks boolean
    secondary:
      - per-pair l(D)
      - per-pair linear_independence
      - computed 3P
      - residue or leading coefficient of the non-constant basis function at each mark
      - wall-clock seconds
    not_a_metric:
      - marked Frobenius
      - Kedlaya point count
      - Serre-Tate canonicality
      - P-S1-DIGIT
      - H1
      - W class
    residue_observation_is_not_a_gate: true

  preregistered_prediction:
    quantity: >
      Stage 1 instrument: l(D)=2 on every
      frozen admissible pair and on the
      frozen unit scaling, with the frozen
      two-function bases linearly
      independent over Q; repeated marks
      rejected. Certificate kind none.
    formula: >
      E: y^2 = x^3 + x + 1 over Q.
      D1 = (0,1)+(0,-1), L(D1)=<1, 1/x>.
      D2 = (0,1)+2*(0,1), L(D2)=<1,
      (x-x_3P)/(y-1+(17/2)x)>.
      D1-scaled uses 1/x on the u=2 model.
      FORCED Stage 1: fixture_pass true;
      ldiv_pass true; mark_collision_pass
      true; reject_repeated_marks true.
      A residue difference between D1 and
      D2 is an observation, not a gate.
    source: >
      ledger/proposals/IDEA-20260905-8829cc.yaml
      claim and mechanism, tightened from
      a marked Frobenius to P-S1-LDIV
      because Stage 0 already exhausted
      the rank-only cone and the idea
      names extra structured data as a
      separate question. Provenance
      internal; read in this completeness
      session.

  heuristic_under_test: none

  tail_checks:
    - discriminant equals -496
    - D1 and D2 points satisfy the Weierstrass equation
    - D2 Q equals 2*(0,1)
    - 3P equals the group-law sum P+2P
    - scaled D1 points are the u=2 images
    - each frozen basis is two Q-linearly independent functions
    - D_eq is rejected
    - no Frobenius operator is constructed

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 1 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 1, HARD GATE: fixture_pass,
      ldiv_pass, mark_collision_pass, and
      reject_repeated_marks. A miss
      classifies the run failed_infrastructure
      if it is a smoothness, distinctness,
      group-law, or basis-encoding bug,
      otherwise it is a scoped
      falsification of P-S1-LDIV.
    - A residue difference is not required
      for fixture_pass.
    - Stages 2 and later are not authorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 1 is not in execution_authorized_stages
    - Changing A, B, D1, D2, the scaling, or the frozen L(D) bases after this freeze
    - Constructing a Frobenius operator as a Stage 1 metric
    - Reading Stage 1 as Kedlaya point-counting
    - Reading Stage 1 as Serre-Tate canonicality
    - Reading Stage 1 as P-S1-DIGIT or P-S1-RELATIVE
    - Reading Stage 1 as H1, a W class, or an ECDLP advantage
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b from Stage 1 of this experiment
    - Changing H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73 from Stage 1 of this experiment

  success_criterion: >
    Stage 1 succeeds as a measurement when
    fixture_pass, ldiv_pass,
    mark_collision_pass, and
    reject_repeated_marks are true, and
    the run manifest carries
    certificate.kind none. A residue
    observation is not a gate. Success is
    instrument reproduction, not a
    Frobenius claim and not an attack.

  falsification_criterion: >
    A certified l(D) other than 2 on a
    frozen admissible pair, after
    fixture_pass, is a scoped miss of
    P-S1-LDIV on this curve. A certified
    linear dependence of a frozen basis
    is a scoped miss of the basis claim.
    Infrastructure bugs are not
    mathematics. Stage 1 does not test
    P-S1-FROBENIUS, P-S1-DIGIT, H-ECDLP-77caa5,
    or W.

  required_artifacts:
    - Stage 1 raw-result.json with
      fixture_pass, ldiv_pass,
      mark_collision_pass,
      reject_repeated_marks, per-pair
      l(D), computed 3P, and
      residue_observation_is_not_a_gate
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  combining_rule: >
    ldiv_pass is the conjunction of
    l(D)=2 and linear independence on
    D1, D2, and D1-scaled. No weighting.
    No sampling.

  limitations:
    - One toy Weierstrass curve over Q.
    - Explicit L(D) bases. No Frobenius.
    - No Kedlaya. No Serre-Tate.
    - No cryptographic transfer.
    - No disposition of H-ECDLP-e9d9bb, 77caa5,
      07c7c6, 2ade73, or a3598b.
    - No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve, relation, or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Completeness is not authorization.
