experiment:
  id: EXP-ECDLP-4be480
  hypothesis_id: H-ECDLP-2ac931
  version: 1
  title: >
    Rank-only cone audit of relative versus ordinary
    de Rham H^1 on one frozen Weierstrass curve over Q
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-18ecbd
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-18ecbd after TASK-20260908-3b8d07.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-e9d9bb,
    H-ECDLP-77caa5, H-ECDLP-07c7c6, H-ECDLP-2ade73,
    or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-18ecbd
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-3b8d07
  source_proposal: IDEA-20260905-8829cc
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-18ecbd under the standing 2026-09-06
    user authorization. Stage 0 is the rank-only cone
    instrument. A marked Frobenius is a later stage
    and is not constructed here.

  objective: >
    Assemble the degree-1 cone of Omega_E -> Omega_D on
    one frozen smooth Weierstrass curve over Q, for two
    frozen distinct rational marked pairs and one frozen
    unit scaling of the first pair, and read the dimension
    triple (dim H1_rel, dim H1_ord, dim ker). Stage 0
    decides whether that rank-only instrument works. It
    does not construct a Frobenius, does not run Kedlaya,
    does not certify Serre-Tate, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: dimension triple (3, 2, 1) on
      every frozen admissible pair and on the frozen
      unit scaling; unmarked dim H1_ord = 2 independent
      of the marks; repeated marks rejected. Certificate
      kind none.
    formula: >
      E: y^2 = x^3 + A x + B over Q, Delta = -16(4A^3+27B^2)
      nonzero. H0_E = Q, H0_D = Q^2, r(c) = (c, c).
      H1_ord spanned by dx/y and x dx/y, dim 2.
      H1_D = 0. H1_rel := coker(r) oplus H1_ord, dim 3.
      Forgetful phi is projection to H1_ord, ker dim 1.
      FORCED Stage 0: fixture_pass true; dimtriple_pass
      true; mark_collision_pass true; unmarked_independent
      true; reject_repeated_marks true.
    source: >
      ledger/proposals/IDEA-20260905-8829cc.yaml
      predictions[0], predictions[1], and minimal_test.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_rank_not_frobenius: >
    IDEA-20260905-8829cc also flags that additional
    structured extension data, filtrations, connections,
    or a compatible marked Frobenius are separate
    questions. Stage 0 does not construct those objects.
    That comparison is a Stage 1+ object. This is a
    disclosed tightening, not a silent change of the
    idea's claim.

  inputs:
    fixture:
      field: Q
      curve:
        id: S0-E-Q-A1B1
        A: 1
        B: 1
        discriminant: -496
        model: y^2 = x^3 + x + 1 over Q
      pairs:
        - id: D1
          P: [0, 1]
          Q: [0, -1]
        - id: D2
          P: [0, 1]
          Q: ['1/4', '-9/8']
      scaling:
        u: 2
        applies_to: D1
        A_scaled: 16
        B_scaled: 64
        P_scaled: [0, 8]
        Q_scaled: [0, -8]
      invalid_repeated:
        id: D_eq
        P: [0, 1]
        Q: [0, 1]
        must_reject: true
      working_model: >
        Algebraic de Rham cone of Omega_E -> Omega_D
        in degree 1 over Q. Not crystalline, not rigid,
        not a p-adic lift, not Serre-Tate.
      frobenius_not_constructed: true

  independent_variables:
    - pair in {D1, D2, D1-scaled}
    - unmarked versus marked

  null_object:
    name: unmarked H^1_dR(E) independent of marks
    construction: >
      dim H1_ord computed from the Weierstrass basis
      {dx/y, x dx/y} with no marked data. Must equal 2
      for D1 and for D2.
    non_degeneracy_check: >
      unmarked_independent must be true before any
      marked triple is read as a measurement.
    dynamic_range_demonstration: >
      Repeated marks D_eq must be rejected before ranks.
      An argument that still reports (3, 2, 1) on D_eq
      proves too much.

  controls:
    - unmarked H^1_dR(E) dim 2 (nearby-object)
    - D_eq repeated-mark rejection (proves-too-much)
    - unit scaling u=2 of D1 (presentation independence)
    - smoothness Delta != 0
    - P != Q and both on E for D1 and D2
    - exact cone formula, no sampling

  metrics:
    primary:
      - fixture_pass boolean
      - dimtriple_pass boolean
      - mark_collision_pass boolean
      - unmarked_independent boolean
      - reject_repeated_marks boolean
    secondary:
      - per-pair dimension triple
      - per-pair unmarked dim
      - scaled D1 dimension triple
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One Weierstrass curve over Q with two rational
      marked pairs. No transfer to cryptographic n
      or to p-adic cohomology. Stages 1+, when
      authorized, remain toy-scale until a later
      amendment says otherwise.
    correspondence: null

  tail_checks:
    - discriminant equals -496
    - D1 and D2 points satisfy the Weierstrass equation
    - D2 Q equals 2*(0,1) under the group law
    - scaled D1 points are the u=2 images
    - D_eq is rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass, dimtriple_pass,
      mark_collision_pass, unmarked_independent, and
      reject_repeated_marks. A miss classifies the run
      failed_infrastructure if it is a smoothness,
      distinctness, or cone-encoding bug, otherwise it
      is a scoped falsification of P-S0-DIMTRIPLE or
      P-S0-MARKCOLLISION.
    - Stages 1 and later are not authorized.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing A, B, D1, D2, the scaling, or the cone formula after this freeze
    - Constructing a Frobenius operator as a Stage 0 metric
    - Reading Stage 0 as Kedlaya point-counting
    - Reading Stage 0 as Serre-Tate canonicality
    - Reading Stage 0 as H1, a W class, or an ECDLP advantage
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b from Stage 0 of this experiment
    - Changing H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73 from Stage 0 of this experiment

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, dimtriple_pass, mark_collision_pass,
    unmarked_independent, and reject_repeated_marks
    are true, and the run manifest carries
    certificate.kind none. Success is instrument
    reproduction, not a Frobenius claim and not an
    attack.

  falsification_criterion: >
    A certified dimension triple other than (3, 2, 1)
    on a frozen admissible pair, after fixture_pass,
    is a scoped miss of P-S0-DIMTRIPLE on this curve.
    A certified difference of triples across D1 and
    D2 is a scoped miss of P-S0-MARKCOLLISION.
    Infrastructure bugs are not mathematics. Stage 0
    does not test P-S1-FROBENIUS, P-S1-DIGIT,
    H-ECDLP-77caa5, or W.

  required_artifacts:
    - Stage 0 raw-result.json with fixture_pass,
      dimtriple_pass, mark_collision_pass,
      unmarked_independent, reject_repeated_marks,
      and per-pair triples
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One toy Weierstrass curve over Q.
    - Rank-only cone formula. No Frobenius.
    - No Kedlaya. No Serre-Tate.
    - No cryptographic transfer.
    - No disposition of H-ECDLP-e9d9bb, 77caa5,
      07c7c6, 2ade73, or a3598b.
    - No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve, relation, or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
