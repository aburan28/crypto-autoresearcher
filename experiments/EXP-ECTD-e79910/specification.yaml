# =============================================================================
# EXP-ECTD-e79910 — version 1, approved by DEC-20261006-edf5d4.
# Frozen root-gap test for IDEA-20261005-b4c2bf.
# The prime is p = 41. E_crater is y^2 = x^3 + 12x + 24.
# E_floor is y^2 = x^3 + 3x + 40. E_scaled is y^2 = x^3 + 28x + 19.
# The prediction is that the volcano gap is at most the scaling gap.
# A larger volcano gap is a negative. No isogeny-path algorithm.
# No discrete logarithm. No change to the generic square-root exponent.
# No run in this design.
# =============================================================================
experiment:
  id: EXP-ECTD-e79910
  hypothesis_id: H-ECTD-ffcb64
  question_id: RQ-ECTD-001
  source_idea: IDEA-20261005-b4c2bf
  goal_id: null
  version: 1
  title: >-
    Least order-3 x-coordinate on the height-2 volcano at p = 41 versus
    one coordinate scaling of the crater
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    approved_by_role: coordinator
    composing_decision: DEC-20261006-edf5d4
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the volcano gap is at most the scaling gap, does not assert an
      isogeny-path algorithm, and does not assert that the gaps were observed.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the absolute movement of the least rational order-3
    x-coordinate from E_crater to E_floor at p = 41 is at most its
    movement from E_crater to E_scaled. Success is that inequality on a
    run where both gaps are defined and the scaling gap is at least 1.
    A strictly larger volcano gap on such a run is a negative, so
    success can fail.

  inputs:
    names:
      prime: 41
      crater: >-
        E_crater, the short-Weierstrass model y^2 = x^3 + 12 x + 24
        over F_41. j-invariant 5. Twist bit 1.
      floor: >-
        E_floor, the short-Weierstrass model y^2 = x^3 + 3 x + 40
        over F_41. j-invariant 13. Twist bit 1.
      scaled: >-
        E_scaled, the short-Weierstrass model y^2 = x^3 + 28 x + 19
        over F_41. It is the image of E_crater under
        (x, y) mapped to (u^2 x, u^3 y) with u = 2.
    field:
      prime: 41
      elements: the integers 0, 1, ..., 40
    models:
      standard: >-
        For j not equal to 0 or 6 (1728 reduced modulo 41), set
        A = 3 j (1728 - j) and B = 2 j (1728 - j)^2, reduced into F_41.
        Twist bit 0 is this model. Twist bit 1 multiplies A by d^2 and
        B by d^3, where d = 3 is the least quadratic non-residue in
        {1, 2, ..., 40}.
      singular: discard the model when 4 A^3 + 27 B^2 = 0
      ordinary: >-
        Discard the model when the trace of Frobenius is divisible by 41.
        The named class has trace -6 and order 48. The executor
        recomputes the trace by counting points. It does not trust this
        sentence in place of the count.
    first_pair_enumeration: >-
      Scan primes from 17 through 199 in increasing order. At each prime,
      scan traces t from minus floor(2 sqrt(p)) through floor(2 sqrt(p))
      in increasing order. Skip a trace when p divides t, when
      t^2 - 4 p is nonnegative, or when the 2-valuation of the conductor
      of Z[pi] in the maximal order is not exactly 2. Build the
      undirected rational 2-isogeny graph on ordinary models of that
      trace, with vertices (j, twist) and with j = 0 and j = 1728
      omitted. A codomain is reduced to its canonical (j, twist) by an
      F_p-isomorphism u. Components are ordered by their least (j, twist)
      vertex. In each component, peel every vertex that has exactly one
      distinct neighbor, simultaneously, and repeat. Height exactly 2
      means exactly two peel rounds leave a nonempty core. Floor
      vertices are those removed in round one, ordered by (j, twist).
      Crater vertices are the core, ordered by (j, twist). The pair is
      the least crater vertex and the least floor vertex that each have
      at least one verified order-3 x-coordinate. The first such pair
      in this scan is the instance. The protocol names it as p = 41,
      E_crater, and E_floor. If the executor's first pair differs, the
      gaps are not read.
    two_isogeny:
      kernel: >-
        The nontrivial 2-torsion x-coordinates are the simple roots in
        F_p of x^3 + A x + B = 0. Each such root r gives a kernel point
        (r, 0).
      velu: >-
        Set t = 3 r^2 + A, A' = A - 5 t, and B' = B - 7 r t. The
        codomain model is y^2 = x^3 + A' x + B', then reduced to the
        canonical (j, twist) of its F_p-isomorphism class. A codomain
        that canonicalizes to the source is a loop. A loop is not a
        second level and it is not a second vertex.
      simple_graph: >-
        Distinct canonical neighbors contribute one undirected edge.
        The adjacency relation must be symmetric. The dual isogeny is
        the same undirected edge.
    order_3:
      polynomial: >-
        psi_3(x) = 3 x^4 + 6 A x^2 + 12 B x - A^2.
      method_A: >-
        Every root of psi_3 in F_41 at which the curve has a nonzero
        square y-coordinate and the resulting point P satisfies 2P = -P.
      method_B: >-
        Every x in F_41 at which the curve has a nonzero square
        y-coordinate and the resulting point P satisfies 2P = -P.
        Method B does not use the coefficients of psi_3.
      agreement: >-
        On each of the three models, method A and method B return the
        same set of x-coordinates. m(E) is the least element of that
        set, written as an integer in {0, 1, ..., 40}.
      doubling: >-
        Slope lambda = (3 x^2 + A) * inverse(2 y),
        x2 = lambda^2 - 2 x, y2 = lambda (x - x2) - y.
        The check is (x2, y2) = (x, -y), with y not 0.
    gaps:
      volcano_gap: the absolute difference |m(E_floor) - m(E_crater)|
      scaling_gap: the absolute difference |m(E_crater) - m(E_scaled)|
      comparison: volcano_gap minus scaling_gap, predicted at most 0
      not_circular: >-
        The difference is the absolute difference of the integer
        representatives. It is not the minimum of d and p - d.
    scaling:
      u: 2
      map: (x, y) mapped to (4 x, 8 y)
      codomain_coefficients: A multiplied by u^4, B multiplied by u^6
      isomorphism_check: >-
        Every affine point of E_crater pushes forward onto E_scaled,
        and the canonical (j, twist) of E_scaled equals the canonical
        (j, twist) of E_crater.
    pre_registered:
      prime: 41
      volcano_gap_minus_scaling_gap_at_most: 0
      scaling_gap_at_least: 1
      verified_roots_at_least: 1
    seeds: [0]
    enumeration_order: >-
      Seed 0 names the prime scan, the trace scan, and the (j, twist)
      order above. It is not a pseudorandom draw.
    forbidden:
      - Do not claim an isogeny-path algorithm.
      - Do not claim a discrete logarithm.
      - Do not claim a change to the generic square-root exponent.
      - Do not build a summation polynomial or a factor base.
      - Do not substitute a quadratic twist for the scaling.
      - Do not use a circular distance in place of the absolute difference.
      - Do not enter a design-time root in place of method A and method B.

  controls:
    - id: scaling-equation
      statement: >-
        E_scaled satisfies the pushforward of the crater equation, and
        its canonical (j, twist) equals (5, 1).
      pass_condition: both hold
      on_fail: The control is invalid. No gap is read.
    - id: not-a-twist
      statement: >-
        u = 2 is a quadratic residue, and it is the least residue in
        {2, 3, ..., 40}. The least non-residue is 3, and it is not used
        as u.
      pass_condition: both residue claims hold
      on_fail: The scaling was replaced by a twist. The run is invalid.
    - id: two-methods
      statement: >-
        Method A and method B agree on the order-3 x-set of E_crater,
        of E_floor, and of E_scaled.
      pass_condition: the three sets agree as sets of integers
      on_fail: The instrument disagrees with itself. No gap is read.
    - id: first-pair
      statement: >-
        Under the frozen enumeration, the first height-2 pair with a
        verified root on both a crater vertex and a floor vertex is
        p = 41, E_crater, and E_floor, the trace is -6, and neither j
        is 0 or 1728.
      pass_condition: all of those hold
      on_fail: Failed setup. The gaps at the named models are not the claim.
    - id: height
      statement: >-
        The component peels in exactly two rounds, the core is nonempty,
        and the 2-valuation of the Frobenius conductor is exactly 2.
      pass_condition: both hold
      on_fail: >-
        The component is not a height-2 volcano. The gaps are not read.
    - id: supersingular-exclusion
      statement: Neither named model is supersingular.
      pass_condition: the trace is not divisible by 41
      on_fail: The model is not eligible. The gaps are not read.
    - id: self-gap
      statement: >-
        The absolute difference of m(E_crater) with itself is 0, and 0
        is at most the scaling gap whenever the scaling gap is defined.
      pass_condition: the self difference is 0
      on_fail: The least-root instrument is not a function. No gap is read.

  independent_variables:
    - the model, E_crater or E_floor or E_scaled
    - the root method, the psi_3 scan or the group-law scan
    - the gap, volcano or scaling

  metrics:
    primary:
      - id: volcano_minus_scaling
        statement: >-
          volcano_gap minus scaling_gap. The prediction is at most 0,
          with scaling_gap at least 1. A difference of at least 1 is the
          negative.
    secondary:
      - id: prime_p
        statement: The prime at which the first eligible pair appears.
      - id: volcano_height
        statement: The peel-round count of the component. Predicted 2.
      - id: least_root_floor
        statement: m(E_floor), the agreed least integer.
      - id: least_root_crater
        statement: m(E_crater), the agreed least integer.
      - id: least_root_scaled_crater
        statement: m(E_scaled), the agreed least integer.
      - id: volcano_gap
        statement: Absolute difference of the floor and crater least roots.
      - id: scaling_gap
        statement: Absolute difference of the crater and scaled least roots.
      - id: verified_root_count_floor
        statement: Size of the agreed order-3 x-set on E_floor.
      - id: verified_root_count_crater
        statement: Size of the agreed order-3 x-set on E_crater.
      - id: trace
        statement: The point-count trace of E_crater. Predicted -6.

  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 says the floor does not move the least order-3 x-coordinate by
    more than one coordinate scaling of the crater. A volcano gap that
    exceeds a positive scaling gap falsifies it at this pair. A scaling
    gap of 0 refuses the comparison. The uniform-minimum expectation
    (p - 1)/(m + 1) is recorded beside the scaling gap and is not
    substituted for it.

  preregistered_prediction:
    quantity: >-
      The integer volcano_gap minus scaling_gap at the named pair
      p = 41, E_floor, E_crater, E_scaled.
    formula: >-
      The difference is at most 0, and the scaling gap is at least 1.
      Any difference of at least 1, when both gaps are defined, is the
      negative. The formula is the comparison copied from
      IDEA-20261005-b4c2bf. It is not evaluated in place of the roots.
    source: >-
      Copied from IDEA-20261005-b4c2bf before any run of
      EXP-ECTD-e79910. The prime and the three models are the first
      eligible pair under the enumeration in inputs. That naming is a
      label for the instance, not a substitute for method A and method B.

  scale_relevance:
    tier: toy
    justification: >-
      The tested object is one volcano at the prime 41, inside the
      window 17 to 199. A result here is not a result at cryptographic
      size and not an exponent. No extrapolation to a larger prime or
      to a secret path is authorized.
    correspondence: >-
      Direct enumeration of models, direct 2-isogenies, and direct
      order-3 x-coordinates. No Deuring sampling shortcut is used.

  tail_checks:
    - >-
      There is no smoothness tail. The extreme check is the integer
      difference itself. One disagreement between the two root methods
      makes the run invalid. One defined positive scaling gap with a
      strictly larger volcano gap is already the negative. The self-gap
      of the crater is the check that the least-root function is a
      function.

  replication:
    seeds:
      - name: enumeration-order
        algorithm: the field, model, isogeny, root, and gap rules in inputs
        seed: [0]
        note: >-
          One exhaustive pass by two root methods. Adding another prime
          after the first eligible pair is a protocol amendment. Seed 0
          does not draw a sample.
    independent_instances: 1
    independent_instances_note: >-
      One pair. E_scaled is the coordinate control, not a second volcano.
      Methods A and B are two implementations of one root set.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not change the prime,
      the models, or the inequality. maximum_runs is 2 so one
      infrastructure retry may take a new run id. Watch expiry is
      failed_infrastructure, never a negative mathematical result.

  procedure:
    identities: >-
      Check the residue claims for u = 2 and d = 3. Recount the trace
      of E_crater. Run the first-pair enumeration through p = 41 and
      record the first eligible pair before any gap is subtracted.
    roots: >-
      On each of the three models, run method A and method B. Record
      both sets. Then form the two absolute differences only if the
      sets agree and both named models have a nonempty set.
    mechanism_assignment:
      - observation: >-
          The residue checks, the trace -6, the height-2 peel, the
          conductor valuation 2, the first-pair identity, the scaling
          equation, the self-gap 0, and the method agreement all hold;
          each of E_floor and E_crater has at least one verified root;
          the scaling gap is at least 1; and volcano_gap minus
          scaling_gap is at most 0.
        assigns_to: >-
          The prediction holds at this pair. This is not an
          isogeny-path algorithm and not an exponent.
      - observation: >-
          The same validity checks hold, the scaling gap is at least 1,
          and volcano_gap minus scaling_gap is at least 1.
        assigns_to: >-
          Negative. The volcano movement is larger than the scaling
          movement. Success does not hold. The observed integer is the
          datum.
      - observation: >-
          The validity checks through method agreement hold, and the
          scaling gap is 0.
        assigns_to: >-
          The comparison is refused. The coordinate control is
          degenerate. This is not the primary negative and it is not
          success.
      - observation: >-
          Either named model has an empty agreed root set, or the two
          methods disagree.
        assigns_to: >-
          The gap is not read. Report the sets. Do not impute a root.
          This is not success.
      - observation: >-
          The first eligible pair is not the named pair, the trace is
          not -6, the peel height is not 2, the conductor valuation is
          not 2, or a named j is 0 or 1728.
        assigns_to: >-
          Failed setup. There is no gap to score at these models. This
          is not success and it is not a larger volcano gap.
      - observation: >-
          The scaling equation fails, the scaled model is not
          F_41-isomorphic to the crater, u is not a residue, the
          self-gap is not 0, a twist was used as the scaling, a circular
          distance was used, or a design-time root was copied in place
          of the two methods.
        assigns_to: >-
          Invalid. Not evidence for either reading of the gap.
      - observation: >-
          The watch expires, a dependency is missing, or the process crashes.
        assigns_to: >-
          failed_infrastructure. Not evidence.

  stopping_rules:
    - >-
      Stop when the agreed gaps and the root sets are recorded, or when
      an invalid row, a setup row, a degenerate-control row, or an
      empty-root row fires.
    - Do not add another prime after the first eligible pair, and do not walk a 3-isogeny.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - >-
      A timeout, crash, memory abort, or missing dependency is
      failed_infrastructure and is not evidence against the hypothesis.
    - Substituting a design-time integer for method A or method B invalidates the run.
    - Scoring a gap when the two methods disagree invalidates the run.
    - Scoring a gap when the scaled model is a quadratic twist invalidates the run.
    - Reporting success when volcano_gap exceeds scaling_gap invalidates the run.

  success_criterion: >-
    The run is a success for the prediction exactly when the first row
    of mechanism_assignment holds: volcano_gap minus scaling_gap is at
    most 0 and the scaling gap is at least 1. Any other completed
    assignment is not this success. The second row is a negative, so
    success can fail.

  falsification_criterion: >-
    The prediction is falsified when the second row holds: the agreed
    volcano gap is at least the agreed scaling gap plus 1. The third
    row refuses a degenerate control and does not replace that negative.
    The fourth row leaves the gap unread. The fifth row falsifies the
    setup and does not invent a gap. The sixth and seventh rows falsify
    nothing.

  required_artifacts:
    - experiments/EXP-ECTD-e79910/runs/RUN-*/manifest.yaml
    - experiments/EXP-ECTD-e79910/runs/RUN-*/stdout.txt
    - experiments/EXP-ECTD-e79910/runs/RUN-*/stderr.txt
    - experiments/EXP-ECTD-e79910/runs/RUN-*/raw-result.json
    - experiments/EXP-ECTD-e79910/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      The prime, the trace, the peel record, the first eligible pair,
      the method A and method B root sets on all three models, the three
      least roots when the sets agree, the two gaps, and the scaling
      equation check.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row.
      It does not change hypothesis status. It does not claim an
      isogeny-path algorithm.

  assigned_to: executor
  zero_runs_in_design: true
