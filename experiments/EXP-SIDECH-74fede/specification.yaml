experiment:
  id: EXP-SIDECH-74fede
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-49d0e2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-49d0e2
  question_id: RQ-ECDSA-87625f
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustively enumerate operation words for four scalar-multiplication algorithms at bit-lengths
    up to 24 and report exact conditional entropies and fibre-size distributions, calibrated by two
    algorithms whose values are forced.
  objective: 'The one uncertainty a run reduces: how much of a scalar survives observation of the
    operation sequence alone, for each of four algorithms, as an exact number rather than an adjective.
    Concretely: (i) do the two calibration algorithms return their forced values -- exactly n bits
    for the Montgomery ladder and at most 1 bit for naive binary double-and-add -- which is the only
    check that the emitters emit what the algorithms actually do, since the mathematics of those two
    cases is settled in advance and any deviation is an implementation fault; (ii) do the two nulls,
    an independent word with matched length distribution and a constant word, both return exactly
    n bits, which is the only check that the fibre-counting and exact-arithmetic entropy code cannot
    manufacture a reduction; (iii) where do w-NAF at w=2..5 and always-double-and-add land between
    those extremes, and does the fraction H(k|S)/n stay stable across the bit-length ladder or drift,
    which decides whether any statement about larger bit-lengths is even a candidate for extrapolation.
    The run answers these three exactly, with no estimator and no confidence interval, and stops.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''for these emitters at these conventions,
      at bit-lengths up to 24, with scalars uniform over the full range and an adversary assumed to
      observe the operation word and nothing else, the exact conditional entropies and fibre-size
      distributions are as tabulated, with the two forced values reproduced and both nulls returning
      exactly n.'' What does NOT follow: that any adversary can observe an operation word on any device;
      that a compiled implementation emits these words; that residual entropy converts into a recovery
      cost; that any conclusion holds at 256-bit scalars, where only a fitted extrapolation with residuals
      is offered; and anything at all about the security of ECDSA or any deployed system. In particular
      a small residual entropy is NOT an attack and a large one is NOT a security proof.'
  inputs:
    procedure: 'STAGE 0 (cost: ~2 hours): implement four pure emitters with conventions written down
      explicitly -- leading bit, dummy operations, final subtraction -- and record the convention
      per emitter. STAGE 1 (cost: minutes CPU): emitter-fidelity control, 1000 random scalars per
      algorithm, token-by-token comparison against the operation sequence of the corresponding real
      routine over harness/toycurve.py. STAGE 2 (cost: seconds CPU): n=16 pilot over all four algorithms
      plus both nulls; check the two forced values and the two null values before anything larger
      runs. STAGE 3 (cost: ~1-2 core-hours): full ladder n in {8, 12, 16, 20, 22, 24} for naive double-and-add,
      always-double-and-add, Montgomery ladder, and w-NAF at w in {2,3,4,5}, in both adversary alphabets
      (table indices visible and not visible). STAGE 4 (cost: minutes): exact entropies in Fraction,
      cross-checked in float to 1e-12; full fibre-size histograms retained. STAGE 5 (cost: minutes):
      fit H(k|S)/n against n per algorithm and report the fit with residuals, labelled as an extrapolation.
      STAGE 6 (cost: minutes): emit the run record with conventions, seeds, alphabet choice and both
      null results.'
    instrument: 'Python 3 standard library: itertools for enumeration, fractions.Fraction for exact
      entropy arithmetic, collections.Counter for fibre accumulation with the word itself as the dictionary
      key so no hash collision is possible. harness/toycurve.py for the reference scalar multiplications
      used only in the STAGE 1 fidelity control. harness/runner.py and src/crypto_autoresearcher/runner.py
      for run-record emission and seed recording. numpy optional for histogram summarisation only.
      No Sage. No lattice or side-channel library. No physical measurement of any kind, and no timing
      quantity enters any reported metric.'
    parameters: 'Bit-lengths n in {8, 12, 16, 20, 22, 24}, full enumeration of all 2^n scalars at
      each. Algorithms: naive binary double-and-add, always-double-and-add, Montgomery ladder, w-NAF
      at w in {2,3,4,5}. Adversary alphabets: {D, A} and {D, A_1..A_m} with table indices distinguished
      -- both run. Nulls: independent word with matched length distribution, and constant word, both
      at every (algorithm, n). Fidelity control: 1000 random scalars per algorithm at n=16. Entropy
      arithmetic: Fraction exact, plus float cross-check at 1e-12. No random seeds are needed for
      the enumeration itself; seeds are recorded only for the fidelity control and the independent-word
      null.'
  controls:
  - Independent-word null with matched length distribution, same enumeration and same entropy code.
  - Constant-word null, checking the degenerate end of the code path.
  - Montgomery-ladder forced-value control, which must return exactly n.
  - Naive double-and-add forced-value control, which must return at most 1 bit.
  - 'Emitter-fidelity control: for 1000 random scalars, the emitted word is compared token by token
    against the operation sequence of the corresponding real routine executed over harness/toycurve.py.'
  - 'Exact-arithmetic control: entropies computed in Fraction and in float, required to agree to 1e-12,
    so that no conclusion rests on floating-point summation over many small fibres.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A word generator that emits, for each scalar, a word drawn independently
    of the scalar from the SAME length distribution and the SAME token alphabet as the algorithm being
    tested, with the identical fibre-counting and entropy code applied. For the measurement to mean
    anything the null must return H(k | S) = n exactly -- to the last bit, since this computation
    has no sampling error. A null returning less than n means the fibre-counting or the entropy arithmetic
    is wrong, since an independent word cannot reduce entropy. Both arms run in the same invocation
    over the same enumerated scalar set. A second null uses a constant word for every scalar, which
    must also return exactly n, checking the degenerate end of the same code path.'
  independent_variables:
  - algorithm
  - bit-length n
  - window width w for w-NAF
  - adversary alphabet (table indices visible or not)
  metrics:
    primary:
    - exact H(k | S) in bits per (algorithm, n, alphabet)
    - H(k | S)/n
    - fibre-size histogram
    - number of distinct emitted words
    secondary:
    - null-arm entropies
    - emitter-fidelity mismatch count
    - Fraction versus float entropy discrepancy
    - enumeration wall time per cell, reported as cost only
  heuristic_under_test: null
  preregistered_prediction:
    quantity: H(k | S) for each algorithm at each bit-length, with the two forced values and the two
      null values as the pre-registered checks.
    formula: 'Forced values, derived rather than measured: for the Montgomery ladder at fixed bit-length
      the emitted word is the constant (DA)^n, so S is a constant function, the single fibre has size
      2^n, and H(k | S) = log2(2^n) = n exactly. For naive binary double-and-add the word is D for
      a zero bit and DA for a one bit, so the word determines the bit string apart from the leading-bit
      convention, the fibres have size 1 or 2, and H(k | S) is 0 or exactly 1 bit depending on that
      convention. For the independent-word null, S is independent of k so H(k | S) = H(k) = n exactly.
      These three are pre-committed as exact equalities, not as approximations, and the experiment
      is only interpretable if all three hold. For w-NAF the fibre structure is determined by the
      recoding''s image and the token homomorphism''s kernel; no value is pre-committed, and the reason
      is stated: it is the quantity the enumeration exists to produce.'
    source: Pre-registered in the parent proposal IDEA-20260816-49d0e2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Enumerated exhaustively at bit-lengths up to 24, which is the largest n at which
      2^n emitter calls across a dozen configurations fits in a couple of core-hours. Deployed scalars
      are 256 bits. The transfer assumption is stated and is weak: only H(k|S)/n, the surviving fraction,
      is a candidate for extrapolation, and the run reports it as a fit across six bit-lengths with
      residuals rather than as a measurement at 256. The fit''s validity depends on the recoding''s
      fibre structure being asymptotically length-homogeneous, which is not proved here and is listed
      as a derivation gap. No number at 256 bits is reported as measured, and the two forced values,
      which are exact at every n by derivation, are the only quantities that transfer unconditionally.'
    correspondence: null
  tail_checks:
  - Inspect the largest fibre at each cell, since the entropy is dominated by large fibres.
  - Inspect singleton fibres, whose count is the number of scalars uniquely determined by their word.
  - Inspect the shortest and longest emitted words, where length-distribution matching in the null
    is most likely to fail.
  - Check w=5 at n=24 specifically, the cell with the largest table alphabet and the sparsest fibre
    statistics.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt at the n=16 pilot if either forced value or either null value is wrong; report an implementation
    fault and run nothing larger.
  - Stop at n=24; do not extend the ladder in search of a cleaner fit.
  - Halt if total wall time exceeds 3 hours and report the completed cells only, recording the halt
    as a budget event and never as evidence about any algorithm.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both forced values and both null values come out exactly as derived at every
    bit-length, the emitter-fidelity control finds zero mismatches, and exact conditional entropies
    with fibre-size histograms are produced for all four algorithms across the bit-length ladder in
    both adversary alphabets.
  falsification_criterion:
  - Montgomery-ladder arm returns other than exactly n bits at any n.
  - Naive double-and-add arm returns more than 1 bit at any n.
  - Either null returns other than exactly n bits.
  - Any emitter-fidelity mismatch against the real routine.
  - Fraction and float entropies disagree beyond 1e-12, indicating the summation is numerically unsound.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-49d0e2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether H(k|S)/n is asymptotically length-homogeneous for w-NAF is not proved, and without it
    the extrapolation to 256 bits has no justification beyond the fit.
  - The adversary alphabet is a free choice that changes the windowed results substantially; a Coordinator
    must decide whether both variants are reported as equals or one is primary.
  - Conventions for leading bit, dummy operations and final subtraction are recorded but not standardised
    against any reference implementation in this repository.
  - No bridge is specified from residual entropy to search cost, so the number produced cannot yet
    be consumed by any cost model in this program.
