experiment:
  id: EXP-PFDR-f4cc45
  hypothesis_id: H-PFDR-cbb5c4
  question_id: RQ-QALG-122b59
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the affected
    data is generated. NOTHING HERE IS A MEASUREMENT. The deployed-parameter numbers quoted
    below were computed by TASK-20260904-5423ad from the filed corpus record and are
    recorded as arithmetic to be re-derived by the executor from that record, never as
    measurements.

  title: >-
    The transform-domain sparsity threshold for quasi-cyclic syndrome decoding - measuring
    where recovery actually stops, and separating the linear-complexity mechanism from the
    two things that would look identical, namely instance easiness and the independent
    equation count.

  objective: >-
    Compute the transform-domain threshold and the deficit at the deployed parameter sets
    from the filed corpus record; measure the PRACTICAL recovery threshold at toy lengths;
    and decide whether the observed sub-threshold recovery is attributable to the linear
    complexity of the transform sequence at all, by running a generic decoding baseline on
    the same instances and by repeating the whole measurement at lengths where the
    cyclotomic coset count differs while the complexity bound does not.

  inputs:
    arithmetic_arm:
      parameters: >-
        READ AT RUN TIME from the filed corpus record and recorded in the manifest with its
        content hash. NOT TRANSCRIBED FROM THIS CONTRACT. TASK-20260904-5423ad read that
        record and reports lengths 17669, 35851 and 57637 with secret weights 66, 100 and
        131; the executor re-reads and any disagreement halts the run.
      computations: >-
        The order of two modulo each length, by factoring the length minus one and testing;
        the two-cyclotomic coset count; the analytic threshold as the floor of the length
        over twice the secret weight, minus one; the deficit as half the length divided by
        that threshold; and the base-two logarithm of the exact first-moment multiplier
        count.
      no_recovery: >-
        NO RECOVERY IS ATTEMPTED AT ANY DEPLOYED PARAMETER SET. This arm is arithmetic on
        three integers per set and nothing else.
    primitive_toy_arm:
      lengths: 'odd primes with two primitive, from about 31 to about 251'
      secret_weights: 'from 3 to 8'
      public_weight_sweep: 'from 1 up past the analytic threshold for each cell'
      trials_per_cell: 200
      quantity: 'empirical recovery rate with a confidence interval, per cell'
    nonprimitive_toy_arm:
      lengths: >-
        MATCHED odd primes at which two is NOT primitive, so the coset count is at least
        three, chosen at comparable sizes to the primitive arm.
      quantity: 'the identical public-weight sweep and recovery rate'
      purpose: >-
        THE MECHANISM-SEPARATION CONTROL. The linear-complexity bound does not involve the
        coset count, so the threshold is PREDICTED IDENTICAL here. If it moves, the
        threshold is being driven by the number of independent equations rather than by the
        linear complexity, and the mechanism attributed by the hypothesis is the wrong one.
    isd_baseline_arm:
      construction: >-
        A generic information-set decoding implementation run on the SAME instances at
        every cell of both toy arms, charged in the same unit as the transform route.
      purpose: >-
        THE ATTRIBUTION CONTROL. A sparse public element makes the underlying decoding
        problem easy for reasons unrelated to linear complexity. If the generic baseline
        succeeds in comparable charged operations below the threshold, the polynomial-time
        result is NOT attributable to the transform mechanism.
    multiplier_arm:
      lengths: 'toy primes up to about 1021 with two primitive'
      samples: '10 to the 7 multipliers of small weight per length and public element, over 100 uniform public elements each'
      quantity: 'the empirical distribution of the joint weight, and its observed minimum against the first-moment prediction'
    weight_distribution_arm:
      samples: '10 to the 6 public elements at the first deployed length, 10 to the 5 at each of the others'
      quantity: 'the empirical weight distribution against the binomial, and the minimum observed weight against the corresponding quantile'

  controls:
  - >-
    C-POSITIVE (MANDATORY, RUNS FIRST). Public weight one and public weight two at every toy
    length. Recovery MUST succeed at 100 percent. Failure means the implementation is wrong
    and no other cell may be interpreted.
  - >-
    C-UNSATISFIABLE. Replace the secret by a uniform pair of the same weights with the
    syndrome drawn independently of them. The pipeline must report failure and never a
    spurious recovery; any recovery is a measurement artifact.
  - >-
    C-UNIFORM-PUBLIC (THE LOAD-BEARING NULL). Replace the public element by a uniform ring
    element at the same toy length, so its weight is about half the length. The recovery
    rate must be statistically indistinguishable from C-UNSATISFIABLE. THIS IS THE DIRECT
    TEST THAT THE MECHANISM HAS NO POWER AT THE DEPLOYED OPERATING POINT, and it is what
    stops this record being read as an attack.
  - >-
    C-ISD-ATTRIBUTION (THE ATTRIBUTION CONTROL). The generic decoding baseline on the same
    instances, in the same charged unit. The transform route must beat it by at least a
    factor of 10 below the threshold, or the recovery is attributable to instance easiness
    rather than to the transform mechanism.
  - >-
    C-NONPRIMITIVE (THE MECHANISM-SEPARATION CONTROL). The identical sweep at lengths where
    two is not primitive. The measured threshold must be UNCHANGED.
  - >-
    C-DECAY (THE STRUCTURAL TELL). The recovery rate must DECAY as the public weight
    increases past the threshold. A recovery rate that stays flat across the public weight
    is the signature of an artifact - a leaked secret in the harness, for instance - and not
    of a wider threshold.
  - >-
    C-FIELD-ASSERTION. The harness ASSERTS that the chosen primitive element has order equal
    to the length and that the extension degree equals the order of two, rather than
    assuming either. An implementation using a non-primitive element or an unnecessarily
    large field produces a correct-looking threshold for the wrong reason.
  - >-
    C-COST-SEPARATION. Correctness and cost are reported separately. Berlekamp-Massey over a
    large extension field is expensive at toy scale for reasons unrelated to the method
    failing, and conflating the two would misread an infrastructure cost as a mathematical
    limit.
  - >-
    C-SMOKE-NONCYCLIC (RETAINED AS A SMOKE TEST, LABELLED AS ONE). A non-quasi-cyclic random
    code, on which the transform step is inapplicable and no number should be produced. THIS
    CONTROL HAS NO MEASURABLE OUTCOME BY CONSTRUCTION and is retained only to catch a
    harness that fabricates one. It is NOT a discriminator and is never reported as one.

  independent_variables:
  - arm - arithmetic, primitive_toy, nonprimitive_toy, isd_baseline, multiplier, weight_distribution
  - length
  - secret weight
  - public weight, swept
  - whether two is primitive modulo the length

  metrics:
    primary:
    - >-
      practical_threshold, an integer public weight, the largest at which recovery succeeds
      in at least 95 percent of trials, per (length, secret weight) cell, per arm.
    - >-
      threshold_shift, an integer, the practical threshold at non-primitive lengths minus the
      threshold at matched primitive lengths. PREDICTED EXACTLY ZERO.
    - >-
      isd_ratio, dimensionless, charged operations of the generic decoding baseline divided
      by charged operations of the transform route, per cell below the threshold.
    - >-
      order of two modulo the length and the coset count, integers, per deployed length.
    - >-
      analytic_threshold and multiplicative deficit, an integer and a dimensionless ratio,
      per deployed length.
    secondary:
    - empirical recovery rate with a confidence interval per cell, and its decay past the threshold
    - observed node collision count against the predicted union bound, per cell
    - empirical minimum joint multiplier weight against the first-moment prediction, per length
    - base-two logarithm of the exact first-moment multiplier count, in bits, per deployed length
    - empirical public-element weight distribution against the binomial, and the minimum observed weight
    - charged operations and wall time for transform and for Berlekamp-Massey, per length, reported separately
    - C-UNSATISFIABLE and C-UNIFORM-PUBLIC recovery rates
    - the asserted primitive-element order and extension degree per length
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-003

  preregistered_prediction:
    quantity: >-
      The practical recovery threshold, its invariance under the coset count, and the
      deployed-parameter arithmetic.
    formula: >-
      practical_threshold at or below the analytic threshold, short of it by an amount
      consistent with the predicted collision rate. threshold_shift exactly 0. isd_ratio at
      least 10 below the threshold. Order of two equal to the length minus one and coset
      count exactly 2 at all three deployed lengths. Analytic thresholds 132, 178 and 218
      and deficits about 66.9, 100.7 and 132.2.
    source: >-
      The complexity bound is derived - the transform of the syndrome is a sum of at most
      the secret weight plus the public weight times the secret weight exponentials.
      TASK-20260904-5423ad computed the deployed thresholds and deficits by arithmetic on
      the parameters in the filed corpus record; the executor re-derives them from that
      record. The deficits are NOT exactly the secret weights, which the source idea
      asserts - the minus one in the threshold makes them 1.4, 0.7 and 0.9 percent higher,
      and that discrepancy is recorded rather than smoothed.

  scale_relevance:
    tier: toy
    justification: >-
      Recovery is measured only at lengths of at most about 251, and the multiplier arm only
      up to about 1021. The deployed parameter sets appear ONLY in the arithmetic arm, where
      three integers are computed and no recovery is attempted. Toy-scale recovery
      measurements are hypothesis-generating for the scaling law and are NOT statements
      about any deployed parameter set.
    correspondence: null

  tail_checks:
  - >-
    The minimum observed public-element weight over the sampled elements is compared against
    the corresponding binomial quantile. A minimum materially below it is a finding in its
    own right and is reported rather than absorbed.
  - >-
    The maximum observed node collision count is compared against the Poisson upper tail at
    the predicted mean.
  - >-
    The smallest observed joint multiplier weight over all samples must not fall more than
    two standard deviations below the first-moment prediction.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    seeds_policy: >-
      One master seed per run recorded in the manifest, from which secret support draws,
      public element draws, multiplier sampling and the unsatisfiable-control construction
      are derived by a declared deterministic stream. Every trial is reproducible from the
      master seed and its cell and trial index. Seeds are fixed before execution and never
      redrawn after an outcome is seen. THE HARNESS MUST NOT HAVE ACCESS TO THE SECRET
      SUPPORT AFTER CONSTRUCTION, and the run asserts that it does not, because a leaked
      secret is the exact failure C-DECAY exists to catch.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1

  stopping_rules:
  - >-
    SR1 BLOCKING. The parameters are re-read from the filed corpus record and compared
    against the values recorded by TASK-20260904-5423ad. Disagreement halts the run and is
    reported as the result.
  - >-
    SR2 BLOCKING. C-POSITIVE at public weight one and two must succeed at 100 percent at
    every toy length before any other cell is interpreted.
  - >-
    SR3 BLOCKING. C-FIELD-ASSERTION must pass at every length before any recovery is
    measured.
  - >-
    SR4. If the order of two is less than the length minus one at any deployed length, the
    run STOPS, records it, and ESCALATES - that reopens the transform-domain algebraic lane
    and must not be filed as a footnote.
  - >-
    SR5. If C-UNIFORM-PUBLIC shows recovery above the unsatisfiable control at high
    confidence, the run STOPS and escalates - that would be a genuine attack signal on
    random quasi-cyclic syndrome decoding and must reach an independent adversarial review
    before any record states it.
  - >-
    SR6. If an explicit multiplier meeting the joint weight bound is found at any length
    above 1000, the run STOPS and reports it - the multiplier lane reopens.
  - >-
    SR7. Budget exhaustion stops the run and reports the cells completed. An infrastructure
    receipt, never a negative result.

  invalidation_rules:
  - >-
    C-POSITIVE fails at any length.
  - >-
    The harness has access to the secret support during recovery, or C-DECAY shows a flat
    recovery rate across the public weight.
  - >-
    The primitive element order or the extension degree is not asserted.
  - >-
    Parameters are transcribed from this contract rather than read from the filed record.
  - >-
    Correctness and cost are conflated anywhere - a large-field arithmetic cost reported as
    a method failure.
  - >-
    The smoke test is cited as a discriminator rather than as a smoke test.
  - >-
    Any recovery is attempted at a deployed parameter set.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and is NEVER
    counted as negative mathematical evidence.

  success_criterion: >-
    C-POSITIVE, C-FIELD-ASSERTION, C-UNSATISFIABLE, C-UNIFORM-PUBLIC and C-DECAY all
    discharged; practical_threshold at or below the analytic threshold at every toy cell;
    threshold_shift exactly zero between the primitive and non-primitive arms; isd_ratio at
    least 10 below the threshold; order of two equal to the length minus one and coset count
    exactly 2 at all three deployed lengths; and the deficits and multiplier counts computed
    and reported with their exact derivations.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) The order of two is less than the length
    minus one at any deployed length - the Frobenius-collapse claim fails there, the
    independent-equation count rises to at least three, the transform-domain algebraic lane
    REOPENS, and SR4 escalates it. (F2) practical_threshold materially ABOVE the analytic
    threshold at two or more toy lengths - the linear-complexity bound is wrong and must be
    re-derived. (F3) C-UNIFORM-PUBLIC shows recovery above the unsatisfiable control - the
    dissolution claim fails and this is a genuine attack signal on random quasi-cyclic
    syndrome decoding, handled under SR5. (F4) THE GENERIC DECODING BASELINE SUCCEEDS
    COMPARABLY BELOW THE THRESHOLD, giving isd_ratio near 1 - THE POLYNOMIAL-TIME RESULT IS
    NOT ATTRIBUTABLE TO THE TRANSFORM MECHANISM; the instance is simply easy there, and the
    record must attribute it to instance easiness and withdraw the mechanistic reading.
    (F5) THE THRESHOLD MOVES BETWEEN THE PRIMITIVE AND NON-PRIMITIVE ARMS - the threshold is
    driven by the independent equation count rather than by the linear complexity, and
    H-PFDR-cbb5c4 has attributed the mechanism to the wrong quantity. (F6) An explicit
    threshold-reaching multiplier is found above length 1000 - the concentration heuristic
    fails and the multiplier lane reopens. (F7) The measured deficit differs from the
    computed value by more than 10 percent at any deployed set - either the parameters or the
    analysis is wrong.

  required_artifacts:
  - the parameters as re-read from the filed corpus record, with its content hash
  - order of two, its factorisation witness, and the coset count per deployed length
  - analytic threshold, deficit, and the base-two logarithm of the exact first-moment multiplier count per deployed length, each with its derivation
  - empirical recovery rate with confidence intervals per (length, secret weight, public weight) cell, both toy arms
  - practical_threshold per cell, and threshold_shift between the two toy arms
  - generic decoding baseline charged operations per cell and isd_ratio
  - observed node collision counts against the predicted union bound
  - empirical joint multiplier weight distribution and its observed minimum against the first-moment prediction
  - empirical public-element weight distribution against the binomial, with the minimum observed weight
  - C-POSITIVE, C-UNSATISFIABLE, C-UNIFORM-PUBLIC, C-DECAY and smoke-test outcomes
  - asserted primitive-element order and extension degree per length
  - charged operations and wall time for transform and Berlekamp-Massey separately per length
  - command, environment, seeds, library versions and resource measurements

  limitations:
  - >-
    NOTHING HERE IS AN ATTACK ON ANY DEPLOYED SCHEME, and the predicted outcome is that all
    three parameter sets sit a factor of about the secret weight beyond the threshold and
    that the lane is closed. The deliverable is two reusable numbers and a design criterion.
  - >-
    THE SOURCE IDEA'S THIRD NULL HAS WIDTH ZERO AND WAS DEMOTED. A non-quasi-cyclic code on
    which the transform step is inapplicable produces no number, so the control can only
    catch a harness that fabricates one. It is retained as a smoke test under that name and
    is replaced as a discriminator by C-ISD-ATTRIBUTION and C-NONPRIMITIVE, both of which
    have real range. Recorded in H-PFDR-cbb5c4 band_non_degeneracy.
  - >-
    ATTRIBUTION IS NOT AUTOMATIC AND IS THE MAIN RISK. Below the threshold the instance is
    easy for reasons that have nothing to do with linear complexity, so observing
    polynomial-time recovery there is consistent with the transform mechanism AND with the
    instance simply being easy. C-ISD-ATTRIBUTION decides between them, or the mechanistic
    reading is withdrawn.
  - >-
    THE DEFICIT IS NOT EXACTLY THE SECRET WEIGHT. TASK-20260904-5423ad computed it as about
    66.9, 100.7 and 132.2 against secret weights 66, 100 and 131 - a 1.4, 0.7 and 0.9
    percent discrepancy arising from the minus one in the threshold. The source idea asserts
    exactness; this contract records the approximation.
  - >-
    THE POLYNOMIAL IS LARGE. A quadratic number of extension-field operations at the
    smallest deployed length is on the order of two to the forty-third to two to the
    fifty-sixth bit operations. Quoting polynomial-time without that figure would mislead.
  - >-
    THE FIRST-MOMENT MULTIPLIER BOUND IS AN EXPECTATION over public elements, not a
    per-instance impossibility proof, and is not claimed as one.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Sub-threshold recovery at a
    deployed length is not executed and is not reachable within this budget. More
    importantly, WHETHER THE SUB-THRESHOLD MECHANISM BEHAVES AS ANALYSED AT DEPLOYED LENGTHS
    IS NOT MEASURED AT ALL - the practical thresholds measured at lengths of at most 251 are
    hypothesis-generating for the scaling law only, and the toy squared-secret-weight over
    length ratio is not small, so toy cancellation rates OVERSTATE the shortfall relative to
    deployed scale.
  - >-
    Scoped to the binary cyclic ring of prime length, Hamming metric, rate one half, secret
    weight sublinear in the length, and a uniform public element. Nothing here bears on the
    moderate-density parity-check family, on composite lengths, on the rank metric, on any
    inner concatenated code, or on any decoding-failure model.
  - >-
    NO CURVE-FREE NULL IS REQUIRED AND THE REASON IS RECORDED - this contract contains no
    elliptic curve and makes no elliptic-curve claim. The separations that DO apply are
    mechanism-versus-instance-easiness and complexity-versus-equation-count, both enforced by
    named controls with real range.

  assigned_to: executor
  approved_by: null
