experiment:
  id: EXP-PMA-034093
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-fbc1d3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-fbc1d3
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Derive the characteristic-2 form of the anchored orientation quadratics, compute the Artin-Schreier
    class of the separable branch over k(t), and measure its firing rate against pulled-back and degree-matched
    nulls
  objective: 'The one uncertainty a run reduces is what the characteristic-2 case, currently handled
    by refusal, actually contains when computed. Concretely: (i) it establishes by explicit derivation
    from the underlying reconstruction equations, not by evaluating the frozen formulas at characteristic
    2 where several terms vanish identically, whether the anchored orientation quadratics retain a
    linear coefficient and therefore have a separable branch at all -- and if they do not, that is
    a terminal finding contradicting the Artin-Schreier naming used in RQ-PMA-001''s own constraints;
    (ii) if a separable branch exists, it computes the Artin-Schreier class of c divided by b squared
    in the additive quotient of k(t) by the image of x maps to x squared plus x, validated in both
    directions on at least 200 constructed solvable and 200 constructed unsolvable instances with
    an additivity check on at least 10^4 pairs, and measures its firing rate on a prescribed grid;
    (iii) it brackets that rate between a pulled-back null, where realizability holds by construction
    and the invariant must never fire, and a degree-matched sampled null giving the background. The
    run revises no scope, decides nothing about characteristic-not-2, and touches no cryptographic
    quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the derived characteristic-2
      form of the frozen anchored orientation quadratics, over finite perfect constant fields of characteristic
      2, for the tested prescribed grid and the stated sampling ensembles, the branch split between
      separable and inseparable, the computed Artin-Schreier class per separable instance, and the
      firing rates on the signal arm, the pulled-back null and the degree-matched null with printed
      denominators and witnesses for any pulled-back firing. What does NOT follow: nothing about characteristic-not-2,
      since the invariants live in different groups and neither refines the other; no compatibility
      claim from a trivial class; nothing about imperfect constant fields; nothing about sizes other
      than 4; no revision of RQ-PMA-001''s scope, which correctly excludes characteristic 2 from its
      question; and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: days, human, ZERO compute): derive the characteristic-2 form of the
      anchored orientation quadratics from the underlying reconstruction equations; identify the linear
      coefficient b per triple; split separable and inseparable branches; print the derivation for
      independent checking. If no separable branch exists, stop and report. STAGE 1 (cost: hours,
      human): fix the partial-fraction reduction convention for the additive quotient and the square
      test for the inseparable branch. STAGE 2 (cost: minutes): constructed-solvable and constructed-unsolvable
      controls, at least 200 each; additivity control on at least 10^4 pairs. Abort on any failure.
      STAGE 3 (cost: minutes): build NULL A -- sample matrices over k(t) in characteristic 2, compute
      exact minor tables, reverify each from its witness in an independent implementation. STAGE 4
      (cost: minutes): run the char-2 gate on NULL A blinded; on any firing, stop and produce the
      counterexample package. STAGE 5 (cost: minutes): NULL B degree-matched sampled tables; saturation
      check. STAGE 6 (cost: minutes): signal arm on the prescribed grid; branch fractions and firing
      rates per branch. STAGE 7 (cost: minutes): non-interference control confirming the frozen char-not-2
      predicate is unchanged; write the run record.'
    instrument: Python 3 with a characteristic-2 polynomial and rational-function layer -- galois
      or a hand-written GF(2^m)[t] implementation with exact partial-fraction decomposition -- plus
      sympy where it supports GF(2^m) exactly; a hand-written additive-image reduction with a fixed
      convention; an independent minor implementation for NULL A witness reverification; the frozen
      char-not-2 predicate imported unmodified and exercised only by the non-interference control.
      harness/runner.py for the manifest, seeds and inference block. No Sage.
    parameters: 'n = 4. Constant fields: F_2, F_4, and F_8 and F_16 where affordable, all perfect.
      Signal grid: at least 30 prescribed tables in the characteristic-2 analogue of the frozen family,
      with parameters drawn from whatever box the derived form admits. NULL A: at least 300 sampled
      matrices per field, entry degrees drawn from {0, 1, 2}, each table reverified. NULL B: at least
      300 degree-matched sampled tables per field. Constructed controls: at least 200 solvable and
      200 unsolvable Artin-Schreier instances per field, built as c equal to (r squared plus r) times
      b squared for explicit r, and with designed nontrivial classes respectively. Additivity control:
      at least 10^4 sampled pairs per field. Saturation band 0.05 to 0.95. Per-instance reduction
      cap 120 s, exceeded cases UNDECIDED.'
  controls:
  - 'Constructed-solvable control: at least 200 instances built as c equal to (r squared plus r) times
    b squared for explicit r in F must be certified trivial, i.e. not obstructed.'
  - 'Constructed-unsolvable control: at least 200 instances built with a designed nontrivial class
    must be certified nontrivial, with the canonical representative printed.'
  - 'Additivity control: the reduction map must satisfy reduce(u plus v) equals reduce(u) plus reduce(v)
    in the quotient, on at least 10^4 sampled pairs.'
  - 'NULL A: prescribed tables pulled back from explicitly sampled matrices over k(t) in characteristic
    2, each with witness reverification by an independent minor implementation.'
  - 'NULL B: degree-matched uniformly sampled tables for the background rate.'
  - 'Branch-separation control: every instance is labelled separable or inseparable before the invariant
    is computed, and the two branches are never aggregated into one rate.; also Char-not-2 non-interference
    control: the existing char-not-2 gate must be unchanged and must still refuse char-2 inputs; this
    entry adds a separate code path and does not modify the frozen predicate.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both run in the same invocation through the identical code
    path, mirroring the design used elsewhere in this bucket. NULL A, soundness: prescribed tables
    obtained by computing the exact principal minors of explicitly sampled 4x4 matrices over F = k(t)
    with k of characteristic 2, so realizability holds by construction with the matrix as witness.
    The char-2 gate must fire at rate exactly zero on NULL A; any firing is a false obstruction with
    its counterexample attached, and this is the only control that can detect unsoundness of a brand-new
    invariant without an existence decider. NULL B, background: degree-matched uniformly sampled tables
    of the same shape, giving the rate at which the invariant is nontrivial on structureless input.
    For the signal arm to mean anything, NULL A must be exactly zero and NULL B must be strictly inside
    0.05 to 0.95; a saturated NULL B means the invariant is nontrivial on nearly everything and its
    firing carries no information.'
  independent_variables:
  - constant field in {F_2, F_4, F_8, F_16}
  - 'branch: separable (b nonzero) versus inseparable (b zero)'
  - 'arm: signal prescribed grid, NULL A pulled back from matrices, NULL B degree-matched sampled'
  - anchored triple index
  metrics:
    primary:
    - existence and form of the linear coefficient b in the derived characteristic-2 quadratics, per
      anchored triple
    - firing rate per branch and per arm, with denominators printed
    - NULL A firing count and, per firing, the class plus witness matrix plus reverification (must
      be 0)
    - constructed_solvable_misclassification_count and constructed_unsolvable_misclassification_count
      (both must be 0)
    - additive_reduction_homomorphism_violations (must be 0)
    secondary:
    - inseparable branch fraction on the signal arm and on each null
    - canonical class representatives for a sample of nontrivial separable instances
    - NULL B saturation check result per field
    - UNDECIDED counts from reduction caps, per arm and field
    - non-interference control result on the frozen char-not-2 predicate; also per-arm degree profile
      summaries for judging null matching
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Soundness of the characteristic-2 invariant on tables with witnesses, and correctness
      of the Artin-Schreier reduction in both directions.
    formula: 'For b nonzero in characteristic 2, X squared plus b X plus c has a root in F if and
      only if c divided by b squared lies in the image of the additive map x maps to x squared plus
      x on F. Pre-committed: constructed_solvable_misclassification_count equals 0; constructed_unsolvable_misclassification_count
      equals 0; additive_reduction_homomorphism_violations equals 0; null_A_char2_firing_rate equals
      0 exactly. No value is pre-committed for the inseparable branch fraction or for the signal-arm
      firing rate, by explicit refusal recorded in the proposal; NULL B must lie strictly inside 0.05
      to 0.95 for the signal comparison to be reported at all.'
    source: Pre-registered in the parent proposal IDEA-20260816-fbc1d3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are n = 4, constant fields F_2 through F_16 all finite and perfect,
      at least 30 prescribed tables, at least 300 tables per null arm per field, and at least 400
      constructed validation instances per field, with entry degrees capped at 2. The extrapolation
      assumptions are stated and not hidden: sampling ensembles are choices and every rate is a property
      of its ensemble; results over perfect finite constant fields do not transfer to imperfect ones,
      where the inseparable branch differs, and that case is declared out of scope rather than assumed
      away. Nothing transfers to characteristic not 2, and the record must say so on its face.'
    correspondence: null
  tail_checks:
  - Instances landing on the inseparable branch are inspected individually at small field sizes, since
    the branch split is the derivation's most fragile consequence.
  - Any NULL A firing is escalated to a full counterexample package and inspected by hand.
  - Instances whose reduction produces a representative of unusually high degree are inspected, since
    that is where the reduction convention is most likely to be incomplete.
  - F_2 results are reported separately from F_4 and above, since with two field elements the sampled
    nulls are extremely thin.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at stage 0 and report if no separable branch survives the characteristic-2 derivation; that
    is a complete and reportable outcome.
  - Abort if any constructed control is misclassified or if additivity fails.
  - Stop and produce the counterexample package on the first NULL A firing that survives witness reverification.
  - Withhold the signal-versus-NULL-B comparison if NULL B is saturated outside the 0.05 to 0.95 band,
    and report the saturation instead.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Either stage 0 terminates with a printed derivation showing no separable branch
    exists, which is a complete outcome; or a separable branch is derived, all constructed and additivity
    controls pass with zero violations, NULL A is built with every table reverified and shows zero
    firings, and firing rates per branch are reported for all three arms with printed denominators.
  falsification_criterion:
  - Any constructed-solvable or constructed-unsolvable misclassification.
  - Any additivity violation in the reduction.
  - 'Any confirmed NULL A firing: the characteristic-2 invariant is unsound on the constructed ensemble,
    with an explicit counterexample matrix.'
  - NULL B firing rate outside the 0.05 to 0.95 band.
  - The non-interference control shows the frozen char-not-2 predicate behaving differently after
    this module is added.
  - NULL A tables failing witness reverification, making the soundness null invalid.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-fbc1d3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must obtain and independently check the characteristic-2 derivation of the orientation
    quadratics before approving any compute; the frozen formulas cannot simply be evaluated at characteristic
    2 and this is the entire risk of the entry.
  - The Coordinator must fix the partial-fraction reduction convention for the additive quotient,
    since triviality is convention-independent but representatives are not.
  - 'The prescribed family''s characteristic-2 analogue needs defining: p_S equal to (t+1)/(t+d_S)
    is available, but which d_S are admissible over F_2 and F_4 is unresolved and connects to the
    parameter-box question raised elsewhere in this bucket.'
  - Whether the inseparable branch should be reported as a third verdict class or excluded from rates
    needs a ruling, since the branch fraction may be large.
