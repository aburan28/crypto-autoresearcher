experiment:
  id: EXP-ECDLP-fa2ed6
  hypothesis_id: H-ECDLP-66d6fc
  question_id: RQ-ECDLP-912694
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    The rationality defect is identically 1 in the ordinary world, so one
    declared control cell of RQ-ECDLP-912694 is provably empty - an exhaustive
    ordinary enumeration, a BLOCKING supersingular positive CONTROL permitted
    under ruling R4, a j-only oracle that must fail that control, and a
    base-change sensitivity check

  objective: >-
    If separately approved, authorized and executed, verify computationally over
    a finite declared range that the rationality defect - the ratio of the
    geometric to the base-field-rational automorphism group order - equals 1 for
    every ordinary curve, demonstrate on a supersingular positive control that
    the same code path detects a defect greater than 1 when one exists, and
    establish by direct enumeration that RQ-ECDLP-912694's third declared control
    family cannot be instantiated within its own declared constraints.

  verification_protocol:
    artifact_checked: >-
      The scope and constraints of RQ-ECDLP-912694 as committed, and the
      rationality defect of every ordinary curve in the declared range.
    reference_checked_against: >-
      (1) The question's own text. Its curve_families list includes, verbatim,
      "extension-field special-j controls where the named automorphism is not
      F_p-rational". Its constraints include, verbatim, "Ordinary curves only;
      supersingular and extension-field-only maps are out of scope." and "Odd
      prime degrees ell in {3,5,7,11,13}; even-degree formulas are not
      implemented."
      (2) The classical theorem that for an ordinary elliptic curve over a finite
      field the endomorphism ring is an order in an imaginary quadratic field
      containing Frobenius, so that commutation with Frobenius - the criterion
      for base-field rationality - is automatic. The argument is reproduced in
      full in the hypothesis so a reviewer can check it without a library.
    result_that_would_fail_it: >-
      A curve satisfying ALL of the question's declared constraints that also
      instantiates its third control family. That would show the scope is
      consistent after all and the finding is false.
    what_a_pass_means: >-
      A pass over a finite range verifies the IMPLEMENTATION, not the theorem.
      The theorem is a derivation and is what a reviewer must check.

  what_this_is_not:
    - Not an ECDLP claim of any kind. No exponent moves, no constant moves, no attack.
    - Not a proof of the classical theorem. The enumeration verifies the implementation over a finite range.
    - Not a supersession of any record. If a prior proposal's assumption becomes a theorem, the correction is by a NEW record and never by an edit.
    - Not a widening of RQ-ECDLP-912694's claim space. Arm S is PERMITTED as a control under ruling R4 and may produce NO claim about supersingular curves; see arm_s_authorization.
    - Not, in any part, a statement about supersingular curves. Arm S is an instrument-dynamic-range measurement and has no other admissible reading.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  arm_s_authorization:
    ruling: R4
    ruling_path: coordination/reviews/backlog-design-20260904/coordinator-rulings.md
    disposition: >-
      PERMITTED AS A CONTROL, FORBIDDEN AS A CLAIM. The designing coordinator
      escalated rather than deciding; the ruling authorises the supersingular
      arm to run as a control and forbids it from producing any claim about
      supersingular curves.
    basis: >-
      RQ-ECDLP-912694 constraint 1 reads, verbatim, "Ordinary curves only;
      supersingular and extension-field-only maps are out of scope." Read alone
      that forbids the arm. It is not alone. Constraint 4 of the same question
      reads, verbatim, "Exception cells are controls and cannot be used as
      unqualified falsification evidence" - the question contemplates cells
      outside its scope serving as controls and BOUNDS what may be concluded
      from them rather than forbidding them. Its own scope.curve_families
      confirms the reading, since the third entry is an out-of-family object
      admitted precisely because it is a control. Constraint 1 therefore bounds
      the CLAIM SPACE, not the control space. A control is not a claim.
    why_it_matters: >-
      Without the arm, "the defect is 1 identically for ordinary curves" is
      measured by an instrument never shown able to return anything else, which
      makes it an unfalsifiable constant rather than a result. GOAL-ENDO-001
      completion criterion C4 forbids that in terms, verbatim - "Every
      instrument used to support any conclusion has passed both directions of
      its RQ-INSTR-f8faa0 control: it detects a planted signal and it rejects a
      matched null." RQ-INSTR-f8faa0's own decision_target states the same thing,
      verbatim - "An instrument that cannot detect a planted signal cannot
      support a negative, and one that fires on a matched null cannot support a
      positive. Both directions are required before any lane's result is
      citable."
    binding_conditions:
      - >-
        BC1. The arm is labelled a CONTROL everywhere it appears - in this
        contract, in the run artifacts, and in any evidence record that cites
        it. It is never labelled an arm, a cell, or a result.
      - >-
        BC2. NO RECORD MAY STATE A RESULT ABOUT SUPERSINGULAR CURVES FROM IT.
        Its only admissible reading is instrument dynamic range. A sentence of
        the form "on supersingular curves we observed X" is a contract
        violation regardless of what X is.
      - >-
        BC3. The ordinary-curve conclusion stays scoped to ordinary curves and
        cites the arm ONLY as evidence that the instrument could have returned
        otherwise - never as support for the ordinary value itself.
      - >-
        BC4. IF THE ARM DOES NOT RETURN A DEFECT DIFFERENT FROM 1, THAT IS AN
        INSTRUMENT FAILURE AND NOT A FINDING ABOUT CURVES. It triggers
        GOAL-ENDO-001 pause condition P1, verbatim - "The instrument fails its
        RQ-INSTR-f8faa0 two-directional control. Measurement stops until the
        instrument is repaired under a new contract; existing measurements taken
        with the failed instrument are marked attempted_and_inconclusive, never
        negative evidence." This is written out because it is the case most
        likely to be misread later - a supersingular curve returning 1 says
        NOTHING about supersingular curves and everything about the code.
    citation_scope_note: >-
      C4 and P1 are completion and pause conditions of GOAL-ENDO-001, whose
      instrument lane is RQ-INSTR-f8faa0. This contract's question is
      RQ-ECDLP-912694, which carries no P1 of its own. They are cited here as
      the ruling's stated basis and as the disposition Arm S inherits, not as
      conditions RQ-ECDLP-912694 itself imposes.
    verified_by: >-
      coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
      coordination/reviews/backlog-design-20260904/coordinator-rulings.md R4 in
      full, ledger/questions/RQ-INSTR-f8faa0.yaml in full (41 lines), and the
      completion_criteria and pause_conditions blocks of
      ledger/goals/GOAL-ENDO-001/goal.yaml directly. Every string quoted in this
      block was checked against its source; RQ-ECDLP-912694's constraints 1 and 4
      were checked against that file in the original design pass.

  claim_ceiling: >-
    Tier TOY for the enumerated arm and DERIVATION for the algebraic statement,
    unraisable by any downstream citation. The exact scope a completed run could
    support is - over the declared prime range and characteristic exclusions, the
    defect is 1 on every ordinary curve, the same code path returns a defect
    greater than 1 on the supersingular control, and no curve satisfying the
    question's constraints instantiates its third control family. It cannot prove
    the theorem and can certify nothing about characteristic 2 or 3.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) The defect equals EXACTLY 1 on every ordinary curve in the declared
    range, with ZERO exceptions.
    (2) The defect is STRICTLY GREATER THAN 1 on at least one supersingular
    control curve, with the expected values written before the run.
    (3) The j-only oracle FAILS the supersingular positive control by returning
    1 there, and the real implementation does NOT agree with it there.
    (4) The count of curves in the question's third declared control family
    instantiable within its own constraints is EXACTLY 0.
    (5) Exactly 1 odd prime of the declared degree set is ramified in the maximal
    order for one arm and EXACTLY 0 for the other, confirming the scope
    asymmetry by a computation that needs no curves at all.
    (6) The defect is 1 under base change to quadratic and cubic extensions, with
    the automorphism group RECOMPUTED rather than inherited.
    (7) The replacement null shows no discount, within the frozen seed band.

  measured_quantities:
    - name: rational_aut_order
      definition: >-
        Order of the base-field-rational automorphism group, computed by
        EXHIBITING every base-field automorphism explicitly as an isomorphism of
        the curve to itself, never inferred from the j-invariant.
      units: group order (dimensionless integer)
    - name: geometric_aut_order
      definition: >-
        Order of the geometric automorphism group, computed by the same explicit
        test over the splitting field of the relevant equation.
      units: group order (dimensionless integer)
    - name: delta
      definition: geometric_aut_order divided by rational_aut_order.
      units: dimensionless integer ratio, expected in {1, 2, 3, 4, 6}
    - name: splitting_field_degree
      definition: >-
        Degree of the extension over which the geometric automorphism group was
        computed, per curve.
      units: degree (dimensionless integer)
    - name: ordinary_verdict
      definition: Ordinary or supersingular, classified by the trace.
      units: categorical
    - name: third_family_count
      definition: >-
        Number of curves satisfying every declared constraint of
        RQ-ECDLP-912694 that also instantiate its third control family.
      units: curves (dimensionless integer)
    - name: ramified_prime_count
      definition: >-
        Number of odd primes in the question's declared degree set ramified in
        the maximal order of each arm's discriminant.
      units: primes (dimensionless integer, one value per arm)
    - name: replacement_null_ratio
      definition: >-
        Measured collision-search step-count ratio on ordinary curves with a
        small-degree non-invertible endomorphism and automorphism group of order
        2, per seed.
      units: dimensionless ratio
    - name: certificate_fraction
      definition: >-
        Fraction of claimed automorphisms independently re-verified as curve
        isomorphisms by code sharing no state with the producer.
      units: dimensionless fraction, required 1.0

  metrics:
    primary: [delta, rational_aut_order, geometric_aut_order, third_family_count, ramified_prime_count]
    secondary: [splitting_field_degree, ordinary_verdict, replacement_null_ratio, certificate_fraction]

  null_and_control_objects:
    - id: CONTROL-S-SUPERSINGULAR
      name: supersingular positive control, BLOCKING, PERMITTED AS A CONTROL UNDER RULING R4
      construction: >-
        Supersingular j = 0 curves over primes in the same range where the
        relevant primitive cube root of unity is NOT in the base field, so a
        geometrically present automorphism is visibly not base-field rational.
        The ground truth is known in advance and the expected defect values are
        written before the run.
      forced_value: delta strictly greater than 1 on at least one control curve
      non_vacuity: >-
        WITHOUT THIS ARM THE ORDINARY RESULT IS AN UNFALSIFIABLE CONSTANT - a
        null whose band has width exactly zero by construction, which is
        precisely the failure this control lane exists to prevent. An enumeration
        reporting delta = 1 everywhere, with no object anywhere on which delta
        exceeds 1, has measured nothing. THIS IS THE SINGLE MOST IMPORTANT
        CONTROL IN THE DESIGN.
      authorization: >-
        PERMITTED AS A CONTROL, FORBIDDEN AS A CLAIM, under ruling R4 at
        coordination/reviews/backlog-design-20260904/coordinator-rulings.md.
        RQ-ECDLP-912694 constraint 1 bounds the claim space, not the control
        space; its constraint 4 contemplates out-of-scope cells serving as
        controls and bounds what may be concluded from them. Full basis and the
        four binding conditions are in this contract's arm_s_authorization
        block, and BC1 through BC4 bind every artifact this control produces.
      admissible_reading: >-
        INSTRUMENT DYNAMIC RANGE, AND NOTHING ELSE. Running this control
        establishes that the measurement is capable of returning a defect
        different from 1 at all. It asserts NOTHING about supersingular curves,
        and no record may state a result about them from it (BC2).
      failure_disposition: >-
        A defect of 1 on every control curve is an INSTRUMENT FAILURE, not a
        finding about curves. It triggers GOAL-ENDO-001 pause condition P1 -
        measurement stops until the instrument is repaired under a NEW contract,
        and every measurement already taken with the failed instrument is marked
        attempted_and_inconclusive, NEVER negative evidence. The ordinary
        enumeration is then reported under that label and is not a verified
        negative (BC4).
      unavailability_disposition: >-
        RETAINED FROM THE ORIGINAL DESIGN AND STILL BINDING FOR ANY OTHER
        REASON THE CONTROL CANNOT RUN - infrastructure, budget, or an absence of
        admissible control curves in the declared prime range. In that case this
        contract is reported as a DERIVATION ONLY with its experimental arm
        WITHDRAWN, and the ordinary arm is reported as UNFALSIFIED rather than
        as confirmed. IT MUST NOT REPORT AN UNFALSIFIABLE CONSTANT AS A VERIFIED
        NEGATIVE. This is no longer the disposition for a refused scope decision,
        because the scope decision has been granted.
    - id: NULL-JONLY
      name: j-only oracle, the curve-content-free null
      construction: >-
        A deliberately degenerate oracle that computes the defect from the
        j-invariant alone, by table lookup, run over the identical curve set
        INCLUDING the supersingular control.
      forced_value: >-
        The j-only oracle MUST return 1 on the supersingular control, thereby
        FAILING it, and the real implementation MUST NOT agree with it there.
      non_vacuity: >-
        This is the only form a curve-content-free null can take when the object
        under study is a curve, and it is exactly the right one. Inferring the
        automorphism order from j makes delta = 1 come out by construction for
        every curve, ordinary or not, and would silently pass the supersingular
        control as a failure.
      consequence_pre_declared: >-
        IF THE REAL IMPLEMENTATION AGREES WITH THE J-ONLY ORACLE EVERYWHERE,
        INCLUDING ON THE SUPERSINGULAR CONTROL, THEN THE IMPLEMENTATION IS
        READING NOTHING BUT THE J-INVARIANT, THE ENUMERATION IS A TAUTOLOGY, AND
        NOTHING FROM IT MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES - it
        would be a statement about a lookup table. Written before execution so it
        cannot be reframed afterwards.
    - id: NULL-BASECHANGE
      name: base-change sensitivity control
      construction: >-
        The defect for the same curve computed over the base field and over
        quadratic and cubic extensions, with the automorphism group and the
        splitting field RECOMPUTED at each rather than inherited.
      forced_value: delta = 1 in all cases for ordinary curves
      non_vacuity: >-
        Capable of failing on a cached or inherited computation, which is the
        cheapest way for the code to look correct while never asking about the
        field it was given.
    - id: NULL-REPLACEMENT
      name: replacement discriminating null, inside the declared scope
      construction: >-
        Ordinary curves with a small-degree but NON-INVERTIBLE endomorphism and
        automorphism group of order 2, on which no discount is predicted. This is
        the object that must now carry the discriminating load the empty cell was
        assigned.
      forced_value: >-
        Collision-search step-count ratio 1.00 within the frozen seed band.
      non_vacuity: >-
        Capable of failing, and its failure is decisive - a discount there would
        mean the discount does not require INVERTIBILITY, which invalidates the
        replacement control's discriminating power and requires a redesign before
        any special-j reading.
    - id: CONTROL-CERTIFICATE
      name: independent automorphism certificate
      construction: >-
        Every claimed automorphism re-verified as a curve isomorphism by code
        sharing no state with the producer - the map applied to sampled points,
        images checked to lie on the curve, and the composition table checked to
        be a group.
      forced_value: verification fraction exactly 1.0
      non_vacuity: >-
        The question's own constraint requires an independent certificate; a
        producer-verified automorphism is not one.

  scope_gate: >-
    See NULL-JONLY consequence_pre_declared. The gate is evaluated and reported
    BEFORE any ordinary result is interpreted, and its verdict is printed on the
    face of every quoted number.

  independent_variables: [prime, curve_index, ordinary_or_supersingular, base_field_degree, oracle_or_real]

  preregistered_prediction:
    quantity: delta over the full ordinary enumeration, and delta on the supersingular control
    formula: >-
      delta equals the geometric automorphism group order divided by the
      base-field-rational automorphism group order, both computed by exhibiting
      automorphisms explicitly. For an ordinary curve the endomorphism ring is
      commutative and contains Frobenius, so the rationality criterion -
      commutation with Frobenius - is automatic and delta is forced to 1.
    source: ledger/hypotheses/H-ECDLP-66d6fc.yaml predictions P1 through P8
    values_frozen_here:
      bit_sizes: [7, 8, 9]
      prime_range: 64 to 512
      characteristic_excluded: [2, 3]
      ordinary_delta_required: exactly 1, zero exceptions
      supersingular_delta_required: strictly greater than 1 on at least one control curve
      third_family_count_required: exactly 0
      base_change_degrees: [1, 2, 3]
      replacement_null_ratio_required: 1.00 within the frozen seed band
      certificate_fraction_required: 1.0
      j_only_oracle_must_fail_supersingular_control: true

  decision_rule_that_falsifies: >-
    THE ALGEBRAIC STATEMENT IS FALSIFIED by a SINGLE ordinary curve with delta
    greater than 1. Because that would contradict a classical theorem, it FIRST
    INDICTS THE IMPLEMENTATION, and independent review is required before any
    description of the result.
    THE SCOPE FINDING IS FALSIFIED by a single curve satisfying every declared
    constraint of the question that also instantiates its third control family.
    THE SECOND SCOPE FINDING IS FALSIFIED by an odd prime of the declared degree
    set ramified in the second arm's maximal order.
    THE RUN IS INVALID, and no verdict of any kind may be reported, if the
    supersingular control returns delta = 1 - the apparatus cannot detect a
    rationality defect at all, the ordinary enumeration is marked
    attempted_and_inconclusive under GOAL-ENDO-001 pause condition P1, and IT IS
    NEVER REPORTED AS A FINDING ABOUT SUPERSINGULAR CURVES (BC4) - or if the real
    implementation agrees with the j-only oracle on that control, which makes the
    enumeration circular.
    NOTHING IN THIS RULE PERMITS A CLAIM ABOUT SUPERSINGULAR CURVES IN EITHER
    DIRECTION. The control decides only whether the instrument has dynamic range
    (BC2).
    IF THE CONTROL CANNOT BE RUN FOR AN UNRELATED REASON - infrastructure,
    budget, or no admissible control curve in the declared range - no verdict is
    reported at all and the contract is a DERIVATION with its experimental arm
    withdrawn.

  stages:
    - id: S0
      name: authorization record, control-availability check, prior-record confirmation
      terminates_run: true
      description: >-
        Record ruling R4 and its four binding conditions in the run artifacts,
        and confirm the control is AVAILABLE - at least one admissible
        supersingular control curve exists in the declared prime range. IF NO
        SUCH CURVE EXISTS, or the control cannot be run for an infrastructure or
        budget reason, the contract STOPS here and is reported as a DERIVATION
        ONLY with its experimental arm withdrawn; the ordinary enumeration is not
        run, because on its own it can only produce an unfalsifiable constant.
        Separately, confirm against the file itself the assumption text of the
        lane's prior proposal, which the authoring agent did NOT open; the
        consequence of the scope finding for that record rests on it.
    - id: S1
      name: supersingular positive control
      terminates_run: true
      description: >-
        CONTROL-S-SUPERSINGULAR with pre-registered expected values written
        before the run, and labelled a CONTROL in every artifact it writes (BC1).
        delta equal to 1 on every control curve ENDS the run under pause
        condition P1 - the ordinary enumeration is marked
        attempted_and_inconclusive and NO ordinary result is reported, and the
        outcome is recorded as an instrument failure and NOT as a finding about
        supersingular curves (BC4).
    - id: S2
      name: j-only oracle check
      terminates_run: true
      description: >-
        NULL-JONLY over the identical curve set. Agreement with the real
        implementation on the supersingular control ENDS the run; the arm is
        circular and produces no evidence about curves.
    - id: S3
      name: ordinary enumeration
      terminates_run: false
      description: >-
        Every curve of the standard shape over every prime in the declared range
        with characteristic not 2 or 3, up to base-field isomorphism, classified
        by the trace, with delta computed for every ordinary one. Cross-tabulate
        delta against j - and report BOTH delta AND the rational automorphism
        order per curve, because the observation-collision audit shows delta
        alone is a constant and carries nothing. Deduplicate by base-field
        isomorphism with a logged count of j-equal but inequivalent pairs. Report
        the splitting-field degree per curve so cells where the splitting field
        is the base field by coincidence are visible and excluded from the pooled
        statistic.
    - id: S4
      name: base change and ramified-prime table
      terminates_run: false
      description: >-
        NULL-BASECHANGE at the declared degrees, recomputing rather than
        inheriting. Separately, and needing NO CURVES AT ALL, tabulate the
        ramified primes of each arm's maximal order against the declared degree
        set.
    - id: S5
      name: replacement null
      terminates_run: false
      description: >-
        NULL-REPLACEMENT with matched collision-search ratios per seed, against
        the frozen band.
    - id: S6
      name: verdict
      terminates_run: false
      description: >-
        Apply the frozen decision rule, report the third-family count and both
        scope findings, and print the j-only scope-gate verdict on the face of
        the result.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 5
    seeds_per_cell: 5
    seeds_policy: >-
      THE ORDINARY ARM IS EXHAUSTIVE AND CARRIES NO SEEDS. Every curve over every
      prime in the declared range is enumerated up to base-field isomorphism, so
      there is no sampling and no seed dependence, and this is stated explicitly
      because an exhaustive enumeration and a sample support different claims.
      THE REPLACEMENT NULL'S collision-search runs ARE seeded, addressed by
      (curve_index, seed_index), with the seed derived deterministically as a
      SHA-256 over the ASCII bytes of the domain string, those fields, and the
      declared master seed, reduced to 64 bits. The domain string is
      EXP-ECDLP-fa2ed6/v1, and the seed band against which the ratio is scored is
      frozen in this contract before any execution. The master seed is fixed here
      and is never re-drawn. Point sampling used inside the certificate verifier
      is seeded from the same derivation under a distinct label.
    determinism_requirement: >-
      Re-running the ordinary enumeration must reproduce the identical per-curve
      delta, rational automorphism order and splitting-field degree. Any
      discrepancy is INVALID and indicts the implementation.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1
    note: >-
      Below the per-run wall-clock floor in templates/research-records.md, and
      the reason is stated - at 7 to 9 bits the exhaustive enumeration of all
      curves over all primes below the declared bound with an explicit
      automorphism search per curve is seconds to a few minutes on one core, and
      the ramified-prime table needs no curves and no compute at all. Sizing the
      per-run budget larger would not buy any work. The supersingular control is
      equally cheap; its cost was a SCOPE QUESTION, which ruling R4 has now
      settled, and never CPU.

  stopping_rules:
    - No admissible supersingular control curve exists in the declared range, or the control cannot be run for an infrastructure or budget reason -> STOP at S0; report a DERIVATION ONLY with the experimental arm withdrawn and the ordinary arm UNFALSIFIED. Never report an unfalsifiable constant as a verified negative.
    - delta equals 1 on every supersingular control curve -> STOP under GOAL-ENDO-001 pause condition P1. The instrument failed its two-directional control; the ordinary enumeration is marked attempted_and_inconclusive, never negative evidence; repair happens under a NEW contract. THIS IS AN INSTRUMENT FAILURE AND NOT A FINDING ABOUT SUPERSINGULAR CURVES (BC4).
    - The real implementation agrees with the j-only oracle on the supersingular control -> STOP, the enumeration is circular.
    - Any ordinary curve returns delta greater than 1 -> STOP, escalate for independent review BEFORE any description; a classical theorem is contradicted and the implementation is indicted first.
    - Certificate verification fraction below 1.0 -> STOP; the question's own constraint is unmet.
    - A measured discount appears on the replacement null -> STOP; the replacement control does not discriminate what it was chosen to discriminate and must be redesigned.

  invalidation_rules:
    - Any delta inferred from the j-invariant rather than computed by exhibiting automorphisms is invalid; it makes the result true by construction.
    - Any delta reported without the rational automorphism order alongside it is invalid; delta alone is a constant and carries nothing.
    - Any delta over an extension computed by inheriting rather than recomputing the automorphism group is invalid.
    - Any curve pooled into the ordinary statistic whose splitting field coincided with the base field by accident, without that coincidence being reported, is invalid.
    - Any enumeration that deduplicates without logging j-equal but base-field-inequivalent pairs is invalid; a twist-blind merge could hide an anomaly inside a merged row.
    - ANY STATEMENT OF A RESULT ABOUT SUPERSINGULAR CURVES DRAWN FROM THE SUPERSINGULAR CONTROL IS INVALID AND IS A CONTRACT VIOLATION (BC2). Its only admissible reading is instrument dynamic range, in either direction of its outcome.
    - Any artifact or evidence record that cites the supersingular control without labelling it a CONTROL is invalid (BC1).
    - Any ordinary-curve conclusion that cites the supersingular control as support for the ordinary VALUE, rather than as evidence that the instrument could have returned otherwise, is invalid (BC3).
    - Any reading of a supersingular control returning delta = 1 as a finding about curves, rather than as an instrument failure triggering pause condition P1, is invalid (BC4).
    - Any supersession or edit of RQ-ECDLP-912694 or of the lane's prior proposal under this contract is a scope violation; corrections travel as NEW records.
    - Any ECDLP, exponent or cryptographic-scale statement drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of - (a) ruling R4 and its four binding conditions recorded in the run
    artifacts, and the supersingular control confirmed available; (b) delta
    strictly greater than 1 on at least one supersingular control curve, matching
    the pre-registered expected values, and reported as INSTRUMENT DYNAMIC RANGE
    rather than as a result about those curves; (c) the j-only oracle failing
    that control while the real implementation does not; (d) delta exactly 1 on
    every ordinary curve in the exhaustive enumeration, with both delta and the
    rational automorphism order reported per curve and the splitting-field degree
    recorded; (e) delta 1 under recomputed base change at every declared degree;
    (f) the third-family count computed and the ramified-prime table produced;
    (g) the replacement null at ratio 1.00 within the frozen band; (h)
    certificate verification fraction exactly 1.0; (i) every artifact citing the
    supersingular control labelling it a CONTROL, and the ordinary conclusion
    citing it only as evidence the instrument could have returned otherwise.
    If the control is UNAVAILABLE for an infrastructure or budget reason, a
    completed DERIVATION-ONLY report with the experimental arm explicitly
    withdrawn is a SUCCESSFUL outcome of this contract; silently running the
    ordinary enumeration alone and reporting a constant is not.

  falsification_criterion: >-
    A single ordinary curve with delta greater than 1, or a curve satisfying all
    of the question's declared constraints that instantiates its third control
    family, or an odd prime of the declared degree set ramified in the second
    arm's maximal order. Any of these falsifies the corresponding statement; the
    first contradicts a classical theorem and therefore indicts the
    implementation first and requires independent review before description.
    Secondary falsifiers of the DESIGN rather than the statements - a
    supersingular control returning 1 (an INSTRUMENT failure under P1, never a
    finding about those curves), a circular j-only agreement, an inherited
    base-change computation, or a discount on the replacement null. In every case
    the failing curve, prime and control are named, and forward guidance names
    the two classes that remain open - supersingular special-j curves, where the
    defect genuinely exists but which stay OUTSIDE THIS QUESTION'S CLAIM SPACE
    under constraint 1, being admitted here only as a control and never as a
    subject; and ordinary curves with cheap non-invertible endomorphisms, where
    the invertibility question is live inside the declared scope.

  required_artifacts:
    - ruling R4 and its four binding conditions BC1-BC4, recorded verbatim in the run artifacts, with the control-availability check
    - a labelling audit showing every artifact and every statement citing the supersingular control names it a CONTROL and states no result about supersingular curves
    - per ordinary curve - rational automorphism group order, geometric order, delta, j, trace, ordinary verdict, and splitting-field degree
    - the explicit automorphisms exhibited per curve, not merely their count
    - delta on every supersingular control curve, against the pre-registered expected values written before the run
    - the j-only oracle's output on every curve including the control, beside the real implementation's
    - delta under recomputed base change at every declared degree
    - the third-family instantiation count with the enumeration that produced it
    - the ramified-prime table for both arms against the declared degree set
    - the replacement null's ratios per seed with the frozen band
    - the automorphism certificate verifier's transcript and its verification fraction
    - the deduplication log of j-equal but base-field-inequivalent pairs
    - the confirmed assumption text of the lane's prior proposal, quoted from the file
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      7 to 9 bits, exhaustively enumerated rather than sampled. THE ENUMERATION
      TRANSFERS NOTHING to cryptographic prime sizes; only the DERIVATION is
      claimed uniform, and the derivation is what a reviewer must check.
    correspondence: null

  limitations:
    - >-
      THE SUPERSINGULAR ARM IS A CONTROL AND NOT A SUBJECT. It is permitted
      under ruling R4 because RQ-ECDLP-912694 constraint 1 bounds the claim space
      and constraint 4 contemplates out-of-scope cells serving as controls. NO
      RESULT ABOUT SUPERSINGULAR CURVES MAY BE STATED FROM IT in either direction
      of its outcome; its only admissible reading is instrument dynamic range,
      and the ordinary conclusion cites it only as evidence that the instrument
      could have returned otherwise.
    - >-
      A supersingular control returning delta = 1 is an INSTRUMENT FAILURE under
      GOAL-ENDO-001 pause condition P1, not a finding about supersingular curves.
      This is stated separately and prominently because it is the case most
      likely to be misread later.
    - >-
      If the control cannot be run for an infrastructure or budget reason, the
      contract stands as a DERIVATION with its positive control unavailable and
      must SAY SO rather than quietly report an unfalsifiable constant. That
      fallback is retained from the original design and is unchanged by the
      ruling.
    - >-
      The algebraic statement is RECALLED classical mathematics reproduced in
      full so it can be checked without a library. It is a DERIVATION, and the
      enumeration verifies the IMPLEMENTATION over a finite range rather than the
      theorem.
    - >-
      Characteristic 2 and 3 are excluded. The commutativity argument is
      characteristic-free for ordinary curves, but the numerology of the
      replacement design is not, and nothing here certifies anything in those
      characteristics.
    - >-
      NO ECDLP CLAIM OF ANY KIND. No exponent moves, no constant moves, no
      attack. The deliverable is an evidential correction and a control redesign.
    - >-
      The scope findings are claims about a COMMITTED record's text as of the
      read recorded in the hypothesis. If that question is later superseded with
      corrected scope, they become historical statements about it as of that
      date.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, AND THE LIMITATION RUNS THE OTHER WAY FROM
      USUAL - the enumeration at 7 to 9 bits transfers nothing upward, and it is
      the DERIVATION, not the enumeration, that carries the general claim. This
      is stated plainly rather than glossed by calling the enumeration
      confirmatory.
    - >-
      Nothing here bears on any standardised curve as a cryptographic target. It
      bears on how this program's experiments about them are controlled.
    - >-
      Changes no record's status, and creates no supersession.

  infrastructure_failure_disposition: >-
    A timeout, crash or missing dependency is INFRASTRUCTURE SIGNAL, recorded as
    failed_infrastructure with its cause and coverage. It is NEVER negative
    mathematical evidence (AGENTS.md core rule 5). Supersingular curves at these
    sizes are few and their endomorphism structures are awkward, which is exactly
    why the supersingular CONTROL is specified to require only delta rather than
    a full endomorphism ring - so that its cost stays low and its failure mode
    stays legible. Note the distinction that BC4 turns on - an infrastructure
    failure that PREVENTS the control from running is handled here and leads to
    the derivation-only fallback, whereas a control that RUNS and returns delta =
    1 is an instrument failure under pause condition P1. Neither is ever a
    finding about supersingular curves.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1), and RULING R4 IS A SCOPE RULING, NOT AN APPROVAL - it settles that
    the supersingular control MAY be run as a control, and it does not authorize
    execution of this contract or of anything else. Written under
    TASK-20260904-c0edda, which is DESIGN ONLY. It supersedes no contract, edits
    no committed record and alters no goal.
  amendment_note: >-
    v1 as first drafted required a Coordinator scope decision before the
    supersingular control could run, and specified a DERIVATION-ONLY fallback if
    that decision were refused. Ruling R4 granted it, as a CONTROL only. This
    contract was revised in place under the same design task and before any
    archive, so no committed record is edited and no supersession is required.
    What changed - the control is authorised and relabelled
    CONTROL-S-SUPERSINGULAR; an arm_s_authorization block records R4, its basis
    and its four binding conditions BC1-BC4; BC1-BC4 are enforced through the
    stopping, invalidation and success rules; a delta = 1 outcome on the control
    is now explicitly an instrument failure under GOAL-ENDO-001 pause condition
    P1 with existing measurements marked attempted_and_inconclusive rather than
    merely VOID; and the derivation-only fallback is retained, re-scoped from a
    refused decision to an unavailable control.
