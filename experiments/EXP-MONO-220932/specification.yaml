# =============================================================================
# EXP-MONO-220932 — version 1, approved by DEC-20261005-e74c17.
# Frozen census of the signed-sum monodromy image on four ordinary curves at
# p = 101. Prediction (order 8 wreath versus a proper subgroup) is fixed here,
# before any run. This design session computed no Frobenius permutation.
# Source idea IDEA-20261005-ddbf31 lives on ideas/domain-bridges-20261005
# (pull request 1836) and is not copied into this branch.
# =============================================================================
experiment:
  id: EXP-MONO-220932
  hypothesis_id: H-MONO-9df9c0
  question_id: RQ-MONO-001
  source_idea: IDEA-20261005-ddbf31
  goal_id: null
  version: 1
  title: >-
    Toy census at p=101 of the monodromy image of the four signed sums over
    the symmetric base: order-8 wreath in S_4, or a proper subgroup
  status: approved
  approved_by: DEC-20261005-e74c17
  approved_at: '2026-10-05'
  packaging_only: false
  approval:
    approved_by: DEC-20261005-e74c17
    composing_decision: DEC-20261005-e74c17
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that the image equals the wreath group.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide, on a pinned panel of four ordinary curves at p = 101, whether the
    Frobenius permutations of Psi = {P+Q, -(P+Q), P-Q, -(P-Q)} generate the
    wreath group W of order 8 or a proper subgroup of W, or whether some
    permutation leaves W. The assignment of each observation to a reading is
    the table mechanism_assignment. A failed control or an inertia
    disagreement is inconclusive.

  inputs:
    prime: 101
    m: 3
    model: short Weierstrass y^2 = x^3 + A*x + B over F_101
    base_field:
      polynomial: z^2 + 2
      note: >-
        z^2 + 2 is irreducible over F_101 because the discriminant of
        z^2 + 2 is -8 and the Legendre symbol (-8 / 101) = -1. Elements are
        a + b z with a, b in {0, ..., 100}.
    frobenius: >-
      The primary permutation is the p^2-power map on coordinates. A
      specialization with both imaginary parts zero is also recorded under
      the p-power map, in a separate column, and those p-power permutations
      are not mixed into the primary generating set.
    panel_rule: >-
      Ordinary curves are the first four pairs (A, B) in lexicographic order
      with A from 1 to 100 and B from 1 to 100, skipping singular curves
      (4 A^3 + 27 B^2 ≡ 0 mod 101) and skipping trace-zero curves. Trace is
      minus the sum of Legendre symbols of f(x). j ≡ 0 iff A = 0 and
      j ≡ 1728 (mod 101) iff B = 0, so this scan already excludes the
      artifact j-invariants. The four pairs below were obtained by executing
      this rule at design time, including a full point count. That count is
      a pin, not a monodromy run. The executor recomputes point counts and
      j and halts, as failed_infrastructure, if any pin disagrees.
    curves:
      - id: ordinary-1
        A: 1
        B: 1
        trace: -3
        point_count: 105
        j_mod_p: 34
        role: ordinary_panel
      - id: ordinary-2
        A: 1
        B: 2
        trace: 2
        point_count: 100
        j_mod_p: 4
        role: ordinary_panel
      - id: ordinary-3
        A: 1
        B: 3
        trace: 15
        point_count: 87
        j_mod_p: 93
        role: ordinary_panel
      - id: ordinary-4
        A: 1
        B: 4
        trace: 4
        point_count: 98
        j_mod_p: 14
        role: ordinary_panel
      - id: artifact-j0
        A: 0
        B: 1
        trace: 0
        point_count: 102
        j_mod_p: 0
        role: artifact_panel
        note: supersingular because 101 ≡ 2 (mod 3); excluded from the ordinary tally
      - id: artifact-j1728
        A: 1
        B: 0
        trace: 2
        point_count: 100
        j_mod_p: 11
        role: artifact_panel
        note: j ≡ 1728 (mod 101); ordinary with extra automorphisms; excluded from the ordinary tally
    rng_pin:
      implementation: CPython random.Random.randrange(101)
      version_that_produced_the_pin: 3.12.8
      specialization_seed: 20261005
      null_seed: 20261006
      specialization_first_eight_raw_draws:
        - [35, 69, 37, 51]
        - [19, 12, 70, 66]
        - [2, 11, 14, 91]
        - [36, 68, 36, 94]
        - [56, 82, 52, 75]
        - [90, 48, 29, 1]
        - [19, 46, 51, 47]
        - [37, 48, 35, 37]
      null_first_four_raw_draws:
        - [63, 10, 86, 36]
        - [36, 65, 25, 100]
        - [71, 29, 67, 80]
        - [67, 90, 69, 96]
      note: >-
        Each draw is four calls of randrange(101), in the order
        (e1_a, e1_b, e2_a, e2_b) for the specialization stream and
        (a, b, c, d) for the null quartic X^4 + a X^3 + b X^2 + c X + d.
        The executor reproduces these tuples before any curve arithmetic.
        A mismatch halts the run as failed_infrastructure. Substituting a
        different generator is forbidden.

  controls:
    - id: input-fibre
      statement: >-
        On the same accepted specializations used for Psi, permute the four
        points of E lying over the unordered pair, namely the four sign
        combinations of the two summands. The draw is inconclusive for a
        curve if that control shows fewer than 8 distinct permutations.
      pass_condition: 8 distinct permutations on that curve
      on_fail: >-
        Redraw that curve once, continuing the same specialization stream
        until 256 good specializations, and rescore both fibres on those 256.
        A second miss stops the image reading for the whole panel as
        inconclusive. Do not redraw a second time. Do not add curves.
    - id: null-quartic
      statement: >-
        Frobenius on the roots of random monic separable quartics over F_101,
        sample size 64, seed 20261006. Separable means gcd(f, f') = 1 in
        F_101[X]. The draw is inconclusive if none of the 64 has cycle type
        3+1.
      pass_condition: at least one element of cycle type 3+1
      on_fail: >-
        The panel reading is inconclusive. There is no redraw of the null
        sample. A 2-group stuck sampler would otherwise certify a wreath
        image for free, because W is a 2-group and has no 3-cycle.
    - id: artifact-panel
      statement: >-
        artifact-j0 and artifact-j1728 are run at the same sample size and
        written to their own rows. They are excluded from the ordinary tally
        and cannot by themselves establish an ordinary exceptional locus.
    - id: inertia-agreement
      statement: >-
        On ordinary-1, and on every ordinary curve whose Frobenius group
        order is not 8, compute tame inertia along the first transverse line
        in the frozen list and compare order and cycle-type inventory with
        the Frobenius subgroup on that same curve.
      pass_condition: same group order and the same number of elements of each cycle type
      on_fail: >-
        Withhold the group-order reading. Do not score the disagreement as
        a proper subgroup. A partition-breaking permutation remains a
        non-containment result even when this check fails, because that
        check is internal to one fibre.

  independent_variables:
    - curve identity inside the pinned panel (A, B)
    - good specialization (e1, e2) in F_{101^2}
    - which fibre is scored (Psi versus the input fibre), on matched specializations

  metrics:
    primary:
      - id: psi_group_order
        statement: >-
          Order of the subgroup of S_4 generated by the p^2-power Frobenius
          permutations of Psi, one integer per curve.
      - id: psi_has_4_cycle
        statement: >-
          Whether that generated subgroup contains an element of cycle type 4,
          one boolean per curve.
      - id: psi_preserves_partition
        statement: >-
          Whether every scored Psi permutation preserves the inverse-pair
          partition (the two pairs of points that share an x-coordinate),
          one boolean per curve.
    secondary:
      - id: input_fibre_distinct_permutations
        statement: Number of distinct input-fibre permutations on the scored sample, per curve.
      - id: null_emitted_3_plus_1
        statement: Whether the null quartic sample contains cycle type 3+1.
      - id: inertia_agrees
        statement: >-
          Whether the inertia subgroup and the Frobenius subgroup agree in
          order and cycle-type inventory, per curve where inertia is required.
      - id: sample_size_used
        statement: 64 or 256, per curve.
      - id: fp_specialization_count
        statement: >-
          How many scored specializations have both coordinates in F_101,
          and the order of the subgroup generated by their separate p-power
          permutations. Absence of such specializations is reported and is
          not a drop in the image.

  heuristic_under_test: >-
    none. The primary question is the image of rho_sym. H1 and H2 are
    instrument gates. Their failure makes the run inconclusive and is not
    a distributional validation of Chebotarev.

  preregistered_prediction:
    quantity: >-
      The order of the group generated by Frobenius on Psi, and whether that
      group is the full wreath or a proper subgroup.
    formula: >-
      |W| = 8 for W = (Z/2) wr S_2, the setwise stabiliser in S_4 of a
      partition into two pairs. The pre-registered positive side is order
      exactly 8, partition preserved, and at least one 4-cycle. The
      pre-registered negative side is order dividing 4 with the partition
      preserved, or any permutation that breaks the partition.
    source: >-
      IDEA-20261005-ddbf31 predictions and falsification_conditions, copied
      before any run of EXP-MONO-220932. This design session did not adjust
      the split after seeing monodromy data, because it computed none.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are p = 101, m = 3, and four ordinary curves
      plus two artifact curves. A result at this prime is not a result at
      cryptographic size, at another prime, or at m >= 4. No extrapolation
      is authorized.
    correspondence: >-
      Direct sampling of specializations on the pinned curves. No Deuring
      correspondence and no other sampling equivalence is used.

  tail_checks:
    - >-
      Input-fibre control: 8 distinct permutations at N = 64, or at the one
      redraw N = 256. This is the instrument tail. Expected count of each
      group element, if the control group has order 8 and the sample is
      uniform, is N/8, which is 8 at N = 64 and 32 at N = 256.
    - >-
      Null quartic: at least one cycle type 3+1 in 64 separable samples.
      In S_4 the 3-cycles form a positive-density class (8 elements of cycle
      type 3+1 out of 24). Missing that class is the sampler-failure tail,
      not a feature of W.

  replication:
    seeds:
      - name: specialization_stream
        algorithm: CPython random.Random.randrange(101)
        seed: 20261005
      - name: null_quartic_stream
        algorithm: CPython random.Random.randrange(101)
        seed: 20261006
    independent_instances: 4
    independent_instances_note: >-
      The four ordinary curves are the independent instances of the image
      claim. The two artifact curves are controls.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2
    maximum_memory_gb: 2
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). They do not cap the frozen sample
      counts. maximum_runs is 2 so one infrastructure retry may take a new
      run id. The scientific sample size is 64 good specializations per
      curve, with at most one redraw to 256 on a curve whose input-fibre
      control missed. Expiry of the watch is failed_infrastructure, never a
      negative mathematical result.

  procedure:
    sampling: >-
      Seed random.Random(20261005) once. Curves are consumed in the order
      ordinary-1, ordinary-2, ordinary-3, ordinary-4, artifact-j0,
      artifact-j1728, without reseeding. For each curve, draw
      (e1_a, e1_b, e2_a, e2_b) by four randrange(101) calls and set
      e1 = e1_a + e1_b z, e2 = e2_a + e2_b z. Keep the draw only when it
      is good, until 64 good draws, or until 256 if this curve's input-fibre
      control missed at 64. Stop the curve as inconclusive if 10000 draws
      do not yield the required number of good specializations. That cap
      is an instrument failure, not a small image.
    good_specialization: >-
      Let d = e1^2 - 4 e2. Drop the draw if d = 0. Otherwise let t1, t2 be
      the two roots of T^2 - e1 T + e2 in a quadratic extension of F_{101^2}.
      Let s1 be a chosen square root of f(t1) and s2 a chosen square root of
      f(t2); if either value is not a square, drop the draw. Set P = (t1, s1)
      and Q = (t2, s2). Using the chord-and-tangent formulas, compute
      x(P+Q), y(P+Q), x(P-Q), and y(P-Q). Psi is those two points and their
      inverses. Drop the draw if any denominator vanishes, if any of the four
      sums is the point at infinity, or if the four points are not distinct.
      Dropped draws are counted and then discarded. They are not scored as
      permutations.
    labelling: >-
      Build a deterministic tower by always adjoining the lexicographically
      smallest irreducible factor of least degree, coefficients in
      {0, ..., 100}, low degree first. Represent each field element by its
      coefficient tuple in the resulting power basis. Order points by (x, y)
      lexicographically. Labels are 0, 1, 2, 3 in that order. The Frobenius
      permutation sends label i to the label of the image of that point.
    partition_check: >-
      On each scored fibre the blocks are the two pairs of points with equal
      x-coordinate. A permutation preserves the partition when it sends each
      block to a block. This comparison does not use a labelling shared
      across fibres.
    group: >-
      Close the set of scored permutations under composition inside S_4.
      Record the order, the cycle-type inventory, and whether a 4-cycle
      occurs. S_4 has 24 elements, so the closure is exhaustive.
    null_quartic: >-
      Seed a separate random.Random(20261006). Draw (a, b, c, d) by four
      randrange(101) calls. Keep f = X^4 + a X^3 + b X^2 + c X + d when
      gcd(f, f') = 1, until 64 separable quartics or 10000 draws. Label
      roots by the same sorting rule in the splitting field of f over F_101
      and record the p-power Frobenius permutation. Exceeding 10000 draws
      is failed_infrastructure.
    inertia: >-
      Required on ordinary-1, and also on each ordinary curve whose primary
      group order is not 8, before that curve may be scored as a proper
      subgroup. Lines, tried in order until the discriminant below is not
      identically zero and has a simple root: e2 = 1, e2 = 2, e2 = 3,
      e2 = 4, e2 = 5, with line parameter t = e1. Encoding coefficient beta
      is the smallest integer in 1..20 such that the four values
      x(R) + beta y(R) are generically distinct. Let P(X) be the monic
      degree-4 polynomial over F_101(t) with those roots, cleared of
      denominators to a primitive polynomial in F_101[t][X]. Let Delta(t)
      be its discriminant. At each simple root r of Delta, if the
      ramification index is divisible by 101, record the place as wild and
      do not use it as a generator. Otherwise the inertia generator is the
      permutation of the four points induced by u -> zeta u on a Puiseux
      parameter u^e = t - r. Generate the subgroup of those tame inertia
      elements. Compare its order and its cycle-type inventory with the
      Frobenius subgroup of the same curve. Literal equality of written
      permutations is not required: the Frobenius sample is labelled by
      sorting each fibre, and the inertia sample is labelled by continuation
      along the line. If no beta and no line produce a usable simple root,
      the order reading is withheld.
    mechanism_assignment:
      - observation: >-
          All four ordinary curves have Psi group order 8, the partition
          preserved, a 4-cycle present, the input-fibre control at 8 distinct
          permutations, the null quartic emitting cycle type 3+1, and inertia
          agreeing on ordinary-1.
        assigns_to: >-
          Full wreath W on this panel. Falsifies an exceptional ordinary
          curve inside the panel. Does not prove the image equals W for
          every ordinary j.
      - observation: >-
          All four ordinary curves have Psi group order dividing 4, the
          partition preserved, both controls passing, and inertia agreeing
          on ordinary-1 and on each of the four curves.
        assigns_to: >-
          Proper subgroup of W, uniformly on this panel. Falsifies the
          full-wreath reading on this panel.
      - observation: >-
          At least one ordinary curve has order 8 and at least one has order
          dividing 4, both controls passing, and inertia agreeing on
          ordinary-1 and on every curve scored as order dividing 4.
        assigns_to: exceptional locus inside the panel
      - observation: >-
          At least one scored Psi permutation does not preserve the
          inverse-pair partition.
        assigns_to: >-
          The image is not contained in W. This assignment does not require
          the inertia check.
      - observation: >-
          Input-fibre control still below 8 distinct permutations after the
          redraw, or the null quartic emits no cycle type 3+1, or inertia
          disagrees, or the draw cap is hit, or the runtime watch expires.
        assigns_to: >-
          Inconclusive. Not evidence for the wreath reading and not evidence
          for a proper subgroup.

  stopping_rules:
    - Stop when every pinned curve has its scored sample, both controls have their pass or fail bit, and every required inertia comparison is recorded.
    - Do not add a curve, a prime, a sample size above 256, or a second redraw.
    - The redraw to 256 is mandatory on a curve whose input-fibre distinct count is below 8 at N = 64, and forbidden on a curve that already shows 8.
    - Watch expiry, the 10000-draw cap, and a pin mismatch stop the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, missing dependency, or pin mismatch is failed_infrastructure and is not evidence against the hypothesis.
    - Scoring a specialization with fewer than four distinct Psi points invalidates the run.
    - Mixing p-power permutations into the p^2-power generating set invalidates the run.
    - Using any curve other than the six pinned curves invalidates the run.
    - An order reading reported when inertia disagrees, or when a required inertia comparison is absent, is invalid.
    - Group order 8, partition preserved, and no 4-cycle, is a bug in the S_4 closure: the full setwise stabiliser contains 4-cycles. That row is invalid, not a new group.
    - A group that preserves every block and whose order does not divide 8 is a labelling contradiction. The order reading is invalid and the run is inconclusive.
    - Changing the pre-registered prediction after seeing permutations is forbidden. A correction is a new amendment record, and existing runs are not re-scored against it.

  success_criterion: >-
    The run is a success for the full-wreath reading exactly when the first
    row of mechanism_assignment holds: all four ordinary curves have Psi
    group order 8, partition preserved, a 4-cycle present, input-fibre
    control at 8 distinct permutations, null quartic emitting cycle type
    3+1, and inertia agreeing on ordinary-1. Any other completed assignment
    is not this success.

  falsification_criterion: >-
    The full-wreath reading on this panel is falsified when the second row
    of mechanism_assignment holds (order dividing 4 on every ordinary curve,
    controls passing, inertia agreeing). Containment in W is falsified when
    the fourth row holds (a partition-breaking permutation). The third row
    falsifies uniformity of the image on the panel. The fifth row falsifies
    nothing.

  required_artifacts:
    - experiments/EXP-MONO-220932/runs/RUN-*/manifest.yaml
    - experiments/EXP-MONO-220932/runs/RUN-*/stdout.txt
    - experiments/EXP-MONO-220932/runs/RUN-*/stderr.txt
    - experiments/EXP-MONO-220932/runs/RUN-*/raw-result.json
    - experiments/EXP-MONO-220932/runs/RUN-*/permutations.jsonl
    - experiments/EXP-MONO-220932/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      Per curve: sample size used, draws consumed, draws dropped, group
      order, cycle-type inventory, has_4_cycle, preserves_partition,
      input-fibre distinct count, inertia order and cycle-type inventory
      when required, and the separate F_101 p-power count. Plus the null
      quartic boolean and the rng pin check.
    verdict.yaml: >-
      Exactly one assignment row from mechanism_assignment, or
      failed_infrastructure with a reason. The verdict quotes the row. It
      does not change hypothesis status.
    permutations.jsonl: >-
      One record per scored specialization: curve id, (e1, e2) coefficients,
      the permutation in one-line notation, whether it preserves the
      partition, and the fibre name (psi or input).

  assigned_to: executor
  zero_runs_in_design: true
