experiment:
  id: EXP-VOLC-e47191
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-cbe8c1
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'RATIONAL FULL ell-TORSION IS EXACTLY A NON-FLOOR CONDITION IN THE ell-VOLCANO: E(F_p)[ell]
    = (Z/ell)^2 if and only if ell | (m-1) and ell * f_E | c, so descending to the ell-floor DESTROYS
    the rational ell-torsion that a translation-symmetrized factor base needs -- routing a depth effect
    through R5 into an R1 cost, with a three-way discriminator (step at the floor vs gradient in depth
    vs flat) and an explicit cofactor budget against rho'
  status: draft
  objective: "(A) THE EXACT CRITERION, DERIVED HERE. Let E/F_p be ordinary, t its trace, t^2 - 4p\
    \ = c^2 D_K with D_K fundamental, K = Q(sqrt(D_K)), omega = (D_K + sqrt(D_K))/2, so O_K = Z[omega]\
    \ and Z[pi] = Z[c omega]. Write pi = m + c omega with m = (t - c D_K)/2 in Z. Let End(E) = O_f\
    \ = Z[f omega] with f | c; the level of E in the ell-volcano is v_ell(f) and the volcano height\
    \ is v_ell(c) (Kohel). For ordinary E, E(F_p) is isomorphic to O_f / (pi - 1) O_f as an O_f-module,\
    \ and pi - 1 = (m - 1) + c omega. Hence\n  E(F_p)[ell] = (Z/ell)^2\n    <=>  (pi - 1)/ell = (m-1)/ell\
    \ + (c/ell) omega  lies in  Z[f omega]\n    <=>  ell | (m - 1)   AND   ell * f | c.\nThe FIRST\
    \ condition is CLASS-FIXED: it depends only on t, c, D_K, hence is the same for every curve in\
    \ the F_p-isogeny class. The SECOND condition is exactly \"v_ell(f_E) < v_ell(c)\", i.e. E IS\
    \ NOT AT THE FLOOR OF THE ell-VOLCANO. Therefore, in any class with ell | (m-1) and ell | c:\n\
    \  FULL RATIONAL ell-TORSION IS PRESENT AT EVERY LEVEL EXCEPT THE FLOOR,\n  AND ABSENT AT THE\
    \ FLOOR.\nNote the shape: this is a STEP at the bottom, not a gradient in depth. That shape is\
    \ the proposal's primary discriminator and it is stated before any measurement.\n(B) WHY THIS\
    \ IS ADMISSIBLE WHERE ALMOST NOTHING IN THIS LANE IS. The resource is R5 -- ell-torsion for ell\
    \ != N as a Galois/End module -- and it is consumed OUTSIDE G. Nothing here applies an endomorphism\
    \ to a point of G, so H-ENDO-001 does not bite; nothing here is an oracle returning group elements,\
    \ so KN-FIND-b7e091's GGM simulation does not bite; and IDEA-20260807-5cabfc's vertical transport\
    \ closure explicitly does not bite, because the measured cost functional is a Groebner/relation-collection\
    \ cost on x-COORDINATES (R1) and does not factor through the abstract triple. This is, as far\
    \ as this lane's own analysis goes, the UNIQUE place where the volcano level is coupled to something\
    \ the attack can read: the level IS a statement about ell-power torsion, and R5 at the SAME ell\
    \ is the only resource that reads it directly rather than through a proxy.\n(C) THE COUPLING TO\
    \ AN ATTACK COST, STATED AS THIS RECORD'S OWN MECHANISM. Let T in E(F_p) have order ell and let\
    \ V be a factor base stable under the translation P -> P + T. For a decomposition R = P_1 + ...\
    \ + P_m with all P_i in V, the map (P_1, P_2) -> (P_1 + T, P_2 - T) preserves the sum and stays\
    \ inside V. The solution variety of the decomposition system therefore carries a free action of\
    \ (Z/ell)^(m-1), so the ideal has ell^(m-1) times as many solutions as its quotient, and the system\
    \ can in principle be descended to the quotient. Full rational ell-torsion (rank 2) gives TWO\
    \ independent such shifts, i.e. an action of ((Z/ell)^2)^(m-1) available only OFF the floor; a\
    \ single rational point of order ell (rank 1) gives one. So the available symmetrization group\
    \ is a step function of the level. This mechanism is derived in this record and is NOT attributed\
    \ to any paper.\n(D) THE HONEST CEILING, STATED BEFORE THE EXPERIMENT. Quotienting by a group\
    \ of order ell^(m-1) divides the degree of the ideal by ell^(m-1). For fixed small ell and m this\
    \ is a CONSTANT FACTOR, not an exponent, and this record does not claim otherwise. The only way\
    \ it could become an exponent is by taking ell large -- and the criterion in (A) forces ell^2\
    \ | #E(F_p), so a large ell means a large cofactor, hence a smaller prime subgroup N ~ p/ell^2,\
    \ hence a rho cost of only 0.886 sqrt(p)/ell. THE COFACTOR BUDGET IS THE DELIVERABLE: rho gains\
    \ a factor ell from the same cofactor that the symmetrization gains ell^(m-1) from, and the two\
    \ must be compared in one charged cost model. Computing where (if anywhere) that crossover lies\
    \ is a quantitative question with a definite answer, and answering it is worth more than the toy\
    \ speedup.\n(E) THE SCOPE LIMIT, WHICH IS ITSELF A RESULT. The criterion needs ell | (m-1) and\
    \ ell | c, which together force ell^2 | #E(F_p). FOR A PRIME-ORDER CURVE (cofactor 1) THE MECHANISM\
    \ IS EMPTY AT EVERY ell AND AT EVERY LEVEL: E(F_p) is cyclic of prime order, so E(F_p)[ell] is\
    \ trivial for every ell != N, at the crater and at the floor alike. secp256k1, P-256 and every\
    \ cofactor-1 standardized curve are therefore untouched by this mechanism, and the honest headline\
    \ of a confirming experiment would be \"COFACTOR DIVISIBILITY BY ell^2 IS EXACTLY THE RESOURCE\
    \ THAT MAKES ell-VOLCANO DEPTH VISIBLE IN THE RATIONAL GROUP STRUCTURE\" -- a scoping statement\
    \ about which curves could ever have a depth effect, not an attack."
  resource_label: R5 (ell-torsion for ell != N as a Galois/End module), consumed into an R1 cost functional
  admissibility: admissible
  admissibility_argument: 'The resource consumed is E(F_p)[ell] for ell != N, which lies OUTSIDE G:
    G has prime order N and ell != N, so G intersect E[ell] = {O}. No endomorphism is applied to any
    point of G, so H-ENDO-001''s scalar collapse does not apply. The measured functional is the cost
    of a Groebner computation on a polynomial system in x-COORDINATES (R1), which returns field data
    rather than group elements and is therefore not generic-group-simulable in the sense of KN-FIND-b7e091.
    Finally, and critically for this lane, the functional does NOT factor through the abstract triple
    (G, P, Q), so IDEA-20260807-5cabfc''s vertical transport closure leaves it open by construction.
    All three admissibility filters are passed for stated reasons rather than by assertion.'
  reachability_gate: "T5 PASSES, AND THIS IS THE RARE LANE WHERE IT DOES. The good object here is\
    \ \"any non-floor vertex of the ell-volcano\", which is not a SPECIFIED curve but a LOCALLY DETECTABLE\
    \ PROPERTY -- exactly case (ii) of the DECOMPOSITION's T5 dichotomy. Two independent cheap routes:\
    \ (R-a) ASCEND. From any vertex, the ascending ell-isogeny is identifiable by\n  Fouquet-Morain\
    \ walking (try each of the <= ell+1 neighbours, walk down h\n  steps, the one that does not dead-end\
    \ is the ascent). Cost O(ell * h) Velu\n  steps per level, and h = v_ell(c) <= log_ell(2 sqrt(p)),\
    \ so reaching the\n  crater from anywhere costs O(ell * log^2 p) isogeny computations.\n(R-b)\
    \ TEST LOCALLY. Off-floor is detected in ONE step by counting rational\n  ell-isogenies: ell+1\
    \ off the floor, 1 at the floor (for h >= 1). No global\n  address is needed.\nMoreover the volcano\
    \ height itself is computable WITHOUT FACTORING: v_ell(c) = floor(v_ell(t^2 - 4p) / 2) for odd\
    \ ell (see IDEA-20260807-3c6bd8). So the entire reachability question for this lane is polynomial,\
    \ and a negative result here cannot be blamed on unreachability. The one cost that is NOT free\
    \ is the transport itself, which is O(h) Velu steps and therefore also polynomial."
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): read faugere_huot_joux_renault_vitse_2014_symmetrized
      and write a KN-LIT record. If it already contains the level criterion of (A), this record is
      downgraded to `duplicate` and the remaining value is the cofactor budget. STAGE 1 (minutes):
      class selection arithmetic of Step 1 plus the density measurement. Pure integer arithmetic,
      no curves. STAGE 2 (hours): volcano construction and level labelling at ell in {2, 3}, p ~ 2^12
      to 2^14, with the instrument''s own controls passing. STAGE 3 (minutes, HARD GATE): verify the
      criterion in (A) on every vertex. A counterexample halts everything. STAGE 4 (hours to days):
      the Semaev measurement across levels with all four nulls on the identical pipeline. STAGE 5
      (zero compute): the cofactor budget and the E1/E2/E3 verdict.'
    mechanism: 'STEP 1 -- CLASS SELECTION (pure arithmetic, seconds). At toy scale p ~ 2^12 to 2^16,
      enumerate traces t; for each, compute D = t^2 - 4p, factor it (feasible at toy scale), get D_K
      and c; compute m = (t - c D_K)/2. KEEP classes satisfying, for ell in {2, 3, 5}: ell | c (so
      the volcano has height >= 1) AND ell | (m - 1) (so the criterion in (A) can fire). RECORD the
      rejected fraction: it is a measurement of how rare the whole mechanism''s precondition is, and
      that number is a deliverable by itself.

      STEP 2 -- BUILD THE VOLCANO AND LABEL LEVELS. Using the instrument of IDEA-20260807-b1b604:
      for each curve, count F_p-rational ell-isogenies via the ell-division polynomial''s kernel factors,
      construct neighbours by Velu, verify each codomain''s trace equals t, and assign levels by Fouquet-Morain
      descent (walk down; the number of steps to a dead end gives h - i).

      STEP 3 -- VERIFY THE CRITERION EMPIRICALLY BEFORE USING IT. For every curve in the enumerated
      volcano, compute E(F_p)[ell] directly (roots of the ell-division polynomial that lift to rational
      points) and compare with the prediction from (A). This is a HARD GATE: the criterion is derived
      in this record and a single counterexample halts the line and supersedes the record.

      STEP 4 -- THE TRANSLATION-STABLE FACTOR BASE. On each curve with a rational T of order ell,
      build V as a union of (P, P+T, ..., P+(ell-1)T) orbits, of declared size B. Build the matched
      control bases described under null_object_control.

      STEP 5 -- THE MEASUREMENT. Run the frozen m = 3 Semaev decomposition measurement (harness/semaev.py,
      KN-TECH-002/KN-TECH-003) on each factor base and record: Groebner wall time, basis size, basis
      maximum total degree (labelled a proxy, never the degree of regularity -- the harness docstring
      is explicit about this), relation yield per target, and number of targets attempted. Compare
      crater, mid-levels, and floor.

      STEP 6 -- THE COFACTOR BUDGET (zero extra compute). For each measured cell, compute the FULLY
      CHARGED comparison: index-calculus total cost with the measured symmetrization gain versus 0.886
      sqrt(N) with N = #E / cofactor, and versus 0.886 sqrt(N/|Aut|). Report the crossover in ell,
      or report that there is none in the tested range. This is the step that converts a toy speedup
      into a cost-model statement.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - size-matched non-stable factor base on the same curve (N1)
  - height-zero volcano class (N2)
  - class with ell | c but ell not dividing (m-1) (N3)
  - resampled k on a fixed curve, for the noise band (N4)
  - matched Pollard rho with negation and matched BSGS per instance
  - the frozen Semaev fixture with symmetrization off, for baseline comparability
  - "NULL OBJECT (from the proposal): FOUR NULLS, all mandatory, three of them blocking. (N1) SIZE-MATCHED\
    \ RANDOM FACTOR BASE on the SAME curve: same |V|, x-values\n  drawn by the harness's deterministic\
    \ sampler, NOT translation-stable. This\n  isolates SYMMETRY from SIZE and is the same control\
    \ DECOMPOSITION lane L4\n  declares mandatory. Blocking: no symmetry claim without it.\n(N2) THE\
    \ HEIGHT-ZERO VOLCANO NULL: a class at the same p with v_ell(c) = 0,\n  so there is no floor and\
    \ no non-floor. Any measured \"level effect\" there is\n  pure artifact. Blocking.\n(N3) THE CLASS-CONDITION\
    \ NULL: a class with ell | c but ell does NOT divide\n  (m-1). By (A) no curve in it has full\
    \ rational ell-torsion at any level, so\n  the mechanism predicts a FLAT profile across all levels.\
    \ If an effect\n  appears anyway, the measurement is reading depth by some other route and\n \
    \ this record's mechanism is not the explanation. Blocking, and this is the\n  sharpest of the\
    \ four.\n(N4) RESAMPLED k on a fixed curve: gives the instance-noise band against\n  which every\
    \ ratio is judged.\nDECAY PARAMETER: the volcano height h = v_ell(c). The claimed effect must\
    \ be IDENTICALLY ZERO at h = 0 (no levels exist), must appear at h = 1, and must NOT grow with\
    \ h beyond the single floor step -- because (A) predicts a step, not a gradient. AN EFFECT THAT\
    \ GROWS WITH h IS THE ARTIFACT TELL HERE, and it is the reverse of the usual one, which is exactly\
    \ why it is stated in advance."
  independent_variables: []
  metrics:
    primary:
    - rank of E(F_p)[ell] and assigned level, per vertex
    - Groebner wall time, basis size, basis max total degree, relation yield
    - factor base size and construction mode, per measurement
    - rho and BSGS operation counts per instance
    secondary:
    - class-selection density with confidence intervals
    - fully charged cost comparison per cell
    - pass/fail of every control
  heuristic_under_test: null
  preregistered_prediction:
    quantity: rank of E(F_p)[ell] over Z/ell, per curve, against the level assigned by the isogeny-counting
      instrument
    formula: Rank 2 at 100 percent of non-floor vertices and rank <= 1 at 100 percent of floor vertices,
      in every class satisfying ell | c and ell | (m-1). This is a biconditional derived in (A); a
      single counterexample refutes it and halts the line. Zero tolerance.
    source: pre-registered in IDEA-20260807-cbe8c1 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - FACTOR-BASE SIZE. A translation-stable base built from orbits has size a multiple of ell and may
    differ from the control base by rounding. Sizes must be matched exactly, not approximately, and
    the achieved sizes reported.
  - 'SELECTION ON THE CLASS. Classes are chosen by conditions on t, c, D_K -- curve-only data -- so
    the selection cannot bias k. But it CAN bias #E and hence N, and every cost comparison must therefore
    be made within a class, never across classes with different N.'
  - sympy's Groebner routine is not an optimized F4 and its wall time is sensitive to variable ordering
    and to coefficient shape. Two independent orderings must agree on the direction of any reported
    ratio.
  - 'COFACTOR CONFOUND. Classes with ell^2 | #E have a smaller N at the same p than cofactor-1 classes.
    Comparing them to cofactor-1 curves would confound the mechanism with N; all comparisons are within-class
    and within-N.'
  - The floor curve differs from a crater curve in EVERY endomorphism-ring quantity at once (conductor,
    class number, short-endomorphism density -- see IDEA-20260805-38aebb). Attributing an observed
    difference specifically to torsion requires null N3, which holds every other quantity roughly
    fixed while removing the torsion.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Rank 2 at 100 percent of non-floor vertices and rank <= 1 at 100 percent of floor
    vertices, in every class satisfying ell | c and ell | (m-1). This is a biconditional derived in
    (A); a single counterexample refutes it and halts the line. Zero tolerance.
  falsification_criterion:
  - Any curve violating the biconditional in (A) with the instrument's controls passing. The derivation
    is wrong; the record is superseded, not amended.
  - 'Outcome E3 (flat) with adequate power: the symmetrization gain is below the toy measurement floor.
    The mechanism is not refuted but is unmeasurable at this scale, and the honest report says exactly
    that, including the achieved power.'
  - An effect in null N3 (no rational ell-torsion anywhere) of the same size as in the treatment classes.
    The measurement is reading something other than torsion and no claim in this record may be made.
  - A measured Groebner ratio ABOVE ell^(m-1). That exceeds the mechanism's own ceiling and indicates
    a factor-base size or sampling artifact, not a bonus.
  - Groebner runs exceeding the memory or wall-clock budget before any level is resolved. Infrastructure
    outcome under AGENTS.md rule 5; recorded as such and never as evidence about depth.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-cbe8c1
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
