# =============================================================================
# EXP-BINSTD-a8efe2 -- VERSION 1 (APPROVED by DEC-20261001-f29259) frozen
# contract for H-BINSTD-340284: Stage 0 modulus+census; Stage 1 structural
# fixture; Stage 2a encoder-level clause-width measurement; Stage 3
# relabelling discriminator at fixture scale; optional Stage 2b SAT arm
# gated on WDSat/CNF-XOR engine availability (HOLD-I).
#
# Source: IDEA-20260922-9d12bd under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Absorbs review defects from
# analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9d12bd.yaml
# (verdict sound_with_corrections / HOLD-I): non-duplication vs
# f37254/cdca3a; WDSat missing; census re-verification.
#
# ZERO RUNS in this design packet. Stages 0–2a + fixture-scale Stage 3
# authorized for later executor TASK-20261001-f5e965. Stage 2b optional.
# No AUXIN. Amazon Bedrock prohibited. packaging_only false.
# =============================================================================
experiment:
  id: EXP-BINSTD-a8efe2
  hypothesis_id: H-BINSTD-340284
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-9d12bd
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 n=9 dual-modulus + field-degree census; Stage 1 structural
    fixture; Stage 2a encoder clause-width; Stage 3 width-matched vs
    unmatched relabelling null (WDSat Stage 2b optional)
  status: approved
  approved_by: DEC-20261001-f29259
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-f29259
    composing_decision: DEC-20261001-f29259
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0–2a and fixture-scale Stage 3
      authorized; Stage 2b optional/instrument-gated.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, '2a', 3]
    optional_stages: ['2b']
    scientific_execution_authorized_note: >-
      Stages 0–2a + fixture-scale Stage 3 only as required success path.
      Stage 2b (SAT conflict / seconds-per-leaf at l in {6,7,8}) runs ONLY
      if a CNF-XOR SAT engine is available; otherwise write
      instrument_unavailable and stop that arm. Deployed-curve attacks,
      Gröbner arms, and sibling f37254/cdca3a protocols are NOT authorized.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Exhibit dual moduli at n=9 and commit the field-degree →
    ppBasis|tpBasis census (with sect*r1/r2 re-verification flag).
    (B) Confirm structural fixture: identical core-variable count / block
    partition / certificate equality across trinomial and pentanomial arms
    at m=3, l in {3,4}.
    (C) Measure encoder-level clause_width_ratio and substitution-variable
    counts at l in {6,7,8} (solver-free).
    (D) Run unmatched vs width-matched relabelling discriminator at
    fixture scale.
    (E) Optionally measure conflict/seconds-per-leaf if SAT engine present.

  class: measurement
  class_note: >-
    Cost-attribution / structure-validation hybrid: encoder-level
    distributions are the primary measured quantities; leaf/solution-count
    axis purity at fixture scale is the N_leaf check. Not a smoothness
    heuristic-validation CDF experiment. No exponent-moving claim.
    Measured-vs-modeled separation recorded below.

  corrections_absorbed:
    non_duplication: >-
      Does not implement f37254 phi-transport / no-trinomial-control or
      cdca3a Hamming-weight confound protocols. Owns 9d12bd discriminator
      + axis framing only (HOLD-I defect 1).
    wdsat_gate: >-
      WDSat missing. Stage 2b optional; instrument_unavailable is
      infrastructure (HOLD-I defect 2).
    census_reverification: >-
      Stage 0 re-greps binary-curve-params.txt and records which sect*r1/r2
      rows for m in {233,283,409,571} still need FIPS 186-4 / ANSI X9.62
      primary-text check (HOLD-I defect 3).

  scope:
    included:
      - >-
        Stage 0 (arithmetic / grep; zero scientific group walks on deployed
        curves): exhibit irreducible trinomial+pentanomial at n=9; commit
        pre-registered predictions; re-grep Basis Type census; write
        primary-text re-verification checklist for flagged rows.
      - >-
        Stage 1: encode same descended system under trinomial and
        pentanomial (and normal basis IF constructible without blocking);
        verify core-variable count, block partition, equisatisfiability,
        certificate-set equality by brute force at m=3, l in {3,4}.
      - >-
        Stage 2a: at l in {6,7,8}, record clause-width and substitution-
        variable-count distributions from the encoder (solver-free),
        >=5 seeds × instance grid per arm as budgeted.
      - >-
        Stage 3 (fixture-scale): unmatched and width-matched random
        relabelling controls; compare solution-count / N_leaf proxies to
        real-basis arms.
      - >-
        Stage 2b (OPTIONAL): if CNF-XOR SAT engine available, conflict
        counts and seconds-per-leaf at Stage-2a cells; else
        instrument_unavailable.yaml.
    excluded:
      - Any scientific group walk / attack at deployed m >= 131
      - Gröbner / F4 / Singular / Macaulay2 basis-sensitivity arms
      - IDEA-20260922-f37254 phi-transport protocol
      - IDEA-20260922-cdca3a Hamming-weight confound protocol
      - Treating Stage 2b absence as mathematical falsification of H1
      - AUXIN edits
      - Amazon Bedrock

  inputs:
    proposal: ledger/proposals/IDEA-20260922-9d12bd.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9d12bd.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-340284.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
    cells:
      Stage0-dual-modulus-n9:
        n: 9
        trinomial: 'x^9 + x + 1'
        pentanomial: >-
          Stage 0 exhibits an irreducible pentanomial (design-session
          candidate x^9+x^4+x^2+x+1 — re-verify and record exact poly)
        frozen_prediction_commit: before any Stage 1 encode
      Stage0-census:
        source: analysis/binstd-curve-audit/binary-curve-params.txt
        reverify_flag_m: [233, 283, 409, 571]
      BIN-TOY-F29-fixture:
        n: 9
        m: 3
        l: [3, 4]
        arms: [trinomial, pentanomial, normal_basis_if_constructible]
      BIN-TOY-F29-encoder:
        n: 9
        m: 3
        l: [6, 7, 8]
        instances_per_arm_status: '>=10 UNSAT and >=10 planted-SAT when constructible; else document shortfall'
        seeds: '>=5'

  controls:
    - name: structural_fixture
      object: >-
        Identical core-variable count, block partition, equisatisfiability
        across real-basis arms; mismatch blocks Stage 2a claims.
    - name: unmatched_random_relabelling
      object: >-
        Random invertible F_2-linear map per block NOT width-matched; must
        show large solution-count / N_leaf effect (instrument power check).
    - name: width_matched_random_relabelling
      object: >-
        Random relabelling with clause-width histogram matched to a real
        arm; N_leaf/solution-count within [0.9,1.1] of that arm.
    - name: brute_force_oracle
      object: Certificate-set equality across arms at Stage-1 cells.
    - name: seed_control
      object: '>=5 seeds per cell; spread reported before between-arm claims.'
    - name: normal_basis_third_arm
      object: >-
        If constructible, report as separately interpreted third arm; do
        not fold into pentanomial/trinomial ratio. If not constructible,
        record skipped_with_reason (not invalidation).

  independent_variables:
    - basis_arm  # trinomial | pentanomial | normal | unmatched_relabel | width_matched_relabel
    - n
    - m  # frozen at 3
    - l
    - instance_status  # UNSAT | planted_SAT
    - seed

  metrics:
    primary:
      - leaf_or_solution_count_ratio
      - clause_width_mean
      - clause_width_ratio
      - substitution_variable_count
      - substitution_variable_count_ratio
      - core_variable_count
      - certificate_set_equality
      - discriminator_unmatched_effect
      - discriminator_width_matched_ratio
    secondary:
      - clause_width_max  # tail
      - seconds_per_leaf  # Stage 2b only
      - conflict_count  # Stage 2b only
      - sat_engine_available
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - census_pp_vs_tp_rows
      - primary_text_reverify_checklist_complete

  heuristic_under_test:
    - HEUR-BINSTD-340284-H1
    - HEUR-BINSTD-340284-H2

  preregistered_prediction:
    quantity: >-
      (A) leaf_or_solution_count_ratio in [0.95,1.05]; (B) clause_width_ratio
      > 1 for pentanomial/trinomial; (C) unmatched relabelling large N_leaf
      effect; (D) width-matched ratio in [0.9,1.1]; (E) certificate equality
      at Stage 1.
    formula: >-
      Axis purity from backdoor invariance (Prop 1) + denser reduction
      terms → wider F-set XOR clauses. Discriminator: width matching
      isolates clause width from unstructured order.
    source: >-
      IDEA-20260922-9d12bd predictions/H1/H2;
      analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9d12bd.yaml
      concrete_experiment; H-BINSTD-340284
    claim_tier: observational
    measured_vs_modeled: >-
      Clause-width histograms, substitution-variable counts, solution
      multisets, wall_s, peak_rss are MEASURED. The naive 5-vs-3 term-count
      ratio is a MODELED first guess expected to be a POOR predictor and is
      reported in a separate column, never mixed with measured ratios.
      Stage 0 census rows from the audit dump are SECONDARY until primary-
      text checklist items are marked verified.

  scale_relevance:
    tier: toy
    justification: >-
      Primary cell n=9, m=3, l<=8. Transfer: census cells are field-degree
      labels only (no attack extrapolation). Encoder-level sparsity
      comparisons may be repeated at larger n without a solve; solving-cost
      Stage 2b (if any) is toy-only and not extrapolated to m>=131.
    correspondence: null

  tail_checks:
    - Single widest clause per basis arm reported alongside mean width.
    - Single largest solution-count under width-matched control vs real arm max.
    - Any structural-fixture mismatch is a hard stop, not averaged away.

  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
      - 20261004
      - 20261005
    independent_instances: >-
      >=10 UNSAT and >=10 planted-SAT per (l, basis arm) when constructible
      at Stage 2a; Stage 1 uses exhaustive/brute-force enumerations at
      fixture scale (deterministic seeds for any random target draw).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 30
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when dual-modulus exhibit, prediction commit, census grep, and reverify checklist are written.
    - Stage 1 complete when structural fixture + certificate equality recorded for both real-basis arms at l in {3,4}.
    - Stage 2a complete when clause-width and substitution-variable summaries exist for l in {6,7,8} across arms with >=5 seeds.
    - Stage 3 complete when unmatched and width-matched controls reported at fixture scale.
    - Stage 2b: run to completion OR write instrument_unavailable; either satisfies the optional arm.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.

  invalidation_rules:
    - structural fixture core-variable mismatch across real-basis arms
    - certificate_set_equality false at any Stage-1 cell
    - width-matched control's clause-width histogram not actually matched (match metric fails)
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Treating missing WDSat as H1 falsification → protocol violation

  success_criterion: >-
    Stage 0: both moduli exhibited irreducible; census artifact written;
    predictions committed before Stage 1.
    Stage 1: structural fixture pass; certificate equality true.
    Stage 2a: clause_width_ratio measurable with direction reported;
    seed spread reported.
    Stage 3: unmatched shows large effect; width-matched within [0.9,1.1]
    OR explicit discriminator-fail outcome (still a complete measurement).
    Axis-purity success additionally requires leaf_or_solution_count_ratio
    in [0.95,1.05]. Decidable from predefined metrics.

  falsification_criterion: >-
    leaf_or_solution_count_ratio outside [0.95,1.05] with passing fixture;
    OR width-matched control matches unmatched large effect (discriminator
    fail — sparsity attribution not licensed);
    OR structural/certificate invalidation.
    Missing Stage 2b is NOT falsification.

  required_artifacts:
    - experiments/EXP-BINSTD-a8efe2/stage0/dual-modulus-n9.yaml
    - experiments/EXP-BINSTD-a8efe2/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-a8efe2/stage0/basis-type-census.yaml
    - experiments/EXP-BINSTD-a8efe2/stage0/primary-text-reverify-checklist.yaml
    - experiments/EXP-BINSTD-a8efe2/stage1/structural-fixture-report.yaml
    - experiments/EXP-BINSTD-a8efe2/stage1/certificate-equality.yaml
    - experiments/EXP-BINSTD-a8efe2/stage2a/clause-width-summary.json
    - experiments/EXP-BINSTD-a8efe2/stage2a/substitution-variable-summary.json
    - experiments/EXP-BINSTD-a8efe2/stage3/relabelling-discriminator-report.yaml
    - experiments/EXP-BINSTD-a8efe2/stage2b/  # either metrics or instrument_unavailable.yaml
    - experiments/EXP-BINSTD-a8efe2/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-a8efe2/runs/*/raw-result.json
    - experiments/EXP-BINSTD-a8efe2/runs/*/stdout.log

  procedure:
    stage0:
      - Verify x^9+x+1 irreducible over F_2; find and record an irreducible pentanomial of degree 9.
      - Write preregistered-predictions.yaml (axis purity + clause-width direction + discriminator) BEFORE Stage 1.
      - Grep binary-curve-params.txt for Basis Type; write basis-type-census.yaml.
      - Write primary-text-reverify-checklist.yaml for m in {233,283,409,571} sect*r1/r2 rows.
    stage1:
      - Build encoder for trinomial and pentanomial arms at m=3, l in {3,4}.
      - Verify identical core-variable count and block partition.
      - Brute-force certificate-set equality; halt Stage 2a on failure.
      - Optionally attempt normal-basis arm; skip with reason if not constructible.
    stage2a:
      - For l in {6,7,8}, emit clause-width and substitution-variable histograms per arm (no SAT required).
      - Record leaf_or_solution_count at fixture-extendable cells only if enumerable without SAT; otherwise rely on Stage 1 for N_leaf axis and Stage 2a for c_leaf proxies.
    stage3:
      - Build unmatched and width-matched relabelling controls at Stage-1 scale.
      - Verify width-match metric; run solution-count comparison; write discriminator report.
    stage2b_optional:
      - Probe for WDSat or declared CNF-XOR SAT engine.
      - If absent: write stage2b/instrument_unavailable.yaml (infrastructure).
      - If present: measure conflict counts and seconds-per-leaf on Stage-2a cells with pinned versions.

  assigned_to: executor
  dominated_by: >-
    Matched rho on standardized binary rows; within pdp, leaf-count ceiling
    unchanged under H1. This experiment's sota_delta is a toy c_leaf
    attribution + reusable discriminator, not attack-cost improvement.
  sota_delta:
    time: Constant-factor c_leaf characterisation at toy scale only; zero exponent.
    memory: Unchanged.
    data_queries: N/A.
  impediments_declared:
    - id: IMP-WDSat-1
      what_is_blocked: Stage 2b conflict-count / seconds-per-leaf at l in {6,7,8}
      condition: WDSat / CNF-XOR SAT engine not installed in this environment
      clears_when: >-
        A pinned CNF-XOR SAT engine is available on PATH or under a declared
        experiment tool path and probe returns available=true
      recheck: >-
        command -v wdsat; ls experiments/EXP-BINSTD-a8efe2/tools/; write
        stage2b/engine-probe.yaml
      asserts_nothing_about: H1/H2 mathematics; encoder-level Stages 0–2a/3
