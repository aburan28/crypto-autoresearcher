experiment:
  id: EXP-ALECF-1e2283
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-5e9358; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-5e9358
  question_id: RQ-ALECF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate the accounting conventions the benchmark specification leaves implicit and evaluate
    the full set of admissible scores for one fixed toy circuit, reporting the interval, per-coordinate
    ranges, and the interaction term.
  objective: 'The one uncertainty a run reduces is how much of a circuit score is determined by the
    circuit rather than by unstated accounting conventions. Concretely: (i) does the enumerated lattice''s
    nominal point reproduce both committed ALECF scores exactly under the round-then-multiply reading,
    which anchors the enumeration to the benchmark actually in force rather than to a reconstruction;
    (ii) for a toy circuit built in the interpreter where every coordinate is exactly evaluable, what
    is the ratio of maximum to minimum admissible score across the full lattice, what is each coordinate''s
    individual multiplier range with others held nominal, and how large is the interaction term measured
    as the full interval divided by the product of individual ranges; (iii) does a lattice-matched
    random resource profile produce a similar interval, which is the null establishing whether the
    width is a property of the lattice and the magnitudes rather than of the circuit. A run does not
    adjudicate which convention is correct, does not claim any committed score is miscomputed, does
    not evaluate any circuit''s quality, and claims no attack or security consequence. The deliverable
    is the interval with its per-coordinate decomposition, the null comparison, and a separate clearly
    marked table applying only the committed-data-evaluable coordinates to the two committed vectors,
    with every unevaluable coordinate named as unevaluable rather than filled in.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the enumerated six-coordinate
      accounting lattice, the fixed toy circuit built here receives the measured set of admissible
      scores with the measured interval, per-coordinate ranges and interaction term, and the same
      lattice applied to the committed ALECF vectors yields the measured partial ranges over its evaluable
      coordinates. WHAT DOES NOT FOLLOW: no conclusion that the benchmark''s conventions are wrong
      or that any alternative is right, no conclusion that any committed score is miscomputed (the
      nominal point reproduces both exactly), nothing about the circuits behind the committed scores,
      nothing about 256-bit cost, no claim that the enumeration is complete, and no attack, speedup
      or security consequence. An interval measures underdetermination of a specification, and a wider
      interval means less was written down, not that anything was done incorrectly.'
  inputs:
    procedure: 'STAGE 0 (cost: two hours): extract every convention the committed README leaves unstated,
      fix the lattice''s coordinates and their admissible values, and implement the identity check
      and the nominal-point reproduction control against both committed scores. STAGE 1 (cost: two
      to three hours, reusing the interpreter): build the toy reversible point-add circuit with shot-level
      instrumentation so that per-shot Toffoli and Clifford counts, a declared Toffoli decomposition,
      and the input-versus-ancilla register split are all directly observable. STAGE 2 (cost: seconds):
      evaluate the score at every lattice point and record the full set. STAGE 3 (cost: seconds):
      compute the full interval, the per-coordinate ranges with others nominal, and the same ranges
      with others randomized, giving the interaction term. STAGE 4 (cost: seconds, same invocation):
      generate the lattice-matched random resource profile and repeat STAGES 2 and 3. STAGE 5 (cost:
      one hour): apply only the committed-data-evaluable coordinates to the two committed vectors,
      mark the rest unevaluable, and count them. STAGE 6 (cost: one hour): report the interval, the
      coordinate ranking, the interaction term, the null width, and the count of coordinates whose
      range exceeds 1.0715.'
    instrument: Python 3.11 standard library for exact and rational arithmetic so that rounding rules
      are evaluated without floating-point ambiguity, using fractions.Fraction for the shot averages;
      the classical basis-state reversible interpreter with shot-level instrumentation built for this
      bucket's tooling contract; hashlib for recording the sha256 of every committed artifact read;
      numpy only for the null profile generation; pytest for the identity and reproduction controls;
      harness/runner.py for the run record. No Sage, no quantum simulator, no hardware, no network.
      The Autolab Rust harness is absent from this repository, so no committed score is recomputed
      from a circuit; only the score relation is re-derived from the committed counts.
    parameters: 'Lattice coordinates and arities: rounding rule (4 values: round-half-up, floor, ceil,
      none), granularity (3 values: Toffoli atomic, Toffoli decomposed at cost 7, Toffoli decomposed
      at cost 4), Clifford weight (4 values: 0, 0.01, 0.1, 1), shot statistic (3 values: mean, maximum,
      0.99 quantile), peak-width convention (2 values: include inputs, exclude inputs), authoritative-row
      rule (3 values: final row, minimum-score row, last row marked correct). Full lattice 4 times
      3 times 4 times 3 times 2 times 3 equal to 864 points. Toy circuit at a 13-bit prime with 4096
      instrumented shots. Null profiles: 50 independent draws. Committed-vector application: 2 vectors,
      coordinates marked evaluable or unevaluable individually.'
  controls:
  - Lattice-matched random resource profile evaluated through the identical lattice code in the same
    invocation.
  - 'Nominal-point reproduction control: at the nominal lattice point, the evaluator must reproduce
    the committed score relation exactly for both committed vectors, that is 1316081 times 1152 equal
    to 1516125312 and 1423723 times 1141 equal to 1624467943.'
  - 'Unevaluable-coordinate marking: any coordinate requiring data absent from this repository is
    reported as unevaluable rather than estimated, and the count of such coordinates is a reported
    metric.'
  - 'A single-coordinate identity check: holding all coordinates nominal must return exactly the nominal
    score, as an instrument check.'
  - 'Independence check: per-coordinate ranges are computed both with others nominal and with others
    randomized, and the difference is the measured interaction.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a random resource profile of the same shape as the
    measured circuit''s: a shot-level Toffoli distribution with the same mean and variance, a Clifford
    count of the same magnitude, a register inventory of the same size, and a log of the same number
    of rows, all generated without any circuit behind them. The identical lattice evaluation runs
    on it in the same invocation. For the signal arm to mean anything the null must show a SIMILAR
    interval width: if it does, the width is a property of the lattice and the profile''s magnitudes
    alone, which is the expected and honest outcome and is exactly what licenses quoting the width
    as a general caveat rather than as a circuit-specific finding. If instead the real circuit''s
    interval is much wider, the excess must be explained before it is reported, most likely by an
    interaction the decomposition missed.'
  independent_variables:
  - rounding rule
  - gate-set granularity
  - Clifford weight
  - shot statistic
  - peak-width convention together with the authoritative-row rule
  metrics:
    primary:
    - full-lattice max-over-min score ratio
    - per-coordinate individual multiplier range
    - interaction ratio
    - count of coordinates exceeding the 1.0715 committed score gap
    secondary:
    - null-profile full-lattice ratio
    - count of unevaluable coordinates on committed data
    - nominal-point reproduction result for both committed scores
    - shot-level Toffoli distribution summary for the toy circuit
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The full-lattice score interval ratio W for the fixed toy circuit, and the per-coordinate
      ranges.
    formula: 'Let S(theta) be the score of the fixed circuit at lattice point theta, evaluated in
      exact rational arithmetic. W = max over theta of S(theta) divided by min over theta of S(theta),
      computed over the 864-point lattice excluding the authoritative-row coordinate for the primary
      figure and including it for a secondary figure. Per-coordinate range W_c = max over values of
      coordinate c of S divided by min over values of c of S, with all other coordinates at nominal.
      Interaction ratio I = W divided by the product over c of W_c. Predicted: W at or above 4.0;
      W_rounding at or above 1.001 and below 1.01; W_clifford at or above 2.0; I at or below 1.2;
      and at least 2 coordinates with W_c above 1.0715.'
    source: Pre-registered in the parent proposal IDEA-20260816-5e9358 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The circuit whose lattice is evaluated is a toy reversible point addition at 13-bit
      prime width, chosen because every lattice coordinate requires data (per-shot counts, decomposition,
      register split) that exists only for a circuit built and simulated here. The committed ALECF
      vectors are 256-bit figures and are used only for the coordinates evaluable from committed counts
      alone, with the rest explicitly marked unevaluable; no toy interval is transferred to them.
      The stated transfer assumption is structural rather than numeric: the lattice''s coordinates
      exist at every width because they are properties of the specification, while their multiplier
      ranges are width-dependent and are not extrapolated.'
    correspondence: null
  tail_checks:
  - Inspect the extreme lattice points to confirm the maximum and minimum are attained at coherent
    convention combinations rather than at a coordinate interaction artifact.
  - Check the rounding coordinate at the exact half-integer case, where round-half-up and round-half-even
    differ and the arity may need widening.
  - Examine the authoritative-row coordinate on the committed logs, where row selection moves the
    score by more than a factor of six and therefore dominates any other coordinate.
  - Check whether the 0.99 shot quantile coincides with the maximum at 4096 shots, which would collapse
    two coordinate values into one.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate after evaluating the full 864-point lattice and the 50 null profiles; the lattice is
    exhaustive by construction so no sampling decision arises.
  - Abort if the nominal-point reproduction control fails on either committed score.
  - Abort if the identity check returns anything other than the nominal score.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run reproduces both committed scores exactly at the nominal lattice point,
    evaluates the full lattice in exact rational arithmetic, and reports W, all per-coordinate ranges,
    the interaction ratio, the null width, and the committed-vector partial table with unevaluable
    coordinates explicitly marked and counted.
  falsification_criterion:
  - Nominal-point reproduction failing on either committed score.
  - W below 1.2.
  - Interaction ratio above 2.
  - No coordinate exceeding the 1.0715 committed score gap.
  - The identity check failing.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-5e9358
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The enumeration's completeness cannot be certified; a Coordinator must decide whether the record
    states the interval as a lower bound, which is the honest option, or whether a structured review
    of the README is required first to widen the list.
  - The Toffoli decomposition costs 7 and 4 are placeholders chosen to bracket plausible conventions
    and must be derived in-record or replaced, since this environment cannot cite external sources
    for them.
  - Whether the authoritative-row coordinate belongs in the primary interval or is reported separately
    needs deciding, since on committed data it dominates every other coordinate by an order of magnitude.
  - It must be settled whether the committed-vector partial table is publishable at all given how
    many coordinates are unevaluable, or whether it belongs only in an appendix.
