experiment:
  id: EXP-MLDSA-462ea2
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLDSA-2d4123
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  batch_id: null
  title: >-
    Reachability envelope and predicate census for FIPS 204 Algorithm 7:
    a zero-compute integer gate that decides two of three parameter sets,
    followed by a fibre-sampling arm and four non-conforming signer variants
    checked by an independently written verifier

  objective: >-
    Decide, for each rejection predicate of FIPS 204 Algorithm 7 and each
    approved ML-DSA parameter set, (i) whether the predicate can fire at all,
    (ii) whether a verifier detects its omission, (iii) at what rate it fires
    where it can, and (iv) conditional on a violation of the one genuinely
    unobservable predicate, how often the signature still verifies. The
    contract is ordered so that the cheapest stage is the most decisive: Stage
    1 is six integer multiplications and can settle two of the three parameter
    sets and terminate the run.

  what_this_is_not:
    - Not a forgery, a break, a key recovery, or an attack of any kind. Every signature discussed is produced by a party holding the private key.
    - Not a statement about MLWE, MSIS or SelfTargetMSIS in any direction, at any tier, however phrased.
    - Not a fault-injection or side-channel study, and not an estimate of any lattice problem. Those belong to GOAL-MLDSA-001 and a batch drifting into them must hand off.
    - Not a defect report against FIPS 204, against any implementation, or against eprint 2026/1333, which this program has NOT read.
    - Not a determination of what the SECURITY ARGUMENT loses when a predicate is omitted. Only the correctness consequence is in scope; the proof role is explicitly out of scope and is named as a successor.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.
    - Not a measurement of the ct0 rejection rate at ML-DSA-44 by direct observation. That is priced at 1.36e8 signing attempts and is declared out of budget in advance.

  claim_ceiling: >-
    TIER crypto for the arithmetic results, and the justification is that they
    require no scaling argument at all: the reachability verdicts, the exact
    convolution tail and the census are evaluated at the real FIPS 204
    parameters and are integer statements about those exact parameters. TIER
    toy for the synthetic reachable cell and any reduced-parameter arm, whose
    numbers may never be quoted about a real parameter set. A completed run may
    support, at most: that the first disjunct of Line 28 is unreachable at
    ML-DSA-65 and ML-DSA-87 and reachable at ML-DSA-44; that the derived
    per-signature rate at ML-DSA-44 is 7.3376e-9 CONDITIONAL on
    HEUR-MLDSA-T0U; that the census verdicts hold; and that the measured
    hint-correctness rate above gamma2 is as stated CONDITIONAL on
    HEUR-MLDSA-BND. It may not support any statement about the security of
    ML-DSA as standardized.

  inputs:
    parameter_sets:
      ML-DSA-44: {k: 4, l: 4, eta: 2, tau: 39, beta: 78, gamma1: 131072, gamma2: 95232, omega: 80, d: 13, lambda_bits: 128}
      ML-DSA-65: {k: 6, l: 5, eta: 4, tau: 49, beta: 196, gamma1: 524288, gamma2: 261888, omega: 55, d: 13, lambda_bits: 192}
      ML-DSA-87: {k: 8, l: 7, eta: 2, tau: 60, beta: 120, gamma1: 524288, gamma2: 261888, omega: 75, d: 13, lambda_bits: 256}
    modulus_q: 8380417
    zeta: 1753
    parameter_provenance: >-
      Transcribed from FIPS 204 Table 1 by the generating session on
      2026-08-06 from the primary PDF (HTTP 200 from
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.pdf, 3,291,746
      bytes, sha256
      57239b9f84c03227eda3ca0991204dc7764c79af9ce2e6824eda774918d46b6b).
      TREATED AS UNVERIFIED. Stage 0 re-obtains the document, re-reads all
      values, and records any discrepancy as a terminating condition. The
      lambda_bits values are the least confidently transcribed and are NOT
      load-bearing for any stage.
    synthetic_reachable_cell:
      description: ML-DSA-87 parameters with gamma2 replaced by 200000, below the 245760 envelope
      purpose: positive control; the predicate MUST fire here
    graded_threshold_sweep: [150000, 190000, 220000, 240000, 261888]
    graded_perturbation_sweep_multiples_of_gamma2: [0.5, 0.9, 1.0, 1.5, 2.0]
    master_seed: 462426
    seed_derivation_rule: >-
      Every random value derives from
      SHAKE256(ASCII("EXP-MLDSA-462ea2/v1" || "|" || label || "|" ||
      decimal(master_seed) || "|" || decimal(counter)), output_bytes), with
      counter starting at 0 and incremented once per draw, and digest integers
      read big-endian unsigned. Labels are exactly: "keygen-seed",
      "message", "rnd", "fibre-r", "fibre-s", "null-t0". This rule fixes every
      instance bit-for-bit; a third party reproducing it from this contract
      must obtain identical inputs, and any divergence is an
      invalidation_rule trigger.
    replication_seeds: [462426, 462427, 462428]
    keypairs_per_parameter_set: 3
    signatures_per_signer_variant_per_set: 500
    fibre_samples: 100000
    hint_weight_signatures_per_set: 10000

  arms_and_controls:
    treatment: >-
      Four signer variants at each parameter set, all holding a genuine key:
      (A) CONFORMING, implementing Algorithm 7 exactly;
      (B) R0-OMITTED, dropping the "||r0||_inf >= gamma2 - beta" disjunct of
          Line 23 and keeping everything else;
      (C) CT0-OMITTED, dropping the "||<<c t0>>||_inf >= gamma2" disjunct of
          Line 28 and keeping everything else;
      (D) HINTWEIGHT-OMITTED, dropping the "number of 1's in h > omega"
          disjunct of Line 28.
      Each emits 500 signatures per parameter set; each signature is checked by
      the independent verifier.
    measured_null: >-
      Arm (A), the conforming signer, is the null of the same shape: its forced
      value is 500/500 verifications at every parameter set, derived before the
      run from the correctness of Algorithm 7 and Algorithm 8. IT CAN FAIL, and
      its failure means the implementation is wrong and NOTHING in the package
      may be reported. A second null, for the Stage 3 distributional arm: the
      identical |<<c t0>>| quantile measurement run with t0 drawn uniformly
      from [-4095, 4096] independently of any key; forced value under
      HEUR-MLDSA-T0U is statistical indistinguishability from the real-key arm,
      and a heavier real-key tail refutes the heuristic.
    positive_control: >-
      TWO, both required. (i) The synthetic reachable cell (ML-DSA-87 tau and
      d with gamma2 = 200000): the Line-28 first disjunct MUST fire at an
      observable rate. (ii) Arm (D): its emissions MUST be rejected by
      HintBitUnpack whenever the weight exceeds omega. If either control fails
      to produce its effect, the instrument is broken and NO NEGATIVE RESULT
      MAY BE REPORTED FROM ANY ARM.
    graded_control: >-
      TWO graded sweeps, each with five points and monotonicity reported.
      (i) THRESHOLD SWEEP: hold ML-DSA-87's tau and d and sweep gamma2' over
      {150000, 190000, 220000, 240000, 261888}; the measured firing rate must
      be strictly decreasing and EXACTLY 0 at the last point.
      (ii) PERTURBATION SWEEP: measure the hint-correctness rate at
      perturbation magnitudes {0.5, 0.9, 1.0, 1.5, 2.0} x gamma2; the forced
      shape is (1.000, 1.000, 1.000, ~0.75, ~0.5), strictly non-increasing.
      A rate that fails to decay as the destroying parameter increases is the
      canonical artifact tell of docs/inventor-protocol.md section 3 and
      localises the fault to the instrument.
    ordering_control: >-
      The null arms are generated, analysed, and their verdicts hash-committed
      BEFORE any treatment arm is examined. Specifically: arm (A)'s
      verification counts and the uniform-t0 quantile arm are committed before
      arms (B), (C) and (D) are looked at. Absence of that commitment is
      invalid_measurement.
    independence_control: >-
      The verifier implements Algorithm 8 and imports NO function from the
      signer -- in particular its own UseHint, Decompose, HighBits, NTT and
      HintBitUnpack. A shared implementation would make the census
      self-confirming, and per docs/claims-and-verification.md's independence
      rule a certificate re-checked by the producer's own code path is not a
      certificate.
    comparability_policy: >-
      No cross-experiment comparison with any record outside this contract is
      permitted without a separately registered comparator contract naming both
      domains, seeds and statistics. In particular the numbers here may not be
      compared with the relayed figures of eprint 2026/1333 as if both were
      measurements; one is relayed and unread.

  measured_quantity:
    stage1_envelope: >-
      For each parameter set compute E = tau * 2^(d-1) with exact integers and
      the boolean E >= gamma2. No floating point anywhere in this stage.
    stage2_tail: >-
      Exact rational two-sided exceedance probability of the tau-fold
      convolution of the uniform law on [-2^(d-1)+1, 2^(d-1)] at gamma2, via
      #{v in {0..8191}^tau : sum v <= s} = sum_j (-1)^j C(tau,j) C(s-8192j+tau, tau),
      in Python integers; then R = 1 - (1 - p_1)^(256k).
    stage3_fibre: >-
      For each of 100000 draws, r uniform on Z_q and s drawn from the
      conditional overshoot law above gamma2, record whether
      UseHint(MakeHint(s, r), r) = HighBits(r + s). No signing is performed in
      this stage; the rare EVENT is decoupled from the cheap CONDITIONAL
      question, which is what makes the arm affordable.
    stage4_census: >-
      Per signer variant, per parameter set: number of emissions, number
      verifying under the independent verifier, number rejected at
      HintBitUnpack, number rejected at the challenge comparison, and the
      measured empirical repetition count.

  metrics:
    primary:
      - reachability verdict triple (E >= gamma2) at ML-DSA-44 / -65 / -87, with the three envelope integers and the three thresholds
      - exact p_1 and derived R_44 at ML-DSA-44, as an exact rational and a float
      - verify rate per signer variant per parameter set, 500 emissions each, under the independent verifier
      - hint-correctness rate above gamma2 at ML-DSA-44 from 100000 fibre samples
    secondary:
      - measured hint weight mean and standard deviation per parameter set over 10000 signatures
      - both graded sweeps with monotonicity explicitly reported
      - empirical repetition count per parameter set against FIPS 204 Table 1 and against the recomputed 4.297 / 5.118 / 3.875
      - verbatim quotations of Algorithm 7 Lines 23 and 28, Algorithm 8 Line 13, Algorithm 21's perp conditions, Algorithm 24's t0 range, Section 2.3's norm definition, each with a page number
      - fetch receipt, byte count, sha256 and extraction command for the FIPS 204 PDF

  heuristic_under_test: HEUR-MLDSA-T0U

  preregistered_prediction:
    quantity: >-
      (i) the reachability verdict triple; (ii) p_1 and R_44; (iii) the verify
      rates of the four signer variants; (iv) the hint-correctness rate above
      gamma2; (v) the hint weight means and standard deviations.
    formula: >-
      (i) E = tau * 2^(d-1) vs gamma2 -> 159744 vs 95232, 200704 vs 261888,
      245760 vs 261888, giving (True, False, False).
      (ii) p_1 = 7.1656e-12 by inclusion-exclusion; R_44 = 1 - (1 - p_1)^1024
      = 7.3376e-9, i.e. one in 1.3628e8.
      (iii) arm A = 500/500 at every set; arm B materially below 1.000 and at
      most 0.95 at every set; arm C = 500/500 (violations are too rare to occur
      in 500 emissions, so this arm is expected to be INDISTINGUISHABLE from
      arm A and that indistinguishability is itself the pre-registered
      prediction and the point); arm D rejected at HintBitUnpack at a per-cent
      rate.
      (iv) 1 - E[e]/(2 gamma2) with E[e] = 1/lambda = 1693 and lambda =
      5.907e-4, giving 0.991, acceptance band [0.985, 0.996].
      (v) 63.4 / 38.7 / 57.1 with standard deviations 7.71 / 6.14 / 7.45, from
      256k * E|<<c t0>>| / (2 gamma2) with E|<<c t0>>| = sqrt(tau(2^26-1)/12) *
      sqrt(2/pi).
    source: >-
      H-MLDSA-2d4123 mechanism steps 1-6, derived before this contract was
      written from FIPS 204 Table 1 and Algorithms 7, 8, 20, 21, 24, 36-41.
      All numeric values were computed by the generating session OUTSIDE the
      harness with no run record and are re-derivation targets, never
      authorities.

  scale_relevance:
    tier: crypto
    justification: >-
      The primary metrics are evaluated at the real FIPS 204 parameter sets and
      require no transfer argument: the reachability verdict is an integer
      comparison at those exact parameters, the convolution is over the exact
      t0 range, and the signer variants sign at full parameters. The one
      reduced object -- the synthetic gamma2 = 200000 cell -- is an INSTRUMENT
      CONTROL and is labelled toy; no statement about a real parameter set may
      cite it. Nothing here extrapolates from small to large, which is the
      usual scale risk in this program and is absent by construction.
    correspondence: null

  tail_checks:
    - The exponential fit to the exceedance tail is checked on the range it is used on, not assumed: the exact tail must fall by 0.7453 +/- 0.01 over the first 500 units above gamma2 and by 0.7433 +/- 0.01 over the next 500. A departure invalidates the E[e] = 1693 estimate and with it the 0.991.
    - The extremal configuration attaining tau * 2^(d-1) is constructed explicitly and checked, confirming the envelope is tight rather than merely valid.
    - Maximum observed HighBits displacement at ML-DSA-44 must never exceed 2, since tau * 2^(d-1) = 159744 < 2 gamma2 = 190464. A 3-step displacement is arithmetically impossible and indicates an implementation defect.

  replication:
    seeds: [462426, 462427, 462428]
    independent_instances: 3
    interpretation: >-
      Stage 1 and Stage 2 are deterministic and replication is a re-derivation,
      not a resampling. Stages 3 and 4 are replicated across three seeds and
      three keypairs per parameter set; seed-to-seed spread of every reported
      rate is stated BEFORE any comparison with a predicted value.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 3
    no_network_at_run_time: false
    network_note: >-
      Stage 0 requires network access to re-obtain FIPS 204 and to attempt
      eprint 2026/1333. Stages 1-4 require none and must run with networking
      unnecessary.
    explicitly_out_of_budget: >-
      Direct observation of a Line-28 ct0 rejection at ML-DSA-44 (expected cost
      1.36e8 signing attempts) and any confidence interval on that rate
      (order 1e9 attempts). DECLARED OUT OF BUDGET BEFORE EXECUTION rather than
      attempted and abandoned. Under AGENTS.md rule 5 a budget outcome is never
      evidence that the event is absent.

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived and authorized. It carries no approved_by field because it is not approved.
    - STOP at Stage 0 if any of the nine Table 1 values, the norm definition, or the four predicate texts differ from the inputs block. Report the discrepancy; it terminates the line and is the deliverable.
    - STOP at Stage 1 if the verdict triple is not (True, False, False). The hypothesis is refuted at zero compute.
    - STOP before any treatment arm if the conforming arm (A) does not verify 500/500 at every parameter set.
    - STOP and report infrastructure signal if the FIPS 204 PDF cannot be obtained or its text cannot be extracted. This is an infrastructure outcome, never mathematical evidence, and never evidence that the predicate is or is not reachable.
    - STOP if either positive control fails to produce its effect; no negative result may be reported from any arm.
    - HALT at the run's wall-clock or memory ceiling and report what was covered, rather than reducing the sample silently.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - The verifier importing any function from the signer, or sharing a UseHint / HintBitUnpack / NTT implementation with it.
    - Absence of the null-before-treatment hash commitment.
    - Any floating-point value used in Stage 1 or Stage 2, where exact integer and rational arithmetic is required.
    - A reported 3-step HighBits displacement at ML-DSA-44, which is arithmetically impossible and indicates an implementation defect.
    - Any comparison of these results with the relayed figures of eprint 2026/1333 as if both were measurements of the same kind.
    - Any parameter value used at run time that was not re-read in Stage 0.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, failed download, failed PDF
    extraction, or exhausted budget is recorded as INFRASTRUCTURE SIGNAL with
    its exact cause and is NEVER negative mathematical evidence about any
    predicate, rate, or heuristic (AGENTS.md rules 3 and 5). The extraction
    route is known-fragile: pdftotext is absent, and pypdf and pdfminer.six both
    abort on importing the system `cryptography` package with
    pyo3_runtime.PanicException; the generating session's workaround was to
    pip-install a fresh `cryptography` into a local --target directory placed
    first on PYTHONPATH. If that workaround fails, the correct output is an
    infrastructure report and a request, not a conclusion.

  success_criterion: >-
    A complete readout in which: Stage 0 records the fetch receipt and all nine
    re-read parameters with page references; Stage 1 returns the verdict triple
    with exact integers; Stage 2 returns p_1 and R_44 as an exact rational and
    a float; Stage 3 returns the fibre hint-correctness rate inside its
    pre-registered band with both graded sweeps monotone; Stage 4 returns the
    four verify rates with the conforming null at 500/500 and both positive
    controls firing; and the package states explicitly which conclusions are
    unconditional (the reachability verdicts, the census) and which are
    conditional on which heuristic (the rate, the survival probability). The
    package must additionally state, as a first-class deliverable, that
    GOAL-MLDSA-002's first completion criterion is satisfiable by theorem at
    ML-DSA-65 and ML-DSA-87 and is NOT purchasable at ML-DSA-44 within the
    declared campaign budget, with the price stated. A readout omitting that
    budget statement has not finished.

  falsification_criterion: >-
    Any of: the verdict triple is not (True, False, False); an sk accepted by
    skDecode and a c in B_tau are exhibited at ML-DSA-65 or ML-DSA-87 with
    ||<<c t0>>||_inf >= gamma2; the r0-omitted arm verifies 500/500 at every
    parameter set; the hint-weight-omitted arm's over-weight emissions are
    accepted by the independent verifier; the fibre hint-correctness rate falls
    outside [0.985, 0.996]; either graded sweep is non-monotone; or the
    measured hint weights depart from the predicted means by more than three
    standard errors. Each falsification is scoped: a failure of the
    distributional predictions withdraws R_44 and the 0.991 and leaves the
    reachability verdicts and the census untouched, and the report must say so
    rather than issuing a single verdict.

  required_artifacts:
    - Frozen approved specification and a freeze receipt binding its sha256.
    - FIPS 204 fetch log with URL, HTTP status, byte count, sha256, timestamp, and the exact extraction command and its environment.
    - Verbatim quotations with page numbers of Algorithm 7 Lines 23 and 28, Algorithm 8 Line 13, Algorithm 21's perp conditions, Algorithm 24's t0 range, Section 2.3's norm and B_tau definitions, and Table 1.
    - Stage 1 transcript with exact integers, and the constructed extremal configuration attaining the envelope.
    - Stage 2 exact rational p_1 with the closed form and the code path.
    - Stage 3 raw fibre samples summary with seeds, both graded sweeps, and the tail-ratio checks.
    - Stage 4 per-arm raw records: emission index, seed, verify outcome, rejection reason, hint weight.
    - Null-before-treatment hash commitment with its timestamp.
    - Source of the independent verifier, with a stated argument that it shares no code path with the signer.
    - Manifest, environment, dependency versions, command, stdout, stderr, timings, peak RSS, and validity status with reason.
    - Certificate block with kind: none for the measurement stages, stated explicitly rather than left blank, since no solve or relation is claimed.

  execution_order_note: >-
    GOAL-MLDSA-002's next_action directs that the t0 object be scoped FIRST.
    This contract does not override that and recommends EXP-MLDSA-8c8fa2 be
    approved first. However Stage 0 here is the same source acquisition that
    contract needs, and Stage 1 costs six multiplications, so a Coordinator may
    reasonably fold Stages 0-1 of this contract into that one's opening window
    at effectively no cost. That is a scheduling suggestion, not an
    authorization, and only the Coordinator decides it.

  approval_requirements:
    - Independent review confirms the stage ordering is genuinely cheapest-first and that Stage 1 can terminate the run.
    - Independent review confirms the verifier independence requirement is implementable and checked.
    - Independent review confirms no metric or conclusion can be read as a statement about MLWE, MSIS or SelfTargetMSIS.
    - Coordinator separately approves and freezes; the user separately authorizes execution.
  approval_status: >-
    Pending review. No approved_by field is present because this contract is
    not approved, and only the Coordinator may approve it (AGENTS.md rule 1).
  assigned_to: executor
