# =============================================================================
# EXP-GFPN-ef0adf — version 1, not approved. Specified from
# IDEA-20261006-aaf1a8 / H-GFPN-6cc6aa. Status is review_required because
# the contract is not runnable in this session: there is no degree-4
# Macaulay driver and no trial plan. A trial plan requires status
# approved. Capacity was checked and is not the blocker.
# python3 tools/portfolio_kpis.py keys approved-unrun by goal_id.
# On origin/main, GOAL-GFPN-380702 has three approved contracts.
# EXP-GFPN-05ff43 has RUN-GFPN-0037fb. EXP-GFPN-726eb2 has
# RUN-GFPN-17ed52. EXP-GFPN-659e34 has only runs/.gitkeep.
# approved_unrun=1 against cap 3, headroom 2. area:GFPN, the fallback
# when goal_id is absent, has six approved contracts with no run.
# This contract sets goal_id, so check_approval_capacity would key on
# the goal. Approval is still withheld: an approved contract with no
# driver is not executable. Success is the source idea's prediction:
# double-odd degree-4 rank ratio <= 1/2 and cofactor-1 ratio > 1/2.
# The concrete negative is a double-odd ratio > 1/2 with nonzero
# S_5-only ranks and no memory abort. This session did not compute a
# rank. Source idea bytes are blob
# 6c77952a97eae78739ef26290d4832dbaf834805.
# =============================================================================
experiment:
  id: EXP-GFPN-ef0adf
  hypothesis_id: H-GFPN-6cc6aa
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  source_idea: IDEA-20261006-aaf1a8
  version: 1
  title: >-
    Degree-4 Macaulay rank ratio of the (Z/2)^4 rtimes S_5 quotient
    on a toy double-odd curve
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-f71d33
    withheld_reason: >-
      The launcher is missing. newest_experiments.py reports
      execution_state needs_implementation_or_plan when no trial plan
      exists. A trial plan requires status approved, frozen true, and
      a hash-bound driver. No driver is in this commit, and this
      session did not compute a degree-4 rank. Capacity is not the
      blocker: GOAL-GFPN-380702 holds one approved contract with no
      run, EXP-GFPN-659e34, against cap 3. check_approval_capacity
      would accept an approval of a runnable contract with this
      goal_id. It is not asked to, because the contract is not
      runnable. area:GFPN holds six approved contracts with no run;
      this specification sets goal_id so the validator keys on the goal.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval adds a driver and freezes a trial plan,
      work only at degree 4, only on the smallest admissible p' and
      one larger p'' where the matrix still fits, and only on the
      three frozen curve roles. Do not run F4 to completion. Do not
      use p' = 4111. Do not use y^2 = x^3 + x + 1. Do not claim
      D = 2^16 and do not change the exponent 8/5.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the double-odd degree-4 Macaulay rank ratio is
    <= 1/2 and the cofactor-1 ratio is > 1/2. The concrete negative
    is a double-odd ratio > 1/2 after the S_5-only ranks are nonzero
    and the run is not a memory abort. No faster discrete-logarithm
    algorithm is in scope.

  inputs:
    field: >-
      The smallest prime p' >= 3 such that F_{p'^5} contains all
      three curve roles below. The extension polynomial is the monic
      irreducible of degree 5 with least coefficients in
      lexicographic order. The driver, when it exists, records that
      polynomial. p' = 4111 is forbidden even if it is otherwise
      admissible.
    double_odd: >-
      A nonsingular curve y^2 = x(x^2 + a x + b) over F_{p'^5} with
      b a nonsquare and exactly one F_{p'^5}-rational point of
      order 2. The curve y^2 = x^3 + x + 1 is not used.
    cofactor_1: >-
      A nonsingular ordinary curve over the same field whose group
      order is prime. The formal substitution is t = u + c/u for a
      frozen nonzero c that is not translation by a rational
      2-torsion point of this curve.
    rational_torsion_not_double_odd: >-
      One ordinary curve over the same field with a rational
      2-torsion point that is not a double-odd model. Its degree-4
      ratio is recorded. It chooses the equation_special row and
      does not by itself choose success.
    presentations: >-
      On each arm, the S_5-only symmetrization of the m = 5
      summation system, and the (Z/2)^4 rtimes S_5 quotient on the
      double-odd arm. The cofactor-1 arm uses the formal
      t-substitution in place of the group quotient. Degree-4
      Macaulay ranks only. No Gröbner basis to completion.
    second_prime: >-
      The next prime p'' > p' at which the degree-4 matrix still
      fits in the memory watch. HEUR-1 compares the two ratios.
      A gap larger than a factor of 2 fails HEUR-1 and does not
      by itself choose the reading row of the first prime.

  controls:
    - id: s5-nonzero
      statement: >-
        The S_5-only degree-4 rank is nonzero on every scored arm.
        A zero rank is instrument_failure.
    - id: nonsingular
      statement: >-
        Each curve has nonzero discriminant. A zero discriminant
        voids the run.
    - id: torsion-census
      statement: >-
        The double-odd arm has exactly one rational point of order
        2. The cofactor-1 arm has none. A miss voids the run.
    - id: memory
      statement: >-
        A memory abort is infrastructure. It is not a ratio and it
        is not the negative row.
    - id: excluded-instances
      statement: >-
        p' = 4111 is not used. y^2 = x^3 + x + 1 is not used.
        Using either voids the run.

  independent_variables:
    - which arm is scored: double-odd, cofactor-1, or rational 2-torsion that is not double-odd
    - the base prime, p' or p''
    - whether the presentation is S_5-only or the quotient or the formal substitution

  metrics:
    primary:
      - id: ratio_double_odd
        statement: >-
          Degree-4 Macaulay rank of the (Z/2)^4 rtimes S_5 quotient
          divided by the degree-4 Macaulay rank of the S_5-only
          system, on the double-odd arm. The idea's prediction is
          <= 1/2. The concrete negative is > 1/2.
    secondary:
      - id: ratio_cofactor_1
        statement: >-
          The same ratio for the formal substitution on the
          cofactor-1 arm. The idea's prediction is > 1/2. A value
          <= 1/2 is the second negative.
      - id: ratio_other_torsion
        statement: >-
          The same ratio on the ordinary curve that has a rational
          2-torsion point and is not double-odd.
      - id: rank_s5
        statement: the degree-4 S_5-only rank on each arm, an integer
      - id: rank_quotient
        statement: the degree-4 quotient or substitution rank on each arm
      - id: memory_bytes
        statement: >-
          memory used, so an abort can be labelled infrastructure
      - id: torsion_ok
        statement: whether the rational 2-torsion census matches the arm

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the rank ratio does not depend on p' once the system
    is not degenerate. The second prime is that check. A factor
    larger than 2 between the two primes fails HEUR-1 and is written
    beside the row. It does not replace the first prime's ratio test.

  preregistered_prediction:
    quantity: >-
      The two degree-4 Macaulay rank ratios on the smallest
      admissible p', plus the same ratios at the next prime that
      still fits, plus the non-double-odd rational-2-torsion ratio.
    formula: >-
      ratio_double_odd <= 1/2 and ratio_cofactor_1 > 1/2. The
      concrete negative is ratio_double_odd > 1/2 while the S_5-only
      ranks are nonzero and the run is not a memory abort.
      ratio_cofactor_1 <= 1/2 is a second negative. Source idea
      IDEA-20261006-aaf1a8. No rank was computed before this formula
      was written.
    source: >-
      IDEA-20261006-aaf1a8, predictions minimum_effect <= 1/2 and
      > 1/2. KR-IC-46d822, KR-IC-955fd6, KR-IC-e2d81b, and
      KN-OPEN-9b4a2b were opened in this session. They do not state
      these two ratios.

  scale_relevance:
    tier: toy
    justification: >-
      The smallest admissible p' is below the question's 10-bit toy
      window and far below p = 2^64 - 2^32 + 1. No transfer to that
      prime is assumed. HEUR-1 is tested only by comparing two small
      primes. The minimum effect is the idea's own factor of 2.
    correspondence: >-
      Direct construction of the summation presentations over
      F_{p'^5}. No Deuring correspondence is used.

  tail_checks:
    - >-
      ratio_double_odd <= 1/2 meets the prediction. A value > 1/2
      with the instrument checks passed is the negative. No third
      threshold is introduced after the ranks are seen.
    - >-
      If the two primes differ by more than a factor of 2, HEUR-1
      fails. The reading row of the first prime is still chosen from
      the ratios alone.

  replication:
    seeds:
      - EXP-GFPN-ef0adf|claim|deterministic
    independent_instances: 1
    note: >-
      One later manifest would cover both primes and all three curve
      roles. No run id is minted in this session. The replication
      plan does not name a future run slot, because the trial plan
      is not frozen while status is review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen ladder. Wall-clock
      and CPU figures are not set. The 4 GB figure is machine
      protection for one degree-4 matrix. A watchdog expiry is
      failed_infrastructure, not a rank ratio. p' = 4111 stays
      excluded because a previous degree-33 matrix exhausted memory.

  stopping_rules:
    - Stop after a reading row is named from the first prime's ratios.
    - Do not change the threshold 1/2 after seeing a rank.
    - Do not run F4 to completion.
    - A timeout or memory abort voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A zero discriminant, a torsion census miss, a zero S_5-only rank, use of p' = 4111, or use of y^2 = x^3 + x + 1 voids the run.
    - Scoring any presentation other than the frozen S_5-only system, the group quotient, and the formal substitution voids the run.
    - Treating a degree-4 rank as a measurement of the ideal degree D voids the run.

  success_criterion: >-
    The instrument checks pass, ratio_double_odd <= 1/2,
    ratio_cofactor_1 > 1/2, and the non-double-odd rational
    2-torsion arm also has ratio <= 1/2. The first two inequalities
    are the prediction of IDEA-20261006-aaf1a8. The third is required
    because that idea's falsification list treats a drop special to
    the double-odd equation as a failure of the translation claim.
    The conjunction is reachable as a failure when the instrument
    checks pass and ratio_double_odd > 1/2.

  falsification_criterion: >-
    The instrument checks pass and ratio_double_odd > 1/2. That is
    the concrete negative. A cofactor-1 ratio <= 1/2 is a second
    negative and is not this sentence. A drop that appears only on
    the double-odd equation, and not on the other rational
    2-torsion curve, is a third negative and is not this sentence.
    A calibration failure and a memory abort are not this negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that this toy sample has
      ratio_double_odd <= 1/2, ratio_cofactor_1 > 1/2, and a drop on
      the other rational 2-torsion curve as well. The exponent stays
      8/5. No knowledge entry is promoted from this design record,
      and D = 2^16 is not claimed.
    on_negative: >-
      A later evidence review may record that this toy sample has
      ratio_double_odd > 1/2 with the instrument checks passed, so
      the degree-4 factor-of-two claim is falsified here only. The
      exponent stays 8/5. The two outcomes name different
      inequalities.

  required_artifacts:
    - experiments/EXP-GFPN-ef0adf/runs/RUN-*/manifest.yaml
    - experiments/EXP-GFPN-ef0adf/runs/RUN-*/raw-result.json
    - experiments/EXP-GFPN-ef0adf/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        a discriminant is 0, the torsion census misses, an S_5-only
        rank is 0, p' = 4111 is used, or y^2 = x^3 + x + 1 is used
    - id: infrastructure
      when: the linear algebra aborts for memory or the process times out
    - id: ratio_above_half
      when: >-
        the instrument checks pass and ratio_double_odd > 1/2
    - id: null_also_drops
      when: >-
        the instrument checks pass, ratio_double_odd <= 1/2, and
        ratio_cofactor_1 <= 1/2
    - id: equation_special
      when: >-
        the instrument checks pass, ratio_double_odd <= 1/2,
        ratio_cofactor_1 > 1/2, and the non-double-odd rational
        2-torsion curve does not drop
    - id: factor_of_two
      when: >-
        the instrument checks pass, ratio_double_odd <= 1/2,
        ratio_cofactor_1 > 1/2, and the non-double-odd rational
        2-torsion arm has ratio <= 1/2
  reading_rule: >-
    Name exactly one row. factor_of_two is the only success row, and
    only when the non-double-odd rational 2-torsion arm also drops.
    If that arm does not drop, the row is equation_special, which is
    a negative about the translation reading. ratio_above_half is
    the concrete negative. null_also_drops is the second negative.
    instrument_failure and infrastructure are not ratios. Record
    both ratios, the third arm's ratio, both ranks, the memory
    figure, the torsion census, and attack_claimed false beside the
    row. Those fields do not change the row. If the third arm is
    not yet classified when the first two ratios already fail, name
    ratio_above_half or null_also_drops and still record the third
    ratio when it exists.
