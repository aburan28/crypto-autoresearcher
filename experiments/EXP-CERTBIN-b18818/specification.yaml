# EXP-CERTBIN-b18818
# Intersection dimensions of two degree windows. No census.
# Approved by DEC-20261002-326444.
experiment:
  id: EXP-CERTBIN-b18818
  hypothesis_id: H-CERTBIN-7ce0f4
  source_idea: IDEA-20260926-9c5694
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Intersection dimensions of two degree windows
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-326444
  objective: >-
    Count the even degrees in the windows below 9 and below 33.
    Check that the doubled top degrees stay below the field degrees.
    Show the tuple ratio is exactly 2^{-64}. Reject the floor counts
    4 and 16.
  inputs:
    windows:
      - {n: 17, degree_cap: 9, doubled_top: 16, d1: 5, evens: [0, 2, 4, 6, 8], floor_half: 4}
      - {n: 131, degree_cap: 33, doubled_top: 64, d1: 17, floor_half: 16}
    reductions:
      sixteen_below_17: true
      sixty_four_below_131: true
    tuples:
      four_times_17: 68
      group_exponent: 132
      difference: -64
      factorial: 24
      ratio_exact_power: -64
    overlap_powers:
      two_d_minus_one_17: 9
      two_to_9: 512
      two_d_minus_one_131: 33
  controls:
    - >-
      Dimension 4 at n = 17 is false. That is the floor of 9/2 and
      it drops the constant term. Reporting 4 invalidates the run.
    - >-
      Dimension 16 at n = 131 is false. That is the floor of 33/2.
      Reporting 16 invalidates the run.
    - >-
      A reduction at n = 17 is false. 16 is strictly below 17.
      Reporting a reduction invalidates the run.
    - >-
      A tuple ratio other than 2^{-64} is false when both counts
      are divided by 24. Reporting another exponent invalidates
      the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - window
    - route in {even_degrees, repeat_module}
  metrics:
    primary:
      - d1
      - no_reduction
      - ratio_exponent
      - floor_half_rejected
      - implementations_agree
    secondary:
      - overlap_powers
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two intersection dimensions and one ratio exponent.
    formula: >-
      The doubled top degree is twice the largest degree in the
      window. Even degrees from 0 through that largest degree are
      the intersection when the doubled top stays below the field
      degree. Their count is one more than the floor of the window
      dimension over 2. The tuple ratio exponent is 4*17 - 132.
    source: >-
      IDEA-20260926-9c5694 names d_1 = 5 at n = 17, d_1 = 17 at
      the degree-33 window, and a correlation near 2^{-64}, read
      2026-10-02. The counts were recomputed in this design
      session. That computation is not a run. The ratio of the two
      tuple counts is exactly 2^{-64}. No census was run.
  scale_relevance:
    tier: toy
    justification: Degree counting. No transfer to a correlation.
    correspondence: null
  tail_checks:
    - The degree-33 window is required. Stopping after n = 17 and still reporting dimension 17 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If dimension 4 is reported at n = 17, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - Dimension 4 is reported at n = 17.
    - Dimension 16 is reported at n = 131.
    - A reduction is reported at n = 17.
    - The tuple ratio exponent is reported as anything but -64.
    - A census or a correlation is reported.
  success_criterion: >-
    Both runs agree on dimensions 5 and 17, the even list at n = 17,
    both no-reduction bits, the exponent -64, the factorial 24, and
    the powers 512 and 33. Dimension 4 stays rejected at n = 17.
    The ratio stays exactly 2^{-64}.
  falsification_criterion: >-
    The runs agree, dimension 4 stays rejected, the ratio exponent
    stays -64, and any dimension or exponent differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-CERTBIN-b18818/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-b18818/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-b18818/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-b18818/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-b18818/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-b18818/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any orbit census, correlation, or attempt generator.
    - A claim that conjugate targets are independent or are not.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
