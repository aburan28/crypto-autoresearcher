# EXP-SSI-587b14
# Distinct-neighbor count at one supersingular vertex, p = 67.
# Not approved: the degree-2 Vélu census driver is missing.
# IDEA-20261006-300758 / H-SSI-21eec4. No run is minted.
experiment:
  id: EXP-SSI-587b14
  hypothesis_id: H-SSI-21eec4
  source_idea: IDEA-20261006-300758
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  version: 1
  title: >-
    Distinct codomain j-count n for the three order-2 kernels of
    y^2 = x^3 + x over F_67
  status: review_required
  frozen: false
  designed_at: '2026-10-07'
  approved_by: null
  execution_authorized: false
  objective: >-
    On E: y^2 = x^3 + x over F_67, confirm #E(F_67) = 68, compute the
    three Vélu codomain j-invariants of the order-2 kernels in
    F_{67^2}, and test whether the number n of distinct values
    satisfies |n - 3| >= 1.
  inputs:
    p: 67
    curve: "y^2 = x^3 + x"
    field: "F_67[z]/(z^2 + 1)"
    expected_point_count: 68
    velu:
      t: "3 x_T^2 + 1"
      w: "x_T t"
      codomain: "y^2 = x^3 + (1 - 5 t) x + (0 - 7 w)"
  controls:
    - >-
      The source point count is 68, and each codomain is supersingular
      by the trace test over its field of definition. A different
      source count invalidates the census.
    - >-
      For each codomain, one dual 2-isogeny returns a curve with j(E).
      Failure invalidates the Vélu formula for that kernel.
    - >-
      Exactly three roots of x(x^2 + 1) are used. A missing root
      invalidates n.
    - >-
      Rebuilding E from its j and repeating the census yields the same
      set of codomain j-invariants.
  independent_variables:
    - the three roots x_T of x(x^2 + 1) in F_{67^2}
  metrics:
    primary:
      - absolute difference |n - 3|
      - n
    secondary:
      - point_count_E
      - kernel_x_count
      - codomain_j_list
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: absolute difference |n - 3|
    formula: >-
      n is the number of distinct j-invariants among the three Vélu
      codomains. The prediction is |n - 3| >= 1, with n in 1..3.
    source: >-
      IDEA-20261006-300758 predictions, read 2026-10-07. The prediction
      is the idea's own metric, direction different, minimum effect 1.
      It is not taken from a run.
  scale_relevance:
    tier: toy
    justification: >-
      One prime p = 67 and one curve. No transfer to any larger prime
      or to path-finding is claimed. Exponent delta against the opened
      Õ(p^{1/4}) baseline is 0.
    correspondence: null
  tail_checks:
    - >-
      Sample size one has no tail. n = 3 is the negative outcome, not
      a discarded sample.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: >-
      One deterministic census on one curve. No future run slot is
      named and no RUN id is minted.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one defined census or one invalidation.
    - A crash or timeout is incomplete, not a negative result.
  invalidation_rules:
    - p = 67 fails a primality check.
    - "#E(F_67) is not 68."
    - x(x^2 + 1) does not have three roots in F_{67^2}.
    - A dual 2-isogeny fails to restore j(E).
    - Rebuilding E from its j changes the set of codomain j-invariants.
    - A path, a distance, or a cut-set is computed.
  success_criterion: >-
    The census is defined: point_count_E is 68, kernel_x_count is 3,
    every dual 2-isogeny restores j(E), and the rebuild agrees. n lies
    in {1, 2}, so |n - 3| is at least 1.
  falsification_criterion: >-
    The census is defined under the same controls, n lies in 1..3, and
    n equals 3. Equality is a real result, not an invalid run.
  decision_impact:
    on_positive: >-
      Record that at least two of the three order-2 kernels share a
      codomain j-invariant at p = 67, so |n - 3| >= 1. The hypothesis
      may move to analyzed only after a run receipt. The opened
      baselines Õ(p^{1/2}) and Õ(p^{1/4}) stay as stated in KN-TECH-024
      and KN-LIT-078. No path is found.
    on_negative: >-
      Record that n equals 3 at this vertex, so the distinct-neighbor
      defect is absent here. The inequality is rejected in that exact
      scope. The same baselines stay unchanged. No other vertex is
      closed.
  required_artifacts:
    - experiments/EXP-SSI-587b14/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSI-587b14/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-587b14/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSI-587b14/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSI-587b14/runs/<RUN-ID>/raw-result.json
  assigned_to: executor
  missing_driver: >-
    No committed program factors x(x^2 + 1) over F_{67^2}, sets
    t = 3 x_T^2 + 1 and w = x_T t, forms the codomain
    y^2 = x^3 + (1 - 5 t) x + (0 - 7 w), and writes point_count_E,
    kernel_x_count, n, and codomain_j_list.
    harness/isogeny_class.py velu_odd refuses even ell, including
    ell = 2, and states that even-degree isogenies need a dedicated
    formula this module does not implement. There is no trial-plan.json.
    This replication plan names no run slot, so no RUN id is minted.
  out_of_scope:
    - Any prime other than 67.
    - A path, a distance, or a partition of edges into an internal set and a cut set.
    - A claim that changes the opened path-finding exponents.
