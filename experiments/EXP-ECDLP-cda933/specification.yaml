# EXP-ECDLP-cda933
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-25c616.
experiment:
  id: EXP-ECDLP-cda933
  hypothesis_id: H-ECDLP-c9f704
  source_idea: IDEA-20261004-096316
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 4095
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-25c616
  objective: >-
    Check the counts 12, 11, and 11, the product 1452, and the nearby gap 0.
  inputs:
    bit_length: 12
    doublings: 11
    additions: 11
    length_gap: 1
    doubling_gap: 0
    digit_product: 1452
    digit_sum: 34
    nearby_a: 11
    nearby_b: 11
    nearby_gap: 0
    nearby_product: 121
  controls:
    - >-
      The bit length is 12. The doubling count is 11. The addition
      count is 11. Reporting the addition count as 12 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twelve exceeds eleven by 1. Eleven equals eleven, so that gap
      is 0. The product of 12, 11, and 11 is 1452. Their sum is 34.
    - >-
      Two readings of the addition count are both 11. Their gap is
      0 and their product is 121.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 4095 has bit length 12, 11 doublings, and 11
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 12. Count 11 doublings. Count 11 additions.
      Multiply 12, 11, and 11. Subtract 11 from 11.
    source: >-
      IDEA-20261004-096316 states the counts 12, 11, and 11, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 1452 and the nearby gap 0 are required. A check that stops at the bit length 12 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 11 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 12.
    - The doubling count is not 11.
    - The addition count is not 11.
    - The product is not 1452.
    - The addition count is reported as 12, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 12, that the doubling
    count is 11, that the addition count is 11, and that the product
    of those three counts is 1452.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 11.
  required_artifacts:
    - experiments/EXP-ECDLP-cda933/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-cda933/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-cda933/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-cda933/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-cda933/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-cda933/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
