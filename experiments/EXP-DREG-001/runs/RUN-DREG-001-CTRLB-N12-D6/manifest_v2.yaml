  deviations:
  - id: DEV-1
    what: Invocation 1 was stopped by the executor with SIGTERM immediately after
      unit 5 completed and its checkpoint was durably written (next_col = 60000, rank_acc
      = 60000, done = false), then invocation 2 resumed from that checkpoint.
    why: 'Invocation 1 was launched with --wall-cap 2620 --reserve 90. That stopping
      heuristic projects the next unit''s cost from the PREVIOUS unit''s wall time,
      which over-estimates the cost of the final, half-width tail chunk; combined
      with heavy contention from an unrelated co-driver process on the same host (load
      average 13.3 on 14 logical CPUs, per-unit walls 15-25 percent above the committed
      full-null baseline) it projected a refusal of the last chunk inside the budget.
      Intervening at unit 5 was chosen because the cost of a resume grows monotonically
      with the number of accumulated carrier pivots (measured: about 12.5 s per 10364-pivot
      carrier block), so an early stop is the cheapest correction available.'
    impact_on_the_measurement: 'None mathematically. The block-staircase rank is the
      sum of per-sub-chunk new pivots and is independent of where the column loop
      is interrupted; the resume re-verified the run identity and re-hashed every
      carrier checkpoint before continuing. Cost: 796.66 s of invocation-1 wall of
      which about 73 s of a sixth in-flight unit was discarded, plus 58 s of carrier
      reload.'
    recorded_as: protocol deviation, disclosed; not a rerun and not a discarded result
  - id: DEV-2
    what: Invocation 2 used --chunk-force 11404 instead of 12000, so the 114035 remaining
      columns were covered by 10 near-equal chunks (9 x 11404 plus a final 11399)
      instead of 9 x 12000 plus a 6035-wide tail.
    why: To remove the tail-chunk bias in the stopping heuristic described in DEV-1,
      so the budget projection for the final unit would be accurate rather than roughly
      2x conservative.
    impact_on_the_measurement: None. The exact rank is the sum of new pivots per column
      sub-chunk and is chunk-size independent (the instrument's quotient argument
      holds for any partition of the column set); the coverage audit verifies the
      resulting partition of [0, 174035) directly. Both chunk sizes are recorded per
      invocation and every chunk boundary is in chunk-coverage.log and raw-result.json.
    recorded_as: protocol deviation, disclosed
  - id: DEV-3
    what: The task instruction named src/h012c_block_m4ri.py as the instrument; the
      run executes it through a thin task-specific driver (code/ctrlb_restricted_rank.py)
      that calls that module's kernel functions unchanged (process_subchunk, save_carry,
      load_carries, load_state, save_state, monosets_hash, file_hash) on a column-restricted
      view of col_rows.
    why: The instrument's own run_ti entry point hard-restricts the arm tag to {"sem",
      "null"} and keys its adjacency cache to a full-support system hash, so a restricted
      column set cannot be expressed through it without editing a committed, hash-pinned
      instrument. The driver leaves src/ untouched (its sha256 still matches the BATCH-002
      receipt) and adds the identity, restriction, coverage, and bracket audits this
      task requires.
    impact_on_the_measurement: The GF(2) arithmetic is the instrument's, unmodified.
      The driver contributes the column restriction and the audits. The driver's rank
      loop was validated end-to-end against Sage's direct rank before the measurement
      (see verification.extra_check_instrument_selftest).
    recorded_as: implementation note, disclosed
