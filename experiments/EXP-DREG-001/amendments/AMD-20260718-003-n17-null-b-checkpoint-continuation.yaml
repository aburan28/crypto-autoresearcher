    RUN-DREG-001-MEASURE-N17-NULL-B reached the frozen 7,200-second budget
    check after completing an indivisible column block. It exited cleanly with
    a valid checkpoint at column 360,000 of 384,168, but the preregistered
    full-column acceptance gate is not met. The partial rank is telemetry only.
  changes:
    - >-
      Preserve RUN-DREG-001-MEASURE-N17-NULL-B unchanged with terminal status
      cancelled_by_budget and create the distinct successor
      RUN-DREG-001-MEASURE-N17-NULL-B-CONT-1.
    - >-
      Seed the successor from a copied, hash-verified checkpoint and adjacency
      cache. The successor may process only columns [360000, 384168) using the
      identical system, code, seed, arm, degree, and chunk_force=20000.
    - >-
      Allocate at most one continuation invocation, 3,600 wall-clock seconds,
      and 5 GB peak memory. The continuation's timing and resource values are
      not comparable to a fresh partition run and are excluded from timing
      inference.
    - >-
      Require an independent validator after completion. Any checkpoint,
      carrier, adjacency-cache, code, or system-identity mismatch invalidates
      the continuation and resets confirmatory status to require a fresh run.
