amendment:
  id: AMD-20260718-002
  experiment_id: EXP-DREG-001
  created_at: 2026-07-18T20:27:30Z
  type: preregistered_execution_detail
  objective: >-
    Freeze the two full-column checkpoint partitions for the first new n=17,
    D=5 Semaev and support-matched-null cells before either rank is observed.
  fixed_inputs:
    n: 17
    t: 3
    target_index: 0
    degree: 5
    seed: 2026
    semiregular_prediction: 126922
  partitions:
    A:
      chunk_force: 24000
    B:
      chunk_force: 20000
  execution_order:
    - sem_A
    - sem_B
    - null_A
    - null_B
  acceptance_gate:
    - Every invocation processes every matrix column and reaches a terminal checkpoint.
    - The two runs within an arm have identical system hashes, ranks, predictions, and deficits.
    - Any partition mismatch invalidates the cell and returns the instrument to validation.
    - The null rank is measured; the prediction 126922 is not substituted for a run.
    - No n=17 value enters a fit or hypothesis verdict until both partitions in both arms pass.
  resource_policy:
    wall_clock_seconds_per_run: 7200
    maximum_memory_gb: 40
    execution: serialized
    sage_cache: experiments/EXP-DREG-001/runtime/sage
  interpretation: >-
    These are toy-scale measurement cells. Even a lower Semaev rank is only a
    degree-5 deficit observation until the frozen d_reg, d_ff, growth, controls,
    and complete ECDLP cost path are satisfied.
