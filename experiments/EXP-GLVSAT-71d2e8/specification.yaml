experiment:
  id: EXP-GLVSAT-71d2e8
  hypothesis_id: null
  hypothesis_id_note: >-
    Prime-field encoding experiment. The existing RQ-SATIC-1ae57a evidence is
    binary/low-degree-extension scoped and explicitly forbids prime-field
    transfer. This contract creates and validates a separate prime-field
    modular-arithmetic encoding before asking whether GLV symmetry helps SAT.
  question_id: RQ-EQIC-8cb959
  related_question_ids:
    - RQ-SATIC-1ae57a
    - RQ-ICPERF-94c86e
    - RQ-EQJ-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    GLV-aware SAT for prime-field point decomposition: exact modular encoding,
    orbit symmetry breaking, and solver-cost comparison against F4

  objective: >-
    Establish whether an exact Boolean/bit-vector encoding of toy prime-field
    Semaev point decomposition can exploit the order-3 GLV action to reduce
    search, and whether any such reduction survives the cost of encoding finite
    field arithmetic. No binary-field SAT speedup is imported as a prior result
    for this arm.

  scope_boundary:
    existing_sat_lane: >-
      RQ-SATIC-1ae57a covers Weil-descended binary and low-degree extension-field
      systems. Its prime-field transfer is explicitly unsupported.
    new_object: >-
      Short-Weierstrass j=0 prime-field PDP with complete GLV factor-base orbits,
      encoded exactly over integers/bits modulo p.
    no_claim: >-
      This experiment cannot claim that SAT replaces Groebner bases in general.
      It measures one prime-field encoding family at toy sizes.

  encoding_design:
    arithmetic: >-
      Freeze one exact modular-arithmetic circuit for addition, multiplication,
      reduction modulo p, equality, and conditional selection. Clause/gate cost
      is part of the primary accounting.
    independent_encoder_check: >-
      Build two semantically independent small-instance encoders before scaling:
      (A) a bit-vector/SMT reference model and (B) the CNF or CNF-XOR model used
      by the timed SAT solver. For exhaustive cells, both solution sets must
      match each other and exhaustive curve truth.
    polynomial_model: >-
      Encode the identical orbit-lifted Semaev/factor-base system used by
      EXP-GLVF-8dee36 where practical, so F4 and SAT solve the same mathematical
      instance rather than different formulations.
    GLV_action: >-
      The encoder exposes the simultaneous x_i -> beta*x_i, t -> beta*t action
      and complete factor-base orbit labels. Symmetry breaking is permitted only
      after a syntactic and semantic action certificate is produced.

  arms:
    - id: ARM_SAT_RAW
      description: >-
        Exact prime-field SAT encoding with no GLV-specific symmetry breaker.
    - id: ARM_SAT_GLV_CAN
      description: >-
        Same CNF plus canonical representative constraints selecting one member
        of each valid C3 solution orbit, with exact reconstruction of all omitted
        orientations.
    - id: ARM_SAT_GLV_BRANCH
      description: >-
        Same clauses as ARM_SAT_RAW but a branching policy that chooses orbit
        representative variables before orientation variables. No clauses are
        added; this isolates branching-order effects from formula shrinkage.
    - id: ARM_F4
      description: >-
        Matched F4 solver on the identical algebraic instance and target set.
    - id: CTRL_GENERIC_J
      description: >-
        Generic-j matched prime-field system with the same arithmetic encoder
        but no GLV C3 constraints.
    - id: NULL_FAKE_ACTION
      description: >-
        Frozen random permutation of factor-base labels with the same cycle-size
        histogram as C3 but not induced by phi. The semantic action checker must
        reject it.

  inputs:
    procedure: >-
      Stage 0 freezes the modular arithmetic implementation and the two
      independent encoders. Stage 1 exhaustively enumerates all decompositions on
      the smallest cells and requires exact SAT/SMT/curve-truth agreement.
      Stage 2 proves the GLV variable permutation maps clauses/constraints to the
      same formula or to the corresponding target-orbit formula. Stage 3 emits
      ARM_SAT_RAW and ARM_SAT_GLV_CAN from the same encoder and records clause,
      literal, XOR, auxiliary-variable, and gate counts. Stage 4 runs the fixed
      SAT solvers and branching policy with pinned seeds. Stage 5 runs ARM_F4
      and independently verifies every returned relation.
    parameter_grid:
      bit_sizes: [7, 8, 9, 10, 11, 12]
      arities: [2, 3]
      seeds: [20260918, 20260919, 20260920]
      SAT_UNSAT_split: >-
        Construct and report satisfiable and unsatisfiable target strata
        separately. Never pool their runtimes.
      solver_panel: >-
        At minimum one complete CDCL solver with assumptions and one solver with
        native XOR if the encoding contains parity clauses. Versions and build
        hashes are pinned.

  controls:
    - >-
      Exhaustive semantic equivalence: exact solution-set agreement among SAT,
      SMT reference, and curve enumeration at the smallest sizes.
    - >-
      Action certificate: applying the declared C3 variable permutation to a
      satisfying assignment yields the transformed satisfying assignment and
      reconstructs the correct target orientation.
    - >-
      NULL_FAKE_ACTION must fail semantic certification before timing.
    - >-
      Canonicalization count: on free C3 solution orbits the canonical arm must
      retain exactly one of three assignments; fixed/exceptional orbits are
      enumerated and reported separately.
    - >-
      ARM_SAT_GLV_BRANCH uses exactly the raw formula, proving whether branching
      order rather than clause reduction drives any speedup.
    - >-
      Encoder construction, clause generation, parsing, and reconstruction are
      all charged in end-to-end results.

  metrics:
    primary:
      - encoding_seconds
      - clause_count
      - literal_count
      - xor_clause_count
      - auxiliary_variable_count
      - total_boolean_variables
      - SAT_conflicts
      - SAT_decisions
      - SAT_propagations
      - SAT_seconds
      - peak_rss_bytes
      - solutions_or_relations_returned
      - verified_relations
      - total_seconds_per_verified_relation
      - SAT_and_UNSAT_metrics_reported_separately
    secondary:
      - orbit_solution_count_raw
      - orbit_solution_count_canonical
      - exceptional_orbit_count
      - reconstruction_seconds
      - branch_depth_to_first_solution
      - learned_clause_count
      - learned_clause_bytes
      - GLV_breaker_clause_count
      - GLV_breaker_literal_count
      - charged_ratio_GLV_CAN_over_RAW
      - charged_ratio_GLV_BRANCH_over_RAW
      - charged_ratio_best_SAT_over_F4

  benchmark_contract:
    SAT_method_reference: RQ-SATIC-1ae57a
    prime_field_baseline: ARM_F4
    icperf_reference: RQ-ICPERF-94c86e
    decision_metric: >-
      Conflicts/decisions as hardware-robust solver metrics plus total charged
      seconds per verified relation. Formula size alone and SAT wall time without
      encoding cost are insufficient.
    success_threshold: >-
      A GLV SAT arm must reduce median conflicts or decisions by at least 30%
      versus ARM_SAT_RAW and charged total time by at least 20% at two consecutive
      sizes with exact solution equivalence. To count as competitive with the
      algebraic incumbent, it must also beat ARM_F4 in charged time on the same
      cells.
    encoder_gate: >-
      If encoding cost exceeds 25% of charged total at the largest completed
      size, report SAT solve time and end-to-end time separately and forbid any
      claim based on solve time alone.

  preregistered_predictions:
    - >-
      Pure orbit canonicalization can remove up to a constant factor of symmetric
      assignments but may not materially reduce CDCL conflicts if the arithmetic
      circuit dominates propagation.
    - >-
      Branching on representative variables before orientation variables may
      recover most of the canonicalization benefit with fewer added clauses.
    - >-
      A binary-field SAT advantage is not expected to transfer automatically
      because modular prime-field multiplication/reduction creates a much larger
      Boolean encoding.

  scale_relevance:
    tier: toy
    correspondence: >-
      secp256k1 provides the same beta/lambda symmetry but a 256-bit modular
      arithmetic circuit is far outside the measured ladder. Any extrapolation
      must separately model encoder growth and is not part of this experiment.

  stopping_rules:
    - Stop before scaling if SAT/SMT/exhaustive truth disagree.
    - Stop before GLV timing if the semantic action certificate fails.
    - SAT and UNSAT cells retain separate caps and separate summaries.
    - Preserve proof/certificate output for UNSAT where the solver supports it.
    - Do not change arithmetic circuit style or symmetry-breaking clauses after seeing timed results.

  invalidation_rules:
    - Any encoding collision or missing assignment invalidates all performance results.
    - Any omitted encoder or reconstruction cost invalidates an end-to-end speedup claim.
    - Any pooled SAT/UNSAT runtime is invalid.
    - Any comparison with ARM_F4 solving a different polynomial instance is invalid.
    - Any returned relation failing independent curve verification invalidates the run.
    - Timeout, crash, or memory exhaustion is failed infrastructure, never negative evidence.

  success_criterion: >-
    Produce independently validated prime-field SAT encodings and a paired
    measurement of raw, GLV-canonical, GLV-branching, and F4 arms with exact
    solution equivalence and full encoding costs. Scientific success is a valid
    result whether or not SAT wins.

  falsification_criterion:
    - >-
      GLV symmetry breaking reduces assignment multiplicity but not conflicts,
      decisions, or charged runtime.
    - >-
      Added breaker clauses increase propagation cost enough to erase the
      constant-factor solution-space reduction.
    - >-
      Prime-field arithmetic encoding dominates total cost and F4 remains faster.
    - >-
      Any apparent effect is reproduced by generic-j controls or is attributable
      solely to branching order rather than GLV semantics.

  required_artifacts:
    - specification.yaml
    - manifest.yaml
    - command.txt
    - environment.json
    - raw-result.json
    - arithmetic-circuit-spec.md
    - smt-reference-instances/
    - cnf-instances/
    - encoder-equivalence.json
    - action-certificate.json
    - solver-metrics.jsonl
    - verification-report.json

  source_refs:
    - RQ-SATIC-1ae57a
    - RQ-EQIC-8cb959
    - RQ-ICPERF-94c86e
    - EXP-GLVF-8dee36
    - research/ideas/glv_index_calculus_experiment_matrix.md

  assigned_to: executor
  approved_by: null
