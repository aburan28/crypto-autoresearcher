# EXP-ECDLP-dd2d89
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-b44ece.
experiment:
  id: EXP-ECDLP-dd2d89
  hypothesis_id: H-ECDLP-5116a2
  source_idea: IDEA-20261004-a56f16
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-14 table versus width-13 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-b44ece
  objective: >-
    Check the table sizes 8192 and 4096, the product 33554432, and the nearby gap 0.
  inputs:
    width_hi: 14
    width_lo: 13
    table_hi: 8192
    table_lo: 4096
    table_gap: 4096
    table_product: 33554432
    table_sum: 12288
    nearby_a: 4096
    nearby_b: 4096
    nearby_gap: 0
    nearby_product: 16777216
  controls:
    - >-
      Two to the power 13 is 8192. Two to the power 12 is 4096.
      Reporting both tables as size 4096 drops the gap and invalidates
      the run.
    - >-
      Eight thousand one hundred ninety-two exceeds four thousand
      ninety-six by 4096. The product of the two sizes is 33554432.
      Their sum is 12288.
    - >-
      Two width-13 tables each store 4096. Their gap is 0 and their
      product is 16777216.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-14 table stores 8192 entries. The width-13 table stores
      4096. The gap of two width-13 tables is 0.
    formula: >-
      Compute 2 to the power 13. Compute 2 to the power 12. Subtract
      4096 from 8192. Multiply 8192 by 4096. Subtract 4096 from 4096.
    source: >-
      IDEA-20261004-a56f16 states the widths 14 and 13 and the sizes
      8192 and 4096, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 33554432 and the nearby gap 0 are required. A check that stops at the size 8192 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 8192 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 13 is not 8192.
    - Two to the power 12 is not 4096.
    - The gap is not 4096.
    - The product is not 33554432.
    - Both tables are reported as size 4096, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-14 table stores 8192 entries, that
    the width-13 table stores 4096, and that 8192 exceeds 4096 by 4096.
  falsification_criterion: >-
    The runs agree that the width-14 table size is computed, and
    that size is not 8192.
  required_artifacts:
    - experiments/EXP-ECDLP-dd2d89/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-dd2d89/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-dd2d89/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-dd2d89/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-dd2d89/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-dd2d89/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 4096 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
