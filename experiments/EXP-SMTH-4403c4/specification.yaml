experiment:
  id: EXP-SMTH-4403c4
  hypothesis_id: H-SMTH-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  question_id: RQ-ECDLP-002
  batch_id: BATCH-028
  authorizing_decision_id: DEC-20260801-011
  open_item_discharged: OPEN-BATCH023-A
  version: 1
  supersedes_version: null
  protocol_amendment_id: null
  title: >-
    Direct finite-X smoothness measurement of HEUR-DS-1: LPF and B-smoothness
    of half-arity Semaev ENC-B intermediates against a MEASURED null at the
    actual X, with i<j enumeration excluding the diagonal by construction
  status: approved
  approved_by: coordinator
  approved_by_note: >-
    Approved-shape freeze under TASK-20260802-80f5e9 implementing DEC-20260801-011
    rank-1 / OPEN-BATCH023-A. This file is frozen before any datum. The measurement
    task (TASK-20260802-6a39f8) re-hashes this file against freeze_receipt.json and
    HALTS on mismatch. EXP-SMTH-001 is NOT reused (unapproved; DEC-20260801-011).
  frozen: true
  frozen_on: '2026-08-03'
  frozen_by_task: TASK-20260802-80f5e9
  claim_tier: toy
  confirmatory_status: exploratory

  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    resolved_model_id: unrecorded
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c

  freeze_rule: >-
    This contract is frozen by TASK-20260802-80f5e9. Any needed change is a NEW
    superseding experiment id under a new specification.yaml. Editing this file
    after freeze_receipt.json records its sha256 is an integrity failure, never a
    result. No protocol_amendment may alter decision rules after any calibration
    or treatment datum exists; a rule change requires a fresh EXP id and fresh seeds.

  # ==================================================================
  why_this_is_a_fresh_contract:
    statement: >-
      EXP-SMTH-001 was never approved and never run; its asymptotic-Dickman
      calibration and i<=j enumeration are the named defects OPEN-BATCH023-A
      repairs. This contract does not edit, amend, version, or inherit by
      reference any decision rule, threshold number, or reading branch of
      EXP-SMTH-001, EXP-SMTH-002, EXP-EQD-001, EXP-DEP-001, or EXP-DS-001.
      Lessons only: measure the null at the actual X; exclude the diagonal by
      construction; freeze numeric rules before any datum.
    immutable_artifacts_not_touched:
      - experiments/EXP-SMTH-001
      - experiments/EXP-SMTH-002
      - experiments/EXP-EQD-001
      - experiments/EXP-DEP-001
      - experiments/EXP-DS-001

  # ==================================================================
  heuristic_under_test: HEUR-DS-1
  heuristic_statement: >-
    Intermediate degrees arising from half-arity Semaev partial maps on uniform
    random targets behave, for B-smoothness purposes, like uniform random integers
    of the same size. At finite X this is tested by comparing the measured LPF /
    smoothness law of the encoded intermediates to a MEASURED null distribution of
    uniform integers on the identical support [1, X], not to the asymptotic
    Dickman function rho.
  dickman_rho_prohibition: >-
    The asymptotic Dickman function rho is NOT the calibration of this experiment
    and MAY NOT be substituted for the measured null at the actual X. No KS
    threshold, rate-band bound, or tail threshold in this contract is derived from
    rho, from u**(-u), or from any other asymptotic smoothness model. Rho may
    appear only as optional descriptive annotation that is never a decision input.

  # ==================================================================
  objective: >-
    At each toy field size bits in {16, 20}, construct one ordinary prime-field
    curve and a deterministic factor base of Bfb = 512 distinct x-coordinates;
    enumerate EVERY unordered half-tuple with STRICT index order 0 <= i < j < 512
    (exactly C(512, 2) = 130816 pairs — diagonal absent by construction); form the
    ENC-B integer N_ij in [1, X] with X = p^2; factor every N_ij; and decide,
    under thresholds that are named order statistics of a MEASURED null
    distribution at that same X, whether the LPF / smoothness law of {N_ij}
    is distinguishable from uniform integers on [1, X].

  what_this_experiment_is_NOT:
    - Not a search, relation harvest, claw table, or discrete-logarithm computation.
    - Not a cost / wall-clock / charged-unit measurement.
    - Not a crypto-scale, medium-scale, affected-scheme, or asymptotic claim under any outcome.
    - Not a reuse or re-score of EXP-SMTH-001 or of any asymptotic-rho decision rule.
    - Not sufficient alone to move G1-G4 or to declare HEUR-DS-1 valid above toy tier.

  claim_ceiling: >-
    TOY ONLY. Claimable at most: a scoped toy-tier consistency or deviation of the
    named ENC-B intermediate smoothness law versus the measured null at the two
    tested field sizes, under the frozen rules below. NOT claimable: crypto-scale
    validity or invalidity of HEUR-DS-1; any exponent; any scheme impact;
    dominated_by null; GOAL-ECDLP-001 completion.

  # ==================================================================
  # THE SMOOTHNESS QUANTITY (stated directly — not by reference to EXP-SMTH-001)
  smoothness_quantity:
    id: Q-SMTH-4403c4
    name: ENC-B LPF and finite-X smoothness law of half-arity Semaev intermediates
    intermediate_map:
      id: INT-SMTH-4403c4
      arity_m: 4
      d_half: 2
      polynomial: >-
        For distinct factor-base x-coordinates x_i, x_j in F_p, form
        S_3(x_i, x_j, Z) = c2 Z^2 + c1 Z + c0 over F_p, with
        c2 = (x_i - x_j)^2 mod p,
        c1 = -2*((x_i+x_j)*(x_i*x_j+a)+2*b) mod p,
        c0 = (x_i*x_j - a)^2 - 4*b*(x_i+x_j) mod p.
      invariants: >-
        e1 = (-c1) * c2^(-1) mod p, e2 = c0 * c2^(-1) mod p, lifts in [0, p).
      encoding_ENC_B: >-
        N = lift(e1) * p + lift(e2) + 1. Support exactly [1, p^2].
      actual_X: >-
        X = p^2 for the cell's field prime p. Every null draw, every rate bound
        B_u, and every z-transform uses this exact integer X — never D = 2^(2*bits)
        as a substitute support, and never an asymptotic model in place of X.
    primary_observables_per_integer:
      - N
      - sorted prime-power factorization of N
      - LPF(N), with LPF(1) = 1
      - z(N) = ln(max(1, LPF(N))) / ln(X)   # natural logs
      - I_u(N) = 1 if LPF(N) <= B_u else 0, for each frozen rung u
    smoothness_rungs:
      u_values: [2, 3, 4, 5]
      bound_rule: B_u = max(2, floor(X^(1/u)))
      smooth_rate: q_u = (1/n) * sum_j I_u(N_j)
      powered_rungs: >-
        A rung u is POWERED for rate-band decisions iff the measured null
        reference rate q_u(REF) satisfies n * q_u(REF) >= 30. Unpowered rungs are
        recorded and feed the tail diagnostic but are excluded from RATE-BAND
        pass/fail. The power cut is fixed here before any datum.
    sample_transforms:
      empirical_lpf_cdf: empirical CDF of the multiset {z(N_j)}
      ks_two_sample: >-
        D = sup_t |F_A(t) - F_B(t)| on the z-values of two equal-length samples A, B
      deep_smooth_tail_mean: >-
        T_8 = mean of the 8 smallest z-values in the sample (deep-smooth end).
        If the sample has fewer than 8 finite z-values, the run fires M-0.

  # ==================================================================
  enumeration:
    id: ENUM-IJ-STRICT
    rule: >-
      Enumerate factor-base index pairs by the STRICT generator
      for i in 0..Bfb-1: for j in (i+1)..Bfb-1: yield (i, j).
      Equivalently: all pairs (i, j) with 0 <= i < j < Bfb.
    diagonal_exclusion: >-
      BY CONSTRUCTION. The generator never yields i == j. There is no
      post-enumeration filter, drop, mask, or "skip undefined" step. The diagonal
      is absent because the nested loops never produce it.
    pair_count_n: 130816
    pair_count_derivation: C(512, 2) = 512*511/2 = 130816
    leading_coefficient_invariant: >-
      Distinct x-coordinates and i < j imply c2 = (x_i - x_j)^2 != 0 mod p.
      Any recorded c2 == 0 is an integrity failure (M-0), not a datum.
    forbidden: >-
      Enumerating i <= j and then dropping the diagonal, or sampling with
      replacement from a smaller support, is forbidden.

  factor_base:
    Bfb: 512
    notation: >-
      Bfb = factor-base size. B_u = smoothness bound at rung u. Never write both as B.
    policy: frozen_deterministic_subset
    construction: >-
      First 512 x-coordinates in F_p, in increasing integer order, that are
      x-coordinates of points of E(F_p) for the cell's frozen curve (a, b, p).
      Record factor_base_sha256 over the canonical decimal newline-joined x-list.

  curve_family:
    field_bits: [16, 20]
    curves_per_bit_size: 1
    toy_only: true
    master_seed: 2801
    seed_domain: EXP-SMTH-4403c4/v1
    seed_rule: >-
      seed(label, bits, stream_index) = first_128_bits(SHA256(
      "EXP-SMTH-4403c4/v1|" || label || "|" || decimal(bits) || "|" ||
      decimal(stream_index))).
    prime_rule: >-
      Start at 2^(bits-1) + (seed("prime", bits, 0) mod 2^(bits-2)); take the
      first prime strictly below 2^bits; advance deterministically on rejection.
    curve_rule: >-
      Derive a, b from successive SHA256 blocks of seed("curve", bits, 0); reject
      until 4*a^3 + 27*b^2 != 0 mod p.
    bits_labelling: >-
      `bits` names the FIELD prime p only. No deliverable may say "at 20 bits"
      without stating that it is the field.

  # ==================================================================
  objects:
    - id: OBJ-REAL
      role: the quantity HEUR-DS-1 is about
      description: >-
        Exhaustive ENC-B integers N_ij over ENUM-IJ-STRICT on the frozen
        deterministic factor base. Count exactly n = 130816. No sampling seed.
    - id: OBJ-NULL-REF
      role: fixed reference null replicate (replicate index 0)
      description: >-
        n = 130816 i.i.d. uniform integers on [1, X], drawn by rejection sampling
        from unbiased SHA256-derived bits (modulo reduction forbidden), stream
        seed("null", bits, 0).
    - id: OBJ-NULL-CAL
      role: measured null calibration replicates
      description: >-
        M_CAL = 200 independent replicates, each of n = 130816 uniform integers
        on the SAME [1, X], streams seed("null", bits, r) for r = 1..200.
        These replicates ARE the measured null distribution at the actual X.
    - id: OBJ-PLANT
      role: gross power certificate only — never evidence about HEUR-DS-1
      description: >-
        Draw uniform U on [1, X] via seed("plant", bits, 0); factor U; retain only
        prime powers with prime <= B_4; set N_plant to their product (or 1).
        Emit n such integers and push through the identical pipeline.

  sample_size:
    n_per_arm: 130816
    M_CAL: 200
    bit_sizes: 2
    planned_factorizations_order_of_magnitude: >-
      Declared parameters only: 1 real + 1 ref + 200 cal + 1 plant per bit size,
      times 130816, times 2 bit sizes. Exact completed counts are recorded at
      measurement time; this freeze task produces none.

  # ==================================================================
  null_calibration:
    id: CAL-NULL-X
    statement: >-
      BEFORE any OBJ-REAL integer is generated or factored, measure the null
      distribution at the actual X: compute every decision statistic on
      (OBJ-NULL-CAL[r] vs OBJ-NULL-REF) for r = 1..200, archive the 200 values
      per statistic per bit size, and SUBSTITUTE the named order statistics
      below as the numeric thresholds. Commit null_calibration.json before the
      treatment arm begins.
    asymptotic_rho_forbidden_here: >-
      Substituting Dickman rho, a rho-band, or any asymptotic KS critical value
      for these measured order statistics is a protocol violation and fires M-0.
    exchangeability: >-
      REF and each CAL replicate are i.i.d. uniform on [1, X] at matched n, so a
      fresh uniform sample is exchangeable with the calibration pool.

  # ==================================================================
  # PRE-REGISTERED NUMERIC DECISION RULES (formulas; no post-data choice)
  decision_rules:
    frozen_before_any_datum: true
    freeze_binding_task: TASK-20260802-80f5e9

    ks_rule:
      id: KS-SMTH-4403c4
      statistic: >-
        D_real = two-sample KS distance on z-values between OBJ-REAL and
        OBJ-NULL-REF at the same bit size.
      calibration_replicates: >-
        For r = 1..200, D_r = two-sample KS on z-values between OBJ-NULL-CAL[r]
        and OBJ-NULL-REF.
      threshold_formula: >-
        thr_KS = the 199th ascending order statistic of {D_1, ..., D_200}.
      reject_rule: D_real > thr_KS
      pass_rule: D_real <= thr_KS
      exact_null_level: >-
        P(fresh uniform exceeds the 199th of 200 exchangeable null replicates)
        = (201 - 199) / 201 = 0.00995 on the measured null, by construction.
      numeric_constants_pre_registered:
        M_CAL: 200
        order_statistic_index_ascending_1_based: 199
        alpha_exact_on_measured_null: 0.00995

    rate_band_rule:
      id: RATE-BAND-SMTH-4403c4
      statistic_per_powered_u: >-
        delta_u_real = |q_u(OBJ-REAL) - q_u(OBJ-NULL-REF)|
      calibration_per_powered_u: >-
        For r = 1..200, delta_u,r = |q_u(OBJ-NULL-CAL[r]) - q_u(OBJ-NULL-REF)|
      threshold_formula: >-
        thr_RATE_u = the 199th ascending order statistic of
        {delta_u,1, ..., delta_u,200}.
      band_statement: >-
        Equivalently, q_u(OBJ-REAL) lies in the closed interval
        [q_u(REF) - thr_RATE_u, q_u(REF) + thr_RATE_u]. Those two endpoints ARE
        the pre-registered numeric rate-band bounds once CAL-NULL-X is committed.
      reject_at_u: delta_u_real > thr_RATE_u
      pass_at_bit_size: >-
        RATE-BAND passes at a bit size iff for EVERY powered u in {2,3,4,5},
        delta_u_real <= thr_RATE_u.
      fail_at_bit_size: negation of pass_at_bit_size
      numeric_constants_pre_registered:
        M_CAL: 200
        order_statistic_index_ascending_1_based: 199
        u_ladder: [2, 3, 4, 5]
        min_expected_smooth_for_power: 30

    tail_rule:
      id: TAIL-SMTH-4403c4
      statistic: >-
        T_real = mean of the 8 smallest z-values of OBJ-REAL;
        T_ref = mean of the 8 smallest z-values of OBJ-NULL-REF;
        tau_real = |T_real - T_ref|.
      calibration: >-
        For r = 1..200, tau_r = |T_CAL[r] - T_ref| with T_CAL[r] the mean of the
        8 smallest z-values of OBJ-NULL-CAL[r].
      threshold_formula: >-
        thr_TAIL = the 199th ascending order statistic of {tau_1, ..., tau_200}.
      reject_rule: tau_real > thr_TAIL
      pass_rule: tau_real <= thr_TAIL
      why_not_rho: >-
        The asymptotic rule n * min_j rho(u_j) >= 1 false-fires on correct finite-X
        nulls. This rule uses only the measured deep-smooth order-statistic null.
      numeric_constants_pre_registered:
        M_CAL: 200
        order_statistic_index_ascending_1_based: 199
        deep_smooth_order_count_k: 8

    bit_size_pass: >-
      A completed bit size PASSES the HEUR-consistency conjunction iff
      KS-SMTH-4403c4 pass AND RATE-BAND-SMTH-4403c4 pass AND TAIL-SMTH-4403c4 pass,
      after M-0 and M-5 have not fired.
    bit_size_reject: >-
      A completed bit size REJECTS the HEUR-consistency conjunction iff at least
      one of KS, RATE-BAND, or TAIL rejects, after M-0 and M-5 have not fired.

  plant_control:
    id: CTRL-PLANT-B4
    required_before_treatment_reading: true
    pass_rule: >-
      At each bit size, KS between OBJ-PLANT and OBJ-NULL-REF must reject at
      thr_KS (same formula), AND delta_4(OBJ-PLANT, REF) must reject at
      thr_RATE_4. Failure suspends under M-5; it is not a HEUR-DS-1 result.
    non_claim: >-
      Certifies only that the apparatus detects gross B_4-smooth truncation.
      It does not certify power against subtle alternatives.

  # ==================================================================
  pre_registered_reading_rule:
    id: RR-SMTH-4403c4
    frozen_before_any_datum_exists: true
    precedence: >-
      M-0, then M-5, then exactly one of M-SUPPORT, M-REFUTE, M-SPLIT.
    branches:
      - id: M-0
        name: INTEGRITY GUARD
        condition: >-
          Any of: pair count != 130816; any i >= j in the enumerated index list;
          any c2 == 0; any N outside [1, X]; any factorization that fails
          independent reconstruction/primality re-check; null support or n
          mismatch; any use of Dickman rho as a decision threshold; timeout,
          crash, or budget cancellation; contract sha256 mismatch vs freeze
          receipt; treatment arm begun before null_calibration.json commit.
        disposition: >-
          Infrastructure / integrity signal. NEVER a mathematical result about
          HEUR-DS-1 (AGENTS.md rule 5).
        heuristic_verdict: none

      - id: M-5
        name: APPARATUS FAILURE
        condition: >-
          CTRL-PLANT-B4 fails at either bit size, OR OBJ-NULL-REF versus a held-out
          null stream (seed("null", bits, 201), n = 130816) itself rejects KS or
          RATE-BAND or TAIL at the calibrated thresholds (impossible for a correct
          uniform apparatus at the declared level except with exact probability
          ~0.01 per test).
        disposition: MAP SUSPENDED. Instrument failure. No HEUR-DS-1 verdict.
        heuristic_verdict: none

      - id: M-SUPPORT
        name: TOY-TIER SUPPORT FOR HEUR-DS-1
        condition: >-
          No M-0, no M-5, AND bit_size_pass at BOTH bits 16 and bits 20.
        disposition: >-
          At the tested toy cells, under INT-SMTH-4403c4 / ENC-B / Bfb=512 /
          measured-null thresholds, the intermediate smoothness law is NOT
          distinguishable from the measured uniform null. This is SCOPED TOY-TIER
          SUPPORT for HEUR-DS-1's finite-X "like uniform integers on [1,X]" limb.
          Explicitly NOT crypto-scale validation; NOT asymptotic support; NOT
          movement of G1-G4; NOT `supported` for H-SMTH-001 without replication.
        heuristic_verdict: support_at_toy_scope
        hypothesis_transition_ceiling: >-
          Evidence may record direction consistent_with / strengthen toward
          replicate; Coordinator alone may change H-SMTH-001 status.

      - id: M-REFUTE
        name: TOY-TIER REFUTATION OF HEUR-DS-1
        condition: >-
          No M-0, no M-5, AND bit_size_reject at BOTH bits 16 and bits 20.
        disposition: >-
          At the tested toy cells, under the same frozen objects and measured-null
          thresholds, the intermediate smoothness law IS distinguishable from the
          measured uniform null. This is SCOPED TOY-TIER REFUTATION of HEUR-DS-1
          as instantiated here. Explicitly NOT crypto-scale refutation; NOT
          reject_scoped-as-impossibility on one unreplicated package; NOT a
          statement about other encodings, m, or Bfb.
        heuristic_verdict: refute_at_toy_scope
        hypothesis_transition_ceiling: >-
          Evidence may record direction against / weaken scoped; Coordinator alone
          may change H-SMTH-001 status, and must write status_scope.

      - id: M-SPLIT
        name: INCONCLUSIVE SPLIT
        condition: >-
          No M-0, no M-5, AND exactly one of the two bit sizes satisfies
          bit_size_pass while the other satisfies bit_size_reject.
        disposition: >-
          Inconclusive on HEUR-DS-1. Record both cells' statistics and thresholds.
          No post-hoc single-cell success or failure label. OPEN-BATCH023-A may
          close as attempted-and-inconclusive only by Coordinator decision.
        heuristic_verdict: inconclusive

    symmetric_support_and_refute: >-
      M-SUPPORT and M-REFUTE are symmetric: both require the same conjunction
      structure at BOTH bit sizes; both are scoped to the identical toy boundary;
      both are blocked by M-0/M-5; neither is crypto-scale. Support means
      indistinguishability from the measured null; refute means distinguishability
      from the measured null. An inconclusive split is first-class, not dressed
      as either.
    exhaustiveness: >-
      After M-0/M-5, each bit size is pass or reject. Both pass -> M-SUPPORT.
      Both reject -> M-REFUTE. Mixed -> M-SPLIT. No gap.

  # ==================================================================
  metrics:
    primary:
      - SMTH_ks_D_real
      - SMTH_ks_thr                     # 199th OS of CAL null-vs-ref KS
      - SMTH_ks_pass
      - SMTH_q_u_real                    # per powered u
      - SMTH_q_u_ref
      - SMTH_delta_u_real
      - SMTH_thr_RATE_u                 # 199th OS of CAL |q diffs|
      - SMTH_rate_band_pass
      - SMTH_tau_real
      - SMTH_thr_TAIL
      - SMTH_tail_pass
      - SMTH_bit_size_pass
      - SMTH_plant_ks_rejected           # must be true
      - SMTH_reading_branch             # M-0|M-5|M-SUPPORT|M-REFUTE|M-SPLIT
    secondary:
      - factor_base_sha256
      - null_calibration_sha256
      - pair_count_verified
      - diagonal_present_count          # must be 0
      - factorization_certificates_verified
      - peak_rss_bytes
      - wall_seconds_total               # budget accounting only

  controls:
    - id: CTRL-NULL-FIRST
      method: Commit measured null_calibration.json before any OBJ-REAL factorization.
      pass_condition: treatment arm entry point disabled until calibration artifact exists and hashes.
    - id: CTRL-IJ-CONSTRUCTION
      method: >-
        Verify the enumerated index list equals [(i,j) for i in range(512) for j in
        range(i+1, 512)] and len == 130816.
      pass_condition: exact match; diagonal_present_count == 0.
    - id: CTRL-RANGE
      method: Assert every N in [1, X] with X = p^2.
      pass_condition: no violation, else M-0.
    - id: CTRL-FACT
      method: >-
        Independent re-verification of every recorded factorization (primality of
        each factor + product reconstruction) on a path that does not reuse the
        factoring call.
      pass_condition: verified == total on every arm, else M-0.
    - id: CTRL-PLANT-B4
      method: Gross B_4-smooth truncation power certificate (see plant_control).
      pass_condition: must reject KS and RATE at u=4; else M-5.
    - id: CTRL-NO-RHO
      method: Grep decision path for any rho-based threshold substitution.
      pass_condition: zero hits in decision code and in applied thresholds.

  independent_variables:
    - field_bits: [16, 20]
    - object: [OBJ-REAL, OBJ-NULL-REF, OBJ-NULL-CAL, OBJ-PLANT]
  fixed_variables:
    arity_m: 4
    d_half: 2
    factor_base_size_Bfb: 512
    n_per_arm: 130816
    M_CAL: 200
    master_seed: 2801
    enumeration: ENUM-IJ-STRICT

  replication:
    master_seed: 2801
    runs_planned: 2
    planned_runs:
      - id: RUN-SMTH-4403c4-calib
        purpose: >-
          CAL-NULL-X at both bit sizes; commit thr_KS, thr_RATE_u, thr_TAIL;
          run CTRL-PLANT-B4; do NOT generate OBJ-REAL.
      - id: RUN-SMTH-4403c4-real
        purpose: >-
          After calibration commit and plant pass, generate OBJ-REAL at both bit
          sizes, evaluate KS / RATE-BAND / TAIL against frozen thresholds, emit
          reading branch.
    replication_status_declared: >-
      NONE claimed. A single unreplicated package cannot promote H-SMTH-001 to
      supported or reject_scoped.

  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 2
    new_dependencies: >-
      sympy factorint / isprime only (version recorded at runtime). No ECM, no
      external CAS, no network.
    stopping_rules_budget: >-
      Stop at wall-clock ceiling; short arms fire M-0 and are never padded.
      Budget exhaustion is resource_exhaustion, never a HEUR-DS-1 negative.

  stopping_rules:
    - Stop calibration when all 200 CAL replicates and REF and plant complete at both bit sizes, or at wall clock.
    - Do not begin OBJ-REAL until null_calibration.json is committed and CTRL-PLANT-B4 passes.
    - Stop treatment when OBJ-REAL completes at both bit sizes, or at wall clock.
    - Stop immediately on CTRL-FACT or CTRL-IJ-CONSTRUCTION failure.

  invalidation_rules:
    - Any edit of this specification after freeze_receipt.json without a new EXP id.
    - Any Dickman-rho threshold used as KS, rate-band, or tail decision input.
    - Any i <= j enumeration or post-hoc diagonal drop.
    - Null calibrated after seeing OBJ-REAL statistics.
    - Sample-size or threshold choice after seeing treatment data.

  success_criterion: >-
    S-SMTH-4403c4 — a complete valid package: calibration committed, plant control
    passed, both bit sizes at n = 130816 with 100 percent factorization
    re-verification, no M-0/M-5, and exactly one of M-SUPPORT, M-REFUTE, or
    M-SPLIT readable from RR-SMTH-4403c4. Success is completeness of the
    measurement, not a preferred HEUR verdict.

  falsification_criterion: >-
    F-SMTH-4403c4-REFUTE — branch M-REFUTE: HEUR-DS-1 fails at both toy cells
    under the measured-null rules (scoped toy refutation).
