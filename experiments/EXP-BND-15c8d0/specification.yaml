  controls:
    - >-
      A/A control arm (incumbent-aa): the incumbent run twice under shared
      seeds; the paired ratio must read exactly 1.0000 [1.000, 1.000] or
      the instrument is at fault.
    - >-
      Incumbent drift check: the incumbent's fresh ratio-to-floor must fall
      inside its recorded bound's 95 % interval (ECBND1h7b69b9787056 /
      ECBND1h1573ea580e89), else the verdict is inadmissible.
    - >-
      Replay-all audit: every one of the 288 measured records per session is
      re-executed and must reproduce byte-identically before the verdict is
      admissible.
    - >-
      Planted-target verification: every record must verify [k]P = Q against
      the planted scalar (status verified) or the arm is inadmissible.
    - >-
      Uncharged axis: counted-but-unpriced work is reported per arm; an
      uncharged shift against the candidate beyond tolerance 0.05 is
      flagged (uncharged_shift), never silently absorbed.
  independent_variables:
    - arm in {incumbent, candidate, incumbent-aa}
    - curve (4 per challenge; log2 r 17.70-23.97 prime, 15.37-21.00 koblitz)
    - target index (8 planted targets per curve, uniform_scalar_sha256_v1)
    - measured round (3, each with its own derived algorithm seed)
  metrics:
    primary:
      - paired ops ratio candidate / incumbent in ecbench.gae with cluster-bootstrap 95 % interval (verdict axes[ops])
      - paired memory ratio (table entries / sqrt r) with 95 % interval (verdict axes[memory])
      - verdict outcome in {advances, trade, matches, regresses, inadmissible} and advances_on / regresses_on / level_moved
      - candidate bound ratio_to_floor with 95 % interval and fitted alpha with 95 % interval over 4 sizes
    secondary:
      - uncharged ratio (reported, not deciding)
      - per-curve paired ratios with intervals
      - stage shares and paired stage ratios (setup, search, internal_verification)
      - incumbent drift (fresh vs recorded ratio-to-floor)
      - A/A control ratio
      - fits.exponent_moved
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Outcome class per challenge and the sign of each deciding axis
      (H-BND-3b83a3 P1, P2) plus exponent_moved (P3).
    formula: >-
      prime: ops ratio < 1 (interval excludes 1), memory ratio > 1 (interval
      excludes 1) => trade. koblitz: ops ratio < 1 and memory ratio < 1 (both
      intervals exclude 1) => advances at the constant level. Both:
      exponent_moved false.
    source: >-
      H-BND-3b83a3, written AFTER execution (see chronology). The only
      genuinely pre-registered element is the challenge's acceptance rule
      and the nonce-derived targets in the measuring repository.
  scale_relevance:
    tier: toy
    justification: >-
      Fields of 18-24 bits (prime) and extension degrees 17-29 (koblitz);
      r between 2^15.4 and 2^24.0. No transfer to medium or cryptographic
      sizes is assumed or claimed. The koblitz result in particular is a
      statement about a fixed set-up charge at sizes where sqrt(r) is a few
      hundred, and the sealed medium bound for the same incumbent
      (ECBND1h05a2ea918f3c, 1.089 [0.927, 1.261] x floor) shows the toy
      ordering must not be extrapolated.
    correspondence: null
  tail_checks:
    - per-curve paired ratios reported beside the pooled ratio; a pooled interval excluding 1 while every per-curve interval includes 1 is reported as such (prime), not hidden
    - incumbent drift inside the recorded interval in both challenges
  replication:
