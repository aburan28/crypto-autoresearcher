    - No further epoch is run under this contract; epoch 2 is a new contract.
  invalidation_rules:
    - Any measured record not verified, or any replay not reproduced, makes the arm inadmissible.
    - spec_matches false (session spec differs from the challenge-derived spec for the named epoch).
    - Incumbent drift outside the recorded interval.
    - Fewer than 4 sizes or fewer than 8 verified runs per size on either deciding arm.
    - A/A control ratio not equal to 1.0 under shared seeds.
    - An inadmissible verdict is infrastructure signal and never evidence for or against H-BND-3b83a3.
  success_criterion: >-
    Both verdicts admissible (audit ok, 288/288 replays reproduced, spec
    matches, drift inside) AND the prime verdict reads trade with ops in
    advances_on and memory in regresses_on AND the koblitz verdict reads
    advances with ops and memory in advances_on and level_moved constant AND
    both verdicts report exponent_moved false.
  falsification_criterion: >-
