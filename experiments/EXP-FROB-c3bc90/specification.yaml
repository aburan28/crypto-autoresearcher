# =============================================================================
# EXP-FROB-c3bc90 — version 1, approved by DEC-20261006-ea07a6. Frozen
# trace-gap comparison for IDEA-20261006-56d83f. Success is the idea's
# prediction: g_obj >= 0.15 and g_null <= 0.05. The concrete negative is
# that the instrument checks pass, both samples have size at least 100,
# the trace map is lossy, and g_obj < 0.15 or g_null > 0.05. This design
# session checked the field arithmetic, the discriminant residues, and
# that the relative trace vanishes on 25 of the 125 field elements. It
# did not enumerate either curve and did not record either gap. No
# discrete logarithm is authorized. Source idea bytes are blob
# d3de4d444ef46cc88fed4bfb9d84b8ac52d79bed.
# =============================================================================
experiment:
  id: EXP-FROB-c3bc90
  hypothesis_id: H-FROB-837de8
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_idea: IDEA-20261006-56d83f
  version: 1
  title: >-
    Trace-zero gap of summing triples versus shifted triples on
    y^2 = x^3 + x + 1 over F_{5^3}, against a null curve
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  designed_at: '2026-10-06'
  frozen: true
  execution_authorized: true
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-ea07a6
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null and
      the trial plan names a driver. Approval does not assert that the
      object gap is at least 0.15, does not assert that the null gap is
      at most 0.05, and does not assert that an exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only on y^2 = x^3 + x + 1 over F_5, with points in
      F_5[z]/(z^3 + z + 1), and on the null model named below. Count
      trace-zero proportions on matched summing triples and shifted
      triples. The discriminant, the modulus, the 20 Frobenius-trace
      identities, the dual group law, the uniform trace band, and the
      sample-size floor are instrument checks. The second shift 2T and
      the half-sample flag are written beside the row and do not choose
      it. Do not search for a discrete logarithm and do not add a curve
      to the claim. The single future run slot is RUN-FROB-671844. This
      decision does not launch it.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether g_obj >= 0.15 and g_null <= 0.05. The concrete
    negative is that the instrument checks pass, both samples have size
    at least 100, the object trace map is lossy, and at least one of
    those two inequalities fails. No faster discrete-logarithm
    algorithm is in scope.

  inputs:
    curve: >-
      p=5, A=1, B=1, model y^2 = x^3 + x + 1. The quantity
      4A^3+27B^2 equals 31, which is 1 mod 5, and the same quantity as
      a field element is (1, 0, 0). A zero discriminant is
      instrument_failure. The design session evaluated that residue and
      did not enumerate points.
    field: >-
      F_{125} = F_5[z]/(z^3 + z + 1). Coefficients use a0 + 5 a1 + 25
      a2. The relation z^3 + z + 1 = 0 is an instrument check. The
      polynomial t^3 + t + 1 has no root in F_5; the run recomputes
      that. The design session evaluated it at t = 0..4.
    trace: >-
      Tr(a) = a + a^5 + a^{25}. Trace zero means that sum is the zero
      element of F_5. On the whole field the design session counted 25
      zeros. That count is an instrument calibration of the trace map.
      It is not g_obj and it is not g_null.
    subset: >-
      Affine points, ordered by (x, y) via the integer encoding above.
      Infinity is excluded. T is the first point in that order. A
      relation sample of size under 100 on either curve voids the
      comparison.
    relation_arm: >-
      Ordered pairs (P, Q) of distinct affine points with R = -(P+Q)
      affine and with P, Q, R pairwise distinct, kept only when
      R+T is also affine and pairwise distinct from P and Q. p_rel is
      the fraction of those triples with Tr(x(P)+x(Q)+x(R)) = 0.
      p_shift is the fraction with R replaced by R+T. g_obj is the
      absolute difference. The shared list makes the two sample sizes
      equal.
    null_curve: >-
      y^2 = x^3 + x + z, with z^3 + z + 1 = 0. The design session
      evaluated 4 + 2 z^2 = (4, 0, 2), which is nonzero, so the run
      records this equation unless a recomputation finds the
      discriminant zero, in which case the constant becomes z+1 and
      the recorded equation changes. g_null is the same absolute gap
      on that curve. A zero null discriminant is instrument_failure.
    dual_sum: >-
      The first 20 accepted triples on each curve are summed with a
      Fermat inverse and with an extended-gcd inverse. Disagreement is
      instrument_failure. The driver is
      experiments/EXP-FROB-c3bc90/implementation/run.py. The checker is
      experiments/EXP-FROB-c3bc90/implementation/check.py. The field
      code is experiments/EXP-FROB-c3bc90/implementation/field.py.
    secondary: >-
      T' = 2T is applied to the same object triples when R+T' stays a
      pairwise distinct affine point. The resulting gap is recorded and
      does not choose the row. The first and second halves of the
      frozen object pair order are each required, for HEUR-1 only, to
      have a trace-zero proportion within 0.05 of p_rel. That flag
      does not choose the row. The count of points with y = 0 is
      recorded and does not choose the row.

  controls:
    - id: discriminant-control
      statement: >-
        31 mod 5 is recomputed and must be nonzero, and the field
        element 4A^3+27B^2 on the object curve must be nonzero.
    - id: modulus-control
      statement: >-
        z^3 + z + 1 reduces to 0, and t^3 + t + 1 has no root in F_5.
    - id: null-discriminant-control
      statement: >-
        The recorded null equation has nonzero discriminant, and its
        constant term is not in F_5.
    - id: frobenius-trace-control
      statement: >-
        On the first 20 accepted triples of each curve, applying the
        coordinate 5-power to every point leaves the trace of the sum
        of x-coordinates unchanged.
    - id: dual-sum-control
      statement: >-
        On those same 20 triples the Fermat addition and the
        extended-gcd addition return the same third point.
    - id: uniform-trace-control
      statement: >-
        The proportion of trace zero on the cyclic sample of single
        field elements, of length equal to the object relation sample,
        lies in [0.15, 0.25].
    - id: sample-size-control
      statement: >-
        The relation arm and the shift arm on each curve use one shared
        list, so their sizes are equal. Either curve under 100 voids
        the comparison.

  independent_variables:
    - whether the third point is R = -(P+Q) or the shifted point R+T
    - whether the curve is defined over F_5 or only over F_125
    - the second shift 2T, which does not choose the row

  metrics:
    primary:
      - id: trace_gaps
        statement: >-
          g_obj and g_null, the absolute gaps of trace-zero proportions.
          The idea's prediction is g_obj >= 0.15 and g_null <= 0.05.
          The concrete negative is that the instrument checks pass, both
          samples have size at least 100, the map is lossy, and
          g_obj < 0.15 or g_null > 0.05.
    secondary:
      - id: sample_sizes
        statement: the integers n_obj and n_null
      - id: zero_counts
        statement: the four trace-zero numerators, as integers
      - id: L
        statement: >-
          log2 of the mean fibre of the trace on the object relation
          sample. Lossy when n_obj >= 2 times the number of distinct
          trace values. The row not_lossy is a void, not the inequality
          negative.
      - id: second_shift
        statement: the 2T gap counts; these do not choose the row
      - id: halves
        statement: >-
          whether both halves lie within 0.05 of p_rel; this does not
          choose the row

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the 0.15 gap on relations against a uniform density of
    1/5. The half-sample flag is the tail check named in the source
    idea. If the halves differ from p_rel by more than 0.05, the report
    sets halves_close false and does not use HEUR-1 to interpret the
    gap. That flag does not change the reading row. Do not relabel an
    instrument failure as an inequality failure.

  preregistered_prediction:
    quantity: >-
      g_obj and g_null, the absolute differences of trace-zero
      proportions on summing triples and on shifted triples, for
      y^2 = x^3 + x + 1 over F_{5^3} and for the null model.
    formula: >-
      g_obj >= 0.15 and g_null <= 0.05. Comparisons are exact:
      20 |zeros_rel - zeros_shift| >= 3 n on the object curve, and
      20 |zeros_rel - zeros_shift| <= n on the null curve. The concrete
      negative is that the instrument checks pass, both samples have
      size at least 100, n_obj >= 2 times the trace-image size, and at
      least one of those two inequalities fails. A smaller object gap
      or a larger null gap is not a confirmation. Source idea
      IDEA-20261006-56d83f. Neither gap was counted before this formula
      was frozen.
    source: >-
      IDEA-20261006-56d83f, whose prediction is g_obj >= 0.15 and
      g_null <= 0.05. KR-IC-f5c584, KR-IC-46d822, KR-IC-5a43e5,
      KR-IC-fbdb61, KR-IC-b0fcda, and KN-FIND-ffe1df were opened in
      this session and do not state this proportion comparison.

  scale_relevance:
    tier: toy
    justification: >-
      The field has 125 elements. The question's toy window starts near
      2^16. No transfer from 125 elements to that window is assumed.
      The sample is one curve and one null curve, not a tail draw. The
      minimum effect is the idea's own gaps 0.15 and 0.05.
    correspondence: >-
      Direct enumeration of affine points in F_5[z]/(z^3 + z + 1).
      No Deuring correspondence is used.

  tail_checks:
    - >-
      Meeting both gaps is the prediction. Missing either one, with the
      map lossy and the samples large enough, is the negative. No third
      numeric band is introduced after the counts are seen.
    - >-
      The half-sample proportions are reported against a tolerance of
      0.05. They do not move the thresholds 0.15 and 0.05.

  replication:
    seeds:
      - EXP-FROB-c3bc90|claim|deterministic
    independent_instances: 1
    future_run_slot: RUN-FROB-671844
    note: >-
      One is the number of object curves scored. The computation is
      deterministic. The dual addition on 20 triples is the replication
      of the group law. RUN-FROB-671844 is the named future slot in the
      trial plan. This design session does not create that directory
      and does not launch the slot.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers both curves, the 20 identities, the
      uniform trace sample, the second shift, and the half-sample flag.
      Wall-clock and CPU figures are advisory and null. The 1 GB memory
      figure is machine protection for the point lists. A watchdog
      expiry is failed_infrastructure, not a value of either gap.

  stopping_rules:
    - Stop after a reading row is named.
    - Do not change the curve and do not replace 0.15 or 0.05 after seeing a count.
    - Do not let the second shift or the half-sample flag choose the row.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A zero discriminant, a modulus failure, a failed identity, a dual-sum disagreement, or a uniform trace proportion outside [0.15, 0.25] voids the run.
    - A sample under 100 on either curve voids the comparison. It is not the inequality negative.
    - A mean fibre below 2 voids the comparison. It is not the inequality negative.
    - Using the second shift or the half-sample flag to choose the reading row voids the run.
    - Scoring any curve other than the frozen object curve and the recorded null equation voids the run.

  success_criterion: >-
    The instrument checks pass, both samples have size at least 100,
    the object trace map has mean fibre at least 2, and g_obj >= 0.15
    and g_null <= 0.05. This is the prediction of IDEA-20261006-56d83f.
    It is reachable as a failure when those instrument conditions hold
    and g_obj < 0.15 or g_null > 0.05.

  falsification_criterion: >-
    The instrument checks pass, both samples have size at least 100,
    the object trace map has mean fibre at least 2, and g_obj < 0.15 or
    g_null > 0.05. That disjunction is the concrete negative named with
    the source idea. The prediction is the conjunction g_obj >= 0.15
    and g_null <= 0.05. An instrument failure, a short sample, and a
    mean fibre below 2 are voids, not this negative.

  decision_impact:
    on_positive: >-
      Record that this one trace gap met g_obj >= 0.15 and
      g_null <= 0.05 on y^2 = x^3 + x + 1 over F_125 and on the recorded
      null equation. Do not change the discrete-log exponent. Do not
      mark H-FROB-837de8 supported. A later review may schedule a
      replicate on a second odd prime. Explanation B stays a toy
      observation on this trace.
    on_negative: >-
      Record that explanation B failed on this instance because
      g_obj < 0.15 or g_null > 0.05 under the instrument conditions.
      Explanation A stays available for this trace. Do not close
      RQ-FROB-7d8dd4. Do not treat the failure as evidence about every
      linear functional, and do not treat it as a drop in Gaudry's
      exponent.

  required_artifacts:
    - experiments/EXP-FROB-c3bc90/runs/RUN-FROB-671844/manifest.yaml
    - experiments/EXP-FROB-c3bc90/runs/RUN-FROB-671844/raw-result.json
    - experiments/EXP-FROB-c3bc90/runs/RUN-FROB-671844/reading.yaml

  assigned_to: executor
  reading_rows:
    - instrument_failure
    - sample_under_100
    - not_lossy
    - gap_misses_claim
    - gap_meets_claim
  reading_row_rule: >-
    instrument_failure if the discriminant, modulus, null constant, or,
    once both samples have size at least 100, the 20 identities, the
    dual sums, or the uniform trace band fail. sample_under_100 if
    those cheap checks pass and either sample has size under 100.
    not_lossy if the instruments pass, the samples are large enough,
    and the mean fibre is below 2. gap_meets_claim if the instruments
    pass, the samples are large enough, the map is lossy, and
    g_obj >= 0.15 and g_null <= 0.05. gap_misses_claim otherwise under
    those same instrument conditions. Exactly one row is named.
