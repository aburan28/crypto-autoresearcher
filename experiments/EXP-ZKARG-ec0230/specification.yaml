experiment:
  id: EXP-ZKARG-ec0230
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-d1e544; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-d1e544
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure attained cheating advantage as a function of recursive composition depth for a toy
    self-verifying argument, against the layered accounting product and a random-predicate null, at
    depths one through four
  objective: 'The one uncertainty a run reduces: whether the soundness loss of recursive composition
    compounds the way layered accounting charges it, at depths where the attained advantage can be
    enumerated rather than bounded. Specifically (i) it establishes the single-layer attained advantage
    by full enumeration and verifies it against an independent computation, so the base of the ledger
    is checked before anything is composed; (ii) it enumerates the composed strategy space at depth
    two, recording the attained advantage and which layer the argmax cheat lived at, and extends to
    depths three and four under a declared composition rule whose output is labelled a lower bound
    throughout, producing a four-entry table of measured advantage, predicted product and signed bit
    residual; (iii) it runs the identical pipeline with the inner verifier replaced by a random predicate
    of matched acceptance density, so that any residual in the signal arm is attributable to the structural
    relationship between an inner verifier and an outer statement rather than to the enumeration or
    the composition rule, and so that agreement between arms is recorded as a controlled null. The
    run searches for no forgery, omits nothing from any transcript, and examines no system outside
    the protocol written for this contract.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the named toy protocol
      at the named parameters, with the named embedding and the declared composition rule, the attained
      cheating advantage at depths one and two and the lower bounds at depths three and four are the
      tabulated values, and their signed bit residuals against the layered product are the reported
      numbers, with the embedding cost per layer recorded as integers. What does NOT follow: anything
      about recursion at real depths or with real parameters; anything about extraction or knowledge
      soundness, which are not measured; anything about any deployed, third-party or standardized
      recursive proof system; that the layered accounting is wrong or right in general, since a four-point
      toy ledger cannot establish either; and no attack, break, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Freeze the layer-1 protocol, its parameters, the verifier
      circuit, the embedding, the composition rule for depths beyond enumeration, the node cap and
      the null construction. STAGE 1 (cost: one to two days of implementation) Build the verifier
      circuit and the embedding, and record the embedding cost per layer as integers. STAGE 2 (cost:
      under one hour) Enumerate the layer-1 strategy space, compute eps_1, and cross-check it against
      an independent closed-form computation; abort on disagreement. STAGE 3 (cost: minutes) Run the
      zero-advantage, full-advantage and domain-separation controls. STAGE 4 (cost: a few hours) Enumerate
      the depth-two composed strategy space within the node cap, recording the attained advantage
      and the argmax layer. STAGE 5 (cost: under one hour) Apply the declared composition rule at
      depths three and four and record the labelled lower bounds. STAGE 6 (cost: as stages 4 to 5)
      Run the random-predicate null through the identical pipeline in the same invocation. STAGE 7
      (cost: minutes) Tabulate the four-entry ledger with residuals and the null column. STAGE 8 (cost:
      equal to stages 4 to 6) Replay from the recorded seed and require identical counts before writing
      the run record.'
    instrument: Python 3, no Sage. A self-contained F_p module on Python integers; the layer-1 protocol
      and its verifier written as an explicit gate list evaluated by an independent evaluator; the
      embedding implemented as a statement generator that emits the outer statement from the inner
      verifier's gate list; strategy enumeration as an explicit iterative search with a node counter
      and a hard cap; hashlib for the per-layer Fiat-Shamir challenge with explicit layer-index domain
      separation. Execution is wrapped by harness/runner.py so commit, environment, timing, resources
      and seeds are captured and the run record is immutable, and each argmax composed strategy is
      emitted as a certificate whose acceptance the wrapper re-verifies with an independently written
      verifier.
    parameters: 'Prime p equal to 257 with challenge set of size 256 at every layer. Layer-1 attainable-set
      size d in {0, 4, 256} where 0 and 256 are controls. Verifier circuit at most 64 gates over F_257.
      Composition depths L in {1, 2, 3, 4}. Strategy-space node cap 2 to the 22 per layer. Random-predicate
      null with acceptance density matched to the verifier circuit''s, measured before the null runs.
      Domain separation by explicit layer index in every transcript. Seed count for any sampled component:
      4096, with binomial intervals reported. Embedding cost recorded per layer as statement size
      in field elements and maximum constraint degree.'
  controls:
  - Random-predicate null with matched acceptance density through the identical pipeline in the same
    invocation.
  - L equal to 1 degenerate control, where the measured advantage must equal eps_1 exactly.
  - Zero-advantage control with d equal to zero, where every layer must report advantage exactly zero.
  - Full-advantage control with d equal to q, where every layer must report advantage exactly one.
  - 'Domain-separation control: the same run with layer indices omitted from the transcript, which
    must change the measured advantage, confirming the instrument is sensitive to binding and that
    the main arm''s binding is doing work.'
  - Seed replay reproducing every enumeration count exactly.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: the identical L-layer pipeline with the inner verifier
    circuit replaced by a random predicate of the same input shape and the same acceptance density,
    so the outer statement has the same size and the same honest acceptance probability but carries
    no structural relationship to the inner protocol. This runs in the same invocation as the signal
    arm, through the identical enumeration and the identical accounting comparison. For the signal
    arm to mean anything the null must show a residual consistent with zero at every L, since a random
    predicate offers nothing to reuse across layers and its layered advantage must be the plain product.
    If the null shows the same residual shape as the signal arm, the residual is a property of the
    enumeration or of the composition rule rather than of recursion, and the record closes as a controlled
    null. A second null sets L equal to 1, where composition is vacuous and the measured advantage
    must equal eps_1 exactly.'
  independent_variables:
  - composition depth L
  - layer-1 attainable-set size d
  - arm (structured verifier versus random predicate null)
  - transcript domain separation on or off, for the sensitivity control
  metrics:
    primary:
    - attained cheating advantage per depth L
    - accounting's predicted product per L
    - signed bit residual per L
    - argmax layer of the cheat per L
    - null-arm advantage and residual per L
    secondary:
    - embedding cost per layer in statement size and constraint degree
    - strategy space node count per layer
    - enumeration wall time and peak memory per layer
    - count of cells that hit the node cap and were labelled lower bounds
    - domain-separation control delta
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The attained cheating advantage a[L] at each composition depth, and the signed bit residual
      R[L] defined as log2 a[L] minus log2 of the accounting's predicted L-layer error.
    formula: 'Accounting prediction: P[L] equals eps_1 to the power L plus the sum over layers of
      the embedding term, where eps_1 equals d over q and the embedding term is pre-registered as
      the ratio of the embedded verifier''s soundness error to the challenge space, computed from
      the recorded embedding cost. Pre-registered null hypothesis: R[L] equals zero for every L within
      counting error. Pre-registered structure: a[L] is non-increasing in L, a[1] equals eps_1 exactly,
      a[L] equals zero identically when d equals zero, and a[L] equals one identically when d equals
      q.'
    source: Pre-registered in the parent proposal IDEA-20260816-d1e544 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p equal to 257 with a 64-gate verifier and depths one through four,
      chosen because the composed strategy space is enumerable at depth two within the node cap and
      the base advantage is exactly computable. Transfer assumption, stated and deliberately weak:
      nothing measured at four toy layers is claimed to describe recursion at any real depth, and
      the reported quantity is the shape of the residual over four points, not a law. Depths three
      and four are lower bounds under a declared rule and are excluded from any statement about shape
      unless the rule''s effect is separately reported.'
    correspondence: null
  tail_checks:
  - Report the single composed strategy achieving the argmax advantage at depth two and confirm an
    independent verifier accepts it.
  - Inspect whether the argmax cheat concentrates at one layer across seeds, since a shifting argmax
    layer is the tail behaviour that would indicate the enumeration is not finding a stable optimum.
  - Report the depth-two cells that hit the node cap and confirm they are labelled as lower bounds
    rather than folded into the headline.
  - Report the largest embedding cost across layers, since embedding growth is the mechanism most
    likely to distort the residual at the deepest layer.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the depth-one measurement disagrees with the independently computed eps_1 or if either
    degenerate control fails.
  - Stop enumerating a layer once the node cap is reached and label that cell a lower bound.
  - Cap total wall time at eight hours; truncation reduces the depth range and is recorded as a budget
    outcome, never as evidence about composition.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if depth-one agrees with the independent eps_1, all degenerate
    controls pass, the domain-separation control shows a nonzero delta, and the four-entry ledger
    of measured advantage, predicted product and signed residual is reported alongside the null column
    and the per-layer embedding costs, whether or not any residual is nonzero.
  falsification_criterion:
  - Depth-one measurement disagrees with the independently computed eps_1.
  - Zero-advantage or full-advantage control fails.
  - The advantage vector increases with L, indicating a mis-specified composition rule.
  - The null arm reproduces the signal arm's residual shape, closing the record as a controlled null.
  - Every residual is consistent with zero, falsifying the conjecture of a measurable composition
    deviation at these depths and closing with the obstruction and required depth named.
  - The domain-separation control shows no delta, showing the instrument cannot attribute effects
    to binding versus composition.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-d1e544
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The embedding, expressing the layer-1 verifier as a statement of the same protocol family, is
    described but not constructed; the Coordinator must confirm it is possible at these parameters
    before approval, since the whole contract rests on it.
  - The composition rule used at depths three and four must be written down explicitly and ruled on,
    because a rule that forbids cross-layer reuse produces geometric decay by construction and would
    answer the question by assumption.
  - How the embedding term in the accounting prediction should be computed from the recorded embedding
    cost needs a formula the Coordinator fixes, otherwise the residual is measured against a moving
    target.
  - Whether the domain-separation sensitivity control belongs in this contract at all, given that
    transcript binding across a composition boundary is owned by IDEA-20260809-82c5f5.
