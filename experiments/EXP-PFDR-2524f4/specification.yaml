experiment:
  id: EXP-PFDR-2524f4
  hypothesis_id: H-PFDR-064546
  question_id: RQ-ECDLP-001
  idea_id: IDEA-20260829-b5a2c8
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation.
  title: >-
    A zero-compute exponent derivation for two-term m = 2 prime-field index
    calculus, gated first by an extension-field kill check and a baseline
    reproduction, then by a COMPUTED statement of whether the four-point ladder
    can separate the power-law reading from the subexponential label at all --
    because with the subexponential constant free, the source idea factor-4 band
    contains BOTH readings and cannot fire.
  claim_ceiling: >-
    A derivation plus an achievability and constant check, and an AUDIT of one
    committed complexity label. No ECDLP hardness result, no lower bound on any
    algorithm outside the two-term family, nothing about arity at least 4, and no
    status change to any knowledge finding. A contradiction is not a verdict.
  claim_tier_basis: >-
    Toy tier for the measured arm; DERIVATION tier for the exponent statements.
    Every recovered logarithm carries a certificate re-verified independently of
    the solver, per RQ-ECDLP-001 constraints.
  objective: >-
    Establish, IN THIS ORDER: (1) that the accounting is not broken, by an
    extension-field instantiation that must NOT return a no-go where index
    calculus demonstrably works; (2) that it reproduces the committed per-trial
    charge and the committed BKK speedup interval; (3) the symbolic exponent
    table with its stationarity verified numerically; (4) THE COMPUTED SEPARATING
    POWER of the measurement ladder at the subexponential constant pinned from
    the single committed cell the audited label rests on; (5) the smoothness
    parameter search, which is the cheapest possible falsifier of the whole
    record; and only then (6) the measured operation counts, interpreted only if
    (4) passes, with a CURVE-FREE null deciding whether any reading is about
    elliptic curves.
  band_non_degeneracy:
    statistic: 'measured total group operations divided by N, across p = 2^10 to 2^16'
    null_value: 'flat within a factor 4, the power-law reading'
    alternative: 'a monotone fall, the subexponential reading'
    computed_check: >-
      THE SOURCE IDEA BAND CANNOT FIRE WITH THE SUBEXPONENTIAL CONSTANT FREE, and
      the arithmetic is short enough to state here. The exponent
      sqrt(ln N times ln ln N) is about 3.66 at N = 2^10 and about 5.17 at
      N = 2^16, so the subexponential form grows by exp(1.51 c) while N grows by
      64. The predicted fall in the ratio is therefore 64 divided by exp(1.51 c),
      which is at least the required 3.8x only when c is at most about 1.87. AT
      c AROUND 2.5 THE PREDICTED FALL IS ONLY ABOUT 1.5x, WHICH LIES INSIDE THE
      FACTOR-4 BAND THE POWER-LAW READING OCCUPIES. Both readings then produce
      admissible data and the discriminator has width zero in the sense that
      matters.
    resolution: >-
      The subexponential constant c is PINNED BEFORE ANY CELL RUNS by calibrating
      the subexponential form at the SINGLE COMMITTED CELL the audited label
      actually rests on, p = 1009, which makes the competing curve
      parameter-free at every larger p. Stage 3 then COMPUTES the predicted
      separation between the two parameter-free curves across the feasible ladder
      and divides it by the measured seed spread. IF THE COMPUTED SEPARATION IS
      BELOW A FACTOR 2, THE LADDER IS DECLARED UNDERPOWERED IN THE RUN PACKAGE
      BEFORE ANY CELL IS INTERPRETED, and the measurement is reported as an
      achievability and constant check with NO complexity-form conclusion drawn in
      either direction. The load-bearing deliverable is then the zero-compute
      derivation, which the source idea itself identifies as the discriminator.
  inputs:
    ladder: 'p in {2^10, 2^12, 2^14, 2^16}; 5 seeds per cell; 12 generated prime-order curves'
    scope_flagging: >-
      RQ-ECDLP-001 declares bit_sizes [8, 10, 12] and a toy-scale constraint of at
      most 32 field bits. Cells above 12 bits are INSIDE the constraint and
      OUTSIDE the declared bit sizes, so every row from them is labelled
      OUT-OF-DECLARED-SCOPE CALIBRATION and is never reported as a measurement of
      the question declared scope.
    B_sweep: 'at least a 16x range of factor-base sizes at each p, B at most 256'
    yield_screen: 'cells with mean yield outside [0.1, 2] excluded BEFORE the run, never explained after'
    D_models: '{1, B, B^{ceil(m/2)}} for the symbolic table at m = 2 to 12'
    counting_convention: >-
      ONE frozen convention declared before any cell runs: group operations, with
      a stated conversion for field operations and hash-set probes, applied
      identically to the index-calculus arm and to the matched rho arm. THIS
      CONVENTION IS SHARED WITH EXP-PFDR-9187e7, whose hypothesis disagrees with
      this one about a number; the disagreement is decidable only under one
      convention on one instance set.
    shared_instance_set: >-
      the frozen instance set is shared with EXP-PFDR-9187e7 and its sha256 is
      recorded in both run packages
  controls:
    - id: CTRL-EXTENSION-FIELD-GATE
      row_class: nearby_object
      blocking: true
      object: 'the identical accounting instantiated over an extension field with the subfield base'
      forced_disposition: >-
        MUST NOT return "worse than rho at every degree". Index calculus
        demonstrably works there, so an accounting that produces a no-go in the
        setting where the method works is WRONG, not conclusive. Runs FIRST, zero
        compute; a failure means nothing in the record may be reported.
    - id: CTRL-BASELINE-REPRODUCTION
      row_class: baseline
      blocking: true
      object: 'the committed m = 2 total-check-operation charge and the committed BKK speedup interval'
      forced_disposition: >-
        The symbolic identity must reproduce the committed charge symbol for
        symbol. The recomputed twice-gamma must land in [1.45, 1.75]. THE BAND IS
        WIDENED FROM THE SOURCE IDEA [1.5, 1.7] BECAUSE THE COMMITTED RECORD OWN
        RETENTION VALUE OF ABOUT 0.86 GIVES 1.72, WHICH LIES OUTSIDE THAT
        INTERVAL; a reproduction check that fails on the source record own numbers
        would halt the line for a rounding convention.
    - id: CTRL-LADDER-POWER
      row_class: instrument
      blocking: true
      object: 'the computed separation between the two parameter-free readings at the pinned constant'
      forced_disposition: >-
        FORCED: computed and archived BEFORE any measured cell is interpreted. A
        computed separation below a factor 2 against the measured seed spread
        DECLARES THE LADDER UNDERPOWERED, and no complexity-form conclusion is
        drawn in either direction.
    - id: CTRL-MATCHED-RANDOM-FACTOR-BASE
      row_class: instrument
      blocking: true
      object: 'a matched random factor base at every cell'
      forced_disposition: >-
        Measured relation yield must equal the conservation mean with deviation
        consistent with the committed identity. A systematic nonzero deviation
        means the harvester is not sampling targets uniformly and EVERY operation
        count from that cell is void.
    - id: CTRL-MATCHED-RHO
      row_class: baseline
      blocking: true
      object: 'Pollard rho on the identical instances under the identical frozen convention'
      forced_disposition: >-
        MUST land at 0.886 sqrt(N) within the seed spread. A comparison whose
        baseline arm does not reproduce the textbook constant is not measuring a
        ratio and BLOCKS the report.
    - id: CTRL-CURVE-FREE-NULL
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL. The identical measurement pipeline on an
        ABSTRACT prime-order group with a synthetic decomposition oracle of
        matched mean yield and matched per-trial charge. It contains no curve, no
        summation polynomial and no x-coordinate.
      forced_disposition: >-
        MEASURED AND REPORTED BESIDE EVERY CURVE ARM, with no predicted value.
        BLOCKING FOR ATTRIBUTION: the Theta(N) reading follows from the crediting
        rule and the conservation mean, both of which are group-theoretic. IF THE
        CURVE-FREE NULL REPRODUCES IT, the finding is about the two-term
        accounting and NOT about elliptic curves, and no artifact may describe it
        as a statement about the ECDLP.
    - id: CTRL-SEED-INDEPENDENCE
      row_class: instrument
      blocking: true
      object: 'the derived exponent table'
      forced_disposition: >-
        FORCED: the derived exponents are seed-free and must be BIT-IDENTICAL
        across seeds; only the measured counts may vary.
    - id: CTRL-CERTIFICATE
      row_class: honesty
      blocking: true
      object: 'every recovered logarithm'
      forced_disposition: >-
        FORCED: re-verified by an independent checker sharing no state with the
        solver, per RQ-ECDLP-001 own constraint that every solve or relation
        carries an independently verified certificate.
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: 'Pollard rho at 0.886 sqrt(N), O(1) memory; BSGS at sqrt(N) time and memory'
      forced_disposition: >-
        The prior column of every row. NO ADVANTAGE IS CLAIMED ON ANY AXIS; this
        contract product is a floor in the unfavourable direction.
  independent_variables:
    - 'p in {2^10, 2^12, 2^14, 2^16}, with cells above 12 bits flagged out-of-declared-scope'
    - 'factor-base size B over at least a 16x range at each p'
    - 'seed'
    - 'arm in {curve index calculus, curve-free abstract group, matched rho}'
    - 'symbolic: arity m in 2..12 and decomposition-cost model D in {1, B, B^{ceil(m/2)}}'
  metrics:
    primary:
      - 'extension-field gate disposition. UNITS: categorical, forced not-a-no-go'
      - 'baseline reproduction: symbolic identity and recomputed twice-gamma. UNITS: dimensionless, band [1.45, 1.75]'
      - 'symbolic (time exponent, memory exponent) at m = 2..12 for each D model. UNITS: exponents, verified numerically to 1e-12'
      - 'COMPUTED LADDER SEPARATION at the pinned constant, divided by the measured seed spread. UNITS: dimensionless ratio. BLOCKING, at least 2.'
      - 'total group operations per complete solve, per (p, B, seed), and the ratio to N. UNITS: group operations; dimensionless'
      - 'relation-collection operations and linear-algebra operations, SEPARATELY. UNITS: group operations'
      - 'measured mean yield per target against the conservation mean, per cell. UNITS: decompositions per target'
      - 'matched rho operations on the identical instances. UNITS: group operations'
      - 'CURVE-FREE NULL operation counts and ratio to N. UNITS: as above. THE ATTRIBUTION METRIC.'
      - 'smoothness-parameter search outcome, with the enumerated search attached. UNITS: categorical'
    secondary:
      - 'certificate verification pass or fail for every recovered logarithm'
      - 'the pinned subexponential constant and the calibration cell it was pinned at'
      - 'the frozen counting convention and the sha256 of the shared instance set'
      - 'peak resident memory and wall time per cell'
  heuristic_under_test: >-
    HEUR-001 (decomposition-count distribution), HEUR-002 (trial independence at a
    fixed factor base) and HEUR-003 (ladder identifiability) of H-PFDR-064546.
    HEUR-003 is tested FIRST because its failure makes the ladder uninformative
    rather than negative.
  preregistered_prediction:
    quantity: >-
      The extension-field gate disposition; the baseline reproduction; the
      symbolic exponent table; the computed ladder separation; the measured
      ratio of operations to N across the ladder; the B-dependence of
      relation-collection cost; the smoothness search outcome; and the curve-free
      null.
    formula: >-
      Extension-field gate NOT a no-go. Baseline reproduction exact, with
      twice-gamma in [1.45, 1.75]. Symbolic optimum EXACTLY 2/3 time and 1/3
      memory at m = 2 with unit decomposition cost. Computed ladder separation
      reported with a floor of 2 and no predicted value. Measured ratio of
      operations to N FLAT within the computed identifiability band if that band
      exists. Relation-collection cost FLAT in B to within a factor 2 over a 16x
      range. Smoothness search: NO parameter exists. Curve-free null MEASURED with
      no predicted value.
    source: >-
      H-PFDR-064546 claims (A) to (F) and predictions P1 to P9. The committed
      per-trial charge, the retention values and the audited complexity label were
      read verbatim by the drafting coordinator. FIXED ON 2026-09-04, BEFORE ANY
      CELL RUNS AND BEFORE THE CONSTANT IS PINNED. The bands, the convention and
      the underpowered rule are part of the frozen contract and are never adjusted
      after an outcome is seen.
  scale_relevance:
    tier: toy
    justification: >-
      Four points over six bits of N cannot separate asymptotic forms in general,
      which is why the load-bearing content is the zero-compute derivation and why
      the ladder separating power is computed before the ladder is interpreted.
      The exponent statements are DERIVATIONS WITHIN A COST MODEL and are not
      validated at cryptographic scale by any part of this contract. Cells above
      12 bits are out of the question declared bit sizes and are labelled so.
    correspondence: 'none; instances are generated directly'
  tail_checks:
    - >-
      The largest-p cell reported separately rather than pooled, since a shape
      that appears only at small p is a small-parameter artifact.
    - >-
      The distribution of trials-to-first-relation against the geometric
      prediction, and the empirical variance of the total trial count against the
      independent prediction; over-dispersion beyond a factor 2 is reported with
      EVERY operation count.
    - >-
      The 99th percentile trial count against the geometric tail.
    - >-
      The maximum observed decomposition count per target against the binomial
      upper tail, and the count of targets with no decomposition against the
      coverage bound.
  replication:
    seeds: ['5 independent seeds per (p, B) cell, values recorded in the run package']
    independent_instances: 12
    reason: >-
      Twelve generated prime-order curves and five seeds per cell, so the seed
      spread of the measured ratio can be estimated and used as the denominator of
      the computed ladder separation. Derived exponents are seed-free and must be
      bit-identical across seeds.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 260
    maximum_workers: 1
    notes: >-
      Pure Python; the largest object is a hash set of at most 256 field elements
      and a matrix of side at most 256 over the integers modulo N -- under 1 MB.
      NO Macaulay matrix and NO Groebner basis is built, so this contract cannot
      reproduce any resource-exhaustion stop from the boolean lane; and such a
      stop would be an INFRASTRUCTURE failure under AGENTS.md rule 5, never
      negative mathematical evidence.
  stages:
    - id: stage-0-extension-field-gate
      purpose: 'instantiate the accounting over an extension field; must not return a no-go'
      blocking: true
    - id: stage-1-baseline-reproduction
      purpose: 'reproduce the committed charge symbolically and the committed speedup interval'
      blocking: true
    - id: stage-2-symbolic-table
      purpose: 'derive the stationarity, emit exponents at m = 2..12 for each D model, verify to 1e-12'
      blocking: true
    - id: stage-3-ladder-power
      purpose: >-
        pin the subexponential constant at the committed calibration cell, compute
        the separation across the feasible ladder, divide by the seed spread, and
        DECLARE UNDERPOWERED IF BELOW 2
      blocking: true
    - id: stage-4-smoothness-search
      purpose: 'enumerate the search for a smoothness parameter in the m = 2 construction and record the result either way'
      blocking: true
    - id: stage-5-measurement
      purpose: 'the complete m = 2 solves across the ladder and the B sweep, with matched rho on the identical instances'
    - id: stage-6-curve-free-null
      purpose: 'the abstract-group arm at matched yield and matched charge; BLOCKING FOR ATTRIBUTION'
      blocking: true
    - id: stage-7-report
      purpose: >-
        compare against the pre-registered shapes only if stage 3 passed; file any
        audit finding as a supersession-by-reference PROPOSAL for the Coordinator,
        never as an edit
  stopping_rules:
    - 'STOP at stage 0 if the extension-field gate returns a no-go. Nothing is reported.'
    - 'STOP at stage 1 if the baseline reproduction fails. The counting convention differs and the audit cannot be made.'
    - >-
      STOP INTERPRETING at stage 3 if the computed separation is below 2. The
      measurement arm still runs as an achievability and constant check, but NO
      complexity-form conclusion is drawn in either direction.
    - >-
      Stage 4 is not optional and is not conditional on any other outcome. A named
      smoothness parameter is the cheapest and most valuable falsifier available.
    - >-
      Stage 6 is not optional. Reporting stage 5 without stage 6 is an
      invalidation, not a shortcut.
    - 'A cell failing the yield screen is excluded BEFORE the run and never explained after.'
  invalidation_rules:
    - >-
      Pinning the subexponential constant AFTER seeing measured ladder data
      INVALIDATES the interpretation. It is pinned at the committed calibration
      cell before any cell runs.
    - >-
      Changing the counting convention, the bands, the yield screen or the
      underpowered rule after an outcome is seen INVALIDATES the run; such a
      change is a versioned protocol_amendment and a re-run from stage 0.
    - >-
      Counting the rho arm in group operations and the index-calculus arm in field
      operations INVALIDATES the comparison; the convention is one and is frozen.
    - >-
      Reporting a measured shape from cells above 12 bits without the
      out-of-declared-scope label INVALIDATES that row.
    - >-
      Drawing a complexity-form conclusion when stage 3 declared the ladder
      underpowered INVALIDATES the artifact making it.
    - >-
      Reporting the curve arm without the curve-free null beside it INVALIDATES
      the report; describing a Theta(N) reading the curve-free null reproduces as
      a statement about elliptic curves or the ECDLP INVALIDATES the artifact.
    - >-
      Editing, superseding or restating the status of any knowledge finding from
      inside this run package INVALIDATES it. Only a Coordinator decision may
      supersede a committed record, and the correction discipline forbids editing.
    - >-
      Quoting the conclusion without "within the two-term model" or without "at
      m = 2" INVALIDATES the statement under AGENTS.md rule 4.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the extension-field gate does
    not return a no-go; (2) the baseline reproduction is exact and twice-gamma
    lands in [1.45, 1.75]; (3) the symbolic table verifies to 1e-12 and returns
    exactly 2/3 and 1/3 at m = 2 with unit decomposition cost; (4) the ladder
    separating power is computed and archived before any cell is interpreted, and
    the underpowered rule is applied as written; (5) the smoothness search is
    enumerated and its outcome recorded either way; (6) every measured cell
    reports operations, the ratio to N, the separated relation and linear-algebra
    counts, the yield check and the matched rho count, with certificates verified;
    and (7) the curve-free null is reported beside every curve arm.
    SUCCESS IS PROTOCOL INTEGRITY, NOT A PARTICULAR SHAPE. A run that declares the
    ladder underpowered is a FULL SUCCESS.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 ACCOUNTING BROKEN: the extension-field control returns a no-go.
    F2 CONVENTION MISMATCH: the baseline reproduction fails.
    F3 LADDER UNDERPOWERED: the computed separation is below 2. Reported before
    interpretation; no complexity-form conclusion in either direction.
    F4 RECORD WRONG, LABEL REPAIRED: a smoothness parameter IS exhibited. The
    hypothesis is wrong, the audited label is repaired rather than contradicted,
    and the exhibited quantity is worth more than anything here.
    F5 SWEEP CHARGE WRONG: relation-collection cost falls with B by more than a
    factor 2 over a 16x range. This is also what the sibling contract predicts, and
    the two are then adjudicated on the shared instances under the shared
    convention.
    F6 ATTRIBUTION DENIED: the curve-free null reproduces the reading. The finding
    is about the two-term accounting, not about elliptic curves.
    F7 EVERYTHING HOLDS: the derivation stands, the ladder is powered and the
    measured shape matches. The audit finding on the committed label is filed as a
    supersession-by-reference PROPOSAL for the Coordinator, never as an edit.
  artifact_package_directory: experiments/EXP-PFDR-2524f4/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/convention.yaml (the frozen counting convention, the shared instance set with its sha256, and this contract sha256)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/gate-and-baseline.yaml (the extension-field gate disposition and the baseline reproduction with the recomputed twice-gamma)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/symbolic-table.yaml (exponents at m = 2..12 for each D model, with the numerical verification residuals)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/ladder-power.yaml (the pinned constant, the calibration cell, the computed separation per rung, the measured seed spread, and the underpowered determination -- ARCHIVED BEFORE ANY MEASURED CELL IS INTERPRETED)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/smoothness-search.md (the enumerated search and its outcome either way)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/measurements.yaml (per cell: operations, ratio to N, separated relation and linear-algebra counts, measured yield against the conservation mean, matched rho count, seed, curve, out-of-declared-scope flag)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/curve-free-null.yaml (the abstract-group arm at matched yield and charge, with an explicit statement of what the comparison licenses and forbids)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/certificates/ (one per recovered logarithm, with independent verification results)'
    - 'experiments/EXP-PFDR-2524f4/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F7 fired; per-file sha256; the inference block; and an explicit statement that no committed record was edited or superseded)'
  interpretation_limits:
    - >-
      NOT AN ECDLP HARDNESS RESULT AND NOT A LOWER BOUND. It bounds one algorithm
      family under one cost model at one arity, and does not interact with the
      generic-group bound.
    - >-
      SCOPED TO m = 2. At higher arity the same identity gives exponents below
      1/2 for small decomposition cost, which is why the interesting arities are
      outside this contract. It may never be quoted as closing
      point-decomposition index calculus.
    - >-
      "Dominated within the stated cost model" is not domination in fact. The
      model is known by its own authors not to be tight and that qualifier travels
      with every quoted row.
    - >-
      A CONTRADICTION IS NOT A VERDICT. Only a Coordinator decision may supersede
      a committed knowledge finding, and this contract proposes an audit.
    - >-
      Four points over six bits cannot separate asymptotic forms in general, which
      is precisely why the ladder separating power is computed rather than assumed.
    - >-
      The omitted coupon-collector factor is unfavourable to this contract
      negative reading and therefore favourable to any positive reading, so NO
      positive reading may be taken from this contract.
    - >-
      The external literature is not adjudicated; a published complexity-bounds
      paper may already contain the mathematical content and no agent has opened
      it.
    - >-
      This contract and EXP-PFDR-9187e7 encode hypotheses that DISAGREE ABOUT A
      NUMBER. Neither may be cited as settling the other until both have run under
      the shared frozen convention on the shared instance set.
  dominated_by: >-
    As an ATTACK: none is mounted, so every frontier row dominates on every axis
    -- Pollard rho, multi-target rho, BSGS, van Oorschot-Wiener, the generic
    preprocessing frontier, algebra-free meet-in-the-middle index calculus, and
    the two-term optimum itself. As a COST-MODEL STATEMENT about the m = 2 family:
    the incumbent is the committed subexponential label, which this contract
    contradicts rather than is dominated by, and the committed per-trial charge,
    which it REPRODUCES and extends. NOT NULL ON ANY AXIS.
  sota_delta: >-
    Zero speedup against any attack baseline. Content delivered: an exponent floor
    at m = 2 within the stated model under both a free and an achievable
    decomposition oracle; the first filled domination artifact for this lane; an
    audit of one committed complexity label resting on one measured cell, with the
    separating power of the replacement ladder COMPUTED rather than assumed; and a
    curve-free null that decides whether the reading is about elliptic curves at
    all.
  id_allocation_provenance: >-
    EXP-PFDR-2524f4 pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260829-b5a2c8. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
