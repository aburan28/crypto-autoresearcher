experiment:
  id: EXP-CANL-86c465
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-fd5a24
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE NORM-FORM GAP OF THE CM ORDER: on the Serre-Tate canonical lift the Mordell-Weil group
    is an O-module, which halves the number of points that must be lifted, but every element of O
    outside Z has norm at least |D_E|/4 and therefore multiplies canonical height by at least |D_E|/4
    ~ p, so the O-module structure contributes ZERO new lattice vectors inside the Xedni height budget
    and leaves the Jacobson-Koblitz-Silverman-Stein-Teske instance count at Theta(N)'
  status: draft
  objective: "(A) THE QUANTITY THAT MUST MOVE. RQ-CANL-63098f is decided by a single number: the per-instance\
    \ success probability of a Xedni-style lift, which the program's own audit record ECFG-P1543-R1\
    \ (ledger/FINDING-PF-IC-001.md) reconstructs as \"the Xedni C_0/p theorem ... under Lang, its\
    \ discriminant-height comparison, and fixed arity 2 <= r <= 9\". Unpacked: with r+1 points lifted\
    \ onto a global curve of Mordell-Weil rank r, the r+1 lifted points are AUTOMATICALLY Z-dependent\
    \ (r+1 vectors in a rank-r lattice); the attack fails because the dependence that exists is forced\
    \ to have coefficients bounded by an absolute constant C_0, so only (2C_0+1)^{r+1} distinct residues\
    \ k are reachable out of N, and the expected number of independent instances is\n    I_Z(r) =\
    \ N / (2C_0+1)^{r+1} = N^{1-o(1)}.\nA proposal that does not move I, or the canonical heights\
    \ that produce C_0, or the rank r, is closed on arrival (RQ-CANL-63098f decision_target). This\
    \ proposal computes exactly what CM does to I.\n(B) WHAT CM GIVES, EXACTLY. Serre-Tate: an ordinary\
    \ E/F_p with O := End_{F_p}(E) has a canonical lift Ẽ with End(Ẽ) = O. Over the ring class field\
    \ H of O, the group Ẽ(H) is an O-MODULE, not merely a Z-module. Write disc(O) = D_E = D_0 f_E^2\
    \ (D = t^2-4p = D_0 f^2, f_E | f). If Ẽ(H)/tors is a projective O-module of rank r_O then its\
    \ Z-rank is r_Z = 2 r_O. Consequently m points of Ẽ(H) are O-DEPENDENT as soon as m >= r_O + 1\
    \ = r_Z/2 + 1, where Z-dependence needs m >= r_Z + 1. FIRST EXACT NUMBER: CM halves the number\
    \ of points that must be simultaneously lifted, from r_Z + 1 to r_Z/2 + 1. That is a real reduction,\
    \ it is the arithmetic the brief demands, and it is the ONLY thing CM reduces.\n(C) WHAT CM DOES\
    \ NOT GIVE, AND WHY, WITH THE PROOF. The height budget is unchanged, by an elementary and complete\
    \ argument.\n  LEMMA 1 (norm-form gap; elementary, proved in `mechanism` below). Let O\n  be the\
    \ imaginary quadratic order of discriminant D_E < 0. Every\n  alpha in O \\ Z satisfies N(alpha)\
    \ >= |D_E|/4.\n  LEMMA 2 (height scaling; standard). For alpha in End(Ẽ),\n  hhat(alpha P) = deg(alpha)\
    \ hhat(P) = N(alpha) hhat(P).\nTogether: the O-module generated by a point P̃ is, as a Z-lattice,\
    \ spanned by P̃ and omega P̃ with hhat(omega P̃) >= (|D_E|/4) hhat(P̃). For a curve at the bottom\
    \ of its volcano, |D_E| = |D| = 4p - t^2, so the companion direction is longer by a factor >=\
    \ p - t^2/4. THE O-MODULE STRUCTURE INFLATES THE Z-RANK WITHOUT PLACING A SINGLE NEW VECTOR INSIDE\
    \ ANY BALL OF RADIUS o(sqrt(p)) TIMES THE LATTICE MINIMUM.\n(D) THE CONSEQUENCE FOR THE COEFFICIENT\
    \ SET, WHICH IS THE DECIDING STEP. A relation sum_i alpha_i P̃_i = O is usable only if it lies\
    \ in the height window that forces C_0, i.e. only if N(alpha_i) <= C_0^2 for each i (the Z-case\
    \ bound |a_i| <= C_0 is exactly N(a_i) = a_i^2 <= C_0^2). By Lemma 1,\n    if |D_E| > 4 C_0^2\
    \  then  {alpha in O : N(alpha) <= C_0^2}\n                              = {a in Z : |a| <= C_0},\n\
    of size exactly 2C_0+1 -- IDENTICAL to the Z-coefficient set. So in the generic regime CM contributes\
    \ NO new reachable coefficient. The reachable-k count becomes (2C_0+1)^{r_O+1} = (2C_0+1)^{r_Z/2+1},\
    \ which is SMALLER than the Z-case (2C_0+1)^{r_Z+1}, and\n    I_O(r_Z) = N / (2C_0+1)^{r_Z/2+1}\n\
    \             = I_Z(r_Z) * (2C_0+1)^{r_Z/2}.\nSECOND EXACT NUMBER: in the generic regime CM makes\
    \ the instance count WORSE by the factor (2C_0+1)^{r_Z/2}, while making each instance cheaper\
    \ by lifting half as many points. Both are constants at fixed arity; the exponent of N is 1 in\
    \ both cases and rho's is 1/2.\n(E) THE ANSWER TO RQ-CANL-63098f IN ONE LINE. CM changes the number\
    \ of points needed (exactly a factor 2) and changes the reachable-k constant (exactly (2C_0+1)^{-r_Z/2}\
    \ in the generic regime, and a gain instead of a loss when |D_E| = O(C_0^2) -- that regime is\
    \ IDEA-20260807-11b93d). It does not change a single canonical height, because height scales by\
    \ the norm and the norm form of O has no small values off Z. The Xedni failure quantity survives\
    \ CM intact."
  resource_label: 'R6 (lift to characteristic zero / Z_p) and R3 (End(E) as a ring: the norm form
    of O and the module structure of Ẽ(H)).'
  admissibility: admissible
  admissibility_argument: 'The admissibility filter (DECOMPOSITION.md section 2, H-ENDO-001, KN-FIND-b7e091)
    closes lanes whose only use of phi is to apply it to points of G, because End(G) = Z/N makes every
    endomorphism a scalar there. This proposal never applies an endomorphism to a point of G. It uses
    (i) the NORM FORM of O as a quadratic form on a rank-2 Z-lattice, which is ring data invisible
    to G, and (ii) the canonical height on a curve in characteristic zero, which is not a group-oracle
    output at all. The scalar-collapse of H-ENDO-001 in fact APPEARS in this proposal, but only on
    the far side of reduction: the O-relation reduces to a Z/N relation with computable coefficients
    lambda(alpha_i), where lambda: O -> Z/N is the ring map with lambda(pi) = 1 (Frobenius acts as
    the identity on the F_p-rational subgroup G). That the reduced relation is scalar is what makes
    it USABLE, not what makes it vacuous; vacuity would require lambda to be independent of alpha,
    which it is not.'
  reachability_gate: null
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): verify Lemma 1 symbolically for D_E in a swept
      range by exhaustive integer search over (a,b) with |a|,|b| <= 50; verify the equality case.
      If any alpha with b != 0 has N(alpha) < |D_E|/4, the proposal ends here. Pure Python, seconds.
      STAGE 1 (hours): implement the canonical height on a curve over Q via the standard local-height
      decomposition (mpmath), and verify hhat(alpha P) = N(alpha) hhat(P) numerically on the CM curves
      y^2 = x^3 + k (alpha = zeta_3, N = 1) and y^2 = x^3 + a x (alpha = i, N = 1), and on multiplication-by-m
      (N = m^2) for m <= 5, to 12 significant digits. A failure here is an instrument failure. STAGE
      2 (hours): sweep |D_E| over the discriminants realisable at toy scale, compute the ratio of
      minima, fit the slope against sqrt(|D_E|). STAGE 3 (hours): exact integer count of {alpha :
      N(alpha) <= C_0^2} across the sweep, and the reachable_k_count comparison against the Z-case
      at matched Z-rank. STAGE 4 (zero compute): compose with the ECFG-P1543-R1 lifting dichotomy
      and record the instance-count exponent.'
    mechanism: "STEP 1 -- PROOF OF LEMMA 1 (elementary, complete, zero compute). Let O have discriminant\
      \ D_E < 0, so O = Z[w] with w = (D_E + sqrt(D_E))/2 and w^2 - D_E w + (D_E^2 - D_E)/4 = 0. Take\
      \ alpha = a + b w with a, b in Z and b != 0. Then\n    alpha = (a + b D_E/2) + (b/2) sqrt(D_E),\n\
      \    N(alpha) = (a + b D_E/2)^2 + (b^2/4)|D_E| >= (b^2/4)|D_E| >= |D_E|/4.\nEquality is attained\
      \ iff |b| = 1 and a = -b D_E/2 (possible only for D_E even). QED. The bound is sharp and needs\
      \ no hypothesis.\nSTEP 2 -- INSTANTIATE AT CRYPTO-RELEVANT PARAMETERS. For an ordinary E/F_p\
      \ at the bottom of its volcano, O = Z[pi] and D_E = t^2 - 4p, so |D_E| = 4p - t^2 and the gap\
      \ is (4p - t^2)/4. Since |t| <= 2 sqrt(p), |D_E| ranges over (0, 4p]. Under the semicircle law\
      \ for the trace, the fraction of ordinary curves with |t| <= sqrt(p), hence |D_E| >= 3p, is\n\
      \    (1/(2 pi p)) * int_{-sqrt p}^{sqrt p} sqrt(4p - t^2) dt = 0.609...\n(elementary substitution\
      \ t = 2 sqrt(p) sin θ; computed here, not cited). So for a clear majority of curves the companion\
      \ direction is longer by a factor >= 3p/4. THE GENERIC CASE IS THE MAXIMALLY BAD CASE.\nSTEP\
      \ 3 -- THE COEFFICIENT-SET IDENTITY (part D of the claim), made checkable. Fix C_0. The predicate\
      \ \"N(alpha) <= C_0^2 and alpha not in Z\" is, by Lemma 1, unsatisfiable whenever |D_E| > 4\
      \ C_0^2. At |D_E| ~ 4p this holds for every C_0 = o(sqrt p). JKSST's C_0 is an ABSOLUTE constant\
      \ at fixed arity, so the condition holds for all p beyond a constant. Hence the O-coefficient\
      \ set equals the Z-coefficient set exactly.\nSTEP 4 -- THE REDUCED RELATION IS USABLE, AND ITS\
      \ COEFFICIENTS ARE COMPUTABLE. Let lambda: O -> Z/N be reduction of the O-action on G = <P>\
      \ subset E(F_p). Frobenius pi acts as the identity on the F_p-rational points, so lambda(pi)\
      \ = 1; writing pi = (t + f sqrt(D_0))/2 determines lambda(sqrt(D_0)) = (2 - t)/f mod N and hence\
      \ lambda on all of O by Z-linearity. So an O-relation sum alpha_i P̃_i = O reduces to sum lambda(alpha_i)\
      \ [k_i] P = O with EXPLICIT integers lambda(alpha_i) mod N. This step is included because it\
      \ is the step at which one could wrongly conclude the whole lane is vacuous by H-ENDO-001; it\
      \ is not, and the computation shows why.\nSTEP 5 -- THE BOOKKEEPING, per-attempt-cost times\
      \ inverse-success. Per attempt: construct the global CM curve and lift r_O+1 points (cost: see\
      \ reachability_gate); success probability (2C_0+1)^{r_O+1}/N. Expected total\n    T = [cost(lift\
      \ of r_Z/2 + 1 points)] * N / (2C_0+1)^{r_Z/2+1}.\nAgainst rho at 0.886 sqrt(N) (KN-TECH-001,\
      \ KN-TECH-006), T/T_rho = Theta(sqrt(N)) for any constant arity. Stated as an exponent: 1 versus\
      \ 1/2, unchanged by CM.\nSTEP 6 -- WHAT WOULD FALSIFY THE WHOLE ARGUMENT. Exactly one thing:\
      \ a curve in the family with |D_E| <= 4 C_0^2. That is not a hypothetical -- it is the crater\
      \ of a small-fundamental-discriminant class, it includes j = 0 and j = 1728, and secp256k1 lives\
      \ there. That regime is carved out and analysed separately in IDEA-20260807-11b93d, and this\
      \ record's claim is explicitly restricted to |D_E| > 4 C_0^2."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Matched non-CM curve with a synthetic order-2/order-3 lattice automorphism (the null object);
    the ratio of minima must stay O(1).
  - 'Small-|D_E| positive control (D_0 in {-3,-4,-7,-8,-11}): the instrument must SEE the escape,
    i.e. return ratio O(1) and a non-empty off-Z coefficient set.'
  - Multiplication-by-m as a known-answer height check (N(m) = m^2).
  - Frozen non-CM Xedni baseline fixture (proof_search_map).
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. MATCHED NULL: a non-CM elliptic curve
    E''/Q of the same Mordell-Weil rank and minimal discriminant magnitude within a factor 2 of the
    CM lift''s, with a RANDOM order-2 (or order-3) Z-linear automorphism of its Mordell-Weil lattice
    substituted for the genuine O-action -- i.e. an object of exactly the same shape (a rank-2r lattice
    with a rank-2 module structure) whose module structure is arithmetically empty. The measured quantity
    in both arms is the ratio (second successive minimum)/(first successive minimum) of the rank-2
    sublattice generated by P̃ and its companion. DECAY PARAMETER: |D_E|. The predicted CM value of
    that ratio is >= sqrt(|D_E|)/2 and MUST GROW like sqrt(|D_E|); the null''s value must stay O(1).
    A CM ratio that FAILS TO GROW with |D_E| is the canonical artifact tell (docs/inventor-protocol.md,
    controls before belief) and means the implementation is not computing N(alpha) or hhat correctly.
    POSITIVE CONTROL: |D_E| in {3, 4, 7, 8, 11}, where the ratio must be O(1) -- the instrument must
    SEE the small-discriminant escape, or it cannot report a negative anywhere.'
  independent_variables: []
  metrics:
    primary:
    - N(alpha) minima off Z, exact integers, per |D_E|
    - hhat(w P̃)/hhat(P̃) with numerical precision reported
    - '|{alpha in O : N(alpha) <= C_0^2}| per (C_0, |D_E|), exact'
    - reachable_k_count for CM and matched Z arms
    secondary:
    - null-arm values for every metric above
    - wall-clock and precision settings for the height computation
  heuristic_under_test: null
  preregistered_prediction:
    quantity: ratio_of_minima := lambda_2/lambda_1 of the rank-2 Z-lattice generated by P̃ and w P̃
      on a toy CM curve over a number field, measured as sqrt(hhat(w P̃)/hhat(P̃))
    formula: 'FORCED VALUE, derived pre-run: >= sqrt(|D_E|)/2, i.e. >= 0.86 at |D_E| = 3 and >= 5
      at |D_E| = 100. Must track sqrt(|D_E|) with slope 0.5 in log-log across at least 5 values of
      |D_E|. A measured slope whose interval excludes 0.5 falsifies the composition of Lemma 1 and
      Lemma 2 as implemented.'
    source: pre-registered in IDEA-20260807-fd5a24 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Numerical precision in hhat. The local-height series converges slowly near bad reduction; a precision
    artifact can masquerade as a height ratio. Fixed by the multiplication-by-m known-answer control.
  - Non-maximal orders. For f_E > 1, Ẽ(H) need not be a projective O-module and r_Z = 2 r_O can fail.
    Every measurement is stratified by f_E and the f_E > 1 cells are reported separately, never pooled.
  - Twist ambiguity. The canonical lift is determined up to twist by the requirement that it reduce
    to E; different twists have different ranks and different discriminants. Every number must name
    its twist.
  - C_0 is not measured here. It is imported from KN-LIT-021 via ECFG-P1543-R1 and is an absolute
    constant only at FIXED ARITY. Any statement about growing arity is outside scope and must not
    be made.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'FORCED VALUE, derived pre-run: >= sqrt(|D_E|)/2, i.e. >= 0.86 at |D_E| = 3 and
    >= 5 at |D_E| = 100. Must track sqrt(|D_E|) with slope 0.5 in log-log across at least 5 values
    of |D_E|. A measured slope whose interval excludes 0.5 falsifies the composition of Lemma 1 and
    Lemma 2 as implemented.'
  falsification_criterion:
  - Stage 0 finds alpha in O \ Z with N(alpha) < |D_E|/4. Lemma 1 is false as stated, the whole argument
    collapses, and the record is superseded.
  - Stage 1 finds hhat(alpha P) != N(alpha) hhat(P) beyond numerical tolerance on a known-answer case.
    Instrument failure; nothing reported.
  - The ratio of minima does not track sqrt(|D_E|) with slope 0.5. Either the height implementation
    or Lemma 2 is wrong.
  - The reachable_k_count ratio exceeds 1 in the generic regime. Part (D) is wrong and CM would then
    genuinely enlarge the reachable set -- the one outcome that would REOPEN this lane, and it is
    pre-registered as such.
  - The null arm reproduces the CM ratio's growth. The measurement is a lattice-shape artifact and
    no CM-specific statement may be made.
  - The small-|D_E| positive control fails to show the escape. The instrument cannot see the effect
    it is meant to bound; no negative may be reported from any arm (AGENTS.md rule 5).
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
