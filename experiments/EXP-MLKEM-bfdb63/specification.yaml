experiment:
  id: EXP-MLKEM-bfdb63
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-MLKEM-6d9364
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-001
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: exact negacyclic adjoint check, deterministic
    operation-and-memory count of two score-evaluation orders, matched
    unstructured null, and the score-share ceiling on orbit amortisation

  objective: >-
    If separately approved, frozen and authorized, perform the operation-DAG
    accounting that EV-MLKEM-001 named as IDEA-20260722-001's successor and that
    EV-MLKEM-002 carries as unresolved confound 5, and convert it into a bound:
    machine-check the negacyclic adjoint identity exactly mod q, count modular
    multiplications and resident words for the naive and batched evaluation
    orders over a declared grid, run the matched unstructured null and the
    cyclic-convolution positive control, and -- if and only if the estimator is
    obtainable -- measure the score-evaluation share f_score and apply the
    ceiling. This contract is an instrument design and a pre-execution
    declaration. No run has happened.

  what_this_is_not:
    - Not an attack on ML-KEM, not a key recovery, not a solve, and not a certificate of any kind.
    - Not a claim that any speedup exists in any real implementation; it counts operations under a declared convention, it does not time code.
    - Not a security estimate, not a revision of any published cost row, and not a statement about MLWE hardness.
    - Not evidence for or against IDEA-20260722-001's original two-bit claim until f_score is measured; the op-count stages alone decide nothing about bits.
    - Not an approval, a freezing, an execution authorization, a run, an observation, or evidence.
    - Not a reopening of GOAL-MLKEM-001, which is closed at budget and authorizes nothing; this contract would run only under a successor goal.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY ONLY for every measured quantity. A completed run could support, at
      most: (1) that the negacyclic adjoint identity holds exactly mod q = 3329
      for n in {32,64,128,256}, k in {1,2,3,4}, on 200 random pairs per cell;
      (2) that under the declared counting convention the naive-to-batched
      modular-multiplication ratio follows the frozen closed form on that grid,
      with the stated resident-word cost; (3) that a matched unstructured LWE
      instance of the same dimension exhibits neither the orbit membership nor
      the ratio; and (4) IF the estimator ran, a number f_score with its
      decomposition, and the bound -log2(1 - f_score) bits it implies. NOTHING
      ELSE. In particular no outcome may be quoted as a speedup against any
      ML-KEM attack, as an exponent, as a crypto-scale result, or as evidence
      about any deployed parameter set.

  inputs:
    ring:
      modulus_q: 3329
      polynomial: "X^n + 1"
      n_values: [32, 64, 128, 256]
      module_ranks_k: [1, 2, 3, 4]
    sampling:
      pairs_per_cell: 200
      v_law: "each coefficient uniform on {0..q-1}"
      b_law: "each coefficient uniform on {0..q-1}"
      note: >-
        The identity in C1 is an algebraic identity and holds for arbitrary
        coefficients; uniform sampling is chosen so that a sign-bookkeeping error
        cannot be masked by small coefficients. NO ML-KEM SECRET, KEY, OR
        CIPHERTEXT IS GENERATED OR USED ANYWHERE IN THIS CONTRACT.
    unstructured_null:
      construction: >-
        A uniformly random A in Z_q^{(nk) x (nk)} with no circulant or
        negacyclic structure, the same q, and a dual vector drawn by the same
        procedure used for the ring arm after adapting dimensions. The "orbit" is
        defined as the 2n coordinate rotations of the vector with the negacyclic
        sign pattern applied -- i.e. the literal image of the ring arm's
        construction transplanted to a setting where it has no meaning -- so
        that the membership test can fail.
      membership_test: >-
        A vector w is a dual-lattice vector iff w^T A = 0 mod q for the declared
        A. Applied to all 2n images. Exact modular arithmetic; no tolerance.
    positive_control_cyc_fft:
      construction: >-
        Plain cyclic convolution of two uniform length-n vectors over Z_q,
        counted naively and by transform with the identical counter.
    ceiling_control_domain_enlargement:
      construction: >-
        A toy two-component cost model T(beta) = C_sieve(beta) + C_score(beta)
        over integer beta, with an explicit memory cap M(beta) <= M_max that
        makes large beta infeasible, and an improvement that reduces C_score AND
        the memory it consumes so that the feasible beta range grows. Declared
        fully in the frozen contract before any evaluation; its purpose is to
        EXHIBIT the ceiling failing.
    seeds:
      master_seed: 3329256
      domain: "EXP-MLKEM-bfdb63/v1"
      seed_derivation_rule: >-
        ASCII bytes of domain || "|" || label || "|" || decimal(n) || "|" ||
        decimal(k) || "|" || decimal(counter), hashed with SHA-256; digest
        integers are interpreted big-endian unsigned and reduced mod q by
        rejection sampling (discard any 16-bit window >= floor(65536/q)*q, then
        take the remainder mod q). Labels are exactly one of
        {"v", "b", "null-A", "null-w", "cyc-x", "cyc-y"}. Counters advance once
        per emitted coefficient. This rule reproduces every instance bit-for-bit
        from (master_seed, domain, label, n, k, counter) and nothing else.
    counting_convention:
      coefficient_product: "1 modular multiplication"
      transform: "(3/2) * n * log2(n) butterflies per length-n transform, each charged as 1 modular multiplication"
      pointwise: "1 modular multiplication per coefficient"
      amortisation: >-
        Forward transforms of pool vectors are amortised over a declared sample
        set of size S = 1000 and are ALSO reported unamortised. Both numbers
        appear in every row.
      memory_word: "one machine word per Z_q element"
      note: >-
        THE CONVENTION IS A DECLARED MODELLING CHOICE, NOT A CLAIM ABOUT ANY
        IMPLEMENTATION. It is frozen here; it may not be altered after any
        number is observed. The counter is an explicit tally, never a timer, so
        results are deterministic and machine-independent.
    estimator_stage_only:
      harness: tools/sage_free_estimator
      lattice_estimator_pin: 3e48ef421ec256afddb3e7d2249a77eab6e9ba12
      known_answer_control_required: true
      known_answer_control_note: >-
        The harness's own README states the standard adopted here: exact
        equality is the bar, not a tolerance. The control MUST be executed in
        this run and its verbatim output archived. A README transcript is not a
        passed control and may not be cited as one.

  arms_and_controls:
    treatment: >-
      The ring arm. Per cell (n, k): 200 (v, b) pairs; for each, compute all 2n
      orbit inner products directly and the n coefficients of the ring product
      v * bbar, compare exactly mod q; count modular multiplications and
      resident words for both evaluation orders.
    measured_null: >-
      NULL-U, the matched unstructured arm. Same q, same nominal dimension nk,
      same sampling procedure, no ring. FORCED VALUES DERIVED BEFORE THE RUN:
      exactly 2 of 2n images pass the membership test (the vector and its
      negation), and the batched-order ratio collapses to 1.00 +/- 0.05 because
      no single product yields the 2n scores. THIS NULL CAN FAIL.
    positive_control: >-
      CYC-FFT. Naive versus transform op counts for a plain cyclic convolution,
      which MUST exhibit the textbook Theta(n / log n) ratio within a factor
      1.2 at every n. IF IT DOES NOT, THE COUNTER IS BROKEN AND NO RESULT OF ANY
      SIGN MAY BE REPORTED FROM ANY ARM.
    graded_control: >-
      Two gradings, both with at least four interior points and both reporting
      monotonicity. (a) n in {32,64,128,256} at k = 3: the ratio must increase
      monotonically. (b) k in {1,2,3,4} at n = 256: the ratio must vary by at
      most a factor 1.5, because the orbit has order 2n for every k. A failure of
      (a) localises a counter defect; a failure of (b) localises a defect in the
      module-coordinate bookkeeping.
    nearby_object_control: >-
      CEILING-BOUNDARY. The domain-enlarging toy cost model, where the ceiling
      is expected to FAIL and the realised gain must exceed log2(c). Exhibiting
      the failure is a REQUIRED DELIVERABLE, not an optional extra: a bound
      whose boundary is never demonstrated cannot be applied safely by anyone
      else.
    ordering_control: >-
      NULL-U and CYC-FFT are generated, counted, and hash-committed BEFORE any
      treatment number is looked at, and the frozen decision rule is executed on
      NULL-U first. If the rule emits the same verdict on NULL-U as on the
      treatment, it discriminates nothing and must be rewritten before the
      treatment arm is read. Absence of the pre-treatment commitment is
      invalid_measurement.
    comparability_policy: >-
      No number from this contract may be compared with any figure from
      EXP-MLKEM-001..015, from the archived BATCH-002 cost report, or from any
      external estimator, except through the single declared channel f_score in
      stage 3. Op counts under this convention are not gates, not cycles, not
      bits of security, and not comparable to any published cost model. A shared
      parameter name does not imply a shared quantity.

  stages_cheapest_first:
    - id: stage-1-derivation
      cost: "zero compute, ~1 h"
      content: >-
        Write out the adjoint identity and the ceiling with full proofs; a
        reviewer briefed to find a counterexample attacks both.
      can_terminate_run: true
      termination_rule: >-
        A defect in either proof ends the contract here with a derivation-tier
        negative and no compute spent. THIS IS THE CHEAPEST DECISIVE GATE AND IT
        RUNS FIRST.
    - id: stage-2-counting
      cost: "minutes, numpy only"
      content: >-
        Identity check, op and memory counts on the full grid, NULL-U, CYC-FFT,
        both gradings, and the CEILING-BOUNDARY model.
      can_terminate_run: true
      termination_rule: >-
        Any identity mismatch, a flat ratio in n, a CYC-FFT failure, or a NULL-U
        that shows a saving halts the package at that point.
    - id: stage-3-share
      cost: "hours, network required"
      content: >-
        Run the known-answer control verbatim, then measure f_score per
        standardized parameter set and apply the ceiling.
      can_terminate_run: false
      termination_rule: >-
        Unavailability halts stage 3 only. The package then reports stages 1-2
        and states the ceiling parametrically in f. THIS IS AN INFRASTRUCTURE
        OUTCOME AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE.

  metrics:
    primary:
      - "identity_agreement: count of exact matches out of 2n, per (n, k, pair)."
      - "op_ratio: naive modular multiplications / batched modular multiplications, per (n, k), amortised and unamortised."
      - "null_orbit_valid: number of the 2n unstructured images passing w^T A = 0 mod q."
      - "f_score: score-evaluation share of the optimized total per parameter set, with its decomposition, or an explicit not-measured record."
    secondary:
      - "memory_words: resident words per pool vector for both orders."
      - "cyc_fft_ratio against its textbook closed form."
      - "graded monotonicity verdicts for the n-sweep and the k-sweep."
      - "ceiling_boundary_gain: realised gain in the domain-enlarging toy model, against log2(c)."
      - "counter self-consistency: total counted operations equals the sum of per-stage tallies."

  heuristic_under_test: HEUR-DAG-1

  preregistered_prediction:
    quantity: >-
      (i) identity_agreement; (ii) op_ratio at k = 3 across n; (iii)
      null_orbit_valid; (iv) the ceiling as a function of f.
    formula: >-
      (i) 2n out of 2n, exactly, every cell, zero tolerance.
      (ii) op_ratio(n, k) = 2 k n^2 / ( k((3/2) n log2 n + n) + (3/2) n log2 n ),
      giving the frozen fixture at k = 3 of approximately 6.7, 11, 19, 30 at
      n = 32, 64, 128, 256; tolerance a factor 1.5, monotonicity required
      exactly.
      (iii) exactly 2 of 2n, and null op_ratio = 1.00 +/- 0.05.
      (iv) achievable bits = -log2(1 - f(1 - 1/c)) <= -log2(1 - f); the decision
      threshold f = 0.75 corresponds to exactly 2.00 bits, the materiality bar
      IDEA-20260722-001 declared.
    source: >-
      All four derived in H-MLKEM-6d9364 (mechanism sections B, C, D) and in
      IDEA-20260805-690de8; the ceiling is derived independently in
      IDEA-20260805-cd6e1e. NO EXTERNAL SOURCE IS CITED FOR ANY OF THEM, and no
      theorem number, page or table from any paper is asserted anywhere in this
      contract.

  scale_relevance:
    tier: toy
    justification: >-
      Two different kinds of statement live at two different tiers and the
      contract keeps them apart. The adjoint identity and the ceiling are
      ALGEBRAIC and hold at every n, so the grid is a CHECK OF A DERIVATION
      rather than an extrapolation. The op counts are toy measurements at
      n <= 256 -- which happens to be the FIPS 203 ring degree, so the grid's top
      cell is at the real ring degree, and that coincidence must NOT be reported
      as crypto-scale validation: the arms contain no key, no secret, no lattice
      reduction, and no attack. f_score, if measured, is a property of an
      estimator at standardized parameters and is reported as an estimator
      property, never as a measurement of any attack.
    correspondence: null

  tail_checks:
    - >-
      Extreme-coefficient check: repeat 20 identity pairs per cell with v and b
      drawn from the extreme values {0, 1, q-1} only, where sign-bookkeeping
      errors are maximally visible. Agreement must remain 2n of 2n.
    - >-
      n = 1 degenerate check: op_ratio must be exactly 1 and the orbit must be
      {+v, -v}. This is the baseline-embedding reproduction and it must pass
      before any other cell is reported.
    - >-
      Counter conservation: the sum of per-operation tallies must equal the
      independently recomputed closed-form count for the naive order, which is
      exactly 2 k n^2 and admits no implementation freedom. A mismatch is
      invalid_measurement.

  replication:
    seeds: [3329256, 3329257, 3329258]
    independent_instances: 3
    interpretation: >-
      Three seeds per cell. Because the identity is algebraic its agreement must
      be seed-invariant at 2n of 2n; because the op counts are deterministic
      tallies under a fixed convention they must be seed-INDEPENDENT exactly.
      ANY seed-to-seed variation in an op count is an implementation defect and
      is invalid_measurement, not a distribution. This is stated so that no
      variance can later be reinterpreted as noise.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1
    no_network_stages_1_2: true
    network_required_stage_3: true

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized under a successor goal.
    - Stop before any treatment number is read if the NULL-U and CYC-FFT arms are not committed with their digests.
    - Stop the whole package on any identity mismatch at any cell.
    - Stop the whole package if CYC-FFT does not reproduce its closed form within a factor 1.2.
    - Stop stage 3 if the known-answer control does not reproduce its reference values with delta exactly 0.
    - Stop at the first budget, memory, or wall-clock ceiling and record what was covered rather than truncating silently.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any change to the counting convention, the grid, the thresholds, or the decision rule after any number has been observed.
    - Any seed-to-seed variation in a deterministic op count.
    - Any op count reported without its paired resident-word count.
    - Any comparison of an op count with a published cost figure outside the declared f_score channel.
    - Any use of a timer in place of the explicit operation counter.
    - Absence of the pre-treatment commitment of the null and positive-control arms.
    - Citation of the sage-free harness's README output in place of a control executed in this run.

  success_criterion: >-
    This contract has no current success outcome because it is not authorized for
    execution. IF a separately approved, frozen successor is executed, its only
    positive disposition is: CYC-FFT reproduces its closed form; NULL-U returns
    exactly 2 valid orbit images and ratio 1.00 +/- 0.05; identity_agreement is
    2n of 2n at every cell and every seed; op_ratio matches the frozen fixture
    within a factor 1.5 and is monotone in n and flat in k; the memory column is
    populated for every row; the CEILING-BOUNDARY control exhibits the ceiling
    failing under domain enlargement; and either f_score is measured with its
    decomposition and the ceiling applied, or its absence is recorded as an
    infrastructure outcome with the ceiling stated parametrically in f. THAT
    DISPOSITION ESTABLISHES NO ATTACK, NO COST IMPROVEMENT, NO EXPONENT, AND NO
    CRYPTO-SCALE OR DEPLOYED-SCHEME CONCLUSION.

  falsification_criterion: >-
    H-MLKEM-6d9364 is falsified, in whole or in the named part, by any of:
    (F2) a single failure of the 2n adjoint identities at any cell -- C1 false;
    (F3) an op_ratio flat or decreasing in n -- HEUR-DAG-1 fires and the
    instrument, not the mathematics, is at fault;
    (F5) NULL-U showing a batching saving -- the observable does not identify the
    ring structure and every conclusion is void;
    (F6) f_score >= 0.75 at any standardized parameter set -- C3's prediction is
    wrong, the orbit-amortisation lane is LIVE, and this outcome must be reported
    with at least the emphasis of the opposite one;
    (F7) a counterexample to the ceiling under a fixed domain -- the lemma is
    wrong and the amplification mechanism is the more valuable finding.
    A CYC-FFT failure is NOT a falsification of anything; it is an instrument
    failure that forbids reporting.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no inference.
    future_complete_readout: >-
      Only after separate approval, freezing, authorization, and valid execution
      under a successor goal; scoped toy-only and never an ML-KEM attack claim.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, absent estimator checkout, unavailable network, or
      missing dependency is recorded as INFRASTRUCTURE SIGNAL and is NEVER
      negative mathematical evidence against H-MLKEM-6d9364, against
      IDEA-20260722-001, or against any ML-KEM proposition (AGENTS.md rule 5).
      In particular, failure to obtain the lattice-estimator checkout leaves
      f_score unmeasured and the lane OPEN, which is the conservative direction
      and is fixed here in advance.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - The stage-1 derivation note containing both proofs in full, with the reviewer's attack recorded.
    - Pre-treatment commitment digests for the NULL-U and CYC-FFT arms.
    - Raw per-cell records: (n, k, seed, pair ordinal, identity_agreement, naive count, batched count amortised and unamortised, resident words), one JSON object per line, keys sorted, UTF-8.
    - The unstructured-null membership-test log with the declared A digest.
    - The CEILING-BOUNDARY toy model, its parameters, and the realised gain against log2(c).
    - Stage-3 only: the known-answer control's verbatim stdout, the estimator commit, the cost decomposition used, and every admissible grouping of f.
    - Manifest, environment, exact argv, stdout, stderr, timestamps, and resource measurements.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms the adjoint identity and the ceiling proofs before any compute is authorized.
    - Independent review confirms the null and positive control can actually fail, and that the decision rule discriminates between them.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - A successor goal record exists; GOAL-MLKEM-001 is closed at budget and authorizes nothing.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
