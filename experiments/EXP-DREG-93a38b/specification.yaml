# EXP-DREG-93a38b
# One resultant and one content over F_2. No Macaulay matrix.
# Approved by DEC-20261001-811d21.
experiment:
  id: EXP-DREG-93a38b
  hypothesis_id: H-DREG-93dc5c
  source_idea: IDEA-20260922-70740d
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: Resultant degree and content of one linear split
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-811d21
  objective: >-
    Compute the resultant of y^2 + 1 and y + x with respect to y in two
    ways, and the content and total degree of x(y^2 + 1) as a polynomial
    in y. Do not build a Macaulay matrix.
  inputs:
    field: F_2
    p: y^2 + 1
    q: y + x
    a: x*(y^2 + 1)
    split_variable: y
    predicted:
      y_resultant: x^2 + 1
      content_in_y: x
      total_degree: 3
  controls:
    - >-
      A resultant with respect to x is computed only to be labeled
      not_the_y_split. Storing it as the y-resultant invalidates the run.
    - Two y-routes: Sylvester determinant and evaluation of p at y = x. They must not import each other.
  independent_variables:
    - route in {sylvester, evaluation}
    - split variable in {y, x}
  metrics:
    primary:
      - y_resultant
      - content_in_y
      - total_degree
      - routes_agree
      - x_resultant_labeled_separately
    secondary:
      - sylvester_matrix_shape
  heuristic_under_test: null
  preregistered_prediction:
    quantity: y-resultant, content, and total degree.
    formula: >-
      Because q = y + x is monic in y, the resultant is p(x) = x^2 + 1.
      The coefficients of a in y are x, 0, x, whose gcd is x. Total degree
      of a is 3.
    source: >-
      Hand expansion of the 3 by 3 Sylvester matrix in this design session,
      matching evaluation. IDEA-20260922-70740d was read for the degree and
      content reading. No summation polynomial was built.
  scale_relevance:
    tier: toy
    justification: Two variables over F_2. No curve and no transfer.
    correspondence: null
  tail_checks:
    - The Sylvester matrix is 3 by 3. A smaller matrix is an invalid resultant.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run is the evaluation route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the x-resultant is labeled as the y-resultant, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - x_resultant_labeled_separately is false.
    - A Macaulay matrix or a discrete logarithm is reported.
  success_criterion: >-
    Both routes agree, the y-resultant is x^2 + 1, the content in y is x,
    the total degree is 3, and the x-resultant is labeled separately.
  falsification_criterion: >-
    The routes agree, the x-resultant is labeled separately, and the
    y-resultant is not x^2 + 1, or the content is not x, or the total
    degree is not 3.
  required_artifacts:
    - experiments/EXP-DREG-93a38b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-93a38b/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-93a38b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-93a38b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-93a38b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-93a38b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Semaev polynomials and isogenies.
    - Macaulay matrices and fall degrees.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
