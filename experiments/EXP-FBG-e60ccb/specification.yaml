experiment:
  id: EXP-FBG-e60ccb
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-25269a; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-25269a
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Charged-frontier battery: six factor-base geometries built under instrumented primitive-operation
    counters at matched realised size, with exact coverage measured in the same invocation and a three-axis
    Pareto table as the deliverable'
  objective: 'The one uncertainty a run reduces is whether the ordering of factor-base geometries
    by coverage excess survives being charged for what each costs to construct. Stated in parts: (i)
    INSTRUMENT VALIDITY - do primitive-operation counters wrapped around construction reproduce a
    closed-form synthetic count exactly and the matched random base''s expected rejection-sampling
    count within tolerance, and do instrumented and uninstrumented builds produce bit-identical bases,
    since without all three no charge in the table can be read; (ii) REORDERING - at matched realised
    size on the same curves, how many rank inversions does charging induce between the ranking by
    raw coverage excess and the ranking by excess per construction operation, and which geometries
    move; (iii) GROWTH - across a ladder in base size, what growth exponent in B does each geometry''s
    construction cost exhibit, so a later agent can locate the size at which an expensive construction
    stops paying for itself. A run cannot reduce uncertainty about wall-clock time, which is deliberately
    not measured; about relation-collection cost, decomposition cost or linear-algebra cost, none
    of which are touched; about whether any geometry helps an index calculus; or about behaviour at
    cryptographic sizes. The deliverable is a three-axis table with frontier membership, per-primitive
    breakdowns, fitted growth exponents, and an explicit statement of where the prerequisite discrete-logarithm
    table charge was placed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves at the stated sizes and matched realised base size, under the declared primitive
      weighting and the declared placement of prerequisite charges, the six named geometries have
      the reported coverage excesses, the reported construction operation counts and peak memories,
      and the resulting three-axis frontier has the reported membership with the reported dominations,
      and charging does or does not reorder the panel. WHAT DOES NOT FOLLOW: nothing about wall-clock
      time or machine performance, which are not measured; nothing about the cost of collecting relations,
      decomposing points or solving a linear system; nothing about whether any geometry confers an
      advantage in an index calculus or against the generic square-root method; nothing about geometries
      not in the panel or sizes not tested; nothing that survives a change in primitive weighting
      or in where the prerequisite table charge is placed, both of which are declared choices the
      contract makes explicit precisely so a reader can reject them; and no attack, break, speedup
      or security consequence.'
  inputs:
    procedure: 'STAGE 0, counter validation (cost: minutes). Wrap field and group primitives in counters;
      run a synthetic construction with a closed-form operation count and require exact agreement;
      run instrumented and uninstrumented builds and require bit-identical bases. STAGE 1, curves
      (cost: seconds). Generate and verify prime-order toy curves via harness/toycurve.py; build discrete-logarithm
      tables where an exponent-side geometry needs one, recording the table''s own cost separately.
      STAGE 2, panel construction (cost: seconds to minutes, dominated by the greedy arm). Build six
      geometries at matched realised size, each fully instrumented, each trimmed under a declared
      rule whose cost is attributed to trimming rather than to the geometry. STAGE 3, coverage (cost:
      order N times B squared per cell). Exact multiset-sum counting over the complete target space
      for all six plus the null, with the closed-form total check on each. STAGE 4, ladder (cost:
      repeat STAGE 2 and 3 across four base sizes). Fit construction-cost growth exponents in B per
      geometry with intervals. STAGE 5, frontier (cost: minutes). Compute Pareto membership on the
      three axes and list every domination, then repeat the frontier with the prerequisite table charge
      included and excluded. STAGE 6, report (cost: 2 human hours).'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic wrapped in counting decorators,
      numpy for count vectors, and harness/runner.py for the run manifest, recorded seeds and the
      inference block. Peak construction memory measured by tracemalloc in machine words rather than
      by process resident size, so the figure is machine-independent. No Sage, no timing calls anywhere
      in the measurement path, and no solver.
    parameters: 'Curves: 4 generated prime-order toy curves per size. Sizes: N near 2^12, 2^14, 2^16
      and 2^18. Base sizes: B equal to ceiling of (6N) to the one-third power, roughly 29, 46, 73
      and 116. Arity: m equal to 3. Geometries: 6 - high-bit interval, low-degree canonical set, coset
      union, greedy low-collision, exponent-side ceiling-attaining construction, matched random null.
      Seeds: 4 per cell. Greedy implementations: 2 independent, same specification. Primitive classes
      counted: 6 - field multiplication, field inversion, square-root extraction, curve-equation evaluation,
      group addition, table lookup. Cells: 6 geometries times 4 sizes times 4 curves times 4 seeds
      equals 384, plus 96 second-implementation greedy cells and 24 counter-validation cells.'
  controls:
  - Matched random base as the reference row, instrumented and measured identically in the same invocation.
  - Synthetic construction with a closed-form operation count, run through the same counters, which
    must be counted exactly.
  - Instrumented versus uninstrumented build comparison, which must produce bit-identical bases.
  - Closed-form total check on every coverage cell - summed multiset count equals binomial(B+m-1,
    m).
  - Two independent implementations of the greedy search with the same specification, whose operation
    counts must agree in growth exponent if not in constant.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is the MATCHED RANDOM BASE, built by B uniform draws
    with rejection to stay on the curve, instrumented by the identical counters and measured by the
    identical exact coverage pipeline in the same invocation. It occupies the reference row: coverage
    excess exactly 1.000 by definition, construction cost equal to the rejection-sampling count, and
    peak memory equal to B words. For the frontier to mean anything the null must satisfy two things:
    its measured construction operation count must match its closed-form expectation - roughly two
    curve-equation evaluations per admitted point - within a stated tolerance, and its coverage excess
    must be 1.000 within intervals. A second null is required for the instrument itself: a SYNTHETIC
    CONSTRUCTION whose primitive-operation count is known in closed form, run through the same counters,
    which must be counted exactly right. Counters that miscount a known construction cannot charge
    an unknown one.'
  independent_variables:
  - geometry (six panel members)
  - base size B along the four-point ladder
  - placement of the prerequisite discrete-logarithm table charge (included or excluded)
  - greedy implementation (two independent)
  - curve instance and seed
  metrics:
    primary:
    - coverage excess ratio against the matched random null with interval
    - total construction operations per geometry
    - peak construction memory in machine words per geometry
    - excess per construction operation
    - Pareto frontier membership under the three axes
    secondary:
    - per-primitive operation breakdown
    - fitted growth exponent of construction operations in B with interval
    - trimming cost attributed separately from geometry cost
    - counter validation residual against the synthetic closed-form construction
    - rank inversion count between the excess ranking and the charged ranking
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of rank inversions charging induces, and the fitted growth exponent of construction
      operations in B for each geometry.
    formula: 'Let r_e be the ranking of the six geometries by coverage excess and r_c the ranking
      by excess divided by total construction operations, both at fixed size. The inversion count
      is the number of unordered pairs ranked oppositely by r_e and r_c. Predicted at least 2 at the
      largest tested size. Construction growth exponent g is the slope of a least-squares fit of the
      logarithm of total construction operations against the logarithm of B over the four-point ladder;
      predicted g at least 1.8 for the greedy geometry and g within 0.2 of 1.0 for the interval geometry.
      Independently checked rather than predicted: the matched random null''s operation count matches
      its closed-form expectation within 5 percent, and every coverage cell''s closed-form total residual
      is exactly zero.'
    source: Pre-registered in the parent proposal IDEA-20260816-25269a before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N from about 2^12 to 2^18, B from 29 to 116, arity 3, on
      4 curves per size with 4 seeds, with exact coverage counting over the complete target space.
      Transfer assumptions are stated and narrow: the fitted growth exponents are four-point fits
      over a range of B spanning a factor of 4, which is short, so they are reported as fitted trends
      with intervals and are explicitly not asymptotic claims. Operation counts are machine-independent
      and therefore transfer across machines but not across implementations, which the two-implementation
      greedy control quantifies for one arm only. Nothing transfers to cryptographic sizes, and in
      particular the exponent-side geometry''s prerequisite table cost grows linearly in N and would
      dominate everything at any size where the problem is hard, which the contract reports as a stated
      limit rather than extrapolating past it.'
    correspondence: null
  tail_checks:
  - The largest tested B, where the greedy arm's construction cost is highest and the growth fit is
    most informative.
  - The smallest tested B, where constant factors dominate and the fitted exponents are least reliable.
  - Cells where trimming had to remove or add the most elements, since trimming cost is attributed
    separately and a large attribution weakens the comparison.
  - The exponent-side geometry's row under both prerequisite-charging conventions, which is the single
    cell most likely to flip the frontier.
  - The two greedy implementations' most divergent cell, examined element by element.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - 'Halt and report if the synthetic closed-form counter validation fails: no charge in the table
    can be read.'
  - 'Halt and report if instrumented and uninstrumented builds differ: the instrument perturbs the
    object.'
  - Halt and report if any coverage closed-form total residual is nonzero.
  - Per-cell wall-clock budget of 1800 seconds for the coverage stage and 3600 seconds for the greedy
    construction at the largest size; exceeded cells are recorded infeasible, which is not negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Counter validation passes exactly against the synthetic construction and within
    5 percent against the matched random null's closed form, instrumented and uninstrumented builds
    are bit-identical, and the run emits a three-axis table for all six geometries at all four sizes
    with frontier membership, per-primitive breakdowns, fitted growth exponents with intervals, and
    both prerequisite-charging conventions reported - whether or not charging reorders the panel.
  falsification_criterion:
  - Synthetic counter validation fails or the null's count deviates beyond 5 percent from its closed
    form.
  - Instrumented and uninstrumented builds produce different bases.
  - Charging induces no rank inversion at any tested size, refuting the claim.
  - The two greedy implementations' fitted growth exponents differ beyond their intervals, showing
    the cost axis is implementation-defined for that arm.
  - Any coverage closed-form total residual is nonzero.
  - A panel geometry cannot be built at matched realised size on any curve, making its row infeasible
    rather than a measured cost.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-25269a
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Where the prerequisite discrete-logarithm table charge belongs is not derived and materially determines
    the frontier; a Coordinator must either fix the convention or require both tables to be published
    side by side with neither designated primary.
  - The primitive weighting used for the headline excess-per-operation figure is not derived; the
    per-primitive breakdown is published so a reader can reweight, but the headline needs a declared
    weighting a Coordinator must approve.
  - The greedy search's stopping rule is a design choice that determines its measured growth exponent;
    a Coordinator must fix it in the frozen specification or the exponent is not a property of the
    geometry.
  - Trimming cost is attributed separately but the attribution rule is asserted rather than derived.
