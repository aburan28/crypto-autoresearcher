experiment:
  id: EXP-FAEST-3acf06
  hypothesis_id: H-FAEST-d88515
  derived_from_idea: IDEA-20260805-38048d
  question_id: RQ-FAEST-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Exact combinatorial measurement of the bAVC opening-size filter's acceptance rate rho and its
    adversarial conditioning gain log2(G) at five deployed FAEST parameter sets, with a no-filter
    null forced to (1, 0), a block-contiguous structural null, a minimum-threshold positive control
    where G must be enormous, and a monotone T_open sweep
  objective: >-
    The single uncertainty a run reduces is whether the opening-size filter conditions the FAEST
    challenge space at deployed parameters, and by how much an adversary who chooses some challenge
    components can raise its acceptance probability. A run establishes (i) the entropy identity
    residual for every declared parameter set, a forced-zero macro-reading gate; (ii) revealed_max
    against the deployed T_open, which is the cheapest kill of the whole lane; (iii) rho, the
    acceptance rate at the deployed threshold, with its Monte-Carlo standard error and the FULL
    histogram of revealed(c); (iv) log2(G) with the maximising (instance, value) pair NAMED, computed
    by exhaustive conditioning rather than by assuming where the maximum lies; and (v) the expected
    signer iteration count, a performance quantity reported as such. NO FORGERY IS CLAIMED, no
    security claim of the scheme is contradicted, and nothing cryptographic is executed.
  what_this_is_not:
  - >-
    NOT a forgery, not an attack, and NOT a contradiction of any security claim. The deliverable is
    two numbers and a statement of which sentence of a security analysis would need them.
  - >-
    NOT a claim about what the specification's analysis does or does not assume. The specification has
    not been read by this program and finding out is the audit's first question; it is entirely
    possible the analysis is already correct.
  - >-
    NOT a cryptographic experiment. It is exact combinatorics on a binary heap; no AES, no VOLE, no
    consistency check and no signature is computed.
  - >-
    NOT a composable bit figure. log2(G) bounds the accounting slack from THIS SOURCE ALONE and does
    not compose with other links without an argument this contract does not supply.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: full_parameters
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the five executed deployed parameter sets, at the pinned
      implementation commit, the acceptance rate rho and the conditioning gain log2(G) take stated
      values with stated errors, revealed_max takes a stated value against the deployed T_open, and
      the expected signer iteration count is 2^w_grind divided by rho. The computation is EXACT at
      deployed parameters and is not a toy extrapolation, which makes it stronger than toy ON THIS
      AXIS ONLY. WHAT DOES NOT FOLLOW - no forgery, no security-category statement, no claim about
      AES or VOLE, no composition of log2(G) with any other accounting link, and no claim about the
      specification if the implementation diverges from it.
  inputs:
    procedure: >-
      STAGE 0 (zero compute) - PIN A COMMIT SHA and record the per-file hash of every source file
      read; re-read the leaf-position map, the opening routine and THE CHALLENGE-DECODING STEP. If
      any differs from the mechanism in H-FAEST-d88515, STOP and supersede rather than patch. If the
      decoding reduces modulo an index range rather than slicing bits, HEUR-FC-1 is refuted, the
      reference measure is wrong, and the induced bias is measured and reported as a SEPARATE finding
      rather than folded in. STAGE 1 (seconds) - verify the entropy identity log2|C| + w_grind =
      lambda for every declared parameter set; enumerate the heap tree for one set and confirm depths
      and leaf indices by direct enumeration; compute revealed(c) for the two extremal families - all
      components equal, and a maximally spread vector - and confirm the derived bracket. STAGE 2
      (seconds to minutes) - the NULL ARMS FIRST, hash-committed before any treatment number: run the
      identical pipeline with T_open set to infinity, forced to rho exactly 1 and log2(G) exactly 0;
      then run the block-contiguous structural null. STAGE 3 (minutes) - Monte-Carlo rho over at
      least 10^6 uniform challenges at five parameter sets, reporting the FULL histogram of
      revealed(c), not just rho. If the tail at the deployed threshold is thinner than 1e-4, SWITCH TO
      EXACT DYNAMIC PROGRAMMING over the tree rather than reporting an unresolved tail. STAGE 4
      (minutes) - compute G by EXHAUSTIVE conditioning over all single components and all their
      admissible values, then over sampled pairs; report log2(G) with Monte-Carlo error bars and NAME
      the maximising (instance, value) pair. STAGE 5 (minutes) - the graded T_open sweep and the
      positive control at the minimum threshold. STAGE 6 (zero compute) - report rho, log2(G), the
      histograms, the expected signer iteration count, and the explicit statement that no forgery is
      claimed.
    instrument: >-
      Pure Python with no dependencies. The entire working set is a bitmask over the tree's nodes -
      at most a few tens of thousands - so memory is negligible. Monte-Carlo with recorded seeds;
      exact dynamic programming over the tree where the tail requires it. No cryptography is executed
      and no signature is produced. Recorded through harness/runner.py with the pinned commit sha and
      per-file hashes in the manifest.
    parameters: >-
      All declared parameter sets for the entropy identity; five sets for the distributional arms - a
      category-1 fast set, a category-1 small set, an EM variant, one 192-bit set and one 256-bit
      set - chosen to span both the mixed-size and the uniform-size instance shapes. At least 10^6
      uniform challenges per set, with the effective sample size IN THE TAIL reported. T_open sweep
      over revealed_min, the 10th, 25th, 50th, 75th and 90th percentiles of the revealed histogram,
      the deployed value, and revealed_max.
  controls:
  - >-
    NULL OBJECT OF THE SAME SHAPE, FORCED VALUE DERIVED BEFORE THE RUN, CAN FAIL. The identical
    pipeline with T_open set to infinity - no filter. FORCED - rho exactly 1.000000 and log2(G)
    exactly 0.000000 for every parameter set, because the conditioning event becomes the whole space.
    If the code reports rho below 1 or G above 1 there, the estimator is broken and NO NUMBER FROM
    ANY OTHER CELL MAY BE REPORTED.
  - >-
    SECOND NULL, STRUCTURAL. Replace the interleaved leaf layout by the BLOCK-CONTIGUOUS layout -
    instance i occupies a contiguous run of leaf slots - keeping the leaf count, tau and T_open
    identical. FORCED PREDICTION STATED BEFORE THE RUN: under the contiguous layout the tau hidden
    leaves can never be adjacent across instances, so the MINIMUM of revealed(c) RISES and log2(G)
    FALLS relative to the deployed layout. If the two layouts give identical histograms, the
    interleaving is NOT the mechanism and the stated cause is wrong even if the numbers are right.
  - >-
    POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Set T_open to the smallest value
    admitting any challenge at all. Then the accepted set is exactly the maximally clustered
    challenges and G MUST be enormous - at least 1/rho, i.e. log2(G) at least log2(1/rho), which is
    much greater than 1. If log2(G) is near 0 in that cell, the conditioning estimator cannot detect
    conditioning and NO NEGATIVE MAY BE REPORTED ANYWHERE.
  - >-
    GRADED CONTROL, AT LEAST FIVE INTERIOR POINTS, MONOTONICITY REPORTED. Sweep T_open over
    revealed_min, five percentiles, the deployed value and revealed_max. rho(T) MUST be non-decreasing
    in T and log2 G(T) MUST be non-increasing, both reaching (1, 0) at revealed_max. A non-monotone
    point LOCALISES a bug in the union-of-paths counter rather than leaving 'it did not work'.
  - >-
    CROSS-SET CONSISTENCY. One selected set has all instances the same size while another has mixed
    sizes. The same code must handle both; a crash or a silent shape assumption holding for only one
    is an INFRASTRUCTURE finding, never a mathematical one.
  - >-
    ENTROPY-IDENTITY GATE, FORCED ZERO, COSTS NOTHING. The macro-derived identity must hold exactly
    for every declared parameter set. A nonzero residual means the macros were misread and every
    number downstream is void.
  - >-
    ORDERING CONTROL. Both null arms are computed and hash-committed before any treatment number is
    read. The direction of interest - consequence (B) moves toward the adversary - is the one this
    lane is most motivated to find, and the null-first ordering is the mitigation.
  - >-
    EXHAUSTIVE ARGMAX, NOT ASSUMED ARGMAX. G is computed by conditioning over ALL single components
    and ALL their admissible values, so HEUR-FC-2 is used only to predict the direction. If the
    measured argmax lies elsewhere, the heuristic is refuted while the number stands.
  independent_variables:
  - parameter set, across the five selected deployed sets
  - 'T_open, over the graded sweep from revealed_min to revealed_max'
  - 'leaf layout: deployed interleaving versus block-contiguous structural null'
  - 'conditioning subset: none (rho), single component (G), sampled pairs'
  metrics:
    primary:
    - >-
      entropy_identity_residual per declared parameter set - integer, log2|C| + w_grind - lambda
      computed from the parameter macros. FORCED EXACTLY 0.
    - >-
      revealed_max per set - integer, the maximum of revealed(c) over the challenge space by exact
      search or a derived combinatorial bound, reported against the deployed T_open.
    - >-
      rho at the deployed T_open per set - dimensionless probability, Pr[revealed(c) <= T_open] over
      uniform c, with its Monte-Carlo standard error and the effective sample size IN THE TAIL, or
      computed exactly by dynamic programming where the tail is thinner than 1e-4.
    - >-
      log2_G per set - bits, the base-2 logarithm of max over (instance i, value v) of Pr[accept |
      c_i = v] divided by rho, with error bars and THE MAXIMISING (instance, value) PAIR NAMED.
    secondary:
    - >-
      full histogram of revealed(c) per set, with sample count and seed - reported in full, not
      summarized to rho.
    - >-
      expected_signer_iterations per set - dimensionless, 2^w_grind divided by rho. A PERFORMANCE
      quantity, labelled as such.
    - >-
      no_filter_null values - rho and log2(G) with T_open infinite, forced exactly (1, 0).
    - >-
      contiguous_layout_histogram per set, with its revealed_min and log2(G) against the deployed
      layout's.
    - >-
      rho(T) and log2 G(T) at every rung of the graded sweep, with monotonicity reported.
    - >-
      pinned commit sha and per-file hash of every source file read.
    - >-
      challenge_decoding_verdict - bit-slicing or modular reduction, read from the code, with the
      induced bias measured separately if it is modular.
  heuristic_under_test: HEUR-FC-1
  preregistered_prediction:
    quantity: 'revealed_max against the deployed T_open; rho at the deployed T_open; and log2(G).'
    formula: >-
      revealed_max STRICTLY GREATER than the deployed T_open at at least one declared set - if it is
      at most T_open everywhere, the branch is unreachable, rho is 1, G is 1, and both consequences
      vanish. rho STRICTLY between 0 and 1, with no point estimate pre-registered because none is
      derivable without the run; two-sided falsification - rho equal to 1 kills the lane, and rho
      below 2^-8 would imply more than 2^16 signer iterations, contradicting published performance and
      indicating the MODEL is wrong. log2(G) STRICTLY POSITIVE with NO MAGNITUDE PRE-REGISTERED;
      log2(G) equal to 0.00 within Monte-Carlo error is a clean negative and IS a result.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-38048d, whose predictions block states the
      entropy identity's forced zero, the strict inequality on revealed_max with the derived bracket,
      the two-sided falsification on rho, and the explicit refusal to pre-register a magnitude for
      log2(G). Fixed before any run and never tuned to data. The derived bracket rests on a
      leaf-depth argument that has NOT been enumerated, which is exactly what stage 1 enumerates.
  scale_relevance:
    tier: full_parameters
    justification: >-
      The measurement is EXACT at the deployed parameter sets, because the tree is a binary heap of at
      most a few tens of thousands of nodes and can be handled directly - there is no toy stage, no
      reduced parameter, and no extrapolation, which is why the claim tier is full_parameters rather
      than toy. That strength is ON ONE AXIS ONLY: the combinatorics of the opening filter. It confers
      nothing about AES, about VOLE correlations, about the consistency check, or about the scheme's
      security category. The one genuine boundary is IMPLEMENTATION VERSUS SPECIFICATION - every
      structural fact is read from a reference implementation at a pinned commit, and if the
      specification's opening procedure differs, the object measured is the implementation's.
    correspondence: >-
      Not applicable. The measurement is made directly on the deployed parameter sets; there is no
      proxy object and no correspondence to justify.
  tail_checks:
  - >-
    rho is a TAIL PROBABILITY. Report the effective sample size in the tail at the deployed threshold,
    and SWITCH TO EXACT DYNAMIC PROGRAMMING over the tree if the tail is thinner than 1e-4 rather than
    reporting an unresolved Monte-Carlo estimate.
  - >-
    Report the FULL histogram of revealed(c), not just rho, so the shape of the accepted region is
    visible and a threshold sitting on a cliff is distinguishable from one sitting on a plateau.
  - >-
    Report the maximising (instance, value) pair for G by name, so a reader can check the argmax
    against HEUR-FC-2's predicted direction rather than trusting the maximum.
  - >-
    Report rho(T) and log2 G(T) at every rung with monotonicity checked; a non-monotone point
    localises a bug in the union-of-paths counter.
  - >-
    Report the null arms' measured values BEFORE the treatment arm in the deliverable, matching the
    order in which they were computed and committed.
  - >-
    Report the challenge-decoding verdict explicitly. If the decoding is modular rather than
    bit-slicing, every rho and G in the run is measured against the wrong reference measure and must
    be labelled so.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 12
  stopping_rules:
  - >-
    STOP AND SUPERSEDE at stage 0 if any read structural fact differs from the mechanism in
    H-FAEST-d88515. The record is superseded, never patched.
  - >-
    STOP if the entropy identity residual is nonzero anywhere. The macro reading is wrong and every
    number downstream is void.
  - >-
    STOP if the no-filter null does not return rho exactly 1 and log2(G) exactly 0. The estimator is
    broken and nothing may be reported.
  - >-
    STOP the lane at stage 2 if revealed_max is at most T_open at every deployed set. The filter is
    vacuous and the clean scoped negative IS the deliverable.
  - >-
    SWITCH from Monte-Carlo to exact dynamic programming rather than continuing to sample if the tail
    at the deployed threshold is thinner than 1e-4.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and
    is NEVER negative mathematical evidence (AGENTS.md rule 3). A crash on the mixed-size parameter
    set is an infrastructure finding about a shape assumption, never a mathematical one.
  - >-
    A run with no pinned commit sha and no per-file hashes is completed_invalid; every structural fact
    would be unreproducible.
  - >-
    A run in which any treatment number was read before both null arms were hash-committed is
    completed_invalid. The direction of interest here moves toward the adversary and the ordering is
    the mitigation.
  - >-
    A run reporting rho from a Monte-Carlo estimate whose tail effective sample size is below the
    declared floor, without switching to exact computation, is invalid_measurement.
  - >-
    A run reporting log2(G) from an ASSUMED argmax rather than an exhaustive conditioning search is
    invalid_measurement.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
    new contract.
  success_criterion: >-
    The commit is pinned with per-file hashes; the entropy identity residual is exactly 0 at every
    declared parameter set; the no-filter null returns rho exactly 1 and log2(G) exactly 0 and is
    hash-committed before any treatment number; the minimum-threshold positive control returns
    log2(G) at least log2(1/rho); the graded sweep is monotone in both quantities and reaches (1, 0)
    at revealed_max; and the run reports revealed_max, rho with its tail effective sample size,
    log2(G) with its named maximising pair, the full revealed histogram, and the expected signer
    iteration count at five deployed parameter sets. H-FAEST-d88515 is SUPPORTED only if revealed_max
    exceeds the deployed T_open AND rho is strictly between 0 and 1 AND log2(G) is strictly positive
    beyond its error bar; each of the two clean negatives below is an equally complete deliverable.
  falsification_criterion:
  - >-
    revealed_max is at most T_open at every deployed set. The filter is VACUOUS, rho is 1, G is 1,
    and the lane closes with a clean scoped negative - the opening filter does not condition the
    challenge space at deployed parameters. That negative IS a deliverable and feeds the goal's
    barrier horn.
  - >-
    log2(G) is 0 within error at every deployed set. Acceptance is componentwise neutral and a
    uniform-challenge forgery model is safe on this axis. Also a complete deliverable.
  - >-
    The entropy identity residual is nonzero anywhere. The macro reading is wrong and the record is
    superseded, not patched.
  - >-
    The no-filter null does not return rho exactly 1 and log2(G) exactly 0. Instrument broken; nothing
    may be reported.
  - >-
    The minimum-threshold positive control returns log2(G) near 0. The estimator cannot detect
    conditioning even where conditioning is extreme, and NO NEGATIVE MAY BE REPORTED ANYWHERE.
  - >-
    The block-contiguous null gives an identical histogram to the deployed interleaving. The
    interleaving is not the mechanism, and the stated cause is wrong even if the numbers are right.
  - >-
    rho falls below 2^-8, implying more than 2^16 signer iterations per signature. That contradicts
    published performance and indicates the MODEL is wrong rather than the scheme being slow.
  required_artifacts:
  - manifest.yaml with the exact command, pinned implementation commit sha, per-file source hashes, commit sha of this repository, dirty-tree state, resolved model/inference block and environment
  - the entropy_identity_residual for every declared parameter set
  - raw-result.json carrying the FULL histogram of revealed(c) per set with sample count and seed, not summaries
  - rho at the deployed T_open per set, with Monte-Carlo standard error and tail effective sample size, or the exact dynamic-programming value
  - log2(G) per set with the maximising (instance, value) pair NAMED
  - both null arms' measured values, hash-committed before the treatment arm and reported first
  - the graded T_open sweep table with rho(T) and log2 G(T) at every rung
  - expected_signer_iterations per set, labelled a performance quantity
  - the challenge-decoding verdict read from the code, with the induced bias measured separately if it is modular
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract is
    review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The proof_search_map on H-FAEST-d88515 must be audited before implementation, per KN-TECH-080 and
    the Coordinator's proof-oriented dispatch gate.
  - >-
    Stage 0's commit pinning is a PREREQUISITE, not a step. The parent proposal read source at a
    moving reference with no sha; approving execution without pinning approves an unreproducible
    measurement.
  - >-
    The disclosure posture must be settled before approval. This measures a deployed signature
    scheme's reference implementation; the run package is internal and no agent publishes it, and any
    implementation-versus-specification divergence escalates to the Coordinator.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-38048d
    authored_at: '2026-08-25'
    note: >-
      The five controls - the no-filter null with its forced (1, 0), the block-contiguous structural
      null, the minimum-threshold positive control, the graded T_open sweep and the cross-set
      consistency check - are taken from the parent proposal's minimal_test.controls block, and the
      predictions and falsification conditions from its own blocks, including its explicit refusal to
      pre-register a magnitude for log2(G) and its two-sided falsification on rho. The
      switch-to-exact-DP rule and the exhaustive-argmax requirement are the parent's confounders and
      HEUR-FC-2 validation_plan turned into contract rules. Boilerplate identical across contracts by
      program rule comes from the fixed table.
  derivation_gaps:
  - >-
    The commit sha is NOT pinned. Every structural fact in the mechanism was read at a moving
    reference, so the mechanism could already be stale. Stage 0 repairs this and its result may
    supersede the hypothesis rather than test it.
  - >-
    The derived upper bracket on revealed(c) rests on a leaf-depth argument that has NOT been
    enumerated. If the true maximum is below the deployed T_open the whole lane is vacuous, and that
    is the outcome with the highest prior weight among the negatives.
  - >-
    Whether the challenge decoding slices bits or reduces modulo is UNREAD. If it reduces modulo, rho
    and G are computed against the wrong reference measure and the run's headline changes from two
    numbers to a decoding-bias finding.
  - >-
    G is computed exhaustively over SINGLE components and only over SAMPLED pairs. The true
    multi-component maximum could be larger, so the reported log2(G) is a lower bound on the
    componentwise-conditioning gain and must be labelled so, not reported as the maximum.
  - >-
    Which five parameter sets are selected is not fixed by the parent proposal beyond its examples.
    The selection must span both the mixed-size and uniform-size instance shapes and must be named
    before approval, since choosing sets after seeing a histogram would be a fit.
