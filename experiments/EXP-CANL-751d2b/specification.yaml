experiment:
  id: EXP-CANL-751d2b
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-761a8c
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE SMALL-p ARTIFACT NULL FOR EVERY HEIGHT MEASUREMENT IN THIS LANE: at p = 101 a naive
    lift has 7-bit coordinates and a rank-2 curve''s low-height points already cover ~4.5% of E(F_p),
    so ANY "CM helps" signal below p ~ 10^4 is presumptively the abundance of small integers -- the
    instrument must show the covering fraction decaying like (log p)^{r/2} Reg^{-1/2} / p with slope
    -1 against p, and must detect a planted lift, before any L9 number is believed'
  status: draft
  objective: "(A) THE FAILURE MODE THIS RECORD EXISTS TO PREVENT. Every other L9 record measures a\
    \ height-derived quantity at toy p. The quantity that decides all of them is the covering fraction\n\
    \    rho_lift(B) = |{P in E(F_p) : P = red(P~), hhat(P~) <= B}| / N.\nAt the scales this campaign\
    \ can run, rho_lift is LARGE FOR A REASON THAT HAS NOTHING TO DO WITH ARITHMETIC. A naive x-lift\
    \ takes x in [0, p), which is log_2 p bits -- 7 bits at p = 101, 20 bits at p = 10^6. The number\
    \ of global points with naive height at most log p on a rank-r curve is ~(log p)^{r/2} Reg^{-1/2},\
    \ so\n    rho_lift ~ (log p)^{r/2} / (Reg^{1/2} p).\nNUMERICALLY, at r = 2 and Reg ~ 1: p = 101\
    \ gives ~4.6/101 = 4.5%; p = 10^4 gives ~9.2/10^4 = 0.09%; p = 2^30 gives ~2e-8. THE SIGNAL FALLS\
    \ BY SEVEN ORDERS OF MAGNITUDE OVER THE RANGE A TOY EXPERIMENT SPANS. A measurement taken at one\
    \ small p, or averaged over a narrow ladder, will show an apparently substantial lifting success\
    \ that is pure small-integer abundance, and it will look exactly like a CM effect if the CM arm\
    \ happens to sit at smaller p or smaller regulator.\n(B) THE INSTRUMENT, AND ITS TWO REQUIRED\
    \ DIRECTIONS. Per docs/inventor-protocol.md (\"controls before belief\") and DECOMPOSITION.md\
    \ L14, an instrument must FAIL to detect a signal in a matched null AND must DETECT a planted\
    \ one. This record specifies both for L9:\n  NEGATIVE DIRECTION -- the instrument must return\
    \ no CM excess on a\n    matched non-CM curve, and the covering fraction must DECAY with slope\n\
    \    -1 against p at fixed B. A covering fraction that does not decay is the\n    canonical artifact\
    \ tell.\n  POSITIVE DIRECTION -- the instrument must recover a PLANTED lift:\n    choose P~ on\
    \ the global curve with known small height, set the\n    \"target\" to red(P~), and confirm the\
    \ pipeline finds P~ at the\n    corresponding B. An instrument that cannot find a lift that is\
    \ there\n    cannot report that lifts are absent.\n\n(C) THE NULL OBJECTS, NAMED, EACH WITH THE\
    \ PARAMETER THAT MUST DESTROY IT.\n  N1 MATCHED NON-CM CURVE. Same exhibited rank, minimal discriminant\n\
    \    within a factor 2, same p, same enumeration box. Destroys: any claim\n    attributing a covering\
    \ fraction to CM. Decay parameter p.\n  N2 RANDOM LATTICE WITH MATCHED REGULATOR AND A RANDOM\
    \ SURJECTION ONTO\n    Z/N. Same shape, no arithmetic. Destroys: any claim that a covering\n \
    \   EXPONENT is arithmetic rather than lattice-shape. Decay parameter:\n    rank -- the exponent\
    \ must move with r and with nothing else.\n  N3 SYNTHETIC O-ACTION. A random order-3 or order-4\
    \ Z-linear isometry of\n    the Mordell-Weil lattice substituted for the genuine zeta action.\n\
    \    Destroys: any claim that the O-module structure, rather than a\n    lattice symmetry, produced\
    \ an effect. Decay parameter |D_E|: the\n    genuine action's companion-height ratio must grow\
    \ like sqrt(|D_E|)\n    and the synthetic one's must not.\n  N4 TARGET RESHUFFLE. Resample k with\
    \ the curve, the lift and P fixed.\n    Every curve-only statistic must be unchanged. Destroys:\
    \ any claim that\n    a curve statistic carries information about the discrete log -- which\n\
    \    is DECOMPOSITION.md L7's canonical control and applies verbatim here.\n  N5 TORSION-ONLY\
    \ ARM. A rank-0 CM curve, where the covering fraction is\n    forced to |tors|/N = O(1)/N at every\
    \ B. Destroys: any pipeline that\n    reports non-trivial coverage where none can exist.\n\n(D)\
    \ THE DECAY LAW, PRE-REGISTERED SO IT CANNOT BE TUNED. At fixed naive height bound H (in bits),\
    \ across a ladder of p:\n    log rho_lift = (r/2) log H - (1/2) log Reg - log p + const,\nso the\
    \ slope against log p is EXACTLY -1, for every rank, every regulator, CM or not. THAT SLOPE IS\
    \ THE INSTRUMENT'S CALIBRATION AND IT IS RANK-INDEPENDENT, which makes it a strong test: a fitted\
    \ slope materially different from -1 on either arm indicts the pipeline before any arithmetic\
    \ conclusion is drawn.\n(E) WHY THIS IS A PROPOSAL AND NOT A FOOTNOTE. Without it, the most likely\
    \ outcome of this lane is a toy-scale measurement showing that CM lifts \"cover 3% of E(F_p) while\
    \ random curves cover 1%\", reported as a CM advantage, when the entire effect is that the CM\
    \ arm sat at p = 101 with a smaller regulator. The campaign has an explicit precedent for a formalisation\
    \ error surviving an exact computation (KN-FIND-008: \"an exact count removes sampling error.\
    \ It removes no model error, and in this case model error dominated the result\"). This record\
    \ is the model-error control for L9 and it is blocking for every other L9 proposal."
  resource_label: '"audit: consumes no resource. The instrument measures other lanes'' use of R6 and
    R3; it consumes neither and mounts no attack."'
  admissibility: admissible
  admissibility_argument: 'A control lane consumes no resource and therefore cannot fail the admissibility
    filter; it also cannot produce an attack, which is stated so the record is not mistaken for one.
    Its admissibility question is inverted: the instrument must be able to DETECT resource use, i.e.
    it must separate a genuine R3/R6 effect from a lattice-shape or small-p effect. Null N3 is exactly
    that test, and if N3 reproduces a claimed CM effect then that effect never used R3 at all and
    the proposal it came from is retrospectively inadmissible on its own terms.'
  reachability_gate: 'T5 NOT APPLICABLE AS AN ATTACK GATE -- this record moves between no curves and
    reaches for no object. It is recorded rather than omitted because the instrument DOES move between
    curves in one sense: it reduces ONE fixed global curve at MANY primes, which is the reverse of
    the lane''s direction and costs O(1) per ladder point (a reduction of integer coefficients mod
    p). That reversal is what makes the ladder affordable, and it is precisely why the instrument
    can be run before the expensive canonical-lift construction priced in IDEA-20260807-ee6ef7 at
    p^{1+o(1)}: the calibration does not require any canonical lift at all, only global curves with
    known CM. So the instrument''s gate cost is polylog(p) per point and it is reachable in every
    regime, including the ones where the lane''s own object is not.'
  inputs:
    procedure: 'STAGE 0 (minutes, HARD GATE): rank-1 closed-form validation of the enumeration; exact
      integer match at every B or the line halts. STAGE 1 (hours): the ladder measurement on 6 global
      curves (3 CM with h(D_E)=1, 3 matched non-CM) at 5 primes, fixed box. STAGE 2 (hours): nulls
      N1-N5 on the identical pipeline. STAGE 3 (minutes): planted positive and planted negative. STAGE
      4 (minutes): fit all slopes with jackknife intervals. STAGE 5 (zero compute): emit the calibration
      certificate; declare pass/fail per arm.'
    mechanism: 'STEP 1 -- FIX THE ENUMERATION BOX AND FREEZE IT. x = u/w^2 with |u| <= U, 1 <= w <=
      W, both declared in bits, identical across every arm. Any arm using a different box is not comparable
      and must not be pooled. STEP 2 -- BUILD THE LADDER. At least 5 primes spanning >= 3 decades
      (e.g. 101, 1009, 10007, 100003, 1000003), with the SAME global curves reduced at each -- so
      the global side is held exactly fixed and only p varies. THIS IS THE DESIGN CHOICE THAT MAKES
      THE SLOPE TEST CLEAN: with the curve fixed, Reg and r are constants and the only p-dependence
      is the 1/N. STEP 3 -- MEASURE rho_lift ON EVERY ARM AND FIT THE SLOPE. Report the slope with
      a jackknife interval per arm. STEP 4 -- RUN THE FIVE NULLS. N1-N5 as specified in part (C),
      on the identical pipeline, with identical box and ladder. STEP 5 -- PLANT AND RECOVER. For each
      global curve, pick P~ with hhat below the smallest ladder bound, set Q := red(P~), and confirm
      recovery at every p. Report recovery rate; anything below 100% is an instrument bug. STEP 6
      -- PLANT A NEGATIVE. Set Q to a point known NOT to be in red(S) (constructible by taking Q outside
      the subgroup generated by the reductions of the exhibited generators, when that subgroup is
      proper). The instrument must report failure. An instrument that "finds" a lift for an unliftable
      target is worse than useless. STEP 7 -- ISSUE A CALIBRATION CERTIFICATE. A short machine-readable
      record stating box, ladder, slopes per arm, null outcomes, planted-positive and planted-negative
      results. NO OTHER L9 MEASUREMENT MAY BE REPORTED WITHOUT CITING A PASSING CERTIFICATE.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - Rank-1 closed form (instrument self-validation).
  - N1 matched non-CM curve.
  - N2 random lattice with matched regulator.
  - N3 synthetic O-action.
  - N4 k-resample invariance.
  - N5 rank-0 torsion-only arm.
  - Planted positive and planted negative.
  - 'NULL OBJECT (from the proposal): THIS RECORD IS THE NULL OBJECT CONTROL, and it carries its own:
    the instrument itself must be validated against a case with a CLOSED-FORM answer. On a rank-1
    curve with generator P0, red(S) is exactly the set of multiples [m]red(P0) with m^2 hhat(P0) <=
    B, so rho_lift has an exact closed form. The pipeline must reproduce it as an EXACT INTEGER at
    every ladder point. DECAY PARAMETER for the instrument''s own validation: B. The closed-form count
    must grow like sqrt(B) and the measured count must match it term by term; a measured count that
    fails to track sqrt(B) means the enumeration box is not covering the height ball and every downstream
    number is biased.'
  independent_variables: []
  metrics:
    primary:
    - rho_lift per (curve, p, B), exact counts and denominators
    - Fitted slope with jackknife interval per arm
    - Empirical max |hhat - h_x/2| per curve
    - Excess ratios CM/N1 per ladder point
    secondary:
    - Companion-height ratio, genuine and N3
    - Planted-positive recovery and planted-negative false-positive rates
    - Enumeration box (U, W), ladder, and every dropped (curve, p) with reason
  heuristic_under_test: null
  preregistered_prediction:
    quantity: fitted slope of log rho_lift against log p at fixed height box, per arm, with the global
      curve held fixed
    formula: FORCED VALUE -1.00, jackknife interval within +-0.15, on EVERY arm including every null.
      A slope outside that band on any arm indicts the pipeline and blocks every L9 measurement until
      it is fixed.
    source: pre-registered in IDEA-20260807-761a8c before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'Cofactor. If #E(F_p) has a large cofactor, N is not ~p and the slope test is misapplied. Excluded
    by curve selection and recorded.'
  - Enumeration box shape. A naive-height box is not a canonical-height ball; the distortion is curve-dependent
    through log|Delta| and is reported per curve so cross-arm comparisons are interpretable.
  - Regulator estimation from exhibited generators can be off by the square of a finite index, shifting
    rho_lift's intercept. Slopes only.
  - Ladder ends. At the small end coverage saturates; at the large end no points are found. Both are
    censored cells and must be reported as censored, never as measurements (AGENTS.md rule 5).
  - Twist coupling. Reducing one global curve at several p gives curves of unrelated group structure;
    this is intended (it holds the global side fixed) but it means the ARITHMETIC of E(F_p) varies
    uncontrolled across the ladder, so only the 1/N dependence may be read from it.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: FORCED VALUE -1.00, jackknife interval within +-0.15, on EVERY arm including
    every null. A slope outside that band on any arm indicts the pipeline and blocks every L9 measurement
    until it is fixed.
  falsification_criterion:
  - The rank-1 closed form does not reproduce exactly. The enumeration is wrong; nothing in L9 may
    be reported until it is fixed.
  - Any arm's slope falls outside -1.00 +- 0.15. The pipeline is not measuring what the decay law
    says it measures.
  - Null N3 reproduces the genuine O-action's companion-height growth. The "CM effect" is a lattice
    symmetry and every CM attribution in this lane must be withdrawn.
  - Null N4 shows any curve-only statistic moving with k. Implementation leak; halt.
  - Null N5 shows non-trivial coverage on a rank-0 curve. The counter is including torsion or twists.
  - Planted positive recovery below 100% or planted negative false positives above 0%. The instrument
    fails in one of the two required directions and no L9 negative may be reported from it (AGENTS.md
    rule 5; inventor protocol section 3).
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-761a8c
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
