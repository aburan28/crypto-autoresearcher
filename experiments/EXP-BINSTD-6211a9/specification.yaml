      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Re-derive sect163k1/sect163r2 identities from FIPS 186-4 and verify
    symbolic (P1) plus M1 constant-vector weights; reproduce n=17 Trimoska
    C-KK fixture. (B) At n=23, measure exhaustive lambda_x (M2) and Macaulay
    rank / first-fall profiles (M3) across the four cells with fixed V and
    arity; decide among (E1)/(E2)/(E3) / HB2-2. (C) Replicate at n=29; run
    N2; report M5 on C-KK. Never claim a deployed-curve break.

  class: control
  class_note: >-
    Nearby-object control / identification experiment (inventor-protocol
    null objects before belief). Primary scientific target is HB2-2
    (heuristic-validation of degree-invariance under the constant) via M3.
    Not a smoothness-CDF heuristic-validation. Not a cost-model table for
    deployed attacks. Measured vs modeled columns stay separate. No
    exponent-moving claim. M4 deferred.

  corrections_absorbed:
    fips_rederivation_gate: >-
      HOLD-J: Stage 0 MUST re-derive a, b, cofactor, order bit-length, and
      field polynomial for sect163k1 and sect163r2 from FIPS 186-4 primary
      (or NIST CAVP / FIPS PUB text) before any deliverable asserts the
      single-variable-pair claim at claim strength. Secondary OpenSSL dump
      remains motivation-only until that gate passes; unrecovered=true with
      attempted URLs is allowed and freezes the claim as unverified.
    ownership_nistbin: >-
      HOLD-J / DEC-20260924-4f8a03 R2: structural/identification content
      stays under RQ-BINSTD-b6f698; every measured decomposition-cost or
      yield artifact dual-cites RQ-NISTBIN-06157b. Hypothesis and experiment
      carry related_question_ids: [RQ-NISTBIN-06157b].
    wdsat_m4_deferred: >-
      HOLD-J: WDSat not installed. M4 conflict-count arm is EXCLUDED from
      this contract. M3 (macaulay.py) is the preprocessing-immune decisive
      arm. Source-IDEA M4 predictions retained as named future arms only.

  scope:
    included:
      - >-
        Stage 0 (zero scientific trials on deployed curves):
        (i) FIPS 186-4 re-derivation of sect163k1/sect163r2 parameters;
        (ii) symbolic Weil-descent expansion of S_3 confirming b in degree-0
        only and a nowhere in S_3 (P1);
        (iii) M1 constant-vector weights for four toy cells at the Stage-1
        field (predicted 1 for b=1, Binomial(n,1/2)-band for generic b);
        (iv) n=17 Trimoska C-KK fixture recompute (#E, |Fb_E|, rho rows);
        (v) ownership note citing RQ-NISTBIN-06157b for measured arms.
      - >-
        Stage 1 (toy n=23): build C-KK, C-GK, C-KG, C-GG over one field /
        one reduction poly; fixed V dim l=11; m_a=2 exhaustive pair table;
        M2 |Fb_E∩V| and lambda_x; M3 degree-by-degree Macaulay ranks and
        first-fall; verify top-degree identity FIRST; N1 identity control;
        known-false V-in-ker-Tr odd-m_a control on a Tr(a)=1 cell.
      - >-
        Stage 2 (toy n=29): replicate M2/M3; N2 second independent C-KG;
        M5 C-KK <tau,-1> orbit count, U, relation count, matched rho;
        optional m_a=3 where 2^{3l}/6 affordable; certificate-verify every
        claimed decomposition.
    excluded:
      - Any scientific group walk / attack run at deployed m >= 131
      - M4 WDSat conflict-count arms (deferred; WDSat not installed)
      - Filing a deployed-curve security / break claim
      - Editing AUXIN / QSP / SEMBIN / prior EXP-BINSTD packets
      - Amazon Bedrock
      - Normal-basis constant-vector experiments (owned by f37254 / HOLD-I)

  inputs:
    proposal: ledger/proposals/IDEA-20260922-8ac1ea.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8ac1ea.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-4c31d1.yaml
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      - experiments/EXP-CERTBIN-e94b27/impl/instances.py
    literature_targets:
      - id: fips_186_4_binary_curves
        refs:
          - 'https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-4.pdf'
          - 'FIPS PUB 186-4 Appendix D (recommended curves)'
        extract: >-
          sect163k1 and sect163r2: field polynomial, a, b, cofactor, order
          (or order bit-length) — for single-variable-pair verification
        provenance_on_success: retrieved
    cells:
      Stage0-fips-pair:
        curves: [sect163k1, sect163r2]
        frozen_secondary_expectations:
          field_poly_exponents: [163, 7, 6, 3, 0]
          a: 1
          cofactor: 2
          order_bit_length: 163
          differ_in: b_only
        note: >-
          Secondary expectations from OpenSSL dump; Stage 0 must verify or
          record disagreement against FIPS primary.
      Stage0-trimoska-n17:
        n: 17
        a: 1
        b: 1
        frozen_expected:
          group_order_E: 131174
          r: 65587
          Fb_E_sizes: [204, 238]
          rho_negation: 227
          rho_tau_neg: 55
        tolerance: exact_integer
      Stage1-n23:
        n: 23
        l: 11
        m_a: 2
        cells: [C-KK, C-GK, C-KG, C-GG]
        V: 'one fixed F_2-subspace of dimension 11, identical across cells'
        basis: polynomial
        seeds: [20261001, 20261002]
      Stage2-n29:
        n: 29
        l: 11
        m_a: [2, 3]
        cells: [C-KK, C-GK, C-KG, C-GG]
        N2_extra_C_KG: true
        M5_C_KK: true
        seeds: [20261003, 20261004]
      NULL-known-false:
        description: >-
          V inside ker Tr, odd m_a, Tr(a)=1 cell must give exactly zero
          G-target decompositions; a single one falsifies class criterion
          or construction.
      CTRL-N1-identity: >-
        Same cell, same instances, different seeds — noise floor.
      CTRL-N2-transported: >-
        Two independently drawn b-generic curves in C-KG must agree within N1.
      CTRL-N3-generic-group: >-
        Relabelled Z/rZ with random-labelled factor base of same size — yield
        bookkeeping only (optional Stage 2 if budget allows).

  controls:
    - name: identity_N1
      object: Same cell, same instances, different seeds; noise floor for cell contrasts.
    - name: transported_curve_N2
      object: Two independent C-KG draws; must agree within N1 or DO-E.
    - name: generic_group_N3
      object: Relabelled Z/rZ factor-base bookkeeping; optional Stage 2.
    - name: known_false_class
      object: >-
        V in ker Tr, odd m_a, Tr(a)=1 → exactly zero G-decompositions
        (IDEA-20260915-8fe0ef S2).
    - name: reproduction_trimoska
      object: n=17 C-KK fixture must match frozen expected before any cell report.
    - name: matched_rho_baseline
      object: >-
        Per cell: sqrt(pi r/(4n)) on C-KK; 0.886 sqrt(r) on the other three.
    - name: top_degree_identity
      object: >-
        Verify top-degree part of descended system identical across cells
        BEFORE comparing ranks or yields — instrument gate.
    - name: certificate_oracle
      object: Every claimed decomposition re-verified by summing points on the curve.

  independent_variables:
    - stage  # 0 | 1 | 2
    - n  # 17 | 23 | 29
    - cell  # C-KK | C-GK | C-KG | C-GG
    - a_in_F2  # true | false
    - b_in_F2  # true | false (b=1)
    - m_a
    - seed

  metrics:
    primary:
      - fips_single_variable_pair_verified
      - symbolic_P1_pass
      - constant_vector_weight_M1
      - top_degree_identity_pass
      - Fb_E_intersect_V_M2
      - lambda_x_M2
      - macaulay_rank_profile_M3
      - first_fall_degree_M3
      - HB2_2_holds
      - pattern_E1_E2_E3
      - N2_agreement
      - M5_orbit_count_U_rho
    secondary:
      - Tr_a
      - group_order_E
      - r
      - cofactor_h
      - certificate_pass_rate
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - fips_unrecovered
      - ownership_nistbin_cited

  heuristic_under_test:
    - HEUR-BINSTD-4c31d1-HB2-1
    - HEUR-BINSTD-4c31d1-HB2-2

  preregistered_prediction:
    quantity: >-
      (A) FIPS: sect163k1/r2 share field poly / a=1 / h=2 / order bit-length,
      differ in b only;
      (B) P1: b appears only in degree-0 of descended S_3; a nowhere in S_3;
      (C) M1: weight=1 on b=1 cells; Binomial band on b-generic;
      (D) HB2-2 / M3: rank profile and first-fall IDENTICAL across four cells
      (zero-variance); a single differing rank = outcome DO-C;
      (E) M2 / E3: with V in ker Tr and odd m_a, lambda_x = 0 on Tr(a)=1
      and >0 on Tr(a)=0;
      (F) under E1: C-KK and C-GK agree in M3; only M5 separates C-KK;
      (G) N2: two C-KG curves agree within [0.85,1.18] where ratios apply;
      (H) NO deployed-curve security claim under any outcome.
    formula: >-
      S_3 = (x1x2+x1x3+x2x3)^2 + x1x2x3 + b;
      |Fb_E ∩ V| ~ (2^l-1)/2 + O(2^{l/2});
      HB2-2: rank_d(C) equal for all cells C at each degree d up to first fall;
      matched rho_C-KK = sqrt(pi r/(4n)); rho_other = 0.886 sqrt(r).
    source: >-
      IDEA-20260922-8ac1ea (P1)-(P3), (E1)-(E3), HB2-1/HB2-2, minimal_test;
      HOLD-J review concrete_experiment; H-BINSTD-4c31d1
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 FIPS parameters are RETRIEVED (or unrecovered); symbolic P1 and
      M1 weights are RECOMPUTED; Trimoska fixture quantities are RECOMPUTED
      vs frozen expected. Stage 1/2 M2 counts and M3 ranks are MEASURED;
      matched rho values are MODELED comparators (labeled modeled) placed
      beside measured IC metrics — never mixed into one unlabeled column.
      Cell-pattern verdicts (E1/E2/E3) are INTERPRETED from measured M2/M3
      against this pre-registered prediction and must cite the metric IDs.

  scale_relevance:
    tier: toy
    justification: >-
      Executable cells at n in {17,23,29} only. Deployed sect163k1/r2 appear
      solely as Stage 0 FIPS identity verification and design motivation.
      Transfer to m>=163 is NOT claimed; extrapolation distance (factor ~5–7
      in n) must be stated if any qualitative reading is discussed.
    correspondence: null

  sample_size_justification: >-
    M3 is a zero-variance prediction (HB2-2): a single differing rank across
    cells refutes it; plan >=20 matched instances per cell at n=23 (source
    IDEA validation_plan) so that instrument noise is visible via N1.
    M2 at m_a=2, l=11 is exhaustive (2^22 pair tests) — complete census, not
    a sample. N2 requires two independent C-KG draws. Seeds listed under
    replication; identity control reuses instances across two seeds.

  tail_checks:
    - Report the single most extreme (lowest/highest) rank disagreement across cells, not only the median profile.
    - Report smoothest / highest-yield cell separately from medians.
    - Known-false control must report exactly zero; any positive is hard fail.
    - Top-degree identity failure is hard instrument halt, not a soft finding.

  replication:
    seeds:
      - 20261001
      - 20261002
      - 20261003
      - 20261004
    independent_instances: >-
      Stage 0 deterministic (FIPS + symbolic + fixture). Stage 1: >=20 matched
      M3 instances per cell at n=23 plus full M2 census; N1 = two seeds on
      same instances. Stage 2: n=29 M2/M3 replicate; second C-KG for N2;
      M5 on C-KK.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 30
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when FIPS artifact (or unrecovered), symbolic-P1
      pass/fail, M1 table, Trimoska fixture report, and NISTBIN ownership
      note are written.
    - >-
      Stage 1 may start only after stage0/ exists. Stage 1 complete when
      four-cell parameter table, M2 yields, M3 rank profiles, top-degree
      identity check, N1 report, and known-false control are written.
    - >-
      Stage 2 may start only after stage1/ exists. Stage 2 complete when
      n=29 M2/M3, N2 report, and M5 C-KK artifacts are written
      (instrument_ceiling allowed for m_a=3).
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - Hard halt if top-degree identity fails or known-false control fails.

  invalidation_rules:
    - Top-degree parts differ across cells (P1 instrument failure)
    - Constant-vector weight != 1 on a b=1 cell
    - Known-false control yields a non-zero G-decomposition
    - certificate_pass_rate < 1.0 on claimed decompositions
    - Trimoska fixture disagrees with frozen expected integers
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Claiming retrieved FIPS provenance without verified_by / without reading
    - Mixing measured IC metrics and modeled rho into one unlabeled column

  success_criterion: >-
    Stage 0: FIPS verification or unrecovered recorded; symbolic P1 result
    present; M1 weights match pre-registered bands (or instrument failure
    named); Trimoska fixture matches frozen integers; ownership note cites
    RQ-NISTBIN-06157b. Stage 1: four cells built; top-degree identity passes;
    M2 and M3 tables present for all cells; N1 and known-false controls pass;
    HB2-2 hold/fail and pattern_E1_E2_E3 decided from predefined metrics.
    Stage 2: n=29 replicate; N2 pass/fail; M5 present for C-KK. Decidable
    from predefined metrics. Success does NOT include any deployed-curve
    security claim. M4 is not part of success.

  falsification_criterion: >-
    Top-degree non-identity; M1 weight failure on b=1; known-false non-zero;
    N2 failure (DO-E); HB2-2 rejected by a single differing M3 rank (DO-C —
    a valid scientific outcome, not infrastructure). Distinguish
    infrastructure via invalidation_rules.

  required_artifacts:
    - experiments/EXP-BINSTD-6211a9/stage0/fips-sect163-rederivation.yaml
    - experiments/EXP-BINSTD-6211a9/stage0/symbolic-P1-check.yaml
    - experiments/EXP-BINSTD-6211a9/stage0/M1-constant-vector-weights.yaml
    - experiments/EXP-BINSTD-6211a9/stage0/trimoska-n17-fixture.yaml
    - experiments/EXP-BINSTD-6211a9/stage0/ownership-nistbin-note.md
    - experiments/EXP-BINSTD-6211a9/stage1/four-cell-params.yaml
    - experiments/EXP-BINSTD-6211a9/stage1/top-degree-identity.yaml
    - experiments/EXP-BINSTD-6211a9/stage1/M2-yield-table.yaml
    - experiments/EXP-BINSTD-6211a9/stage1/M3-rank-profiles.yaml
    - experiments/EXP-BINSTD-6211a9/stage1/controls-N1-knownfalse.yaml
    - experiments/EXP-BINSTD-6211a9/stage1/pattern-verdict.yaml
    - experiments/EXP-BINSTD-6211a9/stage2/n29-M2-M3.yaml
    - experiments/EXP-BINSTD-6211a9/stage2/N2-transported-curve.yaml
    - experiments/EXP-BINSTD-6211a9/stage2/M5-C-KK-orbit-rho.yaml
    - experiments/EXP-BINSTD-6211a9/stage2/certified-decompositions/
    - experiments/EXP-BINSTD-6211a9/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-6211a9/runs/*/raw-result.json
    - experiments/EXP-BINSTD-6211a9/runs/*/stdout.log

  procedure:
    stage0:
      - Retrieve FIPS 186-4 (or NIST source); extract sect163k1/r2 parameters; compare to secondary dump; write fips-sect163-rederivation.yaml with provenance retrieved|unrecovered.
      - Symbolically expand Weil descent of S_3 over the Stage-1 basis; confirm b only in degree 0 and a absent; write symbolic-P1-check.yaml.
      - Compute M1 constant-vector weights for four toy cells; write M1-constant-vector-weights.yaml.
      - Recompute Trimoska n=17 C-KK fixture; halt on integer disagreement; write trimoska-n17-fixture.yaml.
      - Write ownership-nistbin-note.md citing RQ-NISTBIN-06157b for measured arms.
    stage1:
      - Build four curves over F_{2^23} with one reduction poly; record a,b,#E,r,h,Tr(a).
      - Fix V dim 11; verify top-degree identity across cells BEFORE further work.
      - Exhaustive M2 at m_a=2; compute |Fb_E∩V| and lambda_x per cell.
      - M3 Macaulay ranks degree-by-degree and first-fall on >=20 matched instances per cell.
      - Run N1 (two seeds) and known-false control; write controls report.
      - Decide HB2_2_holds and pattern_E1_E2_E3; write pattern-verdict.yaml.
    stage2:
      - Replicate M2/M3 at n=29.
      - Draw second C-KG; write N2 agreement report.
      - On C-KK: orbit count, U, relation count, matched rho (M5).
      - Certificate-verify every claimed decomposition; optional m_a=3 if affordable.

  optimistic_assumptions:
    - >-
      Pure-Python Macaulay ranks at n=23,l=11,m_a=2 fit within 8 GiB and the
      DEC-20260913-47bbb7 budget — if not, record instrument_ceiling and
      reduce instance count with partial labeled results (bias: may under-
      power N1 noise estimate).
    - >-
      Exhaustive 2^22 pair tests complete within advisory wall-clock —
      otherwise checkpoint partial census labeled partial (bias: incomplete
      lambda_x).
    - >-
      FIPS PDF retrievable in this environment — else unrecovered freezes
      single-variable-pair claim as unverified (bias: none on toy science).

  memory_accounting: >-
    Dominant structures: V of size 2^11 elements; pair table logical size
    2^22 (may be streamed); Macaulay matrices at degree <=4 over GF(2) for
    descended systems. Peak RSS measured per run and reconciled against
    analytic sizes in the Stage 1/2 reports. No time-memory tradeoff
    introduced.

  hidden_overhead_disclosure: >-
    Basis/curve-general descent generator is shared HOLD-I/J implementation
    cost, not hidden in an o(1). Exhaustive m_a=3 costs 2^{3l}/6 and may hit
    instrument_ceiling — disclosed, never silently omitted. No asymptotic
    o(1) claim hides superpolynomial work.

  impediments_on_approval:
    - id: IMP-WDSat-M4
      raised: '2026-10-01'
      condition: WDSat not installed (HOLD-J defect)
      what_is_blocked: M4 conflict-count arm of IDEA-20260922-8ac1ea minimal_test Step 4
      clears_when: WDSat (or equivalent CNF-XOR solver with conflict metrics) available and a protocol_amendment authorizes M4
      recheck: which wdsat || ls experiments/*/impl/*wdsat* 2>/dev/null; review amendments/
      asserts_nothing_about: M3 / HB2-2 / E1-E3 identification from M2/M3
