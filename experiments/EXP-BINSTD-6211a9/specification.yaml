  version: 1
  title: >-
    Stage 0 FIPS sect163k1/r2 re-derivation + symbolic S_3 P1 check + M1
    + n=17 Trimoska fixture; Stage 1 n=23 four-cell (C-KK/C-GK/C-KG/C-GG)
    exhaustive M2 yield + M3 Macaulay rank / first-fall; Stage 2 n=29
    replication + N2 transported-curve null + M5 C-KK orbit/rho
  status: analyzed
  approved_by: DEC-20261001-f5758f
  approved_at: '2026-10-01'
  analyzed_by: DEC-20261001-c01e95
  analyzed_at: '2026-10-01'
  evidence_id: EV-BINSTD-f2f987
  packaging_only: false
  approval:
    approved_by: DEC-20261001-f5758f
    composing_decision: DEC-20261001-f5758f
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. HOLD-J defects absorbed. M4/WDSat
      not authorized. No deployed-curve security claim.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stages 0-2. Stage 0 is FIPS literature/arithmetic + symbolic P1 +
      fixture recompute (zero scientific group walks on deployed curves).
      Stage 1 is toy n=23 four-cell M2/M3. Stage 2 is n=29 replication +
