experiment:
  id: EXP-ECDLP-d6d8e8
  hypothesis_id: H-ECDLP-51f052
  proposal_id: IDEA-20260909-4c5ee9
  question_id: RQ-ECDLP-002
  goal_ids:
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  version: 2
  title: 'Prym rank census: fixed 64-branch sample versus complete 3584-branch support'
  designed_at: '2026-10-25'
  status: approved
  objective: Collect exact accepted-row and projected-rank observations for a nested
    sampled versus exhaustive branch policy on fresh toy inputs, separating finite
    row scarcity from recorded dependence without a scientific verdict.
  inputs:
    design_brief: research/prym_experiment_design_20261019/brief.md
    prior_intake: research/prym_relation_followup_20261019/README.md
    problem: problems/prym-assisted-source-labelled-router.md
    proposal: ledger/proposals/IDEA-20260909-4c5ee9.yaml
    archive_task_id: TASK-20261025-5de6df
    depends_on:
    - Existing W2 observations are prior data only; all rank-census fixtures and candidate
      observations are fresh.
    historical_calibration: The published internal PO-transfer-003 cells p=101,211,431,4099
      are calibration only. Reuse exact historical factor bases/parameters only if
      recovered from their immutable artifacts; their table is not a current baseline.
    fresh_fixture_rule: For p in [101,211,431,4099], fix A=2 and enumerate B=1..p-1.
      Exclude every (p,A,B) in the committed W, S and E panels. Require smooth genus2
      C:y^2=x^6+A*x^2+B and both elliptic quotients, prime odd r=#E1(Fp), r!=p, and
      eight distinct nonzero norm classes up to sign. Choose first two eligible B
      per p. Archive every inspected candidate/rejection and EC1 curve metadata before
      approval. Do not filter on rows or rank.
    maps: pi1(x,y)=(x^2,y); pi2(x,y)=(B/x^2,B*y/x^3), with x=0/infinity handled by
      projective local formulas. The second equation is W^3+A*W^2+B^2. Never silently
      substitute a different quotient family.
    generator_rule: On each prime-order E1, P is the first nonidentity affine point
      in lexicographic (U,Y) order; subgroup certificates accompany P.
    factor_base_rule: Choose the first eight distinct nonzero pi1 images up to sign
      of rational C points in lexicographic (x,y) order; choose lexicographically
      least C preimage for each signed-normalized norm class. Norms are public points
      without supplied logarithms. Transport this base under coordinate controls;
      do not reselect.
    known_source_grid: Exactly public a=1..64; every arm uses the identical predeclared
      scalar set and seed0 ordering. Public-source images expose anchors, which are
      removed identically in both arms. Seeds are ordering nuisance, never independent
      curves.
    calibration_constructor: PO003-style cubic v through a source lift (with declared
      sign and lambda) and three native base lifts; factor the residual polynomial
      and use the divisor of y-v on C, including its pole/infinity contribution. Its
      norm supplies a publicly labelled source equation. This is calibration, not
      the absent new compact router.
    new_constructor: No new compact router is supplied or required for the PO003 engineering
      audit. Any later claim outside P1546 must separately bind one exact constructor,
      source inverse and scope distinction; a generic interface is not an algorithm.
    fixture_file: research/prym_rank_census_20261025/fixtures.json
    configuration: research/prym_rank_census_20261025/config.json
    source_rule: For each public source, sample arm attempts 64 distinct branch IDs
      using frozen deterministic rule; exhaustive arm attempts every branch ID in
      C(8,3) x {0,1,2,3}^3 = 3584. Fixed order and canonical alias law are bound in
      config/source. Same source lifts, base and rejection law in both arms.
    secret_interface: No Q, target scalar, truth-log table or private challenge exists
      in this observational census.
    prior_results: EXP-ECDLP-cded08 / RUN-ECDLP-d25f6a measured 448 accepted rows
      and six full-rank nontrivial cells of 24 under its original stream. These are
      seen design inputs; no new fixture acceptance/rank observed before this freeze.
  controls:
  - 'C-W-positive: explicitly planted publicly known-source relations and valid cubic
    principal-divisor fixtures pass independent checks; calibration only.'
  - 'C-W-bad: wrong a+1 label, wrong sign, malformed divisor multiplicity and missing
    infinity term must each be rejected; synthetic cases have exact expected labels.'
  - 'C-W-rank: duplicate norms, sign-equivalent columns, zero rows, and all-known-log
    bases must produce their exact reduced U and rank; these do not count as newly
    useful rank.'
  - 'C-W-posthoc: arbitrary smooth tuple followed by K=i(R)-sum eD without an independent
    locator must be flagged verifier-only.'
  - 'C-W-tuple: tuple-first endpoint with unknown scalar cannot be relabelled known-source
    by a hidden discrete log.'
  - 'C-W-aa: fixed bijective re-encoding/permutation of atom indices with transported
    maps preserves canonical source equations, U and rank.'
  - 'C-W-random: same-size/same-field split E1 x A control with independent matched
    auxiliary labels; auxiliary cancellation alone must not manufacture a known source
    scalar.'
  - 'C-R-nested: after quotienting canonical geometric aliases, every sampled accepted
    equation must occur in exhaustive support; projected rank exhaustive>=sampled
    under exactly the same public-anchor projection.'
  - 'C-R-nullspace: independent dense elimination verifies rank, augmented rank and
    right-kernel witnesses for every deficient projected matrix; kernel dimension
    must be U-rank.'
  - 'C-R-workload: independent replay regenerates the exact descriptor support/order
    and accepted/rejected outcomes for every finite attempted branch; no omitted rejected
    work.'
  - 'C-R-stop: full rank does not terminate collection; all remaining prescribed attempts
    retained. First-full-rank event and costs are descriptive checkpoints only.'
  independent_variables:
  - 'branch coverage: 64 distinct sampled branches or all 3584 branches per public
    source'
  - 'curve: eight prospectively selected fixtures; no rank-based screening'
  metrics:
    primary:
    - Accepted row count and rejection/canonical-alias counts by fixture and arm (integer).
    - Actual U after all public-source anchors, rank(M), rank([M|b]) modulo target
      prime r; nullspace/pivot certificates.
    - Distinct canonical rows and rank increment versus accepted rows and attempted
      descriptors; first-full-rank attempt if U>0, otherwise null.
    secondary:
    - Raw instrumented construction/field/source/cache/hash and matrix operation vectors;
      shared input-search work reported separately and cold setup charged to both
      arms.
    - Wall seconds, CPU seconds and peak self RSS bytes by arm and checker, with scope
      limits.
    - Complete prescribed/replayed branch support; independent replay costs are separate.
      No end-to-end weighted S is supplied.
  replication:
    seeds:
    - 0
    independent_instances: 8
    interpretation: Four fixed toy fields and two deterministic fresh curves per field;
      finite panel rather than random population sample. Complete enumeration has
      no sampling uncertainty on its frozen support.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
  - 'Exactly eight fixed fixtures, two arms and public sources1..64; sample64 branches/source,
    full3584 branches/source: 1,867,776 attempts total, including source-lift failures
    and aliases.'
  - Never stop at full rank, select only useful cells, add anchors/branches, change
    base or repair exceptions after seeing census outcomes.
  - U=0 is retained all-public calibration; no unknown-log recovery count. Infrastructure
    censoring retains partial outputs and asserts no mathematical result.
  invalidation_rules:
  - Any source/target secret or verifier log table reaches the attack, its feature
    construction, tuning, ordering or file/network side channel.
  - Projected rank uses raw atom count, signed duplicate columns, all-known-log columns
    or a modulus other than r.
  - Verifier shares the candidate witness implementation without an independent source-equation
    checker; branch misses/rejects or infinity exceptions are omitted.
  - Coordinate A/A alters the factor-base set instead of transporting it.
  success_criterion: 'C-R-workload/C-R-nested and source/rank controls pass: all fixed
    attempts retained and independently replayed; every accepted public source/divisor
    equation verified; exact projections, ranks and kernel certificates valid. This
    is measurement completion, not a requirement for full rank or attack gain.'
  falsification_criterion: The sampling instrument is invalid if C-R-workload, C-R-nested
    or any planted/malformed/rank control fails. Rank deficiency or no rows is a recorded
    mathematical observation on the fixed support, not instrument failure and not
    universal impossibility.
  required_artifacts:
  - Native launch and execution receipts, exact command/environment/stdout/stderr
    and checker logs.
  - manifest.yaml; immutable raw-result and attempt event stream in declared deterministic
    gzip representation if needed, preserving exact attempted support and outcomes.
  - verification.json with independent full-stream replay, witness/rank/kernel checks
    and all failures.
  - report.md, graph-source.json, graph.svg and inspected report.pdf; one fresh report
    per run session.
  - For files covered by AGENTS.md artifact policy, artifact-store bytes plus tracked
    .artifacts.json and ignore rules, with all content hashes retained; no oversized
    raw Git commit.
  assigned_to: executor-implementation
  approved_by: DEC-20261025-1bd76a
  approval_blockers: []
  execution_authority: Exact native preapproval, committed Coordinator approval/archive,
    ordinary ready and published live claim required. Canonical storage delivery must
    complete before the native receipt is sealed.
  cost_accounting:
    complete_work: Retain a vector of raw field operations by field, elliptic/Jacobian
      additions and multiplications, polynomial arithmetic/factorization, comparisons/hash
      operations, matrix operations and bytes moved. Do not add unlike units without
      a frozen weight model. S is the current matched baseline protocol's complete
      weighted operation count, with its weights bound before approval. Wall time
      and CPU are secondary diagnostics.
    charge:
    - public instance/cover search including rejected candidates
    - map construction, normalization, factor-base generation, advice/training and
      tuning
    - all candidate generation, failed lifts, branch enumeration and rejected tuples
    - companion labels, selector evaluation, row normalization, witness/source checks
      and independent-rank maintenance
    - linear algebra, target descent, recovery, and final source verification
    accounting_scope: Both cold-start and genuinely amortized totals; no free offline
      table, oracle, secret witness or uncharged rejected stream. Reference/checker
      work is reported separately and cannot be supplied to the attack.
    memory: Record peak process-group RSS bytes plus peak live algebraic words/table
      entries and serialized advice bytes. A 2 GiB guard protects headroom; any guard
      stop is censored infrastructure, not a complete successful solve.
  interpretation_limits:
  - Fixed generator source/rank audit only; no novel compact router, measured IC gain,
    asymptotic exponent or deployed security claim.
  - The unsourced historical 32-cover quotation is not an input catalog; no identification
    or completeness claim is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute
    or reopen the IDEA-002 frozen contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication
    alone does not solve ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure
    impediment, not mathematical falsification.
  decision_impact:
    on_positive: If exhaustive support records U>0 full rank after checker passes,
      design a separate cost/selector study that measures all costs on useful collectors.
      No automatic scientific promotion.
    on_negative: If rank remains deficient, retain exact finite nullspace/row evidence.
      Design one explicitly changed constructor/base prospectively if warranted; do
      not claim a structural cap from enumeration.
    on_inconclusive: Resolve a concrete arithmetic/replay/custody/runtime failure,
      preserve prior attempts and refreeze under amendment/new ID before further science.
  preregistered_predictions:
  - id: P-R-nested
    quantity: sampled versus complete-support rank under fixed projection
    prediction: Because sampled descriptors are a subset, independently verified exhaustive
      rank is at least sampled rank. A failure is a measurement/control defect, not
      a surprising cryptanalytic result.
  - id: O-R-rank
    quantity: finite row count and exact matrix rank
    prediction: 'Descriptive observable: no direction or full-rank outcome is presupposed.
      Record whether enumeration changes rows, rank and rank deficit on each fixture.'
  scale_relevance:
    tier: toy
    justification: Finite implementation/algorithm experiments; no transfer to secp256k1
      or P-256.
    correspondence: null
  constructor_api:
    public_inputs:
    - field/curve/cover/projective-map encodings and certificates
    - P,r, frozen native atoms D_j with public norm points F_j
    - public scalar a and R=[a]P; seed and explicit branch/circuit identifier
    forbidden_inputs:
    - factor-base logarithms
    - synthetic target scalar k
    - offline source-log lookup table
    - post-hoc residue declared as the mechanism
    output:
      status: relation | declared_failure
      row: integer coefficients e_j reduced modulo r, plus source coefficient c with
        gcd(c,r)=1 and known public scalar a
      source_equation: '[c*a]P = sum_j [e_j]F_j, with any known-log columns subtracted
        to the right-hand scalar'
      witness: explicit principal-divisor/function/ideal certificate and complete
        exceptional-point/multiplicity data; alternatively i(R)-sum e_j D_j=K with
        an independently constructed K and verified n(K)=0, giving c=degree(pi)
      provenance: all attempts, branch queries, construction steps, helper tables
        and costs
    verifier: Rebuild public maps/point sums independently; verify every claimed principal
      divisor and source scalar equation. Merely computing K after choosing a tuple
      is rejected as a locator.
  rank_protocol:
    canonicalization: Work modulo the target prime r. Remove zero projected columns;
      merge identical F_j and F_j=-F_l with their coefficient signs. Retain native-to-projected
      column map and every discarded row. Known-log points have public derivations
      checked and their terms moved to b.
    matrix: M*x=b, where x has U actual distinct unknown projected logarithms relative
      to P. Publish U, source-label vector b, rank(M), rank([M|b]), and pivot/independent-row
      certificates.
    target: Unique factor-base recovery requires rank(M)=U and consistency rank([M|b])=U.
      If only homogeneous rows are generated, the scalar gauge needs an independently
      known public anchor; after deleting that anchored unknown the required rank
      is the remaining number. No universal B-1 rule.
    diagnostic: Native Jacobian rank, number of rows and apparent auxiliary cancellations
      are secondary; none substitutes for projected rank modulo r. Never use verifier
      truth logs to select a basis or choose rows.
    blind_descent: For a separately sealed Q, return gamma*Q+delta*P=sum e_j F_j with
      gamma nonzero mod r, a valid native witness, and full costs; recover k=gamma^-1*(sum
      e_j*x_j-delta) mod r. Challenge/verifier alone holds k until sealed attack output.
    alias_audit: For S sampling, independently verify source coefficient normalization,
      FB permutation, global deck and hyperelliptic involution orbits. Geometrically
      equivalent acceptance events must have identical canonical keys and train/holdout
      partition. Known-log oracles cannot supply this canonicalizer.
  prediction_provenance:
  - prediction: P-R-nested
    first_recorded_in: experiments/EXP-ECDLP-d6d8e8/specification.yaml
    written_at: '2026-10-25'
    data_seen:
    - path: experiments/EXP-ECDLP-cded08/runs/RUN-ECDLP-d25f6a/raw-result.json
      measured: Prior W2 accepted rows and deficient/full/U0 ranks on a different
        panel/stream were seen.
    - path: research/prym_experiment_design_20261019/implementation/README.md
      measured: Prior W2 status, implementation/cost/isolation limits and historical
        PO003 context were seen.
    sample_status: out_of_sample
    overlap: No new A=2 fixture acceptance labels or projected matrices have been
      inspected. Prior panels excluded before selection.
  - prediction: O-R-rank
    first_recorded_in: experiments/EXP-ECDLP-d6d8e8/specification.yaml
    written_at: '2026-10-25'
    data_seen:
    - path: experiments/EXP-ECDLP-cded08/runs/RUN-ECDLP-d25f6a/raw-result.json
      measured: Prior W2 accepted rows and deficient/full/U0 ranks on a different
        panel/stream were seen.
    - path: research/prym_experiment_design_20261019/implementation/README.md
      measured: Prior W2 status, implementation/cost/isolation limits and historical
        PO003 context were seen.
    sample_status: out_of_sample
    overlap: No new A=2 fixture acceptance labels or projected matrices have been
      inspected. Prior panels excluded before selection.
  variable_ledger:
    independent:
    - name: branch_coverage
      levels:
      - sample64
      - exhaustive3584
    - name: fixture
      levels: eight fresh deterministic toy curves
    factors:
    - name: factor_base
      treatment: fixed
      value: same eight norm classes and native lifts in paired arms
      how: Transport original base, never reselect after observation.
    - name: source_schedule
      treatment: fixed
      value: same a1..64 seed0 order and source-lift convention
      how: Bind exact public rule and remove all exposed anchors in both arms.
    - name: constructor
      treatment: fixed
      value: PO003 cubic plus residual quadratic
      how: Identical interpolation, exceptional chart and alias rejection laws.
    - name: arithmetic_and_rank
      treatment: fixed
      value: same bound producer and independent checker versions
      how: Rank mod r after same projection; independently replay all branch acceptance.
    - name: encoding
      treatment: fixed
      value: canonical and transported atom permutation
      how: A/A witness/rank control; no extra scientific fixture.
    - name: host_and_load
      treatment: measured
      value: native manifest and resource records
      how: Time diagnostic only; no speed claim.
    comparisons:
    - id: C-R-coverage
      arms:
      - sample64
      - exhaustive3584
      differs_in:
      - branch_coverage
      design: one_factor
    - id: C-R-aa
      arms:
      - canonical accepted rows
      - transported reencoding
      differs_in:
      - encoding
      design: aa
    - id: C-R-source-null
      arms:
      - auxiliary cancellation with unknown source
      differs_in: []
      design: absolute
    crosses_map: true
    aa_not_applicable: Exact complete-support counts/ranks have zero statistical noise;
      transported encoding is still checked as a correctness control.
  transfer_obligations:
  - map: Native principal divisor on C -> publicly source-labelled E1 norm equation
    kind: cover
    source: C:y^2=x^6+2*x^2+B and aP lifted by fixed chart
    destination: E1:Y^2=U^3+2*U+B prime-order relation matrix
    preserves:
    - working prime field and subgroup r
    - public source equation when witnessed
    - same projected unknown columns in both arms
    changes:
    - native divisor support becomes elliptic norm classes
    - kernel information and sign/known-log columns can disappear
    controls:
    - kind: identity_map
      comparison: C-R-aa
    - kind: matched_random
      comparison: C-R-source-null
    assessment: research/prym_experiment_design_20261019/protocol_summary.json
    assessment_key: transfer_assessments.W
    limit: Inherited split-product control challenges source manufacture only; no
      auxiliary enrichment or random-distribution effect is inferred from it.
