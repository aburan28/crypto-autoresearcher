experiment:
  id: EXP-PFDR-c04716
  hypothesis_id: H-PFDR-06fd60
  question_id: RQ-PFDR-ae2fba
  idea_id: IDEA-20260903-dcf857
  version: 1
  recorded_at: '2026-09-03'
  drafted_under_task: TASK-20260903-b5d2ae
  battery_position: 6 of 6 (zero-run static derivation; pairs with EXP-PFDR-cbdefb)
  title: >-
    Zero-run static derivation of the conditional cost table of the
    digit-presentation decomposition oracle under a bounded last fall degree
    -- the semi-regular slice reproducing IDEA-20260808-da1428 exactly, the
    hybrid-optimum flip, the crossbred degeneration, and the D_0 thresholds
    at log2 N in {64, 128, 256} that EXP-PFDR-cbdefb's Outcome III must be
    read against
  status: review_required
  approved_by: null
  assigned_to: executor
  zero_run_contract: true
  implementation_authorized: false
  implementation_authorized_note: >-
    No solver, no curve, no Macaulay matrix, no run. A DERIVATION-AID
    SCRIPT (exact integer binomials, both omega columns, the real-valued
    balance solver) is permitted as an archived artifact under
    runs/STATIC-001/ because IDEA-20260903-dcf857 names it as the authority
    over its hand arithmetic; it is an incidental mechanical arithmetic
    check in the sense of EXP-JPR-402649's budget note, produces no run
    record and no manifest.yaml, and is not evidence about any curve.
  claim_ceiling: >-
    zero_experiment_static_derivation_and_cost_artifact_only; conditional
    on HEUR-001 of H-PFDR-06fd60 throughout; no ECDLP evidence, no speedup,
    no closure, no hypothesis or goal status change; every number labelled
    estimate, never measured.
  claim_tier_basis: >-
    DERIVATION TIER per docs/claims-and-verification.md ('Refutation
    artifacts' item 2 and 'Concrete-cost estimation artifacts' of
    docs/evidence-and-reproducibility.md). No solve is claimed; the only
    certificate kind that can arise is none. The artifact is a concrete_cost
    record in the sense of templates/research-records.md, labelled
    heuristic_estimate, with every optimistic assumption flagged.
  objective: >-
    Write, with ZERO runs, the concrete-cost artifact that the target
    profile (docs/target-result-profile.md A8, C13-C15) and the Coordinator's
    promotion gates require to accompany any conditional exponent claim in
    this lane, BEFORE any measurement could promote it. STAGE 0 (the
    deliverable): a derivation-aid script that emits C(k) = 2^k Ncols(n - k,
    D(k))^omega for k = 0..n - s under both D(k) = d_reg(k) (null slice) and
    D(k) = min(D_0, d_reg(k)) (bounded slice), at (m, s) in {(3, 6), (4, 8),
    (5, 8)} and at the balanced s per table cell, both omega in {2, 2.807},
    the balance B = (m! 2^m C N)^{1/(m+1)} iterated to convergence, and the
    table at log2 N in {64, 128, 256} for m in {3, 4, 5}, D_0 in {4, 6, 8};
    the three fixtures (null slice reproduces da1428's full-guessing
    optimum and N^1; the direct presentation reproduces da1428's
    B^{2 omega - 1} ratio; the C = 1 and C = B^{m-1} limits reproduce 84cdb7
    and N^1); the D_0 thresholds per (m, omega) at each N; the interior-band
    cells under HEUR-002 only. STAGE 1 (zero compute): the concrete_cost
    block filled per templates/research-records.md with optimistic
    assumptions, overestimating factors, parallelism, time-memory tradeoff,
    affected and safe scope, each cell tagged with its (D_0, omega).
    Budget note required by the template floors: no run occurs;
    wall_clock_seconds_per_run = 600 is the declared floor and bounds the
    script's execution, which is not a run, produces no run record, and is
    not evidence; maximum_runs is 0.
  inputs:
    cost_model: 'IDEA-20260903-dcf857 claim (A): C(k) = 2^k Ncols(n - k, D(k))^omega, Ncols(n'', D) = sum_{i <= D} binom(n'', i); assembly T = 2 (m! 2^m C N)^{2/(m+1)}, memory B = 2^s; yield forced by KN-FIND-007'
    null_slice: 'D(k) = ceil(((n - k) + 2m)/2) (IDEA-20260830-84cdb7''s formula at d = 2 with n - k variables)'
    bounded_slice: 'D(k) = min(D_0, d_reg(k)) under HEUR-001; interior band under HEUR-002 only, with k_c = n - 2(D_0 - m)'
    parameter_grid: 'm in {3, 4, 5}; D_0 in {4, 6, 8}; omega in {2, 2.807}; log2 N in {64, 128, 256}'
    hand_values_to_reproduce: >-
      From IDEA-20260903-dcf857 (D), to within 1 in log2: at 256 bits
      m = 5, D_0 = 4, omega 2: T = 2^108.7, memory 2^53.8; m = 5, D_0 = 6,
      omega 2: 2^116.6; m = 5, D_0 = 8, omega 2: 2^124.1; m = 5, D_0 = 6,
      omega 2.807: 2^127.9; m = 4, D_0 = 4, omega 2: 2^128.6; m = 4, D_0 =
      8, omega 2: 2^146.8; at 128 bits m = 5, D_0 = 4, omega 2: 2^64.0; at
      64 bits m = 5, D_0 = 4, omega 2: 2^40.9; rho at 0.886 x 2^{(log2 N)/2}.
    fixtures: 'null slice = da1428 (full guessing, N^1) in the digit presentation; direct presentation B^{2 omega - 1} ratio; C = 1 and C = B^{m-1} balance limits'
    runs: 0
    curve_generation: none
  controls:
    - id: CTRL-NULL-SLICE-DA1428
      row_class: fixture
      blocking: true
      object: 'D(k) = d_reg(k) at (m, s) in {(3, 6), (4, 8), (5, 8)}, both omega'
      forced_disposition: >-
        C(k) strictly decreasing in k up to the enumerative leaf; argmin at
        the leaf; assembled total N^1. Any interior minimum is a bug and
        voids the table.
    - id: CTRL-DIRECT-PRESENTATION-RATIO
      row_class: fixture
      blocking: true
      object: 'the direct presentation with membership degree B under the same machinery'
      forced_disposition: >-
        Reproduces da1428's k = m - 2 to k = m - 1 ratio Theta(B^{2 omega -
        1}); the flip must NOT occur there (the nearby object where the
        conclusion is known false).
    - id: CTRL-BALANCE-LIMITS
      row_class: fixture
      blocking: true
      object: 'C = 1 and C = B^{m-1} in the balance'
      forced_disposition: >-
        C = 1 reproduces 84cdb7's N^{2/(m+1)}; C = B^{m-1} (enumerative
        oracle) reproduces N^1.
    - id: CTRL-SMALL-N-LOSES
      row_class: arithmetic_tell
      blocking: true
      object: 'every bounded-slice cell at log2 N = 64'
      forced_disposition: >-
        Loses to rho by at least 2^9 (the polynomial overhead is largest
        relative to N at small N); a cell beating rho at 64 bits is an
        arithmetic error.
    - id: CTRL-BOTH-OMEGA
      row_class: honesty
      blocking: true
      object: 'every table cell'
      forced_disposition: >-
        Emitted at omega = 2 AND omega = 2.807; no single-omega number
        appears anywhere in the artifacts.
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: 'Pollard rho, (1/2, 0), 0.886 sqrt(N), O(1) memory'
      forced_disposition: >-
        The prior column of every cell. Unconditionally no domination is
        claimed on any axis; conditionally on HEUR-001, non-domination on
        time at the listed m = 5 cells is stated WITH the memory column
        (2^54 to 2^58 against O(1)) and is worthless until EXP-PFDR-cbdefb
        reports.
    - id: CTRL-CONFOUNDERS-NAMED
      row_class: honesty
      blocking: false
      object: >-
        (i) bounded last fall versus bounded solve: the table assumes the
        degree-D_0 Macaulay matrix solves (Huang-Kosters-Yeo's relation is
        recalled, not retrieved) and says so in every cell. (ii) omega. (iii)
        rounding of s. (iv) arity m = 5 needs S_6 whose construction is
        charged nowhere; the S_4 instrument defect (KN-OPEN-5b3a08) makes
        any measurement feeding the table suspect, though the table itself
        is arithmetic. (v) the CRT / complete-splitting artifact of
        IDEA-20260830-cb8e46 and the output-degree proxy of
        IDEA-20260807-899c5e do not enter an arithmetic table; they are
        named so that no D_0 read from a Groebner output degree or from a
        unit-ideal toy cell is ever fed into it -- D_0 must come from
        EXP-PFDR-cbdefb's closure on planted targets.
      forced_disposition: >-
        Named in the artifact and in every quotation of a cell.
  independent_variables:
    - 'm in {3, 4, 5}; D_0 in {4, 6, 8}; omega in {2, 2.807}; log2 N in {64, 128, 256}; k in 0..n - s'
  metrics:
    primary:
      - 'C(k) curves per (m, s, D_0, omega) under both slices, with argmin'
      - 'table cells (T, memory, prior rho) per standardized set with (D_0, omega) tags'
      - 'D_0 thresholds per (m, omega) at each N'
      - 'interior-band cells under HEUR-002 only'
      - 'fixture pass or fail for the three fixtures and the small-N tell'
    secondary:
      - 'signed discrepancy per cell between the script and the hand values of IDEA-20260903-dcf857 (D)'
      - 'the filled concrete_cost block with optimistic_assumptions, overestimating_factors, parallelism, time_memory_tradeoff, affected_scope, safe_scope'
      - 'dominated_by and sota_delta restated: unconditionally +0 on every axis; conditional deltas tagged'
  heuristic_under_test: 'none is validated here; HEUR-001 of H-PFDR-06fd60 is PRICED (its validation experiment is EXP-PFDR-cbdefb), HEUR-002 enters only the interior-band cells, HEUR-003 is quoted as forced'
  preregistered_prediction:
    quantity: >-
      The argmin structure under each slice, the table cells, and the D_0
      thresholds at 256 bits.
    formula: >-
      Null slice: argmin at the enumerative leaf with C strictly decreasing,
      both omega. Bounded slice: k* = 0 with C increasing in k until n - k
      falls below 3.41 D_0 (omega 2) or 4.57 D_0 (omega 2.807). Table cells
      within 1 in log2 of the hand values listed under inputs. D_0
      thresholds at 256 bits: m = 5, omega 2: between 8 and 10; m = 5,
      omega 2.807: between 4 and 6; m = 4, omega 2: below 4. Interior band:
      cost 2^{k_c} binom(2(D_0 - m), D_0)^omega, exponential in n.
    source: >-
      IDEA-20260903-dcf857 claims (B)-(D) and its P1-P5; IDEA-20260808-
      da1428 for the null-slice verdict; IDEA-20260830-84cdb7 for the
      balance. Fixed on 2026-09-03 before the script is written; a
      disagreement above 1 in log2 is reported as such and corrected by a
      superseding record, never by editing this prediction.
  scale_relevance:
    tier: toy
    justification: >-
      Descriptive label for the only computation performed (exact integer
      arithmetic on binomial coefficients); no curve at any scale is
      examined. The 64/128/256-bit rows are ESTIMATES at standardized sizes
      under HEUR-001, labelled estimate and never measured; no tested scale
      exists and no transfer argument is needed because every statement is
      conditional arithmetic.
    correspondence: 'none; no sampling occurs'
  tail_checks:
    - >-
      The cell with the largest script-versus-hand discrepancy, reported
      with its (m, D_0, omega, N).
    - >-
      The D_0 at which each (m, omega) row crosses rho at 256 bits, bracketed
      to the nearest even value.
  replication:
    seeds: []
    independent_instances: 0
    reason: >-
      Zero runs and no sampling: nothing to seed or replicate. The
      replication analogue for a derivation is a blind re-derivation of
      one table cell in the later review round, which is a separate handoff
      and is not performed inside this contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 0
    maximum_workers: 1
    notes: >-
      maximum_runs 0: no run occurs. wall_clock_seconds_per_run 600 is the
      template floor and bounds the derivation-aid script's execution,
      which is not a run and not evidence. total_cpu_hours 0.5 is machine
      compute for that script, not the executor's session time, which is
      budgeted in the handoff.
  stages:
    - id: stage-0-script-and-fixtures
      purpose: 'C(k) curves, table, thresholds, interior band, three fixtures, small-N tell'
      dominant_operation: exact integer arithmetic (derivation aid)
      machine_compute: seconds
    - id: stage-1-concrete-cost-block
      purpose: 'the filled concrete_cost record with flagged assumptions and scope'
      dominant_operation: writing
      machine_compute: none required
  stopping_rules:
    - >-
      Stop immediately if the null slice shows an interior optimum or the
      direct-presentation fixture fails; record the failure as the result;
      do not repair the model to fit.
    - >-
      Stop if any bounded-slice cell beats rho at 64 bits; record the
      arithmetic error as the result.
    - >-
      Stop if the derivation would require a curve, a solver, a Macaulay
      matrix or a run; report the point at which it was needed.
    - >-
      Stop when both stages are written and the execution report is
      complete; no tuning.
  invalidation_rules:
    - >-
      Any run record, manifest.yaml, curve parameters, sampled points, or
      solver code appearing in the package INVALIDATES the package as a
      breach of the zero-run contract; the derivation-aid script is the one
      permitted code artifact.
    - >-
      Any cell quoted without its (D_0, omega) tags and the qualifier
      'assuming HEUR-001' INVALIDATES the artifact making the quotation.
    - >-
      Any claim of an unconditional cost, a break, a sub-rho algorithm, or
      any status change is outside the claim ceiling and INVALIDATES the
      artifact making it.
    - >-
      A single-omega table INVALIDATES the table.
    - >-
      A recalled source (Bettale-Faugere-Perret; Huang-Kosters-Yeo's solve
      relation) presented as a checked source INVALIDATES the artifact; they
      are pointers only.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the three fixtures pass
    (null slice = da1428 with full guessing and N^1; direct-presentation
    ratio; balance limits); (2) every bounded-slice cell at 64 bits loses to
    rho by at least 2^9; (3) every table cell is within 1 in log2 of the
    hand values, at both omega, with (D_0, omega) tags; (4) the D_0
    thresholds per (m, omega) at 256 bits are emitted and bracket the
    predicted ranges; (5) the concrete_cost block is filled with every
    optimistic assumption flagged and the affected-vs-safe scope stated.
    THIS SUCCESS IS DESIGN INTEGRITY AND PRICING ONLY: it validates no
    heuristic, supplies no ECDLP evidence, and changes no status. A package
    meeting (1), (2), (4), (5) but failing (3) by more than 1 in log2 is a
    valid NEGATIVE derivation result (the hand table is superseded by the
    script's), not an infrastructure failure.
  falsification_criterion: >-
    ANY of: F1 -- the null slice shows an interior optimum (the marginal-
    cost inequality is misapplied; H-PFDR-06fd60 is superseded); F2 -- the
    direct-presentation fixture does not reproduce da1428 (same); F3 -- a
    bounded-slice cell beats rho at 64 bits (arithmetic error; the table is
    void until repaired by a new version). F4 and F5 of H-PFDR-06fd60 (the
    outcomes of EXP-PFDR-cbdefb) are recorded by THAT contract, not here.
  artifact_package_directory: experiments/EXP-PFDR-c04716/runs/STATIC-001/
  artifact_package_note: >-
    STATIC-001 is a ZERO-RUN PACKAGE DIRECTORY, not a run. It carries NO
    manifest.yaml, no seeds, no timings as evidence, and no certificate of
    any kind other than the explicit statement 'certificate kind: none, no
    run occurred' inside the execution report. The derivation-aid script and
    its emitted tables are written artifacts with per-file sha256 recorded
    in the execution report.
  required_artifacts:
    - 'experiments/EXP-PFDR-c04716/runs/STATIC-001/cost_table.py (the derivation-aid script: exact integer binomials, both omega, balance solver; deterministic; no dependencies beyond the standard library)'
    - 'experiments/EXP-PFDR-c04716/runs/STATIC-001/ck-curves.yaml (C(k) per (m, s, D_0, omega) under both slices, with argmin)'
    - 'experiments/EXP-PFDR-c04716/runs/STATIC-001/cost-table.yaml (every cell with T, memory, prior, (D_0, omega) tags, and the signed discrepancy against the hand values)'
    - 'experiments/EXP-PFDR-c04716/runs/STATIC-001/thresholds.yaml (D_0 thresholds per (m, omega) per N; interior-band cells)'
    - 'experiments/EXP-PFDR-c04716/runs/STATIC-001/fixtures.yaml (the three fixtures and the small-N tell, pass or fail with the emitted numbers)'
    - 'experiments/EXP-PFDR-c04716/runs/STATIC-001/concrete-cost.yaml (the concrete_cost block per templates/research-records.md, status draft, bound_kind heuristic_estimate)'
    - 'experiments/EXP-PFDR-c04716/runs/STATIC-001/execution-report.md (stage-by-stage report; success-criterion checklist (1)-(5) with outcome; falsification outcomes; the statement that zero runs occurred, no curve was sampled and the only code is the derivation aid; per-file sha256; inference block: requested policy, resolved model, fallback_used)'
  interpretation_limits:
    - >-
      CONDITIONAL THROUGHOUT on HEUR-001 of H-PFDR-06fd60, whose honest
      prior is 0.05 and whose validation is EXP-PFDR-cbdefb; the table's
      most likely use is to show that a moderate D_0 would still not
      threaten 256-bit curves.
    - >-
      No memory-matched cell is favourable; nothing about m = 3, 128 bits or
      below, or omega = 2.807 with D_0 >= 6 is affected under any reading.
    - >-
      A static PASS changes no hypothesis, experiment, question or goal
      status and does not satisfy the promotion gates of
      agents/coordinator.md, which require validated heuristics and
      independent review.
  id_allocation_provenance: >-
    EXP-PFDR-c04716 pre-allocated by the tasking Coordinator in
    TASK-20260903-b5d2ae (sixth experiment id, in order). No state was
    scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before this contract is relied on.
