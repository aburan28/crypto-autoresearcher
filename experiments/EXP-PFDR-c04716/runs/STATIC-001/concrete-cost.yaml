  optimistic_assumptions: ["[UNDER-estimates cost] HEUR-001: last fall degree bounded by D_0 uniformly in s, p, curve and target (unmeasured; EXP-PFDR-cbdefb measures it; the honest prior is 0.05 against it per H-PFDR-06fd60)", "[UNDER-estimates cost] bounded last fall implies bounded SOLVE: the degree-D_0 Macaulay matrix is assumed to determine the solutions (Huang-Kosters-Yeo relation RECALLED, pointer only, not opened)", "[UNDER-estimates cost] omega = 2 in the omega-2 column is not achievable for structured sparse Macaulay matrices; the omega = 2.807 column is the conservative one and is emitted for every cell", "[UNDER-estimates cost] yield at the KN-FIND-007 forced mean B^m/(m! N) with 2^m filtering (HEUR-003); no accidental-decomposition or coverage losses beyond that", "[UNDER-estimates cost] sparse linear algebra at B^2 with unit constant", "[UNDER-estimates cost] no cost charged for recognising digit solutions, for certificate checks, for building the Macaulay matrix, or for constructing the summation polynomial S_{m+1} (S_6 at m = 5 is charged nowhere; KN-OPEN-5b3a08 instrument defect at S_4 noted)", "[UNDER-estimates cost] balance solved with s real-valued and n = round(m s); rounding s to an integer costs up to a factor 2 in B (up to +2 in log2 T); the per-cell sensitivity to n +/- 1 is recorded in cost-table.yaml", "[UNDER-estimates cost] the k* = 0 point is used for every cell; the C(k) curve at the balanced s is emitted in ck-curves.yaml so a reader can check no k gives a lower C(0)-charged balance under the same model"]
  overestimating_factors: ["[OVER-estimates cost] Ncols counted as the full sum of binomials up to D_0 and the solve charged Ncols^omega; a sparse XL/Wiedemann charge nnz x Ncols would be lower than Ncols^2", "[OVER-estimates cost] filtering 2^m charged in full although the y^2 = f(x) variant of 84cdb7 removes it at the price of m extra variables"]
  hidden_overhead_disclosure: "the o(1) of N^{2/(m+1)+o(1)} is the factor 2 (m! 2^m Ncols(ms, D_0)^omega)^{2/(m+1)} in T; log2 of the per-target oracle cost 2^m Ncols(n, D_0)^omega at 256 bits is given per cell as log2_C0_with_2m_filter in cost-table.yaml"
  parallelism: "Relation collection is embarrassingly parallel over targets (time T/P with P processors, memory unchanged); the B^2 sparse linear algebra is the serial bottleneck and parallelises only with block-Wiedemann at communication cost. Pollard rho parallelises linearly with van Oorschot-Wiener distinguished points at O(1) memory per processor."
  time_memory_tradeoff: "Arity m is the only knob: larger m lowers the exponent 2/(m+1) and raises both the per-target polynomial 2^m Ncols(ms, D_0)^omega and the memory 2^s = N^{1/(m+1)} x constants. No van Oorschot-Wiener style interpolation down to rho's O(1) memory exists for this family; the memory floor is the factor base, 2^s as tabulated per cell. Full-guessing (the null-slice optimum) has memory O(B) and time N^1 and is the low-memory endpoint of the hybrid family."
