# =============================================================================
# EXP-CSIDH-f3c102 — version 1, designed and approved 2026-10-09 by
# DEC-20261009-e8da8b under the standing user authorization, in design
# session design-session-20261009 (worktree at origin/main tip
# 2487cdb0e1) from IDEA-20261006-3cc090. Success is the idea's
# prediction: on the frozen cell (p = 83, N = 30), the interval-gated
# nearest integer r to the 30-term truncation of L(1, chi) equals the
# two-enumeration-certified form count h. The concrete negative is a
# scored r different from h. What the designing sessions observed before
# freezing: the turn-1 machinery validation listed the three reduced
# forms of discriminant -83 in a classical group-table check, so h was
# known; the scored quantity r and the comparison |r - h| were never
# computed at (83, 30), and the launcher's validation runs used the
# discriminants -59, -107, -84 and -23 only for the machinery checks.
# The prediction r = h is the source idea's own, filed before either
# session. Two design-time corrections are recorded here and in the
# decision: the source idea's non-fundamental control names -84, which
# is fundamental, so the frozen control uses -332 (see
# inputs.nonfundamental_control); and r is the integer nearest to every
# point of the interval (the idea's wording), not an integer contained
# in it — the contained reading was caught and corrected when the
# self-test's gate check failed on between-integer intervals. No
# discrete logarithm is authorized.
# =============================================================================
experiment:
  id: EXP-CSIDH-f3c102
  hypothesis_id: H-CSIDH-f83e20
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  source_idea: IDEA-20261006-3cc090
  version: 1
  designed_at: '2026-10-09'
  title: >-
    Interval-gated nearest integer to the 30-term truncation of L(1, chi)
    against the two-enumeration-certified form count at discriminant -83
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-09'
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261009-e8da8b
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null and
      the trial plan names a driver and a checker whose machinery the
      designing session validated at other discriminants. Approval does
      not assert that r equals h, does not assert that it differs, and
      does not assert any class-number formula or security level.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Enumerate the reduced forms of discriminant -83 by both frozen
      algorithms and score h only on agreement; compute the exact
      rational L30 at chi(n) = (-83/n); enclose S = (sqrt(83)/pi)*L30
      in the frozen rational interval; apply the interval gates; name
      exactly one reading row. Do not add terms to the truncation, do
      not add a discriminant, and do not retighten the pi bounds after
      seeing any value. Do not search for a discrete logarithm and do
      not run a quantum circuit.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the 30-term truncation L30 of the Dirichlet L-series
    at the Kronecker character chi(n) = (-83/n), scaled by sqrt(83)/pi
    and enclosed in a rational interval of length strictly less than 1/2,
    already names the form count h at discriminant -83. The primary
    metric is |r - h|, scored only when both form enumerations agree, the
    instrument checks pass, and the interval gates pass. The concrete
    negative is a scored r different from h. No faster hidden-shift
    algorithm is in scope.

  what_this_is_not:
    - >-
      Not a proof of the Dirichlet class-number formula.
    - >-
      Not a CSIDH-512 class number and not a security level for any
      CSIDH parameter set.
    - >-
      Not an invariant-factor count: the order is scored and the factors
      are ignored.
    - >-
      Not approval of the hypothesis: a later Coordinator decision
      approves execution of this contract only; it asserts nothing about
      r or h.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      The scored integer r, the agreed form count h, the rational L30,
      the rational interval for S, and the control bits at discriminant
      -83 with truncation length 30 under the frozen enclosure. Nothing
      about any other discriminant or truncation length follows, no
      class-number formula is proved, and no CSIDH security level
      follows.

  inputs:
    discriminant: >-
      D = -83 is fundamental (83 is prime and 83 is congruent to 3
      modulo 4, so -83 is congruent to 1 modulo 4 and squarefree). The
      order is Z[(1+sqrt(-83))/2]. The class number h(-83) is the count
      of reduced positive-definite binary quadratic forms of discriminant
      -83; the run re-derives it and this record does not assert its
      value.
    weight: >-
      The Dirichlet class-number formula weight at this discriminant is
      w = 2 (D < -4), so the factor in front of L(1, chi) is
      sqrt(p)/pi with p = 83. If a later primary read shows a different
      weight, the row is instrument_failure, not a mismatch.
    character_and_truncation: >-
      chi(n) = (-83/n), the Kronecker symbol. chi(1) = 1 is a control:
      the launcher asserts the character value at 1. L30 is the sum of
      chi(n)/n for n from 1 to 30, computed as an exact rational
      (fractions.Fraction is always reduced; the launcher records the
      denominator of the reduced fraction). The truncation length is
      fixed at 30.
    scaled_sum: >-
      S = (sqrt(83)/pi) * L30, where pi is the circle constant, not a
      Frobenius endomorphism.
    sqrt83_bounds: >-
      Rational bounds on sqrt(83) computed in-launcher by integer square
      root at 10^6 decimal places, as exact rationals.
    pi_bounds: >-
      The classical continued-fraction convergent bounds
      333/106 < pi < 355/113, hard-coded with that provenance comment.
    interval_scoring: >-
      S is enclosed in a rational interval [lo, hi] built from the L30
      rational and the two rational bound pairs. If the interval has
      length strictly less than 1/2, contains at most one integer
      (defensive; the length gate already forces this), and meets no
      half-integer, then r is the unique integer nearest to every point
      of the interval, the integer k with k - 1/2 < lo and hi < k + 1/2
      (the idea's wording: r is not required to lie inside the interval,
      only to be the common nearest integer of all its points); otherwise
      no r is scored and the row is instrument_failure.
    enumeration_E1: >-
      The direct reduced-form listing: all (a, b, c) with
      b^2 - 4ac = -83 under the reduced convention -a < b <= a <= c
      with b >= 0 when |b| = a or a = c, enumerated by the standard
      bounds a <= sqrt(|D|/3).
    enumeration_E2: >-
      The orbit enumeration: every primitive positive-definite form
      (a, b, c) of discriminant -83 with 0 < a <= A_MAX and
      0 <= b <= a and 0 < c <= C_MAX for the frozen box bounds
      A_MAX = 40 and C_MAX = 400, reduced by the Gauss reduction
      algorithm, deduplicated, and counted. Every equivalence class of
      reduced forms at this discriminant appears in this box: a reduced
      form has a <= sqrt(83/3) < 6 and c = (b^2+83)/(4a) <=
      (25+83)/4 = 27 < 400, and the box also covers every form equivalent
      to a reduced one with a <= 40 by the reduction step's contraction
      of a.
    two_enumeration_certificate: >-
      h is scored only when E1 and E2 return the same set. A
      disagreement leaves h unscored and the row is instrument_failure.
    nonfundamental_control: >-
      Corrected from the source idea. The source idea's control names
      discriminant -84, but -84 = 4*(-21) with -21 congruent to 3
      modulo 4 squarefree IS a fundamental discriminant, so treating -84
      as non-fundamental is mathematically unsatisfiable and the control
      as written cannot pass with a correct instrument. The frozen
      control instead uses -332 = 4*(-83), the conductor-2 non-maximal
      order of the SAME field Q(sqrt(-83)) (fundamental disc -83; -332
      is non-fundamental because -83 is congruent to 1 modulo 4). The
      launcher's fundamental-discriminant check (D congruent to 1
      modulo 4 squarefree, or D = 4m with m congruent to 2 or 3 modulo 4
      squarefree) must label -83 fundamental and -332 non-fundamental,
      and the -332 control run must be refused or labeled before any
      count is scored. The proposal's bytes are NOT edited; the
      deviation is recorded here and will be recorded in the approval
      decision.
    minus84_self_check: >-
      The launcher asserts -84 IS fundamental (the mathematical fact
      that motivated the correction) as a self-check of the
      discriminator.

  controls:
    - id: character-at-one
      statement: >-
        chi(1) = 1 and the partial sum L30 is a reduced rational whose
        denominator is recorded. A non-reduced comparison voids the run.
    - id: two-enumeration-certificate
      statement: >-
        E1 and E2 agree before h is scored. A disagreed h used in the
        score voids the run.
    - id: nonfundamental-refusal
      statement: >-
        -332 is labeled non-fundamental or refused, -83 is labeled
        fundamental, and -84 is asserted fundamental. The -332 control
        silently treated as fundamental voids the run.
    - id: interval-gate
      statement: >-
        The interval length is strictly below 1/2 and the interval
        meets no half-integer before r is scored; r is the unique
        integer nearest to every point of the interval (k - 1/2 < lo
        and hi < k + 1/2), not necessarily an integer contained in it.
        This is the idea's tail check: the interval length is the
        enclosure quality, and it gates the scoring.

  independent_variables:
    - enumeration method in {E1 direct reduced-form listing, E2 orbit enumeration}
    - truncation length, fixed at 30 and not varied

  metrics:
    primary:
      - id: abs_diff
        statement: >-
          The absolute difference |r - h|, an integer 0 or at least 1,
          scored only when r is scored.
    secondary:
      - id: form_count_h
        statement: h from the agreed enumeration
      - id: agreement_bit
        statement: the two enumeration sets' agreement bit
      - id: L30_rational
        statement: the rational L30 as numerator/denominator
      - id: chi_values
        statement: the chi values for n = 1..30
      - id: interval_bounds
        statement: the rational interval [lo, hi] for S
      - id: interval_length
        statement: the interval length hi - lo as a rational
      - id: nearest_integer_r
        statement: r, or null when no r is scored

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says the tail of L(1, chi) after 30 terms, multiplied by
    sqrt(83)/pi, has absolute value strictly below 1/2, so the nearest
    integer to the truncation equals the class number. The row mismatch
    is the negative for the claim on this cell. It is not a refutation
    of the infinite sum and not a theorem about any other discriminant
    or truncation length. Do not relabel an instrument failure as a
    mismatch.

  preregistered_prediction:
    quantity: >-
      The integer |r - h| on the frozen cell: discriminant -83,
      truncation length 30, scored only when both enumerations agree, the
      instrument checks pass, and the interval gates pass.
    formula: >-
      |r - h| = 0. The concrete negative is a scored r different from h.
      Source idea IDEA-20261006-3cc090, frozen before any form was
      enumerated or any term summed in this session: the designing
      session verified the mathematical setup by hand and did not execute
      the enumerations or the truncation.
    source: >-
      IDEA-20261006-3cc090, heuristic H1. The infinite-sum identity
      (Dirichlet class-number formula, w = 2 at D < -4) is recalled,
      not opened as a primary text; no theorem bounds the 30-term tail
      for this character. KN-LIT-508, opened when the idea was filed,
      counts class-number indivisibility and does not predict this
      integer.

  scale_relevance:
    tier: toy
    justification: >-
      One discriminant below 200, one truncation length, two
      enumerations, one interval: a complete cell, not a sample. No
      transfer to CSIDH-512 or to any cryptographic class group is
      assumed. The minimum effect is the idea's own: |r - h| = 0.
    correspondence: >-
      Direct enumeration of reduced forms and exact rational arithmetic.
      No Deuring correspondence is used.

  replication:
    seeds:
      - EXP-CSIDH-f3c102|enumeration-E1|p-83|N-30
      - EXP-CSIDH-f3c102|enumeration-E2|p-83|N-30
    independent_instances: 1
    note: >-
      The computation is deterministic; no randomness enters. The seeds
      name the two enumerations and the frozen cell (p = 83, N = 30).
      Nothing is sampled.

  budget:
    enforcement: advisory
    maximum_runs: 1
    maximum_memory_mb: 512
    watchdog_seconds: 120
    watchdog_reason: >-
      Machine protection for two toy enumerations and exact rational
      arithmetic on one core; expiry is failed_infrastructure, not a
      form count.
    budget_note: >-
      Wall-clock and CPU figures are advisory with no cap, so none is
      set. The memory figure and the watchdog are machine protection, not
      a research budget. One trial: the single run id RUN-CSIDH-9d743d
      covers both enumerations, the 30-term sum, the interval, the
      controls, and exactly one reading row.

  stopping_rules:
    - >-
      One run id, RUN-CSIDH-9d743d, covers both enumerations, the
      30-term sum, the interval, the controls, and exactly one reading
      row. No second run id is opened.
    - Do not add terms to the truncation after seeing h.
    - Do not add a discriminant after seeing h or r.
    - Do not retighten the pi bounds after seeing the interval.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - >-
      A timeout, crash, or memory abort is failed_infrastructure, never
      a mathematical negative.
    - A disagreed h used in the score voids the run.
    - The -332 control silently treated as fundamental voids the run.
    - Scoring r from an interval of length at least 1/2 voids the run.

  success_criterion: >-
    The run finishes, the instrument checks pass, r is scored, and
    r = h. This is the prediction of IDEA-20261006-3cc090. It is
    reachable as a failure when the same conditions hold and r is
    different from h.

  falsification_criterion: >-
    The instrument checks pass, r is scored, and r is different from h.
    That scored difference is the concrete negative named with the source
    idea. A disagreed enumeration, a silent -332 agreement, an interval
    of length at least 1/2, and a timeout are instrument rows, not this
    negative.

  decision_impact:
    on_positive: >-
      A later evidence review may record that the 30-term truncation of
      L(1, chi) at discriminant -83, under the frozen rational
      enclosure, already names the form count, giving the question's
      cost-model reconstruction a cheap certified-order check at one toy
      discriminant; no class-number formula is proved and no CSIDH-512
      class number is claimed.
    on_negative: >-
      A later evidence review may record that the same truncation rounds
      to a different integer, so 30 terms do not certify the order at
      this discriminant and the certified-order input must come from
      longer truncations or exact enumeration; the two outcomes name
      different integers and different readings.

  required_artifacts:
    - experiments/EXP-CSIDH-f3c102/runs/RUN-CSIDH-9d743d/manifest.yaml
    - experiments/EXP-CSIDH-f3c102/runs/RUN-CSIDH-9d743d/raw-result.json
    - experiments/EXP-CSIDH-f3c102/runs/RUN-CSIDH-9d743d/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the interval has length at least 1/2, meets a half-integer, or
        contains two integers; chi(1) is not 1; the two enumerations
        disagree and the disagreed h is used; the -332 control is
        silently treated as fundamental; or the -84 self-check fails
    - id: match
      when: >-
        the instrument checks pass, r is scored, and r = h — the
        prediction of IDEA-20261006-3cc090
    - id: mismatch
      when: >-
        the instrument checks pass, r is scored, and r is different from
        h — the concrete negative
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the order
    listed. match is the only success row. mismatch is the concrete
    negative. instrument_failure is not a value of |r - h|. Record h,
    the agreement bit, the rational L30, the chi values for n = 1..30,
    the rational interval [lo, hi], the interval length, r or null, and
    attack_claimed false beside the row. Those fields do not change the
    row.

  launcher:
    driver: experiments/EXP-CSIDH-f3c102/implementation/run.py
    checker: experiments/EXP-CSIDH-f3c102/implementation/check.py
    note: >-
      The driver and the checker are committed by the designing session
      before approval; a contract whose launcher is absent stays
      review_required. The launcher is bound by the trial plan's source
      hashes at run admission.
