experiment:
  id: EXP-NGCC-127846
  hypothesis_id: H-NGCC-ad4a16
  version: 1
  title: >-
    CEDRUS+C sign-03-1 count: distinct few-time signature addresses in the
    unmodified reference source
  status: review_required
  objective: >-
    Decide H-NGCC-ad4a16 by enumerating the official address expression on
    the specification's domain and counting distinct outputs.
  inputs:
    candidate_id: sign-03
    roster: inputs/ngcc-round1-20260920/candidates.yaml
    package_url: >-
      https://www.niccs.org.cn/niccs/Proposal/Public-Key%20Cryptographic%20Algorithms/Round%201%20candidates/cedrus%2Bc.zip
    literature_pointer: https://eprint.iacr.org/2026/2266
    finding_id: sign-03-1
    corpus_listing: KN-LIT-4775e4
    not_this_candidate: sign-04
  controls:
    - >-
      Specification domain first: the domain size is copied from the
      specification, with a page or algorithm reference, before the source
      expression is evaluated.
    - >-
      Unmodified expression: the scored map is the expression in the
      official source, copied with file and line. A re-parenthesized
      variant may be counted in a side column and is not the scored map.
    - >-
      Complete enumeration: every input in the recorded domain is evaluated
      once. A sample is not a count.
    - >-
      No forgery: the run does not sign or forge. A forgery transcript is
      not required and is not a substitute for the count.
  independent_variables:
    - parameter set name, as declared by the official package
  metrics:
    primary:
      - specification_domain_size
      - distinct_address_outputs
      - image_is_four
    secondary:
      - side_column_repaired_image_size
  heuristic_under_test: null
  preregistered_prediction:
    quantity: distinct_address_outputs
    formula: >-
      For every declared parameter set, specification_domain_size is greater
      than 4 and distinct_address_outputs equals 4.
    source: >-
      Saarinen, ePrint 2026/2266, finding sign-03-1, as indexed in
      inputs/ngcc-round1-20260920/paper_mentions.yaml. The prediction was
      written before any run of this experiment.
  scale_relevance:
    tier: crypto
    justification: >-
      The count is on the submitted parameter sets' address domains. It is
      exhaustive on that finite domain, not a reduced toy.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: null
  stopping_rules:
    - Stop after every declared parameter set has a count or is recorded as missing a stated domain.
    - A missing specification is infrastructure. It does not clear the set.
  invalidation_rules:
    - The domain is chosen by this program rather than copied from the specification or the finding.
    - The count uses a sample instead of the full domain.
    - The re-parenthesized expression is scored in place of the official expression.
    - A forgery is scored as the address count.
    - Submission binaries, object files, or submission build scripts are executed.
  success_criterion: >-
    Every declared parameter set has a complete count, each
    specification_domain_size is greater than 4, and each
    distinct_address_outputs equals 4 on the unmodified expression.
  falsification_criterion: >-
    Every declared parameter set has distinct_address_outputs equal to
    specification_domain_size, after a complete enumeration of the
    unmodified expression.
  required_artifacts:
    - package sha256 and the parameter-set list
    - per set: specification domain citation, source file and line of the expression, domain size, distinct-output count
    - the list of distinct outputs
    - run manifest with git commit and dirty-tree state
  assigned_to: executor
  approved_by: null
  approval_withheld_because: >-
    The design-experiment skill treats a contract as approved only after
    a snapshot archive commit. This checkout is on branch
    exec/aes-14352a-stage1, and git status in this worktree fails because
    a linked worktree gitdir is missing. Approval waits for a commit on
    an NGCC branch. The fields above are otherwise filled.
