experiment:
  id: EXP-PFDR-a2f447
  hypothesis_id: H-PFDR-6189d0
  question_id: RQ-EQIC-8cb959
  idea_id: IDEA-20260815-a5a19f
  batch_id: BATCH-2eaca1
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-b2a7e9
  batch_position: 2 of 4 (theory-gov; corpus measurement, no curve, no cryptographic computation)
  title: >-
    Quotient this program's concretely-specified prime-field ECDLP attack
    systems by a frozen decidable normal form, with the collapse rate
    calibrated against a MATCHED RANDOM-SYSTEM null containing no curve and
    no cryptographic content -- because a coarse descriptor collapses
    anything, so the corpus's excess collapse over that baseline is the
    only part of the number that is about the corpus
  status: draft
  approved_by: null
  approved_at: null
  status_note: >-
    Written and frozen at the /design-experiment stage; NOT submitted for
    approval and NOT authorized for implementation. 'draft' is the canonical
    first state of the experiment machine in AGENTS.md ("Research states"):
    draft -> review_required -> approved -> running -> completed |
    failed_infrastructure | invalid -> analyzed -> archived. The originating
    handoff TASK-20260904-b2a7e9 initially mandated 'designed', which is not
    in that machine; the designing coordinator flagged the conflict rather
    than silently choosing, and the handoff was corrected to 'draft'.
  assigned_to: executor
  implementation_authorized: false
  implementation_authorized_note: >-
    No implementation and no execution is authorized by this record.
    Execution begins only from a Coordinator approval decision plus a
    frozen contract at this path.
  claim_ceiling: >-
    corpus measurement only. No mathematical claim, no evidence about
    elliptic curves or the ECDLP, no hypothesis or goal status change, and
    NO deprioritisation, closure, or dismissal of any record on the
    strength of a class membership. The output is a count with its
    calibration, not a verdict on any proposal.
  claim_tier_basis: >-
    NOT_APPLICABLE per docs/claims-and-verification.md: no cryptographic
    claim of any tier is made, no solve is attempted, and no certificate
    kind arises. Any evidence record derived from this contract sets
    proof_status empirical_only about THE CORPUS and asserts nothing about
    mathematics.
  objective: >-
    Measure how many DISTINCT attack constructions this program's
    concretely-specified prime-field ECDLP proposals actually contain, and
    -- the part without which the first number is meaningless -- establish
    by a matched curve-free null whether the measured collapse is
    duplication in the corpus or resolution in the descriptor. The
    secondary and possibly binding output is how reproducibly a formal
    system can be extracted from a prose record at all; if it cannot, that
    is the result.
  inputs:
    population_query: >-
      Live (non-superseded) YAML records under ledger/proposals/ whose
      idea.question_id resolves to a research question whose scope declares
      field_types including 'prime' and whose curve_families mention
      elliptic curves, AND whose idea.class is not 'governance'. Executed
      ONCE, at a commit recorded in the manifest; the resulting record-id
      list is frozen as part of the run package before any descriptor is
      extracted.
    descriptor: >-
      NF(r) = (base, nvars, degseq, gbsig, oracles, symgrp) exactly as
      defined in H-PFDR-6189d0 claim (A). FROZEN by this contract.
    specialisation: >-
      Every free parameter in an extracted system is specialised at the
      single fixed declared choice: curve coefficients a = 5, b = 7 where a
      curve is named; field prime p = 65537 where a prime is free; arity
      and factor-base size at their smallest value consistent with the
      record's own text; any remaining free scalar at 3. Recorded per
      record so a reader can re-specialise.
    monomial_order: 'degrevlex, with variables ordered by first appearance in the record'
    calibration_sets:
      rename: >-
        >= 6 pairs constructed by the executor from single corpus records:
        each pair is one record's system and a re-presentation of it with
        variables renamed, generators reordered, generators rescaled by
        nonzero constants, and one generator replaced by an equivalent
        combination. Constructed BEFORE any corpus quotient is computed.
      distinct: >-
        >= 6 pairs of corpus records that a reader judges to propose
        genuinely different constructions, NAMED IN THE RUN PACKAGE BEFORE
        the quotient is computed, with a one-line reason each. Naming them
        after seeing the partition would make the control unfalsifiable.
      random: >-
        >= 200 synthetic polynomial systems drawn with the corpus's own
        marginals for (base, nvars, degseq, oracle-count) but with
        generators drawn at random over the specialised base, containing NO
        elliptic curve, NO summation polynomial, and NO cryptographic
        content of any kind. Seeded and fully reproducible.
    double_extraction_sample: '20 records drawn by a declared seeded sample from the frozen population'
  controls:
    - id: CTRL-SELF
      row_class: instrument
      blocking: true
      object: 'every record in the frozen population, compared with itself'
      forced_disposition: 'FORCED equivalent (reflexivity). A failure is a code defect and halts the run.'
    - id: CTRL-RENAME
      row_class: fineness_bound
      blocking: true
      object: 'the >= 6 pre-registered notational re-presentation pairs'
      forced_disposition: >-
        FORCED equivalent for every pair. A failure means the descriptor is
        too FINE: it distinguishes presentations of one system and would
        find no duplication whatever the corpus contains. The run halts and
        reports which component of NF separated the pair.
    - id: CTRL-DISTINCT
      row_class: coarseness_bound
      blocking: true
      object: 'the >= 6 pre-registered genuinely-different pairs, named before the quotient is computed'
      forced_disposition: >-
        FORCED inequivalent for every pair. A collapse means the descriptor
        is too COARSE and would understate the corpus's real breadth. The
        run halts and names the collapsing pair.
    - id: CTRL-RANDOM-SYSTEM
      row_class: null_object
      blocking: true
      object: '>= 200 matched random systems: same marginals, no curve, no cryptographic content'
      forced_disposition: >-
        FORCED Q_rand/N_rand >= 0.9. THIS IS THE BLOCKING CURVE-FREE NULL
        AND THE LOAD-BEARING CONTROL OF THE CONTRACT. Any descriptor with
        fewer distinct values than the set has elements collapses that set,
        and the corpus's systems share a base field, a handful of degree
        sequences and a small oracle vocabulary, so the descriptor's range
        is small by construction. Matched random systems have the same
        marginals and NO SHARED ORIGIN, so they measure exactly the
        collapse the descriptor produces from marginals alone. Below 0.9,
        no corpus collapse number is reportable and the run's result is
        this null.
    - id: CTRL-EXTRACTION-AGREEMENT
      row_class: instrument
      blocking: true
      object: '20 seeded records, descriptor-extracted independently and blindly by two agents'
      forced_disposition: >-
        FORCED agreement >= 0.8 on the full descriptor over records both
        agents assigned confidence 'high'. Each agent declares what it
        read; neither may read the other's extraction or any earlier
        descriptor for the same record. Below 0.8 the descriptor is not
        reproducibly extractable, the quotient is uninterpretable, and the
        agreement rate is the run's only reported result.
    - id: CTRL-COVERAGE
      row_class: honesty
      blocking: false
      object: 'N_c, N_v, and the low-confidence count against |T|'
      forced_disposition: >-
        Reported always and beside every quotient number. Records that
        specify a direction rather than a system are COUNTED, never forced
        into the quotient and never imputed. Coverage below 0.25 means the
        quotient cannot describe the corpus and the coverage number becomes
        the deliverable.
    - id: CTRL-PREFILTER-SUBORDINATE
      row_class: instrument
      blocking: false
      object: 'the syzygy fingerprint pre-filter of IDEA-20260813-f2a6e7, where a fingerprint exists'
      forced_disposition: >-
        Used ONLY as a cheap necessary condition to raise candidate
        collisions. Every candidate it raises is decided by the full
        descriptor, and the pre-filter never decides an equivalence by
        itself. The executor must OPEN IDEA-20260813-f2a6e7 before using
        it: this contract cites it from a novelty screen and no agent in
        this task read the record itself. Its per-record agreement with
        the full descriptor is reported as a secondary metric.
    - id: CTRL-DESCRIPTOR-DEFECTS
      row_class: honesty
      blocking: false
      object: 'every equivalence class of size >= 3'
      forced_disposition: >-
        Read individually by a reviewer against the H4 hazard. A class the
        reviewer judges to have merged genuinely different research content
        is recorded as a DESCRIPTOR DEFECT with the merged pair named. A
        defect does NOT repair the descriptor and does NOT adjust Q; it
        bounds how far Q/N_c may be read and the bound is reported beside
        it.
    - id: CTRL-DETERMINISM
      row_class: instrument
      blocking: true
      object: 'the full pipeline re-run from the frozen record list and seeds'
      forced_disposition: 'FORCED byte-identical descriptor file, verified by sha256.'
  independent_variables:
    - 'input population in {CORPUS, RANDOM-MATCHED, RENAME-PAIRS, DISTINCT-PAIRS}'
    - 'extraction confidence in {high, low, none} (a reported stratum, not a treatment)'
  metrics:
    primary:
      - '|T|: size of the frozen population. UNITS: records (integer count).'
      - 'N_c: records with a HIGH-confidence extracted descriptor. UNITS: records.'
      - 'N_v: records specifying a direction rather than a system. UNITS: records.'
      - 'Q: number of NF-equivalence classes on the N_c. UNITS: classes (integer count).'
      - 'Q/N_c: the corpus collapse ratio. UNITS: dimensionless in (0, 1].'
      - 'Q_rand/N_rand: the matched random-system collapse ratio. UNITS: dimensionless. THE CALIBRATION.'
      - '(Q_rand/N_rand) - (Q/N_c): the excess collapse attributable to the corpus rather than to the descriptor. UNITS: dimensionless. THE ONLY NUMBER THAT IS ABOUT THE CORPUS.'
      - 'inter-extractor agreement on the blind sample. UNITS: dimensionless fraction in [0, 1].'
      - 'coverage N_c/|T|. UNITS: dimensionless fraction.'
    secondary:
      - 'the full class partition, every class of size >= 2 listed member by member'
      - 'the per-record descriptor NF, with its extraction confidence and its specialisation'
      - 'per-component collapse: Q computed with each of the six NF components dropped, showing which component carries the discrimination'
      - 'descriptor-defect count with the merged pairs named'
      - 'pre-filter agreement with the full descriptor, per candidate collision'
      - 'per-record Groebner wall clock, and the list of records that exceeded the per-record budget'
      - 'the keyword-screen comparison on the RENAME pairs: which pairs a term-based novelty screen would MISS and the descriptor finds'
  heuristic_under_test: >-
    HEUR-001 (descriptor separation) and HEUR-002 (extraction
    reproducibility) of H-PFDR-6189d0. Both are validated here and nowhere
    else.
  preregistered_prediction:
    quantity: >-
      The four calibration outcomes, the extraction agreement, the coverage,
      and the pair (Q/N_c, Q_rand/N_rand).
    formula: >-
      CTRL-SELF equivalent for all; CTRL-RENAME equivalent for all >= 6
      pairs; CTRL-DISTINCT inequivalent for all >= 6 pairs;
      Q_rand/N_rand >= 0.9; inter-extractor agreement >= 0.8;
      coverage N_c/|T| >= 0.25; Q/N_c <= 0.6 AND at least 0.3 below
      Q_rand/N_rand.
    source: >-
      H-PFDR-6189d0 claims H1-H4 and its predictions P1-P8, which restate
      IDEA-20260815-a5a19f's own predictions with the random-system null
      and the thresholds added. FIXED ON 2026-09-04, BEFORE THE POPULATION
      IS ENUMERATED AND BEFORE ANY DESCRIPTOR IS EXTRACTED. The thresholds
      0.9, 0.8, 0.25, 0.6 and 0.3 are part of the frozen contract and are
      never adjusted after an outcome is seen; a disagreement is reported
      and corrected by a superseding record, never by editing this
      prediction.
  scale_relevance:
    tier: null
    justification: >-
      The scale tier is not applicable and is explicitly null rather than
      absent: no cryptographic parameter is involved, no curve is sampled,
      and no computation of any tier is performed on mathematical content.
      The only 'scale' present is the corpus size at one commit, which is
      reported as |T| and is a property of the repository rather than of
      any cryptographic object. There is no transfer assumption to state
      because there is no cryptographic claim to transfer.
    correspondence: 'none; no sampling of any mathematical object occurs'
  tail_checks:
    - >-
      Every equivalence class of size >= 3, read individually against the
      HEUR-001 gap: two records may share a system while measuring
      different things on it, and such a class is a descriptor defect
      rather than a duplication. Counted, named, and reported beside Q.
    - >-
      The largest class: its size, its members, and a one-line statement of
      what construction they share. If the largest class alone accounts for
      most of the collapse, Q/N_c is driven by one construction and the
      report must say so rather than presenting a corpus-wide rate.
    - >-
      The records whose extraction was assigned 'low' or 'none': a sample
      of 10, read for whether the failure is vagueness in the record or a
      limitation of the extraction procedure. The two are different
      findings and the count of each is reported.
    - >-
      The random-system null's own largest class, checked for whether the
      matching of marginals accidentally produced near-identical systems --
      which would depress Q_rand and weaken the calibration in the
      conservative direction.
  replication:
    seeds:
      - 'SEED-RANDOM-SYSTEMS = 20260904011 (generation of the >= 200 matched random systems)'
      - 'SEED-DOUBLE-EXTRACTION = 20260904012 (the 20-record blind double-extraction sample)'
      - 'SEED-LOWCONF-SAMPLE = 20260904013 (the 10-record low-confidence tail sample)'
    independent_instances: 2
    reason: >-
      The two independent instances are the two blind extractors on the
      double-extraction sample; that is the only genuine replication
      available, because the corpus is a single fixed object and
      re-measuring it with the same procedure reproduces the same answer by
      construction. SEEDS POLICY: every seed is declared here before
      execution and recorded in the manifest. No seed may be chosen,
      changed or added after any outcome is observed. The population query
      is executed ONCE and its result frozen in the run package: re-running
      it later returns a different population, because the corpus grows in
      several worktrees at once, and re-running it after seeing the
      quotient would let the population be selected.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
    notes: >-
      A run is one stage of the pipeline (population freeze; calibration;
      extraction; double extraction; quotient; tail checks). No
      cryptographic computation occurs. The dominant machine cost is
      Groebner basis computation on small specialised systems, capped at 60
      seconds per record; a record exceeding it is assigned extraction
      confidence 'low' and excluded, which is a declared outcome and not a
      failure. wall_clock_seconds_per_run is 1800, above the template floor
      of 600. maximum_workers is 1 so that CTRL-DETERMINISM is meaningful.
  stages:
    - id: stage-0-freeze
      purpose: 'execute the population query once, record the commit, freeze the record-id list'
      blocking: true
    - id: stage-1-calibration
      purpose: 'SELF, RENAME, DISTINCT and RANDOM-SYSTEM controls, all before any corpus descriptor is extracted'
      blocking: true
    - id: stage-2-extraction
      purpose: 'per-record descriptor extraction with confidence, plus the blind double extraction'
      blocking: true
    - id: stage-3-quotient
      purpose: 'pre-filter, full descriptor decision, union-find, class partition'
    - id: stage-4-tail
      purpose: 'the four tail checks, the per-component ablation, the keyword-screen comparison'
  stopping_rules:
    - >-
      Stop before stage 2 if CTRL-SELF, CTRL-RENAME, CTRL-DISTINCT or
      CTRL-RANDOM-SYSTEM fails. Record which failed and why; produce no
      corpus quotient. A failed calibration is the result.
    - >-
      Stop after stage 2 if CTRL-EXTRACTION-AGREEMENT falls below 0.8.
      Report the agreement rate as the run's only result and produce no
      quotient number.
    - >-
      Stop after stage 3 if coverage falls below 0.25. Report the coverage
      and the count of records specifying no system; do not evaluate H2.
    - >-
      Stop when stage 4 is complete. The record list is frozen at stage 0
      and no record is added, dropped, or re-extracted because of what the
      partition showed.
    - >-
      A tool crash or Groebner timeout is INFRASTRUCTURE SIGNAL (AGENTS.md
      rule 5): the affected record is assigned extraction confidence 'low'
      and counted; it is never reported as evidence that two systems differ
      or agree.
  invalidation_rules:
    - >-
      Reporting Q/N_c without Q_rand/N_rand beside it INVALIDATES the
      report: an uncalibrated collapse ratio is a property of the
      descriptor and is uninterpretable.
    - >-
      Re-executing the population query after any descriptor has been
      extracted, or amending the frozen record list for any reason,
      INVALIDATES the run.
    - >-
      Naming a DISTINCT pair, or adding a RENAME pair, after the partition
      is known INVALIDATES that control.
    - >-
      Adjusting any threshold (0.9, 0.8, 0.25, 0.6, 0.3), the descriptor
      definition, the specialisation, or the monomial order after any
      outcome is observed INVALIDATES the run. Such a change is a new
      version of this contract, never an edit.
    - >-
      Describing any record as duplicative, redundant, or lower priority on
      the strength of its class membership INVALIDATES the artifact making
      the statement: NF-equivalence is coincidence of systems, not
      scientific redundancy, and H-PFDR-6189d0 claim (C) forbids the
      inference in advance.
    - >-
      Quoting any count without its commit, population query, descriptor
      version, specialisation and extraction procedure INVALIDATES the
      quotation.
    - >-
      Imputing a descriptor for a record whose extraction confidence is
      'low' or 'none' INVALIDATES the quotient.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) CTRL-SELF, CTRL-RENAME,
    CTRL-DISTINCT and CTRL-RANDOM-SYSTEM all pass, with the random null at
    Q_rand/N_rand >= 0.9; (2) inter-extractor agreement >= 0.8 is measured
    and reported; (3) |T|, N_c, N_v, the low-confidence count and coverage
    are reported; (4) Q, the full class partition with every class of size
    >= 2 listed member by member, Q/N_c, and the excess collapse over the
    random null are reported; (5) the four tail checks and the
    per-component ablation are complete, with descriptor defects named.
    SUCCESS IS MEASUREMENT INTEGRITY, NOT A PARTICULAR NUMBER: a run
    meeting (1)-(5) and finding Q/N_c > 0.6 -- the corpus's breadth is real
    -- is a FULL SUCCESS and is reported with the same prominence as the
    alternative. Nothing here validates a heuristic about mathematics,
    supplies ECDLP evidence, or changes any status.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 CALIBRATION FAILURE: CTRL-SELF, CTRL-RENAME or CTRL-DISTINCT fails.
    The descriptor is too fine or too coarse; the failing pair is named and
    no corpus number is produced.
    F2 NULL FAILURE, THE SCOPE-CONSTRAINT OUTCOME: Q_rand/N_rand < 0.9.
    Matched random systems with no curve and no cryptographic content
    collapse comparably, so the quotient measures the descriptor's
    resolution rather than the corpus's duplication. Recorded as a
    CONTROLLED NULL; the run explicitly supports NO claim about duplication
    in this program's ECDLP proposals.
    F3 EXTRACTION FAILURE: agreement < 0.8. The corpus does not state its
    systems reproducibly enough to be quotiented; this process finding
    supersedes every other output.
    F4 COVERAGE FAILURE: N_c/|T| < 0.25. The quotient covers too small a
    share to describe the corpus; the coverage number is the deliverable.
    F5 CLAIM REFUTED: Q/N_c > 0.6, or Q/N_c within 0.3 of Q_rand/N_rand.
    H2 of H-PFDR-6189d0 is refuted for this population at this commit; the
    corpus's nominal breadth is real under this descriptor.
    F6 CLAIM SUPPORTED: all calibration passes, coverage and agreement
    clear, and Q/N_c <= 0.6 with at least 0.3 of margin over the random
    null. The program has been screening materially fewer constructions
    than its record count suggests -- at this commit, under this
    descriptor, for this population, and for no other.
  required_artifacts:
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/manifest.yaml (full artifact policy: command, commit and dirty state, environment, all declared seeds, requested policy, resolved model, probe status, timings, validity status and reason)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/population.yaml (the exact query text, the commit it was executed at, and the frozen record-id list with a sha256 over it)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/calibration.yaml (SELF, RENAME, DISTINCT and RANDOM-SYSTEM outcomes; the pre-registered pairs with their reasons as written before the quotient; Q_rand, N_rand and the random systems themselves)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/descriptors.yaml (per record: NF, extraction confidence, specialisation used, Groebner wall clock)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/double-extraction.yaml (the two independent blind extractions on the 20-record sample, each declaring what it read, and the measured agreement)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/quotient.yaml (Q, N_c, N_v, |T|, coverage, Q/N_c, the excess over the random null, and the full class partition with every class of size >= 2 listed member by member)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/ablation.yaml (Q recomputed with each of the six NF components dropped, showing which component carries the discrimination)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/tail-checks.yaml (the four declared tail checks, the descriptor-defect list with merged pairs named, and the keyword-screen comparison on the RENAME pairs)'
    - 'experiments/EXP-PFDR-a2f447/runs/<RUN-ID>/execution-report.md (stage-by-stage; success-criterion checklist (1)-(5); which of F1-F6 fired; per-file sha256; the determinism re-run comparison; the inference block; an explicit statement that no curve was sampled, no ECDLP instance attempted, and no record deprioritised)'
  interpretation_limits:
    - >-
      This is a measurement of this repository's own records. It makes no
      mathematical claim, produces no evidence about elliptic curves or the
      ECDLP, and cannot support, weaken, or change the status of any
      hypothesis about them.
    - >-
      NF-equivalence is NOT scientific redundancy. Two records may propose
      one system and measure different things on it. No record may be
      deprioritised, closed, or described as duplicative on the strength of
      a class membership alone, and the descriptor-defect count is the
      measured bound on how often that inference would be wrong.
    - >-
      Every number is scoped to one commit, one population query, one
      descriptor, one specialisation of free parameters, one monomial
      order, and one extraction procedure. The corpus grows continuously
      and in several worktrees at once, so none of these numbers is 'the
      corpus's breadth' without all six qualifiers.
    - >-
      Records that could not be extracted are counted, never imputed. N_v
      and the low-confidence count are reported beside Q and bound how far
      Q/N_c may be read.
    - >-
      The random-system null bounds the descriptor's coarseness from one
      side only. It shows the descriptor does not collapse unrelated
      systems; it cannot show that the descriptor separates every pair of
      genuinely different real constructions, which is HEUR-001's
      unprovable half and is bounded only by the six DISTINCT pairs.
  dominated_by: >-
    CHECKED ACROSS EVERY AXIS AND NOT NULL. As an attack: NOT APPLICABLE --
    nothing is mounted and no frontier row is contested. As cryptanalysis:
    nothing is claimed. As a corpus-wide structural deduplication of this
    program's own proposals: no incumbent exists; the per-record novelty
    screens are keyword-based and are shown by the RENAME comparison to
    miss notational variants, and IDEA-20260813-f2a6e7's fingerprint is a
    probable-equality pre-filter that this contract consumes rather than
    competes with.
  sota_delta: >-
    Exactly 0 on every attack axis. Content delivered: a frozen decidable
    normal form on proposed attack systems, its calibration against a
    matched curve-free random-system null and against fineness and
    coarseness bounds, the resulting quotient of this program's
    concretely-specified prime-field ECDLP proposals at a named commit, the
    measured reproducibility of extracting a system from a prose record,
    and an explicit count of the records too vague to place in the
    quotient.
  id_allocation_provenance: >-
    EXP-PFDR-a2f447 pre-allocated by the tasking Coordinator in
    TASK-20260904-b2a7e9 and stated there verbatim against source idea
    IDEA-20260815-a5a19f. The authoring subagent has no shell and minted
    nothing; no state was scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no
    duplicate keys to the author's reading. The orchestrating session must
    run a strict parse and tools/validate_ledger.py before this contract is
    relied on.
