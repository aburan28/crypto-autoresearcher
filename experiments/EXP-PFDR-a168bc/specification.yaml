experiment:
  id: EXP-PFDR-a168bc
  hypothesis_id: H-PFDR-6b9f1a
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the
    affected data is generated. NOTHING HERE IS A MEASUREMENT. The
    characteristic-zero j-values and their reductions quoted below were derived and
    hand-checked by TASK-20260904-5423ad and are recorded as HAND ARITHMETIC TO BE
    MACHINE-VERIFIED, never as a run.

  title: >-
    The summation-polynomial degeneration divisor on the j-line - re-deriving the
    coefficient stratification from scratch, extending it to arity 5, and deciding
    by a curve-free weighted-homogeneous null whether the signature is elliptic at
    all or is produced by homogeneity alone.

  objective: >-
    Produce an exact, characteristic-independent list of the j-values at which the
    summation polynomials degenerate, at arities 3, 4 and 5, with multiplicities;
    and separate the part of that result which is a consequence of weighted
    homogeneity - and which a dense random weighted-homogeneous system with no curve
    in it reproduces exactly - from the part which is not. The discriminating
    quantity is the concentration of coefficient multiplicities on few loci, not the
    existence of special j-values.

  inputs:
    elliptic_arm:
      objects: >-
        The third, fourth and fifth summation polynomials over the polynomial ring in
        the two Weierstrass coefficients, over the rationals.
      construction_of_the_fifth: >-
        By the recursive resultant route, WHICH MUST BE VERIFIED against the
        committed harness before use rather than assumed. If the harness builds it by
        a different route, the arity-5 predictions are restated against that route or
        withdrawn, and the restatement is a protocol_amendment.
      committed_reference_values: >-
        FOR COMPARISON ONLY, READ FROM THE COMMITTED RECORDS AND NOT ASSUMED CORRECT.
        The eight-block stratification of the 439 arity-4 coefficients is recorded in
        the validation report as the two trivial coefficient factors with
        multiplicities 248 and 214 and six weight-12 forms with multiplicities 48,
        36, 6, 6, 4 and 1, with resulting supports at the reference prime of 438 at
        j equal to 135, 433 at 1426, 435 at 2180, 391 at 2257, 403 at 2836 and 433 at
        3344, against a generic 439, and 191 at j equal to 0 and 225 at j equal to
        1728. The arity-3 supports are 13 generic, 9 at first coefficient zero and 10
        at second coefficient zero. THE RUN RE-DERIVES ALL OF THESE FROM SCRATCH AND
        REPORTS ANY DISAGREEMENT AS ITS HEADLINE.
    curve_free_arm:
      construction: >-
        A polynomial in the same variables with the SAME monomial support as the
        fourth summation polynomial, each of whose coefficients is replaced by an
        independently drawn random weighted-homogeneous form in the two indeterminates
        of the SAME weight as the coefficient it replaces, over the rationals, from a
        recorded seed. NO SUMMATION POLYNOMIAL, NO GROUP LAW AND NO ELLIPTIC CURVE
        appears in its construction. At least 20 independent draws.
      quantity: >-
        The multiset of weight-12 irreducible coefficient factors with multiplicities,
        the number of distinct weight-12 loci, and the maximum multiplicity fraction.
      purpose: >-
        THE BINDING CURVE-FREE NULL, AND THE DECISIVE ARM OF THIS CONTRACT. The
        dictionary from a weight-12 form to a single j-line point is a consequence of
        weighted homogeneity alone - the only weight-12 monomials in coefficients of
        weight 4 and 6 are the cube of the first and the square of the second - so
        this arm is PREDICTED to reproduce the dictionary and the existence of special
        j-values exactly. What it is predicted NOT to reproduce is the concentration.
    planted_arm:
      construction: >-
        A curve-free weighted-homogeneous family in which EXACTLY 20 coefficients are
        forced to share the weight-12 factor with alpha equal to 1 and beta equal to
        7, whose predicted j-value is 1728 times minus 28 divided by minus 1, that is
        48384.
      purpose: >-
        DYNAMIC-RANGE CONTROL WITH A DEFECT OF KNOWN SIZE. The pipeline must recover
        exactly 20 and exactly 48384. A pipeline that cannot measure a planted
        concentration cannot be trusted to report its absence.
    random_locus_arm:
      construction: >-
        Ten random weight-12 forms whose ratio is NOT among the six, specialising both
        the fourth and the fifth summation polynomial to each by a declared rational
        parametrisation that excludes the singular point.
      purpose: >-
        SPECIALISATION-ARTIFACT NULL. The support must equal the generic value on all
        ten. If a random locus also drops the support, the drop is an artifact of the
        specialisation procedure and every positive is void.
    prime_arm:
      primes: >-
        The reference prime 4001, two further ordinary primes, one prime above 2 to
        the 20, and one prime DIVIDING A DENOMINATOR of the six values, deliberately
        included.
      purpose: >-
        Tests characteristic independence by exact set equality, and tests that the
        exceptional set behaves as predicted at the deliberately chosen bad prime -
        which is the theory working, not failing.

  controls:
  - >-
    C-BASELINE-ARITY3 (BLOCKING, RUNS FIRST). Re-expand the third summation
    polynomial over the rationals, factor every coefficient, confirm the only
    irreducible factors are the two coefficients themselves, and reproduce 13, 9 and
    10 exactly. A stratification engine that cannot reproduce the committed arity-3
    answer produces no admissible arity-4 or arity-5 answer.
  - >-
    C-CURVEFREE (BINDING). The curve-free weighted-homogeneous arm. PREDICTED to
    reproduce the dictionary and the existence of special j-values exactly, and NOT
    to reproduce the concentration. If it reproduces the concentration too, NO
    STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP MAY BE QUOTED FROM THIS EXPERIMENT
    in either direction, and the record must say so in those words.
  - >-
    C-PLANTED (BLOCKING). The planted 20-coefficient shared factor. Exactly 20 and
    exactly j equal to 48384 must be recovered.
  - >-
    C-NULL-LOCUS. Ten random weight-12 loci, predicted to show generic support at
    every arity.
  - >-
    C-GAUGE. Every support count is recomputed under the weighted scaling action for
    a seeded random unit and must agree. RECORDED WITH ITS LIMIT - the committed
    validation report states that weighted homogeneity makes this identity
    impossible to fail unless the code is wrong, and that the same scaling shows
    support is constant on the whole orbit including both quadratic twists. C-GAUGE
    discharges that the implementation is right; it NEVER shows that a difference is
    real, and it is labelled an implementation check everywhere it appears.
  - >-
    C-CONVENTION. The expansion convention is frozen before execution and the
    committed generic count of 439 must be reproduced under that same convention.
  - >-
    C-PARAMETRISATION. The rational parametrisation of each locus explicitly excludes
    the singular point, and the parametrisation is recorded. A parametrisation that
    accidentally zeroes a coefficient hits the singular point and reports a spurious
    drop.
  - >-
    C-TWO-ENGINE. Every symbolic result is produced in two engines sharing no code.
    Disagreement voids that result.
  - >-
    C-ORDER-NOT-NEEDED. Support is monomial-order independent by definition, so no
    order control is required for support - BUT the generic support of the fifth
    summation polynomial must be computed from the EXPANDED polynomial and not from
    any reduced form, and the run must assert that it was.

  independent_variables:
  - arm - elliptic, curve_free, planted, random_locus
  - arity in {3, 4, 5}
  - locus - each of the six weight-12 forms, the two trivial factors, and each random locus
  - prime, for the reduction arm

  metrics:
    primary:
    - >-
      max_multiplicity_fraction, dimensionless, the largest number of coefficients
      sharing a single weight-12 irreducible factor divided by the total coefficient
      count, per arm per arity.
    - >-
      the multiset of weight-12 irreducible coefficient factors with multiplicities,
      per arm per arity, as exact rational forms.
    - >-
      the characteristic-zero j-value of each weight-12 factor, an exact rational,
      and its reduction at each prime of the prime arm.
    - >-
      support drop of the fifth summation polynomial at each of the six loci, an
      integer per locus.
    secondary:
    - monomial support count, generic and per locus, at each arity, per arm
    - block size against support drop per locus, both integers, as the internal consistency check
    - number of distinct weight-12 loci, per arm per arity
    - planted-arm recovered multiplicity and recovered j-value
    - random-locus support counts, per locus per arity
    - C-GAUGE agreement, reported as an implementation check
    - Spearman rank correlation of the arity-5 drops against the arity-4 drops, reported WITH its one-in-six null pass rate
    - the computed exceptional-prime set, and the observed behaviour at the deliberately bad prime
    - characteristic-specific factors found over a finite field but not over the rationals, reported separately
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The maximum multiplicity fraction on the elliptic arm against the curve-free
      arm, and the six characteristic-zero j-values with their reductions.
    formula: >-
      max_multiplicity_fraction at least 0.05 on the elliptic arm at arity 4 - the
      committed value is 48 over 439, that is 0.109 - against at most 0.005 on the
      curve-free arm, a predicted separation of about a factor of twenty. The six
      characteristic-zero values are 55296 over 5, 55296 over 59, 27648 over 25,
      221184 over 47, minus 13824, and 110592 over 19, reducing at the reference
      prime to exactly 2257, 2836, 1426, 3344, 2180 and 135. The block size equals
      the support drop at every locus.
    source: >-
      The dictionary is derived from the standard j-invariant expression - on the
      locus where alpha times the cube of the first coefficient plus beta times the
      square of the second vanishes, the j-invariant equals 1728 times minus four
      beta divided by twenty-seven alpha minus four beta. TASK-20260904-5423ad
      derived it, evaluated it at all six committed forms, and hand-checked ALL SIX
      reductions against the committed multiset; all six matched. The source idea
      claimed five of six. The concentration threshold is a pre-registered decision
      threshold sized to the committed value and the curve-free expectation, not a
      derived quantity.

  scale_relevance:
    tier: toy
    justification: >-
      Symbolic computation over the rationals carries no scale; the reduction arm
      uses the reference prime 4001 of about 12 bits, two further ordinary primes,
      one prime above 2 to the 20, and one deliberately bad prime. The tested scope
      is exactly those arities and primes.
    correspondence: null

  tail_checks:
  - >-
    The deliberately included prime dividing a denominator must show the PREDICTED
    degeneration of the dictionary - the exceptional set behaving as predicted rather
    than the theory failing. Reported as a positive check, not as an anomaly.
  - >-
    The locus with the largest block must show the largest support drop, and the
    locus with the smallest block the smallest. A large drop at the single-coefficient
    locus with none at the 48-coefficient locus would refute the mechanism.

  replication:
    seeds: [20260904, 20260905]
    independent_instances: 2
    seeds_policy: >-
      The symbolic elliptic arm is deterministic and uses no seed; its reproducibility
      is by exact re-derivation in a second engine. The curve-free coefficient draws,
      the planted construction, the ten random loci and the C-GAUGE unit are all
      derived from a master seed recorded in the manifest and are reproducible from
      that seed and an index. Seeds are fixed before execution and never redrawn after
      an outcome is seen.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 16
    maximum_runs: 6
    maximum_workers: 1
    budget_note: >-
      The fifth summation polynomial over the rationals in two symbolic coefficients
      is the only heavy step. If it exceeds the budget, the run may compute it over a
      large prime field instead and MUST record which route was used and that the
      characteristic-zero statement is then unverified at arity 5. A budget exhaustion
      is an infrastructure receipt, never a negative result.

  stopping_rules:
  - >-
    SR1 BLOCKING. C-BASELINE-ARITY3 runs first and must reproduce 13, 9 and 10
    exactly in both engines. Failure halts the run before arity 4 is touched.
  - >-
    SR2 BLOCKING. The recursive construction of the fifth summation polynomial is
    verified against the committed harness before it is used. A different route halts
    the arity-5 arm pending a protocol_amendment.
  - >-
    SR3 BLOCKING. C-PLANTED must recover exactly 20 and exactly 48384 before any
    concentration figure is reported.
  - >-
    SR4. If the arity-4 stratification disagrees with the committed eight-block list,
    the run REPORTS THE DISAGREEMENT AS ITS HEADLINE and does not proceed to arity 5
    until the disagreement is adjudicated.
  - >-
    SR5. If the arity-5 computation over the rationals exceeds the budget, it may be
    performed over a large prime field, and the run records which route was used and
    the resulting loss of the characteristic-zero statement at that arity.
  - >-
    SR6. Budget exhaustion stops the run and reports the arities completed. An
    infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    The two engines disagree on any symbolic result.
  - >-
    A random weight-12 locus shows a support drop - the specialisation procedure is
    creating the effect and every positive is void.
  - >-
    The planted concentration is not recovered exactly.
  - >-
    A parametrisation is used that does not explicitly exclude the singular point, or
    the parametrisation is not recorded.
  - >-
    The generic support of the fifth summation polynomial is computed from a reduced
    rather than an expanded form.
  - >-
    A finite-field-only factor is reported as part of the characteristic-independent
    statement.
  - >-
    C-GAUGE is cited anywhere as evidence that a difference is real rather than as an
    implementation check.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and is
    NEVER counted as negative mathematical evidence.

  success_criterion: >-
    C-BASELINE-ARITY3 and C-PLANTED discharged; the arity-4 stratification reproduced
    with its eight blocks; all six characteristic-zero j-values matching and reducing
    correctly at all primes of the prime arm; block size equal to support drop at all
    six loci; strictly positive arity-5 support drops at six of six loci;
    max_multiplicity_fraction at least 0.05 on the elliptic arm against at most 0.005
    on the curve-free arm; and the ten random loci all generic.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) Any of the six characteristic-zero
    values fails to reduce to its committed counterpart - the dictionary or the
    committed stratification is wrong; the record is withdrawn by a superseding one
    and re-deriving the stratification decides which. (F2) C-BASELINE-ARITY3 fails -
    the instrument is wrong and nothing downstream is admissible. (F3) A random
    weight-12 locus drops the support - specialisation artifact; every positive void.
    (F4) THE CURVE-FREE WEIGHTED-HOMOGENEOUS ARM SHOWS max_multiplicity_fraction at
    or above 0.05 - the concentration is produced by homogeneity and not by the
    summation structure, and NOTHING FROM THIS EXPERIMENT MAY BE QUOTED AS A
    STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP, in either direction, and the record
    must state that in those words. (F5) The arity-5 support equals the generic value
    at any one of the six loci - the degeneration set is arity-local, the object is
    NOT a property of the curve, and its interpretation as such is refuted. This is
    the most informative single outcome available and it is cheap. (F6) An
    irreducible coefficient factor is found that is not weighted-homogeneous - the
    mechanism is wrong and the j-line factorisation fails.

  required_artifacts:
  - monomial support counts, generic and per locus, at arities 3, 4 and 5, per arm, from both engines
  - the irreducible factor multiset of every coefficient over the rationals, per arm per arity, with multiplicities
  - max_multiplicity_fraction per arm per arity
  - the characteristic-zero j-value per weight-12 factor as an exact rational
  - the reduction of each value at every prime of the prime arm, and the observed behaviour at the deliberately bad prime
  - the computed exceptional-prime set with its derivation
  - block size against support drop per locus, as the internal consistency table
  - curve-free arm results for all 20 draws, with the seed and the coefficient weights used
  - planted-arm recovered multiplicity and j-value
  - random-locus support counts per locus per arity, with the parametrisation used
  - C-GAUGE agreement table, labelled as an implementation check
  - the verification of the fifth summation polynomial construction against the committed harness
  - the frozen expansion convention and the assertion that support was computed from the expanded form
  - characteristic-specific factors, reported separately from the characteristic-zero statement
  - Spearman rank correlation of arity-5 against arity-4 drops, WITH its one-in-six null pass rate stated alongside
  - command, environment, seeds, engine names and versions, and resource measurements

  limitations:
  - >-
    THE HEADLINE DICTIONARY IS NOT AN ELLIPTIC-CURVE FACT, AND THIS CONTRACT SAYS SO
    BEFORE IT RUNS. With coefficients of weight 4 and 6 the only weight-12 monomials
    are the cube of the first and the square of the second, so EVERY weight-12
    coefficient of ANY weighted-homogeneous family has the special shape and cuts out
    one point of the j-line. The curve-free arm is therefore predicted to reproduce
    the dictionary in full, and the only quantity that can separate the elliptic
    family is the multiplicity concentration. Recorded in H-PFDR-6b9f1a
    band_non_degeneracy.
  - >-
    THE RANK-ORDER STATISTIC IS SECONDARY AND ITS NULL PASS RATE IS ONE IN SIX. With
    the tied pair excluded four ranks remain, and Spearman correlation at or above
    0.8 is attained by 4 of the 24 permutations. It is reported as corroboration and
    never as a test.
  - >-
    THE COMMITTED STRATIGRAPHY IS VALIDATOR-DERIVED AND UNREPLICATED. The evidence
    record states plainly that the six special j-values, the factor multiplicities
    over the rationals and the locus check appear in the validation report and in NO
    RUN RECORD, produced by one independent validating session under no frozen
    contract of its own. Re-deriving it from scratch is this contract''s first
    substantive gate for exactly that reason.
  - >-
    C-GAUGE IS WEAK AGAINST THE QUESTION BEING ASKED. Weighted homogeneity makes the
    identity impossible to fail unless the code is wrong, and the same scaling shows
    support is constant on the whole orbit including both quadratic twists - so
    support is a function of j alone and C-GAUGE cannot discriminate a curve
    difference from a model difference. It is retained as an implementation check and
    labelled as one everywhere.
  - >-
    NO COST EFFECT IS CLAIMED AND NO TIME IS MEASURED. The lane''s committed data is
    a 23 to 31 percent support drop against Groebner-time movements of minus 0.44 and
    minus 0.67 percent, with basis size moving the WRONG way. Reading this contract as
    a speedup claim is a misuse of it.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Monotonicity of the
    degeneration set beyond arity 5 is not testable here or by any reachable
    computation - the sixth summation polynomial over the rationals in two symbolic
    coefficients exceeds this budget by a wide margin. Any monotonicity established
    here runs from arity 4 to arity 5 only, and the general quantifier is not tested.
  - >-
    SUPPORT CAN NEVER SEPARATE ISOGENY CLASSES, because a curve and its quadratic
    twist share a j-invariant and therefore a support while lying in different
    classes. No class-level claim is made or derivable.
  - >-
    Toy scale throughout. No attack, no exponent, no speedup, no constant.

  assigned_to: executor
  approved_by: null
