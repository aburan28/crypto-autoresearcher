experiment:
  id: EXP-SSI-2d8583
  hypothesis_id: null
  hypothesis_note: >-
    Deliberate null: this is a derivation/accounting contract for
    IDEA-20260806-9c2f80, not an executed test of a hypothesis and not an
    attack construction.
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-75287c
  source_proposal: IDEA-20260806-9c2f80
  supersedes: EXP-SSI-a6132d
  supersession_note: >-
    Additive successor correcting the snapshot-archived draft's schema defect:
    the predecessor omitted the required top-level budget and success_criterion
    fields. The predecessor remains immutable and is not evidence. No research
    result or interpretation is changed.
  title: >-
    Corrected Stage 0/1 accounting contract for the classical per-prime OneEnd
    advice frontier, with a matched random-advice null

  objective: >-
    After independent design review and Coordinator authorization, evaluate the
    symbolic and concrete arithmetic of IDEA-20260806-9c2f80's four named
    constructions at log2(p) in {256,512}. Emit (S,T) rows, exact controls, and
    the physical-memory comparison. Do not implement isogeny walks, execute an
    attack, claim a lower bound over all advice, or infer a security result.
  claim_ceiling: >-
    At most a derivation about the named closed list and declared accounting
    conventions. It cannot establish H-ADV-2 or H-ADV-3, validate H-ADV-1,
    transfer toy output to cryptographic security, or move a hardness exponent.
  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    predecessor_contract: experiments/EXP-SSI-a6132d/specification.yaml
    duplication_refresh: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-f68c05/tasks/TASK-20260809-b28c39/duplication_knowledge_audit.md
    frozen_source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    prior_evidence: ledger/evidence/EV-SSI-59f7a2.yaml
    prior_decision: ledger/decisions/DEC-20260805-596d71.yaml
    parameter_sets:
      log2_p: [256, 512]
      sigma: [0.0, 0.1666666667, 0.3333333333, 0.5, 0.6666666667, 0.8, 1.0]
      incumbent_memory_log2: 92.5
    arithmetic_convention: >-
      Use exact rational arithmetic internally. S=0 is a distinguished
      no-advice case, not a division-by-zero row. Advice and working memory are
      separate axes.
  proof_search_map_audit:
    status: passed_for_bounded_closed_list_only
    bottleneck: growth of the resolution fiber |R(a)| per unit advice
    baseline_reproduction: >-
      S=0 returns incumbent p^(1/3+o(1)); S=p^(1/2) reproduces the stated
      MITM/Delfs-Galbraith balance embedding.
    observation_collision: >-
      Construction A at sigma=4/5 and Construction B at theta=1/5 collide at
      (p^4/5,p^1/5); B's curves already carry orders, so this is a notation
      collision rather than a second mechanism.
    quantifier_order: >-
      forall p exists A_p independent of E, |A_p|=S, forall supersingular E,
      query(A_p,E) resolves an endomorphism in T(S); the incumbent is forall p
      forall E with no advice.
    method_ceiling: >-
      Certify only the pre-registered named list, never all advice strings; the
      oriented/CSIDH-shaped nearby-object control must not return the same flat
      frontier.
    proof_obligations:
      - "Construction A build/query charge and H-ADV-2 status"
      - "Resolution-fiber closure under a walked isogeny"
      - "Construction C middle-table size p^2/(X1^2 X2^2)"
      - "Algorithm 3 random self-reducibility scope"
      - "Composite min-row and monotonicity arithmetic"
  controls:
    - id: CTRL-S0
      kind: known_answer
      forced_result: "T=p^(1/3+o(1)); no advice hit is available"
      failure_action: terminate_without_treatment_rows
    - id: CTRL-RANDOM-ADVICE
      kind: matched_null
      order: before_treatment
      matching: same_declared_size_access_model_and_query_budget
      forced_result: "T=p^(1/3+o(1)) for every declared S"
      failure_action: invalidate_instrument_and_report_no_treatment
    - id: CTRL-S-P
      kind: known_answer
      forced_result: "S=p advice carrying every curve order gives polynomial query"
    - id: CTRL-SHUFFLED-FIBER
      kind: negative_control
      forced_result: "permuting orders among curves removes any speedup"
    - id: CTRL-NEARBY-ORIENTED
      kind: nearby_object
      forced_result: "must not return the same flat frontier"
  independent_variables: [log2_p, sigma, construction, control_or_treatment]
  metrics:
    primary:
      - "T_min(sigma) on seven closed-list sigma values"
      - "exact S=0 and S=p control verdicts"
      - "random-advice null verdict at every declared sigma"
      - "fiber_ratio by named construction, as derivation only"
    secondary:
      - "log2 advice entries and query-cost exponent at log2(p)=256,512"
      - "break-even instance count S/p^(1/3)"
      - "physical-memory comparison against incumbent log2 memory 92.5"
      - "Construction C minus A exponent gap sigma/2"
  preregistered_prediction:
    quantity: T_min(S)
    formula: "min(p^(1/3+o(1)), p^(1+o(1))/S)"
    sigma_values: [0.0, 0.1666666667, 0.3333333333, 0.5, 0.6666666667, 0.8, 1.0]
    predicted_time_exponents: [0.3333333333, 0.3333333333, 0.3333333333, 0.3333333333, 0.3333333333, 0.2, 0.0]
    random_advice_null: "0.3333333333 at every sigma"
    construction_c_gap: "sigma/2 > 0 for every sigma > 0"
    source: >-
      Arithmetic and named constructions in IDEA-20260806-9c2f80; the incumbent
      row remains conditional on the frozen source's Heuristic 1.
  stages:
    - id: stage-0-symbolic
      purpose: exact rows, proof-map arithmetic, and controls
      method: pen_and_paper_plus_stdlib_serialization
      budget_seconds: 3600
      stop_rules: ["stop on S=0 failure", "stop on random-null design failure", "stop on non-monotone row"]
    - id: stage-1-arithmetic
      purpose: instantiate declared exponents and memory comparison
      method: python3_standard_library_only
      budget_seconds: 600
      budget_memory_gb: 1
      parameters: {log2_p: [256, 512]}
      stop_rules: ["no execution before freeze and authorization", "no unregistered construction", "stop on exact-gate failure"]
  budget:
    wall_clock_seconds_per_run: 4200
    total_cpu_hours: 0.2
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    note: "Stage 0 is symbolic; Stage 1 is standard-library arithmetic only."
  stopping_rules:
    - "No execution while frozen=false or execution_authorized=false."
    - "Commit the random-advice null before treatment rows."
    - "Stop at the first exact-gate failure and preserve the partial artifact."
    - "Any sub-1/3 closed-list row requires independent review-breakthrough at max."
  invalidation_rules:
    - "Change to sigma values, controls, or formula after any observation."
    - "Use of numpy, Sage, network access, or isogeny implementation in Stage 1."
    - "Claim of an all-advice lower bound, attack, security result, or exponent move."
    - "Omission of physical-memory and build-versus-query caveats."
  success_criterion: >-
    If separately approved, frozen, and validly executed: all exact gates pass;
    the random-advice null returns the incumbent row before treatment; every
    closed-list row is emitted for both parameter sets; and the table, memory
    comparison, and caveats are complete. This is only a derivation/accounting
    result, not evidence of an attack or hardness change.
  falsification_criterion: >-
    Terminate or invalidate if S=0 fails, the matched random-advice null improves
    on the incumbent, a closed-list row beats 1/3 at sigma<=2/3, Construction C
    is not dominated, or an exact gate fails. Timeout, crash, or dependency
    failure is infrastructure only.
  required_artifacts:
    - "Corrected frozen specification and freeze receipt"
    - "Current-corpus duplication/proof/control audit"
    - "Pre-run control hash commitment"
    - "Machine-readable Stage 0/1 output if authorized"
    - "Exact command, environment, stdout, stderr, and resource receipt if run"
    - "Snapshot before independent review and ledger archive after review"
  scale_relevance:
    tier: derivation
    justification: >-
      Stage 1 uses cryptographic-size exponents but performs no cryptographic
      computation. Output is arithmetic under a declared model, not crypto-scale
      evidence; the optional graph arm is not part of this contract.
    correspondence: null
  assigned_to: executor
  approved_by: null
