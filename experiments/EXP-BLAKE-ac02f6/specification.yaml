experiment:
  id: EXP-BLAKE-ac02f6
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0bbb70; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0bbb70
  question_id: RQ-BLAKE-584719
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Build two independently authored encodings of the same reduced-round BLAKE3 differential
    model, solve both across rounds, publish a per-round agreement table, and measure its error-detection
    rate against planted single errors and a shared-error control.
  objective: 'The one uncertainty a run reduces is whether any bound-per-round curve in this lane
    reflects the intended differential model or an encoding''s misreading of it. Decomposed: (i) whether
    two encodings written in different formalisms from the same pinned specification agree, round
    by round, on every optimum both prove -- since they claim to compute the same integer, equality
    is forced and any inequality is a located modelling bug worth more than the curve it invalidates;
    (ii) what the agreement table''s DETECTION POWER actually is, measured by injecting planted single
    errors (dropped carry constraint, fixed message word, shifted rotation constant, dropped objective
    term) one at a time and recording the per-class detection rate and whether bisection localises
    each to the corrupted operation, because an instrument whose blind spots are unmeasured cannot
    license the clean report it produces; (iii) how far the table reaches, since it is bounded by
    the weaker encoding and every curve row beyond it must be labelled unvalidated. A run does NOT
    reduce uncertainty about BLAKE3''s design, about attack cost, or about whether both encodings
    share a misreading -- the last is the instrument''s structural blind spot and is demonstrated
    rather than removed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the differential model
      as encoded in artifact A (CNF, hash H_A) and artifact B (MILP, hash H_B), both frozen before
      comparison, the per-round optima agreed on rounds 1..k and disagreed on the listed rounds; the
      planted-error catalogue was detected at rate d_c per class c with bisection localising correctly
      in L of D detections; the shared-error control reported agreement as predicted; and the achieved
      authorship independence was as declared. What does NOT follow: that either encoding is correct,
      since a shared misreading produces agreement and the shared-error control demonstrates exactly
      that; that curve rows beyond round k are validated by anything; that detection rates bound error
      classes outside the catalogue; or anything whatever about BLAKE3, its round count, or any deployed
      system.'
  inputs:
    procedure: 'STAGE 0 (cost: agent time): pin the specification and both reference implementations;
      validate references against published vectors. STAGE 1 (cost: high agent time, and deliberately
      duplicated): author the CNF encoding; separately author the MILP encoding, in a separate session
      with no access to the first artifact; freeze and hash both. STAGE 2 (cost: minutes): solve r
      = 2 on both; confirm both run and produce proved optima before anything else. STAGE 3 (cost:
      minutes): planted-error controls -- four single errors injected into the CNF arm one at a time,
      plus one shared error injected into both; record detection and bisection localisation per class.
      STAGE 4 (cost: low to medium): sweep r upward on both encodings until each stops proving optima;
      build the agreement table with per-row statuses. STAGE 5 (cost: variable, potentially high agent
      time): bisect every disagreement to a round, then a constraint block, then an operation; record
      which encoding was wrong and why. STAGE 6 (cost: low): publish the table with both hashes, the
      declared independence level, the detection rates, and the explicit list of curve rounds it does
      and does not validate.'
    instrument: 'Python 3.11. CNF arm: PySAT emitting DIMACS, solved with CaDiCaL. MILP arm: PuLP
      emitting LP files, solved with CBC. Deliberately different formalisms and different solvers,
      so that a solver bug is unlikely to be shared. Planted errors implemented as explicit patch
      functions applied to a frozen encoding rather than as edits, so the frozen hash remains the
      reference and every corruption is auditable. Reference implementations pinned via ctypes for
      the vector gate. Table construction, hashes, seeds and manifests via harness/runner.py. No Sage.'
    parameters: 'Rounds r = 1 upward on both encodings until each fails to prove an optimum within
      a 1800-second per-point ceiling; expected CNF reach 3 to 5, MILP reach 2 to 4, table reach the
      smaller. Planted errors: 4 classes, injected one at a time into the CNF arm, each evaluated
      at every round the table covers rather than only at the cheapest round -- because detection
      power is round-dependent and a single-round detection rate would overstate it. Shared-error
      control: 1 error injected identically into both. Seeds: 3 per solve on the CNF arm; the MILP
      arm is deterministic and that asymmetry is recorded. Hashes: SHA-256 of both frozen encoding
      sources.'
  controls:
  - Planted single-error injections (dropped carry constraint, fixed message word, shifted rotation
    constant, dropped objective term), one at a time, with required detection and bisection localisation.
  - 'Shared-error control: the same error injected into both encodings, with agreement REQUIRED as
    the demonstration of the method''s blind spot.'
  - 'Frozen-hash control: both encodings hashed before any comparison, so no post-hoc editing of one
    to match the other is possible; the hashes appear in the table.'
  - 'Status-separated reporting: proved-optimum rows and certified-lower-bound rows are verdicted
    under different criteria and never merged.'
  - 'Independent-authorship declaration: the degree of independence actually achieved is recorded
    verbatim, including the fact that a single-agent runtime only approximates it.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Planted-error controls, run through the identical table-building code
    path in the same invocation. Corruptions injected one at a time into one encoding: drop a carry
    constraint from one modular addition; fix one message word to a constant; shift one rotation constant
    by one; drop the objective''s contribution from one round. For each, the agreement table must
    flag a disagreement, and the bisection must localise it to the corrupted round or operation. What
    the null must show for the signal arm to mean anything: every planted error must be detected,
    and the record must report the DETECTION RATE per error class, because an agreement table that
    catches dropped constraints but misses off-by-one rotations has known blind spots that a clean
    table would otherwise appear to exclude. Additionally, a matched-null shared-error control: inject
    the SAME error into both encodings and confirm the table reports agreement -- demonstrating the
    blind spot concretely rather than merely conceding it in prose, which is the difference between
    a stated limitation and a measured one.'
  independent_variables:
  - encoding formalism (CNF | MILP)
  - round count r
  - planted-error class (none | dropped-carry | fixed-message | shifted-rotation | dropped-objective
    | shared)
  - solver seed (CNF arm only)
  metrics:
    primary:
    - per-round agreement verdict with both values and both statuses
    - table reach k
    - planted-error detection rate per class per round
    - bisection localisation correctness
    - shared-error control verdict
    secondary:
    - solve time per encoding per round (metadata only, never a result)
    - constraint or clause counts per encoding per round
    - declared authorship independence level
    - encoding hashes
    - count of curve rounds labelled unvalidated
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'Predicted: the agreement verdict on double-proved rows, and the shared-error control''s
      verdict.'
    formula: 'For every round r where status_cnf(r) = status_milp(r) = proved_optimum, the prediction
      is W_cnf(r) = W_milp(r) exactly, as an equality of integers rather than a tolerance. Verdict(r)
      = EQUAL if that holds, DISAGREE otherwise; a single DISAGREE with both statuses proved invalidates
      every curve derived from either encoding until resolved. Separately predicted: SharedErrorVerdict
      = EQUAL at every covered round, which is the measured demonstration that agreement cannot detect
      shared misreading. Detection rate per class c is defined as (rounds where the planted error
      produced DISAGREE) / (rounds covered by the table), reported per class rather than pooled.'
    source: Pre-registered in the parent proposal IDEA-20260816-0bbb70 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Rounds 1 to at most 5 against designs shipping at 7 and 10; a toy tier and labelled
      so. But the scale caveat here is different in kind from the other records in this bucket and
      should be read that way: this experiment makes no claim about the primitive at any scale, so
      the round range bounds only the RANGE OVER WHICH CURVES CAN BE VALIDATED, not the strength of
      any statement about BLAKE3. NO EXTRAPOLATION is performed; specifically, the record forbids
      treating agreement at rounds 1..k as evidence that the encodings agree at rounds above k, and
      requires those rows to be labelled unvalidated.'
    correspondence: null
  tail_checks:
  - Inspect the largest table row individually, since it is the boundary beyond which every curve
    row becomes unvalidated and is therefore the most consequential single cell.
  - Check detection rate at the LARGEST covered round as well as the smallest, since round-dependent
    detection power is the main way a rate overstates the instrument.
  - Examine any round where the two encodings' statuses differ, since those rows carry no verdict
    and their count determines how ragged the table is.
  - Verify the shared-error control at every covered round rather than at one, since a shared error
    that diverges at higher rounds would be a surprising and important result about the two formalisms.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - HALT and bisect immediately on the first DISAGREE between two proved optima, before continuing
    the sweep.
  - HALT if the shared-error control reports DISAGREE, since the two encodings are then not modelling
    the same object.
  - Stop the sweep when both encodings have failed to prove an optimum at the same round.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if both encodings are frozen and hashed before comparison, the
    agreement table is published with per-row statuses and a stated reach, detection rates are reported
    per planted-error class and per round, and the shared-error control behaves as predicted -- whether
    the real table is clean or contains a located disagreement.
  falsification_criterion:
  - A planted error undetected at every covered round.
  - Bisection fails to localise a detected disagreement.
  - Shared-error control reports DISAGREE.
  - Table reach below 2 rounds.
  - MILP found unable to express the model faithfully.
  - An unresolvable disagreement between two proved optima.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0bbb70
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The differential model to be encoded is not written down independently of either encoding; a Coordinator
    must approve a model specification first, or the two encodings will differ over what they were
    meant to compute rather than over how they compute it.
  - Whether genuine authorship independence is achievable in this runtime is unresolved; a Coordinator
    must decide whether a declared-approximate independence is acceptable or whether the record should
    wait for two sessions.
  - The planted-error catalogue is not exhaustive and no argument exists for its representativeness;
    a Coordinator should extend or accept it explicitly.
  - Whether this record's agreement table becomes a hard gate on the transfer-curve and chimera records,
    or an advisory artifact, is a policy decision this record cannot make for itself.
