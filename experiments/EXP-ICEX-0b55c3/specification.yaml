experiment:
  id: EXP-ICEX-0b55c3
  hypothesis_id: H-ICEX-12d125
  version: 1
  title: >-
    Decomposition probability conditioned on the target - full empirical
    distribution with a computed instrument floor, a graded restricted-base
    planted defect and a curve-free Z/n supply null
  status: draft
  objective: >-
    Estimate P(decomp | target) per target by T = 300 independent attempts on at
    least 200 uniformly sampled targets per cell, over at least 3 toy curves and
    at least 2 base sizes, and report the FULL empirical distribution with
    percentiles rather than its mean. The trial budget is 300 rather than the
    source idea's 50 because at T = 50 a target of true probability 0.01 shows
    zero successes with probability 0.99^50 = 0.605, so the zero-success
    discriminator could not fire; T = 300 gives an instrument floor
    p_min = 1 - 0.05^{1/300} = 0.0099 and no tail is interpreted below it.
  inputs:
    curves: at least 3 toy prime-field short-Weierstrass curves
    targets_per_cell: 200
    attempts_per_target: 300
    base_sizes: at least 2, spanning at least a twofold range
    arity_m: fixed at approval and recorded
    restricted_base_fractions: [0.00, 0.25, 0.50]
  controls:
  - >-
    BLOCKING STAGE S0, DETERMINISM CHECK. Repeated attempts on the same target
    with fresh randomness must produce mixed outcomes on at least one target. If
    every target's outcome is constant, the procedure is deterministic given the
    target, P(decomp | target) is 0 or 1, and the estimator is wrong for that
    regime; the run stops and reports the regime rather than estimating.
  - >-
    NAMED CONTROL C1, PLANTED EASY TARGET, FORCED VALUE. A target constructed as
    a known sum of m factor-base elements. Forced value - 300 successes in 300
    attempts. Failure means the attempt procedure is broken and no distribution
    is admissible.
  - >-
    NAMED CONTROL C2, RESTRICTED-BASE PLANTED DEFECT, GRADED DEFECT OF KNOWN
    SIZE. A declared fraction f of the factor base is forbidden from appearing in
    an accepted decomposition. Predicted magnitude, binding - the mean P(decomp)
    falls by exactly (1 - f)^m, that is a factor 0.422 at f = 0.25 and 0.125 at
    f = 0.50 for m = 3, each within 30 percent. The two-point ladder is the
    demonstrated dynamic range; a control that merely returns a number is not
    accepted.
  - >-
    NAMED NULL C3, MATCHED RANDOM SET ON THE CURVE. A random set of curve points
    of the same size as the algebraic factor base, giving the birthday-only
    reference spread at matched size.
  - >-
    NAMED NULL C4, CURVE-FREE Z/n SUPPLY NULL, MANDATORY. The identical
    per-target estimation accounting run in Z/n with a random subset of size B
    and m-fold sums, containing no curve. CONSEQUENCE PRE-STATED - if the
    curve-free object reproduces the spread and the zero-success tail, the
    observation is about balls-into-bins supply in a finite abelian group and
    NOTHING from this experiment may be quoted as a statement about elliptic
    curves or the ECDLP.
  - >-
    NAMED CONTROL C5, SHUFFLED TARGET LABELS. Excludes an ordering artifact or
    shared randomness across attempts.
  - >-
    NAMED CONTROL C6, DISCARDED-SCALAR ENFORCEMENT. The sampling scalar of every
    target is destroyed before the attempt loop and the enforcement is a required
    artifact, so no target's discrete log is ever available to the procedure.
  - >-
    NAMED CONTROL C7, STRUCTURAL TELL. The zero-success fraction must THIN as B
    grows. A fraction flat in B, with all planted controls passing and the
    fraction above the instrument floor, is a candidate hard-target stratum and
    routes to a successor proposal; it is not concluded here.
  independent_variables: [curve, base_size, restricted_base_fraction, arm]
  metrics:
    primary:
    - empirical_distribution_of_p_decomp_given_target_with_1_5_25_50_percentiles
    - fraction_of_targets_with_zero_successes_in_budget_dimensionless
    secondary:
    - instrument_floor_p_min_dimensionless_computed_from_the_trial_budget
    - interquartile_spread_of_p_decomp_per_arm_at_matched_size
    - mean_p_decomp_per_arm_reported_beside_the_distribution_never_instead_of_it
    - restricted_base_control_ratios_beside_their_predicted_values
    - movement_of_the_lanes_relation_supply_input_under_a_tail_aware_model
    - attempts_and_successes_raw_per_target
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The interquartile spread of the per-target estimates hat p_i = successes_i
      / 300 across 200 uniformly sampled targets, dimensionless, compared against
      the same spread computed on the matched random-set null at the same base
      size.
    formula: >-
      spread_algebraic - spread_null <= estimator noise, where estimator noise is
      the spread induced by binomial sampling alone at T = 300 around the
      observed mean, computed before the arms are compared. Zero-success fractions
      are interpreted only above p_min = 1 - 0.05^{1/300} = 0.0099.
    source: >-
      H-ICEX-12d125, HEUR-001, whose rigorous ingredient is the KN-OPEN-020
      tuple-image counting bound on the mean and whose distributional ingredient
      is the balls-into-bins concentration assumption the measurement tests.
  scale_relevance:
    tier: toy
    justification: >-
      Toy curves and toy base sizes spanning at least a twofold range. The
      exponent-level consequence of a heavy tail lives at base sizes this
      contract does not reach and is not tested here. The transfer assumption -
      that toy-scale concentration behaviour persists at cryptographic base sizes
      - is stated and unjustified.
    correspondence: null
  tail_checks:
  - >-
    The ten lowest-hat-p targets are reported with any available structural
    invariant and are explicitly checked against the instrument floor BEFORE
    being called a tail.
  - >-
    The zero-success fraction is reported per base size with its binomial
    interval and beside p_min, so a budget-induced tail cannot be mistaken for a
    real one.
  replication:
    seeds: [1, 2, 3]
    independent_instances: 12
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 60
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - >-
    Stop a run at 3600 s and record it as resource_exhaustion. A target with
    fewer than 300 completed attempts is reported with its ACTUAL attempt count
    and its widened interval, never padded to 300.
  - >-
    Stop the experiment if the aggregate attempt count would exceed 3e5 per arm;
    report unreached cells as unreached.
  - >-
    Stop before estimation if the determinism check fails.
  invalidation_rules:
  - >-
    A zero-success fraction interpreted below the instrument floor is
    invalid_measurement.
  - >-
    A distribution reported as a mean without its percentiles is
    invalid_measurement; the mean is the projection this experiment exists to
    audit.
  - >-
    Failure of the planted easy target invalidates every distribution in the run.
  - >-
    Failure of the restricted-base plant at either f invalidates every
    distribution in the run.
  - >-
    Any run in which a target's sampling scalar was retained or used is
    invalid_measurement.
  - >-
    Attempts sharing randomness across trials on the same target are
    invalid_measurement, since they correlate trials and understate the spread.
  success_criterion: >-
    The determinism check passes; the planted easy target returns 300 of 300; the
    restricted-base plants return 0.422 and 0.125 within 30 percent; the observed
    spread does not exceed the matched random-set null's by more than estimator
    noise on any curve; the zero-success fraction falls with B above the
    instrument floor; and the lane's relation-supply input moves by less than its
    own confidence interval under a tail-aware model.
  falsification_criterion: >-
    A spread exceeding the matched null's by more than estimator noise on at
    least 3 curves falsifies HEUR-001 within the tested scope. A zero-success
    fraction flat in B, above the instrument floor, with all controls passing, is
    a CANDIDATE hard-target stratum routed to a successor proposal and is not
    concluded here. A control failure or a deterministic attempt procedure voids
    the estimator rather than producing a result of either sign. If the
    curve-free Z/n null reproduces the spread and the tail, no elliptic-curve or
    ECDLP statement may be quoted from this experiment.
  required_artifacts:
  - curve parameters, generator, subgroup order and cofactor per cell
  - factor base contents and its construction seed, per cell
  - per-target attempt and success counts, raw, with the per-attempt randomness seeds
  - mechanical discarded-scalar enforcement receipt
  - determinism-check outputs
  - planted easy target and restricted-base control outputs beside their predicted values
  - matched random-set and curve-free Z/n arm outputs under the identical code path
  - computed instrument floor with the arithmetic that produced it
  - independently verified certificate for every claimed decomposition
  - per-run manifest, command, environment, git commit, stdout, stderr, validity status
  assigned_to: executor
  approved_by: null
