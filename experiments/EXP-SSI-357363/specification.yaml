  id: EXP-SSI-357363
  version: 5
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: 'Deliberate null: this is an additive design refinement for IDEA-20260806-9c2f80, not an executed test
    of a hypothesis and not an attack construction.'
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-c057fd
  source_proposal: IDEA-20260806-9c2f80
  supersedes: EXP-SSI-8e589d
  supersession_note: Additive successor incorporating the independent Validator and Red Team findings from BATCH-0a1b85. EXP-SSI-8e589d
    and all earlier predecessors remain immutable and are not evidence. This record repairs the finite execution contract
    only; it does not alter prior observations or authorize execution.
  title: Exact physical-contract design for a fixed-advice classical per-prime OneEnd frontier
  objective: Define a reviewable symbolic and arithmetic contract for the named closed list in IDEA-20260806-9c2f80 with canonical
    bytes, cryptographic-scale count widths, explicit manifest/setup and index costs, output-producing typed branches, bounded
    restart semantics, and reproducible paired controls. If later approved, frozen, and executed, the work may emit conditional
    accounting rows only; it may not implement an unapproved isogeny attack, claim a lower bound over all advice, infer a
    security result, or move a hardness exponent.
  claim_ceiling: At most a derivation about the pre-registered named constructions under the exact accounting conventions
    below. It cannot validate H-ADV-1, H-ADV-2, H-ADV-3, or H-ADV-4 by symbolic arithmetic; it cannot certify an all-advice
    lower bound; and it cannot transfer to EndRing, Isogeny, SQIsign, CSIDH security, or any deployed parameter claim.
  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    predecessor_contract: experiments/EXP-SSI-8e589d/specification.yaml
    predecessor_predecessor: experiments/EXP-SSI-a6132d/specification.yaml
    prior_validator: coordination/goals/GOAL-SSI-001/batches/BATCH-0a1b85/reviews/TASK-20260809-ad1631/validation_report.yaml
    prior_red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-0a1b85/reviews/TASK-20260809-bcd3d9/red_team_report.md
    frozen_source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    prior_evidence: ledger/evidence/EV-SSI-59f7a2.yaml
    prior_decision: ledger/decisions/DEC-20260805-596d71.yaml
    duplication_refresh: coordination/goals/GOAL-SSI-001/batches/BATCH-f68c05/tasks/TASK-20260809-b28c39/duplication_knowledge_audit.md
    catalogue_inputs:
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/S1.md
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/S2.md
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/Q3.md
  scope_and_instance_model:
    problem: A supersingular j-invariant E over F_{p^2} is the instance. The positive target is the classical OneEnd/EndRing
      setting with no published secret torsion images, SQIsign transcript, or CSIDH secret. SIDH/SIKE torsion-image recovery
      remains out of scope.
    vertex_set: V_p is the canonically encoded set of supersingular j-invariants in the declared representation. All set cardinalities
      below count distinct vertices after duplicate rejection; no estimate silently replaces a finite set by p when the distinction
      affects a control.
    advice_witness: For each prime p, A_p is fixed before the instance E is selected. A_p may depend on p but not on E, and
      it is not regenerated per query. The quantifier under review is therefore forall p exists fixed A_p forall E in V_p,
      with all query randomness conditioned on that fixed A_p.
    query_scope: T_q is a bounded worst-case expected query cost in integer field-operation equivalents (FOE) after the fixed
      advice A_p, vertex manifest, manifest digest, builder seed, and branch index are committed. Each target has at most
      A_max=32768 attempts; each attempt has L_steps=1048576 graph steps. Let W be the exact integer trace cost of one attempt,
      including lookup, parse, validation, manifest/index access, walks, pullback, saturation, serialization, and output conversion.
      Let q(A_p,E) be the per-attempt probability of an admissible explicit non-scalar OneEnd output. If q=0 then T_q(A_p,E)=infinity;
      otherwise T_q(A_p,E)=E_omega[W(A_p,E;omega)]/q(A_p,E), with the hard attempt cap reported separately. T_q(A_p)=max_E
      T_q(A_p,E). A finite run may not silently replace the worst-case maximum with an average.
    amortization: For Q independent instances using the same fixed A_p, total cost is T_setup(A_p)+sum_i T_q(A_p,E_i), and
      is bounded above by T_setup(A_p)+Q*T_q(A_p); equality is reported only when every E_i attains the maximum. T_setup includes
      manifest and order-helper setup. The amortized upper bound is T_q(A_p)+T_setup(A_p)/Q. Q is explicit and break-even
      uses exact rational comparison.
  exact_parameterization:
    security_level_labels_bits:
    - 256
    - 512
    prime_instances:
    - label: SQISign-I
      p_expression: 5*2^248-1
      exact_bit_length: 251
      log2_expression: log2(5)+248
      security_level_label_bits: 256
      source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:248
    - label: SQISign-V
      p_expression: 27*2^500-1
      exact_bit_length: 505
      log2_expression: log2(27)+500
      security_level_label_bits: 512
      source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:248
    fp2_encoding:
      defining_relation: u^2+1=0 over F_p; both declared p values are 3 mod 4
      basis_order:
      - 1
      - u
      coefficient_order:
      - j_0
      - j_1
      field_element: j_0+j_1*u with canonical unsigned little-endian coefficients in [0,p-1]
      encoding_version: '0x01'
      field_bytes: 'b_p=ceil(exact_bit_length/8): 32 for SQISign-I, 64 for SQISign-V'
      reduction: reduce each coefficient modulo p before serialization; reject noncanonical input
    vertex_encoding:
      curve_id: encoding_version(1)||j_0(b_p)||j_1(b_p)
      curve_id_bytes: 'b_curve=1+2*b_p: 65 for SQISign-I, 129 for SQISign-V'
      vertex_order: lexicographic byte order on curve_id
      supersingular_predicate: 'SSJ-ENUM-v1: evaluate the exact Deuring supersingular polynomial S_p(X) over F_{p^2}'
      enumeration: exhaustively enumerate all j_0,j_1 in [0,p-1], retain exactly SSJ-ENUM-v1 roots, sort by curve_id
      manifest:
        format: SSJ-MANIFEST-v1 canonical binary manifest; JSON is a human-readable projection only
        header: manifest_version(1=0x01)||p_code(1)||p_expression_ascii_len(uint16_le)||p_expression_ascii||S_p_sha256(32)||vertex_count(b_count)
        body: ordered curve_id values, each exactly b_curve bytes in lexicographic curve_id order
        digest: manifest_sha256=SHA256(header||body), committed before builder/query seeds are accepted
        generation: enumerate every (j_0,j_1) in [0,p-1]^2, evaluate exact S_p over F_p^2, retain roots, reject duplicate
          curve_id, sort and serialize
        setup_cost: T_manifest_foe charges enumeration, polynomial evaluation, duplicate rejection, sorting, serialization,
          digest, and validation; M_manifest_bytes=header_bytes+|V_p|*b_curve
        input_boundary: the committed manifest is an explicit input, never free advice; absent, malformed, wrong-digest, or
          wrong-generator manifests stop Stage 0
      membership: binary search in the committed SSJ-MANIFEST-v1 body; absent IDs are invalid; every comparison and digest
        check is charged
      sampling: sample index=SHAKE256(seed_frame||p_code||counter_u64_le) interpreted as an exact integer modulo |V_p|; all
        seed framing is defined in serialization
      auxiliary_manifests:
        order_manifest: ORDER-MANIFEST-v1 stores owner_curve_id, canonical HNF-RIGHT-ROW-v1 order_tag, record digest, and
          generator version in owner_curve_id order; its header/body/digest use the same length-prefixed SSI-BYTES-v1 framing
        c_helper_manifest: C-HELPER-v1 stores endpoint_curve_id, endpoint_slot, pair_key, and middle_factor_code in canonical
          endpoint order; its digest is SHA256 of the framed binary body and its count is A_C
        pair_descriptor: PAIR-DESCRIPTOR-v1 recomputes endpoint order, orientation, endpoint slots, and middle_factor_code from
          the committed helper manifest; it rejects stale or mismatched descriptors
    sigma_grid:
    - label: '0'
      numerator: 0
      denominator: 1
      mode: no_advice_control
    - label: 1/6
      numerator: 1
      denominator: 6
      mode: treatment
    - label: 1/3
      numerator: 1
      denominator: 3
      mode: treatment
    - label: 1/2
      numerator: 1
      denominator: 2
      mode: treatment
    - label: 2/3
      numerator: 2
      denominator: 3
      mode: treatment
    - label: 4/5
      numerator: 4
      denominator: 5
      mode: collision_audit
    - label: '1'
      numerator: 1
      denominator: 1
      mode: full_advice_control
    advice_size: S_req=floor(p^sigma) for treatment rows; S_eff is the retained distinct count in the manifest/index
    incumbent: T_inc_foe(p) is an explicit baseline counter in FOE, supplied before arithmetic; the asymptotic p^(1/3+o(1))
      label is not a FOE value
    arithmetic: exact integer arithmetic for p, bit lengths, floors, counts, widths, and rational labels; decimal log2 values
      are presentation only
    work_accounting:
      unit: FOE
      primitive_costs:
        field_add: 1
        field_mul: 1
        field_square: 1
        field_inv: 1
        byte_read: 1
        byte_compare: 1
        hash_block: 1
        shake_block: 1
        table_probe: 1
        manifest_compare: 1
        graph_step: 1
        hnf_row_op: 1
        saturation_step: 1
        output_encode: 1
      L_steps: 1048576
      attempt_cap: 32768
      restart_cap: hard A_max=32768 attempts per target; attempts are numbered 0..32767 and cap exhaustion is a terminal invalid/infrastructure
        outcome, never a success or negative observation
      counter_widths: H and vertex counts use b_count; attempted/failed/duplicate counts use b_attempt; all reported counters
        are exact integers and overflow is a Stage-0 failure
      seed_derivation: SHAKE256(frame(domain=query,p_code,branch_code,target_curve_id,replicate_u64,instance_u64,attempt_u64))[:32]
      replay_seed_derivation: 'none: replay consumes the identical committed pre-gate event trace and query seed; it does
        not derive a second path or seed'
      setup_cost: T_setup=T_manifest_foe+T_order_helper_foe+T_index_build_foe; manifest and helper setup are never silently
        amortized away
      break_even: Q_break_even is the least positive integer Q satisfying T_setup/Q + T_q <= T_inc under exact rational arithmetic;
        if T_inc<=T_q or either value is undefined, report undefined
    serialization:
      version: SSI-BYTES-v1
      integer_rules:
        u8: one byte, unsigned
        u16: two bytes, unsigned little-endian
        u32: four bytes, unsigned little-endian
        u64: eight bytes, unsigned little-endian; only bounded loop indices and replicate/instance counters may use it
        biguint: uint16_le byte_length followed by canonical unsigned little-endian bytes; zero is length 1 byte 00
        signed_scalar: sign byte 0x00=nonnegative or 0x01=negative followed by fixed-width magnitude bytes
      literal_codes:
        p_code:
          SQISign-I: '0x01'
          SQISign-V: '0x02'
        branch_code:
          A_tagged: '0x01'
          B_tagged: '0x02'
          B_membership: '0x03'
          C_pair: '0x04'
        domain_codes:
          query: '0x10'
          build: '0x11'
          replay: '0x12'
          pair_null: '0x13'
          graph_null: '0x14'
          manifest: '0x15'
      fixed_field_rules: curve_id, owner IDs, endpoint IDs, hash keys, and fixed-width magnitudes use the declared byte widths
        and unsigned little-endian coefficients; no implicit host encoding is allowed
      frame: every SHAKE/hash input is domain_code||p_code||branch_code||length_prefixed_field_1||...||u64 counters in declared
        order; ASCII labels use uint16_le length followed by UTF-8 bytes
      count_widths: b_count=ceil((exact_bit_length+1)/8) for H and vertex counts; b_attempt=ceil((exact_bit_length+20)/8)
        for the 2^20*S_req cap and attempted/failed/duplicate counts; widths are selected per prime before byte accounting
      hashes: SHA256 and SHAKE256 consume exactly the framed bytes above; hex values in reports are display-only and never
        parsed as raw host strings
  advice_representation:
    logical_entry_definition: S_req is the requested logical count. The builder consumes deterministic candidate records,
      rejects malformed, overflowing, duplicate, or noncanonical records, and reports attempted_count, failed_count, duplicate_count,
      retained_count=S_eff, and padding_count. No count is silently replaced by p or |V_p|.
    fixed_quaternion_encoding:
      algebra: B=(-1,-p) with basis [1,i,j,i*j], i^2=-1, j^2=-p, j*i=-i*j
      order_basis: 'HNF-RIGHT-ROW-v1: 4x4 row HNF in the fixed basis, positive pivots, entries above each pivot reduced to
        [0,pivot), rows lexicographically sorted after basis normalization; reject any matrix not satisfying this predicate'
      scalar: 'sign(1 byte: 0x00 nonnegative, 0x01 negative)||magnitude, unsigned little-endian, magnitude width b_mag=2*b_p+5;
        zero magnitude requires sign=0'
      order_tag: order_version(1=0x01)||owner_curve_id(b_curve)||16 signed_scalar values in row-major HNF order
      widths: 'b_mag=2*b_p+5; b_scalar=1+b_mag; b_order=1+b_curve+16*b_scalar: SQISign-I 1186 bytes, SQISign-V 2274 bytes'
      canonicalization: HNF-RIGHT-ROW-v1 plus fixed row order and scalar canonicalization gives one byte string per equivalent
        basis; no later width measurement may change the declared bytes
      overflow: an HNF scalar outside the fixed envelope is a build failure, never truncation, wrapping, tombstone, or null
    common_encoding:
      slot_index: unsigned little-endian slot; b_slot=ceil(log2(max(2,H))/8), with H exact and per-prime width selected before
        accounting
      hash_key: first 16 bytes of SHAKE256(frame(domain=manifest,p_code,branch_code,record_bytes))
      table_capacity: H=2*max(1,S_eff) exact integer; H is encoded as b_count bytes, never uint64
      probe_rule: initial_slot=integer(SHAKE256(hash_key||table_capacity_bytes)[:b_slot]) mod H; subsequent slots are (initial_slot+k)
        mod H for k=0..H-1
      occupancy: 'one byte per slot: 0 empty, 1 retained; immutable build tables contain no tombstone, and any 2 tombstone
        byte is rejected as noncanonical'
      slot_record: occupancy(1)||curve_id(b_curve)||payload_ptr(b_slot)||hash_key(16); payload_ptr indexes the retained-record
        array and is charged on every probe hit
      index_header: index_version(1=0x01)||branch_code(1)||p_code(1)||H(b_count)
      shared_header: shared_version(1=0x01)||hash_domain(16)||attempted_count(b_attempt)||failed_count(b_attempt)||duplicate_count(b_attempt)||padding_count(b_count)
      b_shared: 17+3*b_attempt+b_count bytes, charged once per branch/index; SQISign-I=151, SQISign-V=279
      b_index: (3+b_count)+H*(1+b_curve+b_slot+16) bytes, including the complete declared header, occupancy, curve ID, payload
        pointer, and key
      duplicate_rule: same canonical record_bytes and same branch code is a duplicate; first retained occurrence wins, later
        occurrences increment duplicate_count and do not create a second payload
      failed_rule: malformed, noncanonical, overflow, invalid-manifest, or invalid-owner records increment failed_count and
        never enter the table
    branch_schemas:
      construction_a_order_tagged:
        fields:
        - lookup_curve_id(b_curve)
        - order_tag(b_order)
        entry_bytes: b_A=b_curve+b_order
        shared_bytes: b_shared
        output_contract: lookup slot -> owner order_tag -> EDGE-STREAM-v1 path -> HNF pullback/saturation -> explicit non-scalar
          target witness
      construction_b_order_tagged:
        fields:
        - lookup_curve_id(b_curve)
        - order_tag(b_order)
        entry_bytes: b_B_tagged=b_curve+b_order
        shared_bytes: b_shared
        output_contract: lookup slot -> owner order_tag -> EDGE-STREAM-v1 path -> HNF pullback/saturation -> explicit non-scalar
          target witness
      construction_b_membership_only:
        fields:
        - lookup_curve_id(b_curve)
        - membership_owner_curve_id(b_curve)
        entry_bytes: 2*b_curve
        treatment_invariant: membership_owner_curve_id equals lookup_curve_id for treatment records
        shared_bytes: b_shared
        output_contract: membership hit -> ORDER-MANIFEST-v1 lookup by owner_curve_id -> explicit order -> EDGE-STREAM-v1
          path -> HNF pullback/saturation -> explicit non-scalar target witness
        order_helper_setup: ORDER-MANIFEST-v1 is committed setup input; its digest, binary search, order bytes, and helper
          memory are charged separately, so membership-only does not hide an order witness
      construction_c_pair_entry:
        fields:
        - target_curve_id(b_curve)
        - left_endpoint(b_curve)
        - right_endpoint(b_curve)
        - middle_descriptor(b_middle)
        entry_bytes: b_C=b_curve+2*b_curve+b_middle
        shared_bytes: b_shared
        helper_entry: C_HELPER-v1 endpoint-to-slot table has count A_C and bytes b_curve+b_slot+16; helper memory and probes
          are charged separately
        output_contract: pair slot(s) -> recomputed valid middle descriptor -> both EDGE-STREAM-v1 endpoint paths -> pullback/saturation
          -> explicit non-scalar target witness
    middle_descriptor:
      format: middle_version(1=0x01)||orientation(1)||left_slot(b_slot)||right_slot(b_slot)||middle_factor_code(uint32_le)
      bytes: b_middle=1+1+2*b_slot+4
      endpoint_order: left_endpoint<=right_endpoint by curve_id bytes; orientation is recomputed by PAIR-DESCRIPTOR-v1 after
        any endpoint permutation
      validity: left_slot/right_slot must point to the endpoint records named by the descriptor and middle_factor_code must
        be in the committed helper manifest
    branch_size_mapping:
      construction_a: S_A_req=floor(p^sigma), T_A uses density S_eff/|V_p|
      construction_b: S_B_req=floor(p^(1/2+3*theta/2)); sigma_B=1/2+3*theta/2
      construction_c: S_C_req=floor(p^sigma) pair records plus A_C=ceil(p^(1-sigma/2)) helper records; both axes are explicit
        in T_C and M_C; no C row is comparable to A/B until both are charged
      B_rows:
      - sigma: '0'
        theta: null
        status: not_applicable
        reason: S=0 control
      - sigma: 1/6
        theta: null
        status: not_applicable
        reason: below p^(1/2); no padding
      - sigma: 1/3
        theta: null
        status: not_applicable
        reason: below p^(1/2); no padding
      - sigma: 1/2
        theta: '0'
        status: applicable
      - sigma: 2/3
        theta: 1/9
        status: applicable
      - sigma: 4/5
        theta: 1/5
        status: applicable
      - sigma: '1'
        theta: 1/3
        status: applicable
      C_rows: all sigma labels map through S_C_req and A_C; S=0 is the no-advice control, not a C table
    builder:
      algorithm: SHAKE256(frame(domain=build,p_code,branch_code,counter_u64)) yields candidate bytes; decode, canonicalize,
        validate against SSJ-MANIFEST-v1/ORDER-MANIFEST-v1, reject, and retain until S_req or the exact cap
      attempt_cap: C_attempt=2^20*S_req exact integer; C_attempt uses b_attempt bytes; cap exhaustion is terminal invalid/infrastructure
        and no partial table is evidence
      index_build: construct the exact static linear-probe table from retained records; every hash, probe, collision comparison,
        duplicate, payload pointer, and serialization operation enters T_index_build and b_index
      retained_vs_attempted: S_eff=retained_count; physical table uses exact S_eff and H; attempted, failed, duplicate, retained,
        padding, and cap-exhaustion counts remain distinct
      manifest_setup: Stage 0 requires SSJ-MANIFEST-v1 and ORDER-MANIFEST-v1 digests; T_setup and M_manifest/M_order_helper
        are included in every total-cost row
      order_helper_build: ORDER-MANIFEST-v1 and C-HELPER-v1 generation, canonical sorting, digesting, validation, and peak
        memory are separate setup axes; a branch that needs an absent helper is not executable and cannot emit a row
    physical_memory: M_total_bytes=M_manifest_bytes+M_order_helper_bytes+sum(retained entry bytes)+b_index+b_shared+M_work_bytes;
      all setup terms are reported separately and no external manifest is free
    build_query_axes: T_setup=T_manifest+T_order_helper+T_index_build; T_q is one-attempt expected cost divided by q with
      hard A_max; T_amort uses the worst-case upper bound and exact rational Q comparison
  fiber_and_output_model:
    path_contract:
      direction: all declared paths are directed E(target)->F(record owner/endpoint)
      edge_stream_format: 'EDGE-STREAM-v1: edge_count(uint32_le)||repeated source_curve_id(b_curve)||target_curve_id(b_curve)||degree_class(uint32_le)||orientation(uint8)'
      edge_stream_digest: SHA256(exact EDGE-STREAM-v1 bytes) is a required input field; digest verification, byte reads, and
        per-edge membership/transition checks are charged
      path_input_boundary: the edge stream or EDGE-STREAM-v1 transition certificate is an explicit committed query input;
        its digest, bytes, parse, and validation are charged, and self-contained generation is not claimed by this design-only
        record
      transition_rule: each edge must match the declared source vertex, degree class, orientation, target membership in SSJ-MANIFEST-v1,
        and next-step digest; mismatch terminates the attempt as invalid
      stop_rule: consume at most L_steps edges and at most A_max attempts; success stops only after final output gate, while
        no-hit and invalid streams are counted explicitly
      path_bytes: M_path_bytes=edge_count*(2*b_curve+5)+4; path workspace is included in M_work_bytes and all reads/comparisons/hash
        blocks enter T_q
      pullback: transport the HNF order from F along the reversed validated edge stream using HNF-RIGHT-ROW-v1, saturate by
        the exact degree-product biguint, and normalize before output
      output: emit the normalized HNF as an explicit non-scalar OneEnd witness for target E; reject scalar, noncanonical,
        failed-saturation, missing-owner, or target-mismatch outputs at the final gate
      output_gate: accept iff final witness owner is target E, normalized HNF passes HNF-RIGHT-ROW-v1, and the witness is
        non-scalar; all preceding stages execute on treatment and controls
    charged_fiber: R_t(a;I_branch) is the set of target vertices E for which branch access to retained record a, committed
      indexes/manifests, and a validated EDGE-STREAM-v1 certificate emits an admissible explicit witness within t FOE; certificate
      bytes and setup access are part of the charged path, and abstract membership is not counted
    union_rule: R_t(A;I_branch)=union over retained a in A of R_t(a;I_branch), formed before counting. Shared index bytes
      b_index+b_shared are charged once; retained, attempted, duplicate, and failed records are not interchangeable.
    branch_access:
      A_and_B_tagged: one selected slot per attempt; every probe, parse, owner/order validation, edge-stream byte, HNF operation,
        and output counter is charged
      B_membership: one membership slot, one ORDER-MANIFEST-v1 helper lookup, then terminal order/path/output procedure; helper
        bytes and probes are not hidden
      C_pair: at most two selected pair slots plus the C_HELPER-v1 endpoint lookup; both endpoint paths, middle reconstruction,
        adaptive second-slot choice, and output are charged
    ceiling: fiber comparisons are restricted to these named branches and are not a lower bound for arbitrary advice or a
      theorem about all preprocessing
  heuristic_inventory:
  - id: H-ADV-1-W
    statement: Conditional worst-case-over-E hitting model for a fixed A_p, including its stated mixing, restart, pullback,
      and success-probability charges.
    status: unverified_conditional
    scope: symbolic_named_branches_only
    not_validated_by: random_set_diagnostic
    falsification: Any declared finite test or proof that violates the exact worst-case bound, or any ambiguity between fixed-advice
      and regenerated-advice expectations, invalidates the corresponding row.
  - id: H-ADV-1-R
    statement: Synthetic regular-graph controls use the exact declared transition kernel and random-set first-hit CDF. This
      is not an SSI-curve or prime-field result.
    status: unverified_diagnostic
    scope: random_sets_and_sampled_start_vertices_only
    cannot_establish: H-ADV-1-W
  - id: H-ADV-2
    statement: The declared order-to-curve construction and its validation cost are available under the specified classical
      model.
    status: unverified_conditional
    falsification: A missing construction, failed output-type conversion, or charged cost outside the declared build/query
      axes invalidates that branch.
  - id: H-ADV-3
    statement: The named resolution-fiber growth bound holds for the specified typed branch and not for arbitrary advice encodings.
    status: unverified_conditional
    falsification: A valid closed-list counterexample with the same representation and accounting invalidates only that branch
      and its dependent rows.
  - id: H-ADV-4
    statement: Construction C endpoint pairs satisfy the declared near-uniform pair model after accounting for orientation,
      middle factors, and endpoint correlations.
    status: unverified_conditional
    scope: construction_c_pair_branch_only
    diagnostic_null: Independently generated endpoint pairs matched to the treatment marginals and the same pair-table access
      path.
    falsification: A pre-registered pair-collision or binned-distribution statistic outside its finite-sample tolerance invalidates
      C; it does not invalidate A/B.
  proof_search_map_audit:
    status: refined_for_bounded_closed_list_only
    bottleneck: Growth of the unique, output-producing resolution fiber per typed advice byte and per charged query budget.
    baseline_reproduction: S=0 returns the incumbent; S=p^(1/2) returns the declared MITM balance control; both are known-answer
      controls and not measurements.
    observation_collision: The former A/B collision at (p^(4/5),p^(1/5)) is retained only as a representation-collision audit.
      Order-tagged B and membership-only B are separate branches; no redundancy conclusion is permitted until their bytes
      and build/query charges agree.
    quantifier_order: The formal symbolic quantifier is forall p exists fixed A_p forall E in V_p, with expectation only over
      query randomness. H-ADV-1-R is explicitly weaker and cannot validate H-ADV-1-W.
    method_ceiling: Certify only the named typed branches. The nearby oriented/CSIDH object is a non-gating diagnostic because
      its problem type and frontier are not sufficiently pinned to serve as a method-ceiling proof gate.
    proof_obligations:
    - Construction A build/query charge and H-ADV-2 status
    - Explicit output-producing pullback and saturation cost
    - Unique union fiber R_t(A) with overlap and shared-byte accounting
    - Construction C pair law H-ADV-4 and matched pair null
    - Construction B typed branch mapping at every exact sigma label
    - Composite min-row and monotonicity arithmetic
    - Build cost, break-even Q, and physical byte conversion
  controls:
    seed_commitment:
      seed_bytes: 32
      build_seed: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      query_seed: 202122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f
      random_advice_seed: 404142434445464748494a4b4c4d4e4f505152535455565758595a5b5c5d5e5f
      shuffled_fiber_seed: 606162636465666768696a6b6c6d6e6f707172737475767778797a7b7c7d7e7f
      membership_null_seed: 707172737475767778797a7b7c7d7e7f808182838485868788898a8b8c8d8e8f
      pair_null_seed: 808182838485868788898a8b8c8d8e8f909192939495969798999a9b9c9d9e9f
      graph_null_seed: a0a1a2a3a4a5a6a7a8a9aaabacadaeafb0b1b2b3b4b5b6b7b8b9babbbcbdbebf
      seeds_are: public pre-registered hex values; treatment and control domains are disjoint
      edge_certificate_digest_rule: every committed EDGE-STREAM-v1 certificate is identified by SHA256(exact framed bytes) and
        the digest is included in the paired trace before any final-gate comparison
    path_work_trace_schema:
      fields:
      - trace_version
      - replicate
      - instance
      - attempt
      - event_index
      - target_curve_id
      - branch_code
      - event_code
      - selected_slot
      - probe_count
      - edge_index
      - edge_source
      - edge_target
      - degree_class
      - parse_count
      - validation_count
      - hnf_row_ops
      - saturation_steps
      - output_gate_count
      - total_foe
      - pre_gate_trace_sha256
      total_rule: total_foe=sum of every declared integer event cost; the event list is complete and an absent event or counter
        invalidates the protocol
      seed_rule: query seed is SHAKE256(frame(domain=query,p_code,branch_code,target_curve_id,replicate,instance,attempt))[:32];
        all event bytes are derived from that seed and the committed path certificate
      replay_rule: replay consumes the byte-identical pre-gate event trace and identical query seed, recomputes only the final
        identity/output predicate with the gate mask disabled, and must have the same pre_gate_trace_sha256; no replay seed
        or alternate path exists
    finite_control_plan:
      instances_per_replicate: 4096
      replicates: 8
      total_instances: 32768
      count_field: completed_attempt_count
      paired_query_stream: one row per replicate/instance/attempt with both treatment-path and replay-path traces
      acceptance_arithmetic: exact integer counts and rational ratios; no post-hoc tolerance
      attempt_cap: 32768
      trace_identity_gate: treatment and paired replay must have identical pre-gate event counts, selected slots, probes,
        edge tuples, parse outcomes, HNF operations, and pre_gate_trace_sha256; only final gate outcome may differ
    entries:
    - id: CTRL-S0
      kind: known_answer
      order: before_all_treatment
      forced_result: S_req=0; no advice lookup; use declared T_inc_foe baseline input
      failure_action: terminate_without_treatment_rows
    - id: CTRL-S-P-HARDCODED
      kind: known_answer
      order: before_all_treatment
      forced_result: full SSJ-MANIFEST-v1 and ORDER-MANIFEST-v1 order table is a symbolic corner only; setup bytes/cost remain
        explicit
      singleton_rule: not_applicable only when the manifest cardinality is one
    - id: CTRL-RANDOM-ADVICE-A-TAGGED
      kind: semantic_path_matched_null
      applies_to: construction_a_order_tagged
      order: before_all_treatment
      null_generator: owner_index=next_distinct(index,random_advice_seed,|V_p|) using rejection with a hard |V_p|+1 bound;
        generate a canonical owner order from ORDER-GEN-v1; owner_curve_id!=target is a checked invariant
      path_rule: same lookup, parse, owner validation, EDGE-STREAM-v1 validation, pullback, saturation, and final target gate
        as treatment
      gate: witness_count=0, completed_attempt_count=32768, trace_identity_gate passes, delta_path<=1/64
      singleton_rule: not_applicable when |V_p|<2
    - id: CTRL-RANDOM-ADVICE-B-TAGGED
      kind: semantic_path_matched_null
      applies_to: construction_b_order_tagged
      order: before_all_treatment
      null_generator: same next_distinct owner and canonical owner-order construction as A-tagged; owner mismatch is checked
        before the row is admitted
      path_rule: same typed parser, validation, EDGE-STREAM-v1, pullback, saturation, and output gate
      gate: witness_count=0, completed_attempt_count=32768, trace_identity_gate passes, delta_path<=1/64
      singleton_rule: not_applicable when |V_p|<2
    - id: CTRL-RANDOM-MEMBERSHIP-B
      kind: semantic_path_matched_null
      applies_to: construction_b_membership_only
      order: before_all_treatment
      null_generator: lookup_curve_id is target and membership_owner_curve_id=next_distinct(target_index,membership_null_seed,|V_p|);
        the treatment owner==lookup invariant is explicitly not_applicable to this null, while manifest membership remains
        valid
      path_rule: same membership index, ORDER-MANIFEST-v1 lookup, EDGE-STREAM-v1, pullback, saturation, and final owner gate
      gate: witness_count=0, completed_attempt_count=32768, trace_identity_gate passes, delta_path<=1/64
      singleton_rule: not_applicable when |V_p|<2
    - id: CTRL-SHUFFLED-FIBER
      kind: semantic_path_matched_negative_control
      applies_to:
      - construction_a_order_tagged
      - construction_b_order_tagged
      - construction_b_membership_only
      order: before_all_treatment
      permutation: pi(i)=SHAKE256(frame(domain=pair_null,p_code,branch_code,shuffled_fiber_seed,replicate,i)) mod S_eff with
        rejection to a permutation; |V_p|<2 is not_applicable
      payload_rule: tagged branches regenerate a canonical order for the permuted owner from ORDER-GEN-v1 and charge it; membership
        branches permute only validated owner IDs; no stale payload is accepted
      path_rule: same parser, index, owner validation, EDGE-STREAM-v1, pullback, saturation, and final identity gate
      gate: witness_count=0, completed_attempt_count=32768, trace_identity_gate passes, delta_path<=1/64
    - id: CTRL-C-PAIR-NULL
      kind: semantic_path_matched_null
      applies_to: construction_c_pair_entry
      order: before_all_treatment
      pair_key: SHAKE256(frame(domain=pair_null,p_code,branch_code,target_curve_id,left_endpoint,right_endpoint,middle_descriptor))[:16]
      null_generator: sample treatment-matched left endpoints and apply a keyed permutation to right endpoint indices; for
        every proposed pair run PAIR-DESCRIPTOR-v1 to recompute endpoint order, orientation, left_slot, right_slot, and middle_factor_code,
        rejecting invalid descriptors with a hard rejection cap
      pair_order: left_endpoint<=right_endpoint by curve_id bytes; orientation and slots are recomputed, never copied from
        the treatment row
      statistic: 'per replicate: N_b bins b=0..255 from low byte of pair_key; C_obs=sum_b N_b*(N_b-1)/2; C_iid=n*(n-1)/(2*256);
        report all eight replicates and their predeclared aggregate max'
      sample: n=8192 valid pairs per replicate; invalid proposals count toward the declared rejection budget and do not silently
        reduce n
      tolerance: z_max^2=max_b (N_b-n/256)^2/(n*(1/256)*(255/256))<=36 and (C_obs-C_iid)^2<=131072 per replicate; aggregate
        gate is max over replicates
    - id: CTRL-GRAPH-RANDOM-SET
      kind: non_SSI_synthetic_diagnostic
      order: before_any_SSI_diagnostic
      graph_family: G_N on Z/N with transition kernel P(v,v+d)=1/4 for d in {-2,-1,+1,+2} mod N; duplicate edges are not present
        for N>=5
      exact_sizes:
      - 64
      - 128
      - 256
      target_sets: uniform without replacement at exact S in {1,2,4,8,16}
      starts: uniform vertex from Z/N; first hit at time 0 when start is in the target set
      horizon: 1048576
      censoring: no hit by horizon is time=horizon+1 and retained, not dropped
      reference_cdf: F_N,S(t) is the exact uniform-target-set and uniform-start average of the Markov first-hit CDF for P;
        the recurrence and rational aggregation are recorded with the diagnostic output
      statistic: per target-set replicate compare empirical CDF to F_N,S with D_KS^2<=16/4096; aggregate is max over all declared
        cells
      sample: 1024 independent target sets, 4096 starts per set, 8 replicates; fixed graph_seed and exact set/start derivation
      boundary: synthetic graph only; cannot validate H-ADV-1-W or any SSI curve claim
  pair_and_distribution_diagnostics:
    H-ADV-4_statistic: Construction C is gated only after CTRL-C-PAIR-NULL recomputes valid descriptors under the same pair-table
      access path and passes the per-replicate exact rational gates; a pass is a control result, not a theorem
    H-ADV-1-R_statistic: Use CTRL-GRAPH-RANDOM-SET with its explicit four-step transition kernel, first-hit convention, exact
      reference CDF, per-cell KS gate, and max aggregation; it is a non-SSI diagnostic and cannot validate H-ADV-1-W
  metrics:
    primary:
    - T_manifest, T_order_helper, T_build, T_q, T_amort, and exact Q_break_even for every typed branch at exact sigma labels
    - M_manifest_bytes, M_order_helper_bytes, M_adv_bytes, M_work_bytes, and path-certificate bytes
    - all semantic-null and paired-trace verdicts, including rejection/cap counts
    - unique R_t(A;I_branch) fiber mass with exact shared-index, helper, and branch access charges
    secondary:
    - log2 advice bytes and query-cost exponent at security-level labels 256,512, with exact p bit lengths 251,505 beside
      them
    - Construction C minus A exponent gap under H-ADV-4, explicitly conditional
    - finite-size attempted, retained, duplicate, overflow, padding, saturation, and vertex-manifest counts
    - semantic-null witness counts, completion counts, paired path-cost ratios, and exact tolerances
    - non-gating nearby diagnostic output, if run
  preregistered_prediction:
    quantity: T_min(S)
    formula: min(T_inc, T_branch(A_tagged), T_branch(B_tagged), T_branch(B_membership), T_C_pair)
    prediction_status: conditional_symbolic_input_not_observation
    exact_sigma_labels:
    - '0'
    - 1/6
    - 1/3
    - 1/2
    - 2/3
    - 4/5
    - '1'
    exact_prime_labels:
    - 'SQISign-I: 5*2^248-1 (bit_length 251)'
    - 'SQISign-V: 27*2^500-1 (bit_length 505)'
    random_advice_null: T_inc at every declared S
    construction_c_gap: reported only conditional on H-ADV-4 and the typed pair accounting
  stages:
  - id: stage-0-contract-audit
    purpose: Validate exact labels, canonical framing, count widths, manifest/order-helper digests, typed record widths, index
      probes, path certificate schema, control encodings, quantifier annotations, and proof-map obligations before arithmetic
    method: python3_standard_library_only
    budget_seconds: 1800
    stop_rules:
    - stop on any missing exact encoding or control seed field
    - stop if fixed-A_p and random-set diagnostic scopes are conflated
    - stop if a branch lacks build/query/memory charges
  - id: stage-1-arithmetic
    purpose: If separately approved, emit conditional rows and controls from exact symbolic inputs; no cryptographic graph
      or isogeny computation.
    method: python3_standard_library_only
    budget_seconds: 1800
    budget_memory_gb: 1
    parameters:
      security_level_labels_bits:
      - 256
      - 512
      exact_bit_lengths:
      - 251
      - 505
      sigma_labels:
      - '0'
      - 1/6
      - 1/3
      - 1/2
      - 2/3
      - 4/5
      - '1'
      L_steps: 1048576
    stop_rules:
    - no execution before freeze and Coordinator authorization
    - stop on random-null, S=0, or exact-arithmetic gate failure
    - stop if any row silently drops build, memory, or representation cost
  - id: diagnostic-h-adv
    purpose: Optional toy diagnostic for H-ADV-1-R and H-ADV-4 only, with separately recorded seeds and no transfer to the
      universal symbolic claims.
    method: python3_standard_library_only
    budget_seconds: 600
    budget_memory_gb: 1
    status: not_authorized
  budget:
    wall_clock_seconds_per_run: 4200
    total_cpu_hours: 0.2
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    note: These are prospective task limits only. This successor is not frozen and execution is unauthorized.
  stopping_rules:
  - No stage executes while frozen=false or execution_authorized=false.
  - Commit and verify every branch-specific semantic control, vertex manifest, path-work trace, sample count, statistic, tolerance,
    and seed before any treatment row.
  - Stop at the first exact-prime, exact-bit-length, manifest, schema, semantic-null, output-type, or accounting failure and
    preserve the partial artifact.
  - Any sub-1/3 closed-list row requires independent review-breakthrough at max before promotion.
  invalidation_rules:
  - Change exact primes, exact bit lengths, canonical framing, manifest/order bytes, typed record layouts, path-work schema,
    control seeds, statistics, tolerances, or formula after any observation.
  - Use numpy, Sage, network access, or an isogeny implementation in Stage 0/1.
  - Claim an all-advice lower bound, attack, security result, or exponent move.
  - Treat H-ADV-1-R as validation of H-ADV-1-W.
  - Treat the nearby oriented diagnostic as a method-ceiling proof.
  - Omit manifest/setup, order-helper, duplicate rejection, physical bytes, path-certificate, pullback/saturation, path trace,
    or break-even Q.
  success_criterion: 'If separately approved, frozen, and validly executed: every exact label and typed branch is emitted;
    all build/query/memory axes are complete; S=0 and the matched random-advice null precede treatment; shuffled and C-pair
    null controls pass their declared finite-size gates; and all conditional assumptions remain explicitly attached to their
    rows. This is only a bounded design/accounting result, not attack or security evidence.'
  falsification_criterion: Terminate or invalidate if any exact encoding is missing, fixed-advice and random-set quantifiers
    are conflated, S=0 or the matched random null fails, a semantic-path-equivalent null skips parse/validation/path work,
    C's pair null fails, a closed-list row violates its declared arithmetic, or a required build/memory/output cost is omitted.
    Timeout, crash, unavailable backend, or dependency failure is infrastructure only.
  required_artifacts:
  - Additive correction report with predecessor and review hashes
  - Corrected successor specification and freeze receipt if later frozen
  - Canonical SSJ-MANIFEST-v1 and ORDER-MANIFEST-v1 format/digest commitments
  - Exact typed advice, index, path, and control encoding table
  - Current-corpus catalogue path and duplication/proof/control audit
  - Pre-run control seed/hash commitment if later authorized
  - Machine-readable Stage 0/1 output only if separately authorized
  - Exact command, environment, stdout, stderr, and resource receipt if run
  - Coordinator snapshot before independent review and ledger archive after review
  scale_relevance:
    tier: derivation
    justification: Stage 1 is symbolic standard-library arithmetic and optional diagnostics are explicitly toy/model checks.
      No cryptographic computation occurs and no crypto-scale evidence or security transfer is claimed.
    correspondence: null
  assigned_to: executor
  approved_by: null
