# EXP-NISTBIN-fd4eb9
# Orders of 2 and stable-dimension windows at five NIST degrees.
# Approved by DEC-20261001-b235a3.
experiment:
  id: EXP-NISTBIN-fd4eb9
  hypothesis_id: H-NISTBIN-7f68cc
  source_idea: IDEA-20260922-40003d
  question_id: RQ-NISTBIN-06157b
  version: 1
  title: Stable-subspace dimensions at five NIST degrees
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-b235a3
  objective: >-
    For m in {163, 233, 283, 409, 571}, compute the order of 2 modulo m,
    the stable dimensions k*ord and k*ord+1, and which of those dimensions
    lie in the factor-of-two window of m/t. Reject a nonempty window at
    m = 163.
  inputs:
    cells:
      - {m: 163, t: 7, order: 162, factor_count: 2, inside: []}
      - {m: 233, t: 9, order: 29, factor_count: 9, inside: [29, 30]}
      - {m: 283, t: 9, order: 94, factor_count: 4, inside: []}
      - {m: 409, t: 11, order: 204, factor_count: 3, inside: []}
      - {m: 571, t: 12, order: 114, factor_count: 6, inside: []}
    dimensions:
      163: [0, 1, 162, 163]
      233: [0, 1, 29, 30, 58, 59, 87, 88, 116, 117, 145, 146, 174, 175, 203, 204, 232, 233]
      283: [0, 1, 94, 95, 188, 189, 282, 283]
      409: [0, 1, 204, 205, 408, 409]
      571: [0, 1, 114, 115, 228, 229, 342, 343, 456, 457, 570, 571]
    window_test: 2*d*t >= m and d*t <= 2*m
  controls:
    - >-
      A nonempty inside-window at m = 163 is false. Reporting one
      invalidates the run.
    - >-
      Reporting the m = 233 inside-window as {29} alone is incomplete.
      The table requires {29, 30}.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - m
    - route in {repeated_doubling, divisor_test}
  metrics:
    primary:
      - order_by_m
      - factor_count_by_m
      - dimensions_by_m
      - inside_window_by_m
      - window_163_empty
      - implementations_agree
    secondary:
      - m_is_prime
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Five orders, five dimension sets, and five inside-window sets.
    formula: >-
      ord is the least positive d with 2^d congruent to 1 modulo m.
      factor_count = 1 + (m - 1) / ord. Dimensions are k*ord and
      k*ord + 1 for k = 0, ..., (m - 1) / ord. d is inside when
      2*d*t >= m and d*t <= 2*m.
    source: >-
      IDEA-20260922-40003d claim paragraphs A and B, read 2026-10-01.
      The orders were recomputed in this design session. That computation
      is not a run. The source sentence names dimension 29 at m = 233.
      The same window also contains 30, and this contract requires both.
  scale_relevance:
    tier: toy
    justification: Five modular orders. No curve arithmetic and no transfer to a solving degree.
    correspondence: null
  tail_checks:
    - m = 571 is required. Stopping at m = 409 and still reporting the 571 row is invalid.
  replication:
    seeds: []
    independent_instances: 5
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the m = 163 window is reported nonempty, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The m = 163 inside-window is reported nonempty.
    - A rho count, a factor base, or a solving degree is reported.
  success_criterion: >-
    Both runs agree, the orders are 162, 29, 94, 204, and 114, the factor
    counts are 2, 9, 4, 3, and 6, the dimension lists match the frozen
    table, the inside-windows are empty except {29, 30} at m = 233, and
    each m is reported prime.
  falsification_criterion: >-
    The runs agree, the m = 163 window is empty, and any order, factor
    count, dimension list, inside-window, or primality bit differs from
    the preregistered table.
  required_artifacts:
    - experiments/EXP-NISTBIN-fd4eb9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-NISTBIN-fd4eb9/runs/<RUN-ID>/command.txt
    - experiments/EXP-NISTBIN-fd4eb9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-NISTBIN-fd4eb9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-NISTBIN-fd4eb9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-NISTBIN-fd4eb9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Rho comparisons and orbit-union factor bases.
    - Any claim about the solving degree at m = 233.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
