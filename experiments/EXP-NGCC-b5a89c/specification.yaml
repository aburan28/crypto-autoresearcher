experiment:
  id: EXP-NGCC-b5a89c
  hypothesis_id: H-NGCC-b764c1
  version: 1
  title: >-
    Chinith sign-05-1 reproduction: false-witness signature accepted under
    an unrelated public key
  status: review_required
  objective: >-
    Decide H-NGCC-b764c1 on the official round-1 Chinith package by running
    the published sign-05-1 argument and retaining only a signature that a
    separately compiled verifier accepts under a public key whose secret
    was not given to the signer.
  inputs:
    candidate_id: sign-05
    roster: inputs/ngcc-round1-20260920/candidates.yaml
    package_url: >-
      https://www.niccs.org.cn/niccs/Proposal/Public-Key%20Cryptographic%20Algorithms/Round%201%20candidates/Chinith.zip
    literature_pointer: https://eprint.iacr.org/2026/2266
    finding_id: sign-05-1
    corpus_listing: KN-LIT-05cb38
  controls:
    - >-
      Separate verifier: the process that checks the signature is not the
      process that signed, and it is compiled from the same official sources.
    - >-
      Unrelated target: for each parameter set, target public keys come from
      keygen seeds 0 and 1. The signer does not receive either secret key.
    - >-
      Honest baseline: before the false-witness run, the official signer and
      verifier must accept one honest signature on a known message for seed
      0. Failure is infrastructure, not a falsification.
    - >-
      Wrong-key honest control: the honest signature under seed 0 must be
      rejected under the seed-1 public key. If it is accepted, record that
      observation and do not score it as confirmation of sign-05-1.
    - >-
      Witness check: the witness supplied to the signer is recorded and must
      differ from both target secret keys. A run that signs with a target
      secret is invalid.
  independent_variables:
    - parameter set name, as declared by the official package
    - target keygen seed in {0, 1}
  metrics:
    primary:
      - false_witness_signature_accepted
      - honest_signature_rejected_under_other_key
      - honest_self_test_passed
      - witness_differs_from_both_secrets
    secondary:
      - sign_wall_clock_seconds
      - peak_rss_bytes
  heuristic_under_test: null
  preregistered_prediction:
    quantity: false_witness_signature_accepted
    formula: >-
      For every declared parameter set and both target seeds,
      false_witness_signature_accepted is true,
      witness_differs_from_both_secrets is true,
      honest_self_test_passed is true, and
      honest_signature_rejected_under_other_key is true.
    source: >-
      Saarinen, ePrint 2026/2266, finding sign-05-1, as indexed in
      inputs/ngcc-round1-20260920/paper_mentions.yaml. The prediction was
      written before any run of this experiment.
  scale_relevance:
    tier: crypto
    justification: >-
      The instances are the submitted parameter sets of a round-1
      candidate, not scaled-down toys. No extrapolation beyond those sets
      is claimed.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [0, 1]
    independent_instances: 2
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: null
  stopping_rules:
    - Stop a parameter set after both target seeds have a completed attempt.
    - Stop the experiment after every declared parameter set has been attempted or recorded as unavailable.
    - If sign-05-1 does not identify the false witness, stop and record the run invalid.
    - A timeout or crash stops that attempt and is recorded as infrastructure. It does not falsify the hypothesis.
  invalidation_rules:
    - The signer was given a target secret key.
    - The honest self-test fails before the false-witness run.
    - The honest signature verifies under the other public key and that result is scored as sign-05-1.
    - Submission binaries, object files, or submission build scripts were executed.
  success_criterion: >-
    For every parameter set the official package declares, both target
    public keys accept a signature produced without their secret keys, the
    witness differs from both secrets, the separate verifier is the checker,
    the honest self-test passed, and the honest signature is rejected under
    the other key.
  falsification_criterion: >-
    For some declared parameter set, the separate verifier rejects the
    false-witness signature under both target public keys, the honest
    self-test had passed, and the honest signature was rejected under the
    other key.
  required_artifacts:
    - package sha256 and the parameter-set list, recorded before signing
    - the finding passage that identifies the false witness, with its location
    - per target seed: public-key hash, witness hash, statement that the witness differs from both secrets, message, signature, verifier verdict
    - honest self-test verdict and wrong-key honest-control verdict
    - run manifest with git commit and dirty-tree state
  assigned_to: executor
  approved_by: null
  approval_withheld_because: >-
    The design-experiment skill treats a contract as approved only after
    a snapshot archive commit. This checkout is on branch
    exec/aes-14352a-stage1, and git status in this worktree fails because
    a linked worktree gitdir is missing. Approval waits for a commit on
    an NGCC branch. The fields above are otherwise filled.
