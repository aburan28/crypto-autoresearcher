experiment:
  id: EXP-SEMBIN-db9bc3
  version: 1
  hypothesis_id: H-SEMBIN-4a80f3
  question_id: RQ-SEMBIN-9e8f82
  proposal_id: IDEA-20260913-41c4f0
  goal_ids: [GOAL-SEMBIN-5078bc]
  batch_id: BATCH-SEMBIN-20260913-9d649f
  title: >-
    Write down what Nagao's O(n^{8w+1}) costs. Derive the C_0 lower bound his own
    no-empty-coset parenthesis implies (ARM C, which runs first and can void the
    rest), then charge the bound at the FIPS binary labels with all five absorbed
    terms as named columns, against van Oorschot-Wiener at the Pareto minimum of its
    own curve.
  status: analyzed
  status_history:
    - status: approved
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-d02263
    - status: completed
      at: '2026-09-13'
      by: executor
      run_id: RUN-SEMBIN-251fd3
      note: >-
        Run archived under experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/ by
        TASK-20260913-a10007 (commit a2cdafc67), manifest status completed_valid,
        5.58 s CPU, 119.6 MB peak, escalation trigger (a) raised. Status was left at
        approved on the contract head at the time; completed is recorded here under
        DEC-20260914-537000 so that its from: completed is reachable. The frozen
        protocol below is unchanged.
    - status: analyzed
      at: '2026-09-14'
      by: coordinator
      ref: DEC-20260914-537000
      note: >-
        Evidence record EV-SEMBIN-f4408c composed from REVIEW-SEMBIN-20260913-251fd3
        (TASK-20260913-3b91d0 N1-N4; TASK-20260913-7fb774 blind re-derivation;
        TASK-20260913-f6652f B1/B2 at review-breakthrough max). H-SEMBIN-4a80f3
        approved -> weakened. One contract-wording defect adjudicated there as PD-K:
        the reproduction gate's frozen 1e-3 tolerance is finer than the printed
        precision of 26 of its 107 committed targets; ARM R accepted as passed at the
        targets' printed precision, invalidation rule not triggered. The escalation
        trigger (a) that this contract declared fired and was served at the tier it
        named; trigger (b) did not fire and B2 confirmed it should not have.
  approved_by: coordinator
  approved_at: '2026-09-13'
  approval_decision: DEC-20260913-d02263
  approval_basis: >-
    Standing user authorization of 2026-09-06 ("all is approved. ideas/experiments
    should be always approved") covers the authorization. Protocol readiness is the
    Coordinator's own responsibility and is asserted here: controls, metrics, budgets,
    stopping rules, invalidation rules, artifact paths, dependencies and inference
    policy are all present below, and the handoff TASK-20260913-495fcc is committed.
    Approval to perform work asserts nothing about whether H-SEMBIN-4a80f3 is true.

  objective: >-
    Convert Nagao 2015/984 Theorem 1 from an asymptotic statement with no concrete
    content into a table, and decide H-SEMBIN-4a80f3's three claims. The paper supplies
    nothing to reproduce: eight pages, no tables, no timings, no measurements, and a
    Section 6 warning in the author's own capitalisation that "o(1) has HUGE value" at
    normal input sizes. So the deliverable is not a reproduction but a costing, and its
    honesty rests entirely on which absorbed terms are enumerated and on charging the
    baseline coherently.

  inputs:
    frozen_nagao: inputs/NAGAO-2015-984/paper_fulltext.md
    frozen_nagao_sha256: 337fae555450162e56432ee137d0cb4bb20e2bd901c29f69b38a2f949e913218
    frozen_semaev: inputs/SEMAEV-2015-310/paper_fulltext.md
    frozen_semaev_tables: inputs/SEMAEV-2015-310/tables.yaml
    reproduction_target: >-
      COST-SEMBIN-8d123b as superseded in scope by DEC-20260913-74e208 and corrected by
      CORR-20260913-53739b. The corrected figures are the gate; the uncorrected ones are
      not.
    baseline_charging_correction: EV-SEMBIN-71e5cd O-6 and O-7
    convention_source: CORR-20260913-53739b

  independent_variables:
    n: [163, 233, 283, 409, 571]
    n_note: >-
      The FIPS 186-4 binary curve degrees. n = 163 is included although it is
      deprecated, because a bound this loose is most likely to look best at the
      smallest label and excluding it would flatter the conclusion.
    omega: [2.376, 2.807, 3.0]
    omega_note: >-
      The committed set, unchanged from H-SEMBIN-97ea23 and EXP-SEMBIN-2c40bb. Nagao
      asserts w ~ 2.7, which is inside the set and is NOT a fourth value; it is
      reported as the source's own choice alongside the set.
    C_0: [2, 3, 4, 6, 8, 10, 12, 16]
    C_0_note: >-
      Nagao says only "fix k = C_0 be a small natural number". The range is declared
      here and every cell is reported across all of it; a single C_0 is never selected,
      because selecting one produces whatever answer is wanted (H-SEMBIN-4a80f3 C3).
      Values below the ARM C bound are still computed and are flagged as violating the
      source's own correctness condition rather than dropped.
    metric: [time_only, time_memory_product, area_time_AT, equal_rate_max]
    metric_note: The committed four, unchanged from EXP-SEMBIN-f4a17b.
    monomial_count_reading: [nagao_loose_N_to_the_d, binomial_C_N_plus_d_choose_d]
    monomial_count_note: >-
      Nagao's Lemma 2 charges O(N^{d_F}); the honest count is C(N+4,4). Both are carried
      and neither is privileged, because the difference is a term the source absorbed
      and this experiment exists to un-absorb it.
    characteristic: [2, 3, 5]
    characteristic_note: >-
      p = 3 and 5 are the NEARBY-OBJECT CONTROL, not a second target. Nagao's
      Proposition 2 gives d_F <= 3p+1 there and Theorem 1 gives exponent (6p+2)w+1, both
      from the same formulas as the p = 2 branch.
    d_F: [4, 5]
    d_F_note: >-
      d_F = 5 at p = 2 is the KNOWN-FALSE OBJECT. Nagao's Proposition 5 says 4; charging
      at 5 must raise the cost by the amount the degree ratio predicts. A costing
      insensitive to d_F is not costing this algorithm.

  dependent_variables:
    - >-
      log2 charged cost of Nagao's construction, decomposed into the named terms T1-T5
      of H-SEMBIN-4a80f3 (monomial count, linear-algebra exponent, coset constant,
      inverse yield, memory), reported as a sum and never only as a total
    - log2 charged cost of van Oorschot-Wiener at the Pareto minimum of its own curve
    - signed margin in bits (Nagao minus vOW), positive meaning Nagao is worse
    - crossover n per (omega, C_0, metric, reading), or null with a reason
    - the derived lower bound on C_0 from ARM C, as a function of n and p

  arms:
    - id: ARM C
      name: The C_0 lower bound, from Nagao's own parenthesis
      runs_first: true
      is_a_gate: >-
        YES, BUT NOT A REPRODUCTION GATE -- A PREMISE GATE. If ARM C shows C_0 must grow
        with n, then Theorem 1's "fix k = C_0 a small natural number" is not available
        and every later arm's table is a costing of a parameter regime the source cannot
        use. The later arms still run and are still reported, but under a recorded note
        that their premise is contested by ARM C. ARM C does NOT void them the way a
        failed reproduction gate voids them.
      what: >-
        Derive Pr[every one of m ~ n/C_0 disjoint cosets Fb_i is nonempty] under HEUR-1,
        in closed form, and solve for the C_0 at which it tends to 1. Do the same for
        the stronger condition prod_i #Fb_i ~ p^n that Nagao's yield argument actually
        uses. Report both bounds at each n and p, and report where the declared C_0
        range violates them.
      controls:
        - >-
          EXACT ENUMERATION at small parameters: for p = 2 and n <= 20, k <= 4, build
          F_{2^n}, enumerate the points of a curve of that family, and count how many
          cosets of a random k-dimensional subspace are empty. Compare against the
          binomial/coupon-collector prediction. This is the only part of ARM C that
          touches a curve, it is exact rather than sampled where the enumeration fits,
          and it is what separates HEUR-1 from an assertion.
        - >-
          A NULL: the same count against a uniformly random subset of F_{2^n} of the
          same size as the x-coordinate image, which is what HEUR-1 models the curve as.
          If the curve's coset occupancy differs from the null beyond sampling error,
          HEUR-1's random model is wrong for this object and ARM C's bound must be
          reported as model-dependent.
      deliverable: c0-lower-bound.json, with the closed form, the bound at each (n, p),
        the enumeration counts, the null counts, and the comparison.

    - id: ARM R
      name: Reproduction gate
      runs_second: true
      is_a_gate: >-
        YES, ABSOLUTELY. No cell of any later arm is reported unless ARM R passes. A
        pipeline that cannot reproduce the number it was built for has not been shown to
        compute anything, and a Nagao table from an unvalidated pipeline is worse than
        no table because it reads as a measurement.
      what: >-
        Reproduce COST-SEMBIN-8d123b's Semaev figures as corrected by
        CORR-20260913-53739b, cell for cell, with this experiment's own code. Then
        compute the degenerate slice -- C_0 = k, m = n/k, m! yield restored -- and check
        it returns the same figures, confirming that Semaev's accounting is the exact
        boundary case of Nagao's that H-SEMBIN-4a80f3's baseline_embedding claims.
      tolerance: 1e-3 bits per cell.
      deliverable: reproduction.json

    - id: ARM N
      name: The Nagao cost surface
      what: >-
        The full cross product of the independent variables above, with T1-T5 as
        separate columns and the total as their sum. vOW charged at the Pareto minimum
        of T = W(1/M + 1/w), Mem = 3n max(w, M) -- NOT at a single operating point, and
        specifically not at the 2^30-store/one-processor point EV-SEMBIN-71e5cd O-6
        measured as overcharging by exactly 29.0 bits.
      required_reporting:
        - >-
          Every cell reports its C_0 and whether that C_0 satisfies ARM C's bound.
        - >-
          The C_0 spread and the omega spread at n = 571 are both reported as single
          numbers, so H-SEMBIN-4a80f3 C3 is decided by reading two numbers rather than
          by argument.
        - >-
          Crossovers are reported per (omega, C_0, metric, reading) as a SURFACE. A
          single crossover number is not an acceptable deliverable, per O-9.
      deliverable: cost-surface.json, plus concrete-cost.yaml in this program's
        concrete-cost table format for the p = 2 cells.

    - id: ARM K
      name: Known-false object -- charge at d_F = 5
      what: >-
        Recompute ARM N's p = 2 cells at d_F = 5. The cost must rise, and by the factor
        the degree ratio predicts under each monomial-count reading. Report the observed
        rise beside the predicted one.
      failure_signature: >-
        A cost that does not rise, or rises by an amount unrelated to the degree ratio,
        means the pipeline is not charging the degree bound and every ARM N cell is
        void.
      deliverable: known-false-dF5.json

    - id: ARM P
      name: Nearby-object control -- the odd-characteristic branch
      what: >-
        Run the identical code path at p = 3 and p = 5 and confirm it produces exponent
        (6p+2)w+1 and degree bound 3p+1 from the same formulas, without a
        characteristic-2 special case. Report the exponents and a diff of the code paths
        taken.
      failure_signature: >-
        Producing 8w+1 or d_F = 4 at p = 3 means the characteristic-2 case is hardcoded
        and every p = 2 cell is void.
      deliverable: nearby-object-oddchar.json

    - id: ARM M
      name: Matched nulls -- decompose where any Nagao advantage comes from
      what: >-
        Two nulls at the p = 2 cells. (i) FREE YIELD: inverse yield set to 0 bits, which
        isolates how much of any margin comes from Nagao's O(1)-yield claim. (ii)
        ZERO MEMORY: memory charged as 0, which isolates how much comes from memory
        going uncharged in the source. Report each null's margin beside the real one and
        the difference.
      why_required: >-
        Inventor-protocol "controls before belief": a margin is an artifact until the
        identical measurement has been run against a null of the same shape. The
        free-yield null in particular caught a shared inverted sign convention in the
        earlier round that neither producer implementation could have found
        (validator TASK-20260913-da3982, proves-too-much object 3).
      deliverable: matched-nulls.json

    - id: ARM I
      name: Independent re-implementation of the memory term
      what: >-
        A SECOND, independently written implementation of the memory column alone --
        C(N+4,4) at N = n(m-1) with m = n/C_0 -- written from the statement of the
        quantity and the parameters, without reading ARM N's implementation. Report the
        largest cell-wise disagreement in bits.
      why_required: >-
        Memory is where H-SEMBIN-4a80f3 C2 says this bound dies, so it is the
        load-bearing quantity, and the earlier round established the exact failure mode
        this guards against: TASK-20260913-ec11c4 re-derived the crossover from the
        plan's stated parameters and disagreed (306 against 375) because THE PLAN'S OWN
        PARAMETER BLOCK gave the relation row width where it said variable count.
        Recomputing from the producer's artifacts would have reproduced that faithfully.
      blind_from:
        - the ARM N implementation
        - any ARM N output
      deliverable: independent-memory-term.json

  controls_summary: >-
    ARM C's exact enumeration and its random-subset null; ARM R's reproduction gate and
    degenerate slice; ARM K's known-false degree; ARM P's odd-characteristic nearby
    object; ARM M's free-yield and zero-memory matched nulls; ARM I's blind
    re-implementation of the load-bearing term. Six control mechanisms for three claims.

  metrics:
    primary: signed margin in bits, Nagao minus vOW, per cell
    secondary:
      - crossover n per (omega, C_0, metric, reading), as a surface
      - C_0 spread and omega spread at n = 571, in bits
      - derived C_0 lower bound per (n, p)
      - largest cell-wise ARM I disagreement, in bits
      - ARM R worst cell-wise reproduction error, in bits

  budget:
    wall_clock_seconds: null
    memory_gb: 2
    maximum_runs: 1
    budget_note: >-
      Unbudgeted in wall clock per the standing research-budget instruction and per
      GOAL-SEMBIN-5078bc's ECC status (maximum_batches and total_wall_clock_seconds are
      null). memory_gb is machine protection, not a research budget. The only arm with
      any real cost is ARM C's exact enumeration; everything else is log2 arithmetic
      over a few thousand cells.

  stopping_rules:
    - >-
      ARM C's enumeration stops at the largest (n, k) that fits in the memory cap. An n
      not reached is recorded as a scope limit of the enumeration and NEVER as a
      statement about coset occupancy at that n.
    - >-
      If ARM R fails, stop and report an implementation failure. Do not report ARM N
      cells, do not tune the pipeline until it reproduces, and do not report the failure
      as a finding about Nagao (core rule 5).
    - >-
      ARM I stops when every p = 2 memory cell has an independent value or the
      re-implementer reports that it cannot derive the quantity from the statement
      alone. The second outcome is a finding about the statement and is reported as one.

  invalidation_rules:
    - >-
      ARM R failing beyond 1e-3 bits at any cell invalidates ARMS N, K, P, M and I.
    - >-
      ARM K showing no degree sensitivity invalidates ARM N.
    - >-
      ARM P returning the characteristic-2 exponent or degree at p = 3 invalidates ARM N.
    - >-
      ARM C's enumeration disagreeing with its random-subset null beyond sampling error
      does NOT invalidate anything; it makes ARM C's bound model-dependent and that
      dependence is reported. Localising the defect rather than voiding the arm, because
      a bound whose random model is wrong for this object is still a bound under a stated
      model -- this is the amendment CORR-20260913-bb05b0 correction_2 made to
      EXP-SEMBIN-2c40bb's blunt invalidation rule, applied here at design time.
    - >-
      An ARM I disagreement does NOT invalidate ARM N by itself. It localises to one of
      two named implementations and requires a third derivation to resolve, which is the
      whole point of a blind re-derivation and is what the earlier round's
      TASK-20260913-ec11c4 disagreement should have triggered.

  preregistered_predictions: >-
    P1-P6 of H-SEMBIN-4a80f3, recorded before any arm runs. P2 (a time-only crossover
    exists below n = 571, predicted range [250, 450]) is flagged by the Coordinator as
    the prediction MOST LIKELY TO BE WRONG, and that flag is part of the preregistration
    rather than a hedge added afterwards.

  coordinator_prior: >-
    Recorded before any arm runs, per AGENTS.md. I expect ARM C to be the whole
    experiment. My prior is that the coupon-collector bound forces C_0 = Omega(log n),
    that Theorem 1 is therefore not polynomial as stated, and that this is discoverable
    from Nagao's own parenthesis with no computation at all -- which would make the
    entire cost surface a costing of an unavailable parameter regime. I expect the cost
    surface itself to show Nagao losing to rho at every label under memory charging
    (P3) and, contrary to P2, I expect NO time-only crossover below 571 either, because
    n^{25} at n = 571 is 2^{229} and I suspect the absorbed constants add more than the
    56 bits of headroom to 2^{285}.

    The prediction I most expect to be OVERTURNED is my own reading of ARM C. Nagao is
    not careless -- his Definitions 5 and 6 correct a misunderstanding he attributes to
    "many researchers", which is the mark of someone who has thought about the details
    -- and the parenthesis I am reading as a fatal gap is one he wrote himself, which
    means he considered it and judged it survivable. If ARM C comes back saying constant
    C_0 suffices, that is the more informative result and I want it recorded as
    overturning this prior explicitly.

  artifact_paths:
    - experiments/EXP-SEMBIN-db9bc3/specification.yaml
    - experiments/EXP-SEMBIN-db9bc3/code/
    - experiments/EXP-SEMBIN-db9bc3/runs/

  required_artifacts:
    - c0-lower-bound.json (ARM C)
    - reproduction.json (ARM R)
    - cost-surface.json and concrete-cost.yaml (ARM N)
    - known-false-dF5.json (ARM K)
    - nearby-object-oddchar.json (ARM P)
    - matched-nulls.json (ARM M)
    - independent-memory-term.json (ARM I)
    - raw-result.json, command.txt, environment.json, stdout.log, stderr.log
    - a self-test file exercising every formula against a hand-checked value

  success_criterion: >-
    NOT "Nagao loses". The experiment succeeds if every arm returns a value or a
    recorded reason it could not; ARM R's reproduction gate passes at 1e-3 bits per
    cell; ARM K shows degree sensitivity, ARM P returns the odd-characteristic exponent
    from the shared code path, ARM M reports both nulls, ARM C reports both its closed
    form and its enumeration, and ARM I reports an independent value or states that the
    quantity is not derivable from its statement alone; and each of H-SEMBIN-4a80f3's
    C1, C2 and C3 is decided or explicitly left open with the reason. An outcome in
    which Nagao WINS at some label under some metric is a SUCCESSFUL experiment and
    triggers the review-breakthrough escalation below rather than a rerun.

  falsification_criterion: >-
    C1 is falsified by ARM C deriving that Pr[every coset nonempty] -> 1 at constant
    C_0, or by its exact enumeration finding no empty coset where HEUR-1 predicts one
    with probability bounded away from zero. C2 is falsified by ARM N giving a crossover
    below n = 571 under time_memory_product or area_time_AT for any omega in the
    committed set at any C_0 satisfying ARM C's bound. C3 is falsified by the C_0 spread
    at n = 571 falling below the omega spread, in which case a single-C_0 crossover is
    well defined and must be reported as one rather than as a surface.

    FRAMING FAILURE, declared in advance because the parent round hit exactly this
    (EV-SEMBIN-71e5cd O-9): if the charged cost turns out to depend more strongly on a
    variable this contract holds fixed than on any it varies, then the deliverable is a
    surface over that variable too and this contract's framing is wrong even where its
    direction is right. Report it as an unmet preregistered deliverable, not as an
    omission.

    NOT falsification: a failed ARM R, which voids the run as an implementation failure
    and says nothing about Nagao (core rule 5); an unreached ARM C enumeration cell,
    which is a scope limit; or an ARM I disagreement, which localises to one of two
    named implementations and requires a third derivation.

  claim_tier_and_review:
    default: >-
      review-adversarial. A conditional cost table showing an asymptotic bound has no
      content at deployed parameters is an ordinary scoped result.
    escalation: >-
      review-breakthrough at max effort, non-degradable, under core rule 12, if EITHER
      (a) any memory-charging metric gives a crossover below n = 571 -- a claim about a
      standardised curve family -- OR (b) ARM C establishes C_0 = Omega(log n) and the
      run proposes that Theorem 1 is non-polynomial as stated, which is a contradiction
      of a published result.
    scope_statement_required: >-
      Every deliverable carries an explicit affected-versus-safe statement. The expected
      content is that no standardised curve is affected, and it must be stated as a
      conclusion with its table rather than as a reassurance.

  dependencies: []
  dependencies_note: >-
    None. This contract is deliberately free of IMP-SEMBIN-ENGINE and of
    TASK-20260913-701b50: no Groebner engine, no Weil descent, no algebra beyond exact
    finite-field enumeration at n <= 20 in ARM C. Its sibling proposal
    IDEA-20260913-352163 does depend on the descent and is designed but not dispatched.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
