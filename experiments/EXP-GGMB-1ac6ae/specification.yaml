experiment:
  id: EXP-GGMB-1ac6ae
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5ddd98
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE ADJUDICATOR''S CONTROL CATALOGUE AND THE EMPTINESS OBSERVATION: a four-quadrant two-directional
    control set for the L12 instrument, whose most informative entry is the one that does not exist
    -- within the campaign''s declared target family (ordinary, non-anomalous, large embedding degree,
    prime field, prime-order subgroup) I can name NO oracle that is both non-simulable and useful,
    so every in-scope NON-SIMULABLE verdict this lane issues is uncalibrated, and the three available
    positive controls all sit outside the family and each requires a NAMED GLOBAL STRUCTURAL COINCIDENCE
    to exist'
  status: draft
  objective: "(A) WHY A CONTROL CATALOGUE IS NOT OPTIONAL. GOAL-ENDO-001 criterion C4 requires every\
    \ instrument supporting a conclusion to pass both directions of its RQ-INSTR-f8faa0 control: it\
    \ must detect a planted signal and it must reject a matched null. The L12 adjudicator (IDEA-20260807-63056d)\
    \ is an instrument. Without a control set, its verdicts are assertions.\n(B) THE FOUR QUADRANTS.\
    \ An oracle is scored on two axes -- simulable or not, useful or not -- and the catalogue must\
    \ populate all four cells, because an instrument that has only ever seen one cell cannot be shown\
    \ to discriminate.\n  QUADRANT I, SIMULABLE AND USELESS (must return SIM; these are the easy\n\
    \    negatives): the pure group-operation oracle (T_sim = 1); the\n    public-curve-data oracle\
    \ (T_sim = 0); the constant oracle (T_sim = 0);\n    the sham uniform-random-answer oracle (T_sim\
    \ = 0); KN-FIND-b7e091's\n    Oracle D, endomorphism images (T_sim = O(log N)); its Oracle C in\
    \ VERIFY\n    form (T_sim = O(m), Z = 1); the isogeny-transport oracle\n    (IDEA-20260807-d73e83,\
    \ T_sim = 0); the j-invariant and volcano-level\n    oracles (IDEA-20260807-413fcc, T_sim = 0);\
    \ the G x G pairing oracle\n    (IDEA-20260807-569c82, T_sim = 0, and it is literally constant).\n\
    \    ELEVEN entries, all with pre-registered verdicts.\n  QUADRANT II, NON-SIMULABLE AND USELESS\
    \ (must return PUB or PRIV, AND the\n    adjudicator must state why the extra information buys\
    \ nothing): Oracle A,\n    the first-jet oracle -- PRIV, it needs k to evaluate; Oracle B, the\n\
    \    elliptic-net oracle -- PUB, the adversary computes net values itself; the\n    raw x-coordinate\
    \ oracle -- PUB, the adversary holds the coordinates; the\n    arity-1 factor-base membership\
    \ oracle -- PUB, and its best algorithm\n    costs N/(2 sqrt(L)) draws, minimised at exactly rho\n\
    \    (IDEA-20260807-070d03). FOUR entries. THIS QUADRANT IS THE POINT OF THE\n    WHOLE LANE:\
    \ it is populated, it is populated by things the corpus already\n    found, and its existence\
    \ is why \"non-simulable\" is not progress.\n  QUADRANT III, SIMULABLE AND USEFUL: ASSERTED EMPTY\
    \ BY THEOREM. If an\n    oracle is simulable with q*Z = o(N) then Shoup bounds the augmented\n\
    \    algorithm at exponent 1/2, so it cannot be useful. This quadrant's\n    emptiness is not\
    \ an observation, it is the content of the closure, and\n    an adjudicator that ever places an\
    \ oracle here has contradicted itself\n    and is void.\n  QUADRANT IV, NON-SIMULABLE AND USEFUL:\
    \ THE POSITIVE CONTROLS, AND THE\n    SUBJECT OF (C).\n\n(C) THE THREE POSITIVE CONTROLS, AND\
    \ WHAT EACH ONE COSTS TO EXIST.\n  PC1 -- THE ANOMALOUS TRANSFER. On a prime-field curve with\
    \ #E(F_p) = p, the\n    formal-group / p-adic elliptic logarithm maps the order-p subgroup\n \
    \   isomorphically onto (F_p, +) and the ECDLP falls in O(log p) field\n    operations (Semaev;\
    \ Satoh-Araki; Smart -- KN-TECH-033, KN-LIT-087/088/089).\n    Non-simulable: the answer is not\
    \ a function of lambda. Useful: linear\n    time, the most decisive break available. NAMED COINCIDENCE:\
    \ trace exactly\n    1. IN a prime field; OUT of the target family.\n  PC2 -- THE MOV/FREY-RUCK\
    \ TRANSFER. On a supersingular prime-field curve\n    with embedding degree 2, the pairing with\
    \ a distortion map moves the\n    ECDLP into F_{p^2}^* where index calculus is subexponential\n\
    \    (KN-TECH-032, KN-LIT-084/085/086). Non-simulable: the answer lives in a\n    different group.\
    \ Useful: subexponential beats sqrt(N) at small k_emb.\n    NAMED COINCIDENCE: supersingularity,\
    \ giving k_emb <= 6 and a distortion\n    map. IN a prime field; OUT of the target family.\n \
    \ PC3 -- THE SUBFIELD DECOMPOSITION ORACLE, SCOPE-BOUNDARY CONTROL. Over\n    F_{q^n}, the factor\
    \ base {x in F_q} is cut out by n-1 LINEAR conditions\n    after Weil restriction, so the arity-m\
    \ decomposition system is\n    Bezout-controlled and index calculus beats rho (IDEA-20260807-070d03\
    \ (F)).\n    Non-simulable and useful. NAMED COINCIDENCE: the existence of a proper\n    subfield.\
    \ OUT of the prime-field scope entirely, and included precisely\n    to mark that boundary.\n\n\
    (D) THE EMPTINESS OBSERVATION, WHICH IS THIS RECORD'S ACTUAL DELIVERABLE AND WHICH IS STATED AT\
    \ ITS HONEST CONFIDENCE. Within the campaign's declared target family -- prime field, ordinary,\
    \ trace not equal to 1, embedding degree large, prime-order subgroup -- I CAN NAME NO ORACLE THAT\
    \ IS BOTH NON-SIMULABLE AND USEFUL. Every positive control I can construct leaves the family through\
    \ a named coincidence: trace one (PC1), supersingularity (PC2), a proper subfield (PC3). THE CONSEQUENCE\
    \ IS UNCOMFORTABLE AND IS THE REASON TO FILE THIS: the L12 adjudicator has NO IN-SCOPE POSITIVE\
    \ CONTROL, so it cannot distinguish \"we adjudicated correctly and there is nothing here\" from\
    \ \"our adjudication is blind to the thing we are looking for\". Every in-scope NON-SIMULABLE\
    \ verdict this lane issues is therefore uncalibrated in the strict sense, and the honest report\
    \ of an in-scope negative must say so. STATUS OF THIS OBSERVATION: `unverified` in the sense of\
    \ the Idea Generator contract. It rests on a check of this repository's curated corpus plus my\
    \ own recall of the ECDLP literature. I did NOT perform an exhaustive external search. An absence-of-example\
    \ claim from memory is exactly what the novelty discipline forbids being upgraded, and it is recorded\
    \ here at that tier deliberately.\n(E) THE REUSABLE RULE THAT FALLS OUT, AND IT IS THE CAMPAIGN'S\
    \ OWN. KN-TECH-033 already states it for representations: \"representations win exactly when the\
    \ curve supplies a global structural coincidence, and a proposal must name its coincidence.\"\
    \ Generalise it to oracles and make it a mandatory field:\n  EVERY ORACLE PROPOSED IN THIS CAMPAIGN\
    \ MUST NAME ITS COINCIDENCE -- the\n  global structural fact about the curve that makes its answer\
    \ both\n  non-simulable and useful -- or be classified with Quadrant II by default.\nThis is cheap,\
    \ mechanical, and directly falsifiable: it predicts that over the campaign's lifetime the number\
    \ of proposed oracles naming a genuine in-scope coincidence will be zero. One counterexample refutes\
    \ it and would be the campaign's most valuable single object.\n(F) THE TWO-DIRECTIONAL REQUIREMENT,\
    \ STATED AS A GATE. The adjudicator may support NO conclusion until it has: returned the eleven\
    \ Quadrant I verdicts correctly; returned the four Quadrant II verdicts correctly INCLUDING the\
    \ \"why it buys nothing\" statement; and, for each of PC1, PC2, PC3, returned non-simulable AND\
    \ SURFACED THE IMPLEMENTING ALGORITHM AND ITS COST. The last clause is the hard one: an adjudicator\
    \ that labels the Smart-attack oracle PUB and stops has technically classified it and has practically\
    \ called a linear-time break harmless."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'Consumes no resource; it is the calibration of the instrument that decides
    other lanes'' resource claims. Its verdict on the ADMISSIBILITY FILTER itself is the record''s
    sharpest content: the filter passes PC1, PC2 and PC3 -- all three consume genuine non-generic
    resources (R6, R7, R1 respectively) -- and all three are outside the target family. So the filter
    is demonstrably not vacuous, which is worth knowing, and it is demonstrably never yet been passed
    by an in-scope useful oracle, which is worth knowing more.'
  reachability_gate: 'NOT APPLICABLE in the curve-motion sense; no walk is proposed. The analogous
    gate binds sharply, though, and the record states it: PC1 and PC2 require curves that CANNOT BE
    REACHED from a target-family curve by any isogeny, because trace is an isogeny-class invariant
    (T4) -- an ordinary curve of trace t != 1 is in no class containing a trace-one curve, and a supersingular
    curve is in no ordinary class at all. So the positive controls are not merely out of family, they
    are UNREACHABLE from it, which is a stronger and cleaner statement of why they cannot be turned
    into in-scope attacks and is worth recording as the reachability answer for this record.'
  inputs:
    procedure: 'STAGE 0 (zero compute, 2 hours): write the eighteen-row catalogue in the oracle schema;
      attach the three decay parameters with their predicted shapes; write the sham positive control.
      STAGE 1 (toy compute, <= 20 min, HARD GATE): PC1. Search for a trace-one curve at p <= 2^20;
      run the additive transfer; verify the certificate independently; run the same code at t in {2,
      3, 5, 9, 17} and confirm total failure. STAGE 2 (toy compute, <= 20 min, HARD GATE): PC2. Supersingular
      curve over F_p at p <= 2^16 with k_emb = 2; run the transfer; verify the certificate; sweep
      k_emb where feasible. STAGE 3 (shared with IDEA-20260807-070d03 Arm D, no extra compute): PC3
      at n in {1, 2, 3}. STAGE 4 (zero compute): run the adjudicator against the catalogue; score
      18 rows; run the sham control and the corrupted-knowledge-set control. STAGE 5 (zero compute):
      state the emptiness observation at `unverified`, record the enumeration it ranges over, add
      the coincidence field to the oracle schema, and open the external-literature search as a named
      follow-up with its own record.'
    mechanism: "STEP 1 (zero compute) -- WRITE THE CATALOGUE. Fifteen negative/useless rows with pre-registered\
      \ verdicts, three positive-control rows with their coincidences, all in the machine-readable\
      \ oracle schema of IDEA-20260807-63056d Step 2. Freeze it.\nSTEP 2 (zero compute) -- ATTACH\
      \ A DECAY PARAMETER TO EACH POSITIVE CONTROL, which is what turns a control into a test rather\
      \ than a demonstration:\n  PC1 decay: the trace t, over {1, 2, 3, 5, 9, 17}. KN-TECH-033 records\
      \ that\n    the attack does NOT degrade gracefully -- it simply does not apply for\n    t !=\
      \ 1. So the predicted decay is a CLIFF: success at t = 1, complete\n    failure at t = 2. A\
      \ control that shows graceful degradation is measuring\n    something other than the additive\
      \ transfer.\n  PC2 decay: the embedding degree k_emb over {2, 3, 4, 6, 8, 12, ...}. The\n  \
      \  transfer's cost is L_{p^{k_emb}}[1/3, c] and grows subexponentially in\n    k_emb * log p,\
      \ so the predicted decay is SMOOTH and the crossing against\n    0.886*sqrt(N) is a measurable\
      \ point. A cliff here would be wrong for the\n    opposite reason.\n  PC3 decay: the extension\
      \ degree n, over {1, 2, 3, 4}. At n = 1 there is no\n    subfield and the advantage must VANISH\
      \ ENTIRELY -- which is precisely the\n    prime-field case and is the single most important\
      \ rung, because it is the\n    control that tells the campaign its own scope is where the advantage\n\
      \    stops.\nTHE THREE DECAY SHAPES ARE DIFFERENT -- cliff, smooth, vanish-at-n=1 -- and an\
      \ instrument that produces the same shape for all three is not measuring the mechanisms, it\
      \ is measuring itself.\nSTEP 3 (toy compute, <= 45 minutes total) -- INSTANTIATE THE POSITIVE\
      \ CONTROLS AT TOY SCALE. PC1: generate a trace-one curve at p <= 2^20 (findable by search since\
      \ the condition is #E = p) and run the additive transfer; then run the identical code on t =\
      \ 2, 3, 5 curves and confirm complete failure. PC2: generate a supersingular curve over F_p\
      \ with k_emb = 2 at p <= 2^16 and verify the transfer produces a solvable F_{p^2}^* instance.\
      \ PC3: build the subfield factor base over F_{q^2} and confirm the arity-3 decomposition is\
      \ cheaper than over F_p at matched size (this is Arm D of IDEA-20260807-070d03 and should be\
      \ shared, not duplicated).\nSTEP 4 (zero compute) -- RUN THE ADJUDICATOR AGAINST THE FROZEN\
      \ CATALOGUE and record its score: eighteen rows, eighteen verdicts, and for the three positive\
      \ controls whether the implementing algorithm was surfaced.\nSTEP 5 (zero compute) -- STATE\
      \ THE EMPTINESS OBSERVATION AT ITS HONEST TIER, with the corpus check recorded, the external\
      \ search explicitly NOT claimed, and the consequence for every in-scope negative spelled out.\
      \ Add the coincidence-naming field to the campaign's oracle schema.\nSTEP 6 (ongoing, zero compute)\
      \ -- MEASURE THE COINCIDENCE-NAMING PREDICTION: count, over the campaign, how many proposed\
      \ oracles name a genuine in-scope coincidence. Predicted zero; one non-zero is a discovery."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - 'sham positive control (t = 2 pseudo-additive transfer): must land in Quadrant II (blocking)'
  - 'corrupted simulator knowledge set: every Quadrant II entry must collapse to SIM (blocking)'
  - three decay ladders with three DIFFERENT predicted shapes
  - independent certificate verification for PC1 and PC2 recoveries (docs/claims-and-verification.md)
  - 'factored order, largest prime factor, and #E != p recorded per curve except where #E = p is the
    point (PC1), where it is recorded as the deliberate condition (KN-TECH-030, KN-TECH-033)'
  - 'NULL OBJECT (from the proposal): THIS RECORD IS A CONTROL, SO ITS OWN NULL IS A CONTROL-ON-THE-CONTROL,
    AND IT IS MANDATORY. NULL OBJECT: a SHAM POSITIVE CONTROL -- an oracle constructed to look like
    a positive control (non-simulable, exotic, with an impressive-sounding coincidence) but which
    provides no advantage. Concretely: the "trace-two additive transfer oracle", specified by analogy
    to PC1 on a t = 2 curve where the additive structure does not exist. The catalogue must classify
    it in Quadrant II, and an adjudicator that promotes it to Quadrant IV on the strength of its resemblance
    to PC1 is pattern-matching rather than adjudicating. This is the exact failure mode a control
    catalogue invites and it must be tested for. DECAY PARAMETERS: the three of Step 2, with their
    three DIFFERENT predicted shapes (cliff, smooth, vanish-at-n=1). Uniform shapes across the three
    is the artifact tell. SECOND NULL: run the whole catalogue with the simulator knowledge set deliberately
    corrupted (grant the simulator the coordinates of P and Q). Every Quadrant II entry must collapse
    to SIM. If they do not, the adjudicator is not actually using the knowledge set and its Quadrant
    I verdicts are accidental.'
  independent_variables: []
  metrics:
    primary:
    - adjudicator verdict per catalogue row, against the pre-registered verdict
    - PC1 success rate per trace value, with certificates
    - PC2 transferred cost per k_emb, with certificates, against matched rho
    - PC3 advantage per extension degree, including the n = 1 rung
    secondary:
    - sham-control classification and corrupted-knowledge-set outcome
    - the enumeration over which the emptiness observation ranges
  heuristic_under_test: null
  preregistered_prediction:
    quantity: adjudicator score against the frozen eighteen-row catalogue
    formula: 18 of 18 verdict symbols correct, AND the implementing algorithm surfaced for all 3 positive
      controls, AND the sham control classified Quadrant II. Anything less and the adjudicator supports
      no conclusion. Pre-registered.
    source: pre-registered in IDEA-20260807-5ddd98 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - TOY-SCALE ACCIDENTS. At p <= 2^20 a curve can have smooth order and be solvable by Pohlig-Hellman,
    which would make ANY oracle look useful. Every curve's order must be factored and its largest
    prime factor recorded, and PC1's curve must be checked to be trace-one for the right reason.
  - RELAYED-FACT RISK IN PC1 AND PC2. Both rest on technique records whose sources were not read in
    full. Using them as running fixtures with verified certificates converts that risk from silent
    error into a visible test failure, which is the mitigation, but the risk is real and is named.
  - SCOPE LEAKAGE FROM PC3. It is an extension-field control and may never appear in a prime-field
    conclusion. This is the same documentation risk flagged in IDEA-20260807-070d03 and it is the
    most likely way this work gets misquoted.
  - 'EMPTINESS AS COMFORT. An emptiness observation is easy to read as reassurance that the target
    family is safe. It is not: it says the instrument is uncalibrated in scope. The two readings are
    opposite and the record must be written so the second is unavoidable.'
  - PC1's TWO-POINT DECAY LADDER. The trace is an integer, so PC1's decay test has only t = 1 and
    t != 1 -- two points and no gradient. That is a genuine weakness of PC1 as a control and it is
    why PC2, with its smooth ladder, is not optional.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 18 of 18 verdict symbols correct, AND the implementing algorithm surfaced for
    all 3 positive controls, AND the sham control classified Quadrant II. Anything less and the adjudicator
    supports no conclusion. Pre-registered.
  falsification_criterion:
  - PC1 or PC2 cannot be instantiated at toy scale within budget. The adjudicator has no working positive
    control and every negative it produces is uncalibrated. This is an INFRASTRUCTURE outcome under
    AGENTS.md rule 5 and must be reported as "instrument not calibrated", never as "no signal found".
  - PC1 succeeds at t != 1. The implementation is solving by another route and the control is void.
  - The sham positive control is promoted to Quadrant IV. The adjudicator pattern-matches; it is void
    until Q3's artifact requirement is strengthened.
  - Quadrant II entries do NOT collapse to SIM under a corrupted knowledge set. The adjudicator is
    not using the knowledge set and its Quadrant I verdicts are accidental.
  - An in-scope oracle is found that is non-simulable and useful. THE EMPTINESS OBSERVATION IS FALSE,
    which is the best outcome available in this entire lane, and it triggers GOAL-ENDO-001 pause condition
    P3 plus AGENTS.md rule 12 escalation before any record states it.
  - All three decay ladders produce the same shape. The instrument is reading its own structure rather
    than the mechanisms.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
