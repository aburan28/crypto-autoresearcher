experiment:
  id: EXP-SDITH-042f1f
  hypothesis_id: H-SDITH-8eb822
  derived_from_idea: IDEA-20260805-43d6df
  question_id: RQ-SDITH-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The memory-charged information-set-decoding baseline and its re-optimization error - a
    baby-step giant-step anchor gate, free and charged optima over the full tuning grid, a
    latency-exponent sweep reported as a curve, and a forced-zero null at an already-minimal
    parameter set
  objective: >-
    The one uncertainty a run reduces is whether a memory-charged decoding baseline built the
    natural way - charging a published free-memory optimum - is materially wrong, and in which
    direction. A run establishes five things. First, whether the declared square-root access
    charge reproduces this program's own recorded baby-step giant-step full-cost anchor in both
    the exponent and the optimal table size, which is a hard gate that can end the line. Second,
    the free and charged optima over the full tuning grid at three illustrative parameter shapes,
    reported as a whole table rather than a chosen column. Third, the re-optimization error in
    bits at each shape. Fourth, the charged advantage of the memory-bought variant over the simplest
    one, whose SIGN answers the reordering question at this level. Fifth, the whole latency-exponent
    sweep with an explicit monotonicity verdict and any crossing point. No decoding is performed, no
    instance is solved, and no security level is computed.
  what_this_is_not:
    - >-
      Not an attack, not a decoding, not a new algorithm, and not a security level for any scheme.
      It audits a measurement procedure.
    - >-
      Not a statement about any published paper. The re-optimization error is a property of a
      downstream procedure; no published table is accused of committing it.
    - >-
      Not a result about the representation-technique decoding variants. Those are NOT READ and NOT
      MODELLED, and they are precisely where the reordering question actually lives.
    - >-
      Not scoped to any deployed parameter set. The three parameter sets are ILLUSTRATIVE SHAPES;
      no scheme specification is read by this contract.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
      under this contract.
  claim_ceiling:
    tier: cost_model_derivation
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. For the two modelled variants, at the three illustrative shapes,
      under the declared charging models, the free and charged optima sit at stated points, the
      re-optimization error is a stated number of bits, the charged advantage has a stated sign and
      magnitude, and the swept latency exponent produces a stated curve with or without a crossing.
      WHAT DOES NOT FOLLOW. No security level for any scheme; no statement about unmodelled decoding
      variants; no statement about any real parameter set; no accusation against any published table;
      and specifically NOT that full-cost accounting fails to reorder decoding variants in general -
      only that it does not do so for the two variants and three shapes evaluated.
  inputs:
    procedure: >-
      STAGE 0, reading, zero compute, ALLOWED TO FAIL. Attempt to obtain a scheme specification and
      transcribe its parameters with a page reference and hash, and separately attempt to obtain one
      concrete decoding cost table and RECORD WHETHER IT OPTIMIZES UNDER A MEMORY CHARGE. Both are
      allowed to fail; a failed fetch is infrastructure signal recorded as such, never mathematical
      evidence, and the run proceeds on the illustrative shapes alone.
      STAGE 1, seconds, HARD GATE. The baby-step giant-step anchor reproduction under the free model,
      the square-root charge and the cube-root charge, by DIRECT SEARCH over table size at three
      problem sizes. If the square-root charge misses the recorded two-thirds anchor by more than one
      bit in either the cost exponent or the optimal table size, STOP. The model is not usable and
      that is the finding.
      STAGE 2, seconds, ORDERING CONTROL. Compute and COMMIT the entire free-memory table over the
      full tuning grid at all three shapes BEFORE any charged column is computed or looked at.
      STAGE 3, seconds. Compute the charged optima over the same grid under every charging model,
      reporting the full table rather than a chosen column, with time and memory exponents for each.
      STAGE 4, seconds. Compute the re-optimization error at each shape as the charged objective at the
      free minimizer minus the charged objective at the charged minimizer, and the charged and free
      advantage of the memory-bought variant over the simplest one.
      STAGE 5, seconds. The NULL arm: a deliberately constructed parameter set whose FREE optimum is
      already at the minimal list parameter with no merge modulus, where the re-optimization error must
      be EXACTLY zero.
      STAGE 6, seconds. The SECOND POSITIVE CONTROL: a synthetic algorithm whose memory grows
      exponentially at a declared rate, whose charged-minus-free cost must equal a closed-form value
      derived from the declared rate alone.
      STAGE 7, seconds. The GRADED SWEEP: latency exponent over the declared range, reporting the
      charged optimum's list parameter, its memory exponent and the variant gap at each, with an explicit
      monotonicity verdict and any crossing point.
      STAGE 8, seconds. Recompute the re-optimization error under two deliberately different
      Gaussian-elimination cost choices and report both, which is the fidelity heuristic's validation arm.
      STAGE 9, zero compute. Emit the table with every column labelled MEASURED-BY-ENUMERATION or MODELLED,
      every optimistic assumption listed with the DIRECTION of its bias, memory as its own first-class
      column, and an explicit statement that no deployed scheme is evaluated.
    instrument: >-
      Pure Python integer and float arithmetic under experiments/EXP-SDITH-042f1f/driver/. No solver, no
      algebra library, no external dependency; binomial coefficients computed exactly in integers and
      converted to logarithms only at reporting time, so no charged difference is an artifact of floating
      point. Nothing under harness/ is modified. Recorded through harness/runner.py.
    parameters: >-
      Variants: the simplest information-set decoder and the list-based Dumer or Stern decoder only.
      Charging models: free memory; a random access into a store of M cells charged as the square root of
      M; and area-time-squared reported as a SEPARATE column that is never compared against the other two
      as if it were a time. Tuning grid: list parameter even from 2 to 24, merge modulus from 0 to 49.
      Three illustrative parameter shapes spanning a non-binary and a binary regime, exactly as declared in
      the parent proposal. Latency exponent swept over 0, one sixth, one quarter, one third, one half and
      two thirds. Two Gaussian-elimination cost choices. All grids and shapes are frozen at Stage 0.
  controls:
    - >-
      POSITIVE CONTROL, MANDATORY AND BLOCKING - the baby-step giant-step anchor. This program's
      KN-TECH-035 states the full-cost exponent and the optimal table size independently of this contract,
      so the instrument MUST return them. If it does not, the charging code is broken and NO charged
      decoding number may be reported at all.
    - >-
      SECOND POSITIVE CONTROL - a synthetic algorithm with an exponentially growing memory exponent, whose
      charged-minus-free cost has a closed form depending only on the declared growth rate. This checks the
      charging arithmetic itself, independently of any decoding formula.
    - >-
      NULL OBJECT OF THE SAME SHAPE, WITH A FORCED VALUE. A parameter set whose free optimum already sits at
      the minimal list parameter with no merge modulus; there the free and charged optima coincide and the
      re-optimization error must be EXACTLY zero. THIS NULL CAN FAIL: an implementation that adds a memory
      penalty unconditionally, or mis-computes the list size at the minimal parameter, returns nonzero.
    - >-
      GRADED CONTROL with at least three interior points and an explicit monotonicity verdict - the
      latency-exponent sweep. Pre-registered shape: the charged optimum's list parameter, its memory exponent
      and the variant gap are each non-increasing in the latency exponent, and the zero column reproduces the
      free-memory table EXACTLY. A non-monotone point localizes a fault to a specific exponent.
    - >-
      ORDERING CONTROL. The entire free-memory table is computed and committed before any charged column is
      computed or looked at, so no charged number can be tuned toward a desired ranking.
    - >-
      MODEL-CHOICE ROBUSTNESS. The re-optimization error is recomputed under two deliberately different
      Gaussian-elimination cost choices and both are reported, which is the direct validation of the fidelity
      heuristic.
  independent_variables:
    - 'variant: simplest information-set decoder / list-based decoder'
    - 'charging model: free / square-root access latency / area-time-squared'
    - latency exponent, swept over the declared range
    - illustrative parameter shape, three levels
    - tuning parameters, over the declared grid
    - Gaussian-elimination cost choice, two levels
  metrics:
    primary:
      - >-
        Baby-step giant-step anchor reproduction, in bits. Computed as the optimal log table size and the log
        cost found by direct search, each compared against two thirds of the problem exponent, at three sizes.
      - >-
        Free and charged optimal tuning parameters per shape per charging model, as an integer pair. Computed by
        exhaustive enumeration of the declared grid.
      - >-
        Re-optimization error in bits per shape. Computed as the charged objective evaluated at the FREE
        minimizer minus the charged objective at the CHARGED minimizer. Non-negative by construction; its
        magnitude is the deliverable.
      - >-
        Charged advantage of the list-based decoder over the simplest one, in bits, per shape. Its SIGN answers
        the reordering question at this level.
      - >-
        Null-arm re-optimization error, which must be EXACTLY zero.
    secondary:
      - >-
        Log time and log memory exponents at every optimum, free and charged, per shape and model.
      - >-
        The latency-exponent sweep table with the charged list parameter, memory exponent and variant gap at each
        swept value, plus an explicit monotonicity verdict and any crossing point.
      - >-
        The re-optimization error under each of the two Gaussian-elimination cost choices, and their difference.
      - >-
        Second-positive-control residual - measured charged-minus-free cost against its closed form.
      - >-
        Source-provenance record for every transcribed parameter, or a recorded failed-fetch receipt.
      - >-
        Whether any transcribed cost table optimizes under a memory charge, recorded as a boolean with its source.
  heuristic_under_test: HEUR-SDITH-43D-1
  heuristic_under_test_note: >-
    HEUR-SDITH-43D-2, the model-fidelity heuristic, is validated by the SAME run through the two-elimination-cost
    recomputation at Stage 8. The field names the heuristic whose failure would terminate the line.
  preregistered_prediction:
    quantity: >-
      The baby-step giant-step anchor residual in bits; the re-optimization error in bits at each of the three
      illustrative shapes; the movement of the optimal tuning parameters from the free to the charged model; and
      the sign and magnitude of the charged variant gap.
    formula: >-
      Predicted anchor residual within 1.0 bit of two thirds of the problem exponent in both the cost and the
      optimal table size, at all three sizes. Predicted re-optimization error strictly positive - forced by the
      definition of a minimum - and exceeding 3 bits at all three shapes; the parent proposal DERIVED, before any
      run under this contract, the values 9.61, 9.18 and 6.48 bits at its shapes A, B and C, and those derived
      values are the point predictions this run reproduces or refutes. Predicted charged optimum's list parameter
      strictly smaller than the free optimum's wherever the free one exceeds the minimum; the parent derived the
      movements from (4,4) to (2,2), from (4,4) to (2,2), and from (10,34) to (6,22). Predicted charged variant gap
      strictly positive and between 8 and 20 bits; the parent derived 10.28, 12.12 and 18.47. Under the null that
      full cost reorders the variants, the gap is NEGATIVE at some shape, which refutes the prediction and confirms
      the reordering hypothesis.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-43d6df, whose mechanism block derives every value above
      in the proposing session and whose predictions block states them as minimum effects. These are DERIVED
      PREDICTIONS of that record, not measurements of this contract; no run has been executed here.
  scale_relevance:
    tier: cost_model_derivation
    justification: >-
      The parameter shapes are illustrative and chosen to span a non-binary and a binary regime; they are not any
      scheme's parameters, and the parent proposal states plainly that no specification was read. The charging
      model IS validated at genuinely large problem sizes - the baby-step giant-step anchor is checked at
      exponents of 64, 128 and 256 - which is the one place the design reaches relevant scale, and it reaches it
      because the anchor is arithmetic rather than executed. The transfer assumption for the decoding conclusions
      is therefore narrow and explicit: they hold for the shapes evaluated and are silent about real parameters
      and about unmodelled variants.
    correspondence: null
  tail_checks:
    - >-
      Report the full free and charged tables, not the optima alone, so a shallow minimum - where the error is
      real but the ranking is fragile - is visible rather than hidden behind a single point.
    - >-
      Report the charged objective in a neighbourhood of both minimizers, since a re-optimization error computed
      between two points on a nearly flat surface carries a different weight from one on a sharply curved surface.
    - >-
      Report the crossing latency exponent, if the variant gap crosses zero inside the swept range; that single
      number answers the reordering question in a way that does not depend on choosing a model, and its absence
      from the range must be stated as an absence rather than omitted.
    - >-
      Report both Gaussian-elimination variants' errors side by side; a spread above one bit refutes the fidelity
      heuristic and every error figure must then carry that spread.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    replication_note: >-
      The computation is fully deterministic - exhaustive enumeration of a declared grid in exact integer
      arithmetic - so the three instances are a determinism check, not a variance estimate. Any difference across
      instances is an implementation defect and invalidates the run.
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.2
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
    - >-
      STOP at Stage 1 if the square-root charge misses the recorded baby-step giant-step anchor by more than one
      bit. The model is not usable and no charged decoding number is produced. This is the finding, not a failure.
    - >-
      Do not proceed past Stage 0 on extracted or unverified text where a source was required; a failed fetch is
      recorded as such and the run continues on the illustrative shapes only.
    - >-
      Stop at the declared tuning grid and the declared sweep range; neither is extended after a value is seen.
    - >-
      Do NOT model the representation-technique variants under this contract. Doing so is a different experiment
      and requires a different contract, and this stopping rule exists because it is the tempting extension.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative
      result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative mathematical
      evidence. A failed source fetch at Stage 0 is likewise infrastructure.
    - >-
      A run in which any charged column was computed or inspected before the free-memory table was committed is
      invalid_measurement; the ordering control is the only thing preventing a tuned ranking.
    - >-
      A run whose null arm is missing, or whose null arm returns a nonzero re-optimization error, is
      invalid_measurement - the instrument adds a penalty unconditionally and no error figure from it is trustworthy.
    - >-
      A run whose three deterministic instances disagree is invalid_measurement, since the computation is
      deterministic and disagreement is a defect.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new contract; it is
      never a repair of this one.
  success_criterion: >-
    The run is successful when the anchor gate is reported at all three sizes, the full free and charged tables are
    emitted over the declared grid at all three shapes under all charging models, the re-optimization error and the
    charged variant gap are reported per shape, the null arm is reported, the second positive control's residual is
    reported, the latency sweep is emitted with an explicit monotonicity verdict and any crossing point, both
    Gaussian-elimination variants' errors are reported, and every column is labelled with its provenance and its
    optimistic assumptions with their bias directions. Success means a DECIDABLE run. H-SDITH-8eb822 is confirmed
    only if, in addition, the anchor gate passes within one bit, the charged list parameter falls at every
    non-minimal shape, the error exceeds 3 bits everywhere, the charged variant gap is positive everywhere, the
    sweep is monotone, and the null returns exactly zero.
  falsification_criterion:
    - >-
      The square-root charge misses the baby-step giant-step anchor by more than one bit. Limb S1 is FALSE and the
      LINE TERMINATES; this program's charging doctrine and its arithmetic realization disagree, which is the
      reported result and is worth more than any decoding number.
    - >-
      The re-optimization error is under one bit at all three shapes. Limb S3 downgrades from a materially wrong
      procedure to a very slightly wrong one, and the record says so in those words.
    - >-
      The charged optimum's list parameter does not fall below the free optimum's at a non-minimal shape. Limb S2
      and the mechanistic account are FALSE and are withdrawn, even though the error's positivity is forced and
      survives.
    - >-
      The charged variant gap is NEGATIVE at any shape. Limb S4 is FALSE and the reordering hypothesis is CONFIRMED
      at this level. This reverses the hypothesis's headline, requires independent replication before being recorded,
      and sharply raises the priority of modelling the representation-technique variants.
    - >-
      The latency sweep is non-monotone in any reported quantity, or the null arm returns nonzero, or the second
      positive control's residual is not zero to machine precision. INSTRUMENT FAULT, localized to the offending
      point; the run set is invalid rather than negative.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference block, and
      environment.
    - >-
      The committed free-memory table, hashed BEFORE any charged column was computed.
    - >-
      raw-result.json carrying the full grid evaluation at every shape and charging model, not only the optima.
    - >-
      The null-arm and both positive controls' measurements, in the same file as the signal arm.
    - >-
      The latency-exponent sweep table with the monotonicity verdict and any crossing point.
    - >-
      Both Gaussian-elimination variants' re-optimization errors.
    - >-
      Source-provenance records for every transcribed parameter, or explicit failed-fetch receipts.
    - >-
      The deliverable table with every column labelled by provenance, every optimistic assumption listed with the
      DIRECTION of its bias, memory as its own column, and the statement that no deployed scheme is evaluated.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement approval is the USER's gate
      because it authorizes execution and spends compute. This contract is review_required and is NOT approved;
      approved_by is null and execution_authorized is false.
    - >-
      This is a cost-model measurement contract. Its deliverable must be reviewed for measured-versus-modelled
      separation, optimistic-assumption disclosure with bias direction, first-class memory accounting and hidden
      lower-order overhead honesty before any other record cites it.
    - >-
      The anchor gate at Stage 1 is a HARD BLOCKER on every later stage. Approval to run does not authorize
      reporting any charged decoding number if the gate fails.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260805-43d6df
    authored_at: '2026-08-25'
    note: >-
      The charging models, the cost expressions, the tuning grid, the three illustrative shapes, the anchor gate,
      the null with its forced zero, the second positive control, the graded sweep with its pre-registered
      monotonic shape, the ordering control and every derived point prediction come from the parent proposal's
      mechanism, predictions, minimal_test and controls blocks. Every numeric prediction in this contract is
      attributed to that record as a DERIVED PREDICTION of the proposing session, never as a measurement.
      Coordinator additions are the determinism-check framing of replication, the requirement that binomials be
      computed in exact integers, and the explicit prohibition on extending to unmodelled variants within this
      contract. Budgets come from the parent's declared low implementation and negligible compute.
  derivation_gaps:
    - >-
      The representation-technique decoding variants are NOT modelled, and they are exactly where the reordering
      question lives. This contract cannot answer it and must not be cited as having done so. Modelling them is a
      declared successor experiment with its own contract.
    - >-
      No scheme specification is read. The three shapes are illustrative and the contract's conclusions are scoped
      to them; whether they resemble any real parameter set is unknown here.
    - >-
      Whether any published concrete cost table already optimizes under a memory charge is unresolved, and a table
      that did would not exhibit the error at all. Stage 0 attempts to settle it and is allowed to fail.
    - >-
      The choice of the square root as the access-latency exponent is a modelling choice, not a derivation. The
      sweep reports the dependence as a curve and mitigates but does not remove it; a reviewer who rejects the charge
      rejects the magnitude along with it, while the POSITIVITY of the error survives any monotone charge.
    - >-
      The parent proposal discloses that the slack functional and the charging comparison were defined after the
      effect was noticed. That ordering is disclosed rather than hidden; the defence is that the error's sign is
      forced by the definition of a minimum, and the null and graded controls test the instrument rather than the
      observation.
