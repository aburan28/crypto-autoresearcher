# EXP-ECDLP-d20b2d
# Equal-degree arithmetic. No point is counted.
# Approved by DEC-20261003-2b473f.
experiment:
  id: EXP-ECDLP-d20b2d
  hypothesis_id: H-ECDLP-1493e3
  source_idea: IDEA-20261003-5d9e58
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Montgomery degree versus Weierstrass degree
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-2b473f
  objective: >-
    Check the degree gap 0, the product 9, and the nearby gap 0.
  inputs:
    montgomery: 3
    weierstrass: 3
    degree_gap: 0
    degree_product: 9
    degree_sum: 6
    nearby_a: 3
    nearby_b: 3
    nearby_gap: 0
    nearby_product: 9
  controls:
    - >-
      A Montgomery equation has degree 3. A short-Weierstrass
      equation has degree 3. Reporting one of them as degree 4
      drops the match and invalidates the run.
    - >-
      Three minus three is 0. The product of the two degrees is 9.
      Their sum is 6.
    - >-
      Two Montgomery equations each have degree 3. Their gap is 0
      and their product is 9.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {read, subtract}
  metrics:
    primary:
      - degree_gap
      - degree_product
      - nearby_gap
      - implementations_agree
    secondary:
      - degree_sum
      - nearby_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The gap of the two degrees is 0. The product of 3 and 3 is 9.
      The gap of two Montgomery degrees is 0.
    formula: >-
      Subtract 3 from 3. Multiply 3 by 3. Add 3 and 3. Subtract
      3 from 3 again for the nearby pair.
    source: >-
      IDEA-20261003-5d9e58 states the degrees 3 and 3, read
      2026-10-03. The gap, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No point was counted.
  scale_relevance:
    tier: toy
    justification: Two written equation degrees. No transfer to a point count.
    correspondence: null
  tail_checks:
    - The product 9 and the nearby gap 0 are required. A check that stops at the gap 0 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 0 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The Montgomery degree is not 3.
    - The Weierstrass degree is not 3.
    - The gap is not 0.
    - The product is not 9.
    - One degree is reported as 4, or a point is counted.
  success_criterion: >-
    Both runs agree that both degrees are 3, that their gap is 0,
    and that their product is 9.
  falsification_criterion: >-
    The runs agree that the Montgomery degree is computed, and
    that degree is not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-d20b2d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-d20b2d/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-d20b2d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-d20b2d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-d20b2d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-d20b2d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any point count or scalar recovery.
    - Any claim that a degree gap of 0 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
