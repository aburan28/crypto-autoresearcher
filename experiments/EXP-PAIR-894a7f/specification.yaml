# EXP-PAIR-894a7f
# Hilbert class polynomial coefficient heights for fundamental
# discriminants of class number at most 16.
# Frozen before any run. The table is a prediction, not a result.
experiment:
  id: EXP-PAIR-894a7f
  hypothesis_id: H-PAIR-2af76d
  source_idea: IDEA-20261005-3a18d1
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  version: 1
  title: >-
    Spearman correlation of class-polynomial output bits inside
    class number 16
  status: approved
  frozen: true
  designed_at: '2026-10-05'
  approved_by: coordinator
  approval_decision_id: DEC-20261005-e86fbf
  objective: >-
    Rebuild every Hilbert class polynomial in the frozen sample,
    twice, and reproduce the coefficient-bit table, the three
    Spearman correlations, and the quartile ratio.
  inputs:
    interval: [-2000, -3]
    fundamental_rule: >-
      D is negative and congruent to 0 or 1 mod 4. Congruent to
      1 mod 4 means squarefree. Congruent to 0 mod 4 means D/4
      is squarefree and congruent to 2 or 3 mod 4. Under this
      rule -4 is fundamental and -2000 is not.
    class_number_cap: 16
    excluded_from_sample: [-3, -4]
    enumeration_order: >-
      Decreasing D. A row is emitted only when D is fundamental,
      not equal to -3 or -4, and the class number is at most 16.
    row_format: >-
      Four fields separated by tabs: D, class number, max
      coefficient bit length, and their product. Rows are joined
      by a single newline. There is no trailing newline.
    bit_length_rule: >-
      The bit length of the absolute value, and 0 when the
      coefficient is 0. The maximum is taken over every
      coefficient of the monic polynomial, including the leading 1.
    class_number_source: pari qfbclassno
    polynomial_source: Sage hilbert_class_polynomial
    predicted_fundamental_count: 611
    predicted_skipped_class_number: 172
    predicted_sample_size: 437
    predicted_sum_max_bits: 129230
    predicted_sum_output_bits: 1324762
    table_sha256: c428bb004aadcbea4737ce746758db1ef04e9622dc2a0b0fbbcde86be2bf8d4e
    excluded_rows:
      - {D: -3, class_number: 1, max_coeff_bits: 1, output_bits: 1}
      - {D: -4, class_number: 1, max_coeff_bits: 11, output_bits: 11}
    class_number_histogram:
      - {h: 1, count: 7}
      - {h: 2, count: 18}
      - {h: 3, count: 16}
      - {h: 4, count: 54}
      - {h: 5, count: 22}
      - {h: 6, count: 40}
      - {h: 7, count: 18}
      - {h: 8, count: 79}
      - {h: 9, count: 11}
      - {h: 10, count: 35}
      - {h: 11, count: 10}
      - {h: 12, count: 50}
      - {h: 13, count: 10}
      - {h: 14, count: 21}
      - {h: 15, count: 9}
      - {h: 16, count: 37}
    spearman:
      output_bits: '0.616752204791'
      class_number: '0.444241687030'
      max_coeff_bits: '0.757850483701'
      tolerance: '0.000000001'
    quartiles:
      rule: >-
        Sort b(D)/sqrt(|D|) ascending. Take 0-based indices 109,
        218, and 327.
      q1: '8.15368529646991'
      q2: '10.4308504094358'
      q3: '13.0425542769067'
      ratio: '1.59959009977408'
      tolerance: '0.000000001'
  controls:
    - >-
      Two constructions of each H_D, using disjoint CRT prime
      sets, must agree as elements of Z[X] before the row is
      hashed. Disagreement invalidates the sample.
    - >-
      The degree of H_D equals the class number. One mismatch
      invalidates the checksum comparison.
    - >-
      D = -3 and D = -4 are computed and then left out of the
      hash, the correlations, and the quartiles.
    - >-
      The class-number correlation is reported beside the
      product correlation. It is not substituted for it.
  independent_variables:
    - discriminant D in the fundamental sample
  metrics:
    primary:
      - table_sha256
      - spearman_output_bits
      - quartile_ratio
    secondary:
      - spearman_class_number
      - spearman_max_coeff_bits
      - degree_mismatches
  heuristic_under_test: HEUR-CM-HEIGHT-1
  preregistered_prediction:
    quantity: >-
      Sample size 437. Checksum
      c428bb004aadcbea4737ce746758db1ef04e9622dc2a0b0fbbcde86be2bf8d4e.
      Spearman correlations 0.616752204791, 0.444241687030, and
      0.757850483701 for the product, the class number, and the
      coefficient bit length. Quartile ratio 1.59959009977408.
    formula: >-
      c(D) = h(D) * b(D), with b(D) the largest-coefficient bit
      length. Spearman is Pearson on average ranks. Quartiles are
      the type-7 positions named in inputs.
    source: >-
      IDEA-20261005-3a18d1, HEUR-CM-HEIGHT-1, specialized to
      |D| at most 2000 and class number at most 16. The counts
      were computed in the design session and are not a run.
  scale_relevance:
    tier: toy
    justification: >-
      Class number at most 16 and absolute discriminant at most
      2000. No transfer to a cryptographic discriminant.
    correspondence: null
  tail_checks:
    - >-
      The most negative sampled discriminant is -1995. Extending
      past -2000 invalidates the checksum.
    - >-
      The largest class number in the histogram is 16, with 37
      rows. A row of class number 17 invalidates the sample.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: >-
      Deterministic. The second instance is the second CRT
      construction of each H_D, not a second sample.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest covering the whole sample.
    - Do not add a discriminant with absolute value above 2000.
    - Do not score a class number above 16.
  invalidation_rules:
    - The two constructions of some H_D disagree.
    - Some degree differs from the class number.
    - D = -3 or D = -4 is included in the checksum.
    - A timeout, crash, or missing manifest.
  success_criterion: >-
    The manifest is valid. Degree mismatches are 0. The excluded
    rows are (-3, 1, 1) and (-4, 1, 11) for class number and bit
    length. The sample has 437 rows, 172 fundamental discriminants
    are skipped for class number, and 611 fundamental discriminants
    lie in the interval. The sums are 129230 and 1324762. The
    checksum matches. Each Spearman value and the quartile ratio
    agree within 1e-9 of the pre-registered strings.
  falsification_criterion: >-
    The two constructions agree, every degree matches, and the
    Spearman correlation of the product with sqrt of the absolute
    discriminant is at most 0, or the quartile ratio is greater
    than 2. A checksum mismatch under those validity conditions
    fails reproduction and does not meet this criterion.
  required_artifacts:
    - experiments/EXP-PAIR-894a7f/runs/<run-id>/command.txt
    - experiments/EXP-PAIR-894a7f/runs/<run-id>/stdout.txt
    - experiments/EXP-PAIR-894a7f/runs/<run-id>/stderr.txt
    - experiments/EXP-PAIR-894a7f/runs/<run-id>/result.json
  assigned_to: executor
  out_of_scope:
    - The split, inert, truncation, and conductor cells of EXP-PAIR-ef9af7.
    - Any prime bin, including the 16-bit, 20-bit, 24-bit, and 28-bit bins.
    - A pairing value, an embedding degree, or an MOV cost.
    - A discrete logarithm.
    - Editing IDEA-20261005-3a18d1 or H-PAIR-6236da.
