experiment:
  id: EXP-SSI-c9d464
  hypothesis_id: H-SSI-4a0c67
  idea_id: IDEA-20261004-a09dd4
  version: 1
  title: >-
    Toy support and pullback gap between all supersingular j-invariants
    and the F_p-rational subset
  status: approved
  objective: >-
    Decide H-SSI-4a0c67 by enumerating S(p) and O(p) at p = 59, 419, and
    659, checking the identity compiler, and comparing 3-isogeny walks of
    length at most 2 from j = 1728 with and without their kernel transcripts.
  inputs:
    primes: [59, 419, 659]
    base_curve: y^2 = x^3 + x
    start_j: 1728
    degree: 3
    walk_lengths: [0, 1, 2]
    distributions:
      D_ER: uniform on supersingular j-invariants in F_{p^2}
      D_PK: uniform on supersingular j-invariants in F_p
  controls:
    - >-
      Identity: map S(p) to itself. Total variation against the uniform
      distribution on S(p) is 0, and pullback is the identity. Any other
      value invalidates the run.
    - >-
      Structured: walk the 3-isogeny graph of O(p) from j = 1728 for
      lengths 0, 1, and 2, keeping every kernel. Reversal must recover the
      start on every walk.
    - >-
      Negative: delete the kernel transcript. Count endpoints that arise
      from at least two transcripts. The public state is only the endpoint
      j-invariant.
  independent_variables:
    - prime in {59, 419, 659}
    - walk length in {0, 1, 2}
    - transcript kept or deleted
  metrics:
    primary:
      - support_size_S
      - support_size_O
      - identity_total_variation
      - transcribed_pullback_failures
      - deleted_transcript_ambiguous_endpoints
    secondary:
      - total_variation_to_stationary_by_length
      - walk_count_by_length
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      support sizes, identity total variation, transcribed pullback
      failures, and ambiguous endpoints after the transcript is deleted
    formula: >-
      identity_total_variation = 0. transcribed_pullback_failures = 0.
      deleted_transcript_ambiguous_endpoints >= 1. support_size_S >
      support_size_O. The stationary-distance column is reported and is
      not required to be 0.
    source: >-
      H-SSI-4a0c67, specializing IDEA-20261004-a09dd4. No large-prime
      mixing law is being fit.
  scale_relevance:
    tier: toy
    justification: >-
      Each prime has fewer than 60 supersingular j-invariants, and the
      walks have length at most 2. Nothing is claimed at a larger prime.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after the three primes and walk lengths 0, 1, and 2.
    - Do not add primes, degrees, or longer walks.
  invalidation_rules:
    - The identity total variation is not 0.
    - A transcribed walk fails to reverse to j = 1728.
    - A prime's supersingular set is sampled instead of enumerated.
    - A stationary distance is reported as a mixing time for a larger prime.
  success_criterion: >-
    The run is valid, and on every prime the identity total variation is 0,
    transcribed pullback failures are 0, at least one endpoint remains
    ambiguous after the transcript is deleted, and |S(p)| > |O(p)|.
  falsification_criterion: >-
    The run is valid and, on any prime, either |S(p)| = |O(p)| or every
    deleted-transcript endpoint determines the start.
  required_artifacts:
    - experiments/EXP-SSI-c9d464/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-c9d464/runs/<RUN-ID>/cells.json
    - experiments/EXP-SSI-c9d464/runs/<RUN-ID>/stdout.txt
    - experiments/EXP-SSI-c9d464/runs/<RUN-ID>/stderr.txt
  assigned_to: executor
  approved_by: coordinator
  approval:
    decision_id: DEC-20261005-dbff92
    basis: >-
      AGENTS.md standing user authorization of 2026-09-06. This record
      freezes the protocol. It does not launch the executor.
    not_launched_because: >-
      GOAL-SSI-2fa82a next_action still requires the C-star symbolic
      interface. Dispatch of TASK-20261005-2eeff9 waits for a Coordinator
      decision that releases this experiment.
