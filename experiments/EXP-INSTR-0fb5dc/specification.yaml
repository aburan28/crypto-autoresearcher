experiment:
  id: EXP-INSTR-0fb5dc
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-f6137c
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'CLOSURE: three instruments this campaign should not build, each with a named obstruction,
    an argument and forward guidance -- a "true degree of regularity" meter for Semaev systems (no
    ground truth exists, so no planted signal of known size can be constructed), a best-in-class attack-cost
    estimator at any scale where it would matter (its null would have to be a cryptographic-scale
    isogeny class, which is unbuildable), and a single-armed displacement-rank adjudicator (it cannot
    separate the two explanations its own decision record left open)'
  status: draft
  objective: "(A) WHY AN AUDIT LANE OWES A CLOSURE. RQ-INSTR-f8faa0's decision target is that an instrument\
    \ that cannot detect a planted signal cannot support a negative and one that fires on a matched\
    \ null cannot support a positive. That is a CONSTRUCTIBILITY CRITERION, and it can fail in advance:\
    \ for some quantities no planted signal of known size can be constructed even in principle, and\
    \ for others no matched null object exists. Naming those before they are built is the cheapest\
    \ thing this lane can do, and under docs/inventor-protocol.md section 4 a closure needs a named\
    \ obstruction, an argument and forward guidance -- not a count of rejected mechanisms. Three are\
    \ named below and each meets that standard. THIS IS NOT A DECLARATION THAT ANY DIRECTION IS IMPOSSIBLE:\
    \ each closure is scoped to a specific instrument shape and each names what remains open in its\
    \ place.\n(B) CLOSURE 1 -- DO NOT BUILD A \"TRUE DEGREE OF REGULARITY\" METER FOR SEMAEV SYSTEMS.\n\
    \  OBSTRUCTION: definitional non-uniqueness on non-semi-regular systems.\n  ARGUMENT. The degree\
    \ of regularity in the Bardet-Faugere-Salvy sense is\n  defined through the Hilbert series of\
    \ the homogenised ideal UNDER A\n  SEMI-REGULARITY HYPOTHESIS: it is the index of the first non-positive\n\
    \  coefficient of the series a semi-regular system would have. KN-TECH-011\n  records that Semaev\
    \ systems \"are structured (symmetric, sparse) and may not be\n  semi-regular, so measured solving\
    \ degrees can deviate from Hilbert-series\n  predictions\", and KN-TECH-075 records the same caveat\
    \ for the closest external\n  literature: \"Solving degree is not the same as degree of regularity,\
    \ and\n  structured systems routinely violate the semi-regularity assumptions under\n  which the\
    \ latter is computed.\" Off the semi-regular locus the candidate\n  definitions -- the Hilbert-series\
    \ index, the maximum degree in an F5 run, the\n  Castelnuovo-Mumford regularity of the homogenised\
    \ ideal, and the first-fall\n  degree -- separate, and they separate by amounts that are not bounded\
    \ in\n  general. Now apply this lane's own criterion. To validate a d_reg meter one\n  needs a\
    \ family of systems whose TRUE d_reg is known and DIFFERENT by a known\n  amount, so the meter's\
    \ recovery of that difference can be checked. On the\n  semi-regular locus such a family exists\
    \ but is exactly the locus where every\n  definition agrees and no meter is needed. Off it, no\
    \ such family exists,\n  because there is no agreed value to plant. A meter with no constructible\n\
    \  positive control cannot support a negative result, by the lane's own rule; and\n  a meter whose\
    \ null object (a shape-matched random system) is semi-regular\n  while the object of study is\
    \ not will systematically differ from it for\n  reasons that are not about ECDLP, so it cannot\
    \ support a positive either. Both\n  directions fail before a line of code is written.\n  FORWARD\
    \ GUIDANCE, AND IT IS CONCRETE. Three things remain open and are\n  buildable. (i) The SOLVING\
    \ DEGREE for a NAMED monomial order, which is\n  definition-faithful and computable exactly by\
    \ Macaulay rank -- that is\n  IDEA-20260807-899c5e. (ii) The FIRST-FALL DEGREE, likewise a rank\
    \ comparison\n  with no semi-regularity assumption. (iii) The HILBERT-SERIES PREDICTION\n  computed\
    \ from the degrees alone, reported as a PREDICTION rather than as a\n  measurement, with the GAP\
    \ between it and the measured solving degree as the\n  reported quantity. The gap is well defined\
    \ even where d_reg is not, and the\n  gap is exactly the quantity that carries the structural\
    \ information the\n  campaign wants. Additionally, IDEA-20260806-e4f96e's polynomial-calculus\n\
    \  refutation degree is a genuinely solver-independent lower bound, which is a\n  stronger object\
    \ than d_reg and does not need semi-regularity at all.\n\n(C) CLOSURE 2 -- DO NOT BUILD AN ESTIMATOR\
    \ OF min over the class of an ATTACK-COST FUNCTIONAL, AT ANY SCALE WHERE THE ANSWER WOULD MATTER.\n\
    \  OBSTRUCTION: the required null object is a cryptographic-scale isogeny class,\n  which cannot\
    \ be constructed, and the toy-scale surrogate is a different\n  statistical object with no controlled\
    \ extrapolation between them.\n  ARGUMENT, IN THREE LIMBS.\n    Limb 1 -- THE ESTIMAND CHANGES\
    \ WITH THE CLASS SIZE. At toy p the class has\n    of order 100 curves (RUN-ICINV-p4001-a: 138\
    \ in the target class) and is\n    completely enumerated, so min over the class is computed exactly.\
    \ At\n    cryptographic p the class has h(O) of order sqrt(p) curves, so min over the\n    class\
    \ is the minimum of an unobservable population and any estimate of it is\n    an extreme-value\
    \ extrapolation. The exact minimum of 138 values and the\n    left-tail extrapolation of 2^128\
    \ values are not the same quantity, and no\n    amount of toy-scale work turns one into the other.\
    \ AGENTS.md rule 7 forbids\n    presenting the first as evidence about the second.\n    Limb 2\
    \ -- THE NULL CANNOT BE BUILT. This lane's rule requires the identical\n    measurement against\
    \ a matched null object of the same shape. The matched null\n    for \"the minimum over an isogeny\
    \ class at cryptographic p\" is \"the minimum\n    over a matched random set of curves at cryptographic\
    \ p of the same size\",\n    i.e. a set of about sqrt(p) curves, which cannot be enumerated, stored\
    \ or\n    measured. Substituting a small random sample changes the estimand on BOTH\n    sides\
    \ identically only if the left tails of the two populations have the\n    same shape -- which\
    \ is precisely the unknown the instrument was built to\n    settle. The null is circular.\n  \
    \  Limb 3 -- EVEN A CORRECT ESTIMATE WOULD NOT BE AN ATTACK, BY T5. The\n    campaign's own reachability\
    \ gate says a cost-minimising curve is useful only\n    if goodness is common enough to hit by\
    \ random walking or detectable by a\n    local test at each step of a walk; reaching a curve identified\
    \ only by a\n    global address is the vectorization problem, at about sqrt(h), i.e. about\n \
    \   p^{1/4}. So a class minimum that is neither common nor locally detectable\n    buys nothing\
    \ even if measured perfectly. An instrument whose best possible\n    output cannot change any\
    \ conclusion is not worth its null.\n  FORWARD GUIDANCE, AND IT IS SPECIFIC. Three buildable substitutes.\n\
    \    (i) THE CLASS-WIDE DISTRIBUTION, not its minimum: estimate quantiles of C\n    over the class\
    \ by random walking, with the mixing time MEASURED at toy scale\n    rather than assumed from\
    \ the GRH-conditional statement in T5. Quantiles of a\n    sample are estimates of quantiles of\
    \ the population; minima are not.\n    (ii) LOCAL DETECTABILITY, which is T5's own condition (ii)\
    \ and is a\n    yes/no question with a proper null: is there a test evaluable at a single\n  \
    \  curve, in time polynomial in log p, whose value correlates with C? Its null\n    is a shuffled-label\
    \ version of the same test, and both directions are\n    constructible. This is the question that\
    \ actually decides the lane.\n    (iii) AN EXPLICIT EXTREME-VALUE MODEL, if anyone wants the minimum:\
    \ state\n    the tail assumption as a numbered heuristic with a falsification condition\n    and\
    \ a validation route in the style of\n    docs/claims-and-verification.md's heuristic records,\
    \ and report the estimate\n    as conditional on it. That is allowed; what is not allowed is an\
    \ unlabelled\n    extrapolation.\n\n(D) CLOSURE 3 -- DO NOT BUILD A SINGLE-ARMED DISPLACEMENT-RANK\
    \ ADJUDICATOR FOR LANE L5.\n  OBSTRUCTION: the two live explanations differ by a nuisance variable\
    \ that a\n  one-armed measurement holds constant, so no single-arm output can separate\n  them,\
    \ and this is not speculation -- it is the recorded state of\n  DEC-20260727-009.\n  ARGUMENT.\
    \ DEC-20260727-009's instrument_question_disposition records that\n  whether the displacement-rank\
    \ metric measures phi-invariance or the\n  row-insertion bookkeeping is UNADJUDICATED, that arm\
    \ E as frozen was \"a valid\n  EXISTENCE control and a MIS-SPECIFIED COMPARATIVE one, diverging\
    \ by closure\n  convention on an uncontrolled nuisance variable rather than by endomorphism\n\
    \  content\", and that \"no downstream record may call phi_alpha an artifact, and\n  none may\
    \ call it validated.\" THIS RECORD ASSERTS NEITHER, and the closure is\n  about the INSTRUMENT\
    \ SHAPE only: a measurement that emits one alpha per\n  instance, with the closure convention\
    \ not varied and the suppression count not\n  reported, cannot distinguish the two explanations\
    \ no matter how many instances\n  it runs, because they predict the same single number. Running\
    \ more instances\n  of a design that cannot separate two hypotheses is the definition of a\n \
    \ measurement that cannot support either verdict.\n  FORWARD GUIDANCE, AND IT IS ALREADY WRITTEN.\
    \ DEC-20260727-009's next_actions\n  specifies the two-arm design: arm A-prime with the dedup\
    \ and zero-filter\n  disabled, making a sharp pass/fail prediction; and arm E-prime, a phi-free\n\
    \  closure that emits each orbit once and never suppresses, isolating the closure\n  convention\
    \ from endomorphism content; both matching base-row budgets and\n  reporting alpha conditional\
    \ on suppression count, with sha256 of the factor\n  base and of the final row list per cell so\
    \ an alpha is checkable without\n  re-execution. That design is the successor and this closure\
    \ exists to stop a\n  one-armed version being built instead. Note also GOAL-ENDO-001 pause condition\n\
    \  P2: any lane result bearing on H-STR-002 in either direction pauses this\n  campaign until\
    \ DEFER-BATCH009-001 is discharged under GOAL-ECDLP-001, so this\n  campaign is in any case not\
    \ the place to resolve it.\n\n(E) WHAT THIS CLOSURE IS NOT. It is not a claim that d_reg is meaningless,\
    \ that isogeny classes have uniform attack cost, or that displacement rank is an artifact. Each\
    \ closure names an INSTRUMENT SHAPE that cannot be controlled and hands back a substitute that\
    \ can. Under docs/inventor-protocol.md section 7 that is exactly the distinction between a closure\
    \ and a declaration of impossibility."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'An audit of instrument constructibility. No oracle, no algorithm, no resource.
    Closure 2''s Limb 3 CITES the admissibility filter''s downstream analogue -- T5, the reachability
    gate -- as part of the argument, which is the intended use of the filter: killing a lane before
    it costs anything.'
  reachability_gate: 'NOT APPLICABLE AS A MOVEMENT, and stated rather than omitted: this record moves
    between no curves and runs no walk. T5 nonetheless appears INSIDE Closure 2 as the third limb
    of the argument -- an instrument whose best possible output cannot change a conclusion because
    the winning curve is unreachable is not worth its null. That is a use of the gate as a reasoning
    step, not an evasion of it.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write the three closure arguments with quoted citations; run
      the constructibility gate on each; record the bit pairs. STAGE 1 (an hour, and it is the cheapest
      falsifier here): the d_reg definition perturbation path at factor-base size 4. Symbolic Hilbert
      series plus a Macaulay rank profile; four definitions; report where they separate. STAGE 2 (minutes):
      the sample-minimum bias fit on the already-measured p = 4001 class. No new curve work; the values
      exist in RUN-ICINV-p4001-a''s raw-result.json. STAGE 3 (zero compute): the neighbour-distance
      count for each closure. STAGE 4 (zero compute): write the do-not-build list with, for each entry,
      the obstruction, the argument, the neighbour, and the falsifier that was attempted and its result.'
    mechanism: 'STEP 1 -- STATE THE CONSTRUCTIBILITY TEST AS A CONTRACT GATE. For each proposed instrument,
      before implementation: name the planted signal of known size and the matched null object of
      the same shape, or record that one cannot be constructed and why. Two bits and a reason. This
      is a paper exercise costing minutes and it is the gate the three closures below pass through.

      STEP 2 -- WRITE THE THREE CLOSURE ARGUMENTS AS AN ARCHIVED NOTE, with the citations checked:
      KN-TECH-011 and KN-TECH-075 for the semi-regularity caveat, T5 in DECOMPOSITION.md section 3
      for the reachability limb, and DEC-20260727-009''s instrument_question_disposition and next_actions
      for the third, quoted rather than paraphrased.

      STEP 3 -- ATTEMPT TO FALSIFY CLOSURE 1 CHEAPLY AND CONCRETELY. Construct a candidate ground-truth
      family for d_reg: take a system that IS semi-regular by construction (a generic dense system
      of the same degrees), compute its Hilbert-series d_reg symbolically, then perturb it toward
      the Semaev structure in declared steps and record where the four candidate definitions separate.
      If they do NOT separate anywhere along the path to the actual Semaev system, then a ground truth
      does exist along that path, Closure 1 is falsified, and a d_reg meter becomes buildable. This
      is the record''s own falsifier and it is cheap.

      STEP 4 -- ATTEMPT TO FALSIFY CLOSURE 2. Take the completely enumerated class at p = 4001, compute
      the exact minimum of each functional, then compute the minimum of samples of size s for s =
      5, 10, 20, 40, and fit the sample-minimum bias as a function of s. If the bias is well modelled
      by a one-parameter tail law over the whole range, an extreme-value route exists and Closure
      2 weakens to "buildable conditional on a numbered tail heuristic" -- which is what its forward
      guidance (iii) already says. If the fit is poor at toy scale, where the population is fully
      observed, it will not be better where it is not.

      STEP 5 -- RECORD THE RESULT AS A CLOSURE OR A WITHDRAWAL, and in either case name what remains
      open. A withdrawn closure is a better outcome than a closure and this record is written so that
      either is reportable.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - the generic dense system, where all four definitions must agree
  - the first-fall meter, a superficially similar but controllable instrument
  - the exact class minimum at p = 4001, as ground truth for the sample-minimum bias
  - DEC-20260727-009's two-arm design, as Closure 3's constructible neighbour
  - 'NULL OBJECT (from the proposal): MANDATORY, AND FOR A CLOSURE THE NULL IS A NEARBY INSTRUMENT
    THAT IS CONSTRUCTIBLE. For each closure, exhibit a neighbouring instrument that PASSES the constructibility
    test, and show what changed. Closure 1''s neighbour is the solving-degree meter (order named,
    Macaulay rank, planted signal available by appending a redundant high-degree generator, matched
    null available as a shape-matched random system). Closure 2''s neighbour is the class-quantile
    estimator (planted signal available by shifting one class''s values, matched null available as
    a random curve set of the same sample size). Closure 3''s neighbour is the two-arm design of DEC-20260727-009''s
    next_actions. A closure whose neighbour is not constructible either is not a closure about instrument
    shape -- it is a closure about the whole subject, and this record makes no such claim. DECAY PARAMETER:
    the distance from the closed instrument to its neighbour, measured as the number of design changes
    needed. If a closed instrument becomes constructible after ONE change, the closure is about that
    change and must be restated as such rather than as a closure of the instrument. A closure that
    survives no design perturbation is a fatigue report in disguise.'
  independent_variables: []
  metrics:
    primary:
    - the four candidate d_reg values along the perturbation path
    - the separation point and the separation magnitude
    - sample-minimum bias versus s, with the exact minimum
    - neighbour distance in design changes, per closure
    secondary:
    - the two-bit constructibility pair per instrument, with reasons
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of the four candidate d_reg definitions that agree, along the perturbation path
      from a generic dense system to the Semaev system
    formula: 'Four at the generic end, at most three at the Semaev end, with the separation point
      identified. Pre-registered: if all four still agree at the Semaev end, Closure 1 is FALSIFIED,
      a ground truth exists, and a d_reg meter becomes buildable -- which would be a better outcome
      than the closure.'
    source: pre-registered in IDEA-20260807-f6137c before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - FAMILIARITY MASQUERADING AS CONSTRUCTIBILITY. The audit could reject instruments that are merely
    unfamiliar. The observation-collision search against the first-fall meter is the guard, and if
    it fails the method is falsified rather than the individual closure.
  - SCALE-DEPENDENT BITS. Closure 2's obstruction is a function of scale, so the bit pair must be
    recorded per scale. An instrument recorded uncontrollable without a scale is a mis-recorded closure.
  - QUOTING VERSUS PARAPHRASING DEC-20260727-009. That decision constrains what may be said about
    phi_alpha in either direction. Closure 3 must quote and must not characterise, and any paraphrase
    risks becoming the assertion the decision forbids.
  - THE CLOSURE ITSELF BECOMING A LICENCE. A do-not-build list can be misread as permission to stop
    searching, which docs/inventor-protocol.md treats as a failure mode symmetric with overclaiming.
    Each entry therefore carries a constructible neighbour, and an entry without one may not be added.
  - EXTERNAL LITERATURE NOT CHECKED. Stated in novelty_status and repeated here because it is the
    most likely way this record is wrong.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'Four at the generic end, at most three at the Semaev end, with the separation
    point identified. Pre-registered: if all four still agree at the Semaev end, Closure 1 is FALSIFIED,
    a ground truth exists, and a d_reg meter becomes buildable -- which would be a better outcome
    than the closure.'
  falsification_criterion:
  - All four d_reg definitions agree on the Semaev system. Closure 1 is withdrawn and a d_reg meter
    is buildable.
  - The definitions disagree even on the generic dense system. The argument's premise is wrong and
    the closure is restated rather than kept.
  - The sample-minimum bias fits a one-parameter tail law with small residuals. Closure 2 weakens
    to conditional-on-a-heuristic, which its own forward guidance already anticipates.
  - Any closed instrument's constructible neighbour is one design change away. That closure is restated
    as a closure of the change, not of the instrument.
  - A reader finds an external construction of a d_reg ground truth for structured systems. novelty_status
    is already `unverified` for exactly this reason and the record would be superseded rather than
    defended.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-f6137c
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
