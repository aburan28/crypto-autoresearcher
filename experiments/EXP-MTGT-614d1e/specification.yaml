experiment:
  id: EXP-MTGT-614d1e
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-ea3915
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE M-GROUP PREPROCESSING MODEL AND A PROVABLE BUT WORTHLESS SEPARATION: define advice-based
    DLP over M encoded groups of the same order, conjecture the generic bound S*T^2 = Omega~(eps*M*N)
    for M INDEPENDENT encodings, and exhibit an F_p-isogeny class achieving S*T^2 = N*(1+o(1)) for
    all M at once -- a factor-M separation whose entire non-generic content is the statement "these
    encodings are efficiently isomorphic", which is honest, precisely stateable, the first provable
    generic escape anywhere in GOAL-ENDO-001, and of exactly zero attack value against any deployed
    curve'
  status: draft
  objective: "(A) THE MODEL, WRITTEN DOWN BECAUSE THIS PROGRAM HAS NEVER WRITTEN IT DOWN. THE M-GROUP\
    \ PREPROCESSING MODEL. An adversary is given M cyclic groups G_1, ..., G_M, each of prime order\
    \ N, each with a distinguished generator P_i, presented by encodings sigma_i. In an unbounded\
    \ OFFLINE phase it outputs an advice string a of length S bits depending on all M encodings. In\
    \ the ONLINE phase it is given (i, Q) with Q in G_i and must output k with Q = [k]P_i, in T group\
    \ operations, with success probability at least eps. Two instantiations differ only in how the\
    \ encodings are drawn:\n  GENERIC-INDEPENDENT: the sigma_i are M independent uniformly random\n\
    \    injective encodings. This is the natural M-fold lift of the\n    Corrigan-Gibbs--Kogan model\
    \ (KN-LIT-013, KN-TECH-005).\n  ISOGENY-CLASS: G_i = <P_i> subset E_i(F_p) for E_1..E_M in one\
    \ ordinary\n    F_p-isogeny class with prime subgroup order N, and the encodings are the\n   \
    \ actual point representations. Here the sigma_i are NOT independent: an\n    explicit isogeny\
    \ path converts between any two of them in polylog(p)\n    field operations per point.\n\n(B)\
    \ THE CONJECTURED GENERIC BOUND, WITH ITS QUANTIFIER ORDER STATED BECAUSE THAT IS EXACTLY WHERE\
    \ THIS KIND OF CLAIM GOES WRONG.\n  CONJECTURE C1. In GENERIC-INDEPENDENT, any adversary succeeding\
    \ with\n  probability at least eps for a UNIFORMLY RANDOM i AND a uniformly random Q\n  satisfies\
    \ S*T^2 = Omega~(eps*M*N).\n  THE FAILURE MODE THAT MAKES THE QUANTIFIER LOAD-BEARING, RECORDED\
    \ FIRST:\n  an adversary that puts ALL its advice on G_1 and gives up on the rest\n  succeeds\
    \ with probability ~1/M using S*T^2 ~ N. That adversary satisfies\n  S*T^2 = Omega~((1/M)*M*N)\
    \ = Omega~(N), consistent with C1 at eps = 1/M --\n  so C1 is not violated by it, and this is\
    \ the check that C1 is stated\n  correctly rather than being trivially false. The WRONG statement,\
    \ NOT\n  conjectured, is \"for every i, success probability eps on G_i\", which the\n  same adversary\
    \ refutes at once by ignoring the other groups: under that\n  reading the bound would have to\
    \ be per-group and the M would vanish.\n  C1 IS A CONJECTURE OF THIS RECORD. It is not cited,\
    \ it is not in the\n  corpus, and the record's honest position is that it is either (i) already\n\
    \  a corollary of published multi-instance work, (ii) provable by a\n  straightforward extension\
    \ of the compression/presampling argument\n  underlying KN-LIT-013 and its Coretti-Dodis-Guo generalisation,\
    \ or\n  (iii) false. Determining which is the deliverable.\n\n(C) THE CONSTRUCTION, WHICH IS THE\
    \ EASY HALF AND IS ESSENTIALLY ALREADY DONE.\n  THEOREM (conditional on nothing beyond T1). In\
    \ ISOGENY-CLASS, there is an\n  adversary with S = N^{1/3} group elements of advice -- ONE Bernstein-Lange\n\
    \  table on E_1 -- and online time T = 1.77*N^{1/3} group operations plus\n  O(L*ell^3) field\
    \ operations, succeeding with probability ~1 for EVERY i.\n  Proof: pull (P_i, Q_i) back to E_1\
    \ along a precomputed path by the dual\n  isogeny; by T1 the logarithm is unchanged; run the single-curve\
    \ algorithm.\n  This is IDEA-20260807-a127ab Mode B, restated in the model.\n  HENCE S*T^2 = N*(1\
    \ + o(1)) FOR THE WHOLE FAMILY, INDEPENDENT OF M.\n(D) THE SEPARATION, AND ITS EXACT WORTH. If\
    \ C1 holds, the two instantiations are separated by a factor of M in the advice-time product at\
    \ eps = 1: Omega~(M*N) generic versus N*(1+o(1)) structured. The separating resource is R4, and\
    \ its entire content is \"the M encodings are efficiently inter-convertible\". THIS IS A REAL\
    \ SEPARATION AND A CHEAP ONE. It is worth recording for three reasons and no more:\n  (i) It is,\
    \ as far as this record can determine, THE FIRST PROVABLE ESCAPE\n    FROM A GENERIC BOUND ANYWHERE\
    \ IN GOAL-ENDO-001, in a campaign whose\n    admissibility filter has otherwise closed every candidate\
    \ at exponent\n    1/2. A campaign that has closed everything benefits from knowing exactly\n\
    \    what a non-closure looks like, even a worthless one.\n  (ii) It makes the boundary of the\
    \ filter precise: the filter closes uses of\n    phi WITHIN one group; this separation lives entirely\
    \ in the relation\n    BETWEEN groups, and the model is what makes that distinction formal\n \
    \   rather than rhetorical.\n  (iii) It gives the M-curve accounting of IDEA-20260807-a127ab a\
    \ lower-bound\n    counterpart, so that record's \"factor M\" claim can be scored against\n  \
    \  something rather than asserted.\n  IT IS WORTH NOTHING AS AN ATTACK. At M = 1 the separation\
    \ is a factor 1.\n  Deployed systems publish one curve per parameter set, and the audit\n  IDEA-20260807-e41559\
    \ pre-registers the expectation that no two standardised\n  prime-field curves are isogenous.\
    \ The separation is a theorem about a model\n  whose affected set is, on present evidence, empty.\n\
    \n(E) WHAT WOULD MAKE IT INTERESTING, STATED SO THE NEXT SESSION DOES NOT HAVE TO GUESS. The separation\
    \ becomes interesting if and only if some natural cryptographic setting supplies many efficiently-isomorphic\
    \ groups with targets in more than one of them. Candidates worth checking, all [open]: multi-instance\
    \ key-recovery across a protocol family that rotates curve parameters within a class; a setting\
    \ where the adversary can INDUCE the isomorphism (invalid-curve or fault settings -- but those\
    \ reach curves of different order, hence different classes, per IDEA-20260807-e41559 (D)(iii));\
    \ or a non-ECDLP group family with a cheap isomorphism oracle, where the same theorem would apply\
    \ verbatim with no isogeny anywhere. THAT LAST OBSERVATION IS THE RECORD'S MOST USEFUL FORWARD\
    \ POINTER: nothing in section (C) uses elliptic curves. It uses only \"the encodings are efficiently\
    \ inter-convertible\", so the separation is really about isomorphism oracles and the isogeny class\
    \ is one instance of a more general and possibly more interesting phenomenon."
  resource_label: 'R8 primary (the model change: M instances instead of one, with advice charged across
    the family), R4 (the isogeny graph supplies the efficient inter-conversion that breaks encoding
    independence).'
  admissibility: admissible
  admissibility_argument: 'This record exists precisely to make the admissibility question formal.
    The DECOMPOSITION.md section 2 filter closes a lane whose only use of phi is to apply it to points
    of G -- a SINGLE-GROUP criterion. Section (C)''s adversary applies phi-hat to points, so under
    a naive reading it would be closed; and indeed at M = 1 it IS closed, gaining exactly nothing
    (IDEA-20260807-a2fb45 proves the single-instance closure). The escape appears only at M > 1 and
    consists entirely in the fact that a GENERIC adversary handed M independent encodings cannot manufacture
    the conversion between them, while the isogeny-class adversary is handed it. That is a resource
    the generic model demonstrably lacks -- which is what admissibility means -- and it is the R8
    row of the taxonomy ("multi-instance / preprocessing structure: changes the model, not the group")
    read literally. The record''s honesty obligation, which it discharges in section (D), is that
    an admissible resource can still be worthless, and this one is.'
  reachability_gate: 'T5 INSTANTIATED, AND THE ANSWER IS THAT THE GATE IS PAID OFFLINE. The construction
    requires an explicit path from each E_i to the hub E_1 -- SPECIFIED endpoints, hence vectorization,
    hence p^{1/4+o(1)} field operations per curve under heuristic H1 of IDEA-20260807-a127ab, with
    the concrete caveat recorded there that the per-step model decides the verdict at 256 bits. In
    THIS model the gate is comfortable for a structural reason: the M-group model''s offline phase
    is unbounded in the Corrigan-Gibbs--Kogan convention, so path-finding costs nothing at all; and
    under the charged Bernstein-Lange convention it costs M*p^{1/4+o(1)}, dominated by the single
    table build at 1.24*p^{2/3} whenever M < p^{5/12}. The gate therefore does not bind for any M
    in the range where the separation is interesting. Its one binding regime is an ADAPTIVE adversary
    who learns i online and has no precomputed path, where the p^{1/4+o(1)} must be charged to T and
    the separation''s online exponent becomes max(1/3, 1/4) = 1/3 asymptotically but is concretely
    marginal at 256 bits.'
  inputs:
    procedure: 'STAGE 0 (reading, HARD GATE AND THE WHOLE POINT): Step 1''s literature check plus
      Step 2''s quantifier audit. Both cost zero compute. If C1 is published, the record becomes a
      corollary and is worth more, not less. If the quantifier audit refutes C1 as stated, the record
      is superseded before any effort is spent on a proof. STAGE 1 (zero compute): Step 3''s compression
      proof attempt, with the break point recorded if it fails. STAGE 2 (zero compute): Steps 4 and
      5 -- the construction restated in the model and the separation statement with both hypotheses
      listed. STAGE 3 (minutes): Step 7''s toy verification of the CONSTRUCTION only, on one enumerable
      class, plus Step 6''s different-class null and the nu sweep. This is the only compute in the
      record and it tests the easy half.'
    mechanism: 'STEP 1 -- LITERATURE FIRST, BECAUSE C1 MAY ALREADY EXIST. Read KN-LIT-013''s multi-instance
      discussion if it has one; read KN-LIT-5040; search for multi-instance / batch preprocessing
      lower bounds in the generic group model, including the Coretti-Dodis-Guo presampling line named
      in KN-LIT-013 and any time-space tradeoff work for related problems. A positive hit is the BEST
      outcome: it supplies C1 and turns this record into a two-line corollary, which is a cheaper
      and more citable result than proving C1 here. STEP 2 -- THE QUANTIFIER AUDIT, BEFORE ANY PROOF
      ATTEMPT. Write C1 in full with eps, i and Q all quantified explicitly. Check it against the
      two degenerate adversaries: (a) all advice on one group, (b) no advice, pure online. Both must
      be consistent with C1 or C1 is misstated. This audit costs nothing and is where this kind of
      claim usually dies. STEP 3 -- PROOF ATTEMPT BY COMPRESSION. Attempt C1 by the standard route:
      an adversary that succeeds too well with too little advice yields a compression of the M encodings
      below their entropy. The M-fold structure should make the counting straightforward IF the success
      requirement is averaged over i correctly. Record where the argument breaks if it does. STEP
      4 -- THE CONSTRUCTION, RESTATED IN THE MODEL. Import IDEA-20260807-a127ab section (C) Mode B
      and state it as a theorem in the M-group model, with the path-precomputation charged to the
      offline phase and the two isogeny evaluations charged to T. STEP 5 -- THE SEPARATION STATEMENT,
      with both sides'' hypotheses listed. STEP 6 -- THE NEARBY-OBJECT CONTROL, WHICH IS BLOCKING.
      Instantiate the model with M groups of the same order N drawn from DIFFERENT isogeny classes.
      The construction must FAIL (no conversion exists) and the advice must grow with M. If the construction
      appears to work there too, it is not using the isogeny structure and the separation is spurious.
      STEP 7 -- TOY VERIFICATION OF THE CONSTRUCTION ONLY. On an enumerable toy class, build one table
      on E_1, solve targets on every member, and confirm total advice is independent of M while per-target
      time is not. This verifies the construction; it cannot verify C1, which is a lower bound and
      is not testable by measurement.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - different-class instantiation (construction must fail, advice must grow)
  - M = 1 degeneracy (separation factor exactly 1)
  - nu decay sweep between the two instantiations
  - the two degenerate adversaries of Step 2 (all-advice-on-one; no-advice)
  - per-i success requirement enforced, not averaged
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING: THE DIFFERENT-CLASS INSTANTIATION. M
    groups of the same prime order N on M curves in DIFFERENT F_p-isogeny classes, presented identically.
    The section (C) construction must FAIL there -- no path exists, the pullback is unavailable, and
    the advice must grow linearly in M. A construction that appears to succeed on non-isogenous curves
    is not using the resource it claims and the separation is void. SECOND NULL, FOR THE MODEL ITSELF:
    the M = 1 instantiation, where the separation factor must be exactly 1. A model in which the "separation"
    survives at M = 1 has an error in its accounting. DECAY PARAMETER: the fraction nu of the M groups
    that are genuinely in the class, the rest drawn from other classes. Total advice must interpolate
    as S_total ~ N^{1/3} * (1 + (1-nu)*M), i.e. it must GROW as nu falls. Advice that does not grow
    as nu falls means the measurement is not charging advice per group and the run set is void.'
  independent_variables: []
  metrics:
    primary:
    - total advice bits and per-target online cost, per M, per instantiation
    - fitted slope of advice against M, with confidence interval, per arm
    - the written statement of C1 with all quantifiers
    - the Step 1 literature outcome with citations or an explicit "not found"
    secondary:
    - the Step 3 proof or its recorded break point
    - per-i success rates, not averaged
  heuristic_under_test: null
  preregistered_prediction:
    quantity: total advice bits as a function of M, isogeny-class instantiation
    formula: CONSTANT in M up to the O(L*log p) path descriptions, i.e. a fitted slope of advice against
      M indistinguishable from zero, at every tested toy class. A growing slope means the construction
      is not reusing the table and the whole record is wrong.
    source: pre-registered in IDEA-20260807-ea3915 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - AVERAGING VERSUS PER-INSTANCE SUCCESS. The single largest risk. The bound is naturally stated
    with probability over i; the construction naturally achieves per-i success. Comparing them requires
    care and the record's quantifier_order block exists for exactly this.
  - OFFLINE-COST CONVENTION. Corrigan-Gibbs--Kogan charge the offline phase at zero; Bernstein-Lange
    charge it. Mixing the two makes the separation look larger or smaller by up to N^{2/3}. One convention
    per figure, declared.
  - ADVICE ENCODING. Whether a table entry costs log p bits, 2 log p bits, or a truncated hash changes
    S by a constant and S*T^2 by the same constant. The encoding must be frozen before any figure
    and is the same object as OPEN-2 in IDEA-20260807-a2fb45.
  - TOY CLASSES ARE SMALL. Enumerable toy classes have few prime-order members, so M is small and
    the slope of advice against M is estimated from few points. The M-dependence must be read from
    the CONSTRUCTION, not extrapolated from a toy fit.
  - MODEL DRIFT. "M groups of the same order" is not the same as "M targets in one group" (KN-LIT-4091's
    setting) nor "one group with M advice strings". Every downstream citation must name which model
    it means.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: CONSTANT in M up to the O(L*log p) path descriptions, i.e. a fitted slope of
    advice against M indistinguishable from zero, at every tested toy class. A growing slope means
    the construction is not reusing the table and the whole record is wrong.
  falsification_criterion:
  - C1 is refuted by an adversary the quantifier audit finds. The record is superseded; the construction
    survives but the separation claim does not, and that is a materially weaker record which must
    be labelled as such.
  - C1 is found to be published. NOT a falsification -- the best outcome -- but it changes novelty_status
    and reduces the record to a corollary, which must be stated plainly rather than hidden.
  - The construction's advice grows with M in the isogeny-class arm. Implementation error or a misunderstanding
    of the model; halts the line.
  - The different-class null shows constant advice in M. The accounting is not charging advice per
    group and the separation is an artifact of the measurement.
  - The construction succeeds on the different-class null. It is not using the isogeny structure;
    the separation is spurious.
  - C1 is provable but with a bound weaker than Omega~(M*N/T^2) -- say Omega~(sqrt(M)*N/T^2). The
    separation factor shrinks accordingly and must be restated at the proven strength, never at the
    conjectured one.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-ea3915
