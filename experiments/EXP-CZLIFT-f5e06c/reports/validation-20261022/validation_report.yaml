  metric_recomputations:
    method: Recomputation written from the spec and hypothesis definitions before check.py was opened
      (j2_recompute.py). It was then compared with raw-result.json metrics, manifest.yaml result.metrics and stdout.log.
    outputs:
    - experiments/EXP-CZLIFT-f5e06c/reports/validation-20261022/j2_recompute.json
    exact_matches: 'All counts and rates are exact on both seeds: 117 of 127 compared fields per seed agree to the bit,
      and manifest result.metrics equals the raw-result metrics block field for field (141 of 141) on both seeds.'
    per_seed:
      RUN-CZLIFT-032a92:
        anomalous: {samples_total: 2304, rule_agreement: 1.0, rule_disagreements: 0, nondegenerate_samples: 576,
                    nondegenerate_success_rate: 1.0, degenerate_ratio_defined_samples: 1728, degenerate_success_rate: 0.0,
                    degenerate_z_score_recorded: -0.24321103913742012, curves: 24}
        anomalous_by_class: {canonical: '576/576 degenerate, 0 success', isomorphic: '576/576 degenerate, 0 success',
                             pert_p: '0/576 degenerate, 576 success', pert_p2: '576/576 degenerate, 0 success'}
        torsion: {pairs_total: 288, canonicity_rate: 1.0, homomorphism_rate_torsion: 1.0, degeneracy_rate_torsion: 1.0,
                  torsion_reduces_rate: 1.0, scalar_mult_equivariance_rate: 1.0, torsion_cost_mean_additions: 107.16666666666667}
        torsion_sections: 'identity_rate 1.0 and success_rate 0.0 for all 9 section x arm cells; z = -0.086855 (all, n=288),
          -0.062999 (cm_canonical, n=192), -0.059790 (random_naive, n=96) for each section'
        success_criterion_met: true
        falsification_condition_met: false
      RUN-CZLIFT-6447f0:
        anomalous: {samples_total: 2304, rule_agreement: 1.0, rule_disagreements: 0, nondegenerate_samples: 576,
                    nondegenerate_success_rate: 1.0, degenerate_ratio_defined_samples: 1728, degenerate_success_rate: 0.0,
                    degenerate_z_score_recorded: -0.23607067162662576, curves: 24}
        anomalous_by_class: same pattern as seed 20261009 (canonical, isomorphic, pert_p2 all degenerate with 0 successes;
          pert_p 576/576 successes)
        torsion: {pairs_total: 288, all five rates 1.0, torsion_cost_mean_additions: 107.75}
        torsion_sections: 'identity_rate 1.0 and success_rate 0.0 for all 9 cells; z = -0.091987 (all), -0.069597 (cm_canonical),
          -0.060149 (random_naive)'
        success_criterion_met: true
        falsification_condition_met: false
    z_score_definition:
      finding: The 10 z-score fields per seed differ from my first recomputation by at most 1.65e-6 absolute. The spec
        does not fix the variance formula. I used the heterogeneous-Bernoulli SE, sqrt(sum q_i(1-q_i)) with q_i = 1/p_i;
        the producer uses the pooled-binomial SE, sqrt(qbar(1-qbar)/n). Under the producer's form, my recomputation
        matches every recorded z to within 1.2e-15. Both are "standard errors of 1/p" as the hypothesis words it.
      worst_case: 'anomalous.degenerate_z_score seed 20261009: recorded -0.24321103913742012, heterogeneous form -0.24321269154529523,
        pooled form -0.2432110391374213'
      impact: none on any frozen threshold (|z| <= 4)
    torsion_cost_within_bound: recomputed true (sum 30864 <= bound 42576; sum 31032 <= bound 41928)
    checker_receipt: 'Re-ran implementation/check.py on both archived run dirs: "check ok", rc 0, matching check.stdout.log.
      Note that check.py is not independent of the producer. It replays 3 of 48 curves per seed (the first anomalous curve
      and the first curve of each torsion arm) and re-derives the summaries with the producer''s own summarize().'
    deterministic_replay: 'Full re-execution of both trials from the plan argv, into the session scratchpad (not a run
      record), reproduces raw-result.json sha256 e1677d83... and 387fc4e2..., plus stdout byte for byte
      (replay_compare.txt).'
    independent_curve_level_checks:
      script: experiments/EXP-CZLIFT-f5e06c/reports/validation-20261022/j2j3_independent.py (sealed blind primitives only)
      results:
      - 48 of 48 anomalous curves (24 per seed) have p prime in [10^4, 10^5] and are anomalous by my own table-of-squares
        point count. The exact rational j(A, B) equals the CM j for each D, and the coefficients are the integral CM model
        (not reduced mod p) for every j != 0 curve.
      - On all 48 curves my v_p(z([p]P^)) gives 2 on the producer's canonical (A, B), 1 on (A+p, B) and 2 on (A+p^2, B),
        with two addition chains at precision p^8. The producer's vP by class is canonical 2, pert_p 1, pert_p2 2.
      - 48 of 48 torsion curves have N recorded = N counted, n prime, n the largest prime factor of N, n | N, n >= 101,
        n != p, N odd and non-anomalous. cm_canonical models have the exact CM j; random_naive coefficients lie in [0, p).
    independent_sampled_attack_replay:
      script: experiments/EXP-CZLIFT-f5e06c/reports/validation-20261022/j2_sampled_replay.py (validator seed 6565)
      sampled: 6 anomalous curves per seed x 3 lift classes x 8 samples; 4 torsion curves per arm per seed x 2 sections x 12 samples
      results: 'pert_p (A + p r) gave 96/96 successes with v=(1,1). Canonical gave 0/96 with v=(2,2); pert_p2 gave 0/96 with
        v=(2,2). Torsion sections (naive and x-randomised Hensel, both arms) gave 0/384 successes with v=(1,1). This agrees
        in pattern with the recorded rows.'
    borderline_probes:
    - 'Silent drops: both drivers `continue` on Q = O or y(Q) = 0. Every anomalous curve has 96 rows (4 classes x 3 sections
      x 8) and every torsion curve has 12, so 0 rows were dropped on either seed. On prime-order and odd-order subgroups
      neither condition can trigger.'
    - 'd = +-1: excluded by construction in both arms (d in [2, p-2] and [2, n-2]) by the imported lane-1 drivers. The
      f5e06c spec does not restate the exclusion; it inherits it through "lane-1 drivers imported unmodified". The chance
      reference becomes 1/(p-3) instead of 1/p, a negligible difference.'
    - 'Ties and valuation mismatches: 0 rows with vP != vQ in either arm on either seed (anomalous rows are all (1,1) or
      (2,2); every torsion section row is (1,1)), so the ratio = 0 and ratio = None branches never fire.'
    - 'Exclusions from z: degenerate rows with undefined ratio are 0 of 1728 per seed, and torsion rows with undefined
      ratio are 0 of 288.'
    - 'Precision caps: v_dj = 8 (capped at k) on the canonical and isomorphic classes means j(E^) = j_CM mod p^8, which
      is the intended ">= k" reading. No vP reaches its cap.'
    - 'Singular fits: no frozen z has a zero SE. arm_difference.*.z_score is null on both seeds because the pooled success
      rate is 0, so the SE is 0. That field is not frozen.'
    - 'Nondegenerate definition: the code buckets vP == 1 as nondegenerate, while the spec says "not degenerate" (vP < 2).
      These are identical here since no row has vP = 0.'
    discrepancy_with_claim_under_review: 'The review plan''s claim_under_review states "every |z| < 0.1". That is false for
      anomalous.degenerate_z_score: -0.24321103913742012 (seed 20261009) and -0.23607067162662576 (seed 20261010). It holds
      only for the torsion-section z-scores (max |z| 0.086855 and 0.091987). Every recorded value is correct and the frozen
      criterion |z| <= 4 is met; the claim text overstates. The rows producing this are the 1728 degenerate,
      ratio-defined anomalous rows per seed, with 0 successes against an expected 0.05915 and 0.05573.'

