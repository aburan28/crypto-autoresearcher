    producer_values_on_shared_curves:
    - '(D=-3, p=22447) appears in seed 20261009 with the identical model (0, 3). Producer rows: canonical vP=vQ=2 (24/24),
      pert_p vP=1 (24/24, v_dj=3), pert_p2 vP=2 (24/24, v_dj=6).'
    - '(D=-67, p=47051) appears in seed 20261009 with the integral model (-38206080, 90896432256), a different model in the
      same anomalous class (CM model twisted by 2). Producer rows: canonical vP=2 (24/24), pert_p vP=1 (24/24, v_dj=1),
      pert_p2 vP=2 (24/24).'
    - (D=-19, p=74219) is in neither seed's sample. My sealed code applied to all 48 producer curves gives the same
      2 / 1 / 2 pattern.
    agreement: 'Exact. The anomaly verdict agrees on every curve checked: my 3 plus the producer''s 48. v_p(z([p]P^)) is
      2 on the canonical lift and 1 on the pert_p lift on both sides.'
    underspecification_found_blind:
    - The spec does not define the sampler (discriminant set, draw of p, twist choice) or the "pert_p" lift. Both were
      resolved from general mathematics and recorded before sealing. The producer's choices (D in {-3,-11,-19,-43,-67,-163};
      for j=0, pert_p perturbs A by p r, which is non-canonical) agree with those resolutions.
    - Blind traps the producer avoids. D=-7 has no anomalous prime, and the producer's anomalous sampler omits it. Reducing
      the canonical coefficients to [0, p) makes a j != 0 lift non-canonical (v = 1); the producer keeps the integral
      coefficients. For j=0, perturbing B by p keeps the lift canonical; the producer's pert_p perturbs A.
    verdict: holds

  heuristic_validation_checks:
  - check: pre-registered prediction
    result: 'Holds. preregistered_prediction ("all rates exactly 1; every |z| <= 4; on both seeds") is in the spec frozen
      at b553f64e3a, before the runs; heuristic_under_test is null.'
  - check: sample integrity
    result: Holds. Seeds, parameters and counts are in the manifest; the sampling procedure is hash-bound source; every
      metric recomputes from raw rows.
  - check: correspondence validity
    result: 'Not applicable (correspondence: null). The harness cites the CM models as "recalled, not retrieved" (Cremona
      labels), but they are not load-bearing: the harness self-test and my own exact-rational computation both confirm
      each model''s j.'
  - check: scale binding
    result: 'Holds. Medium tier with p in [10^4, 10^5] (at most 17 bits); the spec scopes out any deployed-curve claim
      and makes no crypto-scale or transfer statement.'
