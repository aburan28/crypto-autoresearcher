      is_zero() do discriminate; the torsion rates of 1.0 are not produced by a vacuous comparison)
  - control: PTM-1 proves-too-much object (non-anomalous curves at primes in range)
    script: experiments/EXP-CZLIFT-f5e06c/reports/validation-20261022/ptm1.py
    output: experiments/EXP-CZLIFT-f5e06c/reports/validation-20261022/ptm1.json
    objects:
    - O1, quadratic twist of the sampled anomalous curve (D=-67, p=14087, #E=14089): rejected, "AssertionError curve is not anomalous", 0 rows
    - O2, sampled CM torsion curve (D=-11, p=24029, #E=23901): rejected before any measurement, 0 rows
    - O3, sampled random torsion curve (p=10007, #E=9931): rejected before any measurement, 0 rows
    - O4, resolve_anomalous(-11, 24029) where p is not a trace-1 norm returns None; all 84 sampler candidates in
      [10^4, 10^5] are trace-1 norms for their D
    expected_failure_signature: The anomaly check must reject the curve before any measurement.
    observed: Matches. The known-false conclusion cannot be produced; the instrument never measures a non-anomalous curve.
    fragility: 'The rejection is a Python assert, which python -O strips. With assertions stripped, all three objects still
      fail loudly (ValueError in z_param, because [p]P^ is not in the formal group) and yield 0 rows, so nothing is accepted
      silently, but the anomaly check itself is no longer what rejects them. The frozen command does not use -O, and
      environment.json does not record PYTHONOPTIMIZE.'
    verdict: holds

