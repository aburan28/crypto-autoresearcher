  - 'Not applicable: no cost claim. The secondary metric torsion_cost_mean_additions declares its unit (complete projective
    additions), and its within-bound flag recomputes as true. No memory figure is reported, but none is claimed.'
  proof_architecture_checks:
  - 'Not applicable: bounded measurement, no proof claim (proof_search_map.not_applicable_reason).'

  verdict: passed
  verdict_rationale: Both run packages are complete and hash-bound to the frozen plan and to both Coordinator archive
    receipts. Every frozen success and falsification metric and each control recomputes from raw-result.json on both
    seeds. The producer's checker agrees, and a full replay is byte-identical. The sealed blind re-derivation agrees
    with the recorded values, and the proves-too-much object shows the expected failure signature. Under the inference
    boundary this makes the receipts admissible evidence only. It does not support or weaken H-CZLIFT-bd2017, change
    any status, or authorize promotion.

  limitations:
  - 'Power of the chance-level z tests, for the review-evidence round (interpretation joints are not owned here, PD-1).
    The expected success counts under 1/p are 0.0592 and 0.0557 (anomalous degenerate, n=1728) and 0.0075 and 0.0085
    (torsion, all, n=288), far below the regime where a normal z is meaningful. One chance success would give z = 3.87
    on seed 20261009 but z = 4.0001 on seed 20261010, crossing the frozen bound, and one torsion success gives z of
    about 10.8 to 16.7. Zero observed successes bound the per-sample success rate at 95% only to 1.73e-3 (anomalous
    degenerate, about 51x 1/p) and 1.04e-2 (torsion all, about 350 to 395x 1/p). "Within 4 SE of 1/p" therefore cannot
    tell chance-level success from zero or from rates up to about 1%.'
  - 'No null-object decay test. The random_naive arm is a same-shape null object for the torsion arm (arm difference 0).
    However, neither the spec nor the records state how the degenerate and torsion success rates should scale with p
    (as 1/p), and at this sample size the data cannot exhibit that decay.'
  - 'Rule threshold at j=0: v_p(j - j_CM) is always a multiple of 3 for short-Weierstrass A-perturbations at j=0, so the
    tested v_dj values are {3, 6, 8}. They cannot discriminate the stated threshold 2e = 6 from 4 or 5. At j != 0 the
    borderline v_dj = 1 versus 2 is sampled.'
  - The validator's independent replay is sampled at the curve level (all 96 curves for anomaly, models, subgroup data
    and v; 6+6 anomalous and 16 torsion curves for attack outcomes). Per-row booleans for the torsion-section identity,
    canonicity and homomorphism are verified by recomputing the aggregates from raw rows plus a byte-identical replay
    of the producer code, not by an independent implementation of the torsion section.
  - The environment record pins no package versions (runtime_lock null); the manifest records no memory.
  - The claim_under_review wording "every |z| < 0.1" is false for anomalous.degenerate_z_score on both seeds (see
    metric_recomputations.discrepancy_with_claim_under_review).
  - 'Write-scope disclosure. My PTM-1 fragility probe (a child interpreter with -O) created seven gitignored bytecode
    files outside the write scope: run.cpython-313.opt-1.pyc under the f5e06c and 17b7eb implementation __pycache__,
    and harness/__pycache__/{__init__,czlift,czlift_medium,czlift_run,toycurve}.cpython-313.opt-1.pyc. I deleted exactly
    those seven files. Pre-existing .pyc files were untouched, and no run artifact, ledger record or tracked file was
    modified. The replay run dirs went to the session scratchpad, outside the repository.'

