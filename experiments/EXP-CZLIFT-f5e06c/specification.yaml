experiment:
  id: EXP-CZLIFT-f5e06c
  hypothesis_id: H-CZLIFT-bd2017
  source_idea: IDEA-20261009-93b29f
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  version: 1
  title: Medium-scale replication of the canonical-lift rule and the torsion-section identities, 10^4 <= p <= 10^5
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision: DEC-20261009-575cd3
  execution_authorized: true
  status_note: Frozen at version 1 and approved 2026-10-09 by DEC-20261009-575cd3 under AGENTS.md 'Standing user
    authorization' and the user's request of 2026-10-09 to design and execute all accepted angles; driver and checker
    smoke-tested before freezing. Approval asserts nothing about H-CZLIFT-bd2017.
  objective: Re-run the lane-1 measure_curve functions of EXP-CZLIFT-17b7eb and EXP-CZLIFT-ae0a13 on sampled curves
    between 10^4 and 10^5 (24 anomalous CM, 16 CM-canonical, 8 random lifts) and record both summaries.
  inputs:
    pmin: 10000
    pmax: 100000
    n_anom: 24
    n_cm: 16
    n_rand: 8
    samples_a: 8
    samples_b: 12
    precision_a: 8
    precision_b: 4
    seeds:
    - 20261009
    - 20261010
  controls:
  - The lane-1 drivers are imported unmodified and hash-bound; only the curve sampler is new.
  - Both arms of the torsion measurement (CM-canonical, random lift) are present.
  independent_variables:
  - p (sampled)
  - lift class / section / arm as in lane 1
  metrics:
    primary:
    - anomalous.rule_agreement
    - anomalous.nondegenerate_success_rate
    - torsion.canonicity_rate
    - torsion.homomorphism_rate_torsion
    - torsion.degeneracy_rate_torsion
    - torsion_sections.*.identity_rate
    - torsion_sections.*.z_score
    secondary:
    - anomalous.degenerate_z_score
    - torsion.torsion_cost_mean_additions
  heuristic_under_test: null
  preregistered_prediction:
    quantity: anomalous.rule_agreement, anomalous.nondegenerate_success_rate, torsion.canonicity_rate, torsion.homomorphism_rate_torsion,
      torsion.degeneracy_rate_torsion, torsion_sections.*.identity_rate, torsion_sections.*.z_score
    formula: all rates exactly 1; every |z| <= 4; on both seeds
    source: H-CZLIFT-bd2017 predictions
  scale_relevance:
    tier: medium
    justification: tested parameters as listed under inputs; no crypto-scale statement
    correspondence: null
  tail_checks:
  - every per-run primary metric is recorded so a near-miss on one seed can be compared with the other
  replication:
    seeds:
    - 20261009
    - 20261010
    independent_instances: 2
    replication_note: two trials; a prediction counts only if it holds on both
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
  - Stop after the two planned trials have output_validated receipts.
  - A crash or timeout is failed_infrastructure; never a metric value.
  invalidation_rules:
  - The checker cannot reproduce its re-run subset from the recorded inputs.
  success_criterion: 'On both seeds: anomalous.rule_agreement = 1.0, anomalous.nondegenerate_success_rate = 1.0,
    |anomalous.degenerate_z_score| <= 4, the five torsion rates = 1.0, every section identity_rate = 1.0 and |z_score|
    <= 4 on each arm.'
  falsification_criterion: On both seeds any rule disagreement, identity failure, or a section with z_score > 4.
  decision_impact:
    on_positive: H-CZLIFT-889c9d and H-CZLIFT-6d4ed1 gain a medium-tier replication; their claim tier moves after
      review.
    on_negative: A disagreement at medium scale sends harness/czlift.py to repair first; a section beating 1/p at
      medium scale on both seeds opens a red-team card.
  required_artifacts:
  - experiments/EXP-CZLIFT-f5e06c/runs/<RUN-ID>/manifest.yaml
  - experiments/EXP-CZLIFT-f5e06c/runs/<RUN-ID>/raw-result.json
  - experiments/EXP-CZLIFT-f5e06c/runs/<RUN-ID>/command.txt
  - experiments/EXP-CZLIFT-f5e06c/runs/<RUN-ID>/environment.json
  - experiments/EXP-CZLIFT-f5e06c/runs/<RUN-ID>/stdout.log
  - experiments/EXP-CZLIFT-f5e06c/runs/<RUN-ID>/stderr.log
  launcher:
    trial_plan: experiments/EXP-CZLIFT-f5e06c/trial-plan.json
    driver: experiments/EXP-CZLIFT-f5e06c/implementation/run.py
    checker: experiments/EXP-CZLIFT-f5e06c/implementation/check.py
    library:
    - experiments/EXP-CZLIFT-17b7eb/implementation/run.py
    - experiments/EXP-CZLIFT-ae0a13/implementation/run.py
    - harness/czlift.py
    - harness/czlift_medium.py
    - harness/czlift_run.py
    - harness/toycurve.py
  assigned_to: executor
  out_of_scope:
  - Any claim about a deployed curve.
