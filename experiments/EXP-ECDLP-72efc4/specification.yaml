# EXP-ECDLP-72efc4
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261003-293bbe.
experiment:
  id: EXP-ECDLP-72efc4
  hypothesis_id: H-ECDLP-adc502
  source_idea: IDEA-20261003-18748d
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-5 table versus width-4 table
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-293bbe
  objective: >-
    Check the table sizes 16 and 8, the product 128, and the nearby gap 0.
  inputs:
    width_hi: 5
    width_lo: 4
    table_hi: 16
    table_lo: 8
    table_gap: 8
    table_product: 128
    table_sum: 24
    nearby_a: 8
    nearby_b: 8
    nearby_gap: 0
    nearby_product: 64
  controls:
    - >-
      Two to the power 4 is 16. Two to the power 3 is 8. Reporting
      both tables as size 8 drops the gap and invalidates the run.
    - >-
      Sixteen exceeds eight by 8. The product of the two sizes is
      128. Their sum is 24.
    - >-
      Two width-4 tables each store 8. Their gap is 0 and their
      product is 64.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-5 table stores 16 entries. The width-4 table stores
      8. The gap of two width-4 tables is 0.
    formula: >-
      Compute 2 to the power 4. Compute 2 to the power 3. Subtract
      8 from 16. Multiply 16 by 8. Subtract 8 from 8.
    source: >-
      IDEA-20261003-18748d states the widths 5 and 4 and the sizes
      16 and 8, read 2026-10-03. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 128 and the nearby gap 0 are required. A check that stops at the size 16 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 16 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 4 is not 16.
    - Two to the power 3 is not 8.
    - The gap is not 8.
    - The product is not 128.
    - Both tables are reported as size 8, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-5 table stores 16 entries, that
    the width-4 table stores 8, and that 16 exceeds 8 by 8.
  falsification_criterion: >-
    The runs agree that the width-5 table size is computed, and
    that size is not 16.
  required_artifacts:
    - experiments/EXP-ECDLP-72efc4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-72efc4/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-72efc4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-72efc4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-72efc4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-72efc4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 8 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
