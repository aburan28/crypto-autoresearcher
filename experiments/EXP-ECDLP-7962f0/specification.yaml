# EXP-ECDLP-7962f0
# Storage-count arithmetic. No ladder is run.
# Approved by DEC-20261003-7fdbc4.
experiment:
  id: EXP-ECDLP-7962f0
  hypothesis_id: H-ECDLP-d8c550
  source_idea: IDEA-20261003-7f6cd3
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Affine storage versus x-only storage
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-7fdbc4
  objective: >-
    Check the storage gap 1, the product 2, and the nearby gap 0.
  inputs:
    affine: 2
    xonly: 1
    storage_gap: 1
    storage_product: 2
    storage_sum: 3
    nearby_a: 2
    nearby_b: 2
    nearby_gap: 0
    nearby_product: 4
  controls:
    - >-
      A full affine point stores 2 field elements. An x-only state
      stores 1. Reporting the x-only state as storing 2 drops the
      gap and invalidates the run.
    - >-
      Two exceeds one by 1. The product of the two counts is 2.
      Their sum is 3.
    - >-
      Two full affine points each store 2. Their gap is 0 and their
      product is 4.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {count, subtract}
  metrics:
    primary:
      - storage_gap
      - storage_product
      - nearby_gap
      - implementations_agree
    secondary:
      - storage_sum
      - nearby_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      2 exceeds 1 by 1. The product of 2 and 1 is 2. The gap of
      two affine counts is 0.
    formula: >-
      Subtract 1 from 2. Multiply 2 by 1. Add 2 and 1. Subtract
      2 from 2. Multiply 2 by 2.
    source: >-
      IDEA-20261003-7f6cd3 states the storage counts 2 and 1,
      read 2026-10-03. The gap, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No ladder was run.
  scale_relevance:
    tier: toy
    justification: Two written storage counts. No transfer to a ladder.
    correspondence: null
  tail_checks:
    - The product 2 and the nearby gap 0 are required. A check that stops at the gap 1 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The affine count is not 2.
    - The x-only count is not 1.
    - The gap is not 1.
    - The product is not 2.
    - The x-only state is reported as storing 2, or a ladder is run.
  success_criterion: >-
    Both runs agree that the affine count is 2, that the x-only
    count is 1, that 2 exceeds 1 by 1, and that the product is 2.
  falsification_criterion: >-
    The runs agree that the affine count is computed, and that
    count is not 2.
  required_artifacts:
    - experiments/EXP-ECDLP-7962f0/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-7962f0/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-7962f0/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-7962f0/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-7962f0/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-7962f0/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any ladder or scalar recovery.
    - Any claim that a storage gap of 1 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
