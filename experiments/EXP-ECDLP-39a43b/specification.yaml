# EXP-ECDLP-39a43b
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261003-636d6e.
experiment:
  id: EXP-ECDLP-39a43b
  hypothesis_id: H-ECDLP-de0a5e
  source_idea: IDEA-20261003-18f8c3
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-6 table versus width-5 table
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-636d6e
  objective: >-
    Check the table sizes 32 and 16, the product 512, and the nearby gap 0.
  inputs:
    width_hi: 6
    width_lo: 5
    table_hi: 32
    table_lo: 16
    table_gap: 16
    table_product: 512
    table_sum: 48
    nearby_a: 16
    nearby_b: 16
    nearby_gap: 0
    nearby_product: 256
  controls:
    - >-
      Two to the power 5 is 32. Two to the power 4 is 16. Reporting
      both tables as size 16 drops the gap and invalidates the run.
    - >-
      Thirty-two exceeds sixteen by 16. The product of the two sizes
      is 512. Their sum is 48.
    - >-
      Two width-5 tables each store 16. Their gap is 0 and their
      product is 256.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-6 table stores 32 entries. The width-5 table stores
      16. The gap of two width-5 tables is 0.
    formula: >-
      Compute 2 to the power 5. Compute 2 to the power 4. Subtract
      16 from 32. Multiply 32 by 16. Subtract 16 from 16.
    source: >-
      IDEA-20261003-18f8c3 states the widths 6 and 5 and the sizes
      32 and 16, read 2026-10-03. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 512 and the nearby gap 0 are required. A check that stops at the size 32 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 32 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 5 is not 32.
    - Two to the power 4 is not 16.
    - The gap is not 16.
    - The product is not 512.
    - Both tables are reported as size 16, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-6 table stores 32 entries, that
    the width-5 table stores 16, and that 32 exceeds 16 by 16.
  falsification_criterion: >-
    The runs agree that the width-6 table size is computed, and
    that size is not 32.
  required_artifacts:
    - experiments/EXP-ECDLP-39a43b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-39a43b/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-39a43b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-39a43b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-39a43b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-39a43b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 16 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
