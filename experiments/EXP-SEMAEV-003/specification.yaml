experiment:
  id: EXP-SEMAEV-003
  hypothesis_id: H-SEMAEV-002
  version: 1
  title: Powered redesign of the m=2 factor-base yield test (min-count gate + CIs)
  status: approved
  objective: >-
    Resolve the EXP-SEMAEV-002 inconclusive (DEC-20260721-001) by testing the
    same H-SEMAEV-002 claim with adequate statistical power: 2000 targets, 5
    seeds per bit size, a minimum-count gate (a cell is decisive only when
    found_random >= 30), and a Katz 95% CI on each structured/random yield ratio.
  inputs:
    instance_generator: harness.toycurve.generate_instance
    bits: [12, 14, 16]
    seeds: [1, 2, 3, 4, 5]
    factor_base_size: 20
    target_count: 2000
    min_count_gate: 30
  controls:
    - matched random factor base of equal size is the null for each instance
    - identical target set and enumeration across all three base geometries
    - per-run power flag; only powered cells (or the pooled per-bit aggregate)
      are used for the conclusion
  independent_variables: [factor_base_geometry]
  metrics:
    primary: [ratio_interval, ci_interval_lo, ci_interval_hi, ratio_ap, ci_ap_lo, ci_ap_hi]
    secondary: [found_random, found_interval, found_ap, powered]
  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 15
  budget:
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 0.2
    maximum_memory_gb: 2
    maximum_runs: 15
  stopping_rules:
    - stop a run at 120s wall clock (record as resource_exhaustion)
  invalidation_rules:
    - any counted decomposition whose certificate fails independent verification
      invalidates the run
  success_criterion: >-
    In the powered regime (per-run found_random >= 30, or the pooled per-bit
    aggregate), no structured/random yield-ratio 95% CI lower bound exceeds 1.5x
    (corroborates H-SEMAEV-002: no material structured advantage at m=2).
  falsification_criterion: >-
    A powered cell or pooled aggregate whose structured/random ratio 95% CI
    lower bound exceeds 1.5x weakens H-SEMAEV-002 and flags an m=2/m=3 divergence.
  required_artifacts:
    - per-run manifest, command, environment, stdout, stderr, raw-result
    - verified certificate for at least one decomposition per run with yield>0
  assigned_to: executor
  approved_by: coordinator
