experiment:
  id: EXP-PFDR-5726af
  hypothesis_id: H-PFDR-4148b8
  question_id: RQ-PFDR-ae2fba
  idea_id: IDEA-20260903-e1e38b
  version: 1
  recorded_at: '2026-09-03'
  drafted_under_task: TASK-20260903-b5d2ae
  battery_position: 2 of 6 (the forced cell; decides whether the 84cdb7 ladder runs)
  title: >-
    The forced cell (m, d, s) = (2, 2, 3): first fall degree 5 and fall
    dimension 4 on the digit-presented Semaev arm, reproduced exactly by a
    block-factored null and beaten by the support-matched null at 6, with
    the s in {2, 4, 5, 6} ladder run only if the deciding cell passes
  status: review_required
  approved_by: null
  assigned_to: executor
  objective: >-
    Decide, at a 64-column exact-rank cell that costs seconds, whether
    H-PFDR-4148b8's closed form d_ff(2, 2, s) = 4 + floor(s/2) holds and
    whether the first fall carries any curve information. STAGE 0 (zero
    compute, hard gate): write the s = 2 fixture by hand (degree-4 part of
    S_3(ell_1, ell_2, x_R) equals 16 a_{1,0} a_{1,1} a_{2,0} a_{2,1};
    multiplication by it kills A_1 and not A_0), evaluate a_0, d_ff, D_null
    and fall_dim for every cell into a frozen prediction file, and run the
    H-TOP symbolic check at m = 3 (S_4 built by resultant from S_3, top
    form extracted, x_R symbolic, over Q and over F_p for p in {4099,
    65537}). STAGE 1: the shared F_p meter on the s = 2 fixture, then the
    DECIDING CELL s = 3 on 3 curves x 2 targets x 2 primes with NULL-1,
    NULL-2 and NULL-3 in the same invocation, plus the H-WIL direct rank
    check for s in {2, ..., 8}. STAGE 2 (only if the deciding cell passes
    P1-P3): the ladder s in {4, 5, 6} and the mixed-block and non-monomial
    nearby objects at s = 3. STAGE 3 (secondary, gated on H-TOP at m = 3):
    m = 3, s in {4, 5}, p = 65537, one curve, two targets, both nulls.
    STAGE 4 (zero compute): signed residuals per cell against the frozen
    predictions, verdict. Budget note: budgets are at or above the template
    floors; every matrix has at most 4096 columns (32768 at the m = 3
    secondary), and the run granularity is one (m, s) cell over all curves,
    targets, primes and arms.
  inputs:
    deciding_cell: '(m, d, s) = (2, 2, 3); n = 6; 64 squarefree columns; p in {4099, 65537}; 3 generic-j curves per p; 2 planted targets per curve'
    ladder: 's in {2, 4, 5, 6} at m = 2, same curves, targets and primes; D_max = D_null + 1 per cell'
    secondary: 'm = 3, d = 2, s in {4, 5}, p = 65537, one curve, two targets; gated on H-TOP at m = 3'
    generators: >-
      a_{k,i}(a_{k,i} - 1) for all k, i; S_{m+1}(ell_1, ..., ell_m, x_R)
      with ell_k = sum_i 2^i a_{k,i}, reduced in B = F_p[a]/(a^2 - a).
    frozen_prediction_file: >-
      Written at Stage 0 before any rank: per cell, e = 2^{m-1},
      a_0 = floor((s - e)/2) + 1, d_ff = m e + a_0 = m 2^{m-1} +
      floor((s - 2^{m-1})/2) + 1, D_null = floor((ms + m e)/2) + 1,
      fall_dim = m [binom(s, a_0) - binom(s, a_0 + e)].
      At m = 2: (s, d_ff, D_null, fall_dim) = (2, 5, 5, 4), (3, 5, 6, 4),
      (4, 6, 7, 10), (5, 6, 8, 10), (6, 7, 9, 28). At m = 3: (4, 13, 13, ...)
      and (5, 13, 14, ...) with fall_dim computed by the same formula at
      e = 4.
    shared_meter: >-
      REQUIRED INPUT (shared prerequisite, DEC-20260903-8cdf8d next_actions
      item 1): the F_p port of experiments/EXP-SBRG-60c55e/driver/
      macaulay.py in squarefree mode (rows reduced by a^2 = a, coefficients
      mod p, exact rank over F_p, fall_dim(D) = rank(M_D) - rank(H_D)),
      with (a) the p = 2 known answer against KN-FIND-006 and (b) the
      planted-syzygy positive control passed in the same manifest lineage.
    symbolic_S4: >-
      S_4 built by resultant Res_T(S_3(x_1, x_2, T), S_3(x_3, x_R, T)) from
      a from-scratch S_3, checked against the archived degree profile
      [4, 4, 4, 12] of EXP-ALPF-011; the harness s4_expr path is not relied
      on (KN-OPEN-5b3a08).
    frozen_fixture_shared_with_EXP-PFDR-fd901a: 'the (2, 2, 3), p = 4099 instance (curve seed 1101, target seed 1)'
  controls:
    - id: NULL-1-SUPPORT-MATCHED
      blocking: true
      object: 'random multilinear polynomial with S~''s exact monomial support and uniform F_p coefficients, same membership generators; 5 seeds per (curve, target, p)'
      forced_disposition: >-
        Predicted d_ff = D_null (6 at the deciding cell; 5, 7, 8, 9 on the
        ladder) under semi-regularity: NO strict early fall. If NULL-1 falls
        at the Semaev value the observable is a degree-profile property and
        the mechanism claim is withdrawn (F4).
    - id: NULL-2-BLOCK-FACTORED
      blocking: true
      object: 'prod_k q_k with q_k a uniformly random form of degree e = 2^{m-1} in the block-k digit variables, same membership generators; 5 seeds'
      forced_disposition: >-
        d_ff and fall_dim IDENTICAL to the Semaev arm at every cell (forced
        0 difference). A nonzero difference is the most valuable negative
        (F2) and is re-run at the next s before it is named.
    - id: NULL-3-CURVE-TARGET-SCRAMBLE
      blocking: true
      object: '3 curves x 2 targets per (s, p)'
      forced_disposition: >-
        Identical d_ff and fall_dim across all curves and targets at fixed
        (m, s); any spread is reported as an instrument issue first.
    - id: CTRL-S2-HAND-FIXTURE
      blocking: true
      object: 's = 2, n = 4, one curve, one target, p = 4099'
      forced_disposition: >-
        The meter must return d_ff = 5 = D_null with fall_dim 4 and the
        hand-computed degree-4 part; the instrument gate.
    - id: CTRL-H-WIL-DIRECT-RANK
      blocking: true
      object: 'exact F_p rank of multiplication by ell^2 from degree j to j + 2 on F_p[a_1..a_s]/(a_i^2), s in {2..8}, all j, p in {4099, 65537}; curve-free'
      forced_disposition: >-
        Exactly min(binom(s, j), binom(s, j + 2)) at every (s, j, p); the
        square maps j + 2 = s - j are the tail check.
    - id: NEARBY-MIXED-BLOCK
      blocking: true
      object: 'x_k = sum_i c_{k,i} a_i with the a_i shared across k (random c), at m = 2, s = 3'
      forced_disposition: >-
        d_ff at least 1 above the Semaev value (predicted 6 = D_null). If it
        equals 5 the method reads the degree profile, not the block
        structure (F5).
    - id: NEARBY-NON-MONOMIAL-TOP
      blocking: false
      object: 'top form x_1^2 x_2^2 + x_1^4 substituted at m = 2, s = 3'
      forced_disposition: >-
        d_ff between the block value and D_null; reported.
    - id: CTRL-H-TOP-SYMBOLIC
      blocking: true
      object: 'top homogeneous part of S_4(x_1, x_2, x_3, x_R) with x_R symbolic'
      forced_disposition: >-
        Exactly c x_1^4 x_2^4 x_3^4 with c a nonzero constant (not a
        polynomial in a, b, x_R that can vanish); gates the m = 3 secondary
        stage only.
    - id: CTRL-CONFOUNDERS-NAMED
      blocking: false
      object: >-
        (i) the CRT / complete-splitting artifact of IDEA-20260830-cb8e46:
        the ideal is a tiny point set; only generator-level fall_dim is
        read. (ii) the output-degree proxy of IDEA-20260807-899c5e: no
        reduced-basis degree is a metric; sol(D) of IDEA-20260806-7ea402 is
        recorded as a covariate only. (iii) the D_null convention: 84cdb7's
        ceil((ms + 2m)/2) and this contract's floor((ms + 2m)/2) + 1 differ
        by one when ms + 2m is even; every comparison names which is used.
      forced_disposition: >-
        Named and excluded by construction.
  independent_variables:
    - 's in {2, 3, 4, 5, 6} at m = 2 (3 is deciding); s in {4, 5} at m = 3 (secondary)'
    - 'p in {4099, 65537}'
    - 'arm: Semaev | NULL-1 | NULL-2 | NULL-3 scramble | mixed-block | non-monomial'
    - 'degree D up to D_null + 1'
  metrics:
    primary:
      - 'd_ff per (cell, arm, curve, target, p) as the least D with fall_dim(D) > 0'
      - 'fall_dim(d_ff) per (cell, arm)'
      - 'NULL-2 minus Semaev for d_ff and fall_dim per cell (forced 0)'
      - 'NULL-1 d_ff per cell against D_null'
      - 'signed residual per cell against the frozen Stage 0 prediction file'
    secondary:
      - 'full F_p rank profile per degree per arm'
      - 'H-WIL direct rank table (s, j, p)'
      - 'H-TOP symbolic check result at m = 3 (and at m = 4 if affordable)'
      - 'mixed-block and non-monomial nearby-object d_ff'
      - 'sol(D) and d_solve per cell (IDEA-20260806-7ea402 covariate, reported not claimed)'
      - 'column counts, peak RSS, wall time per cell; certificate pass/fail per planted target'
  heuristic_under_test: 'HEUR-002 (H-WIL, exactness) of H-PFDR-4148b8 through the direct rank check; HEUR-001 (H-TOP) through the symbolic check; the main claim through the deciding cell'
  preregistered_prediction:
    quantity: >-
      d_ff and fall_dim(d_ff) on the Semaev arm at (2, 2, 3), the same on
      the block-factored null, and d_ff on the support-matched null.
    formula: >-
      Semaev: d_ff = 4 + floor(3/2) = 5, fall_dim = 2 [binom(3, 1) -
      binom(3, 3)] = 4, identical across curves, targets and primes.
      NULL-2: identical (5, 4). NULL-1: d_ff = D_null = floor((6 + 4)/2) +
      1 = 6. Ladder: d_ff = 5, 6, 6, 7 with fall_dim 4, 10, 10, 28 at s = 2,
      4, 5, 6 and NULL-1 at 5, 7, 8, 9. Mixed-block nearby object at s = 3:
      6. m = 3: d_ff = 13, 13 at s = 4, 5 against D_null 13, 14.
    source: >-
      IDEA-20260903-e1e38b (D1)-(D6): the tensor-kernel identity, the
      dimension-count upper bound, Wilson's rank formula (snippet-level
      retrieval) for exactness, and the block-factored null. Fixed on
      2026-09-03 before any run; never adjusted afterward.
  scale_relevance:
    tier: toy
    justification: >-
      p in {4099, 65537}, s <= 6, matrices of at most 4096 columns (32768
      at the m = 3 secondary). No transfer to cryptographic s is claimed:
      the s <= 6 check tests Wilson's rank statement where it is
      computable, not the digit presentation at scale. The p-independence
      of these integers is calibrated separately by EXP-PFDR-fd901a.
    correspondence: 'none; direct computation at the tested primes'
  tail_checks:
    - >-
      The square maps j + 2 = s - j in the H-WIL check, where a singular
      map would contradict full rank.
    - >-
      The gap D_null - d_ff along the ladder must grow as ceil(s/2) - 1 (1,
      1, 2, 2 at s = 3..6): a constant gap contradicts the derivation and is
      an instrument issue first.
    - >-
      The coefficient c of the m = 3 top form as a polynomial in (a, b,
      x_R): if it can vanish, the special locus is reported and excluded.
  replication:
    seeds:
      - 'curve seeds 1101, 1102, 1103 per prime (curve k uses 1100 + k); the p = 4099, seed 1101, target 1 instance is the frozen fixture shared with EXP-PFDR-fd901a'
      - 'target seeds 1, 2 per curve'
      - 'null seeds 7, 11, 13, 17, 19 per (curve, target, p) for NULL-1 and NULL-2'
      - 'mixed-block coefficient seeds 31, 37, 41'
    independent_instances: >-
      3 curves x 2 targets x 2 primes = 12 Semaev draws per cell, each with
      5 null seeds per null arm. Justification: the prediction is a forced
      exact integer per draw, so a single disagreeing draw refutes the cell;
      12 draws across 3 independent curves suffice to show curve- and
      target-independence, and the 5 null seeds bound the null's own
      spread.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 10
    maximum_workers: 1
    notes: >-
      One run = one (m, s) cell over all curves, targets, primes and arms
      (6 cells) plus the H-WIL and H-TOP checks (1 run each) and re-runs.
      Every cell is seconds to minutes; the budget is sized to the work with
      headroom, above the template floors.
  stages:
    - id: stage-0-derivation-and-fixture
      purpose: 'hand fixture at s = 2; frozen prediction file; H-TOP symbolic check at m = 3'
      dominant_operation: writing and symbolic algebra
      machine_compute: seconds (resultant)
    - id: stage-1-deciding-cell
      purpose: 's = 2 gate, then s = 3 with NULL-1, NULL-2, NULL-3; H-WIL check'
      dominant_operation: exact rank over F_p on 64 columns
      machine_compute: seconds
    - id: stage-2-ladder-and-nearby
      purpose: 's in {4, 5, 6}; mixed-block and non-monomial nearby objects at s = 3'
      dominant_operation: exact rank over F_p on up to 4096 columns
      machine_compute: minutes
    - id: stage-3-m3-secondary
      purpose: 'm = 3, s in {4, 5} (gated on H-TOP)'
      dominant_operation: exact rank over F_p on up to 32768 columns
      machine_compute: minutes to an hour
    - id: stage-4-analysis
      purpose: 'residuals and verdict'
      dominant_operation: writing
      machine_compute: none required
  stopping_rules:
    - >-
      Stop before the deciding cell if the s = 2 hand fixture or the shared
      meter's known answer fails; record the instrument finding.
    - >-
      Stop after the deciding cell if P1 (d_ff = 5) or P2 (fall_dim = 4)
      fails on any Semaev draw, or if NULL-2 differs from the Semaev arm:
      report the cell; do not run the ladder; the failing integer is the
      result.
    - >-
      Skip Stage 3 if the H-TOP symbolic check fails at m = 3; report the
      failure and scope the derivation to m = 2.
    - >-
      Stop when all planned cells have a terminal state; no iteration or
      tuning.
  invalidation_rules:
    - >-
      A timeout, OOM or crash on any cell is failed_infrastructure and is
      never evidence about the closed form.
    - >-
      A run whose shared meter has not passed the p = 2 known answer and
      the planted-syzygy positive control in the same manifest lineage is
      invalid.
    - >-
      A planted target whose certificate fails independent re-addition
      invalidates that draw.
    - >-
      Any d_ff read from a Groebner output degree or from a CAS termination
      event, rather than from exact fall_dim, invalidates the cell.
    - >-
      A cell run with a D_max below D_null + 1 cannot report a null d_ff
      and is censored, not evidence.
  success_criterion: >-
    ALL of, at the deciding cell (2, 2, 3): (1) every Semaev draw has
    d_ff = 5 and fall_dim = 4; (2) NULL-2 equals the Semaev arm on both
    integers at every draw; (3) NULL-1 has d_ff = 6 in the majority of seeds
    with no seed below 6; (4) the mixed-block nearby object has d_ff = 6;
    (5) the H-WIL direct rank table is full-rank at every (s, j, p). Then
    the closed form is verified at the deciding cell, the first fall
    carries no curve information there, and 84cdb7's H1 is refuted at d = 2
    by derivation-plus-check; the ladder cells extend the same criterion to
    s in {2, 4, 5, 6}. This changes no hypothesis status by itself; the
    Coordinator decides after independent review.
  falsification_criterion: >-
    ANY of: F1 -- a Semaev draw at the deciding cell with d_ff != 5 or
    fall_dim != 4 (the derivation fails at that cell; below 5 means a
    non-tensor annihilator exists; above 5 is an instrument finding first);
    F2 -- NULL-2 differs from the Semaev arm on any draw (the first fall
    carries curve or target information, the RQ's degree column gets a
    lead, routed to re-run and review); F4 -- NULL-1 falls at 5 (the
    observable is a degree-profile property); F5 -- the mixed-block object
    returns 5 (the method cannot distinguish block structure from degree
    profile); an H-WIL rank below the maximum (exactness withdrawn at that
    cell). Each is a negative outcome decidable from the primary metrics.
  required_artifacts:
    - 'experiments/EXP-PFDR-5726af/runs/<run-id>/manifest.yaml (command, commit, dirty-tree hash, environment, seeds, parameters, inference block, timing, peak RSS, per-file sha256)'
    - 'experiments/EXP-PFDR-5726af/runs/<run-id>/raw-result.json (per-draw rank profiles, d_ff, fall_dim per arm, residuals, sol(D), certificate results)'
    - 'experiments/EXP-PFDR-5726af/runs/<run-id>/stdout.log and stderr.log'
    - 'experiments/EXP-PFDR-5726af/stage0-predictions.yaml (the frozen prediction file, written before any rank, with its sha256 recorded in every manifest)'
    - 'experiments/EXP-PFDR-5726af/stage0-htop.md (the S_4 top-form symbolic check and the s = 2 hand fixture)'
    - 'experiments/EXP-PFDR-5726af/analysis.md (residual table, null tables, nearby-object table, H-WIL table, verdict against the frozen criteria)'
  interpretation_limits:
    - >-
      A first fall degree is not a solving degree, not a cost, and not an
      exponent; nothing on any attack axis moves.
    - >-
      Exactness rests on Wilson's theorem at snippet level and on the H-WIL
      direct check at s <= 8; the upper bound is unconditional given H-TOP.
    - >-
      Scoped to d = 2, s >= 2, 2^s <= p, p in {4099, 65537}; p-independence
      is EXP-PFDR-fd901a's business.
  id_allocation_provenance: >-
    EXP-PFDR-5726af pre-allocated by the tasking Coordinator in
    TASK-20260903-b5d2ae (second experiment id, in order). No state was
    scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before this contract is relied on.
