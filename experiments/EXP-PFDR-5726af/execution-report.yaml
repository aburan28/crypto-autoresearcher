execution_report:
  experiment_id: EXP-PFDR-5726af
  hypothesis_id: H-PFDR-4148b8
  task_id: TASK-20260903-b0727c
  implementation_commit: 3a9c1b0257923bf7772b811963beaf57d67aa713
  implementation_commit_note: 'HEAD at the time of every run (recorded in each manifest code.commit, dirty:
    false); the implementation files are untracked at that commit and pinned by sha256 in each manifest
    code.source (all_pinned: true). HEAD moved to 1b49d4911bfe21dfc0c36d2541651a54ae75ffcd by another
    session after the last run and before this report was written; that commit touches neither harness/
    nor experiments/EXP-PFDR-5726af/ (checked with git diff --stat).'
  stage0_predictions_sha256: e5198d84094fa299933e0f8bbe6c7bcc41e37cce42a9d58854ce5df6cf339e94
  meter_commit: 2d2083e5
  protocol_deviations:
  - id: D-RUNS-10
    text: One run per (m, s) cell plus H-WIL, H-TOP and the nearby objects would be 11 against maximum_runs
      10; the contract's budget note counts the s = 2 gate as the s = 2 cell, so the full (2, 2, 2) cell
      (12 draws, both nulls) was computed inside the gate run RUN-PFDR-5726af-m2-s2-gate, before the deciding
      cell. Zero re-run headroom remained; none was needed.
  - id: D-STOP-FIRST
    text: 'At (2, 2, 6) and both m = 3 cells every arm is computed in increasing D and stops at the first
      fall (or at D_max = D_null + 1). The primary metrics are unaffected; the secondary full rank profile
      is truncated at d_ff for those cells (per-draw D_max_computed recorded). Motivated by the per-run
      cap: the scratch benchmark put the s = 6 null arms at ~33 s per system to D_max, ~4000 s for 120
      null systems.'
  - id: D-NULL2-ONCE
    text: The block-factored null has no curve or target input; with the frozen seeds used verbatim it
      was computed once per (p, seed) (5 objects per prime) and reported per draw by reference, instead
      of 60 repeats of the same 5 polynomials. NULL-1 (support depends on the draw) was computed per draw.
  - id: D-HTOP-CAS
    text: Sage is absent; the S_4 resultant was computed exactly with sympy 1.14 over Z[a, b, x_R]. The
      contract names no CAS; the handoff constraint says missing Sage is failed_infrastructure for that
      stage. Recorded completed_valid with this disclosure; Stage 3 was run on the strength of the sympy
      check. Re-labelling is the Coordinator's call.
  - id: D-TESTS-ORDER
    text: tests/test_macaulay_fp.py (52 passed) was run in this session after the four Stage 0/1 runs
      and during Stage 2, not before the first official run; the meter sha256s in every manifest equal
      VALIDATION.md's.
  - id: D-SCRATCH
    text: One scratch timing benchmark of the meter preceded the prediction file (ad-hoc curve, s in {3..6},
      p = 4099); dry runs of every subcommand into the scratchpad and one m = 3 scratch benchmark followed
      it. None is a run record; the predictions are the contract's formulas verbatim.
  - id: D-PRED-DRAFT
    text: The first draft of stage0-predictions.yaml (replaced within a minute, before any official rank)
      mis-evaluated a_0 at s = 3 and 5 and flagged a spurious discrepancy; the final file discloses this.
  - id: D-FIXTURE-NOT-SHARED
    text: 'The ''frozen fixture shared with EXP-PFDR-fd901a'' (p = 4099, curve seed 1101, target seed
      1) is not the same instance in the two executions because neither contract froze the curve/target
      construction: here a = 527, b = 72, x_R = 2374; in fd901a''s package a = 941, b = 428, x_R = 3690.
      Rank profiles at D = 4..6 agree exactly (full 1, 6, 15; top 1, 2, 1; fall 0, 4, 14).'
  - id: D-MIXED-READING
    text: NEARBY-MIXED-BLOCK read as x_k = sum over all six digit variables with random nonzero coefficients
      (shared variables); the literal 3-shared-variable reading is degenerate (ell_1^2 ell_2^2 vanishes)
      and was recorded, not run.
  - id: D-NONMONO-COLLAPSE
    text: 'NEARBY-NON-MONOMIAL-TOP x_1^2 x_2^2 + x_1^4 at s = 3: ell_1^4 has no degree-4 part in three
      squarefree variables, so the substituted top form collapses to x_1^2 x_2^2; both readings run and
      reported; the object does not realise a non-monomial top form at s = 3.'
  - id: D-INFERENCE
    text: AUTORESEARCH_POLICY deliberately unset for run processes (the adapter would otherwise assert
      model_verified true for claude-sonnet-5); the session inference block is in every manifest under
      inputs.parameters.session_inference.
  - id: D-GIT-READONLY
    text: Read-only git commands (rev-parse, status, log, diff, show) were run by the wrapper and the
      script to record provenance; no git write, no commit.
  - id: D-PACKAGE-SIDECAR
    text: Each run directory carries a seventh file package-sha256.json (per-file sha256 of the six required
      files), written by the script immediately after the wrapper returned, because a manifest cannot
      contain its own hash.
