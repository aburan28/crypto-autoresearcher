  anomalies:
  - id: A-NULL2-BOUNDARY-FALLDIM
    text: 'At the two boundary cells (d_ff = D_null: (2,2,2) and (3,2,4)) the block-factored null reproduces
      d_ff exactly but NOT fall_dim (1 versus 4 and 1 versus 12), while at every strict-early-fall cell
      both integers coincide. Mechanism visible in the rows: the null is homogeneous, its unique top monomial
      per block product is prod_k (a_{k,0}...a_{k,s-1}) times a constant at these s = e cells, and every
      row a_i * g collapses to the SAME monomial in B (a^2 = a), giving full_rank 1; the Semaev rows carry
      sub-top terms and are independent. So fall_dim as measured by the meter (rank of the fallen rows
      in B) depends on sub-top terms whenever the top-form kernel elements collapse onto few monomials;
      d_ff does not. Reported as observation for the Reviewer; not interpreted here.'
  - id: A-ARCHIVED-PROFILE-CITATION
    text: The derivation's m = 3 inference cites '[4, 4, 4, 12]' as a per-variable profile; the archived
      table lists generator degrees (three |FB| = 4 membership polynomials and S_4). The symbolic check
      passed regardless.
  - id: A-FIXTURE-NOT-SHARED
    text: 'See D-FIXTURE-NOT-SHARED: same seeds, different instances across the two concurrent executions;
      identical profiles.'
  - id: A-NSOL-6
    text: At (2,2,5), p = 4099, curve seed 1101, target seed 2, the target has N_sol = 6 solutions in
      {0,1}^10 (six window decompositions); all other draws have 1 or 2. d_ff and fall_dim unaffected.
  - id: A-CONCURRENT-EXECUTOR
    text: One other executor (EXP-PFDR-fd901a) ran concurrently on the shared 4-core host; wall times
      may include contention; every run stayed far inside its cap.
  - id: A-HEAD-MOVED
    text: Repository HEAD advanced from 3a9c1b02 to 1b49d491 during the task (another session; the concurrent
      executor lineage). All ten manifests record 3a9c1b02; no path this task reads or writes changed.
