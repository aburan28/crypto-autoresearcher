stage0_predictions:
  experiment_id: EXP-PFDR-5726af
  hypothesis_id: H-PFDR-4148b8
  task_id: TASK-20260903-b0727c
  written_at: '2026-09-03'
  written_before_any_official_rank: true
  frozen: true
  source: >-
    Copied from the frozen contract experiments/EXP-PFDR-5726af/specification.yaml
    (inputs.frozen_prediction_file, preregistered_prediction, controls) and
    H-PFDR-4148b8 (D4)-(D5). Nothing here is adjusted after runs begin; a
    needed change is a versioned protocol_amendment requested from the
    Coordinator, never an edit of this file.
  disclosures:
    - >-
      Before this file was written the Executor ran ONE scratch timing
      benchmark of the shared meter (harness/macaulay_fp) on m = 2, s in
      {3, 4, 5, 6} at p = 4099 with an ad-hoc curve (a = 17, b = 23,
      x_R = 5) and one support-matched null seed, to size the per-run budget
      (s = 6 null arms cost about 33 s per system). That benchmark printed
      rank profiles. The predictions below are the contract's formulas
      verbatim and could not be and were not adjusted by it; the benchmark
      is disclosed here and in implementation.md and is not a run record.
    - >-
      A first draft of this file (written and replaced within the same
      minute, before any official rank) mis-evaluated a_0 at s = 3 and s = 5
      (the Executor computed floor((s - e)/2) as floor(s/2)) and wrongly
      flagged a formula-versus-listed-number discrepancy. Re-evaluating
      floor((3 - 2)/2) + 1 = 1 and floor((5 - 2)/2) + 1 = 2 gives fall_dim
      4 and 10, exactly the contract's listed integers. No discrepancy
      exists; the draft is disclosed so the file's history is not hidden.
  formulas:
    e: '2^{m-1}'
    a_0: 'floor((s - e)/2) + 1'
    d_ff: 'm e + a_0 = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1'
    D_null_this_contract: 'floor((m s + m e)/2) + 1'
    D_null_84cdb7_convention: 'ceil((m s + 2 m)/2)   (named wherever compared; differs by one when m s + 2 m is even)'
    fall_dim: 'm [binom(s, a_0) - binom(s, a_0 + e)]'
    hwil_rank: 'min(binom(s, j), binom(s, j + 2)) for multiplication by ell^2 from degree j to j + 2 on F_p[a_1..a_s]/(a_i^2), p > s'
  cells:
    - {m: 2, s: 2, e: 2, a_0: 1, d_ff: 5, D_null: 5, D_null_84cdb7: 4, fall_dim: 4, gap: 0, note: 'boundary cell, no strict early fall; CTRL-S2-HAND-FIXTURE gate'}
    - {m: 2, s: 3, e: 2, a_0: 1, d_ff: 5, D_null: 6, D_null_84cdb7: 5, fall_dim: 4, gap: 1, note: 'DECIDING CELL'}
    - {m: 2, s: 4, e: 2, a_0: 2, d_ff: 6, D_null: 7, D_null_84cdb7: 6, fall_dim: 10, gap: 1}
    - {m: 2, s: 5, e: 2, a_0: 2, d_ff: 6, D_null: 8, D_null_84cdb7: 7, fall_dim: 10, gap: 2}
    - {m: 2, s: 6, e: 2, a_0: 3, d_ff: 7, D_null: 9, D_null_84cdb7: 8, fall_dim: 28, gap: 2}
    - {m: 3, s: 4, e: 4, a_0: 1, d_ff: 13, D_null: 13, D_null_84cdb7: 12, fall_dim: 12, gap: 0, note: 'secondary, gated on CTRL-H-TOP-SYMBOLIC; boundary cell at m = 3'}
    - {m: 3, s: 5, e: 4, a_0: 1, d_ff: 13, D_null: 14, D_null_84cdb7: 13, fall_dim: 12, gap: 1, note: 'secondary, gated on CTRL-H-TOP-SYMBOLIC'}
  fall_dim_arithmetic:
    - 'm=2,s=2: a_0 = floor(0/2)+1 = 1; 2 [C(2,1) - C(2,3)] = 2 [2 - 0] = 4'
    - 'm=2,s=3: a_0 = floor(1/2)+1 = 1; 2 [C(3,1) - C(3,3)] = 2 [3 - 1] = 4'
    - 'm=2,s=4: a_0 = floor(2/2)+1 = 2; 2 [C(4,2) - C(4,4)] = 2 [6 - 1] = 10'
    - 'm=2,s=5: a_0 = floor(3/2)+1 = 2; 2 [C(5,2) - C(5,4)] = 2 [10 - 5] = 10'
    - 'm=2,s=6: a_0 = floor(4/2)+1 = 3; 2 [C(6,3) - C(6,5)] = 2 [20 - 6] = 28'
    - 'm=3,s=4: a_0 = floor(0/2)+1 = 1; 3 [C(4,1) - C(4,5)] = 3 [4 - 0] = 12'
    - 'm=3,s=5: a_0 = floor(1/2)+1 = 1; 3 [C(5,1) - C(5,5)] = 3 [5 - 1] = 12'
  scored_against:
    semaev_arm:
      '(2,2,2)': {d_ff: 5, fall_dim: 4}
      '(2,2,3)': {d_ff: 5, fall_dim: 4}
      '(2,2,4)': {d_ff: 6, fall_dim: 10}
      '(2,2,5)': {d_ff: 6, fall_dim: 10}
      '(2,2,6)': {d_ff: 7, fall_dim: 28}
      '(3,2,4)': {d_ff: 13, fall_dim: 12}
      '(3,2,5)': {d_ff: 13, fall_dim: 12}
    null_2_block_factored: 'identical (d_ff, fall_dim) to the Semaev arm at every cell, every draw, every seed (forced 0 difference)'
    null_1_support_matched:
      '(2,2,2)': {d_ff: 5}
      '(2,2,3)': {d_ff: 6}
      '(2,2,4)': {d_ff: 7}
      '(2,2,5)': {d_ff: 8}
      '(2,2,6)': {d_ff: 9}
      '(3,2,4)': {d_ff: 13}
      '(3,2,5)': {d_ff: 14}
      rule: 'd_ff = D_null in the majority of seeds with no seed below D_null (success criterion 3 at the deciding cell)'
    null_3_curve_target_scramble: 'identical d_ff and fall_dim across all curves and targets at fixed (m, s)'
    nearby_mixed_block_s3: {d_ff: 6, rule: 'at least 1 above the Semaev value 5; 5 is F5'}
    nearby_non_monomial_top_s3: {d_ff: 'between the block value 5 and D_null 6; reported, non-blocking'}
    hwil: 'rank = min(binom(s,j), binom(s,j+2)) at every (s, j, p), s in 2..8, p in {4099, 65537}; tail check: the square maps j + 2 = s - j'
    htop_m3: 'top homogeneous part of S_4(x_1, x_2, x_3, x_R) in (x_1, x_2, x_3) is exactly c x_1^4 x_2^4 x_3^4 with c a nonzero integer constant (not a polynomial in a, b, x_R); c nonzero mod 4099 and mod 65537'
    ladder_gap_tail_check: 'D_null - d_ff = 1, 1, 2, 2 at s = 3, 4, 5, 6 (ceil(s/2) - 1)'
  s2_hand_fixture:
    statement: >-
      At m = 2, s = 2 with ell_1 = a_{1,0} + 2 a_{1,1}, ell_2 = a_{2,0} +
      2 a_{2,1}: the degree-4 part of S_3(ell_1, ell_2, x_R) in the
      squarefree algebra A = F_p[a]/(a^2) is ell_1^2 ell_2^2 = (2 a_{1,0}
      2 a_{1,1}) (2 a_{2,0} 2 a_{2,1}) = 16 a_{1,0} a_{1,1} a_{2,0} a_{2,1}
      (since a_i^2 = 0, ell_1^2 = 2 . 1 . 2 . a_{1,0} a_{1,1} = 4 a_{1,0}
      a_{1,1}); multiplication by it maps A_1 to A_5 = 0 (n = 4), so it
      kills A_1 and, being nonzero, not A_0. Hence a_0 = 1, d_ff = 4 + 1 = 5
      = D_null = floor(8/2) + 1, fall_dim = 4 (the four rows a_i S~ are
      independent and all have zero top part).
    expected: {degree_4_part: '16 a10 a11 a20 a21', d_ff: 5, D_null: 5, fall_dim: 4}
