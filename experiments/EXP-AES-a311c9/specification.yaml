experiment:
  id: EXP-AES-a311c9
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-AES-a2b3ab
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: the domination margin function D(h) for the
    r=6 hinted partial-sums construction, re-measured in one binary across
    h in {12..15}, with the sub-h=12 region declared OUT OF ENVELOPE

  objective: >-
    If separately approved, frozen and authorized: rebuild sq_null.c's
    attack6n pipeline from committed source, implement a matched brute-
    force-over-residual arm in the SAME binary and AES-NI path, measure
    D(h) = log2(brute-force seconds) - log2(structured-attack seconds) for
    h in {12,13,14,15} over 3 independent (key, seed) instances each, run
    the falsified-hint sibling control and the r=5 decay/decoy control, and
    report the monotone curve plus the explicit region h<=11 as OUT OF
    ENVELOPE / DEFERRED_UNBOUNDED. This contract is an instrument design and
    a pre-execution declaration. No run has happened.

  what_this_is_not:
    - Not a new attack, not a key-recovery claim beyond what EV-AES-005 already established.
    - Not a status change to the existing DOMINATED verdict on the r=6 mode or the r=7 non-recovery.
    - Not a claim about full-round or deployed AES under any outcome.
    - Not a comparison to published cryptanalysis in either direction.
    - Not an approval, freezing, execution authorization, run, observation, or evidence.

  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: >-
      MEDIUM for the measured cost comparison of two constructions on this
      machine; the AES-facing part capped at TOY and no full-round
      transcription. A completed run could support, at most: (1) D(h) at
      h in {12,13,14,15}, measured in one binary; (2) reproduction of the
      committed h=12 anecdote within instance-to-instance spread; (3) the
      h=16 known-answer gate; (4) the falsified-hint and r=5 decoy controls.
      NOTHING ELSE. No claim about h<=11, which is recorded OUT OF ENVELOPE
      / DEFERRED_UNBOUNDED, never estimated.

  inputs:
    cipher: "AES-128, C1 reduced-round convention"
    round_count: 6
    construction: "existing attack6n pipeline (TASK-20260802-9dcca8/sq_null.c), rebuilt from committed source with recorded flags"
    hint_bytes_h: [12, 13, 14, 15]
    residual_candidate_spaces: ["2^32", "2^24", "2^16", "2^8"]
    known_answer_gate_h16: "whole last-round key given, residual is a single candidate, brute-force arm must measure exactly one confirmation"
    known_answer_gate_h12: "must reproduce the committed 69.39s / ~25s pair to within measured instance-to-instance spread"
    seeds:
      master_seed: a311c9001
      domain: "EXP-AES-a311c9/v1"
      seed_derivation_rule: >-
        ASCII bytes of domain || "|" || label || "|" || decimal(h) || "|" ||
        decimal(instance), hashed SHA-256, digest interpreted big-endian and
        reduced by rejection sampling. Labels are exactly one of
        {"true-hint","falsified-hint","r5-decoy"}.
    independent_target_keys_minimum: 3

  arms_and_controls:
    treatment: "structured attack6n arm at each h, measured cost"
    measured_baseline: "matched brute-force-over-residual arm, SAME binary, SAME AES-NI path, SAME confirmation criterion"
    sibling_null: "falsified-hint arm at every h; the pipeline already supports true vs falsified hint arms; must produce an empty survivor set"
    decay_decoy_control: "r=5 D(h) measurement, where a certified unhinted recovery exists at 25.66s; D(h) must be dominated by the unhinted attack at every h"
    known_answer_gates: ["h=16 single-candidate gate", "h=12 committed-pair reproduction gate"]
    comparability_policy: >-
      No cross-record comparison: the discrepancy between the committed
      ~25s figure (measured under its own conditions) and this contract's
      re-measured brute-force arm is itself charged as a reason both arms
      are re-measured together in one binary, never compared across records.

  stages_cheapest_first:
    - id: stage-1-rebuild-and-h16-gate
      cost: "minutes"
      content: "Rebuild sq_null.c from committed source; run the h=16 single-candidate known-answer gate."
      can_terminate_run: true
      termination_rule: "h=16 gate failing ends the contract here; residual accounting is wrong, nothing else may be read."
    - id: stage-2-h12-reproduction-gate
      cost: "~2 minutes (structured ~70s + brute-force ~57s, one instance)"
      content: "Reproduce the committed h=12 pair (69.39s / ~25s) within measured spread."
      can_terminate_run: true
      termination_rule: "Failure to reproduce within spread voids the evaluator; the record that cannot reproduce the one point it generalises is void."
    - id: stage-3-full-sweep-and-controls
      cost: "~35 min single core for the 4-h x 3-instance x 2-arm sweep, plus ~20 min for falsified-hint and r=5 decoy controls"
      content: "Full D(h) curve, falsified-hint sibling null at every h, r=5 decay/decoy control."
      can_terminate_run: false
      termination_rule: "Budget ceiling halts the sweep at the point reached; partial coverage is reported, never estimated. h<=11 is never attempted and is recorded OUT OF ENVELOPE / DEFERRED_UNBOUNDED, not estimated."

  metrics:
    primary:
      - "D(h) = log2(brute_force_seconds) - log2(structured_seconds), per h."
      - "structured_seconds and brute_force_seconds, median over 3 instances, per h."
    secondary:
      - "falsified-hint survivor-set size, per h (must be 0)."
      - "r=5 D(h) against the unhinted 25.66s reference."

  heuristic_under_test: HEUR-AES-a2b3ab-1

  preregistered_prediction:
    quantity: "D(h) at h in {12,13,14,15}; monotonicity; sign."
    formula: "D(h) strictly decreasing in h; D(h) < 0 for every h in {12,...,15}; D(12) reproduces the committed 69.39s/~25s pair within spread."
    source: "Derived in H-AES-a2b3ab mechanism section from the residual-shrinkage-vs-filtering-reduction argument. No external source cited."

  scale_relevance:
    tier: medium
    justification: >-
      A claim about the measured cost of two constructions on this machine,
      at r=6 only; the AES-facing part is capped at toy. The region h<=11 is
      explicitly OUT OF ENVELOPE / DEFERRED_UNBOUNDED and this contract does
      not attempt to measure or estimate it -- that boundary is carried
      verbatim from the source catalogue entry into this scale_relevance
      block and into stopping_rules below.
    correspondence: null

  tail_checks:
    - "h=16 single-candidate gate: exact one confirmation, time known in advance to timer noise."
    - "h=12 committed-pair reproduction within measured spread."
    - "falsified-hint arm: empty survivor set at every h, no exceptions."

  replication:
    seeds: [a311c9001, a311c9002, a311c9003]
    independent_instances: 3
    interpretation: "3 independent (key, seed) instances per h, median and IQR reported for both arms."

  budget:
    wall_clock_seconds_per_run: 3300
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, archived, and authorized under a GOAL-AES-003 batch.
    - Stop before any h-sweep number is read if the h=16 gate or the h=12 reproduction gate fails.
    - Stop the whole package if the falsified-hint arm ever produces a non-empty survivor set.
    - Never attempt h<=11; that region is OUT OF ENVELOPE / DEFERRED_UNBOUNDED by design, not a stopping condition reached by failure.
    - Stop at the first budget, memory, or wall-clock ceiling and record what was covered rather than truncating silently.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any change to the h grid, the confirmation criterion, or the decision rule after any number has been observed.
    - Comparing the brute-force arm's measured cost against the committed ~25s figure instead of against the SAME-binary re-measurement.
    - Estimating any value for h<=11 rather than declaring it out of envelope.

  success_criterion: >-
    This contract has no current success outcome because it is not authorized
    for execution. IF a separately approved, frozen successor is executed,
    its only positive disposition is: h=16 gate passes exactly; h=12
    reproduces the committed pair within spread; D(h) is reported for every
    h in {12,...,15} with its instance-to-instance spread; the falsified-
    hint arm is empty at every h; the r=5 decoy control shows dominance by
    the unhinted attack at every h; and h<=11 is recorded OUT OF ENVELOPE /
    DEFERRED_UNBOUNDED. THIS DISPOSITION MAKES NO STATUS CHANGE TO THE
    EXISTING DOMINATED VERDICT AND NO STATEMENT ABOUT FULL-ROUND OR DEPLOYED
    AES.

  falsification_criterion: >-
    H-AES-a2b3ab is falsified, in whole or in the named part, by any of:
    (a) D(h) non-monotone over {12,...,15} -- the h=12 domination reading is
    an artifact of that hint budget and the committed verdict must be
    re-scoped; (b) D(h) > 0 at any measurable h -- the first non-dominated
    hinted construction in this repository, reported with REF-B named in the
    same sentence and the published frontier declared unadjudicable; (c) the
    h=16 gate failing -- instrument void.

  outcomes:
    no_execution_authorization: "The only current disposition: a review_required draft. No run, no observation, no evidence."
    future_complete_readout: "Only after separate approval, freezing, authorization and valid execution under a GOAL-AES-003 batch; medium-tier, r=6-only result, no status change to the existing DOMINATED verdict under any outcome."
    infrastructure_or_integrity_failure: >-
      A timeout, crash, or missing dependency is INFRASTRUCTURE SIGNAL and is
      NEVER negative mathematical evidence against H-AES-a2b3ab (AGENTS.md
      rule 5).

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Raw per-instance records: (h, instance, arm, seconds, confirmation_result), one JSON object per line.
    - The h=16 gate log and the h=12 reproduction gate log.
    - The falsified-hint survivor-set log and the r=5 decoy-control log.
    - Manifest, environment, exact argv, stdout, stderr, timestamps, resource measurements.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms the h=16 and h=12 known-answer gates can actually fail.
    - Independent review confirms the falsified-hint sibling control and r=5 decoy control are correctly specified.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - A GOAL-AES-003 batch exists to host the dispatch, and max_concurrent constraints across all three active AES goals are honored (batch waits rather than runs degraded).

  approval_status: >-
    Pending review. No approved_by field is present because this draft is
    not approved and only the Coordinator may approve it (AGENTS.md rule 1).
