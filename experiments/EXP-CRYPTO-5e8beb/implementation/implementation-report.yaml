  scientific_execution_authorized: false

  scientific_runs: 0
  fixtures_evaluated: 0
  group_operations_measured: 0
  independent_reviews_obtained: 0

  files_produced:
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/fixtures.py
      role: Literal laws/partitions/order, SHA256 rejection-shuffle generation, cell sizes, descriptors, duplicate reporting.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/kernels.py
      role: Exact transition rows, same-fiber pair TV certificates, delta_l / joint delta / per_operation_max.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/transcripts.py
      role: Producer full-history DP, representative simulator, assumption-trap law.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/reference.py
      role: Independent fixture/law/latent-path reconstruction; imports no producer helper.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/certificates.py
      role: Canonical fraction/table serialization, witnesses, hashing, expected artifact/count index, status taxonomy.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/driver.py
      role: Guarded future scientific entry point, launch admission gate, LUMP1 transport, native/Docker plan builders.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/runtime_preflight.py
      role: Source-only checkpoint/memory/worker constant checks; fails closed on protection establishability.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/README.md
      role: Full protocol-to-code map, independence discipline, negative-branch and review/launch boundary notes.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/implementation-manifest.yaml
      role: sha256 of every implementation file and available source input; source/dirty-tree state.
    - path: experiments/EXP-CRYPTO-5e8beb/implementation/implementation-report.yaml
      role: This report.

  static_checks_performed:
    - check: python3 -m py_compile on every .py file (syntax only)
      result: pass
      note: >-
        This compiles bytecode without executing any module-level statement
        and without importing, calling or invoking any fixture, kernel,
        transcript, hashing or transport function. It is not scientific
        execution and it evaluated zero fixtures.
    - check: manual cross-reference of every spec field against implementing code
      result: recorded in README.md's protocol-to-code map
    - check: sha256 cross-check of tools/audit_process.py against source-packet.json's recorded input_sha256
      result: match (bee7848b...c9c9f5154100c9677)

  source_coverage_against_specification:
    fixture_definition: complete
    kernels: complete
    quantities: complete
    computation.producer: complete
    computation.independent_checker: complete
    computation.certificates: complete
    assumption_trap: complete
    controls: complete (generic machinery; no control is hardcoded to a fixed passing value)
    panel_advantage_scoring: partial
    ordering: complete
    fixed_counts: complete (certificates.expected_counts() recomputes and can be diffed against specification.fixed_counts)
    artifacts: complete (path/filename layout only; no file is created)
    runtime: complete (interface/admission/transport definitions only; no execution path implemented)

  design_deviations:
    - id: DEV-1
      area: panel_advantage_scoring
      description: >-
        This task implements every certificate the 32 restricted comparison
        panels and 16 paired qualifiers need (kernels.KernelCertificate's
        delta/delta_l/per_operation_max per partition and kernel), but does
        not assemble a standalone "score 32 panels, apply the >=1/8 mean-gap
        and >=24/32 strict-win thresholds, enumerate 16 paired qualifiers"
        function. The module_responsibilities for the ten declared files do
        not name a dedicated scoring module, and fabricating one outside the
        declared write_scope was avoided; README.md documents the intended
        boundary (a later scientific task's driver composes these
        certificates using the frozen unmodified thresholds).
      classification: not a protocol violation; a scope boundary the executor
        chose not to cross without a corresponding declared file.
      impact: None on the ten deliverables; the scientific driver that consumes
        these certificates still needs this composition step before a run.
    - id: DEV-2
      area: certificates.py output identity
      description: >-
        implementation-manifest.yaml cannot record this file's own final
        sha256 (a file cannot hash its completed self mid-write), nor can it
        record implementation-report.yaml's hash (written after the
        manifest). Both are covered by the Coordinator's snapshot archive's
        content-first path_sha256 verification instead.
      classification: unavoidable ordering constraint, recorded rather than hidden.

  impediments: []

  bedrock:
    selected: false
    configured: false
    probed: false
    contacted: false
    used: false

  inference:
    requested_policy: executor-implementation
    requested_reasoning_effort: null
    self_reported_model: claude-sonnet-5
    fallback_used: false
    degraded_used: false
    independent_session_required: false

  review_status: pending
  launch_status: pending
  knowledge_promotion: not_applicable_at_this_stage

  executor_assessment:
    protocol_complete: true
    protocol_complete_note: >-
      All ten declared deliverables are present and map to every
      specification field except the standalone panel-scoring composition
      (DEV-1), which is a later scientific task's responsibility, not a gap
      in this implementation's declared file set.
    data_quality: not_applicable
    data_quality_note: No data was produced or measured; scientific_runs is 0.
    requires_rerun: false
