  design_deviations:
    - id: DEV-3
      area: dependencies
      description: >-
        This task adds PyYAML (`import yaml`) as a runtime dependency of
        driver.py and runtime_preflight.py's caller, departing from
        implementation/'s python_stdlib_only: true. This is required to
        genuinely parse the approved spec's and implementation manifest's
        YAML content per C10's own requirement ("parse the approved spec
        file's YAML"). PyYAML 6.0.1 was already installed in the executing
        environment; this task did not install any package.
      classification: necessary consequence of closing C10 as specified; disclosed, not hidden.
      impact: implementation-v3/ is no longer stdlib-only; a future launch host must have PyYAML available.
    - id: DEV-4
      area: check_protection_establishable native-path readiness basis
      description: >-
        native_backend_viable (and hence, on hosts without a working Docker
        daemon, the aggregate ready_for_scientific_launch) is based on a
        successful READ-BACK of RLIMIT_AS/RLIMIT_CPU only, not on an actual
        attempted-and-verified SET of a tighter limit, because that set
        cannot be safely reversed without elevated privilege (see
        runtime_preflight_observations.rlimit.note). This is weaker evidence
        than "a hard protection boundary was actually established and
        verified here," and is disclosed as such in both the probe's own
        `reason` string and this report.
      classification: disclosed limitation of a side-effect-free probe, not a defect.
      impact: >-
        A future real launch preflight should still perform its own
        setrlimit-and-verify step immediately before fixture work (as
        specification.runtime.native.resource_guard requires); this task's
        probe result does not substitute for that.
    - id: DEV-2 (carried forward from implementation/)
      area: certificates.py / manifest / report output identity
      description: >-
        implementation-manifest.yaml cannot record this file's own final
        sha256, nor implementation-report.yaml's hash (written after the
        manifest). Both are covered by the Coordinator's snapshot archive's
        content-first path_sha256 verification instead.
      classification: unavoidable ordering constraint, recorded rather than hidden.

