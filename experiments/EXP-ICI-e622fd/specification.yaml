experiment:
  id: EXP-ICI-e622fd
  hypothesis_id: H-ICI-063e91
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  source_proposal: IDEA-20260804-027a00
  version: 1
  title: >-
    Isogeny orbit factor-base augmentation test for Semaev index calculus —
    density amplification measurement at toy prime-field ECDLP
  status: review_required
  frozen: false
  claim_tier: toy
  confirmatory_status: exploratory
  objective: >-
    Measure whether the augmented factor base F* = F ∪ phi^{-1}(F), where
    phi: E -> E' is a random ordinary 2-isogeny within the same isogeny class
    as E, has augmentation ratio |F*|/|F| materially above 1. Compare against
    a random-map null control to test whether the isogeny structure provides
    any advantage over an arbitrary bijection.
  preregistered_prediction:
    quantity: augmentation_ratio = |F ∪ phi^{-1}(F)| / |F|
    formula: >-
      Under HEUR-ICI-1 (independence of phi^{-1}(F) and F), expected ratio =
      2 - B/N (same as two independent random subsets of density B/N).
      If the isogeny PERMUTES F, ratio = 1. The H-ICI-063e91 prediction is
      ratio > 1 + epsilon for epsilon that does not vanish with N.
    source: IDEA-20260804-027a00
  controls:
    - id: CTRL-NULL-RANDOM-MAP
      description: >-
        For each (E, F, phi) triple, also compute |F ∪ psi^{-1}(F)| where
        psi is a RANDOM bijection of E(F_p) to itself. Compare the isogeny
        augmentation ratio against the random-map augmentation ratio.
      expected_outcome: >-
        psi gives ratio ≈ 2 - B/N (independence). Isogeny phi gives ratio
        either ≈ 1 (permutes F), ≈ 2-B/N (independent), or something else.
    - id: CTRL-ENDOMORPHISM-NEGATION
      description: >-
        Replace phi with the negation map [-1]: E -> E (which IS an F_p-isomorphism,
        not an isogeny to a different curve). Compute |F ∪ [-1]^{-1}(F)| = |F ∪ (-F)|.
        Since (-F) = {-P : P ∈ F} and -P has the same x-coordinate as P, we have
        (-F) = F exactly. Ratio = 1. This confirms the measurement correctly
        identifies the trivial case.
      expected_outcome: augmentation_ratio = 1.0 for the negation map.
  inputs:
    bits: [20, 24, 28]
    B_fractions: [0.1, 0.2, 0.3]
    replications_per_cell: 10
    seed: 2026080450
  metrics:
    primary:
      - name: augmentation_ratio
        formula: '|F ∪ phi^{-1}(F)| / |F|'
        report_per_cell: true
    secondary:
      - name: random_map_ratio
        formula: '|F ∪ psi^{-1}(F)| / |F| for random psi'
      - name: negation_ratio
        formula: '|F ∪ (-F)| / |F|'  # expected = 1.0
  stopping_rules:
    - >-
      If negation_ratio ≠ 1.0 at any cell: infrastructure failure; halt.
    - >-
      If augmentation_ratio < 0.95 at any cell: record as potential anti-augmentation.
  success_criterion: >-
    augmentation_ratio > 1.05 AND augmentation_ratio > random_map_ratio + 0.01
    at >= 6 of 9 cells (bits x B_fraction). This would indicate the isogeny
    structure provides genuine non-trivial augmentation beyond a random map.
  falsification_criterion: >-
    augmentation_ratio ≤ random_map_ratio + 0.01 at all cells: isogeny provides
    no structural advantage over a random bijection.
  claim_ceiling: >-
    Toy-tier augmentation ratios at bits ∈ {20, 24, 28}. NOT claimable: sub-rho
    ECDLP time exponent; crypto-scale claim; H-ICI-063e91 status above analyzed;
    any asymptotic claim. All four asymptotic promotion gates remain OPEN.
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 1
    maximum_memory_gb: 4
  required_artifacts:
    - experiments/EXP-ICI-e622fd/specification.yaml
    - experiments/EXP-ICI-e622fd/runs/<run_id>/manifest.json
    - experiments/EXP-ICI-e622fd/runs/<run_id>/raw-result.json
    - experiments/EXP-ICI-e622fd/runs/<run_id>/augmentation_table.json
