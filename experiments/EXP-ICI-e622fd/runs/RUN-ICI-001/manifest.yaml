  protocol_deviations:
    - id: DEV-1
      description: >-
        Null control computed by sampling K=10000 random points from F and
        applying [k^{-1}] via Sage scalar mult, rather than full
        enumeration. Full enumeration would require iterating all O(p)
        points for the preimage, which is O(B_frac*N * log N) point
        multiplications and exceeds the per-run budget for bits>=24.
      impact: >-
        Null ratio is an estimate with standard error O(1/sqrt(K)) ≈ 0.01.
        Sufficient to confirm null ≈ 2-B_frac within ±0.02; the primary
        augmentation ratio is computed exactly.
      severity: minor
    - id: DEV-2
      description: >-
        Cell bits=28/B_frac=0.3 produced 10/10 resource_exhaustion outcomes.
        The augmentation computation for threshold=0.3*p≈80M iterations with
        Legendre symbols exceeds the 300s per-run cap in Python. The
        ell-isogeny x-rational-map has degree ell≤23, so polynomial
        evaluation adds significant cost.
      impact: >-
        No augmentation data for the bits=28/B_frac=0.3 cell. Given the
        strong signal from the other 8 cells (aug≈null≈2-B_frac), this
        omission does not change the conclusion.
      severity: minor_resource_limit
    - id: DEV-3
      description: >-
        Cells 1-8 results were collected in the main run (which was
        interrupted by a 2-hour bash timeout before output files were
        written). Cell 9 was re-run in a recovery script. The results from
        cells 1-8 were reconstructed from captured stdout and hardcoded in
        the recovery script. All numerical values match the captured output
        exactly.
      severity: implementation_note

  implementation_note: >-
    Augmentation ratio computed using the identity |F∪phi^{-1}(F')| =
    |F|+|F'|-|F∩phi^{-1}(F')| (valid because phi is bijective on E(F_p) when
    gcd(ell,N)=1 and N is prime). This reduces the dominant loop from O(p) to
    O(B_frac*p) iterations. The x-rational-map r of phi is extracted as a
    rational function of degree ell and evaluated with Horner's method over
    Z/p.

  dominated_by: Pollard rho at exponent 1/2
  sota_delta:
