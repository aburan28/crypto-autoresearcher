  #
  # Every value below is transcribed from manifest.json or from a sibling
  # artifact in this same directory; the source is named for each block.
  # manifest.json is unchanged and remains the primary record. Where the
  # package records no value for a field this manifest carries an explicit
  # null plus a note naming what is absent; nothing is reconstructed,
  # inferred, or estimated.
  # ------------------------------------------------------------------
