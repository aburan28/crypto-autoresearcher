      \ The augmentation computation for threshold=0.3*p\u224880M iterations with\
      \ Legendre symbols exceeds the 300s per-run cap in Python. The ell-isogeny x-rational-map\
      \ has degree ell\u226423, so polynomial evaluation adds significant cost."
    impact: "No augmentation data for the bits=28/B_frac=0.3 cell. Given the strong\
      \ signal from the other 8 cells (aug\u2248null\u22482-B_frac), this omission\
      \ does not change the conclusion."
    severity: minor_resource_limit
  - id: DEV-3
    description: Cells 1-8 results were collected in the main run (which was interrupted
      by a 2-hour bash timeout before output files were written). Cell 9 was re-run
      in a recovery script. The results from cells 1-8 were reconstructed from captured
      stdout and hardcoded in the recovery script. All numerical values match the
      captured output exactly.
