      cells_fully_valid: 8
      cells_with_resource_exhaustion: 1
      replications_per_cell: 10
      negation_control_passed: true
      negation_control_note: >-
        ratio = 1.0 by construction: F includes both (x,y) and (x,-y) for
        each QR x, so (-F) = F
      summary_augmentation_ratio:
