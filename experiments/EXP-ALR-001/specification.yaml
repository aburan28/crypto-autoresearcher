experiment:
  id: EXP-ALR-001
  hypothesis_id: H-ALR-001
  version: 1
  title: AutoLab R182 gcd-equivalent target-subresultant import
  status: approved
  objective: >-
    Archive the verified AutoLab R182 target-divisor subresultant package as an
    immutable crypto-autoresearcher experiment while preserving its finite toy
    scope, charged cost boundary, and open SLP-direct successor.
  inputs:
    source_repo: https://github.com/aburan28/autolab
    source_upstream: https://github.com/autolabhq/autolab
    source_commit: 835c850bf2103e7c67f85614887a2bea9c6e6913
    source_pr: https://github.com/autolabhq/autolab/pull/10
    source_round: R182
    source_harness_state: V131
    import_mode: provenance_pinned_research_receipt
  controls:
    - Replay nine inherited R181 controls and three held-out seed-18206 controls
    - Deduplicate public target points before constructing squarefree chart polynomials
    - Force two x-injective charts with a duplicate-plus-opposite-point adversarial control
    - Compare candidate factors to inherited R181 or fresh R174 executions
    - Give finite density, rank, and exactness no asymptotic lower-bound credit
    - Keep Pollard-rho, Shoup, and breakthrough flags false
  independent_variables:
    - curve_family
    - replay_seed
    - target_chart
  metrics:
    primary:
      - exact_remainder_evaluation
      - norm_zero_iff_subresultant_gcd_nontrivial
      - candidate_factor_replay
      - represented_route_exponent_B
    secondary:
      - remainder_coefficient_density
      - remainder_matrix_rank
      - unit_inverse_certificate_exactness
      - opposite_point_chart_count
  scale_relevance:
    tier: toy
    justification: >-
      All exact controls use small prime fields. They validate the algebraic
      interface and represented cost accounting, not a crypto-scale attack.
    correspondence: null
  replication:
    seeds:
      - 16001
      - 16002
      - 18104
      - 18206
    independent_instances: 12
  budget:
    wall_clock_seconds_per_run: 1000
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 1
  stopping_rules:
    - Stop after exact replay, full source-suite verification, and immutable hash binding
    - Do not launch a new source experiment as part of this import
  invalidation_rules:
    - Any copied source artifact differs from its source-commit SHA-256
    - Any imported claim exceeds the R182 gate or V131 result boundary
    - Any run artifact is mutated rather than superseded by a new RUN id
  success_criterion: >-
    The EXP/RUN package verifies all 11 copied source hashes, binds source commit
    835c850, preserves the 24/35 admission boundary, and passes ledger validation.
  falsification_criterion: >-
    The import verifier or ledger validator rejects the package, or the source
    report claims a rho, Shoup, or breakthrough improvement.
  required_artifacts:
    - specification.yaml
    - implementation.md
    - analysis.md
    - verify_import.py
    - source/<11 pinned R182 and V131 artifacts>
    - runs/RUN-ALR-001-import/manifest.yaml
    - runs/RUN-ALR-001-import/command.txt
    - runs/RUN-ALR-001-import/environment.json
    - runs/RUN-ALR-001-import/stdout.log
    - runs/RUN-ALR-001-import/stderr.log
    - runs/RUN-ALR-001-import/raw-result.json
  assigned_to: executor
  approved_by: coordinator
