experiment:
  id: EXP-ICINV-e908f7
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-6eb96b
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE CONTROL THIS LANE CANNOT BE RUN WITHOUT: the matched null for a within-class variance
    measurement is the GAUGE ORBIT of one curve -- the (p-1)/2 Weierstrass equations of a single fixed
    j -- not a random curve at the same p, because a coordinate-defined factor base is not an isomorphism
    invariant, and every candidate functional in L1 therefore already varies with p, N, t, j and End(E)
    ALL held fixed'
  status: draft
  objective: "(A) THE DEFECT IN THE OBVIOUS DESIGN. RQ-ICINV-475b5e and DECOMPOSITION.md L1 prescribe\
    \ comparing within-class variance against between-class variance and against \"a matched random-curve\
    \ null of the same p\". That null differs from the real arm in THREE ways at once -- it changes\
    \ the trace t, it changes j, and it changes the Weierstrass equation -- so a difference between\
    \ the arms cannot be attributed to any one of them. The within-class arm itself changes TWO things:\
    \ j, and the equation, because a class member is delivered as a pair (a, b) and there are (p-1)/2\
    \ pairs per isomorphism class.\n(B) THE FACT THAT MAKES THIS BINDING, NOT PEDANTIC. Let E: y^2\
    \ = x^3 + a x + b and E_u: y^2 = x^3 + u^4 a x + u^6 b for u in F_p^*. E and E_u are F_p-isomorphic\
    \ via (x, y) -> (u^2 x, u^3 y). They have IDENTICAL p, t, N, #E(F_p), group structure, j, End(E),\
    \ volcano level, embedding degree, class number, automorphism group -- every invariant that T4\
    \ of DECOMPOSITION.md lists as fixed by the class AND every invariant T4 lists as varying within\
    \ it, except the equation itself. And yet:\n    X_{E_u} = u^2 . X_E,   where X_E = {x in F_p :\
    \ x^3 + a x + b is a square}\nis the set of x-coordinates of rational points. So a factor base\
    \ defined by a COORDINATE window (x < W, the definition used by H-PSEUDO-83817b and by the program's\
    \ index-calculus records) has a different membership on E_u than on E. The gauge action is a DILATION\
    \ of the factor-base geometry by a square. Every functional in L1 that reads coordinates -- yield\
    \ at a window, solving degree with a window factor base, factor-base geometry, first-fall degree,\
    \ decomposition probability -- therefore has NON-ZERO variance with the entire class-level structure\
    \ held fixed.\n(C) THE CONSEQUENCE, WHICH IS THE PROPOSAL. Within-class variance is INTERPRETABLE\
    \ ONLY AS AN EXCESS OVER GAUGE VARIANCE. The correct design is a three-arm variance decomposition\
    \ at matched B and matched target:\n  ARM G (gauge): one fixed class member, >= 8 gauge representatives\
    \ u.\n    Varies: the equation. Fixed: everything else.\n  ARM C (class): one gauge representative\
    \ per class member, all members of\n    one complete class. Varies: j and the equation. Fixed:\
    \ p, t, N.\n  ARM R (random): random curves at the same p. Varies: t, j, equation.\nThe class\
    \ signal is Var(C) - Var(G), not Var(C). If Var(C) <= Var(G) the isogeny-class axis carries no\
    \ information for that functional AT THE MEASURED RESOLUTION, whatever Var(R) says.\n(D) WHY ARM\
    \ G IS A VALID NULL AND NOT A MODE-1 NULL FOR THE FUNCTIONALS THAT MATTER. Per KN-TECH-1a5b7e\
    \ obligation 3, a null must be able to fail. Arm G can: dilating X_E by u^2 genuinely changes\
    \ |X_E cap [0, W)| and genuinely changes which factor-base points exist. THE ONE EXCEPTION IS\
    \ NAMED HERE RATHER THAN DISCOVERED LATER: any functional invariant under dilation of F_p -- additive\
    \ energy of X_E, the multiset of Fourier magnitudes {|1_hat_{X_E}(c)| : c != 0}, the number of\
    \ roots of f in F_p -- has EXACTLY ZERO gauge variance by algebra, so arm G is a mode-1 null for\
    \ those and must be replaced (see IDEA-20260807-692e9b, which owns that case). The instrument\
    \ therefore ships with a per-functional admissibility table, computed by algebra before any run,\
    \ saying whether arm G can fail for it.\n(E) TWO-DIRECTIONAL INSTRUMENT CONTROL, per completion\
    \ criterion C4 of GOAL-ENDO-001. The instrument must (i) REJECT a matched null -- report no class\
    \ signal when the \"class\" is a set of gauge representatives of one curve, mislabelled as a class\
    \ -- and (ii) DETECT A PLANTED SIGNAL -- report a class signal when one arm's factor base is deliberately\
    \ corrupted by a known amount. Both directions run before any real measurement."
  resource_label: 'audit: consumes no resource. This is an instrument and a null-object specification;
    it mounts nothing and reads no oracle. It CONSTRAINS the interpretation of R1/R2/R4 measurements
    made by every other proposal in L1.'
  admissibility: admissible
  admissibility_argument: 'Vacuously admissible: an instrument that performs no attack cannot fail
    the resource filter. It is nevertheless subject to the filter''s logic in one direction -- if
    a functional turns out to be computable from group operations alone, its measurement is GGM-simulable
    and closed at exponent 1/2 by KN-FIND-b7e091 regardless of what this instrument reports, and the
    per-functional table in (D) records that check alongside the dilation check.'
  reachability_gate: 'NOT APPLICABLE AS AN ATTACK GATE -- this record moves between curves only to
    build a null, never to mount anything, so T5 imposes no cost on it. It does, however, supply the
    ONE piece of reachability information that costs nothing: the gauge direction is FREE. Applying
    an isomorphism costs O(log p) field operations and requires no isogeny computation, no class-group
    action and no vectorization. Therefore any variance this instrument attributes to gauge rather
    than to class is variance an attacker could exploit WITHOUT paying T5 at all -- which is why separating
    the two is not bookkeeping but the substance of the reachability question. The follow-through
    is IDEA-20260807-c36472.'
  inputs:
    procedure: 'STAGE 0 (zero compute): the admissibility table of Step 1 and the forced values of
      Step 2, both written down before any code runs. STAGE 1 (minutes, HARD GATE): verify X_{E_u}
      = u^2 X_E computationally on >= 100 curves at p = 4001, and verify the gauge orbit size is (p-1)/2
      for j not in {0, 1728}. STAGE 2 (minutes, HARD GATE, run BEFORE the real arm): the fake-class
      rejection control (5a). The rule must return NO SIGNAL on 8 gauge representatives mislabelled
      as a class. STAGE 3 (~1 hour): the graded planted-signal control (5b) with >= 3 interior points
      and an explicit monotonicity report. STAGE 4 (hours): the four-arm decomposition on >= 3 complete
      toy classes at p in [2^12, 2^14], for at least the window-yield functional, with >= 8 gauge
      draws per member and the gauge arm reported as an interval. STAGE 5 (zero compute): apply the
      frozen rule; report branch (i), (ii) or (iii) with the derived 2/n false-positive rate beside
      it. Stages 0-2 cost under an hour and can already invalidate the instrument.'
    mechanism: "STEP 1 -- THE ADMISSIBILITY TABLE, ZERO COMPUTE, RUN FIRST. For each of the lane's\
      \ candidate functionals, decide by algebra whether the gauge orbit can move it: does the functional\
      \ depend on X_E only through a dilation-invariant quantity? Produce a table with three columns:\
      \ functional; gauge-variance forced value (zero / non-zero); admissible null if gauge is forced\
      \ to zero. Predicted entries: window yield -- non-zero, gauge admissible; window solving degree\
      \ -- non-zero, gauge admissible; additive energy of X_E -- ZERO, gauge INADMISSIBLE; Fourier\
      \ ell-infinity of X_E -- ZERO, gauge INADMISSIBLE; number of roots of f -- ZERO, gauge INADMISSIBLE;\
      \ H-PSEUDO constant at a window -- non-zero, gauge admissible.\nSTEP 2 -- FORCED VALUES BEFORE\
      \ MEASUREMENT (KN-TECH-1a5b7e obligation 4). For window yield: the gauge arm resamples |X_E\
      \ cap [0,W)| by dilating a fixed set of density about 1/2; modelling the dilated intersection\
      \ as a binomial(W, 1/2) gives a forced gauge standard deviation of sqrt(W)/2, and the derivation\
      \ is recorded BEFORE the run so that observing sqrt(W)/2 is a passed control rather than a discovery.\
      \ The class arm's forced value under the no-class-structure hypothesis is the SAME sqrt(W)/2.\
      \ The measurement is therefore about the DIFFERENCE, and the design states in advance that the\
      \ difference is what is read.\nSTEP 3 -- COMPARATOR REPLICATION (KN-TECH-1a5b7e mode 5). The\
      \ gauge arm is a GENERATED comparator, so it needs a sample size: >= 8 draws of u per class\
      \ member, and the arm is reported as an INTERVAL, never as a point. The rule's own false-positive\
      \ rate is derived before the run: with an n-draw min/max tolerance interval, leave-one-out application\
      \ to the arm's own members returns OUTSIDE for exactly 2 of n, i.e. 2/n, and that number is\
      \ quoted beside every OUTSIDE verdict.\nSTEP 4 -- THE FOUR ARMS, one pipeline, one seed discipline.\
      \ Arm G (gauge, >= 8 u per member); arm C (class, every member of a complete toy class at one\
      \ gauge representative each); arm T (quadratic twist of every member -- a complete DIFFERENT\
      \ class at matched j-set); arm R (random curves at the same p, >= 30). Every arm uses the identical\
      \ measurement code path, the identical B, and a TRANSPORTED target with a re-verified certificate.\n\
      STEP 5 -- THE TWO-DIRECTIONAL CONTROL, blocking.\n  (5a) REJECT A MATCHED NULL: feed the pipeline\
      \ a fake \"class\" consisting of\n    8 gauge representatives of one curve, labelled as class\
      \ members. The\n    decision rule must return NO CLASS SIGNAL. If it returns a signal, the\n\
      \    rule fires on its own null and discriminates nothing (KN-TECH-1a5b7e\n    mode 4); measurement\
      \ stops under GOAL-ENDO-001 pause condition P1.\n  (5b) DETECT A PLANTED SIGNAL, GRADED. Corrupt\
      \ one arm's factor base by\n    deleting a fraction s of its elements, for s in {0, 0.02, 0.05,\
      \ 0.10,\n    0.20}. The rule must return NULL at s = 0 and a signal at s = 0.20, AND\n    the\
      \ statistic must be checked for MONOTONICITY across the three interior\n    points -- exhibiting\
      \ two ends does not exhibit a direction, which is the\n    refinement KN-TECH-1a5b7e adds. The\
      \ smallest s the instrument resolves\n    is its stated detection floor and every negative result\
      \ in L1 is scoped\n    by it.\n\nSTEP 6 -- THE DECISION RULE, frozen before the run, with an\
      \ explicit NEITHER branch. Outcomes: (i) CLASS-INVARIANT: Var(C) <= Var(G) within the gauge\
      \ interval; (ii) CLASS-STRUCTURED: Var(C) exceeds the gauge interval's upper end by more than\
      \ the detection floor; (iii) INSTRUMENT-LIMITED: the gauge interval is wider than |Var(C) -\
      \ Var(G)|, i.e. mode 5 -- the honest reading is that the residual is unresolved in either direction,\
      \ and the declared action is to increase the number of u draws before reading anything. Branch\
      \ (iii) is the one a two-branch rule would silently misreport, and it is expected to fire at\
      \ small class sizes."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - fake class of gauge representatives (must return no signal) -- BLOCKING
  - graded planted corruption with >= 3 interior points and a monotonicity check
  - quadratic-twist arm (a real between-class difference at matched j)
  - random-curve arm at the same p
  - transport certificate on every transported target
  - '>= 8 draws of the generated comparator, reported as an interval'
  - 'NULL OBJECT (from the proposal): THIS RECORD IS THE NULL OBJECT CONTROL FOR THE LANE, so its
    own null is the two-directional control in Step 5. MATCHED NULL FOR THE INSTRUMENT ITSELF: a fake
    class built from gauge representatives of one curve (5a) -- the instrument must find nothing there.
    DECAY PARAMETER: the number of gauge draws n. As n grows the gauge comparator interval must NARROW
    like n^{-1/2} in its standard error while its min/max tolerance interval WIDENS; a reported class
    excess that does not shrink relative to a narrowing gauge interval as n grows is the artifact
    tell. SECOND DECAY PARAMETER: B. Both the gauge and class relative spreads must decay as B^{-1/2}
    or faster for a density-type functional; a spread that is flat in B is measuring the apparatus.'
  independent_variables: []
  metrics:
    primary:
    - per-arm mean, standard deviation, min and max of every functional
    - the gauge comparator interval and its number of draws n
    - the derived 2/n false-positive rate of the min/max rule
    - the measured detection floor s and the monotonicity verdict
    secondary:
    - the frozen rule's branch, and its verdict ON THE NULL ARM, reported first
    - the per-functional gauge-admissibility table with its forced values
  heuristic_under_test: null
  preregistered_prediction:
    quantity: relative standard deviation of window-factor-base yield across the gauge arm (arm G),
      at fixed class member, fixed W, fixed transported target
    formula: 'STRICTLY POSITIVE and consistent with the forced value sqrt(W)/2 within a factor of
      2. A gauge spread of ZERO would falsify (B) and invalidate every gauge-null design in this lane.
      This is the sensitivity demonstration: the null provably moves.'
    source: pre-registered in IDEA-20260807-6eb96b before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - j = 0 and j = 1728 have larger automorphism groups and smaller gauge orbits. Pooling them with
    generic curves silently mixes orbit sizes. They are stratified, never pooled.
  - SEED REUSE. If the gauge arm and the class arm share a factor-base seed, their variances are correlated
    and the difference is biased. Seeds are declared per arm.
  - TARGET DRIFT. Comparing arms at non-transported targets compares different problems; the certificate
    is mandatory.
  - 'SMALL CLASS SIZE. h ~ sqrt(p): at p = 2^12 a class has a few tens of members, so Var(C) itself
    has large relative error. The number of class members must be reported beside every variance,
    and variance ratios must carry an F-type interval, not a point.'
  - MULTIPLE FUNCTIONALS. Running the rule on 6 functionals and reporting the one that fires is a
    garden of forking paths. All functionals are declared in advance and all verdicts are reported,
    and per-functional rates are NOT multiplied into a joint p-value (KN-TECH-1a5b7e).
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'STRICTLY POSITIVE and consistent with the forced value sqrt(W)/2 within a factor
    of 2. A gauge spread of ZERO would falsify (B) and invalidate every gauge-null design in this
    lane. This is the sensitivity demonstration: the null provably moves.'
  falsification_criterion:
  - Gauge variance measures ZERO for window yield. Then (B) is wrong, the isomorphism does not act
    on the factor base as claimed, and this record is superseded -- and so is the gauge-null design
    in IDEA-20260807-0ff796.
  - The rule fires on the fake-class null (5a). The instrument discriminates nothing; measurement
    halts under P1 and no L1 negative may cite it.
  - The planted-signal control fails at s = 0.20, or the statistic is non-monotone across the interior
    points. In the first case the instrument is blind and every L1 negative is uninterpretable; in
    the second, verdicts may not be read directionally and that limitation is printed with them.
  - 'The gauge comparator interval, drawn 8 times, is WIDER than the class-versus-gauge difference.
    That is mode 5: the residual is unresolved in either direction, and reporting it as a class effect
    would be the error this record exists to prevent.'
  - Class sizes at the reachable p are too small (< 10 members) for any variance comparison to have
    power. That is a SCOPE limitation, recorded as such, and it bounds every L1 conclusion; it is
    not evidence of invariance.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-6eb96b
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
