experiment:
  id: EXP-ECRANK-52d039
  hypothesis_id: H-ECRANK-1d22a4
  version: 1
  recorded_at: '2026-09-08'
  designed_by: TASK-20260908-aeba66
  converts_idea: IDEA-20260906-ae1cfa
  opening_decision: DEC-20260908-84d015
  title: >
    First gate for rational interval Schur certificates. R1, the abstract
    stage, freezes a set of exact rational 3x3 Gram matrices with margins
    {0, 2^-20, 1} and enclosure widths {0, 2^-10, 2^-30} plus a 4^-n width
    schedule, and tests the interval LDL^T / Schur witness for soundness
    (four pre-registered controls, universal-over-box quantifier) and
    certification power (n_cert against the independently derived
    sufficient bound n*). R2, the elliptic stage, selects one named
    curve E/Q by a frozen candidate-list rule, derives an explicit
    height-difference constant C(E) exactly, certifies the singleton
    object {P} grounded by the Mazur non-torsion control, never
    certifies the dependent object {P, 2P}, and reports the numerical
    regulator comparison-only with a pre-registered collision event.
    R3 replays R1+R2 in a fresh process bit-for-bit.
  status: review_required
  approved_by: null
  approval_note: >
    DESIGNING IS NOT APPROVING. This frozen contract sits at
    approved_by null, status review_required. Approval requires a
    committed Coordinator decision in a later step under the standing
    user authorization of 2026-09-06 ('all is approved. ideas/experiments
    should be always approved'); no run of this experiment is authorized
    until then. Protocol completeness as of this design, checked before
    this mark, inputs, controls C1-C6, independent variables,
    primary and secondary metrics, seeds (none, by deterministic
    construction), budget (3 runs, 3600 s each, 8 GB, 1 worker),
    stopping and invalidation rules, decidable success and
    falsification criteria, and required artifacts are all present.
    Any later protocol change is a versioned protocol_amendment under
    experiments/EXP-ECRANK-52d039/amendments/, never an edit of this
    frozen contract, and executed runs are never re-scored.
  successor_of: null
  objective: >
    Decide, with possible negative outcomes, (M-A) whether the rational
    interval Schur witness is sound at abstract scale, i.e. it emits
    INDEPENDENT only with a complete exact rational witness, passes the
    four pre-registered controls (zero-width baseline, dependent
    permutation, inward-rounded known-false, observation collision),
    and never certifies a dependent object; (M-B) whether its
    certification power meets the pre-registered sufficient bound, i.
    e. it succeeds at every n at or above the independently derived
    n*, with n_cert at most n*; and (M-C) whether the elliptic
    interface works end to end on one named small curve, deriving
    C(E) exactly, certifying the grounded singleton, never
    certifying the constructed dependent pair, and agreeing in sign
    with the comparison-only regulator.
  inputs:
    mechanism_source: >
      H-ECRANK-1d22a4 (mechanism blocks S1_interval_schur_soundness,
      S2_precision_bound, S3_height_interface) and
      ledger/proposals/IDEA-20260906-ae1cfa.yaml (claim, four
      controls, cost model, HEUR-1). The pipeline, exact coordinates
      of doubled points, proved height-difference bound C, repeated
      doubling with error at most C/4 to the n, polarization, outward
      rational interval arithmetic, rational interval LDL^T, and the
      incremental Schur step, is implemented from this description.
    solver: >
      exact rational arithmetic only (fractions.Fraction, stdlib
      only). NO PARI, NO Magma, NO network, NO third-party package.
      Floating point is permitted in exactly one place, the
      comparison-only regulator cross-check of R2, and its value
      never enters any verdict.
    abstract_objects: >
      Frozen set of exact rational 3x3 symmetric matrices, each with
      its frozen widths. A0, the identity matrix, width 0. A1, the
      identity matrix, widths 2^-10 and 2^-30. A2, matrix with
      diagonal (1, 1, 1/10 + 2^-20) and all off-diagonals 1/4, width
      schedule w(n) = 2^-10 times 4^-n for n = 0 to 16. A3, matrix
      with diagonal (1, 1, 1/10) and all off-diagonals 1/4, widths
      2^-10 and 2^-30. A4, the matrix of A3 with DECLARED width 2^-30
      while its derived width at schedule n = 0 is 2^-10 (the
      inward-rounded known-false object). G_dep, matrix
      [[1, 1/4, 2], [1/4, 1, 1/2], [2, 1/2, 4]] (the exact Gram of a
      dependent triple with the third vector twice the first), widths
      2^-10 and 2^-30, under the three frozen order permutations
      (identity, the transposition (1 3), the transposition (2 3),
      applied simultaneously to rows and columns). Stated exact
      facts, recomputed exactly at run start before any verdict is
      read, pivots of A2 are (1, 15/16, 2^-20) with margin gamma =
      2^-20, pivots of A3 are (1, 15/16, 0), pivots of G_dep are
      (1, 15/16, 0), the explicit positive definite member of the
      2^-10 box of A3 is A3 with its (3,3) entry replaced by 1/10 +
      2^-10 (pivots then (1, 15/16, 2^-10)), and the explicit
      positive definite member of the 2^-10 box of G_dep is G_dep
      with its (3,3) entry replaced by 4 + 2^-10 (final pivot then
      2^-10). Any mismatch between a stated fact and its exact
      recomputation is a SPEC DEFECT, the affected run is invalid,
      and the correction goes through a versioned amendment.
    named_curve_candidates: >
      Frozen ordered candidate list of (curve, point) pairs, all
      recalled pointers, each verified exactly at run start.
      Candidate 1, curve y^2 = x^3 - 2 with point P = (3, 5).
      Candidate 2, curve y^2 + y = x^3 - x with point P = (0, 0).
      Candidate 3, curve y^2 = x^3 + x + 1 with point P = (0, 1).
      Selection rule, the FIRST candidate for
      which all four run-start exact checks pass, (i) the curve is
      nonsingular (discriminant nonzero, exact), (ii) P lies on the
      curve (exact substitution), (iii) P is non-torsion by the Mazur
      test m*P != O for m = 1 to 12 (exact point arithmetic, the
      established control of EXP-ECRANK-e1e30e), (iv) C(E) is
      derivable by the stated exact method below. Every check for
      every candidate, pass or fail, is archived. If no candidate
      passes all four, F3_interface fires and R2 stops there.
    elliptic_objects: >
      For the selected (E, P), two frozen objects. O1, the singleton
      {P}, whose independence is grounded by the run-start Mazur
      non-torsion control (check (iii)), NEVER by the certificate.
      O2, the pair {P, 2P} with 2P by exact duplication, dependent by
      exact construction (its true Gram matrix is singular, final
      pivot exactly 0). The enclosed quantities for O2 are lambda(P),
      lambda(2P), and lambda(3P) (polarization needs the pair-sum
      point), i.e. the doubling chain of P, the doubling chain of
      2P (a shift of the chain of P, charged separately), and the
      doubling chain of 3P (a separate chain).
    enclosure_requirements: >
      For an exact positive rational r, a rigorous rational interval
      [L, U] with L, U rational and ln r in [L, U], guaranteed by a
      mechanically checkable exact certificate of the remainder bound
      (convergent series or AGM, executor's choice, all arithmetic
      exact rational, no floating point). The naive height of 2^n R
      is ln H(2^n R) with H the exact multiplicative naive height;
      it is enclosed this way. The canonical-height enclosure of R
      after n doublings is
      [h(2^n R)/4^n - C/4^n, h(2^n R)/4^n + C/4^n] where h(2^n R) is
      the enclosed log height. Pairing entries are enclosed by
      polarization, (enc(R+S) - enc(R) - enc(S))/2, outward. ALL
      interval operations are outward on exact rationals (lower
      endpoint = min, upper = max). Every interval operation and every
      remainder-bound check is itself an exact rational check.
    c_e_derivation: >
      C(E) is the explicit height-difference constant of the selected
      curve, i.e. a rational number C > 0 such that
      |h(Q) - lambda_E(Q)| <= C for all Q on E(Q), derived from the
      standard bound made explicit in the Weierstrass invariants
      (recalled pointer, Silverman AEC ch. V, see hypothesis
      citations; the derivation artifact is the claim, the pointer is
      not). Every inequality in the derivation chain is an exact
      rational check; every constant is an exact rational or an
      enclosed log with its certificate. The derivation is a required
      R2 artifact, and it is BLIND-RE-DERIVED by the independent
      verifier from the curve equation and the stated bound alone
      (no shared code with the producer, no access to the producer's
      derivation file). Agreement is exact.
    verifier_machinery: >
      An independent verifier implementation, sharing NO code with the
      producer pipeline, that (a) re-derives every enclosure from the
      object declaration and the stated width or C alone,
      (b) re-derives every pivot lower bound from the stated
      enclosures alone via its own interval LDL^T, (c) re-derives the
      verdict from the lower bounds, and (d) in R2 re-derives C(E)
      from the curve equation and the stated bound alone. This is the
      program's blind re-derivation pattern applied to the load-
      bearing quantities (enclosures, pivot lower bounds, C(E));
      blind_from is the producer implementation, its notes, and its
      report. Producer and verifier must agree EXACTLY (exact
      rational equality, bit-identical serialized values) on every
      object and width; disagreement localizes to exactly one of the
      two named implementations.
  controls:
    - id: C1
      control: >
        exact baseline. A0, the zero-width identity matrix, must
        return INDEPENDENT with all three pivot lower bounds exactly
        1 and determinant exactly 1. Executed FIRST in R1, before any
        other reading. Failure voids ALL runs of this experiment
        (the algebraic fixture is broken).
    - id: C2
      control: >
        matched null, dependent objects. G_dep under all three frozen
        permutations at both widths, and O2 in R2 at every tested n,
        must NEVER return INDEPENDENT. Expected outcome is UNRESOLVED
        (a rejection is also a valid sound outcome; INDEPENDENT is
        the F1_soundness falsifier).
    - id: C3
      control: >
        known-false, inward rounding. A4 must be REJECTED by the
        enclosure-derivation check (the declared width 2^-30 is not
        contained in the derived width 2^-10). It must never return
        INDEPENDENT. Acceptance of the inward-rounded enclosure is an
        F1_soundness falsifier AND invalidates the run.
    - id: C4
      control: >
        observation collision. A3 at width 2^-10 shares its box with
        the explicit positive definite member stated in
        abstract_objects, yet A3 is exactly singular. The pipeline
        must return UNRESOLVED (or a rejection), never INDEPENDENT,
        at both widths. The existence of the stated positive definite
        box member is itself a run-start derivation artifact. A
        positive floating evaluation of A3 is the collision the
        control is built to expose, and is recorded, not read.
    - id: C5
      control: >
        determinism. R3 replays R1 and R2 in a FRESH process with
        identical frozen inputs and declared seeds = none, and must
        reproduce every verdict, every pivot lower bound, every
        n_cert and n*, the C(E) value, and the certificate witness
        bytes bit-for-bit. No wall-clock, pid, or dict-order
        dependence in any reported quantity. Failure voids the R1/R2
        readings (the runs remain as records).
    - id: C6
      control: >
        producer-verifier agreement and blind re-derivation. For
        EVERY run, the independent verifier's re-derived enclosures,
        pivot lower bounds, and verdicts must equal the producer's
        EXACTLY; in R2 the blind re-derived C(E) must equal the
        producer's C(E) exactly. Any disagreement invalidates the
        affected run and flags exactly one of the two named
        implementations (the run record names which, with the
        first-diverging quantity).
  independent_variables:
    - the object (A0, A1, A2, A3, A4, G_dep under 3 permutations in R1; O1, O2 in R2)
    - the width (0, 2^-10, 2^-30) or schedule w(n) = 2^-10 * 4^-n, n = 0..16 (R1)
    - the named curve (one, by the frozen candidate-list rule, R2)
    - the elliptic object ({P}, {P, 2P}, R2)
    - the doubling count n, 0 to n_max = 60 (R2)
  metrics:
    primary:
      - name: verdict_ledger
        definition: >
          per R1 and R2 run, the tuple (object, width or n, verdict
          INDEPENDENT/UNRESOLVED/REJECTED, witness_complete boolean,
          verifier_agreement boolean). An INDEPENDENT verdict with
          witness_complete false is a control failure; with
          verifier_agreement false it is a C6 failure.
      - name: power_result
        definition: >
          for A1 and A2, the pair (n*, n_cert) where n* is computed
          at run start by the independent verifier (least n whose
          box at w(n) has all pivot lower bounds > 0) and n_cert is
          the least n at which the producer certifies, plus the
          boolean n_cert <= n* and the per-n pivot lower-bound
          ledger. For A1 the margin is gamma = 1.
      - name: interface_result
        definition: >
          for R2, the tuple (selected_curve_index, curve_equation,
          point_P, C_E exact rational, n_cert of O1, the per-n
          verdict list of O2, the cross-check floating values and
          their signs, collision_event boolean).
    secondary:
      - per-run cost ledger, charged doubling-coordinate growth per chain (bit sizes of the exact coordinates at each n), log-enclosure cost, factorization cost, verification cost, and peak memory
      - the exact rational pivot lower bounds per object and width
      - the per-entry enclosure widths per object and width
      - the exact margins gamma per object, run-start derived and archived before any verdict is read
      - the number and list of UNRESOLVED outcomes (diagnostic; UNRESOLVED is a sound outcome, never a failure, except where a control pre-registers a different expected verdict)
      - wall_seconds per run, internal monotonic AND timestamp span, both reported
      - peak_rss_bytes per run
  heuristic_under_test: HEUR-1 (carried from the proposal, UNVERIFIED, reported not tested at this gate)
  heuristics_stated_exactly:
    - >
      HEUR-1, from H-ECRANK-1d22a4 (carried from
      IDEA-20260906-ae1cfa, internal provenance), the rational
      enclosure precision needed for a supplied witness grows
      moderately with its regulator condition number. No bound, no
      distribution theorem, no direction claim. This contract
      reports n_cert versus gamma and n* as data only; a pattern
      contradicting moderate growth is a finding against HEUR-1 at
      the tested scope, never a run failure.
  preregistered_prediction:
    written_before_any_run: '2026-09-08 (this frozen contract; no run of this experiment exists)'
    never_adjusted_afterward: >
      This prediction is part of the frozen contract. Any later
      change requires a versioned protocol_amendment in
      experiments/EXP-ECRANK-52d039/amendments/ and creates a new
      record; it is never an edit of this field, and runs already
      executed are never re-scored against the new one.
    quantity: >
      (1) The R1 verdict ledger including the four control behaviors.
      (2) The (n*, n_cert) pairs for A1 and A2 and the boolean
      n_cert <= n*. (3) The R2 interface_result including n_cert of
      O1, the O2 verdict list, and the collision_event flag.
    formula: >
      P1, zero unwitnessed INDEPENDENT verdicts over all runs, every
      INDEPENDENT witness re-derived exactly by the verifier.
      P2, C1 returns INDEPENDENT with pivots all 1 and determinant
      1; C2 objects (G_dep all permutations, O2 all n) never return
      INDEPENDENT; C3 (A4) is REJECTED, never INDEPENDENT; C4 (A3)
      returns UNRESOLVED or a rejection at both widths, never
      INDEPENDENT. P3, A1 and A2 are certified by the producer at
      every n at or above n*, and n_cert <= n* for both. P4, O1 is
      certified at a reported n_cert at most n_max with C(E) and its
      blind re-derivation archived; O2 never returns INDEPENDENT at
      any n; the cross-check sign on the O1 self-height agrees with
      the certificate; a positive floating determinant on O2 is
      recorded as a collision event. P5, R3 reproduces R1 and R2
      bit-for-bit.
    source: >
      The S2 claim (n_cert at most n*) is a theorem of the stated
      mechanism conditional on exact outward interval arithmetic, an
      internal derivation, NOT a heuristic. Pairing positivity is
      established (KN-TECH-060 via KN-LIT-7621, internal, read in
      this session). The height-difference bound used for C(E) is a
      RECALLED pointer (Silverman AEC, see hypothesis citations) and
      backs no number; the number is the exact C(E) derived in R2.
      No recalled external source backs any number in this contract
      (core rule 9).
  sample_size_derivation:
    method: >
      No sampling. The object set is a fixed finite enumeration, the
      margin family {0, 2^-20, 1} of the proposal's minimal test
      (A1, A2, A3), expanded with the zero-width baseline (A0), the
      inward-rounded known-false object (A4), the dependent-permutation
      objects (G_dep, 3 permutations), and the elliptic objects
      (O1, O2). R1 enumerates 29 object-width runs, A0 at 1 width,
      A1 at 2, A2 at 17 schedule steps n = 0..16, A3 at 2, A4 at 1,
      G_dep at 3 permutations times 2 widths. R2 tests 2 elliptic
      objects over n = 0..n_max. The enumeration itself is the sample
      size; there is no probability to resolve and no smallest-
      probability floor.
    smallest_probability_to_resolve: null
    derived_sample_count: '29 R1 object-width runs; 2 R2 objects over n = 0..60'
  scale_relevance:
    tier: toy
    justification: >
      Claim-tier vocabulary of docs/claims-and-verification.md,
      mechanism discrimination at abstract 3x3 scale plus one small
      named curve over Q with n at most 60. No cryptographic
      parameters. The charged cost structure (full doubling-
      coordinate growth, log enclosure, factorization, verification,
      peak memory) is what would carry to larger witnesses, and that
      transfer is a disclosed assumption, not a claim. The 31-point
      ICARM-302 witness and degree > 1 fields are a separately
      frozen follow-up.
    correspondence: null
    correspondence_note: no correspondence trick is used; the elliptic stage uses exact point arithmetic on the selected small curve directly.
  tail_checks:
    - Every INDEPENDENT verdict must carry its complete exact witness and a verifier re-derivation; any missing element is a control failure, recorded.
    - The run-start stated exact facts (pivots, margins, box membership, explicit positive definite box members, n*) are recomputed exactly before any verdict is read; any mismatch is a spec defect, the affected run invalid, correction by versioned amendment.
    - For A2, if n* exceeds the schedule cap 16, the run record names it; F2_power then covers 'producer fails at n = n*' only when n* is within the schedule, and the cap-exceedance is reported as a schedule artifact, amendable.
    - In R2, the per-n verdict of O2 is recorded for every n = 0..n_max; UNRESOLVED is expected and is a sound outcome; any INDEPENDENT is F1_soundness.
    - The collision_event flag is computed exactly as (cross-check floating determinant on O2 > 0); it is recorded, never a failure, and never read into a verdict.
    - The cost ledger must itemize every charged component per the hypothesis proof obligations; any uncharged growth is a cost-model defect, recorded.
  replication:
    seeds: []
    seeds_note: >
      No randomization by construction. Every object, curve, point,
      permutation, width, and schedule step is deterministically
      declared in this frozen contract; the declared seed set is
      empty. R3 determinism is a REPLAY of the identical frozen
      inputs in a fresh process (C5), not a re-seed.
    independent_instances: 3
    independent_instances_note: three independent object families, the abstract power family (A1, A2), the R2 independent object (O1, grounded by the non-torsion control), and the R2 dependent object (O2, grounded by exact construction).
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3
    total_cpu_hours_note: worst-case ceiling, 3 runs times 3600 s = 3 h. Expected far lower, all arithmetic is exact rational on small objects, the largest exact integers are the coordinates of 2^60 P on a small curve (height scale 4^60 times H(P), at most a few hundred digits).
    maximum_memory_gb: 8
    maximum_memory_gb_note: template floor respected (at least 8); expected actual peak well under 1 GB.
    maximum_runs: 3
    maximum_runs_note: enumerated, (1) R1 abstract gate, all 29 object-width runs plus C6 re-derivation; (2) R2 elliptic interface gate, curve selection, C(E) derivation and blind re-derivation, O1 and O2 over n = 0..n_max, cross-check; (3) R3 determinism replay of R1 and R2. Infrastructure-retry slots are recorded per run, never as new scientific runs.
    maximum_workers: 1
    counted_exact_rational_operations_per_run: null
    counted_ops_note: no counted-op stop rule; the work is small and the wall clock is the binding cap. The cost is CHARGED and itemized in the per-run cost ledger (charged doubling, enclosure, factorization, verification, peak memory) per the hypothesis proof obligations, not capped.
    maximum_attempts_per_run: null
    descent_calls: 0
    pari_ellrank_calls: 0
    network: none
  stopping_rules:
    - Exhaustion is inert in both directions, a cap or schedule exhaustion is reported as exhaustion and is never a positive or negative mathematical result; only the pre-registered falsification patterns close a scope.
    - The run-start baseline (C1, A0) must pass before any other R1 reading is taken; on failure the run aborts as invalid (voids all runs).
    - In R2, n beyond n_max = 60 stops the doubling for that object and is recorded as an F3_interface outcome for that object, never as a verdict.
    - NO early stop, NO adaptive width or box widening; each schedule step is a fixed pass.
    - A wall-clock budget exhaustion is reported as failed_infrastructure (core rule 3), never as a mathematical result.
  invalidation_rules:
    - C1 failure voids ALL runs (the algebraic fixture is broken).
    - C3 acceptance (A4 not rejected) invalidates the run AND fires F1_soundness.
    - Any INDEPENDENT on a C2 object (G_dep at any permutation or width, O2 at any n) fires F1_soundness; the run remains a valid record of the falsification (this is falsification, not mere invalidation).
    - C4 verdict of INDEPENDENT on A3 fires F1_soundness; UNRESOLVED or a rejection is the valid outcome.
    - C5 (R3) any mismatch voids the R1 and R2 readings (determinism); the runs remain as records.
    - C6 any producer-verifier disagreement invalidates the affected run and names exactly one of the two implementations with the first-diverging quantity.
    - Any run-start stated exact fact that fails its exact recomputation is a SPEC DEFECT, the affected run invalid, correction by a versioned amendment (never an edit of this contract); executed runs are never re-scored.
    - Every invalidation is recorded with the failing check's exact inputs; a voided run is never silently dropped (core rule 8).
  success_criterion: >
    DECIDABLE, WITH A POSSIBLE NEGATIVE OUTCOME. G1 (M-A, primary),
    all controls C1-C4 behave exactly as frozen, zero unwitnessed
    INDEPENDENT verdicts, and zero INDEPENDENT on any dependent
    object (G_dep at all permutations and widths, O2 at all n).
    G2 (M-B, primary), A1 and A2 are certified by the producer at
    every n at or above n* (n* within the schedule cap 16), with
    n_cert <= n* for both, and C6 agreement holds on every R1 run.
    G3 (M-C, primary), the selected curve is named and all its run-
    start checks archived, C(E) is derived and blind-re-derived
    exactly, O1 is certified at a reported n_cert at most n_max, O2
    never returns INDEPENDENT, and the cross-check sign on the O1
    self-height agrees. G4 (controls), C5 bit-for-bit and C6 exact
    agreement hold. Negative outcomes are FIRST-CLASS, F1_soundness,
    F2_power, and F3_interface each closing their declared scope is a
    success of the DECISION, not a failure of the experiment.
  success_criterion_decidability_note: >
    Every clause is machine-checkable from the predefined metrics and
    artifacts, verdict_ledger for G1 and the control behaviors,
    power_result for G2, interface_result for G3, the R3 diff log
    for G4, and the cost ledgers for the charged-cost proof
    obligations.
  falsification_criterion: >
    F1_soundness, F2_power, F3_interface exactly as in
    H-ECRANK-1d22a4, with the F2 schedule clause, F2 covers
    'producer fails to certify at n = n*' only when n* is within the
    schedule cap 16; an n* exceeding the cap is reported as a
    schedule artifact and is amendable. Each falsification closes
    ONLY its declared scope (core rule 6). F1 closes S1 at the
    tested scope (the certificate family is unsound as implemented
    and must not be used on any witness until repaired and re-
    reviewed). F2 closes S2 at the tested scope (the stated
    sufficient bound is not sufficient). F3 closes S3 at the tested
    scope (interface unresolved); S1 and S2 stand or fall on R1
    independently. A cross-check sign disagreement is a pipeline-
    arithmetic flag, never a mathematical falsification.
  required_artifacts:
    - 'the ledger run schema for EVERY enumerated run, the nested `run:` record carrying RUN_REQUIRED_TOP fields (id, experiment_id, status, code, environment, inputs, results, stdout, stderr, timestamps, resources, validity, model provenance) plus the command.txt and environment.json companions, the omission class that forced the EXP-ECRANK-73275e predecessor repair'
    - 'per-run raw-result.json, the full verdict ledger with exact rational values serialized canonically (verdict, pivot lower bounds, witness, widths)'
    - 'the certificate witness file for every INDEPENDENT verdict, the exact rational inequalities, pivot lower bounds all > 0, and the verifier re-derivation of each'
    - 'the run-start derivation artifact, the exact recomputation of every stated fact (pivots, margins, box membership, explicit positive definite box members, n* for A1 and A2), archived before any verdict is read'
    - 'the C(E) derivation artifact (R2), the complete exact rational derivation chain with every inequality an exact check, plus the independent blind re-derivation and their exact agreement record'
    - 'the per-run cost ledger, charged doubling-coordinate growth per chain (coordinate bit sizes at each n), log-enclosure cost, factorization cost, verification cost, peak memory'
    - 'the R3 replay diff log, the bit-for-bit comparison of R1/R2 verdicts, lower bounds, n_cert/n*, C(E), and witness bytes'
    - 'the run-start candidate-check archive (R2), every check for every candidate curve, pass or fail, with the exact evidence'
    - 'wall_seconds per run, internal monotonic AND timestamp span, and peak_rss_bytes per run'
    - 'execution-report.yaml (executor observations only, no interpretation)'
  assigned_to: executor
  completion_gate:
    - All 3 enumerated runs finalized with the nested `run:` record schema.
    - validate_ledger.py adds no new violations after the run package.
    - The snapshot archive commits the full run package before any independent review.
  inference:
    requested_policy: executor-implementation
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
