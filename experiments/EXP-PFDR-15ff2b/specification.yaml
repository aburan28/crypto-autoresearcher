experiment:
  id: EXP-PFDR-15ff2b
  hypothesis_id: H-PFDR-c761e4
  question_id: RQ-ECDLP-001
  idea_id: IDEA-20260829-bdca13
  batch_id: BATCH-c64bee
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-9c61a9
  status: draft
  approved_by: null
  approved_at: null
  assigned_to: executor
  status_note: >-
    Frozen at the design stage; NOT submitted for approval and NOT authorized for
    implementation.
  title: >-
    Test whether the toy S_3 Groebner observables are a function of the grid
    incidence set alone, against an independently computed vanishing ideal that
    never touches a summation polynomial, and against a CURVE-FREE random
    bidegree-(2,2) null at matched incidence which is PREDICTED to reproduce them
    byte for byte -- so that a confirming outcome licenses no statement about
    summation polynomials, elliptic curves or the ECDLP.
  claim_ceiling: >-
    An INSTRUMENT result: what one measurement can and cannot see. No attack, no
    exponent, no hardness claim, and no closure of the underlying open problem
    about solving-degree growth. A closure of this instrument is not a closure of
    that question.
  claim_tier_basis: >-
    Toy tier. Every cell with a nonempty incidence set emits a decomposition
    certificate re-checked by independent point addition, and every empty cell
    emits a checkable NEGATIVE certificate -- the sorted candidate list,
    recomputable in near-linear time -- so the negative outcome stops being a
    solver self-report.
  objective: >-
    Establish, IN THIS ORDER: (1) the hand-checkable boundary cases at the two
    smallest factor-base sizes; (2) exact agreement between the harness Groebner
    observables and an INDEPENDENT vanishing-ideal computation built from the
    incidence set alone by group arithmetic, with no summation polynomial on that
    path; (3) the identity between the standard-monomial count and the incidence
    set size; (4) the CURVE-FREE random bidegree-(2,2) null at matched incidence,
    which decides what may be said about curves at all; (5) the higher-arity
    nearby object, which must NOT reproduce the degeneracy unchanged; and (6) the
    fitted response of cost and degree to the factor-base size and to the field
    size at fixed incidence.
  band_non_degeneracy:
    statistic: >-
      two kinds. (i) EXACT-EQUALITY statistics: the harness triple against the
      independently computed triple, and the standard-monomial count against the
      incidence set size. (ii) A FITTED EXPONENT: the response of Groebner cost
      and reported degree to the field size at fixed factor-base size and fixed
      incidence.
    null_value: >-
      (i) exact equality, with zero tolerance. (ii) a field-size exponent whose
      magnitude is below 0.2.
    alternative: >-
      (i) any disagreement, which is either a harness defect or a refutation of
      the structure theorem. (ii) a genuine algebraic response to the field size,
      a power law with exponent above 0.5.
    computed_check: >-
      (i) An exact-equality requirement is not a band and cannot be width-zero: it
      has maximal sensitivity, and a single disagreeing cell fires it. (ii) The
      fitted exponent band is checked for width. At fixed factor-base size and
      fixed incidence the only field-size dependence the theorem permits is
      coefficient arithmetic, whose cost grows like the bit length, so the
      APPARENT field-size exponent is of order the reciprocal of the logarithm of
      the field size -- roughly 0.06 to 0.09 across the tested range, comfortably
      inside the 0.2 threshold. A genuine algebraic response would be a power law
      with exponent of order 1. The threshold therefore sits between the two
      predictions with room on both sides and is non-degenerate.
    resolution: >-
      The exact-equality checks are retained as written. The fitted-exponent
      thresholds are retained at 0.2 for the null and 0.5 for the alternative, and
      the run package must report the fitted value with its interval so a reader
      can see which side of the gap it fell on rather than only a pass or fail.
  inputs:
    grid:
      p: '{2^8, 2^10, 2^12} in the declared scope, plus 2^14 and 2^16 as OUT-OF-DECLARED-SCOPE CALIBRATION primes flagged on every row'
      B: '{4, 8, 16, 32}'
      seeds: '5 per cell'
      stratification: >-
        targets stratified so the incidence set size takes each of 0, 1, 2, 3 at
        least 20 times. STRATIFICATION IS A SAMPLING DESIGN, NOT A RESULT: no
        yield or coverage statement may be read off this battery.
    monomial_order: 'grevlex, frozen before any cell runs; comparisons only between REDUCED bases in the SAME order'
    preconditions: >-
      factor-base distinctness checked per cell, since a repeated value breaks
      squarefreeness and is the one structural precondition of the theorem;
      degenerate targets are enumerated and reported separately rather than
      excluded silently
  controls:
    - id: CTRL-BOUNDARY-BY-HAND
      row_class: baseline
      blocking: true
      object: 'the factor-base sizes 1 and 2 with a planted decomposition'
      forced_disposition: >-
        Computed BY HAND before any battery runs. At size 1 the ideal is either
        the maximal ideal at the single grid point or the unit ideal; at size 2
        with exactly one vanishing cell the reduced basis must be exactly the two
        linear forms locating that cell. A miss halts the line.
    - id: CTRL-INDEPENDENT-IDEAL
      row_class: instrument
      blocking: true
      object: >-
        the vanishing ideal of the incidence set, computed from the group law
        alone -- for each factor-base element, the x-coordinates of the target
        plus and minus the corresponding point, intersected with the factor base
        -- and then by a point-set vanishing-ideal algorithm. NO SUMMATION
        POLYNOMIAL APPEARS ON THIS PATH, and that independence is the whole value
        of the check.
      forced_disposition: >-
        MUST agree with the harness observables EXACTLY, field by field, on every
        cell. A single disagreement is either a harness defect or a refutation of
        the structure theorem, and the run package commits IN ADVANCE to
        hand-deriving the disagreeing cell and reporting which.
    - id: CTRL-CURVE-FREE-NULL
      row_class: null_object
      blocking: true
      object: >-
        THE MANDATORY CURVE-FREE NULL. A random bidegree-(2,2) polynomial with the
        same membership polynomials, chosen so its grid vanishing set is the SAME
        incidence set. It contains no curve, no group law and no summation
        polynomial.
      forced_disposition: >-
        PREDICTED IDENTICAL, recorded here IN ADVANCE so that a match is a
        CONFIRMED CONTROLLED NULL rather than a disappointment. BLOCKING FOR
        ATTRIBUTION: a match FORBIDS describing any observable of this instrument
        as a statement about summation polynomials, elliptic curves or the ECDLP.
        Any difference at all in the reduced basis beyond relabelling of the
        coordinate values REFUTES the determination claim and is the most valuable
        possible outcome here.
    - id: CTRL-SATISFIABLE-UNSATISFIABLE
      row_class: instrument
      blocking: true
      object: 'targets with empty and nonempty incidence sets'
      forced_disposition: >-
        Empty incidence must give the unit ideal and the trivial flag true;
        nonempty must not. An instrument reporting a trivial ideal where a
        certified decomposition exists is broken and the line halts.
    - id: CTRL-CERTIFICATE-BOTH-ARMS
      row_class: honesty
      blocking: true
      object: 'every cell, positive and negative'
      forced_disposition: >-
        FORCED, and required by RQ-ECDLP-001 own constraint. Every cell with a
        nonempty incidence set emits a decomposition certificate re-checked by
        independent point addition. Every cell with an empty incidence set emits
        the sorted candidate list as a CHECKABLE NEGATIVE CERTIFICATE that a
        verifier recomputes in near-linear time and confirms disjoint from the
        factor base. This converts the negative outcome from a solver self-report
        into an independently verifiable object.
    - id: CTRL-HIGHER-ARITY-NEARBY-OBJECT
      row_class: nearby_object
      blocking: true
      object: 'the next-arity system at the same field size and factor-base size'
      forced_disposition: >-
        FORCED NEGATIVE: the degeneracy argument must NOT extend unchanged. If the
        higher-arity observables are also a pure function of a grid incidence set
        with no additional structure, the method is measuring the MEMBERSHIP
        ENCODING and not the arity, and the scope of every conclusion narrows to
        that -- a broader and more consequential finding requiring its own record.
    - id: CTRL-MODULUS-SEMANTICS
      row_class: instrument
      blocking: true
      object: 'the computer-algebra Groebner routine with a prime modulus'
      forced_disposition: >-
        Checked directly by planting a cell whose reduced basis over the integers
        and over the prime field provably differ. If the routine lifts to the
        integers or applies the modulus only at output, every committed
        observable in this lane is of a different ideal -- which is one of the
        outcomes this design separates rather than an assumption it makes.
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: 'Pollard rho at 0.886 sqrt(N) with O(1) memory; the near-linear signed-sum sweep for the decomposition subtask'
      forced_disposition: 'The prior column. NO DOMINATION IS CLAIMED ON ANY AXIS.'
  independent_variables:
    - 'field size p, with the two calibration primes flagged'
    - 'factor-base size B in {4, 8, 16, 32}'
    - 'stratified incidence set size in {0, 1, 2, 3}'
    - 'seed'
    - 'system in {Semaev, CURVE-FREE random bidegree-(2,2) at matched incidence, higher-arity nearby object}'
  metrics:
    primary:
      - 'harness basis size, maximum total degree and trivial flag, per cell. UNITS: integer; integer; boolean'
      - 'independently computed vanishing-ideal basis, size, maximum degree and standard-monomial count. UNITS: as above'
      - 'incidence set size computed from the group law with no summation polynomial. UNITS: integer'
      - 'standard-monomial count against the incidence set size. UNITS: integer, FORCED EQUAL exactly'
      - 'CURVE-FREE null observables at matched incidence. UNITS: as above. THE ATTRIBUTION METRIC.'
      - 'higher-arity nearby-object observables. UNITS: as above'
      - 'fitted exponent of Groebner cost and reported degree in B at fixed p, and in p at fixed B and fixed incidence, each with an interval. UNITS: dimensionless exponents'
      - 'fibre-size table against the branch locus. UNITS: integer per factor-base element'
    secondary:
      - 'certificate verification pass or fail, positive and negative arms'
      - 'peak resident memory and wall time per cell'
      - 'degenerate-target cells enumerated separately with their reasons'
      - 'the planted modulus-semantics cell and its disposition'
  heuristic_under_test: >-
    HEUR-001 (the size distribution of the incidence set) and HEUR-002 (solver
    adequacy, converted into a testable equality by the uniqueness of the reduced
    basis in a fixed order) of H-PFDR-c761e4.
  preregistered_prediction:
    quantity: >-
      Agreement between the harness and the independent computation; the
      standard-monomial identity; the curve-free null; the higher-arity control;
      the fitted exponents; and the fibre-size table.
    formula: >-
      Harness and independent observables EXACTLY EQUAL on every cell.
      Standard-monomial count EXACTLY EQUAL to the incidence set size in every
      non-degenerate cell. CURVE-FREE null observables IDENTICAL. Higher-arity
      control NOT degenerate. Fitted B-exponent at least 2; fitted p-exponent
      magnitude below 0.2 at fixed B and fixed incidence. The two candidate
      partners coincide EXACTLY on the branch locus and are distinct otherwise.
    source: >-
      H-PFDR-c761e4 claims (A) to (E) and predictions P1 to P7. The structure
      theorem is elementary and is reproduced in the hypothesis statement so a
      reviewer can check it without a library. FIXED ON 2026-09-04, BEFORE ANY
      CELL RUNS. In particular the prediction that the curve-free null MATCHES is
      recorded in advance so that a match is a confirmed controlled null.
  scale_relevance:
    tier: toy
    justification: >-
      Prime fields at at most 2^16, short Weierstrass, arity 2, factor bases of at
      most 32 elements, membership imposed by a squarefree completely split
      polynomial. Nothing transfers to extension fields, to irreducible membership
      predicates, or to higher arity. The two calibration primes lie outside the
      question declared bit sizes and are labelled on every row.
    correspondence: 'none; instances are generated directly'
  tail_checks:
    - >-
      The cells with the LARGEST factor-base size, reported separately, where
      implementation differences between two correct Groebner implementations are
      most likely to surface.
    - >-
      Every disagreeing cell, if any, reported individually WITH ITS HAND
      DERIVATION and an explicit statement of whether the theorem or the harness
      is at fault. That determination is committed to in advance.
    - >-
      The degenerate-target cells -- target x-coordinate inside the factor base,
      or on the branch locus -- enumerated and reported separately rather than
      excluded silently.
    - >-
      The count of empty-incidence targets against the coverage bound, reported
      as a consistency check on the stratification and never as a yield result.
  replication:
    seeds: ['5 independent seeds per (p, B) cell, values recorded in the run package']
    independent_instances: 12
    reason: >-
      Twelve generated curves and five seeds per cell. The load-bearing checks are
      exact equalities that hold cell by cell, so replication serves to make a
      single disagreement visible rather than to reduce a variance.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 240
    maximum_workers: 1
    notes: >-
      The largest object anywhere is a bivariate polynomial of degree at most 32
      in each variable, at most about 1089 monomials. NO Macaulay matrix is built,
      so this contract cannot reproduce any resource-exhaustion stop from the
      boolean lane, and such a stop would be an INFRASTRUCTURE failure under
      AGENTS.md rule 5 in any case. Peak resident memory is predicted below 500 MB
      and is a REQUIRED reported metric so the prediction can fail.
  stages:
    - id: stage-0-boundary
      purpose: 'write the structure argument and check the two smallest factor-base sizes by hand'
      blocking: true
    - id: stage-1-independent-path
      purpose: >-
        implement the incidence set from the group law and the vanishing ideal
        from the point set, with an audit showing no summation polynomial on that
        path
      blocking: true
    - id: stage-2-main-grid
      purpose: 'the stratified grid, comparing harness against independent observables field by field'
    - id: stage-3-curve-free-null
      purpose: 'the random bidegree-(2,2) null at matched incidence; BLOCKING FOR ATTRIBUTION'
      blocking: true
    - id: stage-4-higher-arity
      purpose: 'the nearby object that must NOT reproduce the degeneracy unchanged'
      blocking: true
    - id: stage-5-report
      purpose: >-
        if everything matches, propose the instrument closure with its named
        obstruction and forward guidance as a PROPOSAL for the Coordinator, never
        as a status change
  stopping_rules:
    - 'STOP at stage 0 if a hand-checked boundary case does not come out as derived.'
    - >-
      STOP at stage 1 if the independent path cannot be shown free of any
      summation polynomial. The independence is the value of the check.
    - >-
      Do NOT stop at the first disagreeing cell in stage 2. Every cell is run, and
      each disagreeing cell is hand-derived and reported individually.
    - >-
      Stage 3 is NOT optional and Stage 4 is NOT optional. Reporting stage 2
      without either is an invalidation, not a shortcut.
    - >-
      An instrument reporting a trivial ideal where a certified decomposition
      exists HALTS the line.
  invalidation_rules:
    - >-
      Comparing bases that are not both REDUCED, or not in the SAME frozen order,
      INVALIDATES the comparison.
    - >-
      Allowing any summation polynomial onto the independent computation path
      INVALIDATES that path and with it the whole comparison.
    - >-
      Reading any yield or coverage statement off this battery INVALIDATES it: the
      targets are deliberately stratified by incidence and the stratification is a
      sampling design.
    - >-
      Reporting the Semaev arm without the CURVE-FREE null beside it INVALIDATES
      the report.
    - >-
      Describing any observable as a statement about summation polynomials,
      elliptic curves or the ECDLP when the curve-free null reproduced it
      INVALIDATES the artifact making the statement.
    - >-
      Reporting a calibration-prime row without its out-of-declared-scope label
      INVALIDATES that row.
    - >-
      Concluding that the boolean chained systems of another goal are similarly
      degenerate INVALIDATES the artifact: those use a different encoding and this
      theorem says nothing about them.
    - >-
      Describing a closure of this instrument as a closure of the underlying open
      problem about solving-degree growth INVALIDATES the artifact.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) the two hand-checked boundary
    cases come out as derived; (2) the independent path is audited free of any
    summation polynomial; (3) every cell of the stratified grid reports both
    observable triples and their comparison field by field, with any disagreement
    hand-derived; (4) the standard-monomial identity is checked in every
    non-degenerate cell; (5) the CURVE-FREE null and the higher-arity nearby
    object are both run and reported; (6) certificates verify on both the positive
    and the negative arms; and (7) the fitted exponents are reported with their
    intervals and the calibration rows are labelled.
    SUCCESS IS BATTERY INTEGRITY, NOT A PARTICULAR OUTCOME.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 THEOREM OR HARNESS WRONG: any cell where the harness observables differ
    from the independently computed ones. The run package commits in advance to
    hand-deriving the cell and reporting which, and NOT to editing any prior
    record.
    F2 RADICALITY REFUTED: the standard-monomial count differs from the incidence
    set size in a non-degenerate cell.
    F3 A GENUINE SIGNAL: the CURVE-FREE null gives DIFFERENT observables at
    matched incidence. The determination claim is refuted and the surviving
    difference is a genuine summation-polynomial signal -- the most valuable
    possible outcome and the reason the null is run rather than assumed.
    F4 DISCRIMINANT APPLICATION WRONG: a fibre with two coincident candidates off
    the branch locus, or two distinct candidates on it.
    F5 UNEXPLAINED FIELD-SIZE RESPONSE: the fitted field-size exponent at fixed
    factor-base size and fixed incidence exceeds 0.5.
    F6 SCOPE WIDENS: the higher-arity control reproduces the degeneracy
    unchanged. The conclusion is re-scoped to the membership encoding at every
    arity, which requires its own record.
    F7 EVERYTHING MATCHES, WHICH IS THE PREDICTED OUTCOME. The instrument is
    closed as a Semaev meter with a named obstruction, an argument and forward
    guidance; the question decision target is answered REDESIGN with a derivation
    attached; and BECAUSE THE CURVE-FREE NULL REPRODUCED THE OBSERVABLES, no
    statement about elliptic curves may be made from any of it.
  artifact_package_directory: experiments/EXP-PFDR-15ff2b/runs/RUN-001/
  required_artifacts:
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/boundary-cases.md (the two hand-checked cases, worked)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/independent-path-audit.md (evidence that no summation polynomial appears on the incidence and vanishing-ideal path)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/comparison.yaml (per cell: harness triple, independent triple, field-by-field comparison, incidence size, standard-monomial count, seed, curve, calibration flag)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/curve-free-null.yaml (the random bidegree-(2,2) arm at matched incidence, with an explicit statement of what the match licenses and forbids)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/higher-arity.yaml (the nearby-object observables and the determination of whether the degeneracy extended)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/fibres.yaml (the fibre-size table against the branch locus, over the complete enumeration of the factor base at every cell)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/certificates/ (positive decomposition certificates and negative checkable candidate lists, with independent verification results)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/fits.yaml (the fitted B-exponent and field-size exponent with intervals, and the modulus-semantics planted cell)'
    - 'experiments/EXP-PFDR-15ff2b/runs/RUN-001/execution-report.md (stage by stage; the success-criterion checklist; which of F1 to F7 fired; per-file sha256; the inference block; peak memory per cell; and an explicit statement that no prior record was edited)'
  interpretation_limits:
    - >-
      An INSTRUMENT result, not a mathematical result about the ECDLP or about
      summation polynomials. No attack, no exponent, no hardness claim.
    - >-
      Scoped to arity 2, prime fields, short Weierstrass, squarefree completely
      split membership polynomials, and field size at most 2^16.
    - >-
      A closure of this instrument is NOT a closure of the underlying open
      problem. What it would establish is that the current toy instrument cannot
      answer it.
    - >-
      The boolean chained systems of the DREG lane use a DIFFERENT encoding and
      this theorem says nothing about them.
    - >-
      BECAUSE THE PREDICTED OUTCOME IS THAT A CURVE-FREE OBJECT REPRODUCES THE
      SIGNATURE, the honest headline of a confirming run contains no elliptic
      curve at all. That is stated here so it cannot be softened later.
    - >-
      No yield or coverage statement may be read off this battery; the targets are
      deliberately stratified by incidence.
    - >-
      NOVELTY IS NOT ADJUDICATED. The mathematics is elementary and may well be
      folklore; the external literature was not searched for this statement and
      the classical point-set machinery is cited from memory only.
  dominated_by: >-
    As an ATTACK: none is mounted, so every frontier row dominates on every axis.
    As a STRUCTURAL STATEMENT about the toy system: the incumbents are the
    committed discriminant and splitting results, which this contract USES and
    does not compete with, and the harness own docstring caveat, which it
    dominates on precision by replacing "these are proxies" with an exact
    identification of what the proxies equal. As an INSTRUMENT: dominated by any
    graded-Hilbert-function instrument on a non-degenerate encoding, which is
    exactly what its forward guidance recommends building. NOT NULL ON ANY AXIS.
  sota_delta: >-
    Zero on every ECDLP cost axis. Content delivered: three empirical observables
    of unknown meaning replaced by one integer plus a staircase determined by it;
    the negative outcome converted from a solver self-report into an
    independently checkable certificate; a curve-free null that decides in advance
    what may be said about curves; and a higher-arity nearby object that bounds
    the scope of the conclusion.
  id_allocation_provenance: >-
    EXP-PFDR-15ff2b pre-allocated by the tasking Coordinator in
    TASK-20260904-9c61a9 against IDEA-20260829-bdca13. Nothing was minted.
  yaml_parse_disclosure: >-
    Written without an interpreter; prose values are folded block scalars or
    quoted scalars; no tabs; no duplicate keys to the author reading. The
    orchestrating session must run a strict parse and tools/validate_ledger.py.
