experiment:
  id: EXP-VOLC-97533d
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-b1b604
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'A SAGE-FREE TOY VOLCANO CERTIFIER AND ITS TWO-DIRECTIONAL NULL: level labels from ell-division-polynomial
    root counting plus Velu plus Fouquet-Morain descent for ell in {2, 3}, emitting a re-verifiable
    path certificate, and validated by THREE MUTUALLY INDEPENDENT LABELLERS (isogeny walking, the
    rational ell-torsion criterion, LLL on j) that must agree -- with the height-zero class as the
    null it must fail to label and a CM-descended curve as the planted signal it must detect'
  status: draft
  objective: "(A) THE PROBLEM. Every other proposal in lane L2 stratifies a measurement by \"the volcano\
    \ level\". No code in this repository computes a volcano level: grepping harness/ for isogeny\
    \ construction returns only endomorphism_la.py's CM endomorphism phi(x, y) = (zeta_3 x, y), which\
    \ is an endomorphism of ONE curve and not an isogeny between two. Sage is unavailable. WITHOUT\
    \ THIS INSTRUMENT EVERY LEVEL LABEL IN THE LANE IS AN ASSERTION, and a stratified null computed\
    \ from asserted labels is worthless in both directions -- it can neither confirm nor refute anything.\n\
    (B) WHAT IS BUILDABLE IN PURE PYTHON, EXACTLY. For ell = 2 the rational 2-isogeny kernels are\
    \ in bijection with the roots of x^3 + a x + b in F_p, so the count is 0, 1 or 3 and needs only\
    \ root finding. For ell = 3 the rational 3-isogeny kernels are in bijection with the roots of\
    \ psi_3 = 3x^4 + 6 a x^2 + 12 b x - a^2 in F_p -- NOTE, roots of psi_3, not rational 3-torsion\
    \ POINTS: a subgroup {O, Q, -Q} is Galois-stable as soon as x_Q lies in F_p, since -Q shares that\
    \ x, and Velu's quantities u_Q = 4(x_Q^3 + a x_Q + b) and t_Q = 6 x_Q^2 + 2a then lie in F_p even\
    \ when y_Q does not. Getting this distinction wrong undercounts rational isogenies and mislabels\
    \ the entire volcano, which is exactly why it is written out here. Velu then gives the codomain\
    \ y^2 = x^3 + (a - 5t) x + (b - 7w) with t = sum t_Q and w = sum (u_Q + t_Q x_Q) over kernel representatives,\
    \ and the same formulas transport points. FOR ell >= 5 THE KERNEL IS A DEGREE-(ell-1)/2 FACTOR\
    \ OF psi_ell RATHER THAN A ROOT, so root finding no longer suffices and a factor-search or Kohel-style\
    \ kernel identification is required; the instrument is therefore SCOPED TO ell in {2, 3} with\
    \ ell = 5 as declared future work, and no proposal in this lane may assume ell >= 5 labels exist.\n\
    (C) THE THREE INDEPENDENT LABELLERS, AND WHY THREE. A single instrument that is wrong is indistinguishable\
    \ from a lane with no signal. Three labellers with disjoint failure modes are proposed and REQUIRED\
    \ TO AGREE:\n  (L-walk) ISOGENY WALKING. Count rational ell-isogenies at the vertex\n    (ell+1\
    \ off the floor, 1 at the floor when the height is positive,\n    1 + (D_K/ell) when the height\
    \ is zero), then Fouquet-Morain descent to\n    measure the distance to the floor. Fails if Velu\
    \ is buggy or if the\n    kernel count is wrong.\n  (L-tors) THE RATIONAL ell-TORSION CRITERION\
    \ of IDEA-20260807-cbe8c1:\n    in a class with ell | c and ell | (m - 1), E(F_p)[ell] is (Z/ell)^2\
    \ if and\n    only if E is off the ell-floor. Computed from the group structure alone,\n    with\
    \ no isogenies. Fails if the criterion's derivation is wrong or if the\n    class condition is\
    \ misevaluated.\n  (L-lll) THE LATTICE DETECTOR of IDEA-20260807-a6fb2a: the minimal degree of\n\
    \    a small-coefficient integer polynomial annihilating j mod p equals\n    h(D_K f^2). Sees\
    \ the SCALAR conductor, so it cross-checks the product of\n    the coordinates rather than any\
    \ one of them. Fails if the coefficient\n    bound or LLL quality is inadequate.\nTHE THREE SHARE\
    \ NO CODE AND NO MATHEMATICAL DEPENDENCY. Pairwise agreement on every vertex of a test volcano\
    \ is the instrument's acceptance criterion, and a disagreement is a finding that must be resolved\
    \ before any L2 measurement is trusted -- including, notably, the possibility that cbe8c1's criterion\
    \ or a6fb2a's detector is the thing that is wrong.\n(D) THE NULL, IN BOTH DIRECTIONS, WHICH IS\
    \ WHAT MAKES THIS A CONTROL AND NOT JUST CODE.\n  NEGATIVE DIRECTION -- THE HEIGHT-ZERO CLASS.\
    \ Choose a class with\n    v_ell(c) = 0. Then the ell-volcano is a single vertex, there are no\
    \ levels,\n    and the instrument MUST report height 0 and level 0 for every curve, with\n   \
    \ the rational ell-isogeny count equal to 1 + (D_K/ell) in {0, 1, 2} rather\n    than ell+1. An\
    \ instrument that manufactures levels in a height-zero class\n    is producing the exact artifact\
    \ docs/inventor-protocol.md section 3 warns\n    about, and every stratified result downstream\
    \ of it is void.\n  NEGATIVE DIRECTION -- THE FOREIGN CURVE. Feed the instrument a curve from\
    \ a\n    DIFFERENT isogeny class (different trace). Every Velu codomain must fail\n    the trace\
    \ check, and the instrument must REFUSE to place the curve rather\n    than returning a level.\
    \ A silent placement is a hard failure.\n  POSITIVE DIRECTION -- THE PLANTED SIGNAL. In a class\
    \ with D_K = -3 (so\n    h(D_K) = 1 and the crater is the single curve j = 0) and v_ell(c) >=\
    \ 3,\n    construct the crater curve directly from j = 0 and descend i times by Velu\n    for\
    \ i = 0, 1, 2, 3. The instrument must return level exactly i, for every\n    i, by all three labellers.\
    \ AN INSTRUMENT THAT CANNOT DETECT A PLANTED\n    LEVEL IS NOT ENTITLED TO REPORT A NULL, and\
    \ this program's own\n    H-ENDO-001 record already treats a missing planted-positive control\
    \ as a\n    run-invalidating condition rather than a negative.\n\n(E) THE CERTIFICATE. Every level\
    \ label ships with a re-verifiable artifact per docs/claims-and-verification.md: the ordered path\
    \ of (a, b) pairs from E to a floor vertex, each step carrying its kernel polynomial, its claimed\
    \ direction, the codomain trace, and the transported images of P and Q. An INDEPENDENT verifier\
    \ -- sharing no code with the labeller -- recomputes every Velu step, checks every trace equals\
    \ t, checks every transported point lies on its codomain, checks order(P) = N throughout, and\
    \ checks the terminal vertex has exactly one rational ell-neighbour. Verification is O(h) Velu\
    \ steps against O(ell h^2) to produce, so the certificate carries a real asymmetry (IDEA-20260807-4f43ac\
    \ measures it)."
  resource_label: 'audit: consumes no resource (instrument for acquiring R3/R4 labels)'
  admissibility: admissible
  admissibility_argument: 'An instrument consumes no resource and mounts no attack. It computes curve-only
    data -- isogeny counts, codomain equations, group structure, j-invariant relations -- and touches
    G only to TRANSPORT (P, Q), which by IDEA-20260807-5cabfc is an isomorphism on G and therefore
    confers nothing. The instrument is admissible for the same reason it is useless as an attack:
    it is entirely about curves.'
  reachability_gate: 'THE INSTRUMENT IS WHAT MAKES REACHABILITY MEASURABLE RATHER THAN ASSERTED. Every
    reachability claim in this lane -- IDEA-20260807-bb03d3''s O(B^2 log^2 p) ascent, IDEA-20260807-cbe8c1''s
    "off-floor is detected in one step", IDEA-20260807-a2b59a''s cell population -- is a claim about
    walks in a graph this instrument constructs. Without it those claims are untested cost models.
    With it, each becomes a measured step count with a certificate. The instrument itself needs to
    reach nothing: it enumerates neighbours locally and never searches for a specified curve, so it
    never touches the hard side of T5.'
  inputs:
    procedure: 'STAGE 1 (days of implementation): Velu for ell in {2, 3} with the four validation
      checks. This is the batch''s critical path and every other L2 proposal that touches curves waits
      on it. STAGE 2 (hours): the frozen fixture -- one hand-verified volcano, committed as a regression
      file, never edited. STAGE 3 (hours): the three labellers and their agreement rate. STAGE 4 (hours):
      all five nulls, N1-N5, with N1, N2, N3 blocking. STAGE 5 (hours): the independent verifier,
      written from the certificate format alone by someone who has not read the labeller. RELEASE
      GATE: the instrument is not usable by any other record until N1, N2, N3 pass and the disagreement
      rate is below 1 percent.'
    mechanism: 'STEP 1 -- CURVE AND CLASS SETUP. Extend harness/toycurve.py with: j-invariant computation,
      curve-from-j construction (with j = 0 and j = 1728 handled separately for their extra twists),
      quadratic twist, and the trace t from the existing order routines. STEP 2 -- HEIGHTS WITHOUT
      FACTORING. Implement v_ell(c) = floor(v_ell(t^2 - 4p)/2) for odd ell and the 2-adic case split,
      per IDEA-20260807-3c6bd8, and mass-check it against full factorization at toy scale. This gives
      the volcano height before any isogeny is built. STEP 3 -- KERNELS AND VELU. Root finding for
      x^3 + a x + b (ell = 2) and psi_3 (ell = 3) over F_p via sympy; Velu codomain and point images
      as in claim (B). VALIDATION, mandatory before any label is emitted: (i) every codomain has trace
      exactly t; (ii) phi-hat composed with phi acts as multiplication by ell on ten random points;
      (iii) transported points satisfy the codomain equation; (iv) order(phi(P)) = N. STEP 4 -- LEVEL
      BY DESCENT. Count rational ell-isogenies; if the count is 1 and the height is positive, the
      vertex is the floor. Otherwise walk down, at each step excluding the edge just traversed, until
      a dead end; the number of steps is h - i, giving i. Emit the path as the certificate. STEP 5
      -- THE OTHER TWO LABELLERS. Implement L-tors (group structure via the ell-part of E(F_p), computed
      by finding the ell-Sylow structure with random points at toy scale) and L-lll (a small LLL over
      the powers of j). Require pairwise agreement on every vertex of every test volcano and REPORT
      THE DISAGREEMENT RATE as a headline metric rather than as a footnote. STEP 6 -- THE NULLS AND
      THE PLANT of claim (D), run before the instrument is released for use by any other record. STEP
      7 -- THE INDEPENDENT VERIFIER, written against the certificate format only, sharing no functions
      with the labeller.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - height-zero class (N1, blocking)
  - foreign curve from another class (N2, blocking)
  - planted CM-descended level (N3, blocking)
  - supersingular input (N4)
  - three-labeller cross-agreement (N5)
  - dual-isogeny check on ten random points per edge
  - per-level counts against h(D_K f^2)
  - the frozen fixture as a permanent regression test
  - "NULL OBJECT (from the proposal): THE NULLS ARE THE PROPOSAL, so they are listed as first-class\
    \ deliverables rather than as an afterthought. (N1) HEIGHT-ZERO CLASS: v_ell(c) = 0. Instrument\
    \ must report height 0, level 0,\n  and an isogeny count of 1 + (D_K/ell) in {0, 1, 2}. Manufacturing\
    \ levels here\n  voids every stratified result in the lane. BLOCKING.\n(N2) FOREIGN CURVE from\
    \ a different class: every codomain fails the trace\n  check and the instrument REFUSES. A silent\
    \ placement is a hard failure.\n  BLOCKING.\n(N3) PLANTED SIGNAL: a CM-constructed crater (j =\
    \ 0 at D_K = -3) descended i\n  times; the instrument must return level i for i = 0..3 by all\
    \ three\n  labellers. BLOCKING -- without it, no null this instrument produces may be\n  cited.\n\
    (N4) SUPERSINGULAR INPUT (t = 0): must be detected and rejected, since the\n  ordinary volcano\
    \ theory does not apply and End(E) is non-commutative.\n(N5) THREE-LABELLER DISAGREEMENT RATE:\
    \ reported as a headline metric. A rate\n  above 5 percent means the lane has no reliable labels.\n\
    DECAY PARAMETER for the instrument's own validation: the volcano height h. The instrument's ability\
    \ to distinguish levels must IMPROVE with h (more levels to tell apart) and must vanish identically\
    \ at h = 0. An instrument whose reported level distribution looks the same at h = 0 and h = 3\
    \ is broken in the most basic possible way and the test costs minutes."
  independent_variables: []
  metrics:
    primary:
    - rational ell-isogeny count per vertex
    - assigned level and height per vertex, per labeller
    - pairwise labeller disagreement rate
    - per-level vertex counts against the class-number formula
    secondary:
    - Velu validation pass rate (trace, dual, on-curve, order)
    - certificate size, production time, verification time
    - refusal rate on N2 and N4 inputs (must be 100 percent)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: rational ell-isogeny counts per vertex on a fully enumerated toy class, against Kohel's
      predicted pattern
    formula: 100 percent match. A mismatch is either a bug or a misstatement of the recalled theorem,
      and the two must be separated before proceeding, not after.
    source: pre-registered in IDEA-20260807-b1b604 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - j = 0 AND j = 1728 have extra automorphisms and extra twists, so curve-from-j and twist bookkeeping
    differ there. Since the planted-signal control USES j = 0, this is not a corner case but the main
    path, and it must be handled explicitly and tested.
  - 2-TORSION IN VELU. A kernel point of order 2 has y = 0 and is its own negative, so the representative-set
    convention differs from the odd case. Getting it wrong silently produces a curve that is not 2-isogenous,
    which the trace check catches only if the trace happens to differ.
  - At toy p the volcano height is often 0 or 1, so a fixture with h >= 3 may require searching many
    traces. The search cost is reported, and a fixture with h < 2 cannot validate the descent logic
    at all.
  - 'The three labellers are independent in their mathematics but will share the same trace t and
    the same curve arithmetic. A bug in harness/toycurve.py''s point counting corrupts all three identically
    and the agreement check would not catch it. An independent trace check -- for instance verifying
    #E * random point = O for two independent points -- is therefore mandatory and is separate from
    the three-labeller agreement.'
  - L-tors requires the class condition ell | (m - 1); in classes where it fails, that labeller is
    simply unavailable and the agreement check degrades to two labellers. The availability rate must
    be reported.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 100 percent match. A mismatch is either a bug or a misstatement of the recalled
    theorem, and the two must be separated before proceeding, not after.
  falsification_criterion:
  - Rational isogeny counts not matching Kohel's pattern on an enumerated class. Either the implementation
    or the recalled theorem statement is wrong; the lane stops until it is known which.
  - The instrument assigning nonzero levels in the height-zero null. It manufactures structure; every
    stratified result downstream is void.
  - The instrument placing a foreign or supersingular curve instead of refusing. Same disposition.
  - Failure to recover the planted level. The instrument cannot see a level that is there; no null
    it produces may be cited, and this is an instrument failure rather than a mathematical negative
    (AGENTS.md rule 5).
  - Three-labeller disagreement above 5 percent. At least one of walking, the torsion criterion, or
    the lattice detector is wrong -- which would be a substantive finding against IDEA-20260807-cbe8c1
    or IDEA-20260807-a6fb2a and must be reported as such rather than resolved by majority vote.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-b1b604
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
