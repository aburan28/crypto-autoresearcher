experiment:
  id: EXP-SIMSPK-ff7ee8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-29e596; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-29e596
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Verified support-propagation impossible-differential reach across the entire SIMON rotation-constant
    space, with exhaustive-reachability containment checks at small word sizes and a random-constant
    null family fixing the measure's resolving power
  objective: 'A run reduces exactly one uncertainty: whether impossible-differential reach is a usable
    scoring axis for the rotation-constant space at all, and if so where the standardized triple sits
    on it. Concretely it determines (i) whether the derived support-propagation rule is sound, measured
    as an exact integer count of containment failures against exhaustively computed reachable-difference
    sets at word sizes 4, 6 and 8, where the prediction is zero and any failure localizes a defect
    in the rule rather than a property of any cipher; (ii) the value of r_imp for every orbit representative
    of the constant space at word sizes 8 and 16, together with the saturation round counts that bound
    it, so the measure''s output is a full distribution with its tie structure rather than a single
    quoted number; and (iii) whether that distribution has any resolving power, measured first on
    a random-constant null family, since a measure returning two distinct integers over 4096 constants
    cannot rank them and its apparent ranking is tie-breaking noise. The full-diffusion and linear
    controls establish that the pipeline can report both a floor value and a value cross-checkable
    against ground truth. No hypothesis is minted and no security statement is produced.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the round-function form pinned
      in STAGE 0, at word sizes 4, 6 and 8 for the verification arm and 8 and 16 for the sweep, over
      the unit-difference endpoint family and the Hamming-weight-2 robustness extension, with the
      round ceiling actually reached, (a) an exact integer count of containment failures of the support
      rule; (b) a value of r_imp per orbit representative under that rule and that endpoint family,
      which is a LOWER BOUND on impossible-differential reach and not the reach itself; (c) the empirical
      distribution of r_imp with its tie structure and the standardized triple''s orbit-weighted percentile;
      and (d) the same distribution on a random-constant null family. What does NOT follow: that r_imp
      is the true impossible-differential reach of any variant; that an impossible differential of
      length r implies any attack, key-recovery cost or data complexity at r or any other round count;
      that any triple is strong, weak, optimal or anomalous; that an observed support overlap means
      a difference is reachable; anything about designer intent in either direction; and anything
      about the security of any deployed SIMON variant.'
  inputs:
    procedure: 'STAGE 0, pin the round-function form, Feistel orientation and rotation direction against
      the specification and its test vectors; human cost 30 to 60 minutes, may fail, and failure is
      recorded as a named missing baseline. STAGE 1, derive the forward support rule and, separately
      and without assuming symmetry, the backward rule for the inverse Feistel; write both to a preregistration
      file and hash it. Zero compute, 1 to 2 hours human. STAGE 2, exhaustive reachability at n =
      4 and 6 for all triples and all input differences, containment check; seconds. STAGE 3, exhaustive
      reachability at n = 8 for all 512 triples, roughly 33 million round evaluations, containment
      check; minutes. STAGE 4, controls: full-diffusion round function, linear round function with
      end-to-end cross-check, key-independence recomputation under 8 fixed keys; minutes. STAGE 5,
      miss-in-the-middle sweep at n = 8 over all orbit representatives, all unit endpoint pairs, all
      splits up to the round ceiling; under a minute. STAGE 6, random-constant null family, 500 draws
      through the identical sweep; minutes. STAGE 7, sweep at n = 16 over orbit representatives, unit
      endpoints, round ceiling 24; bounded by the declared stage budget and reported as a budget outcome
      if it binds. STAGE 8, Hamming-weight-2 endpoint robustness arm at n = 8 only.'
    instrument: CPython 3.11 standard library only; numpy, z3, python-sat and pulp are absent in this
      environment as verified on 2026-08-16, and Sage is excluded by contract. Supports are represented
      as Python integers used as bit sets, so rotation is shift-and-mask and union is bitwise OR,
      making one round of propagation four integer operations. Exhaustive reachability at small n
      uses a plain set of output differences per input difference. Random draws come from a seeded
      random.Random with the seed in the manifest. Manifest, seeding and per-stage timing follow harness/runner.py
      conventions; identifiers minted with tools/allocate_id.py --next.
    parameters: 'Verification arm: word sizes n in {4, 6, 8}, all triples (64, 216 and 512 respectively),
      all 2^n input differences, exhaustive over all 2^n inputs. Sweep arm: n = 8 over all orbit representatives
      of 512 triples and n = 16 over all orbit representatives of 4096 triples, endpoint family the
      2n unit differences on each side, giving 16 by 16 pairs at n = 8 and 32 by 32 at n = 16, splits
      r_f from 1 to 12 and r_b from 1 to 12 at n = 8 and to 24 total at n = 16. Null family: 500 uniformly
      drawn triples with recorded seed. Controls: 1 full-diffusion round function, 1 linear round
      function, 8 fixed nonzero keys for the key-independence recomputation. Robustness arm: all Hamming-weight-2
      endpoint differences at n = 8, 120 per side. Total run ceiling 3600 seconds.'
  controls:
  - Exhaustive reachability containment check at word sizes 4, 6 and 8, which verifies the propagation
    rule against ground truth rather than assuming it.
  - Full-diffusion control whose support saturates in one round and whose r_imp must sit at the floor,
    proving the pipeline can report a small value.
  - Purely linear round-function control where the support rule is exact, allowing r_imp to be cross-checked
    against exhaustive reachability end to end.
  - Random-constant null family establishing the r_imp distribution when nothing is designed, reported
    before the real family is interpreted.
  - Key-independence recomputation under several fixed nonzero keys at n = 8, confirming the measure
    is unaffected as the derivation claims.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both executable in the same invocation. The primary null
    object is a rotation triple drawn uniformly from (Z/n)^3, with the identical forward-backward
    propagation and the identical miss-in-the-middle sweep, giving the r_imp distribution over random
    constants. For any statement about the standardized triple to mean anything, this distribution
    must first be shown to have nonzero spread: if every random triple gives the same r_imp, the measure
    has no resolving power and the standardized triple''s rank is tie-breaking noise. The secondary
    null is a full-diffusion control, a round function replaced by a map whose support rule saturates
    both branches in one round, for which the propagation must report r_imp at its floor of one or
    two; if this control reports a large r_imp the propagation implementation is faulty and the signal
    arm is void. A third calibration arm runs the identical propagation on a purely linear round function
    whose support rule is exact rather than over-approximating, where r_imp can be cross-checked against
    exhaustive reachability.'
  independent_variables:
  - word size n
  - rotation triple (a,b,c)
  - endpoint pair (unit input difference, unit output difference)
  - split (r_f, r_b)
  - arm (real family, random-constant null, full-diffusion control, linear control)
  metrics:
    primary:
    - containment_failures as an exact integer per word size
    - r_imp per orbit representative per word size
    - number of distinct r_imp values and tie count at the standardized triple's value
    - r_imp distribution on the random-constant null family with interquartile range
    secondary:
    - r_sat forward and backward per representative
    - r_imp of the full-diffusion and linear controls
    - r_imp under the Hamming-weight-2 endpoint family versus the unit family at n = 8
    - wall-clock seconds and peak resident memory per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of containment failures of the derived support-propagation rule against exhaustively
      computed reachable-difference sets, over every rotation triple and every input difference at
      word sizes 4, 6 and 8.
    formula: 'Predicted value exactly 0. The rule under test, frozen before STAGE 2: forward, the
      support pair (P_L, P_R) maps to (P_R OR S^a(P_L) OR S^b(P_L) OR S^c(P_L), P_L), where P is a
      subset of Z/n held as a bitmask, S^d denotes rotation of the mask by d, and OR is set union;
      backward, (P_L, P_R) maps to (P_R, P_L OR S^a(P_R) OR S^b(P_R) OR S^c(P_R)). Containment means
      that for every input difference, the support of the exactly computed set of reachable output
      differences after r rounds is a subset of the rule''s predicted support after r rounds. r_imp(a,b,c)
      is defined as the maximum over unit endpoint pairs and over splits of r_f + r_b such that the
      forward and backward supports are contradictory, meaning some position is forced inactive on
      one side while forced active on the other.'
    source: Pre-registered in the parent proposal IDEA-20260816-29e596 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Verification runs exhaustively at word sizes 4, 6 and 8, which is complete rather
      than sampled, and the sweep runs at word sizes 8 and 16 against a family whose deployed word
      sizes are 16, 24, 32, 48 and 64. The n = 16 sweep therefore touches the smallest deployed word
      size directly, which is unusual for this program and is a consequence of the measure costing
      O(n) per round rather than requiring search. The transfer assumption is stated: the propagation
      rule is verified only at n <= 8, and its soundness at n = 16 rests on the algebraic derivation,
      since exhaustive reachability at n = 16 would require 2^{16} inputs per difference per triple
      and is outside budget. That dependence is carried explicitly by every n = 16 number. Nothing
      is extrapolated to word sizes 24, 32, 48 or 64, which are not run.'
    correspondence: null
  tail_checks:
  - Zero input difference is handled explicitly and must propagate to zero support forever; any activity
    there is an implementation fault.
  - Full-support input differences are checked, since they saturate immediately and must give r_imp
    at the floor.
  - Triples with a = b are reported as a separate stratum because the AND degenerates and the rule's
    tightness changes.
  - Triples where gcd(a - b, n) is large are reported separately, since the coupling structure is
    expected to differ sharply and any r_imp pattern that follows only that quantity is reported as
    an arithmetic artifact rather than a ranking.
  - The largest split (r_f, r_b) reached within the round ceiling is reported per constant, so a ceiling-limited
    r_imp is visibly a budget outcome.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt the whole run and report an instrument fault if the full-diffusion control reports r_imp
    above its declared floor.
  - Halt the n = 16 sweep at its declared stage budget and report the representatives actually swept;
    a budget hit is never written as a bound on r_imp.
  - Abort the sweep entirely if STAGE 2 or STAGE 3 reports any containment failure, since every r_imp
    computed from an unsound rule is void.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Zero containment failures at word sizes 4, 6 and 8, the full-diffusion control
    at its floor, the linear control matching its exhaustively computed value, and an r_imp distribution
    over the random-constant null family with at least 2 distinct values so the measure is licensed
    to rank.
  falsification_criterion:
  - Any containment failure of the support rule against exhaustive reachability.
  - Full-diffusion control reporting r_imp above 2.
  - Linear control's r_imp disagreeing with its end-to-end exhaustively computed value.
  - Fewer than 2 distinct r_imp values on the random-constant null family, which withdraws the measure's
    licence to rank at that word size.
  - r_imp exceeding r_sat forward plus r_sat backward for any constant.
  - Key-dependence detected in the recomputation under fixed keys, contradicting the derivation.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-29e596
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The backward propagation rule for the inverse Feistel must be derived and frozen independently;
    the proposal states its expected form but the Coordinator must confirm it was derived rather than
    assumed symmetric with the forward rule.
  - The endpoint family is restricted to unit differences plus a weight-2 robustness arm; the Coordinator
    must decide whether that restriction is acceptable as a scoping choice or whether a wider family
    is required before any percentile is quoted, since the restriction demonstrably favours some constants.
  - Soundness of the rule at n = 16, where exhaustive verification is out of budget, rests entirely
    on the STAGE 1 derivation; the Coordinator must decide whether n = 16 numbers may be recorded
    at all before an independent argument for soundness at general n is written.
  - Whether r_imp ties should be broken, and if so how, must be fixed before any ranking is produced;
    the proposal's position is that ties are reported and never broken, but the Coordinator owns that
    call.
