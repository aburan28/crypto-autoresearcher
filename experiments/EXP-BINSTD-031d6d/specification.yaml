# EXP-BINSTD-031d6d
# Absence of two named paths, plus the cell-count product. No validator.
# Approved by DEC-20261002-554b3d.
experiment:
  id: EXP-BINSTD-031d6d
  hypothesis_id: H-BINSTD-39b5cb
  source_idea: IDEA-20260922-6028ed
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Absence of the reachability-table artifacts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-554b3d
  objective: >-
    Test that the yaml table and the validator script are absent.
    Compute 30 times 6. Count proposal files that contain the substring
    reachability_table.yaml. Reject a report that the yaml path exists.
  inputs:
    paths:
      - analysis/binstd-curve-audit/reachability_table.yaml
      - tools/validate_reachability_table.py
    both_absent: true
    rows: 30
    columns: 6
    product: 180
    proposal_dir: ledger/proposals
    substring: reachability_table.yaml
    proposal_files_containing_substring: 1
  controls:
    - >-
      The yaml path exists is false. Reporting it true invalidates the
      run.
    - >-
      Creating either missing path during the run invalidates the run.
    - Two checkers. They must not import each other.
  independent_variables:
    - path
    - route in {exists_and_walk, repeat_module}
  metrics:
    primary:
      - yaml_absent
      - validator_absent
      - product
      - proposal_hit_count
      - yaml_exists_rejected
      - implementations_agree
    secondary: []
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two absence bits, one product, and one file count.
    formula: >-
      A path is absent when it is not a file. The product is 30*6.
      A proposal hit is a yaml file under ledger/proposals whose text
      contains the substring reachability_table.yaml.
    source: >-
      IDEA-20260922-6028ed claim paragraphs A and C, read 2026-10-02.
      Both paths were checked absent in this design session, and the
      proposal walk found one hit. That check is not a run. The table
      and the validator were not created.
  scale_relevance:
    tier: toy
    justification: Two path checks and one directory walk. No transfer to an attack.
    correspondence: null
  tail_checks:
    - The validator path is required. Checking only the yaml path and still reporting both absent is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other checker.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If either path is reported present, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either checker imports the other.
    - Either path is created by the run.
    - Either path is reported present.
    - A schema validator or a reachability table is written.
  success_criterion: >-
    Both runs agree. Both paths are absent. The product is 180. Exactly
    one proposal file contains the substring. A report that the yaml
    path exists is rejected.
  falsification_criterion: >-
    The runs agree, both paths stay absent, and the product or the
    proposal-file count differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-031d6d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-031d6d/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-031d6d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-031d6d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-031d6d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-031d6d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Writing the table or the validator.
    - Any attack cost or curve verdict.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
