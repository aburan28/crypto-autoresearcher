# =============================================================================
# EXP-HAWK-3510a9 — version 1, approved by DEC-20261005-d9b692.
# Frozen measurement of the free rank of the norm-one units of one maximal
# order in the quaternion algebra ramified at 3 and infinity. The prediction
# r = 0 with a finite shell is fixed here, before any run. This design
# session enumerated no such unit. No HAWK exponent is claimed.
# =============================================================================
experiment:
  id: EXP-HAWK-3510a9
  hypothesis_id: H-HAWK-458e97
  question_id: RQ-HAWK-001
  source_idea: IDEA-20261005-a5cf85
  goal_id: null
  version: 1
  title: >-
    Toy free rank of the norm-one unit abelianization in one maximal order
    of the quaternion algebra ramified at 3 and infinity
  status: approved
  approved_by: DEC-20261005-d9b692
  approved_at: '2026-10-05'
  packaging_only: false
  approval:
    approved_by: DEC-20261005-d9b692
    composing_decision: DEC-20261005-d9b692
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06: "all is
      approved. ideas/experiments should be always approved") because every
      field the design protocol requires is non-null. Approval does not assert
      that r = 0 and does not assert HAWK key recovery.
    implementation_authorized: true
    scientific_execution_authorized: true
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide, for one maximal order whose ramification prints as exactly
    {3, infinity}, whether the free Z-rank r of the abelianization of the
    norm-one units is 0 with a finite shell, or at least 1. A failed gate
    is inconclusive. Do not report a HAWK attack cost.

  inputs:
    prime: 3
    algebra_gate: printed ramified places exactly the set {3, infinity}
    order: one maximal order returned by the system after the gate passes
    rank_definition: >-
      r is the number of invariant factors equal to 0 in the Smith normal
      form of the relation matrix of the abelianization of the listed
      norm-one units. Torsion invariant factors are not counted in r.
    shell: >-
      Let G be the Gram matrix of the reduced norm on a Z-basis of O.
      Let lambda_min be its smallest eigenvalue. The search box is the
      set of integer coefficient vectors whose Euclidean norm is at most
      the bound implied by Q(x) = 1 and lambda_min. Do not hard-code the
      bound. Record the bound that was used. An element is in O^1 only
      if it lies in O and its reduced norm is exactly 1, re-checked
      after the search.
    second_listing: >-
      Repeat the shell with a second Z-basis of the same order, or with
      a second implementation. The two sets of norm-one units must be
      equal and the two ranks must be equal before a reading is assigned.
    meters:
      - ring: units of Z
        expected_free_rank: 0
      - ring: units of Z adjoin square root of 2, modulo torsion
        expected_free_rank: 1
    meters_note: >-
      Neither meter ring is O. Neither is the cyclotomic log-unit lattice.
      A quaternion rank is reported only if both meters match.

  controls:
    - id: ramification-gate
      statement: Any algebra whose printed ramification is not exactly {3, infinity} is discarded before a rank is reported.
      on_fail: inconclusive. Do not substitute another algebra inside the run.
    - id: membership-gate
      statement: >-
        Every listed unit is re-tested for membership in O and for reduced
        norm exactly 1. Report the cardinality of reduced norm 1 and the
        cardinality of reduced norm plus or minus 1 separately.
    - id: meter-units-of-Z
      statement: The same free-rank function returns 0 on the units of Z.
      pass_condition: free rank 0
    - id: meter-sqrt2
      statement: The same free-rank function returns 1 on the units of Z adjoin square root of 2, modulo torsion.
      pass_condition: free rank 1
      on_fail: >-
        If either meter misses, the quaternion reading is withheld. The
        miss is inconclusive, not a value of r.

  independent_variables:
    - which Z-basis of the same order is used for the listing
    - reduced norm exactly 1 versus reduced norm plus or minus 1
    - the quaternion order versus the two meter rings

  metrics:
    primary:
      - id: free_Z_rank_r
        kind: measured
        statement: Free Z-rank of the abelianization of the listed norm-one units.
      - id: shell_finite_bit
        kind: measured
        statement: Whether the Gram-bound search finished and proved the shell is the whole set Q(x) = 1.
    secondary:
      - id: ramified_places
        kind: measured
        statement: The set of places the system printed.
      - id: gram_bound_used
        kind: measured
        statement: The search bound derived from the smallest eigenvalue. Not a hard-coded constant.
      - id: cardinality_nrd_eq_1
        kind: measured
        statement: Number of listed elements with reduced norm exactly 1.
      - id: cardinality_nrd_eq_pm_1
        kind: measured
        statement: Number of listed elements with reduced norm plus or minus 1.
      - id: meter_rank_units_of_Z
        kind: measured
        statement: Free rank on the units of Z.
      - id: meter_rank_units_of_Z_adjoin_sqrt2
        kind: measured
        statement: Free rank on the units of Z adjoin square root of 2, modulo torsion.

  measured_versus_modeled:
    measured_column:
      - ramified places
      - gram bound used
      - both cardinalities
      - shell_finite_bit
      - free_Z_rank_r
      - both meter ranks
      - peak_rss_bytes
      - wall_clock_seconds
    modeled_column:
      - >-
        Recalled report, not a run output: heuristic expected polynomial
        time for PIP in M_g(O) when g is at least 2, as relayed by
        KN-OPEN-024. This experiment does not run that algorithm and
        does not add r to that cost.
      - >-
        Analytical memory: the relation matrix is cardinality_nrd_eq_1
        by that same cardinality. That product is a formula. It is not
        written in the measured column. Measured peak_rss_bytes is
        reported beside it.
    rule: Measured counts and the recalled g >= 2 cost report stay in different columns.

  optimistic_assumptions:
    - id: one-order
      assumption: The system returns one maximal order. A second conjugacy class is not sampled.
      bias: the rank of an unsampled order can differ
    - id: gram-box
      assumption: The smallest-eigenvalue box contains every vector with Q(x) = 1 when the form is positive definite.
      bias: an under-sized box can look like a smaller group
    - id: no-hawk-transfer
      assumption: p = 3 is not treated as HAWK-512 or HAWK-1024.
      bias: none toward an attack; the scope is smaller than the scheme

  memory_accounting:
    dominant_structure: the multiplication table and the abelianization relation matrix of the listed units
    analytical_entries: cardinality of the norm-one shell, squared, for the relation matrix
    measured: peak_rss_bytes
    reconciliation: report both; the ratio is not a pass/fail of r
    time_memory_tradeoff: none. One enumeration at a fixed prime.

  hidden_overhead: >-
    No o(1) term against HAWK is stated. The computation is one shell
    at p = 3.

  parameter_sets:
    - name: PS-P3
      security_parameter: not a HAWK parameter set; the prime is 3
      scope: one maximal order after the ramification gate
  affected_scope: []
  safe_scope:
    - HAWK-512 and HAWK-1024. This contract claims no key recovery and no security loss.
  hawk_exponent: none claimed

  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 is the finiteness of the shell under the Gram bound. The
    Borel-Harish-Chandra pointer was not opened. This contract is not
    a concrete-cost table for HAWK.

  preregistered_prediction:
    quantity: the pair (shell_finite_bit, free_Z_rank_r)
    formula: >-
      The positive side is shell finite and r = 0. r >= 1 falsifies
      that side. An infinite shell with r = 0 is a third outcome. The
      two readings differ by at least 1 in r when one of them has
      r = 0 and the other has r >= 1.
    source: >-
      IDEA-20261005-a5cf85 predictions and falsification conditions,
      with the finite-torsion side chosen as the pre-registered
      positive reading before any enumeration. KN-OPEN-024 and
      KN-TECH-081 were read and supply no rank.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameter is p = 3 and one maximal order. A result
      here is not a result at HAWK-512 or HAWK-1024. No extrapolation
      is authorized.
    correspondence: >-
      Direct enumeration. No sampling equivalence is used to reach a
      larger prime.

  tail_checks:
    - >-
      The shell is fully listed or the run is infrastructure. There is
      no tail probability and no sample-size formula. A partial search
      is not scored as r = 0.
    - >-
      The two listings must agree exactly. One missing unit withholds
      the reading.

  replication:
    seeds: []
    seeds_note: >-
      The enumeration is deterministic given the algebra system and the
      basis. There is no random seed. The second listing is the
      replicate.
    independent_instances: 2
    independent_instances_note: >-
      The two listings of the same order are the two instances. The
      meter rings are controls, not further instances of O^1.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 2
    maximum_workers: 1
    budget_note: >-
      Time and memory figures are advisory watches. They do not shrink
      the Gram box. Watch expiry is failed_infrastructure. The
      scientific sample is one order and two listings.

  procedure:
    algebra: >-
      Construct a quaternion algebra over Q aimed at discriminant 3.
      Print ramified places. Stop as inconclusive if the set is not
      exactly {3, infinity}.
    order_and_shell: >-
      Compute one maximal order and the Gram matrix of its reduced norm.
      Derive the box from the smallest eigenvalue. Enumerate Q(x) = 1.
      Re-check membership and reduced norm. If the implementation cannot
      certify that the box contains every such vector, stop as
      failed_infrastructure and do not report r = 0.
    rank: >-
      From the multiplication table, build the relation matrix of the
      abelianization and compute its Smith normal form. r is the free
      rank. Repeat on the second basis. Disagreeing sets or ranks
      withhold the reading.
    meters: >-
      Run the same free-rank function on the units of Z and on the units
      of Z adjoin square root of 2. Expected results are 0 and 1.

  mechanism_assignment:
    - id: row-finite-torsion
      observation: >-
        Ramification is exactly {3, infinity}, the shell is finite, r = 0,
        both listings agree, and both meters pass.
      assigns_to: >-
        The finite-torsion reading holds at this order. It does not prove
        short-generator hardness.
    - id: row-positive-rank
      observation: >-
        The same gates, and r >= 1.
      assigns_to: >-
        The finite-torsion reading is false at this order. A positive-rank
        free abelian image exists here. It is not a decoder and not a
        HAWK key recovery.
    - id: row-infinite-torsion
      observation: >-
        The search certifies an infinite shell and r = 0.
      assigns_to: >-
        Neither the finite reading nor a positive-rank lattice. Do not
        label the shell finite.
    - id: row-inconclusive
      observation: >-
        Wrong ramification, a meter miss, disagreeing listings, an
        unproven box, or watch expiry.
      assigns_to: Inconclusive. Neither reading is decided.

  stopping_rules:
    - Stop when the ramification gate, both listings, both meters, and the rank are recorded, or when a gate fails.
    - Do not add a prime, a second order, or a HAWK parameter set.
    - Do not shrink the Gram box to meet the watch.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, missing dependency, or unproven box is failed_infrastructure and is not evidence against the hypothesis.
    - Reporting r from a search that did not certify the box invalidates the finite-torsion reading.
    - Using reduced norm plus or minus 1 as the definition of O^1 invalidates the run. The two cardinalities stay separate.
    - Applying the rank function to a cyclotomic unit group and calling that a reading of O^1 invalidates the run.
    - Changing the pre-registered prediction after seeing units is forbidden. A correction is a new amendment, and existing runs are not re-scored.
    - Writing r and the recalled g >= 2 cost in one column invalidates the cost note.

  success_criterion: >-
    The run is a success for the finite-torsion reading exactly when
    row-finite-torsion holds. The criterion fails when row-positive-rank
    or row-infinite-torsion holds. row-inconclusive is not success and
    falsifies nothing.

  falsification_criterion: >-
    The finite-torsion reading is falsified when row-positive-rank holds.
    row-infinite-torsion falsifies both the finite reading and the claim
    that a positive-rank lattice was found. row-inconclusive falsifies
    nothing. Neither completed row claims HAWK key recovery.

  required_artifacts:
    - experiments/EXP-HAWK-3510a9/runs/RUN-*/manifest.yaml
    - experiments/EXP-HAWK-3510a9/runs/RUN-*/stdout.txt
    - experiments/EXP-HAWK-3510a9/runs/RUN-*/stderr.txt
    - experiments/EXP-HAWK-3510a9/runs/RUN-*/raw-result.json
    - experiments/EXP-HAWK-3510a9/runs/RUN-*/units.jsonl
    - experiments/EXP-HAWK-3510a9/runs/RUN-*/verdict.yaml
  artifact_contents:
    raw-result.json: >-
      Ramified places, gram bound, both cardinalities, shell bit, r for
      each listing, both meter ranks, peak_rss_bytes, and the recalled
      g >= 2 note kept in a separate field.
    verdict.yaml: >-
      Exactly one assignment row, or failed_infrastructure with a reason.
      The verdict does not change hypothesis status.
    units.jsonl: >-
      One record per listed element: basis coefficients, reduced norm,
      and which listing it came from.

  assigned_to: executor
  zero_runs_in_design: true
