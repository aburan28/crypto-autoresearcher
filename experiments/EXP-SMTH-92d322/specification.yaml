experiment:
  id: EXP-SMTH-92d322
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SMTH-001
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-fe8b5c
  title: >-
    Draft successor: direct toy-scale B-smoothness measurement of half-arity
    Semaev partial-map integer invariants against a measured null
  authority: DEC-20260801-011 rank 1; successor design only
  predecessor: EXP-SMTH-71b1b0
  supersession_status: >-
    This draft does not supersede EXP-SMTH-71b1b0 now. It may supersede that
    unexecutable predecessor only after this successor receives Coordinator
    approval, is frozen under a new immutable receipt, and is separately
    authorized for execution. EXP-SMTH-71b1b0 remains immutable.
  predecessor_defect: >-
    TASK-20260803-e50765 refused before driver construction or data generation:
    EXP-SMTH-71b1b0 was frozen_awaiting_execution rather than approved, had
    execution_authorized: false, had no approved_by field, and lacked
    experiments/EXP-SMTH-71b1b0/freeze_receipt.json. This is an authorization
    and specification-binding defect, not mathematical evidence.
  objective: >-
    If approved and executed, compare at each declared toy field size the
    empirical LPF and smoothness statistics of INT-1/ENC-B Semaev half-arity
    invariants with a measured uniform-integer null on the identical support.
    The experiment is solely a toy-scale instrument and distributional check.
  what_this_experiment_is_not:
    - Not an ECDLP solve, relation collection, claw search, or discrete-logarithm computation.
    - Not an ECDLP cost, runtime, exponent, asymptotic, cryptographic-scale, or deployed-scheme claim.
    - Not authorization to execute this draft or its predecessor.
    - Not evidence until a separately approved, frozen, and authorized successor is executed and independently reviewed.
  claim_ceiling: >-
    Toy tier under every possible outcome, limited to the two declared toy
    field sizes, one deterministic curve instance per size, factor base size
    512, m=4, INT-1, ENC-B, the declared measured null, solver, controls,
    seeds, and budget. No outcome can establish or refute a claim above toy
    tier or support an ECDLP cost, exponent, crypto-scale, or deployed-scheme
    conclusion.

  measured_quantity:
    informal: >-
      For every unordered pair of distinct factor-base x-coordinates, form
      S_3(x_i, x_j, Z), take the elementary symmetric functions of its root
      multiset in Z, encode the pair by INT-1/ENC-B as N_ij in [1, p**2], and
      measure complete-factorization LPF and B-smoothness statistics.
    curve: ordinary elliptic curve over a prime field F_p with bitlength bits
    arity_m: 4
    partial_map: S_3(x_i, x_j, Z) for strict unordered pairs i < j
    invariant: elementary symmetric functions of the root multiset, reduced to [0, p-1]
    encoding:
      map: INT-1
      variant: ENC-B
      codomain: integer N_ij in [1, p**2]
    intermediate_bound: D = 2**(2*bits)
    smoothness_predicate: >-
      N_ij is Bsm-smooth iff LPF(N_ij) <= Bsm. Factorization must be complete;
      partially factored values are neither silently accepted nor discarded and
      their count is reported.

  inputs:
    toy_parameter_sizes_bits: [16, 20]
    curve_instances: one deterministic ordinary prime-field curve per field size
    factor_base:
      size: 512
      contents: distinct x-coordinates of points of E(F_p)
      policy: deterministic construction from the declared master seed and domain
    enumeration:
      rule: "for i in range(512): for j in range(i + 1, 512)"
      index_set: "{(i,j): 0 <= i < j < 512}"
      expected_count: 130816
      count_derivation: "C(512,2) = 512*511/2 = 130816"
      diagonal_excluded_by_construction: true
      rationale: >-
        The leading coefficient of S_3(x_i,x_j,Z) is (x_i-x_j)**2, so strict
        i<j excludes the undefined diagonal by loop structure, not a post-hoc
        filter. Symmetry means each unordered pair is sampled once.
    measured_null:
      id: NULL-UNIF-D
      definition: 130816 independent uniform integers on [1, p**2] at each field size
      matching_requirements:
        - Same count, support, complete-factorization pipeline, and field-size-specific D as treatment.
        - Draw, factor, and hash-commit the null arm before any treatment factorization.
        - Record the null-arm digest in the run manifest before treatment factorization begins.
      dickman_role: descriptive secondary reference only; never a calibration or blocking control

  independent_variables:
    - bits in {16, 20}
    - arm in {NULL-UNIF-D, INT-1/ENC-B treatment, ENC-A power control, apparatus-identity control}
    - smoothness rung u in {2, 3, 4, 5, 6}
  controls:
    - id: CTRL-ENCA-POWER
      blocking: true
      check: The identical pipeline on ENC-A rejects against the measured null at KS2-DS-1.
      rationale: A non-rejecting power control makes an ENC-B non-rejection uninterpretable.
    - id: CTRL-APPARATUS-IDENTITY
      blocking: true
      check: Re-running factor-base and null generators from frozen streams reproduces every stream digest.
    - id: CTRL-FACTOR-COMPLETE
      blocking: true
      check: Every recorded factorization product equals its measured integer; incomplete counts are reported.
    - id: CTRL-PAIR-COUNT
      blocking: true
      check: Exactly 130816 treatment records and no pair with j <= i.
    - id: CTRL-NULL-DICKMAN
      blocking: false
      check: Report the measured null's KS-DS-1 and RATE-DS-1 values against Dickman.
      rationale: Finite-D Dickman disagreement is informative but must not block the measured-null comparison.

  metrics:
    primary:
      - id: KS2-DS-1
        statistic: two-sample KS between INT-1/ENC-B treatment and NULL-UNIF-D
        threshold: 0.006373
        derivation: "1.63*sqrt(2/130816)"
        role: primary and decisive measured-null comparison
      - id: TAIL-DS-1
        statistic: "absolute treatment-minus-null fraction with LPF >= sqrt(D)"
        threshold: 0.01
        role: supporting and blocking only jointly with KS2-DS-1
    secondary:
      - id: KS-DS-1
        statistic: one-sample KS of treatment z-CDF against Dickman LPF CDF
        threshold: 0.05
        derivation: "max(0.05, 1.63/sqrt(130816))"
        role: reported, non-blocking
      - id: RATE-DS-1
        statistic: empirical Bsm-smooth fraction at u in {2,3,4,5}
        band: "rho(u)/8 <= observed <= 8*rho(u)"
        role: reported, non-blocking
      - id: DECAY-1
        statistic: ratio of treatment u=6 smooth fraction to treatment u=2 fraction
        threshold: 0.006404
        fires_if: ratio > 0.006404
        role: artifact tell, not a heuristic test
      - id: factorization_incomplete_count
        statistic: count of incompletely factored values per arm
      - id: z_cdf
        statistic: "z = log(max(1, LPF(N_ij))) / log(D)"

  preregistered_prediction:
    quantity: >-
      At the two toy cells, treatment and measured null are compared by frozen
      KS2-DS-1 and TAIL-DS-1 thresholds; Dickman-derived summaries are
      descriptive only.
    formula: "KS2 <= 0.006373 and |TAIL treatment-null| <= 0.01, with DECAY-1 not firing"
    source: H-SMTH-001 and the fully specified predecessor contract
  success_criterion: >-
    If this draft is later approved, frozen, and executed, it can report only
    a preliminary toy-scale instrument/distributional result when both field
    sizes meet the frozen KS2-DS-1 and TAIL-DS-1 thresholds, DECAY-1 does not
    fire, and every blocking control passes. A single run does not support an
    ECDLP cost, exponent, cryptographic-scale, or deployed-scheme claim.
  seed_strategy:
    master_seed: 4403196
    domain: EXP-SMTH-92d322/v1
    factor_base_stream: deterministic from (master_seed, domain, bits)
    null_stream: deterministic from (master_seed, domain, bits, "null"), independent of factor-base stream
    preservation_note: >-
      The predecessor's numerical master seed and two-size strategy are
      retained; the successor uses its own domain separation to avoid claiming
      that a new experiment shares the predecessor's unverified freeze binding.
  replication:
    planned_runs: 1
    independent_instances_per_size: 1
    interpretation: >-
      A single completed run cannot support or reject the hypothesis; any
      mathematically relevant reading remains preliminary and toy-only pending
      independent replication and review.

  budget:
    maximum_runs: 1
    maximum_resume_count: 1
    maximum_wall_seconds: 5400
    maximum_cpu_seconds: 21600
    maximum_peak_rss_bytes: 4294967296
    maximum_total_disk_bytes: 17179869184
    maximum_workers: 4
    no_network: true
    bounded_working_set_required: true
    stop_semantics: >-
      Crossing any budget ceiling stops at the next record boundary and is
      reported as infrastructure or budget signal, never as evidence about
      H-SMTH-001 or mathematics.
  stopping_rules:
    - Halt before treatment if the null arm has not been fully factored and hash-committed.
    - Halt at a record boundary on any declared resource ceiling.
    - Halt as invalid integrity if the frozen specification digest differs from its freeze receipt.
  invalidation_rules:
    - A missing or nonmatching freeze receipt invalidates attempted execution before data generation.
    - A missing null digest before treatment factorization invalidates the run.
    - A failed blocking control yields inconclusive instrument failure, not evidence about the hypothesis.
    - DECAY-1 firing yields inconclusive instrument artifact, not hypothesis failure.

  outcomes:
    SUPPORT_AT_TOY_SCALE:
      when: >-
        At both field sizes, KS2-DS-1 and TAIL-DS-1 meet their thresholds,
        DECAY-1 does not fire, and every blocking control passes.
      disposition: preliminary toy-scale instrument/distributional result only; replication required
    REFUTE_AT_TOY_SCALE:
      when: >-
        At both field sizes treatment fails KS2-DS-1 or TAIL-DS-1 while all
        blocking controls pass and CTRL-ENCA-POWER demonstrates power.
      disposition: toy-only weakens branch; never reject_scoped from one run and never crypto-scale
    INSTRUMENT_ARTIFACT:
      when: DECAY-1 fires.
      disposition: inconclusive; repair required
    APPARATUS_FAILURE:
      when: Any blocking control fails.
      disposition: inconclusive; no hypothesis disposition
    BUDGET_HALT:
      when: Any declared resource ceiling is crossed.
      disposition: failed infrastructure or budget; no mathematical inference

  required_artifacts:
    - Frozen approved specification and freeze_receipt.json binding its SHA-256 before execution.
    - Run manifest with exact command, revision, environment, seeds, resource measurements, and null-before-treatment digest.
    - Raw machine-readable treatment and null results, factorization verification records, and summary reports.
    - Execution report naming all controls, metrics, outcomes, deviations, and dropped work.
    - Independent validation and review reports after a snapshot archive.

  approval_requirements:
    - Coordinator records a separate approval decision and a non-null approved_by value in the approved successor contract.
    - Coordinator freezes the approved successor without editing this draft, records its SHA-256 in experiments/EXP-SMTH-92d322/freeze_receipt.json, and creates a verified snapshot archive.
    - A separately created execution task names the approved contract, is explicitly authorized, and includes no broader claim ceiling.
    - Review must define the currently unspecified deterministic curve-selection and factor-base-selection algorithms sufficiently to reproduce the exact curve and 512 x-coordinates from the seed.
    - Review must define the currently unspecified exact INT-1/ENC-B arithmetic and root-multiset implementation, including exceptional-case handling.
    - Review must define the complete-factorization solver configuration, verification format, and treatment/null raw-result schema.
    - Review must set numerical RSS preflight probe tolerances and margins at approximately 5%, 10%, and 20% completion; the predecessor required them but did not specify their values.
    - Review must reconcile the draft's successor domain separation with any intended reproducibility comparison to the predecessor's domain.
    - User explicitly approves execution after the approved, frozen contract and its review package are presented.
  approval_status: >-
    Pending Coordinator and user review. This draft is not frozen, not approved,
    not executable, and not evidence eligible.
