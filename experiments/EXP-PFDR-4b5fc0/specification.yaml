experiment:
  id: EXP-PFDR-4b5fc0
  hypothesis_id: H-PFDR-5b5c46
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the affected
    data is generated. NOTHING HERE IS A MEASUREMENT.

  title: >-
    Transcript-filtration non-backtracking walk against fixed-predicate rho - a
    zero-compute invertibility gate, a sample size sized to the collision-time dispersion,
    a planted bias of known magnitude, and a curve-free random cyclic group that decides
    whether any signal is elliptic.

  objective: >-
    Determine whether a public transcript filtration and an adaptive non-backtracking
    stopping rule reduce the charged cost of reaching a certified collision below the
    fixed-predicate baseline, at matched memory and processor count and with adaptive
    selection, restart, metadata, verification and traffic all charged; and determine
    whether any measured reduction or potential excess survives a random cyclic group of
    the same order, which is where an elliptic reading either lives or dies.

  inputs:
    elliptic_arm:
      instances: >-
        Toy prime-order curve groups with KNOWN scalars, at group orders from about 2 to
        the 20 to about 2 to the 32, at least 500 independent seeded instances per cell.
      sample_size_note: >-
        THE SAMPLE SIZE IS DERIVED, NOT CHOSEN FOR CONVENIENCE. The collision time of a
        fixed-predicate walk has a coefficient of variation of about 0.52, so the standard
        error of a mean ratio over n instances is about 0.52 over the square root of n. At
        500 instances that is about 0.023 and the 95 percent half-width is about 0.046,
        which resolves the 0.10 effect the band requires. At 50 instances the half-width
        would be about 0.145 and a null would be an absence of power rather than an
        absence of effect.
      filtration_state: >-
        The affine coefficient pair, a bounded residue window, a support-compatible
        potential updated from each public group operation, and a step-history tag. Frozen
        before execution.
      transition_rule: >-
        Pre-registered, public, non-backtracking, maximising the expected decrease of the
        potential while retaining an invertible scalar transcript. Frozen before execution.
    baseline_arm:
      construction: >-
        The standard walk with a fixed distinguished-point predicate on the SAME curves and
        the SAME instances, at identical memory, identical processor count and identical
        step budget.
    curve_free_arm:
      construction: >-
        Random cyclic groups of IDENTICAL order with a matched step-count distribution and
        an encoding of the same shape. NO ELLIPTIC CURVE, NO POINT ARITHMETIC AND NO CURVE
        EQUATION appears anywhere in this arm.
      purpose: >-
        THE BINDING CURVE-FREE NULL AND THE DECISIVE ARM. If the potential excess or the
        collision-time reduction appears here too, the effect belongs to the walk and the
        filtration and NOT to elliptic curves, and the pre-stated consequence in
        falsification_criterion applies.
    label_permuted_arm:
      construction: >-
        The same curves with a structure-destroying permutation of the step labels and
        randomised residue windows, swept over at least five destruction levels.
      purpose: 'THE DECAY CONTROL. The excess must decay monotonically as the destroying parameter increases.'
    planted_bias_arm:
      construction: >-
        A partition carrying a deliberately injected bias of KNOWN magnitude, at three
        levels chosen so the predicted potential response spans an order of magnitude.
      purpose: >-
        DYNAMIC-RANGE CONTROL WITH A DEFECT OF KNOWN SIZE. The potential must respond at
        the predicted magnitude at each level. A potential that cannot see a bias of known
        size cannot be trusted to report its absence.
    invertibility_gate:
      construction: >-
        A zero-compute constructive search for two distinct transcripts with EQUAL
        filtration state but different affine coefficients and different endpoints.
      purpose: >-
        THE LOSSY-PROJECTION GATE. If no such pair exists the filtration is invertible and
        is a change of coordinates rather than an object; the line halts before any walk
        runs. If the stopping rule treats such a pair as equivalent WITHOUT an endpoint
        certificate, identifiability fails and every collision is suspect.

  controls:
  - >-
    C-INVERTIBILITY (BLOCKING, ZERO COMPUTE, RUNS FIRST). The distinct-preimage exhibition.
    No pair means the filtration is a coordinate rename and the run stops.
  - >-
    C-BASELINE-LAW (BLOCKING). The fixed-predicate arm must reproduce the standard
    collision law - the standard constant times the square root of the group order - within
    the measured half-width, at every group size, on at least 500 instances, before the
    filtration arm is enabled.
  - >-
    C-CURVEFREE (BINDING). Random cyclic groups of identical order with matched step-count
    distribution. If the effect appears here, NO STATEMENT ABOUT ELLIPTIC CURVES OR THE
    ECDLP MAY BE QUOTED FROM THIS EXPERIMENT in either direction, and the record must say
    so in those words.
  - >-
    C-LABEL-PERMUTED (DECAY). Structure-destroying label permutation over at least five
    levels. Monotone decay required.
  - >-
    C-PLANTED-BIAS (BLOCKING). A bias of known magnitude at three levels, whose predicted
    potential response must be matched before any null is interpreted.
  - >-
    C-BACKTRACKING. The same walk with backtracking permitted, to separate the
    non-backtracking contribution from the filtration contribution. Without it the two are
    confounded and a gain could be attributed to either.
  - >-
    C-ORIENTATION. Both the target and its negation are run as instances, with the replayed
    transcript certificates checked in both orientations.
  - >-
    C-BSGS-REFERENCE. Baby-step giant-step at the same toy sizes as a memory and time
    reference, in the same charged unit with memory in bits. Mandatory under RQ-ECDLP-002.
  - >-
    C-CERTIFICATE. Every claimed collision emits a certificate carrying endpoint equality
    and the complete coefficient transcript, re-verified by an INDEPENDENT checker that
    shares no code with the walk.
  - >-
    C-FULL-CHARGE. Adaptive selection, mixing burn-in, potential evaluation, transcript
    metadata, distinguished-state insertion, restarts, false-positive verification and
    parallel synchronisation are ALL charged, on BOTH arms, in the same unit. An
    uncharged component voids the comparison.

  independent_variables:
  - arm - elliptic filtration, elliptic baseline, curve_free, label_permuted, planted_bias, backtracking
  - group order, from about 2 to the 20 to about 2 to the 32
  - structure-destruction level, five levels
  - planted bias magnitude, three levels
  - target orientation, positive or negated

  metrics:
    primary:
    - >-
      cost_ratio, dimensionless, expected charged group operations to a certified collision
      on the filtration arm divided by the same on the fixed-predicate baseline, at matched
      memory and processor count, with a bootstrap interval over instances.
    - >-
      potential_excess, in the declared potential units, on the elliptic arm minus the same
      statistic on the curve-free arm, with a bootstrap interval.
    - >-
      planted_bias_response, in potential units, per planted level, against its predicted
      value.
    - >-
      invertibility_gate outcome, a binary result with the exhibited transcript pair.
    secondary:
    - collision steps, success probability and false-positive rate per arm per cell
    - potential increments, decay curve, variance and stopping-time tails
    - memory in bits, processor count, group operations, coefficient operations and traffic per arm
    - baseline versus filtration time-memory-data Pareto points
    - independent certificate verification outcome per claimed collision
    - total-variation distance to the declared stationary law at the stopping time, per group size
    - the backtracking arm's cost ratio, separating the non-backtracking contribution
    - BSGS charged operations and memory in bits at the same sizes
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-002

  preregistered_prediction:
    quantity: >-
      The charged cost ratio against the fixed-predicate baseline, and the potential excess
      against the curve-free arm.
    formula: >-
      cost_ratio at most 0.90 with a bootstrap interval excluding 1.00, over at least 500
      instances per cell. potential_excess exceeding the curve-free arm's own bootstrap
      width. planted_bias_response matching its predicted value at all three levels. Under
      the competing explanation that the filtration is simulable from the ordinary
      transcript, cost_ratio equals 1.00 within the measured half-width of about 0.046.
    source: >-
      No theorem predicts a gain, and the record's own stated prior is that the generic
      controls will erase the signal. The 0.90 threshold and the 500-instance sample size
      are pre-registered decision parameters, and the sample size is DERIVED from the
      collision-time coefficient of variation of about 0.52 so that the band is resolvable
      rather than nominal.

  scale_relevance:
    tier: toy
    justification: >-
      Group orders from about 2 to the 20 to about 2 to the 32, chosen so that the
      fixed-predicate baseline is runnable 500 times per cell within the budget. A fitted
      scaling exponent over that range carries its confidence interval and is NOT
      extrapolated to cryptographic sizes.
    correspondence: null

  tail_checks:
  - >-
    The stopping-time upper tail is reported per arm, since a mean ratio can be moved by a
    few very long runs and the mechanism's claim is about the whole distribution.
  - >-
    The single longest run on the filtration arm is reported with its full charged
    accounting, so that a favourable mean is never quoted without its worst case.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    seeds_policy: >-
      One master seed per run recorded in the manifest, from which instance generation,
      scalar generation, step-partition construction, label permutation, planted-bias
      injection and bootstrap resampling are derived by a declared deterministic stream.
      Every instance and every walk is reproducible from the master seed and its index.
      Seeds are fixed before execution and are never redrawn after an outcome is seen. The
      three seeds are independent replicates of the whole protocol, not three attempts at
      one number. THE WALK MUST NOT HAVE ACCESS TO THE KNOWN SCALAR, and the run asserts
      that it does not, because a leaked scalar is exactly the artifact C-LABEL-PERMUTED
      exists to catch.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 32
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
    budget_note: >-
      The binding cost is 500 baseline runs plus 500 filtration runs per cell per arm at
      group orders up to about 2 to the 32. If the largest size exceeds the budget it is
      dropped and its absence is recorded as a budget statement, never as a result.

  stopping_rules:
  - >-
    SR1 BLOCKING, ZERO COMPUTE. C-INVERTIBILITY runs first. If no distinct-preimage pair
    is exhibited, the filtration is a coordinate rename, the run STOPS, and that is the
    result.
  - >-
    SR2 BLOCKING. C-BASELINE-LAW must reproduce the standard collision law before the
    filtration arm is enabled.
  - >-
    SR3 BLOCKING. C-PLANTED-BIAS must respond at its predicted magnitude at all three
    levels before any null is interpreted.
  - >-
    SR4. C-CURVEFREE runs at every cell where the elliptic arm runs, not as an afterthought
    at one cell.
  - >-
    SR5. If cost_ratio falls at or below 0.90 with the interval excluding 1.00 AND
    C-CURVEFREE shows no such reduction, the run STOPS and ESCALATES for an independent
    review-adversarial session before any record states the reduction, and for
    review-breakthrough at maximum effort before any record calls it a break. No record
    states an exponent claim in any case, because the tested range cannot support one.
  - >-
    SR6. Budget exhaustion stops the run and reports the cells completed. An infrastructure
    receipt, never a negative result.

  invalidation_rules:
  - >-
    Any component of cost is charged on one arm and not the other.
  - >-
    Any claimed collision lacks an independently re-verified certificate, or a certificate
    verification fails.
  - >-
    The false-positive rate is nonzero after independent endpoint and coefficient
    verification.
  - >-
    The walk has access to the known scalar at any point.
  - >-
    Memory or processor count differs between the compared arms.
  - >-
    Fewer than 500 instances are used in any cell whose ratio is reported.
  - >-
    Any deployed target, live key or wallet is touched. Hard prohibition under
    RQ-ECDLP-002; violation voids the entire run.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and is NEVER
    counted as negative mathematical evidence.

  success_criterion: >-
    C-INVERTIBILITY exhibits a distinct-preimage pair; C-BASELINE-LAW and C-PLANTED-BIAS
    are discharged; cost_ratio at most 0.90 with a bootstrap interval excluding 1.00 over
    at least 500 instances per cell; potential_excess exceeding the curve-free arm's
    bootstrap width; monotone decay under label permutation; zero false positives; and
    every cost component charged identically on both arms. EVEN THEN, NO EXPONENT CLAIM IS
    ADMISSIBLE - the tested range spans twelve binary orders of magnitude and cannot
    support one.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) No distinct-preimage pair exists - the
    filtration is invertible, it is a change of coordinates rather than an object, and the
    line halts at zero compute. (F2) cost_ratio consistent with 1.00 within the measured
    half-width of about 0.046 - H-PFDR-5b5c46 S2 is FALSIFIED at tested scope for this
    filtration and this walk family, and the record reports a BOUND rather than an absence,
    because the sample size makes the half-width a real bound. (F3) THE POTENTIAL SIGNAL OR
    THE COST REDUCTION APPEARS ON THE CURVE-FREE RANDOM CYCLIC GROUP TOO - the effect
    belongs to the walk and the filtration, NOT to elliptic curves; NOTHING FROM THIS
    EXPERIMENT MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP, in either
    direction, and the record must state that in those words. THIS IS THE OUTCOME THE
    HYPOTHESIS ITSELF PREDICTS. (F4) The excess fails to decay as the structure-destroying
    parameter increases - the canonical artifact tell; the effect is void. (F5) The planted
    bias is not detected at its largest magnitude - the potential lacks dynamic range and
    no null is interpretable. (F6) A single certificate false positive - the certificate is
    not a certificate and every claimed collision is suspect. (F7) The full charged path is
    not strictly below the baseline once adaptive selection, memory, verification and
    traffic are charged - the mechanism is rejected at tested scope, which is the outcome
    the record expects.

  required_artifacts:
  - the exhibited distinct-preimage transcript pair, or the record that none exists
  - per-instance collision steps, charged group operations, coefficient operations, memory in bits, traffic and success outcome, per arm per cell
  - cost_ratio per cell with bootstrap interval, and the computed half-width from the measured dispersion
  - potential trajectories, increments, variance and stopping-time tails per arm
  - potential_excess against the curve-free arm per cell, with bootstrap intervals
  - planted-bias response per level against its predicted value
  - label-permutation decay curve over all five levels
  - backtracking arm cost ratio, separating the non-backtracking contribution
  - independent certificate verification result for every claimed collision, from a checker sharing no code with the walk
  - false-positive count, predicted exactly zero
  - measured total-variation distance to the declared stationary law at the stopping time, per group size
  - baseline versus filtration time-memory-data Pareto points
  - BSGS charged operations and memory in bits at the same sizes
  - the explicit charge ledger showing every component charged identically on both arms
  - the assertion that the walk had no access to the known scalar
  - command, environment, seeds, library versions and resource measurements

  limitations:
  - >-
    THE SOURCE IDEA'S BAND WAS UNQUANTIFIED AND THE SAMPLE SIZE WAS DERIVED HERE. It asks
    for a pre-registered strict reduction with no number and no power statement. The
    collision-time coefficient of variation is about 0.52, so at 50 instances per cell the
    95 percent half-width would be about 0.145 and a 10 percent effect would be
    indistinguishable from none. The band is now 0.90 with the interval excluding 1.00 and
    the sample size is at least 500 per cell. Recorded in H-PFDR-5b5c46
    band_non_degeneracy.
  - >-
    THE RECORD PREDICTS ITS OWN NULL. The hypothesis states in advance that the generic
    controls will likely erase the signal, which makes F3 the expected outcome rather than
    a disappointment. That prediction is recorded before the run so that a null cannot be
    presented afterwards as a surprise or as a closure of anything wider.
  - >-
    A MEASURED COLLISION-TIME CHANGE IS NOT AN EXPONENT CLAIM. Even a clean positive over
    the tested range supports no asymptotic statement, and none may be recorded.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether any filtration gain
    persists at cryptographic group sizes is not testable by this or any reachable
    experiment - running the fixed-predicate baseline even once at those sizes is precisely
    what the security level asserts is infeasible, and this design needs 500 such runs per
    cell. The experiment therefore cannot in principle establish the claim its mechanism
    would need, and that gap is stated before the run rather than discovered after it.
  - >-
    Toy groups make entropy estimates and collision tails non-asymptotic. A fitted scaling
    exponent over the tested range carries its confidence interval and is not extrapolated.
  - >-
    Adaptive step selection can itself bias the walk or invalidate the mixing assumption,
    and early stopping can reduce measured time while increasing restart and verification
    cost. Both are charged; neither is assumed away.
  - >-
    A residue window may be correlated with the encoding or the group partition rather than
    with any curve structure, which is what C-LABEL-PERMUTED and C-CURVEFREE separate.
  - >-
    NO DEPLOYED TARGET, LIVE KEY OR SECRET SCALAR is used or inferred. Every instance is
    generated locally with a known scalar that the walk never sees.

  assigned_to: executor
  approved_by: null
