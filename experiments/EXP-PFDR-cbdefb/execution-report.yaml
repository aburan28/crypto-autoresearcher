execution_report:
  experiment_id: EXP-PFDR-cbdefb
  hypothesis_id: H-PFDR-c88f14
  task_id: TASK-20260903-6745ea
  implementation_commit: 3029ff1466011c8a8b93e8614ebe3dc1201e08e1
  implementation_commit_note: >-
    HEAD at the time of every official run is recorded in each manifest as
    code.commit = 3029ff14 (short form; the full sha is in every manifest),
    dirty: false. The implementation files closure.py and run_cbdefb.py are
    untracked at that commit and pinned by sha256 in every manifest
    (code.source, all_pinned: true). closure.py exists in two versions across
    the package: the version pinned by runs 1-2 (fixture, s1-slice) and the
    version with the per-degree ideal-dimension diagnostic pinned by runs
    3-23; the diagnostic changes no metric (anomaly A-CLOSURE-DIAG-RECHECK).
  closure_convention_sha256: 99190ce39524669056e818bcbc510c9699baf2beabdafaddf2c2663ae93f6437
  meter_commit: 2d2083e59edab14fe4ac4a42d777b1aa5be867b8
  meter_selftest: 'python3 -m pytest tests/test_macaulay_fp.py -q: 52 passed in 2.25s, run in this session before the first official run'
  approval_basis: 'specification.yaml status approved, approved_by coordinator, approval commit c5742969 (DEC-20260903-93862f)'
  ordering_inputs_read:
    - 'EXP-PFDR-5726af (commit 89dc58e3): graded-rank d_ff 5, 5, 6, 6 at s = 2..5 on its p = 4099 instances; H-TOP gate open'
    - 'EXP-PFDR-fd901a (commit 1b49d491): rank-drop rate 0/40 at p = 4099, exact 95 percent CI [0, 0.0881] (artifact budget)'
  stages:
    stage_0: 'stage0-transfer.md written before any run (dictionary, B1/B2, null and analogue-constant table)'
    stage_1: 'three runs, all completed_valid; s1_pass true; known_answer_pass true; P1_all_agree true; stopping rule 1 did not fire'
    stage_2: 'fifteen (s, p) cells plus three equal-d^s runs, all completed_valid; stopping rules 2 and 3 checked between s-levels, neither fired'
    stage_3: 'gated open by 5726af H-TOP; two runs completed_valid; (3, 2, 3) has no computable arm at D_max = 7 (generator degree 9)'
    stage_4: 'analyze.py -> analysis.md / analysis.json'
  protocol_deviations:
    - id: D-F2-FIXTURE-SUBSTITUTED
      text: >-
        The F_2 Weil-descent known-answer fixture is not exhibited (conformance
        to Theorem 2.6's reducibility hypothesis not establishable from the
        retrieved statement; no web access). The contract's sanctioned
        substitute, the planted-fall fixture, is the known answer
        (stage1-closure-convention.md section 4; analysis.md section B).
    - id: D-ENGINE
      text: >-
        Above 256 columns (the s = 5 cells, fixture P, the (2, 6) and (4, 3)
        equal-d^s arms) the closure's linear algebra is an exact dense
        float64/BLAS RREF written for this experiment (bound p^2 (N + 1) <
        2^53 asserted), because the meter's dict-row Echelon takes 110-183 s
        per s = 5 Semaev system; the meter remains the reference engine below
        256 columns and on the declared s = 5 subsample (one draw per arm per
        prime). Histories agreed integer for integer wherever both ran (every
        s <= 4 system, every fixture, the subsample).
    - id: D-NULL-ONCE
      text: >-
        NULL-2 and NULL-3 take no curve or target input; with the frozen seeds
        used verbatim they were computed once per (p, s, seed) (5 objects per
        cell per arm) and reported per draw by reference; NULL-1 per draw (200
        per cell). Same disclosure as EXP-PFDR-5726af D-NULL2-ONCE.
    - id: D-S1-DIRECT-LISTS
      text: >-
        The s = 1 slice runs three generator lists: the digit form (the
        contract's object), 84cdb7's literal direct list (unreduced S_3, which
        the polynomial-ring closure sees only at nominal degree 4 and whose
        reduction it registers as a fall at 4), and the reduced-generator
        polynomial-ring list (identical history to the digit form on all 120
        draws). The note's sections 2 and 5 were worded from a scratch dry run
        before the first official run.
    - id: D-ITERATION-COUNT-RULE
      text: >-
        At s = 1 every Semaev and non-curve draw and 165 of 600 NULL-1
        objects have their single fall (at D = 3) with iteration count 1: the
        cumulative Macaulay space at D = 3 already equals the ideal in the
        4-monomial ring, so multiplying the fallen rows inserts nothing.
        Contract invalidation rule 3 is applied literally in the analysis:
        those fall ENTRIES are invalidated, the s = 1 Semaev draws therefore
        carry no valid fall and are outside every fit (the primary range is
        s = 2..5 by the pre-declared choice anyway); raw closure values are
        shown beside the rule-applied ones. The prescribed 'return to Stage 1'
        is satisfied by the Stage 1 fixtures P and H (iteration count 2 at
        their planted falls); no count-1 fall occurs at any s >= 2 on any arm.
    - id: D-CLOSURE-DIAG
      text: >-
        The per-degree diagnostic dim_I_at_D / W0_saturated / V_complete_at_D
        was added to closure.py after runs 1-2 and before run 4 (run 3 was in
        flight and untouched); no metric changed (A-CLOSURE-DIAG-RECHECK).
    - id: D-SCRATCH
      text: >-
        Scratch prototypes, benchmarks and dry runs of every subcommand into
        the session scratchpad preceded the first official run; a dry (4, 4099)
        and (5, 4099) cell for timing ran concurrently with runs 1-3. None is a
        run record; none touched the frozen prediction or criteria.
    - id: D-CONCURRENT-LOAD
      text: >-
        Wall times are covariates: the four cores were shared with another
        executor's session throughout and, during runs 1-3, with this
        session's scratch timing runs. Official runs were strictly sequential
        (one worker, BLAS threads pinned to 1); none overlapped another.
    - id: D-INFERENCE
      text: >-
        AUTORESEARCH_POLICY deliberately unset for run processes; the wrapper's
        inference block records the harness default (executor-terra, no model
        in the loop; the _inference_block shadowing already reported by
        EXP-PFDR-fd901a); the session block (executor-implementation, medium,
        adapter resolution anthropic:claude-sonnet-5, runtime-reported
        claude-fable-5-1, model_verified false, fallback_used unknown) is in
        every manifest under inputs.parameters.session_inference.
    - id: D-GIT-READONLY
      text: 'Read-only git commands by the wrapper and the script for provenance; no git write; nothing committed.'
    - id: D-PACKAGE-SIDECAR
      text: 'Seventh file package-sha256.json per run directory (per-file sha256 of the six required files).'
    - id: D-M3-S3-ABOVE-DMAX
      text: >-
        (3, 2, 3): the reduced S_4 generator has digit degree 9 > D_max = 7;
        the cell was run and recorded with every arm degenerate (no layer
        below D_max; NULL-3's degree-4 block forms vanish in <= 3 squarefree
        variables), not skipped. NULL-3 is likewise degenerate at (3, 2, 2)
        and at m = 2, s = 1, and is a single monomial with no closure fall at
        (2, 2, 2).
  stopping_rules:
