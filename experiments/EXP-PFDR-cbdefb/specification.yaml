experiment:
  id: EXP-PFDR-cbdefb
  hypothesis_id: H-PFDR-c88f14
  question_id: RQ-PFDR-ae2fba
  idea_id: IDEA-20260903-d52480
  version: 1
  recorded_at: '2026-09-03'
  drafted_under_task: TASK-20260903-b5d2ae
  battery_position: 3 of 6 (runs after EXP-PFDR-fd901a and EXP-PFDR-5726af report)
  title: >-
    The (first fall, last fall) slope ladder of the digit-presented Semaev
    system at m = 2, d = 2, s in {1..5}: the V_{F,D} closure instrument with
    two known-answer fixtures, three nulls, censoring flags and the
    pre-registered three-outcome rule that decides whether any bounded-last-
    fall stake survives at toy scale
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-03'
  approval_note: >-
    Approved by ordinary Coordinator authority (AGENTS.md rule 1) on user
    confirmation of 2026-09-03 ('Approved all experiments'), executing the
    /design-experiment gate (skill step 4); decision record
    DEC-20260903-93862f. The specification is frozen as of the approving
    snapshot commit; any change is a versioned protocol_amendment under
    experiments/EXP-PFDR-cbdefb/amendments/, never an edit. The
    preregistered prediction (d_ff = 5, 5, 6, 6 at s = 2..5; null d_lf in
    the band s + 2 + c, c in {0, 1, 2}; the three-outcome rule with the
    joint-label reconciliation and its honest prior; NULL-3 d_ff agreement)
    and the Stage 1 frozen closure convention are part of the frozen
    contract and are never adjusted after runs begin. Execution is gated on
    the shared meter prerequisite (TASK-20260903-ba41aa) named under
    inputs.shared_meter and is scheduled after EXP-PFDR-fd901a and
    EXP-PFDR-5726af report.
  assigned_to: executor
  objective: >-
    Measure the pair (d_ff(s), d_lf(s)) on IDEA-20260830-84cdb7's ladder
    with the last fall degree computed by the Huang-Kosters-Yeo closure in
    exact linear algebra over F_p, and label the outcome by the pre-
    registered rule: OUTCOME I (d_lf semi-regular, slope 1), OUTCOME II
    (d_ff strictly slower than d_lf while d_lf tracks the null -- the
    EXPECTED label given H-PFDR-4148b8's derived d_ff slope 1/2), OUTCOME
    III (d_lf flat over at least four consecutive uncensored s -- the only
    label that licenses 84cdb7's conditional exponent, whose price is
    EXP-PFDR-c04716's table). STAGE 0 (zero compute): the transfer
    dictionary and the two non-transferring steps; the null formula and the
    formal analogue constant 4m on the ladder, recording that they do not
    separate at s <= 5. STAGE 1: implement the closure on the shared meter
    with the frozen convention; validate on the s = 1 slice against
    IDEA-20260808-afe4ce's floor and on the known-answer fixture; verify
    P1 (closure d_ff equals graded-rank d_ff) on EXP-PFDR-5726af's cells.
    STAGE 2: the ladder m = 2, d = 2, s in {1..5}, p in {4099, 16411,
    65537}, 8 curves, 5 planted targets, D_max = 7, all arms, fall history
    and iteration counts recorded. STAGE 3 (optional, memory contract):
    m = 3, d = 2, s in {2, 3}, p = 65537, gated on EXP-PFDR-5726af's H-TOP
    check. STAGE 4 (zero compute): slopes with 95 percent intervals,
    outcome label, censoring report. Budget note: budgets are at or above
    the template floors; matrices have at most 1024 columns (512 at the
    m = 3 arm); the run granularity is one (s, p) cell over all curves,
    targets and arms.
  inputs:
    ladder: 'm = 2, d = 2, s in {1, 2, 3, 4, 5}; p in {4099, 16411, 65537}; 8 generic-j curves per p; 5 planted targets per curve; D_max = 7'
    optional_arm: 'm = 3, d = 2, s in {2, 3}, p = 65537, 3 curves, 2 targets'
    generators: 'as EXP-PFDR-5726af (digit field equations a(a - 1); substituted S_{m+1}); planted targets by point addition with certificates; the y^2 = f(x) soundness variant on a 20 percent subsample'
    closure_convention: >-
      FROZEN AT STAGE 1 and recorded: starting from the degree-<= D
      Macaulay row space in the multilinear quotient, iterate 'extract a
      basis of W_t cap R_{<= D-1}, multiply each element by all monomials
      keeping degree <= D, add, reduce' to a fixed point; a fall at D is
      V_{F,D} cap R_{<= D-1} strictly containing V_{F,D-1}; d_ff is the
      least D with a fall, d_lf the largest D <= D_max with a fall, with
      the censoring flag 'no fall observed in (d, D_max]'.
    null_formula: 'ceil((ms(d - 1) + 2m)/2) = s + 2 at m = 2 (3, 4, 5, 6, 7 at s = 1..5); formal analogue constant 4m = 8, unreachable on the ladder'
    known_answer_fixtures: >-
      (i) s = 1 slice: the direct presentation with B = d = 2; the closure
      must respect afe4ce's floor d_lf >= B. (ii) A known-answer fixture
      pinning the closure to the theorem's invariant: an F_2 Weil-descent
      system whose conformance to Theorem 2.6 of arXiv:2103.07282 is
      established in the Stage 1 note from the theorem statement recorded by
      IDEA-20260903-d52480 (bound max((q - 1) m + 1, q d) at q = 2); if no
      conforming fixture can be exhibited, the PLANTED-FALL fixture (an
      added generator g = u f_1 + v f_2 + h, deg h < deg g, whose first fall
      is at deg g with known content h and whose closure iteration count is
      at least 2) is the known answer, and the substitution is recorded in
      the analysis.
    shared_meter: >-
      REQUIRED INPUT (shared prerequisite, DEC-20260903-8cdf8d next_actions
      item 1): the F_p port of experiments/EXP-SBRG-60c55e/driver/
      macaulay.py in squarefree mode with (a) the p = 2 known answer against
      KN-FIND-006 and (b) the planted-syzygy positive control passed in the
      same manifest lineage; the closure is a loop around its exact-rank
      engine.
    artifact_budget: 'the rank-drop rate at p = 4099 measured by EXP-PFDR-fd901a (the small-p budget any per-draw deviation must exceed)'
  controls:
    - id: CTRL-S1-BASELINE
      blocking: true
      object: 's = 1 (direct presentation, B = 2)'
      forced_disposition: >-
        Generator list identical to 84cdb7's s = 1 slice; d_lf >= 2
        (afe4ce's floor); the closure's d_ff equals the graded-rank d_ff.
    - id: CTRL-KNOWN-ANSWER-FIXTURE
      blocking: true
      object: 'the F_2 descent fixture or the planted-fall fixture (see inputs)'
      forced_disposition: >-
        At or below the retrieved bound on the descent fixture; the planted
        fall degree and content exactly on the planted fixture, with
        iteration count at least 2. A violation halts the line.
    - id: CTRL-DFF-AGREEMENT
      blocking: true
      object: 'every shared (2, 2, s) cell at p = 4099 with EXP-PFDR-5726af'
      forced_disposition: >-
        FORCED EXACT agreement of the closure's d_ff with the graded-rank
        d_ff; a mismatch is an instrument failure.
    - id: NULL-1-SUPPORT-MATCHED
      blocking: true
      object: '84cdb7''s random generator of the same multidegree support with the same digit field equations; 5 seeds'
      forced_disposition: >-
        d_lf within {0, 1, 2} above the null formula (HEUR-001 of
        H-PFDR-c88f14); outside the band the Semaev arm is read relative to
        the measured null.
    - id: NULL-2-RANDOM-MULTILINEAR
      blocking: true
      object: 'uniformly random multilinear polynomial in the ms digit variables of the same per-block degree as the reduced substituted S_{m+1}; 5 seeds'
      forced_disposition: >-
        As NULL-1.
    - id: NULL-3-BLOCK-FACTORED
      blocking: true
      object: 'H-PFDR-4148b8''s block-factored null (product of random degree-e forms per block); 5 seeds'
      forced_disposition: >-
        d_ff identical to the Semaev arm (forced by H-PFDR-4148b8); d_lf
        with NO direction pre-committed -- d_lf is where the curve first
        enters, if it enters at all, and the difference is the record's
        most informative cell.
    - id: NEARBY-NON-CURVE-CUBIC
      blocking: true
      object: 'the S_3 formula at a singular Weierstrass cubic (4 A^3 + 27 B^2 = 0), same digit generators'
      forced_disposition: >-
        Reported; a pair identical to the Semaev arm at every cell means
        the measurement is about digit complete intersections.
    - id: CTRL-EQUAL-DS-SPREAD
      blocking: false
      object: '(d, s) in {(2, 6), (4, 3), (8, 2)} at B = 64, p = 65537, 3 curves, restricted to D <= 6 and the column cap'
      forced_disposition: >-
        The spread of (d_ff, d_lf) across equal-d^s presentations is the
        presentational artifact budget; any claimed effect must exceed it by
        a factor 2 (84cdb7's rule). Cells above the column cap are entered
        as not computable, by name.
    - id: CTRL-ITERATION-COUNT
      blocking: true
      object: 'closure iteration count per cell and degree'
      forced_disposition: >-
        At least 2 at every degree where a fall is claimed; a claimed fall
        with iteration count 1 is the artifact tell of a non-iterating
        closure.
    - id: CTRL-CONFOUNDERS-NAMED
      blocking: false
      object: >-
        (i) the CRT / complete-splitting artifact of IDEA-20260830-cb8e46:
        planted targets make the ideal I(Z) with tiny Z; every observable
        here is generator-level (the fall history), never ideal-invariant.
        (ii) the output-degree proxy of IDEA-20260807-899c5e: no reduced-
        basis degree is a metric. (iii) censoring: d_lf is right-censored by
        D_max and a censored cell biases the slope toward Outcome III; the
        flag is mandatory and censored cells never enter a fit.
      forced_disposition: >-
        Named and excluded by construction.
  independent_variables:
    - 's in {1, 2, 3, 4, 5} at m = 2; s in {2, 3} at m = 3 (optional)'
    - 'p in {4099, 16411, 65537}'
    - 'arm: Semaev | NULL-1 | NULL-2 | NULL-3 | non-curve cubic'
    - 'curve (8 per p) and planted target (5 per curve); null seed (5)'
    - 'D up to D_max = 7'
  metrics:
    primary:
      - 'fall history {D : fall at D}, d_ff, d_lf and censoring flag per (cell, arm, curve, target)'
      - 'fitted slope of d_lf against s at m = 2 with 95 percent interval, uncensored cells only'
      - 'fitted slope of d_ff against s with 95 percent interval'
      - 'outcome label (I | II | III | unresolved) by the pre-registered rule'
      - 'NULL-1 and NULL-2 d_lf minus the null formula per cell (band check)'
      - 'NULL-3 minus Semaev for d_ff (forced 0) and for d_lf (reported)'
    secondary:
      - 'closure iteration counts per degree per cell'
      - 'known-answer fixture results and the s = 1 slice'
      - 'equal-d^s spread at B = 64'
      - 'pre-flight column counts, peak RSS, wall time per cell; aborted and censored cells by name'
      - 'soundness subsample: filtering fraction of non-square interval solutions (reported, not modelled)'
      - 'certificate pass/fail per planted target'
  heuristic_under_test: 'HEUR-002 (bounded last fall, digit form) of H-PFDR-c88f14, with HEUR-001 (last-fall semi-regularity of the null) validated on the null arms in the same invocation'
  preregistered_prediction:
    quantity: >-
      The fitted slopes of d_ff and d_lf in s at m = 2, d = 2, and the
      outcome label; the null band; the NULL-3 d_ff agreement.
    formula: >-
      d_ff = 5, 5, 6, 6 at s = 2..5 (slope 1/2; IDEA-20260903-e1e38b); d_lf
      on NULL-1 and NULL-2 = s + 2 + c with c in {0, 1, 2} (3..7 plus c at
      s = 1..5); Semaev d_lf slope: honest prior 0.6 that the interval
      contains 1 and excludes 0.5 (Outcome I on d_lf), giving the joint
      label OUTCOME II with the d_ff slope 1/2 strictly below; 0.05 that the
      d_lf interval contains 0 and excludes 0.25 over four consecutive
      uncensored cells (Outcome III); 0.1 unresolved. NULL-3 d_ff minus
      Semaev d_ff = 0 at every cell.
    source: >-
      IDEA-20260903-d52480 claims (B)-(C) and its H1/H2 (the closure, the
      null band, the three outcomes and their prior); IDEA-20260903-e1e38b
      (D5) for the d_ff values; the joint-label rule is the Coordinator's
      pre-registered reconciliation of d52480's Outcome II with e1e38b's
      derived slope, written here on 2026-09-03 before any run and never
      adjusted afterward.
  scale_relevance:
    tier: toy
    justification: >-
      p <= 2^16, s <= 5, matrices of at most 1024 columns. No transfer in s
      is claimed: a flat d_lf at s <= 5 is a slope statement at resolution
      0.25, never a bound in s; there is no cryptographic-scale shortcut on
      the s-axis (EXP-PFDR-fd901a supplies one on the p-axis only).
    correspondence: 'none; direct computation at the tested primes'
  tail_checks:
    - >-
      The top two uncensored cells of the ladder, reported individually with
      their pre-flight column counts and iteration counts.
    - >-
      The largest observed band offset c on the null arms and whether it
      grows with s (a growing c means the null's own last fall is not O(1)
      past d_reg and the band must be widened before the Semaev arm is
      read).
    - >-
      The cell with the largest NULL-3 minus Semaev d_lf difference, if any.
  replication:
    seeds:
      - 'curve seeds 3101..3108 per prime (curve k uses 3100 + k)'
      - 'target seeds 1..5 per curve'
      - 'null seeds 7, 11, 13, 17, 19 per (curve, target, p) per null arm'
      - 'known-answer fixture seed 5'
    independent_instances: >-
      8 curves x 5 targets = 40 Semaev draws per (s, p) cell, 15 cells at
      m = 2; 5 null seeds per null arm per draw. Justification: a slope fit
      over 5 points at resolution 0.25 needs the per-s spread bounded; 40
      draws per cell bound it to the small-p budget of EXP-PFDR-fd901a, and
      8 independent curves per p is well above the 3-curve minimum.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 48
    maximum_memory_gb: 8
    maximum_runs: 48
    maximum_workers: 1
    notes: >-
      One run = one (s, p) cell over all curves, targets and arms (15 main
      cells, 2 optional m = 3 cells, 3 equal-d^s cells, fixtures), with
      re-runs; each closure is a handful of exact ranks on at most 1024
      columns and each cell is minutes to tens of minutes. The memory
      envelope inherits 84cdb7's pre-flight gate (abort above 50,000 columns
      or 4 GiB dense-equivalent; (2, 2, 6, 8) excluded by name).
  stages:
    - id: stage-0-transfer-derivation
      purpose: 'dictionary and non-transferring steps; null and analogue constant on the ladder'
      dominant_operation: writing
      machine_compute: none required
    - id: stage-1-closure-and-fixtures
      purpose: 'closure on the shared meter; s = 1 slice; known-answer fixture; d_ff agreement'
      dominant_operation: exact rank over F_p
      machine_compute: minutes
    - id: stage-2-ladder
      purpose: 'm = 2, s in {1..5}, three primes, all arms'
      dominant_operation: iterated exact rank over F_p on up to 1024 columns
      machine_compute: hours
    - id: stage-3-optional-m3
      purpose: 'm = 3, s in {2, 3} (gated on H-TOP from EXP-PFDR-5726af)'
      dominant_operation: iterated exact rank on up to 512 columns
      machine_compute: minutes
    - id: stage-4-analysis
      purpose: 'slopes, intervals, outcome label, censoring report'
      dominant_operation: writing
      machine_compute: none required
  stopping_rules:
    - >-
      Stop before Stage 2 if the s = 1 slice, the known-answer fixture, or
      the d_ff agreement fails; record the instrument finding.
    - >-
      Stop the ladder after two consecutive fully-censored or aborted s;
      report the ceiling; do not smooth over it.
    - >-
      If d_lf on the Semaev arm is flat across three consecutive s while the
      null rises, run the confirmation arm (all 8 curves, all 5 targets, all
      three primes, iteration counts inspected) before any other cell.
    - >-
      Stop when all planned cells have a terminal state; no iteration or
      tuning of the closure convention after the first Stage 2 cell.
  invalidation_rules:
    - >-
      A timeout, OOM or crash on any cell is failed_infrastructure and is
      never evidence about the last fall degree; a censored cell is
      censored, never a bound.
    - >-
      A run whose shared meter has not passed the p = 2 known answer and
      the planted-syzygy positive control in the same manifest lineage is
      invalid.
    - >-
      A claimed fall with closure iteration count 1 invalidates that fall
      entry (non-iterating closure) and returns the instrument to Stage 1.
    - >-
      A change of closure convention after the first Stage 2 cell
      invalidates every cell computed under the other convention unless
      both are reported side by side under a protocol amendment.
    - >-
      Any Groebner output degree used as d_lf, or any censored cell entering
      a slope fit, invalidates the fit.
  success_criterion: >-
    Decidable from the primary metrics: the ladder is uncensored at its top
    at m = 2, the null arms sit in the band {0, 1, 2}, NULL-3 matches the
    Semaev d_ff at every cell, and the outcome label is assigned by the
    pre-registered rule. The pre-registered EXPECTED label is OUTCOME II
    (d_ff slope interval strictly below the d_lf point estimate and
    excluding 1, d_lf interval containing 1 and excluding 0.5), which
    RECORDS that the digit presentation's early fall does not cascade and
    that every first-fall-based cost statement in this lane must be re-read
    against d_lf. OUTCOME I is likewise a success of the measurement.
    OUTCOME III (d_lf flat over four consecutive uncensored cells, absent on
    every null and on the non-curve cubic) hands D_0 to EXP-PFDR-c04716 and
    is routed to independent review before any status change. No label
    changes any hypothesis status by itself.
  falsification_criterion: >-
    For HEUR-002 (bounded last fall): OUTCOME I or II -- a fitted d_lf slope
    interval excluding 0 on an uncensored ladder -- falsifies it at the
    tested scale (the pre-registered expectation). For the measurement
    itself, the negative outcomes are: NULL-1, NULL-2 or the non-curve cubic
    reproducing the Semaev pair at every cell (controlled null; the
    measurement is about digit complete intersections and no Semaev
    statement may be made); a null band violation (the null is not
    semi-regular in the last-fall sense); censored or aborted cells at the
    top of the ladder (the slope is a bound, Outcome III may not be
    declared); NULL-3 disagreeing with the Semaev d_ff (routed to
    H-PFDR-4148b8 as F2).
  required_artifacts:
    - 'experiments/EXP-PFDR-cbdefb/runs/<run-id>/manifest.yaml (command, commit, dirty-tree hash, environment, seeds, parameters, closure convention, inference block, timing, peak RSS, per-file sha256)'
    - 'experiments/EXP-PFDR-cbdefb/runs/<run-id>/raw-result.json (fall history, d_ff, d_lf, censoring flag, iteration counts per degree, per arm per draw; certificate results)'
    - 'experiments/EXP-PFDR-cbdefb/runs/<run-id>/stdout.log and stderr.log'
    - 'experiments/EXP-PFDR-cbdefb/stage0-transfer.md (the dictionary, the two non-transferring steps, the null and analogue-constant table)'
    - 'experiments/EXP-PFDR-cbdefb/stage1-closure-convention.md (the frozen convention, the fixture conformance argument or the planted-fall substitution)'
    - 'experiments/EXP-PFDR-cbdefb/analysis.md (slopes with intervals, outcome label, null band table, NULL-3 table, equal-d^s spread, censoring table, verdict against the frozen criteria)'
  interpretation_limits:
    - >-
      Claim (A) of H-PFDR-c88f14 says no bound is inherited, not that none
      exists; all measured degrees are generator-level under a frozen
      convention at toy scale.
    - >-
      No ECDLP claim in any outcome; Outcome III licenses a conditional
      statement only, priced by EXP-PFDR-c04716 and reviewed independently.
  id_allocation_provenance: >-
    EXP-PFDR-cbdefb pre-allocated by the tasking Coordinator in
    TASK-20260903-b5d2ae (third experiment id, in order). No state was
    scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before this contract is relied on.
