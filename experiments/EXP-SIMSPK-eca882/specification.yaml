experiment:
  id: EXP-SIMSPK-eca882
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-a6a224; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-a6a224
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Complete exhaustion of the SPECK rotation-pair space under optimal rotational-XOR trail weight,
    in a factorial design against specified, zeroed and randomized round-constant sequences, with
    an XOR-only floor control required to report exactly zero
  objective: 'A run reduces exactly one uncertainty: whether rotational-XOR reach is a measure of
    SPECK''s rotation pair or of its round-constant sequence, and therefore whether the rotation-pair
    space may be ranked on this axis at all. Concretely it determines (i) whether the frozen rotational-XOR
    weight function for modular addition matches exhaustive brute-force counting cell by cell at word
    sizes 4, 6 and 8, an exact integer test predicted to give zero disagreements, and whether the
    XOR-only floor control reports exactly zero weight as rotation-equivariance requires; (ii) the
    complete table of r_rx over the exhausted n^2 rotation-pair space at each round count under three
    constant-sequence conditions, specified, all-zero, and 32 uniformly random sequences, so that
    the rotation-pair main effect, the constant-sequence main effect and their interaction are read
    off a factorial design rather than inferred; and (iii) the ratio of those two main effects, which
    is the single number deciding whether this axis carries information about rotation pairs. The
    measured inflation caused by the frozen Hamming-weight state restriction is reported so every
    weight is visibly an upper bound. No hypothesis is minted and no attack is produced.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the SPECK round and key schedule
      pinned in STAGE 0, at word sizes 4, 6 and 8, at rotation offset gamma equal to 1, over the complete
      n^2 rotation-pair space, under the three named constant-sequence conditions, at round counts
      up to the ceiling reached, with the frozen Hamming-weight state restriction in force, (a) an
      exact integer disagreement count of the weight function against brute force; (b) an exact zero
      from the XOR-only floor control; (c) a table of upper-bound optimal rotational-XOR trail weights
      and the derived r_rx lower bounds; and (d) main effects and interaction from the factorial design.
      What does NOT follow: that any r_rx is the true rotational-XOR reach, since every weight is
      an upper bound under the state restriction; that a rotational-XOR trail of any length constitutes
      an attack, a distinguisher in use, a key-recovery cost or a data complexity; that any rotation
      pair is strong, weak, optimal or anomalous; that results at word sizes 4 through 8 transfer
      to 16, 24, 32, 48 or 64 or to other gamma; anything about the all-zero-constant object as a
      deployed cipher; anything about designer intent; and anything about the security of any SPECK
      variant.'
  inputs:
    procedure: STAGE 0, pin the SPECK round, rotation directions, key schedule and round-constant
      sequence against the specification and its test vectors, and freeze the rule for scaling the
      constant sequence to toy word sizes; human cost 45 to 90 minutes, may fail, failure recorded
      as a named missing baseline. STAGE 1, derive and freeze the rotational-XOR weight function for
      modular addition at gamma equal to 1, with a hashed preregistration file; 2 to 3 hours human,
      zero compute. STAGE 2, exhaustive brute-force verification of that function at word sizes 4,
      6 and 8 over all offset triples; minutes. STAGE 3, XOR-only floor control at every word size
      and round count, requiring exactly zero; seconds. STAGE 4, exhaustive dynamic-programming trail
      search at n = 6 over the full offset state, all 36 rotation pairs, all three constant conditions,
      rounds 1 to 12, with no censoring; roughly 20 to 40 minutes. STAGE 5, restricted-state search
      at n = 6 under the frozen Hamming-weight-3 restriction, compared cell by cell against STAGE
      4 to measure the inflation the restriction causes; minutes. STAGE 6, restricted-state factorial
      sweep at n = 8, all 64 rotation pairs by 34 constant conditions by rounds 1 to 12; bounded by
      the declared stage budget with any binding recorded as a budget outcome. STAGE 7, main-effect
      and interaction computation with resampling intervals over the 32 random sequences. STAGE 8,
      the separated control at n = 6 zeroing constants only in the state injection, to split the constant-sequence
      effect from the key-schedule effect where budget allows.
    instrument: CPython 3.11 standard library only. numpy, z3, python-sat and pulp are absent in this
      environment as verified on 2026-08-16, and Sage is excluded by contract, so the rotational-XOR
      trail search is an explicit dynamic program over offset states held as Python integers, with
      modular addition implemented by masking. The cipher used for the STAGE 0 test-vector validation
      is written independently of the trail-search code so a shared misreading of the round cannot
      be self-consistent. Random constant sequences come from a seeded random.Random with the seed
      in the manifest. Manifest, seeding and per-stage timing follow harness/runner.py conventions;
      identifiers minted with tools/allocate_id.py --next.
    parameters: 'Word sizes n in {4, 6, 8}, block sizes 8, 12 and 16 bits. Rotation-pair space exhausted
      completely: 16, 36 and 64 pairs respectively. Constant-sequence conditions: the scaled specified
      sequence, the all-zero sequence, and 32 uniformly random sequences with recorded seed, so 34
      conditions per pair. Round counts 1 through 12. Rotation offset gamma fixed at 1. Offset-state
      space: full 2^{2n} at n = 4 and 6, restricted to Hamming weight at most 3 per branch at n =
      8, with the restriction frozen in STAGE 1 and its inflation measured at n = 6 where both fit.
      Weight-function verification: all offset triples at n = 4, 6 and 8, exhaustive over all 2^n
      input pairs per cell. Total run ceiling 5400 seconds.'
  controls:
  - XOR-only floor control with modular addition replaced by XOR and zero constants, whose optimal
    rotational-XOR weight must be exactly zero at every round.
  - Exhaustive brute-force verification of the modular-addition weight function at word sizes 4, 6
    and 8, cell by cell.
  - All-zero constant-sequence condition, which isolates what the constants contribute by removing
    them, and which is a control object rather than a cipher anyone deploys.
  - 32 uniformly random round-constant sequences establishing the spread the measure produces across
    sequences.
  - Exhaustive-versus-restricted state-space comparison at n = 6, where both fit, quantifying how
    much the frozen Hamming-weight restriction inflates the reported weights.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both executable in the same invocation. The floor null is
    an XOR-only variant in which modular addition is replaced by XOR, making the round exactly rotation-equivariant
    when constants are zero, so the optimal rotational-XOR weight must be exactly zero at every round
    count. If the instrument reports any nonzero weight there, it is manufacturing weight and the
    entire sweep is void; this is the sharpest instrument check available because the correct answer
    is an exact zero rather than a distribution. The distributional null is unusual and stronger than
    the RQ requires: because the rotation-pair space is exhausted, the standardized pair''s rank is
    computed against the complete space rather than against a random sample, so there is no sampling
    null to construct on that axis. The random-constant-set null the RQ demands is therefore relocated
    to the constant SEQUENCE: 32 uniformly random round-constant sequences of the same length and
    shape are scored identically, and the specified sequence''s position among them is the null-controlled
    quantity. For any statement about the specified sequence to mean anything, the 32 random sequences
    must show a nonzero spread of r_rx; if they do not, the measure cannot separate sequences and
    no claim about the specified one is admissible.'
  independent_variables:
  - word size n
  - rotation pair (alpha, beta)
  - constant-sequence condition (specified, all-zero, one of 32 random)
  - round count r
  - state-space mode (exhaustive versus Hamming-weight-restricted)
  metrics:
    primary:
    - optimal rotational-XOR trail weight per (pair, condition, round)
    - r_rx per pair per condition
    - weight-function disagreement count against brute force, exact integer per word size
    - XOR-only floor control weight, required exactly zero
    secondary:
    - rotation-pair main effect, constant-sequence main effect and interaction on r_rx, with resampling
      intervals
    - number of distinct r_rx values across the 32 random constant sequences
    - measured inflation from the Hamming-weight restriction at n = 6
    - wall-clock seconds and peak resident memory per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ratio of the rotation-pair main effect to the constant-sequence main effect on r_rx,
      computed from the factorial design, together with the exact integer disagreement count of the
      frozen modular-addition weight function against exhaustive brute force.
    formula: 'Weight-function disagreement count predicted to be exactly 0, and XOR-only floor control
      weight predicted to be exactly 0 at every round. Main effects defined as follows: the constant-sequence
      main effect is the mean of r_rx over all rotation pairs under the all-zero condition minus the
      mean of r_rx over all rotation pairs under the specified condition, and is predicted to be strictly
      positive. The rotation-pair main effect is the standard deviation of r_rx across rotation pairs,
      averaged over the 32 random constant conditions. The preregistered prediction is that the ratio
      of the second to the first is less than 1.0, meaning the constant sequence moves r_rx more than
      the rotation pair does. No magnitude is pre-committed for either effect separately, because
      the campaign has never measured either and naming a number would be fabrication.'
    source: Pre-registered in the parent proposal IDEA-20260816-a6a224 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested word sizes are 4, 6 and 8, block sizes 8, 12 and 16 bits, against a family
      whose smallest deployed block size is 32 bits at word size 16. What is complete rather than
      sampled at these sizes is the rotation-pair space itself, exhausted exactly, which is the property
      that makes SPECK worth this treatment; the incompleteness is in word size and in the offset
      state restriction at n = 8, both declared. The transfer assumption is stated and not made: neither
      r_rx values nor the ranking of rotation pairs is claimed to hold at word size 16 or above, and
      the ratio of main effects is the quantity most likely to transfer because it is a statement
      about which factor the measure responds to rather than about a specific value; even that is
      offered as a hypothesis for the transfer contract to test, not as a conclusion. Results are
      additionally scoped to gamma equal to 1 throughout.'
    correspondence: null
  tail_checks:
  - The zero offset is handled explicitly and must propagate with weight zero under the XOR-only control
    and with the constants' forced offset otherwise.
  - Rotation pairs with alpha equal to beta are reported as a separate stratum since the round degenerates.
  - Rotation pairs with alpha or beta equal to zero are reported separately, since a missing rotation
    changes the round's structure qualitatively.
  - The maximum round reached per cell is reported alongside r_rx so ceiling-limited values are visibly
    budget outcomes.
  - The specified constant sequence's position within the 32 random sequences is reported as a rank,
    including when it is at an extreme, rather than only as a difference from their mean.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt the entire run and report an instrument fault if the XOR-only floor control reports any nonzero
    weight.
  - Abort the sweep if STAGE 2 finds any weight-function disagreement, since every trail weight computed
    from a wrong function is void.
  - Halt the n = 8 factorial at its declared stage budget and report the cells actually computed;
    a budget hit is never written as a bound on r_rx.
  - Halt the run at 5400 seconds total and report the word sizes and conditions actually completed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Zero weight-function disagreements at word sizes 4, 6 and 8, an exact zero from
    the XOR-only floor control at every round, a strictly positive constant-sequence main effect,
    at least 2 distinct r_rx values across the 32 random sequences, and a measured inflation from
    the Hamming-weight restriction at n = 6 within the declared tolerance.
  falsification_criterion:
  - Any nonzero weight from the XOR-only floor control.
  - Any cell-level disagreement between the frozen weight function and exhaustive brute-force counting.
  - A non-positive constant-sequence main effect.
  - Fewer than 2 distinct r_rx values across the 32 random constant sequences.
  - Hamming-weight restriction inflation at n = 6 exceeding the declared tolerance, which invalidates
    the n = 8 restricted results.
  - Zero variation of r_rx across the entire exhausted rotation-pair space under every constant condition,
    which removes this axis from the portfolio as a measured obstruction rather than a failure.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-a6a224
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The rotational-XOR weight function for modular addition is not supplied by this proposal; STAGE
    1 must derive it and the Coordinator must confirm it was frozen and hashed before STAGE 2 inspected
    any brute-force table.
  - The rule for scaling the specified round-constant sequence to word sizes 4, 6 and 8 has no canonical
    form and must be fixed by the Coordinator before the sweep, since it determines how the specified
    condition compares to the random ones.
  - The Hamming-weight-3 state restriction and its acceptable inflation tolerance must be set by the
    Coordinator in advance; a tolerance chosen after seeing the n = 6 comparison would make the n
    = 8 results unfalsifiable.
  - Whether the all-zero-constant condition should zero the state injection only, the key schedule
    only, or both, is a design choice with three defensible answers; the proposal runs both-and-separated
    where budget allows but the Coordinator must fix which is primary.
