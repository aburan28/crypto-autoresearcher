# =============================================================================
# EXP-CERTBIN-5af487 -- VERSION 1 (APPROVED by DEC-20261002-661a2c) frozen
# contract for H-CERTBIN-ec0945: Hamming-ball Frobenius-stable factor base
# B_w vs size-matched subspace / random-set / support-guess arms on
# CERTBIN toy cells (Stages 0-4).
#
# Source: IDEA-20260926-b6cc43 under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
# Seam G3 representation unlocker (answers KN-FIND-47da4e open direction).
# ZERO RUNS in this design packet. Stages 0-4 authorized for executor
# TASK-20261002-83dc0f. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Native-cardinality SAT arm OUT OF SCOPE.
# =============================================================================
experiment:
  id: EXP-CERTBIN-5af487
  hypothesis_id: H-CERTBIN-ec0945
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-b6cc43
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    G3 Hamming ball: Stage-0 size/even-weight freeze; Stage-1 RC-1
    reproduction; Stage-2 exhaustive oracle census; Stage-3 D<=5 closure
    on subspace/ball/random/support-guess arms; Stage-4 O-* reading
  status: approved
  approved_by: DEC-20261002-661a2c
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-661a2c
    composing_decision: DEC-20261002-661a2c
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-4 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute (plus tiny Python) authoring of ball sizes,
      even-weight fact, Cell-B order, H_cheap/H_dear bands, and seeds.
      Stage 1 reproduces RC-1 on RC-1's V (blocking). Stage 2 exhaustive
      oracle across arms. Stage 3 D<=5 closure with certificates. Stage 4
      decides exactly one O-* label. No Magma/Sage. No AUXIN. No Bedrock.
      No ECC2K-130 solve. No m>=3 / n=131 under this card. No native-
      cardinality SAT arm. No T5 closure filing under this card.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Price the per-attempt decomposition cost of a Hamming-ball factor base
    B_w in a normal basis against a size-matched subspace and a random-set
    control on RC-1 (n=17) and a Koblitz n=19 cell; decide H_cheap vs
    H_dear (or O-ARTIFACT / O-IMPEDIMENT) for the CERTBIN
    factor-base-choice column; answer KN-FIND-47da4e's open direction at
    toy scale without claiming any ECDLP exponent.

  class: measurement
  class_note: >-
    Factor-base-choice / instrument experiment with Stage-0 arithmetic
    freeze, Stage-1 baseline reproduction, Stages 2-3 heuristic-
    validation of H1 plus the H_cheap/H_dear decision, and Stage-4
    reading. Not an exponent-moving breakthrough experiment; no ECDLP
    attack table produced. Constant-factor lever at best (GGMP n/n^2 on a
    base that exists at n=131 without shift encoding).

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Write
        stage0/preregistered-predictions.json and stage0/derivations-note.md
        freezing: ball sizes C(n,k) for Cells A/B and n=131 arithmetic;
        even-weight fact Tr=HW mod 2; Cell-B Koblitz order re-derivation;
        H_cheap band [0.5,2] and H_dear threshold >2; equal-refutation
        condition; seeds 2026092651..; arm cardinality matching table;
        pointer to KN-FIND-47da4e open direction and IDEA-20260926-b6cc43.
        Must freeze before Stage 1.
      - >-
        Stage 1 (BLOCKING). Construct normal basis of F_{2^17}; verify
        rotation (=Frobenius) and independence; run unchanged RC-1
        pipeline on RC-1's V via e94b27 impl (copy/wrapper under
        write_scope); reproduce recorded closure statistics
        (KN-FIND-5a8d3e / DEC-20260926-cb4487 SUPPORT). Failure →
        O-ARTIFACT; do not open ball arms.
      - >-
        Stage 2. Exhaustive oracle (oracles_rc1 generalised) on every arm
        (subspace, B_3, optional B_2, random-set, support-guess) at Cell A
        (200 targets/arm) and Cell B Koblitz + ordinary (200 targets/arm);
        record decomposition rates, multiplicities, curve-arithmetic
        certificates.
      - >-
        Stage 3. Closure at D<=5 on every arm; record rows eliminated,
        refutation rate, certificate acceptance by separate verifier;
        on Koblitz Cell B count orbit conjugates per distinct orbit hit
        (must be 19).
      - >-
        Stage 4. Three-row reading: decide exactly one O-* label from
        H-CERTBIN-ec0945; write RESULTS.md with cited artifacts, ratios,
        CP95 where applicable, memory beside time.
    excluded:
      - Native-cardinality SAT / WDSat / CaDiCaL arm (engine not installed).
      - m>=3, n=131 solve, ECC2K-130 attack, any exponent claim.
      - Magma / Sage / AUXIN provisioning.
      - T5 closure / KN-FIND promotion under this card.
      - Editing IDEA-20260926-b6cc43 claim text or GOAL-ECDLP2M-001.yaml.

  inputs:
    proposal: ledger/proposals/IDEA-20260926-b6cc43.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-ec0945.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    goal: ledger/goals/GOAL-ECDLP2M-001.yaml
    approval_decision: ledger/decisions/DEC-20261002-661a2c.yaml
    rc1_support: ledger/decisions/DEC-20260926-cb4487.yaml
    kn_find_rc1: knowledge/findings/KN-FIND-5a8d3e.md
    kn_find_orbit: knowledge/findings/KN-FIND-47da4e.md
    kn_open_stable: knowledge/open-problems/KN-OPEN-095df5.md
    kn_lit_dp: knowledge/literature/KN-LIT-661e97.md
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    macaulay_instrument: experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
    closure_instrument: experiments/EXP-CERTBIN-e94b27/impl/closure.py
    oracle_instrument: experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py
    impl_readme: experiments/EXP-CERTBIN-e94b27/impl/README.md
    orbit_analysis: analysis/frobenius-orbit-ecc2k130/README.md
    analysis_brief: analysis/binstd-idea-review-20260926/BRIEF.md

  controls:
    - name: rc1_reproduction
      description: >-
        Stage-1 blocking: reproduce RC-1 closure statistics on RC-1's own
        V before any ball cell. Failure → O-ARTIFACT.
    - name: random_set_arm
      description: >-
        Null object of the same shape: random abscissa set of matched
        cardinality with table membership (enumeration floor).
    - name: size_matched_subspace
      description: >-
        RC-1 V={deg<9} at n=17; random dimension-10 subspace at n=19;
        |F| matched within factor 2 of the ball.
    - name: ordinary_curve_no_frob
      description: >-
        Ordinary n=19 cell beside Koblitz Cell B; ball per-attempt cost
        must agree within 1.5x (field-level constraint).
    - name: support_guess_arm
      description: >-
        ISD-style enumeration of weight-w supports; separates constraint
        degree from free-bit / block-size confound.
    - name: certificate_pair
      description: >-
        Curve-arithmetic verification of every counted decomposition;
        separate-process verification of every refutation certificate.
    - name: orbit_count_koblitz
      description: >-
        On Koblitz Cell B, each distinct orbit hit must produce exactly
        19 conjugates under orbit reduction.

  independent_variables:
    - name: arm
      levels: [subspace, ball_B3, ball_B2_optional, random_set, support_guess]
    - name: cell
      levels: [A_rc1_n17, B_koblitz_n19, B_ordinary_n19]
    - name: field_degree
      levels: [17, 19]
    - name: ball_radius_w
      levels: [2, 3]
      note: Primary comparison uses w=3; w=2 is optional smaller ball.
    - name: closure_degree_cap
      levels: [5]
    - name: arity_m
      levels: [2]

  primary_metrics:
    - name: closure_work_ratio
      definition: >-
        Ball-arm rows-eliminated-to-certificate at D<=5 divided by
        subspace-arm same metric, on unsatisfiable targets (per cell).
    - name: refutation_rate_ball
      definition: Fraction of unsatisfiable targets refuted at D<=5 on ball arm.
    - name: refutation_rate_subspace
      definition: Fraction of unsatisfiable targets refuted at D<=5 on subspace arm.
    - name: oracle_rate_by_arm
      definition: Exhaustive-oracle decomposition rate per arm per cell.
    - name: outcome_label
      definition: Exactly one of O-HCHEAP / O-HDEAR / O-ARTIFACT / O-IMPEDIMENT.

  secondary_metrics:
    - name: orbit_count
      definition: Conjugates per distinct orbit hit on Koblitz Cell B (must be 19).
    - name: koblitz_vs_ordinary_cost_ratio
      definition: Ball per-attempt closure work Koblitz / ordinary (must be in [1/1.5, 1.5]).
    - name: ball_sizes
      definition: Exact |B_w| and abscissa counts per cell (Stage 0 + Stage 2).
    - name: certificate_accept_counts
      definition: Decomp certificates accepted; refutation certificates accepted.
    - name: peak_rss_bytes
      definition: Peak RSS beside every timed stage.
    - name: support_guess_refutation_ratio
      definition: Support-guess refutation rate / subspace rate (expected in [0.5, 2]).

  seeds_and_replication:
    master_seed: 2026092651
    target_count_per_arm_per_cell: 200
    replication: >-
      Single primary replication under this card; seed and instance-set
      rule frozen in stage0/preregistered-predictions.json. A second seed
      is out of scope unless O-ARTIFACT triggers a repair amendment.
    matching_rule: >-
      |F| within factor 2 across subspace and primary ball; random-set
      cardinality matched exactly to the ball used in that cell.

  budget:
    wall_clock_seconds: 28800
    memory_gb: 8
    maximum_runs: 3
    cpu_note: >-
      Advisory. Estimate: Stage-1 minutes; Stage-2 seconds-to-minutes per
      arm (exhaustive over ~800-1200 abscissae × 200 targets); Stage-3
      minutes-to-tens-of-minutes per arm in pure Python at D<=5 with
      ~34-38 unknowns. Freeze scientific sample counts; do not expand to
      m>=3, n=131, or SAT engines with leftover wall clock.

  stopping_rules:
    - Stage 0 must freeze predictions before any Stage-1 metric is read.
    - Stage-1 RC-1 reproduction failure → O-ARTIFACT; do not open ball arms.
    - Oracle/closure disagreement on any instance → O-ARTIFACT; stop.
    - Rotation or even-weight check failure → O-ARTIFACT; stop.
    - Koblitz/ordinary ball cost gap >1.5x → O-ARTIFACT; stop.
    - After Stage 4, call exactly one O-* label and stop.
    - Budget abort / crash → O-IMPEDIMENT; never negative math evidence.
    - Do not open m>=3, n=131 solve, native SAT, or T5 closure under leftover budget.

  invalidation_rules:
    - Editing preregistered predictions after Stage-0 freeze invalidates ratios.
    - Reading ball arms before Stage-1 RC-1 pass voids the packet.
    - Mixing Cell-A and Cell-B targets in one arm voids that arm.
    - Using a SAT engine as the primary satisfiability oracle voids the primary metric under this card.
    - Counting uncertified decompositions or unverified refutations voids acceptance counts.
    - Infra timeouts are O-IMPEDIMENT, not H_dear.

  success_criterion: >-
    Stage 0 artifacts frozen; Stage-1 RC-1 reproduction executed (or
    recorded O-ARTIFACT); Stages 2-3 produce oracle rates, closure-work
    ratios, refutation rates, orbit counts, and certificate acceptance
    tables across arms/cells; RESULTS.md names exactly one O-* label from
    H-CERTBIN-ec0945 with cited artifacts; memory reported beside time.
    O-HCHEAP and O-HDEAR are both successful scientific executions.

  falsification_criterion: >-
    Any of: Stage-1 fails to reproduce RC-1; oracle and closure disagree
    on any instance; rotation/even-weight check fails; Koblitz vs ordinary
    ball per-attempt cost differs by more than 1.5x while still claiming
    H_cheap or H_dear; H_cheap claimed when ratio >2 or refutation rates
    disagree; H_dear claimed when ratio stays in [0.5,2] with equal
    rates; TW/T5/KN-FIND filed under this card; or a claim of
    break/exponent/n=131 solve under this card.

  required_artifacts:
    - experiments/EXP-CERTBIN-5af487/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-5af487/stage0/derivations-note.md
    - experiments/EXP-CERTBIN-5af487/stage1/
    - experiments/EXP-CERTBIN-5af487/stage2/
    - experiments/EXP-CERTBIN-5af487/stage3/
    - experiments/EXP-CERTBIN-5af487/stage4/
    - experiments/EXP-CERTBIN-5af487/RESULTS.md
    - experiments/EXP-CERTBIN-5af487/runs/<RUN-CERTBIN-*>/

  pre_registered_prediction: >-
    H_cheap: ball/subspace D<=5 closure-work ratio in [0.5, 2] with equal
    refutation rates; H_dear: ratio > 2 or ball refutation rate strictly
    below subspace. Honest prior is open between the two (cardinality
    degree may or may not dominate at w=3). Oracle rates equal across
    arms within sampling error under H1. Koblitz orbit count exactly 19.
    Frozen before Stage 1; never adjusted after any run (amendment path
    only).

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
