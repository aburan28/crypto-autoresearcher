  attacked_items:

    - id: ATK-1
      item: null_object_sizing -- the separation-power calculation setting N' <= N/64
      finding_headline: >-
        THE ARITHMETIC IS CORRECT AND THE CONCLUSION IS SAFE, BUT THE STATED
        REASONS FOR THE MARGIN ARE MOSTLY WRONG-SIGNED, AND THE STATISTIC THE
        GATE ACTUALLY USES IS NOT THE ONE THE CALCULATION MODELS.
      derivation_check_density_and_se: >-
        VERIFIED FROM FIRST PRINCIPLES. For plain-rho survival
        P(T > t) = exp(-t^2/(2N)), write T = sqrt(N)*X with P(X > x) =
        exp(-x^2/2). Then F(x) = 1 - exp(-x^2/2) and the density is
        f(x) = x*exp(-x^2/2), which is the correct density for THIS survival.
        At the median mu = sqrt(2 ln 2) = 1.1774100 the exponential factor is
        exp(-mu^2/2) = exp(-ln 2) = 0.5 exactly, so f(mu) = 1.1774100*0.5 =
        0.5887050. The asymptotic standard error of a sample median of n draws
        is 1/(2*f(mu)*sqrt(n)); at n = 16 that is 0.2123299, which is 18.034
        percent of the median. Every figure in the contract's `model` paragraph
        reproduces. So the answer to "is the density f at the median right for
        the plain-rho survival" is YES.
      derivation_check_power_table: >-
        VERIFIED ENTRY BY ENTRY, recomputed in this session with no reference to
        the contract's values. With E[D] = mu - 1.96*s - mu/sqrt(r) and
        SD[D] = s*sqrt(1 + 1/r) and power = Phi(E[D]/SD[D]):
        r=16  E[D]=0.46689 SD=0.21887 z=2.1332 Phi=0.98355 (contract 0.9835);
        r=32  E[D]=0.55310 SD=0.21562 z=2.5651 Phi=0.99484 (contract 0.9948);
        r=64  E[D]=0.61407 SD=0.21398 z=2.8697 Phi=0.99795 (contract 0.9980);
        r=100 E[D]=0.64350 SD=0.21339 z=3.0156 Phi=0.99872 (contract 0.9987).
        Maximum discrepancy 4e-5, i.e. rounding. The separation event is also
        stated correctly -- A*sqrt(N/r) < (B - 1.96 s)*sqrt(N) is equivalent to
        D > 0, and the variance decomposition Var(D) = s^2 (1 + 1/r) is right
        for independent A and B. The illustrative identity in
        resolution_statistic is also right: P(min of 16 > c) = exp(-8 c^2), and
        at c = mu/4 that is exp(-ln 2) = 0.5000 exactly.
      is_the_normal_approximation_sound_at_n_16: >-
        IT IS NOT EXACT, AND ITS ERROR RUNS IN THE CONTRACT'S FAVOUR, WHICH THE
        CONTRACT DOES NOT KNOW. Simulated sampling distribution of the
        median-of-16 of Rayleigh draws, 2 000 000 replicates in this session:
        mean 1.18511 (against the asymptotic centre 1.17741), SD 0.20280
        (against the asymptotic SE 0.21233 -- the asymptotic value OVERSTATES
        the true SD by 4.5 percent, because the even-n median averages the 8th
        and 9th order statistics), skewness +0.204, excess kurtosis +0.034.
        The lower tail, which is the tail this calculation depends on, is
        THINNER than normal: P(median < mu - 1.96 s) = 0.01272 against the
        normal 0.02500. So approximation (1) in the contract's own list is
        conservative, not eroding.
      is_the_band_edge_really_b_minus_1_96_s: >-
        NO, AND AGAIN IN THE CONTRACT'S FAVOUR. Simulating the actual declared
        procedure (16 draws, 4000 nonparametric bootstrap resamples of 16 with
        replacement, median of each, 2.5 and 97.5 percentiles), 20 000 base
        curves: mean lower edge 0.8139 with SD 0.1834, against the surrogate
        B - 1.96 s whose mean is 0.7670 with SD 0.2015. The real gate threshold
        sits 0.0468 HIGHER than modelled -- 22 percent of s -- and is LESS
        variable, not more. A higher lower edge makes separation EASIER. Mean
        realized half-width is 0.3974 against the nominal 1.96 s = 0.4162, i.e.
        95 percent of nominal; realized coverage of the true median is 0.9402
        against nominal 0.95. So approximation (2) in the contract's list --
        "the bootstrap adds estimation noise the table does not carry" -- is
        also conservative in net, not eroding.
      what_the_actual_power_is: >-
        SIMULATED END TO END, 20 000 base curves, the null statistic taken four
        different ways because the contract does not fix it (see NEW-04):
        r=16  pooled-128 0.99945, median-of-8-medians 0.99935, single
              median-of-16 0.99845, all-8-must-separate 0.99540;
        r=32  1.00000 / 0.99995 / 0.99995 / 0.99980;
        r=64  1.00000 / 1.00000 / 1.00000 / 1.00000;
        r=100 1.00000 on every reading.
        THE CONCLUSION N' <= N/64 IS SAFE. It is safe by a wider margin than the
        table claims, and it would have been safe at r = 16 too: the honest
        power at r = 16 is 0.9985 to 0.9995 against the tabulated 0.9835, so the
        declared target of "WELL ABOVE 0.99" is already met at the predecessor's
        own ratio.
      does_the_stated_margin_argument_hold: >-
        NO. Three of the contract's four "stated_approximations_and_why_the_
        margin_is_there" have the wrong sign and the fourth is neutral.
        (1) non-normality at n=16 -- conservative, thinner lower tail (measured
        0.01272 vs 0.02500);
        (2) bootstrap estimation noise -- conservative, the real edge sits
        0.0468 higher than the surrogate;
        (3) censoring "a bias AGAINST separation, so it eats margin rather than
        manufacturing it" -- WRONG SIGN at the contract's own designated
        configuration, see ATK-4, where the control is censored LESS than the
        members and the residual bias makes separation slightly EASIER;
        (4) the finite-r walk penalty "largely cancels in the ratio" --
        approximately true and roughly neutral.
        The margin from 0.99 to 0.998 is therefore real but was bought for
        reasons that do not hold, and the purchase is not free: it is exactly
        the choice of r = 64 over r = 16 that drives the 20-bit null objects
        into a degenerate distinguished-point regime (ATK-4). This is the one
        place where a conservative model produced a materially worse design.
      residual_defect: >-
        The calculation models A as ONE curve's median-of-16 with SD s. The gate
        it sizes is evaluated on "the null objects' pooled median-of-16" over 8
        curves, whose SD is roughly s/sqrt(8) -- a different statistic with a
        third of the dispersion. The direction is again conservative, but the
        calculation and the gate are not computed on the same object, and the
        gate's object is undefined. See NEW-04.
      status: correct_arithmetic_safe_conclusion_wrong_rationale_undefined_gate_statistic

    - id: ATK-2
      item: >-
        HEUR-ISOU-1's corrected constants and the dimensional/statistical
        coherence of the median reproduction fixture
      finding_headline: >-
        ALL FIVE CONSTANTS VERIFY INDEPENDENTLY AND THE MEDIAN-AGAINST-MEDIAN
        CONSTRUCTION IS COHERENT. BUT THE CLAUSE BUILT ON IT IS NEAR-VACUOUS --
        IT ACCEPTS THE NEGATION-MAP CONSTANT THIS SUPERSESSION EXISTS TO REJECT
        WITH PROBABILITY 0.58.
      independent_derivation: >-
        All from P(T > t) = exp(-t^2/(2N)), recomputed here.
        MEDIAN: exp(-t^2/(2N)) = 1/2 gives t^2 = 2 N ln 2, so
        median = sqrt(2 N ln 2) = 1.1774100*sqrt(N). CONFIRMED.
        MEAN: E[T] = integral of the survival over t >= 0 =
        sqrt(2N)*sqrt(pi)/2 = sqrt(pi N/2) = 1.2533141*sqrt(N). CONFIRMED.
        NEGATION MAP: rho in the quotient by inversion runs on an effective
        group of order N/2, so its mean is sqrt(pi (N/2)/2) = sqrt(pi N/4) =
        0.8862269*sqrt(N), and sqrt(pi N/2)/sqrt(pi N/4) = sqrt(2) = 1.4142136
        exactly. CONFIRMED -- the identification of 0.886*sqrt(N) as the
        negation-map MEAN, and the sqrt(2) error factor, are both right.
        DISPERSION: E[T^2] = 2 N by the survival integral, so
        Var = 2N - pi N/2 and CV = sqrt(4/pi - 1) = 0.5227232, independent of N.
        CONFIRMED.
        RESOLUTION OF A MEDIAN OVER n SEEDS: f(mu) = 0.5887050 and
        1/(2 f sqrt(16)) = 0.2123299. CONFIRMED.
        H-ISOU-5748b6's constant_derivation is correct as written, in all five
        parts, and VAL-DEF-02 is genuinely cured at the hypothesis record.
      dimensional_and_statistical_coherence: >-
        COHERENT, AND THIS IS THE GENUINE CURE. The compared quantity is the
        base curve's median over 16 seeds; the constant is the ideal MEDIAN of
        the same law; the band is the bootstrap sampling interval of that same
        median-of-16 statistic. Statistic, constant and interval now agree in
        kind, which is exactly the incoherence VAL-DEF-02 named (a MEAN asserted
        where the protocol compares a MEDIAN) and it is gone.
      but_the_clause_has_almost_no_power: >-
        MEASURED, NOT ASSERTED. Simulating the declared band over 20 000 base
        curves and asking which candidate constants it contains, at a true
        overhead of 5 percent:
          sqrt(pi N/4) = 0.8862*sqrt(N), THE NEGATION-MAP CONSTANT THAT
            VAL-DEF-02 DECLARES WRONG  -> contained with probability 0.5807;
          sqrt(2 N ln 2) = 1.1774 (the corrected median)     -> 0.9302;
          sqrt(pi N/2) = 1.2533 (the MEAN misused as median) -> 0.9388;
          0.75*sqrt(N)  (25 percent low, arbitrary)          -> 0.3024;
          1.60*sqrt(N)  (36 percent high, arbitrary)         -> 0.6265;
          2.00*sqrt(N)  (70 percent high, a badly broken meter) -> 0.1098.
        The band's mean half-width is 32 percent of the fixture, so it spans
        roughly [0.65 F, 1.36 F] -- a factor-2 window.
      the_empirical_demonstration_already_exists: >-
        Applying the four ACTUAL frozen bands from BATCH-009b1b, in units of
        sqrt(N): 20BIT-A [0.8958, 1.7750], 20BIT-B [0.9250, 1.7401], 24BIT-A
        [0.8637, 2.2290], 24BIT-B [0.7757, 1.5558]. The successor's fixture
        1.2363 is inside all four. The OLD, WRONG constant 0.8862 is inside two
        of the four. A clause that cannot reject the constant its own
        supersession was written to correct, in half the runs already observed,
        is not a reproduction check.
      consequence_for_the_contracts_own_boast: >-
        The contract states "THE CLAUSES ARE NOT IN OPPOSITION, WHICH IS A
        REQUIREMENT AND NOT AN ACCIDENT" and invites a future reviewer to check
        it directly rather than take the paragraph's word. CHECKED. Simulated
        P(reproduction clause) = 0.9402, P(null separation at r=64) = 1.0000,
        P(both) = 0.9402, and P(both) minus the product of the marginals is
        +0.00000 -- the clauses are independent, so the claim is TRUE. But it is
        true for a reason the paragraph does not give: they are not in
        opposition because the reproduction clause is near-vacuous, not because
        the fixture was corrected. The sentence "the reproduction check's
        discriminating power comes from the CONSTANT and the STATISTIC, not from
        eps" is false; at a plus-or-minus 32 percent band it comes from neither.
      status: constants_verified_clause_underpowered

    - id: ATK-3
      item: >-
        the reproduction tolerance and its disclosed data-informed provenance
        (eps = 0.05)
      finding_headline: >-
        DEFENSIBLE ON PROVENANCE AND NOT SIZED TO PASS -- IT IS INERT. THE
        TOLERANCE THAT MATTERS IS THE BAND, WHICH IS PROPERLY DERIVED FROM THE
        SAMPLING DISTRIBUTION; eps DOES NO WORK IN EITHER DIRECTION AND, IF
        ANYTHING, UNDERSHOOTS.
      two_tolerances_must_be_separated: >-
        The clause has a LOCATION allowance (eps = 0.05) and a DISPERSION
        interval (the bootstrap band). Only the second decides anything.
        Measured: moving eps from 0 to 0.05 moves the clause's pass probability
        from 0.9302 to 0.9402. That is the whole effect of the disclosed
        data-informed number. It is therefore NOT "a tolerance sized to pass" in
        the sense the task asks about -- a tolerance sized to pass would have to
        be doing work, and this one is not.
      and_it_probably_undershoots: >-
        Reconstructing the expected median overhead from the predecessor's own
        measurements plus this contract's own density law:
        finite-r penalty, backed out of the four pooled means (which sit
        6.52 / 5.32 / 5.72 / 4.04 percent above the ideal MEAN after removing
        the predecessor's distinguished-point term) = 3.7 to 5.4 percent,
        multiplicative and therefore identical on the median;
        plus this contract's distinguished-point detection overhead, 1/kappa =
        1.5625 percent of sqrt(M), which is 1.327 percent OF THE MEDIAN
        (the contract quotes 1.6 percent of sqrt(M) and does not convert);
        plus the censoring bias on the surviving median, measured here at
        +0.73 percent at kappa_eff = 64, which the contract's eps paragraph
        omits entirely.
        Total expected median overhead 5.8 to 7.5 percent against a declared
        eps of 5 percent. The disclosed provenance did not produce a
        pass-sized tolerance; it produced a slightly low one.
      minor_arithmetic_in_the_same_paragraph: >-
        The contract states "pooled means sat 4 to 6 percent above the ideal at
        both prime sizes". The four values are 6.52 / 5.32 / 5.72 / 4.04
        percent, so the range is 4.0 to 6.5. And eps is calibrated from a MEAN
        overhead but applied to a MEDIAN; the additive detection component's
        relative size is larger on the median by the factor mean/median =
        1.06446. Both are small and both are in the paragraph whose whole
        purpose is provenance honesty.
      what_is_actually_wrong_and_how_to_fix_it: >-
        The defect is not the tolerance's provenance, it is the clause's
        resolution, and it is cheap to fix at toy scale. The base curve's 16
        seeds give an SE of 18.0 percent of the median; SE scales as
        1/sqrt(n), so about 50 base-curve seeds give a plus-or-minus 20 percent
        band, 144 give about 12 percent and 200 give about 10 percent. A
        base-curve solve is of order 10^3 to 10^4 group operations at these
        sizes, so 200 base seeds is negligible against the 27 008 solve records
        the predecessor already produced inside 313 seconds. Alternatively, or
        additionally, test the SHAPE of the whole empirical survival against
        exp(-x^2/2) rather than one point against a two-sided interval, on the
        pooled null-object sample (8 curves times 16 seeds = 128 draws at a
        known order), which is independent of the class-uniformity question the
        census is testing. Either change makes the fixture able to reject
        0.886*sqrt(N), which is the minimum bar for a clause created by
        VAL-DEF-02.
      status: provenance_defensible_clause_must_be_re_resolved

    - id: ATK-4
      item: >-
        inputs.distinguished_point_density -- theta(M) = kappa/sqrt(M),
        kappa = 64, claimed 1.2 percent censoring and 1.6 percent detection
        overhead identical for members and controls at every scale
      finding_headline: >-
        THE CENSORING FIGURE IS WRONG BY A FACTOR pi/2 = 1.5708, AND THE
        SCALE-INVARIANCE CLAIM IS FALSE AS IMPLEMENTED. WORSE, THE TWO NEW
        FROZEN CONSTANTS -- kappa = 64 AND N' <= N/64 -- ARE MUTUALLY
        INCOMPATIBLE AT 20 BITS.
      censoring_derivation_recomputed: >-
        For a random functional graph the rho length rho = lambda + mu_cycle has
        density x*exp(-x^2/2) in units of sqrt(M), and conditional on rho the
        split is uniform, so mu_cycle = U*rho with U uniform on [0,1]. A walk is
        censored exactly when its cycle contains no distinguished point, so
        P(censored) = E[(1-theta)^{mu_cycle}] = E_rho[(1 - e^{-b rho})/(b rho)]
        with b = -ln(1-theta). Writing k = b*sqrt(M),
        P = (1/k) * integral over x of (1 - e^{-k x}) e^{-x^2/2} dx, whose
        leading term is E[1/X]/k = sqrt(pi/2)/k = 1.2533/k.
        THE FACTOR 1.2533 BELONGS IN THE NUMERATOR. The contract writes
        "approximately 1/(kappa * 1.2533)", which puts it in the denominator and
        is wrong by (pi/2) = 1.5708.
        Exact values computed here: at kappa_eff = 64, P = 1.934 percent (the
        contract says "about 1.2 percent"); at kappa_eff = 255.9,
        P = 0.488 percent (contract form 0.312 percent).
      checked_against_the_predecessors_measurements: >-
        With the predecessor's fixed theta = 1/16, kappa_eff = -ln(15/16)*
        sqrt(N) is 66.1 at 20 bits and 264.3 at 24 bits. The exact form predicts
        1.872 and 0.473 percent; the contract's form predicts 1.206 and 0.302
        percent. MEASURED member censoring in the four archived runs was 1.41
        and 1.93 percent at 20 bits and 0.45 and 0.31 percent at 24 bits. The
        exact form brackets the 20-bit data; the contract's form sits below both
        20-bit observations. (The exact form is a slight overestimate because
        the real walk is about 5 percent longer than the ideal, which reduces
        censoring by the same proportion -- giving 1.78 and 0.45 percent, which
        is the data.) The contract's declared 1.2 percent is a prediction the
        run is required to report against; leaving it in will produce a
        spurious instrument finding in the defect log on the first run.
      scale_invariance_does_not_hold_as_implemented: >-
        theta(M) = kappa/sqrt(M) IS scale-invariant. The contract does not
        implement that. It implements theta = 1/m(M) with m(M) the power of two
        NEAREST sqrt(M)/kappa, so kappa_eff = sqrt(M)/m ranges over
        [kappa/sqrt 2, kappa*sqrt 2]. Computed across the configurations the
        contract itself specifies, the detection overhead -- claimed as "a fixed
        1/kappa = 1.6 percent of sqrt(M) at every scale" -- actually ranges from
        1.11 to 2.21 percent of sqrt(M), and censoring from 1.29 to 2.37
        percent. "Identical for members and controls at every scale" is false as
        written.
      the_two_new_constants_conflict_at_20_bits: >-
        THIS IS THE LOAD-BEARING FINDING OF THIS ITEM. At 20 bits N is about
        1.05e6, so N' <= N/64 forces N' <= 16 409, sqrt(N') <= 128.1, and
        sqrt(N')/kappa <= 2.00. The nearest power of two is therefore 2, or 1
        once N' drops below about N/128. So the 20-bit null objects run at
        theta = 1/2 -- half of all points distinguished, memory of order half
        the walk -- or, for a slightly smaller p', at theta = 1, meaning EVERY
        point is distinguished and there is no distinguished-point method at
        all. Members run at theta = 1/16 (20-bit) and 1/64 (24-bit). Reaching
        m >= 4 at 20 bits requires N' >= about 32 800, i.e. r of about 32; and
        m = 4, which matches the members' 1.5625 percent detection overhead
        EXACTLY, requires r of about 16. The contract's own recorded_consequence
        notes that the 20-bit members take m = 16 and the 24-bit members m = 64
        but does not compute m for the null objects at the ratio it designates.
        At 24 bits the rule works: r = 64 gives m = 8, censoring 1.81 percent
        against members' 1.92 percent and an identical 1.5625 percent detection
        overhead.
      is_vaL_def_09_reintroduced: >-
        IN A NEW FORM, YES -- BUT MUCH SMALLER AND WITH THE OPPOSITE SIGN. At
        20 bits and r = 64 the control's censoring is 1.40 percent against the
        members' 1.87 percent. Censoring removes short-cycle walks and biases
        surviving medians UPWARD; measured here, +0.73 percent of the median at
        kappa_eff = 64 and about +0.55 percent at kappa_eff = 89. So the members
        are biased up MORE than the control and the residual bias makes
        separation slightly EASIER -- it manufactures a little separation rather
        than eating margin, which is the opposite of what the contract's
        approximation (3) asserts. The magnitude, about 0.2 percent of the
        median against an 8-fold gap, does not threaten the r = 64 gate. It
        would matter at r = 16, where the contract also tabulates power. The
        1.2 percent figure does NOT reintroduce the predecessor's 10.2 versus
        1.4 percent asymmetry; that part of VAL-DEF-09 is genuinely cured. What
        is not cured is the claim of identity and the sign of the residual.
      status: arithmetic_error_plus_internal_incompatibility_must_be_fixed_before_freeze

    - id: ATK-5
      item: >-
        Q3 basis designation, the own-mix versus common-mix declaration, and the
        declared-versus-implemented formula self-check
      finding_headline: >-
        THE BASIS DESIGNATION IS A REAL CURE. THE SELF-CHECK, AS SPECIFIED,
        CANNOT DETECT THE DIVERGENCE THAT PRODUCED VAL-DEF-04 -- BECAUSE IT
        CARRIES NO INDEPENDENCE REQUIREMENT.
      what_is_genuinely_cured: >-
        VAL-DEF-05 and COST-03 are closed. The primary basis is measured Velu
        isogeny EVALUATIONS, which is the predecessor contract's own literal
        definition of charged_end_to_end_cost and the basis on which the two
        readings diverged; the modelled-construction basis is explicitly
        SECONDARY; both must be reported side by side at member and class level;
        each report must carry the modelled-to-measured ratios against both the
        measured walk and the entire base solve; and the model's PESSIMISTIC
        direction must be stated in words, not merely implied by the formula.
        That is a complete and correct response to a defect where a modelled
        term 51x to 120x the entire measured base solve determined the headline.
        VAL-DEF-04 is likewise closed on the mix axis -- but by DECLARING BOTH
        FORMS, not by the self-check. Once own-mix is the declared primary and
        common-mix is a declared secondary line, the specific divergence
        (implemented own-mix against declared common-mix) cannot recur silently.
      why_the_self_check_does_not_do_what_is_claimed: >-
        VAL-DEF-04 was not an arithmetic slip. Both formulas were arithmetically
        correct; the defect was that the symbol Q2(member) in the declared
        string denoted the COMMON-mix per-operation cost while the implementation
        bound it to the member's OWN add/double mix, and a reader applying the
        manifest's stated rule got 27/76/88/32 members below base against the
        recorded 24/75/90/37, with a symmetric difference of 3/1/2/5 MEMBERS --
        different sets, not just different counts. A self-check that "recomputes
        both from the declared formula strings and FAILS THE RUN on any
        disagreement with the implemented values", run in-process and resolving
        each symbol to the same in-memory variable the implementation used,
        verifies arithmetic and nothing else. If Q2(member) resolves to the same
        variable on both sides, a mislabelled binding is invisible to it. The
        contract imposes a strong independence requirement on the CERTIFICATE
        checker (separate process, imports nothing from the solver, different
        modular inversion, different scalar-multiplication schedule) and a real
        one on the summary REGENERATION check (rebuilt from archived bytes in a
        separate invocation and hash-compared). It imposes NONE on the Q3
        self-check, which is the check standing in for the defect that motivated
        it.
      required_change: >-
        The Q3 declared-versus-implemented self-check runs in a SEPARATE PROCESS
        over ARCHIVED ARTIFACTS ONLY, importing nothing from the census, and
        every symbol appearing in each declared formula string must resolve to a
        NAMED FIELD OF A NAMED ARCHIVED ARTIFACT. That makes the check test the
        binding of names to values, which is where VAL-DEF-04 lived, rather than
        the arithmetic, which was never in doubt.
      secondary_gap: >-
        Falsification criterion F4 designates only the WALK axis ("ON THE
        PRIMARY (MEASURED-EVALUATION) BASIS") and is silent on the MIX axis,
        while metrics...q3_definition designates own-mix as the declared primary
        elsewhere in the record. The two must be joined in one place: a single
        frozen string naming Q3_primary as measured-evaluation walk plus own-mix
        solve, cited by F4. The predecessor showed the mix choice changes the
        flagged SET, so an inference across two paragraphs is not enough for a
        falsification criterion.
      status: basis_cured_self_check_needs_independence

    - id: ATK-6
      item: >-
        controls[completeness_gate] and inputs.base_curve_selection -- is the
        gate really able to fail, and does a short closure void the right
        statements
      finding_headline: >-
        THE GATE IS GENUINELY ABLE TO FAIL AND THE VOIDING LOGIC IS CORRECT. BUT
        "THIS IS THE CURE FOR VAL-DEF-03 AND IT IS THE WHOLE OF IT" IS FALSE --
        THE RETAINED SELECTION CRITERIA STILL CONDITION THE GATE BY A FACTOR OF
        ABOUT 50, AND THEY ARE NOT DECLARED.
      what_is_correct: >-
        Removing "the declared degrees generate cl(O)" from base-curve selection
        and applying it afterwards as a post-selection check is the right cure
        and is stated unambiguously, including a bar on reintroducing it "as a
        tiebreak, a retry, or a re-seeded selection", plus an invalidation rule
        if it ever becomes a selection filter again. The voiding logic is also
        correct and consistent in three places (controls, invalidation_rules,
        success_criterion): a walk closing short of h invalidates every
        complete-class "no member is cheaper" claim from that run and
        explicitly does NOT invalidate that run's per-member Q1 and Q2 data,
        which stand as measured and are flagged as drawn from a subgraph. That
        is exactly the asymmetry the task asks me to verify, and it holds.
      the_residual_conditioning_is_real_and_measurable: >-
        COMPUTED IN THIS SESSION, NOT ASSERTED. Whether {2, 3, 5, 7, 11, 13}
        generate cl(O) is obstructed by genus theory: the genus group is
        (Z/2)^(t-1) where t is the number of prime discriminant factors of D,
        the classes of the split primes must span it, and 2^(t-1) DIVIDES h. I
        enumerated all fundamental discriminants D in (-40000, 0), computed the
        genus characters with my own Kronecker symbol, and tested whether the
        six declared degrees span the genus group. Provable-failure rate (a
        SUFFICIENT condition for the gate to fail, hence a lower bound):
          t=1  n=2119   0.00 percent
          t=2  n=5010   8.94 percent
          t=3  n=3890  38.15 percent
          t=4  n=1076  85.32 percent
          t=5  n=  65 100.00 percent
          overall 23.97 percent.
        Split instead by class number, which is the filter the contract retains:
          h < 40           n=4759  34.27 percent
          h in [40, 160]   n=6794  18.84 percent
          h in (160, 800]  n= 607   0.66 percent.
        So the h-range filter moves the gate's failure probability by a factor
        of about 50, and the |D| <= DMAX filter moves it too. The gate can fail
        -- which is the point and is a real improvement -- but HOW OFTEN, and
        therefore how much diagnostic information a PASS carries, is set by two
        numbers the contract does not declare (see NEW-02). Under the
        predecessor's ranges the rate would have been roughly 19 percent at
        20 bits, which is a usefully falsifiable gate; that is a property of the
        producer's undeclared choice, not of this contract.
      no_other_step_reintroduces_the_direct_conditioning: >-
        CHECKED. Of the six permitted criteria, "p prime of the declared bit
        size", "N = p+1-t prime" and "the a = -3 model reachable" carry no
        correlation with degree generation; "D fundamental (conductor f = 1)" is
        the structural target and is required for the Hurwitz-Kronecker count to
        be the right comparison; only "|D| within DMAX" and "h within the
        declared range" carry the residual above. No cost datum, no walk
        reference and no degree reference appears in the criteria list. The
        selection rule among ACCEPTED candidates (first acceptance in seeded
        order, or otherwise) is not stated and should be.
      status: cure_real_but_incomplete_and_its_remaining_filters_undeclared

  # ===================================================================
  # DEFECTS OF THE PRIOR REPORT: CURED, PARTLY CURED, OR ACKNOWLEDGED
  # ===================================================================
  predecessor_defect_disposition:
