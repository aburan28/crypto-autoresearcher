        declared seeds, per curve), the interval rule (nonparametric bootstrap,
        95 percent, 4000 resamples, 2.5/97.5 percentiles), the freeze ordering
        and the explicit demotion of the raw per-seed range to a non-criterion
        are all now IN THE CONTRACT, with the coin-toss arithmetic reproduced
        correctly. Residue: the mandatory stop is evaluated on an undefined
        "pooled median-of-16" (NEW-04) and the bootstrap RNG seed is still left
        to the producer's manifest (NEW-02), and both move the threshold that
        decides the stop.
    - defect: VAL-DEF-02
      claimed_cure: preregistered_prediction and success_criterion
      assessment: >-
        CURED AT THE RECORD LEVEL, NOT AT THE INSTRUMENT LEVEL. The constant and
        the statistic are correct and derived (ATK-2). The clause built on them
        cannot reject the wrong constant (ATK-2, ATK-3). Fixing the record
        without fixing the instrument leaves the check that motivated the whole
