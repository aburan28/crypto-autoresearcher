  # ===================================================================
  # NEW DEFECTS INTRODUCED OR LEFT STANDING BY THE CURE
  # ===================================================================
  new_defects:

    - id: NEW-01
      severity: blocking_before_approval
      title: >-
        required_artifacts still does not satisfy the repository's own
        run-record schema -- the one defect the last batch discovered only after
        archival is reproduced verbatim
      detail: >-
        tools/validate_ledger.py check_run requires each run manifest to carry a
        top-level `run:` key with id, experiment_id, status, code, environment,
        inputs, timing and result; run.code.commit and run.code.command present;
        and the five companion files command.txt, environment.json, stdout.log,
        stderr.log and raw-result.json in the run directory. Verified by reading
        the checker (RUN_REQUIRED_TOP at line 173, the companion-artifact loop at
        lines 446-449) and by running it: on the tree as this session opened,
        the four EXP-ISOU-2ac81f manifests each reported "expected top-level key
        'run'" and EV-ISOU-7c6405 reported "evidence references unknown run
        'RUN-ISOU-2ac81f-20BIT-B'" and "...-24BIT-B" as a cascade -- a committed
        evidence record unable to cite its own runs. Commit d5b16bcc9 repaired
        that DURING this review, by supersession: a manifest_v2.yaml under a
        nested run: key plus the five companion files per run, registered in
        tools/run_supersession_registry.yaml as supersession_kind
        additive_schema_completion, with the original manifests byte-untouched.
        The tree now validates clean.
        THE SUCCESSOR CONTRACT DOES NOT ADOPT ANY OF IT. Its required_artifacts
        asks for "run manifest with the resolved inference block, the
        environment, peak memory, and every frozen protocol constant including
        the formula strings" -- the same shape as the predecessor, with no
        nested run: key and none of the five companion files. Grepping the whole
        specification for run_record, manifest_v2, raw-result, command.txt,
        environment.json, stdout.log, stderr.log or validate_ledger returns
        nothing. Other experiments in this repository (EXP-SMTH-4403c4,
        EXP-MLKEM-010, EXP-ALISO-018 and -020) do write the compliant package,
        so this is not an unmet convention.
      consequence: >-
        An Executor told to write nothing outside the declared artifact set will
        comply, exactly as the last one did, and the successor's runs will again
        be unindexable and uncitable by any evidence record -- discovered again
        after archival, and repaired again by a supersession commit that should
        never have been needed. The repair route now exists and is documented;
        the contract is the only place it can be made unnecessary.
      required_change: >-
        Add to required_artifacts, explicitly: a run manifest under a top-level
        `run:` key carrying id, experiment_id, status, code (with commit,
        dirty and command), environment, inputs, timing and result with a
        certificate block whose kind is one of discrete_log, decomposition or
        none; and the five companion files command.txt, environment.json,
        stdout.log, stderr.log and raw-result.json in each run directory. Add an
        invalidation or completion-gate clause that the run package must pass
        `python3 tools/validate_ledger.py` before the snapshot archive.

    - id: NEW-02
      severity: material
      title: >-
        Nine load-bearing parameters are referenced as "declared" but are
        declared nowhere in the contract, and at least five of them decide a
        gate
      detail: >-
        Referenced-but-undeclared: (1) DMAX, the discriminant bound in
        base_curve_selection; (2) the class-number range; (3) the bootstrap RNG
        seed (band_rule defers it to "the manifest"); (4) "the declared re-run
        budget" for the fresh-seed tail check of band-exceeding members;
        (5) the fresh tail-check seed list -- replication asserts
        fresh_tail_check_seeds_declared: true rather than listing them;
        (6) the null objects' prime p' and any LOWER bound on N' (only
        N' <= N/64 is given); (7) declared_replay_ops, the length the Q2
        short-walk exception is defined against; (8) the master seed; (9) the Q2
        candidate model set, deferred to "a candidate model set declared in the
        manifest".
        Items 1 and 2 set the completeness gate's failure probability by a
        factor of about 50 (ATK-6) and set the member count, hence the screen's
        multiplicity. Item 3 moves the mandatory-stop threshold: holding a
        16-draw sample fixed and varying ONLY the bootstrap seed over 40 values,
        the 2.5-percentile edge was pinned by discreteness in two of three
        sampled cases and moved 8.41 percent in the third. Item 4 decides how
        much of the fresh-seed tail check happens, and the tail check gates
        every F1 and F4 statement. Item 6 decides whether the 20-bit null
        objects land at m = 2 or m = 1 (ATK-4).
      why_this_is_the_same_class_of_defect: >-
        The contract's own stated principle, in resolution_statistic.
        why_this_is_in_the_contract, is that a designation deciding a stop
        "belongs here, in the frozen contract, and NOT in a handoff, a manifest,
        an implementation note or a Coordinator message". That is the correct
        standard and these nine fail it. The predecessor deferred them too and
        the prior Validator did not list them; what changes is that this
        contract elevates the rule to a principle and then breaks it for
        parameters that decide gates.
      required_change: >-
        Declare items 1, 2, 3, 4, 5 and 6 numerically in the contract, per prime
        size where they differ. Items 7, 8 and 9 may remain manifest-level if
        the contract says so explicitly and states that they gate nothing.

    - id: NEW-03
      severity: material
      title: >-
        The screen's "nominal expected false-flag count" is required but not
        defined, and the only definition the word supports is wrong by about
        3.5x -- which lets F4 fire on noise
      detail: >-
        The screen is "member's median-of-16 versus the base curve's frozen
        bootstrap band". The band carries the BASE curve's sampling variance
        only; the member's own median-of-16 variance is not in it. Simulated
        here under H0 (every member distributed exactly as the base curve),
        20 000 base curves times 4000 pseudo-members each: the TRUE one-sided
        flag rate is 0.0869 against the nominal 0.0250, and the two-sided rate
        is 0.1749 against the nominal 0.0500 -- understated by a factor of 3.48
        and 3.50. And the realized rate is a lottery on one curve's 16 draws:
        the 5th, 25th, 50th, 75th and 95th percentiles of the two-sided rate are
        0.0078, 0.0450, 0.1172, 0.2495 and 0.5438, i.e. 0.16x to 10.9x nominal.
        The prior report's observed 0.61x to 1.73x range across four runs
        understates the instability rather than bounding it.
        Re-reading the predecessor's counts against the correct null: one-sided
        observed 6 / 7 / 14 / 9 against nominal 3.90 / 4.00 / 14.85 / 18.55 but
        against a TRUE null of 13.56 / 13.91 / 51.64 / 64.51. Two of the four
        EXCEED the nominal and none comes close to the true null.
      consequence: >-
        F4 as written fires when the flag count EXCEEDS its nominal false-flag
        expectation. With the expectation understated 3.5x, F4 can fire on pure
        noise -- a false falsification of the hypothesis, in a contract whose
        entire purpose is calibrated gates. This is also the inventor protocol's
        section 3 rule applied to the screen itself: the contract correctly
        promotes the screen's null from a reviewer's afterthought to a required
        artifact, and then leaves the null's computation to the producer.
      required_change: >-
        The false-flag expectation must be MEASURED against a null object of the
        same shape, not taken as the band's nominal tail probability. The
        cheapest correct instrument is already available: re-solve the BASE
        curve under many independent 16-seed blocks and count how often a
        pseudo-member median falls outside the frozen band. Alternatively
        replace the screen with a two-sample comparison (permutation test on the
        member's 16 counts against the base curve's 16) that carries both
        curves' variance. Whichever is chosen, the contract must name it, and
        F4 must be adjudicated against it.

    - id: NEW-04
      severity: material
      title: >-
        The designated resolution statistic is contradicted by the mandatory
        stop it is meant to govern, and the sizing calculation models a third
        statistic
      detail: >-
        resolution_statistic designates "each curve's MEDIAN over the same 16
        declared seeds, and on nothing else". controls[null_object_different_
        order] then evaluates the mandatory stop on "the null objects' pooled
        median-of-16", which is not a per-curve statistic and is undefined --
        the median of all 8 times 16 = 128 raw counts, or the median of the 8
        per-curve medians, and pooled in whose sqrt(N') units, given the eight
        null curves have distinct N'. null_object_sizing then models the same
        quantity as ONE curve's median-of-16 with SD s. Three statistics in
        three places, with SDs of roughly s/sqrt(8), a comparable value, and s.
        The differences are conservative in this instance (measured power 0.9994
        / 0.9994 / 0.9985 / 0.9954 at r = 16 across the four readings), so the
        r = 64 conclusion is unaffected. The defect is that an undesignated
        statistic again decides a MANDATORY STOP.
      required_change: >-
        Designate one statistic in one sentence, and use the same one in
        null_object_sizing, controls[null_object_different_order],
        stopping_rules and success_criterion. State whether pooling is over raw
        counts or over per-curve medians, and whether counts are normalised by
        each curve's own sqrt(N') before pooling.

    - id: NEW-05
      severity: minor
      title: >-
        The contract never states that per-curve medians are taken over SOLVED
        records only, nor that they are therefore conditional on non-censoring
      detail: >-
        With censoring now at about 1.9 percent (ATK-4) and role-dependent, the
        exclusion rule is load-bearing and is only implicit. Related, and
        required by agents/validator.md cost bookkeeping: the reported medians
        are conditional solve costs, not expected costs, so no per-attempt cost
        times inverse success probability inflation is applied. Excluding
        censored solves rather than inflating a cost is the correct handling
        under AGENTS.md rule 5 and the prior report ruled it so; it should be
        written down rather than inferred.
      required_change: >-
        One clause stating that every median is over certificate-verified solved
        records, that censored solves contribute no cost datum, and that the
        reported quantity is a conditional solve cost and not an expected cost.

    - id: NEW-06
      severity: minor
      title: >-
        The positive control's membership certificate omits the condition that
        makes it valid
      detail: >-
        controls[positive_control_tate_invariance] certifies class membership by
        checking that random points have order N and invoking Tate. That step is
        sound only because p + 1 + 2 sqrt(p) < 2N, which is what pins #E' = N
        rather than a multiple. The predecessor's runs satisfied it and the
        prior Validator verified it (REC-09); the successor contract does not
        state it.
      required_change: One clause requiring the condition to be checked and recorded per run.

    - id: NEW-07
      severity: scope_and_budget_not_soundness
      title: >-
        Making the completeness gate able to fail has no contingency in the
        budget or the replication block
      detail: >-
        The genus-obstruction lower bound at h in [40, 160] is about 19 percent
        per run, and the true failure rate is higher (the six primes can also
        fail to generate an odd-order quotient, which this bound does not
        capture). With maximum_runs 4 and a replication block demanding two
        independent instances at EACH prime size, one short closure costs a
        prime size its complete-class replication, and the contract does not say
        what happens then. The tail_checks also now re-run EVERY band-exceeding
        member under fresh seeds rather than only the cheapest; at the true
        flag rate of NEW-03 that is roughly 130 members times 16 seeds in the
        largest predecessor class, which fits the 600 second budget but is
        governed by an undeclared re-run budget (NEW-02 item 4).
      required_change: >-
        State the contingency -- an additional selection attempt under the same
        structural criteria with the short closure retained and reported, or an
        explicit acceptance that a prime size may go unreplicated -- and declare
        the re-run budget.

  # ===================================================================
  # STANDING VALIDATOR SECTIONS
  # ===================================================================
  metric_recomputations:
    - id: RC-01
      quantity: HEUR-ISOU-1 constants (median, mean, negation-map mean, ratio, CV, SE)
      method: closed form from the survival exp(-t^2/(2N)), computed in this session
      result: all six reproduce to 6 decimal places; see ATK-2
      status: pass
    - id: RC-02
      quantity: null_object_sizing power table, all four rows
      method: independent recomputation of E[D], SD[D], z and Phi(z)
      result: reproduces to 4e-5; see ATK-1
      status: pass
    - id: RC-03
      quantity: true sampling distribution of the median-of-16
      method: 2 000 000 simulated replicates
      result: >-
        SD 0.20280 against the asymptotic 0.21233; skew +0.204;
        P(median < mu - 1.96 s) = 0.01272 against the normal 0.02500
      status: observation
    - id: RC-04
      quantity: bootstrap 95 percent band on the median-of-16, as declared
      method: 20 000 base curves times 4000 resamples of 16
      result: >-
        mean edges [0.8139, 1.6086]; coverage of the true median 0.9402; lower
        edge sits 0.0468 above the contract's surrogate B - 1.96 s
      status: observation
    - id: RC-05
      quantity: end-to-end separation power at r = 16, 32, 64, 100
      method: full simulation of the declared procedure, four null-statistic readings
      result: 0.9954 to 1.0000; conclusion N' <= N/64 safe; see ATK-1
      status: pass
    - id: RC-06
      quantity: P(censored) under the declared density law
      method: >-
        exact leading-order integral over the random-functional-graph joint law,
        plus 4 000 000-replicate simulation of the censoring and its bias
      result: >-
        1.934 percent at kappa = 64 against the contract's 1.2 percent, an error
        of pi/2; surviving-median bias +0.733 percent; validated against the
        predecessor's measured member rates
      status: fail
    - id: RC-07
      quantity: m(M) and kappa_eff under the power-of-two rounding
      method: direct evaluation at both prime sizes and r = 16, 32, 64, 100
      result: >-
        20-bit nulls at r = 64 forced to m = 2 (theta = 0.5) or m = 1
        (theta = 1); detection overhead ranges 1.11 to 2.21 percent of sqrt(M)
        against the claimed fixed 1.6 percent
      status: fail
    - id: RC-08
      quantity: reproduction clause acceptance probability by candidate constant
      method: simulation over the 20 000 declared bands, plus the four archived bands
      result: >-
        accepts the negation-map constant with probability 0.5807, and in 2 of
        the 4 actual BATCH-009b1b bands
      status: fail
    - id: RC-09
      quantity: true false-flag rate of the member screen under H0
      method: 20 000 base curves times 4000 pseudo-members
      result: 0.0869 one-sided and 0.1749 two-sided against nominal 0.0250 and 0.0500
      status: fail
    - id: RC-10
      quantity: >-
        genus-theoretic obstruction to {2,3,5,7,11,13} generating cl(O), by
        t and by h
      method: >-
        enumeration of fundamental discriminants in (-40000, 0), own Kronecker
        symbol, genus-character span test, class number by reduced-form counting
      result: >-
        failure rate 34.27 percent at h < 40, 18.84 percent at h in [40,160],
        0.66 percent at h in (160,800]
      status: observation
    - id: RC-11
      quantity: bootstrap-RNG-seed sensitivity of the frozen band, sample held fixed
      method: 40 bootstrap seeds on each of 3 fixed 16-draw samples
      result: lower edge pinned in 2 of 3 samples, moved 8.41 percent in the third
      status: observation

  control_checks:
    - control: null_object_different_order
      assessment: >-
        Correctly retained as MANDATORY with an unconditional stop, correctly
        paired with the sqrt(N'/N) scaling check that is its positive content,
        and the DEC-20260813-e0077d strength limitation is carried forward
        verbatim and unweakened -- it shows the meter tracks group order and NOT
        sensitivity to a within-class difference of the size the census would
        need to detect. Defects: the gate statistic is undefined (NEW-04) and
        the 20-bit control runs in a degenerate detection regime (ATK-4).
    - control: positive_control_tate_invariance
      assessment: sound; missing the order-pinning condition (NEW-06)
    - control: seed_dispersion_band
      assessment: >-
        statistic, interval rule, resample count and freeze ordering now in the
        contract; bootstrap seed still deferred (NEW-02)
    - control: completeness_gate
      assessment: genuinely able to fail; residual selection conditioning undeclared (ATK-6)
    - control: bsgs_cross_check
      assessment: >-
        correctly widened to three declared instances and made unconditional by
        controls_execution_rule; closes VAL-DEF-10
    - control: special_j_segregation
      assessment: >-
        sound and strengthened -- reported even when empty, with j recomputed
        from each vertex's coefficients
    - control: model_normalization
      assessment: >-
        sound; the Q1 common coordinate system and the separate Q2 replay pass
        are the right separation and every solve record carries its
        coordinate_system so it is checkable from raw
    - control: screen_null_object
      assessment: >-
        the right control to add and the wrong null to compute against (NEW-03)
    - control: heuristic_dispersion_check
      assessment: >-
        correctly moved from the reviewer to the run; note that with censoring
        now role-dependent the CV comparison remains mildly contaminated, though
        far less than under the predecessor's 10 percent control censoring
    - control: structural_null_object_same_p_different_trace
      assessment: >-
        correct, with the right reason recorded (Hasse confines the orders to
        relative width O(1/sqrt(p)), so it carries no cost-resolution role)

  heuristic_validation_checks:
    - check: pre-registered prediction recorded before or independently of sampling
      result: >-
        PASS ON ORDERING. The prediction is in a frozen, committed contract at
        facc6f03c with approved_by null and no run in existence; the eps
        provenance is disclosed as data-informed rather than presented as an
        independent a-priori prediction, and no_re_scoring_of_prior_runs
        forbids applying it to the predecessor's four runs. That is the correct
        handling of the one genuine post-hoc hazard in the record. PARTIAL ON
        CONTENT, because the clause the prediction feeds cannot discriminate
        (ATK-2, ATK-3).
    - check: sample size, seeds and sampling procedure in the manifest
      result: >-
        PARTIAL. The 16 rho seeds and the resample count are in the contract;
        the fresh tail-check seeds, master seed, bootstrap seed and p' are not
        (NEW-02).
    - check: empirical CDF and tail statistics recomputable from raw samples
      result: >-
        PASS by construction -- per-member per-seed solve records with
        instrumented counts, censoring status and step count at cutoff are
        required artifacts, and the regeneration check forces summary.json to be
        derivable from archived bytes alone.
    - check: correspondence validity
      result: >-
        NOT APPLICABLE AND CORRECTLY DECLARED SO. scale_relevance.correspondence
        is null and every object is sampled directly -- every member of the
        class is solved, with no substitute sampler standing in for anything. No
        correspondence theorem is owed and none is claimed.
    - check: scale binding and transfer assumptions
      result: >-
        PASS. tier toy; 20 and 24 bits declared; two sizes so findings are not
        single-scale artifacts; P-256 stated as SHAPE not SIZE with no transfer
        asserted. The scale mismatch is recorded as scope, which is the correct
        handling under AGENTS.md rule 7.

  cost_model_checks:
    - check: cost unit declared and never mixed
      result: >-
        PASS. charged_end_to_end_cost is in field multiplications throughout,
        with the explicit prohibition on adding a group-operation count to a
        field-multiplication count, and raw M and S recorded separately so any
        other squaring weight is recomputable.
    - check: measured versus modelled labelled, with the ratio and bias direction
      result: >-
        PASS, and this is the contract's best repair. Both bases mandatory side
        by side, modelled-to-measured ratios required against both the measured
        walk and the entire base solve, and the model's pessimistic direction
        required in words.
    - check: memory reported alongside time
      result: PASS -- peak_memory_bytes for EVERY run, closing COST-05.
    - check: optimistic assumptions flagged
      result: >-
        PASS in the direction that applies. The modelled construction cost is
        PESSIMISTIC and the contract now says so in words. No optimistic
        assumption is present because no cost is projected.
    - check: per-attempt cost times inverse success probability
      result: >-
        NOT APPLICABLE, correctly, and see NEW-05. The census reports measured
        per-member costs, not an expected cost under a probabilistic success
        model. Censored solves are excluded rather than inflating a cost, which
        is right under AGENTS.md rule 5, but the contract should say so.
    - check: wall clock never a cost basis
      result: PASS -- declared transparency-only in metrics.secondary.

  proof_architecture_checks:
    - check: baseline fixture reproduces the cited baseline exactly
      result: >-
        FAIL AS AN INSTRUMENT, PASS AS A RECORD. The constant and statistic are
        now correct (ATK-2), but agents/validator.md holds that a close
        numerical fit is `incomplete` for a baseline fixture, and this fixture
        cannot distinguish the corrected constant from a constant 25 percent
        away with probability 0.58. It must not be presented as a baseline
        reproduction in the proof-architecture sense until its resolution is
        fixed (ATK-3).
    - check: strictness witness for an improvement claim
      result: >-
        NOT APPLICABLE. No improvement is claimed. inventor_accounting records
        dominated_by Pollard rho at exponent 1/2, sota_delta not_applicable on
        every axis, asymptotic_claim null, and states that the four
        asymptotic-claim promotion gates are NOT engaged and must not be
        reported as satisfied. That is correct Pareto honesty.
    - check: observation collisions bound to enumerated scope
      result: >-
        PASS by design -- the class search is exhaustive over a class whose
        completeness is independently checked, the base-curve search is bounded
        by a required rejection log with a selection ratio, and
        Montgomery/Edwards reachability is computed per member rather than
        sampled.
    - check: interface preservation across the representation change
      result: >-
        PASS. The DLP transfer is an isomorphism of prime-order groups, so the
        logarithm is the same integer on every member; determinism, success
        probability and dimension are unchanged and the time and memory cost of
        the transfer is exactly what Q3 charges. Certificate discipline is
        strong -- separate process, no solver imports, different modular
        inversion, different scalar-multiplication schedule.
    - check: method ceiling and nearby-object control
      result: >-
        PASS on structure. The nearby object is the different-order null curve
        set, run under the identical implementation and seed schedule; the
        ceiling is stated as a toy-scale certificate-carrying complete-class
        statement that does not promote to a theorem about P-256. The nearby
        object's DETECTION REGIME is not identical at 20 bits (ATK-4).
    - check: quantifier fidelity
      result: >-
        PASS. The class is fixed FIRST by the base curve and then every member
        is measured, mirroring an attacker handed a curve who cannot choose its
        class; no per-instance witness is presented as a uniform one.

  inventor_protocol_checks:
    - check: >-
        section 3 -- a statistical signal without a null-object control of the
        same shape is not evidence, and the report must state what the measured
        quantity SHOULD do as the parameter meant to destroy it increases
      result: >-
        MOSTLY SATISFIED, WITH ONE GAP. The contract carries three nulls: the
        different-order cost-resolution null, the same-p different-trace
        structural null, and -- new here -- a null for the member-level screen
        itself. It states the decay explicitly: scaling_check_required demands
        the null median be reported against its predicted sqrt(N'/N) scaling,
        "which is the positive content of this control and is what
        distinguishes 'the meter tracks group order' from 'the meter returned a
        number'". That is exactly the canonical artifact tell being addressed
        rather than ignored. THE GAP is that the screen's null is required as an
        artifact but its computation is undesignated, and the natural
        computation is not a null object of the same shape at all -- it is a
        nominal tail probability that omits the member's own variance (NEW-03).
    - check: >-
        section 6 ladder -- an improvement that cannot be executed at the scale
        where it would matter
      result: >-
        NOT ENGAGED, and correctly so. The contract claims no improvement and no
        speedup; its predicted Q1 and Q3 outcomes are exactly zero effect and
        exactly zero improvement, and it declares the promotion gates not
        engaged. Step 1 (isolating each assumption) is served by the separation
        of Q1, Q2 and Q3 and by the named controls; step 2's "measured ratio
        against the baseline on a scaled-down instance of the same shape" is
        literally what Q3 is, with the predicted negative cases (the
        different-order nulls, which should differ; the structural nulls, which
        must not appear in the walk) both checked; step 3 (cheats named and
        classified) has no real-scale partial run to apply to; step 4's
        reproducibility pointer IS exercised, by the required regeneration check
        that rebuilds summary.json from archived bytes and hash-compares it.
        The one gap against step 4 is that only summary.json is rebuilt, and the
        rebuilt package is not the schema-required one (NEW-01).
    - check: section 4 -- Pareto honesty in the deliverable
      result: >-
        PASS. dominated_by is set to a concrete row rather than null, sota_delta
        is not_applicable on all three axes with a stated reason, and the note
        forbids reporting the asymptotic promotion gates as satisfied.

  # ===================================================================
  # WHAT MUST CHANGE BEFORE COMPUTE IS SPENT
  # ===================================================================
  required_before_approval:
    - id: REQ-1
      binds: ATK-4, RC-06
      change: >-
        Correct the censoring derivation. Replace "approximately
        1/(kappa * 1.2533)" with the correct leading order 1.2533/kappa =
        sqrt(pi/2)/kappa, i.e. about 1.9 percent at kappa = 64, not 1.2 percent.
        The general form is P(censored) = E_rho[(1 - e^{-b rho})/(b rho)] with
        b = -ln(1-theta). Leaving 1.2 percent in the contract makes the run's
        required censoring-versus-prediction comparison report a contract error
        as an instrument finding.
    - id: REQ-2
      binds: ATK-4, RC-07
      change: >-
        Resolve the incompatibility between kappa = 64 and N' <= N/64 at 20
        bits. Either (a) drop the power-of-two rounding in favour of
        m(M) = max(m_min, round(sqrt(M)/kappa)) with m_min declared (8 is
        adequate) and kappa_eff recorded per curve; or (b) set the null ratio
        per prime size -- r = 16 at 20 bits, which gives m = 4 and a detection
        overhead of exactly 1.5625 percent of sqrt(N'), matching the members,
        and whose honest separation power is 0.9985 to 0.9995, comfortably above
        the declared "WELL ABOVE 0.99" target; or (c) raise the smaller prime
        size. Declare a LOWER bound on N' as well as the upper bound. Whichever
        is chosen, replace "identical for members and controls at every scale"
        with the actual per-configuration kappa_eff table, and correct the sign
        of the censoring-bias argument in
        stated_approximations_and_why_the_margin_is_there.
    - id: REQ-3
      binds: ATK-2, ATK-3, RC-08
      change: >-
        Give the reproduction clause enough resolution to reject
        sqrt(pi N/4) = 0.886*sqrt(N). Concretely: raise the base curve's seed
        count for the fixture (about 144 seeds gives a plus-or-minus 12 percent
        band, 200 gives about 10 percent, and either is negligible against this
        budget), and/or add a distribution-shape test of the empirical survival
        against exp(-x^2/2) on the pooled null-object sample. Until then the
        clause must not be described as a baseline reproduction, and the claim
        that its discriminating power comes from the constant and the statistic
        must be struck.
    - id: REQ-4
      binds: NEW-03, RC-09
      change: >-
        Define how the screen's false-flag expectation is computed, and compute
        it against a null object of the same shape rather than from the band's
        nominal tail. The base curve re-solved under many independent 16-seed
        blocks is the cheap correct instrument; a two-sample permutation test is
        the cheap correct alternative. Bind F4's "EXCEEDING ITS NOMINAL
        FALSE-FLAG EXPECTATION" to whichever is chosen.
    - id: REQ-5
      binds: NEW-01
      change: >-
        Put the repository run-record schema into required_artifacts -- nested
        run: key with id, experiment_id, status, code (commit, dirty, command),
        environment, inputs, timing, result with a valid certificate.kind, plus
        command.txt, environment.json, stdout.log, stderr.log and
        raw-result.json per run directory -- and make passing
        tools/validate_ledger.py a completion gate before the snapshot archive.
    - id: REQ-6
      binds: NEW-02, NEW-04, ATK-5, ATK-6
      change: >-
        Declare, in the contract: DMAX; the class-number range per prime size;
        the bootstrap RNG seed; the re-run budget; the fresh tail-check seeds;
        p' and the lower bound on N'; the tie-break among accepted base-curve
        candidates. Designate ONE null-object statistic and use it in all four
        places that reference it. Join the Q3 primary designation into a single
        frozen formula string cited by F4. Require the Q3 declared-versus-
        implemented self-check to run in a separate process over archived
        artifacts only, with every symbol resolving to a named field of a named
        archived artifact.

  recommended_not_blocking:
    - >-
      Report the completeness gate's outcome jointly with (|D|, t, h) so the
      residual selection conditioning quantified in ATK-6 is visible per run.
    - >-
      State the contingency when a walk closes short, given maximum_runs 4 and a
      replication block demanding two instances per prime size (NEW-07).
    - >-
      Add the clauses in NEW-05 (medians over solved records only; conditional
      solve cost, not expected cost) and NEW-06 (the order-pinning condition
      p + 1 + 2 sqrt(p) < 2N).
    - >-
      Correct "pooled means sat 4 to 6 percent above the ideal" to 4.0 to 6.5,
      and note that the additive detection overhead is 1.33 percent of the
      MEDIAN where the contract quotes 1.56 percent of sqrt(M).

  limitations:
    - >-
      MODEL INDEPENDENCE IS NOT ACHIEVED (AGENTS.md rule 12). This review ran in
      a separate session under the validator role at xhigh effort and authored
      none of the records it reviews, but the resolved model is the same model
      that served the Coordinator whose arithmetic is under review. Session and
      role independence are real; model independence is not, and is not claimed.
      Mitigation: every number was re-derived or simulated in this session
      rather than read.
    - >-
      All simulations here are of the RANDOM-FUNCTION IDEALIZATION plus the
      declared procedure. A real r = 20 adding walk is not a uniform random
      function, so the power, coverage and false-flag figures are model
      quantities, not predictions about the run. Their USE is comparative --
      they establish the sign and rough size of each approximation error in the
      contract's own model, which is what the contract's model is claiming.
    - >-
      The genus-character computation in ATK-6 is a SUFFICIENT condition for the
      completeness gate to fail, so the rates quoted are lower bounds. The six
      declared degrees can also fail to generate an odd-order quotient of
      cl(O), which this bound does not capture. The direction of the finding is
      unaffected: the failure rate depends on h, and h is filtered.
    - >-
      I did not run, and am forbidden from running, any part of the census. No
      statement here is a measurement of any curve.
    - >-
      The tree advanced by three commits during this review (see
      binding.tree_moved_during_this_review). All findings are stated against
      the contract at facc6f03c, hash-verified.
    - >-
      Toy scale, 20 and 24 bits. Nothing here is evidence about P-256.

  blockers_and_inability_to_adjudicate:
