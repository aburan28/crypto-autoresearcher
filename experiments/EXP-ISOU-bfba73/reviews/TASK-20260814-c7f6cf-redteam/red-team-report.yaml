  # ===================================================================
  # OBJECTIONS, RANKED BY HOW MUCH THEY WOULD CHANGE THE DECISION
  # ===================================================================
  objections:
    - id: RT-OBJ-01
      rank: 1
      severity: blocking_for_q3_as_specified
      title: >-
        Q3's only real lever is sign-locked by the base-curve selection filter,
        so "no member is cheaper" is guaranteed on the one axis where an answer
        was possible, and the nearby object for which it would be FALSE is
        excluded by that same filter
      argument: >-
        The contract predicts, and the hypothesis asserts, that no member is
        cheaper end-to-end. There are exactly two ways a member could be:
        fewer group operations (Q1, forbidden by Tate, and the contract calls
        this leg its own positive control) or a lower field cost per group
        operation (Q2, the a = -3 fourth-power criterion, which the hypothesis
        names as THE ONLY within-class lever). The contract's
        base_curve_selection criteria include "the a = -3 model reachable", and
        the predecessor implemented it harder still: base_curve_selection.yaml
        in every run records the criterion "a is FIXED to -3 mod p, so the base
        curve is literally in the a = -3 model (P-256 shape)". THE BASE CURVE
        THEREFORE SITS AT THE MINIMUM OF A TWO-VALUED DISTRIBUTION BY
        CONSTRUCTION. I verified from the committed summaries that Q2 takes
        exactly two values per run and the base's value is the low one: 14.48
        against 14.86 (20BIT-B) and 14.373 against 14.78 (24BIT-B). No member
        can beat the base per operation. What remains of Q3 is
        (member solve, identical in distribution to the base solve by Tate)
        plus (walk cost) versus (one realization of the base solve) -- that is,
        SEED NOISE VERSUS WALK COST, with no curve-structural content at all.
      why_this_is_not_pedantry: >-
        The contract congratulates itself for curing VAL-DEF-03, a gate that
        could not fail because a condition was applied as a selection filter.
        This is the SAME DEFECT, in the same section, in the criterion the
        contract kept. The cure removed the degree-generation filter and left
        the a = -3 filter, which is the one that decides the headline.
      nearby_object_attack: >-
        agents/red-team.md proof-architecture attack 5 asks for the closest
        object for which the conclusion is false. It is a base curve WITHOUT
        the a = -3 model, whose class contains a = -3 members. For that object
        a member IS cheaper per operation, by the measured 2.56 to 2.75
        percent, and the question "does the walk cost more than that saving?"
        becomes a real, decidable, quantitative question instead of a
        foregone one. THE SELECTION FILTER EXCLUDES EXACTLY THAT OBJECT.
      what_i_am_not_saying: >-
        Requiring a = -3 on the base curve is well motivated: P-256 has
        a = -3, and shape fidelity is the contract's stated purpose. The
        objection is not that the filter is wrong; it is that its CONSEQUENCE
        is not stated. The honest form of the Q2/Q3 result for a P-256-shaped
        base is an algebraic observation, not a census outcome: BECAUSE P-256
        ALREADY SITS AT THE CHEAP END OF THE ONLY WITHIN-CLASS PER-OPERATION
        LEVER, NO MEMBER OF ITS CLASS CAN BE CHEAPER PER OPERATION. That
        deserves to be written down as what it is and does not need 27008 rho
        solves to establish.
    - id: RT-OBJ-02
      rank: 2
      severity: blocking_for_q2_as_reported
      title: >-
        The magnitude of the Q2 headline -- the one leg the program records as
        CONFIRMED -- is a linear function of an undeclared producer-chosen walk
        parameter, and the successor contract's own text implies the value that
        would set it to exactly 1.000
      argument: >-
        The a = -3 saving is a DOUBLING optimization. In Jacobian coordinates
        the curve constant a does not enter the addition formula at all. I
        confirmed this directly in the committed data: q2_add_field_mults_per_op
        is 16.0 for EVERY member of every run and every model, while
        q2_dbl_field_mults_per_op takes exactly the two values 8.0 (a = -3) and
        10.0 (generic). So the entire Q2 spread is
        (doubling fraction) * 2 field multiplications, divided by the mean
        per-operation cost. The measured doubling fraction is 0.1991 (20BIT-B)
        and 0.1993 (24BIT-B), giving predicted ratios of 1.0276 against the
        recorded 1.0262 and 1.0283. THE HEADLINE 1.026-1.030 IS THE DOUBLING
        FRACTION, TO WITHIN A FRACTION OF A PERCENT. Where does 0.199 come
        from? census.py PROTOCOL: "Teske mixed r-adding walk", partition_count
        20, adding_branches 16, DOUBLING_BRANCHES 4. That 16/4 split is a
        producer choice. EXP-ISOU-bfba73 inputs.solver declares "r = 20
        partition adding walk" and NEVER DECLARES THE SPLIT. Read literally, an
        adding walk has zero doubling branches, at which the Q2 ratio is
        exactly 1.000, the mechanism vanishes, and F2's second clause ("the
        spread does not track a = -3 reachability") fires trivially.
      defect_class: >-
        THIS IS VAL-DEF-01 EXACTLY -- an outcome-determining parameter the
        frozen contract leaves to the producer -- sitting uncured in the leg
        the program treats as its only clean positive result. The contract
        designated a resolution statistic because a producer-chosen statistic
        cannot be the pre-registration a stop depends on. A producer-chosen
        doubling fraction cannot be the pre-registration a MECHANISM CLAIM
        depends on either.
      f2_is_partly_unfalsifiable: >-
        Falsification criterion F2's second clause cannot fail on the
        mathematics, only on the implementation. The declared candidate model
        set contains exactly one a-dependent special case, so the spread is
        forced to track a = -3 or to be zero. F2's second clause is an
        implementation self-check presented as a test of the class. Its first
        clause (ratio >= 1.5) is genuinely falsifiable, but reaching 1.5 would
        require a doubling fraction near 1, i.e. a walk that is not a rho walk.
      scale_transfer_consequence: >-
        The contract cites Teske 1998/2001 for the finite-r penalty and not for
        the branch COMPOSITION, which is what sets the answer. I do not assert
        which composition Teske recommends and it is not necessary to: the
        point is that a parameter chosen for walk quality silently sets the
        size of a reported constant-factor mechanism, and nobody has to notice.
      cheapest_fix: >-
        Declare adding_branches and doubling_branches in the contract; require
        Q2 to be reported at the declared mix AND at a pure adding mix
        (doubling fraction 0), which is recomputable at zero cost from the
        already-required raw per-add and per-dbl M/S counts. State in the
        contract that Q2's magnitude is proportional to the doubling fraction.
    - id: RT-OBJ-03
      rank: 3
      severity: material_and_direction_changing
      title: >-
        The third leg's prediction is scale-dependent and inverts
        asymptotically; the census validates it at the only scale where it
        holds, and the same data already contains the number that shows this
      argument: >-
        Q3 asks whether walk cost exceeds solve saving. Solve cost grows as
        O(sqrt(N)) group operations. Walk cost, on the measured-evaluation
        basis, is (path length) * (per-isogeny evaluation cost); path length in
        a Cayley graph on cl(O) with a fixed 6-prime generating set grows like
        O(log h) = O(log p), and each small-degree Velu evaluation is O(1)
        field operations. So walk/solve is O(log p / sqrt(p)) AND GOES TO ZERO.
        Even the modelled CONSTRUCTION cost is polylog in p and also vanishes
        against sqrt(p). At 20 and 24 bits I measure walk/solve = 0.0558 and
        0.0597 -- comparable to the 0.0256 and 0.0275 per-operation saving,
        which is precisely why the toy answer comes out "no". At P-256 the same
        ratio is astronomically small and the answer is "yes" on every basis.
        THE PREDICTION IS TRUE AT TOY SCALE AND FALSE AT SCALE, AND THE
        EXPERIMENT IS RUN ONLY AT TOY SCALE.
      the_number_nobody_computed: >-
        From the committed data, the break-even instance count -- how many DLP
        instances on one curve make walking to a cheaper member profitable --
        is (walk/solve) / (Q2 saving) = 0.0558/0.0256 = 2.18 at 20 bits and
        0.0597/0.0275 = 2.17 at 24 bits. TWO INDEPENDENT PRIME SIZES AGREE TO
        HALF A PERCENT. On the modelled-construction basis the same quantity is
        roughly 51/0.0275 = 1850 instances. That factor of ~850 between the two
        bases is the entire measured-versus-modelled dispute, expressed as a
        decision-relevant number, and neither the contract, EV-ISOU-7c6405, nor
        VAL-20260814-e183e6 states it.
      quantifier_order_attack: >-
        The hypothesis's proof_search_map fixes the quantifier as an attacker
        handed one instance who cannot choose the class. That is stated, so it
        is not a hidden assumption -- but it is the quantifier under which the
        answer is least interesting and most fragile, and the contract never
        says it declines the amortized regime. Under any multi-instance or
        precomputation regime the walk is amortized and the constant is real.
      required_contract_change: >-
        The contract must either (a) add prime sizes and report
        walk_cost/solve_cost as a FUNCTION of p against its predicted
        O(log p / sqrt(p)) decay -- see required_controls RT-CTL-02 -- or (b)
        state in scale_relevance that the Q3 prediction's truth value is a
        function of walk/solve and is expected to invert with p, so that a toy
        "no" is never read as a shape-level "no". Silence here is the scope
        problem, not the toy scale itself.
    - id: RT-OBJ-04
      rank: 4
      severity: material
      title: >-
        Every Q1 and Q3 comparison is anchored on the base curve's single
        median-of-16 -- the noisiest available estimate of a quantity the run
        estimates 34 times more precisely from its own data -- and that single
        nuisance draw, not the class, explains the predecessor's headline swing
      argument: >-
        Under Tate every member and the base curve draw from the same solve-cost
        distribution. The run therefore has two estimates of the common center:
        the base curve's median of 16 draws, and the class median of member
        medians over 160 or 742 members (11872 draws at 24 bits). The contract
        anchors on the FIRST. From the committed summaries:
        20BIT-B base_q1_median 1367.5 against class median 1285.75 (base is
        6.4 percent HIGH), 75 of 160 members fall below base;
        24BIT-B base_q1_median 4014.0 against class median 5064.0 (base is 20.7
        percent LOW), 37 of 742 fall below. THE 47-PERCENT-VERSUS-5-PERCENT
        SWING BETWEEN THE TWO ADMISSIBLE RUNS IS FULLY EXPLAINED BY WHERE THE
        BASE CURVE'S SIXTEEN SEEDS LANDED. EV-ISOU-7c6405 reports both counts
        as observations of the same measurement.
      consequence_for_the_band: >-
        The same single draw centers the frozen bootstrap band. At 24BIT-B the
        band's center is 20.7 percent below the class center, so members are
        systematically displaced upward relative to their own screen. That, not
        an uncalibrated tail, is the first-order explanation of the "64 of 742
        against nominal 37.1" figure EV-ISOU-7c6405 flags as 1.73x. A band that
        is not centered on the population it screens is not a 95 percent
        screen in either tail.
      what_the_successor_does_about_it: >-
        Nothing. resolution_statistic.band_rule keeps the band as the bootstrap
        interval of THE BASE CURVE's median-of-16 and keeps every comparison
        anchored there. The cure addressed WHICH STATISTIC (median, correctly)
        and not WHOSE DRAW.
      cheapest_fix: >-
        Solve the base curve under 64 or 128 seeds instead of 16. The base is
        ONE curve; at 24 bits 112 extra solves is under 1 percent of the run's
        compute and halves to quarters the anchor's standard error. Optionally
        also report every comparison against the leave-one-out class median as
        a declared secondary anchor. Both are nearly free and both are absent.
    - id: RT-OBJ-05
      rank: 5
      severity: material
      title: >-
        The contract mandates the WRONG null for its own member screen, and I
        computed the right one from committed data at zero compute cost
      argument: >-
        controls[screen_null_object] requires "the NOMINAL EXPECTED FALSE-FLAG
        COUNT for each screen ... alongside the observed count". The nominal
        count assumes the band is a calibrated 95 percent interval. The
        Validator already established it is not (realized coverage 0.61x to
        1.73x). Requiring the nominal expectation therefore mandates a
        comparison against a null that is known to be wrong, and the contract's
        additional requirement to report "the realized coverage of the band"
        derives that coverage FROM THE MEMBERS THEMSELVES, i.e. uses the
        objects under test as their own null. That is circular.
      the_correct_null_and_what_it_says: >-
        The right null is a PERMUTATION null that preserves the seed structure
        and destroys member identity: shuffle member labels independently
        within each seed column, recompute member medians, re-apply the frozen
        band, repeat. Under the null of no between-member effect this is exact,
        and it inherits the band's real mis-calibration automatically. I RAN IT
        IN THIS SESSION on the committed solve_records.jsonl of the two
        admissible runs, restricted to members with all 16 seeds solved, 400
        permutations, RNG seed 90210:
        24BIT-B, 705 complete members, band [3176.5, 6371.0]: observed 60
        outside, NOMINAL 35.2, PERMUTATION NULL mean 53.7 with 95 percent
        interval [43, 66]. Observed 60 is comfortably inside the permutation
        null. Below-band (the F4/F1 direction): observed 7, permutation null
        mean 6.7, interval [3, 12].
        20BIT-B, 116 complete members, band [948.0, 1783.5]: observed 4
        outside, nominal 5.8, permutation null mean 6.1, interval [2, 11];
        below-band observed 4 against null mean 4.7, interval [2, 9].
      what_this_changes: >-
        (1) The nominal null the contract mandates is off by 53.7/35.2 = 1.53x
        at 24 bits, in the direction that manufactures alarm. (2) The apparent
        1.73x excess in EV-ISOU-7c6405's OBS-Q1-NULL caveat is entirely a
        band-calibration and centering artifact and carries no member
        information. (3) The one-sided below-band counts sit exactly on their
        permutation null in both runs, which is a STRONGER and cleaner support
        for the Q1 null than anything currently in the record -- so this
        objection cuts in the program's favour on the substance while
        condemning the screen it mandated.
      accounting_note: >-
        My complete-16 restriction (116 of 160, 705 of 742) is why my observed
        counts differ from the Validator's 7 and 64, which are over all members
        with at least one solve. Both are correct on their own subset; the
        difference is censoring, not a disagreement, and see RT-OBJ-09.
    - id: RT-OBJ-06
      rank: 6
      severity: material
      title: >-
        Every quantity that decides the Q3 headline is MODELLED and every
        quantity that is measured is negligible; the contract responds with a
        reporting rule where a measurement was available
      argument: >-
        The implementation actually constructs each Velu isogeny -- it must, to
        walk the class -- and instruments the EVALUATION but models the
        CONSTRUCTION. The modelled term is 51x to 120x the entire measured base
        solve and 222x to 1421x the measured walk. So the census measures a
        quantity worth ~6 percent of a solve and models a quantity worth ~5000
        percent of one, and the headline is decided by the modelled one. The
        contract's cure designates the measured basis PRIMARY, requires both
        side by side, requires the modelled/measured ratios, and requires the
        pessimism to be stated in words. All of that is right and none of it is
        a measurement. THE CURE FOR A MEASUREMENT DEFECT IS A MEASUREMENT.
      why_measuring_it_is_cheap: >-
        Construction is performed in-process by the same code that performs the
        instrumented evaluation. Routing the kernel-polynomial and codomain
        arithmetic through the already-existing instrumented field type yields
        a MEASURED construction cost in the same unit, eliminating the basis
        dispute entirely rather than adjudicating it. The contract instead
        entrenches a permanent measured/modelled split.
      on_which_basis_is_honest: >-
        The task asks me to decide the sign. My answer is that the question is
        posed at the wrong level. UNDER THE CONTRACT'S OWN SINGLE-INSTANCE
        QUANTIFIER, THE MODELLED BASIS IS THE REALISTIC ONE: an attacker who
        wants a class member must build the isogeny before evaluating anything
        at it, so charging evaluation alone hands the attacker the isogeny for
        free, and designating the measured basis PRIMARY understates the
        attacker's cost. Under any amortized quantifier the construction is
        paid once and the measured basis is the realistic one. The contract
        designates the measured basis primary on the ground that it is what the
        predecessor's TEXT said -- a textual-fidelity argument for a
        cost-model question. That is the wrong warrant even where it reaches
        the right answer, and here it reaches the wrong one for the quantifier
        the hypothesis itself declares. Neither basis is defensible while the
        larger term is modelled with an admittedly naive quadratic model whose
        true value is 2 to 3 orders of magnitude uncertain.
      pareto_note: >-
        Per KN-LIT-7593, an eliminated dimension is not a speedup until the
        invariant's own cost is in the total. The contract does charge the
        walk, which is correct and to its credit. My objection is the mirror
        image: the charged cost is 98 percent modelled, so the charge is an
        assumption wearing a cost's clothes.
    - id: RT-OBJ-07
      rank: 7
      severity: material
      title: >-
        The new distinguished-point density law is undefined at the low end and
        has no floor, so the control curves it was written to protect can be
        driven out of the distinguished-point regime entirely
      argument: >-
        The rule is m(M) = the power of two nearest sqrt(M)/kappa with
        kappa = 64, and theta = 1/m. Members: sqrt(N) = 1025 at 20 bits gives
        m = 16 (theta = 0.0625); sqrt(N) = 4095 at 24 bits gives m = 64. Null
        objects at the DESIGNATED N' <= N/64: sqrt(N') <= 128, so
        sqrt(N')/64 = 2.0 and m = 2, i.e. THETA = 0.5 -- half of all points
        distinguished, which is not a distinguished-point regime. And N' <=
        N/64 is only an UPPER bound: the contract sets no lower bound on N' and
        no floor on m, so an N' at or below N/256 gives m = 1, theta = 1, every
        point distinguished, the censoring formula's ln(1/(1-theta))
        divergent, and the method degenerate. THE CONTRACT'S OWN DERIVATION
        CANNOT BE EVALUATED AT THE PARAMETERS THE CONTRACT DESIGNATES.
      required_fix: >-
        Bound N' on BOTH sides (for example N/128 <= N' <= N/64) and floor
        m (for example m >= 16), then recompute the separation power at the
        bounded range rather than at the single point r = 64.
      flagged_for_validator: >-
        The arithmetic here overlaps the Validator's assignment on the density
        law. I record the structural hole -- no lower bound, no floor -- which
        is a specification question, and defer the numbers.
    - id: RT-OBJ-08
      rank: 8
      severity: minor_but_the_disclosure_is_inverted
      title: >-
        The contract's claim that the new density law equalizes censoring, and
        its stated direction of the residual bias, are both wrong for the
        20-bit case under the contract's own formula
      argument: >-
        The contract asserts the censoring rate is "approximately
        1/(kappa*1.2533) -- INDEPENDENT OF M ... about 1.2 percent for every
        curve measured, members and controls alike". That identity uses
        ln(1/(1-theta)) approximately equal to theta, which fails badly at the
        large theta the null objects now get. Evaluating the contract's OWN
        formula 1/(ln(1/(1-theta))*1.2533*sqrt(M)) at its own designated
        parameters: 20-bit member (theta = 1/16, sqrt(M) = 1025) gives 1.21
        percent; 20-bit null (theta = 1/2, sqrt(M) = 128) gives 0.90 percent;
        24-bit member (theta = 1/64) gives 1.24 percent; 24-bit null
        (theta = 1/8) gives 1.17 percent. So at 20 bits the control is censored
        26 percent LESS than the members, not equally. Since censoring removes
        short-cycle walks and biases a surviving median UPWARD, a control
        censored LESS than its members is biased DOWNWARD relative to them --
        that is, TOWARD separation. The contract's
        stated_approximations_and_why_the_margin_is_there says the opposite:
        "for the control, that is a bias AGAINST separation, so it eats margin
        rather than manufacturing it." UNDER THE NEW RULE THAT SENTENCE IS
        INVERTED IN SIGN at 20 bits. The magnitude is small; the disclosure is
        still backwards, and it is a disclosure the contract offers as a reason
        to trust its safety margin.
      flagged_for_validator: >-
        Numbers above are mine and should be confirmed by the Validator, whose
        assignment includes this law. The SIGN of the disclosed bias is the
        red-team point and stands independently of the third decimal place.
    - id: RT-OBJ-09
      rank: 9
      severity: material
      title: >-
        The designated statistic is "median over the declared seeds" but its
        denominator under censoring is undefined, and at 20 bits more than a
        quarter of members do not have sixteen seeds
      argument: >-
        resolution_statistic designates the MEDIAN OVER THE DECLARED SEEDS and
        null_object_sizing computes everything at n = 16 exactly
        (s = 1/(2*f(mu)*sqrt(16))). Censoring makes n ragged. From the
        committed records, members with all 16 seeds solved: 116 of 160 in
        20BIT-B and 705 of 742 in 24BIT-B -- so 27.5 percent of 20-bit members
        carry a median of FEWER than 16 draws, with a correspondingly wider
        sampling error, and, because censoring removes short-cycle walks, an
        upward bias that is larger for exactly those members. The contract's
        cure names the statistic and never says what n is when a seed is
        censored, or whether a censored seed is replaced. THAT IS THE SAME
        UNDERSPECIFICATION VAL-DEF-01 WAS, ONE LEVEL DOWN, IN THE FIELD THE
        CURE WAS WRITTEN FOR.
      required_fix: >-
        Declare the rule in the contract: either replacement seeds drawn from a
        declared reserve until 16 solved per curve, or a stated minimum n with
        members below it excluded and reported, with the chosen rule applied
        identically to members, base curve and null objects.
    - id: RT-OBJ-10
      rank: 10
      severity: minor
      title: >-
        special_j_segregation is non-falsifiable by construction under the
        contract's own selection criteria, and is presented as a live control
      argument: >-
        A member has j = 0 or j = 1728 only if its endomorphism ring has
        discriminant -3 or -4. The selection filter requires D fundamental with
        h(D) in [40, 160] or [40, 800], and h(-3) = h(-4) = 1, so D is neither
        and NO MEMBER OF ANY ADMISSIBLE CLASS CAN HAVE j = 0 OR j = 1728. The
        Validator confirmed the segregated set is empty in all four runs; it is
        empty as an algebraic consequence, not as an observation. The same
        argument makes the twist-merging concern in class_enumeration vacuous:
        with no j = 0 or 1728, within a fixed-order class j determines the
        F_p-isomorphism class.
      why_it_matters_anyway: >-
        Two consequences worth stating rather than dropping. First, this is
        another control that cannot fail, in a contract whose flagship cure was
        making a gate able to fail -- it should be recorded as a derived
        algebraic fact, not a control. Second, it STRENGTHENS the hypothesis's
        "only lever" claim, which the hypothesis currently defends by a narrower
        argument (no rational 2-torsion, which excludes Montgomery, Edwards,
        Jacobi-quartic and Huff but says nothing about automorphisms). Aut = {+-1}
        for every member of every admissible class, so the automorphism lever is
        genuinely absent -- for a reason the record does not give.
    - id: RT-OBJ-11
      rank: 11
      severity: material_and_unchecked_anywhere
      title: >-
        Matched seeds plus an identical adding-branch scalar schedule make
        member solve counts dependent across curves, and the band treats them
        as independent
      argument: >-
        census.py records that the seed-dependent precomputation is "an
        identical scalar schedule on every curve of the same order N". Every
        curve therefore uses the SAME twenty increments in the exponent group,
        differing only in the step function (branch index = x mod 20). The
        whole band construction assumes member medians are independent draws
        around a common center whose dispersion is estimated from the base
        curve's own 16 draws. I tested it: the seed-to-seed dispersion of the
        cross-member median (which should be pinned to 0.0574 relative at 20BIT-B
        and 0.0265 at 24BIT-B if members were conditionally independent) is
        0.0626 and 0.0295 -- an excess of 9 and 11 percent, IN THE SAME
        DIRECTION IN BOTH RUNS. Suggestive rather than decisive, and nobody has
        looked, in a design where the dependence is structurally expected.
      second_finding_same_computation: >-
        The observed dispersion of member medians relative to the class median
        is 0.153 (20BIT-B) and 0.168 (24BIT-B) against the 0.1803 the
        null_object_sizing model assumes. Both are BELOW the assumption, so the
        power table is conservative on that axis -- credit where due, and the
        Validator should confirm it. But the contract used the predecessor's
        measurements to set eps and did NOT use them to check s, which is
        inconsistent: using pilot data to size a prospective control is not
        re-scoring prior runs, and the contract already does it once.
      cheapest_fix: >-
        Derive the branch-table scalars from (seed, curve) rather than seed
        alone, and require a two-way variance decomposition of the
        members-by-seeds matrix (member effect, seed effect, residual) as a
        reported artifact. The decomposition costs zero compute on data the run
        already produces.
    - id: RT-OBJ-12
      rank: 12
      severity: procedural_but_it_is_the_answer_to_the_escalation_question
      title: >-
        What is being checked only against itself here is the COST MODEL, and
        the repository already has the record type that would have caught it
      argument: >-
        The task asks what is being checked only against itself, given that the
        prior batch's defect escaped because everyone checked the runs against
        the contract rather than against the repository's own run-record schema.
        Answer: EXP-ISOU-bfba73 is checked, field by field, against
        VAL-20260814-e183e6's defect list -- a list of what went wrong LAST
        time. Its defects_cured block maps twelve defect ids to field names and
        nothing verifies that a named field actually discharges the defect it
        claims (VAL-DEF-05_and_COST-03 is the clearest failure of that: see
        RT-OBJ-06). Meanwhile templates/research-records.md defines a
        cost_model record (COST-AREA-NNN) with exactly the fields whose absence
        caused this batch: cost_unit, bound_kind,
        optimistic_assumptions, overestimating_factors, parameter_sets,
        time_memory_tradeoff. THIS EXPERIMENT'S ENTIRE THIRD LEG IS A COST
        MODEL WITH A MEASURED/MODELLED SPLIT AND A DECLARED PESSIMISTIC BIAS,
        AND IT CARRIES NO cost_model RECORD -- the model lives inside
        metrics.primary[charged_end_to_end_cost] as prose. That is why a
        modelled term 51x to 120x the entire measured solve went un-audited for
        a whole batch: nothing in the repository was pointed at it.
      other_self_checks_that_check_nothing_external: >-
        (a) The q3_definition self-check recomputes both formulas from their
        own declared strings and fails on disagreement -- it catches divergence
        (VAL-DEF-04) and cannot catch a mis-specified declared string, which is
        VAL-DEF-02's failure mode. (b) The regeneration check re-runs the
        summarizer over archived bytes -- it proves replayability, not
        correctness. (c) The screen's realized coverage is derived from the
        members under test (RT-OBJ-05). (d) The random-function idealization
        now carries the fixture, the power table AND the censoring law, so a
        deviation in the model moves all three together and no one of them can
        expose it.
      required_fix: >-
        Author a cost_model record for the Q3 leg from
        templates/research-records.md before approval, and require the
        defects_cured mapping to state, per defect, the OBSERVABLE that would
        show the cure failed.
    - id: RT-OBJ-13
      rank: 13
      severity: scope
      title: >-
        The census as specified cannot discharge obstruction 4 even if every
        run succeeds, because the leg it would discharge is a theorem and the
        empirical residue is a property of the walk implementation
      argument: >-
        Obstruction 4 is "within-class uniformity". Its group-operation leg
        follows from Tate plus the fact that rho's step-count distribution
        depends only on the group order and the walk's randomness -- the
        contract itself calls Q1 "the instrument's positive control", which is
        an admission that Q1 is not in question. Its per-operation leg is a
        deterministic per-member arithmetic predicate (is a/(-3) a fourth power)
        composed with a fixed operation-count table: NO DLP SOLVE IS REQUIRED
        TO EVALUATE IT FOR ANY MEMBER. What the 27008 solves genuinely buy is
        the one thing neither theorem nor table covers: a SEARCH for a member
        whose particular walk behaves anomalously, because the step function is
        x-coordinate dependent and x-coordinates are curve-specific. That is a
        legitimate and interesting search. It is not what the contract says it
        is doing, and it demands an extreme-value / multiplicity analysis
        (RT-CTL-01) rather than a per-member 95 percent band applied h times
        with no multiplicity control.
      what_would_actually_move_obstruction_4: >-
        State the group-operation leg as PROVEN (Tate plus order-only
        dependence), the per-operation leg as COMPUTED over the complete class
        (no solves), and reserve the empirical claim for the walk-anomaly
        search, reported against a permutation null. That is a stronger and
        more honest discharge than a null at a band's resolution, and it is
        cheaper.
      not_a_closure_recommendation: >-
        I am explicitly NOT saying the lane is dead or that obstruction 4
        should be closed by argument. Premature closure is symmetric with
        overclaiming. I am saying the experiment should be redesigned around
        the part that is actually empirical.
    - id: RT-OBJ-14
      rank: 14
      severity: minor
      title: >-
        dominated_by is honest but the frontier was not enumerated, and one row
        of it beats the solver on the control curves
      argument: >-
        inventor_accounting.dominated_by reads "Pollard rho at exponent 1/2"
        with sota_delta not_applicable, and since no speedup is claimed this is
        not a fabricated null. But the contract nowhere enumerates the frontier
        rows across time, memory and data. At the designated null-object sizes
        (N' near 16400 at 20 bits) BSGS costs about 2*sqrt(N') = 256 operations
        against rho's ~150 with a distinguished-point table -- the two are
        within a small factor and BSGS wins outright on some of the census's
        own instances, while van Oorschot-Wiener parallel rho occupies a
        different row again (time sqrt(N)/w against memory w). The contract
        runs BSGS as a correctness cross-check on three instances and never as
        a cost row. Nothing is invalidated by this; the record simply should
        not be read as having checked every row.
      credit_where_due: >-
        The successor cures COST-05 by requiring peak memory on EVERY run
        rather than one of four, which is the memory axis taken seriously.
    - id: RT-OBJ-15
      rank: 15
      severity: procedural
      title: The artifacts are uncommitted
      argument: See snapshot_binding. Recorded once, not repeated per objection.

  # ===================================================================
  # REQUIRED CONTROLS
  # ===================================================================
  required_controls:
    - id: RT-CTL-01
      name: PERMUTATION NULL FOR THE MEMBER SCREEN
      status: THE CHEAPEST DECISIVE CONTROL THAT IS MISSING
      cost: zero additional solves; it runs on data the census already produces
      specification: >-
        Within each seed column of the members-by-seeds count matrix, shuffle
        member labels independently; recompute each pseudo-member's median;
        re-apply the frozen band; count flags. Repeat at least 1000 times with
        a declared RNG seed frozen in the manifest. Report the permutation null
        mean and 95 percent interval BESIDE the observed count, for the
        two-sided outside-band count and the one-sided below-band count
        separately, and adjudicate F1 and F4 against the PERMUTATION null
        rather than against the nominal binomial expectation. Ragged rows from
        censoring are handled by permuting within available cells and reporting
        the per-member n.
      why_it_is_decisive: >-
        It is the only construction that gives the screen's REALIZED false-flag
        distribution while preserving the seed structure and destroying member
        identity -- that is, a null object of exactly the same shape as the
        thing measured, which is what docs/inventor-protocol.md section 3
        requires and what the different-order curves demonstrably are not. It
        subsumes the contract's nominal expectation, its realized-coverage
        requirement, and its multiplicity problem in one computation.
      demonstrated: >-
        Run in this session on the committed records of the two admissible
        predecessor runs; results in RT-OBJ-05. It works, it is cheap, and it
        changes the reading of the strongest number currently in the evidence
        record.
    - id: RT-CTL-02
      name: THE DECAY CONTROL -- walk/solve against the parameter that must destroy it
      cost: about 11 minutes of additional compute inside the declared 2 CPU-hour budget
      specification: >-
        Add prime sizes (28 and 32 bits alongside 20 and 24) and report
        walk_cost/solve_cost, on BOTH bases, as a function of p against its
        predicted O(log p / sqrt(p)) decay. Declare in advance that the ratio
        MUST fall by roughly a factor of 2 per 2 bits of p.
      why_it_is_required: >-
        This is the "ask what the reported quantity should have done" test
        applied to the leg whose answer inverts with scale. If walk/solve does
        NOT decay as p grows, the walk instrumentation is measuring something
        that is not the walk, and every Q3 number is an artifact. If it does
        decay, the contract has measured the one thing about Q3 that transfers
        in shape -- the direction of the trend -- instead of a single-scale
        sign that is known to flip.
    - id: RT-CTL-03
      name: NEARBY-OBJECT ARM -- a base curve WITHOUT the a = -3 model
      cost: one additional run per prime size, same budget
      specification: >-
        A second arm whose base curve is selected on all the same structural
        criteria EXCEPT that a/(-3) is required NOT to be a fourth power, with
        its class containing at least one a = -3 member. Report Q3 on both
        bases and the break-even instance count.
      why_it_is_required: >-
        It is the closest object for which the hypothesis's conclusion is
        false, and the current filter excludes it (RT-OBJ-01). Without it the
        "no member is cheaper" finding cannot distinguish a property of isogeny
        classes from a property of the selection filter. With it, the census
        answers a real question at the same cost.
    - id: RT-CTL-04
      name: DEEPER ANCHOR -- 64 or 128 seeds on the base curve
      cost: under 1 percent of run compute at 24 bits
      specification: >-
        Solve the base curve under 64 (preferably 128) declared seeds and build
        the frozen band from those, while members keep 16. Report the anchor's
        deviation from the class median of member medians in every run.
      why_it_is_required: >-
        Every Q1 and Q3 comparison is anchored on this one estimate and the
        predecessor's headline swung from 47 percent to 5 percent on its luck
        (RT-OBJ-04). This is the highest ratio of decision impact to compute in
        the whole redesign.
    - id: RT-CTL-05
      name: Q2 AT A DECLARED AND AT A ZERO DOUBLING FRACTION
      cost: zero; recomputable from the already-required raw per-add and per-dbl M/S counts
      specification: >-
        Declare adding_branches and doubling_branches in inputs.solver. Report
        Q2 at the declared mix and at doubling fraction 0, and state in the
        contract that the Q2 ratio is proportional to the doubling fraction.
      why_it_is_required: RT-OBJ-02.
    - id: RT-CTL-06
      name: MEASURED VELU CONSTRUCTION COST
      cost: implementation only; no additional solves
      specification: >-
        Route the kernel-polynomial and codomain arithmetic through the same
        instrumented field type already used for evaluation, and report a
        MEASURED construction cost. Retain the modelled figure as a declared
        cross-check with its ratio to the measured one.
      why_it_is_required: >-
        It dissolves the basis dispute that currently determines the sign of
        the headline (RT-OBJ-06), instead of adjudicating it by textual
        fidelity to a superseded contract.
    - id: RT-CTL-07
      name: TWO-WAY VARIANCE DECOMPOSITION of the members-by-seeds matrix
      cost: zero
      specification: >-
        Report member effect, seed main effect and residual, with the seed
        effect compared against its no-dependence expectation. Required in the
        run, not left to a reviewer.
      why_it_is_required: RT-OBJ-11; the band's independence assumption is currently untested.

  counterexample_or_mutation: >-
    THE SINGLE CHEAPEST MUTATION THAT WOULD EXPOSE THE MOST: run the census
    unchanged but with doubling_branches set to 0 (the pure adding walk the
    successor contract's own text describes) and with the base curve selected
    WITHOUT the a = -3 requirement. Predicted outcome under my reading: Q2
    collapses to exactly 1.000 with no partition at all, F2's second clause
    fires trivially, and the "confirmed constant-factor mechanism" that
    EV-ISOU-7c6405 records as the strongest item in the whole batch disappears
    -- not because the mathematics changed but because a producer-chosen walk
    parameter did. If instead Q2 retains a two-valued partition under a pure
    adding walk, my RT-OBJ-02 is wrong and the mechanism is more robust than I
    claim, which is equally worth knowing. Either way the mutation costs one
    run and settles the status of the program's only positive result in this
    lane.

  # ===================================================================
  # BASELINE COMPARISON
  # ===================================================================
  baseline_comparison:
    pollard_rho: >-
      The census's own solver, and the correct dominating baseline at exponent
      1/2. Nothing here challenges it and nothing claims to. The relevant
      subtlety is that the census's solver is a MIXED walk with 20 percent
      doubling branches, which is not the plain-rho ideal its fixture is
      derived from and is the source of the entire Q2 effect (RT-OBJ-02). The
      contract's own reproduction fixture and its eps = 0.05 allowance are
      calibrated to that walk, so the baseline embedded as the boundary is the
      implementation's walk and not the ideal.
    bsgs: >-
      Run as a correctness cross-check on three instances per run, correctly,
      and never as a cost row. At the designated null-object order
      (N' <= N/64, so N' near 16400 at 20 bits) BSGS at about 2*sqrt(N') = 256
      operations is competitive with or better than rho at about 150 to 180
      with the distinguished-point tail. This does not invalidate the control
      -- the control's job is to track group order, which it does -- but the
      record should not describe rho as the dominating method uniformly across
      the objects the census actually solves.
    closest_specialized_baseline: >-
      The isogeny-transfer literature the contract cites (Galbraith 2024, ePrint
      2024/924, for the cheap-bridge cost) plus the standard position that DLP
      hardness is preserved across an F_p-isogeny class up to the cost of
      computing the isogeny. Against that baseline the census's Q1 leg is a
      reproduction of a known consequence of Tate rather than a new
      measurement, and its Q3 leg is a toy-scale instance of a comparison whose
      asymptotic answer is already determined by walk/solve going to zero
      (RT-OBJ-03). The genuinely new quantity the census could produce, and
      does not, is the BREAK-EVEN INSTANCE COUNT: 2.18 and 2.17 on the measured
      basis at 20 and 24 bits, roughly 1850 on the modelled basis.
    dominated_by_field_audit: >-
      dominated_by "Pollard rho at exponent 1/2" is NOT a fabricated null -- no
      speedup is claimed and sota_delta is not_applicable on every axis, which
      is the honest entry for a constant-factor measurement. But it was not
      arrived at by enumerating the frontier across time, memory and
      data/queries as docs/inventor-protocol.md requires; there is no frontier
      table anywhere in the contract. The memory axis is now taken seriously
      (peak memory required on every run, curing COST-05); the time-memory
      interpolation (van Oorschot-Wiener parallel rho) appears nowhere, which
      is defensible for a single-worker toy census but should be stated as a
      declared omission rather than left absent.

  # ===================================================================
  # HEURISTIC CHALLENGES
  # ===================================================================
  heuristic_challenges:
    - id: RT-HEU-01
      heuristic: HEUR-ISOU-1
      challenge: >-
        NUMBERED, EXPLICIT, DERIVED IN THE RECORD, AND PAIRED WITH A
        FALSIFICATION CONDITION THAT THE RUN IS NOW REQUIRED TO COMPUTE. On the
        agents/red-team.md heuristic-inventory test this is a pass, and the
        supersession that derived the constant rather than asserting it is the
        correct response to VAL-DEF-02. I do not object to it for being
        conditional.
      residual: >-
        The random-function idealization is now LOAD-BEARING IN THREE PLACES --
        the reproduction fixture, the null-object power table, and the
        censoring-rate derivation -- and only the first carries a correction
        (eps = 0.05, disclosed as informed by the measurements). A single
        deviation in the model therefore moves all three together, and the two
        uncorrected uses are the ones that size a MANDATORY STOP. The contract
        should apply the same pilot-informed correction to the power table's mu
        and s that it applies to the fixture, and report the power under both
        the ideal law and the measured law.
    - id: RT-HEU-02
      test: random-model transfer to the structured object at hand
      challenge: >-
        The justification is honestly scoped -- it is an assumption about the
        WALK, not about the curve, and the contract says so. But the walk is
        not a uniform random function on the group for a REASON THAT IS
        CURVE-STRUCTURAL and that the record does not name: the step function
        is "branch index = affine x-coordinate mod 20", so the walk's mixing
        depends on the distribution of x-coordinates of the subgroup on THAT
        member, and that is the only channel by which a member could differ
        from its class-mates at all. The census's entire empirical content
        lives in that channel and the record never says so.
      cheapest_experiment_to_expose_a_deviation: >-
        Compute, per member, the chi-squared statistic of the observed branch
        occupancy (x mod 20 over the walk) against uniform, and correlate it
        with that member's median. Zero additional solves -- the branch indices
        are already visited. If a member's median deviation tracks its branch
        non-uniformity, the deviation is a walk artifact and is diagnosable;
        if the deviations are uncorrelated with branch occupancy, that is
        genuine evidence FOR uniformity and is much stronger than a band null.
        This is the closest thing to a mechanism-level control the census can
        run and it is free.
    - id: RT-HEU-03
      test: scale honesty
      challenge: >-
        Tested parameters, claim tier and the absence of any transfer
        assumption are stated correctly and repeatedly; no correspondence
        trick is claimed where none is used. The gap is different and is not a
        disclosure gap but a structural one: h(D) grows like sqrt(p), so a
        COMPLETE-class census is possible only at toy scale, and every
        "minimum over the class" quantity is an extreme order statistic over h
        draws. h is 156 to 742 here and would be about 2^128 at P-256. Any
        statement of the form "no member is cheaper" is therefore about a
        different-sized object at every scale, and the contract's two prime
        sizes differ in h by a factor of 4.6 without an h-normalization.
        F4's comparison of flag count against expectation scales correctly;
        the raw below-base count and the min-ratio statistic do not.
    - id: RT-HEU-04
      test: cost bookkeeping, per-attempt times inverse success probability
      challenge: >-
        Correctly not applicable, as the Validator found: this is a measured
        cost per member, not an expected cost under a success model, and
        censored solves are excluded rather than inflating a cost. I confirm
        that reading and add one caveat: exclusion is the right handling for
        AGENTS.md rule 5, but it is NOT neutral for the STATISTIC, because
        censoring is selective on short cycles (RT-OBJ-09). The contract should
        say that exclusion is correct for the cost claim and biased for the
        median, and handle the latter by replacement seeds.

  # ===================================================================
  # COST-MODEL CHALLENGES
  # ===================================================================
  cost_model_challenges:
    - id: RT-COST-01
      challenge: >-
        THE MEASURED/MODELLED SPLIT IS INVERTED WITH RESPECT TO IMPORTANCE and
        the cure is a reporting rule. See RT-OBJ-06 and RT-CTL-06. This is the
        objection that decides the sign of the headline and it is the one I was
        asked to settle: on the contract's own single-instance quantifier the
        MODELLED basis is the realistic one, so designating the measured basis
        primary understates the attacker's cost; on any amortized quantifier
        the measured basis is realistic. Designating either by textual fidelity
        to the predecessor's wording is the wrong warrant, and measuring the
        construction removes the need to choose.
    - id: RT-COST-02
      challenge: >-
        THE BREAK-EVEN INSTANCE COUNT IS THE MISSING QUANTITY. 2.18 at 20 bits
        and 2.17 at 24 bits on the measured basis, roughly 1850 on the modelled
        basis, computed in this session from the committed summaries
        (walk/solve 0.0558 and 0.0597; Q2 saving 0.0256 and 0.0275). The
        agreement across two prime sizes to half a percent is the most stable
        number the census has produced and it appears in no record. It should
        be a required reported quantity on both bases.
    - id: RT-COST-03
      challenge: >-
        UNIT DISCIPLINE IS GOOD AND THE CONTRACT DESERVES CREDIT: everything in
        field multiplications, no group-operation count ever added to a
        field-multiplication count, raw M and S retained separately so any
        squaring weight is recomputable. One consequence is unstated: at the
        declared MS_WEIGHT of 1.0 the measured per-doubling costs are 8.0
        (a = -3) and 10.0 (generic), so the reported Q2 gap depends on that
        weight, and the contract fixes 1.0 without justification. Since raw M
        and S are retained, reporting Q2 at a second declared weight (0.8 is
        the usual figure for a 64-bit implementation) costs nothing and would
        show whether the mechanism is a property of curve arithmetic or of one
        weighting convention. I did not compute the answer and do not assert
        which way it goes.
    - id: RT-COST-04
      challenge: >-
        MEMORY. Requiring peak memory on every run cures COST-05. But the
        census's memory profile is itself parameter-dependent in a way the
        contract now makes worse: the distinguished-point table size scales as
        theta * walk length, and the new density law drives the null objects to
        theta = 0.5 (RT-OBJ-07), so the controls store a constant fraction of
        every point visited. Trivial at these sizes and worth a sentence,
        because the same law at a smaller N' is degenerate.
    - id: RT-COST-05
      challenge: >-
        REVIEWER COST IS THE BINDING COST, NOT COMPUTE, AND THE CONTRACT
        BUDGETS ONLY THE LATTER. The predecessor's four runs cost 313 seconds of
        CPU. This batch has since consumed an xhigh Validator pass over 47
        artifacts and 27008 solve records, a Coordinator disposition, an
        evidence record, and now an xhigh red-team pass -- for a constant of
        1.03 that moves no exponent. The budget block (2 CPU-hours, 4 runs)
        prices the cheap resource and not the scarce one. Any honest
        recommendation about "is the rerun worth it" has to be made in that
        currency, and mine is below.

  # ===================================================================
  # REDUCTION AND SCOPE CHALLENGES
  # ===================================================================
  reduction_and_scope_challenges:
    - id: RT-SCOPE-01
      challenge: >-
        NO SCOPE INFLATION FOUND, AND I LOOKED HARD. claim_tier toy on every
        record; "P-256 is the SHAPE imitated, not the object measured" repeated
        in the contract, the hypothesis, the decision and the evidence record;
        no affected-scheme list; asymptotic_claim null with the four promotion
        gates explicitly declared NOT engaged; obstruction 4 explicitly not
        discharged; SG-ECDLP-002 explicitly not reopened. The
        what_this_decision_does_not_do block in DEC-20260813-61e8a3 is a model
        of the genre. On the scope axis this record set is cleaner than most
        published work.
    - id: RT-SCOPE-02
      challenge: >-
        THE ONE PLACE SCOPE IS UNDERSTATED RATHER THAN OVERSTATED. The
        completeness finding must be scoped to a base-curve population filtered
        by |D| <= DMAX and h in [40, 160] or [40, 800] -- the Validator says
        this and the successor keeps both filters. Those are budget-feasibility
        bounds, and h in [40, 800] against the h ~ sqrt(p) that an unconstrained
        24-bit curve would give (up to a few thousand) means the accepted base
        curve has an unusually SMALL class for its discriminant range. Whether
        that correlates with anything -- class group structure, 2-rank,
        generation by small primes -- is untested and unstated. It is a
        conditioning on the object, disclosed as a budget bound.
    - id: RT-SCOPE-03
      challenge: >-
        NO CITED REDUCTION IS INSTANTIATED HERE. reduction_chain is empty,
        corollaries are empty, and nothing is derived by citing a published
        reduction, so the reduction-instantiation test has nothing to bite on.
        Tate 1966 is used correctly and its hypotheses (F_p-isogeny, equal
        point count) are exactly the ones satisfied. Velu 1971 and Kohel 1996
        are used for construction and structure, not to transfer a bound.

  # ===================================================================
  # PROOF-ARCHITECTURE CHALLENGES
  # ===================================================================
  proof_architecture_challenges:
    - id: RT-PA-01
      attack: observation-fiber
      result: >-
        The observable is (group operations, field multiplications per group
        operation) indexed by member, and the predicted fiber is the whole
        class on the first coordinate. I can place two preimages on opposite
        sides of the conclusion by varying the object OUTSIDE the declared
        selection filter: a base curve without a = -3 and a class containing an
        a = -3 member sits on the "some member is cheaper" side under any
        amortized quantifier, while the declared filter places every admissible
        instance on the "no member is cheaper" side. THE MISSING SEPARATOR IS
        THE BASE CURVE'S OWN a = -3 REACHABILITY, which the filter fixes to
        true. See RT-OBJ-01 and RT-CTL-03.
    - id: RT-PA-02
      attack: quantifier-order
      result: >-
        Stated correctly and honoured: the class is fixed FIRST by the base
        curve, mirroring an attacker who cannot choose it, and the Validator
        confirmed the artifacts match. My objection is not that a witness is
        chosen after the instance; it is that the SINGLE-INSTANCE quantifier is
        adopted without stating that the amortized quantifier gives the
        opposite answer with a break-even of about 2 instances at toy scale and
        essentially 1 at any real scale (RT-COST-02).
    - id: RT-PA-03
      attack: boundary and strictness
      result: >-
        The old method is embedded as the reproduction fixture, and the cure
        correctly replaces the negation-map constant with the plain-rho median.
        But the boundary the run will actually reproduce is not plain rho: it
        is a mixed walk with 20 percent doubling branches plus
        distinguished-point overhead, absorbed into a one-sided eps = 0.05
        allowance whose value was chosen with knowledge of the measurements.
        The contract discloses that provenance, which is the correct conduct
        and removes the pre-registration objection -- but it means the
        reproduction check's discriminating power against an implementation
        fault is limited to detecting a factor-sqrt(2)-scale error, not a
        few-percent one. The contract says this ("the discriminating power
        comes from the CONSTANT and the STATISTIC, not from eps") and it is
        right to.
    - id: RT-PA-04
      attack: method ceiling
      result: >-
        The strongest claim this resource measure can support under ideal
        tuning is: over a complete toy class, no member's median-of-16
        group-operation count departs from the class median by more than the
        resolution floor, and the per-operation spread is bounded by the
        measured ratio. The resolution floor is about 15 to 18 percent relative
        (I measured the member-median dispersion at 0.153 and 0.168), so an
        effect of the size the a = -3 lever actually produces -- 2.6 to 2.8
        percent -- IS BELOW THE INSTRUMENT'S OWN Q1 RESOLUTION BY A FACTOR OF
        SIX. The ceiling does not reach the effect size the hypothesis's own
        mechanism predicts. That is not fatal, because Q2 is measured by
        instrumented operation counts rather than by solve dispersion and does
        not need Q1's resolution -- but it does mean the census cannot detect a
        within-class effect of the only size it has any reason to expect, and
        the null_object control famously does not establish sensitivity at that
        size either. THE CONTRACT SHOULD STATE THE RATIO OF ITS RESOLUTION
        FLOOR TO ITS OWN PREDICTED EFFECT SIZE. It is about 6:1 against.
    - id: RT-PA-05
      attack: nearby object
      result: See RT-OBJ-01, RT-CTL-03. This is the strongest single finding in this report.
    - id: RT-PA-06
      attack: compositional invariant
      result: >-
        Deleting the a = -3 selection criterion from the base-curve filter is
        the mutation that breaks the conclusion first (RT-OBJ-01). Deleting the
        doubling branches from the walk breaks the Q2 mechanism (RT-OBJ-02).
        Deleting the walk-cost charge breaks Q3 in the other direction, and the
        contract correctly does not do that.

  # ===================================================================
  # THE TWO QUESTIONS THE TASK PUT DIRECTLY
  # ===================================================================
  is_this_worth_rerunning:
    strongest_case_against_stated_without_softening: >-
      This is measurement theatre on a closed question. Q1 measures a quantity
      Tate's theorem fixes and the contract itself calls a positive control;
      the census's own dominated_by names Pollard rho at exponent 1/2 in its
      own record. Q2's answer -- 1.03 -- is a constant factor that moves no
      exponent, is computable in closed form from IEEE P1363 operation counts
      and a fourth-power test with NO DLP SOLVES AT ALL, and I have shown its
      magnitude is set by an undeclared producer choice of doubling branches
      rather than by the curves. Q3's answer is sign-locked by the base-curve
      selection filter on the only axis where a lever exists, and what remains
      is a comparison of seed noise against a walk cost whose dominant term is
      modelled rather than measured; its headline swung from 47 percent to 5
      percent between the two admissible runs on nothing but where the base
      curve's sixteen seeds landed. Two admissible runs already confirmed the
      Q2 mechanism and already produced the Q1 null. The whole census could be
      replaced by Tate's theorem, an enumeration computing a fourth-power
      predicate per member, an operation-count table, and one measurement of
      isogeny cost -- none of which requires solving a single discrete
      logarithm.
    does_it_survive: >-
      IT SURVIVES AS A CRITIQUE OF THE DESIGN AND FAILS AS A REASON TO STOP,
      AND THE DISTINCTION IS THE WHOLE ANSWER. Four things defeat the closure
      reading. (1) Obstruction 4 of EV-ECDLP-b3e847 is recorded as EMPIRICAL,
      NOT PROVEN, and a recorded closure of SG-ECDLP-002 leans on it; declining
      to measure it because it "must" hold is exactly the premature closure
      docs/inventor-protocol.md names as symmetric with overclaiming, and the
      program's own red team asked for this measurement. (2) The "it is a
      theorem" argument is not airtight where it matters: Tate fixes N, but rho
      on a member is a walk whose step function is that member's x-coordinate
      mod 20, and NOTHING FIXES THE MIXING OF THAT WALK ACROSS MEMBERS. The
      genuinely empirical residue is a search for a member whose walk is
      anomalous, and that residue is real, is unmeasured elsewhere, and is
      exactly what 27008 solves can find. (3) The compute is negligible -- 313
      seconds for the predecessor's four runs -- so the cost of being wrong
      about stopping is far larger than the cost of running. (4) Stopping here
      would leave the record with a "confirmed mechanism" (Q2 at 1.03) that I
      have just shown to be a function of an undeclared parameter; the rerun is
      the cheapest way to find out whether that finding is real.
    verdict_on_compute: >-
      SPEND IT -- BUT NOT ON THIS CONTRACT AS WRITTEN. Approving
      EXP-ISOU-bfba73 unchanged buys a cleaner band, a corrected constant and a
      designated basis, and returns another REVISE-shaped review cycle, because
      the four things that actually determine its headlines (the a = -3
      selection lock, the doubling-branch fraction, the base-curve anchor, and
      the modelled construction term) are untouched by the twelve cures. The
      changes I ask for are cheap: RT-CTL-01, RT-CTL-05 and RT-CTL-07 cost ZERO
      additional solves; RT-CTL-04 costs under 1 percent of run compute;
      RT-CTL-02 costs about eleven minutes inside the declared budget; RT-CTL-03
      costs one extra run per prime size; RT-CTL-06 is implementation work with
      no solve cost. THE FULL REDESIGN FITS INSIDE THE BUDGET ALREADY DECLARED.
    what_a_rerun_returning_the_same_null_would_buy: >-
      Priced honestly against RUN-ISOU-2ac81f-20BIT-B and
      RUN-ISOU-2ac81f-24BIT-B, an unchanged rerun returning the same null buys
      four things and no more: (a) a band whose statistic was designated by the
      contract rather than the producer, which converts two HELD runs' worth of
      authority problem into a clean one -- real, and procedural rather than
      scientific; (b) a fixture that matches the mandated solver, so the
      success_criterion's two clauses can be satisfied simultaneously, which
      under the predecessor was impossible under any reading; (c) replication
      at fixed scale (two instances per prime size), which moves evidence
      strength from `preliminary` toward `replicated`; (d) a completeness gate
      that could have failed. It does NOT buy a new fact about isogeny classes.
      Against the reviewer cost this batch has already absorbed, (a) through (d)
      alone are a thin return; with RT-CTL-01 through RT-CTL-07 the same compute
      additionally buys a calibrated screen, a measured construction cost, a
      decay control on the one quantity that must decay, a break-even number,
      and an answer to whether the Q2 mechanism exists at all outside a chosen
      walk parameter. That is a good trade and the unchanged version is not.

  # ===================================================================
  # NARROWEST SUPPORTED STATEMENT
  # ===================================================================
  narrowest_supported_statement: >-
    EXP-ISOU-bfba73 is a genuine improvement on EXP-ISOU-2ac81f and it is not
    yet a contract that should be approved. It closes the two blocking defects
    it was written to close -- the resolution statistic is designated in the
    contract and the reproduction fixture now matches the mandated solver --
    and it closes most of the material ones honestly, including the
    admissibility-assertion ban, the unconditional control execution, the
    execution-retention rule and the regeneration check. Its remaining problems
    are not defects of repair but defects of DIAGNOSIS: the twelve cures
    address what the Validator found by checking runs against a contract, and
    the things that actually determine this census's headline numbers were
    never in that frame. Specifically, on the tested toy scale and this
    implementation only: the Q3 conclusion is sign-locked by a selection
    criterion, the Q2 magnitude is proportional to an undeclared walk
    parameter, every comparison is anchored on the noisiest available estimate,
    and the mandated screen null is off by about 1.5x where a free exact null
    is available. NOTHING IN THIS REPORT IS EVIDENCE ABOUT P-256, ABOUT ANY
    ASYMPTOTIC, OR ABOUT THE SECURITY OF ANYTHING. Nothing here weakens
    H-ISOU-5748b6, which enters unsupported and must earn support from runs
    that do not yet exist; nothing here discharges or moves obstruction 4 of
    EV-ECDLP-b3e847, which remains empirical and not proven; and nothing here
    is a finding that this lane is dead. A bounded set of design objections
    against an unapproved contract is not an impossibility result and must not
    be cited as one.

  # ===================================================================
  # WHAT I COULD NOT ASSESS
  # ===================================================================
  could_not_assess:
    - >-
      NO COMMITTED SNAPSHOT OF THE OBJECT UNDER REVIEW EXISTS. I bound the four
      records by content hash instead. If any byte changes before the ledger
      archive, this report does not apply to the changed record.
    - >-
      THE ARITHMETIC OF null_object_sizing, THE DP-DENSITY LAW AND THE
      REPRODUCTION TOLERANCE. Deliberately not duplicated: a Validator is
      assigned to them. Where my objections touch that territory (RT-OBJ-07,
      RT-OBJ-08, and the s = 0.1803 comparison in RT-OBJ-11) I flagged them for
      Validator confirmation and rested my argument on the structural point
      rather than the digits.
    - >-
      WHETHER AN IMPLEMENTATION WOULD HONOUR THIS CONTRACT. None exists;
      EXP-ISOU-bfba73 has a specification.yaml and nothing else. Several cures
      -- the declared-versus-implemented formula self-check, the regeneration
      check, the unconditional control execution -- are only as good as code
      that has not been written, and the predecessor's VAL-DEF-04 is precisely
      a case of a declared rule and an implemented rule diverging.
    - >-
      THE VELU WALK-PATH STRUCTURE. Carried from the Validator's recorded gap:
      class membership of every vertex is independently certified via order N
      and Tate, but which particular isogeny connects which pair rests on
      self-checks inside census.py -- and that structure is exactly what the Q3
      walk cost is charged along, so my walk/solve and break-even figures
      inherit that gap.
    - >-
      WHETHER THE ~10 PERCENT EXCESS SEED DISPERSION IN RT-OBJ-11 IS A REAL
      SHARED-SEED EFFECT. Two runs, same direction, suggestive, not decisive.
      RT-CTL-07 is what would settle it and it is free.
    - >-
      THE DIRECTION OF THE TESKE LITERATURE ON MIXED VERSUS PURE ADDING WALKS.
      I did not resolve which composition is preferred and RT-OBJ-02 does not
      depend on it: the objection is that the composition is undeclared and
      sets the answer, not that a particular composition is wrong.
    - >-
      THE 16-BIT SHAKEDOWN AND THE DISCARDED FIRST EXECUTION OF
      RUN-ISOU-2ac81f-20BIT-A. Not in the record; the same gap the Validator
      recorded, and I add nothing to it.
    - >-
      MODEL INDEPENDENCE. Not achieved under this harness. Session and role
      independence are real; the resolved model is the one that served every
      other agent in this chain, and no part of this report may be cited as
      independently model-verified.

  # ===================================================================
  # NEXT CONCRETE ACTION
  # ===================================================================
  next_concrete_action: >-
    ONE ACTION, AND IT IS FREE. Before any approval decision and before any
    census compute, run RT-CTL-01 -- the seed-column permutation null -- on the
    ALREADY-COMMITTED solve_records.jsonl of RUN-ISOU-2ac81f-20BIT-B and
    RUN-ISOU-2ac81f-24BIT-B at snapshot commit 15de2d901, as a scoped
    Coordinator or Validator task writing to its own task directory. It costs
    zero solves, it is the null object of the same shape that
    docs/inventor-protocol.md section 3 requires and that the different-order
    curves are not, and it settles three things at once: whether the 64-of-742
    band excess in EV-ISOU-7c6405's OBS-Q1-NULL caveat is a member effect or a
    calibration artifact (my computation says artifact: observed 60 against a
    permutation null of 53.7 with interval [43, 66], on the 705 complete
    members); whether the below-band counts that F4 adjudicates sit on their
    own null (they do: 7 against 6.7, and 4 against 4.7); and whether the
    successor contract's mandated NOMINAL false-flag expectation should be
    replaced by the permutation null before the contract is frozen (it should
    -- the nominal figure is low by about 1.5x at 24 bits). If that task
    confirms the computation, amend controls[screen_null_object] to require the
    permutation null, fold in RT-CTL-03 through RT-CTL-07, and only then take
    the approval decision. If it contradicts the computation, this report's
    RT-OBJ-05 is wrong and should be recorded as such by a superseding review
    rather than by an edit to this record.

