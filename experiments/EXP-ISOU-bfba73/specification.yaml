    supersession_basis: >-
      VAL-20260814-e183e6 (TASK-20260813-e183e6), verdict REVISE, and the
      Coordinator disposition DEC-20260813-61e8a3. The predecessor's four runs
      remain valid artifacts of the contract they ran under; EV-ISOU-7c6405
