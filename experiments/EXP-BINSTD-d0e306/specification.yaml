# EXP-BINSTD-d0e306
# Split-threshold arithmetic. No polynomial is sampled.
# Approved by DEC-20261003-913c25.
experiment:
  id: EXP-BINSTD-d0e306
  hypothesis_id: H-BINSTD-d5008f
  source_idea: IDEA-20261001-dd7405
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Split threshold versus three fourths of the sample
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-913c25
  objective: >-
    Check the excess 140, the cross gap 56, and the product 420.
  inputs:
    n_sum: 119
    n_product: 6678671
    gap_sum: 14
    gap_product: 96
    span: 14
    samples: 200
    floor_den: 20
    expected: 10
    cells: 5
    cell_hits: 50
    candidates: 1000
    beta_count: 150
    beta_excess: 140
    hundredths_gap: 3
    excess_product: 420
    cross_beta_floor: 56
    cross_floor_gap: 30
    stage_lo: 2
    stage_hi: 3
    stage_product: 6
    hour_cap: 6
  controls:
    - >-
      Two hundred divided by 20 is 10. Three fourths of 200 is 150.
      Reporting 150 as 10 invalidates the run.
    - >-
      One hundred fifty minus 10 is 140. Five minus 2 is 3. The
      product of 140 and 3 is 420. Three times 20 minus 4 is 56.
    - >-
      The n sum is 119 and the n product is 6678671. The gap product
      is 96 and the span is 14. Five times 200 is 1000. Two times 3
      is 6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {threshold, excess, product}
    - route in {difference, product}
  metrics:
    primary:
      - beta_excess
      - excess_product
      - implementations_agree
    secondary:
      - cross_beta_floor
      - n_product
      - stage_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      One hundred fifty exceeds 10 by 140. Three times 20 exceeds 4
      by 56. The product of 140 and 3 is 420.
    formula: >-
      Divide 200 by 20. Take three fourths of 200. Subtract 10 from
      150. Multiply 140 and 3. Compare 3 times 20 with 4.
    source: >-
      IDEA-20261001-dd7405 states the n list, the floor 0.05, the
      sample count 200, the gap 0.02, the bound 3 over 4, and the
      hour cap 6, read 2026-10-03. The products were recomputed in
      this design session. That computation is not a run. No
      polynomial was sampled.
  scale_relevance:
    tier: toy
    justification: Five listed n values and one written floor. No transfer to a split rate.
    correspondence: null
  tail_checks:
    - The product 420 and the cross gap 56 are required. A check that stops at the excess 140 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 140 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The excess is not 140.
    - The cross gap is not 56.
    - The product is not 420.
    - A polynomial is sampled, or 150 is reported as 10.
  success_criterion: >-
    Both runs agree that 200 divided by 20 is 10, that three fourths
    of 200 is 150, that 150 minus 10 is 140, that 3 times 20 minus 4
    is 56, and that the product of 140 and 3 is 420.
  falsification_criterion: >-
    The runs agree that 150 minus 10 is computed, and that difference
    is not 140.
  required_artifacts:
    - experiments/EXP-BINSTD-d0e306/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-d0e306/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-d0e306/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-d0e306/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-d0e306/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-d0e306/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any polynomial sample, root count, or split-frequency measurement.
    - Any claim that a quasi-subfield family splits completely.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
