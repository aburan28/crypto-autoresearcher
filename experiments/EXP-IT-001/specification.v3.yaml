experiment:
  id: EXP-IT-001
  hypothesis_id: H-IT-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  source_proposal: IDEA-20260731-008
  mandatory_null_control_proposal: IDEA-20260731-011
  exit_map_consistency_proposal: IDEA-20260727-005
  version: 3
  supersedes_version: 2
  protocol_amendment_id: PA-IT-001-v3-rc27-b5-b8
  title: >-
    Isogeny-transfer cost gate — charged ordinary path to special families vs
    matched rho at toy prime-field ECDLP, with HEUR-ISO-1 sampling and
    planted-path positive control (RC-27 decidable freeze; retains B-1)
  status: review_required
  approved_by: null
  approved_by_note: >-
    THE NULL IS BY DESIGN (D-1 prophylaxis). Immutable historical blobs:
    specification.yaml (v1) at 303ae797; specification.v2.yaml at 285e533e.
    This v3 file is the sole executable contract if a later
    APPROVAL_DETERMINATION records APPROVED after TASK-20260731-123 PASS.
    Approval is recorded in the approval receipt, never by editing
    approved_by here.
  frozen: true
  frozen_on: '2026-07-31'
  frozen_by_task: TASK-20260731-121
  archived_by_task: TASK-20260731-122
  parent_freeze_task: TASK-20260731-108
  parent_freeze_commit: 285e533e432078239c2047e0b2ca1cb2872b1f60
  parent_v1_freeze_commit: 303ae797d70dbad7435e018af1da4b15f9007de5
  discharges_review: RT-20260731-109
  retains_discharged:
    - B-1
  discharges_blocking:
    - B-5
    - B-6
    - B-7
    - B-8
  claim_tier: toy
  confirmatory_status: exploratory
  confirmatory_status_note: >-
    First measurement of the charged isogeny-transfer gate. Confirmatory only
    about the named toy cells after independent review and a completed valid
    run set; never crypto-scale and never an asymptotic support path alone.

  objective: >-
    Measure whether ordinary isogeny paths from random prime-field curves to
    named special families can beat matched Pollard rho after full charging of
    C_path + C_special + C_pullback. Report HEUR-ISO-1 toy validation status
    (KS / tail) against the pre-registered random-regular hitting-time CDF
    F_hit defined below. Require planted-path positive-control recovery. Apply
    the frozen IDEA-20260731-011 isogeny-transfer null object to any claimed
    sub-rho win. Matched BSGS is recorded. A toy non-finding is not crypto-scale
    safety.

  claim_ceiling: >-
    Toy-tier charged transfer ratios, planted-path harness status, HEUR-ISO-1
    toy distribution status, and certificate-backed solves on 20/24/28-bit
    prime-order subgroups. NOT CLAIMABLE UNDER ANY OUTCOME: crypto-scale ECDLP
    exponent improvement on generic curves; asymptotic support for HEUR-ISO-1;
    GOAL-ECDLP-001 completion; H-DS-001 support; reopening or altering
    H-STR-002 / H-IC-001; lane death of SG-ECDLP-001. All four asymptotic-claim
    promotion gates remain OPEN.

  what_this_experiment_is_NOT:
    - Not a cryptanalytic attack on any deployed curve or live key.
    - Not STR / phi_alpha / displacement-rank instrument polish.
    - Not a reopen of H-DS-001 / H-IC-001 / H-STR-002.
    - Not H-ISO-001 (rejected_scoped short-neighbor d_reg/yield) redux.
    - Not sufficient alone to move any asymptotic claim to `supported`.

  heuristic_under_test: HEUR-ISO-1
  preregistered_prediction:
    quantity: >-
      Minimal 2-isogeny hop distance H_min from random ordinary E to the named
      special set, and the charged ratio
      R_xfer = (C_path + C_special + C_pullback) / matched_rho
    formula: >-
      Under HEUR-ISO-1, H_min on random ordinary curves behaves like the
      first-hit distance to a sparse independent set of density rho_special
      in a random d-regular graph (d frozen below). Predicted CDF is the
      explicit F_hit(h; rho_special, d) algorithm in heur_iso_1_decision_rule.
      Separately, the gate claim predicts R_xfer >= 1.0 on >=90% of unplanted
      curves; falsification if >=2 unplanted curves have R_xfer < 0.7 with
      certificates.
    source: >-
      IDEA-20260731-008 (HEUR-ISO-1; min_charged_transfer_ratio); Delfs–Galbraith
      ordinary volcanoes; classical random-regular hitting-time heuristics;
      IDEA-20260731-011 null gate; IDEA-20260727-005 exit-map consistency;
      PA-IT-001-v2-rc25b-b1-b4 (B-1 retained) and PA-IT-001-v3-rc27-b5-b8 for B-5–B-8.

  # B-1 discharge: pre-registered F_hit, d, min_ell abscissa (RT-20260731-105)
  heur_iso_1_decision_rule:
    graph_regularity_d: 3
    graph_regularity_note: >-
      Frozen d=3 models the ordinary 2-isogeny graph (each non-floor vertex has
      three degree-2 neighbors). HEUR-ISO-1 KS/TAIL use this single frozen d;
      odd-prime isogenies are allowed in the cost-gate search arm but are NOT
      the HEUR abscissa.
    min_ell_random_variable:
      id: H_min
      definition: >-
        H_min = minimal number of 2-isogeny hops from the starting curve E to
        any j-invariant that satisfies at least one frozen special-family
        detector, under BFS on the ordinary 2-isogeny graph, capped at
        hops_max. Abscissa for F_hit / KS / TAIL is hops (integer), NOT the
        composite isogeny degree product and NOT odd-prime degree.
      composite_degree_side_record: >-
        deg_composite = 2**H_min for the HEUR arm path (recorded alongside
        H_min). Cost-gate search may also report deg_composite_full for mixed
        prime paths; that quantity is NOT used in KS-ISO-1 / TAIL-ISO-1.
      hops_max_formula: >-
        hops_max(N) = floor(log2(N) / 2). Equivalent to deg_composite <=
        floor(N**(0.5)) for pure 2-isogeny paths.
    F_hit:
      id: F_hit
      type: deterministic_algorithm
      parameters:
        - rho_special
        - d
      algorithm_pseudocode: >-
        Input: hop h (integer >= 0), density rho in (0,1], regularity d=3.
        ball_size(h,d):
          if h <= 0: return 1
          if d == 2: return 1 + 2*h
          # |vertices in closed ball of radius h on infinite d-regular tree|
          return 1 + d * ( ((d-1)**h - 1) // (d-2) )
        survival(h, rho, d) = (1 - rho) ** ball_size(h, d)
        F_hit(h; rho, d) = 1.0 - survival(h, rho, d)
        For h < 0: F_hit = 0.0. Clamp rho into (0,1]; if rho > 1 treat as 1.
      closed_form_note: >-
        This is the frozen independent-marking tree approximation: each vertex
        is special i.i.d. with probability rho; first-hit CDF is one minus the
        probability that the entire radius-h ball is non-special. Executor and
        Validator MUST recompute with this exact integer ball_size formula —
        no alternate CDF may be substituted after freeze.
      reference_implementation_obligation: >-
        experiments/EXP-IT-001/results/HEUR_ISO_1_report.json must embed the
        evaluated F_hit table for h=0..hops_max at the frozen rho_special(bits)
        before any path-search samples are drawn.
    sampled_quantity: >-
      Per unplanted curve: H_min under hops_max (or censored at hops_max if
      none); R_xfer if a cost-gate path is found and special solver + pullback
      certificate succeeds; otherwise R_xfer recorded as the honest censorship
      lower bound (C_path at exhausted budget + 0 + 0) / matched_rho.
    density_freeze: >-
      Before any path search, compute rho_special(bits) for bits in {20,24,28}
      under special_family_detectors and density_universe below; write the
      values and universe hashes into HEUR_ISO_1_report.json. Sampling must not
      redefine density.
    ks_rule:
      id: KS-ISO-1
      quantity: >-
        Empirical CDF of observed uncensored H_min vs F_hit(·; rho_special(bits),
        d=3); censored observations reported separately and not forced into a
        pass.
      threshold: >-
        ks_stat > max(0.05, 1.63 / sqrt(n)) with n = number of uncensored
        H_min samples and n >= 20 fails KS-ISO-1 at that bit size.
    rate_band:
      id: RATE-ISO-1
      pass: >-
        Fraction of unplanted curves with R_xfer >= 1.0 is >= 0.90 among
        curves with completed accounting (including honest censorship lower
        bounds that already imply R_xfer >= 1.0).
      fail: >-
        Fraction with completed R_xfer < 1.0 exceeds 0.10, or >=2 unplanted
        curves have R_xfer < 0.7 with certificates (F1).
      heur_confirmation_note: >-
        RATE pass under heavy censorship is a gate-hold, not HEUR-ISO-1
        confirmation (RT-20260731-105 I-2).
    tail_rule:
      id: TAIL-ISO-1
      pass: >-
        Let h_ext be the smallest observed uncensored H_min and
        p_ext = F_hit(h_ext; rho_special, d) - F_hit(h_ext - 1; rho_special, d)
        with F_hit(-1)=0. Pass iff p_ext * n >= 1 (n = uncensored count).
        Fail (outlier) iff p_ext * n < 1.
    F3_trigger: >-
      HEUR-ISO-1 toy FAIL if every completed bit size with adequate uncensored
      samples fails KS-ISO-1 or TAIL-ISO-1. Missing samples are infrastructure,
      never fabricated into pass/fail.
    HEUR_ISO_1_report_schema_required_fields:
      - rho_special_by_bits
      - density_universe_spec_hash
      - density_universe_cardinality_by_bits
      - d
      - hops_max_by_bits
      - F_hit_table_by_bits
      - ks_stat_by_bits
      - ks_pass_by_bits
      - tail_pass_by_bits
      - rate_iso_1_pass
      - censored_fraction_by_bits
      - frozen_before_path_search: true

  scale_relevance:
    tier: toy
    justification: >-
      Direct sampling and path search at 20–28 bit subgroups only. Crypto-size
      HEUR-ISO-1 validation would need class-number sampling correspondences
      and is out of this contract.
    correspondence: null

  tail_checks:
    - id: TAIL-ISO-1
      check: Quantitative rule in heur_iso_1_decision_rule.tail_rule.
    - id: COST-SENSITIVITY-10X
      check: >-
        Recompute R_xfer under ±10x multiplier on the isogeny-evaluation
        component C_eval only; report whether any decisive R_xfer < 0.7 flips
        to >= 1.0 or vice versa.

  inputs:
    curve_sampler: >-
      Random ordinary prime-field curves with prime-order subgroups at bits in
      {20,24,28}; >=20 unplanted curves total with stratified coverage across
      bit sizes (at least 6 per bit size when feasible).
    planted_path_control: >-
      Start from a known anomalous or low-embedding curve; walk a short random
      ordinary 2-isogeny path (1..4 hops) to E_rand; harness must recover a
      cheap reverse path (R_xfer < 0.7) with certificate.
    # B-3 discharge: ell_max semantics and cost ledger
    ell_max:
      composite_degree_cap: floor(N**(0.5))
      hops_max_2_isogeny: floor(log2(N) / 2)
      semantics: >-
        ell_max is a COMPOSITE PATH-DEGREE CAP (product of prime isogeny
        degrees along a cost-gate path), not a group-op budget and not a max
        prime. The HEUR arm uses hops_max_2_isogeny on the 2-isogeny graph.
        The cost-gate search may use primes in allowed_primes while the running
        product of degrees stays <= composite_degree_cap.
      allowed_primes: [2, 3, 5, 7]
      conflict_resolution_vs_H_IT_001: >-
        H-IT-001's phrase "N^{1/2} degree budget (group-op charged)" is
        resolved for EXP-IT-001 adjudication as: degree budget =
        composite_degree_cap; group-op charging is via cost_ledger below.
        Hypothesis status unchanged; no H-IT-001 edit in this amend.
    cost_ledger:
      unit: group_op_equivalent
      matched_rho: 0.886 * sqrt(N)
      matched_rho_note: negation-map Pollard rho on the same E instance
      matched_BSGS: 2 * ceil(sqrt(N))
      labels: >-
        Every numeric cost field MUST be labeled measured or modeled in
        transfer_gate_report.json.
      C_path:
        identity: C_path = C_search + C_eval
        C_search: >-
          BFS/MITM exploration charge. BFS: charge 1 group_op_equivalent per
          directed neighbor edge expanded. MITM (optional for mixed-prime
          search within composite_degree_cap): charge
          table_build_ops + table_lookup_ops where table_build_ops equals the
          number of frontier nodes inserted and table_lookup_ops equals the
          number of probe keys; both counted as 1 group_op_equivalent each.
          Algorithm choice (BFS vs MITM) MUST be recorded per curve; default
          is BFS on the 2-isogeny graph for HEUR arm.
        C_eval: >-
          Sum over edges on the chosen transfer path of c_iso(ell_i) with
          frozen modeled schedule c_iso(ell) = 4 * ell group_op_equivalents
          (Vélu-style). Label: modeled. COST-SENSITIVITY-10X multiplies only
          this C_eval sum by 0.1 and by 10.0.
      C_special:
        identity: >-
          C_special = C_special_<family> for the detector family of the
          endpoint E' (if multiple detectors true, charge the MINIMUM among
          applicable family formulas — optimistic for the attack; flagged
          optimistic).
        anomalous_trace_eq_1: >-
          C_special_anomalous = ceil(20 * (log2(N))**2) group_op_equivalents
          (modeled Smart–Araki–Satoh–Semaev-style). Label: modeled.
        embedding_degree_leq_threshold: >-
          Let k be the embedding degree returned by the detector.
          C_special_MOV = ceil(0.886 * sqrt(p**k)) group_op_equivalents
          (field DL in F_{p^k}^* charged 1:1 as group_op units at toy).
          Label: modeled. Optimistic assumption flagged in
          optimistic_assumptions.
        subfield_weil_descent_friendly: >-
          Let n = extension_degree from the detector.
          C_special_WD = ceil(0.886 * (N ** (1.0 - 1.0/n)))
          group_op_equivalents (modeled GHS-style toy charge). Label: modeled.
      C_pullback: >-
        C_pullback = ceil(log2(N)) * deg_composite_of_chosen_path
        group_op_equivalents (scalar transport / map evaluation). Label:
        modeled.
      R_xfer_identity: >-
        R_xfer = (C_path + C_special + C_pullback) / matched_rho
        with matched_rho = 0.886 * sqrt(N). Required in
        transfer_gate_report.json and summary.json.
      R_xfer_aggregation: >-
        B-6 DISCHARGE. Attack-favorable / objective-aligned rule:
        R_xfer := the MINIMUM charged ratio among all certificate-bearing
        transfer paths discovered within ell_max / hops_max on the cost-gate
        arm (including mixed-prime MITM certificates if that arm is used).
        If zero certificate-bearing paths exist, use censorship_lower_bound.
        The Executor MUST NOT report a non-minimal certificate to avoid F1
        or force RATE. When multiple paths share the same R_xfer, break ties
        by (1) smaller H_min / hop count on the path's 2-isogeny projection,
        (2) smaller endpoint j-invariant, (3) lexicographically smaller
        path-edge certificate id.
      bfs_neighbor_order: >-
        On both HEUR arm (H_min) and cost-gate BFS, expand neighbors in
        strictly increasing j-invariant order (integer lift in 0..p-1).
        Same-depth FIFO queue; first discovery defines parent for path
        reconstruction. MITM, if used, must still apply R_xfer_aggregation
        (min over certificates), not first-hit alone.
      censorship_lower_bound: >-
        If no path found within ell_max / hops_max: C_path = C_search_exhausted
        (edges expanded under the stop rule), C_special = 0, C_pullback = 0;
        report R_xfer_lb = C_path / matched_rho and treat as R_xfer for RATE
        when R_xfer_lb >= 1.0.
      required_in_transfer_gate_report: true
    seeds:
      - 2026073101
      - 2026073102
      - 2026073103
    # B-2 discharge: decidable detectors + density universe
    special_family_detectors:
      anomalous_trace_eq_1:
        predicate: >-
          True iff #E(F_p) == p (equivalently Frobenius trace t = 1 for
          ordinary? — use exact count: ord(E(F_p)) == p). Evaluated on the
          curve's Weierstrass model over its base field.
        boolean: '#E(F_p) == p'
      embedding_degree_leq_threshold:
        threshold_k_max: 6
        predicate: >-
          True iff there exists integer k with 1 <= k <= 6 such that
          N* divides (p**k - 1), where N* is the unique prime from
          density_universe.instance_N_map.unique_N_rule for this class
          (or the curve_sampler's designated prime-order subgroup N with the
          same uniqueness rule applied to #E) and p is the base-field
          characteristic. Report the minimal such k as embedding_degree.
          If none, false.
      subfield_weil_descent_friendly:
        predicate: >-
          True iff ALL of: (1) the ECDLP instance is presented over F_q with
          q = p0**n for prime p0 and integer n in {2,3,4}; (2) N* divides
          #E(F_q); (3) N* does not divide #E(F_{p0**m}) for every proper
          divisor m of n with 1 <= m < n. N* from unique_N_rule. For the
          default prime-field curve_sampler (n=1, q=p), this detector is
          FALSE by clause (1).
        note: >-
          Extension-field instances may appear only in planted-path or
          explicitly labeled cells; they do not redefine the GENERIC
          prime-field claim.
    density_universe:
      id: U_IT_ORDINARY_PRIME_ORDER
      bits: [20, 24, 28]
      # B-5 DISCHARGE: unique N / cofactor designation per retained class
      instance_N_map:
        id: N_MAP-IT-001-v3
        h_max: 256
        h_max_note: >-
          Frozen absolute cofactor bound. Retained classes require
          #E(F_p) = h * N with N prime, bitlength(N) == bits, and
          1 <= h <= h_max. Classes with no such factorization are excluded.
        unique_N_rule: >-
          Let Cand be the set of primes N such that bitlength(N)==bits and
          #E = h*N for some integer h with 1 <= h <= h_max. If Cand is empty,
          exclude the class. If |Cand| > 1, select N* = min(Cand) (smallest
          prime). Then h* = #E / N* (exact integer division). Detectors
          embedding_degree_leq_threshold and subfield_weil_descent_friendly
          MUST use this N* (never another bits-bit factor). Report
          (j, N*, h*, #E) in the density freeze artifact.
        p_bits_selection: >-
          For each bits, p_bits is the smallest prime p with
          2**(bits+1) < p < 2**(bits+2) such that there exists at least one
          ordinary E/F_p retained under unique_N_rule when j is scanned in
          increasing order 0,1,...,p-1 (first hit). seed_density is recorded
          for the bits=28 sample stream only; it does not override this
          smallest-p rule.
      definition: >-
        For each bits in {20,24,28}, fix p = p_bits per p_bits_selection.
        Universe U(bits) is the set of F_p-isomorphism classes of ordinary
        curves E/F_p represented by distinct j-invariants, each retained
        only if unique_N_rule yields a designated (N*, h*). For bits in
        {20,24}: exhaustive scan of all j in F_p in increasing order; retain
        ordinary classes with a valid (N*, h*). For bits == 28: deterministic
        sample of sample_size=50000 distinct j values drawn by
        SHA256(seed_density || be(counter)) mod p without replacement
        (counter = 0,1,2,...) until sample_size retained ordinary classes
        with valid (N*, h*) OR the field is exhausted; label estimator:
        sample_estimate.
      seed_density: 2026073199
      rho_special_formula: >-
        rho_special(bits) = |{E in U(bits) : any special_family_detector true
        under N* from unique_N_rule}| / max(|U(bits)|, 1)
      freeze_artifact: >-
        Write |U(bits)|, rho_special(bits), estimator label, h_max,
        p_bits, sha256 of the sorted list of (j, N*, h*) records (or sorted
        sample (j, N*, h*) for bits=28), and density_universe_spec_hash into
        HEUR_ISO_1_report.json BEFORE path search.
      density_universe_spec_hash: >-
        SHA256 of the canonical UTF-8 serialization of
        {id, instance_N_map_id: N_MAP-IT-001-v3, h_max: 256, bits,
        unique_N_rule_id: min_prime_N_star, p_bits_selection_id: smallest_p}.
    # B-4 discharge: IDEA-011 isogeny-transfer null object
    null_object:
      id: NULL-IT-ISOGENY-TRANSFER
      mechanism_class: isogeny-transfer
      proposal: IDEA-20260731-011
      construction_id: NULL-IT-ISOGENY-TRANSFER-v2
      neighbor_algorithm_id: NULL-IT-NEIGHBOR-v1
      # B-7 DISCHARGE: closed deterministic 3-regular null graph
      construction:
        summary: >-
          Preserve bit sizes, group order magnitude N*, API shape (neighbor
          iterator, detector hooks, cost ledger identities), and edge-evaluation
          charging schedule c_iso(ell)=4*ell, but DESTROY the algebraic isogeny /
          special-family structure via NULL-IT-NEIGHBOR-v1 + Bernoulli marks.
          No real Vélu isogeny or MOV/WD algebra is invoked on the null arm.
        vertex_set: >-
          Let hops_max = floor(log2(N*)/2). Let ball_bound =
          1 + 3 * ((2**hops_max) - 1) (closed ball size on the infinite
          3-regular tree). Let m = max(2, ceil(log2(ball_bound))).
          Let M = 2**m. Vertex set V = {0, 1, ..., M-1}.
        start_vertex: >-
          start_v = SHA256(null_seed || utf8("start") || big-endian j0) mod M
          where j0 is the instance starting j-invariant (integer 0..p-1).
        offsets: >-
          Derive three distinct offsets o0,o1,o2 in {1,...,M-1}.
          Pseudocode (single indent level): counter=0; offs=[]; while
          len(offs)<3: x = (SHA256(null_seed || utf8("off") ||
          big-endian counter) as integer mod (M-1)) + 1; if x not in offs:
          offs.append(x); counter += 1. Failure rule: if counter exceeds
          10000 before three distinct offsets, abort the null arm as
          failed_infrastructure (not a mathematical negative) and record
          null_builder_failure=true.
        neighbors_v: >-
          neighbors(v) = sorted([v XOR o0, v XOR o1, v XOR o2]) as a list of
          exactly three distinct vertices in V. Because each map v|->v XOR oi
          is a fixed-point-free involution on V (oi != 0), the graph is simple,
          undirected, and exactly 3-regular. neighbors(v) is uniquely
          determined by (null_seed, M, offs) before any null walk — no
          post-freeze pairing invention and no deferral to a builder receipt
          for the pairing itself. The builder receipt MAY echo offs and M for
          audit but MUST NOT choose them.
        special_marks: >-
          Vertex v is null-special iff
          (SHA256(null_seed || utf8("special") || big-endian v) as integer
          mod 10**9) < floor(rho_special(bits) * 10**9), using the frozen
          rho_special for the instance bit size (Bernoulli(rho_special)).
        special_solvers: >-
          Honest null special-solver cost charges C_special_anomalous by
          default when a null mark is hit. Synthetic log return only when a
          separately named planted null-bug cell demands it (not the default
          CTRL-NULL-IT-PLANT packaging plant below).
      structure_destroyed:
        - ordinary isogeny algebra / Vélu maps
        - true anomalous / MOV / Weil-descent predicates
      structure_preserved:
        - N* and bit size
        - d=3 neighbor degree API
        - cost_ledger identities and c_iso schedule
        - matched_rho / matched_BSGS baselines on the real curve E
        - R_xfer_aggregation rule on the null arm (min over certificates)
      null_seed_formula: >-
        null_seed = SHA256(utf8("NULL-IT-ISOGENY-TRANSFER") ||
        big-endian bytes of instance seed || big-endian N*)
      R_null_identity: >-
        R_null = (C_path_null + C_special_null + C_pullback_null) / matched_rho
        using the same cost_ledger identities and R_xfer_aggregation (min)
        on the null graph/marks. matched_rho remains the real-curve
        negation-rho baseline (not a null graph walk).
      gate_rule: >-
        Whenever a real-arm unplanted claim has R_xfer < 0.7 with certificate,
        the null arm MUST be run on the same instance and must satisfy
        R_null >= 0.95; otherwise the claim is an artifact (packaging failure),
        not support. If R_xfer >= 0.7, null arm is optional but packaging hash
        must still be recorded for the batch.
      # B-8 DISCHARGE: frozen plant injection + detection predicate
      planted_bug_positive_control:
        id: CTRL-NULL-IT-PLANT
        injection: >-
          On exactly one designated real-arm plant cell (seed =
          seeds[0] = 2026073101, first unplanted curve of bits=20), compute
          the honest path ledger and C_path_honest = sum of c_iso charges on
          the chosen aggregated path's edges (plus C_search as charged).
          Persist raw edge ledger fields sufficient to recompute C_path
          (edge list with per-edge ell and c_iso). Then set
          C_path_reported = floor(C_path_honest / 4) in the plant receipt
          fields used by R_xfer packaging. Do NOT alter the raw ledger.
          Set plant_injected=true on that receipt.
        detection_predicate: >-
          plant_detected = true iff ALL of: (1) plant_injected is true on
          the designated cell; (2) C_path_recomputed = recomputation of
          C_path from the persisted raw edge ledger using cost_ledger.c_iso
          (Validator-independent); (3) C_path_reported <=
          floor(C_path_recomputed / 4) + eps with eps = 0; (4)
          C_path_reported < C_path_recomputed. Otherwise plant_detected =
          false. A reporting-only cut that omits the raw ledger fails (2)
          and yields plant_detected=false (harness void). R_null is NOT
          required to move for detection; the packaging check is the frozen
          boolean.
        success_criterion_bit: >-
          CTRL-NULL-IT-PLANT passes iff plant_detected=true under
          detection_predicate. Failure ⇒ harness void for sub-rho claims.
        required_report_fields_plant:
          - plant_injected
          - C_path_honest
          - C_path_reported
          - C_path_recomputed
          - plant_detected
          - plant_detection_eps
      honest_rho_negative_control: >-
        CTRL-NULL-IT-RHO: honest matched rho on real instances must show
        rho_calib_ratio near 1 (within ±0.15); this is calibration sanity,
        not R_null.
      packaging_hash: >-
        null_object_spec_hash = SHA256 of the canonical UTF-8 serialization of
        {id, construction_id: "NULL-IT-ISOGENY-TRANSFER-v2",
        neighbor_algorithm_id: "NULL-IT-NEIGHBOR-v1", d: 3,
        rho_special_by_bits, c_iso_schedule: "4*ell", R_null_identity,
        gate_rule, plant_detection_id: "CTRL-NULL-IT-PLANT-v3"} as written
        in this contract. Required in every run manifest that reports R_xfer
        or R_null.
      required_report_fields:
        - null_object_id
        - null_object_spec_hash
        - construction_id
        - neighbor_algorithm_id
        - null_M
        - null_offsets
        - R_null
        - R_xfer
        - null_gate_pass
        - plant_injected
        - plant_detected
        - C_path_reported
        - C_path_recomputed
        - rho_calib_ratio

  controls:
    - id: CTRL-PLANTED-PATH-POS
      role: positive
      description: >-
        Known special family + short random 2-isogeny walk; must recover cheap
        reverse path with certificate or harness is void.
    - id: CTRL-MATCHED-RHO
      role: baseline_negative
      description: Matched Pollard rho with negation on the same E instances.
    - id: CTRL-MATCHED-BSGS
      role: baseline
      description: Matched BSGS on the same E instances.
    - id: CTRL-EXIT-MAP-CONSISTENCY
      role: consistency
      description: >-
        Algebraic self-maps must not be counted as transfer paths
        (IDEA-20260727-005).
    - id: CTRL-NULL-PACKAGING-GATE
      role: null_gate
      description: >-
        Any claimed R_xfer < 0.7 on unplanted curves must survive
        NULL-IT-ISOGENY-TRANSFER per inputs.null_object (IDEA-20260731-011).
        Equal speedup on the null (R_null < 0.95 when R_xfer < 0.7) is an
        artifact, not support.
    - id: CTRL-NULL-IT-PLANT
      role: null_plant
      description: >-
        Planted 4x false C_path_reported vs raw ledger; plant_detected must
        be true under null_object.planted_bug_positive_control.detection_predicate
        or harness void.
    - id: CTRL-NULL-IT-RHO
      role: null_calibration
      description: >-
        Honest matched-rho calibration sanity (rho_calib_ratio within ±0.15).

  independent_variables:
    - bits
    - seed
    - planted_vs_unplanted
    - object_kind  # real_isogeny | null_it_isogeny_transfer
    - ell_budget

  metrics:
    primary:
      - H_min
      - min_ell_composite
      - C_path
      - C_search
      - C_eval
      - C_special
      - C_pullback
      - R_xfer
      - R_null
      - planted_path_recovered
      - certificate_pass
      - null_gate_pass
    secondary:
      - matched_rho_ops
      - matched_bsgs_ops
      - HEUR_ISO_1_ks_stat
      - censored_fraction
      - cost_sensitivity_10x_flip
      - null_object_spec_hash
      - plant_detected
      - rho_calib_ratio

  replication:
    seeds:
      - 2026073101
      - 2026073102
      - 2026073103
    independent_instances: 20

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 48
    maximum_memory_gb: 16
    maximum_runs: 3

  stopping_rules:
    - >-
      Stop a curve's path search at composite_degree_cap / hops_max or
      wall-clock per-run budget; record censorship honestly.
    - Stop the batch when >=20 unplanted curves and the planted-path control
      have completed accounting, or when total_cpu_hours is exhausted.
    - On CTRL-NULL-IT-PLANT failure, stop and report harness void.

  invalidation_rules:
    - Planted-path positive control not recovered → harness void; no
      generic-safety claim.
    - Missing certificate on a claimed solve → invalid claim, not support.
    - Editing preregistered density / F_hit / d / cost_ledger after sampling →
      protocol violation.
    - Timeout/crash → infrastructure inconclusive (AGENTS.md rule 5), never
      mathematical negative.
    - Any edit to specification.yaml (v1), specification.v2.yaml, or this
      v3 file after TASK-20260731-122 without a further versioned amendment
      → integrity failure.

  success_criterion: >-
    S1 (gate holds at toy): planted-path control recovered AND RATE-ISO-1 pass
    AND no F1 falsification (>=2 unplanted R_xfer < 0.7 with certificates) AND
    HEUR-ISO-1 not F3-failed (or HEUR status explicitly reported failed without
    claiming crypto safety) AND every unplanted R_xfer < 0.7 claim (if any)
    passes CTRL-NULL-PACKAGING-GATE (R_null >= 0.95) AND CTRL-NULL-IT-PLANT
    plant_detected=true under the frozen detection_predicate. S1 is toy-tier only.

  falsification_criterion: >-
    F1: >=2 unplanted curves with R_xfer < 0.7 and verified certificates
    (and null gate passed — otherwise packaging failure, not F1 support of a
    real break).
    F2: planted-path control not recovered (harness void).
    F3: HEUR-ISO-1 toy FAIL per heur_iso_1_decision_rule.F3_trigger.

  optimistic_assumptions:
    - assumption: c_iso(ell) = 4*ell understates real Vélu / modular cost
      bias_direction: may understate C_path
    - assumption: Taking min C_special among overlapping detectors favors attack
      bias_direction: optimistic for transfer; may understate charged cost
    - assumption: MOV field-DL charged 1:1 as group_op units
      bias_direction: unit conversion may mis-rank MOV vs rho at toy
    - assumption: Tree-ball F_hit independent-marking model matches volcano geometry
      bias_direction: model mis-specification may pass/fail KS spuriously
    - assumption: Special-family detectors are complete for the named families
      bias_direction: false negatives inflate apparent generic safety

  concrete_cost_table_requirements:
    - Report measured vs modeled columns separately for each bit size.
    - Peak memory for MITM tables sized analytically and reconciled to
      peak_rss_bytes.
    - Disclose o(1)/polylog factors in isogeny arithmetic.
    - Affected-vs-safe scope: GENERIC random E only; structured CM /
      pairing-friendly curves out of claim.

  required_artifacts:
    - experiments/EXP-IT-001/runs/RUN-IT-001-*/manifest.json
    - experiments/EXP-IT-001/runs/RUN-IT-001-*/raw-result.json
    - experiments/EXP-IT-001/results/summary.json
    - experiments/EXP-IT-001/results/HEUR_ISO_1_report.json
    - experiments/EXP-IT-001/results/transfer_gate_report.json
    - experiments/EXP-IT-001/results/concrete_cost_table.json
    - experiments/EXP-IT-001/results/null_it_isogeny_transfer_report.json
    - certificate files for any claimed solve (wrapper-reverified)

  assigned_to: executor
  does_not_modify:
    - H-DS-001
    - H-IC-001
    - H-STR-002
    - EXP-DS-001
