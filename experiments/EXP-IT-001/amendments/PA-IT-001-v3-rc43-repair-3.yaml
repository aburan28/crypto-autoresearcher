protocol_amendment:
  id: PA-IT-001-v3-rc43-repair-3
  experiment_id: EXP-IT-001
  hypothesis_id: H-IT-001
  goal_id: GOAL-ECDLP-001
  batch: BATCH-043
  review_cycle_id: RC-43
  authoring_task: TASK-20260802-312
  snapshot_task: TASK-20260802-313
  review_task: TASK-20260802-314
  amendment_type: repair_overlay
  from_version: 3
  to_version: 3
  claim_tier: toy
  supersedes_overlay: PA-IT-001-v3-rc36-repair-2
  closes_review: RT-20260802-244
  dominated_by: Pollard rho at exponent 1/2 (matched negation) remains the generic baseline for ordinary
    prime-order subgroups; this overlay does not claim a sub-rho exponent.
  sota_delta:
    time_exponent_delta: not_applicable
    memory_exponent_delta: not_applicable
    data_or_query_exponent_delta: not_applicable
    non_solver_scope: Design-only repair overlay; no algorithm, implementation, or experiment is executed
      under TASK-312. Quantitative ECDLP cost deltas are therefore not_applicable until a later Executor
      batch produces matched-rho measurements under this frozen contract.
    vs_prior_overlay: Supersedes PA-IT-001-v3-rc36-repair-2 by splitting C_special_smart vs C_special_field_DLP
      (RT-244-B1), freezing three-axis not_applicable Pareto fields with non-solver scope (B2), binding
      a single command entrypoint (B3), and closing M1-M3 certificate/manifest/comparator wording defects.
  mechanism: "Isogeny-transfer ECDLP reduction on ordinary toy curves: search a low-degree isogeny graph\
    \ for a path that maps the public instance to a special end (anomalous Smart trace-1, or low-embedding\
    \ MOV for comparator only), then pull the discrete log back. RC-36 freezes field-DLP-inclusive special\
    \ cost and a non-special\u2192non-special planted transfer certificate so R_xfer readings are not\
    \ model- or packaging-dominated."
  predictions:
  - CTRL-ANOMALOUS-TRACE1 passes with R_xfer < 0.7 when C_special_smart is used as the anomalous pass
    threshold on a verified trace-1 plant.
  - Using C_special_field_DLP as the anomalous pass threshold is contract_invalid under RC-43.
  - CTRL-TRANSFER-NONSPECIAL recovers a planted non-special path with start and end nonspecial, reverse-of-planted-walk,
    pullback_evaluated, and relation_reverified.
  - CTRL-NULL-PACKAGING-GATE rejects the pre-registered synthetic R_xfer < 0.7 claim; CTRL-NULL-IT-PLANT
    recomputes from the raw edge ledger via the archived recompute script.
  - "Density fractions at bits 16..24 are reported with Wilson 95% CI (Bonferroni\xD75)."
  test_boundary: Toy claim tier only; bits in {16,18,20,22,24}; ordinary prime-field curves; no crypto-scale;
    no H-IT-001 status change in this overlay authoring task.
  cost_model:
    C_special_smart: Anomalous positive-control pass threshold ONLY. For a verified Smart trace-1 plant
      (certificate verified:true), charge C_special = ceil(c_smart * log2(p)) group-op equivalents with
      disclosed constant c_smart=64 unless a later amendment recalibrates it. Must NOT use ceil(2*sqrt(N*))
      or any MOV formula.
    C_special_field_DLP: MOV / embedding comparator column ONLY. For embedding degree k>=1 with N*|p^k-1,
      charge ceil(2*sqrt(N*)) when k=1 and ceil(0.886*sqrt(p**k)) when k>=2 as a labeled comparator that
      is NEVER the anomalous or transfer pass threshold.
    anomalous_curve_requirement: "CTRL-ANOMALOUS-TRACE1: plant endpoint MUST satisfy #E(F_p) divisible\
      \ by a large prime N with trace t = p+1-#E \u2261 1 (mod N) in the Smart sense (a=p+1-#E with a\u2261\
      1), verified by an independent certificate in anomalous_trace1_certificate.json. Embedding degree\
      \ k=1 alone is NOT sufficient and is an invalidation if used as the anomalous plant."
    limb_binding: "SINGLE BRANCH \u2014 anomalous pass threshold is C_special_smart; transfer-gate reports\
      \ must record c_special_formula_id: C_special_smart for CTRL-ANOMALOUS-TRACE1 and may record C_special_field_DLP\
      \ only in comparator columns."
  c_special_mov_decision: REPLACED_AS_ANOMALOUS_THRESHOLD
  c_special_mov_decision_note: The old ceil(0.886*sqrt(p^k)) formula is forbidden as an anomalous or transfer
    pass threshold. It MAY appear as a labeled MOV comparator column for k>=2 under C_special_field_DLP.
    Anomalous accounting uses C_special_smart only.
  repairs:
  - id: R3-FIX-B1
    title: Split C_special_smart from C_special_field_DLP
    closes_defect: RT-244-B1
    requirement: Anomalous pass threshold uses C_special_smart only. C_special_field_DLP is comparator-only.
      Reports citing field-DLP/MOV formulas as anomalous pass thresholds are invalid.
    acceptance_criteria:
    - 'transfer_gate_report.json records c_special_formula_id: C_special_smart for CTRL-ANOMALOUS-TRACE1'
    - anomalous_trace1_certificate.json verifies with verified:true
    - No embedding-degree-1-only curve labeled as anomalous plant
    - No ceil(2*sqrt(N*)) used as anomalous pass threshold
  - id: R3-FIX-B2
    title: Quantitative Pareto axes
    closes_defect: RT-244-B2
    requirement: Every run deliverable includes dominated_by and sota_delta.time_exponent_delta / memory_exponent_delta
      / data_or_query_exponent_delta as numeric or not_applicable with explicit non_solver_scope sentence.
    acceptance_criteria:
    - All listed reports contain dominated_by and the three sota_delta axes
    - not_applicable axes include non_solver_scope text
  - id: R3-FIX-B3
    title: Single binding Executor command
    closes_defect: RT-244-B3
    requirement: Exactly one entrypoint and the frozen command strings below. Any other invocation or
      CLI flag change is contract_invalid.
    acceptance_criteria:
    - future_executor_commands.binding_entrypoint is the sole authorized binary
    - No note permitting Executor CLI adjustment exists
  - id: R3-FIX-M1
    title: Start-j nonspecial and walk reversal
    closes_defect: RT-244-M1
    requirement: CTRL-TRANSFER-NONSPECIAL certificate requires start_j_speciality:nonspecial, end_j_speciality:nonspecial,
      path_is_reverse_of_planted:true, pullback_evaluated:true, relation_reverified:true.
    acceptance_criteria:
    - 'start_j_speciality: nonspecial'
    - 'end_j_speciality: nonspecial'
    - 'path_is_reverse_of_planted: true'
    - 'pullback_evaluated: true and relation_reverified: true'
  - id: R3-FIX-M2
    title: Null recompute script in archive manifest
    closes_defect: RT-244-M2
    requirement: implementation_archive_manifest MUST include experiments/EXP-IT-001/implementation/recompute_null_plant_from_ledger.py.
      Missing script at pre-run snapshot invalidates the run package (blocks completed_valid).
    acceptance_criteria:
    - recompute_null_plant_from_ledger.py listed in implementation_archive_manifest
    - Missing script => contract_invalid / not completed_valid
  - id: R3-FIX-M3
    title: Comparator wording vs anomalous ban
    closes_defect: RT-244-M3
    requirement: Ban ceil(0.886*sqrt(p^k)) only as anomalous/transfer pass threshold; allow labeled comparator
      column under C_special_field_DLP for k>=2.
    acceptance_criteria:
    - c_special_mov_decision_note matches this wording
    - Comparator column may cite the formula with label mov_comparator_only
  - id: R3-FIX-PRESERVE-DENSITY
    title: Preserve density scan CI protocol from rc36
    closes_defect: BATCH-036 capsule item 5
    requirement: "Density scan over bits {16,18,20,22,24}; n_curves_per_bits=5; Wilson 95% CI; Bonferroni\xD7\
      5."
    acceptance_criteria:
    - density_scan_report.json lists per-bits n, successes, Wilson CI
    - 'multiplicity_method: bonferroni_5'
  - id: R3-FIX-PRESERVE-NULL
    title: Preserve live null packaging gate + raw ledger
    closes_defect: BATCH-036 capsule item 3
    requirement: CTRL-NULL-PACKAGING-GATE rejects synthetic R_xfer < 0.7; persist ctrl_null_it_plant_edge_ledger.jsonl.
    acceptance_criteria:
    - null_packaging_gate_rejected_synthetic:true
    - ctrl_null_it_plant_edge_ledger.jsonl non-empty when edges_expanded > 0
  implementation_archive_manifest:
  - experiments/EXP-IT-001/specification.v3.yaml
  - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc43-repair-3.yaml
  - experiments/EXP-IT-001/implementation/run_bounded_toy.py
  - experiments/EXP-IT-001/implementation/it001_driver.py
  - experiments/EXP-IT-001/implementation/it001_lib.py
  - experiments/EXP-IT-001/implementation/it001_pure.py
  - experiments/EXP-IT-001/implementation/it001_density_worker.py
  - experiments/EXP-IT-001/implementation/recompute_null_plant_from_ledger.py
  - experiments/EXP-IT-001/implementation/implementation.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-043/tasks/TASK-20260802-312/control-matrix.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-043/tasks/TASK-20260802-312/artifact-and-cost-plan.yaml
  future_executor_commands:
    binding_entrypoint: experiments/EXP-IT-001/implementation/run_bounded_toy.py
    smoke: sage experiments/EXP-IT-001/implementation/run_bounded_toy.py --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc43-repair-3.yaml
      --run-id RUN-IT-001-rc43-smoke --mode smoke --seed 2026080201
    measure: sage experiments/EXP-IT-001/implementation/run_bounded_toy.py --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc43-repair-3.yaml
      --run-id RUN-IT-001-rc43-measure --mode measure --seeds 2026080201,2026080202,2026080203
    note: Commands are planned only. TASK-312 does not execute them. A future Executor batch MUST invoke
      exactly these strings (or the smoke/measure pair as written). Any other entrypoint, including run_bounded_toy.sage
      as primary, or any CLI flag change, is contract_invalid.
  reserved_run_ids:
  - RUN-IT-001-rc43-smoke
  - RUN-IT-001-rc43-measure
  metrics:
  - 'R_xfer with c_special_formula_id: C_special_smart for anomalous arm'
  - planted_path_recovered / start_j_speciality / end_j_speciality / path_is_reverse_of_planted / pullback_evaluated
    / relation_reverified
  - null_packaging_gate_rejected_synthetic
  - density success fraction per bits with Wilson 95% CI
  seeds:
    smoke: 2026080201
    measure:
    - 2026080201
    - 2026080202
    - 2026080203
  budgets:
    wall_clock_seconds_smoke: 600
    wall_clock_seconds_measure: 3600
    memory_gb: 4
    maximum_runs: 4
  stopping_rules:
  - Stop after reserved run IDs complete or budget exhausts
  - Invalidation on any R3-FIX acceptance failure
  falsification:
  - Anomalous arm uses C_special_field_DLP or ceil(2*sqrt(N*)) as pass threshold
  - Executor invokes non-binding entrypoint or altered flags
  - Pareto axes missing or qualitative-only
  - Transfer certificate omits start nonspecial or reverse-of-planted
  - Null recompute script absent from pre-run archive
  unexpected_observation_policy: Record under unexpected/ without silently discarding; do not change success
    criteria post hoc.
  official_status_effects:
    goal: unchanged_active
    hypothesis: unchanged_specified
    implementation_authorized: false
    experiment_runs_authorized: 0
