protocol_amendment:
  id: PA-IT-001-v3-rc36-repair-2
  experiment_id: EXP-IT-001
  hypothesis_id: H-IT-001
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-036
  review_cycle_id: RC-36
  authoring_task: TASK-20260802-242
  snapshot_task: TASK-20260802-243
  amendment_type: repair_overlay
  parent_contract: experiments/EXP-IT-001/specification.v3.yaml
  prior_overlays:
    - experiments/EXP-IT-001/amendments/PA-IT-001-v2-rc25b-b1-b4.yaml
    - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc27-b5-b8.yaml
    - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc30-repair-1-to-7.yaml
  authority:
    - ledger/goals/GOAL-ECDLP-001.yaml
    - ledger/decisions/DEC-20260801-002.yaml
    - ledger/decisions/DEC-20260802-211.yaml
    - ledger/evidence/EV-IT-002.yaml
  frozen: true
  frozen_on: '2026-08-02'
  executable_now: false
  implementation_authorized: false
  experiment_runs_authorized: 0
  later_execution_gate: >-
    A later Coordinator decision may authorize implementation and the one
    reserved run only after TASK-20260802-243 archives these five artifacts and
    TASK-20260802-244 independently returns PASS on their immutable hashes.
  precedence: >-
    specification.v3.yaml and all prior overlays remain immutable. This overlay
    supersedes only conflicting execution clauses for the six repairs named
    below. Every unmentioned v3 clause remains binding. A conflict not resolved
    explicitly here invalidates admission; the future Executor may not choose a
    preferred reading.

  claim_boundary:
    tier: toy
    scope: >-
      One deterministic 20-22-bit design for control validity, conditioned
      multi-prime density estimates, and charged transfer ratios. No outcome is
      crypto-scale or asymptotic evidence.
    forbidden_claims:
      - support or rejection of H-IT-001 or H-DS-001
      - generic-curve safety or lane death
      - HEUR-ISO-1 crypto-scale adjudication
      - an achieved SOTA improvement
      - goal closure or breakthrough
    observation_policy: >-
      Persist every unexpected observation in manifest.unexpected_observations
      and raw-result.json. Do not discard, relabel, or use it to alter a frozen
      threshold. A crash, timeout, fixture-construction miss, or control failure
      is infrastructure/invalid measurement, never mathematical evidence.

  mechanism_and_test_boundary:
    mechanism: >-
      The repaired harness separates three questions that BATCH-030 conflated:
      actual trace-1 anomalous cost calibration, algebraic isogeny-map scalar
      transport on a detector-negative instance, and null packaging
      discrimination. It then samples density only at deterministically selected
      primes known to admit a trace-1 class, so an empty detector universe is no
      longer built into prime selection.
    discriminates:
      - a valid isogeny pullback certificate versus a direct same-curve solve
      - a real certificate with honest costs versus a synthetically undercharged package
      - detector sparsity at conditioned primes versus a smallest-prime selection artifact
    does_not_test:
      - whether a trace-1 curve can isogeny-walk to a non-special curve
      - cryptographic-size special-family density
      - an exponent improvement
    trace_invariance_constraint: >-
      Curves linked by an F_p-rational isogeny have the same Frobenius trace.
      Therefore an anomalous trace-1 curve cannot have a detector-negative
      isogenous endpoint. The anomalous cost control and detector-negative map
      transfer control are necessarily separate; treating them as one control is
      forbidden.

  deterministic_execution:
    reserved_run_ids:
      - RUN-IT-001-rc36-repair-2
    seeds:
      density_prime_selection: 202608023601
      density_sampling: 202608023602
      unplanted_instances: [202608023611, 202608023612, 202608023613]
      anomalous_fixture: 202608023621
      transfer_fixture: 202608023622
      null_fixture: 202608023623
      rho_control: 202608023624
    algorithm_choices:
      path_search: BFS
      mitm: forbidden
      neighbor_order: increasing integer j-invariant
      queue_order: same-depth FIFO
      path_tie_break: [R_xfer, hop_count, endpoint_j, certificate_id]
    exact_command: >-
      sage -python experiments/EXP-IT-001/implementation/rc36/run_rc36_repair_2.py
      --contract experiments/EXP-IT-001/specification.v3.yaml
      --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml
      --run-id RUN-IT-001-rc36-repair-2
      --output experiments/EXP-IT-001/runs/RUN-IT-001-rc36-repair-2
    command_normalization: >-
      The future command.txt must contain the exact command above on one line
      with single ASCII spaces and a trailing newline. No extra flag,
      environment-dependent default, alternate driver, or second run is allowed.

  repair_1_cost_and_anomalous_control:
    decision: keep_frozen_C_special_MOV
    binding_formula: >-
      C_special_MOV = ceil(0.886 * sqrt(p**k)) group_op_equivalents, exactly as
      specification.v3.yaml. The BATCH-030 substitution ceil(k*log2(p)) is
      forbidden and must trigger invalidation.
    field_dlp_disclosure: >-
      Every MOV row must also report pairing_eval_ops, field_dlp_order=N_star,
      field_dlp_bsgs_reference=2*ceil(sqrt(N_star)), and
      end_to_end_MOV_sanity=pairing_eval_ops+field_dlp_bsgs_reference. These are
      sensitivity/audit fields and do not replace the single binding formula.
      At k=1 the audit must explicitly contain the approximately
      2*sqrt(N_star) field-DLP term; reporting only a Miller-loop term is invalid.
    anomalous_formula: >-
      C_special_anomalous = ceil(log2(N_star)) group_op_equivalents for the
      actual trace-1 positive-control row only, labeled modeled and optimistic.
      Report sensitivity multipliers 1, 4, and 20; this formula must never be
      applied to an embedding-degree endpoint.
    actual_trace_1_fixture:
      field_bit_window: [20, 22]
      selection: >-
        For b=20, enumerate primes p in [2**19,2**20) in increasing order. For
        each p enumerate j=0..min(p-1,65535), construct CANONICAL-J-v1, and
        choose the lexicographically first (p,j) whose exact point count is p.
        If none exists, invalidate the run as fixture_construction_failure.
      canonical_j_model: >-
        For j not in {0,1728}, let kappa=j/(1728-j) in F_p and use
        y^2=x^3+3*kappa*x+2*kappa. For j=0 use y^2=x^3+1; for j=1728 use
        y^2=x^3+x. Coefficients use least residues. Reject singular models.
      required_predicates:
        - exact_cardinality_equals_p: true
        - frobenius_trace_equals_1: true
        - anomalous_trace_eq_1_detector: true
        - embedding_degree_label_may_not_substitute_for_anomalous: true
      scalar_fixture: >-
        Choose the lexicographically first affine point P=(x,y), ordered by
        least residues, with order p. Set d=2+(SHA256("RC36-ANOMALOUS" ||
        be(p) || be(j)) mod (p-3)); set Q=[d]P. Recover d with SMART-LIFT-v1,
        then verify [d]P=Q on E(F_p).
      smart_lift_v1: >-
        Lift the selected curve, P, and Q to Q_p at precision 3 with least
        coefficient residues and the p-adic y root congruent to the selected y.
        Compute [p]P_lift and [p]Q_lift by left-to-right binary double-and-add.
        For R in {[p]P_lift,[p]Q_lift}, compute lambda(R)=-(x(R)/y(R))/p mod p.
        Return d_rec=lambda([p]Q_lift)/lambda([p]P_lift) mod p. A zero
        denominator or failed [d_rec]P=Q invalidates the control.
      acceptance: >-
        The exact trace and detector predicates pass, SMART-LIFT-v1 returns the
        planted d, the wrapper verifies [d]P=Q, and the anomalous row has
        R_control=(C_special_anomalous/matched_rho)<0.7 at multiplier 1. Report
        all sensitivity rows even if multipliers 4 or 20 cross 0.7.

  repair_2_genuine_transfer_control:
    id: CTRL-ISOGENY-PULLBACK-NONSPECIAL-POS
    purpose: >-
      Validate genuine scalar transport and pullback-map evaluation. It is not a
      special-family shortcut and its BSGS solve may not enter a sub-rho claim.
    fixed_field: 2097169
    subgroup_bits: 20
    fixture_selection: >-
      Enumerate j=0..p-1 under CANONICAL-J-v1. Retain the first curve satisfying
      N_MAP-IT-001-v3 for bits=20, false under every frozen special detector,
      with a rational nonzero 2-torsion point, and with the first canonical
      degree-2 quotient below nonsingular, detector-negative, and of different
      j-invariant. The search cap is j=262143. No match by the cap is
      fixture_construction_failure, not a negative result.
    canonical_kernel_and_map: >-
      Let r be the least x in F_p with (r,0) a nonzero 2-torsion point. Translate
      x=X+r so E0 is Y^2=X^3+aX^2+bX. Define E1 by
      Y^2=X1^3-2aX1^2+(a^2-4b)X1 and phi(X,Y)=
      (X+a+b/X, Y*(1-b/X^2)); phi(O)=O and phi((0,0))=O. The endpoint is E1.
      Define dual_phi(X1,Y1)=((X1-2a+(a^2-4b)/X1)/4,
      Y1*(1-(a^2-4b)/X1^2)/8), with kernel points and O handled by the group
      law. All arithmetic is in F_p.
    point_and_scalar_selection: >-
      Enumerate affine R lexicographically; choose the first P=[h_star]R of
      exact order N_star not in ker(phi). Set d=2+(SHA256("RC36-XFER" || be(p)
      || be(j(E0)) || be(N_star)) mod (N_star-3)); Q=[d]P; P1=phi(P); Q1=phi(Q).
    recovery: >-
      Recover d_rec by deterministic BSGS on (E1,P1,Q1,N_star), baby steps
      0..ceil(sqrt(N_star))-1 and least-index collision tie-break. Then actually
      evaluate P_back=dual_phi(P1) and Q_back=dual_phi(Q1).
    certificate_requirements:
      - E0 and E1 exact coefficients and j-invariants
      - all frozen detector booleans false on E0 and E1
      - j(E1) differs from j(E0)
      - kernel point and phi/dual_phi coefficients
      - P, Q, P1, Q1, P_back, Q_back, N_star, h_star, d_rec
      - phi(P)=P1 and phi(Q)=Q1
      - dual_phi(P1)=P_back and dual_phi(Q1)=Q_back
      - P_back=[2]P and Q_back=[2]Q
      - Q1=[d_rec]P1 and Q_back=[d_rec]P_back
      - SHA256 of canonical certificate serialization
    certificate_serialization: >-
      RFC 8785 JSON Canonicalization Scheme over the exact certificate fields,
      encoded as UTF-8 with no trailing newline; field elements are least
      nonnegative decimal integers and points are [x,y] or the string "O".
    acceptance: >-
      Every certificate requirement is true, the planted walk is the one edge
      E0->E1, its endpoint E1 has a different j and is detector-negative, and
      d_rec equals d. A same-curve direct solve without phi and dual_phi
      evaluations is an automatic control failure.

  repair_3_live_null_and_raw_ledgers:
    live_synthetic_claim:
      id: CTRL-NULL-GATE-LIVE-SYNTHETIC
      source_certificate: CTRL-ISOGENY-PULLBACK-NONSPECIAL-POS
      construction: >-
        Keep the valid d_rec certificate but overwrite only the synthetic claim
        package with C_path_reported=floor(0.5*matched_rho), C_special_reported=0,
        and C_pullback_reported=0. Set synthetic_claim=true. Thus
        R_xfer_synthetic<0.7 deterministically; this row is never a scientific
        observation.
      null_execution: >-
        Run NULL-IT-ISOGENY-TRANSFER-v2 on the same N_star and seed. Inject the
        same synthetic scalar certificate and the same undercharged package on
        the first null edge so R_null_synthetic<0.95. Evaluate the frozen gate.
      required_outcome: >-
        claim_accepted=false, null_gate_pass=false, rejection_reason=
        equal_or_better_speedup_on_structure_destroyed_null. If the gate accepts
        the claim, is skipped, or reports null, the harness is void.
    plant_control:
      id: CTRL-NULL-IT-PLANT
      source_cell: CTRL-ISOGENY-PULLBACK-NONSPECIAL-POS
      injection: >-
        After computing the honest ledgers, set only C_path_reported to
        floor(C_path_recomputed/4). Do not alter either raw ledger.
      raw_search_edge_ledger_fields:
        - expansion_index
        - source_j
        - target_j
        - ell
        - neighbor_rank
        - search_charge
      raw_chosen_path_edge_ledger_fields:
        - path_index
        - source_j
        - target_j
        - ell
        - kernel_x
        - map_coefficients
        - c_iso_formula
        - c_iso_value
        - phi_P_in
        - phi_P_out
        - phi_Q_in
        - phi_Q_out
      recomputation: >-
        C_search_recomputed=sum(search_charge) over raw_search_edge_ledger and
        C_eval_recomputed=sum(c_iso_value) over raw_chosen_path_edge_ledger after
        independently checking c_iso_value=4*ell. C_path_recomputed is their sum.
        Both ledgers must be nonempty and C_path_recomputed>0.
      acceptance: >-
        plant_detected=true under the original frozen predicate, both ledgers are
        nonempty, all edge/map checks pass, and the recomputed cost is independent
        of every summary cost field.

  repair_4_pareto_fields:
    required_in_every_future_deliverable: true
    schema:
      dominated_by:
        allowed: [pollard_rho, BSGS, neither, not_applicable]
        not_applicable_rule: >-
          Allowed only with an explicit non_solver_scope string. It is forbidden
          on a transfer row, aggregate solver result, or cost table.
      sota_delta:
        time:
          required: [absolute_group_ops, ratio_vs_rho, exponent_delta]
        memory:
          required: [peak_bytes, ratio_vs_rho_state_bytes, exponent_delta]
        data_or_query:
          required: [curve_samples, edge_queries, ratio_vs_rho_queries, exponent_delta]
    row_rule: >-
      Evaluate every row across time, memory, and data/query. A row is dominated
      only if one baseline is no worse in all three and strictly better in at
      least one. Unknown or censored components produce dominated_by=neither with
      an explicit unresolved_component; they never produce null.
    design_record_values:
      dominated_by: not_applicable
      non_solver_scope: >-
        This amendment is a pre-run design record and reports zero achieved
        algorithmic change.
      sota_delta:
        time: {exponent_delta: 0.0, achieved_group_ops_delta: 0}
        memory: {exponent_delta: 0.0, achieved_bytes_delta: 0}
        data_or_query: {exponent_delta: 0.0, achieved_query_delta: 0}

  repair_5_density_scan:
    id: DENSITY-RC36-TRACE1-CONDITIONED
    field_bit_window:
      inclusive_min: 20
      inclusive_max: 22
      strata: [20, 21, 22]
    prime_selection: >-
      For each b in increasing order, enumerate b-bit primes p in increasing
      order. For each p scan CANONICAL-J-v1 at j=0..65535. A p is eligible iff an
      exact point count finds at least one ordinary trace-1 class (#E(F_p)=p).
      Select the first three eligible p values in each stratum. Stop after 4096
      candidate primes per stratum; fewer than three is invalid_density_design.
      This rule admits an actual trace-1 retained class and does not use the old
      smallest-p-with-any-retained-class rule.
    selection_witness: >-
      Persist the first trace-1 (p,j,curve_coefficients,#E,trace,N_star=p,h_star=1)
      for every selected p before density sampling. All exact arithmetic must be
      independently recomputable.
    universe: >-
      For each selected p use the v3 ordinary distinct-j universe and
      N_MAP-IT-001-v3 with bits=b and h_max=256. Prime selection is conditioned
      on trace-1 existence; estimates may be interpreted only for these nine
      selected primes.
    sampling:
      sample_size_retained_per_prime: 2048
      candidate_j_cap_per_prime: 262144
      without_replacement: true
      stream: >-
        j_c=SHA256(be(202608023602)||be(b)||be(prime_rank)||be(counter)) mod p;
        reject repeated j_c; retain only ordinary classes accepted by
        N_MAP-IT-001-v3 until 2048 are retained or the cap is reached.
      shortfall_rule: >-
        Fewer than 2048 retained classes makes that density cell invalid and
        excludes all experiment conclusions; report the shortfall as
        infrastructure, never as zero density.
    estimands:
      primary: >-
        For each of nine selected primes, rho_any(p)=number of sampled retained
        classes satisfying any frozen detector divided by 2048.
      secondary: >-
        Per-prime rho_anomalous and rho_MOV, detector overlap counts, and the
        descriptive unweighted mean of rho_any across the three primes in each
        bit stratum. No population-of-primes inference is allowed.
    confidence_intervals:
      pointwise: two-sided exact Clopper-Pearson 95% for each primary binomial proportion
      simultaneous: >-
        Bonferroni simultaneous 95% family coverage over the nine primary
        rho_any(p) intervals: use two-sided alpha=0.05/9, with alpha/2 in each
        beta tail. Secondary intervals are descriptive and labeled unadjusted.
      numerical_algorithm: >-
        Evaluate beta-distribution quantiles by monotone bisection in
        Sage RealBallField(256), starting from [0,1], until interval width is
        below 2^-200. Emit lower endpoints rounded downward and upper endpoints
        rounded upward to 15 decimal places. For x=0 set the lower endpoint to
        0; for x=n set the upper endpoint to 1.
      zero_count_rule: >-
        Report the exact Clopper-Pearson upper endpoint; never write exact zero
        as a population density.
    multiplicity: >-
      The nine primary per-prime estimands form one family. No hypothesis test is
      performed. Emitting exploratory detector-family p-values is forbidden.
    freeze_order: >-
      Write density-freeze.json with selected primes, witnesses, sample hashes,
      counts, estimands, and intervals, fsync it, and record its SHA256 before
      drawing any unplanted path-search instance. A path-search timestamp not
      strictly later than the freeze timestamp invalidates the run.

  unplanted_measurement_cells:
    selection: >-
      For each bit stratum and each seed in unplanted_instances, use the selected
      prime whose rank equals the seed rank. From that prime's frozen sampled
      classes choose the first seven detector-negative classes in ascending
      SHA256(seed||be(j)) order. This yields exactly 63 cells (3 bits x 3 primes
      x 7); a shortfall invalidates measurement admission.
    path_search: >-
      Apply the v3 pure 2-isogeny BFS and cost ledger with this overlay. Report
      all censorship. No mixed-prime or MITM branch is allowed.
    inference_limit: >-
      HEUR-ISO-1 may be evaluated only if its frozen n>=20 uncensored rule is
      met. Otherwise status=unmeasured; RATE and density results may not be used
      as a substitute.

  repair_6_sources_and_pre_run_snapshot:
    declared_implementation_sources:
      - experiments/EXP-IT-001/implementation/rc36/run_rc36_repair_2.py
      - experiments/EXP-IT-001/implementation/rc36/fixture.py
      - experiments/EXP-IT-001/implementation/rc36/density.py
      - experiments/EXP-IT-001/implementation/rc36/controls.py
    import_rule: >-
      The driver may import only Python/Sage standard modules and the three
      sibling modules declared above. Importing any repository source file not
      in this list is a pre-run snapshot failure. Generated code is forbidden.
    pre_run_snapshot_required_paths:
      - experiments/EXP-IT-001/specification.v3.yaml
      - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc27-b5-b8.yaml
      - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc30-repair-1-to-7.yaml
      - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/control-matrix.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/artifact-and-cost-plan.yaml
      - experiments/EXP-IT-001/implementation/rc36/run_rc36_repair_2.py
      - experiments/EXP-IT-001/implementation/rc36/fixture.py
      - experiments/EXP-IT-001/implementation/rc36/density.py
      - experiments/EXP-IT-001/implementation/rc36/controls.py
      - experiments/EXP-IT-001/implementation/rc36/pre-run-contract-manifest.json
    snapshot_gate: >-
      Before the future command, a Coordinator-only snapshot task must commit
      exactly all required paths plus its receipt. pre-run-contract-manifest.json
      must list SHA256, byte count, and git blob id for every required path and
      the exact command. The post-commit verifier must establish reachability,
      parent, changed-path equality, and every hash. Dirty or missing source,
      undeclared imports, or a hash mismatch forbids execution.

  metrics:
    primary:
      - anomalous_trace_and_detector_pass
      - anomalous_d_recovered
      - genuine_pullback_certificate_pass
      - endpoint_detector_negative
      - live_synthetic_claim_rejected
      - null_plant_detected_from_raw_ledgers
      - rho_any_by_selected_prime
      - R_xfer_by_unplanted_cell
    secondary:
      - H_min_and_censoring
      - rho_anomalous_and_rho_MOV
      - Clopper_Pearson_pointwise_and_simultaneous_intervals
      - C_search_C_eval_C_special_C_pullback
      - per_attempt_cost_p_success_expected_cost
      - algorithmic_peak_bytes_and_process_peak_rss_bytes
      - edge_queries_and_curve_samples
      - dominated_by_and_sota_delta

  cost_accounting:
    deterministic_ratio: >-
      R_xfer=(C_search+C_eval+C_special+C_pullback)/matched_rho.
    expected_total: >-
      C_expected=C_special_set_construction_amortized+
      per_attempt_cost/p_success+C_special+C_pullback. p_success is the frozen
      F_hit(hops_max;rho_any,d=3). If p_success=0, C_expected=+infinity and no
      expected-cost win may be claimed.
    memory: >-
      Report maximum BFS queue bytes, visited-map bytes, certificate bytes,
      density-sample bytes, total algorithmic peak bytes, and process peak RSS.
      Pollard rho comparator state is fixed at 3 compressed points plus 16
      machine words; report byte assumptions explicitly.
    data_or_query: >-
      Report point-count queries, detector queries, directed neighbor-edge
      queries, isogeny-map evaluations, and sampled curve classes. No query may
      be hidden inside a modeled time field.

  controls_and_predictions:
    - id: CTRL-ANOMALOUS-TRACE1-POS
      prediction: actual trace=1, detector true, d recovered, multiplier-1 R_control<0.7
    - id: CTRL-ISOGENY-PULLBACK-NONSPECIAL-POS
      prediction: all detector booleans false and every phi/dual_phi certificate check true
    - id: CTRL-NULL-GATE-LIVE-SYNTHETIC
      prediction: synthetic sub-0.7 certificate-bearing claim is rejected
    - id: CTRL-NULL-IT-PLANT
      prediction: nonempty raw ledgers independently expose the 4x undercharge
    - id: CTRL-MATCHED-RHO-HONEST
      prediction: >-
        Run one complete negation-map Pollard-rho solve on the first 20-bit
        unplanted cell; certificate passes and measured_ops/matched_rho is in
        [0.70,1.30]. A timeout is infrastructure, not an out-of-band pass.
    - id: CTRL-MATCHED-BSGS
      prediction: wrapper-reverified solve and exact operation/memory ledger
    - id: CTRL-EXIT-MAP-CONSISTENCY
      prediction: self-maps are excluded from transfer paths
    - id: DENSITY-SELECTION-WITNESS
      prediction: nine selected primes each persist an exact actual trace-1 class

  budgets:
    authoring_task:
      wall_clock_seconds: 3600
      memory_gb: 4
      maximum_runs: 1
      experiment_runs: 0
    future_reserved_run:
      wall_clock_seconds: 7200
      cpu_hours: 8
      memory_gb: 16
      disk_mib: 768
      maximum_runs: 1
      maximum_point_count_queries: 3000000
      maximum_neighbor_edge_queries: 2000000

  stopping_rules:
    - >-
      Before path search, stop invalid if any fixture, density cell, freeze hash,
      source snapshot, or required positive control fails.
    - >-
      Stop invalid immediately if the live synthetic claim is accepted or the
      null arm is skipped; retain all artifacts written before stopping.
    - >-
      Stop each BFS at v3 hops_max or 200000 directed edge queries, whichever
      comes first; report censorship and the exact stop reason.
    - >-
      Stop the run at any resource budget. Mark failed_infrastructure, not a
      hypothesis result, and preserve partial stdout/stderr/raw ledgers.
    - No adaptive sample-size increase, prime replacement, seed replacement, or rerun is permitted.

  invalidation_and_falsification:
    harness_invalidation:
      - MOV formula differs from the kept frozen formula
      - anomalous fixture is not exact trace 1
      - transfer endpoint is special, equal-j, or lacks evaluated phi/dual_phi checks
      - synthetic sub-0.7 claim is not rejected by the live null gate
      - either CTRL-NULL-IT-PLANT raw ledger is empty or not independently recomputable
      - density freeze occurs after any path sample
      - a required Pareto field is null or absent
      - source snapshot or import audit fails
    scientific_falsification:
      F1: >-
        Preserve v3 F1: at least two unplanted R_xfer<0.7 cells with verified
        certificates and passing real null gates. The synthetic control never
        counts toward F1.
      F2: any required positive control fails; harness void, not evidence against H-IT-001
      F3: preserve the exact v3 HEUR-ISO-1 trigger, only when its sample preconditions hold
    success: >-
      Design execution is admissible only if every required control has its
      pre-registered outcome, all 63 cells complete or are honestly censored,
      all density intervals and Pareto rows are present, and no invalidation
      fires. Admissible does not mean H-IT-001 supported.

