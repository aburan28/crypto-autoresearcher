    - objection: B-2
      source: RT-20260731-105
      severity: BLOCKING
      change: >-
        Pinned detector predicates: anomalous iff #E(F_p)==p; embedding
        degree threshold_k_max=6 with N|(p^k-1); Weil-descent friendly iff
        extension degree n in {2,3,4} with non-descent of N to proper
        subfields (false for default prime-field sampler). Pinned density
        universe U_IT_ORDINARY_PRIME_ORDER with exhaustive j-scan at 20/24
        bits and 50000-sample estimator at 28 bits under seed_density
        2026073199; rho_special freeze artifact schema required.
    - objection: B-3
      source: RT-20260731-105
      severity: BLOCKING
      change: >-
        Froze cost_ledger: ell_max = composite path-degree cap floor(N^{1/2})
        with separate hops_max for HEUR; C_path=C_search+C_eval with BFS/MITM
        edge charges and c_iso(ell)=4*ell; C_special per family (anomalous /
        MOV / WD closed formulas); C_pullback; R_xfer identity vs matched_rho;
        censorship lower bound; keep ±10x on C_eval only. Resolves H-IT-001
        degree-budget wording for EXP adjudication without editing H-IT-001.
    - objection: B-4
      source: RT-20260731-105
      severity: BLOCKING
      change: >-
        Froze NULL-IT-ISOGENY-TRANSFER null object (IDEA-20260731-011): PR
