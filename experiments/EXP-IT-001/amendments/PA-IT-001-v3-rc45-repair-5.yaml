protocol_amendment:
  id: PA-IT-001-v3-rc45-repair-5
  experiment_id: EXP-IT-001
  hypothesis_id: H-IT-001
  goal_id: GOAL-ECDLP-001
  batch: BATCH-045
  review_cycle_id: RC-45
  authoring_task: TASK-20260803-011
  snapshot_task: TASK-20260803-012
  review_task: TASK-20260803-013
  amendment_type: repair_overlay
  from_version: 3
  to_version: 3
  claim_tier: toy
  supersedes_overlay: PA-IT-001-v3-rc44-repair-4
  closes_review: RT-20260803-005
  dominated_by: >-
    Pollard rho at exponent 1/2 (matched negation) remains the generic baseline
    for ordinary prime-order subgroups; this overlay does not claim a sub-rho
    exponent.
  sota_delta:
    time_exponent_delta: not_applicable
    memory_exponent_delta: not_applicable
    data_or_query_exponent_delta: not_applicable
    non_solver_scope: >-
      Design-only repair overlay; no algorithm, implementation, or experiment is
      executed under TASK-20260803-011. Quantitative ECDLP cost deltas are
      therefore not_applicable until a later Executor batch produces matched-rho
      measurements under this frozen contract.
    vs_prior_overlay: >-
      Supersedes PA-IT-001-v3-rc44-repair-4 by (Y1) quoting acceptance scalars so
      yaml.safe_load succeeds; (M2) shipping a present
      recompute_null_plant_from_ledger.py in the proposal snapshot while keeping
      it listed in implementation_archive_manifest; preserving RC-44 B1–B3 and
      RC-43 command/certificate/null/comparator/Pareto closures.

  mechanism: >-
    Isogeny-transfer ECDLP reduction on ordinary toy curves: search a low-degree
    isogeny graph for a path to a special end (anomalous Smart trace-1, or
    low-embedding MOV for comparator only), then pull the discrete log back.
    RC-45 freezes a Smart-scale anomalous pass threshold that is mathematically
    compatible with matched rho at a pinned plant bit, restores the preregistered
    density abscissa, and preserves non-special transfer certificates.

  predictions:
    - >-
      At the pinned anomalous plant (bits=20), CTRL-ANOMALOUS-TRACE1 achieves
      R_xfer < 0.7 when C_special_smart=ceil(8*log2(p)) is the sole anomalous
      pass threshold and C_path+C_pullback stay within the frozen headroom budget.
    - >-
      Using specification.v3.yaml's quadratic anomalous charge
      20*(log2 N)^2, or any field-DLP/MOV formula, as the anomalous pass
      threshold is contract_invalid under RC-45.
    - >-
      CTRL-TRANSFER-NONSPECIAL recovers a planted non-special path with start and
      end nonspecial, reverse-of-planted-walk, pullback_evaluated, and
      relation_reverified.
    - >-
      CTRL-NULL-PACKAGING-GATE rejects the pre-registered synthetic R_xfer < 0.7
      claim; CTRL-NULL-IT-PLANT recomputes from the raw edge ledger via the
      archived recompute script.
    - >-
      Density fractions at bits {20,24,28} are reported with Wilson 95% CI
      (Bonferroni×3).

  test_boundary: >-
    Toy claim tier only; density bits in {20,24,28}; anomalous positive control
    evaluated only at pinned plant bits=20; ordinary prime-field curves; no
    crypto-scale; no H-IT-001 status change in this overlay authoring task.

  cost_model:
    matched_rho: >-
      FROZEN RESTATEMENT (no Executor discretion). matched_rho =
      ceil(0.886 * sqrt(N_star)) group-op equivalents, where N_star is the
      target prime-order subgroup order. For the anomalous plant with detector
      #E(F_p)=p (so N_star=p and log2(p)=bits), this equals
      ceil(0.886 * 2^(bits/2)). This restatement binds the same formula as
      specification.v3.yaml experiment.inputs.cost_ledger.matched_rho; reports
      must record matched_rho_formula_id: ceil_0_886_sqrt_Nstar.
    anomalous_plant_bits: 20
    anomalous_plant_bits_note: >-
      CTRL-ANOMALOUS-TRACE1 is evaluated ONLY at bits=20 (pinned). Density-scan
      cells at 24 and 28 do not substitute for the anomalous positive control.
    C_special_smart: >-
      Anomalous positive-control pass threshold ONLY. For a verified Smart
      trace-1 plant at bits=anomalous_plant_bits, charge
      C_special = ceil(c_smart * log2(p)) with c_smart=8 (disclosed). At the
      pinned plant this yields C_special_smart/matched_rho ≈ 0.176, leaving
      headroom so that C_path + C_pullback ≤ floor(0.45 * matched_rho) still
      forces R_xfer < 0.7. Justification: Smart's p-adic attack at toy scale is
      O(log p) field operations; c_smart=8 is an explicit upper-bound conversion
      into group-op equivalents (not a claim that 8 log2(p) is information-
      theoretic minimal). Must NOT use ceil(2*sqrt(N*)), MOV formulas, or
      specification.v3.yaml's quadratic 20*(log2 N)^2 as the anomalous pass
      threshold.
    C_special_smart_supersession: >-
      EXPLICIT SUPERSESSION: under RC-45, C_special_smart as defined above
      SUPERSEDES specification.v3.yaml
      experiment.inputs.cost_ledger.C_special.anomalous_trace_eq_1
      (20*(log2 N)^2) for all CTRL-ANOMALOUS-TRACE1 and anomalous pass-threshold
      accounting. Using the quadratic form (or any non-superseded formula) as
      the anomalous pass threshold is contract_invalid.
    C_special_field_DLP: >-
      MOV / embedding comparator column ONLY. For embedding degree k>=1 with
      N*|p^k-1, charge ceil(2*sqrt(N*)) when k=1 and ceil(0.886*sqrt(p**k)) when
      k>=2 as a labeled comparator that is NEVER the anomalous or transfer pass
      threshold.
    anomalous_curve_requirement: >-
      CTRL-ANOMALOUS-TRACE1 at bits=20: plant endpoint MUST satisfy #E(F_p)
      divisible by a large prime N with trace t = p+1-#E ≡ 1 (mod N) in the
      Smart sense, verified by anomalous_trace1_certificate.json with
      verified:true. Embedding degree k=1 alone is NOT sufficient and is an
      invalidation if used as the anomalous plant.
    limb_binding: >-
      SINGLE BRANCH — anomalous pass threshold is C_special_smart only;
      transfer-gate reports must record c_special_formula_id: C_special_smart
      for CTRL-ANOMALOUS-TRACE1 and may record C_special_field_DLP only in
      comparator columns.
    forbidden_as_anomalous_pass_threshold:
      - ceil(2*sqrt(N*))
      - ceil(0.886*sqrt(p**k))
      - 20*(log2(N))**2
      - any undeclared Executor-chosen constant replacing c_smart

  c_special_mov_decision: REPLACED_AS_ANOMALOUS_THRESHOLD
  c_special_mov_decision_note: >-
    The old ceil(0.886*sqrt(p^k)) formula is forbidden as an anomalous or
    transfer pass threshold. It MAY appear as a labeled MOV comparator column
    for k>=2 under C_special_field_DLP. Anomalous accounting uses
    C_special_smart only.

  density_protocol:
    bits: [20, 24, 28]
    bits_note: >-
      EXPLICIT RESTORE/SUPERSESSION: density abscissa is the frozen
      specification.v3.yaml density_universe {20,24,28}. This supersedes any
      prior overlay (including rc36/rc43) that used {16,18,20,22,24}. No added
      low-bit cells; bit 28 is restored.
    n_curves_per_bits: 5
    ci: Wilson_95
    multiplicity_method: bonferroni_3
    rho_special_freeze: >-
      HEUR-ISO-1 requires rho_special and F_hit frozen for bits in {20,24,28}
      before path search (spec density_freeze). Editing this abscissa without a
      new amendment is a protocol violation.

  repairs:
    - id: R5-FIX-PRESERVE-B1
      title: Recalibrate C_special_smart so R_xfer<0.7 holds at pinned plant
      closes_defect: RT-314-B1
      requirement: >-
        Use C_special_smart=ceil(8*log2(p)) at anomalous_plant_bits=20. Structural
        check: C_special_smart < 0.7*matched_rho at that cell (ratio ≈0.176).
        Headroom budget C_path+C_pullback ≤ floor(0.45*matched_rho) is mandatory
        for completed_valid on the anomalous arm.
      acceptance_criteria:
        - c_smart equals 8 with no Executor override
        - At bits=20, C_special_smart/matched_rho < 0.7 on the constant alone
        - transfer_gate_report.json records c_special_formula_id: C_special_smart
        - anomalous_trace1_certificate.json verifies with verified:true

    - id: R5-FIX-PRESERVE-B2
      title: Pin plant bit; restate matched_rho; supersede quadratic Smart form
      closes_defect: RT-314-B2
      requirement: >-
        anomalous_plant_bits=20 is frozen. matched_rho restated as
        ceil(0.886*sqrt(N_star)). C_special_smart_supersession clause governs
        over spec v3's 20*(log2 N)^2 for anomalous pass-threshold accounting.
      acceptance_criteria:
        - anomalous_plant_bits: 20 recorded in transfer_gate_report.json
        - matched_rho_formula_id: ceil_0_886_sqrt_Nstar recorded
        - Using 20*(log2 N)^2 as anomalous pass threshold => contract_invalid

    - id: R5-FIX-PRESERVE-B3
      title: Restore density abscissa to {20,24,28}
      closes_defect: RT-314-B3
      requirement: >-
        Density scan bits exactly {20,24,28}; Bonferroni×3; Wilson 95% CI;
        rho_special/F_hit freeze before path search. No {16,18,22} cells.
      acceptance_criteria:
        - density_scan_report.json bits equal [20,24,28]
        - multiplicity_method: bonferroni_3
        - HEUR freeze covers {20,24,28} before path search

    - id: R5-FIX-PRESERVE-CMD
      title: Preserve single binding Executor command (RC-43 B3)
      closes_defect: RT-244-B3
      requirement: Exactly one entrypoint and the frozen command strings below.
      acceptance_criteria:
        - future_executor_commands.binding_entrypoint is the sole authorized binary
        - No note permitting Executor CLI adjustment exists

    - id: R5-FIX-PRESERVE-M1
      title: Preserve start-j nonspecial and walk reversal
      closes_defect: RT-244-M1
      requirement: >-
        CTRL-TRANSFER-NONSPECIAL requires start_j_speciality:nonspecial,
        end_j_speciality:nonspecial, path_is_reverse_of_planted:true,
        pullback_evaluated:true, relation_reverified:true.
      acceptance_criteria:
        - 'start_j_speciality: nonspecial'
        - 'end_j_speciality: nonspecial'
        - 'path_is_reverse_of_planted: true'
        - 'pullback_evaluated: true and relation_reverified: true'

    - id: R5-FIX-Y1
      title: Quote acceptance scalars for yaml.safe_load
      closes_defect: RT-044-Y1
      requirement: >-
        The frozen amendment MUST load under yaml.safe_load with no ScannerError.
        Acceptance criteria that embed colon-bearing prose are quoted strings.
      acceptance_criteria:
        - "yaml.safe_load(amendment_path) succeeds"
        - "R5-FIX-PRESERVE-M1 acceptance criteria are quoted strings"

    - id: R5-FIX-M2
      title: Ship present null recompute script in proposal snapshot
      closes_defect: RT-044-M2
      requirement: >-
        implementation_archive_manifest MUST include
        experiments/EXP-IT-001/implementation/recompute_null_plant_from_ledger.py
        AND that path MUST exist as a blob in the TASK-20260803-012 proposal
        snapshot. Missing script => contract_invalid / not completed_valid.
      acceptance_criteria:
        - recompute_null_plant_from_ledger.py listed in implementation_archive_manifest
        - recompute_null_plant_from_ledger.py present at proposal snapshot
        - Missing script => contract_invalid / not completed_valid

    - id: R5-FIX-PRESERVE-M3
      title: Preserve comparator wording vs anomalous ban
      closes_defect: RT-244-M3
      requirement: >-
        Ban ceil(0.886*sqrt(p^k)) only as anomalous/transfer pass threshold;
        allow labeled comparator under C_special_field_DLP for k>=2.
      acceptance_criteria:
        - c_special_mov_decision_note matches this wording

    - id: R5-FIX-PRESERVE-NULL
      title: Preserve live null packaging gate + raw ledger
      closes_defect: BATCH-036 capsule item 3
      requirement: >-
        CTRL-NULL-PACKAGING-GATE rejects synthetic R_xfer < 0.7; persist
        ctrl_null_it_plant_edge_ledger.jsonl.
      acceptance_criteria:
        - null_packaging_gate_rejected_synthetic:true
        - ctrl_null_it_plant_edge_ledger.jsonl non-empty when edges_expanded > 0

    - id: R5-FIX-PRESERVE-PARETO
      title: Preserve quantitative Pareto axes
      closes_defect: RT-244-B2
      requirement: >-
        Every run deliverable includes dominated_by and three sota_delta axes
        as numeric or not_applicable with explicit non_solver_scope.
      acceptance_criteria:
        - All listed reports contain dominated_by and the three sota_delta axes

  implementation_archive_manifest:
    - experiments/EXP-IT-001/specification.v3.yaml
    - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc45-repair-5.yaml
    - experiments/EXP-IT-001/implementation/run_bounded_toy.py
    - experiments/EXP-IT-001/implementation/it001_driver.py
    - experiments/EXP-IT-001/implementation/it001_lib.py
    - experiments/EXP-IT-001/implementation/it001_pure.py
    - experiments/EXP-IT-001/implementation/it001_density_worker.py
    - experiments/EXP-IT-001/implementation/recompute_null_plant_from_ledger.py
    - experiments/EXP-IT-001/implementation/implementation.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-045/tasks/TASK-20260803-011/control-matrix.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-045/tasks/TASK-20260803-011/artifact-and-cost-plan.yaml

  future_executor_commands:
    binding_entrypoint: experiments/EXP-IT-001/implementation/run_bounded_toy.py
    smoke: >-
      sage experiments/EXP-IT-001/implementation/run_bounded_toy.py
      --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc45-repair-5.yaml
      --run-id RUN-IT-001-rc45-smoke --mode smoke --seed 2026080304
    measure: >-
      sage experiments/EXP-IT-001/implementation/run_bounded_toy.py
      --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc45-repair-5.yaml
      --run-id RUN-IT-001-rc45-measure --mode measure --seeds 2026080304,2026080305,2026080306
    note: >-
      Commands are planned only. TASK-20260803-011 does not execute them. A
      future Executor batch MUST invoke exactly these strings. Any other
      entrypoint or CLI flag change is contract_invalid.

  reserved_run_ids:
    - RUN-IT-001-rc45-smoke
    - RUN-IT-001-rc45-measure

  metrics:
    - R_xfer with c_special_formula_id: C_special_smart for anomalous arm at bits=20
    - matched_rho_formula_id: ceil_0_886_sqrt_Nstar
    - planted_path_recovered / start_j_speciality / end_j_speciality / path_is_reverse_of_planted / pullback_evaluated / relation_reverified
    - null_packaging_gate_rejected_synthetic
    - density success fraction per bits in {20,24,28} with Wilson 95% CI

  seeds:
    smoke: 2026080304
    measure: [2026080304, 2026080305, 2026080306]

  budgets:
    wall_clock_seconds_smoke: 600
    wall_clock_seconds_measure: 3600
    memory_gb: 4
    maximum_runs: 4

  stopping_rules:
    - Stop after reserved run IDs complete or budget exhausts
    - Invalidation on any R5-FIX acceptance failure

  falsification:
    - Anomalous arm uses non-C_special_smart formula as pass threshold
    - anomalous_plant_bits ≠ 20 for CTRL-ANOMALOUS-TRACE1
    - Density abscissa ≠ {20,24,28}
    - Executor invokes non-binding entrypoint or altered flags
    - C_special_smart/matched_rho ≥ 0.7 at bits=20 on the constant alone

  unexpected_observation_policy: >-
    Record under unexpected/ without silently discarding; do not change success
    criteria post hoc. Infra failures are not mathematical negatives.

  official_status_effects:
    goal: unchanged_active
    hypothesis: unchanged_specified
    implementation_authorized: false
    experiment_runs_authorized: 0

  no_run_authorized_at_open: true
  no_executor_authorized_at_open: true
