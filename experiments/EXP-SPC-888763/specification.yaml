experiment:
  id: EXP-SPC-888763
  hypothesis_id: H-SPC-5a6007
  version: 1
  title: >-
    Spacing statistics of the supersingular ell-isogeny operator against BOTH
    nulls, with a random-regular-graph resolution control and an exact
    Frobenius-sector fixed-point check
  status: review_required
  objective: >-
    Establish the arithmetic (Hecke-eigenvalue) null from primary text; build the
    ell-isogeny graph at a prime ladder with two independent vertex-set
    constructions; verify the Eisenstein eigenvalue and the Frobenius-sector
    fixed-point identity exactly; demonstrate on a random regular graph of
    matched size that the two nulls are DISTINGUISHABLE at these sizes; then
    report level-spacing statistics against BOTH the arithmetic null and GOE in
    one table, and measure eigenvector localisation against the delocalised
    prediction.
  experiment_class: measurement
  inputs:
    prime_ladder: >-
      At least 8 primes spanning a factor 100 in p, up to roughly 10^4, frozen
      into primes.json with the class number and graph size per prime.
    ell_values: two small primes, named in every reported statistic
    arithmetic_null: >-
      The Hecke-eigenvalue distribution at level p and weight 2, with the
      Ramanujan bound |a_ell| <= 2 sqrt(ell). Obtained from primary text at Stage
      0 and written into a knowledge entry. NOT quotable from memory: everything
      downstream is a comparison against it.
    goe_null: >-
      The GOE spacing prediction, computed explicitly and run DELIBERATELY. It is
      included not because it is expected to fit but because reporting both
      comparisons is what demonstrates the artifact rather than asserting it.
    random_regular_graphs: >-
      Random (ell+1)-regular graphs on the same number of vertices, which should
      match GOE and NOT the arithmetic null.
  controls:
    - id: C1_eisenstein_exactness
      description: >-
        The largest eigenvalue must equal ell+1 exactly, with a constant
        eigenvector, at every p and ell. Integer and exact-rational comparison.
        BLOCKING: a pipeline missing this is not computing the adjacency
        spectrum.
    - id: C2_vertex_set_agreement
      description: >-
        Two independent constructions of the supersingular vertex set must agree
        exactly, and the count must match the classical mass formula. BLOCKING.
    - id: C3_frobenius_sector_identity
      description: >-
        Decompose the operator into its +1 and -1 sectors under Frobenius
        conjugation and check the multiplicity difference against the
        independently computed size of the F_p-rational subset (a class number).
        EXACT INTEGER AGREEMENT REQUIRED. BLOCKING: this is the check that the
        spectral pipeline measures the graph rather than its own indexing.
    - id: C4_resolution_control
      description: >-
        Random (ell+1)-regular graphs of matched size, which must match GOE and
        not the arithmetic null. BLOCKING AND DECISIVE: without it, a claim that
        the arithmetic null fits better is unsupported, because the two nulls
        might be indistinguishable at graph sizes in the hundreds. This is the
        control that makes the whole of the spacing comparison interpretable.
    - id: C5_both_nulls_reported
      description: >-
        Every spacing result is reported against BOTH nulls in the same table.
        Reporting only the GOE comparison would produce the artifact this
        experiment exists to prevent; reporting only the arithmetic comparison
        would hide the demonstration.
  independent_variables:
    - prime p (>= 8 values spanning a factor 100)
    - ell (2 values)
    - graph class (isogeny graph, random regular graph of matched size)
  metrics:
    primary:
      - >-
        spacing_fit: goodness of fit of the level-spacing distribution to the
        arithmetic null and to GOE, per (p, ell), reported side by side, with the
        same statistics computed for the random-regular-graph control.
      - >-
        sector_multiplicity_difference versus the independently computed
        F_p-rational subset size. Exact integer agreement required.
      - >-
        max_inverse_participation_ratio over eigenvectors, against the
        delocalised prediction for a random vector of the same dimension.
    secondary:
      - full eigenvalue multiset per (p, ell), with sector labels
      - vertex count versus the mass formula
      - largest eigenvalue versus ell+1
      - graph size, wall-clock, peak memory, and the largest p reached
  measured_vs_modeled:
    measured:
      - eigenvalue multisets, spacing statistics, sector multiplicities, IPRs
      - the random-regular-graph control statistics
    modeled:
      - the arithmetic (Hecke-eigenvalue) null, from Stage-0 primary text
      - the GOE spacing prediction
      - the Ramanujan bound |a_ell| <= 2 sqrt(ell)
      - the fixed-point identity relating sector multiplicities to the F_p locus
    rule: >-
      Measured and modeled never share a column. Both nulls appear as modeled
      curves; every graph appears as measured points.
  optimistic_assumptions:
    - >-
      Full spectrum computation caps p at about 10^4, so graphs have under a
      thousand vertices. BIAS: spacing statistics are noisy at that size.
      Direction: makes it HARDER to distinguish the nulls, so a successful
      distinction is conservative -- but a failure to distinguish is
      uninformative rather than evidence, which is why C4 is blocking.
    - >-
      Two values of ell only. BIAS: the ell-dependence of any conclusion is
      weakly constrained.
    - >-
      The arithmetic null is instantiated from the Stage-0 statement rather than
      re-derived. BIAS: the comparison is only as good as that statement.
  optimistic_assumption_rule: >-
    Every spacing conclusion is reported together with the random-regular-graph
    control's separation, so a reader can see whether the instrument had the
    resolution to support it. The list above is reproduced in the results report
    with the direction of each bias.
  heuristic_under_test: HEUR-SPC-1
  preregistered_prediction:
    quantity: >-
      Relative goodness of fit of the measured level-spacing distribution to the
      arithmetic (Hecke-eigenvalue) null versus to the GOE null, for the isogeny
      graph and for the matched random regular graph.
    formula: >-
      For the isogeny graph: arithmetic null fits better than GOE. For the random
      regular graph: GOE fits better than the arithmetic null. The gap in each
      case exceeds the finite-size fluctuation scale measured on the control.
    source: >-
      HEUR-SPC-1 in H-SPC-5a6007, resting on the Ramanujan bound as a hard
      constraint no Wigner ensemble satisfies. Frozen before execution; a
      revision is a protocol_amendment.
  scale_relevance:
    tier: toy
    justification: >-
      p up to about 10^4 gives graphs of under a thousand vertices, where a full
      spectrum is computable but finite-size effects on spacing statistics are
      large. The experiment therefore does NOT claim an asymptotic spacing law;
      it claims a finite-size discrimination between two explicit nulls, and it
      measures the fluctuation scale that makes that discrimination meaningful.
      The derived budget (0 bits eigenvalue-side, class-number cost
      eigenvector-side) is independent of scale and is the durable output.
      Resulting evidence is capped at claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      The extreme spacings, where the Ramanujan bound bites hardest and the two
      nulls differ most -- the region with the best discrimination and therefore
      the one where a failure to discriminate is most informative.
    - >-
      The largest observed |a_ell| against the Ramanujan bound 2 sqrt(ell). A
      violation is an instrument failure, not a finding, and halts the run.
    - >-
      The single most localised eigenvector across the whole ladder, reported by
      prime and sector, so a lone outlier is visible rather than averaged away.
  replication:
    seeds: [71, 73, 79]
    independent_instances: 3
    note: >-
      The isogeny-graph spectrum is deterministic given (p, ell); seeds vary the
      construction route and the random-regular-graph draws. Spectra must be
      identical across seeds for the isogeny graph; the control's spread across
      seeds IS the finite-size fluctuation scale used in C4, so its seeds are
      load-bearing where the isogeny arm's are not.
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 40
    maximum_memory_gb: 32
    maximum_runs: 300
  stopping_rules:
    - HALT at C1 if the Eisenstein eigenvalue is absent or wrong.
    - HALT at C3 if the sector identity fails.
    - >-
      HALT the spacing comparison at C4 if the random regular graph is not
      distinguishable from the isogeny graph: report the resolution limit and
      make no statement about which null fits.
    - >-
      Abandon a prime whose full spectrum exceeds the memory cap; record it as
      INFRASTRUCTURE-LIMITED, never as a spectral result.
    - Stop at the CPU-hour cap; report completed primes and name the rest.
  invalidation_rules:
    - Any BLOCKING control failing invalidates every downstream statistic.
    - >-
      A spacing result reported against only one null is invalid regardless of
      its content: C5 requires both.
    - >-
      A statistic reported without naming its ell is invalid, since the spectrum
      depends on it.
    - >-
      An eigenvalue-side result presented as vertex-level information is invalid;
      the budget derivation forbids it.
    - >-
      Crashes, timeouts and memory exhaustion are infrastructure outcomes under
      AGENTS.md rule 5.
  success_criterion: >-
    C1-C5 pass, and the experiment reports spacing fits against BOTH nulls for
    the isogeny graph and the matched control, the exact sector-multiplicity
    identity, and eigenvector localisation against the delocalised prediction. It
    succeeds by establishing which null is correct and by documenting the
    resolution at which that statement holds -- which is the reusable output,
    since it stops a future session from reporting a GOE deviation as a
    cryptanalytic signal.
  falsification_criterion: >-
    HEUR-SPC-1 is REFUTED if spacing statistics match GOE and not the arithmetic
    null -- meaning the recalled Brandt-Hecke picture is wrong or misapplied, a
    finding about the modular side. The budget's "no intermediate regime" claim
    is refuted by a localised eigenvector beyond the symmetry sectors reproduced
    at three primes, which is escalated immediately. C4 failing refutes nothing:
    it means the instrument has no resolution and no spacing statement may be
    made in either direction.
  required_artifacts:
    - the Stage-0 knowledge entry stating the arithmetic null and its citation
    - frozen primes.json with class numbers and graph sizes
    - per-run manifest with command, commit, environment, seed, resolved model
    - full eigenvalue multisets with sector labels, per (p, ell)
    - spacing-fit statistics against BOTH nulls, for isogeny and control graphs,
      in one table
    - sector multiplicity differences versus independently computed F_p-locus sizes
    - inverse participation ratios per eigenvector
    - control outcomes C1-C5 with pass/fail and measured values
    - >-
      the derived budget statement -- 0 bits eigenvalue-side, class-number cost
      eigenvector-side, and the named opening (a sublinear
      eigenvector-coordinate estimator)
  assigned_to: executor
  approved_by: null
  approval_note: >-
    Status is review_required. 40 CPU-hours. C4 is the control the whole
    experiment turns on: at graph sizes in the hundreds the two nulls may simply
    be indistinguishable, and if they are, the honest output is the resolution
    limit rather than a verdict.
