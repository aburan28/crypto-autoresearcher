experiment:
  id: EXP-PRECOMP-003
  status: proposed
  title: Parameterized-target Groebner specialization
  objective: >-
    Replace the target coordinate by a formal parameter t, precompute as much
    Groebner/F4 state as feasible over F_p(t) or an evaluation/interpolation
    representation, then specialize t=x(R) for unseen targets.
  fixtures:
    field_bits: [11, 13, 16, 20, 24]
    curve_seeds: [1, 2, 3]
    holdout_targets: 100
    decomposition_arities: [2, 3]
  variants:
    - rational_function_field_direct
    - evaluation_interpolation_if_supported
    - cold_target_specific_baseline
  metrics:
    primary: specialization_speedup
    required:
      - precompute_seconds
      - precompute_bytes
      - specialize_seconds
      - residual_solve_seconds
      - total_warm_seconds
      - cold_seconds
      - exceptional_specialization_rate
      - fallback_rate
      - verification_failures
  controls:
    - target-specific cold basis on matched targets
    - exact basis/solution validation after specialization
    - record denominators and every exceptional target where specialization is invalid
  success_criterion: >-
    Median total warm cost <=0.20 of cold solve cost after amortizing the
    parameterized object over 100 holdouts, with zero incorrect accepted solves.
  strong_signal: >-
    Median total warm cost <=0.05 of cold solve cost and cache size grows slower
    than the measured cold solver work over consecutive bit sizes.
  falsification_hook: >-
    Parameterized-state size or construction cost grows faster than cold work
    and no amortized crossover is observed within the declared holdout range.
  depends_on: [EXP-PRECOMP-001, EXP-PRECOMP-004]
