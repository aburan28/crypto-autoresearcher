experiment:
  id: EXP-ECDLP-797b5c
  hypothesis_id: H-ECDLP-326109
  version: 1
  title: >-
    Cut fraction of the post-merge relation hypergraph against a
    degree-matched configuration-model null, at three sizes and two problems,
    with a planted-separator positive control at three known defect sizes,
    two independent partitioners, and a hard input precondition on the
    matrices themselves
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Measure the k-way hypergraph connectivity cut fraction phi(k, M) of
    post-merge sparse matrices against a degree-matched null and across three
    matrix dimensions, to decide whether the communication term of a
    partitioned block Wiedemann shares the arithmetic term's exponent
    (explanation E, yielding a measured obstruction) or sits below it
    (explanation S, yielding a named building block). This contract is DRAFT
    and confers no execution authority.

  blocking_input_precondition: >-
    STATED FIRST BECAUSE THE WHOLE DESIGN DEPENDS ON IT AND IT MAY NOT HOLD.
    This experiment consumes post-merge matrices that it does not produce. It
    requires, in a sparse format with recorded sha256 and identical merge
    settings: three sizes (60, 80, 100 digits) for factoring AND three for
    discrete logarithm. IF FEWER THAN TWO SIZES EXIST FOR A PROBLEM, THE
    TREND CANNOT BE FITTED FOR THAT PROBLEM AND THE ARM IS NOT RUN. IF NONE
    EXIST, THE EXPERIMENT CANNOT RUN AT ALL, and that is an INFRASTRUCTURE
    outcome under AGENTS.md rule 5 - a blocked input, never a result about
    the hypergraph in either direction. The Executor must verify this
    precondition and report it BEFORE any partitioner is invoked, and must
    not substitute freshly generated matrices under different merge settings
    to make the trend fittable.

  preregistered_prediction:
    quantity: >-
      phi(k, M) = (k-way hypergraph CONNECTIVITY CUT, measured in PINS - the
      sum over columns of (parts touched minus one) - ) divided by (the
      number of nonzeros of the matrix); DIMENSIONLESS, in [0,1]. Reported
      real and null, per (problem, size, k), with and without dense columns.
      Secondary: the fitted slope of log phi against log M, dimensionless.
    formula: >-
      EXPLANATION (E): phi_real / phi_null within [0.85, 1.15] at every k
      after dense-column removal, AND the real trend slope within 0.05 of the
      null's, both near zero. Then total communication scales as phi times
      nonzeros times M with phi constant, so the communication exponent
      equals the arithmetic exponent.
      EXPLANATION (S): phi_real / phi_null at or below 0.7 at some k >= 8, OR
      the real slope at least 0.1 more negative than the null's. Then the
      communication exponent is reduced by the measured decay rate.
      BETWEEN: reported as WEAK STRUCTURE with the ablation that explains it;
      settles nothing.
      FORCED SEPARATELY: planted-separator recovery at least 0.8 for both
      partitioners at all three planted sizes; partitioner agreement within
      10 percent on every instance; the synthetic fixture reproduced within 2
      percent; k = 1 giving phi = 0 exactly.
    source: >-
      The cut identity for parallel sparse matrix-vector multiplication is
      exact and is the definition of the measured quantity. The
      constant-phi expectation under (E) is the hypergraph analogue of the
      almost-sure expansion of random regular graphs, which is RECALLED and
      opened by no agent in this program; it is the heuristic under test, not
      an established input.

  inputs:
    matrices: >-
      Post-merge relation-by-prime sparse matrices at 60, 80 and 100 digits,
      for factoring and for discrete logarithm, from ONE pipeline with
      IDENTICAL merge settings across sizes and problems, each with its
      sha256 recorded. Pre-merge matrices are used as an ablation WHERE THEY
      WERE KEPT; where they were not, the ablation is reported as
      unavailable rather than approximated.
    dense_threshold: "a column-weight threshold COMMITTED, with its value, before any partitioning"
    partitioners: "two named open hypergraph partitioners with their settings committed before any matrix is read"
    coarsening: "declared per instance where the largest matrix requires it; never applied silently"

  independent_variables:
    - "k in {2, 4, 8, 16, 32, 64}, plus k = 1 as the trivial baseline"
    - "matrix dimension M across the three sizes"
    - "problem: factoring versus discrete logarithm"
    - "instance class: real, configuration-model null, planted-separator, dense-stripped, special-prime-permuted, pre-merge"
    - "partitioner: A versus B"

  null_object:
    name: >-
      THE DEGREE-MATCHED CONFIGURATION-MODEL NULL - five replicates per
      matrix, the reference against which every phi is read. Blocking.
    construction: >-
      Rewire the column hypergraph by degree-preserving edge swaps,
      preserving BOTH the row degree sequence and the column degree sequence
      EXACTLY, with swaps REJECTED when they would create a multi-pin (a
      column appearing twice in a row) and the rejection count reported. The
      swap count is committed in advance (a declared multiple of the pin
      count) with a convergence check on phi across replicates. Five
      replicates per matrix, each partitioned by BOTH partitioners at every
      k, exactly as the real matrix is. The null shares every one-vertex
      statistic with the real matrix and destroys every correlation - the
      special-prime row clustering, the merge-induced fill - so a difference
      between real and null is attributable to those correlations and to
      nothing else.
    non_degeneracy_check: >-
      REQUIRED AND ANSWERED BY CONSTRUCTION, WITH THE ARM THAT ANSWERS IT
      NAMED. The question is whether phi_real CAN differ from phi_null; if it
      could not, a null-matched result would be forced and would teach
      nothing. IT CAN, AND THE PLANTED-SEPARATOR ARM DEMONSTRATES IT
      EMPIRICALLY RATHER THAN BY ARGUMENT: a matrix rewired to contain a
      separator of 1, 5 or 10 percent of pins has, by construction, a cut
      strictly below its own degree-matched null by the planted amount, and
      the partitioners must recover at least 0.8 of that reduction. So the
      band [0.85, 1.15] is not width-zero: instances exist, and are run in
      the same battery, whose true ratio sits far outside it. THE CONVERSE
      GUARD IS ALSO PRESENT: k = 1 gives phi = 0 in every arm, a forced
      identity that is checked and is explicitly NOT treated as a
      discriminating cell.
    dynamic_range_demonstration: >-
      THE PLANTED-SEPARATOR LADDER AT THREE KNOWN DEFECT SIZES, and it is the
      model this batch's other contracts follow. Construct, from the REAL
      matrix by rewiring, three variants containing a known separator of 1, 5
      and 10 percent of pins. FORCED: both partitioners recover at least 0.8
      of the planted cut reduction at each size, so phi falls below the null
      by an amount monotone in the planted size. This measures the
      instrument's sensitivity ACROSS A RANGE rather than at a single point,
      and the smallest rung - 1 percent - is deliberately near the resolution
      limit, so the limit is measured and not asserted. A partitioner that
      recovers the 10 percent separator but not the 1 percent one has a
      MEASURED floor, and no (E) may be claimed at a ratio deviation smaller
      than that floor. Recovery below 0.5 at any size means the instrument is
      BLIND and no negative may be read from it at all.
    curve_free_null: >-
      NOT APPLICABLE IN ITS USUAL FORM, AND THE REASON IS RECORDED RATHER
      THAN THE REQUIREMENT SKIPPED. The standing scope constraint exists to
      prevent a result being misread as a statement about elliptic curves
      when a non-curve object would reproduce the signature. THIS LANE
      CONTAINS NO ELLIPTIC CURVE AT ALL: the object is a sparse matrix from
      the number field sieve, and no curve, point, or elliptic discrete
      logarithm appears anywhere in the design. The analogous requirement
      here is the GENERICITY question - could a generic object with the same
      degree sequences reproduce phi? - and that question IS the
      configuration-model null, which is already the primary reference rather
      than an add-on.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE AND BINDING, IN TWO PARTS.
      (i) UNCONDITIONALLY: no outcome of this experiment is a statement about
      elliptic curves or the ECDLP, and no transfer to that problem is
      licensed. The run's report must carry this sentence.
      (ii) CONDITIONALLY ON THE NULL COMPARISON: if phi_real / phi_null lies
      within [0.85, 1.15] at every k after dense-column removal, then NOTHING
      MEASURED IS A PROPERTY OF THE NUMBER FIELD SIEVE, OF THE RELATION
      HYPERGRAPH, OR OF FACTORING. It is a property of a random hypergraph
      with those degree sequences, and the obstruction block must be written
      AT THAT LEVEL OF GENERALITY - "balanced k-way cuts of hypergraphs with
      these degree sequences are a constant fraction of pins" - rather than
      as a discovery about relation matrices. Only a MEASURED DEPARTURE from
      the null carries sieve-specific content, and the ablations exist to
      name which ingredient carries it.

  controls:
    - >-
      DEGREE-MATCHED CONFIGURATION-MODEL NULL, five replicates per matrix
      (blocking). See null_object.
    - >-
      PLANTED-SEPARATOR POSITIVE CONTROL at 1, 5 and 10 percent of pins
      (blocking). The instrument must see planted structure or NO NEGATIVE IS
      READ.
    - >-
      TWO PARTITIONERS, agreement within 10 percent required on both real and
      null instances (blocking). A disagreement above 10 percent means the
      measured quantity is the solver, not the hypergraph.
    - >-
      SYNTHETIC FIXTURE reproduced within 2 percent BEFORE any real matrix is
      read (blocking).
    - >-
      k = 1 TRIVIAL BASELINE: phi = 0 exactly in every arm. A forced
      identity, checked, and explicitly NOT a discriminating cell.
    - >-
      RANDOM BALANCED PARTITION UPPER BOUND: phi close to 1 - 1/k per
      pin-touching column, the value every partitioner must beat. Reported so
      that a partitioner failing to beat it is visible immediately.
    - >-
      DENSE-COLUMN ABLATION: every phi reported BOTH with and without columns
      above the committed threshold, and the dense block's share of the cut
      reported. If that share exceeds 0.5 the dense block dominates
      communication and the finding is a CONSTANT-FACTOR statement, labelled
      as one.
    - >-
      SPECIAL-PRIME ROW-PERMUTATION ABLATION: permute rows within
      special-prime groups, destroying that correlation while preserving
      degrees, and re-measure. Under (S) the ablation that returns phi to the
      null NAMES the ingredient.
    - >-
      PRE-MERGE ABLATION where the pre-merge matrix was kept; reported as
      unavailable where it was not, never approximated.
    - >-
      CROSS-PROBLEM CONTROL: the discrete-logarithm matrices from the same
      pipeline are a free control on the same graph type at different sizes.
      A classification disagreement between problems localises the structure
      to an unshared ingredient.
    - >-
      PRE-REGISTRATION of every threshold, grid, swap count, planted size and
      noise band, committed with a hash before any matrix is read.
    - >-
      PRIOR-WORK READ (blocking, first stage): the nearest prior partitioning
      case study must be OBTAINED AND READ, or the failure to obtain it
      recorded with its HTTP status, before the novelty of the null-matched
      scaling question is asserted anywhere in the report.

  metrics:
    primary:
      - "phi(k, M) real and null with intervals, per (problem, size, k), with and without dense columns; DIMENSIONLESS cut-in-pins divided by nonzeros, in [0,1]"
      - "phi_real_over_null per (problem, size, k); dimensionless ratio; the (E)/(S) rule is applied to this"
      - "phi_trend_in_M: fitted slope of log phi(16, M) against log M, real and null; dimensionless"
      - "planted_recovery: fraction of the planted cut reduction recovered, per partitioner per planted size; dimensionless in [0,1]; required at least 0.8"
      - "partitioner agreement: |phi_A - phi_B| / phi_A per instance; dimensionless; required at most 0.10"
    secondary:
      - "raw connectivity cut in PINS and the nonzero count per instance; INTEGER counts, so phi can be re-derived"
      - "dense_block_share: fraction of the full matrix's cut carried by columns above the committed threshold; dimensionless in [0,1]"
      - "ablation phi values with the ingredient each ablation removes named"
      - "configuration-model diagnostics: swap count, multi-pin rejection count, and phi convergence across replicates"
      - "dlp_agreement: classification (E or S) per problem per size; categorical"
      - "communication_exponent_estimate under the stated transfer heuristic; dimensionless exponent, labelled CONDITIONAL"
      - "matrix sha256, partition files, partitioner settings, seeds, rebuild receipt"
      - "wall-clock seconds and peak RSS in GiB per partitioning job"

  heuristic_under_test: HEUR-CUT-1

  scale_relevance:
    tier: toy
    justification: >-
      Matrices at 60, 80 and 100 digits from one implementation, up to a few
      million rows, partitioned on one workstation. RECORD-SCALE MATRICES ARE
      TWO ORDERS OF MAGNITUDE LARGER AND ARE NOT PARTITIONED HERE - and could
      not be, by this or any nearby design, because the partitioners
      themselves would not fit. THE EXPONENT CLAIM AT CRYPTOGRAPHIC SIZES
      THEREFORE CANNOT BE TESTED AT REACHABLE SCALE, and this contract does
      not shrink the claim to hide that: it measures THREE SIZES precisely so
      that the TREND rather than a point is what transfers, and it labels the
      transfer as conditional on an explicit heuristic every time it appears.
      A two-point trend, if only two sizes are available, is labelled as such
      and carries correspondingly less weight.
    correspondence: null

  tail_checks:
    - "The SMALLEST null phi over the five replicates against the real phi, so a real value inside the null's RANGE is read as null even if it sits below the null's mean."
    - "The largest k (64) at the smallest matrix, where balance constraints bite hardest and a partitioner is most likely to be far from optimal."
    - "The 1 percent planted separator, the smallest planted defect, reported individually with its recovery fraction, since it sets the instrument's measured floor."
    - "The worst partitioner-agreement instance across the whole battery, reported individually."
    - "The largest matrix if coarsening was applied, reported separately from the uncoarsened ones, since coarsening changes what the partitioner sees."

  replication:
    seeds: [1001, 1002, 1003, 1004, 1005]
    independent_instances: 6
  seeds_policy: >-
    Five declared seeds, fixed here before execution and never re-drawn after
    an outcome is seen. Seeds govern the configuration-model rewiring (one
    seed per null replicate), the planted-separator rewiring, and the
    special-prime row permutation; the partitioners' own internal randomness
    is seeded from the same list and RECORDED, because a heuristic
    partitioner is not deterministic and an unrecorded partitioner seed makes
    a phi value irreproducible. The real matrices carry no seed - they are
    fixed inputs identified by sha256. Five null replicates per (matrix, k,
    partitioner) give the null an empirical distribution rather than a point,
    which is what makes the TAIL CHECK against the smallest null replicate
    meaningful. A re-run under a new seed is a NEW replicate, never a
    replacement.

  budget:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 120
    maximum_memory_gb: 32
    maximum_runs: 12
    maximum_workers: 1
  budget_note: >-
    Sized to the work, which is dominated by partitioning rather than by the
    graph construction. Per problem and size there are: 1 real instance, 5
    null replicates, 3 planted variants and up to 3 ablations, each
    partitioned at 6 values of k by 2 partitioners - roughly 130 partitioning
    jobs per (problem, size), and up to about 800 across the battery.
    Multilevel partitioning of a few-million-row hypergraph is minutes to
    tens of minutes and holds the hypergraph plus the coarsening hierarchy in
    memory, which is why the memory figure is 32 GB rather than the schema
    floor. maximum_workers is 1 because the partitioners are not declared
    determinism-verified for parallel execution; a job exceeding the wall
    clock is recorded as not computable in budget and is an INFRASTRUCTURE
    stop, never evidence.

  stopping_rules:
    - "STEP 0, BLOCKING, before any matrix is read: commit the partitioners and their settings, the k grid, the dense threshold, the rewiring swap count, the planted-separator sizes and the noise bands, with a hash; compute and store the synthetic-fixture phi."
    - "STEP 0b, BLOCKING: verify the input precondition - which matrices actually exist, at which sizes, for which problems, with which merge settings and hashes - and report it. If fewer than two sizes exist for a problem, that problem's trend arm is NOT RUN."
    - "STEP 0c, BLOCKING: obtain and read the nearest prior partitioning case study, or record the failure with its HTTP status. No novelty assertion may be made without this."
    - "STEP 1: build the column hypergraphs and reproduce the synthetic fixture within 2 percent. A miss STOPS the run."
    - "STEP 2: planted-separator controls FIRST. If recovery is below 0.5 at any planted size for either partitioner, the instrument is blind, the run STOPS and reports an instrument failure; NO (E) may be declared."
    - "STEP 3: real and null instances at every k, both partitioners. STEP 4: ablations. STEP 5: fit the trend, classify per problem, and write the obstruction block under (E) or the building-block note under (S)."
    - "A partitioning job exceeding the declared wall clock or memory is recorded as not computable in budget and its cell is reported as missing rather than estimated."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Substituting freshly generated matrices under different merge settings to make a trend fittable. Merge parameters change the graph, and a trend measured across differing merge settings measures the merge."
    - "Comparing a real matrix against a null built with a different rewiring swap count, or against fewer than the declared five replicates."
    - "Declaring (E) at a ratio deviation smaller than the instrument's MEASURED floor from the planted-separator ladder."
    - "Reading the k = 1 cell, where phi = 0 by construction in every arm, as a discriminating comparison."
    - "Reporting phi without also reporting the raw cut in pins and the nonzero count, so the ratio cannot be re-derived."
    - "Applying coarsening without declaring it per instance."
    - "Presenting the communication-exponent estimate as unconditional, or presenting a null-matched result as a discovery about relation matrices rather than about hypergraphs with those degree sequences."
    - "Quoting any outcome as a statement about elliptic curves or the ECDLP."
    - "Any post-hoc change to the bands, thresholds, k grid or planted sizes. A change requires a versioned protocol_amendment before the affected instances are re-read."

  success_criterion: >-
    The run SUCCEEDS as a measurement, whichever explanation it supports,
    when: the input precondition is verified and reported; the prior-work
    read is attempted and its outcome recorded; the synthetic fixture
    reproduces within 2 percent; planted-separator recovery is at least 0.8
    for both partitioners at all three planted sizes; partitioner agreement
    is within 10 percent on every instance; phi is reported real and null
    with intervals at every (problem, size, k) both with and without dense
    columns, with the raw cut in pins and the nonzero count beside it; the
    trend is fitted for real and null; every declared ablation is run or
    reported unavailable; and the outcome is classified as (E), (S) or WEAK
    STRUCTURE per problem by the pre-registered rule.

  falsification_criterion: >-
    THE INSTRUMENT IS BLIND, and no negative may be read, if planted recovery
    is below 0.5 at any planted size or partitioner agreement exceeds 10
    percent on any instance. EXPLANATION (S) IS DECLARED - falsifying the
    closure, and welcome - if phi_real / phi_null is at or below 0.7 at some
    k >= 8 with planted recovery above 0.8, or if the real trend slope is at
    least 0.1 more negative than the null's. EXPLANATION (E) IS DECLARED, and
    the obstruction block written at the GENERALITY the null comparison
    licenses, if the ratio is within [0.85, 1.15] at every k after
    dense-column removal and the slopes match within 0.05 at all sizes and
    both problems. A CLASSIFICATION DISAGREEMENT between factoring and
    discrete logarithm at the same size localises the structure to an
    unshared ingredient and is reported rather than closed. A DENSE-BLOCK
    SHARE ABOVE 0.5 makes the finding a constant-factor statement and it must
    be labelled as one. ABSENCE OF THE INPUT MATRICES is an infrastructure
    outcome, never a result.

  required_artifacts:
    - "STEP 0 pre-registration file with its sha256: partitioners and settings, k grid, dense threshold, swap count, planted sizes, noise bands, and the stored synthetic-fixture phi."
    - "The input-precondition report: which matrices exist, sizes, problems, merge settings, sha256 each."
    - "The prior-work read receipt, or the failure record with URL and HTTP status."
    - "Per-instance records: problem, size M, nonzeros, k, partitioner, seed, raw connectivity cut in PINS, phi, with and without dense columns."
    - "The null tables: five replicates per matrix with swap counts, multi-pin rejection counts, and the phi convergence check."
    - "The planted-separator table: planted size, planted cut reduction, recovered reduction, recovery fraction, per partitioner."
    - "The ablation table with the ingredient each ablation removes, and unavailable ablations marked as such."
    - "The trend fits for real and null, with residuals and intervals, per problem."
    - "The obstruction block under (E) - statement about the OBJECT, quantity, measured value with units and error bars, the runs it is read from, the scope, and a resource_check - or the building-block note under (S) with its named ingredient."
    - "Partition files, matrix hashes, seeds and a rebuild receipt sufficient to recompute every phi."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, partitioner versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr, peak RSS, wall clock."
    - "A report carrying, verbatim, both parts of null_object.pre_declared_consequence."

  assigned_to: executor

  limitations:
    - >-
      NOTHING HERE IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP, in
      either direction, and no transfer to that problem is licensed by any
      outcome.
    - >-
      A measurement of a graph property of matrices produced by ONE
      implementation at 60-100 digits. No parallel implementation is built
      and no parallel run is timed.
    - >-
      (E) closes the partition and separator class FOR THE EXPONENT ONLY;
      constant-factor communication gains are untouched and expected.
    - >-
      THE CRYPTOGRAPHIC-SIZE FORM OF THE EXPONENT CLAIM CANNOT BE TESTED AT
      REACHABLE SCALE. Record-scale matrices are two orders of magnitude
      beyond what any design in this family can partition; the trend, not a
      point, is what transfers, and only under an explicit heuristic.
    - >-
      (E)'s strength is bounded by partitioner adequacy, which has NO
      rigorous half: balanced hypergraph partitioning is NP-hard and the
      solvers are heuristics. (E) cannot rule out structure a partitioner
      does not see.
    - >-
      A null-matched result is, by the pre-declared consequence, a statement
      about hypergraphs with those degree sequences and not about relation
      matrices.
    - >-
      The nearest prior work was not read by any agent in this program at
      design time; reading it is a blocking first-stage obligation and the
      novelty claim is unverified until then.
    - >-
      The experiment consumes matrices it does not produce, and cannot run
      without them.
