experiment:
  id: EXP-EWALK-4554d5
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-6355c6
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE FRUITLESS-CYCLE RATE IS NOT 1/(2r) WHEN |Aut| > 2, AND ITS DIRECTION DEPENDS ON A DESIGN
    CHOICE NOBODY HAS RECORDED: for an Aut-quotient walk on a j = 0 or j = 1728 curve the derived
    immediate-undo probability is 1/(|Aut| * r) with a GENERIC step table and 1/r with an Aut-STABLE
    step table -- a factor |Aut| apart in opposite directions -- so the same automorphism group that
    promises sqrt(6) can be made to deliver six times the cycle rate by a table choice that looks
    natural, and the fully charged net gain at |Aut| in {4, 6} is measurable, unmeasured, and explicitly
    out of scope of the only approved rho experiment in this program'
  status: draft
  objective: "(A) THE GAP THIS FILLS, NAMED PRECISELY. H-RHO-bc6ea6 (specified; EXP-RHO-60da4f approved\
    \ 2026-08-06) measures the negation-quotient net gain and its fruitless-cycle rate against a pre-registered\
    \ 1/(2r). Its own assumptions block says: \"The curve has Aut(E) = {+-1}. Curves with j = 0 or\
    \ j = 1728 have larger automorphism groups, DIFFERENT CYCLE STRUCTURE, and are OUT OF SCOPE.\"\
    \ Separately, H-ENDO-001's prediction 4 -- measured rho cost on j = 0 and j = 1728 within 20 percent\
    \ of 0.886*sqrt(N/|Aut|) -- carries the note \"this campaign has never measured it\", and EV-ENDO-001\
    \ records that EXP-ENDO-001 produced ZERO RUNS. So the |Aut| in {4, 6} cell is empty in this program,\
    \ and it is exactly the cell where the entire L6 prize lives (IDEA-20260807-ebcae6: residual headroom\
    \ 1.4142 at |Aut| = 4, 1.7321 at |Aut| = 6, and exactly 1.0000 everywhere else).\n(B) THE DERIVATION,\
    \ DONE BEFORE ANY RUN, AND IT HAS A SIGN THAT FLIPS. Let Aut have order m, canon pick the orbit\
    \ element minimal under a fixed total order on encodings, s(.) be an Aut-invariant partition function\
    \ into r branches, and the step be\n  A |--> canon(A) + T_{s([A])}.\nWrite B = canon(A) + T_s\
    \ and canon(B) = sigma B for the sigma in Aut that canon selects. The next step gives C = sigma\
    \ B + T_{s'} with s' = s([B]). An immediate undo means [C] = [A], i.e. C = tau canon(A) for some\
    \ tau in Aut. Expanding,\n  C = sigma canon(A) + sigma T_s + T_{s'},\nso the condition is (sigma\
    \ - tau) canon(A) = -(sigma T_s + T_{s'}). TWO BRANCHES:\n  (B1) sigma = tau. The condition collapses\
    \ to T_{s'} = -sigma T_s, an\n    equation in the STEP TABLE ALONE, independent of A. This is\
    \ the\n    generic, high-rate branch.\n  (B2) sigma != tau. Then (sigma - tau) is a nonzero scalar\
    \ mod N, hence\n    invertible, and canon(A) is DETERMINED: at most one class per tuple\n    (sigma,\
    \ tau, s, s'), so at most m^2 r^2 classes out of about N/m. This\n    branch is O(m^2 r^2 / N)\
    \ and is negligible at cryptographic N -- but it\n    is NOT negligible at 16 to 20 bits, which\
    \ is a named toy-scale\n    confounder rather than a result.\nNow evaluate (B1). For a uniformly\
    \ distributed B the automorphism sigma selected by canon is uniform on Aut, so P(sigma = nu) =\
    \ 1/m for each nu.\n  - GENERIC STEP TABLE (no nontrivial Aut-relation among the T_s). Then\n\
    \    -sigma T_s lies in the table only when -sigma = 1, i.e. sigma = -1,\n    and then the required\
    \ index is s' = s. Rate = (1/m)*(1/r) = 1/(m r).\n  - Aut-STABLE STEP TABLE (the table is a union\
    \ of Aut-orbits, which is the\n    natural choice if one builds the table from orbits, and is\
    \ exactly the\n    phi-stable-basis instinct of lane L4). Then -sigma T_s is in the table\n  \
    \  for EVERY sigma, at one determined index, so\n    Rate = sum_{sigma} (1/m)*(1/r) = 1/r.\nTHE\
    \ TWO DIFFER BY A FACTOR m. At m = 2 the generic value is 1/(2r), which REPRODUCES HEUR-RHO-1\
    \ of H-RHO-bc6ea6 exactly -- that is this derivation's baseline-embedding check, not a coincidence.\
    \ At m = 6 the generic value is 1/(6r), THREE TIMES BETTER than the negation case, while the Aut-stable\
    \ value is 1/r, SIX TIMES WORSE than the generic value at the same m.\n(C) WHAT EACH OUTCOME MEANS\
    \ -- THE PROPOSAL DISCRIMINATES, IT DOES NOT FISH.\n  OUTCOME 1 -- measured rates match 1/(mr)\
    \ generic and 1/r Aut-stable\n    within a factor 2. The cycle mechanism is understood at |Aut|\
    \ > 2, the\n    table choice is established as a first-order design variable that no\n    record\
    \ in this program names, and the net-gain measurement in (D) is\n    interpretable.\n  OUTCOME\
    \ 2 -- measured rates match at m = 2 but not at m = 4 or 6. The\n    uniformity of sigma under\
    \ canon fails, i.e. canon is biased on larger\n    orbits (very plausible: min over an orbit is\
    \ not a uniform selector\n    when the orbit elements are correlated in the encoding). That is\
    \ a\n    REAL finding about canonicalisation, it is measurable, and it changes\n    the derivation\
    \ rather than the conclusion.\n  OUTCOME 3 -- rates do not depend on the table's Aut-stability\
    \ at all.\n    Branch (B1) is not the dominant mechanism, some longer-cycle mechanism\n    dominates,\
    \ and the deliverable is the measured cycle-length spectrum\n    with the 2-cycle model recorded\
    \ as refuted.\n  There is no outcome in which nothing is learned, which is the quality bar\n \
    \ in agents/idea-generator.md.\n\n(D) THE NET-GAIN QUESTION, WHICH IS THE LANE'S ACTUAL DELIVERABLE.\
    \ Measure, in F_p multiplications with the curve model named, the fully charged cost of the Aut-quotient\
    \ walk at m = 2, 4, 6 against an UN-quotiented walk on the SAME curve, SAME step table, SAME seeds.\
    \ Report the ratio against the derived ideal sqrt(m) = 1.4142 / 2.0000 / 2.4495. PRE-REGISTERED\
    \ PREDICTION: the achieved ratio is strictly below sqrt(m) at every m, the shortfall GROWS with\
    \ m, and for at least one (escape rule, table type) cell at m = 6 the ratio falls BELOW 1.0 --\
    \ i.e. the largest automorphism group available over a prime field produces a NET LOSS. A measured\
    \ shortfall is a real and useful result and is the expected one.\n(E) WHY THE SHORTFALL SHOULD\
    \ GROW WITH m, STATED AS A MECHANISM NOT A HUNCH. Three charges scale with m and one does not:\n\
    \  (E1) CANONICALISATION ARITHMETIC. Choosing the minimum of an m-element\n    orbit costs m-1\
    \ comparisons and, on j = 0, 2 extra field\n    multiplications to form zeta*x and zeta^2*x. Against\
    \ a Jacobian-\n    coordinate step of roughly 11-16 field multiplications this is a\n    10-20\
    \ percent per-step charge at m = 6 and essentially zero at m = 2.\n  (E2) NORMALISATION / INVERSION.\
    \ In any projective coordinate system the\n    canonical representative is defined on AFFINE coordinates,\
    \ so canon\n    needs x = X/Z^2 and y = Y/Z^3, i.e. an inversion per step unless\n    simultaneous\
    \ inversion is used across a batch. KN-LIT-097 records that\n    the largest publicly completed\
    \ ECDLP computation used exactly \"negation\n    map, simultaneous inversion, and explicit handling\
    \ of the\n    fruitless-cycle problem\" together -- the three are coupled, and a\n    cost model\
    \ that charges the negation map without charging its\n    inversion is not charging the method\
    \ that was actually run.\n  (E3) ESCAPE-RULE DISTORTION. Every escape perturbs the walk away from\
    \ the\n    ideal random map, raising the collision constant. More cycle types at\n    larger m\
    \ means more escapes.\n  (E4) DOES NOT SCALE: the space reduction, which is exactly sqrt(m).\n\
    So the charged gain is sqrt(m) divided by a per-step overhead that grows in m, and the question\
    \ of where the quotient stops paying is arithmetic on measured numbers, not opinion."
  resource_label: R3 (End(E) as a ring -- its unit group Aut, and the requirement p = 1 mod 3 or p
    = 1 mod 4 for those units to be F_p-rational).
  admissibility: inadmissible_generic_group
  admissibility_argument: INADMISSIBLE, FILED AS A RECORDED BASELINE CALIBRATION. The walk applies
    automorphisms to points of G and nothing else. On a prime-order G every endomorphism is a scalar
    (H-ENDO-001), an oracle supplying phi(A) is Oracle D of KN-FIND-b7e091, and Oracle D is generic-group
    simulable, hence closed at exponent 1/2 by Shoup (KN-TECH-005). No exponent is claimed and none
    is available. What the measurement buys is the exact constant at which the closed family saturates
    on the ONLY prime-field curves where that constant exceeds the program's baseline, so that every
    other lane in GOAL-ENDO-001 charges against a measured number instead of folklore.
  reachability_gate: 'THIS PROPOSAL SELECTS CURVES, IT DOES NOT WALK BETWEEN THEM, and the gate is
    the reason the result cannot be turned into an attack on a chosen target. By T4 the isogeny class
    fixes D_0, so |Aut| is not something an attacker can improve for a GIVEN target: from a class
    with D_0 not in {-3, -4} no isogeny walk of any length reaches a curve with |Aut| > 2, at any
    cost. The J0 and J1728 arms are therefore CONSTRUCTED, not reached: the experiment generates curves
    with the desired D_0 directly, which is legitimate for measuring the constant and illegitimate
    as a model of what an attacker could do to an arbitrary target. Cost of construction: O(1) rejection
    sampling on p mod 3 and p mod 4 at toy size. Cost of reaching a j = 0 curve from a non-CM-(-3)
    class: unbounded, because no such curve exists in the class.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): re-derive (B); check the m = 2 specialisation against
      HEUR-RHO-1; literature-locate published cycle rates for m > 2 and record what they already answer.
      STAGE 1 (hours, HARD GATE): build and verify GEN / J1728 / J0 with explicit Aut enumeration
      and rationality checks; run the sham-quotient and canon-disabled nearby-object controls; confirm
      classes are counted in points. STAGE 2 (hours): no-escape cycle-rate measurement across (family)
      x (table type) x r, with full cycle-length histograms and the sigma-distribution. STAGE 3 (hours
      to days): escape rules, fully charged net gain against the matched-seed un-quotiented null,
      censoring charged. STAGE 4 (hours): per-block attribution. THE CHEAPEST KILL IS STAGE 2 AT r
      = 4: if the generic-table rate does not fall with m there, the derivation is wrong and Stage
      3 is not worth running.'
    mechanism: "STAGE 0 (zero compute, HARD GATE). Re-derive (B) symbolically, including the m = 2\
      \ specialisation to 1/(2r), and confirm it matches HEUR-RHO-1 of H-RHO-bc6ea6 exactly. If it\
      \ does not, one of the two derivations is wrong and no run happens until that is resolved. Also\
      \ derive, or explicitly declare unmodelled and measurement-only, the rates of fruitless cycles\
      \ of length 4 and 6; the record must not silently assume the 2-cycle is the only type.\nSTAGE\
      \ 1 (instrument, HARD GATE). Build three curve families with harness/toycurve.py and the j =\
      \ 0 generator already present in harness/endomorphism_la.py:\n  GEN  -- generic j, p not = 1\
      \ mod 3, |Aut_{F_p}| = 2;\n  J1728 -- a = arbitrary, b = 0, p = 1 mod 4, |Aut_{F_p}| = 4;\n\
      \  J0   -- a = 0, p = 1 mod 3, |Aut_{F_p}| = 6.\nVERIFY RATIONALITY, DO NOT INFER IT FROM j:\
      \ enumerate Aut explicitly by checking that the candidate maps send curve points to curve points\
      \ and have the right order, and record the count. A curve with a = 0 over p = 2 mod 3 has j\
      \ = 0 and |Aut_{F_p}| = 2, and mis-classifying it would silently contaminate the J0 arm. COUNT\
      \ CLASSES IN POINTS, NOT IN x. IDEA-20260807-ebcae6's observation_collision records that in\
      \ x-coordinates the |Aut| = 4 orbit has size 2, identical to a generic negation orbit, so an\
      \ x-only instrument CANNOT SEE the j = 1728 row at all. The class identifier used here is the\
      \ canonical (x, y) pair.\nSTAGE 2 (the cycle-rate measurement). For each family, for r in {4,\
      \ 8, 16, 20, 32}, for TABLE TYPE in {generic, Aut-stable}, run the quotient walk with NO escape\
      \ rule and instrument every step for the immediate-undo event. Report the empirical per-step\
      \ 2-cycle rate against the derived 1/(m r) and 1/r, and report the full cycle-length histogram\
      \ rather than the 2-cycle count alone. The no-escape arm is also the positive control that the\
      \ cycle problem exists and the instrument can see it (C3 of EXP-RHO-60da4f uses the same device\
      \ at m = 2).\nSTAGE 3 (the net-gain measurement). Add the escape rules, all of them functions\
      \ of the CURRENT CLASS ONLY so that memorylessness and hence van Oorschot-Wiener merging survive\
      \ (KN-TECH-006), and measure the fully charged cost in F_p multiplications, with squarings and\
      \ inversions counted separately at their measured platform ratios, against the un-quotiented\
      \ walk on the SAME curve, SAME table, SAME seeds. Report: net_gain_ratio per (family, table\
      \ type, escape rule, r), the maximum over the grid, and the location of any crossing of 1.0.\
      \ CENSORING IS CHARGED, NOT DROPPED. Runs that exhaust the escape budget are reported as censored\
      \ WITH their consumed cost included in the arm's total, and the censored fraction is reported\
      \ per cell. Reporting a conditional-on-success mean is the exact defect REVIEW-H100-20260717\
      \ correction C5 records in the staged 16/18-bit artifact, and it is the single easiest way for\
      \ this experiment to manufacture a false gain.\nSTAGE 4 (attribution). Decompose the charged\
      \ cost per block -- step, canonicalisation, normalisation/inversion, cycle detection, escape,\
      \ DP predicate, memory traffic -- so a measured shortfall can be attributed to (E1), (E2) or\
      \ (E3) rather than reported as an opaque ratio."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched-seed un-quotiented walk, same table, same seeds (blocking)
  - random-oracle walk at the ideal constant (blocking)
  - sham-quotient with a non-automorphic involution (blocking)
  - canon-applied-then-undone nearby object (must show gain below 1.0)
  - no-escape positive control (must be absorbed in cycles)
  - explicit Aut enumeration and rationality verification per curve
  - two independent implementations agreeing on a frozen seed
  - 'NULL OBJECT (from the proposal): MANDATORY, THREE-PART, AND BLOCKING. (1) MATCHED-SEED UN-QUOTIENTED
    NULL. The same curve, same step table, same r, same DP granularity, same seeds, walk on POINTS
    instead of classes. Every net_gain_ratio is that arm''s cost divided by this arm''s cost, measured
    in the same run. THE DECAY PARAMETER IS m: as m goes 2 -> 4 -> 6 the measured gain must TRACK
    sqrt(m) = 1.414 -> 2.000 -> 2.449 from below. A gain that does not move when m moves is measuring
    something other than the quotient and is the canonical artifact tell. (2) RANDOM-ORACLE WALK.
    A walk driven by a keyed hash into the group, realising the ideal constant by construction; any
    arm beating it by more than the derived band falsifies the instrument, not the band. (3) SHAM-QUOTIENT
    NULL. Run the identical canonicalise-then-translate pipeline with canon replaced by a FIXED, NON-AUTOMORPHIC
    involution of the encoding that is not a group map (e.g. swap two bytes of the x-encoding and
    map back to the nearest curve point). This has the same per-step cost profile and the same code
    path but no group-theoretic content, so it must show gain 1.0 and no useful collisions. If the
    sham quotient shows a gain, the harness is crediting the quotient for something structural in
    the plumbing.'
  independent_variables: []
  metrics:
    primary:
    - per-step 2-cycle rate per (m, table type, r, size)
    - full cycle-length histogram, not only the 2-cycle count
    - empirical distribution of sigma over Aut (tests uniformity)
    - fully charged cost in F_p multiplications, squarings and inversions counted separately, curve
      model named
    secondary:
    - net_gain_ratio with bootstrap interval, per cell
    - censored fraction and the cost consumed by censored runs
    - per-block cost attribution
    - branch-(B2) event count, reported separately from (B1)
    - Aut order verified per curve, and the class-identifier convention used
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-step immediate-undo (fruitless 2-cycle) rate, generic table
    formula: Within a factor 2 of 1/(m r) at every tested (m, r), and STRICTLY DECREASING in m at
      fixed r. Specifically the m = 6 rate must be below the m = 2 rate by at least a factor 2. Failure
      to decrease in m refutes the generic-table branch of the derivation.
    source: pre-registered in IDEA-20260807-6355c6 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - BRANCH (B2) AT TOY SCALE. Its m^2 r^2 / N contribution is negligible at crypto N and can be a
    few percent at N ~ 2^16 with m = 6 and r = 32. It must be counted separately, not folded into
    the (B1) rate.
  - CANON BIAS. min-over-orbit is not obviously a uniform selector on correlated encodings; if sigma
    is not uniform the derived rates shift. The sigma-distribution is a required metric precisely
    to catch this.
  - NORMALISATION ACCOUNTING. Whether the inversion needed by canon is charged per step or amortised
    by simultaneous inversion changes the net gain by more than the effect being measured. The convention
    must be frozen before Stage 3 and reported with every number.
  - x-COORDINATE CLASS COUNTING. Would make m = 4 indistinguishable from m = 2 and silently zero the
    j = 1728 row.
  - j WITHOUT RATIONALITY. a = 0 over p = 2 mod 3 has j = 0 and |Aut_{F_p}| = 2; treating it as an
    m = 6 curve contaminates the arm with the m = 2 answer.
  - CENSORING. Conditional-on-success means inflate the quotient arm. This is the exact defect audited
    in REVIEW-H100-20260717 C5 and it is the most likely way this experiment produces a false gain.
  - TOY-SIZE CONSTANT DRIFT. Constants measured at 16-24 bits need not hold at 2^48 or at crypto size;
    three sizes are the minimum and drift is reported, never averaged away.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Within a factor 2 of 1/(m r) at every tested (m, r), and STRICTLY DECREASING
    in m at fixed r. Specifically the m = 6 rate must be below the m = 2 rate by at least a factor
    2. Failure to decrease in m refutes the generic-table branch of the derivation.
  falsification_criterion:
  - Stage 0's symbolic m = 2 specialisation fails to give 1/(2r). The derivation is wrong; nothing
    is run.
  - The generic-table cycle rate does not decrease with m. The (B1) derivation's uniform-sigma step
    is wrong; report the measured rates and the sigma-distribution as the finding and withdraw the
    m-dependence claim.
  - The Aut-stable/generic rate ratio is below 1.5 at m = 6. The table stability mechanism is not
    first-order; Outcome 3.
  - The sham-quotient control shows a gain above 1.05. The harness credits plumbing; every number
    is void until explained.
  - The matched-seed null arm does not reproduce the plain-rho constant within the pre-registered
    band. Instrument failure; no ratio reported.
  - A cell shows net_gain_ratio above sqrt(m) with all null controls passing and replication at three
    sizes. That is the one interesting event in the lane, requires independent review before any interpretation,
    and must not be summarised as a speedup until reviewed.
  - Budget exhaustion or crashes. INFRASTRUCTURE outcome under AGENTS.md rule 5, never negative mathematical
    evidence.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
