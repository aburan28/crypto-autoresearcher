    x-lift residue calibrator.

  objective: >
    Evaluate the exact identity that on
    p=19, A=1, B=-1, P=(2,3) one has
    [2]P=(16,11), r=2 and r'=0, and
    rejects the nearby invariance
    claim that r'=2, on one frozen
    family (REAL, KF, NULL). Stage 0
    does not form a real Gamma orbit,
    does not run a unary-closure
    census, does not run Miller or
    Tate, and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has
      r=2, r'=0; KF invariance claim
      rejected because r'=0; NULL
      empty residue rejected;
      infinity rejected as having no
      affine x. Certificate kind none.
    formula: >
      Affine doubling then x_Z mod 4.
      REAL: P=(2,3), [2]P=(16,11),
      r=2, r'=0.
      KF: claim r'=2, actual 0,
      rejected as a generic
      doubling-residue target.
    claim_tier: observational

  inputs:
    fixture:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_r: 2
        must_r_prime: 0
      known_false:
        kind: constant_r_prime
        claimed_r_prime: 2
        must_r_prime: 0
        must_reject: true
      matched_null:
        kind: empty_residue
        must_reject: true
      invalid:
        - {infinity: true, point: null, must_reject: true, no_affine_x: true}

  controls:
    - name: known_false_constant
      object: KF claim r' equals 2
    - name: matched_null
      object: empty residue
    - name: invalid_infinity
      object: point at infinity has no affine x

  independent_variables:
    - point
    - affine_chart
  metrics:
    primary:
      - fixture_pass
      - real_residue_pass
      - known_false_constant_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
