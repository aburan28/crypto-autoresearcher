experiment:
  id: EXP-INSTR-2d90bb
  hypothesis_id: H-INSTR-ebb306
  derived_from_idea: IDEA-20260807-257001
  question_id: RQ-INSTR-f8faa0
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Transport certificate audit at toy scale - a twelve-mutation suite against the
    committed verify_transport and an augmented instance-and-class verifier, with
    the scalar-orbit invariance declared as executable MUST-ACCEPT cases
  objective: >-
    The one uncertainty a run reduces is whether the committed transport verifier
    certifies what the transport theorem T1 requires. A run establishes three
    things and no more. First, the per-mutation accept or reject verdict and named
    reason of BOTH verifiers on twelve planted mutations, nine of which must be
    rejected and three of which must be accepted because they are not faults of the
    instance. Second, exact verdict agreement between the two verifiers on a frozen
    fixture of 20 genuine transports, which is the baseline reproduction gate and
    blocks everything downstream. Third, the measured cost of the added independent
    trace predicate as a fraction of the transport it certifies, and the
    certificate pass rate as a function of chained transport depth. No attack is
    mounted, no discrete logarithm is computed that was not already known, and no
    security consequence follows from any outcome.
  what_this_is_not:
    - >-
      Not an attack, a key recovery, a distinguisher, or a cryptanalytic result of
      any kind. It is an instrument audit.
    - >-
      Not a claim in either direction about the security of any deployed curve.
    - >-
      Not a modification of harness/isogeny_class.py, harness/runner.py, or any
      other committed harness module. The augmented verifier is a standalone driver
      under this experiment's directory and the committed verifier is run unmodified
      beside it.
    - >-
      Not evidence that a transport is usable by a party who does not know the
      secret k. The discrete-log predicate consumes k, and every acceptance carries
      that clause.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. At p = 4001 with isogeny degrees 3 and 5, the
      committed verifier does or does not accept a target curve carrying a different
      trace of Frobenius; both verifiers do or do not accept the three scalar-orbit
      mutations; the two verifiers do or do not agree on 20 genuine transports; and
      the independent trace predicate costs a measured fraction of the transport.
      WHAT DOES NOT FOLLOW. No statement about the correctness of any isogeny
      implementation beyond the mutations actually planted; no statement about
      behaviour at any p other than those executed; no claim that a passing
      certificate identifies the map that produced the instance, which the design
      exists to declare impossible; and no security consequence for any curve.
  inputs:
    procedure: >-
      STAGE 0, zero compute, HARD GATE. Write out on paper the algebra of the
      scalar invariance and confirm that the k-fold multiple of the negated first
      image equals the negated second image, and likewise for an arbitrary lambda
      coprime to N. If the algebra does not close, the design's central structural
      claim is wrong and the contract is superseded rather than run.
      STAGE 1, minutes. Validate trace_of_frobenius against exhaustive point
      counting over ALL curves at p = 101 and p = 1009. Exact agreement is required
      on every curve.
      STAGE 2, about an hour. Build the frozen fixture of 20 genuine transports at
      p = 4001 for ell in {3, 5} with N prime and gcd(ell, N) = 1, and archive it by
      hash. Run BOTH verifiers on all 20 and require exact verdict agreement. This
      is the baseline reproduction gate; a disagreement halts the run.
      STAGE 3, about an hour. Run the twelve-mutation suite against BOTH verifiers
      and tabulate accept or reject together with the reason string for each of the
      24 cells.
      STAGE 4, about an hour. Run the null object - a curve at the same p with the
      same subgroup order N but a different trace, with a point pair built to
      satisfy the discrete-log relation by construction - against BOTH verifiers.
      STAGE 5, minutes. Measure the trace predicate's wall cost and group-operation
      cost as a fraction of the transport, and measure the certificate pass rate for
      chained transports at depths 1 through 8.
      STAGE 6, zero compute. Assemble the 24-cell verdict table, the agreement
      count, the null-object verdicts, the cost fraction and the depth table, and
      write the refusal statement declaring the equivalence class the certificate
      cannot distinguish.
    instrument: >-
      Python 3.11 with numpy. A NEW standalone verifier under
      experiments/EXP-INSTR-2d90bb/driver/ that imports the toycurve elliptic-curve
      arithmetic and trace_of_frobenius and NOTHING from the Velu path; the import
      list is asserted by the driver's own test so the independence claim is checked
      rather than intended. The committed harness/isogeny_class.py::verify_transport
      is imported unmodified and run beside it on every fixture. Trace caching is
      FORBIDDEN - a cached trace is not a recomputation and would void the
      independence the predicate exists for. Recorded through harness/runner.py.
    parameters: >-
      p = 4001 for the main arms, with p = 101 and p = 1009 for exhaustive trace
      validation only. Ordinary traces drawn from the committed RUN-ICINV-p4001-a
      enumeration. Isogeny degrees ell in {3, 5}, restricted to instances with N
      prime and gcd(ell, N) = 1. Genuine fixture size 20. Twelve mutations, nine
      MUST-REJECT (singular target; different-trace target; first image off the
      target curve; first image equal to the identity; first image of order a proper
      divisor of N; second image off the curve; k off by one; N replaced by a
      composite; target coefficients transposed) and three MUST-ACCEPT (both images
      negated; both images multiplied by a common lambda coprime to N; k replaced by
      k plus N). Chain depths 1 through 8.
  controls:
    - >-
      NULL OBJECT, mandatory and blocking. A curve at the same p with the same
      subgroup order N but a DIFFERENT trace where one exists, otherwise a random
      curve at the same p, together with a point pair built so the discrete-log
      relation holds by construction. This object satisfies the order and
      discrete-log predicates perfectly and fails class membership. If the augmented
      verifier accepts it, the trace predicate is not doing its job and the
      certificate is worthless as a class-membership claim - which is the entire
      reason the predicate is being added.
    - >-
      THE THREE MUST-ACCEPT MUTATIONS, which are the executable declaration of the
      invariance class. A rejection of any of them is a defect of a different kind
      and is reported as such.
    - >-
      trace_of_frobenius validated against exhaustive point counting over ALL curves
      at p = 101 and p = 1009 before it is used as a certificate predicate.
    - >-
      The committed verify_transport run unmodified beside the augmented verifier on
      every single fixture, so that every reported difference is attributable to the
      added predicate and not to the fixture.
    - >-
      CHAINED TRANSPORTS at depths 1 through 8, where the pass rate must be
      identically 1 for correct code. Any decay with depth is a bug signature
      indicating accumulating state in the transport implementation, and is the
      canonical artifact tell for this instrument.
    - >-
      IMPORT-LIST ASSERTION. The augmented verifier's module imports are asserted in
      the test suite. Without this the independence claim evaporates silently.
  independent_variables:
    - 'verifier: committed verify_transport / augmented instance-and-class verifier'
    - 'fixture kind: genuine transport / MUST-REJECT mutation / MUST-ACCEPT mutation / null object'
    - isogeny degree ell
    - chained transport depth
  metrics:
    primary:
      - >-
        Per-cell verdict, a boolean plus a named reason string, for each of the 2
        verifiers by 12 mutations, 24 cells total. Computed by invoking each
        verifier once per mutated certificate and recording its return value
        verbatim.
      - >-
        Count of MUST-REJECT mutations accepted by the committed verifier, an
        integer in 0 to 9. Computed by counting accepting cells in the committed
        verifier's MUST-REJECT column.
      - >-
        Count of MUST-ACCEPT mutations rejected by either verifier, an integer in
        0 to 6. Computed by counting rejecting cells across both MUST-ACCEPT columns.
      - >-
        Genuine-transport agreement count, an integer in 0 to 20. Computed as the
        number of frozen fixtures on which the two verifiers return the same boolean.
      - >-
        Null-object verdict per verifier, a boolean plus reason. Computed by one
        invocation of each verifier on the null certificate.
    secondary:
      - >-
        Trace predicate cost fraction, dimensionless. Computed as the measured
        seconds spent inside trace_of_frobenius divided by the measured seconds of
        the transport that produced the certificate, averaged over the 20 genuine
        fixtures, reported with its range.
      - >-
        Certificate pass rate versus chain depth, a fraction in 0 to 1 per depth 1
        through 8. Computed as accepted chains divided by attempted chains at each
        depth.
      - >-
        Count of instances skipped because N was not prime or gcd(ell, N) was not 1,
        an integer. Reported so the skip path is shown to have been exercised.
      - >-
        Trace predicate cost in field operations at p = 101, 1009 and 4001, to
        exhibit the O(p) growth rather than assert it.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The count of MUST-REJECT mutations accepted by the COMMITTED verifier, and in
      particular its verdict on the different-trace mutation; together with the count
      of MUST-ACCEPT mutations rejected by EITHER verifier.
    formula: >-
      Predicted committed-verifier MUST-REJECT acceptances at least 1, and the
      different-trace cell specifically ACCEPT, because the committed verifier
      derives the target coefficients from velu_odd and never recomputes the target
      trace. Predicted MUST-ACCEPT rejections exactly 0 for both verifiers, because
      the discrete-log predicate is invariant under post-composition with a scalar.
      Predicted genuine-transport agreement exactly 20 of 20. Predicted chained pass
      rate exactly 1 at every depth. Under the null that the committed verifier
      already certifies class membership, the different-trace cell reads REJECT and
      the record's central gap claim is falsified.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-257001, section (B3) and
      its predictions block, written before any run under this contract exists.
      Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at p = 4001, far below any deployed parameter, because the audit's
      object is the verifier's predicate set rather than any curve. The trace
      predicate is O(p) so the cost fraction measured here does NOT transfer to
      larger p, and the contract states that rather than extrapolating it. The
      verdict table is a property of the code and transfers exactly as far as the
      code is unchanged, which is why the executor must re-read
      harness/isogeny_class.py against the tree at execution time and record its
      commit sha in the manifest.
    correspondence: null
  tail_checks:
    - >-
      Report the reason string for every rejecting cell, since two verifiers can
      reject the same mutation for different and non-equivalent reasons and a bare
      boolean would hide that.
    - >-
      Report the number of candidate instances discarded during fixture
      construction and why, so the fixture is not silently selected toward easy
      cases.
    - >-
      Report the trace predicate's cost at all three primes so the O(p) growth is
      exhibited rather than assumed.
    - >-
      Report at least one instance whose N is composite or whose gcd with ell
      exceeds 1, confirming the skip path is exercised rather than dormant.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 12
  stopping_rules:
    - >-
      Abort if Stage 0's paper algebra does not close; the contract is superseded
      rather than run.
    - >-
      Abort if trace_of_frobenius disagrees with exhaustive counting anywhere at
      p = 101 or p = 1009. Nothing downstream is reportable.
    - >-
      Abort Stage 3 onward if the two verifiers disagree on any of the 20 genuine
      transports. The disagreement is the reported outcome.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result, under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence.
    - >-
      A run whose null-object arm is missing, or whose committed-verifier column was
      not produced in the same invocation as the augmented column, is
      invalid_measurement - the comparison the contract exists to make was not made.
    - >-
      A run in which the augmented verifier imported anything from the Velu path,
      or in which a trace was read from a cache rather than recomputed, is
      invalid_measurement regardless of its verdicts.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and
      requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The run is successful when ALL of the following are reported from the executed
    metrics. Stage 1 exhaustive trace validation passes at both small primes; the
    genuine-transport agreement count is exactly 20 of 20; the full 24-cell verdict
    table with reason strings is produced; the null-object verdict is reported for
    both verifiers; and the trace cost fraction and the depth-8 pass-rate table are
    reported. Success here means a DECIDABLE run, not a confirmed hypothesis - the
    hypothesis is confirmed only if, in addition, the committed verifier accepts the
    different-trace mutation, the augmented verifier rejects it and rejects the null
    object, and both verifiers accept all three MUST-ACCEPT mutations.
  falsification_criterion:
    - >-
      The committed verifier REJECTS all nine MUST-REJECT mutations, including the
      different-trace one. Claim C2 of H-INSTR-ebb306 is false, the class-membership
      gap does not exist, and the trace predicate is a redundancy rather than a
      repair. This is a genuine negative outcome and is recorded as one.
    - >-
      Either verifier REJECTS any MUST-ACCEPT mutation. Claim C1 is false as stated;
      the declared equivalence class is wrong and must be rewritten before anything
      else is interpreted.
    - >-
      The augmented verifier ACCEPTS the null object. The trace predicate does not
      close the class-membership hole and claim C2's repair limb fails.
    - >-
      The two verifiers disagree on any genuine transport, or trace_of_frobenius
      fails exhaustive validation. INVALID MEASUREMENT rather than a negative - one
      instrument is wrong and nothing is certified until it is known which.
    - >-
      The chained pass rate falls below 1 at any depth. An implementation finding
      under AGENTS.md rule 5, reported as a bug signature and never as evidence
      about transport mathematics.
    - >-
      The trace cost fraction exceeds 0.10 at p = 4001. Claim C3's cheapness limb
      fails; the predicate is sound but must be charged into every lane that uses it.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model and inference block, and environment.
    - >-
      raw-result.json carrying every per-cell verdict and reason string, not
      summaries.
    - >-
      The frozen 20-transport fixture with its content hash, and the twelve mutated
      certificates as constructed, so each is independently re-checkable.
    - >-
      The null-object certificate as constructed, in the same file as the signal arm.
    - >-
      The recorded import list of the augmented verifier, as evidence of the
      independence contract.
    - >-
      The Stage 0 paper-algebra note, written before the first run and hashed.
    - >-
      The commit sha of harness/isogeny_class.py as read at execution time, since the
      committed verifier is being edited concurrently.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement
      approval is the USER's gate because it authorizes execution and spends compute.
      This contract is review_required and is NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      The parent proposal carries a proof_search_map, so its bottleneck, baseline
      embedding, observation collision, quantifier order and method ceiling must be
      audited before implementation under KN-TECH-080. The audit items are carried
      into H-INSTR-ebb306's own proof_search_map.
    - >-
      The executor must re-read harness/isogeny_class.py against the tree at
      execution time and record its sha; a stale reading of the committed verifier
      would make the entire comparison meaningless.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260807-257001
    authored_at: '2026-08-25'
    note: >-
      Controls, metrics, mutations and criteria are taken from the parent proposal's
      mechanism and minimal_test blocks and restated as contract fields; boilerplate
      that is identical across contracts by program rule - invalidation rules,
      required artifacts, approval gate - comes from the fixed table. Budgets come
      from the parent's declared estimated_cost of low implementation and low
      compute. No field is invented; a value the proposal did not supply is null or
      is listed under derivation_gaps.
  derivation_gaps:
    - >-
      The optional modular-polynomial degree layer described in the parent proposal
      is NOT included in this contract. It carries its own table-transcription risk
      and needs its own validation gate, and folding it in would let a table
      transcription error contaminate the main verdict.
    - >-
      The exact construction of the different-trace null object at p = 4001 depends
      on whether a same-order different-trace curve exists at that prime; the parent
      allows a random same-p curve as a fallback. Which one was used must be recorded
      per run, because the fallback is a weaker control.
    - >-
      The 0.10 cost-fraction threshold in C3 is a coordinator-set tolerance, not a
      derived quantity. It is pre-registered here so it cannot be adjusted after the
      measurement, and a run that reports the fraction without meeting it is still a
      complete run.
    - >-
      Whether a failed transport certificate should make a run completed_invalid in
      harness/runner.py is a wiring decision this contract deliberately does not
      make. Until such a decision exists, a transport certificate is advisory and
      must be labelled advisory in any record citing it.
