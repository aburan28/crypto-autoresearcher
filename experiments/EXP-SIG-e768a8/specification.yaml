    "methods": {
      "baseline": "Monolithic full-column exact homogeneous Macaulay kernel at every D, followed by the same E_D quotient and mu_D/signature/certificate outputs. Use deterministic sparse Gaussian elimination with smallest monomial/tag pivot and modular normalization, and permit streaming/regeneration with all costs charged. The baseline may exploit ordinary sparsity; it is not forced to store a dense straw matrix.",
      "candidate_steps": [
        "Construct full side homogeneous image/kernel bases locally for each degree0..D. Transport them by every complementary-variable monomial; retain transforms to original tagged generators. This removes only certified side redundancy.",
        "Embed the transported independent image bases U_I,U_K into the complete R_D column space. Solve [U_I,-U_K] exactly. Each kernel pair gives one intersection witness w and original-generator lift(u,-v), with all linear dependencies retained.",
        "Construct full IK_D and pi(M_D) with lifts. Quotient the intersection basis by IK_D+pi(M_D), produce Q_rel representatives and raw Tor_1 classes, and independently verify the pi comparison to the monolithicZ/E.",
        "Compute adjacent-degree multiplication maps and exact mu_D. Compute the separate scalar/module signature objects where eligible, retaining projection kernel/cokernel rather than asserting equivalence. Run affine elimination, saturation and finite root/sign checks as their own complete-cost stages.",
        "Use identical serializers, arithmetic, checker coverage and sparse storage policy in both arms. No chordal node merging or acyclic matching defines this method; optional future use requires new matched-object protocol."
      ],
      "s_D": "1 + sum of every row/column count of side presentations, ambientR_D, originalC1_D, intersection/product/membership/quotient/signature matrices + total nonzero coefficient slots in all stored source polynomials, transforms and witnesses + n+D. Count extended side lifts and repeated witness storage explicitly. s_D is a measured complete-description size, not the number of separator variables or justdim(Q).",
      "conditional_complexity": "For the finite linear-algebra assembly stage only, prospectively check C_glue=C_left+C_right+C_embed+C_intersection+C_quotient+C_transport+C_check and the conservative target C_glue<=C_left+C_right+100*s_D^4 field operations, with dense fallback storage<=100*s_D^2 coefficient/index slots plus serialized witness bytes. The polynomial bound is a design accounting target requiring proof/QA; side elimination, signature search, affine saturation and full recovery are separate charged terms. There is no known bound on s_D in chain length, and these inequalities do not imply faster global solving.",
      "cost_components": [
        "input/field/curve/base acquisition",
        "fixture/null rejection attempts",
        "side elimination and kernel construction",
        "extension/map embedding",
        "intersection linear algebra and fill",
        "product/membership quotient construction",
        "graded-generator minimality",
        "scalar/module signature Phi construction and rewrite search",
        "Groebner/canonicalization/saturation",
        "all failed candidate/witness/rewrite searches",
        "root enumeration and signed-point checking",
        "certificate production",
        "independent certificate verification",
        "serialization, hashing, spill I/O and regeneration"
      ],
      "memory": "Measure exact peak live coefficient/index/witness bytes and process-group peak RSS separately. Count all source data, maps, indices, pivot/fill storage, complete original columns, independent verifier scratch and retained output, with on-disk bytes and I/O separately. No free cached side solution or preprocessing; each standalone arm pays full shared acquisition and lower-degree reconstruction.",
      "operation_units": "Report separate modular additions,multiplications,inversions; monomial comparisons, coefficient reads/writes, integer bit operations, hash compression rounds; W=sum of field additions+multiplications+inversions+monomial comparisons+coefficient reads+writes is only a frozen unit-weight arithmetic score, never universal CPU or bit complexity. Exact big-integer implementation also counts operand bit lengths and measured CPU/wall. All finite primes reported separately.",
      "no_attack": "This experiment produces a solver-component/module diagnostic. It measures no ECDLP relation-collection probability, subgroup extraction or full attack exponent. Rho and BSGS remain external modeled frontier references, not an experimental comparator on unmatched public toy ideals."
    },
    "certificates": {
      "exactness": "For every complete degree slice provide matrices d1,d2, basisZ,basisE,basisQ and all basis transforms. Verify d1*d2=0, Z basis maps to0, E⊂Z, and rank(d1)+dimZ=dimC1 using pivots/full nullspace identities. Verify inverse coordinate maps Z/E<->Q and pi quotient with T_mem. No selected-column or trace-only check.",
      "side_lifts": "Every side basis vector has an original-generator combination; every local kernel and extension monomial has full source labels. Equality I_D∩K_D is independently reconstructed as the kernel of[U_I,-U_K] and lifted to originalP,Q. Product and membership spans have both inclusion witnesses.",
      "minimality": "Every mu_D needs explicit matrix for variable multiples ofQ_(D-1), full quotient basis, rank lower witness and span upper witness; dropping one generator must fail its independent membership test. A list of representatives alone is only a generating upper bound.",
      "signature": "Scalar and module-colon certificates contain whole finite normal boxes, kernel presentation, Groebner reductions, multiplication matrices, all Phi feasibility/infeasibility witnesses and divisor-by-divisor rewritability decisions. All-zero/null cases stay observations. #Gstar log includes each actual pair, remainder, coefficient witness and whether initial or membership element; never reconstructed from output-basis size.",
      "ideal_and_root": "For polynomial ideals, use full Groebner basis S-pair/reduction certificates and mutual generator containment, retaining multiplicities and no radical replacement. For finite membership objects enumerate exact grid roots and compare sorted tuples, not counts alone. Nulls are algebraic assignments only. Bare positive-dimensional ideals assert equality by ideal certificates, not complete enumeration of algebraic-closure points.",
      "signed_point": "For source QM no group reading applies. For source SM,Y evaluate each rational x tuple, exhaust all y in F_p satisfying curve equation for every variable and public constant, then check every ordered sign choice with exact group law; keep algebraic roots with no rational lift separately. Shared s signs must satisfy both local triple equations simultaneously. Check equal-x doubling, y0, opposite points, missing rational lifts and O in group operations. The algebraic object contains finite affine coordinates only; it does not encode a decomposition with an infinite coordinate, and no full-ECDLP or all-projective-chain equivalence is asserted. A fixed independent oracle compares complete signed local relations on every finite grid. Polynomial and rational-point solution sets are separately labelled.",
