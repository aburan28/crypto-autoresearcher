      "formal": "Smallest decision-changing target is the quotient comparison: for a linear map pi on Z, given kernelU, imageV_K=IK, imageM=Tmem and explicit surjectivity, prove induced Z/(U+V_K+M) ≃ ((I∩K)/IK)/Tmem. The Lean theorem must expose these as hypotheses and may not claim the polynomial certificates establish them. Independent QA checks semantic correspondence; known-false control drops kernel condition and must fail using a noninjective map between a two-element space and a singleton. Formal runtime dependency pins are absent and are a concrete activation prerequisite."
