experiment:
  id: EXP-WESO-af139f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-WESO-9cc835
  question_id: RQ-WESO-8aff57
  goal_id: GOAL-P13-001
  title: >-
    Review-required contract: reproduce the frozen paper's five-row concrete-cost
    table from its own stated model under a frozen variant sweep, then compute
    the two-parameter memory-time envelope, gated by a forced-zero corner null
    and a degenerate flat null

  objective: >-
    If separately approved, frozen and authorised, answer two questions with
    seconds of pure arithmetic. (1) Does an independent implementation of the
    cost model stated in Section 4.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    reproduce the ten numbers that section publishes? (2) Under a memory budget
    w < M, does re-optimising the smoothness bound B -- and, in a separate arm,
    the degree parameter Y -- produce a strictly cheaper frontier than the
    published interpolation, with a gain forced to be exactly zero at the
    full-memory corner? Report the full variant table, both nulls, and the
    monotonicity readout before the headline gain.

  what_this_is_not:
    - Not an attack, a key recovery, an isogeny computation, or any computation involving an elliptic curve. No curve is constructed and no isogeny is evaluated at any stage.
    - Not an empirical measurement of anything. The object is a FORMULA and its published output. Producing a table of 256-bit numbers does not make this crypto-scale evidence.
    - Not a per-entry cost measurement, and not a use, citation or contradiction of any value from EXP-PEC-6be870, EXP-PEC-49c773, EV-PEC-2e67ff or EV-PEC-857664. (P1) deliberately uses the paper's own one-operation-per-entry convention, because substituting a corrected constant would make reproducing the published table impossible by construction.
    - Not an objection to Theorem 1.1, Corollary 1.2, Lemma 3.3, Lemma 3.5 or Heuristic 1. A reproduction failure would be a finding about a cost table, and Section 4.1 itself calls its numbers "a rough underestimation" that "should not be interpreted as accurate predictions".
    - Not evidence about GOAL-P13-001 completion criterion 1, which concerns an empirical per-entry calibration that no arm here touches.
    - Not an exponent claim. Both the published section and the re-optimised envelope are p^{1/2+o(1)}/w^{1/2}; sota_delta is 0.000 in both exponents.
    - Not approval, freezing, execution authorisation, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier: >-
      derivation / tool-verification. NEITHER toy NOR crypto empirical evidence,
      because no empirical quantity is measured. The tier follows the object, not
      the size of the parameters.
    exact_supportable_scope: >-
      A successful run could support, at most: "under the cost model transcribed
      from Section 4.1 of the frozen text, evaluated under the eight declared
      variants at log2 p in {256, 384, 512, 576, 768}, the published ten values
      are reproduced within <e> bits by <k> of the eight variants; and under the
      surviving variants, a two-parameter re-optimisation at memory budget w
      yields a cost lower by <g(w)> bits, with g(M) = 0 exactly." NOTHING
      FURTHER. In particular nothing about the real cost of the algorithm,
      because the model being re-optimised is the paper's own optimistic one and
      this goal's own EV-PEC-857664 measured one of its conventions to be wrong
      at the tested scale by orders of magnitude.

  inputs:
    log2_p_values: [256, 384, 512, 576, 768]
    published_time_bits: [106.5, 157.5, 204.2, 230.9, 302.4]
    published_memory_bits: [92.5, 138.6, 181.3, 206.0, 272.2]
    published_previous_method_time_bits: [128, 192, 256, 288, 384]
    published_values_provenance: >-
      Transcribed verbatim from Section 4.1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, which is a frozen immutable
      input READ IN FULL. The run must re-extract these ten numbers from that
      file programmatically and halt on any disagreement with the values recorded
      here, so that a transcription error cannot survive into a comparison.
    model_transcription:
      X: "B^(1/2) * (p/2)^(1/6)"
      w_prime: "log X / log B"
      Psi: "X * w_prime^(-w_prime)"
      M: "Psi * X"
      u: "log(p/2) / (3 * log B)"
      P0: "u^(-u)"
      time: "M / P0"
      memory: "M"
      source_lines: >-
        Algorithm 2 line 1 (X); Lemma 3.3 and Theorem 1.4 (Psi); Section 4.1
        ("the size of the tables constructed in Algorithm 2 is at least
        M = Psi(X,B) X", "the memory cost of the algorithm is ~ M, and its time
        cost is ~ M/P0"); Lemma 3.5 (P0); Heuristic 1 (u).
    frozen_variant_list:
      axes:
        - "smoothness estimator: u^(-u)  OR  Dickman-de Bruijn rho(u)"
        - "logarithm convention in log(p/2): natural  OR  base 2"
        - "B: real-valued  OR  constrained to primes"
      variant_count: 8
      closure_rule: >-
        The list is CLOSED BEFORE EVALUATION. No variant may be added, removed or
        modified after any number is observed; doing so requires a versioned
        protocol_amendment with confirmatory_status exploratory_only and is never
        an edit. Every one of the eight is evaluated and reported with its
        reproduction error, whether or not it wins.
    memory_grid_k: [0, 8, 16, 24, 32, 48, 64]
    memory_grid_rule: "w = M * 2^(-k) for each k, where M is the variant's own optimal table size at that parameter set"
    beta_grid: "log B on a dense uniform grid of 20001 points over [0.5, 3 * sqrt(log(p/2))], refined by golden-section search; the grid resolution is recorded and the corner null certifies its adequacy"
    y_grid: "log_p Y on a uniform grid of 1001 points over [0, 1/3], used ONLY in the (Y,B) arm"
    dickman_rho_method: >-
      Direct numerical solution of the delay differential equation
      u rho'(u) = -rho(u-1) with rho(u) = 1 on [0,1], by fixed-step integration
      with the step recorded and a convergence check at two step sizes differing
      by a factor of 4. NO LIBRARY CALL: sympy and SageMath are verified ABSENT in
      this container and must not be depended on.
    seed_derivation_rule: >-
      NO RANDOMNESS IS USED AT ANY STAGE. The computation is fully deterministic
      given this specification; there are no seeds, and replication means
      bit-identical recomputation. This is recorded explicitly rather than
      omitted, so that a third party knows the reproduction is exact rather than
      statistical.
    tolerances:
      reproduction_bits: 0.5
      reproduction_failure_bits: 2.0
      null_bits: 1.0e-6
      beta_ratio_band: [0.40, 0.95]
      golden_collision_exponent_range: [0.5, 1.0]

  arms_and_controls:
    treatment: >-
      ARM A (B-ONLY ENVELOPE, primary, and INDEPENDENT OF THE UNVALIDATED DENSITY
      LAW). At each parameter set and each memory budget w, minimise
      log T_w(beta) = (3/2) log M(beta) - (1/2) log w - log P0(beta) over the
      beta grid, and report the gain against the published section, which is the
      same objective evaluated at the corner-optimal beta.
      ARM B (TWO-PARAMETER (Y,B) ENVELOPE, secondary, CONDITIONAL). The same
      minimisation over the joint (Y, B) grid using
      rho_p(Y) = 8 Y^{3/2} p^{-1/2} from H-WESO-9dc201. REPORTED SEPARATELY AND
      NEVER MERGED WITH ARM A, so that a refutation of the density law by
      EXP-WESO-f5166c removes ARM B without touching ARM A. Merging the two into
      one reported number is an invalidation condition.
    measured_null: >-
      C-CORNER (forced value, algebraic identity, CAN FAIL). At w = M the two
      objectives coincide identically, since (3/2) log M - (1/2) log M = log M.
      The reported gain at w = M must therefore be EXACTLY 0, within 1e-6 bits,
      at every one of the five parameter sets and in BOTH arms. This is a matched
      null -- same optimiser, same objective family, same grid as the treatment --
      whose value is derived before the run. A nonzero corner gain means the
      optimiser, the objective or the grid resolution is wrong, and NO frontier
      number from that run may be reported in either direction.
    second_null: >-
      C-FLAT (degenerate no-smoothness instance; the nearby object where the
      effect MUST NOT appear; forced value, CAN FAIL). Set Psi(X,B) := X (every
      integer smooth) and P0 := 1 (no retries). Then log TIME = 2 log X =
      log B + log(p/2)/3 is monotone increasing in log B with no interior
      optimum, both branches select the same boundary B, and the re-optimisation
      gain is forced to be EXACTLY 0 at every w. Run on the identical code path.
      A nonzero gain here means the optimiser is finding a spurious interior
      optimum and the treatment gains are numerical artefacts.
    positive_control: >-
      C-REPRO (the control the instrument MUST pass; the nearby object where the
      effect MUST appear). The published ten numbers, reproduced from the
      transcribed model. This is the sensitivity demonstration: if the
      implementation cannot recover ten published values from a stated model at
      the stated parameters, it has no demonstrated ability to compute anything
      about this model, and NO frontier result -- in particular no negative one --
      may be reported. It is also the baseline-reproduction audit of
      inventor-protocol section 8, and a curve that merely resembles the
      published trend does NOT discharge it: the requirement is ten numbers
      within 0.5 bits.
    graded_control: >-
      C-SWEEP (7 interior points, monotonicity reported). The memory grid
      w = M * 2^{-k}, k in {0, 8, 16, 24, 32, 48, 64}. Report the gain AND its
      local slope at every point. The gain must be >= 0 everywhere by
      construction, > 0 for every w < M by the strict inequality of the two
      stationarity conditions, and NON-DECREASING as w falls. A non-monotone gain
      localises the defect to a specific memory decade instead of leaving "it did
      not work".
    identifiability_control: >-
      C-MULTI. Report how many of the eight declared variants reproduce the ten
      published values within tolerance. If more than one does, the published
      observable DOES NOT IDENTIFY the model, and the frontier must then be
      reported under EVERY surviving variant rather than under a chosen one. This
      is the observation-collision audit of inventor-protocol section 8 applied
      to the paper's own published output, and reporting it is a completion-gate
      item rather than a courtesy.
    ordering_control: >-
      C-ORDER. C-REPRO, C-CORNER and C-FLAT are computed, written and
      hash-committed BEFORE ARM A or ARM B is computed or examined, with
      timestamps establishing the order. Absence of the pre-commitment is
      invalid_measurement.
    comparability_policy: >-
      Cross-contract comparison with EXP-PEC-6be870, EXP-PEC-49c773,
      EXP-P13-NC2b, EXP-P13-NC2d, EXP-P13-NC36 or EXP-WESOVOW-001 is FORBIDDEN
      without a separately registered comparator contract. In particular, no
      output of this contract may be combined with any per-entry cost value,
      bracket or margin row from that lane; a per-entry constant is a
      (Y,B,w)-independent translation of the frontier, and the fact that it
      cannot move the argmin is a RESULT to be reported here, not a licence to
      merge the two lanes' numbers.

  metrics:
    primary:
      - "repro_error_bits: max over the five parameter sets and both columns of |reconstructed - published| in log2, per variant."
      - "reopt_gain_bits(w): published-section cost minus re-optimised cost, in bits, at each of the seven memory budgets, at each parameter set, separately for ARM A and ARM B."
      - "corner_gain_bits: the same quantity at w = M, which must be exactly 0."
    secondary:
      - "beta_ratio: optimal log B at the smallest w divided by optimal log B at w = M."
      - "flat_null_gain_bits at every w."
      - "variant_multiplicity: number of variants reproducing the table within tolerance (C-MULTI)."
      - "local slope of the gain across the memory grid (C-SWEEP)."
      - "dg_crossover_memory_bits: memory budget at which the frontier first beats the quoted previous-method figure, for the published section and for each arm."
      - "kdiv_sensitivity: the frontier recomputed with the middle-memory cost divided by k^e for e in {0.5, 1.0} and k in {1, 10^2, 10^3, 10^4}, reported as a sensitivity table and NOT as a result, since k is unmeasured."
      - "Dickman rho convergence check at two step sizes."
      - "Environment record: python and numpy versions, and explicit import results for sympy and sage."

  preregistered_prediction:
    quantity: "corner_gain_bits at w = M"
    formula: "(3/2) log M - (1/2) log M - log P0 = log M - log P0, hence gain = 0 identically"
    source: "H-WESO-9cc835 mechanism step (4); an algebraic identity, not an expectation."
    value: 0.0
    tolerance_bits: 1.0e-6
    secondary_quantity: "repro_error_bits under the best variant"
    secondary_target_bits: 0.05
    secondary_tolerance_bits: 0.5
    secondary_failure_threshold_bits: 2.0
    tertiary_quantity: "beta_ratio at the smallest memory budget, log2 p = 256"
    tertiary_asymptotic_target: 0.58
    tertiary_admissible_band: [0.40, 0.95]
    tertiary_source: >-
      H-WESO-9cc835 mechanism step (3): the two stationarity conditions
      t^2[(1/12) log t + 0.1651] = 1.5 L and t^2[(1/6) log t + 0.0991] = L, whose
      ratio tends to sqrt(3) in t and hence to ~0.58 in beta. 256 bits is not the
      asymptotic regime, which is why the admissible band is wide.
    decision_rule: >-
      C-REPRO passing AND C-CORNER exactly zero AND C-FLAT exactly zero are
      PRECONDITIONS. Only then may reopt_gain_bits and beta_ratio be reported. A
      strictly positive, non-decreasing gain across C-SWEEP with beta_ratio in
      band SUPPORTS H-WESO-9cc835 (P2). beta_ratio >= 1.0 refutes it. No variant
      reproducing the table within 2.0 bits refutes (P1) and makes the frontier
      arms uninterpretable, which is itself the headline finding.

  replication:
    seeds: >-
      None: the computation is deterministic. Replication is bit-identical
      recomputation and is required as a stage, not as an option.
    determinism_check: >-
      The entire pipeline is run twice with the beta grid traversed in reverse
      order and with the golden-section search's initial bracket perturbed by one
      grid step. All reported quantities must agree to 1e-9 bits. A mismatch
      indicates a grid-resolution problem and is invalid_measurement.
    grid_adequacy_check: >-
      Repeat the whole computation with the beta grid doubled to 40001 points.
      Every reported gain must be stable to 1e-3 bits. If it is not, the grid is
      too coarse and the reported gains are resolution artefacts.
    planned_runs: 1
    interpretation: >-
      One run is a deterministic evaluation of a formula. It establishes nothing
      empirical and cannot be replicated into significance.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 1800
    maximum_cpu_seconds: 3600
    maximum_peak_rss_bytes: 2147483648
    maximum_total_disk_bytes: 268435456
    maximum_workers: 1
    network: >-
      Permitted ONLY for the bibliographic stage S6 (retrieval of the frozen
      paper's [43], [3] and [16]). Every request is logged with URL, UTC
      timestamp, HTTP status, byte length and SHA-256. The computational stages
      S0-S5 require no network at all and must run with it disabled.
    bibliographic_stage_wall_seconds: 7200

  execution_order:
    - "S0. Environment record: python version, numpy version, explicit recorded results of `import sympy` and `import sage`. The session that wrote this contract measured numpy 2.4.6 present and both of the others ABSENT; the run re-measures rather than inherits."
    - "S1. Re-extract the ten published values programmatically from inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and halt on any disagreement with inputs.published_time_bits / published_memory_bits."
    - "S2. Dickman rho implementation plus its two-step-size convergence check."
    - "S3. C-REPRO: the eight-variant sweep against the ten published values. THIS STAGE CAN TERMINATE THE RUN (SR1). Hash-commit the full variant table here."
    - "S4. C-CORNER and C-FLAT, hash-committed before any frontier arm is computed."
    - "S5. ARM A (B-only envelope) across the memory grid and all five parameter sets, with C-SWEEP local slopes; then ARM B (Y,B) reported separately; then beta_ratio, C-MULTI and the Delfs-Galbraith crossover; then the kdiv sensitivity table."
    - "S6. Bibliographic stage: retrieve [43] van Oorschot-Wiener, [3] Adj et al., [16] Costello et al.; record verbatim the middle-memory cost exponent, its constant, and the golden-collision multiplicity exponent, each with a page reference, or record the retrieval failure with URL and HTTP status. Recompute the frontier under the retrieved exponent if it differs from 3/2."
    - "S7. Determinism and grid-adequacy recomputations."
    - "Deviation from this order requires a versioned protocol_amendment or a superseding contract. A dispatch handoff may NOT direct a different order, tolerance, window, estimator or prediction (INCIDENT-20260802-P13-03, whose remedy this clause implements)."

  terminating_stage: >-
    S3. It runs in seconds, needs no network and no dependency beyond numpy, and
    it decides (P1) outright. If no declared variant reproduces the published
    table within 2 bits, the run stops there and reports a reproducibility
    finding -- which is the more valuable of the two possible outcomes, because
    every concrete margin statement this goal has produced is anchored to that
    table.

  stopping_rules:
    - "SR0. Do not execute unless this contract is separately approved, frozen, archived and execution-authorised, and unless GOAL-P13-001 has received the explicit budget amendment its own next_action requires."
    - "SR1. Stop at S3 if no variant reproduces the ten published values within 2.0 bits. Report the full eight-row variant table and the reproducibility finding; do not compute any frontier."
    - "SR2. Stop at S4 if C-CORNER is nonzero beyond 1e-6 bits. Report the defect; report NO frontier number."
    - "SR3. Stop at S4 if C-FLAT is nonzero beyond 1e-6 bits."
    - "SR4. Stop at S7 if the grid-adequacy recomputation moves any gain by more than 1e-3 bits; the reported gains would be resolution artefacts."
    - "SR5. The bibliographic stage S6 may be truncated without invalidating S0-S5; record which sources were obtained and which were not, with URL and HTTP status for each attempt. If [43] cannot be obtained, both endpoints of the golden-collision exponent range are reported permanently and neither is chosen."

  invalidation_rules:
    - "Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false."
    - "Any published value used from this specification rather than re-extracted from the frozen input at S1."
    - "Any variant added, removed or modified after any number is observed."
    - "ARM A and ARM B merged into a single reported number."
    - "Any frontier arm computed or examined before C-REPRO, C-CORNER and C-FLAT are hash-committed."
    - "Any per-entry cost value from EXP-PEC-6be870 or EXP-PEC-49c773 entering any computation."
    - "Any missing determinism or grid-adequacy recomputation."
    - "Any deviation from execution_order without a versioned protocol_amendment."

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing dependency, or failed retrieval is an
    INFRASTRUCTURE OUTCOME and is NEVER negative mathematical evidence about
    H-WESO-9cc835, about the frozen paper's cost model, or about any proposition
    in GOAL-P13-001 (AGENTS.md rule 5). Note the specific case: a failure to
    RETRIEVE [43] is an infrastructure outcome, and it is NOT evidence that the
    middle-memory cost exponent is 3/2 or anything else; the contract's response
    is to carry both endpoints of the range permanently, not to pick one.

  scale_relevance:
    tier: >-
      derivation / tool-verification. The parameter sets are cryptographic; the
      object is a formula. THE TIER FOLLOWS THE OBJECT.
    transfer_argument: >-
      The reproduction question transfers exactly, because it is a question about
      arithmetic and has no scale. The frontier question transfers exactly WITHIN
      THE MODEL and not at all outside it: the model is the paper's own
      optimistic one, Section 4.1 says so in its own words, and this goal's own
      EV-PEC-857664 measured one of its conventions to be wrong at the tested
      scale in the attack's disfavour. A frontier computed under an optimistic
      model is a statement about that model.
    stated_limit: >-
      No output of this contract is a statement about how long an attack would
      actually take, and no downstream record may present it as one.

  required_artifacts:
    - "Frozen approved specification and a freeze receipt binding its SHA-256."
    - "Environment record with explicit import results for numpy, sympy and sage."
    - "The programmatically re-extracted ten published values and the source line offsets they came from."
    - "The full eight-row variant table with reproduction errors, hash-committed at S3."
    - "C-CORNER and C-FLAT results, hash-committed at S4 with timestamps establishing the ordering."
    - "Gain and local slope at all seven memory budgets, all five parameter sets, separately for ARM A and ARM B."
    - "beta_ratio, C-MULTI, the Delfs-Galbraith crossover table, and the kdiv sensitivity table."
    - "The Dickman rho convergence check and the grid-adequacy recomputation."
    - "Bibliographic block: per source, URL, UTC timestamp, HTTP status, byte length, SHA-256, and the verbatim exponent with a page reference, or the recorded failure."
    - "Command, stdout, stderr, timing, peak RSS, git commit and dirty-tree state, and the resolved model/policy block per AGENTS.md artifact policy."
    - "An explicit statement of every stage NOT reached and why."

  success_criterion: >-
    This contract has NO current success outcome because it is not authorised for
    execution; its only present disposition is review_required. If a later,
    separately approved and frozen successor is executed, its positive
    disposition is: at least one declared variant reproduces the ten published
    values within 0.5 bits, with the full eight-row table reported; C-CORNER
    exactly 0 within 1e-6 bits at all five parameter sets in both arms; C-FLAT
    exactly 0 within 1e-6 bits at every memory budget; C-SWEEP monotone and
    strictly positive for w < M in ARM A; beta_ratio within [0.40, 0.95];
    C-MULTI reported; the determinism and grid-adequacy recomputations passing;
    and ARM B reported separately from ARM A. THAT DISPOSITION IS A STATEMENT
    ABOUT A FORMULA AND ESTABLISHES NO ATTACK, NO EXPONENT, NO REAL COST, NO
    CRYPTOGRAPHIC-SCALE CONCLUSION, AND NOTHING ABOUT HEURISTIC 1.

  falsification_criterion: >-
    H-WESO-9cc835 (P1) is REFUTED if no declared variant reproduces the ten
    published values within 2.0 bits; the deliverable is then a reproducibility
    finding about Section 4.1, scoped to the eight variants actually swept and
    to nothing else. (P2) is REFUTED if, with C-REPRO, C-CORNER and C-FLAT all
    passing, beta_ratio >= 1.0 at every memory budget, or if the gain is zero at
    every w < M. Each refutation closes exactly the tested scope -- eight
    variants, five parameter sets, seven memory budgets, one transcription of the
    model -- and neither licenses any statement about the algorithm's real cost
    (AGENTS.md rule 6).

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no evidence,
      no mathematical inference, and no status change to any record.
    reproduction_success: >-
      The published cost table is shown to follow from the published model,
      under a named variant, and every downstream margin row in this goal gains a
      provenance it currently lacks. Scoped to the model, not to reality.
    reproduction_failure: >-
      A FIRST-CLASS NEGATIVE AND THE MORE VALUABLE OUTCOME. It must ship with the
      full eight-row variant table, the exact tested boundary, a named
      obstruction (which ambiguity in Section 4.1's statement is responsible),
      and a concrete successor -- for example, the specific additional
      information that would have to be recovered from the paper or its author
      for the table to be regenerable. A negative without those HAS NOT FINISHED;
      a count of variants that failed is a fatigue report, not a closure
      (inventor-protocol section 4).
    infrastructure_or_integrity_failure: >-
      Inconclusive infrastructure signal, never evidence against H-WESO-9cc835 or
      against any proposition in GOAL-P13-001.

  approval_requirements:
    - "Independent review confirms the model transcription in inputs.model_transcription against Section 4.1, Lemma 3.3, Lemma 3.5 and Algorithm 2 line 1, symbol by symbol."
    - "Independent review confirms that C-CORNER is an algebraic identity of the implemented objective and not merely an expected value."
    - "Independent review confirms that C-FLAT can actually fail and that its forced zero is derived rather than asserted."
    - "Independent review confirms that ARM A is genuinely independent of the unvalidated density law of H-WESO-9dc201."
    - "Coordinator separately approves and freezes a successor contract without editing this draft."
    - "GOAL-P13-001 receives the explicit budget amendment its own next_action requires; this contract does not and cannot self-authorise a batch."
  approval_status: >-
    Pending review. No approved_by field is present because this draft is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
