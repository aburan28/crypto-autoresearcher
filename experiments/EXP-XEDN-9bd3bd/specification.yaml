experiment:
  id: EXP-XEDN-9bd3bd
  hypothesis_id: H-XEDN-2945b2
  question_id: RQ-XEDN-002
  goal_id: GOAL-XEDN-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Fibre-specific Mordell-Weil relations: measuring M = |image of
    specialisation|, the Minkowski exponent 1/n, the box-volume invariance, and a
    matched random-points null the XEDN lane has never run

  objective: >-
    Measure the relation class that RQ-XEDN-002's four completed censuses did not
    sample. For free-x sections on surfaces in the frozen EXP-XEDN-004 degree
    window, specialised at a good fibre t_0 in F_p, measure (i) the order
    M_{t_0} of the subgroup they generate in E_{t_0}(F_p), (ii) the shortest
    infinity-norm vector of the kernel lattice K_{t_0}, against the forced value
    M^(1/n), (iii) the integer-point volume of the coefficient box as a function
    of n, against the forced value M independent of n, and (iv) the ratio of
    (ii) for sections against (ii) for uniformly random points generating a
    subgroup of the same order. The audit decides whether a lifting relation
    source has any cost parameter other than M, and it produces the M/N
    distribution, which appears nowhere in this corpus.

  what_this_is_not:
    - Not an ECDLP attack, a discrete-logarithm computation offered as an attack, a relation-collection pipeline, or any claim about a deployed curve.
    - Not a cost claim derived from this contract's own runtime. Every cost statement comes from the box volume and the AM-GM split bound; the discrete logarithms computed here are an instrument for building a lattice and are explicitly NOT part of any proposed attack.
    - Not a retraction, weakening, or contradiction of EV-XEDN-003, DEC-20260725-001, KN-FIND-004, or the sibling goals' evidence. Those record correct measurements of the generic relation class.
    - Not a proposal to change any record's status. Only the Coordinator may do that (AGENTS.md rule 1); a correction is a superseding record, never an edit (rule 4).
    - Not a closure of the lifting relation-source route, and specifically not a licence for any sentence on DEC-20260724-021's forbidden list.
    - Not a widening of the degree window; deg a <= 4 and deg x <= 3 / deg b = 10 belong to GOAL-XEDN-002 and GOAL-XEDN-003.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.

  claim_ceiling:
    tier: toy
    scope: >-
      A run could support, at most, statements about the fibre-specific relation
      lattice of free-x sections on surfaces in the frozen degree window at
      p from 7 up to about 10^5: the measured Minkowski exponent, the measured
      box volume as a function of n, the measured M/N distribution over good
      fibres, and the measured ratio against a matched random-points null. It
      could NOT support any crypto-scale statement, any statement about a
      deployed curve, any closure of the lifting route, or any statement about
      surfaces outside the frozen window. The asymptotic cost identity
      Theta(M^(1/2)) is DERIVED, not measured, and its status as a derivation is
      preserved in every artifact. Toy evidence is never crypto-scale evidence
      (AGENTS.md rule 7).

  inputs:
    archived_artifacts:
      - experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/raw-result.json
      - experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/manifest.yaml
      - experiments/EXP-XEDN-001/xedni_sections.py
    artifact_binding: >-
      Archived files are read at the git commit recorded in
      RUN-XEDN-004-MAIN/manifest.yaml and their sha256 recorded before use. The
      frozen predicate's digest must recompute to
      76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f or the run
      halts.
    primes:
      stage_A: [7, 13, 19, 31]
      stage_B: [101, 1009, 10007, 100003]
      note: >-
        stage_A reuses the archived surfaces exactly; stage_B generates new
        surfaces in the IDENTICAL degree window at larger p, which is a change of
        p only and not a widening of the window.
    family:
      form: "y^2 = x^3 + a(t) x + b(t) over F_p(t)"
      deg_a_max: 2
      deg_b: 6
      a_nonzero: true
      j_nonconstant_required: true
    section_shape:
      deg_x_max: 2
      deg_y_max: 3
      exclude_y_zero: true
    n_range: [2, 3, 4, 5, 6, 7, 8]
    independence_requirement: >-
      Sections entering the slope fit must be certified independent in the
      Mordell-Weil lattice, so that the generic relation lattice R is zero and
      the measured lambda_1 is genuinely fibre-specific. The certificate is a
      nonsingular canonical Shioda height Gram. THIS CREATES AN EXPLICIT
      DEPENDENCY ON EXP-XEDN-affa94, which builds that instrument; if that
      contract's stage 1 refutes the recalled height theory, the certification
      here must be redesigned before this contract runs. Cells failing
      certification are REPORTED SEPARATELY, never dropped silently -- silent
      dropping is the censoring failure this audit raises against the census.
    master_seed: 20260805
    domain: "EXP-XEDN-9bd3bd/v1"
    seed_derivation_rule: >-
      All randomness derives from SHA-256 of the ASCII string
      domain || "|" || arm || "|" || decimal(p) || "|" || decimal(n) || "|" ||
      decimal(t0) || "|" || decimal(counter), big-endian unsigned. Arms are the
      literal strings "surface", "random-points", "subgroup-planted", and
      "baseline-n1". A uniform point of E_{t_0}(F_p) is drawn by rejection: take
      the digest modulo p as a candidate x, accept if x^3 + a x + b is a square,
      take the square root with the smaller canonical representative, and advance
      the counter on every digest whether accepted or not. A third party
      reproduces every instance bit-for-bit from
      (master_seed, domain, arm, p, n, t0, counter).
    environment_facts_measured_in_this_container:
      - "python3 -c 'import sage' -> ModuleNotFoundError. SageMath is ABSENT."
      - "numpy 2.4.6 present; sympy ABSENT."
      - "experiments/EXP-XEDN-001/xedni_sections.py imports and runs as pure Python."
      - >-
        CONSEQUENCE: elliptic curve arithmetic over F_p, baby-step giant-step
        discrete logarithm, Hermite normal form over Z, and shortest-vector
        enumeration in dimension <= 8 must all be implemented in pure Python.
        None of these requires a solver, so this contract has NO infrastructure
        request; the environment ambiguity recorded in the 2026-08-05 scouting
        brief is resolved for this contract's purposes and must be re-measured
        and recorded in the run's own environment.json.

  arms_and_controls:
    treatment: >-
      SURFACE ARM. For each (surface, good fibre t_0, n) cell: specialise n
      independence-certified sections to E_{t_0}(F_p); compute M_{t_0} as the
      order of the subgroup they generate; build K_{t_0} = ker(Z^n ->
      E_{t_0}(F_p)) exactly by discrete logarithm plus Hermite normal form;
      measure lambda_1^inf(K_{t_0}) by exact enumeration over the box; and
      measure the box's integer-point count.
    measured_null: >-
      RANDOM-POINTS NULL, matched on n, on M, on the fibre and on the group.
      Draw n uniformly random points of the SAME E_{t_0}(F_p), conditioned on
      generating a subgroup of the SAME order M, and run the identical
      K-construction and lambda_1 measurement. The only difference between the
      arms is whether the points came from sections of a surface. FORCED VALUE
      derived before the run: ratio 1.0. THE NULL CAN GENUINELY FAIL -- if
      specialised sections lie in special position the ratio drops -- and its
      failing is the outcome that would most raise the value of the whole XEDN
      lane. >= 50 matched pairs per (p, n) cell. Reported as a RATIO, never as a
      raw statistic.
    positive_control: >-
      SUBGROUP-PLANTED ARM. Replace each specialised point by k times itself,
      which forces the generated subgroup into index >= k and reduces M by a
      known factor. The effect that MUST appear: lambda_1^inf falls by
      k^(1/n) within tolerance. DECLARED THRESHOLDS, fixed before the run: at
      n = 4 and k = 16 the predicted drop is exactly 2.0 and the control passes
      only if the measured drop lies in [1.6, 2.5]; the same test is run at
      k = 4 (predicted 1.414, accept [1.2, 1.75]) and k = 64 (predicted 2.828,
      accept [2.2, 3.6]). IF LAMBDA_1 DOES NOT MOVE WHEN M IS DELIBERATELY
      REDUCED BY A FACTOR OF 64, the instrument is not measuring the lattice
      determinant, it is broken, and NO result may be reported from any arm.
    baseline_reproduction_control: >-
      n = 1 ARM. At n = 1 the kernel is the ideal (ord(sigma(P_1))) in Z,
      lambda_1^inf must equal that order EXACTLY, the box must contain exactly
      that many points, and meet-in-the-middle over it is BSGS at N^(1/2) -- i.e.
      the mechanism degenerates to the incumbent baseline on the nose. This is a
      frozen-fixture reproduction, not a resemblance. Any discrepancy at n = 1
      means the lattice construction is wrong and nothing at n > 1 may be
      reported.
    graded_control_n: >-
      7 interior points, monotonicity reported. Vary n = 2..8 at fixed
      (surface, fibre) and report lambda_1^inf(n). Pre-registered prediction:
      strictly decreasing, with lambda_1(n)/lambda_1(n+1) close to
      M^(1/(n(n+1))). A curve that FAILS TO DECAY as n increases is the canonical
      artifact tell of docs/inventor-protocol.md section 3 and localises the
      fault to the lattice construction instead of leaving "it did not work". A
      curve decaying FASTER than M^(1/n) refutes HEUR-XEDN-C1 in a stated
      direction and is itself a finding.
    graded_control_fibre: >-
      COMPARATOR-SPREAD ARM. On a fixed surface with fixed sections, report
      M_{t_0} and lambda_1^inf for EVERY good t_0 in F_p, and check that
      lambda_1 tracks M^(1/n) across fibres. This measures the quantity the
      generic relation class structurally cannot produce -- the generic class has
      identically zero spread across fibres -- and reporting a nonzero spread is
      the concrete demonstration that the two relation classes differ. At
      p = 1009 this is up to ~1000 fibres on one surface and is the cheapest
      high-resolution arm in the contract.
    nearby_object_sanity_arm: >-
      Apply the SAME cost accounting -- box volume, then AM-GM split -- to index
      calculus over F_p^* with a smoothness-certified factor base, an object
      where relation-finding is KNOWN to be subexponential. The accounting must
      reproduce that, not sqrt(N). If the same accounting returns sqrt(N) there,
      the accounting is wrong and T2/T3 of H-XEDN-2945b2 may not be reported at
      all. This is the inventor-protocol section 8 audit-4 nearby-object control
      applied to the COST MODEL rather than to the mathematics, and it is the
      arm most likely to catch an error in the derivation.
    ordering_control: >-
      The random-points null, the subgroup-planted positive control, and the
      n = 1 baseline are computed, written and hash-committed BEFORE any surface
      arm lambda_1 is examined. The commitment digest is recorded in the
      manifest. Absence of the commitment is invalid_measurement.
    comparability_policy: >-
      Declared substitutions and the scope each costs. (1) Discrete logarithms
      are computed by brute force or BSGS to BUILD K; this is available only at
      toy p and is an instrument, so no cost statement may be derived from its
      runtime and every cost number in the report must be traceable to the box
      volume. (2) stage_B generates new surfaces rather than reusing archived
      ones, so stage_A and stage_B are not the same population and must not be
      pooled in a single fit without reporting both separately. (3) No
      cross-comparison with EXP-XEDN-005/006/007 is made; those have different
      degree windows and a joint statement would need a separately registered
      comparator contract naming both.

  independent_variables:
    - p
    - surface, within the frozen degree window
    - t_0, over the good fibres of each surface
    - n, the number of independence-certified sections, 1 to 8
    - k, the planted subgroup index, in {1, 4, 16, 64}
    - arm: surface versus matched random points

  metrics:
    primary:
      - minkowski_exponent: fitted slope of log lambda_1^inf against log M at fixed n, with confidence interval and fit method
      - section_to_random_ratio: lambda_1^inf(sections) / lambda_1^inf(random points), matched on n, M and fibre
      - box_volume_vs_n: integer-point count of {|c_i| <= lambda_1^inf} as a function of n
      - M_over_N_distribution: M_{t_0} / N_{t_0} over all good fibres, per surface
    secondary:
      - N_{t_0} and the group structure of E_{t_0}(F_p) per fibre, not just the order
      - lambda_1^inf versus n curve with monotonicity verdict
      - subgroup-planted drop factor at k = 4, 16, 64 against the predicted k^(1/n)
      - n = 1 baseline reproduction, measured against ord(sigma(P_1)) exactly
      - measured meet-in-the-middle cost and the Pollard rho baseline sqrt(N) on the same fibre, same units
      - generic_relation_share from the archive, against the forced value 1.0
      - count of cells failing independence certification, reported separately and never dropped
      - nearby-object sanity result for index calculus over F_p^*

  preregistered_prediction:
    quantity: >-
      The shortest infinity-norm vector of the fibre-specific relation lattice
      K_{t_0} = ker(Z^n -> E_{t_0}(F_p)) for n independence-certified free-x
      sections.
    formula: >-
      lambda_1^inf(K_{t_0}) ~ M_{t_0}^(1/n) / 2, where M_{t_0} =
      |<sigma_{t_0}(P_1), ..., sigma_{t_0}(P_n)>| = [Z^n : K_{t_0}]. The upper
      bound lambda_1^inf <= M^(1/n) is UNCONDITIONAL, from Minkowski's convex
      body theorem applied to the cube [-lambda, lambda]^n of volume
      (2 lambda)^n. The matching lower bound is the Gaussian heuristic for a
      random determinant-M sublattice and is HEUR-XEDN-C1, not a theorem.
      Declared acceptance band for the fitted slope, fixed before the run:
      [0.7/n, 1.4/n].
    source: >-
      Minkowski's convex body theorem (standard; NOT CITED TO A SOURCE READ IN
      THIS SESSION -- the exact constant must be checked in the derivation
      stage), and the Gaussian heuristic for random lattices (classical, not a
      theorem in this setting, carried as HEUR-XEDN-C1 with its own falsification
      condition).

  heuristic_under_test: HEUR-XEDN-C1

  scale_relevance:
    tier: toy
    justification: >-
      The Minkowski upper bound is scale-free and its confirmation at toy p is a
      check of a derivation. The box-volume invariance is counting and is
      likewise scale-free. What is NOT scale-free, and is the reason stage_B
      exists, is the M/N distribution and the section-to-random ratio: both are
      arithmetic facts about the fibration that could behave differently at
      larger p, and the contract measures them over four orders of magnitude in p
      precisely so the p-dependence is visible rather than assumed. Even so,
      p <= 10^5 is toy and no outcome transfers to a deployed curve.
    correspondence: >-
      null. No sampling correspondence is used; instances are constructed
      directly and discrete logarithms are computed exactly at these sizes.

  tail_checks:
    - >-
      The extreme cells of the slope fit -- smallest predicted lambda_1 and
      largest -- are reported individually. Cells whose predicted lambda_1 is
      below 4 are EXCLUDED from the fit by a rule declared here before the run
      (the asymptotic has large relative error there), and the excluded cells are
      reported with their values rather than discarded.
    - >-
      The smallest and largest observed M/N per surface are reported beside the
      median, so a rare depressed-M fibre is visible rather than averaged away --
      a depressed-M subfamily is the only exponent-relevant outcome available and
      must not be smoothed out of the summary.
    - >-
      The thinnest archived cell (p = 31, 2 eligible surfaces) carries its count
      beside every derived statistic and supports no trend statement alone.

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 3

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6
    maximum_memory_gb: 4
    maximum_runs: 6
    no_network: true

  stages:
    - id: STAGE-0
      name: archive read
      cost: "zero compute, minutes"
      can_terminate_run: true
      description: >-
        Read the generic_relation_is_O field of every archived verified relation
        in RUN-XEDN-004-MAIN and confirm the census measured the generic class
        only. If ANY archived relation is fibre-specific, H-XEDN-2945b2's account
        of what the census measured is wrong and the run stops here with that as
        its result.
    - id: STAGE-1
      name: derivation
      cost: "pen and paper, hours, zero compute"
      can_terminate_run: true
      description: >-
        Derive in full and have checked: [Z^n : K_{t_0}] = M_{t_0}; K_{t_0} has
        full rank n for every good t_0; Minkowski on the cube giving
        lambda_1^inf <= M^(1/n); the box point count (2 lambda + 1)^n ~ M
        independent of n; and the AM-GM split bound |A| + |B| >= 2 M^(1/2).
        Establish the CORRECT function-field statement of specialisation over a
        finite constant field and record explicitly that Silverman's number-field
        theorem does not apply -- getting this backwards inverts the whole
        contract. A defect found here ends the line before any compute, which is
        the cheapest possible outcome.
    - id: STAGE-2
      name: exact lattices at tiny p
      cost: "pure Python, minutes"
      can_terminate_run: true
      description: >-
        At p in {7,13,19,31} on the archived surfaces: brute-force discrete
        logarithms, build K_{t_0} by Hermite normal form, measure lambda_1^inf by
        exact box enumeration, and check the n = 1 baseline reproduction. If the
        n = 1 baseline does not reproduce exactly, stop.
    - id: STAGE-3
      name: slope, M/N distribution, comparator spread
      cost: "pure Python, hours"
      can_terminate_run: false
      description: >-
        At p in {101, 1009, 10007, 100003} on newly generated surfaces in the
        identical window, using BSGS for discrete logarithms: fit the Minkowski
        exponent at each n, measure M/N over all good fibres, and run the
        comparator-spread arm across fibres on fixed surfaces.
    - id: STAGE-4
      name: nulls and controls
      cost: "pure Python, hours"
      can_terminate_run: false
      description: >-
        Run the matched random-points null, the subgroup-planted positive
        control at k = 4, 16, 64, the graded n-ladder, and the nearby-object
        sanity arm on index calculus over F_p^*. All committed in the declared
        order before the surface arm is read.

  stopping_rules:
    - Do not execute unless separately approved, frozen, and execution-authorized by the Coordinator. This contract carries no approved_by field.
    - Stop at STAGE-0 if any archived relation is fibre-specific.
    - Stop at STAGE-1 if the derivation is defective.
    - Stop at STAGE-2 if the n = 1 baseline does not reproduce exactly.
    - Stop before any surface-arm comparison if the null commitment digest is absent.
    - Stop a (p, n) cell after 50 matched null pairs or on exhausting the good fibres of that surface, whichever comes first.
    - Hard wall-clock stop at budget; completed stages remain valid at their own scope, and incomplete stages are reported as not run rather than as null results.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - The frozen predicate's recomputed sha256 differs from the recorded value.
    - A fibre with Delta(t_0) = 0 admitted to any arm.
    - Sections entering the slope fit without a nonsingular canonical height Gram certifying independence.
    - Cells failing independence certification dropped silently rather than reported separately.
    - The subgroup-planted positive control failing its declared band at k = 64.
    - The nearby-object sanity arm returning sqrt(N) for index calculus over F_p^*.
    - Any cost figure in the report traceable to the instrument's runtime rather than to the box volume.
    - The surface arm examined before the null commitment digest is written.

  infrastructure_failure_disposition: >-
    A timeout, crash, missing dependency, or memory exhaustion is reported as
    INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence against
    H-XEDN-2945b2, against H-XEDN-003, or against any proposition about elliptic
    surfaces or the ECDLP (AGENTS.md rules 3 and 5). In particular, failing to
    reach p = 100003 within budget means stage_B is reported at the primes that
    completed, with its scope narrowed accordingly, and never as a null result at
    the primes that did not.

  success_criterion: >-
    A run succeeds when: STAGE-0 confirms the archived relation class; STAGE-1's
    derivation is recorded in full with the specialisation statement established
    for function fields over finite fields; the n = 1 baseline reproduces
    exactly; the subgroup-planted positive control passes its declared bands at
    k = 4, 16 and 64; the nearby-object sanity arm reproduces subexponential
    behaviour for index calculus; the null arm is committed before the surface
    arm is read; and the contract reports, at toy scope only, the fitted
    Minkowski exponent with its confidence interval, the box volume as a function
    of n, the M/N distribution over good fibres, and the section-to-random ratio
    with its number of matched pairs. Reporting a fitted exponent consistent with
    1/n and a ratio consistent with 1.0 is a successful run; so is reporting the
    opposite. It establishes no ECDLP attack, cost, or exponent claim.

  falsification_criterion: >-
    H-XEDN-2945b2 is falsified by any of: a fitted Minkowski slope outside
    [0.7/n, 1.4/n] at n >= 4; a measured box volume that decreases with n; any
    archived census relation turning out to be fibre-specific; a
    section-to-random ratio systematically below 0.8 over >= 50 matched pairs
    (which would mean the surfaces carry real structure and would REOPEN the
    relation-source question rather than close it); or a median M/N below 1 on an
    identifiable subfamily (which would mean the cost conclusion does not apply
    there and would identify the exponent-relevant successor object). The last
    two are the outcomes this contract is most worth running for and the ones the
    hypothesis does not expect.

  required_artifacts:
    - experiments/EXP-XEDN-9bd3bd/runs/*/manifest.yaml
    - experiments/EXP-XEDN-9bd3bd/runs/*/results.json
    - experiments/EXP-XEDN-9bd3bd/runs/*/environment.json
    - experiments/EXP-XEDN-9bd3bd/runs/*/command.txt
    - experiments/EXP-XEDN-9bd3bd/runs/*/stdout.log
    - experiments/EXP-XEDN-9bd3bd/runs/*/stderr.log
    - experiments/EXP-XEDN-9bd3bd/runs/*/null_commitment.json
    - experiments/EXP-XEDN-9bd3bd/runs/*/derivation.md
    - experiments/EXP-XEDN-9bd3bd/execution_report.md

  approval_requirements:
    - Independent review confirms the derivation in STAGE-1, in particular that Silverman's specialisation theorem is correctly recorded as NOT applying over a finite constant field.
    - Independent review confirms the subgroup-planted positive control can fail and its bands were fixed before the run.
    - Red team confirms the random-points null is matched on n, M, fibre and group, and that the reported quantity is a ratio rather than a raw statistic.
    - Red team confirms no cost figure is traceable to the instrument's own runtime.
    - Coordinator confirms the dependency on EXP-XEDN-affa94 for independence certification is satisfied or separately discharged.
    - Coordinator separately approves, freezes and authorizes execution.
  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    contract is not approved and must not be executed in its current state.
  assigned_to: executor
