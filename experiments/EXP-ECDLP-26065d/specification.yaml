experiment:
  id: EXP-ECDLP-26065d
  hypothesis_id: H-ECDLP-f9a627
  question_id: RQ-ECDLP-002
  goal_id: null
  version: 1
  status: draft
  claim_tier: toy
  title: >-
    Obstruction-measurement protocol converting the blacklist barrier string
    D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier at 0717b2 into a filled
    obstruction block, with the barrier's own mechanism run as a self-falsifying
    conorm arm that is exact on the treatment side by exhaustion and an
    extension-field contrast that must win

  objective: >-
    Convert a barrier this program currently holds only as a string into a
    measurement another record can compare, re-scope or invert. Two
    deliverables. FIRST, a verification protocol whose artifact is an
    obstruction block conforming to templates/research-records.md, checked
    field by field against that template, and which FAILS if any required
    subfield is empty or is filled from a derivation rather than from runs.
    SECOND, the self-falsifying measurement the barrier's own mechanism
    predicts: the decomposition rate of conorm-image elements against the rate
    for uniformly random Jacobian elements, measured by one routine in one
    invocation. NO SPEEDUP IS SOUGHT AND THE ROUTE IS PREDICTED TO LOSE.

  independent_variables:
    - name: prime_p
      values: [65537, 1048583, 16777259]
    - name: element_source
      values: [uniform_ambient, conorm_image, extension_field_contrast]

  inputs:
    genus: 2
    curve_construction: >-
      genus-2 C over F_p with a nonconstant F_p-morphism to a given ordinary
      prime-order E, built by gluing; the construction is RECALLED and its
      feasibility is the first gate
    factor_base: degree-1 places with x-coordinate in a set of size B = p^(2/3)
    predicted_uniform_rate_per_prime: >-
      p^(-2/3), namely about 6.2e-4 at p = 65537, about 9.8e-5 at
      p = 1048583, and about 1.5e-5 at p = 16777259
    conorm_image_size_per_prime: about p, i.e. about 6.6e4, 1.0e6 and 1.7e7
    barrier_string_under_audit: >-
      "D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-delimiting-the-RM-escape-B1@0717b2"
    barrier_string_paired_candidate: >-
      "B1-Kani-torsion-glued-genus-2-Jacobian-with-real-multiplication-REPRESENTATION-CANDIDATE@0717b2"
    barrier_artifact_path: outputs/_blacklist_compact.txt

  metrics:
    primary:
      - name: decomposition_rate
        unit: decompositions per element tested (dimensionless probability)
        definition: >-
          The fraction of tested group elements that decompose over the factor
          base, measured by the SAME routine with the SAME factor base in the
          SAME invocation for every element source, so both sides of every
          ratio are counted in one unit.
      - name: conorm_over_uniform_rate_ratio
        unit: dimensionless ratio
        definition: >-
          decomposition_rate(conorm_image) divided by
          decomposition_rate(uniform_ambient), at the same prime and the same
          factor base.
      - name: obstruction_block_field_completeness
        unit: pass or fail per required subfield
        definition: >-
          Field-by-field check of the produced obstruction block against
          templates/research-records.md: statement, quantity, value with units
          and interval, measured_by, scope, and resource_check with examined
          and reading. Any empty required subfield is a FAIL.
    secondary:
      - name: relation_supply_factors
        unit: >-
          decomposition probability (dimensionless), realised factor-base size
          (places), relations needed (count), cost per relation (field
          operations)
        definition: >-
          The per-factor decomposition of the relation-collection cost, each
          factor with its own unit, reported per prime.
      - name: sparse_linear_algebra_cost
        unit: field operations
        definition: >-
          Reported SEPARATELY and never absorbed into the relation-collection
          total, because at these sizes it is not lower-order.
      - name: matched_rho_cost
        unit: group operations
        definition: >-
          Pollard rho on the SAME instances, so the dominated-route statement
          is measured rather than asserted.

  controls:
    - name: C-BARRIER-STRING-VERBATIM
      kind: audit reference check
      blocking: true
      description: >-
        Re-read outputs/_blacklist_compact.txt and confirm both named entries
        exist verbatim and that neither carries a quantity, unit, error bar,
        measured-by reference or scope. THIS COORDINATOR SESSION ALREADY
        PERFORMED THIS CHECK AND BOTH STRINGS RESOLVED EXACTLY; the executor
        repeats it so the audit rests on a run artifact rather than on a
        coordinator's reading. If a quantity is found, the premise of the whole
        protocol is wrong and the run stops.
    - name: C-CONTRAST-MUST-WIN
      kind: known-false nearby object, blocking
      blocking: true
      description: >-
        An extension-field instance at matched group size, where index calculus
        is KNOWN to pay. Its decomposition rate must be materially above the
        prime-field rate. A routine that reports the contrast case as equally
        barren is not measuring decomposition and every prime-field number in
        the run is void. LABELLED CONTRAST IN EVERY ARTIFACT AND NEVER USED AS
        PRIME-FIELD EVIDENCE.
    - name: C-CONORM-EXHAUSTIVE
      kind: exactness on the treatment arm
      blocking: true
      description: >-
        The conorm image of E(F_p) in Jac(C)(F_p) has about p elements and is
        enumerated EXHAUSTIVELY at every tested prime, so its decomposition
        rate carries no sampling error at all. All statistical uncertainty in
        the ratio sits in the uniform arm, which is why the required sample
        sizes below are stated for that arm only.
    - name: C-PLANTED-DECOMPOSITION-LADDER
      kind: positive control with predicted magnitude
      blocking: true
      description: >-
        Plant a defect of known size. Inject into the tested population a
        known fraction f of elements CONSTRUCTED to decompose over the factor
        base, for f in {1e-4, 1e-3, 1e-2}. The measured rate must rise by
        exactly f within its binomial interval at every prime. A routine that
        does not recover a planted 1e-3 excess cannot resolve the factor-2
        difference the conorm arm is asked to detect, and the run stops.
    - name: C-SINGLE-INVOCATION
      kind: unit-parity gate
      blocking: true
      description: >-
        Both arms use one routine, one factor base, one reduction
        implementation, in one process. A ratio assembled from two invocations
        with two factor bases is charged in two different units and is void.
    - name: C-RHO-MATCHED
      kind: frontier reference
      blocking: false
      description: >-
        Pollard rho measured on the same instances under one declared operation
        convention, so the statement that this route is dominated is a
        measurement rather than a restatement.

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The ratio of the conorm-image decomposition rate to the uniform ambient
      decomposition rate, at each tested prime.
    formula: >-
      ratio = 1 exactly, because the barrier's mechanism asserts that relation
      collection is governed by the ambient order p^g and is blind to the
      order-n subgroup. The uniform rate itself is predicted at (B/p)^2 =
      p^(-2/3), namely 6.2e-4, 9.8e-5 and 1.5e-5 at the three primes.
    source: >-
      The mechanism of the barrier entry
      D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-delimiting-the-RM-escape-B1@0717b2,
      read verbatim from outputs/_blacklist_compact.txt as a title string with
      no quantity attached, together with HEUR-001 of H-ECDLP-f9a627 for the
      absolute rate.

  band_non_degeneracy_analysis: >-
    COMPUTED BEFORE THE SAMPLE SIZES WERE FIXED.
    (1) THE DISCRIMINATOR CAN FIRE, AND THE REQUIRED SAMPLE SIZE IS COMPUTED
    RATHER THAN GUESSED. The treatment arm is EXACT by exhaustion, since the
    conorm image has only about p elements. To resolve a factor-2 difference at
    3 sigma the uniform arm needs n with 3 sqrt(r/n) at most r/2, i.e.
    n at least 36/r. With r = p^(-2/3) that is 58,000 samples at p = 65537,
    367,000 at p = 1048583 and 2,400,000 at p = 16777259. At about 10
    microseconds per decomposition test the largest of these is under a minute
    of CPU, so the arm is POWERED at every declared prime and no cell is
    underpowered.
    (2) THE ABSOLUTE-RATE BAND CAN MOVE. The predicted uniform rate is
    p^(-2/3); a factor-2 departure is resolvable at the same sample sizes, so
    HEUR-001 is genuinely falsifiable rather than decorative.
    (3) THE CONTRAST ARM IS THE PROVES-TOO-MUCH CONTROL AND IS BLOCKING. A null
    result on a prime field is produced equally by a real barrier and by a
    decomposition routine that decomposes nothing. Only the extension-field
    arm, where the conclusion is known false, separates them, so it is blocking
    rather than advisory.
    (4) A DEFECT OF KNOWN SIZE MUST FIRE AT THE PREDICTED MAGNITUDE. The
    planted-decomposition ladder at f in {1e-4, 1e-3, 1e-2} requires the
    measured rate to rise by exactly f. At p = 16777259 the base rate is 1.5e-5,
    so a planted 1e-4 is a 7.7-fold excess and a planted 1e-3 is a 68-fold
    excess: both are far above the resolution the sample sizes above supply,
    and the ladder therefore proves dynamic range at magnitudes bracketing the
    factor-2 effect actually under test.
    (5) NO EXPONENT BAND IS DECLARED, DELIBERATELY. Three rungs spanning 16 to
    24 bits cannot separate a fixed-genus asymptotic from a
    sparse-linear-algebra term that is not lower-order at these sizes. Rather
    than declare a band an exponent fit could not honour, the exponent is NOT
    fitted as a primary metric; per-size factor decompositions are the
    deliverable. This cell is declared out of reach rather than answered
    weakly.

  scale_relevance:
    tier: toy
    justification: >-
      Genus-2 Jacobians over prime fields with p from 2^16 to 2^24, so ambient
      group orders from about 2^32 to about 2^48. At these sizes the
      fixed-genus asymptotic regime is barely visible and the linear-algebra
      term is not lower-order. Transfer assumption, stated and NOT discharged:
      none. No per-size number is extrapolated to any other size and no
      exponent is asserted.
    correspondence: null

  tail_checks:
    - >-
      Report the rarest decomposition observed in each arm individually against
      its predicted probability, rather than only the mean rate. A single
      unusually smooth conorm image is the shape a genuine mechanism failure
      would take first.
    - >-
      Report the maximum over the exhaustive conorm enumeration of the number
      of distinct decompositions per element, against the uniform arm's
      maximum. Equality of means with differing tails is itself a finding.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 9

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 12
    maximum_workers: 1

  stopping_rules:
    - >-
      If the genus-2 gluing construction cannot be built at a prime within the
      per-run budget, stop that prime and record construction_infeasible. Under
      AGENTS.md rule 5 that is an infrastructure outcome and is NEVER evidence
      for or against the barrier.
    - If C-CONTRAST-MUST-WIN fails, stop and void every prime-field number.
    - >-
      If C-PLANTED-DECOMPOSITION-LADDER fails to recover a planted 1e-3 excess,
      stop; the routine cannot resolve the effect under test.
    - If C-BARRIER-STRING-VERBATIM finds a quantity attached to the barrier
      entry, stop; the protocol's premise is wrong.

  invalidation_rules:
    - Any rate computed from a second invocation, a second factor base, or a
      second reduction implementation.
    - Any conorm-arm rate obtained by sampling rather than by exhaustion.
    - Any obstruction block whose value subfield is filled from a derivation
      rather than from named runs.
    - Any use of the extension-field contrast number as prime-field evidence.
    - Any exponent reported as a primary result.

  success_criterion: >-
    C-BARRIER-STRING-VERBATIM, C-CONTRAST-MUST-WIN, C-CONORM-EXHAUSTIVE,
    C-PLANTED-DECOMPOSITION-LADDER and C-SINGLE-INVOCATION all pass; the two
    decomposition rates and their ratio are reported per prime with intervals;
    the per-factor cost decomposition is reported with the linear-algebra term
    separate; and an obstruction block is produced that passes the field-by-
    field completeness check against templates/research-records.md, including a
    resource_check with examined set and a written reading. The criterion is
    the production of a comparable, re-scopable datum, not any particular value.

  falsification_criterion: >-
    The barrier's MECHANISM is refuted if the conorm-image decomposition rate
    exceeds the uniform rate by a factor of 2 or more at any tested prime; that
    outcome reopens the lane at the tested scope, must go to independent
    adversarial review before any wider phrasing, and may not be described as a
    break. HEUR-001 is refuted if the uniform rate differs from p^(-2/3) by
    more than a factor of 2. The PROTOCOL fails, independently of any
    measurement, if the produced obstruction block has an empty required
    subfield or a value filled from derivation.

  required_artifacts:
    - the verbatim re-read of both blacklist entries with their file offsets
    - the genus-2 construction per prime, with its morphism to E as a witness
    - the exhaustive conorm-image enumeration and its decomposition outcomes
    - the uniform-arm samples at the computed sizes 58000, 367000, 2400000
    - the extension-field contrast arm outputs, labelled CONTRAST
    - the planted-decomposition ladder results at f in {1e-4, 1e-3, 1e-2}
    - the per-factor relation-supply table with each factor in its own unit
    - the sparse-linear-algebra cost, reported separately
    - the matched Pollard rho cost on the same instances
    - the produced obstruction block, and its field-by-field completeness check
    - run manifest per AGENTS.md artifact policy

  limitations:
    - >-
      THE SOURCE PROPOSAL IS WITHDRAWN AND SAYS IT IS NOT AVAILABLE TO
      /design-experiment. This contract is the obstruction-recording successor
      the withdrawal record itself endorses, and it re-files none of the
      withdrawn transfer claim. IT CARRIES NO APPROVAL. A Coordinator who reads
      the withdrawal as barring even this successor should refuse the contract
      on that ground, and the escalation is recorded here rather than resolved
      quietly.
    - >-
      THE ROUTE IS DOMINATED AND THE CONTRACT MEASURES THAT RATHER THAN HIDING
      IT. Pollard rho and BSGS dominate the described transfer on both time and
      memory, and the matched rho arm is run so the domination is a measurement.
    - >-
      UNREACHABLE AT SCALE, STATED PLAINLY. No asymptotic exponent can be
      established from three rungs at 16 to 24 bits, because the
      sparse-linear-algebra term is not lower-order there. The exponent is
      therefore NOT a primary metric of this contract; per-size factor
      decompositions are. A later contract wanting an exponent must state the
      rung count and separation that would support one.
    - >-
      The gluing construction is RECALLED and unverified by any agent in this
      program. Its failure is a feasibility outcome and never evidence.
    - >-
      The extension-field arm is a CONTRAST only. Its numbers may never be
      transferred to the prime-field case; the warning carried in KN-LIT-002 is
      the reason and is repeated in every artifact this run produces.
    - >-
      Scope: genus 2, three prime fields, one factor-base exponent, one gluing
      construction, one decomposition routine. Nothing transfers to other
      genera, other constructions, other fields, or cryptographic parameters.

  assigned_to: executor
  approved_by: null
