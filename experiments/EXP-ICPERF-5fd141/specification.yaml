experiment:
  id: EXP-ICPERF-5fd141
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted, and the restraint is deliberate:
    GOAL-DREG-001 carries several degree-growth hypotheses that it would be easy
    to attach this to. None of them is scored here. The finding in fact bears on
    whether those hypotheses were measuring their own object at all, which is a
    stronger reason to attach this record to no single one of them.
  version: 1
  title: >-
    EXTERNAL: Semaev 2015 Assumption 1 measured on its own diagonal -- a random
    subspace of dimension ceil(n/m) with a shape-matched null, and a sound
    d_F4 <= 4 refutation predicate
  status: external_completed
  status_note: >-
    `external_completed` for the reason given in EXP-ICPERF-779f11: the work is
    finished and content-bound, but this ledger's own status vocabulary carries
    an approval and review history this record does not have. approved_by is
    absent because no Coordinator approved it.
  external:
    repository: github.com/aburan28/crypto
    commit: 50ea716
    merge_discipline_note: >-
      Both pull requests were merged with MERGE COMMITS rather than squash --
      86f043d and 50ea716 -- so all four underlying commits (93dd1b3, ff17b06,
      c71a193, 81493cc) remain reachable. Unlike the earlier squash-merged pull
      requests in that repository, the shas recorded here still resolve.
    instruments:
      - examples/diagonal_assumption1.rs
      - examples/assumption1_refutation.rs
      - examples/assumption1_closure.rs
  objective: >-
    Measure Assumption 1 on the object it actually names. Semaev 2015 asserts
    d_F4 <= 4 for a Boolean system equivalent to eq. (5) where V is a subspace
    of F_{2^n} of dimension k = ceil(n/m). This program's existing ladder
    honours neither load-bearing word: koblitz_bench::subspace_ladder sets the
    dimension to ord_n(2), and invariant_subspace_basis returns a
    FROBENIUS-INVARIANT subspace -- a linearised-polynomial kernel from a factor
    of x^n - 1 -- where the assumption quantifies over subspaces generally.
    The experiment substitutes a uniformly random F_2-subspace of dimension
    exactly ceil(n/m), built by rejection on rank, with a matched null control.
  instruments:
    - id: diagonal_assumption1
      what: >-
        First fall degree and, where the Macaulay matrix fits, solving degree,
        on a random subspace of dimension ceil(n/m), against
        random_control_system as a NULL OBJECT matched on variables, equations,
        degree and mean monomial count.
      result: >-
        first fall 3.00 flat across n = 7..63; null 4.00 flat over the same
        range. The structure buys exactly one degree.
      history: >-
        The first version of this instrument used a REPLICATE as its control,
        which measures nothing. The 3-versus-4 separation became a claim only
        after the null was swapped in.
    - id: assumption1_refutation
      what: >-
        A sound refutation predicate for d_F4 <= 4 by degree-4 closure,
        reporting a verdict only on genuine convergence. Solves the S_3
        quadratic in x_3 via half-trace rather than sweeping the field; the
        first draft was O(2^{2n+1}) and hung at n = 15.
      result: >-
        REFUTED at every cell n = 5..21, converging in 2 or 3 rounds against a
        budget of 8. Polarity: the predicate that would witness d_F4 > 4 is
        itself refuted, so the assumption's bound is CONSISTENT with every cell
        reached.
    - id: assumption1_closure
      what: DOCUMENTED DEAD END, committed with its diagnostics rather than discarded
      result: >-
        Its predicate ("refuted OR all variables pinned") tracked
        DECOMPOSABILITY rather than degree, because the m = 2 swap symmetry
        guarantees at least two solutions. Cited by no observation in
        EV-ICPERF-a8080e.
  metrics:
    - mean first fall degree on a random F_2-subspace of dimension ceil(n/m)
    - mean first fall degree on the shape-matched random control
    - solving degree where the Macaulay matrix fits
    - >-
      number of ladder cells at m = 2 in n = 5..49 odd where
      ord_n(2) = ceil(n/2) -- a DEFINITIONAL count needing no run
    - degree and round count at which the d_F4 <= 4 predicate is refuted
  success_criterion: null
  success_criterion_note: >-
    Explicitly null, not omitted. These are observational instruments with no
    criterion to succeed or fail on. The dimension-mismatch count is
    definitional and could not have come out otherwise.
  budget:
    wall_clock_cap_seconds: null
    memory_cap_bytes: null
    budget_note: >-
      Null because this program set no budget for work it did not commission.
      The reachable range is bounded by the external repository's own field
      machinery, which is capped at n <= 64 with a 64-variable ceiling and
      Macaulay row and column caps -- so the flat-to-63 reading sits at the
      instrument's edge, not comfortably inside it.
  scope:
    claim_tier: toy
    field_degrees: >-
      n = 5..63 odd for first fall degree and the null; n = 5..21 for the
      refutation predicate; n = 5..49 odd for the dimension-mismatch count.
      Nothing at any cryptographic n, and in particular nothing at 131, 163,
      233, 283, 409 or 571.
    summands: >-
      m = 2. Its swap symmetry is real structure, and is what confounded the
      dead-end instrument, so these are not generic-m statements.
    measured_quantities: >-
      first fall degree and solving degree. NEITHER IS SEMAEV'S d_F4; the gap is
      this program's own KN-OPEN-d218ec and is not closed here. A value above 4
      in either column would not by itself refute Assumption 1, and both
      instruments print that warning in their own output.
    sampling: >-
      four trials per cell at a single seed family. Enough to see a flat
      3-versus-4 separation, not enough to characterise a distribution.
    what_it_does_not_touch:
      - the security of any curve, in either direction
      - >-
        the n = 40/45 boundary, which is NARROWED rather than settled: first
        fall is ruled out as its explanation and what does explain it is
        unknown. IMP-SEMBIN-ENGINE stays binding for that cell.
  review_status:
    independent_review_in_this_program: none
    external_automated_review: >-
      Automated review on the producing pull requests found two defects, both
      fixed. One was cosmetic: a hardcoded verdict string that ignored the
      degree flag. One was MATERIAL: the closure routine returned the same "not
      capped" signal on genuine convergence and on rounds-exhaustion, so a
      partial closure could have emitted a positive d_F4 >= 5 claim from an
      unfinished computation. Fixed with a three-valued enum and a `converged`
      column. The published rows are unaffected -- all converged in 2-3 rounds
      against a budget of 8. This is a real check but not this ledger's
      independence check.
  owner: coordinator
  created_at: '2026-09-17'
