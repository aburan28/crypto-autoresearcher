experiment:
  id: EXP-ECDLP-e70944
  hypothesis_id: H-ECDLP-7a7a08
  question_id: RQ-CLGRP-66ab7f
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    A race, not a sweep - two class-group algorithm families on identical
    discriminants at every rung, with a tabulated-invariant correctness null, a
    structureless-twin group, a swept synthetic-oracle crossover recovery, and
    unit counters beside wall clock

  objective: >-
    If separately approved, authorized and executed, locate by OBSERVATION rather
    than by fit the discriminant size at which a subexponential index calculus
    first becomes cheaper than a generic or analytic class-number computation,
    by running both families to completion on the SAME discriminants at every
    rung, and report the local exponent of each family separately. The
    deliverable is a statement about a cost MODEL and about the width of an
    interval, and it is nothing else.

  what_this_is_not:
    - Not a statement about elliptic curves or the ECDLP. The objects are class groups of imaginary quadratic orders and no transfer is claimed, implied or available.
    - Not a statement that any deployed parameter is adequate or inadequate. RQ-CLGRP-66ab7f forbids that in its own constraints and this contract inherits the prohibition.
    - Not a computation at any deployed discriminant size, which is proposed nowhere and possible nowhere here.
    - Not a new algorithm. Both families are external and are measured, not improved.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    MEASUREMENT AND EXTRAPOLATION ONLY, per RQ-CLGRP-66ab7f's declared
    claim_tier_ceiling. The exact scope a completed run could support is - on
    prime discriminants of the declared family, at the rungs actually completed,
    on one machine, with the named implementations, the two families' measured
    costs do or do not cross, the crossing has a stated interval, and each
    family's local exponent has a stated value. It cannot support a statement
    about any deployed parameter, about any deployed construction, or about
    elliptic curves.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) Both families reproduce independently tabulated class-group invariants
    exactly at every rung where a tabulation exists.
    (2) The synthetic oracle recovers EVERY injected crossover to within one
    rung, with the recovered locations monotone in the injected ones.
    (3) The generic family's cost on the structureless twin matches its cost on
    the real class group within the operation-cost calibration error.
    (4) A crossover exists strictly interior to the sampled window (two-regime
    reading) or index calculus is faster at every rung including the lowest
    (single-regime reading). These are mutually exclusive at every rung.
    (5) The crossover location under wall clock and under unit counts agree to
    within one rung; a larger discrepancy makes it implementation-determined.

  measured_quantities:
    - name: wall_clock_per_family
      definition: >-
        Elapsed wall-clock time for one family to complete on one discriminant
        with a verified certificate, on identical hardware.
      units: seconds
    - name: peak_rss_per_family
      definition: Peak resident set size for the same computation.
      units: gibibytes
    - name: class_group_compositions
      definition: >-
        Number of class-group composition operations executed, a
        machine-independent unit counter.
      units: compositions (dimensionless integer)
    - name: smoothness_tests
      definition: Number of smoothness tests executed, a machine-independent unit counter.
      units: tests (dimensionless integer)
    - name: crossover_bits
      definition: >-
        The bit-length of the absolute discriminant at which measured
        index-calculus cost first falls below measured generic cost on the same
        discriminants, taken as the median over the per-rung samples, with a
        bootstrap interval over discriminants. Reported SEPARATELY under wall
        clock and under each unit counter.
      units: bits of the absolute discriminant
    - name: alpha_local
      definition: >-
        Local log-log slope of median cost against the natural log of the
        absolute discriminant, by finite differences over adjacent rungs, per
        family, with a finite-difference error and the chord-versus-tangent bias
        reported as a stated systematic.
      units: dimensionless
    - name: certificate_cost
      definition: >-
        Cost of producing and verifying the certificate, counted SEPARATELY per
        family and never folded into the computation cost.
      units: seconds, and unit counters
    - name: per_rung_dispersion
      definition: >-
        Ratio of the slowest to the fastest sample within a rung, per family.
      units: dimensionless ratio
    - name: extrapolated_bits_spread
      definition: >-
        Spread, in bits, of the extrapolated cost at the declared reference sizes
        across the fitted and literature-constant cost models, reported as an
        INTERVAL and never as a point.
      units: bits

  metrics:
    primary: [crossover_bits, alpha_local, class_group_compositions, smoothness_tests, wall_clock_per_family]
    secondary: [peak_rss_per_family, certificate_cost, per_rung_dispersion, extrapolated_bits_spread]

  null_and_control_objects:
    - id: NULL-TABULATED
      name: correctness null against independently tabulated class groups
      construction: >-
        At every rung where an independent tabulation of the class group exists,
        both families must reproduce its invariants exactly.
      forced_value: exact reproduction
      non_vacuity: >-
        Capable of failing on either family independently, and a single mismatch
        voids that rung and every timing taken from it.
    - id: NULL-STRUCTURELESS-TWIN
      name: structure-free black-box abelian group
      construction: >-
        For each class group computed, a black-box abelian group of the SAME
        order and SAME invariant factors, built as a direct product of cyclic
        groups with a randomised encoding and an operation cost calibrated to
        match one class-group composition, with NO ideal structure anywhere. The
        GENERIC family is run against it. Index calculus cannot run on it at all,
        and that is the point.
      forced_value: >-
        Generic-family cost on the twin matches its cost on the real class group
        to within the operation-cost calibration error.
      non_vacuity: >-
        Genuinely capable of failing - if the generic timing is driven by
        class-group arithmetic rather than by group order, the twin will differ,
        and the measured generic exponent is then an implementation artifact
        rather than the literature row.
      consequence_pre_declared: >-
        IF THE TWIN REPRODUCES THE GENERIC ARM'S ENTIRE COST CURVE INCLUDING ITS
        LOCAL EXPONENT, THAT ARM IS A STATEMENT ABOUT GENERIC GROUP ORDER AND NOT
        ABOUT CLASS GROUPS, AND MUST BE REPORTED UNDER THAT SCOPE. Separately and
        UNCONDITIONALLY - nothing from this experiment, on either arm, may be
        quoted as a statement about elliptic curves or the ECDLP.
    - id: NULL-SYNTHETIC-ORACLE
      name: swept injected-crossover recovery
      construction: >-
        Both families stubbed with the modelled asymptotics and a KNOWN injected
        crossover, the injected location swept over at least 4 values spanning
        the window, the full pipeline run end to end on the stubs.
      forced_value: >-
        The pipeline recovers EVERY injected crossover to within one rung, and
        the recovered locations are monotone in the injected ones.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL. A pipeline that recovers
        one injected crossover has shown it can find a crossover in one place;
        sweeping the location forces it to TRACK a moving planted signal, which
        is what makes its report about an unplanted one credible. If it cannot
        recover a crossover known to be there, it cannot be trusted to report one
        that may not be.
    - id: CONTROL-UNITCOUNT
      name: implementation-asymmetry control
      construction: >-
        The crossover computed independently under wall clock and under each unit
        counter, and the seconds-per-unit ratio reported per family per rung.
      forced_value: crossover locations agreeing to within one rung across views
      non_vacuity: >-
        This is the DOMINANT confounder's only detector - a mature implementation
        of one family raced against a naive implementation of the other moves the
        observed crossover by an amount that can exceed the entire
        literature-constant ambiguity.
    - id: CONTROL-ERH
      name: conditional versus unconditional configuration
      construction: >-
        The generic family run in both a conditional configuration and a
        configuration using only unconditional bounds, reported separately.
      forced_value: none - both configurations are reported
      non_vacuity: >-
        Makes visible that the same hypothesis appears on BOTH sides of the
        ledger - it is what makes the attack cost model subexponential AND what
        makes the measurement's certificate cheap. A configuration using it on
        one side only corresponds to no coherent adversary model.

  scope_gate: >-
    Two gates, both evaluated before interpretation. FIRST, the structureless
    twin decides whether the generic arm is about class groups or about group
    order. SECOND, and unconditionally, nothing from this experiment is a
    statement about elliptic curves or the ECDLP; that is printed on the face of
    every quoted number.

  independent_variables: [rung_bits, discriminant_index, family, erh_configuration, injected_crossover_location, arm]

  preregistered_prediction:
    quantity: crossover_bits and alpha_local per family
    formula: >-
      The crossover is the smallest rung at which the median index-calculus cost
      over that rung's discriminants falls below the median generic cost over the
      same discriminants, with a bootstrap interval over discriminants. alpha is
      the finite-difference local log-log slope over adjacent rungs.
    source: ledger/hypotheses/H-ECDLP-7a7a08.yaml predictions P1 through P7
    values_frozen_here:
      rungs_bits: [64, 96, 128, 160, 192, 224]
      discriminants_per_rung: 5
      discriminant_family: prime D = -p with p congruent to 3 mod 4
      injected_crossover_sweep: at least 4 locations spanning the window
      oracle_recovery_tolerance: within one rung, at every injected location
      unitcount_agreement_tolerance: within one rung
      per_rung_dispersion_limit: factor 4 between fastest and slowest sample
      rung_spacing: fixed here; chord-versus-tangent bias computed and reported as a systematic
      literature_exponent_rows: re-verified at S0 from the sources, never taken from this contract

  decision_rule_that_falsifies: >-
    THE RECORD'S CENTRAL CLAIM IS FALSIFIED IF no crossover is observed anywhere
    in the reachable window and index calculus is faster at every rung including
    the lowest, with every control passing. The two-regime reading is then FALSE
    at the tested scope; the residual value is the measured single-regime
    exponent and a corrected crossover estimate.
    THE CLAIM IS SUPPORTED IN SCOPE IF a crossover is observed strictly interior
    to the window AND its location agrees to within one rung between the
    wall-clock and unit-count views AND every control passes.
    THE OBSERVATION IS DOWNGRADED TO IMPLEMENTATION-DETERMINED, and may not be
    reported as an algorithmic boundary, if the two views disagree by more than
    one rung.
    THE RUN IS INVALID, and no verdict of any kind may be reported, if more than
    one rung fails the tabulated-invariant null, if the synthetic oracle fails to
    recover any injected crossover, or if per-rung dispersion exceeds the frozen
    limit at a rung whose data enter a fit.

  stages:
    - id: S0
      name: literature re-verification and implementation validation
      terminates_run: true
      description: >-
        RE-VERIFY the literature exponent rows and constants against the primary
        sources; this contract deliberately carries none of them as asserted
        values, because the authoring agent did not open the papers and the
        source idea's session did not primary-read most of them either. Validate
        both implementations against known small-discriminant class numbers.
        Freeze the certificate standard and the unit-counting convention here.
    - id: S1
      name: synthetic-oracle recovery, swept
      terminates_run: true
      description: >-
        NULL-SYNTHETIC-ORACLE at every injected location. Failure to recover any
        one ENDS the run; the pipeline cannot report a crossover it cannot find.
    - id: S2
      name: correctness null
      terminates_run: true
      description: >-
        NULL-TABULATED at every rung with a tabulation. A mismatch voids that
        rung; more than one void rung ends the run.
    - id: S3
      name: structureless twin
      terminates_run: false
      description: >-
        NULL-STRUCTURELESS-TWIN at every rung. Its verdict is computed and the
        first scope gate evaluated BEFORE the generic arm's exponent is
        interpreted.
    - id: S4
      name: the race, rung by rung
      terminates_run: false
      description: >-
        Both families on identical discriminants at each rung, in both ERH
        configurations for the generic family, with wall clock, peak memory and
        both unit counters recorded, and certificate cost counted separately.
        Extend upward ONE RUNG AT A TIME until the per-rung budget is exhausted;
        the stop rule is declared here and is not revised mid-run.
    - id: S5
      name: fits, crossover, and interval
      terminates_run: false
      description: >-
        Compute the crossover under wall clock and under each unit counter, apply
        CONTROL-UNITCOUNT, fit local exponents with their finite-difference
        errors, and report the extrapolated-cost spread at the declared reference
        sizes as an INTERVAL with the model-derived caveat attached in the text
        and not in a footnote.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 5
    seeds_per_cell: 5
    seeds_policy: >-
      Discriminants are addressed by (rung_bits, discriminant_index) and are
      selected deterministically from the declared family by a SHA-256 over the
      ASCII bytes of the domain string, those fields, and the declared master
      seed, reduced to 64 bits and used as the start of a search for the next
      prime of the required residue class. The domain string is
      EXP-ECDLP-e70944/v1. BOTH FAMILIES CONSUME THE IDENTICAL DISCRIMINANT AT
      EACH (rung, index) - that is what makes it a race rather than two sweeps -
      and the twin group at that cell is built from the class group actually
      computed there. Injected crossover locations are enumerated, not sampled.
      The master seed is fixed in the frozen contract before any execution and is
      never re-drawn.
    determinism_requirement: >-
      Re-running any (family, rung, index) must reproduce the identical unit
      counters and the identical certified invariants. A family whose unit
      counters are not reproducible is reported as nondeterministic and its
      crossover contribution is reported under wall clock only.

  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 400
    maximum_memory_gb: 16
    maximum_runs: 200
    maximum_workers: 1
    note: >-
      Sized to the work. The largest rung dominates entirely - one run of each
      family at the top rung times the per-rung sample, plus the cheaper rungs.
      The per-rung ceiling is declared in stopping_rules and the run extends one
      rung at a time against it.

  stopping_rules:
    - NULL-SYNTHETIC-ORACLE fails to recover any injected crossover -> STOP, no crossover reportable.
    - More than one rung fails NULL-TABULATED -> STOP, the whole race is void.
    - Per-rung dispersion exceeds a factor 4 at any rung -> that rung cannot support a point estimate; no fit admissible until the sample is enlarged.
    - Either family exhausts the per-rung budget -> STOP extending; report the largest bit-length at which BOTH families completed with a verified certificate, as an infrastructure outcome.
    - A crossover coincides with the machine memory limit -> report it as a MACHINE boundary, not an algorithmic one.
    - Measured local exponent inconsistent with every re-verified literature row for a family across three consecutive rungs -> STOP; the race is measuring an unidentified third thing.

  invalidation_rules:
    - Any timing from a rung that failed the tabulated-invariant null is invalid.
    - Any crossover reported without both the wall-clock and the unit-count views alongside it is invalid.
    - Any comparison in which certificate cost was folded into one family's timing and not the other's is invalid.
    - Any configuration using the conditional hypothesis on one side of the ledger only is invalid, as it corresponds to no coherent adversary model.
    - Any extrapolated cost at a reference size reported as a point rather than an interval is invalid, per the question's own constraint.
    - Any statement that a deployed parameter is adequate or inadequate is invalid on its face.
    - Any statement about elliptic curves or the ECDLP drawn from this contract is invalid on its face.
    - Any negative derived from a budget-exhausted rung is invalid on its face.

  success_criterion: >-
    ALL of - (a) literature rows re-verified from primary sources at S0 and both
    implementations validated against known class numbers; (b) the synthetic
    oracle recovers every injected crossover within one rung, monotonically; (c)
    at most one rung voided by the tabulated-invariant null; (d) the
    structureless twin run at every rung and the first scope gate evaluated; (e)
    both families raced on identical discriminants at every completed rung, in
    both ERH configurations, with both unit counters and certificate cost counted
    separately; (f) per-rung dispersion within the frozen limit at every rung
    entering a fit; (g) the crossover computed under both views and
    CONTROL-UNITCOUNT applied; (h) local exponents fitted with errors and the
    extrapolated spread reported as an interval. Observing NO crossover is a
    SUCCESSFUL run of this contract; only failing (a) through (h) is
    unsuccessful.

  falsification_criterion: >-
    No crossover observed anywhere in the reachable window with index calculus
    faster at every rung, every control passing. H-ECDLP-7a7a08's central claim
    is then rejected at the tested scope. Secondary falsifiers of the DESIGN
    rather than the hypothesis - an oracle that cannot recover a planted
    crossover, a failing correctness null, a twin that does not reproduce the
    generic cost, a crossover that moves between views, or excessive per-rung
    dispersion. In every case the failing rung, family and control are named, and
    forward guidance names the next object - including the reusable capability
    number, the largest discriminant at which this program can certify a class
    group at all.

  required_artifacts:
    - results.json with wall clock, peak RSS and both unit counters per family per discriminant
    - certified class-group invariants per discriminant, and the independent verifier's transcript
    - the tabulation used at each rung and the per-rung match verdict
    - the structureless twin's construction, its operation-cost calibration, and its cost curve beside the real one
    - injected and recovered crossover locations for every synthetic-oracle setting
    - crossover location under wall clock and under each unit counter, with bootstrap intervals
    - local exponent per family per rung with finite-difference error and the chord-versus-tangent bias
    - certificate cost per family per rung, counted separately from computation cost
    - both ERH configurations' results, reported separately
    - the extrapolated-cost interval at the declared reference sizes, with its model-derived caveat in the text
    - the re-verified literature rows with the sources actually opened
    - artifact manifest with hashes and a rebuild receipt
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - stdout and stderr

  scale_relevance:
    tier: medium
    justification: >-
      Discriminants spanning roughly 64 to 224 bits, far below deployed sizes.
      The extrapolation to reference sizes is an explicitly uncertain fit whose
      INTERVAL is the deliverable; the deployed regime is not measured and is not
      claimed to be.
    correspondence: null

  limitations:
    - >-
      MEASUREMENT AND EXTRAPOLATION ONLY. Scoped to the tested discriminants,
      implementations, certificate standard and hardware. NOTHING HERE IS A
      STATEMENT ABOUT THE ADEQUACY OR INADEQUACY OF ANY DEPLOYED PARAMETER, and
      nothing here is a break of any deployed construction.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. The objects
      are class groups of imaginary quadratic orders.
    - >-
      Any bit numbers derived from crossover arithmetic are DERIVED FROM A COST
      MODEL, not measured. They set the vanishing term to zero and drop all
      constants outside the exponent, and must never be quoted as a security
      estimate.
    - >-
      The crossover, if observed, is a property of two IMPLEMENTATIONS at one
      maturity level on one machine. It bounds where a measurement programme's
      data come from; it does not establish which algorithm an adversary would
      choose.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - deployed discriminant sizes are far outside the reachable window
      and no computation at those sizes is proposed or possible here. The
      contract does not narrow its claim to pretend the deployed regime was
      measured; it reports an interval and a diagnosis.
    - >-
      Over the reachable window the quantity inside the subexponential exponent
      spans only a small range, so a modest vanishing term moves cost by a large
      factor. That the constant-in-front factor is bounded and slowly varying is
      ASSUMED, not known, and is this design's central weakness.
    - >-
      Changes no record's status.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, budget exhaustion or certificate-verification
    failure is INFRASTRUCTURE SIGNAL, recorded as failed_infrastructure with its
    cause and the largest rung completed by both families. It is NEVER negative
    mathematical evidence, and a budget-exhausted computation is a statement
    about this program's solver and never about the hardness of class group
    computation - which is both AGENTS.md core rule 5 and RQ-CLGRP-66ab7f's own
    constraint.

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record and alters no goal. The source idea
    flags one feasibility datum as load-bearing and requiring a primary read
    before the experiment is designed; that obligation is UNRESOLVED and is
    carried into S0.
