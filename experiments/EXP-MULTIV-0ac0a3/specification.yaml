experiment:
  id: EXP-MULTIV-0ac0a3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0a9533; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0a9533
  question_id: RQ-SNOVA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Second-moment overlap census of honestly generated SNOVA-shaped signatures against a uniform-valid-preimage
    null and a degraded-randomness positive control, over a geometric ladder in signature count.
  objective: 'The uncertainty reduced is whether a correctly randomised signer''s choice among valid
    signatures carries second-order information about the secret module, at toy parameters where the
    alternative choices can actually be enumerated. Stated as parts: (i) the run generates N honest
    signatures under one key with verified-distinct vinegars, accumulates their second-moment matrix,
    projects out the digest-forced component, and measures the overlap of the dominant eigenspace
    with the known oil module at each N on a geometric ladder, so that the N-dependence rather than
    a single number carries the inference; (ii) it builds the null by enumerating each digest''s full
    preimage and selecting uniformly, so that the null differs from the signal in the choice rule
    alone and in nothing else, which is the only null that can isolate the signing procedure; (iii)
    it includes a degraded-randomness arm whose overlap must be elevated, establishing before any
    negative claim is made that the statistic can see bias at all, and a random-module arm that measures
    the chance level directly rather than assuming it. The run recovers nothing, attacks nothing,
    and exercises no implementation.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: for the named toy SNOVA-shaped
      parameters and one idealised signing procedure, the second-moment overlap between honestly generated
      signatures and the secret module exceeds, or does not exceed, that of uniformly chosen valid
      signatures for the same digests, by the reported amount at each N, with the statistic demonstrated
      sensitive by the positive control. What does NOT follow: no key recovery and no method for one;
      no side-channel, timing, or fault claim, since no implementation is exercised; nothing about
      higher-order statistics; and nothing about deployed parameter sets, where the null used here
      cannot be constructed.'
  inputs:
    procedure: 'STAGE 0, structure freeze (cost: human): record the recalled signing procedure and
      the projection definition, flagged UNVERIFIED. STAGE 1, key and preimage tooling (cost: medium):
      toy key generator with planted module, exhaustive preimage enumerator with a size assertion
      against the expected count. STAGE 2, calibration controls (cost: minutes): random-module chance
      level and pre/post-projection comparison. STAGE 3, three arms (cost: hours): 10^4 honest signatures,
      10^4 uniform-preimage samples on the same digests, 10^4 degraded-randomness signatures; vinegar
      distinctness verified in the honest arm. STAGE 4, ladder (cost: minutes): overlaps at N in {10^2,
      10^3, 10^4}, repeated over 10 independent keys for dispersion. STAGE 5, sensitivity gate (cost:
      minutes): confirm the degraded arm''s elevated overlap before reading anything else. STAGE 6,
      reporting (cost: minutes): three curves, their differences, and the measured bound.'
    instrument: Python 3 with exact F_q arithmetic via precomputed tables for q in {2, 4}; the signing
      procedure, the preimage enumerator and the verifier written as separate modules so the enumerator
      cannot see the signer's randomness; second-moment accumulation in exact integer arithmetic over
      the prime field lift where possible, with eigenspace overlap computed as an exact normalised
      trace ratio of projectors rather than by any floating-point eigensolver. No computer algebra
      system and no Sage. Driven by harness/runner.py for seeds and manifest.
    parameters: q in {2, 4}; SNOVA-style ell = 2; v in {4, 5}; o = 2; flattened signature length at
      most 12 so that a digest preimage of size at most q^{flattened v} <= 4^10 is enumerable per
      digest with a cap; N in {10^2, 10^3, 10^4} with an attempt at 10^5 on the smallest cell; 10
      independent keys per cell; three arms plus the random-module control; degraded-randomness arm
      restricted to 16 distinct randomness values.
  controls:
  - Uniform-valid-preimage null on the same digests under the same key, generated in the same invocation.
  - Degraded-randomness positive control, which must show elevated overlap or the statistic is blind
    and no null result may be reported.
  - 'No-repetition verification: all vinegars in the honest arm confirmed distinct, since a repeat
    would import a different and much larger effect.'
  - 'Random-module control: measure the overlap against a random module of the same dimension instead
    of the true oil module; it must decay to chance in every arm.'
  - 'Digest-forced-component control: confirm that projecting out the digest-determined part removes
    the trivially forced overlap, by checking the overlap of the raw second moment before projection
    and reporting both.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a uniformly sampled valid signature for each of
    the SAME digests under the SAME key - a different point of the same preimage set - chosen uniformly
    rather than by the signing procedure. It is generated in the same invocation by enumerating the
    preimage at toy parameters. For the signal arm to mean anything, the null arm''s overlap must
    decay as N^{-1/2} and must not exceed chance at large N; if the null itself shows persistent overlap,
    then valid signatures are biased toward the module for reasons the verification equation alone
    forces, and no property of the signing procedure may be inferred. A degraded-randomness third
    arm serves as the positive control that the statistic can detect bias when bias exists.'
  independent_variables:
  - arm (honest, uniform-preimage null, degraded randomness)
  - signature count N
  - field size q
  - vinegar count v
  - target module (true oil module versus random module)
  metrics:
    primary:
    - overlap with the true oil module per arm per N
    - signal-minus-null overlap difference per N
    - overlap in the degraded-randomness arm
    - overlap with a random module (chance level)
    secondary:
    - dispersion across the 10 keys
    - preimage enumeration size per digest against its expected count
    - verified repeated-vinegar count
    - pre-projection versus post-projection overlap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The overlap between the dominant eigenspace of the projected empirical second-moment
      matrix and the secret oil module, as a function of signature count N, per arm.
    formula: 'Predicted null law: overlap(N) = c + a * N^{-1/2} with c the chance level measured directly
      by the random-module control and a a positive constant estimated from the null arm itself; no
      fit is used for the decision, which is made by comparing signal and null overlaps at each N
      against the null''s own across-key dispersion. Predicted degraded-arm behaviour: overlap(N)
      converging to a constant strictly above c by at least 0.2. Predicted repeated-vinegar count
      in the honest arm: exactly 0.'
    source: Pre-registered in the parent proposal IDEA-20260816-0a9533 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at flattened signature length at most 12 over q at most 4, chosen for one
      reason: the uniform-valid-preimage null requires enumerating a digest''s entire preimage, which
      is possible only here. That is a hard ceiling rather than a convenience, and it is stated as
      such. No transfer to deployed parameters is claimed, and at deployed parameters the null of
      this experiment does not exist, so no extrapolation is even definable.'
    correspondence: null
  tail_checks:
  - the largest N reached, where signal and null are closest and any true difference is most visible
  - the smallest N, where both arms are dominated by noise and must agree
  - q = 2, where the signature space is smallest and chance overlap is highest
  - a digest whose preimage is unusually small, where the null sampling is most constrained
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - abort if the degraded-randomness positive control shows no elevated overlap
  - abort if any repeated vinegar is found in the honest arm
  - cap preimage enumeration per digest; a capped digest is excluded from both arms symmetrically
    and the exclusion count is reported
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three arms plus the random-module control run in one invocation over the
    full N ladder, the positive control demonstrates sensitivity, the null decays as predicted, and
    the signal-minus-null difference is reported at each N with across-key dispersion whatever its
    sign.
  falsification_criterion:
  - Degraded-randomness control shows no elevated overlap.
  - Null arm overlap does not decay with N.
  - Random-module control shows overlap above the measured chance level.
  - A repeated vinegar appears in the honest arm.
  - Signal and null coincide at every N, falsifying the bias claim and yielding a measured bound as
    the deliverable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0a9533
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The projection that removes the digest-forced component is described but not defined precisely;
    it is the single most delicate step and must be written down and frozen by the Coordinator before
    approval.
  - Whether the second moment should be taken over signature vectors, over their module-coordinate
    representations, or over both is a modelling choice with a real effect on the statistic.
  - The recalled SNOVA signing procedure is UNVERIFIED and RQ-SNOVA-001 constrains experiment design
    pending primary sources; approval must address that constraint explicitly.
