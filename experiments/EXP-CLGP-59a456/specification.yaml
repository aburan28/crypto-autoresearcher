experiment:
  id: EXP-CLGP-59a456
  hypothesis_id: H-CLGP-63f471
  derived_from_idea: IDEA-20260807-1b7241
  question_id: RQ-CLGP-b99df5
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Interface-by-interface simulability audit of a curve-aware generic group model with exact vectorization,
    plus a paired class-augmented-rho harness that must show pure overhead in the closed model and a
    measurable benefit in a planted-bridge model whose benefit decays to nothing as the planted modulus goes
    to one
  objective: >-
    The one uncertainty a run reduces - whether granting an adversary the exact class-group coordinate of
    every curve in the instance's isogeny class, free and at unit cost, confers any advantage against the
    discrete logarithm in the point group. A run establishes (i) whether EVERY curve-level interface of the
    declared model is a deterministic function of the prime, the curve and the trace, which is a zero-compute
    audit and is the whole of the closure; (ii) whether the model degenerates correctly to the plain
    generic-group model at class number one; (iii) whether a class-augmented rho is strictly more expensive
    than plain rho at equal CHARGED cost with the isogeny-step price MEASURED rather than assumed; and (iv)
    whether the same harness detects a benefit in a planted-bridge model that differs in exactly one
    interface, and whether that benefit DECAYS to nothing as the planted modulus shrinks to one. Nothing here
    is a lower bound on the ECDLP, nothing here is a time-complexity statement, and the empirical arm is a
    consistency check on a symbolic lemma rather than its validation.
  what_this_is_not:
  - >-
    Not a lower bound on the ECDLP, and not a claim that no reduction from the ECDLP to the class group
    exists.
  - >-
    Not a time-complexity statement. The simulator's own running time is subexponential at cryptographic
    scale and is disclosed; quoting this as a time-complexity closure would be misreporting it.
  - >-
    Not a statement about adversaries that read x-coordinates as field elements. Index calculus, summation
    polynomials and every concrete-representation method live outside the model, and that residual class is
    NON-EMPTY and named.
  - >-
    Not a statement about multi-instance or preprocessing adversaries across a class, nor about adversaries
    whose queries depend on the concrete encoding.
  - >-
    Not an attack. The empirical arm is PREDICTED to be strictly worse than the incumbent and is run to show
    exactly that.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has been
    executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - in the declared model, exact vectorization and action oracles for the
      instance's own isogeny class give ZERO advantage and the generic-group query lower bound remains
      necessary; and, at the executed toy class sizes, a class-augmented rho costs the measured multiple of
      plain rho at equal charged cost while the planted-bridge variant shows the measured benefit with the
      measured decay. WHAT DOES NOT FOLLOW - anything about adversaries seeing an x-coordinate as a field
      element; anything about multi-instance or preprocessing adversaries; anything about TIME as opposed to
      QUERY complexity; and nothing whatever about the actual hardness of the ECDLP. A summary dropping any of
      those four qualifiers is overclaiming under AGENTS.md rule 4.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, HARD GATE, AND THIS IS THE WHOLE CHEAP CORE). Write the model down FORMALLY - the
      exact interfaces, the exact free information, the exact restriction - and run the interface-by-interface
      audit, one row per interface, each with an explicit verdict on whether it depends on the encoding or on
      the answer. If every interface is determined by (p, E, t), the lemma follows in two lines and the closure
      is established at ZERO COMPUTE. If any interface is not, the record is refuted, also at zero compute.
      Separately verify that the simulator's own reconstruction cost is disclosed and that the claim is stated
      as query complexity - getting this distinction wrong is the single most likely way the argument fails, so
      it is a named audit row rather than a remark.
      STAGE 1 (minutes). The class-number-one degeneracy check - the model must reduce exactly to the plain
      generic-group model, plain rho must match its standard constant within the declared tolerance, and the
      class-augmented arm must COINCIDE with the plain arm because there is nowhere to walk.
      STAGE 2 (hours). Implement class-augmented rho over a toy isogeny class - state (curve, point), transport
      by explicit small-degree isogenies, cycle detection and its mitigation, and a cost model charging isogeny
      steps at their MEASURED price on the same machine in the same unit - and run it against plain rho on
      IDENTICAL seeds, sweeping the isogeny-step probability.
      STAGE 3 (hours). Run the IDENTICAL harness in the planted-bridge model at several planted moduli and
      record the decay curve.
      STAGE 4 (zero compute). Write the residual open classes with pointers, so the closure carries forward
      guidance and not just a verdict.
    instrument: >-
      A written model specification with an audit table; then a class-augmented Pollard rho with distinguished
      points over a toy isogeny class, with transport by explicit isogenies on rational kernels and the
      transported pair re-verified, cycle detection and mitigation implemented and REPORTED, and an isogeny-step
      price MEASURED on the same machine in point-addition equivalents and recorded per instance. Seeds shared
      across arms so every comparison is PAIRED rather than distributional. Recorded through harness/runner.py.
    parameters: >-
      Toy ordinary curves with class number at least 100 for the step-probability sweep, because below about 20
      the augmented walk revisits curves constantly and its behaviour is dominated by the tiny state space rather
      than by the mechanism. A separate degeneracy fixture at class number 1 or 2. Isogeny-step probability swept
      over at least four values including 0 and 1. Planted modulus at three or more values spanning 1 to about
      the square root of the subgroup order. Cost unit - point-addition equivalents, with the isogeny-step price
      measured, never assumed. THERE IS NO STANDARDIZED PARAMETER SET IN SCOPE and none is implied; the empirical
      arm is a consistency check on a symbolic lemma.
  controls:
  - >-
    THE PLANTED-BRIDGE MODEL, MANDATORY AND BLOCKING, AND IT MUST BE A PLANTED-BRIDGE MODEL BECAUSE THE
    PREDICTION IS A NULL. Define a model identical to the closed one EXCEPT that the adversary additionally
    receives a leakage oracle returning the answer modulo a planted divisor of the class number, embedded in the
    class group. There the simulator PROVABLY FAILS, because the extra oracle is not a function of (p, E, t), and
    a class-augmented solver provably beats plain rho. The harness MUST be run in BOTH models - it must show no
    benefit in the closed one and a MEASURABLE benefit in the planted one. A harness that shows no benefit in the
    planted one CANNOT DETECT A BENEFIT AT ALL, so its closed-model null is void and the run set is INVALID
    rather than negative.
  - >-
    DECAY PARAMETER, THE PLANTED MODULUS. As it decreases to 1 the measured benefit must decay to zero. A benefit
    that PERSISTS at modulus 1 means the harness is leaking the answer through the instance generator or the seed
    schedule - the canonical artifact tell - and everything downstream is void.
  - >-
    MATCHED SHAPE. The planted model differs from the closed one in EXACTLY ONE interface, so the null object has
    the same shape as the object.
  - >-
    CLASS-NUMBER-ONE DEGENERACY. The class-augmented and plain arms must COINCIDE, and plain rho must match its
    standard constant within the declared tolerance, before any ratio is computed elsewhere.
  - >-
    PAIRED SEEDS. Identical seeds across arms, so the comparison is paired rather than distributional. Comparing
    arms on different seeds inflates variance enough to hide a factor-two effect at toy sizes.
  - >-
    MEASURED ISOGENY-STEP PRICE. The step price is measured on the same machine in the same unit and reported per
    instance. If an isogeny step were charged at one point addition, the augmented arm would look free and any
    conclusion would be worthless; this is the single largest confounder in the empirical arm.
  - >-
    CYCLE DETECTION AND ITS MITIGATION, IMPLEMENTED AND REPORTED. A class-augmented walk risks fruitless cycles
    through short isogeny cycles, exactly as rho variants using small-order maps do. An unmitigated cycle would
    make the augmented arm look worse for a reason unrelated to the obstruction.
  - >-
    CLASS-NUMBER FLOOR. Results below the declared class-number floor are reported as EXCLUDED rather than as
    evidence, since there the state space and not the mechanism dominates.
  independent_variables:
  - 'model: closed (CAGG) / planted-bridge'
  - isogeny-step probability q
  - planted modulus (planted-bridge model only)
  - class number of the instance (including the degeneracy fixture)
  - 'arm: class-augmented rho / plain rho, on identical seeds'
  metrics:
    primary:
    - >-
      dependent_interface_count - an integer, the number of curve-level interfaces found in the Stage-0 audit to
      depend on the encoding or on the answer. REQUIRED ZERO; a single dependent interface refutes the lemma and
      is the most valuable outcome available.
    - >-
      cagg_cost_ratio - dimensionless, per isogeny-step probability, with a PAIRED confidence interval. The
      charged cost to solve of class-augmented rho divided by plain rho, in point-addition equivalents, on
      identical instances and seeds, in the closed model. Required at least 1.0 and increasing in q.
    - >-
      planted_cost_ratio - dimensionless, per planted modulus, with a paired confidence interval. The same ratio
      in the planted-bridge model. Required below 0.6 at the largest planted modulus.
    - >-
      decay_curve - the planted_cost_ratio as a function of the planted modulus, required to rise MONOTONICALLY
      to within 10 percent of 1.0 at modulus 1.
    - >-
      degeneracy_check - PASS or FAIL. At class number 1 or 2 the augmented and plain arms coincide and plain rho
      matches its standard constant within the declared tolerance.
    secondary:
    - >-
      the audit table, one row per interface, with its verdict and the reasoning for it.
    - >-
      step_count_invariance - the measured step count (not charged cost) of the augmented arm against the standard
      rho constant, across q; predicted invariant in q. A step count DECREASING in q is the same event as the
      obstruction falsifier.
    - >-
      the measured isogeny-step price in point-addition equivalents, per instance, with its dispersion.
    - >-
      class number, subgroup order and the fruitless-cycle rate per instance, with the mitigation's effect
      reported.
    - >-
      charged cost per arm per instance per seed, retained in full rather than summarised.
    - >-
      the three residual open classes, written out with pointers.
  heuristic_under_test: H2
  heuristic_under_test_note: >-
    H2 (the charged-cost model for the class-augmented walk) is the only heuristic this contract tests, and it is
    tested in the empirical arm. H1 records that NO heuristic is load-bearing for the CLOSURE - the simulation
    lemma is an exact indistinguishability argument, the generic-group bound is a theorem, and transport is
    elementary - so the closure stands or falls on the Stage-0 audit and NOT on any measurement. A reader must not
    import conditionality from the empirical arm into the lemma, nor treat the empirical arm as the lemma's
    validation.
  preregistered_prediction:
    quantity: >-
      Four quantities, fixed before any run exists - dependent_interface_count, cagg_cost_ratio as a function of
      q, planted_cost_ratio at the largest planted modulus, and the decay_curve's endpoint at modulus 1.
    formula: >-
      Under the simulation lemma the class-level view is a deterministic function of (p, E, t), so
      dependent_interface_count is PREDICTED ZERO. Under H2 the charged cost of the augmented walk is
      (1 + q(r - 1)) times the plain cost, with r the measured isogeny-step price, so cagg_cost_ratio is PREDICTED
      at least 1.0, increasing in q, and matching that formula within 25 percent. In the planted-bridge model
      planted_cost_ratio is PREDICTED below 0.6 at a planted modulus of order the square root of the subgroup
      order, and the decay curve is PREDICTED to reach within 10 percent of 1.0 at modulus 1. Under the null that
      the class-group resource helps, cagg_cost_ratio would fall below 1 - which is precisely the falsifier.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-1b7241, predictions block, before any run under this
      contract exists. The overhead formula is derived from the standard birthday analysis of rho together with the
      observation that transport is a group isomorphism on the subgroup, and it is not fitted to any data. It may
      not be adjusted after a run except through a versioned amendment.
  scale_relevance:
    tier: toy
    justification: >-
      The CLOSURE is scale-free - it is a symbolic indistinguishability argument about a model and does not
      depend on any parameter size, so the Stage-0 audit carries the whole result at zero compute and at no
      scale at all. The EMPIRICAL arm is toy scale by necessity, since it must enumerate an isogeny class and
      walk it, and it is a CONSISTENCY CHECK on the lemma rather than its validation. The transfer assumption
      is therefore minimal and is stated - a class-augmented walk that costs more than plain rho at toy class
      sizes is expected to do so at any size, because the mechanism is a per-step price and not a scale effect,
      and the class-number floor exists precisely so that a small-state-space artifact is not mistaken for the
      mechanism.
    correspondence: >-
      The model GRANTS the adversary the ability to reach any specified curve at unit cost together with the
      exact address of every curve, so the hard side of the reachability question is handed over for free. That
      is the strongest possible form of the reachability grant, and the conclusion is unchanged - which is why
      no future proposal in this lane may claim value from cheaper reachability alone.
  tail_checks:
  - >-
    Report the UPPER TAIL of the step-count distribution for the augmented arm - the 95th percentile against the
    standard rho distribution's - since a mean that matches while the tail does not indicates cycle behaviour
    rather than a clean walk.
  - >-
    Report the fruitless-cycle rate per instance and the fraction of steps spent in mitigation, since an
    unmitigated cycle makes the augmented arm look worse for a reason unrelated to the obstruction.
  - >-
    Report the DISPERSION of the measured isogeny-step price across instances, not only its mean. A price that
    varies by more than the effect being measured makes the ratio uninterpretable.
  - >-
    Report cagg_cost_ratio separately at the smallest class number in the sweep and state whether it is excluded
    by the class-number floor.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Seeds are IDENTICAL across arms within a comparison, so the augmented and plain arms are paired at every
      seed; the three independent instances vary the instance generation. The Stage-0 audit is symbolic and its
      three instances are three independent readings of the same model specification, which must agree on every
      interface verdict.
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 16
  stopping_rules:
  - >-
    HALT at Stage 0 if any interface is found to depend on the encoding or on the answer. The closure does not
    hold, the record is superseded, and no empirical arm is run - the finding is the dependent interface.
  - >-
    HALT if the class-number-one degeneracy check fails. The model is malformed and no result may be read from it.
  - >-
    HALT if the planted-bridge model shows no benefit. The harness is blind, the run set is INVALID rather than
    negative, and no closed-model null may be reported.
  - >-
    HALT if the planted-bridge benefit fails to decay at planted modulus 1. The harness leaks the answer and every
    number is void.
  - >-
    Stop at the declared class-number floor, the declared step probabilities and the declared planted moduli. None
    is revised after a ratio is seen.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative
    result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is NEVER
    negative mathematical evidence (AGENTS.md rule 5).
  - >-
    A run in which the isogeny-step price was ASSUMED rather than measured on the same machine in the same unit is
    invalid_measurement. This is the single largest confounder and its mitigation is not optional.
  - >-
    A run in which the arms were compared on different seeds is invalid_measurement; the comparison must be paired.
  - >-
    A run whose planted-bridge arm was not executed in the same invocation as the closed-model arm is
    invalid_measurement.
  - >-
    A run reporting the closed-model result without carrying the MODEL NAME in the reported sentence is
    invalid_reporting. The strongest confounder here is rhetorical rather than statistical - it is very easy to
    state a model result and then discuss it as though it were about real adversaries.
  - >-
    A run reporting a result at a class number below the declared floor as evidence, rather than as excluded, is
    invalid_measurement.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    ALL FIVE of the following, each decidable from the primary metrics. (1) The audit table is emitted with one
    row per interface and an explicit verdict on each, and dependent_interface_count is reported. (2)
    degeneracy_check is reported. (3) cagg_cost_ratio is reported with paired confidence intervals at every swept
    isogeny-step probability, with the isogeny-step price measured and reported per instance. (4)
    planted_cost_ratio is reported at every planted modulus from an arm run in the same invocation. (5) The
    decay_curve is reported including its endpoint at modulus 1. NOTE that success means THE AUDIT AND THE HARNESS
    WERE RUN AND THEIR CONTROLS PASSED; whether the hypothesis is supported is decided by the pre-registered
    prediction and the falsification criteria, and a completed run that finds a dependent interface is a
    successful run and the most valuable outcome available.
  falsification_criterion:
  - >-
    dependent_interface_count is greater than zero - the simulation lemma is FALSE as stated, the closure does not
    hold, and the record is superseded. Cheapest and most valuable falsification, at zero compute.
  - >-
    cagg_cost_ratio falls below 0.9 persistently across seeds and instances - the obstruction is contradicted
    empirically. Escalate immediately for independent review and do NOT interpret until replicated, because the far
    more likely cause is a mischarged isogeny step than a real effect contradicting a proved lemma.
  - >-
    planted_cost_ratio shows no benefit at the largest planted modulus - the harness is blind; the run set is
    INVALID rather than negative.
  - >-
    The decay_curve fails to reach within 10 percent of 1.0 at planted modulus 1 - the harness leaks the answer
    and every number in the run set is void.
  - >-
    step_count_invariance fails with the step count decreasing in q - the same event as the obstruction falsifier.
  - >-
    degeneracy_check FAILS - the model is malformed and no result may be read from it.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and
    environment
  - >-
    the formal written model specification, hashed, with its exact interfaces and its exact restriction, written
    BEFORE the audit
  - >-
    the audit table, one row per interface, each with a verdict and its reasoning
  - >-
    raw-result.json carrying charged cost per arm per instance per seed, not summaries
  - >-
    the planted-bridge arm's measurements at every planted modulus, in the same file as the closed-model arm
  - >-
    the measured isogeny-step price per instance, with its dispersion, and the fruitless-cycle rate with the
    mitigation's effect
  - >-
    the three residual open classes, written out with pointers, so the closure carries forward guidance and not
    just a verdict
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because it
    authorizes execution and spends compute.
  - >-
    The parent proposal is proof-oriented and carries a proof_search_map, inherited into H-CLGP-63f471; it must be
    audited against KN-TECH-080 before implementation. Stage 0 alone establishes or refutes the closure at zero
    compute and is the natural first authorization; Stages 1 to 3 need not be authorized with it.
  - >-
    THIS CONTRACT CAN CLOSE AN ORACLE CLASS. Under the Coordinator's closure gate, a closure decision resting on it
    needs a complete obstruction block - the quantity, its value, the runs it is read from, and the scope claimed -
    and a genuine resource check. The obstruction quantity here is named in advance: dependent_interface_count
    equal to zero together with the measured cagg_cost_ratio, over the scope 'the declared model, query complexity
    only, adversaries that never see an x-coordinate as a field element'. A closure asserted over a wider scope
    than that is refused.
  - >-
    A red-team pass on the Stage-0 audit is required before the closure is recorded, and its most promising attack
    is named in advance - find an interface that lets the adversary EXPORT a handle into the curve world.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-1b7241
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's mechanism, minimal_test, controls,
      required_metrics, predictions, falsification_conditions and heuristic_assumptions, and restated as a contract.
      Boilerplate identical across contracts by program rule comes from a fixed table. Budgets come from the
      parent's declared estimated_cost (implementation medium, compute low), with the empirical arm sized for a toy
      isogeny class of at least a hundred curves. NO NUMBER IS INVENTED and no measurement is asserted; the closure
      is symbolic and the empirical arm is declared a consistency check rather than a validation.
  derivation_gaps:
  - >-
    The model's interface list is described but not enumerated here, and the audit is only as good as that list. It
    must be written formally and hashed BEFORE the audit runs - an interface omitted from the list is an interface
    the audit cannot fail on, which is the most likely way this contract produces a false closure.
  - >-
    The tolerance for the class-number-one degeneracy check and the 25 percent band on the overhead formula are
    stated but not derived. They should be pinned at approval, never after the ratios are seen.
  - >-
    The isogeny-step price is required to be measured but the measurement protocol is not specified. It must be
    fixed before the run, because a price measured on a different code path from the one the walk uses would
    reintroduce exactly the confounder the requirement exists to remove.
  - >-
    The class-number floor of 100 is a judgement about when the state space stops dominating, not a derived
    threshold. If it is wrong it is wrong in a versioned amendment before execution.
  - >-
    The three residual open classes are named in the parent but their pointers are not resolved here. They must be
    written out in Stage 4 with concrete record identifiers, because a closure without forward guidance is the
    fatigue report this contract exists to avoid being.
