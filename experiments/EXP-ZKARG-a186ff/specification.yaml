experiment:
  id: EXP-ZKARG-a186ff
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-65979d; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-65979d
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure the Fiat-Shamir query-budget exponent for a fixed three-round toy argument by exhaustive
    strategy enumeration and a swept Q-query cheating loop, against a matched random-attainable-set
    null arm
  objective: 'The one uncertainty a run reduces: how the non-interactive soundness error of a fixed,
    correctly instantiated Fiat-Shamir transform grows with the adversary query budget, at parameters
    where the answer can be computed rather than bounded. Specifically (i) it establishes the ground
    truth eps_I for the chosen protocol by exhaustive enumeration of the prover strategy tree and
    cross-checks it against the closed form, so that every subsequent number rests on a verified instrument
    rather than on an assumed value; (ii) it produces the empirical curve eps_FS(Q) with binomial
    intervals at eight geometrically spaced budgets and two independent hash instantiations, and fits
    a single exponent alpha over a pre-registered unsaturated window, giving one number with an interval
    as the deliverable; (iii) it runs the identical pipeline against a null object whose attainable
    sets are random subsets of the same size, so that any deviation of alpha from the coupon-collection
    geometry is attributable to protocol structure rather than to the loop, and so that agreement
    between the arms is recorded as a controlled null with the geometry named rather than as a failure.
    The run does not search for a forgery, does not weaken the transform, and does not touch any protocol
    outside the reference implementation written for this contract.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the named protocol at
      p equal to 257, q equal to 256, d equal to 4, r equal to 3, under the two named keyed-hash instantiations,
      over Q from 1 to 128 and 20000 keys per point, the measured non-interactive success frequency
      of an exhaustively optimal Q-query cheating prover is the tabulated curve, and the best-fit
      exponent over the pre-registered window is the reported alpha with its interval. What does NOT
      follow: nothing about protocols with other parameters or structure, nothing about any published
      or universal bound being tight or loose, nothing about any deployed, third-party, or standardized
      proof system, no attack, no break, no security consequence, and no statement that the Fiat-Shamir
      transform is more or less lossy than any accounting in use anywhere.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes) Fix and freeze the protocol description, p, q, d, r, the false
      statement, the two hash instantiations, the Q grid, the key count, and the fit window; write
      them into the specification before any code runs. STAGE 1 (cost: under one hour compute) Enumerate
      the first-message space M, compute the attainable set A(m) for every m, and derive eps_I as
      the maximum density; abort the run if it disagrees with the closed form. STAGE 2 (cost: minutes)
      Run the positive control d equal to q and the negative control d equal to zero through the full
      Q loop and require identically one and identically zero. STAGE 3 (cost: a few hours compute)
      For each hash instantiation, each Q in the grid, and each of 20000 keys, execute the Q-query
      loop with enforced distinct commitments and record success. STAGE 4 (cost: minutes) Execute
      the null arm in the same invocation with randomly drawn attainable sets of size d, same keys,
      same loop, same recording. STAGE 5 (cost: minutes) Fit both arms over the frozen window, compute
      intervals and residuals, and emit the two alphas. STAGE 6 (cost: equal to stages 1 to 5) Replay
      the entire pipeline from the recorded seed and require bit-identical frequencies before the
      run record is written.'
    instrument: Python 3 only, no Sage. Prime-field arithmetic implemented directly on Python integers
      in a single self-contained module; hashlib for keyed BLAKE2b and for the SHA-256-reduction challenge
      derivation; the standard library secrets and random modules with declared seeds for key sampling;
      numpy only for the least-squares fit and binomial intervals. Execution goes through harness/runner.py
      so that commit, environment, timing, resources, seeds and the immutable run record are captured
      by the existing wrapper, and the enumerated eps_I plus every control result are emitted as certificate-style
      artifacts re-checked by an independently written verifier function that shares no code with
      the enumerator.
    parameters: 'p equal to 257 with challenge set the 256 nonzero residues; a second point at p equal
      to 1021 with q equal to 1020 for a scaling check. Attainable-set size d in {0, 1, 2, 4, 8, 256}
      where 0 and 256 are the controls. Round count r fixed at 3. First-message space |M| capped at
      2 to the 16. Q grid {1, 2, 4, 8, 16, 32, 64, 128}. Hash keys per point: 20000, giving binomial
      standard error below 0.004 at frequency 0.5 and below 0.0004 at frequency 0.005. Two hash instantiations.
      Fit window: all Q with measured eps_FS strictly below 0.30 and strictly above 0.002, frozen
      before the sweep. Total hash evaluations at most 2 times 8 times 20000 times 128, about 4.1e7.'
  controls:
  - Null arm with randomly drawn attainable sets of the same size, executed in the same invocation.
  - 'Positive control: a protocol with d equal to q, where every challenge is answerable, whose eps_FS
    must be identically one at every Q.'
  - 'Negative control: a protocol with d equal to zero, whose eps_FS must be identically zero at every
    Q.'
  - Enumerated eps_I cross-checked against the closed form before any Fiat-Shamir loop runs.
  - Two independent hash instantiations, one keyed BLAKE2 and one keyed SHA-256 reduction, to show
    the fitted alpha does not depend on the hash choice.
  - 'Seed replay: the entire sweep re-executed from the recorded seed and required to reproduce every
    frequency bit for bit.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): NULL OBJECT: the identical protocol with a TRUE statement and an honest
    prover replaced by a random-guessing cheating prover whose attainable set A(m) is drawn uniformly
    at random as a subset of C of the same size d, independent of m and of the statement, with the
    identical Q-query loop, the identical hash instantiation, the identical fit, and executed in the
    same invocation as the signal arm. For the signal arm to mean anything the null must produce a
    fitted alpha statistically indistinguishable from the coupon-collection value implied by its own
    density d over q, since a random attainable set has no structure for the transform to exploit.
    If the null returns the same alpha as the signal arm, the measurement is reporting the sampling
    geometry of the loop and not any property of the protocol, and the result is recorded as a controlled
    null.'
  independent_variables:
  - query budget Q
  - attainable-set size d
  - hash instantiation
  - field size p
  - arm (signal versus null)
  metrics:
    primary:
    - eps_I from exhaustive enumeration
    - eps_FS(Q) with binomial 95 percent interval per Q
    - fitted alpha with 95 percent interval, signal arm
    - fitted alpha with 95 percent interval, null arm
    - ratio eps_FS(Q) over Q times eps_I per Q
    secondary:
    - strategy tree node count
    - enumeration wall time and peak memory
    - fit residual norm
    - count of rejected duplicate commitments
    - distinct-challenge count among the Q induced challenges
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exponent alpha in the least-squares fit of log eps_FS(Q) against log Q over the
      frozen window, reported separately for the signal and null arms, together with the ratio eps_FS(Q)
      divided by Q times eps_I at Q equal to 64.
    formula: 'Pre-registered null law: eps_FS(Q) equals 1 minus (1 minus d/q) to the power Q, the
      coupon-collection form for Q independent uniform challenges against a fixed attainable density
      d/q. Its local log-log slope at small Q d/q is 1, so the pre-registered alpha is 1.00 and the
      pre-registered ratio eps_FS(Q)/(Q eps_I) at Q equal to 64, d equal to 4, q equal to 256 is (1
      minus (1 minus 1/64) to the 64)/(64 times 4/256), which evaluates to approximately 0.6338/1.0
      equal to 0.634. A deviation is declared only if the measured interval excludes these values.'
    source: Pre-registered in the parent proposal IDEA-20260816-65979d before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at p equal to 257 and 1021 with challenge spaces of 256 and 1020 elements
      and first-message spaces up to 2 to the 16, chosen because the whole strategy tree is enumerable
      there and the optimum is attained rather than estimated. Transfer assumption, stated and not
      assumed true: any extension of the fitted alpha to challenge spaces of cryptographic size presumes
      that the coupon-collection geometry and the collision rate scale as the closed form predicts,
      which this run tests only at two field sizes; that is a two-point check and is reported as such.
      No cryptographic-scale claim is made and none follows.'
    correspondence: null
  tail_checks:
  - Inspect the largest measured eps_FS in the sweep for saturation and confirm it lies outside the
    frozen fit window.
  - Inspect the smallest measured eps_FS for counting noise and confirm at least 40 successes contributed
    to it, otherwise mark the point excluded.
  - Examine the per-key distribution of the number of distinct induced challenges and report its minimum,
    since a key with unusually many collisions is the tail that would distort a mean.
  - Report the single worst-case key by number of successful cheats and confirm it is consistent with
    the binomial tail rather than indicating a degenerate hash key.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt immediately and report an instrument fault if enumerated eps_I disagrees with the closed
    form or if either control fails.
  - Stop the sweep at the first Q whose measured eps_FS exceeds 0.9, since further points carry no
    fit information.
  - Cap total wall time at six hours; a timeout truncates the Q grid and is recorded as a budget outcome,
    never as evidence about soundness.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if eps_I is verified against the closed form, both controls
    pass, the full Q grid is measured for both hash instantiations and both arms with binomial intervals,
    and a fitted alpha with a 95 percent interval and residual norm is reported for each arm, whether
    or not the arms differ.
  falsification_criterion:
  - Enumerated eps_I disagrees with the closed form.
  - Positive control does not yield eps_FS identically one, or negative control does not yield identically
    zero.
  - Signal and null alphas agree within intervals at both field sizes, which falsifies the conjecture
    that this protocol's structure is visible in the query-budget scaling and closes the record as
    a controlled null.
  - Fitted alpha varies with hash instantiation beyond the reported intervals.
  - Fit residual norm exceeds the frozen threshold, so no exponent may be reported.
  - Seed replay fails to reproduce the recorded frequencies bit for bit.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-65979d
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact false statement and the algebraic structure that fixes A(m) to size d must be written
    down and checked by the Coordinator; the proposal names d as a parameter but does not construct
    the family.
  - The frozen fit-window thresholds 0.30 and 0.002 are chosen by judgement and need a Coordinator
    ruling before freezing, since they are the one free parameter that could be tuned after the fact.
  - Whether the second field size p equal to 1021 is enough for the stated two-point scaling remark,
    or whether the remark should be dropped entirely from the contract.
  - The precise definition of prover strategy equivalence used to bound |M| at 2 to the 16 without
    excluding a stronger strategy class.
