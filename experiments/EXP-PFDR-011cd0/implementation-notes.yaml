    root_step.sh:
      path: /tmp/claude-0/-home-user/015c3767-cc03-52db-9b0c-bd2aa6c26537/scratchpad/7f7a33/root_step.sh
      sha256: 294db34f0905090d67819d69780611e7f05a457312985fad0817ed58a220fc82
      text: '#!/bin/bash

        # root_step.sh RUN_DIR -- command...   : run a run-root step, log it into RUN_DIR/{command.txt,stdout.log,stderr.log}

        RD=$1; shift; [ "$1" == "--" ] && shift

        cd /home/user/crypto-autoresearcher

        TS=$(date -u +%FT%TZ)

        echo "$*" >> $RD/command.txt

        echo "[$TS] \$ $*" >> $RD/stdout.log

        echo "[$TS] \$ $*" >> $RD/stderr.log

        PYTHONDONTWRITEBYTECODE=1 "$@" >> $RD/stdout.log 2>> $RD/stderr.log

        RC=$?

        echo "[exit $RC]" >> $RD/stdout.log

        echo "$RC"

        '
    run_r10.sh:
      path: /tmp/claude-0/-home-user/015c3767-cc03-52db-9b0c-bd2aa6c26537/scratchpad/7f7a33/run_r10.sh
      sha256: 246bbbe207b1e3e0b700744da28b0ffa18dc121bb8c9cf5e8919c9685bfb7f9f
      text: '#!/bin/bash

        # R10 fix check driver (TASK-20261001-7f7a33)

        set -u

        cd /home/user/crypto-autoresearcher

        PY=/tmp/claude-0/-home-user/015c3767-cc03-52db-9b0c-bd2aa6c26537/scratchpad/venv-ci/bin/python

        S=/tmp/claude-0/-home-user/015c3767-cc03-52db-9b0c-bd2aa6c26537/scratchpad/7f7a33

        E=experiments/EXP-PFDR-011cd0

        RID=RUN-PFDR-011cd0-fix-check

        RD=$E/runs/$RID

        export PYTHONDONTWRITEBYTECODE=1

        SPEC=''run_jobs.py over the 45 fix_check_panel jobs, each: <PY> -m crypto_autoresearcher.index_calculus
        census --panel main --m <m> --bits <B> --curve-offset <c> --curves 1 --known-log-max-bits <24 if m = 3 else
        0> --relcount --solve-certs JOB/solve-certs.jsonl --workers 1 --out JOB/rows.jsonl --rows-out SCRATCH/<job>/harvest-rows.jsonl
        --staircase-out JOB/staircase.jsonl; then merge_relcensus.py fixcompare --old-runs experiments/EXP-PFDR-1b78f7/runs
        --new RUN_DIR --scratch SCRATCH --out RUN_DIR/fix-report.json''

        echo "[$(date -u +%FT%TZ)] R10 start"

        $PY $E/run_jobs.py jobs --run R10 --out $S/jobs-r10.json

        $PY $E/run_jobs.py run --run-id $RID --attempt-dir $RD/attempt-1 --jobs-file $S/jobs-r10.json --trigger
        "R10: the 45 frozen fix_check_panel jobs" --spec-command "$SPEC"

        $PY $E/run_jobs.py finalize-attempt --attempt-dir $RD/attempt-1 --run-id $RID --spec-command "$SPEC"

        echo "# run-root steps (canonical location = run root), cwd /home/user/crypto-autoresearcher" > $RD/command.txt

        $PY $S/root_env.py $RD/environment.json

        $S/root_step.sh $RD -- $PY $E/merge_relcensus.py merge --run-dir $RD --run-id $RID --attempts attempt-1

        $S/root_step.sh $RD -- $PY $E/merge_relcensus.py fixcompare --old-runs experiments/EXP-PFDR-1b78f7/runs
        --new $RD --scratch $S/r10-harvest-rows --out $RD/fix-report.json

        $S/root_step.sh $RD -- $PY $E/verify_solves.py $RD/solve-certs.jsonl.gz --out $RD/solve-verify.json

        echo "[$(date -u +%FT%TZ)] R10 steps done"

        '
    r10_raw.py:
      path: /tmp/claude-0/-home-user/015c3767-cc03-52db-9b0c-bd2aa6c26537/scratchpad/7f7a33/r10_raw.py
      sha256: c7df5f8bc55026bb2dc126118f346ed508824ea2c608800eb539dc97fd3ab511
      text: "import json, sys, hashlib, gzip\nrd = sys.argv[1]\nfr = json.load(open(f\"{rd}/fix-report.json\"))\n\
        sv = json.load(open(f\"{rd}/solve-verify.json\"))\nmr = json.load(open(f\"{rd}/merge-report.json\"))\ngr\
        \ = json.load(open(f\"{rd}/grel-report.json\"))\natt = json.load(open(f\"{rd}/attempt-1/raw-result.json\"\
        ))\nfrozen_fail = []\nfor e in fr[\"instances\"]:\n    bad = []\n    if e.get(\"problem\"): bad.append(e[\"\
        problem\"])\n    if e[\"solver_and_block_diffs\"]: bad.append(\"solver column / TT / TB / table / ss_store\
        \ / on / informative rank / saturation difference\")\n    if not e[\"staircase_equal\"]: bad.append(\"staircase\
        \ differs\")\n    if not e[\"harvest_rows_equal\"]: bad.append(\"harvest rows differ (other difference;\
        \ would need attribution)\")\n    if any(not p[\"new_ge_old\"] for p in e.get(\"ss_pairs\", {}).values()):\
        \ bad.append(\"SS pairs new < old\")\n    if e.get(\"ss_pairs_raw_eq_Ck2_from_rows\") is False: bad.append(\"\
        <= 24 bits: pairs_raw != C(k',2) from rows\")\n    if bad: frozen_fail.append({\"key\": e[\"key\"], \"reasons\"\
        : bad})\ntool_extra = [u for u in fr[\"unattributed\"] if u[\"reasons\"] == [\"pair difference without a\
        \ straddling x-group\"]]\ntool_other = [u for u in fr[\"unattributed\"] if u[\"reasons\"] != [\"pair difference\
        \ without a straddling x-group\"]]\nle24 = [e for e in fr[\"instances\"] if e[\"key\"][0] <= 24]\nraw =\
        \ {\"run_id\": \"RUN-PFDR-011cd0-fix-check\", \"location\": rd,\n       \"merge\": {k: mr[k] for k in (\"\
        expected_keys\", \"canonical_rows\", \"keys_with_exactly_one_canonical_row\", \"counts_by_status\")},\n\
        \       \"attempt_1_status_totals\": att[\"status_totals\"], \"attempt_1_gates\": att[\"gates\"],\n    \
        \   \"G_FIX\": {\"frozen_text_evaluation\": {\"pass\": not frozen_fail, \"instances\": len(fr[\"instances\"\
        ]),\n                                            \"failures\": frozen_fail,\n                          \
        \                  \"criteria\": \"every solver column, TT/TB block, informative rank, census_saturated_at_row\
        \ and staircase equal; SS pairs (at_stop, at_A_fix) new >= old; at <= 24 bits new pairs_raw == C(k',2) from\
        \ the retained rows; any other difference (rows, dup_formal, poisson_mean) needs attribution (none occurred:\
        \ harvest rows equal on every instance)\",\n                                            \"instances_le_24_bits\"\
        : len(le24),\n                                            \"le_24_bits_Ck2_equal\": sum(1 for e in le24\
        \ if e.get(\"ss_pairs_raw_eq_Ck2_from_rows\") is True),\n                                            \"\
        instances_with_pair_change\": fr[\"instances_with_pair_change\"]},\n                 \"fixcompare_tool_verdict\"\
        : {\"pass\": fr[\"pass\"], \"unattributed\": fr[\"unattributed\"],\n                                   \
        \          \"note\": (\"the pinned fixcompare also required, for every pair-count change, an SS x-group\
        \ of >= 3 members spanning >= 2 attempts in the RETAINED rows; this executor-added rule is not in the frozen\
        \ G-FIX text and cannot be evaluated above 24 bits, where rows after census saturation are not retained\
        \ (IC-5 default retention). The 9 instances it flags are exactly such instances; no other difference occurs\
        \ on them (deviation D-6)\"),\n                                             \"flagged_only_by_executor_added_rule\"\
        : len(tool_extra), \"flagged_for_other_reasons\": len(tool_other)},\n                 \"fix_report_sha256\"\
        : hashlib.sha256(open(f\"{rd}/fix-report.json\", \"rb\").read()).hexdigest()},\n       \"G_REL_supplementary\"\
        : {\"pass\": gr[\"pass\"], \"comparisons\": sum(v[\"compared_instance_class_scopes\"] for v in gr[\"runs\"\
        ].values()),\n                               \"mismatches\": sum(v[\"mismatch_count\"] for v in gr[\"runs\"\
        ].values()),\n                               \"note\": \"R10 harvest rows (task scratch) recounted by analyze_relcensus.py\
        \ grel; equality only\"},\n       \"certificate\": {\"instances_claimed\": sv[\"records\"], \"instances_verified\"\
        : sv[\"verified\"], \"verify_pass\": sv[\"pass\"],\n                       \"verify_report\": f\"{rd}/solve-verify.json\"\
        , \"verifier_sha256\": sv[\"verifier_sha256\"],\n                       \"certificates_file\": f\"{rd}/solve-certs.jsonl.gz\"\
        , \"certificates_sha256\": sv[\"certificates_sha256\"]},\n       \"canonical_files\": mr[\"canonical_files\"\
        ]}\njson.dump(raw, open(f\"{rd}/raw-result.json\", \"w\"), indent=1)\nprint(json.dumps({\"G_FIX_frozen_text_pass\"\
        : raw[\"G_FIX\"][\"frozen_text_evaluation\"][\"pass\"], \"tool_pass\": fr[\"pass\"],\n                 \
        \ \"flagged_only_by_extra_rule\": len(tool_extra), \"other\": len(tool_other), \"certs\": sv[\"records\"\
        ], \"verified\": sv[\"verified\"]}))\n"
    r10_grel_prep.py:
      path: /tmp/claude-0/-home-user/015c3767-cc03-52db-9b0c-bd2aa6c26537/scratchpad/7f7a33/r10_grel_prep.py
      sha256: b13ee9fb334d0a78fd6d9fc3a1292a7c109680c5ba0853365465abe4a7f9fbd8
      text: "\"\"\"Scratch-only view of R10 for G-REL: rows.jsonl.gz symlink + a merge-report whose harvest_rows_map\n\
        points to the scratch harvest rows of each job (R10 harvest rows are never archived).\"\"\"\nimport json,\
        \ os, sys, hashlib\nREPO = \"/home/user/crypto-autoresearcher\"\nrd = os.path.join(REPO, sys.argv[1]); out\
        \ = sys.argv[2]\nos.makedirs(out)\nos.symlink(os.path.join(rd, \"rows.jsonl.gz\"), os.path.join(out, \"\
        rows.jsonl.gz\"))\nmr = json.load(open(os.path.join(rd, \"merge-report.json\")))\nidx = json.load(open(os.path.join(rd,\
        \ \"attempt-1\", \"jobs-index.json\")))\nby_job = {j[\"job\"]: j.get(\"scratch_harvest_rows\", {}).get(\"\
        path\") for j in idx[\"jobs\"]}\nhm = {}\nfor k, src in mr[\"per_key_source\"].items():\n    p = by_job.get(src[\"\
        job\"])\n    hm[k] = {\"harvest_rows_file\": p, \"sha256\": hashlib.sha256(open(p, \"rb\").read()).hexdigest()\
        \ if p else None}\njson.dump({\"harvest_rows_map\": hm}, open(os.path.join(out, \"merge-report.json\"),\
        \ \"w\"))\nprint(len(hm))\n"
