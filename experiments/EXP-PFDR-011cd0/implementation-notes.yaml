  interpretations_fixed_before_data:
  - id: I-1 TB relation unit
    text: 'TB relations are carried by (base, tail) pairs only. CC-1 pairs (i, j), i >= 2, of a TB x-group are two
      tails, i.e. a TT pair by the harvester class definitions (harvest.py: TT = two stored tails sharing an x-key;
      TB = a stored tail whose x-key is a base x); CC-4 counts a relation in each class whose PAIRS carry it. Consistent
      with the harvester TB pairs_raw (k per group), L2 (TB multiplicity h + 1) and the TB model mean E''|F|2/(N(h+1)).
      Applied identically in harvest._RelCounter (star_pairs_only for TB), analyze_relcensus.recount and the T-REL
      brute force. star_groups_with_ge2_star_rows is reported per class so reviewers see how many TB groups the
      alternative literal reading would have changed.'
  - id: I-2 scopes
    text: 'In-process relcount scopes: TT/TB at_stop (= whole table); SS at_stop always and at_X_fix whenever an
      X_fix is set (search mode, census --budget-snapshot-only). No relcount at the at_A_fix scope.'
  - id: I-3 R_star
    text: R_star = distinct nonzero monic classes of the star pairs (1, j) (formal included); rho_rank = informative_rank(at_stop)
      / min(R_star(at_stop), U).
  - id: I-4 --retain
    text: 'retain changes only which rows reach the sink: default = the IC-5 rule; all = every row; xfix = SS rows
      with seq < X_fix (table rows all). The permutation staircases keep the IC-5 rule (bits <= 24). SS rows carry
      "seq" (the new element''s sequence number) only when an X_fix is set.'
  - id: I-5 rows_digest
    text: 'per digest class: sha256 over every emitted row in emission order, each line = JSON of the sink record
      without the instance key fields (sorted keys, separators , :) + newline (harvest.canonical_row_line); recorded
      with rows_digest_rows.'
  - id: I-6 search status
    text: table/search instances claim no solve; completed_valid when terminated_by is table_only / encoding_budget;
      a search that ends any other way is failed_infrastructure (never evidence). ok = completed as designed for
      these modes.
  - id: I-7 census row P
    text: census rows gain "P" beside relcount_version when --relcount is passed (G-CURVE compares (p, a, b, N,
      P) of every instance).
  - id: I-8 P0
    text: 'P0 estimates use the archived census-mode random arms at 30-32 bits, complete instances only (complete:
      retained class rows == rows_emitted; A_fix scope also complete when a retained row of a later attempt exists),
      recounted under CC-1. TT/TB scope stop, SS scope A_fix. rho1 = sum relations / sum model relations (TT: E''(E''-1)/N
      / C(2h,h)/2; TB: 2E''s/N / (h+1); SS: X_A(X_A-1)/N / Mbar, Mbar = sum pairs_from_rows / sum relations). D_R
      = pooled within-(curve, family) dispersion of the random triples with a 95% one-sided curve-cluster bootstrap
      upper bound (20000 replicates, seed SeedSequence([0x011cd0, 100])). Design means: rho1 x model at the design
      curves with E'' = exact stored-tail count (h = 2: s^2; h = 3: 4C(s+2,3) - 2C(s+1,2)); SS model at X_fix. E[C_R]
      (CC-9) uses the uniform model without rho1. The raising rule is evaluated with t*_plan of the declared design;
      t*_plan, power and X_rel are recomputed at the final design and reported. Power uses 4000 replicates x 5 seed
      families. Modeled disk/CPU are labelled modeled.'
  - id: I-9 P0X scope
    text: P0X compares the fixture rows with complete == true, random arm, whose file is in RUN-PFDR-1b78f7-census-m3/m4/m5
      (the card names only those runs as R10/R11 inputs); rows of other runs in the fixture are counted as skipped,
      not read. Completeness disagreements between the fixture flag and this recount's rule are listed separately
      (informational).
  - id: I-10 calibration groups
    text: 'G-NB-R groups (family, class, m, rung): TT/TB m_j = rho1_hat(class, m, rung) x mu_model(j), rho1_hat
      pooled over both families'' randoms (the notation omits family), mu_model(j) the mean over the family''s three
      randoms of the instance model mean; SS m_j = the rung mean of the family''s three randoms; D = max(D_hat,
      1) per (family, class, m, rung). CC-6 family drops at R15 use only the arms R15 may read (randoms, known-null)
      plus design unmatched_size; a structured or planted failure seen at R16 drops the curve from every cell of
      its family at R16 and is reported (late_drops_structured), t* unchanged.'
  - id: I-11 statistics
    text: 'z with SD_null = 0: 0 if C_A == C_R, +/-inf otherwise (same in data and simulation). Planted excess:
      Poisson-planted base + Poisson((k-1)M); compound-planted base + NB((k-1)M, D); kappa < 1 (A-INT only): binomial
      thinning. A-INT one-sided q uses |kappa_hat - kappa|/SE literally. Bootstrap n/(n-1) correction: interval
      endpoints scaled about the estimate by sqrt(n/(n-1)). PC-NULL (ii): one-sample KS against the pooled simulated
      null with the Stephens-corrected asymptotic Kolmogorov p. A2R excludes rungs with C_R = 0 (same rule in simulation).
      Coverage simulation: 2000 synthetic designs, primary q interpolated on a kappa grid 0.70..1.50 step 0.05,
      bootstrap with 200 inner replicates. PC-1 decision on TT+TB combined raw ratio, per class reported beside.'
  - id: I-12 seeds
    text: 'simulation seed family i: numpy.random.default_rng(SeedSequence([0x011cd0, i])), i = 0..4; every planted-excess
