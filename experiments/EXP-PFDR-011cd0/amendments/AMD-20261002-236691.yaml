    (sha256 80f14ec1...) writes attempt manifests through finalize-attempt,
    whose manifest body takes "task_id" and "protocol" from the module
    constants TASK (TASK-20261001-7f7a33) and PROTOCOL (version 1) and offers
    no override (rows PR-34 to PR-54). This is the fifth stop on this line
    from a Coordinator specification that the pinned code could not express
    as written. The defect is this Coordinator's drafting: the v5 reference
    table covered the pre-pin path only, not the execution path R12-R17. A
    stop for a protocol gap is a design question, never evidence (AGENTS.md
    core rule 5).

  # ---------------------------------------------------------------------------
  ruling_grounds:
    note: >-
      Stated before choosing among the executor's options. Four grounds
      only: protocol fidelity and record honesty; minimal change to pinned
      code; auditability; no weakening. Speed and favourability were not
      grounds. No census quantity exists; no R12-R17 directory exists.
    fidelity_and_honesty: >-
      D-7's intent is that every manifest states, truthfully, the protocol
      and task under which it was produced. A manifest carrying version 1
      and TASK-20261001-7f7a33 for an attempt run under a later protocol by
      a later task is a false record, and records are immutable, so it could
      never be corrected in place. Equally, a manifest whose code block lists
      a non-executed file as if executed, or carries a fixed note that no
      longer describes the run, is honest only if a fixed note says so.
    minimal_change: >-
      The launcher's bytes are the executed launcher for the job runs (jobs,
      run), and its status, certificate and checksum logic decide every
      attempt's validity. The least change is one that leaves every byte of
      run_jobs.py executed as pinned and replaces only the two data constants
      D-7 is about, at run time, in a recorded wrapper whose only effect can
      be demonstrated.
    auditability: >-
      Every helper is a committed file under amd-236691/, hashed and pinned
      before data, listed by sha256 in every manifest it touches
      (inputs.executed_sources), and its effect on the manifest is proved
      once, mechanically, against the unchanged writer on archived data (E-2
      P-FA).
    no_weakening: >-
      No gate, control, certificate rule, stop or machine limit is relaxed.
      Attempt manifests keep the full v6 block (OPT-4 rejected). The status
      rule stays the pinned finalize_attempt's (OPT-3 rejected, because it
      re-implements that rule outside the pins). Where the frozen text left a
      decision to the executor (root status, --gates-ok, gate output
      locations, continuation scope), it is fixed here mechanically and,
      where it touches validity, in the stricter direction.
    options_decided:
      OPT-1: >-
        TAKEN, in its smallest form (E-1): a recorded helper
        amd-236691/finalize_attempt_v6.py imports the unchanged run_jobs.py
        (sha256-checked), assigns exactly two module attributes, PROTOCOL and
        TASK, and then calls run_jobs.py's own main() on the unchanged
        finalize-attempt command line. PINNED_FILES is NOT changed; the
        executed set is recorded separately (E-4) through finalize-attempt's
        own --inputs-json option. Its sole effect is proved by E-2 before its
        first use on a real attempt.
      OPT-2: >-
        NOT TAKEN. A diffed launcher copy would put a second, modified
        launcher sha256 on the job-launch path (jobs, run) and require a new
        dummy-job exercise of everything the copy contains, for a change
        confined to two constants of the manifest writer. Not rejected on its
        merits; it is the fallback if E-2 fails.
      OPT-3: >-
        REJECTED. It re-implements finalize_attempt's raw-result,
        certificate concatenation, verify_solves call and status rule outside
        the pins: more unpinned code on the validity path than OPT-1 or
        OPT-2.
      OPT-4: >-
        REJECTED. It relaxes D-7 for attempt manifests, i.e. accepts records
        that misstate their protocol and task. That is a weakening of record
        honesty, not a gap repair.

