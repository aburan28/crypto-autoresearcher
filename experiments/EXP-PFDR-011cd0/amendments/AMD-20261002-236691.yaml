        7f7a33 scratch is never read or written.
        (4) merge_relcensus.py, verify_rows.py, verify_solves.py and the A-3
        copy write no manifest and carry no task or scratch identity
        (PR-98 to PR-100, PR-122 to PR-124, PR-127 to PR-129).
    - id: E-14
      name: rulings on the TASK-20261002-1069c1 package and its observations
      field: execution-report-594eab.yaml unexpected_observations and disclosures; implementation-notes-594eab.yaml
      rulings:
        - id: AMB-D7-FINALIZE-ATTEMPT
          ruling: >-
            Resolved by E-1 to E-4 (OPT-1 in its smallest form, proved by
            E-2). The executor's stop at order step (d) correctly applied
            CODE, EXACTLY AND ONLY and NO JUDGMENT ON SCOPE. It is not a
            deviation.
        - id: r11_raw_v5.py and the R11 finalize --extra file
          ruling: >-
            RATIFIED as recorded bookkeeping (sha256 1e92ae2e..., PR-18): it
