          design quantities derived from archived EXP-PFDR-1b78f7 random arms.
          design.json, power.json, p0x-report.json and raw-result.json of
          attempt-3 were NOT opened. No panel row, census count, kappa, z or
          dispersion of this experiment exists or was seen.
        measured_quantity_exposed: none of R12-R17
    conclusion: >-
      PRE-DATA for every census quantity. The rules changed here are
      manifest writing, bookkeeping, paths, record locations and mechanical
      status and stop rules; none depends on a design or census value, and
      none of the design values seen bears on any change made. Confirmatory
