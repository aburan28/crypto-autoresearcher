        everywhere (AMD-20261002-280481 A-4 (6); PR-133). R12 and R13 job lists
        pass --design-sha256 eb7e907d57b3486f5ceda4684498f6671e168df7925424c7522e13f0514ede0e
        (PR-74). Immediately before R15, R16 and the R17 job list, the
        executor re-hashes design.json and stops unless it equals that value
        (the tools do not check it there; PR-75, PR-104, PR-109). After R15,
        calibration.json design_sha256 (PR-105) must equal it; after the R17
        job list is written, its design_sha256 field (PR-76) must equal it.
        (3) R16 gets --calibration-sha256 equal to pins.calibration_json.sha256
        (E-12), which the tool re-checks (PR-108).
    - id: E-9
      name: gates -- locations, scopes and --gates-ok
      field: spec gates and gate_rule; spec R16 command
      rule: >-
        (1) G4-R: "verify_rows.py --run-dir <root> --out <root>/row-verify.json"
        at the R12, R13 and R17 roots after their merges.
        (2) G4-D: at every R14 attempt (inside finalize-attempt) and at the
        R14 root ("verify_solves.py <root>/solve-certs.jsonl.gz --out
        <root>/solve-verify.json").
        (3) After the R14 merge, at the R14 root, in this order: srchcompare
        --search <R13 root> --check <R14 root> --out <R14 root>/srch-report.json;
        tabcompare --table <R12 root> --search <R13 root> --out
        <R14 root>/tab-report.json; curvecheck --design <design.json path>
        --runs <R12 root> <R13 root> <R14 root> --out
        <R14 root>/curve-report.json; A-3 copy grel --runs <R12 root>
        <R13 root> <R14 root> --out <R14 root>/grel-report.json. A nonzero
        exit of these four tools is the gate verdict (pass false), not an
        infrastructure event, unless the report file is absent.
        (4) At R17: grel --runs <R17 root> --out <R17 root>/grel-report.json.
        G-CURVE is not applied to R17: design.json lists only panel curves
        (c < 20000) and the frozen G-CURVE text names panel instances.
        (5) gate_rule: any of these gates with pass false makes the location's
        run invalid (E-6) and NOTHING DOWNSTREAM IS READ (PR-135): the task
        stops after finalizing that location and returns. Consequently R15
        and R16 are reached only when every evaluated gate of gate_rule's
        first list has passed (G1', G2', G3', G-FIX and P0X passed earlier;
        G4, G5, G6 and G7 are in-process and would have made an attempt
        invalid). R16 is invoked with --gates-ok 1 (PR-111 to PR-113). It is
        never invoked with --gates-ok 0. PC-R (iii) is evaluated inside
        unmask, unchanged.
    - id: E-10
      name: attempts, continuations and stops
      field: spec stopping_rules (PR-136); job_layout
      rule: >-
        (1) Job lists are written to <scratch>/jobs-r12.json, jobs-r13.json,
        jobs-r14.json and jobs-r17.json by the unchanged "run_jobs.py jobs".
        Any job with rows_to_scratch true: stop (PR-63 to PR-68). "jobs --run
        R10" is never invoked.
        (2) "run_jobs.py run" gets --spec-command equal to the frozen command
        string of the run id (specification.yaml runs.list), the default
        --max-procs 4 and --watchdog 86400, and --trigger "<run> attempt-<N>
        (AMD-20261002-236691 E-10)".
        (3) An attempt finalized invalid: stop and return. No merge and no
        root manifest for that run; its root holds only attempt directories.
        (4) An attempt whose jobs-index.json not_started_reason is
        "not_started_attempt_watchdog", or which has jobs with
        watchdog_expired true and watchdog_seconds < 21600 (killed at the
        attempt deadline), gets ONE continuation attempt-(N+1) with --only
        exactly those jobs, under the same rules; repeat while the task
        watchdog allows. Jobs ended by the full 21600 s job watchdog, by
        RLIMIT_AS, or abnormally are not re-run (their keys are missing or
        failed_infrastructure).
        (5) A checkpoint (TW-DISK or a file above 95 MB): finalize the attempt,
        then checkpoint the task and return.
        (6) Then merge all attempts of the run ("merge_relcensus.py merge
        --run-dir <root> --run-id <id> --attempts attempt-1 [attempt-2 ...]").
        Merge exit 1 with missing keys only is not a stop: the root is
        failed_infrastructure (E-6) and the run order continues. Merge exit 3
        is a stop.
        (7) A run-directory location (R15, R16) that ends
        failed_infrastructure is finalized as such; stop and return. A run
        root finalized failed_infrastructure for any E-6 (b) reason other
        than missing keys alone (an absent gate report, an R17 step failure)
        is likewise finalized; stop and return. A run root or directory
        finalized invalid: stop and return (E-9 (5)).
        (8) Order: (a) re-verification; (b) helpers and P-FA, then
        pins.helpers; (c) R12; (d) R13; (e) R14 with its gates; (f) R15,
        then pins.calibration_json; (g) R16; (h) R17 only on O-CANDIDATE.
        The task watchdog (259200 s) checkpoints the task with a
        remaining-work list; it is never a result.
    - id: E-11
      name: R17 layout
      field: R17 command
      rule: >-
        R17 runs only if R16 analysis.json outcome_ids contains "O-CANDIDATE"
        (PR-117). Jobs: "run_jobs.py jobs --run R17 --analysis
        experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-analysis/analysis.json
        --design <design.json path> --out <scratch>/jobs-r17.json"; attempts
        as E-10; root steps: merge, verify_rows (row-verify.json), grel
        (grel-report.json), the view (E-7) and the view-map copy. Then the two
        analysis steps run under the wrapper in NEW step directories of the
        root, because exec refuses a non-empty directory (PR-85) while
        stage-r writes into and reads from --out (PR-116, PR-119 to PR-121):
        "<PY> run_wrapper.py exec --run-dir <root>/step-calibrate --run-id
        RUN-PFDR-011cd0-stage-r --exp EXP-PFDR-011cd0 --spec-command <frozen
        R17 command string> --watchdog 86400 --rss-cap-bytes 3500000000 --
        <PY> <A-3 copy> stage-r --runs-dir <scratch>/view-r17 --analysis
        experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-analysis/analysis.json
        --out <root> --step calibrate"; then pin stage-calibration.json
        (E-12); then the same exec with --run-dir <root>/step-unmask and
        "--step unmask --calibration-sha256 <pins.stage_calibration_json.sha256>"
        in place of "--step calibrate". Step directories are not attempts or
        canonical locations: they hold the wrapper's files only, have no
        manifest, and are covered by the root's checksums.sha256. Then
        write_raw_v6.py --kind stage-r-root, root_env.py, finalize-extra.yaml
        and the root finalize.
    - id: E-12
      name: record locations and the v6 pin file
      field: AMD-20261002-594eab D-5 and D-6 (from TASK-20261002-71b610 on)
      rule: >-
        (1) implementation-notes-594eab.yaml, execution-report-594eab.yaml,
        amd-594eab/ and runs/RUN-PFDR-011cd0-p0-design/attempt-3/ are
        archived by TASK-20261002-7505b5 (content-bound; PR-04, PR-05) and are
        read-only: appending a pin there would break that custody. From
        TASK-20261002-71b610 on, the PIN FILE is
        experiments/EXP-PFDR-011cd0/implementation-notes-236691.yaml and the
        execution report is
        experiments/EXP-PFDR-011cd0/execution-report-236691.yaml. Both are
        new, append-only (later sections appended with their own timestamp;
        nothing above edited).
        (2) Carried pins (restated by reference at order step (a), after
        re-verification, not re-pinned): pins_carried.a3_copy {sha256
        e80f6d6caceb6ff0de9982e945f66016c1b401ee393741111fe88c0b64d709b7,
        pinned_at '2026-10-02T08:08:45Z', source
        implementation-notes-594eab.yaml (TASK-20261002-7505b5)} and
        pins_carried.design_json {sha256
        eb7e907d57b3486f5ceda4684498f6671e168df7925424c7522e13f0514ede0e,
        pinned_at '2026-10-02T08:56:03Z', path attempt-3/design.json, same
        source} (PR-06, PR-07).
        (3) New pins, each {sha256, pinned_at UTC ISO-8601, basis}:
        pins.helpers (the sha256 of each amd-236691/ code file, after P-FA
        passes and before R12; the pinned sha256 of finalize_attempt_v6.py and
        check_parity_v6.py must equal the values parity-fa.json records,
        otherwise stop); pins.calibration_json (after R15 is
        finalized completed_valid, before R16); pins.stage_calibration_json
        (R17 only, before step-unmask).
        (4) Every other record that D-6 placed in the -594eab files goes to
        the -236691 files: build identity, the PR re-check results, P-FA,
        deviations, and the execution report content listed in the card.
    - id: E-13
      name: forbidden writers and launch modes
      field: new
      rule: >-
        (1) experiments/EXP-PFDR-1b78f7/amd-1de84f/run_wrapper.py finalize is
        never used: it writes task TASK-20260929-f90fed and the EXP-PFDR-1b78f7
        protocol block (PR-82 to PR-84). The wrapper is used for exec and post
