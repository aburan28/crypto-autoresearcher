  # ---------------------------------------------------------------------------
  machine_check_format:
    applies_to: [protocol_amendment.pre_run_reference_table]
    inherits: >-
      AMD-20261002-594eab protocol_amendment.machine_check_format (common
      rules and pre_pin_reference_table_row), with the additions below. Where
      they differ, the additions govern for this table.
    additions:
      - "Paths are repository-relative to /home/user/crypto-autoresearcher unless they begin with /. A path ending in '/' is a directory."
      - "file may be a list; the row's check then applies to every file in the list and passes only if it passes for each."
      - "locator 'yaml:<path>' loads the file with yaml.safe_load; 'json:<path>' with json.load. <path> is a sequence of segments joined by '.'; a segment written [\"...\"] is a literal key (it may contain dots and slashes); a segment written [N] is a 0-based list index. An empty path ('json:') is the whole document."
      - "locator 'line:N' is the 1-based line N of the file text split with str.splitlines(); locator 'file' is the whole file text; locator 'path' is the path itself."
      - "locator may be a list; expected is then a list of the same length and entry i of expected is compared with the value at locator i."
      - "check equals: Python == after loading, type-exact (an int is not a str; YAML null is None; lists compare element by element)."
      - "check line_contains: the line at the locator contains token as a substring; expected true."
      - "check contains: the string at the locator contains token as a substring; expected true."
      - "check count_equals with locator 'file': non-overlapping str.count of token over the whole file text equals expected."
      - "check sha256_equals: hashlib.sha256 of the file bytes, lowercase hex."
      - "check exists / not_exists: os.path.exists of each listed path (for not_exists: none of them exists)."
      - "check key_count: len() of the object at the locator. check keys_include: every key in expected is a key of the object at the locator."
      - "check datetime_order: each locator entry is '<file> yaml:<path>' or '<file> json:<path>'; each value is parsed as ISO-8601 (a trailing 'Z' read as +00:00); the values must be strictly increasing in the order listed; expected true."
      - "check dict_equal_except: performed exactly as the row's procedure states."
      - "check record: the observed value is recorded in the receipt; never a MISS."
      - "verified_by_coordinator_reading: true when this Coordinator read the location while drafting; false when only the top-level check can confirm it."
      - "recheck_by_executor: true when TASK-20261002-71b610 must re-check the row at time of use (order step (a)); false for rows that support only DEC-20261002-fb5717's validity and procedural rulings or describe archived history."
    rules:
      - "A row whose check fails, whose file is absent, or whose line, token or key is not found as stated is a MISS. Any MISS returns this amendment to the Coordinator before anything is committed (TASK-20261002-5077cb check (j))."
      - "Rows marked informational record a value and are never a MISS."
      - "Rows not listed here are not references of this amendment. Anything the next session finds missing that a v6 clause relies on is a stop under NO JUDGMENT ON SCOPE."

