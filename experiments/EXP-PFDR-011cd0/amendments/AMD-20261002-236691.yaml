    - id: E-15
      name: residual tool-versus-text stops (kept as stops)
      field: DEC-20261002-1efb1f OR-5
      rule: >-
        srchcompare and tabcompare count a key whose row is not
        completed_valid in either run (for example an instance-level
        failed_infrastructure row), and tabcompare also a key present in R13
        but missing in R12, as a gate failure (PR-96, PR-97). The frozen
        G-TAB/G-SRCH text compares instances "in both" runs, while
        stopping_rules let failed instances end as failed_infrastructure.
        This amendment does NOT pre-rule that semantics. If it arises, the
        executor applies E-9 (5) to the tool's verdict (the R14 root is
        invalid by the pinned verdict, nothing downstream is read) and
        returns the report's failures list; the Coordinator rules from
        statuses alone, which reveal no census quantity. All retained rows
        stay valid inputs to a later continuation.

