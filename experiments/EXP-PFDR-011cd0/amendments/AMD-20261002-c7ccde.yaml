# =============================================================================
# AMD-20261002-c7ccde -- PRE-DATA protocol amendment of EXP-PFDR-011cd0,
# protocol version 2 -> 3. ADDITIVE: specification.yaml (v1) and
# AMD-20261002-280481 (v2) are NOT edited.
# Approved by DEC-20261002-88c731 under the standing user authorization of
# 2026-09-06.
# Rules on ambiguity AMB-A3-FX31 of
# experiments/EXP-PFDR-011cd0/execution-report-amd280481.yaml: AMD-20261002-280481
# A-3 fixture_exercise (1) required retargeted step 31 to equal the after-D7
# log, while A-1 (b) and A-3 require the copy to stop on that step's input.
# This amendment fixes the v3 expected result of step 31, keeps the A-3 copy as
# built (sha256 e80f6d6c...), adds a fresh-session pre-pin re-verification,
# and moves the record locations of the continuation. It changes no
# threshold, prediction, statistic, cell, arm, seed, curve, mode, gate, outcome
# condition, raise-rule multiplier, P0 estimation rule or machine limit.
# =============================================================================
protocol_amendment:
  id: AMD-20261002-c7ccde
  amendment_id: AMD-20261002-c7ccde
  experiment_id: EXP-PFDR-011cd0
  hypothesis_id: H-PFDR-2765d2
  kind: additive
  version_from: 2
  version_to: 3
  recorded_at: '2026-10-02'
  authored_by: coordinator
  approved_by: coordinator
  approval_decision: DEC-20261002-88c731
  execution_handoff: TASK-20261002-7cf711
  output_archive: TASK-20261002-b905f7
  archived_by: TASK-20261002-1a4023
  amends: AMD-20261002-280481 (A-3 fixture_exercise (1) and pinning; A-4 (5) and (6) record and manifest wording; A-6 record locations)
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py and confirmed
    free with --check, then supplied to this Coordinator. The Coordinator has
    no shell and minted no identifier.
  authority: >-
    Coordinator, under the standing user authorization of 2026-09-06
    (AGENTS.md "Standing user authorization for ideas and experiments").
    CLAUDE.md: "Changing a frozen scientific protocol uses an additive
    amendment; never rewrite historical records". coordinator.md
    prohibitions: success criteria are not changed after observing outcomes
    without a recorded protocol amendment. This file is that record.
    Untouched: specification.yaml (v1); AMD-20261002-280481 (v2); every
    archived file of the TASK-20261001-b64be7 package; every file the
    TASK-20261002-07fdcb archive binds (the stopped TASK-20261002-ce5403
    package).

  precedence: >-
    Protocol version 3 = specification.yaml (v1) + AMD-20261002-280481 + this
    file. This file governs exactly where it names a field. Where it is
    silent, AMD-20261002-280481 governs, and where both are silent,
    specification.yaml governs.

  reason: >-
    TASK-20261002-ce5403 built the A-3 copy
    (experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.py, sha256
    e80f6d6caceb6ff0de9982e945f66016c1b401ee393741111fe88c0b64d709b7) and
    ran the A-3 fixture exercise on synthetic inputs only. 37 of the 38
    retargeted steps matched fixtures/exercise-log-after-D7.json, and P1, P2
    and P3 passed. Step 31 runs p0 on fixture C. The archived
    fixtures/make_fixtures.py (b64be7 package, written before
    AMD-20261002-280481 existed) relabels fixture C's synthetic archive from
    12 and 14 bits to 30 and 32 bits (its relabel = {12: 30, 14: 32}). Under
    A-1 (b), the qualifying (SS, 4) rungs are therefore drawn from {30, 32}
    only and can never equal {22, 24}. So A-1 (b) mandates the P0 stop on
    this input whatever the completeness counts are, and A-3 places that stop
    in the copy. A-3 fixture_exercise (1) nevertheless required step 31 to
    match the after-D7 log, which records design.json written. The two
    clauses cannot both hold. This is a drafting defect of
    AMD-20261002-280481, which this Coordinator wrote. It is not an
    implementation defect, and the executor correctly stopped before the
    pin. A protocol gap of this kind is a design question, not data, and is
    never evidence (AGENTS.md core rule 5).

  # ---------------------------------------------------------------------------
  ruling_grounds:
    note: >-
      Stated before choosing among the executor's options. Only three grounds
      were used: fidelity to AMD-20261002-280481's intent, blinding, and
      test-harness honesty. Speed and favourability of outcome were not.
      This Coordinator has seen no P0 estimate from any real archive, and the
      copy has never been run on one.
    fidelity: >-
      AMD-20261002-280481 states its intent in two places. A-1 (b): "If the
      computed selection is not exactly {22, 24}, or fewer than two rungs
      qualify, P0 stops before writing design.json and the executor returns.
      That is a Coordinator matter, not data." A-3: "one new helper that
      implements A-1 (b) and its stop". The stop is the substantive rule.
      The fixture exercise exists to check it and the non-regression of
      everything else. Exercise (1) was a regression check of the parts A-3
      did NOT change, plus a retargeting, and its author did not foresee
      that one retargeted step exercises the changed rule on an input where
      the rule mandates a different result. Fidelity therefore keeps A-1 (b)
      and A-3 as written and corrects the regression expectation only for
      the one step the substantive rule governs. That is OPT-1.
      OPT-2 rewrites the substantive rule: it removes the code stop for a
      wrong selection and replaces it with an executor check after
      design.json exists. OPT-3 replaces a committed fixture input of an
      exercise that A-3 defined as "the 38 steps of fixtures/exercise.py,
      retargeted". It also cannot keep "expectation unchanged", because the
      after-D7 design values were computed on fixture C, not on a 22/24
      archive.
    blinding: >-
      The A-1 (b) code stop exists so that no P0 estimate computed on an
      unratified rung selection is ever written before the Coordinator rules.
      Under OPT-2, a real-archive P0 run with a selection other than
      {22, 24} would write design.json and power.json, which carry P0-derived
      quantities (t*_plan, final n, predicted powers), and the executor would
      read them before returning. That is an exposure the v2 rule prevents.
      OPT-1 and OPT-3 both keep the code stop. Under all three options no
      real-archive P0 value has been computed so far, and none is computed
      before the pin.
    test_harness_honesty: >-
      A changed expectation must be derived from the rule, not read off the
      observation. The v3 expected result of step 31 (B-1) follows from
      A-1 (b) and the committed make_fixtures.py alone. Two parts of it are
      reproductions of what was recorded rather than derivations: the exact
      branch (selection [30, 32] versus fewer than two qualifying rungs), and
      the P0X counts. They are labelled as such and re-checked by a fresh
      session (B-3). Under OPT-1, step 31 is the ONLY exercise of the
      "selection is not exactly {22, 24}" branch of the stop; P2 covers the
      "fewer than two rungs" branch and P1 the design-written path. OPT-2
      would make step 31 pass only because fixture C's [30, 32] happens to
      equal I-8's band: a pass by coincidence that exercises no amended rule.
      OPT-3 would need a second test harness and new expected values, which
      means writing fresh expectations after observing a failure. What OPT-1
      loses is step 31's coverage of the design-written path on fixture C.
      Two things restore part of it. First, B-1 (iv) keeps the part of step
      31 that A-1 (b) does not touch: P0X runs and writes p0x-report.json
      before p0_estimates, so its content must still equal the after-D7
      values. Second, P1 covers the design-written path with the A-2 fields.
      The downstream design code (raise rule, t*_plan, CC-9) has no
      numeric regression reference in v3. The diff shows that code changed
      only by added label and p0_estimation fields. This residual is
      recorded, not hidden (B-6).
    options_decided:
      OPT-1: TAKEN, with the B-1 expected result stated from the rule and the B-3 fresh-session re-verification
      OPT-2: not taken; it rewrites A-1 (b)'s code stop, weakens blinding as above, and its step-31 pass would be coincidental
      OPT-3: not taken; it replaces a committed fixture input, cannot keep the expectation unchanged, and writes new expectations after a failure

  # ---------------------------------------------------------------------------
  pre_data_assessment:
    question: >-
      Is this amendment written before any observation of a quantity that
      R11-R17 measure or that P0 estimates from the real archive (rho1, D_R,
      Mbar per (class, m); t*_plan; predicted power; final n; any kappa, z,
      X_rel or dispersion of this experiment)?
    exposures_examined:
      - item: the A-3 copy
        observed: >-
          Run only on synthetic fixtures built by the archived
          make_fixtures.py and by make_p_fixtures.py, on 12- to 14-bit toy
          curves relabelled to 30/32 bits, with c in {0, 1}. Never run on an
          archived EXP-PFDR-1b78f7 file or a panel file (execution report
          a3_copy and r11_attempt_3 blocks).
        measured_quantity_exposed: none
      - item: this Coordinator
        observed: >-
          Read: the two -amd280481.yaml records; analyze_relcensus.diff;
          the head of exercise-compare.json and p-cases-log.json; the head of
          exercise_a3.py; and argument lines of the harness files and of
          make_fixtures.py. Synthetic fixture values were visible in them
          (step 31 old final_n and design_stop entries, the P3 SS5 D_R_ub95
          pair). None of these is a quantity of this experiment's real
          archive or census.
        measured_quantity_exposed: none
    conclusion: >-
      PRE-DATA for every census quantity and every real-archive P0 input. The
      expectation changed here is a synthetic fixture expectation, changed by
      a versioned record, with its derivation stated. Confirmatory status of
      every prediction and outcome condition is preserved.

  # ---------------------------------------------------------------------------
  changes:
    - id: B-1
      name: v3 expected result of retargeted fixture step 31
      field: AMD-20261002-280481 A-3 fixture_exercise (1), step 31 only
      rule: >-
        Under protocol v3, step 31 of the retargeted exercise ("p0 on
        synthetic inputs ...", fixture C) does NOT require identity with
        fixtures/exercise-log-after-D7.json. Its expected result is that the
        A-3 copy's A-1 (b) stop fires, as follows.
        (i) The exit code is 1.
        (ii) stderr carries the A-1 (b) stop message ("P0 stop
        (AMD-20261002-280481 A-1 (b)): ..."). The full stderr carries the
        p0_stop JSON with expected_rungs [22, 24]. Derived from the rule: on
        fixture C every qualifying rung lies in {30, 32}, so the selection is
        never {22, 24}. Reproduced from the record, not derived: the
        branch, qualifying_rungs [30, 32] and selected_rungs [30, 32]
        (completeness 12/12/12 at 30 and 32, as
        implementation-notes-amd280481.yaml and exercise-log-a3.json
        record).
        (iii) Neither design.json nor power.json exists in the step's --out
        directory.
        (iv) p0x-report.json exists in that directory. Its P0X comparison
        count and difference list equal the step-31 values recorded in
        fixtures/exercise-log-after-D7.json: 144 compared, and exactly one
        difference, with key [32, 0, 3, random_sub_r0, "on"], class TT,
        scope stop, reason "relation count differs". The P0X code is
        unchanged by A-3 (function-diff.json), and the copy writes
        p0x-report.json before p0_estimates runs.
        Each of the other 37 steps keeps A-3's requirement unchanged: every
        result is identical to fixtures/exercise-log-after-D7.json except
        timestamps and paths.
    - id: B-2
      name: comparison exclusions, made explicit
      field: AMD-20261002-280481 A-3 fixture_exercise (1), "except timestamps and paths"
      rule: >-
        Host timing and memory figures printed in stdout or stderr tails
        (wall seconds, CPU seconds, peak RSS) are measurements of the host,
        not results of a step. They are excluded in the same class as
        timestamps and paths. This is the reading TASK-20261002-ce5403
        applied to steps 3, 5, 7, 9, 11 and 13 (run_jobs.py dummy runs, which
        do not invoke analyze_relcensus.py). It is ratified. Exit codes,
        check results and every other printed or written value stay under
        the identity requirement.
    - id: B-3
      name: fresh-session pre-pin re-verification and pin of the copy as built
      field: AMD-20261002-280481 A-3 pinning; TASK order step (b)
      rule: >-
        The A-3 copy is NOT rebuilt or edited. The pinned file is
        experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.py at sha256
        e80f6d6caceb6ff0de9982e945f66016c1b401ee393741111fe88c0b64d709b7, as
        archived by TASK-20261002-07fdcb. Before pinning, the continuation
        executor (a fresh session) does the following.
        (1) Hash every amd-280481/ file, implementation-notes-amd280481.yaml
        and execution-report-amd280481.yaml against the TASK-20261002-07fdcb
        receipt path_sha256. Any mismatch: stop and return.
        (2) Apply B-1 and B-2 to the ARCHIVED log: exercise-log-a3.json
        against fixtures/exercise-log-after-D7.json. Steps other than 31
        must be identical under B-2. Step 31 must show exit 1 and the B-1
        (ii) stop message in its stderr tail.
        (3) In its own scratch directory, rebuild the fixtures with the
        archived fixtures/make_fixtures.py, invoked by path and unchanged.
        Re-run the archived amd-280481/fixtures/exercise_a3.py, unchanged,
        with --log experiments/EXP-PFDR-011cd0/amd-c7ccde/exercise-log-a3-rerun.json.
        Then invoke the exact step-31 command from that log once more,
        changed only in --out (a fresh scratch directory), capturing full
        stderr to experiments/EXP-PFDR-011cd0/amd-c7ccde/sx31-stderr.txt.
        Check B-1 (i)-(iv) on that invocation, and B-1/B-2 on all 38 steps of
        the re-run log.
        (4) Re-run the archived amd-280481/fixtures/make_p_fixtures.py and
        run_p_cases.py, unchanged, logging to
        experiments/EXP-PFDR-011cd0/amd-c7ccde/p-cases-log-rerun.json. P1,
        P2 and P3 must pass. Every check flag, selection, completeness
        table, compared value and listed value must equal the archived
        amd-280481/fixtures/p-cases-log.json, with timestamps, paths and
        timing figures excepted. A difference is an I-5 nondeterminism
        finding: stop and return.
        (5) One new harness file,
        experiments/EXP-PFDR-011cd0/amd-c7ccde/check_exercise_v3.py, may be
        written to perform (2)-(4). It writes
        experiments/EXP-PFDR-011cd0/amd-c7ccde/exercise-compare-v3.json. If a
        check of (2)-(4) cannot be performed unambiguously, for example
        because a p0x-report.json field cannot be mapped to the after-D7 log
        without judgment, stop and return.
        (6) Only if (1)-(4) all pass, record in
        experiments/EXP-PFDR-011cd0/implementation-notes-c7ccde.yaml the A-3
        copy's sha256 (e80f6d6c...) and a timestamp, as pins.a3_copy, before
        R11 attempt-3. From then on the A-3 pinning rule and A-4 apply
        unchanged, with this pin.
    - id: B-4
      name: record locations from the v3 continuation on
      field: AMD-20261002-280481 A-3 pinning (location), A-4 (6) (location), A-6
      rule: >-
        experiments/EXP-PFDR-011cd0/implementation-notes-amd280481.yaml and
        experiments/EXP-PFDR-011cd0/execution-report-amd280481.yaml are the
        archived record of the stopped TASK-20261002-ce5403 and are not
        edited. From TASK-20261002-7cf711 on, every record A-3, A-4 (6) and
        A-6 place in those files goes instead to
        experiments/EXP-PFDR-011cd0/implementation-notes-c7ccde.yaml
        (build identity, B-3 results, the A-3 copy pin, the design.json and
        calibration.json pins, deviations) and
        experiments/EXP-PFDR-011cd0/execution-report-c7ccde.yaml (the frozen
        execution-report content for R11 attempt-3 onward, the A-2 label,
        and the B-3 results). The archived amd-280481/ directory is
        read-only. New harness files and logs go only under
        experiments/EXP-PFDR-011cd0/amd-c7ccde/.
    - id: B-5
      name: protocol block of every new manifest
      field: AMD-20261002-280481 A-4 (5) and A-6 (protocol block wording)
      rule: >-
        Every new manifest (attempt, canonical location, run root) records
        protocol version 3, amendments [AMD-20261002-280481,
        AMD-20261002-c7ccde], and approval decisions [DEC-20261001-56f873,
        DEC-20261002-1efb1f, DEC-20261002-88c731]. R11 attempt-3's manifest
        is canonical as A-4 (5) states, with this protocol block.
    - id: B-6
      name: rulings on the stopped task
      field: execution-report-amd280481.yaml ambiguities, harness_notes
      rulings:
        - id: AMB-A3-FX31
          ruling: >-
            Resolved by B-1 to B-4 (OPT-1). The executor's stop before the
            pin was the correct application of NO JUDGMENT ON SCOPE and
            DEC-20261002-1efb1f OR-5. It is not a deviation.
        - id: HN-1
          ruling: ACCEPTED as disclosed (harness invocation path error; nothing was written; re-invoked with identical script bytes).
        - id: HN-2
          ruling: >-
            ACCEPTED as disclosed. A harness-only KeyError in
            make_p_fixtures.py, on synthetic data, occurred before any P0
            invocation. The partial scratch was removed and P1-P3 ran once
            with the fixed harness, whose hash is recorded. B-3 (4) re-runs
            that harness in a fresh session.
        - id: residual_downstream_coverage
          ruling: >-
            RECORDED. Under v3, the design-written path of p0 (raise rule,
            t*_plan, CC-9, final n) has no numeric regression reference on a
            fixture. It is exercised in P1 only, against no reference. The
            diff shows cmd_p0 changed only by the added p0_estimation block
            and label fields. This residual goes to the evidence review's
            implementation joint.

  affected_runs:
    - R11 (attempt-3 runs only after the B-3 pin; otherwise per AMD-20261002-280481 A-1..A-4)
    - R12-R17 (manifest protocol block per B-5; record locations per B-4)
  unaffected_runs:
    - R01-R10 (valid, immutable; not re-run)
    - R18 (not triggered)
  what_this_does_not_change:
    - AMD-20261002-280481 A-1 (a)-(e), including the code stop on any (SS, 4) selection other than exactly {22, 24}
    - A-2 (TA-1 and its label), A-4 (1)-(4) and (7), A-5, A-7
    - the A-3 copy's bytes, scope and diff, and the after-D7 identity requirement for every step other than 31
    - every threshold, prediction, outcome condition, tripwire, cell, curve, arm, seed, rung, mode, X_fix, counting convention, statistic, gate, raise rule, design_stop and machine protection limit of version 1 or 2
    - any hypothesis status
  confirmatory_status: preserved
  claim_ceiling_unchanged: >-
    As in AMD-20261002-280481: toy scale, one engine, generated curves,
    20-32 bits. The SS m = 4 power prediction is conditional on TA-1. A
    stop, memory error, watchdog or design stop is never evidence.
  supersedes: null
  superseded_by: null
  validation_note: >-
    tools/validate_ledger.py does not read experiment amendment files. This
    file is a protocol record whose authority is DEC-20261002-88c731. It is
    official only once the TASK-20261002-1a4023 receipt verifies.
