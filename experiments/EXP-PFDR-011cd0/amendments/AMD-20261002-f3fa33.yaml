  reason: >-
    TASK-20261002-7cf711 passed c7ccde B-3 (1) and stopped at B-3 (2). Under
    the literal v3 text, 8 of the 37 non-31 steps of the archived
    exercise-log-a3.json differ from fixtures/exercise-log-after-D7.json:
    steps 3, 5, 7, 9, 11 and 13 only in the OS process ids that run_jobs.py
    prints ("job ... started (pid N; ...)"), and steps 35 and 38 only in the
    value of the --calibration-sha256 argument of their cmd, which is the
    digest of a scratch calibration file that the copy writes with
    "created_at": now(). B-2 named timestamps, paths, wall and CPU seconds
    and peak RSS, did not name process ids, and kept "every other printed or
    written value" under identity, so neither class could be excluded
    without judgment. Process ids never repeat, so B-3 (3) could never pass
    either. This is the third stop on the same pin path from an identity
    rule that a correct, unchanged copy cannot satisfy (P0-SS4,
    AMB-A3-FX31, AMB-B3-2-PID). The defect is a class defect of this
    Coordinator's drafting: each rule named exclusions as an open-ended
    list read against "every other value", with no specification of which
    tokens of a recorded field are host provenance and which are results,
    and no test of the rule against the archived logs before issue. A stop
    for a protocol gap is a design question, never evidence (AGENTS.md core
    rule 5).

  # ---------------------------------------------------------------------------
  ruling_grounds:
    note: >-
      Stated before choosing among the executor's options. Three grounds
      only: fidelity to the intent of AMD-20261002-c7ccde B-2/B-3, test-harness
      honesty, and no weakening of scientific identity. Speed and
      favourability were not grounds. No real-archive P0 value and no census
      quantity has been computed or seen by anyone in this line.
    fidelity: >-
      B-2's intent was to exclude measurements of the host and keep every
      result of a step under identity; B-3's intent was a fresh-session
      re-verification that a correct, unchanged copy passes and a wrong one
      fails. A process id is OS-assigned provenance of the host, in the same
      class as a timestamp. A digest of a file whose bytes embed a timestamp
      is a function of that timestamp. Neither is a result. Keeping them
      under identity makes B-3 unsatisfiable by the very copy it is meant to
      pin, which defeats B-3's intent.
    test_harness_honesty: >-
      A comparison rule must say, before it is run, exactly which tokens it
      ignores and why, and must be shown to detect a planted change in a
      result token. CR-4 is a CLOSED list of host/provenance token classes,
      each defined by a pattern and, where structural, restricted to named
      steps; anything not on the list is compared exactly. The harness must
      pass positive controls (host-token changes are ignored) and negative
      controls (result-token changes are detected) before it renders any
      verdict (C-3).
    no_weakening: >-
      Every result token stays under exact identity: step labels, exit codes,
      expected exits, expectation flags, every check value (counts, keys,
      selections, estimates and floats compared with ==, digests of
      deterministic files such as certificates_sha256 and verifier_sha256),
      every other cmd token (including step 34's literal all-zero digest),
      and every other token of every stdout/stderr line (job names, job exit
      codes, row, status, missing and abnormal values, gate verdicts,
      matched and failure counts, t*, z, kappa, outcome ids). The masked
      calibration digest's correctness is carried by the step's own result:
      the copy refuses a non-matching digest with exit 3 (step 34), so exit
      0 at steps 35 and 38 proves the digest matched the file of the same run.
    options_decided:
      OPT-A: >-
        TAKEN IN GENERALISED FORM. Process ids are ruled host provenance, and
        the calibration digest is ruled a volatile-file digest, but not by
        an instance patch: by the closed specification CR-4 that covers every
        identity comparison on the pin path, with controls. cmd is NOT ruled
        "an input outside identity"; it stays under identity except the named
        tokens.
      OPT-B: >-
        NOT TAKEN. Restricting identity to label, exit_code, expected_exit,
        check and expectation_met drops identity on result values that only
        the tails carry (for example the per-job rows, statuses and missing
        counts of steps 3-13, and the gate verdicts and counts printed by
        steps 16-30 that have no check field). That weakens scientific
        identity.
      OPT-C: >-
        NOT TAKEN. It makes the correct, unchanged copy unpinnable for ever
        and so defeats B-3's intent; it is premature closure by protocol.

  # ---------------------------------------------------------------------------
  pre_data_assessment:
    question: >-
      Is this amendment written before any observation of a quantity that
      R11-R17 measure or that P0 estimates from the real archive?
    exposures_examined:
