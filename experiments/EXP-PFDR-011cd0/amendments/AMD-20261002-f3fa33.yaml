        under CR-4 for the 37 non-31 steps, and C-2 (i)-(ii) for step 31.
        Output amd-f3fa33/compare-v4-archived.json.
        (3) RE-RUN. Scratch root:
        /tmp/claude-0/-home-user/015c3767-cc03-52db-9b0c-bd2aa6c26537/scratchpad/e5139f/
        (its fx path, scratchpad/e5139f/fx, has exactly the length of the
        archived scratchpad/ce5403/fx). Run the archived
        fixtures/make_fixtures.py by path, unchanged, with --fx
        <scratch>/fx, capturing stdout and stderr to
        amd-f3fa33/make-fixtures-rerun.log (recorded, not compared). Run the
        archived amd-280481/fixtures/exercise_a3.py by path, unchanged, with
