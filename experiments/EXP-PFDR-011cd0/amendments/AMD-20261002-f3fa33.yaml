    - id: C-5
      name: R11 attempt-3 equality checks under CR-4
      field: AMD-20261002-280481 A-4 (2), (3) and (6)
      rule: >-
        (2) attempt-3/curves.jsonl.gz sha256 equals the curves.jsonl.gz entry
