        check_identity_v4.py rerun: the re-run log against after-D7 under
        CR-4 for the 37 non-31 steps; step 31 under C-2 (i)-(ii) and CR-4
        identity with the archived a3 step 31. Output
        amd-f3fa33/compare-v4-rerun.json. check_identity_v4.py sx31: C-2
