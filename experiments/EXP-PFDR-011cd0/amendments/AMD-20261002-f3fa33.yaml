          log or checksum file was opened.
        measured_quantity_exposed: none
    conclusion: >-
      PRE-DATA for every census quantity and every real-archive P0 input. The
      rules changed here are comparison rules for synthetic fixtures and
      hash/equality checks; they are changed by a versioned record, with
      their derivation stated. Confirmatory status of every prediction and
      outcome condition is preserved.

  # ---------------------------------------------------------------------------
  changes:
    - id: C-1
      name: CR-4, the one comparison specification for every identity check on the pin path
      field: >-
        AMD-20261002-280481 A-3 fixture_exercise (1) ("except timestamps and
        paths"); AMD-20261002-c7ccde B-2 (replaced) and the identity wording of
        B-3 (2), (3) and (4); AMD-20261002-280481 A-4 (2) and (3) (made exact)
      principle: >-
        Identity applies to EVERY token of EVERY recorded field, except
        tokens in the closed host/provenance classes H1-H11 below, each
        applied only where stated. Nothing outside this list is excluded, by
        any session, for any reason. A token class can be added only by a
        further amendment. Canonicalisation is a function applied identically
        to both sides; then the canonical forms must be equal.
      record_comparison: >-
        For two exercise-step records X (reference) and Y (candidate):
        (1) the key sets are equal;
        (2) step, exit_code, expected_exit and expectation_met are equal
        with ==, untransformed;
        (3) check is compared as parsed JSON (dict key order ignored, list
        order kept, numbers and booleans with ==), after canon() is applied
        to every string leaf and every dict key;
        (4) cmd is compared after canon() and, at steps 35 and 38 only, H7;
        (5) stdout_tail and stderr_tail are compared after canon(), as lists
        of lines, under the order rule H8 and the cut rule H9.
        At the log level: steps_total is 38 in both logs, the step labels
        are pairwise equal in order, and "what" is equal. A candidate log
        written by the A-3 copy has steps_expectation_met 37 with step 31 the
        only false expectation (its harness check necessarily raises
        FileNotFoundError on the absent design.json; C-2); this is the
        expected state, not a failure. The "fx" value is not compared; it is
        the input of H2.
      canon: >-
        canon(s) applies, in this order:
        H2 replace every occurrence of the log's own "fx" value (exact
        substring; this covers the absolute form and the "../../.."-prefixed
        relative form that run_jobs.py and grel print) by <FX>;
        H3 in cmd only, replace the first whitespace-separated token (the
        interpreter path) by <PY>;
        H4 only when comparing against fixtures/exercise-log-after-D7.json,
        replace "experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.py"
        by "experiments/EXP-PFDR-011cd0/analyze_relcensus.py";
        H1 replace ISO timestamps matching
        \d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d+)?(\+00:00|Z)? by <TS>, and run
        stamps matching \d{8}T\d{6}Z by <STAMP>;
        H5 replace \bpid \d+ by "pid <PID>";
        H6 replace \bwall \d+(\.\d+)? s\b by "wall <SEC> s", \bcpu
        \d+(\.\d+)? s\b (case-insensitive) by "cpu <SEC> s", and
        \bpeak_rss \d+ by "peak_rss <RSS>".
        The H1, H4 and H6 patterns are exactly those of the archived
        amd-c7ccde/check_exercise_v3.py; the H5 pattern is its PID pattern.
      host_token_classes:
        H1: timestamps (ISO-8601) and run stamps; everywhere
        H2: the scratch fixture root (each log's own fx value); everywhere
        H3: the interpreter path (first cmd token); cmd only. Interpreter identity is checked separately (Python 3.11.15, numpy 2.4.6, the venv-ci path recorded)
        H4: the A-3 retargeting of the analysis-file path; comparisons against after-D7 only
        H5: OS process ids printed as "pid N"; everywhere
        H6: host measurements printed as wall seconds, CPU seconds and peak RSS; everywhere
        H7: >-
          volatile-file digests: the 64-hex value that follows
          "--calibration-sha256 " in the cmd of steps 35 and 38 ONLY (the
          digests of calibration.json and stage-calibration.json, which the
          copy writes with "created_at": now(), lines 1591 and 2281), replaced
          by <VOLATILE-SHA256>, and only when that step's exit_code equals its
          expected_exit 0 in both records. Step 34's literal all-zero digest
          is NOT masked. No other digest anywhere is masked.
        H8: >-
          scheduling order: in a stdout_tail whose first canonical line is a
          run_jobs.py attempt header reading "max N processes" with N >= 2
          (steps 3, 7, 9, 11 and 13), the first line and the last line are
          compared in position and the lines between them are compared as
          multisets (sorted-list equality). Every such line is still
          compared exactly as a whole line. Step 5 (max 1 processes) and every
          other field are compared in order.
        H9: >-
          the harness tail cut: exercise.py keeps the last 1500 characters of
          stdout and stderr, run_p_cases.py the last 2000 of stderr. If the
          raw value in either record has exactly that length, the first line
          of each canonical value is dropped, and the last k lines are
          compared (k = the smaller remaining line count, k >= 1); for an H8
          tail the last of these lines is compared in position and the other
          k - 1 as multisets. When neither raw value is at the cut length,
          H9 does nothing.
        H10: >-
          repository root: in A-4 (3) only, the prefix
          "/home/user/crypto-autoresearcher/" is removed from every dict key
          and string value of p0x-report.json before comparison (A-4 (3)'s
          "path fields"). arm_read_log is NOT a path field: its keys are paths
          (canonicalised) and its per-arm line counts are results (identity).
        H11: >-
          gzip container bytes: in A-4 (2) only, if the sha256 of
          attempt-3/curves.jsonl.gz differs from the attempt-2 checksums
          entry, the sha256 of the DECOMPRESSED byte streams of
          attempt-3/curves.jsonl.gz and attempt-2/curves.jsonl.gz are
          compared (hash streamed, content never printed or parsed); equal
          decompressed bytes pass, with the container difference recorded.
      result_tokens_kept: >-
        Everything not removed by H1-H11 is a result or a recorded input and
        stays under exact identity, including every check value and digest
        not named in H7, every cmd argument, and every other token of every
        tail line.
      failure_meaning: >-
        A difference that survives CR-4 is a real difference: an I-5
        nondeterminism finding or a defect. Stop and return with the step,
        field and differing canonical lines. It is never resolved by
        judgment or by extending the list.

    - id: C-2
      name: step 31, made exact
      field: AMD-20261002-c7ccde B-1 and B-3 (2)/(3) wording for step 31
      rule: >-
        Step 31 is judged by B-1 as follows, with no other comparison against
        the after-D7 log.
        (i) exit_code is 1 (and expected_exit is 1).
        (ii) The stderr (the archived or re-run stderr_tail, or the full
        SX-31 stderr) contains the line "P0 stop (AMD-20261002-280481 A-1
        (b)): selection [30, 32] is not exactly [22, 24]; design.json and
        power.json not written", and the line beginning '{"p0_stop"' parses
        as JSON with p0_stop "AMD-20261002-280481 A-1 (b)" and selection
        fields expected_rungs [22, 24] (derived from the rule), and
        qualifying_rungs [30, 32], selected_rungs [30, 32], completeness
        {"complete": 12, "completed_valid": 12, "total": 12} at "30" and
        "32" and {"complete": 0, "completed_valid": 0, "total": 0} at
