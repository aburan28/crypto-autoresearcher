        "stop", reason "relation count differs", recount_sign_only 5,
        fixture 6). The mapping is fixed by the archived exercise.py, whose
        step-31 check builds p0x_compared and differences from
        p0x-report.json's compared and differences. No other p0x-report field
        is compared.
        In the re-run (C-4 (3)) step 31 must ALSO equal step 31 of the
        archived amd-280481/fixtures/exercise-log-a3.json under CR-4 (all
        fields; H4 not applied), including its expectation_met false and its
        canonical FileNotFoundError check string.

    - id: C-3
      name: the one harness file, and its controls
      field: AMD-20261002-c7ccde B-3 (5)
      rule: >-
        One new harness file,
        experiments/EXP-PFDR-011cd0/amd-f3fa33/check_identity_v4.py
        (standard library only), implements CR-4 and C-2 and nothing else, in
        the modes controls, archived, rerun, sx31, pcases, curves and p0x.
        It records, per step or field, which H-classes and rules fired, and
        the canonical differing lines of every failure.
        CONTROLS, before any verdict. In mode controls (output into
        amd-f3fa33/compare-v4-archived.json, block "controls"), apply CR-4 to
        in-memory copies of the archived exercise-log-a3.json against
        itself, each with one planted change, and confirm the stated outcome:
        positive (must still PASS): P1 change one pid in step 3; P2 change one
        timestamp in step 5; P3 change one "wall ... s" and one "peak_rss"
        value in step 7; P4 swap two "ended" lines in step 3; P5 change the
        --calibration-sha256 value in step 35; P6 replace the fx value
        throughout the log by another path of equal length.
        negative (must FAIL): N1 change "rows 20" to "rows 21" in one ended
        line of step 3; N2 swap two lines of step 5's stdout_tail; N3 change
        one digit of step 34's all-zero digest; N4 change one hex digit of
        step 4's check certificates_sha256; N5 change step 14's exit_code;
        N6 change step 35's check kappa_subgroup_TT3 in its last digit; N7
        change "missing 0" to "missing 1" in step 13; N8 change step 19's
        stdout "matched": 44 to 43; N9 change a step label; N10 in step 31,
        change selected_rungs in the stderr JSON (C-2 (ii) must fail).
        The harness renders no verdict until every control behaves as
        stated; harness development before that point is not a finding. The
        final harness sha256 is recorded in implementation-notes-f3fa33.yaml.

    - id: C-4
      name: the v4 pre-pin re-verification and pin (replaces the procedure of c7ccde B-3)
      field: AMD-20261002-c7ccde B-3 (1)-(6); TASK order step (b)
      rule: >-
        The A-3 copy is NOT rebuilt or edited. The file to pin is
        experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.py at sha256
        e80f6d6caceb6ff0de9982e945f66016c1b401ee393741111fe88c0b64d709b7. A
        fresh session does, in order, with every command under
        PYTHONDONTWRITEBYTECODE=1 and the venv-ci interpreter:
        (1) HASHES. Every path of the TASK-20261002-07fdcb and
        TASK-20261002-b905f7 receipts other than cards and receipts equals
        its path_sha256. Any mismatch: stop and return.
        (2) ARCHIVED LOG. check_identity_v4.py controls, then archived:
