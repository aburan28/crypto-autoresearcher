# =============================================================================
# AMD-20261002-f3fa33 -- PRE-DATA protocol amendment of EXP-PFDR-011cd0,
# protocol version 3 -> 4. ADDITIVE: specification.yaml (v1),
# AMD-20261002-280481 (v2) and AMD-20261002-c7ccde (v3) are NOT edited.
# Approved by DEC-20261002-4f2d28 under the standing user authorization of
# 2026-09-06.
# Rules on ambiguity AMB-B3-2-PID of
# experiments/EXP-PFDR-011cd0/execution-report-c7ccde.yaml. Replaces the
# open-ended "except timestamps and paths" / B-2 exclusion wording with ONE
# closed comparison specification (CR-4) that governs EVERY identity comparison
# on the path to the design.json pin: c7ccde B-3 (2), (3) and (4), and
# AMD-20261002-280481 A-4 (2) and (3). Adds positive and negative controls for
# the comparison harness. Moves the continuation's records to -f3fa33 files.
# It changes no threshold, prediction, statistic, cell, arm, seed, curve, mode,
# gate, outcome condition, raise-rule multiplier, P0 estimation rule, code stop
# or machine limit, and no byte of the A-3 copy (sha256 e80f6d6c...).
# =============================================================================
