        record, as B-1 labels them).
        (iii) SX-31 only: neither design.json nor power.json exists in its
        --out directory, and its stdout is empty.
        (iv) SX-31 only: p0x-report.json exists in its --out directory, and
        report["compared"] equals the after-D7 step-31 check["p0x_compared"]
        (144), report["difference_count"] is 1, and report["differences"]
        equals the after-D7 step-31 check["differences"] as parsed JSON (one
