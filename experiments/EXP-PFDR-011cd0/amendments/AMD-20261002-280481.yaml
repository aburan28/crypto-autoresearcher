# =============================================================================
# AMD-20261002-280481 -- PRE-DATA protocol amendment of EXP-PFDR-011cd0,
# protocol version 1 -> 2. ADDITIVE: specification.yaml (v1) is NOT edited.
# Approved by DEC-20261002-1efb1f under the standing user authorization of
# 2026-09-06.
# Rules on ambiguity P0-SS4 of experiments/EXP-PFDR-011cd0/execution-report.yaml
# (R11 could not estimate the SS m = 4 P0 inputs under pinned interpretation
# I-8). Fixes the P0 estimation rungs per (class, m), requires a new pinned
# copy of the analysis script for R11 attempt-3 onward, fixes R11's canonical
# location, and records the rulings on the executor's deviations D-1..D-7, the
# G-FIX evaluation (D-6) and interpretations I-1..I-12. It changes no
# threshold, prediction, statistic, cell, arm, seed, curve, mode, gate,
# outcome condition, raise-rule multiplier or machine limit.
# =============================================================================
protocol_amendment:
  id: AMD-20261002-280481
  amendment_id: AMD-20261002-280481
  experiment_id: EXP-PFDR-011cd0
  hypothesis_id: H-PFDR-2765d2
  kind: additive
  version_from: 1
  version_to: 2
  recorded_at: '2026-10-02'
  authored_by: coordinator
  approved_by: coordinator
  approval_decision: DEC-20261002-1efb1f
  execution_handoff: TASK-20261002-ce5403
  output_archive: TASK-20261002-1fcda9
  archived_by: TASK-20261002-d2a99c
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py and confirmed
    free with --check; supplied to this Coordinator, which holds no shell and
    minted no identifier.
  authority: >-
    Coordinator, under the standing user authorization of 2026-09-06
    (AGENTS.md "Standing user authorization for ideas and experiments").
    CLAUDE.md: "Changing a frozen scientific protocol uses an additive
    amendment; never rewrite historical records". specification.yaml (v1) and
    every archived file of the TASK-20261001-b64be7 package (R01-R10, R11's
    root files and attempt-2, implementation-notes.yaml,
    execution-report.yaml, every script and fixture) are untouched.

  precedence: >-
    Protocol version 2 = specification.yaml (v1) + this file. This file
    governs exactly where it names a field. Every other field of version 1
    governs unchanged.

  reason: >-
    R11 (RUN-PFDR-011cd0-p0-design) attempt-2 completed design_curves.py and
    P0X, then stopped in P0 step (2). The frozen text of
    power_analysis.P0_verification_and_rule step (2) says P0 estimates
    rho1(class, m), D_R(class, m) with its 95% upper bound, and Mbar(m) "from
    the archived EXP-PFDR-1b78f7 random arms (complete instances, recounted
    by its own code under CC-1)". It names no band. The executor's pinned
    interpretation I-8, fixed before data, restricted the estimates to the
    30-32 bit band. The executor reports that the archived SS m = 4
    random-arm census instances have no instance complete at scope A_fix at
    26, 28, 30 or 32 bits (rows after census saturation are not retained
    above 24 bits), and that every such instance is complete at 12-24 bits.
    So the SS m = 4 inputs are undefined under I-8. The pinned analysis file
    cannot be edited, because a governed output (attempt-2 p0x-report.json)
    exists. A stop for a protocol gap of this kind is a design question, not
    data, and never evidence (AGENTS.md core rule 5).

  # ---------------------------------------------------------------------------
  protocol_grounds:
    note: >-
      The rule in A-1 was chosen on these four grounds, stated before any
      number was read. This Coordinator did not open any R11 output or log
      (attempt-1 or attempt-2 stdout.log, stderr.log, raw-result.json,
      post-processing.json, p0x-report.json). It has seen no P0 estimate for
      any (class, m), and the choice does not depend on any estimate.
    fidelity_to_frozen_P0_text: >-
      The frozen text requires estimates from archived random arms,
      complete instances only, recounted under CC-1. Every option that keeps
      archived complete instances is within the text. That rules in a rung
      selection (A, B) and rules out replacing estimates with planning values
      (C), which are the values P0 exists to check, and a new pilot (D),
      which adds a run outside the frozen run list and data the text does not
      name. I-8's band is an interpretation of a text silent on bands. It is
      consistent with the stated purpose of P0 (power at 30-32 bits) and with
      the approval record's planning basis, and it was pinned before data.
      The smallest change that makes the protocol executable leaves I-8 in
      force wherever it can execute and changes it only for (SS, 4).
    blinding: >-
      Every option reads only EXP-PFDR-1b78f7 archived data and design
      quantities, and no EXP-PFDR-011cd0 census row exists, so the
      census-level blinding is intact under any of them. The rule is
      decided without any P0 estimate in view. Changing I-8 for cells where
      it already executed in attempt-2 (option A applied everywhere) would be
      a rule change after a pinned step ran, with no necessity. Option D
      would also create new data of this experiment's population before the
      design is pinned. A-1 changes nothing for any cell except the one whose
      rule could not execute.
    transfer_assumptions: >-
      Every off-band estimate assumes that the quantity transfers to 30-32
      bits. The weakest such assumption uses the rungs nearest the target
      band. Pooling 12-32 bits (option A) would impose a 12-to-32-bit
      transfer on every cell that has target-band data. For (SS, 4) the
      nearest rungs at which completeness is total are used, so the
      completeness filter selects nothing within a rung (no censoring bias).
      The assumption is declared as TA-1, A-2.
    power_calculation_honesty: >-
      The SS m = 4 power prediction rests on TA-1 and is labelled so in
      design.json, power.json and the execution report. Two rungs are used,
      matching I-8's two-rung band, so the curve-cluster bootstrap bound for
      (SS, 4) rests on the same number of curve clusters as every other cell.
      The frozen conservatism is unchanged: the 95% bound, the x 1.5 SS
      factor, and the raise-only rule. The decision-bearing detection limit
      remains the frozen A-INT achieved X_rel at the realised n (R16). A
      transfer error therefore shows up as a cell that does not meet its
      target, never as a hidden claim. No adaptive sampling follows from it
      (stopping_rules).
    options_not_taken:
      A_all_bits_every_cell: not taken; it re-rules cells whose pinned rule executed, and imposes the widest transfer on every cell
      B_as_offered_20_to_24: not taken as worded; two rungs (22, 24) match I-8's two-rung band and minimise the transfer distance
      C_planning_values: not taken; it makes P0 verify nothing for (SS, 4), and the planning value derives from a pair-unit dispersion, not the relation unit
      D_new_pilot: not taken; it adds a run and data outside the frozen run list and is not needed to execute the frozen text

  # ---------------------------------------------------------------------------
  pre_data_assessment:
    question: >-
      Is this amendment written before any observation of a quantity that
      R11-R17 measure or that P0 estimates (rho1, D_R, Mbar per (class, m);
      t*_plan; predicted power; final n; any kappa, z, X_rel or dispersion of
      this experiment)?
    exposures_examined:
      - item: this Coordinator
        observed: >-
          The execution report, implementation notes, run manifests (status,
          completeness, certificate, timing and seed fields), the R10
          fix-report.json header and unattributed list, the fixcompare code
          in merge_relcensus.py, and the p0_estimates / design_groups /
          uniform_ECR code of the archived analyze_relcensus.py (code only).
          No R11 output, log or raw-result was opened. The implementation
          notes' D-1 entry quotes six random-arm TT/TB row counts of one base
          on census curve c = 10, which this Coordinator therefore saw. They
          are row counts of one random arm, not SS, and carry no kappa, z or
          dispersion.
        measured_quantity_exposed: none of the quantities above
      - item: executor of TASK-20261001-7f7a33
        observed: >-
          The attempt-2 process completed P0X and entered P0 step (2). Whether
          it printed any (class, m) estimate to its logs was not checked by
          this Coordinator, deliberately: the logs were not opened. A-1
          changes no rule for any cell other than (SS, 4), so no rule can have
          been tuned on such output. The continuation executor is barred from
          those logs (TASK-20261002-ce5403 read_scope_excludes).
        measured_quantity_exposed: possibly P0 estimates of cells whose rule is unchanged; never any census quantity
    conclusion: >-
      PRE-DATA for every census quantity and for the (SS, 4) P0 inputs.
      Confirmatory status of every prediction and outcome condition is
      preserved.

  # ---------------------------------------------------------------------------
  changes:
    - id: A-1
      name: P0 estimation rungs per (class, m)
      field: power_analysis.P0_verification_and_rule step (2); implementation-notes.yaml interpretations_fixed_before_data I-8 (band clause)
      rule: >-
        (a) For every (class, m) in {TT, TB, SS} x {3, 4, 5} other than
        (SS, 4): the estimation rungs are 30 and 32 bits, as I-8 pins. I-8 is
        RATIFIED for these cells and governs unchanged, including its
        completeness definition, scopes (TT/TB stop, SS A_fix), formulas,
        bootstrap and seeds.
        (b) For (SS, 4): the estimation rungs are the TWO HIGHEST even rungs
        b <= 32 at which the archived census-mode random-arm SS m = 4
        instances with status completed_valid number at least one and are
        ALL complete at scope A_fix under I-8's completeness definition. The
        code computes this selection from the archive and records it. On the
        executor's report the selection is {22, 24}. If the computed
        selection is not exactly {22, 24}, or fewer than two rungs qualify,
        P0 stops before writing design.json and the executor returns. That
        is a Coordinator matter, not data.
        (c) rho1(SS, 4), D_R(SS, 4) with its 95% one-sided curve-cluster
        bootstrap upper bound, and Mbar(4) are all computed from the
        instances of the rungs in (b), by I-8's formulas, unchanged.
        (d) The bootstrap stream is I-12's single stream
        SeedSequence([0x011cd0, 100]), consumed in the unchanged loop order
        (class TT, TB, SS; m 3, 4, 5). (SS, 4) now draws from it, so every
        later (class, m) draws after (SS, 4). This is the stream I-12
        defines for a run in which (SS, 4) has data. No attempt-2 value is
        compared or carried.
        (e) Nothing else in P0 changes: the design curves, the model means
        at the design curves, D = max(upper bound, 1) x 1.2 (TT/TB) or x 1.5
        (SS), t*_plan with >= 20000 replicates x 5 seed families, the power
        method of I-8, the raise rule and its multipliers {1.25, 1.5, 2,
        2.5, 3}, "n is never lowered", the "target unattainable by design"
        rule, the design_stop, and CC-9 (E[C_R] from the uniform model at
        the design curves; for SS the model uses Mbar, so (SS, 4) uses
        Mbar(4) from (b)).
    - id: A-2
      name: transfer assumption TA-1 and its disclosure
      field: power_analysis (design.json and power.json content); execution report
      TA-1: >-
        rho1(SS, 4), D_R(SS, 4) and Mbar(4), measured on archived random arms
        at 22-24 bits at scope A_fix and normalised by the uniform model,
        transfer to 30-32 bits at X_fix exposure closely enough for the
        raise rule. Assumed, not verified by P0.
      rule: >-
        design.json and power.json record, for every (class, m), its
        estimation rungs and instance and triple counts. They also record, for
        (SS, 4) only, (i) the per-rung completeness table of archived SS
        m = 4 random-arm instances (complete / completed_valid / total, at
        every rung 12-32; counts of instances only, no relation count), and
        (ii) the label "SS m 4 P0 inputs estimated at 22-24 bits; TA-1
        assumed, not verified by P0". The (SS, 4) predicted power and X_rel
        carry the same label wherever they are reported. Nothing is computed
        beyond the frozen P0 outputs (no sensitivity run). The frozen
        decision-bearing quantity for every cell, including SS4, remains
        A-INT's achieved X_rel at the realised n in R16. The evidence review
        compares the realised 30-32 bit SS m = 4 random-arm quantities (A6R,
        H5) with the P0 inputs. That is review work; this run set computes
        nothing extra for it.
    - id: A-3
      name: new pinned analysis file
      field: implementation_contract.EC-9_experiment_scripts (analyze_relcensus.py) and its pinning rule
      path: experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.py
      rule: >-
        The file starts as a byte copy of
        experiments/EXP-PFDR-011cd0/analyze_relcensus.py at sha256
        96d3b2df75b0e3e5a21b29a6d74c5a97190b9e1e3e2df3c5b3852b7dbcd13647
        (the D-7 bytes, as archived by TASK-20261001-b64be7). Its ONLY
        changes are: the per-(class, m) estimation-rung selection of A-1
        inside p0_estimates, with one new helper that implements A-1 (b)
        and its stop; and the A-2 fields written into design.json and
        power.json. Docstring and comment lines describing these changes may
        change too. Every other function, constant, rule, threshold,
        convention, simulation and seed stays byte-identical, and the import
        rule is unchanged (no crypto_autoresearcher module). The executor
        archives
        experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.diff (a
        unified diff against the 96d3b2df bytes) and
        experiments/EXP-PFDR-011cd0/amd-280481/function-diff.json (every
        top-level function and constant, changed or not). Any change outside
        the scope above is a stop.
      fixture_exercise: >-
        Before first use on real data, run against the copy on synthetic
        fixtures only, logged in experiments/EXP-PFDR-011cd0/amd-280481/fixtures/:
        (1) the 38 steps of fixtures/exercise.py, retargeted to the copy,
        with every result identical to fixtures/exercise-log-after-D7.json
        except timestamps and paths; (2) P1, a synthetic archive in which
        (SS, 4) has no complete instance at 26-32 and all instances complete
        at 12-24 bits: the selection is {22, 24} and the (SS, 4) inputs come
        from exactly those instances; (3) P2, a synthetic archive in which
        fewer than two rungs qualify: P0 exits non-zero and writes no
        design.json; (4) P3, on the P1 input, every other (class, m)'s
        rho1, D_R_hat and Mbar equal the 96d3b2df file's on the same input.
        The D_R_ub95 of any (class, m) after (SS, 4) in loop order may
        differ, by A-1 (d), and is listed rather than compared.
      pinning: >-
        sha256 and timestamp recorded in
        experiments/EXP-PFDR-011cd0/implementation-notes-amd280481.yaml
        before R11 attempt-3. From R11 attempt-3 on, this copy is the one
        analysis file for every invocation: p0 (R11), grel (G-REL), calibrate
        (R15), unmask (R16) and stage-r (R17). EC-9's "same file for R11,
        R15, R16 and R17" applies to it. The archived
        experiments/EXP-PFDR-011cd0/analyze_relcensus.py is not edited,
        moved or deleted, and is not invoked again. A pinned file may not be
        edited after any data it governs exists. If it must be edited, stop
        and return.
    - id: A-4
      name: R11 attempt-3 and R11's canonical location
      field: runs.R11; R12, R13, R15 and R16 commands (--design); required_artifacts per_run_data R11
      rule: >-
        (1) R11 attempt-3 runs the frozen R11 command into
        experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-p0-design/attempt-3/,
        with the A-3 analysis file in place of analyze_relcensus.py and
        --out attempt-3. design_curves.py is unchanged.
        (2) Its curves.jsonl.gz must have the sha256 recorded for
        curves.jsonl.gz in attempt-2/checksums.sha256 (identical in attempts
        1 and 2). Otherwise stop: an I-5 nondeterminism finding.
        (3) Its p0x-report.json must equal attempt-2/p0x-report.json in
        every field except created_at, timing and path fields. Otherwise
        stop and return with the differing keys. The recount code is
        unchanged by A-3.
        (4) If P0X fails, P0 reaches a design_stop, or A-1 (b) stops, stop
        before R12 and return (frozen stopping rule).
        (5) Attempt-3 is the canonical location of R11. Its manifest.yaml
        carries location_kind attempt, canonical true, protocol version 2
        with amendments [AMD-20261002-280481], and the run-level status of
        R11 under this amendment: completed_valid iff curves, P0X,
        design.json and power.json are all produced and valid. The archived
        R11 root manifest (invalid) and attempt-2 manifest stay unchanged as
        the record of attempts 1 and 2.
        (6) design.json's sha256 is pinned, with a timestamp, in
        implementation-notes-amd280481.yaml before R12. R12, R13, R15 and
        R16 read --design
        experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-p0-design/attempt-3/design.json
        with that sha256 (run_jobs.py --design-sha256).
        (7) An attempt-4 is allowed ONLY if attempt-3 ends
        failed_infrastructure (memory, watchdog, signal) before writing
        design.json. It uses the same pinned file, with no code change, and
        the same checks (2)-(6). Any other further attempt needs a
        Coordinator decision.
    - id: A-5
      name: rulings on gate evaluation, deviations and interpretations (TASK-20261001-7f7a33)
      field: execution-report.yaml deviations, ambiguities; implementation-notes.yaml interpretations_fixed_before_data
      rulings:
        - id: D-6 (G-FIX)
          ruling: >-
            G-FIX PASSES on the frozen gate text; R18 is not triggered. The
            frozen text requires equality of every solver column, TT and TB
            block, informative rank, census_saturated_at_row and staircase;
            SS pairs_raw, pairs_formal and pairs_nonformal new >= old; and
            new == C(k', 2) from the retained rows at <= 24 bits. It requires
            instance-by-instance straddle attribution only for "any other
            difference (rows, dup_formal, poisson_mean)". fixcompare found no
            such other difference on any of the 838 instances (no
            non-pair difference, staircases equal, harvest rows equal: 0
            differing rows). The nine instances it lists fail only the
            executor-added rule "a pair difference needs an SS x-group of
            >= 3 members spanning >= 2 attempts". That rule is not frozen
            text and cannot be evaluated above 24 bits, where rows after
            census saturation are not retained. fix-report.json (pass false)
            stays as archived, unedited.
        - id: PD-1
          ruling: >-
            Procedural. The executor continued past its own pinned gate
            tool's fail verdict on its own reading of the frozen text. That
            reading is correct and is ratified here. In the continuation, a
            pinned tool verdict that disagrees with the frozen gate text is a
            stop-and-return, never an override.
        - id: D-1
          ruling: >-
            ACCEPTED as disclosed. Six random-arm TT/TB row counts of one
            base on census curve c = 10 were printed before pinning. No
            structured arm, kappa, z or dispersion was involved, and nothing
            fed any analysis. No probe of a census curve (c >= 10) outside the
            declared runs is permitted in the continuation.
        - id: D-2
          ruling: ACCEPTED. Format inspection of the P0X fixture (EXP-PFDR-1b78f7 data, which DEC-20261001-56f873 DS-4 lets the executor read); no computation used the viewed bytes.
        - id: D-3
          ruling: RATIFIED (job naming; R10 harvest rows in task scratch, as the R10 command prescribes).
        - id: D-4
          ruling: >-
            RATIFIED. analyze_relcensus.py grel (G-REL), stage-r --step
            calibrate|unmask (the R17 calibrate-pin-unmask order), and
            merge_relcensus.py curvecheck (G-CURVE) implement frozen gates
            and steps. They were pinned before data. In the continuation,
            grel, calibrate, unmask and stage-r run from the A-3 copy.
        - id: D-5
          ruling: RATIFIED (manifests and checksums by run_jobs.py finalize; archived wrapper used for exec and post).
        - id: D-7
          ruling: >-
            RATIFIED. analyze_relcensus.py was edited from 84daba98 to
            96d3b2df after pinning, as a memory-only streaming change. It was
            made before any output it governs existed (attempt-1 wrote none),
            was recorded with both hashes, and the fixture exercise was re-run
            38/38. R11 attempt-1 is failed_infrastructure (implementation
            cause), which is never evidence. A-3 builds on the 96d3b2df bytes.
        - id: order_note
          ruling: RATIFIED. R03-R09 ran before R02 within step (d), one frozen sweep at a time; the G1'/G2'/G3' check followed all eight. R02-R09 manifests record exec_finished_at beside finished_at (finalisation time).
        - id: I-1..I-7, I-9..I-12
          ruling: >-
            ACCEPTED FOR EXECUTION as pinned before data and within the
            frozen text's latitude. They are not endorsed as correct. The
            evidence review owns them (I-1 TB relation unit and I-3 R_star
            under the relation-count joints; I-10 and I-11 under the
            calibration joint).
        - id: I-8
          ruling: RATIFIED for every (class, m) except (SS, 4); for (SS, 4) superseded by A-1 (b)-(d).
    - id: A-6
      name: record locations for the continuation
      field: required_artifacts.per_experiment
      rule: >-
        The continuation writes
        experiments/EXP-PFDR-011cd0/implementation-notes-amd280481.yaml
        (build-identity table, A-3 pin, fixture exercise, design.json and
        calibration.json pins, every deviation) and
        experiments/EXP-PFDR-011cd0/execution-report-amd280481.yaml (the
        frozen execution-report content for R11 attempt-3 onward, plus the
        A-2 label). The archived implementation-notes.yaml and
        execution-report.yaml are not edited. Every new manifest's protocol
        block reads version 2, amendments [AMD-20261002-280481], approval
        decisions [DEC-20261001-56f873, DEC-20261002-1efb1f].
    - id: A-7
      name: budget and run count
      field: budget
      text: >-
        maximum_runs stays 18. Attempts and job processes belong to their run
        id, and R11 attempt-3 (and any A-4 (7) attempt-4) is not a new run.
        Machine protection is unchanged: at most 4 job processes, 3.5e9
        bytes of address space per process, no job while MemAvailable < 4
        GB, 1800 s per instance in R12/R13 and 7200 s in R14, 21600 s per
        job, 86400 s per attempt, 14 GB total, the 2.5 GB disk floor and the
        1.5 GB package guard (TW-DISK). Time and CPU are advisory.

  affected_runs:
    - R11 (attempt-3 under A-1..A-4; canonical location attempt-3)
    - R12, R13 (--design path of A-4 (6); G-REL via the A-3 copy)
    - R14 (G-REL via the A-3 copy)
    - R15, R16, R17 (the A-3 copy; --design path of A-4 (6))
  unaffected_runs:
    - R01-R10 (valid, immutable records; not re-run, not re-scored)
    - R18 (not triggered; G1', G2' and G-FIX pass on the frozen text)
  what_this_does_not_change:
    - every threshold, prediction (P1-P8), outcome condition, tripwire, success or falsification criterion of version 1
    - every cell, curve, base, arm, seed, rung, m, mode, X_fix, flag and family (FAM-1, CARRY-1, exclusions)
    - the counting conventions CC-1..CC-10, the statistic, A-CAL, PC-NULL, A-INT, A2R, A3R, A5R, A6R, A-CARRY, A-TAIL
    - the raise-only rule, its multipliers, the design_stop and CC-9
    - the engine, CLI, tests and every EC-9 script other than the A-3 copy (run_jobs.py, merge_relcensus.py, design_curves.py, verify_solves.py, verify_rows.py stay at their pins)
    - machine protection limits
    - any hypothesis status
  confirmatory_status: preserved
  claim_ceiling_unchanged: >-
    Toy scale, one engine, generated curves, 20-32 bits. A kappa-positive
    outcome is a lever candidate for review-breakthrough, never a result. A
    non-detection bounds only the declared cells at their achieved X_rel. The
    SS m = 4 power prediction is conditional on TA-1. A stop, memory error,
    watchdog or design stop is never evidence.
  supersedes: null
  superseded_by: null
  validation_note: >-
    tools/validate_ledger.py does not read experiment amendment files. This
    file is a protocol record whose authority is DEC-20261002-1efb1f. It is
    official only once the TASK-20261002-d2a99c receipt verifies.
