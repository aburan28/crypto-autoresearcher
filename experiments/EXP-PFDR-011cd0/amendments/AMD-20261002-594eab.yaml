  # ---------------------------------------------------------------------------
  changes:
    - id: D-1
      name: the control list, restated as control_table
      field: AMD-20261002-f3fa33 C-3 (the positive and negative control list and its free choices)
      rule: >-
        protocol_amendment.control_table and control_table_rules replace the
        control list of C-3. It has 18 rows: B0, P1-P6 and N1-N11. N7 is
        corrected (step 13, "missing 1" -> "missing 0", in the
        "job 3-b12-c0 ended: " line) and N11 is added (step 11,
        "missing 0" -> "missing 1", in the "job 3-b12-c1 ended: " line). Every
        other row fixes exactly the planted change that the archived v4
        controls run constructed (compare-v4-archived.json detail lines). The
        rest of C-3 is unchanged: CR-4 is applied to the archived a3 log
        against itself with H4 off, and no verdict is rendered before every
        row behaves as stated.

    - id: D-2
      name: the v5 harness file
      field: AMD-20261002-f3fa33 C-3 (harness file) and C-4 (2)
      rule: >-
        One new harness file,
        experiments/EXP-PFDR-011cd0/amd-594eab/check_identity_v5.py
        (standard library only), implements CR-4 (f3fa33 C-1, unchanged),
        C-2 as made exact by D-3, and control_table, and nothing else. It
        has the modes controls, archived, rerun, sx31, pcases, curves and
