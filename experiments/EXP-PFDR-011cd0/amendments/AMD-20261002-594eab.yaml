  reason: >-
    TASK-20261002-e5139f passed authority, interpreter, worktree and build
    identity, wrote check_identity_v4.py and ran its controls mode. The
    unmodified baseline passed; P1-P6 passed; N1-N6 and N8-N10 failed at
    exactly the planted step. N7 ("change 'missing 0' to 'missing 1' in step
    13") could not be planted: step 13 of the archived
    amd-280481/fixtures/exercise-log-a3.json carries no "missing 0" in any
    field; its one ended line reads "missing 1". The same holds in
    fixtures/exercise-log-after-D7.json. "missing 0" occurs at steps 3, 5, 7,
    9 and 11. By C-3 the harness renders no verdict until every control
    behaves as stated, so the executor stopped at order step (b) with zero
    runs and no pin. The top-level session's own plantability scan of every
    C-3 control over the archived log confirmed that N7 is the only
    unplantable control. This is the fourth stop on the pin path from a
    specification that a correct, unchanged copy could not meet (P0-SS4,
    AMB-A3-FX31, AMB-B3-2-PID, AMB-C3-N7). The defect is this Coordinator's
    drafting: DEC-20261002-4f2d28 walked the controls through on paper
    without checking that each named token occurs at its named step. A stop
    for a protocol gap is a design question, never evidence (AGENTS.md core
    rule 5).

  # ---------------------------------------------------------------------------
  ruling_grounds:
    note: >-
      Stated before choosing among the executor's options. Three grounds
      only: fidelity to the intent of C-3, harness honesty, and no weakening
      of any control. Speed and favourability were not grounds. No census
      quantity and no real-archive P0 value has been computed or seen by
      anyone in this line.
    fidelity: >-
      C-3's negative controls each prove that a planted change in one class
      of result token is detected. N1 covers the per-job row count; N7 was
      written to cover the per-job "missing" count, at step 13, the one step
      whose purpose is the missing-key path. It also sits in a single-job H8
      tail. What carries the intent is (a) a change of a "missing" count
      token and (b) its detection at the step where it was planted. The
      direction 0 -> 1 is incidental; it was a misremembered token. The
      locus, step 13, is substantive.
    harness_honesty: >-
      A control must be plantable exactly as written and must leave the
      harness no free choice. Every control is therefore restated with its
      file, 1-based step, field, exact from- and to-substrings, expected
      occurrence count and expected outcome, including the parameters that
      v4 left open. The top-level session checks every row mechanically
      against the archived log before this file is archived.
    no_weakening: >-
      No control is removed, relaxed or moved to an easier token. Every v4
      control except N7 keeps the exact planted change that the archived
      v4 run constructed and that behaved as stated (compare-v4-archived.json).
      N7 keeps its step and token class. One control is added. A negative
      control now behaves as stated only if the comparison fails at exactly
      the planted step and nowhere else. A positive control behaves as stated
      only if every step passes. Both are stricter than v4's wording, and
      the archived v4 run already met them for the 15 constructible controls.
    options_decided:
      OPT-1: >-
        TAKEN, as N7. Step 13 stdout_tail, in the one line containing
        "job 3-b12-c0 ended: ", change "missing 1" to "missing 0". This keeps
        C-3's locus and token class and inverts only the direction, to the
        token the step actually carries.
      OPT-2: >-
        TAKEN as well, as a NEW control N11 rather than as a replacement.
        Step 11 stdout_tail, in the one line containing "job 3-b12-c1 ended: ",
        change "missing 0" to "missing 1". This keeps the direction C-3
        wrote, in another H8 tail. Choosing OPT-2 alone would move N7 off
        the missing-key step and lose its locus.
      OPT-3: >-
        TAKEN (OPT-1 and OPT-2 together). Both directions of a "missing"
        count change are then shown detected, in a one-job H8 tail (step 13)
        and in a two-job H8 tail (step 11). It costs one more control row and
        weakens nothing.

