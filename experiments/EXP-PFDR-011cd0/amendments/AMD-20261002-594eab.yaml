  # ---------------------------------------------------------------------------
  # MACHINE-CHECKABLE BLOCKS. Both tables below are written to be checked by a
  # script, row by row, against the archived files, before this amendment is
  # archived (TASK-20261002-00db66 check (j)) and again by the executor's
  # harness before any verdict.
  # ---------------------------------------------------------------------------
  machine_check_format:
    applies_to: [protocol_amendment.control_table, protocol_amendment.pre_pin_reference_table]
    common:
      - "Paths are repository-relative to /home/user/crypto-autoresearcher unless they begin with /."
      - "Logs are loaded with json.load. Step N means log['steps'][N-1] (1-based). step_label must equal log['steps'][N-1]['step'] exactly; a mismatch is a MISS."
      - "Substrings are matched against the DECODED field value (the Python str after json.load), never against the raw file text with JSON escapes."
      - "Lines of a field are str.splitlines(keepends=True) of the decoded value, numbered from 1."
      - "Counts are non-overlapping str.count occurrences."
    control_table_row:
      control_id: P1-P6 positive, N1-N11 negative, B0 baseline
      log_file: the file the control is planted in (always the archived a3 log)
      step_index_1based: integer, or null for whole-log operations
      step_label: exact label at that index
      field: one of step | cmd | exit_code | stdout_tail | stderr_tail | check | '*' (every string of the log, keys and values, top-level fx included)
      json_path: for field check only; dot path into the step's parsed check object
      operation: >-
        none (B0) | replace_substring | replace_two_substrings |
        replace_in_selected_line | swap_lines | set_value |
        replace_everywhere
      line_selector: >-
        for replace_in_selected_line and swap_lines; each selector must occur
        in exactly ONE line of the field
      from_substring / to_substring: exact decoded substrings
      expected_from_count: >-
        occurrences of from_substring in the scope BEFORE planting (scope =
        the selected line if line_selector is set, otherwise the whole
        field); must be exactly this number; the first occurrence in scope is
        replaced
      from_value / to_value: >-
        for set_value: the current value must equal from_value with == and
        the same JSON type; for a float, float(to_value) != float(from_value)
        must hold
      expected_outcome: PASS (positive, B0) or FAIL (negative)
      expected_failing_steps: >-
        the exact list of failing step indices in the harness output ([] for
        positive and B0)
      expected_extra: further outcomes that must hold (log-level checks, C-2 (ii) on the candidate)
      plantability_check: >-
        what the top-level session verifies on the archived log before
        archive. A row whose plantability_check fails is a MISS and the
        amendment goes back to the Coordinator.
    pre_pin_reference_table_row:
      ref_id: RF-NN
      used_by: the protocol clause that relies on the reference
      file: path
      locator: >-
        'json:$.a.b' (JSON path in the file) | 'step:N.field' (1-based step
        of an exercise log) | 'line:N' (1-based line of the file text) |
        'path' (existence) | 'checksums' (a sha256sum-format file) |
        'computed' (a value computed from other refs)
      check: equals | contains | line_contains | count_equals | key_count | keys_include | exists | not_exists | parses_json | len_equals | steps_where_contains | sha256_equals | record (informational only)
      expected: the exact expected value
      verified_by_coordinator_reading: true when this Coordinator read the location while drafting; false when only the top-level check can confirm it
      informational: true when a different value is recorded, not a MISS

