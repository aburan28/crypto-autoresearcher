# =============================================================================
# EXP-PFDR-011cd0 -- RELATION-LEVEL structural census: distinct, projectively
# normalised, nonformal x-key relations of coset (subgroup), Dickson and small_x
# bases against matched random bases, under a null calibrated on the random
# arms' measured dispersion, with an in-design known-null arm, a planted-relation
# arm and known_log, on fresh curves, at 20..32 bits, m = 3, 4, 5.
# Successor of EXP-PFDR-1b78f7 lead 2 (DEC-20260929-bbb3a9 NA-5), testing
# H-PFDR-2765d2 (supersedes H-PFDR-4765e4; NA-4). Carries the NA-7 SS-counter
# repair and NA-8 solve certificates. No new solver. Toy scale.
# Floor-independent: no A7, no floor ratio, no harvest-on mode. Dispatch waits on
# the TW-FLOOR round (DEC-20261001-709f0d); see dispatch_hold.
# =============================================================================
experiment:
  id: EXP-PFDR-011cd0
  hypothesis_id: H-PFDR-2765d2
  question_id: RQ-PFDR-ae2fba
  predecessor_experiment: EXP-PFDR-1b78f7
  predecessor_note: >-
    EXP-PFDR-1b78f7 (protocol v3) is analyzed and immutable. Its archived run
    files are read here only as regression fixtures (G-FIX), as the P0 power
    inputs and as the P0X recount fixture. Nothing of it is re-scored.
  version: 1
  title: >-
    Relation-level structural census of coset, Dickson and small_x bases
    against matched random bases in distinct normalised relations, with a
    calibrated null, a known-null arm, a planted arm, exposure-matched SS, full
    row retention and certified solves, m = 3, 4, 5, 20..32 bits
  status: approved
  frozen: true
  frozen_at: '2026-10-01'
  approved_by: coordinator
  approved_at: '2026-10-01'
  approval_decision: DEC-20261001-56f873
  approval_basis: >-
    Standing user authorization, AGENTS.md "Standing user authorization for
    ideas and experiments" (user, 2026-09-06). Protocol completeness and
    machine limits checked in DEC-20261001-56f873. No user confirmation is
    outstanding.
  execution_authorized: true
  execution_authorized_scope: >-
    Every run in `runs` below; R17 and R18 only under their triggers. Nothing
    else. Subject to dispatch_hold.
  dispatch_hold: >-
    The executor (TASK-20261001-7f7a33) is NOT dispatched until the TW-FLOOR
    review-breakthrough round (DEC-20261001-709f0d; reviewers
    TASK-20260929-fd1a9f and TASK-20260929-575e80) has been composed and
    decided by a committed, verified Coordinator decision, AND that decision
    or a following one records a ruling on whether any of its findings
    touches this contract: the relation unit (CC-1..CC-3), the engine
    changes (EC-1..EC-9), solve certification (NA-8) or any harvest-on
    reading. This contract relies on no harvest-on reading and computes no
    floor-relative quantity. If the ruling is "touches", an additive
    protocol_amendment in experiments/EXP-PFDR-011cd0/amendments/ is approved
    and archived before dispatch. If "does not touch", dispatch proceeds on
    this version.
  execution_handoff: TASK-20261001-7f7a33
  output_archive: TASK-20261001-b64be7
  packet_archive: TASK-20261001-cb35e7
  evidence_eligible_before_review: false
  designed_by: coordinator
  designed_under: DEC-20260929-bbb3a9 NA-4, NA-5, NA-6, NA-7, NA-8, NA-16 (design act of DEC-20261001-56f873)
  source_proposal: IDEA-20260928-4e2be7
  class: heuristic validation (HEUR-2765d2-H1a, H1b, H1c, H3, H4, H5) + structural measurement (HEUR-2765d2-H2) + engineering regression and repair
  claim_tier: toy
  certificate:
    run_level_kinds: >-
      discrete_log for every run that solves (R02-R10, R14, R18); none for the
      measurement runs (R01, R11, R12, R13, R15, R16, R17), which claim no
      solve. A census run's harvested relations are re-verified as below; the
      ledger certificate vocabulary has no relation kind, so that check is
      recorded under the run's harvested_row_check block, as in
      EXP-PFDR-1b78f7.
    solve_certificates_NA8: >-
      Every instance that determines k, in any run, writes one record
      {key, p, a, b, N, P: [x, y], Q: [x, y], k} to the run's
      solve-certs.jsonl.gz (statement of docs/claims-and-verification.md
      "Certificate discipline"). After the run, and before its manifest is
      written, experiments/EXP-PFDR-011cd0/verify_solves.py, which shares no
      code with the solver (G4-D), re-verifies every record. raw-result.json
      carries the certificate summary (counts, the file's sha256 and the
      verifier's sha256). The manifest's result.certificate.verified is the
      boolean true only if every claimed solve verifies; the counts are in
      instances_claimed and instances_verified. Any failure makes the run
      invalid (I-3).
    harvested_row_check: >-
      Every harvested row (TT, TB, SS) is re-verified in process as sum_i c_i
      F_i + kcoef Q == rhs P on an independent Curve instance before any
      elimination (as EXP-PFDR-1b78f7 IC-5); cert_fail > 0 invalidates the run
      (G4). In addition, every retained row of every instance whose curve
      index c is divisible by 10 is re-verified by
      experiments/EXP-PFDR-011cd0/verify_rows.py with disjoint code (G4-R).

  objective: >-
    Decide, in distinct-relation units under a calibrated null, whether coset,
    Dickson or small_x bases carry a non-generic excess of informative x-key
    relations over matched random bases at 30-32 bits for TT and SS at m = 3,
    4, 5 and TB at m = 3, with a design powered to detect relation-level
    kappa <= 1.15 (TT, SS) and <= 1.5 (TB m 3) at probability >= 0.5; and
    validate the restated heuristics HEUR-2765d2-H1a/b/c, H3, H4 and H5. The
    pre-committed expectation is the null. A calibrated, replicated excursion
    is a lever candidate for review-breakthrough, never a result.

  # ---------------------------------------------------------------------------
  na5_constraint_map:
    a_relation_unit: >-
      CC-1 (projective normalisation written out), CC-3 (scope), CC-7 (the
      counts in z) and CC-8 (variance in the same unit); resolution is by
      design in the same unit (CC-9).
    b_known_null_arm: >-
      known_null_sub (seed c+6000) and known_null_dick (seed c+7000), scored
      by the identical statistic and df against the same three randoms
      (A1R). The threshold t* is fixed from a dispersion-calibrated
      simulation on the random arms in R15 BEFORE any structured arm is read
      (A-CAL, two-step blinded analysis), and the known-null arm is the gate
      PC-NULL.
    c_exposure_matched_SS: >-
      SS is counted among the first X_fix = 20*isqrt(N) formally distinct
      encodings in recording order, identical for every arm of a curve
      (CC-3; EC-3 search-only mode).
    d_full_retention: >-
      Every harvested row of every family cell is retained (--retain all; no
      saturation cut). SS rows are retained in R13; TT and TB rows in R12.
      R13's TT and TB rows are not duplicated on disk; their stream digest
      must equal R12's (G-TAB).
    e_family_and_resolution_before_data: >-
      FAM-1 (21 cells) and CARRY-1 are declared below; resolvability is a
      design property (expected C_R >= 100 under the uniform model, computed
      by P0 from design curves before any census run; CC-9). Nothing is
      decided from the random counts.
    f_fresh_seeds: >-
      Census curves c >= 10 (EXP-PFDR-1b78f7 used 0..9); Stage R' curves c
      >= 20000.
    g_power_analysis: >-
      `power_analysis` below: declared curves per rung from an analytic
      calculation, verified and, by a frozen rule, raised by the
      pre-registered P0 simulation (R11) before any census data. Target
      relation-level kappa <= 1.15 at P >= 0.5 at 30-32 bits for TT and SS at
      m = 3, 4, 5, TT m 4 included; <= 1.5 for TB m 3. The red team's
      ten-curve subgroup TT m 3 28-bit cell is CARRY-1, run on 100 fresh
      curves.
    h_fixed_SS_counter: EC-1 (repair), its regression test (EC-8 T-OBJ5), and G-FIX.
    i_solve_certificates: certificate.solve_certificates_NA8; G4-D.
    j_intervals_and_A2: >-
      A-INT (>= 20000 replicates, seed-averaged over 5 seed families,
      n/(n-1)-corrected studentized intervals, coverage simulated at the
      design's n) and A2R (design-evaluated null slope distribution in place
      of "interval above 0").
    k_scale: toy, <= 32 bits, one engine (mitm, min_fill, default arity), no transfer.

