# EXP-CERTBIN-48dcff
# Direct S_4 degree counts. No closure.
# Approved by DEC-20261002-bdb2df.
experiment:
  id: EXP-CERTBIN-48dcff
  hypothesis_id: H-CERTBIN-5bf087
  source_idea: IDEA-20260926-9cc043
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Direct S_4 degree counts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-bdb2df
  objective: >-
    Compute the exponent-weight bound, the variable counts, the
    degree-9 and degree-10 series coefficients, and the degree-10
    byte count. Reject Boolean degree 12 and a byte count equal to
    1700000000.
  inputs:
    m: 3
    l: 6
    n: 17
    boolean_degree: 6
    algebraic_degree: 12
    hamming_weight_of_4: 1
    squared_term_weight: 3
    variables: 18
    chained_variables: 35
    series:
      c18_9: 48620
      c18_3: 816
      seventeen_times_c18_3: 13872
      z9: 34748
      c18_10: 43758
      c18_4: 3060
      seventeen_times_c18_4: 52020
      z10: -8262
      first_nonpositive_d6: 10
      first_nonpositive_d5: 9
      first_nonpositive_d4: 8
    columns:
      - {D: 6, count: 31180}
      - {D: 7, count: 63004}
      - {D: 8, count: 106762}
      - {D: 9, count: 155382}
      - {D: 10, count: 199140}
    rows:
      - {D: 6, count: 17}
      - {D: 7, count: 323}
      - {D: 8, count: 2924}
      - {D: 9, count: 16796}
      - {D: 10, count: 68816}
    bytes: 1713002280
    round_bytes: 1700000000
    byte_excess: 13002280
    three_gb: 3000000000
  controls:
    - >-
      Boolean degree 12 is false. That is the algebraic degree.
      Reporting 12 as the Boolean degree invalidates the run.
    - >-
      A nonnegative degree-10 coefficient is false. The coefficient
      is -8262. Reporting it nonnegative invalidates the run.
    - >-
      A byte count equal to 1700000000 is false. The excess is
      13002280. Reporting equality invalidates the run.
    - >-
      Eighteen variables equal to 35 is false. Reporting that
      invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - degree
    - route in {binomials, repeat_module}
  metrics:
    primary:
      - boolean_degree
      - z10_negative
      - byte_count
      - degree_12_rejected
      - implementations_agree
    secondary:
      - column_counts
      - row_counts
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The degree bound, the series signs, and the byte count.
    formula: >-
      The Boolean degree bound is m*(m-1). The series coefficient
      of z^j at d = 6 and j < 12 is C(18, j) minus 17*C(18, j-6)
      when j is at least 6. Column counts are sums of C(18, k) up
      to D. Row counts are 17 times the sum of C(18, k) up to
      D-6. Bytes are the degree-10 row count times the degree-10
      column count, divided by 8.
    source: >-
      IDEA-20260926-9cc043 names the degree 6, the counts 18 and
      35, the binomial differences, and about 1.7 GB, read
      2026-10-02. The differences and the byte count were
      recomputed in this design session. That computation is not
      a run. The byte count is strictly above 1700000000. No
      matrix was built.
  scale_relevance:
    tier: toy
    justification: Binomial counts. No transfer to a refutation.
    correspondence: null
  tail_checks:
    - Degree 10 is required. Stopping after degree 9 and still reporting the byte count is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the Boolean degree is reported as 12, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The Boolean degree is reported as 12.
    - The degree-10 coefficient is reported nonnegative.
    - The byte count is reported equal to 1700000000.
    - The variable counts 18 and 35 are reported equal.
    - A matrix or a refutation rate is reported.
  success_criterion: >-
    Both runs agree on degree 6, the algebraic degree 12, the
    variable counts 18 and 35, the coefficients 34748 and -8262,
    the five column counts, the five row counts, and the byte
    count 1713002280. The degree-10 coefficient stays negative.
    The byte count stays strictly above 1700000000 and strictly
    below 3000000000.
  falsification_criterion: >-
    The runs agree, the degree-10 coefficient stays negative, the
    Boolean degree stays 6, and any count differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-CERTBIN-48dcff/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-48dcff/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-48dcff/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-48dcff/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-48dcff/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-48dcff/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any Macaulay matrix, closure, or refutation rate.
    - A claim that the direct system is cheaper or is not.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
