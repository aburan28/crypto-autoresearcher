# EXP-BINSTD-1a479d
# Degree-band arithmetic. No degree oracle.
# Approved by DEC-20261003-a9b77d.
experiment:
  id: EXP-BINSTD-1a479d
  hypothesis_id: H-BINSTD-827f9a
  source_idea: IDEA-20261001-556cea
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Degree ceiling and nearby excess
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-a9b77d
  objective: >-
    Check the ceiling 4, the excess 1, and the product 8.
  inputs:
    floor: 2
    delta: 2
    ceiling: 4
    ceiling_gap: 2
    five_excess: 1
    n_min: 17
    n_max: 23
    n_span: 6
    span_excess: 4
    admissible: 3
    n_count: 3
    ell_count: 2
    cell_count: 6
    slots: 18
    gap_product: 8
  controls:
    - >-
      Two plus 2 is 4. Four minus 2 is 2. Reporting the ceiling
      equal to the floor 2 invalidates the run.
    - >-
      Five minus 4 is 1. Reporting 5 as inside the band invalidates
      the run.
    - >-
      Twenty-three minus 17 is 6. Six minus 2 is 4. The product of
      2, 1, and 4 is 8. The integers from 2 through 4 number 3.
      Three times two is 6, and six times 3 is 18.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {ceiling, nearby, span}
    - route in {sum, difference}
  metrics:
    primary:
      - five_excess
      - gap_product
      - implementations_agree
    secondary:
      - ceiling_gap
      - span_excess
      - slots
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The ceiling is 4. Five exceeds it by 1. The product of 2, 1,
      and 4 is 8.
    formula: >-
      Add 2 and 2. Subtract 4 from 5. Subtract 2 from 23 minus 17.
      Multiply those three gaps.
    source: >-
      IDEA-20261001-556cea states the floor 2, the delta 2, and the
      n list 17, 19, 23, read 2026-10-03. The gaps were recomputed
      in this design session. That computation is not a run. No
      degree was measured.
  scale_relevance:
    tier: toy
    justification: One written band and three listed n values. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The span excess 4 and the slot count 18 are required. A check that stops at the ceiling 4 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 1 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The ceiling is not 4.
    - The five-excess is not 1.
    - The product is not 8.
    - A degree is measured, or 5 is reported as inside the band.
  success_criterion: >-
    Both runs agree that 2 plus 2 is 4, that 5 minus 4 is 1, that
    23 minus 17 is 6, that 6 minus 2 is 4, that the product of 2, 1,
    and 4 is 8, and that six times 3 is 18.
  falsification_criterion: >-
    The runs agree that 2 plus 2 is 4, and 5 minus 4 is not 1.
  required_artifacts:
    - experiments/EXP-BINSTD-1a479d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-1a479d/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-1a479d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-1a479d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-1a479d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-1a479d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any degree oracle, Groebner run, or solver.
    - Any claim that a solving degree stays near 2.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
