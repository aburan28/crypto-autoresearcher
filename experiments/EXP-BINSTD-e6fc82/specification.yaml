    - IDEA-20260922-8278db
  version: 1
  title: >-
    Rho symmetry ledger |⟨pi_q,[-1]⟩|=2k (not 32k) on five c2pnb rows +
    toy prime/composite/null/degenerate Frobenius-order controls
  status: approved
  approved_by: DEC-20261002-500864
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-500864
    composing_decision: DEC-20261002-500864
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0: freeze certificate schema + preregistered 2k table + named
      32k wrong-answer fixture + control cell list BEFORE filing any
      symmetry-group cell. Stage 1: Part 1 certificates on five c2pnb rows
      (gcd(h,r)=1, k-prime ⇒ ord(mu)=k, B∉F_2 ⇒ pi_2 not endomorphism,
      A3 disclosed OPEN). Stage 2: toy prime-k' ord=k', composite proper
      divisor, null order 2, B∈F_2 degenerate TRUE. No Stage 3. No deployed
      attack. No AUXIN provisioning.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Independently recompute and freeze certificates that the Pollard-rho
    automorphism group available on G has order exactly 2k (not 32k) on
    each of the five composite-degree ANSI c2pnb curves, verify the
    pi_2-versus-pi_q distinction from B∉F_2, and confirm on toy subfield
    cells that ord(pi_q)=k' exactly when k' is prime while a proper
    divisor is observable when k' is composite — thereby filling the
    RQ-BINSTD symmetry column and unlocking d11575/8278db comparisons,
    or name a concrete falsifying / instrument / A3-revise outcome.

  class: representation
  class_note: >-
    Primary class is representation / certificate (Part 1) with a toy
    observational control arm (Part 2 / Stage 2). Carries
    HEUR-BINSTD-c07598-H0 (unconditional arithmetic; recorded as absence)
    and HEUR-BINSTD-c07598-H1 (A3 Aut(E)=Z/2, heuristic). Not an
    exponent-moving or cost-model-measurement experiment.

  scope:
    included:
      - >-
        Stage 0. Freeze certificate JSON schema; freeze preregistered
        symmetry_group_order=2k per k∈{11,13,17,19,23} and the named
        wrong answer 32k; freeze toy cell list (prime/composite/null/
        degenerate/baseline); implement order-finding and
        is_pi_2_an_endomorphism harnesses under implementation/; run a
        hard-coded-32k mutant audit that must FAIL. ZERO success cells
        filed as complete in Stage 0.
      - >-
        Stage 1. For each k∈{11,13,17,19,23} / named c2pnb row: load
        audited h,r,t,A,B; check gcd(h,r)=1; state ord(mu)=k by k-prime
        argument; check B∉F_2 (smallest subfield F_{2^16}); emit
        certificate with symmetry_group_order=2k CONDITIONAL on A3;
        record A3 status OPEN (especially c2pnb208w1 a=0). Prefer
        primary ANSI X9.62 when reachable without AUXIN.
      - >-
        Stage 2. On frozen toy cells with dk≤41: (i) prime-k' cells —
        exhaustive ord(pi_q) on a prime-subgroup point equals k';
        (ii) composite k'=6 cell — observe a proper divisor of 6;
        (iii) B∉F_2 cells — is_pi_2_an_endomorphism=FALSE; (iv) B∈F_2
        degenerate — TRUE; (v) null no-proper-subfield — symmetry order 2;
        (vi) optional toy a=0 vs a≠0 Aut enumeration at dk≤20 as A3
        cross-check (report only; does not silently close A3 on deployed
        rows).
    excluded:
      - Deployed relation search / index-calculus / rho break at m≥131.
      - Magma/Sage/cypari2 provisioning as the success path (AUXIN forbidden).
      - Silently asserting Aut(E)=Z/2 as unconditional without A3 disclosure.
      - Editing IDEA claim text; editing shared GOAL-ECDLP2M-001.yaml.
      - Amazon Bedrock.
      - Any exponent or break claim.
      - Designing IDEA-20260922-d11575 or IDEA-20260922-8278db inside this
        contract (successors only).

  inputs:
    proposal: ledger/proposals/IDEA-20260922-c07598.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-0cad45.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    curve_audit_readme: analysis/binstd-curve-audit/README.md
    curve_audit_params: analysis/binstd-curve-audit/binary-curve-params.txt
    curve_audit_certificate: analysis/binstd-curve-audit/audit-certificate.txt
    curve_audit_certify: analysis/binstd-curve-audit/subfield_certify.py
    emptiness_prerequisite: IDEA-20260922-6cf862
    optional_code_refs:
      - experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
      - experiments/EXP-BINSTD-0fae5a/specification.yaml
    cells:
      deployed_arm:
        curves:
          - {name: c2pnb176v1, k: 11, m: 176}
          - {name: c2pnb208w1, k: 13, m: 208, a_flag: 0}
          - {name: c2pnb272w1, k: 17, m: 272}
          - {name: c2pnb304w1, k: 19, m: 304}
          - {name: c2pnb368w1, k: 23, m: 368}
        q: 65536
        preregistered_symmetry_group_order: '2k'
        named_wrong_answer: '32k'
        a3_status: OPEN
      toy_arm:
        dk_max: 41
        prime_cells:
          - {d: 4, k_prime: 5}
          - {d: 4, k_prime: 7}
          - {d: 2, k_prime: 13}
          - {d: 8, k_prime: 5}
        composite_cells:
          - {d: 4, k_prime: 6}
        null_object: 'no proper subfield definition'
        degenerate_B_in_F2: true
        baseline_k1: true
        optional_aut_toy_dk_max: 20
      mutant: 'hard-coded symmetry_group_order=32k without endomorphism check'
    seeds:
      master: 20261002
      stage2_points: [202610021, 202610022]
      stage2_aut: 202610023

  controls:
    - name: ctl_preregistered_2k_freeze
      stage: 0
      blocking: true
      object: >-
        Preregistered symmetry_group_order=2k per row and named wrong
        answer 32k frozen in stage0/preregistered-2k.json BEFORE any
        Stage-1 certificate is written; never edited afterward.
    - name: ctl_hardcoded_32k_mutant
      stage: 0
      blocking: true
      object: >-
        Hard-coded 32k mutant must FAIL the Stage-0 audit (detected as
        Gal-orbit conflation without endomorphism check).
    - name: ctl_gcd_hr
      stage: 1
      blocking: true
      object: >-
        gcd(h,r)=1 on all five rows (mu≠1 half). Failure → O-BASELINE-BLOCK
        for that row; do not file ord(mu)=k.
    - name: ctl_B_notin_F2
      stage: 1
      blocking: true
      object: >-
        Smallest subfield containing B is F_{2^16} (B∉F_2) on all five;
        is_pi_2_an_endomorphism=FALSE at the certificate level.
    - name: ctl_a3_disclosure
      stage: 1
      blocking: true
      object: >-
        Every Stage-1 certificate records A3_status=OPEN (or REVISE if a
        later check closed it); never imply Aut(E)=Z/2 is proven here.
    - name: ctl_composite_proper_divisor
      stage: 2
      blocking: true
      object: >-
        Composite-k' cell must exhibit ord(pi_q) as a proper divisor of
        k' on at least one prime-subgroup point; failure → O-CONTROL-VOID.
    - name: ctl_null_order_2
      stage: 2
      blocking: true
      object: >-
        No-proper-subfield null reports symmetry_group_order=2.
    - name: ctl_degenerate_B_in_F2
      stage: 2
      blocking: true
      object: >-
        B∈F_2 degenerate control reports is_pi_2_an_endomorphism=TRUE.
    - name: ctl_stdlib_preferred
      blocking: true
      object: >-
        Prefer stdlib / existing audit arithmetic. Magma/Sage/cypari2 may
        not be provisioned mid-tick (AUXIN forbidden). If a dependency is
        missing, status failed_infrastructure / O-IMPEDIMENT — not math
        falsification.

  independent_variables:
    - curve_name
    - k
    - stage  # 0 | 1 | 2
    - toy_cell_kind  # prime_k | composite_k | null | degenerate_B_in_F2 | baseline_k1
    - seed

  metrics:
    primary:
      - symmetry_group_order_match_rate
      - gcd_hr_one_rate
      - ord_mu_equals_k_rate
      - is_pi_2_an_endomorphism_deployed
      - ord_pi_q_toy_prime_match_rate
      - composite_proper_divisor_observed
      - null_symmetry_order
      - degenerate_pi2_true
      - stage0_32k_mutant_caught
      - a3_status
    secondary:
      - peak_rss_bytes
      - wall_s
      - provenance_source  # openssl_secondary | ansi_x962_primary
      - aut_toy_a0_order
      - aut_toy_a_nonzero_order
      - termination_reason

  heuristic_under_test: HEUR-BINSTD-c07598-H1

  preregistered_prediction:
    quantity: >-
      symmetry_group_order=2k on 5/5 rows (A3 disclosed OPEN);
      is_pi_2_an_endomorphism=FALSE on deployed rows;
      toy prime-k' ord(pi_q)=k'; composite proper divisor observed;
      null order 2; B∈F_2 degenerate TRUE.
    formula: >-
      (A) gcd(h,r)=1 ⇒ mu≠1; k prime ⇒ ord(mu)=k; with Aut(E)=Z/2 (A3)
      ⇒ |⟨pi_q,[-1]⟩|=2k.
      (B) B∉F_2 ⇒ pi_2 not an endomorphism ⇒ 32k is the named wrong answer.
    source: >-
      IDEA-20260922-c07598 claims (A)/(B)/(C); HEUR-BINSTD-c07598-H0/H1;
      IDEA-20260922-6cf862 result A; analysis/binstd-curve-audit.
    claim_tier: certificate_plus_toy_observational
    measured_vs_modeled: >-
      gcd, B-subfield membership, toy ord(pi_q), and
      is_pi_2_an_endomorphism are MEASURED. The 2k table is a
      PREREGISTERED prediction written before Stage-1 outputs; never
      tuned afterward. A3 remains disclosed heuristic unless closed.

  scale_relevance:
    tier: crypto
    justification: >-
      Part 1 certificates are at the five deployed ANSI composite-degree
      rows (certificate arithmetic, not an attack). Stage 2 controls are
      toy (dk≤41) and do not transfer attack cost to deployed m.
    correspondence: null

  tail_checks:
    - >-
      Extreme: c2pnb208w1 (a=0) must carry A3_status=OPEN (or REVISE with
      evidence); never silently closed as Z/2 without a check.
    - >-
      Extreme toy: if any prime-k' cell returns ord≠k', export
      counterexample_certificate and label O-REFUTE-ORD.
    - >-
      Mutant: hard-coded 32k without endomorphism check must be caught
      in Stage 0.

  optimistic_assumptions:
    - assumption: >-
        Pure-Python toy subfield cells at dk≤41 finish within the
        advisory budget for exhaustive order-finding.
      bias_direction: >-
        May understate wall time; budget abort → O-IMPEDIMENT with
        measured CPU, never math falsification of (A)/(B).
    - assumption: >-
        OpenSSL secondary parameters agree with ANSI X9.62 on h,r,A,B
        for these five rows.
      bias_direction: >-
        Primary mismatch → O-PROVENANCE halt; not treated as (A)
        falsification until provenance is adjudicated.
    - assumption: >-
        IDEA-20260922-6cf862 emptiness / mu≠1 path remains available
        (designed EXP-BINSTD-0fae5a or audited gcd(h,r)=1).
      bias_direction: >-
        If blocked, Stage 1 files O-BASELINE-BLOCK rather than inventing
        mu≠1.

  memory_accounting: >-
    Peak RSS measured. Dominant structures: F_{2^{dk}} point arithmetic
    at toy scale (dk≤41) and integer certificates for Part 1. No large
    factor-base tables.

  hidden_overhead_honesty: >-
    Orbit canonicalisation cost O(k)·pi_q per rho step is charged in the
    ledger narrative and is NOT hidden inside o(1). No attack exponent is
    claimed. A3 remains an explicit open cofactor on the factor 2.

  replication:
    seeds: [202610021, 202610022, 202610023]
    independent_instances: 2
    independent_instances_note: >-
      Stage 1 certificate emission must be reproducible from the frozen
      harness (two independent process invocations). Stage 2 dual seeds
      on toy order-finding. Primary metrics must agree across
      complete_valid seeds.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 16
    maximum_workers: 1

  stopping_rules:
    - >-
      SR-1. Stage-0 preregistered-2k freeze missing → stop; status invalid.
    - >-
      SR-2. Hard-coded 32k mutant not caught → stop; status O-CONTROL-VOID /
      O-INSTRUMENT.
    - >-
      SR-3. gcd(h,r)≠1 on any row → O-BASELINE-BLOCK for that row; do not
      file ord(mu)=k.
    - >-
      SR-4. Toy prime-k' ord≠k' → O-REFUTE-ORD; export counterexample;
      do not retune the frozen 2k table.
    - >-
      SR-5. Composite proper divisor not observed → O-CONTROL-VOID; do not
      read (A) from that session.
    - >-
      SR-6. Advisory budget exhausted → preserve partial artifacts;
      O-IMPEDIMENT with measured quantity; never negative math evidence.
    - >-
      SR-7. Aut(E)>2 evidence → O-REVISE-A3; revise 2k disclosure; do not
      silently patch certificates.

  invalidation_rules:
    - Editing preregistered-2k.json after Stage-0 freeze.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Filing symmetry_group_order=2k without gcd(h,r)=1 and A3 disclosure.
    - Claiming break / exponent / deployed attack in run artifacts.
    - Overwriting a prior RUN-* directory.
    - Editing shared GOAL-ECDLP2M-001.yaml or IDEA claim text.
    - Using Amazon Bedrock.
    - Tuning 2k predictions after seeing Stage-1/2 outputs.
    - Asserting Aut(E)=Z/2 as unconditional without a recorded check.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze + 32k mutant caught; (2)
    symmetry_group_order_match_rate=1.0 with gcd_hr_one_rate=1.0 and
    A3_status disclosed on every row; (3)
    is_pi_2_an_endomorphism_deployed=FALSE on 5/5;
    (4) Stage-2 ord_pi_q_toy_prime_match_rate=1.0 and
    composite_proper_divisor_observed=true and null_symmetry_order=2 and
    degenerate_pi2_true=true; (5) no invalidation_rule fired. Outcome
    label O-CERT-2K. This fills the reachability-table symmetry column
    and unlocks successor comparisons; it does NOT claim an ECDLP break.

  falsification_criterion: >-
    ANY of: (F1) toy prime-k' ord≠k' (O-REFUTE-ORD);
    (F2) deployed pi_2 endomorphism TRUE (O-REFUTE-PI2);
    (F3) Aut(E)>2 with evidence (O-REVISE-A3 — revise, do not ignore);
    (F4) composite/null/degenerate controls fail while 2k was still read
    (O-CONTROL-VOID); (F5) Magma/Sage provisioned as the sole path to
    reported certificates. Budget exhaustion and provenance_disagree are
    NOT falsification of (A)/(B).

  required_artifacts:
    - experiments/EXP-BINSTD-e6fc82/implementation/
    - experiments/EXP-BINSTD-e6fc82/stage0/preregistered-2k.json
    - experiments/EXP-BINSTD-e6fc82/stage0/mutant-audit.json
    - experiments/EXP-BINSTD-e6fc82/stage0/api-freeze.md
    - experiments/EXP-BINSTD-e6fc82/stage1/certificates/
    - experiments/EXP-BINSTD-e6fc82/stage1/symmetry-cells.json
    - experiments/EXP-BINSTD-e6fc82/stage2/toy-order-report.json
    - experiments/EXP-BINSTD-e6fc82/stage2/controls-report.json
    - experiments/EXP-BINSTD-e6fc82/runs/
    - experiments/EXP-BINSTD-e6fc82/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write stage0/preregistered-2k.json and stage0/api-freeze.md;
          define certificate schema; ZERO success cells filed.
      - id: S0-MUTANT
        text: Run hard-coded 32k mutant audit; write mutant-audit.json.
      - id: S1-GCD
        text: >-
          For each of five curves, gcd(h,r)=1; halt row on failure
          (O-BASELINE-BLOCK); record provenance_source.
      - id: S1-ORD
        text: >-
          State ord(mu)=k by k-prime argument; check B∉F_2; emit
          certificates with symmetry_group_order=2k and A3_status=OPEN.
      - id: S1-CELLS
        text: >-
          Emit five reachability-table symmetry cells; write
          certificates/ and symmetry-cells.json.
      - id: S2-PRIME
        text: >-
          Exhaustive ord(pi_q) on prime-k' toy cells (expect =k'); dual
          seeds.
      - id: S2-COMPOSITE
        text: Observe proper divisor on composite-k' cell.
      - id: S2-CONTROLS
        text: >-
          Null order 2; B∈F_2 degenerate TRUE; B∉F_2 FALSE; optional
          a=0 Aut toy cross-check; write controls-report.json.
      - id: S2-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; observations only;
          no ledger status edits.

  assigned_to: executor
  executor_handoff: TASK-20261002-3de653
  snapshot_task: TASK-20261002-777348

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
