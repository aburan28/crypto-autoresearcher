experiment:
  id: EXP-HQCX-c67e50
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-967721; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-967721
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive and summary-statistic audit of HQC's fixed-weight sampler against an exact-uniform
    Fisher-Yates null, with an injected-bias sensitivity arm and a forward-propagation arm into the
    decoding pipeline
  objective: 'The one uncertainty a run reduces: whether assumption A22 - that HQC''s inputs are drawn
    uniformly from their fixed-weight shells, which is the probability space every committed GOAL-HQC-001
    measurement is defined on - is supported by the sampler''s actual output law, and if it is only
    approximately supported, how much error that introduces downstream. A run establishes (i) at sizes
    where every support can be enumerated, whether the deployed procedure''s output law is distinguishable
    from exact uniformity, by a chi-square over the complete support space rather than over summary
    statistics; (ii) the battery''s detection floor, fixed empirically by an injected-bias arm, so
    that a null verdict is a bound rather than an absence; and (iii) the transfer coefficient relating
    any measured sampler deviation to a shift in the quantities the campaign actually reports. The
    likely outcome is a licensing bound on A22, and the design is built so that outcome is reportable
    with a number. No attack, break, speedup or security consequence is claimed here or would follow
    from a run. No statement is made about what the published literature does or does not contain;
    this environment cannot reach external literature. No direction is declared impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at the tested (n, w) pairs and the
      executed sample counts, the reconstructed deployed sampler is or is not distinguishable from
      exact uniformity by the declared battery, at a stated detection floor; and any measured deviation
      shifts the campaign''s downstream quantities by at most a stated amount. WHAT DOES NOT FOLLOW:
      nothing about any specific software implementation, which this program has not executed and
      does not possess; nothing about timing or side channels, which are not measured; nothing about
      deployed parameter sizes, which are outside the exhaustive regime; no attack, no exploitable
      bias, and no security consequence of any kind.'
  inputs:
    procedure: 'STAGE 0 (zero compute): reconstruct the deployed procedure from the committed transcription
      and record every point where the transcription is incomplete; declare the statistic battery,
      the family-wise adjustment and the injected-bias parameterisation. STAGE 1 (minutes): implement
      the exact-uniform Fisher-Yates null and verify its own chi-square at (n, w) = (31, 4). STAGE
      2 (up to an hour): exhaustive arm at (29, 5) and (31, 4), 10^8 samples per arm, full-support
      tabulation and chi-squares. STAGE 3 (minutes): injected-bias sensitivity arm at three magnitudes;
      fit the detection floor. STAGE 4 (an hour): summary-statistic arm at n in {227, 587, 1019 if
      ord_n(2) = n-1 holds, else the next admissible prime}, 10^7 samples per arm. STAGE 5 (an hour):
      forward-propagation arm through the decoding pipeline, both samplers, reporting the induced
      shift in per-block failure rate and log2 A-hat_2.'
    instrument: Python 3.11 with numpy; NO Sage. Support tabulation by ranking each sorted support
      to an integer index with a combinatorial number-system encoder written from its definition and
      unit-tested against itertools enumeration at tiny sizes. Exact-uniform null by partial Fisher-Yates
      over a numpy index array. Chi-square and family-wise adjustment computed directly rather than
      via a statistics package, so the arithmetic is auditable. Both samplers draw from one shared
      numpy Generator stream. The forward-propagation arm reuses the same bit-packed ring arithmetic
      and numpy fast Walsh-Hadamard Reed-Muller decoder as the other contracts in this batch. Recorded
      through harness/runner.py.
    parameters: 'Exhaustive arm: (n, w) in {(31, 4) with C = 31465, (29, 5) with C = 118755}, 10^8
      samples per arm, giving expected cell counts of roughly 3178 and 842 respectively. Summary arm:
      n in {227, 587} plus one larger admissible prime, w in {8, 16, 32}, 10^7 samples per arm. Sensitivity
      arm: injected index bias at relative magnitudes {1e-4, 1e-3, 1e-2}, 10^8 samples each. Forward-propagation
      arm: n = 227, RM(1,5), n_e = 7, N = 224, T = 10^6 per sampler. Every n checked for ord_n(2)
      = n-1 at run time; all seeds from a frozen ladder.'
  controls:
  - Exact-uniform Fisher-Yates null arm on the same PRNG stream, same invocation, same statistics.
  - 'Self-consistency of the null arm: its own chi-square must be consistent with its degrees of freedom,
    or the test is void.'
  - Sensitivity arm with parameterised injected bias at three magnitudes, giving a measured detection
    floor.
  - Shared PRNG across arms so generator artefacts cancel in the arm difference.
  - 'Forward-propagation arm: both samplers through the identical decoding pipeline, reporting the
    induced shift in per-block failure rate and log2 A-hat_2.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is an exact-uniform sampler: partial Fisher-Yates over
    the index array, whose output law is provably uniform on weight-w supports, implemented independently
    of the deployed procedure and run through the IDENTICAL statistics and the identical downstream
    pipeline in the same invocation. FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW: (i) at
    the exhaustive sizes, a chi-square over the full support space consistent with its degrees of
    freedom - a null arm that itself fails uniformity means the test statistic or the enumeration
    is wrong and no signal-arm verdict is admissible; (ii) position-index marginals matching w/n and
    gap distributions matching their exact law to within Monte-Carlo error; and (iii) in the sensitivity
    arm, a deliberately biased sampler must be DETECTED at a measured magnitude, establishing the
    battery''s detection floor so that agreement between deployed and uniform arms is reportable as
    a bound rather than as an absence.'
  independent_variables:
  - 'sampler variant: reconstructed deployed / exact-uniform Fisher-Yates / injected-bias'
  - ring size n and weight w
  - injected bias magnitude
  - 'statistic: full-support / marginal / gap / rejection profile'
  metrics:
    primary:
    - full-support chi-square per arm
    - two-sample chi-square between deployed and uniform arms
    - maximum position-index marginal deviation
    - measured detection floor from the injected-bias arm
    secondary:
    - cyclic gap distribution deviation
    - rejection/collision count profile
    - transfer coefficient into log2 A-hat_2
    - minimum expected cell count and family-wise adjusted p-values
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The two-sample chi-square statistic between the deployed arm and the exact-uniform arm
      over the full support space at (n, w) = (29, 5), and the detection floor from the injected-bias
      arm.
    formula: Under exact uniformity every support has probability 1/C(n, w); with M samples the expected
      count per support is M/C(n, w) and the statistic sum over supports of (observed - expected)^2/expected
      is chi-square with C(n, w) - 1 degrees of freedom, so at (29, 5) and M = 10^8 the predicted
      value is 118754 plus or minus sqrt(2 * 118754) = 487. The position-index marginal is exactly
      w/n per index. The detection floor is defined as the smallest injected relative bias whose two-sample
      statistic exceeds the uniform arm's 99.9th percentile.
    source: Pre-registered in the parent proposal IDEA-20260816-967721 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The exhaustive arm runs at (n, w) = (31, 4) and (29, 5), where the complete support
      space is enumerable and the result is EXACT rather than extrapolated - there is no transfer
      assumption inside that arm at all, only a scope limit. The summary arm extends to n up to about
      a thousand and its transfer assumption is explicit and weak: that a sampler deviation large
      enough to matter would show in at least one of the position-index marginal, the gap law or the
      rejection profile. That assumption is a heuristic, is labelled as one, and is exactly what the
      injected-bias arm calibrates. Nothing is claimed at deployed sizes.'
    correspondence: null
  tail_checks:
  - Report the minimum and maximum observed cell counts, not only the chi-square, since a single wildly
    over- or under-represented support is a different defect from a diffuse one.
  - Check the gap distribution in its right tail specifically, where fixed-weight samplers with modular
    reduction artefacts would deviate first.
  - Verify the detection floor is stable across the two exhaustive (n, w) cells rather than being
    fitted to one.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort if the exact-uniform null arm fails its own chi-square, since the instrument is then void.
  - Abort the deployed arm if the committed transcription proves incomplete for the sampler, and report
    the incompleteness as the outcome.
  - Stop at the declared battery; no statistic is added after data has been seen.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The null arm passes its own chi-square, the injected-bias arm yields a finite
    detection floor stable across cells, and the run reports the deployed-versus-uniform comparison
    with that floor attached - whatever the verdict.
  falsification_criterion:
  - 'Deployed and uniform arms are indistinguishable at every statistic: A22 is licensed within the
    measured floor and the floor is the recorded obstruction.'
  - 'The null arm fails its own chi-square: the instrument is void.'
  - 'The injected-bias arm detects nothing at 1e-2: the battery has no demonstrated power and no verdict
    is issued.'
  - 'The transcription is incomplete: no verdict on the deployed procedure is issued and the gap is
    reported instead.'
  - 'A deviation is found but the transfer coefficient is zero within error: the deviation does not
    reach any campaign quantity, and that is reported rather than dressed up.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-967721
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact reconstruction of the deployed sampler from the committed transcription is not written
    out here; a Coordinator must confirm the transcription covers the procedure completely, because
    the signal arm is meaningless otherwise and reporting that gap is a legitimate outcome.
  - The injected-bias parameterisation must be fixed in advance - which index, which direction, what
    functional form - since a bias shaped like the battery's most sensitive direction would flatter
    the detection floor.
  - The family-wise adjustment across roughly 10^5 support cells needs to be specified concretely
    (Bonferroni over cells versus a single omnibus chi-square) before data exists.
  - The choice of a third, larger admissible prime for the summary arm is left open pending the ord_n(2)
    check and should be fixed at approval.
