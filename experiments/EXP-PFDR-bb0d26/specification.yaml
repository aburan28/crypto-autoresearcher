experiment:
  id: EXP-PFDR-bb0d26
  hypothesis_id: H-PFDR-727bfc
  source_idea: IDEA-20261017-078074
  question_id: RQ-PFDR-ae2fba
  goal_id: GOAL-PFDR-fd09e0
  version: 1
  title: >-
    Heuristic validation of H1 of IDEA-20261017-078074, the dual sum-product probe, at toy scale: exact nontrivial
    pair-sum coincidence counts of the x-label sets of rank-r log-GAP bases (r = 1, 2, 3) against a matched uniformly
    random label-set null on generated prime-order E/F_p, bits in {20, 24, 28}, a in {256, 512, 1024, 2048, 4096},
    45 toy cells, with a planted label AP, null-vs-null calibration and replication on fresh curves
  experiment_class: heuristic-validation
  status: approved
  frozen: true
  designed_at: '2026-10-22'
  designed_under_task: TASK-20261022-726d76
  selection_decision: DEC-20261022-a8c780
  approved_by: DEC-20261022-f1efde
  approval_decision: DEC-20261022-f1efde
  execution_authorized: true
  execution_scope: >-
    The five trials of experiments/EXP-PFDR-bb0d26/trial-plan.json and nothing else: selftest as RUN-PFDR-e44a19,
    census-toy-main as RUN-PFDR-4d8c71, analyze-main as RUN-PFDR-243425, census-toy-rep as RUN-PFDR-cd03e2 and
    analyze-final as RUN-PFDR-089edc, executed only by TASK-20261022-32fe8b through
    experiments/EXP-PFDR-bb0d26/runbook.yaml (session RBS-PFDR-bb0d26) in lane BATCH-8d6d84 of GOAL-PFDR-fd09e0.
    Toy scope only (generated curves of 20, 24 and 28 bits); the idea's real-curve extension is held for a user
    decision and is not authorized.
  approval_basis: >-
    AGENTS.md 'Standing user authorization' (user, 2026-09-06, "All is approved. Ideas/experiments should be always
    approved"), applied by DEC-20261022-f1efde after the Coordinator's completeness check and under the runnable
    condition of AGENTS.md 'Approval is bounded by execution'. Approval asserts nothing about H-PFDR-727bfc.
  status_note: >-
    Frozen at version 1 and approved 2026-10-22 by DEC-20261022-f1efde under AGENTS.md 'Standing user
    authorization'. The Coordinator checked completeness (controls, metrics, budgets, stopping rules, artifact paths,
    dependencies, launcher) before recording approval; approval asserts nothing about H-PFDR-727bfc. Any change after
    approval is a versioned protocol_amendment under experiments/EXP-PFDR-bb0d26/amendments/. The draft returned by
    DEC-20261022-a8c780 differs from these bytes only in the freeze fills (run ids, sha256 values, upstream commit) and
    these approval fields. Scope ruling of the top-level session, resolution R3: the approved scope is the toy part
    only; the real-curve extension of the idea is HELD for a user decision and could be added only by a versioned
    protocol_amendment. Every number in this contract is carried identically by the frozen driver run.py under
    the implementation directory (check.py spec-consistency).
  objective: >-
    For each of the 45 toy cells (bits, r, n), build on n_curves generated prime-order curves per cell one rank-r
    log-GAP label set, 20 uniformly random label sets (the null) and one planted label-AP set, all of exactly n
    distinct labels, count the nontrivial pair-sum coincidences C of each exactly, and record per cell kappa = S/M,
    its curve-cluster bootstrap 95% interval, z against the measured null variance, the plant recovery and a
    null-vs-null calibration z; replicate every flagged cell on a disjoint block of fresh curves. The experiment
    measures a coincidence count of x-label sets on generated toy curves; it measures no cost against rho, computes
    no discrete logarithm, uses no key or target point, touches no standardized or deployed curve, and claims no
    speedup and nothing about the security of any curve.
  inputs:
    implementation_sources:
      note: >-
        Files under experiments/EXP-PFDR-bb0d26/implementation/ (paths below relative to it). Their sha256 values
        are bound by trial-plan.json source_sha256, which itself binds this specification by sha256; this
        specification carries no digest of the trial plan or runbook. The vendored curve.py and the known-answer
        fixture are also recorded here and under input_bindings. __pycache__ directories are not sources and are
        never staged. No file of src/crypto_autoresearcher/index_calculus/** is added or edited (DEC-20261002-c3f49b
        NA-5 stays in force); every new script lives under the implementation directory.
      sha256_binding: trial_plan_source_sha256
      files:
      - path: run.py
        provenance: new; frozen driver (subcommands trial, design, selftest, census-toy, analyze); standard library plus PyYAML for the manifest
      - path: check.py
        provenance: new; producer-written output checker (imports run.py from the same bound directory; subcommand spec-consistency)
      - path: labelsum.c
        provenance: new; C kernel, pair sums of labels mod p (p below 2^31, exact 64-bit keys), radix sort, run counting
      - path: vendor/curve.py
        sha256: fcca2beb699b4785c25820df1d949b757be7a273efd2f4f015625d7aa13c67fa
        provenance: verbatim copy of src/crypto_autoresearcher/index_calculus/curve.py at the upstream commit named under input_bindings
      - path: fixtures/kat.json
        sha256: 54bd6542c0904266f586e961118ed66b524ac68da2c2103b95bab693387abf48
        provenance: known-answer vectors written by the implementation task from an independent brute-force script (small label sets, design anchors)
    curves:
      toy: >-
        prime-order ordinary short-Weierstrass E/F_p from vendor curve.generate_prime_order_curve(bits, seed); odd
        prime order excludes supersingular curves for p > 3; the generator rejects j = 0, j = 1728 and anomalous
        curves, so no toy curve has a beta-orbit
      toy_bits: [20, 24, 28]
      seed_rule: >-
        seed = block_offset + c, c = 0, 1, ...; block offsets main 8,100,000, replication 8,200,000, selftest
        8,900,000; c < 2000 < 100,000 so the blocks are disjoint. The reserved range of this experiment is
        8,000,000 to 8,999,999. It is disjoint from EXP-PFDR-ca5e01 (7,000,000 to 7,299,999 and selftest
        9,900,000 to 9,900,100), EXP-PFDR-011cd0 (c = 10 to 2009 and 20000 to 21999), EXP-PFDR-0b3699 (c = 2010
        to 9999), the Part B reservation (10000 to 19999) and Part C EXP-PFDR-969aae (c = 40000 to 79999). Cells
        at the same bits share the curve set of their block.
      source: run.py SEED_BLOCK, get_curve, selftest
    toy_cells:
      rule: 'bits x r in {1, 2, 3} x n in {256, 512, 1024, 2048, 4096}'
      count: 45
      cell_id: 'b<bits>-r<r>-n<n>'
      source: run.py BITS, RANKS, NS, cells()
    label_universe: >-
      L = {x in F_p : f(x) = x^3 + ax + b is a nonzero square}; |L| = (N - 1)/2 on a prime-order toy curve. A label
      is the R1 x-coordinate of a point other than O, identified with its negative.
    counting_convention: >-
      For a label set X of n distinct elements of F_p, m_s = #{ {u, v} : u, v in X, u != v, u + v = s mod p } for
      s in F_p, and C(X) = sum over s of binom(m_s, 2), the number of unordered pairs of distinct label pairs with
      equal sum; every coincidence involves four distinct labels (a shared label forces the other labels equal).
      D(X) = #{ s : m_s >= 1 }, the number of distinct pair sums. Pairs with u = v (3-term progressions
      2u = v + w) are not counted. Exact for every set; no sampling.
    log_gap_builder: >-
      Points P_1..P_r are drawn by curve.random_point from random.Random seeded by sha256("EXP-PFDR-bb0d26|" +
      labels) with labels (kind, block, cell, curve index). The half-box H(r, T) is the set of coefficient
      vectors c in [-T, T]^r whose first nonzero entry is positive, taken in lexicographic order with each
      coordinate ascending from -T; T is the least integer with |H(r, T)| = ((2T+1)^r - 1)/2 >= ceil(1.02 n) + 8.
      For each c in order the point Q = c_1 P_1 + ... + c_r P_r is formed; Q = O is skipped; a repeated label is
      skipped (counted); collection stops at exactly n labels. The numbers T, enumerated vectors, duplicate-skips
      and the first and last vector collected are recorded per job. If the half-box is exhausted before n labels the
      job is status degenerate (a cell with a degenerate curve is invalid, never null).
    null_builder: >-
      20 label sets per (cell, curve): x uniform in [0, p) by the job's seeded stream, kept when f(x) is a nonzero
      square, repeated x skipped, until exactly n labels. The replicate count and stream are fixed by the job.
    planted_builder: >-
      A true label AP: x_k = x_0 + k w mod p with x_0 uniform and w uniform in [1, p), the first m values of k = 0,
      1, 2, ... for which x_k is in L, plus n - m uniform random labels of L not in the AP. m is the least integer in
      [4, n/2] with internal(m) >= 0.30 x that curve's mean null count, where internal(m) = C of the m AP labels
      alone (exact); the plant is infeasible on a curve when even m = n/2 falls short.
    sizing: >-
      No pilot. n_curves = clamp(ceil(1.5 x 2500 / mu_ref), 50, 2000), mu_ref = 3 binom(n, 4) / p_ref, p_ref =
      0.75 x 2^bits, the random-set mean count per set at a mid-range prime of that bit size. Design-session
      arithmetic for the anchor cells (run.py cells() is the authority and selftest writes design.json): bits 28,
      n = 256 gives mu_ref about 2.6 and about 1440 curves; bits 28, n = 512 gives about 42 and about 89 curves; every
      cell with mu_ref >= 75 gets 50 curves (all bits 20 cells and the larger-n cells at bits 24). The cap 2000 is not
      reached by any cell. Whether a cell is powered is decided by the measured M, not by the formula.
    statistics:
      per_cell: >-
        S = sum over curves of C(gap); M = sum of per-curve null means (20 replicates); V = sum of per-curve null
        sample variances; kappa = S/M; z = (S - M)/sqrt(V (1 + 1/20)); 95% curve-cluster bootstrap interval of kappa
        (2000 resamples, seeded per cell, percentile 2.5 and 97.5, records sorted by curve index first);
        plant_kappa and plant_z the same way with the planted counts; z_cal = null replicate 0 of each curve as a
        pseudo-structured set against the other 19 (variance factor 1 + 1/19). Secondary: D ratio = sum D(gap) /
        sum mean D(null) with its bootstrap interval; kappa for even and odd curve indices separately (C-aa-curves).
      powered: M >= 2500
      source: run.py _cell_stats, cmd_analyze
    cell_classes:
      order: first matching class in the order below
      invalid: 'fewer ok main-census records than n_curves (failed_infrastructure or degenerate), or the design missing'
      inconclusive_underpowered: M < 2500
      inconclusive_plant_not_recovered: 'not (plant feasible on every curve and plant_kappa >= 1.15 and plant_z > 4)'
      flagged: '|kappa - 1| >= 0.10 and |z| > 4'
      'null': '|kappa - 1| < 0.05 and the bootstrap 95% interval inside [0.90, 1.10]'
      intermediate: otherwise
      valid_cells: the classes null, flagged and intermediate
    calibration_gate: 'over powered cells: population sd of z_cal in [0.75, 1.25] and |mean of z_cal| <= 0.35'
    replication_rule: >-
      every flagged cell is re-run on the replication block with its n_curves; it survives iff the replication
      kappa deviates in the same sign, |z| > 3 and |kappa - 1| >= 0.05
    toy_reading_rules:
      field: analysis.json /outcome (analyze-final)
      order: first matching rule in the order below
      O-INVALID: calibration gate fails, or fewer than 50% of the 45 cells are valid
      O-STRUCT: at least one flagged cell survives replication
      O-PENDING-REPLICATION: >-
        a flagged cell has no complete replication records; legitimate only as the intermediate value of
        analyze-main; at analyze-final it means the replication did not run and the reading is O-MIXED pending repair
      O-NULL: every valid cell is null and at least 80% of the 45 cells are valid
      O-MIXED: otherwise
    headline:
      field: analysis.json /headline (analyze-final)
      order: first matching rule in the order below
      FALSIFY_SCOPED: outcome is O-STRUCT
      NOT_EVIDENCE: outcome is O-INVALID
      SUPPORT_SCOPED: outcome is O-NULL
      INCONCLUSIVE: otherwise
      note: the headline is decidable from the toy reading alone; no real-curve datum is read by any trial
    secondary_analysis: >-
      per (bits, r) least-squares slope of log kappa on log2 n over valid cells with kappa > 0 and at least three
      such cells; the D ratio per cell against the idea's 0.9 clause; reported, not decisive
  input_bindings:
    vendor_curve_py:
      path: experiments/EXP-PFDR-bb0d26/implementation/vendor/curve.py
      sha256: fcca2beb699b4785c25820df1d949b757be7a273efd2f4f015625d7aa13c67fa
      upstream_path: src/crypto_autoresearcher/index_calculus/curve.py
      upstream_commit: dc61c5e1ec10c2e5aacffac9d46ca4b9bf8ba542
      role: >-
        curve generator for every toy trial (generate_prime_order_curve, sqrt_mod, group law); verbatim copy of the
        upstream source at the named commit, read only
    known_answer_fixture:
      path: experiments/EXP-PFDR-bb0d26/implementation/fixtures/kat.json
      sha256: 54bd6542c0904266f586e961118ed66b524ac68da2c2103b95bab693387abf48
      role: known-answer vectors for the kernel, the builders and the design anchors
  coordinator_resolutions:
  - id: R1
    topic: calibration band
    text: >-
      IDEA-20261017-078074 asks for the null-vs-null z distribution to be checked but fixes no band. This contract
      uses sd(z_cal) in [0.75, 1.25] and |mean| <= 0.35 over powered cells. With about 45 powered cells the sampling sd of
      a sample sd of N(0,1) values is about 1/sqrt(2 x 45) = 0.105 and that of a sample mean about 1/sqrt(45) = 0.149,
      so the band is about 2.4 standard errors on each statistic and the false-failure rate under exact calibration is
      about 3% (about 9% for a band of two standard errors, which is why the 90-cell band of EXP-PFDR-ca5e01 is not
      reused at 45 cells). Cells at the same bits share curves, so z_cal values are not independent, and the
      band is pre-registered, not tuned. A calibration failure is O-INVALID (no evidence), never a reading of H1.
  - id: R2
    topic: counting convention and the sumset clause
    text: >-
      The idea counts nontrivial coincidences x_1 + x_2 = x_3 + x_4. The contract counts unordered pairs of distinct
      labels with equal sums (four distinct labels; 3-term progressions excluded), E[C] = 3 binom(n,4)/p for a random
      set. The idea's clause |X+X| >= 0.9 of the random-set expectation is kept as the secondary D ratio, not a
      decisive test: at every tested cell the sumset is either saturated (bits 20, large n) or a few percent or
      less below the pair count n(n-1)/2 (the null C is about 2% of the pair count at bits 20, n = 256 and far less
      elsewhere), so the D ratio cannot move by 10% unless C moves by a factor of about 5 or more even in the most
      sensitive cell. C is the decisive statistic.
  - id: R3
    topic: scope of the idea's real-curve extension (held)
    text: >-
      Ruling of the top-level session, adopted by the Coordinator, replacing the Coordinator's first reading. The goal
      scope reads "public toy curves only, no deployed target, no private key, and no claim about the security of any
      deployed curve in either direction" and the user has not widened it; a scope the Coordinator widens by its own
      reading is not authorised. The idea's second prediction (verified coincidence counts on secp256k1 and NIST P-256
      for a up to 4096) is therefore NOT admitted in the scope this experiment is approved for. It is held for a user
      decision as a severable extension (see held_extension). Nothing in the approved scope depends on it: this
      contract has no real-curve trial, no standardized-curve constant, no real-curve cell, rule or fixture, and
      neither analyze-main nor analyze-final reads any real-curve datum. The idea's real-curve prediction stays
      untested and unclaimed. The held extension could be added only by a versioned protocol_amendment after the user
      admits it, followed by a new approval.
  - id: R4
    topic: shape of the log-GAP and what is not tested
    text: >-
      The idea writes A = {c_1 P_1 + ... + c_r P_r : |c_i| <= T} with a = |A| and X = x(A). A and -A share labels, so
      the contract takes one representative of each +-c pair (first nonzero coordinate positive) and defines a as
      the number of distinct labels, filled in lexicographic order with a partial outermost layer, which is the
      construction style of EXP-PFDR-ca5e01 applied on the group side. Translated boxes (x(Q + c P)), other box
      orders, and sets with both lifts are different objects and are not tested; the interpretation limits say so.
  - id: R5
    topic: flag and replication rule
    text: >-
      The idea's third falsification condition reads off by >= 10% at z > 4 on fresh P_i, and its H1 validation plan
      reads flag any z above 3 and replicate on fresh curves. The contract flags in both directions at |kappa - 1| >=
      0.10 and |z| > 4 (the idea's prediction block) and confirms on the disjoint replication block at the same sign,
      |z| > 3 and |kappa - 1| >= 0.05. The effect size of a surviving cell is read from the replication block
      (winner's curse). With 45 cells the chance that a calibrated null produces a flag is about 0.3%.
  - id: R6
    topic: sizing without a pilot
    text: >-
      Unlike EXP-PFDR-ca5e01 this contract has no pilot. Both the random-set mean 3 binom(n,4)/p and the number of
      curves are closed-form, and the mean is checked after the fact: the per-cell ratio of the measured null mean
      to the formula is reported in analysis.json and a ratio outside [0.8, 1.25] is listed as an anomaly (not a gate,
      because the null is itself the comparison object and the formula is only a sizing aid). A cell with measured M
      < 2500 is underpowered and inconclusive, never null.
  - id: R7
    topic: determinism, bootstrap order and incomplete replication
    text: >-
      With 4 workers, jobs files are written in completion order. run.py sorts each cell's records by curve index
      before the bootstrap. Every job record is a pure function of (cell, block, curve index) except its seconds
      field. A flagged cell whose replication has fewer distinct ok curves than its n_curves is recorded as
      replication incomplete and cannot carry O-STRUCT (the outcome is then O-PENDING-REPLICATION).
  - id: R8
    topic: checker scope
    text: >-
      check.py exits 0 (CHECK OK) or 3 (CHECK FAIL). It re-derives the design table; census completeness (every
      planned key is present as an ok record or accounted for by a failed_infrastructure record for that same key);
      a seeded replay of up to 4 small-n toy jobs with a brute-force recount; and, per cell, S, M, kappa, z, z_cal,
      the class, the calibration gate, fraction_valid, the flagged list, the toy reading and the headline. It does not
      recompute the bootstrap interval or the replication statistics beyond the recorded interval. It is
      producer-written and is not independent review, which re-derives these.
  - id: R9
    topic: instrument controls for the held extension (text only)
    text: >-
      Recorded so a later amendment is not designed from scratch, and not part of the approved scope: at 256 bits the
      random-set mean is about 2^-208 and z is meaningless, so a real-curve reading would be the exact integer count
      of a log-GAP set, of one null set and of one planted AP of 64 labels whose verified count must equal its
      integer-method count, with truncated 64-bit keys producing candidates that are verified in exact arithmetic and
      every hit re-derived by the checker before any reading. The approved implementation neither builds nor exercises
      any of this.
  - id: R10
    topic: scale of the reading
    text: >-
      The toy readings are read on generated curves of 20 to 28 bits and n up to 4096 only. No transfer to larger
      p, larger n, standardized curves or any security statement is assumed; the held extension would be read on its
      own cells with no transfer between the parts.
  controls:
  - id: C1
    name: instrument selftest
    check: >-
      trial selftest: labelsum.c equals a brute-force Python count of C and D on at least 40 label sets (p of 12
      to 16 bits; null, log-GAP r = 1, 2, 3, planted); the log-GAP builder equals a slow path that recomputes every
      collected label with Curve.mul and checks the lexicographic first-nonzero-positive order, distinctness and
      the half-box bound; a hand-built set with exactly one planted coincidence is found with count 1; the label
      scaling identity of C7 holds; design.json is written from the closed-form sizing
    role: instrument gate; a failure voids the experiment as an instrument defect
    provenance: run.py cmd_selftest
  - id: C2
    name: matched random null
    check: 20 uniformly random label sets of the same n on the same curve; kappa and z are read against their per-curve means and variances
    role: removes Hasse fluctuation of p and N at fixed n and the label-universe restriction shared by every set
    provenance: IDEA-20261017-078074 control 1
  - id: C3
    name: planted label AP
    check: >-
      per curve a true label AP of m labels plus random fill, m sized for internal coincidences >= 0.30 x the
      curve's null mean; a cell is read only if the plant is feasible on every curve and plant_kappa >= 1.15 with
      plant_z > 4
    role: positive control; a cell that does not recover the plant is inconclusive, never null
    provenance: IDEA-20261017-078074 control 2
  - id: C4
    name: null-vs-null calibration
    check: calibration gate over powered cells (sd of z_cal in [0.75, 1.25], |mean| <= 0.35)
    role: checks that z is N(0,1) under the null for this counting convention and variance estimate
    provenance: ca5e01-style control; band per Coordinator resolution R1
  - id: C5
    name: disjoint seed blocks and replication on fresh curves
    check: main, replication and selftest curves come from disjoint seed blocks; every flagged cell is replicated on the replication block
    role: separates discovery from confirmation
    provenance: IDEA-20261017-078074 H1 validation plan; Coordinator resolution R5
  - id: C6
    name: checker replay and brute recount
    check: check.py replays up to 4 seeded small-n toy jobs field by field and recounts each sampled structured set by brute force without the kernel
    role: catches a kernel or builder defect on the measured data
    provenance: check.py census branch
  - id: C7
    name: label scaling identity
    check: >-
      selftest: multiplying every label of 12 toy sets by u^2 mod p for random units u leaves C and D exactly
      unchanged (the twist isomorphism x -> u^2 x preserves label additivity)
    role: exact A/A of the representation; a mismatch is an instrument defect
    provenance: Coordinator design (coordinate-isomorphism check on the kernel and the modular reduction)
  - id: C8
    name: Pollard rho
    check: not run
    role: >-
      No cost claim is made. RQ-PFDR-ae2fba's matched rho control applies to cost cells; this is a coincidence-count
      cell on the yield-column side. A costed follow-up adds rho on the same curves as its matched cost control.
    provenance: RQ-PFDR-ae2fba constraints
  independent_variables:
  - bits in {20, 24, 28}
  - rank r in {1, 2, 3}
  - label-set size n in {256, 512, 1024, 2048, 4096}
  - set construction in {rank-r log-GAP, uniform null, planted label AP}
  - seed block in {main, replication}
  metrics:
    primary:
    - name: kappa per toy cell
      pointer: 'analysis.json (analyze-final) /cells[]/kappa with /ci95, /z, /S, /M, /V, /curves, /powered, /cls'
      prediction: P1
    - name: toy reading
      pointer: analysis.json /outcome, /fraction_valid, /flagged_cells
      prediction: P1 (O-NULL) against P-detect (O-STRUCT)
    - name: calibration
      pointer: analysis.json /calibration (n, mean, sd, pass) and /cells[]/z_cal
      prediction: C4
    - name: planted recovery
      pointer: analysis.json /cells[]/plant_kappa, /plant_z, /plant_feasible_all, /planted_recovered
      prediction: P2
    - name: replication of flagged cells
      pointer: analysis.json /cells[]/replication (curves, kappa, ci95, z, survives) for cls == flagged
      prediction: P-detect
    - name: headline
      pointer: analysis.json /headline
      prediction: P1 against P-detect
    secondary:
    - name: slope of log kappa on log2 n per (bits, r)
      pointer: analysis.json /secondary_slope_logkappa_per_log2n
      prediction: descriptive; reported, not decisive
    - name: D ratio per cell
      pointer: analysis.json /cells[]/d_ratio with its interval
      prediction: descriptive; the idea's 0.9 clause (resolution R2)
    - name: measured null mean against the formula
      pointer: analysis.json /cells[]/null_mean_over_formula
      prediction: descriptive; anomaly list per resolution R6
    - name: even-odd curve kappa
      pointer: analysis.json /cells[]/kappa_even, /kappa_odd
      prediction: descriptive A/A noise floor (C-aa-curves)
    - name: infrastructure failures
      pointer: raw-result.json /summary/jobs and /summary/failed_infrastructure of the census runs; records with status != ok in the jobs files
      prediction: must be reported; never a metric value
    - name: log-GAP geometry
      pointer: toy-main-jobs.jsonl /gap_meta (T, enumerated, duplicate_skips, first and last vector)
      prediction: descriptive
    - name: per-job wall time
      pointer: jobs files /seconds
      prediction: descriptive; excluded from determinism comparisons
  heuristic_under_test: H1
  preregistered_predictions:
  - id: P1
    claim: H1 at the tested toy scope
    test: '|kappa - 1| < 0.05 with the bootstrap 95% interval inside [0.90, 1.10] in every powered toy cell (every valid cell null, outcome O-NULL)'
    source: IDEA-20261017-078074 claim and H1; never adjusted after a run
  - id: P-detect
    claim: detection threshold of the alternative
    test: '|kappa - 1| >= 0.10 at |z| > 4 in some toy cell, confirmed on fresh curves (outcome O-STRUCT)'
    source: IDEA-20261017-078074 predictions block (first entry) and falsification condition 3; replication per R5
  - id: P2
    claim: the instrument detects a known excess
    test: 'plant_kappa >= 1.15 and plant_z > 4 in every powered toy cell'
    source: IDEA-20261017-078074 control 2
  preregistered_prediction:
    quantity: kappa per powered toy cell against 1; plant recovery; calibration of z_cal
    formula: >-
      P1 |kappa - 1| < 0.05 and CI inside [0.90, 1.10] in every powered toy cell; P2 plant_kappa >= 1.15 and plant_z
      > 4; calibration sd(z_cal) in [0.75, 1.25] and |mean| <= 0.35
    source: IDEA-20261017-078074 claim, H1 and controls; random-set law E[C] = 3 binom(n,4)/p derived in resolution R2; never adjusted after a run
  heuristic_validation:
    heuristic: >-
      H1 of IDEA-20261017-078074 (carried as H1 of H-PFDR-727bfc): labels x(c P), |c| <= T, behave as independent
      uniform elements of the label universe, so label pair-sum coincidences follow the random-set law. Quantifiers
      as tested: for every powered toy cell (bits in {20, 24, 28}, r in {1,2,3}, n in {256, ..., 4096}), pooled over
      the cell's curves, |kappa - 1| < 0.05.
    source: IDEA-20261017-078074 (heuristic_assumptions H1, claim, first prediction)
    rigorous_support: >-
      Recalled, not read: equidistribution of x(cP) over short coefficient ranges is the type of result in Shparlinski's
      work on sequences of points (pointer only); the sum-product phenomenon of Ahmadi-Shparlinski 2010 is recalled as
      a pointer. No bound at these sizes is claimed and none is used to set a threshold.
    operationalization: >-
      C(X) per the counting convention is the nontrivial pair-sum count; kappa = S/M pools structured counts against
      matched null means over the cell's curves. H1 not contradicted at a toy cell = class null; contradicted =
      flagged and surviving replication.
    what_is_uniform: >-
      The comparison object is the uniform n-subset of the label universe on the same curve, measured (20 replicates
      per curve), not the formula.
    scale_access: >-
      Toy scale: direct sampling at p of 20 to 28 bits, n up to 4096. No correspondence is used and no transfer to larger
      sizes or other curves is claimed (resolution R10).
    sample_size_justification: >-
      Curves per cell are sized so the expected null total is at least 3750 (1.5 x 2500). For counts with Poisson-like
      variance the sd of S - M is then about sqrt(3750 x 1.05) = 63, so a true 10% excess (375) sits about 6 sd out and
      the flag rule |z| > 4 detects it with probability above 0.95 under Poisson variance; over-dispersed counts (large
      cells where m_s is large and the counts are strongly correlated through shared labels) lower this, and z uses the
      measured null variance, so it stays calibrated while power may drop. The null class needs the bootstrap interval inside
      [0.90, 1.10], which at M >= 2500 needs a relative sd near 2%. A cell with measured M < 2500 is underpowered and
      inconclusive.
    comparison_metric: >-
      per toy cell kappa with its curve-cluster bootstrap 95% interval and z; plant_kappa and plant_z; calibration sd
      and mean of z_cal; replication kappa and z per flagged cell
    tail_checks_available: >-
      every flagged and intermediate toy cell is listed with its statistics; the largest |z| over powered cells is
      compared descriptively with the expected maximum of that many standard normals (about 2.4 at 45); cells whose
      plant is infeasible are listed; every failed_infrastructure job is listed with its cell and curve
    controls_for_heuristic: C1 to C7 above; C2 is the null object of the same shape, C3 the planted positive and C7 the exact representation identity.
  scale_relevance:
    tier: toy
    justification: >-
      Generated curves of 20 to 28 bits, n up to 4096, 50 to 1440 curves per cell. No cryptographic-scale statement
      about any attack, cost or security is made and no transfer or extrapolation assumption is made (AGENTS.md rule 7).
    correspondence: null
  tail_checks:
  - every flagged and intermediate toy cell is reported individually with S, M, kappa, interval, z and plant statistics
  - the largest |z| over powered toy cells against the expected maximum of that many standard normals (descriptive)
  - every toy cell with plant_feasible false on any curve is listed with its m cap
  - every failed_infrastructure job is listed with its cell, block, curve index and status string
  replication:
    seeds: [8100000, 8200000, 8900000]
    seed_rule: >-
      curve seed = block offset + curve index (main 8,100,000, replication 8,200,000, selftest 8,900,000); set seeds =
      sha256 of the experiment id and (kind, block, cell, curve) labels
    independent_instances: 5
    trials:
    - trial_id: selftest
      run_id: 'RUN-PFDR-e44a19'
      stage: selftest
      note: instrument gate and design table; writes selftest.json and design.json
    - trial_id: census-toy-main
      run_id: 'RUN-PFDR-4d8c71'
      stage: census
      note: main block, every cell of design.json with its n_curves
    - trial_id: analyze-main
      run_id: 'RUN-PFDR-243425'
      stage: analyze
      note: writes analysis-main.json and flags.json; O-PENDING-REPLICATION is a legitimate value here
    - trial_id: census-toy-rep
      run_id: 'RUN-PFDR-cd03e2'
      stage: census
      note: replication block, flagged toy cells of flags.json only; an empty toy-rep-jobs.jsonl is the recorded result when no cell is flagged
    - trial_id: analyze-final
      run_id: 'RUN-PFDR-089edc'
      stage: analyze
      note: writes analysis.json (the decisive fields) and flags.json
    replication_note: >-
      Within-cell replication is across curves (50 to 1440 per cell) and across 20 null replicates per curve; confirmation
      is the replication block on fresh curves for flagged toy cells only. Trials run strictly in the order above, each
      depending on the previous one.
    determinism_excluded_fields: [seconds, jobs record order]
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 43200
    wall_clock_seconds_per_trial:
      selftest: 3600
      census-toy-main: 43200
      analyze-main: 3600
      census-toy-rep: 43200
      analyze-final: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 5
    maximum_workers: 4
    note: >-
      Machine protection only: at most 4 worker processes (run.py WORKERS), kernel timeout 3600 s per call, about
      0.3 to 0.6 GB per worker at n = 4096, trial memory caps 2048/4096/2048/4096/2048 MB, per-trial watchdogs as
      above. Design-session estimate, unmeasured: the toy main census is about 3 to 6 CPU-hours (the 9 cells at n =
      4096 dominate at about 10 s per curve, the n = 256 cells at bits 28 are many curves but cheap), the replication
      census bounded by the main census. The implementation task may time a single synthetic null-only set on the
      selftest block only. A timeout, memory kill or kernel failure is failed_infrastructure, never evidence. Not a
      research budget.
  stage_estimates:
  - stage: selftest
    trial_id: selftest
    wall_clock: minutes
    cpu: negligible
    memory_mb: 2048
    sharding: one process
  - stage: census toy main
    trial_id: census-toy-main
    wall_clock: about 1 to 2 hours at 4 workers (design-session estimate, unmeasured)
    cpu: about 3 to 6 CPU-hours (estimate)
    memory_mb: 4096
    sharding: 4 workers over (cell, curve) jobs, largest n first
  - stage: analyze main
    trial_id: analyze-main
    wall_clock: minutes (2000 bootstrap resamples per cell)
    cpu: negligible
    memory_mb: 2048
    sharding: one process
  - stage: census toy replication
    trial_id: census-toy-rep
    wall_clock: zero to at most the main census, depending on the number of flagged cells
    cpu: at most the toy main census
    memory_mb: 4096
    sharding: 4 workers
  - stage: analyze final
    trial_id: analyze-final
    wall_clock: minutes
    cpu: negligible
    memory_mb: 2048
    sharding: one process
  stopping_rules:
  - >-
    selftest stops after its checks and design.json; a census after every planned (cell, curve) job of its
    block; an analyze trial after writing its analysis file and flags.json.
  - A kernel call exceeding 3600 s is failed_infrastructure for that job; its cell is invalid in that block, never null; the census continues.
  - A trial exceeding its watchdog (3600/43200/3600/43200/3600 s) stops and is failed_infrastructure for its unfinished work, never a metric value.
  - census-toy-rep runs only the flagged cells named in flags.json; with none flagged it records an empty toy-rep-jobs.jsonl and stops.
  - Stop after the five planned trials; no sixth run without a protocol amendment and a new approval.
  - A crash, timeout or memory kill is failed_infrastructure; never a metric value (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    the selftest fails (a kernel count differs from brute force, a builder differs from its slow path, the scaling
    identity fails, or the planted-coincidence check fails); the experiment is void as an instrument defect and no
    later trial is read
  - check.py exits non-zero on a run directory; that run is invalid and every trial reading it is held
  - design.json does not re-derive from the closed-form sizing rule; every later trial is invalid
  - a census replay or brute-force recount mismatch (check.py C6); that census run is invalid
  - a job with status failed_infrastructure or degenerate; its cell is invalid in that block (main) or replication incomplete (replication), never null and never a refutation
  - the calibration gate fails; outcome O-INVALID, no evidence about H1
  - a manifest trial_plan_sha256 or code_sha256 differs from the frozen trial plan; the run is invalid
  - any byte of the specification, hypothesis, trial plan, runbook or implementation/ changed after approval without a versioned protocol_amendment; every affected run is invalid
  success_criterion: >-
    SUPPORT of H1 at the tested toy scope (45 cells, bits 20 to 28, r <= 3, 256 <= n <= 4096, these seed blocks):
    analysis.json /headline == SUPPORT_SCOPED, i.e. on the comparison C-struct-null the toy reading is O-NULL (the
    calibration gate on the C-aa-null noise floor passes, at least 80% of the 45 cells are valid and every valid cell
    is null, with the plant recovered on C-plant-null per P2), the selftest passed, and check.py exits 0 on all
    five runs (P1).
  falsification_criterion: >-
    FALSIFY H1 at the surviving cells only: analysis.json /headline == FALSIFY_SCOPED, i.e. the toy reading on
    C-struct-null is O-STRUCT: at least one cell flagged at |kappa - 1| >= 0.10 and |z| > 4 on the main block
    survives a complete replication with the same sign, |z| > 3 and |kappa - 1| >= 0.05, on checker-valid runs with
    the calibration gate passing and the selftest passed (P-detect).
  inconclusive_criterion: >-
    INCONCLUSIVE: O-MIXED (calibration passes and at least 50% of cells are valid, but neither O-NULL nor O-STRUCT
    holds: some valid cell is intermediate or flagged without surviving replication, or fewer than 80% of cells are
    valid) or O-PENDING-REPLICATION at analyze-final, read as O-MIXED pending repair; the decision names those
    cells. NOT_EVIDENCE (O-INVALID) and any checker-invalid run are not evidence. A timeout, memory kill or crash is
    failed_infrastructure, never evidence.
  heuristic_criterion: >-
    O-NULL leaves H1 not contradicted at the tested toy scope; it never confirms the asymptotic random-set statement
    and says nothing about n above 4096, p above 2^28, standardized curves, other labelings, translated or other-shaped
    boxes, h >= 3, or any security claim. O-STRUCT contradicts H1 at the surviving toy cells only, with the effect size
    read from the replication block. A cell whose plant is not recovered is inconclusive, never null.
  decision_impact:
    on_positive: >-
      SUPPORT_SCOPED: H-PFDR-727bfc may move to analyzed and, after independent review (blind recount of S, M and
      kappa from the job records, re-derivation of every class and of the headline, a kernel spot-check on sampled
      sets), to supported at the tested toy scope only. The evidence record carries an obstruction block (quantity
      kappa per cell with its 95% interval, the runs it is read from, the scope above) with its resource_check, and
      the reading is a scoped closure of label-describable rank <= 3 log-GAP bases at the toy sizes tested (scoped, not
      reject_scoped). The implicit-membership route of KN-OPEN-020 for the unknown-sharing base of IDEA-20261017-bbc53e
      is then not opened by a label predicate at these sizes; the growth-in-n question stays with the
      EXP-PFDR-0b3699 lineage and the idea's real-curve prediction stays untested.
    on_negative: >-
      FALSIFY_SCOPED: instrument before theory; independent review re-derives the surviving cells from the job
      records, replays sampled jobs and spot-checks the kernel. On a confirmed surviving cell H-PFDR-727bfc is
      rejected in scope at those cells only, on a declared empirical_only basis carrying its replication, or weakened
      if review does not confirm. The surviving cells feed a costed follow-up contract with the matched Pollard rho
      control and IDEA-20261017-bbc53e's delta-to-exponent translation using the replication-block kappa; never an
      attack claim.
    on_inconclusive: >-
      INCONCLUSIVE: no status move; the decision names the non-null toy cells and the next contract refines only those
      (more curves, or a replication-only amendment).
    on_invalid: >-
      NOT_EVIDENCE or a checker-invalid run: no evidence; the instrument or infrastructure is repaired and the
      affected trials re-run under a versioned amendment.
  interpretation_limits:
  - x-labels (R1) only; nothing about y-labels, other labelings or other models of the curve
  - rank-r log-GAP label sets as defined (one representative of each +-c pair, lexicographic fill); translated boxes, other fills and non-GAP bases are not tested
  - toy scale p of 20 to 28 bits and n up to 4096; nothing about other p, n above 4096, or any cost
  - no standardized or deployed curve is touched and nothing is said about secp256k1, P-256 or the security of any curve; the idea's real-curve prediction is held (resolution R3)
  - not a test of Choi's characteristic-0 theorem (arXiv:2510.03828), only of an F_p transfer at small sizes
  - the sum-product bounds of Ahmadi-Shparlinski are recalled pointers; no tested cell has a proven kappa = 1 anchor
  - cells at the same bits share their curve sets; cell statistics and z_cal values are correlated
  - check.py is producer-written; it is not independent review, which precedes any status move (resolution R8)
  - the thresholds are pre-registered; no threshold is moved after a run without a versioned protocol_amendment
  variable_ledger:
    independent:
    - {name: bits, levels: [20, 24, 28]}
    - {name: rank_r, levels: [1, 2, 3]}
    - {name: set_size_n, levels: [256, 512, 1024, 2048, 4096]}
    - {name: set_construction, levels: [rank_r_log_gap, uniform_null, planted_label_ap]}
    - {name: seed_block, levels: [main, replication]}
    factors:
    - name: prime_p_and_curve
      treatment: randomized
      how: drawn by the vendored generator from (bits, seed = block offset + c); the same curve serves every arm of a cell on that curve
    - name: base_points_P_i
      treatment: randomized
      how: seeded uniform points per (cell, curve), independent of the set construction arm
    - name: label_universe
      treatment: fixed
      value: x with f(x) a nonzero square
      how: every arm draws its labels from the label universe of the same curve
    - name: counting_convention
      treatment: fixed
      value: unordered pairs of distinct labels, C = sum of binom(m_s, 2)
      how: one kernel and one definition for every arm
    - name: box_shape_and_fill_order
      treatment: fixed
      value: half-box first nonzero coordinate positive, lexicographic, T least with half-box >= ceil(1.02 n) + 8
      how: one builder in run.py for every rank-r arm
    - name: sign_handling
      treatment: fixed
      how: one label per +-c pair; repeated labels skipped and counted per job
    - name: null_replicates
      treatment: fixed
      value: 20
      how: the same count for every toy cell
    - name: null_replicate_index
      treatment: randomized
      how: each null replicate has its own seeded stream; replicate 0 is the pseudo-structured set of the calibration
    - name: curve_parity
      treatment: randomized
      how: even and odd curve indices of one block are two disjoint halves of the same randomized draw
    - name: label_scale
      treatment: fixed
      value: u = 1 in every census job
      how: the selftest alone draws a random unit u and compares C and D of X and u^2 X
    - name: kernel_build
      treatment: fixed
      how: one labelsum.c compiled by gcc with flags recorded in the manifest; sha256-bound by the trial plan
    - name: plant_size_rule
      treatment: fixed
      value: m least with internal >= 0.30 x curve null mean
      how: computed per curve by the frozen rule and recorded per job
    - name: sizing_rule
      treatment: fixed
      how: closed-form n_curves from the table rule; recorded in design.json
    - name: worker_count
      treatment: measured
      how: 4 workers; affects wall time only, never a primary metric (jobs are pure functions of their key)
    - name: host_load
      treatment: measured
      how: recorded per job as seconds; wall time only
    comparisons:
    - id: C-struct-null
      arms: [rank_r_log_gap, uniform_null]
      differs_in: [set_construction]
      design: one_factor
    - id: C-plant-null
      arms: [planted_label_ap, uniform_null]
      differs_in: [set_construction]
      design: one_factor
    - id: C-aa-null
      arms: [null_replicate_0, null_replicates_1_to_19]
      differs_in: [null_replicate_index]
      design: aa
    - id: C-aa-curves
      arms: [even_curve_index, odd_curve_index]
      differs_in: [curve_parity]
      design: aa
    - id: C-aa-scale
      arms: [labels, u2_times_labels]
      differs_in: [label_scale]
      design: aa
    crosses_map: false
    crosses_map_note: >-
      The x-coordinate projection E -> P^1 is the object whose sets are counted (the R1 label), not a map along which a
      claim about another object is transported: the hypothesis, the null and the plant are all defined on x-labels of
      the same curve and nothing is asserted for y-labels or any other labeling. There is no scale step beyond the
      tested toy range (resolution R10). The twist isomorphism x -> u^2 x is run as the exact identity A/A comparison
      C-aa-scale in the selftest.
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261017-078074.yaml
    written_at: '2026-10-17'
    data_seen: []
    sample_status: out_of_sample
