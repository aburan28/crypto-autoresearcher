experiment:
  id: EXP-SIDECH-a7400e
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-1c2177; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-1c2177
  question_id: RQ-INSTR-f8faa0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Hand-adjudicate a matched sample of assumption-invoking and assumption-free ledger records
    against a frozen five-slot rubric to measure slot-instantiation rate, detector precision and recall,
    and the null arm's spurious-fill rate.
  objective: 'The one uncertainty a run reduces: whether ''leakage and fault assumptions in this portfolio
    are not stated as measurable predicates'' is a measurable statement at all, and if so what its
    value is. Concretely: (i) can a written rubric decompose the assumptions actually present in this
    corpus into the five slots, or does a substantial class of them require a slot the rubric does
    not have -- which would falsify the normal form before any rate is worth computing; (ii) does
    the rubric discriminate, meaning does it fill on assumption-invoking records and stay empty on
    a matched sample of records that invoke no such assumption, since a rubric that fills from generic
    research vocabulary measures nothing; (iii) what are the precision and recall of the cheap keyword
    pre-filter that would have to define the denominator of any corpus-wide rate, measured by adjudicating
    pre-filter misses as well as hits. Only after all three are answered does a corpus-wide number
    mean anything, and this run deliberately stops before computing one at full scale.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: ''at commit <sha>, in a sample of
      40 pre-filter hits and 40 pre-filter misses adjudicated against rubric version <hash>, the full
      five-slot instantiation rate among adjudicated assumption-invoking records was r with Wilson
      interval [a,b], the null sample''s spurious full-tuple rate was s, and the pre-filter''s precision
      and recall were p and q.'' What does NOT follow: that any named record is deficient, incorrect,
      or overclaiming; that the portfolio''s leakage assumptions are unrealistic or unachievable;
      that a record scoring zero slots is worse than one scoring five; that this rate would hold at
      a different commit or under a different rubric; and anything whatsoever about what the published
      literature requires or contains. The rate is about the shape of writing, not about the truth
      of any claim.'
  inputs:
    procedure: 'STAGE 0 (cost: ~2 hours, no compute): write the five-slot rubric with closed vocabularies
      for GRANULARITY and OBTAINABILITY and explicit null-permitted semantics for ERROR RATE and MULTIPLICITY;
      hash and record it. STAGE 1 (cost: ~30 minutes, negligible compute): freeze the keyword pre-filter
      list, hash it, and run it over ledger/ at a pinned commit sha; record the hit count. STAGE 2
      (cost: minutes): draw 40 hits and 40 misses uniformly at random from recorded seeds; draw the
      matched no-assumption null sample stratified on record type, area code and character length.
      STAGE 3 (cost: ~4 hours human): adjudicate all sampled records against the rubric, recording
      per-slot fill decisions and a free-text note for any assumption that resists the five slots.
      STAGE 4 (cost: minutes): compute the instantiation rate, per-slot rates, null spurious-fill
      rates, and pre-filter precision and recall, all with Wilson intervals. STAGE 5 (cost: ~2 hours
      human): a second adjudicator re-adjudicates 20 of the 80 blind, giving an agreement rate. STAGE
      6 (cost: minutes): emit the run record with the rubric hash, the pre-filter hash, the commit
      sha, all seeds, and the count of assumptions that required a sixth slot.'
    instrument: 'Python 3 with PyYAML for reading ledger records, the repository''s own record-reading
      helpers in src/crypto_autoresearcher/records.py, and numpy or plain arithmetic for Wilson intervals.
      Sampling seeds recorded through harness/runner.py or src/crypto_autoresearcher/runner.py so
      the run emits an immutable run record. Existing checkers tools/claim_class_audit.py and tools/check_runtime_bindings.py
      are read as templates for how a corpus-level checker is structured and reported here. No Sage.
      No repository record is modified: records are immutable and the run writes only its own artifacts.'
    parameters: 'One pinned commit sha. Pre-filter keyword list: frozen, hashed, approximately 20
      terms covering leakage, fault, side channel, constant-time, timing, cache, power, electromagnetic,
      glitch, and their variants. Sample: 40 pre-filter hits, 40 pre-filter misses, 40 matched no-assumption
      null records, drawn from three recorded seeds. Adjudication: 5 slots per record, ternary per
      slot (filled / null / not-applicable). Blind re-adjudication: 20 records by a second adjudicator.
      Wilson intervals at 95 percent. Rubric version: one, hashed. Stratification variables for the
      null match: record type in {question, hypothesis, proposal, evidence, decision}, area code,
      character length quartile.'
  controls:
  - Matched no-assumption record sample, extracted by the identical code with the identical frozen
    vocabulary.
  - 'Blind adjudication: rubric fixed and recorded before any record is opened; record ids withheld
    from the adjudicator where feasible.'
  - 'Pre-filter recall control: adjudication of a random sample of pre-filter MISSES, not only of
    hits.'
  - 'Vocabulary-freeze control: the keyword list is hashed and recorded before the sample is drawn.'
  - 'Commit-pinning control: the measured rate is computed at one recorded commit sha and recomputed
    at a second later sha to check stability.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Run the IDENTICAL detector and the IDENTICAL slot extractor over a
    matched sample of records that invoke NO leakage or fault assumption -- for example records in
    the algebraic and lattice lanes selected to match the assumption-invoking sample on record type,
    area code and length. The null must show a near-zero rate of spurious slot instantiation: if the
    extractor finds an OBSERVABLE and a GRANULARITY in a record about Groebner basis degrees, the
    extractor is pattern-matching on generic vocabulary and its rate on the signal sample is meaningless.
    Pre-registered requirement: spurious full-tuple instantiation on the null sample below 0.02, and
    spurious single-slot instantiation below 0.10, both with Wilson intervals. Both arms are extracted
    in the same invocation of the same code with the same frozen vocabulary.'
  independent_variables:
  - record class (assumption-invoking vs matched null)
  - slot identity
  - record type
  - record date stratum
  metrics:
    primary:
    - full five-slot instantiation rate with Wilson interval
    - per-slot instantiation rate
    - null-sample spurious full-tuple fill rate
    - pre-filter precision and recall
    secondary:
    - inter-adjudicator agreement on the 20 blind records
    - count of assumptions requiring a sixth slot
    - instantiation rate stratified by record date
    - median record length by class
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The joint five-slot instantiation rate among adjudicated assumption-invoking records,
      and the ranked frequency of missing slots.
    formula: 'Predicted ordering of missing-slot frequency, from most often missing to least: ERROR
      RATE, MULTIPLICITY, GRANULARITY, OBTAINABILITY, OBSERVABLE. The reasoning behind the order is
      that a slot is left null in proportion to how much downstream recomputation filling it would
      force: an error rate forces a cost model to be redone, a multiplicity forces a per-invocation
      budget, a granularity is often implied by the scheme, an obtainability is a one-word category,
      and an observable must be named for the sentence to parse at all. This is a falsifiable prediction
      over an ordering of five categories; the run reports Spearman correlation between predicted
      and observed rank with its p-value, and a negative or near-zero correlation falsifies the reasoning
      while leaving the rate itself intact and still reportable.'
    source: Pre-registered in the parent proposal IDEA-20260816-1c2177 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested on 120 sampled records at one commit of one corpus. The rate is a property
      of this repository at this sha and is not extrapolated to any other corpus, to future records,
      or to any external body of work. The one extrapolation attempted is from the 40-record adjudicated
      sample to the full assumption-invoking population at the same commit, which is a standard finite-population
      inference and is reported with its Wilson interval and with the pre-filter's measured recall
      propagated into the denominator rather than assumed to be one.
    correspondence: null
  tail_checks:
  - Inspect every record that filled all five slots individually, since a small numerator makes the
    rate tail-dominated.
  - Inspect every null-sample record that filled any slot, to determine whether the fill was a genuine
    assumption the pre-filter missed or a rubric artifact.
  - Check the oldest and newest date strata separately, since corpus age is a confounder.
  - Inspect any assumption the adjudicator flagged as needing a sixth slot.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and redesign the rubric without reporting a rate if more than 5 of the 40 adjudicated hits
    require a sixth slot.
  - Stop at 80 adjudicated records; do not extend the sample to narrow an interval.
  - Halt if inter-adjudicator agreement on the blind 20 falls below 0.75 and report the agreement
    figure only.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The rubric accommodates at least 35 of the 40 adjudicated assumption-invoking
    records without a sixth slot, the null sample's spurious full-tuple fill rate is at or below 0.02,
    and inter-adjudicator agreement is at or above 0.75 -- together licensing a reported instantiation
    rate with its interval.
  falsification_criterion:
  - More than 5 of 40 adjudicated records require a sixth slot.
  - Null-sample spurious full-tuple fill rate above 0.02.
  - Inter-adjudicator agreement below 0.75.
  - Pre-filter recall measured on adjudicated misses below 0.6.
  - The instantiation rate differs by more than its interval width between the two oldest and two
    newest date strata with no other explanation, indicating the measurement tracks corpus age rather
    than assumption discipline.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-1c2177
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The closed vocabulary for GRANULARITY has not been enumerated and a Coordinator must fix it before
    the rubric is hashed.
  - Whether OBTAINABILITY belongs in the same tuple as the four observation slots, or is a separate
    axis, is unresolved and affects what 'all five slots' means.
  - The matched-null stratification variables are proposed but no check has been done that a matched
    sample of adequate size exists.
  - No plan is specified for what happens to the checker if the rate is very high, which would make
    the checker redundant on arrival.
