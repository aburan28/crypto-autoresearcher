    - id: A-2
      severity: MEDIUM
      title: >-
        The committed attribution check cannot distinguish the attributed paper
        from an unrelated one, in either direction.
      classification: implementation_error (pre-existing, in committed code)
      detail: >-
        `attribution_from_contract` harvests capitalised tokens from the contract's
        identity block and yields ['Bernstein-De', 'Content-Type', 'Faster',
        'Feo-Leroux-Smith', 'The', 'Velu']. Three defects follow, all observed in
        this run: (i) the hyphen-splitting produces 'Bernstein-De' and
        'Feo-Leroux-Smith', which are absent from EVERY artifact including the
        correct paper, so a genuine hit is indistinguishable from a miss;
        (ii) 'Content-Type' is a stray token harvested from the contract's prose;
        (iii) 'Velu' is absent from the arXiv full text because the PDF encodes it
        as V + e + COMBINING ACUTE ACCENT + l + u -- verified by name at char
        offset ~700 of the arXiv text. The net result is that the WRONG article and
        the RIGHT article produced IDENTICAL attribution-check output
        (found: ['Faster'], absent: the rest).
      not_repaired_here: >-
        The check is in harness/velu_stage0.py, which committed runs are pinned to
        and which this task forbids editing. Reported, not changed.
