      observation: >-
        The frozen list and the committed classifier's `_FIELD_TOKEN_RE` both expect
        LaTeX-source or ASCII-subscript spellings (F_q, F_{q}, \mathbb{F},
        \mathbf{F}, GF(...)). The extracted text of the published PDF spells the
