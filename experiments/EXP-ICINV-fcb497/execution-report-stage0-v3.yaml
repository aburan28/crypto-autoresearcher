        anywhere in the arXiv full text, every operation-count passage in it was
        labelled `field_unspecified`, and the frozen "without disambiguating the
        field" clause fired.
      scope_of_this_statement: >-
        THIS IS A STATEMENT ABOUT THE INSTRUMENT, NOT ABOUT THE PAPER. It does not
        assert that the paper does or does not disambiguate the field; that
