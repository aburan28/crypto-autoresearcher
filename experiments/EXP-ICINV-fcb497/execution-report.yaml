        Completion gate G9 is therefore PARTIAL, not PASS.
    - id: D5
      kind: infrastructure
      detail: >-
        Both PDF URLs -- https://eprint.iacr.org/2020/341.pdf and
        https://eprint.iacr.org/2020/1109.pdf -- return HTTP 403 behind a
        Cloudflare interstitial. The response bodies are pinned by sha256 as
        evidence of the failure. THIS IS AN INFRASTRUCTURE OUTCOME AND IS NEVER
        READ AS BASE_FIELD (AGENTS.md rule 5, and the contract's STAGE-0 branch
        rules).
    - id: D6
      kind: declared_substitution
      detail: >-
        The m = 1 fixture skipped 12 stream curves at p_12 with recorded
        shortfall reasons before three qualifying curves were found. This is the
        contract-prescribed substitution path, and every skip is recorded.
    - id: D9
      kind: write_scope
      detail: >-
        experiments/EXP-ICINV-fcb497/implementation.md lies outside
        TASK-20260807-f9c69c's declared write_scope (runs/** and amendments/**).
        It was written on the dispatching message's explicit instruction, which
        the /run-experiment skill also requires. FLAGGED rather than silently
        taken as authorised.
    - id: D10
      kind: deliverable_not_produced
      detail: >-
        Required artifact D8 was not written at its contract path. See
        location_note above. No BATCH id was minted.
    - id: D11
      kind: weak_instrument_no_verdict_impact
      detail: >-
        The in-run attribution check tokenised the contract prose into hyphenated
        compounds and under-reported matches. A read-only recheck against the
        SAME pinned text file (sha256 15a4c1c9... confirmed identical) finds
        Bernstein, Leroux, Smith and Faster present; "Velu" is absent only
        because the artifact renders it accented. Nothing was written or altered,
        and no verdict depends on this check.

