            ratio.
      (S-j) The frozen decision rule terminates in exactly one measurement outcome
            and exactly one audit outcome, emitted by the run itself, with all six
            tail checks reported.
    NEGATIVES THIS CRITERION EXPLICITLY ADMITS. Success is NOT a particular result.
    S0_BASE_FIELD -- which REFUTES the cost corollary, makes the knife edge real and
    forces IDEA-20260807-9fb27c to be superseded -- FULLY SATISFIES THIS CRITERION.
    So does OUTCOME_FAMILY_small_m, which falsifies HEUR-ORD-1. So does
    OUTCOME_STALE_BARRIER, which falsifies AUDIT-Z and corrects the campaign against
    its own prediction. THE CRITERION FAILS on INVALID, on an unpinned run source, on
    an unverifiable quotation, on a failed planted control, on a failed m = 1
    fixture, on fewer than 5 verdict-yielding decades, and on a missing cost or
    barrier table. A contract in which no result counts as a failure would be
    rejected by this Coordinator, and this one is not such a contract.

