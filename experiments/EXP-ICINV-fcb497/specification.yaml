experiment:
  id: EXP-ICINV-fcb497
  hypothesis_id: H-ICINV-82ee6a
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  parent_idea_id: IDEA-20260807-9fb27c
  version: 1
  status: approved
  retrospective: false
  retrospective_note: >-
    THIS IS A PRE-REGISTRATION. Nothing in this file was written after seeing a
    result. No run of EXP-ICINV-fcb497 exists at the time of writing and
    experiments/EXP-ICINV-fcb497/runs/ is empty. Every threshold, branch, sample
    size and decision rule below is FROZEN before execution and may be changed only
    by a versioned protocol_amendment under
    experiments/EXP-ICINV-fcb497/amendments/, never by an edit of this file
    (AGENTS.md rule 4). The standard followed is that of
    experiments/EXP-ICINV-4d33aa/specification.yaml.

  title: >-
    STAGE 0 FIRST: over WHICH FIELD is the square-root Velu Otilde(sqrt d)
    operation count stated? A hash-pinned literature gate with a pre-registered
    inverting branch, followed by a toy-scale measurement of
    m = ord_d(lambda) -- the extension degree of the field of definition of a
    generator of the kernel of the minimal non-scalar endomorphism of an ordinary
    E/F_p -- against a matched random-unit null and a blocking planted control, and
    a frozen audit table of every isogeny-evaluation cost recorded in this ledger.

  objective: >-
    Reduce one specific uncertainty that is currently load-bearing for several cost
    arguments in this campaign and has never been checked: whether the Otilde(sqrt
    d) square-root Velu figure, if applied to the minimal non-scalar endomorphism
    of an ordinary E/F_p (degree d = |D|/4 = Theta(p)), would produce an
    Otilde(sqrt p) evaluation that TIES the 0.886 sqrt(N) rho baseline.
    H-ICINV-82ee6a says no, for two independent reasons: a COST reason (the count
    is over the kernel-generator field F_{p^m}, m = ord_d(lambda) ~ d, so the true
    figure is Otilde(p^{3/2}) -- worse than the Otilde(p) already charged) and an
    INFORMATION reason (H-ENDO-001: the endomorphism acts on the prime-order
    subgroup as a scalar computable in O(1)).

    THE COST REASON RESTS ENTIRELY ON AN UNVERIFIED EXTERNAL READING, AND THAT
    READING IS STAGE 0. If the operation count turns out to be stated over the BASE
    field, the hypothesis's cost corollary is refuted, the knife edge is real, and
    IDEA-20260807-9fb27c must be superseded. THAT OUTCOME IS A FIRST-CLASS
    PRE-REGISTERED BRANCH OF THIS EXPERIMENT WITH ITS OWN DECISION RULE AND ITS OWN
    DELIVERABLES -- IT IS A SUCCESS OF THE EXPERIMENT, NOT AN ABORT. The
    experiment is designed so that the record that motivated it can lose, and a
    design in which that cannot happen would be rejected by this Coordinator.

  experiment_class:
    primary: cost_model_measurement
    secondary: distribution_measurement_with_matched_null
    class_obligations_binding_on_this_contract:
      - >-
        MEASURED-VS-MODELED SEPARATION IS ABSOLUTE. Every number this experiment
        emits carries a `basis` field with exactly one of
        {measured, modeled, quoted_from_record, quoted_from_pinned_source}. NO
        TABLE, ROW OR COLUMN MAY MIX BASES. A table whose rows rest on a model is
        titled "bound" or "model", never "prediction" and never "measurement".
      - >-
        EVERY OPTIMISTIC ASSUMPTION IS DISCLOSED WITH THE DIRECTION OF ITS BIAS in
        the optimistic_assumptions block below, and a cost figure resting on one
        is labelled a BOUND.
      - >-
        PEAK MEMORY IS A FIRST-CLASS METRIC. It is sized analytically BEFORE the
        run and reconciled against measured peak_rss_bytes afterwards; a
        discrepancy beyond the declared factor is reported, not absorbed.
      - >-
        HIDDEN OVERHEAD BURIED IN ANY Otilde OR o(1) IS ENUMERATED, with the two
        known items named in this contract (remainder-tree polylog cofactor;
        subexponential cost of factoring d).
      - >-
        EVERY CONCRETE-COST FIGURE IS QUOTED AT A NAMED PARAMETER SET from
        parameter_sets below. A cost number without a named set is a defect.
      - >-
        DISTRIBUTIONAL CLAIMS CARRY A DERIVED SAMPLE SIZE tied to the smallest
        effect the design must resolve, a pre-registered comparison metric, a
        matched null, and a blocking planted control.

  inputs:
    implementation:
      new_modules:
        - >-
          harness/velu_stage0.py -- STAGE-0 retrieval, artifact hashing, text
          extraction, and BYTE-VERIFIED quotation. Contains no domain arithmetic.
        - >-
          harness/exp_kerfield.py -- curve sampling, order certification, norm-form
          minimisation over Z[pi], lambda, exact factorisation of d, ord_d(lambda),
          the matched random-unit null, the planted control, the m = 1 fixture, and
          the cost accounting.
        - harness/run_kerfield.py -- the run driver, invoked through harness/runner.py.
      reused_unmodified:
        - harness/toycurve.py
        - harness/runner.py
      edit_prohibition: >-
        harness/exp_icinv.py, harness/exp_icinv_fullgroup.py,
        harness/run_fullgroup.py, harness/run_saturation.py and
        harness/isogeny_class.py MUST NOT BE EDITED OR IMPORTED BY THIS EXPERIMENT.
        They belong to EXP-ICINV-4d33aa / EXP-ICINV-55c2d8 and their committed runs
        must stay reproducible against them byte-for-byte. This prohibition is also
        why HEUR-M2-2's validation is a READ-ONLY static audit rather than the
        runtime instrumentation IDEA-20260807-9fb27c proposed; that substitution is
        declared in H-ICINV-82ee6a and is a WEAKENING, recorded as one.
      reference_value_rule_binding: >-
        PER CORR-20260807-a24675, REQUIRED ACTION 2, WHICH IS A STANDING CAMPAIGN
        OBLIGATION. A reference value quoted from a committed record or from a
        retrieved source is READ FROM THAT ARTIFACT AT RUN TIME and bound by
        sha256 recorded in the run manifest. TRANSCRIBING SUCH A VALUE INTO SOURCE,
        AT ANY PRECISION, IS PROHIBITED and makes the run INVALID. This applies with
        full force to STAGE 0: no quoted passage, operation count, theorem number or
        page reference may be typed from memory into code, a report or this
        contract's outputs. It must be extracted programmatically from the pinned
        artifact and verified as an exact byte-substring of it.

    stage0_retrieval_frozen:
      why_this_is_executable_here: >-
        MEASURED FACTS ABOUT THIS ENVIRONMENT, ENCODED RATHER THAN ASSUMED.
        WebSearch and WebFetch both fail with a backend model-access error
        (us.anthropic.claude-haiku-4-5-20251001-v1:0) -- this is why
        IDEA-20260807-9fb27c carries novelty_status: unverified and an unverified
        Bernstein-De Feo-Leroux-Smith attribution. `curl -sS
        https://eprint.iacr.org/2020/341` returns HTTP 200: network egress works
        from Bash. STAGE 0 is therefore executable by curl plus local text
        extraction, and this contract specifies exactly that path.
      primary_source:
        identity: >-
          The square-root Velu source, attributed to Bernstein-De Feo-Leroux-Smith,
          "Faster computation of isogenies of large prime degree", ANTS XIV 2020.
          THE ATTRIBUTION ITSELF IS PART OF WHAT STAGE 0 VERIFIES: the retrieved
          artifact's own title and author list are extracted and compared to the
          attribution, and a mismatch is reported as an attribution defect rather
          than silently accepted.
        urls_in_order:
          - https://eprint.iacr.org/2020/341
          - https://eprint.iacr.org/2020/341.pdf
        retrieval_command_shape: >-
          curl -sS -L --max-time 120 -o <artifact> <url>, with the HTTP status,
          final URL after redirects, Content-Type, byte length and retrieval
          timestamp all recorded. A non-200 status is an INFRASTRUCTURE outcome.
      fallback_source:
        identity: >-
          KN-LIT-780 (Adj, Chi-Dominguez, "Karatsuba-based square-root Velu's
          formulas applied to two isogeny-based protocols", eprint 2020/1109).
        paths_in_order:
          - knowledge/literature/KN-LIT-780.md
          - https://eprint.iacr.org/2020/1109
          - https://eprint.iacr.org/2020/1109.pdf
        fallback_is_weaker_and_this_contract_says_how_much: >-
          SHARPENED AGAINST THE DISPATCHING HANDOFF, DELIBERATELY. The handoff names
          KN-LIT-780 as the fallback on the strength of its
          `citation_verified: read` front-matter. THAT FRONT-MATTER OVERSTATES THE
          ENTRY. The body of KN-LIT-780 says, verbatim in its "Not verified here"
          section, that it was generated in a bulk seeding pass from the local PDF's
          first two pages, that fields were parsed heuristically, and that claims
          are relayed from the abstract WITHOUT INDEPENDENT VERIFICATION. Its
          "Local copies" section points at `downloads/2020-1109.pdf`, and THAT FILE
          IS ABSENT FROM THIS WORKTREE (verified by glob at contract-drafting time).
          Worse for STAGE 0's specific question: the text it does carry reports
          "Otilde(sqrt ell) FIELD OPERATIONS" without saying WHICH FIELD -- the exact
          ambiguity STAGE 0 exists to resolve. CONSEQUENCE, FROZEN: the corpus note
          alone can NEVER return a KERNEL_FIELD or BASE_FIELD verdict. It may return
          only AMBIGUOUS. A determinate verdict requires a retrieved full text of
          2020/341 or 2020/1109 with a byte-verified passage.
      artifact_pinning_frozen: >-
        Every retrieved byte stream is written under
        experiments/EXP-ICINV-fcb497/runs/<RUN-ID>/sources/ with its sha256 recorded
        in the run manifest, together with the URL, the HTTP status, the final URL,
        the Content-Type, the byte length and the retrieval timestamp. Extracted
        plain text is written beside it as a separate file with its own sha256. The
        pinned artifacts are immutable run artifacts and are never edited.
      extraction_target_frozen: >-
        THE EXECUTOR MUST EXTRACT, AS AN EXACT BYTE-SUBSTRING OF THE PINNED TEXT
        FILE, the passage stating the algorithm's operation count together with the
        field that count is over. Concretely, locate every occurrence of an
        operation-count statement (search terms frozen here:
        "operations", "field operations", "multiplications", "\\tilde{O}", "Otilde",
        "O~", "sqrt", "\\sqrt", "baby-step", "giant-step", "kernel", "field of
        definition", "F_q", "F_{q}", "\\mathbf{F}", "\\mathbb{F}") and record, for
        each, the matched text with at least 400 characters of surrounding context
        and its byte offsets in the pinned file. THE VERDICT IS READ FROM THOSE
        PASSAGES, NOT FROM THE EXECUTOR'S KNOWLEDGE OF THE PAPER.
      quote_verification_rule_blocking: >-
        Every quoted passage emitted by STAGE 0 is programmatically re-checked as an
        exact byte-substring of the pinned text file, and its start and end offsets
        are recorded. A quote that fails this check makes the run INVALID. THE
        EXECUTOR IS PROHIBITED FROM RECONSTRUCTING ANY QUOTATION FROM MEMORY. This
        is the direct application of CORR-20260807-a24675 to a literature artifact.
      background_knowledge_prohibition: >-
        The STAGE-0 verdict may cite ONLY the pinned artifacts. An assertion about
        what the paper says that is not supported by a byte-verified quotation is a
        rule-9 fabrication risk and makes the run INVALID. If the executor believes
        it knows the answer and cannot retrieve it, the verdict is
        UNRETRIEVED_INFRA, not the remembered answer.

    curve_sampling_frozen:
      prime_ladder_rule: >-
        The seven primes p_k = the LARGEST PRIME STRICTLY BELOW 2^k for
        k in {12, 14, 16, 18, 20, 22, 24}. THE RULE IS FROZEN, NOT A LITERAL LIST:
        the drafting Coordinator has no shell in this session and will not write
        seven prime literals it cannot verify (AGENTS.md rule 9). The executor
        computes them with a deterministic primality test, records the seven values
        and the test used in the run record, and those recorded values are
        thereafter the frozen ladder.
      curve_stream: >-
        For each p, draw (a, b) from the deterministic stream
        a = int(sha256(f"{seed}:{p}:a:{i}"), 16) mod p,
        b = int(sha256(f"{seed}:{p}:b:{i}"), 16) mod p, i = 0, 1, 2, ...
        Reject singular (4a^3 + 27b^2 = 0 mod p). Reject supersingular (t = 0).
        Accept until curves_per_decade_target ordinary instances are ACCEPTED, or
        until the attempt cap is reached. The modular reduction of a 256-bit hash by
        a modulus below 2^24 is non-uniform by under 2^-230; this is DECLARED, not
        hidden, and is orders below every threshold in this contract.
      curves_per_decade_floor: 400
      curves_per_decade_target: 1000
      attempt_cap_per_decade: 4000
      order_certificate_required_per_curve: >-
        #E is determined by baby-step/giant-step within the Hasse interval
        [p + 1 - 2 sqrt p, p + 1 + 2 sqrt p] on sampled points, and the run records,
        per curve: the annihilating multiple found, a verification that
        [#E]Q = O for at least 3 independently sampled points Q, and a
        UNIQUENESS FLAG asserting that exactly one multiple in the Hasse interval
        annihilates all sampled points. A curve whose #E is NOT uniquely determined
        is EXCLUDED, counted, and reported -- never guessed. t = p + 1 - #E.
      no_isogeny_class_enumeration: >-
        This experiment enumerates NO isogeny class and computes NO factor base. It
        shares no curve-selection rule, no prime, no sampler and no statistic with
        EXP-ICINV-4d33aa or EXP-ICINV-55c2d8.

    endomorphism_arithmetic_frozen:
      ring_scope: >-
        alpha ranges over Z[pi] with norm form N(u + v pi) = u^2 + u v t + v^2 p.
        THE FULL ENDOMORPHISM RING O IS OUT OF PRIMARY SCOPE when the conductor
        f = [O : Z[pi]] exceeds 1; see H-ICINV-82ee6a's DECLARED SCOPE NARROWING.
        Where f <= conductor_secondary_bound the O-minimal non-scalar degree is
        computed and reported as a DECLARED SECONDARY, so the size of the narrowing
        is measured rather than assumed small.
      minimisation_rule: >-
        Compute the k = 5 SMALLEST values of N(u + v pi) over v != 0, not only the
        single minimiser, with their (u, v). This is the frozen response to the
        confounder "minimality is not uniqueness": several alpha can attain or
        nearly attain the minimum with very different lambda and m, and a single
        reported m would be an artefact of tie-breaking. The PRIMARY statistic uses
        the smallest-degree admissible alpha; the window of five is reported in
        full and its within-window spread of log m / log d is a required secondary.
      primitivity_and_gcd_filter: >-
        alpha is admissible iff it is primitive (gcd(u, v) = 1 suffices for
        u + v pi in Z[pi]) AND gcd(v, d) = 1. Inadmissible instances are the
        DEGENERATE CASE: counted, reported with their reason, excluded from the
        primary statistic. Their fraction is a primary metric with an invalidation
        threshold.
      lambda_rule: "lambda = (-u) * inverse(v) mod d, defined because gcd(v, d) = 1."
      factorisation_rule: >-
        d is factored EXACTLY by trial division to floor(sqrt(d)) (d < 2^26 on this
        ladder, so this is trivially affordable), with the complete factorisation
        recorded per instance and a VERIFICATION that the product of the recorded
        prime powers equals d. A partial or unverified factorisation makes that
        instance INVALID rather than yielding an approximate m -- this is the exact
        silent-truncation failure the decay check is designed to catch.
      order_rule: >-
        m = ord_d(lambda) is computed from the exact factorisation of
        Carmichael's lambda-function of d by successively dividing out prime
        factors, and is VERIFIED by checking lambda^m = 1 mod d AND
        lambda^(m/q) != 1 mod d for every prime q | m. Both checks are recorded.
        A failed verification makes that instance INVALID.
      conductor_stratification: >-
        f = the conductor of Z[pi] in the maximal order, i.e. the largest integer
        with (t^2 - 4p)/f^2 = 0 or 1 mod 4 and a fundamental discriminant. All
        primary statistics are reported BOTH pooled and stratified by f in the bins
        {f = 1, 2 <= f <= 10, f > 10}, because curves at different volcano levels
        have different O, different norm forms and different minimal d, and pooling
        across levels is a named confounder.

    matched_null_frozen: >-
      NEGATIVE DIRECTION. For each measured instance with its exact d, draw a
      uniformly random a in (Z/d)^* from an independent seeded stream
      (a = int(sha256(f"{seed}:null:{p}:{i}"), 16) mod d, redrawn while
      gcd(a, d) > 1) and compute ord_d(a) by the identical code path.
      MATCHING ON d IS ESSENTIAL AND IS FROZEN: the order distribution depends
      heavily on the factorisation of d, so a null that resamples d as well would be
      measuring the wrong thing. One null draw per instance; the paired design is
      what makes the per-decade sample sizes below sufficient.

    planted_control_frozen: >-
      POSITIVE DIRECTION, BLOCKING. Construct d = r^2 - 1 and lambda = r for
      r in the frozen set {3, 5, 7, 11, 17, 33, 65, 129, 1025, 65537}, spanning
      d from 8 to about 2^32 so the control exercises the same factorisation and
      order code paths at and beyond the ladder's d range. ord_d(r) = 2 EXACTLY by
      construction (r^2 = 1 mod d and r != 1 mod d for r >= 3). THE MEASUREMENT CODE
      MUST REPORT m = 2 ON EVERY MEMBER. A pipeline that fails this returns no
      usable null; its run set is INVALID, not negative, and no null it reports may
      be cited.

    m1_baseline_fixture_frozen: >-
      NEARBY-OBJECT CONTROL, BLOCKING (docs/inventor-protocol.md method ceiling).
      The object where the desired conclusion MUST FAIL: the small-ell
      rational-eigenspace isogeny, where square-root Velu genuinely helps.
      SELECTION RULE, FROZEN: at p_12 (the smallest ladder prime), take the first
      THREE curves of the frozen curve stream, and for each the THREE SMALLEST
      primes ell in {3, 5, 7, 11, 13} such that X^2 - tX + p has a root in F_ell and
      the corresponding eigenspace of pi on E[ell] is F_p-rational. For each
      (curve, ell) the SAME code path that computes m in STAGE 3 must return
      m = 1 (or m = 2 in a twisted case, which must be declared as such by the
      eigenvalue computation and not by hand), and the corrected accounting
      Otilde(sqrt(d) * m) must degenerate to Otilde(sqrt ell). If fewer than three
      qualifying ell exist for a curve, the shortfall is recorded and the next
      curve of the stream is used; the substitution is declared.

    barrier_table_frozen:
      scope_of_the_grep: >-
        ledger/, knowledge/, analysis/ and docs/, READ-ONLY, for every stated
        isogeny- or endomorphism-evaluation cost. Frozen search terms:
        "Velu", "velu", "isogeny evaluation", "evaluate the isogeny",
        "degree-d isogeny", "degree d isogeny", "kernel polynomial",
        "Otilde(d)", "O(d)", "action step", "class group action", "CSIDH",
        "isogeny walk step".
      columns_frozen:
        - record_id
        - artifact_path
        - >-
            quoted_charged_cost  # basis: quoted_from_record, byte-verified substring
        - degree_regime
        - >-
            kernel_field_of_definition  # m, or "unknown" -- never guessed
        - >-
            sqrt_velu_applies  # yes / no / undetermined
        - >-
            corrected_cost  # basis: modeled
        - >-
            exponent_changed  # yes / no / undetermined
        - reason
      quotation_rule: >-
        The quoted_charged_cost cell is read from the cited artifact at run time and
        verified as an exact byte-substring of it, with the artifact's sha256 and the
        substring's byte offsets recorded. TRANSCRIPTION FROM MEMORY OR FROM THIS
        CONTRACT IS PROHIBITED (CORR-20260807-a24675).
      required_rows: >-
        The table MUST contain a row for IDEA-20260807-c36472's Otilde(p^{1/4})
        transport figure, recording exponent_changed = no with the reason that the
        figure counts ACTION EVALUATIONS and not field operations inside one
        evaluation, AND carrying c36472's own [open] mark forward UNDISCHARGED. It
        must also contain a row for the h ~ p^{1/2} identification cost that record
        names as the real T5 barrier.
      no_edit_authority: >-
        THE TABLE MAY NOT EDIT, CORRECT OR SUPERSEDE ANY OTHER RECORD. A row with
        exponent_changed = yes is ESCALATED to the Coordinator and becomes an input
        to a decision; the correction path is a new superseding record under a new
        id and only a Coordinator ledger archive may make it (AGENTS.md rule 4).

    parameter_sets:
      - name: PS-TOY-24
        description: the largest ladder decade, p just below 2^24
        security_parameter: "log2 p ~ 24"
        role: the only set at which anything here is MEASURED
      - name: PS-P256
        description: prime-field curve at NIST P-256 scale
        security_parameter: "log2 p ~ 256"
        role: MODELED ONLY. Cost rows at this set are BOUNDS from the accounting
          formula; nothing is measured here and no measurement is possible, because
          computing m requires factoring d ~ p ~ 2^256.
      - name: PS-P384
        description: prime-field curve at NIST P-384 scale
        security_parameter: "log2 p ~ 384"
        role: MODELED ONLY, as PS-P256.
      - name: PS-ELL-SMALL
        description: one class-group action step, prime norm ell = polylog(p)
        security_parameter: "ell in {3,5,7,11,13} at log2 p ~ 24"
        role: the m = 1 nearby-object control; MEASURED for m, MODELED for cost.

    optimistic_assumptions:
      - assumption: >-
          The Otilde in Otilde(sqrt d) is treated as a polylog cofactor when
          comparing to Otilde(d).
        direction_of_bias: >-
          UNDERSTATES the square-root method's true cost. It hides the
          resultant/remainder-tree machinery, a large constant in practice. Bias
          therefore favours the WORRY this experiment is testing, not the
          hypothesis -- the conservative direction.
      - assumption: >-
          m is treated as a multiplicative cost factor: Otilde(sqrt d) F_{p^m}-ops
          = Otilde(sqrt(d) * m) F_p-ops, i.e. one F_{p^m} operation costs Otilde(m)
          F_p operations.
        direction_of_bias: >-
          UNDERSTATES the corrected cost (schoolbook F_{p^m} multiplication is
          m^2, and even Karatsuba/FFT arithmetic carries constants). Bias favours
          the worry, again the conservative direction. Every corrected-cost figure
          is therefore a LOWER BOUND on the corrected cost and is labelled
          bound_kind: lower_bound.
      - assumption: >-
          d ~ p for the minimal non-scalar endomorphism (from T3, |D|/4 with
          t = O(sqrt p)).
        direction_of_bias: >-
          NEUTRAL-TO-OPTIMISTIC. For atypically large |t| the minimum drops below
          p/2. The measurement reports the observed distribution of d/p rather than
          assuming it, so this assumption is CHECKED and not merely declared.
      - assumption: >-
          The toy ladder's distribution of log m / log d is informative about
          larger p.
        direction_of_bias: >-
          UNKNOWN AND UNCONTROLLED, WHICH IS WHY NO EXTRAPOLATION IS PERMITTED. This
          is an assumption the experiment REFUSES to make: PS-P256 and PS-P384 rows
          are MODELED under H1 and are labelled conditional on it, never as
          validated.

    hidden_overhead_disclosure:
      - >-
        The polylogarithmic resultant/remainder-tree cost inside Otilde(sqrt d),
        which is a large constant at practical sizes and is NOT measured here
        because this experiment evaluates no square-root Velu implementation.
      - >-
        COMPUTING m AT ALL REQUIRES FACTORING d ~ p, which is subexponential and not
        polynomial. That cost is paid by this AUDIT and never by an attacker, but it
        is exactly what caps the ladder at 2^24 and why no crypto-scale statement is
        made. It is disclosed here rather than hidden in the "toy scale" label.
      - >-
        The Otilde(sqrt d) MEMORY of the baby-step/giant-step table, in
        kernel-generator-field elements, i.e. Otilde(sqrt(d) * m) F_p-elements. A
        square-root-time algorithm with square-root memory is never quoted here as
        if memory were free.

  controls:
    - >-
      PLANTED POSITIVE CONTROL, BLOCKING: d = r^2 - 1, lambda = r must report
      m = 2 exactly on every frozen r. Failure INVALIDATES the run set. It is run
      FIRST, before any measurement, and written to the run record before any
      distribution is read.
    - >-
      MATCHED NULL: ord_d(a) for a uniformly random unit a mod the SAME d, one draw
      per instance, identical code path. Written to the run record BEFORE the
      curve-derived distribution's KS verdict is read (null-first,
      docs/inventor-protocol.md "controls before belief").
    - >-
      NEARBY-OBJECT CONTROL, BLOCKING: the m = 1 small-ell rational-eigenspace
      fixture. The argument must NOT kill this object. m must come from the same
      code path as STAGE 3.
    - >-
      DECAY CHECK: log m / log d as a function of log d across the seven decades.
      The generic multiplicative-order heuristic predicts it rising toward 1. A FLAT
      or DECREASING profile is the canonical artifact tell and is read as an
      INSTRUMENT DEFECT -- most likely a silently truncated factorisation of d --
      to be diagnosed before any distributional reading.
    - >-
      FACTORISATION VERIFICATION CONTROL: product of recorded prime powers must
      equal d, and m must satisfy lambda^m = 1 with lambda^(m/q) != 1 for every
      prime q | m. Both checked per instance. This is the control that makes the
      decay tell diagnosable rather than merely observable.
    - >-
      ORDER CERTIFICATE CONTROL: #E uniquely determined in the Hasse interval and
      annihilating at least 3 independently sampled points, per curve. A curve
      failing it is excluded and counted, never guessed.
    - >-
      STANDING COST BASELINES, unchanged and unchallenged: Pollard rho with
      distinguished points at 0.886 sqrt(N) group operations and O(1) memory
      (KN-TECH-001, KN-TECH-006), BSGS at sqrt(N)/sqrt(N) (KN-TECH-031), and
      automorphism-discounted rho at 0.886 sqrt(N/|Aut|) (KN-TECH-018). EVERY
      corrected figure in the barrier table is compared against them, and the
      experiment's own sota_delta against them is ZERO.
    - >-
      RUN-SOURCE PROVENANCE CONTROL, BLOCKING (new, and the direct reason this
      contract exists in its present form): `code.source.all_pinned` must be TRUE in
      every run manifest, with a sha256 for every repo .py the run imported.
      See required_artifacts and invalidation_rules.

  independent_variables:
    - >-
        STAGE-0 source retrieved (primary 2020/341, fallback 2020/1109, corpus note) --
        determines the claim tier of the STAGE-0 verdict
    - prime decade p_k, k in {12, 14, 16, 18, 20, 22, 24} -- THE DECAY PARAMETER
    - instance index within a decade (the curve sample)
    - conductor stratum f in {1, [2,10], >10}
    - degree rank within the k = 5 smallest-degree window
    - >-
        object type (curve-derived lambda / matched random unit / planted control /
        m = 1 fixture)
    - seed (20260807, 20260814, 11235813)

  metrics:
    primary:
      - >-
        M0 stage0_field_verdict in {KERNEL_FIELD, BASE_FIELD, AMBIGUOUS,
        UNRETRIEVED_INFRA}, with the pinned artifact sha256, the source actually
        used, and the byte offsets of every supporting quotation.
        basis: quoted_from_pinned_source. THIS IS THE GATING METRIC.
      - >-
        M1 median of log m / log d PER DECADE, with per-decade n, and the
        decade-median sequence across the ladder. basis: measured.
      - >-
        M2 two-sample Kolmogorov-Smirnov distance per decade between
        log ord_d(lambda)/log d (curve-derived) and log ord_d(a)/log d (matched
        random unit on the SAME d), with the achieved n and the pre-registered
        critical value. basis: measured.
      - >-
        M3 planted_control_verdict in {PASS, FAIL} with the reported m for every
        frozen r. BLOCKING. basis: measured.
      - >-
        M4 barrier_table_exponent_changed_count -- the number of rows with
        exponent_changed = yes, and the number with undetermined.
        basis: mixed by column and each cell labelled; the count itself is measured
        over the table.
      - >-
        M5 degenerate_fraction per decade (alpha imprimitive or gcd(v, d) > 1), and
        excluded_curve_fraction per decade (order certificate failed, factorisation
        unverified, or order verification failed), reported separately.
        basis: measured.
      - >-
        M6 m1_fixture_verdict in {PASS, FAIL} with the reported m per (curve, ell)
        and the degeneration check of the cost formula. BLOCKING. basis: measured.
      - >-
        M7 peak memory: analytic_peak_bytes (basis: modeled, computed BEFORE the run
        from the declared data structures) and measured peak_rss_bytes (basis:
        measured), plus their ratio. A FIRST-CLASS METRIC, not a footnote.
      - >-
        M8 terminal_state in {INVALID, S0-INVERTED, S0-UNDETERMINED, S0-INFRA,
        OUTCOME-NULL, OUTCOME-FAMILY, OUTCOME-STALE-BARRIER} as computed by the
        frozen decision rule below and emitted BY THE RUN ITSELF.
    secondary:
      - >-
        per-instance record (p, a, b, #E, t, D, f, u, v, d, lambda, m, primitivity
        flag, gcd(v,d), the exact factorisation of d, the order verification flags)
      - empirical CDF of log m / log d per decade, and per conductor stratum
      - >-
        within-window spread of log m / log d over the k = 5 smallest degrees, per
        instance -- the frozen answer to "minimality is not uniqueness"
      - >-
        observed distribution of d/p per decade, which CHECKS the d ~ p assumption
        rather than assuming it
      - >-
        TAIL: the smallest observed log m / log d in each decade, together with the
        fraction of units of that same d whose order is at most the observed value
        (computable exactly from the factorisation) -- a small-order outlier far
        rarer than the null predicts is the interesting signal
      - >-
        the (d, m) collision multiset across all instances -- the observation-collision
        artifact required by H-ICINV-82ee6a's proof_search_map, which is EXPECTED to
        show collisions and thereby forbids any use of (d, m) as an identifying
        invariant
      - >-
        O-minimal non-scalar degree where f <= 100, as a DECLARED SECONDARY, with
        the ratio to the Z[pi]-minimum -- this measures the size of the declared
        scope narrowing
      - >-
        CONCRETE-COST TABLE at PS-TOY-24, PS-P256, PS-P384, PS-ELL-SMALL, every row
        labelled basis: modeled and bound_kind: lower_bound, with time AND memory
        columns, the hidden-overhead items named, and the standing ECDLP baselines
        beside them for scale
      - >-
        AFFECTED-VS-SAFE SCOPE STATEMENT: which constructions, if any, the corrected
        cost model pressures, and which are out of range with the reason. Predicted:
        NONE affected.
      - wall clock and point-operation counts per stage
      - >-
          `code.source.all_pinned`, the per-file sha256 map, and the count of imported
          repo .py files

  heuristic_under_test: HEUR-ORD-1
  heuristic_under_test_note: >-
    STAGES 2-3 validate HEUR-ORD-1 (genericity of ord_d(lambda)) at toy scale
    against a matched empirical null. HEUR-M2-2 (m divides 2 in this corpus's
    actual action-step regime) is validated by the STAGE-1 read-only static audit
    and the STAGE-2 m = 1 fixture; that validation is WEAKER than the runtime
    instrumentation IDEA-20260807-9fb27c proposed, and the substitution and its
    reason are declared in H-ICINV-82ee6a. The single-id schema field names the
    heuristic that the distributional design is powered for.

  preregistered_prediction:
    quantity: >-
      (i) The field over which the retrieved square-root Velu source states its
      Otilde(sqrt d) operation count. (ii) The per-decade distribution of
      log m / log d for m = ord_d(lambda) of the Z[pi]-minimal non-scalar
      endomorphism, against the matched random-unit null on the same d. (iii) The
      count of ledger cost rows whose exponent changes under the corrected model.
    formula: >-
      IDENTITIES (exact, used as implementation checks):
        d = N(u + v pi) = u^2 + u v t + v^2 p;  D = t^2 - 4p;
        min over v != 0 of N = |D|/4 up to rounding, at v = ±1, u = round(-t/2);
        lambda = -u v^{-1} mod d;  m = ord_d(lambda);  m | Carmichael-lambda(d);
        for composite alpha with coprime degrees, m = lcm(m_1, m_2) by CRT.
      COST ACCOUNTING (MODELED, LOWER BOUND, conditional on M0 = KERNEL_FIELD):
        cost(alpha) = Otilde(sqrt d) F_{p^m}-operations
                    = Otilde(sqrt(d) * m) F_p-operations;
        memory(alpha) = Otilde(sqrt d) F_{p^m}-elements
                      = Otilde(sqrt(d) * m) F_p-elements.
        At d ~ p and m ~ d ~ p (H1): Otilde(p^{3/2}) time AND memory.
        At d = ell, m = 1 (H2): Otilde(sqrt ell) -- the degeneration check.
      PRE-REGISTERED SAMPLE SIZE, DERIVED FROM THE SMALLEST EFFECT THE DESIGN MUST
      RESOLVE. The comparison metric is the two-sample KS statistic at level 0.05,
      whose critical value is 1.358 * sqrt((n+m)/(n*m)) = 1.358 * sqrt(2/N) for
      n = m = N. Requiring the design to RESOLVE a KS distance of D_min = 0.10 gives
      N >= 2 * (1.358 / 0.10)^2 = 368.9, hence N >= 369. THE FLOOR IS SET AT
      N = 400 PER DECADE and the target at N = 1000, which resolves D = 0.061. The
      median criterion is weaker and does not bind: the sample median's standard
      error is about 1.2533 * sigma / sqrt(N), so at an anticipated sigma ~ 0.15 and
      N = 400 the median is pinned to about 0.009 -- far finer than the 0.05
      tolerance used in the decision rule. EFFECTS SMALLER THAN D_min = 0.10 ARE
      DECLARED UNRESOLVABLE BY THIS DESIGN AND ARE NOT REPORTED AS NULL RESULTS.
    source: >-
      Derived in ledger/hypotheses/H-ICINV-82ee6a.yaml (mechanism STEPS 2-3 and
      claim T) from elementary ordinary-CM arithmetic. NO EXTERNAL CITATION IS
      ASSERTED FOR ANY FORMULA ABOVE. The Otilde(sqrt d) figure and its attribution
      to Bernstein-De Feo-Leroux-Smith carry [unverified -- not read in this
      campaign] and are precisely what STAGE 0 resolves; until it does, the cost
      accounting rows above are conditional and are labelled so. The
      Erdos-Murty / Kurlberg-Pomerance distribution attributions are likewise
      [unverified] and NO DECISION THRESHOLD DEPENDS ON THEM -- the comparison
      distribution is the matched empirical null.

  scale_relevance:
    tier: toy
    justification: >-
      p < 2^24 on all seven decades. The binding cost is EXACT FACTORISATION of
      d ~ p, which is what makes m exact and what makes crypto scale impossible:
      factoring d ~ 2^256 is out of reach, so the crypto-scale statement is NOT
      TESTED AND NOT CLAIMED. Nothing here is an algorithm at any scale -- the
      experiment evaluates no isogeny, implements no square-root Velu, and mounts no
      attack. Every resulting evidence record is capped at claim_tier: toy per
      GOAL-ENDO-001 and RQ-ICINV-475b5e. sota_delta is ZERO: 0.886 sqrt(N) before
      and after (KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031), and the
      record's own headline movement is an UPWARD cost correction on an object that
      mechanism STEP 4 shows is useless for the ECDLP anyway.
    correspondence: null
    correspondence_note: >-
      No sampling correspondence is used and none is available. Curves are sampled
      directly at each ladder prime and every quantity is computed exactly on the
      sampled instance. There is therefore no isometry claim to state and no
      citation to make, which is why this field is explicitly null rather than
      absent. THE ABSENCE OF A CORRESPONDENCE IS THE REASON THIS EXPERIMENT CANNOT
      REACH CRYPTOGRAPHIC PARAMETERS, and that limit is stated rather than worked
      around.

  tail_checks:
    - >-
      SMALL-ORDER OUTLIER CHECK. In each decade report the 5 instances with the
      smallest log m / log d, with their full (p, a, b, t, D, f, u, v, d, lambda, m)
      and the EXACT fraction of units mod that d whose order is at most the observed
      m (computable from the factorisation). An outlier far rarer than the null
      predicts is the interesting signal and is the route to the small-m family of
      falsification condition F2. A distribution quoted without this tail is not
      interpretable.
    - >-
      DECAY TAIL. Report the per-decade median, quartiles and minimum of
      log m / log d against log p. A FLAT OR DECREASING median across the ladder is
      the canonical artifact tell and triggers the factorisation-verification
      diagnosis BEFORE any distributional reading.
    - >-
      DEGENERATE AND EXCLUDED TAIL. Report every excluded instance with its reason
      (imprimitive, gcd(v,d) > 1, order certificate failed, factorisation
      unverified, order verification failed), per decade, as counts and as a full
      list of identifiers. A silently dropped instance makes the run INVALID.
    - >-
      DEGREE-WINDOW TAIL. For each instance report m across the k = 5 smallest
      degrees. If the primary m is systematically the extreme of its window, the
      minimiser choice is doing the work and that must be visible.
    - >-
      MEMORY RECONCILIATION TAIL. Report analytic_peak_bytes beside measured
      peak_rss_bytes per stage and their ratio. A ratio outside [0.25, 4.0] is
      reported as a modelling defect with a diagnosis, not absorbed into a footnote.
    - >-
      STAGE-0 QUOTATION TAIL. Report EVERY operation-count passage found in the
      pinned text with its byte offsets, not only the one the verdict rests on. If
      the source states the count over different fields in different places, that is
      the finding and the verdict is AMBIGUOUS.

  replication:
    seeds: [20260807, 20260814, 11235813]
    independent_instances: 7
    replication_note: >-
      The seven prime decades are the independent replication units and the decay
      parameter simultaneously; the three seeds replicate the curve stream, the null
      stream and the sampling within each decade. Every decision threshold below
      aggregates over decades (a criterion at the largest prime plus a
      non-collapse condition across the ladder) or over seeds (agreement required at
      >= 2 of 3), so no single seed, decade or instance can carry a verdict. STAGE 0
      is NOT replicated by seed -- it is a retrieval, replicated instead by
      re-retrieving the artifact and confirming the sha256 matches.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6
    maximum_memory_gb: 4
    maximum_runs: 12
    budget_note: >-
      NO FIELD HERE IS NULL: an unbudgeted task is one this Coordinator must reject
      under its own operating rules. Run accounting: 1 STAGE-0 retrieval run,
      1 STAGE-1 barrier-table run, 1 STAGE-2 control run (planted control plus the
      m = 1 fixture), 7 STAGE-3 measurement runs (one per decade), = 10 core runs,
      plus 2 of headroom for a re-run. Dominant cost is baby-step/giant-step order
      determination (O(p^{1/4}) group operations per curve, about 2^6 at p ~ 2^24)
      and trial-division factorisation of d < 2^26 (about 2^13 divisions per
      instance); at 1000 instances per decade both are seconds to low minutes in
      Python per decade. STAGE 0 is network-bound and costs seconds. ANALYTIC PEAK
      MEMORY, computed before the run: the per-decade instance table is about 1000
      records of about 500 bytes = 0.5 MB, the planted control is negligible, and
      no structure scales with p; analytic_peak_bytes is therefore under 64 MB
      including the interpreter, far under the 4 GB cap. A measured peak_rss beyond
      4x that is a modelling defect and is reported.

  stopping_rules:
    - >-
      SR1 STAGE-0 GATE, AND IT IS A BRANCH POINT, NOT AN ABORT. STAGE 0 runs FIRST
      and alone. Its verdict selects the branch in the frozen decision rule. It
      NEVER stops the experiment by itself: STAGES 1-4 run under every STAGE-0
      verdict, because the (d, lambda, m) measurement, the barrier table and
      mechanism STEP 4 are all independent of it. What the verdict changes is WHICH
      COST STATEMENTS MAY BE MADE at the end.
    - >-
      SR2 CONTROLS FIRST. STAGE 2 (planted control, then the m = 1 fixture, then the
      matched null on the STAGE-3 d values) is run and WRITTEN TO THE RUN RECORD
      before any STAGE-3 distribution or KS statistic is read. Null-first ordering is
      part of the protocol, not a convenience (docs/inventor-protocol.md).
    - >-
      SR3 PLANTED-CONTROL GATE. If the planted control does not report m = 2 on
      every frozen r, STOP: the run set is INVALID, the defect is returned to the
      Executor, and no distribution measured by that pipeline may be cited.
    - >-
      SR4 SAMPLE-SIZE GATE. A decade yielding fewer than 400 admissible instances
      within the attempt cap yields NO distributional verdict; it is reported with
      its achieved n and excluded from M1 and M2. If fewer than 5 of 7 decades yield
      a verdict, the terminal state is INVALID (insufficient measurement) and the
      run returns -- an incompleteness, never a result.
    - >-
      SR5 FROZEN GRID. Stop at the declared ladder, sample sizes, seeds, degree
      window, planted r set and fixture rule. NO extension, no additional decade, no
      additional seed and no additional search term without a versioned
      protocol_amendment filed under experiments/EXP-ICINV-fcb497/amendments/ BEFORE
      the extra data is generated.
    - >-
      SR6 BUDGET. On exceeding wall_clock_seconds_per_run, stop that run and record
      status failed_infrastructure with partial artifacts retained. Per AGENTS.md
      rule 5 this is never negative mathematical evidence and never a verdict. A
      STAGE-0 network failure is failed_infrastructure and IS NOT A BASE_FIELD
      VERDICT.
    - >-
      SR7 NO OUTCOME SHOPPING. The terminal state is computed by the frozen decision
      rule INSIDE the run and written to the run record. It is not selected by a
      human afterwards, and the set of reported metrics does not depend on which
      state fired.

  invalidation_rules:
    - >-
      `code.source.all_pinned` is not TRUE in any run manifest -> INVALID. Per
      CORR-20260807-911ef7 and CORR-20260807-0f5d56, harness/runner.py's
      source_provenance must record `code.source.files[<path>].sha256` for every
      repo .py the run imported, and a run counts as pinned only when
      `all_pinned` is true. Seventeen of EXP-ICINV-4d33aa's nineteen runs are
      unpinned and that debt is exactly what this rule exists to stop. Verified with
      `python3 tools/check_run_source_provenance.py --experiment EXP-ICINV-fcb497
      --strict` before any run is admitted as evidence.
    - >-
      Any STAGE-0 quotation that is not an exact byte-substring of the pinned text
      file at the recorded offsets -> INVALID. Any assertion about the source not
      backed by such a quotation -> INVALID (CORR-20260807-a24675;
      AGENTS.md rule 9).
    - >-
      Any barrier-table quoted_charged_cost cell that is not read from the cited
      artifact at run time and byte-verified against it -> INVALID. Transcribing a
      reference value into source at any precision is prohibited
      (CORR-20260807-a24675 required action 2).
    - >-
      The planted control does not report m = 2 on every frozen r -> INVALID
      (not negative). No null the pipeline reports may be cited.
    - >-
      The m = 1 fixture does not return m = 1 (or a declared, eigenvalue-derived
      m = 2), or the cost formula does not degenerate to Otilde(sqrt ell) there ->
      INVALID; the accounting is wrong and STAGE-3 numbers are uninterpretable.
    - >-
      Any instance whose d factorisation does not verify (product of recorded prime
      powers != d), or whose m fails lambda^m = 1 mod d with lambda^(m/q) != 1 for
      every prime q | m -> THAT INSTANCE IS INVALID and excluded with its reason. If
      such exclusions exceed 1% of a decade -> the DECADE is INVALID.
    - >-
      Any instance dropped for any reason without being recorded with that reason ->
      INVALID. A silently dropped instance is the failure mode the exclusion tail
      exists to prevent.
    - >-
      Raw per-instance records and the reported summary statistics disagree on
      recomputation by a reviewer -> INVALID.
    - >-
      Seed integrity failure: the recorded seeds do not reproduce the recorded curve
      stream, null stream or planted set -> INVALID.
    - >-
      Fewer than 5 of 7 decades yield a distributional verdict at the 400-instance
      floor -> INVALID (insufficient measurement), returned for the missing decades.
    - >-
      Any of harness/exp_icinv.py, harness/exp_icinv_fullgroup.py,
      harness/run_fullgroup.py, harness/run_saturation.py, harness/isogeny_class.py
      is modified -> INVALID. Committed runs of other experiments must remain
      reproducible against them byte-for-byte.
    - >-
      Any record outside experiments/EXP-ICINV-fcb497/ and the three new harness
      modules is edited by this experiment -> INVALID. The barrier table escalates;
      it never corrects.
    - >-
      A timeout, crash, OOM, network failure, or dependency failure -> status
      failed_infrastructure, NOT invalid and NOT negative evidence (AGENTS.md
      rule 5). Partial artifacts are retained and the run is resumed or
      re-dispatched. IN PARTICULAR: an unretrievable STAGE-0 source is
      UNRETRIEVED_INFRA and is never read as a BASE_FIELD verdict.

  frozen_decision_rule:
    evaluation_order: >-
      Terminal states are evaluated STRICTLY IN THIS ORDER and the first that fires
      is the run's verdict. The set is EXHAUSTIVE and DISJOINT by construction.
    state_0_INVALID:
      fires_when: Any invalidation rule above fires.
      meaning: >-
        NOT EVIDENCE. Returns to the Executor with the concrete defects listed. An
        invalid or incomplete run set is not a negative result about anything.
    stage0_branches_frozen:
      S0_KERNEL_FIELD:
        fires_when: >-
          A byte-verified passage of the pinned PRIMARY source states the
          Otilde(sqrt d) operation count over the field of definition of a kernel
          generator (equivalently: over the field in which the kernel points /
          the baby-step-giant-step multiples are represented), and no other
          byte-verified passage of the same source contradicts it.
        consequence: >-
          Cost corollary CC of H-ICINV-82ee6a STANDS as a conditional claim. The
          Otilde(sqrt(d)*m) accounting may be stated, LABELLED MODELED and
          conditional on HEUR-ORD-1. claim tier of the STAGE-0 finding:
          literature_primary_read.
      S0_BASE_FIELD:
        fires_when: >-
          A byte-verified passage of the pinned PRIMARY source states the count over
          the base field with no kernel-rationality qualification, and no other
          byte-verified passage contradicts it.
        consequence: >-
          THE INVERTING BRANCH, PRE-REGISTERED AS A FIRST-CLASS OUTCOME. Cost
          corollary CC is REFUTED. The Otilde(sqrt p) knife edge of the parent
          proposal is REAL and must be re-examined. IDEA-20260807-9fb27c must be
          SUPERSEDED by a new record under a new id -- never edited (AGENTS.md
          rule 4) -- and this lane's priority RISES. Claims T1, T2, T3, HEUR-ORD-1,
          HEUR-M2-2 and mechanism STEP 4 are UNTOUCHED, and STEP 4 alone
          (H-ENDO-001: the endomorphism acts on the prime-order subgroup as a
          scalar) still makes the tie useless for the ECDLP -- which must be stated
          in the same breath so the inversion is not overread as an attack.
          STAGES 1-4 STILL RUN IN FULL.
      S0_AMBIGUOUS:
        fires_when: >-
          The pinned source states the count without disambiguating the field; OR
          different byte-verified passages of the pinned sources disagree; OR only
          the FALLBACK was retrievable (which by the frozen fallback rule can never
          return a determinate verdict); OR only the corpus note KN-LIT-780 was
          available.
        consequence: >-
          NO COST STATEMENT MAY BE MADE IN EITHER DIRECTION. CC remains
          UNDETERMINED and is reported as such. The claim tier of the STAGE-0
          finding drops to literature_secondary_or_ambiguous. The deliverable is the
          full quotation tail plus a named successor action: obtain the ANTS XIV
          proceedings version or a locally archived PDF.
      S0_UNRETRIEVED_INFRA:
        fires_when: >-
          No source could be retrieved (non-200 status, timeout, or no network),
          and no local copy exists.
        consequence: >-
          INFRASTRUCTURE OUTCOME, NEVER A MATHEMATICAL RESULT AND NEVER A
          BASE_FIELD VERDICT (AGENTS.md rule 5). CC remains UNDETERMINED. STAGES
          1-4 still run; the successor action is a retrieval retry.
    state_2_measurement_outcomes:
      evaluated_always: >-
        Evaluated under every STAGE-0 branch, because the measurement does not
        depend on the literature verdict. Exactly one of the three fires.
      OUTCOME_NULL_generic_order:
        fires_when: >-
          M1 median of log m / log d >= 0.75 at the largest decade yielding a
          verdict, AND the decade-median sequence does not fall by more than 0.05
          from its maximum to that decade, AND M2 KS distance is below the
          pre-registered critical value at >= 2 of the 3 largest verdict-yielding
          decades, AND M5 degenerate_fraction <= 0.20 at every verdict-yielding
          decade -- with agreement at >= 2 of 3 seeds.
        meaning: >-
          THE PREDICTED OUTCOME. HEUR-ORD-1 survives at toy scale: the CM order
          supplies nothing special and lambda's multiplicative order is
          indistinguishable from that of a random unit mod the same d. The
          deliverable is NOT "nothing changed" -- it is the per-decade distributions
          with their matched nulls, the named obstruction (KERNEL-POINT
          IRRATIONALITY), the barrier table, and forward guidance.
      OUTCOME_FAMILY_small_m:
        fires_when: >-
          M1 median < 0.5 at the largest verdict-yielding decade AND not rising
          across the ladder; OR M2 shows a KS-significant DEFICIT of log m / log d
          against the matched null at >= 2 of the 3 largest verdict-yielding
          decades -- in either case with agreement at >= 2 of 3 seeds, AND with the
          decay check and factorisation verification both PASSING so the effect is
          not an instrument defect.
        meaning: >-
          HEUR-ORD-1 IS FALSIFIED on the measured range. A family of ordinary curves
          with anomalously small m exists and the Otilde(sqrt p) tie is real ON THAT
          FAMILY. The family must be NAMED and characterised by whatever
          (t, D, f, d) features separate it, and handed forward. STILL NOT AN
          ATTACK: mechanism STEP 4 bites regardless, and that must be stated in the
          same record.
      OUTCOME_INSTRUMENT_defect:
        fires_when: >-
          The decade-median profile of log m / log d is FLAT or DECREASING across
          the ladder while the factorisation-verification control passes, OR the
          verification control fails at a rate below the decade-invalidation
          threshold but with a systematic pattern by decade.
        meaning: >-
          The canonical artifact tell has fired. NO DISTRIBUTIONAL READING IS
          PERMITTED. The deliverable is the diagnosis (most likely a silently
          truncated factorisation of d) and a repair contract. This is an INSTRUMENT
          finding, not evidence about HEUR-ORD-1 in either direction.
    state_3_audit_outcome:
      evaluated_always: true
      OUTCOME_AUDIT_CLEAN:
        fires_when: M4 exponent_changed count is 0 and the undetermined count is 0.
        meaning: AUDIT-Z confirmed. The frozen table is the deliverable.
      OUTCOME_STALE_BARRIER:
        fires_when: M4 exponent_changed count >= 1.
        meaning: >-
          A recorded barrier is STALE. ESCALATED IMMEDIATELY to a Coordinator
          decision regardless of direction; this is a first-order correction to the
          campaign. THE EXPERIMENT MAY NOT EDIT THE AFFECTED RECORD.
      OUTCOME_AUDIT_PARTIAL:
        fires_when: M4 exponent_changed count is 0 and the undetermined count >= 1.
        meaning: >-
          The audit is INCOMPLETE, not clean. Every undetermined row is listed with
          what is missing. AUDIT-Z is NOT confirmed and must not be reported as
          confirmed.
    evidence_strength_calibration_frozen: >-
      FIXED BEFORE EXECUTION SO STRENGTH CANNOT BE CHOSEN AFTER SEEING THE RESULT.
      Agreement of the measurement outcome at 3 of 3 seeds AND >= 6 of 7 decades
      yielding a verdict permits an evidence record of strength `replicated`.
      Agreement at 2 of 3 seeds, or 5 of 7 decades, CAPS the record at
      `preliminary` and the dissenting seed or missing decades must be named in the
      record's observations. THE STAGE-0 FINDING IS A SEPARATE EVIDENCE RECORD with
      type `literature`, capped at `preliminary` on a single retrieval and at
      `anecdotal` if the fallback or corpus note was used. NO EVIDENCE RECORD FROM
      THIS EXPERIMENT MAY EXCEED claim_tier: toy.

  success_criterion: >-
    THE EXPERIMENT SUCCEEDS IFF ALL OF THE FOLLOWING HOLD, AND IT CAN PLAINLY FAIL.
      (S-a) Every run manifest carries `code.source.all_pinned: true` and passes
            `tools/check_run_source_provenance.py --strict`.
      (S-b) STAGE 0 emits a verdict in {KERNEL_FIELD, BASE_FIELD, AMBIGUOUS,
            UNRETRIEVED_INFRA} together with the pinned artifact sha256(s) and, for
            any determinate verdict, at least one byte-verified quotation with
            recorded offsets, plus the full quotation tail.
      (S-c) The planted control reports m = 2 on every frozen r (M3 = PASS).
      (S-d) The m = 1 nearby-object fixture returns m = 1 (or a declared,
            eigenvalue-derived m = 2) from the SAME code path as STAGE 3, and the
