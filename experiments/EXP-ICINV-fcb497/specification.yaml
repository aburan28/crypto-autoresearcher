            400-instance floor, with the matched null measured and written before
            the curve-derived KS statistic is read.
      (S-f) Every instance's d factorisation and m are verified by the frozen
            checks, and every exclusion is recorded with its reason.
      (S-g) The barrier table exists with every frozen column filled and every
            quoted cell byte-verified, including the two required rows.
