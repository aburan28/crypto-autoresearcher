protocol_amendment:
  experiment_id: EXP-ICINV-fcb497
  version_from: 1
  version_to: 2
  filed_at: '2026-08-08'
  filed_by: coordinator (GOAL-ENDO-001, ICINV lane)
  status: filed_and_approved_before_re_execution
  approved_by: coordinator
  approved_by_decision: DEC-20260808-e75211

  scope_in_one_sentence: >-
    THIS AMENDMENT FIXES A RETRIEVAL LIST AND NOTHING ELSE. It adds two mirror
    URLs to the STAGE-0 primary source, requires the version actually used to be
    recorded per quotation, raises maximum_runs prospectively, requires a NEW run
    id, and restates the standing background-knowledge prohibition. It changes NO
    threshold, NO branch definition, NO pre-registered prediction, NO
    byte-verification rule, NO search term, NO sample size, NO seed, NO decade and
    NO decision rule.

  applies_to: >-
    FUTURE RUNS ONLY. No version-1 run is re-scored against anything in this
    file and no raw run record is altered (AGENTS.md rule 4). The version-1
    STAGE-0 verdict AMBIGUOUS, recorded in
    experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v2/stage0-verdict.json,
    stands exactly as recorded. This amendment does not turn either existing
    STAGE-0 run into a determinate verdict; it makes a successor run possible.

  reason: >-
    STAGE 0 returned AMBIGUOUS because the frozen
    stage0_retrieval_frozen.primary_source.urls_in_order pins ALL FOUR of its
    URLs (two primary, two fallback) to eprint.iacr.org, whose PDFs are
    Cloudflare-walled at HTTP 403. THE 403s REMAIN AN INFRASTRUCTURE OUTCOME AND
    ARE NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md rule 5, and the
    contract's own S0_UNRETRIEVED_INFRA consequence). What the independent Red
    Team review established (experiments/EXP-ICINV-fcb497/red-team-report.md,
    RT-3, HIGH) is that the paper is not unavailable: the contract pinned one
    publisher domain. That is a defect in the retrieval list, not a fact about
    the literature. Independently re-confirmed by the dispatching session:
    https://arxiv.org/pdf/2003.10118 returns HTTP 200, 371582 bytes, sha256
    058162905a84b39fc6e23f12341b02899cce9328e9b45ac20750fa86cdfedd11; and
    https://msp.org/obs/2020/4-1/obs-v4-n1-p05-s.pdf returns HTTP 200 with
    Content-Type application/pdf. Full record:
    ledger/corrections/CORR-20260808-ba8792.yaml item C14.

  changes:
    - id: A1
      field: stage0_retrieval_frozen.primary_source.urls_in_order
      kind: defect_repair_retrieval_list
      from:
        - https://eprint.iacr.org/2020/341
        - https://eprint.iacr.org/2020/341.pdf
      to:
        - https://msp.org/obs/2020/4-1/obs-v4-n1-p05-s.pdf
        - https://arxiv.org/pdf/2003.10118
        - https://eprint.iacr.org/2020/341
        - https://eprint.iacr.org/2020/341.pdf
      ordering_rationale: >-
        THE MSP MIRROR IS TRIED FIRST BECAUSE IT IS THE AUTHORITATIVE VERSION.
        Open Book Series 4 (ANTS XIV, msp.org/obs/2020/4-1/) is the proceedings
        of record named by the contract's own attribution block and by
        DEC-20260807-4261e3 next action N4. arXiv:2003.10118 is second: it is
        retrievable and checkable but is a PREPRINT, and its abs page lists only
        v1 (23 Mar 2020), which is NOT the ANTS XIV version. The two eprint URLs
        are retained in their original relative order as third and fourth so the
        version-1 list is a suffix of the version-2 list and nothing is removed.
      authoritative_version_rule: >-
        WHERE THE VERSIONS DIFFER, THE ANTS XIV / MSP VERSION IS AUTHORITATIVE
        and its reading governs the verdict. A determinate verdict resting SOLELY
        on the arXiv preprint must say so on its face and must record the
        preprint's version string; the Coordinator will treat such a verdict as
        determinate for the preprint and as a NAMED SUCCESSOR ACTION against the
        proceedings, not as silently equivalent. If the retrieved versions
        DISAGREE on the field over which the operation count is stated, the frozen
        S0_AMBIGUOUS branch fires on its existing "different byte-verified
        passages of the pinned sources disagree" clause -- that clause is not
        edited and needs no edit.
      fallback_source_unchanged: >-
        stage0_retrieval_frozen.fallback_source.paths_in_order is UNCHANGED, and
        so is the frozen rule that the KN-LIT-780 corpus note can NEVER return a
        determinate verdict and may return only AMBIGUOUS.
    - id: A2
      field: stage0_retrieval_frozen.artifact_pinning_frozen
      kind: addition_recording_obligation
      from: >-
        Every retrieved byte stream is pinned under runs/<RUN-ID>/sources/ with
        its sha256, URL, HTTP status, final URL, Content-Type, byte length and
        retrieval timestamp; extracted text is pinned beside it with its own
        sha256.
      to: >-
        All of the above, UNCHANGED, PLUS: the run must record, FOR EACH
        QUOTATION, which retrieved artifact and which VERSION of the source it
        came from -- the URL actually used, the artifact sha256, and the version
        string as extracted FROM THE ARTIFACT ITSELF (e.g. an arXiv version
        marker, a proceedings volume/page line, an eprint revision line). The
        version string is subject to the SAME byte-verification rule as every
        other quoted text: it is extracted programmatically and re-checked as an
        exact byte substring at recorded offsets, never typed from memory. If no
        version string can be extracted from an artifact, the run records
        `version_string: null` with the reason; it does not supply one.
      rationale: >-
        Two versions are now in the list and they are not the same document. A
        verdict that does not say which one it read is not checkable, and the
        version is exactly the kind of reference value CORR-20260807-a24675
        forbids transcribing.
    - id: A3
      field: budget.maximum_runs
      kind: budget_increase_prospective_only
      from: 12
      to: 16
      prospective_only_statement: >-
        THIS INCREASE IS PROSPECTIVE ONLY AND DOES NOT RETROACTIVELY AUTHORISE
        D1. The version-1 execution recorded 13 run directories against a frozen
        cap of 12. That overrun was settled in DEC-20260807-4261e3 as a DISCLOSED,
        NOT RETROACTIVELY AUTHORISED deviation, the Validator concurred with that
        disposition (validation-report.md sec. 11, D1), and it remains exactly what
        it was. An amendment written now could only pretend to have permitted what
        it did not permit, and this one does not pretend. The 13 version-1 runs
        are counted against the version-1 cap of 12, where they overran; the new
        cap of 16 governs runs executed AFTER this amendment is filed.
      arithmetic: >-
        13 existing run directories, all retained, none edited or deleted; plus 1
        for RUN-ICINV-kf-stage0-v3; plus 2 of genuine headroom for a supersession
        of that run; = 16. The contract's version-1 budget_note enumerated only
        10 core runs while required_artifacts and SR7 both mandate the aggregate
        decide run, so the version-1 accounting was short by one -- that defect is
        named here and repaired by the count above rather than left to be
        rediscovered.
      resource_caps_unchanged: >-
        wall_clock_seconds_per_run 7200, total_cpu_hours 6, maximum_memory_gb 4 --
        ALL UNCHANGED. The version-1 execution used 25.12 s wall, 0.00663
        CPU-hours and 99.16 MB peak RSS in total across 13 runs; runs, not
        resources, were the binding constraint, and STAGE 0 is network-bound and
        costs seconds.
    - id: A4
      field: run identification for the STAGE-0 re-execution
      kind: addition_immutability_guard
      from: (absent)
      to: >-
        The STAGE-0 re-execution MUST be written to a NEW run directory,
        experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/. EDITING,
        DELETING, RE-SCORING OR OVERWRITING ANY EXISTING RUN IS PROHIBITED AND
        MAKES THE NEW RUN INVALID -- this includes RUN-ICINV-kf-stage0 and
        RUN-ICINV-kf-stage0-v2, both of which are RETAINED unchanged and remain
        readable as what they are: version-1 STAGE-0 executions that returned
        AMBIGUOUS on an eprint-only retrieval list. The v3 run declares its
        supersession from its own side, in its own supersession_note, naming this
        amendment; the superseded runs are not touched.
    - id: A5
      field: stage0_retrieval_frozen.background_knowledge_prohibition
      kind: restatement_verbatim_plus_heightened_warning
      from: >-
        (verbatim, unchanged) "The STAGE-0 verdict may cite ONLY the pinned
        artifacts. An assertion about what the paper says that is not supported by
        a byte-verified quotation is a rule-9 fabrication risk and makes the run
        INVALID. If the executor believes it knows the answer and cannot retrieve
        it, the verdict is UNRETRIEVED_INFRA, not the remembered answer."
      to: >-
        THE SAME TEXT, VERBATIM AND UNWEAKENED, WITH THIS STANDING WARNING
        ATTACHED. THIS PROHIBITION MATTERS MORE ON THE v3 RUN THAN IT DID ON v1,
        BECAUSE THE EXPECTED ANSWER IS NOW IN CIRCULATION. The archived Red Team
        report (RT-3) states in the open what it read in sec. 4.14 "Irrational
        generators" -- including that the Frobenius eigenvalue is "of order e",
        which IS this experiment's m = ord_d(lambda), and that "typically e is in
        O(ell)", which would be the source's own statement of HEUR-ORD-1 alongside
        its own negative conclusion. THAT IS A LEAD, NOT AN ESTABLISHED FACT: it
        was read outside a run record, arXiv v1 is not the ANTS XIV version, and
        the contract's byte-verification path has not been applied to it. The v3
        run MUST establish any such passage from a PINNED artifact, at recorded
        byte offsets, re-checked as an exact byte substring, or return
        UNRETRIEVED_INFRA. Reproducing RT-3's quotations, offsets or hashes from
        the report rather than from a freshly retrieved artifact is a rule-9
        fabrication and makes the run INVALID. RT-3's sha256 for the arXiv PDF is
        recorded in this file as a CHECKABLE PREDICTION the run may falsify, NOT
        as a value to be copied into an artifact.
    - id: A6
      field: required_artifacts, archival obligation for runs/<RUN-ID>/sources/
      kind: addition_archival_guard
      from: >-
        The contract names runs/<RUN-ID>/sources/ as IMMUTABLE and BLOCKING for
        STAGE 0 but says nothing about how it reaches the repository.
      to: >-
        Every file written under runs/<RUN-ID>/sources/ MUST BE COMMITTED, and
        the run is not complete until they are. `.gitignore` currently matches
        `*.raw`, so raw byte streams require an explicit force-add; the run
        report must state, per file, that it is tracked. A pinned artifact that
        exists only in a working tree is not a durable receipt and may not be
        cited as one.
      rationale: >-
        Validator finding V-1: ten pinned raw byte streams under the two
        version-1 STAGE-0 runs -- including BOTH HTTP 403 response bodies, the
        only artifacts evidencing the retrieval failure -- were ignored by
        .gitignore:26 and uncommitted. They were force-added in commit 7b40f93fd
        and the finding is closed (CORR-20260808-ba8792 item C13). This change
        makes the gap structurally non-recurring rather than fixed once.

  unchanged_and_still_frozen:
    - >-
      THE BYTE-VERIFICATION PATH, IN FULL AND WORD FOR WORD:
      artifact_pinning_frozen's pinning requirements, extraction_target_frozen
      including the frozen search-term list and the 400-character context window,
      quote_verification_rule_blocking (every quoted passage re-checked
      programmatically as an exact byte substring with start and end offsets
      recorded; a failing quote makes the run INVALID; reconstruction from memory
      PROHIBITED), and reference_value_rule_binding per CORR-20260807-a24675. A2
      ADDS a recording obligation on top of this path and REMOVES nothing from it.
    - >-
      THE FOUR STAGE-0 BRANCH DEFINITIONS, VERBATIM: S0_KERNEL_FIELD,
      S0_BASE_FIELD (including the record-inverting consequence that CC is
      REFUTED and IDEA-20260807-9fb27c must be SUPERSEDED under a new id),
      S0_AMBIGUOUS and S0_UNRETRIEVED_INFRA -- their fires_when clauses, their
      consequences, and their evaluation order. NOT ONE WORD OF THE BRANCH RULES
      IS TOUCHED. In particular the record-inverting BASE_FIELD branch remains a
      first-class pre-registered outcome, and the re-run may fire it.
    - >-
      EVERY PRE-REGISTERED PREDICTION AND EVERY THRESHOLD. The prime ladder
      (k in {12,14,16,18,20,22,24}), the three seeds, n = 1000, the 400-instance
      verdict floor, the derived N >= 369, ks_critical = 1.358*sqrt(2/1000) =
      0.060731606268894296, the declared resolvable distance 0.10, the k = 5
      degree window, the ten planted r values, the m = 1 fixture rule, the
      matched-null design and null-first ordering, the decay tell, the three
      measurement outcomes, the audit outcomes, the falsification conditions
      F-i..F-vi, the success criteria S-a..S-j, and the
      evidence_strength_calibration (3 of 3 seeds AND >= 6 of 7 decades permits
      `replicated`; 2 of 3 caps at `preliminary`).
    - >-
      SR1 through SR7 in full, including SR5's frozen grid (no extra decade, seed,
      sample size, planted value or SEARCH TERM) and SR7's no-outcome-shopping
      rule: the terminal state is computed INSIDE the run and is never selected
      afterwards.
    - >-
      Every invalidation rule, and the standing prohibition on editing the five
      named harness modules.
    - >-
      claim_tier cap `toy`, and the standing scope statements: ordinary
      prime-field curves only, alpha scoped to Z[pi], nothing transfers to
      supersingular curves or to cryptographic parameters.

  what_this_amendment_does_not_do:
    - >-
      IT DOES NOT RE-SCORE ANY EXISTING RUN. The version-1 AMBIGUOUS verdict is
      what it was, computed inside the run against the branch rules as frozen.
    - >-
      IT DOES NOT RETROACTIVELY AUTHORISE D1, and it does not retroactively
      authorise the un-amended document-aware classifier introduced in the v2
      re-run (Validator finding V-4). Both are recorded as disclosed deviations in
      CORR-20260808-ba8792 item C8 and neither is cured here.
    - >-
      IT DOES NOT CHANGE THE CLASSIFIER. The windowed and document-aware labels
      of the version-1 runs are what they are; the v3 run's verdict is gated on
      full-text retrieval and the frozen branch rules, not on labels.
    - >-
      IT DOES NOT AUTHORISE THE REPLICATION. The replacement for withdrawn next
      action N3 -- the three-arm curve / curve-free / uniform-unit design
      pre-registered on KS(curve, curve-free) -- needs its own NEW experiment
      contract under a NEW id, its own approval and its own handoff, and is
      designed only after this run returns.
    - >-
      IT DOES NOT MOVE ANY HYPOTHESIS STATUS and it asserts nothing about the
      content of the source. What sec. 4.14 says is, as of this filing, unknown to
      the ledger.
    - >-
      IT MAKES NO CLAIM ABOVE claim_tier `toy`, no attack claim and no speedup
      claim; sota_delta stays 0.0.

