      D2_typed_costs:
        source_statement: 'J. H. Cheon, Security Analysis of the Strong Diffie-Hellman Problem, EUROCRYPT 2006, LNCS 4004. Theorem 1: for d | p - 1, given g, g^alpha and g^(alpha^d), alpha is computed in O(log p * (sqrt((p-1)/d) + sqrt(d))) group operations. Theorem 2 (the theorem statement, not the 2006 abstract, whose "i = 0, 1, ..., d" is not followed): for d | p + 1, given the 2d consecutive powers g^(alpha^i), i = 1..2d, alpha is computed in O(log p * (sqrt((p+1)/d) + d)) group operations. Here p is the prime group order, called r in this experiment. The J. Cryptology 2010 version (Discrete Logarithm Problems with Auxiliary Inputs) states the same leading expressions with an Exp_G(p) factor, the linear d term on p + 1, and i = 1..2d.'
        provenance: 'Both versions were retrieved and read by TASK-20260923-635c5c: the IACR archive copy of the 2006 paper and the 2010 author''s final manuscript (RT-20260923-38bbbf primary_sources; H-AUXIN-6db354 structural_ingredients, provenance retrieved). The Springer typeset 2010 version was read by no one. THIS design session did not open either paper; it relies on those records. The reopen condition of CORR-20260923-187ea3 (a source giving a sqrt(d) second term for d | p + 1) is recorded there as not met.'
        input_models: 'MINUS: "P, [x]P, [x^d]P (one auxiliary power, exponent d; Cheon 2006 Theorem 1)". Condition label: "Cheon 2010 Theorem 1''s deterministic time uses a generator of the multiplicative group mod r, found by factoring r - 1 at a heuristic cost of order r^(1/4+o(1)) (Cheon 2010 section 2.1); not included in the exponent". PLUS: "[x^i]P for i = 1..2d (2d consecutive auxiliary powers; Cheon 2006 Theorem 2)". Condition label: "ERH assumed in Cheon 2010 Theorem 2 (for a generator of the multiplicative group of the degree-2 extension); not included in the exponent". The condition labels are carried as labels on every row (O12) and are not heuristics of H-AUXIN-6db354.'
        columns: 'Two separate column groups per row, never merged. MINUS group: cost T_minus, input model and condition label as above. PLUS group: cost T_plus, input model and condition label as above. Every row, in each group, carries: status; the exponent (EXACT) or the bound pair (BOUND); the minimiser or witness d in decimal (field minimiser_d); bits of d (d.bit_length()); the input model as the literal string with the symbol d (field input_model, conventions.Q0-12); the condition label; memory_elements_log2 = log2(max(sqrt(m_b/d), sqrt(d))) at that d, the closed-form memory bound in group elements stated by both theorems (O13; not measured; not in the exponent; not a cost); and for the plus group log2(2d), the log2 of the number of consecutive powers the minimiser presupposes.'
        what_is_omitted: 'The typed exponents use the theorems'' leading expressions without the log p (or Exp_G(p)) factor and without the O() constant. Direction of bias: they understate operation counts (the 2010 lemmas carry explicit constants above 1, per RT-20260923-38bbbf). The unit statement of change.D9_labelling is printed beside the rho column.'
        frozen_expression_on_plus: DROPPED. No artifact of a run under this amendment evaluates sqrt(m/d) + sqrt(d) on the plus branch, in any column, labelled or not. On the minus branch that expression IS T_minus.
        no_combined_quantity: The frozen E(r) (a minimum over both branches) is not produced. The branches answer different problems with different inputs (CORR-20260923-187ea3).
        floor_invariant: Every reported exponent or bound on branch b must satisfy e >= F_b(r) - 10^-45. On the plus branch every evaluated d must also satisfy T_plus(d) >= d. A violation on either path is the negative outcome N3.
      D3_descriptive_bins:
        status_of_a_branch: EXACT when m_b is completely factored into primes, each proved under change.D7_certificates, and the product check holds. BOUND when one or more composite parts remain after the budget, each with a recorded compositeness witness and perfect-power check. VOID when the branch fails a validity rule (product mismatch, certificate failure, path disagreement). UNPINNED rows have no branches.
        recorded_parts: (O10.) At the end of factoring a branch the pipeline records F_b, the certified factored part (the product of its certified prime powers), and the list of composite parts P_1, ..., P_k (k >= 1 for BOUND), each an integer greater than 1, with F_b * P_1 * ... * P_k = m_b. C_b denotes the product P_1 * ... * P_k of ALL unfactored parts. The list is written in factorizations.json in ascending order.
        explicit_witness_set: 'EXACT: every positive divisor of m_b, enumerated from the certified factorization. BOUND: W_b is the set of all integers e * (product of the parts in S), for every positive divisor e of F_b and every subset S of {P_1, ..., P_k} (the empty product is 1). Equal integers are counted once. Every member of W_b is an explicit divisor of m_b. With k = 1 this is {e, e*C_b : e | F_b}.'
        values_by_status: 'EXACT: the exponent is the branch minimum over all divisors, with its minimiser. BOUND: the reported upper bound is the minimum of e_b over W_b, with its witness chosen by definitions.minimiser_and_ties over W_b, and the reported lower bound is F_b(r). The true branch exponent lies between them. A BOUND value is never reported as an exponent and never read as one.'
        bin_by_status: '(O11.) EXACT: definitions.bins. BOUND: let s be the depth of the witnessed upper bound. NEAR_FLOOR if s >= 3/4 + tau (the true value is at least as deep). Otherwise the bin is UNDETERMINED and bin_at_least is the bin that definitions.bins gives an EXACT value of depth s (so a witnessed depth within tau of 3/4 gives UNDETERMINED with bin_at_least INTERMEDIATE and boundary_flag true). This clause and definitions.bins never give two answers: the tau band below 3/4 + tau is never NEAR_FLOOR. VOID and UNPINNED: no bin.'
        per_typed_reading: Bins are computed per branch with that branch's typed cost only. A minus-branch witness is never evaluated with T_plus, and the reverse.
        stratification: 'Every count or frequency of bins is reported separately for each stratum: deployed rows with expected_structure_flag false; deployed rows with expected_structure_flag true (BN254-r and BLS12-381-r, whose family polynomials force divisors, CORR-20260923-187ea3); construction controls; C-BOUND declared states; and the null arm per bit class. Strata are never pooled in a reported frequency.'
        semantics: None. A bin is a descriptive label. No bin, on any row, stops the run, triggers an escalation, names a curve, or is read as a property of how any curve was chosen.
      D4_calibration:
        choice: (b) ESCALATE SEMANTICS REMOVED. The table is descriptive. The frozen e_inert_floor and e_escalate_ceiling are retired and no rule, stop or reading uses them. A pre-registered null arm of random primes (protocol_normative.null_arm) runs in the same package, is completed and written BEFORE any deployed row is factored, and is reported beside the deployed rows with the same statuses, bins and strata.
        threshold_inventory: '(F-J3-2, entry 15.) The COMPLETE list of numeric cut-offs and decision constants in this amendment, each with what it reads: bin cut-offs 1/4 and 3/4 and boundary tolerance tau = 10^-45 (declared constants, applied to the depth s, whose normalisation F_b(r), C_b(r) is a closed-form function of the row''s own pinned r, a Stage P input); tie tolerance 10^-100 relative in e (declared constant); precision floor 150 digits and path tolerance 10^-50 (declared); floor-invariant slack 10^-45 and the rule T_plus(d) >= d (declared constant and F_b(r)); control gate tolerance 10^-6 (declared constant and F_b(r) of the control''s r); hasse bound 2*isqrt(p) + 2 (p, h, r of the same row, Stage P inputs); windows 2^24, 2^43 and 2^48, B = 256, M0, B_L = 521, M_L (declared); null-arm size 16 per class (declared); null-arm bit classes (the exact bit lengths of the pinned deployed r, Stage P inputs); factoring budget 3600 seconds per integer (frozen specification value); trial-division
          bound 2^24; F2/F3 routing size 272 bits; the B1 ladder and its curves-per-level column (change.D6_factoring); certificate cut-over 2^64 (change.D7_certificates); PDF digit check (substring test, no numeric cut-off). None of these is a function of any factoring or evaluation outcome of any deployed row, and none is a function of any null-arm value. No threshold is set after any value is seen.'
        what_the_null_arm_is_for: Context only. It shows how often random primes of the same bit length receive each status and bin under the identical pipeline and budget. It licenses no curve-specific reading of any deployed row. No later amendment and no successor layer may pre-register a rule on the basis of this arm for this contract; F-REV is the only revision route. This run's deployed rows are never re-scored by any rule derived from the null arm.
      D5_controls:
        rule: 'Every control is fully declared in protocol_normative.controls below, BEFORE any code, by search start, step order, primality test, acceptance rule, window, tie-breaks and gates, with every expected categorical outcome fixed by this text. The executor implements exactly that text. A control integer that differs from what the text determines voids the run (invalidation_rules). The construction factorization is written to controls_construction.json and is NOT given to the factoring pipeline, which factors each construction control blind, exactly as a deployed row. C-BOUND declared states are the one exception: they are passed directly to the evaluator by design and never enter the pipeline.'
        expected_status_convention: (conventions.Q0-2.) For every construction control branch, the status this text fixes in advance is EXACT, because the construction supplies a complete factorization into proved primes. The run observes the status the blind pipeline returns under the frozen budget of 3600 seconds per integer. A construction-control branch the pipeline leaves BOUND or VOID fails its EXACT gate (outcome N1). A reviewer reproducing a control's classification from this text alone uses the constructed factorization and obtains EXACT.
      D6_factoring:
        budget: 'Each integer m_b (every branch of every construction control, null-arm and deployed row) receives the full factoring_seconds_per_integer = 3600 seconds. Factoring stops only when m_b is completely factored or that budget is spent. THERE IS NO BIT CAP: no integer and no part is excluded from any stage by its size.'
        clock: (F-J1-5, entry 9.) The budget clock is the executor process's monotonic wall clock (Python time.monotonic()), read immediately before and after every factoring call on a part, whether the call runs in-process (PARI through cypari2) or in a subprocess (GMP-ECM). The seconds charged to an integer are the sum of those intervals over all its parts and stages. The remaining budget R is 3600 minus the seconds charged so far.
        timeouts: 'F2 (in-process PARI): each call is issued as the GP expression alarm(A, factor(n)) with A = floor(R) seconds; if floor(R) < 1 the call is not made and the part stays unfactored. An alarm return (PARI error e_ALARM) means the call timed out; the part stays unfactored and the timeout is recorded. F3 (GMP-ECM subprocess): each subprocess is started with a hard timeout of R seconds (killed on expiry, which is recorded). Any overrun of an alarm or kill beyond R is charged to the integer, is recorded, and is never refunded. No other timeout mechanism is used.'
        pipeline: F0 trial division of m_b by every prime below 2^24. F1 every remaining part is tested for being a perfect power (and split if so) and screened for primality; prime parts go to certification and leave the pipeline. F2 every composite part of at most 272 bits goes to PARI factor() under the F2 timeout above; parts are processed in ascending size. F3 every composite part of more than 272 bits goes to GMP-ECM, run over the B1 ladder in ascending order with the fixed number of curves per level below, invoked as "ecm -one -c <curves> <B1>" with the part on standard input, repeating the last level if the ladder completes. After each ECM subprocess returns, every factor it reports that divides the part is split off; every resulting piece re-enters F1, and any composite piece of at most 272 bits goes to F2. For a piece that remains above 272 bits the ladder resumes at the level where it stopped, counting the curves already run at that level. The 272-bit value routes a part between
          two methods; it never ends the budget.
        ecm_curves_per_level: '(F-J1-3, entry 8.) DECLARED CONSTANTS of this protocol, not read from the installed tool: B1 = 2e3: 25 curves; 11e3: 90; 5e4: 300; 25e4: 700; 1e6: 1800; 3e6: 5100; 11e6: 10600; 43e6: 19300; 11e7: 49000; 26e7: 124000; 85e7: 210000; after the last level, 85e7 is repeated with 210000 curves per repetition until the budget is spent. Provenance: the values follow the GMP-ECM README''s expected-curves table as recalled by this design session (provenance recalled, a pointer only). The protocol does not depend on that recollection being exact, because the column is a declared constant, not a claim about the tool.'
        ecm_nondeterminism_disclosure: GMP-ECM draws its own curve parameters (sigma), which are recorded per curve. Which composite parts a re-run splits within the budget may therefore differ, which can change EXACT versus BOUND on a deployed or null-arm branch. A certified factorization and every value derived from it never change.
        reporting: '(F-J1-4, entry 9.) Per integer: the list of parts it passed through, each identified by its decimal value, bit length and the stage that produced it; for EACH part, seconds charged in each of F0 to F3; the ECM curves run at each B1 level with their sigma values and seconds; every F2 alarm and F3 kill; the final list of certified prime powers; and the recorded composite parts with bit lengths, compositeness witnesses and perfect-power checks. Certificate generation is timed separately and is not charged to the factoring budget.'
        budget_semantics: A BOUND row means the full budget was spent without completing the factorization. It is not a statement that the integer resists factoring, and it is never negative evidence (core rule 5).
      D7_certificates:
        producing_library: 'PARI/GP through cypari2. For each prime p >= 2^64: an ECPP certificate from primecert(p), checked on the producing side by primecertisvalid. For each prime p < 2^64, and for the terminal prime of every ECPP chain: a Pratt certificate, built by path A from the complete factorization of p - 1 (recursively, to the leaf 2) with a witness a. PARI''s primecert returns a bare integer, not a certificate, for p < 2^64; that return is never treated as a certificate.'
        independent_verifier: 'A NEW library-free module, experiments/EXP-AUXIN-339fb0/implementation/typed/cert_verify.py, importing only the Python standard library (checked by the AST import audit at admission). It shares no code with PARI, GMP-ECM, FLINT, pypdf or sympy. Its version is the sha256 of its bytes at the launch commit. It checks. (i) Pratt: the listed prime powers multiply to p - 1; a^(p-1) = 1 mod p; a^((p-1)/f) != 1 mod p for each listed prime f; each f carries its own valid certificate. (ii) ECPP step with (N, t, s, a4, P = (x, y)): gcd(N, 6) = 1; m = N + 1 - t; s divides m and q = m/s; b = y^2 - x^3 - a4*x mod N; gcd(4*a4^3 + 27*b^2, N) = 1; [m]P is the point at infinity and [s]P is an affine point whose denominators are invertible mod N, both by exact arithmetic mod N; q > (c + 1)^2 where c is the least integer with c^4 >= N; the next step''s N equals q; the chain''s terminal q carries a valid Pratt certificate. (iii) Compositeness witnesses: the recorded base a is the
          smallest integer a >= 2 for which C fails the strong probable-prime test to base a (such a base exists for every odd composite C, including Carmichael numbers); the verifier re-runs that strong test. An even composite part has witness 2 recorded as "even". This arithmetic runs on auxiliary curves over Z/NZ for primality proofs only; it involves no curve of the frozen list and no auxiliary-input power.'
        changes_from_d1d10_with_reason: The module path moves from implementation/d1d10/ to experiments/EXP-AUXIN-339fb0/implementation/typed/ (change.D10_additivity). The check gcd(N, 6) = 1 is added and the compositeness witness becomes a strong-test witness; both close gaps VAL-20260923-c3c90c attack_iii recorded (the omitted gcd check and the Carmichael case). Nothing else changes.
        criterion_provenance: The Goldwasser-Kilian and Atkin-Morain step criterion, Pratt's criterion and the existence of a strong-test witness for every odd composite are recalled by this design session (provenance recalled, pointer, not support). VAL-20260923-c3c90c attack_iii records a worked soundness check of the step criterion (internal). The admission self-tests are what the run relies on.
        rule: No prime enters an EXACT branch, and no r is pinned, unless path A produced its certificate AND the independent verifier accepted it. A verifier rejection voids the branch (or the row, for r). sympy is not used for any primality verdict.
      D8_custody:
        trial_plan: trial-plan.json under experiments/EXP-AUXIN-339fb0/implementation/typed/ records successor_contract_sha256 only. The run recomputes it at launch and at every stage boundary; mismatch is evidence-integrity failure.
        import_rule: '(F-J1-7, entry 10.) The run is launched as "python3 -I experiments/EXP-AUXIN-339fb0/implementation/typed/run.py ..." (isolated mode: no current directory, PYTHONPATH or user site on sys.path). Every module the run loads must be one of: (a) a Python standard-library module (sys.stdlib_module_names); (b) a module of the installed third-party distributions cypari2, cysignals or pypdf, or of their declared dependencies, each recorded with name and version in manifest.yaml; (c) a file under experiments/EXP-AUXIN-339fb0/implementation/typed/. ANY module whose file lies inside the repository but outside experiments/EXP-AUXIN-339fb0/implementation/typed/ (for example implementation/driver.py, e_eval.py, factor_path_*.py, or anything under tools/) is FORBIDDEN. Checked twice: an AST audit of every .py file under experiments/EXP-AUXIN-339fb0/implementation/typed/ at admission (every import names a module of class a, b or c), and a runtime audit at launch and at every stage boundary
          that lists every entry of sys.modules with a __file__, classifies it, and stops the run (evidence-integrity failure) on any forbidden module. Both audits are written to import_audit.json.'
        implementation_snapshot_and_launch_comparison: (F-J1-8, entry 10.) Before launch, an implementation snapshot archive must bind by path_sha256 every file under experiments/EXP-AUXIN-339fb0/implementation/typed/, and the dispatcher must have verified it. At launch, BEFORE any row is scored and before Stage A0 completes, the run computes the sha256 of (i) every file under experiments/EXP-AUXIN-339fb0/implementation/typed/ in the working tree and (ii) the same path's bytes at the launch commit (git show <launch_commit>:<path>), and compares both with that snapshot's path_sha256. Any missing, extra or differing file refuses launch (evidence-integrity failure). The comparison is written to launch_comparison.json. The post-run snapshot must bind the same implementation bytes again; a difference makes the run uncitable.
        no_self_hash: No artifact contains a hash of itself. Every recorded hash is of a file's final bytes, computed after the file is closed; a hashed file is never rewritten, renamed over or unlinked. orders.json is written once; its sha256 goes to the separate file orders.json.sha256 and to stdout.log before any factoring. That is the meaning of hash-committed in the frozen launch gate.
        manifest: manifest.yaml records dirty_summary, launch commit, implementation snapshot task and commit, successor_contract_sha256, tool versions, third-party distributions and the inference block. Launch is refused if dirty_summary lists this contract file or any path under experiments/EXP-AUXIN-339fb0/implementation/typed/.
        snapshot: The snapshot archive that follows the run must declare IN path_sha256 every file under the run directory (including sources/ and certificates/) and every file under experiments/EXP-AUXIN-339fb0/implementation/typed/. Side fields such as run_artifacts_sha256 or source_sha256 are not verifier-bound (CORR-20260923-64ee17 C6) and do not satisfy this rule. Until such a snapshot verifies, no record may cite the run.
      D9_labelling:
        rule: 'Per CORR-20260923-187ea3 labelling_rule_for_any_citing_record, with the unit statement of CORR-20260923-f5f060. The rho column is named rho_ordinary_input, value 0.5 (the frozen rho_baseline), and is annotated as the ordinary-input cost exponent of a different problem. Every typed exponent column name ends in E_ASSUMES_AUXILIARY_INPUT and names its branch. Every row states per branch the input model, the condition label and the bits of d (change.D2_typed_costs). The table header cites DEC-20260802-204 B032-C7 and B032-C8. The phrase "identical accounting" does not appear in any artifact. The supply condition is stated in the header: every typed exponent is conditional on the named auxiliary input being supplied, which this experiment does not examine (IDEA-20260831-ccb587 unopened).'
        unit_statement_beside_rho: '(entry 11.) Printed verbatim in the typed_table header immediately beside rho_ordinary_input, and in the execution report: "The typed exponents are exponents of the leading step-count expressions of Cheon''s Theorems 1 and 2. Each step is an exponentiation: the theorems carry an O(log p) group-operation factor (EUROCRYPT 2006) or an Exp_G(p) factor (J. Cryptology 2010). The typed exponents omit that factor and the O() constants, so they understate group-operation counts. The rho exponent counts group operations. The two units differ by a factor Theta(log r)." No artifact, report or citing record states that the typed exponents and the rho exponent are in the same unit.'
        secondary_metric_scope: (entry 12, O3/S3.) The quantity "bits of the largest divisor of m_b not exceeding isqrt(r)" is reported on the MINUS branch only, labelled "arithmetic; on the minus branch it locates the divisor nearest the T_minus optimum". It is not computed or reported on the plus branch, where a divisor near sqrt(r) prices at T_plus >= d and is not a Theorem-2 quantity.
        applies_to: every artifact of the run, the execution report and any record that cites the run.
      D10_additivity:
        rule: This contract is never rewritten in place. Any change is a new successor contract under a new EXP id per F-REV. The run uses NEW modules under experiments/EXP-AUXIN-339fb0/implementation/typed/ and edits no implementation file of any other experiment. No amendment layers this contract.
    conventions:
      Q0-1: C-FIELD integers are defined IN THIS TEXT by closed-form expressions (controls C-FIELD), not by reference to a file location. Their equality with the extracted field primes is a run-time gate, not their definition.
      Q0-2: 'Declared convention in change.D5_controls.expected_status_convention: the expected status of every construction-control branch is EXACT; the run observes the blind pipeline''s status under 3600 seconds per integer; a difference fails the gate (N1).'
      Q0-3: Declared convention in change.D1_pins.confounder_check.scope_on_controls_and_null_arm.
      Q0-4: '"Candidates examined" by a search is the number of integers stepped in +1 order from the search start up to AND INCLUDING the accepted one, counting every integer (even integers too), whatever an implementation skips, sieves or trial-divides. For nextprime_gt(x) the start is x + 1.'
      Q0-5: 'DECLARED IMMATERIAL, with reason: every variant of the Baillie-PSW screen that never rejects a prime accepts the same first candidate, because acceptance additionally requires a certificate proof. Convention, to remove the choice anyway: a perfect square is rejected before the Lucas step; a Jacobi symbol (D/n) = 0 with |D| < n is a compositeness exit; any trial-division bound up to 2^16 may precede the screen; within one candidate the named integers are screened in the order the acceptance rule lists them. None of these can change an accepted integer or the count of Q0-4.'
      Q0-6: 'DECLARED IMMATERIAL, with reason: any certificate the independent verifier accepts proves the same integer prime, so no reported integer, status or exponent depends on its form. Convention: the Pratt witness a is the smallest a >= 2 that satisfies the Pratt conditions; ECPP chains are those PARI primecert returns.'
      Q0-7: 'Declared convention in definitions.minimiser_and_ties: the tie tolerance is relative in the exponent e.'
      Q0-8: 'Declared convention in definitions.bins: the boundary tolerance tau is absolute in the depth s.'
      Q0-9: Declared convention in definitions.gate_evaluation_mode.
      Q0-10: The null arm is NOT a declared control. Its integers are not control integers and are not fixed by this text (its bit classes come from Stage P). It is context (change.D4_calibration). The declared controls are exactly those listed in protocol_normative.controls.
      Q0-12: The field input_model is the literal string with the symbol d. The substituted value appears only in the separate field minimiser_d. No artifact substitutes d into the input-model string.
      Q0-11_status: ABSENT. Deleted by construction of EXP-AUXIN-339fb0. Reference reading is decided only by F-READ, F-PRE and F-PREC (named in the design report). No Q0-11 DO-NOT-TAKE rule remains to conflict with F-PRE load-by-hash of DEC-20260927-f680f7.dispatch_preconditions_carried.
    tools_and_admission:
      ecm_backend:
        name: GMP-ECM (the ecm command-line program)
        minimum_version: 7.0.4
        version_command: printf '2^89-1\n' | ecm -c 1 2000 ; the version is the dotted triple that follows "GMP-ECM " at the start of the first line of standard output (the banner of a factoring call; "ecm -version" and "ecm -printconfig" are NOT used, since per VAL-20260923-c3c90c F-J1-2 they do not report it).
        use: stage F3 of change.D6_factoring
      certificate_and_factoring_library:
        name: PARI/GP through cypari2 (in-process)
        minimum_version: PARI 2.13.0
        version_command: python3 -I -c "import cypari2; print(cypari2.__version__); print(cypari2.Pari()('version()'))" ; the PARI version is the first three integers of the second line.
        required_functions:
        - factor
        - primecert
        - primecertisvalid
        - alarm
        - version
        use: stage F2 factoring, ECPP certificates, Pratt inputs, and path A high-precision evaluation
      pdf_text_extractor:
        name: pypdf (Python package)
        minimum_version: 3.0.0
        version_command: python3 -I -c "import pypdf; print(pypdf.__version__)"
        use: change.D1_pins.pdf_digit_check only
        provenance_note: The minimum version is this protocol's declared constant; that the package is named pypdf from 3.0.0 is recalled (pointer only). Admission decides.
      independent_verifier:
        name: experiments/EXP-AUXIN-339fb0/implementation/typed/cert_verify.py
        version: sha256 of its bytes at the launch commit
        dependencies: Python standard library only
      path_b_arithmetic:
        name: Python standard library (int, decimal with at least 150 digits, hashlib)
        minimum_version: Python 3.10
        version_command: python3 --version
        use: independent recompute of products, certificate verification, divisor enumeration, witness sets, typed exponents, bounds, depths and bins
      excluded_for_verdicts: sympy (no primality verdict, no factorization of record)
      admission_gate: 'Run BEFORE launch and written first into the run directory as admission_receipt.json. (1) Each named tool is present, its exact version_command output is recorded, and the parsed version meets the minimum. (2) ECM self-test: printf ''(2^31-1)*(2^89-1)\n'' | ecm -one -c 25 2000 reports the factor 2^31-1 (decimal) within 600 seconds. (3) PARI alarm self-test: the GP expression alarm(1, while(1, )) returns an alarm error within 10 seconds of wall clock. (4) Certificate self-test: path A produces certificates for 2^89 - 1 and 2^607 - 1 and the independent verifier accepts both. (5) Tamper self-test: the verifier REJECTS the certificate of 2^89 - 1 with its top N replaced by 2^89 + 1. (6) The AST import audit of every module under experiments/EXP-AUXIN-339fb0/implementation/typed/ passes change.D8_custody.import_rule, and cert_verify.py and every path B module import only the standard library. (7) successor_contract_sha256 in trial-plan.json matches this contract file at
        launch. (8) pdf_digit_check machinery self-test: the normalized text of sp800-186.pdf contains the string "discretelogarithm" (lowercase, whitespace removed).'
      absence_rule: 'Any failure of the admission gate is an INFRASTRUCTURE STOP: the run is not launched, the probe output is reported as failed_infrastructure, and no other tool, version or verifier is substituted. It is never a result about any curve or about this amendment''s mathematics. Provisioning the declared tools is not part of this text; their absence at execution is an infrastructure stop (REVIEW-AUXIN-20260926-2fc87b K-provision), and any executor card for a run under this amendment carries provisioning as a dispatch precondition.'
      provisioning_precondition: 'Any failure of the admission gate is an INFRASTRUCTURE STOP: the run is not launched, the probe output is reported as failed_infrastructure, and no other tool, version or verifier is substituted. It is never a result about any curve or about this amendment''s mathematics. Provisioning the declared tools is not part of this text; their absence at execution is an infrastructure stop (REVIEW-AUXIN-20260926-2fc87b K-provision), and any executor card for a run under this amendment carries provisioning as a dispatch precondition.'
    stages:
    - id: A0_admission
      does: change.D8_custody.implementation_snapshot_and_launch_comparison, then tools_and_admission.admission_gate.
    - id: P_pin
      does: (P1) Verify every staged source digest (change.D1_pins.staged_source_binding). (P2) Retrieve and archive the two pinned-revision sources (change.D1_pins.retrieval_rule). (P3) Extract every r, field prime p and cofactor h by the parse rules, and every cross-source value. (P4) Run the PDF digit checks. (P5) Run C-FIELD, then C-FIELD-MUTATION; if either fails, stop (N2 or I_TEXT as stated there). (P6) Run the confounder check on every deployed r, prove each r prime, apply the family checks, write orders.json, then orders.json.sha256, and print the sha256 to stdout.log. No factoring of any r - 1 or r + 1 happens in this stage.
    - id: C_controls
      does: Construct C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL exactly per their recipes, run the confounder check on each constructed r, and write controls_construction.json. Factor both branches of each construction control blind through the change.D6_factoring pipeline, certify, evaluate on path A and path B, and apply every gate. Then evaluate the C-BOUND declared states on both paths and apply their gates. Write controls_receipt.json with its sha256 printed. If any gate fails on either path, stop (N1 or N4).
    - id: N_null_arm
      does: Sample, confounder-check, certify, factor, evaluate on both paths and bin every null-arm prime per protocol_normative.null_arm. Write null_arm.json and print its sha256. Complete before any deployed factorization begins.
    - id: D_deployed
      does: Factor both branches of every pinned deployed row, in frozen-list order, certify, and evaluate on path A.
    - id: R_recompute
      does: Path B recomputes every deployed row (products, certificates, divisor enumeration, witness sets, typed exponents, bounds, minimisers, witnesses, depths, bins) and writes independent_recompute.json. Disagreement voids that branch.
    - id: T_table
      does: Emit typed_table.json with the labelling of change.D9_labelling, the deployed rows, the controls, the C-BOUND states and the null arm beside them, per stratum.
    controls:
    - id: C-PLANT-M
      kind: planted_positive_minus
      carried_from: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 controls[C-PLANT-M], restated verbatim
      purpose: 'Known positive on the minus branch at deployed size: r - 1 carries a planted divisor at the Theorem-1 optimum, near sqrt(r - 1).'
      search_start: S = isqrt(M0). d1 = nextprime_ge(isqrt(S)). d2 = nextprime_gt(d1). D = d1 * d2. u0 = ceildiv(M0, 2 * D).
      step_order: u = u0, u0 + 1, u0 + 2, ... (steps of +1 over the integers).
      primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
      acceptance_rule: Accept the FIRST u in step order such that u is prime, u differs from d1 and from d2, r = 2 * D * u + 1 is prime, and v = (r + 1) / 12 is an integer and prime.
      window: d1 must lie in [isqrt(S), isqrt(S) + 2^24); d2 in (d1, d1 + 2^24); u in [u0, u0 + 2^48). r must have exactly B bits. Leaving any window is an infrastructure stop, not a negative.
      tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
      constructed_factorizations: r - 1 = 2 * d1 * d2 * u; r + 1 = 2^2 * 3 * v.
      gates:
      - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
      - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
      - Minus branch is EXACT, its reported minimiser lies in {D, (r - 1)/D}, and 0 <= e_minus - F_minus(r) <= 10^-6.
      - Minus branch bin is NEAR_FLOOR.
      - Plus branch is EXACT and its bin is NEAR_CEILING.
    - id: C-PLANT-P
      kind: planted_positive_plus
      carried_from: 'AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 controls[C-PLANT-P], restated verbatim except the purpose label, changed from "Theorem-2 optimum" to "T_plus optimum" (RT-20260923-38bbbf O8/S8: the location is the optimum of the unit-constant leading expression T_plus, not of Cheon 2010''s explicit count). The recipe and gates are unchanged.'
      purpose: Known positive on the plus branch at deployed size, under the TYPED cost. The planted divisor sits at the T_plus optimum near ((r + 1)/4)^(1/3). A divisor near sqrt(r) would not be a positive under T_plus, because T_plus(d) >= d.
      search_start: d0 = icbrt(M0 / 4) (M0 / 4 is an integer). d = nextprime_ge(d0). w0 = ceildiv(M0, 12 * d).
      step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
      primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
      acceptance_rule: Accept the FIRST w in step order such that w is prime, w differs from d, r = 12 * d * w - 1 is prime, and q = (r - 1) / 2 is prime.
      window: d must lie in [d0, d0 + 2^24); w in [w0, w0 + 2^48). r must have exactly B bits. Leaving any window is an infrastructure stop.
      tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
      constructed_factorizations: r + 1 = 2^2 * 3 * d * w; r - 1 = 2 * q.
      declared_size_of_planted_divisor: d.bit_length() equals d0.bit_length() or d0.bit_length() + 1, and d is at least d0.
      gates:
      - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
      - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
      - Plus branch is EXACT, its reported minimiser equals d, and 0 <= e_plus - F_plus(r) <= 10^-6.
      - Plus branch bin is NEAR_FLOOR.
      - Minus branch is EXACT and its bin is NEAR_CEILING.
    - id: C-INERT
      kind: inert_on_both_branches
      carried_from: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 controls[C-INERT], restated verbatim
      purpose: Known negative on both branches at deployed size. This is the PTM-2 construction form of TASK-20260922-0e10d1 (r = 12w - 1 with w, (r - 1)/2 and r prime), with the search start fixed by this text.
      search_start: w0 = 2^(B-4) (so 12 * w0 = M0).
      step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
      primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
      acceptance_rule: Accept the FIRST w in step order such that w is prime, r = 12 * w - 1 is prime, and q = (r - 1) / 2 = 6 * w - 1 is prime.
      window: w in [w0, w0 + 2^48). r must have exactly B bits. Leaving the window is an infrastructure stop.
      tie_breaks: none needed; the search returns the first acceptable candidate in a total order.
      constructed_factorizations: r - 1 = 2 * q; r + 1 = 2^2 * 3 * w.
      gates:
      - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
      - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
      - Minus branch is EXACT, its minimiser is the smaller member of the tied pair {2, q}, and its bin is NEAR_CEILING.
      - Plus branch is EXACT, its minimiser is the largest divisor of 12, and its bin is NEAR_CEILING.
    - id: C-PLANT-PL
      kind: planted_positive_plus_above_routing_size
      new_in_this_amendment: RT-20260923-38bbbf RC2 (DEC-20260923-a4c3d5 entry 14). A planted positive whose plus branch exceeds the 272-bit F2/F3 routing size, at the largest frozen size, with a planted divisor made of four primes that trial division cannot remove and GMP-ECM can find, so that the blind pipeline must pass through F3.
      purpose: Known positive on the plus branch at B_L = 521 bits, under the typed cost, exercising F0, F1, F3, large-prime certification and evaluation.
      search_start: x_L = icbrt(M_L / 4) (M_L / 4 is an integer). f1 = nextprime_ge(2^43). f2 = nextprime_gt(f1). f3 = nextprime_gt(f2). G = f1 * f2 * f3. y = ceildiv(x_L, G). f4 = nextprime_ge(y). D_L = G * f4. w0 = ceildiv(M_L, 12 * D_L).
      step_order: w = w0, w0 + 1, w0 + 2, ... (steps of +1 over the integers).
      primality_test: definitions.prime (Baillie-PSW screen, certificate proof).
      acceptance_rule: Accept the FIRST w in step order such that w is prime, r = 12 * D_L * w - 1 is prime, and q = (r - 1) / 2 is prime.
      window: f1 in [2^43, 2^43 + 2^24); f2 in (f1, f1 + 2^24); f3 in (f2, f2 + 2^24); f4 in [y, y + 2^24) and f4 > f3; w in [w0, w0 + 2^48). r must have exactly B_L bits. Leaving any window is an infrastructure stop, not a negative.
      tie_breaks: none needed; each search returns the first acceptable candidate in a total order.
      constructed_factorizations: r + 1 = 2^2 * 3 * f1 * f2 * f3 * f4 * w; r - 1 = 2 * q.
      declared_properties: Stated in advance, each by an argument from the recipe alone. (a) ROUTING. f1, f2, f3, f4 and w all exceed 2^24, so F0 removes only 2^2 * 3 from r + 1, and the remaining part f1*f2*f3*f4*w has more than 272 bits (its log2 is about B_L - log2(12), far above 272), so the pipeline must send it to F3. (b) MINIMISER. D_L lies in [x_L, x_L * (1 + 2^-19)), because D_L = G * f4 >= G * y >= x_L and D_L < G * (y + 2^24) <= x_L + G * (1 + 2^24), where G is about 2^129 and x_L is about 2^172. And (r + 1)/4 differs from M_L/4 by a relative amount below 2^-290 (w < w0 + 2^48). So D_L is within a relative 2^-18 of the T_plus optimum x = ((r + 1)/4)^(1/3). Write T_plus(t*x) = x * (2/sqrt(t) + t), minimised only at t = 1 with value 3x. Every divisor of r + 1 is s * (product of a subset of {f1, f2, f3, f4}) * w^c with s | 12 and c in {0, 1}. With c = 1 the divisor exceeds w, which is above 2^300, so T_plus > 2^300. With c = 0 and at most three of the f_i, the divisor is below 12
        * 2^133, so t < 2^-35 and T_plus > 2^17 * x. With all four f_i the divisor is s * D_L, with t within 2^-18 of s, and 2/sqrt(t) + t is least at s = 1 (value 3 + O(2^-36)), against at least 2/sqrt(2) + 2 > 3.41 for s >= 2. Hence the plus minimiser is D_L, uniquely, and e_plus - F_plus is below 10^-6 by a wide margin. (c) MINUS BRANCH. r - 1 = 2q with q prime, so the minimiser is the smaller member of the tied pair {2, q}, and its depth is below 1/4 by the same inequality as C-BOUND BND-2 (argument there).
      gates:
      - The pipeline's blind factorization of each branch equals the constructed one as a multiset of prime powers, on both paths.
      - Every prime in both constructed factorizations carries a certificate the independent verifier accepts.
      - factorizations.json records that the plus-branch part leaving F1 after F0 exceeded 272 bits and that at least one GMP-ECM curve was run on it in F3.
      - Plus branch is EXACT, its reported minimiser equals D_L, and 0 <= e_plus - F_plus(r) <= 10^-6.
      - Plus branch bin is NEAR_FLOOR.
      - Minus branch is EXACT, its minimiser is the smaller member of the tied pair {2, q}, and its bin is NEAR_CEILING.
    - id: C-BOUND
      kind: declared_state_bound_evaluator
      new_in_this_amendment: RT-20260923-38bbbf O9/RC1 and O10 (DEC-20260923-a4c3d5 entry 14); the declared-state BOUND evaluator control of H-AUXIN-6db354 falsification_conditions item 5.
      purpose: Test the BOUND rules of change.D3_descriptive_bins (recorded parts, witness set, witness, bound pair, UNDETERMINED and bin_at_least) at values fixed by this text before the run. Each state is a DECLARED factorization state built from the certified construction integers of C-PLANT-M and C-PLANT-P. It is passed directly to the evaluator on path A and path B and never enters the factoring pipeline; a state that F0 would never leave (small primes inside a part) is permitted because the control tests the evaluator, not the pipeline.
      inputs: 'From C-PLANT-M: r_M (its r), d1, d2, u and D = d1 * d2, with r_M - 1 = 2 * d1 * d2 * u. From C-PLANT-P: r_P (its r), d and w, with r_P + 1 = 12 * d * w. Every prime named below is certified by Stage C. Each part below is recorded with its compositeness witness (change.D7_certificates) and a perfect-power check.'
      states:
      - id: BND-1
        type: single composite part, witness in e*C_b, near the floor (RT U1 type)
        row_and_branch: C-PLANT-M, minus (m = r_M - 1)
        declared_state: F = 2 * u with certified prime powers 2^1 and u^1; parts [D].
        expected: 'status BOUND. W = {e, e * D : e | 2u}. witness = the smaller of D and 2u (they tie exactly, because D * 2u = m and T_minus(d) = T_minus(m/d)). upper bound = e_minus(witness). lower bound = F_minus(r_M). bin NEAR_FLOOR, boundary_flag false. CONSISTENCY: the upper bound equals, within 10^-50, the EXACT minus exponent of C-PLANT-M from the same stage (its minimiser lies in {D, 2u} by that control''s gate).'
        why_fixed_in_advance: D and 2u are both within a factor 1 + 2^-37 of sqrt(m) by the C-PLANT-M recipe (d1 and d2 lie within 2^25 of isqrt(S), about 2^63, so D is within a relative 2^-37 of S = isqrt(M0), and 2u = m / D), so the upper bound is within 10^-6 of the floor and its depth exceeds 3/4. Every other member of W has T_minus at least sqrt(m/(2u)) + sqrt(2u) or larger, by the symmetry of T_minus and the sizes of 1, 2, u, 2uD.
      - id: BND-2
        type: single composite part hiding the optimum (RT U2 type)
        row_and_branch: C-PLANT-M, minus (m = r_M - 1)
        declared_state: F = 2 with certified prime power 2^1; parts [d1 * d2 * u].
        expected: status BOUND. W = {1, 2, m/2, m}. witness = 2 (tied exactly with m/2; the smaller is reported). upper bound = e_minus(2). lower bound = F_minus(r_M). bin UNDETERMINED with bin_at_least NEAR_CEILING, boundary_flag false. The construction's true branch value is near the floor; the control checks that the evaluator never promotes a bound and never bins a hidden divisor.
        why_fixed_in_advance: C_minus - e_minus(2) = log2((sqrt(m) + 1)/(sqrt(m/2) + sqrt(2))) / log2(r_M), which is below 1/(2 log2(r_M)) + 2^-100. C_minus - F_minus = (log2(sqrt(m) + 1) - 1 - log2(m)/4)/log2(r_M), which exceeds (log2(m)/4 - 1)/log2(r_M) >= 62/log2(r_M) since m has 256 bits. So the witnessed depth is below 1/100, which is below 1/4 - tau.
      - id: BND-3
        type: TWO composite parts (RT U3 type; the O10 rule and PTM-E)
        row_and_branch: C-PLANT-P, plus (m = r_P + 1)
        declared_state: F = 2 with certified prime power 2^1; parts [2 * d, 3 * w].
        expected: 'status BOUND. W = {e * (product of S) : e | 2, S a subset of {2d, 3w}} = {1, 2, 2d, 4d, 3w, 6w, 6dw, 12dw}. witness = 2d. upper bound = e_plus(2d). lower bound = F_plus(r_P). bin NEAR_FLOOR, boundary_flag false. CONTRAST, stated so that a mis-implementation is visible: the superseded single-cofactor formula (C_b = 6dw, W = {1, 2, 6dw, 12dw}) would give witness 2 and bin UNDETERMINED; that result fails this gate.'
        why_fixed_in_advance: 'd is within a relative 2^-60 of x = (m/4)^(1/3) by the C-PLANT-P recipe. With T_plus(t*x) = x * (2/sqrt(t) + t): 2d has t near 2 and T_plus near 3.414x; 4d has t near 4 and T_plus near 5x; 1 and 2 have T_plus above sqrt(m/2), near 2^127; 3w, 6w, 6dw and 12dw have T_plus above 3w, near 2^170. So the witness is 2d, uniquely. Its exponent exceeds F_plus by log2(3.415/3)/log2(r_P), below 0.19/log2(r_P), while C_plus - F_plus exceeds (log2(m)/6 - 1)/log2(r_P) >= 41/log2(r_P). So the depth exceeds 0.99, above 3/4 + tau.'
      gates:
      - For each state, on path A and on path B, the evaluator returns exactly the expected status, witness set, witness, bin, bin_at_least (where stated) and boundary_flag.
      - For each state, both bounds equal the expected closed-form expressions within 10^-50, and the floor invariant holds.
      - BND-1 CONSISTENCY holds.
    - id: C-FIELD
      kind: field_prime_negative
      changed_from_d1d10_with_reason: (entries 4 and 5.) In the refused predecessor each case integer was defined by a file location, so the recipe was not determinate from the text (rederivation Q0-1), case 2 needed a representation choice (VAL-20260923-c3c90c choice C3), and the case and the value compared with it came from the same locator, so the control tested only equality wiring (F-J1-10). Here each case integer is a closed-form expression in this text, and its equality with the independently extracted field prime is a separate gate. The brainpoolP384r1 case is dropped because its field prime has no closed form and cannot be stated without a literal; that row remains covered by the confounder check, which applies to every row.
      cases:
      - id: CF-1
        value: 2^255 - 19
        presented_as: the r of row Ed25519-L (cofactor h printed, value 8 per the source)
        expression_provenance: Printed as "2^255 - 19" in inputs/SAFECURVES-20260825/specs/rfc7748.txt section 4.1 (read by this design session). In sp800-186.txt the same expression is printed with its superscript and minus sign lost.
        extraction_cross_check: CF-1 must equal the Ed25519-L field prime p extracted in P3 by PR-SP800 (hex form).
        expected_reasons:
        - field_prime
        - hasse
      - id: CF-2
        value: 2^256 - 2^224 + 2^192 + 2^96 - 1
        presented_as: the r of row NIST-P-256 (cofactor h printed, value 1)
        expression_provenance: Recalled by this design session (provenance recalled). The sp800-186.txt P-256 block prints a damaged expression whose surviving exponents are 256, 224, 192 and 96 followed by 1, consistent with it. The extraction cross-check below is what the run relies on.
        extraction_cross_check: CF-2 must equal the NIST-P-256 field prime p extracted in P3 by PR-SP800 (hex form).
        expected_reasons:
        - field_prime
      acceptance_rule: none; these are not searched.
      why_the_expected_reasons_are_fixed: 'Both expressions are prime (proved at run time under change.D7_certificates), so not_prime does not fire. field_prime fires on each because each equals a member of FP. For CF-1, h = 8 and r = p, so |p + 1 - 8p| = 7p - 1 exceeds 2*isqrt(p) + 2 and hasse fires. For CF-2, h = 1 and r = p, so |p + 1 - p| = 1 and hasse does not fire: on a cofactor-1 row the field_prime clause is the only separator (RT-20260923-38bbbf O15).'
      gates:
      - Each case's extraction_cross_check holds. If it fails, the run stops in Stage P with outcome I_TEXT (see success_criterion).
      - Each case is REJECTED, before any factoring, with a recorded reason list exactly equal to its expected_reasons, in order, on the confounder check as written.
    - id: C-FIELD-MUTATION
      kind: confounder_check_mutation
      new_in_this_amendment: RT-20260923-38bbbf RC3 and VAL-20260923-c3c90c F-J1-10 (DEC-20260923-a4c3d5 entry 4).
      purpose: Show that C-FIELD tests the clause it claims to test. The same confounder-check implementation is run once more on CF-1 and CF-2 with clause (1) field_prime DISABLED by a parameter of that implementation (the only change), and nothing else altered.
      expected: 'CF-1 returns reasons [hasse] (still rejected). CF-2 returns an EMPTY reason list: it is ADMITTED, because on a cofactor-1 row nothing but the equality clause separates a field prime from r.'
      gates:
      - The mutated check returns exactly the expected reason lists. Any other result is outcome N2.
      - The mutated check's results are written to confounder_receipt.json under a separate key and are never used to pin, admit or factor anything.
    - id: C-PRODUCT
      kind: arithmetic_product
      purpose: frozen spec control, unchanged.
      gates:
      - For every EXACT or BOUND branch of every row and control, F_b times the product of all recorded parts (1 if EXACT) equals m_b exactly, on path B.
    - id: C-RECOMPUTE
      kind: independent_recompute
      purpose: frozen spec control, strengthened by definitions.precision and change.D7_certificates.
      gates:
      - Path A and path B agree on every branch of every row within definitions.precision.
    - id: C-ORDER
      kind: ordering
      purpose: frozen spec control, strengthened.
      gates:
      - confounder_receipt.json, controls_receipt.json and null_arm.json exist, with their sha256 printed to stdout.log, before the first deployed factorization starts (timestamps in stdout.log and the stage order in execution-report.yaml).
    controls_distinctness: C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL are structurally distinct (their constructed factorizations differ in shape, and C-PLANT-PL has B_L bits), so their r values cannot coincide. The C-BOUND states reuse the C-PLANT-M and C-PLANT-P integers by design.
    what_the_controls_exercise: (entry 13, S2/O2.) C-PLANT-M, C-PLANT-P and C-INERT exercise, at B = 256 bits, the EXACT path through F0, F1 and F2, certification and evaluation on three constructed shapes. C-PLANT-PL exercises, at B_L = 521 bits, the EXACT path through F0, F1 and F3, certification of primes up to that size and evaluation on one constructed shape. C-BOUND exercises the BOUND evaluator on three declared states, including two composite parts. C-FIELD and C-FIELD-MUTATION exercise the confounder check on two rows. No control exercises a BOUND state produced by the pipeline itself, F2 at a size other than 256 bits, or a pipeline-produced multi-part state; their correctness on the deployed rows is an assumption stated in interpretation_limits.
    null_arm:
      carried_from: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 null_arm, restated verbatim (the seed label is kept, so the arm is the one that text froze)
      bit_classes: The distinct exact bit lengths of the r values of the deployed rows pinned in Stage P. They are fixed by the primary sources, not by any outcome.
      size_per_class: 16
      sampler: 'For bit class L and index i = 0, 1, ..., 15: label is the ASCII string "AMD-EXP-AUXIN-7e2e3d-20260923-d1d10/null/" followed by L in decimal, "/", and i in decimal, with no padding and no trailing newline. k = ceildiv(L, 8). X = the big-endian integer of the first k bytes of SHAKE-256(label), taken mod 2^(L-1). start = 2^(L-1) + X. The sample is nextprime_ge(start), searched upward by +1; if the search reaches 2^L it continues from 2^(L-1) upward.'
      seed: The label prefix "AMD-EXP-AUXIN-7e2e3d-20260923-d1d10/null/" is the seed. No other randomness is used.
      is_not_a_control: conventions.Q0-10
      pipeline: Identical to deployed rows. Confounder check (clause (1) against the whole set FP and clause (2); clause (3) does not apply, since a sample is no curve's order), certificate, full frozen factoring budget per branch, both paths, statuses, bounds, bins, stratum. A sample equal to a deployed r, or two equal samples, is kept and flagged.
      reported_beside_deployed: 'Per bit class and branch: the count of each status and bin, and the sorted list of exact exponents and of witnessed upper bounds. No statistic of the null arm enters any rule.'
      disclosed_sampler_bias: nextprime of a uniform start weights each prime by the gap below it. This is a known small bias of the sampler and is disclosed, not corrected.
      size_disclosure: With 16 samples per class, any frequency read from the arm has a wide interval; this is one reason no rule reads it.
    preregistered_prediction:
      quantity: the gate outcomes of C-PLANT-M, C-PLANT-P, C-INERT, C-PLANT-PL, C-BOUND, C-FIELD and C-FIELD-MUTATION
      formula: Every gate in protocol_normative.controls holds on both paths. For the deployed rows and the null arm NO value is predicted; they are reported, not tested (H-AUXIN-6db354 predictions item 4).
      source: The analytic floors in definitions (exact minima of the two leading expressions), the constructed factorizations, and the arguments stated in each control. Not tuned after any run.
    metrics:
      primary:
      - per row and branch - status, typed exponent (EXACT) or bound pair (BOUND), minimiser or witness d in decimal, bits of d, input model, condition label, memory_elements_log2, and for the plus branch log2(2d)
      - per row and branch - depth s, bin, bin_at_least (BOUND), boundary_flag
      - per row and branch (BOUND) - the recorded parts and the witness set W_b
      - per construction control - every gate verdict on path A and on path B
      - per C-BOUND state - every gate verdict on path A and on path B
      - C-FIELD and C-FIELD-MUTATION - extraction cross-check verdicts, reason lists and gate verdicts
      - null arm - per bit class and branch, counts of statuses and bins
      - per row - pin record (spans, representation, cross-checks, PDF digit check), product check and path agreement verdicts
      - per prime - certificate kind, producing-library check, independent-verifier verdict
      secondary:
      - per integer and per part - seconds in each factoring stage F0 to F3, ECM curves per B1 level with sigma values, F2 alarms and F3 kills
      - per integer - recorded composite parts with bits, compositeness witnesses and perfect-power checks
      - per row, MINUS branch only - bits of the largest divisor of m_minus not exceeding isqrt(r) (EXACT), or of the largest such member of W_minus (BOUND, a lower bound), labelled per change.D9_labelling.secondary_metric_scope
      - per construction control - candidates examined in each search (conventions.Q0-4)
      - wall-clock per stage and peak RSS
    budget:
      enforcement: advisory
      maximum_runs: 1
      maximum_workers: 1
      maximum_memory_gb: 8
      factoring_seconds_per_integer: 3600
      wall_clock_seconds_per_run: null
      wall_clock_note: Advisory, not a veto. Worst case is bounded by the number of factored integers (2 x (deployed rows + 4 construction controls + 16 x bit classes)) times 3600 seconds, plus construction, certification, retrieval and evaluation time. It is expected to be dominated by the largest bit classes, where integers are likely to spend the full budget. The C-PLANT-PL search examines many 521-bit candidates; its time is disclosed, not capped, beyond its window.
      construction_watchdog: Machine protection only. A control construction that has not finished its search within its declared window stops as infrastructure (the windows above).
      total_cpu_hours: null
    stopping_rules:
    - Implementation snapshot or launch comparison mismatch - do not launch; evidence-integrity failure.
    - Admission failure - do not launch; failed_infrastructure; nothing substituted.
    - Staged-source digest mismatch - stop in Stage P; evidence-integrity failure.
    - Pinned-revision source unreachable - stop in Stage P before any factoring; failed_infrastructure; nothing substituted.
    - C-FIELD extraction cross-check fails - stop in Stage P; outcome I_TEXT.
    - A C-FIELD case not rejected with exactly its expected reasons, or a C-FIELD-MUTATION result other than expected - stop in Stage P before any factoring; outcome N2.
    - Any control construction leaves its window - stop; failed_infrastructure (not negative).
    - A construction control rejected by the confounder check - stop; outcome I_CONTROL_COLLISION.
    - Any construction-control gate fails on either path - stop after writing controls_receipt.json; outcome N1; no null-arm or deployed factorization.
    - Any C-BOUND gate fails on either path - stop after writing controls_receipt.json; outcome N4; no null-arm or deployed factorization.
    - Any floor_invariant violation (change.D2_typed_costs) on any row or control, on either path - stop; outcome N3.
    - successor_contract_sha256 mismatch, or a forbidden module detected, at any stage boundary - stop; evidence-integrity failure.
    - Per integer - stop factoring when its budget is spent; keep the certified partial factorization and the recorded parts; the branch is BOUND.
    - Memory protection or crash - checkpoint completed rows; incomplete rows are failed_infrastructure.
    - There is NO stop-and-escalate. Apart from the validity rules above (N3 and the VOID and UNPINNED statuses, which test the instrument on every row), no stop depends on any deployed-row or null-arm value. After Stage C passes, the package runs every null-arm and deployed row to completion.
    - Never execute Cheon's algorithms, never generate or consume any auxiliary power, never enter a protocol-supply stage.
    - 'Outcome hierarchy: evidence-integrity stops and admission failures precede instrument falsification outcomes (N1, N2, N3, N4). There is no stop-and-escalate on deployed-row exponents. After Stage C passes, null-arm and deployed rows run to completion unless a validity rule fires.'
    invalidation_rules:
    - The invalidation rules of this contract are exactly this list; no held specification.yaml rule stands by reference.
    - A pin not taken from its named source by its parse rule, or without recorded line numbers, verbatim span and file sha256 - that row is invalid_measurement.
    - A pin taken from any revision, mirror or document other than the one named - that row is invalid_measurement.
    - A field prime used as r (detected at any time) - that row is invalid_measurement; never negative, never inert.
    - Adding, dropping or reordering a deployed row after Stage P begins - invalid_measurement of the package.
    - Any control integer that differs from what its recipe text determines, any control built by an undeclared recipe, or any C-BOUND state other than those declared - invalid_measurement of the package.
    - Any evaluation of sqrt(m/d) + sqrt(d) on the plus branch in any artifact, any column combining the two branches, or any plus-branch value of the largest-divisor-below-isqrt(r) metric - invalid_measurement of the table.
    - A prime in an EXACT branch without an independently verified certificate - that branch is VOID.
    - Path A and path B disagreement - that branch is VOID.
    - Any edit of this contract file after approval - evidence-integrity failure.
    - A hashed artifact rewritten after hashing, or a self-hash of a deleted pre-image - evidence-integrity failure.
    - Launch with a dirty implementation tree under experiments/EXP-AUXIN-339fb0/implementation/typed/, or on implementation bytes that differ from the implementation snapshot that differ from the implementation snapshot - invalid_measurement of the package.
    - Any module loaded from inside the repository but outside experiments/EXP-AUXIN-339fb0/implementation/typed/ - invalid_measurement of the package.
    - Any artifact stating that the typed exponents and the rho exponent share a unit, or using "identical accounting" - invalid_measurement of the table.
    - Timeout, crash, OOM, unreachable pinned source or tool absence - failed_infrastructure; never a mathematical negative.
    - Any rule that would open, hash, compare or stand on a path under experiments/EXP-AUXIN-7e2e3d/ is void; F-CUSTODY.independence governs. No AMD-edit rule and no incorporates.sha256 comparison is in this list.
    required_artifacts:
    - admission_receipt.json
    - launch_comparison.json
    - import_audit.json
    - manifest.yaml (with dirty_summary, launch commit, implementation snapshot, successor_contract_sha256, tool and distribution versions, inference block)
    - sources/ (the two retrieved pinned-revision files, the normalized PDF texts) and sources/retrieval.json
    - pdf_check.json
    - orders.json and orders.json.sha256
    - confounder_receipt.json (every candidate's ordered reason list; C-FIELD and C-FIELD-MUTATION results under separate keys)
    - controls_construction.json (recipe inputs, candidates examined, constructed factorizations)
    - controls_receipt.json (every construction-control and C-BOUND gate, both paths)
    - null_arm.json
    - factorizations.json (every integer, per-part and per-stage seconds, ECM curves, recorded parts and witnesses)
    - certificates/ (one file per certified prime, with producing-library and independent-verifier verdicts)
    - typed_table.json
    - independent_recompute.json
    - environment.json
    - command.txt
    - stdout.log
    - stderr.log
    - execution-report.yaml
    - experiments/EXP-AUXIN-339fb0/implementation/typed/ (every module, cert_verify.py, run.py and trial-plan.json), all declared in the snapshot's path_sha256
    success_criterion:
      outcomes:
      - id: S_VALID_TABLE
        kind: success
        condition: Launch comparison and admission passed; C-FIELD and C-FIELD-MUTATION met their gates; every gate of C-PLANT-M, C-PLANT-P, C-INERT, C-PLANT-PL and C-BOUND held on both paths; no floor_invariant violation; every deployed row is PINNED (or UNPINNED with a recorded source failure) and every pinned deployed branch is EXACT or BOUND with product check and path agreement; the null arm is complete; every required artifact is present.
      - id: S_PARTIAL_TABLE
        kind: success_with_voids
        condition: As S_VALID_TABLE except that one or more deployed branches are VOID under a validity rule. The void branches are listed with reasons. Not negative about any curve.
      - id: N1_INSTRUMENT_FALSIFIED
        kind: negative
        condition: Any gate of C-PLANT-M, C-PLANT-P, C-INERT or C-PLANT-PL fails on either path. The typed census pipeline (factoring, certification, evaluation or binning) is falsified at the size of the failing control, and no null-arm or deployed row is read.
      - id: N2_CONFOUNDER_CHECK_FALSIFIED
        kind: negative
        condition: A C-FIELD case is not rejected with exactly its expected reasons, or a C-FIELD-MUTATION result differs from its expected reasons. The pin confounder check is falsified; nothing is factored.
      - id: N3_FLOOR_VIOLATION
        kind: negative
        condition: Any reported exponent or bound lies below its branch's analytic floor (beyond the 10^-45 slack), or any evaluated T_plus(d) < d. The evaluator is falsified and the whole table is void.
      - id: N4_BOUND_EVALUATOR_FALSIFIED
        kind: negative
        condition: A C-BOUND state returns a status, witness set, witness, bound, bin, bin_at_least or boundary_flag other than the value this text fixes (H-AUXIN-6db354 falsification_conditions item 5). The BOUND rules are falsified and no null-arm or deployed row is read.
      - id: I_TEXT
        kind: text_defect
        condition: A C-FIELD expression differs from the field prime extracted for its row. This localises to this text's expression or to the extraction, and the run cannot tell which. Stop in Stage P. Not negative, not a result; this contract returns to review under F-REV.
      - id: I_CONTROL_COLLISION
        kind: text_defect
        condition: A construction-control integer is rejected by the confounder check. Stop. Not negative, not a result; this contract returns to review under F-REV.
      - id: I_INFRA
        kind: infrastructure
        condition: Launch-comparison or admission failure, staged-digest mismatch, unreachable pinned source, window exit, crash, timeout outside the per-integer budget, OOM, forbidden module or tool absence. Never negative.
      decidability: '(F-J3-1, entry 15.) Each outcome is decided from the gate verdicts, statuses, validity rules and invariants in metrics.primary alone. The only way a deployed-row result enters an outcome is through the validity rules that test the instrument on every row: N3 (the floor invariant), VOID (which separates S_VALID_TABLE from S_PARTIAL_TABLE) and UNPINNED. None of these is a threshold on a deployed-row exponent, bound, bin or divisor, and no deployed-row value is compared with any cut-off chosen for it.'
    falsification_criterion: The amended census instrument is falsified by N1, N2, N3 or N4. It is not falsified by any deployed-row or null-arm value, by a BOUND row, by an I_TEXT or I_CONTROL_COLLISION stop, or by an infrastructure failure.
    interpretation_limits:
    - A typed, labelled arithmetic table at the pinned frozen orders only. Each exponent is conditional on the named auxiliary input being supplied; this experiment does not examine supply (IDEA-20260831-ccb587 unopened).
    - Exponents are those of the leading expressions of Cheon 2006 Theorems 1 and 2 without the log p factor or O() constant, as read per CORR-20260923-187ea3. They are Cheon's known exponent realised at specific integers, not a new algorithm, and they are in Cheon step units, not the rho unit (change.D9_labelling.unit_statement_beside_rho).
    - A BOUND row is a pair of bounds under the spent budget, never an exponent.
    - Bins are descriptive. No bin on any row is read as curve-specific, and the null arm is context, not a test. The earlier generic-bin reading of CORR-20260923-187ea3 and CORR-20260923-5c5a23 S3 rests on a 256-bit random-prime sample only and is not extended to other sizes by this text.
    - Control coverage is exactly protocol_normative.what_the_controls_exercise. Passing it validates those paths at those sizes and states. Correct behaviour of the pipeline on deployed rows at bit lengths other than 256 and 521, on F3 at bit lengths other than 521, on pipeline-produced BOUND states and on F2 away from 256 bits is an assumption, most exposed where large rows are BOUND.
    - On the two pairing-family rows (BN254-r, BLS12-381-r) the family polynomials force divisors; deep values there are the expected case and are reported in their own stratum.
    - Nothing in this contract concerns any claim outside the claim ceiling restated in protocol_normative.claim_ceiling_restated of this contract. The DEC-20260802-204 acquisition gate is cited for provenance only and is not opened at run time.
    - This text does not assert that its controls discharge GOAL-AUXIN-a93442 completion criterion 4, and it defines no trigger for pause condition 3. Every run package under this amendment goes to independent validation and red team before any further work on the goal, whatever its values.
    proof_search_map:
      not_applicable_reason: null
      bottleneck: Completeness of the factorizations of the largest rows within the frozen budget. It decides whether a branch is EXACT or BOUND, and a BOUND row can hide a deeper divisor than its witnesses show (C-BOUND BND-2 is the declared instance).
      baseline_embedding:
        parameter_slice: The minus branch with T_minus is exactly the frozen specification's cost_expression on r - 1, so the minus column reproduces the frozen quantity; F_minus is Cheon's balanced exponent on that branch, and F_plus is the minimum of Cheon's Theorem-2 leading expression.
        reproduction_check: C-PLANT-M must land within 10^-6 of F_minus at its planted divisor, and C-PLANT-P and C-PLANT-PL within 10^-6 of F_plus at theirs.
      observation_collision:
        observable: the per-branch typed exponent (or bound pair) and its bin
        distinct_preimage_search: Three collisions are named and separated. (1) The untyped frozen E(r) made the minus and plus problems collide in one number; the typed columns separate them. (2) An EXACT value and a BOUND upper bound can be equal; the status field separates them, and BND-1 forces exactly that case and checks both are reported with their statuses. (3) UNDETERMINED with bin_at_least NEAR_CEILING covers rows whose truth is near the floor as well as rows truly near the ceiling; status plus bin_at_least separates them, and BND-2 is the declared instance. Random primes producing the same bins as deployed rows are shown by the null arm, which is why no bin is read as curve-specific.
      constructive_transforms: []
      constructive_transforms_note: None proposed. The object is a measurement protocol, not a mechanism to improve.
      quantifier_order: 'For each deployed row r, fixed by its primary source (at a pinned revision) before any factoring, and for each branch b, under the fixed budget: the pipeline records F_b and its composite parts; then the evaluator outputs either the minimum of e_b over ALL divisors of m_b (EXACT) or the minimum over the witness set W_b generated by those recorded parts together with the floor F_b(r) (BOUND). The recorded parts are an outcome of the factoring run; W_b is a fixed function of them, stated before the run (O10). The input model is attached per branch (one power [x^d]P on minus; [x^i]P for i = 1..2d on plus). The table asserts nothing about whether any party supplies that input.'
      method_ceiling:
        strongest_certifiable_claim: A certified, typed table of Cheon's known exponents at specific integers, conditional on supplied input. It cannot move any exponent (known prior art, DEC-20260802-208).
        nearby_object_control: The null arm (random primes of the same bit lengths, same pipeline), C-INERT, the three planted controls, the C-BOUND declared states, and C-FIELD with its mutation (a field prime presented as r).
      proof_obligations:
      - claim: For EXACT branches the divisor lattice is complete.
        responsibility: correctness
        discharged_by: C-PRODUCT, change.D7_certificates, C-RECOMPUTE
      - claim: For BOUND branches the witness set and bound pair follow the declared rule.
        responsibility: correctness
        discharged_by: change.D3_descriptive_bins, C-BOUND, C-RECOMPUTE
      - claim: The minus column equals the frozen quantity on r - 1.
        responsibility: baseline
        discharged_by: definitions.typed_costs and C-PLANT-M
      - claim: Each branch's cost and input model match Cheon 2006 Theorems 1 and 2.
        responsibility: interface
        discharged_by: change.D2_typed_costs, as read per CORR-20260923-187ea3 and RT-20260923-38bbbf; open to the J2 primary-source comparison
      - claim: No field prime is admitted as r.
        responsibility: correctness
        discharged_by: change.D1_pins.confounder_check, C-FIELD, C-FIELD-MUTATION
      - claim: No reading exceeds the typed arithmetic table.
        responsibility: scope
        discharged_by: change.D4_calibration, change.D9_labelling, interpretation_limits
    claim_ceiling_restated:
      text_kind: fresh
      tier: crypto
      exact_scope_a_run_could_support: 'On the deployed_row_roster of this contract, with the pinned r integers, certified factorizations (or stated unfactored-cofactor bounds), and two independent evaluators agreeing: the typed table of branch exponents or bounds. WHAT DOES NOT FOLLOW: any ordinary-ECDLP claim; any statement that a deployed system is weak or safe; any claim about curves not on the roster; any claim about protocols.'
      explicitly_not_supportable_under_any_outcome: Ordinary ECDLP below rho; a vulnerability in ECDSA/Ed25519/P-256/etc.; novelty of Cheon's algorithm; closure of IDEA-20260831-ccb587.
    corrective_overlays:
    - pins:
        rows_BN254-r_pinned_revision:
          adds_to: change.D1_pins.rows[BN254-r]
          item: DF-1, RI-6
          K: 9e393a79d9937f579acbdcb234a67869259d5a96
          how_K_was_resolved: At design time, by the GitHub commits API query that this contract's stated rule names (path EIPS/eip-197.md, until=2026-09-26T00:00:00Z, per_page=1). The API's until filter bounds the committer date; K's committer date, 2022-05-06T07:29:09Z, lies years before the bound, so "strictly before" and "on or before" select the same commit. K is now a stated constant of this text and is not resolved again at run time.
          raw_url: https://raw.githubusercontent.com/ethereum/EIPs/9e393a79d9937f579acbdcb234a67869259d5a96/EIPS/eip-197.md
          expected_bytes: 8727
          expected_sha256: 96355ab680ea8fae76e05c69009e30bd0ec87f352bec9312515b1cbabc6fe89d
        rows_BLS12-381-r_expected_digest:
          adds_to: change.D1_pins.rows[BLS12-381-r]
          item: RI-6
          source: the pinned-revision file named in the held rows[BLS12-381-r].source (not restated)
          expected_bytes: 175678
          expected_sha256: deb806a9ab85ec417cb523524830354829e5e44d3bee11f077d9421bc128f67a
        retrieval_digest_check:
          adds_to: change.D1_pins.retrieval_rule
          item: RI-6
          rule: After writing each retrieved pinned-revision file and before any parse, the executor compares its sha256 with the expected_sha256 stated above for that source. A mismatch is an evidence-integrity stop of the package in Stage P before any factoring (outcome I_INFRA). No row is pinned from a file that does not match, and no other revision is substituted.
        null_arm_class_consequence:
          adds_to: null_arm.bit_classes
          item: DF-1
          rule: The null-arm bit classes are the exact bit lengths of the PINNED deployed r (prior-record wording). If a deployed row is UNPINNED and no other pinned deployed r has its bit length, that bit class has no samples. The null arm is then reported with that class named as absent and the reason (the UNPINNED row it would have mirrored). An absent class is not a VOID branch, does not by itself move the outcome from S_VALID_TABLE, and is not negative about any curve.
        pdf_digit_check_weakness:
          adds_to: change.D1_pins.pdf_digit_check
          item: RI-6
          declaration: 'The check is a substring test and is kept as written, not made positional. Its weakness is declared: for a printed digit string that is short (a cofactor h of one or two digits, for example), occurrence somewhere in the normalized PDF text is near certain and the check then has almost no discriminating power. A PASS on a string shorter than 20 characters is recorded in pdf_check.json with its length and is not read as evidence that the value was checked against the PDF. The value itself stays governed by its parse rule and, where it applies, by the hasse clause of the confounder check.'
        deployed_rows_roles_and_order:
          adds_to: definitions.deployed_row
          item: RI-5
          rule: Deployed-row ids, roles and order are exactly change.D1_pins.deployed_row_roster of THIS contract, in that order. change.D1_pins.rows lists the same ten ids in the same order and carries each row's source, parse rule and cross-checks. No held specification.yaml frozen_curve_list is opened, hashed or compared at run time. A run that finds D1_pins.rows ids/order disagreeing with deployed_row_roster stops in Stage P with outcome I_TEXT.
      controls:
        C-FIELD_cases_extracted:
          adds_to: controls[C-FIELD]
          item: DF-2
          path_name: controls[C-FIELD].cases_extracted
          rule: 'For EVERY row whose field prime was extracted in Stage P (whether or not the row pinned) there is one case, id CF-X-<row id>. Its value is that extracted field prime, taken from the Stage P record and not restated in any text. It is presented to the confounder check as an r with NO printed cofactor, so the hasse clause does not apply to it. Expected reason list: exactly [field_prime]. No integer of any such case is written in this text.'
          why_the_expected_reasons_are_fixed: Each extracted field prime is proved prime at run time (change.D7_certificates); hence not_prime does not fire. Under the corrected FP each value is a member of FP, so field_prime fires. The hasse clause does not apply because no cofactor is presented.
          mutation_sensitivity: If FP omits the extracted field prime of any row, that row's case is admitted and the gate below fails with outcome N2. In particular an FP built from the two C-FIELD expression values only (reviewer mutation M-FP of DEC-20260926-96f970 DF-2) admits every case whose row's field prime is not one of those two values, and the gate fails. The design-time locator run evaluated both FP definitions against these cases (execution-transcripts.json, pin_locators.fp_and_mutation).
        C-FIELD_gates_added:
          adds_to: controls[C-FIELD].gates
          item: DF-2
          gates:
          - Each case of cases_extracted must be rejected before any factoring, and its recorded reason list under the confounder check as written must be exactly [field_prime]. Any other result is outcome N2 (success_criterion N2_CONFOUNDER_CHECK_FALSIFIED reads "a C-FIELD case", which includes these cases).
          - 'Order of evaluation: the extraction_cross_check gate of every closed-form case (outcome I_TEXT on failure) is evaluated first, then the reason-list gates of all cases, closed-form and extracted. The results of cases_extracted are written to confounder_receipt.json under their own key.'
      tools:
        certificate_and_factoring_library:
          minimum_version:
            item: DF-3
            value: cypari2 2.1.5 with its PARI library 2.15.4
            rule: Admission item (1) requires the cypari2 distribution version to be at least 2.1.5 and the PARI library version reported through it to be at least 2.15.4. cysignals has no minimum version; its version is recorded, and admission item (3) decides whether the installed cypari2 and cysignals pairing can be admitted.
          version_command:
            item: DF-3
            command: python3 -I -c "<program>" with <program> equal to corrective.tools.version_program
            parse: Standard output, split on LF with the final empty string after the last LF dropped, must be exactly three lines. Line 1 is the cypari2 distribution version and line 3 the PARI library version; each must fully match [0-9]+\.[0-9]+\.[0-9]+ . Line 2 is the cysignals distribution version, recorded as printed. A non-zero exit status, another line count or a non-matching line 1 or 3 FAILS admission item (1). Versions are compared as integer triples.
            why: No cypari2 release executed at design time defines cypari2.__version__ (execution-transcripts.json, cypari2_builds.*.typed_version_command_as_held). The distribution version comes from importlib.metadata and the PARI version from Pari.version(), whose first three entries are the PARI version integers.
          declared_builds:
            item: DF-3
            declared_minimum: cypari2 2.1.5, cysignals 1.11.4, PARI 2.15.4 (bundled), CPython 3.12
            declared_latest: cypari2 2.2.4, cysignals 1.12.6, PARI 2.17.2 (bundled), CPython 3.12
            gp_builds_probed: gp 2.15.4 and gp 2.17.4 (built from source), gp 2.17.3 (Homebrew)
            note: These are the builds on which admission items (1), (3) and (4) and the timeout recognition of change.D6_factoring.timeouts were executed at design time. Admission decides for any other build. The pairings cypari2 2.1.5 or 2.2.0 with cysignals 1.12.6 pass item (1) and FAIL item (3) (the child dies by signal), so admission refuses them as an infrastructure stop.
          stack_allocation:
            item: RI-7
            rule: 'Every cypari2 Pari instance that path A uses (factoring, primecert, primecertisvalid and high-precision evaluation) is created as cypari2.Pari(size=2**27, sizemax=2**32): an initial PARI stack of 2^27 bytes, allowed to grow to 2^32 bytes. A PARI stack overflow at that ceiling is a crash under stopping_rules, never a result.'
        version_program: import importlib.metadata as m, cypari2; p = cypari2.Pari(); print(m.version('cypari2')); print(m.version('cysignals')); print('.'.join(str(int(x)) for x in p.version()[:3]))
        version_program_sha256: 5701a5e33b9bb8e413374fbdd4715ec3fc08f442d589a7080694b4eab0709dc5
        alarm_self_test_program: "import cypari2\nfrom cysignals.signals import AlarmInterrupt\np = cypari2.Pari(size=2**27, sizemax=2**32)\nfor e in ('alarm(1, while(1, ))', 'alarm(1, factor(nextprime(2^140)*nextprime(2^141)))'):\n    try:\n        p(e)\n        print('RETURNED')\n    except AlarmInterrupt:\n        print('ALARM')\nprint(p('2+2'))\n"
        alarm_self_test_program_sha256: fb9b43c9ba30c664e436a6ef945fd0ca6a3a3196773b1be15dde8aefe6075776
        program_hash_convention: sha256 of the UTF-8 bytes of the string value as a YAML safe loader returns it (the second program ends with one LF, the first with none).
        admission_gate_items_added:
          adds_to: tools_and_admission.admission_gate
          item: RI-7
          items:
          - (9) Execution audit. The AST audit of admission item (6) also FAILS if any module under experiments/EXP-AUXIN-339fb0/implementation/typed/ calls exec, eval, compile or __import__, imports runpy, or uses importlib other than importlib.metadata. Code from any repository file outside experiments/EXP-AUXIN-339fb0/implementation/typed/ is never executed by any route, whether import, exec or loading by path.
          - (10) Environment location. The resolved sys.prefix of the admitted interpreter and the resolved file path of every installed third-party distribution module lie OUTSIDE the repository working tree. An environment inside the repository fails admission, because its modules would be both allowed (import_rule class b) and forbidden (inside the repository, outside experiments/EXP-AUXIN-339fb0/implementation/typed/).
      custody:
        run_entry_sys_path:
          adds_to: change.D8_custody.import_rule
          item: RI-7
          rule: Under python3 -I the directory of run.py is NOT on sys.path (executed at design time on CPython 3.10 and 3.12; execution-transcripts.json, isolated_mode_sys_path). run.py therefore inserts the absolute path of experiments/EXP-AUXIN-339fb0/implementation/typed/ at sys.path[0] before its first import of any module under that directory, importing only sys and os before doing so. That is the only change to sys.path the run makes, and it is recorded in import_audit.json.
        invalidation_rules_added:
          adds_to: invalidation_rules
          rules:
          - Any edit of this contract file after approval is evidence-integrity failure.
          - Held AMD path edits and incorporates.sha256 / incorporates_by_hash.sha256 comparisons are NOT invalidation rules of this contract. F-CUSTODY.independence and F-PREC forbid run-time dependence on held EXP-AUXIN-7e2e3d bytes.
          deleted_prior_rules_note: Prior overlay rules that invalidated on AMD-20260927-narrow.yaml edits or AMD-20260926-typed.yaml vs incorporates.sha256 are deleted and not carried into this contract.
      bin_by_status:
        replaces: change.D3_descriptive_bins.bin_by_status
        item: DF-6
        text: 'For every branch of every deployed row, construction control, C-BOUND state and null-arm sample, three fields are reported: bin, bin_at_least and boundary_flag, each with exactly the value given in this contract. EXACT: bin is given by definitions.bins; bin_at_least equals bin; boundary_flag is as definitions.bins defines it. BOUND: let s be the depth of the witnessed upper bound and boundary_flag the flag that definitions.bins computes on s. If boundary_flag is false and s >= 3/4 + tau, bin is NEAR_FLOOR and bin_at_least is NEAR_FLOOR (the true value is at least as deep). Otherwise bin is UNDETERMINED and bin_at_least is the bin that definitions.bins gives an EXACT value of depth s (so a witnessed depth within tau of 3/4 gives UNDETERMINED, bin_at_least INTERMEDIATE and boundary_flag true). VOID: bin, bin_at_least and boundary_flag are all null. UNPINNED rows have no branches and report none of the three. This clause and definitions.bins never give two answers, and no status
          and bin combination leaves bin_at_least undefined.'
        totality_table:
        - status: EXACT
          bin: NEAR_FLOOR
          bin_at_least: NEAR_FLOOR
        - status: EXACT
          bin: INTERMEDIATE
          bin_at_least: INTERMEDIATE
        - status: EXACT
          bin: NEAR_CEILING
          bin_at_least: NEAR_CEILING
        - status: BOUND
          bin: NEAR_FLOOR
          bin_at_least: NEAR_FLOOR
        - status: BOUND
          bin: UNDETERMINED
          bin_at_least: INTERMEDIATE or NEAR_CEILING (the EXACT bin of s)
        - status: VOID
          bin: null
          bin_at_least: null
        - status: UNPINNED
          bin: none reported
          bin_at_least: none reported
      interpretation_limits_item_6:
        replaces: interpretation_limits item 6 (the item beginning "On the two pairing-family rows")
        item: DF-5
        text: BN254-r and BLS12-381-r are reported in their own stratum (expected_structure_flag true, change.D3_descriptive_bins.stratification). No status, bin, depth or other category is predicted for them, and no value on them is read as family-caused.
        reading_of_the_held_stratification_parenthetical: The parenthetical in change.D3_descriptive_bins.stratification (the two rows "whose family polynomials force divisors, CORR-20260923-187ea3") stays incorporated. It fixes stratum MEMBERSHIP only and cites the record behind that membership. It predicts no category and licenses no family-caused reading; the item above governs how those rows are read.
        not_edited: H-AUXIN-6db354 interpretation_limits, from which the replaced sentence was imported, is not edited by this file; its correction is a later card.
      threshold_inventory_added:
        adds_to: change.D4_calibration.threshold_inventory
        item: RI-5
        constants: 'Admission timeouts: 600 seconds for the ECM self-test (item 2) and 10 seconds of wall clock for the alarm self-test child (item 3); the alarm length A = 1 second inside that self-test. Minimum tool versions: GMP-ECM 7.0.4; cypari2 2.1.5 with PARI 2.15.4; pypdf 3.0.0 (held); Python 3.10. PARI stack: initial 2^27 bytes, ceiling 2^32 bytes. The screen''s optional trial-division bound of at most 2^16 (conventions.Q0-5). PR-SEC2''s continuation minimum of 4 characters. PR-EIP197''s required match count of exactly one. The PDF short-string length 20 of corrective.pins.pdf_digit_check_weakness (a reporting label, no stop). Expected sha256 digests and byte counts of the two pinned-revision files (equality tests, no cut-off). No constant in this list reads a deployed-row or null-arm outcome, and each was fixed before any such outcome existed.'
        held_conjunction: none. The inventory is this contract's fields alone; no held AMD threshold_inventory_added completes or joins it.
      falsification_condition_mapping:
        item: RI-1
        rule: Each falsification condition of H-AUXIN-6db354 (in its listed order, FC1 to FC6) is mapped to the outcome of this protocol that decides it. None is retired. Two are demoted, with reason.
        rows:
        - fc: FC1 (a constructed control fails a gate)
          outcome: N1_INSTRUMENT_FALSIFIED
          status: kept
        - fc: FC2 (a field prime presented as r is admitted)
          outcome: N2_CONFOUNDER_CHECK_FALSIFIED
          status: demoted in part
          reason: 'The controls can present only field primes that the text or Stage P makes available: the two closed-form C-FIELD cases and every extracted field prime (cases_extracted). A field prime of a curve outside the frozen list, or one no locator extracts, cannot be presented, so FC2 is decided for the extracted set only. A deployed row whose own r equals a member of FP is invalid_measurement for that row (held invalidation rule), not N2.'
        - fc: FC3 (a reported exponent or bound below its analytic floor, or T_plus(d) < d)
          outcome: N3_FLOOR_VIOLATION
          status: kept
        - fc: FC4 (reported prime factors of an EXACT branch do not multiply back)
          outcome: N1 when the branch belongs to a construction control (its EXACT gate fails); for a deployed or null-arm branch the product check makes the branch VOID (C-PRODUCT; held invalidation rules), which gives S_PARTIAL_TABLE
          status: demoted
          reason: On a deployed or null-arm branch a product mismatch shows a defect in that branch's factorization record, not in the instrument as a whole, so this contract's stated rule voids the branch instead of falsifying the instrument. On construction controls, where the correct factorization is fixed by the recipe, it falsifies the instrument as H states.
        - fc: FC5 (a declared-state BOUND evaluator control returns a value other than the one fixed)
          outcome: N4_BOUND_EVALUATOR_FALSIFIED
          status: kept
        - fc: FC6 (a row omits either branch)
          outcome: The row is incomplete, not negative. this contract's missing-branch rule ("Report r-1 and r+1 separately; a missing branch voids the row.") makes each omitted branch VOID, which gives S_PARTIAL_TABLE; an omission caused by a crash is I_INFRA.
          status: kept (as H states it, incomplete and not negative)
      reviewer_convention_zero_runs:
        item: RI-9
        convention: At zero runs a reviewer reads each gate that needs a pipeline factorization (the blind EXACT status of a construction control, the F3 routing observation of C-PLANT-PL) as a RUN OBSERVATION. Its text is judged determinate when the expected value is fixed by the text alone (change.D5_controls.expected_status_convention); whether the pipeline attains that value is not reviewable before a run and is neither a pass nor a break of the text.
      declared_not_superseded:
      - item: RI-3 (C-PLANT-PL tolerance)
        field: controls[C-PLANT-PL].declared_properties
        declaration: The phrase giving an absolute tolerance on s is kept. The declared property is a design statement read by no gate; C-PLANT-PL's gates (plus minimiser, gap within the control gate tolerance, bin) are unaffected by it, and the conclusion it supports survives with a relative bound. Editing a construction-control field would reopen regression group R-D4, which held twice. Revisit only under F-REV in a new successor contract if C-PLANT-PL is redesigned.
      - item: RI-3 (minus-branch generator label)
        field: change.D2_typed_costs.input_models
        declaration: 'Kept as written. The split of the label into the 2010 source''s two cases cannot be written by this session, which has not read that source (a recalled reference would be a pointer only); and D2 lies in regression group R-D2D3. The typed costs, which the label annotates, are unchanged. Revisit: a later card whose producer has read the 2010 source and records it as retrieved.'
      - item: RI-4
        field: none in this file
        declaration: Addressed in the design report's route_ruling, which names the superseded cost fields and lists the extensions not named in H-AUXIN-6db354. This file carries no route ruling.
      - item: 'observation (not a DF or RI item): pypdf minimum'
        field: tools_and_admission.pdf_text_extractor.minimum_version
        declaration: Kept as written (pypdf 3.0.0). PyPI has no pypdf 3.0.0 release; the first 3.x release is 3.1.0 (execution-transcripts.json). The minimum still decides admission determinately, since every existing release compares as an integer triple, so this is not a defect and NP-2 keeps the field held.
    - c_bound_gating:
        item: DF-N1
        repairs_used: (a) span G-GATE1 and (b) spans G-BND1 and G-BND3, together; (c) is not used
        expected_value_source:
          adds_to: controls[C-BOUND]
          path_name: controls[C-BOUND].expected_value_source
          text: 'Gate 1 of controls[C-BOUND] compares each returned field with the value stated in that state''s expected block. After spans G-GATE1, G-BND1 and G-BND3, every declared state states bin, bin_at_least and boundary_flag: BND-1 and BND-3 state bin NEAR_FLOOR, bin_at_least NEAR_FLOOR, boundary_flag false; BND-2 states bin UNDETERMINED, bin_at_least NEAR_CEILING, boundary_flag false (held, unchanged). Each stated value equals the value corrective.bin_by_status of AMD-20260927-narrow.yaml gives on that state''s witnessed depth: BND-1 and BND-3 are BOUND, unflagged, with depth above 3/4 (each state''s held why_fixed_in_advance), and an unflagged depth above 3/4 is at least 3/4 + tau, so bin_by_status gives NEAR_FLOOR and bin_at_least NEAR_FLOOR; BND-2 is BOUND, unflagged, with depth below 1/100, below 1/4 - tau, so bin_by_status gives UNDETERMINED and bin_at_least NEAR_CEILING. Hence the value condition success_criterion.outcomes[N4_BOUND_EVALUATOR_FALSIFIED] reads ("the value this
            text fixes") and the value gate 1 compares with are the same value on every declared state. No C-BOUND state other than BND-1, BND-2 and BND-3 exists in a run (invalidation_rules item 6 of AMD-20260926-typed.yaml). A reviewer who constructs a further BOUND state to test the rule evaluates gate 1 on it against the values corrective.bin_by_status gives on that state''s witnessed depth, so on every BOUND state that bins NEAR_FLOOR bin_at_least is defined (NEAR_FLOOR) and gated.'
        one_outcome: 'For any evaluator correct under the combined text, and for any evaluator that departs from it on a C-BOUND state, C-BOUND gate 1 and condition N4 have exactly one outcome together: a returned field that differs from the stated value fails gate 1 on that path, stopping_rules item 10 stops the run with N4, and the N4 condition is met by the same field; a returned field equal to the stated value passes gate 1 and does not meet N4. Tabulated in outcome_table.'
        outcome_table:
        - state: BND-1 or BND-3
          evaluator: returns every expected field, bin_at_least NEAR_FLOOR
          gate_1: pass
          stopping_rules_item_10: does not fire
          N4_condition: not met
          outcome: run continues (S_VALID_TABLE or S_PARTIAL_TABLE eligible)
          same_as_under_narrow: true
        - state: BND-1 or BND-3
          evaluator: bin_at_least other than NEAR_FLOOR, every other field as expected
          gate_1: fail
          stopping_rules_item_10: fires
          N4_condition: met
          outcome: N4 only
          same_as_under_narrow: false
          under_narrow: 'gate 1 passed (bin_at_least not stated, so not checked) while the N4 condition was met: two outcomes'
        - state: BND-1 or BND-3
          evaluator: 'bin_at_least absent or null (E0 of RT-20260927-730157: correct under the typed text, silent at BOUND NEAR_FLOOR)'
          gate_1: fail
          stopping_rules_item_10: fires
          N4_condition: met
          outcome: N4 only
          same_as_under_narrow: false
          under_narrow: 'gate 1 passed while the N4 condition was met: two outcomes'
        - state: BND-2
          evaluator: returns every expected field, bin_at_least NEAR_CEILING
          gate_1: pass
          stopping_rules_item_10: does not fire
          N4_condition: not met
          outcome: run continues
          same_as_under_narrow: true
        - state: BND-2
          evaluator: bin_at_least other than NEAR_CEILING, or absent
          gate_1: fail
          stopping_rules_item_10: fires
          N4_condition: met
          outcome: N4 only
          same_as_under_narrow: true
        - state: any of the three
          evaluator: any other expected field wrong (status, witness set, witness, bin, boundary_flag)
          gate_1: fail
          stopping_rules_item_10: fires
          N4_condition: met
          outcome: N4 only
          same_as_under_narrow: true
        - state: any of the three
          evaluator: paths A and B return different bin_at_least
          gate_1: verdicts differ between paths
          stopping_rules_item_10: fires (gate fails on a path)
          N4_condition: met on the wrong path
          outcome: N4 only (definitions.gate_evaluation_mode assigns N4 for a C-BOUND gate)
          same_as_under_narrow: BND-2 yes; BND-1 and BND-3 no (under narrow gate 1 did not compare bin_at_least there)
        tested_meaning_of_N4: 'Unchanged relative to AMD-20260927-narrow.yaml: N4 tests every field of every declared state against the value the combined text fixes, and on BND-1 and BND-3 that value was already NEAR_FLOOR through corrective.bin_by_status. What changes is that gate 1, and so stopping_rules item 10, now tests the same field. The FC5 row of corrective.falsification_condition_mapping (FC5 -> N4, kept) therefore needs no change.'
      threshold_index:
        replaces: span_rules[INV-CLAIM].replacement of AMD-20260927-narrow.yaml (the text governing span INV-CLAIM of change.D4_calibration.threshold_inventory of AMD-20260926-typed.yaml)
        item: 'DF-N2 (repair: drop the completeness claim)'
        text: 'An index of numeric cut-offs and decision constants, NOT claimed complete, is this field alone in this contract (no conjunction with any held AMD threshold_inventory_added); each entry names what it reads:'
        status_of_the_index: No gate, stop, validity rule or outcome reads this index. Every cut-off and constant governs from its own clause, in the layer protocol_normative section index names for that clause, whether or not the index lists it; an omission from the index changes no outcome and is not a defect of any clause. Pre-registration of every cut-off rests on the sha256 binding of all this contract file alone before any value is seen (change.D8_custody and custody_additions below), not on the index. This file adds no numeric cut-off and no decision constant.
        completeness_claims_over_four_layers: No governing field of this contract claims a complete threshold index; F-INDEX makes the index non-normative.
      falsification_condition_mapping_fc6:
        replaces: corrective.falsification_condition_mapping.rows item 6.outcome of AMD-20260927-narrow.yaml
        item: ER-3
        fc: FC6 (a row omits either branch)
        outcome: 'The row is incomplete, not negative. This contract restates the missing-branch rule as fresh text: "Report r-1 and r+1 separately; a missing branch voids the row." No held specification.yaml clause governs. The row is void: every branch of that row, including a branch that was reported, is VOID, which gives S_PARTIAL_TABLE (span SP-VOID of AMD-20260927-narrow.yaml); an omission caused by a crash is I_INFRA (stopping_rules item 14 of AMD-20260926-typed.yaml).'
        status: kept (as H states it, incomplete and not negative)
        unchanged_rows: rows 1 to 5 (FC1 to FC5) are restated as fresh text in protocol_normative.falsification_condition_mapping of this contract; no held record is bound by content-digest
      errata_declarations:
      - item: ER-4
        adds_to: corrective.bin_by_status of AMD-20260927-narrow.yaml
        path_name: corrective.bin_by_status.confounder_rejected_candidates
        statement: 'A deployed row, null-arm sample, construction control or C-FIELD case that the confounder check rejects reports none of the three reporting fields bin, bin_at_least and boundary_flag. It has no branch: a rejected deployed row is invalid_measurement for that row and never factored, a rejected null-arm sample is kept, flagged and not factored, a rejected construction control stops the run (I_CONTROL_COLLISION) before any factoring, and a C-FIELD case is never factored. Its record is the ordered reason list of the confounder check.'
        supersedes: nothing
        why_no_outcome_changes: corrective.bin_by_status assigns the three fields per branch, and a rejected candidate has no branch under the held confounder-check text, so this statement makes explicit what this contract's stated rule already implies; no gate, stop or outcome reads the three fields of a candidate that has no branch.
      - item: ER-6
        field: change.D1_pins.confounder_check.applies_to of AMD-20260926-typed.yaml (not superseded)
        declaration: '"every construction-control integer" means each construction control''s r (the r of C-PLANT-M, C-PLANT-P, C-INERT and C-PLANT-PL), not every integer named in a recipe.'
        supersedes: nothing; a reading declaration
        reason: 'It is the only reading consistent with this contract''s stated rule: stages[C_controls].does runs the confounder check "on each constructed r"; scope_on_controls_and_null_arm fixes the expected outcome for every construction control as NOT REJECTED; and under the other reading clause (2) not_prime would reject every composite recipe integer (D = d1 * d2 of C-PLANT-M, for example), stopping every run with I_CONTROL_COLLISION. The declared reading leaves the integers FP is compared with, and the C-FIELD gates, unchanged. DEC-20260927-f680f7 Q0-3 recorded the same outcome under both readings for clause (1) at the pinned bytes.'
