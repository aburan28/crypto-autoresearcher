        field: controls[C-FIELD].cases[CF-1].extraction_cross_check and cases[CF-2].extraction_cross_check of AMD-20260926-typed.yaml (not superseded)
        declaration: '"(hex form)" is descriptive, not a requirement. The cross-check compares the case value with the field prime p that parse rule PR-SP800 extracts, in whichever representation PR-SP800 selects and records.'
        supersedes: nothing; a reading declaration
        reason: PR-SP800 governs which representation yields the value and records the one used; a second representation rule inside the cross-check would duplicate it. DEC-20260927-f680f7 Q0-4 recorded that both readings give the same run-time decision at the pinned, hash-fixed bytes.
