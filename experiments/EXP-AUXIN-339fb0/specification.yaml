        retrieval_rule: '(entry 2; DR-8.) For each PINNED REVISION source the executor, before any parse, writes the retrieved bytes to sources/<name> (eip-197.md; draft-irtf-cfrg-pairing-friendly-curves-14.txt), computes their sha256, and records URL, resolved commit (EIP-197), UTC time, HTTP status, byte count and sha256 in sources/retrieval.json. Parsing reads only the archived file. If a pinned revision cannot be retrieved (network failure, non-200 status, missing commit), that is an INFRASTRUCTURE STOP of the package before any factoring: no other revision, mirror or document is substituted and the row is never filled from memory.'
        confounder_check:
          applies_to: EVERY deployed row, before any factoring; every C-FIELD case; every construction-control integer; every null-arm integer.
          clauses_in_order: '(1) field_prime: REJECT if the candidate equals ANY member of the field-prime set FP, defined as every field prime extracted in Stage P for any row (whether or not that row pinned) together with the two C-FIELD expression values. For a deployed row this includes its own extracted field prime. (2) not_prime: REJECT unless the candidate is proved prime under change.D7_certificates. (3) hasse: applies only to a deployed row or C-FIELD case whose source prints a cofactor h; REJECT unless |p + 1 - h*r| <= 2*isqrt(p) + 2, where p and h are that row''s extracted field prime and cofactor and r is the candidate.'
          evaluation_and_recording: (entry 4.) All applicable clauses are evaluated, in the order above, on every candidate; evaluation never stops at the first reason. The result is the ordered list of reasons that fired, written to confounder_receipt.json per candidate, together with the verdict of each clause. The candidate is REJECTED if and only if the list is non-empty. A rejected deployed row is invalid_measurement for that row and is never factored.
          scope_on_controls_and_null_arm: '(conventions.Q0-3.) For construction controls and null-arm integers there is no "same curve": clause (1) compares against the whole set FP, clause (2) applies, and clause (3) does not apply because no source prints a cofactor for them. The expected outcome for every construction control is NOT REJECTED (no reason). If a construction control is rejected, the run stops with outcome I_CONTROL_COLLISION (never N1, never a result), because a constructed control that equals an extracted field prime is a defect of this text''s recipes. A rejected null-arm sample is kept, flagged and not factored.'
          tested_by: controls C-FIELD and C-FIELD-MUTATION, in Stage P, before any row is pinned.
