        rule: 'Every deployed r is pinned AT RUN TIME, in Stage P, from the named primary-source file, by the parse rule named for that file below. For each row the executor records in orders.json: the source file path, the sha256 of the source file''s bytes, the first and last line numbers (definitions.line_numbering) of every value span it read, the verbatim bytes of those lines, the representation used (hex, decimal or expression), the parsed r in decimal and hex, and the result of every cross-check. No r is taken from code, from research/equation-schemes-20260905/parsed_safecurves.json, from any earlier run, from any review report or from memory.'
        staged_source_binding: 'Before any parse, the executor computes the sha256 of each staged file it reads and compares it with the value this file states. A mismatch is an evidence-integrity stop; no row is pinned from a file that does not match. The values are those recorded in inputs/SAFECURVES-20260825/source_record.yaml and are restated in this contract: inputs/SAFECURVES-20260825/specs/sp800-186.txt = 286001ea961ad675593bf67ca6ef4097c781f841fed3c2d52ae18ae2e73db2a2; inputs/SAFECURVES-20260825/specs/sp800-186.pdf = 53c7cf3340528aaa0a7bbeaef947f2099568192367d4341a7d4abceb55f78432; inputs/SAFECURVES-20260825/specs/sec2-v2.txt = 579265ec54e2ed9d77ec85929da3cc130d2997f6acb2ccada17dfa812af1daeb; inputs/SAFECURVES-20260825/specs/sec2-v2.pdf = 87b8f3703364ed5b21ba8582e411cc0cbf477bcaa3f4f45e0d6580d1c00d9952; inputs/SAFECURVES-20260825/specs/rfc5639.txt = d19949766009ac82b69e46b09f3a08d712908381300a340d3fa3b1478f4b215e; inputs/SAFECURVES-20260825/specs/rfc7748.txt = 279ca0ecc5e92e2962e27b846986aeb74729d9dd34bd4a04a362f80dcb596ad3.'
        parse_rules:
          PR-SP800: '(NIST SP 800-186, derived text inputs/SAFECURVES-20260825/specs/sp800-186.txt.) BLOCK: from the first line whose stripped content equals the section number given for the row (for example "3.2.1.3.") to, exclusive, the next line whose stripped content matches the regular expression ^[0-9]+(\.[0-9]+)*\.$ . LABEL LINE for label L (L is p, h or n): the first line in the block whose content, after removing leading whitespace-set characters, begins with the two characters "L:". SPAN: from the character after "L:" to, exclusive, the earlier of (a) the first "(" character after "L:" and (b) the start of the next line in the block whose stripped content matches ^[A-Za-z]{1,4}: . DECIMAL FORM: the span with the whitespace set and backslashes removed; it is CLEAN if it is non-empty and consists of decimal digits only, otherwise CONTAMINATED (for example a printed expression whose superscripts or minus signs were lost, or interleaved page text) and it is then ignored and recorded
            as contaminated. HEX FORM: exists only if case (a) ended the span and, after that "(" and with the whitespace set removed, the next three characters are "=0x"; it runs from after "=0x" to, exclusive, the first ")" after it; with the whitespace set removed it is CLEAN if non-empty and hex digits only, otherwise CONTAMINATED and ignored. VALUE: if the hex form is clean, the value is its base-16 integer V. The decimal form is then compared only if it is clean AND has exactly as many digits as the decimal expansion of V: in that case it must equal V, else locator_failure. A clean decimal form with a different digit count is a printed expression whose operators were lost in the derived text (for example an exponent expression printed without its superscript and minus sign); it is recorded as decimal_span_not_a_literal and ignored. If the hex form is absent or contaminated and the decimal form is clean, the value is the decimal integer. If neither is clean, locator_failure. Which representation
            was used, and every ignored span with its reason, is recorded.'
          PR-SEC2: '(SEC 2 v2.0, derived text inputs/SAFECURVES-20260825/specs/sec2-v2.txt, whose inter-word spaces are lost.) BLOCK for curve C: from the first line whose content with the whitespace set removed matches ^[0-9]+(\.[0-9]+)+RecommendedParameters<C>$ to, exclusive, the next line whose content contains "RecommendedParameters". LABEL LINE for label L (p, n or h): the first line in the block whose stripped content equals L exactly AND whose next non-empty line begins, after leading whitespace, with "=". VALUE LINES: the characters after that "=" on its line (if any remain after whitespace removal) form the first value line; otherwise the first value line is the next non-empty line. The first value line must consist of hex digits only after whitespace removal. Each following line is a continuation if, after whitespace removal, it consists of hex digits only and has at least 4 characters; the first line that is not a continuation ends the value. VALUE: the base-16 integer of the
            concatenated value lines. Any failure is locator_failure.'
          PR-RFC5639: '(RFC 5639, inputs/SAFECURVES-20260825/specs/rfc5639.txt, the RFC text itself.) BLOCK for curve C: from the first line whose stripped content equals "Curve-ID: C" to, exclusive, the next line whose stripped content begins with "Curve-ID:" or "#Twisted" or matches ^[0-9]+(\.[0-9]+)*\.\s . LABEL LINE for label L (p, q or h): the first line in the block whose stripped content begins with "L =" or equals "L =". VALUE: the characters after "=" on that line plus each following line whose stripped content is non-empty and consists of hex digits only; the first empty or non-hex line ends the value. The concatenation, with the whitespace set removed, is read in base 16. Any failure is locator_failure.'
          PR-RFC7748: (RFC 7748, inputs/SAFECURVES-20260825/specs/rfc7748.txt.) In section 4.1 (from the line whose stripped content is "4.1.  Curve25519" to the next line matching ^[0-9]+(\.[0-9]+)*\.\s ), the LABEL LINE for label L (order or p) is the first line whose stripped content begins with L followed by at least one whitespace-set character. Its remainder is an EXPRESSION of exactly one of the forms "2^E + 0xH" or "2^E - S", with E and S decimal and H hex, whitespace ignored; it is evaluated in exact integers. Any other form is locator_failure.
          PR-IETF-DRAFT: '(Archived IETF Internet-Draft text.) BLOCK: from the first line whose stripped content matches ^[0-9]+(\.[0-9]+)*\.\s.*\(BLS12-381\)$ to, exclusive, the next line matching ^[0-9]+(\.[0-9]+)*\.\s . LABEL LINE for label L (p, r, h or t): the first line in the block whose stripped content, after removing one leading "*" and whitespace if present, matches ^L\s*[:=] . VALUE TEXT: the remainder of that line after the first ":" or "=", plus each following line whose stripped content is non-empty and consists only of hex digits, decimal digits, "0x", "x", "^", "+", "-" and whitespace; the first empty line or other line ends it. Whitespace removed, the value text is read as: a hex literal if it matches ^-?0x[0-9A-Fa-f]+$; a decimal literal if it matches ^-?[0-9]+$; a signed sum of powers of two if it matches ^-?2\^[0-9]+([+-]2\^[0-9]+)*$ (evaluated in exact integers). Anything else is locator_failure.'
          PR-EIP197: (EIP-197 markdown source at a pinned commit, archived as sources/eip-197.md; plain text, so no HTML conversion is involved.) r is the decimal integer captured by the FIRST match in the file of the regular expression prime order q\s*=\s*([0-9]+) . The field modulus p is the decimal integer captured by the FIRST match of (?<![A-Za-z0-9_])p\s*=\s*([0-9]+) . No match is locator_failure.
        pdf_digit_check: '(entry 3.) Every row, cross-source or C-FIELD comparison that reads a derived .txt file (sp800-186.txt or sec2-v2.txt) is digit-checked against the authoritative PDF named in inputs/SAFECURVES-20260825/source_record.yaml (sp800-186.pdf, sec2-v2.pdf), whose sha256 is bound above. PROCEDURE: extract the text of every page of the PDF with pypdf (tools_and_admission) as "\n".join(page.extract_text() for page in PdfReader(path).pages); remove the whitespace set and backslashes; lowercase. Take the value''s digit string exactly as the .txt span printed it (the clean hex or clean decimal form used, whitespace and backslashes removed, leading zeros as printed), lowercased. The check PASSES if and only if that string occurs as a contiguous substring of the normalized PDF text. A FAIL makes the row UNPINNED with reason pdf_digit_mismatch (or, for a cross-source, a cross-source failure). The extracted normalized text is archived as sources/<pdf-name>.normalized.txt with its
          sha256, and every verdict is written to pdf_check.json.'
        locator_failure: If a parse rule returns locator_failure, a cross-check fails, or two named sources for one row disagree, the row is UNPINNED. It is reported with the failure text, never dropped and never filled from another source. UNPINNED is not a negative result.
