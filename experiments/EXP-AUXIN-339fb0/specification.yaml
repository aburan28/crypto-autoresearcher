  protocol_normative:
    definitions:
      integer_functions: isqrt(n) is the largest integer x with x*x <= n. icbrt(n) is the largest integer x with x*x*x <= n. ceildiv(a, b) is the least integer c with c*b >= a, for positive a and b. All arithmetic in recipes is exact integer arithmetic. No floating point is used in any recipe.
      prime: '"prime" means prime in the mathematical sense. A search accepts a candidate only if every integer its acceptance rule names is prime. OPERATIONAL SCREEN: the Baillie-PSW test, defined as a strong probable-prime test to base 2 followed by a strong Lucas probable-prime test with Selfridge method A parameters (D is the first of 5, -7, 9, -11, 13, ... with Jacobi symbol (D/n) = -1; P = 1; Q = (1 - D)/4). Trial division by small primes may precede it; that cannot change which candidate is first accepted (conventions.Q0-5). PROOF: every accepted integer is then proved prime by a certificate under change.D7_certificates. If a candidate passes the screen but its certificate run proves it composite, it is NOT accepted, the search continues from the next candidate, and the event is recorded. If the certificate run fails without proving compositeness, that is an infrastructure stop, never a skip.'
      nextprime: nextprime_ge(x) is the least prime p with p >= x. nextprime_gt(x) is the least prime p with p > x. Each is searched upward by steps of +1 over the integers from its argument (even integers other than 2 may be skipped, since they are never prime; skipping never changes the result and never changes the count of conventions.Q0-4).
      control_size: 'B = 256. M0 = 3 * 2^(B-2). Every integer within 2^(B-3) of M0 has exactly B bits. For the large control C-PLANT-PL: B_L = 521 and M_L = 3 * 2^(B_L-2); every integer within 2^(B_L-3) of M_L has exactly B_L bits.'
      frozen_constants: factoring_seconds_per_integer = 3600 seconds, the frozen value of specification.yaml inputs.parameters.factoring_seconds_per_integer, restated in this contract so that no budget is defined by reference. rho_baseline = 0.5, the frozen value of specification.yaml inputs.parameters.rho_baseline.
      typed_costs: 'For a prime r and a branch b in {minus, plus}, let m_minus = r - 1 and m_plus = r + 1. For a positive divisor d of m_b: T_minus(d) = sqrt(m_minus / d) + sqrt(d)   (Cheon 2006 Theorem 1 leading expression); T_plus(d)  = sqrt(m_plus / d) + d          (Cheon 2006 Theorem 2 leading expression; Theorem 2, not the 2006 abstract). e_b(d) = log2(T_b(d)) / log2(r). Admissible d is every positive divisor of m_b, including 1 and m_b. The two branches are never combined: no quantity in this amendment is a minimum over both branches.'
      analytic_floors_and_ceiling: F_minus(r) = (1 + log2(r - 1)/4) / log2(r), the exact minimum over real x > 0 of log2(sqrt(m_minus/x) + sqrt(x)) / log2(r). F_plus(r) = (log2(3) - 2/3 + log2(r + 1)/3) / log2(r), the exact minimum over real x > 0 of log2(sqrt(m_plus/x) + x) / log2(r), attained at x = (m_plus/4)^(1/3), called the T_plus optimum. C_b(r) = log2(sqrt(m_b) + 1) / log2(r), the value at d = 1 on either branch.
      depth: For a REPORTED BRANCH VALUE e on branch b (an EXACT branch minimum or a BOUND witnessed upper bound), depth s = (C_b(r) - e) / (C_b(r) - F_b(r)). Because d = 1 is a candidate in every divisor set and every witness set, and F_b is the real minimum, every reported branch value satisfies F_b(r) <= e <= C_b(r) mathematically, so s lies in [0, 1]. A single e_b(d) at an arbitrary d need not lie in that range and is never binned. s near 1 means a divisor near the branch's analytic optimum; s near 0 means none.
      bins: 'Descriptive bins of a reported branch value with depth s, using declared constants only. Let tau = 10^-45, an ABSOLUTE tolerance on s (conventions.Q0-8). boundary_flag is true if |s - 1/4| <= tau or |s - 3/4| <= tau, else false. For an EXACT value: NEAR_FLOOR if s >= 3/4 + tau; NEAR_CEILING if s <= 1/4 - tau; a flagged value takes the bin on its lower-depth side (s within tau of 3/4 gives INTERMEDIATE; s within tau of 1/4 gives NEAR_CEILING); INTERMEDIATE otherwise. For a BOUND value see change.D3_descriptive_bins.bin_by_status. Bins carry no stop, escalate, naming or decision semantics (change.D4_calibration).'
      minimiser_and_ties: 'The branch minimum e* is the least e_b(d) over the explicit divisor set of the row status (change.D3_descriptive_bins). TIE RULE, relative in the exponent e (conventions.Q0-7): a divisor d is tied if e_b(d) - e* <= 10^-100 * e*. The reported minimiser is the SMALLEST tied divisor. On the minus branch d and m_minus/d always tie exactly, so the smaller member of that pair is reported.'
      precision: Every logarithm, square root and cube root is evaluated with at least 150 significant decimal digits. Path A and path B must agree on every reported exponent and bound within 10^-50 absolute, and exactly on status, minimiser, witness, bin, bin_at_least and boundary_flag (change.D7_certificates, independent recompute).
      gate_evaluation_mode: (conventions.Q0-9.) Every gate inequality is evaluated numerically at the precision floor above, on path A and on path B separately. A lower gate of the form "0 <= e - F" is evaluated as e - F >= -10^-45, the same slack as change.D2_typed_costs.floor_invariant. An upper gate of the form "e - F <= c" is evaluated as e - F <= c with no slack. A gate holds only if it holds on both paths; if the two paths return different verdicts on any gate, the run stops with outcome N1 for a construction control, N2 for a C-FIELD gate, or N4 for a C-BOUND gate, because the instrument is then not determinate at its own precision.
      whitespace_set: For every parsing rule in this file, the whitespace set is the characters U+0009, U+000A, U+000B, U+000C, U+000D, U+0020, U+0085 and U+00A0. A backslash U+005C inside a value span is a line-continuation mark and is removed together with the whitespace set. Hex digits are 0-9, a-f and A-F. Decimal digits are 0-9.
      line_numbering: (DEC-20260923-a4c3d5 undischarged_defects entry 1, choice C5.) Every file is read as bytes and decoded as strict UTF-8 (a decoding failure is an infrastructure stop). Lines are delimited by LF (U+000A) ONLY. The line number of a character is 1 plus the number of LF characters before it. CR, NEL, form feed and every other character are line content. A "line" below is the text between two consecutive LF characters (or the file start or end). "Stripped content" means the line with every character of the whitespace set removed from both ends.
      deployed_row: A row whose role in change.D1_pins.deployed_row_roster of THIS contract is deployed or deployed_pairing. The label is that roster's role name only. No held specification.yaml list is read at run time.
      deployed_row_roster_note: Ids, roles and order of deployed rows are exactly change.D1_pins.deployed_row_roster in this contract file. That roster is the sole authority.
    change:
