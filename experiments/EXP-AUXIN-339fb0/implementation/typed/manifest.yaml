# Implementation manifest for EXP-AUXIN-339fb0 typed/ tree.
# Launch-wiring update: TASK-20260930-6d25ea under DEC-20260930-224fc1 /
# DEC-20260930-25e287. Packaging archive BATCH-d0b34e remains immutable history.
#
# scientific_execution_authorized: true (DEC-20260930-224fc1)
# packaging_only: false
# maximum_runs: 1 (match specification tools_and_admission / budget)
# runs_launched: 0 (wiring does not mint RUN-*)

manifest:
  schema: crypto.autoresearch.implementation_manifest.v1
  experiment_id: EXP-AUXIN-339fb0
  hypothesis_id: H-AUXIN-6db354
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-bed104
  packaging_batch: BATCH-d0b34e
  packaging_task: TASK-20260930-e9f8bf
  wiring_task: TASK-20260930-6d25ea
  authorization_decision: DEC-20260930-224fc1
  wiring_decision: DEC-20260930-25e287
  implementation_tree: experiments/EXP-AUXIN-339fb0/implementation/typed/
  successor_contract_sha256: 6a1dca32c109d5badf4ba143c31f9d4d9a49e18ae287c8bb4fc604526bf02ecc
  specification: experiments/EXP-AUXIN-339fb0/specification.yaml
  scientific_execution_authorized: true
  runs_launched: 0
  maximum_runs: 1
  packaging_only: false

  entry_point:
    command_prefix: python3 -I experiments/EXP-AUXIN-339fb0/implementation/typed/run.py
    default_mode: --packaging-check
    run_mode: >-
      --run loads trial-plan; refuses if scientific_execution_authorized is
      false or packaging_only is true; otherwise runs admission_gate_check()
      (Stage A0 dry probes) without minting RUN-* or scoring census rows.
    sys_path_rule: >-
      run.py inserts the absolute typed/ path at sys.path[0] after importing
      only sys and os (corrective.custody.run_entry_sys_path).

  modules:
    - path: run.py
      role: entry_point
    - path: cert_verify.py
      role: independent_verifier
      dependencies: Python standard library only
    - path: e_eval.py
      role: typed_cost_evaluator
      dependencies: Python standard library only
    - path: factor_path_a.py
      role: factoring_and_certificate_production_path_A
      dependencies:
        - cypari2 (lazy import; class b)
        - cysignals (lazy import; class b)
        - GMP-ECM external binary ecm (subprocess; not a Python import)
    - path: factor_path_b.py
      role: independent_recompute_path_B
      dependencies: Python standard library only; local cert_verify, e_eval
    - path: import_audit.py
      role: AST_import_and_execution_audit
      dependencies: Python standard library only
    - path: trial-plan.json
      role: custody_trial_plan
    - path: manifest.yaml
      role: implementation_manifest

  third_party_distributions:
    # Versions below are declared minima from the contract; live versions are
    # recorded at scientific launch admission.
    - name: cypari2
      minimum_distribution: 2.1.5
      minimum_pari_library: 2.15.4
      use: F2 factoring, ECPP certificates, Pratt inputs, path A high-precision evaluation
      import_class: b
    - name: cysignals
      minimum_distribution: null
      note: version recorded at admission; AlarmInterrupt for F2 timeouts
      import_class: b
    - name: pypdf
      minimum_version: 3.0.0
      use: change.D1_pins.pdf_digit_check only
      import_class: b
    - name: GMP-ECM
      minimum_version: 7.0.4
      kind: external_binary
      command: ecm
      use: stage F3 of change.D6_factoring

  excluded_for_verdicts:
    - sympy

  import_rule: F-J1-7
  path_b_stdlib_only: true
  cert_verify_stdlib_only: true
  amazon_bedrock: not selected, not configured, not probed, not contacted, not used

  inference:
    requested_policy: executor-implementation
    wiring_task: TASK-20260930-6d25ea
    packaging_task: TASK-20260930-e9f8bf
    note: >-
      Launch-wiring producer; --run stops after admission_gate dry check.
      Live tool versions and dirty_summary remain for an authorized scientific
      launch that mints a RUN-* directory (not this task).

  launch_fields_deferred_to_authorized_scientific_run:
    - dirty_summary
    - launch_commit
    - implementation_snapshot_task
    - implementation_snapshot_commit
    - live_tool_versions
    - admission_receipt.json under experiments/.../runs/RUN-*
