experiment:
  id: EXP-VOLC-6120a9
  hypothesis_id: H-VOLC-0e303a
  derived_from_idea: IDEA-20260807-3c6bd8
  question_id: RQ-VOLC-f6253b
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The price of knowing your level, audited in three parts - mass agreement of the factorization-free
    height shortcut against a brute-force factoring oracle over at least 10^5 pairs, an exhaustive Hasse
    bit-length check, a measured walk-cost regression in ell and h, and an explicit
    cost-versus-invisibility verdict per ell regime with every cryptographic-scale number labelled ARGUED
    rather than measured
  objective: >-
    The one uncertainty a run reduces is WHICH obstruction this lane is allowed to name in any subsequent
    closure. A run establishes (i) whether v_ell(c) = floor(v_ell(t^2 - 4p)/2) agrees with a brute-force
    factorization on at least 10^5 random toy pairs at every odd ell, and whether the ell = 2 case split
    is necessary and sufficient - reporting the naive formula's error rate at ell = 2 as a separate
    number; (ii) whether the Hasse bit-length bound holds on 100 percent of instances, which is the entire
    basis of the correction this audit proposes to a standing cost framing in this program; (iii) the
    measured wall-time ratio between the shortcut and full factorization as a function of log p, and
    whether that ratio widens; (iv) the measured isogeny count for level determination, regressed against
    ell and h with confidence intervals, against a predicted O(ell h^2); and (v) a stated crossover ell*
    with its budget and an explicit sentence naming which obstruction applies below and above it. The
    audit produces no attack and improves no published algorithm, and every cryptographic-scale number it
    reports is ARGUED from bit lengths rather than extrapolated from a toy timing.
  what_this_is_not:
  - >-
    Not an attack, not an algorithm, not an improvement to any published endomorphism-ring computation, and
    not a claim that the endomorphism ring is easy - the third component says the opposite for large ell.
  - >-
    Not a claim that volcano depth matters or does not matter. It prices the acquisition of level
    information; whether that information is useful is a different question and is explicitly the other
    horn of the verdict this audit produces.
  - >-
    Not an extrapolation of toy Python factoring timings to cryptographic sizes. That would be meaningless,
    and any sentence mixing a measured toy timing with a cryptographic-scale conclusion is a declared defect
    of the run.
  - >-
    Not a contradiction of the record whose cost framing it audits. That record's density measurement and
    its hardness null stand independently; only the inference from "p-sized" to "hard at deployed sizes" is
    disputed, and it is disputed with an arithmetic check rather than from memory.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has been
    executed under this contract.
  claim_ceiling:
    tier: toy_measurement_plus_argued_bit_length_statements
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - over the executed pool, the height shortcut agreed or disagreed with a
      factorization oracle at a stated rate per ell; the Hasse bit-length bound held at a stated rate; the
      shortcut was a stated factor faster than factorization at the largest tested p with a stated trend; the
      isogeny count for level determination regressed on ell and h with stated exponents and intervals over
      ell in {2, 3, 5, 7, 11, 13}; and a crossover ell* was stated at a declared budget. WHAT DOES NOT FOLLOW
      - no measured statement about any cryptographic-size discriminant, since none is factored here; no
      improvement to any published algorithm; and no statement about whether level information is useful, which
      is the other horn of the verdict and is not measured.
  inputs:
    procedure: >-
      STAGE 0, zero compute - verify the public factoring-record figures against a primary source and record a
      literature note; and read the two published endomorphism-ring algorithm papers beyond their abstracts and
      record what they actually claim about the bottleneck. Both may fail; a failure is infrastructure signal
      and the remaining stages run regardless, with the bottleneck attribution recorded as UNVERIFIED.
      STAGE 1, minutes - implement v_ell(c) = floor(v_ell(D)/2) for odd ell and the ell = 2 case split, and
      mass-check it against full factorization of D on at least 10^5 random toy (p, t) pairs at every ell in
      the set, requiring exact agreement per cell. At ell = 2, run the check BOTH with and without the case
      split and report both agreement rates.
      STAGE 2, minutes - the Hasse bit-length check on 100 percent of the instance pool, comparing the bit
      length of D against that of p.
      STAGE 3, hours - the factoring-time ladder. Measure the wall time of the shortcut and of full
      factorization of D across a ladder of p from 2^16 to the largest feasible, and report the ratio as a
      function of log p. Then state the cryptographic-scale conclusion as an ARGUMENT from the Hasse bound and
      the public factoring record, explicitly NOT as an extrapolation of the measured timings, and label every
      number ARGUED or MEASURED in the same sentence in which it appears.
      STAGE 4, hours - the walk-cost measurement. For ell in {2, 3, 5, 7, 11, 13}, measure isogeny computations
      and wall time to determine v_ell(f_E) by descent, as a function of ell and of the volcano height h. Fit
      the exponents in ell and h with confidence intervals and report them rather than assuming the model.
      STAGE 5, zero compute - combine into the crossover. Report the largest ell for which the level is
      obtainable within a stated budget, compare it against the largest ell that can divide the conductor, and
      state per ell regime whether the obstruction is cost or invisibility, so that no later closure in this
      lane may name the wrong one.
    instrument: >-
      Pure integer arithmetic for the height, the case split and the Hasse check. A factorization backend for
      the brute-force oracle null, whose timings speak only about this toy pipeline and are labelled as such.
      ell-isogeny construction and descent for the walk measurement, with an instrumented counter of isogeny
      computations separate from wall time. Point counting to obtain t is charged SEPARATELY and reported on its
      own line, since at toy scale it is the dominant cost of the whole audit and hiding it inside the walk cost
      would misattribute the price. Recorded through harness/runner.py.
    parameters: >-
      ell in {2, 3, 5, 7, 11, 13}. At least 10^5 random toy (p, t) pairs for the height mass-check. A p ladder
      from 2^16 to the largest feasible in pure Python, with the top reported rather than assumed. A walk pool
      selected for volcano height at least 1, with the selection rate reported. Fitted-exponent acceptance bands
      [0.7, 1.5] in ell and [1.5, 2.5] in h. Random and CM-constructed instance pools reported SEPARATELY, since
      CM-constructed curves have artificially small fundamental discriminant and hence large conductor and are
      unrepresentative of random curves. Reporting is by LARGEST PRIME FACTOR of the conductor throughout.
  controls:
  - >-
    N1 BRUTE-FORCE ORACLE NULL, blocking - the formula-based v_ell(c) is checked against full factorization of D
    on every toy instance. The cheap method must agree with the expensive method on 100 percent of cells, or the
    cheapness is illusory.
  - >-
    N2 RANDOM-INTEGER NULL, WITH ITS DIRECTION LEFT OPEN BY THIS CONTRACT - run the identical shortcut on random
    integers of the same bit length that are NOT of the form t^2 - 4p. The parent proposal asserts the formula
    must FAIL there, on the grounds that a random integer's squarefree part is unconstrained. The Coordinator
    flags that this may be wrong for odd ell - if the comparison is against the SQUAREFREE-PART decomposition
    rather than the fundamental-discriminant decomposition, the identity plausibly holds for every integer, and
    N2 as written would be a check that must PASS. The contract therefore pre-registers BOTH readings, requires
    the odd-ell agreement rate on random integers to be REPORTED WITHOUT A FORCED DIRECTION, and carries the
    forced disagreement only at ell = 2, where the fundamental-discriminant 2-adic convention has no counterpart
    for a random integer. Whichever way it lands is informative - a passing N2 at odd ell means the shortcut uses
    no discriminant structure at all, which sharpens rather than weakens the audit.
  - >-
    N3 SUPERSINGULAR NULL - supersingular curves over F_p have trace 0 and discriminant -4p, so the conductor is
    essentially trivial and there is no volcano in the ordinary sense. The pipeline must report the degenerate
    structure rather than inventing levels.
  - >-
    ell = 2 CASE-SPLIT CONTROL, can fail - the ell = 2 arm is run BOTH with and without the case split, and both
    agreement rates are reported. The rate WITHOUT the split measures how often the naive formula would silently
    mislabel a 2-volcano, which is a number this program does not have.
  - >-
    NEARBY-OBJECT CONTROL, the method MUST fail there - a class where the conductor is a single large prime.
    There is then no small-ell structure at all and the cheap route must give nothing. A cost model claiming
    cheapness for that class would have proved too much and is void.
  - >-
    BASELINE FIXTURE at ell = 2 and ell = 3 - a curve with known 2- and 3-volcano structure, level determined by
    hand, cost measured. Exact agreement of the level and measured cost within a factor 2 of the model are
    required before the cost model's extrapolation in ell is credited at all.
  - >-
    MEASURED-VERSUS-ARGUED LABELLING, checked as a property of the output - every cryptographic-scale number is
    labelled ARGUED and every toy number MEASURED, in the same sentence in which it appears. A run mixing them is
    invalid regardless of its values.
  - >-
    POOL SEPARATION - random and CM-constructed instance pools are reported separately, since CM-constructed
    curves have artificially small fundamental discriminant and hence large conductor and would bias every
    selection rate and every walk cost.
  independent_variables:
  - the prime ell
  - the bit length of p
  - the volcano height h
  - instance family - random ordinary, CM-constructed, supersingular, conductor a single large prime, random integers of matched bit length
  - at ell = 2, whether the case split is applied
  metrics:
    primary:
    - >-
      shortcut_agreement_rate(ell) - the fraction of the at-least-10^5 toy pairs where floor(v_ell(D)/2) equals
      the factorization-derived v_ell(c), dimensionless, per ell. FORCED 1.00 for odd ell; FORCED 1.00 at ell = 2
      only WITH the case split.
    - >-
      naive_formula_error_rate_at_2 - the disagreement rate at ell = 2 WITHOUT the case split, dimensionless.
      Reported, not predicted; it measures how often a 2-volcano would be silently mislabelled.
    - >-
      hasse_bitlength_pass_rate - the fraction of instances where the bit length of D exceeds that of p by at most
      2, dimensionless. FORCED 1.00.
    - >-
      shortcut_speed_ratio(log p) - wall time of full factorization divided by wall time of the shortcut,
      dimensionless, per ladder point, MEASURED. Predicted at least 100 at the largest tested p and WIDENING with p.
    - >-
      isogeny_count_for_level(ell, h) - the instrumented number of isogeny computations to determine v_ell(f_E),
      an integer, per (ell, h), with the fitted exponents in ell and in h and their confidence intervals.
    - >-
      crossover_ell_star - the largest ell for which the level is obtainable within the stated budget, an integer,
      reported with the budget it assumes and compared against the largest ell that can divide the conductor.
    - >-
      obstruction_verdict_per_regime - the explicit sentence naming cost or invisibility below and above
      crossover_ell_star.
    secondary:
    - >-
      N2 odd-ell agreement rate on random integers of matched bit length, dimensionless, REPORTED WITHOUT A FORCED
      DIRECTION, and the ell = 2 rate on the same pool, where disagreement IS forced.
    - >-
      N3 supersingular pool - the reported structure, which must be degenerate rather than a fabricated level.
    - >-
      the nearby-object class with conductor a single large prime - what the cheap route returns, which must be
      nothing useful.
    - >-
      point-counting cost to obtain t, on its own line, since at toy scale it dominates the whole audit and must
      not be folded into the walk cost.
    - >-
      largest prime factor of the conductor per instance, since feasibility is governed by it rather than by the
      conductor's size.
    - >-
      selection rate for the walk pool, i.e. the fraction of candidates with volcano height at least 1, and the
      random-versus-CM pool split.
    - >-
      the baseline fixture's level and measured cost at ell = 2 and ell = 3 against the hand-computed values.
    - >-
      the Stage 0 outcomes - the verified factoring-record figures or a recorded failed fetch, and what the two
      published papers say about the bottleneck or a recorded failure to read them.
  heuristic_under_test: HEUR-VOLC-0E3-1
  preregistered_prediction:
    quantity: >-
      shortcut_agreement_rate per ell; hasse_bitlength_pass_rate; shortcut_speed_ratio at the largest tested p; and
      the fitted exponents of isogeny_count_for_level in ell and h.
    formula: >-
      shortcut_agreement_rate = 1.00 for every odd ell, from v_ell(D) = 2 v_ell(c) + v_ell(D_K) with
      v_ell(D_K) in {0, 1}; and 1.00 at ell = 2 only with the case split, since v_2(D_K) lies in {0, 2, 3}.
      hasse_bitlength_pass_rate = 1.00, from |t^2 - 4p| = 4p - t^2 <= 4p. shortcut_speed_ratio at least 100 at the
      largest tested p and widening, since the shortcut is O(log^2 p) while factorization is superpolynomial. The
      fitted exponent of isogeny_count_for_level in ell is predicted near 1 and in h near 2, accepted inside
      [0.7, 1.5] and [1.5, 2.5] respectively. Under the null that the walk is not the bottleneck, the fitted ell
      exponent would be materially below 1 and the crossover would move up.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-3c6bd8, parts (A) through (D) and its predictions block,
      before any run under this contract exists. The public factoring-record figures the argument leans on are
      RECALLED and unverified in this corpus; Stage 0 verifies them, and the conclusion is stated so as to be robust
      to substantial error in them. Never tuned to data.
  scale_relevance:
    tier: toy_measurement_with_argued_transfer
    justification: >-
      Every MEASUREMENT here is toy - the height mass-check, the Hasse check, the factoring ladder and the walk cost
      all run at sizes where a pure-Python pipeline completes. The one statement that concerns cryptographic scale -
      that a 258-bit discriminant is routine to factor - is an ARGUMENT FROM BIT LENGTH plus a public record, and it
      is explicitly not an extrapolation of the measured timings, whose backend is not representative of any serious
      factoring implementation. The contract makes that separation a checked property of the output rather than a
      stylistic preference, because merging the two is the exact error the audit exists to correct in someone else's
      cost framing and committing it here would be self-refuting.
    correspondence: >-
      The height shortcut's correctness is uniform in p - it is a valuation identity with no scale-dependent step -
      so the toy mass-check tests the claim in full. The walk-cost model is NOT uniform in ell, and the tested ell
      set stops at 13 while the conductor may carry primes of 100 bits or more; the crossover is therefore an
      extrapolation of a fitted exponent and is labelled as one, with its acceptance bands stated in advance.
  tail_checks:
  - >-
    Report the instances with the LARGEST v_ell(D) at each ell, since those are where a case-split error would show
    first and where the shortcut has the most to get wrong.
  - >-
    Report the walk-cost fit recomputed with the largest ell removed, since with six ell values one point can carry
    the exponent.
  - >-
    Report the distribution of the largest prime factor of the conductor across both pools, not only its mean,
    because feasibility is governed by the tail and a 265-bit prime conductor and a 265-bit smooth one are entirely
    different objects.
  - >-
    Report the selection rate for the walk pool at each p, since at small p most volcanoes have height 0 and a low
    rate means the walk measurement has no signal rather than a small effect.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6.0
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - >-
    HALT the height claim if shortcut_agreement_rate is below 1.00 at any odd ell. The identity is false as
    implemented and nothing downstream of it may be reported.
  - >-
    HALT the cost-framing correction if hasse_bitlength_pass_rate is below 1.00. The bound is being misapplied.
  - >-
    Report the walk measurement as CENSORED, with no fitted exponent and no crossover, if the selection rate leaves
    too few instances with volcano height at least 1. A censored measurement is a stop, not a negative.
  - >-
    Stop at the declared ell set, the declared ladder and the declared acceptance bands. No ell is added and no band
    is widened after a fit is seen.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative
    result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative mathematical
    evidence (AGENTS.md rule 5). A failed Stage 0 fetch or an unread paper is likewise infrastructure, and the
    bottleneck attribution is then recorded as UNVERIFIED rather than asserted.
  - >-
    A run that states any cryptographic-scale conclusion by extrapolating a measured toy factoring timing is
    completed_invalid. This is the single specific error the audit exists to correct elsewhere.
  - >-
    A run whose output does not label every number ARGUED or MEASURED in the sentence in which it appears is
    completed_invalid.
  - >-
    A run pooling random and CM-constructed instances into one reported rate is invalid_measurement, since
    CM-constructed curves have artificially large conductors and would bias every selection rate.
  - >-
    A run reporting the walk cost with the point-counting cost folded into it is invalid_measurement, because at
    toy scale point counting dominates and the attribution would be wrong.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new contract; it
    is never a repair of this one.
  success_criterion: >-
    The audit succeeds when ALL of the following hold, each decidable from the primary metrics -
    (1) shortcut_agreement_rate is 1.00 at every odd ell against the brute-force oracle over at least 10^5 pairs;
    (2) shortcut_agreement_rate at ell = 2 is 1.00 WITH the case split, and naive_formula_error_rate_at_2 is reported;
    (3) hasse_bitlength_pass_rate is 1.00;
    (4) shortcut_speed_ratio is at least 100 at the largest tested p and widens with p;
    (5) isogeny_count_for_level is fitted with exponents inside [0.7, 1.5] in ell and [1.5, 2.5] in h, with intervals,
    OR the walk measurement is declared CENSORED with its selection rate;
    (6) the baseline fixture reproduces the hand-computed level exactly at ell = 2 and 3 with cost within a factor 2;
    (7) the nearby-object class with a single large prime conductor is shown to gain NOTHING from the cheap route;
    (8) crossover_ell_star and obstruction_verdict_per_regime are stated with the budget they assume;
    (9) every cryptographic-scale number is labelled ARGUED and every toy number MEASURED.
  falsification_criterion:
  - >-
    Any odd-ell disagreement between the shortcut and the factorization oracle. The height claim is FALSE as
    implemented; the record is superseded and the "the height is free" component is withdrawn.
  - >-
    hasse_bitlength_pass_rate below 1.00. The Hasse bound is misapplied and the correction to the standing cost
    framing collapses entirely.
  - >-
    A fitted exponent outside its declared band. HEUR-VOLC-0E3-1 is falsified, the crossover moves, and the "small
    ell is cheap" conclusion narrows to whatever the measured exponents support. The narrower range is what gets
    reported, never the original claim.
  - >-
    shortcut_speed_ratio failing to widen with p. The shortcut is not asymptotically cheaper in practice and the
    claim is overstated at the tested range.
  - >-
    Reading the published algorithms and finding the bottleneck attributed elsewhere. HEUR-VOLC-0E3-2 is falsified
    and the third component is rewritten around what the papers say. This is a likely and welcome outcome and costs
    no compute.
  - >-
    The cheap route returning something useful on the single-large-prime-conductor class. The cost model PROVES TOO
    MUCH and is void.
  - >-
    The baseline fixture failing to reproduce the hand-computed level, or exceeding the modelled cost by more than a
    factor 2. The cost model is not credited and no extrapolation in ell may be reported.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying every per-instance (p, t, D, v_ell(D), shortcut v_ell(c), oracle v_ell(c)) tuple, not summaries
  - the ell = 2 arm run both with and without the case split, with both agreement rates
  - the N2 random-integer arm's odd-ell and ell = 2 agreement rates, reported without a forced direction at odd ell
  - the N3 supersingular arm and the single-large-prime-conductor nearby object, each in its own labelled section
  - the baseline fixture at ell = 2 and 3 with the hand-computed level and the measured cost
  - the walk-cost measurements with the point-counting cost on its own separate line
  - the fitted exponents with confidence intervals, and the fit recomputed with the largest ell removed
  - the assembled price list with every number labelled ARGUED or MEASURED, the stated crossover and its budget, and the obstruction verdict per regime
  - the Stage 0 outcomes - verified factoring-record figures or a recorded failed fetch, and what the two published papers claim about the bottleneck or a recorded failure to read them
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT approved; approved_by
    is null and execution_authorized is false. Approval is the user's gate because it authorizes execution and spends
    compute.
  - >-
    This audit proposes a CORRECTION to another committed record's cost framing. Approval should confirm that the
    correction will be recorded as a new superseding record naming the exact clause, never as an edit of that record,
    and that its density measurement and hardness null are explicitly left standing.
  - >-
    Stage 0's reading of the two published algorithms can falsify the third component for free and is the cheapest
    decisive action in the package. Approval should sequence it FIRST, and should state what happens if it cannot be
    performed in this environment - the bottleneck attribution is then UNVERIFIED and the verdict must say so.
  - >-
    The N2 null's direction is disputed by this contract (see derivation_gaps). Approval should settle whether the
    odd-ell agreement rate on random integers is expected to pass or fail, or should accept the contract's
    both-readings-pre-registered treatment, because a null whose expected direction is decided after the measurement
    is not a null.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-3c6bd8
    authored_at: '2026-08-25'
    note: >-
      The three-part price list, the valuation identity and its ell = 2 case split, the Hasse bit-length observation,
      the O(ell h^2) walk model with its acceptance bands, the three named nulls, the baseline fixture at ell = 2 and
      3, the single-large-prime-conductor nearby object and the cost-versus-invisibility verdict are taken from the
      parent proposal's claim, proof_search_map, null_object_control and minimal_test, restated as measurable
      quantities with units. The measured-versus-argued labelling is promoted from the proposal's confounders and
      assumptions into a checked property of the output, because the audit's own credibility depends on not
      committing the error it identifies. Budgets follow the parent's declared low implementation and low compute,
      raised for the walk measurement and the mass check.
  derivation_gaps:
  - >-
    N2 AS WRITTEN MAY BE BACKWARDS AND THIS CONTRACT DOES NOT RESOLVE IT. The parent proposal requires the shortcut
    to FAIL on random integers of matched bit length, arguing that a random integer's squarefree part is
    unconstrained. But for ANY integer n written as c^2 m with m squarefree, v_ell(m) lies in {0, 1} at odd ell, so
    v_ell(c) = floor(v_ell(n)/2) appears to hold generically - which would make N2 at odd ell a check that must PASS,
    and would mean the odd-ell shortcut uses no discriminant structure at all. The contract pre-registers both
    readings and forces a direction only at ell = 2. This must be settled before approval; a null whose expected
    direction is chosen after the measurement is not a null, and the proposal's own falsification list contains the
    unresolved version.
  - >-
    The bottleneck attribution to the large-ell walk is the least certain component, rests on abstract-level corpus
    entries flagged as relayed without independent verification, and is resolvable for free by reading. If Stage 0
    cannot be performed in this environment, the third component remains an UNVERIFIED attribution and the verdict
    must carry that label.
  - >-
    The public factoring-record figures supporting "258 bits is far below the record" are RECALLED and unverified.
    The conclusion is stated so as to be robust to substantial error in them, but the figures themselves are not
    evidence until Stage 0 verifies them, and no verified transcription exists in this corpus today.
  - >-
    The crossover is an extrapolation of a fitted exponent from ell in {2, ..., 13} to ell values that may have 100
    bits. That is a large extrapolation from six points, it is labelled as one, and its acceptance bands do not make
    it safe - they only make it falsifiable at the measured end.
  - >-
    Small-p degeneracy is a real threat to the walk measurement - at p near 2^16 most volcanoes have height 0 and
    there is no signal. The contract requires the selection rate to be reported and permits a CENSORED verdict, but
    it does not guarantee a usable pool, and a censored walk measurement removes the crossover and hence the audit's
    headline deliverable.
