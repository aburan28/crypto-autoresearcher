experiment:
  id: EXP-EQIC-e0a2e9
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-4d7e8e
  question_id: RQ-EQIC-8cb959
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'A ZERO-COST STRUCTURAL THEOREM FOR THE LANE: on a j = 0 curve the on-curve condition for
    an x-coordinate depends only on the mu_3-INVARIANT u = x^3, so the entire universe of usable x-coordinates
    is already a disjoint union of complete phi-orbits and requiring a factor base to be phi-stable
    costs NOTHING in availability -- with an exact orbit count, a decisive seconds-long test against
    committed harness code, and the a != 0 curve as the object on which the statement must fail'
  status: draft
  objective: "(A) THE THEOREM. Let p > 3 with p = 1 mod 3, let zeta be a primitive cube root of unity\
    \ in F_p, and let E : y^2 = x^3 + b over F_p with b != 0 (so j = 0, a = 0). Write X_E = {x in\
    \ F_p : x is the x-coordinate of an F_p-rational point of E} and phi(x, y) = (zeta x, y). Then:\n\
    \  (i)  x lies in X_E if and only if x^3 + b is a square in F_p (zero\n       counted as a square).\n\
    \  (ii) The condition in (i) depends on x ONLY through u = x^3. Hence X_E is\n       stable under\
    \ x -> zeta x: X_E is mu_3-stable.\n  (iii) For x != 0 the orbit {x, zeta x, zeta^2 x} has exactly\
    \ three\n       distinct elements, and either all three lie in X_E or none does.\n  (iv) X_E \\\
    \ {0} is therefore a DISJOINT UNION OF COMPLETE mu_3-ORBITS, and\n       the number of orbits\
    \ is exactly\n         #{u in F_p^* : u is a cube and u + b is a square},\n       where the cubes\
    \ form the subgroup of index 3 in F_p^*, of order\n       (p-1)/3. The point x = 0 is a fixed\
    \ point of the action and lies in\n       X_E iff b is a square; it is the unique degenerate orbit.\n\
    \  (v)  CONSEQUENCE, WHICH IS THE POINT. Requiring a factor base V to be a\n       union of phi-orbits\
    \ imposes NO restriction on which points are\n       available: every usable nonzero x-coordinate\
    \ already sits in a\n       complete orbit. The density penalty from the phi-stability constraint\n\
    \       is exactly ZERO, and the only bookkeeping cost is rounding |V| to a\n       multiple of\
    \ 3 and excluding the single fixed point x = 0.\nPROOF of (i): standard -- x is an x-coordinate\
    \ of a rational point iff the right-hand side is a square. Of (ii): x^3 + b is literally a function\
    \ of x^3. Of (iii): (zeta^i x)^3 = x^3 so all three share the same u, and the three are distinct\
    \ because zeta has order 3 and x != 0. Of (iv): x -> x^3 is a 3-to-1 group homomorphism F_p^*\
    \ -> F_p^* with image the cubes and kernel mu_3, so the orbits are exactly the fibres. Of (v):\
    \ immediate from (iv). The whole proof is four lines and requires no heuristic.\n(B) THE BICONDITIONAL,\
    \ WHICH IS WHAT MAKES IT TESTABLE. For a generic curve y^2 = x^3 + a x + b with a != 0, the on-curve\
    \ condition x^3 + a x + b in QR is NOT a function of x^3, and no scalar action x -> c x with c\
    \ != 1 preserves X_E in general. So statement (ii) -- and with it the whole zero-penalty conclusion\
    \ -- holds IF AND ONLY IF a = 0. The a != 0 curve is therefore the exact nearby object on which\
    \ the conclusion must fail, and it is free to construct.\n(C) THE DECISIVE TEST, AND IT RUNS AGAINST\
    \ COMMITTED CODE IN SECONDS. harness/endomorphism_la.py::_build_phi_invariant_factor_base draws\
    \ a candidate x, forms the orbit [x, zeta*x, zeta^2*x], and REJECTS the orbit unless E.lift_x(ox)\
    \ is not None for ALL THREE members. Under the theorem, that three-fold test is logically equivalent\
    \ to the single test on one member, so its acceptance rate must be the acceptance rate of ONE\
    \ lift_x test, namely about 1/2. If on-curve-ness were independent across the orbit -- the naive\
    \ expectation, and what the code's structure implicitly guards against -- the acceptance rate\
    \ would be about 1/8. MEASURING THAT RATE IS THE ENTIRE MINIMAL TEST: about 0.5 confirms the theorem,\
    \ about 0.125 refutes it, and there is no third region. This is the cheapest decisive experiment\
    \ in lane L4.\n(D) WHAT THE THEOREM BUYS AND WHAT IT DOES NOT. IT BUYS: the removal of an assumption.\
    \ Every phi-stable-factor-base argument in this lane has to assume or measure that constraining\
    \ V to orbits does not cost decomposition density; on j = 0 curves that assumption is now a four-line\
    \ consequence of the curve equation rather than an empirical hope, and it holds exactly, not approximately.\
    \ Combined with the scalar-action closure (IDEA-20260807-5dfe4a) it pins the entire phi-stable\
    \ factor-base effect at matched cardinality to the single constant r = 3 in the unknown count,\
    \ with no residual uncertainty about availability. IT DOES NOT BUY: any change of exponent, any\
    \ change of the per-search success probability (which depends on |V| and arity only), or any new\
    \ relation. THE RELATION ARITHMETIC IS UNCHANGED BY THIS THEOREM: a phi-stable V of cardinality\
    \ 3m built from m complete orbits has m unknowns; each successful decomposition search yields\
    \ exactly ONE independent equation over those m unknowns with coefficients in {+-1, +-lambda,\
    \ +-lambda^2}; the phi-images of that relation are lambda-multiples and add rank 0. The theorem\
    \ says only that the m orbits were free to choose."
  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: 'R1: the statement is about x-coordinates as FIELD ELEMENTS and about the
    quadratic and cubic residue structure of F_p; a generic-group simulator has no access to residuosity
    and cannot decide whether an opaque handle''s x-coordinate is a cube, so nothing here is simulable
    in the sense of KN-FIND-b7e091. R2: the theorem is a statement about the curve EQUATION and holds
    if and only if a = 0, which is the sharpest possible demonstration that the resource consumed
    is the equation and not the group. phi is never applied to a point of G to gain information; indeed
    the theorem is about the x-line, where the group structure plays no role at all.'
  reachability_gate: 'NOT APPLICABLE TO THE DESIGN: the theorem is proved on paper and checked by
    enumeration on constructed curves; nothing walks an isogeny class, so T5 does not bind and no
    reachability cost is incurred. BINDING ON THE SCOPE: T4 does apply -- j = 0 requires D_0 = -3,
    which is fixed by the isogeny class, so the family on which the theorem holds is not reachable
    from a class that lacks it at any price. The a != 0 null curve and the j = 1728 near-collision
    curve are likewise CONSTRUCTED (choose a = 0 or b = 0), at zero reachability cost, and the record
    must not be read as implying that a target curve could be moved into this family.'
  inputs:
    procedure: 'THE CHEAPEST VALID DISCRIMINATOR IS THE ACCEPTANCE-RATE MEASUREMENT AND IT COSTS SECONDS.
      Instrument the committed _build_phi_invariant_factor_base''s three-member lift test on one existing
      12-bit j = 0 instance, draw 10000 candidates, and report the histogram of (0, 1, 2, 3) on-curve
      members per orbit. The theorem predicts the histogram is supported on {0, 3} alone with the
      3-bucket at about 0.5; the naive alternative predicts a binomial(3, 1/2) shape with the 1- and
      2-buckets at 0.375 each. There is no overlap between the two predictions and the test discriminates
      them completely. THEN, minutes: STEP 1''s exhaustive verification for every p = 1 mod 3 below
      2000 and a sample of b, which is a complete proof at those p rather than a sample. THEN, minutes:
      the same histogram on a matched a != 0 curve (the null). THEN, minutes: STEP 3''s Omega computation
      and its comparison against enumeration.'
    mechanism: "STEP 1 -- STATE AND CHECK THE THEOREM EXHAUSTIVELY AT SMALL p. For every prime p =\
      \ 1 mod 3 with p < 2000 and every b != 0 in a sampled set, enumerate all x in F_p, compute X_E\
      \ by direct residue testing, and verify by exact set comparison that zeta * X_E = X_E, that\
      \ X_E \\ {0} partitions into fibres of x -> x^3 of size exactly 3, and that the orbit count\
      \ equals #{u cube : u + b square}. This is a complete verification, not a sample: at p < 2000\
      \ the whole set is enumerable. A single counterexample refutes the theorem.\nSTEP 2 -- THE COMMITTED-CODE\
      \ TEST OF CLAIM (C). Instrument (without modifying) the acceptance logic of harness/endomorphism_la.py::_build_phi_invariant_factor_base:\
      \ count, over at least 10000 candidate draws per instance, how often all three orbit members\
      \ lift and how often exactly one or two do. The theorem predicts the \"exactly one\" and \"\
      exactly two\" counts are IDENTICALLY ZERO and the all-three rate is about 1/2. Any nonzero mixed\
      \ count is either a refutation of the theorem or a bug in lift_x, and STEP 1 distinguishes the\
      \ two.\nSTEP 3 -- THE EXACT ORBIT COUNT, AND WHAT IT BOUNDS. Compute\n  Omega(p, b) = #{u in\
      \ F_p^* : u^{(p-1)/3} = 1 and (u+b)^{(p-1)/2} in {0,1}}\ndirectly for the instance, and compare\
      \ with |X_E \\ {0}| / 3 computed by enumeration. Equality is a second independent check of claim\
      \ (iv). Omega is the exact number of orbits available, hence the exact ceiling on m for a phi-stable\
      \ base, and it must be reported alongside any |V| = 3m so that the lane can never accidentally\
      \ request more orbits than exist.\nSTEP 4 -- THE MATCHED NULL. Repeat STEP 1 and STEP 2 verbatim\
      \ on curves with a != 0 at the same p. There the mixed counts must be NONZERO and the orbit\
      \ partition must fail -- and measuring exactly how often it fails quantifies what the a = 0\
      \ structure is worth. Predicted mixed-count rate on a generic curve if on-curve-ness were independent\
      \ across the \"orbit\": 3/8 for exactly one, 3/8 for exactly two.\nSTEP 5 -- THE CONSEQUENCE,\
      \ RECORDED WITHOUT OVERREACH. Write the resulting statement as: \"on j = 0 curves the phi-stability\
      \ constraint costs zero factor-base availability, so at matched cardinality the phi-stable and\
      \ random bases draw from universes of the same density; combined with IDEA-20260807-5dfe4a the\
      \ entire effect is the constant r = 3 in the unknown count.\" Do not write anything stronger,\
      \ and specifically do not write anything about hit-rate ratios measured in any prior experiment."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched a != 0 curve, same p, identical pipeline (blocking)
  - j = 1728 curve with p = 1 mod 4 under the x -> -x action, the predicted near-collision
  - planted mixed orbit (anti-null): the mixed counter must fire
  - exhaustive enumeration at p < 2000, which is a verification and not a sample
  - x = 0 explicitly excluded and its exclusion recorded
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED. MATCHED NULL: the a != 0 curve at the
    same p, with the identical pipeline, where claim (B) says the orbit structure must FAIL. The measured
    quantity is the mixed-count rate (orbits with exactly one or exactly two on-curve members): predicted
    IDENTICALLY ZERO at a = 0 and substantially nonzero at a != 0. A pipeline that reports zero mixed
    counts on BOTH is not testing anything -- most likely it is silently rejecting on a different
    criterion -- and the line halts. DECAY PARAMETER: this record''s decay parameter is not epsilon
    but the CURVE COEFFICIENT a itself, ranging over a = 0 and a set of nonzero values sampled across
    the residue classes of F_p. The signal (zero mixed counts) must be present at a = 0 and absent
    at every a != 0 tested; unlike a continuous decay this is an on/off structure, which is stated
    plainly rather than dressed as a gradient. The continuous decay parameter that DOES apply to any
    downstream use of the theorem is epsilon, the orbit-breaking fraction of IDEA-20260807-b42544,
    and it is inherited rather than restated. ANTI-NULL (planted failure): artificially corrupt one
    orbit member''s on-curve status in the instrumentation and confirm the mixed counter fires. A
    counter that cannot count a planted mixed orbit cannot certify their absence.'
  independent_variables: []
  metrics:
    primary:
    - histogram of on-curve members per candidate orbit, per curve, per p
    - acceptance rate of the three-member test, duplicates excluded
    - Omega(p, b) and |X_E \ {0}| / 3, as exact integers
    - orbit-enumeration cost in field operations, both methods
    secondary:
    - the exhaustive-check verdict at every p < 2000 tested
    - any counterexample recorded verbatim with its (p, b, x)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: mixed-orbit count (candidate orbits with exactly one or exactly two on-curve members)
      on a j = 0 curve
    formula: 'EXACTLY ZERO, over at least 10000 candidate draws per instance and at every instance.
      Zero tolerance: a single mixed orbit refutes claim (ii) or exposes a lift_x bug, and STEP 1''s
      exhaustive check adjudicates which.'
    source: pre-registered in IDEA-20260807-4d7e8e before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - lift_x SEMANTICS. harness/toycurve.py's lift_x returns None when the right-hand side is a non-residue,
    which is what the theorem's condition (i) requires -- but its treatment of the case x^3 + b =
    0 (a 2-torsion point, y = 0) must be checked, because a lift_x that rejects y = 0 would produce
    a spurious mixed orbit exactly at the orbit u = -b when -b is a cube.
  - DUPLICATE REJECTION. The committed builder also rejects an orbit if any member is already in xs.
    Those rejections must be separated from lift rejections before the acceptance rate is computed,
    or the measured rate is depressed for a reason unrelated to the theorem.
  - x = 0. The unique fixed point; including it makes the orbit partition false and breaks f_V(x)
    = g(x^3). Excluded by assumption and checked.
  - NON-UNIFORM CANDIDATE DRAWS. _seed_int-derived candidates are deterministic; if the draws correlate
    with cubic residuosity the acceptance rate is biased. The mitigation is to draw candidates directly
    as cubes u and take any cube root, which also makes the u-line enumeration natural.
  - j = 1728 FALSE ANALOGY. The x -> -x action preserves X_E only when -1 is a square (p = 1 mod 4);
    assuming the analogy without the residue condition would produce a wrong prediction for r = 2
    and is flagged in advance.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'EXACTLY ZERO, over at least 10000 candidate draws per instance and at every
    instance. Zero tolerance: a single mixed orbit refutes claim (ii) or exposes a lift_x bug, and
    STEP 1''s exhaustive check adjudicates which.'
  falsification_criterion:
  - A single mixed orbit is found on a j = 0 curve and the exhaustive check confirms it is not a lift_x
    bug. Claim (ii) is false, the theorem is wrong, and the record is superseded. This is a hard,
    cheap, unambiguous falsifier.
  - The acceptance rate lands near 0.125 rather than 0.50. Same disposition.
  - The a != 0 null also shows zero mixed orbits across a range of a. The observable does not identify
    the a = 0 structure; the biconditional in claim (B) is wrong as stated; and the near-collision
    analysis in the proof_search_map becomes the main finding.
  - Omega computed on the u-line disagrees with enumeration. An arithmetic or implementation error;
    nothing is reported until it is resolved.
  - The exhaustive check cannot be completed within budget at the declared p range. A BUDGET outcome
    under AGENTS.md rule 5, not evidence about the theorem.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-4d7e8e
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
