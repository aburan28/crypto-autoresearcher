        digest_A is SHA-256 of the exact ASCII grammar bytes displayed below.
        digest_B is SHA-256 of registered fixture output bytes concatenated in
        ascending semantic-key order; a domain with no fixture hashes the empty
        byte string.
      mutation: >-
        digest_A is SHA-256 of the complete pre-mutation object bytes and
        digest_B is SHA-256 of the complete resulting object bytes.
      aggregate_and_stage: >-
        digest_A and digest_B are SHA-256 of the exact ASCII operation and
        logical-I/O equation strings displayed below, with no LF, NUL, or
        trailing byte.
      unused: ordinals_23_through_31_are_exactly_128_zero_bytes
    equation_string_grammar:
      alphabet: printable_ASCII_without_space_quote_backslash_or_control
      form: 'ASCII(row_name)||"|"||ASCII(category)||"|"||term*(";"||term)||";total="||decimal'
      term: 'ASCII(field_name)||"="||decimal'
      field_name_regex: '[A-Za-z0-9_]+'
      decimal: '0 or [1-9][0-9]*; no sign, leading zero, point, exponent, or separator'
      term_order: exactly_the_displayed_order_in_aggregate_and_stage_digest_input_ascii
      delimiters: 'literal vertical bar, semicolon, and equals bytes only'
      newline_policy: no_CR_no_LF_no_NUL_no_trailing_byte
      reconstruction_rule: >-
        The displayed strings are the complete digest inputs; the grammar is
        a parser constraint and never permits reordered or omitted terms.
