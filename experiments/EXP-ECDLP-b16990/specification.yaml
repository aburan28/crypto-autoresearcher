  interval_and_order_contract:
    no_representative_rule: >-
      A fitted gamma or gap is the closed rational interval encoded by its two
      directed endpoints. No midpoint, interval center, approximate root,
      floating value, randomly selected point, or implementation-selected
      representative exists or may enter a comparison, sort, endpoint, metric,
      digest, or validity decision.
    canonical_gamma_conversion: >-
      If a directed beta endpoint is the exact dyadic b/2^q with
      128<=q<=1024, its gamma endpoint numerator on the common denominator is
      3*b*2^(1024-q)+2^1024. The lower beta endpoint maps to the lower gamma
      endpoint and the upper maps to the upper; no rounding occurs.
    exact_interval_subtraction: >-
      For diffuse interval [Ld,Ud] and concentrated interval [Lc,Uc], the
      diffuse-minus-concentrated gap is [Ld-Uc,Ud-Lc] on the same denominator.
      Integer subtraction is unbounded before range-checking signed i1088.
    i1088_range_gate: >-
      Each numerator must lie in [-2^1087,2^1087-1]. Overflow or an inverted
      interval is invalidity, never saturation or wraparound.
    refinement_schedule:
      rounds: '[0..14]'
      working_precision_bits: 'p_r=384+64*r'
      target_dyadic_bits: 'q_r=128+64*r'
      maximum_working_precision_bits: 1280
      maximum_target_dyadic_bits: 1024
      initial_source: FITREC03_Q63.128_directed_beta_box_width_below_2^-120
      per_comparison_rule: >-
        Compare current directed intervals. If they overlap and their exact
        expression-identity bytes differ, refine only source fits needed by
        that comparison to the next q_r, in ascending FITREC03 ordinal, cache
        the narrower boxes, recompute every dependent gamma and eta-zero gap,
        and retry. A source fit is refined at most once per round globally.
      finite_termination: >-
        A comparison returns less, greater, or exact_equal, or after round 14
        returns GAP_ORDER_UNRESOLVED and invalidates. Thus every invocation
        terminates after at most 15 comparisons and 14 refinements per source.
      nonconvergence: >-
        An interval-Newton failure, nonunique stationary box, invalid theta
        domain, width failure, range failure, or unresolved comparison is
        apparatus invalidity. It is not mathematical or ECDLP evidence.
    exact_identity_and_ties:
      gamma_expression_identity: >-
        ASCII(GAMID03)||u8(arm)||i8(eta)||five_u32be_success_counts. Equality
        is certified only when these complete bytes are identical.
      gap_expression_identity: >-
        ASCII(GAPID03)||diffuse_gamma_expression_identity||concentrated_gamma_expression_identity.
      tie_rule: >-
        exact_equal is permitted only for byte-identical expression identities.
        Within an exact tie group, ascending draw ordinal supplies the total
        serialization order but is not a numeric representative. Equal or
        overlapping endpoints without identity equality are unresolved and
        invalidate at the terminal refinement round.
    total_sort_network:
      topology: Batcher_bitonic_network
      real_inputs: 8191
      padded_inputs: 8192
      sentinel: exact_positive_infinity_not_serialized
      comparator_count_per_sort: 372736
      comparator_equation: '8192*13*14/4=372736'
      per_arm_eta_sorts: 6
      per_arm_comparator_count: 2236416
      gap_sorts: 1
      gap_comparator_count: 372736
      compare_exchange_order: ascending_network_layer_then_wire_pair
      post_sort_gate: >-
        Check all 8190 adjacent real pairs in each of seven outputs with the
        same comparator; 7*8190=57330 checks. Any inversion, unresolved pair,
        or illegal equality invalidates.
    endpoint_selection:
      interval_type: Type-1_deterministic_order_statistic
      sample_size: 8191
      lower_one_based_rank: 41
      upper_one_based_rank: 8151
      per_arm_eta_endpoint_records: 12
      gap_endpoint_records: 2
      selection_rule: >-
        Copy the complete selected 384-byte value semantics into an endpoint
        record, set kind and one_based_selected_rank, bind the selected source
        record ordinal and SHA-256, and preserve both directed numerators.
        Endpoint selection never chooses a scalar inside an interval.
    concrete_nonproduction_interval_fixtures:
      fixture_only_flag: '0x800b'
