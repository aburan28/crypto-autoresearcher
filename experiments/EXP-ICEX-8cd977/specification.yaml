experiment:
  id: EXP-ICEX-8cd977
  hypothesis_id: H-ICEX-f1109f
  version: 1
  title: >-
    Target-shift overlap fingerprint - exhaustive candidate-fiber entropy against
    blinded same-shape nulls, a curve-free Z/N null, and a planted-period control
  status: draft
  objective: >-
    Measure the exhaustive candidate-list exponent u = log_N |C(R)| of a public
    target-shift factor-base overlap fingerprint against a matched same-shape
    null, at a comparison cell whose NULL exponent is verified non-degenerate
    before the structured arm runs. Report conditional min-entropy in bits,
    exact fiber recall, decay under predicate randomisation, and the online
    versus exhaustive work split as two disjoint budgets. No decoder is built and
    no ECDLP claim is made.
  inputs:
    subgroup_bit_sizes: [12, 14, 16, 18, 20, 22, 24]
    factor_base_densities: [low, medium, high, exact values frozen at approval]
    offset_set_sizes: [1, 2, 4, 8, 16, 32]
    targets_per_completed_cell: 200
    blinding: R + [t]P with t drawn after F and A are frozen
  controls:
  - >-
    CALIBRATION PASS C0, BLOCKING AND RUN FIRST. The NULL arm alone is run across
    the offset-size ladder at every completed size. The comparison cell is frozen
    as the largest |A| whose null median u lies in [0.10, 0.90]. RATIONALE,
    PRE-STATED - at large |A| the fingerprint becomes injective in both arms,
    u = 0 in both, and the discriminator is identically zero over the declared
    range, so no alternative hypothesis could move it. If no |A| yields an
    interior null median, the run terminates as design-infeasible and reports
    that, rather than reporting a zero difference as a negative result.
  - >-
    NAMED NULL N1, SAME-SHAPE MATCHED SUBSET. A random negation-symmetric subset
    matched on cardinality, x-coordinate bucket counts, membership representation
    and membership-probe cost.
  - >-
    NAMED NULL N2, CURVE-FREE Z/N ARM, MANDATORY. The identical pipeline run in
    Z/N with F replaced by a subset of Z/N of matched size, and additionally with
    a non-curve structured predicate (the quadratic-residue subset of F_p mapped
    into Z/N) of matched size. CONSEQUENCE PRE-STATED - if the curve-free object
    reproduces the candidate-exponent gap, nothing from this experiment may be
    quoted as a statement about elliptic curves or the ECDLP; the finding is
    about additive structure in a finite abelian group.
  - >-
    NAMED CONTROL N3, PLANTED-PERIOD POSITIVE, DEFECT OF KNOWN SIZE. A factor
    base built as a union of cosets of a public arithmetic progression of period
    d in the scalar index, so that the fingerprint determines k mod d exactly and
    |C(R)| = N / d by construction. Predicted magnitude, binding - u equal to
    1 - log_N(d) within 0.02. Run at d = N^{1/4}, N^{1/2}, N^{3/4}, giving
    predicted u of 0.75, 0.50 and 0.25. The three-point ladder is the
    demonstrated dynamic range; a control returning a number without matching
    these three values is not accepted.
  - >-
    NAMED CONTROL N4, BLINDED TRANSLATION. Targets are blinded by R + [t]P with t
    drawn after F and A are frozen; t is used only to score the true scalar after
    the fingerprint is computed.
  - >-
    NAMED CONTROL N5, DECAY LADDER. The coordinate predicate is replaced by
    independently resampled membership bits at 0, 25, 50, 75 and 100 percent,
    preserving size and negation symmetry. Non-decay is an artifact verdict.
  - >-
    NAMED CONTROL N6, COORDINATE GAUGE. The same instances under an isomorphic
    curve model, to detect an encoding-specific signal.
  independent_variables: [subgroup_bit_size, factor_base_density, offset_set_size, predicate_replacement_fraction]
  metrics:
    primary:
    - target_weighted_median_candidate_exponent_u_dimensionless
    - conditional_min_entropy_reduction_versus_null_in_bits
    - exhaustive_fiber_recall_dimensionless
    secondary:
    - overlap_vector_and_coordinate_wise_count_distribution
    - worst_case_candidate_exponent_and_collision_multiplicity
    - homometric_bucket_census
    - online_group_operations_and_membership_probes_per_target
    - exhaustive_measurement_group_operations_reported_separately
    - artifact_bytes
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: >-
      The target-weighted median of u = log_N |C(R)| over 200 blinded targets, at
      the calibrated comparison cell, minus the same median computed on the
      matched same-shape null.
    formula: >-
      median_u_structured <= median_u_null - 0.05 on each of the three largest
      completed sizes, with the null median itself inside [0.10, 0.90].
    source: >-
      H-ICEX-f1109f, prediction 1. The 0.05 threshold is stated in units of
      log_N, so a gap of 0.05 at N = 2^24 corresponds to a candidate-list ratio
      of N^{0.05} = 2^{1.2} = 2.3x.
  scale_relevance:
    tier: toy
    justification: >-
      Subgroups of 12 to 24 bits, chosen so that exhaustive scalar enumeration is
      affordable and the candidate fiber is EXACT rather than estimated.
      Exhaustive enumeration is a measurement oracle and is charged separately;
      it is never part of any claimed online cost. No extrapolation to
      cryptographic size is offered.
    correspondence: null
  tail_checks:
  - >-
    The single target with the LARGEST fiber and the single target with the
    SMALLEST fiber are reported per cell with their fingerprints, so a
    median-level gap is not quoted without its extremes.
  - >-
    The largest homometric bucket at every size is reported with its
    multiplicity, since a large bucket is the signature that the fingerprint is
    non-injective in a way a decoder would inherit.
  replication:
    seeds: [1, 2, 3, 4, 5]
    independent_instances: 21
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 12
    maximum_runs: 120
  stopping_rules:
  - >-
    Aggregate enumerated toy scalars capped at 2^27; a cell that would exceed it
    is reported unreached, never estimated.
  - >-
    Aggregate membership probes capped at 1e9; artifacts capped at 20 GB.
  - >-
    Stop a lane when the two largest completed sizes exclude the 0.05 effect in
    the wrong direction with a 95 percent target-blinded interval.
  invalidation_rules:
  - >-
    Exhaustive fiber recall below 1.000000 on any completed target invalidates
    the run.
  - >-
    A fingerprint coordinate computed with any access to the hidden scalar, a
    source label, or a target-specific table invalidates the run.
  - >-
    Reuse of an offset set or a blinding value across the calibration pass and
    the test arm invalidates the affected cells.
  - >-
    A reported gap taken at a cell whose null median u is outside [0.10, 0.90] is
    invalid_measurement, because the discriminator is degenerate there.
  - >-
    Online and exhaustive work reported in a single combined figure is
    invalid_measurement; the two budgets are disjoint by contract.
  success_criterion: >-
    At the calibrated comparison cell, the target-weighted median u is at least
    0.05 below the matched-null median on each of the three largest completed
    sizes with a 95 percent interval excluding zero; exhaustive fiber recall is
    exactly 1.000000; the planted-period control returns u = 1 - log_N(d) within
    0.02 at all three d; the separation decays by at least 75 percent under full
    predicate randomisation; and the curve-free Z/N arm does NOT reproduce the
    gap.
  falsification_criterion: >-
    Any of the following falsifies H-ICEX-f1109f within the tested scope - the
    median gap is below 0.05 on the three largest completed sizes; the fiber
    recall is not exactly 1.000000; the separation fails to decay by 75 percent
    under full randomisation; or no offset size yields a non-degenerate null
    band, in which case the result is design-infeasible and is not a negative
    result about the mechanism. If the curve-free Z/N arm reproduces the gap,
    the gap stands as an observation about finite abelian groups and NOTHING may
    be quoted as a statement about elliptic curves or the ECDLP.
  required_artifacts:
  - curve and subgroup parameters, F and A hashes, target blinding seeds
  - every overlap vector, and collision-bucket hashes for every enumerated scalar
  - the complete bucket containing each true scalar
  - independent final [k]P = R verification for every scored target
  - calibration-pass null medians across the whole offset ladder, with the frozen cell recorded
  - planted-period control readings at all three d beside their predicted values
  - curve-free Z/N arm outputs under the identical code path
  - online and exhaustive work counters, reported separately
  - per-run manifest, command, environment, stdout, stderr, validity status
  assigned_to: executor
  approved_by: null
