# EXP-SEMBIN-222128 — stage-0 HKYY closure for H-SEMBIN-f17c97.
# Draft for preapproval. Approval replaces status, frozen, approved_by,
# and execution_authorized. No run result is stored here.
experiment:
  id: EXP-SEMBIN-222128
  hypothesis_id: H-SEMBIN-f17c97
  source_idea: IDEA-20261016-d0335b
  question_id: RQ-SEMBIN-9e8f82
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: Stage-0 instrument for the HKYY closure on two toy GF(2) ideals
  status: review_required
  frozen: false
  designed_at: '2026-10-17'
  execution_authorized: false
  objective: >-
    Compute the least degree D at which the HKYY space of the unsatisfiable
    generators x, y, xy+1 contains the constant 1, and the least degree at
    which the space of x+1, y+1 contains each of those linear forms. Do not
    fit a slope in the chain length.
  inputs:
    d_max: 4
    nvars: 2
    unsat_generators: [x, y, xy+1]
    sat_generators: [x+1, y+1]
    runner: experiments/EXP-SEMBIN-222128/implementation/run.py
  input_bindings:
    runner:
      path: experiments/EXP-SEMBIN-222128/implementation/run.py
      sha256: a346e2c7f5089d8b4ef8550e069d9143a01c4dd5a393610605811bf1fa9a94a9
    checker:
      path: experiments/EXP-SEMBIN-222128/implementation/check.py
      sha256: 59b6520c54af13bbaa872bb2c631e8cf8c6902d62d7e6201408662964b10b6bc
  controls:
    - >-
      A generator enters the degree-D space only when its total degree is
      at most D. A variable multiple enters only when every term of the
      product has degree at most D.
    - >-
      The satisfiable ideal is the control. It must not contain the
      constant 1 at degree at most 4.
  independent_variables:
    - none; both ideals are frozen
  metrics:
    primary:
      - d_ref
      - d_pin
      - d_pin_second
      - sat_contains_one
      - pins_agree
    secondary: []
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      d_ref is 2, d_pin is 1, d_pin_second is 1, sat_contains_one is false,
      and pins_agree is true.
    formula: >-
      Over GF(2), V of x, y, and xy+1 first contains 1 at degree 2, because
      y times x is xy and xy+1 plus xy is 1. The generators x+1 and y+1
      have degree 1, and no combination of them is the constant 1.
    source: >-
      Evaluated by experiments/EXP-SEMBIN-222128/implementation/run.py in a
      design-time directory before this contract was frozen.
  scale_relevance:
    tier: toy
    justification: >-
      Two variables and degree at most 4. No transfer to a typed chain,
      to a slope in m, or to a standardised curve.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 1
    seed_policy: The ideals are fixed. No seed is drawn.
  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    wall_clock_seconds_per_run: 60
  stopping_rules:
    - Stop after the single closure. Do not open another ideal in this version.
  invalidation_rules:
    - >-
      A crash or a timeout invalidates the instrument run. It is not
      evidence about the chain-length slope.
    - >-
      Changing either ideal after this freeze requires an amendment.
  success_criterion: >-
    The run records d_ref 2, d_pin 1, d_pin_second 1, sat_contains_one
    false, and pins_agree true.
  falsification_criterion: >-
    The run records a complete closure in which d_ref is not 2, or d_pin
    is not 1, or d_pin_second is not 1, or sat_contains_one is true, or
    pins_agree is false. That reading invalidates this toy cell and does
    not decide the slope claim of IDEA-20261016-d0335b.
  decision_impact:
    on_positive: >-
      The closure reproduced the frozen degrees on these two ideals. A
      later amendment may price typed chains. This pass does not show that
      D(m) grows with m.
    on_negative: >-
      The closure failed the frozen degrees. Do not schedule a chain sweep
      from this runner. Repair the instrument by amendment. Do not read
      the failure as evidence that the slope is flat.
  required_artifacts:
    - experiments/EXP-SEMBIN-222128/runs/RUN-SEMBIN-fd4f92/manifest.yaml
    - experiments/EXP-SEMBIN-222128/runs/RUN-SEMBIN-fd4f92/raw-result.json
    - experiments/EXP-SEMBIN-222128/runs/RUN-SEMBIN-fd4f92/RESULTS.md
  assigned_to: executor
  scope_note: >-
    Version 1 is the two toy ideals. The chain-length slope, typed chains,
    and Theorem 1 remain proposed.
