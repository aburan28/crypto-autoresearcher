experiment:
  id: EXP-HQCX-b341c4
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b68344; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b68344
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact circulancy verification of the HQC error covariance by exhaustive enumeration, plus
    a block-level separation-profile measurement against a matched exchangeable surrogate the committed
    estimator cannot distinguish
  objective: 'The one uncertainty a run reduces: whether HQC''s block-failure indicators are merely
    STATIONARY - equal marginals, joint law a function of block separation - or genuinely EXCHANGEABLE,
    which is the stronger property the committed subset-averaged estimator implicitly relies on. A
    run establishes (i) that the untruncated error''s covariance is exactly circulant, verified by
    exhaustive enumeration in exact rational arithmetic at n = 7 and n = 11, with a shift-broken variant
    confirming the check has power; (ii) whether per-block marginal failure rates are equal to within
    Monte-Carlo error, which stationarity forces and which is also a fail-closed gate on the block-layout
    assumption; and (iii) whether the pairwise joint failure matrix collapses onto a separation profile,
    and whether that profile is distinguishable from the flat profile of a matched exchangeable surrogate
    carrying identical values of every quantity the committed estimator reports. No attack, break,
    speedup or security consequence is claimed here or would follow from a run. No statement is made
    about what the published literature does or does not contain; this environment cannot reach external
    literature. No direction is declared impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: the covariance of e'''' is exactly
      circulant at the enumerated (n, w) cells, verified in exact arithmetic; at the sampled parameter
      sets the per-block marginals are equal within a stated tolerance; and the separation profile
      has a stated amplitude with confidence intervals, distinguishable or not from a matched exchangeable
      null at a stated power. WHAT DOES NOT FOLLOW: nothing about deployed HQC parameters; nothing
      about the value of the decryption failure rate; nothing about whether any separation dependence
      changes the IND-CCA argument; no attack and no security consequence; and nothing about third
      or higher cumulants, which are not measured.'
  inputs:
    procedure: 'STAGE 0 (zero compute): write the shift-invariance derivation formally and record
      it as the artefact; state the block-layout assumption explicitly. STAGE 1 (minutes): attempt
      the per-block marginal-equality check by re-reading committed F arrays from EV-HQC-3a0372 and
      EV-HQC-469c08, generating nothing. STAGE 2 (seconds to minutes): exhaustive covariance enumeration
      at n = 7 (weights 2) and n = 11 (weights 2, 3) in exact rationals; circulancy check; shift-broken
      power check. STAGE 3 (tens of minutes, T = 10^6): at n = 227 and n = 587, measure per-block
      marginals and the full pairwise joint matrix; collapse to the separation profile; compute the
      residual. STAGE 4 (minutes): generate the matched exchangeable surrogate, verify it reproduces
      mubar_2 and log2 A-hat_2 exactly, and run the identical profile estimator on it. STAGE 5 (zero
      compute): report profile, residual, null amplitude and per-separation pair counts.'
    instrument: Python 3.11 with numpy and the fractions module; NO Sage. The exhaustive arm uses
      itertools.combinations over input supports and Python Fraction arithmetic so the circulancy
      verdict is exact and not a floating-point judgement, with a numpy float mirror used only for
      speed cross-checks. The sampled arm reuses the same bit-packed GF(2) ring arithmetic and numpy
      fast Walsh-Hadamard Reed-Muller decoder as the other contracts in this batch. The pairwise joint
      matrix is accumulated as an n_e-by-n_e int64 array. Recorded through harness/runner.py with
      a frozen seed ladder.
    parameters: 'Exhaustive arm: n = 7 with all input weights 2 (input space at most C(7,2)^5 = 21^5
      = 4084101, enumerable), and n = 11 with weights 2 and 3 subsampled if the product exceeds 10^8.
      Sampled arm: n in {227, 587}, RM(1,5) inner blocks of length 32, duplication 1, n_e in {7, 18},
      N/n near 0.98, outer radius delta = 2, weights tuned on a disjoint seed stream to a per-block
      failure rate in [1e-3, 1e-2], T = 10^6 per cell. Matched exchangeable surrogate at the same
      n_e and the same measured marginal and pairwise rate, T = 10^6. All n checked for ord_n(2) =
      n-1.'
  controls:
  - Matched exchangeable surrogate with identical marginal and identical overall pairwise rate, analysed
    by the identical profile estimator in the same invocation.
  - Shift-broken variant at n = 7 on which the circulancy check must fail, establishing the check's
    power.
  - Exact rational arithmetic in the exhaustive arm, so the circulancy verdict is not a floating-point
    judgement.
  - Re-read of committed F arrays for the marginal-equality check before generating anything new.
  - 'Per-block marginal equality as a fail-closed gate on the sampled arms: unequal marginals mean
    the layout assumption is wrong and the separation reading is void.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a matched exchangeable surrogate: block-failure
    vectors generated with the SAME per-block marginal and the SAME overall pairwise joint rate but
    with the pair identity randomised, so that by construction the separation profile is flat while
    every quantity the committed estimator reports is unchanged. It is generated and analysed in the
    same invocation, through the identical profile estimator. FOR THE SIGNAL ARM TO MEAN ANYTHING
    THE NULL MUST SHOW: (i) a separation profile flat to within its own Monte-Carlo error - a null
    arm showing structure means the profile estimator manufactures it and no signal-arm reading is
    admissible; (ii) identical values of mubar_2 and log2 A-hat_2 to the signal arm, which is what
    makes the surrogate matched and demonstrates that the committed estimator genuinely cannot see
    the difference; and (iii) in the exhaustive STAGE 2 arm, the circulancy check must PASS on the
    true law and FAIL on a deliberately shift-broken variant, establishing that the check has power.'
  independent_variables:
  - block separation |j - j'|
  - ring size n and block count n_e
  - 'arm: HQC pipeline versus matched exchangeable surrogate'
  - 'input law: true versus deliberately shift-broken (exhaustive arm only)'
  metrics:
    primary:
    - exact circulancy deviation at n = 7 and n = 11
    - per-block marginal failure vector and its spread
    - pairwise joint failure matrix
    - separation profile with per-separation confidence intervals
    - residual after projection onto separation
    secondary:
    - mubar_2 and log2 A-hat_2 in both arms, demonstrating the surrogate is matched
    - per-separation block-pair counts
    - shift-broken variant's circulancy deviation, establishing power
    - wall-clock seconds per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The exact circulancy deviation at n = 7, and the amplitude of the separation profile
      at n = 227 divided by the matched surrogate's amplitude.
    formula: Circulancy deviation := max over (i, j, d) with j - i = d of |Cov(e''_i, e''_j) - rho(d)|
      where rho(d) is the mean over the diagonal; predicted exactly 0 in rational arithmetic. Separation
      profile := g(d) := P[F_j = F_{j+d} = 1] - P[F_j = 1] P[F_{j+d} = 1], averaged over the block
      pairs realising separation d; under exchangeability g is constant in d, and the prereg quantity
      is max_d |g(d) - mean_d g(d)| divided by the same statistic computed on the matched surrogate.
      Predicted greater than 1 if stationarity is strict, exactly 1 in distribution under exchangeability.
    source: Pre-registered in the parent proposal IDEA-20260816-b68344 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The derivation in STAGE 0 is scale-free: it holds at every n for which the input
      laws are shift-invariant, and it is verified EXACTLY at n = 7 and n = 11 by enumeration, so
      that arm involves no extrapolation whatever. The block-level measurement runs at n = 227 and
      n = 587 with n_e up to 18, orders of magnitude below deployed HQC, and its conclusions are scoped
      to those cells. The one thing claimed to carry across scales is the STRUCTURAL statement - equal
      marginals, separation-only joint dependence - because it follows from a symmetry rather than
      from a magnitude; the amplitude of the profile is explicitly not claimed to carry.'
    correspondence: null
  tail_checks:
  - Report per-separation block-pair counts alongside the profile, since the largest separations are
    realised by the fewest pairs and their error bars are combinatorial rather than statistical.
  - Check the profile separately for block pairs that straddle the truncation boundary, where circulant
    and Toeplitz structure differ most.
  - Verify the exhaustive arm's rational arithmetic against a float mirror and report the largest
    disagreement, to catch an enumeration bug rather than a rounding one.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - 'Abort everything if the exhaustive circulancy check fails at n = 7: the derivation is wrong and
    the sampled arms are pointless.'
  - Abort the separation reading at any cell where the per-block marginal gate fails.
  - Stop at the declared cell list; the profile estimator and the surrogate construction are frozen
    before data generation.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The exhaustive circulancy check passes exactly and fails on the shift-broken
    variant, the marginal gate passes at every sampled cell, and the run reports the separation profile
    with per-separation pair counts and its matched-surrogate null amplitude.
  falsification_criterion:
  - 'The exhaustive covariance is not exactly circulant: the derivation is falsified and the proposal
    closes on that.'
  - 'Per-block marginals are unequal: the block-layout assumption is wrong and the separation variable
    is mis-defined.'
  - 'The separation profile is flat within the matched-surrogate null: exchangeability is licensed
    at the tested parameters and the amplitude bound is the recorded obstruction.'
  - 'The matched surrogate shows a non-flat profile: the estimator manufactures structure and is void.'
  - 'The pairwise matrix residual after projection is large: the joint law depends on (j, j'') beyond
    separation, contradicting the derivation and indicating a pipeline defect.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b68344
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The block layout - consecutive equal-length intervals versus interleaving - is assumed and is
    load-bearing for the entire separation variable; a Coordinator must confirm it against the committed
    transcription before approval.
  - The matched exchangeable surrogate's construction is specified only by which moments it matches;
    the exact generative recipe must be written down, because a surrogate matching too many moments
    would be indistinguishable by construction and one matching too few would be a straw null.
  - Whether the truncation-boundary block pair should be included in the separation profile or reported
    separately needs a ruling before data is seen.
  - The exhaustive arm's affordability at n = 11 depends on the weight choice and may need subsampling;
    the subsampling rule, if any, must be frozen in advance since a sampled 'exhaustive' arm is no
    longer exact.
