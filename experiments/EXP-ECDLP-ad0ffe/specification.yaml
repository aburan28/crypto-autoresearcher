experiment:
  id: EXP-ECDLP-ad0ffe
  hypothesis_id: H-ECDLP-51f052
  proposal_id: IDEA-20260909-4c5ee9
  question_id: RQ-ECDLP-002
  goal_ids:
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  version: 1
  title: 'Prym W: public source-witness, leakage and native-rank audit'
  designed_at: '2026-10-19'
  status: review_required
  objective: Test whether relation outputs carry public source labels and enough distinct projected rank, before
    timing any purported Prym benefit.
  inputs:
    design_brief: research/prym_experiment_design_20261019/brief.md
    prior_intake: research/prym_relation_followup_20261019/README.md
    problem: problems/prym-assisted-source-labelled-router.md
    proposal: ledger/proposals/IDEA-20260909-4c5ee9.yaml
    archive_task_id: TASK-20261019-84755b
    depends_on:
    - EXP-ECDLP-da4ba3 arithmetic checks if its fiber-product fixtures are used; PO003-family calibration has separate
      geometric checks
    historical_calibration: The published internal PO-transfer-003 cells p=101,211,431,4099 are calibration only.
      Reuse exact historical factor bases/parameters only if recovered from their immutable artifacts; their table
      is not a current baseline.
    fresh_fixture_rule: For each p in [101,211,431,4099], enumerate (A,B) lexicographically with 0<=A<p, 1<=B<p.
      Exclude historical (42,60),(127,142),(62,120),(4041,4067) for the corresponding p. Require smooth C:y^2=x^6+A*x^2+B,
      smooth E1:Y^2=U^3+A*U+B and E2:V^2=W^3+A*W^2+B^2, prime odd r=#E1(Fp), and eight distinct nonzero E1 images
      up to sign of rational C points. Retain the first two eligible pairs per p (8 fresh curves); archive all inspected
      pairs and failures. Exact constants and UIDs must be materialized and committed before approval.
    maps: pi1(x,y)=(x^2,y); pi2(x,y)=(B/x^2,B*y/x^3), with x=0/infinity handled by projective local formulas. The
      second equation is W^3+A*W^2+B^2. Never silently substitute a different quotient family.
    generator_rule: On each prime-order E1, P is the first nonidentity affine point in lexicographic (U,Y) order;
      subgroup certificates accompany P.
    factor_base_rule: Choose the first eight distinct nonzero pi1 images up to sign of rational C points in lexicographic
      (x,y) order; choose lexicographically least C preimage for each signed-normalized norm class. Norms are public
      points without supplied logarithms. Transport this base under coordinate controls; do not reselect.
    known_source_grid: For each fresh curve and seed s in [0,1,2], public a values are 1..min(64,r-1) in a deterministic
      seed permutation; R=[a]P. Source lifting and factor-base/cubic tuple branch policy must be frozen and hashed
      before approval.
    calibration_constructor: PO003-style cubic v through a source lift (with declared sign and lambda) and three
      native base lifts; factor the residual polynomial and use the divisor of y-v on C, including its pole/infinity
      contribution. Its norm supplies a publicly labelled source equation. This is calibration, not the absent new
      compact router.
    new_constructor: No new compact router is supplied or required for the PO003 engineering audit. Any later claim
      outside P1546 must separately bind one exact constructor, source inverse and scope distinction; a generic
      interface is not an algorithm.
  controls:
  - 'C-W-positive: explicitly planted publicly known-source relations and valid cubic principal-divisor fixtures
    pass independent checks; calibration only.'
  - 'C-W-bad: wrong a+1 label, wrong sign, malformed divisor multiplicity and missing infinity term must each be
    rejected; synthetic cases have exact expected labels.'
  - 'C-W-rank: duplicate norms, sign-equivalent columns, zero rows, and all-known-log bases must produce their exact
    reduced U and rank; these do not count as newly useful rank.'
  - 'C-W-posthoc: arbitrary smooth tuple followed by K=i(R)-sum eD without an independent locator must be flagged
    verifier-only.'
  - 'C-W-tuple: tuple-first endpoint with unknown scalar cannot be relabelled known-source by a hidden discrete
    log.'
  - 'C-W-aa: fixed bijective re-encoding/permutation of atom indices with transported maps preserves canonical source
    equations, U and rank.'
  - 'C-W-random: same-size/same-field split E1 x A control with independent matched auxiliary labels; auxiliary
    cancellation alone must not manufacture a known source scalar.'
  independent_variables:
  - 'row class: native calibration/new candidate/planted/invalid/tautological'
  - curve and source scalar
  - atom index encoding
  metrics:
    primary:
    - invalid/unknown-source relation acceptance count (integer; zero)
    - valid planted rejection count (integer; zero)
    - U, rank(M), rank([M|b]) and exact pivot certificate modulo r
    - fraction of public source inputs yielding a valid non-tautological independently useful row, all attempts
      included
    secondary:
    - native relation rank versus projected rank
    - duplicate/sign/zero/publicly-known norm column counts
    - known-source rows per charged operation vector; full source lift/tuple/factor cost
    - public source inverse/circuit/branch/advice description and secret-access audit
    - blind correctness-control success and raw memory bytes; no current IC gain claim
  replication:
    seeds:
    - 0
    - 1
    - 2
    independent_instances: 8
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: null
    maximum_workers: 1
  stopping_rules:
  - For each fresh instance/seed process every fixed known a input and the frozen finite constructor attempt stream,
    stopping only at its declared deterministic end; no extend-until-rank data-dependent budget. The finite attempt
    stream is an approval blocker until bound.
  - Complete all malformed/planted/rank controls before interpreting native rows.
  - Failure to attain U independent rows is reported, never repaired with oracle/planted truth rows; any separate
    repair is a new frozen candidate.
  invalidation_rules:
  - Any source/target secret or verifier log table reaches the attack, its feature construction, tuning, ordering
    or file/network side channel.
  - Projected rank uses raw atom count, signed duplicate columns, all-known-log columns or a modulus other than
    r.
  - Verifier shares the candidate witness implementation without an independent source-equation checker; branch
    misses/rejects or infinity exceptions are omitted.
  - Coordinate A/A alters the factor-base set instead of transporting it.
  success_criterion: 'P-W-source with C-W-source and P-W-rank with C-W-rank: on every fresh fixture, all accepted
    candidate rows have public valid source labels, no secret leakage or locator tautology, and the canonical unknown-log
    system has rank U and is consistent. C-W-aa must agree exactly and all planted/false-label controls must pass.
    Historical calibration carries no support criterion. This is a source/rank prerequisite, not a speedup.'
  falsification_criterion: 'P-W-source/C-W-source: a validly audited candidate only returns unknown-scalar endpoints
    or post-hoc residual certificates and has no source-return mechanism. P-W-rank/C-W-rank: the exact frozen finite
    stream yields rank below U or inconsistent source rows on fresh cells. This rejects only the tested constructor/stream
    as a complete source-labelled base-log mechanism; instrument/control failures are invalidity.'
  required_artifacts:
  - 'manifest.json: exact command, clean committed revision, protocol/input/dependency hashes, hardware, field encoding,
    curve UID, subgroup and factor-base UIDs, policy/model provenance, timestamps and process-group resources'
  - stdout.txt and stderr.txt; immutable raw-result.json and per-attempt event stream, including rejects/duplicates/errors
  - verification.json from an independently implemented checker, with every failed check retained
  - report.md, graph.svg plus source, and inspected report.pdf; source-linked limits and no promoted claim without
    review
  assigned_to: executor-implementation
  approved_by: null
  approval_blockers:
  - Fresh fixture constants, UIDs, base atoms and deterministic finite constructor attempt stream have not been
    materialized or hashed.
  - PO003 engineering audit needs an exact finite tuple/branch/exception stream and any rank-repair policy; a novel
    compact router remains an independent unresolved research obligation, not a prerequisite to checking this fixed
    generator.
  - Native curve/divisor arithmetic with projective exception handling, independent witness/source/rank checker
    and secret-separated challenge interface are unimplemented here.
  - No native trial plan, launcher, runbook/task-card, science executor handoff/archive and approvable=true admission
    are bound.
  execution_authority: None. Exact prospective bytes must pass native experiment_preapproval approvable=true; committed
    approval/archive and newest_experiments execution_state=ready precede the run skill. No retrospective approval.
  cost_accounting:
    complete_work: Retain a vector of raw field operations by field, elliptic/Jacobian additions and multiplications,
      polynomial arithmetic/factorization, comparisons/hash operations, matrix operations and bytes moved. Do not
      add unlike units without a frozen weight model. S is the current matched baseline protocol's complete weighted
      operation count, with its weights bound before approval. Wall time and CPU are secondary diagnostics.
    charge:
    - public instance/cover search including rejected candidates
    - map construction, normalization, factor-base generation, advice/training and tuning
    - all candidate generation, failed lifts, branch enumeration and rejected tuples
    - companion labels, selector evaluation, row normalization, witness/source checks and independent-rank maintenance
    - linear algebra, target descent, recovery, and final source verification
    accounting_scope: Both cold-start and genuinely amortized totals; no free offline table, oracle, secret witness
      or uncharged rejected stream. Reference/checker work is reported separately and cannot be supplied to the
      attack.
    memory: Record peak process-group RSS bytes plus peak live algebraic words/table entries and serialized advice
      bytes. A 2 GiB guard protects headroom; any guard stop is censored infrastructure, not a complete successful
      solve.
  interpretation_limits:
  - 'Design only: no scientific run, measured gain, new asymptotic exponent, novelty certificate or security conclusion.'
  - The unsourced historical 32-cover quotation is not an input catalog; no identification or completeness claim
    is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute or reopen the IDEA-002 frozen
    contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication alone does not solve
    ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure impediment, not mathematical
    falsification.
  decision_impact:
    on_positive: Admit the exact verified constructor and canonical base to selector-ablation design; preserve full
      costs and branch complexity.
    on_negative: Retain the specific missing source information/rank certificate; implement a genuinely distinct
      locator or implicit row producer before further timing. Do not restart the IDEA-002 matrix.
    on_inconclusive: Resolve the named independent-checker, fixture, constructor or leakage-sandbox implementation
      gap and refreeze exact bytes; no official scientific transition.
  preregistered_predictions:
  - id: P-W-source
    quantity: Public source-labelled row validity and source-information audit
    prediction: A qualifying constructor produces independently checkable equations with public labels, rejects
      all false labels and supplies an explicit source inverse/locator, unlike the post-hoc and tuple-first controls.
  - id: P-W-rank
    quantity: Projected affine relation rank
    prediction: On each declared fresh holdout fixture, qualifying row collection reaches rank U with consistency;
      otherwise the tested constructor does not support complete base-log recovery under this protocol.
  - id: P-W-calibration
    quantity: Historical and planted correctness fixtures
    prediction: Known internal fixtures and planted cases reproduce their specified algebraic checks; this calibrates
      the instrument only.
  scale_relevance:
    tier: toy
    justification: Finite implementation/algorithm experiments; no transfer to secp256k1 or P-256.
    correspondence: null
  constructor_api:
    public_inputs:
    - field/curve/cover/projective-map encodings and certificates
    - P,r, frozen native atoms D_j with public norm points F_j
    - public scalar a and R=[a]P; seed and explicit branch/circuit identifier
    forbidden_inputs:
    - factor-base logarithms
    - synthetic target scalar k
    - offline source-log lookup table
    - post-hoc residue declared as the mechanism
    output:
      status: relation | declared_failure
      row: integer coefficients e_j reduced modulo r, plus source coefficient c with gcd(c,r)=1 and known public
        scalar a
      source_equation: '[c*a]P = sum_j [e_j]F_j, with any known-log columns subtracted to the right-hand scalar'
      witness: explicit principal-divisor/function/ideal certificate and complete exceptional-point/multiplicity
        data; alternatively i(R)-sum e_j D_j=K with an independently constructed K and verified n(K)=0, giving c=degree(pi)
      provenance: all attempts, branch queries, construction steps, helper tables and costs
    verifier: Rebuild public maps/point sums independently; verify every claimed principal divisor and source scalar
      equation. Merely computing K after choosing a tuple is rejected as a locator.
  rank_protocol:
    canonicalization: Work modulo the target prime r. Remove zero projected columns; merge identical F_j and F_j=-F_l
      with their coefficient signs. Retain native-to-projected column map and every discarded row. Known-log points
      have public derivations checked and their terms moved to b.
    matrix: M*x=b, where x has U actual distinct unknown projected logarithms relative to P. Publish U, source-label
      vector b, rank(M), rank([M|b]), and pivot/independent-row certificates.
    target: Unique factor-base recovery requires rank(M)=U and consistency rank([M|b])=U. If only homogeneous rows
      are generated, the scalar gauge needs an independently known public anchor; after deleting that anchored unknown
      the required rank is the remaining number. No universal B-1 rule.
    diagnostic: Native Jacobian rank, number of rows and apparent auxiliary cancellations are secondary; none substitutes
      for projected rank modulo r. Never use verifier truth logs to select a basis or choose rows.
    blind_descent: For a separately sealed Q, return gamma*Q+delta*P=sum e_j F_j with gamma nonzero mod r, a valid
      native witness, and full costs; recover k=gamma^-1*(sum e_j*x_j-delta) mod r. Challenge/verifier alone holds
      k until sealed attack output.
    alias_audit: For S sampling, independently verify source coefficient normalization, FB permutation, global deck
      and hyperelliptic involution orbits. Geometrically equivalent acceptance events must have identical canonical
      keys and train/holdout partition. Known-log oracles cannot supply this canonicalizer.
