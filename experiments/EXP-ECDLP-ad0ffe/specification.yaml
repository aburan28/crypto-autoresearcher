    written_at: '2026-10-19'
    data_seen:
    - path: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
      measured: Imported historical toy relation/rank/recovery/cost observations; read by parent intake, not replayed
        here.
    - path: research/prym_relation_followup_20261019/README.md
      measured: Earlier chat F43 point-count/Frobenius diagnostic was seen; it is not native run evidence.
    sample_status: out_of_sample
    overlap: No measurements on the future frozen holdout challenge set have been seen.
  - prediction: P-W-calibration
    first_recorded_in: experiments/EXP-ECDLP-ad0ffe/specification.yaml
    written_at: '2026-10-19'
    data_seen:
    - path: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
      measured: Imported historical toy relation/rank/recovery/cost observations; read by parent intake, not replayed
        here.
    - path: research/prym_relation_followup_20261019/README.md
      measured: Earlier chat F43 point-count/Frobenius diagnostic was seen; it is not native run evidence.
    sample_status: in_sample
    overlap: Historical PO003 native relation/rank results have been read; planted controls are specified with known
      answers.
  variable_ledger:
    independent:
    - name: row_class
      levels: native/planted/invalid/tautological/tuple-first
    - name: fixture
      levels: eight fresh curves; historical calibration separate
    factors:
    - name: atom_encoding
      treatment: fixed
      value: canonical versus fixed permutation for A/A
      how: Transport all points and coefficients bijectively.
    - name: factor_base
      treatment: fixed
      value: eight distinct norm classes per fresh curve
      how: Same U and base in every relevant paired arm.
    - name: target_secret_access
      treatment: fixed
      value: challenge process only
      how: Separate attack/verifier files and processes; audited IPC.
    - name: branch_policy
      treatment: fixed
      value: pending exact candidate bytes
      how: Hash every lift/tuple choice; retain all attempts.
    - name: rank_implementation
      treatment: fixed
      value: exact F_r elimination plus independent pivot checks
      how: Use same canonical source matrix in paired checks.
    - name: seed
      treatment: randomized
      value: 0,1,2
      how: Fixed three public permutations; repeated seeds are within-instance repetitions.
    - name: hardware
      treatment: measured
      value: manifest
      how: Timing diagnostic only.
    comparisons:
    - id: C-W-source
      arms:
      - fresh source audit
      differs_in: []
      design: absolute
    - id: C-W-rank
      arms:
      - fresh rank audit
      differs_in: []
      design: absolute
    - id: C-W-positive
      arms:
      - planted valid
      differs_in: []
      design: absolute
    - id: C-W-bad
      arms:
      - known invalid
      differs_in: []
      design: absolute
    - id: C-W-aa
      arms:
      - canonical
      - reencoded
      differs_in:
      - atom_encoding
      design: aa
    - id: C-W-random
      arms:
      - geometric auxiliary
      - matched split-product
      differs_in:
      - row_class
      design: one_factor
    crosses_map: true
  transfer_obligations:
  - map: Native divisor relation -> publicly labelled norm equation on E1
    kind: cover
    source: Divisors on C and known-source R=[a]P
    destination: E1 subgroup relation matrix modulo r
    preserves:
    - source equation if independently verified
    - working prime field and exact subgroup r
    changes:
    - divisor support and column identifications
    - kernel information can be lost under norm
    controls:
    - kind: identity_map
      comparison: C-W-aa
    - kind: matched_random
      comparison: C-W-random
    assessment: research/prym_experiment_design_20261019/protocol_summary.json
    assessment_key: transfer_assessments.W
  goal_id: GOAL-ECDLP-001
