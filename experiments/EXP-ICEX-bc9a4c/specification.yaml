experiment:
  id: EXP-ICEX-bc9a4c
  hypothesis_id: H-ICEX-a91960
  derived_from_idea: IDEA-20260815-38a1cc
  question_id: RQ-MTGT-2cabee
  batch_id: BATCH-fced88
  version: 1
  title: >-
    CHARGE THE OFFLINE PHASE AND THE BREAK-EVEN DISAPPEARS- a zero-compute
    verification protocol that instantiates the filed generic preprocessing
    tradeoff with offline cost and storage as SEPARATE charged terms, sweeps
    the offline charge rather than assuming it, computes the break-even
    target count against the correct multi-target comparator sqrt(T*N), and
    reports the smallest offline cost at which any break-even survives - with
    a free-offline reproduction gate, a single-target null, and a curve-free
    (Z/NZ, +) arm that must return identical numbers
  status: designed
  objective: >-
    (A) THE UNCERTAINTY. Preprocessing is the one classical setting in which
    the ECDLP per-target exponent genuinely moves, and the corpus records the
    tradeoff (KN-LIT-013- S*T^2 = Omega~(epsilon*N), tight) without recording
    what the offline phase costs, because the model declares it UNBOUNDED.
    The uncertainty reduced is whether any break-even against the correct
    comparator survives once that phase is charged, and how sublinear the
    offline cost would have to be for one to exist.
    (B) WHY THIS IS AN AUDIT AND IS DESIGNED AS A VERIFICATION PROTOCOL. No
    measurement is possible here- no advice table for a cryptographic group
    can be built. What IS possible is a decidable arithmetic check of an
    inequality over a declared grid, with the terms the published model
    leaves out made explicit and swept. The artifact checked is the charged
    cost function; the reference is the published free-offline tradeoff,
    which the free-resources null must reproduce exactly; the result that
    fails it is a break-even surviving at C_off >= N, which would be an
    arithmetic error in the parent hypothesis.
    (C) WHAT IS BUILT. Three separated terms where the lane currently has an
    exponent- offline cost C_off (group operations), storage S (stored group
    elements), online cost per target T_online (group operations) - plus the
    comparator sqrt(T*N) with its own memory column, and a curve-free arm
    that must return identical numbers because the model reads no curve.
    (D) WHAT IS NOT DECIDED. Nothing about non-generic preprocessing, nothing
    about multi-instance amortisation across curves, nothing about whether
    HEUR-PREP-1's Omega(N) offline floor is true - which is the one input the
    whole verdict rests on and which this contract SWEEPS rather than
    assumes.
  inputs:
    cost_unit: >-
      ONE CHARGED OPERATION IS ONE GROUP OPERATION in a cyclic group of prime
      order N. STORAGE IS COUNTED IN STORED GROUP ELEMENTS. These are two
      units and they are never added. Where a joint figure is wanted it is
      either the PRODUCT S*T^2 carried with both tags, or a rate-converted
      figure at a frozen declared exchange rate alpha in {0.1, 1, 10}
      group-operations per stored element, reported as one row per alpha.
    unit_discipline: >-
      BINDING. Every emitted value carries a tag in {group_ops,
      stored_elements, targets, dimensionless}. The harness refuses to add,
      subtract or compare values with different tags; the only legal
      cross-unit operations are the declared alpha conversion and the
      explicit product, each recorded beside its result. A break-even
      reported as a bare number without its (S, C_off, alpha) row is
      INVALID- 'the break-even' is not a scalar in this model and quoting it
      as one is the failure this contract exists to prevent.
    feasibility_gate: >-
      THE HARNESS REFUSES TO PRICE A DEGENERATE CELL. Reported as INFEASIBLE
      with the reason, never priced- S > N (a table larger than the group,
      where the discrete log is a lookup and the model has degenerated);
      S < 1; T > N (more targets than group elements); T < 1; any cell whose
      online term T_online = sqrt(N/S) falls below 1 group operation (the
      tradeoff has run out of room and the formula is being extrapolated
      outside its regime); and any cell whose offline charge has no declared
      source or sweep level. A cost script that will price an empty or
      degenerate object manufactures cells- this gate is the direct
      descendant of DEC-20260904-d47cd2, which rejected a table that priced a
      Macaulay matrix with zero rows at every cell.
    procedure: >-
      STAGE 0 (blocking, no compute). PRIMARY-READ GATE. KN-LIT-013's corpus
      entry records that the full paper was NOT read and that the tradeoff
      and its tightness are relayed from the abstract. Before any headline
      number is quoted, the primary source is read and a superseding KN-LIT
      entry is filed carrying the tradeoff, the construction, and - the
      quantity this contract needs - whatever the source states about the
      OFFLINE COST of the tight construction. If the source states no offline
      cost, that absence is recorded as a first-class finding and C_off
      remains a swept parameter with no sourced value.
      STAGE 1 (HARD GATE, minutes). FREE-RESOURCES NULL. Set C_off = 0 and
      the storage charge to 0; the harness must return the published online
      tradeoff, with S * T_online^2 = N verified to 1e-12 at every grid
      point. Mismatch halts.
      STAGE 2 (HARD GATE, minutes). SINGLE-TARGET NULL. At T = 1, charged
      preprocessing must LOSE to plain rho for every C_off > 0. A win voids
      the run.
      STAGE 3 (minutes). The break-even sweep- T*(S, C_off) over the full
      grid, at each alpha, with the comparator sqrt(T*N) computed in the same
      code path.
      STAGE 4 (minutes). The inverted question, which is the deliverable-
      the SMALLEST C_off at which a break-even exists at T = N^{1/2} and at
      T = N, reported per S.
      STAGE 5 (curve-free arm). The identical grid on (Z/NZ, +). Numbers must
      be identical to the last digit.
      STAGE 6 (zero compute). The infeasible-cell table, the identifying
      triple (online time, storage, offline cost) attached to every row, and
      the explicit per-curve scope statement on every break-even figure.
    mechanism: >-
      STEP 1. Write the charged total as C_off + T*sqrt(N/S) with S, C_off, T
      free, and the comparator as sqrt(T*N), both in group operations, in ONE
      function so that no asymmetry between the two sides can be introduced
      by a second code path.
      STEP 2. Verify symbolically that at C_off >= N no (S <= N, T <= N)
      satisfies the break-even inequality- report the residual, not just the
      verdict.
      STEP 3. Solve for the smallest C_off admitting a break-even at each
      declared T, per S. This is the number the lane needs.
      STEP 4. Emit every row as (S, C_off, T, T_online, charged total,
      comparator, alpha, verdict), never as a break-even scalar.
    instrument: >-
      Pure Python, exact rational or arbitrary-precision arithmetic, no
      sampling, no curve arithmetic, no group elements constructed. The
      filed KN-LIT entries are the only external inputs and their sha256 is
      recorded.
  controls:
    - >-
      NULL 1, SINGLE-TARGET (blocking). At T = 1 preprocessing must lose to
      plain rho for every C_off > 0; the offline phase cannot amortise over
      one target. A win means the offline cost is not charged and VOIDS every
      number in the run.
    - >-
      NULL 2, FREE-RESOURCES (blocking). C_off = 0 and free storage must
      reproduce the published per-target tradeoff, S * T_online^2 = N, to
      1e-12. This is the nearby-object control- the object on which the
      conclusion is KNOWN to be favourable. A method that returns 'no
      break-even' HERE too has not identified the load-bearing term and is
      measuring nothing.
    - >-
      NULL 3, CURVE-FREE ARM (REQUIRED under the standing scope constraint of
      pfdr-battery-20260904). The identical grid on the generic cyclic group
      (Z/NZ, +). The generic preprocessing model reads NO curve, so the
      numbers must be IDENTICAL to the last digit. Predicted identical;
      consequence stated in advance- the break-even is a statement about a
      generic group of order N and may NEVER be quoted as an ECDLP-specific
      or curve-specific finding. A DIFFERENCE is a defect (an undeclared
      curve-dependent term), not a discovery.
    - >-
      COMPARATOR CONTROL. The comparator is multi-target collision search at
      sqrt(T*N) with its distinguished-point table charged, matching
      H-ICEX-b2c8cf. A run reporting a comparison against T * single-target
      rho is INVALID under this contract; that comparator is the exact
      baseline error the batch exists to remove.
    - >-
      OFFLINE-CHARGE SWEEP CONTROL. C_off is swept over
      {S, sqrt(N*S), N, N*log2(N)} and reported per level. A single assumed
      offline cost would determine the entire verdict, which is why none is
      assumed.
    - >-
      STORAGE-RATE SENSITIVITY CONTROL. Every rate-converted row is reported
      at alpha in {0.1, 1, 10}; a verdict that flips inside that range is
      labelled convention-dependent and may not be quoted without alpha.
    - >-
      PER-CURVE SCOPE CONTROL. Every break-even figure carries 'per curve';
      a figure quoted without it is an overstatement by construction, since
      preprocessing amortises only across targets on the same curve.
  independent_variables:
    - storage budget S in stored group elements, log2 S from 0 to log2 N
    - offline charge C_off in group operations, over the four declared sweep levels
    - target count T, log-spaced from 1 to N
    - group order N, log2 N in {32, 64, 128, 256}
    - storage-to-time exchange rate alpha in {0.1, 1, 10}
    - group object- generic cyclic group against the curve-free (Z/NZ, +) arm
  metrics:
    primary:
      - >-
        break-even target count T*(S, C_off), a dimensionless COUNT OF
        TARGETS, per (S, C_off, alpha, N) cell, or the explicit verdict
        NO_BREAK_EVEN with the residual of the inequality
      - >-
        offline term C_off, storage term S and online term T_online reported
        SEPARATELY, in group operations / stored elements / group operations
        respectively, never summed across units
      - >-
        the charged preprocessing total and the comparator sqrt(T*N), both in
        GROUP OPERATIONS, with their ratio (dimensionless) per cell
      - >-
        the SMALLEST C_off in group operations admitting a break-even at
        T = N^{1/2} and at T = N, per S - the deliverable
      - >-
        curve-free arm values, required identical to the last digit
    secondary:
      - the free-resources null residual for S * T_online^2 = N, required below 1e-12
      - the infeasible-cell table with parameters and refusal reason
      - the identifying triple (online time, storage, offline cost) per row
      - sha256 of every filed input entry used
      - the Stage 0 primary-read gate status and the offline cost the source does or does not state
  heuristic_under_test: HEUR-PREP-1
  preregistered_prediction:
    quantity: >-
      The break-even target count T*(S, C_off) at which the charged
      preprocessing total equals the multi-target comparator sqrt(T*N), in
      counts of targets on one curve.
    formula: >-
      Break-even requires C_off + T*sqrt(N/S) < sqrt(T*N). At the most
      favourable storage budget S = N this is C_off + T < sqrt(T*N), which
      for C_off >= N requires T > N and is therefore unsatisfiable for all
      T <= N. PREDICTED- NO_BREAK_EVEN at every cell with C_off >= N and
      S <= N. PREDICTED- the smallest C_off admitting a break-even at
      T = N^{1/2} is Theta(N^{3/4}) up to the storage term, reported exactly
      by the sweep.
    source: >-
      H-ICEX-a91960 statement (C), derived from the tradeoff recorded in
      KN-LIT-013's corpus entry. The primary paper was not opened by the
      designing agent and the entry itself records that it was not read.
  scale_relevance:
    tier: toy
    justification: >-
      NO INSTANCE OF ANY SIZE IS CONSTRUCTED. The parameters swept include
      log2 N = 256, but nothing is computed on a group of that order and no
      advice table is built; the artifact is arithmetic over a cost model.
      RQ-MTGT-2cabee caps evidence from its runs at claim_tier toy and that
      cap is carried here without exception. TRANSFER ASSUMPTIONS, STATED-
      the filed tradeoff holds as the corpus records it (inherited at
      'reported' confidence, primary source unread) and HEUR-PREP-1's offline
      floor holds (unsupported by any filed record and the single point of
      failure).
    correspondence: null
  tail_checks:
    - >-
      THE LARGEST STORAGE BUDGET, S = N, is the cell most favourable to
      preprocessing and is reported separately, because the negative claim is
      decided there- if a break-even survives anywhere it survives at S = N.
    - >-
      THE SMALLEST OFFLINE CHARGE, C_off = S, is the cell most favourable to
      preprocessing on the other axis and is likewise reported separately;
      the pair brackets the whole grid.
    - >-
      THE CELLS NEAREST THE FEASIBILITY BOUNDARY (T_online approaching 1, S
      approaching N) are reported individually rather than averaged in, since
      the tradeoff formula is being evaluated at the edge of its regime
      there.
    - >-
      ANY CELL WHERE THE CURVE-FREE ARM DIFFERS FROM THE MAIN ARM in any
      digit is inspected individually and halts the record until reconciled.
  replication:
    seeds: []
    seeds_note: >-
      THE COMPUTATION IS DETERMINISTIC AND SAMPLES NOTHING- it is exact
      arithmetic over a declared grid, so there is no seed to declare and the
      list is empty by construction rather than by omission. Two executions
      at the same inputs must be BIT-IDENTICAL; any difference is an
      infrastructure failure under AGENTS.md rule 5. Any future variant
      introducing sampling must declare seeds and is a NEW contract.
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.25
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1
  stopping_rules:
    - >-
      STOP BEFORE ANY HEADLINE FIGURE if the Stage 0 primary-read gate is not
      closed; the admissible output in that case is the grid with every row
      tagged 'tradeoff inherited at reported confidence, primary source
      unread'.
    - Stop immediately if the free-resources null fails to reproduce S * T_online^2 = N.
    - Stop immediately if the single-target null shows preprocessing winning at T = 1.
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  invalidation_rules:
    - >-
      A run emitting an untagged value, or adding a group-operation count to
      a stored-element count without the declared alpha conversion recorded,
      is INVALID.
    - >-
      A run assigning a cost to a cell the feasibility gate declared
      infeasible is INVALID.
    - >-
      A run comparing against T * single-target rho instead of the declared
      multi-target comparator sqrt(T*N) is INVALID.
    - >-
      A run quoting a break-even without its (S, C_off, alpha) row or without
      the 'per curve' scope tag is INVALID.
    - >-
      A timeout, crash or dependency failure makes the run
      failed_infrastructure and is never negative evidence (AGENTS.md rule 5).
  success_criterion: >-
    The contract SUCCEEDS when both nulls pass, the break-even verdict
    T*(S, C_off) or NO_BREAK_EVEN is reported with its residual at every
    feasible cell and every alpha, the smallest break-even-admitting C_off is
    reported per S at T = N^{1/2} and T = N, the curve-free arm is identical,
    and the infeasible-cell table is emitted. Success is the production of
    those numbers in either direction- a break-even that survives charging is
    a successful run and the more valuable outcome.
  falsification_criterion:
    - >-
      F1 (falsifies the hypothesis). A break-even exists at any cell with
      C_off >= N, S <= N and T <= N. Statement (C) of H-ICEX-a91960 is
      arithmetically wrong.
    - >-
      F2 (voids the run). The single-target null shows preprocessing winning
      at T = 1, or the free-resources null fails to reproduce the published
      tradeoff. Instrumentation or model defect; no verdict may be read.
    - >-
      F3 (falsifies HEUR-PREP-1, and is the highest-value outcome). A filed
      construction achieving S*T^2 = O~(N) at offline cost o(N) group
      operations. The negative collapses and the break-even must be
      recomputed at the sourced offline cost.
    - >-
      F4 (halts the record). The curve-free arm differs from the main arm in
      any digit. An undeclared curve-dependent term entered the model.
    - >-
      F5 (scope finding, not a falsification). The curve-free arm is
      identical, as predicted. Then the break-even is a statement about a
      generic cyclic group of order N, and every citation must say so rather
      than describing it as an ECDLP result.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment, and the sha256 of every filed input entry
    - raw-result.json with every cell as (S, C_off, T, T_online, total, comparator, alpha, verdict, unit tags)
    - the curve-free arm's rows in the same file as the main arm
    - the infeasible-cell table with parameters and refusal reason
    - the free-resources null residual table, required below 1e-12
    - the smallest-break-even-admitting-C_off table, per S, at T = N^{1/2} and T = N
    - the Stage 0 primary-read gate report, naming what the source does and does not state about offline cost
  interpretation_limits:
    - >-
      COSTS A PUBLISHED ATTACK CLASS AND PROPOSES NOTHING NEW. No attack, no
      exponent moved, no lower bound, no measurement.
    - >-
      THE TRADEOFF IS INHERITED AT 'REPORTED' CONFIDENCE- KN-LIT-013's own
      corpus entry states the full paper was not read. Every figure is
      conditional on an unopened primary source until Stage 0 closes.
    - >-
      HEUR-PREP-1 IS THE SINGLE POINT OF FAILURE and is not a theorem. The
      negative verdict is exactly as strong as it and no stronger.
    - >-
      BREAK-EVEN COUNTS ARE PER CURVE. A deployment amortising one table
      across many curves is a different row that this contract does not
      compute.
    - >-
      NOT TESTABLE BY MEASUREMENT AT ANY REACHABLE SCALE. No advice table for
      a cryptographic group can be built, so this is arithmetic in a model
      and never an experiment; it is filed as a verification protocol for
      exactly that reason.
    - >-
      IF THE CURVE-FREE ARM IS IDENTICAL, as predicted, nothing here is a
      statement about elliptic curves.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. DESIGNED under TASK-20260904-e87737; execution requires a
      separate Coordinator approval decision. A message from any agent is not
      an approval.
    - >-
      The parent hypothesis is proof-oriented and carries a proof_search_map;
      its Stage 1 and Stage 2 nulls are HARD GATES and run before any
      headline figure is produced.
  id_allocation_provenance: >-
    EXP-ICEX-bc9a4c was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrating session must run the
    strict parse and tools/validate_ledger.py before this contract is relied
    on.
