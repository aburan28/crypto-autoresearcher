  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-ae9b44
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-25f711
  source_proposal: IDEA-20260906-3493fe
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-ae9b44 under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    separator-replay calibrator.

  objective: >
    Evaluate the exact identity that on
    the fork A→B→{C1,C2} with unit
    costs one has T_sep=4 when the
    separator stores B, and rejects
    the nearby claim T_nosep=4 whose
    true value is 6, on one frozen
    family (REAL, KF, NULL). Stage 0
    does not form a nested LHW
    generator and does not authorize
    Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL fork
      has T_sep=4 and r all ones; KF
      equal-cost-without-separator
      claim 4 rejected because
      T_nosep=6; NULL empty DAG
      rejected; negative cost
      rejected. Certificate kind none.
    formula: >
      T = sum_v r(v)c(v), unit costs.
      REAL: separator at B,
      r=(1,1,1,1), T=4.
      KF: claim T_nosep=4, actual
      r=(2,2,1,1), T=6, rejected
      as a generic replay target.
    claim_tier: observational

  inputs:
    fixture:
      real_dag:
        nodes: [A, B, C1, C2]
        edges: [[A, B], [B, C1], [B, C2]]
        costs: {A: 1, B: 1, C1: 1, C2: 1}
        separator: B
        must_r: {A: 1, B: 1, C1: 1, C2: 1}
        must_T: 4
      known_false:
        kind: equal_cost_without_separator
        must_T_nosep: 6
        claimed_T_nosep: 4
        must_reject: true
      matched_null:
        kind: empty_dag
        must_reject: true
      invalid:
        - {cost: -1, must_reject: true}

  controls:
    - name: known_false_equal_cost
      object: KF claim T_nosep equals T_sep
    - name: matched_null
      object: empty DAG
    - name: invalid_cost
      object: negative node cost

  independent_variables:
    - nodes
    - separator
    - costs
  metrics:
    primary:
      - fixture_pass
      - real_separator_pass
      - known_false_equal_cost_pass
      - reject_invalid_pass
      - null_empty_pass
    secondary: []
  primary_metrics:
    - fixture_pass
    - real_separator_pass
    - known_false_equal_cost_pass
    - reject_invalid_pass
    - null_empty_pass
  secondary_metrics: []
  seeds: [8]
  replication_plan: >
    One Stage 0 run. Deterministic
    exact integer tables. No sampling.
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  stopping_rules:
    - Stop after the five gates are recorded.
    - A timeout is failed_infrastructure, not a mathematical miss.
  invalidation_rules:
    - Missing artifact paths invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >
    All five Stage 0 gates true and
    certificate kind none on the
    frozen REAL / KF / NULL toys.
  falsification_criterion: >
    After fixture_pass, any REAL
    T_sep miss or KF-equal-cost accept
    at the frozen toys.
  success_criteria:
    - All five gates true and certificate kind none.
  falsification_criteria:
    - After fixture_pass, any REAL table miss or KF accept.
  required_artifacts:
    - raw-result.json
    - execution-report-s0.yaml
    - implementation/stage0_sepchk.py
  dependencies:
    - H-ECDLP-0ae933
    - DEC-20260908-ae9b44
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
  scientific_boundary: >
    Stage 0 P-S0-SEPCHK only. Not
    nested LHW. Not Esser-May. Not
    Semaev. Not a P1553 recurrence.
    Not a factor-base. Not Velu. Not
    a rho beat. No Stage 1 of
    EXP-ECDLP-9c04a3. No Stage 1 of
    EXP-ECDLP-166141.
