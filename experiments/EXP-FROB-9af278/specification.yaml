# =============================================================================
# EXP-FROB-9af278 -- EXTERNAL CONTRACT RECORD.
#
# Same kind of record as EXP-ICPERF-5fd141 and with the same warnings. This
# program did not author, approve or execute this work. The record exists so
# EV-FROB-b6e1e9's obstruction block can name the experiment its values are read
# from without inventing an identifier, which AGENTS.md rule 5 forbids.
#
# It differs from EXP-ICPERF-5fd141 in one way that makes it WEAKER, not
# stronger: that record's instruments live in a sibling repository with a
# reviewed pull-request history. These were written in ONE interactive session by
# ONE agent and are committed here only so the measurement binds to content.
#
# WHAT A READER MUST NOT CONCLUDE. That any Coordinator approved this, that any
# validator or red team here has read it, that a frozen protocol existed before
# the numbers, or that its invocations came from this harness. The binding to the
# actual work is BY CONTENT, in EV-FROB-b6e1e9's external_provenance block.
# =============================================================================
experiment:
  id: EXP-FROB-9af278
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted. H-FROB-a5bf86 is the nearest hypothesis and it
    would be easy to attach this to; none of its predictions is scored here. It
    tests LINEAR Frobenius-stable V cut from intermediate factors of T^n - 1, at
    n = 41 and 43, against the null 2^{m l}/m!. This work tests a NON-LINEAR
    orbit union of a random subspace, at n = 13..23, against the summed cost of
    the n gauge-fixed systems. Different object, different cells, different null.
  version: 1
  title: >-
    EXTERNAL: shift-encoded Frobenius orbit-union point decomposition at m = 2 --
    one system with n shift bits against the n gauge-fixed subspace systems it
    replaces, on CaDiCaL and on WDSat in both search modes
  status: external_completed
  status_note: >-
    `external_completed` for the reason EXP-ICPERF-5fd141 gives: the work is
    finished and content-bound, but this ledger's status vocabulary carries an
    approval and review history this record does not have. `approved_by` is null
    because no Coordinator approved it, and no `preregistered_prediction` is
    claimed because none was frozen before the measurement.
  external:
    repository: this repository
    instruments:
      - analysis/frobenius-orbit-union/frob_union_m2.py
      - analysis/frobenius-orbit-union/emit_anf.py
      - analysis/frobenius-orbit-union/run_wdsat.py
    results:
      - analysis/frobenius-orbit-union/union_n13.json
      - analysis/frobenius-orbit-union/union_n17.json
      - analysis/frobenius-orbit-union/union_n19.json
      - analysis/frobenius-orbit-union/union_n23.json
      - analysis/frobenius-orbit-union/wdsat19.json
      - analysis/frobenius-orbit-union/wdsat23.json
    third_party_solver:
      repository: github.com/aburan28/WDSat
      commit: 55d55b2620d768d9f7c78dcd8990a0689533c1d0
      note: >-
        The commit .github/workflows/koblitz-stage32-wdsat-capacity.yml in the
        sibling `crypto` repository pins. Built per arm from source with a
        config.h sized from the instances; the binary is not committed.
  objective: >-
    Run the REP+INDEX arm of "EXP-FROB-ORBIT-1" in
    research/ideas/frobenius_orbit_experiment_matrix.md, which is a name in a
    research slate rather than a frozen contract and had never been executed. At
    n = 131 no Frobenius-stable F_2-subspace of index-calculus dimension exists
    (IDEA-20260918-9abf42), but orbit unions are stable at any size because 131
    is prime. The question is whether parameterising such a union as
    (orbit representative, shift) makes ONE m = 2 decomposition system cheaper
    than the n systems the global Frobenius gauge leaves behind.
  inputs:
    curves: >-
      Koblitz y^2 + xy = x^3 + a x^2 + 1, a in {0, 1} chosen per degree for the
      larger prime-order subgroup, over F_{2^n} for n in {13, 17, 19, 23}.
    factor_base: >-
      S = union of the n Frobenius images of a random F_2-subspace V' of
      dimension l' = ceil(n/2) - ceil(log2 n), so |S| is near 2^{n/2}.
    targets: >-
      16 to 40 per degree, drawn as [k]G in the prime-order subgroup from a
      fixed seed; the WDSat export reproduces the same random stream and is
      cross-checked target by target against the CaDiCaL run.
  controls:
    - >-
      GROUND TRUTH, SOLVER-FREE: an exhaustive solve of the quadratic
      S_3(x_1, x_2, x_R) = 0 over every x_1 in V', with membership of x_2 in S
      checked directly. Every arm's verdict is compared against it.
    - >-
      POSITIVE CONTROL: four planted decompositions with both summands in the
      required sets, required to be found by exactly the predicted shift. Needed
      because every target in the largest cells refutes, so verdict agreement
      alone would also be satisfied by a solver that never finds anything.
    - >-
      MODEL RE-CHECK: every model returned is re-evaluated against S_3 and
      against membership in V' and S before it counts.
    - >-
      SECOND SOLVER AND SECOND SEARCH MODE: CaDiCaL 1.5.3 and WDSat in both its
      default and its XORGAUSS (XG-ext) mode, so a negative cannot rest on one
      solver's treatment of XOR constraints.
    - >-
      BRANCHING ORDER: default variable order and a shift-bits-first priority
      prefix, so the arm under test is reported in its favourable configuration.
  independent_variables:
    - field degree n in {13, 17, 19, 23}
    - encoding: n separate gauge-fixed systems | one-hot shift bits | binary shift bits
    - solver: CaDiCaL 1.5.3 | WDSat default | WDSat XG-ext
    - branching order: solver default | shift bits first
  metrics:
    primary:
      - >-
        solver conflicts per target, summed over the n systems for the baseline
        arm and taken from the single system for the encoded arms
    secondary:
      - propagations per target
      - wall seconds per target (NOT comparable between arms; the baseline pays n process launches)
      - decisions per target
  heuristic_under_test: null
  preregistered_prediction:
    quantity: null
    formula: null
    source: null
    note: >-
      NONE, and this is the record's largest methodological weakness. No
      prediction was frozen before the measurement. The research slate's kill
      criteria do name this outcome in advance ("representative/index
      parameterization increases solver branching enough to erase the orbit
      saving"), which is the nearest thing to a prior, but it is prose in a slate
      and not a preregistration.
  scale_relevance:
    tier: toy
    justification: >-
      n <= 23 against targets at 131 and above; the largest prime-order subgroup
      touched is 23 bits. m = 2 only, where an index calculus at a cryptographic
      degree would need m about n/l'. NO transfer to larger n or larger m is
      claimed, and the additive-overhead reading's prediction about m is stated
      as untested.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [7]
    independent_instances: 0
    note: >-
      One seed per degree. The n = 19 WDSat cell was re-run after an unrelated
      output-parsing fix and reproduced to the exact conflict count, which is a
      determinism check rather than an independent instance.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: null
    maximum_runs: null
    maximum_workers: null
  stopping_rules: []
  invalidation_rules:
    - >-
      An arm whose model violates its own instance is not measurable and is
      excluded rather than reported. This fired: the binary shift encoding
      carries degree-7 monomials, its two WDSat search modes disagree on
      satisfiability, and the default mode returned a model violating 11 of an
      instance's 32 rows at n = 19. Degree 7 is outside the degree 3-4 envelope
      every shipped config.h profile targets.
  success_criterion: >-
    NO CRITERION WAS DECLARED BEFORE THE MEASUREMENT, and this field records that
    rather than inventing one retrospectively; EXP-ICPERF-5fd141 leaves the same
    field null for the same reason and this record states it in words so the
    ledger validator's required-field check is answered honestly rather than
    skipped. The decision content is the ratio itself, and the slate the arm
    comes from names its direction in advance: conflicts for the encoded arm
    MATERIALLY BELOW the summed baseline on refuted targets would have been the
    positive result the REP+INDEX arm was proposed to look for, and at or above
    it is the negative. The measurement came out at or above 1 in all eight
    cells.
  falsification_criterion: >-
    Not applicable as written: this is a cost comparison with no hypothesis
    attached. The decision content is the ratio itself. Had the encoded arm come
    in materially below 1 on the refuted targets, that would have been the
    positive result the slate's REP+INDEX arm was proposed to look for.
  required_artifacts:
    - the three instruments, bound by sha256 in EV-FROB-b6e1e9
    - per-target results for every cell, including the excluded binary arm's rows
    - analysis/frobenius-orbit-union/README.md, with the reproduction commands
  assigned_to: null
  assigned_to_note: >-
    Null, not `executor`. No handoff dispatched this and no executor ran it.
  approved_by: null
