# EXP-BINSTD-79a4b0
# Doubling-gap arithmetic. No relation collection.
# Approved by DEC-20261003-14e2e6.
experiment:
  id: EXP-BINSTD-79a4b0
  hypothesis_id: H-BINSTD-a3ef0a
  source_idea: IDEA-20261001-9d8520
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Doubling factor versus the n gaps
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-14e2e6
  objective: >-
    Check the excess 2, the span excess 8, and the product 32.
  inputs:
    n_17: 17
    n_23: 23
    n_31: 31
    ell_lo: 3
    ell_hi: 4
    cells: 6
    factor: 2
    n_gap_lo: 6
    n_gap_hi: 8
    gap_excess: 2
    n_span: 14
    span_excess: 8
    twice_lo_excess: 2
    gap_product: 32
    doubled_cells: 12
    ell_product: 12
    slot_gap: 0
    n_sum: 71
    n_product: 12121
  controls:
    - >-
      Twenty-three minus 17 is 6, and 31 minus 23 is 8. Eight minus
      6 is 2. Reporting the larger gap as 6 invalidates the run.
    - >-
      Thirty-one minus 17 is 14. Fourteen minus 6 is 8. Fourteen
      minus twice 6 is 2. The product of 8, 2, and 2 is 32.
    - >-
      Three times 2 is 6. Six times 2 is 12, and 3 times 4 is 12, so
      12 minus 12 is 0. Seventeen plus 23 plus 31 is 71. Seventeen
      times 23 times 31 is 12121.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gaps, span, product}
    - route in {difference, product}
  metrics:
    primary:
      - gap_excess
      - gap_product
      - implementations_agree
    secondary:
      - span_excess
      - slot_gap
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Eight exceeds 6 by 2. Fourteen exceeds 6 by 8. The product of
      8, 2, and 2 is 32.
    formula: >-
      Subtract 6 from 8. Subtract 6 from 14. Multiply 8, 2, and 2.
      Compare 6 times 2 with 3 times 4.
    source: >-
      IDEA-20261001-9d8520 states the n list 17, 23, 31, the
      dimension list 3 and 4, and a bound that doubles, read
      2026-10-03. Alpha, the smoothness bound, and the orphan
      minimum are not named there. The gaps were recomputed in this
      design session. That computation is not a run. No relation was
      collected.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written doubling. No transfer to an absorption fraction.
    correspondence: null
  tail_checks:
    - The product 32 and the span excess 8 are required. A check that stops at the excess 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The gap excess is not 2.
    - The span excess is not 8.
    - The product is not 32.
    - A relation is collected, or the larger n-gap is reported as 6.
  success_criterion: >-
    Both runs agree that 8 minus 6 is 2, that 14 minus 6 is 8, that
    14 minus twice 6 is 2, that 6 times 2 equals 12, and that the
    product of 8, 2, and 2 is 32.
  falsification_criterion: >-
    The runs agree that 8 minus 6 is computed, and that difference
    is not 2.
  required_artifacts:
    - experiments/EXP-BINSTD-79a4b0/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-79a4b0/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-79a4b0/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-79a4b0/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-79a4b0/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-79a4b0/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any relation collection, orphan score, or absorption fraction.
    - Any claim that doubling a bound absorbs a candidate.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
