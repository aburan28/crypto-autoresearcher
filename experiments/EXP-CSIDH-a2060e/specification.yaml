      "source_dag_identity": "BLMP2019 primary PDF permanent identifier 9b88023d7d9ef3f55b11b6f009131c9f, sections3.3,5.3 and6.1; exact finite adaptation below, not a downloaded mutable implementation.",
      "action_domain": "Enumerate all A in F11 with A^2!=4 and #E_A(F11)=12, E_A:y^2=x^3+A*x^2+x. For each A, e code0,1,2 means e=0,+1,-1. For r=1,2,4 enumerate all ordered x seed tuples in F11^r uniformly, with replacement. Preserve A,e,x and all input registers. No scalar or cost-based selection of curves/seeds.",
      "invalid_domain": "All n-bit arithmetic registers use canonical little-endian representatives0..p-1. Primitive maps send invalid operands to zero. Full action on A outside certified domain, e code3, or noncanonical x returns output coefficient0 and invalid/failure bit1 after padded computation; valid e=0 returns A and failure0. Invalid inputs still define a fixed reversible gate permutation; scientific success law is only on the valid domain."
    },
    "methods": {
      "gate_library": "Allowed gates are NOT,CNOT,Toffoli only, no measurement/reset or phase gates. For each primitive f with m input bits and n output bits synthesize |u,t> -> |u,t XOR f(u)> by lexicographic input minterms, output bits low-to-high. For a minterm set NOT on each zero control in increasing wire order, apply an m-controlled NOT to the output bit, then undo those NOTs in reverse. m>=3 uses m-2 initially zero scratch wires: chain ANDs into scratch, final Toffoli to target, reverse chain, exactly2m-3 Toffolis; m=2 one Toffoli,m=1 CNOT,m=0 NOT. Reuse scratch only after zeroing. No cancellation, peephole optimization or gate reordering except the deterministic schedule rule. Freeze primitive truth tables and gate lists before target enumeration.",
      "primitives": "ADD(a,b)=a+b modp; SUB=a-b modp; MUL=a*b modp; SQR=a^2 modp; INV0(a)=a^(p-2) modp for nonzero a and0 otherwise; ZERO(a), RESIDUE(a)=[a=0 or a^((p-1)/2)=1], MUX(bit,a,b), and constant-field multiplication have their literal truth tables. Invalid field arguments produce zero. No free field-operation cost: every occurrence is expanded through the same synthesis. Separate INV0 is the matched incumbent for this finite library, not an optimal or cryptographic inverter. Constant propagation only when an operand is a literal compile-time constant; no secret-branch simplification.",
      "arithmetic_interface": "For every valid z tuple, zero output Y and zero workspace, implement |z,0,0> -> |z,inv0(z_1),...,inv0(z_k),0>. This clean-input isometry is coherent on arbitrary superpositions by linearity of the phase-free reversible gate list. The circuit is a permutation on all bit strings, but the claimed output semantics require initially zero Y/workspace. Do not call CNOT copying classical basis outputs cloning of arbitrary quantum states.",
      "masked_tree": "For k=1 use exactly the reference INV0 gate list. For k=2,4 use the complete balanced binary tree with leaves in input order. Compute coherent f_i=[z_i=0]; copy u_i=z_i if f_i=0 else1 into clean leaves P_i using bit-controlled XOR/MUX. Compute internal P_v=MUL(P_left,P_right). Compute only R_root=INV0(P_root); descend preorder with R_left=MUL(R_parent,P_right), R_right=MUL(R_parent,P_left). Copy each R_i to Y_i only when f_i=0. To clean without a second inversion, construct S leaves from Y_i if f_i=0 else1, and bottom-up products S_v. Since S_v equals P_v^-1, XOR S_v into every R_v (including leaves) to clear R. Reverse the S product tree and leaf preparation; reverse P product tree and leaf preparation; recompute ZERO(z_i) into flags to clear them. Inputs and legal output Y remain. The asserted inverse-tree identity is checked before any performance inference. For k>=2 there is one clean INV0 and exactly6(k-1) clean MUL calls outside the primitive internals, plus masks/copies/flags and their cleanup. No omitted inversion or cleanup.",
      "action_dag": "For each valid A,e and every candidate lane i, let s=-1 if e code2 and+1 otherwise (including padded e0); A_s=s*A mod11. Compute h_i=x_i^3+A_s*x_i^2+x_i and rational_i=RESIDUE(h_i). Starting X=x_i,Z=1, apply two projective xDBL steps: T=(X+Z)^2,U=(X-Z)^2,E=T-U,Xnew=T*U,Znew=E*(U+((A_s+2)/4)*E), where1/4=3 mod11; all updates use old X,Z registers. This computes [4] of a rational point, with projective exceptional outputs retained. All r lane Z_Q denominators are computed from input A,e,x only and share no normalized output ancestor: freeze that ancestor certificate. Baseline uses r separate INV0(Z_Q); candidate replaces exactly that block by masked_tree. Both compute q_i=X_Qi*inv0(Z_Qi). valid_i=rational_i AND Z_Qi!=0 AND q_i!=0. Select lex-first valid lane by fixed prefix-found bits/MUX; if none set q=0 and found0. Unselected lanes are still computed and cleaned.",
      "isogeny": "From selected q use Y=q-1,T=q+1,a=A_s+2,d=A_s-2. Compute a3=(a*a)*a,d3=(d*d)*d,T8=((T*T)^2)^2,Y8=((Y*Y)^2)^2; a_prime=a3*T8,d_prime=d3*Y8; B=2*(a_prime+d_prime)*INV0(a_prime-d_prime). This final INV0 depends on selected normalized q and must remain outside the candidate batch. success=found AND (a_prime-d_prime)!=0 AND B^2!=4; output s*B on success, else input A and failure1. For e0 output A,failure0 regardless of padded internal failures. Output registers contain coefficient plus failure bit; original inputs are preserved. Record any valid order3 kernel producing denominator0/singular B as formula/interface failure, not a successful action.",
      "whole_oracle_cleanup": "Construct an acyclic sequence of clean out-of-place primitives for every node in action_dag/isogeny and validity selection; no live register is overwritten. The masked block itself has the clean-input interface above. Compute coefficient/failure into temporary registers, CNOT-copy into initially zero final outputs, then reverse the entire computation including every candidate block, masks, selection bits and final normalization. Count the full compute-copy-uncompute gate list. Each batched action therefore contains a forward and reverse block; never quote its single forward inversion as the entire oracle count.",
      "reference_check": "Independent checker uses affine point addition on E_{sA} to enumerate each point above x_i and compute [4]P; compare rational flags and normalized Q. For a selected order3 Q, enumerate K={O,Q,-Q}, partition all E_{sA}(F11) into K cosets, and independently compute Velu quotient: for Weierstrass a2=A_s,a4=1,a6=0, use translation to short Weierstrass over F11 and direct sums x(P+T)-x(T), y(P+T)-y(T) for T in K{O}. Independently derive quotient coefficients by fitting all finite image points and compare j-invariant and F11-isomorphism class to E_B; verify kernel and homomorphism for every pair in the finite group. If point counts alone agree this is insufficient. A mismatch invalidates action correctness even if candidate and baseline circuits agree. The e=-1 result must match independently applying the L3 action on E_-A then negating coefficient; e0 identity checked separately. If fitting quotient coefficients from the small rational image is underdetermined, use exact rational functions over F11(x)[y]/(y^2-(x^3+A_s*x^2+x)) for the affine addition/Velu sums; solve coefficient identities symbolically, not by selecting a convenient finite fit. Translate x to x+A_s/3 for short Weierstrass arithmetic, and independently verify the polynomial identity of the codomain. Enumerate all u in F11* and r in F11 for a rational Weierstrass isomorphism to E_B; reject a j-only match without this check. For points in K return infinity explicitly rather than evaluating zero denominators.",
      "basis_verification": "Arithmetic: enumerate every valid z tuple at each p,k; compare candidate/reference/direct inv0, unchanged inputs, zero ancillas and exact gate-list inverse roundtrip. Exhaustively verify each primitive truth table for all input and target bit strings. Action: enumerate every certified A,e,x tuple and check complete output/failure/input preservation/ancilla zero against independent arithmetic and quotient checker. Store per-input outcomes, but gate lists are fixed before simulation; every basis input must execute the identical gate sequence.",
      "resource_schedule": "Q_cap=8192 clean working qubits, excluding preserved input/final-output wires reported separately. Compare baseline with separate inversions issued left-to-right serially and baseline with independent gates ASAP scheduled, as well as candidate under ASAP schedule. ASAP gate layer is1+max prior layer on all touched wires, tie original gate order. Report full gate depth and Toffoli dependency depth separately. The primary fixed depth cap is the ASAP baseline full depth D_ref for that cell; candidate cannot enlarge it. Toffoli savings qualify only if Q_peak<=Q_cap and depth<=D_ref; additional width within cap remains a disclosed tradeoff. Exceeding cap yields ineligible cell, not a favorable tradeoff chosen after the run.",
      "cost_accounting": "For every cell report expanded NOT/CNOT/Toffoli counts, whole depth, Toffoli depth, input/output/clean logical width, qubit-layer volume, classical synthesis and all-input simulation CPU/wall/RSS, gate-list/fixture/certificate bytes. Action ratio is complete oracle candidate/ref counts, including outer uncomputation and the dependent final inversion. Record exact failure numerator/denominator separately for each A,e over11^r seeds; candidate/ref law must be equal pointwise. With fresh independent seed registers, expected repetitions1/(1-f) are only a modeled classical repeat metric; no quantum amplitude amplification saving is inferred. Both raw per-oracle and per-success modeled counts are retained; f=1 means infinite per-success cost. Acquiring/deriving the source DAG, generating gate tables and validation are charged, never free advice."
