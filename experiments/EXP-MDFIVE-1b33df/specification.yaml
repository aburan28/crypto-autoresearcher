experiment:
  id: EXP-MDFIVE-1b33df
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-13db82; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-13db82
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute four candidate ceiling observables plus two null observables across a declared family
    of MD5 and MD4 variants, enumerate their fibres, resolve fibre pairs by direct computation, and
    emit an identifiability audit table.
  objective: 'The run reduces one uncertainty: whether any observable this bucket could use to carry
    a method-ceiling claim actually distinguishes objects on opposite sides of that claim, checked
    before any such claim is written. As parts: (i) it forces each candidate into an explicit parameter-free
    functional form, which alone eliminates candidates that only appear to be observables, and records
    the eliminated ones as under-specified rather than as failures; (ii) it computes every candidate
    across a declared variant family and enumerates the fibres, then resolves fibre pairs by executing
    the cheapest available status test on both members, so a collision is established by computation
    rather than asserted; (iii) it rewrites each intended claim with explicit quantifier order and
    checks whether the split, the neutral-word choice or the matching point is permitted to depend
    on the target, which is the dependence a uniform ceiling claim would forbid. The run reduces no
    uncertainty about MD5''s preimage cost and produces no attack. Its most valuable outcome is a
    collision, because a cheap falsification of an observable before compute is spent on it is exactly
    what KN-TECH-080 audit 2 exists to deliver, and the record is written so that such a collision
    reads as a result rather than as a setback.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: within the declared variant family,
      candidate observable X takes equal values on variants A and B whose status with respect to the
      stated conclusion differs as established by the declared status test, so X does not identify
      that conclusion within that family; or, for other candidates, no such pair was found within
      that family. What does NOT follow: that any ceiling exists or does not, that a collided observable
      is useless for other purposes, that a clean observable supports any claim, or anything about
      MD5''s security.'
  inputs:
    procedure: STAGE 0 freeze the candidate observable list and the two nulls, and write each intended
      ceiling claim in prose before any computation; cost review time. STAGE 1 build the variant family
      as specification records and fingerprint each; cost hours. STAGE 2 force each candidate into
      the explicit signature and mark failures as under-specified; cost hours. STAGE 3 compute every
      observable on every variant and enumerate fibres; cost seconds. STAGE 4 classify both nulls
      and halt if either is misclassified; cost seconds. STAGE 5 for each fibre pair among real candidates,
      run the declared status test on both members under a fixed budget, recording unresolved where
      the budget is exhausted, and never recording budget exhaustion as equal status; cost hours and
      proportional to the number of collisions found. STAGE 6 perform the quantifier rewrites and
      check witness dependence against the control rewrite; cost review time. STAGE 7 emit the audit
      table, the full observable matrix and the variant fingerprints.
    instrument: Python 3.11 standard library for the observable computations and fibre enumeration,
      run under harness/runner.py for the manifest and variant fingerprints. The candidate observables
      are imported from the sibling records' modules rather than reimplemented, with content hashes
      recorded so a later change to any of them invalidates this audit explicitly. Status tests reuse
      the split-search and condition-forcing routines from the sibling records, again imported. Validated
      RFC 1321 MD5 and RFC 1320 MD4 implementations are needed only by the wavefront candidate. No
      Sage, no solver, no symbolic algebra system.
    parameters: 'Variant family: MD5 reduced to 16, 32, 48 and 64 steps; MD5 with 20 sampled permutations
      of its 64 rotation constants; MD5 with reversed schedule; MD4 at 12, 24, 36 and 48 steps; giving
      29 variants. Candidates: chunk separation, freedom-curve divergence index, pinned-word mask
      size, wavefront separation. Nulls: output length in bits, specification content hash. Status-test
      budget: 10^7 primitive evaluations per variant, fixed in advance. Quantifier rewrites: one per
      intended claim, plus one control rewrite of a claim known to be uniform.'
  controls:
  - Output-length observable as a guaranteed-collided null, classified in the same pass.
  - Specification-hash observable as a guaranteed-singleton null, classified in the same pass.
  - Round-reduced MD5 variants providing a graded family where status is expected to change monotonically,
    so a fibre spanning a status boundary is detectable.
  - Rotation-permuted variants providing perturbations that leave the schedule untouched, separating
    schedule-driven from constant-driven observable movement.
  - A quantifier rewrite of a claim known to be uniform, used as a control that the rewrite procedure
    does not manufacture spurious witness dependence.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a deliberately non-identifying observable included
    in the candidate list, namely the primitive''s output length in bits, which is 128 for every variant
    in the family and therefore has a fibre containing the entire family. The identical audit must
    flag it as collided at the first comparison. A second null is a deliberately over-identifying
    observable, the content hash of the full specification, whose fibres are all singletons and which
    the audit must flag as a change of coordinates rather than a lossy observable. For the audit to
    mean anything both nulls must be classified correctly; if the audit passes the output-length observable
    or fails to flag the specification hash, the audit''s own logic is broken and no verdict on any
    real candidate may be reported.'
  independent_variables:
  - candidate observable identity
  - variant identity within the declared family
  - 'perturbation type: round reduction, rotation permutation, schedule reversal, primitive substitution'
  - status-test budget
  metrics:
    primary:
    - observable value per candidate per variant
    - largest fibre size per candidate
    - 'status-test outcome per fibre pair: differs, same, or unresolved'
    - 'audit verdict per candidate: identifying, collided, or under-specified'
    secondary:
    - null observable classifications
    - number of fibre pairs left unresolved by budget exhaustion
    - quantifier rewrite verdicts
    - observable module content hashes
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The per-candidate audit verdict, and the number of real candidates classified as collided.
    formula: 'Candidate X is collided iff there exist variants A, B in the declared family with X(A)
      = X(B) and a status test returning differing status for A and B within budget. X is under-specified
      iff it cannot be written as a parameter-free function of a specification. Otherwise X is identifying
      within the family. Predicted: at least 1 and at most 3 of the 4 real candidates collided; output-length
      null collided; specification-hash null all-singleton.'
    source: Pre-registered in the parent proposal IDEA-20260816-13db82 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Observables are computed on full MD5 and MD4 specifications and on round-reduced
      variants of them, so no size reduction occurs; the toy label refers to compute cost. The stated
      scope, which is not an extrapolation but a boundary, is that every verdict holds within the
      declared 29-variant family: a clean verdict means no collision was found there and explicitly
      does not assert that none exists in a larger family, and the record forbids reading it that
      way.'
    correspondence: null
  tail_checks:
  - Both null observables must be classified as predicted or the audit halts.
  - Every observable value must match the value the owning sibling record reports for MD5, or the
    imported module has drifted.
  - Fibre enumeration must be checked against a brute-force pairwise comparison on the 29 variants,
    which is trivially cheap and catches sorting errors.
  - Unresolved fibre pairs must be reported separately and never folded into the clean count.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if either null observable is misclassified.
  - Halt if any imported observable module's content hash differs from the version its owning record
    used.
  - Enforce the status-test budget strictly and record unresolved rather than extending it.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both nulls are classified as predicted, between one and three real candidates
    are classified as collided with their collisions established by an in-budget status test, at least
    one real candidate remains identifying within the family, and at least one quantifier rewrite
    exposes a target-dependent witness or the control rewrite confirms none exist.
  falsification_criterion:
  - Either null observable is misclassified.
  - All four real candidates are collided.
  - No real candidate is collided and every fibre is a singleton.
  - Every fibre pair is unresolved within budget.
  - An imported observable's value on MD5 disagrees with the value its owning record reports.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-13db82
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the variant family, since the family determines every fibre and a
    family chosen after seeing observable values would make the audit unfalsifiable.
  - 'The status test for each candidate needs specifying: what it means for two variants to differ
    in status with respect to a ceiling claim is not obvious and cannot be left to the run.'
  - A ruling is needed on whether round-reduced variants count as ground-truth objects for the purposes
    of audit 2, since a reduced-round variant is a different primitive and a collision between it
    and full MD5 may be uninformative.
