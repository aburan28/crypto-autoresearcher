experiment:
  id: EXP-MDFIVE-b8d369
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c20a5b; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c20a5b
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Measure executed generic baselines and executed attack costs for collisions and preimages
    on a 32-bit-state MD5-shaped analogue across round counts, with a random-bijection null and an
    equal-effort audit.
  objective: 'The run reduces one uncertainty: whether the collision-preimage gain asymmetry reproduces
    at a size where both true costs are measurable rather than assumed. As parts: (i) it executes
    both generic baselines rather than quoting them, so the denominators of both gains are measurements
    from the same machine and the same evaluation counter; (ii) it executes one declared collision
    method and one declared preimage method per round count and reports evaluations to first success,
    with the methods and their implementation budgets declared before any run so that a gain difference
    cannot be manufactured by uneven effort; (iii) it repeats everything on a random-bijection null
    with identical schedule, mode and padding, which is the only way to know that a measured gain
    comes from the analogue''s structure rather than from the harness. The run reduces no uncertainty
    about full MD5 at all, and the record is written so that no number in it can be quoted as a statement
    about MD5. If the gains coincide, the run has measured that the asymmetry does not reproduce at
    32 bits under these methods, which is a usable obstruction with a named size, named methods and
    named remaining alternatives, and it is not a fatigue report because it carries the measured values
    that a later record can compare against at a larger size.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for mini-MD5 as defined, at round
      counts r in the swept range, under the two declared methods, the measured collision gain over
      an executed birthday baseline is G_coll(r) bits and the measured preimage gain over an executed
      exhaustive baseline is G_pre(r) bits, with the null at zero. What does NOT follow: nothing about
      full MD5''s collision or preimage cost, no extrapolation of either curve in state size, no claim
      that either executed method is optimal at this size, and no security statement about any deployed
      primitive.'
  inputs:
    procedure: STAGE 0 define mini-MD5 in the specification file, including reduced schedule, reduced
      rotation constants, padding and Merkle-Damgard strengthening, and validate the implementation
      on hand-computed vectors; cost hours. STAGE 1 execute the exhaustive preimage baseline over
      the full 2^32 message space for 100 random targets and record evaluations and wall clock; cost
      minutes to an hour vectorised. STAGE 2 execute the birthday collision baseline for 100 trials;
      cost minutes. STAGE 3 declare both attack methods and their implementation budgets in writing;
      cost review time, and this stage is what makes the equal-effort audit possible. STAGE 4 implement
      and run the collision arm for r = 1..R, 100 trials each; cost hours. STAGE 5 implement and run
      the preimage arm, including computing the neutral-word bipartition from the reduced schedule,
      for the same r range and trial count; cost hours. STAGE 6 rerun STAGES 1 through 5 on the random-bijection
      null in the same invocation; cost doubles. STAGE 7 run the schedule-shuffled control at two
      round counts. STAGE 8 compute both gain curves with bootstrap intervals and emit the manifest,
      per-trial evaluation counts, and every literal collision pair and preimage found, each re-verified
      by an independent implementation of the analogue.
    instrument: Python 3.11 with numpy for vectorised 8-bit-word arithmetic over batched candidate
      messages, run under harness/runner.py so seeds, wall-clock ceiling and evaluation counters land
      in the manifest. Two independent implementations of mini-MD5, one for the search and one for
      certificate re-verification, written from the same specification by separate code paths. Evaluation
      counting is instrumented inside the primitive so that cost is measured in primitive calls and
      never in seconds. The null primitive is a keyed 32-bit bijection behind the same interface.
      No Sage, no SAT solver, no external cryptanalysis library.
    parameters: 'mini-MD5: 4 state words of 8 bits, 32-bit chaining value, 8 message words of 8 bits
      per 64-bit block, schedule pattern reduced from MD5 proportionally, rotation constants taken
      modulo 8, round count r swept 1..4, steps per round 8. Exhaustive preimage baseline: full 2^32
      sweep per target, 100 targets. Birthday baseline: 100 trials. Attack arms: 100 trials per round
      count. Padding: Merkle-Damgard strengthening with a 16-bit length field. Null: 100 trials per
      cell. Schedule-shuffled control: r in {2, 3}, 100 trials.'
  controls:
  - Random-bijection null primitive with identical schedule, mode and padding, all stages rerun in
    the same invocation.
  - Exhaustive preimage baseline actually executed rather than assumed at 2^32, giving a measured
    denominator.
  - Birthday collision baseline actually executed rather than assumed at 2^16.
  - A schedule-shuffled analogue, isolating whether the collision gain depends on the reduced MD5
    schedule or on the step function.
  - An equal-effort audit in which both arms are given the same declared implementation budget in
    lines and hours, recorded in the manifest.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null primitive replaces mini-MD5''s step function with a random
    bijection on the 32-bit state keyed by the message word, keeping the schedule, the block structure,
    the padding and the Merkle-Damgard mode identical. Every stage runs against it in the same invocation.
    The null must show both gains within noise of zero at every r, because a random bijection offers
    nothing for message modification to force and nothing for a split to exploit. For the signal arm
    to mean anything, the null gains must be below one bit at every r; a null showing positive gain
    means the gain is produced by the search harness or by the baseline measurement and no signal-arm
    number may be reported.'
  independent_variables:
  - round count r
  - 'setting: collision versus preimage'
  - 'primitive arm: mini-MD5, random-bijection null, schedule-shuffled'
  - 'method: declared attack method versus executed generic baseline'
  metrics:
    primary:
    - evaluations to first collision per trial
    - evaluations to first preimage per trial
    - executed generic collision baseline in evaluations
    - executed generic preimage baseline in evaluations
    - G_coll(r) and G_pre(r) with bootstrap intervals
    secondary:
    - split table size in entries for the preimage arm
    - number of near-collision blocks used per collision
    - declared implementation effort per arm
    - wall clock per stage, reported for budget accounting only and excluded from every gain
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The two gain curves G_coll(r) and G_pre(r) over r = 1..4, and their separation at r
      = 2.
    formula: 'G_coll(r) = log2(median executed birthday baseline evaluations) - log2(median collision-arm
      evaluations at r). G_pre(r) = log2(median executed exhaustive baseline evaluations) - log2(median
      preimage-arm evaluations at r). Predicted: G_coll(2) >= 4 bits, G_pre(r) <= 2 bits for all r
      >= 2, and both null curves below 1 bit everywhere.'
    source: Pre-registered in the parent proposal IDEA-20260816-c20a5b before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The tested object is a 32-bit-chaining-value analogue with 8-bit words and at
      most 4 rounds, chosen because 2^32 is the largest space in which an exhaustive preimage baseline
      can actually be executed rather than assumed, which is the whole point of the design. The transfer
      assumption to full MD5 is stated and is NOT claimed to hold: that a gain asymmetry observed
      at 32 bits with 8-bit words and rotations reduced modulo 8 is indicative of behaviour at 128
      bits with 32-bit words is unproven, is not tested by this run, and no number from this run may
      be quoted for MD5. The run''s value is that it measures at a scale where the ground truth exists
      at all.'
    correspondence: null
  tail_checks:
  - Every collision pair and every preimage must be re-verified by the second independent implementation;
    an unverified certificate is discarded and the trial recorded as failed.
  - The executed generic baselines must fall within a factor of 4 of 2^16 and 2^32 respectively, or
    the analogue is degenerate and the run halts.
  - The null must show both gains below 1 bit at every r.
  - Reduced rotation constants must be checked for degeneracy, specifically that no round has all
    rotations equal to zero modulo 8.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if the analogue is degenerate at STAGE 1 or STAGE 2.
  - Halt the preimage arm at a declared per-trial evaluation budget and record the trial as censored,
    never as evidence that no preimage structure exists, per the anchor question's explicit constraint.
  - Fix trial counts at 100 per cell before the run and do not extend a cell after seeing its gain.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: G_coll(2) is at least 4 bits with a bootstrap interval excluding 2 bits, G_pre(r)
    is at most 2 bits for every r >= 2, both null curves stay below 1 bit, every certificate re-verifies
    independently, and the equal-effort audit shows implementation budgets within a factor of 2.
  falsification_criterion:
  - G_coll and G_pre agree within 2 bits at every r.
  - Either null curve exceeds 1 bit at any r.
  - Executed generic baselines depart from 2^16 or 2^32 by more than a factor of 4.
  - The schedule-shuffled control reproduces G_coll at r = 2 within 1 bit, showing the collision gain
    is not schedule-dependent as the design assumes.
  - The equal-effort audit shows arm budgets differing by more than a factor of 2.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c20a5b
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - 'The reduced rotation constants need a Coordinator ruling: taking MD5''s constants modulo 8 is
    one choice among several and a degenerate choice would invalidate the analogue before any measurement.'
  - The declared preimage method needs specification in enough detail that its implementation budget
    is auditable; a vague method makes the equal-effort audit unenforceable and the gain difference
    uninterpretable.
  - The mapping from MD5's 64-step schedule to the analogue's reduced schedule needs to be fixed explicitly,
    since several proportional reductions are defensible and they give different neutral-word bipartitions.
  - Whether 4 rounds is the right maximum r, given that the analogue's mixing is far faster per round
    than MD5's, needs a ruling before the sweep is budgeted.
