# =============================================================================
# EXP-VOLC-4f08df — version 1, approved by DEC-20261006-45ceb1. Frozen
# ordinary 7-isogeny edge census for IDEA-20261006-5b154f. Success is
# the idea's prediction: G is at least 1. The concrete negative is
# G=0 after a complete pass with the instrument checks passed. This
# design session did not factor Phi_7 at any j and did not record G.
# No discrete logarithm is authorized. Source idea bytes are copied
# unchanged from origin/design/ectd-e7ad98-conductor, blob
# e6c2b8b220b38071c451128e9edf256bb6c1f02b.
# =============================================================================
experiment:
  id: EXP-VOLC-4f08df
  hypothesis_id: H-VOLC-7981f6
  question_id: RQ-VOLC-f6253b
  source_idea: IDEA-20261006-5b154f
  version: 1
  title: >-
    Ordinary 7-isogeny edges with unequal Phi_7 root counts, primes
    23 through 61
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-45ceb1
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that G is positive, does not assert
      that G is zero, and does not assert that an exponent moves.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Work only on the ten primes from 23 through 61 listed below, at
      level 7, on ordinary j-invariants. Count unordered edges whose
      distinct Phi_7 root counts differ. Report the level-11 count on
      the three primes 23, 29, and 31 beside G and do not use it to
      choose the reading row. Do not search for a discrete logarithm
      and do not add a prime.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether G is at least 1. The concrete negative is that the
    instrument checks pass and G is 0. No faster discrete-logarithm
    algorithm is in scope.

  inputs:
    primes: >-
      The only primes are 23, 29, 31, 37, 41, 43, 47, 53, 59, and 61.
      Confirm each by trial division by every prime at most 7. The
      integer 7 is not in the list. If any listed integer is composite,
      the reading is instrument_failure and no j is scored.
    phi7_table: >-
      Read experiments/EXP-SSIQ-a85692/implementation/modpoly_data/phi_j_7.txt
      and require sha256
      f1ae3c89e94d281d9042defd6ef37f1841bde206650dff8222969d85edda7686.
      Each non-blank line is [i,j] c with i>=j, the coefficient of
      X^i Y^j. Fill j>i by symmetry. Require that the largest i is 8
      and that the coefficient [8,0] is 1. A hash mismatch, a line
      with j>i, a degree other than 8, or a leading coefficient other
      than 1 is instrument_failure.
    phi11_table: >-
      The secondary table is
      experiments/EXP-SSIQ-a85692/implementation/modpoly_data/phi_j_11.txt
      with sha256
      985c6a76ca7cc2802ba3f9fd48112fe0d82ffe11dbaa5f49c57526658338b352,
      degree 12, leading entry [12,0] equal to 1. A failure of this
      table marks the secondary metric unavailable. It does not choose
      the reading row and it does not by itself make the level-7 census
      invalid.
    curve_from_j: >-
      For j in F_p, write j as an integer in 0 through p-1. If j is 0,
      use y^2 = x^3 + 1. If j equals 1728 modulo p, use y^2 = x^3 + x.
      Otherwise set c = j * inverse(1728 - j) and use
      y^2 = x^3 + 3 c x + 2 c. Recompute the j-invariant as
      1728 * (4 A^3) * inverse(4 A^3 + 27 B^2). A recomputed value
      that is not the input j is instrument_failure. A zero
      denominator is instrument_failure.
    point_count: >-
      For each model, for x from 0 through p-1, evaluate the right-hand
      side. If it is 0, count one affine point. If its Euler criterion
      power (p-1)/2 equals 1, count two affine points. If that power
      equals p-1, count none. Append the point at infinity. N(j) is
      that count. Ordinary means N(j) is not p+1.
    root_count: >-
      For each j, build the degree-8 univariate Phi_7(j, Y) and list
      its distinct roots in F_p. d(j) is the length of that list.
      Factor the same univariate a second time. A disagreement of the
      two root sets is instrument_failure. A double root contributes 1.
      Do not drop a root because it is j itself, and do not drop a
      root because its curve is supersingular. Those filters apply to
      edges, not to d.
    edge_rule: >-
      An edge at p is an unordered pair of integers {j, j'} with
      0<=j<j'<=p-1, both ordinary, such that j' is a root of
      Phi_7(j, Y) and j is a root of Phi_7(j', Y). A pair that fails
      either direction is not scored, and one such failure on a pair
      that passed one direction is instrument_failure. A pair with
      j=j' is not an edge. G counts edges with d(j) not equal to
      d(j'). Edges that preserve d are counted in the ordinary-edge
      total and are not counted in G.
    supersingular_gap: >-
      G_ss counts pairs that meet the same root conditions and have
      unequal d, with at least one endpoint satisfying N=p+1. G_ss is
      reported beside G. Adding any such pair into G is
      instrument_failure.
    point_count_agreement: >-
      If G>=1, take the scored edge with smallest p, then smallest j,
      then smallest j', and require the two point counts to be equal.
      Inequality is instrument_failure. If G=0, record that no scored
      edge existed and do not invent a pair.
    secondary_ell_11: >-
      Using the same edge rule at level 11, on the primes 23, 29, and
      31 only, compute G_11. Report G_11 and whether G_11 is at least
      1. Do not add G_11 to G. Do not change the reading row from G_11.
      Do not score level 11 on any prime above 31.

  controls:
    - id: phi7-pin
      statement: >-
        The level-7 table matches the pinned sha256, has degree 8, and
        has leading coefficient 1. One failure voids the run.
    - id: symmetry
      statement: >-
        Every scored edge is a root in both directions. One one-sided
        root voids the run.
    - id: distinct-roots
      statement: >-
        d counts distinct roots. A second factorization of the same
        univariate must reproduce the root set.
    - id: supersingular-exclusion
      statement: >-
        Vertices with point count p+1 are not endpoints of a pair
        counted in G. Their unequal-d pairs are G_ss only.
    - id: shared-point-count
      statement: >-
        The lexicographically first scored edge, if any, has equal
        point counts. A disagreement voids the run. G=0 records that
        there was no edge.

  independent_variables:
    - which prime p in the frozen list is scored
    - which ordinary j is used as an endpoint
    - whether the pair is admitted to G or only to G_ss

  metrics:
    primary:
      - id: G
        statement: >-
          The number of ordinary 7-isogeny edges in the box with
          unequal Phi_7 root counts. The idea's prediction is that G
          is at least 1. The concrete negative is that G is 0 while
          the instrument checks pass.
    secondary:
      - id: ordinary_edge_total
        statement: >-
          the number of ordinary edges in the box, including those
          that preserve d
      - id: witness_or_empty
        statement: >-
          one explicit edge (p, j, j', d(j), d(j'), N(j), N(j')) if
          G is at least 1, or the statement that no scored edge exists
      - id: G_ss
        statement: >-
          the supersingular-touching unequal-d pair count, reported
          beside G and not added to it
      - id: G_11
        statement: >-
          the same G at level 11 on the primes 23, 29, and 31 only,
          or unavailable if the level-11 table fails its pin. This
          metric does not choose the reading row.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the census itself. G_11 is the second-level comparison
    named in the source idea and is written into the artifact. It does
    not choose the reading row. The row is chosen from G at level 7.
    Do not relabel an instrument failure as G=0.

  preregistered_prediction:
    quantity: >-
      G, the number of ordinary 7-isogeny edges with unequal distinct
      Phi_7 root counts, on the ten primes from 23 through 61.
    formula: >-
      G is at least 1. The concrete negative is G=0 after a complete
      pass with the instrument checks passed. A zero is not a
      confirmation. Source idea IDEA-20261006-5b154f. No prime in the
      box was factored before this formula was frozen.
    source: >-
      IDEA-20261006-5b154f, whose prediction is G at least 1.
      KR-RHO-755e35, KR-RHO-0528e7, KR-RHO-13bf67, and KR-RHO-53c89f
      were opened in this session and do not state G.

  scale_relevance:
    tier: toy
    justification: >-
      The largest prime is 61, far below the question's 32-bit toy
      window. No transfer to a cryptographic prime is assumed. The
      sample is the whole ordinary j-line on ten primes, not a tail
      draw. The minimum effect is the idea's own gap of one edge.
    correspondence: >-
      Direct evaluation of the pinned modular polynomial and direct
      point counts. No Deuring correspondence is used.

  tail_checks:
    - >-
      A prime with no ordinary rational 7-isogeny contributes 0 to G.
      That prime is not by itself the negative. The negative is G=0
      on the whole box.
    - >-
      G=1 meets the prediction. G=0 is the negative. No third band is
      introduced after the count is seen.

  replication:
    seeds:
      - EXP-VOLC-4f08df|census|deterministic
    independent_instances: 1
    note: >-
      One is the number of boxes scored. The census is deterministic.
      The second factorization of each univariate is the replication
      of d(j). No seed draws a sample.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One run manifest covers the ten primes, both factorizations, the
      supersingular side count, and the level-11 side count on three
      primes. Wall-clock and CPU figures are advisory and null. The
      1 GB memory figure is machine protection for the coefficient
      table and the point lists. A watchdog expiry is
      failed_infrastructure, not a value of G.

  stopping_rules:
    - Stop after a reading row is named.
    - Do not add a prime and do not drop a prime after seeing a count.
    - Do not replace the threshold 1 after seeing a count.
    - Do not let G_11 choose the row.
    - A timeout voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A composite listed integer, a Phi_7 hash or degree or leading-coefficient failure, a one-sided root, a second-factorization disagreement, or a j-model mismatch voids the run.
    - Counting a self-root as an edge voids the run.
    - Counting multiplicity instead of distinct roots voids the run.
    - Adding a supersingular-touching pair into G voids the run.
    - Scoring an edge whose two point counts differ voids the run.
    - Using any prime outside the frozen list, or scoring level 11 above 31, voids the run.

  success_criterion: >-
    The instrument checks pass and G is at least 1. This is the
    prediction of IDEA-20261006-5b154f. It is reachable as a failure
    when the instrument checks pass and G is 0.

  falsification_criterion: >-
    The instrument checks pass and G is 0. That integer is the concrete
    negative named with the source idea: every ordinary 7-isogeny edge
    in the box preserves d. G at least 1 is the prediction and is not
    this negative. A polynomial-pin failure, a j-model mismatch, a
    point-count disagreement, and a timeout are not this negative.

  required_artifacts:
    - experiments/EXP-VOLC-4f08df/runs/RUN-*/manifest.yaml
    - experiments/EXP-VOLC-4f08df/runs/RUN-*/stdout.txt
    - experiments/EXP-VOLC-4f08df/runs/RUN-*/stderr.txt
    - experiments/EXP-VOLC-4f08df/runs/RUN-*/counts.csv
    - experiments/EXP-VOLC-4f08df/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        a listed integer is composite, the Phi_7 pin fails, a root
        relation is one-sided, the two factorizations disagree, a
        model j disagrees, a self-root was counted, multiplicity was
        counted, a supersingular-touching pair was added to G, a
        scored edge has unequal point counts, or a prime outside the
        list was scored
    - id: ordinary_level
      when: >-
        the instrument checks pass and G is 0
    - id: ordinary_gap
      when: >-
        the instrument checks pass and G is at least 1
  reading_rule: >-
    Name exactly one row, the first whose condition holds in the
    order listed. ordinary_gap is the only success row. ordinary_level
    is the concrete negative. instrument_failure is not a value of G.
    Record G, the ordinary-edge total, G_ss, G_11 or unavailable, the
    witness edge or the empty statement, and attack_claimed false
    beside the row. Those fields do not change the row.
