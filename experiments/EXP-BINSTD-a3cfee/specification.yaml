# =============================================================================
# EXP-BINSTD-a3cfee -- VERSION 1 (APPROVED by DEC-20261001-707505) frozen
# contract for H-BINSTD-d1f9a5: three-arm (DP / uniform / HW-filter-only)
# Semaev relation-yield comparison at toy Koblitz scale, composing the
# Bailey-style HW distinguished-point byproduct with F2 relation search.
#
# Source: IDEA-20260922-6237e5 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# ZERO RUNS in this design packet. Stages 0-2 authorized for later
# executor TASK-20261001-3d2adf. No AUXIN. Amazon Bedrock prohibited.
# packaging_only false.
#
# certificate.kind vocabulary (docs/claims-and-verification.md):
#   discrete_log | decomposition | key_recovery | none
# Stage-0 / metric-only / walk-replay manifests use none.
# Relation hits MUST use certificate.kind: decomposition and re-verify
# by direct curve arithmetic on a fresh curve object.
# =============================================================================
experiment:
  id: EXP-BINSTD-a3cfee
  hypothesis_id: H-BINSTD-d1f9a5
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6237e5
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Toy three-arm DP vs uniform vs HW-filter-only Semaev yield test
    (Bailey-style walk byproduct composition)
  status: approved
  approved_by: DEC-20261001-707505
  approved_at: '2026-10-01'
  packaging_only: false
  approval:
    approved_by: DEC-20261001-707505
    composing_decision: DEC-20261001-707505
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break, rho
      competitiveness, or n=131 transfer. Toy measurement only.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0: toy walk/DP replica + replay check + preregistered
      predictions (BEFORE any yield comparison). Stages 1-2: three-arm
      Semaev yield at toy n in {17,23} (+ optional second cutoff / m=3).
      No deployed-curve attacks. No Amazon Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Build a toy Koblitz replica of the Bailey walk+DP mechanism with
    byte-identical seed replay, BEFORE any yield comparison.
    (B) At the smallest executable cell, compare Semaev m=2 relation yield
    on equal-size DP / uniform / HW-filter-only pools (>=200 attempts per
    arm or N with E[relations]>>1); test HEUR-H1 band [0.7,1.4].
    (C) Replicate at a second field size and/or cutoff; optional m=3;
    report replay-cost distribution separately.
    Claim no deployed attack and no exponent move.

  class: heuristic_validation
  class_note: >-
    Heuristic-validation of HEUR-BINSTD-d1f9a5-H1 (H_null independence of
    HW-DP filter and Semaev decomposability), with composition measurement
    framing. Pre-registered prediction band frozen before any Stage 1 run.
    Measured vs modeled columns stay separate. No exponent-moving claim.

  scope:
    included:
      - >-
        Stage 0: implement toy walk+DP builder (normal-basis HW cutoff
        analogous to KN-LIT-661e97 §3); byte-identical replay verification
        artifact; freeze pool size N and cutoff c once relative DP density
        is roughly matched; write preregistered-predictions.yaml,
        methodological-note.md, uniform-baseline-plan.yaml
        (|F|^m/(m!*N) formula with concrete F,N for the chosen cell)
        BEFORE Stage 1.
      - >-
        Stage 1: three arms at primary cell n in {17,23}, m=2; collect
        pool size N per arm; run Semaev relation search; certificates;
        pairwise permutation (or exact two-sample) tests on relation
        counts; replay-cost histogram on DP arm; report ratios vs [0.7,1.4].
      - >-
        Stage 2: second toy n and/or second HW cutoff; optional m=3;
        density-scaling control; decide DO-1..DO-5 from predefined metrics.
    excluded:
      - Any scientific ECDLP / rho attack at n >= 131
      - Claiming transfer of toy ratios to ECC2K-130
      - Claiming exponent improvement or break
      - Assuming replay is free
      - Editing IDEA-20260922-6237e5 claim text
      - AUXIN edits
      - Amazon Bedrock
      - Retuning the [0.7,1.4] band after observing Stage 1+ outcomes
        without a protocol_amendment

  inputs:
    proposal: ledger/proposals/IDEA-20260922-6237e5.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-d1f9a5.yaml
    literature:
      - knowledge/literature/KN-LIT-661e97.md
      - knowledge/literature/KN-LIT-096.md
    related:
      - docs/claims-and-verification.md
      - docs/inventor-protocol.md
      - docs/target-result-profile.md
    cells:
      Stage0-instrument:
        field_degrees_candidate: [17, 23]
        replay_check: byte_identical
        basis: normal_basis_analog
      Stage1-primary:
        arity_m: 2
        arms: [DP_walk, uniform, HW_filter_only]
        min_attempts_per_arm: 200
        yield_ratio_band: [0.7, 1.4]
      Stage2-replicate:
        second_field_or_cutoff: required
        optional_m3: true

  controls:
    - name: uniform_random_pool
      object: >-
        Size-matched uniform curve-point pool — F2 baseline every other
        line already uses; must match |F|^m/(m!*N) within sampling error.
    - name: hw_filter_only_rejection
      object: >-
        Same HW cutoff, rejection-sampled without walk — isolates filter
        from Frobenius-power walk structure.
    - name: byte_identical_replay
      object: >-
        Every trusted DP trail must replay byte-identical from its seed
        before entering the DP pool.
    - name: certificate_reverify
      object: >-
        Every counted relation re-verified by direct curve arithmetic;
        certificate.kind decomposition.
    - name: second_cell_replication
      object: >-
        Out-of-band ratio requires a second independently seeded cell
        before H_alt; single-cell excursion is noise.
    - name: density_scaling_cutoff_sweep
      object: >-
        Optional Stage-2 second cutoff spanning an order-of-magnitude DP
        density range to separate H_alt from cutoff artifact.
    - name: certificate_kind_vocabulary
      object: >-
        Every run manifest result.certificate.kind is one of
        discrete_log | decomposition | key_recovery | none.
    - name: no_break_guard
      object: No break / n=131 transfer / exponent claim.

  independent_variables:
    - field_degree_n
    - hw_cutoff_c
    - arity_m
    - pool_arm  # DP_walk | uniform | HW_filter_only
    - pool_size_N
    - seed

  metrics:
    primary:
      - relation_count_per_arm
      - yield_rate_per_arm
      - yield_ratio_DP_over_uniform
      - yield_ratio_DP_over_HW_filter_only
      - yield_ratio_HW_filter_only_over_uniform
      - two_sample_p_value
      - certificate_pass_rate
      - replay_iterations_per_contributing_DP
    secondary:
      - walk_collision_rate
      - dp_density_achieved
      - peak_rss_bytes
      - wall_clock_s
      - termination_reason
      - uniform_baseline_relative_error_vs_heuristic

  heuristic_under_test:
    - HEUR-BINSTD-d1f9a5-H1

  preregistered_prediction:
    quantity: >-
      (A) Pairwise yield-rate ratios DP/uniform, DP/HW-filter-only, and
      HW-filter-only/uniform at m=2 (and optional m=3) fall in [0.7, 1.4]
      on every tested toy cell (HEUR-H1 / H_null).
      (B) Uniform-arm yield matches |F|^m/(m!*N) within sampling error
      (instrument control; not the scientific hypothesis).
      (C) certificate_pass_rate = 1.0.
      (D) Replay iterations per contributing DP: no numeric prediction;
      reported as a separate measured distribution.
    formula: >-
      Heuristic baseline: E[relations] ≈ |F|^m / (m! * N_group) for
      uniform sampling of candidate tuples (program-standard F2 model).
      H1: yield_DP / yield_uniform ∈ [0.7, 1.4] and likewise for other
      pairwise ratios at matched N.
    source: >-
      IDEA-20260922-6237e5 predictions and HEUR H1; H-BINSTD-d1f9a5;
      KN-LIT-661e97 for walk/DP mechanism (not for the independence
      claim, which is this experiment's own prediction).
    claim_tier: observational
    measured_vs_modeled: >-
      Relation counts, certificates, replay iterations, wall_s, RSS,
      ratios, and p-values are MEASURED. The |F|^m/(m!*N) baseline and
      the [0.7,1.4] H1 band are MODELED / pre-registered predictions
      written in Stage 0 before Stage 1 and never retuned to Stage 1+
      data without a protocol_amendment.

  scale_relevance:
    tier: toy
    justification: >-
      Executable cells at n in {17,23} (optional 31,41). KN-LIT-661e97
      n=131 constants (HW<=34, 2^-25.27 density) are NOT reproduced
      numerically — only mechanism. No transfer of measured ratios to
      n=131 is claimed.
    correspondence: >-
      None exact. Relative DP density vs sqrt(group order) is matched
      approximately as a design choice, disclosed as a confounder if an
      effect appears (IDEA observation_collision).

  sample_size_justification: >-
    IDEA validation_plan asks >=200 relation-search attempts per arm per
    cell. Executor freezes N and attempt count in Stage 0 so that expected
    uniform-arm relation count under |F|^m/(m!*N) is meaningfully >1
    (target: expected count >= 5 when feasible at the chosen toy cell;
    if the cell cannot reach expected count >=5 within budget, record
    IMP-sample-power and still report measured counts with CI — do not
    invent enrichment). Tail: report the largest observed pairwise ratio
    across cells as the extreme-sample check.

  tail_checks:
    - Largest observed pairwise yield ratio across all cells/cutoffs.
    - Smoothest / highest-yield single pool replicate vs predicted E[count].
    - Replay-cost upper tail (max iterations-to-DP among contributors).
    - Walk collision rate vs pool-size comparability across arms.

  replication:
    seeds:
      - 2026100101
      - 2026100102
      - 2026100103
      - 2026100104
      - 2026100105
    independent_instances: >-
      Stage 0 deterministic instrument checks (seed-free replay vectors
      named in stage0/). Stage 1: primary cell with seeds 2026100101..05
      as reported quintile; additional seeds only via protocol_amendment.
      Stage 2: second cell with disjoint seed block 2026100111..15.
      H_alt requires agreement of out-of-band direction at two cells.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 40
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete when walk/DP replica, replay-check artifact, N/cutoff freeze, preregistered-predictions, methodological-note, and uniform-baseline-plan exist BEFORE Stage 1.
    - Stage 1 complete when three-arm m=2 yields, ratios, p-values, certificates, and replay-cost summary are written for the primary cell.
    - Stage 2 complete when second cell and/or second cutoff reported; optional m=3 may be skipped with disclosed missing status if budget exhausted after Stage 2 replication cell.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - If a cell is infeasible: record IMP and stop that cell as infrastructure — do not invent yields.

  invalidation_rules:
    - Reporting DP-arm yields before byte-identical replay check passes
    - Uniform baseline fails without identified instrument bug yet claiming H_alt
    - Claiming n=131 transfer, exponent improvement, or break
    - Retuning [0.7,1.4] after Stage 1+ without protocol_amendment
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - certificate.kind outside vocabulary → invalid run
    - Relation claimed without independent re-verification
    - Editing IDEA-20260922-6237e5 claim text

  success_criterion: >-
    Stage 0 artifacts committed before Stage 1.
    Stage 1+2: either (DO-1) all pairwise ratios in [0.7,1.4] with
    uniform baseline OK and certificates pass, OR (DO-2/DO-3) out-of-band
    ratio replicated at two cells with attribution via HW-filter-only arm
    — both are decidable success paths for the protocol.
    Positive H_null agreement does NOT authorize a deployed claim;
    H_alt does NOT authorize n=131 transfer without a new design.

  falsification_criterion: >-
    Replay byte-mismatch (DO-4); OR uniform baseline fails |F|^m/(m!*N)
    beyond sampling error (DO-4); OR certificate_pass_rate < 1.0;
    OR any n=131-transfer / exponent / break claim;
    OR single-cell out-of-band ratio reported as H_alt without
    second-cell replication (protocol violation).

  required_artifacts:
    - experiments/EXP-BINSTD-a3cfee/stage0/preregistered-predictions.yaml
    - experiments/EXP-BINSTD-a3cfee/stage0/methodological-note.md
    - experiments/EXP-BINSTD-a3cfee/stage0/uniform-baseline-plan.yaml
    - experiments/EXP-BINSTD-a3cfee/stage0/replay-check.yaml
    - experiments/EXP-BINSTD-a3cfee/stage0/cutoff-and-N-freeze.yaml
    - experiments/EXP-BINSTD-a3cfee/stage1/three-arm-yield-summary.yaml
    - experiments/EXP-BINSTD-a3cfee/stage1/pairwise-ratios.yaml
    - experiments/EXP-BINSTD-a3cfee/stage1/replay-cost-summary.yaml
    - experiments/EXP-BINSTD-a3cfee/stage2/replication-summary.yaml
    - experiments/EXP-BINSTD-a3cfee/runs/
    - experiments/EXP-BINSTD-a3cfee/implementation/

  optimistic_assumptions_disclosed:
    - >-
      Relative DP-density matching at toy n is approximate; absolute
      HW cutoff differs from n=131's 34 — bias direction unknown if an
      effect appears; disclosed confounder, not hidden.
    - >-
      |F|^m/(m!*N) is a heuristic baseline for the uniform arm; labeled
      modeled, not a theorem.
    - >-
      H1 independence is the predicted null; if wrong, DO-2/DO-3 fire —
      disclosed as the valuable surprise, not assumed.
    - >-
      Optional m=3 may be under-powered at the same N; if skipped, disclose
      — do not claim m=3 agreement from m=2 alone.
    - >-
      Replay cost at toy scale is measured directly; the n=131 figure
      2^25.27 is cited from KN-LIT-661e97 for context only and is not a
      measured quantity of this experiment.

  memory_accounting: >-
    Dominant structures: three pools of size N (N frozen in Stage 0;
    expected << 2^20 at toy n); Semaev/Macaulay working matrices for m=2
    (small) and optional m=3; walk logs for replay-cost measurement.
    peak_rss_bytes reported per run and reconciled against declared pool
    buffers. No van Oorschot–Wiener tradeoff in this contract. At n=131
    the real DP store is ~850 GB (KN-LIT-661e97) — cited as context, not
    measured here.

  certificate:
    kind_vocabulary:
      - discrete_log
      - decomposition
      - key_recovery
      - none
    stage0_kind: none
    relation_hit_kind: decomposition
    walk_replay_kind: none
    note: >-
      Every counted Semaev relation uses certificate.kind decomposition
      and is independently re-checked by curve arithmetic on a fresh
      curve object. Stage-0 instrument checks, yield metrics, and
      walk-replay verification manifests use none. No discrete_log
      solutions are required for this composition measurement; if a
      run claims a DLP solve anyway it must use discrete_log and
      re-verify [x]P=Q.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
