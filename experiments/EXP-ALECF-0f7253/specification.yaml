experiment:
  id: EXP-ALECF-0f7253
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f9740c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f9740c
  question_id: RQ-ALECF-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Build a classical basis-state reversible-circuit simulator with four named checkers, then
    measure its per-defect-class detection matrix by mutation injection against a known-correct modular-arithmetic
    reference and a semantically neutral mutation null.
  objective: 'The one uncertainty a run reduces is how much correctness assurance a classical basis-state
    simulator actually provides for reversible arithmetic, expressed as measured detection rates rather
    than as an assumption. Concretely: (i) does the reference circuit verify exhaustively at the smallest
    register width, establishing a baseline that is correct by enumeration so that every subsequent
    failure is attributable to an injected defect; (ii) for each of seven declared defect classes,
    what fraction of injected instances is caught by each of the four checkers, reported as a matrix
    with per-cell confidence intervals and with the phase column recorded as structurally zero because
    a permutation-only simulator cannot represent relative phase; (iii) does the correctness checker''s
    detection rate for defects supported on a rare input set follow the predicted dependence on shot
    count across a swept range, which is the quantitative form of the claim that random-shot validation
    has a computable blind spot. A run does not evaluate any circuit for quality, does not audit the
    imported ALECF submissions, whose source is not present in this repository, and does not claim
    that any real circuit contains a defect. The deliverable is the simulator plus its detection matrix,
    intended as the cited instrument specification for the other measurement contracts in this bucket,
    together with the neutral-mutation null result that says whether the matrix can be read at all.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the declared reference
      circuits over the tested prime widths, and for the seven declared defect classes injected at
      the declared rates, the four checkers detect defects at the measured per-cell rates, with the
      phase cell structurally zero and the neutral-mutation arm at the measured near-zero rate. WHAT
      DOES NOT FOLLOW: no conclusion that the ALECF benchmark''s validation is inadequate, no conclusion
      that any submitted or published circuit contains a defect, no claim about defect classes outside
      the catalogue, no claim about relative-phase behaviour of any real circuit, no transfer of detection
      rates to 256-bit circuits, and no attack or security consequence whatsoever. A detection matrix
      constrains the instrument, not the world.'
  inputs:
    procedure: 'STAGE 0 (cost: under an hour): fix the gate set, the checker definitions including
      the explicit phase stub, the defect catalogue, and the seed manifest. STAGE 1 (cost: several
      hours of engineering, minutes of compute): implement the basis-state interpreter and the reference
      modular adder and multiplier; verify the reference exhaustively at 8 bits. STAGE 2 (cost: two
      hours): implement the four checkers, with the positive-control defect confirming that each non-stubbed
      checker fires. STAGE 3 (cost: two to three hours): implement the mutation engine with per-class
      injection site sampling from the reference gate list. STAGE 4 (cost: minutes of compute): inject
      200 instances per class, run all checkers per mutant, record response vectors. STAGE 5 (cost:
      minutes, same invocation): run the 200 semantically neutral mutations through the identical
      pipeline, and the double-injection masking arm on a subset. STAGE 6 (cost: minutes): sweep shot
      counts 64, 512, 4096 and 9024 for the rare-set class. STAGE 7 (cost: under an hour): emit the
      matrix with Wilson confidence intervals, the neutral-mutation rate, the masking rate, and the
      shot-count curve.'
    instrument: 'Python 3.11 standard library for the interpreter, exact integer arithmetic and the
      checkers; pytest for the interpreter''s own unit tests and the positive control; numpy and scipy
      for Wilson confidence intervals only; harness/toycurve.py for exact prime-field reference values
      used to build the modular arithmetic; harness/runner.py for the run record and its inference
      block. No Sage, no quantum simulator library, no hardware, no network. The phase checker is
      a declared stub: a permutation-only simulator has no phase register, and rather than approximating
      one the contract records the cell as structurally unavailable.'
    parameters: 'Prime widths 8 bits (exhaustive input verification, 2 to the 8 inputs enumerated)
      and 13 bits (sampled verification). Seven defect classes. 200 independent injections per class
      per width. 200 semantically neutral mutations. Double-injection masking arm: 100 pairs. Shot-count
      sweep: 64, 512, 4096, 9024 (the last matching the value stated in the committed ALECF README).
      Rare-set defect support densities: 2 to the minus 6, 2 to the minus 9, 2 to the minus 12. Wilson
      intervals at 95 percent.'
  controls:
  - Semantically neutral mutations (disjoint-qubit gate reordering) injected and checked in the same
    invocation, with an expected detection rate of zero.
  - Exhaustive-input reference verification at the smallest width, so the unmutated circuit is correct
    by enumeration.
  - 'A positive control: a defect class that must be caught by every non-stubbed checker, whose detection
    rate must be at or near one.'
  - Double-injection masking arm on a subset, to detect cancelling defect pairs that would inflate
    apparent detection at single-injection level.
  - Explicit recording of the stubbed phase checker as a known structural hole rather than as a passing
    result.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a semantically neutral mutation: a reordering of
    two gates acting on disjoint qubit sets, which by construction cannot change the computed permutation,
    the ancilla history at any free event, or the inverse relation. The identical injection-and-check
    pipeline runs on a matched number of neutral mutations in the same invocation as the defect arm.
    For the signal arm to mean anything the null must show a detection rate statistically indistinguishable
    from zero on all four checkers. A nonzero neutral-mutation detection rate means the checkers are
    firing on something other than semantic defects, and every detection rate in the signal arm is
    then uninterpretable.'
  independent_variables:
  - defect class
  - checker
  - shot count
  - rare-set support density
  - prime width
  metrics:
    primary:
    - per-checker per-defect-class detection rate
    - neutral-mutation detection rate
    - rare-set detection rate versus shot count
    - count of structurally zero cells
    secondary:
    - double-injection masking rate
    - degenerate-mutant rate (injections producing a circuit identical to the reference)
    - exhaustive verification result for the reference
    - per-class injection site distribution
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The correctness-checker detection rate for defects whose input support has density d,
      as a function of shot count N, and the neutral-mutation detection rate.
    formula: 'Predicted law: detection(d, N) = 1 minus (1 minus d) raised to the power N, evaluated
      per swept (d, N) cell, where d is the fraction of the input space on which the injected defect
      changes the output. Predicted at d = 2 to the minus 12 and N = 9024: detection at or below 0.05
      (the law gives approximately 0.0022 times 9024 over 4096, that is roughly 2.2 per thousand times
      9024, so the prediction is a small number and the pre-registered bound is 0.05). Separately
      predicted: neutral-mutation detection rate at or below 0.01 on all four checkers, and the ancilla
      checker''s detection of dropped-uncomputation defects at or above 0.95.'
    source: Pre-registered in the parent proposal IDEA-20260816-f9740c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at 8-bit and 13-bit prime widths, with the 8-bit case verified exhaustively
      over the entire input space, which is the property that makes the reference trustworthy and
      is unavailable at any cryptographic width. No extrapolation to 256-bit circuits is performed
      and none is admissible: the detection matrix is a property of this instrument applied to these
      reference circuits and this catalogue. The one stated transfer assumption is structural rather
      than numeric: the phase column is zero at every width because a permutation-only simulator represents
      no phase, and that argument does not depend on size.'
    correspondence: null
  tail_checks:
  - Identify degenerate mutants that leave the circuit semantically unchanged and exclude them from
    detection denominators, reporting their rate separately.
  - Inspect the lowest-density rare-set cells for zero detections across all injections, where the
    Wilson interval rather than the point estimate carries the content.
  - Check defect classes that are their own inverse, which the forward-then-reverse checker may systematically
    miss.
  - Examine injection sites concentrated in a single subroutine, which would make a class's rate a
    statement about that subroutine.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate after the declared injection counts; no adaptive increase for classes with low detection.
  - Abort and report instrument failure if the neutral-mutation arm exceeds 0.01.
  - Abort if exhaustive verification of the reference circuit fails at 8 bits.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits a complete four-by-seven detection matrix with Wilson intervals,
    a neutral-mutation rate at or below the declared threshold, the shot-count sweep for the rare-set
    class, and an explicit record of the structurally zero phase column, all from a reference circuit
    verified exhaustively at 8 bits.
  falsification_criterion:
  - Neutral-mutation detection rate above 0.01.
  - Positive-control defect detected at below 0.95 by a non-stubbed checker.
  - The rare-set sweep departing from the predicted law beyond the reported intervals.
  - Exhaustive verification of the reference failing.
  - Degenerate-mutant rate above 0.3, making the catalogue's injection sites uninformative.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f9740c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The seven defect classes are named but not formally specified; a Coordinator must fix each class's
    injection semantics precisely before approval.
  - Whether a phase-carrying simulator is worth building as a follow-on, or whether the structural
    zero is accepted as a permanent boundary of this instrument, is a Coordinator decision and is
    not pre-judged.
  - The mapping from an injected defect to its effective input-support density d must be computed
    rather than assumed, and the method for computing it exactly at 8 bits and estimating it at 13
    bits is not yet specified.
  - It must be decided whether this contract's matrix becomes a required citation for the other contracts
    in this bucket, which is a program-level policy question.
