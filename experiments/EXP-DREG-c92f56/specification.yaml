experiment:
  id: EXP-DREG-c92f56
  hypothesis_id: H-DREG-dafc39
  derived_from_idea: IDEA-20260808-6a2b50
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Is the measured solving degree a coordinate artifact? A homogeneity gate that can
    end the contract at zero compute, then a random-linear-frame battery on the
    boolean chained Semaev system and the prime-field decomposition ideal, with an
    identity-frame null, a frame-insensitive semi-regular null arm, and corank
    invariance as a free per-run correctness gate

  objective: >-
    The one uncertainty a run reduces is whether the deficits and solving degrees this
    program measures are properties of the SYSTEM or of the coordinate FRAME the
    system was written in. A run establishes, in this order: (0) whether the graded
    rank profile the lane's instrument actually computes is homogeneous - in which
    case a linear change of variables cannot move it, the battery is a no-op exactly
    as CORR-20260808-f4d780 warned, and the contract STOPS with the derivation as its
    deliverable; (1) whether the native-frame arm reproduces this lane's committed
    graded rank values and whether the identity frame reproduces that arm bit for
    bit; (2) whether the support-matched semi-regular null arm is frame-insensitive,
    without which nothing else in the run may be read; and (3) the distribution of
    d_solve over at least eight independent random frames per cell, reported beside a
    separate cost column, giving one of three deliverable outcomes - degree DROPS
    (measured deficits are partly coordinate artifacts and carry a re-statement
    obligation), UNCHANGED (degrees are frame-robust here and reg of the homogenised
    ideal becomes the candidate rigorous-bound route), or RISES (the native Semaev
    frame is a favourable coordinate choice, and the integer says by how much).
    ENVIRONMENT REALITY THIS CONTRACT IS SIZED TO. The execution host is small and
    this lane has already measured 11.73 to 12.22 GiB of prepare-phase peak RSS at
    n = 15, D = 6 before any rank kernel ran. The primary cells are therefore n = 9
    boolean and p = 1009 with B = 6, m = 2, both of which fit inside 8 GB with margin;
    n = 12 and the larger prime-field cell are CONDITIONAL stretch cells admitted only
    by a measured precheck. A cell not reached is a resource fact, never a result.
    No attack, no exponent and no ECDLP hardness statement follows from a run.

  what_this_is_not:
    - >-
      NOT a proposed speedup. A random frame destroys sparsity and destroys the S_m
      symmetry, so the practical cost RISES in the random frame even where the degree
      falls. Degree and cost are two separate columns and are never combined.
    - >-
      NOT a use of the solving-degree versus Castelnuovo-Mumford-regularity bound. That
      bound is an UNVERIFIED EXTERNAL RESULT here, no agent in this program has read a
      primary source for it, and it is a MOTIVATION for this measurement rather than
      an ingredient of any claim. Stage 0b is the transcription route and it produces
      no claim by itself.
    - >-
      NOT a Zariski-genericity statement. A finite battery over GF(2) cannot establish
      one, and the contract forbids a run under it from writing one.
    - >-
      NOT an invalidation of any committed run. A frame dependence, if found, creates a
      RE-STATEMENT obligation for the deficits in GOAL-DREG-001 and GOAL-SIG-001; it
      does not retract a measurement and it changes no status.
    - >-
      NOT approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. For the boolean chained Semaev system at m = 3,
      t = 3, ti = 0 built by src/semaev_tree.py and Weil-descended to GF(2), and for
      the prime-field decomposition ideal at p = 1009, at the cells ACTUALLY REACHED,
      under one declared solver, one declared degree-graded termination criterion and
      one declared truncation rule: the measured per-degree graded rank profiles and
      d_solve values in the native frame, in the identity frame and in each of the at
      least eight recorded random frames; their integer differences and the spread over
      frames; the corank at d_solve per frame; the Macaulay nonzero counts per frame;
      and the null arm's measured frame sensitivity. WHAT DOES NOT FOLLOW - anything
      about genericity in the Zariski sense; anything about cells not reached; anything
      at other m, t, p or B; anything at crypto scale; anything about reg of the
      homogenised ideal, which this contract does not compute; and no ECDLP hardness
      statement of any kind.

  inputs:
    procedure: >-
      STAGE 0 (ZERO COMPUTE, BLOCKING GATE, AND IT CAN END THE CONTRACT HERE).
      Write a derivation, over the lane instrument's own construction, determining
      whether the graded rank profile it computes is HOMOGENEOUS or INHOMOGENEOUS in
      the sense that decides frame invariance: state whether the matrix is built on a
      homogeneous ideal or on an affine, degree-truncated system augmented with the
      field equations, and state why a linear change of variables can or cannot move
      it. CORR-20260808-f4d780 records that graded Macaulay rank is frame-invariant for
      homogeneous systems, making this claim a no-op in that case. IF THE DERIVATION
      RETURNS HOMOGENEOUS, STOP: the derivation is the deliverable, zero compute is
      spent, and the proposed lane is closed on a named structural obstruction rather
      than on fatigue. Also freeze here: the solver, the degree-graded termination
      criterion, the truncation rule (set RELATIVE to the observed stable degree, never
      as a fixed absolute degree, so a profile that moves cannot hit a truncation
      boundary in one frame and not another), the frame-sampling procedure, the cell
      list, and the memory precheck thresholds. Hash the declaration.
      STAGE 0b (ZERO COMPUTE, NON-BLOCKING, PRODUCES NO CLAIM). Read
      knowledge/literature/KN-LIT-1540.md and knowledge/literature/KN-LIT-7607.md and
      record what they actually state about generic coordinates and about the last fall
      degree, with quoted text and paths. Attempt no network fetch: eprint access is
      recorded as returning 403 from this environment and this contract does not depend
      on it. If a primary source for the solving-degree versus regularity inequality
      cannot be read, RECORD THAT FACT; the bound stays unusable and no claim rests on
      it either way.
      STAGE 1 (BASELINE AND NULL-OBJECT CONTROLS, BLOCKING). Arm A: compute the
      native-frame per-degree graded ranks at the primary boolean cell n = 9 through
      the stable degree plus two, and check them against the committed values named in
      the Stage 0 fixture, printing each committed value beside its reproduced value
      with source path and sha256. Then run the IDENTITY frame through the
      change-of-frame wrapper and require bit-for-bit equality of the rank vector with
      Arm A. A failure in either halts the contract before any random frame is drawn.
      STAGE 2 (CALIBRATION CONTROL, BLOCKING). Arm D: the support-matched semi-regular
      null at every primary cell, in the native frame and in at least eight random
      frames. Its degree MUST NOT change with the frame. If it does, the instrument is
      measuring the frame rather than the system, the run is VOID, and nothing else is
      read or reported as a finding.
      STAGE 3 (THE MEASUREMENT). Arm B: at the primary boolean cell, draw at least
      eight uniformly random invertible GF(2) frames, RE-DERIVE the field equations in
      each frame and record that the re-derivation happened, and compute the same
      per-degree graded ranks with the same solver and the same termination criterion.
      Record per frame: the full rank profile, d_solve, the corank at d_solve, and the
      Macaulay nonzero count. Arm C: the same at the primary prime-field cell
      p = 1009, B = 6, m = 2.
      STAGE 4 (PER-RUN CORRECTNESS GATE, APPLIED THROUGHOUT). The corank at d_solve
      must be identical in every frame at a cell, because the solution count is
      frame-invariant. Where feasible, obtain the solution count independently by
      enumeration so the gate has an external reference rather than being
      self-consistent. Any run failing the gate is DISCARDED as a bug and is never
      interpreted.
      STAGE 5 (CONDITIONAL STRETCH, ADMITTED ONLY BY MEASUREMENT). Run the memory
      precheck for the stretch cells n = 12 boolean and p = 1009 with B = 8, m = 3. A
      stretch cell is attempted ONLY if the primary cells completed within the declared
      fraction of total budget AND the projected peak RSS from the measured primary
      cells sits under the declared threshold. Otherwise the stretch cell is recorded
      as NOT REACHED with its projection, which is a resource fact.
      STAGE 6 (ZERO COMPUTE). Assemble the deliverable table - one row per cell per
      frame with d_solve, the corank, and the nonzero count in separate columns - and
      emit the three-way verdict DROPS, UNCHANGED or RISES per cell, together with the
      per-cell spread over frames, the minimum d_solve over frames, and the count of
      frames agreeing. No verdict is emitted for a cell that was not reached or that
      was UNINFORMATIVE because d_solve was pinned at the Semaev degree in every frame.
    instrument: >-
      Python 3.11 with exact GF(2) and exact GF(p) linear algebra; no floating point in
      any decision path. A change-of-frame wrapper around this lane's existing
      exact-rank engine, applying a uniformly sampled invertible matrix to the
      variables and RE-DERIVING the field equations in the new frame. The identical
      solver and the identical degree-graded termination criterion are used in every
      frame. Peak RSS is measured per cell per frame by the harness, not modelled.
      Recorded through harness/runner.py with the standard manifest.
    parameters: >-
      Boolean arm at m = 3, t = 3, ti = 0, primary cell n = 9, degrees from the
      system minimum through the observed stable degree plus two; conditional stretch
      cell n = 12. Prime-field arm at p = 1009, primary cell B = 6, m = 2; conditional
      stretch cell B = 8, m = 3. At least eight independent random frames per cell,
      plus the identity frame, plus the native frame. Null arm at every primary cell in
      both frame conditions. Seeds fix the frame draws and the null draws, and are
      recorded per draw.
    frame_sampling: >-
      Uniform over invertible matrices of the appropriate size over the base field,
      sampled by rejection or by a declared uniform construction; each drawn matrix is
      recorded in full or by a seed plus the exact sampling routine, so any frame can
      be reproduced exactly. A frame that is not reproducible is not evidence.

  controls:
    - >-
      HOMOGENEITY GATE, BLOCKING AND ZERO COMPUTE. The Stage 0 derivation decides
      whether the measured profile can move under a linear change of variables at all.
      This control can END the contract, and its firing is a legitimate result that
      discharges CORR-20260808-f4d780's recorded objection rather than ignoring it.
    - >-
      IDENTITY-FRAME NULL OBJECT. The change-of-frame wrapper applied with the identity
      matrix must reproduce the native arm BIT FOR BIT in its rank vector. This is the
      null object of the transformation itself and it is what separates an
      implementation defect in the wrapper from a genuine frame effect. It can fail.
    - >-
      SUPPORT-MATCHED SEMI-REGULAR NULL ARM IN BOTH FRAME CONDITIONS. Arm D must show
      NO frame-dependent degree. A null that moves under a change of frame means the
      instrument is measuring the frame, the run is void, and no other number in it may
      be read. This is the null-object control required before any signal is believed.
    - >-
      CORANK-INVARIANCE GATE, FREE AND PER RUN. The solution count is invariant under an
      invertible linear change of variables, so the corank at d_solve must be identical
      across frames at a cell. A run where it differs has a bug and is DISCARDED, not
      interpreted. Where feasible the solution count is also obtained by independent
      enumeration, so the gate is not merely self-consistent.
    - >-
      BASELINE REPRODUCTION FIXTURE. Arm A must reproduce this lane's committed graded
      rank values at the same cells, each printed beside its committed value with source
      path and sha256. An instrument that does not reproduce the lane's own numbers is
      not the lane's instrument and no comparison it produces is meaningful.
    - >-
      FRAME REPLICATION, AT LEAST EIGHT. A single frame cannot distinguish a genuine
      drop from a lucky draw. The DISTRIBUTION over frames is reported, never its mean
      alone, together with the number of frames that agree - which is the honest way to
      report a genericity argument that is weak over GF(2).
    - >-
      FIELD-EQUATION RE-DERIVATION RECORD. Every random-frame run records that the field
      equations were re-derived in the new frame. A run that transported the original
      field equations is measuring a different system and is invalid.
    - >-
      SEPARATE COST COLUMN. Macaulay nonzero count and operation count are reported in
      their own columns; wall time between frames is declared NON-COMPARABLE because
      sparsity loss dominates it. A single combined figure of merit is forbidden.
    - >-
      RELATIVE TRUNCATION RULE. The computed degree range is set relative to the observed
      stable degree, never as a fixed absolute degree, so a moving profile cannot hit a
      truncation boundary in one frame and not in another - which would manufacture a
      frame difference out of the budget.

  independent_variables:
    - 'coordinate frame: native, identity, or one of at least eight random draws'
    - 'system: boolean chained Semaev, prime-field decomposition ideal, or support-matched semi-regular null'
    - 'cell: n for the boolean arm, and the pair B and m for the prime-field arm'
    - degree D within a cell
    - seed for the frame draw and for the null draw

  metrics:
    primary:
      - >-
        Stage 0 homogeneity determination - HOMOGENEOUS or INHOMOGENEOUS - with its
        written derivation. A HOMOGENEOUS determination is a terminal primary result.
      - >-
        Per-degree graded rank profile per cell per frame, as emitted, not summarised.
      - >-
        d_solve per cell per frame, an integer, under the frozen termination criterion.
      - >-
        The integer difference d_solve in a random frame minus d_solve in the native
        frame, reported as a distribution over at least eight frames per cell, with the
        count of frames agreeing and the full range.
      - >-
        Corank at d_solve per cell per frame, required to be identical across frames -
        the correctness gate, reported as a metric so a reader can check it.
      - >-
        Frame sensitivity of the null arm, required to be zero degree change.
      - >-
        Identity-frame reproduction verdict against Arm A - bit-for-bit EQUAL or NOT.
      - >-
        Three-way per-cell verdict in DROPS, UNCHANGED, RISES, or UNINFORMATIVE when
        d_solve is pinned at the Semaev degree in every frame, or NOT REACHED.
    secondary:
      - Macaulay matrix nonzero count per cell per frame, in its own column.
      - Operation count per cell per frame, where the engine exposes it.
      - Minimum d_solve over all frames at a cell, reported separately as the rare-good-frame tail check and never averaged away.
      - Measured peak RSS and wall time per cell per frame, and the projection used to admit or refuse each stretch cell.
      - Baseline reproduction table with committed value, reproduced value, source path and sha256.
      - Stage 0b transcription record, or the explicit statement that no primary source could be read.
      - The recorded frame matrices or their seeds plus the exact sampling routine, sufficient to reproduce every frame.
      - sha256 of the Stage 0 declaration and of each arm's raw output.

  heuristic_under_test: HEUR-DREG-FRAME-2
  heuristic_under_test_note: >-
    Stage 0 is the validation for HEUR-DREG-FRAME-2 of H-DREG-dafc39 - that the measured
    graded profile is inhomogeneous in the sense that makes a frame battery non-vacuous.
    It is a structural claim about the instrument, so its validation is a written
    derivation over the construction rather than a distribution comparison, and it is
    BLOCKING because CORR-20260808-f4d780 records that the claim is a no-op if it fails.
    HEUR-DREG-FRAME-1, the regularity bound and the Zariski-genericity argument, is NOT
    validated by this contract and is not used by it: Stages 3 and 6 measure the
    operational frame dependence only, and the bound remains unusable until a primary
    source is transcribed by an agent that read it.

  preregistered_prediction:
    quantity: >-
      The Stage 0 homogeneity determination, the null arm's frame sensitivity, and the
      per-cell distribution of d_solve differences between the native frame and at least
      eight random frames.
    formula: >-
      FORCED, AND THESE ARE THE CONTROLS. Null arm frame sensitivity equals ZERO degree
      change at every primary cell. Identity-frame rank vector equals the native rank
      vector BIT FOR BIT. Corank at d_solve is IDENTICAL across all frames at a cell.
      Macaulay nonzero count RISES by a large factor in the random frame at every cell.
      NOT PREDICTED, AND ALL THREE ARE DELIVERABLES: the sign of the d_solve difference.
      The contract predicts that the measurement is DECIDABLE among DROPS, UNCHANGED and
      RISES at a reached, informative cell, and the frame spread is what makes that
      claim checkable rather than asserted. THE PARENT PROPOSAL'S OWN PRIOR IS RECORDED
      AND NOT ADOPTED AS A PREDICTION: 0.75 that the systems are not in generic
      coordinates, 0.45 that d_solve actually drops at a measurable cell.
    source: >-
      Pre-registered in the parent proposal IDEA-20260808-6a2b50, whose predictions block
      names the graded rank profile before and after a random GL change of variables,
      the integer d_solve difference over at least eight frames, the three-way outcome
      reading, the forced corank-invariance check, and the expected rise in nonzero
      count. THIS CONTRACT'S ADDITIONS, each with its reason: the Stage 0 homogeneity
      gate, added because CORR-20260808-f4d780 records the claim as a no-op without it;
      the relative truncation rule, added because a fixed absolute degree could
      manufacture a frame difference; the identity-frame null object, added to separate a
      wrapper defect from drift; and the cell list and memory prechecks, added to fit a
      host on which this lane has already measured over 11 GiB at a larger cell.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are n = 9 boolean at m = 3, t = 3, ti = 0 over GF(2), with
      n = 12 conditional, and the prime-field decomposition ideal at p = 1009 with
      B = 6, m = 2, with B = 8, m = 3 conditional. These are the largest cells that fit
      the execution host with margin: this lane measured 11.73 to 12.22 GiB of
      prepare-phase peak RSS at n = 15, D = 6 and terminated as failed_infrastructure,
      so the primary cells are sized well below that and the stretch cells are admitted
      only by a measured projection. TRANSFER ASSUMPTIONS, STATED AND NARROW. Nothing
      here transfers to larger n, to other m or t, to other p or B, to crypto scale, or
      to ECDLP hardness. A frame difference measured at n = 9 says nothing about n = 21,
      and the contract forbids a run under it from writing that it does. The genericity
      argument itself does not transfer either: it is a large-field argument used at
      GF(2), which is why the design reports the frame distribution rather than
      asserting genericity.
    correspondence: null

  tail_checks:
    - >-
      Report the MINIMUM d_solve over all frames at each cell, separately from the
      distribution. A single frame achieving a materially lower degree than the rest is a
      rare-good-frame phenomenon, is a distinct and potentially exploitable finding, and
      must not be averaged away.
    - >-
      Report how many of the at least eight frames AGREE on d_solve at each cell.
      Small-field genericity is the weakest link in the design and the agreement count is
      the honest way to show how weak it is at these parameters.
    - >-
      Report the number of degrees computed beyond the stable degree in every frame. A
      stable degree observed at the last computed degree is not observed stability, and
      the relative truncation rule exists to make this margin exist in every frame.
    - >-
      Report the full range as well as the spread of the nonzero count over frames, since
      a single dense outlier frame drives the cost column and would otherwise be hidden.
    - >-
      Report every cell where d_solve was pinned at the Semaev degree in all frames as
      UNINFORMATIVE, with its parameters, so a reader can see where the design had no
      power rather than reading a null.

  replication:
    seeds: [2026, 20260904, 20260905]
    independent_instances: 3
    note: >-
      The measured systems are frozen and deterministic in the native frame, so seeds
      vary the FRAME DRAWS and the null draws, which is where the variability lives. At
      least eight independent frames are drawn per cell and every drawn matrix is
      recorded, by value or by seed plus the exact sampling routine, so any frame is
      exactly reproducible. A frame that cannot be reproduced is not evidence.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6.0
    maximum_memory_gb: 8
    maximum_runs: 60
    maximum_workers: 1
    note: >-
      Sized to the HOST, not to the ambition. The 8 GB cap is the template floor and is
      also close to what this container can be relied on to provide; the primary cells
      are chosen to sit well inside it, and the stretch cells are admitted only by a
      measured projection under Stage 5. maximum_runs covers roughly ten frame
      conditions across the arms at the primary cells plus the null arm and the
      controls. Exceeding any of these is a stop, not a licence to continue.

  stopping_rules:
    - >-
      STOP at Stage 0 if the derivation returns HOMOGENEOUS. Zero compute is spent and
      the derivation is the deliverable.
    - >-
      STOP at Stage 1 if Arm A fails to reproduce a committed graded rank value, or if
      the identity frame fails to reproduce Arm A bit for bit. No random frame is drawn.
    - >-
      VOID the run at Stage 2 if the null arm shows a frame-dependent degree. Report the
      null arm's frame dependence as an instrument defect and read nothing else.
    - >-
      DISCARD any individual run failing the corank-invariance gate, and report the count
      of discarded runs; do not interpret a discarded run in either direction.
    - >-
      REFUSE a stretch cell whose measured projection exceeds the declared peak-RSS
      threshold, and record it as NOT REACHED with the projection.
    - >-
      STOP at maximum_runs, total_cpu_hours, wall_clock_seconds_per_run or
      maximum_memory_gb, whichever binds first.

  invalidation_rules:
    - >-
      A timeout, crash or memory exhaustion makes the cell or the run
      failed_infrastructure and is NEVER negative evidence about coordinates, about
      d_solve, or about d_reg (AGENTS.md rule 5).
    - >-
      A random-frame run that did not RE-DERIVE the field equations in the new frame, or
      that does not record that it did, is invalid_measurement: it measured a different
      system.
    - >-
      A run using a different solver or a different degree-graded termination criterion
      between frames is invalid_measurement: it measured the solver.
    - >-
      A run using a FIXED ABSOLUTE truncation degree rather than the frozen relative rule
      is invalid_measurement, because a truncation boundary reached in one frame and not
      another manufactures a frame difference.
    - >-
      A run comparing WALL TIME between frames as evidence about cost is invalid as to
      that comparison; sparsity loss dominates it and only operation counts and nonzero
      counts are comparable.
    - >-
      A run reporting a frame from fewer than eight independent draws at a cell, or one
      whose drawn frames are not reproducible, is invalid for that cell's difference
      distribution.
    - >-
      A run quoting the solving-degree versus Castelnuovo-Mumford-regularity inequality
      as support for anything is invalid as to that statement: the bound is an unverified
      external result in this program and may not back a claim until transcribed from a
      primary source in a new record naming the agent that read it.
    - >-
      A run whose parameters differ from this frozen contract is a DIFFERENT experiment
      and requires a new contract.

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) The Stage 0
    declaration exists, is hashed before any compute, and records a HOMOGENEOUS or
    INHOMOGENEOUS determination with its derivation - and if HOMOGENEOUS, that alone is
    a complete and successful run. (2) Arm A reproduces every committed graded rank value
    in the Stage 0 fixture, each printed beside its committed value with path and sha256.
    (3) The identity frame reproduces Arm A bit for bit. (4) The null arm shows zero
    frame-dependent degree change at every primary cell. (5) The corank at d_solve is
    identical across all retained frames at every cell, with the discarded-run count
    reported. (6) At least eight independent, reproducible random frames were run at each
    primary cell of Arms B and C, with the full distribution of d_solve reported, not a
    mean. (7) Degree and cost appear in separate columns, and peak RSS and the stretch
    projections are reported including for cells NOT REACHED. A run meeting (1) to (7) is
    VALID, and the per-cell verdict is then whatever the measurement returns: DROPS,
    UNCHANGED, RISES, UNINFORMATIVE or NOT REACHED. THE CONTRACT PRIVILEGES NO OUTCOME
    and treats all three signs as deliverables.

  falsification_criterion:
    - >-
      The Stage 0 derivation returns HOMOGENEOUS. HEUR-DREG-FRAME-2 and (G0) are
      falsified, the frame battery is a no-op, and (P1) and (P2) are unanswerable by this
      design. The contract stops and the derivation is reported as the result.
    - >-
      The null arm shows a frame-dependent degree. The instrument is measuring the frame;
      the run is VOID and no (P1) or (P2) verdict may be emitted from it.
    - >-
      The corank at d_solve differs between frames in a run. That run has an
      implementation bug and is discarded, never interpreted as a finding in either
      direction.
    - >-
      The identity frame does not reproduce Arm A bit for bit. The change-of-frame wrapper
      is defective and the battery is void until repaired; this outcome is deliberately
      distinguishable from genuine drift.
    - >-
      d_solve is IDENTICAL in the native frame and in all at least eight random frames
      across every reached, informative cell. (P1) is FALSE as an operational statement at
      these parameters, the coordinate-artifact hypothesis dies within the tested scope,
      and reg of the homogenised ideal becomes the recommended rigorous-bound route -
      whose first step is a literature transcription this contract does not perform.
    - >-
      Arm A fails to reproduce the lane's committed graded rank values. The instrument is
      not the lane's instrument and nothing it produces may be compared with the lane's
      numbers.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, environment and
      dependency versions, and the resolved model and inference block including
      requested_policy, resolved model identifier, model_verified and reasoning effort.
    - >-
      stage0-declaration.yaml - the homogeneity derivation and its verdict, the frozen
      solver and termination criterion, the RELATIVE truncation rule, the frame-sampling
      procedure, the cell list, the committed-value regression fixture with paths and
      sha256, and the stretch-cell peak-RSS thresholds - hashed before any other output
      exists.
    - >-
      stage0b-literature-note.md - what KN-LIT-1540.md and KN-LIT-7607.md actually state,
      with quoted text and paths, or an explicit record that no primary source for the
      regularity inequality could be read. This note produces no claim.
    - >-
      baseline-reproduction.json - committed value, reproduced value, MATCH or MISMATCH,
      source path and sha256, per fixture entry, plus the identity-frame bit-for-bit
      verdict.
    - >-
      frames.json - every drawn frame recorded by value or by seed plus the exact
      sampling routine, sufficient for exact reproduction.
    - >-
      raw-result.json - per cell, per frame, per degree: the graded rank, d_solve, the
      corank at d_solve, the Macaulay nonzero count and the operation count. Raw, not
      summarised.
    - >-
      null-arm.json - the support-matched semi-regular null in both frame conditions at
      every primary cell, with its measured frame sensitivity.
    - >-
      results.json - the deliverable table with degree and cost in separate columns, the
      per-cell three-way verdict, the frame spread, the minimum d_solve over frames, the
      frame agreement count, and the discarded-run count with reasons.
    - >-
      resources.json - measured peak RSS and wall time per cell per frame, the stretch
      projections, and every cell recorded as NOT REACHED with its reason.
    - stdout and stderr, and validity status with its reason.

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      COORDINATOR DRAFTING DOES NOT APPROVE. This contract is `review_required`,
      approved_by is null, frozen is false and execution_authorized is false. Approval is
      a separate committed Coordinator decision and is the maintainer's gate.
    - >-
      THE STAGE 0 HOMOGENEITY GATE MUST REMAIN BLOCKING AND MUST REMAIN FIRST. Without
      it, CORR-20260808-f4d780's recorded objection stands unanswered and every number the
      battery produces could be a no-op or an implementation defect. It is also the
      cheapest possible refutation of the whole design, which is exactly why it runs
      before any compute is spent.
    - >-
      THE NULL ARM AND THE CORANK GATE MUST REMAIN. They are the two controls that
      separate a frame effect from an instrument effect and from a bug; a battery without
      them produces numbers no one can interpret.
    - >-
      A DROPS VERDICT DOES NOT AUTHORIZE A STATUS CHANGE. It creates a re-statement
      obligation for the deficits in GOAL-DREG-001 and GOAL-SIG-001 and triggers
      independent replication, both of which are separate decisions.
    - >-
      The Coordinator approving this contract should confirm the primary cells against
      the host's real memory headroom at approval time. The cells here are sized against
      a measured 11.73 to 12.22 GiB failure at n = 15, D = 6; if the host has changed,
      the cell list is what should change, in a new contract version, not the budget cap
      inside a run.

  overlap_declaration:
    - >-
      WITH EXP-DREG-620b15. Arm A measures the NATIVE-frame graded full-column rank
      profile at n = 9 and n = 12, which is the same quantity EXP-DREG-620b15's
      full-column pivot-degree pass computes at the same cells. DECLARED: if both are
      approved, whichever runs SECOND consumes the first's committed per-degree rank
      vector as its baseline fixture and declares that it recomputes only as a
      CROSS-INSTRUMENT CONTROL, reporting the agreement or disagreement as a primary
      metric. Two independent instruments agreeing on a cell is worth having; two
      instruments separately asserting it is duplicated compute and a false sense of
      corroboration.
    - >-
      WITH EXP-DREG-9ac65a. Arm D's support-matched null at n = 9 and n = 12 is the same
      null object whose exact GF(2) Macaulay rank at D = 5 that contract measures.
      DECLARED: EXP-DREG-9ac65a's value is the REFERENCE and Arm D must reproduce it in
      the identity frame, making Arm D the control on this contract's frame instrument
      rather than a second measurement. If EXP-DREG-9ac65a has not run at execution time,
      Arm D computes the value and declares itself the producer, so exactly one contract
      owns it.

