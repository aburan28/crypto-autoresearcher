        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-007/tasks/TASK-20260723-701/ggm_simulability_note.md, git_blob_sha1: 7c6dc45695f33d5480c4f7a6a90723f654d704c2}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-007/tasks/TASK-20260723-703/red_team_report.yaml, git_blob_sha1: 74ab103394b37205a2b59b7697383448c6dfcb10}
        - {path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-007/tasks/TASK-20260723-703/ggm_review.md, git_blob_sha1: 27ded198b5864f284fa6cab9c8bd0c691df9cb12}
    external_references:
      rule: >-
        No external web review is performed, matching the pinned BATCH-007
        screen scope; external anchors enter only through pinned knowledge
        records (KN-LIT-011, KN-LIT-018). Any voluntary re-retrieval is
        informational only, must be pinned by URL, version, retrieval date,
        and content hash in the run manifest, and may not change any verdict.
      items: []
    audit_item_index:
      items:
        - {id: F1, name: higher_order_public_equation_jets, expected_dedup: prior_audited, expected_owner: THM-JETBARRIER1 T2/T4 all-order public Hasse-Schmidt simulation}
        - {id: F2, name: public_affine_or_algebraically_constrained_lifts, expected_dedup: prior_audited, expected_owner: THM-JETBARRIER1 T1.3/T4 public jet-scheme equations}
        - {id: F3, name: finite_additive_formal_Witt_or_arithmetic_jet_targets, expected_dedup: prior_audited, expected_owner: P1547 prime-to-p filtration and additive vanishing (homomorphic additive channel only)}
        - {id: F4, name: nonadditive_lift_invariant_point_constraint, expected_dedup: uninstantiated_residual, expected_owner: P1547 unclassified possibility; no oracle to test}
        - {id: F5, name: composite_handle_coordinate_oracle, expected_dedup: model_seam_not_new_family, expected_owner: THM-JETBARRIER1 T6 encoding-only gap}
        - {id: F6, name: Weil_restriction_or_descent_jet, expected_dedup: outside_prime_field_scope, expected_owner: G2 extension-field seam; no proper subfield in a prime field}
        - {id: F7, name: Hasse_jet_multiplicity_code, expected_dedup: prior_rejected_not_remaining, expected_owner: ECDLP-IDEA-268 hidden source-sensitive codeword oracle}
        - {id: F8, name: other_finding_representation_screens, expected_dedup: prior_audited_not_reopened, expected_owner: FINDING-PF-IC-001 nets/S-units/pairings/ramification/trace-zero/split-Jacobian/torsor/endpoint-aggregation screens plus EV-EQJ-001 and EV-TTN-001}
      item_count: 8
    residual_placeholders:
      placeholders:
        - {id: RESIDUAL-NONADDITIVE-TYPED-INVARIANT, status: logical_placeholder_not_family}
        - {id: RESIDUAL-GGM-META-COMPLETENESS, status: open_model_theory_not_candidate}
        - {id: RESIDUAL-DESCENT-G2, status: extension_field_scope}
        - {id: RESIDUAL-CONCRETE-COORDINATE-ALGORITHM, status: umbrella_open_problem}
      rule: carried for completeness; not scored for admission.
    frozen_screen:
      dedup_rule: >-
        Assign each family exactly one dedup class (prior_audited,
        prior_rejected, uninstantiated_residual, model_seam,
        outside_prime_field_scope) with a named owner record from the pinned
        corpus. The prime-to-p additive vanishing exclusion applies only to
        the stated homomorphic additive channel; it must not be extended to
        nonlinear cocycles, multi-point predicates, torsors, or
        branch-selection distributions. Only families not covered by a named
        owner proceed to NS-TX-PRIME-001 scoring.
      NS-TX-PRIME-001:
        setup: >-
          Let H = <P> have prime order N, let Q = [k]P, and let a base
          generic transcript contain opaque handles for affine forms
          L_i(k) = a_i + b_i*k mod N with addition, negation, and equality
          answers. Choose k_0 != k_1 such that all equality and inequality
          outcomes among the queried L_i(k_j) agree and the relabelling
          preserves every item of side information explicitly granted to the
          base simulator; before a generic collision the two base transcripts
          are then isomorphic. The proposed augmentation answers Z_j on the
          same formal query sequence in world k_j.
        N1_exact_oracle_definition: >-
          The family supplies an exact public oracle: typed inputs and
          outputs, output-selection law (lift, root, normalization, branch,
          randomness, state), and no hidden source-bearing or target-fitted
          advice. Without an oracle the criterion cannot apply: verdict
          cannot_apply_without_oracle.
        N2_two_world_relabelling: >-
          The relabelling isomorphism of the two base transcripts is proved
          for the frozen formal query sequence, with every admitted side
          input named.
        N3_transcript_gap: >-
          Exhibit a public verifier V and epsilon >= 1/poly(log(N)) with
          abs(Pr[V(Z_0)=1] - Pr[V(Z_1)=1]) >= epsilon, asymptotically larger
          than the generic collision term O((q+1)^2/N); for deterministic
          answers, different verified outputs give epsilon = 1. If every
          answer factors through public equations, public query coordinates,
          and the simulator's formal expressions and equality pattern, the
          family is exactly simulable: verdict simulable_closed. If only raw
          coordinates of composite handles differ, record encoding_only_gap
          (non-generic by definition, no k-dependent advantage). If no gap is
          exhibited, record separation_not_certified -- never a proved
          simulation unless a pinned covering theorem supplies it.
        N4_relation_relevance: >-
          Z_j must contain a target-conditioned exact signed occurrence
          relation, or a certified miss, for a fixed public factor deck and
          either a known-log endpoint or a fresh scalar-blind masked target
          Q+[t]P. A raw coordinate, universal identity, aggregate count,
          supplied-tuple predicate, or unverified existence bit fails this
          clause.
        N5_cost_relevance: >-
          The transcript must be produced, replayed, ranked, used for factor
          logs, and reused for blind descent with all setup, failures,
          output, memory, and verification charged: tau <= 0.25 for one
          complete fresh masked target and lambda, mu <= 0.45 with every term
          assigned. Non-simulability alone is not an advantage.
      verdict_rule: >-
        ADMIT only if the family is not covered by any dedup class and N1-N5
        all hold. Separation (N1-N3) and usefulness (N4-N5) verdicts are
        recorded separately for every family; an encoding_only_gap is never
        recorded as a source-bearing separation, and separation_not_certified
        is never recorded as simulable unless a pinned covering theorem
        applies. Undecidable predicates yield undecidable_with_reason.
    calibration_fixtures:
      - id: CAL-PASS-SCR-003
        kind: must_pass
        synthetic_fixture: true
        expected_verdict: ADMIT
        description: >-
          Synthetic family fixture with an exact typed oracle, a proved
          two-world relabelling, a certified gap epsilon = 1 larger than the
          collision term, an exact signed occurrence transcript for a fixed
          public factor deck, and a complete declared ledger (tau = 0.25,
          lambda = mu = 0.44). It exists only to prove the sheet can emit
          ADMIT; it is excluded from the corpus family table and is not
          evidence about H-SCR-003.
      - id: CAL-FAIL-SCR-003
        kind: must_fail
        synthetic_fixture: false
        expected_verdict: simulable_closed (fails N3)
        description: >-
          The first-jet dual-number oracle of EV-JET-001 / EV-JETB-001, whose
          answers factor through public Hasse-Schmidt data per
          THM-JETBARRIER1; it must be classified simulable_closed.
      - id: CAL-SPLIT-SCR-003
        kind: intermediate_discrimination
        synthetic_fixture: true
        expected_verdict: separation certified at N3 (epsilon = 1), rejected at N4
        description: >-
          A discrete-log augmentation fixture (query = (P, Q) -> k with
          Q = [k]P): its answers are maximally k-dependent, so N3 fires, but
          it supplies no factor-deck occurrence transcript, so N4 fails. It
          records the separation/usefulness split and is excluded from the
          corpus family table.

  controls:
    - id: CTRL-CORPUS-INTEGRITY
      method: >-
        Every audited path is pinned to commit
        b8af1551e45fbe4435745239d29f4d141eea3356 with the embedded hash
        manifest; the run reads git blob content and records SHA-256 per file
        in corpus_manifest.json.
      pass_condition: zero missing paths and zero hash mismatches.
    - id: CTRL-SHEET-CALIBRATION
      method: >-
        Run the frozen screen on CAL-PASS-SCR-003, CAL-FAIL-SCR-003, and
        CAL-SPLIT-SCR-003 before any corpus family is adjudicated.
      pass_condition: >-
        CAL-PASS-SCR-003 receives ADMIT, CAL-FAIL-SCR-003 receives
        simulable_closed, and CAL-SPLIT-SCR-003 receives N3-certified plus
        N4-rejected; any other outcome invalidates the run (instrument
        failure, not a scientific result).
    - id: CTRL-DEDUP-PRIOR-NEGATIVES
      method: >-
        Every family must carry its dedup class and named owner record from
        the pinned corpus (THM-JETBARRIER1, P1547, ECDLP-IDEA-268,
        FINDING-PF-IC-001, EV-EQJ-001, EV-TTN-001, EV-JET-001, EV-JETB-001,
        EV-NET-001, EV-INC-001, EV-INCB-001).
      pass_condition: 8 of 8 families assigned with named owners.
    - id: CTRL-REPLAY-DETERMINISM
      method: Apply the frozen screen twice over the full family index.
      pass_condition: byte-identical family tables on both passes.

  independent_variables:
    - family_id: the 8 frozen family items (F1-F8).
    - calibration_fixture_id: the 3 frozen calibration fixtures.
    - screen_predicate: dedup class assignment plus N1 through N5.

  metrics:
    primary:
      - admitted_family_count: number of families with verdict ADMIT; success requires exactly 0.
      - dedup_class_assignment_complete: fraction of the 8 families with a dedup class and named owner; must be exactly 1.0.
      - family_verdict_matrix: 8 families x (dedup class, N1-N5 statuses) with separate separation and usefulness verdicts; must be complete.
      - calibration_accuracy: fraction of the 3 calibration fixtures receiving their pre-declared verdicts; must be exactly 1.0 before corpus verdicts are read.
    secondary:
      - encoding_only_gap_flags: families recorded with an encoding-only gap (expected F5).
      - separation_not_certified_count: families without an exhibited gap and without a covering pinned theorem (expected F4 cannot_apply_without_oracle).
      - residuals_carried: the 4 residual placeholders with statuses.
      - undecidable_items: count and reasons; must be 0 for success.
      - corpus_hash_mismatch_count: must be 0.
      - wall_clock_and_memory_per_stage.

  heuristic_under_test: null
  preregistered_prediction:
    quantity: admitted_family_count over the 8 frozen family items
    formula: >-
      count of families not covered by any dedup class for which N1 and N2
      and N3 (gap asymptotically larger than O((q+1)^2/N)) and N4 and N5
      (tau <= 0.25, lambda <= 0.45, mu <= 0.45, all terms assigned) all hold.
    source: >-
      Scoped no-distinct-family claim of IDEA-20260723-005 as recorded in the
      pinned BATCH-007 ggm screen report and EV-CRYPTO-007; barrier
      convention from KN-TECH-005 / KN-LIT-011; tautology arguments from
      KN-TECH-009 and research/THM_JETBARRIER1.md.
  scale_relevance:
    tier: toy
    justification: >-
      The dedup classes and the transcript criterion are static and
      scale-independent in form, but the conclusion is scope-bounded to the
      checked frozen corpus and rests on toy-tier prior evidence; no medium
      or cryptographic claim is authorized in either direction.
    correspondence: null
  tail_checks:
    - >-
      Dual-pass consistency: the screen is applied twice over all 8 families;
      any verdict flip between passes is recorded and invalidates the run.
    - >-
      Split-gate check: no family may be recorded simulable solely because it
      fails usefulness, and no encoding_only_gap may be recorded as a
      source-bearing separation; violations invalidate the table.

  replication:
    seeds: []
    seed_policy: deterministic audit, no randomness.
    independent_instances: 8
    independent_instances_note: >-
      The 8 frozen family items are the distinct candidate representation
      families audited; the screen and snapshot are fixed.
    planned_runs:
      - id: RUN-SCR-003-A
        purpose: >-
          Materialize and verify the corpus hash manifest; run the three
          calibration fixtures through the frozen screen; abort as invalid if
          calibration is not 3/3.
      - id: RUN-SCR-003-B
        purpose: >-
          Assign dedup classes with named owners for all 8 families, applying
          the additive-channel boundary and the out-of-scope rule.
      - id: RUN-SCR-003-C
        purpose: >-
          Apply NS-TX-PRIME-001 (N1-N5) to every family not fully closed by
          dedup, run the determinism replay, carry the residual placeholders,
          and emit the family table and the admission decision.
    expected_run_count: 3

  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 3600
    total_cpu_hours: 1.0
    maximum_memory_gb: 4
    maximum_runs: 3
    stages:
      - id: freeze_and_calibrate
        wall_clock_seconds: 900
        stop_rule: >-
          Stop and mark the run invalid if the corpus manifest mismatches or
          if any calibration fixture misses its pre-declared verdict.
      - id: dedup_classification
        wall_clock_seconds: 1500
        stop_rule: >-
          Stop with the run inconclusive (not negative) if any family's
          dedup class cannot be decided from the pinned record; record
          undecidable_with_reason for that family.
      - id: ns_tx_application_and_aggregate
        wall_clock_seconds: 1200
        stop_rule: >-
          Stop without issuing a verdict if any required artifact (family
          table, corpus manifest, calibration receipt) is incomplete.

  stopping_rules:
    - Stop after the three planned runs; no exploratory fourth run and no new families without a versioned amendment.
    - Zero compute beyond table construction: no fixtures, no curve execution, no sampling, no external web review.
    - >-
      A crash or tooling failure is recorded as failed_infrastructure and is
      evidence for nothing (AGENTS.md rule 5).
    - Stop at 3600 total wall-clock seconds, 1.0 CPU-hours, or 4 GB resident memory.
  invalidation_rules:
    - Any run missing its manifest, exact command, environment, stdout, stderr, or raw machine-readable family table is invalid.
    - Any corpus hash mismatch or missing corpus path invalidates the run.
    - Calibration accuracy below 3/3 invalidates the run (screen unsound as instrumented).
    - Non-identical family tables across the two determinism passes invalidate the run.
    - An incomplete table (fewer than 8 families classified) is invalid unless every missing family is recorded undecidable_with_reason, in which case the run is inconclusive rather than invalid.
    - >-
      A zero-admitted table or a table with a passing family is a scientific
      outcome, never an invalidation.
  success_criterion: >-
    The frozen screen applied mechanically to the frozen corpus yields a
    complete, deduplicated family table over all 8 families with zero
    admitted families (scoped absence supported), 100 percent dedup-owner
    coverage, separate separation and usefulness verdicts per family, the 4
    residual placeholders carried unscored, calibration at 3/3, and corpus
    integrity verified.
  falsification_criterion: >-
    At least one frozen family is mechanism-distinct from every closed class
    and passes N1-N5 with a source-bearing transcript gap and a complete
    charged ledger: the screen claim is refuted and the family must be
    recorded with its oracle definition, relabelling proof, gap certificate,
    transcript shape, and cost ledger as an unfiled theorem candidate.

  required_artifacts:
    - experiments/EXP-SCR-003/specification.yaml
    - experiments/EXP-SCR-003/sheet/apply_screen.py
    - experiments/EXP-SCR-003/sheet/calibration_receipt.json
    - experiments/EXP-SCR-003/corpus_manifest.json
    - experiments/EXP-SCR-003/family_table.json
    - experiments/EXP-SCR-003/admission_decision.json
    - experiments/EXP-SCR-003/runs/RUN-SCR-003-A/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-003/runs/RUN-SCR-003-B/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-003/runs/RUN-SCR-003-C/{manifest.yaml,command.txt,environment.json,raw-result.json,stdout.log,stderr.log}
    - experiments/EXP-SCR-003/analysis.md
    - experiments/EXP-SCR-003/execution-report.yaml
    - ledger/hypotheses/H-SCR-003.yaml

  assigned_to: executor
  inference_receipt:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: null
    fallback_used: false
    authorization_ref: null
