experiment:
  id: EXP-SCR-003
  hypothesis_id: H-SCR-003
  goal_id: GOAL-CRYPTO-001
  version: 1
  title: >-
    KN-OPEN-005 GGM-simulability screen: deterministic dedup audit against
    closed representation classes with the frozen NS-TX-PRIME-001
    non-simulable transcript criterion
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-27'
  source_proposal: IDEA-20260723-005
  claim_tier: toy
  claim_tier_basis: >-
    This is a pure read-and-adjudicate audit: zero compute beyond table
    construction, no sampling, no curve arithmetic, no external web review.
    The screen is scale-independent in form (static dedup classes and a
    symbolic transcript criterion over committed records), but its conclusion
    is scope-bounded to the checked frozen representation corpus; per
    AGENTS.md rule 6 a zero-admitted table closes only the exact checked
    scope and is neither a universal simulability theorem nor GGM
    completeness. Tier is recorded as toy because the audit rests on toy-tier
    prior evidence and authorizes no medium or cryptographic claim in either
    direction.
  objective: >-
    Apply the frozen screen (dedup classes plus criterion NS-TX-PRIME-001,
    predicates N1-N5 below) mechanically to the 8 frozen family items,
    producing a complete deduplicated family table with separate
    simulator-separation and relation-usefulness verdicts. Decide: zero
    admitted families (success; scoped absence supported) versus at least one
    family distinct from every closed class passing N1-N5 (falsification;
    record the family as an unfiled theorem candidate). This is design only:
    execution is deferred to a separate Executor task after approval.

