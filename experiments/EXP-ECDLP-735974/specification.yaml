  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-e676d8
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-60e1dc
  source_proposal: IDEA-20260904-a195ff
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-e676d8 under the standing 2026-09-06
    user authorization. Stage 0 is the exact
    Hilbert-series d_reg identity calibrator. Binary-arm
    Groebner calibration, matched-null summation
    systems, the prime-field arm, and KN-LIT-4558
    extraction are later stages and are not run here.

  objective: >
    Evaluate the exact integer identity
    d_reg(2,(2,2,2))=2 on one frozen
    family (REAL, KF, NULL) and decide
    whether the ARM-S Hilbert-series
    calibrator works. Stage 0 does not
    run a Groebner basis, does not
    build a binary-field system, and
    does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL d_reg at
      (n, D)=(2, (2,2,2)) equals 2, and
      the n=4 m=5 quadratic baseline
      equals 3; KF at (2,(2,2)) equals 3
      not 2; NULL empty-degree equals
      None not 2; n=0 and a non-positive
      degree rejected. Certificate kind none.
    formula: >
      HS(t)=prod_i (1-t^{d_i}) (1-t)^{-n},
      (1-t)^{-n}=sum_k C(n+k-1, k) t^k,
      truncated at max_degree=16.
      d_reg = min {k in 0..16 : hf[k] <= 0}
      or None. Frozen REAL closed form
      (1-t)(1+t)^3. FORCED Stage 0:
      fixture_pass, real_identity_pass,
      known_false_ci_pass,
      reject_invalid_pass,
      null_empty_degree_pass all true.
    source: >
      ledger/proposals/IDEA-20260904-a195ff.yaml
      proof_search_map.baseline_embedding,
      method_ceiling.nearby_object_control,
      and ARM S of minimal_test.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260904-a195ff also flags a
    binary-arm Groebner first-fall
    calibration against published values,
    matched-null summation systems of
    identical Newton polytope, a
    prime-field arm, and a KN-LIT-4558
    extraction. Stage 0 does not run a
    Groebner basis, does not build those
    systems, and does not extract a
    paper. Those arms are Stage 1+
    objects. Exact integer Hilbert-series
    d_reg identities are the only Stage 0
    arm. This is a disclosed tightening,
    not a silent change of the idea's
    claim. The frozen profile is
    (n, D)=(2, (2,2,2)).

  inputs:
    fixture:
      max_degree: 16
      real:
        id: REAL
        n: 2
        degrees: [2, 2, 2]
        must_d_reg: 2
        role: real_identity
      baseline:
        id: BASE
        n: 4
        degrees: [2, 2, 2, 2, 2]
        must_d_reg: 3
        role: bundled_mnplus1_quadratic_baseline
      known_false:
        id: KF
        n: 2
        degrees: [2, 2]
        must_d_reg: 3
        must_not_equal_real: true
        role: known_false_complete_intersection
      matched_null:
        id: NULL
        kind: empty_degree_list
        n: 2
        degrees: []
        must_d_reg: null
        must_not_equal_real: true
        role: matched_null_polynomial_ring
      invalid:
        - id: n-zero
          n: 0
          degrees: [2, 2, 2]
          must_reject: true
        - id: nonpositive-degree
          n: 2
          degrees: [2, 0, 2]
          must_reject: true
      working_model: >
        Exact Hilbert-series d_reg identity
        for one frozen overdetermined
        quadratic profile. Not a Groebner
        run. Not a binary-field system.
        Not a KN-LIT-4558 extraction.
        Not a rho beat.
      do_not_run_groebner: true
      do_not_extract_kn_lit_4558: true

  independent_variables:
    - object in the frozen family
    - whether D is overdetermined, complete-intersection, or empty
    - whether n and every d_i are positive

  null_object:
    name: empty-degree polynomial ring at n=2
    construction: >
      Drop every (1-t^{d_i}) factor.
      HS=(1-t)^{-2} with coefficients
      k+1 > 0 through max_degree=16, so
      d_reg is None, which is not 2.
      This is the nearby-object control
      from the idea's ARM S analytic
      reference with the structure
      factors removed.
    non_degeneracy_check: >
      known_false_ci_pass must be
      true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      n=0 and a non-positive degree must
      be rejected before an identity is
      read as a census.

  controls:
    - KF complete intersection (2,(2,2)) (known-false / proves-too-much)
    - REAL identity at (2,(2,2,2)) plus n=4 m=5 baseline
    - NULL empty-degree rejection of collapse
    - n=0 and non-positive degree rejection
    - exact integer arithmetic, no floats
    - profile frozen before any coefficient is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_identity_pass boolean
      - known_false_ci_pass boolean
      - reject_invalid_pass boolean
      - null_empty_degree_pass boolean
    secondary:
      - REAL d_reg and hf prefix
      - BASE d_reg
      - KF d_reg
      - NULL d_reg
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One frozen integer profile
      (n, D)=(2, (2,2,2)). No transfer
      to a Groebner calibration,
      published first-fall, or
      cryptographic n.
    correspondence: null

  tail_checks:
    - REAL is the frozen profile (2,(2,2,2))
    - KF is the frozen complete intersection (2,(2,2))
    - NULL is empty-degree at n=2
    - n=0 and a non-positive degree are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_identity_pass,
      known_false_ci_pass,
      reject_invalid_pass, and
      null_empty_degree_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-HILB.
    - Stages 1 and later are not authorized.
    - Do not run a Groebner basis.
    - Do not build a binary-field point-decomposition system.
    - Do not extract KN-LIT-4558.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen (n, D) after this freeze
    - Running a Groebner basis because a frozen identity fails
    - Reading Stage 0 as a Groebner calibration, binary-field first-fall, KN-LIT-4558 extraction, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Authorizing Stage 1 of EXP-ECDLP-735974 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-fdae20 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-089e80 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-b3f975 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-daf1bb from this contract
    - Authorizing Stage 1 of EXP-ECDLP-0d1336 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-9a1388, H-ECDLP-7f5b05, H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Dispatching EXP-ECDLP-df601f from BATCH-5a5091

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_identity_pass,
    known_false_ci_pass,
    reject_invalid_pass, and
    null_empty_degree_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not a Groebner
    calibration and not an attack.

  falsification_criterion: >
    A certified KF miss of the gap 3\neq2
    after fixture_pass is a scoped miss
    of P-S0-HILB. A certified REAL identity
    miss after fixture_pass is a scoped
    miss of P-S0-HILB. Infrastructure bugs
    are not mathematics. Stage 0 does not
    test P-S1-CALIB.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One frozen toy profile (n, D)=(2, (2,2,2)).
    - Not a Groebner run. Not a binary-field system.
    - Not a KN-LIT-4558 extraction. Not a rho beat.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 735974. No Stage 1 of fdae20.
      No Stage 1 of 089e80. No Stage 1 of b3f975.
      No Stage 1 of daf1bb. No Stage 1 of 0d1336.
      No Stage 1 of 1aa0f8. No Stage 1 of 79f8c4.
      No Stage 1 of 628891. No Stage 1 of 9e9536.
      No Stage 1 of 90f602. No Stage 2 of 4be480.
      No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not run a Groebner basis.
    - Do not dispatch EXP-ECDLP-df601f from BATCH-5a5091.
