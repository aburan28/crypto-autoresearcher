# EXP-OAKLEY-2c0552
# Stage-0 chain-versus-sum identity for H-OAKLEY-2fae30.
# Frozen before the official run.
experiment:
  id: EXP-OAKLEY-2c0552
  hypothesis_id: H-OAKLEY-2fae30
  source_idea: IDEA-20261007-424b6f
  question_id: RQ-OAKLEY-264353
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Chained S3 versus four-point sum on every ordered quadruple in F_17
  status: approved
  frozen: true
  designed_at: '2026-10-12'
  approved_by: coordinator
  approval_decision_id: DEC-20261012-c72c3f
  execution_authorized: true
  objective: >-
    On y^2 = x^3 + x + 1 over F_17, compare two readings of
    "four x-coordinates sum to infinity" on every ordered quadruple.
    The geometric reading searches point signs. The algebraic reading
    is a pair of Semaev S3 factors, plus the split where both pairs
    are inverse. Do not time a solver.
  inputs:
    curve: "y^2 = x^3 + x + 1"
    prime: 17
    quadruples: all ordered 4-tuples with coordinates in F_17
    chain_split: "(x1, x2) against (x3, x4)"
    named_future_run_slot: RUN-OAKLEY-a451a8
  controls:
    - >-
      The first affine sum of two least-nonnegative points with
      x1 < x2 must satisfy S3 = 0. Failure invalidates the cell.
    - >-
      The checker evaluates that same S3 polynomial on the recorded
      planted triple.
  independent_variables:
    - the frozen prime and curve, not chosen after a disagreement count
  metrics:
    primary:
      - disagreement_count
    secondary:
      - points_on_curve
      - planted_ok
      - ordered_quadruples
  heuristic_under_test: >-
    IDEA-20261007-424b6f nearby control: the t=3 bridge must show exact
    identity before any t=5 cost ratio is trusted.
  preregistered_prediction:
    quantity: >-
      disagreement_count is the number of ordered quadruples where the
      sign search and the S3 chain differ.
    formula: >-
      Agreement is disagreement_count = 0. The negative reading is
      disagreement_count > 0. Both require the planted identity.
    source: >-
      IDEA-20261007-424b6f says any single outcome disagreement is the
      headline finding. Zero versus positive was fixed before the
      quadruple table was computed.
  scale_relevance:
    tier: toy
    justification: >-
      One prime, 17^4 ordered quadruples, and an identity count. No
      transfer to the binary cells at p=4 or p=5.
    correspondence: null
  tail_checks:
    - >-
      ordered_quadruples equals 17^4. A different domain means the
      scan was not the full ordered census.
    - >-
      Fewer than two points on the curve invalidates the cell.
  replication:
    seeds: []
    independent_instances: 1
    named_future_run_slot: RUN-OAKLEY-a451a8
    replication_note: >-
      One deterministic sweep. No random target is drawn.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 60
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after one valid manifest for RUN-OAKLEY-a451a8.
    - Do not add a prime, a solver, or a second split in this contract.
    - A positive disagreement count is the recorded result. Do not drop tuples to make it zero.
  invalidation_rules:
    - The planted sum does not satisfy S3 = 0.
    - The prime or the curve differs from this specification.
    - Fewer than two points lie on the curve.
    - A timeout, crash, or missing count.
  success_criterion: >-
    The manifest is valid, planted_ok is true, and disagreement_count
    is 0.
  falsification_criterion: >-
    The manifest is valid, planted_ok is true, and disagreement_count
    is strictly positive.
  decision_impact:
    on_positive: >-
      Record that the sign search and the (1,2)|(3,4) S3 chain agree
      on every ordered quadruple in F_17. Do not quote a t=5 cost
      ratio from this pass alone.
    on_negative: >-
      Record that at least one quadruple disagrees. Quarantine this
      chain split. Do not run the binary head-to-head from this manifest.
  required_artifacts:
    - experiments/EXP-OAKLEY-2c0552/runs/RUN-OAKLEY-a451a8/manifest.yaml
    - experiments/EXP-OAKLEY-2c0552/runs/RUN-OAKLEY-a451a8/raw-result.json
  assigned_to: executor
  launcher:
    trial_plan: experiments/EXP-OAKLEY-2c0552/trial-plan.json
    driver: experiments/EXP-OAKLEY-2c0552/implementation/run.py
    checker: experiments/EXP-OAKLEY-2c0552/implementation/check.py
  out_of_scope:
    - Binary fields, p=4, p=5, S6, WDSat, Groebner, and any charged-cost ratio.
    - Any split other than (x1, x2) against (x3, x4).
    - The Oakley endpoint fields and any claim of an attack cost.
