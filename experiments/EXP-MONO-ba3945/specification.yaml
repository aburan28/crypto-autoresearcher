      "fixed_cell_count": 8,
      "curve_selection": "For each p enumerate A,B in0..p-1 lexicographically. Reject singular curves, j=0 or1728, and supersingular curves (p divides trace p+1-#E(F_p)). Select first TWO distinct j-invariants with at least six distinct negation pairs of nonzero non-2-torsion points. Count E by exact enumeration; audit with a second point-count path. No cost or fibre statistic participates in selection.",
      "base_selection": "Encode affine points by canonical integers(x,y), infinity separately. A negation pair {P,-P} is represented by its lexicographically smaller point. Sort pairs by this representative. B8 is both signs of first4 pairs; B12 is both signs of first6 pairs. Each point occurs once in B; no extra sign label or quotient multiplicity. Ordered B^3 includes repetitions and permutations exactly once for each ordered tuple.",
      "targets": "All points R in E(F_p), including infinity, ordered with infinity first then lex(x,y). N=|E(F_p)|. No prime-subgroup or target-distribution assumption is hidden.",
      "incomplete_selection": "Fewer than two eligible curves in the fixed p^2 pool makes the whole planned eight-cell test inconclusive; no replacement primes, expanded pool or cost-based curve choice."
    },
    "methods": {
      "table": "For every ordered (Q1,Q2,Q3) in B^3, independently evaluate Q1+Q2+Q3. Store tuple index, target R, and first matching tuple index per R. c(R) counts ordered tuples, not distinct x roots. Sum_R c(R)=|B|^3 is an exact checksum; compare c(R) to an independently generated pair-sum plus third-point convolution.",
      "search_policy": "Cold per-target first-success exhaustive search over the same lexicographic ordered B^3. Every attempted tuple recomputes two group additions and performs one point equality; no target-specific cache, hidden table lookup or known c(R) may stop search early. C(R)=number of attempted tuples, including the successful tuple; C(R)=|B|^3 when no solution. Each unit means exactly2 abstract group additions and1 comparison. Instrument field multiplication/inversion/addition, exceptional additions, CPU and bytes separately. Exhaustive fibre enumeration is checker/setup work and is not the measured first-success algorithm.",
      "synopsis": "s(R)=(is_infinity, is_nonzero_2torsion, x_in_xB, c(R), c(R)>0). x_in_xB is false at infinity. These disjoint strata preserve every target exception flag, exact multiplicity and SAT/UNSAT proportion. They do not purport to compute a new monodromy group. Rational factor-base splitting and mean-yield identities are scoped internal prior, not evidence that costs are determined.",
      "laws": "Let u(R)=1/N and w_s=|s|/N. Require p(R)>=1/(2N) and sum_{R in s}p(R)=w_s. Define low and high by allocating baseline1/(2N) to every point and the remaining |s|/(2N) in each stratum to respectively lex-first minimum-C and maximum-C target. This gives full support, exact matching stratum masses and a deterministic extremal pair with no fitted parameter. Laws are designed countermodels chosen after the fixed cost table, not natural uniform samplers or an attack improvement.",
      "certificate": "For each stratum archive all members, min/max C and chosen representatives. Exact bounds E_p C >= L=0.5*E_u C+sum_s |s|*min_s C/(2N) and <= U=0.5*E_u C+sum_s |s|*max_s C/(2N) hold for every admissible law and are attained by the witnesses. Rational checker verifies nonnegative mass, floor, normalization, every stratum equality, bounds and U>=2L using integer cross multiplication. No numerical LP solver is required; these are explicit finite dual bounds. L>0 because every search attempts at least one tuple.",
      "costs": "Report L,U,U/L, uniform mean, success probability and exact multiplicity distribution; distinguish abstract tuple-work ratios from instrumented field/CPU ratios. Charge curve search, point enumeration, complete fibre table, independent checker, law construction, exact certificates, serialization and memory. Hypothetical law sampling may use exact integer alias/rejection machinery, but do not benchmark a selected sampler or claim its access is free. Total audit setup is not amortized away.",
      "generic_control": "Relabel each point with SHA256(decimal_seed+colon+canonical_point), using seeds2026090711 and2026090712. Transport the group law, original tuple ordering and strata; costs and bounds must be identical. Group-table creation/storage are charged. This checks representation invariance, not cryptographic hiding."
