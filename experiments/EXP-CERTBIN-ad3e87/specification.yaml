experiment:
  id: EXP-CERTBIN-ad3e87
  hypothesis_id: H-CERTBIN-9b629f
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-0d1d74
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-X8: Stage-0 (A)-(D)+TW-04 freeze; Stage-1 L_V-mod-h gcd primitive
    with P1/P3/P4; Stage-2 last-two-summands P2 ladder; Stage-3 RR/Nagao
    m=3 cross-check on RC-1
  status: approved
  approved_by: DEC-20261002-2d67d3
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-2d67d3
    composing_decision: DEC-20261002-2d67d3
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute authoring of (A)-(D), L_V coefficients, TW-04
      above-cap arithmetic table, and preregistered predictions. Stages 1-2
      measure the primitive and last-two-summands cost law at toy cells.
      Stage 3 is a correctness cross-check at m=3 only. No Magma/Sage. No
      AUXIN. No Bedrock. No ECC2K-130 solve. No n>=23 surprise replication
      under this card (O-SURPRISE stops and reports).
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze the modular-composition membership cost law and residual-count
    criterion; measure P1-P4 on RC-1 and n=19 (including Koblitz orbit-union
    arm); decide exactly one O-* label from H-CERTBIN-9b629f; enter the
    RR/Nagao m=5,6 row as "loop with a constant" only under O-POSITIVE.

  class: measurement
  class_note: >-
    Cost-model / instrument experiment with Stage-0 arithmetic freeze and
    Stages 1-2 heuristic-validation of H-SIZE and H1. Carries TW-04 as
    labelled derived arithmetic. Not an exponent-moving breakthrough
    experiment; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Write
        stage0/preregistered-predictions.json and stage0/derivations-note.md
        freezing: (A)-(D) statements; L_V coefficients per cell; TW-04
        above-cap mu and B/mu table from 3c6a19 (labelled derived);
        P1/P2/P3/P4 bands; seed 2026092711. Must freeze before Stage 1.
      - >-
        Stage 1. Implement L_V mod h + gcd; P3 fixture (50 polys at RC-1);
        P1 (l,D) grid at n=19; P4 random-subset control; write stage1/*.json.
      - >-
        Stage 2. 100 residual targets per cell; resultant+gcd vs half-trace;
        union arm on Koblitz n=19; report P2; write stage2/*.json.
      - >-
        Stage 3. RR/Nagao m=3 cross-check on RC-1 reproducing Stage-2 root
        sets; write stage3/*.json.
      - >-
        RESULTS.md with exactly one O-* label; memory (peak RSS, poly
        buffer sizes) stated beside every time figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - Editing IDEA-20260926-0d1d74 / 3c6a19 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Reading TW-04 Stage-0 figures as measurements.
      - Running n=23 surprise replication under this card (report O-SURPRISE and stop).
      - Treating infra failure as mathematical evidence against H1/H-SIZE.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/ in place without a
        documented copy/wrapper under this experiment's write_scope.

  inputs:
    proposal: ledger/proposals/IDEA-20260926-0d1d74.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-9b629f.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    pool_ranking: ledger/decisions/DEC-20260929-7257b2.yaml
    tw04_arm: ledger/proposals/IDEA-20260926-3c6a19.yaml
    loop_comparator: ledger/proposals/IDEA-20260904-96c4f3.yaml
    mitm_comparator: ledger/proposals/IDEA-20260922-845a77.yaml
    rr_panel_evidence: ledger/evidence/EV-ICPERF-10c5fc.yaml
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    analysis_readme: analysis/binstd-idea-review-20260926/README.md

  controls:
    - name: enumeration_ground_truth
      description: >-
        Every gcd root set compared to evaluation on all of V (P3=1.0
        blocking). Failure → O-ARTIFACT.
    - name: random_subset_null
      description: >-
        Random 2^l-element subset (dense membership polynomial) at matched
        size; cost must be >= 2^{l-2} and separate from subspace l D^2 (P4).
    - name: ordinary_vs_koblitz_union
      description: >-
        Orbit-union arm on Koblitz n=19; same 19 subspaces on ordinary n=19
        without stability reading — separates Frobenius-stable union from
        shape.
    - name: ev_icperf_rr_reproduction
      description: >-
        Stage 3 m=3 RR form on RC-1 must reproduce Stage-2 root sets and sit
        near EV-ICPERF-10c5fc's Theta(|F|^2) constant reading (correctness
        only).
    - name: order_recount
      description: >-
        Re-count |G| for Koblitz n=19 sibling before use; disagreement with
        4*130873 → O-ARTIFACT.
    - name: memory_beside_time
      description: >-
        Peak RSS and dominant poly-buffer size stated beside every time
        figure in RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_primitive, 2_last_two, 3_rr_crosscheck]
    - name: field_degree_n
      levels: [17_RC1, 19_ordinary, 19_koblitz]
    - name: subspace_dim_l
      levels: [6, 8, 9, 10, 12]
    - name: poly_degree_D
      levels: [4, 8, 16, 32]
    - name: membership_object
      levels: [subspace_V, orbit_union_S, random_subset]

  metrics:
    primary:
      - name: gcd_membership_ops
        unit: field multiplications
        definition: Ops to compute L_V mod h and gcd, per polynomial, per (l,D).
      - name: p1_l_slope
        unit: dimensionless
        definition: Fitted slope of log ops vs l at fixed D; band [0.8,1.2].
      - name: p1_D_exponent
        unit: dimensionless
        definition: Fitted exponent of ops vs D at fixed l; band [1.7,2.3].
      - name: route_cost_ratio
        unit: dimensionless
        definition: Resultant-plus-gcd route over half-trace enumeration route, per residual.
      - name: roots_agreement
        unit: fraction
        definition: Fraction of polynomials where gcd root set equals enumeration root set.
    secondary:
      - name: subset_control_ops
        unit: field multiplications
        definition: Membership cost with a random subset of matched size.
      - name: residual_degree
        unit: integer
        definition: Measured deg_X of h_{R'}; predicted 2^{l+1}.
      - name: group_order_recount
        unit: integer
        definition: Re-counted |G| for Koblitz n=19 sibling.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage-1/2 processes (memory honesty).
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: tw04_calls_column_log2
        unit: bits
        definition: Derived Stage-0 above-cap B/mu figures; labelled extrapolation.

  heuristic_under_test: H1; H-SIZE

  preregistered_prediction:
    quantity: >-
      Stage-0 (A)-(D) and TW-04 table; Stage-1 P1 bands and P3=1.0 / P4
      separation; Stage-2 P2 ratio in [0.1,10] flat across l=8..12 within
      factor 4; Stage-3 root-set agreement with Stage 2.
    formula: >-
      L_V(X)=sum_{k=0}^{l} c_k X^{2^k}; ops ~ a*l*D^2;
      deg Res_Y(S_3,L_V)=2^{l+1};
      P1: D-exp in [1.7,2.3], l-slope in [0.8,1.2];
      P2: ratio in [0.1,10], ladder fall <=4x;
      P3=1.0; P4 >= 2^{l-2};
      |G|_K19 = 4*130873;
      O-POSITIVE iff all bands hold; O-SURPRISE iff P2 fall >4x;
      O-ARTIFACT iff P3<1 or P4 fails.
    source: >-
      ledger/proposals/IDEA-20260926-0d1d74.yaml predictions +
      proof_search_map; IDEA-20260926-3c6a19 TW-04 arithmetic; frozen
      before Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Measurements at n in {17,19}. Transfer of P1/P2 constants to n=131 is
      explicitly NOT claimed; only arithmetic statements and TW-04 derived
      figures are recorded for deployed parameters.
    correspondence: null

  replication:
    seeds: [2026092711, 20261002]
    independent_instances: 3
    note: >-
      RC-1, ordinary n=19, and Koblitz n=19 are independent instances of
      the same protocol. Residual targets use seed 2026092711; V' uses
      20261002.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 4.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json.
    - Stages 1-3 complete OR a named O-ARTIFACT / O-SURPRISE / O-IMPEDIMENT stop with measured quantity.
    - maximum_runs = 4.
    - O-SURPRISE stops before entering RR/Nagao row; no n=23 under this card.

  invalidation_rules:
    - P3 < 1.0 → O-ARTIFACT; do not read P1/P2 as science.
    - Order re-count disagrees → O-ARTIFACT.
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence against H1/H-SIZE.
    - Reading TW-04 Stage-0 arithmetic as measurement → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen; Stages 1-3 produce P1-P4 tables with all
    blocking controls executed; RESULTS.md names exactly one O-* label from
    H-CERTBIN-9b629f with cited artifacts; memory reported beside time.

  falsification_criterion: >-
    Any of: P1 out of band; P2 fall >4x; P3<1; P4 not separating; TW-04
    mislabelled as measurement; or a claim of break/exponent under this card.

  required_artifacts:
    - experiments/EXP-CERTBIN-ad3e87/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-ad3e87/stage0/derivations-note.md
    - experiments/EXP-CERTBIN-ad3e87/stage0/tw04-above-cap-table.json
    - experiments/EXP-CERTBIN-ad3e87/stage1/
    - experiments/EXP-CERTBIN-ad3e87/stage2/
    - experiments/EXP-CERTBIN-ad3e87/stage3/
    - experiments/EXP-CERTBIN-ad3e87/RESULTS.md
    - experiments/EXP-CERTBIN-ad3e87/runs/<RUN-CERTBIN-*>/

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
