experiment:
  id: EXP-SSIQ-e6dc7d
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SSIQ-dad689
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: null
  assigned_to: executor
  title: >-
    Review-required contract: subsampling instrument classifying toy-scale
    SSQI statistics into rho-stable / rho-unstable, with hypergeometric
    known-answer gates and a charged subsample-versus-resized-table control

  objective: >-
    If separately approved, frozen and authorized, build the shared toy
    table L(E,X,B) once per field size (reusing the C2-slice harness),
    compute the coverage ratio rho, and for each of eight named statistics
    (six candidates plus a matched null and the exact known-quantity
    control) measure its dependence on rho' across a subsampled ladder at
    three field sizes, classifying each as rho-stable or rho-unstable
    against pre-registered slope and gate thresholds. This contract is an
    instrument design and a pre-execution declaration. No run has happened.

  what_this_is_not:
    - Not an attack, not a solve, not a certificate of any kind.
    - Not a measurement of any statistic's crypto-scale value or behaviour.
    - Not a claim that the 141-154 octave gap between toy rho and crypto rho is closed by any outcome here.
    - Not evidence for or against any lever L1-L5/N5/A1-A7 -- this instrument validates OTHER toy measurements, it does not itself move an exponent.
    - Not an approval, a freezing, an execution authorization, a run, an observation, or evidence.
    - Not a reopening or reprioritization of GOAL-SSIQ-001's batch sequence; this contract would run only under a separately dispatched batch.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      TOY ONLY for every measured quantity. A completed run could support,
      at most: (1) that the pinning identity rho ~ B*p^{-2/3+o(1)} and the
      hypergeometric collision law hold exactly at the tested (p, B) cells;
      (2) a classification table of the eight named statistics into
      rho-stable / rho-unstable, each with a fitted slope, its 2-sigma CI,
      and the three-field-size reproduction, FOR THE TESTED rho' RANGE
      ONLY; (3) a charged comparison between subsample and resized-radius
      table for any statistic where that distinction matters. NOTHING ELSE.
      No outcome may be quoted as evidence about crypto-scale statistic
      behaviour, as closing or narrowing the 141-154 octave gap, or as
      moving any exponent in this goal's F1-F4 decomposition.

  inputs:
    toy_table:
      construction: >-
        Reuse the shared toy-table harness already built for the C2 slice
        (C2-5/C2-10/C2-12) with no modification to its parameters; build
        L(E,X,B) once per field size at three field sizes.
      field_sizes_log2_p: [20, 30, 40]
      B_grid_by_field_size:
        log2_p_20: 30
        log2_p_30: 60
        log2_p_40: 100
      note: >-
        The (log2 p, B) pairing follows the values named in the source
        catalogue entry (M ~ 2^{11.0} at p = 2^20, B = 30; M ~ 2^{18.4} at
        p = 2^40, B = 100); the middle cell (log2 p = 30) uses the
        interpolated B = 60 and its own forced rho computed in Stage 0
        before any build.
    subsampling_ladder:
      rho_prime_levels: [rho, rho/4, rho/16, rho/64, rho/256, rho/1024]
      bootstrap_resamples_per_level: 200
      sampling_law: >-
        Uniform random subset of the full-table entries, without
        replacement within each bootstrap draw, resampled 200 times per
        level per field size.
    resized_table_control:
      construction: >-
        For each rho' level, ALSO build a freshly constructed table
        L(E,X',B) at a smaller radius X' chosen so its expected cardinality
        matches the subsample size at that level. This is a SEPARATE build
        from the subsample, not a relabelling of it, per H-SSIQ-dad689
        mechanism STEP 4.
    statistic_list:
      candidates:
        - id: S-C2-10-collision-profile
          predicted_class: rho_unstable
        - id: S-C2-10-locus-occupancy
          predicted_class: rho_unstable
        - id: S-C2-5-survival-probability-fR-approx-1
          predicted_class: rho_unstable
        - id: S-neighbour-autocorrelation
          predicted_class: rho_stable
        - id: S-sigma-orbit-distribution
          predicted_class: rho_stable
        - id: S-Q2-10-alignment-exponent-e
          predicted_class: rho_stable
        - id: S-Q2-5-rho-LSH
          predicted_class: rho_stable
      matched_null: S-uniform-random-subset-same-size
      exact_known_quantity: S-ordinary-collision-count
    seeds:
      master_seed: 660637
      domain: "EXP-SSIQ-e6dc7d/v1"
      seed_derivation_rule: >-
        ASCII bytes of domain || "|" || label || "|" || decimal(log2_p) ||
        "|" || decimal(rho_prime_level_index) || "|" || decimal(bootstrap_index),
        SHA-256, big-endian unsigned digest reduced by rejection sampling.
        Labels are exactly one of {"table-build", "subsample", "resized-table"}.
        Reproduces every instance bit-for-bit from (master_seed, domain,
        label, log2_p, rho_prime_level_index, bootstrap_index) and nothing
        else.
    counting_convention:
      statistic_evaluation: >-
        Each statistic is computed by its own already-defined estimator
        from the sibling entry that owns it (C2-5, C2-10, Q2-5, Q2-10); this
        contract does not redefine any statistic, it only wraps each in the
        subsampling harness. A statistic whose defining estimator is not
        yet committed in this repo at freeze time is recorded NOT RUN with
        the reason, never approximated.

  arms_and_controls:
    treatment: >-
      Each of the six candidate statistics, measured at each of six rho'
      levels, at each of three field sizes, over 200 bootstrap resamples.
    known_answer_gate: >-
      S-ordinary-collision-count. FORCED VALUE: expected ordinary
      collisions in a subsample of size m is exactly m(m-1)/(2*p/12), the
      exact hypergeometric/binomial law. MUST reproduce this to within its
      closed-form interval at every level and field size. Failure here
      voids every other reading in the batch.
    full_table_reproduction_gate: >-
      At rho' = rho (no subsampling), every one of the eight statistics
      must reproduce its already-committed full-table value bit-for-bit.
      Failure on any statistic invalidates that statistic's row only, not
      the batch, and is reported invalid_measurement for that row.
    matched_null: >-
      S-uniform-random-subset-same-size: for each candidate's admitted
      subsample size at each level, draw an independently uniform random
      subset of the SAME size from the full table and compute the same
      statistic. FORCED VALUE: this null's fitted slope must be
      indistinguishable from a genuine rho-dependence baseline (i.e. the
      null is expected to behave like the candidate only insofar as pure
      sampling noise dictates); it exists to calibrate the instrument's
      false-positive rate on slope detection, not to be a positive/negative
      discriminator by itself the way it is in a screen-selectivity design.
    charged_control: >-
      RESIZED-TABLE ARM. For each candidate and each rho' level, the
      resized-radius table's statistic value is computed and compared
      against the matched subsample's value. A statistic whose subsample
      and resized-table values diverge is reported as CONFOUNDED and its
      rho-stable/unstable classification is withheld pending a design that
      separates the two effects, per H-SSIQ-dad689's STEP 4 charge.
    ordering_control: >-
      The known-answer gate (S-ordinary-collision-count) and the
      full-table-reproduction gate are computed and hash-committed BEFORE
      any candidate statistic's classification is read. If either gate
      fails, the batch halts at that point with what was covered reported.
    comparability_policy: >-
      No statistic value from this contract may be compared with any
      figure from EXP-SSIQ-a85692, EXP-SSIQ-58b642, or any other prior run
      under this goal except through the explicitly named full-table
      reproduction gate. Op counts, sample counts, and slopes here are toy-
      tier instrument outputs, not comparable to any crypto-scale figure.

  stages_cheapest_first:
    - id: stage-0-derivation
      cost: "zero compute, ~1 h"
      content: >-
        Re-derive the pinning identity rho ~ B*p^{-2/3+o(1)} and the
        forced numeric values (rho at each of the three field-size cells,
        the NIST-I comparison value, the octave gap, the expected ordinary
        collision counts) from H-SSIQ-dad689's mechanism STEPS 1-2; write
        out the exact hypergeometric known-answer formula.
      can_terminate_run: true
      termination_rule: >-
        A defect in the pinning identity or a mismatch against the source
        catalogue entry's forced values ends the contract here with zero
        compute spent.
    - id: stage-1-build
      cost: "reused from C2 BATCH-S3 build, <= 2 CPU-hours total"
      content: >-
        Build the shared toy table at the three field sizes, entirely
        reusing the existing C2-slice harness build. No new table-
        construction code.
      can_terminate_run: true
      termination_rule: >-
        A table build failure or a mismatch of the observed rho against
        the Stage 0 forced value at any field size halts the package at
        that point.
    - id: stage-2-subsample-and-gate
      cost: "minutes to low hours, pure Python plus numpy"
      content: >-
        Run the subsampling ladder, the known-answer gate, and the
        full-table reproduction gate, hash-committing both gates before
        Stage 3 reads any candidate statistic.
      can_terminate_run: true
      termination_rule: >-
        Failure of either gate halts the package; the batch reports Stage 0
        and 1 outputs plus the gate failure, and no statistic is
        classified.
    - id: stage-3-classify
      cost: "minutes, pure Python plus numpy"
      content: >-
        Fit each candidate statistic's slope against log(rho') at each
        field size, run the resized-table charged control, and produce the
        classification table.
      can_terminate_run: false
      termination_rule: >-
        A statistic failing the charged control is reported CONFOUNDED, not
        classified; this does not halt the rest of the table.

  metrics:
    primary:
      - "rho_at_cell: computed rho per (log2_p, B) cell, versus its Stage 0 forced value."
      - "known_answer_agreement: measured vs m(m-1)/(2*p/12) ordinary collisions per level."
      - "full_table_reproduction: bit-for-bit match at rho' = rho, per statistic."
      - "fitted_slope: per statistic, per field size, with 2-sigma CI."
      - "classification: rho_stable | rho_unstable | confounded | not_run, per statistic."
    secondary:
      - "resized_table_divergence: subsample value minus resized-table value, per statistic per level."
      - "matched_null_slope: fitted slope of the uniform-random-subset null, per level per field size."
      - "octave_gap_reported: the forced 141-154 octave figure, restated with the run's own rho values."

  heuristic_under_test: HEUR-SSIQ-Q28-1

  preregistered_prediction:
    quantity: >-
      (i) rho at NIST-I and at each toy cell; (ii) expected ordinary
      collisions at each toy cell; (iii) classification of each of the six
      candidate statistics.
    formula: >-
      (i) rho ~ B*p^{-2/3+o(1)}, giving 2^{-159.14} at NIST-I,
      2^{-5.4}-2^{-18.0} across the toy grid. (ii) M^2/(2*p/12), giving
      ~2^{4.6} at p = 2^20. (iii) rho_unstable for C2-10 collision profile,
      C2-10 locus-occupancy, C2-5 survival probability (fR ~= 1);
      rho_stable for neighbour auto-correlation, sigma-orbit distribution,
      Q2-10 alignment exponent e, Q2-5 rho_LSH.
    source: >-
      All derived in H-SSIQ-dad689 (mechanism STEPS 1-5) and in
      IDEA-20260807-d53a93, transcribing
      ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/Q2.md section "Q2-8". No
      external theorem is asserted here beyond what those records already
      cite from the frozen source (X = B^{1/2}(p/2)^{1/6}, Lemma 3.2).

  scale_relevance:
    tier: toy
    justification: >-
      Every measured quantity is a toy-scale statistic on a table built at
      log2 p <= 40. The classification this contract produces is explicitly
      scoped to the tested rho' range; it is a validity CHECK on other toy
      measurements, not an extrapolation to crypto scale, and the 141-154
      octave gap to NIST-I rho is stated as unclosed by any outcome here.
    correspondence: null

  tail_checks:
    - >-
      Extreme-rho' check: the smallest tested level (rho/1024) is repeated
      with an independent draw of 200 additional bootstrap resamples;
      agreement with the main run's fitted slope within its own CI is
      required before that level's contribution to the fit is trusted.
    - >-
      Full-density check: rho' = rho (no subsampling) must reproduce the
      already-committed full-table statistic values bit-for-bit, as stated
      in the full-table reproduction gate; this is the baseline-embedding
      reproduction and must pass before any subsampled level is reported.
    - >-
      Known-answer conservation: the sum of counted ordinary collisions
      across all bootstrap resamples at a level must equal, in expectation
      within the closed-form interval, the independently computable
      hypergeometric prediction -- a mismatch is invalid_measurement.

  replication:
    seeds: [660637, 660638, 660639]
    independent_instances: 3
    interpretation: >-
      Three seeds per (field size, rho' level) cell. Because the
      hypergeometric law is exact, its agreement must hold within its own
      interval at every seed; because the candidate statistics are measured
      quantities with genuine sampling variance, seed-to-seed spread is
      folded into the bootstrap CI rather than treated as a defect, unlike
      the deterministic-op-count convention used elsewhere in this
      programme.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Do not execute unless this contract is separately approved, frozen, and authorized under a dispatched batch.
    - Stop before any candidate statistic is classified if the known-answer gate or the full-table reproduction gate is not hash-committed first.
    - Stop the whole package on any table-build failure or Stage-0-forced-value mismatch.
    - Stop stage 3 for a given statistic if the resized-table charged control shows divergence beyond the declared band; report that statistic CONFOUNDED and continue with the rest.
    - Stop at the first budget, memory, or wall-clock ceiling and record what was covered rather than truncating silently.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any change to the rho' ladder, the statistic list, the slope threshold, or the classification rule after any number has been observed.
    - Any statistic classified without the paired charged-control comparison against the resized-radius table.
    - Any comparison of a toy-scale statistic value with a crypto-scale or published figure.
    - Absence of the pre-treatment hash commitment of the known-answer and full-table-reproduction gates.
    - Reporting a rho_unstable verdict with less emphasis or detail than a rho_stable one, or omitting a statistic from the final table.

  success_criterion: >-
    This contract has no current success outcome because it is not
    authorized for execution. IF a separately approved, frozen successor is
    executed, its only positive disposition is: the pinning identity and
    known-answer gate reproduce their forced values exactly; the full-table
    reproduction gate passes for every statistic that is run; every
    candidate statistic receives a classification (rho_stable, rho_unstable,
    or confounded) with its fitted slope, CI, and charged-control comparison
    recorded; and the classification table is reported in full regardless of
    which way any individual row falls. A CLASSIFICATION IN WHICH SOME OR
    ALL STATISTICS ARE FOUND RHO-UNSTABLE IS A FULLY SUCCESSFUL, INFORMATIVE
    OUTCOME AND MUST NOT BE REPORTED AS A FAILURE OF THE CONTRACT.

  falsification_criterion: >-
    H-SSIQ-dad689 is falsified, in whole or in the named part, by any of:
    (F1) the pinning identity fails to return the forced rho values at any
    tested cell; (F2) the known-answer gate fails at any level; (F3) the
    full-table reproduction gate fails for a statistic (invalidates that
    statistic's row only); (F5) any predicted rho-unstable statistic returns
    a slope indistinguishable from 0 at all three field sizes with the
    gates passing (this REVISES that statistic's predicted classification,
    it does not falsify the instrument); (F4) a predicted rho-stable
    statistic showing |slope| > 0.1 per octave similarly revises rather
    than falsifies. A table-build or environment failure is NOT a
    falsification of anything; it is infrastructure signal (AGENTS.md
    rule 5).

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      observation, no evidence, no inference.
    future_complete_readout: >-
      Only after separate approval, freezing, authorization, and valid
      execution under a dispatched batch; scoped toy-only and never a
      claim about crypto-scale statistic behaviour or about closing the
      octave gap.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, or missing shared-harness dependency is recorded as
      INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence
      against H-SSIQ-dad689 or against any sibling entry's toy statistics
      (AGENTS.md rule 5).

  required_artifacts:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - The Stage 0 derivation note with the forced numeric values, and the reviewer's attack recorded.
    - Hash-committed known-answer-gate and full-table-reproduction-gate outputs, pre-treatment.
    - Raw per-cell records (log2_p, B, rho_prime_level, bootstrap_index, statistic_id, value), one JSON object per line, keys sorted, UTF-8.
    - The resized-table charged-control comparison per statistic per level.
    - The final classification table with fitted slope, CI, and classification per statistic.
    - Manifest, environment, exact argv, stdout, stderr, timestamps, resource measurements.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - Independent review confirms the pinning identity and its forced values before any compute is authorized.
    - Independent review confirms the known-answer gate and the resized-table charged control can actually fail and actually discriminate.
    - Coordinator separately approves and freezes a successor contract without editing this draft.
    - A dispatched batch under GOAL-SSIQ-001 (or a successor goal) exists to carry the run.

  approval_status: >-
    Pending review. No approved_by field is present because this draft is
    not approved and only the Coordinator may approve it (AGENTS.md rule 1).
