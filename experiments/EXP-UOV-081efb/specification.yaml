experiment:
  id: EXP-UOV-081efb
  hypothesis_id: H-UOV-b7817b
  derived_from_idea: IDEA-20260801-014
  question_id: RQ-UOV-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Cost-model calibration of the plain-UOV security model at toy parameters: measured field
    multiplications of oil-space-recovery and MinRank-style key recovery against an independently
    reproduced model prediction, with a random non-UOV MQ null that can void the attribution
  objective: >-
    The one uncertainty a run reduces is by how much, and in which direction, the plain-UOV security
    model's predicted key-recovery cost differs from the measured cost at parameters where both are
    computable. A run establishes (i) the calibration ratio R = measured field multiplications over
    modeled field multiplications, per cell of a declared (m, n, q) grid, with a per-cell interval from
    at least 10 random instances; (ii) whether the model's prediction can be reproduced independently
    from its own formula, which separates a transcription error from a genuine departure; (iii) whether
    the same attack on random NON-UOV MQ systems at matched (m, n, q) is as fast, which is what makes
    the measured cost attributable to the oil-space structure rather than to the instance merely being
    an MQ system; and (iv) whether R is monotone in each of m, n and q, which is what decides whether
    the toy cells are directionally informative at all. NO ATTACK ON STANDARDIZED PARAMETERS is claimed
    here or would follow from a run; the deliverable is a calibrated table, which is a baseline and not
    a break.
  what_this_is_not:
    - >-
      Not an attack on UOV, MAYO, QR-UOV or SNOVA at their standardized parameters, and not a break of
      anything. It is a cost-model calibration at toy parameters.
    - >-
      Not a transfer of any result to the dependent candidates. Those analyses REFERENCE the plain-UOV
      model; no formal reduction carries this calibration to them and treating it as if one did would
      be an error.
    - >-
      Not a wall-time benchmark. The measured quantity is field multiplications counted by
      instrumentation; wall time is secondary and explicitly implementation-bound.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the executed toy (m, n, q) cells, with the declared attack
      implementation and the declared model formula, the measured-over-modeled cost ratio takes a
      stated value with a stated interval, and is or is not inside [0.5, 2]. WHAT DOES NOT FOLLOW:
      nothing about UOV's standardized parameter sets; nothing about MAYO, QR-UOV or SNOVA security;
      no attack; and no extrapolation of the calibration curve beyond the cells where monotonicity was
      actually demonstrated. A ratio above 2 is the direction most easily produced by a weak attack
      implementation and may never be reported as a model defect without that caveat.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking). Pin the model's cost formula by source and version, and
      pre-declare the (m, n, q) grid, the instance count per cell, the cost unit (field
      multiplications), the calibration band [0.5, 2] and the departure threshold of three cells.
      STAGE 1 (model reproduction, blocking). Reproduce the model's prediction INDEPENDENTLY from its
      own formula at every cell and compare against the model's published value. A disagreement is a
      transcription finding and halts interpretation. STAGE 2 (instance generation and verification).
      Generate at least 10 random toy UOV instances per cell and VERIFY per instance that the
      oil-space dimension and the field are the nominal ones before any attack is run. STAGE 3 (the
      null arm, run BEFORE the signal arm is read). Run the identical attack implementation on random
      non-UOV MQ systems at matched (m, n, q) and record its field-multiplication count against a
      generic MQ solving baseline. If the attack is as fast there, STOP: the measurement does not
      isolate the oil space. STAGE 4 (the signal arm). Run the attack on the UOV instances, counting
      field multiplications by instrumentation, and record peak memory as a first-class metric
      alongside. STAGE 5 (zero compute). Emit the calibration table with every column labelled MEASURED
      or MODELED, the ratio and its per-cell interval, the monotonicity verdict per coordinate, and the
      list of cells declared UNDECIDED because their interval straddles the band.
    instrument: >-
      An instrumented implementation of the best-known oil-space-recovery and MinRank-style key-recovery
      attacks, with a field-multiplication counter as the primary cost meter. The model's prediction is
      evaluated from its formula in the same harness, with the formula and its source recorded in the
      manifest. Every reported number is labelled MEASURED (instrumented run with manifest) or MODELED
      (cost formula, formula and source named); the two never mix in one column. The dominant data
      structure of the attack is sized ANALYTICALLY and the measured peak resident memory is reconciled
      against that analytic size. Recorded through harness/runner.py.
    parameters: >-
      A declared (m, n, q) grid with at least three values in each coordinate so that monotonicity is
      testable in each. At least 10 random instances per cell for the signal arm and at least 10 per
      cell for the non-UOV MQ null. Cost unit: field multiplications. Calibration band [0.5, 2].
      Departure threshold: three or more cells outside the band with intervals excluding it. Wall time
      and peak resident memory recorded per instance. The exact ladders in m, n and q are a declared
      derivation gap and must be fixed before approval.
  controls:
    - >-
      NULL OBJECT, RANDOM NON-UOV MQ SYSTEMS at matched (m, n, q), run BEFORE the signal arm is read.
      FORCED EXPECTATION: the structured attack must NOT be faster there than a generic MQ solver. If
      it is as fast on unstructured systems, the measured cost is not attributable to the oil space and
      the entire calibration is VOID in both directions.
    - >-
      INDEPENDENT MODEL REPRODUCTION: the model's prediction is recomputed from its own formula rather
      than quoted, so a transcription error in the modeled column is separable from a genuine
      calibration departure. This is a blocking control.
    - >-
      INSTANCE VERIFICATION: oil-space dimension and field checked per instance before the attack runs,
      so a generator defect cannot be read as a model departure.
    - >-
      COST-UNIT CONTROL: field multiplications counted by instrumentation as the primary meter, with
      wall time reported separately. A wall-time difference WITHOUT a multiplication-count difference is
      evidence about the implementation and must be reported in those words.
    - >-
      MONOTONICITY CONTROL across each of the m, n and q ladders, which is what tests whether the toy
      cells are directionally informative; two endpoints do not establish a direction, hence at least
      three values per coordinate.
    - >-
      IMPLEMENTATION-QUALITY DISCLOSURE: the attack implementation's known simplifications are listed
      with the DIRECTION of each bias, since a weak implementation inflates R and would manufacture a
      "model is conservative" verdict.
    - >-
      MEMORY RECONCILIATION: the dominant data structure sized analytically and compared against
      measured peak resident memory, so a cell that fits only because the implementation silently
      truncated a table is visible.
  independent_variables:
    - number of oil variables / equations m, over at least three declared values
    - total number of variables n, over at least three declared values
    - field size q, over at least three declared values
    - instance arm, one of random UOV or random non-UOV MQ at matched (m, n, q)
    - instance index within a cell, at least 10 per cell
  metrics:
    primary:
      - >-
        measured_attack_cost, units field multiplications (integer count), MEASURED, computed by
        instrumentation over the full key-recovery run, per instance, per cell
      - >-
        model_predicted_cost, units field multiplications, MODELED, computed by independently
        evaluating the pinned model formula at the same (m, n, q), with the formula and source named
      - >-
        calibration_ratio_R, units dimensionless, computed as measured_attack_cost divided by
        model_predicted_cost, reported per cell as a median over at least 10 instances with a
        bootstrap interval
      - >-
        non_uov_mq_null_cost, units field multiplications, MEASURED, the same attack on random non-UOV
        MQ systems at matched (m, n, q), reported against a generic MQ solving baseline
    secondary:
      - >-
        model_reproduction_agreement, units a relative difference, computed as the independently
        reproduced prediction against the model's published value at each cell
      - >-
        ratio_monotonicity_verdict, units a per-coordinate boolean plus the observed sequence of R
        values, computed across each of the m, n and q ladders beyond the per-cell intervals
      - >-
        peak_rss_bytes, units bytes, MEASURED, reconciled against the analytically sized dominant data
        structure, reported per cell as a first-class metric alongside time
      - >-
        analytic_dominant_structure_size, units entries and bytes, MODELED, with the sizing formula
        stated
      - >-
        wall_seconds per instance, units seconds, MEASURED but LABELLED IMPLEMENTATION-BOUND in every
        row
      - >-
        instance_verification_pass_rate, units a fraction, computed as the fraction of generated
        instances whose oil-space dimension and field match the nominal ones
      - >-
        undecided_cell_list, units a list of cells, being those whose ratio interval straddles the
        [0.5, 2] band
  heuristic_under_test:
    id: HEUR-UOV-CAL-1
    formal_statement: >-
      MONOTONE SCALING. The plain-UOV attack model's predicted cost is monotone in each of m, n and q
      over the tested grid, and the calibration ratio R varies monotonically (or is flat) in each
      coordinate rather than erratically, holding the other coordinates fixed, beyond the reported
      per-cell intervals.
    scale_access_and_transfer: >-
      Access is by direct execution at toy (m, n, q) where the attack terminates in budget. TRANSFER
      ASSUMPTION, STATED AND BOUNDED: a monotone R across the tested ladders makes the DIRECTION of the
      calibration informative within the tested range and NOWHERE ELSE. No extrapolation to
      standardized parameters is performed, offered, or licensed by any outcome.
  preregistered_prediction:
    quantity: >-
      The calibration ratio R = measured field multiplications over modeled field multiplications, per
      cell, with its per-cell interval.
    formula: >-
      Predicted, before any run: R lies inside [0.5, 2] at every decidable cell; the non-UOV MQ null
      arm shows no structure-free speedup; the independently reproduced model prediction agrees with the
      published value to numerical precision; and R is monotone (or flat) in each coordinate. Under the
      alternative, R lies outside [0.5, 2] at three or more cells with intervals excluding the band,
      which is a calibration departure and whose SIGN is reported with it.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-014, whose single stated prediction is that a
      ratio outside [0.5, 2] at three or more parameter cells is a calibration departure, and whose
      required metrics are the measured cost per cell, the model prediction per cell, and the ratio and
      significance per cell. The choice of field multiplications as the cost unit, the instance count
      of 10 per cell, the three-values-per-coordinate requirement and the memory reconciliation are
      added by this contract as the operationalization of that prediction, and are frozen here before
      any run exists.
  scale_relevance:
    tier: toy
    justification: >-
      Executed only at (m, n, q) cells where BOTH the attack terminates in budget AND the model formula
      is evaluable, which is the entire design: the model is only ever calibrated where it can be
      checked. The cost is that the cells are far below any standardized parameter set, and the design
      does not attempt transfer. The monotonicity arm exists precisely to say whether the DIRECTION of
      the calibration is even stable across the tested range; a non-monotone R would mean the toy cells
      are not directionally informative and would confine every statement to individual cells.
    correspondence: null
  tail_checks:
    - >-
      Report the per-instance ratio distribution within each cell, not only the median, since a cell
      whose ratio is driven by one outlying instance is not calibrated.
    - >-
      Report the largest and smallest measured cost in each cell against the modeled value, so a heavy
      tail in attack cost is visible.
    - >-
      Report every cell whose interval straddles the [0.5, 2] band as UNDECIDED rather than as
      calibrated; a band decision that rests on a straddling interval is not a decision.
    - >-
      Report the cells where the attack timed out or exhausted memory as a reachability limit with the
      largest reachable cell named, never as calibrated or as departed.
    - >-
      Report the non-UOV MQ null's own cost distribution, not only whether it was slower, so a marginal
      separation is visible as marginal.
  replication:
    seeds:
      - 20260801
      - 20260802
      - 20260803
    independent_instances: 3
  budget:
    wall_clock_seconds: 14400
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 12.0
    memory_gb: 16
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
    - >-
      Run the independent model reproduction (Stage 1) FIRST. If it disagrees with the model's
      published value at any cell, halt interpretation and report the transcription finding; do not
      compute a ratio.
    - >-
      Run the non-UOV MQ null (Stage 3) BEFORE the signal arm is read. If the attack is as fast there,
      STOP: the measurement does not isolate the oil space.
    - >-
      Abort a cell whose attack exceeds its per-cell wall-clock or memory allowance, and record it as a
      reachability limit rather than as a measurement.
    - >-
      Declare a cell UNDECIDED, rather than calibrated, when its ratio interval straddles the
      [0.5, 2] band.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The grid, the band [0.5, 2], the departure threshold of three cells and the cost unit are frozen
      before any run and are not revised afterwards.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and
      is NEVER negative mathematical evidence (AGENTS.md rule 5). An attack that does not terminate at
      the largest cells bounds the grid's reachability, not the model's accuracy.
    - >-
      A run whose non-UOV MQ null arm is missing, or was not executed in the same invocation as the
      signal arm, is invalid_measurement: the attribution the contract exists to establish was not
      established.
    - >-
      A run whose modeled column was QUOTED rather than independently reproduced is
      invalid_measurement, because a transcription error is then indistinguishable from a departure.
    - >-
      A run reporting WALL TIME as the calibration ratio's numerator is invalid_measurement; the cost
      unit is field multiplications and a wall-time ratio measures the implementation.
    - >-
      A run in which instances failed oil-space-dimension or field verification and were nonetheless
      included is invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the independent
    model reproduction agrees with the published value at every cell; every included instance passed
    oil-space-dimension and field verification; the non-UOV MQ null arm was executed in the same
    invocation and shows no structure-free speedup; the calibration ratio R is reported per cell with a
    bootstrap interval over at least 10 instances, with every column labelled MEASURED or MODELED; peak
    resident memory is reported and reconciled against the analytically sized dominant structure; the
    monotonicity verdict is reported per coordinate; and every straddling cell is listed as UNDECIDED.
    Each is decidable from the primary metrics above. Note explicitly: R inside the band and R outside
    the band are BOTH successes of the measurement; the criterion is completeness, and the scientific
    verdict is read from the falsification criteria below.
  falsification_criterion:
    - >-
      The calibration ratio lies outside [0.5, 2] at three or more cells with per-cell intervals
      excluding the band. THE HYPOTHESIS IS FALSIFIED: the model departs from measurement at toy
      parameters, and the DIRECTION is the deliverable. R below 0.5 (the model overstates attack cost)
      is the higher-consequence direction and requires independent replication before any statement.
    - >-
      The attack on random non-UOV MQ systems is as fast as on UOV instances. The measured cost is not
      attributable to the oil space and the calibration is VOID in both directions.
    - >-
      The independently reproduced model prediction disagrees with the published value at any cell. A
      transcription defect; no ratio is interpretable until it is resolved.
    - >-
      R is non-monotone across any ladder beyond the intervals. HEUR-UOV-CAL-1 is falsified and the
      deliverable is scoped to individual cells rather than to a curve.
    - >-
      Measured peak resident memory cannot be reconciled with the analytic sizing of the dominant
      structure. The implementation is not doing what the model counts and the cost comparison is not
      like for like.
    - >-
      NOT a falsification: a cell at which the attack does not terminate. That is a reachability limit
      under AGENTS.md rule 5 and is never evidence that the model is right or wrong there.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, and the pinned model cost formula with its source and version
    - >-
      raw-result.json carrying every per-instance measured cost, modeled cost and ratio, not summaries,
      plus per-instance verification results and wall times
    - >-
      the non-UOV MQ null arm's per-instance measurements, in the same file as the signal arm
    - >-
      a calibration table with every column labelled MEASURED or MODELED, the formula and source named
      for each modeled column, and every optimistic or simplifying assumption of the attack
      implementation listed with the DIRECTION of its bias
    - >-
      the analytic sizing of the dominant data structure alongside measured peak_rss_bytes
    - >-
      the pre-registration text with the frozen grid, band and threshold, written before the first run
      and hashed
    - >-
      certificate kind: any claimed key recovery carries a certificate (the recovered oil space,
      re-verified independently by the run wrapper against the public key); cells with no recovery
      carry certificate kind none
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is
      the user's gate because it authorizes execution and spends compute.
    - >-
      The model's cost formula must be PINNED BY SOURCE AND VERSION before approval. The parent
      proposal names none, and a calibration against an unnamed model is not a calibration.
    - >-
      The (m, n, q) ladders must be declared numerically before approval, with at least three values in
      each coordinate, since monotonicity in each coordinate is a declared falsification condition and
      is untestable otherwise.
    - >-
      The attack implementation must be identified by path and its known simplifications listed with
      the direction of each bias, since implementation weakness biases R upward and would manufacture
      the "model is conservative" verdict.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260801-014
    authored_at: '2026-08-25'
    note: >-
      The parent proposal is terse: it supplies the deliverable (a calibration table over (m, n, q)),
      the single prediction (ratio outside [0.5, 2] at three or more cells is a departure), the two
      controls (independent reproduction of the model's predictions; a random non-UOV MQ null) and one
      heuristic (HEUR-UOV-CAL-1, monotone scaling). This contract operationalizes the cost unit as
      field multiplications rather than wall time, requires at least three values per coordinate so the
      monotonicity heuristic is testable, promotes memory to a first-class metric with analytic
      reconciliation per the cost-model experiment pattern, and requires the measured-versus-modeled
      column labelling and optimistic-assumption disclosure. Instance counts and budgets are design
      choices declared here; the proposal supplies at least 10 instances per cell and an estimated_cost
      of implementation medium and compute medium.
  derivation_gaps:
    - >-
      THE MODEL IS NOT NAMED. "The plain-UOV security model" is not a citation; its exact cost formula
      and source must be pinned before approval, or the modeled column is unverifiable and the whole
      ratio is meaningless.
    - >-
      THE ATTACK IMPLEMENTATION IS NOT IDENTIFIED. Whether an oil-space-recovery or MinRank-style
      implementation exists in this repository is not asserted by the parent proposal, and building one
      is a separate task from running this measurement.
    - >-
      The (m, n, q) ladders are unspecified. They must be declared numerically, and the largest cell
      must be chosen so the attack plausibly terminates in budget, or the grid will be truncated by
      reachability rather than by design.
    - >-
      The generic MQ solving baseline against which the non-UOV null is scored is unspecified. Without
      it, "the attack was not faster on unstructured systems" has no yardstick.
    - >-
      Whether the measured cost should include instance generation and preprocessing is not settled.
      The model counts an algebraic step; including or excluding setup moves R and must be fixed before
      approval so it cannot be chosen after seeing the ratio.
