experiment:
  id: EXP-ICEX-a54be2
  hypothesis_id: H-ICEX-245779
  derived_from_idea: IDEA-20260809-5a36f3
  question_id: RQ-QRE-6dba8c
  batch_id: BATCH-a70dc3
  version: 1
  title: >-
    A staged verification protocol for the RSA-against-ECDLP quantum cost ratio-
    Stage 0 acquires and files two primary papers or the contract stops, Stage 1
    reproduces each paper's headline from its own inputs or the comparison is
    reported incomplete, Stage 2 pre-checks that the two assumption sets are far
    enough apart for the band to be reachable, and only then is a unified ratio
    computed, decomposed, and tested against a curve-free arm
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. The routine claim that elliptic-curve keys fall to a
    quantum adversary sooner or more cheaply than RSA keys is assembled by
    dividing headline numbers from papers with different physical assumptions and
    different circuit optimisations. Whether costing both under ONE assumption
    set moves that ratio, and which assumptions the movement is about, is
    arithmetic that no record in this corpus has performed.

    (B) WHY THIS IS A VERIFICATION PROTOCOL AND NOT AN EXPERIMENT ON A PIPELINE.
    IDEA-20260809-5a36f3 instructs the executor to 'Run both problems through the
    pipeline'. NO SUCH PIPELINE EXISTS. Its stated upstream record,
    IDEA-20260809-593de3, was opened and read in full by TASK-20260904-f2b3db- it
    is a PROPOSAL with status proposed, and what it proposes is Toffoli counts
    for reversible modular multiplication and exponentiation validated by
    classical simulation. That is the arithmetic layer alone- no error
    correction, no magic-state distillation, no layout or routing, no
    physical-qubit or wall-clock output. The pipeline must therefore be BUILT and
    VALIDATED inside this contract before any comparison, and building it is
    gated on the literature.

    (C) THE LITERATURE GATE IS THE GOVERNING QUESTION'S, NOT THIS CONTRACT'S.
    RQ-QRE-6dba8c, read in full, constrains verbatim- 'No pipeline output is
    recorded before at least two primary resource-estimation papers are filed as
    KN-LIT entries with their input tables extracted', and 'Every constant in the
    pipeline is either derived in the record or cited to a filed source; an
    unsourced constant fails review'. The source idea's own source_refs read
    'Published RSA and ECC quantum resource estimates -- RECALLED, REQUIRED
    READS' and its novelty screen reads 'WEB NOT CHECKED'. Stage 0 is therefore
    acquisition, and failing it is the reported result rather than a reason to
    proceed with recalled numbers.

    (D) THE BAND IS PRE-REGISTERED AND ITS REACHABILITY IS PRE-CHECKED. The
    statistic is D := log10(ratio_unified) - log10(ratio_crosspaper), reported
    separately for physical qubits and for surface-code cycles. |D| at least 0.30
    records DIFFERS; |D| at most 0.10 records EFFECTIVELY ALIGNED; between is
    INCONCLUSIVE, declared in advance. BECAUSE D COULD BE UNREACHABLE BY
    CONSTRUCTION - if the two papers' assumption sets happen to be nearly
    equivalent - Stage 2 evaluates the pipeline at EACH paper's own assumption
    set and requires the two resulting ratios to differ by more than 0.10 in
    log10 before any DIFFERS verdict is admissible. A cell failing that is
    UNDERPOWERED, with the observed and required spreads reported.

    (E) UNIT DISCIPLINE IS LOAD-BEARING AND IS NOT AUTOMATIC. A published
    wall-clock figure is a cycle count times that paper's cycle time. Dividing
    two published wall-clock figures divides two different units and produces a
    number that is not a ratio of anything. All time ratios in this contract are
    SURFACE-CODE CYCLES over SURFACE-CODE CYCLES, dimensionless; seconds appear
    only under one declared cycle time applied identically to both arms.

    (F) THE CURVE-FREE ARM. The ECDLP arm's cost is dominated by operand width
    and modular-multiplication count, both of which a curve-free object has. A
    generic 256-bit modular-arithmetic Shor instance with the ECDLP arm's
    modular-multiplication count is therefore run as a null, with the consequence
    of agreement pre-stated.
  inputs:
    cost_unit: >-
      PHYSICAL QUBITS- a dimensionless count. TIME- SURFACE-CODE CYCLES, a
      dimensionless count. SECONDS appear ONLY as (cycles) times (one declared
      cycle time), applied identically to both arms, and are reported beside the
      cycle count rather than instead of it. TOFFOLI and T counts are
      dimensionless counts. NO RATIO IN THIS CONTRACT IS FORMED ACROSS TWO UNITS,
      and both sides of every ratio are charged in the same unit by construction.
    unit_discipline: >-
      BINDING AND ENFORCED. Tags in {qubits, cycles, seconds, toffoli, t_gates,
      dimensionless}. A ratio may be formed only within one tag. Any attempt to
      form a seconds ratio from two different cycle times is refused by the
      harness and recorded as a refusal.
    problem_pairing: >-
      DECLARED BEFORE ANY EVALUATION- RSA-2048 is paired with 256-bit prime-field
      ECDLP at NOMINAL CLASSICAL SECURITY LEVEL. The pairing is a choice, not a
      fact, and the sensitivity of every reported ratio to alternative pairings
      is a required output.
    pipeline_definition: >-
      A deterministic pure function from (algorithm parameters, physical error
      rate, cycle time, code distance, magic-state distillation scheme,
      connectivity and routing model, arithmetic-layer construction) to
      (physical qubits, surface-code cycles). Every constant is either derived in
      the run record or cited to a filed KN-LIT entry. An unsourced constant is a
      hard failure, not a warning.
    arithmetic_layer: >-
      One shared counter used by the RSA arm, the ECDLP arm and the curve-free
      control, so the three differ only in the circuit fed to it. Counts are
      validated by classical simulation of the same reversible circuits at small
      bit widths, with reversibility checked on all tested inputs and with gate
      counting implemented twice - by traversal and by construction-time
      accumulation - and required to agree exactly.
    fixtures: >-
      Each filed paper's declared input table, transcribed verbatim with a quoted
      excerpt and a source hash, stored as a fixture. A fixture that cannot be
      transcribed from a primary source is not created.
  controls:
  - >-
    C1 ACQUISITION GATE, STAGE 0, BLOCKING. At least two primary
    resource-estimation papers obtained, primary-read, and filed as KN-LIT
    entries with their input tables extracted and hashed. If fewer than two are
    obtainable, the contract STOPS and reports the acquisition failure. No
    recalled number is substituted.
  - >-
    C2 PAPER-ASSUMPTION REPRODUCTION, STAGE 1, BLOCKING. Each paper's own
    headline physical-qubit count and cycle count must be recoverable by running
    the pipeline at that paper's own inputs, within a tolerance declared in this
    contract before Stage 1 runs. Reproduction failure is a first-class result
    reported with its magnitude, never tuned away.
  - >-
    C3 SINGLE-CHANGE CONTROL. At a fixed assumption set, the RSA and ECDLP
    evaluations must differ ONLY in the arithmetic layer. Any other difference
    makes the ratio incomparable and voids it. Enforced by a structural diff of
    the two input vectors, recorded per evaluation.
  - >-
    C4 NON-DEGENERACY PRE-SCREEN, STAGE 2, BLOCKING FOR ANY DIFFERS VERDICT. The
    pipeline is evaluated at each paper's OWN assumption set, producing two
    ratios. Their log10 difference must exceed 0.10 before a DIFFERS verdict is
    admissible.
  - >-
    C5 INDEPENDENT COUNT CONTROL. Gate counting implemented twice - by traversal
    and by construction-time accumulation - with exact agreement required. A
    disagreement voids every count.
  - >-
    C6 REVERSIBILITY CONTROL. Each reversible circuit must be invertible on all
    tested inputs and must compute the intended function on at least one thousand
    random inputs per bit width. Anything less than exact agreement invalidates
    the count.
  - >-
    C7 CURVE-FREE NULL, REQUIRED. A generic 256-bit modular-arithmetic Shor
    instance with the ECDLP arm's modular-multiplication count and operand width
    and no elliptic curve, run through the identical pipeline at the identical
    assumption set. Consequence pre-stated in falsification_criterion.
  - >-
    C8 PAIRING SENSITIVITY CONTROL. Every reported ratio is re-emitted under at
    least one alternative declared pairing, so that no ratio is quoted as if it
    were pairing-independent.
  - >-
    C9 PROHIBITED-OUTPUT SCAN, BLOCKING ON EMISSION. A mechanical scan of every
    emitted artifact for dates, timelines, probabilities of arrival, orderings in
    time between the two cryptosystems, and policy or migration language. A hit
    blocks emission of that artifact.
  independent_variables:
  - problem in {RSA-2048 factoring, 256-bit prime-field ECDLP, curve-free 256-bit modular}
  - assumption set in {paper A's own, paper B's own, unified}
  - physical error rate, over the declared range
  - surface-code cycle time, over the declared range
  - code distance, over the declared range
  - magic-state distillation scheme, over the declared discrete set
  - connectivity and routing model, over the declared discrete set
  - problem pairing, over the declared alternatives
  metrics:
    primary:
    - physical qubits (qubits) per problem per assumption set
    - surface-code cycles (cycles) per problem per assumption set
    - >-
      ratio_unified and ratio_crosspaper, separately for qubits and for cycles,
      each dimensionless and each formed within one unit
    - >-
      D = log10(ratio_unified) - log10(ratio_crosspaper), separately for qubits
      and for cycles
    secondary:
    - per-paper reproduction gap in log10, per output, with the declared tolerance
    - the non-degeneracy pre-screen spread in log10
    - one-at-a-time decomposition of D by assumption, and the interaction residual
    - Toffoli and T counts per arm and per bit width, from both counting methods
    - classical-simulation agreement fraction per circuit per bit width
    - the structural diff of the two input vectors per evaluation (C3)
    - every ratio re-emitted under each alternative pairing
    - source hash and quoted excerpt for every filed input table
  heuristic_under_test: HQ-1
  preregistered_prediction:
    quantity: >-
      The difference between the unified-assumption ratio and the cross-paper
      quotient, and the fraction of that difference explained by a
      one-at-a-time assumption decomposition.
    formula: >-
      'D := log10(ratio_unified) - log10(ratio_crosspaper). PRE-REGISTERED
      BANDS- |D| at least 0.30 records DIFFERS; |D| at most 0.10 records
      EFFECTIVELY ALIGNED; between records INCONCLUSIVE. REACHABILITY PRE-CHECK,
      required before any DIFFERS verdict- the two ratios obtained at each
      paper's own assumption set must differ by more than 0.10 in log10.
      DECOMPOSITION- the one-at-a-time sweep must account for at least 70 percent
      of D in log10, with interaction residual at most 30 percent.'
    source: >-
      Derived in H-ICEX-245779 statement (F). The bands are pre-registered
      tolerances chosen before any evaluation and are UNTESTED EXPECTATIONS, not
      measurements. No published number backs them, because no primary source has
      been read by any agent in this program for this lane- RQ-QRE-6dba8c records
      every external figure it names as RECALLED and UNVERIFIED.
  scale_relevance:
    tier: crypto
    justification: >-
      The costed instances are RSA-2048 and 256-bit prime-field ECDLP, which are
      cryptographic parameters, so the descriptive tier is crypto. THAT LABEL
      DESCRIBES THE COSTED PARAMETERS AND NOTHING ELSE. No quantum hardware is
      used, no instance is solved, no key is targeted, and the physical
      assumptions cannot be validated by this program at any scale. The
      admissible output is 'under these stated assumptions the pipeline gives X,
      and X moves this much when an assumption moves'.
    correspondence: null
  tail_checks:
  - >-
    Report the largest single-assumption contribution to D and the assumption
    responsible, together with the second largest. If the two are within 20
    percent of each other the practical output is 'two assumptions', not 'one',
    and must be reported that way.
  - >-
    Report D at the extreme corners of the declared assumption ranges, not only
    at their centres, so that a decomposition valid only near the centre is
    visible as such.
  - >-
    Report the largest reproduction gap over both papers and both outputs against
    the declared tolerance.
  replication:
    seeds: [101, 103, 107]
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1
  stopping_rules:
  - >-
    Stage 0 first. If fewer than two primary papers can be obtained and filed,
    STOP the contract and report the acquisition failure. Do not proceed on
    recalled numbers under any circumstance.
  - >-
    Stage 1 next. If a paper's headline cannot be reproduced from its own inputs
    within the declared tolerance, report the gap and exclude that paper from
    every downstream comparison; if both fail, STOP.
  - >-
    Stage 2 next. If the non-degeneracy pre-screen spread is at most 0.10, emit
    the UNDERPOWERED verdict and STOP before computing any DIFFERS verdict.
  - >-
    Stage 3 computes the unified ratio and its decomposition. Stage 4 runs the
    curve-free null. Neither runs before its predecessor has a completed receipt.
  - >-
    The prohibited-output scan C9 runs on every artifact before emission and
    blocks it on a hit.
  invalidation_rules:
  - Fewer than two primary papers filed with extracted input tables; the contract stops rather than degrading.
  - Any pipeline constant that is neither derived in the run record nor cited to a filed KN-LIT entry.
  - The two counting methods C5 disagree, or the reversibility check C6 is not exact.
  - The structural diff C3 shows the two arms differ in anything other than the arithmetic layer.
  - Any ratio formed across two unit tags, or any seconds ratio formed under two different cycle times.
  - >-
    A DIFFERS verdict recorded from a cell that failed the non-degeneracy
    pre-screen. Invalid by contract, regardless of the value of D.
  - >-
    Any emitted artifact containing a date, timeline, probability of arrival,
    ordering-in-time between the cryptosystems, or a policy or migration
    statement. Void per RQ-QRE-6dba8c.
  - Wall-clock or memory exhaustion; failed_infrastructure under AGENTS.md rule 5.
  success_criterion: >-
    The contract delivers its object when- Stage 0 files at least two primary
    papers with hashed, excerpted input tables; Stage 1 reports a reproduction
    gap per paper per output against the declared tolerance; Stage 2 reports the
    non-degeneracy spread; Stage 3, only if Stage 2 passes, reports
    ratio_unified, ratio_crosspaper and D for qubits and for cycles with the
    one-at-a-time decomposition and its interaction residual; Stage 4 reports the
    curve-free arm; every ratio is re-emitted under at least one alternative
    pairing; and the prohibited-output scan passes on every artifact. A stop at
    Stage 0, 1 or 2 is a COMPLETE and REPORTABLE outcome of this contract, not a
    failure of it.
  falsification_criterion: >-
    R0 ACQUISITION. Fewer than two primary resource-estimation papers can be
    obtained and filed. The comparison is not attempted; the acquisition failure
    is the result. This is the single most likely outcome and it is designed to
    be reportable.

    R1 EXPRESSIVENESS. The pipeline cannot express one paper's assumption set.
    The comparison is INCOMPLETE and says so, per the source idea's own
    falsification condition; no unified ratio is reported against that paper.

    R2 REPRODUCTION. A paper's headline is not recovered from its own stated
    inputs within the declared tolerance. Reported with its magnitude as a
    first-class result; that paper is excluded from the comparison.

    R3 UNDERPOWERED, NOT SHRUNK. The two papers' own assumption sets produce
    ratios within 0.10 in log10. The DIFFERS band is unreachable by construction,
    the cell is UNDERPOWERED, and the observed and required spreads are reported.
    No DIFFERS verdict may be recorded.

    R4 ALIGNED. Stage 2 passes and |D| is at most 0.10. The published assumption
    sets are effectively aligned in their effect on the ratio, which is worth
    establishing rather than presuming, and is reported as the result.

    R5 DIFFERS. Stage 2 passes and |D| is at least 0.30. The cross-paper quotient
    is not the unified ratio, and the decomposition names which assumptions carry
    the difference. Scoped to the declared assumption ranges, the declared
    pairing, and the two filed papers.

    R6 NO DECOMPOSITION. The interaction residual exceeds 30 percent of D. Strong
    interactions are reported instead of a decomposition and NO single assumption
    may be named as responsible.

    R7 CURVE-FREE NULL, CONSEQUENCE PRE-STATED. If the generic 256-bit
    modular-arithmetic arm reproduces the ECDLP arm's physical-qubit and cycle
    totals within 10 percent, then every number in this contract is a statement
    about operand width and modular-multiplication count and NOT about elliptic
    curves. The result may not be reported as an elliptic-curve or ECDLP finding,
    and any evidence record must record that in its boundaries.

    R8 PROHIBITED OUTPUT. Any artifact containing a timeline, date, ordering-in-
    time, probability of arrival, or policy recommendation is void regardless of
    its numbers, per RQ-QRE-6dba8c.
  required_artifacts:
  - frozen contract hash and the declared tolerances, recorded before Stage 1
  - the two filed KN-LIT entries with extracted input tables, source hashes and quoted excerpts
  - the pipeline source with every constant annotated by its derivation or its filed citation
  - per-paper reproduction transcript with the gap per output against the tolerance
  - the non-degeneracy pre-screen transcript with both per-paper ratios
  - ratio_unified, ratio_crosspaper and D for qubits and for cycles, unit-tagged
  - the one-at-a-time decomposition table and the interaction residual
  - Toffoli and T counts from both counting methods, per arm and per bit width
  - classical-simulation transcripts for every circuit and bit width, with agreement fractions
  - the structural input-vector diff per evaluation
  - every ratio re-emitted under each alternative pairing
  - the curve-free arm's full outputs at the identical assumption set
  - the prohibited-output scan report for every emitted artifact
  - exact command, git commit, dirty-tree state, environment and dependency versions
  - stdout, stderr, timestamps, resource measurements, and per-stage validity status with reason
  assigned_to: executor
  approved_by: null
