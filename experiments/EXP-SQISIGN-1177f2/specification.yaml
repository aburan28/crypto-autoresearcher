experiment:
  id: EXP-SQISIGN-1177f2
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SQISIGN-c0488f
  question_id: RQ-SQISIGN-39f231
  goal_id: GOAL-SQISIGN-002
  batch_id: null
  title: >-
    Batch-1 reading contract: file the SQIsign specification actually audited,
    produce the item-by-item published-versus-internal inventory, evaluate four
    pre-registered forced values, and BUILD AND CALIBRATE the ingredient checker
    against SIKE and a graded SQIsign-LEAK ladder before any inapplicability
    verdict is written

  objective: >-
    GOAL-SQISIGN-002's next_action states that the first batch is a reading task
    and that everything else is downstream of the inventory, and
    RQ-SQISIGN-39f231's first constraint forbids designing an experiment that
    presupposes a data surface before the sources are filed. This contract is
    therefore not an attack experiment and does not presuppose a surface: it is
    the contract that PRODUCES the surface, files the source, and calibrates the
    instrument that later work would use. Its second half exists because the
    goal's own next_action binds it -- BUILD THE NULL CONTROL BEFORE RUNNING THE
    AUDIT -- and because an audit that has only ever returned "does not apply" is
    untested instrumentation.

  what_this_is_not:
    - Not an attack, an attempted key recovery, a forgery, or a distinguisher.
    - Not a claim about the hardness of the endomorphism ring problem or the isogeny path problem. Those objects belong to GOAL-SSI-001 and no baseline for them is re-derived here.
    - Not a claim about signing-transcript distinguishability or zero-knowledge, which belong to GOAL-SQISIGN-001. This contract does not edit that goal's records and does not resolve the scope observation recorded in GOAL-SQISIGN-002.non_duplication.
    - Not an executed Kani computation at any scale. No two-dimensional isogeny is computed. The executed toy instantiation is a named successor, outside this contract.
    - Not a statement that SQIsign is secure, safe from SIDH-style attacks, or resistant to auxiliary-information attacks. Those sentences are forbidden by RQ-SQISIGN-39f231's claim_tier_ceiling.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has happened.
    - Not a status change to any hypothesis, knowledge entry, goal, or question.

  claim_ceiling:
    tier: toy
    documentary_component: >-
      The inventory, the byte reconciliation, the forced-value derivations and
      the source filing are DOCUMENTARY results: statements about a published
      document and about arithmetic, reported as such and not as experimental
      findings.
    experimental_component: >-
      TOY WITHOUT EXCEPTION. Every ingredient-checker verdict, every
      SQIsign-LEAK ladder cell and every control outcome is a statement about the
      checker and the declared surfaces, at no cryptographic scale, and says
      nothing directly about SQIsign at NIST-I/III/V parameters.
    exact_scope_a_run_could_support: >-
      At most: that the Kani glue-and-split template as recorded in KN-TECH-026,
      instantiated by a rule set frozen before use and calibrated to fire on
      SIDH/SIKE and on a disguised x-only leak, does not find its ingredient set
      in the published surface of SQIsign v2.0.1 at the three declared parameter
      sets, for the single named reason C1 of H-SQISIGN-c0488f, together with the
      quantitative statements C2, C3 and C4 at the levels measured. Nothing more.

  inputs:
    primary_source:
      title: >-
        SQIsign Algorithm specifications and supporting documentation, Version
        2.0.1
      date: '2025-07-07'
      url: https://sqisign.org/spec/sqisign-20250707.pdf
      obtained: >-
        Fetched 2026-08-06 in the session that wrote this contract: HTTP 200,
        1,087,080 bytes, file type "PDF document, version 1.7".
      sha256: >-
        NOT RECORDED. This session did not compute or record a digest into the
        ledger. The executor MUST compute and record it at Stage 0; a contract
        that asserted a hash it did not compute would violate AGENTS.md rule 9.
      extraction_method_used_so_far: >-
        A pure-zlib stream extractor written for that session, because pdftotext
        is absent from the container and pypdf raises pyo3_runtime.PanicException
        on import (observed). EXTRACTION DAMAGE IS POSSIBLE AND IS THE PRIMARY
        EVIDENTIARY RISK OF THIS ENTIRE CONTRACT.
      version_caveat: >-
        Section 1.3 of this document describes it as "the present round-2 SQIsign
        submission". GOAL-SQISIGN-002 and RQ-SQISIGN-39f231 presuppose a distinct
        ROUND-3 specification. Whether one exists is UNVERIFIED and settling it is
        Stage 0, deliverable D0-1.
    secondary_sources_to_obtain:
      - >-
        The SQIsign reference implementation's public headers and serialisation
        routines, from the SQIsign GitHub organisation, for the size constants and
        the field list. Also the KAT files if obtainable from the submission
        package.
      - >-
        Primary Kani sources (Castryck-Decru; Maino-Martindale; Robert) to settle
        whether the requirement that known torsion order exceed the isogeny degree
        persists in dimensions 4 and 8. NOT READ; this is the load-bearing
        literature obligation and it may fail to be satisfiable under the network
        policy, in which case it is recorded as unobtained, not guessed.
      - >-
        ePrint 2026/1305 (SQIsign not SUF-CMA, basis-change matrix negatable mod
        2^N) -- NOT READ, relayed via the 2026-08-05 scouting brief, adjacent prior
        art on M_chl that must be checked before any novelty claim about matrices.
      - >-
        NIST IR 8610 -- NOT READ, relayed. Needed only to quote the
        SIKE-resilience sentence accurately if it is quoted at all.
    parameters_taken_from_the_source_and_to_be_re_verified:
      levels: [NIST-I, NIST-III, NIST-V]
      lambda: {NIST-I: 128, NIST-III: 192, NIST-V: 256}
      p: {NIST-I: "5*2^248 - 1", NIST-III: "65*2^376 - 1", NIST-V: "27*2^500 - 1"}
      f: {NIST-I: 248, NIST-III: 376, NIST-V: 500}
      e_rsp: {NIST-I: 126, NIST-III: 192, NIST-V: 253}
      e_chl: {NIST-I: 122, NIST-III: 184, NIST-V: 247}
      D_mix: "smallest prime larger than 2^{4*lambda} (Sections 4.2 and 10.2); Appendix B's extracted formula for it is inconsistent with that prose and is an open item"
      fp_encoded_bytes: {NIST-I: 32, NIST-III: 48, NIST-V: 64}
      ec_curve_encoded_bytes: {NIST-I: 64, NIST-III: 96, NIST-V: 128}
      torsion_2power_bytes: {NIST-I: 32, NIST-III: 48, NIST-V: 63}
      publickey_bytes: {NIST-I: 65, NIST-III: 97, NIST-V: 129}
      secretkey_bytes: {NIST-I: 353, NIST-III: 529, NIST-V: 701}
      signature_bytes: {NIST-I: 148, NIST-III: 224, NIST-V: 292}
    seeds_and_seed_derivation_rule: >-
      NO RANDOMNESS IS USED IN STAGES 0-2; every quantity is a function of the
      document. Stage 3's ingredient checker is deterministic over a declared,
      enumerated cell list and uses no randomness either. THEREFORE NO SEED IS
      REQUIRED, and this field records that fact rather than inventing a seed. If
      the successor toy instantiation is later authorized it must declare its own
      seed derivation rule; this contract does not pre-authorize it.
    reproducibility_rule: >-
      A third party reproduces every number here by: fetching the URL above,
      recording the digest, extracting the text by any two independent methods,
      and evaluating the stated integer formulas. The cell list for Stage 3 is
      enumerated in full in arms_and_controls and contains no free choices.

  stages:
    - id: S0
      name: Source acquisition and filing
      cost: "<= 3600 s, zero compute beyond network fetches"
      can_terminate_the_run: true
      steps:
        - >-
          D0-1. Determine whether a SQIsign Round-3 specification distinct from
          v2.0.1 exists. Search the NIST CSRC round-3 page and sqisign.org. Record
          the answer with URLs and dates. IF A DISTINCT ROUND-3 DOCUMENT EXISTS,
          STOP AND RE-SCOPE: every parameter in this contract is then about the
          wrong document, and the correct action is a superseding contract, not a
          repair.
        - >-
          D0-2. Fetch the audited document, record SHA-256, size and HTTP status.
          File it as a KN-LIT entry with provenance level READ-PRIMARY, the
          extraction method named, and extraction damage marked -- specifically
          the two known residuals (the NIST-III signature-size reconciliation and
          the Appendix B secret-key formula's 4-versus-5 coefficient) recorded as
          extraction-uncertain rather than as defects.
        - >-
          D0-3. Re-extract Chapter 4 (Sections 4.3, 4.5, 4.6), Chapter 5, Chapter
          10 (Sections 10.2.1 and 10.2.3) and Appendix B by a SECOND independent
          method, and diff against the figures in inputs above. Every disagreement
          is reported; none is silently resolved.
        - >-
          D0-4. Attempt the primary Kani sources and record, verbatim, the
          requirement on the relation between known torsion order and isogeny
          degree in dimensions 2, 4 and 8. IF THEY CANNOT BE OBTAINED, RECORD THAT
          AS AN UNOBTAINED SOURCE. Under AGENTS.md rule 5 that is an
          infrastructure or access outcome; it is never evidence about the
          template, and it downgrades conjunct C3 of H-SQISIGN-c0488f to
          unverified rather than refuting it.
        - >-
          D0-5. Fetch ePrint 2026/1305's abstract page and record whether its
          claim concerns M_chl. Record as relayed if the body is unobtainable.
    - id: S1
      name: The inventory
      cost: "<= 3600 s, zero compute"
      can_terminate_the_run: true
      steps:
        - >-
          D1-1. Produce the itemized inventory required by GOAL-SQISIGN-002's
          first completion criterion: every curve, torsion basis and point image a
          verifier receives per key and per signature, each row marked
          PUBLISHED or INTERNALLY-COMPUTED, each marked REQUIRED-BY-VERIFICATION or
          MERELY-PRESENT, and each carrying the specification section or algorithm
          line that establishes it.
        - >-
          D1-2. Add a fourth column absent from the goal's wording and necessary
          for the audit: for every isogeny the surface hands over, whether its
          EXACT DEGREE is determined by the surface. In particular settle whether
          d_rsp is determined, which Algorithm 4.9 does not appear to require.
        - >-
          D1-3. Seal D1-1 with the byte-budget certificate of EXP-SQISIGN-e10747.
          The inventory is not admitted unless the budget closes or every residual
          is explained.
    - id: S2
      name: The four forced values
      cost: "<= 1800 s, integer arithmetic in pure Python"
      can_terminate_the_run: true
      steps:
        - >-
          D2-1 (G1). Count published items determining phi_sk's action on any
          torsion subgroup. Pre-registered value 0.
        - >-
          D2-2 (G2). If KAT files are obtainable, recompute hint_pk from each
          public key's Montgomery coefficient by Algorithm 2.1 and count
          mismatches. Pre-registered value 0. IF KATs CANNOT BE OBTAINED, the
          identity is verified symbolically from Algorithm 2.1's argument list and
          the empirical check is recorded as NOT RUN, never as passed.
        - >-
          D2-3 (G3). If KAT secret keys are obtainable, decode nrd(I_sk) and
          report the surplus f - ceil(log2 nrd(I_sk)) per level against the
          pre-registered 122 / 184 / 247, tolerance +/- 3 bits.
        - >-
          D2-4 (G4). Verify the Weil-pairing relation e(P_pk,Q_pk) =
          e(P_0,Q_0)^{d * det M_sk} symbolically, and numerically on KAT keys if
          obtainable. Pre-registered fraction 1.00.
    - id: S3
      name: Build and CALIBRATE the ingredient checker; run the null ladder
      cost: "<= 3600 s"
      can_terminate_the_run: true
      steps:
        - >-
          D3-1. Freeze the checker's rule set and its six-item ingredient list
          (domain curve; codomain curve; torsion basis of order N; images of that
          basis under the map; exact degree d; N > d) BEFORE running it on any
          cell, and commit the frozen rules.
        - >-
          D3-2. Run the calibration cells in the frozen order: SIKE positive
          control, then the disguised x-only cell, then the CSIDH differential
          cell. IF ANY FAILS, STOP: no verdict on SQIsign may be produced or
          recorded.
        - >-
          D3-3. Run the SQIsign-LEAK(k) ladder at k in {62, 124, 186, 248} for
          NIST-I and report the transition against the pre-derived threshold
          e_rsp = 126, with monotonicity.
        - >-
          D3-4. ONLY IF D3-2 AND D3-3 PASS: run the checker on the real published
          surface and record its verdict and named reason.
    - id: S4
      name: NOT AUTHORIZED BY THIS CONTRACT
      cost: n/a
      can_terminate_the_run: false
      steps:
        - >-
          An executed toy-prime Kani instantiation against SQIsign-LEAK, which is
          what would convert an argued null into a demonstrated one. It is named
          here so the deferral is explicit rather than silent. It requires a
          separate contract, separate Coordinator approval, and its own budget,
          and until it exists the null control's firing is ARGUED AND CHECKED,
          NOT EXECUTED -- which every downstream citation must state.

  arms_and_controls:
    treatment: >-
      The real SQIsign v2.0.1 published surface: pk = (E_pk, hint_pk) and sigma =
      (E_aux, n_bt, r_rsp, M_chl, chl, hint_aux, hint_chl), at all three levels.
      READ LAST, after every control has been read.
    measured_null: >-
      SQIsign-LEAK(k): the identical surface plus M_sk mod 2^k in the public key,
      at k in {62, 124, 186, 248} for NIST-I (and the analogous quarter-points at
      the other levels if run). FORCED VALUES DERIVED BEFORE ANY RUN, from
      H-SQISIGN-c0488f conjuncts C3 and C4: the checker must report the ingredient
      set COMPLETE for k > ceil(log2 nrd(I_sk)) ~ e_rsp = 126, and INCOMPLETE for
      k <= log2(deg phi_sk). The transition must bracket 126. THIS NULL CAN
      GENUINELY FAIL: if the checker fires at k = 62, where 2^62 is far below the
      secret degree, the checker is responding to the presence of a matrix rather
      than to the sufficiency of the torsion, and the audit is void.
    positive_control: >-
      SIDH/SIKE's published surface, where the template is known to apply. The
      checker MUST return 6 of 6 ingredients present, each traced to a named
      published item. THRESHOLD DECLARED BEFORE THE RUN: 6 of 6. IF IT DOES NOT
      FIRE, THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED AT
      ALL, in accordance with GOAL-SQISIGN-002's third completion criterion.
    adversarial_null_sufficiency_cell: >-
      A disguised leak: x-only coordinates of phi_sk(P_0) and phi_sk(Q_0) plus
      their difference point, in place of a matrix. The ingredient is fully
      present (x-only with a difference point pins signs up to a global sign,
      which the template tolerates) but the syntactic shape is unfamiliar. MUST
      FIRE. If it does not, the checker is a pattern matcher and its negative on
      SQIsign carries no information. THIS IS THE REAL TEST OF THE INSTRUMENT AND
      IT IS NOT OPTIONAL.
    differential_nearby_object: >-
      CSIDH and the group-action constructions, which the frozen Wesolowski text
      names on its explicitly-safe list against an affected list containing the
      SQIsign family. The checker must return NOT-INSTANTIABLE with a DIFFERENT
      named reason than for SQIsign. An identical reason means the checker is
      reporting its own structure rather than the objects'.
    graded_control: >-
      The SQIsign-LEAK ladder is the graded control and has four interior points,
      exceeding the three-point minimum. Monotonicity in k is reported explicitly.
      A non-monotone ladder localises a defect in the checker; a transition far
      from the pre-derived 126 localises a defect in the surplus derivation.
      Either localisation is a more useful outcome than a bare pass.
    ordering_control: >-
      BINDING AND CHECKABLE. The checker's rule set is committed before any cell
      is run. The cells are run in the order: SIKE, disguised x-only, CSIDH,
      SQIsign-LEAK ladder ascending in k, real SQIsign last. The real-surface
      verdict is read only after all controls have been recorded. Absence of the
      pre-commitment record is an invalidation.
    comparability_policy: >-
      No cross-version, cross-variant or cross-scheme comparison is admissible
      except the declared control cells. In particular SQIsign2D-West, SQIsign
      v2.0, and any Round-3 document are NOT comparable to v2.0.1 without a
      separately registered comparator contract naming both surfaces and the
      comparison statistic. A shared scheme name does not imply a shared surface.

  metrics:
    primary:
      - "G1 published_items_determining_secret_torsion_action: integer count. Pre-registered 0."
      - "G5 leak_ladder_transition_k: the smallest k at which the checker fires on SQIsign-LEAK(k). Pre-registered to bracket ceil(log2 nrd(I_sk)) ~ e_rsp = 126 at NIST-I."
      - "G6 sike_ingredients_present: integer out of 6. Pre-registered 6, and a gate on reporting anything."
      - "G7 disguised_cell_fires: boolean. Pre-registered true, and a gate on reporting anything."
    secondary:
      - "G2 kat_hint_mismatches: integer. Pre-registered 0, or NOT RUN if KATs are unobtainable."
      - "G3 measured_surplus_bits per level: pre-registered 122 / 184 / 247, tolerance +/- 3."
      - "G4 pairing_relation_pass_fraction: pre-registered 1.00."
      - "G8 csidh_reason_distinct: boolean, pre-registered true."
      - "Inventory row count, and the number of rows whose degree-knowledge column is UNSETTLED."
      - "Number of Stage-0 disagreements between the two extraction methods."
      - "Whether the primary Kani sources were obtained, and the verbatim torsion-order requirement if so."

  preregistered_prediction:
    quantity: >-
      The joint vector (G1, G5, G6, G7) and the secondary vector (G2, G3, G4, G8).
    formula: >-
      G1 = 0 from Section 4.6's component list and Algorithm 4.1 steps 10-11.
      G5 bracketing e_rsp from surplus = f - log2(deg phi_sk) = f - e_rsp = e_chl
      (Appendix B definitions) together with the Weil-pairing collapse
      d = w * det(M_sk)^{-1} mod 2^f. G6 = 6 and G7 = true from the template's own
      ingredient list applied to a surface that publishes torsion images at known
      degree. G2 = 0 from Algorithm 2.1's argument list. G3 = e_chl from Section
      3.1.6.2's sqrt(p) heuristic. G4 = 1.00 from Weil-pairing bilinearity and
      e(phi P, phi Q) = e(P,Q)^{deg phi}.
    source: >-
      SQIsign v2.0.1 Sections 3.1.6.2, 4.3, 4.6, 5.2, Algorithms 2.1, 2.2, 4.1,
      4.9, and Appendix B, all READ this session; plus KN-TECH-026 for the
      template's ingredient list, RELAYED and unverified against primary sources.
      Derived and committed in H-SQISIGN-c0488f and IDEA-20260805-c4ae3d BEFORE
      this contract was written. No value may be revised after any stage output is
      observed; a revision requires a versioned superseding contract.

  scale_relevance:
    tier: toy
    justification: >-
      The inventory and the counting arguments are statements about an encoding
      and about integer identities, and are scale-free in the only sense that
      matters: Section 4.6 fixes the component list identically at all three
      parameter sets, and the forced values are evaluated at all three. That is
      why the documentary component transfers. NOTHING ELSE DOES. The checker's
      verdicts are statements about declared surfaces, not about executed attacks,
      and a later toy-prime instantiation would be toy-scale behaviour and nothing
      more (AGENTS.md rule 7). No outcome here is evidence about SQIsign at
      NIST-I/III/V security.
    correspondence: null

  tail_checks:
    - >-
      Consistency of the surplus identity across levels: if surplus = e_chl holds
      at NIST-I and NIST-V but not NIST-III, that pattern coincides with the known
      NIST-III byte residual and both must be reported together as a possible
      common extraction fault rather than as two findings.
    - >-
      The extreme cell of the leak ladder: at k = f the checker must fire with the
      degree ingredient marked RECOVERED-BY-PAIRING, not marked PUBLISHED. If it
      marks it published, the checker has been given the degree by the harness and
      the ladder measures nothing.
    - >-
      The zero cell: SQIsign-LEAK(0) is by definition the real surface. The
      checker's verdict there must be bit-identical to its verdict on the
      treatment arm. A difference means the two code paths differ and the ladder
      is not comparable to the treatment.

  replication:
    seeds: []
    seeds_note: >-
      Empty because the contract is deterministic; see inputs.seeds_and_seed_derivation_rule.
    independent_instances: 3
    independent_instances_note: >-
      The three security levels are the three independent instances of every
      documentary and forced-value metric. The control battery is run once, at
      NIST-I, with the other levels optional.
    interpretation: >-
      A single execution is a design-validation and calibration attempt. It cannot
      by itself support any conclusion about SQIsign beyond the documentary
      component, and it cannot support an inapplicability conclusion at all unless
      G6 and G7 pass.

  budget:
    wall_clock_seconds_per_run: 12600
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    network: >-
      REQUIRED, and this is an exception to the usual no-network posture that must
      be granted explicitly at approval. Stages 0 and 1 cannot run without
      fetching the specification, the reference implementation headers, and the
      literature. The container's outbound HTTPS goes through the configured agent
      proxy; the 2026-08-05 scouting sweep records eprint.iacr.org PDF endpoints
      returning 403 while abstract pages return 200, so some sources may be
      unobtainable and that must be recorded as such.
    budget_note: >-
      Fits GOAL-SQISIGN-002's declared campaign budget of 10,800 seconds across at
      most 6 batches only if run across two batches; the executor must say which
      stages ran in which batch. EXCEEDING THE BUDGET IS A BUDGET OUTCOME AND
      NEVER EVIDENCE THAT THE TEMPLATE DOES NOT APPLY (AGENTS.md rule 5, and the
      goal's own third pause_condition).

  stopping_rules:
    - Do not execute unless this contract is separately reviewed, approved, frozen, archived, and execution-authorized by the Coordinator. No approved_by field is present because it is not approved.
    - STOP AND RE-SCOPE at D0-1 if a Round-3 specification distinct from v2.0.1 exists.
    - STOP at Stage 1 if the byte-budget certificate of EXP-SQISIGN-e10747 leaves an unexplained residual at NIST-I or NIST-V; the inventory is then not sealed and nothing downstream may run.
    - STOP at D3-2 if the SIKE positive control returns fewer than 6 of 6, or if the disguised x-only cell does not fire. No verdict on the treatment arm may be computed or recorded.
    - STOP at D3-3 if the leak ladder is non-monotone, or fires at every k, or fires at no k.
    - Stop on exhaustion of the declared wall-clock budget, recording which stages completed.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - The checker's rule set not committed before the first cell was run, or the cells run out of the declared order, or the treatment arm read before the controls.
    - Any pre-registered value revised after a stage output was observed.
    - A SHA-256 or a source figure asserted rather than computed or read; in particular, a KAT-derived metric reported as passed when the KAT files were not obtained.
    - Any conclusion recorded that the template is inapplicable while the null control has not fired.
    - Any statement of the form "SQIsign is safe from SIDH-style attacks", or any conclusion raised above the declared claim ceiling.
    - Any edit to GOAL-SQISIGN-001's records, or any hardness figure originated for the endomorphism ring or isogeny path problems.

  infrastructure_failure_disposition: >-
    A network refusal, a proxy 403, a missing PDF tool, a failed extraction, a
    timeout, a crash, or an unobtainable KAT or literature source is recorded as
    INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence and never
    evidence about the applicability of any attack template (AGENTS.md rule 5, and
    GOAL-SQISIGN-002's third pause_condition, which says this explicitly for this
    goal). Concretely: if the primary Kani sources cannot be obtained, conjunct C3
    of H-SQISIGN-c0488f is recorded as UNVERIFIED and the run reports on C1, C2
    and C4 only. If the KAT files cannot be obtained, G2, G3 and G4 are recorded
    as NOT RUN and their symbolic derivations are reported as derivations. A run
    that reaches only Stage 1 has produced the inventory, which is itself the
    goal's first completion criterion, and is reported as a partial success rather
    than as a failure.

  success_criterion: >-
    This contract has NO current success outcome, because it is not authorized for
    execution; its only present disposition is review_required. IF it is later
    separately approved, frozen and authorized, the positive disposition is: (a) a
    filed KN-LIT entry for the document actually audited, with digest, extraction
    method and extraction damage marked, and a recorded answer on whether a
    distinct Round-3 document exists; (b) the sealed item-by-item inventory with
    the published/internal, required/merely-present and degree-known columns
    complete and each row sourced to a specification line; (c) the four forced
    values reported against their pre-registered predictions, with any not run
    recorded as not run; (d) the SIKE positive control at 6 of 6 AND the
    disguised x-only cell firing AND a monotone SQIsign-LEAK ladder whose
    transition brackets the pre-derived threshold; and only then (e) the verdict
    on the real published surface, with its named reason, its exact scope, and the
    forward-guidance inequality of H-SQISIGN-c0488f mechanism section F.
    A NEGATIVE VERDICT WITHOUT (d) IS INADMISSIBLE. A NEGATIVE VERDICT WITHOUT THE
    FORWARD GUIDANCE AND THE NAMED RESIDUAL (phi_com, and multi-signature
    accumulation) HAS NOT FINISHED and is a fatigue report whose honest status is
    unverified.

  falsification_criterion: >-
    Any of F1-F7 of H-SQISIGN-c0488f: a published item determining phi_sk's
    torsion action (G1 > 0); a KAT hint mismatch (G2 > 0); a measured surplus <= 0
    (G3); a pairing-relation failure (G4 < 1.00); primary sources showing
    dimension-8 needs no torsion surplus; a broken instrument (G6 < 6 or G7
    false); or a distinct Round-3 document. Each is a located failure and each is
    a more valuable outcome than the conjunction holding.

  required_artifacts:
    - The fetched PDF, its SHA-256, HTTP status, byte size, and fetch timestamp.
    - Both extraction outputs for the audited sections, and their diff.
    - The KN-LIT entry text as filed, with provenance level and extraction damage marked.
