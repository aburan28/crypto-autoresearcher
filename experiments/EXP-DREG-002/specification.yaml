experiment:
  id: EXP-DREG-002
  hypothesis_id: H-DREG-001
  version: 1
  title: >-
    Past-wall n=17 cells: complete the n=17 sem full-rank cell (two-partition
    checkpoint consistency control) and measure the n=17 null full-rank cell
    (review correction C1: sr_pred_D = 126,922), boolean chained Semaev m=3,
    D=5, block-m4ri instrument.
  status: running   # 2026-07-18: TASK-20260718-DREG-F2
  objective: >-
    Reduce the decisive uncertainty of RQ-DREG-001: does the deficit series
    (1,322 / 1,862 / 1,999 at n = 12 / 15 / 18) grow, stall, or decline at
    n=17? EXP-DREG-001 produced partition A of the n=17 sem cell (rank
    125,099, deficit 1,823 vs sr_pred 126,922) with interpretation withheld
    pending partition B; the preregistered amendment AMD-20260718-002 freezes
    both partitions (A: chunk 24,000; B: chunk 20,000) and forbids any
    hypothesis use until both arms x both partitions pass. This experiment
    (a) completes/certifies the n=17 sem cell via the two-partition control,
    and (b) measures the n=17 null full rank (C1 discharge: verify the null
    rank equals sr_pred_D = 126,922 by an actual run, never substituted by
    prediction).
  inputs:
    systems: >-
      Identical (n=17, t=3, ti=0, D=5, seed=2026) boolean chained Semaev m=3
      system and T11-certified support-matched semi-regular null as frozen in
      EXP-DREG-001/amendments/AMD-20260718-002-n17-partitions.yaml
      (sem system_hash 5f94c88fe1f44ffa...; nb=35; sem nrows=132,719
      ncols=314,472; pred=126,922).
    prior_cells: >-
      experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N17-SEM-A (partition A
      complete: rank 125,099, deficit 1,823) and RUN-DREG-001-MEASURE-N17-SEM-B
      (partition B, chunk 20,000) — READ-ONLY reference. Checkpoint files are
      copied into this experiment's own work dirs before any resume; nothing
      is ever written into EXP-DREG-001.
    instrument: >-
      src/h012c_block_m4ri.py sha256
      0eb38126998c73601687e248439a05f39038e762d5a5b99009598b67e59a0bbb
      (validated cell-for-cell at n<=18 in EXP-DREG-001; five anchors PASS).
  controls:
    - Checkpoint-partition consistency for the n=17 sem cell: partition A
      (chunk 24,000) vs partition B (chunk 20,000) must give identical
      system_hash, pred, rank, deficit (AMD-20260718-002 acceptance gate).
      Any mismatch invalidates the cell and returns the instrument to
      validation; it is never counted either way (H-DREG-001 falsification
      clause 3, AGENTS rule 5).
    - Null-arm prediction check: the measured null rank is compared to
      sr_pred_D = 126,922 (review correction C1). The prediction is never
      substituted for a run.
    - Carry-chain integrity: every resumed checkpoint carry is sha256-verified
      by the instrument itself (load_carries) before use.
  independent_variables:
    - system arm (sem | null)
    - column-block partition (A chunk 24,000 | B chunk 20,000)
  metrics:
    primary:
      - rank_full(sem, n=17, D=5) under both partitions; deficit = 126,922 - rank
      - rank_full(null, n=17, D=5) vs sr_pred_D = 126,922
    secondary:
      - work-seconds (instrument secs_total), wall seconds, peak RSS per cell
      - per-unit progress logs for the cost model (n=21/24 extrapolation)
  replication:
    seeds: [2026]
    independent_instances: "1 target (ti=0); the frozen C1 cell"
  budget:
    wall_clock_seconds: 3300
    maximum_runs: 10
    sage_invocation_cap_seconds: 600   # kill only at chunk/checkpoint boundaries
  stopping_rules:
    - Any single sage invocation > 600 s: kill at a checkpoint boundary,
      record as infrastructure censoring (AGENTS rule 5, NOT evidence),
      reduce scope, record the deviation.
    - The instrument's --budget self-cap stops only after a completed unit;
      checkpoints are resumable. A clean stop with resumable checkpoints and
      a progress report is an acceptable outcome; a fabricated or corrupted
      cell is not.
    - If the live EXP-DREG-001 SEM-B process (observed running at dispatch,
      PID 87690, started 2026-07-18T21:15:20Z) completes on its own, this
      experiment does NOT duplicate it: it verifies the two-partition control
      from the immutable receipts. If that process dies mid-cell, resume from
      a COPY of its checkpoints inside this experiment's own run dir.
    - Timeout/OOM = failed_infrastructure, excluded from fits (AGENTS rule 5).
  invalidation_rules:
    - A checkpoint-resume or partition mismatch invalidates the cell
      (AMD-20260718-002 acceptance gate).
    - Subset-column ranks are invalid for the sem arm (h012 finding iv).
    - No n=17 value enters a fit or hypothesis verdict until both partitions
      in the respective arm pass (AMD-20260718-002).
  success_criterion: >-
    Experiment-level (not hypothesis-level): the n=17 sem cell certified by
    the two-partition control and/or the n=17 null cell measured; otherwise a
    clean censored state with resumable checkpoints and honest
    validity_status. Hypothesis-level success/falsification clauses belong to
    H-DREG-001 and are evaluated by the Coordinator only.
  falsification_criterion: >-
    Per H-DREG-001 (Coordinator's domain): deficit at n=17..24 continues the
    decelerating trend or shrinks relative to rank => the growth clause fails.
    This experiment supplies numbers only, no verdict.
  required_artifacts:
    - runs/<run-id>/manifest.yaml (command, commit, dirty-tree, env, params)
    - runs/<run-id>/raw.json (ranks, deficits, timings, checkpoint hashes)
    - runs/<run-id>/stdout.log and stderr.log
    - checkpoint files per cell attempted (resumable, sha256-pinned)
    - analysis.md (numbers vs H-DREG-001 clauses, censoring table, deviations)
  assigned_to: executor
  approved_by: coordinator   # TASK-20260718-DREG-F2

handoff:
  id: TASK-20260718-DREG-F2
  from: coordinator
  to: executor
  objective: >-
    Complete the n=17 sem full-rank cell (partition-consistency control) and,
    if budget remains, the n=17 null full-rank cell (C1: verify
    sr_pred_D = 126,922).
  uncertainty_reduced: >-
    Whether the deficit series 1,322 / 1,862 / 1,999 (n=12/15/18) grows,
    stalls, or declines at n=17; whether the T11 null at n=17 is exactly
    semi-regular (rank == 126,922).
  inputs:
    - experiments/EXP-DREG-001 (READ-ONLY): runs/RUN-DREG-001-MEASURE-N17-SEM-{A,B}
    - experiments/EXP-DREG-001/amendments/AMD-20260718-002-n17-partitions.yaml
    - src/h012c_block_m4ri.py (validated instrument)
  constraints:
    - Never write into EXP-DREG-001; copy checkpoints before resuming.
    - 600 s per-invocation kill rule applied only at chunk/checkpoint boundaries.
    - Do not create new RQ/H records; do not git commit.
    - Touch nothing outside experiments/EXP-DREG-002/ and ledger/EV-DREG-002.yaml.
  deliverables:
    - experiments/EXP-DREG-002/{specification.yaml,scripts,runs,analysis.md}
    - ledger/EV-DREG-002.yaml referencing H-DREG-001
  budget:
    wall_clock_seconds: 3300
    memory_gb: 40
    maximum_runs: 10
  completion_gate:
    - all artifacts written
    - controls pass or deviation recorded
    - validity_status set honestly
  return_format: execution_report
