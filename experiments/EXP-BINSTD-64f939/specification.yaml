# EXP-BINSTD-64f939
# Product-space count arithmetic. No subspace is swept.
# Approved by DEC-20261003-00fbfa.
experiment:
  id: EXP-BINSTD-64f939
  hypothesis_id: H-BINSTD-518311
  source_idea: IDEA-20261001-fbee3f
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Sample count versus the run budget
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-00fbfa
  objective: >-
    Check the excess 10, the count 18, and the product 180.
  inputs:
    n_sum: 71
    n_product: 12121
    gap_lo: 6
    gap_hi: 8
    gap_product: 48
    span: 14
    win_17: 3
    win_23: 4
    win_31: 5
    win_product: 60
    width_product: 24
    width_excess: 24
    samples: 30
    runs: 20
    sample_excess: 10
    three_fifths: 18
    excess_product: 180
    tenth_cross: 0
    half_cross: 1
    hour_cap: 4
    hour_product: 12
    cells: 3
  controls:
    - >-
      Thirty minus 20 is 10. Three fifths of 30 is 18. Reporting 18
      as 30 invalidates the run.
    - >-
      The product of 10 and 18 is 180. Six times 5 equals 10 times 3.
      Three times 2 exceeds 5 by 1.
    - >-
      The n sum is 71 and the n product is 12121. The window lengths
      3, 4, and 5 multiply to 60. The width product is 24, and 48
      exceeds 24 by 24. Three times 4 is 12.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {count, excess, product}
    - route in {difference, product}
  metrics:
    primary:
      - sample_excess
      - excess_product
      - implementations_agree
    secondary:
      - three_fifths
      - win_product
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Thirty exceeds 20 by 10. Three fifths of 30 is 18. The product
      of 10 and 18 is 180.
    formula: >-
      Subtract 20 from 30. Take three fifths of 30. Multiply 10 and
      18. Compare 6 times 5 with 10 times 3.
    source: >-
      IDEA-20261001-fbee3f states the n list, the window from n over
      8 to n over 4, the bound 0.6, the sample count 30, the run
      budget 20, and the hour cap 4, read 2026-10-03. The products
      were recomputed in this design session. That computation is
      not a run. No subspace was swept.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written sample count. No transfer to a correlation.
    correspondence: null
  tail_checks:
    - The product 180 and the count 18 are required. A check that stops at the excess 10 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 10 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The excess is not 10.
    - Three fifths of 30 is not 18.
    - The product is not 180.
    - A subspace is swept, or 18 is reported as 30.
  success_criterion: >-
    Both runs agree that 30 minus 20 is 10, that three fifths of 30
    is 18, that 6 times 5 equals 10 times 3, and that the product of
    10 and 18 is 180.
  falsification_criterion: >-
    The runs agree that 30 minus 20 is computed, and that difference
    is not 10.
  required_artifacts:
    - experiments/EXP-BINSTD-64f939/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-64f939/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-64f939/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-64f939/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-64f939/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-64f939/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any subspace sweep, rank correlation, or product-space dimension.
    - Any claim that a small product space predicts an empty usable set.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
