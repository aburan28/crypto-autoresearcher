experiment:
  id: EXP-ICEX-19377a
  hypothesis_id: H-ICEX-14a46a
  derived_from_idea: IDEA-20260828-770aa4
  question_id: RQ-DREG-001
  version: 1
  status: designed
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Is the Macaulay prepare-phase memory wall inherent sparsity or representation overhead -
    streamed nonzero census first, packed-encoding arm second, matrix-free Krylov rank arm only
    if needed, with the INCUMBENT instrument re-measured on the same machine in the same session
    as the denominator, exact-rank agreement at every committed calibration cell, and a
    curve-free support-matched system carrying the whole density comparison
  objective: >-
    Reduce exactly one uncertainty: whether the peak resident set of the Macaulay prepare phase
    at the target cell is required by the number of nonzero entries of the underlying matrix or
    by the in-memory object representation of its rows. The uncertainty is decidable by a
    streaming nonzero census that costs almost nothing, and the answer determines whether the
    remaining rungs of the degree-of-regularity ladder are reachable within the existing memory
    budget or require an amendment.
    THE COMPARISON DISCIPLINE IS THE POINT OF THIS CONTRACT. Prior peak-memory figures for this
    cell were recorded in another session on hardware that is not stated in a form this run can
    reproduce. They are treated as PRIOR OBSERVATIONS ONLY. The denominator of every reduction
    factor reported here must be the incumbent instrument re-run on the named machine, in the
    same session, on the same cells, under the same frozen definition of peak resident set.
  what_this_is_not:
    - >-
      Not an attack, not an algorithm, not a speedup on any ECDLP axis. No instance is solved and
      no exponent moves in any branch.
    - >-
      Not a decision about the degree-of-regularity question. The run produces admissible ranks
      and their cost; what those ranks mean is a separate Coordinator act.
    - >-
      Not a benchmark of one linear-algebra library against another. Both arms are run in the
      same interpreter on the same machine and the comparison is between REPRESENTATIONS, not
      between products.
    - >-
      Not a claim that a probabilistic rank is equivalent to an exact one. Every certified rank
      carries its failure probability and its trial count.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      approved_by is null.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: on the NAMED machine, at the declared cells, under the frozen
      definitions of nonzero count and peak resident set, the streamed density is X, the packed
      streaming prepare phase peaks at Y GiB against the incumbent's Z GiB measured in the same
      session, and the new instrument reproduces every committed exact rank. WHAT DOES NOT
      FOLLOW: nothing about any other machine, nothing about the degree-of-regularity verdict,
      nothing about the ECDLP, and - since the curve-free support-matched system carries the same
      density - nothing about elliptic-curve structure making the system sparse.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, blocking, HARD GATE). Freeze in writing, and hash: the machine
      description including core count, memory, interpreter version and allocator settings; the
      definition of nonzero count as distinct row-column incidences after cancellation over the
      two-element field; the definition of peak resident set as the maximum sampled resident set
      of the WHOLE PROCESS GROUP at at least 10 Hz, reported alongside the interpreter's own
      allocator high-water mark, with both numbers required on every row; the cell list; the
      repeat counts; the amplification parameter for the probabilistic certificate; and the
      declared memory ceiling. Read the committed smaller system and record the DISTRIBUTION of
      generator support sizes - the maximum, not only the mean, since one dense generator can
      dominate the nonzero count. Re-read the existing sparse-export scaffolding and record what
      it actually implements.
      STAGE 1 (streamed density census, near-zero compute, DECISIVE GATE). Rewrite the row
      generator as a streaming generator and pass over the target cell counting nonzeros and
      per-row widths while holding a bounded number of rows at a time. Report nnz, nrows, ncols,
      the density, and the per-row width distribution. If the density exceeds the pre-declared
      five per cent threshold, STOP: the sparse premise has failed and that is the result.
      STAGE 2 (curve-free support-matched arm, blocking). Generate a support-matched random
      system with the same generator count, the same generator-degree histogram, the same
      support-size distribution and the same multiplier set, with NO curve and NO descent
      anywhere in its construction, and run the identical Stage 1 census on it. Report its
      density beside the real system's.
      STAGE 3 (incumbent baseline on THIS machine, blocking). Run the UNMODIFIED committed
      instrument at every calibration cell and, subject to the declared ceiling and the
      infrastructure-stop rule, at the target cell. At least five repeats per cell. Record peak
      resident set, allocator high-water, wall-clock and CPU seconds, and the exact rank where it
      completes. THIS IS THE DENOMINATOR. No ratio in this run may use any other number.
      STAGE 4 (packed streaming arm). Run the packed or compressed-sparse-row streaming
      instrument on the SAME cells, same repeats, same machine, same session. Validate exact rank
      against every committed calibration rank before any target-cell number is reported.
      STAGE 5 (matrix-free arm, only if Stage 4 misses the ceiling at the target cell). Stream the
      sparse export and compute a randomized Krylov rank certificate with the declared
      amplification. Run at least twenty independent trials at each calibration cell and report
      the empirical mismatch rate against the predicted bound BEFORE any target-cell certificate
      is reported.
      STAGE 6 (zero compute). Emit the table: per cell, per arm, density, peak resident set as a
      distribution over repeats, time in both coordinates, rank and its status.
    instrument: >-
      Pure Python plus the interpreter's standard library under
      experiments/EXP-ICEX-19377a/driver/, with the incumbent arm invoked UNMODIFIED from its
      committed source. Memory is sampled by an external sampler on the process group, not by
      self-reporting inside the measured process, so the measurement does not perturb what it
      measures beyond a recorded overhead. Recorded through harness/runner.py.
    parameters: >-
      THE INSTANCE SET IS FIXED IN STAGE 0 AND EVERY ARM RUNS ON THAT SAME SET. Cells: every
      calibration cell where an exact rank is already committed, plus the target cell at the
      declared degree. Arms: incumbent, packed streaming, matrix-free (conditional), and
      curve-free support-matched for the density census. Repeats: at least five per cell per arm
      for cost metrics; at least twenty trials per calibration cell for the certificate. THE
      MACHINE IS NAMED AND PINNED - fixed core allocation, no other declared workload - and every
      row carries it.
  controls:
    - >-
      CURVE-FREE SUPPORT-MATCHED NULL, MANDATORY AND BLOCKING (standing scope constraint from the
      pfdr-battery lane): a random system with matched generator count, degree histogram,
      support-size distribution and multiplier set, built with no curve and no descent. It
      carries the entire density comparison: if it reproduces the density, sparsity is a property
      of the support pattern and the multiplier set, and no statement about elliptic-curve
      structure may be made from the census.
    - >-
      SAME-SESSION INCUMBENT BASELINE, BLOCKING AND THE CONTRACT'S CENTRAL DISCIPLINE: the
      committed instrument, unmodified, on the same machine, the same cells and the same frozen
      definitions, with the same repeat count. Prior figures from other sessions are recorded as
      PRIOR OBSERVATIONS and may appear in the report only in a column labelled as such; using
      one as a denominator is an invalidation condition.
    - >-
      COMMITTED-RANK REPRODUCTION CONTROL, blocking: the new instrument must recover every
      committed exact rank at every calibration cell before any new rank is trusted. An
      instrument that cannot reproduce a known answer cannot report an unknown one.
    - >-
      SUPPORT-MATCHED SEMI-REGULAR POSITIVE CONTROL: at the calibration cells the curve-free
      system's rank must match its predicted saturating value, so that the rank instrument is
      shown to detect a rank it was handed.
    - >-
      PROBABILISTIC-CERTIFICATE VALIDATION, blocking for the matrix-free arm: at least twenty
      independent trials per calibration cell, with the empirical mismatch rate reported against
      the predicted amplified bound. Both numbers appear; neither alone is admissible.
    - >-
      DEFINITION FREEZE: the nonzero-count definition and the peak-resident-set definition are
      hashed in Stage 0. Changing either after any arm has been measured invalidates every ratio
      in the run, because the two arms would no longer be measured in the same units.
    - >-
      TIME-BESIDE-MEMORY CONTROL: every memory row carries wall-clock and CPU seconds for the
      same arm and cell. A memory win with an unreported time cost is a tradeoff and must be
      reported as one.
  independent_variables:
    - cell - the number of variables and the degree bound
    - arm - incumbent, packed streaming, matrix-free certificate, curve-free support-matched
    - repeat index within a cell and arm
    - amplification parameter of the probabilistic certificate
  metrics:
    primary:
      - >-
        nnz(cell): the number of distinct row-column incidences after cancellation, an integer
        under the frozen definition. Reported with nrows and ncols so the density is
        recomputable.
      - >-
        density(cell) = nnz / (nrows x ncols), dimensionless. The Stage 1 gate.
      - >-
        per-row width distribution: the full histogram of per-row nonzero counts, with the
        MAXIMUM reported explicitly. The mean alone is not a legitimate summary here, because a
        single dense generator can dominate the nonzero total.
      - >-
        peak_rss(cell, arm): the maximum sampled resident set of the process group in GiB under
        the frozen definition, recorded PER REPEAT. Reported as a DISTRIBUTION - minimum, median,
        maximum over at least five repeats - because peak resident set is a run-level random
        variable, not a constant. The LEGITIMATE SUMMARY is the median with the full range shown;
        a single peak quoted without its range is not admissible.
      - >-
        allocator_highwater(cell, arm): the interpreter's own peak allocation in GiB, per repeat,
        reported alongside peak_rss so that resident-set effects and allocation effects are
        separable.
      - >-
        memory_reduction_factor(cell) = median peak_rss of the incumbent arm divided by median
        peak_rss of the packed arm, dimensionless, WITH BOTH ARMS MEASURED IN THE SAME SESSION ON
        THE NAMED MACHINE. Reported with the interval implied by both arms' ranges.
      - >-
        rank(cell, arm): the exact integer rank, or the certified rank with its failure
        probability and trial count. Agreement with the committed calibration ranks is exact or
        the arm is inadmissible.
      - >-
        certificate_mismatch_rate(cell): empirical fraction of the at-least-twenty trials whose
        certified rank differs from the committed exact rank, dimensionless, reported against the
        predicted amplified bound.
    secondary:
      - >-
        wall-clock and CPU seconds per cell per arm per repeat on the named machine, reported as
        a distribution over repeats with the same summary discipline as memory.
      - >-
        density of the curve-free support-matched system at every cell, beside the real system's.
      - >-
        the rank of the curve-free system against its predicted saturating value.
      - >-
        bytes written and read if the sparse export goes to disk, since streaming to disk trades
        the memory win for an unreported input-output cost.
      - >-
        the sampler overhead - the cost of the memory sampler itself - so the measurement's own
        footprint is disclosed.
      - >-
        the Stage 0 record: machine description, frozen definitions with their hash, and the
        support-size distribution read from the committed smaller system.
      - >-
        prior-session peak figures, in a column explicitly labelled PRIOR OBSERVATION, never used
        in any ratio.
  heuristic_under_test: HEUR-MEM-1
  preregistered_prediction:
    quantity: >-
      density at the target cell; median peak_rss of the packed arm against the same-session
      incumbent median; exact rank agreement at every calibration cell; certificate mismatch rate
      against its amplified bound; and the curve-free system's density beside the real one's.
    formula: >-
      Under the hypothesis, density is far below one per cent - the pre-declared failure
      threshold is five per cent - because a row's nonzero count equals the originating
      generator's support size, independent of the multiplier, and those supports are small.
      memory_reduction_factor is at least 5 with both arms measured in the same session. Rank
      agreement is EXACT at every calibration cell. certificate_mismatch_rate is below the
      declared amplified bound. The curve-free support-matched density agrees with the real
      system's within the declared tolerance, since sparsity is a property of the support pattern.
      Under the null - the wall is inherent - density is above threshold and the reduction factor
      is near 1.
      No number in this contract is taken from any prior session's measurement, and none is
      invented: the threshold five per cent and the factor 5 are DESIGN THRESHOLDS declared in
      advance, not predictions read off data.
    source: >-
      The staged design, the sparsity argument, the calibration controls and the five
      falsification conditions are taken from IDEA-20260828-770aa4, read in full by
      TASK-20260904-8f2f95 on 2026-09-04. The prior peak figures quoted in that proposal are
      recorded here as prior observations from another session and are deliberately excluded from
      every ratio. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The cells are exactly the ladder rungs this program has already reached plus the first one
      it has not, which is the only place the question can be asked. Every number is scoped to
      the named machine, the named interpreter and the frozen definitions; nothing transfers to
      another machine and no transfer is attempted. The measurement says nothing about
      cryptographic scale and nothing about any ECDLP cost.
    correspondence: null
  tail_checks:
    - >-
      Report the MAXIMUM per-row width, not only the mean: one dense generator can dominate nnz
      and would make a small mean misleading.
    - >-
      Report the maximum peak_rss across repeats, not only the median, since the binding
      constraint at execution time is the worst repeat and not the typical one.
    - >-
      Report the largest single certificate discrepancy across trials with its cell, so that a
      rare large error is visible against a small average rate.
    - >-
      Report the peak_rss trajectory over time for the worst repeat of each arm at the target
      cell, so that the phase where the peak occurs is identified rather than inferred.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
      - 20260907
      - 20260908
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 12
    maximum_memory_gb: 16
    maximum_runs: 24
  stopping_rules:
    - >-
      STOP after Stage 1 if the streamed density exceeds five per cent. The sparse premise has
      failed; report the density as the result and do not implement the packed or matrix-free
      arms.
    - >-
      STOP the matrix-free arm before any target-cell certificate if the mismatch rate at any
      calibration cell exceeds the declared amplified bound.
    - >-
      HALT any comparison whose two arms were not measured under the same frozen definitions in
      the same session.
    - >-
      Terminate any cell that reaches the declared memory ceiling and record it as an
      infrastructure stop with the ceiling reached, the arm and the phase. This is never negative
      mathematical evidence.
    - >-
      Stop at maximum_runs, total_cpu_hours or the memory ceiling, whichever binds first.
  invalidation_rules:
    - >-
      A timeout, out-of-memory kill, crash or dependency failure makes that cell
      failed_infrastructure and is NEVER negative mathematical evidence.
    - >-
      A run that reports memory_reduction_factor against any figure not measured in the same
      session on the named machine is invalid_measurement. This is the contract's central
      discipline and its violation is not repairable by annotation.
    - >-
      A run that changes the nonzero-count definition or the peak-resident-set definition after
      any arm has been measured is invalid_measurement; the arms are then in different units.
    - >-
      A run reporting a single peak_rss without its distribution over at least five repeats is
      invalid_measurement.
    - >-
      A run reporting a new rank from the matrix-free arm without the calibration-cell mismatch
      rate is invalid_measurement.
    - >-
      A run in which the incumbent arm was modified in any way is invalid_measurement; the
      comparison is against the committed instrument, not against a variant of it.
    - >-
      A run reporting a density without the curve-free support-matched system's density at the
      same cell is invalid_measurement.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold: (1) Stage 0's frozen
    definitions, machine description and hash are archived before any measurement; (2) the
    streamed density is reported with nnz, nrows, ncols and the full per-row width distribution
    including its maximum; (3) the curve-free support-matched density is reported at the same
    cells; (4) the incumbent arm's cost is measured in the same session on the named machine with
    at least five repeats and reported as a distribution; (5) the packed arm is measured
    identically and every ratio uses only same-session numbers; (6) every committed calibration
    rank is reproduced exactly by every arm that reports a rank; (7) if the matrix-free arm ran,
    its mismatch rate over at least twenty trials per calibration cell is reported against its
    predicted bound; (8) every memory row carries its wall-clock and CPU seconds.
  falsification_criterion:
    - >-
      Streamed density above five per cent. The representation hypothesis is REJECTED at this
      cell; the wall is inherent fill-in and the measured density is the reusable result.
    - >-
      memory_reduction_factor below 5 with both arms in the same session. Limb L2 is falsified at
      this cell; the packed encoding is not the fix and the matrix-free path is the only remaining
      route.
    - >-
      Any arm fails to reproduce a committed calibration rank exactly, outside the declared
      probabilistic envelope. That arm is inadmissible and reports nothing.
    - >-
      certificate_mismatch_rate above the declared amplified bound. The matrix-free path is
      inadmissible at the declared amplification.
    - >-
      The memory win is accompanied by a wall-clock increase that puts the target cell outside the
      time budget. The result is a TRADEOFF; reporting the memory ratio without it is prohibited.
    - >-
      The curve-free support-matched system does NOT reproduce the density. Sparsity is not
      explained by the support pattern alone; this is reported as a structural finding about the
      system and the ECDLP framing is still not licensed without further work.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment, interpreter version, allocator settings and the NAMED machine
    - the Stage 0 frozen definitions and machine description with their hash, written before any measurement
    - the support-size distribution read from the committed smaller system, with its maximum
    - raw-result.json with nnz, nrows, ncols, density and the full per-row width histogram per cell per arm
    - per-repeat peak_rss and allocator high-water for every cell and arm, at least five repeats, as raw values not summaries
    - the peak_rss trajectory for the worst repeat of each arm at the target cell
    - the incumbent arm's same-session measurements, clearly separated from any prior-session figure
    - every rank produced, with its status - exact or certified with failure probability and trial count
    - the certificate mismatch rate per calibration cell over at least twenty trials, with the predicted bound
    - the curve-free support-matched system's generator parameters, density and rank
    - wall-clock and CPU seconds per cell per arm per repeat
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. status is designed, frozen is false,
      execution_authorized is false, approved_by is null.
    - >-
      Approval must confirm the memory ceiling and the infrastructure-stop rule for the incumbent
      arm at the target cell. That arm is expected to approach or exceed the ceiling, and the run
      must be able to record that as an infrastructure outcome rather than as a failure.
    - >-
      Approval must confirm the amplification parameter for the probabilistic certificate before
      Stage 5 runs. Choosing it after seeing a mismatch rate would make the bound unfalsifiable.
    - >-
      Approval should state whether the sparse export may write to disk. Streaming to disk trades
      the memory win for an input-output cost that must then be budgeted and reported.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260828-770aa4
    authored_at: '2026-09-04'
    note: >-
      The staged design, the sparsity argument, the two repair paths, the calibration controls and
      the confounders are taken from the parent proposal and restated as measured quantities with
      units and decision rules. Added by this contract: the same-session incumbent baseline as the
      only admissible denominator, the frozen definitions of nonzero count and peak resident set,
      the requirement that peak memory be reported as a distribution over repeats rather than as a
      scalar, the curve-free support-matched arm required by the standing scope constraint, and
      the requirement that time appear beside memory on every row. The prior-session peak figures
      quoted in the parent are carried only as a labelled prior-observation column.
  derivation_gaps:
    - >-
      Whether the incumbent arm can complete at the target cell on the named machine at all is
      unknown. If it cannot, the reduction factor at that cell is unavailable and only the
      calibration cells support a ratio; the contract records that rather than substituting a
      figure from elsewhere.
    - >-
      The availability of an external sparse-rank library in this environment is unverified. If it
      is absent, the matrix-free arm requires a from-scratch implementation, which is a materially
      larger cost than the parent proposal's estimate and would need its own validation.
    - >-
      Peak resident set depends on interpreter version and allocator behaviour. The contract
      freezes both and reports them, but a different environment would produce a different
      denominator, which is precisely why no cross-session ratio is admissible.
    - >-
      The five per cent density threshold and the factor-5 reduction target are design thresholds
      chosen in advance, not derived quantities. A result between the threshold and the hypothesis
      is genuinely ambiguous and is reported as such.
