# EXP-ECDLP-a57206
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-4d475f.
experiment:
  id: EXP-ECDLP-a57206
  hypothesis_id: H-ECDLP-7cdfcc
  source_idea: IDEA-20261004-3cfa02
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 255
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-4d475f
  objective: >-
    Check the counts 8, 7, and 7, the product 392, and the nearby gap 0.
  inputs:
    bit_length: 8
    doublings: 7
    additions: 7
    length_gap: 1
    doubling_gap: 0
    digit_product: 392
    digit_sum: 22
    nearby_a: 7
    nearby_b: 7
    nearby_gap: 0
    nearby_product: 49
  controls:
    - >-
      The bit length is 8. The doubling count is 7. The addition
      count is 7. Reporting the addition count as 8 drops the gap
      against the bit length and invalidates the run.
    - >-
      Eight exceeds seven by 1. Seven equals seven, so that gap is 0.
      The product of 8, 7, and 7 is 392. Their sum is 22.
    - >-
      Two readings of the addition count are both 7. Their gap is
      0 and their product is 49.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 255 has bit length 8, 7 doublings, and 7
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 8. Count 7 doublings. Count 7 additions.
      Multiply 8, 7, and 7. Subtract 7 from 7.
    source: >-
      IDEA-20261004-3cfa02 states the counts 8, 7, and 7, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 392 and the nearby gap 0 are required. A check that stops at the bit length 8 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 7 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 8.
    - The doubling count is not 7.
    - The addition count is not 7.
    - The product is not 392.
    - The addition count is reported as 8, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 8, that the doubling
    count is 7, that the addition count is 7, and that the product
    of those three counts is 392.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 7.
  required_artifacts:
    - experiments/EXP-ECDLP-a57206/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-a57206/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-a57206/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-a57206/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-a57206/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-a57206/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
