experiment:
  id: EXP-ALECF-1ddb1a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-23332f; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-23332f
  question_id: RQ-QRE-6dba8c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Instrument allocation and free events in a classical reversible interpreter to extract exact
    live-qubit traces for scheduling variants of one fixed modular multiplication, and measure peak-versus-integral
    rank disagreement against an allocation-matched null.
  objective: 'The one uncertainty a run reduces is whether the standard single-number summary of reversibility
    overhead, peak live-qubit width, orders circuits the same way as the area under the live-qubit
    trace, or whether the two summaries decouple enough that the choice between them is decision-relevant.
    Concretely: (i) can exact live-qubit traces be extracted from a classical interpreter for a family
    of validity-gated scheduling variants of one fixed arithmetic function, with peak width and lifetime
    integral computed exactly rather than estimated; (ii) over that family, at what rate do peak width
    and lifetime integral rank a pair of variants oppositely, and does that rate exceed the rate produced
    by random reversible programs with matched allocation-event statistics; (iii) is the uncomputation
    share, the reverse-pass fraction of Toffoli gates, monotonically related to the pebbling-depth
    parameter in the way the propagation argument predicts, which is the specific mechanism claimed
    to generate the decoupling. A run does not decide which summary a cost model should use, does
    not model error correction, does not touch physical qubit-seconds, and does not evaluate any circuit
    for quality. The deliverable is the trace family itself as a reusable artifact, the disagreement
    rate with a bootstrap interval, the null-arm rate from the same invocation, and the uncomputation-share
    curve, plus the granularity ratio quantifying how far the integral is convention-dependent.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for reversible modular multiplication
      over prime fields of the tested widths, under the declared scheduling family and the declared
      gate-index clock, the live-qubit trace has the measured shapes, peak width and lifetime integral
      disagree at the measured rate, and that rate exceeds or does not exceed the allocation-matched
      null by the measured amount. WHAT DOES NOT FOLLOW: nothing about how a physical fault-tolerant
      machine charges for idle qubits, nothing about the correctness of any published or imported
      resource estimate, nothing about 256-bit point-addition circuits, no recommendation that any
      benchmark change its scoring rule, and no attack or security consequence of any kind. A disagreement
      rate under a gate-index clock does not transfer to a depth-weighted or wall-clock clock without
      re-measurement.'
  inputs:
    procedure: 'STAGE 0 (cost: one hour): fix the gate set, both granularity conventions, the clock
      definition, and the seed manifest; implement the flat-trace instrument control and confirm zero
      disagreement on it. STAGE 1 (cost: several hours of engineering): extend the classical reversible
      interpreter with timestamped allocate and free events and exact trace emission. STAGE 2 (cost:
      several hours): implement reversible modular addition and multiplication over F_p with named
      intermediates and an explicit pebbling-depth parameter. STAGE 3 (cost: minutes of compute):
      generate 60 scheduling variants per prime and run the validity gate (identical-function on 4096
      random inputs, plus ancilla restoration) on each, recording discards. STAGE 4 (cost: seconds):
      compute peak, integral, uncomputation share and depth per variant under both granularity conventions.
      STAGE 5 (cost: seconds, same invocation): generate the allocation-matched null family and run
      the identical STAGE 4 code path. STAGE 6 (cost: under an hour): bootstrap the disagreement rates,
      plot the trace family, and report measured-minus-null with the uncomputation-share curve and
      the granularity ratio.'
    instrument: 'Python 3.11 standard library for exact integer arithmetic and the interpreter core;
      a new instrumented reversible-circuit interpreter module written for this contract, extending
      the one built for the scalarization contract so the two share a validity gate; numpy for bootstrap
      statistics; pytest for interpreter unit tests including the flat-trace control; harness/toycurve.py
      for exact prime-field reference values; harness/runner.py for the run manifest and the inference
      block. No Sage, no quantum simulator library, no hardware and no external services. The interpreter
      is classical and permutation-only, which is stated as a limitation: relative-phase behaviour
      is outside its reach and is not claimed.'
    parameters: 'Primes p of bit width 8 and 13 (two values fixed in the manifest). Function: modular
      multiplication, implemented as a fixed composition of reversible modular adders. Pebbling-depth
      parameter over 60 values spanning fully eager to fully lazy. Validity gate: exhaustive inputs
      at 8 bits, 4096 random inputs at 13 bits, plus ancilla restoration on all. Null family: 60 members
      per prime, matched on gate count, allocate/free event count and inter-arrival distribution,
      with 50 independent null draws for the interval. Granularity conventions: 2 (Toffoli-atomic,
      Toffoli-decomposed). Bootstrap resamples 2000.'
  controls:
  - Allocation-matched random reversible program family, run through identical instrumentation in
    the same invocation.
  - Ancilla-restoration gate on every variant, so no variant can win on peak or integral by leaving
    garbage.
  - Identical-function gate across all variants on the same test vectors.
  - 'A flat-trace control: a circuit constructed to have constant L(t) by design, on which peak and
    integral must agree on every pair by construction, as an instrument check.'
  - 'Granularity control: report every trace statistic under both Toffoli-atomic and Toffoli-decomposed
    conventions.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a random straight-line reversible program with the
    same number of gates, the same number of allocate and free events, and the same allocation-event
    inter-arrival distribution as the measured family, but with the events placed at random subject
    to the constraint that every allocation is freed. It computes nothing meaningful and has no forward/reverse
    structure. The identical instrumentation and the identical peak-versus-integral disagreement computation
    run on it in the same invocation. For the signal arm to mean anything the null must show a LOWER
    disagreement rate, or a differently shaped uncomputation-share curve: if random allocation traces
    disagree at the same rate, then the disagreement is a generic property of step functions with
    these event statistics and carries no information about uncomputation strategy, and the honest
    record is a controlled null.'
  independent_variables:
  - prime bit width
  - pebbling-depth parameter
  - gate-set granularity convention
  - arm (measured family versus allocation-matched null)
  metrics:
    primary:
    - peak live-qubit width per variant
    - ancilla lifetime integral per variant
    - peak-versus-integral rank disagreement rate
    - measured-minus-null disagreement rate
    secondary:
    - uncomputation share per variant
    - depth per variant
    - validity-gate discard rate
    - granularity ratio of the lifetime integral
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The peak-versus-integral rank disagreement rate over ordered pairs of scheduling variants
      at the 13-bit prime under the Toffoli-atomic convention, and its excess over the allocation-matched
      null.
    formula: 'For variants u and v let P(u) be peak live-qubit width and S(u) be the lifetime integral,
      S(u) equal to the sum over gate indices t of L_u(t). Define disagree = |{ ordered pairs (u,v)
      : P(u) < P(v) and S(u) > S(v) }| divided by the number of ordered pairs with P(u) not equal
      to P(v) and S(u) not equal to S(v). Predicted: disagree at or above 0.15 on the measured family,
      and disagree_measured minus mean disagree_null at or above 0.05. Also predicted: S(laziest)
      divided by S(most eager) at or above 1.5.'
    source: Pre-registered in the parent proposal IDEA-20260816-23332f before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested parameters are 8-bit and 13-bit prime fields with reversible modular multiplication,
      chosen as the largest sizes at which every variant can be validity-gated by classical simulation
      including exhaustive checking at the smaller width. This is far below the 256-bit setting of
      the imported ALECF packages. The transfer assumption, stated and not defended, is that the qualitative
      decoupling of peak and integral under uncomputation deferral is scale-robust, since the propagation
      argument is combinatorial rather than size-dependent; no measured magnitude is extrapolated,
      and no statement about 256-bit circuits is made.
    correspondence: null
  tail_checks:
  - Inspect the laziest variants for traces whose peak is set by a single step, where the disagreement
    is driven by one gate index.
  - Check whether any variant achieves a lower integral and a lower peak simultaneously, which would
    indicate a dominated schedule and a generator flaw.
  - Examine the granularity ratio's extremes to see whether the integral's convention dependence is
    uniform or concentrated in specific subroutines.
  - Check the validity-gate discards for a systematic bias toward one end of the pebbling-depth range.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Terminate after 60 variants per prime; no adaptive extension of the family.
  - Abort and report an instrument failure if the flat-trace control shows nonzero disagreement.
  - Abort if the validity-gate discard rate exceeds 0.3, since the surviving family would then be
    a selected sample.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run emits exact live-qubit traces for every validity-gated variant, the disagreement
    rate with its bootstrap interval, the null-arm rate computed in the same invocation, the uncomputation-share
    curve against pebbling depth, and the granularity ratio, with the flat-trace control passing.
  falsification_criterion:
  - Disagreement rate below 0.02 on the measured family.
  - Measured and null disagreement rates overlapping within the bootstrap interval.
  - Uncomputation share varying by less than 0.05 across the family.
  - The flat-trace instrument control failing.
  - All variants sharing one peak width, making the comparison vacuous.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-23332f
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The clock is currently gate index; a Coordinator must decide whether a depth-weighted clock is
    required as a co-primary rather than a secondary metric, since the physical motivation points
    at depth.
  - The pebbling-depth parameterization must be specified concretely enough to guarantee it does not
    generate a monotone family by construction.
  - Whether peak width includes input registers needs fixing to match the imported benchmark's convention,
    which the committed README does not state unambiguously.
  - The allocation-matched null's matching criteria need a precise definition; 'matched inter-arrival
    distribution' is not yet a specification.
