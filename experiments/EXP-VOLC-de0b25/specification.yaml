experiment:
  id: EXP-VOLC-de0b25
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-3c6bd8
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE PRICE OF KNOWING YOUR LEVEL, AUDITED IN THREE PARTS: v_ell(c) is computable in O(log^2
    p) bit operations WITHOUT ANY FACTORIZATION for every odd ell; the discriminant t^2-4p is only
    about as large as p by Hasse, so even its full factorization is routine at 256-bit crypto scale
    rather than a barrier; and the actual bottleneck in endomorphism-ring computation is WALKING THE
    VOLCANO AT LARGE ell -- which relocates the obstruction and removes "level determination is too
    expensive" as a reason to dismiss this lane'
  status: draft
  objective: "(A) PART ONE -- THE HEIGHT IS FREE, PER ell, WITH NO FACTORING. Let D = t^2 - 4p = c^2\
    \ D_K with D_K fundamental. For every ODD prime ell, v_ell(D_K) is 0 or 1, because a fundamental\
    \ discriminant is squarefree or four times a squarefree number and the factor of four is invisible\
    \ at odd ell. Hence\n  v_ell(D) = 2 v_ell(c) + v_ell(D_K)  =>  v_ell(c) = floor(v_ell(D) / 2).\n\
    So THE HEIGHT OF THE ell-VOLCANO IS OBTAINED BY REPEATED DIVISION BY ell ALONE, in O(log_ell(D))\
    \ divisions, i.e. O(log^2 p) bit operations, WITHOUT factoring D and without knowing D_K. At ell\
    \ = 2 the same method works with a case split, since v_2(D_K) is in {0, 2, 3}: v_2(D) odd forces\
    \ v_2(D_K) = 3; v_2(D) even leaves {0, 2}, resolved in O(1) by testing D / 4^k mod 4. The 2-adic\
    \ case is stated explicitly rather than swept into the odd-ell formula, because getting it wrong\
    \ silently mislabels every 2-volcano.\n(B) PART TWO -- THE DISCRIMINANT IS SMALL, AND THIS CORRECTS\
    \ A STANDING FRAMING IN THIS PROGRAM. By Hasse, t^2 <= 4p, so\n  |D| = |t^2 - 4p| = 4p - t^2 <=\
    \ 4p.\nD IS ABOUT THE SAME BIT LENGTH AS p, NOT TWICE IT. For a 256-bit p, D is at most about\
    \ 258 bits. Factoring a 258-bit integer is routine by any modern method and is far below the sizes\
    \ in the public factoring record (RECALLED, PUBLIC RECORD, CITATION NOT VERIFIED IN THIS CORPUS:\
    \ RSA-155 at 512 bits was factored in 1999 and RSA-250 at 829 bits in 2020; verifying these against\
    \ a primary source is Stage 0 of the minimal test, and the conclusion does not depend on the exact\
    \ figures, only on 258 << 512). CONSEQUENCE: IDEA-20260726-010 asserts that detecting a large\
    \ square part of t^2 - 4p \"requires extracting the square part of a p-sized integer, which is\
    \ factoring-hard, so such curves are not excluded by standard curve-generation hygiene\". The\
    \ premise that the integer is p-sized is correct; the inference that this is hard AT DEPLOYED\
    \ SIZES is what this audit disputes, because p-sized means 258 bits for a 256-bit curve, not 2^258\
    \ work. If this audit is right, hidden-CM curves ARE detectable by anyone willing to run a factorization,\
    \ and the curve-generation-hygiene argument in that record needs restating. Either outcome is\
    \ a deliverable and the record is cited, not contradicted from memory.\n(C) PART THREE -- WHERE\
    \ THE COST ACTUALLY IS. Knowing the HEIGHT v_ell(c) is not knowing the LEVEL v_ell(f_E). The level\
    \ requires locating E in the volcano, which needs rational ell-isogeny counting and Fouquet-Morain\
    \ descent: O(ell * h) isogeny computations per level identification and O(ell * h^2) in total,\
    \ where each isogeny computation needs either the ell-division polynomial (degree (ell^2-1)/2)\
    \ or the modular polynomial Phi_ell (size O(ell^3) coefficients). This is POLYNOMIAL IN ell BUT\
    \ EXPONENTIAL IN log ell, so:\n  - ell small (say ell <= 10^4): the level is CHEAP, polynomial\
    \ in log p.\n  - >-\n    ell large (up to c ~ sqrt(p), so ell can have 100+ bits): the level is\n\
    \    INFEASIBLE by this route, because Phi_ell cannot be built.\nTHE OBSTRUCTION IS THEREFORE\
    \ RELOCATED. It is not the factorization of D and it is not the height; it is the LARGE-ell WALK.\
    \ That is exactly why the published endomorphism-ring algorithms are subexponential rather than\
    \ polynomial (KN-LIT-251 Bisson-Sutherland 2009, KN-LIT-309 Bisson 2011 -- both in this corpus\
    \ with abstracts read and FULL TEXTS NOT READ; the second reports a subexponential runtime under\
    \ GRH alone, and the first reports a bound depending primarily on log|D_E|).\n(D) THE DISCRIMINATION,\
    \ STATED BEFORE MEASURING. Two competing accounts of why lane L2 might be a dead end:\n  (C1)\
    \ COST: \"any attack needing the volcano level must pay subexponential\n    endomorphism-ring\
    \ computation, so the lane is dead on cost even if depth\n    matters.\"\n  (C2) INVISIBILITY:\
    \ \"the level is cheap to obtain but carries no usable\n    information, because on G every endomorphism\
    \ is a scalar (H-ENDO-001) and\n    every vertical isogeny is an isomorphism (IDEA-20260807-5cabfc).\"\
    \nThese are different closures with different forward guidance, and the field would treat them\
    \ very differently. This audit decides between them for the SMALL-ell regime, and the argument\
    \ above already predicts C2: small-ell levels are cheap, so cost is not the obstruction there\
    \ and any negative in this lane must be attributed to invisibility. For the LARGE-ell regime the\
    \ audit predicts C1 and quantifies where the crossover lies."
  resource_label: 'audit: consumes no resource (cost accounting for R3/R4 acquisition)'
  admissibility: admissible
  admissibility_argument: An audit consumes no resource. Its output is a price list for the R3 and
    R4 resources other proposals want to consume, so that no proposal in the batch may quote the volcano
    level as if it were free. Nothing here touches G, so the admissibility filter is passed trivially;
    the audit's value is precisely that it prevents an inadmissible cost model from being smuggled
    into an admissible mechanism.
  reachability_gate: 'THIS RECORD IS THE PRICE SIDE OF THE REACHABILITY GATE and it is what makes
    IDEA-20260807-bb03d3''s gate quotable. Reaching a target LEVEL requires first KNOWING the current
    level, and this audit prices that: free for the height, O(ell * h^2) isogeny computations for
    the level, infeasible for large ell. So the reachability statement "any small-ell level is reachable
    in polynomial time" is complete only when paired with "and its current value is knowable in polynomial
    time", which is established here. For LARGE ell dividing c, neither knowing nor reaching the level
    is feasible by these methods, and any proposal depending on a large-ell level must either cite
    a subexponential endomorphism-ring computation and charge it, or be closed on cost.'
  inputs:
    procedure: 'STAGE 0 (zero compute): verify the public factoring-record figures against a primary
      source and write a KN-LIT record; read KN-LIT-251 and KN-LIT-309 beyond their abstracts and
      record what they actually claim about the bottleneck. STAGE 1 (minutes): implement and mass-check
      Part One over >= 10^5 pairs. STAGE 2 (minutes): the Hasse bit-length check. STAGE 3 (hours):
      factoring-time ladder, with the honest labelling of measured versus argued. STAGE 4 (hours):
      the walk-cost measurement over ell in {2,...,13}. STAGE 5 (zero compute): the crossover and
      the C1/C2 verdict. ENTIRE TEST IS PURE INTEGER ARITHMETIC PLUS THE ell in {2,3} ISOGENY CODE.
      No Groebner computation is required, which makes this the cheapest substantive item in the batch.'
    mechanism: 'STEP 1 -- PROVE PART ONE AND CHECK IT EXHAUSTIVELY AT TOY SCALE. Implement v_ell(c)
      = floor(v_ell(D)/2) for odd ell and the 2-adic case split. For >= 10^5 random (p, t) pairs at
      toy sizes, compute v_ell(c) BOTH ways -- by the formula and by fully factoring D and extracting
      D_K -- and require exact agreement on 100 percent of cells. Disagreement falsifies Part One.
      STEP 2 -- MEASURE THE FACTORING COST HONESTLY. For a ladder of p from 2^16 to the largest feasible
      in pure Python, measure the wall time of sympy.factorint on D and record the largest prime factor
      of c. Then state the crypto-scale extrapolation as an ARGUMENT from the Hasse bound plus the
      public factoring record, NOT as an extrapolation of the measured Python timings, which would
      be meaningless. The record must say which of its numbers are measured and which are argued,
      in the same sentence. STEP 3 -- MEASURE THE WALK COST. For ell in {2, 3, 5, 7, 11, 13}, measure
      isogeny computations and wall time to determine v_ell(f_E) by Fouquet-Morain descent, as a function
      of ell and h. Fit against the predicted O(ell * h^2) and report the fitted exponent in ell rather
      than assuming it. STEP 4 -- LOCATE THE CROSSOVER. Combine: for each ell, the total cost of learning
      v_ell(f_E) is (height cost, negligible) + (walk cost, ~ell*h^2 isogenies) + (isogeny construction
      cost, dominated by psi_ell of degree (ell^2-1)/2 or by Phi_ell of size O(ell^3)). Report the
      largest ell for which the level is obtainable within a stated budget, and compare with the largest
      ell that can divide c, which is bounded by c <= 2 sqrt(p)/sqrt(|D_K|). STEP 5 -- THE C1/C2 VERDICT.
      State, per ell regime, whether the lane''s obstruction is cost or invisibility, and record it
      so that no later closure in this lane may name the wrong obstruction.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - brute-force factorization oracle on every instance (N1, blocking)
  - random integers of matched bit length, where the formula must fail (N2)
  - supersingular instances, where the pipeline must report degeneracy (N3)
  - the ell = 2 case run both with and without the case split, to measure the naive formula's error
    rate
  - a class with c a single large prime, where the cheap route must give nothing
  - "NULL OBJECT (from the proposal): (N1) THE BRUTE-FORCE ORACLE NULL, blocking: the formula-based\
    \ v_ell(c) is\n  checked against full factorization of D on every toy instance. The\n  \"cheap\"\
    \ method must agree with the \"expensive\" method on 100 percent of\n  cells, or the cheapness\
    \ is illusory.\n(N2) THE RANDOM-INTEGER NULL: run the identical v_ell shortcut on random\n  integers\
    \ of the same bit length that are NOT of the form t^2 - 4p. The\n  formula must FAIL there (it\
    \ has no reason to hold, since a random integer's\n  squarefree part is unconstrained), demonstrating\
    \ that the shortcut uses the\n  discriminant structure rather than being a generic identity. An\
    \ instrument\n  that \"works\" on random integers is not measuring what it claims.\n(N3) THE SUPERSINGULAR\
    \ NULL: supersingular curves over F_p have t = 0 and\n  D = -4p, so c is essentially 1 or 2 and\
    \ there is no volcano in the ordinary\n  sense. The pipeline must report the degenerate structure\
    \ rather than\n  inventing levels.\nDECAY PARAMETER: log p. The claimed cost of the height must\
    \ grow as O(log^2 p) and the claimed cost of the level as O(ell * h^2) with h = O(log p). A measured\
    \ cost that does NOT grow with log p at all is an artifact of caching or of a degenerate instance\
    \ family; a measured cost that grows faster than the model is a refutation of the model and must\
    \ be reported as one."
  independent_variables: []
  metrics:
    primary:
    - agreement rate of the shortcut against factorization, per ell
    - wall time of shortcut and of factorization, per log p
    - bit length of D versus bit length of p
    - isogeny computations and wall time for level determination, per (ell, h)
    secondary:
    - fitted exponents in ell and h with confidence intervals
    - the stated crossover ell* and the budget it assumes
    - EXPLICIT measured-versus-argued label on every crypto-scale number
  heuristic_under_test: null
  preregistered_prediction:
    quantity: null
    formula: null
    source: null
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SMALL-p DEGENERACY. At p ~ 2^16, c is often 1 or a tiny number, so most volcanoes have height
    0 and the walk-cost measurement has no signal. Instances must be selected for h >= 1 and the selection
    rate reported.
  - sympy.factorint's timing is not representative of any serious factoring implementation, so Step
    2's timings speak only about the toy pipeline. Every crypto-scale sentence must be argued from
    bit lengths instead, and mixing the two is the specific error this confounder names.
  - The largest prime factor of c, not c itself, determines feasibility. A 265-bit c that is a product
    of small primes is entirely tractable while a 265-bit prime c is not. All reporting is by largest
    prime factor.
  - CM-constructed curves have artificially small D_K and hence large c, which is unrepresentative
    of random curves. Random and CM instance pools must be reported separately.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: null
  falsification_criterion:
  - Any odd-ell instance where the shortcut disagrees with factorization. Part One is false; the record
    is superseded.
  - Any instance with |D| > 4p. The Hasse bound is being misapplied and claim (B)'s correction to
    IDEA-20260726-010 collapses.
  - Measured level-determination cost growing faster than O(ell * h^2). The crossover moves down and
    the "small ell is cheap" conclusion narrows; the record reports the narrower range rather than
    the original claim.
  - Reading KN-LIT-251/KN-LIT-309 reveals the bottleneck is NOT the large-ell walk. Part Three is
    misattributed and must be rewritten around whatever the papers actually say. This is a likely
    and welcome outcome of Stage 0.
  - The shortcut also "works" on random integers (N2). The formula is not using discriminant structure
    and something is wrong with the test harness.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
