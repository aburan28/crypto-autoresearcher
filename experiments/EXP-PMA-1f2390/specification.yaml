experiment:
  id: EXP-PMA-1f2390
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6c0db3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6c0db3
  question_id: RQ-PMA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Add the symmetric-realizability square-class conditions on q_ij alongside the frozen Delta
    conditions, measure their verdict separation on a shared grid, and validate both against symmetric
    and general matrix witnesses
  objective: 'The one uncertainty a run reduces is whether the frozen divisor-parity gate has identified
    the load-bearing structure of ordinary principal-minor assignment, or whether it is blind to distinctions
    that the nearest neighbouring object makes using the very intermediates the gate already computes.
    Concretely: (i) it constructs, deterministically rather than by search, a pair of prescribed tables
    differing by multiplying two of the three q_ij in a triple by the same nonsquare, so that the
    frozen gate''s Delta class is provably unchanged while the symmetric condition''s verdict flips
    -- turning the blindness claim into an exhibited object; (ii) it measures, over a shared grid
    and against a degree-matched background, the two-by-two separation table of frozen-gate verdict
    against symmetric-condition verdict, together with each gate''s method ceiling, defined as the
    fraction of the grid on which it returns anything other than NOT_OBSTRUCTED_BY_THIS_GATE; (iii)
    it validates both gates for soundness against their own witnesses, tables pulled back from explicitly
    sampled symmetric matrices and from explicitly sampled general matrices, on each of which the
    corresponding gate must never fire. The run seeks no symmetric-realizability result, revises nothing
    about RQ-PMA-001''s ordinary-matrix scope, and touches no cryptographic quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the frozen anchored
      construction, the tested prescribed grid, the tested constant fields and the stated sampling
      ensembles, an exhibited table pair demonstrating that Delta''s square class is invariant under
      a move that flips individual q_ij classes; the measured two-by-two verdict separation table
      with its background comparison; each gate''s measured method ceiling on the grid; and soundness
      measurements for both gates against their own witness ensembles. What does NOT follow: no symmetric-realizability
      conclusion (the symmetric condition is necessary only, and RQ-PMA-001 does not ask about symmetric
      matrices), no conclusion that the frozen gate is correct or incorrect, no statement about bordered,
      block, augmented, shifted, algebra-valued or extension-field representations, nothing about
      characteristic 2 or sizes other than 4, and no attack, speedup or security consequence.'
  inputs:
    procedure: 'STAGE 0 (cost: hours, human): derive and write the symmetric-side condition from the
      frozen construction''s own q_ij identity; fix the shared certificate interface. STAGE 1 (cost:
      minutes): identity control -- q_ij equals a_ij times a_ji on 10^4 sampled general matrices and
      equals a_ij squared on 10^4 sampled symmetric ones; abort on any violation. STAGE 2 (cost: seconds):
      construct the blindness pair explicitly and verify both properties; if it cannot be constructed,
      stop and report the premise as failed. STAGE 3 (cost: minutes): build NULL S from sampled symmetric
      matrices and NULL G from sampled general matrices, each table reverified from its witness by
      an independent minor implementation. STAGE 4 (cost: minutes): run both gates on NULL S and NULL
      G blinded; on any firing, stop and produce the counterexample package. STAGE 5 (cost: minutes):
      NULL R degree-matched sampled tables through both gates for background firing and separation
      rates. STAGE 6 (cost: minutes): signal grid through both gates; fill the two-by-two separation
      table; compute both method ceilings and the per-triple nontrivial-q_ij counts. STAGE 7 (cost:
      minutes): shared-machinery call-trace assertion, degenerate-branch accounting, and the run record
      with every denominator printed.'
    instrument: Python 3 with sympy for exact rational-function arithmetic and factorisation over
      GF(q)(t) and QQ(t); one shared square-class certificate routine invoked for both q_ij and Delta,
      with a call-trace assertion proving it is the same routine; explicit cofactor expansion for
      the fifteen principal minors plus an independent second implementation used only for witness
      reverification; symmetric and general matrix samplers with separately reported degree profiles.
      harness/runner.py for the manifest, seeds and inference block. No Sage.
    parameters: 'n = 4, six q_ij and three anchored Delta per table. Constant fields: F_q for the
      largest small odd q the parameter box admits, and Q. Signal grid: at least 30 prescribed tables.
      NULL S: at least 300 tables from sampled symmetric matrices, entry degrees drawn from {0, 1,
      2}. NULL G: at least 300 from sampled general matrices, same degree box. NULL R: at least 300
      degree-matched uniformly sampled tables. Identity control: 10^4 sampled matrices of each kind.
      Blindness pair: one constructed pair per constant field, with the nonsquare unit chosen explicitly
      and printed. Separation threshold against NULL R: 0.15 absolute. Per-table factorisation cap
      120 s over Q, exceeded cases UNDECIDED.'
  controls:
  - 'NULL S: at least 300 tables from explicitly sampled symmetric matrices, each reverified by an
    independent minor implementation; symmetric conditions must not fire.'
  - 'NULL G: at least 300 tables from explicitly sampled general non-symmetric matrices, each reverified;
    frozen gate must not fire.'
  - 'NULL R: degree-matched uniformly sampled tables, giving background firing and separation rates
    for both gates.'
  - 'Identity control: q_ij equal to p_i p_j minus p_ij equals a_ij times a_ji, checked exactly on
    10^4 sampled matrices, and equals a_ij squared on sampled symmetric ones.'
  - 'Shared-machinery control: the same square-class certificate routine is invoked for q_ij and for
    Delta, verified by a call-trace assertion, so implementation differences cannot masquerade as
    verdict differences.'
  - 'Degenerate-branch control: tables with any vanishing q_ij are branched and excluded from both
    gates and from the separation table, with counts reported.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Three arms, all in one invocation through shared machinery. NULL S
    (symmetric soundness): tables computed as the exact principal minors of explicitly sampled SYMMETRIC
    matrices over k(t); the symmetric conditions must fire at rate exactly zero, since realizability
    by a symmetric matrix holds by construction with the matrix as witness. NULL G (ordinary soundness):
    tables from explicitly sampled general non-symmetric matrices; the frozen gate must fire at rate
    exactly zero. NULL R (background): degree-matched uniformly sampled tables, giving the background
    rate for both gates and hence the baseline separation rate expected from coarseness alone. For
    the separation measurement to mean anything, NULL S and NULL G must both be exactly zero, and
    the observed separation on the signal grid must exceed NULL R''s separation rate; if it does not,
    the two gates differ no more than two arbitrary square-class tests of the same shape would.'
  independent_variables:
  - 'gate: frozen Delta conditions versus symmetric q_ij conditions'
  - 'arm: signal grid, NULL S symmetric witnesses, NULL G general witnesses, NULL R degree-matched
    background'
  - constant field in {F_q, Q}
  - number of q_ij with nontrivial class within a triple (0 to 3)
  metrics:
    primary:
    - two-by-two verdict separation table, counts per cell, signal grid and NULL R
    - separation rate per arm, with denominators printed
    - NULL S symmetric-condition firing rate and NULL G frozen-gate firing rate (both must be exactly
      0)
    - the constructed blindness pair, exhibited in full
    - method ceiling of each gate on the signal grid
    secondary:
    - per-triple distribution of how many q_ij have nontrivial class
    - identity control violation counts, general and symmetric
    - degenerate-branch counts and exclusions per arm
    - per-arm minor and discriminant degree profiles, since symmetric and general ensembles are not
      matched to each other
    - shared-machinery call-trace assertion result; also UNDECIDED counts from factorisation caps
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Whether the frozen gate is blind to a square-class move that the nearest neighbouring
      object sees, and the rate at which the two gates separate on the prescribed family.
    formula: 'For any realizing matrix, q_ij equals a_ij times a_ji; for a symmetric one, q_ij equals
      a_ij squared, hence each q_ij must be a square in k(t). Delta_ijk equals c_ijk squared minus
      4 q_ij q_jk q_ki depends on the q_ij only through the product q_ij q_jk q_ki, so multiplying
      any two of the three by a common nonsquare u leaves the class of that product, and hence the
      frozen verdict path through it, unchanged while flipping two individual classes. Pre-committed:
      constructed_blindness_pair_found at least 1; null_S firing rate equals 0; null_G firing rate
      equals 0; identity violations equal 0. Signal separation must exceed NULL R separation by at
      least 0.15 to be called informative. No value is pre-committed for either method ceiling, by
      explicit refusal recorded in the proposal.'
    source: Pre-registered in the parent proposal IDEA-20260816-6c0db3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested parameters are n = 4, at least 30 prescribed tables, at least 300 tables
      in each of three null arms, 10^4 identity-control samples per matrix kind, over one small odd
      finite field and Q, with entry degrees capped at 2. The blindness pair is a construction and
      carries no sampling assumption at all, which is why it is the primary deliverable. The separation
      rate is a property of the tested family and the stated ensembles and is offered as nothing more;
      symmetric and general ensembles are explicitly not matched to each other and each is compared
      only to its own gate, so no cross-ensemble transfer is assumed. Nothing transfers to other sizes,
      other representations, or characteristic 2.
    correspondence: null
  tail_checks:
  - Triples where all three q_ij have nontrivial class are inspected individually, since that is where
    the frozen gate's product can be square while every factor is not.
  - Any NULL S or NULL G firing is escalated to a full counterexample package with its witness matrix.
  - Tables with the largest discriminant degrees are inspected, since that is where the shared certificate
    routine is most likely to strain and produce common-mode error.
  - Tables where a q_ij vanishes are counted per class and excluded, since a vanishing q_ij would
    otherwise read as a nonsquare and manufacture separation.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if the identity control fails on any sampled matrix.
  - Stop and report the premise as failed if the constructed blindness pair cannot be produced.
  - Stop and produce the counterexample package on the first NULL S or NULL G firing that survives
    witness reverification.
  - Record UNDECIDED and continue for any table exceeding the factorisation cap; never convert a cap
    into a verdict.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The identity controls pass with zero violations, the constructed blindness pair
    is exhibited with its two tables and verdicts, NULL S and NULL G both show zero firings with every
    table reverified, and a complete two-by-two separation table with background comparison and both
    method ceilings is reported with printed denominators.
  falsification_criterion:
  - Any identity control violation.
  - Failure to construct the blindness pair, refuting the propagation premise.
  - Any confirmed NULL S firing (symmetric condition unsound) or NULL G firing (frozen gate unsound),
    each with an explicit witness matrix.
  - 'Signal-grid separation rate within 0.15 of NULL R''s: the symmetric object does not act as an
    informative nearby control on this family.'
  - 'Frozen-gate method ceiling of zero on the decided grid: the gate is vacuous on the tested family,
    a decisive scoped result about H-PMA-001''s non-vacuity prediction.'
  - Shared-machinery call-trace assertion failing, meaning the two gates did not use the same certificate
    routine and verdict differences are unattributable.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6c0db3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must check the symmetric-side derivation independently, since the whole entry
    rests on q_ij equal to a_ij squared following from the frozen construction's conventions.
  - The Coordinator must fix the symmetric matrix sampling ensemble and accept that it cannot be degree-matched
    to the general ensemble, or supply a matching rule.
  - Whether the six q_ij conditions are scored as one per-table verdict or six per-quantity verdicts
    needs a ruling, since they are not independent and the rates differ.
  - Valid parameter assignments for the prescribed family depend on the unresolved parameter-box question
    raised elsewhere in this bucket.
