  manifest_filename_policy:
    decision: manifest.yaml
    rationale: >-
      THE NEW EXPERIMENT'S RUN MANIFEST IS manifest.yaml, NOT manifest.json, AND THE
      REASON IS RECORDED RATHER THAN LEFT IMPLICIT. tools/validate_ledger.py indexes
      run records by globbing experiments/*/runs/*/manifest.yaml only. Both EXP-DS-001
      control runs emit manifest.json, exactly as their frozen contracts specified, so
      the validator never sees them and EV-DS-003 and EV-DS-004 are both reported as
      referencing an unknown run - for runs that exist and were certificate-verified
      1200 of 1200 by two independent sessions. Repo-wide the convention is
      manifest.yaml by a wide margin, and the same experiment's three earlier runs
      follow it. Choosing manifest.yaml here means EXP-SMTH-001 does not inherit that
      defect, its run is indexed, and its evidence record resolves. THIS CHOICE
      REPAIRS NOTHING IN EXP-DS-001 AND IS NOT A REPAIR OF IT - those contracts and
      those run packages are immutable and are not touched. The EXP-DS-001 defect is
      carried as declared open item OPEN-BATCH022-A.
    consequences_accepted: >-
      Because manifest.yaml IS indexed, tools/validate_ledger.py check_run applies in
      full, and this contract therefore requires the exact companion filenames it
      demands - command.txt, environment.json, stdout.log, stderr.log and
      raw-result.json - and the manifest's own required fields id, experiment_id,
      status, code with commit and command, environment, inputs, timing and result. The
      run claims no discrete logarithm and no decomposition, so
      result.certificate.kind is the literal string none, and the factorization
      certificates are recorded separately under CTRL-SMTH-FACT. NOTE THE .log RATHER
      THAN .txt EXTENSIONS - EXP-DS-001 used stdout.txt and stderr.txt, which the
      validator would reject on an indexed run.

