experiment:
  id: EXP-SMTH-001
  hypothesis_id: H-SMTH-001
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  question_id: RQ-ECDLP-002
  batch_id: BATCH-022
  source_control_request: RT048-CTRL-1
  source_red_team_report: RT-20260801-008
  authorizing_decision_id: DEC-20260801-006
  version: 1
  supersedes_version: null
  protocol_amendment_id: null
  title: >-
    Direct distributional measurement of genuine half-arity Semaev partial-map
    intermediates against the Dickman law, with a matched uniform-random-integer
    null object, a derivable power certificate, and a frozen u sweep
  status: review_required
  approved_by: null
  approved_by_note: >-
    NULL BY DESIGN. Approval is NOT a field in this file and is never recorded by
    editing it. Approval of this contract is recorded as APPROVAL_DETERMINATION in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-013/snapshot_commit_receipt.json
    after the independent review at TASK-20260801-012. No Executor handoff is
    authorized until that receipt records APPROVED.
  frozen: true
  frozen_on: '2026-08-01'
  frozen_by_task: TASK-20260801-010
  archived_by_task: TASK-20260801-011
  claim_tier: toy
  confirmatory_status: exploratory
  confirmatory_status_note: >-
    This is the FIRST measurement in the EXP-DS-001 lane, across twenty-one
    batches, of the quantity HEUR-DS-1 is actually about. It is confirmatory only
    about the named toy cells, the frozen intermediate map INT-1, the frozen
    encodings, the frozen factor base and the frozen smoothness ladder, and only
    after an independent review, an approval snapshot and a completed valid run
    set. It is never crypto-scale and it is never an asymptotic support path.

  # ==================================================================
  why_this_is_a_new_experiment_and_not_an_EXP_DS_001_control:
    statement: >-
      This contract may NOT be filed as a control on EXP-DS-001. The measurement
      requires summation-polynomial arithmetic (S_3 specialization over F_p), which
      CTRL-RT047-MATCHED-NULL.budget.new_dependencies expressly forbids inside that
      lane. A new EXP id is therefore mandatory and is the disposition the
      DEC-20260801-005 next_action and RT-20260801-008 next_concrete_action both
      require.
    what_is_NOT_touched: >-
      No EXP-DS-001 specification, control, amendment, driver, run package or result
      is read-modified, re-scored, reopened or staged by this experiment. EXP-DS-001
      contributes exactly two things and both are quotations, not edits - the frozen
      heur_ds_1_decision_rule thresholds reused verbatim in reused_frozen_thresholds
      below, and the frozen D_formula.

  forbidden_anti_pattern:
    id: AP-1
    statement: >-
      EXPRESSLY FORBIDDEN, IN THIS CONTRACT AND IN ANY SUCCESSOR THAT CITES IT.
      Setting smoothness_abort = true on the existing EXP-DS-001 arms and calling the
      H-DS-001 mechanism exercised is forbidden as a substitute for, or a supplement
      to, this experiment. At those parameters the flag causes is_B_smooth to be
      called on an identity-encoded curve x-coordinate below 2**20 with B = 64. That
      value is a STAND-IN, not the half-arity Semaev intermediate bounded by
      D = 2**40 that HEUR-DS-1 is about; the two differ by a factor of about 2**20 in
      magnitude. Flipping the flag would produce a false "mechanism exercised" tick on
      the ledger while testing nothing. If that flag is ever flipped it is labelled a
      PLUMBING CHECK, it produces no evidence record, and it discharges nothing here.
    basis:
      - RT-20260801-008 RT048-CTRL-1.anti_pattern_to_forbid_explicitly
      - EV-DS-004.forbidden_anti_pattern
      - DEC-20260801-005.next_actions
      - H-DS-001.mechanism_test_status.reaffirmation_batch021.next_test_that_would_change_this

  objective: >-
    Sample the ACTUAL half-arity Semaev partial-map intermediate at two frozen toy
    field sizes with m = 4, record the largest prime factor and the B-smoothness
    indicator of every sample, and decide, under thresholds frozen before the run and
    inherited unchanged from EXP-DS-001, whether that intermediate behaves for
    B-smoothness purposes like a uniform random integer of the same size - which is
    exactly what HEUR-DS-1 asserts and what has never been tested. Run the IDENTICAL
    measurement on uniform random integers of matched range as the mandatory null
    object, and sweep the smoothness bound so that the required u**(-u(1+o(1)))
    decay is directly testable and a flat smooth fraction is recognizable as the
    canonical artifact tell.

  what_this_experiment_is_NOT:
    - Not a search. No membership search, no relation harvest, no claw table, no naive or split arm.
    - Not a cost measurement. No wall-clock decision variable, no charged units, no cost identity, no R, no R_null, no assembled E.
    - Not a cryptanalytic attack on any deployed curve or live key. No discrete logarithm is computed or claimed.
    - Not STR, phi_alpha or displacement-rank instrument work.
    - Not a reopen or re-score of H-DS-001, H-IC-001, H-STR-002, EV-DS-001, EV-DS-002, EV-DS-003 or EV-DS-004.
    - Not sufficient alone, under ANY outcome, to move any asymptotic claim toward `supported`.
    - Not a validation or a refutation of HEUR-DS-1 above the toy tier under any branch.

  claim_ceiling: >-
    TOY. The only claimable objects are the empirical smoothness statistics of the
    frozen intermediate map INT-1 at the two named field sizes under the frozen
    encodings, the frozen factor base and the frozen smoothness ladder, together with
    their comparison to the frozen Dickman prediction and to the matched null. NOT
    CLAIMABLE UNDER ANY OUTCOME - crypto-scale or medium-scale validity of HEUR-DS-1;
    any asymptotic exponent statement; any affected-scheme scope statement; any
    movement of the four asymptotic promotion gates G1-G4, which remain OPEN; S1_met,
    F1_met, F2_met or structure_gate_passed, none of which this experiment can
    evaluate because it runs no search; `support` for H-SMTH-001 or for H-DS-001;
    reject_scoped on this single unreplicated run, and in particular
    reject_scoped-as-impossibility; GOAL-ECDLP-001 completion; and dominated_by null.

  # ==================================================================
  heuristic_under_test: HEUR-DS-1
  heuristic_statement_quoted_verbatim_from_H_DS_001: >-
    "Intermediate degrees arising from half-arity Semaev partial maps on uniform
    random targets behave, for B-smoothness purposes, like uniform random integers of
    the same bitlength - the probability an intermediate is B-smooth is within a
    constant factor of Dickman rho(u) with u = log D / log B, where D bounds the
    intermediate degree."

  reused_frozen_thresholds:
    source: experiments/EXP-DS-001/specification.v2.yaml heur_ds_1_decision_rule
    policy: >-
      QUOTED AND REUSED UNCHANGED. These thresholds are NOT redrafted here, are not
      relaxed, and are not tightened. The next_action recorded at the BATCH-021 close
      requires them to be reused as frozen, and any deviation would be a protocol
      amendment requiring its own review cycle.
    d_half:
      '4': 2
      '5': 4
    D_formula: >-
      D(bits, m) = 2**(bits * d_half[m]). Reused verbatim. At m = 4 this gives
      D(16, 4) = 2**32 and D(20, 4) = 2**40.
    d_formula_reading_note: >-
      DECLARED READING, FLAGGED FOR THE REVIEWER. The BATCH-021 next_action names
      "D = 2**40" while also naming bits in {16, 20}. Under the frozen D_formula those
      two are consistent only if "D = 2**40" names the bits = 20 cell, D at bits = 16
      being 2**32. THIS CONTRACT TAKES THAT READING and applies the frozen formula per
      cell rather than forcing a single D across both cells. Forcing D = 2**40 at
      bits = 16 would redraft the frozen formula, which is forbidden. The reviewer is
      instructed to confirm or reject this reading explicitly.
    u_star_formula: >-
      u = ln(D) / ln(Bsm) with natural logarithms, where Bsm is the smoothness bound.
      Reused verbatim. Every u used anywhere in this experiment is RECOMPUTED from the
      frozen integer Bsm ladder by this formula; no u is asserted.
    constant_factor_c: 8
    min_samples_per_bit_size: 100000
    rate_band:
      id: RATE-DS-1
      pass: >-
        Let p_hat = mean(I_j) and p0 = rho(u). If p0 >= 1e-15, pass iff
        (p0 / 8) <= p_hat <= (8 * p0). If p0 < 1e-15, pass iff p_hat == 0.
      fail: negation of pass
    ks_rule:
      id: KS-DS-1
      quantity: >-
        Empirical CDF of LPF-derived values Z_j = ln(N_j) / ln(P_max(N_j)) for
        N_j > 1, where P_max is the largest prime factor, compared to the classical
        Dickman LPF CDF for uniform random integers in (1, X]. Comparing a CDF of raw
        polynomial degrees to rho is a category error and is forbidden.
      threshold: >-
        ks_stat > max(0.05, 1.63 / sqrt(n)) with n = number of Z_j and
        n >= min_samples_per_bit_size fails KS-DS-1 at that bit size.
      alpha_note: 1.63/sqrt(n) is the two-sided KS critical value at alpha = 0.01.
    tail_rule:
      id: TAIL-DS-1
      pass: >-
        Let p_ext be the model probability under rho of observing a sample at least as
        smooth as the smoothest N_j in the sample, with the exact rho-based
        probability recorded. Pass iff p_ext * n >= 1. Fail iff p_ext * n < 1.
    bit_size_pass: >-
      A completed bit size with adequate samples PASSES iff RATE-DS-1 pass AND
      KS-DS-1 pass AND TAIL-DS-1 pass. Reused verbatim.
    what_is_added_rather_than_redrafted: >-
      Two decision variables are ADDED because EXP-DS-001 had no null object for the
      HEUR arm at all and no decay test - KS2-DS-1, the two-sample Kolmogorov-Smirnov
      comparison against the mandatory null object, and DECAY-1, the artifact tell.
      Their thresholds are the standard two-sample KS critical value at the SAME
      alpha = 0.01 already fixed by KS-DS-1, and a factor-100 margin on the Dickman
      ratio the frozen rho table already supplies. Nothing frozen is altered; the
      additions are declared as additions and are listed separately below.

  # ==================================================================
  # THE SAMPLED QUANTITY. This is the substantive content of the batch.
  intermediate_generation:
    id: INT-1
    name: frozen half-arity Semaev partial-map intermediate at m = 4
    step_1_partial_map: >-
      For m = 4, the meet-in-the-middle splits the 4-tuple (P1, P2 | P3, P4). The
      half-arity partial map sends an unordered half-tuple of factor-base
      x-coordinates (x_i, x_j) to the fibre of intermediate x-coordinates Z for which
      S_3(x_i, x_j, Z) = 0, where S_3 is the third Semaev summation polynomial over
      F_p. This is the standard identity that S_4(x1, x2, x3, x4) = 0 holds iff there
      exists Z with S_3(x1, x2, Z) = 0 and S_3(x3, x4, Z) = 0, and it is the map whose
      image the claw table is keyed on.
    step_2_specialization: >-
      Specialize to obtain f_ij(Z) = S_3(x_i, x_j, Z) in F_p[Z], which has degree
      exactly d_half[4] = 2 in Z whenever its leading coefficient c_2 is nonzero mod p.
      Record and count every half-tuple with c_2 == 0 mod p as a DEGENERATE draw.
    step_3_invariants: >-
      Write f_ij(Z) = c_2 Z**2 + c_1 Z + c_0 over F_p and form the two elementary
      symmetric functions of its root multiset in an algebraic closure -
      e_1 = (-c_1) * c_2**(-1) mod p and e_2 = c_0 * c_2**(-1) mod p. The pair
      (e_1, e_2) determines and is determined by the root multiset, so it is a
      COMPLETE invariant of the half-arity partial map's image at that half-tuple. It
      is well defined whether the roots lie in F_p or in F_{p**2}, which a
      root-by-root integer lift would not be.
    step_4_primary_encoding:
      id: ENC-B
      role: THE PRIMARY DECISION ENCODING
      definition: >-
        N_ij = lift(e_1) * p + lift(e_2) + 1, with lift the representative in
        [0, p). Range exactly [1, p**2].
      why_this_encoding: >-
        It is a BIJECTION from [0, p) x [0, p) onto [1, p**2]. That single fact is what
        makes the decision variables of this experiment able to vary with the thing
        they measure, and it is stated as a derivation in
        decision_variable_variation_check below.
    step_5_power_certificate_encoding:
      id: ENC-A
      role: >-
        POWER CERTIFICATE ONLY. NEVER a decision variable about HEUR-DS-1 and never
        cited as evidence for or against the heuristic.
      definition: >-
        M_ij = max(lift(e_1), 1) * max(lift(e_2), 1). Range [1, (p-1)**2], contained
        in [1, p**2].
      why_it_exists: >-
        A product of two integers each below p is provably and substantially smoother
        than a uniform integer below p**2. So ENC-A supplies a sample whose rejection
        against the null is DERIVABLE IN ADVANCE, and therefore certifies that the
        KS2-DS-1 statistic as implemented has the power to reject at all. BATCH-021
        had no such certificate and its favourable branch turned out unreachable; this
        is the direct repair. If ENC-A fails to reject, the apparatus is broken and
        the map is SUSPENDED - see branch M-5.
    bit_size_labelling_caveat: >-
      RT047-B5 discipline applies and is discharged rather than inherited. In this
      experiment `bits` names the FIELD prime p and nothing else. The prime-order
      subgroup order is IRRELEVANT here, because this experiment computes no discrete
      logarithm, harvests no relation and runs no search - the object measured lives
      in F_p and its size bound is p**2. No sentence in any deliverable may say
      "at 20 bits" without saying that it is the FIELD.
    range_matching_note: >-
      DECLARED AND LOAD-BEARING. N_ij lies in [1, p**2] and p**2 <= D = 2**(2*bits),
      with p**2 / D about 0.515 at the bits = 20 instance. THE NULL OBJECT IS
      THEREFORE DRAWN UNIFORMLY ON [1, p**2], NOT ON [1, D], so that the real and null
      samples share an exactly matched range. D is retained ONLY as the frozen bound
      that defines u through the frozen u_star_formula, exactly as EXP-DS-001 defines
      it. Drawing the null on [1, D] would introduce a range mismatch of a factor
      about 1.94 that has nothing to do with Semaev structure - the class of
      non-structural difference that RT047-B2 and RT048-B3 were about.

  # ==================================================================
  objects:
    - id: OBJ-REAL
      description: >-
        Genuine half-arity Semaev partial-map intermediates under INT-1, computed
        EXHAUSTIVELY over every unordered half-tuple (i, j) with i <= j drawn from the
        frozen factor base. Measured under both ENC-B and ENC-A.
      role: the quantity HEUR-DS-1 is about
    - id: OBJ-NULL-UNIF
      description: >-
        Uniform random integers on [1, p**2], drawn from the frozen null stream, in
        the same count as OBJ-REAL, and pushed through the IDENTICAL factorization,
        largest-prime-factor, smoothness-indicator, CDF, KS, RATE, TAIL and DECAY
        pipeline with no code path differing except the source of the integers.
      role: >-
        THE MANDATORY NULL OBJECT required by docs/inventor-protocol.md section 3.2
        and by the BATCH-021 close. A matching CDF is a controlled null and says the
        structured intermediate is not smoother than a random integer of its size,
        which is precisely what HEUR-DS-1 asserts and has never been tested.
    - id: OBJ-NULL-SYNTH
      description: >-
        ENC-B applied to pairs (e_1, e_2) drawn uniformly at random from
        [0, p) x [0, p) rather than from the Semaev map, in the same count, through
        the identical pipeline.
      role: >-
        APPARATUS IDENTITY CONTROL, NOT AN INTERPRETIVE NULL. Because ENC-B is a
        bijection onto [1, p**2], OBJ-NULL-SYNTH and OBJ-NULL-UNIF are the SAME
        distribution BY DERIVATION. Any measured disagreement between them beyond the
        KS2-DS-1 threshold is an implementation defect in the encoder or the sampler,
        never a mathematical result. This is stated in advance so that its agreement
        cannot later be presented as corroboration.

  sample_sets:
    enumeration:
      - OBJ-REAL x ENC-B x bits 16
      - OBJ-REAL x ENC-B x bits 20
      - OBJ-REAL x ENC-A x bits 16
      - OBJ-REAL x ENC-A x bits 20
      - OBJ-NULL-UNIF x bits 16
      - OBJ-NULL-UNIF x bits 20
      - OBJ-NULL-SYNTH x ENC-B x bits 16
      - OBJ-NULL-SYNTH x ENC-B x bits 20
    count: 8
    n_per_set: 131328
    n_per_set_derivation: >-
      n = C(Bfb + 1, 2) = C(513, 2) = 131328, the exact number of unordered half-tuples
      (i, j) with i <= j over a factor base of Bfb = 512 elements. OBJ-REAL is
      EXHAUSTIVE over that set, so it carries no sampling seed and no sampling noise at
      all, and it is reproducible from the factor base alone. The three other sample
      sets are drawn at the SAME n, because the two-sample KS threshold below assumes
      matched sample sizes.
    n_satisfies_the_frozen_minimum: >-
      131328 >= min_samples_per_bit_size = 100000, satisfying the frozen adequacy
      requirement and the >= 10**5 requirement of the BATCH-021 next_action, with a
      31.3 percent margin.

  factor_base:
    Bfb: 512
    notation_warning: >-
      READ THIS BEFORE ANY OTHER NUMBER IN THIS CONTRACT. Bfb is the FACTOR-BASE SIZE.
      Bsm is the SMOOTHNESS BOUND of the Dickman test. EXP-DS-001 writes both as B and
      that collision has already cost this lane one wasted measurement. The two are
      NEVER written as B anywhere in this experiment, in its driver, in its artifacts
      or in any deliverable that cites it.
    rule: >-
      Deterministic subset of E(F_p) of exact size Bfb, built as the first 512
      x-coordinates in F_p, in increasing integer order, that are x-coordinates of
      points of E(F_p). This is the same frozen_deterministic_subset policy that
      H-DS-001.test_boundary.parameters.factor_base_policy names. Record
      factor_base_sha256 over the canonical decimal newline-joined x-list.
    why_512_and_not_64_128_or_256:
      id: ATTAIN-FB-1
      statement: >-
        THIS IS THE BATCH-021 LESSON APPLIED AT THE SAMPLING LEVEL AND IT CHANGED THE
        DESIGN. The number of DISTINCT half-tuples over a factor base of size Bfb is
        C(Bfb + 1, 2). At the EXP-DS-001 factor-base sizes that is C(65, 2) = 2080 at
        Bfb = 64, C(129, 2) = 8256 at Bfb = 128 and C(257, 2) = 32896 at Bfb = 256 -
        EVERY ONE OF THEM BELOW THE FROZEN 10**5 MINIMUM. At any of those sizes the
        stated sample count is reachable only by drawing with replacement from a
        support of at most 32896 distinct values, whose empirical CDF then carries an
        irreducible discretization that would dominate the KS statistic and force a
        failure for a reason having nothing to do with Semaev structure. The minimum
        admissible factor base is therefore the least Bfb with C(Bfb + 1, 2) >= 100000,
        namely Bfb = 447 giving 100128. Bfb = 512 is chosen as the next power of two
        above it, giving 131328. THIS IS EXACTLY THE ARITHMETIC THAT WAS NOT DONE FOR
        BATCH-021'S D-2 BRANCH, WHERE A C(129, 2) = 8256 ENUMERATION CAP MADE THE
        FAVOURABLE BRANCH UNREACHABLE.
      consequence_declared: >-
        Bfb = 512 is OUTSIDE H-DS-001.test_boundary.instances, which lists
        B in {64, 128, 256}. That is a deliberate, declared departure and it is
        admissible here because THIS EXPERIMENT TESTS H-SMTH-001, NOT H-DS-001, and
        H-SMTH-001's own test boundary names Bfb = 512. Nothing about H-DS-001's test
        boundary is altered, amended or annotated by this contract.

  smoothness_ladder:
    variable: Bsm
    policy: >-
      Bsm is FROZEN as an integer ladder per bit size, chosen so that the recomputed
      u = ln(D)/ln(Bsm) lands as near as an integer Bsm permits to the target sweep
      {2, 3, 4, 5, 6}. Every rho evaluation uses the RECOMPUTED u from the integer
      Bsm, never the target value. No Bsm may be added, removed or re-rounded after
      any datum is observed.
    bits_20:
      D: 1099511627776
      D_expr: 2**40
      ladder:
        - {u_target: 2, Bsm: 1048576}
        - {u_target: 3, Bsm: 10321}
        - {u_target: 4, Bsm: 1024}
        - {u_target: 5, Bsm: 256}
        - {u_target: 6, Bsm: 102}
    bits_16:
      D: 4294967296
      D_expr: 2**32
      ladder:
        - {u_target: 2, Bsm: 65536}
        - {u_target: 3, Bsm: 1626}
        - {u_target: 4, Bsm: 256}
        - {u_target: 5, Bsm: 84}
        - {u_target: 6, Bsm: 40}
    sweep_requirement_discharged: >-
      u ranges over at least [2, 6] at both bit sizes, discharging the
      MANDATORY ARTIFACT TELL clause of the BATCH-021 next_action.
    rho_reference_values:
      note: >-
        The frozen Dickman reference values used for the power and attainability
        arithmetic in this contract. The RUN must compute rho by numerical solution of
        the Dickman delay equation and must record its own computed values beside
        these; a discrepancy above 1 percent at any tabulated point is a declared
        apparatus defect under branch M-5.
      rho_1: 1.0
      rho_2: 0.30685
      rho_3: 0.048608
      rho_4: 0.0049109
      rho_5: 0.00035473
      rho_6: 0.000019650

  power_and_adequacy:
    id: POW-1
    statement: >-
      RATE-DS-1 pass or fail is evaluated ONLY at u points where the model expects at
      least 30 smooth samples, that is n * rho(u) >= 30. At n = 131328 that holds at
      u = 2 (expected 40300), u = 3 (6384), u = 4 (645) and u = 5 (46.6), and FAILS at
      u = 6 (expected 2.58).
    consequence: >-
      u = 6 is recorded, is reported, and FEEDS DECAY-1, but is LABELLED UNDERPOWERED
      and is EXCLUDED from RATE-DS-1 pass or fail. The sample size that would power it
      is stated rather than hidden - n >= 30 / rho(6) = 1526718 at bits = 20. This is
      declared BEFORE the run precisely so that a post-hoc exclusion is impossible.
    why_decay_is_still_sound_at_u_6: >-
      DECAY-1 fires only when the observed ratio EXCEEDS its threshold, and a Poisson
      count with mean 2.58 cannot reach the 841 counts that would be needed to cross
      it. Low-count noise at u = 6 can therefore only make DECAY-1 harder to fire,
      never easier, so the artifact tell is conservative exactly where RATE is weak.

  # ==================================================================
  decision_variables:
    - id: DV-1
      name: KS-DS-1 on OBJ-REAL under ENC-B
      threshold: max(0.05, 1.63 / sqrt(131328)) = max(0.05, 0.004498) = 0.05
    - id: DV-2
      name: RATE-DS-1 on OBJ-REAL under ENC-B at each powered u in {2, 3, 4, 5}
      threshold: factor 8 band about rho(u), frozen
    - id: DV-3
      name: TAIL-DS-1 on OBJ-REAL under ENC-B
      threshold: p_ext * n >= 1, frozen
    - id: DV-4
      name: KS2-DS-1, two-sample KS between OBJ-REAL under ENC-B and OBJ-NULL-UNIF
      threshold: >-
        ks2_stat > 1.63 * sqrt(2 / 131328) = 0.006362 rejects at alpha = 0.01. This is
        the standard two-sample critical value at the SAME alpha that KS-DS-1 already
        fixes; it is an addition, not a redraft.
      role: >-
        THE DIRECT TEST OF HEUR-DS-1's OWN SENTENCE - whether the intermediate behaves
        for smoothness purposes like a uniform random integer of the same size.
    - id: DV-5
      name: DECAY-1, the artifact tell
      quantity: p_hat(u = 6) / p_hat(u = 2) on OBJ-REAL, per encoding and bit size
      threshold: >-
        DECAY-1 FIRES iff the ratio exceeds 100 * rho(6) / rho(2) =
        100 * 0.000019650 / 0.30685 = 0.006404. A genuine sample of integers of size
        about D has expected ratio 0.0000640, a factor 100 below the threshold; the
        BATCH-020 stand-in has ratio about 0.0527, a factor 8.2 above it.
      basis: >-
        Canfield-Erdos-Pomerance requires the smooth fraction to decay like
        u**(-u(1+o(1))). A smooth fraction that stays flat as u grows is the canonical
        artifact tell of docs/inventor-protocol.md section 3.1 and indicates the
        sampled quantity is not the intermediate.
    - id: DV-6
      name: POWER CERTIFICATE - KS2-DS-1 between OBJ-REAL under ENC-A and OBJ-NULL-UNIF
      required_outcome: MUST REJECT
      role: >-
        Not evidence about HEUR-DS-1. It certifies that DV-4 can reject at all. A
        failure to reject means the apparatus cannot detect a deviation it is
        mathematically required to detect, and SUSPENDS the map under M-5.
    - id: DV-7
      name: APPARATUS IDENTITY - KS2-DS-1 between OBJ-NULL-SYNTH and OBJ-NULL-UNIF
      required_outcome: MUST NOT REJECT
      role: >-
        Derivably the same distribution. A rejection is an implementation defect and
        SUSPENDS the map under M-5. Its agreement is NOT corroboration of anything and
        may not be reported as such.

  decision_variable_variation_check:
    id: DV-CHECK
    why_this_block_exists: >-
      MANDATED BY THE BATCH-021 CLOSE. EV-DS-004 N-2 and RT048-B1 established that the
      charged-unit proxy in the previous lane was a CLOSED FORM IN THE PROTOCOL'S OWN
      MATCHED PARAMETERS - charge_backend_units returns a constant 40 per call, so the
      ratio U was exactly the enumeration-count ratio with the object-free expectation
      2/(|signed| + 1) = 2/129. The object cancelled. A decision variable that cannot
      vary with the thing it is supposed to measure cannot discriminate the objects it
      compares. Every decision variable of THIS experiment is therefore checked
      against that failure mode, in advance and in writing.
    dv_1_dv_2_dv_3_dv_4:
      verdict: VARY WITH THE OBJECT, BY DERIVATION
      argument: >-
        ENC-B is a bijection from [0, p) x [0, p) onto [1, p**2], and OBJ-NULL-UNIF is
        drawn uniformly on that same [1, p**2]. Therefore the law of N_ij on OBJ-REAL
        equals the pushforward under that bijection of the joint law of
        (e_1(x_i, x_j), e_2(x_i, x_j)) over half-tuples, and OBJ-NULL-UNIF is the
        pushforward of the uniform law on [0, p)**2. Consequently DV-1 through DV-4
        deviate from their null values IF AND ONLY IF the joint law of the two
        elementary symmetric functions of the half-arity Semaev partial map differs
        from uniform. THAT IS A PROPERTY OF THE SEMAEV MAP ALONE. It contains no free
        parameter of this protocol - not Bfb, not n, not Bsm, not the seed - so no
        analogue of the 2/129 degeneracy is available. This is a checkable derivation
        and the reviewer is directed to attack it.
    dv_5:
      verdict: VARIES WITH THE MAGNITUDE OF THE SAMPLED QUANTITY
      argument: >-
        DECAY-1 is a function of the sample alone, comparing the sample against itself
        at two ends of the Bsm ladder. It has no dependence on any protocol parameter
        except the ladder, which is frozen, and it is precisely the statistic that the
        BATCH-020 stand-in would have failed had anyone computed it. Its threshold is
        derived from the frozen rho table, not chosen to suit the data.
    dv_6:
      verdict: >-
        DELIBERATELY A CLOSED-FORM PREDICTION, AND USED ONLY AS SUCH
      argument: >-
        DV-6's rejection is derivable in advance, which under the BATCH-021 lesson
        would make it worthless as evidence. It is therefore NOT evidence. It is used
        for exactly one purpose - to certify power - and the contract forbids citing it
        for any other. Declaring the degeneracy and confining the variable to a role
        the degeneracy does not spoil is the correct handling; concealing it, or
        letting it fire a substantive branch, is not.
    dv_7:
      verdict: >-
        DERIVABLY CONSTANT, AND CONFINED TO A GUARD
      argument: >-
        DV-7 must not reject, by derivation. Like DV-6 it therefore carries no
        interpretive weight and is confined to the M-5 guard. Its non-rejection is
        explicitly declared NOT to be corroboration, so that no downstream record can
        present it as a second confirmation, which is the error RT048-H4 caught in
        BATCH-021's two-proxy reporting.
    variables_expressly_excluded: >-
      No wall-clock time, no charged unit, no operation count, no cost ratio and no R
      appears anywhere in this experiment's decision space. The BATCH-021 close
      established that every remaining R figure in the EXP-DS-001 lane is predicted in
      closed form until the backend changes, so no R is measured here at all.

  # ==================================================================
  pre_registered_reading_rule:
    id: RR-SMTH-1
    frozen_before_any_datum_exists: true
    freeze_binding_task: TASK-20260801-011
    freeze_binding_statement: >-
      This reading rule is hash-bound by the TASK-20260801-011 snapshot commit BEFORE
      the independent review at TASK-20260801-012, BEFORE the approval snapshot at
      TASK-20260801-013 and BEFORE any run package exists. It may not be altered after
      any number is observed except by a versioned protocol_amendment recorded BEFORE
      the Coordinator sees the result and justified on grounds independent of it.
    precedence: >-
      M-0, then M-5, then M-1, then exactly one of M-2, M-4, M-6. The first branch in
      that order whose condition holds is the branch that fires. No result may be read
      into more than one branch and no result may fall outside all of them.
    branches:
      - id: M-0
        name: INTEGRITY GUARD
        condition: >-
          ANY of the following - a sample set with fewer than 131328 recorded samples;
          any recorded N_ij or M_ij exceeding p**2; a factorization whose recorded
          prime powers do not multiply back to the sample; any recorded factor failing
          a primality re-check; a DEGENERATE draw count above 1 percent of half-tuples
          without an explicit declaration; the frozen INT-1 map not reproducible by
          the Validator from the manifest alone; or any timeout, crash, resource
          exhaustion or budget cancellation.
        disposition: >-
          MAP SUSPENDED. The outcome is an infrastructure or instrument signal and is
          NEVER a mathematical result about HEUR-DS-1, in either direction (AGENTS.md
          rule 5). Scoped repair, then re-run under this same frozen rule.
        hypothesis_transition: none
      - id: M-5
        name: APPARATUS FAILURE
        condition: >-
          ANY of three legs - (a) OBJ-NULL-UNIF itself fails bit_size_pass at either
          bit size, which is impossible for genuinely uniform integers and therefore
          convicts the rho evaluation, the LPF extraction, the smoothness indicator or
          the KS implementation; (b) DV-6 FAILS TO REJECT, so the apparatus cannot
          detect a deviation derivable in advance; (c) DV-7 REJECTS, so the encoder or
          a sampler is defective.
        disposition: >-
          MAP SUSPENDED. Instrument failure. No disposition about HEUR-DS-1 in either
          direction. Named repair required before any re-run.
        hypothesis_transition: none
      - id: M-1
        name: STAND-IN TELL
        condition: >-
          DECAY-1 fires on OBJ-REAL under ENC-B at either bit size.
        disposition: >-
          `inconclusive` on HEUR-DS-1, with a POSITIVE instrument finding - the
          sampled quantity is not behaving like an integer of size D, so INT-1 as
          implemented is a stand-in and not the intermediate. This is the BATCH-020
          failure mode caught prospectively rather than twenty-one batches later. It is
          NOT a refutation of HEUR-DS-1 and NOT support for it. Repair INT-1 and re-run
          under this same frozen rule.
        hypothesis_transition: H-SMTH-001 stays `analyzed`; no weaken, no reject.
      - id: M-2
        name: CONSISTENT WITH DICKMAN AT BOTH TOY CELLS
        condition: >-
          No M-0, no M-5, no M-1, AND on OBJ-REAL under ENC-B at BOTH bits 16 and
          bits 20 - KS-DS-1 pass AND TAIL-DS-1 pass AND RATE-DS-1 pass at every powered
          u in {2, 3, 4, 5} AND DV-4 does not reject.
        disposition: >-
          `replicate`. HEUR-DS-1 is CONSISTENT with the Dickman law at the two tested
          toy cells on the first measurement ever made of the correct object. EXPLICITLY
          NOT `support`, NOT validation of HEUR-DS-1 at any tier above toy, NOT S1_met
          or F1_met or F2_met, NOT any movement of G1-G4, and NOT a licence for any
          conditional asymptotic statement. A single unreplicated run at two cells on
          one host cannot be more than this, and the AGENTS.md state machine requires
          `replicated` before `supported` in any case.
        hypothesis_transition: H-SMTH-001 `analyzed` -> stays `analyzed`, with the consistency recorded in evidence.
        mandatory_companions: >-
          A second-seed replication at a different curve instance per bit size, and an
          extension of n at u = 6 to at least 1526718 to power the u = 6 rate check,
          both ranked into the BATCH-023 opening.
        knowledge_promotion_expectation: >-
          NOT WARRANTED. The promotion gate fires on `support` or `reject_scoped` with
          `replicated` or `strong` evidence; `replicate` on a preliminary unreplicated
          set is neither.
      - id: M-4
        name: DEVIATION FROM DICKMAN AT BOTH TOY CELLS
        condition: >-
          No M-0, no M-5, no M-1, AND on OBJ-REAL under ENC-B at BOTH bit sizes the
          conjunction required by M-2 FAILS, that is bit_size_pass fails or DV-4
          rejects, at both cells.
        disposition: >-
          `weaken`, SCOPED EXACTLY to HEUR-DS-1 as instantiated by INT-1 and ENC-B at
          the two tested toy field sizes, the frozen 512-element factor base, the
          frozen Bsm ladder and m = 4. EXPLICITLY NOT `reject_scoped` and in particular
          NOT reject_scoped-as-impossibility - a single unreplicated empirical_only run
          may not carry a scoped rejection, by the Coordinator contract and by
          docs/claims-and-verification.md. NOT a statement that HEUR-DS-1 is false at
          medium or crypto scale. NOT a closure of SG-ECDLP-001 or of this lane. NOT an
          adverse finding about H-DS-001, whose status is untouched by this experiment.
        refutation_artifact_required: >-
          MANDATORY AND ARCHIVED BEFORE THE DECISION THAT RELIES ON IT. Seek the
          strongest checkable artifact the result admits, in order - (1) a
          COUNTEREXAMPLE CERTIFICATE, namely the explicit list of half-tuples whose
          intermediates carry the deviation together with their fully verified
          factorizations, from which an independent reader can recompute the offending
          statistic; then (2) a DERIVATION NOTE identifying the algebraic reason the
          joint law of (e_1, e_2) departs from uniform; then (3) a declared
          `empirical_only` basis. The basis actually achieved must be declared; an
          undeclared basis is the failure, not the absence of a proof.
        hypothesis_transition: H-SMTH-001 `analyzed` -> `weakened`, WITH A `status_scope` BLOCK WRITTEN INTO THE HYPOTHESIS RECORD IN THE SAME LEDGER COMMIT.
        status_scope_mandatory_because: >-
          RT048-B5. A bare `weakened` status field is unscoped by construction, because
          successors read the field and not the branch text.
        knowledge_promotion_expectation: >-
          NOT WARRANTED on this package alone. `weaken` is neither `support` nor
          `reject_scoped`, and one unreplicated run yields `preliminary`, not
          `replicated` or `strong`.
      - id: M-6
        name: SPLIT VERDICT ACROSS THE TWO CELLS
        condition: >-
          No M-0, no M-5, no M-1, AND exactly one of the two bit sizes satisfies the
          M-2 conjunction while the other does not.
        disposition: >-
          `inconclusive`. The data do not discriminate the explanations. Record which
          cell passed and which failed, and the exact statistic and threshold at each.
          NO post-hoc success label and NO post-hoc failure label is available; in
          particular the passing cell may not be reported alone. Next action is a third
          field size and a second seed at each existing cell.
        hypothesis_transition: H-SMTH-001 stays `analyzed`.
        knowledge_promotion_expectation: NOT WARRANTED.
    exhaustiveness_argument: >-
      Given that M-0, M-5 and M-1 do not fire, each of the two bit sizes either
      satisfies the M-2 conjunction or does not. Both satisfy -> M-2. Neither satisfies
      -> M-4. Exactly one satisfies -> M-6. Those three cases are mutually exclusive
      and jointly exhaustive over the outcome space, and M-0, M-5 and M-1 pre-empt in
      the declared order. There is no gap and therefore no room for a post-hoc reading.

    # ==============================================================
    attainability_argument:
      id: ATTAIN-RR-SMTH-1
      why_this_block_exists_and_why_it_is_mandatory: >-
        THIS IS THE CENTRAL PROCESS CHANGE OF BATCH-022. BATCH-021's disposition map
        was verified EXHAUSTIVE by an independent reviewer and was applied honestly,
        but it was never checked for ATTAINABILITY, and its favourable branch D-2 was
        arithmetically unreachable - split_search caps per-target enumeration at
        C(129, 2) = 8256, forcing U <= 0.4706 for any succeeding split arm, so
        U >= 0.9 could not have fired on ANY object, including a hypothetical object
        with the strongest imaginable Semaev structure (EV-DS-004 N-3, RT048-B2).
        THE EXPERIMENT COULD NOT HAVE CONFIRMED THE HYPOTHESIS EVEN HAD IT BEEN TRUE.
        Exhaustiveness is necessary and is not sufficient. Every branch of RR-SMTH-1
        therefore carries below a CONCRETE DEMONSTRATION THAT SOME ACHIEVABLE
        MEASUREMENT LANDS IN IT, given this sampling design and these frozen
        thresholds. Checking this block is a NAMED, EXPLICIT DUTY of the independent
        reviewer at TASK-20260801-012 and its rejection is a REVISE.
      m_0_attainable: >-
        REACHABLE BY CONSTRUCTION AND WITHOUT ANY MATHEMATICAL OUTCOME. The 7200 s
        wall-clock stop lands here whenever any of the eight sample sets is short of
        131328; the declared procedure has 1050624 factorizations to perform, so a
        stop is a reachable state rather than a formality. Independently, any recorded
        N_ij exceeding p**2 lands here, and the Validator can force that check from the
        raw record alone.
      m_5_attainable: >-
        THREE INDEPENDENT ACHIEVABLE ROUTES, ONE PER LEG. Leg (a) - a rho evaluation
        that takes logarithms base 2 rather than natural logarithms shifts u by a
        factor ln 2, moving the prediction at the u = 4 rung from rho(4) = 0.0049109 to
        about rho(2.77) = 0.065, a factor 13 outside the frozen factor-8 band, so the
        NULL fails RATE-DS-1 and the leg fires. That is an achievable implementation,
        and it is precisely the class of error the leg exists to catch. Leg (b) - an
        ENC-A that inadvertently reproduces ENC-B, or a two-sample KS computed without
        merging tied support points, yields ks2 near 0 on a sample whose non-uniformity
        is derivable, firing the leg. Leg (c) - an off-by-one in the base-p
        concatenation makes OBJ-NULL-SYNTH non-uniform on [1, p**2] and the leg fires.
        All three are reachable states of achievable code, not hypothetical ones.
      m_5_negative_side_also_attainable: >-
        AND CRUCIALLY, NOT FIRING IS ALSO ATTAINABLE, WHICH IS WHAT MAKES THE GUARD A
        GUARD RATHER THAN A CEILING. Leg (b)'s required rejection is essentially
        certain for a correct implementation - ENC-A is a product of two integers below
        p, and products of two roughly equal-sized factors are markedly smoother than
        uniform integers of the same size, so the ks2 statistic against the null is of
        order 0.1 against a threshold of 0.006362, a margin of more than an order of
        magnitude. Leg (c)'s required non-rejection is exact by the bijection argument.
      m_1_attainable: >-
        REACHABLE, AND REACHABLE BY A MEASUREMENT THIS PROGRAM HAS ACTUALLY PRODUCED.
        Substituting the BATCH-020 stand-in - the identity encoding of a curve
        x-coordinate, an integer below p, while retaining D = 2**40 - gives a smooth
        fraction of exactly 1.0 at the u = 2 rung, since Bsm = 1048576 exceeds p, and
        of rho(ln p / ln 102) = rho(2.917) which is about 0.0527 at the u = 6 rung. The
        ratio is 0.0527, which EXCEEDS the DECAY-1 threshold 0.006404 by a factor 8.2,
        so DECAY-1 fires. The branch is therefore not merely formally reachable; the
        exact object that occupied this lane for twenty-one batches lands in it.
      m_1_not_firing_also_attainable: >-
        A genuine sample of integers of size about D has expected ratio
        rho(6)/rho(2) = 0.0000640, a factor 100 BELOW the threshold, and the Poisson
        count at the u = 6 rung has mean 2.58 against the 841 counts that crossing the
        threshold would require. So a correct measurement cannot fire M-1 by noise, and
        the branch discriminates rather than merely existing.
      m_2_attainable: >-
        REACHABLE, AND ITS REACHABILITY IS DEMONSTRATED INSIDE THE SAME RUN BY THE NULL
        ARM. This is the single most important line of this block, and it is the
        precise repair of BATCH-021's D-2 defect. OBJ-NULL-UNIF is pushed through the
        IDENTICAL pipeline as OBJ-REAL, and a genuinely uniform sample satisfies
        RATE-DS-1 at every powered u within a factor 8 with overwhelming probability,
        satisfies KS-DS-1 against a threshold of 0.05 while the alpha = 0.01 critical
        value at n = 131328 is 0.004498, satisfies TAIL-DS-1 with probability about
        1 - 1/e, and satisfies DV-4 against itself. THE NULL ARM THEREFORE PRODUCES AN
        M-2-PATTERN MEASUREMENT ON THE SAME CODE PATH IN THE SAME RUN. The question the
        experiment asks is only whether OBJ-REAL matches it, and it is impossible for
        the M-2 pattern to be unreachable while the null arm is admissible. Contrast
        BATCH-021, where NO arm on ANY object could have produced U >= 0.9.
      m_2_arithmetic_check_of_every_conjunct: >-
        Conjunct by conjunct at n = 131328. RATE-DS-1 at u = 2 needs p_hat in
        [0.03836, 1.0] against an expectation of 0.30685 - reachable, and the band is
        wide. At u = 3, [0.006076, 0.38886] against 0.048608. At u = 4,
        [0.000614, 0.039287] against 0.0049109, with 645 expected smooth samples so the
        relative standard error is 3.9 percent against a band of a factor 8. At u = 5,
        [0.0000443, 0.0028378] against 0.00035473, with 46.6 expected samples and a
        relative standard error of 14.6 percent, still comfortably inside a factor-8
        band - which is exactly why the POW-1 cut was placed at 30 expected samples
        rather than lower. KS-DS-1's threshold 0.05 is eleven times the alpha = 0.01
        critical value 0.004498, so a correct sample passes with large margin. DV-4's
        threshold 0.006362 is the alpha = 0.01 two-sample value itself, so a genuinely
        matching sample passes 99 percent of the time. EVERY CONJUNCT IS SATISFIABLE
        SIMULTANEOUSLY BY AN ACHIEVABLE MEASUREMENT.
      m_4_attainable: >-
        REACHABLE, AND BY A CONCRETE ACHIEVABLE CONFIGURATION OF THE FROZEN SAMPLING
        DESIGN RATHER THAN ONLY IN PRINCIPLE. The exhaustive half-tuple set includes
        the 512 diagonal draws i = j, for which S_3(x, x, Z) is a specialization with a
        forced square structure that biases e_2 toward the quadratic residues, a set of
        density 1/2 in F_p. More generally any bias that concentrates e_2 on a set of
        density at most 1/2 displaces the CDF of N by up to 0.25 in supremum norm,
        which is 39 times the DV-4 threshold 0.006362 and 5 times the KS-DS-1 threshold
        0.05. A deviation of the size the half-arity map could plausibly carry is
        therefore detectable many times over, and no cap, no closed form and no
        parameter of this protocol bounds DV-4 away from its rejection region - which is
        the exact property BATCH-021's U limb lacked.
      m_6_attainable: >-
        REACHABLE, AND FOR A STATED PHYSICAL REASON RATHER THAN AS A FORMAL PLACEHOLDER.
        The two cells are different curves over different primes and the frozen
        512-element factor base covers about 0.78 percent of F_p at bits = 16 and about
        0.049 percent at bits = 20, a factor 16 difference in density. Any deviation
        whose size scales with factor-base density is therefore plausibly detectable at
        bits = 16 and undetectable at bits = 20 at this n, which is a split verdict
        arising from the design itself.
      every_band_of_every_sweep_checked: >-
        The Bsm ladder is checked rung by rung above under m_2_arithmetic_check and
        POW-1, and the one rung that is NOT attainable as a RATE decision - u = 6 with
        2.58 expected smooth samples - IS DECLARED UNATTAINABLE AS A RATE DECISION IN
        ADVANCE, is excluded from RATE-DS-1, is retained for DECAY-1 where its
        low-count noise is provably conservative, and carries the sample size that
        would power it. Declaring an unattainable band and confining it to a role its
        unattainability does not spoil is what BATCH-021 failed to do.
      residual_attainability_risk_declared: >-
        STATED RATHER THAN HIDDEN. If the joint law of (e_1, e_2) is very close to
        uniform for a reason internal to the algebra of S_3 - for example if the
        specialization behaves like a well-mixing rational map on F_p**2 - then M-2 is
        the near-certain outcome and the experiment's information content is lower than
        its cost suggests. That is NOT a defect of the reading rule, because M-4 remains
        reachable by the density argument above and the outcome would still be the
        first direct measurement of the quantity; but it is disclosed here so that an
        M-2 landing is not later written up as a stronger confirmation than it is, and
        so that the reviewer may weigh it. The symmetric risk - that M-4 is near-certain
        because of the diagonal draws - is bounded by the fact that diagonal draws are
        512 of 131328 samples, that is 0.39 percent, far too few to move a KS statistic
        by 0.006362 on their own.

  # ==================================================================
  metrics:
    primary:
      - HEUR_SMTH_KS_distance: KS statistic of the Z_j CDF against the Dickman LPF CDF, per sample set
      - HEUR_SMTH_KS_ok: boolean from KS-DS-1
      - HEUR_SMTH_smooth_rate: p_hat at each Bsm rung, per sample set
      - HEUR_SMTH_rho_u: computed rho at the recomputed u of each rung, with the frozen reference beside it
      - HEUR_SMTH_rate_band_ok: boolean from RATE-DS-1 at each powered rung
      - HEUR_SMTH_tail_ok: boolean from TAIL-DS-1, with the exact p_ext recorded
      - HEUR_SMTH_bit_size_pass: RATE and KS and TAIL
      - HEUR_SMTH_ks2_vs_null: two-sample KS statistic against OBJ-NULL-UNIF, per real sample set
      - HEUR_SMTH_ks2_reject: boolean from KS2-DS-1
      - HEUR_SMTH_decay_ratio: p_hat at the u = 6 rung divided by p_hat at the u = 2 rung
      - HEUR_SMTH_decay_tell_fired: boolean from DECAY-1
      - HEUR_SMTH_power_certificate_rejected: boolean, DV-6, MUST be true
      - HEUR_SMTH_apparatus_identity_ok: boolean, DV-7, MUST be true
    secondary:
      - largest_prime_factor_histogram: per sample set, binned on ln(P_max)/ln(N)
      - degenerate_draw_count: half-tuples with leading coefficient zero mod p
      - factorization_certificates_verified: verified over total, per sample set
      - factor_base_sha256
      - null_stream_sha256
      - synth_stream_sha256
      - intermediate_map_sha256: hash of the frozen INT-1 implementation function source
      - peak_rss_bytes
      - wall_seconds_total: RECORDED FOR BUDGET ACCOUNTING ONLY, never a decision variable

  controls:
    - id: CTRL-SMTH-NULL
      method: OBJ-NULL-UNIF through the identical pipeline at matched n and matched range [1, p**2].
      pass_condition: >-
        Present at every bit size for which a real sample set is reported. If absent,
        no distributional reading of the real sample is admissible at all.
    - id: CTRL-SMTH-POWER
      method: OBJ-REAL under ENC-A against OBJ-NULL-UNIF at KS2-DS-1.
      pass_condition: MUST REJECT. Failure to reject suspends the map under M-5 leg (b).
    - id: CTRL-SMTH-IDENTITY
      method: OBJ-NULL-SYNTH against OBJ-NULL-UNIF at KS2-DS-1.
      pass_condition: MUST NOT REJECT. Rejection suspends the map under M-5 leg (c).
    - id: CTRL-SMTH-FACT
      method: >-
        Independent re-verification of every recorded factorization by recomputing the
        product of the recorded prime powers and re-checking the primality of every
        recorded factor, through a verifier path that does not reuse the factoring
        call.
      pass_condition: verified equals total on every sample set, or M-0 fires.
    - id: CTRL-SMTH-RANGE
      method: Assert every recorded sample lies in [1, p**2] and that p**2 <= D.
      pass_condition: No violation, or M-0 fires.

  independent_variables:
    - field_bits: [16, 20]
    - object: [OBJ-REAL, OBJ-NULL-UNIF, OBJ-NULL-SYNTH]
    - encoding: [ENC-B, ENC-A]
    - smoothness_bound_Bsm: per the frozen ladder
  fixed_variables:
    arity_m: 4
    d_half: 2
    factor_base_size_Bfb: 512
    factor_base_policy: frozen_deterministic_subset

  replication:
    master_seed: 2201
    seed_policy: >-
      Master seed 2201, chosen disjoint from the EXP-DS-001 seeds 101, 102 and 103 so
      that no stream of this experiment can coincide with a stream of that lane. The
      curve instance at each bit size is generated by
      harness.toycurve.generate_instance(2201, field_bits). The null stream is derived
      as seed 2201 + 10000 + field_bits and the synth stream as 2201 + 20000 +
      field_bits, both recorded with their stream hashes. OBJ-REAL IS EXHAUSTIVE AND
      CARRIES NO SAMPLING SEED, so it is bit-for-bit reproducible from the factor base
      alone.
    independent_instances: 2
    runs_planned: 1
    replication_status_declared: >-
      NONE. This is a single unreplicated run and no replication is claimed anywhere.
      A second-seed replication is a mandatory companion of M-2 and of M-4 and is
      ranked into the BATCH-023 opening under either.
    planned_runs:
      - id: RUN-SMTH-001-heur
        purpose: >-
          All eight sample sets in one execution - the exhaustive real half-tuple sets
          under both encodings at both bit sizes, the two matched null sets and the two
          apparatus-identity sets - with the full Bsm ladder, the KS, RATE, TAIL, KS2
          and DECAY statistics, and the factorization certificates.

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 1
    new_dependencies: >-
      NONE beyond the sympy 1.14.0 already recorded in the EXP-DS-001
      environment.json. Factorization of integers below 2**40 is well inside sympy's
      factorint; no ECM, no external CAS and no new package is permitted. If any new
      dependency proves necessary the run is cancelled and reported, not extended.
    stage_estimates:
      curve_and_factor_base_construction: <= 60 seconds
      intermediate_generation: <= 300 seconds for 2 x 131328 half-tuples
      factorization: <= 5400 seconds for 1050624 integers below 2**40
      statistics_and_artifacts: <= 300 seconds
    cost_note: >-
      Minutes to low hours, as the BATCH-021 next_action estimated. The dominant term
      is factorization and it is embarrassingly parallel, but NO parallelism is
      required or permitted, because determinism of the recorded stream matters more
      here than speed.

  stopping_rules:
    - >-
      Stop when all eight sample sets reach n = 131328, or at wall_clock_seconds_per_run,
      whichever comes first. A short set is reported short and fires M-0; it is never
      padded, imputed or extrapolated.
    - Stop the whole run on any CTRL-SMTH-FACT verification failure and report it.
    - >-
      A timeout, crash, memory exhaustion or budget cancellation is recorded as such
      and is NEVER a mathematical negative about HEUR-DS-1 (AGENTS.md rule 5).

  invalidation_rules:
    - Any recorded sample outside [1, p**2] invalidates its sample set.
    - Any factorization that does not multiply back to its sample invalidates the run.
    - Real and null sample sets differing in n, in range, or in any pipeline code path other than the source of the integers invalidates the comparison.
    - Any u used for a rho evaluation that was not recomputed from a frozen ladder Bsm invalidates the affected rung.
    - Any edit to this specification after TASK-20260801-011 without a versioned protocol_amendment is an integrity failure, not a result.
    - Any search arm, timing decision variable, cost identity or R appearing anywhere in the run package invalidates the package for scope violation.

  success_criterion: >-
    S-SMTH-1 - a COMPLETE VALID RUN SET, meaning all eight sample sets at
    n = 131328 with 100 percent factorization re-verification, no M-0 guard fired, no
    M-5 apparatus leg fired, and every statistic of the metrics block recorded, so that
    exactly one of M-1, M-2, M-4 or M-6 can be read off the frozen rule. NOTE THAT
    S-SMTH-1 IS A COMPLETENESS CRITERION AND NOT A DIRECTIONAL ONE - this experiment is
    a measurement, and it succeeds by measuring, not by the measurement coming out any
    particular way. No branch of RR-SMTH-1 constitutes `support` for anything.

  falsification_criterion: >-
    F-SMTH-1 - branch M-4, that is OBJ-REAL under ENC-B fails bit_size_pass or is
    rejected against the matched null at BOTH tested field sizes, with the null itself
    passing and the power certificate rejecting. HEUR-DS-1 is then reported FAILED AT
    TOY SCALE, under the frozen thresholds, scoped exactly to INT-1, ENC-B, the two
    field sizes, Bfb = 512, m = 4 and the frozen ladder. This is a `weaken`, never a
    `reject_scoped`, on one unreplicated run, and it is never a crypto-scale
    refutation.
    F-SMTH-2 - branch M-1, the artifact tell, which falsifies the INSTRUMENT and not
    the heuristic and is labelled as such.

  outcome_disposition:
    M-0_or_M-5: inconclusive on the instrument; infrastructure signal; AGENTS.md rule 5; no mathematical negative.
    M-1: inconclusive on HEUR-DS-1 with a positive instrument finding; repair INT-1.
    M-2: replicate; explicitly not support; companions ranked into BATCH-023.
    M-4: weaken scoped, with a status_scope block and a refutation artifact archived first; never reject_scoped.
    M-6: inconclusive; no post-hoc label; third field size and second seed next.

