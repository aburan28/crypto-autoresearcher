# EXP-ECDLP-65f903
# Rational band and one integer power comparison. No character sums.
# Approved by DEC-20261001-b26fa1.
experiment:
  id: EXP-ECDLP-65f903
  hypothesis_id: H-ECDLP-5b76e2
  source_idea: IDEA-20260920-dd041a
  question_id: RQ-ECDLP-160d89
  version: 1
  title: The exponent band contains 1/5, and 64 squared is below 64 cubed
  status: approved
  frozen: true
  designed_at: '2026-10-01'
  approved_by: coordinator
  approval_decision_id: DEC-20261001-b26fa1
  objective: >-
    Compare 1/6, 1/5, and 1/4 by cross-multiplication. Compare 64 squared
    with 64 cubed. Reject the reversed claim that 1/4 is below 1/6.
  inputs:
    left: "1/6"
    witness: "1/5"
    right: "1/4"
    n: 64
    predicted:
      witness_inside: true
      n_squared: 4096
      n_cubed: 262144
      reversed_below: false
  controls:
    - The reversed comparison is false. Reporting it true invalidates the run.
    - Two arithmetic implementations. They must not import each other.
  independent_variables:
    - implementation
    - comparison in {band, powers, reversed}
  metrics:
    primary:
      - left_below_witness
      - witness_below_right
      - n_squared
      - n_cubed
      - reversed_below
      - implementations_agree
    secondary:
      - cross_products
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two rational inequalities and one integer inequality.
    formula: >-
      a/b < c/d for positive integers when a*d < b*c.
      n^{1/6} < n^{1/4} for n > 1 is equivalent to n^2 < n^3.
    source: >-
      IDEA-20260920-dd041a title band, read 2026-10-01. The products were
      checked by hand in this design session. That check is not a run.
      No key family was enumerated.
  scale_relevance:
    tier: toy
    justification: Three rationals and one integer. No curve and no transfer.
    correspondence: null
  tail_checks:
    - Both products 5*6 and 6*5 are computed. Skipping a cross product is invalid.
  replication:
    seeds: []
    independent_instances: 1
    replication_note: Deterministic. The second run is the other arithmetic.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the reversed comparison is reported true, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either implementation imports the other.
    - reversed_below is true.
    - A spectral norm or a discrete logarithm is reported.
  success_criterion: >-
    Both runs agree, 1/6 is below 1/5, 1/5 is below 1/4, 64 squared is
    4096, 64 cubed is 262144, and the reversed comparison is false.
  falsification_criterion: >-
    The runs agree, the reversed comparison is false, and any band
    inequality fails or the powers differ from 4096 and 262144.
  required_artifacts:
    - experiments/EXP-ECDLP-65f903/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-65f903/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-65f903/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-65f903/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-65f903/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-65f903/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Corpus key families and character sums.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
