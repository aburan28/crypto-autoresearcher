experiment:
  id: EXP-ARGON-8ab44d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7001ed; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7001ed
  question_id: RQ-ARGON-141710
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: The lane's existing graph instrument applied unchanged to scrypt's second-loop access array
    and two forced-answer degenerate designs at matched node and edge counts, with a per-design randomized
    null and a pre-committed cross-design directional prediction
  objective: The one uncertainty a run reduces is whether this lane's graph instrument is measuring
    the structural property its mechanism narrative names, or is merely measuring the difference between
    any real design and its own randomization. (i) The discrimination question is answered by running
    byte-identical measurement code on a second real deployed design whose access structure differs
    from Argon2's in exactly the coordinate the mechanism blames -- window-bounded and recency-concentrated
    versus unbounded and flat -- and comparing each design's signal-minus-null gap rather than its
    raw value, so that support differences cannot masquerade as structure. (ii) The scale question
    is answered by the two degenerate anchors, whose values are forced by independently derived closed
    forms and which place every measured number on a bracketed scale rather than leaving it as a bare
    figure. (iii) The instrument-floor question is answered by the observation that designs with no
    selection freedom have nulls identical to themselves, which sets the smallest gap this instrument
    can report and which no existing contract in this lane has established. The run makes no comparative
    statement about the security of any design, produces no attack, and touches no credential data.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: at the declared matched node
      and edge counts, measured with byte-identical code and the lane''s existing greedy threshold,
      the four designs'' graph functionals and their signal-minus-null gaps take the reported values,
      the two anchors reproduce their closed forms, and the scrypt and Argon2 gaps separate or fail
      to separate by the reported amount at the reported sizes. WHAT DOES NOT FOLLOW: no comparative
      security statement between Argon2 and scrypt in either direction, which the contract forbids;
      nothing about deployed parameters of either design; nothing about the designs as cryptographic
      objects rather than as access arrays; nothing about bcrypt, which is excluded; and no attack
      or adversary advantage of any kind. A failure to separate is a bound on the instrument, not
      a statement that the designs are equivalent.'
  inputs:
    procedure: 'STAGE 0 (cost: possibly the whole budget, and blocking): obtain a primary scrypt specification
      and file it as a KN-LIT record with verified provenance. If this fails, the scrypt arm is reported
      as blocked and the run proceeds with the anchors only; no RECALLED description of scrypt is
      used at any point. STAGE 1 (cost: low, zero compute): derive the closed forms for both degenerate
      anchors by two independent routes and record both derivations. STAGE 2 (cost: low): implement
      the reference-target array builders for all four designs behind one interface, and verify the
      byte-identical-code property by measuring one design through two entry points. STAGE 3 (cost:
      negligible): run the anchors and check against the closed forms; halt on failure. STAGE 4 (cost:
      minutes to an hour): run all designs and twenty null draws each at every matched size through
      the lane''s existing measurement functions. STAGE 5 (cost: negligible): compute signal-minus-null
      gaps and locate the crossover size. STAGE 6 (cost: human time): write the section 8 audit-four
      reading, stating explicitly whether the instrument distinguished the pair and what follows if
      it did not. No attack is implemented anywhere.'
    instrument: Python 3 with numpy for all four reference-target array builders behind one interface;
      the lane's existing greedy depth-reducing-set implementation, exact longest-path DP and two-pass
      live-set accumulator imported unchanged so that the instrument being tested is the instrument
      in use; harness/runner.py for seeding, parameter capture and run manifests; plain JSON serialization
      of every constructed array so any comparison can be re-checked independently without re-running.
      The scrypt second-loop builder is written from a filed primary specification only. No Sage,
      no computer-algebra system, no external implementation of either design linked into the measurement
      path.
    parameters: 'Matched node counts 1024, 2048, 4096, 8192, with edge counts matched by construction
      at one reference edge per block plus the chain. Designs: Argon2i and Argon2id at p=1 and t=1;
      scrypt second loop at reduced N equal to the matched node count; pure sequential chain; reference-block-zero
      degenerate design. Twenty independent draws of each design''s own matched randomized null per
      size. Greedy depth threshold at 50 percent of native depth, matching H-ARGON-ef2f0b''s definition.
      Ten synthetic input draws for the content-dependent arms. All seed material synthetic and generated
      in-run; no password, credential, leaked corpus or third-party dataset at any stage.'
  controls:
  - Pure sequential chain anchor with independently derived closed forms for every reported functional.
  - Reference-block-zero degenerate anchor with its own closed forms at the opposite extreme.
  - A per-design matched randomized null, so that cross-design comparison is on gaps rather than on
    raw values with different supports.
  - Matched node and edge counts across designs, with any unavoidable mismatch reported explicitly.
  - Byte-identical measurement code across all designs, verified by measuring one design through two
    nominally different entry points and checking equality.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The randomized null runs on EVERY object, not only on Argon2 -- that
    is the design''s core requirement. For each of the four designs, a matched randomization is constructed
    that preserves node count, edge count and the design''s own target-eligibility support while destroying
    the selection rule within it: for Argon2 the window-matched uniform null already specified by
    the lane, for scrypt a uniform-over-filled-array null, for the sequential chain a null that is
    identical to it since there is nothing to randomize, and for the degenerate design a null that
    is likewise nearly identical. The nulls for the two anchors being trivially equal to the anchors
    is itself informative and is reported: a design with no selection freedom has no null distinct
    from itself, which sets the floor of what this instrument can detect. For any cross-design comparison
    to mean anything, each design''s own signal-minus-null gap must be reported alongside the raw
    numbers, since comparing raw values across designs with different supports would confound the
    selection rule with the support.'
  independent_variables:
  - design, in {Argon2i, Argon2id, scrypt second loop, sequential chain, reference-block-zero}
  - matched node count, in {1024, 2048, 4096, 8192}
  - arm, in {signal, matched randomized null}
  metrics:
    primary:
    - signal-minus-null gap in depth-reducing-set ratio, per design and size
    - exact live-set integral ratio per design and size, against closed forms for the anchors
    - mean back-distance as a fraction of array size, per design
    - crossover matched size at which the scrypt and Argon2 gaps separate beyond null spread
    secondary:
    - exact native depth per design and size
    - orphan fraction per design and size
    - full back-distance distribution per design
    - byte-identical-code verification result
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The difference between the scrypt second loop's signal-minus-null gap and Argon2's,
      in depth-reducing-set ratio units, at matched node count.
    formula: For design d, gap(d) = |S*_null(d)| median over twenty draws minus |S*_signal(d)|, normalized
      by |S*_null(d)|. Predicted gap(scrypt) <= gap(Argon2) - 0.15 at every matched size at which
      both are measurable. Sequential chain live-set integral ratio forced to exactly 1/n. Predicted
      mean back-distance fraction for scrypt at least twice that of Argon2i.
    source: Pre-registered in the parent proposal IDEA-20260816-7001ed before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Matched node counts of 1024 to 8192, which for Argon2 is one to four binary orders
      below the second RFC 9106 recommended tuple's per-lane block count and for scrypt is far below
      any deployed N. The comparison being made is between two designs at the SAME reduced size, so
      the reduction is common-mode and does not bias the cross-design difference in an obvious direction;
      that said, both designs' access structures are size-dependent -- Argon2's window grows with
      position, scrypt's second loop ranges over the whole array -- so the crossover size is itself
      a reported quantity rather than an artifact to be corrected away. No extrapolation to deployed
      parameters of either design is performed, and the transfer assumption is stated as unresolved
      rather than as benign.
    correspondence: null
  tail_checks:
  - Inspect the largest matched size separately, where the two designs' back-distance profiles diverge
    most and where the greedy heuristic's family-dependent error is largest.
  - Inspect the anchors' measured values digit by digit against their closed forms rather than to
    within a tolerance, since exactness is the entire point of an anchor.
  - Inspect the extreme null draws per design, since a heavy-tailed null distribution would invalidate
    the gap comparison.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Report the scrypt arm as blocked and proceed with anchors only if no primary specification can
    be filed with verified provenance; a blocked arm is an access outcome and is never recorded as
    a negative result about scrypt.
  - Halt if either anchor fails its closed form or the byte-identical-code check fails.
  - Stop and report partial results if wall clock exceeds two hours, recording which sizes completed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both anchors reproduce their closed forms exactly, the byte-identical-code check
    passes, and every available design's functionals and signal-minus-null gaps are reported at every
    matched size with null spreads -- irrespective of whether scrypt and Argon2 separate, and with
    a blocked scrypt arm reported as blocked rather than as absent.
  falsification_criterion:
  - Scrypt and Argon2 gaps coincide within null spread at every matched size, recorded as a bound
    on the instrument under section 8 audit four.
  - Either anchor fails its closed form.
  - Scrypt mean back-distance not at least twice Argon2i's.
  - Byte-identical-code check fails.
  - No primary scrypt specification can be filed, blocking the arm.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7001ed
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The KN-LIT filing for a primary scrypt specification does not exist and is a hard prerequisite;
    the Coordinator must resolve it before approval, and must decide whether a partially available
    specification is admissible.
  - The size-matching rule between a t-pass m-block Argon2 instance and an N-block scrypt instance
    is genuinely ambiguous; the Coordinator must fix one rule, report the alternative, and record
    why.
  - Whether the greedy heuristic's family-dependent approximation error can be bounded without the
    companion exact-DP result is unresolved and is the confounder this design cannot control alone.
  - Whether bcrypt's exclusion should be recorded as a scoped closure with its own obstruction statement,
    rather than as a design judgement inside this record, is a Coordinator call.
