protocol_amendment:
  experiment_id: EXP-IC-002
  version_from: 1
  version_to: 2
  amended_by_task: TASK-20260727-010
  amended_at: '2026-07-27T00:00:00-07:00'
  triggering_review:
    task_id: TASK-20260727-004
    report_id: RT-20260727-001
    verdict: REVISE
    reports:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-004/review_report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-004/adversarial_notes.md
    review_binding_commit: 6e6fd28e5b6c3ae889053212dc8b13d44e5d2677
  supersedes_fields_of:
    document: experiments/EXP-IC-002/specification.yaml
    version: 1
    note: >-
      specification.yaml version 1 is PRESERVED UNCHANGED. This amendment
      supersedes the named fields; it does not overwrite them. The operative
      protocol for TASK-20260727-005 is specification.yaml version 1 AS AMENDED
      by this record. Where the two disagree, this record governs.
  reason: >-
    The independent non-originating design review TASK-20260727-004 returned
    REVISE with five blocking objections. One of them is fatal to execution
    rather than merely to interpretation: the motivating premise of the
    experiment - "No decomposition ever occurred in the 748 runs that
    DEC-20260726-005 used to conclude support" - is FALSE against the very
    records the experiment reuses as inputs. 68 of the 748 committed
    EXP-IC-001 runs carry decomposition_found true, is_trivial_ideal false and
    an independently verified certificate of kind "decomposition". Executed
    exactly as frozen, control CTRL-G ("must reproduce the '0 decompositions'
    recorded across all 748 EXP-IC-001 runs") disagrees at the first 8-bit
    instance and stopping rule 4 ("stop immediately and return the run to the
    Coordinator as a source-integrity failure rather than continuing") halts
    the primary arm at instance 1 of 34. The frozen protocol cannot proceed
    unchanged: it would produce no primary result at all. This amendment
    replaces the false premise with the verified per-instance record, repairs
    two metric definitions that contradict their own stated semantics on 7 of
    34 instances, adds the multi-target baselines the experiment lacked, and
    tightens one invalidation threshold that is not tight.
  what_the_correction_does_not_do: >-
    The correction does NOT rescue the DEC-20260726-005 crossover and is not
    favourable to the confound claim in the decision-bearing regime. Every
    instance with field_bits >= 20 - which includes every instance with
    N >= 1e9 and all four headline instances DEC-20260726-005 rests on (36-bit
    seeds 2, 5, 10, 11) - genuinely has 0 decompositions. What the correction
    removes is the false absolute framing; what it supplies is the per-instance
    yield record the design said it lacked.

  confirmatory_status: exploratory_only
  confirmatory_status_justification: >-
    docs/task-lifecycle.md section 5: "Protocol changes after approval require
    a versioned amendment. Exploratory changes must be labeled exploratory and
    cannot be evaluated against the original confirmatory criterion." Three
    independent reasons force exploratory_only here, and `preserved` is not
    available for any of them.
    (1) This revision follows an ADVERSE review verdict. It is not the
    pre-execution repair of an unreviewed draft.
    (2) Substantively: the corrected CTRL-G expectation table and the corrected
    SC2 second clause are written FROM observations that already exist in the
    committed EXP-IC-001 run records this experiment reuses as inputs. A
    criterion set to match observations that already exist cannot be evaluated
    as a pre-registration against those same observations, whatever the
    intention. That is exactly the defect RT-20260727-001 adjudicated in
    EXP-IC-001's v2_to_v3 amendment, and EXP-IC-002's own amendment_policy
    states that this rule exists to prevent repeating it silently.
    (3) SC1's disposition rule and the SC4 secondary statistic added below
    change how criterion outcomes are read.
    Consequence, binding on every downstream record: NO EXP-IC-002 result may
    be reported as satisfying a confirmatory pre-registered criterion. SC1-SC4
    are exploratory criteria under this amendment. EV-IC-002 must record
    confirmatory_status exploratory_only for the SC verdicts and must not
    describe any of them as "SUCCESS CRITERION MET" in the confirmatory sense.
  contrast_with_v1_of_EXP_IC_001: >-
    EXP-IC-001's amendments/v1_to_v2.yaml recorded confirmatory_status
    preserved defensibly: it repaired five blocking review objections before
    execution with no outcome observed. That precedent does NOT extend here,
    because reasons (2) and (3) above involve observations that already exist
    in this experiment's own input set.

  affected_runs: []
  affected_runs_note: >-
    No EXP-IC-002 run exists at the time of this amendment. All four declared
    arms (RUN-IC-002-YIELD-EXACT-001, RUN-IC-002-CTRL-TRUTH-001,
    RUN-IC-002-CTRL-SCALING-001, RUN-IC-002-CTRL-CALIB-001) are unexecuted, so
    the list is empty as a matter of fact and not as a matter of convenience.
    This amendment retroactively alters no raw run record. The 748 EXP-IC-001
    runs are read-only inputs; none is modified, and no EXP-IC-001 artifact is
    touched by this amendment.

  verified_source_record:
    status: >-
      This block is a CENSUS READ FROM COMMITTED RECORDS, not a measurement
      produced by this experiment and not an assertion of this amendment. It
      was read independently twice: by TASK-20260727-004 (RT-20260727-001, all
      748 experiments/EXP-IC-001/runs/*/raw-result.json at commit 6e6fd28e) and
      by the dispatching orchestrator (same 748 files, aggregated by
      metrics.mode and metrics.field_bits). The two readings agree. CTRL-G
      re-derives it a third time at run time; a disagreement is an observation
      about source reproducibility and is dispositioned below.
    totals:
      runs: 748
      runs_with_decomposition_found_true: 68
      runs_with_trivial_ideal: 612
      certificate_kind_census: {none: 646, decomposition: 68, discrete_log: 34}
    reconciliation: >-
      34 instances x 10 targets x 2 modes = 680 decomposition-mode runs, of
      which 68 decomposed and 612 solved trivial ideals. The remaining 68 runs
      are the 34 matched rho runs (certificate kind discrete_log) and the 34
      fixed_precompute runs (certificate kind none); neither is a Groebner
      solve, which is why they contribute 0 decompositions and 0 trivial
      ideals. 612 + 34 = 646 certificates of kind none. 680 + 68 = 748.
    by_field_bits:
      - {field_bits: 8,  runs: 60,  decompositions: 56, fixed_mode: 28, naive_mode: 28, trivial_ideals: 4}
      - {field_bits: 12, runs: 60,  decompositions: 10, fixed_mode: 5,  naive_mode: 5,  trivial_ideals: 50}
      - {field_bits: 16, runs: 60,  decompositions: 2,  fixed_mode: 1,  naive_mode: 1,  trivial_ideals: 58}
      - {field_bits: 20, runs: 60,  decompositions: 0,  fixed_mode: 0,  naive_mode: 0,  trivial_ideals: 60}
      - {field_bits: 24, runs: 60,  decompositions: 0,  fixed_mode: 0,  naive_mode: 0,  trivial_ideals: 60}
      - {field_bits: 28, runs: 60,  decompositions: 0,  fixed_mode: 0,  naive_mode: 0,  trivial_ideals: 60}
      - {field_bits: 32, runs: 60,  decompositions: 0,  fixed_mode: 0,  naive_mode: 0,  trivial_ideals: 60}
      - {field_bits: 36, runs: 260, decompositions: 0,  fixed_mode: 0,  naive_mode: 0,  trivial_ideals: 260}
      - {field_bits: null, mode: "None / fixed_precompute", runs: 68, decompositions: 0, trivial_ideals: 0}
    zero_decomposition_regime: >-
      0 decompositions across all 500 runs at field_bits >= 20 (250 fixed-mode
      + 250 naive-mode: 4 bit sizes x 3 seeds x 10 targets x 2 modes = 240, plus
      13 seeds x 10 targets x 2 modes = 260 at 36-bit), and 0 across the 68
      runs with no field_bits. Every instance with N >= 1e9 lies inside
      field_bits >= 20, so the zero-decomposition confound survives intact
      across the entire decision-bearing regime. The premise is false only as
      an ABSOLUTE statement about all 748 runs.
    fixed_mode_per_instance_expectation:
      units: "decomposed targets out of the 10 committed fixed-mode targets of that instance"
      provenance: "RT-20260727-001 per-instance read; sums to the 34 fixed-mode decompositions in the orchestrator census (28 + 5 + 1)"
      table:
        - {field_bits: 8,  seed: 1, N: 23,   expected_decompositions: 9}
        - {field_bits: 8,  seed: 2, N: 41,   expected_decompositions: 9}
        - {field_bits: 8,  seed: 3, N: 5,    expected_decompositions: 10}
        - {field_bits: 12, seed: 1, N: 31,   expected_decompositions: 1}
        - {field_bits: 12, seed: 2, N: 37,   expected_decompositions: 2}
        - {field_bits: 12, seed: 3, N: 2377, expected_decompositions: 2}
        - {field_bits: 16, seed: 3, N: 479,  expected_decompositions: 1}
      all_other_instances: >-
        The remaining 27 of the 34 instances have expected_decompositions 0,
        including 36-bit seeds 2, 5, 10 and 11.
      naive_mode_attribution: >-
        The naive-mode aggregate per bit size (28 at 8-bit, 5 at 12-bit, 1 at
        16-bit) is verified by the orchestrator census. The naive-mode
        PER-INSTANCE attribution is NOT independently verified in this record
        and is not asserted. CTRL-G operates on the fixed-mode targets, which
        is what the reuse contract reads; the Executor reports the naive-mode
        per-instance counts as an observation without a pre-registered
        expectation.
    what_the_committed_ledger_says_instead:
      false_as_written:
        - "ledger/evidence/EV-IC-001.yaml: certificate_refs and boundaries - 'all Groebner solves on trivial ideals (no decompositions)'"
        - "ledger/decisions/DEC-20260726-005.yaml limitations - 'all Groebner solves on trivial ideals'"
        - "experiments/EXP-IC-001/analysis.md - 'all Groebner solves return trivial ideals (no decompositions)'"
        - "coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/dispatch_queue.json objective and batch_opening_decision rationale"
        - "ledger/goals/GOAL-ECDLP-001.yaml integrity note INT-BATCH006-003"
        - "experiments/EXP-IC-002/specification.yaml version 1 objective"
      correct_restatement: >-
        "All Groebner solves at field_bits >= 20 ran on trivial ideals; no
        decomposition occurred at any instance with N >= 1e9, including the
        four instances DEC-20260726-005 rests on. 68 of the 748 runs, at 7 of
        the 34 instances with N between 5 and 2377, did decompose with verified
        certificates."
      correction_is_not_authorized_here: >-
        EV-IC-001, DEC-20260726-005 and EXP-IC-001/analysis.md are immutable
        and committed. This amendment corrects only EXP-IC-002's own protocol.
        Correcting the immutable records is a SUPERSEDING-RECORD action for the
        Coordinator at TASK-20260727-009 (see that task card, which now carries
        it as a required deliverable), using the ledger/corrections/CORR-* form
        already established by CORR-20260724-001. INT-BATCH006-003 lives in the
        living goal record and is corrected in place there. Nothing in this
        amendment edits any of them.

  changes:
    - >-
      R1 (repairs BO-1). PREMISE AND CTRL-G. The absolute zero-decomposition
      premise is struck from the objective, from
      counting_derivation.contrast_with_ev_ic_001, from CTRL-G, from
      success_criterion SC2 and from alternative_outcome A1, and replaced by
      the verified_source_record block above. CTRL-G's expectation becomes the
      per-instance table, not "0 decompositions". Stopping rule 4 is rewritten
      so a legitimate reproduced decomposition at 8-16 bits does not halt the
      primary arm. See revised_fields.ctrl_g, revised_fields.stopping_rule_4
      and revised_fields.alternative_outcome_A1.
    - >-
      R2 (repairs BO-2). FALSIFIER F2 IS RECORDED UNREACHABLE AT N >= 1e9. F2
      fires iff at least one committed target at such an instance lies in S,
      which is iff CTRL-G disagrees there, which is routed to a source-
      reproducibility disposition rather than to an interpretation. The two are
      the same event and the frozen protocol assigned them contradictory
      dispositions. F2 is therefore demoted from the falsification criterion at
      N >= 1e9 and retained as a declared-unreachable falsifier with its one
      residual route named. See revised_fields.falsification_criterion and
      f2_reachability.
    - >-
      R3 (repairs BO-3). METRIC SEMANTICS. p_dec_counting_bound is capped at 1
      and t_desc_charged_lower_bound_gops is floored at T_attempt_gops. On the
      committed instances with N < 392 the v1 definitions produce a
      "probability" above 1 and a "lower bound on the charged cost" BELOW the
      cost of a single attempt, contradicting their own stated semantics, and
      those values were then fed to the SC4 statistic. See
      revised_fields.metric_definitions.
    - >-
      R4 (repairs BO-4). CTRL-E2 ADDED: the two multi-target baselines. CTRL-E
      supplies Pollard rho and BSGS, both single-target, while H-IC-001 is a
      fixed-curve K-target amortization claim. CTRL-E2 adds the exhaustive
      discrete-log table and the S*T^2 = Theta~(N) preprocessing frontier at
      S = T = N^(1/3), both closed form per instance in the same
      group-operation unit. Zero new runs, zero new implementation, no
      dependence on the yield model. See revised_fields.ctrl_e2.
    - >-
      R5 (repairs BO-5). REACHABLE-SET INVALIDATION THRESHOLD TIGHTENED FROM
      420 TO 392. For the 14 diagonal pairs i = j the four sign combinations
      give {2A_i, O, O, -2A_i}, at most 2 distinct non-identity points once the
      point at infinity is dropped, not 4. Hence 420 - 14*2 = 392 =
      4*C(14,2) + 2*14. Any measured |S| in [393, 420] is necessarily an
      implementation defect and the v1 rule would have passed it. 420 is
      retained as the loose derivation bound and still reported; min(392,
      #E - 1) is recorded as the binding constraint, which is what actually
      binds at 8-bit. |S| is still measured exactly. See
      revised_fields.reachable_set_bound and revised_fields.success_criterion.

  revised_fields:

    objective_premise_clause:
      v1_text: >-
        "No decomposition ever occurred in the 748 runs that DEC-20260726-005
        used to conclude support."
      v2_text: >-
        "No decomposition occurred at any instance with N >= 1e9, including the
        four instances DEC-20260726-005 rests on (36-bit seeds 2, 5, 10, 11):
        0 decompositions across all 500 committed runs at field_bits >= 20. 68
        of the 748 runs, at 7 of the 34 instances with N between 5 and 2377,
        did decompose, with independently verified certificates. The confound
        DEC-20260726-005 inherits is therefore intact across the entire
        decision-bearing regime, and the per-instance decomposition record
        supplies the yield observation the design said it lacked."
      every_other_clause_of_the_objective: unchanged

    contrast_with_ev_ic_001:
      v2_text: >-
        EV-IC-001 reports T_desc flat at ~32,000-35,000 group-op equivalents
        across 8-36 bits and a ratio falling 300x. A cost that does not grow
        with field size is the documented diagnostic of measuring factor-base
        enumeration rather than decomposition. EV-IC-001 additionally records,
        in its own boundaries block, that all Groebner solves ran on trivial
        ideals; that statement is true at field_bits >= 20 and false as an
        absolute statement about the 748 runs (verified_source_record above).
        This experiment tests the diagnosis by measurement rather than by
        assertion, and its CTRL-G arm additionally measures whether the
        committed per-instance decomposition record reproduces.

    ctrl_g:
      title: CTRL-G source-agreement control (v2)
      v2_text: >-
        Recompute decomposition status for the exact 10 committed EXP-IC-001
        fixed-mode targets of every one of the 34 instances, using the same
        harness/semaev.py::_find_decomposition code path on the same frozen
        factor base. The EXPECTATION is the per-instance table in
        verified_source_record.fixed_mode_per_instance_expectation - 9, 9, 10,
        1, 2, 2, 1 decomposed targets at (bits, seed) = (8,1), (8,2), (8,3),
        (12,1), (12,2), (12,3), (16,3) respectively, and 0 at each of the other
        27 instances. It is NOT "0 decompositions". Every decomposition
        reproduced must emit a certificate of kind "decomposition" for
        independent re-verification by the run wrapper.
      disposition_rules:
        - "G-a AGREEMENT: the reproduced count equals the expected count at all 34 instances. CTRL-G PASS. Continue."
        - >-
          G-b LOCAL DISAGREEMENT: the reproduced count differs from the
          expectation at 1 to 7 instances. Record the complete per-instance
          disagreement table with certificates, CONTINUE the arm to completion,
          and report CTRL-G as DISAGREEMENT with the affected instances named.
          Do not halt. A local disagreement is an observation about the
          reproducibility of the committed EXP-IC-001 record; it is neither an
          automatic source-integrity failure nor evidence about H-IC-001, and
          it is adjudicated by the Coordinator and the independent reviews, not
          by the Executor.
        - >-
          G-c SYSTEMATIC DISAGREEMENT: the reproduced count differs at more
          than 7 instances - more instances than have a nonzero expectation, so
          the reuse contract rather than a single instance is implicated. Halt
          the arm, report the complete table, and return the run to the
          Coordinator as a source-integrity failure. This is the only remaining
          halt route for CTRL-G.
        - >-
          G-d REUSE-CONTRACT FAILURE (unchanged from v1, still a halt): a
          factor base not byte-identical across the 10 fixed-mode runs of an
          instance, or a reproduced T_attempt_gops outside the 1% tolerance.
          These remain invalidation rules and are unaffected by R1.
      why_the_halt_had_to_move: >-
        Under v1, CTRL-G's expectation was factually wrong at 7 instances, so
        stopping rule 4 would have fired at instance 1 of 34 with the run
        producing nothing. Under v2 the halt fires only where a halt is
        actually warranted: a systematic failure of the reuse contract.

    stopping_rule_4:
      v1_text: >-
        "If CTRL-G disagrees with the committed EXP-IC-001 decomposition record
        at any instance, stop immediately and return the run to the Coordinator
        as a source-integrity failure rather than continuing."
      v2_text: >-
        "If CTRL-G disagrees with the per-instance expectation table at 1 to 7
        instances, record the disagreement with certificates and continue the
        arm to completion (disposition G-b). Halt and return the run to the
        Coordinator as a source-integrity failure only under disposition G-c
        (disagreement at more than 7 instances) or G-d (reuse-contract
        failure)."
      stopping_rules_1_2_3: unchanged

    alternative_outcome_A1:
      v1_text: >-
        "(A1) If |S intersect <P>| = 0 at every instance, then
        p_dec_exact_subgroup is exactly 0 and no target in the subgroup can
        decompose over the frozen factor base at all. This is stronger than the
        stated claim - it means the source experiment never performed a
        descent, only a failed attempt - and must be reported as such [...]"
      v2_text: >-
        "(A1) If |S intersect <P>| = 0 at an instance, then
        p_dec_exact_subgroup is exactly 0 there and no target in that subgroup
        can decompose over the frozen factor base at all. Scope: this reading
        applies ONLY to the instances where it is actually observed, and the
        committed record already establishes that it cannot hold at the 7
        instances with N <= 2377, where 34 fixed-mode decompositions occurred
        with verified certificates. The statement 'the source experiment never
        performed a descent, only a failed attempt' is therefore SCOPED TO
        N >= 1e9 (equivalently, to instances with field_bits >= 20, where the
        committed record shows 0 decompositions in 500 runs) and is false as a
        global statement. The counting-bound variant supplies the finite series
        for SC4. It is not a falsification."
      alternative_outcome_A2: unchanged

    metric_definitions:
      p_dec_counting_bound:
        v1: "|S| / N"
        v2: "min(1, |S| / N)"
        also_report: "the uncapped raw ratio |S| / N, and a per-instance boolean cap_bound indicating whether the cap changed the value"
        reason: >-
          |S|/N exceeds 1 whenever N < |S| and is then not a probability. The
          quantity is used as a bound on P_dec, and no probability exceeds 1.
      t_desc_charged_lower_bound_gops:
        v1: "T_attempt_gops * N / |S|"
        v2: "T_attempt_gops * max(1, N / |S|)"
        also_report: "the unfloored raw value, and a per-instance boolean floor_bound indicating whether the floor changed the value"
        reason: >-
          The true expected charged cost is T_attempt / P_dec, which is at
          least T_attempt for every P_dec <= 1. The v1 expression falls BELOW
          T_attempt whenever N < |S| and is then not a lower bound on anything.
          At N = 5 it undershoots by roughly two orders of magnitude.
      charged_ratio_lower_bound:
        v2: "t_desc_charged_lower_bound_gops (as repaired) / sqrt(N)"
        note: "the repaired metric is what feeds SC4"
      instances_that_can_be_affected:
        criterion: "instances with N < 392, since |S| <= min(392, #E - 1)"
        committed_list:
          - {field_bits: 8,  seed: 3, N: 5}
          - {field_bits: 8,  seed: 1, N: 23}
          - {field_bits: 16, seed: 1, N: 23}
          - {field_bits: 12, seed: 1, N: 31}
          - {field_bits: 12, seed: 2, N: 37}
          - {field_bits: 8,  seed: 2, N: 41}
          - {field_bits: 24, seed: 3, N: 349}
        note: >-
          These 7 of 34 instances are the ones that CAN be affected. Whether
          the cap or the floor actually binds at each is determined by the
          MEASURED |S| at that instance, not by the bound; the Executor reports
          cap_bound and floor_bound per instance rather than assuming.
      direction_of_the_repair: >-
        The repair is ADVERSE to SC4, not favourable. Flooring at T_attempt
        makes charged_ratio_lower_bound equal T_attempt/sqrt(N) at the floored
        instances, which DECREASES in N, while at unfloored instances it equals
        T_attempt*sqrt(N)/|S|, which increases in N. The repaired series is
        therefore non-monotone at the low-N end and the SC4 Spearman statistic
        can only fall or stay equal relative to the unrepaired metric. The
        SC4 thresholds are NOT relaxed to compensate.
      sc4_secondary_statistic_preregistered_here: >-
        Declared before execution: in addition to the SC4 statistic over all 34
        instances on the repaired metric, report the same Spearman statistic
        restricted to the 27 instances with N >= 392, where no floor binds, and
        report the SC4 statistic on the UNREPAIRED v1 metric as a third
        diagnostic. The restricted statistic and the unrepaired statistic are
        DIAGNOSTICS ONLY. Neither may substitute for SC4 and neither may be
        used to rescue an SC4 failure. SC4's verdict is the 34-instance
        repaired-metric statistic at the unchanged thresholds (Spearman >= 0.9
        and largest-N over smallest-N >= 10x).

    reachable_set_bound:
      tight_maximum: 392
      derivation: >-
        S = { s1*A_i + s2*A_j : 1 <= i <= j <= B, s1, s2 in {+1,-1} } with the
        point at infinity dropped. For the C(14,2) = 91 off-diagonal pairs all
        four sign combinations can be distinct: at most 4*91 = 364 points. For
        the 14 diagonal pairs i = j the four combinations give
        {2A_i, O, O, -2A_i}: at most 2 distinct non-identity points, so at most
        2*14 = 28. Total |S| <= 364 + 28 = 392 = 420 - 14*2.
      loose_bound_retained: >-
        4*(C(14,2)+14) = 420 remains reported alongside |S| as the loose
        derivation bound stated in v1, so the v1 arithmetic stays auditable.
      invalidation_threshold:
        v1: "a measured |S| exceeding 420 is an implementation defect; the run is invalid"
        v2: "a measured |S| exceeding 392 is an implementation defect; the run is invalid. Every value in [393, 420] is necessarily defective and the v1 rule would have passed it."
      second_binding_constraint: >-
        |S| <= min(392, #E - 1). At the 8-bit instances the committed primes
        are p = 137, 163 and 241, so #E is roughly 115-273 and the curve-order
        term binds, not 392. The Executor reports min(392, #E - 1) per instance
        alongside |S| and the loose bound 420.
      direction_of_the_v1_error: >-
        420 > 392 OVERSTATES the reachable set, hence overstates the yield
        bound |S|/N by at most 7.1% and understates the charged-cost lower
        bound by at most 6.7%. That is the conservative direction: it biases
        the test AGAINST the confound claim, exactly as v1 asserted. The
        correction is real but immaterial against the effect sizes at stake.
        It is made because an invalidation rule that cannot catch the defect it
        names is not a control.

    success_criterion:
      status_note: >-
        SC1-SC4 are EXPLORATORY criteria under this amendment (see
        confirmatory_status). No verdict on them may be reported as a
        confirmatory result.
      SC1_v2: >-
        The measured |S| <= min(392, #E - 1) at every instance, and |S| does
        not grow with N: max |S| over the 8-bit instances and over the 36-bit
        instances differ by less than 2x.
      SC1_disposition_rule_new: >-
        Declared before execution. SC1's second clause is at risk of failing
        for a reason unrelated to the claim: at 8-bit the binding constraint is
        #E - 1 (roughly 115-273), not 392, so the ratio sits close to the 2x
        threshold on either side by pigeonhole, not by anything about the
        reachable set. If SC1's second clause fails WHILE the measured |S| is
        within a factor 2 of its own binding constraint min(392, #E - 1) at
        every instance, the failure is recorded as a pigeonhole artifact of the
        8-bit curve orders, SC1 is reported INCONCLUSIVE on that clause, and it
        is NOT read as a falsification of the counting derivation. If |S| is
        NOT within a factor 2 of its own binding constraint somewhere, the
        clause fails outright. This rule is a disposition, not a relaxation of
        a threshold; both branches are stated before any observation exists.
      SC2_v2: >-
        p_dec_exact_subgroup <= p_dec_counting_bound = min(1, |S|/N) at every
        instance, AND p_dec_target_set_empirical = 0 at every instance with
        field_bits >= 20 (which includes every instance with N >= 1e9 and all
        four headline instances), AND p_dec_target_set_empirical reproduces the
        verified per-instance table exactly at the 7 instances with a nonzero
        expectation.
      SC2_empirical_content_note: >-
        The second clause of SC2 is a REPRODUCTION of a fact already recorded
        in the committed EXP-IC-001 run records (0 decompositions across the
        500 runs at field_bits >= 20), recomputed through the same
        _find_decomposition code path that produced the record. It must be
        reported as reproduction, never as measurement. This extends v1's
        empirical_content_disclosure, which disclosed SC3 and SC4 as arithmetic
        but stopped short of SC2's second clause.
      SC3_v2: unchanged
      SC4_v2: >-
        Unchanged thresholds (Spearman >= 0.9 between log N and
        log(charged_ratio_lower_bound) over all 34 instances; largest-N
        instance exceeds smallest-N instance by at least 10x), computed on the
        REPAIRED metric of R3, with the two pre-registered diagnostics above
        reported beside it and forbidden from substituting for it.

    falsification_criterion:
      F1_v2: >-
        Measured |S| exceeds 392 at any instance under a correct
        implementation, i.e. the reachable set is not the one the counting
        derivation describes. (Threshold tightened from 420 by R5. F1 remains
        definitionally near-unreachable because the same event is also an
        invalidation rule; that tension is inherent to a combinatorial bound
        and is disclosed rather than resolved.)
      F2_v2: >-
        RECORDED UNREACHABLE AT N >= 1e9 AND DEMOTED THERE. See f2_reachability
        below. F2 is retained only at the 7 instances with N <= 2377, where its
        firing carries no information about the four instances
        DEC-20260726-005 rests on. A positive p_dec_target_set_empirical at an
        instance with N >= 1e9 is dispositioned by f2_reachability.disposition
        and may NOT be reported as "the confound claim is wrong" without
        satisfying that disposition.
      F3_v2: >-
        Unchanged in form; evaluated on the repaired SC4 metric. An F3 firing
        that is attributable to the R3 floor at the 7 low-N instances must be
        reported as such, with the pre-registered restricted statistic shown
        beside it and explicitly not substituted for it.
      F4_v2: unchanged

    ctrl_e2:
      title: "CTRL-E2 matched MULTI-TARGET baselines (new, blocking, zero runs, zero new implementation)"
      motivation: >-
        CTRL-E supplies matched Pollard rho and BSGS. Both are SINGLE-TARGET
        algorithms. H-IC-001 is a fixed-curve, K-target amortization claim, so
        the closest specialized baselines are multi-target ones. Omitting them
        lets a "crossover" against single-target algorithms stand as if it were
        cryptanalytically meaningful. CTRL-E2 does not depend on the yield
        model at all, so it is immune to every implementation objection the
        yield charge inherits.
      E2a_exhaustive_discrete_log_table:
        construction: >-
          Precompute all N multiples of P: N - 1 group additions offline, N
          stored group elements. Each subsequent target is a table lookup: 0
          group operations online.
        report_per_instance:
          - "offline_group_operations = N - 1"
          - "memory_elements = N"
          - "per_target_group_operations = 0"
          - "ratio_offline = s_rel_frozen / (N - 1), where s_rel_frozen is the exact committed EXP-IC-001 (N/B)*T_attempt_gops"
          - "ratio_per_target = (T_attempt_gops + T_verify_frozen) / 1, reported against the exhaustive table's 0 with the division-by-zero stated rather than evaluated"
        derivation_note: >-
          S_rel/N = T_attempt_gops/B is INDEPENDENT of N. At B = 14 this is
          T_attempt_gops/14 for every one of the 34 instances.
        coordinator_cross_check: >-
          Re-verified by the dispatching orchestrator from the committed
          EXP-IC-001 analysis table at the 36-bit seed-2 headline instance:
          T_desc_gops = 32021, so S_rel/N = 32021/14 = 2287. This is a
          CROSS-CHECK for the Executor's independent recomputation, not an
          input. The Executor computes the ratio per instance from the
          committed numbers and reports its own values; a disagreement with
          2287 at that instance is an observation to report, not to reconcile
          silently.
      E2b_generic_preprocessing_frontier:
        source: >-
          knowledge/literature/KN-LIT-013.md (Corrigan-Gibbs and Kogan,
          EUROCRYPT 2018): S*T^2 = Omega~(eps*N), with the bound essentially
          tight via a matching generic algorithm. Restated in
          knowledge/techniques/KN-TECH-005.md. H-IC-001's own assumptions name
          this as the correct reference frontier. Both files exist at this
          commit and were read.
        instantiation: >-
          Balance at S = T = N^(1/3): advice S = ceil(N^(1/3)) stored elements,
          online cost T = ceil(N^(1/3)) group operations per target.
        report_per_instance:
          - "n_cbrt = the exact integer cube root of N, computed exactly (integer arithmetic, no floating-point rounding) and recorded"
          - "advice_elements = n_cbrt"
          - "per_target_group_operations = n_cbrt"
          - "ratio_per_target = T_attempt_gops / n_cbrt"
          - >-
            k_star_vs_frontier = ceil((S_rel_frozen + S_LA_frozen) /
            (n_cbrt - T_attempt_gops - T_verify_frozen)) when the denominator
            is strictly positive, otherwise the literal string "infinity" -
            the committed K* formula with the multi-target frontier
            substituted for sqrt(N), everything else frozen
        coordinator_cross_check: >-
          At the 36-bit seed-2 headline instance N = 33766959953 and
          T_desc_gops = 32021, giving ratio_per_target approximately 9.9x.
          UNRESOLVED IN THIS DESIGN RECORD: RT-20260727-001 reports
          N^(1/3) = 3232 and the dispatching orchestrator reports 3240. Both
          give 9.9x to two significant figures, and this amendment does not
          adjudicate between them. The Executor computes the exact integer cube
          root and records it; neither 3232 nor 3240 is an input to anything.
      honest_caveats_to_be_reported_verbatim:
        - >-
          E2b compares ONLINE cost and ADVICE SIZE only. The Corrigan-Gibbs and
          Kogan offline phase is unbounded, so this is not an offline-time
          comparison. E2a has a fully explicit offline cost and already
          suffices for the offline comparison.
        - >-
          CTRL-E2 is a CLOSED-FORM COMPARISON on committed numbers, not a
          measurement. It must be reported as derivation, never as
          measurement, under the same rule as v1's
          empirical_content_disclosure.
        - >-
          Neither baseline is evidence about index calculus in general, about
          any other (B, m), about other solvers, or about ECDLP at any deployed
          parameter size. Both are baselines for the exact multi-target claim
          H-IC-001 states on a fixed curve at these 34 toy instances.
        - >-
          A K* that is finite against a single-target baseline and infinite
          against a multi-target baseline is a statement about which baseline
          the claim was compared to, not a new mathematical fact.
      disposition: >-
        CTRL-E2 has NO pass/fail verdict of its own and enters NO success or
        falsification criterion. Adding a criterion whose outcome is
        arithmetically forced by committed numbers is precisely the defect this
        batch exists to correct, and CTRL-E2's content is arithmetic. It is a
        baseline REPORT: per-instance rows in observations.md, carried into the
        Coordinator analysis at TASK-20260727-009 and into the independent
        reviews. The Executor states no inference from it.
      cost: "Zero new runs, zero new implementation, no new instance, no new timing. Folded into the primary arm RUN-IC-002-YIELD-EXACT-001."

  f2_reachability:
    statement: >-
      F2 is UNREACHABLE at every instance with N >= 1e9, by construction and
      not by assumption.
    argument:
      - >-
        F2 fires iff p_dec_target_set_empirical > 1e-2 at an instance with
        N >= 1e9, i.e. iff at least one of the 10 committed fixed-mode targets
        at such an instance lies in S.
      - >-
        A committed target lies in S iff _find_decomposition returns True on
        it, which is exactly what CTRL-G recomputes. So "F2 fires" and "CTRL-G
        disagrees at an instance with N >= 1e9" are the SAME EVENT. v1 assigned
        them contradictory dispositions: F2 said the confound claim is wrong
        and H-IC-001 stands; stopping rule 4 said do not interpret it at all.
      - >-
        The committed record shows 0 decompositions across all 500 runs at
        field_bits >= 20, and every instance with N >= 1e9 lies inside that
        set. _find_decomposition on frozen inputs is deterministic. Re-running
        it must therefore reproduce 0 at every such instance.
      - >-
        Consequently F2 has no reachable route at N >= 1e9 through the
        experiment's own primary code path.
    residual_route: >-
      Exactly one crack remains, and it is an instrumentation route, not a
      mathematical one. _find_decomposition gates its sign search behind
      `if s3_eval(a, b, v1, v2, xR, p) != 0: continue`. If that pre-filter were
      INCOMPLETE, a target could lie in S per the direct enumeration in
      harness/ic_yield.py while _find_decomposition reported False in both
      EXP-IC-001 and CTRL-G. The filter is believed complete because S3
      vanishing is a NECESSARY condition for s1*A_i + s2*A_j = +/- R and S is
      closed under global negation, so the filter cannot reject a true hit -
      but that is a derivation stated here (heuristic H3 below), not a checked
      fact, and no control in this protocol tests it.
    direction_of_the_residual_route: >-
      CONSERVATIVE for the confound claim. If s3_eval were incomplete, the
      harness's effective reachable set is a PROPER SUBSET of S, so the true
      yield is lower and the true charged cost is LARGER than this experiment
      reports.
    disposition: >-
      If p_dec_target_set_empirical > 0 at any instance with N >= 1e9, the
      Executor must record it, emit the certificate, continue, and classify it
      into exactly one of: (i) the direct ic_yield.py enumeration finds the
      target in S while _find_decomposition does not - an s3_eval
      filter-incompleteness finding, conservative in direction; (ii) both find
      it, contradicting the committed raw record - a source-reproducibility
      finding about EXP-IC-001; (iii) neither of the above. Only case (iii)
      would be F2 in the sense v1 labelled it. The Executor records the
      classification as an observation and states no inference; the Coordinator
      and the independent reviews adjudicate.
    empirical_content_confined_to: >-
      With F2 demoted at N >= 1e9, the genuinely NEW empirical content of
      EXP-IC-002 is: (a) the exact measured |S| per instance against 392 and
      against min(392, #E - 1); (b) the exact measured |S intersect <P>| per
      instance; (c) the reproducibility of the committed per-instance
      decomposition table (CTRL-G); (d) the naive-mode per-instance
      decomposition counts, for which no expectation is pre-registered; and (e)
      the trivial versus non-trivial Groebner cost comparison added below.
      Everything else follows arithmetically from those plus committed numbers.
      At the four instances DEC-20260726-005 actually rests on, the experiment
      has NO reachable falsifier, and that is now stated in the record before
      execution rather than discovered after it.

  numbered_heuristics:
    note: >-
      v1 carried these as implicit assumptions. Numbering them costs nothing
      and is required discipline for any conditional dependence. None of them
      is validated by this experiment; each is stated with its status and its
      direction.
    items:
    - id: H1
      statement: "The 10 committed EXP-IC-001 targets per instance are effectively uniform draws from <P>."
      status: FALSE_AS_STATED
      evidence: >-
        EXP-IC-001's _derive_targets computes k = ((idx+1)*stride) mod (n-1)+1,
        a deterministic stride sequence. RT-20260727-001 reports that at
        (8, seed 3) with N = 5 the ten committed target_k values are
        3,1,3,1,3,1,3,1,3,1 - two distinct targets repeated five times.
      required_reporting: >-
        Report the effective DISTINCT-target count per instance beside
        p_dec_target_set_empirical. A denominator of 10 is not the effective
        sample size at degenerate instances.
    - id: H2
      statement: "S behaves like a uniform random subset of E when intersected with <P>."
      status: SUPPORTED_AT_LOW_N_UNTESTABLE_AT_HIGH_N
      note: >-
        The committed per-instance decomposition yields are consistent with the
        counting model applied to the full curve group at the 7 low-N
        instances. At N >= 1e9 the heuristic is untestable here: 10 targets
        cannot resolve a yield of order 1e-8. SC2 must therefore not be read as
        a measurement of the yield at those instances.
      validation_not_performed: >-
        The cheapest check - comparing measured |S| against the random-subset
        prediction #E*(1 - exp(-392/#E)) at 8-bit and 12-bit, where #E is small
        enough for the two to differ measurably - is NOT added by this
        amendment (see declined_objections).
    - id: H3
      statement: "The s3_eval pre-filter in _find_decomposition is complete: it never rejects a true hit."
      status: PROVABLE_UNPROVED_UNTESTED
      derivation_sketch: >-
        S3(v1, v2, x(R)) = 0 is a necessary condition for points with those
        three x-coordinates to sum to O, and S is closed under global negation,
        so the filter cannot reject a true hit.
      direction_if_false: "conservative - the effective reachable set shrinks, the true charged cost grows"
      consequence: >-
        H3 is the sole residual route to F2 at N >= 1e9. It is unvalidated in
        this protocol and that is disclosed rather than repaired.

  zero_cost_reporting_repairs:
    note: >-
      These go BEYOND the five directed repairs. Each costs zero runs and zero
      new computation beyond records the Executor already reads, and each
      exists to prevent a number being reported as something it is not. They
      are listed separately so the re-review (TASK-20260727-012) can adjudicate
      them independently of R1-R5.
    items:
    - id: Z1
      target: CTRL-D
      change: >-
        RELABEL CTRL-D as an ALGEBRAIC IDENTITY CHECK, not a control. v1 states
        the reason itself: the calibration "multiplies charged and uncharged
        costs identically", so the sign of the trend in T_desc_charged/sqrt(N)
        is invariant under any positive rescaling and CTRL-D cannot fail. Its
        output is reported as an identity check with that fact stated, and a
        CTRL-D "pass" may not be reported as a control verdict. v1's own
        empirical_content_disclosure already forbids reporting arithmetic as
        measurement; this applies that rule to CTRL-D.
      not_done: >-
        RT-20260727-001's preferred repair - repointing CTRL-D at the UNCHARGED
        crossover, which IS calibration-sensitive (committed calibration
        factors span 554,930 to 1,477,926 group-ops/s, a 2.66x spread that
        moves the crossover threshold in N by 7.1x) - is NOT implemented. See
        declined_objections D3.
    - id: Z2
      target: metric k_star_charged
      change: >-
        Report k_star_charged as a SINGLE-FACTOR ATTRIBUTION FIGURE, never as
        "the corrected K*". T_desc is yield-charged while S_rel stays frozen at
        the uncharged (N/B)*T_desc, by deliberate design so that exactly one
        quantity moves. The direction is safe - correcting S_rel too can only
        raise K* - but the label must say what the number is.
    - id: Z3
      target: new secondary metric groebner_cost_trivial_vs_nontrivial
      change: >-
        From the committed fixed-mode records the Executor already reads,
        report: the count and pooled median of metrics.groebner_seconds over
        runs with is_trivial_ideal true, the same over runs with
        is_trivial_ideal false, and their ratio. Zero new computation. This
        settles one of EV-IC-001's three recorded unresolved confounds ("T_desc
        on trivial ideals may not represent non-trivial Groebner systems")
        directly from committed records.
      direction_disclosure: >-
        RT-20260727-001 derives 0.040484 s over 306 trivial solves against
        0.038775 s over 34 non-trivial solves, ratio 0.958 - i.e. the confound
        comes out AGAINST the objection and IN H-IC-001's FAVOUR. Those numbers
        are the reviewer's derivation and are NOT inputs here: the Executor
        recomputes them independently and reports whatever it finds, in either
        direction. The metric is added precisely because a control that only
        looks for evidence against its target is not a control.
    - id: Z4
      target: metric p_dec_target_set_empirical
      change: "Report the effective distinct-target count per instance beside it (heuristic H1)."
    - id: Z5
      target: CTRL-B
      change: >-
        Report the effective distinct-element count of the CTRL-B sample per
        instance, i.e. min(100000, N). At N = 5, 23, 31, 37, 41 and 349 the
        100000-element draw enumerates the subgroup thousands of times and is
        not a sample; CTRL-B's output at those instances is labelled
        enumeration, not sampling. No protocol restriction is imposed.
    - id: Z6
      target: counting_derivation.yield_bound
      change: >-
        Record the cofactor derivation note: S is spread over E, not over <P>,
        so the natural estimate is P_dec ~ |S|/#E = |S|/(h*N) rather than
        |S|/N. Using |S|/N is therefore LOOSE by the cofactor h (h = 2, 4, 16
        and 3 at the 36-bit seeds 2, 5, 10 and 11 per RT-20260727-001, so at
        most 16x here) and the looseness is in the direction that makes the
        counting bound generous. The derivation should say so rather than leave
        |S|/N looking tight. No metric changes.

  declined_objections:
    note: >-
      RT-20260727-001 raised 10 non-blocking objections and 7 required
      controls. R1-R5 implement all five BLOCKING repairs. The items below are
      NOT implemented by this amendment. Each is recorded with its reason and
      its carrier so nothing is silently dropped.
    items:
    - id: D1
      objection: "NB-3 / CTRL-I: s3_eval filter-completeness control (enumerate the harness reachable set with and without the pre-filter on one 8-bit instance and assert set equality)."
      cost_if_implemented: "roughly 420 point additions on one small instance; effectively zero wall clock"
      reason_declined: >-
        This amendment is scoped to the five blocking repairs plus zero-cost
        reporting changes. CTRL-I adds a new computation and a new control arm
        to a protocol already under an adverse review that must be re-reviewed,
        expanding the re-review surface. Its absence is CONSERVATIVE: an
        incomplete filter would make the true charged cost larger, not smaller.
      but_this_is_the_load_bearing_decline: >-
        Heuristic H3 is the SOLE residual route to falsifier F2 at N >= 1e9,
        and this amendment declares F2 unreachable there partly on the strength
        of H3. Declining CTRL-I leaves that declaration resting on an unproved,
        untested assumption. The cost is near zero. TASK-20260727-012 is
        explicitly invited to require it, and the Coordinator will adopt it on
        a REVISE that names it. It is the one decline in this list that a
        re-reviewer should weigh rather than accept.
      carrier: "TASK-20260727-012 re-review; otherwise a successor experiment"
    - id: D2
      objection: "NB-2 / CTRL-A2: positive-negative subgroup-membership control valid at every N (take random Y in E, assert the test accepts h*Y where h = #E/N and rejects a Y with N*Y != O)."
      cost_if_implemented: "microseconds per instance"
      reason_declined: >-
        Same scope reason as D1. CTRL-A already validates the membership test
        exhaustively at the 23 instances with N <= 200000; the untested
        instances are those where N*X == O with N prime is a one-line
        determinate test on an exactly known N read from a committed record.
        The residual risk is an implementation defect in a two-line predicate,
        which CTRL-A catches at 23 instances if it is present at all.
      carrier: "TASK-20260727-012 re-review; otherwise a successor experiment"
    - id: D3
      objection: "NB-1 second half: repoint CTRL-D at the UNCHARGED crossover under the observed 2.66x calibration spread."
      cost_if_implemented: "one recomputation arm; low but nonzero implementation"
      reason_declined: >-
        This changes what a run arm COMPUTES, not how it is labelled, and it
        tests DEC-20260726-005's calibration sensitivity rather than this
        experiment's own claim. That is a distinct and legitimate question -
        a 2.66x calibration spread moving the crossover threshold in N by 7.1x
        is a serious objection to EV-IC-001 - but it belongs to a control on
        EXP-IC-001, not inside a control on the yield charge, and folding it in
        here would confound two questions in one arm. Z1 relabels CTRL-D so
        nothing false is reported meanwhile.
      carrier: "recorded as a candidate successor control; named in the TASK-20260727-009 analysis inputs"
    - id: D4
      objection: "Null-model comparison: measured |S| against the random-subset prediction #E*(1 - exp(-392/#E)) at 8-bit and 12-bit."
      reason_declined: >-
        New computation beyond the five repairs, and its outcome would bear on
        heuristic H2 rather than on any success or falsification criterion. H2
        is now numbered and its untestability at N >= 1e9 is disclosed, which
        is the part that affects how SC2 may be read.
      carrier: "successor experiment; H2 validation"
    - id: D5
      objection: "NB-9: EV-IC-001, EV-STR-002 and EV-GGM-001 carry run_ids: [] while citing 748, 22 and 9 runs (AGENTS.md rule 10 unmet)."
      reason_declined: "Not a defect of this protocol. Already carried by the BATCH-006 queue and by goal integrity note INT-BATCH006-009."
      carrier: "TASK-20260727-009, which must fill EV-IC-002.run_ids with the four exact EXP-IC-002 run identifiers"
    - id: D6
      objection: "NB-10: EXP-IC-002 addresses DEC-20260726-005 only, not DEC-20260726-006; the batch narrative should not imply otherwise."
      reason_declined: "A batch-narrative correction, not a protocol change. RT-20260727-001 itself calls the scoping choice correct."
      carrier: "BATCH-006 dispatch queue integrity note; DEFER-BATCH006-001 already carries the H-STR-002 confound"
    - id: D7
      objection: >-
        RT-20260727-001 Q3 and Q5: EXP-IC-001's v2_to_v3 amendment revised a
        success criterion after the original was observed to fail and recorded
        confirmatory_status preserved; the resulting 4/4 is an arithmetic
        consequence of its own conditioning, so EV-IC-001's "SUCCESS CRITERION
        MET" and DEC-20260726-005 rationale item 1 lose their support
        independently of anything EXP-IC-002 measures.
      reason_declined: >-
        Correct and serious, but it is a finding about IMMUTABLE COMMITTED
        RECORDS, not about this protocol, and this amendment has no authority
        over them. Acting on it requires superseding records and a decision.
      carrier: >-
        TASK-20260727-009, as a required superseding-record deliverable
        alongside the EV-IC-001 premise correction. No hypothesis status is
        changed by this amendment.

