experiment:
  id: EXP-PAIR-7bfe2b
  hypothesis_id: H-PAIR-27e16a
  derived_from_idea: IDEA-20260807-464ff8
  question_id: RQ-PAIR-21313f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The CM endomorphism is not a distortion map - mechanical verification that the Weil self-pairing is
    trivial on the rational subgroup of ordinary prime-field curves, gated by a supersingular positive
    control that must fire, an alternating-pairing check, a deliberately broken-pairing check, and a
    constructive search for the one exceptional configuration
  objective: >-
    The one uncertainty a run reduces is whether a closure this repository already states twice, in
    passing and under a hypothesis rather than a characterisation, survives mechanical verification and
    can have its exceptional boundary EXHIBITED rather than asserted. A run establishes (i) that the
    pairing implementation is sound in both directions - the supersingular positive control returns a
    non-trivial value and the alternating self-pairing returns exactly 1 everywhere; (ii) that on at
    least 200 toy ordinary curves with group order exactly divisible by N, the recovered scalar for
    Frobenius is exactly 1 and every tested endomorphism gives e_N(P, psi(P)) = 1; and (iii) whether an
    ordinary curve with full rational N-torsion can be constructed at toy scale and, if so, whether the
    conclusion genuinely fails on it. A closure whose exceptional case cannot be produced has not been
    shown to be a real boundary, and the run reports that outcome as a limitation rather than as a
    success. No attack is proposed and the mathematics is textbook.
  what_this_is_not:
  - >-
    Not new mathematics. The argument is textbook and is already recorded twice in this repository; the
    increments are the exact exceptional-case characterisation, the Jordan-block sub-case, mechanical
    verification, and retrievability under an explicit resource taxonomy.
  - >-
    Not a hardness result and not an attack. It moves no exponent and makes no curve safer than it
    already was.
  - >-
    Not a statement about the Tate self-pairing, which is not alternating and is handled by a different
    argument; nor about pairings between the rational subgroup and a different subgroup over an
    extension, which is the classical transfer and needs a second independent point.
  - >-
    Not a statement about supersingular curves, where the commutativity step fails at its first line -
    which is exactly why the supersingular arm is the positive control rather than a counterexample.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run has
    been executed under this contract.
  claim_ceiling:
    tier: toy_verification_of_a_textbook_closure
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - on the executed toy ordinary curves with p between 2^16 and 2^20 and group
      order exactly divisible by N, every tested (curve, endomorphism, point) triple gave a trivial Weil
      self-pairing, the recovered Frobenius scalar was exactly 1, the supersingular positive control fired,
      and an exceptional curve was or was not constructed. WHAT DOES NOT FOLLOW - nothing about the Tate
      self-pairing, nothing about two-point pairings, nothing about ECDLP hardness, and no claim of novelty,
      since the argument is textbook. A universal statement is supported only by the DERIVATION, not by the
      200 curves; the curves check the derivation's implementation, and the contract requires that
      distinction to be preserved in the report.
  inputs:
    procedure: >-
      STAGE 0, zero compute, HARD GATE - write the derivation in four steps with the quantifier order
      explicit, naming the ordinary/supersingular dichotomy as the single external input and marking it as
      textbook-standard but NOT transcribed into this corpus. Separately, attempt to obtain the published
      treatment of distortion maps on ordinary curves in a readable form and record its exact
      exceptional-case characterisation. Two outcomes, both useful - it agrees with the characterisation
      here, in which case this record's increment is a re-derivation and should be downgraded to a corpus
      transcription; or it differs, in which case one of the two is wrong and finding out which is the
      deliverable. A failed fetch is infrastructure signal and the remaining stages run regardless.
      STAGE 1, minutes - on at least 200 toy ordinary curves with p between 2^16 and 2^20, group order
      exactly divisible by N, and small embedding degree, verify that Frobenius fixes P, that the recovered
      scalar is exactly 1, and that e_N(P, psi(P)) = 1 for every evaluated endomorphism. Curves with j = 0
      or j = 1728 are REQUIRED in the sample, because on a generic ordinary curve the only cheaply evaluable
      endomorphisms are the integers and Frobenius, and a test using only Frobenius is nearly vacuous.
      STAGE 2, HARD GATE, minutes - the supersingular positive control on the standard curve with its
      textbook distortion map. It MUST return a non-trivial pairing. Additionally run the alternating check
      e_N(P, P) = 1 on every curve, and the deliberately broken pairing with the final exponentiation
      omitted, which must be caught by producing a value outside the N-th roots of unity.
      STAGE 3, hours - search toy p for an ordinary curve with full rational N-torsion for a small prime N,
      i.e. N dividing p - 1 and N^2 dividing the group order, and verify on it that the cyclicity step
      genuinely fails, that some endomorphism moves P off its own subgroup, and that a non-trivial
      self-pairing appears. Report the search's coverage - primes examined, curves tested, hits - so that a
      failure to construct one is a bounded statement rather than an absence.
    instrument: >-
      Exact finite-field arithmetic over F_p and its small extensions, with a Weil pairing implementation
      including the final exponentiation. The recovered scalar for each endomorphism is computed by solving
      psi(P) = [lambda] P over the prime-order subgroup and is reported alongside the eigenvalue predicted by
      the characteristic polynomial of Frobenius modulo N - for Frobenius itself the prediction is exactly 1.
      The pairing value is reported as an element of the extension field TOGETHER WITH ITS ORDER, so a value
      that is trivial for the wrong reason is visible. Recorded through harness/runner.py.
    parameters: >-
      At least 200 ordinary curves with p in [2^16, 2^20], group order exactly divisible by an odd prime N
      distinct from p, embedding degree small and deliberately selected so the pairing field is computable -
      which does not weaken the conclusion, because the claim is that the value is 1 for ALL embedding
      degrees and small ones are where a non-trivial value would be easiest to produce. At least 20 curves
      with j = 0 or j = 1728 so a genuine non-integer, non-Frobenius endomorphism is explicit. One standard
      supersingular curve with p = 3 mod 4 and its textbook distortion map. Exceptional search over small N
      with N dividing p - 1 and N^2 dividing the group order.
  controls:
  - >-
    POSITIVE CONTROL, HARD GATE, MUST FIRE - the standard supersingular curve with its textbook distortion
    map. On it the IDENTICAL pipeline must return a non-trivial e_N(P, psi(P)). If it does not, every
    negative in this package is an instrument artifact and nothing may be reported. For a closure, the null
    runs in this direction - the instrument must be shown capable of DETECTING a distortion map where one
    exists, or "we found none" means nothing.
  - >-
    ALTERNATING CHECK, blocking - e_N(P, P) must be exactly 1 on EVERY curve including the supersingular
    control. A non-trivial value means the pairing implementation is wrong and every number is void.
  - >-
    BROKEN-PAIRING CHECK, must be caught - a deliberately broken pairing with the final exponentiation
    omitted, which must produce a value outside the N-th roots of unity and be flagged. This demonstrates the
    pipeline can distinguish a correct pairing from a plausible-looking wrong one, which is the specific
    failure that would make a trivial value meaningless.
  - >-
    NEARBY-OBJECT CONTROL ONE - the supersingular curve, where the desired conclusion FAILS and must be seen
    to fail. An argument that also proves no distortion map there proves too much and is void.
  - >-
    NEARBY-OBJECT CONTROL TWO - an ordinary curve with full rational N-torsion, where the cyclicity
    hypothesis fails and the conclusion must again FAIL. This is the exceptional case and constructing it is
    what turns an asserted boundary into an exhibited one.
  - >-
    ENDOMORPHISM-AVAILABILITY CONTROL - the sample must include curves with small discriminant carrying an
    explicit non-integer, non-Frobenius endomorphism. A run whose only evaluated endomorphism is Frobenius
    has tested almost nothing, since Frobenius acts as 1 on the rational subgroup by construction, and the
    contract requires the count of non-Frobenius evaluations to be reported.
  - >-
    EIGENSPACE-DIMENSION REPORTING, the decay parameter - the dimension of the Frobenius eigenspace
    containing G is 1 for ordinary curves with group order exactly divisible by N, and 2 in the exceptional
    case and on supersingular curves over the quadratic extension. As that dimension drops from 2 to 1 the
    non-trivial self-pairing must vanish EXACTLY, not gradually. Any curve reported with eigenspace dimension
    1 and a non-trivial self-pairing is an instrument failure, and the first thing to check is the final
    exponentiation.
  independent_variables:
  - curve type - ordinary prime-field, supersingular, ordinary with full rational N-torsion
  - endomorphism psi evaluated - Frobenius, an integer, or an explicit non-integer endomorphism on a small-discriminant curve
  - embedding degree
  - the dimension of the Frobenius eigenspace containing G
  metrics:
    primary:
    - >-
      nontrivial_selfpairing_fraction_ordinary - the fraction of (ordinary curve, psi, P) triples with
      e_N(P, psi(P)) not equal to 1, over curves with group order exactly divisible by N and embedding degree
      above 1, dimensionless. FORCED EXACTLY 0, with no tolerance.
    - >-
      frobenius_scalar_agreement - the fraction of ordinary curves on which the recovered scalar for Frobenius
      equals 1 exactly, dimensionless. FORCED 1.00.
    - >-
      supersingular_control_fire_rate - the fraction of supersingular positive controls with
      e_N(P, psi(P)) not equal to 1, dimensionless. FORCED 1.00.
    - >-
      alternating_check_violations - the number of curves on which e_N(P, P) is not exactly 1, an integer.
      FORCED 0.
    - >-
      broken_pairing_caught - whether the deliberately broken pairing produced a value outside the N-th roots
      of unity and was flagged, boolean. FORCED true.
    - >-
      exceptional_curve_constructed - whether an ordinary curve with N dividing p - 1 and N^2 dividing the group
      order was found, boolean, with the search coverage reported either way; and if found, whether some
      endomorphism moves P off its own subgroup and a non-trivial self-pairing appears.
    secondary:
    - >-
      recovered scalar per (curve, psi) and its agreement with the eigenvalue predicted by the characteristic
      polynomial of Frobenius modulo N.
    - >-
      e_N(P, psi(P)) per triple, reported as an element of the extension field TOGETHER WITH ITS ORDER, so a
      value trivial for the wrong reason is visible.
    - >-
      the tuple (p, N, group order, embedding degree, eigenspace dimension) for every curve tested.
    - >-
      the count of NON-Frobenius endomorphism evaluations, since a package dominated by Frobenius has tested
      almost nothing.
    - >-
      the number of distinct endomorphisms found to share a single recovered scalar - the observation collision
      that upgrades "we tried some endomorphisms" to "the observable cannot separate them".
    - >-
      the Stage 0 record of the published characterisation, or a recorded failed fetch with the exact attempt.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      nontrivial_selfpairing_fraction_ordinary; supersingular_control_fire_rate; frobenius_scalar_agreement; and
      exceptional_curve_constructed.
    formula: >-
      nontrivial_selfpairing_fraction_ordinary = 0 exactly, with no tolerance, because
      e_N(P, psi(P)) = e_N(P, P)^lambda = 1 identically once psi acts on G as the scalar lambda and the Weil
      pairing is alternating. supersingular_control_fire_rate = 1.00, because the endomorphism ring there is
      non-commutative and the argument's first step fails. frobenius_scalar_agreement = 1.00, since Frobenius
      acts as the identity on the rational subgroup by definition. exceptional_curve_constructed is NOT
      predicted - it is a search outcome, and the parent proposal's own honest estimate of finding one at toy
      scale within budget is well below certainty.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-464ff8, parts (B) and (C) and its predictions block,
      before any run under this contract exists. The mathematics is textbook and the proposal declares itself a
      DUPLICATE of an argument already in this repository; no external result is used in any derivation, and the
      published characterisation's agreement with the exceptional case here is recorded as OPEN.
  scale_relevance:
    tier: toy
    justification: >-
      p between 2^16 and 2^20 with deliberately SMALL embedding degree, so the extension field in which the
      pairing value lives is computable. Selecting small embedding degree does not weaken the conclusion, and
      that is the unusual feature of this design - the claim is that the value is 1 for ALL embedding degrees,
      so small ones are the case where a non-trivial value would be EASIEST to produce, and testing there is
      testing the claim at its most vulnerable point rather than at its most convenient. The universal statement
      is supported by the DERIVATION, not by the sample; the sample checks the derivation's implementation, and
      no transfer assumption from toy p to cryptographic p is needed or made.
    correspondence: >-
      The argument is uniform in p and in N - it uses only commutativity of the endomorphism ring, cyclicity of
      the rational eigenline, and the alternating property - so there is no scale-dependent step for a larger p
      to exercise. That is why toy scale is sufficient here and is not sufficient elsewhere in this program.
  tail_checks:
  - >-
    Report the order of every pairing value, not only whether it equals 1, since a value that is trivial because
    it landed outside the N-th roots of unity is a bug rather than a confirmation.
  - >-
    Report the curves with the SMALLEST embedding degree separately, since those are where a non-trivial value
    would be easiest to produce and a package that found nothing there has tested the claim at its weakest point.
  - >-
    Report the exceptional search's full coverage - primes examined, curves tested, near-misses satisfying one of
    the two conditions but not both - so that a failure to construct is a bounded statement.
  - >-
    Report every curve where the eigenspace dimension is 2, whether or not a non-trivial pairing appeared, since
    those are exactly the curves the closure does not cover.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
  - >-
    HALT the package if the supersingular positive control returns 1. The instrument cannot see a distortion map
    and no negative is interpretable.
  - >-
    HALT if e_N(P, P) is not exactly 1 on any curve, or if the deliberately broken pairing is NOT caught. The
    pairing implementation is wrong.
  - >-
    HALT the ordinary conclusion if the count of non-Frobenius endomorphism evaluations is zero. A package that
    evaluated only Frobenius has tested a tautology.
  - >-
    Bound the Stage 3 exceptional search by the declared budget and report its coverage rather than extending it.
    A failure to construct is a bounded statement, not a licence to search further and report the same claim.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative
    result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative mathematical
    evidence (AGENTS.md rule 5). A failed Stage 0 fetch is likewise infrastructure and leaves the derivation and
    the verification standing.
  - >-
    A run whose supersingular positive control was not executed in the same invocation as the ordinary arm is
    invalid_measurement - the instrument's detection capability was not demonstrated on the same code path.
  - >-
    A run reporting pairing values without their orders is invalid_measurement, since triviality for the wrong
    reason cannot then be excluded.
  - >-
    A run in which every evaluated endomorphism is Frobenius is invalid_measurement, because Frobenius acts as 1
    on the rational subgroup by construction and the test is vacuous.
  - >-
    A run reporting the universal claim as if the 200 curves established it, rather than as the derivation's
    implementation check, is completed_invalid.
  - >-
    A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a new contract;
    it is never a repair of this one.
  success_criterion: >-
    The verification succeeds when ALL of the following hold, each decidable from the primary metrics -
    (1) supersingular_control_fire_rate is 1.00;
    (2) alternating_check_violations is 0 on every curve including the control;
    (3) broken_pairing_caught is true;
    (4) at least 20 non-Frobenius endomorphism evaluations were performed on small-discriminant curves;
    (5) frobenius_scalar_agreement is 1.00 across at least 200 ordinary curves;
    (6) nontrivial_selfpairing_fraction_ordinary is exactly 0;
    (7) exceptional_curve_constructed is reported with its search coverage, either as a constructed curve on which
    the conclusion demonstrably FAILS, or as an explicit unexhibited boundary with the coverage stated.
    Outcome (7) as an unexhibited boundary is a SUCCESSFUL run with a WEAKER claim - the closure is capped at "no
    counterexample found in the tested family" and must be reported at that strength.
  falsification_criterion:
  - >-
    Any ordinary curve with group order exactly divisible by N and embedding degree above 1 on which some
    endomorphism gives a non-trivial Weil self-pairing, SURVIVING the positive control, the alternating check and
    the broken-pairing check. The argument is REFUTED and this would be the most important observation the design
    can produce; it requires independent replication before any downstream use.
  - >-
    The supersingular positive control returning 1, or a non-trivial e_N(P, P) anywhere, or the broken pairing not
    being caught. INSTRUMENT FAILURE under AGENTS.md rule 5 - never mathematical evidence, and nothing is reported.
  - >-
    The published characterisation of the remaining ordinary cases differing from the exceptional case stated here.
    One of the two is wrong; the record is superseded under a new id rather than amended.
  - >-
    Failure to construct any exceptional curve at toy scale within the declared search budget. The closure boundary
    is UNEXHIBITED, the claim is capped at "no counterexample found in the tested family", and the coverage is
    reported. This is a real limitation and is a negative for the exhibited-boundary half of the hypothesis.
  - >-
    An exceptional curve IS constructed and the conclusion does NOT fail on it. The exceptional-case
    characterisation is wrong - the boundary is somewhere else - and the record is superseded.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and environment
  - the four-step derivation with its quantifier order explicit and the external input named as textbook and untranscribed
  - raw-result.json carrying, per triple, the recovered scalar, the pairing value AS A FIELD ELEMENT WITH ITS ORDER, and the tuple (p, N, group order, embedding degree, eigenspace dimension)
  - the supersingular positive control, the alternating check and the broken-pairing check, in the same file as the ordinary arm
  - the count of non-Frobenius endomorphism evaluations and the curves they ran on
  - the exceptional search's full coverage - primes examined, curves tested, near-misses - and the constructed curve if any
  - the observation-collision report - how many distinct endomorphisms shared one recovered scalar
  - the Stage 0 record of the published characterisation, or the recorded failed fetch with its exact attempt
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator drafting does not confer approval. This contract is review_required and is NOT approved;
    approved_by is null and execution_authorized is false. Approval is the user's gate because it authorizes
    execution and spends compute.
  - >-
    The parent proposal declares itself a DUPLICATE of an argument already recorded twice in this repository.
    Approval should be given, if at all, on the increments - the exceptional-case characterisation, the
    Jordan-block sub-case, the mechanical verification and the constructive boundary - and NOT on novelty, which
    the proposal itself disclaims.
  - >-
    A transcription of the ordinary/supersingular dichotomy into this corpus is owed before this hypothesis is
    promoted, since the entire argument rests on that one sentence and it is currently recalled rather than
    recorded. Approval should either require the transcription first or record the debt explicitly.
  - >-
    Stage 3's exceptional search has the lowest prior of success in the package and consumes most of its budget.
    Approval should state whether an unexhibited boundary is an acceptable deliverable, since that is the more
    likely outcome.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-464ff8
    authored_at: '2026-08-25'
    note: >-
      The four-step argument, the exceptional-case characterisation, the four named controls including the
      supersingular positive control and the deliberately broken pairing, the eigenspace-dimension decay parameter
      and the three predictions are taken from the parent proposal's claim, null_object_control, proof_search_map
      and minimal_test, restated as measurable quantities with units. The endomorphism-availability control is
      promoted here from the proposal's confounders list into a blocking requirement, because a package evaluating
      only Frobenius would satisfy every other criterion while testing nothing. Budgets follow the parent's
      declared low implementation and low compute.
  derivation_gaps:
  - >-
    The ordinary/supersingular dichotomy is TEXTBOOK BUT NOT TRANSCRIBED in this corpus, and the entire argument
    rests on it. A literature transcription is owed before promotion and its absence is a declared debt.
  - >-
    Whether the published characterisation of the remaining ordinary cases coincides with the exceptional case
    stated here is OPEN. The relevant abstract was verified by the parent proposal but its theorem statements were
    not read, and this contract must not be reported as agreeing with it until they are.
  - >-
    The exceptional search's prior of success at toy scale within budget is low by the parent proposal's own
    estimate. The contract handles that by making an unexhibited boundary a successful-but-weaker outcome, but it
    does not improve the odds, and the more likely deliverable is therefore the weaker claim.
  - >-
    The parent proposal's Jordan-block sub-case - Frobenius non-semisimple with eigenvalue 1, possible when
    p = 1 mod N but the N-torsion is not fully rational - is claimed NOT to be an exception. That sub-case is the
    part most likely to be criticised in review, and this contract does not construct an instance of it. Doing so
    would strengthen the record materially and is not in scope here.
  - >-
    The specific supersingular curve, its distortion map, and the exact non-integer endomorphisms to be evaluated
    on small-discriminant curves are not named by the proposal. They must be fixed before approval, since the
    positive control is blocking and a control chosen at run time could be chosen to pass.
