        Executor does not repair a frozen contract.
      affects_any_verdict: false
    - id: OBS-ENCA-DEFINITION-BY-REFERENCE
      what: >-
        EXP-SMTH-71b1b0 names ENC-A in the BLOCKING control CTRL-ENCA-POWER but
        does not define it anywhere in its own text, and its
        reuses_nothing_unapproved clause declines to reuse EXP-SMTH-001's
        contract. ENC-A has exactly one definition in the corpus,
        EXP-SMTH-001.intermediate_generation.step_5_power_certificate_encoding:
        "M_ij = max(lift(e_1), 1) * max(lift(e_2), 1). Range [1, (p-1)**2]",
        and H-SMTH-001.test_boundary.parameters names ENC-A as the
        power_certificate_encoding. That single definition was used.
      action_taken: >-
        Resolved by reference to the one existing definition rather than by
        Executor choice, and flagged here so the Validator can rule on whether
        a control defined only outside the frozen contract is admissible.
      affects_any_verdict: >-
        Only CTRL-ENCA-POWER. Under this definition the control passes by a
        factor of about 106 at both field sizes.
    - id: OBS-ENCA-INT-COLLISION
      what: >-
        min_integer differs by exactly 1 between TREAT-ENCB.bits20 (387014) and
        CTRL-ENCA.bits20 (387013). This is expected arithmetic, not a leak: on
        a pair with e_1 = 0, ENC-B gives e_2 + 1 and ENC-A gives
        max(0,1)*e_2 = e_2. Recorded so it is not later read as an encoder
        defect.
      affects_any_verdict: false
    - id: OBS-SYMPY-ABSENT
      what: >-
        sympy is not installed in this environment, so the factoriser is pure
        Python. See environment.dependency_deviation.
      affects_any_verdict: >-
        No. Factorisations were verified complete on all 784896 records and
        reproduced independently by trial division on 2398 sampled records.

  protocol_deviations:
    - id: DEV-1-DELEGATED-DETERMINATIONS
      severity: recorded
      what: >-
        The contract delegates the curve, the prime and the factor base to a
        rule ("deterministic from (master_seed, domain, bits)") without naming
        the derivation function. Four implementation-level determinations were
        therefore made and are documented in full in
        experiments/EXP-SMTH-71b1b0/implementation/implementation.md: the
        SHA256 counter-mode DRBG, the prime-selection rule, the ordinary-curve
        selection rule, and the frozen_deterministic_subset factor-base rule
        (first 512 on-curve x in increasing integer order, the policy named by
        H-DS-001.test_boundary.parameters.factor_base_policy and by
        EXP-SMTH-001.factor_base.rule). None changes a hypothesis, a metric, a
        threshold or a control. All four are reproducible and were
        independently re-derived by verify_run.py.
    - id: DEV-2-NO-SYMPY
      severity: recorded
      what: pure-Python factoriser, see OBS-SYMPY-ABSENT.
    - id: DEV-3-REDUCED-SCALE-SMOKE-TEST
      severity: recorded
      what: >-
        Before the single authorized full-scale invocation, the pipeline was
        exercised once at a REDUCED, NON-CONTRACT scale (factor base 24, n =
        276, shard 16) in a scratch directory outside the repository, purely to
        exercise code paths. That configuration cannot produce the contract's
        datum, its thresholds are meaningless at n = 276, and none of its
        numbers appears anywhere in this run package. The contract-scale entry
        point was invoked exactly ONCE. No run was repeated and no result was
        discarded.
    - id: DEV-4-WORKERS
      severity: recorded
      what: >-
        The contract permits up to 4 workers; 1 was used. Single-process
        execution keeps peak RSS lower and the record order strictly
        deterministic. The full run finished in 0.66 percent of the wall
        ceiling, so parallelism was unnecessary.
  protocol_deviations_affecting_a_verdict: none

