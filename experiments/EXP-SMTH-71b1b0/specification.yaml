experiment:
  id: EXP-SMTH-71b1b0
  version: 1
  status: frozen_awaiting_execution
  hypothesis_id: H-SMTH-001
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  title: >-
    Direct B-smoothness measurement of the half-arity Semaev partial-map integer
    invariants, against a MEASURED null at the actual X
  authority: DEC-20260801-011 rank 1 (OPEN-BATCH023-A, the owed direct smoothness measurement)
  frozen: true
  frozen_by_task: TASK-20260802-80f5e9
  frozen_at: '2026-08-03'
  execution_authorized: false
  evidence_eligible: false

  supersedes: EXP-SMTH-4403c4
  supersession_reason: >-
    EXP-SMTH-4403c4 was frozen by this same task and is superseded BEFORE ANY
    DATUM EXISTS, under its own freeze_rule, for three defects recorded in
    CORR-20260803-b3d7f1 and CORR-20260803-ff53c0. It is left unedited with its
    sha256 80b75c415b3456772acf09901a67ea0644d984dae84f8ad01946fc8afeb5b801
    standing. (1) STRUCTURAL: everything from measured_quantity onward was
    written at YAML document top level instead of nested under `experiment:`,
    so the contract body was not part of the experiment record and the required
    fields metrics, budget and success_criterion were absent from it -- three
    validator errors. (2) SCHEMA: metrics and success_criterion were never
    written under those names at all. (3) SUBSTANTIVE: CTRL-NULL-SELF made an
    APPARATUS_FAILURE conditional on the uniform null matching asymptotic
    Dickman rho, which REV-20260801-012 measured a CORRECT null failing 0 of 8
    at both field sizes. All three are repaired here.

  freeze_rule: >-
    THIS CONTRACT IS FROZEN. Any needed change is a SUPERSEDING contract under a
    NEW id, never an edit. Its sha256 is recorded in freeze_receipt.json and is
    re-hashed by the measurement task, which HALTS if the digest differs.

  no_datum_produced_by_the_freezing_task: >-
    TASK-20260802-80f5e9 produced no datum, factored no integer and reports no
    observed number. Every number below is a declared parameter or a threshold
    computed from declared parameters and the classical Dickman function.

  reuses_nothing_unapproved: >-
    EXP-SMTH-001's contract is UNAPPROVED (TASK-20260801-013) and is NOT reused;
    DEC-20260801-011 rank 1 forbids it. EXP-SMTH-002 is a null-only feasibility
    pilot and is frozen. Neither is edited. The measured quantity is stated
    directly below rather than by reference to either.

  # -----------------------------------------------------------------------
  measured_quantity:
    informal: >-
      For each unordered pair of DISTINCT factor-base x-coordinates, take the
      third Semaev summation polynomial with those two coordinates substituted,
      form the elementary symmetric functions of its root multiset in the
      remaining variable, encode that tuple as one integer, and ask how often
      that integer is B-smooth.
    curve: E over F_p, prime field, ordinary, p of bitlength `bits`
    arity: m = 4; the half-arity partial map uses S_3
    factor_base: {symbol: FB, size: 512, contents: x-coordinates of points of E(F_p),
                  construction: deterministic from the frozen seed below}
    partial_map: >-
      For i < j, S_3(x_i, x_j, Z) is a univariate polynomial in Z over F_p whose
      root multiset R_ij is taken with multiplicity.
    well_definedness: >-
      The leading coefficient of S_3(x_1, x_2, Z) in Z is (x_1 - x_2)**2, which
      vanishes over F_p EXACTLY on the diagonal x_1 = x_2. Under the strict
      i < j enumeration below, x_i != x_j always, so the leading coefficient is
      never zero and the invariants are defined on every tuple of the index set.
      This is RV012-A2, the defect that made the predecessor's integrity guard
      fire on every possible outcome, and it is structurally excluded here.
    invariant: >-
      e(R_ij) = the elementary symmetric functions of R_ij, each reduced to its
      representative in [0, p-1].
    encoding: {map: INT-1, variant: ENC-B, codomain: "an integer N_ij in [1, p**2]"}
    the_integer_measured: N_ij
    intermediate_bound: D = 2**(2*bits)
    smoothness_predicate: >-
      N_ij is Bsm-smooth iff LPF(N_ij) <= Bsm. Factorization is COMPLETE, not
      trial-division-truncated; a partially factored integer is counted neither
      way and its count is reported.

  enumeration:
    rule: "for i in range(512): for j in range(i+1, 512)"
    index_set: "{ (i, j) : 0 <= i < j < 512 }"
    count_n: 130816
    count_derivation: "C(512,2) = 512*511/2 = 130816"
    diagonal_excluded_by_construction: true
    why_the_loop_bound_and_not_a_filter: >-
      j STARTS at i+1. A post-hoc filter removing i == j could silently fail and
      leave the count wrong; a loop bound cannot. DEC-20260801-011 names this.
    each_unordered_pair_once: >-
      S_3 is symmetric in its first two arguments, so (i,j) and (j,i) give the
      same N; measuring both would inflate n without adding information.
    PRE_REGISTRATION_CORRECTION:
      finding: >-
        H-SMTH-001 quotes n = 131328 and derives its KS2 threshold from it.
        131328 = 512*513/2 is the count of pairs with i <= j -- THE DIAGONAL
        INCLUDED -- and 512 + 130816 = 131328 exactly. Those 512 diagonal tuples
        are precisely where the invariants are UNDEFINED (see well_definedness).
        The quoted n is inherited from the defective predecessor enumeration.
      KS-DS-1: >-
        max(0.05, 1.63/sqrt(n)) is 0.05 at both counts (0.004498 vs 0.004507);
        the 0.05 floor binds. UNCHANGED.
      KS2-DS-1: >-
        1.63*sqrt(2/n) is 0.006361 at 131328 and 0.006373 at 130816. FROZEN AT
        0.006373, the value for the enumeration actually performed.
      RATE-DS-1 and DECAY-1: ratio tests, independent of n. UNCHANGED.
      disclosure: >-
        Made BEFORE any datum exists and derived from the enumeration rule
        alone. A pre-registered threshold recomputed after the fact is
        indistinguishable from one chosen to fit.

  null_calibration:
    PRIMARY_CALIBRATION_IS_THE_MEASURED_NULL: >-
      The calibration is an EMPIRICAL null drawn and factored at the SAME field
      size, bound D and sample size as the treatment arm. THE ASYMPTOTIC DICKMAN
      rho IS NOT THE CALIBRATION AND MAY NOT BE SUBSTITUTED FOR IT. At D = 2**32
      and 2**40 the finite-size deviation is the same order as the effect sought,
      and REV-20260801-012 measured a correct uniform null failing analytic
      comparisons 0 of 8 at both field sizes for exactly this reason.
    null_object:
      name: NULL-UNIF-D
      definition: >-
        n = 130816 independent uniform random integers on [1, p**2] -- the
        codomain ENC-B maps into -- factored by the SAME pipeline at the SAME
        field size.
      why_this_range: >-
        H-SMTH-001's sentence is that the invariants behave like uniform random
        integers of the same size, so the null must be uniform on the encoding's
        codomain, not on [1, D] nor on a bitlength-matched band.
    ordering_constraint:
      rule: >-
        THE NULL ARM IS DRAWN, FACTORED AND COMMITTED BEFORE THE TREATMENT ARM
        IS FACTORED; its summary statistics are hash-committed first.
      why: >-
        A null computed afterwards can be tuned, consciously or not, by someone
        who has already seen the treatment numbers.
      enforcement: >-
        The run manifest records the null-arm commit digest BEFORE any treatment
        factorization. A manifest lacking it is invalid_integrity.
    dickman_status: >-
      SECONDARY REFERENCE, REPORTED BUT NEVER BLOCKING. KS-DS-1 and RATE-DS-1
      are inherited from H-SMTH-001's own sentence and are still computed and
      reported for both arms, but no APPARATUS_FAILURE and no REFUTE may rest on
      a Dickman disagreement alone at finite D.

  metrics:
    z: log(max(1, LPF(N_ij))) / log(D)
    rungs_u: [2, 3, 4, 5]
    decay_probe_u: 6
    per_arm:
      - empirical z-CDF
      - Bsm-smooth fraction at each rung, Bsm(u) = D**(1/u)
      - fraction with z >= 0.5 (the tail statistic)
      - count of incomplete factorizations
    per_experiment:
      - one-sample KS of the treatment z-CDF against the Dickman LPF CDF (KS-DS-1)
      - two-sample KS of treatment against NULL-UNIF-D (KS2-DS-1)
      - tail-fraction difference, treatment minus null (TAIL-DS-1)
      - ratio of the u = 6 smooth fraction to the u = 2 rung (DECAY-1)
    interpretation_ceiling: >-
      Descriptive distributional comparison at toy scale. No p-value beyond the
      pre-registered thresholds, no threshold selection after the fact, and no
      statement about ECDLP cost may be derived from any metric here.

  decision_rules:
    frozen_before_any_datum: true
    n_used_for_all_thresholds: 130816
    KS-DS-1:
      statistic: one-sample KS between the treatment z-CDF and the Dickman LPF CDF
      threshold: 0.05
      derivation: "max(0.05, 1.63/sqrt(130816)) = max(0.05, 0.004507)"
      role: SECONDARY, reported, non-blocking
    RATE-DS-1:
      statistic: empirical Bsm-smooth fraction at each rung
      band: "rho(u)/8 <= observed <= 8*rho(u)"
      rho_frozen: {u2: 0.30684282, u3: 0.0486083883, u4: 0.00491092564,
                   u5: 0.000354724692, u6: 1.96496897e-05}
      bands_frozen: {u2: [0.038355, 2.454743], u3: [0.006076, 0.388867],
                     u4: [0.000613866, 0.039287405], u5: [4.43406e-05, 0.002837798]}
      rho_provenance: >-
        RK4 integration of rho'(u) = -rho(u-1)/u from rho == 1 on [0,1], step
        2e-5, cross-checked twice: rho(2) against the closed form 1 - ln 2 =
        0.3068528, and 100*rho(6)/rho(2) = 0.0064038 against the 0.006404
        H-SMTH-001 itself quotes for DECAY-1. Both agree.
      role: SECONDARY, reported, non-blocking
    KS2-DS-1:
      statistic: two-sample KS between the treatment arm and NULL-UNIF-D
      threshold: 0.006373
      derivation: "1.63*sqrt(2/130816)"
      role: >-
        PRIMARY AND DECISIVE. This is the direct test of the heuristic's own
        sentence -- indistinguishability from uniform integers of the same size
        -- which H-SMTH-001 records as never having been performed.
    TAIL-DS-1:
      statistic: "fraction with z >= 0.5 (LPF >= sqrt(D)), treatment minus NULL-UNIF-D"
      threshold: "absolute difference <= 0.01"
      note: >-
        Defined against the MEASURED null, NOT against analytic rho. This is the
        repair of RV012-A1, whose p_ext = min_j rho(u_j) construction made the
        analytic pass probability 1/e and failed a correct null 0 of 8.
      role: supporting, blocking only jointly with KS2-DS-1
    DECAY-1:
      statistic: ratio of the u = 6 smooth fraction to the u = 2 rung, treatment arm
      threshold: 0.006404
      derivation: "100*rho(6)/rho(2) = 100*1.96496897e-05/0.30684282 = 0.0064038"
      fires_if: ratio > 0.006404
      role: >-
        ARTIFACT TELL, not a test of the heuristic. A smooth fraction that fails
        to decay says the sampled quantity is not behaving like an integer of
        size D, so INT-1 as implemented is a stand-in. The BATCH-020 failure
        mode, caught prospectively.

  success_criterion: >-
    SUPPORT AT TOY SCALE iff, at BOTH field sizes: KS2-DS-1 <= 0.006373,
    TAIL-DS-1 <= 0.01, DECAY-1 does not fire, and the blocking controls
    CTRL-ENCA-POWER, CTRL-APPARATUS-IDENTITY, CTRL-FACTOR-COMPLETE and
    CTRL-PAIR-COUNT all pass. KS-DS-1 and RATE-DS-1 are reported alongside but
    do not gate this criterion. Success is a TOY-SCALE DISTRIBUTIONAL STATUS
    REPORT on HEUR-DS-1 scoped exactly to INT-1, ENC-B, bits in {16,20},
    |FB| = 512, m = 4 and this ladder. It licenses NO cost saving, NO exponent,
    NO crypto-scale validity and NO consequence for any deployed scheme.

  outcomes:
    mutually_exclusive: true
    SUPPORT_AT_TOY_SCALE:
      when: the success_criterion above is met.
      disposition: support, strength preliminary, claim tier TOY
    REFUTE_AT_TOY_SCALE:
      when: >-
        At BOTH field sizes the treatment arm is rejected against the measured
        null at KS2-DS-1, or fails TAIL-DS-1, WHILE the blocking controls pass
        and CTRL-ENCA-POWER demonstrates the test has power.
      disposition: weaken, claim tier TOY
      explicitly_not: >-
        NOT reject_scoped on one unreplicated run and NEVER a crypto-scale
        refutation. Reported as FAILED AT TOY SCALE, scoped as above. Mirrors
        F-SMTH-1. A Dickman-only disagreement is NOT sufficient for this branch.
    INSTRUMENT_ARTIFACT:
      when: DECAY-1 fires.
      disposition: inconclusive, with a named repair
      meaning: falsifies the INSTRUMENT, not the heuristic. Mirrors F-SMTH-2.
    APPARATUS_FAILURE:
      when: >-
        CTRL-ENCA-POWER fails to reject, or CTRL-APPARATUS-IDENTITY fails, or
        CTRL-FACTOR-COMPLETE or CTRL-PAIR-COUNT fails.
      disposition: inconclusive
      meaning: >-
        Instrument failure; no disposition about the heuristic either way, per
        AGENTS.md rule 5. Mirrors F-SMTH-3. NOTE WHAT IS ABSENT: a Dickman
        mismatch on the null does NOT trigger this branch. That was the
        superseded contract's defect.
    INCONCLUSIVE_IS_LEGITIMATE: >-
      An inconclusive result CLOSES OPEN-BATCH023-A as attempted-and-inconclusive.
      It is not dressed as support and not dressed as refutation.
    BUDGET_HALT:
      when: any ceiling below is crossed.
      disposition: failed_infrastructure_or_budget
      meaning: >-
        NOT evidence about mathematics, smoothness, HEUR-DS-1, H-SMTH-001 or
        ECDLP, per AGENTS.md rule 3. The run names the dropped work.

  controls:
    - id: CTRL-ENCA-POWER
      blocking: true
      check: the same pipeline run on ENC-A must REJECT against the null at KS2-DS-1.
      rationale: >-
        If the test cannot reject an encoding believed non-uniform, a pass on
        ENC-B is a test with no power, not evidence.
    - id: CTRL-APPARATUS-IDENTITY
      blocking: true
      check: re-running the factor-base and null generators from the frozen seed reproduces every stream digest.
    - id: CTRL-FACTOR-COMPLETE
      blocking: true
      check: the product of each recorded factorization equals its integer; incomplete factorizations are counted and reported, never silently dropped.
    - id: CTRL-PAIR-COUNT
      blocking: true
      check: the treatment arm holds exactly 130816 records and no (i,j) with j <= i.
    - id: CTRL-NULL-DICKMAN
      blocking: false
      check: >-
        report NULL-UNIF-D's own KS-DS-1 and RATE-DS-1 against Dickman.
      why_advisory_and_not_blocking: >-
        THIS IS THE REPAIR OF THE SUPERSEDED CONTRACT'S THIRD DEFECT.
        REV-20260801-012 measured a CORRECT uniform null failing analytic
        comparisons 0 of 8 at bits 16 and 0 of 8 at bits 20, because asymptotic
        rho under-predicts deep-tail smoothness at X of order 2**32 to 2**40.
        Making this control blocking would let a known finite-size property of
        an asymptotic terminate the run in APPARATUS_FAILURE before KS2-DS-1 --
        the one test never yet performed -- was ever reached. The disagreement
        is still worth SEEING, so it is measured and reported; it just may not
        stop the experiment. Instrument health is established instead by
        CTRL-ENCA-POWER, which does not depend on the asymptotic.

  deterministic_construction:
    master_seed: 4403196
    domain: EXP-SMTH-71b1b0/v1
    factor_base_rule: deterministic from (master_seed, domain, bits); re-run by CTRL-APPARATUS-IDENTITY.
    null_sampler_rule: deterministic from (master_seed, domain, bits, "null"); independent stream from the factor base.
    field_sizes_bits: [16, 20]

  budget:
    maximum_runs: 1
    maximum_resume_count: 1
    maximum_wall_seconds: 5400
    maximum_cpu_seconds: 21600
    maximum_peak_rss_bytes: 4294967296
    maximum_total_disk_bytes: 17179869184
    maximum_workers: 4
    no_network: true
    bounded_working_set_required: true
    bounded_working_set_rationale: >-
      Carried from the BATCH-029 diagnosis of RUN-SMTH-PILOT-002, which crossed
      RSS AND NOTHING ELSE: 15,368,192 bytes over a 4 GiB cap, 0.3578 percent,
      at 40.625 percent completion, on 5.4 percent of its wall ceiling and 2.0
      percent of its CPU ceiling. Peak resident memory must therefore depend on
      the shard buffer and interpreter baseline ALONE, not on records already
      produced. A pre-flight RSS probe at approximately 5, 10 and 20 percent of
      records, tolerance and margin declared before it runs, gates the full run.
    stop_semantics: >-
      Crossing any ceiling stops at the next record boundary and yields
      failed_infrastructure_or_budget, which is NOT evidence about mathematics.

  claim_ceiling: >-
    TOY TIER under every outcome. Two field sizes at 16 and 20 bits on a
    curve-specific deterministic factor base of 512 elements. No crypto-scale,
    medium-scale, affected-scheme or asymptotic claim is derivable, and no
    exponent or cost saving is claimed or claimable. Every conclusion is scoped
    to the curves, parameters, solver and budget actually used. Per
    DEC-20260731-019 ruling 3 a recollection of the literature may be used
    neither to promote NOR to dismiss any outcome.

  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    resolved_model_id: claude-opus-5
    fallback_used: true
    fallback_reason: >-
      Run under the Claude Code harness, which cannot resolve the GPT-5.6 family
      policy aliases in orchestration/model-policies.yaml; the actual resolved
      model is recorded directly per the CLAUDE.md model policy note.
    model_verified: false
    model_verified_note: the adapter probe was not run in this session, so this is false rather than assumed
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
