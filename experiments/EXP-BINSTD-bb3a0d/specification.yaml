# EXP-BINSTD-bb3a0d
# Dual-finish arithmetic. No solver timing.
# Approved by DEC-20261003-214b0b.
experiment:
  id: EXP-BINSTD-bb3a0d
  hypothesis_id: H-BINSTD-842b97
  source_idea: IDEA-20261001-5c936b
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Dual-finish floor against the ratio cap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-214b0b
  objective: >-
    Check the shortfall 20, the product 60, and the cell count 6.
  inputs:
    n_count: 3
    ell_count: 2
    cell_count: 6
    batch: 30
    ratio_num: 4
    ratio_den: 5
    dual_floor: 20
    floor_shortfall: 20
    count_24_gap: 0
    floor_miss: 1
    cap_gap: 3
    gap_product: 60
    floor_slots: 120
  controls:
    - >-
      Four times 30 is 120. Twenty times 5 is 100. Their difference
      is 20. Reporting 20 over 30 as meeting 4 over 5 invalidates
      the run.
    - >-
      Twenty-four times 5 equals 120, so that gap is 0. Twenty minus
      19 is 1. Four minus 1 is 3. The product of 20, 1, and 3 is 60.
    - >-
      Three times two is 6. Six times 20 is 120.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {floor, cap, cells}
    - route in {cross_shortfall, count_gap}
  metrics:
    primary:
      - floor_shortfall
      - gap_product
      - implementations_agree
    secondary:
      - floor_miss
      - cell_count
      - floor_slots
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The shortfall of 20 over 30 against 4 over 5 is 20. The
      product of 20, 1, and 3 is 60. The cell count is 6.
    formula: >-
      Subtract 20 times 5 from 4 times 30. Subtract 19 from 20.
      Subtract 1 from 4. Multiply those three gaps.
    source: >-
      IDEA-20261001-5c936b states the cap 0.8, the dual-finish floor
      20, and the batch 30, read 2026-10-03. The gaps were
      recomputed in this design session. That computation is not a
      run. No solver was timed.
  scale_relevance:
    tier: toy
    justification: One written cap and one written floor. No transfer to a solver.
    correspondence: null
  tail_checks:
    - The floor miss 1 and the slot count 120 are required. A check that stops at the shortfall 20 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the shortfall 20 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The floor shortfall is not 20.
    - The product is not 60.
    - The cell count is not 6.
    - A solver is timed, or 20 over 30 is reported as meeting 4 over 5.
  success_criterion: >-
    Both runs agree that 4 times 30 minus 20 times 5 is 20, that 24
    times 5 equals 120, that 20 minus 19 is 1, that 4 minus 1 is 3,
    that the product of 20, 1, and 3 is 60, and that six times 20 is
    120.
  falsification_criterion: >-
    The runs agree that 4 times 30 is 120, and 120 minus 100 is not
    20.
  required_artifacts:
    - experiments/EXP-BINSTD-bb3a0d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-bb3a0d/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-bb3a0d/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-bb3a0d/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-bb3a0d/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-bb3a0d/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver timing, Karabina encoder, or XOR-SAT run.
    - Any claim that one engine is faster.
    - Any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
