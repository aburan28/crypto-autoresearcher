# =============================================================================
# EXP-BINSTD-cfa7cf -- VERSION 1 (APPROVED by DEC-20261002-b6de45) frozen
# contract for H-BINSTD-b6eca7: absolute-Frobenius mu-orbit census +
# normal-vs-polynomial basis leaf-ratio measurement at toy n∈{13,17}.
#
# Source: IDEA-20260922-7ab503 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Unlocks IDEA-20260922-493606 (cheap m=4 Koblitz cell) and fills the
# Frobenius-stabilizer column of the RQ-BINSTD reachability table.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261002-4dc79a. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO exponent. NO n≥131 transfer.
# =============================================================================
experiment:
  id: EXP-BINSTD-cfa7cf
  hypothesis_id: H-BINSTD-b6eca7
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-7ab503
  goal_id: GOAL-ECDLP2M-001
  unlocks_ideas:
    - IDEA-20260922-493606
  version: 1
  title: >-
    Frobenius-stabilizer mu census + normal/polynomial-basis mu-orbit
    constraint leaf ratios at toy n∈{13,17}, m∈{2,3}, l∈{4..7}
  status: approved
  approved_by: DEC-20261002-b6de45
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-b6de45
    composing_decision: DEC-20261002-b6de45
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0: freeze census schema + parser-bug fixture + primary/secondary
      A,B re-derivation BEFORE any leaf-ratio run. Stage 1: cyclic-shift +
      endomorphism fixtures at n∈{13,17} (and optional composite toy).
      Stage 2: constrained vs unconstrained CNF-XOR leaf ratios in both
      bases + null/perturbed controls + certificate equality. No Stage 3
      (deployed-row fill is a zero-compute export from Stage 0/2 constants).
      No n≥131. No AUXIN provisioning.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Commit the corrected Frobenius-stabilizer mu census (with parser-bug
    certificate), prove the cyclic-shift and endomorphism identities at
    toy scale, and measure whether a mu-orbit canonical-representative
    constraint realizes ≈1/mu leaf-count reduction in a normal basis and
    ≈1 in polynomial basis on Koblitz-shaped cells — with exact
    certificate-set equality and mu=1 null no-op — thereby unlocking
    IDEA-20260922-493606 and filling the reachability-table column, or
    name a concrete falsifying / instrument outcome.

  class: heuristic_validation
  class_note: >-
    Primary class is heuristic-validation (HEUR-BINSTD-7ab503-H1/H2) with
    a zero-compute representation/census Stage 0. Not an
    exponent-moving or cost-model-measurement experiment. Carries a
    constant-factor claim only.

  scope:
    included:
      - >-
        Stage 0. Freeze census JSON schema; document subfield_scan.py
        hexblob() third-fallback regex bug with a regression fixture
        against binary-curve-params.txt; re-derive six Koblitz A,B and
        five composite-row subfield membership from primary FIPS 186-4 /
        ANSI X9.62 when reachable without AUXIN (else disclose OpenSSL
        secondary); emit per-row mu verdict table. ZERO leaf-ratio
        scientific runs in Stage 0.
      - >-
        Stage 1. At n∈{13,17} (and optional n=16·k toy composite): construct
        normal basis when affordable; verify cyclic-shift identity on
        ≥10^5 random field elements; verify endomorphism commutation on
        ≥10^5 random point pairs; report Frobenius-matrix density in the
        polynomial basis as a zero-compute proxy for H2.
      - >-
        Stage 2. Build mu-orbit canonical-representative constraint in
        each basis; run constrained vs unconstrained CNF-XOR PDP solves
        at m∈{2,3}, l∈{4..7}, ≥5 seeds: (a) Koblitz-shaped mu=n;
        (b) optional composite-shaped mu=k; (c) mu=1 null; (d) one-bit
        perturbed (a,b). Require exact certificate multiset equality;
        report leaf ratios vs preregistered bands.
    excluded:
      - Any run at deployed n ≥ 131 as an attack or transfer claim
      - Magma, Sage, cypari2 provisioning as the success path (AUXIN forbidden)
      - RQ-FROB invariant-ring rewriting of the polynomial ideal
      - Claiming break / exponent / c2pnb clearance
      - Editing IDEA-20260922-7ab503 claim text
      - Editing shared GOAL-ECDLP2M-001.yaml
      - Amazon Bedrock
      - Designing IDEA-20260922-493606 inside this contract (successor only)

  inputs:
    proposal: ledger/proposals/IDEA-20260922-7ab503.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-b6eca7.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    curve_audit_params: analysis/binstd-curve-audit/binary-curve-params.txt
    curve_audit_scan: analysis/binstd-curve-audit/subfield_scan.py
    curve_audit_readme: analysis/binstd-curve-audit/README.md
    leaf_law_citation: IDEA-20260904-3c7a91
    optional_code_refs:
      - experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
      - src/semaev_tree.py
    cells:
      stage0_census:
        koblitz_rows:
          - sect163k1
          - sect233k1
          - sect283k1
          - sect409k1
          - sect571k1
          - sect239k1
        composite_rows:
          - {name: c2pnb176v1, k: 11}
          - {name: c2pnb208w1, k: 13}
          - {name: c2pnb272w1, k: 17}
          - {name: c2pnb304w1, k: 19}
          - {name: c2pnb368w1, k: 23}
        preregistered_mu_shape:
          koblitz: 'mu = n (a,b in F_2)'
          composite: 'mu | k (a,b in F_2^16)'
          pseudorandom: 'mu = 1'
      stage1_fixture:
        n_values: [13, 17]
        sample_field_elements: 100000
        sample_point_pairs: 100000
      stage2_solve:
        n_values: [13, 17]
        m_values: [2, 3]
        l_values: [4, 5, 6, 7]
        seeds_per_cell: 5
        arms: [unconstrained, constrained_normal, constrained_polynomial]
        controls: [null_mu1, perturbed_ab]
    seeds:
      master: 20261002
      stage1_field: 202610021
      stage1_points: 202610022
      stage2_solve: [202610023, 202610024, 202610025, 202610026, 202610027]

  controls:
    - name: ctl_unconstrained_3c7a91
      stage: 2
      blocking: true
      object: >-
        Unconstrained CNF-XOR leaf count on each scored cell must lie in
        IDEA-20260904-3c7a91's (1±0.05)·2^{ml}/m! band BEFORE the
        mu-constraint ratio is accepted as evidence for H1/H2.
    - name: ctl_certificate_equality
      stage: 2
      blocking: true
      object: >-
        Constrained and unconstrained certificate multisets must be equal
        at every brute-forceable cell; any miss → O-UNSOUND.
    - name: ctl_null_mu1
      stage: 2
      blocking: true
      object: >-
        Same constraint construction on mu=1 null at matched (n,l) must
        yield leaf ratio in [0.9,1.1] in both bases.
    - name: ctl_perturbed_ab
      stage: 2
      blocking: true
      object: >-
        One-bit perturbation of (a,b) off the fixed subfield forces mu=1;
        predicted gain must vanish (ratio in [0.9,1.1]).
    - name: ctl_parser_bug_fixture
      stage: 0
      blocking: true
      object: >-
        Regression fixture: hexblob() third-fallback regex fails on
        OpenSSL "N (0xHEX)" single-byte coefficients; Koblitz A,B∈{0,1}
        must be recovered by the corrected parser or by direct params
        grep — never silently reported as "in no subfield".
    - name: ctl_cyclic_shift
      stage: 1
      blocking: true
      object: >-
        Cyclic-shift identity pass rate = 1.0 on ≥10^5 samples per toy
        field in the constructed normal basis.
    - name: ctl_endomorphism
      stage: 1
      blocking: true
      object: >-
        Endomorphism commutation pass rate = 1.0 on ≥10^5 point pairs
        where a^{2^d}=a and b^{2^d}=b.

  independent_variables:
    - name: basis
      levels: [normal, polynomial]
    - name: constraint
      levels: [off, mu_orbit_canonical]
    - name: curve_shape
      levels: [koblitz_mu_n, null_mu1, perturbed_ab, composite_mu_k_optional]
    - name: m
      levels: [2, 3]
    - name: l
      levels: [4, 5, 6, 7]
    - name: n
      levels: [13, 17]

  metrics:
    primary:
      - name: frobenius_stabilizer_mu
        definition: >-
          Per named standardized row, |Stab_Gal(a,b)| with provenance flag
          (primary_fips_ansi | openssl_secondary | audit_unaffected).
      - name: normal_basis_leaf_ratio
        definition: constrained_leaf_count / unconstrained_leaf_count in normal basis
      - name: polynomial_basis_leaf_ratio
        definition: same ratio in polynomial basis
      - name: certificate_multiset_equality
        definition: boolean exact equality of solution certificates
      - name: null_curve_leaf_ratio
        definition: constrained/unconstrained ratio on mu=1 null
    secondary:
      - name: cyclic_shift_pass_rate
      - name: endomorphism_commutation_pass_rate
      - name: frobenius_matrix_density_poly
      - name: unconstrained_leaf_count
      - name: constrained_leaf_count
      - name: termination_reason
        definition: completed | timeout | memory_abort | crash | basis_unavailable
      - name: wall_clock_seconds
      - name: peak_rss_bytes

  heuristic_under_test:
    - HEUR-BINSTD-7ab503-H1
    - HEUR-BINSTD-7ab503-H2

  preregistered_prediction:
    quantity: >-
      Leaf-count ratio under mu-orbit constraint vs unconstrained arm
    formula: >-
      H1: normal_basis_leaf_ratio ∈ [0.85,1.15]·(1/mu);
      H2: polynomial_basis_leaf_ratio ∈ [0.8,1.2]·1 and strictly above
      the normal-basis ratio; null_mu1 ratio ∈ [0.9,1.1]
    source: >-
      IDEA-20260922-7ab503 claim (D) / heuristic H1–H2, extending
      IDEA-20260904-3c7a91's N_conf=(1±ε)2^{ml}/|G| to |G|=m!·mu in
      normal basis.

  scale_relevance:
    tier: toy
    justification: >-
      Measured at n∈{13,17}, m∈{2,3}, l≤7 — brute-forceable certificate
      equality and complete DPLL/CDCL searches. Deployed-row mu values are
      census arithmetic (zero compute), not measured leaf ratios.
      Extrapolation of leaf ratios to n≥131 is NOT claimed.
    correspondence: null

  tail_checks:
    - >-
      Report the single worst-case cell's normal_basis_leaf_ratio alongside
      the median; do not average away a band violation.
    - >-
      Report whether ANY polynomial-basis cell approaches 1/mu despite the
      density prediction (informative surprise / O-POLY-REALIZES-MU).
    - >-
      Report Frobenius-matrix density per n as a zero-compute proxy for H2
      even when a full solve times out.

  replication:
    seeds: [202610023, 202610024, 202610025, 202610026, 202610027]
    independent_instances: 5

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 8
    maximum_memory_gb: 4
    maximum_runs: 24
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when census JSON + parser-bug fixture + per-row mu
      table are committed under stage0/.
    - >-
      Stage 1 complete when cyclic-shift and endomorphism pass rates are
      1.0 at n∈{13,17}, or O-IMPEDIMENT-BASIS is filed with a measured
      constructibility obstruction.
    - >-
      Stage 2 complete when every primary cell reports leaf ratios +
      certificate equality + null/perturbed controls, OR a recorded stop
      with termination_reason and measured quantity.
    - >-
      Halt Stage 2 scoring of a cell if unconstrained arm fails the
      3c7a91 band (ctl_unconstrained_3c7a91) — mark O-INSTRUMENT for that
      cell; do not score H1/H2 on it.
    - >-
      On O-UNSOUND (certificate mismatch) halt positive reading for the
      whole Stage-2 arm; export both certificate sets.

  invalidation_rules:
    - Editing preregistered prediction bands after any Stage-2 run.
    - Using Magma/Sage/cypari2 as the success path.
    - Claiming break / exponent / n≥131 transfer.
    - Filing H1 support without certificate equality and null control.
    - Silent overwrite of prior run records.
    - Amazon Bedrock use.

  success_criterion: >-
    O-SUPPORT-H1-H2 OR O-POLY-REALIZES-MU OR O-CENSUS-CORRECT (Stage-0
    census alone with Stages 1–2 blocked by a named impediment). Each is
    decidable from the frozen metrics without retuning bands.

  falsification_criterion: >-
    O-REFUTE-H1 (normal-basis ratio outside band with sound certificates
    and passing unconstrained counter) OR O-UNSOUND OR O-NULL-FAIL OR
    cyclic-shift/endomorphism failure. Decidable from frozen metrics.

  required_artifacts:
    - experiments/EXP-BINSTD-cfa7cf/stage0/census.json
    - experiments/EXP-BINSTD-cfa7cf/stage0/parser-bug-fixture.md
    - experiments/EXP-BINSTD-cfa7cf/stage0/mu-verdict-table.json
    - experiments/EXP-BINSTD-cfa7cf/stage1/cyclic-shift-report.json
    - experiments/EXP-BINSTD-cfa7cf/stage1/endomorphism-report.json
    - experiments/EXP-BINSTD-cfa7cf/stage2/leaf-ratios.json
    - experiments/EXP-BINSTD-cfa7cf/stage2/certificate-equality.json
    - experiments/EXP-BINSTD-cfa7cf/stage2/null-perturbed-controls.json
    - experiments/EXP-BINSTD-cfa7cf/RESULTS.md
    - experiments/EXP-BINSTD-cfa7cf/runs/<RUN-BINSTD-*>/manifest.yaml
    - experiments/EXP-BINSTD-cfa7cf/runs/<RUN-BINSTD-*>/raw-result.json
    - experiments/EXP-BINSTD-cfa7cf/runs/<RUN-BINSTD-*>/stdout.txt
    - experiments/EXP-BINSTD-cfa7cf/runs/<RUN-BINSTD-*>/stderr.txt

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
