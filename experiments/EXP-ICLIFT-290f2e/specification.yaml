experiment:
  id: EXP-ICLIFT-290f2e
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-ICLIFT-4d4384
  question_id: RQ-XEDN-001
  goal_id: GOAL-ICLIFT-001
  idea_id: IDEA-20260805-64aef4
  title: >-
    Section-incidence over-dispersion census on the frozen xedni family: measure
    g_eff = 1 + (F2 - lambda^2)/lambda on both residue branches, with the
    p = 2 mod 3 branch as a matched null whose forced value is exactly 1

  objective: >-
    Answer, with a measured number, the objection DEC-20260724-021 recorded as
    fatal and left unaddressed: RT-5, that the census measured the uniform
    per-slot section density while the attack constructs its surface through
    prescribed points. Under the constructed measure the FIRST section is free,
    so the operative quantity is the conditional abundance of a SECOND section,
    which is exactly F2/lambda^2 -- the second factorial moment of the
    per-surface section-count distribution divided by the square of its mean.
    The census enumerated the histogram that determines it and reported only the
    mean and a tail. Secondary objective: supply this route with the matched null
    it has never had, namely the primes p = 2 mod 3, where mu_3 is absent from
    F_p and the forced value of the over-dispersion factor is exactly 1, and with
    an in-population planted positive control, which EV-XEDN-001 records the
    predecessor package as lacking.

  what_this_is_not:
    - Not an ECDLP attack, a lift, a relation computation, or a discrete-logarithm computation of any kind.
    - Not a cost, runtime, speedup, asymptotic, exponent, crypto-scale, or deployed-scheme claim.
    - Not a re-measurement of the lift probability and not a revision of the exact identity P_lift(p) = (1 - 2/p + p^-3)/(2p^3); that identity is treated as established within its stated scope and is used only as an instrument check.
    - Not a closure of candidate B2, of function-field xedni, of non-isotrivial families, of higher-degree section shapes, or of number-field xedni. None of the eleven sentences DEC-20260724-021 forbids is asserted.
    - Not a measurement of Mordell-Weil rank, of relation independence, or of relation coefficients; it does not touch the EXP-XEDN-003..007 lineage or GOAL-XEDN-001/002/003.
    - Not evidence. No approval exists, no execution authorization exists, and no run has occurred.
    - Not an edit to any existing record or artifact. Every archived file named below is opened READ ONLY.

  claim_ceiling:
    tier: toy
    scope: >-
      A run under this contract could support, at most: that on the frozen family
      y^2 = x^3 + b(t) over F_p with deg b = 6 exactly, under the frozen
      is_square_poly predicate and the two frozen slot conventions, at
      p in {5, 7, 11, 13, 17, 19} (23 best-effort), the over-dispersion factor
      g_eff takes the values measured, with a per-branch slope versus log p whose
      interval does or does not include 0. It could NOT support any statement
      about Mordell-Weil independence, about usability of the counted sections
      for an attack, about any p outside the tested set, about non-isotrivial
      families, or about cryptographic scale. Toy evidence is never crypto-scale
      evidence (AGENTS.md rule 7).

  scale_relevance:
    tier: toy
    justification: >-
      Every measured quantity is an exact count over a fully enumerated family at
      p <= 23. Nothing is extrapolated: the boundedness verdict is a statement
      about the tested primes only, and the contract requires three primes per
      residue branch precisely so that "bounded" is not asserted from two points,
      which any two points trivially satisfy. Conclusions do not transfer to
      larger p, and the report must say so beside every number.
    correspondence: null

  environment_declaration:
    verified_in_session: >-
      numpy 2.4.6 imports successfully in this container; sympy and Sage do NOT
      (both raise ModuleNotFoundError). PyYAML 6.0.1 is present. Recorded because
      the contract must not silently assume a computer-algebra system.
    requirement: >-
      Pure Python plus numpy only, no solver, no network. F_p[t] arithmetic is
      implemented directly on coefficient tuples. If a stage is found to need a
      CAS, that is an INFRASTRUCTURE REQUEST and is reported as such, never as a
      mathematical result (AGENTS.md rule 5).

  inputs:
    family: "y^2 = x^3 + b(t) over F_p, b of degree exactly 6"
    family_size_identity: "(p-1) * p^6"
    predicate: >-
      The frozen EXP-XEDN-001 is_square_poly predicate: x^3 + b must be a nonzero
      square in F_p[t] with squarefree square root, and the y = 0 section is
      excluded. The predicate is used as frozen; its known property (that it
      implicitly requires the root to be squarefree, and that relaxing it
      multiplies P_lift by 1.2303 at p = 5 and 1.0100 at p = 101 without changing
      any exponent) is recorded and NOT altered.
    section_shape: "deg x <= 2, deg y <= 3"
    slot_conventions: [monic_deg2, free_deg_le2]
    primes_null_branch: [5, 11, 17]
    primes_null_branch_best_effort: [23]
    primes_treatment_branch: [7, 13, 19]
    branch_rule: "p = 2 mod 3 is the null branch (mu_3 not in F_p); p = 1 mod 3 is the treatment branch"
    enumeration_method: >-
      Fibering over sections: enumerate all (x, y) of the frozen degree shapes,
      form b := y^2 - x^3, retain only those with deg b = 6 exactly, and
      accumulate a per-b slot count. This is the census's own method and is used
      so the reproduction arm is a genuine reproduction. The enumeration size is
      exactly p^7 pairs in the free-x convention.
    memory_policy: >-
      A DENSE bucket table over b would be O((p-1)p^6) counters -- 1.9e8 at
      p = 17 and 8.9e8 at p = 19 -- which exceeds the memory budget. The
      implementation MUST count by streaming: sort or hash-partition the induced
      b values in chunks and accumulate the histogram of counts per distinct b.
      The chosen method, its peak memory and its chunk size are recorded.
    master_seed: 20260805
    seed_derivation_rule: >-
      The primary arms are EXHAUSTIVE and therefore seed-free; every count is
      deterministic given (p, convention, predicate). Seeds are used only for
      (i) the sampling of surfaces entering the orbit-verification arm and
      (ii) the choice of planted control instances. For those,
      seed = int.from_bytes(SHA-256(ASCII of "EXP-ICLIFT-290f2e/v1|" + arm_id +
      "|" + str(p) + "|" + convention + "|" + str(index) + "|" +
      str(master_seed))[:8], "big"), keying a Python random.Random. Every seed
      and every sampled surface's b coefficient vector is written to the manifest
      so a third party reproduces the sample exactly.
    archived_artifacts_read:
      - experiments/EXP-XEDN-002/runs/RUN-XEDN-002-C/raw-result.json
      - experiments/EXP-XEDN-002/runs/RUN-XEDN-002-C/manifest.yaml
      - experiments/EXP-XEDN-002/derivation.md
      - experiments/EXP-XEDN-002/analysis.md
    archived_artifacts_note: >-
      READ ONLY, and the census implementation under
      experiments/EXP-XEDN-002/implementation/ IS DELIBERATELY NOT IMPORTED. The
      reproduction arm must be written independently; importing the census code
      would make the reproduction circular and would forfeit the only guarantee
      that matters here.

  stages:
    - id: S0
      name: archived second moment
      cost: reading one committed JSON file plus about 64 multiplications
      terminating: true
      description: >-
        From the archived histogram_slots_per_surface arrays at p = 5, 7, 11, 13
        in both conventions, compute lambda, F2 = E[s(s-1)], F2/lambda^2 and
        g_eff = 1 + (F2 - lambda^2)/lambda. Check the branch separation against
        the pre-registered prediction. IF THE p = 2 MOD 3 BRANCH DOES NOT RETURN
        g_eff WITHIN 0.05 OF 1, THE NULL HAS FAILED AND EVERY LATER STAGE IS
        SUSPENDED pending a superseding record against KN-FIND-003's mu_3
        attribution. This stage costs essentially nothing and can end the line.
    - id: S1
      name: independent reproduction at p <= 13
      cost: minutes
      terminating: false
      description: >-
        Re-enumerate the per-surface histograms at p = 5, 7, 11, 13 in both
        conventions WITHOUT importing census code, and compare BIN FOR BIN
        against the archived arrays. Also recompute the identities
        n_surfaces = (p-1)p^6, N_slots = (p-1)p^8, section points exactly twice
        slots, and the closed-form total N_hit. Any bin-level disagreement
        suspends everything downstream and IS the deliverable.
    - id: S2
      name: branch extension
      cost: bounded; the binding resource is the p^7 enumeration and its memory
      terminating: false
      description: >-
        Extend the enumeration to p = 17 (null branch) and p = 19 (treatment
        branch), giving three primes per branch, and attempt p = 23 (null branch)
        best-effort only. Report g_eff per prime per convention and the
        per-branch slope versus log p with a jackknife interval over that
        branch's primes.
    - id: S3
      name: mechanism arm
      cost: minutes
      terminating: false
      description: >-
        On a seeded sample of surfaces with s >= 3 at each treatment-branch
        prime, verify by the group law over F_p(t) whether the counted sections
        form orbits under (x, y) -> (w x, y) with w^3 = 1, i.e. whether
        S + wS + w^2 S = O, and report the ORBIT-SIZE DISTRIBUTION. Compare the
        measured g_eff against the value implied by that distribution under
        HEUR-ICL-X1. THE MIXTURE IS MEASURED, NEVER FITTED: reporting a fitted
        orbit size as though it were derived is an invalidation condition.
    - id: S4
      name: RT-5 readout
      cost: seconds, from the histograms already computed
      terminating: false
      description: >-
        Report Pr[>= 2 sections | >= 1 section] and its ratio to the
        unconditional Pr[>= 2 sections], per prime per convention. This is the
        number RT-5 needed and nobody has computed.
    - id: S5
      name: pattern-count instrument check
      cost: seconds at p = 5, 7
      terminating: false
      description: >-
        Independent of the moments, and imported from IDEA-20260805-e5dd09 as an
        instrument check that can fail: enumerate all b of degree exactly 6 at
        p = 5 and 7, classify by root-multiplicity pattern over the algebraic
        closure, and compare against the closed forms Pr[squarefree] = 1 - 1/p
        and Pr[pattern in {(5,1),(4,2),(3,3)}] = 3(p-1)/p^5. Additionally report
        the induced pattern distribution of b := y^2 - x^3 over the enumerated
        sections against the uniform one, which is the validation of HEUR-ICL-R1
        and costs no extra pass.
  cheapest_decisive_stage: >-
    S0. It reads one committed file, performs about 64 multiplications, and can
    terminate the entire line by failing the null. Nothing in this contract is
    worth running if S0's null fails, and S0's null is the only genuinely new
    control this route has ever had.

  independent_variables:
    - prime p
    - residue branch of p modulo 3 (the null-versus-treatment contrast)
    - slot convention (monic_deg2 versus free_deg_le2)
    - counting unit (slots versus section points, which differ by exactly a factor 2)

  controls:
    - the p = 2 mod 3 branch as the matched null, forced value g_eff = 1
    - an in-population planted mu_3 orbit as the positive control
    - the graded control of three primes per branch with monotonicity reported
    - the ordering control (null branch committed before the treatment branch is read)
    - four independent instrument identities that can each fail
    - the pattern-count check of S5, whose forced values are exact rationals

  arms_and_controls:
    treatment:
      - id: A-TREAT
        description: >-
          Exhaustive per-surface section-count histogram at p = 7, 13, 19
          (p = 1 mod 3), both conventions, and the derived g_eff.
    measured_null:
      - id: N-BRANCH
        description: >-
          The identical enumeration at p = 5, 11, 17 (p = 2 mod 3), same family,
          same predicate, same code, same degree shapes. The ONLY difference is
          that mu_3 is not contained in F_p.
        forced_value: >-
          g_eff = 1.000 EXACTLY, derived before the run from the absence of the
          cube roots of unity and from the identity g_eff = g for free orbits of
          size g. Tolerance |g_eff - 1| <= 0.05 at every prime on the branch.
          THIS NULL CAN FAIL, and a failure is more informative than a pass: it
          would refute the mu_3 attribution that KN-FIND-003 records.
      - id: N-POISSON
        description: >-
          The arithmetic null for the same histograms: F2 = lambda^2 exactly, the
          independent-incidence value.
        forced_value: >-
          F2/lambda^2 = 1. Reported per prime per convention as a second column
          beside the measured value, so the over-dispersion is always visible as
          a ratio to an explicit null rather than as a bare statistic.
    positive_control:
      - id: P-PLANT
        description: >-
          An IN-POPULATION planted surface at a treatment-branch prime: take a
          section (x, y) of the frozen degree shape, form b := y^2 - x^3 (which
          lies inside the census family by construction, unlike the inherited
          EXP-XEDN-001 planted surface, which has deg b = 5 and lies outside it --
          a defect EV-XEDN-001 records against the predecessor package), apply
          (x, y) -> (w x, y) with w^3 = 1 to generate the orbit, and require the
          enumerator to find all three members and the group-law check to verify
          S + wS + w^2 S = O.
        blocking_rule: >-
          IF THE INSTRUMENT DOES NOT RECOVER THE PLANTED ORBIT AND VERIFY THE
          RELATION, IT IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY
          ARM (inventor protocol section 3; AGENTS.md rule 5).
    graded_control:
      - id: G-PRIME
        description: >-
          Three primes per branch (5, 11, 17 and 7, 13, 19), so a slope and a
          jackknife interval exist WITHIN each branch.
        forced_shape: >-
          Flat within each branch. The report states, per branch, whether g_eff
          is monotone in p and where any single prime departs, so a failure
          localises to a prime instead of leaving "it did not work". A verdict of
          "bounded" may NOT be issued from two primes on a branch: any two points
          are bounded, and that is the quantifier trap the graded control exists
          to close.
    ordering_control: >-
      The null branch (N-BRANCH, all of p = 5, 11, 17) is computed, serialized
      and SHA-256-hashed, and the decision rule is executed on it, BEFORE any
      treatment-branch histogram is opened. If the rule emits the same verdict on
      both branches it discriminates nothing and must be rewritten before the
      treatment arm is read.
    comparability_policy: >-
      Every prime is processed by the identical code path, the identical
      predicate, the identical degree shapes and the identical convention
      handling. Branches differ only in p mod 3. Slots and points are reported as
      separate columns and are never mixed within a moment; conflating them is
      the specific arithmetic error the confounder list names.

  metrics:
    primary:
      - id: X1-GEFF
        definition: >-
          g_eff(p, convention) = 1 + (F2 - lambda^2)/lambda, where lambda and F2
          are the first and second factorial moments of the per-surface slot
          count over the whole family.
      - id: X2-SLOPE
        definition: >-
          Ordinary least-squares slope of g_eff versus log p, fitted SEPARATELY
          within each residue branch, with a leave-one-prime-out jackknife
          interval.
      - id: X3-REPRO
        definition: >-
          Number of histogram bins disagreeing between the independent
          enumeration and the archived arrays at p = 5, 7, 11, 13, per
          convention. Target 0.
    secondary:
      - id: X4-OVERDISP
        definition: F2/lambda^2 per prime per convention, reported beside the null value 1.
      - id: X5-RT5
        definition: >-
          Pr[>= 2 sections | >= 1 section] divided by Pr[>= 2 sections], per
          prime per convention.
      - id: X6-ORBITS
        definition: >-
          Distribution of verified orbit sizes among sampled surfaces with
          s >= 3, and the g_eff implied by that distribution under HEUR-ICL-X1.
      - id: X7-IDENTITIES
        definition: >-
          Boolean results of the four instrument identities: n_surfaces =
          (p-1)p^6; N_slots = (p-1)p^8; section points exactly 2 x slots; total
          hits equal to the closed form.
      - id: X8-PATTERNS
        definition: >-
          Measured squarefree fraction and rank-0 pattern fraction at p = 5, 7,
          against 1 - 1/p and 3(p-1)/p^5; plus the induced-versus-uniform pattern
          density ratio for b := y^2 - x^3.

  heuristic_under_test: HEUR-ICL-X1

  preregistered_prediction:
    quantity: >-
      The over-dispersion factor on each residue branch, the per-branch slope,
      and the exact instrument identities and pattern fractions.
    formula: >-
      g_eff := 1 + (F2 - lambda^2)/lambda, with F2 = E[s(s-1)];
      free orbits of size g under a Poisson orbit count force
      F2 = lambda^2 + (g-1)*lambda and hence g_eff = g exactly;
      mu_3 is contained in F_p iff p = 1 mod 3, so on the branch p = 2 mod 3 the
      forced value is g_eff = 1 EXACTLY;
      on the branch p = 1 mod 3 the orbit model forces g_eff >= 3, and the
      hypothesis additionally predicts g_eff <= 50 and a per-branch slope versus
      log p whose jackknife interval includes 0;
      n_surfaces = (p-1)p^6 and N_slots = (p-1)p^8 exactly;
      Pr[b squarefree] = 1 - 1/p exactly;
      Pr[b of pattern (5,1), (4,2) or (3,3)] = 3(p-1)/p^5 exactly.
    source: >-
      Derived in H-ICLIFT-4d4384 and IDEA-20260805-64aef4 from the definition of
      the factorial moments, the identity E[gK(gK-1)] = lambda^2 + (g-1)lambda
      for K Poisson, and elementary counting of polynomial factorisation
      patterns. The pattern forced values are imported from IDEA-20260805-e5dd09.
      No external theorem is cited and, for these predictions, none is needed.
      A SESSION-SIDE READING OF THE ARCHIVED HISTOGRAM PERFORMED OUTSIDE THE
      HARNESS -- NOT A RUN, NOT EVIDENCE -- gave g_eff = 0.992 / 5.096 / 1.017 /
      5.483 (free-x) and 1.034 / 8.144 / 1.032 / 8.294 (monic-x) at p = 5, 7, 11,
      13; it is recorded here as the reason the contract is worth running and as
      the reproduction target for S1, and it may not be cited as a result by
      anyone until S1 reproduces it in-harness.

  tail_checks:
    - >-
      The orbit model predicts g_eff in {3, 6}; the archived reading lies
      strictly between. The report must state the discrepancy and identify its
      source in S3 rather than choosing whichever model is nearer. A fitted
      orbit size reported as a derived one is an invalidation condition.
    - >-
      The maximum slot count per surface should be consistent with the branch:
      the archived arrays show max 4 at p = 5 and 11 versus 36 and 63 at p = 7
      and 13. If the extension primes break that pattern (a p = 2 mod 3 prime
      with a large maximum), the branch mechanism is wrong and the whole
      interpretation must be revisited before any verdict.
    - >-
      Slots and points must satisfy points = 2 x slots exactly at every prime.
      A violation means the y -> -y accounting is wrong and every moment is
      suspect.

  replication:
    seeds: [20260805, 20260806, 20260807]
    independent_instances: 6

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 8

  stopping_rules:
    - >-
      Stop at S0 if the p = 2 mod 3 branch fails its forced value; report the
      null failure as the result and suspend every later stage.
    - >-
      Stop after S1 if any histogram bin disagrees with the archived array; the
      disagreement is the deliverable and nothing downstream is interpretable.
    - >-
      Stop after S3 if the planted positive control fails; no negative may be
      reported from any arm.
    - >-
      Stop at the wall-clock, CPU or memory budget. A budget stop is reported as
      a budget stop with the completed primes listed. p = 23 is declared
      best-effort in advance and its omission is NOT a negative result.
    - >-
      Do not add primes, conventions, section shapes, families or degree shapes
      beyond those declared. In particular, do NOT enter the non-isotrivial
      family or any deg b = 10 or deg x <= 3 shape; those belong to
      GOAL-XEDN-001/002/003 and entering them here would duplicate another goal.

  invalidation_rules:
    - id: J1
      rule: >-
        Any violation of the four instrument identities in X7 invalidates that
        prime's cell entirely; the cell is repaired before anything else is read.
    - id: J2
      rule: >-
        Any bin-level disagreement with the archived histograms at p <= 13
        invalidates every downstream metric until reconciled.
    - id: J3
      rule: >-
        Importing any function from experiments/EXP-XEDN-002/implementation/ into
        the reproduction arm invalidates the reproduction, which is then reported
        as NOT INDEPENDENT.
    - id: J4
      rule: >-
        Reporting an orbit size fitted to the measured g_eff, rather than
        measured by group-law verification, invalidates the mechanism arm.
    - id: J5
      rule: >-
        Issuing a boundedness verdict for a branch on fewer than three completed
        primes invalidates that verdict.
    - id: J6
      rule: >-
        Any write, move or modification of a file outside
        experiments/EXP-ICLIFT-290f2e/ invalidates the whole package as a scope
        violation.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing dependency, or unreadable archived
    artifact is INFRASTRUCTURE SIGNAL, recorded with the exact command, exit
    status, peak memory and completed prime list. IT IS NEVER NEGATIVE
    MATHEMATICAL EVIDENCE ABOUT THE HYPOTHESIS (AGENTS.md rule 5). Concretely:
    the p^7 enumeration is 4.1e8 pairs at p = 17, 8.9e8 at p = 19 and 3.4e9 at
    p = 23; if p = 19 does not complete inside the budget, the treatment branch
    has only two primes, J5 forbids a boundedness verdict for it, and the correct
    report is "insufficient primes on the treatment branch, verdict withheld" --
    not "bounded" and not "unbounded". If p = 17 does not complete, the same
    applies to the null branch. A censored prime is reported as censored with its
    parameters beside every affected number.

  success_criterion: >-
    ALL of the following: (1) S0 executes and the p = 2 mod 3 branch returns
    |g_eff - 1| <= 0.05 at p = 5 and p = 11 in both conventions; (2) S1
    reproduces every archived histogram bin for bin with X3-REPRO = 0 and all
    four instrument identities hold at every prime; (3) at least three primes
    complete on EACH branch; (4) the planted positive control P-PLANT is
    recovered and its relation verified; (5) X2-SLOPE is reported per branch with
    a jackknife interval, and the interval INCLUDES 0 on both branches, which is
    the hypothesis's predicted outcome; (6) S5's pattern fractions match
    1 - 1/p and 3(p-1)/p^5 exactly at p = 5 and 7.
  falsification_criterion: >-
    ANY of the following falsifies H-ICLIFT-4d4384 as stated and must be reported
    as such rather than reinterpreted: (a) g_eff >= 1.5 at any prime on the
    p = 2 mod 3 branch, which refutes the mu_3 attribution and obliges a
    superseding record against KN-FIND-003's mechanism claim; (b) g_eff < 3.0 at
    any prime on the p = 1 mod 3 branch; (c) a per-branch slope whose jackknife
    interval excludes 0 upward with magnitude >= 0.5, which means the conditional
    advantage grows, RT-5 becomes fatal in substance, and the closure recorded
    for this route must be revisited; (d) g_eff > 50 at any tested prime;
    (e) failure of S5's exact pattern fractions, which would falsify the counting
    imported from IDEA-20260805-e5dd09 without bearing on the moments.

  required_artifacts:
    - the S0 computation, with the archived arrays quoted verbatim beside the derived moments
    - the SHA-256 of the serialized null-branch results, recorded before any treatment-branch histogram was opened
    - the full independently recomputed per-surface histograms at every completed prime, both conventions
    - the four instrument-identity results per prime
    - the per-branch slope and jackknife interval, with the primes used
    - the orbit-size distribution with group-law verification transcripts and counts
    - the RT-5 readout table
    - the S5 pattern-count table and the induced-versus-uniform density ratios
    - exact command lines, seeds, git commit, dirty-tree state, environment versions, wall clock, peak memory and the enumeration size p^7 per prime
    - an explicit statement of which stage terminated the run, if any, and why

  reporting_obligations:
    - >-
      Every report of g_eff must carry, in the same sentence, that conditional
      abundance is not usability: sections generated by an automorphism orbit are
      exactly the ones the attack cannot use.
    - >-
      Report both conventions always. EV-XEDN-001 records that the census's own
      multi-section margin flipped between them; no verdict may rest on one.
    - >-
      Report the residual measure gap (HEUR-ICL-X2) beside the RT-5 readout:
      conditioning on "carries a section" is weaker than the attack's
      conditioning on "carries a section through a prescribed point at a
      prescribed place", and the honest closing of that gap is an exact two-point
      prescribed count, which this contract does NOT perform.
    - >-
      Report, without editing anything, the record-integrity observation that
      ledger/goals/GOAL-ICLIFT-001.yaml's checkpoints cite DEC-20260724-007/008/
      009 while the decisions carrying this goal's content are DEC-20260724-020,
      -021 and -022; the cited ids resolve to unrelated records. This is a
      citation-resolution defect for the Coordinator, not a mathematical finding.
    - >-
      Report, without editing anything, the three-way inconsistency between the
      relayed Shioda-Tate bound r <= 8 recorded in RUN-XEDN-002-C's
      shioda_tate_requirement field ("literature; not recomputed here"), the
      polarisation Gram ranks 9-12 recorded in EV-XEDN-002, and the assumed
      rationality of these surfaces. Report it; do not adjudicate it, and do not
      let any metric here depend on it.

  assigned_to: executor
  approved_by: null
  review_notes: >-
    Submitted for Coordinator review only. status is review_required, frozen is
    false, execution_authorized is false, evidence_eligible is false, and
    approved_by is null and must remain null until a Coordinator sets it
    (AGENTS.md rule 1). No run has occurred and no evidence exists. Stage S0
    reads a committed artifact and performs arithmetic on it; its outputs are
    measurements of this program's own archive, not new mathematical claims, and
    they become evidence only through the normal review path.
