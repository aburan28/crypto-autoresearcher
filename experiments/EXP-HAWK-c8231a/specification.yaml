experiment:
  id: EXP-HAWK-c8231a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-HAWK-a28be6
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  batch_id: null
  batch_id_note: >-
    No batch is assigned; GOAL-HAWK-001's BATCH-002 is closed and its record
    states that a conforming BATCH-003 dispatch queue is owed before any batch
    that dispatches workers. This contract is a design for a future batch.

  title: >-
    The involution census, the third cocycle, and the nearby conductors: a
    zero-compute decisive gate followed by two measured arms on an inherited
    instrument

  objective: >-
    If separately approved, frozen and authorized: (1) enumerate the order-2
    elements of (Z/m)^x for every conductor 3 <= m <= 2000 and compare against
    the closed form 2^{r+delta}, extracting the unique-involution set, the gap
    set, and the 2-power involution triples; (2) using the frozen instrument of
    EXP-HAWK-a2f34a with only the involution and the conductor varied, compare
    the tau and c*tau cocycle lattices at n = 8 and 16 under a decision rule
    frozen before computation; (3) run the same instrument at the nearby
    non-2-power conductors m = 12, 20, 28, 36, 44 and report which of the four
    forced values survive. STAGE 1 IS DECISIVE, COSTS SECONDS, NEEDS NO KEY, NO
    LATTICE AND NO EXTERNAL SOURCE, AND CAN END THE CONTRACT.

  what_this_is_not:
    - >-
      Not an attack, not a key-recovery claim, and not an assessment of HAWK's
      security in either direction.
    - >-
      NOT AN APPLICABILITY MAP. A census row says a conductor admits a second
      order-2 lens; it does NOT say the disclosed attack works there. The
      necessary/sufficient separation is derived in H-HAWK-a28be6 (P3) and every
      output must carry it.
    - >-
      Not a recommendation for or against any HAWK Round-3 parameter change.
      The 2026-08-14 tweak deadline recorded in KN-OPEN-028 makes the question
      timely; it licenses no advice from an unrun contract.
    - >-
      Not a proof of isometry or non-isometry between any two lattices. Five
      matching invariants do not prove GL_n(Z)-equivalence; a matching verdict
      is reported as "not distinguished by five invariants".
    - >-
      Not a closure of any lens class beyond ORDER-2 GALOIS lenses. Order-4
      lenses, non-Galois module symmetries, and the gap-set conductors are named
      open and are not touched.
    - >-
      Not an approval, freeze, authorization, run, observation or evidence. No
      number here was measured. The twenty conductors spot-checked while
      drafting H-HAWK-a28be6 were a drafting check with no manifest and are NOT
      citable.

  claim_ceiling: >-
    TIER: toy. Exact supportable scope on completion: an exhaustive involution
    census over 3 <= m <= 2000 with its closed-form comparison; an exhaustion
    statement for order-2 Galois lenses over 2-power cyclotomic fields; and, at
    n <= 32 on one instrument lineage, a five-invariant comparison of two
    cocycle lattices and a per-conductor survival table for four forced values
    at five named non-2-power conductors. NOTHING ABOVE toy MAY BE ASSERTED. In
    particular no conductor may be described as vulnerable or safe, no SVP
    dimension may be priced, and no statement about deployed HAWK parameters may
    be made. AGENTS.md rule 7 and RQ-HAWK-001's claim_tier_ceiling apply.

  dependency:
    on: EXP-HAWK-a2f34a
    nature: HARD PRECONDITION for stages 2 and 3, none for stage 1.
    condition: >-
      Stages 2 and 3 may not execute unless EXP-HAWK-a2f34a has been approved,
      executed, and its positive control PC-1 has passed 20/20 at m = 2^ell.
      REASON: if PC-1 fails, the instrument constructs an unknown object, and a
      failure of the forced values at m = 4p would be indistinguishable from an
      instrument fault -- which is precisely the situation in which
      docs/inventor-protocol.md section 3 forbids reporting a negative. Stage 1
      is independent of this dependency and may run alone.

  inputs:
    census:
      m_range: [3, 2000]
      enumeration: >-
        For each m, iterate t over 1..m-1, retain t with gcd(t, m) = 1 and
        (t*t) mod m == 1. Record the retained set in ascending order.
      closed_form: >-
        predicted_count(m) = 2^{r + delta}, where r = number of distinct odd
        primes dividing m and delta = 0 if v_2(m) <= 1, 1 if v_2(m) == 2, 2 if
        v_2(m) >= 3. The number of INVOLUTIONS is predicted_count(m) - 1.
      derived_sets:
        unique_involution_set: "{m : predicted_count(m) == 2}"
        gap_set: "{m : predicted_count(m) >= 4 and m mod 4 != 0}"
        two_power_triples: "for m in {8, 16, 32, 64, 128, 256, 512, 1024, 2048 intersect range}: the retained set minus {1}"
      deduplication_note: >-
        Q(zeta_m) = Q(zeta_{2m}) for odd m. The census reports the RAW per-m
        table and, separately, a deduplicated table keyed by field. It does NOT
        silently deduplicate, because the construction's requirement (4 | m) is
        a statement about the chosen conductor presentation while the evasion
        criterion is a statement about the field, and conflating them is the
        error this contract exists to avoid.
    lattice_arms:
      instrument: >-
        The frozen_lattice_definition of EXP-HAWK-a2f34a, UNCHANGED, with
        exactly two substitutions: (i) tau replaced by the involution under
        test, everywhere including in c*tau; (ii) R_n replaced by
        Z[x]/(Phi_m(x)) with Phi_m the m-th cyclotomic polynomial and n = phi(m)
        for the non-2-power arm. NO OTHER CHANGE IS PERMITTED, and a run that
        needs one must record a protocol_amendment rather than make it.
      two_power_arm:
        conductors: [8, 16, 32, 64]
        n_values: [4, 8, 16, 32]
        involutions: [tau, c_tau]
        keys_per_cell: 20
      nearby_arm:
        conductors: [12, 20, 28, 36, 44]
        n_values: [4, 8, 12, 12, 20]
        involutions: [tau]
        keys_per_cell: 20
        why_these: >-
          They are the smallest conductors satisfying 4 | m and m not a power of
          two, i.e. the closest objects to HAWK's fields at which tau still
          exists and at which the exact orthogonal splitting is expected to FAIL
          (HEUR-CENSUS-3). This is the nearby-object control of
          docs/inventor-protocol.md section 8 audit 4. THESE ARE NOT HAWK
          PARAMETER SETS.
      degenerate_control:
        conductor: 4
        expectation: >-
          tau = c, so no second lens exists. The instrument must REPORT THE
          DEGENERATE CASE explicitly rather than emit a number. Silently
          producing a value here is invalid_measurement.
    key_generation: >-
      Identical to EXP-HAWK-a2f34a: B is a product of six elementary matrices
      over the ring, each of determinant 1, with coefficients in {-1, 0, 1} drawn
      by the seed rule below. No NTRU solve, no reduction, no rejection.
    master_seed: 20260805
    domain: EXP-HAWK-c8231a/v1
    seed_derivation_rule: >-
      Identical in form to EXP-HAWK-a2f34a: SHA-256 of the ASCII string
        domain || "|" || label || "|" || decimal(m) || "|" || arm || "|" ||
        decimal(t) || "|" || decimal(master_seed),
      bytes consumed big-endian, one per coefficient, t incremented on
      exhaustion. NOTE THAT THE CONDUCTOR m, NOT THE DEGREE n, KEYS THE STREAM,
      so that m = 36 and m = 28 (both n = 12) do not collide. A third party
      reproduces every instance from (domain, label, m, arm, t, master_seed).
    stream_labels: [key, selfpair]

  arms_and_controls:
    treatment_stage1: >-
      The full census: enumerated involution count versus closed form at every
      m in [3, 2000]; the three derived sets.
    treatment_stage2: >-
      C5: the five invariants (rank, Gram determinant, theta at n/4, n/2, 3n/4)
      of Lambda_B^(tau) and Lambda_B^(c tau) at m = 16 and 32, over 20 keys.
    treatment_stage3: >-
      C6: which of the four forced values of H-HAWK-c7a551 survive at
      m = 12, 20, 28, 36, 44; and C7: lambda_1^2 against the derived bound n/4
      on both conductor families.
    measured_null: >-
      NULL-A (matched null for the census, FORCED VALUE DERIVED PRE-RUN, CAN
      FAIL). Run the IDENTICAL enumeration procedure on the ADDITIVE group Z/m:
      count t in 0..m-1 with (2*t) mod m == 0. FORCED VALUE: exactly gcd(2, m),
      i.e. 1 for odd m and 2 for even m, WITH NO DEPENDENCE on the number of odd
      prime factors. If the procedure returns 2^{r+delta} on the additive group,
      it is responding to m's factorisation through a bug and not through the
      group law, and the whole census is void. This null is matched in shape
      (same loop, same modulus, same range) and differs only in the operation,
      which is what makes it a null rather than a decoration.
    positive_control_A: >-
      PC-A (must fire). At m = 8, 16, 32, 64 the enumerator must return exactly
      {1, m-1, m/2+1, m/2-1}; each of the three non-identity residues must be a
      unit, must square to 1 mod m, and the three must be pairwise distinct. If
      the enumerator misses any, the instrument is broken and NO census may be
      reported.
    positive_control_B: >-
      PC-B (inherited, must fire). EXP-HAWK-a2f34a's PC-1 must have passed
      20/20 at m = 2^ell. IF IT HAS NOT, STAGES 2 AND 3 DO NOT RUN AND NO
      NEGATIVE ABOUT ANY CONDUCTOR OR ANY INVOLUTION MAY BE REPORTED.
    self_pair_control: >-
      C9 (must fire, run BEFORE C5). Apply the five-invariant decision rule to
      Lambda^(tau) computed from two INDEPENDENTLY generated keys at the same m.
      It must return EQUIVALENT at 20/20 pairs. If it ever returns "distinct" on
      the self-pair, the rule is measuring key-to-key variation and cannot
      decide C5; C5 is then not run and is reported as undecidable by this rule.
    graded_control: >-
      TWO GRADED DIRECTIONS, each with at least three interior points, and
      monotonicity reported for both.
      (i) BY DEGREE at fixed family: C7 measures lambda_1^2 at m = 16, 32, 64
      (n = 8, 16, 32) and at m = 20, 28, 44 (n = 8, 12, 20). The forced value
      n/4 SCALES with n, so this is a quantity that must move; a lambda_1^2 that
      does not track n/4 is the canonical artifact tell.
      (ii) BY DISTANCE FROM 2-POWER: C6 grades across m = 12, 20, 28, 36, 44 and
      must report WHICH forced value fails FIRST at each -- determinant
      (covolume) or theta (splitting) -- because that localises the obstruction
      instead of leaving "it did not work".
    ordering_control: >-
      NULL-A and PC-A are executed, recorded and SHA-256 hash-committed before
      the census treatment table is inspected. C9 is executed and committed
      before C5. The frozen C5 decision rule is applied to the self-pair first.
      Absence of either commitment is invalid_measurement.
    comparability_policy: >-
      Comparison to EXP-HAWK-a2f34a is permitted ONLY for cells naming the same
      conductor, involution and arm, and ONLY because the instrument definition
      is shared verbatim; the shared master_seed does NOT imply shared instances,
      since the stream label and domain differ. No number here may be compared
      to any relayed gate count, blocksize or cost figure.

  metrics:
    primary:
      - Per-m enumerated involution count and its agreement with 2^{r+delta} - 1, over m in [3, 2000].
      - The unique-involution set, as a sorted integer list.
      - The gap set, as a sorted integer list, with its cardinality and least element.
      - The involution triples at m = 8, 16, 32, 64.
      - C5 verdict (EQUIVALENT / DISTINCT) with all five invariants for both lattices at m = 16, 32.
      - C6 survival table: for each of m = 12, 20, 28, 36, 44, which of the four forced values hold.
      - C7 lambda_1^2 per (m, involution) against n/4.
    secondary:
      - NULL-A count per m and its agreement with gcd(2, m).
      - PC-A result per 2-power conductor.
      - C9 self-pair agreement rate.
      - Key-to-key spread of each invariant per cell, reported BEFORE the verdicts.
      - Enumeration node counts and node-budget status per lattice cell.
      - Raw census table digest, and per-cell HNF basis and Gram digests.

  preregistered_prediction:
    quantity: >-
      The census agreement count, the two derived sets, the C5 verdict rule's
      inputs, and the C6 survival pattern.
    formula: >-
      count(m) = 2^{r + delta} with delta = 0 / 1 / 2 for v_2(m) <= 1 / = 2 /
      >= 3; involutions(m) = count(m) - 1; unique-involution set =
      {4} union {p^k} union {2 p^k}; gap set = {m : count(m) >= 4, 4 does not
      divide m} = odd composites and their doubles.
    values:
      census_mismatches: 0 out of 1998
      unique_involution_set_symmetric_difference: 0
      gap_set_least_element: 15
      gap_set_nonempty: true
      two_power_involutions_at_m_8_16_32_64: 3 each, namely {m-1, m/2+1, m/2-1}
      null_A_count: gcd(2, m) at every m
      C7_lambda1_squared: exactly n/4 at every tested (m, involution) with 4 | n
      C6_expected_pattern: >-
        rank SURVIVES; determinant and both theta coefficients FAIL. At most two
        of four hold at each nearby conductor.
    C5_no_direction_pre_registered: >-
      DELIBERATE. This contract does not know whether Lambda^(c tau) is a
      distinct object and refuses to guess. What is pre-registered is the RULE
      and the DISPOSITION FOR BOTH OUTCOMES: all five invariants agree at both
      m => report "not distinguished by five invariants; the third lens is
      plausibly a change of coordinates and the effective order-2 budget is
      two", which is a NULL RESULT and a legitimate deliverable carrying the
      section-4 closure elements (obstruction, argument, forward guidance). Any
      disagreement => report the observed invariants of the third lattice and
      state what it would take to price its SVP dimension, WITHOUT pricing it.
    source: >-
      Derived in IDEA-20260805-128f35 and H-HAWK-a28be6 from the CRT structure
      of (Z/m)^x and from the cocycle derivation. The relayed evasion sentence
      of KN-LIT-7592 is the object being checked, not the source of these
      predictions. NOT MEASURED HERE.

  stages_and_termination:
    stage_1:
      cost: seconds, pure Python, no dependency, no key, no lattice, no network
      content: NULL-A, PC-A, then the full census and the three derived sets.
      can_terminate: true
      termination_rule: >-
        If NULL-A does not return gcd(2, m), or PC-A misses any 2-power
        involution, STOP: the enumerator is broken and no census exists. If the
        census mismatches the closed form at any m, STOP and report the
        mismatching conductors -- H-HAWK-a28be6 (P1) is then refuted and stages
        2 and 3 have no framing to serve.
      note: >-
        THIS IS THE CHEAPEST DECISIVE GATE IN GOAL-HAWK-001. It needs no gated
        source, no solver, no key and no network, and it is the one part of this
        goal's work that is blocked by nothing at all.
    stage_2:
      cost: minutes; requires PC-B
      content: C9 self-pair first, then C5 at m = 16 and 32.
      can_terminate: true
    stage_3:
      cost: minutes to an hour; requires PC-B
      content: C6 at m = 12, 20, 28, 36, 44 and C7 on both families.
      can_terminate: false

  replication:
    planned_runs: 1
    seeds: >-
      Stage 1 is DETERMINISTIC WITH NO SEED -- it is an exhaustive enumeration,
      and a replication reproduces it bit-for-bit by definition. Stages 2 and 3
      derive every instance from master_seed 20260805 through the stated rule,
      with counters t = 0..19 per (m, arm). A replication uses master_seed
      20260806, declared here so a replicator does not choose one after seeing
      results.
    interpretation: >-
      One run validates an instrument and produces a census. It cannot support
      or reject any statement about HAWK's security, about any conductor's
      vulnerability, or about the disclosed attack's scope beyond the toy
      boundary declared above.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 10800
    maximum_cpu_seconds: 10800
    maximum_peak_rss_bytes: 4294967296
    maximum_workers: 1
    maximum_enumeration_nodes_per_cell: 100000000
    maximum_total_disk_bytes: 1073741824
    no_network: true
    dependencies: >-
      Python 3 standard library only for stage 1. Stages 2-3 inherit
      EXP-HAWK-a2f34a's pure-Python instrument. numpy 2.4.6 present (verified
      this session); sympy, sage, fpylll, PARI/GP ABSENT (verified this
      session). No exact result may depend on floating point. Stage 3's
      non-2-power arm needs cyclotomic polynomial arithmetic for Phi_m at
      m in {12, 20, 28, 36, 44}, which is implemented by exact integer
      polynomial division of x^m - 1 by the lower cyclotomic factors -- NOT by
      sympy -- and the implementation is verified against the known degrees
      phi(m) = 4, 8, 12, 12, 20 before any lattice is built.

  stopping_rules:
    - Do not execute unless separately approved, frozen, archived and authorized.
    - Stop at stage 1 if NULL-A or PC-A fails.
    - Stop at stage 1 if the census mismatches the closed form at any conductor.
    - Do not begin stages 2 or 3 unless EXP-HAWK-a2f34a's PC-1 passed 20/20.
    - Do not run C5 if C9 (self-pair) fails.
    - Halt the m = 4 degenerate cell and report it as degenerate rather than emitting a number.
    - Stop at a cell boundary on wall-clock, CPU, RSS or node-budget exhaustion.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any census output inspected before the NULL-A and PC-A commitments exist.
    - Any C5 verdict produced before the C9 commitment exists.
    - Any additional statistic added to the C5 decision rule after any invariant has been observed.
    - Any use of floating point in a value reported as exact.
    - Any presentation of a census row as an applicability or vulnerability verdict.
    - Any Round-3 parameter recommendation, in any form, in any artifact of this contract.
    - Any change to the inherited instrument definition beyond the two declared substitutions, other than through a versioned protocol_amendment recorded as exploratory_only.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory condition, missing dependency, or
    enumeration node-budget exhaustion is reported as INFRASTRUCTURE SIGNAL with
    its measured values and is NEVER negative mathematical evidence about
    H-HAWK-a28be6, about any conductor, or about the disclosed attack's scope
    (AGENTS.md rule 5). Two specific cases are called out because they are
    likely: (i) node-budget exhaustion at m = 44 (n = 20) leaves C6 and C7
    undetermined at that cell and the correct report is "not determined, N nodes
    visited", not "the forced values failed"; (ii) an inability to construct
    Phi_m without sympy is a contract defect and an infrastructure request, not
    a mathematical finding.

  success_criterion: >-
    Only positive disposition: NULL-A returns gcd(2, m) at every m; PC-A returns
    the three involutions at every 2-power conductor; the census agrees with the
    closed form at 1998/1998 conductors; the unique-involution set equals
    {4} union {p^k} union {2p^k} exactly; the gap set is non-empty with least
    element 15; and -- CONDITIONAL ON PC-B and C9 -- C5 returns a verdict under
    the frozen rule (EITHER verdict counts as success), C7 returns exactly n/4
    at every tested point, and C6 produces a complete per-conductor survival
    table naming which forced value fails first. THIS DISPOSITION ESTABLISHES
    ONLY the toy-scope statement in claim_ceiling. It establishes no attack, no
    conductor verdict, no cost, and nothing about deployed HAWK parameters.
  falsification_criterion: >-
    H-HAWK-a28be6 is falsified over its declared boundary by ANY of: a census
    mismatch at any conductor (refutes P1); a unique-involution set differing
    from {4, p^k, 2p^k} (refutes the re-derivation of the relayed evasion
    criterion, and the report must consider its own derivation as the culprit
    FIRST); an empty gap set (refutes P2, and the separation claim is
    withdrawn); lambda_1^2 not equal to n/4 at any tested point with 4 | n
    (refutes HEUR-CENSUS-2's generic half, and H-HAWK-c7a551 must be re-derived
    too); or all four forced values surviving at BOTH m = 12 and m = 20
    (refutes HEUR-CENSUS-3, meaning the near-hypercubic structure is not
    2-power-specific -- the surprise outcome, which is routed to independent
    review before publication because it would contradict a relayed external
    scope claim). A C5 verdict of EQUIVALENT is NOT a falsification: it is the
    pre-registered null outcome and is a deliverable.

  scale_relevance:
    tier: toy
    why_conclusions_transfer: >-
      The census half is EXHAUSTIVE over its stated range and is a statement
      about Galois groups, so it transfers to every conductor in that range
      exactly and to none outside it; the closed form itself is proved for all m
      but the contract only verifies it to 2000 and says so. The generic half of
      the cocycle argument (lambda_1^2 <= n/4) is algebraic and n-independent in
      statement, so C7's agreement at six points is a check of a derivation
      rather than an extrapolation.
    stated_limit: >-
      Nothing about attack success, cost, SVP dimension or security transfers at
      any scale. The lattice arms reach n <= 32 against deployed
      n in {256, 512, 1024}. The nearby conductors 12, 20, 28, 36, 44 are not
      HAWK parameter sets and no HAWK instance uses them.

  required_artifacts_if_later_authorized:
    - Frozen approved specification and a freeze receipt binding its SHA-256.
    - NULL-A and PC-A outputs with their SHA-256 commitment, timestamped before the census table.
    - The complete raw census table (m, enumerated set, count, closed form, agreement) and its digest.
    - The unique-involution set, the gap set, and the 2-power triples as sorted lists.
    - C9 self-pair output with its commitment, timestamped before C5.
    - Per lattice cell: instrument definition digest (must equal EXP-HAWK-a2f34a's), HNF basis, Gram matrix, the five invariants, node count.
    - C6 survival table with the "which failed first" column filled for every nearby conductor.
    - The m = 4 degenerate-cell report.
    - Full seed transcript; manifest; environment including the numpy/sympy/sage/fpylll presence check; command; stdout; stderr; timings; peak RSS.
    - Execution report naming which stage terminated the run and why.
    - Snapshot archive followed by independent Validator and Red Team review before any evidence record.

  approval_requirements:
    - Independent review confirms the census closed form and its three-case delta, and confirms NULL-A is a genuine null rather than a decoration.
    - Independent review confirms the C5 rule and both dispositions are frozen and that neither outcome is privileged.
    - Independent review confirms no artifact can be read as a conductor vulnerability verdict or a parameter recommendation.
    - Coordinator separately approves and freezes without editing this draft, and separately confirms the EXP-HAWK-a2f34a dependency before stages 2-3.
  approval_status: >-
    Pending review. No approved_by field is present because this contract is not
    approved and only the Coordinator may approve it (AGENTS.md rule 1).
