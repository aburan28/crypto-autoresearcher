experiment:
  id: EXP-ICPERF-2f2e40
  hypothesis_id: H-ICPERF-afe62e
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-94168f
  version: 2
  title: >-
    PDP ground truth: an independently written exhaustive side-classified
    decomposition table per (cell, side), the D1/D2 root classifier checked
    against the committed enumeration, and a CERTIFIED-TARGET SAMPLER that
    emits certified-U and certified-S instances at cells the upstream
    benchmark never shipped
  status: approved
  approved_by: DEC-20260916-3c0cf5
  approved_at: '2026-09-16'
  approval_basis: >-
    Standing user authorization (AGENTS.md, 2026-09-06: "all is approved.
    ideas/experiments should be always approved"). No user selection or
    confirmation was sought. What the Coordinator supplies is PROTOCOL
    COMPLETENESS, which the standing authorization explicitly does not cure:
    this contract has its controls, its self-defeat audit, its per-(cell,side)
    admission rules, metrics, budgets, stopping rules, invalidation rules,
    artifact paths, dependencies and inference policy, and it can complete on
    the three shipped cells alone if every candidate new cell is refused
    admission. Approval asserts nothing about whether H-ICPERF-afe62e is true.
  status_history:
    - status: draft
      at: '2026-09-16'
      by: coordinator
      note: Designed in BATCH-94168f from IDEA-20260915-3f1964, ranked 1 by DEC-20260916-3c0cf5.
    - status: approved
      at: '2026-09-16'
      by: coordinator
      note: >-
        Approved in the same decision that ranked it, because nothing in it is
        owed by another lane or another agent. Contrast EXP-ICPERF-61c136 and
        EXP-ICPERF-42ef30, which are NOT approved and carry enumerated
        approval_preconditions.
    - status: approved
      at: '2026-09-16'
      by: coordinator
      version: 2
      correction: CORR-20260916-c5bb9c
      note: >-
        v1 -> v2. ADDITIVE AMENDMENT; the v1 entry above stands unchanged and
        CORR-20260916-c5bb9c preserves both values. Commit 19566947c ("carry
        (23,6) and (23,8) on the producer grid") wrote two candidate cells into
        this contract IN PLACE after it had been approved at v1 by
        DEC-20260916-3c0cf5 and merged to main, with no amendment and no
        version bump. Raised as a high-severity review finding on PR #1208
        ("Approved contract edited without amendment") and flagged twice by the
        driving session before that. The CHANGE IS RETAINED -- it closes a real
        gap DEC-20260916-3c0cf5 recorded, that EXP-ICPERF-61c136's
        l-cancellation prediction needs two cells sharing n and differing in l
        and no candidate cell did. What was missing was the bookkeeping: an
        approved contract that changes at a fixed version makes every later
        receipt binding "2f2e40 v1" ambiguous between two producer grids. This
        bump exists so that ambiguity cannot arise. status and approved_by are
        unchanged; nothing here re-approves anything.


  objective: >-
    Give RQ-ICPERF-94c86e's point-decomposition column a ground truth it does
    not have: for each admitted (cell, side), the exact set of decompositions
    of every target, the exact class of every root under D1/D2 of
    H-ICPERF-afe62e, a certificate of unsatisfiability for every absent
    target, and an encoding-plus-solver completeness ratio. Then use it as a
    SAMPLER: emit certified-U and certified-S instances at (n,l) the upstream
    generator never shipped, which is the input EXP-ICPERF-61c136,
    EXP-ICPERF-42ef30 and any later relation-search column all require and
    none of which currently exists. Observations only; the executor forms no
    conclusion and changes no status.

  disjointness_from_the_concurrent_lane:
    other_lane: BATCH-a33cda (GOAL-ICPERF-e6b6a4, PDP instrument repair, DEC-20260915-428a17)
    statement: >-
      This contract reads BATCH-a33cda's committed outputs and writes none of
      them. It does not read or write experiments/EXP-ICPERF-e21835/,
      experiments/EXP-ICPERF-13f001/, experiments/EXP-ICPERF-66fd51/,
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/,
      coordination/review/icperf-20260915-a33cda/, or
      ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml. It does not depend on the
      instrument repair: it uses no Groebner engine, because the table IS the
      UNSAT certificate the Groebner column would have supplied.
    machine_headroom: >-
      NO QUIET-HOST PRECONDITION, and this is a design decision with a stated
      cost rather than an omission. Every primary metric here is a COUNT (table
      entries, root classes, agreement counts, completeness ratios) and counts
      are invariant under load. No timing claim is made and no wall-clock
      number from this contract may enter any boundary-table cell or any ratio.
      The cost of that decision: this contract contributes nothing to the
      timing columns of RQ-ICPERF-94c86e, which stay owed to the batches that
      can hold the machine quiet. Loadavg is still recorded on every row so a
      later reader can see the conditions.

  inputs:
    frozen_instances: >-
      inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/
      (SRC-ICPERF-TRIMOSKA-ECICB-2024; 60 instances x {INFO, ANF, CNF-XOR,
      Magma}), read-only and byte-identical, hash-checked against
      UPSTREAM_SHA256SUMS.txt before anything runs
    generator: >-
      inputs/TRIMOSKA-ECICB-2024/upstream/ Weil_descent program, driven from
      (n, l, modulus, x_R) so that instances can be emitted without Sage
      (script_benchmarks.sh). Read-only; NOT modified. A generalisation to
      affine or arbitrary-basis subspaces is explicitly OUT OF SCOPE here and
      is EXP-ICPERF-42ef30's approval precondition AP-2.
    committed_baseline_to_reproduce:
      - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v1_decomp_search_n15l5.json
      - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v1_decomp_search_n17l6.json
      - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v1_decomp_search_n19l6.json
      - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v1_certificates.json
      - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v1_all_sat_answers.json
      - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/report.md
      - ledger/evidence/EV-ICPERF-390707.yaml
    engines_installed_and_used:
      - WDSat @ 61c6ff3, DEFAULT build, rebuilt per cell with exact static sizing derived from each ANF
      - WDSat @ 61c6ff3, __FIND_ALL_SOLUTIONS__ build -- a SEPARATE build whose config_used.json and binary hash are recorded distinctly from the default build's
      - CryptoMiniSat 5.11.15, CNF-XOR native, as the second complete solver for the status cross-check
    engines_deliberately_not_used:
      - Macaulay2 1.22, Singular 4.3.2, msolve -- no Groebner engine is used; the table is the UNSAT certificate
      - Magma F4, PolyBoRi/BRiAl -- absent from this host and not substituted
    curves: >-
      y^2 + xy = x^3 + x^2 + 1 over F_{2^n} (the generator's curve, a = b = 1,
      a Koblitz curve) and, for control C-NULL-CURVE, y^2 + xy = x^3 + x^2 + b'
      on the same field with b' != 1 drawn at a recorded seed
    code: experiments/EXP-ICPERF-2f2e40/code/ (to be written by the executor under C-INDEP)

  cells:
    shipped:
      - {n: 15, l: 5, status: mandatory}
      - {n: 17, l: 6, status: mandatory}
      - {n: 19, l: 6, status: mandatory}
    candidate_new:
      - {n: 21, l: 7, status: conditional_on_AR1_AR2}
      - {n: 23, l: 7, status: conditional_on_AR1_AR2}
      - {n: 25, l: 8, status: conditional_on_AR1_AR2}
      - {n: 23, l: 6, status: conditional_on_AR1_AR2}
      - {n: 23, l: 8, status: conditional_on_AR1_AR2}
    candidate_new_note: >-
      (23,6) and (23,8) are carried for EXP-ICPERF-61c136's l-cancellation
      prediction ONLY, which needs two cells sharing n and differing in l and
      finds none among the first three. They are subject to AR-1 and AR-2
      exactly as the others. This is the only contract that builds tables and
      emits the certified sampler, so a cell absent from this grid can be
      neither admitted nor refused downstream and the prediction would stay
      NOT EVALUABLE with no measured reason attached.
    modulus_rule_for_new_cells: >-
      DETERMINISTIC AND RECORDED: the degree-n irreducible polynomial over F_2
      that is lexicographically smallest as an integer bit pattern, computed
      and printed by the executor's own code, recorded in manifest.yaml with
      its bit pattern, and verified irreducible by an independent primitivity
      or irreducibility check in the same code. A cell whose modulus cannot be
      produced or verified is NOT ADMITTED and says so.

  admission_rules:
    preamble: >-
      THESE RULES BIND AT THE GRANULARITY THE COSTS ACTUALLY VARY AT, which is
      (cell, side) and not (cell). The failure this is written against is
      recorded in DEC-20260915-d8d413: EXP-ICPERF-025a52's feasibility rule was
      declared PER CELL while the quantity that decides reachability was a
      per-node-degree acceptance probability, "so every cell passes at its root
      and dies four to six levels down". Here the quantity that decides
      reachability is |Fb_s|, which is a property of (cell, side), is NOT
      predictable from (n, l) -- IDEA-20260915-3f1964's proposal-time count has
      |Fb_E| = 21 where a balanced V would give 31 at (15,5), a 2-sigma low
      draw -- and is measurable in |V| trace evaluations BEFORE any table is
      built. Each rule therefore has a cheap pre-pass that runs first.
    rules:
      - id: AR-1
        granularity: '(cell, side)'
        pre_pass: >-
          Enumerate V, evaluate s(x) on each nonzero x, and count
          |Fb_s| = 2 * #{x in V : x != 0, s(x) = side} + [side = 0 and 0 in V].
          Cost |V| trace evaluations (<= 256), milliseconds.
        admit_if: >-
          C(|Fb_s| + 2, 3) <= TABLE_MAX_ENTRIES = 4_000_000 AND the projected
          table memory
          (entries * ENTRY_BYTES, with ENTRY_BYTES measured on the (17,6)
          side-0 table and recorded before any new cell is entered)
          <= 3 GiB.
        on_refusal: >-
          Record the (cell, side) as not_admitted with the measured |Fb_s|, the
          computed C(|Fb_s|+2,3) and the binding term. A refused (cell, side) is
          an instrument fact with a number attached. It is not a result about
          anything and it does not stop the other side or the other cells.
      - id: AR-2
        granularity: '(cell)'
        pre_pass: >-
          Produce the modulus by the deterministic rule above, verify
          irreducibility, and emit ONE instance through the vendored
          Weil_descent program at that (n, l), confirming that it accepts the
          parameters, that the emitted ANF has the expected 3l core variables,
          and that a WDSat build sized from that ANF has MAX_ID equal to the
          ANF-derived value.
        admit_if: all three hold
        on_refusal: >-
          Record the cell as not_admitted with the exact failure (modulus,
          generator, or MAX_ID sizing). The table for that cell may still be
          built if AR-1 admits it -- a table needs no generator -- but the
          SAMPLER for that cell is not, and the contract says which.
      - id: AR-3
        granularity: '(cell, build)'
        applies_to: the __FIND_ALL_SOLUTIONS__ completeness test only
        pre_pass: >-
          One all-solutions invocation on the smallest admitted cell's smallest
          S instance, with a 600 s wall timeout.
        admit_if: it finishes and its printed solution count parses
        on_refusal: >-
          The completeness ratio is reported as NOT EVALUABLE for that cell with
          the reason, and `holds: null` (the CH-5 reporting discipline of
          EXP-ICPERF-13f001, inherited by reference). It is never reported as a
          completeness failure: an unfinished all-solutions run is an
          infrastructure outcome.

  controls:
    - id: C-RECON
      what: >-
        Reproduce the committed enumeration behind EV-ICPERF-390707 joint V1
        with the independently written enumerator, BEFORE any new cell is
        touched: 60/60 status agreement with the run's SAT/UNSAT labels;
        30/30 shipped S certificates present as preimages of their own
        targets; 67 roots across the 60 instances classified as 45 all-E,
        1 all-twist, 21 mixed; all 21 mixed in n15l5-8-S; and the per-cell
        |Fb_0|, |Fb_1| recomputed from the .in files and the curve.
      pass: exact agreement on every count listed
      can_it_fail_on_a_correct_instrument: >-
        YES, and that is the point. Two independently written enumerators can
        disagree; the disagreement localises to one of two named
        implementations and is the most informative outcome available here.
        It does not fire when the experiment finds its signal -- it is a
        comparison against an artifact produced by a different agent before
        this contract existed, so nothing this run measures can move it.
    - id: C-KF-BITFLIP
      kind: known_false
      what: >-
        For each of the 30 shipped S certificates, flip one bit of x_1 and
        look the ALTERED TRIPLE up as a preimage of the UNALTERED target.
      pass: 0 of 30 found
      chance_rate_declared: >-
        A random triple sums to a given x_R with probability about 2^{-n}, so
        30 * 2^{-15} < 1e-3 across the whole set. A single hit is therefore a
        defect and not a coincidence, and the threshold of 0 is principled
        rather than optimistic.
      can_it_fail_on_a_correct_instrument: >-
        At the stated chance rate, no. Recorded so the threshold is auditable.
    - id: C-KF-CONVENTION
      kind: known_false
      what: >-
        Read each shipped x_R under the OPPOSITE bit-order convention, giving
        a different field element x_R', and check whether the shipped triple
        is a preimage of x_R'.
      pass: 0 of 30
      rejected_formulation_and_why: >-
        THE OBVIOUS FORMULATION WAS REJECTED FOR BEING SELF-DEFEATING. The
        natural wording -- "x_R' must have table count zero" -- fails on a
        CORRECT instrument about 5.6 times in 30, because x_R' is just another
        field element and the decomposable fraction of a random target is
        0.19 / 0.29 / 0.08 at the three shipped cells (IDEA-20260915-3f1964
        proposal-time, unreviewed). A control that fires five or six times out
        of thirty on a working table tests nothing and, wired to a stop, would
        invalidate every correct run. The retained formulation asks instead
        whether THE SHIPPED TRIPLE is a preimage of x_R', whose chance rate is
        30 * 2^{-n} < 1e-3. This is the DEFECT-C-MEMO-OFF failure mode of
        DEC-20260915-d8d413 caught at design time rather than at review.
    - id: C-NULL-CURVE
      kind: null_object
      what: >-
        Build the side-0 and side-1 tables for y^2 + xy = x^3 + x^2 + b' with
        b' != 1 drawn at a recorded seed, on the SAME field, the SAME V and
        therefore the same |V|; look up the 30 shipped S certificates.
      pass: 0 of 30 present, at the same declared chance rate 30 * 2^{-n}
      why_this_is_the_matched_null: >-
        Matched on field, on subspace, on subspace dimension, on the number of
        candidate triples and on the arithmetic; differing ONLY in the curve
        constant, which is the object D1 is about. A null matched on anything
        less measures size rather than structure, which is exactly the defect
        EV-ICPERF-390707 joint V4 found in the predecessor's null family
        (0 of 18 nulls matched their template's constant-term count).
      can_it_fail_on_a_correct_instrument: >-
        At the chance rate, no. And it is independent of the signal: the
        signal is that the REAL table contains the certificates, this control
        is that a DIFFERENT curve's table does not. Both can be measured and
        either can fail without implying the other.
    - id: C-SUM
      kind: reconstruction
      what: >-
        For each (cell, side): the sum of the table's counts over all
        x-coordinates of that side must equal the number of unordered triples
        enumerated, C(|Fb_s| + 2, 3), exactly -- every triple lands on exactly
        one x-value.
      pass: exact equality, per (cell, side)
      can_it_fail_on_a_correct_instrument: >-
        No -- it is a conservation identity, so it can fail only if the
        implementation is wrong. That is what a reconstruction control is for,
        and it is recorded here as such rather than counted as evidence.
    - id: C-INDEP
      kind: independence
      what: >-
        The enumerator, the field arithmetic and the side classifier are
        written WITHOUT reading binec.py, convert.py, semaev.c,
        Weil_descent.sage, or
        coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/val_gf2n.py.
        The executor's report declares every path it read.
      pass: the declaration is present and lists no forbidden path
      why: >-
        C-RECON is only a comparison if the two implementations are actually
        independent. Recomputing from the producer's own code reproduces an
        implementation that is wrong and self-consistent -- the failure mode
        validation cannot see (AGENTS.md "Review architecture", blind
        re-derivation).
    - id: C-CERT-EMIT
      kind: certificate
      what: >-
        Every emitted certified-S instance carries its generating triple, and
        the triple's sum is re-verified to equal +-R with GF(2^n) arithmetic
        independent of the solver AND the instance is confirmed SAT by both
        named complete solvers. Every emitted certified-U target is confirmed
        ABSENT from BOTH the side-0 and the side-1 table and is confirmed
        UNSAT by both named complete solvers.
      pass: >-
        100% on both, per cell. A disagreement between the table and a
        complete solver stops the sampler for that cell and is reported with
        the instance, because it means either the table or the encoding is
        wrong and every certificate this goal issues would inherit the defect.
      claim_tier_note: >-
        This is what makes a "certified-U" label a certificate rather than the
        upstream generator's unfiltered random draw (KN-LIT-036049). Per
        docs/claims-and-verification.md no record may assert above its claim
        tier; a certified-U instance is certified BY THIS ENUMERATION at this
        cell, and the certificate travels with it.
    - id: C-2TORSION
      what: >-
        The x = 0 factor-base point (0, sqrt b) is 2-torsion and lies in V. It
        is included in the tables and handled explicitly by the classifier,
        and every row involving it is flagged.
      pass: reported; no pass/fail
      why: >-
        D2's families are defined modulo E[2] and x = 0 is the one factor-base
        element that sits in it. A classifier that silently drops or silently
        keeps it produces a count that is off by a structured amount.
    - id: C-LOAD
      what: 1-minute load average recorded at every invocation
      pass: reported on every row
      why: >-
        Not a contamination guard here -- no timing claim is made -- but a
        disclosure so a later reader knows the conditions.

  control_self_defeat_audit:
    performed: true
    performed_by: coordinator, BATCH-94168f, 2026-09-16
    standard_applied: >-
      DEC-20260915-d8d413, DEFECT-C-MEMO-OFF: a frozen control that fails on a
      CORRECT instrument -- in particular one whose metric definitions make it
      fire exactly when the experiment finds its signal -- converts the most
      likely successful outcome into a declared invalid run, and is
      disqualifying on its own.
    findings:
      - control: C-KF-CONVENTION
        verdict: >-
          ONE SELF-DEFEATING FORMULATION FOUND AND REJECTED before freezing;
          the rejected wording and its expected false-failure rate (5.6 in 30)
          are recorded in the control itself so the rejection is auditable.
      - control: C-RECON
        verdict: >-
          Not self-defeating. Its reference values were produced by a
          different agent before this contract existed, so no measurement this
          run makes can move them.
      - control: C-NULL-CURVE
        verdict: >-
          Not self-defeating. It is a measurement on a DIFFERENT object; the
          signal and the control are logically independent and either can fail
          alone.
      - control: C-SUM
        verdict: >-
          Cannot fail on a correct instrument by construction, because it is
          an identity. Recorded as a reconstruction control and never counted
          as evidence for the hypothesis.
      - control: C-CERT-EMIT
        verdict: >-
          Not self-defeating, but deliberately HARD-STOPPING: it is the one
          control whose failure means the product of this contract is unsafe
          to use downstream, so it stops the sampler for the affected cell
          rather than being reported and passed over.

  independent_variables:
    - cell (n, l)
    - side of x_R (0 / 1) -- always reported separately
    - instance label (S / U) -- always reported separately, never pooled
    - shipped instance vs freshly sampled instance
    - real curve vs C-NULL-CURVE control curve
    - solver build (WDSat default / WDSat all-solutions / CryptoMiniSat CNF-XOR)

  metrics:
    primary:
      - per (cell, side) - '|Fb_s|, number of distinct x-coordinates, table entry count, T_s = C(|Fb_s|+2,3), lambda_s, decomposable fraction'
      - per target - exact decomposition count, side of x_R, membership of x_R and b/x_R in V
      - per root - class in {all_E, all_twist, mixed_M1, mixed_M2, neither} with the deciding trace values
      - per instance - table verdict vs each named solver's verdict (agreement / disagreement)
      - per S instance - all-solutions count / (table count x corrected ordering multiplicity)
      - per (cell, side) - per-target count HISTOGRAM, and its chi-square against Poisson(lambda_s) with D2 targets excluded (HEUR-1)
    secondary:
      - wall seconds and peak RSS per phase; loadavg at launch; enumerator throughput in additions per second
      - number of (cell, side) pairs admitted and refused, with the binding admission term for each refusal

  heuristic_under_test: HEUR-1 (of H-ICPERF-afe62e)

  preregistered_prediction:
    quantity: >-
      The seven predictions of H-ICPERF-afe62e, evaluated per cell and per
      side, with S and U separate.
    formula: >-
      Fixed before execution: 30/30 S certificates present; mixed count
      EXACTLY 21 on n15l5-8-S with the split M1 = 21, M2 = 0, and EXACTLY 0 on
      the other 59; 67 roots classified 45/1/21; 60/60 status agreement;
      all-solutions ratio exactly 1.000 where AR-3 admits; fresh-U
      decomposable fraction inside the Poisson band computed from the SAME
      run's measured |Fb_s|; at least one new cell admitted or every refusal
      recorded with its number.
    source: >-
      D1 and D2 of H-ICPERF-afe62e (derivations), with the reference values
      taken from EV-ICPERF-390707 joint V1, which was composed on 2026-09-15
      before this contract was written and therefore cannot be fitted to this
      run's output.
    every_clause_reports_evaluated_flag: >-
      Inherited by reference from EXP-ICPERF-13f001 CH-5: every prediction
      clause reports `evaluated: true|false` with a reason, every
      cell-quantified clause reports an explicit `unevaluable: [...]` list, and
      a clause with a nonempty unevaluable list reports `holds: null`. The
      defect this repairs is measured: the frozen reduction of
      EXP-ICPERF-66fd51 reported two of six predictions as HOLDING when
      neither was evaluable.

  scale_relevance:
    tier: toy
    justification: >-
      n <= 25, l <= 8, one curve, one host. Exact for the admitted cells and
      transfers to nothing on its own. The one quantity with a stated transfer
      is HEUR-1's MEAN, which is exact by double counting at every n and l;
      its SHAPE is not extrapolated beyond the admitted cells.
    correspondence: null

  tail_checks:
    - >-
      The maximum per-target decomposition count observed per (cell, side)
      against the Poisson upper quantile at the number of targets enumerated.
      The bulk fit and the tail can disagree, and the tail is where a
      structured landing of triple-sums would show first.
    - >-
      n15l5-8-S is reported SEPARATELY from every aggregate it would otherwise
      enter, in both directions (with and without), because under D2 it is not
      a draw from the same population as the other instances -- it is the one
      instance whose target lies inside V. Inherited in spirit from
      EXP-ICPERF-13f001 CH-6, and here it is a prediction rather than a
      disclosure.
    - >-
      Where a (cell, side) is admitted but its all-solutions test is not
      (AR-3), the completeness ratio is reported as NOT EVALUABLE beside the
      cell's other numbers rather than omitted.

  replication:
    seeds:
      - fresh-U target sampling - 20260916 * 1000 + 100 * n + l, recorded per cell
      - 'C-NULL-CURVE b'' draw - the same rule offset by a recorded constant'
    independent_instances: >-
      60 shipped + 200 freshly sampled U targets per admitted cell + 20
      certified-U and 20 certified-S emitted instances per admitted cell

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_memory_gb_basis: >-
      MACHINE PROTECTION, NOT A RESEARCH BUDGET. The binding term is the
      largest single table, bounded by AR-1's TABLE_MAX_ENTRIES and its 3 GiB
      projection with 1 GiB of headroom for the process. 4 CPUs and ~15 GB on
      this host with a concurrent lane; this contract takes one core.
    maximum_runs: 1
    maximum_workers: 1
    per_invocation_timeouts:
      wdsat_default_seconds: 600
      wdsat_all_solutions_seconds: 600
      cryptominisat_seconds: 600
      enumerator_per_cell_side_seconds: 3600
    executor_wall_clock_seconds: null
    executor_wall_clock_seconds_note: >-
      Advisory and deliberately null (CLAUDE.md research-budget policy: routine
      estimates are advisory, may be null, and do not gate). Order of
      magnitude for the executor's own planning only: the proposal-time
      enumerator ran six (cell, side) tables in 130 s of pure Python
      (IDEA-20260915-3f1964, unreviewed); the new cells are 1-2 orders larger.

  stopping_rules:
    - C-RECON fails on any listed count - STOP before any new cell, report which count and both values. A disagreement with the committed enumeration is the whole point of running the reproduction first.
    - C-CERT-EMIT fails at a cell - stop the SAMPLER for that cell, keep the table, report the instance.
    - A shipped instance file's hash differs from the frozen manifest - stop and report.
    - An (cell, side) refused by AR-1 or a cell refused by AR-2 - do not enter it; record the refusal with its measured number and continue with the rest.
    - Executor wall clock reached - stop, keep every completed table and the partial results.jsonl, run the reduction, and record which phases finished.

  invalidation_rules:
    - results.jsonl absent or unparsable.
    - The executor's read declaration lists any path forbidden by C-INDEP.
    - Any WDSat row whose reported MAX_ID differs from the ANF-derived value (mis-sized build).
    - A root recorded without its class, or a class recorded without its deciding trace values.
    - A table for which C-SUM does not hold exactly.
    - An emitted certified-U or certified-S instance lacking its certificate block.
    - manifest.yaml missing code.commit, the inference block, the per-cell modulus and its irreducibility check, the two distinct WDSat build hashes, or the recorded ENTRY_BYTES used by AR-1.

  success_criterion: >-
    C-RECON reproduces every listed count of EV-ICPERF-390707 joint V1 or
    reports an exact, localised disagreement; the three shipped cells carry
    complete side-0 and side-1 tables with C-SUM exact; every one of the 67
    recorded roots carries a class in {all_E, all_twist, mixed_M1, mixed_M2,
    neither} with its traces; the mixed split is reported per instance; every
    candidate new cell is either admitted with a table and a certified sampler
    or refused with its measured binding quantity; and every prediction clause
    carries an `evaluated` flag.

  falsification_criterion: >-
    Per H-ICPERF-afe62e falsification_conditions. The executor reports values;
    the Coordinator decides. A refused cell, a watchdog stop, a solver timeout
    or an unfinished all-solutions run is an INFRASTRUCTURE OUTCOME, falsifies
    nothing, and in particular is never evidence that any instance is
    unsatisfiable (AGENTS.md rule 5; RQ-ICPERF-94c86e says the same).

  required_artifacts:
    - experiments/EXP-ICPERF-2f2e40/code/ with a recorded sha256 per file and the executor's read declaration for C-INDEP
    - manifest.yaml, results.jsonl, summary.json, environment.json, task-report.md, plan.json, phase_log.txt
    - tables/<cell>-side<0|1>.json (or a declared compact binary with its reader), one per admitted (cell, side)
    - root_classes.json - every root of every shipped instance with its class, family (M1/M2 where mixed) and deciding traces
    - recon/ - the C-RECON comparison against the five committed artifacts, count by count, with both values on every line
    - controls/ - C-KF-BITFLIP, C-KF-CONVENTION, C-NULL-CURVE, C-SUM outputs
    - sampler/<cell>/ - the emitted certified-U and certified-S instances, each with its certificate block, the recorded seed, and the generator invocation
    - admission.json - every (cell, side) and cell with admitted true/false, the measured pre-pass quantity, and the binding term on refusal
    - builds/*/config_used.json and make.log, with the default and all-solutions WDSat builds recorded distinctly
    - logs/ (stdout and stderr per invocation)

  assigned_to: executor
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  dependencies:
    - H-ICPERF-afe62e committed at `specified` or later
    - DEC-20260916-3c0cf5 committed (this contract's approval)
    - SRC-ICPERF-TRIMOSKA-ECICB-2024 committed
    - EV-ICPERF-390707 and the TASK-20260913-6c5729 artifact set committed (they are; they are on main)
    - A snapshot of this contract at its approved version before execution
  dependencies_note: >-
    NOT dependent on EXP-ICPERF-e21835's acceptance, on the repaired
    instrument, or on any Groebner engine. That independence is why this
    contract can be approved in a lane that owns no part of BATCH-a33cda.

  review_required: true
  review_note: >-
    Claim-relevant producer. Its output becomes the certificate basis for every
    later ICPERF PDP measurement, so a defect here propagates into evidence
    that would look sound. An independent validator round with a review_plan
    written before any reviewer runs is owed before any evidence record is
    composed from this contract; that plan, and the reviewer TASK ids, are NOT
    written here because no reviewer identifiers were allocated to this lane.

  interpretation_limits:
    - >-
      An instrument at l <= 8, one curve, one host, m - 1 = 3. No speedup, no
      exponent, nothing about any curve's security.
    - >-
      No timing number from this contract may enter a boundary-table cell or
      any ratio. It makes no timing claim by design.
    - >-
      A certified-U label certifies absence from THIS enumeration at THIS cell
      with THIS factor base. It says nothing about any other factor base and
      nothing at any l where the enumeration is infeasible.
    - >-
      Reproducing EV-ICPERF-390707's counts confirms two implementations
      agree. It does not make either of them right; it makes a shared error
      the remaining live possibility, which is why C-KF-BITFLIP,
      C-KF-CONVENTION and C-NULL-CURVE exist.
    - >-
      D2 is this Coordinator's own derivation and has been compared against
      exactly one observed number (21). Its per-family split is the clause
      most likely to break and is reported as its own prediction for that
      reason.
    - >-
      Nothing here bears on whether the SAT-over-Groebner gap is structural.
      That question is RQ-SATIC-1ae57a's and, on this host, is gated on the
      Groebner column BATCH-a33cda is repairing.
