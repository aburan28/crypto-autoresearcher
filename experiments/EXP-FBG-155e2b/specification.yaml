experiment:
  id: EXP-FBG-155e2b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-dca08c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-dca08c
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Displacement-rank census of relation-incidence matrices from arithmetic-progression supports
    versus matched random supports, at four base sizes, two shift operators, two primes, with a Toeplitz
    positive control and no solver invoked
  objective: 'The one uncertainty a run reduces is whether constraining a factor base''s support to
    arithmetic progressions leaves a measurable shift structure in the relation-incidence matrix,
    expressed as its displacement rank, once the support has passed through curve-membership filtering.
    Stated in parts: (i) INSTRUMENT VALIDITY - does the displacement computation, at the dimensions
    actually reachable at toy scale, place a matched random support near the generic ceiling and a
    Toeplitz-by-construction matrix near order 1, since if it does not then no reading of the signal
    arm is possible and the run reports a controlled null; (ii) GAP - at fixed base size, fixed relation
    count and fixed per-row density, is the AP arm''s alpha measurably below the matched random arm''s,
    with the row-permutation control confirming the gap is shift structure and not dimension; (iii)
    PERSISTENCE - across a ladder of at least four base sizes, does any gap hold, shrink, or vanish,
    reported as a slope with an interval and compared after the fact to the two candidate behaviours
    KN-OPEN-006 names. A run cannot reduce uncertainty about solve time, about whether a structured
    solve would beat generic sparse methods, about the relation-probability penalty, or about index-calculus
    cost - no solver is invoked and no timing is taken, by design and not by omission. The deliverable
    is an alpha table with staircases, intervals, both operators, both primes, and the survival fraction
    of the AP construction.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves, at the four stated base sizes with the stated relation counts and per-row
      densities, over the two declared shift operators and two declared primes, the AP-supported relation-incidence
      matrices have the reported exact displacement ranks and the matched random supports have theirs,
      the gap between them is or is not outside the reported intervals, and the gap does or does not
      persist across the tested ladder. WHAT DOES NOT FOLLOW: nothing about the running time of any
      linear-algebra method; nothing about whether a structured solve beats generic sparse Wiedemann;
      nothing about the relation-probability penalty, which is not measured here; nothing about relation
      independence or rank of the system; nothing about index-calculus cost or about whether index
      calculus beats the generic square-root method; nothing about supports not tested or dimensions
      not reached; and no attack, break, speedup or security consequence. In particular a low measured
      alpha supports only that the matrix is close to shift-invariant at those dimensions under those
      operators, and supports nothing about what could be done with that fact.'
  inputs:
    procedure: 'STAGE 0, curves (cost: seconds). Generate prime-order toy curves via harness/toycurve.py
      and verify order, Hasse membership and generator order. STAGE 1, supports (cost: seconds). For
      each B in the ladder, construct the AP support by scanning a progression in the x-coordinate
      and keeping curve points, recording the survival fraction; construct the matched random support
      at the identical realised size. STAGE 2, harvest (cost: the variable cost; AP arm may need many
      more trial targets). Harvest exactly R equal to 2B relation rows per arm by exact multiset enumeration,
      recording trial counts per arm as a secondary metric and never netting them against alpha. STAGE
      3, matrices (cost: seconds). Form R by B matrices over two declared primes. STAGE 4, displacement
      (cost: order R B squared per cell). Compute the residue under each declared shift operator and
      its exact rank by fraction-free elimination; record the staircase by recomputing after each
      appended row. STAGE 5, controls (cost: seconds). Toeplitz-by-construction control, row-permutation
      recomputation, two-prime cross-check, all in the same invocation as the signal cells. STAGE
      6, ladder and report (cost: minutes plus 1 human hour). Repeat across four B values, four seeds
      and four curves; emit alpha curves with intervals.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic and point generation,
      numpy for matrix assembly, and a fraction-free Gaussian elimination over a declared prime written
      in plain Python or via a small integer-matrix routine - no external linear-algebra service,
      no Sage, and deliberately no sparse solver of any kind, since invoking one would exceed the
      contract's scope. harness/runner.py supplies the run manifest, seeds and the inference block.
    parameters: 'Curves: 4 generated prime-order toy curves. Group sizes: N near 2^12, 2^14, 2^16,
      2^18. Base sizes: B in the ladder ceiling of (6N) to the one-third power at each N, giving roughly
      29, 46, 73, 116. Relation rows: R equal to 2B per cell. Arity: m equal to 3. Shift operators:
      2 declared before any run - the standard lower-shift Z and a cyclic variant. Primes for exact
      rank: 2 declared 61-bit primes. Seeds: 4 per cell. Cells: 2 arms times 4 sizes times 4 curves
      times 4 seeds times 2 operators equals 256, plus 32 Toeplitz controls and 256 row-permutation
      recomputations. AP common differences swept over 8 values per size; AP survival fraction recorded
      for each.'
  controls:
  - Matched random support at identical realised size, identical R, identical per-row density, generated
    in the same invocation.
  - Toeplitz-by-construction positive control matrix of identical dimensions, which must show small
    alpha.
  - Rank computed over two independent large primes as a cross-check against a modular accident.
  - Two independent shift operators, with alpha reported under each.
  - 'Row-permutation control: alpha recomputed after randomly permuting the relation rows, which for
    a genuine shift structure must change alpha and for a coincidence must not.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a MATCHED RANDOM SUPPORT: a support of identical
    realised size, identical number of harvested relation rows R, and identical per-row density, generated
    in the same invocation and pushed through the identical displacement computation. For the signal
    arm to mean anything the null must satisfy two things: its alpha must be near the generic ceiling
    min(R, B) for a matrix of that density, since a random support has no shift structure, and its
    alpha staircase must climb at close to the maximum rate of 2 per row. If the random null itself
    shows low alpha, the displacement operator has been chosen so that it annihilates everything at
    these dimensions, the measurement has no resolving power, and the result is recorded as a controlled
    null. A second null is required: a deliberately Toeplitz-by-construction matrix of the same dimensions,
    which must show alpha of order 1; a pipeline that cannot detect known structure cannot report
    its absence.'
  independent_variables:
  - support type (arithmetic progression or matched random)
  - base size B along the four-point ladder
  - shift operator (two declared)
  - AP common difference
  - row ordering (as harvested or permuted)
  metrics:
    primary:
    - alpha, the exact displacement rank per matrix
    - alpha normalised by the generic ceiling min(R, B)
    - AP-minus-random alpha gap with bootstrap interval
    - slope of alpha against B on a log-log scale per arm
    - alpha of the Toeplitz-by-construction positive control
    secondary:
    - the alpha staircase as rows are appended
    - AP survival fraction under curve membership
    - trial-target count per harvested relation, per arm
    - per-row density per arm
    - rank agreement rate across the two primes and two operators
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The displacement rank alpha per arm at each base size, and its normalisation against
      the generic ceiling.
    formula: 'For a matrix M of shape R by B over a declared prime field and a declared shift operator
      Z, the displacement is D equal to M minus Z M Z transpose and alpha is the exact rank of D.
      Predicted: alpha of the Toeplitz positive control is at most 4 at every tested dimension; alpha
      of the matched random support is at least 0.9 times min(R, B); alpha of the AP arm is at most
      0.5 times alpha of the matched random arm at the smallest tested B. The slope of alpha against
      B is reported with its interval and is NOT pre-committed, for the reason recorded in the predictions
      block.'
    source: Pre-registered in the parent proposal IDEA-20260816-dca08c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N from about 2^12 to 2^18 with B from 29 to 116 and R from
      58 to 232, on 4 generated prime-order curves with 4 seeds. The transfer assumption is stated
      and is deliberately weak: alpha is a dimension-dependent integer and at these dimensions the
      generic ceiling is small, so a measured gap of a few units is at the edge of what the instrument
      resolves. Nothing is extrapolated to cryptographic dimensions; the only cross-scale statement
      permitted is the fitted slope across the four-point ladder, reported with its interval and labelled
      a four-point toy trend rather than an asymptotic rate. The known competing behaviour named in
      KN-OPEN-006 - growth like the square root of B - would be distinguishable from order-1 behaviour
      across this ladder only marginally, and the contract states that limitation up front rather
      than after the fact.'
    correspondence: null
  tail_checks:
  - The largest tested B, where the ladder is most informative and the exact rank computation is most
    expensive.
  - The smallest tested B, where integer effects dominate and a spurious gap is most likely.
  - AP common differences that are divisors of small numbers, where the progression may collapse onto
    few residue classes.
  - Cells where the AP survival fraction is lowest, since the realised support is then least like
    a progression.
  - The single cell with the largest AP-minus-random gap, recomputed independently over a third prime.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - 'Halt and report a controlled null if the matched random support''s alpha falls below 0.9 times
    the generic ceiling at any size: the instrument lacks resolving power there.'
  - 'Halt and report if the Toeplitz positive control''s alpha exceeds 4: the pipeline cannot detect
    structure it was given.'
  - Per-cell wall-clock budget of 900 seconds; an exceeded cell is recorded infeasible, which is not
    negative mathematical evidence.
  - Stop after the two smaller sizes if no gap is present, and report the null with its intervals
    rather than spending the ladder.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The Toeplitz positive control shows alpha at most 4 and the matched random null
    shows alpha at least 0.9 times the generic ceiling at every tested size, and the run reports an
    exact alpha for both arms at all four base sizes with bootstrap intervals, two shift operators,
    two primes, the row-permutation recomputation, and the AP survival fraction - whether or not a
    gap is found.
  falsification_criterion:
  - The matched random null's alpha falls well below the generic ceiling, voiding the instrument.
  - The Toeplitz positive control's alpha is large, voiding the pipeline.
  - The AP arm's alpha matches the random arm's within intervals at every tested size, answering the
    rank half of KN-OPEN-006 negatively in the tested scope.
  - Row permutation leaves the AP arm's alpha unchanged, showing any low rank came from dimensions
    rather than shift structure.
  - Ranks disagree across the two primes or two operators beyond a stated tolerance, showing alpha
    is not well defined as reported.
  - The AP support cannot reach size B on any tested curve, making the arm infeasible.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-dca08c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The two shift operators are named but not argued to be the right ones for a relation-incidence
    matrix whose columns index base elements rather than time steps; a Coordinator should require
    a short derivation of why these operators are the natural pair, or accept the result as operator-relative.
  - Whether curve-membership filtering leaves enough of the progression for the displacement structure
    to survive is not derived and is the design's main unquantified risk; the survival fraction measures
    it after the fact but does not predict it.
  - The matching rule across arms fixes R and per-row density but does not fix the target distribution
    used during harvest, which could differ between arms; a Coordinator must fix the target sampler
    before approval.
  - No relation-probability penalty is measured, so a Coordinator must record explicitly that no net
    conclusion about KN-OPEN-006 may be drawn from this contract's output.
