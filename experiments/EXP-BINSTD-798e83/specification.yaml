# EXP-BINSTD-798e83
# Basis-type census of one frozen parameter file. No conversion.
# Approved by DEC-20261002-b49d56.
experiment:
  id: EXP-BINSTD-798e83
  hypothesis_id: H-BINSTD-9afd33
  source_idea: IDEA-20260922-2a3771
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Basis-type census of the audited binary curves
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-b49d56
  objective: >-
    Hash the parameter file, pair each curve heading with its Basis Type
    line, and count ppBasis, tpBasis and onBasis. Record sect163k1 and
    the 16 legacy pnb or tnb names.
  inputs:
    path: analysis/binstd-curve-audit/binary-curve-params.txt
    sha256: ad4678d2703c36a5ee9c5d6dcaa5e886977b13c1c1546daad61f6c7710e4f493
    predicted:
      curves: 31
      ppBasis: 16
      tpBasis: 15
      onBasis: 0
      sect163k1: ppBasis
      legacy_pnb_or_tnb_names: 16
      legacy_onBasis: 0
  controls:
    - >-
      An onBasis count above 0 is false for this file. Reporting one
      invalidates the run.
    - >-
      Classifying sect163k1 as onBasis because of any other field is
      false. Reporting that label invalidates the run.
    - >-
      A sha256 mismatch invalidates the run. It is not a negative count.
    - Two parsers. They must not import each other.
  independent_variables:
    - route in {line_scan, repeat_parser}
  metrics:
    primary:
      - sha256_match
      - curve_count
      - ppBasis_count
      - tpBasis_count
      - onBasis_count
      - sect163k1_basis
      - legacy_name_count
      - legacy_onBasis_count
      - implementations_agree
    secondary: []
  heuristic_under_test: null
  preregistered_prediction:
    quantity: One hash, four counts, and one named label.
    formula: >-
      A heading is a line of the form ===== NAME =====. The Basis Type
      is the text after "Basis Type:". Legacy names contain the
      substrings pnb or tnb.
    source: >-
      IDEA-20260922-2a3771 paragraph H2, read 2026-10-02, and the file
      named above, counted in this design session. That count is not a
      run. No basis was converted.
  scale_relevance:
    tier: toy
    justification: One text file of 31 headings. No transfer to a decomposition cost.
    correspondence: null
  tail_checks:
    - The last heading c2tnb431r1 is required. Stopping before it and still reporting 31 curves is invalid.
  replication:
    seeds: []
    independent_instances: 31
    replication_note: Deterministic. The second run is the other parser.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the sha256 mismatches, mark the attempt invalid.
    - If onBasis is reported above 0, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either parser imports the other.
    - The sha256 does not match.
    - onBasis_count is above 0.
    - sect163k1 is reported as onBasis.
    - A basis conversion, a WDSat run, or a rho comparison is reported.
  success_criterion: >-
    Both runs agree, the sha256 matches, there are 31 curves, the counts
    are 16 ppBasis and 15 tpBasis and 0 onBasis, sect163k1 is ppBasis,
    and all 16 legacy pnb or tnb names are outside onBasis.
  falsification_criterion: >-
    The runs agree, the sha256 matches, onBasis stays 0, and any count
    or the sect163k1 label differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-798e83/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-798e83/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-798e83/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-798e83/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-798e83/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-798e83/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Basis conversion and any preprocessing timing.
    - WDSat conflict counts and any comparison with rho.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
