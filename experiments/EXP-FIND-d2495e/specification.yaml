experiment:
  id: EXP-FIND-d2495e
  hypothesis_id: H-FIND-e4c28b
  derived_from_idea: IDEA-20260807-d7ef50
  question_id: RQ-FIND-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Complete census of evidence-record question linkage across the committed ledger, with the
    all-campaign scan as the discrimination null between a schema-wide defect and one campaign's
    local practice
  objective: >-
    The single uncertainty a run reduces is whether the program's inability to trace an evidence
    record to the question it bears on is caused by the SCHEMA (no question_id field, no prefix
    type check) or by ONE campaign's practice. A run establishes, over the complete committed
    evidence corpus at a pinned commit, (i) the per-record linkage status under a frozen rule,
    (ii) the per-campaign unlinkable rate, (iii) the per-question difference between the evidence
    count a human reader would assign and the count a machine grep can recover, and (iv) the number
    of records for which no single question_id is answerable without asserting a bearing the record
    disclaims, which is the direct test of HEUR-LINK-1. No schema change is made, no record is
    edited, and no adoption decision is taken by this contract.
  what_this_is_not:
  - Not an attack, a distinguisher, a cryptanalytic result, or a claim about any scheme.
  - >-
    Not a schema change and not an adoption decision. Editing templates/research-records.md or
    tools/validate_ledger.py is a Coordinator act (AGENTS.md rule 1) that this run supplies input
    for and does not perform.
  - >-
    Not a correction of any evidence record. The audit is read-only; corrections proceed by
    supersession under new identifiers, never by edit (AGENTS.md rule 2).
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: laboratory
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - at the pinned commit of this repository, the committed evidence
      corpus contains a stated number of records whose hypothesis_id is null or non-H-prefixed,
      distributed across a stated number of campaigns at stated per-campaign rates, and a stated
      number of records for which a required question_id would be unanswerable. WHAT DOES NOT
      FOLLOW - no claim about any other worktree or any later commit, since the corpus differs
      across concurrent branches; no mathematical or security claim of any kind; and specifically
      NOT that a required question_id field is the correct remedy, which is a Coordinator decision
      that must weigh the unanswerable-record count this run measures.
  inputs:
    procedure: >-
      STAGE 0 (zero compute) - pin the base commit sha and record it; freeze the linkage rule
      verbatim in the run manifest before any file is read, since a rule adjusted after seeing the
      distribution would fit the answer. STAGE 1 (seconds) - enumerate every file under
      ledger/evidence/, parse each, and emit per-record (id, area, goal_id, hypothesis_id, linkage
      status, parse status). A parse failure is recorded in a separate disclosed-debt bucket with
      the exception text and never dropped. STAGE 2 (seconds) - the FORCED-ROW GATE - confirm that
      EV-SSI-001 and EV-SSI-042 appear in the unlinkable set. If they do not, the instrument is not
      reading the field it claims to read and no other number is reportable. STAGE 3 (seconds) -
      the DISCRIMINATION NULL - aggregate to per-campaign rates over ALL campaigns, not the SSI
      campaign alone, and report the number of campaigns with at least one unlinkable record
      alongside the number owning at least three evidence records. STAGE 4 (minutes, human-in-loop
      but recorded as data) - for every unlinkable record, attempt to name exactly one question_id
      from the record's own text and its cited run/experiment identifiers; classify each as
      ANSWERABLE, AMBIGUOUS (more than one question defensible) or DISCLAIMED (the record's own
      prose states it bears on no single hypothesis). STAGE 5 (seconds) - per-question true-versus-
      traceable evidence counts, where traceable is the count a literal grep for the RQ identifier
      recovers and true is the count reachable by following goal and experiment identifiers.
      STAGE 6 (zero compute) - emit the work list for a supersession backfill, ordered by
      discrepancy size, with no record edited.
    instrument: >-
      Python 3.11 with a YAML parser, read-only over the committed tree. No network, no randomness,
      no seeds, no solver, no compiler. Recorded through harness/runner.py so the manifest carries
      the exact command, the base commit sha and the dirty-tree state.
    parameters: >-
      Scope is the complete set of files under ledger/evidence/ at one pinned commit; there is no
      sampling and no exclusion. The frozen linkage rule is 'hypothesis_id is LINKED if and only if
      it is a string matching the regular expression ^H-; null, absent, ^IDEA-, or any other prefix
      is UNLINKED'. Campaign key is the AREA token of the EV identifier, overridden by an explicit
      goal_id where present, with every disagreement between the two reported rather than resolved.
  controls:
  - >-
    ALL-CAMPAIGN SCAN AS THE DISCRIMINATION NULL. The census runs over every campaign, not the SSI
    campaign that prompted the proposal. This is the arm that separates the two explanations - a
    defect present in one campaign only is local practice, and the schema claim is then false. It
    can fail, and its failing is the negative result this contract exists to be able to report.
  - >-
    FORCED ROWS, DERIVED BEFORE THE RUN. EV-SSI-001 and EV-SSI-042 are known by inspection to place
    IDEA identifiers in the hypothesis slot and MUST appear in the unlinkable set. If they do not,
    the extractor is not reading hypothesis_id and no other count is admissible.
  - >-
    NULL OBJECT - MATCHED CORPUS WHERE THE DEFECT MUST BE ABSENT. Run the identical extractor over
    ledger/hypotheses/, whose records carry a question_id by required schema. FORCED VALUE - zero
    unlinkable records. A nonzero count there means the extractor mis-parses rather than that the
    hypothesis corpus is broken, and no evidence-corpus number may be reported.
  - >-
    IMMUTABILITY GATE. The run's declared write scope excludes ledger/ entirely. A post-run diff
    over ledger/ must be empty; a nonempty diff invalidates the run regardless of its outputs.
  - >-
    DISCLOSED-DEBT BUCKET, EXACT NOT FLOORED. Unparseable records and duplicate identifiers are
    counted exactly and listed by path, per the CLAUDE.md conventions rule, so a partial loss of
    coverage cannot hide inside a rate.
  - >-
    PRE-FROZEN RULE. The linkage rule and the campaign key are written into the manifest before
    Stage 1, since a rule chosen after seeing the distribution would be fitted to it.
  independent_variables:
  - campaign (AREA token of the evidence identifier)
  - 'linkage status class: linked / null / non-H-prefixed / unparseable'
  - 'answerability class at Stage 4: answerable / ambiguous / disclaimed'
  - 'corpus: ledger/evidence (signal) versus ledger/hypotheses (null object)'
  metrics:
    primary:
    - >-
      affected_campaign_count - integer, the number of distinct campaigns containing at least one
      unlinkable evidence record, computed by grouping per-record linkage status on the campaign
      key. Reported alongside the number of campaigns owning at least three evidence records, so a
      rate as well as a count is decidable.
    - >-
      unlinkable_record_count - integer, the number of evidence records whose hypothesis_id is null
      or does not match ^H-, computed by the frozen rule over the complete census.
    - >-
      unanswerable_question_id_count - integer, the number of unlinkable records classified
      DISCLAIMED or AMBIGUOUS at Stage 4. This is the direct measurement of HEUR-LINK-1.
    - >-
      forced_row_gate - boolean, true iff both EV-SSI-001 and EV-SSI-042 appear in the unlinkable
      set. A false value voids every other number.
    secondary:
    - >-
      per_campaign_unlinkable_rate - dimensionless fraction per campaign, unlinkable records
      divided by that campaign's total evidence records.
    - >-
      question_count_discrepancy - integer per research question, the true evidence count minus the
      grep-traceable count.
    - >-
      unparseable_record_count and duplicate_identifier_count - exact integers with paths listed.
    - >-
      null_object_unlinkable_count over ledger/hypotheses/ - integer, forced to zero.
    - >-
      area_versus_goal_id_disagreement_count - integer, records whose AREA token and goal_id imply
      different campaigns.
  heuristic_under_test: HEUR-LINK-1
  preregistered_prediction:
    quantity: >-
      affected_campaign_count, the number of distinct campaigns containing at least one evidence
      record whose hypothesis_id is null or non-H-prefixed, together with unlinkable_record_count.
    formula: >-
      Predicted affected_campaign_count strictly greater than 1 and at least 25 percent of
      campaigns owning three or more evidence records; predicted unlinkable_record_count at least
      2. Under the competing explanation - the defect is one campaign's local practice - the
      forced value is affected_campaign_count exactly 1. Under the null that the prompting coverage
      scan was simply wrong, unlinkable_record_count is 0.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-d7ef50, whose predictions block states
      both the forced minimum of two rows and the all-campaign scan as the discriminating null.
      Fixed before any run under this contract exists and never tuned to data.
  scale_relevance:
    tier: laboratory
    justification: >-
      The measurement is a complete census of the object it claims about, so there is no scale
      transfer inside the repository at the pinned commit and no extrapolation is performed. The
      boundary that does exist is across repositories and commits - the corpus grows every batch
      and differs in every concurrent worktree, so every count is a floor for the program as a
      whole and an exact number only for the pinned tree. That boundary is stated rather than
      assumed away.
    correspondence: null
  tail_checks:
  - >-
    Report the number of campaigns owning fewer than three evidence records separately, since a
    campaign with one record cannot distinguish a rate from a coin flip and must not inflate the
    affected fraction.
  - >-
    Report the unlinkable count with the disclosed-debt bucket both included and excluded, so a
    parse failure cannot masquerade as a linkage failure.
  - >-
    Report the single largest per-question discrepancy and the record identifiers driving it, since
    one dominant campaign would make an aggregate rate misleading.
  - >-
    Report every record where AREA and goal_id disagree, because a mis-attributed campaign moves a
    record between the numerator and denominator of the discriminating metric.
  replication:
    seeds:
    - not_applicable_deterministic
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.2
    maximum_memory_gb: 2
    maximum_runs: 4
  stopping_rules:
  - Stop immediately if the forced-row gate fails; no other number is admissible.
  - Stop immediately if the null-object arm over ledger/hypotheses/ reports a nonzero unlinkable count.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop
    and never a negative result (AGENTS.md rule 5).
  - >-
    The linkage rule and campaign key are frozen before Stage 1 and are not revised after seeing
    any distribution; a revision requires a versioned protocol_amendment.
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER a finding about linkage (AGENTS.md rule 3).
  - >-
    A run whose post-run diff over ledger/ is nonempty is completed_invalid - the audit was
    required to be read-only and was not.
  - >-
    A run whose null-object arm was not executed in the same invocation as the signal arm is
    invalid_measurement, since the comparison the contract exists to make was not made.
  - >-
    A run that reports a rate over a partial denominator, without disclosing the uncovered
    fraction, is completed_invalid.
  - >-
    A run whose scope differs from the frozen contract - a sampled corpus, an excluded campaign, a
    different linkage rule - is a DIFFERENT experiment and requires a new contract.
  success_criterion: >-
    The forced-row gate passes, the null-object arm returns zero unlinkable records over
    ledger/hypotheses/, the census covers the complete evidence corpus with the disclosed-debt
    bucket listed exactly, and the run reports affected_campaign_count, unlinkable_record_count and
    unanswerable_question_id_count as integers with the per-campaign table behind them. The
    schema-wide reading of H-FIND-e4c28b is SUPPORTED only if affected_campaign_count is strictly
    greater than 1 and reaches at least 25 percent of campaigns owning three or more evidence
    records; otherwise the run supports the local-practice reading instead, and says so.
  falsification_criterion:
  - >-
    affected_campaign_count equals 1 - the defect is confined to one campaign, the schema-wide
    claim is FALSE as stated, and the remedy indicated is guidance rather than a schema change.
    This is the primary negative outcome and it is fully reportable.
  - >-
    unlinkable_record_count equals 0 - both forced rows failed to appear as unlinkable under the
    frozen rule, the premise of the parent proposal is wrong, and the finding is about the coverage
    scan that prompted it.
  - >-
    unanswerable_question_id_count is greater than 0 - HEUR-LINK-1 is refuted, a bare required
    question_id would force records to assert a bearing they disclaim, and any schema proposal must
    carry a documented-null path.
  - >-
    The forced-row gate fails - the extractor is not reading hypothesis_id and nothing is
    reportable.
  - >-
    The null-object arm reports a nonzero unlinkable count over ledger/hypotheses/ - the parser is
    wrong and no evidence-corpus number means anything.
  required_artifacts:
  - manifest.yaml with the exact command, base commit sha, dirty-tree state, resolved model/inference block and environment
  - raw-result.json carrying the per-record census row for every evidence record, not summaries
  - the null-object arm's per-record rows over ledger/hypotheses/, in the same file as the signal arm
  - the frozen linkage rule and campaign key text, written before Stage 1 and hashed
  - the exact disclosed-debt list of unparseable records and duplicate identifiers, by path
  - the Stage 4 answerability classification with the reason recorded per record
  - the supersession work list, ordered by discrepancy, naming no edit to any existing record
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval and the user's authorization are required before execution. This contract
    is review_required and is NOT approved; approved_by is null and execution_authorized is false
    (AGENTS.md rule 1).
  - >-
    The write scope must be confirmed to exclude ledger/ before dispatch, since the immutability
    gate is the one control a careless implementation would silently violate.
  - >-
    Stage 4's answerability classification is judgement-bearing and must be recorded with its
    reason per record, so a later reader can disagree with a specific call rather than with a total.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-d7ef50
    authored_at: '2026-08-25'
    note: >-
      Controls, metrics and criteria are taken from the parent proposal's null_object_control,
      predictions and falsification_conditions blocks, which already name the all-campaign scan as
      the discrimination null and the two forced rows. The Stage 4 answerability classification is
      the parent's HEUR-LINK-1 validation_plan made into a counted metric. Boilerplate that is
      identical across contracts by program rule - invalidation rules, required artifacts, approval
      gate - comes from the fixed table. No field is invented; a value the proposal did not supply
      is null or is declared as a derivation gap below.
  derivation_gaps:
  - >-
    The 25 percent threshold in the success criterion is a Coordinator choice, not a value the
    parent proposal supplied. It is stated before the run precisely so it cannot be moved
    afterwards, but a reviewer may reasonably argue for a different line, and moving it after the
    run requires a versioned protocol_amendment.
  - >-
    The campaign key is a proxy. A record whose AREA token and goal_id disagree is counted under
    goal_id here; that convention is declared, is reported as a count, and is the most likely way
    the discriminating metric could be biased.
  - >-
    Stage 4 mixes measurement with judgement. Whether a record is DISCLAIMED or merely AMBIGUOUS is
    read from its own prose, and two readers can differ. The mitigation is per-record reasons, not
    a claim of objectivity.
  - >-
    Whether the correct remedy is a required question_id, an optional one, or a documented-null
    path is NOT decided by this contract and must not be inferred from a passing run.
