experiment:
  id: EXP-SMON-e5cbe6
  hypothesis_id: H-SMON-db677d
  version: 1
  title: >-
    Falsification battery for the Semaev summation cover: root identification, the
    factorization dichotomy over F_p, complete splitting on the factor-base locus, the
    exact per-class count, and two matched null controls
  status: completed_without_coordinator_approval
  status_note: >-
    NOT `approved`. AGENTS.md rule 1 reserves experiment approval to the Coordinator, and
    no Coordinator subagent approved this. The status string says so rather than
    borrowing a label the record has not earned. The full protocol, its provenance, and
    the exact order in which predictions were fixed relative to execution are in
    contract.md, which is the human-readable companion to this file.

  objective: >-
    Falsify, at toy scale, the finite-scale consequences of H-SMON-db677d: that the
    monodromy of the m-th Semaev summation cover is (Z/2)^{m-2} acting regularly, for
    every curve and every m >= 3.

  inputs:
    parameters:
      field_bits: [7, 7, 8, 9, 9, 10]
      primes_sampled: [101, 103, 211, 307, 401, 1009]
      primes_exhaustive: [37, 53, 101, 211]
      arities_m: [3, 4, 5]
      curves: 20
    curve_classes:
      - generic j (12)
      - j = 0 with p = 1 mod 3, and with p = 2 mod 3
      - j = 1728 with p = 1 mod 4, and supersingular with p = 3 mod 4
      - full rational 2-torsion (4)

  controls:
    - >-
      NULL-A: a uniformly random degree-4 polynomial over F_401. Tests whether the C4
      dichotomy is a property of the object or of the measurement.
    - >-
      NULL-B: the S_4 resultant construction with the inner summation polynomial
      replaced by a random quadratic -- same degree, same construction, elliptic
      structure removed. This is the nearby-object control of the inventor protocol:
      it isolates the elliptic group law rather than the resultant shape as the cause.

  independent_variables: [m, prime, curve class, factor-base locus versus uniform locus]

  metrics:
    primary:
      - fraction of good specializations whose factorization type matches the prediction
      - maximum irreducible factor degree observed
      - count of mixed factorization types
      - fraction of good factor-base specializations that split completely
      - residual of the exact per-class identity S^k N^{n-k} + N^k S^{n-k}
    secondary:
      - fraction of signed-sum root sets matching the computed root set over F_{p^2}
      - number of distinct Frobenius classes realized, and their distribution
      - square class of disc_T S_m by arity
      - degenerate-locus point counts against the branch-locus description
      - fraction of null-control samples obeying the dichotomy

  heuristic_under_test: null

  preregistered_prediction:
    quantity: >-
      The multiset of irreducible-factor degrees of S_m(a_1,...,a_{m-1},T) over F_p at a
      good specialization.
    formula: >-
      1^{2^{m-2}} when chi(f(a_1)) = ... = chi(f(a_{m-1})); 2^{2^{m-3}} otherwise. No
      other multiset may occur.
    source: >-
      Theorem 4.2 of papers/semaev-conservation-specialization/paper.tex, itself a
      corollary of Theorem 3.4 (the monodromy is (Z/2)^{m-2} acting regularly, so a
      non-identity Frobenius element is fixed-point-free of order 2).

  scale_relevance:
    tier: toy
    justification: >-
      The theorem being tested is characteristic- and curve-independent, so a toy-scale
      battery is a genuine falsification opportunity rather than an extrapolation: a
      counterexample at p = 101 would refute the general statement outright. The converse
      does not hold -- agreement at toy scale does not establish the theorem, which rests
      on the derivation. Nothing here may be asserted above toy tier.
    correspondence: null

  tail_checks:
    - >-
      The degenerate locus point count is compared against the exact branch-locus
      prediction, not merely bounded: at m=3 with Z=0 it must be exactly p, and at p=53
      with Z=1 exactly 53 + (2*53 - 1) - 1 = 157.
    - >-
      The per-class identity is checked for EVERY class, not only the totally split one,
      so a compensating error in two classes cannot cancel.

  replication:
    seeds: [20260807]
    independent_instances: 0
    independent_instances_note: >-
      ZERO independent implementations. The code and the derivation share an author. A
      reimplementation in Sage or Magma would be worth more than more samples from this
      one; neither was available in this environment.

  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.02
    maximum_memory_gb: 1
    maximum_runs: 1

  stopping_rules:
    - Single run; no adaptive stopping, no re-running on an unfavourable result.

  invalidation_rules:
    - >-
      A crash, timeout or resource failure invalidates the run and is NOT negative
      evidence about the mathematics (AGENTS.md rule 3).
    - >-
      If either null control obeys the C4 dichotomy at a rate near 100%, the primary
      metric is uninformative and the run is void as evidence for C4.

  success_criterion: >-
    Every good specialization matches the predicted factorization type; no irreducible
    factor of degree >= 3 and no mixed type occurs; every good factor-base specialization
    splits completely; the exact per-class identity holds with residual 0 in every class
    of every exhaustive cell; and both null controls fail the dichotomy.

  falsification_criterion: >-
    Any good specialization whose factorization type is not the predicted one; any
    irreducible factor of degree >= 3; any mixed type; any good factor-base
    specialization failing to split completely; any nonzero per-class residual; any good
    m >= 4 specialization with non-square disc_T S_m; or a null control obeying the
    dichotomy at a rate indistinguishable from 100%.

  required_artifacts:
    - code/semaev_cover.py
    - code/verify.py
    - contract.md
    - runs/RUN-SMON-e5cbe6-001/manifest.yaml
    - runs/RUN-SMON-e5cbe6-001/raw-result.json

  assigned_to: top-level session
  approved_by: null
  approved_by_note: >-
    Deliberately null. No Coordinator approval was obtained; see status_note.
