experiment:
  id: EXP-EQLA-111b7a
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-61049d
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE FREE RELATIONS THAT SAY NOTHING: on a j=0 curve every phi-orbit is a horizontal line
    section, so P + phi(P) + phi^2(P) = O identically and a phi-stable factor base of size B hands
    over B/3 relations at zero search cost - and the same Z[phi]-module structure that produces them
    proves they span the trivial isotypic component, which lies inside the kernel of the evaluation
    map and therefore determines no logarithm at all'
  status: draft
  objective: "(A) THE FREE RELATIONS EXIST AND ARE ELEMENTARY. Let E : y^2 = x^3 + b over F_p, p =\
    \ 1 mod 3, zeta a primitive cube root of unity in F_p, and phi(x, y) = (zeta x, y). For any affine\
    \ point P = (x, y) the three points P, phi(P) = (zeta x, y), phi^2(P) = (zeta^2 x, y) all have\
    \ the SAME y-coordinate, so they lie on the horizontal line Y = y. That line meets the cubic in\
    \ the three roots of X^3 = y^2 - b, which are exactly x, zeta x, zeta^2 x. Three collinear points\
    \ on a Weierstrass cubic sum to the point at infinity. Hence\n  P + phi(P) + phi^2(P) = O  for\
    \ every affine P on E,\nequivalently phi^2 + phi + 1 = 0 in End(E) - the minimal polynomial of\
    \ a primitive cube root of unity, realised geometrically. A phi-stable factor base with B/3 complete\
    \ orbits therefore contains B/3 relations of weight 3 with right-hand side zero, obtainable with\
    \ NO decomposition search: they are handed over by the construction of the factor base itself.\n\
    (B) AND THEY CARRY EXACTLY ZERO INFORMATION. Consider the evaluation map e : Z^B -> G, e(a) =\
    \ sum_i a_i P_i, whose kernel is the relation lattice L. Because the factor base is phi-stable,\
    \ e is C_3-equivariant, where C_3 acts on Z^B by the orbit permutation sigma and on G by multiplication\
    \ by lambda (the eigenvalue of phi, lambda^2 + lambda + 1 = 0 mod N). Any vector a fixed by sigma\
    \ satisfies lambda e(a) = e(a), hence (lambda - 1) e(a) = O; since N is prime and lambda != 1,\
    \ e(a) = O. SO THE ENTIRE TRIVIAL ISOTYPIC COMPONENT OF Z^B LIES IN THE RELATION LATTICE. The\
    \ orbit-sum vectors e_i + e_{sigma(i)} + e_{sigma^2(i)} span exactly that component. They are\
    \ free because they are forced, and they are forced because they are in the kernel - which is\
    \ precisely why they determine nothing.\n(C) THE QUANTITATIVE CLAIM, WHICH IS WHAT MAKES THIS\
    \ A TEST AND NOT AN ANECDOTE. Adding the B/3 orbit-sum rows to a relation matrix\n  raises rank(M)\
    \ by exactly B/3   (they are independent as vectors in F_N^B),\n  raises rank(M restricted to\
    \ V_lambda) by exactly 0,\nwhere V_lambda is the subspace the unknown logarithm vector inhabits\
    \ (IDEA-20260807-0e4d83). Under folding, the orbit-sum row folds to 1 + lambda + lambda^2 = 0:\
    \ the zero row. So a relation counter, a rank counter and a matrix-density statistic all move\
    \ by a predictable amount while the solvable system does not move at all. This is a concrete,\
    \ pre-computable instance of \"structure that inflates every progress metric the program currently\
    \ records and inflates no progress\".\n(D) THE DISCRIMINATION. Two explanations of any measured\
    \ relation-yield advantage on a phi-stable factor base are separated by this test:\n  EXPLANATION\
    \ 1 - the phi structure genuinely produces more usable\n    relations per unit search. Prediction:\
    \ informative rank rises with the\n    orbit-sum rows included, and the searches-per-informative-relation\n\
    \    ratio against a size-matched generic base falls below 1.\n  EXPLANATION 2 - the phi structure\
    \ produces more ROWS, all of which are\n    either shifts (IDEA-20260807-0e4d83) or orbit sums\
    \ (this record), and\n    the informative content is unchanged. Prediction: informative rank is\n\
    \    flat, and the searches-per-informative-relation ratio is exactly the\n    density penalty,\
    \ with the factor 3 cancelling.\nEV-STR-003 O-11 measured \"the one reproducible effect: a constant\
    \ factor r = 3 in relation collection\", searches per relation ROW, and interpreted it as the\
    \ known automorphism-quotient saving. Whether that factor 3 is an information gain or a row-count\
    \ artifact was NOT adjudicated by any arm of EXP-STR-002/003/004. This record adjudicates it,\
    \ and the free orbit-sum rows are the sharpest available probe because their information content\
    \ is provably zero and their row count is provably B/3.\n(E) THE J = 1728 CROSS-CHECK, which distinguishes\
    \ a real mechanism from a coincidence. On y^2 = x^3 + a x with p = 1 mod 4 and i^2 = -1, the endomorphism\
    \ is phi(x, y) = (-x, i y) with phi^2 = [-1], so the orbit of x under the x-action {x, -x} has\
    \ length 2 and the \"orbit sum\" P + phi^2(P) = P - P = O is the NEGATION relation and nothing\
    \ more - it is already built into any x-coordinate factor base and is not new. Predicted consequence:\
    \ the free-relation count is B/3 for j = 0 and 0 (beyond negation) for j = 1728. A measurement\
    \ that reported free relations at j = 1728 would be measuring its own bookkeeping."
  resource_label: 'R1 + R3. R3: the relation lattice as a Z[phi] = Z[zeta_3]-module and the identity
    phi^2 + phi + 1 = 0 in End(E). R1: the orbit is generated by multiplying the x-coordinate by zeta
    in F_p, and the collinearity that forces the relation is a statement about the CURVE EQUATION
    and the line Y = y, i.e. about field data, not about group-oracle outputs.'
  admissibility: admissible
  admissibility_argument: 'Admissible, and its admissibility is instructive rather than incidental.
    The free relations are obtained WITHOUT any group operation and without any query to a group oracle:
    they follow from the shape of the curve equation and from the fact that a horizontal line cuts
    y^2 = x^3 + b in a zeta-orbit. A generic algorithm holding only opaque encodings could not know
    that three of its handles sum to the identity without performing the additions. So the resource
    is real and it is R1/R2-flavoured. What the proposal then demonstrates is that this real, non-generic,
    zero-cost resource has zero informational value for the linear-algebra stage - which is a strictly
    more useful statement than declaring it inadmissible would have been. Recording it as admissible-and-worthless
    is the honest label.'
  reachability_gate: 'T5''s isogeny-walk form does not apply: one curve, no movement between curves.
    T4 binds: the order-3 x-action, and hence every free relation in this record, exists only when
    D_0 = -3, which is fixed by the isogeny class and unreachable from a curve whose class lacks it
    at any cost. The lane is permanently scoped to the D_0 = -3 family, which is density zero among
    prime-field curves. Within that family the object is free - B/3 free relations for B multiplications
    by zeta. SCOPE NOTE, not an attack claim: secp256k1 has a = 0 and hence lies in this family; this
    record''s own prediction is that the free relations there would carry zero information too.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): archive the two derivations. STAGE 1 (seconds):
      numerically verify P + phi(P) + phi^2(P) = O on 100 random points per instance. HARD GATE -
      a failure is a curve-arithmetic bug and everything downstream is void. STAGE 2 (seconds): build
      B = 3k phi-stable factor bases excluding x = 0; assert 3 | B, sigma^3 = identity, B/3 orbits
      of length exactly 3. STAGE 3 (minutes): assemble M_h, M_f, M_hf; check every folded free row
      is zero ENTRYWISE; compute the four ranks; report the two differences. STAGE 4 (minutes): NULL
      1 across f in {0, 1/4, 1/2, 3/4, 1}; NULL 2; NULL 3 planted positive. STAGE 5 (hours, the expensive
      part and the only expensive part): measure hit rates on the phi arm and the size-matched generic
      arm with enough targets for a 20% standard error, at three B values, and report searches_per_informative_relation
      for both. Everything except STAGE 5 runs in under a minute per instance in pure Python on the
      existing harness.'
    mechanism: "STEP 1 (zero compute, derivation, archived first). Write out the collinearity proof\
      \ of P + phi(P) + phi^2(P) = O and the trivial-isotypic-in-kernel argument of (B). Both are\
      \ a few lines. Include the j = 1728 degeneration.\nSTEP 2 (seconds). On each toy j = 0 instance,\
      \ VERIFY the identity numerically: for 100 random affine points P, check that E.add(E.add(P,\
      \ phi(P)), phi2(P)) is None (the point at infinity) using the existing harness/toycurve.py arithmetic.\
      \ This is a known-answer test for the curve arithmetic as much as for the identity, and it costs\
      \ nothing.\nSTEP 3 (the measurement). Build a phi-stable factor base of B = 3k x-coordinates.\
      \ Assemble:\n  M_h  = the R harvested relation rows (with right-hand sides),\n  M_f  = the B/3\
      \ free orbit-sum rows (right-hand side 0),\n  M_hf = their concatenation.\nReport rank(M_h),\
      \ rank(M_hf), and the folded ranks rank(tilde-M_h), rank(tilde-M_hf). Predicted: rank(M_hf)\
      \ - rank(M_h) = B/3 exactly; rank(tilde-M_hf) - rank(tilde-M_h) = 0 exactly; and every folded\
      \ free row is the zero vector, which is checkable entrywise before any rank is computed.\nSTEP\
      \ 4 (the conversion that matters). Define and report\n  searches_per_informative_relation :=\n\
      \    (total decomposition attempts) / (increase in folded rank),\nfor the phi arm and for a\
      \ size-matched generic factor base on the same curve with the same arity and budget. EV-STR-003\
      \ O-11 reported the same ratio with ROWS in the denominator and measured about 3. Predicted\
      \ here: with folded rank in the denominator the ratio equals the measured density penalty, so\
      \ the factor 3 disappears and the net is close to 1.\nSTEP 5 (the free-relation stress test,\
      \ and the one way this could be useful). Ask whether the free rows help ANY downstream step\
      \ even though they add no rank: (a) do they reduce the number of harvested relations needed\
      \ to reach full folded rank? Predicted no, by (B). (b) Do they change the peeling behaviour\
      \ of structured Gaussian elimination by supplying weight-3 rows? That is a real, separable question\
      \ and it is handed to IDEA-20260807-d20846 rather than answered here. (c) Do they serve as a\
      \ zero-cost CERTIFICATE that the factor base is genuinely phi-stable and correctly lifted? YES,\
      \ and this is a genuine deliverable: the identity fails the moment an orbit is truncated or\
      \ a lift is inconsistent, so \"all B/3 orbit sums evaluate to O\" is a cheap, independent integrity\
      \ check on exactly the two failure modes EV-STR-003 O-4 and EV-STR-004 IL0 flagged."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL 1 fake-orbit triples, swept over the genuine fraction f - the decay test and the primary
    discriminator.
  - NULL 2 random weight-3 matrix of identical shape, density and column-orbit partition - gives the
    false-positive rate of the detector.
  - NULL 3 planted informative weight-3 rows - must raise folded rank.
  - Size-matched generic factor base with B columns on the same curve, same arity, same target budget
    - isolates phi structure from factor-base size.
  - 'j = 1728 arm: the same pipeline on a D_0 = -4 curve, where the predicted free-relation count
    beyond negation is 0.'
  - Matched Pollard rho with negation (0.886 sqrt(N/6) on these curves) and matched BSGS, in group
    operations, for the Pareto row.
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL 1 - FAKE ORBITS (the matched null
    of the same shape). Partition the SAME B x-coordinates into B/3 arbitrary triples that are NOT
    phi-orbits, matched on count, on weight-3 row structure and on column-orbit partition, and append
    their "orbit-sum" rows. PREDICTED: those rows are NOT relations - the three points do not sum
    to O - so appending them corrupts the system, and the check "does the row evaluate to O" must
    FAIL on essentially all B/3 fake triples while succeeding on all B/3 genuine ones. This is the
    sharp discriminator and it is a binary test with no free parameters. DECAY PARAMETER: the fraction
    f of genuine phi-orbits among the appended triples. The count of rows passing the "evaluates to
    O" check must be exactly f * B/3, i.e. it must decay LINEARLY to zero as f -> 0. Anything else
    means the check is not measuring what it claims. NULL 2 - RANDOM MATRIX OF IDENTICAL SHAPE AND
    DENSITY. A random 0/1 matrix with the same dimensions, weight-3 rows and the same column-orbit
    partition. PREDICTED: its folded rows are NOT zero (a random weight-3 row supported on one orbit
    folds to 1 + lambda + lambda^2 only if its three ones sit exactly on one orbit with equal coefficients).
    The fraction of folded-to-zero rows in the null is the false-positive rate of the "free relation"
    detector and must be reported. NULL 3 - PLANTED POSITIVE. A synthetic set of weight-3 rows that
    DO carry information (three independent factor-base elements from three different orbits summing
    to a known nonzero target). The instrument must report a folded-rank increase there, or it cannot
    see information and every zero it reports is void.'
  independent_variables: []
  metrics:
    primary:
    - free_relation_count, phi arm and every null arm
    - rank(M_h), rank(M_hf), rank(tilde-M_h), rank(tilde-M_hf)
    - entrywise check that every folded free row is zero (boolean per row)
    - hit rate and attempts, phi arm and size-matched generic arm, per B
    secondary:
    - searches_per_informative_relation, both arms
    - NULL 1 decay curve over at least five values of f
    - count of excluded x = 0 and of truncated or incomplete orbits
    - sha256 of the factor base and of the row list per cell
    - matched rho and BSGS group-operation counts and BSGS memory
  heuristic_under_test: null
  preregistered_prediction:
    quantity: free_relation_count (rows passing the "evaluates to O" check)
    formula: EXACTLY B/3 on the phi arm (all genuine orbits), and at most a negligible false-positive
      count on NULL 1. A phi arm count below B/3 localises a truncated or mis-lifted orbit and is
      a factor-base integrity failure, not a mathematical result.
    source: pre-registered in IDEA-20260807-61049d before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - x = 0 IS FIXED BY phi. The single point with x = 0 (which exists on y^2 = x^3 + b iff b is a QR)
    has a length-1 orbit and 3P = O for it, i.e. it is a 3-torsion point. Since N is prime and N >
    3, it is not in G. It must be excluded and its exclusion recorded; including it silently would
    corrupt both the orbit count and sigma.
  - COLLINEARITY IS NOT SPECIAL TO phi. Every line meets the cubic in a triple summing to O, so "sums
    to O" alone identifies nothing. The x-ratio condition is the separator and must be applied.
  - DEDUPLICATION. The committed harness suppresses duplicate rows (harness/endomorphism_la.py lines
    303-304 and 350-351). If a free row coincides with a harvested row it will be silently dropped
    and the count will be short by an amount that depends on the harvest. Deduplication must be disabled
    or logged per row.
  - RIGHT-HAND SIDES. Free rows have right-hand side 0 and harvested rows do not. A driver that stores
    bare incidence vectors (EV-STR-003 O-9) cannot tell them apart and will produce a meaningless
    mixed system.
  - SMALL B. At B = 27 the free rows number 9 and the folded matrix is 9 x 9; any rank statement there
    has almost no resolution.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY B/3 on the phi arm (all genuine orbits), and at most a negligible false-positive
    count on NULL 1. A phi arm count below B/3 localises a truncated or mis-lifted orbit and is a
    factor-base integrity failure, not a mathematical result.
  falsification_criterion:
  - P + phi(P) + phi^2(P) != O for any affine P on a verified j = 0 curve. The identity is false as
    implemented; halt, because it is a two-line theorem and the failure is a curve-arithmetic bug
    that voids the entire STR line of work, not only this record.
  - Any folded free row is nonzero. Either lambda is the wrong root, or sigma does not match phi,
    or the orbit is truncated. Each is separately checkable and none is a discovery.
  - rank(M_hf) - rank(M_h) != B/3. The free rows are not independent as vectors, which means the factor
    base has repeated orbits or the row list was deduplicated - the same dedup pathology EV-STR-003
    O-4 traced.
  - NULL 1 shows free relations at f = 0. The detector fires on non-orbits; it is measuring collinearity
    or bookkeeping, not phi structure, and every count it produced is void.
  - searches_per_informative_relation on the phi arm comes out BELOW 1 against the size-matched generic
    arm. Then the phi structure buys genuine information per unit search, EXPLANATION 1 fires, and
    the result requires independent review before any interpretation - this is the outcome the record
    would most like to be wrong about, and it is stated so that it cannot be quietly absorbed.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
