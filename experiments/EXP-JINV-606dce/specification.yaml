experiment:
  id: EXP-JINV-606dce
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-51675e
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: The affected-versus-safe scope audit for L3, built on the observation that deciding "is |D_0|
    one of the nine class-number-one discriminants" costs NINE INTEGER SQUARE TESTS and no factoring
    - producing a concrete bit-discount table in which secp256k1 and the BN/BLS12 pairing families
    are j=0 (D_0 = -3, |Aut| = 6, discount 0.79 bits) while the NIST and Brainpool pseudorandom families
    are |Aut| = 2 (discount 0.00 bits), and in which small |D_0| BY ITSELF confers nothing because
    only D_0 in {-3,-4} carries extra automorphisms
  status: draft
  objective: "(A) THE CHEAP EXACT TEST, WHICH IS THE TECHNICAL CONTENT. For E/F_p with #E(F_p) = p\
    \ + 1 - t, the Frobenius discriminant is D = t^2 - 4p < 0 and the fundamental discriminant D_0\
    \ satisfies D = D_0 * f^2. Deciding whether D_0 equals a SPECIFIC value d requires only checking\
    \ that D/d is a perfect square - one exact integer square test. Therefore:\n  \"Is |D_0| one of\
    \ the nine class-number-one discriminants\n   {-3,-4,-7,-8,-11,-19,-43,-67,-163}?\" costs NINE\
    \ square tests.\n  \"Is |D_0| <= B?\" costs B square tests.\nNO FACTORISATION OF t^2 - 4p IS REQUIRED.\
    \ This matters because factoring a 512-bit t^2 - 4p is not free, and the belief that a small-|D_0|\
    \ audit needs it is the reason such audits are not routinely done. At B = 10^6 the audit of every\
    \ standardised curve completes in well under a second. [derived in this record; elementary and\
    \ mechanically verifiable.]\n(B) THE STRUCTURAL FACT THAT SHRINKS THE AFFECTED SET DRASTICALLY.\
    \ Over F_p with p > 3, |Aut_{F_p}(E)| is 2, 4 or 6 and nothing else: 6 requires j = 0 (hence D_0\
    \ = -3) and p congruent to 1 mod 3, 4 requires j = 1728 (hence D_0 = -4) and p congruent to 1\
    \ mod 4, and every other curve has |Aut| = 2. CONSEQUENCE, AND IT IS THE POINT OF THE AUDIT: a\
    \ curve with D_0 = -163 is \"small |D_0|\", is a CM curve with class number one, has a computable\
    \ Hilbert class polynomial - and has |Aut| = 2, hence ZERO automorphism discount. SMALL |D_0|\
    \ BY ITSELF CONFERS NO RHO DISCOUNT. The affected set for the only established L3 effect is exactly\
    \ {D_0 = -3, D_0 = -4} and it is not the small-|D_0| set. Every scope statement in this lane that\
    \ says \"small discriminant curves are affected\" is wrong as written, and this record fixes it.\n\
    (C) THE DISCOUNT, STATED AGAINST THE PROGRAM'S OWN BASELINE. The convention is 0.886*sqrt(N) group\
    \ operations and KN-TECH-006 records that this ALREADY INCLUDES the sqrt(2) from negation. The\
    \ EXTRA discount at special j is therefore sqrt(|Aut|/2):\n  j = 0    : sqrt(3) = 1.732, i.e.\
    \ log2(sqrt(3)) = 0.792 BITS.\n  j = 1728 : sqrt(2) = 1.414, i.e. 0.500 BITS.\n  all else : 1.000,\
    \ i.e. 0.000 bits.\nFor a 256-bit prime-order subgroup, a j=0 curve therefore offers about 127.2\
    \ bits against parallel rho rather than 128.0. THAT IS THE ENTIRE ESTABLISHED EFFECT OF THIS LANE\
    \ and it changes no parameter recommendation anywhere. Quoting sqrt(6) here would double-count\
    \ negation and overstate the discount by 0.5 bits (see IDEA-20260807-a3d644 claim (D)).\n(D) THE\
    \ FAMILIES, WITH THEIR VERIFICATION STATUS STATED HONESTLY.\n  AFFECTED, j = 0, D_0 = -3, |Aut|\
    \ = 6, 0.79 bits:\n    - secp256k1: y^2 = x^3 + 7 over p = 2^256 - 2^32 - 977. a = 0 forces\n\
    \      j = 0 by the definition j = 1728*4a^3/(4a^3 + 27b^2). PUBLIC AND\n      DIRECTLY VERIFIABLE\
    \ FROM THE PUBLISHED PARAMETERS. That this curve\n      admits the standard GLV endomorphism is\
    \ widely used in deployed\n      implementations, which requires p congruent to 1 mod 3; the audit\n\
    \      re-derives p mod 3 rather than relying on that.\n    - BN and BLS12 pairing families (including\
    \ BLS12-381, y^2 = x^3 + 4):\n      constructed with CM discriminant -3 and curve equation y^2\
    \ = x^3 + b,\n      hence j = 0. This is a property of the construction, stated in the\n     \
    \ families' definitions; the audit re-derives j from the published (a,b)\n      rather than relying\
    \ on the construction.\n  AFFECTED, j = 1728, D_0 = -4, |Aut| = 4, 0.50 bits:\n    - Curves of\
    \ the form y^2 = x^3 + a x with p congruent to 1 mod 4. NO\n      WIDELY DEPLOYED PRIME-FIELD\
    \ SIGNATURE OR KEY-EXCHANGE CURVE IN THIS\n      PROGRAM'S CORPUS IS KNOWN TO BE OF THIS SHAPE,\
    \ and the audit's job is\n      to confirm or refute that by running (A) over the full curve list\n\
    \      rather than asserting it.\n  SAFE, |Aut| = 2, 0.00 bits:\n    - NIST P-256, P-384, P-521:\
    \ a = -3 with b derived pseudorandomly from a\n      published seed. j is generic and no small-|D_0|\
    \ structure was designed\n      in. THE EXACT D_0 IS NOT COMPUTED IN THIS RECORD; the claim is\
    \ the\n      weaker and exactly checkable one that D_0 is not among the nine, which\n      test\
    \ (A) settles in nine square tests. THE BRIEF'S OBSERVATION THAT\n      P-256 DOES NOT HAVE SMALL\
    \ |D_0| IS THEREFORE A CHECKABLE CLAIM AND THIS\n      RECORD CHECKS IT RATHER THAN REPEATING\
    \ IT.\n    - Brainpool: verifiably pseudorandom by construction; same treatment.\n  UNVERIFIED,\
    \ MARKED [open]:\n    - Curve25519 / Ed25519, and every other curve in the corpus not listed\n\
    \      above. This record does NOT state their D_0. It states the test and\n      requires the\
    \ executor to run it. Asserting a discriminant from memory\n      is exactly the fabrication AGENTS.md\
    \ rule 9 forbids, and a table cell\n      that reads \"[open], test not yet run\" is a correct\
    \ entry while a\n      guessed one is not.\n  OUT OF SCOPE:\n    - GLS and Q-curve constructions\
    \ over F_{p^2}, and Koblitz curves over\n      binary fields. Both carry larger exploitable endomorphism\
    \ structure,\n      both are outside this campaign's prime-field scope, and neither is\n     \
    \ covered by any number in this record.\n\n(E) WHAT IS CLAIMED BEYOND THE CONSTANT: NOTHING. The\
    \ audit's entire output is a table whose largest entry is 0.79 bits. It is filed as scope and\
    \ baseline calibration. Its value is that it makes every other L3 result reportable with a correct\
    \ affected-versus-safe statement, which is checklist item C18-style scope honesty in docs/target-result-profile.md\
    \ terms and is required of any asymptotic or concrete claim this campaign eventually makes."
  resource_label: '"audit: consumes no resource". No attack is mounted and no R1-R8 resource is consumed;
    the record consumes only public curve parameters and integer arithmetic.'
  admissibility: admissible
  admissibility_argument: 'A scope audit names no mechanism and therefore cannot be inadmissible.
    It does interact with the filter in one useful way: by establishing that the affected set is exactly
    {D_0 = -3, D_0 = -4} and that the effect there is 0.79 and 0.50 bits, it bounds in advance what
    ANY admissible L3 mechanism could be worth on a deployed curve, which is the cheapest possible
    sanity frame for the rest of the lane.'
  reachability_gate: 'CENTRAL TO THIS RECORD AND STATED AS A HARD LIMIT. By T4, D_0 is an isogeny
    class invariant and j = 0 requires D_0 = -3, so a curve whose class does not contain a j = 0 curve
    CANNOT BE WALKED TO ONE AT ANY COST - not in polynomial time, not in exponential time, not at
    all, because the target does not exist in the class. The affected set is therefore FIXED AT CURVE
    GENERATION TIME and cannot be enlarged by any attacker action. Symmetrically, a curve that IS
    j = 0 cannot escape the discount. This makes the audit a permanent classification rather than
    a snapshot, and it is the strongest form the reachability gate takes anywhere in this batch: T5''s
    cost question does not even arise, because the walk is not expensive - it is impossible.'
  inputs:
    procedure: 'CHEAPEST VALID DISCRIMINATOR: STEP 2''s VALIDATION SET PLUS THE THREE HEADLINE CURVES,
      AND IT COSTS UNDER A MINUTE OF COMPUTE. Run the nine square tests on secp256k1, on P-256 and
      on a deliberately constructed toy D_0 = -163 curve. The first must return -3 with a 0.792-bit
      discount, the second must return "not small" with 0.000, and the third must return -163 with
      0.000. Those three answers together verify the tool, verify claim (B), and produce the two most-cited
      rows of the table. Everything else is breadth.'
    mechanism: 'STEP 1 (implementation, low). Write the audit: given (p, a, b, #E) from published
      parameters, compute j = 1728*4a^3/(4a^3+27b^2) mod p, t = p+1-#E, D = t^2 - 4p, and run the
      nine square tests of claim (A) plus a sweep |D_0| <= 10^6. Emit (j, D_0 if found else "not small,
      |D_0| > 10^6", |Aut| from j and p mod 3 / p mod 4, extra discount sqrt(|Aut|/2), bits).

      STEP 2 (validation before use - MANDATORY). Validate the audit on toy curves where D_0 is computable
      by brute-force factoring of t^2 - 4p, at 16-24 bits, over at least 200 curves including deliberately
      constructed D_0 = -3 and D_0 = -4 instances. The square-test route and the factoring route must
      agree on 100 percent. A single disagreement halts the line: an audit tool that misclassifies
      a discriminant would put a wrong entry in a scope table, which is worse than having no table.

      STEP 3 (the corpus run). Run the audit over every prime-field curve the program''s corpus names
      with published parameters. Emit the table. EVERY CELL IS EITHER A COMPUTED VALUE OR THE LITERAL
      STRING "[open], not computed" - never a remembered one.

      STEP 4 (the cross-check that catches the most likely error). For each curve the audit reports
      as j = 0, independently verify a = 0 in the published equation; for each reported j = 1728,
      verify b = 0. j is computed from (a,b) so this is nearly circular, but it catches transcription
      errors in p, a or b, which are the realistic failure mode of an audit like this.

      STEP 5 (the bit table). Combine with claim (C) to produce, per curve: subgroup bit size, generic
      rho cost 0.886*sqrt(N), discounted cost, and the bit difference. State plainly, in the table''s
      own caption, that no entry moves any parameter recommendation and that the largest entry is
      0.79 bits.

      STEP 6 (the negative deliverable, and it is the one most likely to be cited). Write the sentence
      this lane needs and currently lacks: "The L3 effect is confined to curves with D_0 in {-3, -4};
      it is at most 0.79 bits; it cannot be acquired by a curve that does not already have it, because
      by T4 j = 0 requires D_0 = -3 and no isogeny walk changes D_0; and seven of the nine class-number-one
      discriminants confer none of it."'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - known-positive toy set with constructed D_0 = -3 and -4 (N1)
  - known-negative toy set with independently factored D_0 (N2)
  - isogeny-class invariance check (N3)
  - six sextic twists of one j=0 curve, all of which must report D_0 = -3 (N4)
  - 'nearby-object control: a D_0 = -163 curve, which must report a discount of exactly zero'
  - 'transcription cross-check: reported j = 0 must coincide with a = 0 in the published equation'
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, and for an audit the null is a KNOWN-ANSWER\
    \ SET. N1 KNOWN-POSITIVE SET: toy curves constructed deliberately with D_0 = -3\n  (a = 0, p congruent\
    \ to 1 mod 3) and D_0 = -4 (b = 0, p congruent to 1\n  mod 4). The audit MUST classify 100 percent\
    \ of them correctly.\nN2 KNOWN-NEGATIVE SET: toy curves with random (a,b), for which D_0 is\n\
    \  computed independently by factoring t^2 - 4p. The audit must not report a\n  small |D_0| for\
    \ any curve whose factored D_0 is large. FALSE POSITIVES ARE\n  THE DANGEROUS ERROR HERE, because\
    \ a false positive would put a deployed\n  curve in the affected column.\nN3 THE ISOGENY-INVARIANCE\
    \ CHECK, which is the sharpest: enumerate a small\n  toy isogeny class and confirm the audit returns\
    \ the SAME D_0 for every\n  curve in it, as T4 requires. An audit whose answer varies within an\
    \ isogeny\n  class is wrong, and this control catches errors the other two cannot.\nN4 THE TWIST\
    \ CHECK: the six sextic twists of a j=0 curve all have j = 0 but\n  lie in different isogeny classes\
    \ with different traces. The audit must\n  report j = 0 and D_0 = -3 for all six despite the differing\
    \ t. If it does\n  not, it is confusing the class with the curve.\nDECAY PARAMETER: |D_0| itself,\
    \ swept from 3 upward. The reported discount must be 0.79 bits at |D_0| = 3, 0.50 at 4, and EXACTLY\
    \ 0.00 at every larger |D_0| including 7, 8, 11, 19, 43, 67 and 163. A discount that decays gradually\
    \ with |D_0| rather than dropping to zero immediately after 4 is wrong and indicates the tool\
    \ is conflating \"CM\" with \"extra automorphism\" - which is precisely the error claim (B) exists\
    \ to prevent."
  independent_variables: []
  metrics:
    primary:
    - per curve: p, a, b,
    - per curve: extra discount as a ratio and in bits, against 0.886*sqrt(N)
    - the sweep bound used and the number of square tests performed
    - validation-set agreement rate, exact counts
    secondary:
    - pass/fail of N1-N4 and of the nearby-object control
    - explicit list of every cell marked [open] and why
  heuristic_under_test: null
  preregistered_prediction:
    quantity: audit versus factoring agreement on the toy validation set
    formula: 200 of 200 exact agreement. Anything less halts the line.
    source: pre-registered in IDEA-20260807-51675e before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - MODEL CONVERSION. Montgomery and Edwards curves must be converted to short Weierstrass before
    j is computed. A conversion error changes j and hence the classification, which is the single
    most likely way to get a wrong row.
  - COFACTOR AND SUBGROUP. The discount applies to rho on the prime-order subgroup G. Quoting it against
    the full group order rather than N would be an accounting error of up to log2(cofactor)/2 bits.
  - '"SPECIAL" IS AMBIGUOUS AND THE AMBIGUITY IS THE LANE''S MAIN SCOPE HAZARD. A curve can be special
    by having small |D_0|, by having a special p (e.g. a pseudo-Mersenne prime), by being pairing-friendly,
    or by having extra automorphisms. Only the last confers the discount. The table has separate columns
    and no row may be summarised by a single word.'
  - PAIRING-FRIENDLY IS A DIFFERENT AXIS. BN and BLS12 curves are affected here because they are j
    = 0, and separately have small embedding degree, which is lane L8's subject. Conflating the two
    would misstate both; this record makes no pairing claim.
  - THE SWEEP BOUND IS NOT INFINITY. "|D_0| > 10^6" is what the audit can certify; it is not "D_0
    is large" in any stronger sense. Every negative cell names the bound that was actually swept.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 200 of 200 exact agreement. Anything less halts the line.
  falsification_criterion:
  - The audit disagrees with factoring on any toy curve. The tool is wrong and no deployed curve is
    audited until it is fixed.
  - secp256k1 does not classify as j = 0, D_0 = -3. Either the corpus's parameters are wrong or the
    tool is; both must be resolved before anything is reported.
  - Any NIST or Brainpool curve classifies with |D_0| <= 10^6. Surprising, significant, and requires
    independent replication under AGENTS.md rule 12 before it is reported, because it would be a claim
    about a standardised curve.
  - D_0 varies within a toy isogeny class. T4 is violated by the tool; every number void.
  - Any curve reports |Aut| outside {2,4,6}. Impossible over prime fields with p > 3; a bug.
  - A required curve's published parameters are not available in the corpus. That cell stays "[open]"
    - it is NOT filled from memory, and an audit with open cells is a correct audit while one with
    guessed cells is fabrication.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-51675e
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
