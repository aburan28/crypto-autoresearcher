      S = 0..n_e, per arm)'
    - experiments/EXP-HQC-982268/runs/<RUN-ID>/pair_moments_by_distance.csv (muhat_2^(d), d = 1..n_e-1)
    - experiments/EXP-HQC-982268/runs/<RUN-ID>/diagnostics.json (qhat, phat, gammahat, Corr(W_i,W_j),
