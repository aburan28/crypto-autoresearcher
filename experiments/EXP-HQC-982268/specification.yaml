    complexity_hypothesis: per-trial cost = 2 * [ (omega+omega_r) * t_sx(n) + (N + [N if dup>1] + 896*n_e)/R_add
      + (2 omega + 2 omega_r + omega_e)/R_rng ]
    sharding_plan: 3 independent shards per (T) set; shards are embarrassingly parallel and order-independent;
