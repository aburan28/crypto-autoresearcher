    - id: PS-D2
      role: OPTIONAL dilution rung (destroy parameter), matched to PS-R1 at p* ~ 0.35
      n: 11779
      n_e: 46
      n_2: 128
      dup: 1
      omega: 56
      omega_r: 63
      omega_e: 63
      N: 5888
      tau: 0.49987
      p_star_exact: 0.352532
      m: 16
    - id: PS-D4
      role: OPTIONAL dilution rung
      n: 23563
      n_e: 46
      n_2: 128
      dup: 1
      omega: 79
      omega_r: 89
      omega_e: 89
      N: 5888
