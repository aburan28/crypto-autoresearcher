experiment:
  id: EXP-HQC-982268
  hypothesis_id: H-HQC-18d1b4
  version: 1
  proposed_in_task: TASK-20260803-c470c0
  proposed_at: '2026-08-03'
  git_commit_at_authoring: 6dc0040e24a5180d69ac5bef48b60f4d7c012bcc
  title: Direct measurement, on the TRUE space (T), of the average k-way joint inner-decoder failure moment
    mubar_k = E[C(S,k)]/C(n_e,k) for k = 2..k_max at four HQC parameter sets - including HQC-1's parameters
    verbatim, and three order-matched sets at HQC's own (n_e, m, p*) with the Reed-Muller duplication
    multiplicity reduced to 1 - against the frozen prediction log2 A_k = 0 implied by assumption A17,
    with three i.i.d.-by-construction null arms, five drift-to-(M) detectors, a dilution destroy-parameter
    ladder, and a derived per-cell sample-size requirement.
  status: approved
  status_note: '`draft`, NOT `review_required` and NOT `approved`. This document is an Executor''s PROPOSAL.
    It becomes a contract only when a Coordinator ledger archive commits it as experiments/EXP-HQC-982268/specification.yaml,
    and it may be executed only when its status reads `approved` with a non-null approved_by. BATCH-003
    authorizes ZERO runs of it (runs_authorized: 0 for both producers; BATCH-003-OPENING.md section 4).'
  objective: Decide, by measurement rather than by reading, whether the substitution that turns SPEC Proposition
    6.1.4's per-block bound p_i into SPEC Theorem 6.1's binomial tail - assumption A17, whose entire content
    is the family mubar_k = q^k - holds on the space the correctness statement is actually about. EV-HQC-6fd5b1
    O-6 and DEC-20260802-9664c6 D-6 establish that this cannot be settled by further reading and cannot
    be settled by any second-moment statistic, because mu_m is not determined by mu_2. This contract therefore
    estimates the HIGH-ORDER joint moment itself, at HQC's own moment orders m = 16, 17, 30, on space
    (T).
  admission_and_ceiling: BINDING ON EVERY DOWNSTREAM RECORD. THIS EXPERIMENT MAKES NO SECURITY CLAIM ABOUT
    HQC IN EITHER DIRECTION. Its CLAIM TIER IS CAPPED AT TOY, and RQ-HQC-001.claim_tier_ceiling makes
    that ceiling MORE binding for a standardized algorithm, not less. It is not an attack, not an attack
    improvement, not a cryptanalytic result, not a closure, and not an impossibility claim. It CANNOT
    MEET ANY COMPLETION CRITERION of GOAL-HQC-001 under any outcome. It is NOT admissible toward the AGENTS.md
    rule 13 closure quorum. It does not adjudicate X9/A20 and does not reopen A19 (DEC-20260802-9664c6
    D-3). A TIMEOUT, CRASH, RESOURCE EXHAUSTION OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL AND
    IS NEVER NEGATIVE EVIDENCE about A17 or about HQC - stated explicitly because the predecessor of the
    authoring task was terminated by exactly such a failure.
  estimated_statistic:
    name: mubar_k
    definition: mubar_k := E[C(S,k)] / C(n_e,k) = (1/C(n_e,k)) * sum over all C(n_e,k) index sets J of
      size k of P[AND_{j in J} F_j = 1], where F_j is the indicator that inner block j maximum-likelihood-decodes
      to a non-zero codeword and S = sum_j F_j. Reported as log2 A_k with A_k = mubar_k/q^k and q = mubar_1
      = E[S]/n_e.
    primary_order: k = m = delta_e + 1, i.e. 16 (HQC-1 shape), 17 (HQC-3), 30 (HQC-5)
    why_this_statistic_and_not_the_DFR: The DFR is P[S >= m], a single number that conflates every order
      k >= m through Jordan's alternating sum. A17's content is the FAMILY mubar_k = q^k, and the sensitivity
      of Theorem 6.1 collapses onto the SINGLE order k = m because a17_sensitivity.yaml step 2 shows the
      l = m term carries 99.90 / 99.99 / 99.92 percent of the tail at HQC-1/3/5. Estimating mubar_k for
      every k from ONE histogram of S therefore returns the whole assumption as a curve, and identifies
      WHICH order fails if one does - which the DFR alone cannot. The DFR is reported as a SECONDARY metric,
      free of extra cost.
    why_this_statistic_and_not_pairwise_correlation: 'EV-HQC-6fd5b1 O-6 and DEC-20260802-9664c6 D-6: mu_m
      IS NOT DETERMINED BY mu_2. A joint law can have pairwise correlation indistinguishable from zero
      while mu_m >> q^m, if the dependence lives in a rare many-blocks-fail configuration. ALL PUBLISHED
      EVIDENCE IN BOTH PRIMARY SOURCES IS FIRST- OR SECOND-MOMENT IN CHARACTER AND IS THEREFORE STRUCTURALLY
      INCAPABLE OF SIGNING THE DIRECTION. A design measuring pairwise correlation would answer the wrong
      question with real compute. That is the specific error this contract exists to avoid.'
    exactness_of_the_reduction: P[S >= m] = sum_{k=m}^{n_e} (-1)^(k-m) C(k-1,m-1) C(n_e,k) mubar_k, exactly,
      by Jordan inclusion-exclusion, with NO independence and NO exchangeability assumption. Substituting
      mubar_k = q^k recovers Theorem 6.1's expression exactly. The estimand and the assumption are therefore
      THE SAME OBJECT.
    correction_to_the_inherited_derivation: 'a17_characterization.md Lemma L1 asserts the F_j are EXCHANGEABLE.
      The cyclic-shift argument given there proves identical MARGINALS and TRANSLATION invariance inside
      the retained window, not exchangeability (shifting by n_2 maps block n_e-1 outside the window).
      THIS DISCREPANCY IS RESOLVED, NOT FLAGGED (DEC-20260802-9664c6 D-7): the estimand mubar_k is the
      AVERAGE over index sets, the Jordan identity above holds for it unconditionally, and the estimator
      is unbiased for it by linearity alone. If exchangeability does hold, mubar_k = mu_k and no number
      changes. A distance-resolved pair moment is measured as a secondary metric to test the exchangeability
      question empirically.'
  inputs:
    space: 'SPACE (T), ALWAYS. x, y drawn uniformly from the weight-omega vectors of R = F_2[X]/(X^n -
      1); r_1, r_2 uniformly of weight omega_r; e uniformly of weight omega_e; all five independent (SPEC
      A1). e'' = x*r_2 - r_1*y + e in R; e-tilde = e'' truncated to its first N = n_e*n_2 coordinates
      (A23). SPACE (M) IS USED ONLY IN THE NULL ARM NULL-M AND NEVER IN A (T) ARM. DEC-20260802-9664c6
      D-5: on (M) the A5 => A17 implication HOLDS, so a (T) arm that drifted to (M) would be measuring
      its own assumption.'
    ring_rule: n = smallest prime greater than N with 2 primitive mod n (SPEC section 4.1's own rule).
      The value is recomputed by the driver and asserted equal to the tabulated value in every manifest;
      a mismatch is failed_implementation.
    weight_rule: omega, omega_r = omega_e are the smallest integers at the level's own omega/omega_r ratio
      whose EXACT p* from Proposition 6.1.2 reaches the level's own published p*. This makes the tabulated
      p* slightly exceed the target by at most 0.008; both the target and the achieved value are recorded
      per set. PS-A uses HQC-1's published weights verbatim.
    parameter_sets:
    - id: PS-A
      role: ANCHOR - true HQC-1 parameters, verbatim
      n: 17669
      n_e: 46
      n_2: 384
      dup: 3
      d_i: 192
      omega: 66
      omega_r: 75
      omega_e: 75
      N: 17664
      tau: 0.99972
      p_star_exact: 0.339788
      m: 16
      q_for_sizing: 0.0004993
      q_for_sizing_source: SPEC Table 11 observed inner DFR 2^-10.96; q is MEASURED at run time
      k_reachable: 2, 3  (k=4 needs T_req = 3.01e9, above the allocated T = 1e8)
    - id: PS-R1
      role: 'ORDER-MATCHED to HQC-1: same n_e, same m, same p* regime, dup 3 -> 1'
      n: 5923
      n_e: 46
      n_2: 128
      dup: 1
      d_i: 64
      omega: 39
      omega_r: 44
      omega_e: 44
      N: 5888
      tau: 0.99409
      p_star_exact: 0.347921
      m: 16
      q_for_sizing: 0.2306
      q_for_sizing_source: Gaussian/orthogonality decoder model, validated against SPEC Table 11 to 0.55-0.87
        bits LOW; q is MEASURED in Stage A
      k_reachable: 2 .. 16  (exactly k = m; T_req(16) = 2.91e7 against T = 1e8, margin 3.4x; k = 17 is
        out of reach)
    - id: PS-R3
      role: ORDER-MATCHED to HQC-3
      n: 7187
      n_e: 56
      n_2: 128
      dup: 1
      d_i: 64
      omega: 45
      omega_r: 51
      omega_e: 51
      N: 7168
      tau: 0.99735
      p_star_exact: 0.364929
      m: 17
      q_for_sizing: 0.3704
      k_reachable: 2 .. 22
    - id: PS-R5
      role: ORDER-MATCHED to HQC-5
      n: 11549
      n_e: 90
