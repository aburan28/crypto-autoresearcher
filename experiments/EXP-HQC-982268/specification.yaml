    - validity status and reason; every INV-* evaluation with its numeric value
    - 'certificate block: kind and why (see certificate below)'
    - every protocol deviation, infrastructure failure and unexpected observation, recorded and never
      discarded
    fixed_artifacts:
    - experiments/EXP-HQC-982268/driver/  - a NEW standalone driver; nothing under harness/ or tools/
      is modified, reused or imported
    - 'experiments/EXP-HQC-982268/fixtures/published_values.json - the FROZEN regression fixture: p* =
      0.339788/0.361804/0.372489; log2 p_i(6.1.4) = -10.7950/-14.1374/-11.3240; log2 p_i(6.1.3) = -10.1312/-13.6690/-10.7638;
      SPEC Table 10 binomial column 6197/6237/6272/6301; implied gamma 0.7350/0.7355/0.7325/0.7249. Checked
