    - experiments/EXP-HQC-982268/runs/<RUN-ID>/null_arms.json (CTRL-BS per-replicate, NULL-M, NULL-P)
    - experiments/EXP-HQC-982268/runs/<RUN-ID>/control_checks.json (CTRL-DEC, CTRL-REPLAY, INV-* trigger
