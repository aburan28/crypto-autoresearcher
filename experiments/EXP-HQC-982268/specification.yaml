  certificate:
    kind: none
    why: EXPLICITLY NONE, per docs/claims-and-verification.md. This contract claims no discrete-log solve
      and no factor-base relation; it is a PURE MEASUREMENT RUN of a probability. There is nothing to
      certify and that is stated rather than left blank. The nearest analogues to a certificate here are
      the reproducibility fixture (INV-REPRO), the seed-replay bit-identity check (CTRL-REPLAY) and the
      independent decoder cross-check (CTRL-DEC), and none of them is called a certificate.
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-003/tasks/TASK-20260803-c470c0/feasibility_analysis.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-003/tasks/TASK-20260803-c470c0/heuristics.md
  deliberate_exclusions:
  - 'NO pairwise-correlation-only design. EV-HQC-6fd5b1 O-6: second-moment data is structurally incapable
    of signing the direction.'
  - 'NO sampling on space (M) in any (T) arm. DEC-20260802-9664c6 D-5: on (M) the A5 => A17 implication
    holds and the measurement would be of its own assumption.'
  - NO reduction of m. Reducing the moment order would measure exactly the quantity O-6 says is uninformative.
  - NO raising of p* to buy reachability. It pushes toward p* = 1/2 where the dependence washes out and
    a null would falsely confirm A17. ST-4 forbids it at run time.
  - NO outer Reed-Solomon decoder. It is not needed and its bugs would be indistinguishable from signal.
  - NO adaptive stopping on the primary metric (ST-7), and NO post-hoc adjustment of the invalidation
    thresholds (INV-NULL).
  - NO dependency on the sibling task TASK-20260803-6f50df. CTRL-ORACLE is optional and non-blocking.
  - NO A19 re-litigation. DEC-20260802-9664c6 D-3 rejected it; Prop 6.1.4 p_i is used throughout, consistent
    with CORR-20260802-3ae664 part C.
  open_items:
  - id: OPEN-1
    item: mubar_16 at HQC-1 own (n_e, q) is infeasible by ~33 orders of magnitude (T_req = 3.4e41).
    status: OPEN
    successor: An importance-sampled (T) estimator conditioning on a block-weight profile with exact likelihood-ratio
      reweighting. The conditioning statistic must have a computable (T) law; the global weight w(e'')
      is the only obvious candidate and is not obviously sufficient. NOT DESIGNED HERE AND NOT CLAIMED
      TO WORK. It would need its own contract and its own null.
  - id: OPEN-2
    item: The dup = 1 -> dup in {3,5} step has no intermediate rung (dup = 2 costs 3.2e20 core-seconds).
    status: OPEN
    successor: HEUR-HQC-6 F6 is the only check this budget affords. A genuine test needs dup = 2 at a
      much smaller n_e, breaking order-matching to buy rarity - a different contract with a different
