  sample_size_derivation:
    formula: V(n_e,q,k) = [ sum_{j=0}^{k} C(k,j) C(n_e-k,j) q^(k+j) ] / (C(n_e,k) q^(2k)) - 1 ; SE(log2
      Ahat_k) = sqrt(V/T) / ln 2 ; T_prec(eps) = V / (eps ln 2)^2 ; s_90 = smallest s with sum_{s'<=s}
      P[S=s'] C(s',k) >= 0.90 E[C(S,k)] ; T_stab = 30 / P[S >= s_90] ; T_req  = max(T_prec, T_stab).
    why_T_stab_exists: C(S,k) is strongly right-skewed; a Gaussian SE is meaningless unless the S-range
      carrying the estimand's mass is actually sampled. T_stab IS THE BINDING CRITERION AT EVERY CELL
      EXAMINED, and omitting it understates the requirement by a factor 28 at one cell. A reviewer asking
      whether the feasibility arithmetic is optimistic should check this line first.
    derived_values:
    - set: PS-A
      k: 2
      T_req: 1.18e5
      SE_at_allocated_T: 0.0092
    - set: PS-A
      k: 3
      T_req: 1.61e7
      SE_at_allocated_T: 0.108
    - set: PS-A
      k: 4
      T_req: 3.01e9
      note: EXCEEDS the allocated T = 1e8; k=4 is NOT reachable
    - set: PS-A
      k: 16
      T_req: 2.06e42
      note: INFEASIBLE by ~34 orders of magnitude at the Table-11 q = 4.993e-4; 3.40e41 at the more optimistic
        q = p_i = 5.588e-4. This is the identity T_req ~ 1/DFR at a DFR below 2^-128.
    - set: PS-R1
      k: 16
      T_req: 2.91e7
      SE_at_allocated_T: 0.0321
      note: k = m reached with a 3.4x margin on T; k = 17 is out of reach
    - set: PS-R3
      k: 17
      T_req: 3.09e5
      SE_at_allocated_T: 0.008
    - set: PS-R5
      k: 30
      T_req: 2.72e6
      SE_at_allocated_T: 0.0259
    optimistic_assumptions:
    - The 2x implementation contingency may be insufficient; component throughputs are measured, the composed
      pipeline is not. If the true factor is 5x the total becomes 1.4e5 core-seconds and ST-1 truncates
      T rather than overrunning.
    - Perfect 4-core scaling is assumed. Trials are embarrassingly parallel and memory-trivial, so this
      is mild, but it is assumed and not measured.
    - q at the reduced sets is MODELED (Gaussian/orthogonality, validated to 0.55-0.87 bits LOW against
      SPEC Table 11). If the Stage-A qhat lands low, k = m may become unreachable at PS-R1; ST-4 is the
      pre-registered response.
    - The T_stab threshold of 30 is a judgement, not a theorem. At 100 the PS-R1 requirement rises to
      9.7e7 - still inside budget, which is why 30 was not chosen to make the number work.
    - Sizing uses the NULL variance. Under strong dependence the true variance is larger; the jackknife
      and ST-2 are the guard.
    - gamma = 0.735 is used ONLY for the modeled secondary effect size, never for sizing. The frozen prediction
      does not move with it.
  stopping_rules:
  - id: ST-1
    rule: 'HARD WALL-CLOCK CAP PER RUN: 3600 seconds. On expiry the run STOPS and reports the trials completed.
      A truncated run is a VALID PARTIAL MEASUREMENT at the smaller T with a correspondingly larger SE,
      provided T >= T_req at the k values reported; k values whose T_req exceeds the achieved T are reported
      as NOT REACHED, never as null results.'
  - id: ST-2
    rule: 'VARIANCE-INFLATION STOP: if at any k the jackknife SE exceeds 2x the model SE, the run continues
      but the value at that k is FLAGGED as dependence-inflated. This is itself an observation about the
      joint law and is recorded, not suppressed.'
  - id: ST-3
    rule: 'BUDGET-PRESSURE CUT ORDER, fixed in advance so it cannot be chosen after seeing data: (1) stage_D_dilution,
      (2) PS-R5''s T halved, (3) PS-R3''s T halved, (4) PS-A''s third shard. THE NULL ARMS AND THE INSTRUMENT
      CONTROLS ARE NEVER CUT. PS-R1 is never cut, because it is the only order-matched arm at HQC-1''s
      shape.'
  - id: ST-4
    rule: 'UNDERPOWER CONTINGENCY, pre-registered: if the Stage-A qhat at PS-R1 places k = m = 16 outside
      the reachable range at the allocated T, the run PROCEEDS with the reachable k_max and REPORTS k
      = 16 as NOT REACHED. It does NOT raise p* to force reachability - raising p* pushes toward p* =
      1/2 where the dependence washes out and a null would falsely confirm A17. An amendment request to
      the Coordinator is the only route to a different parameter, and it creates a new record.'
  - id: ST-5
    rule: 'NULL-FIRST ORDERING: NULL-P and NULL-M run BEFORE any (T) arm at each set, and Stage B does
      not start at a set whose NULL-P or NULL-M fails INV-NULL. A null that fails after the (T) data exist
      invites motivated interpretation; ordering removes the opportunity.'
  - id: ST-6
    rule: 'HEURISTIC-REFUTATION STOP: if F2a, F2b or F2c fires (HEUR-HQC-2 refuted), EVERY downstream
      evaluation at HQC''s parameters is FORBIDDEN in the analysis and in every record derived from it.
      The measured log2 Ahat_k values remain valid as SCOPED measurements at their own parameters and
      are reported as such.'
  - id: ST-7
    rule: NO ADAPTIVE STOPPING ON THE PRIMARY METRIC. T is fixed per set before Stage B begins, from the
      pre-registered T_req formula applied to the Stage-A qhat. The run is never stopped or extended because
      log2 Ahat_k looks interesting.
  invalidation_rules:
  - id: INV-NULL
    trigger: 'At a given (set, k): (a) |log2 Ahat_k| > 3 SE_null on CTRL-BS; or (b) same on NULL-M; or
      (c) same on NULL-P; or (d) the CTRL-BS excess exceeds 25 percent of the (T) excess at that k.'
    consequence: The (T) result at that (set, k) is INVALID_MEASUREMENT - never a negative observation,
      never evidence about A17. Under (d) the value is reported as NOT SEPARABLE FROM THE NULL, with the
      number PRINTED AND MARKED rather than discarded.
    preregistration_note: THIS RULE IS STATED BEFORE ANY NUMBER EXISTS, as docs/inventor-protocol.md requires.
      The magnitude threshold (25 percent) and the significance threshold (3 SE) are both fixed here and
      may not be adjusted after data exist.
  - id: INV-DRIFT
    trigger: D1 gammahat in [0.95,1.05] at a (T) arm, or D4 failing at >= 2 of 4 tails at PS-A
    consequence: that arm is INVALID_MEASUREMENT - the sampler has drifted toward space (M) and would
      be measuring its own assumption
  - id: INV-Q
    trigger: qhat outside the rigorous bracket [ P[Bin(d_i,p)>d_i/2] + 0.5 P[Bin(d_i,p)=d_i/2] , p_i(6.1.4)
      ] at any set.
    consequence: FAILED_IMPLEMENTATION. Both ends are rigorous and the bracket contains all three of SPEC
      Table 11 published observed inner DFRs.
  - id: INV-INVARIANT
    trigger: 'Any of: a sampled vector of the wrong weight (D2); w(e-tilde) exceeding 2 omega omega_r
      + omega_e (D3); a CTRL-REPLAY mismatch (D5); a CTRL-DEC mismatch; mubarhat_k > mubarhat_{k-1}; or
      n not equal to the tabulated smallest primitive prime above N.'
    consequence: FAILED_IMPLEMENTATION. Each is mathematically impossible or a violated invariant, so
      it is never evidence about A17.
  - id: INV-SHARD
    trigger: the three shard estimates at a given k are mutually inconsistent at chi-square p < 0.001
    consequence: the pooled value at that k is NOT RESOLVED; the per-shard values are recorded and the
      discrepancy is reported, never averaged away
  - id: INV-REPRO
    trigger: the frozen regression fixture (published-value reproduction, see required_artifacts) does
      not reproduce bit-for-bit at run time
    consequence: FAILED_IMPLEMENTATION before any measurement is taken
  success_criterion: 'THE EXPERIMENT SUCCEEDS IF IT PRODUCES AN INTERPRETABLE MEASUREMENT, WHATEVER ITS
    SIGN. Concretely, all of: (i) every planned run reaches a terminal status; (ii) all three null arms
    satisfy INV-NULL at every reported (set, k); (iii) no INV-DRIFT, INV-Q, INV-INVARIANT or INV-REPRO
    trigger fires; (iv) log2 Ahat_m is reported with a jackknife 3-sigma interval at PS-R1, PS-R3 and
    PS-R5, and log2 Ahat_2 and log2 Ahat_3 at PS-A; (v) the S-histograms, seeds, commands and environment
    are archived so every number recomputes without rerunning. SUCCESS IS NOT "A17 IS CONFIRMED" AND IS
    NOT "A17 IS REFUTED"; those are Reviewer and Coordinator judgements and the Executor does not make
    them.'
  falsification_criterion: THE FROZEN PREDICTION log2 A_k = 0 IS CONTRADICTED AT A TESTED PARAMETER SET
    if |log2 Ahat_m| >= 3 x jackknife SE at PS-R1, PS-R3 or PS-R5, with all three null arms within their
    bands at that k and gammahat < 0.95 at that set. THE OUTCOME IS SCOPED TO THAT SET AND THAT ORDER.
    It is NOT a statement about HQC-1/3/5 without HEUR-HQC-1, -2, -3, -5, -6 rendered explicitly, and
    it is NOT a security claim in either direction. In the optimistic direction (log2 Ahat_m > 0) it must
    additionally be netted against the 2.72 / 4.25 / 5.40 bits of built-in conservatism recorded in a17_sensitivity.yaml
    step 9 before ANY statement about the published claim is warranted - and that budget itself carries
    the caveat that SPEC Table 11's observed DFR is an (M)-space simulation.
  interpretation_of_a_null_result:
    interpretable_as: '"At this parameter set, on space (T), with this sampler and this decoder, the average
      m-way joint inner-block failure moment is consistent with A17 to within +- <3 SE> bits." Derived
      widths: +-0.096 bits at PS-R1 (k=16), +-0.024 at PS-R3 (k=17), +-0.078 at PS-R5 (k=30), +-0.028
      at PS-A (k=2) and +-0.32 at PS-A (k=3).'
    NOT_interpretable_as:
    - evidence that A17 holds at HQC-1/3/5 (rarity gap up to 3900x; HEUR-HQC-3)
    - evidence that HQC published DFR is correct (nothing here evaluates it)
    - evidence about deployed HQC (HEUR-HQC-8 is out of scope)
    - evidence about order k = 16 at PS-A (EV-HQC-6fd5b1 O-6 forbids it; PS-A reaches k <= 3)
    uninformative_null_condition: 'A NULL AT A SET WITH gammahat > 0.95 IS UNINFORMATIVE BY CONSTRUCTION,
      NOT EVIDENCE FOR A17: the reduction has destroyed the dependence rather than found it absent. This
      is the single most likely way this design could mislead, it is why p* is held at each level''s own
      published value, and the gammahat guard is NECESSARY, NOT SUFFICIENT.'
