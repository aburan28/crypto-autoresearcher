experiment:
  id: EXP-SSI-10147c
  hypothesis_id: H-SSI-1ed6df
  idea_id: IDEA-20261004-edbd24
  version: 1
  title: >-
    Toy witness-quotient replay for a 5-torsion decryption table
  status: approved
  objective: >-
    Decide H-SSI-1ed6df by enumerating basis presentations of one 3-isogeny
    on E[5] at p = 59, 419, and 659, replaying decryption from the
    normalized action table, and recording that a norm-7 request is outside
    that table.
  inputs:
    primes: [59, 419, 659]
    base_curve: y^2 = x^3 + x
    base_j: 1728
    torsion_n: 5
    isogeny_degree: 3
    fresh_norm: 7
    messages: [0, 1]
  controls:
    - >-
      Round trip first: before any substitution, every message in {0, 1}
      decrypts to itself. A failure invalidates the run.
    - >-
      Positive: replace the secret presentation by the normalized action
      table and decrypt again. Disagreements are the primary count.
    - >-
      Fiber: apply every matrix in GL_2(Z/5Z) and negation, then count
      distinct presentations per normalized table.
    - >-
      Negative: request a connecting ideal of norm 7. The table must leave
      the request unanswered. An answer invented from the table invalidates
      the run.
  independent_variables:
    - prime in {59, 419, 659}
  metrics:
    primary:
      - plaintext_disagreements_after_quotient_substitution
      - normalized_presentation_fiber_size
      - norm7_answered_from_table
    secondary:
      - witness_count_before_normalization
      - witness_count_after_normalization
      - valid_ciphertext_coverage
      - unresolved_reverse_arrows
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      plaintext disagreements, normalized fiber size, and whether the
      norm-7 request is answered
    formula: >-
      Disagreements are 0 on every prime. Fiber size is at least 2 on
      every prime. norm7_answered_from_table is false on every prime.
      unresolved_reverse_arrows is 1.
    source: >-
      H-SSI-1ed6df, specializing IDEA-20261004-edbd24. No distribution
      law is being fit.
  scale_relevance:
    tier: toy
    justification: >-
      GL_2(Z/5Z) and a two-message ciphertext space are small enough to
      enumerate. The result is not claimed at another prime or torsion level.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after the three primes, both messages, and the norm-7 probe.
    - Do not add primes, torsion levels, or degrees.
  invalidation_rules:
    - The round trip fails before quotient substitution.
    - The norm-7 request receives an answer computed from the 5-torsion table.
    - A prime omits any matrix of GL_2(Z/5Z).
    - A reverse arrow is marked proved.
  success_criterion: >-
    The run is valid, every prime has zero plaintext disagreements, every
    prime has normalized fiber size at least 2, and every prime leaves the
    norm-7 request unanswered. The ladder records one missing reverse arrow
    from the torsion table to an End(E) basis.
  falsification_criterion: >-
    The run is valid and some prime has a plaintext disagreement between
    two presentations that share a normalized table.
  required_artifacts:
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/cells.json
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/ladder.json
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/stdout.txt
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/stderr.txt
  assigned_to: executor
  approved_by: coordinator
  approval:
    decision_id: DEC-20261005-d18d0d
    basis: >-
      AGENTS.md standing user authorization of 2026-09-06. This record
      freezes the protocol. It does not launch the executor.
    not_launched_because: >-
      GOAL-SSI-2fa82a next_action still requires the C-star symbolic
      interface. Dispatch of TASK-20261005-536f45 waits for a Coordinator
      decision that releases this experiment.
