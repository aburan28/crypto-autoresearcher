# EXP-DREG-72a5a9
# Lag-1 gates on toy series. No isogeny walk.
# Approved by DEC-20261002-1a2f39.
experiment:
  id: EXP-DREG-72a5a9
  hypothesis_id: H-DREG-6f667e
  source_idea: IDEA-20260922-96289a
  question_id: RQ-DREG-c8ae8d
  version: 1
  title: Lag-1 gates on toy series
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-1a2f39
  objective: >-
    Check the lag-1 ratios of three series and the null thresholds at
    five pair counts.
  inputs:
    level: [3, 2, 1, 0]
    level_ratio_num: 1
    level_ratio_den: 4
    alternating: [1, 0, 1, 0]
    alt_ratio_num: -3
    alt_ratio_den: 4
    constant: [2, 2, 2, 2]
    constant_ratio: undefined
    min_pairs: 8
    seven_pairs_measured: false
    thresh8_num_sq_cross: 999698
    thresh8_den_sq: 1000000
    thresh8_hi_cross: 1002528
    thresh9_num: 2
    thresh9_den: 3
    thresh16_num: 1
    thresh16_den: 2
    thresh25_num: 2
    thresh25_den: 5
    thresh36_num: 1
    thresh36_den: 3
    ell_kept: 5
    order: 12
    ell_dropped: [2, 3]
    gcd_kept: 1
  controls:
    - >-
      A level ratio of 0 is the flat reading. The series 3, 2, 1, 0
      has ratio 1/4. Reporting 0 invalidates the run.
    - >-
      The alternating ratio is -3/4. Reporting it positive, or equal
      to the level ratio, invalidates the run.
    - >-
      The constant series has squared-deviation sum 0. Reporting a
      ratio of 0 or of 1 invalidates the run.
    - >-
      The eight-pair threshold is 1 over sqrt(2). It is strictly above
      707/1000 and strictly below 708/1000. Reporting it as 1/2, which
      is the sixteen-pair value, or as 2/3, which is the nine-pair
      value, invalidates the run.
    - >-
      Seven pairs are unmeasured. Reporting a reading from 7 pairs
      invalidates the run.
    - >-
      Five is coprime to 12. Two and three are not. Reporting five as
      sharing a factor with 12 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - series
    - route in {products, cross}
  metrics:
    primary:
      - level_ratio
      - thresh8_sides
      - constant_undefined
      - implementations_agree
    secondary:
      - alt_ratio
      - seven_unmeasured
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The level ratio 1/4 and the eight-pair threshold sides.
    formula: >-
      Center the series by its mean. The lag-1 ratio is the adjacent
      product sum divided by the squared-deviation sum. A zero
      denominator is undefined. The threshold at k pairs is 2 over
      sqrt(k), for k at least 8. At k = 8 compare 1 over sqrt(2) with
      707/1000 and 708/1000 by squaring. The cross products are
      999698 and 1002528 against one million.
    source: >-
      IDEA-20260922-96289a states the eight-pair gate and the threshold
      2 over the square root of the pair count, read 2026-10-02. The
      ratios were computed in this design session. That computation is
      not a run. No walk was run.
  scale_relevance:
    tier: toy
    justification: Three length-4 series and five pair counts. No transfer to an isogeny graph.
    correspondence: null
  tail_checks:
    - The seven-pair row is required. Stopping at the eight-pair threshold and still reporting 7 pairs as measured is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the level ratio is reported as 0, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The level ratio is reported as 0.
    - The alternating ratio is reported equal to 1/4.
    - The constant series is reported as having a ratio.
    - The eight-pair threshold is reported as 1/2 or as 2/3.
    - Seven pairs are reported as measured.
    - Five is reported as sharing a factor with 12.
    - An isogeny walk or a matrix is reported.
  success_criterion: >-
    Both runs agree that the level ratio is 1/4, the alternating
    ratio is -3/4, the constant series is undefined, the eight-pair
    threshold is strictly above 707/1000 and strictly below 708/1000,
    the later thresholds are 2/3, 1/2, 2/5 and 1/3, seven pairs are
    unmeasured, and gcd(5, 12) is 1 while gcd(2, 12) and gcd(3, 12)
    are not.
  falsification_criterion: >-
    The runs agree, the level ratio stays 1/4, and any threshold
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-DREG-72a5a9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-72a5a9/runs/<RUN-ID>/command.txt
    - experiments/EXP-DREG-72a5a9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-DREG-72a5a9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-DREG-72a5a9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-DREG-72a5a9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any isogeny walk, volcano labeling, or degree-increment measurement.
    - Any claim that a proxy mixes or tracks conductor.
    - A reading issued from fewer than 8 pairs.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
