experiment:
  id: EXP-ALR-42b30c
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6a2bea; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6a2bea
  question_id: RQ-ALR-002
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact fiber-size profile of the truncated weighted moment map at c in 2 and 3 over three
    toy primes, bucketing enumerated candidate configurations by moment prefix length with random-weight
    and random-abscissae null arms
  objective: 'The run reduces one uncertainty: how much the nested projector moment stream discards
    at each truncation length below the 2c sufficiency threshold. (i) It enumerates, exhaustively
    at the small cells, every configuration of c distinct abscissae with c nonzero weights over F_p,
    computes each configuration''s exact moment vector, and buckets configurations by their length-j
    prefix for every j from 1 to 2c plus 2, reporting bucket count, median bucket size and maximum
    bucket size per j. (ii) It runs the identical enumeration and bucketing with uniformly random
    weights and, separately, with uniformly random abscissae, so that any departure of the elliptic
    arm is measured against two matched nulls computed by the same code path in the same invocation.
    (iii) It asserts the two facts the map must satisfy, monotone bucket count in j and collapse to
    singleton buckets at j = 2c, so that a faulty measurement is caught before any curve is interpreted.
    The run recovers no discrete logarithm, emits no candidate factor for any live target, and takes
    no position on whether a constructor could emit fewer moments.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: at the tested primes and support
      sizes, the truncated weighted moment map has the reported fiber-size profile, its bucket structure
      collapses at the reported j, and the elliptic projector-weight arm differs from the two null
      arms by the reported amounts. What does NOT follow: that a constructor emitting fewer than 2c
      moments exists or is cheaper; that the profile holds at operational parameters or at support
      sizes too large to enumerate; that projector weights are informative about any live target;
      or that any attack, speedup or security consequence has been demonstrated. In particular an
      early collapse in a small enumerable cell is a statement about that cell, not a reduction in
      the interface size the ALR lane needs.'
  inputs:
    procedure: 'STAGE 0, setup, minutes: fix p in 11, 13, 17, 101 and c in 2, 3, 4, seed deterministically.
      STAGE 1, configuration enumeration, seconds at the small cells and the binding cost at p = 101:
      generate all sets of c distinct abscissae with c nonzero weights, or sample 10^6 of them with
      abscissae drawn without replacement. STAGE 2, moment computation, seconds: compute exact power
      sums to length 2c plus 2 per configuration. STAGE 3, bucketing, seconds: hash configurations
      by exact tuple prefix for each j and accumulate bucket-size statistics. STAGE 4, assertions,
      instant: check bucket-count monotonicity in j and singleton collapse at j = 2c, abort on failure.
      STAGE 5, null arms, same cost as stages 1 to 4 twice: random weights on identical abscissae,
      then random abscissae with elliptic weights. STAGE 6, calibration, minutes: compare sampled
      statistics against exhaustive statistics at the overlapping cell and report the binomial error.
      STAGE 7, reporting, minutes: emit fiber curves per arm, the slope below c, and both collapse
      indices. Total compute well under one CPU-hour.'
    instrument: 'Python 3 with exact integer arithmetic modulo p, no floating point anywhere, and
      a plain dictionary for exact bucketing keyed on integer tuples rather than on string representations.
      Repository modules: harness/toycurve.py for the toy field and for generating elliptic abscissae
      and the projector-trace weights consistent with H-ALR-002, harness/runner.py for deterministic
      seeding, manifests and immutable run records. Berlekamp-Massey and Hankel rank implemented directly
      over F_p in the experiment. No Sage, no numerical linear algebra, no external service.'
    parameters: 'Primes p in 11, 13, 17, 101. Support sizes c in 2 and 3 exhaustive and c = 4 sampled.
      Prefix lengths j from 1 to 2c plus 2. Exhaustive cells enumerate all c-subsets of nonzero abscissae
      times all nonzero weight vectors, capped at 5 times 10^6 configurations per cell; sampled cells
      draw 10^6 configurations. Three arms: elliptic weights, random weights, random abscissae. Total
      4 primes times 3 support sizes times 3 arms = 36 cells, several capped.'
  controls:
  - Random-weight null arm on identical abscissae, same invocation.
  - Random-abscissae null arm with elliptic weights, same invocation, separating weight structure
    from support structure.
  - 'Exhaustive-versus-sampled calibration: at the smallest cells the sampled estimator must reproduce
    the exact bucket statistics within its stated error.'
  - Collapse assertion at j = 2c, which must hold in every arm and is a check on the implementation
    before any curve is read.
  - 'Monotonicity assertion: bucket count must be non-decreasing in j, since a longer prefix cannot
    merge buckets.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Replace the projector-trace weights by uniformly random nonzero elements
    of F_p on the same abscissae, keeping support size c fixed, and run the IDENTICAL bucketing and
    fiber counting in the same invocation. The null must show the generic collision behaviour: fiber
    sizes decaying like p^(c-j) with collapse at 2c, since a weighted Vandermonde system with random
    weights is generically nondegenerate. The signal arm means something only if the elliptic projector
    weights depart from that curve, either by colliding more, which would indicate the weights carry
    less information than random ones, or less, which would indicate structure. A second null replaces
    the abscissae by random field elements while keeping the elliptic weights, separating weight structure
    from support structure.'
  independent_variables:
  - prefix_length_j
  - support_size_c
  - characteristic_p
  - arm_elliptic_or_random_weight_or_random_abscissae
  metrics:
    primary:
    - bucket_count_per_j
    - median_fiber_size_per_j
    - maximum_fiber_size_per_j
    - smallest_j_with_maximum_fiber_size_one
    - log_fiber_size_slope_against_j
    secondary:
    - weighted_hankel_rank_per_j
    - null_arm_fiber_curve_difference
    - exhaustive_versus_sampled_calibration_error
    - configurations_enumerated_per_cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The median and maximum fiber size of the truncated weighted moment map, as a function
      of prefix length j, for each arm and cell.
    formula: 'Predicted generic law: median fiber size approximately p^(c-j) for j between 1 and c,
      falling to 1 by j = 2c, so that log base p of the median fiber size is predicted to fall with
      slope minus one in j over the range j at most c. Fiber size is defined as the number of enumerated
      configurations sharing an identical length-j moment prefix under exact F_p equality. Predicted
      invariants, asserted rather than predicted: bucket count non-decreasing in j, and maximum fiber
      size equal to 1 at j = 2c in all three arms.'
    source: Pre-registered in the parent proposal IDEA-20260816-6a2bea before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Primes at most 101 and support sizes at most 4, chosen because exhaustive enumeration
      of the configuration space is the whole point and it is feasible only there. These parameters
      are many orders below any cryptographic size and below even the recorded ALR toy curves near
      10^5. The transfer assumption, stated and untested, is that the shape of the fiber curve, geometric
      decay with collapse at 2c, is a property of the weighted Vandermonde structure rather than of
      p; the entry claims no fiber value at any larger parameter.
    correspondence: null
  tail_checks:
  - Report the maximum fiber size alongside the median at every j, because a median of one with a
    large maximum is not a recovery guarantee and is the most likely way an optimistic reading of
    this run would go wrong.
  - Inspect the largest bucket at j = 2c minus 1 by hand in one exhaustive cell, to confirm the colliding
    configurations are genuinely distinct rather than duplicates produced by the enumerator.
  - Check the p = 11 cell for configuration-space degeneracy separately, since at that size collisions
    can be forced by counting alone.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop enumerating a cell at the 5 times 10^6 configuration cap and mark it sampled rather than
    exhaustive; never report a capped cell as exhaustive.
  - Abort the run and report a fault if singleton collapse at j = 2c fails in any arm.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three arms satisfy bucket-count monotonicity and singleton collapse at j
    = 2c, exhaustive and sampled statistics agree within stated binomial error at the calibration
    cell, and a fiber-size curve with median and maximum per j is emitted for every cell and arm.
  falsification_criterion:
  - Singleton collapse fails at j = 2c in any arm.
  - Bucket count decreases with j anywhere.
  - The elliptic arm's fiber curve matches both null arms at every j within the stated tolerance.
  - Sampled and exhaustive statistics disagree beyond binomial error at the calibration cell.
  - The measured slope of log fiber size below c is flat rather than negative, the structural tell
    that information is not accruing with j.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6a2bea
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - How the projector-trace weights are to be generated for the elliptic arm at primes as small as
    11 needs a Coordinator ruling, since H-ALR-002 requires total target degree below the characteristic
    and that constraint binds hard at p = 11.
  - The tolerance for declaring two fiber curves indistinguishable across cells is not fixed here
    and must be set before the run.
  - Whether c may be treated as known to the measurement, given that a constructor would not know
    it, needs an explicit Coordinator scope decision recorded in the contract.
