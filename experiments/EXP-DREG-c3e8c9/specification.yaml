experiment:
  id: EXP-DREG-c3e8c9
  hypothesis_id: H-DREG-c44a0d
  question_id: RQ-DREG-d7b6d6
  derived_from_idea: IDEA-20260922-469f79
  version: 1
  title: >-
    Eliminated graph of the certified degree-2 edge versus the native codomain
    ideal and one random enrichment of the same generator degree
  status: approved
  objective: >-
    Compare last-fall degree and grevlex solving degree of three ideals on the
    single edge certified by EXP-DREG-dd668d: the native codomain ideal, the
    eliminated graph ideal, and one frozen random enrichment of generator
    degree 2. Charge ell = 2. No new factor base. No ECDLP exponent.
  inputs:
    ladder: "experiments/EXP-DREG-dd668d/specification.yaml#frozen_ladder"
    edge_run: experiments/EXP-DREG-dd668d/runs
    prerequisite_rule: >-
      A completed EXP-DREG-dd668d metrics.json that contains a certified edge
      (outcome_label not in {no-certified-edge, instrument, unmeasured,
      degenerate-unit-ideal}). Reuse that edge. Do not choose another.
  controls:
    - id: IDENTITY-ENCODING
      description: >-
        Replace phi by the identity. The eliminated ideal and I_native must
        agree on both named degrees. Disagreement labels encoding-failure and
        stops the comparison.
    - id: RANDOM-ENRICHMENT
      description: >-
        Add to I_native the same number of extra generators as the cleared
        isogeny equations contribute, each of total degree at most 2, with the
        same monomial support, coefficients from random.Random(20260922) in
        F_2, rejected once if they equal the isogeny coefficients, and then
        kept. Not redrawn after degrees are known.
  independent_variables:
    - ideal in {I_native, I_graph, I_random}
  metrics:
    primary:
      - graph_drop minus random_drop for last-fall degree, or unmeasured
      - graph_drop minus random_drop for grevlex solving degree, or unmeasured
      - outcome_label in {agree, presentation, generic-enrichment, more-expensive, encoding-failure, blocked-edge, unmeasured}
    secondary:
      - generator count charged to the graph and to the random arm
      - ell, frozen at 2
  heuristic_under_test: HEUR-c44a0d
  preregistered_prediction:
    quantity: graph_drop minus random_drop
    formula: >-
      0 or negative means the graph does not beat generic enrichment. A
      positive difference of at least 1 on a finished named degree is a
      presentation effect. Agreement of graph and native is drop 0.
    source: H-DREG-c44a0d
  scale_relevance:
    tier: toy
    justification: One edge, rung n=1, D_max 4, ell 2. No transfer.
    correspondence: null
  tail_checks: []
  replication:
    seeds: [20260922]
    independent_instances: 1
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - One edge, the prerequisite edge. One random enrichment.
    - Do not raise D_max above 4.
  invalidation_rules:
    - No certified prerequisite edge. Label blocked-edge.
    - Identity encoding disagrees. Label encoding-failure.
    - An elimination or basis that exceeds D_max is unmeasured for that degree.
    - Do not claim the image of the factor base is a new factor base.
  success_criterion: >-
    The identity encoding agrees, all three ideals finish for at least one
    named degree, and graph_drop minus random_drop is less than or equal to 0
    for every finished named degree. Labels agree, generic-enrichment, and
    more-expensive all satisfy this prediction that the graph does not beat
    the charged enrichment.
  falsification_criterion: >-
    The identity encoding agrees and, for some finished named degree,
    graph_drop minus random_drop is at least 1. Label presentation.
  required_artifacts:
    - experiments/EXP-DREG-c3e8c9/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-c3e8c9/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-c3e8c9/runs/<RUN-ID>/manifest.yaml
  assigned_to: executor
  approved_by: coordinator
  approval_decision: DEC-20260922-250310
  claim_ceiling:
    tier: toy
    forbids:
      - a new factor base
      - a Kummer-line or degree-d-function representation
      - an ECDLP exponent
