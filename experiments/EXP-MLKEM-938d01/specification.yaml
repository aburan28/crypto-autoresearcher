experiment:
  id: EXP-MLKEM-938d01
  hypothesis_id: H-MLKEM-c6bfdd
  derived_from_idea: IDEA-20260821-01623a
  question_id: RQ-MLKEM-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Closed-form blocksize audit of a robust-regression route to ML-KEM under NoMod's own inlier model,
    scored on the p-th-smallest-row-norm quantile at the finite-sample breakdown ceiling, calibrated
    first on the paper's own successful cells and paired with an empirical wrap-rate arm and a
    norm-matched non-lattice null that can void the model outright
  objective: >-
    The one uncertainty a run reduces is the SIGN of one number computed the same way on two arms:
    beta_NoMod minus beta_primal, where beta_NoMod is the smallest BKZ blocksize at which the p-th
    smallest row norm of the omega-penalised embedding's profile meets the erf-inverted ceiling at the
    finite-sample required inlier fraction, and beta_primal is read from the SAME cost model with the
    SAME sample-count optimisation. A run establishes (i) that number over the full
    (p, m/p, quantile-convention) grid at all three ML-KEM parameter sets; (ii) the calibration
    verdict at NoMod's own reported successful cells, which is run FIRST and can declare the
    instrument unfit before the ML-KEM arm is looked at; (iii) whether the published erf inlier model
    describes real reduced bases, measured row by row against exactly-computed wrap counts; (iv)
    whether a norm-matched non-lattice family reproduces the same wrap-free fraction, which the model
    FORCES and whose failure would void every closed-form number; and (v) whether wrap indicators are
    correlated across rows of one reduced basis, which feeds back as an effective m and tightens every
    ceiling. No attack, break, speedup or exponent movement is claimed here or would follow from a
    run. NoMod is not re-run and its reported results are taken at face value.
  what_this_is_not:
    - >-
      Not an attack, a key recovery, a distinguisher, or a break of ML-KEM. It is a scope audit of an
      external method using that method's own published model.
    - >-
      Not a replication or a refutation of NoMod. Nothing here re-runs it and no statement is made
      about whether its reported results are correct; the audit can vindicate the method.
    - >-
      Not a FIPS-parameter measurement. Every FIPS conclusion comes from closed form; the empirical
      arms are at reduced n and speak only to the SHAPE of the wrap-rate-versus-norm relation and of
      the row-norm profile.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
      has been executed under this contract.
  claim_ceiling:
    tier: model_arithmetic_plus_reduced_parameter_measurement
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: "under NoMod's own inlier model, the recalled finite-sample
      regression-equivariant breakdown bound, the declared GSA/Z-shape profile model of the
      omega-penalised embedding, and one frozen root-Hermite cost model, a robust-regression route to
      ML-KEM requires at least X more blocksize units than the primal attack at these parameter sets,
      over the swept grid" -- OR the negation of that at a named grid point. WHAT DOES NOT FOLLOW: no
      statement that no robust or outlier-tolerant method attacks ML-KEM; nothing about estimators
      that are not regression-equivariant; nothing about NoMod's actual implementation, which is not
      run; nothing at values of p or m outside the swept grid; and no absolute blocksize at
      ML-KEM-768 derived from the reduced-parameter measurements.
  inputs:
    procedure: >-
      STAGE 0, CLOSED FORM, NO COMPUTE, THE DECIDER. (0a) Compute sigma per parameter set from FIPS
      203 constants, per block rather than assumed uniform, since ML-KEM-512's key-side secret is
      CBD_3 while its error is CBD_2. (0b) Declare p, the number of unknowns the fit recovers, per
      configuration. (0c) Declare m, the POST-amplification row count, since algebraic amplification
      and reduced-vector saving generate more equations than one reduced basis has rows and those
      extra rows are LONGER. (0d) Compute the finite-sample breakdown ceiling
      eps* = (floor((m-p)/2)+1)/m and set p_req = 1 - eps*, reporting the flat 1/2 ONLY as the
      p/m -> 0 asymptotic corner and labelling it the most generous case; invert the erf to get
      ||v||*(p_req). (0e) Build the GSA/Z-shape row-norm profile of the omega-penalised embedding at
      blocksize beta with the sample count optimised exactly as the primal baseline optimises it, and
      solve for the smallest beta at which the p-th smallest row norm meets ||v||*(p_req); repeat
      under the 2p-th-smallest reading and under an expected-count variant
      sum_i erf(q/(2 sqrt(2) ||v_i|| sigma)) >= p / (1 - eps*). Report beta_NoMod beside beta_primal
      from the same model as a SIGNED DIFFERENCE over the full grid. (0f) CALIBRATION FIRST: run the
      identical arithmetic at NoMod's own attacked settings with the p and m those experiments used.
      IF THE CLOSED FORM SAYS THE PAPER'S OWN SUCCESSFUL CELLS ARE INFEASIBLE, THE MODEL IS WRONG AND
      NOTHING ELSE IS REPORTABLE. STAGE 1, SENSITIVITY OVER BOTH AXES. Sweep p_req over {the
      finite-sample value at the current m/p, 0.7, 0.9} and m/p over {2, 4, 10, 100} jointly, and
      report beta_NoMod as a surface; also report sensitivity to the Tukey tuning constant, which the
      paper does not state. STAGE 2, EMPIRICAL WRAP-RATE ARM at reduced parameters and true q = 3329.
      Build ML-KEM-shaped q-ary lattices with n in {64,128,256}, k in {2,3}, real CBD errors and real
      CBD secrets at declared densities; run LLL and BKZ at a declared blocksize ladder on the
      omega-penalised embedding; RECORD THE FULL ROW-NORM PROFILE and, for every row used, ||v|| and
      the ACTUAL wrap count computed with knowledge of the planted secret. Compare row by row against
      the erf prediction, and compare the measured p-th and 2p-th smallest row norms against the
      GSA/Z-shape prediction used in Stage 0. Report residuals as SIGNED ABSOLUTE DIFFERENCES, not
      ratios. STAGE 3, THE NULL THAT CAN VOID THE MODEL. Generate a norm-matched non-lattice control:
      rows drawn as random directions in R^d scaled to reproduce, row for row, the norm multiset of
      the Stage-2 reduced basis, paired against the SAME planted (s,e). Drawn at least 8 times and
      reported as an interval, never a point. STAGE 4, INDEPENDENCE. Measure the pairwise correlation
      of wrap indicators across rows of the same reduced basis against the independent-Bernoulli
      prediction at the matched per-row rate, report the measured EFFECTIVE inlier count, and re-enter
      it into (0d) as an effective m.
    instrument: >-
      Exact or high-precision rational arithmetic for the ceiling and the blocksize solve, with erfinv
      computed to declared precision. Lattice reduction by a declared LLL/BKZ implementation at a
      declared version, with the planted secret known to the instrument so wrap counts are exact
      rather than estimated. beta_NoMod and beta_primal are read from ONE cost model at ONE version
      with ONE sample-count optimisation. Every reported number is labelled MEASURED (instrumented
      run with manifest) or MODELED (cost formula, with the formula and its source named); the two
      never mix in one column. Recorded through harness/runner.py.
    parameters: >-
      Closed-form arm at ML-KEM-512/768/1024 with FIPS 203 constants re-read and certified in-harness.
      Grid: p declared per configuration including full-secret p = 768 at ML-KEM-768; m/p in
      {2, 4, 10, 100}; p_req in {finite-sample value, 0.7, 0.9}; quantile convention in {p-th, 2p-th,
      expected-count}. Calibration cells (n,k) = (256,2) at max Hamming weight 6 and (128,3) at max
      Hamming weight 3, with the p and m those experiments used. Empirical arm at q = 3329,
      n in {64,128,256}, k in {2,3}, omega = 4 for CBD errors and 10 for Gaussian sigma 3, a declared
      blocksize ladder, at least four interior Hamming-weight dose points between the paper's 3-6 and
      full CBD density, and at least 8 draws of the norm-matched non-lattice comparator.
  controls:
    - >-
      NULL-A, CALIBRATION ON THE PAPER'S OWN SUCCESSFUL CELLS, RUN FIRST AND BLOCKING: the closed form
      evaluated at (256,2) weight 6 and (128,3) weight 3 with the corrected condition must return
      FEASIBLE, i.e. consistent with the paper's reported progressive BKZ schedule capped at 40. IF IT
      DOES NOT, THE MODEL IS FALSIFIED AND NO ML-KEM NUMBER FROM IT IS REPORTABLE. This control has
      MORE power to fail under the corrected, tighter ceiling than under a looser one, which is why it
      runs first.
    - >-
      ASYMPTOTIC-CORNER FIXTURE: in the p/m -> 0 limit the evaluator must reproduce
      ||v||* = 0.7412 q / sigma, separating a transcription error in the finite-sample expression from
      a genuine finite-sample effect.
    - >-
      NULL-B, NORM-MATCHED NON-LATTICE ARM: rows with the same norm multiset as the reduced basis but
      random directions and no lattice membership, against the same planted secret. The erf model
      reads the row ONLY through its norm, so EQUAL wrap-free fractions are FORCED under the model.
      The control fails informatively if they differ, which would mean reduction correlates rows with
      the secret and the model is incomplete. At least 8 draws; the interval is reported, never a
      single draw.
    - >-
      NULL-C, DENSITY DOSE AXIS: the same measurement at a graded sequence of secret Hamming weights
      from the paper's 3-6 up to full CBD density, at least four interior points, at a FIXED ||v||
      ladder, with MONOTONICITY of the wrap-free fraction in density explicitly reported. Two endpoints
      do not give a direction; if the fraction is not monotone, the directional reading that density is
      what kills it must be withdrawn.
    - >-
      QUANTILE-CONVENTION CONTROL: the verdict is reported at the p-th and 2p-th smallest row norms
      and under the expected-count variant, so it is not an artefact of one convention.
    - >-
      MATCHED-ACCOUNTING CONTROL: identical cost model, version and sample-count optimisation for
      beta_NoMod and beta_primal. An unmatched comparison is not a difference.
    - >-
      PROFILE-MODEL CONTROL: the measured p-th and 2p-th smallest row norms compared against the
      GSA/Z-shape prediction that Stage 0's condition is imposed on. A failure here voids beta_NoMod
      exactly as an erf failure would, and it has no analogue in a lambda_1 formulation.
    - >-
      MEASURED-VERSUS-MODELED SEPARATION: every table column is labelled measured or modeled, with the
      formula and source named for modeled columns; the two never mix in one column.
  independent_variables:
    - ML-KEM parameter set, one of 512, 768, 1024
    - number of unknowns p, declared per configuration
    - rows per unknown m/p, one of 2, 4, 10, 100
    - required inlier fraction p_req, one of the finite-sample value, 0.7, 0.9
    - quantile convention, one of p-th smallest, 2p-th smallest, expected-count
    - secret Hamming weight, over at least four interior dose points plus the endpoints
    - arm, one of lattice or norm-matched non-lattice
    - reduced-parameter (n, k) and BKZ blocksize on the declared ladder
  metrics:
    primary:
      - >-
        beta_NoMod_minus_beta_primal, units BKZ blocksize units (integer), MODELED, computed as the
        smallest beta meeting the quantile condition minus the primal blocksize from the identical
        cost model and sample-count optimisation, reported per parameter set, per grid point, per
        quantile convention, as a SIGNED difference
      - >-
        calibration_verdict_at_papers_cells, units a signed blocksize difference plus a
        feasible/infeasible flag, MODELED, computed by the identical arithmetic at (256,2) weight 6
        and (128,3) weight 3 with the p and m those experiments used. Must be at most 0 (feasible).
      - >-
        wrap_free_fraction_minus_erf_prediction, units absolute fraction (signed), MEASURED, computed
        per reduced row as (measured non-wrapping indicator averaged over trials) minus
        erf(q/(2 sqrt(2) ||v|| sigma)), pooled over the blocksize ladder
      - >-
        measured_over_predicted_pth_row_norm, units dimensionless ratio, MEASURED against MODELED,
        computed per blocksize as the measured p-th smallest row norm divided by the GSA/Z-shape
        prediction
    secondary:
      - >-
        sigma per parameter set and the FIPS constants used, units dimensionless, MODELED, reported
        with the per-block mixture for ML-KEM-512
      - >-
        eps* and p_req from the finite-sample bound beside the p/m -> 0 asymptotic value, units
        fractions, MODELED
      - >-
        ||v||*(p_req) at each grid point, units the embedding's norm units, MODELED
      - >-
        lattice_minus_normmatched_wrap_free_fraction, units absolute fraction, MEASURED, with the
        8-draw comparator interval
      - >-
        mean_pairwise_wrap_indicator_correlation and the implied effective m, units dimensionless and
        row count, MEASURED, with the p_req it forces
      - >-
        wrap_free_fraction_versus_hamming_weight at a fixed ||v|| ladder, units absolute fraction,
        MEASURED, with an explicit monotonicity flag over at least four interior points
      - >-
        Tukey tuning-constant sensitivity of beta_NoMod, units blocksize units, MODELED, reported as a
        range because the paper does not state the constant
      - >-
        wall_seconds and peak_rss_gb per stage; peak memory of the BKZ arm reported as a first-class
        metric alongside time
  heuristic_under_test:
    id: HEUR-NOMOD-1
    formal_statement: >-
      ERF INLIER MODEL. For a reduced row v of the omega-penalised embedding paired against a planted
      CBD (s,e) with joint coordinate standard deviation sigma, the probability that the resulting
      equation does not wrap the modulus is exactly erf(q / (2 sqrt(2) ||v|| sigma)), depending on the
      row ONLY through its norm; and wrap events are independent across rows.
    companion_heuristic:
      id: HEUR-NOMOD-2
      formal_statement: >-
        FINITE-SAMPLE BREAKDOWN CEILING. For a regression-equivariant estimator fitting p unknowns
        from m observations the finite-sample breakdown point is at most (floor((m-p)/2)+1)/m, hence
        p_req = 1 - that quantity. RECALLED and load-bearing; a primary-source check is a proof
        obligation and the (p_req, m/p) surface is the hedge.
    scale_access_and_transfer: >-
      The closed-form arm reaches FIPS parameters directly because it is arithmetic on published
      constants; it reaches nothing empirically. The empirical arms reach only n in {64,128,256} at
      true q = 3329. TRANSFER ASSUMPTION, STATED AND BOUNDED: reduced parameters are informative about
      the SHAPE of the wrap-rate-versus-norm relation and of the row-norm profile, and are NOT
      informative about the absolute blocksize at ML-KEM-768. The two must never be conflated in
      reporting, and a run that derives a FIPS blocksize from a measurement is invalid.
  preregistered_prediction:
    quantity: >-
      beta_NoMod minus beta_primal at ML-KEM-768, at p = 768 and m = 2p, on the p-th-smallest-row-norm
      condition at the finite-sample p_req, under one identical cost model.
    formula: >-
      Predicted, before any run: the signed difference is at least +50 blocksize units (branch E1).
      The ceiling arithmetic to be recomputed in-harness and possibly overturned: ||v||* = 1447 at
      m = 2p, 1876 at m = 4p, 2203 at m = 10p, 2467 in the p/m -> 0 corner, at q = 3329 and sigma = 1;
      the finite-sample ceiling at m = 2p is a factor 1.705 SHORTER than the asymptotic one. Predicted
      calibration verdict at the paper's own cells: at most 0, i.e. FEASIBLE. Predicted wrap-free
      residual against erf: within 0.05 absolute. Predicted lattice-minus-norm-matched contrast: ZERO,
      which is FORCED under the model. Under the alternative (branch E2) the signed difference is at
      most 0 somewhere on the corrected grid.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-01623a, which states the +50 minimum effect
      against the CORRECTED quantity alone and explicitly carries forward NO number from the earlier
      lambda_1 formulation. The erf model is quoted verbatim from arXiv 2510.02162 as fetched and read
      by the proposing session. Never tuned to data; a run that reports a different quantity reports a
      different experiment.
  scale_relevance:
    tier: mixed
    justification: >-
      The closed-form arm is evaluated AT FIPS 203 parameters, which is the point: it is arithmetic on
      published constants and needs no scale access. The empirical arms are at n in {64,128,256} with
      true q = 3329, chosen so that the planted secret is known and wrap counts are exact, which is
      what makes them measurements rather than inferences. The design's discipline is that these two
      tiers never mix: every FIPS number is MODELED and every reduced-parameter number is MEASURED,
      and the labels are carried into every table column.
    correspondence: >-
      There is no correspondence permitting empirical validation at FIPS scale here, and none is
      claimed. The empirical arms validate the MODEL's ingredients (the erf relation and the profile),
      not its FIPS output.
  tail_checks:
    - >-
      Report the wrap-free residual per row, not only pooled, and report the rows in the extreme
      quantiles of ||v|| separately, since the model is most likely to fail where the norm is largest.
    - >-
      Report the smallest realized row norm and the number of rows below ||v||*(p_req) at each
      blocksize, since the condition is a COUNT and a pooled fraction can hide a count shortfall.
    - >-
      Report the norm-matched comparator's full 8-draw spread, not only its mean, since the forced
      contrast is zero and the comparator's own spread is the yardstick.
    - >-
      Report the correlation arm's most correlated row pairs and the implied effective m at that
      extreme, since an effective m below p makes the fit impossible regardless of any norm.
    - >-
      Report the density-dose curve at all interior points including any non-monotone segment, since
      non-monotonicity withdraws a directional reading rather than being smoothed away.
  replication:
    seeds:
      - 20260821
      - 20260822
      - 20260823
    independent_instances: 3
  budget:
    wall_clock_seconds: 14400
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 12.0
    memory_gb: 16
    maximum_memory_gb: 16
    maximum_runs: 30
  stopping_rules:
    - >-
      Run the calibration control (NULL-A) and the asymptotic-corner fixture FIRST. If either fails,
      STOP and report the model's failure; do not compute or read any ML-KEM number.
    - >-
      Stage 0 plus NULL-A alone is the declared MINIMAL TEST and costs seconds on a single core. The
      empirical Stages 2-4 are the follow-on and may be authorized separately.
    - >-
      Abort a BKZ cell that exceeds its per-cell wall clock and report it as an infrastructure stop,
      never as a measurement of the profile.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. A budget exhaustion is a stop,
      never a negative result (AGENTS.md rule 5).
    - >-
      The grid, the quantile conventions, the residual thresholds (0.05, 0.03, 10 percent) and the
      +50 minimum effect are frozen before any run and are not revised afterwards.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
      and is NEVER negative mathematical evidence (AGENTS.md rule 5).
    - >-
      A run whose norm-matched non-lattice arm is missing, or whose control arm was not executed in
      the same invocation as the signal arm, is invalid_measurement.
    - >-
      A run in which beta_NoMod and beta_primal were computed under DIFFERENT cost models, versions or
      sample-count optimisations is invalid_measurement: the reported signed difference is not a
      difference.
    - >-
      A run that derives any FIPS-parameter blocksize from reduced-parameter measurement is
      invalid_measurement and its conclusion is void, regardless of its arithmetic.
    - >-
      A run reporting the norm-matched comparator as a single draw rather than an interval over at
      least 8 draws is invalid_measurement.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires a
      new contract; it is never a repair of this one.
  success_criterion: >-
    The run succeeds as a MEASUREMENT when all of the following hold and are reported: the
    asymptotic-corner fixture reproduces 0.7412 q / sigma; the calibration control returns FEASIBLE at
    both of the paper's own successful cells; beta_NoMod, beta_primal and their signed difference are
    reported for all three ML-KEM parameter sets at every grid point and under all three quantile
    conventions, each labelled MODELED; and, for the empirical stages, the per-row wrap-free residual
    against erf, the measured-over-predicted p-th row norm, the lattice-versus-norm-matched contrast
    with its 8-draw interval, the wrap-indicator correlation with its implied effective m, and the
    density-dose curve with its monotonicity flag are reported, each labelled MEASURED. Each is
    decidable from the primary metrics above. A run that reports an ML-KEM number without a passing
    calibration control does NOT meet this criterion.
  falsification_criterion:
    - >-
      beta_NoMod minus beta_primal is at or below zero at any ML-KEM parameter set at any grid point
      ON THE CORRECTED STATISTIC. THE HYPOTHESIS IS FALSIFIED (branch E2) and the result must be
      escalated to independent review rather than reported as a headline. An E2 read off a lambda_1
      condition or off the flat 1/2 does NOT trigger this.
    - >-
      The calibration control returns INFEASIBLE for the paper's own successful cells. The closed-form
      model is falsified, every ML-KEM number from it is void, and the deliverable is the model's
      failure. This is the likeliest way the design dies.
    - >-
      The asymptotic-corner fixture fails. The finite-sample expression is mis-transcribed and every
      ceiling is void.
    - >-
      The measured p-th smallest row norm departs from the GSA/Z-shape prediction by more than 10
      percent. The profile model is wrong and beta_NoMod must be recomputed from the empirical profile.
    - >-
      The measured wrap-free fraction departs from the erf prediction by more than 0.05 in absolute
      value. HEUR-NOMOD-1 is falsified; the published inlier model does not describe real reduced
      bases.
    - >-
      The lattice and norm-matched non-lattice arms differ by more than 0.03 against the 8-draw
      interval. Reduction correlates rows with the secret in a way the model omits.
    - >-
      The wrap-free fraction is not monotone in secret density across the four interior points. The
      directional reading is withdrawn.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference
      block, environment, the cost-model name and version, and the sample-count optimisation used for
      BOTH beta_NoMod and beta_primal
    - >-
      raw-result.json carrying every per-row, per-blocksize, per-draw, per-grid-point measurement, not
      summaries, including the full row-norm profile of every reduced basis used
    - >-
      the calibration control's output at both of the paper's cells and the asymptotic-corner
      fixture's output, in the same file as the ML-KEM arm
    - >-
      the norm-matched non-lattice arm's 8 draws and the correlation arm's per-pair values
    - >-
      a cost table with every column labelled MEASURED or MODELED, the formula and source named for
      each modeled column, and every optimistic assumption listed with the DIRECTION of its bias
    - >-
      the pre-registration text with the frozen grid and thresholds, written before the first run and
      hashed
    - >-
      certificate kind none; no solve, relation or distinguisher is claimed
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator authorship does not confer approval. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false (AGENTS.md rule 1). Approval is
      the user's gate because it authorizes execution and spends compute.
    - >-
      The RECALLED finite-sample breakdown bound is load-bearing and unread by this program. A
      primary-source check is a proof obligation of H-MLKEM-c6bfdd and should be scheduled with, or
      before, this contract; every ||v||* quoted before it is an unverified recall.
    - >-
      The parent proposal carries a proof_search_map; it must be audited against KN-TECH-080 before
      the expensive empirical stages are authorized. Stage 0 plus the calibration control is the cheap
      part and can be approved independently of Stages 2-4.
    - >-
      An E2 outcome triggers mandatory escalation to an independent review-adversarial session before
      any statement is recorded. That routing must be fixed in the handoff, not decided after the
      result.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-01623a
    authored_at: '2026-08-25'
    note: >-
      Every metric, threshold, control and falsification condition is transcribed from the parent
      proposal's predictions, null_object_control, mechanism (Stages 0-4), minimal_test and
      falsification_conditions blocks. The proposal's own repair pass (row-norm quantile in place of
      lambda_1; finite-sample Donoho-Huber in place of the flat asymptotic 1/2) is carried through
      exactly, including its statement that the corrected statistic moves beta_NoMod UP and therefore
      makes the record's own headline harder to reach. The measured-versus-modeled column labelling
      and the optimistic-assumption disclosure requirement are imposed here by the cost-model
      experiment pattern of the design-experiment skill. Budgets come from the parent's declared
      estimated_cost of implementation low and compute low for Stage 0, widened for the BKZ stages the
      proposal prices at hours to a day of single-core work at n at most 256.
  derivation_gaps:
    - >-
      The finite-sample breakdown bound is RECALLED and unread. Whether it binds for an M-estimator
      with a redescending loss at a fixed tuning constant in high dimension is unsettled, and the
      whole ceiling is conditional on it. This is the largest gap and it is a proof obligation, not a
      caveat.
    - >-
      The Tukey tuning constant is not stated in NoMod's paper. The realistic operating point is
      therefore unknown, and the sensitivity range must be declared before approval so a verdict
      cannot be selected from it afterwards.
    - >-
      The exact GSA/Z-shape profile model and the root-Hermite cost model are not pinned by name and
      version in the parent proposal. They must be pinned before approval, because the two disagree
      more in the LOW quantiles than at lambda_1 and beta_NoMod is read off a quantile while
      beta_primal is read off a different condition. The proposal itself asks for the verdict under at
      least two published profile models; that requirement must be made explicit in the frozen
      contract.
    - >-
      m as the POST-amplification row count depends on NoMod's algebraic amplification and
      reduced-vector saving, whose exact expansion factor is not extracted. The grid over m/p is the
      hedge, but the realistic m at ML-KEM-768 is unknown and must not be presented as known.
    - >-
      The blocksize ladder for the empirical arm is unspecified. It must be declared before approval,
      since the profile-model comparison is per blocksize and a ladder chosen after seeing residuals
      would not be a test.
