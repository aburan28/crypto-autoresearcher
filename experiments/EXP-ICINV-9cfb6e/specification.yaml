experiment:
  id: EXP-ICINV-9cfb6e
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-427cf3
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE FINEST ALGEBRAIC FUNCTIONAL IN THE LANE, AND A DERIVATION THAT FORCES IT: the Macaulay
    rank profile and Hilbert function of the Semaev decomposition ideal are determined by the factor-base
    size alone, because the relation locus is a SMOOTH (2,2) curve for every non-2-torsion target
    and its intersection with the factor-base grid is transverse EXCEPT at factor-base elements v
    with f(v) = 0 -- so the only route by which an algebraic-solver cost can vary within a class is
    the rational 2-torsion, and that route is quantified here rather than searched for'
  status: draft
  objective: "(A) THE FUNCTIONAL, AND WHY IT IS FINER THAN SOLVING DEGREE. Fix E/F_p, a target R,\
    \ a factor base V of size B, and the ideal\n    I(E, V, R) = < S_3(x1, x2, x(R)), f_V(x1), f_V(x2)\
    \ >\nwhere f_V(x) = prod_{v in V} (x - v). The MACAULAY RANK PROFILE is the function D |-> rank\
    \ M_D, where M_D is the Macaulay matrix in degree D built from the generators times all monomials\
    \ of complementary degree; equivalently the Hilbert function of the quotient. Solving degree and\
    \ first-fall degree are single numbers read off this profile; the profile itself is strictly more\
    \ information and is what a rank-based or XL-style solver actually pays for (KN-TECH-004, KN-TECH-011,\
    \ KN-TECH-053).\n(B) WHY IT COULD DEPEND ON THE EQUATION AND NOT ONLY ON (p, N, t). For a GENERIC\
    \ system, the Hilbert function is determined by the degrees alone. The Semaev system is emphatically\
    \ not generic: S_3's coefficients are polynomials in (a, b), the system is over-determined (three\
    \ generators in two variables), and the Hilbert function of an over-determined system JUMPS on\
    \ proper closed subschemes of coefficient space -- exactly where the intersection acquires multiplicity\
    \ or the ideal fails to be radical. Since (p, N, t) do not determine (a, b), and an isogeny class\
    \ is a finite set of j-invariants (the roots of a Hilbert class polynomial mod p), the question\
    \ \"does the class meet the degeneracy locus\" is a genuine question with no a priori answer.\
    \ That is the whole reason the functional belongs in L1.\n(C) THE DERIVATION, WHICH ANSWERS IT.\
    \ Two facts compose.\n  (C1) SMOOTHNESS. For R in E(F_p) with 2R != O and R != O, the affine curve\n\
    \    C_R : S_3(x1, x2, x(R)) = 0 is F_p-ISOMORPHIC TO E via\n    P |-> (x(P), x(R - P)) -- see\
    \ IDEA-20260807-0ff796 (B) for the\n    injectivity argument and the arithmetic-genus computation.\
    \ In\n    particular C_R is SMOOTH and geometrically irreducible for EVERY\n    non-singular E\
    \ and every such R. There is no curve in any class where\n    C_R degenerates. So the first and\
    \ most obvious source of a Hilbert-\n    function jump -- a singular or reducible relation locus\
    \ -- DOES NOT\n    EXIST.\n  (C2) TRANSVERSALITY. The remaining source is tangency of C_R to the\
    \ grid\n    V x V. C_R meets the vertical line x1 = v non-transversally iff the\n    quadratic\
    \ x2 |-> S_3(v, x2, x(R)) has a double root, i.e. iff its\n    discriminant vanishes. S_3 is symmetric\
    \ in its three variables and the\n    classical identity disc_{x3} S_3 = 16 f(x1) f(x2) therefore\
    \ gives\n    disc_{x2} S_3(v, ., x(R)) = 16 f(v) f(x(R)). Since R is a rational\n    non-2-torsion\
    \ point, f(x(R)) is a non-zero square. HENCE THE\n    INTERSECTION IS NON-TRANSVERSE AT x1 = v\
    \ IF AND ONLY IF f(v) = 0, i.e.\n    iff v is the x-coordinate of a rational 2-torsion point.\n\
    \  CONCLUSION: I(E, V, R) is a radical, transverse, complete intersection\n  whenever V contains\
    \ no 2-torsion x-coordinate, and in that case its\n  Hilbert function is a function of B and the\
    \ degrees ALONE -- hence a class\n  invariant, hence closed for this functional.\n  NAMED OBSTRUCTION\
    \ (O-TRANSVERSE): the relation locus is smooth on every\n  curve in every class, and its only\
    \ possible tangency to the factor-base\n  grid sits at the rational 2-torsion, whose size is at\
    \ most 3 out of p.\n\n(D) THE EXACT SIZE OF THE SURVIVING ROUTE, COMPUTED BEFORE MEASUREMENT.\
    \ Let r = #{x : f(x) = 0} in {0, 1, 3}. For a uniformly random factor base of size B, the expected\
    \ number of non-transverse columns is rB/p <= 3B/p, which is BELOW 1 for every (B, p) in the toy\
    \ range and for every cryptographic range with B = p^{o(1)}. So the only class-varying route to\
    \ a Hilbert-function difference has expected multiplicity below one element. It can be forced\
    \ to fire only by DELIBERATELY loading the factor base with 2-torsion x-coordinates -- which costs\
    \ factor-base diversity and is charged. THE CONSEQUENCE FOR THE LANE: the algebraic-solver cost\
    \ family is class-invariant except through a channel of expected size 3B/p, and that number, not\
    \ a hand-wave, is the closure.\n(E) THE THREE OUTCOMES, ALL DELIVERABLES.\n  OUTCOME F (forced):\
    \ the measured rank profile is identical across every\n    member of a class at a common factor\
    \ base containing no 2-torsion\n    x-coordinate. The derivation is confirmed and the finest algebraic\n\
    \    functional in the lane is closed.\n  OUTCOME T (tangency-explained): profiles differ, and\
    \ every difference is\n    traced to a factor base containing a 2-torsion x-coordinate. The\n\
    \    derivation is confirmed AND the surviving channel is exhibited, which\n    supplies IDEA-20260807-0a3272\
    \ with its mechanism (C2) rather than\n    leaving it hypothetical.\n  OUTCOME U (unexplained):\
    \ profiles differ with no 2-torsion element\n    present. Then (C1) or (C2) is wrong, or a degeneracy\
    \ exists that neither\n    covers -- a fourth escape hatch in the sense of IDEA-20260807-dc14b4,\n\
    \    and the most valuable outcome available to this record."
  resource_label: 'R1 (x-coordinates as field elements: the Macaulay matrix is built over F_p from
    coordinate data) + R2 (the curve equation, which supplies S_3''s coefficients and hence the matrix
    entries) + R5 in the surviving channel only (the rational 2-torsion, which is torsion at ell =
    2 != N).'
  admissibility: admissible
  admissibility_argument: 'The Macaulay matrix is built from polynomial coefficients over F_p. No
    generic-group algorithm can construct it: it has no access to a, b, or to x-coordinates as field
    elements, only to opaque group handles. This is the R1/R2 line of DECOMPOSITION.md section 2 and
    it is disjoint from the oracle classes KN-FIND-b7e091 closes, both of which return group elements.
    H-ENDO-001 is untouched: no endomorphism is applied to any point of G, and the 2-torsion enters
    as a property of the CUBIC, not as a group element supplied to an algorithm working in G.'
  reachability_gate: 'UNDER OUTCOME F, T5 IS MOOT: a constant functional has no minimiser. UNDER OUTCOME
    T the minimiser is a class member with a particular r, and the gate is PASSED exactly as in IDEA-20260807-0a3272
    -- r is computable in O(log^2 p) by factoring a cubic at any vertex, so goodness is locally detectable
    and hill-climbing along the 2-volcano costs polylog(p), against a 0.886 sqrt(N) baseline. BUT
    the prize is bounded by the derived channel size: the profile difference exists only when the
    factor base contains a 2-torsion x-coordinate, which happens with probability rB/p < 1 by accident
    and must otherwise be forced by loading, at the cost of shrinking the usable factor base by up
    to 3 elements. So the reachable prize is at most a bounded, computable change in one integer sequence
    -- reachable and negligible, and the record states both halves. UNDER OUTCOME U the reachability
    question is reopened along with everything else.'
  inputs:
    procedure: 'STAGE 0 (minutes, HARD GATE): re-derive the discriminant identity and the symmetry;
      confirm the leading-coefficient edge case; import or re-derive (C1). Failure here removes the
      record''s entire derivation at a cost of minutes, which is the point of putting it first. STAGE
      1 (minutes, HARD GATE): the B = 1, 2 hand-checkable baseline and the cross-check against src/ic_first_fall_fast.py
      on an identical instance. STAGE 2 (minutes, BLOCKING): the E[2] nearby-object control, which
      must DIFFER, run before any agreement is interpreted. STAGE 3 (hours): the class sweep at a
      clean common factor base -- exact sequence comparison across all members. STAGE 4 (hours): the
      loaded arm, the two gauge arms, and the matched-shape null. STAGE 5 (zero compute): record OUTCOME
      F, T or U, and state the conclusion in the transverse-intersection terms the observation collision
      forces. Stages 0-2 cost under an hour and can kill the record or invalidate the instrument before
      the expensive sweep.'
    mechanism: 'STEP 1 -- SYMBOLIC PREREQUISITES, ZERO COMPUTE, HARD GATE. (i) Re-derive disc_{x3}
      S_3 = 16 f(x1) f(x2) in sympy and confirm the symmetry of S_3 that licenses the substitution
      used in (C2). (ii) Confirm that S_3(v, ., x(R)) is a genuine quadratic in x2 for v not equal
      to x(R), i.e. that its leading coefficient (x(R) - v)^2 is non-zero -- the record''s one unstated
      edge case, and it is stated here: v = x(R) makes the leading coefficient vanish and must be
      excluded from V or handled separately. (iii) Re-derive the arithmetic-genus and injectivity
      facts of (C1) or import them from IDEA-20260807-0ff796''s Stage 1 with an explicit dependency.

      STEP 2 -- BUILD THE MACAULAY PROFILE. For a declared monomial order (grevlex, matching harness/semaev.py)
      and degree bound D_max, construct M_D for D = 1..D_max over F_p and compute ranks by Gaussian
      elimination modulo p. Report the full profile, not only the threshold at which the ideal becomes
      trivial. This is the same machinery IDEA-20260806-e4f96e needs and the two records should share
      one implementation, with the shared code path named in both.

      STEP 3 -- THE CLASS SWEEP AT A CLEAN FACTOR BASE. For every member of a complete toy class,
      at a COMMON factor base V containing no 2-torsion x-coordinate and not containing x(R), and
      at a transported target with a verified certificate, compute the profile. PREDICTION FROM (C):
      the profiles are IDENTICAL, element for element, across the entire class. This is an exact integer-sequence
      comparison, with no statistical threshold, and it is the record''s decisive test.

      STEP 4 -- THE LOADED ARM, WHICH EXHIBITS THE SURVIVING CHANNEL. Repeat with V deliberately containing
      all r rational 2-torsion x-coordinates of the member (so the arm is only defined on members
      with r >= 1). PREDICTION: the profile now DIFFERS between r = 1 and r = 3 members, by an amount
      that reflects the extra multiplicity. Measuring the exact difference converts the derivation
      into a quantified channel.

      STEP 5 -- THE GAUGE CONTROL IN BOTH FORMS, WHICH SEPARATES ALGEBRA FROM MEMBERSHIP. (5a) TRANSPORTED
      FACTOR BASE: apply the gauge dilation to V as well as to the curve. The profile must be EXACTLY
      unchanged, because the substitution is linear and invertible. This is a forced value and observing
      it is an instrument check. (5b) FIXED WINDOW: keep V = [0, W) fixed while the curve is gauged.
      The profile may change, entirely through membership. Reporting both is what prevents a membership
      effect being read as an algebraic one.

      STEP 6 -- THE NEARBY-OBJECT CONTROL. Run the pipeline with R in E[2]. There (C1) fails, C_R
      degenerates, and the profile MUST differ. If it does not, the profile is not reading the geometry
      and no conclusion may be drawn from Step 3''s agreement.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - gauge with transported factor base (forced value, exactly invariant)
  - gauge with fixed window (admissible spread reference, >= 8 draws)
  - R in E[2] (nearby object; MUST differ) -- BLOCKING
  - random (2,2) form of matched support (shape baseline)
  - cross-check against the existing in-tree first-fall implementation
  - transport certificates on every target
  - "NULL OBJECT (from the proposal): MANDATORY, FOUR ARMS, AND TWO OF THEM ARE FORCED VALUES DERIVED\
    \ BEFORE THE RUN. (1) FORCED-VALUE CONTROL (gauge with transported factor base): the profile\n\
    \  must be EXACTLY unchanged, because the substitution is an invertible\n  linear change of variables.\
    \ Its spread is ZERO by algebra, so it is a\n  MODE-1 null for the profile and is used ONLY as\
    \ an instrument check, never\n  as a spread reference. Stated in advance per KN-TECH-1a5b7e.\n\
    (2) ADMISSIBLE NULL (gauge with a fixed coordinate window): spread is\n  non-zero and arises purely\
    \ through factor-base membership. This is the\n  correct spread reference for the fixed-window\
    \ arm, drawn >= 8 times and\n  reported as an interval.\n(3) NEARBY-OBJECT CONTROL: R in E[2],\
    \ where the profile MUST differ. An\n  instrument that cannot distinguish a degenerate relation\
    \ locus from a\n  smooth one is measuring the shape of the Macaulay construction and not\n  the\
    \ curve.\n(4) MATCHED-SHAPE NULL: a random (2,2) form with the same support and random\n  coefficients,\
    \ intersected with the same grid. Its profile is the SHAPE\n  baseline; if it agrees with S_3's\
    \ profile, the profile reads the shape and\n  no Semaev-specific statement may be made from it.\n\
    DECAY PARAMETER: B. Under (D), any 2-torsion-borne difference must appear with probability rB/p\
    \ at a random factor base, i.e. it must become MORE frequent as B grows while the per-instance\
    \ effect stays bounded. A profile difference whose FREQUENCY does not track rB/p, or whose SIZE\
    \ grows with B, is not the derived channel and is the artifact tell."
  independent_variables: []
  metrics:
    primary:
    - full rank profile per (curve, factor-base type, target), as an integer sequence
    - Macaulay matrix dimensions and peak memory per degree
    - r per class member and the 2-torsion content of each factor base
    - the exact profile difference on the loaded arm, per r
    secondary:
    - pass/fail of every gate control, reported before any class comparison
    - the monomial order and Macaulay construction, printed with every profile
  heuristic_under_test: null
  preregistered_prediction:
    quantity: the rank profile D |-> rank M_D, compared element-for-element across every member of
      a complete toy class at a common 2-torsion-free factor base and transported target
    formula: EXACT SEQUENCE EQUALITY across the entire class. This is an integer comparison with no
      tolerance. A single differing entry, with the E[2] and x(R) edge cases excluded, is OUTCOME
      U and refutes the derivation.
    source: pre-registered in IDEA-20260807-427cf3 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - PRESENTATION DEPENDENCE. The profile depends on the monomial order and on how the Macaulay matrix
    is built. Two records comparing profiles built differently are comparing nothing. The construction
    is frozen and printed.
  - FIELD EQUATIONS. Whether x^p - x is included as a generator changes the profile materially. The
    convention is frozen before Stage 3 and reported with every number, exactly as IDEA-20260806-e4f96e
    requires for the same matrix.
  - FACTOR-BASE CONTENT. A factor base that accidentally contains a 2-torsion x-coordinate or x(R)
    will produce a difference that looks like a class effect. Every factor base's 2-torsion content
    is computed and recorded before use, not after a surprising result.
  - SMALL B. At B < 5 the profile is short and many curves will agree trivially. B must be swept and
    the shortest profiles reported separately.
  - 'GAUGE CONFLATION. The two gauge arms answer different questions and must never be pooled: (5a)
    tests the algebra, (5b) tests membership.'
  - IMPORTED DEPENDENCY. (C1) is imported from IDEA-20260807-0ff796. If that record is superseded,
    this one inherits the change and must be re-checked; the dependency is declared so the inheritance
    is visible.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACT SEQUENCE EQUALITY across the entire class. This is an integer comparison
    with no tolerance. A single differing entry, with the E[2] and x(R) edge cases excluded, is OUTCOME
    U and refutes the derivation.
  falsification_criterion:
  - 'The discriminant identity fails to re-derive. (C2) collapses; the transversality criterion is
    unknown and the functional reverts to an open empirical question. Cost of discovering this: minutes.'
  - Profiles differ across a class at a clean factor base (OUTCOME U). Either (C1) or (C2) is wrong,
    or a degeneracy exists that neither covers. This is the most valuable outcome and it must be pursued,
    not explained away.
  - The gauge-with-transported-factor-base control shows any change. The linear substitution is implemented
    incorrectly; nothing is reported.
  - The E[2] control shows NO change. The profile is not reading the geometry; the instrument has
    no resolution and Step 3's agreement is empty.
  - The matched-shape null differs materially from Semaev's profile on the transverse arm. Then the
    profile does carry Semaev-specific information, the derivation's prediction is wrong somewhere,
    and the record's stated conclusion terms must change.
  - Macaulay matrices exceed the memory budget before any profile is resolved. INFRASTRUCTURE outcome
    under AGENTS.md rule 5; reduce B and record it as such, never as evidence about invariance.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
