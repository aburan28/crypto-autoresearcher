# EXP-BINSTD-e11bd3
# Name-degree basis partition of the audit file. No solver.
# Approved by DEC-20261002-651988.
experiment:
  id: EXP-BINSTD-e11bd3
  hypothesis_id: H-BINSTD-693038
  source_idea: IDEA-20260922-9d12bd
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Name-degree basis partition of the audited curves
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-651988
  objective: >-
    Hash the parameter file. Group Basis Type by the integer after
    sect, pnb, or tnb. Check the two degree sets, the count of
    name degrees with more than one printed bit size, and that
    printed bit size 353 has both labels.
  inputs:
    path: analysis/binstd-curve-audit/binary-curve-params.txt
    sha256: ad4678d2703c36a5ee9c5d6dcaa5e886977b13c1c1546daad61f6c7710e4f493
    pp_degrees: [131, 163, 176, 208, 272, 283, 304, 368, 571]
    tp_degrees: [191, 193, 233, 239, 359, 409, 431]
    name_degree_count: 16
    mixed_name_degrees: 0
    name_degrees_with_several_printed_bits: 6
    printed_bit_with_both_bases: 353
  controls:
    - >-
      Printed bit size 353 having only one basis type is false.
      Reporting a single basis there invalidates the run.
    - >-
      A sha256 mismatch invalidates the run. It is not a negative
      grouping.
    - Two parsers. They must not import each other.
  independent_variables:
    - grouping in {name_degree, printed_bit}
    - route in {line_parser, repeat_module}
  metrics:
    primary:
      - sha256_match
      - pp_degree_set
      - tp_degree_set
      - mixed_name_degree_count
      - multi_bit_name_degree_count
      - bit_353_has_both_bases
      - single_basis_at_353_rejected
      - implementations_agree
    secondary:
      - name_degree_count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two degree sets, one mixed count, and one bit-size collision.
    formula: >-
      Name degree is the integer matched by sect, pnb, or tnb followed
      by digits. Printed bit size is the integer in the EC-Parameters
      line. A name degree is mixed when its curves do not all share
      one Basis Type.
    source: >-
      IDEA-20260922-9d12bd claim paragraph A, read 2026-10-02. The
      file was grouped in this design session. That grouping is not a
      run. No multiplication table was built.
  scale_relevance:
    tier: toy
    justification: One text file of 31 headings. No transfer to a solver cost.
    correspondence: null
  tail_checks:
    - Degree 571 and degree 431 are both required. Stopping before either and still reporting its set is invalid.
  replication:
    seeds: []
    independent_instances: 16
    replication_note: Deterministic. The second run is the other parser.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If bit size 353 is reported with only one basis, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either parser imports the other.
    - The sha256 does not match.
    - Bit size 353 is reported with only one basis type.
    - A clause-width measurement or a solver run is reported.
  success_criterion: >-
    Both runs agree, the sha256 matches, the pp and tp degree sets
    match the frozen lists, no name degree is mixed, six name degrees
    have more than one printed bit size, and bit size 353 has both
    basis types.
  falsification_criterion: >-
    The runs agree, the sha256 matches, bit size 353 keeps both basis
    types, and any degree set or either count differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-BINSTD-e11bd3/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-e11bd3/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-e11bd3/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-e11bd3/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-e11bd3/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-e11bd3/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Clause widths, leaf counts, and any solver run.
    - A normal-basis multiplication table.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
