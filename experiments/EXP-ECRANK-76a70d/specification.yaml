experiment:
  id: EXP-ECRANK-76a70d
  hypothesis_id: H-ECRANK-ee6e0e
  version: 1
  recorded_at: '2026-09-05'
  designed_by: TASK-20260905-ccbf5c
  converts_idea: IDEA-20260905-d5608c
  opening_decision: DEC-20260905-eba685

  title: >-
    Multi-twist-class forcing at n <= 10: construct quartics whose k = 3
    coset has >= 4 classes populated BY CONSTRUCTION via the
    delta-multiplier engine, certify the forced points descent-free with
    the certificate-kind split, and validate HEUR-1's H^(5 - n/2) density
    law against pre-registered counts at n = 6, 8, 10

  status: analyzed

  objective: >-
    Decide, with a possible negative outcome, whether the delta-multiplier
    engine produces -- within a pre-registered bounded sample and counted
    exact-op cap -- a nonsingular quartic v^2 = s(u) carrying 8 forced
    non-torsion points across 4 DISTINCT twist classes of ONE k = 3 coset
    of the committed support {-1, 2, 3, 5, 7, 11, 13}, certified
    descent-free with total contribution >= 8 from the forced classes
    (P1/P2); AND whether the found-instance count vs box height H follows
    HEUR-1's pre-registered growth law at n = 8 (exponent +1), checked
    against n = 6 (+2) and n = 10 (0) as different-scale parameter sets;
    AND whether the per-class relation count is c_e = 0 on nontrivial
    classes (HEUR-2); AND whether the per-class augmentation scan on a
    constructed instance yields points in non-forced classes above the
    null-object background (P3/F6). ZERO descent anywhere: no PARI
    ellrank, no 2-descent, no r_low, no root numbers; every claim is a
    lower bound from exhibited points. SCOPE WALL: n <= 10 everywhere; the
    unpriced wall-crossing route (n >= 12; M6 scale route to total >= 32;
    P4) is NAMED in the hypothesis and EXCLUDED here -- no budget line,
    stopping rule, or criterion references it. Budget note per the
    template floors: wall per run 7200 s (>= 600 floor) and memory
    ceiling 8 GB (>= 8 floor); the expected actual peak is < 4 GB per the
    idea's estimate, so the declared memory is headroom, not a need.

  inputs:
    support: [-1, 2, 3, 5, 7, 11, 13]
    coset_source: >-
      affine k = 3 cosets of the committed support (the committed
      enumeration: 11,811 direction subspaces x 16 = 188,976 affine
      subspaces, enumeration completeness re-verified by EV-ECRANK-6695dc);
      only cosets whose direction space contains -1 are eligible (mixed
      signs => real solvability guaranteed); >= 3 distinct cosets per arm,
      drawn by the arm's declared seed via deterministic PRNG.
    b_tuples: >-
      affine normal form b_1 = 0, b_2 = 1 (x |-> alpha*x + beta preserves
      the forcing structure with controlled rescaling of s and r);
      b_3..b_n DISTINCT integers in [-20, 20] \ {0, 1}; sampled in the
      seeded order, NO adaptive reordering. Sample sizes: arm A 10^3;
      arms B and C 10^4 each (derived in sample_size_derivation).
    r_heights: >-
      rationals r_i of height <= H, nested boxes H in {10^2, 10^3, 10^4};
      counts are cumulative over nested boxes and reported per H.
    engine: >-
      delta-multiplier engine (H-ECRANK-ee6e0e M2/M3): delta = Lagrange
      interpolant with delta(b_i) = d_i; s := delta*g^2 mod p, p =
      prod(x - b_i); ellipticity = n - 5 quadratic vanishing conditions on
      g's coefficients; equivalently square-pattern points of the
      computable 5-dimensional subspace W'(b) = D^-1 W(b) (left kernel of
      the 5 x n Vandermonde at b).
    solver: >-
      exact linear algebra over Q (fractions.Fraction, stdlib) for W'(b)
      and delta; seeded fibration sampling of the quadratic system (fix
      5 of the n r-coordinates in a seeded sub-box; the remaining 3
      satisfy 3 diagonal quadratics -- Bézout <= 8 candidate intersections
      per draw, rationality checked exactly). NO Groebner machinery at
      n <= 10. NO PARI, NO network, stdlib only.
    certification_machinery: >-
      committed: quartic_reduction / cubic_to_weierstrass (built-in exact
      on-curve rechecks), verify_certificate.py-style exact checks, the
      explicit transport factor (post-XOR-fix), Mazur non-torsion
      (m*P != O, m = 1..12), Kummer [K:Q] = 8 via 7 exact integer square
      tests, the exact F_l-reduction within-class certifier of
      IDEA-20260829-d53906's design (numerical regulator as cross-check
      only, never as the certificate).
    augmentation_scan_box: >-
      per class d of the instance's coset: rationals u = num/den with
      |num| <= 10^3, 1 <= den <= 20, gcd(num, den) = 1 (~4 x 10^4 points
      per class; a widening of the committed extra_quartic_points box
      |n| <= 400, d <= 12 -- the knob the committed run never widened);
      exact integer test: s(u) = d * square.
    null_objects: >-
      8 random quartics of MATCHED height and matched coefficient size
      (seeded; degree 3-4, nonsingular, coefficients of the same bit-size
      as the constructed instance's s), scanned with the identical box and
      test.
    implementation_constraint: >-
      NEW module beside the committed machinery; NEVER an edit to
      construct_highrank.py or coset_structure.py (EV-ECRANK-6695dc defect
      D4 remedy rule). Source archived under
      experiments/EXP-ECRANK-76a70d/source/.

  controls:
  - >-
    C1 KNOWN-FALSE CONTROL (proves-too-much; idea control 1) -- BOUND INTO
    INVALIDATION RULE IV-1. The identical pipeline runs at d = (1..1),
    where the engine degenerates to Mestre and "certified total = n" is
    KNOWN FALSE (the g - y relation eats exactly 1; committed ceilings 7
    at 2k = 8 and 9 at 2k = 10, attained exactly per EV-ECRANK-6695dc).
    Expected: total 7 at n = 8 and total 9 at n = 10. A pipeline
    reporting total = n at d = 1 is broken and ALL runs are void. This is
    a guard on the relation bookkeeping, not decoration.
  - >-
    C2 NULL-OBJECT CONTROL (idea control 2). The identical per-class
    augmentation scan runs against the 8 seeded random quartics of matched
    height/coefficient size. Constructed-instance yield in non-forced
    classes must exceed the null background (one-sided Fisher exact test,
    alpha = 0.05, 4 constructed non-forced cells vs 32 null cells) or F6
    fires: the seeds-and-fills route buys nothing measurable. Statistical
    power at this box is LIMITED and can decisively fire only on large
    effects -- disclosed, not smoothed.
  - >-
    C3 BLIND KERNEL RE-DERIVATION (idea control 3). An independent agent
    re-derives, from the STATEMENT of the quantities and the parameters
    alone, (a) the left kernel of W(b) (the n - 5 linear relations from
    the 5 x n Vandermonde) and (b) the delta interpolant, at >= 3 seeded
    b-tuples per arm, and NEVER reads the solver's implementation, the
    producer's notes, or its report (blind_from:
    experiments/EXP-ECRANK-76a70d/source/, the executor's run notes and
    report). Agreement is evidence about the quantity; disagreement
    localises to one of two named implementations and triggers invalidation
    rule IV-3. This is not replication: recomputing from the producer's
    own artifacts would reproduce a wrong-but-self-consistent
    implementation faithfully.
  - >-
    C4 DEGENERACY FILTER (idea control 4, learned from its own desk
    audit). Every candidate instance is filtered EXACTLY: deg s in {3, 4};
    s nonsingular (discriminant of the quartic model nonzero, exact);
    g(b_i) != 0 for all i. The symmetric choice A = (+-1, +-3, +-5, +-7)
    makes s the CONSTANT 4096 -- the forcing identity holds perfectly and
    the curve is not elliptic -- so nondegeneracy is a real condition, as
    the committed machine's "s is not a cubic" AssertionError enforces.
    Instances failing the filter are excluded from ALL counts; a
    success-criterion instance failing it voids the success claim (IV-4).
  - >-
    C5 SYNTHETIC UNIFORM CONTROL OF MATCHED SHAPE (skill minimum control;
    validates sampler and metric) -- BOUND INTO INVALIDATION RULE IV-2.
    >= 3 PLANTED synthetic instances per H level: subspaces W'(b)-shaped
    problems with square-pattern points PLANTED by construction at known
    heights (a known solution is embedded, the subspace is written down
    from it). The identical sampler must find >= 1 planted point per
    instance, and the identical count-vs-H metric pipeline must recover
    the planted growth exponent (+1) within a factor of 2 per decade. A
    sampler or metric that fails on planted objects is invalid on real
    ones.
  - >-
    C6 INDEPENDENCE OF INSTANCES AND SEEDS (skill minimum control).
    >= 3 distinct cosets per arm with separate seeded b-streams; instances
    counted only as DISTINCT MINIMAL MODELS (committed minimal-model
    routine; O-08 pseudo-replication lesson: 1206 records were 1169
    distinct models); affine images (x |-> alpha*x + beta) deduped.
    Determinism re-run of arm B at the identical seed must reproduce the
    instance list bit-for-bit (divergence voids both runs, IV-7).
  - >-
    C7 SECOND PARAMETER SET AT A DIFFERENT SCALE (skill minimum control).
    The density law is tested at THREE scales, not one: n = 6 (exponent
    +2, the near-rigorous Hasse-Minkowski anchor), n = 8 (+1, the main
    arm), n = 10 (0, borderline). A metric that "confirms" the same
    exponent at all three n is measuring itself, not the law: the
    predicted ratios differ by n (100x vs 10x vs 1x per decade of H) and
    the comparison is scale-specific by construction.

  independent_variables:
  - n, the number of forced points (6, 8, 10; classes = n/2)
  - coset choice within the eligible k = 3 cosets (seeded; >= 3 per arm)
  - class pattern d (mixed pattern from one coset vs the known-false d = (1..1) control)
  - box height H (nested: 10^2, 10^3, 10^4)
  - instance source at the scan stage (constructed core vs null random quartic of matched shape)

  metrics:
    primary:
    - >-
      certified descent-free k = 3 total contribution from the forced
      classes at the arm-B instances, WITH the certificate-kind split
      (exact eigenspace units + exact F_l within-class units), zero
      verifier errors (success criterion binds here; P1/P2).
    - >-
      count of distinct-minimal-model nonsingular forced instances per
      (n, H) cell over the pre-registered seeded sample, vs the
      pre-registered growth law H^(5 - n/2) (HEUR-1 distribution
      comparison).
    secondary:
    - measured per-class relation count c_e on nontrivial classes (HEUR-2; F3 trigger)
    - coefficient height(s) of every found instance (F4 threshold 10^8)
    - augmentation-scan yield per (source, class) cell, constructed vs null (F6)
    - counted exact rational operations, wall seconds, and peak_rss_bytes per arm (budget reconciliation)
    - verifier error count (must be 0 on every certificate)
    - local-solvability outcomes at n = 6 (real place + primes p <= 100; P0/F2)
    - blind re-derivation agreement flags (left kernel of W(b) and delta at >= 3 seeded b per arm)
    - known-false control outputs (certified total at d = (1..1): expected 7 at n = 8, 9 at n = 10)
    - planted-control recovery (found/planted per H level; recovered exponent vs planted +1)

  heuristic_under_test: HEUR-1
  heuristic_under_test_secondary: >-
    HEUR-2 (load-bearing for the success criterion's 4 F_l within-class
    units: within-class independence of the 2 forced points per class is
    exactly what HEUR-2 underwrites until P2 measures c_e).

  heuristics_stated_exactly:
  - id: HEUR-1
    formal_statement: >-
      For a fixed generic n-tuple b of distinct rationals and squarefree d
      with mixed signs, the set {u in W'(b) : every u_i a nonzero rational
      square} has counting function ~ C(b,d) * H^(5 - n/2) as the height
      bound H grows, with C(b,d) > 0 iff the system is solvable at every
      local place. Quantifiers: fixed generic b (outside a proper
      Zariski-closed degenerate locus), asymptotic in H; C(b,d) is
      per-(b,d).
    distribution_concerned: >-
      the counting distribution of square-pattern points of the fixed
      5-dimensional rational subspace W'(b) as a function of the height
      bound H -- NOT a distribution over curves or over cosets.
    rigorous_results_it_interpolates_between: >-
      AT ONE END the d = (1..1) slice is exact, not heuristic: Mestre's
      closed form (trunc-sqrt) solves it identically for every n <= 10,
      committed and re-verified internally (construct_highrank.py
      per-build assertion; EV-ECRANK-6695dc on all 1206 pool curves). AT
      THE OTHER END n = 6 is ONE diagonal quadratic form in 6 variables,
      where the Hasse-Minkowski local-global principle (RECALLED pointer:
      Serre, A Course in Arithmetic, Ch. IV; unverified in this program,
      pointer not support) converts existence into finitely many exact
      local checks. HEUR-1 is the square-class equidistribution
      assumption interpolating between these anchors at mixed d,
      6 < n <= 10.
    random_model_justification: >-
      ~H^5 lattice points of height <= H in a fixed 5-dimensional rational
      subspace; each coordinate of size ~ X a rational square with
      probability ~ X^(-1/2); coordinates equidistributed across square
      classes (the standard random-model assumption of this genre).
  - id: HEUR-2
    formal_statement: >-
      For a nontrivial twist class e != 1 carrying n_e forced points from
      the delta-multiplier engine, the number of independent function-
      theoretic relations among the forced points over Q is c_e = 0 when
      n_e <= 2. Quantifiers: every nontrivial class e; generic b (special
      positions excluded by HEUR-1's genericity locus).
    distribution_concerned: >-
      not a random model -- a divisor argument: (g^2 - s)(b_j) =
      (1 - d_j)*g(b_j)^2 != 0 for d_j != 1, so the only committed relation
      producer does not descend to nontrivial classes; residual relations
      would be accidental and genericity excludes them.
    rigorous_results_it_interpolates_between: >-
      exact at the endpoints it names: c_1 = 1 at d = 1 is COMMITTED and
      attained (ceilings 7/9 measured exactly, EV-ECRANK-6695dc), and the
      non-vanishing computation above is exact algebra; the heuristic
      content is only the exclusion of ACCIDENTAL relations at generic b,
      which P2 measures rather than assumes.

  preregistered_prediction:
    written_before_any_run: '2026-09-05 (this frozen contract; no run of this experiment exists)'
    never_adjusted_afterward: >-
      This prediction is part of the frozen contract. Any later change
      requires a versioned protocol_amendment in
      experiments/EXP-ECRANK-76a70d/amendments/ and creates a new record;
      it is never an edit of this field, and runs already executed are
      never silently re-scored against the new one.
    quantity: >-
      (1) The count N(n, H) of distinct-minimal-model nonsingular forced
      instances found over the pre-registered seeded b-sample as a
      function of the box height H, at n = 6, 8, 10. (2) The per-b-tuple
      success rate at n = 8 against the resolution floor q = 10^-3.
      (3) The measured per-class relation count c_e (HEUR-2).
    formula: >-
      N(n, H) ~ C(b,d) * H^(5 - n/2) with C(b,d) > 0 iff locally solvable
      everywhere: at n = 8 exponent +1 -- counts grow ~10x per decade of H
      (relative counts 10^2 : 10^3 : 10^4 over H = 10^2 : 10^3 : 10^4, up
      to the unknown per-(b,d) constant); at n = 6 exponent +2 (10^4 :
      10^6 : 10^8); at n = 10 exponent 0 (flat, finite, expected nonzero).
      Per-b rate at n = 8 >= q = 10^-3 (the declared resolution floor; see
      sample_size_derivation). c_e = 0 for every nontrivial class with
      n_e = 2, and c_e <= 1 where a class carries more.
    source: >-
      HEUR-1 and HEUR-2 of IDEA-20260905-d5608c (provenance: internal --
      this program's own filed proposal, carried into H-ECRANK-ee6e0e),
      whose random-model justification is the subspace lattice count times
      square-class equidistribution, and whose exact anchors are the
      committed d = 1 closed form (internal, verified) and the n = 6
      Hasse-Minkowski local-global principle (RECALLED pointer -- Serre,
      A Course in Arithmetic, Ch. IV; pointer not support; the experiment
      checks local solvability explicitly either way). The nearest
      literature genre pointers (Schinzel-type square-pattern heuristics,
      Nagao-style constructions, Birch-type solvability) are RECALLED and
      support nothing (rule 9).
    comparison_metric_predefined: >-
      Empirical vs predicted DISTRIBUTION comparison: (a) log-log slope of
      N(n, H) vs H at each n, against the predicted exponent 5 - n/2
      (a flat count at n = 8 as H increases is the canonical artifact tell
      and fires F1's scope reading; growth at n = 10 far above flat is the
      artifact tell in the other direction -- sampler leak, e.g.
      degenerate constant-s solutions of the 4096 lesson escaping the
      filter); (b) per-b success rate at n = 8 vs the floor q = 10^-3;
      (c) counts deduplicated to distinct minimal models BEFORE any fit
      (O-08); (d) the fit is computed over the PRE-DECLARED seeded sample
      only -- no adaptive box widening enters the statistic (O-09
      selection-on-the-outcome, disclosed as a confounder of the
      distributional reading, not of existence claims).

  sample_size_derivation:
    method: >-
      Derived per the heuristic-validation pattern from the smallest
      predicted probability the experiment must resolve, with the expected
      tail multiple stated. Arithmetic executed pre-run (design run 1,
      TASK-20260905-ccbf5c, /Volumes/SSD990/llm/tmp/opencode/
      task_ccbf5c_design_arithmetic.py; output archived in design-notes.md).
    density_arithmetic_at_chosen_n: >-
      HEUR-1 exponent 5 - n/2 evaluated explicitly: n = 6 -> +2; n = 8 ->
      +1; n = 10 -> 0; (n = 12 -> -1, n = 32 -> -11: OUT OF SCOPE, named
      for the wall). At n = 8 with r-height H = 10^4 (u-height X = H^2 =
      10^8): per-point square-pattern probability X^(-n/2) = 10^-32;
      subspace lattice points ~ X^5 = 10^40; expected count X^(5 - n/2) =
      10^8 in u-height, i.e. ~ C * H^1 = C * 10^4 in box height H -- the
      law as HEUR-1 states it. Solutions at n = 8 are predicted ABUNDANT;
      at n = 10 finite-expected-nonzero.
    smallest_probability_to_resolve: >-
      q = 10^-3 := the per-b-tuple probability floor that a seeded
      b-tuple yields >= 1 certified instance within the bounded search.
      DECLARED, NOT THEOREM-DERIVED, and flagged as such: HEUR-1 predicts
      neither the locally-solvable fraction f_loc nor the constant C(b,d),
      so no theorem in hand yields q. q = 10^-3 is the SMALLEST floor
      resolvable within the idea's own budget: resolving q = 10^-4 at the
      same 10x tail multiple needs N_b = 10^5, i.e. 10^5 x 10^4 = 10^9
      counted ops -- exactly the idea's per-arm cap with ZERO headroom and
      wall risk at conservative throughput; q = 10^-3 keeps 10x op
      headroom inside the cap.
    derived_sample_count: >-
      N_b = tail_multiple / q = 10 / 10^-3 = 10^4 seeded b-tuples per arm
      (arms B and C; arm A takes 10^3, ample at exponent +2 where expected
      counts are ~ C * 10^8 at H = 10^4).
    expected_tail_multiple: >-
      Expected tail count at the floor: N_b * q = 10^4 * 10^-3 = 10 -- a
      10x multiple, "meaningfully larger than 1" per the pattern.
      Consequence: if the true per-b rate is >= q, P(zero instances) =
      (1 - q)^N_b ~ e^-10 ~ 4.5 x 10^-5, so a null result is a MEASUREMENT
      against HEUR-1 on the declared scope (fires F1 there), not bad luck.
    scope_of_f1: >-
      The sample covers ~10^4 of ~1.7 x 10^9 affine normal-form b-tuples
      (~6 x 10^-6); full-box exhaustion would cost ~2 x 10^13 ops (~10^5x
      the arm cap) and is NOT promised. F1 fires at the DECLARED SAMPLE
      scope only (AGENTS.md rule 6). The idea's P1 is budget-scoped in the
      idea itself (<= 10^9 exact ops, <= 2 h), so this fixes scope rather
      than narrowing a promise.

  scale_relevance:
    tier: toy
    justification: >-
      The claim-tier vocabulary of docs/claims-and-verification.md is
      indexed by ECDLP field bit-size and does not describe this work;
      `toy` is the least-asserting available label, matching the
      EXP-ECRANK-e1e30e precedent and the idea's interpretation limits.
      TESTED PARAMETERS: b_i distinct integers in [-20, 20] (matching the
      committed amax scales: M8 [-14,14], M10 [-20,20]); r-height <= 10^4;
      scan box |num| <= 10^3, den <= 20. TRANSFER ASSUMPTIONS: NONE --
      nothing here transfers to cryptographic parameters, supports no
      ECDLP claim, and no asymptotic claim is made (the hypothesis's
      asymptotic_claim is null). Scale access is DIRECT sampling at the
      committed small-coefficient scale; no correspondence trick is used
      or needed at this tier, and none is claimed.
    correspondence: null
    correspondence_note: >-
      Explicitly null rather than absent: unlike the target-profile
      exemplar (Deuring correspondence reaching crypto scale), this design
      samples directly at toy scale and claims nothing beyond it. The
      field is present so a reader cannot mistake an omitted field for an
      overlooked one.

  tail_checks:
  - >-
    HEIGHT TAIL (F4): height(s) of EVERY found n = 8 instance is recorded
    and checked against 10^8; all instances above 10^8 weakens the
    small-height half of HEUR-1 and declares P4 infeasible on the height
    axis absent new structure.
  - >-
    LOW-END TAIL: the smallest-H cell (n = 8, H = 10^2) is reported even
    when empty; predicted relative count 10^2 * C. Zero instances at
    H = 10^4 across the full 10^4 sample with the 4.5 x 10^-5 chance under
    rate >= q is the F1 event -- the extreme-sample check of this design.
  - >-
    FLATNESS ARTIFACT TELL: N(n, H) must move with H as the exponent law
    says per n (+2/+1/0). A flat count at n = 8 as H grows is the
    canonical artifact tell (inventor protocol: a quantity that fails to
    decay/grow when the parameter meant to drive it moves); it is recorded
    and read as F1-scope evidence, never silently passed. The reverse tell
    (strong growth at n = 10, exponent 0) indicates sampler leak -- e.g.
    degenerate constant-s solutions of the 4096 lesson escaping the
    degeneracy filter -- and triggers a filter audit before any claim.
  - >-
    KNOWN-FALSE TAILS: the d = (1..1) control is checked at BOTH n = 8
    (expected total 7) and n = 10 (expected total 9); either reporting
    total = n voids everything (IV-1).
  - >-
    PLANTED-CONTROL TAIL: the recovered exponent on planted synthetic
    instances must match the planted +1 within a factor of 2 per decade at
    every H level; the metric pipeline that fails on planted objects is
    invalid on real ones (IV-2).

  replication:
    seeds: [760706, 760708, 760710, 760711, 760712]
    seeds_note: >-
      Deterministic, declared pre-run, never adjusted: 760706 -> arm A
      (n = 6); 760708 -> arm B (n = 8); 760710 -> arm C (n = 10); 760711
      -> scan stage + null objects; 760712 -> known-false d = (1..1)
      control. Coset choice, b-tuple order, fibration sub-boxes, and null
      quartics all derive from the arm seed via random.Random(seed);
      height sub-boxes are nested and deterministic (no RNG in H). The
      arm-B determinism re-run uses 760708 again and must reproduce the
      instance list bit-for-bit.
    independent_instances: 9
    independent_instances_note: >-
      >= 3 distinct eligible cosets per arm x 3 arms = 9 independent
      instance streams with separate seeded b-streams; cross-stream
      deduplication by minimal model before any count (C6).

  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 16
    total_cpu_hours_note: >-
      Worst-case ceiling: maximum_runs 8 x 7200 s = 16 h. Expected
      consumption ~6-7 h (design run 1 arithmetic: arm A ~5 x 10^6 ops,
      arms B/C ~10^8 ops each at >= 2 x 10^4 exact-ops/s conservative
      Fractions throughput => <= 5000 s each; scan stage ~5.8 x 10^7 ops
      => <= 2900 s; controls and determinism re-run cheap).
    maximum_memory_gb: 8
    maximum_memory_gb_note: >-
      Template floor respected (>= 8); expected actual peak < 4 GB per the
      idea's estimate -- the declared value is headroom, not a need, and
      peak_rss_bytes is reconciled against it per run.
    maximum_runs: 8
    maximum_runs_note: >-
      Enumerated: (1) instrument smoke self-test on committed fixtures;
      (2) arm A; (3) arm B; (4) arm B determinism re-run; (5) arm C;
      (6) augmentation scan + null objects; (7) known-false d = (1..1)
      control; (8) one repair/restart margin within the counted-ops caps.
    maximum_workers: 1
    counted_exact_rational_operations_per_arm: 1.0e8
    counted_ops_note: >-
      The binding budget is the COUNTED exact-op cap, not the wall:
      per-b declared cap 10^4 ops (Vandermonde left kernel ~512 + delta
      interpolation ~64 + <= 8 fibration draws x ~824 = ~7.2 x 10^3,
      rounded up) x N_b = 10^4 => 10^8 per arm -- inside the idea's
      ~10^8-10^10 estimate and 10x inside its <= 10^9/arm cap. Ops are
      counted and checkpointed every 10^7.
    descent_calls: 0
    pari_ellrank_calls: 0
    network: none

  stopping_rules:
  - >-
    Per arm: counted exact rational operations reach 1.0e8 OR wall reaches
    7200 s, WHICHEVER FIRST. On exhaustion the run reports the completed
    H-levels and sample prefix and stops; exhaustion is reported as
    exhaustion -- inert in both directions (AGENTS.md rules 3 and 5),
    never re-scored as a positive or negative result.
  - >-
    Checkpoint every 10^7 counted ops: partial instance lists, counts per
    (n, H) cell, and op counters are flushed, so an exhausted or crashed
    run still yields its completed prefix as an artifact.
  - >-
    NO early stop of arm B for "enough instances found": the count-vs-H
    law is a primary metric, so the full 10^4 sample runs at every H level
    unless a cap fires. NO adaptive widening of any box, ever: a widening
    is a NEW experiment with its own contract (the idea's confounder rule,
    bound here).
  - >-
    Scan stage: fixed declared box, single pass, no re-scan of hits, no
    widening; the Fisher test is computed once on the frozen yield table.
  - >-
    A crash, timeout, or solver failure stops the affected run with status
    failed_infrastructure and asserts NOTHING about the hypothesis
    (rule 5); the repair margin (run 8) may restart it from its checkpoint.

  invalidation_rules:
  - >-
    IV-1 KNOWN-FALSE CONTROL FAILURE (idea control 1, bound here): the
    pipeline reports certified total = n at d = (1..1) -- it must report 7
    at n = 8 and 9 at n = 10 (the g - y relation eats exactly 1; committed
    ceilings) -- => the relation bookkeeping is broken and ALL runs of
    this experiment are VOID. Its failure voids the run; it is not
    decoration.
  - >-
    IV-2 PLANTED SYNTHETIC CONTROL FAILURE (C5): the sampler misses a
    planted instance at any H level, or the metric pipeline's recovered
    exponent deviates from the planted +1 by more than a factor of 2 per
    decade => sampler/metric invalid; every arm's distributional metric is
    void (existence certificates found anyway survive, being
    verifier-checked independently).
  - >-
    IV-3 BLIND RE-DERIVATION MISMATCH (C3): the blind re-derivation of the
    left kernel of W(b) or the delta interpolant disagrees with the
    solver's output at any checked b, and exact recomputation does not
    localize the disagreement to the re-deriver's side => the affected
    runs are void pending repair; disagreement localised to the solver
    additionally fires F5's investigation path.
  - >-
    IV-4 DEGENERACY LEAK (C4): any counted instance fails the exact
    nondegeneracy filter (deg s not in {3, 4}, singular model, or some
    g(b_i) = 0) => the instance is struck from ALL counts; if a
    success-criterion instance fails the filter, the success claim is
    VOID.
  - >-
    IV-5 VERIFIER REJECTION: the exact verifier rejects any exhibited
    witness (point off curve, torsion under Mazur m <= 12, transport
    mismatch, class outside the coset, coset not closed under
    multiplication mod squares) => the run is invalid AND F5 fires: the
    algebra of M0-M3 of the hypothesis is wrong as stated.
  - >-
    IV-6 DESCENT CONTAMINATION: any r_low / PARI ellrank / 2-descent call,
    any root-number computation, or any floating-point arithmetic inside
    the exact certificate part => the affected certificate is VOID (the
    descent-free property is the claimed contribution; the numerical
    regulator is admissible only as a recorded cross-check, never inside
    the certificate).
  - >-
    IV-7 DETERMINISM FAILURE: the arm-B determinism re-run at seed 760708
    diverges from the original instance list => both runs are void (the
    pipeline is not reproducible, so no count from it is a measurement).

  success_criterion: >-
    DECIDABLE, WITH A POSSIBLE NEGATIVE OUTCOME (prior point 1). Arm B
    exhibits at least one nonsingular quartic v^2 = s(u) with 8 forced
    non-torsion points across 4 DISTINCT twist classes of ONE k = 3 coset
    of the committed support, all within the frozen box (b_1 = 0, b_2 = 1,
    b_3..b_8 distinct integers in [-20, 20]; r-height <= 10^4; <= 10^8
    counted exact rational operations; <= 7200 s wall), whose exact
    descent-free certificate reports a certified k = 3 total contribution
    from the forced classes of >= 8 -- at least 4 exact eigenspace units
    plus at least 4 exact F_l within-class units, certificate-kind split
    carried, zero verifier errors -- with ALL controls passing (IV-1
    through IV-7 untriggered); the declared negative outcomes are equally
    frozen: exhausting the 10^4-sample at n = 8 within the caps with no
    such instance is a NEGATIVE result firing F1 on the declared scope, a
    certified contribution < 8 or a measured c_e >= 2 on most nontrivial
    classes is a NEGATIVE result on P2 (F3), and any control failure
    invalidates the runs rather than producing a result.
  success_criterion_decidability_note: >-
    Every clause is machine-checkable from the predefined metrics and
    artifacts: instance existence (exhibited witness), class distinctness
    (F_2 linear algebra over the support), box membership (declared
    bounds), certificate total and kind split (exact verifier output),
    verifier errors (count), control states (IV-1..IV-7 flags). No clause
    depends on judgement, solver time beyond the caps, or an unbounded
    search; "construct any curve given enough solver time" is excluded by
    the counted-ops cap and the frozen sample.

  falsification_criterion: >-
    Any of the six frozen conditions, each closing ONLY its declared scope
    (rule 6): F1 -- the pre-registered 10^4 seeded b-tuple sample at n = 8
    is exhausted within the counted-ops/wall caps with no nonsingular
    instance (P(zero | rate >= q = 10^-3) ~ 4.5 x 10^-5): HEUR-1's
    small-height density is falsified ON THE DECLARED SAMPLE SCOPE, and
    budget exhaustion within the sample is reported as exhaustion, not as
    F1. F2 -- a local obstruction (a prime p <= 100 or the real place) is
    MEASURED for EVERY sampled b: a named obstruction with quantity,
    value, and scope is recorded (the closure-standard object). F3 -- c_e
    >= 2 measured for most nontrivial classes with n_e = 2: HEUR-2
    falsified, the yield claim dies as stated, and every target total in
    P3/P4 rises by the measured c_e. F4 -- every found n = 8 instance has
    height(s) > 10^8: the small-height half of HEUR-1 is weakened and P4
    is declared infeasible on the height axis absent new structure. F5 --
    the exact verifiers reject an exhibited witness: the algebra of M0-M3
    is falsified as stated. F6 -- the augmentation-scan yield on the
    constructed instance is statistically indistinguishable from the null
    objects (one-sided Fisher exact, alpha = 0.05, declared cells): the
    seeds-and-fills route (M6) buys nothing measurable and P4's only open
    path closes. NONE of these is a verdict that multi-class forcing is
    dead: a falsification here yields the measured obstruction plus the
    resource_check the closure standard requires.

  required_artifacts:
  - exact command per run (runs/*/manifest.yaml, code.command + code.commit + dirty-tree state)
  - environment and dependency versions (python3, stdlib-only declaration; no PARI, no network)
  - input parameters and ALL seeds (arm seeds, coset draws, b-order, fibration sub-boxes, null-quartic draws)
  - inference manifest per run: requested model policy, backend, resolved runtime model identifier, whether probe-verified (model_verified), reasoning effort, fallback_used with reason, degraded_requirements
  - stdout and stderr, complete (runs/*/stdout.log, runs/*/stderr.log)
  - raw machine-readable results (runs/*/raw-result.json: per-b search log, instance lists per (n, H) cell, op counters, c_e table, scan yield table, Fisher test inputs and output)
  - certificates/*.json: forced points, class list, certificate-kind-split totals, F_l certifier primes and reductions, Mazur witnesses (m*P for m = 1..12), Kummer square tests, verifier verdicts
  - blind re-derivation report (C3): the re-deriver's declared sources_read, blind_from attestation, and the compared quantities
  - null-object scan raw yield table and the constructed-instance yield table (F6 inputs)
  - known-false control output (d = (1..1) certified totals at n = 8 and n = 10)
  - planted-control instances and recovery log (C5)
  - validity status and reason per run
  - timestamps and resource measurements (wall seconds, counted exact ops, peak_rss_bytes reconciled against the 8 GB ceiling)
  - source/*.py: the NEW engine module and drivers (never an edit to construct_highrank.py or coset_structure.py; D4 remedy)
  - determinism re-run diff artifact (bit-for-bit instance-list comparison)

