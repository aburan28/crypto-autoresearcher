experiment:
  id: EXP-SNOVA-1f0a27
  hypothesis_id: H-SNOVA-3a1583
  derived_from_idea: IDEA-20260801-016
  question_id: RQ-SNOVA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    SNOVA wedge-product and group-action attack-cost map at toy parameters,
    measured against a matched plain-whipped-UOV baseline on shared attack code,
    with a forced-value positive control and a structure-degeneracy gate
  objective: >-
    The one uncertainty a run reduces is whether SNOVA's two extra structures -
    the wedge-product decomposition of its whipping and the extended-public-key
    group-action orbit - buy an attacker anything the plain-whipped-UOV baseline
    does not already buy, at the only scale where all three attacks can actually
    be run. A run establishes (i) the measured cost of each of the three attack
    families on matched instances, in wall clock AND in a solver-independent
    operation count, at at least three toy sizes; (ii) the ratio R_family of
    structure-attack cost to baseline cost per cell, with its dispersion over at
    least 20 independent instances; and (iii) whether each structure is actually
    non-degenerate at each toy size, which is the precondition without which the
    ratio measures nothing. No attack on any standardized SNOVA parameter set is
    attempted, claimed, or implied. No statement is made about what the published
    literature contains; this environment cannot reach external literature.
  what_this_is_not:
    - >-
      Not a break, key recovery, forgery or distinguisher against SNOVA at any
      submitted or standardized parameter set. It is a toy-scale measurement
      contract.
    - >-
      Not a claim in either direction about SNOVA's security level, nor an
      endorsement or a refutation of its published security analysis.
    - >-
      Not a status change to any hypothesis, evidence record, decision or goal
      record, and not a promotion of any knowledge entry.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output,
      or evidence. No run has been executed under this contract and no number in
      it is a measurement.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the executed toy sizes, with the executed
      attack implementations and the executed solver back end, the wedge-product
      and group-action attacks were or were not measured cheaper than the matched
      plain-whipped-UOV baseline by the declared factor, with a stated dispersion.
      WHAT DOES NOT FOLLOW: no security level for any SNOVA parameter set; no
      statement that the structures are or are not exploitable at cryptographic
      size; no comparison against any attack this contract did not run; and
      specifically NOT that a toy trend extrapolates - the trend assumption is
      HEUR-SNOVA-3a1583-1 and carries its own falsification condition.
  inputs:
    procedure: >-
      STAGE 0 (zero compute): re-derive the wedge-product decomposition and the
      group-action orbit from the SNOVA specification, write down the matching
      rule that makes a plain-whipped-UOV instance size-matched to a SNOVA
      instance, and freeze the toy ladder, seeds and instance count. A structure
      that cannot be re-derived here is an infrastructure stop, not a result.
      STAGE 1 (minutes): instance generation and the structure-degeneracy gate -
      for every toy size, generate the matched instance pairs and measure the rank
      of the wedge decomposition and the size of the group-action orbit; exclude
      and record any size where either degenerates.
      STAGE 2 (minutes): the POSITIVE CONTROL, read before anything else - run the
      baseline UOV attack on the matched plain-whipped-UOV instances and require
      key recovery on every instance at every included size. A failure here voids
      the run.
      STAGE 3 (hours): the map - run all three attack families against both
      instance types at every included toy size, over the declared instance count
      and seeds, recording per-instance wall clock, operation count, peak memory
      and success bit.
      STAGE 4 (minutes): the NULL arm - run the identical three attacks against
      structureless random systems of matched size, which must not succeed at the
      structured arms' cost.
      STAGE 5 (zero compute): assemble the ratio table with dispersion, report the
      trend across sizes with its confidence interval, and write the refusal
      statement for every cell outside the tested ladder.
    instrument: >-
      One shared attack code base in which the three attack families are selectable
      modes over a COMMON solver back end and a COMMON instance representation, so
      that a measured ratio cannot be an artifact of two different solvers. Python
      3.11 with numpy; no SageMath, which is absent from this container. Operation
      counts are instrumented in the field-arithmetic layer, not estimated from
      wall clock. Recorded through harness/runner.py.
    parameters: >-
      At least three toy sizes on a declared ladder, each chosen so that all three
      attacks terminate inside wall_clock_seconds_per_run at the largest size. Each
      toy size supplies matched SNOVA and plain-whipped-UOV instances agreeing on
      field, variable count, equation count and whipping multiplicity; the matching
      rule is frozen at STAGE 0 and is not adjusted after any cost is observed. At
      least 20 independent instances per (attack family, instance type, toy size)
      cell, drawn from the declared seed streams. Decision threshold on the ratio
      pre-registered at 0.5, from the parent proposal IDEA-20260801-016.
  controls:
    - >-
      POSITIVE CONTROL, forced value, read FIRST. The baseline UOV attack must
      recover a key on 20 of 20 matched plain-whipped-UOV instances at every
      included toy size. Forced value 1.0. If it is not 1.0 the ratio's denominator
      is undefined and NO conclusion, positive or negative, may be drawn from any
      arm of the run.
    - >-
      NULL OBJECT, matched shape, CAN FAIL. Run all three attacks against random
      structureless multivariate systems of identical field, variable count and
      equation count, with no wedge decomposition and no orbit. Forced expectation:
      the two structure attacks do no better than the baseline there, since there is
      no structure to exploit. If a structure attack is as fast on the null as on
      the real instances, it is not using the structure and every ratio it produced
      is void.
    - >-
      STRUCTURE-DEGENERACY GATE. At every toy size, the rank of the wedge
      decomposition and the size of the group-action orbit are measured and required
      to be strictly above their degenerate values. A degenerate size is EXCLUDED
      from the map with its measured value recorded, never silently dropped.
    - >-
      SHARED-SOLVER CONTROL. All three families call one solver back end. The
      solver's own cost on a fixed synthetic system is measured once per run as a
      calibration point, so that a ratio shift caused by solver variance is
      separable from one caused by the attack.
    - >-
      TWO-UNIT COST CONTROL. Every cost is reported in wall clock AND in
      instrumented field operations. A ratio that moves between the two units is
      an implementation-constant effect and must be reported as such rather than
      as a structural one.
    - >-
      GRADED CONTROL, at least three toy sizes, monotonicity reported. R_family is
      reported per size with its dispersion, and the fitted slope against log(size)
      is reported with a confidence interval. A non-monotone or sign-ambiguous
      trend is reported as such and voids the directional reading, not the
      single-size readings.
    - >-
      ORDERING CONTROL. The positive control and the null arm are computed,
      recorded and hash-committed BEFORE the SNOVA arm's ratios are looked at.
  independent_variables:
    - 'attack family: wedge_product / group_action / baseline_uov'
    - 'instance type: toy SNOVA / matched plain-whipped-UOV / structureless random'
    - toy size on the declared ladder
    - seed / instance index within a cell
  metrics:
    primary:
      - name: R_wedge
        units: dimensionless ratio
        computed_as: >-
          median over instances of (cost of the wedge-product attack on the toy
          SNOVA instance) divided by the median cost of the baseline UOV attack on
          the size-matched plain-whipped-UOV instance, computed separately in wall
          clock seconds and in instrumented field operations, reported per toy size
          with a bootstrap interval over instances.
      - name: R_group_action
        units: dimensionless ratio
        computed_as: >-
          identical construction with the group-action attack in place of the
          wedge-product attack.
      - name: baseline_attack_success_rate
        units: fraction of instances
        computed_as: >-
          number of matched plain-whipped-UOV instances on which the baseline
          attack recovered a valid key, divided by the instance count, per toy
          size. Forced value 1.0; this is the positive control.
      - name: structure_nondegeneracy
        units: >-
          rank (integer) for the wedge decomposition, orbit cardinality (integer)
          for the group action
        computed_as: >-
          measured per toy size before any attack is run; a size failing the gate
          is excluded from the ratio table with its value recorded.
    secondary:
      - name: per_family_success_probability
        units: fraction of instances
        computed_as: successful key recoveries divided by instance count, per cell.
      - name: null_arm_cost_ratio
        units: dimensionless ratio
        computed_as: >-
          structure-attack cost on the structureless random system divided by
          baseline cost on the same system, per toy size.
      - name: ratio_trend_slope
        units: d log R / d log size
        computed_as: >-
          least-squares slope of log R_family against log(toy size) across the
          included ladder, with a bootstrap confidence interval over instances.
      - name: peak_memory
        units: bytes
        computed_as: peak_rss_bytes per run, reported per cell.
      - name: solver_calibration_cost
        units: seconds and field operations
        computed_as: >-
          cost of the shared solver on one fixed synthetic system, measured once
          per run invocation.
  heuristic_under_test:
    id: HEUR-SNOVA-3a1583-1
    formal_statement: >-
      For the declared toy ladder, the sign of d log R_family / d log(size) does
      not reverse above the largest tested size; i.e. the measured trend in the
      cost ratio is directionally representative of larger sizes.
    status: >-
      Tested only in the weak sense the ladder permits. Three sizes can refute a
      claimed monotonicity; they cannot establish an asymptotic direction, and this
      contract does not claim they can.
  preregistered_prediction:
    quantity: >-
      R_wedge and R_group_action at the largest included toy size, in both cost
      units, against the pre-registered decision threshold 0.5.
    formula: >-
      R_family >= 0.5 at every included toy size is the coverage outcome; any
      R_family < 0.5 at the largest included toy size, with the structure gate and
      the positive control both passing, is the uncovered-gap outcome. Under the
      null that the structure carries no exploitable information, R_family = 1
      within dispersion at every size.
    source: >-
      Pre-registered in the parent proposal IDEA-20260801-016
      (predictions.minimum_effect, "A cost ratio below 0.5 at the largest toy size
      is a map departure") before any run under this contract exists. Never tuned
      to data; a run reporting a different threshold reports a different experiment
      and needs a versioned protocol_amendment.
  scale_relevance:
    tier: toy
    justification: >-
      Executed only at sizes where all three attacks terminate, which is far below
      any SNOVA parameter set. That is the entire design: the ratio is only ever
      formed where its denominator can be measured rather than modelled. The
      transfer assumption is stated, narrow, and numbered as
      HEUR-SNOVA-3a1583-1 - that the measured trend does not reverse - and it is
      explicitly NOT used to attach a security level to any parameter set.
    correspondence: null
  tail_checks:
    - >-
      Report the per-cell cost distribution, not only the median, and flag any cell
      whose interquartile range exceeds the measured effect, since a ratio read off
      overlapping distributions is not a reading.
    - >-
      Report the slowest and fastest instance per cell explicitly; a bimodal cost
      distribution means the cell contains two instance populations and the ratio
      is an average of two different experiments.
    - >-
      Report the number of instances on which each attack failed to terminate
      inside the per-run budget, separately from those on which it terminated
      without success. A timeout is censored data and is never scored as a failure
      of the attack (AGENTS.md rule 5).
    - >-
      Report the ratio computed in each cost unit side by side; disagreement
      between the units is a first-class finding about the implementation.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 20
    repeat_count: 3
    note: >-
      20 independent instances per cell per seed stream, three seed streams. The
      instance count is set by the discrimination requirement, not by convenience -
      it must separate a ratio of 0.5 from a ratio of 1.0 given the measured
      per-cell dispersion, and if the observed dispersion makes that impossible the
      correct report is INCONCLUSIVE with the required instance count computed.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8.0
    memory_gb: 8
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
    - >-
      Stop and void the run if the positive control is below 1.0 at any included
      toy size.
    - >-
      Stop growing the ladder at the largest size where all three attacks terminate
      inside wall_clock_seconds_per_run on every instance of a pilot cell.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop and is never a negative result (AGENTS.md rule 5).
    - >-
      The decision threshold, the matching rule, the toy ladder and the instance
      count are frozen before instance generation and are not revised after any
      cost is observed.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run whose null arm or positive control was not executed in the same
      invocation as the signal arm is invalid_measurement - the comparison the
      contract exists to make was not made.
    - >-
      A run in which the three attack families did not share one solver back end,
      or in which the instance pairs were not matched by the frozen rule, is
      invalid_measurement.
    - >-
      Any claimed key recovery whose certificate (the recovered key reproducing the
      public map, re-checked by the run wrapper and not by the attack code) fails
      independent re-verification makes the run completed_invalid
      (docs/claims-and-verification.md).
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment and requires a new contract; it is never a repair of this one.
  success_criterion: >-
    The structure-degeneracy gate passes at at least three toy sizes, the positive
    control reads 1.0 at every included size, the null arm shows no structure-attack
    advantage on structureless systems, and the run reports R_wedge and R_group_action
    with bootstrap intervals in both cost units at every included size together with
    the fitted trend slope and its confidence interval. The hypothesis H-SNOVA-3a1583
    is SUPPORTED at toy scale if and only if both ratios are >= 0.5 at every included
    size with intervals excluding 0.5 from below.
  falsification_criterion:
    - >-
      R_wedge or R_group_action is below 0.5 at the largest included toy size with
      its bootstrap interval excluding 0.5 from above, the structure gate passing
      and the positive control at 1.0. The coverage hypothesis is FALSIFIED at toy
      scale and the measured ratio is the recorded gap.
    - >-
      A structure attack achieves the same cost on the structureless null as on the
      real instances. It is not using the structure; its ratios are void and the
      run reports an instrument defect rather than a coverage verdict.
    - >-
      The positive control is below 1.0 at any included size. Nothing is reportable
      from any arm.
    - >-
      Both structures degenerate at every reachable toy size. The hypothesis is
      untestable on this ladder and the report is a coverage gap in the instrument.
    - >-
      The ratio differs by more than a factor 2 between the wall-clock unit and the
      operation-count unit. The measurement is dominated by implementation
      constants and no structural reading is licensed.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      raw-result.json carrying every per-instance measurement - cost in both units,
      success bit, peak memory, seed - and not summaries
    - the null arm's and the positive control's measurements, in the same file as the signal arm
    - the structure-degeneracy measurements per toy size, including excluded sizes
    - the frozen matching rule and toy ladder, written before instance generation and hashed
    - certificates for every claimed key recovery, re-verified by the wrapper
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is
      NOT approved; approved_by is null and execution_authorized is false. Approval
      is the user's gate because it authorizes execution and spends compute.
    - >-
      STAGE 0 must re-derive both structures from the SNOVA specification and freeze
      the matching rule before any implementation effort is authorized; a matching
      rule chosen after seeing a cost is a protocol amendment, not a design choice.
    - >-
      The parent proposal is a measurement, not a proof, so the KN-TECH-080
      proof_search_map gate does not bind; the baseline-reproduction discipline it
      encodes is carried instead by the positive control.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260801-016
    authored_at: '2026-08-25'
    note: >-
      Metrics, controls, thresholds and criteria are derived from the parent
      proposal's minimal_test, predictions and falsification_conditions. The 0.5
      threshold is the parent's own pre-registered figure and is not re-chosen here.
      Budgets come from the parent's declared estimated_cost (implementation medium,
      compute medium). No field is invented: a value the proposal did not supply is
      either null or is explicitly assigned to STAGE 0 to be fixed before approval.
  derivation_gaps:
    - >-
      The toy ladder is not numerically fixed here. The parent proposal names no
      sizes, and choosing them after seeing which sizes make the ratio look
      favourable is the single most likely way this contract would silently become a
      claim. They must be fixed at STAGE 0 by the termination criterion alone.
    - >-
      "The best-known attack" in each family is not pinned to a specific published
      algorithm in this environment, which cannot reach external literature. The
      contract therefore measures the best attack the Executor can IMPLEMENT from
      the specification, and every conclusion inherits that boundary explicitly.
    - >-
      The size-matching rule between a SNOVA instance and a plain-whipped-UOV
      instance is stated as a requirement, not as a formula. It is load-bearing for
      every ratio and must be written down and frozen before generation.
    - >-
      The solver-independent operation count needs its counting convention declared
      (which field operations are counted, and whether solver-internal operations
      are included), since the whole two-unit control depends on the convention
      being identical across families.
