experiment:
  id: EXP-FALCON-90e215
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-724cc9; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-724cc9
  question_id: RQ-FNDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Effective sample size of signature transcripts under deterministic versus randomized signing,
    inferred from statistic variance across replicates and compared against the coupon-collector saturation
    prediction.
  objective: 'The uncertainty a run reduces is how an adversary''s query budget converts into independent
    samples under the two signing modes, which is the factor every sample-count deliverable in this
    lane silently assumes to be one. In parts: (i) whether the effective-sample-size estimator is
    sound, evidenced by the randomized-mode null showing effective N equal to Q with no saturation
    at any M, by the large-M null showing the two modes agreeing when no collisions occur, and by
    the randomized arm''s variance-versus-N calibration curve fitting the inverse-N form; (ii) whether
    the deterministic mode''s effective sample size saturates at the message-space size M, staying
    within 15 percent of M for all Q above 5M; (iii) whether the measured effective sample size matches
    the coupon-collector prediction across the tested range, and at what Q the two modes first separate
    by more than 15 percent. A run does not reduce uncertainty about which mode any specification
    uses, about security, about fault or side-channel settings, or about deployed parameters, and
    no procedure stage produces such a quantity.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: for the toy sampler and bases built
      in this run, at d in {8, 16, 32}, sigma = 2.0, message-space sizes M in {10^2, 10^3, 10^4, 10^5}
      and query budgets Q from 10 to 10^6, the effective sample size under each signing mode takes
      the reported values with the reported intervals, and its ratio to the coupon-collector prediction
      is as reported. WHAT DOES NOT FOLLOW: no comparison of the two modes'' security; nothing about
      fault or side-channel adversaries, who are outside the transcript-only model used here; nothing
      about real message distributions, which are not uniform; nothing about which mode any implementation
      or specification uses; nothing about FN-DSA parameter sets; and no attack. A conversion factor
      from queries to samples multiplies a sample-count deliverable and does not by itself make any
      deliverable attainable or unattainable.'
  inputs:
    procedure: 'STAGE 0, cost under one hour: freeze the statistic, both tape-derivation rules, the
      message-space sizes, the query grid, the replicate count and the inference formula. STAGE 1,
      cost about half a day: implement both signing modes over one sampler, verifying they differ
      only in tape derivation by checking that a fixed tape produces identical signatures in both.
      STAGE 2, cost about an hour: measure the randomized arm''s variance-versus-N calibration curve
      at N in {10, 30, 100, 300, 1000, 3000, 10^4} with 200 replicates each, and fit the inverse-N
      form; HALT IF THE FIT FAILS. STAGE 3, cost minutes: run the large-M null with M above the maximum
      Q under both modes. STAGE 4, cost about a day: run the deterministic and randomized arms at
      M in {10^2, 10^3, 10^4, 10^5} crossed with Q in {10, 30, 100, 300, 10^3, 10^4, 10^5, 10^6},
      200 replicates per cell, five keys, at d in {8, 16, 32}. STAGE 5, cost under an hour: infer
      effective sample size per cell, compare against the coupon-collector prediction and against
      the directly observed distinct-message count, and report all ratios with intervals.'
    instrument: Pure Python 3 at native double precision for the toy sampler, since this entry has
      no precision content. Deterministic tape derivation uses hashlib SHA-256 in counter mode over
      the message and a fixed key-dependent value; randomized derivation uses the standard library
      secrets module. numpy for the variance estimates across replicates and for the inverse-N calibration
      fit. Distinct-message counting via a Python set. Run manifests through harness/runner.py. No
      Sage, no external computer algebra, no network.
    parameters: Dimensions d in {8, 16, 32}. Width sigma = 2.0. Message-space sizes M in {10^2, 10^3,
      10^4, 10^5}, uniform. Query budgets Q in {10, 30, 100, 300, 10^3, 10^4, 10^5, 10^6}. Replicates
      per cell 200. Keys per cell 5. Two modes. Calibration curve at N in {10, 30, 100, 300, 10^3,
      3000, 10^4} with 200 replicates. Large-M null at M = 10^7 with Q up to 10^6. Total signatures
      generated is dominated by the largest cells and is of order 10^9 across the full grid, which
      is why the minimal test design exists and is run first.
  controls:
  - Randomized-mode null through the identical estimator, must show no saturation at any M.
  - Large-M null with M above the maximum Q, where both modes must agree because no collisions occur.
  - 'Calibration control: the randomized arm''s variance-versus-N curve is measured rather than assumed,
    and its fit residuals are reported.'
  - 'Replicate control: 200 independent transcript replicates per cell, with the across-replicate
    variance itself reported so the estimator''s own noise is visible.'
  - Key-resampling control across five keys, since the transcript-process effect must not depend on
    the key.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null arm is the RANDOMIZED mode run through the identical effective-sample-size
    estimator at the identical M and Q. The null must show effective sample size equal to Q with no
    saturation at any M, since under randomized signing the message space cannot bind. If the null
    saturates, the estimator is measuring something about the message distribution rather than about
    the transcript process and every deterministic-arm reading is void. A second null runs the deterministic
    mode with M set larger than the maximum Q, where the two modes must agree because no collision
    occurs, giving a direct within-experiment check that the modes differ only through collisions.'
  independent_variables:
  - signing mode, deterministic versus randomized
  - message-space size M
  - query budget Q
  - lattice dimension d
  - key index
  metrics:
    primary:
    - variance of the frozen statistic across replicates per cell
    - inferred effective sample size with confidence interval
    - ratio of inferred effective sample size to the coupon-collector prediction
    - Q at which the two modes first differ by more than 15 percent
    secondary:
    - directly observed distinct-message count per transcript
    - residuals of the inverse-N calibration fit
    - across-key variance of the inferred effective sample size
    - wall-clock per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The effective sample size of a transcript of Q queries under deterministic signing against
      a uniform message space of size M.
    formula: EffectiveN(Q, M) = M * (1 - exp(-Q / M)) under deterministic signing, and EffectiveN(Q,
      M) = Q under randomized signing. Effective sample size is inferred from the measured variance
      V of the frozen statistic across replicates by inverting the randomized arm's calibration curve
      V(N) = A / N, with A fitted in STAGE 2 and held fixed thereafter, so every deterministic cell
      is a prediction rather than a fit.
    source: Pre-registered in the parent proposal IDEA-20260816-724cc9 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at d in {8, 16, 32} against a deployed dimension of 1024 or 2048, at sigma
      = 2.0 against a deployed sigma of order 165, and at message-space sizes chosen for measurability
      rather than realism. TRANSFER ASSUMPTION, STATED: the coupon-collector saturation is a property
      of the query process and not of the lattice, so if it holds it holds independently of dimension,
      and the contract tests that dimension-independence directly by sweeping d over a factor of four.
      Nothing else transfers, and no deployed-parameter number is produced.'
    correspondence: null
  tail_checks:
  - Report the directly observed distinct-message count next to every inferred effective sample size
    and flag disagreements above 15 percent.
  - Report the calibration fit residuals and flag any N where the inverse-N form fails.
  - Report across-key variance and flag cells where one key dominates.
  - Check the largest Q cells for hash-collision effects in the tape derivation, which would couple
    distinct messages and is a distinct failure mode from message repetition.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt at STAGE 2 and report instrument failure if the inverse-N calibration fit fails.
  - Halt any cell whose replicate variance estimate has a relative standard error above 25 percent
    and report it as unresolved rather than reporting a point value.
  - Cap the grid at Q = 10^6 and report saturation behaviour at the achieved budget rather than extrapolating
    the curve.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both nulls pass, the calibration curve fits the inverse-N form, and the inferred
    effective sample size in every deterministic cell is estimated with a relative confidence half-width
    below 15 percent, whatever its relation to the prediction turns out to be.
  falsification_criterion:
  - Randomized-mode null saturating at any M.
  - Large-M null showing the modes differing when no collisions occur.
  - Inferred effective sample size differing from the coupon-collector prediction by more than 15
    percent across the tested range.
  - Inferred effective sample size disagreeing with the observed distinct-message count by more than
    15 percent.
  - Inverse-N calibration fit failing.
  - The two modes agreeing at all Q at M = 10^2, falsifying the structural distinction entirely.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-724cc9
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The frozen statistic is referred to but not named, and the inference of effective sample size
    from its variance depends on it having variance proportional to one over N, which must be checked
    for the chosen statistic before freezing.
  - The uniform message space is a stand-in for a real message distribution, and how a Coordinator
    should let other records use the correction without specifying a message distribution is unresolved.
  - Whether hash collisions in the deterministic tape derivation are a relevant second mechanism at
    the largest Q is flagged but not analysed.
  - The record does not state how the correction should compose with the anytime-valid stopping framework
    of IDEA-20260813-76dcbd, and the two clearly interact.
