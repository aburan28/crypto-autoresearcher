# =============================================================================
# EXP-BINSTD-ce4668 -- VERSION 1 (APPROVED by DEC-20261003-d10361) frozen
# contract for H-BINSTD-533de4: poly vs normal usable_dimensions basis-swap
# (Stages 0-1). Source: IDEA-20261001-880180 under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001. ZERO RUNS. No AUXIN. No Bedrock. NO break / exponent.
# =============================================================================
experiment:
  id: EXP-BINSTD-ce4668
  hypothesis_id: H-BINSTD-533de4
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-880180
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Matched-dim poly vs normal usable_dimensions basis-swap meter at toy
    n=17 (≥20 pairs) with Stage-0 freeze and shuffle-null control
  status: approved
  approved_by: DEC-20261003-d10361
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-d10361 under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    ECC2K-130 solve. No n>=131 attack. Stage 2 (n=23,31) not authorized.
  approval:
    approved_by: DEC-20261003-d10361
    composing_decision: DEC-20261003-d10361
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes pair plan, Part-1 census, predicate pin, predictions.
      Stage 1 runs n=17 median + shuffle null; writes RESULTS.md with exactly
      one O-* label. No Magma/Sage. No AUXIN. No Bedrock.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether matched-dim poly vs normal usable_dimensions readouts
    diverge (median abs diff ≥ 1) or are equivalent (median 0) at n=17;
    deliver exactly one O-* label from H-BINSTD-533de4.

  class: heuristic_validation
  class_note: >-
    Instrument / heuristic-validation meter of a Part-1 predicate under
    ambient-basis swap. Not an exponent-moving breakthrough; no ECDLP attack.

  scope:
    included:
      - Stage 0 freeze of pair plan, Part-1 census, predicate pin, predictions.
      - Stage 1 n=17 median + shuffle null + RESULTS.md with one O-* label.
    excluded:
      - Any ECDLP solve at n >= 131 or on ECC2K-130.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Stage-2 panels at n=23,31 under this card.
      - Editing IDEA-20261001-880180 claim text or GOAL-ECDLP2M-001.yaml.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-BINSTD-ce4668/trial-plan-v1.json
    command_stage0: >-
      python3 experiments/EXP-BINSTD-ce4668/implementation/run.py --stage 0
      --trial-plan experiments/EXP-BINSTD-ce4668/trial-plan-v1.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-BINSTD-ce4668/implementation/run.py --stage 1
      --trial-plan experiments/EXP-BINSTD-ce4668/trial-plan-v1.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan.

  inputs:
    toy_n: [17, 23, 31]
    stage1_n: 17
    min_pairs: 20
    seed: 20261003880180
    source_idea: ledger/proposals/IDEA-20261001-880180.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-533de4.yaml
    part1_reference: experiments/EXP-BINSTD-178742/implementation/typed/part1_surface.py

  controls:
    - name: ctl_matched_dimension_pairs
      definition: Every pair has dim(V_poly)=dim(V_normal)=ℓ in the dim band.
    - name: ctl_predicate_code_hash_pin
      definition: Stage-0 predicate-pin.json must match live source at Stage 1.
    - name: null_shuffle_pair_labels
      definition: >-
        Shuffle normal readouts against poly; shuffle median must be <
        observed when observed ≥ 1.
    - name: ctl_identical_embedding_repeatability
      definition: Deterministic under frozen seed; re-run Stage 1 reproduces medians.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_n17_median]
    - name: ambient_basis
      levels: [polynomial, normal]

  metrics:
    primary:
      - name: median_abs_diff_usable_dimensions_poly_vs_normal
        unit: dimensionless
        definition: median_i |usable_card(V_poly_i) − usable_card(V_normal_i)| on ≥20 pairs.
      - name: null_shuffle_median
        unit: dimensionless
        definition: Median abs diff after shuffling normal readouts.
    secondary:
      - name: pair_count
        unit: integer
        definition: Number of matched pairs scored at Stage 1.
      - name: histogram_abs_diff
        unit: map
        definition: Multiset of per-pair abs diffs.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS if available (secondary).

  heuristic_under_test: HEUR-BINSTD-880180-H1

  preregistered_prediction:
    quantity: >-
      median_abs_diff ≥ 1 (O-DIVERGE) or = 0 (O-EQUIVALENT) at n=17;
      shuffle null gates diverge.
    formula: >-
      usable_card(V)=|U(n)| if τ-stable and dim(V)∈U(n) else 0;
      U(n)=stable_dims(ord_n(2)) \\ {0,1,n-1,n}.
    source: >-
      ledger/proposals/IDEA-20261001-880180.yaml HEUR-BINSTD-880180-H1;
      frozen before Stage 1 in stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      F_2 linear algebra at n=17 only under Stages 0-1. No transfer to
      n≥131 or any attack table is claimed.
    correspondence: null

  measured_vs_modeled:
    measured:
      - median_abs_diff_usable_dimensions_poly_vs_normal
      - null_shuffle_median
      - pair_count
    modeled: []
    note: All Stage-1 primary numbers are measured under the frozen driver.

  optimistic_assumptions_disclosed:
    - assumption: Geometric-progression spans are a fair default V family (KR-IC-73db3f).
      bias_direction: >-
        May understate divergence for other V families; may overstate if GP
        spans are atypical under normal coords.

  memory_accounting:
    dominant_structure: n×n bit matrices / generator lists at n≤31
    analytic_peak: O(n^2) bits
    measured_peak_rss_bytes: null
    note: Peak RSS is secondary; not required to decide O-*.

  tail_checks:
    - Shuffle median ≥ observed median when observed ≥ 1 voids O-DIVERGE (O-ARTIFACT).
    - Predicate pin mismatch voids median claims (O-ARTIFACT).

  replication:
    seeds: [20261003880180]
    independent_instances: 1
    note: >-
      Stage-1 n=17 panel is the authorized instance. Deterministic under seed.
      Stage 2 would add n=23,31 as independent instances (not authorized).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.0
    maximum_memory_gb: 1
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen stage0/*.json artifacts.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-BINSTD-533de4.
    - maximum_runs = 3.
    - Do not open Stage 2 under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Predicate pin drift → O-ARTIFACT; do not read median as support.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Claiming PDP/exponent from a diverge label → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with Part-1 census ok and predicate pin present;
    Stage 1 produces median_abs_diff and shuffle_median on ≥20 pairs (or a
    named O-ARTIFACT/O-IMPEDIMENT stop); RESULTS.md names exactly one O-*
    label from H-BINSTD-533de4 with cited artifacts.

  falsification_criterion: >-
    Any of: predicate pin drift; shuffle-null failure on a claimed diverge;
    a claimed break/exponent under this card. (O-EQUIVALENT is a valid
    scientific negative of O-DIVERGE, not a protocol fail.)

  required_artifacts:
    - experiments/EXP-BINSTD-ce4668/trial-plan-v1.json
    - experiments/EXP-BINSTD-ce4668/stage0/frozen-pair-plan.json
    - experiments/EXP-BINSTD-ce4668/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-ce4668/stage0/part1-census.json
    - experiments/EXP-BINSTD-ce4668/stage0/predicate-pin.json
    - experiments/EXP-BINSTD-ce4668/stage1/
    - experiments/EXP-BINSTD-ce4668/RESULTS.md
    - experiments/EXP-BINSTD-ce4668/runs/<RUN-BINSTD-*>/
    - experiments/EXP-BINSTD-ce4668/implementation/run.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
