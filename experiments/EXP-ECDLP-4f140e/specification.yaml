# EXP-ECDLP-4f140e
# Degree-gap arithmetic. No intersection is computed.
# Approved by DEC-20261003-35491c.
experiment:
  id: EXP-ECDLP-4f140e
  hypothesis_id: H-ECDLP-4ffc11
  source_idea: IDEA-20261003-50974e
  question_id: RQ-ECDLP-623a32
  version: 1
  title: Curve degree versus line degree
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-35491c
  objective: >-
    Check the degree gap 2, the product 3, and the nearby gap 0.
  inputs:
    curve_degree: 3
    line_degree: 1
    degree_gap: 2
    degree_product: 3
    degree_sum: 4
    nearby_a: 1
    nearby_b: 1
    nearby_gap: 0
    nearby_product: 1
  controls:
    - >-
      A short-Weierstrass equation has degree 3. A line has degree
      1. Reporting the line as degree 3 drops the gap and
      invalidates the run.
    - >-
      Three exceeds one by 2. The product of the two degrees is 3.
      Their sum is 4.
    - >-
      Two lines each have degree 1. Their gap is 0 and their
      product is 1.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {read, subtract}
  metrics:
    primary:
      - degree_gap
      - degree_product
      - nearby_gap
      - implementations_agree
    secondary:
      - degree_sum
      - nearby_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      3 exceeds 1 by 2. The product of 3 and 1 is 3. The gap of
      two line degrees is 0.
    formula: >-
      Subtract 1 from 3. Multiply 3 by 1. Add 3 and 1. Subtract
      1 from 1. Multiply 1 by 1.
    source: >-
      IDEA-20261003-50974e states the degrees 3 and 1, read
      2026-10-03. The gap, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No intersection was computed.
  scale_relevance:
    tier: toy
    justification: Two written degrees. No transfer to an intersection.
    correspondence: null
  tail_checks:
    - The product 3 and the nearby gap 0 are required. A check that stops at the gap 2 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the gap 2 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The curve degree is not 3.
    - The line degree is not 1.
    - The gap is not 2.
    - The product is not 3.
    - The line is reported as degree 3, or an intersection is computed.
  success_criterion: >-
    Both runs agree that the curve degree is 3, that the line
    degree is 1, that 3 exceeds 1 by 2, and that the product is 3.
  falsification_criterion: >-
    The runs agree that the curve degree is computed, and that
    degree is not 3.
  required_artifacts:
    - experiments/EXP-ECDLP-4f140e/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-4f140e/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-4f140e/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-4f140e/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-4f140e/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-4f140e/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any intersection or scalar recovery.
    - Any claim that a degree gap of 2 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
