experiment:
  id: EXP-ECDLP-0d1336
  hypothesis_id: H-ECDLP-38f4b4
  version: 1
  title: >
    Exact D_NS Macaulay-rank calibrator on a
    frozen one-variable Boolean ring
  status: approved
  approved_by: coordinator
  approved_at: '2026-09-08'
  approval_decision: DEC-20260908-e7451f
  approval_basis: >
    Standing user authorization recorded in AGENTS.md on
    2026-09-06 (ideas and experiments always approved once
    the protocol is complete). Coordinator completeness
    check is DEC-20260908-e7451f after TASK-20260908-0bc285.
    User confirmation is not an outstanding gate.
  frozen: true
  frozen_at: '2026-09-08'
  execution_authorized: true
  execution_authorized_note: >
    Stage 0 only. Stages 1 and later remain unauthorized
    until an independent review of the Stage 0 instrument
    holds and a later Coordinator decision extends
    execution_authorized_stages. This approval does not
    authorize Stage 1 of EXP-ECDLP-1aa0f8, does not
    authorize Stage 1 of EXP-ECDLP-79f8c4, does not
    authorize Stage 1 of EXP-ECDLP-628891, does not
    authorize Stage 1 of EXP-ECDLP-9e9536, does not
    authorize Stage 1 of EXP-ECDLP-90f602, does not
    authorize Stage 2 of EXP-ECDLP-4be480, does not
    authorize Stage 2 of EXP-ECDLP-6a97f4, does not
    authorize Stage 17 of EXP-ECDLP-420e73, does not
    authorize Stage 5 of EXP-ECDLP-a98ea9, does not
    classify W, and does not change H-ECDLP-a23318,
    H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d,
    H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb,
    H-ECDLP-77caa5, H-ECDLP-07c7c6, H-ECDLP-2ade73,
    or H-ECDLP-a3598b.
  execution_authorized_stages: [0]
  execution_authorized_decision: DEC-20260908-e7451f
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260908-0bc285
  source_proposal: IDEA-20260905-a6f98e
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-e7451f under the standing 2026-09-06
    user authorization. Stage 0 is the exact D_NS
    calibrator. Cadical, LRAT, and the proposal's
    l-ladder are a later stage and are not run here.

  objective: >
    Compute brute-force Nullstellensatz degree
    on one frozen family (REAL, KF, NULL)
    and decide whether the enumerative D_NS
    calibrator works. Stage 0 does not run
    cadical, does not emit LRAT, does not
    reuse peel_and_rank, and does not
    authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL has D_NS
      equal to 1; KF has dns_found false
      at Dmax 3; NULL has D_NS equal to 0;
      empty and negative-Dmax objects rejected.
      Certificate kind none.
    formula: >
      Boolean ring GF(2)[x]/(x^2-x). REAL
      is the generators x and 1+x. KF is
      the generator x. NULL is the constant
      1. D_NS is the least D at which 1
      lies in the degree-D Macaulay row
      space. FORCED Stage 0: fixture_pass,
      real_dns_pass, known_false_sat_pass,
      reject_invalid_pass, null_constant_pass
      all true.
    source: >
      ledger/proposals/IDEA-20260905-a6f98e.yaml
      proof_search_map.baseline_embedding and
      method_ceiling.nearby_object_control.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_cadical: >
    IDEA-20260905-a6f98e also flags cadical
    LRAT length versus leaf count, and names
    a pdp ladder at l in 3..8. Stage 0 does
    not run cadical, does not emit LRAT, does
    not run kissat, and does not claim the
    Trimoska pdp encoder. The l-ladder and
    clausal certificate are Stage 1+ objects.
    Certificate-two (exact D_NS) is the only
    Stage 0 arm. This is a disclosed
    tightening, not a silent change of the
    idea's claim.

  inputs:
    fixture:
      variables: [x]
      dmax: 3
      ring: boolean_gf2
      real:
        id: REAL
        generators:
          - [x]
          - [1, x]
        must_dns: 1
        must_found: true
        role: real_unsat
      known_false:
        id: KF
        generators:
          - [x]
        must_found: false
        role: known_false_sat_monomial
      matched_null:
        id: NULL
        generators:
          - [1]
        must_dns: 0
        must_found: true
        role: matched_null_constant
      invalid:
        - id: VARS-empty
          variables: []
          must_reject: true
        - id: DMAX-negative
          dmax: -1
          must_reject: true
      working_model: >
        Exact GF(2) Macaulay rank of D_NS
        on a frozen one-variable Boolean ring.
        Not cadical. Not LRAT. Not kissat.
        Not peel_and_rank of EXP-DREG-001.
        Not the Trimoska encoder.
      do_not_hunt_a_new_polynomial: true

  independent_variables:
    - object in the frozen family
    - presence of the 1+x generator

  null_object:
    name: KF SAT monomial x
    construction: >
      Generator x on the one-variable Boolean
      ring. dns_found false at Dmax 3. This
      is the known-false object for a
      "every 1-variable system has a
      Nullstellensatz certificate" reading.
    non_degeneracy_check: >
      known_false_sat_pass must be true
      before any REAL D_NS is read as a
      measurement.
    dynamic_range_demonstration: >
      VARS-empty and DMAX-negative must be
      rejected before D_NS is read as a
      census.

  controls:
    - KF dns_found false (known-false / proves-too-much)
    - REAL D_NS equal to 1
    - NULL D_NS equal to 0
    - empty and negative-Dmax rejection
    - exact discrete rank, no sampling
    - generators frozen before any rank is read

  metrics:
    primary:
      - fixture_pass boolean
      - real_dns_pass boolean
      - known_false_sat_pass boolean
      - reject_invalid_pass boolean
      - null_constant_pass boolean
    secondary:
      - REAL D_NS / found
      - KF D_NS / found
      - NULL D_NS / found
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      One one-variable Boolean ring. No
      transfer to cadical, a pdp encoder,
      LRAT proofs, or cryptographic n.
    correspondence: null

  tail_checks:
    - REAL generators are the frozen pair x and 1+x
    - KF is the frozen generator x
    - NULL is the frozen constant 1
    - VARS-empty and DMAX-negative are rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_dns_pass, known_false_sat_pass,
      reject_invalid_pass, and null_constant_pass.
      A miss classifies the run failed_infrastructure
      if it is a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-DNS.
    - Stages 1 and later are not authorized.
    - Do not hunt a new polynomial.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the one-variable generators after this freeze
    - Hunting a new polynomial because a frozen cell fails
    - Reading Stage 0 as cadical, LRAT, kissat, peel_and_rank, a pdp encoder, or a decoder
    - Reading Stage 0 as an ECDLP advantage
    - Authorizing Stage 1 of EXP-ECDLP-1aa0f8 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-79f8c4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-628891 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-9e9536 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-90f602 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_dns_pass,
    known_false_sat_pass,
    reject_invalid_pass, and null_constant_pass
    are true, and the run manifest carries
    certificate.kind none. Success is
    instrument reproduction, not an LRAT
    claim and not an attack.

  falsification_criterion: >
    A certified KF miss of dns_found false
    after fixture_pass is a scoped miss of
    P-S0-DNS. A certified REAL D_NS other
    than 1 after fixture_pass is a scoped
    miss of P-S0-DNS. Infrastructure bugs
    are not mathematics. Stage 0 does not
    test P-S1-LRAT.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - One one-variable toy Boolean ring.
    - Not cadical. Not LRAT. Not kissat.
    - Not the Trimoska pdp encoder.
    - Not peel_and_rank of EXP-DREG-001.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 1aa0f8. No Stage 1 of 79f8c4.
      No Stage 1 of 628891. No Stage 1 of 9e9536.
      No Stage 1 of 90f602. No Stage 2 of 4be480.
      No Stage 2 of 6a97f4. No Stage 17 of 420e73.
      No Stage 5 of a98ea9.
    - Certificate kind none. No solve or attack.
    - W is not classified.
    - EXP-ECDLP-a5f766 remains another lane.
    - Do not hunt a new polynomial.
