experiment:
  id: EXP-XEDN-004
  hypothesis_id: H-XEDN-003
  version: 1
  title: >-
    Non-isotrivial free-x MW relation-coefficient census (a≠0, j non-constant)
  status: approved
  objective: >-
    Measure max_|coeff| of the shortest group-law-verified Mordell-Weil relation
    among free-x integral sections on non-isotrivial surfaces
    y^2 = x^3 + a(t)x + b(t) (a≠0, deg a≤2, deg b=6, j non-constant) at
    p∈{7,13,19,31}, and compare the trend vs log p to the μ₃-saturated
    isotrivial baseline of EXP-XEDN-003.
  inputs:
    primes: [7, 13, 19, 31]
    family:
      form: "y^2 = x^3 + a(t) x + b(t)"
      deg_a_max: 2
      deg_b: 6
      a_nonzero: true
      j_nonconstant_required: true
    section_shape:
      deg_x_max: 2
      deg_y_max: 3
      exclude_y_zero: true
    square_predicate: >-
      Prefer the frozen EXP-XEDN-001 is_square_poly on f = x^3 + a*x + b when
      applicable; record the exact predicate and any Sage-side square-root
      scaling (s with s^2 = leading content) needed for on-curve points
      (EXP-XEDN-003 lesson).
    eligibility:
      - a ≠ 0
      - j non-constant
      - discriminant polynomial 4a^3+27b^2 not identically zero
      - ≥2 free-x slots required for trend (≥4 preferred when available)
    relation_verification:
      method: specialisation to O at ≥20 distinct smooth fibres
      primary_metric: infinity-norm of shortest nonzero integer relation
    height_diagnostic:
      optional: true
      note: >-
        Polarisation Gram ranks are diagnostic only; do not treat them as
        geometric MW ranks without local corrections (VAL-XEDN-003-01).
  controls:
    - >-
      Isotrivial negative control: a=0 surfaces must be excluded from the
      primary trend (may be logged as out-of-scope probes only).
    - >-
      μ₃ absence control: fraction of eligible surfaces admitting a verified
      orbit sum S+wS+w²S=O must be near 0 (or undefined if ω∉F_p).
    - >-
      Planted / synthetic relation control: a known short relation among
      constructed sections must be recovered with correct coefficients.
    - >-
      Height sanity (optional): for a section S with x-coordinate of degree 2,
      deg(num x(nS)) behaves as expected under duplication when computed.
  independent_variables:
    - p
    - surface (a,b) within the frozen degree window
  metrics:
    primary:
      - max_abs_coeff_shortest_relation_by_p
      - slope_max_abs_coeff_vs_log_p
      - n_eligible_surfaces_by_p
      - n_surfaces_with_verified_relation_by_p
    secondary:
      - mu3_orbit_relation_fraction
      - polarisation_gram_rank_histogram
      - section_count_histogram
  replication:
    seeds: [2026072501, 2026072502]
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 6
  stopping_rules:
    - >-
      Stop a size after ≥10 eligible surfaces with verified relations, or after
      exhausting the deterministic enumeration budget for that p.
    - Hard wall-clock stop at budget; partial results remain valid if gates hold.
  invalidation_rules:
    - Surfaces with a=0 or constant j counted as eligible → invalid trend.
    - Relations without specialisation verification → invalid for primary metric.
    - Timeout/crash → failed_infrastructure, not mathematical evidence.
  success_criterion: >-
    max_|coeff|(p) ∈ {1,2,3} at every tested p and slope vs log p has uncertainty
    including 0; μ₃-orbit fraction near 0 confirms the isotrivial mechanism was
    removed.
  falsification_criterion: >-
    Slope vs log p excludes 0, OR any verified shortest relation has
    infinity-norm ≥ 4 on an eligible surface.
  required_artifacts:
    - experiments/EXP-XEDN-004/runs/*/manifest.yaml
    - experiments/EXP-XEDN-004/runs/*/results.json
    - experiments/EXP-XEDN-004/runs/*/stdout.log
    - experiments/EXP-XEDN-004/execution_report.md
  assigned_to: executor
  approved_by: coordinator
