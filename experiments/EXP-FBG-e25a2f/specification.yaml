experiment:
  id: EXP-FBG-e25a2f
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f50ee4; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f50ee4
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Zero-compute classification battery: encode a four-generator factor-base description grammar,
    evaluate a syntactic COVERED predicate on six frozen geometries, five hand-built escape witnesses
    and a 200-term random-description null, in one invocation'
  objective: 'The one uncertainty a run reduces is whether the scoped obstruction this program already
    owns can be applied to a new factor-base description without any compute and without a curve.
    Stated in parts: (i) EXPRESSIVENESS - can the four-generator grammar write down the six geometries
    whose exact yield and coverage the frozen battery recorded, and can it write down at least one
    term per named escape category, or does it fail on some geometry the program has already measured;
    (ii) DECIDABILITY - can each hypothesis of the bounded-degree derivation be rendered as a test
    on the term alone, so that COVERED is a pure function of syntax, or does some hypothesis require
    evaluating a curve, in which case the instrument does not exist and the run reports that; (iii)
    SEPARATION - does COVERED actually separate anything, measured by whether a 200-term random matched-depth
    null is classified COVERED at high rate while the hand-built escape witnesses are routed away
    from it, since a predicate that covers everything or nothing carries no information. A run cannot
    reduce uncertainty about whether the universal no-go of KN-OPEN-020 is true, about whether any
    escape is reachable, or about how any geometry performs, and the contract does not attempt those.
    The deliverable is a table and a defect list. If the defect list is long, the run has still reduced
    uncertainty (ii), which is the cheapest of the three to be wrong about and the most expensive
    to be wrong about silently.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: over the stated
      four-generator grammar, at the depths used, COVERED is or is not a pure syntactic function;
      the six frozen geometries are or are not expressible; the 200-term seeded random null is classified
      COVERED at a stated rate with a stated binomial confidence interval; and each of the five escape
      categories is recorded as witnessed, reduced with a stated Delta blow-up, or unwitnessed. WHAT
      DOES NOT FOLLOW: nothing about whether the universal algebraic-factor-base no-go is true or
      false; nothing about whether any escape category can be realized by a constructible factor base;
      nothing about the yield, coverage, relation rate or index-calculus cost of any geometry, classified
      or not; nothing about whether index calculus beats rho over prime fields; and no claim of an
      attack, a break, a speedup or a security consequence. A COVERED verdict is a statement about
      the reach of one existing derivation and is not evidence about mathematics outside that derivation''s
      stated hypotheses.'
  inputs:
    procedure: 'STAGE 0, transcription (cost: 2 human hours, no compute). Read the frozen bounded-degree
      artifact and write each hypothesis verbatim into a table next to the syntactic test proposed
      for it, with a flag for any hypothesis that resists syntactic rendering. STAGE 1, grammar (cost:
      1 hour, no compute). Implement the four generators as Python dataclasses with fields degree,
      components, coordinate, ambient, membership_cost. STAGE 2, encoding (cost: 2 hours). Encode
      the six frozen geometries, twice each under independent encodings, plus five escape witnesses,
      plus one degenerate full-x-line term. STAGE 3, predicate (cost: 1 hour). Implement COVERED as
      a pure function; it must not import any curve code, enforced by a test that the module has no
      dependency on harness/toycurve.py. STAGE 4, null (cost: minutes of compute). Sample 200 matched-depth
      terms under a recorded seed and run the identical COVERED function in the same process as STAGE
      2''s terms. STAGE 5, calibration (cost: 1 hour). Join verdicts against the recorded exact numbers
      from the frozen evidence record and list every disagreement with its reading. STAGE 6, report
      (cost: 1 hour). Emit the table, the defect list, the per-escape status, and the null rate with
      its interval.'
    instrument: 'Python 3 standard library only, in a single module under the scratchpad; dataclasses
      for the grammar, random with a recorded seed for the null sample, and a unit test asserting
      that the predicate module imports nothing from harness/. Deliberately no numpy, no sympy, no
      Sage, and no curve arithmetic: the point of the contract is that the predicate is evaluable
      without a curve, so importing harness/toycurve.py would falsify the design rather than support
      it.'
    parameters: 'Grammar generators: 4. Grammar depth for sampling: matched to the maximum depth used
      by any frozen-geometry encoding, expected 2 or 3. Frozen geometries encoded: 6, each under 2
      independent encodings, giving 12 signal terms. Escape witnesses: 5, one per named escape category.
      Degenerate control terms: 1. Random null sample: 200 terms at matched depth, single recorded
      seed, plus 4 replicate seeds of 200 for a stability check, total 1000 null terms. Locus degree
      range sampled: 1 to 6. Component count sampled: 1 to 4. No field size, no curve, no base size
      B and no arity m appear anywhere in this contract.'
  controls:
  - Random matched-depth grammar terms, 200 of them, run through the identical COVERED function in
    the same invocation as the signal terms.
  - The six EV-FBG-001 geometries as ground-truth calibration terms with their recorded exact numbers
    attached.
  - A deliberately degenerate term - the full x-line, which is not a proper locus - which must fail
    the properness conjunct; a classifier that calls it COVERED is broken.
  - Seed-fixed sampling with the seed recorded, so the null arm is reproducible bit-for-bit.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a RANDOM TERM of the same grammar depth: sample
    a description uniformly from the grammar at matched degree budget and matched component count,
    and run the identical COVERED procedure on it. Because a random low-degree locus is exactly the
    generic case the bounded-degree derivation was written for, the null must be classified COVERED
    at a rate near 1. For the signal arm to mean anything, the classifier must (i) classify at least
    90 percent of random matched-depth terms as COVERED, and (ii) route at least one hand-built escape
    witness away from COVERED. A classifier that routes random terms into escapes is detecting its
    own looseness, not structure, and the run is recorded as a controlled null. Second null: the six
    EV-FBG-001 geometries, whose measured exact numbers are known, so a classifier verdict can be
    checked against ground truth rather than against itself.'
  independent_variables:
  - grammar term (frozen geometry, escape witness, degenerate control, or random null draw)
  - encoding choice among the two independent encodings of each frozen geometry
  - locus degree and component count of the sampled term
  - null replicate seed
  metrics:
    primary:
    - COVERED verdict per term
    - escape clause number for each term routed away from COVERED
    - expressibility flag per frozen geometry
    - COVERED rate over the 200-term null with binomial confidence interval
    - 'encoding-agreement rate: fraction of frozen geometries whose two encodings give the same verdict'
    secondary:
    - number of grammar generators exercised by the frozen geometries
    - per-escape witness or reduction status with Delta blow-up factor
    - count of hypotheses flagged as resisting syntactic rendering in STAGE 0
    - null COVERED rate stability across the 5 replicate seeds
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The COVERED rate on the random matched-depth null, and the encoding-agreement rate on
      the frozen geometries.
    formula: Predicted null COVERED rate at least 0.90, defined as the count of sampled terms returning
      COVERED divided by 200, reported per seed with a Wilson interval. Predicted encoding-agreement
      rate exactly 1.0, defined as the count of frozen geometries whose two independent encodings
      return identical verdict and identical escape number, divided by 6; any value below 1.0 is a
      defect of the encoding discipline and is reported as such rather than averaged away.
    source: Pre-registered in the parent proposal IDEA-20260816-f50ee4 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The tested parameters are grammar terms at depth 2 to 3 with locus degrees 1 to
      6, and no curve, field or base size is involved. The transfer assumption is stated and is narrow:
      a verdict on a term transfers to every factor base that term describes ONLY insofar as the bounded-degree
      derivation''s hypotheses are correctly rendered, which STAGE 0 flags and does not prove. There
      is no extrapolation in the scale sense at all, because the classifier''s inputs do not carry
      a scale; the honest limitation is that calibration ground truth comes from a toy-scale battery
      at sizes near 2^14 to 2^18 with arity 3, so agreement with that battery says nothing about larger
      arity or cryptographic sizes.'
    correspondence: null
  tail_checks:
  - Terms at the maximum sampled locus degree 6 and maximum component count 4, where the properness
    and finite-intersection-degree conjuncts are closest to failing.
  - The degenerate full-x-line term, which must be routed away from COVERED on properness.
  - An empty-set term and a singleton term, both of which are edge cases the grammar admits and the
    derivation says nothing useful about.
  - A term whose membership_cost field is set to the cost of a discrete-logarithm computation, which
    must be routed to the implicit-membership escape rather than accepted.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report at STAGE 0 if two or more derivation hypotheses are flagged as resisting syntactic
    rendering; the instrument does not exist and continuing would produce a confident wrong classifier.
  - Stop and report at STAGE 2 if any frozen geometry cannot be encoded, naming the geometry and the
    generator it needs.
  - Total human budget 8 hours; if exceeded, emit whatever table exists with the unfinished stages
    marked incomplete rather than rushed.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: COVERED is implemented as a pure syntactic function with no curve dependency,
    at least 5 of the 6 frozen geometries are encodable under two independent encodings that agree,
    the 200-term random null is classified COVERED at a rate of at least 0.90 with the degenerate
    control routed away from COVERED, and each of the 5 escape categories carries an explicit status
    of witnessed, reduced with a stated blow-up, or unwitnessed.
  falsification_criterion:
  - A derivation hypothesis cannot be rendered syntactically, so the predicate is not decidable by
    inspection.
  - A frozen geometry is inexpressible in the grammar.
  - The random null COVERED rate falls below 0.90, indicating the predicate separates by looseness
    rather than by structure.
  - Two encodings of the same frozen geometry disagree, indicating the encoding is not well defined.
  - The degenerate full-x-line term is classified COVERED.
  - All 5 escape categories reduce to the bounded-degree case, indicating the grammar cannot represent
    the open part of the problem it was built for.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f50ee4
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - A Coordinator must decide whether reading the frozen bounded-degree artifact into syntactic tests
    counts as interpretation of an immutable record and, if so, how the interpretation is recorded
    so it can be superseded rather than overwritten.
  - The min-entropy-random-target hypothesis is a property of the target distribution and not of the
    base description; a Coordinator must decide whether COVERED carries it as a semantic side condition
    or whether terms are simply undefined outside random targets.
  - The Delta blow-up factor for each attempted escape reduction is not derived here and must be supplied
    or the reduction recorded as unattempted.
  - Whether the calibration arm may cite EV-FBG-001 numbers directly, given that its experiment record
    EXP-FB3-001 is not machine-parseable and is cited by path in that evidence record.
