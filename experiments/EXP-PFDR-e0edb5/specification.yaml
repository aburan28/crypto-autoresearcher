    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/gate_eval.py (the derivation-aid script: exact integer or rational arithmetic, standard library only, deterministic, no dependencies)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/tail-checks.yaml (the four declared tail checks)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/execution-report.md (stage-by-stage; success-criterion checklist (1)-(5); which of F1-F7 fired; per-file sha256; the determinism re-execution comparison; the inference block with requested policy, resolved model and fallback_used; the statement that zero runs occurred, no curve was sampled, no gate was adopted and no record was barred)'
  interpretation_limits:
    - >-
      A PASSED gate certifies the descent tree and the end-to-end
      arithmetic at three parameter sets. It does not certify the
      algorithm, does not verify any mathematical step, and is not a break.
    - >-
      A FAILED gate records that a claim is INCOMPLETE AS WRITTEN. It is
      not evidence that the claim is mathematically wrong and may never be
      cited as such. Only G6 speaks to cost at all, and only at the three
      checked parameter sets.
    - >-
      The gate CANNOT detect an error inside a correctly shaped closed
      form. It detects missing elements, uncharged node types, convention
      drift, undisclosed memory, unvalidated heuristics, and
      blind-re-derivation disagreement. A certificate can pass and still be
      wrong in a way this protocol does not look for; that is a limit of
      the design, not of its execution, and it is why a pass triggers
      independent review rather than a status change.
    - >-
      No crypto-scale claim is made anywhere. The three parameter sets are
      evaluations of stated closed forms, labelled estimates, never
      measurements, and no algorithm is executed at any size.
    - >-
      Both rates are scoped to one commit, two declared queries, one
      convention and one tolerance. The corpus grows continuously and in
      several worktrees at once.
    - >-
      IDEA-20260801-003's assertion that the historical rate is already
      known to be 0 percent is NOT adopted by this contract; it is
      pre-registered as the prediction under test. Its named batches enter
      only if the frozen query returns them, and no statement about them is
      made on any other basis.
    - >-
      ADOPTING the gate as a condition of admission to GOAL-ECDLP-001 is a
      governance change requiring its own Coordinator decision. This
      contract specifies and predicts; it enacts nothing, changes no
      completion criterion, and blocks no existing work.
  dominated_by: >-
    CHECKED ACROSS EVERY AXIS AND NOT NULL. As an attack: NOT APPLICABLE --
    no algorithm is proposed, so no row of the time/memory/data frontier is
    contested. As cryptanalysis: nothing is claimed. As a cost-accounting
    gate for this program's sub-rho claims: no incumbent exists;
    GOAL-ECDLP-001's completion criterion requires 'complete end-to-end
    cost accounting' in prose and supplies no decidable check, which is the
    gap this protocol proposes to fill and does not itself close.
  sota_delta: >-
    Exactly 0 on every attack axis. Content delivered: a decidable
    ten-element descent certificate with eight failing conditions, a
    curve-free positive control establishing that the gate is passable at
    all, three negative controls including a known-false-conclusion
    fixture, a blind re-derivation of every surviving cost, the retroactive
    pass rate of this corpus's sub-rho ECDLP claims with the missing
    element named per claim, and the same rate on a curve-free comparison
    population so the finding can be attributed.
  id_allocation_provenance: >-
    EXP-PFDR-e0edb5 pre-allocated by the tasking Coordinator in
    TASK-20260904-b2a7e9 and stated there verbatim against source idea
    IDEA-20260801-003. The authoring subagent has no shell and minted
