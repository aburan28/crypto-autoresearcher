  required_artifacts:
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/conventions.yaml (the frozen charging convention as executed, this contract sha256, and the commit both populations were enumerated at)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/populations.yaml (both exact query texts and both frozen record-id lists with a sha256 over each, in ascending audit order)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/certificates/ (one certificate YAML per fixture and per audited claim, each carrying D1-D10 or explicitly recording which elements the claim does not supply)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/fixtures.yaml (the four fixture dispositions with firing conditions; the FIX-POS cost expressions with the provenance of each source actually read)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/blind-rederivations.yaml (per certificate: the re-deriver read-set declaration, the independently assembled T_descent, and the discrepancy in bits at each parameter set, with both assemblies shown)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/dispositions-ecdlp.yaml (per claim: PASS or FAIL with the firing condition, the disposition kind, the missing-element set, the signed gap in bits and the memory in bits at each evaluable parameter set, or UNAUDITABLE with a reason)'
    - 'experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/dispositions-noncurve.yaml (the same, for the curve-free comparison population)'
