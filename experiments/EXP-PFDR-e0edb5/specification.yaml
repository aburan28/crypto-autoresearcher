experiment:
  id: EXP-PFDR-e0edb5
  hypothesis_id: H-PFDR-724ad2
  question_id: RQ-ECDLP-002
  idea_id: IDEA-20260801-003
  batch_id: BATCH-2eaca1
  version: 1
  recorded_at: '2026-09-04'
  drafted_under_task: TASK-20260904-b2a7e9
  batch_position: 4 of 4 (theory-gov; VERIFICATION PROTOCOL, zero runs)
  record_shape: >-
    THIS IS A VERIFICATION PROTOCOL, NOT AN EXPERIMENT, AND IS DELIBERATELY
    NOT FORCED INTO ONE. Nothing is sampled, no curve is generated, no
    solver executes, and there is no random variable -- so there is no
    seed, no replication count and no effect size, and inventing them would
    be decoration rather than rigor. The rigor lives instead in three
    things being fully inspectable: WHAT ARTIFACT IS CHECKED (the ten-element
    descent certificate), AGAINST WHAT REFERENCE (an independently
    recomputed rho baseline, a blind re-derivation, and evaluation at three
    standardized parameter sets), and WHAT RESULT FAILS IT (the eight
    decidable conditions G1-G8, plus four calibration fixtures the gate must
    pass or fail as forced). The schema fields below are filled honestly for
    that shape: maximum_runs is 0, replication.seeds is empty with a stated
    reason, and scale_relevance records that the three parameter sets are
    evaluations of stated closed forms and never measurements.
  title: >-
    A decidable closed-form target-descent cost gate, calibrated on a
    CURVE-FREE POSITIVE CONTROL where a charged descent genuinely exists
    (index calculus over F_p^*) and on three negative controls it must
    reject -- including a proves-too-much certificate whose conclusion is
    known false -- then applied retroactively to this corpus's in-scope
    sub-rho ECDLP claims and, identically, to a non-elliptic-curve
    comparison population
  status: draft
  approved_by: null
  approved_at: null
  status_note: >-
    Written and frozen at the /design-experiment stage; NOT submitted for
    approval and NOT authorized for implementation. 'draft' is the canonical
    first state of the experiment machine in AGENTS.md ("Research states"):
    draft -> review_required -> approved -> running -> completed |
    failed_infrastructure | invalid -> analyzed -> archived. The originating
    handoff TASK-20260904-b2a7e9 initially mandated 'designed', which is not
    in that machine; the designing coordinator flagged the conflict rather
    than silently choosing, and the handoff was corrected to 'draft'.
  assigned_to: executor
  zero_run_contract: true
  implementation_authorized: false
  implementation_authorized_note: >-
    No solver, no curve, no ECDLP instance, no run. A DERIVATION-AID SCRIPT
    (exact integer or exact rational evaluation of closed forms at the
    three parameter sets, standard library only, deterministic) is
    permitted as an archived artifact under runs/AUDIT-001/; it is an
    incidental mechanical arithmetic check, produces no run record and no
    manifest.yaml, and is not evidence about any curve.
  claim_ceiling: >-
    audit and cost-accounting verification only. No mathematical claim, no
    ECDLP evidence, no speedup, no closure, no hypothesis or goal status
    change, and NO ADOPTION of the gate. A failed gate records that a claim
    is INCOMPLETE AS WRITTEN and never that it is mathematically wrong.
  claim_tier_basis: >-
    DERIVATION TIER per docs/claims-and-verification.md ("Refutation
    artifacts"). No solve is claimed and the only certificate kind that can
    arise is none. Every cost number is an evaluation of a stated closed
    form, labelled estimate, never measured.
  objective: >-
    Establish, in this order, that the closed-form target-descent gate is
    (1) PASSABLE -- witnessed constructively by a curve-free algorithm whose
    descent is genuinely charged -- and (2) DISCRIMINATING -- it rejects an
    uncharged certificate, a convention-drifted certificate, and a
    certificate whose conclusion is known false; and only then (3) measure
    the pass rate of this corpus's in-scope sub-rho prime-field ECDLP
    claims, with the specific missing certificate element named per failing
    claim, and (4) measure the same rate on a non-elliptic-curve comparison
    population so that the finding can be attributed to the ECDLP lane or
    to this program's cost-claim conventions in general. Step (1) exists
    because a gate no algorithm can pass proves nothing about the
    algorithms it rejects, and a self-testing gate with no positive control
    is a ritual.
  verification_protocol:
    checked_artifact:
      name: DESCENT CERTIFICATE
      location: 'a YAML artifact at experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/certificates/<slug>.yaml, one per audited claim and one per fixture'
      elements:
        - 'D1 factor base definition and its size B as an explicit function of N'
        - 'D2 the descent tree: root the target point R, leaves in the factor base, maximum depth L(B, N) and maximum branching w(B, N), both closed forms'
        - 'D3 per-node cost c_i as a closed form in (B, N) in the declared unit, under the frozen charging convention'
        - 'D4 per-node success probability, hence expected attempts per node: the per-attempt-cost times inverse-success-probability bookkeeping'
        - 'D5 the total T_descent(B, N) as a closed form, ASSEMBLED from D2-D4 with the assembly shown step by step'
        - 'D6 the memory M_descent(B, N) as a closed form'
        - 'D7 the matched rho baseline T_rho(N) under the SAME charging convention as D3'
        - 'D8 the end-to-end comparison T_total = T_pre + T_rel + T_lin + T_descent + T_ver against T_rho, with the cost-minimising B named and the crossover N stated'
        - 'D9 every heuristic the certificate rests on, numbered, each with a falsification condition and either archived validation evidence or a scheduled validation EXP-* id'
        - 'D10 an explicit partition of the steps into MEASURED and ASSUMED'
    references:
      - id: REF-RHO
        description: >-
          The verifier's OWN recomputation of the matched rho baseline
          under the frozen convention, never the claim's stated D7 value.
          A claim that supplies its own baseline supplies both sides of its
          own comparison.
      - id: REF-BLIND
        description: >-
          A BLIND RE-DERIVATION of T_descent from D1-D4 and the frozen
          conventions ALONE, performed by an agent that has not read D5,
          D8, or the claim's narrative, and that declares its read set.
          This is NOT replication: recomputing from the claimant's own
          assembly reproduces a wrong-but-self-consistent assembly
          faithfully, which is the one failure mode a check cannot
          otherwise see. Agreement is evidence about the cost; disagreement
          localises to one of two named derivations and is reported as
          such, never resolved by preferring the claimant's.
      - id: REF-PARAMSETS
        description: >-
          Evaluation of D8 and D6 at log2 N in {64, 128, 256} by exact
          integer or exact rational arithmetic, with memory reported beside
          time at every set.
    frozen_charging_convention:
      cost_unit: 'one group operation on E(F_p) (a point addition or doubling); field operations converted at the declared rate stated in the run package'
      memory_access: 'charged; a random access into a table of size M costs the declared amount and the certificate states it'
      node_visit: 'one node visit is one attempt at one descent step, INCLUDING the cost of constructing that node children'
      rho_baseline: '0.886 sqrt(N) group operations at O(1) memory, per ledger/questions/RQ-ECDLP-002.yaml constraints; an automorphism-discounted variant may be used only if the claim declares it and then it is used on BOTH sides'
      freeze_note: >-
        These conventions are fixed HERE, before any certificate is
        inspected. G4 exists because a convention chosen after seeing a
        claim can be chosen to pass or fail it, and the freeze is the only
        defence.
    failing_conditions:
      - id: G1
        name: MISSING
        rule: 'Any of D1-D10 absent or null. FAIL, kind INCOMPLETE, with the missing element ids listed.'
      - id: G2
        name: NOT-CLOSED-FORM
        rule: >-
          T_descent contains a term that is not an explicit function of
          (B, N): an unquantified O(1) or polylog, an undetermined
          constant, a 'with high probability' with no stated probability,
          or a recursion with no solved closed form. FAIL, kind INCOMPLETE.
      - id: G3
        name: UNCHARGED
        rule: >-
          A node type or a tree-construction step appearing in D2 whose
          cost is not charged in D3 -- the set difference of node types
          between D2 and D3 is nonempty. FAIL, kind INCOMPLETE. This is the
          historical failure mode the gate exists to detect.
      - id: G4
        name: CONVENTION-DRIFT
        rule: >-
          The charging convention of D3 or D5 differs from D7 in unit, in
          what counts as one operation, or in whether memory access is
          charged. FAIL, kind INVALID-COMPARISON.
      - id: G5
        name: REDERIVATION-MISMATCH
        rule: >-
          |log2 T_descent(REF-BLIND) - log2 T_descent(D5)| > 1 bit at any
          of the three parameter sets. FAIL, kind UNRESOLVED, with the
          discrepancy in bits reported per set and the disagreement
          localised to one of the two named derivations rather than
          adjudicated.
      - id: G6
        name: NO-SUB-RHO-MARGIN
        rule: >-
          T_total >= T_rho at every parameter set. FAIL, kind
          SUBSTANTIVE -- the claim is complete but is NOT sub-rho at those
          parameters. This is a different disposition from an
          incompleteness fail and is never merged with one.
      - id: G7
        name: MEMORY-UNDISCLOSED
        rule: 'D6 absent, or the D8 comparison made on time alone. FAIL, kind INCOMPLETE.'
      - id: G8
        name: UNVALIDATED-HEURISTIC
        rule: >-
          A heuristic in D9 with neither archived validation evidence nor a
          scheduled validation EXP-* id. The claim may still be recorded as
          CONDITIONAL, but it is BARRED from any transition toward
          supported, per promotion gate 2 of agents/coordinator.md. Reported
          as a distinct disposition, not merged with G1.
    fixtures:
      - id: FIX-POS
        role: 'curve-free POSITIVE control; blocking'
        object: >-
          Index calculus over F_p^*: the classical individual-logarithm
          descent, whose tree has stated depth and branching, whose node
          costs are charged, and whose total falls below the matched
          generic sqrt(p) baseline. NO ELLIPTIC CURVE APPEARS ANYWHERE IN
          IT.
        forced_disposition: >-
          MUST PASS all of G1-G8. A gate that fails a known-passing
          algorithm is too strict, is VOID, and every rejection it issues
          is meaningless. The certificate is WRITTEN as part of this
          protocol from a source the executor actually reads and whose
          provenance is recorded; the cost expressions cited in
          H-PFDR-724ad2 are marked RECALLED and MAY NOT discharge this
          control.
      - id: FIX-UNCHARGED
        role: 'NEGATIVE control for the historical failure mode; blocking'
        object: >-
          A certificate deliberately constructed to describe a complete
          descent tree while leaving the tree-CONSTRUCTION step uncharged,
          so its stated total is below its true total.
        forced_disposition: >-
          MUST FAIL at G3 specifically. A pass means the gate does not
          detect the exact defect it exists to detect and is VOID. Failing
          for a different reason is itself a defect and is reported.
      - id: FIX-PROVES-TOO-MUCH
        role: 'KNOWN-FALSE-CONCLUSION control; blocking'
        object: >-
          A certificate for a 'descent' that charges only the leaves, which
          would therefore certify a sub-rho total for exhaustive search --
          a conclusion that is KNOWN FALSE.
        forced_disposition: >-
          MUST FAIL. This is controls-before-belief applied to an argument
          rather than to a measurement: a null object detects an artifactual
          signal, a known-false object detects an artifactual gate. A gate
          that passes it has proved too much and is wrong somewhere nobody
          has read closely enough.
      - id: FIX-CONVENTION-DRIFT
        role: 'NEGATIVE control for the convention check; blocking'
        object: 'FIX-POS with D3 charging field operations while D7 charges group operations, and nothing else changed'
        forced_disposition: 'MUST FAIL at G4, demonstrating the convention check is live rather than nominal.'
    populations:
      - id: POP-ECDLP
        description: >-
          Live (non-superseded) records under ledger/hypotheses/,
          ledger/evidence/ and experiments/*/specification.yaml that assert,
          for prime-field ECDLP at group order N, a total cost below the
          matched rho baseline. Enumerated by the query text recorded in the
          run package, executed ONCE at a recorded commit, and frozen as a
          record-id list before any certificate is inspected. Checked in
          ascending record-id order so the audit order is deterministic and
          cannot be arranged.
      - id: POP-NONCURVE
        description: >-
          The BLOCKING CURVE-FREE COMPARISON. Live records asserting a total
          attack cost below a matched generic baseline in a declared
          non-elliptic area (lattice, code-based and symmetric-primitive
          goals), enumerated by the same query shape and checked by the
          identical gate. If the ECDLP pass rate and the non-curve pass rate
          are both 0 with the same modal missing element, the finding is
          about how this program writes cost claims in every area and NOT
          about the ECDLP lane, and it may not be reported as the latter.
  inputs:
    parameter_sets: 'log2 N in {64, 128, 256}'
    rederivation_tolerance: '1 bit in log2 at each parameter set'
    audit_order: 'ascending record id within each frozen population; fixed so the order cannot be arranged after the fact'
    prior_under_test: >-
      IDEA-20260801-003 asserts the historical certificate rate is 0
      percent and names BATCH-028 and BATCH-029 as instances. THAT
      ASSERTION IS NOT ADOPTED. No agent under TASK-20260904-b2a7e9 opened
      those batches. The 0 percent rate is PRE-REGISTERED AS A PREDICTION
      TO BE MEASURED by this audit, and the named batches enter only if the
      frozen query returns them.
    runs: 0
    curve_generation: none
  controls:
    - id: CTRL-CONVENTION-FROZEN
      row_class: instrument
      blocking: true
      object: 'the frozen charging convention above'
      forced_disposition: >-
        FORCED: this contract's archive commit must PRECEDE the run
        package's and the run package must record the contract's sha256.
        A convention chosen after seeing a claim can be chosen to pass or
        fail it, and this is the only evidence it was not.
    - id: CTRL-FIX-POS
      row_class: positive_control
      blocking: true
      object: FIX-POS
      forced_disposition: 'MUST PASS G1-G8. See fixtures. A failure voids the gate and halts the audit.'
    - id: CTRL-FIX-UNCHARGED
      row_class: negative_control
      blocking: true
      object: FIX-UNCHARGED
      forced_disposition: 'MUST FAIL at G3.'
    - id: CTRL-FIX-PROVES-TOO-MUCH
      row_class: known_false_control
      blocking: true
      object: FIX-PROVES-TOO-MUCH
      forced_disposition: 'MUST FAIL. A pass means the gate certifies a known-false conclusion.'
    - id: CTRL-FIX-CONVENTION-DRIFT
      row_class: negative_control
      blocking: true
      object: FIX-CONVENTION-DRIFT
      forced_disposition: 'MUST FAIL at G4.'
    - id: CTRL-BLIND-READ-DECLARATION
      row_class: instrument
      blocking: true
      object: 'every REF-BLIND re-derivation'
      forced_disposition: >-
        FORCED: the re-deriving agent declares the exact paths it read, and
        that set must not intersect the blind_from set (the certificate's
        D5 and D8, the claim's narrative, and any prior audit report on the
        same claim). An undeclared or intersecting read set voids that
        re-derivation and the claim is reported as UNAUDITABLE rather than
        as passing or failing.
    - id: CTRL-NONCURVE-COMPARISON
      row_class: null_object
      blocking: true
      object: POP-NONCURVE
      forced_disposition: >-
        THE BLOCKING CURVE-FREE COMPARISON. Both pass rates and both modal
        missing elements are reported TOGETHER, always, in either direction.
        An audit finding that reproduces on records concerning no curve is
        not a finding about curves.
    - id: CTRL-DISPOSITION-KINDS-SEPARATE
      row_class: honesty
      blocking: true
      object: 'every failing claim'
      forced_disposition: >-
        FORCED: the disposition kind (INCOMPLETE, INVALID-COMPARISON,
        UNRESOLVED, SUBSTANTIVE, CONDITIONAL-BARRED) is reported per claim
        and never merged. 'The claim is incomplete as written' and 'the
        claim is not sub-rho at these parameters' are different findings,
        and collapsing them would let an accounting defect read as a
        mathematical refutation.
    - id: CTRL-DETERMINISM
      row_class: instrument
      blocking: true
      object: 'the derivation-aid script'
      forced_disposition: 'FORCED: byte-identical output on re-execution, verified by sha256. Exact arithmetic only; no floating point in any reported cost.'
    - id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      object: 'Pollard rho: 0.886 sqrt(N) group operations, O(1) memory'
      forced_disposition: >-
        The prior column of every evaluated cell. NO DOMINATION IS CLAIMED
        ON ANY AXIS by this contract: it evaluates other records' stated
        closed forms and asserts none of its own.
  independent_variables:
    - 'population in {FIXTURES, POP-ECDLP, POP-NONCURVE}'
    - 'parameter set: log2 N in {64, 128, 256}'
    - 'derivation source in {claimant D5, REF-BLIND} (the blind re-derivation arm)'
  metrics:
    primary:
      - 'gate disposition per checked object: PASS, or FAIL with the firing condition among G1-G8. UNITS: categorical.'
      - 'pass rate per population: passes divided by objects checked. UNITS: dimensionless fraction. THE HEADLINE FOR POP-ECDLP.'
      - 'signed gap log2(T_total) - log2(T_rho) per claim per parameter set. UNITS: BITS (log2 group operations). Negative means sub-rho. THE PRIMARY QUANTITATIVE OUTPUT.'
      - 'memory log2(M_total) per claim per parameter set. UNITS: BITS (log2 of the memory unit declared in the convention). Reported beside every time figure without exception.'
      - 'blind re-derivation discrepancy |log2 T_descent(REF-BLIND) - log2 T_descent(D5)| per claim per parameter set. UNITS: BITS.'
      - 'missing-element set per failing claim, drawn from D1-D10. UNITS: a set of element ids.'
      - 'modal missing element per population. UNITS: an element id.'
    secondary:
      - 'disposition kind per failing claim: INCOMPLETE, INVALID-COMPARISON, UNRESOLVED, SUBSTANTIVE, CONDITIONAL-BARRED'
      - 'the four fixture dispositions with their firing conditions'
      - 'the cost-minimising B and the crossover N stated by each claim that supplies them'
      - 'the count of in-scope claims that could not be evaluated at all, with the element that made evaluation impossible'
      - 'the FIX-POS certificate itself, with the provenance of every cost expression in it'
      - 'the read-set declaration of every blind re-derivation'
  heuristic_under_test: >-
    HEUR-001 (certifiability, bounded from one side by FIX-POS) and
    HEUR-002 (convention sufficiency, measured by the FIX-POS blind
    re-derivation discrepancy) of H-PFDR-724ad2.
  preregistered_prediction:
    quantity: >-
      The four fixture dispositions, the FIX-POS blind re-derivation
      discrepancy, the POP-ECDLP pass rate and modal missing element, and
      the POP-NONCURVE pass rate and modal missing element.
    formula: >-
      FIX-POS PASSES all of G1-G8. FIX-UNCHARGED FAILS at G3.
      FIX-PROVES-TOO-MUCH FAILS. FIX-CONVENTION-DRIFT FAILS at G4. The
      FIX-POS blind re-derivation discrepancy is at most 1 bit at each of
      log2 N in {64, 128, 256}. The POP-ECDLP pass rate is 0 of n. The
      modal missing element among failing POP-ECDLP claims is D4 or D5. The
      POP-NONCURVE pass rate is reported with NO predicted value, because
      predicting it would invite reading the comparison in a preferred
      direction; only the requirement that it be reported is fixed.
    source: >-
      H-PFDR-724ad2 claims H1-H4 and its predictions P1-P9, which restate
      IDEA-20260801-003's gate with the positive control, the
      proves-too-much control, the blind re-derivation and the curve-free
      comparison added. The rho baseline is read verbatim from
      ledger/questions/RQ-ECDLP-002.yaml constraints; the completion
      criterion D8 operationalises is read verbatim at
      ledger/goals/GOAL-ECDLP-001/goal.yaml lines 7009-7018. FIXED ON
      2026-09-04, BEFORE THE POPULATIONS ARE ENUMERATED AND BEFORE ANY
      CERTIFICATE IS INSPECTED. The tolerance of 1 bit, the three parameter
      sets, and the eight failing conditions are part of the frozen
      contract and are never adjusted after an outcome is seen.
  scale_relevance:
    tier: null
    justification: >-
      Explicitly null rather than absent. NO SCALE IS TESTED: no curve is
      sampled and no computation on a cryptographic object occurs. The rows
      at log2 N in {64, 128, 256} are EVALUATIONS OF OTHER RECORDS' STATED
      CLOSED FORMS, labelled estimates, never measurements, and they carry
      no claim that any algorithm was run at any size. There is no transfer
      assumption to state because nothing is transferred: an arithmetic
      evaluation of a stated formula is conditional on that formula being
      correct, which this protocol explicitly does not check (see the
      interpretation limit on errors inside a correctly shaped closed form).
    correspondence: 'none; no sampling of any mathematical object occurs'
  tail_checks:
    - >-
      The claim with the most negative signed gap, i.e. the one that
      appears most strongly sub-rho, reported with its full disposition,
      its memory column, and its missing-element set. If a claim looks
      strong and fails only on an incompleteness condition, that is the
      most repairable and most valuable single finding of the audit and is
      named.
    - >-
      The parameter set at which the largest blind re-derivation
      discrepancy occurs, per claim, with both derivations' assemblies
      shown side by side so a reader can localise the disagreement rather
      than trust an adjudication.
    - >-
      Every claim disposed UNAUDITABLE under CTRL-BLIND-READ-DECLARATION,
      listed with the reason. An unauditable claim is neither a pass nor a
      fail and must not be counted as either.
    - >-
      The G8 set: claims complete in D1-D8 but resting on a heuristic with
      no validation evidence and no scheduled validation experiment. These
      are the claims closest to passing and the scheduled experiment each
      would need is named.
  replication:
    seeds: []
    independent_instances: 0
    reason: >-
      ZERO RUNS AND NO SAMPLING: there is nothing to seed and nothing to
      replicate. The determinism that a seed would buy elsewhere is bought
      here by three declared conditions instead: the charging convention is
      frozen before any inspection, both populations are enumerated once at
      a recorded commit and frozen as record-id lists, and the audit order
      is ascending record id. The replication analogue for a verification
      protocol is REF-BLIND -- an independent re-derivation from the
      certificate's D1-D4 alone -- which is performed inside this contract
      for every surviving certificate and whose read set is declared and
      checked.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 0
    maximum_workers: 1
    notes: >-
      maximum_runs is 0: no run occurs. wall_clock_seconds_per_run 600 is
      the template floor and bounds the derivation-aid script's execution,
      which is not a run and is not evidence. total_cpu_hours 0.5 would
      cover the arithmetic; 1 is declared as headroom. The dominant cost of
      this protocol is AGENT TIME reading certificates and performing the
      blind re-derivations, which is budgeted in the executing and
      reviewing handoffs and not here, and the blind re-derivation must be
      dispatched as a SEPARATE handoff to an agent that has not read D5.
  stages:
    - id: stage-0-freeze
      purpose: 'record the frozen charging convention and this contract sha256; enumerate and freeze both populations at a recorded commit'
      blocking: true
    - id: stage-1-fixtures
      purpose: 'construct and check the four fixtures; FIX-POS constructed from a source actually read, with provenance recorded'
      blocking: true
    - id: stage-2-blind-rederivation-calibration
      purpose: 'REF-BLIND on FIX-POS, where the answer is known, measuring the convention-sufficiency discrepancy'
      blocking: true
    - id: stage-3-ecdlp-audit
      purpose: 'check every POP-ECDLP claim in ascending record-id order; disposition, missing elements, signed gap, memory'
    - id: stage-4-noncurve-audit
      purpose: 'the identical gate on POP-NONCURVE'
      blocking: true
    - id: stage-5-report
      purpose: 'both pass rates and modal elements together; the four tail checks; the G8 set with the named experiments each would need'
  stopping_rules:
    - >-
      Stop at stage 1 if FIX-POS fails. The gate is unpassable by
      construction; record the failing condition, void the gate, and audit
      NOTHING. This is the single most important stop in the protocol.
    - >-
      Stop at stage 1 if FIX-UNCHARGED, FIX-PROVES-TOO-MUCH or
      FIX-CONVENTION-DRIFT passes. The gate does not detect what it exists
      to detect; record which and audit nothing.
    - >-
      Stop at stage 2 if the FIX-POS blind re-derivation discrepancy
      exceeds 1 bit. The conventions are insufficiently specific; they are
      rewritten under a versioned protocol_amendment and no corpus claim is
      checked under the old ones.
    - >-
      Do NOT stop early on a pass in stage 3. A passing claim is the
      contract's most important possible finding and the audit continues
      through the frozen list regardless.
    - >-
      Stage 4 is not optional and is not conditional on stage 3's outcome.
      Reporting stage 3 without stage 4 is an invalidation, not a shortcut.
    - >-
      Stop when stage 5 is complete. No claim is added to or removed from
      either frozen population because of what another claim's disposition
      showed.
    - >-
      A tool crash or a parse failure on a record is INFRASTRUCTURE SIGNAL
      (AGENTS.md rule 5): the record is reported as UNAUDITABLE and counted
      separately; it is never counted as a fail and never as a pass.
  invalidation_rules:
    - >-
      Changing the charging convention, the tolerance, the parameter sets,
      or any of G1-G8 after any certificate has been inspected INVALIDATES
      the audit. Such a change is a versioned protocol_amendment plus a
      re-audit from stage 1, never an edit.
    - >-
      Auditing any corpus claim before all four fixtures have disposed as
      forced INVALIDATES the audit.
    - >-
      A blind re-derivation whose declared read set intersects blind_from
      INVALIDATES that re-derivation; the claim is UNAUDITABLE, not failing.
    - >-
      Accepting a claim's own D7 in place of REF-RHO INVALIDATES that
      claim's comparison: a claim that supplies its own baseline supplies
      both sides of its own test.
    - >-
      Reporting the POP-ECDLP pass rate without the POP-NONCURVE pass rate
      beside it INVALIDATES the report.
    - >-
      Reporting a comparison on time without the memory column INVALIDATES
      it.
    - >-
      Describing a FAILED claim as mathematically wrong, refuted, or closed
      INVALIDATES the artifact making the statement. A failed gate records
      INCOMPLETENESS AS WRITTEN. Incompleteness and falsity are different
      findings and G6 (SUBSTANTIVE) is the only disposition that speaks to
      cost at all, and it speaks only at the three checked parameter sets.
    - >-
      Any assertion that the gate is ADOPTED, or that any claim is barred
      from GOAL-ECDLP-001, INVALIDATES the artifact making it. Adoption is
      a separate Coordinator decision on the strength of this result.
    - >-
      Any floating-point value in a reported cost INVALIDATES it; exact
      integer or exact rational arithmetic only.
    - >-
      A recalled cost expression presented as a checked source, in
      particular in the FIX-POS certificate, INVALIDATES that certificate.
  success_criterion: >-
    Decidable from the primary metrics, ALL of: (1) CTRL-CONVENTION-FROZEN
    holds -- this contract's archive precedes the run package's and its
    sha256 is recorded; (2) all four fixtures dispose as forced, with the
    firing condition named for each of the three negatives and FIX-POS's
    certificate carrying the read provenance of every cost expression in
    it; (3) the FIX-POS blind re-derivation discrepancy is at most 1 bit at
    each of the three parameter sets, with the read-set declaration
    attached; (4) every claim in both frozen populations has a disposition
    with its kind, its missing-element set if failing, and its signed gap
    and memory at each evaluable parameter set, or is recorded UNAUDITABLE
    with a reason; (5) both pass rates and both modal missing elements are
    reported together, and the four tail checks are complete including the
    named validation experiment each G8 claim would need.
    SUCCESS IS AUDIT INTEGRITY, NOT A PARTICULAR RATE: a run meeting
    (1)-(5) and finding a claim that PASSES the gate is a FULL SUCCESS and
    that pass is the most important thing the run produces. Nothing here
    adopts the gate, validates any mathematics, supplies ECDLP evidence, or
    changes any status.
  falsification_criterion: >-
    ANY of the following, evaluated in this order and reported by name.
    F1 GATE VOID, TOO STRICT: FIX-POS fails. The gate is unpassable by
    construction, H1 of H-PFDR-724ad2 is falsified, every rejection it
    would issue is void, and nothing is audited. This is IDEA-20260801-003's
    own second falsification condition and is the outcome the positive
    control exists to detect.
    F2 GATE VOID, TOO WEAK: FIX-UNCHARGED, FIX-PROVES-TOO-MUCH or
    FIX-CONVENTION-DRIFT passes. The gate does not detect an uncharged
    step, a known-false conclusion, or convention drift.
    F3 CONVENTIONS INSUFFICIENT: the FIX-POS blind re-derivation
    discrepancy exceeds 1 bit. HEUR-002 is falsified; the conventions are
    rewritten under a protocol_amendment before any corpus claim is
    checked.
    F4 H2 REFUTED, THE CLAIM SURVIVES THE GATE: at least one POP-ECDLP
    claim PASSES. Its verified certificate and its signed gap with the
    memory column are the run's headline output, it is
    IDEA-20260801-003's own first falsification condition, and it requires
    independent review before any status change anywhere.
    F5 SCOPE FAILURE, THE CURVE-FREE OUTCOME: POP-NONCURVE shows the same
    pass rate and the same modal missing element as POP-ECDLP. The finding
    is about this program's cost-claim conventions across every area, is a
    CONTROLLED NULL with respect to the ECDLP lane, and every artifact must
    say so in its own words.
    F6 H3 REFUTED: the modal missing element is D1 or D2 rather than D4 or
    D5 -- claims do not describe a descent structure at all, rather than
    describing one and failing to charge it. A different and more serious
    defect than predicted, and a more useful finding.
    F7 CLAIMS SUPPORTED: F1-F6 do not fire, POP-ECDLP passes 0 of n, the
    modal missing element is D4 or D5, and POP-NONCURVE differs. The gate is
    demonstrably passable, is currently unpassed in this lane, the missing
    element is named, and the Coordinator has a concrete basis for a
    SEPARATE decision on whether to adopt it. Adoption is not performed
    here.
  artifact_package_directory: experiments/EXP-PFDR-e0edb5/runs/AUDIT-001/
  artifact_package_note: >-
    AUDIT-001 is a ZERO-RUN PACKAGE DIRECTORY, not a run. It carries NO
