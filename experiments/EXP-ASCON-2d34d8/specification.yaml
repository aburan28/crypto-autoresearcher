experiment:
  id: EXP-ASCON-2d34d8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-1af57f; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-1af57f
  question_id: RQ-ASCON-2dfd8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Search a structured candidate space of bit-index permutations for a conjugation witness between
    two ordering conventions of the same permutation, verifying survivors structurally and calibrating
    against random-relabelling and constant-perturbation nulls
  objective: 'The one uncertainty a run reduces is whether the reported change of bit ordering is
    a relabelling of coordinates or a change of function. Concretely: (i) does there exist, within
    the declared structured candidate space generated by byte reversals, bit reversals and word-order
    permutations, a bit-index permutation P satisfying the conjugation identity between the two pinned
    implementations at EVERY round count, and if so what is P; (ii) does the identical test applied
    to 100000 uniformly random bit-index permutations return zero survivors past round one, which
    is the only evidence that the identity constrains anything at all; (iii) for candidates that fail,
    do they fail at the substitution layer, the diffusion layer or the constant schedule, since a
    candidate that conjugates the first two and dies at the third localises the difference to constant
    placement and is a separately useful outcome. The run touches no published result, attempts no
    cryptanalysis, and produces either a witness verified exactly against the linear-layer matrix
    and the constant schedule, or a candidate-space statement whose unsearched remainder is named.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: over the declared structured
      candidate space of size N, tested at every round count against both pinned implementations,
      exactly M candidates satisfied the conjugation identity and were verified structurally; the
      random-relabelling null returned zero survivors and the constant-perturbation control killed
      every candidate. WHAT DOES NOT FOLLOW: that no witness exists outside the searched space; that
      any published result transfers or fails to transfer; that a witness makes the ordering change
      harmless in any security sense; that a null result makes it harmful. Nothing here is a statement
      about the security of Ascon or about the contents of any literature.'
  inputs:
    procedure: 'STAGE 0 (human time, blocking): obtain both specifications and their test vectors
      and file them as KN-LIT entries; without both sides there is no identity to test. STAGE 1 (about
      two days): implement both conventions as bitsliced 320-bit permutations, each validated independently
      against its own declared vectors. STAGE 2 (hours): enumerate the structured candidate group
      under composition and deduplicate, recording its exact size. STAGE 3 (minutes of CPU): test
      every candidate at every round count on 1000 random states, recording largest surviving round
      count and per-layer survival. STAGE 4 (minutes, same invocation): run the identical test over
      100000 random bit-index permutations and over the constant-perturbed permutation, plus the identity-candidate
      positive control. STAGE 5 (minutes): for each sampled survivor, verify exactly that P maps the
      linear-layer matrix and the constant schedule of one convention onto the other. STAGE 6 (hours
      of authoring): write the property-class partition and emit the run record with the candidate-space
      size, the unsearched remainder, all control counts and the seeds.'
    instrument: Python 3.11 with numpy for bitsliced 320-bit state evaluation and for the linear-layer
      matrix over GF(2); itertools for the candidate group enumeration; pytest for the test-vector
      gates, the identity-candidate positive control and the tail checks; harness/runner.py for the
      manifest, seeds and inference block. No Sage, no computer algebra system, no SAT or MILP solver
      -- the linear-layer check is a GF(2) matrix comparison and needs nothing more.
    parameters: 'State 320 bits as five 64-bit words. Structured candidate space: the group generated
      by byte reversal within words, bit reversal within bytes, bit reversal within words and the
      120 word-order permutations, closed under composition and deduplicated, expected in the low
      thousands and reported exactly. Round counts 1 through the full count and through the extended
      count if the specification defines more. Random-state sample 1000 per candidate per round count.
      Random-null draw 100000. One constant-perturbed variant, altering a single round constant bit.
      Seeds recorded for every random draw.'
  controls:
  - 'Random bit-index permutation null: 100000 uniform draws, identical test, same invocation, seeds
    recorded, expected zero survivors past round one.'
  - 'Constant-perturbed permutation control: the structured candidates tested against a permutation
    with one round constant altered, where every candidate must die.'
  - 'Identity-candidate positive control: P equal to the identity must conjugate a permutation with
    ITSELF at every round, confirming the test can return true at all.'
  - 'Per-layer decomposition: substitution, diffusion and constant schedule tested separately as well
    as jointly, so a near-miss is visible rather than collapsed into a failure.'
  - Test-vector gate on both implementations before any candidate is tested.
  - Exact structural verification of any sampled survivor against the linear-layer matrix and the
    constant schedule, so no witness is ever asserted from sampling alone.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): RANDOM BIT-INDEX PERMUTATIONS of the same state size, drawn from a
    recorded seed in the same invocation, subjected to the IDENTICAL conjugation test at every round
    count. For a surviving structured candidate to mean anything, the random arm must show ZERO survivors
    past round one out of a large declared draw: if random relabellings conjugate the permutation,
    then the identity is not constraining and a structured survivor carries no information. A second
    null tests the structured candidates against a deliberately modified permutation (one round constant
    altered), where every candidate must die, confirming the test has teeth against a small perturbation
    rather than only against gross ones.'
  independent_variables:
  - candidate bit-index permutation, over the enumerated structured space
  - round count r, from 1 to the full and extended counts
  - arm (structured candidates / random-relabelling null / constant-perturbed control / identity positive
    control)
  - layer tested (substitution / diffusion / constant schedule / all jointly)
  metrics:
    primary:
    - count of structured candidates satisfying the conjugation identity at every round count
    - largest surviving round count per candidate, as a histogram
    - random-relabelling null survivor count past round one
    - exact structural verification outcome per sampled survivor
    secondary:
    - per-layer survival counts across the structured candidate space
    - constant-perturbed control survivor count
    - enumerated candidate-space size after deduplication
    - test-vector agreement per implementation
    - wall-clock and permutation evaluations
  heuristic_under_test: null
  preregistered_prediction:
    quantity: W, the number of structured candidates satisfying the conjugation identity at every
      round count AND passing exact structural verification; and R, the number of random bit-index
      permutations surviving past round one.
    formula: 'A candidate P is a witness iff for every round count r in the tested range and every
      sampled state x, P(A_r(P^{-1}(x))) = B_r(x), where A_r and B_r are the r-round permutations
      under the two conventions, AND P maps the GF(2) linear-layer matrix of A onto that of B exactly,
      AND P maps A''s round-constant schedule onto B''s exactly. Predicted R = 0 exactly. W is deliberately
      NOT pre-committed: both W = 0 and W = 1 are reportable and this program has pinned neither convention,
      so a predicted value would be invention. A measured R above 0 refutes the instrument before
      W is interpreted at all.'
    source: Pre-registered in the parent proposal IDEA-20260816-1af57f before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The tested parameters are the full 320-bit state and the full round counts, so
      there is no scale reduction on the object itself; what is reduced is the SEARCH SPACE, from
      all 320-bit-position permutations to a structured group of a few thousand elements. The transfer
      assumption is therefore not about scale but about coverage, and it is stated plainly: a witness
      found is exact and needs no extrapolation, while a witness not found is confined to the enumerated
      group and the unsearched remainder -- everything outside that group -- is named in the deliverable
      and never treated as searched.'
    correspondence: null
  tail_checks:
  - Identity candidate against a permutation and itself, which must be a witness at every round count.
  - Round count 1 alone, where many candidates may pass spuriously, checked to confirm the histogram's
    low end behaves as expected rather than being empty.
  - The extended round counts the specification reportedly defines beyond the standard twelve, checked
    separately since the constant schedule there is the least exercised part of any implementation.
  - A candidate that permutes only within one word, which cannot conjugate a diffusion layer coupling
    all five words and must fail at the diffusion layer specifically.
  - An all-zero input state, where many identities hold degenerately, excluded from the sampled agreement
    set and checked separately.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt before any candidate is tested if either implementation fails its declared test vectors,
    or if the identity-candidate positive control fails.
  - Halt and report an instrument defect if any random bit-index permutation survives past round one.
  - Stop at the enumerated structured space; do not widen the search after seeing the result, since
    a post-hoc widening converts a declared coverage statement into an open-ended search with no boundary
    to report.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both implementations pass their declared test vectors, the identity positive
    control passes, the random-relabelling null returns exactly zero survivors past round one, the
    constant-perturbed control kills every candidate, and W is reported with the exact enumerated
    candidate-space size and an explicit description of the unsearched remainder -- whichever value
    W takes.
  falsification_criterion:
  - Any random bit-index permutation survives past round one.
  - The identity-candidate positive control fails.
  - A candidate passes the sampled test but fails exact structural verification.
  - Any candidate survives against the constant-perturbed permutation.
  - Either implementation fails its declared test vectors.
  - The structured candidate group cannot be enumerated within budget, in which case the searched
    space shrinks and the unsearched remainder grows, and the result is reported as reduced coverage
    rather than as absence.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-1af57f
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Neither convention is pinned in this environment. A Coordinator must obtain both specifications
    AND independent test vectors for each, and RQ-ASCON-2dfd8b forbids designing an experiment until
    both documents are filed as KN-LIT entries.
  - The generating set of the structured candidate group is a judgement call; a Coordinator must ratify
    it and decide whether to add generators such as nibble-level reorderings before the run rather
    than after.
  - The property-class partition deliverable has no acceptance criterion yet; a Coordinator must state
    what makes a partition usable as an applicability-table column rather than a list of adjectives.
  - The ten endian-matched proposals were seen by filename only and must be read by a Coordinator
    to confirm none already occupies this framing.
