# EXP-BINSTD-01baad
# Pair-count arithmetic. No subspace is encoded.
# Approved by DEC-20261003-ba7c12.
experiment:
  id: EXP-BINSTD-01baad
  hypothesis_id: H-BINSTD-00e3f1
  source_idea: IDEA-20261002-adb7bb
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Pair floor versus the cell count
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-ba7c12
  objective: >-
    Check the product 48, the excess 2, and the product 10.
  inputs:
    n_sum: 59
    n_product: 7429
    gap_product: 8
    span: 6
    cells: 6
    pairs: 8
    pair_cells: 48
    hour_cap: 6
    hour_excess: 2
    match_window: 1
    span_excess: 5
    window_product: 10
  controls:
    - >-
      Eight times 6 is 48. Reporting 20 pairs makes 20 times 6 equal
      120 and invalidates the run.
    - >-
      Eight exceeds 6 by 2. Six exceeds 1 by 5. The product of 2
      and 5 is 10. Reporting the match window as 0 drops the excess 5.
    - >-
      The n sum is 59 and the n product is 7429. The gap product is
      8 and the span is 6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {pairs, excess, window}
    - route in {product, difference}
  metrics:
    primary:
      - pair_cells
      - hour_excess
      - window_product
      - implementations_agree
    secondary:
      - n_product
      - span_excess
      - gap_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Eight times 6 is 48. Eight exceeds 6 by 2. The product of 2
      and 5 is 10.
    formula: >-
      Multiply 8 by 6. Subtract 6 from 8. Subtract 1 from 6.
      Multiply 2 by 5.
    source: >-
      IDEA-20261002-adb7bb states the n list 17, 19, and 23, the
      dimensions 3 and 4, the pair floor 8, the match window 1, and
      the hour cap 6, read 2026-10-03. It does not name the ratio
      gap as an integer. The products were recomputed in this design
      session. That computation is not a run. No subspace was
      encoded.
  scale_relevance:
    tier: toy
    justification: One written pair floor and one written match window. No transfer to a variable count.
    correspondence: null
  tail_checks:
    - The excess 2 and the product 10 are required. A check that stops at the product 48 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 48 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 48.
    - The excess is not 2.
    - The window product is not 10.
    - The pair floor is reported as 20, or a subspace is encoded.
  success_criterion: >-
    Both runs agree that 8 times 6 is 48, that 8 exceeds 6 by 2,
    that 6 exceeds 1 by 5, and that the product of 2 and 5 is 10.
  falsification_criterion: >-
    The runs agree that 8 times 6 is computed, and that product is
    not 48.
  required_artifacts:
    - experiments/EXP-BINSTD-01baad/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-01baad/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-01baad/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-01baad/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-01baad/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-01baad/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any subspace construction, encoding, or variable count.
    - Any claim that one construction is cheaper than another.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
