      instance: oracle A (2^l quadratic root-findings) decides satisfiability and
      returns the solutions and dominates every closure measured here at toy
      scale by orders of magnitude (idea: closure constant >= 10^2).
    certificate_kind: unsatisfiability_certificate
    certificate_note: >-
      A counted W_D refutation carries a wdag-v1 straight-line certificate with
      per-node degree bounds; a counted adverse W_4 non-refutation carries an
      ann-v1 annihilator certificate. These are instrument certificates about one
      Boolean system each. No discrete logarithm and no relation is claimed.
    affected_vs_safe: No deployed or standardized curve is touched or affected.

