  object:
    field_and_curve:
      field: >-
        F_{2^n} = F_2[t]/(f_n); elements as integers with bit i the coefficient
        of t^i. f_n is the LEAST IRREDUCIBLE polynomial of degree n by integer
        value (bit n set; least value; tested with an irreducibility test
        recorded in the run). Recorded per cell.
      curve: >-
        Y^2 + XY = X^3 + A X^2 + B over F_{2^n}, B != 0. One curve per n, drawn
        by the seeded rule in instance_sets.curve_rule. A, B and the exact group
        order #E are recorded.
      factor_base: >-
        V = {sum_{j<l} c_j t^j}, the polynomial basis; B_fb = {P in E : x(P) in V}
        (includes the 2-torsion point with x = 0 if on the curve), closed under
        negation, size about 2^l.
    inner_instance: >-
      For R in the odd-order subgroup of E and P_3 in B_fb with R != P_3, the
      target u = x(R - P_3) in F_{2^n}. The system f_0..f_{n-1} over B =
      F_2[v_0..v_{2l-1}]/(v_i^2 + v_i): x_1 = sum_{j<l} v_j t^j, x_2 =
      sum_{j<l} v_{l+j} t^j, and f_k = the coefficient of t^k of
      S_3(x_1, x_2, u) = (x_1 x_2 + x_1 u + x_2 u)^2 + x_1 x_2 u + B_curve.
      nv = 2 l, neq = n, equations of Boolean degree 2; ZERO equations are
      RETAINED (neq = n always; closure convention of EXP-CERTBIN-e94b27).
      Monomials are bit masks (bit i = v_i). The support of every f_k lies in
      U_template = {1} u {v_j} u {v_{l+k}} u {v_j v_{l+k}} (bilinear), derived by
      the Coordinator from the formula; Stage 0 records whether the union over a
      cell's kept object instances equals it.
    satisfiability: >-
      The system has a Boolean solution iff u is the abscissa of a sum of two
      elements of B_fb (ENCODING). Ground truth is oracle A (below), cross-checked
      by the verifier's exhaustive evaluation; never a closure.
    oracle_A: >-
      Exact: for each x_1 in V (2^l values) the equation in x_2 is
      (x_1 + u)^2 x_2^2 + (x_1 u) x_2 + (x_1^2 u^2 + B_curve) = 0 (derived by the
      Coordinator from S_3; the executor re-derives and tests it against direct
      S_3 evaluation in C-SELF). Solve by the trace / half-trace method,
      handling the degenerate cases x_1 = u (linear in x_2) and x_1 u = 0
      exactly, and keep the roots lying in V. The Boolean-solution count is the
      number of pairs (x_1, x_2) in V^2 found. Cost recorded as field operations
      per instance and as a host conversion constant to GF(2) word operations.
    oracle_B_in_verifier: >-
      The verifier's own exhaustive evaluation of all f_k over all 2^{2l}
      assignments (2^16 at (23,8), 2^24 at (35,12)), by bit-sliced truth tables
      with a Moebius-type transform; no shared code with oracle A.
    closures:
      engine: >-
        experiments/EXP-CERTBIN-e94b27/impl/closure.py class Closure(nv, D, neq),
        unchanged (pinned). Conventions of that module: monomials are masks;
        row multipliers mu by degree then sorted index tuple (degree <= D - 2);
        Macaulay row index = mu_index * neq + k; columns in descending degrevlex,
        constant last; bit-packed rows.
      M_D: Closure.macaulay_closure (row space of the degree-D Macaulay matrix).
      W_D: >-
        Closure.w_closure, the least fixpoint W^(0) = rowspace(M_D),
        W^(i+1) = W^(i) + span{v_j * b : b in basis of W^(i) cap B_{<=D-1}}.
        Monotone: M_3 <= M_4 <= W_4, W_3 <= W_4, M_5 <= W_5, W_4 <= W_5 (the
        Coordinator's inclusions; C-MONO checks them on the data).
      closures_run:
        - 'M_3, W_3, M_4, W_4 on EVERY instance of EVERY arm (OBJ, SAT-NAT, NULL, PLANTED, EASY, RANDU) at both cells'
        - >-
          M_5 on: the first 20 unsatisfiable OBJ instances in draw order, the
          first 20 NULL instances in draw order, all 10 EASY, the first 10
          PLANTED, and every RANDU instance not refuted by W_4; W_5 ONLY on the
          subset of those on which neither W_4 nor M_5 refutes, plus the first
          10 PLANTED and all 10 EASY (so soundness and visibility are read at
          rung 5). Where the 3 GB cap does not allow a D = 5 closure the
          instance is labelled UNDETERMINED(budget) for that closure, never
          'not refuted'.
        - 'No closure with D >= 6.'
      per_instance_watchdog_seconds: 14400
      per_instance_watchdog_note: >-
        Machine protection by SIGALRM (the closure's own deadline_s). Expiry
        labels the closure UNDETERMINED(budget) and is never a result. The value
        is the e94b27 per-instance W_5 watchdog, reused as an operational
        parameter chosen by the Coordinator, not taken from the idea.
    rungs_and_labels:
      least_refuting_rung: >-
        rho(x) for an unsatisfiable instance x = the least D in {3, 4, 5} such
        that a verified refutation by M_D or W_D exists; '>5' if every closure of
        degree <= 5 that ran failed to refute and none was UNDETERMINED. Because
        W_4 contains M_3, W_3 and M_4, rho(x) >= 5 holds iff W_4 does not refute
        x. For the null and E-DRIFT readings rho is reported in the classes
        {3, 4, '>=5'} (refined to 5 or '>5' where D = 5 data exist).
      closure_label_per_instance_and_closure: >-
        one of REFUTED(verified), REFUTED(uncertified), NOT_REFUTED(certified by
        ann-v1), NOT_REFUTED(uncertified), UNDETERMINED(budget). 'uncertified'
        means the engine's flag was not backed by a verified certificate and is
        never silently converted.
    certificate_formats:
      wdag_v1:
        definition: >-
          {"D": D, "nv": nv, "neq": neq, "nodes": [{"id": i, "rows": [[mu, k],
          ...], "prods": [[j, c], ...]}, ...], "output": o} with poly(i) =
          sum_{(mu,k) in rows} mu * f_k + sum_{(j,c) in prods} v_j * poly(c) in B
          (mu a sorted list of variable indices). VALID iff (a) every child
          c < i; (b) every |mu| <= D - 2 and every k in 0..neq-1; (c) every child
          c used in prods has deg poly(c) <= D - 1; (d) every node has
          deg poly(i) <= D; (e) poly(output) == 1 in B. By induction every node
          lies in W_D, so a valid wdag-v1 certifies 1 in W_D and
          unsatisfiability. An M_D refutation is a one-node wdag-v1 with no
          prods. The text of EXP-CERTBIN-060020 fixes (D, nv, neq) = (4, 20, 19);
          the Coordinator's generalisation to arbitrary D is conditions (b)-(d)
          above (|mu| <= D - 2, child degree <= D - 1, node degree <= D).
        counting_rule: >-
          A W_D (or M_D) refutation counts toward r_D only with a VERIFIED
          wdag-v1. A flat (mu, k) certificate with max |mu| > D - 2 certifies
          unsatisfiability but NOT W_D membership (KN-FIND-5a8d3e section 3) and
          never counts toward a W_D rate.
      ann_v1:
        definition: >-
          {"D": D, "nv": nv, "neq": neq, "L_hex": [...]}: a list of functionals
          lambda on B_{<=D}, each a hex integer whose bit c (LSB first) is
          lambda's value on the c-th monomial of the coordinate order of
          closure.column_order(D, nv). Let S = {g in B_{<=D} : lambda(g) = 0 for
          all lambda in L}. VALID iff (A1) every row of M_D lies in S; (A2) for a
          basis K of S cap B_{<=D-1} computed by the verifier's own elimination,
          lambda(v_j k) = 0 for every k in K, j in 0..nv-1, lambda in L; (A3)
          some lambda in L has lambda(1) = 1. Soundness (derived in
          EXP-CERTBIN-060020 for D = 4; identical argument for any D): S
          contains M_D and is closed under g -> v_j g for deg g <= D - 1, so
          W_D <= S, and 1 is not in S; hence 1 is not in W_D. The natural L is a
          basis of W_D's annihilator.
        requirement: >-
          ann-v1 is produced and verified for EVERY W_4 non-refutation on an
          unsatisfiable OBJ instance and on every NULL instance (the
          non-refutation is the adverse evidence for E-DRIFT / E-DECAY /
          falsified E-BOUNDED, and the null's non-refutation is what
          S_3-ABOVE-NULL leans on). Where an ann-v1 cannot be produced within
          the 3 GB cap and the watchdog the instance is NOT_REFUTED(uncertified)
          and the worst-case counting rule of decision_rules applies. Other arms
          need no ann-v1.
    verifier: >-
      experiments/EXP-ECDLP-7d2a86/verifier/verify_ladder.py, run as a SEPARATE
      PROCESS (not a function call) after the closures. It imports only the
      standard library, numpy and PyYAML, and NOTHING from this experiment's
      impl/, from experiments/EXP-CERTBIN-e94b27 (closure.py, macaulay.py,
      verify_cert.py), from experiments/EXP-CERTBIN-060020, from
      crypto_autoresearcher (any module) or from any review directory; it asserts
      this at start and at exit. From the run's recorded cell parameters (n, f,
      A, B, l, #E) and per-instance records it: (V1) rebuilds every counted
      system with its OWN F_{2^n} arithmetic and its OWN S_3 expansion (null
      systems from their recorded coefficient lists, easy systems from the
      recorded affine relations); (V2) recomputes the satisfiability and solution
      count of EVERY instance of every arm by its own exhaustive 2^{2l}
      evaluation and requires equality with oracle A's flags and counts; (V3)
      replays each arm's stream from the seeds and the stream rule of
      stage0/stream-rule.yaml with numpy 2.4.6 PCG64 and requires the same kept
      instances (by E_sha256) and attempt indices, re-checks that every R lies in
      the odd-order subgroup (m * R = O with the recorded odd order m), that
      every P_3 lies in B_fb and that u = x(R - P_3) with its own group law, and
      re-certifies the recorded curve order #E; (V4) verifies every wdag-v1 by
      (a)-(e) with its own multilinear arithmetic; (V5) runs the negative
      controls (C-VERIFIER); (V6) verifies every ann-v1 by (A1)-(A3) with its own
      elimination. Output: certificate-verification.json,
      annihilator-verification.json, construction-verification.json,
      draw-replay-verification.json, negative-controls-verification.json.
      Independence is code-level, not author-level (the same executor writes
      both); the author-independent verification is the review round's.

  instance_sets:
    generator_rule: >-
      One numpy.random.Generator(numpy.random.PCG64(seed)) per (arm, cell),
      numpy 2.4.6 (DEC-20260923-4d7a19 R-2; a different version is a STOP, since
      the stream could not be replayed), consumed in the order stated in
      stage0/stream-rule.yaml. No other call touches a generator. The exact call
      sequence is fixed in that file before any closure runs (Stage 0), and its
      sha256 is in precommit-hashes.json and the trial plan; the skeleton below
      binds it.
    seed_rule: >-
      seed = 2026100200000 + 1000 * a + n with the arm code a: 0 curve, 1 OBJ,
      2 PLANTED, 3 NULL, 4 EASY, 5 RANDU, 6 self-test. Operational parameters
      chosen by the Coordinator (not from the idea), fixed before any run.
    seeds:
      curve:   {n23: 2026100200023, n35: 2026100200035}
      obj:     {n23: 2026100201023, n35: 2026100201035}
      planted: {n23: 2026100202023, n35: 2026100202035}
      null_arm: {n23: 2026100203023, n35: 2026100203035}
      easy:    {n23: 2026100204023, n35: 2026100204035}
      randu:   {n23: 2026100205023, n35: 2026100205035}
      selftest: 2026100206000
      pre_registered_extension_cells_same_rule: ['n = 29', 'n = 41', 'n = 47']
    curve_rule:
      stream: PCG64(seed curve)
      draw: >-
        per candidate: A = int(g.integers(0, 2**n)), B = int(g.integers(1, 2**n)).
      accept: >-
        the first candidate whose exact group order #E has 2-part h = 2^v with
        2 <= h <= 8 (so the odd part m = #E / h is at least about 2^n / 8). Cap 1000
        candidates; exceeding it is a STOP (contract defect, not a result).
      order_counting: >-
        Exact point counting by any method the executor chooses, certified by:
        N * P = O for 20 random points P and lcm of their orders greater than
        4 * 2^{n/2} (so N is the unique multiple of that lcm in the Hasse
        interval), recorded with the points; cross-check against Sage's
        E.cardinality() when Sage is available (reported, not required). A, B,
        #E, the factorisation of #E and h are recorded in stage1/cells.yaml.
    OBJ:
      role: PRIMARY (the inner object)
      draw_rule: >-
        per attempt: draw R0 = a uniformly random curve point (random x until it
        lifts, then a sign bit), set R = [h] R0 (h the 2-part of #E; kills the
        2-Sylow, so R is uniform in the odd-order subgroup of order m); if
        R = O the attempt is rejected (recorded). Draw P_3 in B_fb: index
        j = int(g.integers(0, 2**l)) as the bit vector of x(P_3) in the
        polynomial basis, lift (the attempt is rejected, recorded, if x(P_3) is
        not an abscissa), a sign bit chooses +/-. If P_3 = R the attempt is
        rejected (u undefined, recorded). u = x(R - P_3). A repeated u is
        rejected (duplicate, recorded). Every other attempt is classified by
        oracle A.
      keep_rule: >-
        The first 60 attempts with s = 0 (unsatisfiable) form OBJ. The first
        attempts with s >= 1 form SAT-NAT up to 20. The stream continues past the
        60th unsatisfiable attempt only to complete SAT-NAT, and stops when
        SAT-NAT reaches 20 or the attempt index reaches 20000 (cap; an
        operational parameter chosen by the Coordinator because the expected
        number of attempts per natural satisfiable instance is about
        2^{n - 2l + 1}, derived: about 256 at (23, 8) and about 4096 at
        (35, 12), so 20 natural satisfiable instances are expected at (23, 8)
        and about 5 at (35, 12) within the cap). A SAT-NAT shortfall is
        recorded, never redrawn, and is NOT a void: the planted arm carries the
        soundness control.
    PLANTED:
      role: proves-too-much / soundness control (Proposition S)
      draw_rule: >-
        per attempt: P_1, P_2 drawn in B_fb exactly as P_3 above; if P_1 + P_2 = O
        the attempt is rejected; u = x(P_1 + P_2). Oracle A must return
        s >= 1 (else INSTRUMENT FAILURE: the run is void).
      keep_rule: the first 20 attempts, distinct u.
    NULL:
      role: same-support random inner system (the nearby object on which the bounded-degree conclusion must fail)
      support: >-
        U_cell = the union, over the n descended equations f_0..f_{n-1} of ALL
        kept OBJ and SAT-NAT instances of the cell, of the monomials of their
        supports (pooled over equations). It must be contained in U_template
        (else STOP, contract defect). Each null system has n equations; for each
        equation k in order, one call g.integers(0, 2, size=|U_cell|) draws the
        uniform {0,1} coefficient of every monomial of U_cell in the closure's
        column order. The coefficients are redrawn per instance.
      sat_check: >-
        exact exhaustive 2^{2l} evaluation (oracle B form) in the executor and in
        the verifier; no field structure exists.
      keep_rule: >-
        The first 30 attempts with no Boolean solution. Cap 2000 attempts per
        cell; a shortfall is recorded and reduces N, never redrawn. Same closure
        code path as OBJ (sha256 of the closure module recorded per arm; C-NULLS).
    EASY:
      role: deliberately easy control (instrument visibility)
      construction: >-
        The first 10 unsatisfiable OBJ instances in draw order, each with l random
        affine relations added: for each relation one call
        g.integers(0, 2, size=2*l+1) gives the coefficient bits of the 2 l
        variables and the constant; a relation with all variable coefficients zero
        is redrawn. neq = n + l, the same closure engine and rungs. Unsatisfiable
        by construction (a superset of an unsatisfiable system).
    RANDU:
      role: H1 transfer arm
      draw_rule: u = int(g.integers(0, 2**n)) per attempt (u = 0 allowed); classified by oracle A.
      keep_rule: the first 30 unsatisfiable attempts; cap 2000 attempts; shortfall recorded.

  cells:
    approved:
      - cell: '(23, 8)'
        n: 23
        l: 8
        nv: 16
        neq: 23
        rows_D4_columns_D4: '3151 / 2517 (idea; Coordinator re-derived n*C(16,<=2) = 23*137 and C(16,<=4))'
        counting_rung_D_reg: 4
        degree_4_generic_by_counting: true
      - cell: '(35, 12)'
        n: 35
        l: 12
        nv: 24
        neq: 35
        rows_D4_columns_D4: '10535 / 12951 (idea; Coordinator re-derived n*C(24,<=2) = 35*301 and C(24,<=4))'
        counting_rung_D_reg: 5
        degree_4_generic_by_counting: false
    pre_registered_not_authorized:
      - {cell: '(29, 10)', nv: 20, neq: 29, rows_D4_columns_D4: '6119 / 6196', counting_rung: '4 or 5 (idea)'}
      - {cell: '(41, 14)', nv: 28, neq: 41, rows_D4_columns_D4: '16687 / 24158', counting_rung: 5}
      - {cell: '(47, 16)', nv: 32, neq: 47, rows_D4_columns_D4: '24863 / 41449', counting_rung: 6}
    extension_memory_note: >-
      Derived by the Coordinator from the pinned closure.py: Closure.__init__
      allocates mask2col = np.full(1 << nv, -1, int64), i.e. 8 * 2^nv bytes:
      128 MiB at nv = 24, 2 GiB at nv = 28 and 32 GiB at nv = 32. The extension
      cells (41,14) and (47,16) therefore cannot run under the 3 GB cap with the
      pinned engine as it stands; they are an amendment matter (a derived
      instrument with C-EQUIV against the pinned one), not a Stage-1 matter.
      The approved cells (nv <= 24) are unaffected.

  controls:
    - id: C-PIN
      what: >-
        Instrument identity: sha256 (and git blob id) of every pinned_instrument
        and archived input equals the table above; numpy version 2.4.6; the
        process limit RLIMIT_AS 3 GiB is set; src/semaev_tree.py bytes equal the
        pinned sha256 and git blob id of the table (and the TASK-20261002-420186
        receipt hash).
      fails_if: >-
        any difference. STOP before any computation; the run is void
        (instrument mismatch; never negative evidence).
    - id: C-SELF
      what: >-
        Before any cell, seed 2026100206000: (1) f_n irreducible for n in
        {17, 23, 35}; (2) field axioms on 10^4 triples at n = 23 and 35;
        (3) the new curve group law, point counting certificate and order
        annihilation on the recorded curves; (4) S_3 against point addition on
        10^3 random pairs at each cell field; (5) the descended f_k against
        direct F_{2^n} evaluation of S_3 on 10^3 random (v, u) per cell; (6) the
        closure engine and the executor's literal brute-force W_D on 5 random
        6-variable systems per D in {3, 4} (dims per iteration, fixpoint index,
        first iteration containing 1); (7) when Sage is available, the new
        descent against src/semaev_tree.py at (23, 8) on 5 targets; (8) oracle A
        against exhaustive 2^{2l} evaluation on every instance at (23, 8) and the
        first 10 at (35, 12) in the executor; (9) wdag-v1 and ann-v1 extractors
        produce certificates accepted by a minimal in-process checker on the
        6-variable systems; (10) the exact CP95 against a brute-force binomial
        sum on 20 (x, N) pairs.
      fails_if: any item fails (item 7 only if run). STOP; the run is void (INV-1).
    - id: C-FIX
      what: >-
        Closure(nv, D, neq) row and column counts equal the Stage-0 table:
        (18, 4, 17) -> 2924 x 4048; (16, 3/4/5, 23) and (24, 3/4/5, 35) equal
        neq * C(nv, <= D - 2) rows and C(nv, <= D) columns; the idea's D = 4
        figures 3151 / 2517 and 10535 / 12951 are reproduced.
      fails_if: any dimension differs. STOP (INV-1).
    - id: C-BASE
      what: >-
        Baseline reproduction (the KN-TECH-080 fixture). On C-BASE-U10 and
        C-BASE-S5 (15 archived n = 17, l = 9 systems, nv = 18, neq = 17): (a) the
        engine at (18, 4, 17) reproduces EXACTLY the archived W_4 record fields of
        RUN-CERTBIN-c417e0 (iterations_to_fixpoint, dims, final_dim, one,
        one_first_iteration, dims_by_deg) and the archived M_3 / M_4 flags and
        ranks; (b) the new inner-instance builder, given the archived target
        x_R as u, produces descended equations equal (as mask lists, neq = 17,
        zero equations retained) to the pinned macaulay.descended_E on all 15.
        The Coordinator added (b): the idea states the inner instance is the
        archived object with the target replaced, so the builder must reproduce
        the archived object when the target is the archived one.
      fails_if: >-
        any per-instance mismatch in (a) or (b). The run is void (INV-3).
    - id: C-EQUIV
      what: >-
        Only if instrumentation is by a subclass or a derived copy of the pinned
        closure (ops counters, wdag-v1 extraction): the instrumented class
        returns identical rank / one / dims / iterations_to_fixpoint /
        one_first_iteration records to the pinned class on the 15 C-BASE
        systems and on the first 10 OBJ instances per cell. A derived COPY of
        closure.py is permitted only if a subclass cannot express the change; the
        pinned file stays unmodified, a unified diff is recorded, and C-BASE is
        re-run against the copy.
      fails_if: any difference. The run is void (INV-3).
    - id: C-ORACLE
      what: >-
        Oracle A's sat flag and solution count equal the verifier's exhaustive
        evaluation (V2) on EVERY instance of every arm; NULL satisfiability
        (executor and verifier exhaustive) agree.
      fails_if: >-
        any disagreement. Every arm-dependent metric of that cell is void
        (INV-4); a disagreement on a SAT/UNSAT label of the OBJ arm voids the run.
    - id: C-PS
      what: >-
        Soundness (Proposition S): no PLANTED instance and no SAT-NAT instance is
        refuted by any closure at any rung that ran (M_3, W_3, M_4, W_4; M_5, W_5
        where run). Reported with the rule-of-three bound 3/20 = 0.15 for 20
        planted instances (derived; instrument false-refutation rate bound at
        95 percent).
      fails_if: >-
        any refutation of a satisfiable instance. The INSTRUMENT is falsified and
        the run is void (INV-5). If the certificate VERIFIES, the label is wrong
        instead and INV-4 applies too.
    - id: C-EASY
      what: >-
        Visibility: every EASY instance (inner object plus l random affine
        relations) is refuted at EVERY rung that completed on it (M_3, W_3, M_4,
        W_4, and M_5, W_5 where run), each by a verified wdag-v1.
      fails_if: >-
        a rung that completed does not refute an EASY instance. The instrument
        cannot see refutation; nothing is reported (INV-9). A rung that ended
        UNDETERMINED(budget) is not a failure.
    - id: C-CERT
      what: >-
        Every refutation the engine reports on any arm is submitted to the
        verifier as wdag-v1 and every counted W_4 non-refutation on OBJ and NULL
        as ann-v1. Counted metrics use VERIFIED certificates only.
      fails_if: >-
        any SUBMITTED certificate fails verification: the closure or the
        extraction is wrong, the run is void (INV-6). An UNCERTIFIED refutation
        (no certificate produced) is not a failure: it is reported, not counted,
        and enters L1 / L2 and the 20 percent rule (INV-10).
    - id: C-VERIFIER
      what: >-
        The verifier's own f_0..f_{n-1} equal the executor's on every curve-
        algebra instance (OBJ, SAT-NAT, PLANTED, RANDU, EASY base) and the
        verifier rejects at least 20 corrupted certificates built by the executor
        from verified ones: one pair removed; one k changed; one child edge
        redirected so that a child degree bound (c) is violated; one node made to
        exceed the degree bound (d); one ann-v1 functional bit flipped so that
        (A1), (A2) or (A3) fails.
      fails_if: any construction disagreement or any corrupted certificate accepted (INV-6).
    - id: C-NULLS
      what: >-
        The NULL arm runs through the identical closure code path as OBJ (the
        sha256 of the closure module is recorded per arm and equal); every null
        instance has n equations whose supports lie in U_cell; every null system
        is unsatisfiable by exhaustive evaluation (executor and verifier).
      fails_if: a code-path hash differs or a structural identity fails (the null comparisons are void).
    - id: C-MONO
      what: >-
        Monotonicity on every instance and closure that ran. The Coordinator's
        inclusions (as subspaces of B_{<=5}): M_3 <= M_4 <= M_5, M_3 <= W_3,
        M_4 <= W_4, W_3 <= W_4 <= W_5, M_5 <= W_5. Hence a verified or
        engine-reported refutation by a smaller closure implies one by every
        larger closure that ran (M_3 => W_3, M_4, W_4, M_5, W_5; W_3 => W_4, W_5;
        M_4 => W_4, M_5, W_5; W_4 => W_5; M_5 => W_5).
      fails_if: any violation. The run is void (INV-3).
    - id: C-DET
      what: >-
        Determinism in a SEPARATE process: M_4, W_4 (and M_5 on the cell's first
        3 OBJ instances where it ran) recomputed on the 5 lowest-draw-index OBJ
        and 3 PLANTED instances per cell.
      fails_if: >-
        any difference in rank, 'one', dims, iterations_to_fixpoint or
        first iteration containing 1. The run is void (INV-7).
    - id: C-GATE
      what: >-
        Gate G1 (RQ-ECDLP-f0a7b0 scope: toy-scale instrument validity before
        larger parameters): the verifier is run on the (23, 8) outputs and
        C-PIN, C-SELF, C-FIX, C-BASE, C-EQUIV, C-ORACLE, C-PS, C-EASY, C-CERT,
        C-VERIFIER, C-NULLS, C-MONO pass on (23, 8) BEFORE the (35, 12) stream is
        drawn.
      fails_if: >-
        any check fails. Cell (35, 12) is not started; the run is void
        (instrument).
    - id: C-LOOP
      what: >-
        The idea's wrapper regression (certificate multiset equality of the
        wrapper against the (m - 1)-loop on 20 attempts per wrapper cell).
      status: >-
        DEFERRED with Stage 2; not a Stage-1 control and not a Stage-1 void
        condition.

  independent_variables:
    - cell  # (23,8) | (35,12)
    - arm  # OBJ | SAT-NAT | NULL | PLANTED | EASY | RANDU
    - closure  # M_3 | W_3 | M_4 | W_4 | M_5 | W_5
    - satisfiability  # unsat | sat (always reported separately, RQ-ECDLP-f0a7b0 constraint)

  metrics:
    primary:
      - id: MR-r4
        name: r_4(cell, arm)
        definition: >-
          Verified W_4 refutations among the unsatisfiable instances of the arm
          (OBJ, NULL, RANDU), with exact Clopper-Pearson 95 percent interval,
          computed under labelling L1 (UNDETERMINED and UNCERTIFIED counted as
          not refuted), L2 (excluded from the denominator) and the adverse
          worst case r_4^+ (UNDETERMINED, UNCERTIFIED refutations and
          NOT_REFUTED(uncertified) counted as refuted).
      - id: MR-r3
        name: r_3(cell, arm)
        definition: same as MR-r4 for verified W_3 refutations (M_3 refutations count as W_3 by monotonicity when verified).
      - id: MR-r5
        name: r_5(cell, arm)
        definition: >-
          Verified M_5 or W_5 refutations among the instances on which D = 5 ran
          (the sets of object.closures_run); instances UNDETERMINED(budget) at
          D = 5 are reported separately, never as not refuted.
      - id: MR-rho
        name: least refuting rung distribution
        definition: >-
          Per cell and arm the counts of rho in {3, 4, >=5} (refined to 5 and >5
          where D = 5 data exist), with the maximum rho observed (tail check).
      - id: MR-null
        name: null_rung(cell) and S_3-ABOVE-NULL
        definition: >-
          The modal rho over the NULL arm per cell (a tie counts as not at the
          counting rung) and the S_3-ABOVE-NULL flag (decision_rules EB-DR-7).
      - id: MR-sound
        name: refuted satisfiable controls (count)
        definition: C-PS counts per cell and rung, SAT-NAT and PLANTED separately.
      - id: MR-easy
        name: easy-control refutations per rung
        definition: C-EASY counts per rung.
      - id: MR-cost
        name: per-node C_W against the size law
        definition: >-
          Mean (with max beside it) of ops_to_1 over OBJ instances verified
          refuted at W_4, in GF(2) 64-bit-word XOR operations (definition under
          ops_counting), against the Stage-0 size-law value at the cell; the
          ratio measured / law.
    secondary:
      - first iteration containing 1 per refuted instance (W_D)
      - 'ops_to_1, ops_to_fix per instance and their ratio (distributions, max beside mean)'
      - 'oracle A cost per inner instance (field operations) and the host conversion constant to GF(2) word operations'
      - 'certificate sizes (nodes, pairs, bytes) and separate-process check cost per refuted node'
      - 'dims_by_deg and dimension of W_4 per instance (the non-semi-regular signature; compare to the null)'
      - 'H1 reading, CP95 overlap of r_4 (OBJ) against r_4 (RANDU), and the maximum rho in each'
      - 'termination_reason per closure (completed | UNDETERMINED(budget) | memory_abort | crash); peak RSS; wall time'
      - the Stage-0 table, size law and l* under H2 as deliverables (modeled, never mixed with measured columns)
    primary_unit: verified refutations (counts of instances)
    ops_counting: >-
      ops = sum over the pivots of a column-pass echelon of |X| * (W - (c >> 6)),
      where X is the set of rows that received the pivot row, c the pivot column
      and W the number of 64-bit words per row (the XOR is M[X, w:] ^= M[p, w:]).
      ops_to_1 sums the echelons up to and including the first that contains 1;
      ops_to_fix sums all echelons including the one that confirms the fixpoint.
      Product-row construction and certificate extraction are not counted. The
      pinned closure.py keeps the logs only until 1 is first seen and only when
      certificates are requested, so the counters live in an instrumenting
      subclass checked by C-EQUIV.

  preregistered_prediction:
    quantity: >-
      The predictions of IDEA-20260930-b26bbc / H-ECDLP-1f1111 restricted to the
      approved cells: r_4 at (23,8) and (35,12); null_rung; r_3; 0 refuted
      satisfiable controls; the cost-law deviation. Prior carried from the idea:
      about 0.45 on E-BOUNDED (two certified diagonal cells; overdetermination
      changes the fall structure off the diagonal).
    formula: >-
      E-BOUNDED: r_4 >= 0.90 at every ladder cell including (35,12) and (41,14).
      E-DECAY: r_4 <= 0.50 at any cell where it was >= 0.90 at a smaller cell.
      E-DRIFT: least refuting rung at (35,12) or (41,14) >= 5 on >= 50 percent of
      instances. Null: modal rho equals the Stage-0 counting rung (4 at (23,8),
      5 at (35,12)). Soundness: 0 refutations of satisfiable instances.
    source: >-
      IDEA-20260930-b26bbc claim, predictions, minimal_test and
      falsification_conditions, fixed before any W_D value exists for these cells.
    claim_tier: toy
    measured_vs_modeled: >-
      MEASURED (instrumented run with manifest): every rate, rung, ops count,
      oracle cost, certificate size, RSS, wall time. RECOMPUTED (arithmetic):
      the Stage-0 counting table and power table. MODELED (formula, source
      named): the size law (rows x rank x words, Stage 0), l* under H2, any
      n = 131 figure, the semi-regular series references. The columns never mix.

  heuristic_under_test:
    - HEUR-ECDLP-1f1111-H1
    - HEUR-ECDLP-1f1111-H2
  heuristic_not_tested:
    - HEUR-ECDLP-1f1111-H2-TAIL (not testable at Stage 1; see interpretation_limits)
    - HEUR-ECDLP-1f1111-H3 (Stage 2)

  # ---------------------------------------------------------------------------
  # DECISION RULES. Thresholds copied from the idea; each cites its source field.
  # Applied mechanically after instrument checks pass (EB-DR-0).
  # ---------------------------------------------------------------------------
  decision_rules:
    notation: >-
      N(c) = number of unsatisfiable OBJ instances kept at cell c (60 unless a
      shortfall is recorded). r_4(c) is MR-r4 on OBJ under L1 unless a rule says
      otherwise. r_4^+(c) is the adverse worst case. 'Evaluable' says whether the
      rule can be issued on the approved cells.
    rules:
      - id: EB-DR-0
        name: instrument gate
        rule: >-
          If any ARTIFACT trigger holds (invalidation_rules INV-1..INV-10), the
          run is void and no verdict row below is issued from it. A void run
          says nothing.
        source: idea minimal_test OUTCOME TABLE (ARTIFACT) and falsification_conditions (instrument falsified)
        evaluable: true
      - id: EB-DR-1
        name: E-BOUNDED-PARTIAL
        rule: >-
          r_4(c) >= 0.90 under BOTH L1 and L2 at (23,8) AND at (35,12); the NULL
          arm's modal rho equals the Stage-0 counting rung at each of those cells
          (4 at (23,8); '>=5' at (35,12)); 0 refuted satisfiable controls (C-PS).
          Also reported at each cell: the strict reading (CP95 LOWER bound of
          r_4 >= 0.90, which at N = 60 needs at least 59 of 60 verified,
          derived) and S_3-ABOVE-NULL (EB-DR-7). The full E-BOUNDED row is NOT
          issued: it needs (41,14) (not authorized).
        source: >-
          idea outcome table E-BOUNDED (r_4 >= 0.90 at (35,12) and (41,14), null
          at its counting rung, 0 refuted controls) and predictions block
        evaluable: partial (E-BOUNDED-PARTIAL only)
      - id: EB-DR-2
        name: E-DRIFT-SUPPORTED
        rule: >-
          At (35,12) the fraction of unsatisfiable OBJ instances with least
          refuting rung >= 5 is >= 0.50 (equivalently r_4^+(35,12) <= 0.50, with
          the adverse worst-case counting, so that every instance not refuted at
          W_4 is certified by ann-v1 or counted as refuted).
        source: idea predictions 'E-DRIFT iff the least refuting rung at (35,12) or (41,14) is >= 5 on >= 50 percent of instances'
        evaluable: true at (35,12); (41,14) not authorized
      - id: EB-DR-3
        name: E-DRIFT falsified
        rule: >-
          The least refuting rung is <= 4 on >= 90 percent of unsatisfiable inner
          instances at BOTH (35,12) and (41,14).
        source: idea minimal_test FALSIFICATION THRESHOLDS and falsification_conditions
        evaluable: false (needs (41,14)); recorded 'not evaluable on the approved cells', no substitute threshold is invented
      - id: EB-DR-4
        name: E-BOUNDED falsified
        rule: >-
          r_4^+ <= 0.50 at (35,12) or at (41,14) (verified refutations only; the
          adverse worst-case counting).
        source: idea minimal_test FALSIFICATION THRESHOLDS and falsification_conditions
        evaluable: true at (35,12)
      - id: EB-DR-5
        name: E-DECAY
        rule: >-
          r_4 <= 0.50 at a cell where r_4 was >= 0.90 at a smaller cell (the
          approved pair: (23,8) >= 0.90 and (35,12) <= 0.50, the latter by
          r_4^+).
        source: idea claim and predictions (E-DECAY)
        evaluable: true
      - id: EB-DR-6
        name: decay falsification of the exponent reading
        rule: >-
          r_4 at (23,8) exceeds r_4 at (41,14) by more than 0.4, even if both
          exceed 0.5.
        source: idea falsification_conditions
        evaluable: false (needs (41,14))
      - id: EB-DR-7
        name: S_3-ABOVE-NULL (per cell)
        rule: >-
          S_3-ABOVE-NULL at a cell iff the CP95 lower bound of the object's
          r_4 (L1) exceeds the CP95 upper bound of the null's r_4 (adverse worst
          case for the null). Falsified at the cell iff the null's CP95 upper
          bound reaches the object's CP95 lower bound.
        source: idea predictions (null_rung) and falsification_conditions
        evaluable: true per approved cell
        reading_note: >-
          Inherited boundary (KN-FIND-c3a917): 'above the null' means the
          object's M_4 is not semi-regular and its falls suffice; it is not
          S_3-specificity (the tensor neighbourhood refutes alike at W_4).
      - id: EB-DR-8
        name: E-W3
        rule: r_3 >= 0.50 at (17,6) and (23,8). Reported; no direction preferred.
        source: idea predictions (r_3)
        evaluable: partial (23,8) only; (17,6) is a Stage-2 cell
      - id: EB-DR-9
        name: cost law
        rule: >-
          Falsified iff the measured per-node C_W (MR-cost) deviates from the
          Stage-0 size law value by more than a factor 10 (ratio > 10 or
          < 0.1) at any cell.
        source: idea falsification_conditions
        evaluable: true per approved cell where at least one OBJ instance is verified refuted at W_4
      - id: EB-DR-10
        name: INTERMEDIATE
        rule: >-
          0.50 < r_4(35,12) < 0.90 (L1, with r_4^+ > 0.50), instruments valid:
          no outcome-table row fires; E-BOUNDED is neither established nor
          falsified at (35,12); report the rung distribution; a follow-up is a
          new decision. (The idea's table has no row for this band; this row
          records the gap and adds no threshold.)
        source: logical complement of EB-DR-1 / EB-DR-2 / EB-DR-4 on (35,12); adds no number
        evaluable: true
      - id: EB-DR-11
        name: NOT-DISCRIMINATING
        rule: >-
          At a cell the NULL arm's modal rho is below the Stage-0 counting rung
          (null refuted at W_4 where the counting rung is 5) or is tied: readings
          (i) structure and (ii) overdetermination are not separated there;
          E-BOUNDED-PARTIAL is not issued even if r_4 >= 0.90.
        source: idea mechanism / proof_search_map observation_collision ('a rate that tracks the null's is reading (ii)')
        evaluable: true
      - id: EB-DR-12
        name: H1 transfer reading
        rule: >-
          H1 consistent at a cell iff the CP95 intervals of r_4 (OBJ) and
          r_4 (RANDU) overlap; the within-0.05 statement is not resolvable at
          60 and 30 instances and is reported as such. Tail: the maximum rho in
          each arm.
        source: idea heuristic H1 validation_plan
        evaluable: true
    precedence: >-
      EB-DR-0 first. Then EB-DR-11 may block EB-DR-1 at a cell. EB-DR-2, EB-DR-4
      and EB-DR-5 are not exclusive of one another (a cell with r_4^+ <= 0.50
      fires EB-DR-2 and EB-DR-4, and EB-DR-5 when (23,8) was >= 0.90). EB-DR-1
      excludes EB-DR-2, EB-DR-4, EB-DR-5, EB-DR-10 by definition of the
      thresholds.
    positive_outcome_meaning: >-
      E-BOUNDED-PARTIAL: H2 survives its first off-diagonal test at the first
      approved cell where degree 4 is not generic; the Coordinator may
      authorize the (29,10) and (41,14) extension by amendment; the full
      E-BOUNDED row, and Stage 2, wait for it. It is NECESSARY, NOT SUFFICIENT,
      for the exponent law (RATE IS NOT EXPONENT).
    negative_outcome_meaning: >-
      EB-DR-2 / EB-DR-4 / EB-DR-5: the m = 2 W_4 refutation is, for exponent
      purposes, a diagonal / overdetermination fact at the tested cells
      (KN-OPEN-3c8f51 item (B) answered negatively at ratio 3 for this curve,
      basis and engine); the bounded-degree inner-theory route is not pursued on
      this ray at this closure. The Coordinator records `weaken` plus the
      replication owed (a second curve per n), and uses reject_scoped only on a
      replicated outcome or a proven boundary: a single unreplicated
      empirical-only run never supports reject_scoped (docs/claims-and-verification.md).
      Because each counted non-refutation carries an ann-v1 counterexample
      certificate (or the worst-case rule), the adverse reading rests on
      checkable artifacts, not on engine records.

  local_ambiguity_rules:
    - id: LA-1
      text: >-
        'rate >= 0.90 (CP95)' (idea claim) versus 'r_4 >= 0.90' (idea
        predictions): decided on the POINT estimate, the CP95 interval reported
        beside it, and the strict reading (CP95 lower bound >= 0.90) reported as
        a flag. Fixed now; neither reading is hidden.
    - id: LA-2
      text: >-
        'UNDETERMINED(budget) on more than 20 percent of a cell's instances at the
        primary rung: void' is CARRIED VERBATIM and applied to the RUN (the
        idea's ARTIFACT row voids the outcome; no verdict row is issued from a
        void run). The PRIMARY RUNG is W_4. The dispatcher may re-run under
        maximum_runs (a re-run is a new run under the same frozen contract; the
        void run's data stays archived and is not evidence). UNCERTIFIED
        refutations (an engine refutation without a verified certificate) are NOT
        added to the 20 percent count: they are handled by the L1 / L2 labellings
        (a verdict row must hold under both, otherwise the reading is
        'UNDETERMINED (budget or certification)' with both labels shown, after
        the precedent of EXP-CERTBIN-e94b27 RC1-DR-2).
    - id: LA-3
      text: >-
        'least refuting rung': defined under object.rungs_and_labels. rho >= 5 iff
        W_4 does not refute (W_4 contains M_3, W_3, M_4).
    - id: LA-4
      text: >-
        'null at its counting rung': the unique modal rho over the NULL arm
        equals the Stage-0 counting rung ('>=5' when the rung is 5 or 6).
    - id: LA-5
      text: >-
        'union support of the n descended equations': pooled union over all n
        equations of all kept OBJ and SAT-NAT instances of the cell (not per
        equation k), contained in U_template.
    - id: LA-6
      text: >-
        'lexicographically least irreducible of degree n': least integer value
        with bit i the coefficient of t^i and bit n set.
    - id: LA-7
      text: >-
        'cost of one inner W_D decision' C_W: mean ops_to_1 over OBJ instances
        verified refuted at W_4 (max beside it); the size-law comparator is the
        Stage-0 exact-binomial form R_4 * C_4 * (C_4 / 64) with R_4 = n C(2l, <= 2)
        and C_4 = C(2l, <= 4), and the leading-term form 0.0417 l^11 is reported
        beside it; the rule uses the exact-binomial form.
    - id: LA-8
      text: >-
        'first 20 unsatisfiable per cell' for M_5 / W_5: the first 20 in draw
        order of EACH unsatisfiable arm named in object.closures_run.
    - id: LA-9
      text: >-
        'every rung must refute' (easy control): every rung that completed;
        rungs ending UNDETERMINED(budget) are not observed and are not failures.
    - id: LA-10
      text: >-
        'kept until 60 unsatisfiable and 20 satisfiable': see OBJ.keep_rule (cap
        20000 attempts for SAT-NAT; PLANTED carries the soundness control).
    - id: LA-11
      text: >-
        wdag-v1 for D = 3 and 5: the Coordinator's generalisation under
        object.certificate_formats.wdag_v1.
    - id: LA-12
      text: >-
        Any case the rules do not cover is recorded 'not evaluable' with its
        reason; NO threshold is added or changed after data. A change needs a
        versioned protocol_amendment.

  tail_checks:
    - >-
      EXACT ARITHMETIC. Every binomial interval and tail is computed with exact
      integer / rational arithmetic (math.comb and fractions) or log-space
      summation at >= 50 significant digits; floating-point survival functions
      are never used for a tail below 1e-12.
    - >-
      Maximum least refuting rung per cell and arm; the fraction UNDETERMINED
      (budget); the largest ops_to_1 beside the mean (heavy-tail check).
    - >-
      H2-TAIL honesty: the exact CP95 upper bound on the non-refuted fraction at
      60/60 is reported next to 2^{-l} (about 0.0039 at l = 8 and 0.00024 at
      l = 12, derived) to show the exponent tail is not resolved.

  scale_relevance:
    tier: toy
    justification: >-
      Two cells, n = 23 and 35, l = 8 and 12, one curve per n, polynomial basis.
      (35, 12) lies beyond the typical l in 6..9 of RQ-ECDLP-f0a7b0's toy scope
      and is therefore gated on the toy-scale instrument-validity gate G1. Nothing
      transfers to n = 41, 47, 131, to other curves or bases, or to the m = 3
      wrapper without measurement.
    correspondence: >-
      n = 3 l is the ratio at which relation collection at m = 3 would operate;
      the diagonal n = 2 l - 1 of the certified cells is the ratio at which it
      would not.

  optimistic_assumptions:
    - assumption: H2 (bounded refuting degree) extrapolated from two cells
      bias_direction: >-
        Overstates the case for a bounded D_0; two cells are not a trend, and the
        extrapolation to l = 44 is the largest step in the record.
    - assumption: A rate near 1 is read as 'near 1' for the exponent
      bias_direction: >-
        Overstates the exponent consequence: the exponent needs the non-refuted
        fraction <= poly(l) 2^{-l} (H2-TAIL), which Stage 1 cannot test.
    - assumption: GF(2) word-operation counts are engine-independent
      bias_direction: >-
        A compiled engine changes C_W's constant, not the size law; l* moves with
        the constant and is labelled an extrapolation.
    - assumption: Oracle A's cost and ops counts ignore memory traffic
      bias_direction: Understates the closure's wall-clock cost at larger cells.
    - assumption: One curve per n
      bias_direction: >-
        Curve, cofactor and modulus change together along the ladder; a
        replication on a second curve per n is owed.

  memory_accounting: >-
    Peak RSS is a first-class metric (RLIMIT_AS 3 GiB). Analytic sizes
    (derived by the Coordinator; Stage 0 reconciles): the Macaulay matrix is
    R x ceil(C / 64) 64-bit words with R = n C(nv, <= D - 2) and C = C(nv, <= D):
    D = 4 at (23, 8) about 3151 x 40 words (about 1.0 MB); at (35, 12)
    10535 x 203 words (about 17 MB); the pinned engine's mask2col is 8 * 2^nv
    bytes (0.5 MB at nv = 16, 128 MiB at nv = 24). The W_4 stack adds up to
    nv * (new low-degree rows) product rows. D = 5 at (35, 12) has C = 55455
    columns (867 words) and R = 35 * 2325 = 81375 rows before products, about
    565 MB before the mutant stack and logs, hence the UNDETERMINED(budget)
    provision. Measured peak_rss_bytes is reconciled against these analytic
    sizes in the run report.

  hidden_overhead_honesty: >-
    The idea's headline exponent hides a degree-11 polynomial in l with constant
    about 0.04 word operations (rows about 6 l^3, columns about (2 l)^4 / 24,
    echelon rows x rank x words), which is about 2^55 at l = 44, so the
    conditional pipeline is above the loop at n = 131 until l* (idea: about 50;
    the Coordinator derived that this implies a per-node loop cost of about
    1.8 x 10^2 word operations, the unit being unstated by the idea). Also hidden:
    the Poisson half of H3, the engine constant, the oracle A fallback on the
    non-refuted fraction (H2-TAIL), and the W_4 working set about 1.27 x 10^12
    bits at l = 44. Stage 0 states these rather than glossing them.

  standardized_parameter_sets:
    - name: Stage1-cell-23-8
      n: 23
      l: 8
      nv: 16
      neq: 23
      arms: [OBJ60, SAT-NAT<=20, NULL30, PLANTED20, EASY10, RANDU30]
    - name: Stage1-cell-35-12
      n: 35
      l: 12
      nv: 24
      neq: 35
      arms: [OBJ60, SAT-NAT<=20, NULL30, PLANTED20, EASY10, RANDU30]
    - name: CBASE-n17-l9
      n: 17
      l: 9
      nv: 18
      neq: 17
      systems: 15 archived
    - name: Extrapolation-ECC2K-130-labelled
      n: 131
      l: 44
      note: modeled only (size law and l* in Stage 0); nothing measured
  affected_vs_safe_scope: >-
    AFFECTED (a measurement of refutation degree on toy inner instances): none
    of any deployed system. SAFE / untouched: every deployed or standardized
    curve; ECC2K-130 (the product law closes m = 3 and m = 4 regardless); prime
    fields; non-subspace V. No security statement and no exponent claim is made
    or tested.

  replication:
    seeds: [2026100200023, 2026100200035, 2026100201023, 2026100201035, 2026100202023, 2026100202035, 2026100203023, 2026100203035, 2026100204023, 2026100204035, 2026100205023, 2026100205035, 2026100206000]
    independent_instances: >-
      Per cell: 60 OBJ unsatisfiable + up to 20 SAT-NAT + 30 NULL + 20 PLANTED +
      10 EASY + 30 RANDU, two cells (about 340 inner instances) plus 15 archived
      C-BASE systems.
    sample_size_justification: >-
      The idea fixes 60 unsatisfiable object instances, 30 nulls, 20 planted, 10
      easy and 30 random-u per cell; they are NOT advisory. Derived by the
      Coordinator from the smallest probability to resolve: at the threshold
      r = 0.90 the expected number of non-refuted instances in 60 is 6 (multiple
      6 of 1); at the falsification threshold 0.50 it is 30; an all-refuted cell
      has CP95 lower bound 0.025^(1/60), about 0.9404 (formula; Stage 0
      recomputes exactly), so 'CP95 lower bound >= 0.90' at N = 60 needs at least
      59 of 60. 20 zero-refutation planted instances bound an instrument
      false-refutation rate by 3/20 = 0.15 at 95 percent (rule of three,
      derived). Exact power and CP95 tables are Stage-0 deliverables
      (stage0/power-table.yaml).
    plan: >-
      Within-run: closures of different kinds (M and W) at several degrees on the
      same instances, a C-DET separate-process recompute, a null ladder and a
      random-u arm. Cross-curve replication of the rate (a second curve per n) is
      the first replication owed and is NOT in this design.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    watchdog_seconds: 172800
    total_cpu_hours: null
    maximum_memory_gb: 3
    maximum_runs: 3
    maximum_workers: 1
  budget_note: >-
    ECC is unbudgeted (CLAUDE.md rule 11; docs/research-budget-policy.md). The
    run watchdog (48 h, with per-phase checkpoint and --resume) and the
    per-instance watchdog (14,400 s) are machine protection; expiry is never a
    result. maximum_runs = 3: one scientific run plus up to two re-runs after
    INFRASTRUCTURE failures, every failed attempt retained (a run id minted per
    attempt by tools/allocate_id.py --next run if the tool supports it, else
    the executor records how the id was formed). The idea's estimate (order of
    magnitude, not a measurement): Stage 1 'minutes per instance up to
    (35, 12)' in the pure-Python engine and 10^1 to 10^2 CPU-hours for the whole
    four-cell ladder; here two cells. Natural-satisfiable collection at
    (35, 12) costs at most 20000 x 4096 root-findings (derived upper bound).
    Fixed scientific sample counts above are NOT truncated by advisory
    wall-clock; a shortfall is recorded as failed_infrastructure, never as a
    mathematical miss.

  stopping_rules:
    - id: SR-1
      rule: >-
        Instance sets are fixed by seed, stream rule and keep rule. None is
        extended, trimmed or reordered after any closure output (the SAT-NAT
        continuation past the 60th unsatisfiable attempt is part of the frozen
        keep rule).
    - id: SR-2
      rule: >-
        C-PIN, C-SELF, C-FIX, C-BASE, C-EQUIV or a Stage-0 self-check failure
        stops the run before any cell. The failed attempt is retained.
    - id: SR-3
      rule: >-
        Watchdog expiry, a crash or an out-of-memory event checkpoints (one
        checkpoint per closure per arm per cell) and resumes with --resume. It
        is never a result. A per-instance expiry labels the closure
        UNDETERMINED(budget).
    - id: SR-4
      rule: No D >= 6 closure is computed in this contract, whatever the outcome.
    - id: SR-5
      rule: >-
        Cell (35, 12) is not started until gate G1 (C-GATE) passes on (23, 8).
    - id: SR-6
      rule: >-
        If a certified (verified) refutation of a PLANTED or SAT-NAT instance
        appears, stop the cell, archive the instance and certificate, and do not
        continue until the Coordinator decides (INV-5).

  invalidation_rules:
    - {id: INV-1, rule: 'C-SELF or C-FIX failure: the run is void (stop).'}
    - {id: INV-2, rule: 'C-PIN failure (instrument identity mismatch, numpy version, semaev_tree.py bytes differing from the pinned sha256 or git blob): the run is void (stop); never negative evidence.'}
    - {id: INV-3, rule: 'C-BASE, C-EQUIV or C-MONO failure: the run is void.'}
    - {id: INV-4, rule: 'C-ORACLE disagreement: every arm-dependent metric of the cell is void; a disagreement on an OBJ label voids the run.'}
    - {id: INV-5, rule: 'C-PS failure (any refuted satisfiable instance): the instrument is falsified; the run is void and is not evidence about H-ECDLP-1f1111.'}
    - {id: INV-6, rule: 'C-CERT (a submitted certificate fails) or C-VERIFIER failure: MR-r3, MR-r4, MR-r5 and the decision rules are void.'}
    - {id: INV-7, rule: 'C-DET mismatch: the run is void.'}
    - {id: INV-8, rule: 'A void run is an implementation failure (AGENTS.md core rule 5). It says nothing about S_3 or the refutation degree.'}
    - {id: INV-9, rule: 'C-EASY failure (an EASY instance not refuted at a rung that completed): the instrument cannot see refutation; nothing is reported for that cell and the run is void.'}
    - {id: INV-10, rule: 'UNDETERMINED(budget) on more than 20 percent of a cell''s instances at the primary rung (W_4): void (the idea''s ARTIFACT row, carried verbatim and applied to the run; a re-run under maximum_runs is a new run; UNCERTIFIED refutations are handled by the L1 / L2 labellings, not by this count).'}
    - {id: INV-11, rule: 'Mixing measured and modeled numbers in one reported column invalidates the cost and l* tables.'}
    - {id: INV-12, rule: 'Changing a threshold, an outcome row or a falsification condition after observing any outcome without a versioned protocol_amendment invalidates interpretation; no amendment is retroactive.'}
    - {id: INV-13, rule: 'Reading a result as evidence for an exponent, a cost reduction, an ECDLP statement, or for any cell not run invalidates the report.'}
    - {id: INV-14, rule: 'Stage 0 files not hash-recorded before the first closure invocation invalidate the stream rule (the instances could have been steered).'}

  success_criterion: >-
    The run succeeds iff C-PIN, C-SELF, C-FIX, C-BASE, C-EQUIV (if applicable),
    C-ORACLE, C-MONO, C-PS, C-EASY, C-CERT, C-VERIFIER, C-NULLS, C-DET and C-GATE
    pass; every instance of every arm has a label for every closure that was due
    to run; the Stage-0 deliverables exist with their hashes preceding the first
    closure invocation; and EB-DR-0 .. EB-DR-12 each return a verdict or 'not
    evaluable' with its reason. E-BOUNDED-PARTIAL, E-DRIFT-SUPPORTED, E-DECAY,
    INTERMEDIATE and NOT-DISCRIMINATING are all successes (informative
    outcomes); a void run is not.

  falsification_criterion: >-
    E-BOUNDED is falsified iff r_4 <= 0.50 at (35,12) or (41,14) (verified
    refutations only; evaluable at (35,12)). E-DRIFT is falsified iff the least
    refuting rung is <= 4 on >= 90 percent of unsatisfiable inner instances at
    both (35,12) and (41,14) (not evaluable on the approved cells). S_3-ABOVE-NULL
    at a cell is falsified iff the null CP95 upper bound at W_4 reaches the
    object CP95 lower bound. The exponent reading is falsified at toy scale iff
    r_4 at (23,8) exceeds r_4 at (41,14) by more than 0.4 (not evaluable on the
    approved cells). The cost law is falsified iff the measured per-node C_W
    deviates from the size law by more than a factor 10 at any cell. NOT
    falsification: a void run (INV-1..INV-10), a watchdog expiry, a
    memory abort, an UNCERTIFIED or UNDETERMINED(budget) instance.

  coordinator_prior: >-
    Written before any run; no W_D value exists for these cells. A prior, not a
    prediction; it changes no threshold. The idea's own prior of about 0.45 on
    E-BOUNDED is carried unchanged. (a) At (23, 8) r_4 is at or near 1 by
    overdetermination (high confidence) and carries no structural content.
    (b) At (35, 12) the outcome is genuinely open; the intermediate band
    0.50 < r_4 < 0.90 has no pre-assigned mass and is a real possibility because
    the certified cells were W_4-saturated (400/400) where the ceiling hides
    differences. (c) The likeliest place for this prior to be overturned is the
    null: if the same-support null is refuted at W_4 at (35, 12) the cell is
    NOT-DISCRIMINATING. (d) The exponent consequence of a positive outcome is
    weaker than the idea's claim text suggests (RATE IS NOT EXPONENT).

  proof_search_map_audit:
    performed_by: coordinator (DEC-20261002-dd642f), before approval
    audit_file: coordination/design/TASK-20261002-420186/proof-search-map-audit.yaml
    baseline_fixture: >-
      C-BASE (15 archived W_4 records and the builder equivalence), C-FIX
      (2924 x 4048 at (18,4,17); the idea's D = 4 counts at both approved cells),
      and the Stage-0 table of semi-regular references (8 idea figures).
    observation_collision: >-
      A refutation counts only with a verified wdag-v1; a non-refutation counts
      adversely only with an ann-v1 (or the worst-case rule). S62-type
      collision search is carried by the PLANTED and SAT-NAT arms. The known
      structural collision (tensor neighbourhood, not S_3-specific) is inherited
      from KN-FIND-c3a917 and stated in EB-DR-7's reading note.
    quantifier_order: >-
      Stated in the hypothesis. The cell quantifier is attacked at two cells;
      the Coordinator-derived rate-versus-tail gap (H2-TAIL) is recorded and is
      not testable at Stage 1.
    method_ceiling: >-
      W_D is a degree-bounded closure: a non-refutation at W_5 is a statement
      about derivations whose a-priori degree stays <= 5, not a proof that no
      higher-degree refutation exists, and not an F4 step degree. The
      nearby-object controls are the NULL, PLANTED, EASY and RANDU arms.
    verdict: >-
      No audit failure for Stage 0-1; one derived gap (rate versus exponent tail)
      recorded as an interpretation limit and an unmet quantifier requirement of
      the idea's EXPONENT claim, not of this experiment's measurement.

  attention_contract:
    decisive_evidence: >-
      EB-DR-1 / EB-DR-2 / EB-DR-4 / EB-DR-5 / EB-DR-11 on verified wdag-v1 and
      ann-v1 certificates at (35, 12), with (23, 8) as the generic-cell and gate
      reference.
    positive_next_decision: >-
      E-BOUNDED-PARTIAL: decide the amendment adding (29, 10) and (41, 14)
      (including a derived instrument for the 2 GiB mask2col at nv = 28); the full
      E-BOUNDED row, then the Stage-2 design (wrapper at (17,6) and (23,8), C-LOOP,
      H3 validation) and a heuristic-validation pairing for H2 beyond the toy
      range (cells (47,16), (53,18)); also decide a tail test of H2-TAIL (a large
      zero-failure sample at a cell where degree 4 is not generic), which this
      design names and does not approve.
    negative_next_decision: >-
      E-DRIFT-SUPPORTED / E-BOUNDED falsified / E-DECAY: record `weaken` with the
      replication owed (a second curve per n at (35,12)); close the bounded-degree
      inner-theory route on this ray only through the closure standard (an
      obstruction block with the rung-versus-cell table over the stated scope)
      after replication; Stage 2 is not designed.
    inconclusive_decision: >-
      INTERMEDIATE or NOT-DISCRIMINATING or a void run: a successor with a
      second curve, a larger N, or the N-CONV nearby object, chosen by a new
      decision.
    local_ambiguity_rule: Any case the rules do not cover is recorded 'not evaluable' with its reason; no threshold is added after data.
    peripheral_exclusions: ['Stage 2', 'SAT/SMT', 'cells beyond (35,12)', 'D >= 6', 'a second curve per n', 'deployed curves']
    rerank_trigger: Completion of the run (or a void result) triggers the ECDLP/SATIC rerank.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Nothing at n = 131 is measured; l* and every 2^{2n/3} figure
      are extrapolations under H2 and are labelled so wherever they appear.
    - >-
      RATE IS NOT EXPONENT. A positive Stage-1 outcome bounds the rate of
      bounded-degree refutation at two cells; it cannot exclude a constant
      non-refuted fraction, which leaves the per-attempt exponent at 2 l
      (H2-TAIL, derived by the Coordinator from the idea's own cost formula).
      95 percent exclusion of a non-refuted fraction 2^{-l} needs about 3 x 2^l
      zero-failure samples (768 at l = 8, 12288 at l = 12; derived, recomputed in
      Stage 0).
    - >-
      THIS DOES NOT TOUCH THE PRODUCT LAW ON ECC2K-130; the free-oracle floor at
      m = 3 (2^68.58, KN-FIND-aa2efc, unreviewed in this program) exceeds rho's
      2^60.81 regardless.
    - >-
      A W_D non-refutation is a degree-D statement, never a hardness claim; a
      refutation rate is not a solve; nothing here is evidence for or against
      Semaev's Assumption 1 as stated for the chained system (the inner object
      is m = 2 and the closure is a Macaulay-type closure, not an F4 step degree).
    - >-
      At (23, 8) degree 4 is generic by counting: a high r_4 there carries no
      structural content. 'Above the null' does not mean S_3-specific.
    - >-
      Two cells are not a trend; one curve per n (curve, cofactor and modulus
      change together); the polynomial basis only; KN-OPEN-020's scoped-out class
      of V is not escaped; nothing transfers to prime fields.
    - >-
      Stage 2, the wrapper, the per-attempt cost law, H3 validation, any SAT/SMT
      arm and the cells (29,10), (41,14), (47,16) are NOT authorized. The
      asymptotic-complexity promotion gates are not met.

