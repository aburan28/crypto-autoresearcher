    deliberately easy visibility control and a random-u transfer arm, with every
    counted refutation certified by a separate-process verifier. Prepare, at
    zero run cost, the counting table, the size law and l* under H2, the power
    table and the inner-target stream rule. Output feeds the Coordinator's
    decision on the ladder extension (cells (29,10), (41,14)) and, only after a
