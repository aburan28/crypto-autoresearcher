experiment:
  id: EXP-PFDR-f32e6c
  hypothesis_id: H-PFDR-2139a5
  version: 1
  title: Native definition and quantifier certificate audit
  status: review_required
  objective: Separate certified finite counterexamples from unsupported transfers or asymptotic conclusions.
  inputs:
    source_idea: IDEA-20260905-df55e9
    source_snapshot: 989d62f62
    native_fixture:
      field_sizes: [3, 5]
      ring: Ordinary F_q[w,x,y,z], with no added field equations or quotient reductions.
      generators:
        - x^2-x
        - x*y-1
        - w^q-w
        - w^(q-1)*z^(q-1)-1
      term_order: Graded reverse lexicographic, w>x>y>z.
    signatures: Record field, ordered generators, quotient, term order, algorithm, degree convention, target domain, and quantifiers.
    source:
      citation: https://arxiv.org/pdf/2112.05579
      provenance: retrieved
      verified_by: codex-root/2026-09-05
      locations: Example 4.4 and Theorem 3.1; exact definition compatibility is a prerequisite.
  controls:
    - Native q=3 and q=5 fixtures must be reconstructed unchanged.
    - Two altered signatures impose Boolean quotient relations on the native fixtures; ordinary certificates must be rejected for these signatures without an interface proof.
    - The finite table must not be accepted as disproof of an unspecified uniform constant.
    - The target x_R=9 on y^2=x^3+2*x+15 over F_19 must be checked for rational-point admissibility before using an all-affine witness in a rational-target claim.
  independent_variables:
    - Native field size q in [3,5].
    - Ordinary versus deliberately altered quotient signature.
    - Equality, supplied-constant, existential-constant, and target-domain claim forms.
  metrics:
    primary:
      - Exact count of incorrectly accepted claims among eight fixture records.
      - Native first-fall and last-fall certificates; solving-degree bounds only when the cited theorem's interface is proved.
    secondary:
      - Certificate-checker agreement, resource use, and incompatibility reasons.
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Native degree triples and invalid acceptance count.
    formula: "q=3: (d_ff,d_lf,sd)=(3,5,5); q=5: (3,9,9); invalid acceptances=0."
    source: Retrieved source predictions and the proposal; not new observations.
  scale_relevance:
    tier: toy
    justification: Eight finite audit fixtures; no prime-digit transfer or asymptotic inference.
    correspondence: null
  tail_checks:
    - No statistical population is sampled and no tail claim is made.
  replication:
    seeds: [0]
    independent_instances: 0
    labelled_fixture_count: 8
    deduplication: Hash canonical field, generators, quotient, order, claim, and constant; repeated deterministic evaluations are checker replications, not new samples.
  protocol:
    run_groups:
      - group: 1
        fixtures: Native q=3 and q=5 polynomial systems.
        procedure: >-
          Reconstruct the source definitions before arithmetic. For each degree from
          zero through 10, form exact Macaulay rows and the iterated V_F,D closure
          by multiplication of current consequences when product degree is at most D,
          iterating exact row reduction to a fixed point. Columns use descending
          total degree then the declared monomial order; pivot rows are normalized
          with deterministic leftmost pivots. For each current row whose degree
          is at most D-1, multiply by each variable in w,x,y,z order and reduce
          again until no rank increases. This degree-filtered basis spans every
          low-degree consequence needed for multiplication. Retain every derivation.
          Use the paper's native first-fall definition with its trivial-syzygy
          convention; a one-generator quotient-layer meter is not an implementation
          of this definition. If that interface is unresolved, record unmeasured.
      - group: 2
        fixtures: Altered Boolean quotient signatures of each native system.
        procedure: Run signature matching only; reject reuse of the ordinary degree certificate and report incompatible. No altered degree prediction is asserted.
      - group: 3
        fixtures: Claims forall native systems sd=d_ff; and forall native systems sd-d_ff<=1.
        procedure: Use a certified q=3 native witness to refute each explicit finite universal claim; otherwise return inconclusive.
      - group: 4
        fixtures: Claim that the finite q table disproves any uniform gap constant; and transfer of the F_19 all-affine tuple to the rational-target domain.
        procedure: Reject the first inference by quantifier order; enumerate y in F_19 for the second and report its exact admissibility decision.
    completeness: >-
      An ordinary last-fall upper bound D requires a degree-compatible Gröbner
      basis of the same ideal, checked by all Buchberger pairs, with each basis
      element certified in V_F,D and both ideal inclusions certified. The division
      argument giving that upper bound must be retained. A matching lower witness
      must have degree less than k, belong to V_F,k, and not belong to V_F,k-1.
      Without matching bounds report an interval, never an exact last-fall value.
      Measuring solving degree is excluded from version 1. The source's predicted
      values remain control predictions; finite claims may use only solving-degree
      bounds derived from certified native last-fall bounds after the cited theorem's
      hypotheses are checked. Largest output-basis degree is never a last-fall value.
    arithmetic: Exact modular arithmetic only; retain canonical monomial columns and independently verifiable row certificates.
    implementation_gate: Freeze producer and checker source hashes and source-definition audit before the first measurement. No implementation currently exists by this specification's assertion.
  budget:
    wall_clock_seconds_per_run: 900
    maximum_memory_gb: 8
    total_cpu_hours: 1
    maximum_runs: 4
    maximum_workers: 1
    stages:
      - {name: native controls, maximum_runs: 1, wall_clock_seconds: 900}
      - {name: signature controls, maximum_runs: 1, wall_clock_seconds: 900}
      - {name: finite claims, maximum_runs: 1, wall_clock_seconds: 900}
      - {name: quantifier and domain controls, maximum_runs: 1, wall_clock_seconds: 900}
    accounting: Four sequential runs sum to 3600 seconds; implementation, checking, and all controls are charged within these caps.
  stopping_rules:
    - Stop a run at 900 seconds, 8 GiB, or degree 10; retain partial evidence and mark censoring.
    - Stop arithmetic on an unresolved native-definition interface; metadata fixtures may still complete.
    - No replacement fixtures or parameter expansion in this version.
  invalidation_rules:
    - Changed generators, quotient, term order, or syzygy convention without a prior amended contract.
    - Unretained code, inexact ranks, missing derivations, or treating repeated degrees as independent data.
    - Claiming exact last fall from a plateau or largest output-basis degree.
  receipt_completion_criterion: All eight fixture attempts and their completed, invalid, or censored states are retained.
  success_criterion: All eight decisions complete correctly, both native controls have the certificates required by the finite claims, and no invalid claim is accepted. Missing decisive certificates yield inconclusive.
  falsification_criterion: A fully checked invalid acceptance falsifies this instrument's fixture claim; disagreement on a native degree control triggers source and implementation review rather than immediate literature refutation.
  required_artifacts:
    - specification hash, source-definition audit, and canonical eight-fixture input manifest
    - producer and checker sources with hashes, exact commands, commit and dirty-tree state
    - environment and dependency versions; model policy, resolved identifier, verification and fallback provenance
    - stdout, stderr, timestamps, resource measurements, and all attempted-run receipts
    - exact matrices, monomial orders, row derivations, Gröbner certificates, degree bounds, and raw decision table
    - report identifying incompatible signatures, incomplete certificates, and the scope of every decision
  assigned_to: executor
  approved_by: null
  review_requirements:
    - Execution needs a committed approval and bounded dispatch; this record authorizes no run.
    - Before claim-changing review, commit a plan with prior, unique joint owners, blindness, known-false controls, and a blind re-derivation excluding producer code and reports.
    - A proposed contradiction or closure requires independent review-breakthrough at max without degradation.
  next_decisions:
    positive: After independent verification, permit only the audited native interfaces to inform later designs.
    negative: Repair the specific rejected signature or instrument before using its degree comparison.
    inconclusive: Retain the unresolved interface or bound and design its cheapest certificate prerequisite.
