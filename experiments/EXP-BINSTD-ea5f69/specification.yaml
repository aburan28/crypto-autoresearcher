# EXP-BINSTD-ea5f69
# Basis-count arithmetic. No pool is sampled.
# Approved by DEC-20261003-d88465.
experiment:
  id: EXP-BINSTD-ea5f69
  hypothesis_id: H-BINSTD-2cd04f
  source_idea: IDEA-20261001-d53638
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Cutoff 34 versus degree 17
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-d88465
  objective: >-
    Check the excess 17, the ratio 2, and the quotient 8.
  inputs:
    cutoff: 34
    n_a: 17
    n_b: 23
    cut_over_a: 17
    cut_over_b: 11
    n_gap: 6
    n_prod: 391
    band_ratio: 2
    band_gap_num: 7
    band_gap_den: 10
    m: 2
    dens_ratio: 20
    dens_gap_num: 19
    dens_gap_den: 1000
    band_over_tol: 7
    attempts: 200
    run_ceiling: 25
    attempt_quot: 8
    arms: 3
    pairs: 3
    pow17: 131072
    pow23: 8388608
  controls:
    - >-
      34 exceeds 17 by 17. Reporting the cutoff as 17 drops that
      excess and invalidates the run.
    - >-
      34 exceeds 23 by 11. 23 exceeds 17 by 6. The product of 17
      and 23 is 391. 14/10 exceeds 7/10 by 7/10, and 14/10
      divided by 7/10 is 2. Reporting the band ratio as 1 drops
      that ratio. The written m is 2.
    - >-
      2/100 exceeds 1/1000 by 19/1000, and the ratio is 20. The
      band width divided by 1/10 is 7. 200 divided by 25 is 8.
      Three arms give three pairwise comparisons. Two to the
      power 17 is 131072. Two to the power 23 is 8388608.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {cutoff, band, attempts}
    - route in {subtract, divide}
  metrics:
    primary:
      - cut_over_a
      - band_ratio
      - attempt_quot
      - implementations_agree
    secondary:
      - cut_over_b
      - dens_ratio
      - n_prod
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      34 exceeds 17 by 17. 14/10 divided by 7/10 is 2. 200
      divided by 25 is 8.
    formula: >-
      Subtract 17 from 34. Divide 14/10 by 7/10. Divide 200 by
      25. Multiply 17 by 23.
    source: >-
      IDEA-20261001-d53638 states the cutoff 34, the degrees 17
      and 23, the band 0.7 to 1.4, the tolerance 10 percent, the
      densities 0.001 and 0.02, the attempt count 200, the run
      ceiling 25, three arms, and m equal to 2, read 2026-10-03.
      The toy cutoffs are not named as integers. The differences
      were recomputed in this design session. That computation
      is not a run. No pool was sampled.
  scale_relevance:
    tier: toy
    justification: One written cutoff and two written degrees. No transfer to a yield.
    correspondence: null
  tail_checks:
    - The ratio 2 and the quotient 8 are required. A check that stops at the excess 17 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 17 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The excess is not 17.
    - The ratio is not 2.
    - The quotient is not 8.
    - The cutoff is reported as 17, or a pool is sampled.
  success_criterion: >-
    Both runs agree that 34 exceeds 17 by 17, that 14/10 divided
    by 7/10 is 2, that 34 exceeds 23 by 11, and that 200 divided
    by 25 is 8.
  falsification_criterion: >-
    The runs agree that 34 minus 17 is computed, and that
    difference is not 17.
  required_artifacts:
    - experiments/EXP-BINSTD-ea5f69/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-ea5f69/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-ea5f69/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-ea5f69/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-ea5f69/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-ea5f69/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any basis construction, rejection sample, or walk.
    - Any claim that an excess of 17 is a yield ratio.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
