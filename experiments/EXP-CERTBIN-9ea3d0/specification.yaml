# =============================================================================
# EXP-CERTBIN-9ea3d0 -- VERSION 1 (APPROVED by DEC-20261003-972240)
# Heuristic-validation contract for H-CERTBIN-d140ae / IDEA-20260930-d2d20c:
# informative syzygies of a k-orbit E_0 base modulo tau^2+tau+2 versus
# the birthday count at n=19.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261003-81ebdd. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Toy collision census only.
# =============================================================================
experiment:
  id: EXP-CERTBIN-9ea3d0
  hypothesis_id: H-CERTBIN-d140ae
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260930-d2d20c
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    k-orbit informative-collision count after tau^2+tau+2 versus
    birthday at n=19 E_0 (HEUR-1, delta predicted 0)
  status: analyzed
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approved_at: '2026-10-03'
  approval_decision_id: DEC-20261003-972240
  analyzed_at: '2026-10-03'
  analyzed_by: DEC-20261003-34a65b
  evidence_id: EV-CERTBIN-db7f15
  status_note: >-
    Evidence review DEC-20261003-34a65b / EV-CERTBIN-db7f15: Stages 0-2
    package O-MIXED; decision weaken (scoped uniform HEUR-1 at n=19);
    HEUR-1 not supported; n=17 not pooled; approved→analyzed. No re-run
    this tick.
  approval:
    approved_by: DEC-20261003-972240
    composing_decision: DEC-20261003-972240
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06)
      once the protocol was complete (all required fields non-null).
      Approval does not assert HEUR-1 is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze C_eff and the birthday prediction; verify the geometric
    kernel on E_0; measure the informative/birthday ratio at n=19 for
    k in {2,3} on two seeds against a Z/rZ control; report n=17 as a
    nearby object not pooled; deliver exactly one O-* label.

  class: heuristic-validation
  class_note: >-
    Pre-registered birthday prediction for HEUR-1 at a toy cell.
    Not a cost-model table and not an exponent-moving breakthrough.

  scope:
    included:
      - Stage 0: re-measure n=19 order/r/primality; freeze C_eff and birthday expectation; kernel check on two points; write stage0/preregistered-predictions.json before Stage 1.
      - Stage 1: n=19 census k in {2,3} x {primary, holdout} plus Z/rZ control; write stage1/n19-census.json.
      - Stage 2: n=17 nearby kernel check and unpooled collision rows; write stage2/n17-nearby.json and RESULTS.md with exactly one O-* label.
    excluded:
      - Magma/Sage/cypari2/AUXIN as the success path.
      - Amazon Bedrock.
      - Enumerating a millions-of-points base or any m=83 / m=131 cell.
      - Solving ECC2K-130 or any named challenge point.
      - Editing IDEA-20260930-d2d20c claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Reopening EXP-BINSTD-8bdf86 ell89 or EXP-BINSTD-591d28 H1 factor-4.
      - Pooling n=17 with n=19.
      - Treating infra failure as negative evidence against HEUR-1.

  inputs:
    proposal: ledger/proposals/IDEA-20260930-d2d20c.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-d140ae.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    n19_order_prior: experiments/EXP-BINSTD-5d3ec0/stage0/n19-order-check.yaml
    field_instrument_source: experiments/EXP-BINSTD-5d3ec0/implementation/gf2n.py
    curve_instrument_source: experiments/EXP-BINSTD-5d3ec0/implementation/curve.py
    cells:
      measure:
        n: 19
        modulus: t^19 + t^5 + t^2 + t + 1
        curve: 'y^2 + xy = x^3 + 1'
        A: 0
        B: 1
        order_expected: 523492
        r_expected: 130873
      nearby:
        n: 17
        modulus: t^17 + t^3 + 1
        curve: 'y^2 + xy = x^3 + 1'
        A: 0
        B: 1
    seeds:
      primary: 2026100301
      holdout: 2026100302
      zr_control: 2026100303
    k_list: [2, 3]
    m: 3

  controls:
    - name: geometric_kernel
      description: >-
        [2]P + tau(P) + tau^2(P) = O on two subgroup points before any
        collision count. Failure -> O-ARTIFACT; do not read ratios.
    - name: zr_uniform
      description: >-
        C_eff i.i.d. uniform labels in Z/rZ. Ratio outside [1/2, 2] ->
        O-ARTIFACT; the curve cell is not read.
    - name: n17_not_pooled
      description: >-
        n=17 is reported in stage2 and is not pooled into the n=19
        O-* label.
    - name: holdout_seed
      description: Second n=19 seed 2026100302; both seeds must land in the same reading for O-BIRTHDAY or O-DELTA-N19.
    - name: memory_beside_time
      description: Peak RSS stated beside wall time in RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0, 1, 2]
    - name: k
      levels: [2, 3]
    - name: seed
      levels: [2026100301, 2026100302]
    - name: n
      levels: [19, 17]

  metrics:
    primary:
      - informative_colliding_pairs
      - birthday_expectation
      - ratio_informative_over_birthday
      - o_star_label
    secondary:
      - raw_colliding_pairs
      - kernel_colliding_pairs
      - heaviest_fiber
      - B_phys
      - additions_charged
      - peak_rss_bytes
      - n17_r_is_prime
      - kernel_rows_nonzero_in_Fr

  heuristic_under_test: HEUR-1
  preregistered_prediction:
    quantity: >-
      informative_colliding_pairs / (C_eff (C_eff-1) / (2 r)) at n=19,
      m=3, k in {2,3}
    formula: >-
      C_eff = min { C : C(C-1)/(2r) >= 5 }, required also <= 50.
      Predicted ratio in [1/2, 2]. r^{0.05} is the exponent-reading
      threshold, not the prediction.
    source: >-
      IDEA-20260930-d2d20c HEUR-1 / H1, read 2026-10-03. Birthday
      theorem recalled (not opened). n=19 r from
      EXP-BINSTD-5d3ec0/stage0/n19-order-check.yaml, re-measured in
      Stage 0.
  scale_relevance:
    tier: toy
    justification: >-
      n=19, r=130873. C_eff ~ 1145 so expected collisions ~5. No
      transfer of delta to m=83. The kernel identity is claimed for
      every prime degree of E_0 by the endomorphism polynomial.
    correspondence: null
  tail_checks:
    - >-
      Heaviest fiber among n=19 informative collisions is at most 4
      when the expectation is at most 50; a fiber above 10 is a tail
      failure even if the mean ratio is near 1. The Z/rZ control must
      pass the same tail.

  replication:
    seeds: [2026100301, 2026100302]
    independent_instances: 2
    replication_note: >-
      Two n=19 seeds. k in {2,3} are independent bases on each seed,
      not replicates of each other.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - Stop after Stages 0-2 complete or after a named O-ARTIFACT / O-IMPEDIMENT.
    - Stage 0 kernel or order mismatch stops before Stage 1.
    - Stage 1 Z/rZ failure stops before reading n=19 ratios as science.
    - A crash or timeout is incomplete, never negative evidence against HEUR-1.

  invalidation_rules:
    - n=19 order is not 523492 or r is not prime 130873.
    - Kernel identity fails on E_0.
    - Z/rZ ratio outside [1/2, 2].
    - n=17 rows are pooled with n=19.
    - Magma/Sage/AUXIN/Bedrock used as the success path.
    - A discrete logarithm of a public target is claimed.

  success_criterion: >-
    Stage 0 freeze exists; Stage 1 writes n=19 ratios and the Z/rZ
    control; Stage 2 writes unpooled n=17 rows; RESULTS.md names
    exactly one of O-BIRTHDAY, O-DELTA-N19, O-MIXED, O-ARTIFACT,
    O-IMPEDIMENT.

  falsification_criterion: >-
    Z/rZ control in band AND every n=19 (seed, k) cell has
    informative/birthday ratio >= r^{0.05} AND heaviest fiber <= 4.
    That falsifies HEUR-1 at n=19 only.

  labels:
    O-BIRTHDAY: every n=19 (seed, k) ratio in [1/2, 2] and tails pass
    O-DELTA-N19: every n=19 (seed, k) ratio >= r^{0.05} and Z/rZ in band
    O-MIXED: neither uniform reading
    O-ARTIFACT: kernel, order, or Z/rZ instrument failure
    O-IMPEDIMENT: timeout/crash/missing dependency; not evidence

  required_artifacts:
    - experiments/EXP-CERTBIN-9ea3d0/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-9ea3d0/stage1/n19-census.json
    - experiments/EXP-CERTBIN-9ea3d0/stage2/n17-nearby.json
    - experiments/EXP-CERTBIN-9ea3d0/RESULTS.md
    - experiments/EXP-CERTBIN-9ea3d0/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-9ea3d0/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-9ea3d0/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-9ea3d0/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-9ea3d0/runs/<RUN-ID>/raw-result.json

  assigned_to: executor
  trial_plan: experiments/EXP-CERTBIN-9ea3d0/trial-plan-v1.json
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
  out_of_scope:
    - Any Groebner/SAT solve.
    - Any claim that a k-orbit base beats rho.
    - Any m=83 relation-phase existence claim from a toy ratio.
