experiment:
  id: EXP-ICEX-c156e2
  hypothesis_id: H-ICEX-801f67
  derived_from_idea: IDEA-20260830-2993a4
  question_id: RQ-ICEX-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The decision-rate exponent as a within-field-size deliverable - planted-value calibration first,
    a committed constant-factor regression fixture, a CURVE-FREE random-predicate null whose forced
    reading is AGREEMENT, a charging-convention invariance sweep, a matched-budget interval
    comparison against the incumbent exponent, and a Pollard rho arm run to completion on the SAME
    group orders and the SAME machine so the pass line is measured rather than quoted
  objective: >-
    Reduce two coupled uncertainties. (i) Whether the decision-rate exponent, fitted within one field
    size over a decade of base sizes, has a confidence interval at least three times narrower at
    matched compute budget than the incumbent exponent fitted between four group orders - which is
    the entire reason this instrument would be preferred, and is designed to be able to come out
    against the proposal. (ii) What the rho pass line actually is on these instances. Every
    "clears rho" statement in this lane is currently a comparison against a folklore constant this
    program has never measured; this run measures it on the SAME group orders, on the SAME machine,
    with the step-count DISTRIBUTION recorded, so that a pass-line verdict rests on a measurement and
    the quoted constant appears only as a cross-check.
    Two structural by-products follow at zero compute and are emitted whatever the measurement shows:
    the admissible interval for the decision-rate exponent is bounded above by the arity minus one,
    and the two disputed arity-two values in this corpus are exactly its two endpoints.
  what_this_is_not:
    - >-
      Not an attack, not an algorithm, not a speedup. No ECDLP exponent is claimed or moved in either
      direction, and no cryptanalytic mechanism is exercised.
    - >-
      Not new mathematics. The decision rate is an affine reparametrisation of an existing model in
      this lane and the mapping to the incumbent exponent is inherited verbatim; the run should be
      judged on the matched-budget interval comparison alone.
    - >-
      Not a discovery instrument. The decision rate has the same value on a curve-free predicate of
      identical cost, which is what the mandatory null verifies. Nothing structural may be inferred
      from it.
    - >-
      Not applicable to partial-relation pipelines, whose relation supply is not the candidate count
      at all. That exclusion is a declared scope limit and not something to be discovered later.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or evidence.
      approved_by is null.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the three tested field sizes, over the declared base-size range,
      on the named machine and under the frozen charging convention, oracle X at arity two has
      decision-rate exponent r plus or minus its bootstrap interval with a stated lack-of-fit
      statistic and a stated peak query space; the interval on r is or is not at least three times
      narrower than the interval on the incumbent exponent at matched budget; and the MEASURED rho
      constant on the same group orders is c plus or minus its interval. WHAT DOES NOT FOLLOW:
      nothing about an oracle not tested, nothing about achievability of any r, nothing about other
      arities, other fields or cryptographic scale, and nothing structural about elliptic curves,
      since the curve-free null is required to give the same r.
  inputs:
    procedure: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Verify symbolically that the affine substitution
      reproduces this lane's two regimes, its threshold, and the two disputed arity-two endpoints;
      verify numerically across the declared arity range to the declared tolerance. Freeze and hash:
      the charging convention and the probe-charge sweep values; the field sizes and base-size
      ladders; the yield screen band; the exhaustive completeness threshold; the lack-of-fit test and
      its rejection level; the planted-value ladder and its recovery tolerance; the matched-budget
      accounting rule; the rho arm's attempt counts; and the machine description. A symbolic mismatch
      halts the run.
      STAGE 1 (low compute, BLOCKING). PLANTED-VALUE CALIBRATION. Build synthetic oracles that spend
      exactly the declared number of charged operations and settle the exact multiset count, for each
      planted value on the ladder, and run the estimator. THE ESTIMATOR IS NOT APPLIED TO ANY REAL
      ORACLE until it recovers every planted value within the declared tolerance with no trend in the
      residual.
      STAGE 2 (low compute, BLOCKING). CURVE-FREE NULL. Replace the decomposition predicate with a
      random predicate of identical charged cost - no curve, no group law, no decomposition - and fit
      r on the identical base-size ladder. FORCED: r unchanged within its interval. Write this down
      before Stage 3.
      STAGE 3 (the real oracles). Instrument the three arity-two oracles across the base-size ladder
      at each field size, with the declared number of seeds. Per cell record the settled candidate
      count with its MEASURED completeness fraction, cross-checked exhaustively against a reference
      complete oracle below the exhaustive threshold; the charged operation count and its FULL
      per-target distribution; the decision rate; the measured mean yield against the conservation
      prediction; and the peak query space. Fit r within each field size separately by weighted least
      squares on the logarithms, with bootstrap intervals and a lack-of-fit statistic.
      STAGE 4 (the regression fixture, BLOCKING). Run the committed constant-factor variant at its own
      two committed cells. FORCED: the decision-rate LEVEL moves by the committed factor and the
      fitted r is identical within its interval.
      STAGE 5 (the convention sweep). Refit with the probe charge set to each of the declared sweep
      values. FORCED: the level moves, r does not.
      STAGE 6 (THE RHO ARM). Run Pollard rho TO COMPLETION on the SAME group orders on the SAME
      machine, at least the declared number of attempts per order, recording the EXACT step count of
      every attempt. Report the full empirical step-count distribution per order, the mean with a
      bootstrap interval, and the fitted constant in the mean-steps law. The folklore constant is
      entered only in a cross-check column.
      STAGE 7 (the decisive comparison). Using the SAME total compute budget, fit the incumbent
      exponent the conventional way across the field sizes and compare interval half-widths. THIS
      MUST BE RUN EVEN IF - ESPECIALLY IF - IT GOES AGAINST THE PROPOSAL.
      STAGE 8 (zero compute). Emit the triple per oracle with its peak query space, map to the
      incumbent exponent through the inherited regimes, and state for each whether it clears the
      MEASURED pass line. Propose nothing as a status change.
    instrument: >-
      Pure Python under experiments/EXP-ICEX-c156e2/driver/. Two counters added to an existing sweep
      implementation; a synthetic-oracle harness for the calibration; a weighted least-squares fit
      with bootstrap intervals and a lack-of-fit test; and an instrumented Pollard rho recording exact
      step counts, never wall clock, so that algorithmic spread and host noise are never mixed.
      Recorded through harness/runner.py.
    parameters: >-
      THE INSTANCE SET IS FIXED IN STAGE 0 AND EVERY ARM - INCLUDING THE RHO ARM AND THE CURVE-FREE
      NULL - RUNS ON THAT SAME SET OF GROUP ORDERS. Three toy field sizes; at least eight base sizes
      spanning at least a factor of sixteen at each; a field size whose feasible base range is
      narrower is EXCLUDED before the run rather than fitted over a short range. Cells pre-screened
      for mean per-target yield inside the declared band. At least five seeds per cell. Rho arm: at
      least 2000 completed attempts per group order. THE MACHINE IS NAMED AND PINNED and appears on
      every row.
  controls:
    - >-
      PLANTED-VALUE CALIBRATION, BLOCKING, RUNS FIRST: the estimator must recover known planted values
      within the declared tolerance, with no trend in the residual, before it is applied to any real
      oracle.
    - >-
      CURVE-FREE NULL OBJECT, MANDATORY AND BLOCKING (standing scope constraint from the pfdr-battery
      lane), WITH ITS READING STATED IN ADVANCE: the decomposition predicate is replaced by a random
      predicate of identical charged cost, containing no curve and no decomposition. FORCED VALUE:
      r UNCHANGED. Note the direction - this is the OPPOSITE of the usual null-object reading, because
      the decision rate is a cost accounting and carries no structural information. An r that MOVES
      here means the estimator is reading structure into a cost ratio and is broken.
    - >-
      COMMITTED CONSTANT-FACTOR REGRESSION FIXTURE, BLOCKING: a variant a committed finding calls
      not-exponent-moving must move the decision rate's LEVEL by the committed factor and leave r
      unchanged within its interval. An instrument that reports a change in r here is broken and
      blocks the whole run.
    - >-
      COMPLETENESS CROSS-CHECK: the measured completeness fraction of every oracle verified
      exhaustively against a reference complete oracle below the declared threshold. An incomplete
      oracle charged as complete inflates r by construction, which is the easiest way to fake a pass.
    - >-
      CONVENTION-INVARIANCE CONTROL: refit with the probe charge swept across two orders of magnitude.
      The level must move and r must not, by more than its interval.
    - >-
      YIELD VALIDITY CONTROL: measured mean per-target yield per cell against the conservation
      prediction; a systematic deviation voids the cell.
    - >-
      NEARBY-OBJECT CONTROL: the instantiation where the candidate count and the oracle cost are known
      by construction, so r is forced. The instrument must return the forced value; if it cannot, it is
      not measuring the load-bearing structure and may not be used.
    - >-
      MEASURED RHO BASELINE ON THE SAME INSTANCES, blocking for any pass-line verdict: Pollard rho run
      to completion on the same group orders on the same machine, with the full step-count
      distribution archived. The folklore constant enters only a cross-check column and may not be the
      basis of a verdict.
    - >-
      SEED-INDEPENDENCE: derived quantities bit-identical across seeds; measured counts free to vary,
      with the variation reported.
  independent_variables:
    - oracle - signed-sum sweep, committed constant-factor variant, precomputed-table, synthetic planted, curve-free random predicate
    - base size B, across the ladder at each field size
    - field size, across three values
    - probe charge, across the convention sweep
    - seed index
    - estimator under comparison - decision-rate exponent versus the incumbent exponent, at matched budget
  metrics:
    primary:
      - >-
        C(cell): settled candidate count per target, as an integer, together with the MEASURED
        completeness fraction and the exact multiset count it multiplies. Reported as three numbers,
        never as a single product.
      - >-
        D(cell): charged operations per target under the frozen convention, recorded as the FULL
        PER-TARGET DISTRIBUTION, not only its mean. A heavy tail means the expectation-level charge
        does not predict the total, so the 99th percentile against the mean is reported at every cell
        and the legitimate summary of D is the mean WITH that tail ratio attached.
      - >-
        decision_rate(cell) = C/D, dimensionless, with the charging convention attached to the row.
        The LEVEL is convention-dependent by design and may never be quoted without its convention.
      - >-
        r(oracle, field size): the weighted least-squares slope of the logarithm of the decision rate
        against the logarithm of B, dimensionless, with a bootstrap interval, the cell count, and a
        lack-of-fit statistic. THE ESTIMATOR REFUSES A SINGLE-CELL ESTIMATE: a ratio of logarithms
        from one cell is constant-contaminated and is not r.
      - >-
        planted_versus_recovered_r: the recovery error at every planted value, dimensionless, with the
        residual trend. BLOCKING.
      - >-
        r_curve_free: the fitted r under the curve-free random-predicate null, dimensionless. FORCED
        equal to the real oracle's r within the interval.
      - >-
        interval_ratio: the half-width of the incumbent exponent's interval divided by the half-width
        of r's interval, at MATCHED total compute budget on the same pipeline, dimensionless. THE
        DECISIVE METRIC.
      - >-
        rho_step_distribution(order): the FULL empirical distribution of exact step counts over the
        completed attempts at each group order, archived as raw counts. Units: group operations. The
        distribution is the measurement; the mean alone is not a legitimate summary of a heavy-tailed
        cost, so the mean is reported WITH the distribution and with its bootstrap interval.
      - >-
        rho_constant: the fitted constant in the mean-steps-to-collision law across the group orders,
        dimensionless, with a bootstrap interval, and beside it the folklore constant in a column
        explicitly labelled CROSS-CHECK, NOT INPUT.
      - >-
        pass_line_verdict(oracle): whether the mapped incumbent exponent clears the MEASURED rho
        baseline on these instances, stated only when rho_constant was fitted at the declared
        precision.
    secondary:
      - >-
        r and the decision-rate level at each probe charge in the convention sweep.
      - >-
        the constant-factor fixture's level ratio against its committed value, and its fitted r.
      - >-
        the measured mean yield per cell against the conservation prediction.
      - >-
        peak query space per oracle per cell, in bytes, emitted on every r row.
      - >-
        the lack-of-fit statistic and the residual diagnostics per fit.
      - >-
        the forced-value control's returned r at the nearby object.
      - >-
        wall-clock and CPU seconds per cell on the named machine, and the matched-budget accounting
        showing that the two estimators were given equal totals.
      - >-
        the Stage 0 symbolic verification output and its hash.
  heuristic_under_test: HEUR-DEC-1
  preregistered_prediction:
    quantity: >-
      r for the sweep and the table oracle at arity two; the planted-value recovery errors;
      r_curve_free; interval_ratio; the constant-factor fixture's level ratio and r; and rho_constant
      with its step-count distribution.
    formula: >-
      r for the signed-sum sweep is 0.00 with an interval half-width below 0.10, because that oracle
      performs a fixed multiple of B point operations per target, which makes the prediction a theorem
      for it rather than a guess. r for the precomputed-table oracle is 1.00 plus or minus 0.10, the
      upper endpoint of the admissible interval at arity two, because it performs a bounded number of
      probes. Planted values are recovered within 0.10 at every point on the ladder. r_curve_free
      equals the real oracle's r within its interval. interval_ratio is at least 3. The
      constant-factor fixture moves the LEVEL by the committed factor and leaves r unchanged.
      rho_constant is fitted from the measured distribution; its predicted value is NOT written here,
      because that is exactly the quantity this contract exists to measure rather than quote, and the
      folklore value is entered only as a cross-check after the fit.
      The admissible interval r at most arity minus one, and hence a pass line outside it at every
      arity below four, is a derivation emitted at zero compute in Stage 0 and is not a prediction
      about data.
    source: >-
      The observable, the affine mapping, the planted-value calibration, the fixture, the
      convention-invariance property and the matched-budget comparison are taken from
      IDEA-20260830-2993a4, read in full by TASK-20260904-8f2f95 on 2026-09-04. The two point
      predictions for the sweep and the table oracle are DERIVATIONS from those oracles' exact
      operation counts, not measurements. The constant-factor fixture's committed value is quoted
      second-hand from that proposal and is re-read from its source finding in Stage 0. Never tuned to
      data.
  scale_relevance:
    tier: toy
    justification: >-
      The design deliberately spends its budget on MANY base sizes at FEW field sizes, where the
      incumbent spends it on few base sizes at several field sizes. That reallocation is the
      proposal, and Stage 7's matched-budget comparison is exactly the measurement of whether it was
      worth making - designed so that it can say no. THE TESTED SCALE IS THE CLAIMED SCALE: the field
      sizes and base sizes appear on every row, and a toy-scale decision-rate exponent is asserted to
      hold at no other scale, arity or field.
    correspondence: null
  tail_checks:
    - >-
      Report the 99th percentile of the per-target charged cost against its mean at every cell. A heavy
      tail means the expectation-level charge does not predict the total, and every r must be reported
      with that ratio.
    - >-
      Report the fit refitted with the smallest and the largest base size removed, since with eight
      cells one endpoint can carry the slope.
    - >-
      Report the maximum single-attempt step count in the rho arm against the fitted distribution's
      tail; a rho cost distribution is right-skewed and a mean quoted without its tail understates the
      worst case.
    - >-
      Report the number of cells contributing to each fit and refuse any fit with fewer than eight
      cells or a base range below a factor of sixteen, reporting the shortfall rather than an r.
    - >-
      Report the completeness fraction at the smallest and the largest B separately; a fraction that
      drifts across the range invalidates the constancy assumption and must be disclosed on the r row.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
      - 20260907
      - 20260908
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 14
  stopping_rules:
    - >-
      HALT at Stage 0 if the symbolic verification of the affine substitution fails. Everything
      downstream is void.
    - >-
      HALT before Stage 3 if the planted-value calibration does not recover every planted value within
      tolerance. No measured r is reported.
    - >-
      HALT the whole run if the constant-factor fixture reports a change in r.
    - >-
      HALT the pass-line half of the run, and report r without a verdict, if the rho arm's constant
      cannot be fitted at the declared precision. Quoting the folklore constant instead is prohibited.
    - >-
      EXCLUDE any field size whose feasible base range is below a factor of sixteen, before the run
      rather than after seeing a wide interval.
    - >-
      Report an oracle that fails lack-of-fit as HAVING NO EXPONENT and do not quote an r for it. This
      is a stopping rule on a claim, not on the run.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop and
      is never a negative result.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative
      mathematical evidence.
    - >-
      A run reporting an r estimated from a single cell is invalid_measurement; the estimator is
      specified to refuse it.
    - >-
      A run reporting a decision-rate level without its charging convention is invalid_measurement.
    - >-
      A run reporting an r without the curve-free null's r on the same ladder is invalid_measurement.
    - >-
      A run reporting a pass-line verdict against a quoted rather than a measured rho constant is
      invalid_measurement.
    - >-
      A run reporting the rho arm as a single mean without the full step-count distribution is
      invalid_measurement.
    - >-
      A run in which the matched-budget comparison was not executed is invalid_measurement: without it
      the hypothesis's own decisive criterion is untested.
    - >-
      A run whose ladders, convention, tolerances or machine differ from the frozen contract is a
      DIFFERENT experiment and needs a new contract.
  success_criterion: >-
    The run yields interpretable evidence when ALL of the following hold: (1) the Stage 0 symbolic
    verification passes and is archived with its hash; (2) planted values are recovered within
    tolerance with no residual trend; (3) the curve-free null's r agrees with the real oracle's within
    its interval; (4) the constant-factor fixture moves the level by its committed factor and leaves r
    unchanged; (5) the convention sweep moves the level and not r; (6) every r is fitted over at least
    eight cells spanning at least a factor of sixteen, with a bootstrap interval and a lack-of-fit
    statistic, and is emitted with its peak query space and its per-target cost tail ratio; (7) the
    rho arm reports the full step-count distribution per group order and a fitted constant with its
    interval, with the folklore value only in a cross-check column; (8) the matched-budget interval
    comparison is executed and reported whichever way it comes out.
  falsification_criterion:
    - >-
      Planted values not recovered within tolerance. The instrument is broken; no measured r is
      reported and the design is withdrawn rather than re-tuned.
    - >-
      interval_ratio below 3. THE IDENTIFIABILITY CLAIM FAILS. This is the hypothesis's own declared
      rejection criterion and there is no fallback reading.
    - >-
      r moves beyond its interval under the convention sweep. The claimed convention-invariance is
      false and the instrument's motivating property does not hold.
    - >-
      The constant-factor fixture reports a change in r. The instrument contradicts a committed
      finding and is broken.
    - >-
      r MOVES under the curve-free random-predicate null. The estimator reads structure into a cost
      ratio; nothing it reports is admissible.
    - >-
      The sweep's r differs from 0 by more than 0.10. The per-trial charge this lane assumes is wrong
      - a result more valuable than the instrument, reported as the headline with the affected
      downstream records named.
    - >-
      The rho arm's fitted constant is inconsistent with its own step-count distribution, or cannot be
      fitted at the declared precision. No pass-line verdict is stated in either direction.
  required_artifacts:
    - manifest.yaml with exact command, commit sha, dirty-tree state, resolved inference block, environment and the NAMED machine
    - the Stage 0 symbolic verification output, the frozen ladders, tolerances and conventions, with their hash
    - the planted-value calibration results with recovery errors and residual trend, written before any real oracle was run
    - the curve-free null's fitted r on the identical ladder, written before Stage 3
    - raw-result.json with C, its completeness fraction, the exact multiset count, and the FULL per-target charged-cost distribution at every cell
    - the fitted r per oracle per field size with bootstrap interval, cell count, base range, lack-of-fit statistic and peak query space
    - the constant-factor fixture's level ratio and fitted r against their committed values
    - the convention sweep's levels and r values at every probe charge
    - the rho arm's complete per-attempt step counts at every group order, its fitted constant with interval, and the folklore cross-check column
    - the matched-budget accounting and the interval comparison against the incumbent exponent
    - wall-clock and CPU seconds per cell on the named machine
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not confer approval. status is draft, frozen is false,
      execution_authorized is false, approved_by is null.
    - >-
      Approval must confirm the matched-budget accounting rule. "Equal compute" between a within-size
      sweep and a between-size ladder is a definition, and choosing it after seeing the intervals would
      make the decisive comparison unfalsifiable.
    - >-
      Approval must confirm the rho arm's attempt count per group order. The pass line's precision is
      set by it, and a rho constant fitted too loosely makes every verdict in the run unavailable.
    - >-
      Approval should note that the curve-free null's forced reading here is AGREEMENT, not vanishing.
      A reviewer applying the usual reading would invert the control's meaning.
  derivation_provenance:
    tool: coordinator-authored contract under TASK-20260904-8f2f95
    source_record: IDEA-20260830-2993a4
    authored_at: '2026-09-04'
    note: >-
      The observable, the affine mapping, the structural upper bound, the planted-value calibration,
      the constant-factor fixture, the convention-invariance control, the nearby-object control and
      the matched-budget comparison are taken from the parent proposal and restated as measured
      quantities with units and decision rules. Added by this contract: the MEASURED Pollard rho arm on
      the same group orders and machine, so that no pass-line verdict rests on a quoted constant; the
      requirement that the per-target charged cost be archived as a distribution with its tail ratio
      rather than as a mean; and the explicit statement of the curve-free null's inverted reading. The
      two point predictions are derivations from exact operation counts; no measured value from any
      prior run is transcribed here.
  derivation_gaps:
    - >-
      The mapping from the decision rate to the incumbent exponent is inherited from another record in
      this lane and is not verified here. If that derivation is wrong, r is still correctly measured and
      its translation is wrong; every deliverable states r first.
    - >-
      The completeness fraction is measured exhaustively only below the declared threshold and is
      extrapolated within a field size. This corpus's one measured instance reports two differing values
      at two field sizes, so the extrapolation is known to be imperfect and is flagged on every row.
    - >-
      The power-law assumption may simply fail for an algebraic oracle. The lack-of-fit statistic exists
      to detect it and "no exponent" is the honest report; the framework must accommodate that rather
      than force a fit.
    - >-
      The rho arm measures rho on TOY group orders and fits a constant there. Whether that constant is
      the same at cryptographic scale is not tested and is not claimed; the pass-line verdict is scoped
      to the tested orders exactly as every other row is.
    - >-
      "The existing estimator is unidentifiable" is cheap to assert. The matched-budget comparison is
      included, and is required to run, precisely so that "the incumbent was fine" is a reachable
      outcome of this run.
