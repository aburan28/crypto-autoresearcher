        the frozen references (9.538672, 21.95, 38.84) are -9.03e-06, +3.70e-03
        and -1.34e-03 bits.

    - id: OBS-SCOPE-C
      axis: required table memory against the committed global-storage figure
      statement: >-
        At 64 bytes per entry the required memory is 2^{98.5}, 2^{144.6} and
        2^{187.3} bytes at NIST-I/III/V, exceeding the committed global-storage
        figure of 2^{73.08} bytes by 25.42, 71.52 and 114.22 bits respectively,
        with the excess increasing with level; at 256 bytes per entry every
        figure rises by 2 bits and the ordering is unchanged. All six cells are
        infeasible against the committed figure. This is the only axis on which
        the higher levels retain more margin than NIST-I, and it is named
        explicitly wherever it is used.

    - id: OBS-ADVERSARIAL-CORNER
      statement: >-
        The corner most favourable to the assessed method - law L1 (smallest E at
        P = 256), S = 0, A = -1.736966 (pure RAM, flagged by OBJ-6 as the most
        attacker-favourable model), c = 0.0, MC_P13, log2 k_DG = 0 - gives
        T_A(256) = 116.724371 in log2 AES-equivalents at a 2^{92.5} table-entry
        requirement, conditional on Heuristic 1, and produces
        NO_CROSSOVER_IN_WINDOW at all 14 declared memory budgets, with the
        assessed method on the cheaper side at both window endpoints.

    - id: OBS-SANITY-1
      statement: >-
        Audit of MC_P13's memory-discount direction. Measured
        dT_A/d(log2 w) = -0.49999999873762135 below the clamp and 0.0 at or above
        it, at all five committed P rows. Reducing memory therefore makes the
        assessed method MORE expensive, not cheaper - the committed convention
        gives the vOW memory discount to the assessed method, and the discount
        shrinks with memory. Cost increase from log2 w = L_mem down to
        log2 w = 20 - 36.25, 59.3, 80.65, 93.0 and 126.1 bits at
        P = 256/384/512/576/768. No MODEL_PATHOLOGY of the
        memory_discount_direction kind was found under the committed formula.
      recorded_discrepancy: >-
        H-SSI-7fe2bf HEUR-XO-3 supporting_results states that MC-P13 "as written
        it makes the assessed method CHEAPER as memory shrinks below M". The
        committed formula in specification.yaml and in cost_model.py line 236
        yields the opposite direction, as measured above. This run reports the
        measured sign and does not resolve the discrepancy; it is a finding about
        the campaign's own cost-model description, and it is left to the Reviewer
        and Coordinator.

    - id: OBS-L5-SENSITIVITY
      statement: >-
        The alpha = 1.1321 extrapolation sensitivity, reported separately and
        not part of any gate or band. E_L5 - E_L4 = 0.353773, 0.431047, 0.485873,
        0.508320 and 0.563147 bits at P = 256/384/512/576/768, against the
        design-time expectation of about 0.36 rising to about 0.56.
        E_L5(256) = 12.378529 against the frozen reference 12.379, residual
        -0.000471 bits. Induced locus displacement over the 1120 paired cells -
        80 numeric pairs with displacement between 5.078984 and 10.276928 log2 p;
        the remaining 1040 pairs are categorical and unchanged in label.

    - id: OBS-K-DG-SENSITIVITY
      statement: >-
        Ratio form is primary and k-free - Delta(log2 k_DG) = Delta(0) +
        log2 k_DG. Re-solving at log2 k_DG in {-4, -2, 0, +2, +4} gives
        d(p*)/d(log2 k_DG) between -16.148 and -11.135 log2 p per bit at
        log2 w = 20 (20 thetas with a slope), -14.950 to -11.401 at 25, -18.541
        to -11.821 at 30, -20.694 to -13.435 at 35, -21.938 to -17.202 at 40 and
        -24.515 to -24.363 at 50. At log2 w >= 60 no theta retains two numeric
        loci across the k range, so the slope is NOT_EVALUABLE there and is
        recorded as such rather than as zero.
      note: >-
        log2 k_DG = 0 is a transcription of the paper's own previous-methods
        column and is flagged independently_transcribed false (HEUR-XO-2).

    - id: OBS-F3-ESCALATION
      statement: >-
        Zero cells report both a numeric p* <= 512 and memory feasibility
        log2 w >= L_mem(p*) at log2 w <= 40, over all 4480 main cells. The
        pre-registered locus lower bound is therefore VACUOUSLY SATISFIED at
        every memory budget in that range - at log2 w = 20, 25, 30 and 35 there
        are 64 numeric loci at or below 512 and at log2 w = 40 there are 48, and
        at every one of them the assessed method needs more table entries than
        the budget allows. Saying so is the point; this is never presented as
        substantive confirmation. No escalation is triggered.

    - id: OBS-GUARDS
      statement: >-
        undefined_segments.json contains 7840 entries, one per emitted cell
        across the main, null and sensitivity arms, and is not empty. Guard
        counts - fit_window_extrapolation on all 7840 cells,
        INFEASIBLE_AT_MEMORY on 3640, interpolated_between_committed_rows on 488
        (the numeric loci at non-committed P, each naming its two bracketing T2
        rows). Zero L3-undefined cells, matching the design-time check that
        a3*P + b3 > 0 on [256, 768]. Every emitted number carries
        fit_window_extrapolation true and extrapolation_ratio = P/40 within
        [6.4, 19.2].

    - id: OBS-DEPENDENCY
      statement: >-
        The primary path is standard-library only. numpy, sage, sagemath, g6k,
        fpylll, scipy and mpmath were all probed and all reported ABSENT; no
        forbidden module appears in sys.modules; no network access was performed.
        The dependency-situation disagreement the contract flagged between two
        committed records is resolved in favour of the narrower reading on this
        host - numpy is NOT present here, which is why XCHK-2 is NOT_RUN.

  anomalies:
    - id: ANOM-1
      kind: unexpected_observation
      statement: >-
        RG-5's sub-grid naming is only partial - no declared sub-grid reproduces
        the committed interval [6, 11] endpoint-for-endpoint (see OBS-RG-5). The
        gate's stated pass condition is met; the naming clause could not be
        discharged exactly.
    - id: ANOM-2
      kind: unexpected_observation
      statement: >-
        The committed MC_P13 memory-discount direction measured here is opposite
        to the direction asserted in H-SSI-7fe2bf HEUR-XO-3 supporting_results
        (see OBS-SANITY-1). Recorded, not resolved.
    - id: ANOM-3
      kind: unexpected_observation
      statement: >-
        MC_VOW produces no numeric locus in any of its 2240 declared cells - 1440
        are INFEASIBLE_AT_MEMORY and 800 are NO_CROSSOVER_IN_WINDOW. A p*(w)
        curve exists in this reconstruction only under MC_P13. Reported as a
        decisive categorical outcome, not averaged into a band.
    - id: ANOM-4
      kind: unexpected_observation
      statement: >-
        The 320 numeric loci are concentrated at low memory budgets - 64 at each
        of log2 w = 20, 25, 30 and 35, 48 at 40, 16 at 50, and none at or above
        60. Every one of them is at a memory budget where the assessed method
        cannot hold its own table.
    - id: ANOM-5
      kind: infrastructure_event
      statement: >-
        XCHK-2 NOT_RUN because numpy is absent. Infrastructure signal, not
        mathematical evidence; no reported number depends on it.
    - id: ANOM-6
      kind: infrastructure_event
      statement: >-
        Model-binding divergence. The handoff requested policy
        executor-implementation with fallback_allowed false;
        orchestration/model-bindings.yaml binds that policy on the anthropic
        backend to claude-sonnet-5, and this session is served by claude-opus-5.
        Model selection is process-level under this runtime and was not chosen by
        the Executor. Recorded with fallback_used true rather than silently
        substituted. No model was in the computational loop of the run itself.
    - id: ANOM-7
      kind: observation_not_acted_on
      statement: >-
        The contract's own provenance note records that ledger/goals/GOAL-SSI-001
        neither exists as a file nor as a sharded directory. That is still the
        case and is outside this task's write scope; it is re-surfaced here for
        the Coordinator running the ledger archive.

