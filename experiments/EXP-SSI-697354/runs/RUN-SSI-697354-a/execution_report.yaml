        additionally reported with the unit-grid bracket containing it rather
        than as a bare point. At that cell the assessed method would need
        2^{L_mem(323)} table entries, far above 2^40, so it is memory-infeasible
        in the physical sense even though MC_P13 permits any w. Tail check 3 -
        null displacement argmin and argmax are reported above and are attained
        at opposite ends of the P window under different laws, not at one
        pathological corner. Tail check 4 - categorical label counts per
        convention are reported in OBS-P-STAR-TABLE.

    - id: OBS-SCOPE-A
      axis: advantage over the matched Delfs-Galbraith / previous-methods baseline
      statement: >-
        At the reference scenario (law L1, S = 0, A = 0, c = 0, log2 k_DG = 0)
        the advantage without a memory discount is 9.538663 bits at NIST-I,
        21.953700 at NIST-III and 38.838663 at NIST-V, increasing with level,
        each requiring 2^{92.5}, 2^{138.6} and 2^{181.3} table entries
        respectively and each conditional on Heuristic 1. The full 4 laws x 2 S x
        5 c table is in scope_statement.json.

    - id: OBS-SCOPE-B
      axis: assessed cost against the level's own classical target
      statement: >-
        Gap below the level's own target at S = 0, A = 0, c = 0 - 9.538663 bits
        below 2^128 at NIST-I, 21.953700 below 2^192 at NIST-III and 38.838663
        below 2^256 at NIST-V, increasing with level, each at the 2^{L_mem} table
