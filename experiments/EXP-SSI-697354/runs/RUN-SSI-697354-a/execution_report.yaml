      measured_or_modeled: modeled

    - id: OBS-BAND-WIDTH-COMPARISON
      statement: >-
        At the matched point (log2 p = 256, log2 w = 30) the p* band over 64
        numeric loci is [350.822209, 448.750695], width 97.928486 log2 p,
        midpoint 399.786452, fractional width 0.244952. The margin band over the
        160 cells defined at that point (40 distinct values, since Delta is
        A-invariant; the 160 MC_VOW cells at that w are memory-infeasible and
        excluded) is [-10.568995, 24.538663] bits, width 35.107658 bits, midpoint
        6.984834 bits, width over absolute midpoint 5.026269. The difference of
        the two fractions is -4.781317.
      note: >-
        The margin band straddles zero, so its midpoint is small relative to its
        width and its fractional width is correspondingly large; that behaviour is
        itself part of what the reconditioning claim is about. Both fractions are
        reported as computed; the F2 judgement is the reviewer's and is not made
        here.
      measured_or_modeled: modeled

    - id: OBS-TAIL-CHECKS
      statement: >-
        Tail check 1 - Delta at both window endpoints is recorded for every one
        of the 4480 main cells. Among the 2720 NO_CROSSOVER cells the endpoint
        spread ranges from 0.0 to 148.365037 bits, mean 52.356032, so
        near-zero-spread and far-from-zero cells are distinguishable rather than
        collapsed into one label. Tail check 2 - the smallest absolute margin
        anywhere in the main grid is 1.3975369950003371e-04 bits at law L4,
        S = 0, c = 2.0, MC_P13, log2 w = 40, log2 p = 323; it is below 1 bit, it
