  protocol_deviations:
    - >-
      The escalation audit required by specification.yaml escalation_rules (F3
      candidate scan, vacuous-satisfaction disclosure) was performed by a
      separate program, f3_escalation_check.py, run after crossover.py over the
      artifacts crossover.py had already emitted, rather than inside the main
      program. No emitted number changed; the audit is pure arithmetic over
      p_star_table.json and the committed T2 L_mem column.
    - >-
      Two pre-flight executions of crossover.py were performed into a scratch
      directory outside the repository before the recorded run, to smoke-test
      the implementation, and one more afterwards for the determinism check.
      They wrote nothing into experiments/ and produced no artifact used in
      this package. The single authorized protocol run is RUN-SSI-697354-a and
      it was executed once.
    - >-
      Delta is invariant in A because A cancels between T_B and T_A. The solver
      therefore solves each cell once per (law, S, c, MC, w, log2_k_DG) and
      attaches the outcome to all four declared A values, so all 4480 main,
      2240 null and 1120 sensitivity cells are emitted while 1120 + 560 + 280
      distinct solves are performed. The invariance is not assumed: it is
      measured over 1360 (cell, endpoint) comparisons with a maximum spread of
      5.68e-14 bits, reported in reproduction_gate.json A_cancellation_check.
      A is retained in T_A and T_B, where the reproduction gate needs it.

  anomalies:
    - >-
      RG-5 sub-grid naming is only partial. The reconstructed grid at P = 256,
      c = 0 spans gaps of 2.524 to 11.276 bits, which is wider than the
      committed interval [6, 11]. The contract asks for the sub-grid that
      reproduces [6, 11] exactly; the set of cells whose gap lies inside [6, 11]
      spans 6.431 to 9.539 bits over 16 cells, so no declared sub-grid
      reproduces the committed interval endpoint-for-endpoint. The pass
      condition actually stated in RG-5 (min gap <= 6.5 and max gap >= 10.5) is
      met. Reported rather than smoothed.
    - >-
      SANITY-1 measured the sign of dT_A/d(log2 w) under MC_P13 as negative
      below the clamp and 0 at or above it, i.e. cost falls as memory rises and
      rises as memory falls. H-SSI-7fe2bf HEUR-XO-3 supporting_results states
      the opposite of the committed formula, saying MC-P13 "makes the assessed
      method CHEAPER as memory shrinks below M". This run reports the measured
      sign of the committed formula and does not resolve the discrepancy.
    - >-
      The smallest absolute margin anywhere in the main grid is 1.398e-04 bits,
      at law L4, S = 0, c = 2.0, MC_P13, log2 w = 40, log2 p = 323. It sits one
      scan step from a root, which is where a small |Delta| is expected. At that
      cell the assessed method would need 2^{L_mem(323)} table entries, far more
      than 2^40, so it is memory-infeasible in the physical sense even though
      MC_P13 permits any w. The locus in that neighbourhood is reported as the
      unit-grid bracket containing the root, not as a bare point.
    - >-
      The run's own model divergence, recorded above under inference.
