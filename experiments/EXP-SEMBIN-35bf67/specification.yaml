# =============================================================================
# EXP-SEMBIN-35bf67 -- VERSION 1 (APPROVED by DEC-20261002-99c798) frozen
# contract for H-SEMBIN-d895d9: Assumption-1 boundary surface in (n, k) via
# one-sided SOLV4 certificates (Stages 0-3). Source IDEA-20260913-9ba7fc
# under RQ-SEMBIN-fa2e3f / GOAL-SEMBIN-5078bc.
#
# Prerequisite instrument: SOLV4 (IDEA-20260913-449d2b). Sibling PR #1586
# designs the separation control; this contract embeds a self-contained
# Stage-1 SOLV4 gate on DREG anchors and does NOT target_id sibling EXP/H.
# ZERO RUNS in this design packet. No Magma/Sage/AUXIN/Bedrock as success
# path. NO curve attack. NO exponent.
# =============================================================================
experiment:
  id: EXP-SEMBIN-35bf67
  hypothesis_id: H-SEMBIN-d895d9
  question_id: RQ-SEMBIN-fa2e3f
  source_idea: IDEA-20260913-9ba7fc
  related_idea_ids:
    - IDEA-20260913-449d2b
    - IDEA-20260913-9c54f9
    - IDEA-20260913-191ed2
  goal_id: GOAL-SEMBIN-5078bc
  version: 1
  title: >-
    Stage-0 size/prediction freeze; Stage-1 SOLV4 instrument gate on DREG
    anchors + Semaev (40,2,2,20) baseline; Stage-2 decisive cells including
    Kosters (45,2,2,23); Stage-3 fixed-k / off-diagonal ladders for dφ/dk vs
    dφ/dn
  status: approved
  approved_by: DEC-20261002-99c798
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-99c798
    composing_decision: DEC-20261002-99c798
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null, including
      singular success_criterion and falsification_criterion). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 freezes sizes and preregistered predictions before any ladder
      RESULTS reading. Stage 1 gates the GF(2) SOLV4 instrument on DREG
      anchors and Semaev baseline SOLV4-hold. Stage 2 runs decisive cells.
      Stage 3 runs fixed-k / off-diagonal ladders. No Magma/Sage. No AUXIN.
      No Bedrock. No deployed-curve solve.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Measure the Assumption-1 solving-degree boundary as a surface in (n, k)
    using one-sided SOLV4 certificates: reproduce Semaev's (40,2,2,20)
    baseline, probe Kosters' (45,2,2,23) counter-datum, and decide whether
    the boundary is primarily in k (C1) or in n via fixed-k and fixed-n
    ladders — delivering exactly one O-* label from H-SEMBIN-d895d9.

  class: measurement
  class_note: >-
    Heuristic-validation / measurement of the Assumption-1 boundary surface.
    Feeds IDEA-20260913-9c54f9's sensitivity table. Not an exponent-moving
    breakthrough. Not a FIPS security verdict.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond reading/arithmetic). Write
        stage0/sizes.md (Macaulay dimensions and GiB estimates per cell),
        stage0/preregistered-predictions.json (C1/C2 bands, cell order,
        null/off-diagonal gates frozen before Stage 1), and
        stage0/cell-schedule.json.
      - >-
        Stage 1 (blocking instrument gate). Implement or wrap a four-Russians
        / M4RI-style GF(2) rank + degree-4 capped closure; reproduce
        EXP-DREG-001 anchor ranks; dual independent rank on a calibration
        matrix; verify builder solution set against point arithmetic on E at
        a tiny cell; confirm SOLV4 holds at (40,2,2,20) on a smoke sample
        (both arms) before the full Stage-2 ladder. On failure →
        O-ENGINE-FAIL / O-BASELINE-FAIL and stop.
      - >-
        Stage 2 (decisive cells, cheapest first). Run the schedule
        (30,2,2,15) → (40,2,2,20) full ≥100/arm → (21,3,3,7) → (45,2,2,23)
        → (25,3,3,9) → (50,2,2,25) within budget; SAT/UNSAT stratification
        with exact s; null arm at every decisive cell; dual GF(2) rank;
        write stage2/census.json.
      - >-
        Stage 3 (ladders). Off-diagonal gate at (40,2,2,{21,22}) and
        (25,3,3,10); fixed-k ladders k=4 (n=13..28) and k=7 (n=19..30) as
        far as budget; fit dφ/dk and dφ/dn with intervals; write
        stage3/ladders.json. Cells exceeding 8 GiB / 8 CPU-hours →
        O-CENSORED for that cell.
      - >-
        RESULTS.md with exactly one O-* label; memory beside time; no Magma
        as success path; cryptographic-scale Assumption 1 / FIPS verdicts
        forbidden.
    excluded:
      - Magma/Sage/cypari2/AUXIN/Bedrock as success path.
      - Degree-5 truncation / claiming exact degree 5 (declared impediment).
      - Any deployed-degree Semaev / ECDLP solve as a claimed result.
      - Editing IDEA-20260913-9ba7fc / GOAL-SEMBIN-5078bc.yaml claim text.
      - Editing EXP-DREG-001 artifacts (read-only).
      - Treating infra / censored cells as evidence against C1–C4.
      - Pooling planted and uniform-z / SAT and UNSAT strata.
      - Averaging disagreeing dual GF(2) ranks.
      - Citing sibling-only EXP/H identifiers as target_ids on this branch.

  inputs:
    idea: ledger/proposals/IDEA-20260913-9ba7fc.yaml
    hypothesis: ledger/hypotheses/H-SEMBIN-d895d9.yaml
    decision: ledger/decisions/DEC-20261002-99c798.yaml
    solv4_source_idea: ledger/proposals/IDEA-20260913-449d2b.yaml
    cost_consumer_idea: ledger/proposals/IDEA-20260913-9c54f9.yaml
    frozen_paper: inputs/SEMAEV-2015-310/paper_fulltext.md
    frozen_tables: inputs/SEMAEV-2015-310/tables.yaml
    dreg_analysis: experiments/EXP-DREG-001/analysis.md
    dreg_spec: experiments/EXP-DREG-001/specification.yaml
    kn_lit_fa346d: knowledge/literature/KN-LIT-fa346d.md
    kn_lit_e77232: knowledge/literature/KN-LIT-e77232.md
    kn_open_d218ec: knowledge/open-problems/KN-OPEN-d218ec.md
    reusable_impl_readonly:
      - src/h012c_block_m4ri.py
      - src/h012_peel_rank.py
      - src/ic_first_fall_fast.py

  controls:
    - name: stage0_freeze
      description: >-
        Sizes and preregistered predictions frozen before any Stage-1/2/3
        RESULTS reading; editing after freeze invalidates the packet.
    - name: dreg_anchor_gate
      description: >-
        Stage-1 GF(2) rank engine must reproduce EXP-DREG-001 anchor ranks
        before any ladder cell is trusted.
    - name: dual_gf2_rank
      description: >-
        Two independent GF(2) rank routines on the identical SOLV4 matrix;
        disagreement → O-ARTIFACT for that cell.
    - name: independent_solution_count
      description: >-
        s from V^t enumeration AND point arithmetic on E must agree;
        SOLV4 identity uses exact per-instance s, never a cell average.
    - name: satisfiability_stratification
      description: >-
        SAT vs UNSAT (and planted vs uniform-z where used) never pooled;
        Kosters probe reads the SAT arm separately.
    - name: null_arm
      description: >-
        T11-style support-matched semi-regular null at every decisive cell;
        matching failure rate → O-NULL-COLLAPSE.
    - name: off_diagonal_gate
      description: >-
        At n=40 also run k=21,22; certificate must separate diagonal from
        k-excess or report O-CEILING.
    - name: proves_too_much_assumption1
      description: >-
        Forbid reading toy (n≤50) cells as a cryptographic-scale Assumption 1
        / FIPS verdict; φ is reported on its measured domain only.
    - name: censoring_discipline
      description: >-
        Cell exceeding 8 GiB or 8 CPU-hours → O-CENSORED with partial state;
        never a degree observation.

  independent_variables:
    - name: field_degree_n
      levels: [13, 15, 19, 21, 25, 28, 30, 40, 45, 50]
    - name: arity_m
      levels: [2, 3]
    - name: chain_t
      levels: [2, 3]
    - name: subspace_dim_k
      levels: [4, 7, 9, 10, 15, 20, 21, 22, 23, 25]
    - name: satisfiability_stratum
      levels: [sat, unsat]
    - name: control_arm
      levels: [primary, null, k_excess]

  primary_metrics:
    - name: solv4_verdict
      definition: Boolean SOLV4(I); must match independent solution-count gate.
    - name: solv4_failure_rate
      definition: Per-cell per-arm fraction of instances with NOT SOLV4; bootstrap CI.
    - name: dim_R4
      definition: Dimension of the degree-4 capped closure fixed point.
    - name: M_le4
      definition: Number of squarefree monomials of degree ≤ 4.
    - name: solution_count_s
      definition: Exact independent solution count per instance.
    - name: closure_round_count
      definition: Iteration count of the degree-4 capped closure to fixpoint.
    - name: d_phi_dk
      definition: Fitted increase in certified-insufficient degree per unit k.
    - name: d_phi_dn
      definition: Fitted change in SOLV4 failure along fixed-k ladders in n.
    - name: peak_rss_bytes
      definition: Peak RSS; first-class beside time.
    - name: wall_time_seconds
      definition: Wall-clock per cell / instance batch.

  secondary_metrics:
    - name: dual_rank_agree
    - name: null_arm_failure_rate
    - name: builder_equality_pass
    - name: dreg_anchor_pass
    - name: censored_cell_flag

  seeds_and_replication:
    stage0_note: Deterministic arithmetic/prose; no RNG.
    stage1_smoke_seeds: 8
    stage2_instances_per_arm: 100
    stage3_instances_per_arm: 50
    replication_plan: >-
      Stage 0 exhaustive over the frozen schedule. Stage 1 smoke sample ≥8
      seeds at (40,2,2,20) after anchor gate. Stage 2 targets ≥100 instances
      per arm per decisive cell within budget (reduce with recorded shortfall
      rather than inventing counts). Stage 3 uses ≥50 per arm per ladder cell
      where affordable. Dual rank mandatory on every SOLV4 cell.

  budget:
    wall_clock_seconds: 86400
    memory_gb: 8
    maximum_runs: 60
    note: >-
      Advisory wall/CPU. Scientific sample counts above are frozen; CPU
      estimates are not rationing gates. Per-cell hard caps 8 GiB / 8
      CPU-hours → O-CENSORED / O-IMPEDIMENT, never a degree result.
      Degree-5 matrices (~132 GiB) are out of budget by design.

  stopping_rules:
    - SR-1. Stage 0 freeze before any Stage-1 RESULTS reading.
    - SR-2. If Stage 1 DREG anchors or dual-rank gate fail → O-ENGINE-FAIL; stop before Stage 2.
    - SR-3. If Stage 1 Semaev (40,2,2,20) smoke SOLV4 failure rate >0.10 → O-BASELINE-FAIL; stop before claiming Stage 2.
    - SR-4. If dual GF(2) ranks disagree → invalidate cell as O-ARTIFACT; do not average.
    - SR-5. If null arm matches primary failure rate at a decisive cell → O-NULL-COLLAPSE for that cell's Assumption-1 reading.
    - SR-6. If off-diagonal gate cannot separate diagonal from k+1 → O-CEILING; report and do not overclaim surface resolution.
    - SR-7. Cell RSS/wall-clock cap → O-CENSORED for that cell; continue other cells.
    - SR-8. Budget abort / crash → failed_infrastructure / O-IMPEDIMENT; never negative evidence against C1–C4.
    - SR-9. RESULTS.md must name exactly one primary O-* label even if some cells are censored.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze.
    - Pooling SAT and UNSAT (or planted and uniform-z) strata.
    - Averaging disagreeing dual GF(2) ranks.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.
    - Treating censored / impediment cells as falsification of C1.
    - Claiming cryptographic-scale Assumption 1 or FIPS break from n≤50 cells.
    - Editing IDEA-20260913-9ba7fc or GOAL-SEMBIN-5078bc.yaml.
    - Using a cell-average s in the SOLV4 identity.

  success_criterion: >-
    Stages 0-2 complete with artifacts present; RESULTS.md names exactly one
    of O-SURFACE-K, O-SURFACE-N, O-C1-N-AXIS, O-KOSTERS-NOREPRO,
    O-BASELINE-FAIL, O-NULL-COLLAPSE, O-CEILING, O-ENGINE-FAIL, O-ARTIFACT,
    O-CENSORED, O-IMPEDIMENT; every primary metric for executed stages
    recorded; Stage-0 sizes and predictions frozen before Stage 1; Stage 1
    DREG-anchor and dual-rank gates passed or named O-ENGINE-FAIL stop;
    Stage 3 either delivers ladder fits or records per-cell O-CENSORED /
    shortfall without blocking Stages 0-2 deliverables; memory reported
    beside time.

  falsification_criterion: >-
    C1's k-reading falsified (→ O-C1-N-AXIS / O-SURFACE-N) iff fitted dφ/dk
    is indistinguishable from 0 across k=15..25 at m=2 while dφ/dn is not.
    Kosters φ(k)≥5 for k≤23 falsified (→ O-KOSTERS-NOREPRO) iff SOLV4 holds
    at (45,2,2,23) on both arms over ≥100 instances each. Semaev baseline /
    instrument falsified (→ O-BASELINE-FAIL) iff SOLV4 failure rate at
    (40,2,2,20) exceeds 0.10. Arithmetic-vs-shape falsified
    (→ O-NULL-COLLAPSE) iff null arm matches primary failure rate.
    Method ceiling (→ O-CEILING) iff certificate cannot separate diagonal
    from k-excess. Engine falsified (→ O-ENGINE-FAIL) on Stage-1 DREG-anchor
    or dual-rank failure. Cell instrument falsified (→ O-ARTIFACT) on
    dual-rank disagreement or s mismatch.

  required_artifacts:
    - stage0/sizes.md
    - stage0/preregistered-predictions.json
    - stage0/cell-schedule.json
    - stage1/engine-gate.json
    - stage1/baseline-smoke.json
    - stage2/census.json
    - stage3/ladders.json OR stage3/shortfall.json
    - RESULTS.md
    - runs/<RUN-SEMBIN-*>/manifest.yaml

  protocol_amendments: []
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
