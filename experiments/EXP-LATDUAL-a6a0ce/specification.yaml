experiment:
  id: EXP-LATDUAL-a6a0ce
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-58dfe7; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-58dfe7
  question_id: RQ-MLKEM-003
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Derive the convention-transport map for the primal-dual cost comparison from the corpus's
    recorded primitive-count decompositions, and tabulate per-coordinate sign-stability thresholds
    against a random-pair null
  objective: 'The run reduces one uncertainty: how much of the primal-minus-dual bit gap is contributed
    by the choice of cost convention rather than by the attacks, and whether the gap''s sign survives
    the price spread the corpus''s own conventions span. Stated as parts: (i) can all six primitive
    counts be extracted for both attacks from KN-TECH-039, KN-TECH-040 and KN-TECH-044 with a quoted
    source line each, or does the derivation terminate at undetermined by available notes with a named
    missing quantity; (ii) at three parameter points, what are the per-coordinate share differences,
    the transport differences between the three conventions in bits, and the six sign-stability thresholds;
    (iii) are those thresholds distinguishable from the random-pair null''s, and do any conclusions
    flip under the adversarial perturbation the source notes'' own stated uncertainty admits. The
    run is not asked which attack is faster and is not asked anything about deployed parameter sets.
    A run terminating at undetermined, with the missing quantity named, is a complete run and identifies
    exactly what the corpus would have to record to answer KN-OPEN-016''s stated closure condition.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: given the primitive-count
      decompositions as recorded in the named technique notes and the three price covectors as written,
      the primal-minus-dual gap transports between conventions by the tabulated amounts at the tabulated
      parameter points, and its sign flips under the tabulated per-coordinate price perturbations.
      WHAT DOES NOT FOLLOW: nothing about which attack is actually faster under any convention, since
      no cost is computed against any real instance; nothing about whether any convention is physically
      correct; no claim that any published comparison is wrong; nothing about ML-KEM, FIPS 203 or
      any deployed system; and no statement holding beyond the three conventions written down or under
      re-optimisation, whose correction this map cannot carry.'
  inputs:
    procedure: 'STAGE 0 (cost: 0 compute, ~4h human). Fix the six primitive coordinates, the three
      conventions, the three parameter points and the random-pair null''s coordinate ranges, and freeze
      them before extraction. STAGE 1 (cost: 0 compute, ~6h human, dominant). Extract v_primal and
      v_dual from the three technique notes with a quoted source line per count; terminate and report
      if any count is unavailable. STAGE 2 (cost: trivial). Write the three price covectors as explicit
      functions of the shared parameters. STAGE 3 (cost: trivial). Compute shares, G, transport differences
      and the six sign-stability thresholds at each parameter point in exact rational arithmetic where
      possible. STAGE 4 (cost: trivial). Random-pair null over 1000 draws through the identical code
      path, and the forced-degenerate control. STAGE 5 (cost: trivial). Convention round-trip check.
      STAGE 6 (cost: low). Adversarial perturbation of every count over the range its source note''s
      uncertainty admits, with all conclusions re-derived and any flip reported. STAGE 7 (cost: trivial).
      Emit the table and immutable run records through harness/runner.py.'
    instrument: Python 3.11 standard library only; no numpy, no fpylll, no Sage, none of which is
      installed here and none of which is needed, since the derivation is arithmetic on symbolic expressions
      represented as plain Python callables over the shared parameters. fractions.Fraction for exact
      share arithmetic where the expressions permit it, and math.log2 with recorded precision where
      they do not. The random-pair null uses random.Random seeded per run. Extraction is manual against
      the named technique notes with source lines quoted into the record. Output through harness/runner.py.
    parameters: 'Six primitive coordinates: sieve invocations at blocksize, sieve database size, dual-vector
      count N, FFT table size, memory words, memory accesses. Three conventions: core-SVP pricing
      only sieve calls at 2^{0.292 beta}; a gate-count convention pricing operations; a memory-charged
      convention pricing words and accesses at a nonzero rate parameterised by the wiring exponent
      KN-OPEN-017 records as absent from the corpus. Three parameter points spanning the recorded
      range of dimension, blocksize, sample count and k_fft. Random-pair null: 1000 draws with each
      coordinate log-uniform over the range spanned by the real pair''s own values.'
  controls:
  - 'Random-pair null: primitive-count vectors drawn from the same coordinate ranges with no algorithmic
    meaning, through the identical pipeline in the same invocation.'
  - Forced-degenerate control with v_primal = v_dual, where G must be exactly zero and thresholds
    undefined.
  - 'Adversarial extraction check: every count perturbed by the largest error its source note''s stated
    uncertainty admits, with conclusions re-derived.'
  - 'Convention round-trip: T(c1->c2) composed with T(c2->c1) must be exactly zero.'
  - 'Parameter-point sensitivity: all conclusions re-derived at three parameter points, with any point-dependent
    conclusion reported as point-dependent.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a synthetic attack pair with primitive-count vectors
    drawn at random from the same coordinate ranges, with no relationship to any real algorithm, run
    through the identical symbolic pipeline in the same invocation. The null must show what a structureless
    pair shows: sign-stability thresholds distributed broadly with no coordinate systematically dominating,
    and a transport map whose magnitude is the generic scale set by the price spread alone. If the
    real pair''s thresholds are indistinguishable from the random pair''s, then the primal-dual comparison
    carries no more convention structure than two arbitrary cost expressions do, and the derivation''s
    headline is a generic fact about log-linear costs rather than anything about these attacks, recorded
    as a controlled null under inventor-protocol section 3. A second control fixes v_primal = v_dual
    exactly, forcing G = 0 and every threshold undefined; the pipeline must report exactly that.'
  independent_variables:
  - cost convention c
  - parameter point
  - primitive coordinate j
  - attack (primal versus dual)
  metrics:
    primary:
    - share of each primitive coordinate per attack per convention per point
    - G under each convention per point
    - sign-stability threshold per coordinate in bits
    - transport difference T(c1->c2) in bits
    secondary:
    - random-pair null distribution of dominant share difference
    - round-trip residual
    - number of conclusions changing under adversarial perturbation
    - count of coordinates priced at zero by each convention
    - source line quoted per extracted count
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The six sign-stability thresholds, for each primitive coordinate the number of bits
      by which its log price must change to set G to zero, tabulated at three parameter points beside
      the recorded spread of that coordinate's price across the three conventions.
    formula: 'Let cost_A(c) = sum_j p_{c,j} * v_{A,j} for A in {primal, dual}. Define share_j(A, c)
      = p_{c,j} v_{A,j} / cost_A(c). Then G(c) = log2 cost_primal(c) - log2 cost_dual(c) and dG/d(log2
      p_j) = share_j(primal, c) - share_j(dual, c) =: delta_j(c). The sign-stability threshold in
      coordinate j is tau_j(c) = -G(c)/delta_j(c) bits, undefined when delta_j = 0. The convention-artifact
      fraction of a reported gap is |G(c2) - G(c1)| / max(|G(c1)|, |G(c2)|). The predicted discriminator:
      tau in the memory-word coordinate is smaller than the recorded price spread of that coordinate
      across the three conventions, which would make the primal-dual sign convention-determined at
      the tabulated points.'
    source: Pre-registered in the parent proposal IDEA-20260816-58dfe7 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'No instance is generated and no algorithm is executed, so there is no tested dimension
      in the usual sense; the derivation is evaluated symbolically and instantiated at three parameter
      points drawn from the ranges the corpus''s own technique notes record. The transfer assumption
      is unusual for this bucket and is stated twice: the map is exact for any parameter point at
      which the extracted primitive-count expressions are valid, so its scope is set by the validity
      of those expressions rather than by a computational ceiling; and because those expressions come
      from this corpus''s notes rather than primary sources, the honest scope is exact given the corpus''s
      recorded cost decompositions, with every conclusion inheriting any error in them. Nothing is
      claimed about ML-KEM parameter sets or about which attack is faster.'
    correspondence: null
  tail_checks:
  - Coordinates priced at zero by a convention, where shares vanish and thresholds are undefined;
    reported as undefined rather than as infinite.
  - Parameter points where G is near zero, so every threshold is near zero and the sign is trivially
    unstable; flagged as degenerate.
  - The adversarial-perturbation extremes, where an extracted count sits at the edge of its admitted
    range.
  - The random-pair null's own tail, where a draw happens to reproduce the real pair's share structure.
  - The memory-charged convention's wiring parameter at both ends of its stated range, since KN-OPEN-017
    records that the corpus has no model fixing it.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report undetermined by available notes, naming the missing quantity, if any primitive
    count cannot be extracted with a quoted source line.
  - Stop the adversarial check at the stated perturbation range rather than searching for a worst
    case.
  - Stop the random-pair null at 1000 draws.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A threshold table is produced for all six coordinates at three parameter points
    with quoted source lines for every extracted count, the round-trip residual is exactly zero, the
    forced-degenerate control returns G = 0, and the random-pair null's distribution is reported beside
    the real pair's thresholds, whatever the thresholds turn out to be.
  falsification_criterion:
  - 'Round-trip residual nonzero: the transport map is misderived and the table is void.'
  - 'Forced-degenerate control does not give G = 0: the share computation is wrong.'
  - 'Real-pair thresholds indistinguishable from the random-pair null: the derivation reports a generic
    property of log-linear costs rather than a fact about these attacks.'
  - 'A primitive count cannot be extracted with a quoted source line: the run returns undetermined
    by available notes with the missing quantity named, which is the honest deliverable.'
  - 'Conclusions flip under the adversarial perturbation the notes'' own uncertainty admits: the map
    cannot support a verdict at the corpus''s current provenance level.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-58dfe7
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The re-optimisation correction, in which each attack re-tunes its internal parameters under a
    changed convention so that v depends on p, is named as unbounded and not estimated; a Coordinator
    must decide whether a fixed-v map may be reported at all without it.
  - The six primitive coordinates are asserted to span every convention the corpus records; that spanning
    claim is not proved and must be checked against KN-TECH-039, KN-TECH-040 and KN-TECH-044 line
    by line before approval.
  - The price covector for the memory-charged convention requires a wiring model KN-OPEN-017 records
    as absent from the corpus, so that column is parameterised rather than fixed.
  - 'Whether extracted counts may be used at all when their source notes are marked confidence: reported
    is a provenance decision.'
