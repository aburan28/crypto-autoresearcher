experiment:
  id: EXP-AEADC-71fe6c
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-bfa08e; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-bfa08e
  question_id: RQ-AEADC-8db132
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compare pre-registered symbolic commitment budgets against exhaustively measured colliding-context
    counts across a declared family of toy AEAD compositions under an ideal permutation, with negative-budget
    and positive-budget calibration arms
  objective: 'The one uncertainty a run reduces is whether a mode''s exposure to context collision
    can be predicted by counting, before any search, from the composition''s dataflow alone. Concretely:
    (i) does the pre-registered budget -- adversary-controlled variables minus independent target
    constraints -- match the base-two logarithm of the exhaustively counted colliding contexts to
    within one bit, per mode, at fragment depth 1, where constraint independence is closest to inspectable;
    (ii) at what fragment depth does that agreement first fail, since the failure locates the first
    pair of fragments whose equations are individually independent and jointly dependent, and that
    dependency is a reusable structural fact worth more than the agreement; (iii) is the accounting
    a mode-level object, established by requiring the negative-budget null mode to return exactly
    zero solutions, the positive control to return a count matching its budget, and the ideal-permutation
    and real-primitive arms to agree within one bit at the deepest mode. A run therefore either supplies
    a cheap pre-search filter for which modes deserve certificate work, or names precisely where such
    a filter breaks.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the six declared toy compositions
      at 8-bit block width, under the declared commitment target and the declared context bound, the
      exhaustive search found the reported solution counts, and those counts agreed or disagreed with
      the pre-registered budgets by the reported number of bits. What does NOT follow: nothing about
      AES-GCM, ChaCha20-Poly1305, AES-GCM-SIV or any standard-parameter mode; no certificate at any
      deployed parameters; no attack, break, feasibility or security consequence, since a solution
      count says nothing about the cost of finding a solution; no claim that a positive budget makes
      an attack possible or that a negative one makes it impossible outside the declared target and
      family; and no statement about published work.'
  inputs:
    procedure: 'STAGE 0, zero compute, days of human effort: fix the dataflow language, declare the
      six-mode family including the negative-budget null and the positive control, and state the commitment
      target as a formal equation system. STAGE 1, zero compute: count controlled variables and independent
      constraints per mode, write the independence argument, record predicted budgets, and hash the
      file before any code exists. STAGE 2, hours of human effort: write a second independent derivation
      of one mode''s counts from the dataflow alone and compare. STAGE 3, minutes: implement the six
      modes at 8-bit block width with a seeded ideal permutation in the primitive slot, validating
      round trips. STAGE 4, under one hour: search the entire declared context space exhaustively
      per mode, counting solutions exactly and recording each. STAGE 5, minutes: rerun the deepest
      mode with a pinned real primitive. STAGE 6, zero compute: emit predicted budgets, measured counts,
      per-mode error in bits, the located failure depth, both calibration arms and the primitive comparison
      into an immutable run record via harness/runner.py.'
    instrument: 'Python 3, standard library only: a small dataflow interpreter that builds each toy
      mode from declared fragments, a seeded lazily-sampled bijection for the ideal-primitive slot,
      a pinned pure-Python block cipher validated against published test vectors for the real-primitive
      arm, and an exhaustive context enumerator. The constraint system is written and counted by hand
      in stage 1, not by the code, so the run tests the hand derivation rather than reproducing it.
      Manifest emission and seeding through harness/runner.py, in the pattern of harness/run_blocknull.py.
      No Sage, no solver library, no network.'
    parameters: 'Block width 8 bits. Six toy compositions: fragment depths 1, 2 and 3 in two variants
      each, with one depth-1 variant constructed to have a negative budget and one depth-1 variant
      constructed to have a large positive budget. Declared context space: all keys in 8 bits, all
      nonces in 8 bits, associated data of 0, 1 or 2 blocks, message length fixed at 2 blocks, giving
      a context space of at most 2^24 per mode, enumerated in full. Commitment target: two distinct
      contexts opening one fixed ciphertext-tag pair to two valid plaintexts. Additive slack for the
      budget comparison fixed at one bit. One real-primitive arm at the deepest mode.'
  controls:
  - Negative-budget null mode, exhaustively searched in the same invocation, which must return zero
    solutions.
  - Large-positive-budget positive control, which must return a solution count matching its budget
    within slack.
  - Pre-registered budget file, hashed before the searcher runs, so no constraint count can be adjusted
    after seeing counts.
  - Exhaustive rather than sampled search, so the measured count carries no sampling error to confound
    the comparison.
  - Real-primitive arm at the deepest mode, separating a mode result from a primitive result.
  - Independent recount of one mode's variables and constraints by a second derivation written from
    the dataflow alone.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two arms in the same invocation. NULL ARM: a mode in the declared family
    whose dataflow is constructed to make the budget negative -- more independent constraints than
    controlled variables -- which must return exactly zero colliding contexts under exhaustive search.
    If it returns any, the constraint count is wrong and the whole accounting is void. POSITIVE CONTROL:
    a mode whose budget is large and positive, which must return a solution count whose logarithm
    matches the budget within slack; if it returns none, the search is broken and every zero reported
    elsewhere is uninformative. The pair calibrates the accounting from both sides, and both run against
    the identical exhaustive searcher.'
  independent_variables:
  - toy mode within the declared family
  - fragment depth of the composition
  - associated-data block count
  - primitive slot occupant
  metrics:
    primary:
    - exact colliding-context solution count per mode
    - pre-registered budget per mode
    - absolute prediction error in bits per mode
    - fragment depth at which prediction error first exceeds one bit
    - solution count of the negative-budget null mode
    - solution count of the positive control
    secondary:
    - rank correlation between predicted budgets and measured log counts across the family
    - solution-count difference across primitive slots at the deepest mode
    - agreement of the second independent derivation on one mode
    - exhaustive search wall-clock per mode
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The commitment budget of every mode in the family, and the solution count of the negative-budget
      null mode.
    formula: Budget equals V minus C, where V is the number of adversary-controlled variables in the
      mode's dataflow with the ciphertext and tag held fixed -- counting key bits, nonce bits, associated-data
      bits within the declared bound, and one fresh variable per ideal-permutation output not already
      determined -- and C is the number of independent equations the commitment target imposes, counting
      one equation per output block that must match and one injectivity equation per pair of ideal-permutation
      calls sharing an input. The predicted base-two logarithm of the colliding-context count equals
      the budget, and the negative-budget null mode is predicted to have exactly zero solutions because
      V is strictly less than C.
    source: Pre-registered in the parent proposal IDEA-20260816-bfa08e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at 8-bit block width over a context space of at most 2^24 per mode, chosen
      as the largest size at which the entire space is enumerable so the solution count carries no
      sampling error and the comparison against the predicted budget is exact. The transfer assumption
      is stated and deliberately not exercised: the incidence structure from which the budget is derived
      is combinatorial and independent of block width, so the budget formula would read identically
      at cryptographic widths, but the AGREEMENT between budget and count is verified only here, and
      this contract projects no agreement to any larger width. The one width-specific artifact --
      injectivity constraints from an 8-bit permutation binding more tightly than they would at 128
      bits -- is recorded as a metric so a later reader can see its size.'
    correspondence: null
  tail_checks:
  - Modes returning zero solutions are re-searched with the target relaxed by one equation, which
    must then return a nonzero count, confirming the searcher reaches that region.
  - Solution counts at the boundary of the declared context space are inspected for clustering, which
    would indicate the bound is truncating the count.
  - Modes whose measured count exceeds its budget by more than one bit are checked for degenerate
    solutions in which the two contexts coincide, which must be excluded.
  - The injectivity-constraint count is compared against the number of actual repeated permutation
    inputs observed, since a large gap means the constraint count is nominal rather than binding.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report the accounting void, without publishing the family table as evidence, if the negative-budget
    null mode returns any solution.
  - Halt if the positive control returns zero, and report the searcher invalid.
  - Cap total exhaustive search at four core-hours; report modes completed by name and list incomplete
    modes as missing rather than as zero.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A completed family sweep in which the negative-budget null returns exactly zero,
    the positive control returns a nonzero count matching its budget within one bit, and every mode
    carries an exact solution count alongside its pre-registered budget and a stated prediction error
    in bits.
  falsification_criterion:
  - The negative-budget null returns a nonzero solution count.
  - The positive control returns zero solutions.
  - Prediction error exceeds one bit at fragment depth 1 for a majority of the family.
  - Predicted budgets show no rank correlation with measured log counts across the family.
  - The ideal-permutation and real-primitive arms differ by more than one bit at the deepest mode.
  - The second independent derivation disagrees with the first on the mode it recounts.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-bfa08e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The dataflow language is described by its node types but not formally specified; the Coordinator
    must fix it, since an ambiguous language makes the run a test of the derivation rather than of
    the accounting.
  - The independence argument for the constraint sets is the load-bearing content of stage 1 and does
    not exist yet; approval should require it in writing, per mode.
  - The six-mode family is described by depth and budget sign but its members are not written down,
    and choosing them after forming intuitions about which collide would bias the whole table.
  - The one-bit slack is asserted rather than derived from the granularity of the counts at the tested
    context-space size.
