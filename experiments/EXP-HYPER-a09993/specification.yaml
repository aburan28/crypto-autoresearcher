# =============================================================================
# EXP-HYPER-a09993 — version 1, approved by DEC-20261006-2a89a2.
# Frozen measurement: Cantor doubling of (x^2 + 1, 0) on one sextic
# over F_11, against a degree-5 null that must reject that input.
# The prediction (indicators 1, 1, 0) is fixed here, before any executor
# run. This design session expanded the named products. It did not run
# Cantor doubling. It did not open either named PDF.
# Source idea IDEA-20261005-0aecda is not on origin/main; its existing
# bytes are on this branch unchanged. No Richelot triple and no Prym
# dimension are authorized.
# =============================================================================
experiment:
  id: EXP-HYPER-a09993
  hypothesis_id: H-HYPER-743469
  question_id: RQ-HYPER-7ca025
  source_idea: IDEA-20261005-0aecda
  goal_id: null
  version: 1
  title: >-
    Cantor doubling of (x^2 + 1, 0) on the named sextic over F_11,
    against the named degree-5 null
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-06'
  packaging_only: false
  approval:
    approved_by: coordinator
    composing_decision: DEC-20261006-2a89a2
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06:
      "all is approved. ideas/experiments should be always approved")
      because every field the design protocol requires is non-null.
      Approval does not assert that the doubling returns zero, and it
      does not assert an ECDLP exponent improvement.
    implementation_authorized: true
    scientific_execution_authorized: true
    scientific_execution_scope: >-
      Expand the two named products, test acceptance of two named
      Mumford pairs, double the accepted pairs on the sextic, and do
      not double a rejected input. Do not evaluate a Richelot triple
      and do not compute a Prym dimension.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether one Cantor doubling sends the Mumford divisor
    (x^2 + 1, 0) to the zero class on the sextic C6, and whether the
    degree-5 null C5 rejects that same input. The pre-registered
    positive side is both halves, plus a nonzero double of (x, 2) on
    C6. Failure of either half is a negative. A zero double of (x, 2)
    is also a negative. No ECDLP exponent is in scope.

  inputs:
    field: F_11
    curves:
      - id: C6
        name: sextic
        equation: y^2 = (x^2 + 1)(x^2 + x + 2)(x^2 + 2)
        role: Jacobian on which the order-2 reading is predicted
        design_session_expansion: x^6 + x^5 + 5x^4 + 3x^3 + 8x^2 + 2x + 4
        design_session_squarefree: gcd with derivative is 1
      - id: C5
        name: degree-5 null
        equation: y^2 = (x^2 + x + 2)(x^2 + 2)(x - 1)
        role: same input shape on a curve the quadratic does not divide
        design_session_expansion: x^5 + 3x^3 + 9x^2 + 2x + 7
        design_session_squarefree: gcd with derivative is 1
    divisors:
      - id: D2
        u: x^2 + 1
        v: 0
        role: predicted order-2 class on C6, predicted rejection on C5
      - id: Dn
        u: x
        v: 2
        role: nontorsion control on C6
        design_session_congruence: f(0) = 4 = 2^2 in F_11
    infinity:
      instruction: >-
        State which infinity convention is coded before any doubling.
        C6 is an even-degree model. The idea's assumption is two points
        at infinity. Record the reduced Mumford representative used for
        the identity. A label zero without that representative is not
        a class.
    checksum_authority: >-
      The factored equations are the curves. The expanded polynomials
      are a design-session checksum. Re-expand from the factors. A
      mismatch with the checksum is an arithmetic split and invalidates
      the run. It is not a negative on the doubling claim.
    forbidden:
      - Do not evaluate a Richelot codomain triple (U, V, W).
      - Do not compute a Prym dimension.
      - Do not double an input that the acceptance test rejects.
      - Do not claim an ECDLP exponent improvement.
      - Do not treat the design-session expansion as a completed doubling.

  controls:
    - id: degree5-rejects-the-same-input
      statement: >-
        C5 is the same shape of input pair on a curve of the wrong
        degree. x^2 + 1 does not divide g. Acceptance of D2 on C5
        falsifies the guard.
      pass_condition: D2 is rejected on C5 and is not doubled there
      on_fail: >-
        Acceptance is a negative for the second half of the prediction.
        Doubling a rejected input invalidates the run.
    - id: nontorsion-double-is-not-zero
      statement: >-
        Dn = (x, 2) is a rational divisor on C6 with nonzero v.
        Doubling it to zero means the order-2 outcome was not special
        to D2.
      pass_condition: Dn is accepted on C6 and its double is not the zero class
      on_fail: >-
        A zero class for Dn is a negative. The order-2 signal is then
        not distinguished.
    - id: two-acceptance-implementations
      statement: >-
        Acceptance by polynomial remainder and acceptance by evaluation
        at the roots of u must agree on D2 for both curves and on Dn
        for C6.
      pass_condition: the two bits agree on each of those three tests
      on_fail: >-
        Disagreement is an implementation split. The order claim is
        unsigned. The run is invalid, not a negative on the Jacobian.
    - id: checksum-reexpansion
      statement: >-
        The executor re-expands both factored polynomials over F_11 and
        records the coefficients.
      pass_condition: >-
        C6 expands to x^6 + x^5 + 5x^4 + 3x^3 + 8x^2 + 2x + 4 and C5
        expands to x^5 + 3x^3 + 9x^2 + 2x + 7
      on_fail: >-
        The run is invalid. Do not score the doubling against a
        polynomial that is not the named product.
    - id: infinity-convention-stated
      statement: >-
        The run names the infinity convention and the representative of
        the identity before interpreting a double as zero.
      pass_condition: both are recorded, and the zero indicator is decided against that representative
      on_fail: >-
        The run is invalid. An unstated convention can report a nonzero
        class as zero by mis-counting points at infinity.

  independent_variables:
    - which curve is tested, C6 or C5
    - which divisor is tested, D2 or Dn
    - which acceptance implementation is used, remainder or root evaluation

  metrics:
    primary:
      - id: order2_double_is_zero
        statement: >-
          1 if doubling D2 on C6 returns the identity representative
          in the stated convention, else 0.
      - id: degree5_rejected
        statement: >-
          1 if both acceptance implementations reject D2 on C5, else 0.
          A rejected input is not doubled.
    secondary:
      - id: nontorsion_double_is_zero
        statement: 1 if doubling Dn on C6 returns the identity, else 0.
      - id: acceptance_implementations_agree
        statement: 1 if the two acceptance implementations agree on the three tests, else 0.
      - id: checksums_match
        statement: 1 if both expansions match the design-session checksums, else 0.
      - id: infinity_convention_stated
        statement: 1 if the convention and the identity representative are recorded, else 0.
      - id: richelot_computed
        statement: Boolean. The design-session value is false. The run value must stay false.
      - id: prym_computed
        statement: Boolean. The design-session value is false. The run value must stay false.

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 is the order-2 reading on this one sextic, with the degree-5
    null outside the domain. A failed indicator falsifies it here. It
    is not an ECDLP exponent.

  preregistered_prediction:
    quantity: >-
      The indicator that doubling D2 on C6 returns zero, the indicator
      that C5 rejects D2, and the indicator that doubling Dn on C6
      returns zero.
    formula: >-
      order2_double_is_zero = 1. degree5_rejected = 1.
      nontorsion_double_is_zero = 0. Failure of either of the first two
      equalities is a negative. The third equality failing is also a
      negative. No Richelot triple and no Prym dimension enter the
      formula.
    source: >-
      IDEA-20261005-0aecda, copied before any run of EXP-HYPER-a09993.
      The design session on 2026-10-06 expanded the named products over
      F_11 and did not run Cantor doubling. KN-LIT-1371 and KN-LIT-921
      were opened as markdown and do not state this prediction.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are q = 11 and degree at most 6. A result
      on these two curves is not a result at another prime and not a
      transfer to cryptographic genus-2 parameters. No extrapolation
      is authorized.
    correspondence: >-
      Direct arithmetic on the two named curves. No Deuring
      correspondence and no sampling equivalence is used.

  tail_checks:
    - >-
      There is no sampled tail. The census is two divisors on C6 and
      one rejection on C5. The extreme check is the degree-5 null: the
      input that is predicted to be an identity after doubling on C6
      is predicted to be rejected on C5. Acceptance there is the
      procedure failure of the guard, and it is a negative.

  replication:
    seeds:
      - name: arithmetic
        algorithm: deterministic expansion, Mumford congruence, and one Cantor doubling
        seed: 11
        note: >-
          No random generator is consulted. seed 11 records the field.
          Substituting a random curve or a random divisor is forbidden.
    independent_instances: 2
    independent_instances_note: >-
      The two curves are the census. They are not two draws from a
      distribution. Dn is a control divisor on C6, not a third curve.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 1
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      Time and CPU figures are advisory machine-protection watches
      (docs/research-budget-policy.md). maximum_runs is 1. The
      scientific work is one doubling of D2, one doubling of Dn, and
      the rejection check on C5. Watch expiry is failed_infrastructure,
      never a negative mathematical result.

  procedure:
    expand: >-
      Expand both factored polynomials over F_11. Record coefficients
      from degree 0 upward. Record gcd with the formal derivative.
      Compare with the checksums. On mismatch, stop as invalid.
    accept: >-
      For D2 on C6, D2 on C5, and Dn on C6, compute the remainder of
      v^2 minus the curve polynomial modulo u, and separately evaluate
      v^2 minus the curve polynomial at each root of u in a splitting
      extension. Record both bits. If they disagree, stop as invalid.
    double: >-
      On C6, if D2 is accepted, run one Cantor doubling and record the
      reduced representative and whether it is the identity in the
      stated convention. Do the same for Dn. On C5, if D2 is rejected,
      record the rejection and do not double. If D2 is accepted on C5,
      record that acceptance as the negative and still do not double.
    forbidden: >-
      Do not evaluate a Richelot triple (U, V, W). Do not compute a
      Prym dimension. Do not claim an ECDLP exponent improvement. Do
      not add a second prime.
    mechanism_assignment:
      - observation: >-
          order2_double_is_zero is 1, degree5_rejected is 1,
          nontorsion_double_is_zero is 0, the acceptance
          implementations agree, the checksums match, the infinity
          convention is stated, and neither a Richelot triple nor a
          Prym dimension was computed.
        assigns_to: >-
          The order-2 reading holds on this sextic. C5 rejected the
          input. This is not an identity with a Richelot codomain and
          not an ECDLP result.
      - observation: >-
          Doubling D2 on C6 returns a class that is not the identity.
        assigns_to: >-
          The first half of the prediction fails. This is a negative.
          Quote the representative that was returned.
      - observation: >-
          C5 accepts D2.
        assigns_to: >-
          The second half of the prediction fails. This is a negative.
          Do not repair it by doubling the accepted pair.
      - observation: >-
          Doubling Dn on C6 returns the identity.
        assigns_to: >-
          The order-2 outcome was not special to D2. This is a
          negative for the distinguished-order reading.
      - observation: >-
          The acceptance implementations disagree, the checksums
          differ, the infinity convention is unstated, a rejected
          input was doubled, a Richelot triple or a Prym dimension
          was computed, or the watch expires.
        assigns_to: >-
          Invalid, or failed_infrastructure, as the matching
          invalidation rule says. Not evidence that the class has
          order 2, and not evidence that it does not.

  stopping_rules:
    - Stop when both curves have an expansion, both divisors on C6 have a double or an invalidation, and C5 has an accept-or-reject bit.
    - Do not add a third curve. Do not add a second prime. Do not evaluate a Richelot triple.
    - Watch expiry stops the run as failed_infrastructure.

  invalidation_rules:
    - A timeout, crash, memory abort, or missing arithmetic library is failed_infrastructure and is not evidence against the hypothesis.
    - Doubling an input that failed the acceptance test invalidates the run.
    - Leaving the infinity convention unstated, or labeling a class zero without quoting the identity representative, invalidates the zero indicator.
    - Disagreement of the two acceptance implementations invalidates the order claim. It is an implementation split.
    - A checksum mismatch invalidates the run. The factored equation is the curve. Do not score a different polynomial.
    - Computing a Richelot triple or a Prym dimension, or stating an ECDLP exponent improvement, invalidates the run.
    - Changing the pre-registered prediction after seeing the doubles is forbidden. A correction is a new amendment record, and an existing run is not re-scored against it.

  success_criterion: >-
    The run is a success for the order-2 reading exactly when the first
    row of mechanism_assignment holds: doubling D2 on C6 returns the
    zero class, C5 rejects D2, doubling Dn on C6 does not return the
    zero class, and the acceptance implementations agree. Any other
    completed assignment is not this success. In particular, failure of
    either half of the prediction is not a success.

  falsification_criterion: >-
    The prediction fails when either half fails: doubling D2 on C6 does
    not return the zero class, or C5 accepts D2. Either one is a
    negative. Doubling Dn on C6 to the zero class is also a negative.
    The fifth row of mechanism_assignment falsifies nothing about the
    Jacobian.

  required_artifacts:
    - experiments/EXP-HYPER-a09993/runs/RUN-*/manifest.yaml
    - experiments/EXP-HYPER-a09993/runs/RUN-*/stdout.txt
    - experiments/EXP-HYPER-a09993/runs/RUN-*/stderr.txt
    - experiments/EXP-HYPER-a09993/runs/RUN-*/reading.yaml
  artifact_contents:
    reading.yaml: >-
      The infinity convention and the identity representative. Both
      expansions and both gcd bits. For D2 on C6, D2 on C5, and Dn on
      C6, both acceptance bits. For each accepted double on C6, the
      reduced representative and the zero indicator. Then the eight
      metric values, the control bits, and exactly one
      mechanism_assignment row. richelot_computed and prym_computed
      are false.
  assigned_to: executor
