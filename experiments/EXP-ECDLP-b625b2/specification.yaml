# EXP-ECDLP-b625b2
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-b993eb.
experiment:
  id: EXP-ECDLP-b625b2
  hypothesis_id: H-ECDLP-a5dc8c
  source_idea: IDEA-20261004-787337
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 16777215
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-b993eb
  objective: >-
    Check the counts 24, 23, and 23, the product 12696, and the nearby gap 0.
  inputs:
    bit_length: 24
    doublings: 23
    additions: 23
    length_gap: 1
    doubling_gap: 0
    digit_product: 12696
    digit_sum: 70
    nearby_a: 23
    nearby_b: 23
    nearby_gap: 0
    nearby_product: 529
  controls:
    - >-
      The bit length is 24. The doubling count is 23. The addition
      count is 23. Reporting the addition count as 24 drops the gap
      against the bit length and invalidates the run.
    - >-
      Twenty-four exceeds twenty-three by 1. Twenty-three equals
      twenty-three, so that gap is 0. The product of 24, 23, and 23
      is 12696. Their sum is 70.
    - >-
      Two readings of the addition count are both 23. Their gap is
      0 and their product is 529.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 16777215 has bit length 24, 23 doublings, and 23
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 24. Count 23 doublings. Count 23 additions.
      Multiply 24, 23, and 23. Subtract 23 from 23.
    source: >-
      IDEA-20261004-787337 states the counts 24, 23, and 23, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 12696 and the nearby gap 0 are required. A check that stops at the bit length 24 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 23 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 24.
    - The doubling count is not 23.
    - The addition count is not 23.
    - The product is not 12696.
    - The addition count is reported as 24, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 24, that the doubling
    count is 23, that the addition count is 23, and that the product
    of those three counts is 12696.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 23.
  required_artifacts:
    - experiments/EXP-ECDLP-b625b2/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-b625b2/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-b625b2/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-b625b2/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-b625b2/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-b625b2/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
