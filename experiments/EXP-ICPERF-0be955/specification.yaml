# EXP-ICPERF-0be955
# Row ceilings and the rho byte ratio. No matrix.
# Approved by DEC-20261002-047900.
experiment:
  id: EXP-ICPERF-0be955
  hypothesis_id: H-ICPERF-d9daf6
  source_idea: IDEA-20260926-3cc0b8
  question_id: RQ-ICPERF-94c86e
  version: 1
  title: Row ceilings and the rho byte ratio
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-047900
  objective: >-
    Check the word size, the two row ceilings, the block-vector ratio,
    and the two distinguished-point byte counts.
  inputs:
    word_bits: 129
    word_bytes: 17
    spare_bits: 7
    short_bytes: 16
    short_bits: 128
    row5_bits: 274
    row5_whole_bytes: 34
    row5_spill_bits: 2
    row5_ceiling: 35
    row4_bits: 249
    row4_whole_bytes: 31
    row4_spill_bits: 1
    row4_ceiling: 32
    block_64: 128
    block_8: 16
    block_ratio: 8
    block_exponent_gap_hundredths: 300
    bytes_p30: 1717986918400
    bytes_p20: 1677721600
    byte_ratio: 1024
    decimal_ratio: 1000
    above_17e11: 17986918400
    below_17e8: 22278400
    log_low_num: 564
    log_low_den: 100
    log_high_num: 565
    log_high_den: 100
    word_gap_exact_hundredths: -806
    word_gap_written_hundredths: -810
    word_gap_delta_hundredths: 4
    byte_gap_m4_exact_hundredths: -54
    byte_gap_m4_written_hundredths: -50
    shortfall_min_hundredths: 2054
    shortfall_written_bits: 20
  controls:
    - >-
      The five-index ceiling is 35. Reporting 34 invalidates the run.
    - >-
      The word needs 17 bytes. Reporting 16 invalidates the run.
    - >-
      The rho byte ratio is 1024. Reporting 1000 invalidates the run.
    - >-
      The byte count at 2 to the 30 walks exceeds 17 times 10 to the
      11. Reporting it as at most that decimal invalidates the run.
    - >-
      The written m = 5 word-exponent difference is -806 hundredths.
      Reporting -810 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - row width in {5, 4}
    - route in {bits, powers}
  metrics:
    primary:
      - row5_ceiling
      - byte_ratio
      - implementations_agree
    secondary:
      - word_bytes
      - word_gap_hundredths
      - shortfall_min
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The ceiling 35 and the ratio 1024.
    formula: >-
      A row is m times the index width, plus m, plus 129 bits, and the
      stored length is the ceiling of that bit count over 8. At
      relative overhead 1/100 the record count is 50 times the walk
      count, and the byte count multiplies by 32. The two walk counts
      differ by 2 to the 10, so the byte counts differ by 1024. The
      base-2 logarithm of 50 lies strictly between 564/100 and 565/100
      because the hundredth power of 50 lies strictly between 2 to the
      564 and 2 to the 565.
    source: >-
      IDEA-20260926-3cc0b8 states the row formula and the
      distinguished-point floor, read 2026-10-02. The counts were
      computed in this design session. That computation is not a run.
      No matrix was built.
  scale_relevance:
    tier: toy
    justification: Two row widths and two walk counts. No transfer to a running solver.
    correspondence: null
  tail_checks:
    - The walk count 2 to the 20 is required. Stopping at 2 to the 30 and still reporting 1677721600 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the five-index ceiling is reported as 34, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The five-index ceiling is reported as 34.
    - The word is reported as 16 bytes.
    - The rho byte ratio is reported as 1000.
    - The m = 5 word-exponent difference is reported as -810 hundredths.
    - The byte count at 2 to the 30 walks is reported as at most 17 times 10 to the 11.
    - A matrix, a Wiedemann run, or a fill-in measurement is reported.
  success_criterion: >-
    Both runs agree that the word needs 17 bytes, the row ceilings
    are 35 and 32, the block ratio is 8, the rho byte counts are
    1717986918400 and 1677721600, their ratio is 1024, and the
    logarithm of 50 lies strictly between 564/100 and 565/100.
  falsification_criterion: >-
    The runs agree, the five-index ceiling stays 35, and any factor
    differs from the preregistered table.
  required_artifacts:
    - experiments/EXP-ICPERF-0be955/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ICPERF-0be955/runs/<RUN-ID>/command.txt
    - experiments/EXP-ICPERF-0be955/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ICPERF-0be955/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ICPERF-0be955/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ICPERF-0be955/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any matrix, Wiedemann run, or fill-in measurement.
    - Any claim that a memory axis binds or fails on a curve.
    - Any extrapolation of a toy elimination.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
