experiment:
  id: EXP-EWALK-6433b1
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-ebcae6
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE sqrt(|Aut|) CEILING, STATED AS A THEOREM RATHER THAN AS FOLKLORE: an equivalence-class
    rho walk on a prime-order subgroup can only be quotiented by a group that acts with equal-size
    orbits AND admits an O(1) canonical representative, that group is exactly the unit group of End_{F_p}(E),
    the unit group of an imaginary quadratic order has order at most 6, and the birthday constant
    on the resulting class set is 1.2533*sqrt(N/|Aut|) exactly -- so the whole L6 lane''s maximum
    prize against this program''s own already-negation-discounted baseline is a factor sqrt(3) = 1.732
    on j = 0 curves, sqrt(2) = 1.414 on j = 1728 curves, and EXACTLY 1.000 on every generic prime-field
    curve, with zero exponent movement in every case'
  status: draft
  objective: "(A) WHAT IS BEING CLOSED, AND WHAT IS NOT. This record asserts a CEILING on one family:\
    \ rho-type collision walks that gain by identifying points of G under a group action computed\
    \ from End_{F_p}(E). It asserts nothing about index calculus, nothing about isogeny transport,\
    \ nothing about multi-target/preprocessing, and it is NOT an impossibility claim about the ECDLP.\
    \ It is the lane's stated purpose (`RQ-EWALK-8fa147`, DECOMPOSITION.md L6) discharged as a derivation\
    \ rather than as a measurement.\n(B) THE THREE CONDITIONS AN ADMISSIBLE QUOTIENT MUST MEET, TOGETHER.\
    \ Let ~ be an equivalence on G = <P> of prime order N, and let the walk run on G/~ with the step\
    \ defined by canonicalise-then-translate. For the walk to be a rho walk at all, three things must\
    \ hold SIMULTANEOUSLY:\n  (C1) EQUAL-SIZE ORBITS. The birthday law on G/~ is\n    1.2533*sqrt(|G/~|)\
    \ only when the classes are equinumerous; unequal\n    classes make the induced stationary measure\
    \ non-uniform and INCREASE\n    the collision constant (a non-uniform distribution collides sooner\
    \ in\n    the heavy cells but the useful-collision yield falls; this is the\n    standard second-moment\
    \ effect and it never helps the fully charged\n    cost).\n  (C2) O(1) CANONICAL REPRESENTATIVE.\
    \ Every step must map a class to a\n    class deterministically, which requires computing a canonical\
    \ element\n    of the orbit in O(1) group operations. Without it the step cost scales\n    with\
    \ the orbit size.\n  (C3) RELATION PRESERVATION. A collision of classes must yield a usable\n\
    \    congruence in (a, b). This requires the action to be by GROUP\n    AUTOMORPHISMS of G: if\
    \ A ~ B means B = sigma(A) for sigma in a group\n    Sigma of automorphisms, then a collision\
    \ gives\n    a_i P + b_i Q = sigma(a_j P + b_j Q) for a KNOWN sigma acting as a\n    known scalar,\
    \ hence a genuine congruence. An equivalence that is not\n    by automorphisms gives a collision\
    \ with no algebraic content.\n\n(C) THE THREE CONDITIONS ADMIT EXACTLY ONE FAMILY, AND IT IS SMALL.\
    \ By (C3) Sigma must be a group of automorphisms of E acting on G. Over F_p with p > 3, Aut_{F_p}(E)\
    \ is the group of units of End_{F_p}(E), which is an order O in the imaginary quadratic field\
    \ K = Q(sqrt(t^2 - 4p)). The units of an order in an imaginary quadratic field are exactly the\
    \ roots of unity it contains: {+-1} in general, {+-1, +-i} for Z[i] (D_0 = -4, j = 1728), and\
    \ the six sixth-roots of unity for Z[zeta_3] (D_0 = -3, j = 0). Hence |Aut| in {2, 4, 6} and |Aut|\
    \ <= 6 UNCONDITIONALLY for every prime-field curve with p > 3. The orbits of Aut on G \\ {O} all\
    \ have size |Aut| (Aut acts on the prime-order group by scalars of exact multiplicative order\
    \ |sigma|, and no nonzero point is fixed by a nontrivial sigma because sigma acting as scalar\
    \ s with s != 1 fixes A only if (s-1)A = O, impossible in a prime-order group for A != O and s\
    \ != 1 mod N). So (C1) holds automatically and (C2) holds because the orbit has at most 6 elements,\
    \ each computable in O(1) field operations, and a minimum over at most 6 encodings is O(1).\n\
    (D) WHY NO LARGER GROUP IS AVAILABLE. Suppose one tries Sigma = <[lambda]> for a non-unit endomorphism\
    \ phi acting as the scalar lambda of multiplicative order r mod N. (C3) still holds. (C1) still\
    \ holds. (C2) FAILS, and it fails in two independent ways that must both be named:\n  (D1) ENUMERATION\
    \ COST. The only general canonicalisation is to generate\n    the orbit and take a minimum, costing\
    \ r evaluations per step. The gain\n    is sqrt(r) and the cost is r, so the charged ratio is\
    \ r/sqrt(r) =\n    sqrt(r) >= 1: strictly worse for every r >= 2. (This is the mechanism\n   \
    \ IDEA-20260802-005 proposes to MEASURE; here it is one of two legs of a\n    derivation, and\
    \ this record does not duplicate that measurement.)\n  (D2) THE NATURAL O(1) INVARIANT DEGENERATES\
    \ TO THE POINT AT INFINITY.\n    The obvious candidate for an O(1) orbit invariant is the orbit\
    \ sum\n    S(A) = sum_{i=0}^{r-1} [lambda^i] A = [ (lambda^r - 1)/(lambda - 1) ] A.\n    Since\
    \ lambda^r = 1 and lambda != 1 with lambda - 1 invertible mod N\n    (N prime), the bracket is\
    \ 0 and S(A) = O for EVERY A. The invariant is\n    constant, hence useless. This is not speculation:\
    \ the r = 3 instance\n    P + phi(P) + phi^2(P) = O was computed on a real curve\n    (p = 4294967539,\
    \ y^2 = x^3 + 7, N = 613557433) and returned the point\n    at infinity, recorded in EV-ENDO-001\
    \ and KN-FIND-009 as a true relation\n    yielding no discrete logarithm. (D2) is the point-level\
    \ restatement of\n    the eigenvalue-level Vieta degeneracy that KN-FIND-009 established.\n  (D1)\
    \ and (D2) are INDEPENDENT: (D1) says enumeration is too dear, (D2)\n  says the cheapest non-enumerative\
    \ route returns no information. Closing\n  only one of them would leave the other open.\n\n(E)\
    \ THE CONSTANT, EXACTLY. With Aut of order m in {2, 4, 6}, the class set has (N-1)/m + 1 elements,\
    \ and the ideal random-walk collision law gives expected steps 1.2533*sqrt(N/m) = 1.2533*sqrt(N)/sqrt(m).\
    \ Against the unquotiented ideal 1.2533*sqrt(N) that is exactly a factor sqrt(m). Against THIS\
    \ PROGRAM'S BASELINE CONVENTION, which is 0.886*sqrt(N) and already contains the negation sqrt(2)\
    \ (KN-TECH-006, KN-TECH-018), the residual headroom is sqrt(m/2): 1.000 at m = 2, sqrt(2) = 1.4142\
    \ at m = 4, sqrt(3) = 1.7321 at m = 6. THAT IS THE ENTIRE PRIZE OF LANE L6, and it is available\
    \ only on curves with D_0 = -4 or D_0 = -3.\n(F) THE CEILING IS NEVER ATTAINED, AND THE SHORTFALL\
    \ HAS A SIGN. The quotient step is canonicalise-then-translate, which is not equivariant for free:\
    \ the canonicalisation re-injects an automorphism choice, creating fruitless cycles that must\
    \ be detected and escaped. Detection and escape cost per-step arithmetic AND degrade the walk\
    \ away from the ideal random map, so both terms push the achieved factor BELOW sqrt(m). The achieved\
    \ factor is therefore <= sqrt(m) with equality only in the unattainable zero-overhead limit. How\
    \ far below is an empirical question and is the subject of IDEA-20260807-6355c6 and IDEA-20260807-59f5b7,\
    \ not of this record.\n(G) FORWARD GUIDANCE -- WHAT THIS DOES NOT CLOSE. Named explicitly because\
    \ the closure standard requires it: (i) equivalences induced by ISOGENY transport between curves\
    \ rather than by endomorphisms of one curve (R4, lane L10/L13) are untouched -- they are not automorphisms\
    \ of G and (C3) does not apply in the same form; (ii) equivalence-class methods for the DLP in\
    \ an INTERVAL, where Galbraith-Ruprai (KN-LIT-7437) report a heuristic 1.36*sqrt(N) for groups\
    \ with fast inversion, are a different cost functional and outside this ceiling; (iii) MULTI-TARGET\
    \ and preprocessing settings (R8, lane L13) where the amortised per-target cost is the object;\
    \ (iv) the MIXING-TIME axis, which changes the constant WITHIN the band [1.0, 1.2533] on a fixed\
    \ class set and is not bounded by this argument (IDEA-20260807-59fed3, IDEA-20260807-06cc5d);\
    \ (v) non-prime-order subgroups and extension fields, where Aut can be larger (Koblitz/subfield\
    \ curves, Frobenius of order ~2m, KN-LIT-042) -- the |Aut| <= 6 bound is specific to E/F_p with\
    \ p > 3."
  resource_label: R3 (End(E) as a ring -- specifically its UNIT GROUP and the multiplicative order
    of a non-unit eigenvalue mod N). No other resource is consumed.
  admissibility: inadmissible_generic_group
  admissibility_argument: INADMISSIBLE, AND THE RECORD IS FILED PRECISELY BECAUSE IT IS. Everything
    this family does with phi is apply it to points of G. G has prime order, so every endomorphism
    acts on G as multiplication by a scalar (H-ENDO-001), and an oracle returning phi(A) for points
    A of G is exactly Oracle D of KN-FIND-b7e091, which is generic-group simulable in O(log N) group
    operations and therefore closed at exponent 1/2 by Shoup's bound (KN-TECH-005). The lane is on
    the wrong side of the admissibility filter by construction (DECOMPOSITION.md section 4, L6). The
    deliverable is not an attack but the EXACT CONSTANT at which the closed family saturates, which
    is what every other lane in GOAL-ENDO-001 must charge against. Filing an inadmissible mechanism
    as a recorded closure with its obstruction named is the brief's stated legitimate outcome.
  reachability_gate: 'DOES NOT MOVE BETWEEN CURVES, AND THE GATE IS THE REASON THE HEADROOM TABLE
    IS NOT AN OPPORTUNITY. By T4 (DECOMPOSITION.md section 3) the isogeny class fixes t, hence D,
    hence D_0, hence whether j = 0 or j = 1728 occurs anywhere in the class: |Aut| is a CLASS INVARIANT
    up to the choice of curve within the class, and you cannot walk to a j = 0 curve from a class
    whose D_0 is not -3. So for a target curve with generic D_0 the |Aut| = 4 and 6 rows are unreachable
    at ANY cost -- not expensive, unreachable -- and the residual headroom is exactly 1.000. For a
    target already at j = 0 the row is available with no walking at all. There is therefore no reachability
    question in this lane: the answer is 0 steps or infinity, never something in between. This is
    stated because it makes the T5 gate trivial HERE while remaining the crux elsewhere in the campaign.'
  inputs:
    procedure: 'STAGE 0 (zero compute, the whole deliverable): write the four lemmas and the headroom
      table; verify the baseline reproduction symbolically (sqrt(pi)/2 against 0.8862269254527579);
      verify the orbit-sum identity symbolically; state the Koblitz nearby-object control and confirm
      the argument does NOT extend to it. STAGE 1 (minutes, and it is a CHECK not an experiment):
      on three toy curves from harness/toycurve.py -- one generic, one j = 1728 (p = 1 mod 4), one
      j = 0 (p = 1 mod 3, a = 0, the family harness/endomorphism_la.py already builds) -- enumerate
      Aut explicitly, verify |Aut| in {2, 4, 6} matches the D_0 prediction, verify freeness by checking
      no nonzero point is fixed, and verify sum_{i<r}[lambda^i]A = O for the order-3 and order-4 scalars
      on those curves. This is a known-answer test of the derivation, not a measurement of a speedup,
      and it must be reported as such. STAGE 2 (zero compute): record the x-coordinate identifiability
      collision from the proof_search_map as a binding design constraint for IDEA-20260807-cbbcfd,
      -6355c6, -15b468.'
    mechanism: "ZERO COMPUTE. The deliverable is a written derivation with four single-responsibility\
      \ lemmas and one arithmetic table.\nLEMMA 1 (SIZE / unit bound). For p > 3 and E/F_p, Aut_{F_p}(E)\
      \ = O^* where O = End_{F_p}(E) is an order in an imaginary quadratic field; O^* is the group\
      \ of roots of unity in O; hence |Aut| in {2, 4, 6}, with 4 only for D_0 = -4 (j = 1728) and\
      \ 6 only for D_0 = -3 (j = 0). Responsibility: size.\nLEMMA 2 (FREENESS / equal orbits). Every\
      \ nontrivial sigma in Aut acts on the prime-order group G as a scalar s != 1 mod N, and (s -\
      \ 1) is invertible, so sigma fixes no point of G except O. Hence Aut acts freely on G \\ {O}\
      \ and all orbits have size exactly |Aut|. Responsibility: correctness.\nLEMMA 3 (COST / canonicalisation).\
      \ A canonical representative of an |Aut|-element orbit is computable with at most |Aut| - 1\
      \ field multiplications and |Aut| - 1 comparisons on the encoding, hence O(1). For Sigma = <[lambda]>\
      \ with lambda of multiplicative order r, no O(1) canonicalisation is known and two routes are\
      \ closed: enumeration costs r (D1), and the orbit-sum invariant is identically O (D2, proved\
      \ by the geometric-series identity and instantiated in EV-ENDO-001). Responsibility: runtime.\n\
      LEMMA 4 (RUNTIME / the constant). The ideal random-walk first-collision expectation on a set\
      \ of M states is sqrt(pi M / 2) = 1.2533*sqrt(M). With M = (N-1)/|Aut| + 1 this is 1.2533*sqrt(N/|Aut|)\
      \ up to O(1/N). Responsibility: runtime.\nASSEMBLY. Lemmas 1-3 say Sigma = Aut is the unique\
      \ admissible choice and |Aut| <= 6. Lemma 4 turns that into the constant. The residual-headroom\
      \ table against the program baseline 0.886*sqrt(N) follows by division:\n  |Aut| = 2 -> 0.8862*sqrt(N),\
      \ headroom 1.0000, curves: all\n  |Aut| = 4 -> 0.6267*sqrt(N), headroom 1.4142, curves: D_0\
      \ = -4, j = 1728\n  |Aut| = 6 -> 0.5116*sqrt(N), headroom 1.7321, curves: D_0 = -3, j = 0\n\
      Every number in that table is arithmetic on 1.2533 = sqrt(pi/2) and is checkable by hand; none\
      \ is a measurement and none is presented as one.\nSCOPE NOTE THAT MUST TRAVEL WITH THE TABLE.\
      \ secp256k1 is y^2 = x^3 + 7, which has j = 0, so the |Aut| = 6 row is not hypothetical for\
      \ deployed curves. This is CLASSICAL (Wiener-Zuccherato KN-LIT-042; Duursma-Gaudry- Morain as\
      \ cited there; GLV as recorded in KN-TECH-018) and nothing new is claimed about it. It is stated\
      \ so that no reader mistakes the |Aut| = 6 row for an unexploited opportunity."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - 'Baseline reproduction: sqrt(pi)/2 must equal the frozen 0.886 convention to four decimals.'
  - 'Nearby-object control: the argument must FAIL to bound Koblitz/subfield curves. An argument that
    bounds them is wrong.'
  - 'Synthetic-lambda null with decay parameter r: derived charged gain must decay as 1/sqrt(r).'
  - Freeness check on real toy curves at |Aut| = 4 and 6 (Stage 1).
  - 'NULL OBJECT (from the proposal): MANDATORY AND SUPPLIED, EVEN THOUGH THIS RECORD IS ZERO-COMPUTE.
    The matched null object is the SAME derivation run on a group Sigma that satisfies (C1) and (C3)
    but not (C2): Sigma = <[lambda]> for a synthetic lambda of multiplicative order r drawn uniformly
    from the divisors of N - 1. THE DECAY PARAMETER IS r. If the derivation is sound, the derived
    net charged gain must DECAY as 1/sqrt(r) as r increases -- i.e. the "speedup" turns into a loss,
    monotonically, and the crossover is at r = 1. A derivation that predicts a gain that does NOT
    decay as r grows is the canonical artifact tell (docs/inventor-protocol.md section 3) and would
    mean the cost model, not the mathematics, is doing the work. SECOND NULL, for the arithmetic:
    the |Aut| = 2 row must reproduce the program''s frozen 0.886 constant EXACTLY from 1.2533/sqrt(2)
    = 0.88623, not approximately. A table that cannot regenerate the program''s own baseline is wrong.'
  independent_variables: []
  metrics:
    primary:
    - '|Aut| enumerated explicitly per test curve, with D_0 recorded'
    - number of nonzero fixed points of each nontrivial automorphism (must be 0)
    - value of sum_{i<r} [lambda^i]A on each test curve (must be O)
    - the headroom table, with every entry shown as arithmetic on sqrt(pi/2)
    secondary:
    - explicit statement of which rows apply to which D_0
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Derived residual headroom of the Aut-quotient walk over this program's baseline convention
      0.886*sqrt(N), by |Aut|
    formula: 'EXACT VALUES, PRE-REGISTERED: 1.0000 at |Aut| = 2, 1.4142 at |Aut| = 4, 1.7321 at |Aut|
      = 6. Any measurement anywhere in GOAL-ENDO-001 that reports a fully-charged gain ABOVE these
      values on the matching curve family falsifies this record (or, far more likely, is an instrument
      artifact -- see interpretation_limits).'
    source: pre-registered in IDEA-20260807-ebcae6 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ENCODING SUBSTITUTION. Counting classes in x-coordinates instead of points makes |Aut| = 4 look
    like |Aut| = 2 (see observation_collision). Any downstream L6 number reported without stating
    whether classes were counted in points or in x is uninterpretable.
  - BASELINE SUBSTITUTION. Comparing against the UN-discounted 1.2533 rather than the program's 0.886
    inflates every headroom by sqrt(2). The table states both columns for exactly this reason.
  - UNIT SUBSTITUTION. Step counts are not field multiplications. A quotient walk whose step costs
    more than the plain step can show a step-count gain and a charged loss. This record's table is
    in IDEAL STEP COUNTS and is therefore an UPPER bound on the achievable charged gain, never a prediction
    of one.
  - j-INVARIANT MIS-CLASSIFICATION. j = 0 requires D_0 = -3 AND p = 1 mod 3 for the order-3 map to
    be F_p-rational; a curve with a = 0 over a prime p = 2 mod 3 has j = 0 but the extra automorphisms
    are not F_p-rational and |Aut_{F_p}| = 2. Any experiment must verify rationality, not just read
    j.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'EXACT VALUES, PRE-REGISTERED: 1.0000 at |Aut| = 2, 1.4142 at |Aut| = 4, 1.7321
    at |Aut| = 6. Any measurement anywhere in GOAL-ENDO-001 that reports a fully-charged gain ABOVE
    these values on the matching curve family falsifies this record (or, far more likely, is an instrument
    artifact -- see interpretation_limits).'
  falsification_criterion:
  - A prime-field curve with p > 3, prime-order G, and |Aut_{F_p}(E)| > 6. Lemma 1 is false and the
    ceiling is void.
  - A nontrivial automorphism fixing a nonzero point of a prime-order G. Lemma 2 is false, orbits
    are not equal-size, and the constant in Lemma 4 does not apply.
  - An instance-independent O(1) canonicalisation for <[lambda]> with ord(lambda) large. (C2) is satisfiable
    beyond Aut, the ceiling is void, and this would be the most valuable single refutation in the
    lane. The quantifier_order block states that this record does NOT prove no such canonicalisation
    exists.
  - sqrt(pi)/2 failing to reproduce the frozen 0.886 convention. Then the program's convention means
    something other than what this record assumes and the headroom table is void until the convention
    is restated.
  - A measured fully-charged gain above the pre-registered row value on the matching family, surviving
    a matched-seed null (IDEA-20260807-cbbcfd). That would be the one interesting event in the lane
    and it is the outcome DECOMPOSITION.md section 4 flags as either an artifact or the lane's only
    real finding.
