  derived_from_idea: IDEA-20260816-98ab8e
  question_id: RQ-FBG-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Locus-degree ladder: factor bases built as curve points over image loci of plane polynomials
    of degrees one through eight, with a matched random null, a matched abscissa-null and a per-degree
    Bezout size check computed before coverage'
  objective: 'The one uncertainty a run reduces is whether the coverage behaviour of algebraically
    defined factor bases depends on the defining locus degree beyond what realised size already accounts
    for, which is the consequence a counting-based reading of the program''s bounded-degree obstruction
    predicts. Stated in parts: (i) SIZE REPRODUCTION - at each degree from 1 to 8, does the realised
    base size respect the Bezout-style bound the derivation states, checked before any coverage is
    computed, since a violated size bound invalidates the reproduction regardless of what coverage
    does; (ii) FLATNESS - across the ladder, is coverage excess against a matched random base flat
    within intervals, with the fitted slope''s interval containing zero, or does some degree sit outside
    its permutation band after correction; (iii) ADMISSION VALIDITY - does a matched abscissa-null,
    pushed through the identical point-admission and trimming path but carrying no polynomial structure,
    sit at excess 1.00 at every rung, since if it does not then the admission step manufactures the
    signal and no reading of the ladder is possible. A run cannot reduce uncertainty about whether
    the bounded-degree obstruction is true, about high-degree interpolation descriptions which lie
    outside the ladder, about relation rate, decomposition or linear algebra, about the universal
    question of KN-OPEN-020, or about behaviour at cryptographic sizes. The deliverable is a degree
    curve with intervals, a Bezout comparison table, and the abscissa-null line.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support at most this: on the named toy
      prime-order curves at the stated sizes, under the declared locus form and with the declared
      trimming rule, factor bases built as curve points over image loci of plane polynomials of degrees
      1 through 8 have the reported realised sizes, those sizes do or do not respect the stated Bezout-style
      bound, and their coverage excess against a matched random base of the same realised size is
      or is not flat in degree within the reported intervals, with the abscissa-null at the reported
      values. WHAT DOES NOT FOLLOW: nothing about whether the bounded-degree obstruction is true or
      false, since measuring one consequence of one reading of a derivation neither proves nor refutes
      it; nothing about loci of degree above 8 or of a different declared form; nothing about high-degree
      interpolation, multiple simultaneous predicates, target-dependent descriptions or implicit membership,
      all of which the derivation''s own escape list leaves open; nothing about relation yield, decomposition
      cost, linear-algebra cost or index-calculus cost; nothing about the universal question KN-OPEN-020
      poses, which stays open; and no attack, break, speedup or security consequence. A flat curve
      supports only that at these degrees, coverage is explained by realised size.'
  inputs:
    procedure: 'STAGE 0, declaration (cost: 1 human hour, no compute). Declare the locus form, the
      Bezout-style bound in the exact shape the frozen derivation states it, the trimming rule, and
      the polynomial seeds - all before any run. STAGE 1, curves (cost: seconds). Generate and verify
      prime-order toy curves via harness/toycurve.py. STAGE 2, loci (cost: linear in field size per
      degree). For each degree 1 to 8 and each of 4 seeds, form the locus, admit curve points above
      admitted abscissae, record realised size and points-per-abscissa. STAGE 3, size check (cost:
      seconds). Compare every realised size with the declared bound; HALT the run on any violation
      and report it, before coverage is computed. STAGE 4, arms (cost: seconds). Trim every locus
      base to the common target size; build the matched abscissa-null at matched cardinality through
      the identical path; draw the matched random base at the same realised size, all in one process.
      STAGE 5, coverage (cost: dominant, order N times B squared per cell). Exact multiset-sum counting
      over the complete target space for all arms, with the closed-form total check per cell. STAGE
      6, inference and report (cost: 200 permutations per cell plus 2 human hours). Bootstrap intervals,
      permutation bands, fitted slope against degree, and the three-line plot.'
    instrument: Python 3 with harness/toycurve.py for exact curve arithmetic, point admission and
      curve verification; sympy for polynomial construction and exact evaluation over the prime field;
      numpy for count vectors, bootstrap and the permutation loop; harness/runner.py for run manifests,
      recorded seeds and the inference block. No Sage. The Bezout comparison is implemented as a direct
      arithmetic check against the declared bound, not as a symbolic computation, so a reader can
      audit it in one line.
    parameters: 'Curves: 4 generated prime-order toy curves per size. Sizes: N near 2^12, 2^14 and
      2^16. Locus degrees: d in 1, 2, 3, 4, 5, 6, 7, 8, plus the degenerate d equal to 0 control.
      Polynomials per degree: 4 independent seeds. Target base size after trimming: B equal to ceiling
      of (6N) to the one-third power. Arity: m equal to 3. Arms per cell: 3 - locus base, matched
      random null, matched abscissa-null. Permutation draws: 200 per cell. Target space: complete,
      no sampling. Cells: 9 degrees times 4 seeds times 3 arms times 3 sizes times 4 curves equals
      1296 coverage computations for the full contract; 27 for the minimal single-curve single-size
      arm.'
  controls:
  - Matched random base at the same realised size, drawn and measured in the same invocation.
  - 'Abscissa-null: a random set of abscissae of matched cardinality pushed through the identical
    admission and trimming path.'
  - Degenerate d equal to 0 locus, the whole x-line, which must reproduce the whole-curve base exactly.
  - Bezout-style size comparison per degree, checked before coverage is computed.
  - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
  - Multiple independent polynomials per degree under different seeds, so a per-degree result is not
    one polynomial's accident.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a MATCHED RANDOM BASE at the same realised size,
    drawn in the same invocation and measured by the identical exact counter - the mandatory null
    for this bucket. A second null is required and is the sharper one: a RANDOM SET OF ABSCISSAE of
    the same cardinality as the locus, pushed through the identical point-admission step so it acquires
    the identical three-way branch structure and the identical negation closure, but carrying no polynomial
    structure at all. For the degree ladder to mean anything, this abscissa-null must show coverage
    excess of 1.00 within intervals at every ladder rung, and its realised size distribution must
    match the locus bases'' within intervals. If the abscissa-null itself shows excess, the admission
    step - not the polynomial - is producing the signal, and the ladder measures nothing about degree.
    A third control is the degenerate locus at d equal to 0, the whole x-line, which must reproduce
    the whole-curve base exactly.'
  independent_variables:
  - locus degree d from 0 to 8
  - arm (locus base, matched random null, matched abscissa-null)
  - polynomial seed within a degree
  - group size N
  - curve instance
  metrics:
    primary:
    - realised base size per degree before trimming
    - 'Bezout comparison outcome per degree: measured size against declared bound'
    - exact coverage per arm per degree
    - coverage excess ratio with bootstrap interval per arm per degree
    - fitted slope of coverage excess against degree, with interval
    secondary:
    - mean curve points admitted per locus abscissa
    - permutation-null p-value per cell
    - trimming magnitude per cell
    - across-seed dispersion of excess within a degree
    - closed-form total residual per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The fitted slope of coverage excess against locus degree, and the per-degree realised
      size against the declared Bezout-style bound.
    formula: 'Let e(d) be the coverage excess ratio of the locus base at degree d against a matched
      random base of the same realised size, averaged over seeds and curves with a bootstrap interval.
      The slope s is the least-squares coefficient of e(d) regressed on d over d in 1 to 8. Predicted:
      the interval on s contains 0; each e(d) lies inside its permutation band after the declared
      correction; the abscissa-null satisfies the absolute value of e_null(d) minus 1.00 below the
      interval half-width at every d; realised size at degree d does not exceed the declared bound;
      and mean curve points per admitted abscissa is 1.0 within its interval, this last being the
      elementary quadratic-character expectation and serving as an arithmetic sanity check rather
      than a hypothesis.'
    source: Pre-registered in the parent proposal IDEA-20260816-98ab8e before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are N near 2^12 to 2^16 with target base size 29 to 46, arity
      3, locus degrees 1 to 8, 4 polynomial seeds per degree and 4 curves per size, with exact coverage
      counting over the complete target space. Transfer assumptions, stated plainly: Bezout-style
      bounds are loose at these field sizes, so respecting them is weak evidence and the contract
      says so; coverage sits away from saturation at these parameters but the margin narrows at the
      smallest size; and the degree ladder tops out at 8 purely because higher-degree loci over a
      small field admit too few abscissae to reach the target base size, which is a scope limit and
      not a finding. Nothing extrapolates to cryptographic sizes or to degrees above the ladder, and
      the derivation''s own escape list marks high-degree descriptions as open.'
    correspondence: null
  tail_checks:
  - Degree 8, where the locus admits fewest abscissae and trimming is largest.
  - Degree 1, where a single map dominates and coefficient choice matters most, checked across all
    four seeds separately.
  - The degenerate degree 0 control, which must reproduce the whole-curve base exactly.
  - Any cell whose realised size comes within 10 percent of the declared Bezout bound, examined individually.
  - The cell with the largest across-seed dispersion within a degree, recomputed with fresh seeds.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - 'HALT immediately and report if any realised size exceeds the declared Bezout-style bound, before
    coverage is computed: the reproduction has failed and coverage results would be uninterpretable.'
  - Halt and report if the abscissa-null shows excess outside its interval at two or more rungs.
  - Halt and report if any closed-form total residual is nonzero.
  - Per-cell wall-clock budget of 1800 seconds; exceeded cells are recorded infeasible, which under
    AGENTS.md rule 3 is not negative mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Every realised size respects the declared Bezout-style bound, the abscissa-null
    sits at 1.00 within intervals at every rung, the degree 0 control reproduces the whole-curve base,
    every closed-form total residual is zero, and the run reports e(d) with intervals at all eight
    degrees together with the fitted slope and its interval - whether the curve turns out flat or
    not.
  falsification_criterion:
  - A realised size exceeds the declared Bezout-style bound at any degree.
  - The fitted slope's interval excludes zero, falsifying flatness.
  - A single degree sits outside its permutation band after correction, indicating a localised degree
    effect.
  - The abscissa-null shows excess, indicating the admission or trimming path generates signal.
  - The degree 0 control fails to reproduce the whole-curve base.
  - Independent polynomial seeds at one degree give excesses whose intervals do not overlap, showing
    the per-degree value is a coefficient accident.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-98ab8e
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The declared locus form and the exact shape of the Bezout-style bound must be transcribed from
    the frozen derivation before approval; this draft names the obligation without discharging it,
    and a paraphrased bound would reproduce something other than the recorded obstruction.
  - Whether trimming to a common target size is legitimate at all, or whether the comparison should
    instead be made at each locus's natural realised size with the null matched to it, is not settled;
    a Coordinator must fix one and the two give different contracts.
  - The relationship between the derivation's intersection degree Delta and the measured realised
    size is asserted here as a Bezout-style bound and needs the exact statement, including whether
    the 3d form or the Delta form applies to the declared locus type.
  - Whether the degenerate degree 0 control is meaningful given that the whole-curve base is not a
    factor base in any usual sense.
