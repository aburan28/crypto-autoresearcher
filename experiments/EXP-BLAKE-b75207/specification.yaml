experiment:
  id: EXP-BLAKE-b75207
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-75df2c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-75df2c
  question_id: RQ-BLAKE-584719
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Construct the four schedule-by-finalization chimera arms plus a four-cell random null lattice,
    verify the two anchor arms bit for bit against their references, and measure diffusion round and
    per-round trail weight on all eight cells across a swept round count.
  objective: 'The one uncertainty a run reduces is whether any measured BLAKE3-versus-BLAKE2s difference
    can be attributed to a named design change rather than to the pair of names. Decomposed: (i) whether
    the schedule and the finalization are separable enough in the pinned specifications that arms
    10 and 01 can be constructed at all without an arbitrary extension policy -- and, if a policy
    is required, what the sensitivity of every downstream effect is to which policy was chosen, since
    that sensitivity is itself the honest answer to the attribution question; (ii) what the schedule
    main effect, the finalization main effect, and their interaction are on the exact diffusion round
    and on the per-round trail weight, each with a seed-derived band, over the round range where all
    eight cells return comparable rows; (iii) whether those effects are larger than the effects a
    random schedule and a random finalization of the same shape produce by chance, measured by an
    identically instrumented null lattice in the same invocation. A run does NOT reduce uncertainty
    about attack cost, about the adequacy of any round count, or about the standing of the chimera
    arms as cryptographic objects -- they have none.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: under generator G at hash
      H and instruments I_diffusion and I_trail, for round counts in the stated comparable range,
      the schedule main effect on metric M is E_s with band b_s, the finalization main effect is E_f
      with band b_f, the interaction is E_i, the corresponding null-lattice effects are E_s_null and
      E_f_null, arms 00 and 11 agreed bit for bit with their references, and the schedule extension
      policy used was P with sensitivity S under alternative policy P''. What does NOT follow: that
      any effect on trail weight or diffusion round is an effect on security or attack cost; that
      arms 10 and 01 have any cryptographic standing; that the measured attribution extends to round
      counts outside the comparable range; or anything at all about seven-round BLAKE3 or a deployed
      system.'
  inputs:
    procedure: 'STAGE 0 (cost: agent time, zero compute): pin both references, validate against published
      vectors, record hashes; read the pinned specifications for schedule/finalization entanglement
      and DECLARE the extension policy P and alternative P'' before any run. STAGE 1 (cost: agent
      time): extend the parameter-only generator to take schedule and finalization as independent
      arguments; build eight cells (four real, four null). STAGE 2 (cost: minutes): self-validation
      gate -- arms 00 and 11 against all published test vectors bit for bit; HALT on failure. STAGE
      3 (cost: seconds to minutes, essentially free): exact symbolic diffusion closure on all eight
      cells for round counts 1..10; compute d, main effects, interaction, forced-zero finalization
      control. STAGE 4 (cost: bulk of compute): trail-weight solves on all eight cells across the
      swept round range, three seeds each, per-point ceiling enforced; retain only rounds where all
      eight cells share optimality status. STAGE 5 (cost: low, repeat of STAGE 3-4 subset): sensitivity
      arm under extension policy P''. STAGE 6 (cost: low): factorial decomposition, bands, null comparison,
      run record with all hashes, seeds, ceilings and the non_standard flags.'
    instrument: 'Python 3.11 throughout. Exact diffusion closure implemented with Python integers
      as bitsets (one bitmask per state bit recording which input bits it depends on), which is exact
      and needs no library. Trail-weight arm reuses the PySAT/CaDiCaL CNF generator from the transfer-curve
      record, extended so schedule and finalization are separate arguments. Reference implementations:
      pinned BLAKE3 and BLAKE2s C references via ctypes, with pure-Python re-implementations used
      to build the chimeras and cross-checked against the C references on the anchor arms. Orchestration,
      seeding and manifests via harness/runner.py. No Sage.'
    parameters: 'Eight cells: {BLAKE2s schedule, BLAKE3 schedule, random schedule S_a, random schedule
      S_b} crossed appropriately with {BLAKE2s finalization, BLAKE3 finalization, random linear finalization
      F_a, F_b}, arranged as a real 2x2 lattice and a null 2x2 lattice. Round counts 1..10 for the
      diffusion pass (free). Round counts 1..Rmax_lattice for the trail pass, Rmax_lattice determined
      by the all-cells-comparable rule, expected 2 to 5. Three seeds per (cell, round) trail point.
      Per-point ceiling 1800 seconds, identical across cells. Two schedule extension policies P and
      P''. Test vectors: the full published sets for both references including keyed and multi-chunk
      cases.'
  controls:
  - Full null lattice (two random schedules x two random finalizations) run in the same invocation
    by the same instrument, supplying the by-chance effect size.
  - 'Self-validation gate: arm 00 must equal the BLAKE2s reference bit for bit and arm 11 must equal
    the BLAKE3 reference bit for bit on all published test vectors including keyed and multi-chunk
    cases.'
  - 'Non-standard labelling: every row from arms 10 and 01 carries a non_standard flag, and no claim
    about either is written as a claim about a real primitive.'
  - 'Forced-zero control: the finalization main effect on intermediate-round metrics must be exactly
    zero; a nonzero value halts analysis.'
  - Seed repetition (three seeds) on every cell, giving the band the effects are read against.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A full null lattice of the same shape: four cells built from two random
    schedule tables (call them S_a, S_b, each a uniform random set of per-round permutations of 0..15)
    crossed with two random finalization maps of the same algebraic shape as the real ones (random
    GF(2)-linear feed-forward patterns over the same state words), run at the same round counts, three
    seeds, in the same invocation by the same instrument. The null lattice yields a schedule main
    effect and a finalization main effect that arise purely from parameter choice with no design intent.
    What the null must show: the null main effects must be SMALLER than the real main effects for
    the real ones to mean anything, and the null must supply a nonzero by-chance effect size so that
    the comparison is possible at all. If the null lattice''s schedule main effect is as large as
    the real one, the measurement is reporting that any schedule change of this shape moves the metric
    by that much, which is a statement about ARX schedules in general and not about BLAKE3''s -- a
    complete and reportable result, but not the attribution the record set out to make.'
  independent_variables:
  - schedule (BLAKE2s | BLAKE3 | random)
  - finalization (BLAKE2s | BLAKE3 | random)
  - round count
  - schedule extension policy (P | P')
  - solver seed
  metrics:
    primary:
    - exact full-diffusion round d per cell
    - W(r) per cell per round with optimality status
    - schedule main effect on d and on W(r)
    - finalization main effect on d and on W(r)
    - schedule-by-finalization interaction on each metric
    secondary:
    - null-lattice main effects and interaction
    - sensitivity of each effect to extension policy P versus P'
    - seed band per cell per round
    - solver wall-clock and constraint count per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: 'Predicted: the finalization main effect on every intermediate-round metric, and the
      rule by which a schedule main effect is later called an attribution.'
    formula: 'Finalization main effect on any metric evaluated strictly before the terminal round,
      defined as 0.5*[(M(01) - M(00)) + (M(11) - M(10))], is predicted to equal exactly 0. Frozen
      reading rule: a schedule main effect E_s = 0.5*[(M(10) - M(00)) + (M(11) - M(01))] is reported
      as an attribution if and only if |E_s| > max(|E_s_null|, 2*b_s) AND |E_s| exceeds the policy
      sensitivity |E_s(P) - E_s(P'')|; otherwise it is reported as unresolved with all three comparators
      printed.'
    source: Pre-registered in the parent proposal IDEA-20260816-75df2c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Diffusion pass covers round counts 1..10, which spans both designs'' shipped counts,
      but the metric is a diffusion closure and not a security quantity, so covering the full round
      count grants no security reading. Trail pass covers 1..Rmax_lattice, expected 2 to 5, which
      is a toy tier and is labelled so. NO TRANSFER OR EXTRAPOLATION IS ASSUMED in either direction:
      attributions are stated only over the rounds measured, and the record explicitly forbids projecting
      a main effect to unmeasured rounds.'
    correspondence: null
  tail_checks:
  - Inspect the cells at the largest comparable round individually, since the all-cells rule means
    one slow cell silently truncates the range.
  - Check whether the diffusion metric saturated (all cells reaching d at the same round), which would
    make a zero effect a metric ceiling rather than a design similarity.
  - Examine the policy-sensitivity arm specifically at the largest round, where extension policy has
    had most opportunity to act.
  - Verify no null cell accidentally drew a schedule that coincides with a real one.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - HALT at STAGE 2 if either anchor arm fails bit-for-bit reference agreement.
  - HALT the analysis if the forced-zero finalization control on intermediate rounds is nonzero.
  - Stop the trail sweep at the first round where any of the eight cells fails to return a comparable
    row.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run succeeds if both anchor arms validate bit for bit, the forced-zero control
    passes, the diffusion pass yields main effects with a stated resolution, and every reported effect
    is printed alongside its seed band, its null comparator and its policy sensitivity -- whether
    or not any effect qualifies as an attribution under the frozen rule.
  falsification_criterion:
  - Anchor-arm bit-for-bit failure.
  - Nonzero finalization main effect on intermediate rounds.
  - Interaction term larger than both main effects.
  - Null-lattice effects as large as the real effects on every metric.
  - Empty or single-round comparable range in the trail pass.
  - Effects entirely explained by the extension-policy sensitivity.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-75df2c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The schedule extension policy P is undefined until the pinned specifications are read; a Coordinator
    must approve P and P' explicitly, because P is the single most consequential arbitrary choice
    in the design.
  - Whether the real finalizations are GF(2)-linear determines whether the random linear finalization
    is a fair null. Unresolved until primary text is filed.
  - The acquisition precondition of RQ-BLAKE-584719 (specifications and the cited BLAKE2 cryptanalysis
    filed as KN-LIT) is unmet and blocks approval.
  - Rmax_lattice cannot be estimated before the run, so the compute budget line is a placeholder a
    Coordinator must set.
