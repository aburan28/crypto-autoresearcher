    shared branch -- a FROZEN, already-approved, already-dispatched
    contract -- rather than through this program's own required
    protocol_amendment path (docs/task-lifecycle.md "Protocol
    amendments": "After approval the protocol is frozen. Any later
    change requires a versioned protocol_amendment... never an edit of
    the frozen prediction"). This is a process violation independent of
    whether the edit's content is correct.

  independent_content_verification: >-
    THE UNDERLYING MATHEMATICAL CLAIM IS INDEPENDENTLY VERIFIED CORRECT
    BY THIS COORDINATOR'S OWN RE-DERIVATION, RE-DERIVED FROM FIRST
    PRINCIPLES RATHER THAN TAKEN ON THE COMMIT'S OWN SAY-SO.

    Version 1's own `inputs.seed_derivation_rule_part_a_group_uniform_arm`
    described: draw x uniformly in F_p; if f(x) is a nonzero square,
    accept one of its two roots with equal probability (label
    "gu-sign"); if f(x)=0, "accept the 2-torsion point directly"
    (unconditionally); if f(x) is a non-residue, reject and redraw. Under
    this rule, a generic two-root x contributes probability 1/(2p) to
    EACH of its two points, but a 2-torsion x contributes probability
    1/p (unconditional acceptance, no division) to its single point --
    exactly DOUBLE the weight of a generic point, not the uniform 1/N
    the spec's own prose claimed ("EACH group element with probability
    exactly 1/N" did not appear in v1's actual procedural text; that
    phrase is v2's own explicit correction). Separately, the described
    procedure never draws a slot for the point at infinity O at all,
    despite the surrounding prose saying group-uniform sampling
    "includes the point at infinity" -- confirmed independently by the
    Executor's own disclosed protocol_deviation in
    experiments/EXP-MONO-cb905d/execution_report.yaml ("the group-uniform
    arm's literal 3-branch rule never actually draws the point at
    infinity, despite the spec's summary prose mentioning it").

    Version 2's replacement construction (rejection sampling over 2p+1
    equiprobable slots {(x,b): x in F_p, b in {0,1}} union {O}, redrawing
    on both a non-residue x and the "wrong" bit at a 2-torsion x) is
    verified correct by direct counting: each of the group's N points
    corresponds to exactly one accepting slot out of 2p+1 total slots
    (two slots per generic two-root x, one accepting/one-rejecting slot
    per 2-torsion x, one slot for O), so conditional on acceptance every
    point is drawn with probability exactly 1/N -- true group-uniform
    sampling, matching EXP-MONO-12ce1c OBJ-6's own intended construction.

  process_disposition: >-
    The out-of-band edit is NOT adopted by silent acceptance of the
    in-place mutation to a frozen file, regardless of its verified
    correctness -- per this program's own stated discipline (frozen
    contracts are amended, never edited in place) and this Coordinator's
    own established practice this lane (verify content independently;
    disclose every out-of-band incident via a correction record; adopt
    or reject on the merits, never on the commit message's own say-so).
    This amendment is the proper vehicle for the verified-correct fix,
    filed under this Coordinator's own authority rather than accepted as
    an unreviewed external mutation. See CORR-20260831-ba2118 for the
    full incident disclosure.

  changes:
    - id: CB905D-V2-GROUP-UNIFORM-SAMPLER-FIX
      field_scope: inputs.seed_derivation_rule_part_a_group_uniform_arm
      operation: replace_biased_construction_with_verified_uniform_construction
      old_construction_defect: >-
        2-torsion points overweighted 2x relative to generic points;
        point at infinity unreachable despite being named in the
        surrounding prose.
      new_construction: >-
        Rejection sampling over 2p+1 equiprobable slots
        {(x,b): x in F_p, b in {0,1}} union {O}: with probability
        1/(2p+1) accept O directly; otherwise draw x uniformly in F_p
        (label "gu-x") and a fair bit b (label "gu-sign"); if f(x) is a
        nonzero square accept the root selected by b; if f(x)=0 accept
        the 2-torsion point when b=0 and reject (redraw) when b=1; if
        f(x) is a non-residue reject and redraw. Every group point is
        then drawn with probability exactly 1/N conditional on
        acceptance.
    - id: CB905D-V2-STOPPING-RULE-DISAMBIGUATION
      field_scope: >-
        stage_order_and_the_terminating_stage.stage_1_part_a.terminates_the_run_if,
        stopping_rules, falsification_criterion
      operation: disambiguate_single_curve_vs_both_curve_obj6_shortfall
      change_summary: >-
        v1's stopping/falsification text used "either curve" ambiguously
        across a run-terminating condition and a reporting-only
        condition. v2 makes explicit: the run terminates ONLY if NEITHER
        curve reproduces OBJ-6's 1.84-2.08x band (both curves miss); a
        single-curve shortfall does not terminate the run and is instead
        reported prominently as a disclosed deviation from the prior
        finding. Falsification is narrowed to exactly the both-curves-miss
        case; neither direction of the pre-registered, genuinely open P3
        or P6 comparisons is treated as falsification.
      why_this_is_a_disambiguation_not_a_new_criterion: >-
        v1's own `outcomes` block already enumerated
        `sampling_artifact_uniform_across_endomorphism_ring`,
        `sampling_artifact_endomorphism_ring_linked`, and
        `obj6_effect_fails_to_reproduce` as the three live, non-
        falsifying dispositions. v2's falsification_criterion text is
        brought into agreement with that pre-existing outcomes block
        rather than narrowing what the contract already scoped as open.

