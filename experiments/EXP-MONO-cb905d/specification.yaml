  id: EXP-MONO-cb905d
  version: 1
  status: completed
  status_note: >-
    Completed 2026-09-04 per DEC-20260904-8c17d5. RUN-1's Part A invalidated
    by a sampler defect (CORR-20260831-ba2118); Part B valid. RUN-2 (under
    amendment v1's corrected sampler) found the archived P3 significance
    test itself defective (CORR-20260904-d0205d); properly corrected, P3 is
    nominally significant (p~0.025-0.033), reversing the archived "not
    significant" reading. Disposition: inconclusive pending a pre-registered
    replication at a second matched cell (see DEC-20260904-8c17d5
    next_action) -- third consecutive borderline result on this one cell,
    no multiplicity correction applied.
  frozen: true
  execution_authorized: true
  evidence_eligible: true
  approved_by: coordinator
  approved_at: '2026-08-31'
  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  coordinator_approval_rationale: >-
    APPROVED. This is DEC-20260831-7b44fe's own named next_action,
    reached identically by both EXP-MONO-64aaa4's Validator and Red Team
    via independent reasoning: (1) extend Stage 1-2's measurement to the
    already-constructed >=100 cross-prime matched-(N,tau) cells sitting
    in EXP-MONO-64aaa4's own archived stage0_transcript.json, and (2)
    apply EXP-MONO-12ce1c's own already-validated OBJ-6 discriminating
    control (transversal vs. genuinely group-uniform sampling) to the
    matched curves. NO NEW CURVE CONSTRUCTION IS NEEDED for (1): every
    curve is already built and archived; this contract reads
    (p,A,B,N,tau,role) directly from EXP-MONO-64aaa4's own committed
    transcript. (2) is scoped to the SAME-PRIME p=617 pair specifically
    as the PRIMARY, cleanest test (field held constant, so no
    field/characteristic confound), with the cross-prime extension of (1)
    explicitly treated as exploratory context given the Validator's own
    disclosed confound (a cross-prime match compares curves over
    different fields). SAME STANDALONE-BRANCH AUTHORITY AS ALL PRIOR
    MONO CONTRACTS THIS SESSION.

  title: >-
    Multi-cell extension and the OBJ-6 discriminating control: does the
    already-known ~2x transversal-vs-group-uniform sampling artifact
    differ in magnitude between a CM curve and an ordinary curve at the
    same (N,tau), and does the p=617 cell's borderline signal replicate
    across >=100 additional matched-(N,tau) cells?

  what_this_is_not:
    - Not a discrete-logarithm computation, not an ECDLP attack, not relation collection at scale.
    - Not an ECDLP cost, runtime, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - >-
      Not a re-litigation of EXP-MONO-64aaa4's own already-decided
      disposition (inconclusive); this contract extends that record's own
      data and applies the control its own review named as missing.
    - >-
      Not a claim that cross-prime cells are equivalent evidence to
      same-prime cells: the cross-prime extension (Part B below) is
      explicitly exploratory context, given the field/characteristic
      confound the Validator disclosed, never treated as equal-weight
      evidence to Part A's same-field OBJ-6 control.
    - Not a claim on GOAL-ECDLP-001's or GOAL-RELN-001's territory.
    - Not approved for any purpose beyond what this record states once run.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: (A) whether the already-measured ~2x transversal-vs-
      group-uniform sampling artifact differs in magnitude between the
      CM and ordinary member of the SAME (p=617, N=580, tau=4) matched
      pair; (B) as exploratory context, the distribution of within-curve
      residuals and pairwise comparison statistics across the
      cross-prime matched-(N,tau) cells already present in
      EXP-MONO-64aaa4's own transcript, under the SAME transversal
      construction that record used.
    what_no_outcome_can_support: >-
      No outcome establishes anything about m != 4, other CM
      discriminants beyond j in {0,1728}, extension fields, or any
      cost/exponent claim. Part B's cross-prime results do NOT
      individually or collectively establish (N,tau)-only completeness
      or its failure, given the disclosed field confound; they are
      reported as a distribution for context, per DEC-20260831-7b44fe's
      own scoping.

  inputs:
    reused_frozen_data: >-
      experiments/EXP-MONO-64aaa4/runs/RUN-MONO-64aaa4-1/stage0_transcript.json,
      READ-ONLY, byte-identical to the already-committed archive. Every
      curve's (p,A,B,N,n1,n2,tau,role,j_invariant) is taken directly from
      this file; NO curve is reconstructed. Any (p,A,B) values needed
      that the transcript does not carry directly are re-derived
      DETERMINISTICALLY from EXP-MONO-64aaa4's own frozen
      seed_derivation_rule and construction procedures (byte-identical
      code reuse), never independently re-chosen.
    part_a_pair: >-
      The SAME (p=617, N=580, tau=4) matched pair EXP-MONO-64aaa4 tested:
      ordinary (A=340,B=362) and CM j=1728 (A=69,B=0).
    part_b_cells: >-
      ALL matched-(N,tau) cells identifiable in the archived transcript
      where the ordinary curve and either CM candidate (j=0 or j=1728)
      share (N,tau), INCLUDING cross-prime matches (ordinary at p1, CM
      candidate at p2 != p1) -- reversing EXP-MONO-64aaa4's own
      undisclosed same-prime-only narrowing, per both reviewers'
      explicit finding that >=100 such cells already exist in that
      transcript.
    null_draws_per_curve: 20000
    null_draws_note: >-
      Matches EXP-MONO-64aaa4's own floor for Part B's transversal
      measurement (direct continuation of that record, not a fresh
      design-time choice). Part A's group-uniform arm uses the SAME
      20000-draw count per curve per convention, matching
      EXP-MONO-12ce1c OBJ-6's own methodology (30000 tuples there; this
      contract uses 20000 to match its own Part B floor and this lane's
      general convention, disclosed as a deliberate, minor departure
      from OBJ-6's own count -- not expected to matter qualitatively
      given OBJ-6's effect size, ~2x, is far larger than what a few
      thousand tuples already resolved there).
    domain: EXP-MONO-cb905d/v1
    seed_derivation_rule_part_a_group_uniform_arm: >-
      For the group-uniform sampling arm (NEW, not present in
      EXP-MONO-64aaa4 or EXP-MONO-12ce1c's own random-point construction
      beyond OBJ-6's own supplementary check): draw a uniform point
      P = (x,y) in E(F_p) INCLUDING the point at infinity and ALL
      2-torsion points, EACH group element with probability exactly 1/N,
      via rejection sampling over the 2p+1 equiprobable slots
      {(x,b) : x in F_p, b in {0,1}} union {O} (one slot per affine
      y != 0 point, one slot per 2-torsion point, one slot for O) -- i.e.
      with probability 1/(2p+1) accept the point at infinity; otherwise
      draw x uniformly in F_p (label "gu-x") and a fair bit b (label
      "gu-sign"), compute f(x) mod p, and: if f(x) is a nonzero square
      accept the root selected by b; if f(x) = 0 accept the 2-torsion
      point when b = 0 and REJECT when b = 1 (so 2-torsion is NOT
      overweighted relative to the two-root points); if f(x) is a
      non-residue reject and redraw. This is DISTINCT from Part B's
      (and EXP-MONO-64aaa4's) transversal draw, which excludes f(x)=0
      entirely. Both arms otherwise reuse EXP-MONO-64aaa4's own m=4
      construction (3 drawn points, 4 canonical sign classes) unmodified.
    seed_derivation_rule_part_b: >-
      IDENTICAL to EXP-MONO-64aaa4's own seed_derivation_rule (domain
      changed to this contract's own EXP-MONO-cb905d/v1; labels
      "fb-x" reused for the transversal draw), applied to each additional
      matched pair's own (p,A,B) values read from the transcript.

  stage_order_and_the_terminating_stage:
    principle: >-
      Part A (the primary, cleanest, same-field discriminating test)
      runs first and is reported as the headline result regardless of
      Part B's own outcome. Part B is exploratory context, clearly
      labeled, and does not gate or override Part A's own reading.
    stage_0:
      name: read the archived transcript; enumerate ALL matched-(N,tau) cells (same-prime and cross-prime)
      compute: seconds
      description: >-
        Load EXP-MONO-64aaa4's own stage0_transcript.json; enumerate
        every (ordinary, CM) pair sharing (N,tau), reporting same-prime
        and cross-prime matches SEPARATELY and explicitly, with the
        exact count of each. Confirm the already-reported p=617 pair is
        recovered exactly as the sole same-prime match (a sanity check
        on this contract's own transcript-reading code, not a new
        search).
    stage_1_part_a:
      name: >-
        transversal-vs-group-uniform discriminating control, BOTH
        curves, p=617 pair
      compute: minutes
      description: >-
        For each of the two matched curves (ordinary and CM j=1728 at
        p=617), draw 20000 tuples under BOTH the transversal convention
        (reusing EXP-MONO-64aaa4's own construction and, where the SAME
        seed/domain/curve inputs are used, its own archived counts
        directly rather than redrawing) and the NEW group-uniform
        convention, and measure the m=4 collision rate under each.
        Compute, for EACH curve, the ratio (group-uniform rate) /
        (transversal rate) -- this is OBJ-6's own measured quantity,
        expected near 1.84-2.08x per that record's own finding at m=4.
      terminates_the_run_if: >-
        NEITHER curve shows a group-uniform/transversal ratio materially
        above 1 (i.e. the already-published ~2x effect fails to reproduce
        on BOTH curves here) -- this would falsify OBJ-6's own finding
        independent of this contract's own CM-vs-ordinary question, and
        must be reported prominently as a failure to reproduce prior
        evidence, not absorbed. A single-curve miss does NOT terminate
        the run: if at least one curve's ratio is materially above 1 but
        either curve falls outside OBJ-6's 1.84-2.08x band, the run
        continues to Stage 2 and the shortfall is reported prominently
        per `stopping_rules` and `falsification_criterion` (a).
    stage_2_part_a:
      name: direct comparison of the two curves' OWN group-uniform/transversal ratios
      compute: seconds
      description: >-
        THE PRIMARY, HEADLINE RESULT. Compare the ordinary curve's own
        ratio to the CM curve's own ratio (e.g. via a ratio-of-ratios or
        a direct comparison of the group-uniform collision counts,
        holding the transversal counts as the already-established
        baseline from EXP-MONO-64aaa4). A significant difference between
        the two curves' own ratios is evidence the 2-torsion-exclusion
        artifact itself interacts with endomorphism ring -- a
        structurally distinct, and more targeted, question than
        EXP-MONO-64aaa4's own transversal-only comparison.
    stage_3_part_b:
      name: exploratory extension of Stage 1-2 (transversal only) to cross-prime cells
      compute: minutes, scales with the number of cells found in Stage 0
      description: >-
        For EVERY matched-(N,tau) cell found in Stage 0 (same-prime and
        cross-prime), reusing EXP-MONO-64aaa4's own already-executed
        p=617 result directly (no re-draw) and computing fresh
        transversal Stage-1/2 measurements (per that record's own
        method, unmodified) for every OTHER cell, report: each curve's
        own within-curve deviation in SE from its predicted G6/G7 rate,
        and each pair's own two-sided Fisher-exact comparison p-value.
        EXPLICITLY LABELED EXPLORATORY: the field/characteristic
        confound in cross-prime cells (Validator's own disclosed caveat)
        means this is reported as a DISTRIBUTION for context (how often
        does a single cell land this close to significance, or a single
        curve deviate this much, across many cells), not as N independent
        replications of the SAME clean question Part A asks.
      budget_guard: >-
        If the number of Stage-0 cells makes exhaustive Stage-3
        measurement exceed the declared budget, measure a
        DETERMINISTICALLY-ORDERED PREFIX (smallest-p-pair-sum first, a
        rule fixed here before any cell is measured) and report the exact
        count measured versus the total found -- never a post-hoc or
        outcome-dependent subset.

  arms_and_controls:
    part_a_transversal_arm: >-
      Reused directly from EXP-MONO-64aaa4's own archived raw-result.json
      for the p=617 pair (613 ordinary, 681/679 CM pairs/tuples,
      20000 draws each) -- NOT re-measured, per this contract's own
      no-new-curve-construction, no-redundant-compute discipline.
    part_a_group_uniform_arm: >-
      NEW. 20000 fresh draws per curve under the group-uniform
      construction declared in `inputs` above, on the SAME two curves
      (p=617 ordinary and CM j=1728), independent seed stream (label
      "gu-x"/"gu-sign", disjoint from "fb-x").
    part_a_ratio_comparison: >-
      (group-uniform rate) / (transversal rate), each curve
      independently, then the two curves' own ratios compared directly.
      This is the PRIMARY headline result.
    part_b_transversal_extension: >-
      Fresh transversal Stage-1/2 measurements (EXP-MONO-64aaa4's own
      method, unmodified) on every OTHER matched-(N,tau) cell found in
      Stage 0, up to the declared budget guard.
    dual_convention_control: >-
      NOT RE-RUN: EXP-MONO-64aaa4's own reviewers proved the fixed-sign/
      random-sign check is tautological for this construction (both
      independently, matching EXP-MONO-12ce1c OBJ-6). Re-running it here
      would be a known-empty check; explicitly SKIPPED, with this
      rationale stated, rather than silently omitted or redundantly run.
    comparability_policy: >-
      Part A's own numbers are directly comparable to EXP-MONO-12ce1c's
      OBJ-6 findings (both measure the same transversal-vs-group-uniform
      ratio at m=4), and this is the ONE licensed cross-contract
      comparison in this record. Part B's per-cell numbers are NOT
      licensed for comparison against any other contract's own absolute
      figures (distinct domain, distinct curves).

  metrics:
    primary:
      - "P1: group-uniform/transversal collision-rate ratio, ordinary curve (p=617)."
      - "P2: group-uniform/transversal collision-rate ratio, CM curve (p=617)."
      - "P3: direct comparison of P1 and P2 (the headline result)."
    secondary:
      - "P4: Stage-0 cell count, same-prime and cross-prime, separately."
      - "P5: per-cell within-curve SE deviations and pairwise Fisher-exact p-values, Part B extension, explicitly labeled exploratory."
      - "P6: distribution summary of P5 (e.g. how many cells land at p<0.1, p<0.05; how many single-curve deviations exceed 2 SE) as null-object-style context for interpreting the p=617 cell's own borderline signal."

  preregistered_prediction:
    - quantity: P1, P2 (group-uniform/transversal ratio, each curve)
      value: "Both curves show a ratio in the 1.84-2.08x range EXP-MONO-12ce1c OBJ-6 measured at m=4 on other curves."
      formula: "OBJ-6's own empirical finding, not a closed-form derivation."
      source: experiments/EXP-MONO-12ce1c/reviews/red-team/red-team-report.yaml OBJ-6.
    - quantity: P3 (comparison of P1 and P2)
      value: >-
        TWO-SIDED, GENUINELY OPEN: if P1 and P2 agree within statistical
        tolerance, the 2-torsion-exclusion artifact is (N,tau)-determined
        like Part B's own main formula; if they disagree materially, the
        artifact itself is endomorphism-ring-linked -- a new, more
        specific exceptional-locus candidate than anything tested in
        this lane so far.
      formula: n/a (direct empirical comparison).
      source: DEC-20260831-7b44fe next_action; independently named by both EXP-MONO-64aaa4 reviewers.
    - quantity: P6 (distribution of Part B's exploratory cells)
      value: >-
        NOT pre-registered in a specific shape; reported as measured. If
        the p=617 cell's own 2.4-SE/p=0.066 signal is typical of the
        distribution across cross-prime cells, that supports reading it
        as sampling noise; if it is an outlier relative to the
        distribution, that is worth escalating.
      formula: n/a (descriptive).
      source: Both reviewers' own next_concrete_action text.

  replication:
    planned_runs: 1
    seeds: [20260901]
    interpretation: >-
      Single deterministic run. Part A's two curves and their transversal
      counts are fixed (reused from EXP-MONO-64aaa4); only the
      group-uniform draws are new and seeded once. Part B's cell set is
      fixed by Stage 0's transcript read; no seed-to-seed replication is
      meaningful for either part at this stage.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 3600
    maximum_cpu_seconds: 7200
    maximum_peak_rss_bytes: 536870912
    maximum_total_disk_bytes: 268435456
    maximum_workers: 1
    no_network: true
    cost_note: >-
      Part A: 2 curves x 20000 group-uniform draws, comparable cost to
      EXP-MONO-64aaa4's own per-curve transversal measurement (~1-2s
      each based on that run's own timing). Part B: up to ~100 cells x
      ~4s/cell (EXP-MONO-64aaa4's own observed per-cell cost) =~ 400s,
      comfortably inside budget. If Stage 3's actual cell count or
      per-cell cost makes the full extension infeasible within budget,
      apply the declared budget_guard (deterministic prefix) rather than
      silently reducing scope after seeing partial results.

  environment_preconditions:
    consequence: NO CAS AND NO SOLVER IS REQUIRED, unchanged from this lane's other contracts.
    if_a_precondition_fails: >-
      A missing interpreter, a failed transcript read, or a construction
      mismatch against the archived transcript's own recorded (p,A,B) is
      `failed_infrastructure`, reported as infrastructure signal, NEVER
      negative mathematical evidence (AGENTS.md rule 3).

  infrastructure_failure_disposition: >-
    Any timeout, crash, or construction failure is recorded with its
    exact cause and classified `failed_infrastructure` or `invalid`.
    Supports and weakens NOTHING about H-MONO-1d50ac or the ECDLP.

  stopping_rules:
    - Do not execute unless separately reviewed, approved, frozen and authorized. (Satisfied here.)
    - >-
      Stop Part A if the re-derived p=617 curves' (A,B) do not match
      EXP-MONO-64aaa4's own archived transcript exactly -- report as
      failed_infrastructure, do not proceed with a silently-different
      curve.
    - >-
      Report prominently (do not absorb) if Part A's own group-uniform/
      transversal ratios fail to reproduce OBJ-6's own 1.84-2.08x finding
      on EITHER curve. This reports, it does not terminate; only the
      both-curves case in `stage_1_part_a.terminates_the_run_if` stops
      the run.
    - Stop on any budget breach, applying the declared budget_guard for Part B rather than silently truncating.

  invalidation_rules:
    - Any execution while frozen, execution_authorized or evidence_eligible is false.
    - Any re-construction (rather than direct reuse) of EXP-MONO-64aaa4's own p=617 curves or its own archived transversal counts for that pair.
    - Any Part B cell selection made AFTER seeing any Part A or partial Part B result (the budget_guard's deterministic ordering rule must be fixed before Stage 3 begins).
    - Any Part B result presented without its own exploratory-context labeling and the field-confound caveat.
    - >-
      Any post-hoc change to the group-uniform sampling construction, the
      null-draw count, or the budget_guard ordering rule after any
      Stage-1 or Stage-3 number has been observed.

  success_criterion: >-
    A run is well-formed evidence (regardless of which direction P1-P6
    come out) if: Stage 0's cell enumeration is reported with exact
    same-prime/cross-prime counts; Part A's group-uniform arm is measured
    on both p=617 curves and compared against OBJ-6's own prior finding;
    Part A's P3 comparison is reported as the headline result; Part B's
    extension is reported with its own exact cell count (measured vs.
    found) and explicit exploratory labeling. THAT DISPOSITION SUPPORTS
    EXACTLY the scoped statement in claim_ceiling and nothing more.

  falsification_criterion: >-
    Exactly one condition: Part A's group-uniform arm failing to
    reproduce OBJ-6's own 1.84-2.08x finding on EITHER curve -- this
    falsifies this contract's own pre-registered P1/P2 prediction and is
    reported prominently as a failure to replicate prior evidence.
    NOTHING ELSE IS FALSIFICATION HERE. In particular, neither direction
    of P3 (agreement, or a significant difference between the two curves'
    own ratios) and neither direction of P6 (the p=617 cell an outlier,
    or entirely typical) is a contract failure: those are the
    pre-registered, genuinely open outcomes enumerated under `outcomes`,
    and a significant P3 difference -- the single most consequential
    possible result, a targeted exceptional-locus candidate -- is
    escalated to independent review as a FINDING, not recorded as
    falsification.

  outcomes:
    sampling_artifact_uniform_across_endomorphism_ring: >-
      Part A's P3 shows no significant difference between the two
      curves' own group-uniform/transversal ratios. The 2-torsion-
      exclusion artifact is (N,tau)-determined like Part B's main
      formula; this specific, targeted axis does not distinguish CM from
      ordinary curves at this cell.
    sampling_artifact_endomorphism_ring_linked: >-
      Part A's P3 shows a significant difference. A new, more specific
      exceptional-locus candidate than anything found in this lane so
      far, escalated to independent review-adversarial.
    obj6_effect_fails_to_reproduce: >-
      Neither curve shows the expected ~2x ratio. A failure to reproduce
      prior evidence (EXP-MONO-12ce1c OBJ-6), reported prominently as its
      own significant finding, independent of this contract's own
      CM-vs-ordinary question.
    infrastructure_or_integrity_failure: See infrastructure_failure_disposition. Never mathematical evidence.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      Unchanged from this lane's other contracts: toy scale, no transfer
      to cryptographic scale or F_{q^n}. Part B's cross-prime findings
      additionally do not transfer to any claim about a fixed field.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its SHA-256.
    - Stage-0 cell enumeration transcript (same-prime and cross-prime counts, exact list).
    - Part A's group-uniform draws and both curves' own ratios, with a direct OBJ-6 comparison.
    - Part A's P3 comparison statistic.
    - Part B's per-cell results (up to the budget_guard's declared prefix), with the exact measured-vs-found count.
    - Run manifest carrying git commit, dirty-tree state, environment, resolved model identifier and probe status.
    - Command, stdout, stderr, timings, peak RSS, and an execution report.
    - Snapshot archive followed by independent validation and red-team review.

  approval_requirements:
    - This contract IS DEC-20260831-7b44fe's own named next_action; no further Coordinator judgment call is reserved beyond this approval.
    - Independent review confirms Part A's group-uniform construction is a genuine, correct implementation of OBJ-6's own described method, not merely plausible.
    - Independent review confirms Part B's cell selection (if budget-limited) is genuinely fixed before any result is observed, and that its exploratory labeling and field-confound caveat are carried through to any headline framing.

  approval_status: >-
    APPROVED 2026-08-31 by the Coordinator; see `coordinator_approval_rationale` above.

