    - artifact: experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-1/{manifest.yaml,raw-result.json,command.txt,stdout.log,stderr.log,environment.json}
      status: present_and_internally_consistent
      note: "status: completed_valid; command matches artifacts; commit 70f058c9d recorded (git access was available at RUN-1 time)."
    - artifact: experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-2/{manifest.yaml,raw-result.json,command.txt,stdout.log,stderr.log,environment.json}
      status: present_and_internally_consistent_with_disclosed_gap
      note: >-
        status: completed_valid; command matches artifacts. `code.commit`
        and `code.dirty` are explicitly `unavailable_git_blocked_this_session`
        / `unknown_git_blocked_this_session`, disclosed (not fabricated) as
        a genuine gap pending the Coordinator's own snapshot-archive
        commit. This is an incompleteness in provenance recording, not an
