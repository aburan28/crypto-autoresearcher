    archived values exactly, and the transversal-arm reuse is confirmed
    byte-for-byte unchanged from RUN-MONO-cb905d-1. The "_with_finding"
    qualifier is because the round's blind_rederivation control was
    compromised by manifest.yaml's own result.metrics block restating the
    target values -- a task-design defect, not a defect in the underlying
    science -- which the Coordinator should correct in the blind_from list
