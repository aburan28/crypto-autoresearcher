        manifest.
    - artifact: experiments/EXP-MONO-cb905d/amendments/v1.yaml and ledger/corrections/CORR-20260831-ba2118.yaml
      status: present_content_complete_archival_status_draft
      note: >-
        Both self-report `archival_status: DRAFT, NOT YET COMMITTED` at
