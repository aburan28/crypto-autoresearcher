  # =====================================================================
  # J1-SAMPLER-MATH
  # =====================================================================
  j1_sampler_math:
    verdict: holds
    method: >-
      Direct combinatorial slot-counting derivation performed independently,
      before reading and without relying on the amendment's own stated
      conclusion (the amendment's prose was read for the CLAIM to check, per
      the task's own background-reading order, but the derivation below was
      constructed from first principles rather than by transcribing the
      amendment's argument). Cross-validated two ways: (i) an exact,
      non-Monte-Carlo enumeration of accepting/rejecting slots on an
      independently-chosen toy curve (p=19, A=2, B=3, unrelated to the
      experiment's own p=617 curves); (ii) a 2,000,000-draw Monte Carlo
      simulation of the same four constructions on the same toy curve, run
      from my own from-scratch code (no code shared with or copied from the
      experiment's implementation files).
    general_derivation: >-
      For E: y^2 = f(x) = x^3+Ax+B over F_p, let tQ = #{x : f(x) is a
      nonzero square} (each contributing 2 affine points), t2 = #{x : f(x)=0}
      (each an affine 2-torsion point, t2 in {0,1,3} for a nonsingular
      cubic), t_nqr = #{x : f(x) a non-residue} (0 points), so
      p = tQ+t2+t_nqr and N = 1+t2+2*tQ (incl. O). This derivation is
      general in t2 and does not depend on the experiment's own specific
      curve parameters (p=617, N=580); the toy curve (t2=1) is a concrete
      instance used only for numeric/empirical demonstration.

      V1, AS ACTUALLY SPECIFIED AND AS ACTUALLY IMPLEMENTED (verified
      against the literal code in
      experiments/EXP-MONO-cb905d/implementation/run_experiment.py
      gu_draw_point(), read AFTER this derivation and the blind
      recomputation below, purely to confirm the historical RUN-1 code
      matches the spec prose the amendment quotes -- confirmed
      byte-for-byte equivalent to the described "if f==0: return (x,0) #
      unconditional accept, no coin flip" defect): draw x uniform in F_p;
      reject/redraw on non-residue; on a square, split 1/2-1/2 between the
      two roots; on f(x)=0, accept UNCONDITIONALLY. Modeling the "square"
      branch's coin flip as one of 2 equiprobable sub-units per x (2p
      elementary units total, matching V2's own unit size for direct
      comparability): a specific generic (two-root) point gets exactly 1
      accepting unit out of 2p; a specific 2-torsion point gets BOTH of its
      x's 2 units (since acceptance there does not depend on the coin),
      i.e. 2 accepting units out of 2p. Conditional on acceptance:
        Pr[a given 2-torsion point] = 2/N_accept, Pr[a given generic point] = 1/N_accept
      -- exactly 2x, confirming the amendment's claim (a) exactly. Pr[O] = 0
      always (no unit maps to O) -- confirming O is structurally
      unreachable, independent of p or the curve, also confirming claim (a).

      V2 (2p+1-slot construction): 2p+1 equiprobable elementary units (1 for
      O, 2 per x in F_p). O's unit always accepts. Per x with f(x) a nonzero
      square: both of its 2 units accept, landing 1-1 on its two distinct
      points. Per x with f(x)=0: exactly 1 of its 2 units accepts (b=0),
      landing on the 2-torsion point; the other unit (b=1) rejects. Per x
      non-residue: both units reject. Total accepting units =
      1 + 2*tQ + t2 = N, and this is an EXACT BIJECTION between accepting
      units and the group's N points (verified by construction: every
      point has exactly one accepting unit, and every accepting unit maps
      to exactly one point). Hence conditional on acceptance every point
      has probability exactly 1/N -- confirming claim (b) exactly, and
      matching the amendment's own slot-counting proof via an independently
      constructed argument.
    toy_curve_exact_enumeration:
      curve: "p=19, A=2, B=3 (independently chosen, unrelated to p=617)"
      derived_group_shape: "tQ=9, t2=1, t_nqr=9, N=20"
      v1_result: "Pr[O|accept]=0 (unreachable); ratio(2-torsion:generic)=2.0 exactly; NOT uniform"
      v2_result: "Pr[O|accept]=1/20; ratio(2-torsion:generic)=1.0; every one of the 20 points gets exactly 1/20 -- exactly uniform"
    toy_curve_monte_carlo_2e6_draws:
      v1: "freq[O]=0.00000, ratio(2tors/generic)=2.000 (matches exact prediction)"
      v2: "freq[O]=0.04999 (~1/20=0.05), ratio(2tors/generic)=1.001 (matches exact prediction)"
    cross_check_against_actual_committed_code: >-
      experiments/EXP-MONO-cb905d/implementation/run_experiment.py
      gu_draw_point() (the code RUN-MONO-cb905d-1 actually ran) implements
      exactly the biased V1 construction modeled above (unconditional
      "return (x,0)" on f(x)==0, no O-drawing code path anywhere in the
      function). experiments/EXP-MONO-cb905d/implementation/run_experiment_v2_part_a_corrected.py
      sample_group_uniform_v2_corrected() implements exactly the V2
      construction modeled above (draw u in [0,2p+1) for the O slot; on
      f(x)=0, accept iff b==0, else reject/redraw). Both were read only
      AFTER my own derivation and toy-curve checks above were complete, so
      this is a confirmation of the historical artifacts against an
      independently-produced model, not the source of the model.

    proves_too_much_control:
      outcome: passed
      broken_1_omit_O_slot:
        construction: "V2's own slot structure with the O unit deleted (2p slots total, matching v1's actual defect of never drawing O)."
        exact_result: "Pr[O|accept]=0 (unreachable); ratio(2-torsion:generic)=1.0 exactly."
        method_verdict: "FLAGGED AS NOT UNIFORM -- correctly, because my check tests two things separately: (i) the reachable set equals ALL N points (fails here: O is unreachable), and (ii) all reachable points have equal weight. This variant satisfies (ii) but fails (i)."
        methodological_note: >-
          IMPORTANT: a naive verification method that checks ONLY the
          2-torsion:generic ratio (a plausible, simpler test, since that
          ratio is exactly what v1's own defect broke) would have reported
          this variant as "ratio=1.0, looks uniform" -- WRONGLY, since it
          silently excludes O. This is exactly the proves_too_much
          object's point: a method must check full reachability of every
          group element, not just a pairwise ratio between two named
          categories. My method checks both explicitly; a
          ratio-only method would NOT have passed this control, and I flag
          that as a real trap that a less careful J1 check could fall into.
      broken_2_unconditional_2torsion_accept:
        construction: "V2's own slot structure (O present) but 2-torsion x accepted unconditionally on both b=0 and b=1 (no fair-bit split)."
        exact_result: "Pr[O|accept]=1/21 (not 1/20); each 2-torsion point gets 2/21 vs each generic point's 1/21 -- ratio 2.0 exactly."
        method_verdict: "FLAGGED AS NOT UNIFORM -- correctly (unequal per-point weights: 2-torsion points get exactly double every other point's probability, including O's)."
      failure_signature_avoided: >-
        Neither broken variant is reported as uniform or looks-correct by
        my method; both are flagged, with the specific mechanism of bias
        named in each case. The J1 control from the task card's
        `proves_too_much` block is satisfied.

  # =====================================================================
  # J2-RERUN-CORRECTNESS  (+ blind_rederivation)
  # =====================================================================
  j2_rerun_correctness:
    verdict: holds
    blind_rederivation:
      required: true
      quantity: "RUN-MONO-cb905d-2's P1, P2, P3, and the Fisher-exact p-value"
      blind_from_declared:
        - experiments/EXP-MONO-cb905d/execution_report.yaml
        - experiments/EXP-MONO-cb905d/implementation/run_experiment_v2_part_a_corrected.py
      blind_from_respected: false
      blindness_defect_disclosed: >-
        NEITHER of the two paths named in blind_from was read before I
        computed P1/P2/P3/Fisher-p independently (both were opened only
        afterward, per the task's own "ONLY AFTER completing this blind
        recomputation" instruction, and confirmed by tool-call order in
        this session). HOWEVER, true blindness to the TARGET VALUE was
        still broken: experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-2/manifest.yaml
        -- which the assigning task's own background-reading step 5
        instructed me to read alongside raw-result.json, and which is NOT
        on the blind_from list -- contains a `result.metrics` block that
        states P1=2.398042414355628, P2=2.063142437591777,
        P3=1.1623251844670337, and the Fisher p-value=0.32999478969615775
        verbatim, identical to what execution_report.yaml later states. I
        read this manifest before performing my own computation. I am
        disclosing this as a genuine defect in this round's blind_from
        list, not glossing over it: the list should have named
        manifest.yaml too (or the task should have instructed reading only
        raw-result.json, with the manifest's own `result.metrics` block
        redacted or deferred), since a run manifest's own metrics summary
        is exactly the kind of "producer's own stated conclusion" the
        blind_rederivation mechanism exists to guard against. I flag this
        as a FINDING for the Coordinator: manifest.yaml should be added to
        future blind_from lists whenever its own `result.metrics` restates
        the rederivation target. I did NOT, however, copy or transcribe
        the manifest's arithmetic -- I built the computation below from the
        raw per-tuple/per-pair counts in raw-result.json, using my own
        script and (for the Fisher test) scipy.stats.fisher_exact called
        directly, not any wrapper from the experiment's own code -- so the
        recomputation itself is methodologically independent even though
        blindness to the NUMERIC TARGET was compromised by this leak.
        Net effect on this joint's evidentiary value: the exact-match
        result below can no longer be read as "an independent derivation
        that could have disagreed and didn't"; it can only be read as "a
        recomputation from raw counts that is internally consistent with
        the manifest's own claim," which is a weaker (though still
        useful) form of validation. See `limitations`.
      independent_recomputation:
        source: >-
          experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-2/raw-result.json
          `part_a.group_uniform` (raw ntuples/pair-collision counts) and
          `part_a.transversal` (rates reused unchanged from RUN-1, see
          cross-check below). No formula or code from
          run_experiment_v2_part_a_corrected.py or execution_report.yaml
          was consulted before this computation (see disclosure above for
          the manifest.yaml caveat).
        raw_counts_used:
          ord_group_uniform: {ntuples: 20000, total_pairs_colliding: 1470, tuples_with_collision: 1049}
          cm_group_uniform: {ntuples: 20000, total_pairs_colliding: 1405, tuples_with_collision: 1005}
          ord_transversal_rate_pairs_per_tuple: 0.03065
          cm_transversal_rate_pairs_per_tuple: 0.03405
        formula_used: >-
          P1 = (ord_total_pairs_colliding/ord_ntuples) / ord_transversal_rate;
          P2 = (cm_total_pairs_colliding/cm_ntuples) / cm_transversal_rate;
          P3 = P1/P2. This is the only computable definition, since
          raw-result.json's `part_a.transversal` block reports ONLY a
          pairs-per-tuple rate (no any-collision variant) for the
          transversal arm, so the ratio's denominator admits no other
          reading. Fisher-exact p-value: two-sided Fisher exact test
          (scipy.stats.fisher_exact) on the 2x2 table
          [[ord tuples_with_collision, ord 20000-that],[cm
          tuples_with_collision, cm 20000-that]] -- i.e. the any-collision
          (per-tuple) count, matching the table shape reported in
          raw-result.json's own `P3_headline_comparison` block (which I
          read only to locate the TABLE DEFINITION, i.e. which of the two
          available per-arm counts -- pairs-colliding vs tuples-with-
          collision -- forms the 2x2 cells; I did not read its own
          odds_ratio/p_value fields into my calculation, I recomputed both
          from the counts).
        my_computed_values:
          P1: 2.398042414355628
          P2: 2.063142437591777
          P3_ratio_of_ratios: 1.1623251844670337
          fisher_exact_odds_ratio: 1.046204521690004
          fisher_exact_p_value: 0.32999478969615775
        archived_values_execution_report_and_manifest:
          P1: 2.398042414355628
          P2: 2.063142437591777
          P3_ratio_of_ratios: 1.1623251844670337
          fisher_exact_p_value: 0.32999478969615775
        discrepancy: >-
          NONE. Match is exact to full double-precision (identical to the
          last printed digit in every field, including odds_ratio,
          verified separately). As a sanity/consistency check on the same
          method, RUN-MONO-cb905d-1's own P1=2.9559543230016314,
          P2=2.6857562408223203, P3=1.100604097301318, p=0.48788099980143695
          were independently reproduced by the identical script/formula
          from RUN-1's own raw counts (1812/1187 collisions of 20000 for
          ord, 1829/1221 of 20000 for cm), also an exact match -- so the
          formula/method is confirmed consistent across both runs, not a
          coincidence specific to RUN-2.
        interpretation_given_the_blindness_defect: >-
          Because a straightforward division/Fisher-exact-test computation
          on a small, fully-determined set of integer counts is
          essentially forced (there is no free parameter or judgment call
          once the counts and the table shape are fixed), an exact match
          here is expected of ANY correct implementation and does not, on
          its own, distinguish "the raw counts and formula are correct" from
          "I was unconsciously anchored by having seen the target." What
          this recomputation DOES establish, independent of the blindness
          defect: the arithmetic in execution_report.yaml's
          part_a_corrected_rerun_2026_09_04 section is an internally
          consistent, correctly-executed transformation of the raw counts
          in raw-result.json -- no transcription error, no silent
          substitution of a different table, no off-by-one in the
          collision-count fields. What it does NOT establish (and cannot,
          given the leak): that the raw counts themselves (1470, 1049,
          1405, 1005) are an unbiased or bug-free product of the actual
          v2-corrected sampler's Monte Carlo execution -- verifying THAT
          would require independently re-running the simulation with a
          fresh implementation, which is outside this joint's stated scope
          ("recompute independently from raw-result.json") and is instead
          covered indirectly by J1 (the sampler's constructive correctness)
          and by the run's own point_uniformity_check spot-check
          (chi_square_stat_over_df ~0.98 and ~0.90 for ord/cm respectively,
          consistent with, but not proof of, per-point uniformity).
    transversal_arm_reuse_cross_check:
      verdict: confirmed_unchanged
      method: >-
        Direct field-by-field comparison of `part_a.transversal` between
        RUN-MONO-cb905d-1/raw-result.json and
        RUN-MONO-cb905d-2/raw-result.json.
      result: >-
        Both runs report IDENTICAL values for
        ord.rate_pairs_per_tuple_fixed=0.03065,
        ord.rate_pairs_per_tuple_random=0.03065, ord.identical_fixed_random=true,
        ord.rate_pairs_per_tuple=0.03065, cm.rate_pairs_per_tuple_fixed=0.03405,
        cm.rate_pairs_per_tuple_random=0.03405, cm.identical_fixed_random=true,
        cm.rate_pairs_per_tuple=0.03405 -- exact match on every field, confirming
        the transversal-arm counts were read directly from
        RUN-MONO-cb905d-1's raw-result.json and reused byte-for-byte, not
        redrawn, as both the amendment and RUN-2's own manifest/
        execution_report claim.
    curve_rederivation_cross_check:
      verdict: confirmed
      result: >-
        Both runs' `part_a.curve_rederivation_check` report the identical
        (A=340,B=362,N=580,tau=4) ordinary curve and (A=69,B=0,N=580,tau=4)
        CM curve, matching each other and the archived
        EXP-MONO-64aaa4 transcript. No silent curve substitution between
        runs.
    artifact_integrity_spot_checks:
      - "RUN-MONO-cb905d-2/stdout.log is byte-identical in size (4933 bytes) to raw-result.json, consistent with the recorded command's stdout redirect."
      - "RUN-MONO-cb905d-2/stderr.log is empty, consistent with status: completed_valid and no reported errors."
      - "RUN-MONO-cb905d-1/stdout.log is byte-identical in size (107314 bytes) to its own raw-result.json, same check, same result."
      - "RUN-MONO-cb905d-1's raw-result.json part_b.cells array contains exactly 100 entries, matching found_count/measured_count=100 (parsed via json.load, not eyeballed) -- consistent, though Part B is out of scope for J1/J2 and is not otherwise re-examined here."

