execution_report:
  experiment_id: EXP-MONO-cb905d
  implementation_commit: 70f058c9dcda67f49ec3a943b0e2854bfdd3bf5d
  handoff_id: TASK-20260831-466725

  protocol_deviations:
    - >-
      Group-uniform sampling arm interpretation: `specification.yaml`'s
      `inputs.seed_derivation_rule_part_a_group_uniform_arm` says the arm
      draws from "E(F_p) INCLUDING the point at infinity" in its summary
      clause, but its own precise 3-branch operational rule (draw x
      uniformly in F_p; nonzero-square -> one of 2 affine roots; zero ->
      the affine 2-torsion point directly; non-residue -> reject/redraw)
      never allocates a domain slot for O and therefore never draws it.
      This script implements the literal 3-branch operational rule exactly
      as given (labels gu-x/gu-sign exactly as specified), which samples
      uniformly over the N-1 AFFINE points of E(F_p). This was fixed BEFORE
      any draw was performed (per invalidation_rules, the construction
      cannot be altered after any Stage-1/3 number is observed) and is
      disclosed in implementation.md item 4, not silently resolved.
    - >-
      Distinctness rule for the group-uniform arm's 3 drawn points is
      defined as distinct x-coordinates (the direct generalization of
      EXP-MONO-64aaa4's own distinct-factor-base-index rule, since the
      group-uniform arm has no factor base to index into). Disclosed in
      implementation.md item 5.

  runs:
    completed:
      - RUN-MONO-cb905d-1
    invalid: []
    failed: []

