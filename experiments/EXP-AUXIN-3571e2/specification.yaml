      "scalar_panel": "Every x in1..r-1, ascending. Thus100 scalars at r101 and240 at r241:2040 scalar/list cases. Scalar0 is a separate explicit exceptional-input control at each list, not a success case for multiplicative exponent extraction.",
      "curve_selection": "For each r, list every prime p with r<p<=r+64 in ascending order, then every A,B in0..p-1 lexicographically. Reject singular curves, j0/1728 and supersingular curves (p divides trace). Count E(F_p) exactly; require r divides #E to exponent1. Let h=#E/r; scan affine points in lex(x,y), take first P=[h]Q !=O and independently verify [r]P=O. Select first eligible curve. Selection is independent of x, divisor costs and outcomes. Record all rejected candidates. Finite-domain exhaustion yields inconclusive; no enlargement or alternate r.",
      "public_parameters": "r, p, A,B, P, Q=[x]P, smallest primitive root zeta in F_r* verified against exact factorization of r-1, and modulus list m_i. Each m_i divides r-1 and d_i=(r-1)/m_i; supplied point U_i=[x^{d_i} mod r]P. No r+1 input variant or standard-curve supply is assumed.",
      "supply_model": "Synthetic experiment generator knows x only to create Q and supplied U_i. Serialize only public canonical EC coordinates, curve parameters, r,zeta and unique named U_i to solver input. No point object carries discrete-log/scalar metadata. Generator truth and candidate x live only in a separate checker record inaccessible to solver. This is an artificial chosen-input reproduction, not an oracle for an unknown deployed secret. Each solver invocation runs in a fresh process with only the documented serialized public input, independent of trial order. No scalar-derived filename, case ordinal, prior-case state, generator/checker file, private lookup table or inherited x-valued environment is accessible to solver code. Root runner writes private truth and the case-to-result mapping checker-side in fixtures.json and certificates.json; solver never reads these files. Source/data-flow audit verifies the interface. Process separation is an experimental isolation control, not a cryptographic hiding claim.",
      "source_gate": "Primary Cheon2006 Theorem1, Corollary1 and acquisition passages are filed by retrieved citation plus explicit formula/source correspondence in this intake source-notes.json before approval. Core multi-input CRT is known. This satisfies the source-filing gate only for the bounded synthetic reproduction; any real-protocol input supply remains a separate required source-backed audit."
    },
    "methods": {
      "extract": "For each distinct m, define alpha=zeta^((r-1)/m) mod r. Recover k_m in0..m-1 satisfying U=[alpha^k_m]P by multiplicative-action baby-step giant-step: b=ceil(sqrt(m)); baby table [alpha^j]P for0<=j<b; giant points [alpha^(-bi)]U for0<=i<ceil(m/b). Equality gives k_m=bi+j mod m; range-check k_m<m and verify against U. Deterministic table collision tie-break is smallest candidate k. Each scalar action on EC points uses counted double-and-add, never hidden logarithms.",
      "crt": "Combine k_m by generalized CRT, checking each pair agrees modulo gcd. Return a in0..M-1 with M=lcm(m_i). Repeated/nested inputs do not enlarge M. Verify a mod m_i=k_m for all inputs. Compatible finite residues cover exactly (r-1)/M possible multiplicative exponents in0..r-2; never replace M by product for overlaps.",
      "residual": "Let beta=zeta^M, R=(r-1)/M and V=[zeta^(-a)]Q. Recover t in0..R-1 from V=[beta^t]P using the same bounded action-BSGS. Return xhat=zeta^(a+M*t) mod r and verify [xhat]P=Q. If M=r-1, R=1 and check t=0 directly. x=0/Q=O routes to explicit exceptional branch before multiplicative operations.",
      "baseline": "Run ordinary additive BSGS for Q=[x]P on the same subgroup/public Q, with b=ceil(sqrt(r)), baby[j]P and giant Q-[bi]P, range and verification checks. Reproduce known single-input Cheon extraction/residual structure as list1 and2. Hash/array lookup engineering is held consistent and separately counted; no folklore exponent comparison substitutes for measured operation totals.",
      "source_cost": "Generate each unique requested exponent d once; duplicate list entries reference the same serialized token and retain duplicate parsing/check costs. Count finite-field exponentiation for x^d, EC double-and-add to form U, serialization and data bytes. Q generation is a common benchmark fixture cost, recorded separately and added to both total pipelines. Also generate dense powers x^j for1<=j<=max(d_i) by successive field multiplication and their EC points as a distinct charged supply-control route; give the solver only requested tokens. Extra dense tokens are not silently used to improve attack. Dense route is a synthetic cost comparator, not a protocol supply claim.",
      "cost_tables": "For every scalar/list report attacker setup+extract+CRT+residual+verification; sparse synthetic supply; dense synthetic supply; ordinary BSGS; common fixture cost; supply-inclusive totals. Count EC additions/doublings, field additions/multiplications/inversions, scalar-action calls, table entries/lookups, integer/CRT operations, actual bytes and peak RSS, CPU/wall. Measured and symbolic columns separate. Do not sum heterogeneous operation units into a universal speedup; report per-component ratios and measured total time with environment. Equal M predicts equal residual domain, not identical total extraction or runtime.",
      "complexity": "Symbolic attacker-only model O((sum_unique sqrt(m_i)+sqrt((r-1)/M))*log r) group-addition scale for binary scalar actions, plus factor/primitive-root, CRT and verification. Memory O(max_i sqrt(m_i),sqrt((r-1)/M)) stored points under serial reuse, plus all retained public tokens and arithmetic. Supply-inclusive formula adds actual acquisition+validation+data costs. No fixed asymptotic improvement or deployed affected set is established.",
      "audit": "Independent checker recomputes every recovered x from private ground truth, every m,d,M,R and extracted residue; exhaustive scalar-space enumeration validates candidate residual sets independently of CRT. Calibration truth never enters solver ordering. Implementation and checker use separate arithmetic paths for point law/order checks. The runner passes public JSON through standard input, uses a fixed command and anonymous pipes, supplies only a fixed allowlisted environment and no trial ID, and starts a new process per scalar/list invocation. Private fixture paths are not arguments. The solver implementation is audited to read only stdin/public arithmetic parameters and to emit its result on stdout; no filesystem reads, clocks, random seeds derived from x, environment inspection or process inspection are permitted. Timing is recorded by runner, not exposed as solver input."
