experiment:
  id: EXP-SIG-006
  hypothesis_id: H-SIG-001
  version: 1
  title: >-
    D6 null baseline re-derivation + birth-law re-measurement: diagnose the
    EXP-SIG-005 C5 null failure at D6 (null ncols 31,180 vs sem 29,332; null
    rank 31,179 overshooting sr_pred 28,068 by 3,111; null extra_6 = 4,986 !=
    0), build a corrected D6 null baseline with equal ncols by construction,
    recalibrate sr_pred for D6, validate it (extra = 0 and rank == sr_pred),
    and re-measure the sem D6 residual birth residual_6 at n = 9 against the
    corrected baseline.
  status: approved
  objective: >-
    DEC-20260722-001 next_actions: "Before ANY D6 claim: re-derive the D6
    null baseline (equal-ncols support matching + sr_pred recalibration)."
    EV-SIG-005 showed the support-matched null is exactly semi-regular
    through D3/D4/D5 (extra = 0, rank == sr_pred) but breaks at D6 (RUN-k,
    n = 9). This experiment (1) diagnoses WHY, at the mechanism level, with
    machine-checked computations; (2) constructs a corrected null whose D6
    Macaulay column set equals the sem's BY CONSTRUCTION; (3) validates the
    corrected null at D6 (extra = 0, rank == sr_pred_D6_corrected) while
    keeping the D3/D4/D5 anchors clean under the SAME construction; (4)
    re-measures residual_6 = extra_6 - A5 at n = 9 against the corrected
    baseline. If no corrected null validates at D6, that is a clean
    scientific finding (the semi-regular baseline model itself breaks at D6)
    and is recorded precisely with the diagnosis.
  inputs:
    systems: >-
      boolean chained Semaev m = t = 3 (semaev_tree builder), n = 9 (nb =
      18; mandatory), seeds 1 (the RUN-h/RUN-k anchor instance) and 2
      (replication) if budget allows; n = 12 (nb = 24) diagnosis-level only,
      if cheap. Standard-instance filter per EXP-SIG-002 (R_x != 0, no
      degree-1 equation).
    reference: >-
      EV-SIG-005 receipts RUN-EXP-SIG-005-h (sem n=9 seed=1: D6 nrows
      45,324 / ncols 29,332 / rank 27,292 / sr_pred 28,068 / kernel 18,032 /
      rankK 9,135 / extra 8,897; A3_6 542, A4_6 3,580, A5 6,282, residual_6
      2,615) and RUN-EXP-SIG-005-k (null: D6 ncols 31,180 / rank 31,179 /
      kernel 14,145 / rankK 9,159 / extra 4,986). Column counts at
      D3/D4/D5: sem 544/3,056/11,032; null 936/4,038/12,615.
    instrument: >-
      bit-identical copy of the pinned EXP-SIG-001..005 instrument
      (src/h013_f5_signatures.sage sha256
      1ba96fe477c9dc2e7c551c96353c8361d21e40134551342636b2f13015c09087 +
      semaev_tree.py / ic_first_fall_fast.py / macaulay_export.py, hashes
      verified at setup and recorded in every receipt). The pinned
      instrument is loaded, never modified; all new constructions live in
      the EXP-SIG-006 driver/scripts.
    sr_pred_semantics: >-
      the pinned semireg_rank_pred computes, per its in-place update loop,
      the Hilbert series H(z) = (1+z)^nb * PROD_i (1+z^{d_i})^{-1}
      truncated at the first non-positive coefficient, NOT the textbook
      Bardet PROD_i (1-z^{d_i}); verified numerically in this experiment
      against every recorded null rank at D <= 5. This semantics is part of
      the certified baseline and is reproduced, not "fixed".
  controls:
    - C1 anchor reproduction — the diagnosis run must reproduce the
      EV-SIG-005 receipt numbers (ncols at D3..D6 for both arms; eq degree
      histogram (9 quadratic + 9 cubic equations) before any new claim is
      recorded. Mismatch =
      instrument drift, halt, not evidence.
    - C2 lower-degree anchors — the corrected null construction must show
      extra = 0 and rank == sr_pred at D3/D4/D5 at n = 9 (same thresholds
      as the old null met), under the SAME construction that is used at D6.
    - C3 D6 validation — the corrected null must show, at D6 — column set
      identical to the sem's D6 column set (equal ncols by construction,
      verified as sets), extra = 0, and rank == sr_pred_D6_corrected where
      sr_pred_D6_corrected is an a-priori formula fixed BEFORE the sem
      residual_6 re-measurement (the formula and its derivation are
      deliverables of the diagnosis stage).
    - C4 determinism — the corrected null construction built twice from the
      same seeds must be identical (monoset-level compare), and one D6
      classification repeated must match modulo timing.
    - C5 variety ground truth — solution counts |V| of the sem and of each
      null candidate at n = 9 (nb = 18; full 2^18 enumeration, vectorized)
      are recorded as ground truth for the consistency analysis.
    - C6 sanity identities — kernel_dim == nrows - rank; extra ==
      kernel_dim - rankK; ncols and column sets consistent across
      recomputations.
  independent_variables:
    - n in {9 (mandatory), 12 (diagnosis-level, if cheap)}
    - seed in {1 (anchor), 2 (replication, if budget allows)}
    - null construction in {old (support-matched, pinned), corrected
      candidates}
    - degree D in {3, 4, 5, 6}
  metrics:
    primary:
      - diagnosis — D6 column-set difference sem-vs-null (sizes, degree and
        block-composition histograms of the missing set), coverage-condition
        verification, |V_sem| / |V_null|, sr_pred series coefficients and
        freeze degree per n
      - corrected null — ncols at D6 (must equal sem's 29,332 as sets),
        extra and rank vs sr_pred at D3/D4/D5/D6
    secondary:
      - sem residual_6 = extra_6 - A5 re-measured at n = 9 seed 1 against
        the corrected baseline, with A3_6/A4_6/A5 continuity vs RUN-h
        (542/3,580/6,282)
      - stage wall times, peak RSS per run
  replication:
    seeds: "n = 9 seed 1 mandatory; seed 2 if budget allows"
    independent_instances: "1 sem cell + corrected null cells per seed"
  budget:
    wall_clock_seconds_per_run: 600
    total_wall_clock_seconds: 3300
    maximum_memory_gb: 24
    maximum_runs: 12
  stopping_rules:
    - Any single sage invocation > 600 s is killed at a checkpoint boundary
      (infrastructure censoring, AGENTS rule 5 — NOT evidence); completed
      stages are flushed first.
    - C1 anchor-reproduction mismatch halts the experiment (instrument
      drift, not evidence).
    - n = 12 D6 rank linear algebra is attempted only after all n = 9
      deliverables are complete and >= 900 s of budget remains; otherwise it
      is censored by scope, not by failure.
    - Scope-reduction order — drop n = 12 entirely, then seed 2, keeping the
      n = 9 seed 1 diagnosis + corrected-null validation + residual_6
      re-measurement.
  invalidation_rules:
    - Timeout/OOM/kill = failed_infrastructure (AGENTS rule 5), never
      evidence.
    - A determinism mismatch invalidates the affected cell.
    - A corrected-null anchor failure at D3/D4/D5 invalidates the
      construction, not the sem arm; it is recorded and the next candidate
      construction is tried.
    - If NO corrected null validates at D6, the D6 sem quantities remain
      inadmissible (unchanged from EV-SIG-005); the diagnosis + the precise
      break statement are the deliverable, labeled CONJECTURE where not
      machine-checked.
  success_criterion: >-
    Numbers only; the verdict belongs to the Coordinator. Either (a) a
    corrected null with column sets equal to the sem's at D6 by
    construction, extra = 0 and rank == sr_pred_D6_corrected at D6,
    D3/D4/D5 anchors clean, determinism verified, and the sem residual_6
    re-measured against it; or (b) a machine-checked diagnosis establishing
    that no null of the considered family can validate at D6 (semi-regular
    baseline break), with the exact mechanism, the variety ground truth, and
    the sem D6 quantities labeled inadmissible as before.
  falsification_criterion: >-
    The diagnosis is falsified at each machine check (column coverage
    condition, variety counts, sr_pred series reproduction). The corrected
    null is falsified by any extra != 0 or rank != sr_pred at D3..D6.
  required_artifacts:
    - specification.yaml (this file)
    - implementation.md
    - src/ instrument copies (sha256-recorded)
    - scripts/diag_d6_null.py (diagnosis, phase A)
    - scripts/sig6_run.sage (driver — corrected-null construction +
      validation + residual_6 re-measurement, phases B/C)
    - runs/RUN-EXP-SIG-006-*/manifest.yaml, raw.json, stdout.txt,
      stderr.txt, command.txt, environment.json
    - summary.json
    - analysis.md
    - ledger/EV-SIG-006.yaml
  assigned_to: executor
  approved_by: coordinator   # handoff TASK-20260724-D6NULL

handoff:
  id: TASK-20260724-D6NULL
  from: coordinator
  to: executor
  objective: >-
    Re-derive the D6 null baseline (equal-ncols support matching + sr_pred
    recalibration), validate it at D6 (n = 9 mandatory; n = 12 if cheap),
    then re-measure the sem D6 residual birth residual_6 against the
    corrected baseline — the first admissible degree-axis point of the
    cascade.
  uncertainty_reduced: >-
    Why the support-matched null broke at D6, and whether ANY null baseline
    validates the D6 cascade measurement at n = 9.
  inputs:
    - ledger/EV-SIG-005.yaml, EV-SIG-003.yaml, DEC-20260722-001.yaml
    - experiments/EXP-SIG-005/analysis.md, SIG5_run.sage, src/
    - experiments/EXP-SIG-005/runs/RUN-EXP-SIG-005-h/raw.json,
      RUN-EXP-SIG-005-k/raw.json
  constraints:
    - Write ONLY inside experiments/EXP-SIG-006/ and ledger/EV-SIG-006.yaml;
      no git commits; concurrent session's paths are read-only.
    - 600 s per-invocation kill rule; 12 runs maximum; 3300 s total.
    - Reuse instruments only by copying (done; hashes verified).
    - A partial result with honest validity_status is a success;
      fabrication is the only failure.
  deliverables:
    - experiments/EXP-SIG-006/ complete artifact tree
    - ledger/EV-SIG-006.yaml
    - final report to the Coordinator (numbers only, no verdict)
  budget:
    wall_clock_seconds: 3300
    memory_gb: 24
    maximum_runs: 12
  completion_gate:
    - deliverables written
    - controls pass or deviations recorded
    - validity_status set honestly
  return_format: execution_report
