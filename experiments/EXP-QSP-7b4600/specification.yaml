experiment:
  id: EXP-QSP-7b4600
  hypothesis_id: H-QSP-cba939
  idea_id: IDEA-20260918-6c07e1
  version: 1
  title: Frobenius-orbit residue obstruction at extension degree 131
  status: approved
  objective: >-
    Reproduce the pre-registered residue table for H-QSP-cba939 and the two
    controls that keep the exclusion from applying where it is known to be
    the wrong shape.
  inputs:
    modulus: 131
    n_prime_range: [1, 131]
    excluded_range: [2, 129]
    permitted_set: [1, 130, 131]
    edge_residues:
      1: 2
      130: 1
      131: 2
    order_checks:
      pow_130: 1
      pow_65: 130
      pow_26: 53
      pow_10: 107
    known_permission_cells:
      - n: 7
        n_prime: 3
        residue: 1
      - n: 31
        n_prime: 15
        residue: 1
    orbit_census_degree: 7
    composite_control:
      degree: 15
      subfield_polynomial: x^8 + x
      expected_root_count: 8
      expected_residue_mod_degree: 8
  controls:
    - >-
      Non-exclusion: n' = 1, 130 and 131 stay inside {1, 2}, and so do the
      cells (7, 3) and (31, 15).
    - >-
      Orbit census: in F_(2^7) every orbit of x |-> x^2 has size 1 or 7,
      and exactly two orbits have size 1.
    - >-
      Composite degree: the roots of x^8 + x in F_(2^15) number 8, and
      8 modulo 15 is outside {0, 1, 2}.
    - >-
      The size-1 equation x^2 + x = 0 has exactly two roots in characteristic 2.
  independent_variables:
    - n' from 1 through 131
  metrics:
    primary:
      - permitted_set
      - excluded_hit_count
      - order_witnesses
    secondary:
      - n7_orbit_size_set
      - n7_size1_orbit_count
      - composite_root_count
      - composite_residue
  heuristic_under_test: null
  preregistered_prediction:
    quantity: residues of 2^n' modulo 131 and the two control counts
    formula: >-
      Permitted n' in [1, 131] are exactly {1, 130, 131}, with residues
      2, 1, 2. Every n' from 2 through 129 has residue outside {1, 2}.
      Order witnesses are 1, 130, 53 and 107. The degree-7 orbit sizes are
      {1, 7} with two orbits of size 1. The degree-15 control has 8 roots
      and residue 8.
    source: >-
      IDEA-20260918-6c07e1, with the integer table recomputed while this
      contract was frozen. That recomputation is not an experiment run.
  scale_relevance:
    tier: toy
    justification: >-
      The decision is exact arithmetic at modulus 131 and enumerations in
      fields of 128 and 32768 elements. No transfer to approximate splitting
      or to a curve discrete logarithm is assumed.
    correspondence: null
  tail_checks:
    - >-
      n' = 130 remains permitted. An exclusion of that single exponent
      fails the non-exclusion control.
  replication:
    seeds: []
    independent_instances: 131
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after the residue table, the order witnesses, the degree-7 census, and the degree-15 root count.
    - Do not search for a lambda and do not run a degree-2^33 gcd.
  invalidation_rules:
    - A residue is reported from floating-point arithmetic.
    - The degree-7 census is sampled instead of enumerated.
    - n' = 130 is omitted from the table.
    - The composite control is run at a prime degree.
  success_criterion: >-
    The run is valid. The permitted set is exactly {1, 130, 131}, the
    excluded range has no residue in {1, 2}, the order witnesses match,
    the degree-7 census matches, and the degree-15 control has residue 8.
  falsification_criterion: >-
    The run is valid and either some n' from 2 through 129 has residue in
    {1, 2}, or the permitted set differs from {1, 130, 131}.
  required_artifacts:
    - experiments/EXP-QSP-7b4600/runs/<RUN-ID>/command.txt
    - experiments/EXP-QSP-7b4600/runs/<RUN-ID>/residues.json
    - experiments/EXP-QSP-7b4600/runs/<RUN-ID>/stdout.txt
    - experiments/EXP-QSP-7b4600/runs/<RUN-ID>/stderr.txt
  assigned_to: executor
  approved_by: coordinator
  approval:
    decision_id: DEC-20261005-8c1053
    basis: >-
      AGENTS.md standing user authorization of 2026-09-06. This record
      freezes the arithmetic self-test. It does not start the executor.
    not_launched_because: >-
      GOAL-ECDLP2M-001 next_action names TASK-20261005-34c6e8 and opens no
      batch. Dispatch of TASK-20261005-bce6c1 waits for a Coordinator
      decision that releases this experiment.
