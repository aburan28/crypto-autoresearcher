experiment:
  id: EXP-MLKEM-67d103
  hypothesis_id: H-MLKEM-4f752a
  derived_from_idea: IDEA-20260821-003cb0
  question_id: RQ-MLKEM-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    ML-KEM's reduction budget and the rung-by-rung ledger of the Albrecht-Deo chain - concrete-
    constant evaluation of the published corollaries at FIPS 203 parameters, with a structure-
    deleted control that must emit exactly one rung, a budget-relaxed control that carries the
    whole E1/E2 discrimination, and two reproduction fixtures that separate 'the constants are
    large' from 'the transcription is wrong'
  objective: >-
    The one uncertainty a run reduces - whether the published Module-LWE to Ring-LWE reduction
    chain, evaluated at its CONCRETE constants rather than its asymptotic form, can ever land on
    an instance cheaper to solve than ML-KEM itself, and if not, by how many bits it misses. A run
    establishes (i) R_0 per parameter set from FIPS 203 constants re-read from the standard, which
    is the unconditional budget; (ii) the rung-one charge decomposed into named columns - concrete
    prefactor, the choice of the free constant, the choice of the smoothing parameter, and the
    separately tracked spherical-error correction with its search-only restriction - at three
    declared negligibility levels; (iii) the single-shot descent charge and the overcharge that
    composing halvings would incur; (iv) the rung table with each rung marked ALIVE, MARGINAL or
    DEAD and tagged with whether the chain's own hypotheses still hold; and (v) on the alive rungs
    only, the signed difference in estimated primal blocksize against the un-reduced baseline under
    matched accounting. No attack, break, speedup or exponent movement is claimed here or would
    follow from a run.
  what_this_is_not:
  - >-
    Not an attack, a break, a distinguisher, or a speedup. It is a cost ledger for a published
    reduction.
  - >-
    Not a claim that the reduction chain is the only one, nor a claim about what the external
    literature does or does not contain.
  - >-
    Not a re-audit of this lane's inherited algebraic constraint, and not a re-proof of the
    subfield/trace-descent case. It instantiates one of the classes that constraint does not reach.
  - >-
    Not an absolute cost statement. The estimator is used as a COMPARATOR under matched accounting
    and the reported quantity is a difference; no absolute cost from it is quoted.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - under the frozen cost model, the concrete constants of the named
      corollaries at the declared free constant, smoothing parameter, negligibility level and
      sample count, and the single-shot descent, no rung of THIS chain improves on the direct
      attack at these parameter sets, and the per-rung exchange rate is the tabulated number of
      bits of log2(q/sigma) for a factor 2^i of dimension. WHAT DOES NOT FOLLOW - nothing about
      reductions not evaluated; nothing about actual as opposed to estimated attack cost; nothing
      about the DECISION variant of any rung that used the spherical-error corollary; and no
      security claim about FIPS 203 in either direction. The unconditional part is only the R = 0
      floor.
  inputs:
    procedure: >-
      STAGE 0 (paper arithmetic, no lattice, no estimator; THIS IS THE DECIDER). Re-fetch the
      current version of the source, re-extract, and transcribe VERBATIM with locators and version
      dates - the MLWE-to-RLWE corollary's inequality, its admissibility condition, the basis-
      length value for power-of-two cyclotomics, the advantage-loss term and its tail lemma, the
      spherical-error corollary with its sample-count dependence and its search-only restriction,
      and the descent corollary in its single-shot form. REFUSE the informal abstract as a source
      of constants. Then, BEFORE quoting any number, declare the negligibility level and SOLVE the
      two inequalities that pin the free constant and the smoothing parameter, exhibiting both.
      Re-read the FIPS 203 constants from the standard and compute R_0 per parameter set. Evaluate
      the rung-one prefactor per parameter set. Evaluate the spherical-error column at the jointly
      optimised sample count, reported BOTH as a multiplier of and as a replacement for the
      prefactor until the reading is settled from the corollary text rather than the prose.
      Subtract. Report at three negligibility levels so the choice's contribution is a visible
      column, not a buried one.
      STAGE 1 (the two-coordinate ledger). For each admissible target ring dimension emit the rung
      with its dimension, module rank, exact modulus as an integer power, noise, hardness coordinate
      and residual budget, and mark it ALIVE, MARGINAL or DEAD. Separately flag rungs whose ring
      dimension has fallen below where the descent corollary's own hypotheses still hold, and rungs
      reachable only under the search-variant restriction.
      STAGE 2 (cost evaluation, ALIVE rungs only). Run the pinned estimator's primal and dual cost
      models over the sample count, and compare against the identical estimator run on the
      un-reduced instance. Report the SIGNED DIFFERENCE in blocksize and in log2 cost, per rung, per
      parameter set. The sample count enters both the estimator's own optimisation and the
      spherical column, so the two are optimised JOINTLY and the chosen value reported. If Stage 0
      returns zero alive rungs for every ML-KEM set and every negligibility level, Stage 2 runs on
      the budget-relaxed control only.
      STAGE 3 (the controls that can fail). Run the identical ledger on the structure-deleted
      instance, where the chain's hypotheses fail and the correct rung count is one; and on the
      budget-relaxed instance, swept over at least four modulus-to-noise values, where the budget
      does not bind.
      STAGE 4 (zero compute). Assemble the budget, its column decomposition, the rung table, the
      signed differences, and the forward-guidance statement.
    instrument: >-
      Stage 0 and Stage 1 - standard-library Python 3.11 arithmetic plus a verbatim-quotation log;
      NO Sage, no lattice, no estimator. Stage 2 - ONE lattice cost estimator at ONE pinned commit
      and ONE pinned cost model, invoked identically on both arms in the same process, with the
      commit sha recorded in the manifest. Every quoted theorem string is written into the run
      record with a corollary or section locator AND the version date, so a later reader can check
      the subtraction without re-fetching and so a superseded version cannot re-enter unnoticed.
      Recorded through harness/runner.py.
    parameters: >-
      ML-KEM-512, ML-KEM-768 and ML-KEM-1024 at their FIPS 203 constants, re-read from the standard
      and certified in-harness; no constant is used from recall. Three negligibility levels,
      declared before any number is quoted, each pinning a free constant and a smoothing parameter
      through the two exhibited inequalities. Descent targets - every admissible ring dimension
      reachable by the SINGLE-SHOT descent; composing halvings is FORBIDDEN and its overcharge at
      depth two is reported as a separate number. Sample count optimised jointly with the estimator
      and reported per rung, with any rung whose optimum sits at a boundary flagged as not
      comparable to one whose optimum is interior. Controls - the structure-deleted instance at
      matched hardness coordinate, and the budget-relaxed instance swept over at least four
      modulus-to-noise values between the ML-KEM value and the relaxed value.
  controls:
  - >-
    NULL-1, THE STRUCTURE-DELETED INSTANCE. Plain unstructured LWE at matched dimension and matched
    log2(q/sigma), with a uniform random matrix and no ring or module structure. The chain requires
    a power-of-two cyclotomic module structure, so its hypotheses FAIL here and the correct ledger
    has EXACTLY ONE RUNG. The control fails - and voids the whole pipeline - if a second rung is
    emitted, because that proves the code applies the transformation without checking the hypothesis
    that licenses it. This is the cheapest possible check that the pipeline tracks a reduction and
    not merely arithmetic on two numbers.
  - >-
    NULL-2, THE BUDGET-RELAXED INSTANCE. The same ML-KEM shape with the modulus raised at fixed
    noise so the budget is not the binding constraint, swept over at least four modulus-to-noise
    values so the MONOTONICITY of the blocksize difference in that coordinate is reported rather
    than assumed. LOAD-BEARING, NOT AUXILIARY - the concrete constants predict zero alive rungs on
    ML-KEM itself, so this is the only arm on which the E1/E2 discrimination can be exercised at
    all. It can fail informatively in both directions.
  - >-
    ESTIMATOR BASELINE FIXTURE. The un-reduced rung must reproduce the published core-SVP blocksize
    for the same cost model within a tolerance declared BEFORE the run. If it does not, the
    estimator arm is VOID and only Stage 0 and Stage 1 are reportable - stated in advance precisely
    so that a Stage-2 failure cannot silently downgrade into a Stage-0 conclusion.
  - >-
    ASYMPTOTIC-LIMIT FIXTURE. The Stage-0 evaluator, run in the limit that suppresses the
    logarithmic and constant factors the source itself ignores, must reproduce the source's own
    asymptotic form. This is what separates 'the concrete constants are large' from 'the
    transcription is wrong', and it costs nothing.
  - >-
    READING CONTROL. The exact source text for each blow-up factor, admissibility condition and
    advantage-loss term is quoted verbatim into the run record with its locator AND its version
    date.
  - >-
    MATCHED-ACCOUNTING CONTROL. Both arms of every comparison are scored by the same estimator
    invocation, same version, same cost model, same seed policy, in the same process.
  independent_variables:
  - parameter set (ML-KEM-512 / 768 / 1024)
  - descent depth i, hence target ring dimension
  - declared negligibility level (three values), which pins the free constant and the smoothing parameter
  - sample count (optimised jointly, reported)
  - instance family (ML-KEM signal arm / NULL-1 structure-deleted / NULL-2 budget-relaxed at four modulus-to-noise values)
  - spherical-error column included or excluded, and multiply-or-replace reading
  metrics:
    primary:
    - >-
      alive_rung_count - integer per parameter set per negligibility level, reported twice, with and
      without the spherical-error column. A rung is ALIVE when its residual budget is strictly
      positive AND the chain's own hypotheses still hold at its ring dimension; MARGINAL when the
      residual budget is in (0, 1] bits; DEAD otherwise. This is the headline and the prediction is
      exactly 0.
    - >-
      log2_rung_one_blowup - bits per parameter set per negligibility level, computed from the
      corollary's concrete prefactor with the pinning inequalities exhibited. Scored against the
      three-way pre-registered prediction below.
    - >-
      spherical_column_bits - bits, at the jointly optimised sample count, reported under BOTH the
      multiplier and the replacement readings, and tagged search-only.
    - >-
      signed_blocksize_difference - blocksize units, rung i minus the un-reduced baseline, per alive
      rung, per parameter set, under matched accounting. Reported for NULL-2 at every swept
      modulus-to-noise value with the monotonicity in that coordinate stated.
    - >-
      null1_rung_count - integer. Must be exactly 1. Any other value voids the whole run.
    secondary:
    - >-
      R_0 per parameter set, to two decimals, with the constants it was computed from and their
      source in the standard.
    - >-
      the declared negligibility level and the free constant and smoothing parameter it pins, with
      BOTH bounding inequalities exhibited rather than asserted.
    - >-
      descent_charge_bits per target ring dimension, from the single-shot form, and
      composition_overcharge_bits at depth two.
    - >-
      the full rung table - index, ring dimension, module rank, log2 modulus, log2 noise, dimension,
      residual budget, status, hypotheses-hold flag, variant tag.
    - >-
      the jointly optimised sample count per rung, with a boundary flag.
    - >-
      the two reproduction fixtures, pass or fail, with the tolerances declared beforehand.
    - >-
      the verbatim quotation log - every transcribed string with its locator and version date.
  cost_model:
    measured_vs_modeled: >-
      No column mixes the two. TRANSCRIBED - every constant, inequality and advantage-loss term
      taken verbatim from the source, with locator and version date. DERIVED - R_0, the rung-one
      charge, the spherical column, the descent charge and the residual budget, all closed-form
      arithmetic on transcribed constants. MODEL-EVALUATED - every blocksize and cost figure from
      the pinned estimator, reported ONLY as a difference between two arms and never as an absolute.
      A single reported number never combines two of these categories.
    optimistic_assumptions:
    - >-
      Charging the CBD secret as a discrete Gaussian of matched standard deviation without a
      transfer step. Direction of bias - the CBD tail is bounded while the Gaussian tail is not, so
      the corollary's tail-bound pair is CONSERVATIVE for CBD, i.e. this understates the attacker's
      position and OVERSTATES the charge. Safe direction for a closure, and it must be stated as
      such rather than claimed as an improvement.
    - >-
      Instantiating the free constant at the smallest value admissible under the declared
      negligibility level. Direction of bias - smaller charge, favourable to the chain, i.e. against
      the predicted closure. This is deliberate; a closure that survives the chain-favourable corner
      is the only one worth recording.
    - >-
      Taking the descent in single-shot form. Direction of bias - smaller charge than composing
      halvings, again favourable to the chain and against the closure. The overcharge that
      composition would incur is reported so the reader sees the interval.
    - >-
      Excluding the spherical-error column in the second reported ledger. Direction of bias - larger
      residual budget, favourable to the chain. Both ledgers are reported side by side.
    memory_accounting: >-
      Memory is not the object of this contract and no attack memory is claimed. The RUN's own peak
      resident memory is reported per stage, dominated by the estimator process in Stage 2 and
      negligible in Stages 0, 1, 3 and 4. Where the estimator's cost model carries a memory charge,
      that charge is applied identically to both arms and enters only the reported difference; the
      critical memory exponent it uses is recorded in the manifest so a later reader can see which
      convention was in force.
    hidden_overhead: >-
      Disclosed. (a) The estimator's own o(1) and cost-model choice can move absolute numbers by
      tens of bits; mitigated by reporting differences only, but a model whose error depends on
      log q would still bias the comparison, and the rungs differ enormously in log q. This is a
      REAL RESIDUAL and is reported, not waved at. (b) The CBD-to-Gaussian transfer has a cost that
      is not in the ledger and Stage 0 must record which instance it is costing. (c) The
      search-only restriction of the spherical-error corollary means a ledger that uses it says
      nothing about the decision variant; mixing search-tagged and decision-tagged rungs in one
      verdict is a category error and the rung table keeps them separate.
    standardized_parameter_sets: >-
      ML-KEM-512, ML-KEM-768 and ML-KEM-1024 as standardized in FIPS 203. Affected-versus-safe
      scope - in the predicted outcome NO ML-KEM parameter set is affected by this chain, and that
      statement is scoped to this chain, this cost model, these declared constants and these sets. It
      is not a security argument for ML-KEM and must never be quoted as one.
  heuristic_under_test: HEUR-MK-1
  heuristic_under_test_note: >-
    HEUR-MK-1 (blow-up fidelity under CBD-to-Gaussian noise transfer) is the heuristic this contract
    schedules a validation arm for - an end-to-end execution of the reduction at reduced ring
    dimensions where it can be run in full, comparing the measured error-rate blow-up on CBD secrets
    against the corollary's stated factor. HEUR-MK-2 (estimator comparability) is CONTAINED rather
    than tested, by the estimator baseline fixture and by the requirement that the sign be stable
    across the swept range on NULL-2; a failure of either voids the estimator arm and that
    consequence is declared before the run.
  preregistered_prediction:
    quantity: >-
      Three quantities, fixed before any run exists. (1) log2 of the rung-one MLWE-to-RLWE
      error-rate blow-up at the ML-KEM-768 shape. (2) The ALIVE rung count per ML-KEM parameter set.
      (3) The signed blocksize difference at every alive rung of the budget-relaxed control.
    formula: >-
      The rung-one blow-up is the concrete prefactor of the MLWE-to-RLWE corollary evaluated at the
      free constant and smoothing parameter pinned by the declared negligibility level, with both
      pinning inequalities exhibited. THREE NAMED BRANCHES, each with a named consequence - the
      asymptotic-form value (the concrete constants are not load-bearing and the parent's arithmetic
      is wrong), the CONCRETE-CONSTANT value at plus or minus 0.3 bits (the prediction), and the
      superseded-wording value (the implementation read the superseded version). The ALIVE rung count
      is predicted EXACTLY 0 at every negligibility level, with and without the spherical column. The
      signed blocksize difference on the budget-relaxed control is predicted at least +1 unit at every
      alive rung. Under the null that the chain never pays, the difference is positive everywhere; the
      E2 alternative is a difference of zero or below at any alive rung.
    source: >-
      Pre-registered in the parent proposal IDEA-20260821-003cb0, predictions block, before any run
      under this contract exists. The parent's numeric values are PROPOSER ARITHMETIC on theorem text
      read from an ephemeral scratchpad; they are not measurements, they are the thing Stage 0
      recomputes, and any of them may be overturned there. The prediction is never adjusted after a
      run; a changed prediction goes through the amendment path.
  scale_relevance:
    tier: standardized
    justification: >-
      Stages 0 and 1 are evaluated DIRECTLY at the standardized FIPS 203 parameter sets - there is no
      scale gap at all, because the deliverable is arithmetic on the standard's own constants and on
      published theorem statements. The estimator arm inherits the estimator's own scale validity and
      is reported as a difference for exactly that reason. The one place a scale gap appears is the
      HEUR-MK-1 validation arm, which executes the reduction end to end at REDUCED ring dimensions
      where that is feasible; its transfer assumption - that a blow-up factor matching the corollary at
      small ring dimension also matches at the standardized one - is stated explicitly and is not used
      to support any ledger cell.
    correspondence: null
  tail_checks:
  - >-
    Report the residual budget at rung one to two decimals for every parameter set and negligibility
    level. A residual within 1 bit of zero is reported as MARGINAL, not as DEAD, because a closure
    resting on a sub-bit margin is not a closure.
  - >-
    Report the ledger at the CHAIN-FAVOURABLE corner (smallest admissible free constant, largest
    admissible smoothing parameter, spherical column excluded, single-shot descent). The predicted
    closure is claimed only if it survives that corner.
  - >-
    Report the sample count at which each rung's estimator optimum sits, and flag any rung whose
    optimum is at a boundary; a boundary optimum is not comparable to an interior one and its
    difference is reported separately.
  - >-
    On the budget-relaxed control, report the signed difference at all four swept modulus-to-noise
    values and state whether it is monotone in that coordinate. A non-monotone reading means the
    instrument is not responding to the parameter the whole control is built around.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      Stages 0 and 1 are deterministic and their three instances must agree bit-for-bit; any
      disagreement is an instrument defect. The seeds control the estimator's internal sampling where
      it has any and the ordering of the sweep, and every arm of a comparison uses the same seed.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6.0
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - >-
    HALT if the asymptotic-limit fixture fails. The transcription is wrong, every concrete-constant
    number is void, and that is the deliverable.
  - >-
    HALT the estimator arm if the estimator baseline fixture fails. Only Stages 0, 1 and 3's NULL-1
    are reportable, and this downgrade was declared before the run so it cannot be presented as a
    result.
  - >-
    HALT everything if NULL-1 emits more than one rung.
  - >-
    Do not run Stage 2 on ML-KEM if Stage 0 returns zero alive rungs there; run it on NULL-2 only, and
    say so.
  - >-
    Stop at the declared three negligibility levels, the declared descent targets and the declared four
    swept modulus-to-noise values. None is revised after seeing a ledger.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a
    negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion, network failure or dependency failure makes the run
    failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5). A failed
    re-fetch of the source is specifically named here as such - it means the constants were not
    verified, not that the chain is dead.
  - >-
    A run that quotes any constant from the informal abstract, from the superseded version, or from
    recall rather than from the current version's corollary text with a locator and version date, is
    invalid_measurement.
  - >-
    A run that instantiates the free constant favourably WITHOUT exhibiting the inequality that bounds
    it is invalid_measurement, because taking that constant to zero makes the source's own probability
    bound vacuous.
  - >-
    A run that charges the spherical-error column at a different sample count from the one the estimator
    optimised is invalid_measurement; the two must be optimised jointly.
  - >-
    A run that merges search-tagged and decision-tagged rungs into one verdict is invalid_measurement.
  - >-
    A run whose control arms were not executed in the same invocation as the signal arm is
    invalid_measurement.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new
    contract; it is never a repair of this one.
  success_criterion: >-
    ALL SIX of the following, each decidable from the primary and secondary metrics. (1) Both
    reproduction fixtures pass at their pre-declared tolerances. (2) null1_rung_count equals 1.
    (3) R_0, log2_rung_one_blowup, spherical_column_bits and the descent charge are emitted per
    parameter set at all three negligibility levels, each with its verbatim source string, locator and
    version date, and with both pinning inequalities exhibited. (4) The full rung table is emitted with
    every rung's status, hypotheses-hold flag and variant tag. (5) alive_rung_count is reported per
    parameter set per level, twice - with and without the spherical column. (6) signed_blocksize_
    difference is reported for every alive rung of NULL-2 at all four swept modulus-to-noise values,
    with the monotonicity stated. NOTE that success means THE LEDGER WAS BUILT; whether the hypothesis
    is supported is decided by the pre-registered prediction and the falsification criteria, and a
    completed run that overturns S2 is a successful run.
  falsification_criterion:
  - >-
    alive_rung_count is 1 or more on any ML-KEM parameter set at any declared negligibility level, with
    the asymptotic-limit fixture passing - S2 is FALSE, the chain re-opens, and Stage 2 must be run on
    ML-KEM itself.
  - >-
    signed_blocksize_difference is zero or below at any alive rung on ML-KEM itself - the headline
    prediction is FALSIFIED. This is the single most valuable outcome available and the correct response
    is escalation to independent review, not a louder claim.
  - >-
    log2_rung_one_blowup falls outside the concrete-constant branch by more than 0.3 bits while the
    asymptotic-limit fixture passes - the parent's arithmetic is wrong; the error is recorded and the
    corrected value reported.
  - >-
    Every alive NULL-2 rung shows a strictly positive difference AND the sign does not change across the
    swept range - the method is insensitive to the budget and NO scheme-specific conclusion may be
    reported. The ML-KEM verdict then carries no ML-KEM-specific content.
  - >-
    The asymptotic-limit fixture fails - the transcription is wrong and every concrete-constant number is
    void.
  - >-
    null1_rung_count is not 1 - the pipeline applies transformations without checking their hypotheses
    and no ledger it produced is reportable.
  - >-
    An estimator scoring ellipsoidal errors natively is available and reproduces the baseline fixture -
    the spherical column comes off the budget, the residual margin flips sign, and the chain must be
    re-scored against the first descent rather than declared dead.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block,
    the pinned estimator commit and cost model, and environment
  - >-
    raw-result.json carrying every per-rung value, not summaries
  - >-
    the verbatim quotation log - every transcribed theorem string with its locator and version date, and
    the content hash of the re-fetched source
  - >-
    both null arms' ledgers, in the same file as the signal arm
  - >-
    the two reproduction fixtures with their pre-declared tolerances and their pass/fail verdicts
  - >-
    the exhibited pinning inequalities for the free constant and the smoothing parameter at each
    negligibility level
  - >-
    the HEUR-MK-1 validation arm's measured blow-up at reduced ring dimensions, with its transfer
    assumption stated
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is
    null, execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's
    gate because it authorizes execution and spends compute.
  - >-
    The parent proposal is proof-oriented in part and carries a proof_search_map; it is inherited into
    H-MLKEM-4f752a and must be audited against KN-TECH-080 before implementation.
  - >-
    Stage 0 must be authorized and reported BEFORE Stage 2 is authorized, because if Stage 0 returns zero
    alive rungs on ML-KEM the estimator arm runs on the control only and its budget should be re-scoped.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260821-003cb0
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's mechanism, controls,
      required_metrics, predictions and falsification_conditions and restated as a contract. Boilerplate
      identical across contracts by program rule comes from a fixed table. Budgets come from the parent's
      declared estimated_cost (implementation low, compute low; the minimal test is one to two person-hours
      of arithmetic). NO NUMBER IS INVENTED - the parent's numeric values are deliberately NOT copied into
      this contract's parameter block, because they are proposer arithmetic on an ephemeral source and a
      transcription of a transcription is how a wrong number becomes load-bearing.
  derivation_gaps:
  - >-
    The three negligibility levels are described as declared but not enumerated here. They must be fixed
    in Stage 0 before any number is quoted, because a level chosen after seeing a residual budget sets the
    verdict.
  - >-
    The multiply-or-replace reading of the spherical-error column is an OPEN READING QUESTION. Stage 0
    must settle it from the corollary's own statement rather than the surrounding prose, and until it is
    settled the ledger total is a RANGE, not a number. A Coordinator may wish to require the reading be
    settled and recorded in an amendment before Stage 2 is authorized.
  - >-
    Whether the ledger is computed for the CBD instance or for the Gaussian instance of matched standard
    deviation is not fixed here. Stage 0 must record which, and the choice changes what HEUR-MK-1 is
    asserting.
  - >-
    The estimator's pinned commit and cost model are not named in this contract. They must be pinned before
    approval, since a different pinning is a different experiment and the difference-only reporting does
    not protect against a model whose error depends on log q.
  - >-
    The tolerance for the estimator baseline fixture is required to be declared before the run but is not
    supplied here. It must be set in an amendment or at approval, never after the fixture is evaluated.
