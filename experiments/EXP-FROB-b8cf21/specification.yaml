    "methods": {
      "group_enumeration": "Enumerate <P> by repeated addition; all scalar labels are calibration truth, with setup charged. They are used only for checks and the public automorphism eigenvalue, never to manufacture relation rows or choose covers. Verify every emitted relation using independent point addition.",
      "incidence": "For each cover C and union B, enumerate every ordered pair (Q1,Q2) in B^2. Compute Q3=-(Q1+Q2); accept only if Q3 in B and all three are nonzero. Retain multiplicities in raw attempts; normalize a relation only for linear algebra by sorting the signed point multiset and combining equal coefficients. Repetitions are permitted. A same-base row is one whose three points all belong to at least one common B_h in C; all other accepted rows are mixed. Record rejected pairs too via complete indexed attempt table.",
      "quotient": "Build two row presentations: negation-only on object and null, and Frobenius-plus-negation on object only. For each Q choose least representative Q0 in {epsilon*pi^k(Q)} and exact multiplier a=epsilon*mu^k with Q=[a]Q0; verify equality directly. Use these multipliers in relation coefficient columns over F_N. Include no target-log or hidden-scalar column. Null uses only +/- weights over F_Nprime. Record rank of all rows and rank of the same-base subset in identical union columns.",
      "primary_quantity": "Delta_rank(C)=rank(R_all(C))-rank(R_same(C)) in the actual lawful orbit quotient for that arm. Also report U(C), rank deficit U-rank, and exact added pivot witnesses; positive Delta means new mixed-incidence span at fixed union columns, not a pipeline speedup. Cross-arm comparison additionally uses the negation-only presentation, where columns have matching cardinality, and reports all values without an unsupported normalization into an attack ratio.",
      "known_false_controls": "For each nonzero reduced row r, insert r and mu^k*r for k=0..n-1; incremental rank after first is exactly0. For zero rows rank remains0. Deliberately alter one point coefficient in a checked relation; accept only if independent group verification still holds, otherwise reject it. If an altered row accidentally remains valid, retain it as such and use the fixed synthetic inconsistent row [1] on a known nonzero generator to guarantee a rejection control.",
      "baseline_control": "t=1 implies R_all=R_same and Delta_rank=0 exactly. Negation-only and Frobenius quotients preserve evaluation of every relation against known calibration logs. The public coordinate-subspace dimension is never substituted for group-row rank.",
