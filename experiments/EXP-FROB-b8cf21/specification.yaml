      "field_representation": "F_q[z]/f(z), using lexicographically first monic irreducible polynomial of degree n ordered by coefficient tuple (constant first); q prime. Encode field elements by integer sum a_i*q^i, compare points lexicographically by encoded x,y.",
      "object_selection": "Enumerate (A,B) in {0,...,q-1}^2 lexicographically, excluding discriminant0 and supersingular curves (trace q+1-#E(F_q) divisible by q). For E:y^2=x^3+A*x+B compute exact #E(F_(q^n)). Select the largest prime divisor N>=17 such that N does not divide #E(F_q), N occurs to exponent1 in the extension group order, and a generator P is obtained by scanning lexicographic affine points and choosing the first whose cofactor-cleared point is nonzero, then independently verifying orderN. Verify pi(P)=[mu]P by a charged exhaustive lookup and ord_N(mu)=n. Select the first TWO distinct j-invariants passing all tests per field cell. Retain every rejected candidate and reason; exhausting the finite q^2 pool leaves the cell ineligible, never a negative scientific result. Before accepting a curve, generate declared module candidates and require TWO distinct nonempty candidate point sets, each of size>=2*n, with union at least two Frobenius-plus-negation orbits. This preregistered eligibility condition is independent of any measured rank signal. Retain structural rejections.",
      "module_candidates": "Compute the F_q-linear Frobenius matrix pi on the polynomial basis. Factor T^n-1 exactly. For every monic product h of distinct irreducible factors with degree1 or2, form V_h=ker h(pi). Sort h by degree then coefficient tuple; certify dim V_h=deg h and invariance. Define B_h={Q in <P>{O}: x(Q) in V_h}. Include all candidates, including empty and identical bases; report duplicate point sets once with all originating h labels.",
      "covers": "Enumerate all subsets of 1,2,3 distinct nonempty point-set candidates. Fix ordering by candidate h tuple. No learned subset selection; report every cover. A cover with fewer than2 distinct bases is the exact t=1 baseline only.",
