experiment:
  id: EXP-EWALK-18e4d4
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-cbbcfd
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE CONTROL THE WHOLE LANE IS UNINTERPRETABLE WITHOUT: at toy scale the quotient walk''s
    functional graph is small enough to ENUMERATE EXACTLY, so the expected rho length, the useful-collision
    fraction and the effective per-solve constant can be computed with ZERO sampling error over all
    starting classes -- turning "is the measured speedup really sqrt(|Aut|)?" from a statistics question
    into an arithmetic one, with the unquotiented walk on identical seeds as the null, a matched random-function
    null band, and |Aut| in {2, 4, 6} as a dose-response ladder whose predicted ratios 1.000 / 1.414
    / 1.732 are exactly computable in advance'
  status: draft
  objective: "(A) THE PROBLEM THIS SOLVES, AND IT IS THE LANE'S BINDING CONSTRAINT. Every other L6\
    \ proposal reports a ratio of two heavy-tailed random variables. The rho length distribution has\
    \ a heavy tail, so 16 or even 200 sampled runs give wide intervals: the audited staged artifact\
    \ inputs/h100_session/h040_rho_const.json reports negation-arm 95 percent intervals of [0.877,\
    \ 1.023] at 16 bits and [0.873, 1.014] at 18 bits from 200 runs each -- intervals of width about\
    \ 0.15 around a quantity whose predicted value is 0.886, straddling 1.0. At that resolution one\
    \ cannot distinguish \"the quotient achieves sqrt(2)\" from \"the quotient achieves 1.19\" from\
    \ \"the quotient loses\". EXP-RHO-60da4f budgets 240 CPU-hours and 16 seeds per cell against this\
    \ same variance. THE VARIANCE IS AVOIDABLE AT TOY SCALE, and avoiding it is what this proposal\
    \ does.\n(B) THE INSTRUMENT. For p up to about 2^20 the class set G/Aut has at most about 5*10^5\
    \ elements. The quotient walk is a DETERMINISTIC MAP on that finite set, so its entire functional\
    \ graph can be built in O(M) time and memory and then analysed exactly:\n  - rho length from every\
    \ starting class v: tail(v) + cycle(v), computed\n    for all v in one pass by iterative tail-length\
    \ propagation over the\n    functional graph (each node has out-degree 1, so the graph is a forest\n\
    \    of trees hanging off cycles);\n  - EXPECTED rho length rhobar = (1/M) * sum_v (tail(v) +\
    \ cycle(v)), with\n    NO sampling error whatsoever;\n  - the empirical collision constant rhobar\
    \ / sqrt(M), compared against the\n    ideal 1.2533;\n  - the full structural census: number of\
    \ components, number of fixed\n    points, number of 2-cycles, number of cyclic nodes, maximum\
    \ cycle\n    length, largest component size;\n  - the USEFUL-COLLISION FRACTION: the fraction\
    \ of collisions that yield an\n    invertible relation (b_i != b_j mod N) rather than a degenerate\
    \ one,\n    computed over all starting classes;\n  - the EFFECTIVE PER-SOLVE CONSTANT: expected\
    \ total steps divided by the\n    expected number of useful collisions, which is the only honest\
    \ headline\n    number and is what h041 called effective_const_per_solve.\nThis is not a new idea\
    \ in general -- inputs/h100_session/h041_xonly_walk.json already performed exactly this census\
    \ for one x-only construction, and REVIEW-H100-20260717 correction C8 independently re-verified\
    \ its numbers. What is proposed is to make it THE LANE'S STANDARD INSTRUMENT, extend it from x-only\
    \ to genuine Aut-classes at |Aut| in {2, 4, 6}, and attach the null and dose-response design below.\n\
    (C) THE NULL, AND ITS DECAY PARAMETER. Two nulls, both mandatory:\n  (N1) THE UNQUOTIENTED WALK\
    \ ON IDENTICAL SEEDS. Same curve, same step\n    table T_s, same partition function, same starting\
    \ classes lifted to\n    points; the walk runs on G instead of G/Aut. Its functional graph is\n\
    \    enumerated by the identical code path. Every reported gain is\n    rhobar(unquotiented) /\
    \ rhobar(quotient) measured in the same run.\n  (N2) THE MATCHED RANDOM-FUNCTION NULL BAND. Draw\
    \ uniformly random\n    functions on a set of the SAME SIZE M and enumerate their functional\n\
    \    graphs by the identical code. This gives an empirical band for every\n    structural statistic\
    \ under the ideal random-map hypothesis. h041's\n    design used 50 draws and its bands are informative:\
    \ at M = 21896 the\n    random-function band for the 2-cycle count was [0, 2] with mean 0.32,\n\
    \    while the x-only walk had 239-293, and the band for the largest\n    component was [8525,\
    \ 21860] with mean 16366 against the x-only walk's\n    1806-3491. THOSE ARE THE NUMBERS THAT\
    \ SHOW A QUOTIENT WALK IS NOT A\n    RANDOM MAP, and they are the template for this instrument's\
    \ null.\n  THE DECAY PARAMETER IS |Aut|. The predicted ratio rhobar(unquotiented) /\n  rhobar(quotient)\
    \ is exactly sqrt(|Aut|) under the ideal-map hypothesis:\n  1.4142 / 2.0000 / 2.4495 at |Aut|\
    \ = 2 / 4 / 6, i.e. residual headroom\n  1.000 / 1.414 / 1.732 against the program's already-negation-discounted\n\
    \  baseline (IDEA-20260807-ebcae6). A measured gain that does NOT MOVE when\n  |Aut| moves is\
    \ the canonical artifact tell of\n  docs/inventor-protocol.md section 3, and it is the single\
    \ most likely way\n  this lane produces a false result.\n\n(D) THE POSITIVE CONTROL, IN BOTH DIRECTIONS,\
    \ WHICH IS WHAT L14 REQUIRES.\n  (P1) KNOWN-ANSWER DETECTION. On a curve with |Aut| verified equal\
    \ to 6,\n    the instrument must MEASURE a quotient-set size of exactly\n    (N-1)/6 + 1 and an\
    \ ideal-map prediction of 1.2533*sqrt(N/6). An\n    instrument that cannot count the class set\
    \ correctly cannot measure a\n    speedup on it. This is trivial and it is exactly the kind of\
    \ check\n    whose absence produces the x-coordinate identifiability failure named\n    in IDEA-20260807-ebcae6's\
    \ observation_collision: in x-coordinates the\n    |Aut| = 4 orbit has size 2, so an x-only instrument\
    \ silently reports\n    j = 1728 curves as |Aut| = 2. CLASSES ARE COUNTED IN POINTS.\n  (P2) PLANTED-GAIN\
    \ DETECTION. Build a SYNTHETIC quotient with a chosen\n    orbit size m in {2, 3, 4, 5, 6, 8,\
    \ 12} by partitioning G into m-element\n    cells using a fixed group-theoretic device that is\
    \ NOT an automorphism\n    -- specifically the cosets of a subgroup of a DIFFERENT group of the\n\
    \    same size, realised as a relabelling -- and run the identical\n    enumeration. The instrument\
    \ must recover a gain of sqrt(m) on this\n    object across the whole ladder, including values\
    \ of m that no real\n    curve has. If it recovers sqrt(m) at m = 3, 5, 8, 12 -- where no\n  \
    \  automorphism group exists -- then the instrument is measuring SET SIZE,\n    which is exactly\
    \ what it should measure, and its readings on real\n    curves are trustworthy. If it does not,\
    \ every negative it produces is\n    void, which is instrument failure and not a mathematical\
    \ result.\n  (P3) PLANTED-NULL DETECTION. Run the identical pipeline on the SHAM\n    QUOTIENT:\
    \ the same code path with canon replaced by a non-group\n    involution of the encoding. This\
    \ has the quotient's cost profile and\n    none of its content, so it must show gain 1.0 and a\
    \ useful-collision\n    fraction near zero.\n\n(E) WHAT THIS FILLS THAT IS CURRENTLY EMPTY. H-ENDO-001's\
    \ prediction 4 is \"Measured Pollard rho cost on j = 0 and j = 1728 curves lies within 20 percent\
    \ of 0.886*sqrt(N/|Aut|)\" and its own basis note says \"this campaign has never measured it\"\
    . EV-ENDO-001 records that EXP-ENDO-001 produced ZERO RUNS and states so explicitly rather than\
    \ leaving the list empty. So the program has an approved prediction about the |Aut| in {4, 6}\
    \ rho constant and no measurement of it at all. This instrument closes that gap exactly, at a\
    \ compute cost of minutes rather than the 240 CPU-hours a sampling approach would need, because\
    \ enumeration replaces replication.\n(F) THE TWO OUTCOMES.\n  OUTCOME 1 -- the enumerated ratios\
    \ track sqrt(|Aut|) from below, the\n    structural census sits outside the random-function band\
    \ in the\n    directions h041 already showed (excess 2-cycles, fragmented components),\n    and\
    \ the effective per-solve constant is materially worse than the ideal\n    because of degenerate\
    \ collisions. Then the lane's ceiling is confirmed\n    exactly, the shortfall is quantified with\
    \ no sampling error, and every\n    other L6 measurement has a reference to be read against.\n\
    \  OUTCOME 2 -- the enumerated ratios do NOT track sqrt(|Aut|). Then either\n    the class counting\
    \ is wrong (checked by P1), the instrument is broken\n    (checked by P2/P3), or the ideal-map\
    \ hypothesis fails badly enough on\n    quotient walks that the sqrt(|Aut|) prediction does not\
    \ describe them\n    at all -- which would be a substantive finding about the folklore\n    constant\
    \ and would need independent review."
  resource_label: 'audit: consumes no resource. This proposal measures instruments, not curves. It
    touches R3 only in the sense that the objects it measures are Aut-quotients, and it makes no claim
    that depends on any non-generic structure.'
  admissibility: inadmissible_generic_group
  admissibility_argument: 'THE OBJECTS MEASURED ARE INADMISSIBLE AND THE MEASUREMENT MAKES NO ADMISSIBILITY
    CLAIM OF ITS OWN. Every walk enumerated here is an Aut-quotient rho walk, which applies automorphisms
    to points of a prime-order G and is therefore Oracle D of KN-FIND-b7e091: generic-group simulable,
    closed at exponent 1/2 (KN-TECH-005, H-ENDO-001). The instrument itself is an offline analysis
    of a finite deterministic map and could not be an attack in any model. It is filed as `inadmissible_generic_group`
    because labelling it otherwise would suggest the lane had found an escape, and it has not. The
    instrument''s value is that it makes the closed family''s exact constant measurable, which is
    the lane''s stated purpose.'
  reachability_gate: DOES NOT MOVE BETWEEN CURVES; it CONSTRUCTS them. The J1728 and J0 arms are generated
    directly by rejection sampling on p mod 4 and p mod 3 with b = 0 or a = 0, at O(1) cost per candidate
    at toy size. That is legitimate for calibrating a constant and illegitimate as a model of attacker
    capability, because by T4 the isogeny class fixes D_0 and an attacker facing a target with generic
    D_0 cannot reach a larger-|Aut| curve by any isogeny walk at any cost -- no such curve exists
    in the class. The instrument therefore measures a property of curve families, never a route from
    one family to another, and the reference table must be read that way.
  inputs:
    procedure: 'STAGE 0 (minutes): build the class set on one 14-bit curve of each family; verify
      Aut order, orbit sizes, class count, and the POINT-based class identifier. This alone catches
      the x-coordinate identifiability failure and costs almost nothing. STAGE 1 (minutes, HARD GATE):
      planted ladder (P2) at m in {2, 3, 4, 5, 6, 8, 12} on a synthetic set; require sqrt(m) recovery
      within 5 percent. IF THIS FAILS, EVERYTHING DOWNSTREAM IN LANE L6 IS UNINTERPRETABLE AND THE
      LANE STOPS UNTIL IT PASSES. STAGE 2 (minutes): sham-quotient null (P3); require gain 1.0. STAGE
      3 (minutes to hours): full enumeration on GEN / J1728 / J0 at 14, 16, 18, 20 bits, with the
      unquotiented arm and 50 random-function draws per size, for r in {4, 20} and escape rules in
      {none, one simple memoryless rule}. STAGE 4 (minutes): publish the reference table. THIS IS
      THE CHEAPEST VALID DISCRIMINATOR IN THE ENTIRE LANE. Stage 1 alone -- an afternoon, no curve
      arithmetic at all -- decides whether any L6 number can be believed, and Stages 0-3 together
      cost minutes of compute where the sampling alternative costs hundreds of CPU-hours and still
      cannot resolve a 15-percent effect.'
    mechanism: 'STEP 1 -- BUILD THE CLASS SET CORRECTLY. Enumerate G explicitly at toy size; verify
      N is prime and the subgroup order; enumerate Aut_{F_p}(E) by explicit map construction and order
      check, NOT by reading j; partition G \ {O} into Aut-orbits and verify every orbit has size exactly
      |Aut| (which is Lemma 2 of IDEA-20260807-ebcae6, here checked rather than assumed); assign each
      class its canonical representative in POINT coordinates.

      STEP 2 -- BUILD THE FUNCTIONAL GRAPH. Apply the step map once to every class; store the single
      out-edge. O(M) time, O(M) memory.

      STEP 3 -- ENUMERATE EXACTLY. One pass to find all cycles (each node has out-degree 1); one reverse-BFS
      pass to assign tail lengths; accumulate rhobar, the cycle-length spectrum, component sizes,
      fixed points, 2-cycles and cyclic-node count. Compute the useful-collision fraction by, for
      each starting class, determining whether the collision it reaches yields an invertible relation.

      STEP 4 -- RUN BOTH NULLS. The unquotiented arm through the identical code at set size N; and
      50 or more uniformly random functions on a set of size M, giving empirical bands for every statistic.
      Report every measured statistic together with whether it lies inside its band, exactly as h041''s
      `ec_all_within_minmax` flags do.

      STEP 5 -- RUN THE POSITIVE CONTROLS. (P1) class-count known-answer check; (P2) planted synthetic
      quotients at m in {2, 3, 4, 5, 6, 8, 12}, requiring recovery of sqrt(m); (P3) sham quotient,
      requiring gain 1.0.

      STEP 6 -- PUBLISH THE REFERENCE TABLE. For each (curve family, |Aut|, r, escape rule): M, rhobar,
      rhobar/sqrt(M), the gain against the unquotiented arm, the useful fraction, the effective per-solve
      constant, and the band-membership flags. THIS TABLE IS THE DELIVERABLE. Every other L6 measurement
      is read against it, and any sampling-based measurement that disagrees with the enumerated value
      at a size where both are computable is an instrument failure in the sampler.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - matched-seed unquotiented arm through the identical code path (blocking)
  - 50+ uniformly random functions on a set of the same size (blocking)
  - planted synthetic-orbit ladder requiring sqrt(m) recovery (blocking)
  - sham quotient requiring gain 1.0 (blocking)
  - explicit Aut enumeration and orbit-size verification
  - class identity in POINT coordinates, verified against an x-only identifier to demonstrate the
    |Aut| = 4 collapse concretely
  - 'NULL OBJECT (from the proposal): THIS PROPOSAL IS ITSELF A NULL-CONTROL DESIGN, and it still
    carries its own. THE PRIMARY NULL: the matched-seed unquotiented walk, same curve, same table,
    same partition, same code path, enumerated exactly. THE DECAY PARAMETER IS |Aut|: the measured
    gain must move as 1.414 -> 2.000 -> 2.449 when |Aut| moves 2 -> 4 -> 6, and a gain that fails
    to move when |Aut| moves is the canonical artifact tell. THE SECONDARY NULL: 50+ uniformly random
    functions on a set of the same size M, giving a band for every structural statistic; the quotient
    walk is expected to sit OUTSIDE that band on 2-cycle count and component structure -- h041 measured
    239-293 two-cycles against a random band of [0, 2], and largest components of 1806-3491 against
    a random mean of 16366 -- and INSIDE it on fixed-point count. THE INSTRUMENT''S OWN NULL: the
    sham quotient (P3), which must show gain 1.0. THE INSTRUMENT''S OWN POSITIVE: the planted ladder
    (P2), which must recover sqrt(m) at orbit sizes no curve has.'
  independent_variables: []
  metrics:
    primary:
    - M (class-set size), verified against (N-1)/|Aut| + 1
    - rhobar, exactly, and rhobar/sqrt(M)
    - gain against the unquotiented arm, exactly
    - component count, fixed points, 2-cycles, cyclic nodes, max cycle length, largest component,
      each with its random-function band and an inside/outside flag
    secondary:
    - full cycle-length spectrum
    - useful-collision fraction and effective per-solve constant
    - planted-ladder recovered gains at every m
    - sham-quotient gain and useful fraction
    - peak memory and wall clock per enumeration (feasibility bookkeeping)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: enumerated gain rhobar(unquotiented)/rhobar(quotient), as |Aut| varies over {2, 4, 6}
    formula: 'Must TRACK sqrt(|Aut|) = 1.4142 / 2.0000 / 2.4495 from below, with the ordering strict:
      gain(6) > gain(4) > gain(2). A non-monotone or flat sequence is the artifact tell and voids
      every L6 measurement read against it until explained.'
    source: pre-registered in IDEA-20260807-cbbcfd before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SMALL-M STRUCTURE. At M ~ 2^13 the random-mapping statistics themselves have large relative fluctuation,
    so the null bands are wide and the comparison is weak. Four sizes are the minimum and the size
    dependence of every statistic must be reported, not averaged.
  - CLASS-IDENTIFIER CHOICE. x-only versus point identifiers change |Aut| = 4 into orbit size 2. The
    experiment measures BOTH deliberately and reports the discrepancy as a demonstration rather than
    discovering it as a bug.
  - ESCAPE-RULE INTERACTION. An escape rule changes the map and therefore the graph; the census must
    be reported per escape rule and never pooled.
  - ENUMERATION IS NOT SAMPLING. The enumerated rhobar averages over ALL starting classes with equal
    weight, whereas a real parallel rho starts from randomly chosen points and stops at distinguished
    points. The two quantities are related but not identical, and the reference table must state which
    it reports. Treating the enumerated rhobar as a prediction of a distinguished-point run's cost
    without that caveat would be the instrument's own way of producing a false number.
  - USEFUL-COLLISION DEFINITION. "Useful" must mean an invertible relation (b_i != b_j mod N) verified
    by recomputing k and checking [k]P = Q (docs/claims-and-verification.md, with harness/toycurve.py
    as the independent verifier), not merely a repeated class.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'Must TRACK sqrt(|Aut|) = 1.4142 / 2.0000 / 2.4495 from below, with the ordering
    strict: gain(6) > gain(4) > gain(2). A non-monotone or flat sequence is the artifact tell and
    voids every L6 measurement read against it until explained.'
  falsification_criterion:
  - The planted ladder does not recover sqrt(m). Instrument failure; no L6 measurement may be interpreted
    until it does. This is the single most important gate in the lane.
  - The sham quotient shows a gain above 1.05. The harness credits plumbing.
  - M does not equal (N-1)/|Aut| + 1. Class construction is wrong; every downstream number is void.
  - The enumerated gain fails to track |Aut| monotonically with all controls passing. Either the ideal-map
    hypothesis fails badly on quotient walks -- a substantive finding requiring independent review
    -- or there is a defect not caught by the controls, and the record must say which before reporting
    either.
  - Enumeration exceeds memory at the target sizes. INFRASTRUCTURE outcome under AGENTS.md rule 5;
    report the largest size reached and never extrapolate across the gap.
  - The random-function null band is degenerate (zero width) because too few draws were taken. Design
    failure, not a result; increase the draws.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
