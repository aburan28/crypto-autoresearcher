    coordination/goals/GOAL-SSI-001/batches/BATCH-284f63/tasks/TASK-20260806-55cf1f/repair_report.md,
    which is the authoritative derivation; this field only indexes it.
  repair_provenance:
    repaired_from: EXP-SSI-697354
    rejecting_decision: DEC-20260806-a00a28
    red_team_finding: EV-SSI-455241
    repair_task: TASK-20260806-55cf1f
    fixes:
      - id: FIX-1-ANCHOR
        summary: >-
          MC_P13's assessed-method vOW law did not reduce to T_full at w = M
          (OBJ-1/OBJ-2, 0.5*L_mem(P) bits attacker-favourable). Replaced by a
          formula DERIVED INSIDE THIS CONTRACT (not imported from
          experiments/EXP-WESOVOW-001/cost_model.py), named MC_P13_CORRECTED,
          which charges the square root of a memory RATIO rather than a raw
          count and is proved to reduce to T_full exactly at w = M.
        proof_location: repair_report.md section "Fix 1"
      - id: FIX-2-REPRODUCTION-GATE
        summary: >-
          RG-1..RG-5 recomputed from MC_P13_CORRECTED under the gate's own
          declared configuration (log2 p = 256, unbounded memory represented
          as log2_w = 1000, memoryless baseline, c = 0). The resulting bands
          are shown to be a mathematical CONSEQUENCE of the corrected
          formula's boundary behaviour, not a copied number.
        proof_location: repair_report.md section "Fix 2"
      - id: FIX-3-BINDING-DEFECT
        summary: >-
          Added BOUNDARY-CONDITION-GATE (control, mandatory, blocking): an
          absolute-value check at the exact anchor point w = M, proven capable
          of returning a negative by running EXP-SSI-697354's own superseded
          formula through the identical check (residual 0.5*L_mem(P) bits,
          e.g. 46.25 at NIST-I) alongside the corrected formula (residual
          exactly 0.0). Both computations shown by hand.
        proof_location: repair_report.md section "Fix 3"
      - id: FIX-4-MECHANICAL
        summary: >-
          re and ast added to stdlib_modules_permitted. The 14-value w grid,
          previously only at H-SSI-7fe2bf line 500, is now a literal field
          (memory_grid.w_grid_log2) in this frozen specification.
        proof_location: repair_report.md section "Fix 4"

  title: >-
    The Wesolowski crossover locus p*(w) from committed numbers only, REPAIRED:
    a correctly-anchored vOW time-memory law that satisfies its own boundary
    condition at w = M, a reproduction gate whose band is a consequence of
    that law, and a control proven able to return a negative about the
    mathematical object -- successor to EXP-SSI-697354

  objective: >-
    Convert the INCONCLUSIVE scalar NIST-I margin into a decidable
    practitioner-facing object - the locus p*(w) where the corrected
    p^{1/3+o(1)} cost curve crosses the matched Delfs-Galbraith / previous-methods
    p^{1/2} curve as a function of available memory w - using arithmetic on
    already-committed numbers and nothing else, and determine exactly what would
    have to be true for that locus to be wrong. Secondary and equally binding:
    determine whether the sign of the comparison is controlled by the corrected
    estimator or by an unstated memory-charging convention. UNCHANGED from
    EXP-SSI-697354's objective; this contract repairs HOW the objective is
    pursued, not WHAT is pursued.

  what_this_is_not:
    - >-
      NOT AN EXECUTED ATTACK. No isogeny, no curve, no field element, no walk, no
      table is constructed at any scale. Nothing is solved. There is no
      certificate because there is nothing to certify (docs/claims-and-verification.md,
      certificate kind `none`).
    - >-
      NOT A SECURITY CLAIM. This contract may not assert, and no artifact
      produced under it may assert, that SQIsign is broken, weakened, or that any
      parameter set is unsafe. It costs a MODEL.
    - >-
      NOT CRYPTO-SCALE VALIDATION. The load-bearing measured input tops out at
      p = 2^40. Every emitted number at log2 p in [256, 768] is an extrapolation
      of a medium-tier measurement (AGENTS.md rule 7).
    - >-
      NOT A VALIDATION OF HEURISTIC 1, and not a substitute for the NC-3/NC-6
      pairing that EV-WESO-b6ceff records as failed_infrastructure and
      KN-FIND-d1c853 records as the dominant open uncertainty.
    - >-
      NOT A NEW ALGORITHM, cost reduction, or improvement on any axis. sota_delta
      on every attack axis is exactly zero.
    - >-
      NOT A RESOLUTION of which memory-charging convention is physically correct.
      MC_VOW's own misattribution critique (EV-SSI-455241) is carried as a caveat
      and NOT repaired here -- out of this task's scope. The contract makes both
      conventions' dependence explicit and carries both, per H-SSI-7fe2bf's H2.
    - >-
      NOT A REPAIR of experiments/EXP-WESOVOW-001/cost_model.py itself. That is a
      separate committed record with the same class of defect and needs its own
      superseding experiment under whichever goal owns it
      (DEC-20260806-a00a28.corrections_owed_not_made); explicitly out of this
      task's write_scope and not attempted here.

  claim_ceiling:
    tier: medium
    mechanical_basis: >-
      docs/claims-and-verification.md derives the tier from the parameters of the
      runs that support the record. The load-bearing measured input (T1) covers
      log2 p in [9, 40]; 32 < 40 <= 96, so the ceiling is `medium`.
    strongest_admissible_sentence: >-
      "Under the committed inputs T1 and T2, conditional on Heuristic 1 and on
      HEUR-XO-1..3, and at memory budget w, the corrected cost model
      (MC_P13_CORRECTED, which satisfies T_A(P, M) = T_full(P) exactly) places
      the assessed method's crossing against the matched baseline at <locus or
      categorical label>, with the tested band; the sign of the comparison is
      controlled by the memory-charging convention; and the assessed method
      requires 2^{L_mem} table entries, which exceeds all recorded global storage
      at every tested parameter set."
    forbidden_sentences:
      - Any sentence asserting SQIsign, or any SQIsign parameter set, is broken, weakened, or unsafe.
      - Any sentence stating a cost number without its memory requirement and its conditionality in the same sentence.
      - >-
        The unqualified sentence "NIST-III/V retain margin". It is true only on
        the memory-feasibility axis (SCOPE-C) and false on the advantage and
        target-gap axes (SCOPE-A, SCOPE-B) under the committed table -- and the
        SCOPE-B gap GROWS with level (9.5387 / 21.9537 / 38.8387 bits at
        NIST-I/III/V per DEC-20260806-a00a28). Every use must name the axis.
      - Any presentation of the scenario-grid spread as a confidence interval or error bar.
      - Any p* value outside [256, 768].
      - >-
        Any citation of IDEA-20260806-62ba9d's withdrawn quantitative figures
        (1.585-2.585 bits, 32-43% sota_delta) as if they were live. DEC-20260806-a00a28
        withdrew them; only its structural observation (Section 4.1 prices
        OneEnd, not Isogeny) survives, and this contract does not need or cite
        even that.

  # =====================================================================
  # DEPENDENCY CONTRACT - checked, not assumed (Fix 4)
