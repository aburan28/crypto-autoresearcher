  supersedes: EXP-SSI-697354
  supersession_note: >-
    EXP-SSI-697354 was rejected by DEC-20260806-a00a28 on independent red-team
    review (EV-SSI-455241) for two blocking grounds. This is a NEW record, not
    an edit -- EXP-SSI-697354 remains immutable and frozen. Every difference
