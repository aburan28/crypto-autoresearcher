    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/raw-result.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/p_star_table.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/reproduction_gate.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/boundary_condition_gate.json (NEW, Fix 3: BCG-1 and BCG-2 residuals)
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/null_object.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/monotonicity.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/undefined_segments.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/scope_statement.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/sensitivity.json (L5, log2 k_DG, adversarial corner + MC_VOW comparison, SANITY-1)
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/cross_check_secondary.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/input_hashes.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/environment.json
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/stdout.txt
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/stderr.txt
    - experiments/EXP-SSI-9b542d/runs/RUN-SSI-9b542d-a/execution_report.yaml
    - A Coordinator snapshot archive of the above BEFORE independent review, then Validator and Red Team reports, then a ledger archive.

  certificate:
    kind: none
    reason: >-
      No solve and no relation is claimed, so there is nothing to certify
      (docs/claims-and-verification.md). The integrity analogue here is the input
      hash binding plus XCHK-1 plus BOUNDARY-CONDITION-GATE, all mandatory.

  review_requirements:
    - Independent Validator: re-derive RG-1..RG-5 AND BCG-1/BCG-2 from T1, T2, and this specification's own formulas, by an independently written implementation, without reference to the Executor's code.
    - Independent Validator: confirm every control in `controls` is capable of returning a negative, naming the concrete input that would make it do so (for BOUNDARY-CONDITION-GATE, verify the BCG-2 negative-control computation independently rather than trusting the Executor's reported residual).
    - Independent Red Team: recompute the w=M boundary condition directly from the formula text in this specification (not from repair_report.md's numbers) and confirm it is exactly 0 for MC_P13_CORRECTED and exactly 0.5*L_mem(P) for MC_P13_SUPERSEDED_do_not_use.
    - Independent Red Team: attack the memory-charging convention treatment, the S_struct declared-input honesty flag, the carried (unrepaired) MC_VOW misattribution caveat, and whether any emitted sentence licenses a security claim the model cannot support.
    - Independent Red Team: verify the dependency claim by inspection - the primary path must be stdlib-only, and re/ast usage must be confined to parsing, never to any reported number's arithmetic.

  assigned_to: executor

  provenance_and_scope_notes:
    read_scope_extensions_declared:
      - >-
