  dependency_contract:
    primary_path_requires: ["python3 >= 3.9 standard library only"]
    stdlib_modules_permitted: [math, json, os, sys, time, hashlib, statistics, platform, importlib, re, ast]
    stdlib_addition_rationale: >-
      re and ast added per DEC-20260806-a00a28 next_action (d) and
      EV-SSI-455241's RUNNABILITY finding, which named two mandatory parsing
      steps that need them: (a) regex extraction of the three numeric columns
      from the five bullet lines of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      lines 234-238 for the T2 transcription check; (b) reading the OVERHEAD_C
      and PAPER_PAIRS literals out of
      coordination/tasks/TASK-20260724-P13-VAL/repro/experiments/EXP-P13VOW-001/cost_model.py
      as TEXT via ast.literal_eval, rather than importing that module (which
      pulls in numpy, forbidden on the primary path).
    optional_permitted: >-
      numpy, and ONLY for the optional secondary cross-check XCHK-2. No reported
      number, no gate verdict, and no artifact field outside
      cross_check_secondary.json may depend on numpy. If numpy is absent, XCHK-2
      is recorded NOT_RUN with the ImportError text and the run remains valid.
    forbidden: [sagemath, sage, g6k, fpylll, scipy, mpmath, network access]
    rationale: >-
      Carried unchanged from EXP-SSI-697354. requirements-dev.txt pins only
      PyYAML, sympy and pytest - numpy is not a declared harness dependency, and
      sympy is DECLARED but EV-SSI-455241's dispatcher_verification found it
      actually ABSENT (import raises ModuleNotFoundError) alongside numpy. The
      contract resolves the disagreement by making the primary path stdlib-only,
      unaffected by either package's presence or absence.
    dependency_verification_this_task: >-
      This task's tool surface (Read, Grep, Glob, Write, Edit) has NO code
      execution capability, so "attempt the import" could not be done
      first-hand in this session; that limitation is stated rather than
      papered over (AGENTS.md rule 9). Instead: (1) re, ast, math, json, os,
      sys, time, hashlib, statistics, platform, importlib are CPython standard
      library, a language-specification guarantee categorically different from
      the numpy/sympy question; (2) src/crypto_autoresearcher/runner.py (the
      harness's own run wrapper, exercised by every executed run record in this
      repository including EXP-WESOVOW-001's RUN-WESOVOW-001) imports re at its
      own line 8; tools/allocate_id.py and tools/validate_ledger.py, exercised
      by CI on every commit, import re; ast is imported by three already-executed
      committed experiment implementations
      (experiments/EXP-SGCP-EMBED-001/src/verify_sgcp_embed.py,
      experiments/EXP-ECDLP-TT-SOURCE-COMPILER-001/src/audit_tt_source_closure.py,
      experiments/EXP-ECDLP-TT-NORM-RANK-001/src/verify_tt_norm_rank.py); (3)
      EV-SSI-455241.dispatcher_verification recorded an ACTUAL EXECUTED import
      attempt in this same environment, same date, finding numpy and sympy
      absent and not flagging re/ast/os/sys. Full argument in repair_report.md
      "Dependency verification". The binding, execution-time check remains
      dependency_contract.runtime_assertion below, performed by the Executor at
      Step 0 of any dispatched run -- this task's argument does not substitute
      for it.
    runtime_assertion: >-
      Step 0 of the run MUST record, in environment.json: the interpreter
      version; the result of `importlib.util.find_spec` for each of numpy, sage,
      sagemath, g6k, fpylll, scipy, mpmath, re, ast (present/absent plus version
      where present); and an explicit statement that no forbidden module was
      imported. An import of any forbidden module INVALIDATES the run.

