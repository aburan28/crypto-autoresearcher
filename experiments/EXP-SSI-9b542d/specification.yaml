  # =====================================================================
  # COST FUNCTIONS - Fix 1 (assessed_method_cost) is the load-bearing change
  # =====================================================================
  cost_functions:
    units: "log2 of F_{p^2}-operations, optionally converted to AES-equivalents by A."
    per_entry_laws:
      L1_proportional_all_rows:
        definition: "a1 = sum_i(x_i*y_i) / sum_i(x_i^2) over the 8 T1 rows;  E(P) = log2(a1 * P)"
        design_time_value_a1: 15.576908
      L2_committed_headline:
        definition: "a2 = 2 * 8.1 = 16.2 exactly;  E(P) = log2(a2 * P)"
        source: >-
          EV-SSI-59f7a2 observation: "measured ops/entry scaling as ~8.1 x
          2*log2(p), giving extrapolated ~4147 (2^{12}) at NIST-I". a2 is
          TRANSCRIBED, not fitted; the run additionally reports |a1 - a2| and
          |a4 - a2| as a transcription-consistency readout.
      L3_ols_with_intercept:
        definition: "ordinary least squares of y on x over the 8 T1 rows; E(P) = log2(a3*P + b3); UNDEFINED where a3*P + b3 <= 0"
        design_time_values: {a3: 16.925485, b3: -36.279641}
      L4_largest_row_anchor:
        definition: "a4 = y(x=40) / 40 = 651.0768243785084 / 40;  E(P) = log2(a4 * P)"
        design_time_value_a4: 16.27692061
      L5_alpha_corrected_SENSITIVITY_ONLY:
        definition: "E(P) = log2( 651.0768243785084 * (P/40)^1.1321 )"
        source: >-
          alpha_primary = 1.1321 measured at ell in {47,101,151,211} in
          EV-WESO-b6ceff / KN-FIND-4e7a92, which records that this 13% excess
          "has not been propagated into any margin row in the c-table". This
          contract propagates it HERE.
        status: >-
          NOT a member of the main scenario band and NOT part of the reproduction
          gate. Reported separately as the extrapolation-sensitivity readout.
    null_estimators:
      N0_one_op_per_entry:
        definition: "E(P) = 0.0 for all P"
        meaning: >-
          The SUPERSEDED estimator: Wesolowski Section 4.1's deliberate
          one-F_{p^2}-operation-per-entry convention
          (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 230), which
          EV-SSI-59f7a2 exists to correct. This is the null object required by
          the batch handoff.
      N1_superseded_velu:
        definition: "E(P) = 9.8 for all P"
        meaning: >-
          The NEARBY-OBJECT null: the pre-red-team Velu-based estimator
          ("Real Algorithm 1 correction factor: x 2^{9.8}",
          concrete_cost_analysis.md line 31), superseded by
          red_team_concrete_cost.yaml OBJ-3 which shows Algorithm 1 uses modular
          polynomial root-finding, not Velu.
    assessed_method_cost:
      MC_P13_CORRECTED:
        formula: >-
          T_A(P, w) = L_paper(P) + E(P) + S + c*sqrt(P) + A
          + 0.5 * max(0, L_mem(P) - log2_w)
        equivalent_form: >-
          T_A(P, w) = T_full(P) * 2^{0.5*max(0, log2 M - log2 w)}, i.e.
          T_A(P, w) = T_full(P) for w >= M, and T_A(P, w) = T_full(P) * sqrt(M/w)
          for w < M -- the square root of the memory RATIO M/w, not of the raw
          count w.
        feasibility: >-
          Always defined in-window; the penalty saturates to 0 for
          log2_w >= L_mem(P) and grows without bound as log2_w -> -infinity
          (cost diverges as memory vanishes), so no explicit INFEASIBLE label is
          emitted under this convention -- unchanged in kind from
          EXP-SSI-697354's MC_P13, only the anchor value is fixed.
        boundary_condition: >-
          At log2_w = L_mem(P) (w = M, the algorithm's own full table size), the
          penalty term is max(0, L_mem(P) - L_mem(P)) = 0, so
          T_A(P, L_mem(P)) = L_paper(P) + E(P) + S + c*sqrt(P) + A = T_full(P)
          EXACTLY, for every committed P, every law, every S, A, c. Full algebra
          and the numeric demonstration that MC_P13_SUPERSEDED_do_not_use fails
          this identical check by exactly 0.5*L_mem(P) bits:
          repair_report.md section "Fix 1" and "Fix 3".
        provenance: >-
          DERIVED IN THIS CONTRACT. Does NOT import
          experiments/EXP-WESOVOW-001/cost_model.py. Corrects the anchor error
          EV-SSI-455241 OBJ-1/OBJ-2 and DEC-20260806-a00a28 identified in the
          superseded formula: that formula took the square root of a memory
          COUNT (T_full/sqrt(min(w,M))); this formula takes the square root of a
          memory RATIO, which is the form a sound time-memory tradeoff law
          requires (cost must equal T_full exactly at full memory).
      MC_P13_SUPERSEDED_do_not_use:
        formula: "T_A(P, w) = L_paper(P) + E(P) + S + c*sqrt(P) + A - 0.5*min(log2_w, L_mem(P))"
        status: >-
          RETAINED ONLY as the negative-control input to BOUNDARY-CONDITION-GATE
          BCG-2 (controls section below). NEVER evaluated as part of the main
          scenario grid, the reproduction gate, the null-object arms, the
          monotonicity checks, or any reported p*. This is EXP-SSI-697354's
          committed, frozen, rejected formula, transcribed exactly for
          regression-testing purposes only.
        provenance: >-
          EXP-SSI-697354/specification.yaml
          cost_functions.assessed_method_cost.MC_P13 (superseded by this
          contract; this file's own history, not an external import).
      MC_VOW:
        formula: "T_A(P, w) = L_paper(P) + E(P) + S + c*sqrt(P) + A"
        feasibility: "DEFINED ONLY WHERE log2_w >= L_mem(P); otherwise the cell is INFEASIBLE_AT_MEMORY"
        provenance: >-
          UNCHANGED from EXP-SSI-697354. The paper's Section 1.1 law as quoted in
          red_team_concrete_cost.yaml OBJ-5 ("time p^{1/2+o(1)}/(w^{1/2}*n) with
          memory w"); consequence recorded in CMC-4.
        carried_caveat: >-
          EV-SSI-455241 (unresolved, NOT repaired by this task): "MC_VOW
          misattributes the paper's own interpolation curve to a baseline the
          paper states has negligible memory." This is a MODELLING critique
          (which side of the comparison the memory discount belongs on), not an
          arithmetic anchor error like MC_P13's, and repairing it is out of
          DEC-20260806-a00a28's four named fixes. MC_VOW is carried unmodified
          with this caveat attached, because H-SSI-7fe2bf's H2
          (CONVENTION-DOMINANCE) requires both conventions evaluated and
          compared, not one adjudicated away.
    baseline_cost:
      MC_P13_CORRECTED:
        formula: "T_B(P, w) = P/2 + log2_k_DG + A"
        note: >-
          Memoryless baseline, w-independent, exactly the paper's L_prev column.
          UNCHANGED by Fix 1 -- only the assessed-method side of MC_P13 had the
          anchor bug; the baseline was never affected.
      MC_VOW:
        formula: "T_B(P, w) = P/2 + log2_k_DG + A - 0.5*log2_w"
        note: vOW middle-memory baseline at memory w, single processor (n = 1). Unchanged.
    margin:
      definition: "Delta(P, w, theta) = T_B(P, w) - T_A(P, w);  positive means the assessed method is cheaper"
      unit_cancellation_note: >-
        A appears on both sides and cancels in Delta. It is retained in the
        formulas because the reproduction gate compares ABSOLUTE costs against
        EV-SSI-59f7a2's bracket, where the unit matters. The run must report that
        A cancels in Delta and does not silently drop it.
      differential_slope_note: >-
        For MC_P13_CORRECTED, d(Delta)/d(log2 w) = +0.5 exactly while
        log2 w < L_mem(P) and 0 at or above it -- IDENTICAL in slope to the
        superseded formula (repair_report.md "Fix 3" section 3.1 proves this by
        direct differentiation). The two formulas differ by a CONSTANT
        (0.5*L_mem(P)) at every w, which is exactly why the slope-based
        MONO-1..4 checks below could never have caught OBJ-2, and why
        BOUNDARY-CONDITION-GATE (an absolute-value check at the anchor point)
        was added rather than relying on any existing differential check.
    ratio_form_primary:
      definition: "Delta expressed as a function of log2_k_DG: Delta(log2_k_DG) = Delta(0) + log2_k_DG"
      sensitivity: "d(p*)/d(log2_k_DG), reported numerically at every w by re-solving at log2_k_DG in {-4, -2, 0, +2, +4}"

  # =====================================================================
  # CROSSOVER-SOLVING PROCEDURE - exactly
  # =====================================================================
  crossover_procedure:
    scenario_tuple: "theta = (law in [L1,L2,L3,L4], S in [0.0,3.0], A in the 4 declared values, c in the 5 declared values, MC in [MC_P13_CORRECTED, MC_VOW])"
    main_grid_cells: "4 laws x 2 S x 4 A x 5 c x 2 MC x 14 w = 4480"
    null_grid_cells: "2 nulls x (2 S x 4 A x 5 c x 2 MC x 14 w) = 2240"
    sensitivity_grid_cells: "L5 x (2 S x 4 A x 5 c x 2 MC x 14 w) = 1120"
    steps:
      - "1. Bracket scan. Evaluate g(P) = Delta(P, w, theta) at P = 256, 257, ..., 768 (513 points, step 1.0)."
      - >-
        2. Feasibility mask. Under MC_VOW mark every P with L_mem(P) > log2_w as
        INFEASIBLE. Under MC_P13_CORRECTED no P is masked (the convention
        permits evaluation at any w; cost DIVERGES, rather than becomes
        unboundedly cheap, as w shrinks -- the corrected direction, see
        cost_functions.assessed_method_cost.MC_P13_CORRECTED). L_mem(P) is
        recorded for every reported P so feasibility is always visible.
      - "3. If the feasible set is empty, emit INFEASIBLE_AT_MEMORY together with the smallest log2_w that would make P = 256 feasible (92.5). Stop this cell."
      - "4. Count sign changes of g between adjacent feasible grid points. If zero, emit NO_CROSSOVER_IN_WINDOW with sign(g) and the value of g at BOTH feasible endpoints. Stop this cell."
      - "5. If one or more sign changes, bisect the FIRST bracketing interval to |g| < 1e-9 or 80 iterations, whichever first, and emit p_star_log2 = the root. If more than one sign change, emit MULTIPLE_ROOTS with every root; never silently reduce to one."
      - "6. Window guard. No root may be reported outside [256, 768] under any circumstance. A sign pattern implying a root beyond the window is emitted as ROOT_OUTSIDE_WINDOW with the direction, and the numeric value is NOT emitted."
      - "7. Repeat steps 1-6 for the two nulls and for L5, using the identical code path with only E(.) swapped. A separate implementation of the solver for the nulls is FORBIDDEN - the null must be the same procedure."
      - >-
        8. Unbounded-memory evaluations (the reproduction gate, ADVERSARIAL-CORNER)
        use log2_w = memory_grid.unbounded_memory_representation.log2_w = 1000,
        which the boundary_condition proof shows is exactly equivalent to the
        limit log2_w -> infinity for MC_P13_CORRECTED.
    determinism: >-
      Fully deterministic. seed 0 is recorded for form only; no randomness is
      used anywhere. Two runs on the same inputs must produce byte-identical
      raw-result.json apart from timing fields.

  independent_variables:
    - log2 p (the solved-for axis, window [256, 768])
    - log2 w (the deliverable's free axis, 14 declared values, memory_grid.w_grid_log2)
    - per-entry law (4 + 1 sensitivity + 2 nulls)
    - structural surcharge S (2)
    - AES-equivalence exponent A (4)
    - overhead scenario c (5)
    - memory-charging convention MC (2: MC_P13_CORRECTED, MC_VOW)

  # =====================================================================
  # CONTROLS - the prior six plus BOUNDARY-CONDITION-GATE (Fix 3)
  # =====================================================================
  controls:

    - id: RG-REPRODUCTION-GATE
      kind: known_answer_gate
      mandatory: true
      blocking: true
      description: >-
        Recover EV-SSI-59f7a2's committed bracket at the parameters that record
        evaluated it: log2 p = 256 (SQIsign NIST-I, p = 5*2^248 - 1),
        unbounded memory (represented as log2_w = memory_grid.unbounded_memory_representation.log2_w
        = 1000, per its boundary-condition equivalence proof), memoryless
        baseline, c = 0, evaluated under MC_P13_CORRECTED.
      assertions:
        - id: RG-1
          statement: "For each of L1, L2, L3, L4: T_A(256, log2_w=1000) with S = 0, A = 0, c = 0 lies in [118.25, 118.75]."
          derives: >-
            the low endpoint 2^{118.5} is DERIVED from T1 and T2 through
            MC_P13_CORRECTED's own boundary condition (penalty = 0 at
            log2_w=1000 >= L_mem(256)=92.5), not declared. Full derivation and
            the numeric table: repair_report.md section "Fix 2".
          design_time_expectation: "[118.461328, 118.569019] across the four laws"
        - id: RG-2
          statement: "Same with S = 3.0 lies in [121.25, 121.75], reproducing the committed F_{p^2} upper endpoint 2^{121.5}."
          design_time_expectation: "[121.461328, 121.569019]"
        - id: RG-3
          statement: "Applying A = 1.584963 (alpha = 3, hardware) gives [119.9, 120.4] and [122.9, 123.4], reproducing the committed AES-equivalent bracket 2^{120}-2^{123}."
          design_time_expectation: "[120.046291, 120.153982] and [123.046291, 123.153982]"
        - id: RG-4
          statement: >-
            EV-SSI-59f7a2's headline bracket [118.5, 123.0] is reproduced with
            both endpoints matching to within 0.25 bits, AND the run records the
            UNIT of each endpoint and whether they differ. The low endpoint here
            is F_{p^2}-operations (RG-1); the high endpoint is AES-equivalent
            (RG-3 with S=3.0) -- reported as a UNIT-MIXING DISCLOSURE about the
            input record. Neither outcome fails the gate; failing to report
            which one holds DOES fail it.
        - id: RG-5
          statement: >-
            Over the full scenario grid at P = 256 (4 laws x 2 S x 4 A, c = 0,
            MC_P13_CORRECTED, log2_w = 1000), the set of gaps below the 128-bit
            target covers the committed interval [6, 11] bits of
            red_team_concrete_cost.yaml gap_below_128_target.theoretical_unbounded_memory:
            min gap <= 6.5 and max gap >= 10.5.
          design_time_expectation: >-
            min gap = 2.52409 (at L3, S=3.0, A=3.906891), max gap = 11.275638
            (at L1, S=0, A=-1.736966); span [2.52409, 11.275638] ⊇ [6, 11].
            Independently reproduces EV-SSI-455241's own cited figures
            (2.5241 / 11.2756). Full derivation: repair_report.md section
            "Fix 2".
      can_this_control_fail: >-
        YES, on real defects and on real data. RG-1 recomputes 118.5 from the raw
        8-row table and the paper anchor under four independent fit rules; a
        misread column, a wrong pointer, a transposed row, a wrong anchor, or a
        wrong fit form moves it out of a 0.5-bit-wide window. RG-4 can fail by
        omission of the unit disclosure. RG-5 can fail if the reconstructed grid
        does not reach the committed interval at either end. NOTE (honest
        limitation, unchanged by this repair): this control's tolerance windows
        are wide enough that a CONSTANT offset in the memory term at unbounded
        memory (exactly the class of bug that got EXP-SSI-697354 rejected) does
        NOT necessarily move any of RG-1..RG-5 outside their bands, because
        those bands were never actually sensitive to the memory term at
        log2_w=1000 in either formula version -- repair_report.md section
        "Fix 3" section 3.1 shows this in detail. This is exactly why
        BOUNDARY-CONDITION-GATE exists as a SEPARATE, tighter, absolute-value
        control rather than relying on RG-1..RG-5 alone.
      on_failure: "RUN INVALID. Nothing else may be emitted. This is proposal falsifier F1."

    - id: NULL-OBJECT
      kind: null_object
      mandatory: true
      blocking: false
      description: >-
        Run the IDENTICAL procedure with the corrected estimator replaced by the
        superseded ones and show the object moves. Unaffected by Fix 1: the
        displacement D_null0(P,w,theta) = |T_A_N0 - T_A_corrected| = |E(P) - 0|
        = E(P) is INDEPENDENT of the memory-penalty term, which is identical in
        both the corrected and the null-estimator evaluations and cancels
        exactly in the difference.
      arms:
        - "N0: Wesolowski's one-operation-per-entry convention, E(P) = 0. The estimator EV-SSI-59f7a2 exists to correct."
        - "N1: the superseded Velu estimator, E(P) = 9.8. The nearby object."
      measured_quantities:
        - "D_null0(P, w, theta) = |Delta_corrected - Delta_N0| at every evaluated cell, and its min / max / argmin / argmax over the grid."
        - "D_null1(P, w, theta) = |Delta_corrected - Delta_N1| likewise."
        - "Locus displacement: |p*_corrected - p*_null| wherever both are numeric, and the categorical transition (e.g. numeric -> NO_CROSSOVER) wherever they are not."
      preregistered_prediction: >-
        min D_null0 >= 11.9 bits and max D_null0 <= 14.2 bits, increasing
        monotonically in P. D_null1 at P = 256 in [1.5, 4.0] bits, and
        D_null1 < D_null0 at EVERY evaluated P.
      can_this_control_fail: >-
        YES, in three distinct ways, each with a different meaning.
        (a) min D_null0 < 1.0 bit: the correction is not driving the object; this
        is proposal falsifier F4 and the record must be re-described.
        (b) D_null1 >= D_null0 anywhere: the procedure does not ORDER two
        estimators it is supposed to resolve; falsifier F6.
        (c) D_null0 outside [11.9, 14.2] while still above 1.0: the reconstruction
        is not the one EV-SSI-59f7a2 performed, and the discrepancy is reported.
        Note that the LOCUS displacement may legitimately be categorical-only if
        every cell is NO_CROSSOVER; that is why the displacement is measured on
        the margin SURFACE, which always has resolution, and not only on the
        locus.
      on_failure: "Recorded as a finding. The run stays valid; the interpretation changes."

    - id: MONO-MEMORY
      kind: monotonicity
      mandatory: true
      blocking: true
      description: >-
        The memory axis is the parameter this deliverable is built around. If the
        instrument does not respond to it with the pre-registered sign, slope and
        kink location, it is not measuring the thing it claims to. HONEST LIMIT
        (see repair_report.md "Fix 3" section 3.1): these checks are all
        DIFFERENTIAL and are therefore, by construction, blind to a constant
        vertical offset in the memory term -- exactly the class of defect Fix 1
        repairs. They remain valid checks of a DIFFERENT property (slope
        correctness) and are retained unchanged; BOUNDARY-CONDITION-GATE below
        is the control added specifically because these five limbs could not
        have caught OBJ-2.
      limbs:
        - id: MONO-1
          statement: >-
            d(Delta)/d(log2 w) equals +0.5 exactly under MC_P13_CORRECTED while
            log2 w < L_mem(P), and 0 exactly at or above it; and -0.5 exactly
            under MC_VOW wherever the assessed method is feasible. Measured by
            finite difference on the declared w grid (memory_grid.w_grid_log2)
            at every committed P row and every theta. Tolerance 1e-6.
          fails_on: sign reversal, wrong magnitude, memory charged to the wrong side, a missing clamp
        - id: MONO-2
          statement: >-
            The kink in Delta versus log2 w under MC_P13_CORRECTED sits at
            exactly L_mem(P), i.e. at 92.5 / 138.6 / 181.3 / 206.0 / 272.2 for
            the five committed rows, to within 1e-9.
          fails_on: "an implementation that drops the max(0, .) clamp - which is the single most likely wiring defect and produces NO kink at all"
        - id: MONO-3
          statement: >-
            p*(w) is non-increasing in w under MC_P13_CORRECTED and non-decreasing
            under MC_VOW, wherever at least two numeric loci exist within one
            theta. If fewer than two numeric loci exist, the limb reports
            NOT_EVALUABLE(n = <count>) for that theta - NEVER `pass`.
          fails_on: a strict move in the wrong direction
        - id: MONO-4
          statement: >-
            MC_P13_CORRECTED and MC_VOW differ by at least 0.5 bits in Delta at
            some evaluated cell with log2 w >= 10. If they agree everywhere, the
            memory axis is not wired in.
          fails_on: identical surfaces
        - id: MONO-5
          statement: >-
            DATA CHECK, not a formula check. Over the 5 committed T2 rows:
            L_paper is strictly increasing; L_mem is strictly increasing;
            L_paper(P) - P/3 is strictly increasing and lies in [21.0, 47.0];
            L_mem(P) - P/3 is non-decreasing.
          fails_on: "a non-monotone committed column - a property of the input that could have been otherwise"
          why_it_matters: >-
            L_paper(P) - P/3 is the only in-corpus handle on the superpolynomial
            o(1) term that docs/claims-and-verification.md requires be
            characterized rather than hidden.
      can_this_control_fail: >-
        YES. MONO-1, MONO-2 and MONO-4 fail on the concrete wiring defects named
        beside them; MONO-3 fails on a direction reversal and otherwise reports
        NOT_EVALUABLE rather than passing vacuously; MONO-5 is a property of the
        committed data and is not implied by any formula in this contract. NONE
        of these five limbs can detect a constant offset in the memory term
        (see description above) -- that is BOUNDARY-CONDITION-GATE's job.
      on_failure: "MONO-1, MONO-2, MONO-4, MONO-5 failure INVALIDATES the run as a wiring or input defect. MONO-3 failure is a finding."

    - id: FITTED-WINDOW-GUARD
      kind: disclosure_guard
      mandatory: true
      blocking: true
      description: >-
        Unchanged from EXP-SSI-697354. Taken literally it would void every cell,
        because T1's fit window is log2 p in [9, 40] and every evaluation is at
        log2 p in [256, 768]. That extrapolation is precisely what EV-SSI-59f7a2
        already performed to obtain 2^{118.5}, and its own boundary list
        discloses it. The guard is therefore implemented as: mandatory per-cell
        disclosure, not suppression.
      rules:
        - "Every emitted number carries fit_window_extrapolation: true and extrapolation_ratio = P / 40 in [6.4, 19.2]."
        - "Every emitted number at a non-committed P carries interpolated_between_committed_rows with the two bracketing T2 rows named."
        - "L3 cells with a3*P + b3 <= 0 are UNDEFINED with the missing condition named. (Design-time check: does not fire on [256, 768].)"
        - "Evaluation outside [256, 768] is refused by the solver, not disclosed - the window is a hard boundary."
        - "undefined_segments.json lists every cell with a non-null guard flag and names the input responsible. An empty list would itself be a defect and is reported as such."
      can_this_control_fail: >-
        YES, by omission: a run that emits any number without its extrapolation
        stamp fails this control and the run is invalid. It also fails if
        undefined_segments.json is empty, because at least the 6.4x-19.2x
        extrapolation stamp must appear on every cell.

    - id: ADVERSARIAL-CORNER
      kind: corner_disclosure
      mandatory: true
      blocking: false
      description: >-
        Evaluate and report explicitly the corner most favourable to the assessed
        method: the per-entry law giving the smallest E, S = 0, A = -1.736966
        (pure RAM), c = 0.0, MC = MC_P13_CORRECTED, log2 k_DG = 0. Any
        pre-registered lower bound is claimed ONLY if it survives that corner.
      honest_note_post_repair: >-
        Fix 1 REMOVED a 0.5*L_mem(P)-bit attacker-favourable error that
        MC_P13's superseded formula previously carried, so which convention is
        in fact more favourable to the assessed method at a given (P, w) is no
        longer assumed. The run additionally reports the MC_VOW value at the
        identical (P, w, S, A, c) point for comparison, since it is no longer
        safe to assume MC_P13_CORRECTED is the attacker-favourable corner
        merely because MC_P13 (uncorrected) used to be.
      can_this_control_fail: >-
        YES: if a headline statement holds at the median grid point but not at
        this corner, the headline is withdrawn, not qualified.

    - id: SANITY-1-MODEL-COHERENCE
      kind: model_audit
      mandatory: true
      blocking: false
      description: >-
        Audit whether MC_P13_CORRECTED implies that REDUCING memory below
        L_mem(P) makes the assessed method CHEAPER. Report the implied
        magnitude at each committed P row.
      preregistered_expectation: >-
        The corrected formula ADDS 0.5*max(0, L_mem(P)-log2_w) to the cost, so
        smaller w gives a LARGER addition and a LARGER cost - reducing memory
        makes the assessed method strictly MORE expensive, never cheaper. The
        audit must report the sign of dT_A/d(log2 w) explicitly and, if it is
        negative below L_mem(P) (cost falls as memory rises, i.e. rises as
        memory falls -- the physically required direction) that is the PASSING
        outcome, unlike the superseded contract's ambiguous framing. If any
        arrangement of the committed formula implies cost falling as memory
        falls, the run records MODEL_PATHOLOGY: memory_discount_direction with
        the magnitude.
      honest_limit: >-
        This audit is DIFFERENTIAL (it checks the SIGN of a derivative), and
        repair_report.md section "Fix 3" section 3.1 shows this sign is
        IDENTICAL between MC_P13_CORRECTED and MC_P13_SUPERSEDED_do_not_use --
        both have the physically correct slope below L_mem(P). SANITY-1
        therefore could NOT have caught OBJ-2 either, for the same reason
        MONO-1..4 could not; it is retained because it audits a genuinely
        different property (slope sign, not anchor value) and is not redundant
        with BOUNDARY-CONDITION-GATE, but it must never be read as covering
        what that control covers.
      can_this_control_fail: >-
        YES: it is an audit of a COMMITTED model against a physical coherence
        requirement, and its adverse outcome is a finding about the campaign's own
        cost model, not about this run.
      why_it_is_here: >-
        Two committed artifacts charge the same vOW law to opposite sides
        (H-SSI-7fe2bf HEUR-XO-3). No committed record reconciles them (that
        reconciliation is out of this task's scope). A contract that picked one
        silently would be manufacturing the sign of its own answer.

    - id: BOUNDARY-CONDITION-GATE
      kind: boundary_value_check
      mandatory: true
      blocking: true
      description: >-
        THE CONTROL THIS REPAIR EXISTS TO ADD (DEC-20260806-a00a28 next_action
        (c); EV-SSI-455241's central adverse finding that zero of fourteen
        prior assertions can return a negative about the mathematical object).
        Asserts, by ABSOLUTE VALUE at the exact anchor point rather than by
        slope or by a wide reproduction window, that the assessed-method cost
        law reduces to the full-memory cost T_full EXACTLY at w = M -- the same
        boundary condition whose violation (EV-SSI-455241 OBJ-1/OBJ-2) got
        EXP-SSI-697354 rejected. This is a property of the MATHEMATICAL OBJECT
        (the vOW time-memory law), not of parsing, units, or an implementation
        detail; see repair_report.md "why_this_is_different_from_MONO_and_SANITY-1"
        below for the argument that no other control in this contract or its
        predecessor could substitute for it.
      assertions:
        - id: BCG-1
          statement: >-
            For each of the five committed T2 rows P in {256,384,512,576,768},
            each of the four per-entry laws L1..L4, and S=0, A=0, c=0:
            evaluating MC_P13_CORRECTED's T_A(P, log2_w = L_mem(P)) must equal
            L_paper(P) + E(P) EXACTLY, i.e. the residual
            |T_A(P, L_mem(P)) - (L_paper(P)+E(P))| < 1e-9 bits.
          derives: >-
            this IS the algebraic identity proven in repair_report.md section
            "Fix 1": the penalty term max(0, L_mem(P)-L_mem(P)) = 0 by
            construction, so the residual is exactly 0.0, not merely small.
        - id: BCG-2
          statement: >-
            NEGATIVE-CONTROL COMPUTATION (regression test against the exact
            defect this contract repairs), run BEFORE BCG-1 is trusted.
            Re-run BCG-1's identical check with
            MC_P13_SUPERSEDED_do_not_use substituted for MC_P13_CORRECTED. The
            residual MUST be reported and MUST be non-zero: specifically
            0.5*L_mem(P) bits at every committed P (46.25 / 69.3 / 90.65 / 103.0
            / 136.1 bits at P = 256/384/512/576/768), reproducing
            EV-SSI-455241 OBJ-2's cited 46.25-bit NIST-I deviation. THIS
            ASSERTION EXISTS TO PROVE THE GATE CAN FAIL: a wrong model is
            deliberately run through it and must be caught. If BCG-2's residual
            is ever < 1.0 bit, the negative control itself has failed and the
            whole gate is UNTRUSTWORTHY.
      can_this_control_fail: >-
        YES, DEMONSTRATED IN BOTH DIRECTIONS, computed by hand in
        repair_report.md section "Fix 3" section 3.3 and re-verified by the run
        itself as BCG-2:
        PASS CASE (BCG-1, corrected formula): residual = 0.0 bits at w=M for
        every committed P, by algebraic construction.
        FAIL CASE (BCG-2, the superseded formula EXP-SSI-697354 actually
        committed and DEC-20260806-a00a28 rejected for exactly this defect):
        residual = 0.5*L_mem(P) bits, e.g. 46.25 bits at NIST-I - more than
        eight orders of magnitude above the 1e-9 tolerance. This is not a
        hypothetical wrong model; it is the record's own immediate
        predecessor, so the fail case is not manufactured - it is the
        documented history of this exact contract.
      on_failure: >-
        BCG-1 failure: RUN INVALID -- the cost law does not satisfy the minimal
        mathematical requirement of a sound time-memory tradeoff and the run
        must not proceed to compute any p* value (same class of defect as F1).
        BCG-2 residual < 1.0 bit: RUN INVALID as a control-integrity failure --
        the negative control itself is not exercising the defect it exists to
        catch, so BCG-1 passing would be uninformative.
      why_this_is_different_from_MONO_and_SANITY-1: >-
        MONO-1..4 and SANITY-1 are DIFFERENTIAL (slopes, kink locations, sign of
        a derivative). The bug's algebra (repair_report.md "Fix 1") shows the
        superseded formula's defect is a CONSTANT VERTICAL OFFSET
        (-0.5*L_mem(P), independent of w) below the clamp and IDENTICAL in
        slope to the corrected formula both above and below L_mem(P). A
        constant offset is invisible to every differential check by definition
        (d(offset)/dw = 0), and EV-SSI-455241 confirmed this is exactly why
        MONO-1..4 passed on the defective contract. RG-1..RG-5 are
        ABSOLUTE-VALUE checks but were evaluated against numbers hand-computed
        assuming correct, bug-free behaviour and never actually pushed through
        the committed buggy formula at freeze time (repair_report.md "Fix 2").
        BOUNDARY-CONDITION-GATE is the first control in either contract version
        that (a) evaluates the formula AT THE EXACT ANCHOR POINT w=M where the
        defect lives, (b) uses a tolerance (1e-9 bits) far tighter than the
        46.25-bit defect, and (c) is proven able to fail by being run, in
        BCG-2, against the actual rejected formula.

  # =====================================================================
  metrics:
    primary:
      - "p_star_table: the deliverable curve. One row per (log2 w, theta) with outcome in {numeric p*, NO_CROSSOVER_IN_WINDOW + both endpoint signs and values, INFEASIBLE_AT_MEMORY, MULTIPLE_ROOTS + all roots, ROOT_OUTSIDE_WINDOW + direction}. 4480 main rows."
      - "p_star_band per log2 w: [min p*, max p*] over numeric cells, PLUS the counts n_numeric / n_no_crossover_attack_side / n_no_crossover_baseline_side / n_infeasible. A band reported without the categorical counts is incomplete by contract."
      - "Band-width comparison at (P = 256, log2 w = 30): p* band width in log2 p as a fraction of its midpoint, against the margin band width in bits as a fraction of its midpoint. Proposal falsifier F2."
      - "Reproduction gate residuals RG-1..RG-5, per law, in bits."
      - "BOUNDARY-CONDITION-GATE residuals BCG-1 (corrected, expect 0.0) and BCG-2 (superseded negative control, expect 0.5*L_mem(P)), per committed P row, per law."
      - "Null displacements D_null0 and D_null1: min, max, argmin, argmax, and the per-P profile."
      - "Monotonicity limbs MONO-1..MONO-5 with measured slopes, kink locations, and verdicts."
      - "Convention-sign table: sign(Delta) under MC_P13_CORRECTED and MC_VOW at every evaluated cell, and the count of cells where they agree."
    secondary:
      - "Ratio-form margin as a function of log2 k_DG, and d(p*)/d(log2 k_DG) at every w, computed at log2 k_DG in {-4,-2,0,+2,+4}."
      - "L5 extrapolation sensitivity: E_L5(P) - E_L4(P) at every committed P row (design-time expectation: rising from about 0.36 bits at P = 256 to about 0.56 at P = 768) and the induced locus displacement."
      - "Transcription-consistency readout |a1 - 16.2|, |a3*P+b3 vs a2*P| at P = 256, |a4 - 16.2|."
      - "SCOPE-A / SCOPE-B / SCOPE-C tables for NIST-I/III/V (see scope_statement below)."
      - "undefined_segments.json: every guard flag with the responsible input named."
      - "input_hashes.json: SHA-256 of T1, T2 and every scalar-source file, recorded at run time."
      - "environment.json: interpreter, module presence/absence for numpy, sage, g6k, fpylll, scipy, mpmath, re, ast, and the no-forbidden-import assertion."
      - "cross_check_secondary.json: XCHK-2 (numpy, optional) or NOT_RUN with the ImportError text."

  cross_checks:
    - id: XCHK-1
      requires: stdlib only
      description: >-
        Recompute T_A(256, log2_w=1000) at S = 0, A = 0, c = 0 by a second,
        independently written expression path (direct summation of the
        committed literals rather than the general evaluator) and require
        agreement to 1e-12. This catches an evaluator bug that happens to land
        inside the RG-1 window. HONEST NOTE: this recomputes the SAME expression
        through a second code path, and would inherit the SAME anchor bug if one
        were reintroduced, exactly as EV-SSI-455241 observed for the parent
        contract. It is not a substitute for BOUNDARY-CONDITION-GATE.
      blocking: true
    - id: XCHK-2
      requires: numpy (OPTIONAL)
      description: >-
        Re-derive L_paper and L_mem independently by the B-optimization over the
        Dickman rho function, as implemented at
        coordination/tasks/TASK-20260724-P13-VAL/repro/experiments/EXP-P13VOW-001/cost_model.py,
        and compare against the T2 columns. Agreement tolerance is the COMMITTED
        observed deviation of 3.51 bits from EV-WESO-001 ("the paper's five
        concrete (time, memory) pairs reproduce only within 0.05-3.51 bits
        (partial control failure, honestly disclosed)"), NOT the 0.75-bit
        SANITY_TOLERANCE_BITS declared inside that script.
      blocking: false
      on_absence: "record NOT_RUN with the ImportError text; the run remains valid and no reported number changes"

  heuristic_under_test: >-
    NONE. This experiment tests no heuristic. It DEPENDS on HEUR-XO-1, HEUR-XO-2,
    HEUR-XO-3 and Wesolowski Heuristic 1, all declared in H-SSI-7fe2bf, and it
    validates none of them. Any citation suggesting otherwise is a claim-tier
    violation.

  preregistered_prediction:
    quantity: >-
      (Q1) the reproduction-gate values at P = 256; (Q2) the null displacements;
      (Q3) the sign of Delta under each memory-charging convention; (Q4) the
      monotonicity slopes and kink locations; (Q5) the three scope orderings;
      (Q6) the BOUNDARY-CONDITION-GATE residuals BCG-1/BCG-2.
    formula: >-
      Q1: T_A(256, log2_w=1000) = 106.5 + log2(a*256 [+ b]) [+ S] [+ A]
      (penalty term = 0 at log2_w=1000).
      Q2: D_null0(P) = E(P);  D_null1(P) = |E(P) - 9.8|.
      Q3: sign(Delta) = sign(P/2 + log2_k_DG - L_paper(P) - E(P) - S - c*sqrt(P)
      - 0.5*max(0, L_mem(P)-log2_w))  [MC_P13_CORRECTED]  or
      sign(P/2 + log2_k_DG - 0.5*log2_w - L_paper(P) - E(P) - S - c*sqrt(P))
      [MC_VOW, feasible cells only].
      Q4: dDelta/dlog2w in {+0.5, 0} (MC_P13_CORRECTED) and {-0.5} (MC_VOW);
      kink at L_mem(P).
      Q5: SCOPE-A and SCOPE-B gaps increase with NIST level (9.5387 / 21.9537 /
      38.8387 bits at NIST-I/III/V per DEC-20260806-a00a28); SCOPE-C
      infeasibility increases with NIST level.
      Q6: BCG-1 residual = 0.0 exactly; BCG-2 residual = 0.5*L_mem(P) exactly
      (46.25 / 69.3 / 90.65 / 103.0 / 136.1 bits at the five committed rows).
    source: >-
      All six derive from the committed inputs named in `inputs` above plus the
      formulas in `cost_functions`. No external theorem is invoked. Q1-Q5's
      design-time expectations were computed BY HAND at freeze time and are
      PRE-REGISTRATION, NOT RESULTS. Q6 is a NEW quantity (Fix 3) whose
      expectation follows from direct algebra shown in full in
      repair_report.md, not from a hand-guess.
    frozen_reference_values:
      a1: 15.576908
      a2: 16.2
      a3: 16.925485
      b3: -36.279641
      a4: 16.27692061
      E_at_256: {L1: 11.961328, L2: 12.017922, L3: 12.069019, L4: 12.024751, L5: 12.379}
      T_A_256_S0_A0_log2w1000: {L1: 118.461328, L2: 118.517922, L3: 118.569019, L4: 118.524751}
      L_paper_minus_P_over_3: [21.166667, 29.5, 33.533333, 38.9, 46.4]
      L_mem_minus_P_over_3: [7.166667, 10.6, 10.633333, 14.0, 16.2]
      gap_below_target_S0_A0_c0: {NIST-I: 9.5387, NIST-III: 21.9537, NIST-V: 38.8387}
      gap_below_target_source: >-
        DEC-20260806-a00a28 (dispatcher-verified), corroborating and refining
        H-SSI-7fe2bf.frozen_reference_values.gap_below_target_S0_A0_c0
        (9.538672 / 21.95 / 38.84). Unaffected by Fix 1: computed at unbounded
        memory (S=0, A=0, c=0), where MC_P13_CORRECTED's penalty term is
        provably 0 by the same argument as the RG-1..RG-5 bands
        (repair_report.md "Fix 2").
      memory_bytes_log2_at_64B: {NIST-I: 98.5, NIST-III: 144.6, NIST-V: 187.3}
      boundary_condition_residuals_BCG2_bits: {NIST-I: 46.25, NIST-III: 69.3, NIST-V: 90.65, "P=576": 103.0, "P=768": 136.1}

  scale_relevance:
    tier: medium
    justification: >-
      Nothing is executed at any scale. The tier is inherited from the
      load-bearing measured input T1 (log2 p <= 40), which is medium by the
      mechanical rule. The FORM of the per-entry law is argued to transfer
      (the counting rule in T1's own metadata is exactly linear in log2 p at
      fixed ell); the VALUE at log2 p in [256, 768] is an extrapolation of
      6.4x to 19.2x beyond the fit window and is stamped as such on every cell.
    limit: >-
      NOTHING TRANSFERS TO CRYPTOGRAPHIC SCALE AS A VALIDATED VALUE. The
      cryptographic-size numbers here are extrapolations of a medium-tier
      measurement, and any citation toward a crypto-scale conclusion must carry
      that gap in the citing sentence.
    correspondence: null

  tail_checks:
    - >-
      Report Delta at BOTH window endpoints (P = 256 and P = 768) for every cell,
      not only the crossing outcome. A cell reported NO_CROSSOVER whose endpoint
      values are near zero is a different object from one whose endpoints are 60
      bits apart, and the distinction must be visible.
    - >-
      Report the smallest |Delta| observed anywhere in the grid and the cell it
      occurs at. If the minimum is below 1 bit at any memory-feasible cell, the
      comparison is knife-edge there and the locus in that neighbourhood is
      reported as a bracket, not a point.
    - >-
      Report the extreme cells of the null displacement (argmin, argmax) so a
      reviewer can check the displacement is not driven by one pathological
      corner.
    - >-
      Report the count of cells at each categorical label per convention. A
      convention that produces 100% of one label is decisive and must be reported
      as decisive rather than averaged into a band.
    - >-
      Report BOUNDARY-CONDITION-GATE's BCG-1 residual across ALL 4480 main grid
      cells' (P, w=L_mem(P)) slices, not merely the five committed rows, so a
      reviewer can see the identity holds at interpolated P as well as at the
      committed anchors.

  replication:
    seeds: [0]
    seeds_note: "No randomness is used anywhere. Seed 0 is recorded for form only. Determinism is the replication guarantee: a re-run must be byte-identical apart from timing fields."
    independent_instances: 0
    independent_reimplementation_required: >-
      XCHK-1 is a second expression path for the gate value inside the same run.
      A fully independent reimplementation by a Validator is REQUIRED before any
      evidence record derived from this run may reach `replicated` strength. That
      independent reimplementation MUST separately recompute BCG-1 and BCG-2
      from the frozen formulas in this specification, not from the Executor's
      code.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.25
    maximum_memory_gb: 1
    maximum_runs: 1
    new_compute: none_beyond_arithmetic_on_committed_numbers
    budget_basis: >-
      About 7840 cells, each a 513-point bracket scan plus at most 80 bisection
      steps, PLUS BOUNDARY-CONDITION-GATE's fixed 5-row x 4-law x 2-formula = 40
      extra point evaluations: under 5 million evaluations of a closed-form
      expression total. Pure Python completes this in seconds; the 600 s
      ceiling is a generous margin, not an estimate. No file exceeds a few
      megabytes.

  stopping_rules:
    - "Run once. There is nothing to re-seed and no reason to re-run except an input change, which would be a different experiment version."
    - >-
      Stop and emit nothing beyond the gate report if any RG assertion or any
      BOUNDARY-CONDITION-GATE assertion (BCG-1 or BCG-2) fails. Both gates are
      evaluated FIRST, before any curve is computed. BCG-2 is evaluated before
      BCG-1 is trusted (a broken negative control makes BCG-1 uninformative).
    - "Stop and report failed_infrastructure if the interpreter, a stdlib module, or an input file is unavailable. That is infrastructure signal, never a mathematical result (AGENTS.md rule 5)."
    - "Stop at 600 s wall clock and report which cells were reached. An unreached cell is UNREACHED, never a negative and never an INFEASIBLE."
    - "Do not execute until this contract is dispatched to an Executor under a handoff with a budget and an assigned archival task. `execution_authorized: true` authorizes dispatch; it does not authorize an undispatched run."

  invalidation_rules:
    - "Any RG-1..RG-5 assertion failing, including RG-4 failing by omission of the unit disclosure."
    - "BCG-1 residual >= 1e-9 bits at any evaluated (P, law) pair, OR BCG-2 residual < 1.0 bit at any evaluated (P, law) pair (control-integrity failure)."
    - "Any input file whose re-extracted rows differ from the frozen values in `inputs`, or whose SHA-256 is not recorded."
    - "T2 transcription mismatch against the paper text OR against the independent PAPER_PAIRS transcription."
    - "MONO-1, MONO-2, MONO-4 or MONO-5 failing."
    - "XCHK-1 disagreeing beyond 1e-12."
    - "Any reported p* outside [256, 768], or any number emitted without its fit-window extrapolation stamp."
    - "An empty undefined_segments.json."
    - "Any import of sage, sagemath, g6k, fpylll, scipy or mpmath; any network access; any reported number depending on numpy."
    - >-
      Any post-hoc change to the scenario grid, the tolerance windows, the w
      grid (memory_grid.w_grid_log2), the unbounded-memory representation, or
      the frozen reference values after any output has been observed. Such a
      change requires a versioned protocol_amendment and a new experiment
      version.
    - "Any emitted artifact containing a sentence from claim_ceiling.forbidden_sentences."
    - "Any evaluation of MC_P13_SUPERSEDED_do_not_use outside the BCG-2 negative-control computation."

  infrastructure_failure_disposition: >-
    A missing input file, an unreadable path, an unavailable module, a parse
    failure, or a wall-clock exhaustion is INFRASTRUCTURE SIGNAL and is NEVER
    negative mathematical evidence (AGENTS.md rule 5). In particular, the absence
    of numpy makes XCHK-2 NOT_RUN and changes no reported number; it is not a
    finding about the cost model. An unreached cell is UNREACHED and is
    distinguished in the artifacts from INFEASIBLE_AT_MEMORY and from
    NO_CROSSOVER_IN_WINDOW, which are substantive outcomes.

  success_criterion: >-
    A COMPLETE, VALID package in which: (1) RG-1..RG-5 all pass and their
    residuals are reported in bits; (2) BCG-1 passes (residual 0.0) at every
    committed row/law and BCG-2 fails as designed (residual = 0.5*L_mem(P)),
    both reported; (3) XCHK-1 agrees to 1e-12; (4) MONO-1, MONO-2, MONO-4,
    MONO-5 all pass with measured slopes and kink locations, and MONO-3
    reports a verdict or an explicit NOT_EVALUABLE with its count; (5) both
    null arms are computed through the identical code path and their
    displacements reported with min, max and argument; (6) the p_star_table is
    complete over all 4480 main cells with an explicit categorical label
    wherever no numeric locus exists; (7) every cell carries its extrapolation
    and interpolation stamps; (8) SCOPE-A/B/C are reported separately with the
    axis named; (9) the adversarial corner is reported explicitly, alongside
    its MC_VOW comparison value. Success is DELIVERY OF A COMPLETE PACKAGE,
    not a particular sign of the answer.

  falsification_criterion: >-
    H-SSI-7fe2bf is falsified, in the specific parts named, by any of:
    F1 (RG fails - H1 false, run void); F2 (the p* band is proportionally no
    narrower than the margin band - H3 false, the locus buys nothing);
    F4 (min D_null0 < 1.0 bit - H4 false, the correction is not load-bearing);
    F5 (MC_P13_CORRECTED and MC_VOW agree in sign everywhere - H2 false, the
    convention is not the controlling variable); F6 (D_null1 >= D_null0
    anywhere - the procedure does not resolve the estimator); F7 (MONO-5 fails
    - the anchor table is not what the hypothesis takes it to be). F3 (a
    numeric p* <= 512 at a memory-FEASIBLE cell with log2 w <= 40) is a
    concrete-threat CANDIDATE, not a falsifier, and triggers the escalation
    rule below. NEW: BCG-1 or BCG-2 failure is NOT a falsifier of H-SSI-7fe2bf
    -- it is a defect in THIS CONTRACT's own machinery (the same class F1
    covers) and voids the run before any hypothesis-level conclusion is drawn.

  escalation_rules:
    - >-
      F3 CANDIDATE. If any cell reports both a numeric p* <= 512 and
      log2 w >= L_mem(p*) at log2 w <= 40, the run halts reporting at the data
      level, marks the cell, and the Coordinator commissions independent
      review-breakthrough review before ANY claim is made. No artifact may state
      it as a security conclusion. Design-time note: L_mem(256) = 92.5 > 40, so
      no cell at log2 w <= 40 can satisfy the feasibility half under MC_VOW
      (the convention that defines feasibility). Under MC_P13_CORRECTED no cell
      is ever masked INFEASIBLE (cost diverges rather than becomes infeasible),
      so this half of the guard is evaluated per-convention as originally
      declared. If a cell nonetheless does satisfy both halves, the
      implementation is wrong before the world is.
    - >-
      VACUOUS SATISFACTION. A pre-registered bound satisfied only because the
      assessed method is memory-infeasible at that w is reported with the words
      VACUOUSLY SATISFIED and is never presented as substantive confirmation.
      IDEA-20260803-48e258's F3 is expected to be satisfied vacuously across its
      entire w range for exactly this reason, and saying so is the point.
      HONEST NOTE (carried, not repaired -- EV-SSI-455241): this mechanism as
      worded describes what happens under MC_VOW's explicit INFEASIBLE_AT_MEMORY
      masking; under MC_P13_CORRECTED no cell is ever masked, so "vacuous
      satisfaction" in that sense does not arise for MC_P13_CORRECTED cells,
      and the run must not describe an MC_P13_CORRECTED pass as vacuous merely
      because it would have been infeasible under MC_VOW at the same (P, w).

  scope_statement:
    required_axes:
      SCOPE-A_advantage_over_matched_baseline: >-
        The assessed method's advantage over the matched baseline, per NIST level,
        per scenario. PRE-REGISTERED PREDICTION: this advantage INCREASES with
        level, because the p^{1/2} - p^{1/3} spread grows with p. This is the
        axis on which EV-WESO-001's red-team observation "NIST-III/V margins
        survive all tested scenarios" is a statement about the ATTACK surviving,
        not about the scheme being safe.
      SCOPE-B_gap_below_the_levels_own_target: >-
        Assessed cost against 2^128 / 2^192 / 2^256. THE CORRECTED, GROWING
        gap: 9.5387 / 21.9537 / 38.8387 bits below target at NIST-I/III/V (S=0,
        A=0, c=0), per DEC-20260806-a00a28 (dispatcher-verified) and
        unaffected by Fix 1 (unbounded-memory computation, penalty term = 0 by
        the same argument as RG-1..RG-5; see
        preregistered_prediction.frozen_reference_values.gap_below_target_source).
        On this axis NIST-III/V are NOT safer than NIST-I in the
        unbounded-memory model -- the gap GROWS with level -- and the contract
        requires that be stated plainly rather than smoothed. This is the
        finding EXP-SSI-697354's design task refused to overwrite with the
        synthesis document's incorrect sentence, and DEC-20260806-a00a28
        confirmed the designer was right.
      SCOPE-C_memory_feasibility: >-
        Required table memory in bytes at 64 and 256 bytes per entry, against the
        committed global-storage figure of about 2^{73.08} bytes. PRE-REGISTERED
        PREDICTION: infeasible at ALL THREE levels, with infeasibility INCREASING
        with level (design-time: 2^{98.5} / 2^{144.6} / 2^{187.3} bytes at 64 B
        per entry). THIS IS THE ONLY AXIS ON WHICH NIST-III/V RETAIN MORE MARGIN
        THAN NIST-I, and any safety statement must name it.
    affected_conditionally_in_model: >-
      Constructions resting on the supersingular Isogeny / EndRing / OneEnd
      problem at log2 p in [256, 768] - the SQIsign family being the named
      instance - ONLY in the unbounded-memory model, ONLY conditional on
      Heuristic 1 and HEUR-XO-1..3, and ONLY as a cost model, never as an
      executed attack.
    safe_or_out_of_range: >-
      CSIDH and other group-action or torsion-based constructions are out of
      range entirely (EV-WESO-001 boundary: "Nothing here bears on
      CSIDH/(qt-)Pegasis or torsion-based schemes"). Every tested SQIsign level
      retains margin ON THE MEMORY-FEASIBILITY AXIS ONLY, at all three levels,
      under every tested overhead scenario, by margins that widen with level.
      On SCOPE-A and SCOPE-B the gap below target GROWS with level, so
      "NIST-III/V retain margin" is FALSE unqualified and is a
      claim_ceiling.forbidden_sentence.
    mandatory_qualifier: >-
      Every cost number emitted under this contract appears in the same sentence
      as (i) its memory requirement and (ii) its conditionality on Heuristic 1.
      Dropping either qualifier is a claim-tier violation per
      docs/claims-and-verification.md.

