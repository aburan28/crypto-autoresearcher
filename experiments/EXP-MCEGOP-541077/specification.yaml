experiment:
  id: EXP-MCEGOP-541077
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-ef56f2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-ef56f2
  question_id: RQ-MCE-e65b3c
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Statistic-by-rung separation matrix over a five-level binary-code family ladder -- random,
    alternant, reducible-g Goppa, non-squarefree-g Goppa, honest Goppa -- with a same-rung self-null
    in every cell and matched (n,k) enforced by resampling
  objective: 'One uncertainty is reduced: for each candidate structural statistic this program can
    compute, HOW FAR DOWN an ordered family ladder does it still separate, and where exactly does
    it go blind? Stated in parts: (i) THE MATRIX -- the AUC and equal-error rate for each of five
    statistics separating honest Goppa from each of four lower rungs, at matched (n, k), computed
    from raw per-sample tables rather than from summaries. The single reusable output is, per statistic,
    the lowest rung it still distinguishes, which is a durable fact about the instrument that outlives
    whatever hypothesis prompted the run. (ii) WHETHER ANY CELL MEANS ANYTHING -- the same-rung self-null
    in every cell, computed by splitting one rung''s samples in half and running the identical scoring.
    Any cell whose self-null strays from one half is void, and reporting void cells as such is as
    much a deliverable as reporting live ones. Without this the matrix would be an elaborate way to
    publish an artefact. (iii) SHAPE -- whether the matrix is staircase-monotone as the algebraic
    argument predicts, with each statistic collapsing at the rung where the condition it detects disappears
    and staying collapsed. A replicating non-monotonicity would be the most interesting single observation
    the contract can produce and would require its own follow-up rather than an interpretation here.
    No arm touches a real key, a deployed parameter set, or any external text.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A completed run could support exactly this: that at the tested
      toy cells, over the declared samplers and matching rule, this program''s implementations of
      five named statistics separated the named family rungs at the reported AUCs and equal-error
      rates, with the reported same-rung self-nulls and void markings, and with the reported rung
      constructibility and resample rates. What does NOT follow: nothing about any published distinguisher,
      whose content this program has not read and does not assert; nothing about Classic McEliece
      or any standardized parameter set; no attack, no key recovery, no security consequence; and
      no claim that a statistic blind at one rung is blind in general, since blindness is measured
      at specific (n, k) with specific samplers and every toy cell here is high-rate by construction.'
  inputs:
    procedure: 'STAGE 0 (cost: minutes). Freeze the five rungs, the five statistics, the matching
      rule, the sample sizes, the self-null band and the multiplicity correction. STAGE 1 (cost: dependent).
      Load the certified fixture and verify it. STAGE 2 (cost: minutes to an hour per cell). Build
      all five rung samplers and generate 200 codes per rung, resampling to match k and recording
      the resample rate; audit rung constructibility before proceeding. STAGE 3 (cost: minutes per
      cell). Compute all five statistics on every code, storing raw tables. STAGE 4 (cost: seconds).
      Run the invariance control on 20 codes per rung. STAGE 5 (cost: seconds). Compute cross-rung
      AUCs and equal-error rates for all twenty (statistic, rung) pairs per cell. STAGE 6 (cost: seconds).
      Compute the same-rung self-null for all twenty-five cells and mark void ones. STAGE 7 (cost:
      seconds). Run the bottom-rung anchor across two independent random samplers. STAGE 8 (cost:
      minutes). Apply the frozen multiplicity correction, compute monotonicity violations, and emit
      the full matrix with raw tables. Total budget 3 CPU-hours.'
    instrument: Python 3.11 standard library only (numpy absent, verified). Consumes harness/goppa_toy.py
      from proposal 1 for field arithmetic, construction and GF(2) elimination, and the Schur routine
      from proposal 3. Adds four further rung samplers (alternant with uniform multiplier, reducible-g
      Goppa, non-squarefree-g Goppa, random binary with rank rejection) and three further statistics
      (hull dimension, sampled minimum-distance proxy, rank deficiency under random column subsets),
      all over the shared primitives. AUC by the Mann-Whitney identity computed directly from raw
      samples. Driven through harness/runner.py with domain-separated seeds. No Sage, no external
      package, no network.
    parameters: 'Cells: (m,t,n) in {(6,4,64), (6,3,48), (5,3,32)}. Rungs: 5. Statistics: 5. Samples:
      200 per rung per cell, giving 3000 codes total. Matching: exact realised k equal to rung 5''s,
      resample cap 10 then declare the rung unconstructible. Self-null: 100/100 split per rung per
      statistic. Minimum-distance proxy: minimum weight found among 10^4 random codeword samples.
      Column-subset rank statistic: 200 random subsets of size k per code. Multiplicity correction:
      Holm across the twenty cross-rung tests within each cell, frozen in advance. Bottom-rung anchor
      across two independent random samplers with 200 codes each.'
  controls:
  - Same-rung self-null in every cell, by splitting one rung's samples in half.
  - 'Bottom-rung anchor: rung 1 against rung 1 across two independent random-code sampler implementations.'
  - Matched-(n,k) enforcement across all rungs by resampling, with the resample rate reported per
    rung.
  - 'Invariance control: each statistic recomputed after a random invertible row operation and column
    permutation, required unchanged.'
  - 'Rung-constructibility audit: the count of rungs actually constructible at matched k, per cell,
    reported before any AUC is read.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null is built into every cell of the matrix and is what makes the
    matrix readable. SAME-RUNG SELF-NULL: for each statistic and each rung, split that rung''s 200
    samples into two halves of 100 and compute the AUC of one half against the other. The identical
    statistic, the identical scoring code and the identical AUC routine run in the same invocation;
    the only difference is that both samples come from one population. The self-null must land in
    [0.42, 0.58]; any cell whose self-null falls outside is marked VOID and its cross-rung AUC in
    the same row is not reported as a result. This is the strongest available check that a separation
    is not manufactured by the pipeline, and it costs nothing beyond a split. A second control is
    the BOTTOM-RUNG anchor: rung 1 versus rung 1 across two independent sampler implementations, which
    additionally checks that the random sampler itself is stable -- the concern proposal 10 of this
    set is devoted to.'
  independent_variables:
  - cell (m, t, n)
  - family rung (1..5)
  - statistic (1..5)
  - condition (cross-rung | same-rung self-null | invariance control)
  metrics:
    primary:
    - AUC per (statistic, rung) cell
    - equal-error rate per cell
    - same-rung self-null AUC per cell
    - lowest rung separated per statistic
    secondary:
    - raw per-sample statistic tables
    - resample rate, realised k and rung constructibility count per rung and cell
    - monotonicity violation count
    - void cell count
    - Holm-adjusted significance per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: For each statistic, the lowest family rung it separates from honest Goppa at AUC >=
      0.8 after the frozen multiplicity correction, together with every cell's same-rung self-null.
    formula: 'AUC(X,Y) = P(S_X > S_Y) + 0.5 P(S_X = S_Y) computed as the Mann-Whitney statistic on
      raw samples, where S is the statistic under test. SelfNull(rung, statistic) = AUC of a 100/100
      split of that rung''s samples, required in [0.42, 0.58]. LowestRung(statistic) = min{r : AUC(rung
      5, rung r) >= 0.8 and the cell is not void}. Pre-registered: every SelfNull in [0.42, 0.58];
      at least one statistic with LowestRung = 1 only, i.e. blind to rung 2.'
    source: Pre-registered in the parent proposal IDEA-20260816-ef56f2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Cells at m in {5,6}, n <= 64, inside RQ-MCE-b38a8b''s toy boundary. The largest
      cell is chosen deliberately because it is the only one with enough room for the reducible-g
      and non-squarefree-g rungs to be algebraically distinct from honest Goppa; at m=4, t=2 a reducible
      g is a product of two linear factors and the ladder is degenerate. NO extrapolation is offered:
      every toy cell is high-rate by construction, which is the regime most favourable to every statistic
      in the matrix, so a live cell at toy scale provides no evidence about behaviour at deployed
      rates.'
    correspondence: null
  tail_checks:
  - Void cells are reported with their self-null values, never omitted.
  - Rungs declared unconstructible at a cell are reported with their resample rates.
  - Any AUC exactly at 1.0 is inspected for a dimension or sampler mismatch rather than celebrated.
  - The rung pair that is algebraically closest (4 versus 5) is examined separately, since it is where
    degeneracy would first appear.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop and report if any self-null in the minimal three-rung, two-statistic pilot falls outside
    [0.42, 0.58].
  - Declare a rung unconstructible after 10 failed resamples rather than relaxing the matching rule.
  - Cap total wall-clock at 3 CPU-hours and report unreached cells.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: For each cell, the full statistic-by-rung matrix is emitted with raw per-sample
    tables, every entry carries its same-rung self-null and void status, rung constructibility and
    resample rates are reported before any AUC is read, and the frozen multiplicity correction is
    applied without modification.
  falsification_criterion:
  - Any reported cell whose same-rung self-null lies outside [0.42, 0.58].
  - Any statistic changing under a random row operation or column permutation.
  - Fewer than four constructible rungs at a cell reported as a full ladder.
  - A replicating monotonicity violation left unresolved in a reported row.
  - All five statistics separating every rung equally, indicating the rungs are not distinct at that
    cell.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-ef56f2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact definition of the reducible-g and non-squarefree-g rungs -- which factorisation patterns
    are admitted, and whether g must remain coprime to the support -- must be frozen by the Coordinator,
    since these two rungs do not exist anywhere in the repository and their definition determines
    what the matrix measures.
  - The multiplicity correction (Holm across twenty tests within a cell) is asserted rather than derived
    and must be approved before any result is seen.
  - Whether the sampled minimum-distance proxy is admissible as a statistic given that it is itself
    an estimate needs a ruling; its sampling error enters every AUC in its row.
  - Whether this contract may run before proposals 1 and 3 have passed their own controls is a sequencing
    decision for the Coordinator.
