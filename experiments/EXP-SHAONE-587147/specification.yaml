experiment:
  id: EXP-SHAONE-587147
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-962936; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-962936
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Implement the chosen-prefix cost model as a dimensioned pure function, compute analytic and
    finite-difference elasticities and Sobol variance shares at several base points, and compare against
    100 structurally scrambled null models.
  objective: 'The one uncertainty a run reduces is whether a chosen-prefix cost model''s disagreements
    can be localised to a single declared input, so that arguing about the cost becomes arguing about
    that input rather than about a total. Stated as parts: (i) it establishes whether the model can
    be implemented as a dimensionally consistent pure function with no hidden constants and with every
    input carrying a declared range and a stated provenance, which is a precondition the RQ makes
    binding and whose failure -- an input whose provenance cannot be stated -- is itself a reportable
    outcome that widens rather than narrows the model''s uncertainty; (ii) it computes the partial
    elasticity of every output to every input analytically where possible and by finite differences
    elsewhere, cross-checking the two, and runs a Sobol decomposition to report first-order and total-order
    variance shares, together with the elasticity ordering at several declared base points so that
    a fragile ordering is visible rather than assumed away; (iii) it runs the identical machinery
    over 100 structurally scrambled models preserving inputs, units and term count, so that variance
    concentration attributable to the declared ranges alone can be separated from concentration attributable
    to the model''s structure. No cryptographic computation occurs and no cost figure is endorsed.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for THIS structural
      form, THESE declared inputs with THESE ranges and THESE base points, the elasticities are these
      values, the total-order variance shares are these, the ordering is stable or unstable across
      base points as reported, and the real model''s concentration compares to the scrambled null
      distribution in this way. WHAT DOES NOT FOLLOW: no endorsed cost for any attack, no statement
      that any published figure is right or wrong, no validation of the structural form itself, nothing
      about SHA-1''s security, and no statement about any deployed system. A sensitivity result inherits
      none of the credibility of the model it is computed over.'
  inputs:
    procedure: 'STAGE 0 (cost: 3 human-hours): receive the structural form from the companion decomposition,
      declare every input with unit, base value, range and provenance, and declare the base points,
      the scramble count and the Sobol sample size. Inputs lacking provenance get widened ranges,
      recorded as such. STAGE 1 (cost: 3 human-hours): implement f as a pure function with a mechanical
      dimensional-consistency checker over every term; halt on any unit failure. STAGE 2 (cost: minutes):
      compute analytic elasticities where closed forms exist and finite-difference elasticities everywhere,
      with step-size convergence checked; cross-check and halt on disagreement beyond tolerance. STAGE
      3 (cost: minutes): run the Sobol decomposition at the primary base point, reporting first-order
      and total-order indices. STAGE 4 (cost: minutes): repeat STAGES 2 and 3 at each additional declared
      base point and under the range-doubling control; report the ordering at each. STAGE 5 (cost:
      minutes): generate 100 dimensionally consistent structurally scrambled models and run the identical
      machinery, producing the null distribution of top-input variance share. STAGE 6 (cost: 1 human-hour):
      count inputs near kinks, assemble the elasticity table, and report every disagreement with the
      predictions as such.'
    instrument: Python 3.11 with numpy for the model evaluation and finite differences; SALib or an
      equivalent pure-Python Sobol sampler for the variance decomposition, with the sampler's own
      convergence checked by doubling the sample size; a small custom dimensional-analysis layer that
      carries units through every term and refuses to evaluate an inconsistent expression; sympy only
      for closed-form partial derivatives where the model is symbolically differentiable, and NOT
      as a computer-algebra crutch elsewhere; harness/runner.py for the run manifest and deterministic
      scramble seeding. No Sage.
    parameters: 'Declared inputs: at least five -- device unit price, device throughput in evaluations
      per second, memory price per byte, power draw and electricity price, and duty factor -- each
      with base value, range and provenance. Base points: 3, spanning the plausible range. Sobol sample
      size: 2^14 base samples, doubled once to check convergence. Scrambled null models: 100. Range-doubling
      control: 1 full repeat. Finite-difference step sizes: 3 per input, checked for convergence.
      Kink proximity threshold: declared as one range-width.'
  controls:
  - 100 structurally scrambled models with matched inputs, units, base values, ranges and term count,
    same invocation.
  - Analytic versus finite-difference elasticity cross-check wherever both are computable.
  - Mechanical dimensional-consistency check over every term, run before any number is produced.
  - Multiple declared base points spanning the plausible range, with the elasticity ordering reported
    at each.
  - 'Range-widening control: rerun with every input''s range doubled, to see whether the dominant
    input is dominant because of structure or because of a wide range.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Structurally scrambled model: preserve the input names, units, base
    values, ranges and the number of composition terms, but rewire the composition randomly subject
    only to dimensional consistency, then run the IDENTICAL elasticity and Sobol machinery in the
    same invocation over at least 100 scrambles. The null must show a materially different distribution
    of variance shares -- in particular, if scrambled models also concentrate variance in one input
    at comparable rates, then dominance is a property of having one input with a wide declared range
    rather than a property of the model''s structure, and the signal arm''s dominance claim collapses
    to a statement about the declared ranges.'
  independent_variables:
  - declared input identity
  - base point
  - model arm (real / structurally scrambled / range-doubled)
  - elasticity method (analytic / finite-difference)
  metrics:
    primary:
    - partial elasticity per output-input pair
    - first-order and total-order Sobol index per input
    - top-input total-order variance share, real model
    - null distribution of top-input variance share over 100 scrambled models
    secondary:
    - elasticity ordering at each base point and under range doubling
    - analytic versus finite-difference agreement per input
    - count of inputs near a model kink
    - Sobol convergence between the two sample sizes
    - dimensional-consistency result per term
  heuristic_under_test: null
  preregistered_prediction:
    quantity: S_max, the largest total-order Sobol index across declared inputs in the real model,
      and its percentile within the 100-model scrambled null distribution of the same statistic.
    formula: Predicted S_max >= 0.4 and S_max at or above the 90th percentile of the scrambled null
      distribution, with the top-ranked input identical at all three declared base points. Elasticity
      is defined as E(O,x) = (partial O / partial x) times (x / O) evaluated at the base point; total-order
      Sobol indices are computed over the declared independent marginals with 2^14 base samples.
    source: Pre-registered in the parent proposal IDEA-20260816-962936 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are five declared inputs, three base points, 2^14 Sobol base
      samples and 100 scrambled null models -- toy because the entire experiment is arithmetic over
      a declared function and involves no cryptographic computation whatsoever, which is precisely
      why it is cheap enough to run before any expensive measurement. Transfer assumption stated explicitly:
      the elasticity vector describes the SUPPLIED structural form only, and transfers to no other
      form; and because the structural form is an input rather than a result, no part of this contract''s
      output carries evidence about whether that form is correct.'
    correspondence: null
  tail_checks:
  - Report the full scrambled-null distribution of S_max, not just its mean, and state the real model's
    percentile within it.
  - Check finite-difference convergence across three step sizes per input and disclose any input where
    it fails.
  - Report every input whose provenance was unavailable and whose range was consequently widened,
    individually.
  - Check whether the Sobol indices sum near 1 for first-order plus interactions; a large unexplained
    remainder indicates strong interactions the elasticity summary cannot express.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt at STAGE 1 on any dimensional-consistency failure and report the failing term as the outcome.
  - Halt at STAGE 2 on analytic versus finite-difference disagreement beyond tolerance.
  - Stop and report a range-driven finding, rather than a structural one, if the scrambled null distribution's
    median S_max is within 0.05 of the real model's.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if the model passes dimensional consistency, elasticities
    agree across methods where both exist, and S_max is reported with its percentile in the 100-model
    scrambled null at all three base points -- regardless of whether structure or declared ranges
    turn out to drive the concentration.
  falsification_criterion:
  - Scrambled null median S_max within 0.05 of the real model's, showing concentration is a property
    of declared ranges rather than structure.
  - Top-ranked input differs across the three base points, showing the elasticity summary does not
    transport.
  - Analytic and finite-difference elasticities disagree beyond tolerance for any input where both
    exist.
  - Three or more inputs sit within one range-width of a kink, so an elasticity summary is not well-defined.
  - Sobol first-order indices leave a large unexplained interaction remainder, showing the model is
    not summarisable by per-input shares.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-962936
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The structural form must arrive from the companion near-collision-block decomposition or from
    another approved source; this contract cannot be approved before that form exists, and the Coordinator
    must sequence them.
  - Every declared input range needs provenance the Coordinator accepts; a range asserted without
    provenance makes S_max unfalsifiable and must be widened or flagged.
  - Whether the memory-charging convention here matches whatever GOAL-RSA-001 fixes is unresolved,
    and GOAL-SHA1-001's non_duplication clause requires binding to it rather than inventing a second
    convention.
  - The scramble generator's definition of a structurally different but dimensionally consistent rewiring
    needs precise specification, since a weak scrambler produces near-copies and a strong one produces
    nonsense.
