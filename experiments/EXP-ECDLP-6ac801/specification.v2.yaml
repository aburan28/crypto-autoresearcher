        subsequent audit, never a substitute for an independent re-seal).
      what_does_not_need_to_be_rerun: >-
        Stage B/C's existing production result for a = 1/8 (5/5 seeds,
        G3-FEASIBLE, RUN-ECDLP-6ac801-001..006, already computed correctly
        under this exact formula, per `a_1_8_disagreement_root_cause`'s
        `what_production_actually_does`) does NOT need to be re-run. Only
        Stage A's blind re-derivation at a = 1/8 is being redone; the new
        sealed a = 1/8 result is compared, cell by cell, against the
        ALREADY-EXISTING production a = 1/8 reading recorded in
        experiments/EXP-ECDLP-6ac801/runs/RUN-ECDLP-6ac801-{001..005}/'s
        own raw-result.json and summary.json (unchanged, unedited, exactly
        as committed).
      resolution_rule: >-
        Only AFTER this re-sealed a = 1/8 result is produced and compared
        may a = 1/8 be reported, by a further committed Coordinator
        decision, as S1 CONFIRMED FEASIBLE, S2 CONFIRMED INFEASIBLE, or a
        genuinely new S3 DISAGREEMENT (per `success_criterion`'s own S1/S2/S3
        taxonomy, unchanged by this amendment). This amendment does not
        itself predetermine which of those three outcomes will result.

  controls:
    - >-
      (a) BLIND RE-DERIVATION CONTROL (REQUIRED, frozen): see
      `blind_rederivation`. No cell is evidence before the seal exists.
    - >-
      (b) a = 1/4 REPLICATION CONTROL: T_sel = T/2 at a = 1/4, r = 2,
