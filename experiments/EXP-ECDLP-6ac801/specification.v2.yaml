      seal_timing_requirement: >-
        The new re-derivation must be SEALED (hashed and timestamped) BEFORE
        the reviewer performing it opens ANY `blind_from` path listed above,
        exactly as `procedure` above already requires for a first-time Stage
        A derivation. In particular, the reviewer performing this re-seal
