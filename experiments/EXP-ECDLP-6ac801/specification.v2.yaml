      instrument (see `invalidation_rules`), independent of any other cell's
      result.
    - >-
      (c) EXACT-COVERAGE NON-EXCEEDANCE: no exact top-T_sel share may exceed
      1.0 or the exact top-T share (T > T_sel); an exceedance is an
      implementation error, not a result (mirrors v1/v2's own structural
      tell).
    - >-
      (d) DEFINITIONAL IDENTITY WITH THE v2 G3 RULE: the feasibility
      criterion applied here is REUSED VERBATIM from
      experiments/EXP-ECDLP-612fb1/specification.v2.yaml
      `inputs.g3_gate_procedure`, not re-derived or re-worded, specifically
      to rule out a units/definition mismatch as the source of any
      confirmed discrepancy (this contract's own outcome (b) names that
      possibility explicitly and this control is what would surface it).
    - >-
      (e) SEED-COUNT PARITY: 5 seeds per a, matching Stage 0's and v2's own
      seed count, so this batch's statistical power is comparable, not
      thinner, than the batch that produced the original discrepancy.
    - >-
      (f) [v2 AMENDMENT, ADDITIVE] SELECTION-FORMULA IDENTITY: the re-sealed
      a = 1/8 blind re-derivation required by
      `blind_rederivation.v2_rerequirement_a_1_8` must apply EXACTLY the
      `STATIC(T)_r pool-selection weight formula (v2 amendment item 1)`
      stated in `definitions` above, with no further drift or
      reinterpretation; a re-seal that silently applies yet a third,
