  hypothesis_test_boundary_note: >-
    UNCHANGED from v1/v2: H-ECDLP-37dc01's own `statement` and
    `test_boundary.parameters` scope `a` to {1/4, 1/2} ONLY, so testing at
    a in {1/16, 1/8, 3/16} is OUTSIDE that stated boundary, and that widening
