    H-ECDLP-37dc01's status and does not; it stays `analyzed`.

  objective: >-
    UNCHANGED from v1/v2 for the N = 2^24 arm, retained by reference: see
    experiments/EXP-ECDLP-6ac801/specification.v2.yaml `objective`. v1's Stage
    B/C already discharged that objective at all four a-values, and those runs
    are not re-run and not re-scored by this contract.
  objective_v3: >-
    v3's OWN OBJECTIVE, stated in full because it is what the executor and the
    re-deriver are held to.
      For each a in {1/16, 1/8, 3/16, 1/4}, at BOTH N = 2^20 (T = 64,
    T_sel = 32) and N = 2^24 (T = 256, T_sel = 128), r = 2, over 25
    pre-registered seeds (1..25), compute per (N, a, seed): the exact
    top-T_sel basin share, the STATIC(T)_{r=2} exact coverage, their
    difference (the G3-style margin), and the four accounting quantities the
    cap convention makes necessary (cycle_mass, capped_mass, capped_walks, and
    the residual fraction). Apply the v2 G3-style feasibility criterion,
    verbatim, to determine at each (N, a) whether T_sel = T/2 is G3-feasible.
      Do this INDEPENDENTLY TWICE: once as STAGE A'' (a from-scratch blind
    re-derivation whose entire permitted reading before its seal is the
    enumerated derivation packet), and once as STAGE B''/C'' (production,
    reusing the commit-pinned instrument). Then compare, per (N, a), on the
    PASS-COUNT and the SIGN OF THE MEAN MARGIN -- two resampling-free
    integers-and-signs quantities -- never on an interval endpoint.
      Run every declared control, each of which has a state of the world in
    which it fires on a correct implementation. Report the a = 1/4 cell FIRST,
    because it is this batch's known-false object.
      NOTHING ABOUT THIS OBJECTIVE PREDICTS AN OUTCOME. The contract states no
    expected verdict, pass-count, margin or crossing bracket at a = 1/16,
    a = 1/8 or a = 3/16 at either N; see `preregistered_prediction` for where
    the Coordinator's expectation is recorded and why it is not here.

  definitions: # v2 AMENDMENT NOTE, RETAINED: every key from "N" down to and
               # including "STATIC(T)_r pool-selection weight formula (v2
               # amendment item 1...)" is reproduced BYTE-IDENTICALLY from the
               # APPROVED experiments/EXP-ECDLP-6ac801/specification.v2.yaml
               # `definitions`. v3 AMENDMENT NOTE: NINE new keys are APPENDED
               # after them, each marked "(v3 amendment item k, ADDITIVE)".
               # No existing wording is touched. Where a v3 key ADDS a value
               # at a scale v2 left blank, it says so explicitly and leaves
               # every v2 number in force.
    N: "order of the group (or size of the set for the generic instrument); fixed at 2^24 = 16777216 for this contract (one scale up from the v2 Stage 0 a-scan's N = 2^20)"
    T: "nominal table size N^{1/3} rounded = 256 at N = 2^24"
    T_sel: "number of entries STORED (the advice); FIXED at T/2 = 128 for this contract (the ORIGINAL clause (C1) value, not the v2 grid's 0.65T/0.75T)"
    W: "expected walk length between DPs, W = sqrt(a N / T); theta = 1/W"
    a: "T W^2 / N; a_grid = {1/16, 1/8, 3/16, 1/4} for this contract (see `hypothesis_test_boundary_note`)"
    r: "precomputation pool ratio; FIXED at r = 2 for this contract (the value at which the original discrepancy was found; matches the operating point found feasible)"
    exact top-T_sel basin share: >-
      the exact fraction of the N points whose walk terminates, under the
      exact (non-sampled) basin partition of the DP-truncated functional
      graph, in one of the T_sel largest basins by size -- computed by full
      enumeration, not walked online, exactly as v1/v2's `exact_basins`
      procedure and Stage 0's own a-scan compute it.
    STATIC(T)_r exact coverage: >-
      the exact fraction of the N points covered by the T basins selected
      by the published Bernstein-Lange weight from an r T-distinct-DP
      precomputation pool at ratio r, read exactly (not sampled) from the
      same basin partition -- v1/v2's own STATIC(T) arm's exact-coverage
      reading.
    "G3-style feasibility criterion (this contract's operative rule, IDENTICAL IN FORM to experiments/EXP-ECDLP-612fb1/specification.v2.yaml `inputs.g3_gate_procedure`, reused verbatim to prevent the exact definitional/units mismatch that is this contract's own outcome (b))": >-
      at a given a, T_sel = T/2 is G3-FEASIBLE iff exact top-T_sel basin
      share >= STATIC(T)_r exact coverage in >= 4 of the 5 seeds; otherwise
      G3-INFEASIBLE (equivalently, per-seed rho_ORACLE = the smallest
      T_sel/T at which the exact share equals STATIC(T)'s coverage; T/2 is
      feasible at a seed iff rho_ORACLE < 0.5 at that seed -- the SAME
      arithmetic the orchestrating session's second, independent
      confirmation used on EV-ECDLP-f6b3f5).
    crossing point: >-
      the (open) interval between the largest a at which T_sel = T/2 is
      G3-feasible and the smallest a at which it is not, as bracketed by
      this contract's own a_grid; this contract locates the crossing to
      within the grid's own resolution (between 1/8 and 3/16, per the
      Stage 0 N = 2^20 reading) and does NOT interpolate a point estimate
      beyond that bracket (a finer grid is out of scope; see `out_of_scope`).
    seed: "walk-key seed for the generic instrument; 5 seeds per a, matching Stage 0's and v2's own seed count."
    "STATIC(T)_r pool-selection weight formula (v2 amendment item 1, ADDITIVE -- resolves the underspecification named by protocol_amendment.reason and by TASK-20260907-80e198 validation_report.yaml `a_1_8_disagreement_root_cause`)": >-
      "STATIC(T)_r exact coverage" above names "the published
      Bernstein-Lange weight" but v1's own text never stated the formula --
      a genuine gap in the frozen contract, not a physics disagreement (see
      `protocol_amendment.reason`). The formula, stated explicitly and
      completely for the first time in this contract by this amendment, IS:

        weight_d = S_d + 4 * W * h_d

      where, for each distinguished point (DP) d collected into the r*T
      precomputation pool during pool generation (uniform random restarts,
      batched, every walk charged):
        - "d" is one DP entry in the r*T-distinct-DP pool (an index into the
          pool, not a group element by itself beyond its DP identity).
        - "S_d" is the SUM, over every pool-construction walk that
          terminated at DP d, of that walk's GENERATING-WALK LENGTH (the
          number of steps from that walk's own start/restart point to its
          termination at d). A DP hit by three separate walks of lengths
          L1, L2, L3 has S_d = L1 + L2 + L3.
        - "h_d" is the HIT COUNT of DP d: the number of distinct
          pool-construction walks that terminated at d (h_d = 3 in the
          example above).
        - "W" is `definitions.W` above (the expected walk length between
          DPs, W = sqrt(a N / T)), the SAME W used everywhere else in this
          contract; the constant multiplier on the h_d term is exactly 4
          (not 4W^2, not W/4 -- the literal coefficient is "4 * W").
      The T pool entries with the T LARGEST values of weight_d (ties broken
      by an arbitrary but fixed key, per the tie-break discipline already
      used by the reused instrument) are SELECTED into STATIC(T)_r's table;
      "STATIC(T)_r exact coverage" is then read, exactly (not sampled), as
      the true exact-basin coverage of that SELECTED set -- the selection
      is by the realistic estimator weight_d above, never by the selected
      entries' own true exact basin size (an oracle selection is a
      DIFFERENT, NOT-STATIC(T)_r, and objectively worse-performing-for-the-
      table-builder quantity; see `protocol_amendment.reason` for the
      demonstrated numerical effect of conflating the two).
      SOURCE / PRIOR ART: this is the published Bernstein-Lange
      selection-weight formula for a distinguished-point precomputation
      pool (the "published Bernstein-Lange weight" `STATIC(T)_r exact
      coverage` above already names), and it is ALREADY IMPLEMENTED,
      unchanged, by this contract's own reused Stage B instrument: class
      `Pool`, method `weights`, in
      experiments/EXP-ECDLP-612fb1/source_v2/instrument.py, lines 445-446
      (verified by direct read of that file at this amendment's authoring
      time): `def weights(self, W: float) -> np.ndarray: return
      np.asarray(self.S, dtype=np.float64) + 4.0 * W *
      np.asarray(self.h, dtype=np.float64)`, where `self.S` and `self.h`
      are accumulated per-DP exactly as `S_d`/`h_d` are defined above (see
      `Pool.add_or_credit`/`Pool.credit_index` in the same file, which
      accumulate `self.S[j] += length` and `self.h[j] += count` per
      pool-construction walk credited to pool index j). This formula
      GOVERNS, and always has governed, Stage B/C's already-executed
      production runs (RUN-ECDLP-6ac801-001..006); this amendment adds NO
      new computation to Stage B/C and does not re-run it. It exists solely
      so that any FUTURE independent from-scratch (blind) re-derivation of
      STATIC(T)_r under this contract has the same formula available that
      production has always used, closing the gap that produced
      TASK-20260907-80e198's a = 1/8 sealed disagreement.

    "WALK CAP (v3 amendment item 1, ADDITIVE -- discharges blocking defect D2 of DEC-20260907-4e34c5; THE MOST LOAD-BEARING ADDITION IN THIS AMENDMENT)": >-
      THE PROBLEM THIS CLOSES. Every quantity in this contract is read off a
      basin partition that production TRUNCATES at a walk cap. The strings
      `cap`, `CAP_MULT`, `cycle_mass` and `capped_mass` appear ZERO times in
      the approved v2 (and zero times in v1), so a from-scratch re-deriver
      had to invent the convention. The independent gate that refused this
      contract's predecessor draft found exactly this, and called it the same
      class of gap as the one that produced the original a = 1/8 sealed
      disagreement -- relocated from the selection weight to the cap.

      THE CONVENTION, AS A FORMULA IN THE MEASURED QUANTITIES:

        cap(N, a) = ceil( 8 * W(N, a) ),   W(N, a) = sqrt( a * N / T(N) )

      with T(N) the frozen table T(2^20) = 64, T(2^24) = 256, T(2^30) = 1024
      (see `T (v3 amendment item 4...)` below).

      WHAT `cap` IS, EXACTLY. A COUNT OF WALK STEPS (group operations); a
      non-negative integer; the LEAST INTEGER >= 8*W. It is NOT 8*W
      truncated, NOT round(8*W), and NOT a distance in any other unit. The
      multiplier is exactly 8. In production the float64 value of 8*W is
      passed through math.ceil and then int(...).

      READ OFF THE PRODUCTION IMPLEMENTATION, NOT PARAPHRASED FROM A
      DECISION RECORD. The three governing lines, verbatim, from
      experiments/EXP-ECDLP-612fb1/source_v2/instrument.py -- the
      commit-pinned instrument this contract's own `instrument` field names
      and Stage B imports:
        line 31: `CAP_MULT = 8                                  # cap = 8W`
        line 75: `self.W = math.sqrt(self.a * self.N / self.T)`
        line 77: `self.cap = int(math.ceil(CAP_MULT * self.W))`

      WHERE THE CAP BITES -- BOTH PLACES, BOTH BINDING:
        (i) THE EXACT BASIN PARTITION. `exact_basins` assigns a point to a
        basin only if its distance to its first DP is <= cap; see
        `EXACT-BASIN RESIDUAL MASS ACCOUNTING (v3 amendment item 2...)`
        below for the exact three-class partition and the accounting
        identity that replaces the false claim that the partition is
        exhaustive.
        (ii) POOL CONSTRUCTION. `walk_to_dp` (instrument.py lines 126-151)
        stops at the cap: its loop condition is
        `while active.size and steps < P.cap` (line 141), it returns
        terminal = -1 for a capped walk, and it charges
        `length[active] = P.cap` to the survivors (line 150).
        `generate_pools` (lines 243-289) then charges EVERY walk's length to
        the precomputation cost (`P_cost += L`, line 268) but credits ONLY
        the terminating ones: a capped walk (t < 0) increments a
        `capped_walks` counter and contributes NOTHING to any S_d or h_d,
        while a terminating walk credits `S[j] += L` and `h[j] += 1` at its
        DP's pool index.
        CONSEQUENCE, STATED BECAUSE IT IS EXACTLY WHAT A RE-DERIVER WOULD
        GET WRONG: a pool-construction walk that reaches the cap is charged
        its `cap` steps and credits NO S_d and NO h_d. A reading that
        instead credits a capped walk to the DP it would eventually have
        reached computes a different weight_d, hence a different
        STATIC(T)_{r} selection, hence a different exact coverage. Both
        readings MUST report `capped_walks` per cell so this is checkable
        rather than invisible.

      A CONSEQUENCE OF THE FORMULA, NOT A MEASUREMENT: because cap grows
      like sqrt(a*N/T) while the walk-length distribution has mean W, the
      cap sits at 8 mean walk lengths. This contract makes NO claim about
      how much mass that leaves unassigned at any cell; that is a measured
      quantity of this batch, required per cell of both readings, and is
      reported, never predicted.

    "EXACT-BASIN RESIDUAL MASS ACCOUNTING (v3 amendment item 2, ADDITIVE -- the second half of D2's discharge; replaces a FALSE identity with an exact one)": >-
      THE FALSE STATEMENT, NAMED SO IT CANNOT PROPAGATE. The refused sidecar
      draft (experiments/EXP-ECDLP-6ac801/specification.v2.BATCH-e9fd22-proposed.yaml,
      lines 92 and 169) asserts that the basin partition is exhaustive:
      "sum over all d of b(d) = N". THAT IS FALSE of the object production
      computes, and it is stated here explicitly -- rather than merely
      omitted -- because a reader arriving from that draft will have seen it
      and must be told which way it was resolved. THE APPROVED v2 IS SILENT
      on the question, so v3 retracts no approved sentence; it fills a
      silence and corrects a draft.

      THE THREE DISJOINT, EXHAUSTIVE CLASSES. For each of the N points x let
      dist(x) be the number of walk steps from x to the first distinguished
      point on its forward orbit, and reach(x) the predicate that such a DP
      exists at all. `exact_basins` (instrument.py lines 194-215) computes
      dist by pointer doubling with DPs made absorbing, saturates dist at
      sat = 2^n_bits for points with no DP on their orbit, and then
      partitions the N points into:
        (1) ASSIGNED:     reach(x) AND dist(x) <= cap.
                          line 209: `ok = reach & (dist <= P.cap)`
        (2) CYCLE MASS:   NOT reach(x) -- a DP-free cycle, or a tail feeding
                          one.
                          line 210: `cycle_mass = int((~reach).sum())`
        (3) CAPPED MASS:  reach(x) AND dist(x) > cap.
                          line 211: `capped_mass = int((reach & ~ok).sum())`
      BASIN SIZES ARE COUNTED OVER CLASS (1) ALONE. Lines 212-213:
      `idx = np.searchsorted(dps, nxt[ok]...)` then
      `size = np.bincount(idx, minlength=len(dps))`. So sum_d b(d) is
      exactly the cardinality of class (1).

      WHERE THE RESIDUAL GOES: NOWHERE. It is not assigned to any basin, not
      redistributed, and not silently discarded -- it is REPORTED, as the two
      named integer fields `Basins.cycle_mass` and `Basins.capped_mass`
      (declared at instrument.py lines 164-165 with the comments "points that
      never reach a DP (DP-free cycle and its tails)" and "points whose first
      DP lies beyond the cap"). A point on a DP-free cycle, a point in a tail
      feeding such a cycle, and a point whose first DP lies beyond the cap
      all belong to NO basin.

      THE TRUE RELATION, WHICH REPLACES THE FALSE IDENTITY:

        sum over all DPs d of b(d)  =  N - cycle_mass - capped_mass

      equivalently, as an exact accounting identity every reading must
      satisfy in integer arithmetic with ZERO tolerance:

        sum_d b(d)  +  cycle_mass  +  capped_mass  =  N

      This is an identity of the object `exact_basins` computes, NOT an
      empirical claim: classes (1), (2), (3) are disjoint and exhaustive over
      the N points by construction. Because it cannot fail on a correct
      implementation it is carried as a STRUCTURAL SELF-CHECK (control item
      (n)) and NOT as a control -- see that item for why the distinction is
      load-bearing here.

      A COROLLARY WORTH STATING BECAUSE IT CATCHES A REAL DEFECT CLASS: every
      DP lies in its own basin, so b(d) >= 1 for every DP d. At a DP,
      dist = 0 (line 202, `dist = (~dp).astype(np.int32)`) and 0 <= cap, so
      every DP is in class (1) and is counted into its own bincount bucket. A
      reading that produces b(d) = 0 for some DP has a defect.

      DERIVED QUANTITY, REQUIRED PER CELL OF BOTH READINGS:
        residual_fraction = (cycle_mass + capped_mass) / N
      reported alongside cycle_mass, capped_mass and capped_walks. This
      contract states NO expected value for it at any cell.

    "DP PREDICATE AND ITS INDEPENDENT KEY (v3 amendment item 3, ADDITIVE -- so no second convention has to be invented either)": >-
      The approved v2's `instrument` field names the DP predicate in words
      ("DP predicate hash64(x) < floor(2^64 / W) with an independent key").
      v3 states it as a formula, for the same reason it states the cap: a
      re-deriver must not have to guess a rounding or a key derivation.
        theta = 1/W  (instrument.py line 76: `self.theta = 1.0 / self.W`)
        dp_threshold = floor( 2^64 / W )  -- instrument.py line 83:
          `self.dp_threshold = int(math.floor((1 << 64) / self.W))`
        the predicate is  mix64( x XOR K_dp ) < dp_threshold
        with the DP key derived independently of the walk key:
          K_dp = mix64( K XOR 0xD1B54A32D192ED03 )   (instrument.py line 82)
          K    = mix64( 0x9E3779B97F4A7C15 + seed )  (instrument.py line 84)
      FLOOR, not round and not ceil. The DP key is derived from the walk key
      by a fixed XOR-then-mix, so the marking is independent of the step
      function while remaining a deterministic function of the seed. A
      re-deriver implementing its own mix function will produce a DIFFERENT
      concrete instance at the same seed; that is expected and is not a
      defect, because agreement is judged on pass-counts and signs over 25
      seeds, never on per-seed coincidence.

    "T (v3 amendment item 4, ADDITIVE -- discharges blocking defect D1; FILLS A BLANK, CONTRADICTS NO APPROVED VALUE)": >-
      v2's `definitions.T` above reads "nominal table size N^{1/3} rounded =
      256 at N = 2^24" and states NOTHING at N = 2^20. That value stays in
      force, byte-identical, and this key adds the second scale.
        T(2^20) = 64      T(2^24) = 256      T(2^30) = 1024
      THE FROZEN SOURCE, quoted verbatim from
      experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223:
        "T: nominal table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at 2^24,
         1024 at 2^30"
      CORROBORATED BY THE COMMIT-PINNED INSTRUMENT, verbatim from
      instrument.py line 29:
        `T_OF_NBITS = {20: 64, 24: 256, 30: 1024}      # T = N^{1/3} rounded, as frozen`
      and line 74: `self.T = T_OF_NBITS[self.n_bits]`.
      T = 64 AT N = 2^20, NOT 102. The refused sidecar draft stated 102, and
      the arithmetic of its stated rule is right -- round(2^20^(1/3)) = 102 --
      which is exactly why the value must be pinned to the TABLE rather than
      to the rule. THE PINNED INSTRUMENT HAS NO CODE PATH TO 102: T is a
      dictionary lookup keyed on n_bits, with no fallback and no
      round(N**(1/3)) expression anywhere in the file. At 2^24 and 2^30 the
      table and round(N^{1/3}) coincide; 2^20 is the one scale where they
      diverge, and 2^20 is the scale v3 adds. A reading that uses 102 at
      N = 2^20 is invalid under this contract (see `invalidation_rules`).

    "T_sel (v3 amendment item 5, ADDITIVE -- follows T; v2's N = 2^24 value unchanged)": >-
      v2's `definitions.T_sel` above reads "FIXED at T/2 = 128 for this
      contract" and stays in force, byte-identical, at N = 2^24. v3 adds:
        T_sel = T/2  at every scale, hence
        T_sel(2^20) = 32       T_sel(2^24) = 128   (v2's value, unchanged)
      T_sel = T/2 remains THE ORIGINAL clause (C1) value and the only stored
      size any verdict is read at. The DECAY-TSEL control additionally READS
      T/4 and T/8 -- at N = 2^20 that is 16 and 8, at N = 2^24 that is 64 and
      32 -- and those readings gate nothing except through control (l)'s own
      stated clauses.

    "W AND cap AT EVERY CELL OF THIS CONTRACT'S GRID (v3 amendment item 6, ADDITIVE -- DERIVED FROM THE FORMULAS ABOVE, MEASURED FROM NOTHING)": >-
      Tabulated so that no reader, gate or re-deriver has to recompute eight
      square roots to check a manifest. EVERY ROW IS A CONSEQUENCE OF
      W = sqrt(a*N/T) AND cap = ceil(8*W) WITH T FROM THE FROZEN TABLE. No
      row is read off any run, and no row is a result.

        N = 2^20, T = 64:
          a = 1/16 -> W = 32                 -> cap = 256
          a = 1/8  -> W = 45.254833996...    -> cap = 363
          a = 3/16 -> W = 55.425625842...    -> cap = 444
          a = 1/4  -> W = 64                 -> cap = 512

        N = 2^24, T = 256:
          a = 1/16 -> W = 64                 -> cap = 512
          a = 1/8  -> W = 90.509667992...    -> cap = 725
          a = 3/16 -> W = 110.851251684...   -> cap = 887
          a = 1/4  -> W = 128                -> cap = 1024

      The BINDING definition is the formula, never the printed decimal:
      W is used at float64 precision and cap is the integer above. A reading
      whose cap differs from the value in this table at any cell has either
      used a different T or a different multiplier, and is invalid under this
      contract (see `invalidation_rules`).

    "SEED SET (v3 amendment item 7, ADDITIVE -- 25 pre-registered seeds; v2's 5-seed field unchanged and retained as a subgroup)": >-
      v2's `definitions.seed` above ("5 seeds per a, matching Stage 0's and
      v2's own seed count") stays in force byte-identically and now describes
      a NAMED SUBGROUP rather than the whole set. v3 pre-registers:
        SEEDS = {1, 2, ..., 25}, the same 25 integers at every (N, a) cell,
        in both readings, and in every control arm.
        SEEDS_V1COMPARABLE = {1, 2, 3, 4, 5}, a distinguished SUBGROUP of the
        above, which is the seed set control (h) reproduces against and the
        only seed set whose reading is directly comparable to the committed
        v1 cells.
      FIXED BEFORE EXECUTION, and fixed as a LIST rather than a count, so
      that "25 seeds" cannot be satisfied by 25 seeds of someone's choosing
      after seeing five of them. The 25-seed reading and the 5-seed subgroup
      reading are reported SEPARATELY and are NEVER composited into one
      number (control (g)).
      Seed streams are the v1 construction, unchanged: the walk key, the DP
      key, the target/phi/null/tie-break streams are all derived from the
      integer seed exactly as instrument.py's `Params.__post_init__` derives
      them (lines 84-91), so seeds 6..25 are the same KIND of object as seeds
      1..5 and add power without changing the instrument.

    "INTERVAL ESTIMATOR (v3 amendment item 8, ADDITIVE -- discharges non-blocking defect D5; ROUTES ONLY, GATES NOTHING)": >-
      WHAT IT IS NOT FOR, FIRST, BECAUSE THAT IS THE DEFECT BEING CLOSED.
      NO VERDICT, NO CONTROL CLAUSE AND NO AGREEMENT TEST IN THIS CONTRACT
      DEPENDS ON A BOOTSTRAP. G3-FEASIBLE and G3-INFEASIBLE are functions of
      the integer pass-count k alone. Blind-versus-production agreement is
      judged on (k, sign of mean margin) alone. Both are exact and
      resampling-free, so two independent implementations compute them
      identically or differ for a reason about the quantity.

      WHAT IT IS FOR: routing a cell to the fresh label SU (CONFIRMED
      UNRESOLVED) -- see `SU ... (v3 amendment item 9...)` below -- which is
      not a feasibility verdict and supports no hypothesis movement in either
      direction.

      THE PRIMARY ESTIMATOR, SPECIFIED TO THE CALL:
        method:      PERCENTILE bootstrap (not BCa, not basic, not studentised)
        statistic:   the MEAN over seeds of the per-seed margin at that
                     (N, a) cell
        resample:    i.i.d. with replacement over the 25 per-seed margins,
                     preserving cell membership; seeds are the resampling
                     unit
        B:           10000 resamples
        rng:         numpy.random.default_rng(20260907 + 1000*n_bits +
                     round(10000*a)), constructed FRESH per cell so a cell's
                     interval does not depend on the order cells were
                     processed in
        endpoints:   the 2.5th and 97.5th percentiles of the B resample
                     means, via numpy.percentile(..., method='linear')
                     (numpy's default), stated explicitly because
                     percentile-method choice is a real source of
                     implementation divergence
      BCa IS REPORTED BESIDE IT AS CONTEXT ONLY, with its own variant and
      parameters recorded by whoever computes it, and NO RULE OF THIS
      CONTRACT DEPENDS ON IT. Two implementations that disagree on BCa
      disagree about nothing this contract decides.

      WHY THIS IS STRONGER THAN PINNING A BCa VARIANT, and what it costs.
      Pinning the variant would make the interval reproducible for two
      implementations sharing a library and still not for two that do not,
      and it would leave a verdict resting on machinery whose failure mode is
      invisible at a near-zero cell. Removing the interval from every verdict
      removes the failure mode instead of documenting it. THE COST, STATED:
      this contract buys no interval-based confidence statement about
      feasibility, and a cell whose interval straddles zero is routed to SU
      rather than called either way. That is the honest reading, and it is
      why SU exists.
      A ROUTING DIFFERENCE BETWEEN THE TWO READINGS is reported as INTERVAL-
      METHOD SENSITIVITY, never as S3 DISAGREEMENT.

    "SU -- THE FRESH LABEL FOR THE INTERVAL-ROUTED OUTCOME (v3 amendment item 9, ADDITIVE -- S1/S2/S3 keep the approved v2's meanings; NO 'S4' EXISTS IN THIS CONTRACT)": >-
      THE LABEL: SU (CONFIRMED UNRESOLVED).
      WHY A FRESH LABEL AND NOT S3. The approved v2's S3 means DISAGREEMENT
      between the blind and production readings. The refused sidecar draft
      re-used "S3" for CONFIRMED UNRESOLVED and put DISAGREEMENT at "S4" --
      a label collision under one experiment identifier, where one label
      would denote two different outcomes depending on which document a
      reader had open. This experiment has already paid for one collision at
      the amendment identifier (IC-1); a second, at the outcome labels, is
      not a disclosed cost but a pattern. So: S1, S2 and S3 keep the approved
      v2's meanings VERBATIM (see `success_criterion`, reproduced
      byte-identically below), and the interval-routed outcome is SU. NO
      OUTCOME OF THIS CONTRACT IS LABELLED S4: the string occurs only in this
      key's own name, in the sentence above describing the refused draft's
      labelling, and in `success_criterion_verbatim_attestation`, and never as
      a label of anything.
      WHEN SU IS ASSIGNED: see `success_criterion_v3_additions`, which states
      the routing rule and, critically, its PRECEDENCE relative to S3 -- SU
      never masks a disagreement.
      WHAT SU ASSERTS: that at this cell, over this seed set, at this scale,
      under this contract's budget, THE MEASUREMENT DOES NOT SEPARATE
      FEASIBLE FROM INFEASIBLE. It is a statement about the resolution of the
      instrument, not about the world. It supports no hypothesis-status
      movement in either direction and closes no lane.

    "a = 1/16 INDEPENDENCE RULING (v3 amendment item 10, ADDITIVE -- discharges non-blocking defect D6; FIXED IN THE CONTRACT, NOT ROUTED TO A REVIEW JOINT)": >-
      THE STANDING CONTAMINATION, restated because the ruling is meaningless
      without it: two commit messages reachable from the branch this contract
      was authored on (84233e8c3, 376c6660e) state the a = 1/16 verdict in
      plain text. That is a PERMANENT, UNREPAIRABLE contamination of any
      future blind reading at a = 1/16 on this branch. The derivation packet
      reduces the exposure -- a re-deriver obeying the allowlist runs no git
      history command at all -- but does not eliminate it, and nothing in
      this contract claims it does.
      THE RULING, ASYMMETRIC AND BINDING:
        AGREEMENT between the blind and production readings at a = 1/16
        carries ZERO independence weight, from the outset, at both scales.
        Not "reduced", not "weakened pending review": zero.
        DISAGREEMENT at a = 1/16 retains FULL weight, and additionally
        triggers falsification condition F2 and AGENTS.md rule 12
        (independent review-breakthrough at max effort).
      WHY ASYMMETRIC. An agreement produced because the re-deriver already
      knew the answer is, by this contract's own account of the
      contamination, indistinguishable from one produced because the answer
      is right; a weight no observation can revise is not a weight, so any
      nonzero independence credit at that cell would be unfalsifiable. The
      converse does not hold: a DISAGREEMENT reached despite two commit
      messages stating the opposite verdict is strong evidence precisely
      because the contamination pushes the other way.
      WHY IT IS FIXED HERE RATHER THAN LEFT TO A REVIEWER. The refused draft
      set a = 1/16's independence to "WEAKENED" and left the adjective to a
      review joint, while itself recording that the contamination is
      undetectable downstream -- which asks a post-hoc reviewer to arbitrate
      a word rather than attack a rule. A rule stated in advance can be
      attacked in advance.
      WHAT IT COSTS THIS BATCH: nothing. a = 1/16 has two jobs that need no
      independence at all -- it is DECAY-A's low-a endpoint, and it is a
      cross-scale consistency read.

  instrument: >-
    IDENTICAL to experiments/EXP-ECDLP-612fb1/specification.v2.yaml
    `instrument.generic_walk` and `inputs.exact_basins`, reused verbatim
    (f(x) = mix64(x XOR K) mod N, DP predicate hash64(x) < floor(2^64 / W)
    with an independent key; exact-basin enumeration procedure unchanged
    from v1). No curve arm (generic instrument only; certificate kind:
    none). The PRODUCTION computation (Stage B below) may reuse
    experiments/EXP-ECDLP-612fb1/source_v2/'s exact-basin code by explicit
    citation in its manifest (commit-pinned); the REQUIRED blind
    re-derivation (Stage A) may NOT (see `blind_rederivation.blind_from`).
  instrument_v3_note: >-
    UNCHANGED, and now stated as formulas rather than by name: the DP
    predicate's floor and independent-key derivation, the walk cap, and the
    exact-basin residual accounting are given explicitly in `definitions`
    items 1, 2 and 3 above. This is not a change of instrument -- it is the
    same commit-pinned instrument, with the conventions it has always
    implemented now derivable from the contract's own text. THE PRODUCTION
    READING MUST REUSE THE PINNED INSTRUMENT and cite its commit in the
    manifest; THE BLIND READING MUST NOT OPEN IT before its seal (the
    allowlist in `blind_rederivation.v3_derivation_packet` does not contain
    it, and `blind_from` continues to name it).

  inputs:
    stage_plan: >-
      UNCHANGED from v1/v2 for the already-executed work, retained by
      reference so no sentence drifts: see
      experiments/EXP-ECDLP-6ac801/specification.v2.yaml `inputs.stage_plan`
      for Stage A (the original blind re-derivation), Stage B (v1's executed
      exact-basin generation at N = 2^24, 5 seeds) and Stage C (v1's
      analysis). Stage B/C is ALREADY COMPLETE (RUN-ECDLP-6ac801-001..006,
      6/6 completed_valid), is NOT re-run by this contract, and is NEVER
      re-scored under it.
    stage_plan_v3: >-
      v3's OWN STAGES. Three, and the first must be sealed before the second
      is opened by the same agent.

      STAGE A'' (BLIND RE-DERIVATION, REQUIRED, NON-NEGOTIABLE). A designated
      independent agent, in a session that authored none of this contract's
      artifacts, implements the quantity from scratch and SEALS it. ITS ENTIRE
      PERMITTED READING BEFORE THE SEAL IS THE ENUMERATED DERIVATION PACKET
      (`blind_rederivation.v3_derivation_packet`) -- not this contract, not
      the amendment, not a handoff, not a task card, not a queue, not a
      decision, not a run, not a commit message. Grid: both scales, all four
      a, all 25 seeds. Deliverables per (N, a, seed): exact top-T_sel basin
      share, STATIC(T)_{r=2} exact coverage, margin, cycle_mass, capped_mass,
      capped_walks, residual_fraction, and the count of pool entries tied at
      the T-th largest weight. Per (N, a): pass-count k out of 25, mean
      margin and its sign, the percentile interval, and the same for the
      seeds 1..5 subgroup reported separately.

      STAGE B'' (PRODUCTION, exact-basin generation). The commit-pinned
      instrument, cited by commit in every manifest. N in {2^20, 2^24};
      a_grid = {1/16, 1/8, 3/16, 1/4}; r = 2; T_sel = T/2 (32 and 128); seeds
      1..25. Zero online re-selected (RESEL-L) arms -- this is an
      exact-enumeration measurement only, as in v1. Same per-cell deliverable
      list as Stage A''. Additionally, the control arms: NULL-ORACLE-RAND
      (uniform) as the gating null, its size-biased variant as a diagnostic,
      NULL-RANDSEL retained non-gating, NULL-SHUF as a fenced-off diagnostic,
      and the T/4 and T/8 readings that control (l) needs. THE N = 2^20 ARM
      RUNS FIRST, because it is roughly 16x cheaper and shakes the pipeline
      out before the expensive scale.

      STAGE C'' (ANALYSIS). Apply the G3-style feasibility criterion at each
      (N, a) to BOTH readings independently. Evaluate the a = 1/4 cell FIRST.
      Evaluate every control and report each as fired or not fired, with the
      quantity it was read from. Compare the two readings on (k, sign of mean
      margin), per (N, a); route to SU where the routing rule applies; report
      the crossing bracket at each scale, or report plainly that no clean
      crossing is confirmed. Report the seeds 1..5 subgroup separately from
      the 25-seed reading and NEVER composite them. Report the
      tie-break-induced symmetric difference of the two Sel_static sets, and
      the residual-mass accounting identity's exact satisfaction, per cell of
      both readings.
    arms: >-
      UNCHANGED from v1/v2 for the primary reading, verbatim in substance:
      two exact-coverage readings only per (a, seed) -- STATIC(T)_{r=2} exact
      coverage, and the exact top-T_sel basin share. No ORACLE, RESEL-L,
      NULL-A, CAP, RHO, or STATIC2T arm is run; those test the re-selection
      MECHANISM (already the subject of EXP-ECDLP-612fb1) and remain out of
      scope for this narrow ceiling-feasibility check (see `out_of_scope`).
    arms_v3_addition: >-
      v3 ADDS CONTROL ARMS ONLY, all read off the SAME exact basin partition
      as the primary arms, none of them an online re-selection batch:
      (i) NULL-ORACLE-RAND (uniform), the gating null: the ORACLE side is
      replaced by a uniformly random T_sel-subset of the DPs of the SAME
      enumerated partition, cov_static held fixed and read off identically;
      (ii) NULL-ORACLE-RAND (size-biased), diagnostic only, direction
      declared unpredictable in advance; (iii) NULL-RANDSEL, retained,
      non-gating, low power disclosed; (iv) NULL-SHUF, diagnostic, explicitly
      not a G3 null; (v) the T/4 and T/8 top-share readings control (l)
      needs. The primary arm count per cell is unchanged.
