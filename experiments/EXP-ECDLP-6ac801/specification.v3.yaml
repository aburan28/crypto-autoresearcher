  controls: # v3 AMENDMENT NOTE: items (a) through (f) below are reproduced
            # BYTE-IDENTICALLY from the APPROVED
            # experiments/EXP-ECDLP-6ac801/specification.v2.yaml `controls`.
            # Items (g) through (n) are APPENDED by this v3 amendment. In
            # particular control (e) SEED-COUNT PARITY is NOT edited: the
            # 25-seed extension is argued a fortiori from (e)'s own stated
            # rationale in the appended item (g), per CR-1 COND-4.
    - >-
      (a) BLIND RE-DERIVATION CONTROL (REQUIRED, frozen): see
      `blind_rederivation`. No cell is evidence before the seal exists.
    - >-
      (b) a = 1/4 REPLICATION CONTROL: T_sel = T/2 at a = 1/4, r = 2,
      N = 2^24 is ALREADY established as G3-INFEASIBLE (G3 FAIL 10/10 seeds,
      EV-ECDLP-60e266). This contract's own fresh 5 seeds at a = 1/4 must
      reproduce that FAIL. A PASS here at a = 1/4 invalidates this batch's
      instrument (see `invalidation_rules`), independent of any other cell's
      result.
    - >-
      (c) EXACT-COVERAGE NON-EXCEEDANCE: no exact top-T_sel share may exceed
      1.0 or the exact top-T share (T > T_sel); an exceedance is an
      implementation error, not a result (mirrors v1/v2's own structural
      tell).
    - >-
      (d) DEFINITIONAL IDENTITY WITH THE v2 G3 RULE: the feasibility
      criterion applied here is REUSED VERBATIM from
      experiments/EXP-ECDLP-612fb1/specification.v2.yaml
      `inputs.g3_gate_procedure`, not re-derived or re-worded, specifically
      to rule out a units/definition mismatch as the source of any
      confirmed discrepancy (this contract's own outcome (b) names that
      possibility explicitly and this control is what would surface it).
    - >-
      (e) SEED-COUNT PARITY: 5 seeds per a, matching Stage 0's and v2's own
      seed count, so this batch's statistical power is comparable, not
      thinner, than the batch that produced the original discrepancy.
    - >-
      (f) [v2 AMENDMENT, ADDITIVE] SELECTION-FORMULA IDENTITY: the re-sealed
      a = 1/8 blind re-derivation required by
      `blind_rederivation.v2_rerequirement_a_1_8` must apply EXACTLY the
      `STATIC(T)_r pool-selection weight formula (v2 amendment item 1)`
      stated in `definitions` above, with no further drift or
      reinterpretation; a re-seal that silently applies yet a third,
      different reading of "the published Bernstein-Lange weight" would
      repeat, not resolve, the underspecification this amendment exists to
      close.
    - >-
      (g) [v3 AMENDMENT, ADDITIVE] SEED-COUNT PARITY EXTENSION.
      CONTROL (e) IS QUOTED HERE IN FULL AND IS NOT EDITED: "(e) SEED-COUNT
      PARITY: 5 seeds per a, matching Stage 0's and v2's own seed count, so
      this batch's statistical power is comparable, not thinner, than the
      batch that produced the original discrepancy."
      THE ARGUMENT, FROM (e)'S OWN STATED RATIONALE: (e) exists to protect a
      property it names explicitly -- power "comparable, not thinner" than
      the batch that produced the original discrepancy. v3 runs 25 seeds per
      (N, a), the same integer-seeded streams by the same construction, so
      the power is STRICTLY GREATER and never thinner. (e) is therefore
      satisfied A FORTIORI, not overridden.
      THE AUTHORITY GAP, STATED RATHER THAN PAPERED OVER: the seed set is the
      one wide-scope item the approved contract's `invalidation_rules` item 7
      does NOT name, so item 7 confers no authority over it. The warrant used
      here is (e)'s own rationale, which is WEAKER than item 7 and is recorded
      as such. A gate that rejects this reading should say so; the fallback
      needing no new warrant is to run seeds 1..5 only, which costs the wide
      scope its power.
      THE CONTROL ITSELF FIRES WHEN: the 25-seed reading and the seeds 1..5
      subgroup reading are composited into one number anywhere; or the
      subgroup reading is omitted; or fewer than 25 of the pre-registered
      seeds are run at a cell whose verdict is reported; or the seed set
      differs between the two readings or between any treatment and control
      arm.
    - >-
      (h) [v3 AMENDMENT, ADDITIVE] CROSS-SCALE REPRODUCTION CONTROL, anchored
      at N = 2^24 where a committed reference exists.
      THE CHECK: at N = 2^24, a in {1/16, 1/8, 3/16, 1/4}, seeds 1..5, the
      PRODUCTION reading's exact top-T_sel share, STATIC(T)_{r=2} exact
      coverage and margin must each equal the committed value in the
      corresponding RUN-ECDLP-6ac801-001..005 summary.json to within 1e-9
      ABSOLUTE. A larger deviation FIRES THIS CONTROL.
      IT DOES NOT RE-SCORE THE COMMITTED RUNS. They are the REFERENCE, never
      the subject: no byte under experiments/EXP-ECDLP-6ac801/runs/ is read
      for anything but comparison, and none is written. This is the binding
      condition of `invalidation_rules` item 7 ("runs already executed are
      never re-scored") and it is honoured exactly.
      THE TOLERANCE IS NOT INVENTED: the independent gate that refused this
      contract's predecessor draft reproduced all three quantities at all 20
      committed cells from the pinned instrument to a WORST ABSOLUTE
      DEVIATION OF 0.000e+00, so the target is known achievable and a nonzero
      residual is a real signal rather than a tolerance artifact.
      THE 1e-9 TOLERANCE APPLIES TO THE PRODUCTION READING ONLY, where the
      tie-break key stream is identical by construction. It does NOT apply to
      the blind reading, whose key stream necessarily differs (see (o) and
      `definitions` item on the tie-break).
      WHAT "CROSS-SCALE" MEANS HERE, STATED PLAINLY BECAUSE IT IS A
      DELIBERATE NARROWING: this contract spans two scales, and the
      reproduction anchor sits at the scale that HAS committed cells. AT
      N = 2^20 THERE IS NO REFERENCE -- this experiment has never run there --
      so v3 reads a CROSS-SCALE CONSISTENCY comparison at N = 2^20 and
      declares it EXPLICITLY NOT A CONTROL: it has nothing to pass or fail
      against. Inventing a reference there would have been a fabrication.
    - >-
      (i) [v3 AMENDMENT, ADDITIVE] NULL-ORACLE-RAND (UNIFORM) -- THE GATING
      NULL OBJECT. Discharges non-blocking defect D7.
      THE NULL: replace the ORACLE side of the comparison -- the top-T_sel
      basins by TRUE SIZE over the whole exact partition -- by a UNIFORMLY
      RANDOM T_sel-subset of the DPs of the SAME enumerated partition. Hold
      cov_static fixed, read the coverage of the random subset off the SAME
      basin-size array by the SAME arithmetic, and form
      margin_null = (random subset's exact coverage) - cov_static.
      ONE SUBSTITUTION, SAME UNIVERSE, SAME READ-OFF, SAME PREDICATE. This is
      what D7 asked for: the refused draft's null changed the selection rule
      AND the universe (its arm ranged over the r*T pool while the real arm
      ranges over the whole partition), so its guaranteed negativity was
      bought largely by the universe change and the size ratio rather than by
      the weight carrying information.
      IT FIRES WHEN: margin_null(s) >= 0 in more than 1 of the 25 seeds at
      any (N, a) cell, or the reported MEAN margin_null is non-negative at
      any cell.
      WHY ITS CONCLUSION IS KNOWN FALSE BY ARGUMENT, NOT BY DATA: cov_static
      is the exact coverage of T = 2*T_sel pool entries selected by
      weight_d = S_d + 4*W*h_d, and both factors of that weight increase with
      basin size for a structural reason -- a DP with a larger basin is
      reached by MORE uniform-restart pool walks (larger h_d) and those walks
      start from a larger set of points (larger S_d) -- while the pool itself
      over-samples large basins, since a DP enters it only when some restart
      walk reaches it. A UNIFORMLY random T_sel-subset of all DPs has by
      construction NO correlation with basin size: its expected mass is T_sel
      times the MEAN basin mass over a DP set of size order N/W, the
      overwhelming majority of whose basins are small. So margin_null must be
      negative. NO COMMITTED NUMBER IS USED IN THIS ARGUMENT AND NONE IS
      ASSERTED BY IT -- which is exactly why the control is falsifiable: a
      structural argument can be wrong.
    - >-
      (j) [v3 AMENDMENT, ADDITIVE] NULL-ORACLE-RAND (SIZE-BIASED) --
      DIAGNOSTIC ONLY, GATES NOTHING.
      Same substitution as (i) but with the T_sel-subset drawn with
      probability proportional to basin size. ITS DIRECTION IS DECLARED
      UNPREDICTABLE IN ADVANCE and no verdict depends on it: a size-biased
      draw is deliberately competitive with the oracle, and this contract
      cannot honestly pre-register which way it falls. Reported because the
      GAP between (i) and (j) measures how much of the oracle's advantage is
      size-correlation alone -- which is informative -- and fenced off from
      every verdict because a control whose direction cannot be stated in
      advance is not a control.
    - >-
      (k) [v3 AMENDMENT, ADDITIVE] NULL-RANDSEL -- RETAINED, NON-GATING, LOW
      POWER DISCLOSED IN THE CONTRACT.
      THE NULL: replace weight_d selection by a uniformly random T-subset of
      the r*T POOL, and compare the top-T_sel share against that random
      selection's coverage.
      IT FIRES WHEN: margin_null_pool(s) >= 0 in more than 1 of the 25 seeds
      at any cell.
      ITS POWER IS LOW AND THAT IS STATED HERE RATHER THAN LEFT FOR A
      REVIEWER TO DISCOVER: the independent gate recomputed this quantity on
      the committed cells and found it one to two orders of magnitude beyond
      its own declared firing threshold at every cell, because its arm ranges
      over the r*T pool while the real arm ranges over the whole partition
      (D7). It CAN fire, but on nothing short of a gross defect. RETAINED as
      a check on the weight ESTIMATOR specifically -- which is what it is
      genuinely shaped for -- and DEMOTED from gating to reported.
    - >-
      (l) [v3 AMENDMENT, ADDITIVE] DECAY-A -- THE DECLARED DECAY CONTROL, AND
      THIS BATCH'S LOAD-BEARING ARTIFACT DETECTOR. Declared decay parameter:
      a. Rationale: docs/inventor-protocol.md "controls before belief" -- a
      quantity that fails to decay when the parameter meant to destroy it
      increases is the canonical artifact tell.
      CLAUSE (i) MONOTONE DECAY, BINDING: the mean margin over the 25 seeds
      must be STRICTLY DECREASING across a = 1/16, 1/8, 3/16, 1/4 at each N
      separately. A SINGLE non-monotone step fires it.
      CLAUSE (ii) PAIRED DIFFERENCES, CONTEXT ONLY, BINDS NOTHING: the paired
      per-seed differences between adjacent a-values, reported with their
      percentile intervals. Reported for interpretation; no verdict and no
      other clause depends on it, per `definitions` item on the interval
      estimator (D5).
      CLAUSE (iii) EXTERNAL ANCHOR, BINDING, AND THE ONLY CLAUSE ANCHORED
      OUTSIDE THIS BATCH: at a = 1/4, the mean margin must be NEGATIVE and
      the pass-count k must be at most 5 of 25. The anchor is
      EV-ECDLP-60e266's independently established a = 1/4 G3-infeasibility --
      a result of a DIFFERENT batch, cited and never re-scored here.
      WHY CLAUSE (i) IS NOT AN IDENTITY: each a is a DIFFERENT INSTRUMENT,
      with its own W, DP rate, cap, and basin partition. No arithmetic
      relates the four means, so a correct implementation can produce a
      non-monotone sequence.
      WHY CLAUSE (iii) CARRIES THE LOAD: it is the one clause a
      self-consistent but WRONG implementation cannot pass automatically,
      because its reference is external to everything this batch computes.
    - >-
      (m) [v3 AMENDMENT, ADDITIVE] DECAY-TSEL -- SECOND DECAY CONTROL, WEAKER
      THAN (l), WEAKNESS DISCLOSED, AND WITH THE PREVIOUS GATE'S TAUTOLOGICAL
      CLAUSE DELIBERATELY NOT REINTRODUCED.
      CLAUSE (i) BINDING: at T_sel = T/8, margin(s) >= 0 in more than 1 of the
      25 seeds at any a fires this control.
      RE-CHECKED AGAINST THE CODE RATHER THAN CARRIED ON TRUST: cov_static is
      a function of the T weight-selected pool entries and is INDEPENDENT of
      T_sel (experiments/EXP-ECDLP-6ac801/source/run_stageb.py line 96
      selects T, never T_sel), while share_top(T/8) is a strict prefix of
      share_top(T/2). NOTHING in either expression forces
      share_top(T/8) < cov_static, so the clause is NOT an identity and can
      fail on a correct implementation. What it detects: a T/8-entry oracle
      table already matching STATIC(T)'s coverage, i.e. a comparison that is
      not measuring stored-advice efficiency at all but is an
      everything-passes artifact.
      CLAUSE (ii) BINDING, WEAK: rho_ORACLE must be non-decreasing in a at
      each N. Not forced by arithmetic, but on the read grid
      {1/8, 1/4, 1/2} rho_ORACLE takes few values, so this is effectively a
      COARSE ordering check on the same directional claim (l) makes.
      DISCLOSED, not hidden.
      ITS POWER IS LOW AND THAT IS STATED: the independent gate found clause
      (i) comfortably satisfied on every committed cell.
      THE CLAUSE THE PREVIOUS GATE CORRECTLY REMOVED IS NOT REINTRODUCED:
      margin(T/2) > margin(T/4) > margin(T/8) holds BY ARITHMETIC on every
      correct implementation, because the three share_top values are nested
      prefixes of one descending sort while cov_static is common to all
      three. It appears in this contract ONLY inside item (o), labelled a
      structural self-check, and never as a control.
    - >-
      (n) [v3 AMENDMENT, ADDITIVE] NULL-SHUF -- DIAGNOSTIC, EXPLICITLY NOT A
      G3 NULL, AND DECLARED UNUSABLE AS ONE IN THE CONTRACT RATHER THAN
      QUIETLY DROPPED.
      Permuting basin sizes across the pool's DPs, holding the size multiset
      and the weights fixed, makes cov_static COLLAPSE -- which makes G3 pass
      MORE easily. THAT IS THE WRONG DIRECTION FOR A FEASIBILITY NULL:
      carrying it as one would mean carrying a control that fires in the
      direction of the claim, which is worse than having no null at all.
      NOTHING GATES ON IT. It is retained and reported because the collapse
      itself is informative about whether weight_d carries basin-size
      information, and it is fenced off from every verdict, every clause and
      every agreement test.
    - >-
      (o) [v3 AMENDMENT, ADDITIVE] STRUCTURAL SELF-CHECKS -- NOT CONTROLS,
      AND LABELLED SO DELIBERATELY.
      Each item below CANNOT FAIL on a correct implementation, so its passing
      means nothing beyond "no defect of this kind". Calling any of them a
      control would repeat exactly the vacuity the independent gate correctly
      removed from a DECAY-TSEL clause of the refused draft, and this contract
      does not do that.
      (o1) BASIN-MASS ACCOUNTING: sum_d b(d) + cycle_mass + capped_mass = N
      EXACTLY, in integer arithmetic, with ZERO tolerance, at every cell of
      BOTH readings; and b(d) >= 1 for every DP d. Cannot fail because the
      three classes are disjoint and exhaustive by construction (see
      `definitions` item 2). It fires exactly when a reading implements no
      cap, or assigns residual mass to a basin, or double-counts -- which is
      D2's failure mode and the reason the check exists.
      (o2) EXACT-COVERAGE NESTING: share_top(T/8) <= share_top(T/4) <=
      share_top(T/2) <= share_top(T) <= 1.0, and cov_static <= share_top(T).
      Cannot fail: nested prefixes of a descending sort of non-negative basin
      sizes, and an exact coverage of T DPs that cannot exceed the T largest
      basins. THIS SUBSUMES v2's CONTROL (c), which is retained above
      verbatim and unedited; (o2) records honestly that (c) is an identity
      rather than a control.
      (o3) MARGIN NESTING IN T_sel: margin(T/2) > margin(T/4) > margin(T/8)
      at every cell. Cannot fail, for the reason given in item (m): this is
      the clause the previous gate removed, kept here ONLY as a self-check.
      A VIOLATION OF ANY OF (o1)-(o3) IS AN IMPLEMENTATION ERROR AND STOPS
      THE CELL AS completed_invalid (see `stopping_rules`), never folded into
      a pass-count.

  controls_falsifiability_summary: >-
    REQUIRED READING FOR THE GATE, and the honest power gradient of this
    batch. Of the fifteen declared items: ELEVEN are controls with a
    reachable failing world on a correct implementation -- (a), (b), (d), (e),
    (f), (g), (h), (i), (k), (l), (m); THREE are structural self-checks and
    are labelled as such rather than as controls -- (c) (retained verbatim
    from v2, honestly re-described in (o2)), and (o1)-(o3); and TWO are
    diagnostics explicitly fenced off from every verdict -- (j) and (n).
    THE LOAD IS NOT EVENLY DISTRIBUTED, and pretending otherwise would be
    the defect: control (l) clause (iii) is the ONLY clause anchored OUTSIDE
    this batch and carries most of the artifact-detection load; control (i)
    is the shape-matched gating null that D7 asked for; controls (k) and (m)
    are corroboration with DISCLOSED low power; control (h) is the sharpest
    check available on pipeline identity, because its target is known
    achievable to 0.000e+00.

