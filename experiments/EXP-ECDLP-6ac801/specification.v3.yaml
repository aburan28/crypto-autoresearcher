  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 30
    maximum_workers: 1
  budget_note: >-
    ADVISORY per docs/research-budget-policy.md; research spending is not
    rationed by default (CLAUDE.md "Research budgets: progress first"), and
    these numbers may be revised upward without further approval if the
    actual run needs more.
    WHAT CHANGED FROM v2 AND WHY. `maximum_runs` 8 -> 30 and
    `total_cpu_hours` 1 -> 6, because v3 runs two scales instead of one and
    25 seeds instead of 5, plus four control arms read off the same
    partitions. `wall_clock_seconds_per_run` is unchanged at 3600.
    WHAT DID NOT CHANGE, AND WHY IT IS A DIFFERENT KIND OF NUMBER:
    `maximum_memory_gb` stays 8 and `maximum_workers` stays 1. THESE ARE
    MACHINE PROTECTION, NOT RESEARCH BUDGET (CLAUDE.md: "Memory/concurrency
    limits ... remain machine protection"), and this amendment does not raise
    them. Exact basin enumeration at N = 2^24 needs O(N) working memory, and
    the N = 2^20 arm needs 16x less, so the smaller scale is the cheap one and
    runs first.
    SHAPE OF THE ESTIMATE: the N = 2^20 arm is roughly 16x cheaper per cell
    than N = 2^24 at the same a. v1's own N = 2^24 exact-basin work ran in
    well under a minute per seed-cell at a comparable T, so the dominant cost
    is 25 seeds x 4 a at the larger scale. These are ESTIMATES, advisory, and
    a cell not reached is reported as not run, never as a negative.

  stopping_rules:
    - "Stage A (blind re-derivation) must be sealed before Stage B/C's own output is opened by the same reviewer, and before either is compared against the original v2 Stage 0 data; a violation voids the blindness of that reviewer's reading for this batch (report the violation plainly; do not silently discard it)."
    - "The a = 1/4 replication control is evaluated FIRST among the four a-values, before the novel cells (1/16, 1/8, 3/16) are interpreted; a control FAIL-to-reproduce stops interpretation of the other three cells until the instrument mismatch is understood (see `invalidation_rules`)."
    - "Stop at maximum_runs or total_cpu_hours, whichever binds first; a cell not reached is reported as not run, never as a negative."
    - "Wall clock per run at 3600 s; a run that exceeds it is failed_infrastructure and is re-planned with a smaller shard, never interpreted (AGENTS.md rule 5)."
    - "Any exact-coverage exceedance (control (c)) stops the run as completed_invalid (implementation error), reported immediately, not folded into the a-value's pass-count."
    - "[v2 AMENDMENT, ADDITIVE] The a = 1/8 re-seal required by `blind_rederivation.v2_rerequirement_a_1_8` must itself be sealed before the reviewer performing it opens TASK-20260907-80e198's own sealed_blind_rederivation.json, blind_rederivation.py, or postseal_diagnostic*.py, or any `blind_from` path; a violation is reported plainly, exactly as the original stopping rule above requires, and does not silently stand as evidence."
    - "[v3 AMENDMENT, ADDITIVE] The Stage A'' re-deriver stops and reports a VIOLATION, rather than continuing quietly, the moment it reads any repository file not enumerated in the derivation packet's MANIFEST.yaml before its own seal exists -- including any commit message and any output of git log, git show or git blame. A disclosed violation is a usable record of what was compromised; an undisclosed one destroys the batch's only independence claim."
    - "[v3 AMENDMENT, ADDITIVE] Any violation of structural self-check (o1), (o2) or (o3) stops that cell as completed_invalid and is reported immediately as an implementation error; it is never folded into a pass-count and never reported as a control that fired."
    - "[v3 AMENDMENT, ADDITIVE] The N = 2^20 arm is run and reported before the N = 2^24 arm, so that a pipeline defect is found at the 16x cheaper scale. If the N = 2^24 arm is not reached within budget, the N = 2^20 arm is reported alone, with its scope stated, and the N = 2^24 cells are reported as NOT RUN -- never as unresolved, and never as negative."
    - "[v3 AMENDMENT, ADDITIVE] If control (h) fires -- a production-versus-committed deviation above 1e-9 at N = 2^24, seeds 1..5 -- interpretation of every other cell at both scales stops until the pipeline difference is identified, exactly as a control (b) failure stops interpretation. A pipeline that cannot reproduce a known reference is not measuring what this contract says it measures."

  invalidation_rules:
    - "Execution while status is not approved or execution_authorized is false: no run under this contract is evidence."
    - "A timeout, crash, memory exhaustion or dependency failure is failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md rule 5)."
    - "Any exact top-T_sel share exceeding 1.0 or the exact top-T share: invalid (impossible by construction)."
    - "A run set completed WITHOUT a sealed blind re-derivation artifact (hash + timestamp, predating the reviewer's own opening of Stage B/C output and of the original v2 Stage 0 data): the production reading alone is NOT evidence under this contract -- report it as an unreviewed measurement only, exactly the status quo this contract exists to move past, and re-open Stage A before any conclusion is drawn."
    - "The a = 1/4 replication control failing to reproduce EV-ECDLP-60e266's G3 FAIL (i.e. scoring >= 4/5 PASS at a = 1/4): invalidates this batch's instrument for every cell; report as an instrument mismatch requiring investigation (a changed definition, a changed seed policy, or an implementation defect), never as a result that clause (C1) now holds at a = 1/4 too."
    - "Duplicated or missing seeds, a manifest missing command, commit, dirty-tree state, environment, requested policy or resolved model, or raw/summary disagreement: invalid."
    - "Any post-hoc change to the a-grid, N, r, T_sel, or the G3-style feasibility criterion beyond what THIS versioned contract states: requires a further versioned protocol_amendment; runs already executed are never re-scored."
    - "Reading H-ECDLP-37dc01's or EXP-ECDLP-612fb1's own frozen text as if it already licensed a conclusion about a in {1/16, 1/8, 3/16} before this contract's own criterion resolves: not permitted; the boundary widening on H-ECDLP-37dc01 is a disclosure of scope, not a result."
    - "[v2 AMENDMENT, ADDITIVE] A re-seal performed under `blind_rederivation.v2_rerequirement_a_1_8` that edits, overwrites, or appends to TASK-20260907-80e198's own sealed_blind_rederivation.json, or to any file under experiments/EXP-ECDLP-6ac801/runs/, rather than producing a wholly new, separately hashed artifact at a new task directory: invalid, per rule 2 (records are immutable; corrections supersede, never overwrite)."
    - "[v3 AMENDMENT, ADDITIVE] EXECUTION WITHOUT AN INDEPENDENT GATE: an executor under this v3 contract must find BOTH (1) a gate-outcome record at experiments/EXP-ECDLP-6ac801/amendments/v2_to_v3.gate-outcome.yaml carrying `execution_authorized: true` for specification.v3.yaml, AND (2) the committed Coordinator decision that record names, accepted by the dispatcher's post-commit verifier. Absent either, it REFUSES. No message, task card, queue entry or in-session statement substitutes for those two artifacts, and this contract's own gate fields (`status: proposed`, `approved_by: null`, `frozen: false`, `execution_authorized: false`) mean that as of authoring, NOTHING is authorized."
    - "[v3 AMENDMENT, ADDITIVE] A CAP OR TABLE-SIZE MISMATCH: a reading whose walk cap differs from ceil(8*W) at any cell, or whose T differs from the frozen table (in particular any reading using T = 102 at N = 2^20), or whose W differs from sqrt(a*N/T): invalid. The values are tabulated at all eight cells in `definitions` item 6 precisely so this is checkable without recomputation."
    - "[v3 AMENDMENT, ADDITIVE] A RESIDUAL-ACCOUNTING FAILURE: a reading in which sum_d b(d) + cycle_mass + capped_mass != N exactly in integer arithmetic at any cell, or which does not REPORT cycle_mass, capped_mass, capped_walks and residual_fraction per cell, or in which some DP has b(d) = 0: invalid. This is D2's failure mode and the check is not optional."
    - "[v3 AMENDMENT, ADDITIVE] A BLINDNESS VIOLATION READ AS AGREEMENT: if the Stage A'' re-deriver read any repository file outside the derivation packet's MANIFEST.yaml before its seal, that reading's AGREEMENT with production carries no independence weight for this batch (its DISAGREEMENT still does, for the same asymmetry reason given in the a = 1/16 independence ruling). Report the violation; do not silently discard the reading and do not silently count it."
    - "[v3 AMENDMENT, ADDITIVE] A VERDICT RESTING ON A BOOTSTRAP: any report in which a G3-FEASIBLE or G3-INFEASIBLE verdict, or a blind-versus-production agreement finding, is derived from an interval endpoint rather than from the pass-count and the sign of the mean margin: invalid. The interval routes to SU and gates nothing (D5)."
    - "[v3 AMENDMENT, ADDITIVE] A COMPOSITED SEED READING: any report that merges the 25-seed reading and the seeds 1..5 subgroup reading into one number, or that omits the subgroup reading at a cell whose verdict is reported: invalid (control (g))."
    - "[v3 AMENDMENT, ADDITIVE] AN UNREPORTED CONTROL: any report in which a declared control's outcome (FIRED or NOT FIRED) is absent for a cell whose verdict is reported: invalid. An unreported control counts as NOT RUN, never as passed."
    - "[v3 AMENDMENT, ADDITIVE] A WRITE TO A FROZEN OR HISTORICAL RECORD: any run or task under this contract that writes a byte of experiments/EXP-ECDLP-6ac801/specification.yaml, specification.v1-frozen-add84d2f.yaml, specification.v2.yaml, amendments/v1_to_v2.yaml, either .BATCH-e9fd22-proposed.yaml sidecar, anything under experiments/EXP-ECDLP-6ac801/runs/, or anything under coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/: invalid, per rule 2 and per `invalidation_rules` item 7's binding condition that already-executed runs are never re-scored."

  success_criterion: >-
    FIRST, Stage A's blind re-derivation must be sealed (see
    `blind_rederivation`); absent that seal, nothing below is evaluated as
    evidence (see `invalidation_rules`). SECOND, the a = 1/4 replication
    control must reproduce G3-INFEASIBLE (>= 4/5 seeds with exact top-T_sel
    share BELOW STATIC(T) exact coverage); absent that, the batch is an
    instrument mismatch, not a result (see `invalidation_rules`). GIVEN
    both hold: at EACH a in {1/16, 1/8, 3/16}, apply the G3-style
    feasibility criterion (>= 4 of 5 seeds with exact top-T_sel share >=
    STATIC(T)_{r=2} exact coverage) to BOTH Stage A's sealed blind result
    and Stage B/C's production result independently, then compare. S1
    (CONFIRMED FEASIBLE): the blind and production readings AGREE that a
    given a is G3-FEASIBLE. S2 (CONFIRMED INFEASIBLE): the blind and
    production readings AGREE that a given a is G3-INFEASIBLE. S3
    (DISAGREEMENT): the blind and production readings DISAGREE on a given
    a's feasibility verdict, or agree on the verdict but disagree on the
    per-seed sign pattern beyond noise -- this is reported as its own
    outcome (see `distinguishable_outcomes` (b)), never resolved by
    preferring one reading without a stated, checkable reason. OVERALL: the
    crossing bracket is reported as the pair of adjacent a-grid values where
    the CONFIRMED (blind-and-production-agreeing) verdict changes from
    FEASIBLE to INFEASIBLE; if no clean crossing is confirmed (e.g.
    disagreement occurs inside the bracket), that is reported plainly as
    "crossing not confirmed at this N," not papered over with the N = 2^20
    reading.
  success_criterion_verbatim_attestation: >-
    THE FIELD ABOVE IS REPRODUCED BYTE-IDENTICALLY FROM THE APPROVED
    experiments/EXP-ECDLP-6ac801/specification.v2.yaml `success_criterion`,
    per CR-1 COND-3. S1 = CONFIRMED FEASIBLE, S2 = CONFIRMED INFEASIBLE,
    S3 = DISAGREEMENT, with the approved meanings and no re-wording. NO
    OUTCOME OF THIS CONTRACT IS LABELLED S4 (see `definitions` item 9 for the
    only places that string occurs, none of them a label). Everything v3 adds is in
    `success_criterion_v3_additions` below.
  success_criterion_v3_additions:
    scope_of_the_additions: >-
      The criterion above is applied UNCHANGED at each (N, a) cell, once per
      reading. The additions below (i) state how the >= 4/5 rule reads at 25
      seeds, (ii) define the SU routing and its precedence, and (iii) fix
      what agreement is judged on. They add an outcome and a threshold
      reading; they change no meaning of S1, S2 or S3.
    pass_count_rule_at_25_seeds: >-
      The rule above is a PROPORTIONAL one (">= 4 of 5"), applied at 25 seeds
      as k >= 20 of 25. The seeds 1..5 SUBGROUP is additionally scored by the
      rule above verbatim (>= 4 of 5), reported SEPARATELY, and NEVER
      composited with the 25-seed reading (control (g)). WHERE THE TWO
      READINGS DISAGREE ON A CELL'S VERDICT, BOTH ARE REPORTED AND NEITHER IS
      PREFERRED: that disagreement is itself a finding about the power of a
      5-seed reading, and resolving it by picking the more convenient one
      would be the analysis mistake control (g) exists to catch.
    SU_routing_rule: >-
      SU (CONFIRMED UNRESOLVED) is assigned to a cell when BOTH readings
      agree on the verdict AND the percentile bootstrap interval of the mean
      margin (per `definitions` item 8) STRADDLES ZERO in either reading.
      PRECEDENCE, STATED EXPLICITLY BECAUSE IT IS THE ONE WAY SU COULD DO
      HARM: S3 TAKES PRECEDENCE OVER SU. If the two readings disagree on the
      pass-count-derived verdict or on the sign of the mean margin, the cell
      is S3, FULL STOP -- SU never masks a disagreement by absorbing it into
      an "unresolved" label. SU is reachable only from an AGREEING pair.
      WHAT SU ASSERTS: that at this cell, this seed set, this scale and this
      budget, the measurement does not separate feasible from infeasible. It
      is a statement about instrument resolution, not about the world; it
      supports NO hypothesis-status movement in either direction and closes
      no lane. A cell routed to SU is reported with its pass-count, its mean
      margin and its interval (tail check), so the routing is auditable.
    agreement_is_judged_on: >-
      EXACTLY TWO QUANTITIES, both resampling-free: (1) the pass-count k out
      of 25, and (2) the SIGN of the mean margin. AGREEMENT means both match
      in the two readings' verdicts derived from k, and the signs match.
      NOTHING ELSE ENTERS: not an interval endpoint, not a per-seed
      coincidence (the two readings implement different mix functions and
      different tie-break key streams, so per-seed coincidence is not
      expected and its absence is not a disagreement), and not a
      tie-break-induced difference in the Sel_static sets.
      A ROUTING DIFFERENCE (one reading's interval straddles zero, the other's
      does not) IS REPORTED AS INTERVAL-METHOD SENSITIVITY, never as S3.
    independence_weighting: >-
      At a = 1/16, AGREEMENT carries ZERO independence weight and
      DISAGREEMENT carries FULL weight, per `definitions` item 10 -- fixed in
      this contract, not routed to a review joint. At every other a,
      agreement carries its ordinary weight subject to the blindness
      requirement.
    crossing_bracket_at_two_scales: >-
      The crossing bracket is reported PER SCALE, independently, by the rule
      above. A cross-scale comparison of the two brackets is reported as a
      CONSISTENCY READ and is explicitly NOT A CONTROL: there is no committed
      N = 2^20 cell of this experiment to pass or fail against (see control
      (h) and `contradiction_disclosure`). If a bracket is not confirmed at a
      scale, that is reported plainly as "crossing not confirmed at this N",
      never filled in from the other scale.

  falsification_criterion: >-
    F1: the a = 1/4 replication control fails to reproduce
    G3-INFEASIBLE -- see `invalidation_rules` (instrument mismatch, not a
    result about clause (C1)). F2: at a = 1/16 or a = 1/8, the CONFIRMED
    (blind-and-production-agreeing) verdict is G3-INFEASIBLE, reversing the
    N = 2^20 Stage 0 reading -- this falsifies the N-independence of the
    Stage 0 discrepancy specifically at N = 2^24 (reported as a genuine,
    scale-dependent finding, not an error) and is exactly outcome (b)'s
    "NOT confirmed" branch if it stems from a real N-dependence rather than
    a units/definition artifact. F3: Stage A's blind result and Stage B/C's
    production result disagree beyond seed-to-seed noise at any a without a
    demonstrable units/definition explanation -- this is a MEASUREMENT
    ARTIFACT finding about the ORIGINAL Stage 0 discrepancy's own validity,
    reported as a correction to EV-ECDLP-f6b3f5's `unresolved_confounds`
    (a new evidence record superseding, never editing, that entry), not
    treated as resolving feasibility either way at N = 2^24.
  falsification_criterion_v3_additions: >-
    F1, F2 and F3 above are retained verbatim from the approved v2 and are
    unchanged in meaning. v3 ADDS:
      F4 (CAP SENSITIVITY): a cell whose CONFIRMED verdict differs from the
    v1 committed reading at the same (N = 2^24, a, seeds 1..5) while control
    (h) does NOT fire -- i.e. the pipeline reproduces the committed
    quantities exactly, yet the verdict moved. This would falsify the
    assumption, implicit in every prior record of this lineage, that the
    unstated cap convention was immaterial to the verdicts. It is reported as
    a finding about the CONTRACT'S derivability gap, not as evidence about
    G3 feasibility, and it is UNPREDICTED: this contract states no
    expectation that it will or will not occur.
      F5 (STRUCTURAL NULL WRONG): control (i) fires -- margin_null >= 0 in
    more than 1 of 25 seeds, or a non-negative mean, at any cell. The
    structural argument for the uniform null's negativity (control (i)) would
    then be WRONG, and every reading that depends on weight_d tracking basin
    size is in question at that cell. This falsifies an argument this
    contract makes, which is why it is listed here rather than only as a
    control.
      F6 (DECAY FAILS): control (l) clause (i) fires -- the mean margin is
    not strictly decreasing in a at some scale. Per
    docs/inventor-protocol.md this is the canonical artifact tell, and it
    falsifies the batch's claim to be measuring stored-advice efficiency at
    all rather than an artifact of the pipeline.

