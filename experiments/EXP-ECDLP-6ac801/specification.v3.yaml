    - "[v3 AMENDMENT, ADDITIVE] the DERIVATION PACKET at experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/, its MANIFEST.yaml enumerating every readable file with its sha256, committed BEFORE any Stage A'' re-deriver is dispatched"
    - "[v3 AMENDMENT, ADDITIVE] the SEALED Stage A'' artifact over the full v3 grid (two scales, four a, 25 seeds), with its own hash and timestamp, at its own new task directory, plus the re-deriver's own attestation of exactly which files it read before sealing"
    - "[v3 AMENDMENT, ADDITIVE] per cell of BOTH readings: cycle_mass, capped_mass, capped_walks, residual_fraction, and the recorded exact satisfaction of the accounting identity sum_d b(d) + cycle_mass + capped_mass = N"
    - "[v3 AMENDMENT, ADDITIVE] per cell of BOTH readings: the count of pool entries tied at the T-th largest weight, and the symmetric-difference cardinality of the two readings' Sel_static sets"
