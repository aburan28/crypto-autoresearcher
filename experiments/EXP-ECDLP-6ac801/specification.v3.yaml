    - "N: fixed, 2^24"
    - "a: {1/16, 1/8, 3/16, 1/4}"
    - "r: fixed, 2"
    - "T_sel: fixed, T/2 = 128"
    - "seed: {1, 2, 3, 4, 5}"
    - "reading: {blind (Stage A), production (Stage B/C)}"
  independent_variables_v3: # ADDITIVE; the operative grid for v3 runs
