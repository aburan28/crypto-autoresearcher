      status: 'REQUIRED for any Stage A'''' re-derivation under this v3 contract'
      discharges: 'blocking defect D3 of DEC-20260907-4e34c5, and archive-time observations AO-2 and AO-3'
      what_the_defect_was: >-
        The Coordinator's directional prior sat in plain text in a handoff
        (ledger/handoffs/TASK-20260907-e423d5.yaml
        `review_plan.coordinator_prior`) and in a committed dispatch queue,
        and a task card named that handoff as the re-deriver's own
        `review_plan_path` -- so the re-deriver was INSTRUCTED to read the
        prior before sealing. Neither path was on any blind list.
      why_this_is_not_fixed_by_adding_two_paths_to_a_list: >-
        Three reasons, each read off the committed record.
        (i) A DENYLIST CANNOT BE SHOWN COMPLETE. It enumerates what must not
        be read out of a repository of thousands of identifier-bearing paths
        that grows every batch; "no further leak path exists" is not a
        statement any author can support, and the gate found two the previous
        author had missed.
        (ii) THE LISTS DRIFT, DEMONSTRABLY. AO-3 records that the two blind
        lists for the SAME re-derivation had already diverged, so the
        re-deriver had two answers to one question.
        (iii) IT DEPENDS ON A CONVENTION RECORDED ELSEWHERE. AO-2 records a
        direct contradiction between a contract's `not_blind_from` (two paths
        MUST be read) and a handoff's `blind_from` (those same two paths
        added), resolvable only by a convention stated in a decision record.
        A BLIND DISCIPLINE A FRESH RE-DERIVER CANNOT OBEY FROM THE TEXT IT IS
        GIVEN IS NOT A BLIND DISCIPLINE -- and that is the standard the entire
        re-seal exists to meet.
      the_mechanism: 'AN ALLOWLIST REPLACES THE DENYLIST AS AUTHORITATIVE.'
      packet_path: experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/
      the_rule_in_one_sentence: >-
        Until its own seal exists, the Stage A'' re-deriver reads EXACTLY the
        files enumerated in the packet's own MANIFEST.yaml and NOTHING ELSE
        in this repository -- not this contract, not the amendment, not a
        handoff, not a task card, not a queue, not a decision, not a run, not
        a commit message, and no output of any git history command.
      contents:
        - 'MANIFEST.yaml -- the complete readable-file list with sha256 for each, the reading rule, the seal procedure, and the declaration that the packet carries no prior and no result. IT IS THE FIRST FILE THE RE-DERIVER OPENS, so the discipline is stated in the only text the re-deriver may read.'
        - 'quantity.md -- the STATEMENT of the quantity and the parameters, quoting this contract''s `definitions` and `inputs` verbatim: the instrument, the DP predicate, the exact-basin partition, the cap and its residual accounting, pool construction, the selection weight and its tie-break, the top-T_sel share, the exact coverage, the margin, the pass-count rule, the seed set, and the interval estimator.'
        - 'deliverables.md -- what to produce and in what shape, with the joints the re-deriver owns stated WITHOUT any expectation of how any of them will come out.'
        - 'prohibitions.md -- the reading rule as an operational checklist, including the two mechanical prohibitions (no git log/show/blame; no reading of any commit message before the seal) and the honest disclosure that two commit messages already reachable on the authoring branch state a prior cell''s verdict.'
      why_it_is_the_repair:
        - 'FINITE, ENUMERATED AND HASHED. Completeness is a property of a closed four-file list, not a claim about a repository. "Did I read something I should not have" becomes decidable by the re-deriver itself.'
        - 'SELF-CONTAINED. The manifest lives inside the packet and is read first, so the discipline depends on no convention recorded in a decision record -- which is AO-2''s failure and the sharpest form of D3.'
        - 'LEAK-FREE BY CONSTRUCTION AND CHECKABLY SO. The packet contains no prior, no verdict, no pass-count, no margin, no interval and no number produced by any prior run at any cell of the quantity under test. It is not merely asserted clean: it is four files a gate reads end to end.'
        - 'IT DISSOLVES AO-2 RATHER THAN ADJUDICATING IT. Under an allowlist there is no file the re-deriver is both required and forbidden to read, because "forbidden" is the complement of the list.'
        - 'IT MAKES ONE LIST AUTHORITATIVE WITHOUT EDITING A FROZEN FIELD. `blind_from` above stays byte-identical and is demoted to CORROBORATING; see `precedence` below.'
      precedence: >-
        WHERE THE PACKET AND ANY DENYLIST COULD DIFFER, THE PACKET GOVERNS
        for the question "may I read this before my seal". `blind_from`
        above, and any future review plan's `blind_from` for this experiment,
        are CORROBORATING: they warn a denylist-only reader and they may add
        paths, but they cannot widen what the packet permits, and nothing
        load-bearing turns on their contents. Two lists that cannot disagree
        about anything load-bearing cannot drift into a contradiction.
      normativity: >-
        THE CONTRACT GOVERNS ON DEFINITIONS. quantity.md quotes this
        contract's `definitions` and `inputs` verbatim and adds no
        definitional content of its own. If the packet and this contract are
        ever found to differ on any definitional point, THIS CONTRACT GOVERNS,
        the packet is defective, and the difference is a REPORTABLE DEFECT of
        amendment PA-ECDLP-6ac801-v2-to-v3 -- never a licence for the
        re-deriver to choose. Verifying that the packet says exactly what this
        contract says, and nothing more, is an explicit joint of this
        contract's approval gate.
      the_one_disclosed_inclusion: >-
        DISCLOSED RATHER THAN SMUGGLED. The packet states that T_sel = T/2 at
        a = 1/4, r = 2, N = 2^24 is ESTABLISHED G3-INFEASIBLE by
        EV-ECDLP-60e266, and that the re-deriver must report the a = 1/4 cell
        FIRST.
        WHY NECESSARY: a = 1/4 is this batch's KNOWN-FALSE OBJECT, carried
        from control (b). "Controls before belief" requires the identical
        measurement be run against an object whose answer is known, and a
        re-deriver not told which object that is cannot run the control.
        WHY BOUNDED: it concerns a = 1/4 ONLY. The packet states no verdict,
        expectation, pass-count, margin, share, coverage or interval at
        a = 1/16, a = 1/8 or a = 3/16 at either N -- and a = 1/8 is the
        decision-changing cell this lineage exists to resolve. It says what
        the instrument must REPRODUCE, not what the open cells will do.
      where_the_prior_lives_instead:
        path: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/priors/coordinator_prior.SEALED.yaml
        why_it_is_kept: >-
          AGENTS.md "Review architecture" REQUIRES the Coordinator's prior to
          be recorded before any reviewer runs: "three reviewers concurred"
          and "three reviewers concurred with what the Coordinator already
          believed" are different findings, and only a pre-recorded prior
          separates them. THE ANSWER TO A LEAKING PRIOR IS NEVER TO STOP
          RECORDING IT.
        properties:
          - 'It is NOT in the derivation packet, so under the allowlist it is unreadable before the seal without an explicit violation.'
          - 'It is named on the corroborating denylist below and must be named on every future review plan''s `blind_from` for this experiment.'
          - 'It is the ONLY place in its batch carrying a directional expectation: that lane''s queue, task cards, handoffs, opening decision and commit messages state no prior, no verdict, no margin and no number at any cell of the quantity under test.'
          - 'It is committed in the lane''s opening snapshot, so the commit that carries it is itself proof the prior predates every reviewer -- a STRONGER discharge of the AGENTS.md requirement than a prior recorded in a handoff, not a weaker one.'
        contains_no_authority: >-
          It records an expectation and nothing else: no instruction to any
          reviewer, no assignment, no authority. A reviewer's joints and
          deliverables come from the packet, which is why the packet can be
          prior-free at all.
      corroborating_denylist_v3_additions: >-
        NOT AN EDIT OF `blind_from` ABOVE, which stays byte-identical. These
        paths are additionally named here, and must be named on every future
        review plan's `blind_from` for this experiment, so that a
        denylist-only reader is warned even though the packet is what governs:
          coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/priors/
          ledger/handoffs/TASK-20260907-e423d5.yaml
          coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/
          coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/
          ledger/decisions/ (every DEC-* of this lineage)
          ledger/evidence/ (every EV-* of this lineage)
          ledger/goals/GOAL-ECDLP-bbc21f/
          experiments/EXP-ECDLP-6ac801/specification.v2.BATCH-e9fd22-proposed.yaml
          experiments/EXP-ECDLP-6ac801/amendments/
          experiments/EXP-ECDLP-6ac801/specification.v3.yaml (THIS FILE)
          coordination/experiments/EXP-ECDLP-6ac801/
        THE LIST IS NOT CLAIMED COMPLETE. That is the whole point of D3's
        repair: completeness is claimed for the ALLOWLIST, which is four
        files, and never for this.
      seal_procedure_unchanged: >-
        The seal itself is `procedure` above, byte-identical and in force: the
        re-deriver commits its own from-scratch computation to its own task
        directory with a hash and a timestamp, and only then opens anything
        outside the packet. v3 changes WHAT MAY BE READ BEFORE THE SEAL, not
        what a seal is.

    v3_rerequirement_stage_a_dprime: # ADDITIVE, v3 amendment item 12
      status: 'REQUIRED; supersedes NOTHING and re-scores NOTHING'
      scope: >-
        A FRESH Stage A'' blind re-derivation over the FULL v3 grid: N in
