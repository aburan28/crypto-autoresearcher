    - "[v3 AMENDMENT, ADDITIVE] control (h)'s reproduction table: production versus committed RUN-ECDLP-6ac801-001..005 values at N = 2^24, seeds 1..5, with the absolute deviation per quantity per cell"
    - "[v3 AMENDMENT, ADDITIVE] the gate-outcome record at experiments/EXP-ECDLP-6ac801/amendments/v2_to_v3.gate-outcome.yaml, written by the INDEPENDENT approval gate and not by this contract's author -- a required artifact of the contract's own lifecycle, without which no run under it is evidence"

  cost_model:
    measured_vs_modeled: >-
      Everything in this contract is MEASURED (exact basin enumeration, exact
      coverage, exact top-T_sel share, exact residual masses); nothing is
      modeled or extrapolated from a closed form within the stages
      themselves. THE ONE EXCEPTION, DECLARED: the W and cap table in
      `definitions` item 6 is DERIVED ARITHMETIC from two stated formulas and
      the frozen T table, computed at authoring time and reproducible by any
      reader with a calculator. It is not a measurement and is not offered as
      one. The v1/v2 `preregistered_prediction` retained by reference remains
      labelled, in its own record, an UNVERIFIED extrapolation.
    optimistic_assumptions: >-
      None beyond the standing generic-instrument assumption (HEUR-BLT-1,
      inherited, not re-tested here) that the DP-truncated functional graph
      of the walk behaves as a uniformly random function's basin partition.
      v3 adds one DISCLOSURE that is not an assumption but a limit: the cap
      truncates the partition, so every quantity in this contract is a
      quantity of the CAPPED partition, and the residual masses that
      quantifies are reported per cell rather than assumed small.
    memory_accounting: >-
      Exact basin enumeration requires O(N) working memory for the walk
      graph, charged against maximum_memory_gb: at N = 2^24 that is the
      binding scale, and N = 2^20 needs 16x less. maximum_workers stays 1, so
      only one enumeration is resident at a time.
    hidden_overhead: >-
      None beyond the enumeration cost itself; no online walks, no
      re-selection, no restart scalar multiplications in this contract. The
      four control arms are read off the SAME basin partition as the primary
      arms, so they add negligible cost beyond their own selections and
      coverage reads -- which is the reason a shape-matched null (control (i))
      is affordable at all.
    standardized_parameter_sets: >-
      N in {2^20, 2^24} only; not a costed-algorithm table (this is a
      feasibility measurement, not a COST-* record). No exponent is claimed,
      so the asymptotic promotion gates of AGENTS.md "Target result profile"
      are not engaged by this contract.

  interpretation:
    - >-
      Every conclusion this contract can license is claim_tier toy,
      constant-factor, under the KN-LIT-013 ceiling, and scoped EXACTLY to
      N = 2^24, r = 2, T_sel = T/2, a in {1/16, 1/8, 3/16, 1/4}. It says
      nothing about r in {4, 8}, about T_sel other than T/2, about the
      curve arm, or about any N other than 2^24; transfer to any of those
      is an assumption to be stated in the evidence record, never a result.
    - >-
      A CONFIRMED-FEASIBLE result at a in {1/16, 1/8} does NOT by itself
      re-open clause (C1) as a supported claim: G3-feasibility is a CEILING
      test (can a re-selected table exceed static's coverage in principle),
      not a demonstration that the LOWER-bracket online re-selection
      mechanism actually reaches that ceiling at any achievable batch size
      U. That is a SEPARATE, further question requiring its own online
      re-selection batch (a follow-up this contract does not run; see
      `out_of_scope`), exactly as the v2 contract's own G3 gate is a
      precondition for, not a substitute for, S1/F1.
    - >-
      A CONFIRMED-INFEASIBLE result at a in {1/16, 1/8} (reversing the
      N = 2^20 Stage 0 reading) is reported as a genuine N-dependence
      finding, not a retraction of the N = 2^20 numbers themselves (those
      remain confirmed at N = 2^20, per EV-ECDLP-f6b3f5); it would mean the
      ceiling itself is N-sensitive at this a-range in a way this
      hypothesis's model does not currently predict, and is routed to
      review as a model-boundary finding, not adopted unilaterally.
    - >-
      This contract cannot and does not claim any exponent moves; online
      1/3, advice 1/3, precomputation 2/3 in N are untouched by construction
      (no algorithm is run, only an exact enumeration of a fixed generic
      instrument at fixed N).
    - >-
      [v2 AMENDMENT, ADDITIVE] Once `blind_rederivation.v2_rerequirement_a_1_8`'s
      new sealed artifact exists and is compared, a = 1/8's resulting S1,
      S2, or S3 verdict is subject to EXACTLY the same interpretation
      bullets above as every other cell: in particular, even an S1
      CONFIRMED FEASIBLE outcome at a = 1/8 would remain a CEILING-
      FEASIBILITY result only, per the second bullet above, and would still
      require its own separate online RESEL-L follow-up (DEC-20260907-9b1b02
      `next_actions` RANK 2) before any hypothesis-status movement.
    - >-
      [v3 AMENDMENT, ADDITIVE] THE FIRST BULLET'S SCOPE NOW READS AT TWO
      SCALES, and neither licenses the other. A conclusion at N = 2^20 is
      scoped to N = 2^20; a conclusion at N = 2^24 is scoped to N = 2^24; and
      AGREEMENT BETWEEN THE TWO SCALES IS A CONSISTENCY OBSERVATION, NOT AN
      N-INDEPENDENCE RESULT. Two points do not establish a trend, and this
      contract's grid contains exactly two.
    - >-
      [v3 AMENDMENT, ADDITIVE] EVERY QUANTITY HERE IS A QUANTITY OF THE
      CAPPED PARTITION. The cap is cap = ceil(8*W) and the mass it leaves
      unassigned is reported per cell. A conclusion about the exact basin
      structure of the UNCAPPED functional graph is NOT licensed by this
      contract, and the direction of any difference is unmeasured.
    - >-
      [v3 AMENDMENT, ADDITIVE] SU IS NOT A WEAK S1 OR A WEAK S2. A cell
      routed to SU supports no movement in either direction and must not be
      reported, summarised or cited as "leaning" either way. Its honest
      reading is that this instrument, at this seed count and scale, does not
      separate the two.
    - >-
      [v3 AMENDMENT, ADDITIVE] AGREEMENT AT a = 1/16 IS NOT EVIDENCE OF
      INDEPENDENCE, by this contract's own ruling (`definitions` item 10),
      because two commit messages on the authoring branch state that cell's
      verdict in plain text. Any synthesis that counts a = 1/16 agreement
      toward the batch's independence claim is wrong under this contract.
    - >-
      [v3 AMENDMENT, ADDITIVE] THIS CONTRACT REPAIRS A DERIVABILITY GAP AND
      PREDICTS NO FLIP. That the approved v2 leaves cap = ceil(8*W) unstated
      is read directly off committed text. Whether that gap could change any
      cell's verdict is UNMEASURED, and the direction of any induced
      difference is unpredictable from the contract text. Nothing in this
      contract is evidence for or against G3 feasibility at any a.

  out_of_scope: >-
    Any online re-selection (RESEL-L) arm at the new a-values (a further,
    separate experiment if this contract's crossing-point finding warrants
    it); r other than 2; T_sel other than T/2 for any VERDICT (T/4 and T/8
    are READ for control (m) only and gate nothing else); N other than 2^20
    and 2^24; the curve arm; a finer a-grid than the four points named (a
    follow-up may propose one if the crossing bracket needs narrowing); any
    statement about exponents; re-litigating the a = 1/4
    mechanism-attribution question (S2_v2) already carried as an open item on
    EV-ECDLP-f6b3f5 and DEC-20260906-bcc097 RANK 2. The online RESEL-L
    follow-up remains DEC-20260907-9b1b02 `next_actions` RANK 2, a separate
    future experiment, not folded into this amendment.
    ALSO EXPLICITLY OUT OF SCOPE FOR v3: resolving the PA-ECDLP-6ac801-v1-to-v2
    identifier collision (IC-1, disposed of by DEC-20260907-b6bcf4 and not
    reopened); repairing the stale goal-head fields recorded by that decision;
    re-scoring RUN-ECDLP-6ac801-001..006 under any convention whatsoever; and
    any change to the refused sidecar draft's `revision_required` status.

  distinguishable_outcomes:
    - outcome: >-
        (a) CONFIRMED FEASIBLE: Stage A's sealed blind result AND Stage
        B/C's production result AGREE that T_sel = T/2 is G3-FEASIBLE at
        a = 1/16, at a = 1/8, or both, at N = 2^24; the a = 1/4 control
        reproduces INFEASIBLE; the crossing bracket is confirmed between
        the largest feasible a and the smallest infeasible a among
        {1/16, 1/8, 3/16}.
      means: >-
        Clause (C1) of H-ECDLP-37dc01 is REOPENED at the confirmed smaller
        a -- a materially more interesting result than anything scored in
        EV-ECDLP-f6b3f5 or EV-ECDLP-60e266. This is a CEILING-FEASIBILITY
        result only (see `interpretation`): it does NOT by itself support
        or promote the hypothesis's status, and REQUIRES its own follow-up
        (an online RESEL-L re-selection batch at the confirmed a, out of
        this contract's scope) before any hypothesis-status movement. Report
        plainly, cite this contract and its evidence record, and rank the
        follow-up per CLAUDE.md's exponent-targeting/ECC-first bias only if
        it is later shown to bear on such a mechanism (it currently does
        not: this remains a constant-factor toy-scale measurement).
    - outcome: >-
        (b) NOT CONFIRMED: Stage A's sealed blind result and Stage B/C's
        production result DISAGREE on the feasibility verdict at a = 1/16
        or a = 1/8 (or on the sign pattern beyond noise), OR the disagreement
        traces to a demonstrable units/definition mismatch between this
        contract's re-derivation and the original Stage 0 reading.
      means: >-
        The original Stage 0 discrepancy (EV-ECDLP-f6b3f5
        `unresolved_confounds`) is NOT corroborated at N = 2^24 by
        independent means. This is recorded PLAINLY as a CORRECTION to
        EV-ECDLP-f6b3f5's `unresolved_confounds` -- a new evidence record
        citing and superseding that entry's open status, per rule 2
        (records are immutable; corrections supersede, never overwrite) --
        NEVER as a silent retraction. The N = 2^20 numbers themselves stay
        exactly as confirmed in EV-ECDLP-f6b3f5 (this contract does not
        and cannot retroactively change them); what changes is whether they
        generalize to N = 2^24 and whether they survive independent
        re-derivation.
    - outcome: >-
        (c) INFRASTRUCTURE FAILURE: any run ends by timeout, crash, memory
        exhaustion, or dependency failure.
      means: >-
        Infrastructure signal only (AGENTS.md rule 5); NEVER evidence for
        or against feasibility at any a. Re-plan with a smaller shard per
        `stopping_rules`.
    - outcome: >-
        (d) INSTRUMENT MISMATCH: the a = 1/4 replication control does NOT
        reproduce EV-ECDLP-60e266's G3 FAIL (i.e. scores >= 4/5 PASS).
      means: >-
        Per `invalidation_rules`: the entire batch's instrument is in
        question; no conclusion is drawn about a in {1/16, 1/8, 3/16} until
        the mismatch (changed definition, changed seed policy, or an
        implementation defect) is understood and, if needed, repaired under
        a further versioned protocol_amendment.
    - outcome: >-
        (e) A run set is completed WITHOUT Stage A's blind re-derivation
        being sealed before the production output was opened by the same
        reviewer (a stopping-rule violation).
      means: >-
        Per `invalidation_rules`: the production reading is reported ONLY
        as an unreviewed measurement, explicitly not stronger evidence than
        the original, already-flagged Stage 0 discrepancy this contract
        exists to move past; Stage A must be genuinely re-sealed (a fresh
        reviewer, or the same reviewer with the violation disclosed and a
        judgment made about whether blindness was materially compromised)
        before any outcome (a)/(b) verdict is reported.
    - outcome: >-
        (f) [v3 AMENDMENT, ADDITIVE] CONFIRMED UNRESOLVED (SU): both
        readings AGREE on a cell's pass-count-derived verdict and on the
        sign of the mean margin, and the percentile interval of the mean
        margin STRADDLES ZERO in at least one reading.
      means: >-
        The measurement does not separate FEASIBLE from INFEASIBLE at this
        cell, at this seed count, at this scale, under this budget. THIS IS
        A STATEMENT ABOUT INSTRUMENT RESOLUTION, NOT ABOUT THE WORLD. It
        supports NO hypothesis-status movement in either direction, closes no
        lane, and must never be summarised as "leaning" either way (see
        `interpretation`). The honest successor is a larger seed set or a
        finer a-grid at that cell, proposed as its own further work -- not a
        re-reading of this one. SU never masks an S3: if the readings
        disagree, the cell is S3, per `success_criterion_v3_additions`.
