    v3_derivation_packet: # ADDITIVE, v3 amendment item 11 -- everything above this key,
                          # INCLUDING v2_rerequirement_a_1_8, is BYTE-IDENTICAL to the
                          # approved v2. This appends inside a block carrying
                          # `frozen: true` by exactly the precedent the approved v2 set
