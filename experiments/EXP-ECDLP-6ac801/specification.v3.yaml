    (N = 2^20, the scale at which the original discrepancy was found), widens
    the seed set from 5 to 25, and gates every verdict on a from-scratch
    re-derivation whose readable inputs are an enumerated packet rather than a
    prohibition list. The question is unchanged; what changes is the
    derivability of its quantities and the power of its controls.

