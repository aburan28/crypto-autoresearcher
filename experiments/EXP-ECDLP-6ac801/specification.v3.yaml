  metrics:
    primary: # CR-1 COND-3: REPRODUCED BYTE-IDENTICALLY FROM THE APPROVED v2. NOT EDITED.
      - "per (a, seed): exact top-T_sel basin share minus STATIC(T)_{r=2} exact coverage (the G3-style margin); sign and magnitude"
      - "per a: pass-count out of 5 seeds (margin >= 0); G3-style feasibility verdict (>= 4/5 -> FEASIBLE, else INFEASIBLE)"
      - "crossing bracket: the pair of adjacent a-grid values straddling the FEASIBLE/INFEASIBLE boundary, per `definitions.crossing point`"
      - "blind-vs-production agreement per (a, seed): same sign, margins within the two readings' own seed-to-seed noise; and per-a agreement on the pass-count/verdict"
      - "a = 1/4 replication control: pass-count out of 5 seeds, compared against EV-ECDLP-60e266's 5/5 FAIL at 2^24"
    secondary:
      - "exact top-T_sel share and STATIC(T)_{r=2} exact coverage individually, per (a, seed), for auditability"
      - "wall clock and peak RSS per run, for budget accounting only"
    primary_v3_additions: # ADDITIVE; `primary` above is untouched, per CR-1 COND-3
      - "per (N, a, seed): the G3-style margin, at BOTH scales, over the 25 pre-registered seeds"
      - "per (N, a): pass-count k out of 25 (margin >= 0), and the G3-style feasibility verdict by the SAME >= 4/5 proportional rule applied to 25 seeds (i.e. k >= 20); the seeds 1..5 subgroup's own pass-count out of 5 by v2's rule verbatim, reported SEPARATELY and never composited"
      - "per (N, a): mean margin over the 25 seeds and its SIGN -- the second of the two quantities blind-versus-production agreement is judged on"
      - "per (N, a): the percentile bootstrap interval of the mean margin, used ONLY to route a cell to SU; BCa reported beside it as context, gating nothing"
      - "per (N, a): cycle_mass, capped_mass, capped_walks and residual_fraction = (cycle_mass + capped_mass)/N, in BOTH readings, with the accounting identity's exact satisfaction recorded"
      - "per (N, a): the number of pool entries TIED at the T-th largest weight, and the cardinality of the symmetric difference of the two readings' Sel_static sets"
      - "per (N, a): margin_null for NULL-ORACLE-RAND (uniform, gating), its size-biased variant (diagnostic), NULL-RANDSEL (non-gating) and NULL-SHUF (diagnostic), each over the same 25 seeds"
      - "per (N, a): rho_ORACLE and the T/4 and T/8 top-share readings that control (m) evaluates"
      - "per control: FIRED or NOT FIRED, with the exact quantity and cell it was read from -- a control whose outcome is not reported counts as not run, not as passed"
    metrics_v3_note: >-
      THE VERDICT-BEARING METRICS ARE RESAMPLING-FREE BY DESIGN. The
      pass-count k is an integer and the sign of the mean margin is a sign;
      two independent implementations compute both identically or differ for
      a reason about the quantity. The only bootstrap in this contract routes
      to SU and gates nothing. This is D5's discharge, and it is why an
      interval-method disagreement between the two readings is reported as
      interval-method sensitivity rather than as S3.

  heuristic_under_test: null
  heuristic_note: >-
    UNCHANGED from v1/v2: this contract does not validate or re-validate
    HEUR-BLT-1/2/7; it is a direct exact-enumeration measurement. HEUR-BLT-1
    (the random-function basin law) is the same standing assumption
    EXP-ECDLP-869870 and EXP-ECDLP-612fb1 already carry; nothing here adds to
    or subtracts from its own validation status. v3 ADDS NO HEURISTIC: the cap
    convention is not a heuristic but a stated implementation convention, and
    the structural argument for control (i)'s known-false direction is an
    argument about that convention's consequences, not a numbered heuristic
    this contract asks anyone to accept.

  preregistered_prediction:
    deviation_declared: >-
      THIS IS THE ONE FIELD v3 DOES NOT RESTATE VERBATIM, AND THE DEVIATION
      IS DECLARED RATHER THAN QUIET. It is NOT one of the fields CR-1 COND-3
      pins verbatim (those are `success_criterion` S1/S2/S3 and
      `metrics.primary`, both reproduced byte-identically above).
      WHY: the approved v2's `preregistered_prediction` states DIRECTIONAL
      EXPECTATIONS AND PER-SEED MARGIN VALUES at a = 1/16, a = 1/8 and
      a = 3/16. Restating them inline here would put a directional prior with
      numbers into the contract text -- the same class of leak as D3, in the
      one document a re-deriver is most likely to reach for. So v3 carries
      the v1/v2 prediction BY REFERENCE and records its own additions in a
      sealed file off the reading path.
    v1_v2_prediction_retained_by_reference: >-
      UNCHANGED AND STILL ON THE RECORD, at
      experiments/EXP-ECDLP-6ac801/specification.v2.yaml
      `preregistered_prediction` (itself byte-identical to v1's). It is
      committed, immutable and timestamped before v1's Stage B/C ran, so its
      pre-registration is intact and is not weakened by being cited rather
      than copied. v3 does not restate, revise, retract or re-score it.
    quantity: >-
      G3-style feasibility verdict (per `definitions`) at each a in
      {1/16, 1/8, 3/16, 1/4}, at N = 2^20 and at N = 2^24, r = 2,
      T_sel = T/2, over the 25 pre-registered seeds; plus the crossing
      bracket at each scale.
    v3_prediction_location:
      path: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/priors/coordinator_prior.SEALED.yaml
      what_is_there: >-
        The authoring Coordinator's expectation for the cells v3 adds, and its
        expectation of what the approval gate will find. Written and committed
        at lane opening, BEFORE any reviewer or re-deriver runs, which is what
        AGENTS.md "Review architecture" requires and why the prior is kept
        rather than deleted.
      why_not_here: >-
        Because a prior in the contract is a prior on the re-deriver's most
        natural reading path. The sealed file is NOT in the derivation packet,
        so under the allowlist it is unreadable before the seal without an
        explicit violation, and it is named on the corroborating denylist.
      pre_registration_is_intact: >-
        The seal is about WHO MAY READ IT WHEN, not about when it was fixed.
        It is committed in the lane's opening snapshot, so the commit itself
        is proof the prior predates every reviewer -- a stronger discharge of
        the pre-registration requirement than a prior recorded in a handoff a
        re-deriver is told to open.
    what_this_contract_states_about_the_open_cells: >-
      NOTHING. This contract states no expected verdict, pass-count, margin,
      margin sign, interval endpoint or crossing bracket at a = 1/16,
      a = 1/8 or a = 3/16, at either N. The single exception is the a = 1/4
      KNOWN-FALSE CONTROL ANCHOR (controls (b) and (l) clause (iii)), whose
      answer is established externally by EV-ECDLP-60e266 and which a
      re-deriver must be told in order to run the control at all -- disclosed
      here and bounded to a = 1/4.
    a_result_outside_any_expectation_is_not_a_failure: >-
      Retained from v1/v2's own framing: a result outside a predicted pattern
      is not a contract failure; it is the kind of finding this experiment
      exists to surface, reported exactly as measured.

  scale_relevance:
    tier: toy
    justification: >-
      Generic keyed-random-function instrument at N = 2^20 and N = 2^24; no
      field, no curve, no cryptographic size. Constant-factor,
      exact-enumeration statement under the same KN-LIT-013 ceiling
      H-ECDLP-37dc01 and EXP-ECDLP-612fb1 are scoped to; NO EXPONENT IS
      CLAIMED OR APPROACHED. Transfer beyond these two N and beyond this
      exact a-grid is an assumption, never a result, and must be stated per
      evidence record. v3 AMENDMENT NOTE: adding N = 2^20 does not raise the
      tier -- it LOWERS the smaller scale -- and two toy scales are still
      toy. The value of the second scale is a consistency read, not
      cryptographic relevance.
    correspondence: null

  tail_checks:
    - "The single a-grid cell with the smallest pass-count margin (closest to the 4/5 boundary), reported individually with its per-seed values."
    - "The a = 1/4 control's individual seed margins, compared side by side against EV-ECDLP-60e266's own 2^24 seed margins for consistency (not required to match seed-for-seed, since these are fresh seeds; sign and rough magnitude are the check)."
    - "[v3 ADDITIVE] The cell with the LARGEST residual_fraction, at each scale, reported individually with its cycle_mass, capped_mass and capped_walks -- because the cap is the convention this amendment exists to state, and its cost is a measured quantity of this batch, never a predicted one."
    - "[v3 ADDITIVE] The cell with the MOST pool entries tied at the T-th largest weight, with the symmetric difference of the two readings' Sel_static sets at that cell -- the sharpest available view of the tie-break convention's effect (D4)."
    - "[v3 ADDITIVE] Any cell routed to SU, reported individually with its pass-count, its mean margin and its interval, so the routing is auditable rather than a bare label."

