        the derivation packet's MANIFEST.yaml before its seal.
      means: >-
        The reading's AGREEMENT with production carries no independence
        weight for this batch; its DISAGREEMENT still does, for the same
        asymmetry reason given in the a = 1/16 independence ruling. REPORT
        IT; do not discard the reading silently and do not count it
        silently. A disclosed violation is a usable record of what was
        compromised, and the packet exists precisely so that this outcome is
        decidable by the re-deriver itself rather than discovered later by a
        gate.
    - outcome: >-
        (h) [v3 AMENDMENT, ADDITIVE] PIPELINE NON-REPRODUCTION: control (h)
        fires -- the production reading deviates from the committed
        RUN-ECDLP-6ac801-001..005 values at N = 2^24, seeds 1..5, by more
